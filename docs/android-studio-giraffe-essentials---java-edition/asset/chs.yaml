  \n# 2. 设置 Android Studio 开发环境\n\n在开始开发 Android 应用之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装\
  \ Android Studio 集成开发环境（IDE）、Android 软件开发包（SDK）以及 OpenJDK Java 开发环境。\n\n本章将介绍在 Windows、macOS\
  \ 和基于 Linux 的系统上安装 Android 应用开发所需组件的步骤。\n\n## 2.1 系统要求\n\nAndroid 应用开发可以在以下任何类型的系统上进行：\n\
  \n- Windows 8/10/11 64 位\n- macOS 10.14 或更高版本（运行在 Intel 或 Apple 芯片设备上）\n- 带有 Intel\
  \ i5 或更高处理器的 Chrome OS 设备\n- 安装 GNU C Library (`glibc`) 版本 2.31 或更高版本的 Linux 系统\n\
  - 至少 8GB 内存\n- 约 8GB 可用磁盘空间\n- 最屏幕分辨率 1280 x 800\n\n## 2.2 下载 Android Studio 包\n\
  \n开发 Android 应用的大部分工作将使用 Android Studio 环境完成。书中的内容和示例是基于 Android Studio Giraffe\
  \ 2022.3.1，并使用 Android API 33 SDK (Tiramisu) 创建的，在编写时，这些都是最新的稳定版本。\n\n然而，Android\
  \ Studio 的更新非常频繁，因此自本书出版以来可能已经发布了更新版本。\n\n可以从主下载页下载最新版本的 Android Studio， URL 如下：\n\
  \n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果该页面提供了下载新版本 Android Studio 的说明，那么本书与软件之间可能存在差异。如果这些差异成为问题，在网络上搜索“Android Studio\
  \ Giraffe”应该提供下载旧版本的选项。或者，访问以下网页在存档中找到 Android Studio Giraffe 2022.3.1：\n\n[`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n## 2.3 安装 Android Studio\n\n下载完成后，安装 Android Studio 的具体步骤取决于执行安装的操作系统。\n\n###\
  \ 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 Android Studio 安装可执行文件（命名为 `android-studio-<version>-windows.exe`），双击它开始安装过程。如果弹出用户账户控制对话框，请点击“是”按钮。\n\
  \n一旦出现 Android Studio 安装向导，按照各个屏幕操作进行配置，以满足你的需求，包括 Android Studio 应该安装的文件系统位置，以及是否让其他系统用户可以使用。在提示选择要安装的组件时，确保勾选\
  \ Android Studio 和 Android Virtual Device（Android 虚拟设备）选项。\n\n虽然对 Android Studio\
  \ 的系统安装位置没有严格规定，但本书的其余部分将假设安装在 `C:\\Program Files\\Android\\Android Studio`，并且 Android\
  \ SDK 包已安装在用户的 `AppData\\Local\\Android\\sdk` 子文件夹中。配置好选项后，点击“安装”按钮开始安装过程。\n\n在带有开始菜单的\
  \ Windows 版本上，可以从安装期间添加到该菜单的项启动新安装的 Android Studio。可以通过进入 `Android Studio\\bin`\
  \ 目录，右键点击 `studio64` 可执行文件，并选择“固定到任务栏”菜单选项，以便于访问（在 Windows 11 上，可以通过选择菜单中的“显示更多选项”找到此选项）。\n\
  \n### 2.3.2 在 macOS 上安装\n\nmacOS 版 Android Studio 以磁盘镜像 (.dmg) 文件形式下载。下载 `android-studio-<version>-mac.dmg`\
  \ 文件后，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n![](img/as_dmg_drag_to_applications.jpg)\n\
  \n图 2-1\n\n要安装该包，将 Android Studio 图标拖到“应用程序”（Applications）文件夹。Android Studio 包将被安装到系统的应用程序文件夹中，此过程通常需要几秒钟完成。\n\
  \n要启动 Android Studio，在 Finder 窗口的应用程序文件夹中找到可执行文件并双击它。\n\n为了以后方便访问该工具，可以将 Android\
  \ Studio 图标从 Finder 窗口拖动并释放到 Dock 上。\n\n### 2.3.3 在 Linux 上安装\n\n下载 Linux 版 Android\
  \ Studio 包后，打开终端窗口，切换到要安装 Android Studio 的位置，执行以下命令：\n\n```bash\ntar xvfz /<path\
  \ to package>/android-studio-<version>-linux.tar.gz\n```\n\n注意，Android Studio 程序包将安装到名为\
  \ `android-studio` 的子目录。因此，假设上述命令在 `/home/demo` 中执行，软件包将解压到 `/home/demo/android-studio`。\n\
  \n要启动 Android Studio，打开终端窗口，切换到 `android-studio/bin` 子目录，执行以下命令：\n\n```bash\n./studio.sh\n\
  ```\n\n## 2.4 Android Studio 安装向导\n\n如果你之前安装过早期版本的 Android Studio，首次启动此新版本时可能会弹出一个对话框，提供从以前版本导入设置的选项。如果你有以前版本的设置并想将其导入最新安装中，请选择相应的选项和位置。或者，指示你不需要导入之前的设置并点击“确定”按钮继续。\n\
  \n如果你是第一次安装 Android Studio，启动设置后出现的初始对话框可能像下面的图 2-2 所示：\n\n![](img/as_setup_wizard.jpg)\n\
  \n图 2-2\n\n如果出现此对话框，点击“下一步”按钮显示安装类型屏幕（图 2-3）。在此屏幕上，在点击“下一步”之前选择“标准”安装选项。\n\n![](img/as_setup_install_type.jpg)\n\
  \n图 2-3\n\n在“选择 UI 主题”屏幕上，根据喜好选择 Darcula（深色）或 Light（浅色）主题。做出选择后点击“下一步”，并在“验证设置”屏幕上检查选项，然后进入“许可协议”屏幕。选择每个许可类别并启用“接受”复选框。最后，点击“完成”启动安装。\n\
  \n完成这些初始设置步骤后，点击“完成”按钮显示使用你所选 UI 主题的“欢迎使用 Android Studio”界面：\n\n![](img/as_giraffe_welcome.jpg)\n\
  \n图 2-4\n\n## 2.5 安装额外的 Android SDK 包\n\n到目前为止的操作安装了 Android Studio IDE 和当前默认的 Android\
  \ SDK 包集。在继续之前，值得花时间检查已安装了哪些包，并安装任何缺失或更新的包。\n\n\n\n\n\n此任务可以通过点击欢迎对话框中的 `More Actions`\
  \ 链接并从下拉菜单中选择 `SDK Manager` 选项来完成。一旦调用，设置对话框的 Android SDK 屏幕将会出现，如图 2-5 所示：\n\n\
  ![](img/as_sdk_manager.jpg)\n\n图 2-5\n\nGoogle 为每个版本的 Android Studio 配配了一个最高支持的\
  \ Android SDK 应用程序编程接口 (API) 级别。对于 Android Studio Giraffe，该版本是 Android Tiramisu\
  \ (API Level 33)。可以通过以下链接确认此信息：\n\n[`developer.android.com/studio/releases#api-level-support`](https://developer.android.com/studio/releases#api-level-support)\n\
  \n在首次安装 Android Studio 之后，可能只安装了最新版本的 Android SDK。若要安装旧版本的 Android SDK，请选择对应版本的复选框并点击\
  \ `Apply` 按钮。本书的其余部分假设已安装了 Android Tiramisu (API Level 33) SDK。\n\n书中的大多数示例将支持低至\
  \ Android 8.0 (Oreo) 的旧版本 Android。这确保了应用可以在广泛的 Android 设备上运行。在 SDK 版本列表中，勾选 Android\
  \ 8.0 (Oreo) 旁的复选框并点击 `Apply` 按钮。在生成的确认对话框中点击 `OK` 按钮安装 SDK。随后的对话框将在执行安装前要求接受许可协议和条款。安装完成后，点击\
  \ `Finish`。\n\n可能还会列出最新 SDK 有可用更新。要访问有关准备好更新的包的详细信息，请启用屏幕右下角的 `Show Package Details`\
  \ 选项。这将显示与图 2-6 所示类似的信息：\n\n![](img/as_sdk_manager_update_available.jpg)\n\n图 2-6\n\
  \n上图强调了更新的可用性。要安装更新，勾选项目名称左侧的复选框并点击 `Apply` 按钮。\n\n除了 Android SDK 包外，还安装了几个用于构建\
  \ Android 应用程序的工具。要查看当前安装的包并检查更新，请留在 SDK 设置屏幕，并选择 `SDK Tools` 标签页，如图 2-7 所示：\n\n\
  ![](img/as_sdk_manager_tools.jpg)\n\n图 2-7\n\n在 Android SDK Tools 屏幕中，确保以下包在 `Status`\
  \ 列中均显示为 `Installed`：\n\n* Android SDK Build-tools\n* Android Emulator\n* Android\
  \ SDK Platform-tools\n* Google Play Services\n* Intel x86 Emulator Accelerator (HAXM\
  \ installer)\n* Google USB Driver (仅限 Windows)\n* Layout Inspector image server\
  \ for API 31 and 34\n\n*注意，Intel x86 Emulator Accelerator (HAXM installer) 安装在基于\
  \ Apple 芯片的 Mac 上。*\n\n如果上述任何包被列为 `Not Installed` 或需要更新，请选择这些包旁边的复选框并点击 `Apply`\
  \ 按钮启动安装过程。如果出现 HAXM 模拟器设置对话框，请选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n\n图 2-8\n\
  \n安装完成后，检查包列表并确保所选包在 `Status` 列中被列为 `Installed`。如果有任何包被列为 `Not installed`，请确保已勾选它们并再次点击\
  \ `Apply` 按钮。\n\n## 2.6 安装 Android SDK 命令行工具\n\nAndroid Studio 包含了允许从您的操作系统命令行执行某些任务的工具。若要在您的系统上安装这些工具，请打开\
  \ `SDK Manager`，选择 `SDK Tools` 标签页，并如图 2-9 所示找到 `Android SDK Command-line Tools\
  \ (latest)` 包：\n\n![](img/as_install_cmd_line_tools.jpg)\n\n图 2-9\n\n如果命令行工具包尚未安装，请启用它（勾选）并点击\
  \ `Apply`，然后点击 `OK` 完成安装。安装完成后，点击 `Finish` 并关闭 `SDK Manager` 对话框。\n\n为了让您正在开发的操作系统能够找到这些工具，有必要将它们添加到系统的\
  \ `PATH` 环境变量中。\n\n无论使用何种操作系统，您都需要配置 `PATH` 环境变量以包含以下路径（其中 `<path_to_android_sdk_installation>`\
  \ 代表您安装 Android SDK 的文件系统位置）：\n\n`<path_to_android_sdk_installation>/sdk/cmdline-tools/latest/bin`\n\
  \n`<path_to_android_sdk_installation>/sdk/platform-tools`\n\n您可以通过启动 `SDK Manager`\
  \ 并参考设置面板顶部的 `Android SDK Location:` 字段来识别 SDK 在系统上的位置，如图 2-10 所示：\n\n![](img/as_sdk_location.jpg)\n\
  \n图 2-10\n\n一旦确定了 SDK 的位置，将此添加到 `PATH` 变量的步骤取决于操作系统：\n\n### 2.6.1 Windows 8.1\n\n\
  1. 在开始屏幕上，将鼠标移动到屏幕右下角，从生成的菜单中选择 `Search`。在搜索框中输入 `Control Panel`。当 `Control Panel`\
  \ 图标出现在结果中时，点击它进入桌面。\n2. 在控制面板中，使用 `Category` 菜单将显示方式改为 `Large Icons`。从图标列表中选择 `System`。\n\
  3. 在 `Environment Variables` 对话框中，在 `System variables` 找到 `Path` 变量，选择它并点击 `Edit`\
  \ 按钮。在编辑对话框中，使用 `New` 按钮添加新项。例如，假设 SDK 安装在 `C:\\Users\\demo\\Android\\Sdk`，则需要添加以下项：\n\
  \   `C:\\Users\\demo\\Android\\Sdk\\cmdline-tools/latest\\bin`\n   `C:\\Users\\\
  demo\\Android\\Sdk\\platform-tools`\n4. 在每个对话框中点击 `OK` 并关闭系统属性控制面板。\n\n通过按下键盘上的\
  \ `Windows + R` 在 `运行` 对话框中输入 `cmd` 打开命令提示符窗口。在窗口输入 `echo %Path%`\n\n返回的路径变量应包含\
  \ SDK 工具的路径。通过尝试运行 `adb` 工具来验证 `platform-tools` 值：\n\n`adb`\n\n执行后，该工具将输出选项列表。同样，通过尝试运行\
  \ AVD 命令行工具来检查工具路径（如果 `avdmanager` 工具报告 Java 问题，稍后会处理）：\n\n`avdmanager`\n\n如果其中一个或两个命令出现类似下面的消息，最可能是在\
  \ `PATH` 环境变量中添加了错误的路径：\n\n`'adb' is not recognized as an internal or external command,\
  \ operable program or batch file.`\n\n### 2.6.2 Windows 10\n\n1. 右键点击 `Start` 菜单，从生成的菜单中选择\
  \ `Settings`，并在 `Find a setting` 字段中输入 `Edit the system environment variables`。在\
  \ `System Properties` 对话框中，点击 `Environment Variables...` 按钮。按照 Windows 8.1 的第 3\
  \ 步操作。\n\n### 2.6.3 Windows 11\n\n1. 右键点击任务栏上的 `Start` 图标，从生成的菜单中选择 `Settings`。当\
  \ `Settings` 对话框出现时，滚动列表并选择 `About`。在 `About` 屏幕上，从 `Related links` 选择 `Advanced\
  \ system settings`。按照 Windows 8.1 的第 3 步操作。\n\n### 2.6.4 Linux\n\n\n\n\n在 Linux\
  \ 上，可以通过向用户家目录下的 `.bashrc` 文件中添加命令来实现此配置（具体细节可能取决于所使用的特定 Linux 发行版）。假设 Android SDK\
  \ 压缩包安装在 `/home/demo/Android/sdk`，则 `.bashrc` 文件中的 `export` 行如下：\n\n```\nexport\
  \ PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/cmdline-tools/latest/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n请注意，上述命令将 `android-studio/bin` 目录添加到了 `PATH` 变量中。这将使得无论在终端窗口的哪个目录下，都可以执行\
  \ `studio.sh` 脚本。\n\n### 2.6.5 macOS\n\n可以使用多种技术来修改 macOS 上的 `$PATH` 环境变量。认为最干净的方法是在\
  \ `/etc/paths.d` 目录中创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 的安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录中创建一个名为 `android-sdk` 的新文件并包含以下行来配置路径：\n\n```\n/Users/demo/Library/Android/sdk/cmdline-tools/latest/bin\n\
  /Users/demo/Library/Android/sdk/platform-tools\n```\n\n注意，由于这是一个系统目录，在创建文件时需要使用\
  \ `sudo` 命令。例如：\n\n```\nsudo vi /etc/paths.d/android-sdk\n```\n\n### 2.7 Android\
  \ Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的软件应用程序，具有许多后台进程。虽然 Android Studio 在过去曾因性能不佳而受到批评，但\
  \ Google 在最近的发布中对其进行了重大的性能改进，并在每个新版本中持续改进。这些改进包括允许用户配置 Android Studio IDE 以及用于构建和运行应用程序的后台进程所使用的内存。这让软件能够利用具有更大\
  \ RAM 的系统。\n\n如果你在运行 Android Studio 的系统上有足够的空闲 RAM 能够增加这些值（此功能仅适用于具有 5GB 或更多 RAM\
  \ 的 64 位系统），并且发现 Android Studio 的性能似乎有所下降，那么尝试这些内存设置可能是值得的。Android Studio 还可能通过类似于下所示的对话框通知你提高性能：\n\
  \n![](img/as_3.5_increase_memory_notification.jpg)\n\n图 2-11\n\n要查看并修改当前的内存配置，选择主菜单选项\
  \ `File -> Settings...`（macOS 上为 `Android Studio -> Settings...`），并在弹出的对话框中，选择左侧导航面板中的\
  \ `Appearance & Behavior`，然后选择 `System Settings` 下的 `Memory Settings` ，如下方的图 2-12\
  \ 所示：\n\n![](img/as_memory_settings.jpg)\n\n图 2-12\n\n在更改内存分配时，请确保不要分配超过所需的内存，或超过系统在不减慢其他进程的情况下所承受的内存。\n\
  \nIDE 堆内存大小设置调整分配给 Android Studio 的内存，且不限于当前加载的项目。另一方面，当从 Android Studio 内部构建和运行项目时，会有几个后台进程（称为守护进程\
  \ daemon）执行编译和运行程序的任务。在编译和运行大型复杂项目时，可以通过调整守护进程堆设置来改进构建时间。与 IDE 堆内存设置不同，这些守护进程设置仅适用于当前项目，并且只有在\
  \ Android Studio 中打开项目时才能访问。要在打开的项目内部显示 SDK Manager，请从主菜单选择 `Tools -> SDK Manager...`\
  \ 菜单选项。\n\n### 2.8 更新 Android Studio 和 SDK\n\nAndroid Studio 和 Android SDK 会定期发布新版本。新版本的\
  \ SDK 使用 Android SDK Manager 安装。当有更新可用安装时，Android Studio 通常会通知你。\n\n要手动检查 Android\
  \ Studio 的更新，请使用 Android Studio 主窗口的 `Help -> Check for Updates...` 菜单选项（macOS 上为\
  \ `Android Studio -> Check for Updates...`）。\n\n### 2.9 总结\n\n在开始开发基于 Android 的应用程序之前，第一步是搭建合适的开发环境。这由\
  \ Android SDK 和 Android Studio IDE（包含 OpenJDK 开发环境）组成。本章涵盖了在 Windows、macOS 和 Linux\
  \ 上安装这些包的必要步骤。\n\n# 3 在 Android Studio 中创建示例 Android 应用程序\n\n本书的前几个章节已经涵盖了使用 Android\
  \ Studio IDE 配置适用于 Android 应用程序开发的环境所需的必要步骤。在进入稍高级的主题之前，现在是验证所有所需的开发包已正确安装并运行良好的好机。实现这一目标的最佳方法是创建一个\
  \ Android 应用程序并对其进行编译和运行。本章将涵盖使用 Android Studio 创建 Android 应用程序项目。一旦项目创建，随后的章节将探索使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n### 3.1 关于项目\n\n在本章创建的项目是一个原始的货币汇率转换器（事实上它非常简单，只将美元转换为欧元，并使用估算的汇率进行转换）。该项目还将使用最基础的\
  \ Android Studio 项目模板之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因一次性引入过多的概念（例如推荐的应用架构和\
  \ Android 架构组件）让初学者无所适从。在遵循本章的教程时，请放心在本初始示例项目中使用的技术和代码将在稍后更详细地介绍。\n\n### 3.2 创建新项目\n\
  \n应用程序开发过程的第一步是在 Android Studio 环境中创建项目。因此，首先通过启动 Android Studio，使“欢迎来到 Android\
  \ Studio”屏幕如图 3-1 所示：\n\n![](img/as_giraffe_welcome1.jpg)\n\n图 3-1\n\n一旦此窗口，Android\
  \ Studio 就准备好创建新项目。要创建新项目，点击 `New Project` 选项以显示新项目向导的第一个屏幕。\n\n### 3.3 创建 Activity\n\
  \n下一步是为应用程序定义初始 Activity 的类型。提供了创建手机和平板、Wear OS、电视或汽车项目的选项。在开发 Android 应用程序时有许多\
  \ Activity 类型，其中许多将在后面的章节中详细介绍。但对于本示例，请从模板面板中选择 `Phone and Tablet` 选项，然后选择创建 `Empty\
  \ Views Activity`。`Empty Views Activity` 选项创建一个包含单个 `TextView` 模板用户界面。\n\n![](img/as_new_project_template.jpg)\n\
  \n图 3-2\n\n选择 `Empty Views Activity` 后，点击 Next 继续项目配置。\n\n### 3.4 定义项目和 SDK 设置\n\
  \n在项目配置窗口（图 3-3）中，将 `Name` 字段设置为 `AndroidSample`。应用程序名称是在 Android Studio 内部引用和标识应用程序的名称，如果完成的应用程序要在\
  \ Google Play 商店销售，这也是使用的名称。\n\n\n\n\n`Package` 名称在 Android 应用生态系统中用于唯一标识该应用程序。虽然它可以设置为任何能够唯一标识你应用程序的字符串，但传统上它是基于你域名的反转\
  \ URL 加上应用程序名称。例如，如果你的域名是 `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n`com.mycompany.androidsample`\n\n如果你没有域名，可以在 `Company Domain` 字段中输入任何其他字符串，或者使用\
  \ `example.com` 进行测试，但在发布应用程序之前需要将其更改：\n\n`com.example.androidsample`\n\n`Save location`\
  \ 设置将默认指向位于你主目录下的名为 `AndroidStudioProjects` 文件夹中的位置，你可以通过点击包含当前路径设置的文本框右侧的文件夹图标来更改它。\n\
  \n将 `minimum SDK` 设置为 `API 26`（Oreo; Android 8.0）。除非某些功能仅在较新版本中可用，否则本书中创建的大多数项目将使用此最小\
  \ SDK。这里的目标是使用最新的 Android SDK 构建应用，同时保持对运行旧版本 Android 的设备（在本例中为 Android 8.0）的兼容性。`Minimum\
  \ SDK` 设置下方的文字将概述当前运行该应用程序的 Android 设备百分比。点击 `Help me choose` 按钮（在图 3-3 中突出显示）查看仍在使用的各种\
  \ Android 版本的详细列表：\n\n![](img/as_java_project_settings.jpg)\n\n图 3-3\n\n最后，将 `Language`\
  \ 菜单更改为 `Java`，并在点击 Finish 创建项目之前选择 `Kotlin DSL (build.gradle.kts)` 作为构建配置语言。\n\n\
  ## 3.5 启用新的 Android Studio UI\n\nAndroid Studio 正在向全新的现代用户界面过渡，该界面在 `Giraffe` 版本中默认未启用。如果你安装的\
  \ Android Studio 类似于下方的图 3-4，那么你需要在继续操作之前启用新 UI：\n\n![](img/as_4.1_main_window.jpg)\n\
  \n图 3-4\n\n通过选择 `File` -> `Settings...` 菜单选项（macOS 上为 `Android Studio` -> `Settings...`）并在左侧面板的\
  \ `Appearance and Behavior` 下选择 `New UI`选项来启用新 UI。在主面板中，开启 `Enable new UI` 复选框，然后点击\
  \ `Apply`，最后点击 `OK` 提交更改：\n\n![](img/as_enable_new_ui.jpg)\n\n图 3-5\n\n在提示时，重启 Android\
  \ Studio 以激活新的用户界面。\n\n## 3.6 修改示例应用程序\n\n一旦 Android Studio 重启，主窗口将使用新 UI 重新出现，并包含如下方的图\
  \ 3-6 所示所示的 `AndroidSample` 项目：\n\n![](img/as_android_sample_main_java.jpg)\n\n\
  图 3-\n\n新创建的项目以及对相关文件的引用列在主项目窗口左侧的 `Project` 工具窗口中。`Project` 工具窗口有多种可以显示信息的模式。默认情况下，此面板应处于\
  \ `Android` 模式。此设置由面板顶部的菜单控制，如图 3-7 中突出显示所示。如果面板当前不在 `Android` 模式，请使用菜单切换模式：\n\n\
  ![](img/as_project_tool_window_menu.jpg)\n\n图 3-7\n\n## 3.7 修改用户界面\n\n我们 activity\
  \ 的用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于 `Project` 工具窗口文件层级结构的 `app -> res\
  \ -> layout` 下。在 `Project` 工具窗口中找到该文件后，双击将其加载到用户界面 `Layout Editor` 工具中，该工具将出现在 Android\
  \ Studio 主窗口的中间面板：\n\n![](img/as_layout_editor.jpg)\n\n图 3-8\n\n`Layout Editor`\
  \ 窗口顶部工具栏上有一个菜单（在上面的图中设置为 `Pixel`），它会反映在 `Layout Editor` 面板中设备的视觉表示上。点击此菜单可以使用一系列其他设备选项。\n\
  \n使用 `System UI Mode` 按钮 ![](img/as_night_mode_button.jpg) 为设备屏幕布局开启或关闭夜间模式（Night\
  \ mode）。要在设备表示的横屏和竖屏之间切换，请使用显示 ![](img/as_rotate_button.jpg) 图标的下拉菜单。\n\n正如我们在设备屏幕中看到的，内容布局已经包含一个显示“Hello\
  \ World!”消息的标签。面板左侧运行的是调色板，其中包含不同类别的用户界面组件，这些组件可用于构建用户界面，例如按钮、标签和文本字段。然而，需要注意的是并不是所有的用户界面组件对用户都是可见的。其中一类是布局。Android\
  \ 支持多种布局，它们对视觉用户界面组件在屏幕上的定位和管理方式提供不同程度的控制。虽然从用户界面的视觉表示很难判断，但当前设计是使用 `ConstraintLayout`\
  \ 创建的。可以通过查看 `Component Tree` 面板中的信息来确认，该面板默认位于 `Layout Editor` 的左下角，如图 3-9 所示：\n\
  \n![](img/as_component_tree.jpg)\n\n图 3-9\n\n从组件树可以看出，布局由一个 `ConstraintLayout` 父级和一个\
  \ `TextView` 子组成。在继续之前，检查 `Layout Editor` 的 `Autnect` 模式是否启用。这意味着在添加组件时，`Layout\
  \ Editor` 将自动添加约束，以确保组件在不同尺寸下正确放置（该主题将在后续章节中详细介绍）。`Autnect` 按钮出现在 `Layout Editor`\
  \ 工具栏中，用 U 形图标表示。当禁用时，图标上有一条斜线（见图 3-10）。如有必要，点击此按钮重新启用 `Autnect` 模式。\n\n![](img/as_autoconnect_disabled.jpg)\n\
  \n图 3-10\n\n修改应用程序的下一步是向布局添加一些额外的组件，第一个是用户点击以启动货币转换。\n\n`Palette` 面板由两列组成，左列包含视图组件类别列表。右列列出当前选择类别中的组件。例如，在图\
  \ 3-11 中，`Buttons` 类别中选择了 `Button` 视图：\n\n![](img/as_palette_button_selected.jpg)\n\
  \n图 3-11\n\n从 `Buttons` 列表中点击并拖动 `Button` 对象，将其放置在用户界面设计的水平中心，使其位于现有 `TextView`\
  \ 组件下方：\n\n![](img/as_android_sample_button.jpg)\n\n图 3--\n\n下一步是更改 `Button` 组件当前显示的文本。位于设计区域右侧的面板是\
  \ `Attributes` 面板。该面板显示分配给布局中所选组件的属性。在此面板中，在 `Common Attributes` 部分找到 `text` 属性，并将当前值从“Button”更改为“Convert”，如图\
  \ 3-13 所示：\n\n![](img/as_android_sample_button_text.jpg)\n\n图 3-13\n\n\n\n\n\n旁旁带有扳手图标的第二个文本属性允许设置文本属性，该属性仅在\
  \ `Layout Editor`（布局编辑器）工具中显示，而在运行时不会显示。这对于测试视觉组件和布局在不同设置下的表现非常有用，而无需反复运行应用程序。\n\
  \n为了以防自动连接系统（Autoconnect）未设置所有布局连接，请点击 `Infer Constraints`（推断约束）按钮（图 3-14）为布局添加任何缺失的约束：\n\
  \n![](img/as_infer_constraints.jpg)\n\n图 3-14\n\n有必要解释 `Layout Editor` 工具右上角的警告按钮，如图图\
  \ 3-15 所示。该警告表示布局可能存在问题。要查看任何问题的详情，请点击该按钮：\n\n![](img/as_layout_warnings.jpg)\n\n\
  图 3-15\n\n点击后，将出现 `Problems`（问题）工具窗口（图 3-16），描述问题的性质：\n\n![](img/as_problems_tool_window.jpg)\n\
  \n图 3-16\n\n此工具窗口分为两个面板。左侧面板（上图标记为 A）列出了布局文件中检测到的问题。在我们的示例中，仅列出了以下问题：\n\nbutton\
  \ <`Button`: Hardcoded text\n\n当从列表中选择一项 (B) 时，右侧面板将更新并提供有关问题的额外细节 (C)。在这种情况下，解释内容如下：\n\
  \n硬编码字符串 \"Convert\"，应使用 @string 资源\n\n该工具窗口还包含一个预览编辑器 (D)，允许对布局文件进行手动修正。\n\n此 I18N\
  \ 消息告诉我们，项目未来的国际化可能存在潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有 18 个字母）。由于该警告提醒我们，在开发\
  \ Android 应用程序时，应尽可能将文本字符串等属性和值存储为资源。这样做可以使其通过修改资源文件来更改应用程序的外观，而无需更改应用程序源代码。这在将用户界面翻译成不同的口语语言时尤为有价值。如果用户界面中的所有文本都包含在一个资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件以包含应用程序中。这使得可以在不进行任何源码更改的情况下针对多种语言。在此实例中，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击 `Show Quick Fixes`（显示快速修复）按钮 (E)\
  \ 并从菜单中选择 `Extract string resource`（提取字符串资源）选项，如图图 3-17 所示：\n\n![](img/as_problems_extract_button.jpg)\n\
  \n图 3-17\n\n选择此选项后，将出现 `Extract Resource`（提取资源）面板（图 3-18）。在此面板中，将资源名称字段更改为 `convert_string`，并在点击\
  \ `OK` 按钮之前，将资源值设置为 `Convert`：\n\n![](img/as_extract_resource.jpg)\n\n图 3-18\n\n\
  要添加的下一个部件是 `EditText` Widget，用户将在其中输入要转换的美元金额。从 `Palette` 面板中选择 `Text` 类别，点击并将 `Number\
  \ (Decimal)` 组件拖到布局中，使其水平居中并置于现有 `TextView` 部件上方。选中该部件后，使用 `Attributes`（属性）工具窗口将\
  \ `hint` 属性设置为“dollars”。点击警告图标并将字符串提取为名为 `dollars_hint` 的资源。\n\n在本章稍后编写的代码将需要访问用户输入到\
  \ `EditText` 字段中的美元金额。它将通过引用分配给用户界面布局中部件的 `id` 来实现。当在布局中选中部件时，可以在 `Attributes` 工具窗口查看并更改\
  \ Android Studio 分配给部件的默认 `id`，如图图 3-19 所示：\n\n![](img/as_widget_id.jpg)\n\n图 3-19\n\
  \n将 `id` 更改为 `dollarText`，并在 `Rename`（重命名）对话框中点击 `Refactor`（重构）按钮。这确保项目其他地方对旧 `id`\
  \ 的任何引用都会自动更新为使用新 `id`：\n\n![](img/as_rename_id_dialog.jpg)\n\n图 3-20\n\n如有必要，重复步骤将\
  \ `TextView` 部件的 `id` 设置为 `textView`。\n\n点击 `Infer Constraints` 按钮添加任何缺失的布局约束。此时，布局应该类似于图\
  \ 3-21 所示所示：\n\n![](img/as_android_sample_ui.jpg)\n\n图 3-21\n\n## 3.8 审查布局和资源文件\n\
  \n在继续后续步骤之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用 `Layout Editor` 工具修改 `activity_main.xml`\
  \ 文件更改了用户界面。事实上，`Layout Editor` 所做的只是提供了一种易于操作的方式来编辑底层 XML。在实践中，没有理由不直接修改 XML 来进行用户界面更改，在某些情况下，这比使用\
  \ `Layout Editor` 工具更快。在 `Layout Editor` 面的右上角是 `View Modes` 菜单，如图图 3-22 所示，标记为\
  \ A：\n\n![](img/view_mode.jpg)\n\n图 3-22\n\n默认情况下，编辑器将处于 `Design` 模式，显示布局的视觉表示。在\
  \ `Code` 模式下，编辑器将显示布局的 XML，而在 `Split` 模式下，则显示布局和 XML，如图图 3-23 所示：\n\n![](img/layout_editor_split_mode.jpg)\n\
  \n图 3-23\n\n`View Modes` 按钮左侧的按钮（如上图图 3-22 中标记的 B）用于快速在 `Code` 和 `Split` 模式之间切换。\n\
  \n从 XML 文件的结构可以看出，用户界面由 `ConstraintLayout` 组件组成，它是 `TextView`、`Button` 和 `EditText`\
  \ 对象的父级。我们还可以看到，例如 `Button` 的 `text` 属性设置为我们的 `convert_string`资源。尽管复杂性不同，但所有用户界面都是这种基于\
  \ XML 的结构。\n\n对 XML 进行更改时，这些更改将反映在布局中。也可以在布局画布内部对布局进行视觉修改，更改将出现在 XML 列表中。为了看到此效果，切换到\
  \ `Split` 模式并修改 XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\"\n    android:background=\"#ff2438\" >\n\n.\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意布局颜色实时变化以匹配 XML 文件中的新设置。注意在 XML 编辑器的左侧边缘（也称为列），包含颜色设置的行旁边会出现一个小红色方块。这是一个视觉提示，表示已属性上设置了红色。点击红色方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_layout_editor_color_selector.jpg)\n\n图 3-24\n\n\n\n在继续之前，请从布局文件中删除\
  \ `background` 属性，以便背景恢复到默认设置。\n\n最后，使用 `Project` 面板找到 `app -> res -> values ->\
  \ strings.xml` 文件并双击它将其加载到编辑器中。目前，XML 的内容如下：\n\n```xml\n<resources>\n    <string\
  \ name=\"app_name\">AndroidSample</string>\n    <string name=\"convert_string\"\
  >Convert</string>\n    <string name=\"dollars_hint\">dollars</string>\n</resources>\n\
  ```\n\n为了演示资源的实际效果，将当前分配给 `convert_string` 资源的字符串值更改为“Convert to Euros”（转换为欧元），然后通过选择编辑器面板中布局文件的标签页返回\
  \ `Layout Editor`（布局编辑器）工具。注意，布局已经获取了该字符串的新资源值。\n\n还有一种快速方法可以访问 XML 文件中引用资源的值。在\
  \ `Layout Editor` 工具的 `Split`（分屏）或 `Code`（代码）模式下，点击 `@string/convert_string` 属性设置使其高亮显示，然后按下键盘上的\
  \ `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后将打开 `strings.xml` 文件并带您到该文件中声明此资源的行。利用此机会将字符串资源恢复为原始的“Convert”文本，并添加以下额外的字符串资源项，该项将在后的应用代码中被引用：\n\
  \n```xml\n<resources>\n.\n.\n    <string name=\"convert_string\">Convert</string>\n\
  \    <string name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\"\
  >No Value</string>\n</resources>\n```\n\n也可以通过 Android Studio `Translations Editor`（翻译编辑器）编辑资源字符串，只需点击编辑器窗口右上角的\
  \ `Open editor` 链接。将在 Android Studio 窗口的主面板中显示翻译编辑器：\n\n![](img/as_translations_editor.jpg)\n\
  \n图 3-25\n\n此编辑器允许编辑分配给资源键的字符串，并管理多种语言的翻译。\n\n## 3.9 添加交互功能\n\n此示例项目的最后一步是使应用程序具有交互性，以便当用户在\
  \ `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在 `TextView` 上。这涉及对 `Button` 控件实现一些事件处理。具体来说，需要配置\
  \ `Button`，以便在触发 `onClick` 事件时调用应用代码中的一个方法。事件处理可以通过多种方式实现，将在后续标题为“#Android 事件处理概述与示例””的章节中介绍。返回布局编辑器的\
  \ `Design`（设计）模式，在布局编辑器中选择 `Button` 组件，参考 `Attributes`（属性）工具窗口，并按所示指定名为 `convertCurrency`\
  \ 的方法：\n\n![](img/as_onclick_attribute.jpg)\n\n图 3-26\n\n接下来，在 `Project` 工具窗口中双击\
  \ `MainActivity.java` 文件（`app -> java -> <package name> -> MainActivity`）将其加载到代码编辑器中，并在类文件中添加\
  \ `convertCurrency` 方法的代码，使其内容如下，请注意也有必要导入一些额外的 Android 包：\n\n```java\npackage com.ebookfrenzy.androidsample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.view.View;\nimport android.widget.EditText;\nimport android.widget.TextView;\n\
  \n.\n.\nimport java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n该方法首先通过调用名为 `findViewById` 的方法并传递布局文件中分配的 ID 来获取 `EditText`\
  \ 和 `TextView` 对象的引用。然后会检查用户是否输入了美元值，如果是，则提取该值，将其从 `String` 转换为浮点值，并转换为欧元。最后，结果显示在\
  \ `TextView` 控件上。\n\n如果以上内容有任何不清楚的地方，请放心，后续章节将详细介绍这些概念。特别是从代码内部使用 `findByViewId`\
  \ 访问控件的主题，以及对 `view binding`（视图绑定）替代技术的介绍，将在标题为“#Android 视图绑定概述”的章节中涵盖。\n\n## 3.10\
  \ 总结\n\n虽然并不复杂，但设置 Android 开发环境涉及多个步骤。在完成这些步骤后，值得运行一个示例以确保环境正确安装和配置。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探索了使用资源（特别是字符串值）的重要性，并简要接触了布局。接下来，我们查看了用于存储\
  \ Android 界面设计的 XML。\n\n最后，为 `Button` 添加了 `onClick` 事件，并连接到一个方法，以提取 `EditText` 中的输入内容，将其转换为欧元并显示在\
  \ `TextView` 上。\n\n\n\n\n一旦打开，管理器将以工具窗口的形式出现，如 图 4-2 所示：\n\n![](img/as_device_manager.jpg)\n\
  图 4-2\n\n如果您是在计算机上首次安装 Android Studio（而不是升级现有的 Android Studio 安装程序），安装程序可能已经创建了一个备就用的初始\
  \ AVD 实例，如 图 4-3 所示：\n\n![](img/as_device_manager_with_avd.jpg)\n图 4-3\n\n如果您的系统中存在此\
  \ AVD，您可以使用它来测试应用。如果没有创建 AVD，或者您想为不同的设备类型创建 AVD，请按照本章其余部分的步骤进行。\n\n要添加新的 AVD，请确保在点击\
  \ `Create device`（创建设备）按钮之前选择了 `Virtual`（虚拟）选项卡，以打开 `Virtual Device Configuration`（虚拟设备配置）对话框：\n\
  \n![](img/as_avd_select_hardware.jpg)\n图 4-4\n\n在对话框中，执行以下步骤来创建一个与 Pixel 4 兼容的模拟器：\n\
  \n1. 从 `Category`（类别）面板选择 `Phone`（手机）选项，显示可用 Android 手机 AVD 模板。\n2. 选择 `Pixel 4`\
  \ 设备选项并点击 `Next`（下一步）。\n3. 在 `System Image`（系统镜像）屏幕上，选择最新版本的 Android。如果尚未安装系统镜像，`Release\
  \ Name`（名称）旁边将提供 `Download`（下载）链接。点击此链接在选择之前下载并安装系统镜像。如果没有所需的镜像，请点击 `x86 Images`（如果您运行的是带有\
  \ Apple 芯片的 Mac，则点击 ARM images）或 `Other images` 选项卡以查看备列表。\n4. 点击 `Next` 继续，并在 `name`\
  \ 字段中输入描述性名称（例如 `Pixel 4 API 33`）或接受默认名称。\n5. 点击 `Finish`（完成）创建 AVD。\n6. 如果以后需要对\
  \ AVD 进行修改，重新打开 `Device Manager`（设备管理器），从列表中选择 AVD，并点击 `Actions`（操作）列中的铅笔图标来编辑设置。\n\
  \n## 4.2 启动模拟器\n\n要测试新创建的 AVD 模拟器，从 `Device Manager` 中选择模拟器并点击 `launch`（启动）按钮（`Actions`\
  \ 列中的三角形）。模拟器将嵌入到 Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于 AVD 及其运行的系统的配置：\n\n![](img/as_avd_running.jpg)\n\
  图 4-5\n\n要隐藏和显示模拟器工具窗口，请点击 `Running Devices`（运行中的设备）工具窗口按钮（上图标记为 A）。点击标签旁边的“x”关闭按钮\
  \ (B) 退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签表示。例如，图 4-6 显示了一个具有两个模拟器会话的工具窗口：\n\n![](img/as_two_avds_running.jpg)\n\
  图 4-6\n\n要在会话之间切换，点击相应的标签。\n\n虽然模拟器可能默认以竖屏方向显示，但此或其他默认选项可以更改。在 `Device Manager`\
  \ 中，选择新的 `Pixel 4` 条目并点击设备行 `Actions` 列中的铅笔图标。在配置屏幕上，找到 `Startup orientation`（启动方向）部分并更改方向设置。退出并重启模拟器会话以使更改生效。关于模拟器的更多细节将在下一章介绍，“使用和配置\
  \ Android Studio AVD 模拟器”）。\n\n为了在本章下一节节省时间，请在继续之前保持模拟器运行状态。\n\n## 4.3 在 AVD 中运行应用程序\n\
  \n配置好 AVD 模拟器后，现在可以编译并运行前面的章节创建的示例应用 `AndroidSample`。在 Android Studio 中加载 `AndroidSample`\
  \ 项目时，确保新创建的 `Pixel 4` AVD 显示在设备菜单中（如下方 图 4-7 中标记的 A），然后点击由三角形表示的运行按钮 (B)、选择 `Run\
  \ -> Run ‘app’` 菜单选项或使用快捷键 `Ctrl-R`：\n\n![](img/as_run_target.jpg)\n图 4-7\n\n设备菜单\
  \ (A) 可选择不同的 AVD 实例或物理设备作为运行目标，并可以在多个设备上运行应用。菜单还提供了访问 `Device Manager` 以及设备连接配置和故障排除选项\
  \ get：\n\n![](img/as_device_menu.jpg)\n图 4-8\n\n一旦应用安装并运行，第一个 fragment（片段）的用户界面将出现在模拟器中（fragment\
  \ 是 Android 项目中一个可重用的部分，通常由用户界面布局和一些代码组成，该主题将在本章标题为 “Android Fragment 简介” 的章节中介绍）：\n\
  \n![](img/as_androidsample_running.jpg)\n图 4-9\n\n运行过程开始后，会出现 `Run`（运行）工具窗口。在安装和启动应用程序时，`Run`\
  \ 工具窗口将显示诊断信息。图 4-10 显示了 `Run` 工具窗口：\n\n![](img/as_run_window.jpg)\n图 4-10\n\n如果在启动过程中遇到问题，`Run`\
  \ 工具窗口将提供帮助。假设应用加载到模拟器并符合预期，我们已验证 Android 环境已正确安装。\n\n## 4.4 在多个设备上运行\n\n图 4-8 显示的运行目标菜单包含在多个模拟器和设备上运行应用的选项。选中后，此选项显示\
  \ 图 11 所示的配置 AVD 和连接的物理设备列表。在点击运行按钮之前，勾选要目标的模拟器或设备旁边的选框：\n\n![](img/as_avd_multiple.jpg)\n\
  \n点击运行按钮后，Android Studio 将在所选的模拟器和设备上启动应用。\n\n## 4.5 停止运行的应用程序\n\n要停止运行的应用程序，点击主工具栏上的停止按钮，如\
  \ 图 4-12 所示：\n\n![](img/as_avd_stop.jpg)\n图 4-12\n\n也可以使用 `Run` 工具窗口终止应用。通过使用应用运行时出现的窗口栏按钮显示\
  \ `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方 图 13 中突出显示的停止按钮：\n\n![](img/as_run_window_stop.jpg)\n\
  图 4-13\n\n## 4.6 支持深色主题\n\n要测试启用深色主题时的应用行为，在模拟器中运行的 Android 实例内打开 `Settings` 应用，选择\
  \ `Display` 类别并启用 `Dark` ，如 图 4-14 所示：\n\n![](img/as_avd_dark.jpg)\n图 4-14\n\n启用深色主题后，运行\
  \ `AndroidSample` 应用并注意它以深色主题显示，包括黑色背景和按钮上的紫色背景色，如 图 4-15 所示：\n\n![](img/as_androidsample_running_dark.jpg)\n\
  图 4-15\n\n在继续之前，返回 `Settings` 应用并关闭 `Dark` 主题模式。\n\n## 4.7 在独立窗口中运行模拟器\n\n\n\n\n\
  在本章到目前为止，我们仅将模拟器作为嵌入在 Android Studio 主窗口中的工具窗口使用。模拟器可以配置为在 Settings（设置）对话框中的独立窗口出现，可以通过点击\
  \ Android Studio 工具栏上的“IDE and Project Settings”按钮来显示，如图 4-16 所示：\n\n![](img/as_settings_menu.jpg)\n\
  \n图 4-16\n\n在 Settings 对话框中，在侧边面板导航到 `Tools` -> `Emulator`，并禁用 `Launch in a tool\
  \ window`（在工具窗口启动）选项：\n\n![](img/as_avd_luanch_in_tool_window.jpg)\n\n图 4-17\n\n\
  禁用该选项后，点击`Apply`按钮并点击`OK`以提交更改，然后通过点击上文图 4-5 中标记为 B 的标签上的关闭按钮来退出当前的模拟器会话。\n\n再次运行示例应用，此时模拟器将作为一个独立窗口出现，如下所示：\n\
  \n![](img/as_avd_separate_window.jpg)\n\n图 4-18\n\n选择独立模式或工具窗口模式取决于个人喜好。如果你喜欢模拟器运行在工具窗口中，请返回设置屏幕并重新启用\
  \ `Launch in a tool window` 选项。然而，在提交独立模式之前，请记住 `Running Devices`（运行中的设备）工具窗口也可以从工具窗口的\
  \ Options 菜单从 Android Studio 主窗口中分离，该菜单通过点击图 4-19 所示的按钮来访问：\n\n![](img/as_tool_window_options_button.jpg)\n\
  \n图 4-19\n\n在 Options 菜单中，选择`View Mode`（视图模式）-> `Float`（浮动）将工具窗口从 Android Studio\
  \ 主窗口分离：\n\n![](img/as_tool_window_options_float.jpg)\n\n图 4-20\n\n要重新停靠 `Running\
  \ Devices` 工具窗口，点击图 4-21 所示的`Dock`按钮：\n\n![](img/as_tool_window_dock_button.jpg)\n\
  \n图 4-21\n\n## 4.8 启用设备框架\n\n模拟器可以配置为带有或不带设备框架出现。要更改设置，请退出模拟器，打开 `Device Manager`（设备管理器），从列表中选择\
  \ `AVD`，并点击 Actions 列中的铅笔图标。在设置屏幕中，找到并更改 `Enable Device Frame`（启用设备框架）选项：\n\n![](img/as_avd_enable_device_frame.jpg)\n\
  \n图 4-22\n\n一旦启用设备框架，模拟器下次启动时将将如图 4-23 所示：\n\n![](img/as_avd_running_with_frame.jpg)\n\
  \n图 4-23\n\n## 4.9 总结\n\n典型的应用程序开发过程遵循编码、编译和在测试环境中运行的循环。Android 应用程序可以在物理 Android\
  \ 设备或 Android 虚拟设备（AVD）模拟器上进行测试。AVD 使用 Android Studio Device Manager 工具创建和管理，该工具可以作为命令行工具或通过图形用户界面使用。在创建\
  \ AVD 以模拟特定的 Android 设备型号时，虚拟设备的硬件规格应与物理设备的规格匹配。\n\nAVD 模拟器会话可以以独立窗口的形式显示，也可以嵌入到\
  \ Android Studio 用户界面中。\n\n## 5. 使用和配置 Android Studio AVD 模拟器\n\n在下一章探索在物理 Android\
  \ 设备上进行测试之前，本章将花费一些时间提供 Android Studio AVD 模拟器的概述，并突出许多用于在独立模式和工具窗口模式下自定义环境的配置功能。\n\
  \n### 5.1 模拟器环境\n\n在独立模式下启动时，模拟器在加载过程中会显示初始启动界面（splash screen）。加载完成后，将出现主模拟器窗口，其中包含所选设备类型的表示（在图\
  \ 5-1 中，这是一个 Pixel 4 设备）：\n\n![](img/android_12_avd_running_standalone.jpg)\n\n\
  图 5-1\n\n位于窗口右侧边缘的工具栏提供了对模拟器控制和配置选项的快速访问。\n\n### 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的系列选项访问。\n\
  \n![](img/as_3.5_avd_toolbar.jpg)\n\n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上等待工具提示出现，或者通过扩展控制面板的帮助选项来识别标识。\n\
  \n尽管工具栏中包含的许多选项是自言易懂的，但为了完整性，将介绍每个选项：\n\n*   `Exit / Minimize`（退出/最小化）——工具栏中最上方的“x”按钮在选中时会退出模拟器会话，而“－”选项会最小化整个窗口。\n\
  *   `Power`（电源）——电源按钮模拟物理 Android 设备上的电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。长按此按钮将启动设备的“关机”请求序列。\n\
  *   `Volume Up / Down`（音量增大/减小）——两个控制模拟器内播放音量的按钮。\n*   `Rotate Left/Right`（向左/向右旋转）——在模拟器设备在竖屏和横屏方向之间旋转。\n\
  *   `Take Screenshot`（截图）——对屏幕上显示的内容截图。捕捉图像存储在后文指定的设置屏幕中。\n*   `Zoom Mode`（缩放模式）——此按钮切换进入或退出缩放模式，详情将在后文介绍。\n\
  *   `Back`（返回）——执行标准的 Android“返回”导航以返回上一个屏幕。\n*   `Home`（主页）——显示设备的主屏幕。\n*   `Overview`（概述）——模拟标准的\
  \ Android“概述”导航，显示正在运行的应用。\n*   `Fold Device`（折叠设备）——模拟折叠设备的折叠和展开。此选项在模拟器运行折叠设备镜像时可用。\n\
  *   `Extended Controls`（扩展控制）——显示扩展控制面板，允许配置模拟位置和电话活动、电池强度、移动网络类型和指纹识别。\n\n### 5.3\
  \ 使用缩放模式\n\n位于工具栏的缩放按钮切换进入或退出缩放模式。当激活缩放模式时，工具栏按钮处于按下状态，鼠标指针在悬停在设备屏幕上将显示为放大镜。点击左鼠标键将导致显示相对于选定点缩放，反复点击将增加缩放级别。相反，点击右鼠标键将降低缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮后视图将进入该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条移动屏幕可视区域。\n\
  \n### 5.4 调整模拟器窗口大小\n\n可以通过点击并拖动窗口的任何角或边随时更改模拟器窗口的大小（以及相应的设备表示）。\n\n### 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮显示如图 5-3 所示的面板。默认情况下将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n![](img/as_avd_extended_controls.jpg)\n\
  \n图 5-3\n\n#### 5.5.1 位置\n\n\n\n\n位置控制允许以十进制或六十进制坐标的形式将模拟的位置信息发送到模拟器。位置信息可以采取单个位置的形式，也可以代表设备移动的点序列的形式，后者通过\
  \ GPS 交换格式 (GPX) 或 Keyhole 标记语言 (KML) 格式的文件提供。或者，可以使用集成的 Google Maps 面板可视化地选择单个点或旅行路线。\n\
  \n### 5.5.2 显示器 (Displays)\n除了模拟器屏幕内显示的主显示外，`Displays` 选项允许在同一个 Android 实例中运行额外的显示器。这对于测试如\
  \ Microsoft Surface Duo 等双屏设备的应用非常有用。这些额外的屏幕可以配置为任何所需的尺寸，并显示与主屏幕相同的模拟器窗口内。\n\n###\
  \ 5.5.3 蜂窝 (Cellular)\n可以在蜂窝设置屏幕中更改模拟的蜂窝连接类型。提供的选项可以模拟不同的网络类型（`CSM`、`EDGE`、`HSDPA`\
  \ 等）以及一系列语音和数据场景，例如漫游和拒绝访问。\n\n### 5.5.4 电池 (Battery)\n在扩展控制屏幕的此面板上，可以模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及\
  \ AC 充电器当前是否连接。\n\n### 5.5.5 摄像头 (Camera)\n当摄像头激活时，模拟器会模拟一个 3D 场景。这表现为虚拟建筑的内部，在模拟器内录制视频或拍照之前，可以通过按住\
  \ `Option` 键（Windows 上为 `Alt`）同时使用鼠标指针和键盘键来在其中进行导航。此扩展配置选项允许上传不同的图像以显示在虚拟环境中。\n\n\
  ### 5.5.6 电话 (Phone)\n手机扩展控制在模拟器中提供了两个简单但实用的模拟。第一个选项模拟了来自指定电话号码的入电电话。这在测试应用如何处理高层中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。。在现实世界中一样，这些消息显示在 `Message` 应用中，并触发模拟器内的标准通知。\n\n### 5.5.7\
  \ 方向键 (Directional Pad)\n方向键（`D-Pad`）是内置在 Android 设备中或外部连接（如游戏控制器）的一组额外控件，提供方向控制（左、右、上、下）。方向键设置允许在模拟器内模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风 (Microphone)\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供了一个按钮启动模拟器上的\
  \ `Voice Assistant`。\n\n### 5.5.9 指纹 (Fingerprint)\n许多 Android 设备现在都配备了内置指纹检测硬件。`AVD`\
  \ 模拟器使得测试指纹认证成为可能，无需带有指纹传感器的物理设备上测试应用。在模拟器内配置指纹测试的细节将在本章后部分介绍。\n\n### 5.5.10 虚拟传感器\
  \ (Virtual Sensors)\n虚拟传感器选项允许模拟加速度计和磁计，以模拟设备物理运动的效果，例如通过 `yaw`、`pitch` 和 `roll`\
  \ 设置模拟旋转、移动和倾斜。\n\n### 5.5.11 快照 (Snapshots)\n快照包含当前运行的 `AVD` 会话的状态，可以被保存并快速恢复，使模拟器轻松返回到精确的状态。快照将在本章稍后部分介绍。\n\
  \n### 5.5.12 录制与播放 (Record and Playback)\n允许模拟器屏幕和音频以 `WebM` 或动画 `GIF` 格式录制并保存。\n\
  \n### 5.5.13 Google Play\n如果模拟器运行安装了 Google Play 服务的 Android 版本，此选项将显示当前的 `Google\
  \ Play` 版本。它还提供了将模拟器更新到最新版本的选项。\n\n### 5.5.14 设置 (Settings)\n设置面板提供了一小组配置选项。使用此面板为工具栏和扩展控制面板选择较深的主题，指定保存截图的文件系统位置，配置\
  \ `OpenGL` 支持级别，并配置模拟器窗口显示在桌面或其他窗口之上。\n\n### 5.5.15 帮助 (Help)\n`Help` 屏幕包含三个子面板，包含键盘快捷键列表、访问模拟器在线文档的链接、报告文件错误和发送反馈的链接以及模拟器版本信息。\n\
  \n## 5.6 使用快照\n当模拟器首次启动时，它会执行冷启动，就像物理 Android 设备通电一样。此冷启动过程需要一些时间才能完成，因为操作系统正在加载且所有后台进程都将启动。为了避免每次启动模拟器都必须经过此过程，系统配置为在每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中，并从上次离开的地方继续执行，允许模拟器在冷启动所需的一部分时间内重启。\n\
  \n扩展控制面板的 `Snapshots` 屏幕可以在模拟器执行期间的任何一点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时刻。从屏幕内部，可以使用\
  \ `Take Snapshot` 按钮拍摄快照（在 `图 5-4] 中标记为 A）。要恢复现有快照，请从列表中 (B) 选择它并点击屏幕底部的运行按钮 (C)。还提供了编辑\
  \ (D) 快照名称和描述以及删除 (E) 当前选中快照的选项：\n\n![](img/as_avd_snapshots.jpg)\n\n图 5-4\n\n您还可以通过工具栏中的运行目标菜单选择使用冷启动、最近的快速启动快照或之前的快照来启动模拟器，如图`图\
  \ 5-5]所示：\n\n![](img/as_avd_run_target.jpg)\n\n图 5-5\n\n### 5.7 配置指纹模拟\n模拟器允许配置并使用最多\
  \ 10 个模拟指纹，用于测试 Android 应用中的指纹认证。配置模拟指纹始于启动模拟器、打开 `Settings` 应用并选择 `Security` 选项。\n\
  \n在 `Security` 设置屏幕内，选择 `fingerprint` 选项。在生成的信息屏幕上，点击 `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备用屏幕锁定方法（例如\
  \ `PIN`）。输入并确认一个合适的 `PIN`并通过接受默认通知选项完成 `PIN` 输入过程。\n\n继续通过后续屏幕，直到 `Settings` 应用请求在传感器上放置指纹。此时显示扩展控制对话，在左侧面板中选择\
  \ `Fingerprint` 类别，并确保主设置面板中选择了 `Finger 1`：\n\n![](img/as_avd_touch_sensor.jpg)\n\
  \n图 5-6\n\n点击 `Touch Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加成功：\n\n![](img/as_avd_fingerprint_added.jpg)\n\
  \n图 5-7\n\n要添加更多指纹，请在再次点击 `Touch Sensor` 按钮之前，点击 `Add Another` 按钮并在扩展面板菜单中选择另一个手指。\n\
  \n### 5.8 工具窗口模式下的模拟器\n\n\n\n\n\n如上一章（“在 Android Studio 中创建 Android 虚拟设备 (AVD)”）所述，Android\
  \ Studio 可以配置为在嵌入式工具窗口中启动模拟器，使其不会在独立窗口中出现。当在此模式下运行时，工具栏中提供了与独立模式相同的控制控件，如图图 5-8\
  \ 所示：\n\n![](img/avd_running_devices_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（细节与独立模式一致）：\n\
  \n* 电源\n* 音量增大\n* 音量减小\n* 向左旋转\n* 向右旋转\n* 返回\n* 主页\n* 概览\n* 截图\n* 快照\n* 扩展控制\n\n\
  ## 5.9 创建可调整大小的模拟器\n\n除了配置匹配特定 Android 设备型号模拟器外，Android Studio 还提供了一种可调整大小的 AVD，允许你在手机、平板电脑和折叠设备尺寸之间切换。要创建一个可调整大小的模拟器，打开`Device\
  \ Manager`并点击`Create device`按钮。接下来，选择如图图 5-9 所示的`Resizable`设备定义，并按照通常步骤创建新的 AVD：\n\
  \n![](img/avd_create_resizable.jpg)\n\n图 5-9\n\n当你在工具窗口内的新模拟器上运行应用时，工具栏中将出现`Display\
  \ mode`选项，允许你如图图 5-10 所示在不同的模拟器配置之间切换：\n\n![](img/as_avd_fold_button.jpg)\n\n图 5-10\n\
  \n如果模拟器在独立模式下运行，则可以在侧边工具栏中找到`Display mode`选项，如下所示：\n\n![](img/as_avd_display_mode.jpg)\n\
  \n图 5-11\n\n## 5.10 总结\n\nAndroid Studio 包含一个 Android 虚拟设备模拟器环境，旨在让无需在物理 Android\
  \ 设备上运行即可更容易测试应用程序。本章简要介绍了模拟器，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\n## 6. Android Studio\
  \ 用户界面概览\n\n虽然人们急于运行上一章中创建的示例应用程序，但它涉及使用 Android Studio 用户界面的某些方面，这些内容最好先进行描述。\n\
  \nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上是直观易用的。尽管如此，现在花时间熟悉 Android Studio 用户界面的布局和结构，将缩短书中后续章节的学习曲线。基于此考虑，本章将提供\
  \ Android Studio 环境中各个区域和组件的概述。\n\n### 6.1 欢迎屏幕\n\n欢迎界面（如图图 6-1）在 Android Studio\
  \ 运行且当前没有打开任何项目时会显示（可以通过选择`File -> Close Project` 菜单选项随时关闭已打开的项目）。如果是在项目仍打开状态下退出\
  \ Android Studio，工具在下次启动时将跳过欢迎界面，自动打开之前活跃的项目。\n\n![](img/as_giraffe_welcome2.jpg)\n\
  \n图 6-1\n\n除了最近项目列表外，欢迎界面提供了执行如打开和创建项目等任务的选项，并可以访问当前受版本控制的项目。此外，`Customize`屏幕提供了更改\
  \ IDE 和编辑器使用的主题和字体设置的选项。可以使用`Plugins`选项查看、安装和管理 Android Studio 插件。\n\n通过选择`More\
  \ Actions`链接或在最近项目列表取代`More Actions`链接时使用如图图 6-2 所示的菜单，可以获得更多选项：\n\n![](img/as_welcome_menu.jpg)\n\
  \n图 6-2\n\n### 6.2 菜单栏\n\n当创建新项目或打开现有项目时，将出现 Android Studio 主窗口。当同时打开多个项目时，每个项目都将分配自己的主窗口。窗口的精确配置将取决于\
  \ Android Studio 运行的操作系统，以及上次打开项目时显示了哪些工具和面板。例如，主菜单栏的外将取决于主机操作系统。在 macOS 上，Android\
  \ Studio 遵循将菜单栏置于桌面顶部的标准惯例，如图图 6-3 所示：\n\n![](img/as_menu_bar.jpg)\n\n图 6-3\n\n\
  然而，当 Android Studio 在 Windows 或 Linux 上运行时，通过如图图 6-4 所示的高亮按钮访问主菜单：\n\n![](img/as_windows_main_menu.jpg)\n\
  \n图 6-4\n\n### 6.3 主窗口\n\n一旦打开项目，Android Studio 主窗口通常类似于图图 6-5 所示：\n\n![](img/as_main_window_java.jpg)\n\
  \n图 6-5\n\n主窗口的各种元素可以总结如下：\n\n**A – 工具栏 (Toolbar)** – 一组用于频繁执行操作的快捷键。工具栏按钮提供了快速访问一组菜单栏操作的方法。可以通过右键点击工具栏并选择`Customize\
  \ Toolbar…` 选项来自定义工具栏。如图图 6-6 所示的工具栏菜单提供了执行打开、创建项目以及在窗口之间切换任务的便捷方法：\n\n![](img/project_switch_menu.jpg)\n\
  \n图 6-6\n\n**B – 导航栏 (Navigation Bar)** – 导航栏为在项目文件和文件夹之间移动提供了一种便捷方法。点击导航栏上的元素将弹出一个显示该位置子文件夹和文件的菜单。同样，点击类名将显示包含在该类中的方法列表：\n\
  \n![](img/navigation_menu.jpg)\n\n图 6-7\n\n从列表中选择一个方法将跳转到代码编辑器中的相应位置。你可以使用`View\
  \ -> Appearance -> Navigation Bar`选项来隐藏、显示和更改此栏的位置。\n\n**C – 编辑器窗口 (Editor Window)**\
  \ – 编辑器窗口显示当前正在编写的文件内容。当打开多个文件时，每个文件由位于编辑器顶部的标签页表示，如图图 6-8 所示：\n\n![](img/menu_bar_java.jpg)\n\
  \n图 6-8\n\n**D – 状态栏 (Status Bar)** – 状态栏显示有关项目和 Android Studio 活动的信息性消息。悬停在状态栏项目上将显示该字段的描述。许多字段是交互式的，允许用户通过点击来执行任务或获取更详细的状态信息。\n\
  \n![](img/status_bar.jpg)\n\n图 6-9\n\n可以使用`View -> Appearance -> Status Bar Widgets`\
  \ 菜单更改在状态栏中显示的组件。\n\n**E – 项目工具窗口 (Project Tool Window)** – 项目工具窗口提供了项目文件结构的分级概述，允许执行到特定文件和文件夹的导航。工具栏可以使用多种不同的方式显示项目。默认设置是\
  \ Android 视图，这是本书其余部分中主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中众多工具之一。\n\n### 6.4\
  \ 工具窗口\n\n\n\n\n\n除了项目（Project）视图工具窗口外，Android Studio 还包含许多其他窗口。当这些窗口被启用时，它们会在主窗口的左侧和右侧边缘显示工具窗口栏，其中包含用于显示和隐藏每个工具窗口的按钮。图\
  \ 6-10 显示了典型的工具窗口栏配置，尽管按钮及其位置可能会根据你安装的 Android Studio 版本而有所不同。\n\n![](img/as_tool_window_bars.jpg)\n\
  \n图 6-10\n\n点击按钮将显示相应的工具窗口，再次点击则会隐藏该窗口。工具窗口栏中按钮的位置表示了当窗口显示时，它将出现在主窗口的哪一侧。可以通过点击并拖动按钮到其他窗口工具栏的不同位置来更改这些位置。\n\
  \nAndroid Studio 提供了丰富的工具窗口，其中最常用的如下：\n\n*   `Project` (A) – 项目视图提供了构成项目的文件结构概览，允许在文件之间进行快速导航。通常，在项目视图中双击文件将导致该文件加载到适当的编辑工具中。\n\
  *   `Resource Manager` (B) - 用于在项目内添加和管理资源及资产的工具，例如图像、颜色和布局文件。\n*   `More Tool Windows`\
  \ (C) - 显示包含当前未显示在工具窗口栏中的其他工具窗口的菜单。从此菜单中选择工具窗口后，它将作为按钮出现在工具窗口栏中。\n*   `Run` (D)\
  \ – 当应用程序正在运行时，运行工具窗口将变为可用，并提供运行结果的视图，以及停止或重启正在运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供有关问题的诊断信息。\n\
  *   `Logcat` (E) – Logcat 工具窗口提供了访问运行应用程序监控日志输出的权限，并提供了对应用程序截图、视频以及停止和重启进程的选项。\n\
  *   `Problems` (F) - 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带你跳转到问题所在的文件和位置。\n*   `App Quality\
  \ Insights` (G) - 提供访问云端 Firebase 应用程序质量和崩溃分析平台的权限。\n*   `Terminal` (H) – 提供访问运行\
  \ Android Studio 的系统终端窗口的权限。在 Windows 系统上，这是命令提示符界面，而在 Linux 和 macOS 系统上，它以终端提示的形式存在。\n\
  *   `Version Control` (I) - 当项目文件受源代码版本控制时使用此工具窗口，允许访问 Git 仓库和代码更改历史。\n*   `Notifications`\
  \ (J) - 当项目文件受源代码版本控制时使用此工具窗口，允许访问 Git 仓库和代码更改历史。\n*   `Gradle` (K) – Gradle 工具窗口提供了构成项目构建配置的\
  \ Gradle 任务视图。该窗口列出了将项目各种元素编译为可执行应用程序所涉及的任务。右键点击顶级 Gradle 任务并选择 `Open Gradle Config`\
  \ 菜单选项，可以将当前项目的 Gradle 构建文件加载到编辑器中。书中将在稍后部分详细介绍 Gradle。\n*   `Device Manager` (L)\
  \ - 提供访问设备管理器（Device Manager）的权限，可以在其中添加、删除和管理物理 Android 设备连接以及模拟器。\n*   `Running\
  \ Devices` (M) - 如果启用了在工具窗口中运行模拟器的选项（如章节“在 Android Studio 中创建 Android 虚拟设备 (AVD)”所示），则其中包含\
  \ AVD 模拟器。\n*   `App Inspection` - 提供访问 `Database`（数据库）和 `Background Task`（后台任务）检查器的权限。`Database\
  \ Inspector` 允许你在应用程序运行时检查、查询和修改应用程序数据库。`Background Task Inspector` 允许监控和管理使用 `WorkManager`\
  \ 创建的后台工作任务。\n*   `Bookmarks` – 书签工具窗口提供了快速访问已标记的文件和代码行。例如，在项目视图中右键点击文件可以访问 `Add\
  \ to Bookmarks` 菜单选项。同样，你可以通过将光标移动到那里并按 `F11` 键（macOS 上为 `F3`）标记源文件中的一行代码。所有书签项都可以此工具窗口访问。\n\
  *   `Build` - 构建工具窗口显示项目正在编译和打包时的构建过程信息，以及遇到的任何错误详细信息。\n*   `Build Variants` – 构建变体工具窗口提供了为当前应用程序项目配置不同构建目标的快速方法（例如，针对应用程序调试和发布版本的不同构建，或针对不同设备类别的多个构建）。\n\
  *   `Device File Explorer` – 通过 `View` -> `Tool Windows` -> `Device File Explorer`\
  \ 菜单可用，此工具窗口提供了对当前连接的 Android 设备或模拟器文件系统的直接访问，允许浏览文件系统并将文件复制到本地文件系统。\n*   `Layout\
  \ Inspector` - 提供构成用户界面布局的组件层次的可视化 3D 渲染。\n*   `Structure` – 结构工具提供了当前编辑器中显示的源文件结构的高级视图。这些信息包括文件中的类、方法和变量等项的列表。从结构列表中选择某项将带你跳转到编辑器窗口源文件中的对应位置。\n\
  *   `TODO` – 如名称所示，此工具提供了一个查看项目中待完成事项的地方。Android Studio 通过扫描构成项目的源文件寻找匹配特定 `TODO`\
  \ 注释来编译此列表。可以通过打开 `Settings` 对话框并导航到 `TODO` 来查看和更改这些模式。\n\n### 6.5 工具窗口菜单\n\n每个工具窗口顶部都有自己的工具栏。这些工具栏中的菜单随工具的不同而异，但所有工具窗口都包含一个\
  \ `Options` 菜单（见图 6-11\n\n图 6-11\n\n`Options` 菜单允许更改窗口的各个方面。图 6-12 例如显示了 `Project`\
  \ 工具窗口的 `Options` 菜单。例如，可用设置可以将窗口停靠并使其在 Android 主窗口边界之外浮动，以及移动和调整工具面板的大小：\n\n![](img/as_project_tool_window_options.jpg)\n\
  \n图 6-12\n\n所有工具窗口在工具栏的最右侧还包含一个按钮（见上方图 6-11 中的标记 B），提供了隐藏工具窗口的方法。可以通过点击窗口使其并输入搜索词（例如\
  \ `Project` 工具窗口中的文件名）来对工具窗口内的项进行搜索。搜索框将出现在窗口工具栏中，并高亮显示匹配搜索内容的项。\n\n### 6.6 Android\
  \ Studio 快捷键\n\nAndroid Studio 包含了许多快捷键，以便在执行常用任务时节省时间。可以在 Android Studio 项目窗口内通过选择\
  \ `Help` -> `Keyboard Shortcuts PDF` 菜单选项查看并打印完整的快捷键键映射列表。你也可以通过打开 `Settings` 对话框并点击\
  \ `Keymap` 项来列出和修改快捷键，如下方的图 6-13 所示：\n\n![](img/as_keymap.jpg)\n\n图 6-13\n\n\n\n\
  \n# 6.7 切换器与最近文件导航\n\n在 Android Studio 主窗口内进行导航的另一种实用机制是使用 `Switcher`（切换器）。通过 `Ctrl-Tab`\
  \ 快捷键访问切换器，它会作为一个面板出现，列出所有工具窗口和当前打开的文件（图 6-14）。\n\n![](img/as_switcher.jpg)\n图 6-14\n\
  \n显示后，只要 `Ctrl` 键保持按下，切换器就会保持可见。在按住 `Ctrl` 键的同时反复点击 `Tab` 键可以在各种选择选项之间循环，释放 `Ctrl`\
  \ 键将选中当前高亮的项并在主窗口中显示。\n\n除了 `Switcher` 外，`Recent Files`（最近文件）面板提供了对最近打开文件的导航（图 6-15）。可以使用\
  \ `Ctrl-E` 快捷键（macOS 上为 `Cmd-E`）访问。显示后，可以使用鼠标指针选择选项，或使用键盘方向键在文件名和工具窗口选项之间滚动。按下 `Enter`\
  \ 键可以选择当前高亮的项：\n\n![](img/as_recent_files.jpg)\n图 6-15\n\n# 6.8 修改 Android Studio\
  \ 主题\n\n可以使用 `Settings`（设置）对话框更改 Android Studio 环境的整体主题。一旦显示设置对话框，在左侧面板中选择 `Appearance\
  \ & Behavior`（外观与行为）选项，然后选择 `Appearance`（外观）。在点击 `OK` 按钮之前更改 `Theme`（主题）菜单的设置。可用主题取决于平台，但通常包括\
  \ `Light`（浅色）、`IntelliJ`、`Windows`、`High Contrast`（高对比度）和 `Darcula`等选项。图 6-16 显示了选择了\
  \ `Dark`（深色）主题的主窗口示例：\n\n![](img/as_dark.jpg)\n图 6-16\n\n要把 Android Studio 主题与操作系统的明暗模式设置同步，请启用\
  \ `Sync with OS`（与操作系统同步）选项，并使用下拉菜单控制每个模式使用哪种主题：\n\n![](img/as_theme_sync.jpg)\n\
  图 6-17\n\n# 6.9 总结\n\nAndroid Studio 环境的主要元素由欢迎界面和主窗口组成。每个打开的项目都有它自己的主窗口，该窗口又由菜单栏、工具栏、编辑和设计区域、状态栏以及工具窗口集合组成。工具窗口出现在主窗口的侧边。\n\
  \nAndroid Studio 中极少数操作无法通过快捷键触发。可以随时从 Android Studio 主窗口内访问默认快捷键的键位映射。\n\n# 7.\
  \ 在物理 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现许多功能，但在物理\
  \ Android 设备上进行真实的应用测试是不可替代的，而且某些 Android 功能仅在物理 Android 设备上可用。\n\n与 AVD 实例和已连接\
  \ Android 设备的通信由 Android 调试桥（`ADB`，Android Debug Bridge）处理。本章将解释如何配置 `adb` 环境，以便在基于\
  \ macOS、Windows 和 Linux 的系统的 Android 设备上启用应用测试。\n\n# 7.1 Android 调试桥 (ADB) 概述\n\n\
  `ADB` 的主要目的是方便开发系统（在本例中为 Android Studio）与 AVD 模拟器及 Android 设备之间的交互，以运行和调试应用程序。`ADB`\
  \ 允许你通过 WiFi 或 USB 线连接到设备。\n\n`ADB` 由一个客户端、一个运行在开发系统后台的服务器进程以及一个运行在 AVD 或真实 Android\
  \ 设备（如手机和平板）中的守护后台进程组成。\n\n`ADB` 客户端有多种形式。例如，在 Android SDK 的 `platform-tools` 子目录下提供了一个名为\
  \ `adb` 的命令行工具作为客户端。同样，Android Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用\
  \ `devices` 命令行参数列出活跃的虚拟或物理设备。以下命令输出表示系统上存在一个 AVD，但没有物理设备：\n\n```\n$ adb devices\n\
  List of devices attached\nemulator-5554 device\n```\n\n# 7.2 在 Android 设备上启用 USB\
  \ 调试 ADB \n\n在 `ADB` 连接到 Android 设备之前，必须将该设备配置为允许连接。在运行 Android 6.0 或更高版本的手机和平板设备上，实现此目的的步骤如下：\n\
  \n1. 打开设备上的 `Settings`（设置）应用并选择 `About tablet`（关于平板）或 `About phone`（关于手机）选项（在某些\
  \ Android 版本中，可以在 `Settings` 应用的 `System` 页面找到）。\n2. 在 `About` 屏幕上滚动到 `Build number`（版本号）字段（图\
  \ 7-1）并点击七次，直到消息显示已启用开发者模式。如果 `About` 屏幕上未列出 `Build number`，可以通过 `Software information`（软件信息）选项找到。或者，如果，展开列表中的\
  \ `Advanced`（高级）部分。\n\n![](img/as_3.2_build_number.jpg)\n图 7-1\n\n3. 返回主 `Settings`屏幕并注意名为\
  \ `Developer options`（开发者选项）的新选项（在较新的 Android 版本中，此选项列在 `System` 设置屏幕上）。选择此选项，在生成的屏幕上找到如图\
  \ 7-2 所示的 `USB debugging`（USB 调试）选项：\n\n![](img/android_12_debugging.jpg)\n图 7-2\n\
  \n4. 启用 `USB debugging` 选项并在请求确认时点击 `Allow`（允许）。\n\n设备现在已配置为接受来自 `adb` 的调试。剩下的工作是配置开发系统在连接时检测设备。虽然这是一个相对简单的过程，但步骤取决于开发系统运行\
  \ Windows、macOS 还是 Linux。以下步骤假设 Android SDK platform-tools 目录已包含在系统的 `PATH` 环境变量中，参见“设置\
  \ Android 开发环境”章节(#Installation.xhtml__idAnchor009)。\n\n## 7.2.1 macOS ADB 配置\n\n\
  要在 macOS 系统上配置 `ADB` 环境，第一步是在该系统上安装相应的 `USB` 驱动程序。要安装的 `USB` 驱动程序取决于 Android 设备的型号。如果你拥有\
  \ Google 设备（例如 Pixel 手机），则需要在你的 Windows 系统上安装并配置 `Google USB Driver` 程序包。实现此目的的详细步骤列在以下网页上：\n\
  \n\n\n\n\n[`developer.android.com/sdk/win-usb.html`](http://developer.android.com/sdk/win-usb.html)\n\
  \n对于不支持 Google USB 驱动程序的 Android 设备，需要下载由设备制造商提供的驱动程序。您可以在网上获取驱动程序列表以及下载和安装信息：\n\
  \n[`developer.android.com/tools/extras/oem-usb.html`](http://developer.android.com/tools/extras/oem-usb.html)\n\
  \n安装驱动程序后，如果设备已被识别为正确的类型，请打开命令提示符窗口并执行以下命令：\n\n```adb devices\n```\n\n该命令应该输出有关连接设备的信息，类似于下所示：\n\
  \n```\nList of devices attached\nHT4CTJT196 offline\n```\n\n如果设备显示为 offline（离线）或\
  \ unauthorized（未授权），请查看设备屏幕，检查图 7-3 所示的请求允许调试的对话框。在点击确定之前，勾选“允许来自此计算机”选项旁边的复选框。再次执行\
  \ `adb devices` 命令应该会将设备列为已就绪：\n\n```\nList of devices attached\nHT4CTJT196 device\n\
  ```\n\n如果设备未列出，请执行以下命令重启 ADB 服务：\n\n```adbadb kill-server\nadb start-server\n```\n\
  \n如果设备仍然未列出，请尝试执行以下命令：\n\n```android update adb\n```\n\n请注意，可能还需要重新启动系统。\n\n## 7.2.3\
  \ Linux adb 配置\n\n在本章中，我们将再次使用 Ubuntu Linux 作为参考示例，配置 `adb` 以连接到物理 Android 设备以进行测试。在\
  \ Ubuntu Linux 上进行物理设备测试需要安装名为 `android-tools-adb` 的包，这反要求 Android Studio 用户成为 `plugdev`\
  \ 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，可以通过运行 `id` 命令进行验证。如果未列出 `plugdev` 组，请运行以下命令将您的账户添加到组：\n\
  \n```sudo usermod -aG plugdev $LOGNAME\n```\n\n在满足组成员要求后，可以通过执行以下命令安装 `android-tools-adb`\
  \ 包：\n\n```sudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务，并检查连接的设备列表：\n\n```$adb start-server\ndaemon not running. starting it\
  \ now on port 5037\ndaemon started successfully\n$adb devices\nList of devices attached\n\
  015d41d454bf80c offline\n```\n\n如果设备显示为 offline 或 unauthorized，请查看 Android 设备并检查图\
  \ 7-3 所示的请求允许调试的对话框。\n\n## 7.3 解决 USB 连接问题\n\n如果您无法通过上述步骤成功连接到设备，请显示运行目标菜单（图 7-4）并选择“排除设备连接”（Troubleshoot\
  \ Device Connections）选项：\n\n!image/as_device_troubleshooting.jpg\n\n连接助手将扫描设备并报告问题及其解决方案。\n\
  \n## 7.4 在 Android 设备上启用无线调试\n\n按照上述 7.2 节中的步骤 1 到 3 进行操作，这次将启用图 7-5 所示的“无线调试”选项：\n\
  \n!image/android_12_enable_wifi_debugging.jpg\n\n接下来，点击上述“无线调试”条目以显示图 7-6 所示的屏幕：\n\
  \n!image/android_12_enable_wifi_debugging_settings.jpg\n\n如果您的设备带有相机，请选择“使用二维码配对设备”，否则选择“使用配对码配对设备”。根据您的选择，设置应用将启动相机会话或显示配对码，如图\
  \ 7-7 所示：\n\n!image/as_pair_devices_code.jpg\n\n选择选项后，返回 Android Studio，从运行目标菜单中选择“通过\
  \ WiFi 配对设备”（Pair Devices Using WiFi），如图 7-8 所示：\n\n!image/as_wifi_pair_menu.jpg\n\
  \n在配对对话框中，根据您之前在设备设置应用中的选择，项选择“使用二维码配对”或“使用配对码配对”：\n\n!image/as_wifi_pair_dialog.jpg\n\
  \n使用 Android 设备扫描二维码，或将设备屏幕上显示的配对码输入 Android Studio 对话框（图 7-10）中以完成配对过程：\n\n!image/as_pair_devices_wifi_enter_code.jpg\n\
  \n如果配对过程失败，请尝试重启开发系统和 Android 设备并重试。\n\n## 7.5 测试 adb 连接\n\n假设在您选择的开发平台上已成功配置 `adb`，下一步是在设备上尝试运行“在\
  \ Android Studio 中创建示例 Android 应用”章节中创建的应用程序。启动 Android Studio，打开 AndroidSample\
  \ 项目，并验证设备是否显示在图 7-11 所示的设备选择菜单中：\n\n!image/as_physical_device_connected.jpg\n\n\
  从列表中选择设备并点击运行按钮以安装并运行应用。\n\n## 7.6 设备镜像\n\n设备镜像（Device mirroring）允许您在物理设备上运行应用，同时在\
  \ Android Studio 的“运行设备”（Running Devices）工具窗口内查看显示。也就是说，尽管应用程序运行在物理设备上，但它在 Android\
  \ Studio 中的显示方式与 AVD 实例相同。\n\n## 7.7 总结\n\n虽然 Android 虚拟设备模拟器提供了极佳的测试环境，但必须记住，确保应用程序在物理设备上正常运行没有真正的替代方案。\n\
  \n但默认情况下，Android Studio 环境未配置为将 Android 设备作为目标设备。因此，需要执行某些步骤，通过 USB 线缆或 WiFi 网络从\
  \ Android Studio 开发环境直接将应用程序加载到 Android 设备上。\n\n## 8 Android Studio 代码编辑器基础\n\n\
  为 Android 开发应用程序涉及大量的编程工作，根据定义，这涉及输入、审查和修改代码行。意料的是，开发者使用 Android Studio 的大部分时间通常会在编辑器窗口内编辑代码。\n\
  \n现代代码编辑器必须远超基本的输入、删除、剪切和粘贴。今天，代码编辑器的实用性通常取决于它减少程序员输入量的程度、在大源文件中导航的易用性，以及编辑器在编写代码时实时检测并突出编程错误的能力。正如本章所示，这些仅仅是编辑器出色的几个领域之一。\n\
  \n\n\n\n本章并未对 Android Studio 编辑器的功能进行详尽概述，但其目的是提供该工具关键功能的指南。经验丰富的程序员会发现，这些功能中的某些是目前大多数代码编辑器通用的，而许多功能是该编辑环境所特有的。\n\
  \n## 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio 编辑器会出现在主窗口的中心。例如，图\
  \ 8-1 显示了一个加载了 Java 源代码文件的典型编辑会话：\n\n![](img/as_code_editor_java.jpg)\n\n图 8-1\n\
  \n构成编辑器窗口的元素可以总结如下：\n\n**A – 文档标签（Document Tabs）** – Android Studio 可以随时打开多个文件进行编辑。每当打开一个文件，它就会被分配一个文档标签，在编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签时，标签栏的最右侧会出现一个一个小下拉菜单。点击此菜单将列出其他已打开的文件列表。标签中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，这些错误在项目编译和运行之前需要解决。\n\
  \n切换文件可以通过点击相应的标签或使用 `Alt-Left` 和 `Alt-Right` 键盘快捷键。也可以使用切换器机制（通过 `Ctrl-Tab` 键盘快捷键访问）进行文件导航。\n\
  \n要将编辑器面板从 Android Studio 主窗口分离以便在单独的窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离编辑器窗口中的文件标签，并将其拖放到主窗口中的原始编辑器标签栏上。\n\
  \n**B – 编辑器行槽区域（Editor Gutter Area）** - 编辑器使用行槽显示信息图标和控件。行槽区域中的一些典型项目是调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过右行槽点击右键并选择\
  \ `Appearance -> Show Line Numbers`（外观 -> 显示行号）菜单选项来禁用。\n\n**C – 代码结构位置（Code Structure\
  \ Location）** – 编辑器底部的此栏显示光标相对于代码整体结构的当前位置。例如，在图中，该栏指示 `convertCurrency` 方法正在被编辑，且该方法位于\
  \ `MainActivity` 类中：\n\n![](img/as_code_structure.jpg)\n\n图 8-2\n\n双击栏内的任意元素将把光标移动到代码文件中的相应位置。例如，双击\
  \ `convertCurrency` 条目将光标移动到源代码中 `convertCurrency` 方法的顶部。同样，点击 `MainActivity` 条目将显示一个可供选择的代码导航点列表：\n\
  \n![](img/as_code_structure_menu.jpg)\n\n图 8-3\n\n**D – 编辑器区域（Editor Area）** – 用户查看、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\
  \n**E – 验证和标记侧边栏（Validation and Marker Sidebar）** – Android Studio 集成了一个名为“即时代码分析”（on-the-fly\
  \ code analysis）的功能。这意味着当您编写代码时，编辑器会分析代码以检查警告和语法错误。验证侧边栏顶部的指示器将实时更新，显示随着代码添加而发现的错误和警告数量。点击此指示器将显示一个弹出窗口，其中包含编辑器中代码发现的问题摘要，如图图\
  \ 8-4 所示：\n\n![](img/as_editor_validation_summary.jpg)\n\n图 8-4\n\n向上和向下箭头在代码内的错误位置之间移动。绿色复选标记表示未检测到警告或错误。\n\
  \n侧边栏还会使用相同的颜色代码在检测到问题的位置显示标记。当代码行在编辑器区域可见，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_code_editor_problem_popup.jpg)\n\
  \n图 8-5\n\n当代码行已滚动出编辑器视图区域时，将鼠标指针悬停在该行的标记上，将显示一个“透镜”（lens）覆盖层，其中包含问题所在的代码块（图 8-6），从而可以在无需滚动到编辑器中该位置的情况下查看它：\n\
  \n![](img/as_code_editor_lens.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分上都会出现一个透镜，其中包含源文件中该处的代码。\n\
  \n**F – 状态栏（Status Bar）** – 尽管状态栏是主窗口的一部分而非编辑器，但它确实包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符层面的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号将显示 `Go to Line:Column`（转行：列）对话框。使用 `View -> Appearance\
  \ -> Status Bar Widgets`（视图 -> 外观 -> 状态栏小部件）菜单选项来添加和删除小部件。例如，如果您遇到 Android Studio\
  \ 性能问题，内存指示器是一个非常有用的小部件。\n\n在介绍了构成编辑器的元素后，本章剩余部分将探讨编辑环境的关键功能。\n\n## 8.2 分割编辑器窗口\n\
  \n默认情况下，编辑器显示当前文件的单个面板。在处理多个源文件时，一个实用功能是将编辑器拆分为多个面板。要拆分编辑器，右键点击编辑器窗口内的文件标签并选择 `Split\
  \ Right`（向右拆分）或 `Split Down`（向下拆分）菜单选项。例如，图 8-7 显示了拆分器的用法，编辑器被分为三个面板：\n\n![](img/as_code_editor_split.jpg)\n\
  \n图 8-7\n\n随时可以通过右键点击相应的标签并选择 `Change Splitter Orientation`（更改拆分方向）菜单选项更改分割面板的方向。重复这些步骤可以取消单个面板，此时从菜单中选择\
  \ `Unsplit`。可以通过右键点击任何标签并选择 `Unsplit All`（取消所有分割）来移除所有分割面板。\n\n窗口分割可以显示不同的文件，也可以提供同一文件的多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n## 8.3 代码补全\n\nAndroid Studio 编辑器内置了大量关于 Java 编程语法以及 Android SDK 类和方法的内置知识，以及对您代码库的了解。在输入代码时，编辑器扫描输入内容，并在适当的情况下对完成语句或引用可能需要的建议。当编辑器检测到补全建议时，会出现一个包含建议列表的面板。在图\
  \ 8-8 中，编辑器正在为 String 声明的开头提供建议：\n\n![](img/as_code_editor_completion.jpg)\n\n图\
  \ 8-8\n\n\n\n\n如果没有任何自动补全建议是正确的，请继续输入，编辑器将在适宜的地方继续完善建议。要采纳最顶部的建议，请按键盘上的 `Enter`\
  \ 或 `Tab` 键。要选择不同的建议，请使用方向键在列表中上下移动，并再次使用 `Enter` 或 `Tab` 键选择高亮项。\n\n可以使用 `Ctrl-Space`\
  \ 键盘组合键手动调用补全建议。这在更改编辑器中的单词或声明时非常有用。当光光标悬停在编辑器中的某个单词上时，该单词将自动高亮。按下 `Ctrl-Space`\
  \ 将显示一个备选建议列表。按下 `Tab` 键可以将当前单词替换为建议列表中的高亮项。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供了智能补全（Smart\
  \ Completion）系统。智能补全通过 `Shift-Ctrl-Space` 键盘组合键调用，选中后它将根据代码的当前上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space`\
  \ 快捷键将从更广泛的范围内提供更多建议。\n\n代码补全对许多程序员来说可能是个人喜好。为了承认这一事实，Android Studio 对自动补全设置提供了高水平的。可以通过打开\
  \ `Settings` 对话框并在设置面板中选择 `Editor -> General -> Code Completion` 来查看和修改这些设置，如图 8-9\
  \ 所示：\n\n![](img/as_code_completion_settings.jpg)\n\n图 8-9\n\n## 8.4 语句补全\n\nAndroid\
  \ Studio 编辑器提供的另一种自动补全形式是语句补全（Statement Completion）。它可以自动填充方法和循环语句等项的括号和大括号。语句补全通过\
  \ `Shift-Ctrl-Enter`（macOS 上为 `Shift-Cmd-Enter`）键盘组合键调用。考虑以下代码：\n\n```java\nmyMethod()\n\
  ```\n\n在编辑器中输入此代码后，触发语句补全会导致编辑器自动为方法添加大括号：\n\n```java\nmyMethod() {\n\n}\n```\n\n\
  ## 8.5 参数信息\n\n还可以请求编辑器提供关于方法接受的参数参数的信息。当光标位于方法调用的括号之间时，使用 `Ctrl-P`（macOS 上为 `Cmd-P`）键盘组合键将显示已知该方法接受的参数，其中最可能的建议将加粗显示：\n\
  \n![](img/as_code_editor_parametre_info_java.jpg)\n\n图 8-10\n\n## 8.6 参数名提示\n\n\
  代码编辑器可以配置为在方法调用显示参数名提示。例如，图 8-11 高亮了 `Snackbar` 类中 `make()` 和 `setAction()` 方法调用中的参数名提示：\n\
  \n![](img/as_code_editor_hints.jpg)\n\n图 8-11\n\n此模式的设置可以通过打开 `Settings` 对话框并在侧边栏导航到\
  \ `Editor -> Inlay Hints -> Java` 来配置。在生成的屏幕上为您选择的编程语言开启或关闭 `Parameter names` 选项。要调整提示设置，点击\
  \ `Exclude list...` 链接并进行任何调整。\n\n## 8.7 代码生成\n\n除了输入代码时完成代码外，编辑器在某些条件下还可以为您生成代码。如图\
  \ 8-12 所示的可用代码生成选项列表，可以在光标位于文件中需要生成代码的位置时，使用 `Alt-Insert`（macOS 上为 `Cmd-N`）快捷键访问。\n\
  \n![](img/as_code_generate_menu.jpg)\n\n图 8-12\n\n例如，考虑一种情况：我们希望在项目中的 `Activity`\
  \ 将被操作系统销毁时收到通知。正如本书后面的章节概述，这可以通过重写 `Activity` 超类的 `onStop()` 生命周期方法来实现。要让 Android\
  \ Studio 为此生成一个存根方法，请从代码生成列表中选择 `Override Methods…` 选项，并在生成的可用方法列表中选择 `onStop()`\
  \ 方法：\n\n![](img/as_code_editor_override_dialog.jpg)\n\n图 8-13\n\n选择要重写的方法后，点击 `OK`\
  \ 将在 Java 源文件的当前光标位置生成如下存根方法：\n\n```java\n@Override\nprotected void onStop() {\n\
  \    super.onStop();\n}\n```\n\n## 8.8 代码折叠\n\n一旦源文件文件达到特定大小，即使是格式化最整齐、组织最好的代码也可能变得难以处理和难以导航。Android\
  \ Studio 认为，并不总是需要每个代码块的内容都保持可见。使用 Android Studio 编辑器的代码折叠功能可以使代码导航更容易。代码折叠由折叠箭头控制，当鼠标指针悬停在源文件的行槽（gutter）区域时，这些箭头出现在每个代码块的开头。例如图\
  \ 8-14 高亮了当前未折叠的方法声明折叠箭头：\n\n![](img/as_code_editor_folding.jpg)\n\n图 8-14\n\n点击此标记将折叠语句，使仅符号签名行可见，如图\
  \ 8-15 所示：\n\n![](img/as_code_editor_folded.jpg)\n\n图 8-15\n\n要展开已折叠的代码段，请点击编辑器行槽中的折叠箭头。若要在不展开代码的情况下查看隐藏代码，请将鼠标指针悬停在\
  \ `{…}` 指示器上，如图 8-16 所示。编辑器随后将显示包含折叠代码的透镜覆盖层：\n\n![](img/as_code_editor_folded_java.jpg)\n\
  \n图 8-16\n\n文件中的所有代码块都可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus` 序列（macOS 上为 `Cmd-Shift-Plus`\
  \ 和 `Cmd-Shift-Minus`）折叠或展开。\n\n默认情况下，Android Studio 编辑器打开打开源文件会自动折叠某些代码。要配置发生这种情况的情况，请导航到\
  \ `Settings` 对话框中的 `Editor -> General -> Code Folding` 项（图 8-17）：\n\n![](img/as_code_editor_folding_settings.jpg)\n\
  \n图 8-17\n\n## 8.9 快速文档查找\n\n可以通过将光标放在所需文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`）访问相关的\
  \ Java 和 Android 文档。这将显示包含相关参考文档的弹出窗口。例如，图 8-18 显示了 `FloatingActionButton` 类的文档。\n\
  \n![](img/as_code_editor_documentation_lookup_java.jpg)\n\n图 8-18\n\n## 8.10 代码格式化\n\
  \n通常情况下，Android Studio 编辑器会在添加语句和代码块时自动在缩进、间距和嵌套方面对代码进行格式化。在需要重新格式化代码的情况下（例如，从网站剪粘贴示例代码时），编辑器提供了源代码格式化功能，选中后将自动格式化代码以匹配主流的代码样式。\n\
  \n按下 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键序列重新格式化源代码。要显示 `Reformat Code` 对话框（图 8-19），请使用\
  \ `Ctrl-Alt-Shift-L`（macOS 上为 `Cmd-Opt-Shift-L`）。\n\n![](img/as_reformat_code.jpg)\n\
  \n图 8-19\n\n\n\n\n可以通过打开 Settings（设置）对话框并在侧边栏中选择 `Code Style` 来更改完整的代码样式偏好设置，访问支持的编程和标记语言列表。选择一种语言将提供大量的格式样式选项，所有选项都可以从\
  \ Android Studio 默认值修改以匹配你偏好的代码样式。例如，要配置上述对话框中的 `Rearrange`重排）代码选项，请展开 `Code Style`\
  \ 部分，选择 `Java`，并在 `Java` 设置中选择 `Arrangement（排列）选项卡。\n\n### 8.11 查找示例代码\n\nAndroid\
  \ Studio 编辑器提供了一种访问代码列表中当前高亮条相关示例代码的方法。此功能对于学习如何使用特定的 Android 类或方法非常有帮助。要查找示例代码，可以在编辑器中高亮方法或类名，右键点击它并选择\
  \ `Find Sample Code（查找示例代码）菜单选项。如果有示例代码，`Find Sample Code` 面板将会出现并列出匹配的示例。从列表中选择一个示例将把相应的代码加载到右侧面板。\n\
  \n### 8.12 Live Templates（实时模板）\n\n在编写 Android 代码时，你会发现有一些经常使用的常用结构。例如，一个常见的需求是使用\
  \ `Toast` 类向用户显示弹出消息。Live templates 是一个常用代码结构的集合，可以通过在编辑器中输入初始字符后按特殊键（默认设置为 `Tab`\
  \ 键）来插入模板代码。要亲体验这一操作，请在代码编辑器中输入 `toast` 然后按 `Tab` 键，Android Studio 将在光标位置插入以下代码并准备好进行编辑：\n\
  \n```java\nToast.makeText(, \"\", Toast.LENGTH_SHORT).show();\n```\n\n要列出并编辑现有模板、更改特殊键或添加自己的模板，请打开\
  \ Settings 对话框，并在左侧导航面板的 `Editor` 部分中选择 `Live Templates`：\n\n![](img/as_code_live_templates.jpg)\n\
  \n图 8-20\n\n使用上方 图 8-20 中标记为 A 的按钮来添加、删除、复制或重置模板。要修改模板，请从列表中选择它 (B) 并更改标记为 C 的面板中的设置。\n\
  \n### 8.13 总结\n\nAndroid Studio 编辑器尽力减少编写代码所需的打字量，并使代码更易阅读和导航。本章涵盖了编辑器的关键功能，包括代码补全、代码生成、编辑器窗口拆、代码折叠、重新格式化、文档查询和实时模板。\n\
  \n# 9. Android 架构概览\n\n到目前为止，书中已经采取了步骤来建立一个适用于使用 Android Studio 开发 Android 应用的环境。通过创建\
  \ Android Studio 应用项目，也已经迈出了应用开发过程的第一步。\n\n然而，在进一步研究 Android 应用开发的实际问题之前，理解 Android\
  \ SDK 以及更通用的 Android 开发中一些更抽象的概念至关重要。现在清晰地理解这些概念将为构建进一步知识提供坚实的基础。\n\n本章从对 Android\
  \ 架构的概述开始，并在书的后续几章中继续，目标是提供 Android 开发基础的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid\
  \ 的结构是一个软件堆栈，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构可以通过视觉方式表示得最好，如 图 9-1 所示。堆栈的每一层以及每层中对应的元素都紧密集成并经过仔细调整，以为移动设备提供最佳的应用开发和执行环境。本章的其余部分将介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel（Linux 内核）` 开始。\n\n![](img/Image2438.jpg)\n\n\
  图 9-1\n\n## 9.2 Linux 内核\n\n`Linux Kernel`位于 Android 软件栈的底部，在设备硬件和 Android 软件栈上层之间提供了抽象。内核提供了抢式多处理、底层核心系统服务（如内存、进程和电源管理），以及用于设备显示器、WiFi\
  \ 和音频等硬件的网络栈和设备驱动程序。\n\n原始 Linux 内核是由 Linus Torvalds 于 1991 年开发的。它与 Richard Stallman\
  \ 在自由软件基金开发的一系列工具、实用程序和编译器相结合，创建了一个名为 `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是从这些基础底层派生出来的，例如\
  \ Ubuntu 和 Red Hat Enterprise Linux。\n\n然而，需要注意的是，Android 仅使用 `Linux kernel`。尽管如此，值得注意的是，`Linux\
  \ kernel` 最初是为用于传统的桌面和服务器计算机系统而开发的。事实上，Linux 现在最广泛地部署在任务关键型企业服务器环境中。我们发现该软件位于 Android\
  \ 软件栈的核心，这既证明了今天移动设备的强大，也证明了 `Linux kernel` 的效率和性能。\n\n## 9.3 Android Runtime –\
  \ ART\n\n当在 Android Studio 中构建 Android 应用时，它会被编译为中间字节码格式（DEX 格式）。当随后将其加载到设备时，Android\
  \ Runtime (ART) 使用一种称为 Ahead-of-Time (AOT，预前编译）的过程将字节码翻译为设备处理器所需的本地器指令。这种格式被称为可执行和链接格式\
  \ (ELF)。\n\n每当随后启动应用程序时，都会运行 ELF 可执行版本，从而获得更应用性能和更长的电池寿命。\n\n这与旧版 Android 实现使用的\
  \ Just-in-Time (JIT，即时编译）方法形成对比，在每次启动应用程序时都在虚拟机 (VM) 内翻译字节码。\n\n## 9.4 Android 库\n\
  \n除了标准的 Java 开发库（提供字符串处理、网络和文件操作等通用任务的支持）外，Android 开发环境还包含 Android 库。这些是针对 Android\
  \ 开发的 Java 库。该类别的库包括应用程序框架库，以及有助于构建用户界面、图形绘制和数据库访问的库。\n\nAndroid 开发者可用的一些关键 Android\
  \ 库摘要：\n\n- `android.app`: 提供应用模型的访问，是所有 Android 应用的基石。\n- `android.content`: 促进应用程序和组件之间的内容访问、发布和消息传递。\n\
  - `android.database`: 用于访问内容提供者发布的数据并包含 SQLite 数据库管理类。\n- `android.graphics`: 底层\
  \ 2D 图形绘制 API，包括颜色、点、过滤器、矩形画布。\n- `android.hardware`: 提供了一个访问加速度计和光传感器等硬件的 API。\n\
  - `android.opengl`: OpenGL ES 3D 图形渲染 API 的 Java 接口。\n- `android.os`: 为应用程序访问标准操作系统服务，包括消息、系统服务和进程间通信。\n\
  - `android.media`: 提供用于音频和视频播放的类。\n- `android.net`: 一组提供访问网络栈的 API。包括 `android.net.wifi`，它提供对设备无线栈的访问。\n\
  \n\n\n\n\n- `android.print` – 包含一组类，允许从 Android 内部将内容发送到配置的打印机。\n- `android.provider`\
  \ – 一组便利类，提供对标准 Android 内容提供者数据库的访问，例如由日历和联系人应用维护的数据库。\n- `android.text` – 用于在设备显示上渲染和操作文本。\n\
  - `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期和时间操作等任务。\n- `android.view` – 应用用户界面的基础构建模块。\n\
  - `android.widget` - 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组类，旨在在应用程序中构建网页浏览功能。\n\n在涵盖了 Android 运行时基于 Java 的库之后，现在是时候将注意力转向 Android 软件栈这一层中基于\
  \ C/C++ 的库了。\n\n### 9.4.1 C/C++ 库\n\n前一节中概述的 Android 运行时核心库是基于 Java 的，为 Android\
  \ 开发者提供了主要的 API。然而，需要注意的是，核心库并没有执行许多实际工作，事实上，它们本质上是对一组基于 C/C++ 的库的 Java“封装器”。例如，在调用\
  \ `android.opengl` 库在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++ 库，而该库又与底层的 Linux 内核协作执行绘图任务。\n\
  \n包含 C/C++ 库是为了满足广泛多样化的功能，包括 2D 和 3D 图形绘制、安全套接层 (SSL) 通信、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准\
  \ C 系统库 (`libc`) 的实现。\n\n在实践中，典型的 Android 开发者将仅通过基于 Java 的 Android 库 API 访问这些库。如果需要直接访问这些库，可以使用\
  \ Android 原生开发包 (NDK) 实现，其目的是通过 Java Native Interface (JNI) 在 Java 代码中调用非 Java 或\
  \ Kotlin 语言（如 C 和 C++）的原生方法。\n\n### 9.5 应用程序框架\n\n应用程序框架是一系列服务，它们共同构成了 Android 运行和管理应用程序的环境。该框架实现了这样一个概念：Android\
  \ 应用程序是由可重用、可交换和可替换的组件构建的。这一概念进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序可以发现并重用它们。\n\nAndroid\
  \ 框架包含以下关键服务：\n- Activity 管理器 (Activity Manager) – 控制应用程序生命周期和 Activity 栈的所有方面。\n\
  - 内容提供者 (Content Providers) – 允许应用程序与其他应用程序共享数据。\n- 资源管理器 (Resource Manager) – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - 通知管理器 (Notifications Manager) – 允许应用程序向用户显示警告和通知。\n- 视图系统 (View System) – 用于创建应用程序用户界面的扩展视图集。\n\
  - 包管理器 (Package Manager) – 可以通过它查找设备上已安装的其他应用程序的信息。\n- 电话管理器 (Telephony Manager)\
  \ – 向应用程序提供设备可用电话服务的信息，例如状态和订阅者信息。\n- 位置管理器 (Location Manager) – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\
  \n### 9.6 应用程序\n\n位于 Android 软件栈顶端的是应用程序。它们由由特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用）以及用户在购买设备后安装的第三方应用程序组成。\n\
  \n### 9.7 总结\n\n良好的 Android 开发知识基础需要理解 Android 的整体架构。Android 被实现为一种软件栈架构，由 Linux\
  \ 内核、运行时环境、相应的库、应用程序框架和一组应用程序组成。应用程序主要用 Java 或 Kotlin 编写，并在 Android Studio 构建环境中被编译为字节码格式。当应用程序随后安装到设备上时，这些字节码将由\
  \ Android 运行时 (ART) 编译为 CPU 使用的原生格式。Android 架构的关键目标是性能和效率，既体现在应用程序执行中，也体现在应用程序设计的重用实现中。\n\
  \n# 10. Android 应用程序剖析\n\n无论你之前的编程经验如何（无论是基于 Windows、macOS、Linux 甚至 iOS），Android\
  \ 开发很可能与你以前遇到过的任何事情都完全不同。\n\n因此，本章的目标是让你对 Android 应用程序架构背后的高层概念有一个理解。在此过程中，我们将详细探讨用于构建应用程序的各种组件，以及允许这些组件协作以创建协调应用程序的机制。\n\
  \n## 10.1 Android Activity\n\n熟悉 Java、Kotlin、C++ 或 C# 等面向对象编程语言的人熟悉将应用程序功能元素封装到类中，然后实例化并进行操作以创建应用程序。这仍然适用，因为\
  \ Android 应用程序是用 Java 或 Kotlin 编写的。然而，Android 将重用组件的概念推到了更高的水平。\n\nAndroid 应用程序是通过组合一个或多个被称为\
  \ Activity 的组件创建的。Activity 是一个独立的应用程序模块，通常直接对应单个用户界面屏幕。例如，一个预约应用程序可能会有一个显示当天预约的\
  \ Activity 屏幕。该应用程序可能还会使用第二个 Activity，其屏幕允许用户输入新预约。\n\n## 10.2 Android Fragment\n\
  \n\n\n\n\n如上所述，一个活动（activity）通常代表应用中的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个对应的活动类文件来构建该活动。然而，更好的替代方案是将活动拆分为不同的部分。每个部分都是一个碎片（fragment），它由部分用户界面布局的一部分和一个匹配的类文件（声明为\
  \ `Android Fragment` 类的子类）组成。在这种情况下，活动变成了一个容器，可以在其中嵌入一个或多个碎片。\n\n碎碎片为让每个用户界面屏幕都由一个单独的活动表示提供了一种高效的替代方案。相反，一个应用可以有一个单一活动，在不同的碎片之间切换，每个碎片代表一个不同的应用屏幕。\n\
  \n## 10.3 Android 意图（Intents）\n\n意图是实现一个活动启动另一个活动，并实现构成应用程序的活动之间流转的机制。意图由要执行的操作描述以及可选的用于执行该操作的数据组成。\n\
  \n意图可以是显式的（explicit），即通过类名引用活动来请求启动特定的活动；也可以是隐式的（implicit），即通过说明要执行的操作类型或提供用于执行该操作的特定类型的数据。对于隐式意图，Android\
  \ 运行时将使用一种称为 `Intent Resolution`（意图解析）的过程，选择与 `Intent` 指定标准最匹配的活动进行启动。\n\n## 10.4\
  \ 广播意图（Broadcast Intents）\n\n另一种类型的 `Intent` 是广播意图，它是发送到所有注册了“感兴趣”的广播接收器（Broadcast\
  \ Receiver）的系统级意图。例如，Android 系统通常会发送广播意图来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕的开启或关闭。\n\
  \n广播意图可以是正常的（异步的），即它在基本相同的时间发送给所有感兴趣的广播接收器；也可以是有序的，即它一次发送给一个接收器，由其处理，然后要么终止要么允许传递给下一个广播接收器。\n\
  \n## 10.5 广播接收器（Broadcast Receivers）\n\n广播接收器是应用程序响应广播意图的机制。广播接收器必须由应用程序注册并配置 `Intent\
  \ Filter`（意图过滤器），以指示其感兴趣的广播类型。当广播一个匹配的意图时，无论注册接收器的应用程序当前是否正在运行，Android 运行时都会调用该接收器。接收器随后有\
  \ 5 秒的时间在返回之前完成所需的任务（例如启动 `Service`、进行数据更新或向用户发出通知）。广播接收器在后台运行，并且没有用户界面。\n\n## 10.6\
  \ Android 服务（Android Services）\n\nAndroid 服务是在后台运行且没有用户界面的进程。它们可以从活动、广播接收器或其他服务中启动和管理。Android\
  \ 服务适用于应用程序需要继续执行任务但并不一定需要用户可见用户界面的情况。虽然服务缺少用户界面，但它们仍然可以使用通知（notifications）和吐司（toasts，即屏幕上出现但不中断当前可见活动的小型通知消息）来通知用户事件，并且能够发布\
  \ `Intents`。\n\nAndroid 运行时赋予服务的优先级高于许多其他进程，系统只有在作为释放资源的最后手段时，才会终止掉这些服务。然而，如果运行时需要杀死一个\
  \ `Service`，一旦足够的资源变得可用，它将立即自动重启。`Service` 可以通过声明自己需要在前台运行来降低被终止的风险。这通过调用 `startForeground()`\
  \ 实现。这仅建议用于终止会对用户体验产生不利的影响（例如，如果用户正在收听由 `Service` 传输的音频）。\n\n`Service` 可能成为实际解决方案的示例情况包括（如之前提到的）：当应用程序不再活动时也应继续的音频流传输，或者当股票达到指定价格时需要通知用户的股票市场跟踪应用程序。\n\
  \n## 10.7 内容提供者（Content Providers）\n\n内容提供者实现了应用程序之间数据共享的机制。任何应用程序都可以通过实现 `Content\
  \ Provider` 来向其他应用程序提供对其底层数据的访问权限，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 `Content Provider`\
  \ 定义的通用资源标识符（`URI`）提供。数据可以以文件或整个 `SQLite` 数据库的形式共享。\n\n原生 Android 应用包含几个标准的内容提供者，允许应用程序访问联系人和多媒体文件等数据。在\
  \ Android 系统上可用的内容提供者可以使用 `Content Resolver` 进行定位。\n\n## 10.8 应用清单（The Application\
  \ Manifest）\n\n应用清单文件是将构成应用程序的各种元素结合在一起的胶水。在这个基于 XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\
  \n## 10.9 应用资源（Application Resources）\n\n除了清单文件和包含字节码的 `Dex` 文件外，Android 应用包通常包含一组资源文件。这些文件包含在用户界面中显示的资源，如字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。这些文件默认存储在应用程序项目层次结构中的 `/res` 子目录中。\n\n## 10.10 应用上下文（Application Context）\n\
  \n当应用程序被编译时，会创建一个名为 `R` 的类，其中包含对应用资源的引用。应用清单文件和这些资源结合形成了所谓的应用上下文（Application Context）。此上下文由\
  \ `Android Context` 类表示，可以在应用程序代码中使用，以便在运行时访问应用资源。此外，可以在应用程序上下文上调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 总结\n\n许多不同的元素可以组合成一个 Android 应用程序。在本章中，我们对活动、碎片、服务、意图和广播接收器进行了高层概述，并对清单文件和应用资源进行了概述。\n\
  \n通过以活动和意图的形式创建单个、独立的功能模块，可以最大限度地提高重用性和互操作性。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。然而，请放心，在随后的章节中，将对这些概念进行广泛的探索和实际使用，以为构建自己的应用程序奠定坚实的知识基础。\n\
  \n\n\n\n\n开发 Android 应用的一个组成部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的选项，重点介绍一种名为“视图绑定”（view\
  \ binding）的选项。在介绍视图绑定的基础知识后，本章将概述如何将 AndroidSample 项目转换为使用这种方法。\n\n## 11.1 通过 ID\
  \ 查找视图\n\n正如“Android 应用结构分析”章节概述的那样，构成应用程序的所有资源都被编译成一个名为 `R` 的类。在这些资源中包含了定义布局的资源。`R`\
  \ 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用都需要实现代码与这些视图之间的交互，例如，当读取在 `EditText`\
  \ 视图中输入的值或更改在 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问视图的最常用方法是编写代码通过\
  \ `findViewById()` 方法根据其 ID 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性。例如：\n\n```java\nexampleView.setText(\"Hello\");\n```\n\n\
  虽然通过 ID 查找视图仍然是一个可行的选项，但它存在一些局限性，`findViewById()` 最显著的缺点是可能会获取到一个尚未在布局中创建的视图引用，导致在尝试访问视图属性时出现空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经以视图绑定的形式提供了另一种从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定\n\n当应用模块中启用视图绑定时，Android\
  \ Studio 会为每个布局文件自动生成一个绑定类。在代码中可以使用此绑定类访问布局视图，而无需使用 `findViewById()`。\n\nAndroid\
  \ Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”，并在末尾附加“Binding”单词。例如，对于 `activity_main.xml`\
  \ 文件，绑定类将被称为 `ActivityMainBinding`。\n\nAndroid Studio Giraffe 在项目模板中使用视图绑定方面是不一致的。例如，我们在创建\
  \ AndroidSample 项目时使用的 Empty Views Activity 模板没有使用视图绑定。另一方面，Basic Views Activity\
  \ 模板是使用视图绑定实现的。如果你使用了一个未使用视图绑定的模板，那么了解如何将其添加到项目中是非常重要的。\n\n## 11.3 转换 AndroidSample\
  \ 项目\n\n在本章的剩余部分中，我们将通过将 AndroidSample 项目转换为使用视图绑定代替 `findViewById()` 来练习迁移到视图绑定。\n\
  \n首先启动 Android Studio 并打开在在 Android Studio 中创建示例 Android 应用章节中创建的 AndroidSample\
  \ 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须对每个需要视图绑定的模块的 `build.gradle.kts` 文件进行更改。对于\
  \ AndroidSample 项目，这需要对 Gradle Scripts -> `build.gradle.kts` (Module: app) 文件进行微调。将此文件加载到编辑器，找到\
  \ `android` 部分并添加以下项以启用 `viewBinding` 属性：\n\n```kotlin\nplugins {\n    id(\"com.android.application\"\
  )\n}\n\nandroid {\n    buildFeatures {\n        viewBinding = true\n    }\n}\n```\n\
  \n完成更改后，点击编辑器面板顶部的 `Sync Now` 链接，然后使用 Build 菜单清理并重新构建项目，以确保生成了绑定类。下一步是在代码中使用绑定类。\n\
  \n## 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”（inflate）视图绑定类以访问布局内的根视图。该根视图将用于用作布局的内容视图。\n\n执行这些任务的逻辑位置是在与布局关联的\
  \ Activity 的 `onCreate()` 方法中。典型的 `onCreate()` 方法如下：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n要切换到使用视图绑定，需要导入绑定类并按如下所示修改类。请注意，由于布局文件命名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类命名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域，则下方的导入语句需要更改以反映这一点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们有了绑定的引用，就可以通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n    } else {\n        textView.setText(R.string.no_value_string);\n\
  \    }\n}\n```\n\n编译并运行应用，验证货币转换是否仍然正常工作。\n\n## 11.6 选择选项\n\n尽管模板中未使用视图绑定，但 Google\
  \ 强烈建议尽可能使用视图绑定。因此，在开发自己的项目时应使用视图绑定。\n\n## 11.7 书中示例的视图绑定\n\n书中任何依赖未实现视图绑定的模板的章节将首先进行迁移。然而，为了避免每次需要迁移都重复这些步骤，这些章节将引导你此处刷新记忆（别担心，几个章节之后，这些必要的更改将变成本能）。为了方便操作，下节更简洁地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为视图绑定的过程涉及以下步骤：\n\n1. 编辑项目工具窗口中列出的 Gradle Scripts\
  \ -> `build.gradle.kts` (Module :app) 模块级 Gradle 构建脚本文件，其中 `<project name>` 是项目名称（例如\
  \ AndroidSample）。\n2. 找到文件的 `android` 部分并添加启用 `viewBinding` 属性。\n3. 点击编辑器顶部的 `Sync\
  \ Now` 链接，以这些新构建设置重新同步项目。\n\n\n\n\n\n## 4. 编辑 `MainActivity.java` 文件\n\n将其修改为如下内容（其中\
  \ `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 `androidsample`），`<binding\
  \ name>` 是对应布局资源文件的绑定类名称（例如，`activity_main.xml` 的绑定类为 `ActivityMainBinding`）。\n\n\
  ```java\nimport android.view.View;\nimport android.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = <binding name>.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n## 5. 通过绑定对象的属性来按名称访问视图。\n\
  \n## 11.9 总结\n\n在 Android Studio 3.6 引入之前，在 App 代码中访问布局视图需要使用 `findViewById()` 方法。现在有了另一种替代方案，即视图绑定（view\
  \ bindings）。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对应布局中每个视图的绑定，提供了比 `findViewById()`\
  \ 方法更安全的选项。然而，从 Android Studio Giraffe 版本开始，某些项目模板默认未启用视图绑定。需要额外的步骤来在每个项目模块中手动启用并配置支持。\n\
  \n## 12. 理解 Android 应用和 Activity 生命周期\n\n在早期的章节中，我们学习了 Android 应用程序运行在进程中，并由活动、服务和广播接收器形式的多个组件组成。本章旨在通过查看\
  \ Android 运行时系统中应用程序和 Activity 的周期来扩展这些知识。\n\n无论现在的移动设备与过去的桌面系统相比拥有多少内存和计算能力，重要的是，根据现代桌面和笔记本电脑的标准，这些设备仍然被认为是“资源受限”，特别是在内存方面。因此，Android\
  \ 系统的一个关键职责是确保这些有限资源得到有效管理，并确保操作系统及其运行的应用程序始终对用户保持响应。为了实现这一点，Android 对运行应用程序的进程周期和状态以及组成这些应用程序的各个组件具有完全控制权。\n\
  \n因此，开发 Android 应用的一个重要因素是理解 Android 的应用程序和 Activity 生命周期管理模型，以及应用程序如何在其执行生命周期内可能被施加的状态变化做出反应。\n\
  \n### 12.1 Android 应用与资源管理\n\n操作系统将每个运行的 Android 应用视为一个独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在确定终止哪个进程以释放内存时，系统会考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所称的“重要性层次结构”（importance hierarchy）。然后开始终止进程，从最低优先级开始按层级向上，直到为系统释放了足够的资源供其运行。\n\
  \n### 12.2 Android 进程状态\n\n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管的应用程序中排名最高的活动组件定义。如图\
  \ 12-1 所示，进程在任何给定时间都可以处于以下五种状态之一：\n\n![android_process_priorities.png](img/Image24381.jpg)\n\
  \n图 12-1\n\n#### 12.2.1 前台进程\n\n这些进程被分配了最高级别的优先级。在任何时候，活跃的前台进程可能不会超过一两个，它们通常是系统最后被终止的进程。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n- 托管一个用户当前正在与之交互的 Activity。\n- 托管一个与用户正在交互的 Activity 连接的 Service。\n- 托管一个通过调用\
  \ `startForeground()` 指明终止它会破坏用户体验的 Service。\n- 托管一个正在执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调的 Service。\n- 托管一个正在执行其 `onReceive()` 方法的广播接收器。\n\n#### 12.2.2\
  \ 可见进程\n\n包含一个对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个 Activity 对用户可见，但另一个\
  \ Activity（如部分屏幕或对话框）处于前台时。如果一个进程托管一个本身绑定到可见或前台 Activity 的 Service，该进程也具有获得可见状态的资格。\n\
  \n#### 12.2.3 服务进程\n\n包含一个已经启动且正在执行的 Service 的进程。\n\n#### 12.2.4 后台进程\n\n包含一个或多个当前对用户不可见的\
  \ Activity，且未托管符合服务进程状态的 Service 的进程。如果需要为高优先级进程释放额外内存，属于此类别的进程面临极高的终止风险。Android\
  \ 维护着后台进程的动态列表，按时间顺序终止进程，使得最久处于前台的进程首先被杀死。\n\n#### 12.2.5 空进程\n\n空进程不再包含活动应用程序，但保留在内存中，准备好作为新启动应用程序的托管者。这比比为了等乘客而保持车门开启、引擎运转。此类进程被认为优先级最低，是释放资源时首先被杀死。\n\
  \n### 12.3 进程间依赖\n\n确定最高优先级进程比上一节描述的要复杂，因为进程之间通常存在相互依赖。因此，在确定进程的优先级时，Android 系统还会考虑该进程是否以某种方式为另一个高优先级进程（例如，作为前台进程的内容提供者的服务进程）。作为一个基本规则，Android\
  \ 文档指出一个进程的排名永远不会低于它正在服务的另一个进程。\n\n### 12.4 Activity 生命周期\n\n正如我们之前确定的，Android 进程的状态主要由其托管的应用程序中\
  \ Activity 和组件的状态决定。因此，重要的是这些 Activity 在应用程序的执行生命周期内也会转换到不同的状态。Activity 的当前状态部分取决于它在所谓的\
  \ Activity 栈（Activity Stack）中的位置。\n\n### 12.5 Activity 栈\n\n\n\n\n\n运行时系统为 Android\
  \ 设备上运行的每个应用程序维护一个 `Activity Stack`（Activity 栈）。当应用程序启动时，第一个启动的应用程序 Activity 会被放置在栈中。当启动第二个\
  \ Activity 时，它被放置在栈顶，而之前的 Activity 则被推到栈下。位于栈顶的 Activity 被称为活跃（或正在运行的）Activity。当活跃\
  \ Activity 退出时，运行时会将其从栈中弹出，栈中紧邻其下方的 Activity 变为当前的活跃 Activity。例如，栈顶的 Activity 可能会因为其负责的任务已完成而退出。或者，用户可能选择了屏幕上的“返回”按钮以返回上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并销毁。Android `Activity Stack` 的视觉化表示如图图 12-2\n\
  \n图 12-2\n\n### 12.6 Activity 状态\n\n在应用程序执行过程中，Activity 可以处于几种状态之一：\n\n- **活跃 /\
  \ 运行（Active / Running）** – Activity 位于 `Activity Stack` 栈顶，是设备屏幕上可见的前台任务，拥有焦点，并且正在与用户交互。在资源不足的情况下，这种\
  \ Activity 最不容易被终止。\n- **暂停（Paused）** – Activity 对用户可见，但当前没有焦点（通常是因为当前活跃 Activity\
  \ 部分遮挡了此 Activity）。暂停的 Activity 保留在内存中，仍连接到窗口管理器，保留所有状态信息，并在移动到 `Activity Stack`\
  \ 栈顶时可以快速恢复到活跃状态。\n- **停止（Stopped）** – Activity 当前对用户不可见（也就是说，它在设备显示上被其他 Activity\
  \ 遮挡）。与暂停的 Activity 一样，它保留所有状态和成员信息，但在低内存情况下有更高的终止风险。\n- **已杀死（Killed）** – 运行时系统已终止该\
  \ Activity 以释放内存，且它不再存在于 `Activity Stack` 中。如果应用程序需要，必须重新启动此类 Activity。\n\n### 12.7\
  \ 配置更改（Configuration Changes）\n\n到本章为止，我们查看了 Android Activity 状态变化的两个原因，即 Activity\
  \ 在前台和后台之间的移动，以及运行时系统终止 Activity 以释放内存。事实上，还有第三种 Activity 状态可能发生剧变的情景，即涉及设备配置的更改。\n\
  \n默认情况下，任何影响 Activity 外观的配置更改（例如在竖屏和横屏之间旋转设备方向，或更改系统字体设置）都会导致 Activity 被销毁并重建。这背后的逻辑是，此类更改会影响用户界面布局等资源，销毁并重建受影响的\
  \ Activity 是 Activity 响应配置更改最快的方法。然而，可以配置 Activity，使系统不会响应特定的配置更改而重启它。\n\n### 12.8\
  \ 处理状态变化\n\n从本章可以清楚地看出，应用程序以及根据定义其中包含的组件在其生命周期内将经历许多状态转换。特别重要的一点是，这些状态变化（包括完全终止）是\
  \ Android 运行时根据用户的操作和设备上资源的可用性施加给应用程序的。\n\n在实践中，这些状态变化并非完全在没有任何通知的情况下发生的，在大多数情况下，应用程序会收到运行时系统的更改通知，并获得做出相应反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 提供了两种方法来处理 App 内对象生命周期状态的变化。一种方法涉及响应操作系统的状态变化方法调用，将在下一章[“处理 Android Activity\
  \ 状态变化`](Activity_State_Changes.xhtml__idTextAnchor315）中进行详细介绍。\n\nGoogle 推荐的新方法涉及包含在\
  \ Jetpack Android Architecture 组件中的生命周期类，这些类在[“使用 Jetpack 构建现代 Android 架构`](Modern_App_Architecture_Jetpack.xhtml__idTextAnchor734）中引入，并在标题为[“与\
  \ Android 生命周期感知组件工作`](Lifecycle_Components.xhtml__idTextAnchor808）的章节中进行了更详细的解释。\n\
  \n### 12.9 总结\n\n移动设备通常被认为资源受限，特别是在内置内存容量方面。因此，Android 操作系统的主要职责之一是确保应用程序以及整个操作系统对用户保持响应能力。\n\
  \n应用程序托管在 Android 的进程中。每个应用程序反过来以 Activity 和 Service 的形式组成组件。\n\nAndroid 运行时系统有权终止进程和单个\
  \ Activity 以释放内存。运行时系统在决定一个进程是否为终止的候选者时会考虑进程状态。进程的状态很大程度上取决于其托管的 Activity 的状态。\n\
  \n本章的核心信息是，应用程序在其执行生命周期内会处于各种状态，对其 Android 运行时环境中的命运几乎没有控制。不与用户直接交互的进程和 Activity\
  \ 被运行时终止的风险更高。因此，Android 应用程序开发的一个要素是应用程序响应状态变化通知的能力。\n\n# 13 处理 Android Activity\
  \ 状态变化\n\n根据标题为[“理解 应用程序和 Activity 生命周期`](Activity_Lifecycle.xhtml__idTextAnchor296）的章节中概述的信息，现在显然组成应用程序的\
  \ Activity 和 Fragment 在生命周期内通过许多不同的状态。Android 运行时系统实施从一个状态到另一个状态的更改，因此在很大程度上不受 Activity\
  \ 自身的控制。然而，这并不意味着应用程序无法对这些更改做出反应。\n\n本章的主要目标是提供 Activity 如何接收状态变化通知的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及\
  \ Activity 生命周期。\n\n### 13.1 新旧 生命周期技术\n\n\n\n\n直到最近，在应用中构建生命周期感知一直有一种标准方法。这种方法在本章中介绍，涉及在\
  \ activity 或 fragment 实例内部实现一组方法（每个生命周期状态对应一个方法），操作系统会在对象的生命周期状态发生变化时调用这些方法。这种方法自\
  \ Android 操作系统早期以来一直没有变化，虽然在今天仍然是一个可行选项，但它确实存在一些局限性，将在本章稍后部分进行解释。\n\n随着 Jetpack\
  \ Android 架构组件中生命周期类的引入，现在有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中详细介绍。然而，出于以下几个原因，理解传统的生命周期方法仍然非常重要。首先，作为一名\
  \ Android 开发者，你无法完全脱离传统的生命周期方法，并且仍然会使用其中一些。更重要的是，理解处理生命周期的旧方法将为在书的后期学习新方法提供坚实的基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n除少数例外外，应用的 activity 和 fragment 分别作为 Android `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类被创建。\n\n例如，考虑在“在 Android Studio 中创建示例 Android 应用`中创建并随后转换为使用视图绑定（view\
  \ binding）的 `AndroidSample` 项目。将此项目加载到 Android Studio 环境并找到 `MainActivity.java`\
  \ 文件（位于 `app` -> `java` -> `<your domain>` -> `androidsample`）。找到文件后，双击将其加载到编辑器中，其内容应如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(\n                    binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \                    String.format(Locale.ENGLISH,\"%.2f\", euroValue));\n     \
  \   } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时也创建了一个名为 `MainActivity.java`\
  \ 的初始 activity。如上面的代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身也是 `Activity` 类的子类。可以在 Android Studio 编辑器中使用层次结构（Hierarchy）工具窗口来验证这一点。当\
  \ `MainActivity.java` 文件加载到编辑器中时，点击类声明行中的 `AppCompatActivity` 并按下快捷键 `Ctrl-H`。随后将弹出层次结构工具窗口，显示所选类的类层次结构。如图\
  \ 13-1 所示，`AppCompatActivity` 派生自 `FragmentActivity` 类，而 `FragmentActivity` 最终也是\
  \ `Activity` 类的子类：\n\n![](img/as_class_hierarchy.jpg)\n\n图 13-1\n\nActivity 和 Fragment\
  \ 类包含系列方法，旨在由 Android 运行时调用以通知对象其状态正在变化。在本章中，我们将这些方法称为生命周期方法。activity 或 fragment\
  \ 类需要重写这些方法，并实现必要的功能以对状态变化做出相应响应。\n\n其中一个方法名为 `onCreate()`，再次回到上面的代码片段，我们可以看到该方法在\
  \ `MainActivity` 类中已经为我们重写并实现。在后面的章节中，我们将探索 `onCreate()` 以及 `Activity` 和 `Fragment`\
  \ 类的其他相关生命周期方法。\n\n## 13.3 动态状态与 持久化状态\n\n生命周期管理的核心目标是确保在适当的时间保存并恢复 activity 的状态。当我们在此处讨论状态时，指的是当前\
  \ activity 持有的数据。例如，activity 可能在内存中维护一个数据模型，该模型需要保存到数据库、内容提供程序或文件。由于它可以跨应用程序调用而存在，因此这种状态信息被称为持久化状态（persistent\
  \ state）。\n\n用户界面的显示（例如输入字段中但尚未提交到数据模型的文本）被称为动态状态（dynamic state），因为它通常只在应用的单次调用期间保留（也称为实例状态\
  \ instance state）。理解这两种状态之间的差异很重要，因为它们保存的方式以及保存的原因各不同。\n\n保存持久化状态的目的是避免 activity\
  \ 在后台运行时被杀死可能导致的数据丢失。\n\n例如，假设一个应用包含一个 activity（我们将其称为 Activity A），该应用包含一个文本框和一些单选按钮。在使用应用的过程中，用户在文本框中输入了一些文本并从单选按钮中做了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ activity，导致 Activity A 被推入 Activity 栈（Activity Stack）并在并在后台运行。一段时间后，运行时系统确定内存不足，并杀杀了\
  \ Activity A 以释放资源。然而，对于用户而言，Activity A 只是被放在了后台，可以随时移动到前台。当返回 Activity A 到前台时，用户会合理地预期输入的文本和单选按钮的选择会被保留。但在这种情况下，会创建一个\
  \ Activity A 的新实例，如果没有保存和恢复动态状态，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是为了提供在前台和后台 activity\
  \ 之间无缝切换的感知，无论 activity 是否在用户不知情的情况下被杀掉并重启。\n\n## 13.4 Android 生命周期周期方法\n\n如前所述，Activity\
  \ 和 Fragment 类包含多个生命周期方法，当实例状态变化时作为事件处理器工作。Android Activity 和 Fragment 类支持的主要方法如下：\n\
  \n\n\n\n\n## Activity 生命周期\n\n- `onCreate(Bundle savedInstanceState)` – 在 activity\
  \ 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个 `Bundle` 对象形式的参数，该对象可能包含来自 activity 上次调用的动态状态信息（通常与用户界面的状态有关）。\n\
  - `onRestart()` – 当 activity 在之前被运行时系统停止后准备重新启动时调用。\n- `onStart()` – 始终在调用 `onCreate()`\
  \ 或 `onRestart()` 方法后立即被调用。此方法通知 activity 它即将对用户可见。如果 activity 移动到 activity 栈的顶端，则此调用将随后调用\
  \ `onResume()`；如果它被另一个 activity 压入栈底，则将调用 `onStop()`。\n- `onResume()` – 表示 activity\
  \ 现在处于 activity 栈的顶端，并且是用户当前正在交互的 activity。\n- `onPause()` – 表示上一个 activity 即将成为前景\
  \ activity。此调用将随后调用 `onResume()` 或 `onStop()` 方法，取决于 activity 是返回到前台还是对用户不可见。在此方法中可以采取措施来存储应用尚未保存的持久化状态信息。为了避免切换\
  \ activity 时的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应确保停止动画等 CPU 密集任务。\n- `onStop()`\
  \ – activity 不对用户可见。此调用后的两种可能场景是：如果 activity 再次回到前台，则调用 `onRestart()`；如果 activity\
  \ 被终止，则调用 `onDestroy()`。\n- `onDestroy()` – activity 即将销毁，可能是因为 activity 完成了任务并调用了\
  \ `finish()` 方法，也可能是运行时为了释放内存或由于配置更改（如设备方向改变）而终止它。需要注意的是，当 activity 终止时并不总是会调用 `onDestroy()`。\n\
  - `onConfigurationChanged()` – 当发生配置更改且该 activity 指明不需要重启时调用。该方法传递一个 `Configuration`\
  \ 对象，概述了新的设备配置，然后由 activity 负责对更改做出响应。\n\n### Fragment 生命周期\n\n以下生命周期方法仅适用于 `Fragment`\
  \ 类：\n\n- `onAttach()` - 在 fragment 分配给 activity 时调用。\n- `onCreateView()` - 用于创建并返回\
  \ fragment 的用户界面布局视图层级结构。\n- `onViewCreated()` - 在 `onCreateView()` 返回后调用。\n- `onViewStatusRestored()`\
  \ - fragment 保存的视图层级结构已恢复。\n\n### 状态管理\n\n除了上述的生命周期方法外，还有两个方法专门用于保存和恢复 activity\
  \ 的动态状态：\n\n- `onRestoreInstanceState(Bundle savedInstanceState)` – 如果 activity\
  \ 从之前保存了状态的调用重启，此方法会在调用 `onStart()` 方法后立即被调用。与 `onCreate()` 一一样，此方法传递一个包含之前状态数据的\
  \ `Bundle` 对象。当在 `onCreate()` 和 `onStart()` 中完成 activity 初始化后，恢复之前的状态更有意义时，通常会使用此方法。\n\
  - `onSaveInstanceState(Bundle outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法传递一个\
  \ `Bundle` 对象，状态应保存到其中，该对象随后会在 activity 重启时被传递给 `onCreate()` 和 `onRestoreInstanceState()`\
  \ 方法。请注意，只有当运行时确定需要保存动态状态时，此方法才会被调用。\n\n在重写上述方法时，请记住，除了 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，以下方法重写了 `onRestart()` 方法，但也包含了对父类实例方法的调用：\n\
  \n```java\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n```\n\n在方法重写中未调用此父类方法将导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 方法中对父类的调用是可选的（例如，在实现自定义的保存和恢复行为时可以省略它们），但使用它们有很大的益处，这一主题将在名为保存和恢复\
  \ Android Activity 状态”的章节中介绍。\n\n## 13.5 生命周期\n\n最后一个要涵盖的的话题涉及 activity 或 fragment\
  \ 在执行过程中经历的整个、可见的前景生命周期的概述：\n\n- **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从首次调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- **可见生命周期 (Visible Lifetime)**\
  \ – 涵盖调用 `onStart()` 到 `onStop()` 之间的执行期间。在此期间，activity 或 fragment 对用户可见，尽管它可能不是用户当前正在交互的对象。\n\
  - **前景生命周期 (Foreground Lifetime)** – 指调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\
  \n需要注意的是，activity 或 fragment 在整个生命周期期间可能会多次通过前景和可见生命周期。\n\n生命周期和生命周期方法的概念在图 13-2\
  \ 中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\
  \n## 13.6 折叠屏设备与多恢复\n\n\n\n\n\n如前所述，一个活动可以指示在某些配置更改发生时不重新启动。这是通过在项目清单文件（manifest\
  \ file）的 activity 元素中添加 `android:configChanges` 指令来实现。例如，下面的清单文件片段表明，当发生与方向或设备全局字体相关的配置更改时，不应重启该活动：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n          android:configChanges=\"\
  orientation|fontScale\"\n          android:label=\"@string/app_name\">\n```\n\n\
  ## 13.8 生命周期周期方法的局限性\n\n正如本章开头所讨论的，生命周期方法已经使用了多年，直到最近，它们仍然处理 activity 和 fragment\
  \ 生命周期周期状态变化的唯一机制。然而，这种方法仍有改进空间。\n\n生命周期方法的一个问题是，它们没有为 activity 或 fragment 提供一种简单的方法在应用执行过程的任何点发现其当前的生命周期状态。相反，对象必须在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为特定 activity 或 fragment\
  \ 的生命周期状态变化可能会影响应用内的许多其他对象。\n\n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期（lifecycle\
  \ aware）的自定义类。\n\n最后，生命周期方法导致大多数生命处理代码被编写在 activity 或 fragment 内部，这可能导致复杂且易出错的代码。理想情况下，这些代码大部分位于受状态变化影响的其他类中。例如，一个流媒体视频应用可能会包含一个专门用于管理输入流的类。如果应用需要在主活动停止时暂停流，那么相应的代码应该位于流媒体类中，而不是主活动中。\n\
  \n所有这些以及其他问题都可以通过使用**生命感知感知组件**来解决，该主题将从名为“Jetpack Modern Android Architecture”的章节开始介绍。\n\
  \n## 13.9 总结\n\n所有的 activity 都派自 `Android Activity` 类，该类包含了几个生命周期方法，这些方法被设计为运行时系统在\
  \ activity 状态更改时调用。同样，`Fragment` 类也包含类似的方法。通过重写这些方法，activity 和 fragment 可以响应状态变化，并在必要时采取步骤保存并恢复\
  \ activity 和应用程序当前的状态。生命周期状态可以被认为有两种形式。持久状态（persistent state）指的是应用调用之间需要存储的数据（例如存储到文件或数据库）。另一方面，动态状态（dynamic\
  \ state）与用户界面的当前显示有关。尽管生命周期方法有一些可以使用生命感知组件避免的局限性，但理解这些方法对于充分理解书中后面介绍的生命管理新方法至关重要。\n\
  \n在本章中，我们强调了 activity 可用的生命周期方法，并涵盖了活动生命周期的概念。在下一章（“通过示例 Android Activity 状态变化”）中，我们将实现一个示例应用，将这些许多理论付诸实践。\n\
  \n## 14. 通过示例 Android Activity 状态变化\n\n之前的章节详细讨论了构成 Android 应用程序的 activity 的不同状态和生命周期。在本章中，我们将通过创建一个示例应用，将处理\
  \ activity 状态变化的理论付诸实践。该示例应用的目的是演示 activity 在 Android 运行时通过各种状态的真实场景。在下一章（“保存和恢复\
  \ Android Activity 状态”）中，在本章构建的示例项目将被扩展，以演示动态 activity 状态的保存和恢复。\n\n### 14.1 创建状态变化示例项目\n\
  \n练习的第一步是创建一个新项目。启动 Android Studio，如果有必要，使用 `File -> Close Project` 菜单选项关闭当前打开的项目，以便显示欢迎界面。\n\
  \n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段输入 `StateChange` 并指定 `com.ebookfrenzy.statechange` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language` 菜单设置为\
  \ `Java`。完成项目创建过程后，`StateChange` 项目应出现在 Android Studio 主窗口左侧的 `Project` 工具窗口。。使用\
  \ 11.8 迁移项目到 View Binding 部分概述的步骤将项目转换为使用 `view binding`。\n\n接下来的操作涉及 activity 的用户界面设计。它存储在名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有加载，请在 `Project` 工具窗口中导航到它，可以在\
  \ `app -> res -> layout` 文件夹中找到它。一旦找到，双击文件将将其加载到 Android Studio Layout Editor 工具中。\n\
  \n![](img/as_state_change_main_window.jpg)\n\n图 14-1\n\n### 14.2 设计用户界面\n\n当用户界面布局加载到\
  \ `Layout Editor` 工具后，是时候为示例应用设计用户界面了。与其界面设计中目前的“Hello World!” `TextView`，activity\
  \ 需要一个 `EditText` 视图。在 `Component Tree` 面板中选择 `TextView` 对象并按键盘上的 `Delete` 键将其从设计中删除。\n\
  \n从 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，并从文本列表中点击并拖动 `Plain Text` 组件到布局画布上。将组件移动到显示中心，使出现中心引导线，并将其放置到位，使布局类似于图\
  \ 14-2。\n\n![](img/as_statechange_ui.jpg)\n\n图 14-2\n\n在使用 `EditText` 控件时，有必要为视图指定一个\
  \ `inputType`。这定义了用户将输入的文本或数据类型。例如，如果输入类型设置为 `Phone`，则用户将被限制在视图中输入数字。或者，如果输入类型设置为\
  \ `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以组合使用。\n\n对于此示例，我们将使用默认输入类型以支持通用文本输入。将来要选择不同的设置，请在布局中选择\
  \ `EditText` 控件并在 `Attributes` 工具窗口中找到 `inputType` 条目。接下来，点击当前设置左侧的标志图标以打开选项列表，如下方的图\
  \ 14-3 所示。`Type` 菜单提供了限制输入为文本、数字、日期时间以及电话号码的选项。`Variations` 菜单为当前选择的输入类型提供了额外的选项。例如，文本输入类型有一个用于电子邮件地址输入的变体。\n\
  \n\n\n\n一旦选定了类型和变体，可以使用标志复框列表进一步对输入类型进行自定义：\n\n![](img/as_text_input_type_menu.jpg)\n\
  \n图 14-3\n\n在`Attributes`属性工具窗口中，将视图的`id`更改为`editText`，然后点击弹出对话框中的`Refactor`重构）按钮。\n\
  \n默认情况下，`EditText`显示的文本为“Name”。继续留在`Attributes`面板中，删除`text`属性字段中的该内容，使该视图在布局中保持为空。\n\
  \n在继续之前，点击布局编辑器工具栏上的`Infer Constraints`推断约束）按钮以添加任何缺失的约束。\n\n### 14.3 重写 Activity\
  \ 生命周期方法\n\n此时，项目包含一个名为`MainActivity`的 activity，它派自`AppCompatActivity`类。该 activity\
  \ 的源代码包含在`MainActivity.java`文件中，该文件应该已经在编辑器会话中打开并由编辑器标签栏中的标签页表示。如果文件未打开，请在`Project`工具窗口面板中导航到它（`app\
  \ -> java -> com.ebookfrenzy.statechange -> MainActivity`），并双击它将文件加载到编辑器。\n\n到目前为止，activity\
  \ 重写的唯一生命方法是`onCreate()`方法，该方法已实现为在为 activity 设置用户界面之前调用该方法的父类实例。现在我们将修改此方法，以便在每次执行时都能在\
  \ Android Studio 的`Logcat`面板中输出一条诊断消息。为此，我们将使用`Log`类，这要求我们导入`android.util.Log`并声明一个标签（tag），以便我们在日志输出中过滤这些消息：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\n.\n.\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ static final String TAG = \"StateChange\";\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用`Alt-Insert`键盘快捷键生成，如标题为\
  \ Android Studio 代码编辑器基础”的章节所述。请注意，如果方法是自动生成的，仍然需要手动添加`Log`调用：\n\n```java\n@Override\n\
  protected void onStart() {\n    super.onStart();\n    Log.i(TAG, \"onStart\");\n\
  }\n\n@Override\nprotected void onResume() {\n    super.onResume();\n    Log.i(TAG,\
  \ \"onResume\");\n}\n\n@Override\nprotected void onPause() {\n    super.onPause();\n\
  \    Log.i(TAG, \"onPause\");\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  \    Log.i(TAG, \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n   \
  \ super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\
  \n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState) {\n  \
  \  super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n在`MainActivity.java`的重写方法中添加代码目的是将日志信息输出到`Logcat`工具窗口，该窗口通过图\
  \ 14-4 所示的按钮显示：\n\n![](img/as_logcat_button.jpg)\n\n图 14-4\n\n`Logcat`工具窗口可以配置为显示与设备或模拟器会话相关的所有事件，或者限制为与当前所选应用相关的事件。输出也可以限制为仅匹配特定过滤器的日志事件。\n\
  \n当在当前应用运行时显示时，`Logcat`工具窗口将如下方的图 14-5 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  \n图 14-5\n\n上方标记为 A 的菜单允许您选择显示日志输出的设备或模拟器。此输出出现在标记为 C 的输出面板中。可以通过在标记为 B 的字段中输入选项来过滤日志输出。默认键设置`package:mine`将输出限制为当前应用包（在本例中为`com.ebookfrenzy.statechange`）生成的日志消息。留空此字段将允许显示来自设备或模拟器的日志输出，包括操作系统生成的诊断消息。也可以组合键来进一步过滤输出。例如，我们可以如下配置`Logcat`面板，仅显示与我们的`StateChange`标签相关的消息：\n\
  \n`package:mine tag:StateChange`\n\n我们可以通过在键值前加上负号来排除输出。例如，我们可以配置`Logcat`面板仅显示与我们的`StateChange`标签相关的消息如下：\n\
  \n`package:mine tag:StateChange`\n\n我们可以通过在键值前加上负号（`-`）来排除输出。除了`StateChange`标签外，我们可能有一个使用标签的诊断消息。为了过滤掉第二个标签的输出，我们可以输入以下键：\n\
  \n`package:mine tag:StateChange -tag:OtherTag`\n\n除了标签值，还可以从 Android 内置的一系列标签中选择。当你在过滤器字段中输入时，Logcat\
  \ 将显示匹配的标签，如图 14-6 所示：\n\n![](img/as_logcat_filter_suggestions.jpg)\n\n图 14-6\n\n\
  或者，使用`Ctrl-Space`访问完整的过滤建议列表。\n\n`level`键可以根据严重程度控制显示哪些消息。为了显示错误消息，可以使用：\n\n`level:error`\n\
  \n除了 error，Logcat 面板还支持`verbose`、`info`、`warn`和`assert`级别。\n\nLogcat 还支持多个面板，每个面板都有自己的过滤设置。要添加另一个面板，点击图\
  \ 14-5 中标记为 D 的`+`按钮。通过相应的标签在不同面板之间切换，或者通过右键点击当前显示的面板并选择`Split-Right`（向右分）或`Split-Down`（向下分）选项来水平或垂直排列面板。要重命名面板，右键点击标签并选择\
  \ Rename Tab 选项。在继续之前，关闭除一个以外的所有 Logcat 面板并配置如下：\n\n`package:mine tag:StateChange`\n\
  \n### 14.5 运行应用程序\n\n为了获得最佳结果，应在物理 Android 设备或模拟器上运行应用程序。在设备配置并连接到开发计算机后，点击 Android\
  \ Studio 工具栏上的运行按钮，如下方的图 14-7 所示：\n\n![](img/as_run_button.jpg)\n\n图 14-7\n\n从`Choose\
  \ Device`对话框中选择物理 Android 设备或模拟器（假设尚未尚未配置为默认目标）。在 Android Studio 构建应用程序并将其安装到设备上之后，它应该启动并在前台运行。\n\
  \n查看 Logcat 面板可以指示到目前为止触发了哪些方法：\n\n![](img/as_logcat_app_running.jpg)\n\n图 14-8\n\
  \n### 14.6 测试 Activity\n\n既然诊断功能工作正常，现在是时候通过操作应用程序来理解 activity 生命周期状态变化了。首先，考虑 Logcat\
  \ 面板中的初始日志序列：\n\nonCreate\n\nonStart\n\nonResume\n\n\n\n显然，初始状态的变化与“理解 Android 应用程序和\
  \ Activity 生命周期”中概述的描述完全一致。但请注意，由于 Android 运行时检测到在这种情况下没有需要恢复的状态，因此没有调用 `onRestoreInstanceState()`。\n\
  \n点击设备显示器底部状态栏上的 `Home` 图标，并注意日志中报告的方法调用序列如下：\n\n```\nonPause\nonStop\nonSaveInstanceState\n\
  ```\n\n在这种情况下，运行时注意到该 activity 已不再处于前台，对用户不可见，并且已经停止了该 activity，但并不是没有给 activity\
  \ 提供保存动态状态的机会。取决于运行时最终是销毁了 activity 还是重启了它，该 activity 将会通过调用 `onRestart()` 被通知其已重启，或者在用户返回该\
  \ activity 时再次经历创建序列。\n\n正如“理解 Android 应用程序和 Activity 生命周期”中概述的，activity 的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要直观看到这一过程，请在\
  \ `StateChange` 应用程序处于前台时旋转设备。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。这显示在设备或模拟器的屏幕底部，如图\
  \ 14-9 所示：\n\n![](img/android_rotate_button.jpg)\n\n图 14-9\n\n日志中产生的方法调用序列如下：\n\n\
  ```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在 activity 销毁和重启之前允许其保存了状态。\n\n# 14.7 总结\n\n“一画胜于千言”这句格言在学习新编程范式的示例中也同样适用。在本章中，我们创建了一个\
  \ Android 应用程序示例，用以演示 activity 可能会经历的不同生命周期状态。在开发本项目期间，我们还查看了从 activity 内部生成诊断日志信息的机制。\n\
  \n在下一章中，我们将扩展 `StateChange` 示例项目，以演示如何保存和恢复 activity 的动态状态。\n\n# 15. 保存和恢复 Android\
  \ Activity 的状态\n\n如果前面的几章已经实现了目标，那么现在对于在 activity 生命的特定时间点保存和恢复用户界面状态的重要性应该变得更加清晰了。\n\
  \n在本章中，我们将扩展在“通过示例理解 Android Activity 状态变化”](#Activity_State_Example.xhtml__idTextAnchor327)中创建的示例应用程序，演示运行时系统销毁和重建\
  \ activity 时涉及保存和恢复状态的步骤。\n\n保存和恢复动态状态的关键组件涉及使用 Android SDK 中的 `Bundle` 类，这个主题在本章中也会涵盖。\n\
  \n## 15.1 保存动态状态\n\n正如我们所学的，activity 可以通过运行时系统调用 activity 的 `onSaveInstanceState()`\
  \ 方法实现来保存动态状态信息。作为方法的参数传递的是一个 `Bundle` 对象的引用，方法必须将任何需要保存的动态数据存储其中。随后，`Bundle` 对象将由运行时代表\
  \ activity 进行存储，并在调用这些方法时，作为参数传递给 activity 的 `onCreate()` 和 `onRestoreInstanceState()`\
  \ 方法。然后，可以在这些方法内部从 `Bundle` 对象中检索数据，并用于恢复 activity 的状态。\n\n## 15.2 用户界面状态的默认保存\n\
  \n在上一章中，`StateChange` 示例应用程序的诊断输出显示，当运行它的设备旋转足够大以触发方向变化时，activity 会经历多次状态变化。\n\n\
  再次启动 `StateChange` 应用程序，并在执行设备旋转之前向 `EditText` 字段输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中应出现以下状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 activity 的销毁和重建。然而，查看运行中应用程序的用户界面，应该发现输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 activity 被销毁并重建了，而我们并没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图控件（widgets）已经实现了当 activity 自动重启时保存和恢复状态所需的行为。启用此行为的唯一要求是\
  \ activity 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法必须包含对父类对应方法的调用：\n\
  \n```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n可以通过 XML 布局文件通过将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的自动状态保存。可以通过在\
  \ XML 布局文件中将 `android:saveEnabled` 属性设置为 `false` 来关闭用户界面视图的自动状态保存。在本示例中，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动保存机制，然后在应用程序中中手动保存和恢复视图的状态。\n\n为了配置 `EditText` 在 activity 重启时不保存和恢复状态，请编辑\
  \ `activity_main.xml` 文件，使视图条目如下所示（正如“在 Android Studio 中创建 Android 应用”](#Sample_App.xhtml__idTextAnchor01)中概述，可以通过布局编辑器切换到代码模式来编辑\
  \ XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n进行更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\
  \n## 15.3 Bundle 类\n\n对于需要在界面视图控件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与键关联的值可以是原始值，也可以任何实现了\
  \ Android `Parcelable` 接口的对象。广泛的类已经实现了 `Parcelable` 接口。自定义类可以通过实现 `Parcelable` 接口定义的方法集来变为“可序列化的”，其详细信息可以在\
  \ Android 文档中找到：\n\n\n\n\n\n[`developer.android.com/reference/android/os/Parcelable.html`](http://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始数据类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（例如 `Strings` 和 `CharSequenceences`）。\n\n在本示例中，由于禁用了 `EditText` 视图的文本自动保存功能，我们需要确保用户输入到\
  \ `EditText` 字段中的文本被保存到 `Bundle` 对象中并在随后进行恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别使用\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n## 15.4 保存状态\n\
  \n扩展 `StateChange` 应用的第一步是确保在 `MainActivity` 节点（activity）的 `onSaveInstanceState()`\
  \ 方法中从 `EditText` 组件中提取用户输入的文本，然后将其作为键值对保存到 `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们必须首先在用户界面中识别该对象。显然，这涉及到在\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源代码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间建立桥梁。为了提取输入 `EditText` 组件的文本，我们需要获取该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，布局编辑器（Layout\
  \ Editor）工具根据对象类型为新添加的组件构建 id。如果布局中包含多个相同类型的视图，则类型名称后面会跟一个顺序数字（尽管开发者可以并且应该将其更改为更具意义的内容）。正如在选中\
  \ `activity_main.xml` 文件并显示布局编辑器工具时，通过检查 Android Studio 主窗口中的组件树（Component Tree）面板所示，`EditText`\
  \ 组件被分配了 id `editText`：\n\n![](img/as_component_tree1.jpg)\n\n图 15-1\n\n我们现在可以通过对象的\
  \ `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来返回当前文本：\n\n```java\nCharSequence userText\
  \ = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()`\
  \ 方法保存文本，并将键（这可以是任何字符串值，在本例中我们将将其声明为“savedText”）和 `userText` 对象作为参数：\n\n```java\n\
  outState.putCharSequence(\"savedText\", userText);\n```\n\n将所有这些整合在一起，我们在 `MainActivity.java`\
  \ 文件中得到了修改后的 `onSaveInstanceState()` 方法，内容如下：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n.\n    protected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n        super.onSaveInstanceState(outState);\n\
  \        Log.i(TAG, \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n.\n.\n```\n\n\
  现在已经采取了保存状态的步骤，下一阶段是在需要时恢复它。\n\n## 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择使用\
  \ `onCreate()` 或 `onRestoreInstanceState()`。使用哪个方法取决于 Activity 的性质。在 Activity 执行初始化任务后最适合恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。在本示例中，我们将向 `onRestoreInstanceState()` 方法中添加代码，使用“savedText” 键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText =\n        savedInstanceState.getCharSequence(\"savedText\"\
  );\n    binding.editText.setText(userText);\n}\n```\n\n## 15.6 测试应用程序\n\n剩下的只是再次构建并运行\
  \ `StateChange` 应用程序。运行并处于前台时，触摸 `EditText` 组件，并在旋转设备到另一种方向之前输入一些文本。以前文本的更改将会丢失，但得益于我们在本章中为\
  \ Activity 添加的代码，新文本将保留在 `editText` 组件中。\n\n在验证代码执行符合预期后，注释掉这两个方法中的 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用并注意在设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现取代，从而提供了一种在\
  \ Activity 中动态且选择性保存和恢复状态的方法。\n\n## 15.7 总结\n\n在 Android 应用程序中保存和恢复动态状态取决于实现适当生命周期方法。对于大多数用户界面视图，这由\
  \ Activity 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据作为键值对保存到传递的\
  \ `Bundle` 对象中。\n\n状态可以在 Activity 的 `onCreate()` 或 `onRestoreInstanceState()` 方法中恢复，通过从\
  \ `Bundle` 对象中提取值并更新 Activity。\n\n在本章中，我们使用这些技术更新了 `StateChange` 项目，使 Activity 在销毁和随后重建后保留更改。\n\
  \n## 16. 理解 Views、View Groups 和 Layouts\n\n除了听流媒体外，用户与 Android 设备的交互主要是视觉和触觉的。所有这些交互都通过设备上安装应用程序的用户界面进行，包括内置应用程序和用户安装的第三方应用程序。因此，开发\
  \ Android 应用程序的关键元素之一涉及设计和创建用户界面。\n\n本章涵盖了 Android 用户界面结构，包括组合成用户界面的元素：`Views`、`View\
  \ Groups` 和 `Layouts`。\n\n### 16.1 针对不同 Android 设备的设计\n\n“Android 设备”一词涵盖了许多具有不同尺寸和分辨率的平板电脑和平手机。因此，应用程序用户界面现在必须仔细设计，以确保在尽可能广泛范围内正确显示。其关键部分之一是确保用户界面布局在不同设备上运行时能够正确调整大小。这在很大程度上可以通过仔细规划和使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数 Android 手机和平板电脑都可以以竖向或横向持有。良好的用户界面应该能够适应这种变化并进行合理的布局调整，以利用每个方向的可用空间。\n\
  \n### 16.2 Views and View Groups\n\n\n\n\n用户界面中的每个项目都是 `Android View` 类的子类（准确来说是\
  \ `android.view.View`）。Android SDK 提供了一组预构建的视图，可用于构建用户界面。典型的示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar`\
  \ 和 `TextView` 类。这些视图也被称为控件（widgets）或组件（components）。对于 SDK 提供的控件无法满足的需求，可以通过子类和扩展现有类来创建新视图，或者通过直接在\
  \ `View` 类之上构建创建一个完全全新的组件。\n\n视图也可以包含多个其他视图（也称为复合视图，composite view）。此类视图派生自 `Android\
  \ ViewGroup` 类（`android.view.ViewGroup`），而该类本身是 `View` 的子类。这种视图的一个示例是 `RadioGroup`，它旨在包含多个\
  \ `RadioButton` 对象，以便确保在任何时间都只有一个对象处于“开启”状态。从结构上来说，复合视图由单个父视图（派自 `ViewGroup` 类，也称为容器视图或根元素）组成，它可以包含其他视图（称为子视图）。\n\
  \n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\n### 16.3 Android 布局管理器\n\n除了上一节讨论的控件式视图外，SDK\
  \ 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派生自 `ViewGroup`），设计用于控制子视图在屏幕上的定位方式。\n\nAndroid\
  \ SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\n*   `ConstraintLayout` – 在 Android 7 中引入，这种布局管理器是大多数布局需求的推荐选择器。`ConstraintLayout`\
  \ 允许通过分配给每个子视图的简单约束设置来定义布局中视图的位置和行为。这种布局的灵活性允许快速、方便地创建复杂的布局，而无需在彼此之间嵌套其他布局类型，从而提升了布局性能。`ConstraintLayout`\
  \ 还与 Android Studio 布局编辑器工具紧密集成。除非另有说明，否则它是书中大多数示例的首选布局。\n*   `LinearLayout` – 根据所选的方向（orientation）在单行或单列中排列子视图。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图应占据布局空间的比例。\n\
  *   `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每行由一个 `TableRow` 对象对象表示，该对象又包含一个每个单元格的视图对象。\n\
  *   `FrameLayout` – `FrameLayout` 的目的是分配屏幕的一个区域，通常用于显示单个视图。如果添加了多个子视图，它们默认将相互叠在一起，并定位在布局区域的左上角。通过为每个子视图设置重力（gravity）值可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将使其位于容器 `FrameLayout` 视图的垂直中心。\n*   `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐方式（alignments）和边距（margins），使子视图相对于彼此以及容器布局视图进行定位。例如，可以将子视图 `View A`\
  \ 配置为位于容器 `RelativeLayout` 视图的水平垂直中心。另一方面，`View B` 也可以被配置为在布局中水平居中，但位于 `View A`\
  \ 顶部上方 30 像素处，从而使其在垂直方向相对于 `View A`。在设计必须适配各种屏幕尺寸和方向的用户界面时，`RelativeLayout` 管理器非常有帮助。\n\
  *   `AbsoluteLayout` – 允许子视图定位在容器布局视图内特定的 `X` 和 `Y` 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\
  *   `GridLayout` – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为跨越多个水平和垂直单元格，从而能够快速方便地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置一种名为 `Space` 的特殊类型视图，或通过设置边距参数来实现。\n*   `CoordinatorLayout`\
  \ – 作为 Android 5.0 中 Android 设计支持库的一部分引入，`CoordinatorLayout` 专门设计用于协调应用程序屏幕顶部的应用栏（app\
  \ bar）与其他视图元素的外观和行为。当使用 Basic Views Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将在后文中详细介绍，从与浮动操作按钮和 Snackbar 使用中所示的用户界面：\n\n\n\n\n\nAndroid 应用用户界面屏幕中的每个元素都是视图（view），它们最终都继承自\
  \ `android.view.View` 类。每个视图代表设备显示器上的矩形区域，负责该区域内显示的内容，并处理在该视图边界内发生的事件。多个视图可以组合成单个复合视图（composite\
  \ view）。复合视图中的视图是容器视图的子视图，容器视图通常是 `android.view.ViewGroup` 的子类（其本身又是 `android.view.View`\
  \ 的子类）。用户界面由构建成视图层次结构的视图组成。\n\nAndroid SDK 包含了一系列预定义的视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及一系列可用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图，或者通过子类\
  \ `android.view.View` 创建全新的视图类来创建自定义视图。\n\n用户可以使用 Android Studio 布局编辑器（Layout Editor）工具、手动编写\
  \ XML 布局资源文件或编写 Java 代码创建用户界面。这些方法将在接后的章节中进行介绍。\n\n# 17. Android Studio 布局编辑器工具指南\n\
  \n很难想象不需要某种形式用户界面的 Android 应用概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间主要的交互方式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好的良好的用户界面是创建成功且流行的 Android 应用的关键因素，它可以根据单个应用程序的设计需求从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础视图 vs. 空视图活动模板\n\n正如“Android\
  \ 应用剖析”章节概述的那样，Android 应用包含一个或多个活动（activity）。活动是应用程序功能的独立模块，通常直接对应于单个用户界面屏幕。因此，当使用\
  \ Android Studio 布局编辑器时，我们总是在处理某个活动的布局。\n\n在创建新的 Android Studio 项目时，有多个模板可以作为主活动用户界面的起点。最基本的模板是基础视图活动（Basic\
  \ Views Activity）和空视图活动（Empty Views Activity）模板。尽管这两个选项看起来相似，但它们之间存在显著差异。要在布局编辑器中查看这些差异，请使用视图选项（View\
  \ Options）菜单启用 `Show System UI`（显示系统界面），如下图 17-1 所示：\n\n```\n![](img/as_basic_activity_layout_1.jpg\n\
  ```\n图 17-4\n\n此应用行为使用了称为片段（fragments）和导航（navigation）的两个 Android 功能，这些功能将分别从“Android\
  \ 片片简介”和“导航架构组件概述”章节开始介绍。\n\n`content_main.xml` 文件包含一个特殊的片段，称为导航宿主片段（Navigation\
  \ Host Fragment），它允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置在视图中切换不同的内容。在基础视图活动模板的情况下，`nav_graph.xml`\
  \ 文件配置为根据用户对“Next”和“Previous”按钮的选择，在 `fragment_first.xml` 和 `fragment_second.xml`\
  \ 文件定义的用户界面布局之间进行切换。\n\n如果你在活动中既不需要悬浮操作按钮也不需要菜单，并且不需要 `CoordinatorLayout` 提供的特殊应用栏行为（例如在某些滚动操作期间使应用栏和工具栏从视图中折叠的功能，该主题在“使用\
  \ AppBar 和折叠工具栏布局”章节中涵盖），那么空视图活动模板将很有帮助。然而，基础视图活动是有帮助的，因为它默认提供了这些元素。事实上，使用基础视图活动模板创建一个新活动并删除你不需要的元素，比使用空视图活动模板并手动实现折叠工具栏、菜单或悬浮操作按钮等行为要快得多。尽管由于书中的并非所有示例都需要基础视图活动模板的功能，但本章的大多数示例将使用空视图活动模板，除非示例需要基础视图活动提供的某一个或其他功能。\n\
  \n供以后参考，如果你需要菜单但不需要悬浮操作按钮，请使用基础视图活动并按照以下步骤删除悬浮操作按钮：\n\n1. 在项目窗口的 `app -> res ->\
  \ layout` 下双击主 `activity_main.xml` 布局文件，将其加载到布局编辑器。布局加载到布局编辑器工具后，选择悬浮操作按钮并按下键盘 Delete\
  \ 键从布局中删除对象。\n\n2. 找到并编辑活动的 Java 代码（位于 `app -> java -> <package name> -> <activity\
  \ class name>`），如下从 `onCreate` 方法中删除悬浮操作按钮代码：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n```\n\n\n\n\n\n```java\nSnackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n    .setAction(\"Action\"\
  , null).show();\n```\n\n如果你需要一个悬浮按钮但不需要菜单，请使用 Basic Views Activity 模板并按照以下步骤操作：\n\
  \n1. 编辑主 Activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected` 方法。\n2.\
  \ 在 Project（项目）工具窗口中选择 `res -> menu` 项，并按下键盘上的 `Delete` 键从项目中删除该文件夹及相应的菜单资源文件。\n\
  \n如果你需要使用 Basic Views Activity 模板，但既不需要导航功能也不需要第二个 fragment，请按照以下步骤操作：\n\n1. 在 Project\
  \ 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的\
  \ `SecondFragment` 条目，并按下键盘删除键将其从图表中移除。\n3. 找到并删除 `SecondFragment.java` (`app ->\
  \ java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app -> res\
  \ -> layout -> fragment_second.xml`) 文件。\n4. 最后的任务是从 `FirstFragment` 类中删除一些代码，使得\
  \ `Button` 视图在被点击时不再导航到已不存在的第二个 fragment。找到 `FirstFragment.java` 文件，双击将其加载到编辑器，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n# 17.2 Android Studio 布局编辑器\n\n如前面的章节所示，Layout Editor\
  \ 工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调板中选择视图，然后将其放置在代表 Android 设备显示的画布上。视图一旦放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束）。此外，可以使用\
  \ Attributes（属性）工具窗口修改与所选视图相关的属性。\n\n在底层，Layout Editor 工具会构建一个 XML 资源文件，该文件包含了正在设计的用户界面定义。因此，Layout\
  \ Editor 工具以三种不同的模式运行：Design（设计）、Code（代码）和 Split（拆）。\n\n## 17.3 设计模式\n\n在设计模式下，用户可以通过直接操作视图调板和布局的图形表示来可视化地控制用户界面。[图\
  \ 17-5]突出了 Android Studio Layout Editor 工具在设计模式下的关键区域：\n\n![](img/as_layout_editor_labelled.jpg)\n\
  \n图 17-5\n\n*   **A – Palette（调板）** – 调板提供了 Android SDK 提供的系列视图组件的访问。这些组件被分类以便于导航。可以通过从调板中拖拽视图组件并将其放置在布局所需的位置来向布局添加项。\n\
  *   **B – Device Screen（设备屏幕）** – 设备屏幕提供了设计中用户界面布局的视觉“所见即所得”表示。该布局允许通过选择、删除、移动和调整视图的大小来直接进行设计操作。可以使用工具栏中的菜单随时更改布局代表的设备模型。\n\
  *   **C – Component Tree（组件树）** – 如前一节（“理解 Android 视图、视图组和布局”）所述，用户界面是使用分级结构构建的。组件树提供了用户界面设计层次结构的视觉概览。从组件树中选择元素将选中布局中相应的视图。同样地，从设备屏幕布局中选择视图将选中组件树层次结构中的该视图。\n\
  *   **D – Attributes（属性）** – 调板中列出的所有组件视图都有一组相关的属性，用于调整该视图的行为和外观。Layout Editor 的属性面板提供了对布局中当前选中视图属性的访问，以便进行更改。\n\
  *   **E – Toolbar（工具栏）** – Layout Editor 工具栏提供了对广泛选项的快速访问，包括（但不限于）放大和缩小设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局中选择相关的视图类型时会出现这些按钮。\n*   **F – Mode\
  \ Switching Controls（模式切换控件）** – 这三个按钮提供了在 Design、Code 和 Split 模式之间来回切换。\n*   **G\
  \ – Zoom and Pan Controls（缩放和平移控件）** – 该控制面板允许你放大或缩小设计，抓取画布并在放大时进行移动。\n\n## 17.4\
  \ 调板\n\nLayout Editor 调板由两个面板组成，旨在方便查找和预览待添加的组件。类别面板（在图 17-6 中标记为 A）列出了 SDK 支持的各种视图组件类别。当从列表中选择一个类别时，第二个面板（B）将更新以显示属于该类别的组件列表：\n\
  \n![](img/as_layout_editor.jpg)\n\n图 17-6\n\n要从调板将组件添加到布局中，请从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置，然后释放到位。\n\
  \n可以通过点击调板工具栏中的搜索按钮（在图 17-6 中标记为 C）并输入组件名称，在所选类别内对特定组件进行搜索。随着字符输入，匹配的结果将出现在组件列表中。如果不确定组件的类别，可以在搜索之前或搜索期间选择“All\
  \ Results（所有结果）”类别。\n\n## 17.5 设计模式与布局视图\n\n默认情况下，布局编辑器将以 Design（设计）模式出现，如图 17-5\
  \ 所示。此模式提供了用户界面的视觉表示。可以通过点击 View Modes（视图模式）按钮随时选择设计模式，如图 17-7 所示：\n\n![](img/as_layout_editor_view_modes.jpg)\n\
  \n图 17-7\n\n当 Layout Editor 工具处于设计模式时，可以通过两种方式查看布局。图 17-5 显示的视图是 Design 视图，显示了布局和控件在运行中的应用中的外观。另一种模式\
  \ Blueprint（蓝图）视图可以代替 Design 视图或与 Design 视图同时显示。图 17-8 工具栏菜单提供了显示 Design、Blueprint\
  \ 或两种视图的选项。还有针对色盲的设置。第五种选项 Force Refresh Layout（强制刷新布局）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，这非常有用：\n\
  \n![](img/as_layout_editor_design_surface.jpg)\n\n图 17-8\n\n显示布局视图、设计视图或两者都取决于个人喜好。一种很好的方法是开始时显示两者。\n\
  \n\n\n\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n图 17-9\n\n## 17.6\
  \ 夜间模式\n\n在设计工作期间以夜间模式查看布局，请选择下方图 17-10 所示的菜单并将设置更改为 `Night`：\n\n![](img/as_layout_editor_night.jpg)\n\
  图 17-10\n\n模式菜单还包含了测试动态颜色的选项，该主题在“Material Design 3 主题与动态颜色教程”章节中有所介绍。\n\n## 17.7\
  \ 代码模式\n\n使用 Android Studio 布局编辑器工具时，重要的是记住它所做的仅仅是提供了一种易于用户的方法来创建 XML 布局资源文件。在设计过程中，可以通过从上方图\
  \ 17-7 所示的 `View Modes`（视图模式）菜单中选择 `Code` 查看并直接编辑底层的 XML。\n\n图 17-11 显示了 `Code`\
  \ 模式下的 Android Studio 布局编辑器工具，允许通过修改 XML 来更改用户界面声明：\n\n![](img/as_layout_editor_code.jpg)\n\
  图 17-11\n\n## 17.8 分屏模式\n\n在 `Split`（分屏）模式下，编辑器并排显示 `Design`（设计）和 `Code`（代码）视图，允许用户使用设计画布可视化地修改用户界面并直接对\
  \ XML 声明进行更改。可以使用 `View Modes` 菜单或下方所示的 `Editor` 和 `Preview` 按钮来选择 `Split` 模式：\n\
  \n![](img/as_layout_editor_editor_and_preview_button.jpg)\n图 17-12\n\nXML 的任何更改都会反映在设计画布上，反之亦然。图\
  \ 17-13 显示了处于 `Split` 模式下的编辑器：\n\n![](img/as_layout_editor_split.jpg)\n图 17-13\n\
  \n## 17.9 设置属性\n\n`Attributes`（属性）面板提供了对当前选中组件所有可用设置的访问。例如，图 17-14 显示了 `TextView`\
  \ 小部件的一些属性：\n\n![](img/as_layout_editor_atrributes.jpg)\n图 17-14\n\n`Attributes`\
  \ 工具窗口分为以下不同的部分：\n\n- `id`：包含 `id` 属性，该属性定义了应用源码中引用当前选中对象的名称。\n- `Declared Attributes`（已声明属性）：包含所有已赋值的属性。\n\
  - `Layout`（布局）：定义当前选中视图对象相对于屏幕和布局中对象的定位和大小的设置。\n- `Transforms`（变换）：包含允许当前选中对象进行旋转、缩放和偏移的控件。\n\
  - `Common Attributes`（常用属性）：当前选中的视图对象类通常需要更改的属性列表。\n- `All Attributes`（所有属性）：当前选中对象可用属性的完整列表。\n\
  \n可以通过选择 `attributes` 工具窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\n某些属性在值字段右侧有一个窄按钮。这表示可以使用\
  \ `Resources`（资源）对话框来协助选择合适的属性值。点击按钮可显示对话框。该按钮的外观变化会反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，则\
  \ `text` 属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的图 17-15 所示：\n\n![](img/as_layout_editor_not_hardcoded.jpg)\n\
  图 17-15\n\n具有有限数量有效选项的属性将呈现一个下拉菜单（图 17-16），可以从中进行选择。\n\n![](img/as_layout_editor_attr_options.jpg)\n\
  图 17-16\n\n可以点击滴管图标显示颜色调色板。同样，当出现旗帜图标时，点击它可以显示该属性可用的选项列表，而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n## 17.10 变换\n\n`Attributes` 工具窗口中的 `transforms` 面板（图 17-17）提供了一组控件和属性，用于控制当前选中对象在旋转、`alpha`（用于视图的淡入和淡出）、`scale`（大小）和\
  \ `translation`（相对于当前位置的偏移）方面的视觉方面：\n\n![](img/as_layout_editor_transforms.jpg)\n\
  图 17-17\n\n该面板包含视图的视觉表示，该表示随属性的更改而更新。这些更改也会反映在布局画布内的视图中。\n\n## 17.11 工具可见性切换\n\n\
  在 `Code` 模式下查看 Android Studio XML 布局文件的内容时，你会注意到许多定义视图外观和行为的属性都以 `android:` 前缀开头。这表示这些属性是在\
  \ `android` 命名空间内设置的，并在应用运行时生效。例如，下面这段来自布局文件的摘录在 `Button` 视图上设置了各种属性：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"/>\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器中生效。在设计布局时，你可能会发现让\
  \ `EditText` 显示某些文本但在应用运行时需要视图为空是很有帮助的。为了实现这一点，你可以使用 `tools` 命名空间如下设置 `text` 属性：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editTextPersonName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"textPersonName\"\n    tools:text=\"Sample Text\"/>\n```\n\
  \n此类类型的工具属性通过在 `Attributes` 工具窗口中带有扳手图标的属性字段中输入值来设置，如下图 17-18 所示：\n\n![](img/as_layout_editor_tools_attribute.jpg)\n\
  图 17-18\n\n此类工具属性在设计过程中更改视图的可见性非常有用。布局可能包含一个在应用运行时根据程序显示和隐藏的视图，取决于用户操作。为了模拟隐藏视图，可以在视图\
  \ 声明中添加以下工具属性：\n\n`tools:visibility=\"invisible\"`\n\n虽然使用 `invisible` 设置时视图不再可见，但它仍然存在于布局中，并占据它可见时的空间。要让布局表现像视图不再存在，应将可见性属性设置为\
  \ `gone`：\n\n`tools:visibility=\"gone\"`\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，而对运行的应用没有影响。若要在布局编辑器和运行的应用中同时控制可见性，将使用\
  \ `android` 命名空间设置相同的属性：\n\n`android:visibility=\"gone\"`虽然可见性工具属性很有用，但手动编辑 XML\
  \ 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio 在布局编辑器的 `Component Tree`面板中提供了一组切换控件。要访问这些控件，点击面板中相应视图右侧的边距。例如，图\
  \ 17-19 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换控件：\n\n![](img/as_layout_editor_tools_attr_visibility.jpg)\n\
  图 17-19\n\n\n\n\n\n这些切换开关控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`、`visible`、`invisible`\
  \ 和 `gone` 选项。当设置了冲突属性时（例如，`android` 命名空间的切换开关设置为 `visible`，而 `tools` 值被设置为 `invisible`），在布局预览中，`tools`\
  \ 命名空间具有更高的优先级。当选择了切换项时，Android Studio 会自动将相应的属性添加到布局文件中的 XML 视图元素中。\n\n除了 `Component\
  \ Tree`（组件树）面板中的可见性切换开关外，布局编辑器还包含了 `tools` 可见性和位置切换按钮，如译文 图 17-20 所示的高亮显示：\n\n![](img/as_layout_editor_show_tools.jpg)\n\
  \n图 17-20\n\n此按钮切换当前的 `tools` 可见性设置。例如，如果上方显示的 `Button` 视图当前 `tools` 可见性属性设置为 `gone`，则切换此按钮将使其变为\
  \ `visible`。这使得在视图添加到和从布局中移除时能够快速检查布局行为。该切换开关也用于检查布局中的视图是否正确约束，该主题在“在 Android Studio\
  \ 中使用 ConstraintLayout 指南” 章节中有所介绍。\n\n### 17.12 转换视图\n\n在布局中将视图从一种类型转换为另一种（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或 `Component tree`\
  \ 窗口中右键点击该视图，并选择 `Convert view...` 菜单选项（图 17-21）：\n\n![](img/as_layout_editor_convert_view.jpg)\n\
  \n图 17-21\n\n选中后，将出现一个包含兼容视图类型列表的对话框，选中的对象可以转换为这些类型。例如，图 17-22 显示了现有 `TextView`\
  \ 视图可以转换的类型：\n\n![](img/as_layout_editor_convert_view_dialog.jpg)\n\n图 17-22\n\n\
  这种技术对于将布局从一种类型转换为另一种类型（例如，将 `ConstraintLayout` 转换为 `LinearLayout`）也有帮助。\n\n### 17.13\
  \ 显示示例数据\n\n在 Android Studio 中设计布局时，会出现这样的情况：用户界面中要显示的内容在应用完成并运行之前是不可用的。这有时会让人难以从布局编辑器内部评估布局在应用运行时的显示效果。为了解决这个问题，布局编辑器允许指定示例数据，这将使用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在应用运行时不会显示。可以通过直接编辑布局的\
  \ XML 或通过在设计区域中右键点击小部件并选择 `Set Sample Data` 菜单选项视觉化地使用设计时助手来配置示例数据。设计时助手面板将为所选视图项显示一组用于显示示例数据的预配置选项，包括在不同配置中文本和图像的组合。例如，图\
  \ 17-23 显示了在 `RecyclerView` 列表中选择显示示例数据时显示的选项选项：\n\n![](img/as_layout_editor_design_time_attrs.jpg)\n\
  \n图 17-23\n\n或者，可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在随后的章节“布局编辑器示例数据教程” 中。由于示例数据是作为\
  \ `tools` 属性实现的，预览中数据的可见性可以使用上方 图 17-20 所示的高亮显示的可见性切换按钮进行控制。\n\n### 17.14 创建自定义设备定义\n\
  \n布局编辑器工具栏中的设备菜单（图 17-24）提供了预配置的设备类型列表，选择后，这些类型将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android\
  \ Studio 环境中配置的任何 `AVD` 实例也将列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition` 选项，并按照“在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)” 章节中的步骤进行。\n\n![](img/as_layout_editor_device_menu.jpg)\n\
  \n图 17-24\n\n### 17.15 修改当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单选择 `Custom` 选项，点击设备屏幕右下角的缩放句柄（图\
  \ 17-25），并拖动选择另一种设备显示格式。随着屏幕缩放，将出现标记，指示可选的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-25\n\n### 17.16 布局验证\n\n布局验证选项允许用户在系列像素级屏幕上同步预览用户界面布局。要访问布局验证窗口，点击 Android\
  \ Studio 主窗口右侧的标签或使用左下角的 `Tool Window` 菜单。加载后，面板将如 图 17-26 所示在多个设备配置上渲染：\n\n![](img/as_layout_editor_device_validation.jpg)\n\
  \n图 17-26\n\n### 17.17 总结\n\n开发 Android 应用的一个关键部分是创建用户界面。这是在 Android Studio 环境中使用布局编辑器完成的，该工具有三种模式。在\
  \ Design 模式下，从调板中选择组件并放在代表 Android 设备屏幕的布局上，并使用属性列表进行配置。表示布局的 XML 可以在 Code 模式下直接编辑。而\
  \ Split 模式则可以通过视觉化和直接编辑 XML 来创建布局。这些模式结合提供了一个广泛且直观的用户界面设计环境。\n\n布局验证面板允许在各种尺寸屏幕上快速预览用户界面布局。\n\
  \n# 18. ConstraintLayout 指南\n\n正如在“理解视图、视图组和布局” 章节中所讨论，Android 提供了多种布局管理器来设计用户界面。在\
  \ Android 7 中，Google 引入了一种解决了许多旧布局管理器缺陷的布局。这种名为 `ConstraintLayout` 的布局将简单、表达且灵活的布局系统与\
  \ Android Studio 布局编辑器工具中强大的功能相结合，有助于创建能够自动适应屏幕尺寸和设备方向变化的响应式用户界面布局。\n\n本章将概述 `ConstraintLayout`\
  \ 的基本概念，下一章将详细概述如何在 Android Studio 布局编辑器工具中使用 `ConstraintLayout` 创建基于约束的布局。\n\n\
  ## 18.1 ConstraintLayout 如何工作\n\n与其他所有布局一样，`ConstraintLayout` 管理其包含的视觉组件（也称为小部件）的位置和大小行为。它是根据在每个子小部件上设置的约束连接来实现的。\n\
  \n\n\n\n\n为了完全理解并使用 `ConstraintLayout`，必须掌握以下核心概念：\n\n-   约束 (Constraints)\n-  \
  \ 边距 (Margins)\n-   相对约束 (Opposing Constraints)\n-   约束偏置 (Constraint Bias)\n- \
  \  链 (Chains)\n-   链样式 (Chain Styles)\n-   指南线 (Guidelines)\n-   组 (Groups)\n- \
  \  屏障 (Barriers)\n-   流 (Flow)\n\n### 18.1.1 约束\n约束是一组规则，规定了组件相对于其他组件、容器 `ConstraintLayout`\
  \ 的侧边以及称为 `guidelines` 的特殊元素的对齐方式和间距。约束还决定了 Activity 的用户界面布局如何响应设备方向的变化或在不同屏幕尺寸的设备上的显示情况。为了进行充分配置，组件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 18.1.2 边距\n边距是某种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 的顶部和右边缘的边距约束，并连接到父 `ConstraintLayout` 对应的侧来实现，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，这些约束连接中的每一个一个都关联有一个边距值，规定了组件距离父布局两个侧的固定距离。在此种配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接的指定，分别距离父 `ConstraintLayout` 的顶部和右边缘 20 和 15 个设备无关像素 (dp)。\n\n虽然上述配置在某些情况下是可以接受的，但它在允许\
  \ `ConstraintLayout` 布局引擎通过调整组件位置来响应设备旋转以及支持不同尺寸的屏幕方面，没有提供任何灵活性。为了在布局中添加这种响应性，有必要实现相对约束。\n\
  \n### 18.1.3 相对约束\n在单个组件上沿同一轴运行的两个约束被认为是相对约束。换句话说，在左侧和右侧都有约束的组件被认为具有水平相对约束。例如，图\
  \ 18-2 展示了在之前的布局中同时添加水平和垂直相对约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了相对约束，组件的定位将基于百分比而非基于坐标。例如，组件不再固定在距离布局顶部的\
  \ 20dp 处，而是位于距离顶部的 30% 处。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 始终位于父布局尺寸的相同位置。\n\n现在重要的是要理解，图\
  \ 18-2 中概述的布局不仅使用了相对约束，还通过应用约束偏置来实现的。\n\n### 18.1.4 约束偏置\n现在已经确定，`ConstraintLayout`\
  \ 中的组件可能会受到相对约束连接的影响。默认情况下，相对约束是相等的，导致相应的组件在相对轴上居中。例如，图 18-3 显示了一个组件使用相对水平和垂直约束在包含的\
  \ `ConstraintLayout` 中居中：\n\n![](img/Image2453.jpg)\n\n图 18-3\n\n为了在存在相对约束的情况下调整组件位置，`ConstraintLayout`\
  \ 实现了一种名为约束偏置 (constraint bias)的功能。约束偏置允许组件沿相对轴的定位根据指定的百分比偏向其中一个约束偏斜。例如，图 18-4 显示了之前的约束布局，具有\
  \ 75% 的水平偏置和 10% 的垂直偏置：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n下一章标题为“在 Android\
  \ Studio 中使用 ConstraintLayout 的指南`，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android Studio 布局编辑器工具中的。然而，在此还需要涵盖\
  \ `ConstraintLayout` 类的其他几个领域。\n\n### 18.1.5 链\n`ConstraintLayout` 链提供了一种将两个或多个组件的布局行为定义为一个组的方法。链可以在垂直或水平轴上声明，并配置为定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接时，它们就构成了链。例如，图 18-5 展示了以这种方式链的三个组件：\n\n![](img/Image2468.jpg)\n\n图\
  \ 18-5\n\n链中的第一个元素是链头 (chain head)，它在垂直链中对应顶部组件，在水平链中对应最左侧的组件。整个链的布局行为主要通过在链头组件上设置属性来配置。\n\
  \n### 18.1.6 链样式\n`ConstraintLayout` 链的布局行为由应用于链头组件的链样式决定。`ConstraintLayout` 类目前支持以下链布局样式：\n\
  \n- **散布链 (Spread Chain)** ——链中的组件在可用空间内均匀分布。这是链的默认行为。\n\n![](img/Image2478.jpg)\n\
  \n图 18-6\n\n- **内部扩散链 (Spread Inside Chain)** ——链中的组件在链头和最后一个组件之间均匀分布。链头和最后一个组件不包含在分布分布内。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n- **权重链 (Weighted Chain)** ——通过权重属性定义链中每个组件占据的空间。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n- **紧凑链 (Packed Chain)** ——组成链的组件聚集在一起没有任何间距。可以应用偏置来控制链相对于容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n### 18.2 基线对齐\n到为止，本章只提到了相对于组件侧边的约束（通常称为侧约束）。然而，一种常见的需求是让组件相对于其显示的内容而非组件本身进行对齐。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐。\n\n例如，假设之前的图 18-1 需要一个 `TextView` 组件放置在 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 视图进行基线对齐。这意味着 `Button` 内部文本需要与 `TextView` 内部文本进行垂直对齐。该布局的额外约束需要如图\
  \ 18-10 所示连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在在垂直方向上沿 `Button`\
  \ 的基线线，并在水平上距离 `Button` 对象左边缘 40dp。\n\n### 18.3 配置组件维度\n控制组件的维度是界面设计过程的关键元素。`ConstraintLayout`\
  \ 提供了可以在组件上设置的三个选项来管理大小行为。这些设置针对高度和宽度维度分别进行配置：\n\n\n\n\n\n- `Fixed` – 控件固定到指定的尺寸。\n\
  - `Match Constraint` – 允许布局引擎调整控件的大小以满足主执行的约束条件。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n- `Wrap Content` – 控件的大小由其内容（即文本或图形）决定。\n\n## 18.4 Guideline Helper（指南线助手）\n\
  \n指南线（Guidelines）是 `ConstraintLayout` 中可用的特殊元素，它们为约束提供了一个可以连接的额外目标。在一个 `ConstraintLayout`\
  \ 实例中可以添加多个指南线，这些指南线可以被配置为水平或垂直方向。一旦添加，就可以从布局中的控件到指南线建立约束连接。当多个控件必须沿某一轴对齐时，这种方法特别特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的的三个 `Button` 对象沿一条垂直指南线进行约束：\n\n![](img/Image2519.jpg)\n\
  图 18-11\n\n## 18.5 Group Helper（组助手）\n\n`ConstraintLayout` 的此功能允许将控件放入逻辑组中，并作为一个单一实体控制这些控件的可见性。`Group`\
  \ 是布局中其他控件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将此更改应用于所有组成员。这使得通过更改单个属性来隐藏和显示多个控件变得非常简单。单个布局可以包含多个组，一个控件也可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后定义的组具有优先级。\n\n## 18.6 Barrier Helper（屏障助手）\n\n与指南线类似，屏障（Barriers）是可用于约束布局内视图的虚拟视图。与指南线一样，屏障可以是垂直或水平的，并且一个或多个视图可以约束在它上面（为了避免混淆，这些被称为受约束视图）。但与指南线在布局中保持固定位置不同，屏障的位置是由一组所谓的参考视图（reference\
  \ views）定义的。屏障的引入是为了解决经常发生的视图重叠问题。例如，考虑下所示图 18-12 中的布局：\n\n![](img/Image2526.jpg)\n\
  图 18-12\n\n上述布局需要注意的关键点是，`View 3` 的宽度设置为匹配约束模式（match constraint mode），且视图的左边缘连接到\
  \ `View 1` 的右边缘。根据目前的实现，增加 `View 1` 的宽度将产生缩小 `View 3` 宽度的预期效果：\n\n![](img/Image2533.jpg)\n\
  图 18-13\n\n然而，如果增加的是 `View 2` 的宽度而不是 `View 1`就会出现问题：\n\n![](img/Image2540.jpg)\n\
  图 18-14\n\n由于 `View 3` 只受 `View 1` 约束，它不会调整大小以适应 `View 2` 宽度的增加，导致视图重叠。\n\n解决此问题的方法添加一个垂直屏障，并将\
  \ `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。然后 `View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 任意一个宽度增加时，屏障将移动以适应两个视图中最宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n## 18.7\
  \ Flow Helper（流助手）\n\n`ConstraintLayout Flow` 助手允许组视图以流式网格布局样式显示。与 `Group` 助手一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了各种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大控件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括分布（spread）、内部分布（spread inside）和打包（packed）选项。\n\n图 18-16 表示使用 `Flow`\
  \ 实例在水平模式且无换行设置的五个等大小按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n图 18-16\n\n图 18-17\
  \ 显示了相同的按钮在水平流配置中，换行设置为在每三个控件后发生一次：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n图 18-17\n\
  \n另一方面，图 18-18 显示了将换行设置为使用内部分布（spread inside）链模式的按钮（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap` 属性以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n图 18-18\n\
  \n作为 `Flow` 助手灵活性的最后演示，图 18-19 显示了在水平打包模式下、每三个控件换行的五个不同大小的按钮。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0` 使网格内容右对齐（设置为 `0.0` 将导致左对齐）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  图 18-19\n\n## 18.8 Ratios（比例）\n\n控件的尺寸可以使用比例设置定义。例如，控件可以使用比例设置进行约束，无论任何调整行为如何，其宽度都是高度的两倍。\n\
  \n## 18.9 ConstraintLayout Advantages（ConstraintLayout 优势）\n\n`ConstraintLayout`\
  \ 提供的灵活性允许在单个布局实例中实现许多需要嵌套多个布局才能实现的功能。这通过允许设计所谓的“扁平”或“浅层”布局层级，避免了布局嵌套带来的固有问题，从而提高了运行时的用户界面性能。\n\
  \n`ConstraintLayout` 的引入也是为了解决目前存在的各种 Android 设备尺寸问题。`ConstraintLayout` 的灵活性使得设计适应运行应用程序的设备的用户界面变得更容易。\n\
  \n最后，正如在 Android Studio 中使用 ConstraintLayout 的指南章节将演示的那样，Android Studio 布局编辑器已专门针对\
  \ `ConstraintLayout` 用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout Availability（可用性）\n\
  \n尽管 `ConstraintLayout` 是随着 Android 7 引入的，但它是作为独立的支持库提供的，可以向下追溯到 API  9 (Gingerbread)。这使得使用此布局的应用程序可以在运行较旧版本\
  \ Android 的设备上运行。\n\n## 18.11 Summary（总结）\n\n`ConstraintLayout` 是随 Android 7 引入的布局管理器。它的设计旨在创建能够适应市场上多种\
  \ Android 设备尺寸和方向的灵活布局。`ConstraintLayout` 使用约束来控制相对于父 `ConstraintLayout` 实例、指南线、屏障以及布局中其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建的 Android Studio 项目的默认布局，并在设计用户界面布局时推荐使用。这种简单而灵活的布局管理方法可以轻松实现复杂且响应式的用户界面。\n\
  \n\n\n\n正如前面的章节中多次提到的那样，Google 对 Android Studio 布局编辑器工具进行了重大更改，其中许多更改仅是为了支持使用 `ConstraintLayout`\
  \ 进行用户界面布局设计。在上一章概述了 `ConstraintLayout` 的基本概念后，本章将更详细地探讨这些概念，同时概述布局编辑器工具如何允许设计和实现基于\
  \ `ConstraintLayout` 的用户界面。\n\n## 19.1 设计与布局视图\n\n名为“Android Studio 布局编辑器指南”的章节解释了\
  \ Android Studio 布局编辑器工具提供了两种方式来查看 Activity 的用户界面布局，即设计（Design）视图和布局（Layout，也称为蓝图\
  \ blueprint）视图。这些布局视图可以单独显示，也可以像图 19-1 所示那样并排显示：\n\n![](img/as_design_and_blueprint.jpg)\n\
  \n图 19-1\n\n`Design` 视图（位于图左侧）呈现了布局的“所见即所得”表示，其中布局以其在运行中的应用程序中的形式显示。另一方面，`Layout`\
  \ 视图显示了一种蓝图风格的视图，其中阴影轮廓表示小部件。如上面的图 19-1 所示，`Layout` 视图还显示了约束连接（在这种情况下，用于将按钮在布局中居中的相对约束）。当选择布局中的特定小部件或鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图 19-2 所示：\n\n![](img/as_design_canvas_with_constraints.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观可以使用图 19-3 所示的 `View Options`（视图选项）菜单进行更改：\n\n![](img/as_layout_view_options.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局的两种模式外，布局编辑器工具还提供了三种建立特定布局设计所需的约束的方式。\n\n## 19.2 自动连接模式\n\n\
  `Autoconnect`（自动连接）顾其实名，在项目被添加到布局时会自动建立约束连接。可以使用图 19-4 所示的工具栏按钮开启或关闭 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法根据小部件的位置以及小部件与父布局两侧及其他元素的接近程度来决定建立最佳约束。如果任何自动约束连接未能提供预期的行为，可以像本章后面概述的那样进行手动更改。\n\
  \n## 19.3 推断模式\n\n`Inference`（推断）模式使用涉及算法和概率的启发式方法，在小部件已添加到布局中后自动实现约束连接。这种模式通常在关闭了\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下将对象添加到布局时使用。这允许通过从调色板将对象拖放到布局画布上来设计布局，并更改尺寸和位置，直到布局符合要求。本质上，这涉及在不担心约束的情况下“绘制”布局。`Inference`\
  \ 模式也可以在设计过程中用于填充布局中缺失的约束。\n\n点击 `Infer constraints`（推断约束）按钮（图 19-5）时，约束会自动添加到布局：\n\
  \n![](img/as_layout_infer_constraints.jpg)\n\n图 19-5\n\n与 `Autoconnect` 模式一样，布局编辑器工具始终存在推断错误约束的可能性，尽管这些可以手动修改和修正。\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解布局编辑器工具中小部件周围出现的各种句柄将会有帮助。例如，考虑图 19-6\
  \ 所示的小部件：\n\n![](img/as_constraint_markers.jpg)\n\n图 19-6\n\n弹簧状线条 (A) 代表从小部件侧边到目标已建立的约束连接。对象每个角的小正方形标记\
  \ (B) 是缩放句柄，点击并拖动时用于缩放小部件。位于小部件每侧的小圆句柄 (C) 是侧边约束锚点。要创建约束连接，点击句柄并将生成的线条拖动到要连接的元素（例如指南线或父布局侧边或其他小部件的侧边），如图\
  \ 19-7 所示。连接到另一个小部件的侧边时，将线条拖到该小部件的侧边约束句柄，并在小部件和句柄高亮时释放线条：\n\n![](img/as_layout_drag_constraint.jpg)\n\
  \n图 19-7\n\n如果将约束线拖到小部件并释放但未附加到约束句柄上，布局编辑器将显示一个包含可以附加侧边列表的菜单。在图 19-8 中，例如，约束可以附加到按钮的顶部或底部：\n\
  \n![](img/as_constraint_edges.jpg)\n\n图 19-8\n\n额外的标记指示基线约束的锚点，其中小部件内部（而非外部边缘）用作对齐点。要显示此标记，右键点击小部件并选择\
  \ `Show Baseline`（显示基线）。要从基线约束句柄建立约束连接，将鼠标指针悬停在句柄上直到其高亮，然后点击并拖动到目标（如图 19-9 所示的另一个小部件的基线锚点）：\n\
  \n![](img/as_constraint_baselines.jpg)\n\n图 19-9\n\n要隐藏基线锚点，再次右键点击小部件并选择隐藏。\n\n\
  ##在检查器中添加约束\n\n可以使用属性窗口中的 `Inspector`（检查器）面板为 Android Studio 布局编辑器中的视图添加约束，如图 19-10\
  \ 所示。中心的正方形表示选选视图，正方形周围的区域表示应用于视图对应侧的约束（如果有）：\n\n![](img/as_constraint_attributes.jpg)\n\
  \n图 19-10\n\n视图侧缺少约束由一条指向带有加号的蓝色圆圈的虚线表示（如图中视图底部边缘所示）。要添加约束，点击此蓝色圆圈，布局编辑器将添加连接到它认为的布局中最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n可以通过显示属性窗口的 `Constraints`（约束）部分来查看当前选择小部件的约束列表，如下图 19-11\
  \ 所示：\n\n![](img/as_attributes_constraints_section.jpg)\n\n图 19-11\n\n点击列表中的约束将选中设计布局中的该约束。\n\
  \n## 19.7 删除约束\n\n\n\n要删除单个约束，请在设计布局中或 `Attributes` 工具窗口中选择该约束，使其高亮（例如，在 图 19-12\
  \ 中所示，选中了最右侧的约束），然后按下键盘上的删除键。该约束将从布局中移除。\n\n![](img/as_constraint_selected.jpg)\n\
  \n图 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS 上为 `Cmd`）的同时，将鼠标指针悬停在约束锚点上，并在它变为红色后点击锚点：\n\
  \n![](img/as_constraint_anchor_delete.jpg)\n\n图 19-13\n\n或者，通过右键点击组件并选择 `Clear Constraints\
  \ of Selection`（清除选择约束）菜单选项来移除该组件的所有约束。\n\n要移除布局中每个组件的所有约束，请使用 图 19-14 中所示高亮的工具栏按钮：\n\
  \n![](img/as_clear_all_constraints.jpg)\n\n图 19-14\n\n# 19.8 调整约束偏置\n\n前一节概述了使用偏置设置来倾向于一个对立约束而非另一个的概念。`Android\
  \ Studio Layout Editor` 工具中的偏置通过位于 `Attributes` 工具窗口中的 `Inspector` 进行调整，并如 图 19-15\
  \ 所示。图中箭头指示的两个滑块用于控制当前选中组件的垂直方向和方向对立约束的偏置。\n\n![](img/as_constraint_bias_sliders.jpg)\n\
  \n图 19-15\n\n# 19.9 理解 ConstraintLayout 边距\n\n约束可以配合边距使用，在组件与另一个元素（如另一个组件、辅助线或父布局的边缘）之间实现固定间隙。例如，考虑应用在\
  \ 图 19-16 中 `Button` 对象上的水平约束：\n\n![](img/as_constraint_no_margins.jpg)\n\n图 19-16\n\
  \n按照目前的配置，水平约束延伸到父级 `ConstraintLayout` 的左右边缘。因此，该组件具有对立的水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置有一定的裁量权。这使得布局具有灵活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还可以控制组件的位置，直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_constraint_100_bias.jpg)\n\n图 19-17\n\
  \nConstraintLayout 边距可能会出现在约束连接的末端，并代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化时，组件无法移动到该间隙内。在\
  \ 图 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设为 100%，组件也无法移动到该区域。\n\n![](img/as_constraint_bias_with_margin.jpg)\n\
  \n图 19-18\n\n组件上现有的边距值可以在 `Inspector` 中进行修改。如 图 19-19 所示，使用下拉菜单将当前选中组件的右侧边距更改为 `16dp`。或者，点击当前值也可以在字段中输入数字。\n\
  \n![](img/as_constraint_set_margin.jpg)\n\n图 19-19\n\n可以使用 图 19-20 中高亮的工具栏中的选项，随时更改新约束的默认边距：\n\
  \n![](img/as_constraints_default_margin.jpg)\n\n图 19-20\n\n# 19.10 对立约束和偏置的重要性\n\
  \n正如前一节所述，在用 `ConstraintLayout` 时，对立约束、边距和偏置构成了 Android 响应式布局设计的基石。当组件被约束但没有对立的约束连接时，这些约束本质上是边距约束。这在\
  \ `Layout Editor` 工具中通过实线并配合边距测量值在视觉上表示，如 图 19-21 所示。\n\n![](img/as_constraint_no_opposing.jpg)\n\
  \n图 19-21\n\n上述约束将组件固定在相应位置。结果是，如果设备旋转到横向模式，组件将不再可见，因为垂直约束会将其推到设备屏幕顶之外（如 图 19-22\
  \ 所示）。如果应用程序在屏幕比设计过程中使用的更小的设备上运行，也会出现类似的问题。\n\n![](img/as_constraint_no_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现对立约束时，约束连接由锯齿状的弹簧线表示（弹簧的比喻旨在表示组件的位置不是固定的绝对 `X` 和 `Y` 坐标）：\n\n![](img/as_constraints_opposing.jpg)\n\
  \n图 19-23\n\n在上述布局中，垂直和水平偏置设置经过配置，使组件始终距离底部 90%，距离左边缘 35%。因此，在旋转后，组件仍然可见，且相对于屏幕尺寸的位置相同：\n\
  \n![](img/as_constraint_opposing_landscape.jpg)\n\n图 19-24\n\n在设计响应性和自适应的用户界面布局时，手动设计布局和修正自动创建的约束时考虑偏置和对立约束是非常重要的。\n\
  \n# 19.11 配置组件尺寸\n\n`ConstraintLayout` 中组件的内部维度也可以 `Inspector` 配置。如前一节概述，组件维度可以设置为\
  \ `wrap content`、`fixed` 或 `match constraint` 模式。当前选中组件每个维度的现有设置在 `Inspector` 中代表组件的正方形内，如\
  \ 图 19-25 所示：\n\n![](img/as_constraint_dimensions.jpg)\n\n图 19-25\n\n上图将水平和垂直维度设置为\
  \ `wrap content` 模式（由向内的箭头表示）。检查器使用以下视觉指示器表示三种维度模式：\n\n| Fixed Size | ![](img/Image2826.jpg)\
  \ |\n| Match Constraint | ![](img/Image2834.jpg) |\n| Wrap Content | ![](img/Image2844.jpg)\
  \ |\n\n表 19-1\n\n要更改当前设置，点击指示器可以在三种设置之间循环。\n\n此外，可以使用 `Expand Horizontally`（水平扩展）和\
  \ `Expand Vertically`（垂直扩展）选项根据约束和布局中的其他组件允许的最大范围扩展组件的水平或垂直尺寸。可以通过右键点击布局中的组件并从结果菜单选择\
  \ `Organize`（组织）选项来访问（图 19-26）。使用时，当前选中的组件将在水平或垂直方向上增大以填充周围的可用空间\n\n![](img/as_constraint_expand_menu.jpg)\n\
  \n图 19-26\n\n# 19.12 设计时工具定位\n\n\n\n[content]\n\n标题为 \"Android Studio 布局编辑器工具指南\"\
  的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器中生效的可见属性。在后台，Android Studio 还会使用 `tools`\
  \ 属性在将组件放置在没有约束的布局中时，将其保持在当前位置。例如，想象在禁用自动连接模式时，向布局中放置了一个 `Button`（按钮）。虽然该组件在预览画布上似乎处于正确位置，但当运行应用程序时，它将出现在屏幕的左上角。这是因为该组件没有约束来告诉父布局\
  \ `ConstraintLayout` 应该将其放置在何处。\n\n该组件在布局编辑器中显示位置正确，是因为 Android Studio 设置了绝对的 `X`\
  \ 和 `Y` 定位工具属性（`tools` attributes），以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，内容可能如下所示：\n\n\
  ```xml\n<Button\n    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了充分的约束，布局编辑器将移除这些工具属性。一种快速识别哪些组件缺少约束而无需等待程序运行的实用技巧，是点击在\
  \ 图 19-27 中高亮的按钮，以切换工具位置的可见性。任何跳转到左上角的组件都是未完全约束的，它们通过临时的 `tools` 绝对 `X` 和 `Y` 定位属性保持在位。\n\
  \n![](img/as_constraint_tool_button.jpg)\n\n图 19-27\n\n## 19.13 添加指南线 (Guidelines)\n\
  \n指南线（Guidelines）提供了可以锚定的额外元素。可以通过右键点击布局并选择“垂直指南线”（Vertical Guideline）或“水平指南线”（Horizontal\
  \ Guideline）菜单选项，或者使用工具栏菜单选项来添加指南线，如 图 19-28 所示：\n\n![](img/as_constraint_guidelines_menu.jpg)\n\
  \n图 19-28\n\n或者，可以从调色板（Palette）的“辅助工具”（Helpers）部分拖动水平和垂直 `Guidelines`，将其将其到布局画布或“组件树”（Component\
  \ Tree）面板上，如 图 19-29 所示：\n\n![](img/as_adding_guidelines.jpg)\n\n图 19-29\n\n添加后，指南线将以虚线的形式显示在布局中，并可以通过点击和拖动该线来移动。要建立到指南线的约束连接，点击组件的约束句柄并在释放之前将其拖动到指南线。在\
  \ 图 19-30 中，两个 `Buttons` 的左侧通过约束连接到一条垂直指南线。\n\n垂直指南线的位置可以指定为距离父布局左侧或右侧的绝对距离（对于水平指南线则为顶部或底部）。例如，下图中的垂直指南线位于距离父布局左边缘\
  \ `97dp` 的处：\n\n![](img/as_constrain_guideline.jpg)\n\n图 19-30\n\n或者，指南线也可以相对于父布局总宽度或高度的百分比进行定位。要在这三种模式之间切换，选择指南线并点击指南线底部或末端的圆形（取决于指南线是垂直还是水平）。例如，图\
  \ 19-31 显示了一个基于百分比定位的指南线：\n\n![](img/as_adding_guideline_percent.jpg)\n\n图 19-31\n\
  \n## 19.14 添加屏障 (Barriers)\n\n可以通过右键点击布局并在“添加辅助工具”（Add helpers）菜单中选择“垂直屏障”（Vertical）或“水平屏障”（Horizontal\
  \ Barrier）选项，或使用工具栏菜单选项来添加屏障，如 图 19-28 所示。或者，在调色板（Palette）的“辅助工具”部分找到 `Barrier`\
  \ 类型，并将其拖动到布局画布或“组件树”面板上。\n\n一旦布局中添加了屏障，它将作为组件树面板中的一个目：\n\n![](img/as_component_tree_barrier.jpg)\n\
  \n图 19-32\n\n要将视图作为引用视图（换句话说，控制屏障位置的视图），请将“组件树”内部的组件拖动到屏障条目上。例如，在 图 19-33 中，名为 `textView2`\
  \ 和 `textView3` 的组件已被分配为屏障的引用组件：\n\n![](img/as_barrier_reference_views.jpg)\n\n\
  图 19-33\n\n添加引用视图后，需要配置屏障，以指定屏障相对于这些视图的方向。这是屏障方向设置，当在“组件树”面板中选择屏障时，它在“属性”（Attributes）工具窗口中定义：\n\
  \n![](img/as_barrier_direction.jpg)\n\n图 19-34\n\n下图显示了一个包含屏障的布局，`textView1` 和 `textView2`\
  \ 作为引用视图。由于屏障是从引用视图的末端推挤，屏障方向设置为 `end`：\n\n![](img/as_barrier.jpg)\n\n图 19-35\n\n\
  ## 19.15 添加分组 (Group)\n\n要向布局添加 `Group`，可以右键点击布局并在“辅助工具”菜单中选择“分组”选项，或者使用如 图 19-28\
  \ 所示的工具栏选项。或者，在调色板的“辅助工具”部分找到 `Group` 项并将其拖动到布局画布或“组件树”面板。\n\n要向组添加组件，请在“组件树”中选择它们并拖动到\
  \ `Group` 条目。例如，图 19-36 显示将三个选中的组件添加到组中：\n\n![](img/as_constrain_group.jpg)\n\n\
  图 19-36\n\n组引用的任何组件在“组件树”中将以斜体显示在组项下方，如 图 19-37 所示。要从组中移除组件，选择它并按下键盘删除键：\n\n![](img/as_constrain_group_added.jpg)\n\
  \n图 19-37\n\n一旦组件分配给组，可以使用“属性”工具窗口的“约束”（Constraints）部分来修改可见性设置：\n\n![](img/as_group_invisible.jpg)\n\
  \n图 19-38\n\n## 19.16 使用流辅助工具 (Flow Helper)\n\n`Flow` 辅助工具可以像之前提到的那样使用菜单或调色板。与 `Group`\
  \ 辅助工具一样（图 19-36），可以通过将组件在“组件树”中拖动到 `Flow` 实例上来。添加 `Flow` 辅助工具并为其分配组件后，在“组件树”中选择它，并使用“属性”工具窗口的“常用属性”（Common\
  \ Attributes）部分来配置流布局行为：\n\n![](img/as_flow_attributes.jpg)\n\n图 19-39\n\n## 19.17\
  \ 组件组的对齐与分布\n\n当布局中选择了两个或多个组件时，Android Studio 布局编辑器工具提供一系列对齐和分布操作。按住 Shift 点击要参与操作的每个组件，右键点击布局并从“对齐”（Align）菜单中显示的许多选项中进行选择：\n\
  \n![](img/as_layout_align_menu.jpg)\n\n图 19-40\n\n如下 图 19-41 所示，这些选项也可以通过布局编辑器工具栏上的“对齐”按钮访问：\n\
  \n![](img/as_layout_align_menu_2.jpg)\n\n图 19-41\n\n\n\n\n\n图 19-41\n\n同样，`Pack`\
  \ 菜单（图 19-42）可以用于对所选的小部件进行整体重新定位，使其在垂直或水平方向上紧凑在一起。它通过更改小部件的绝对 `x` 和 `y` 坐标来实现这一点，但不会应用任何约束。另一方面，`Pack`\
  \ 菜单中的两个分布选项会移动所选的小部件，使它们在垂直或水平轴上均匀间距分布，并在视图之间应用约束以保持这种间距：\n\n![](img/as_layout_pack_menu.jpg)\n\
  \n图 19-42\n\n## 19.18 将其他布局转换为 ConstraintLayout\n\n对于使用一个或多个 Android 布局类（例如 `RelativeLayout`\
  \ 或 `LinearLayout`）的现有用户界面布局，`Layout Editor` 工具提供了一个将用户界面转换为使用 `ConstraintLayout`\
  \ 的选项。\n\n当 `Layout Editor` 工具打开并处于 `Design` 模式时，`Component Tree` 面板显示在 `Palette`\
  \ 之下。要将布局转换为 `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它，并选择 `Convert <current\
  \ layout> to Constraint Layout` 菜单选项：\n\n![](img/as_layout_convert_view_menu.jpg)\n\
  \n图 19-43\n\n选择此菜单选项时，`Android Studio` 将将选的布局转换为 `ConstraintLayout`，并使用推理来建立旨在匹配原始布局类型行为的约束。\n\
  \n### 19.19 总结\n\n重新设计的 `Layout Editor` 工具结合 `ConstraintLayout` 使得使用 `Android Studio`\
  \ 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细详细介绍了约束、外边距（margins）和偏置（bias）的概念，同时探索了基于 `ConstraintLayout`\
  \ 的设计如何集成到 `Layout Editor` 工具中。\n\n## 20. 在 Android Studio 中使用 ConstraintLayout\
  \ 链和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键功能，并概述了在 `Android Studio Layout Editor`\
  \ 中进行基于 `ConstraintLayout` 的用户界面设计的最佳实践。虽然 `ConstraintLayout` 链（chains）和比例（ratios）的概念在标题为\
  \ “Android ConstraintLayout 指南” 的章节中概述过，但我们还没有介绍如何在 `Layout Editor` 中使用这些功能。因此，本章的重点是提供在使用\
  \ `ConstraintLayout` 类时创建和管理链和比例的实用步骤。\n\n### 20.1 创建链\n\n链可以通过在活动的 XML 布局资源文件中添加几行代码，或通过\
  \ `Layout Editor` 的某些链特定功能来实现。\n\n考虑一个由三个 `Button` 小部件组成的布局，它们被约束在 `ConstraintLayout`\
  \ 父布局的左上角、顶部中央和右上角，如图图 20-1](#Chains_and_Ratios.xhtml__idTextAnchor527)所示：\n\n![](img/as_three_button_row.jpg)\n\
  \n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮小部件的项：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束将这些小部件分组成一条链。为了解决这个问题，需要从 `button1` 的右侧到 `button2`\
  \ 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧添加额外的约束，如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改后，小部件现在具有双向水平约束。这构成了 `Layout Editor` 中通过链连接表示的 `ConstraintLayout`\
  \ 链，如下面的图 20-2](#Chains_and_Ratios.xhtml__idTextAnchor529)所示。注意，链默认为分散（spread）样式。\n\
  \n![](img/as_layout_chain.jpg)\n\n图 20-2\n\n也可以通过右键点击视图之一并选择 `Chains -> Create Horizontal\
  \ Chain` 或 `Chains -> Create Vertical Chain` 菜单选项来创建链。\n\n### 20.2 修改链样式\n\n如果没有配置链样式，`ConstraintLayout`\
  \ 将默认使用分散样式。可以通过右键点击链中的任何小部件并选择 `Cycle Chain Mode` 菜单选项来更改链样式。每次点击该菜单选项，样式会在分散（spread）、内部分散（spread\
  \ inside）和紧凑（packed）之间切换。\n\n或者，可以在 `Attributes` 工具窗口中展开 `layout_constraints` 属性，并根据链的方向更改\
  \ `horizontal_chainStyle` 或 `vertical_chainStyle` 属性：\n\n![](img/as_layout_chain_style.jpg)\n\
  \n图 20-3\n\n### 20.3 内部分散链样式\n\n使用上述技术将链样式更改为内部分散链样式的效果如图 20-4](#Chains_and_Ratios.xhtml__idTextAnchor533）所示：\n\
  \n![](img/as_layout_chain_spread_inside.jpg)\n\n图 20-4\n\n### 20.4 紧凑链样式\n\n使用相同的技术，将链样式属性更改为\
  \ packed 会导致布局发生变化，如图 20-5](#Chains_and_Ratios.xhtml__idTextAnchor536）所示：\n\n![](img/as_layout_chain_packed.jpg)\n\
  \n图 20-5\n\n### 20.5 带偏置的紧凑链样式\n\n\n\n\n\n紧凑链（packed chain）的位置可能会受到偏移值（bias value）的影响。偏移值范围在\
  \ 0.0 到 1.0 之间，0.5 代表父容器的中心。偏移可以通过选择链头部控件，并在属性（Attributes）面板中为 `layout_constraintHorizontal_bias`\
  \ 或 `layout_constraintVertical_bias` 属性赋值来控制。图 20-6 显示了一个水平偏移设为 0.2 的紧凑链：\n\n![](img/as_layout_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n---\n\n## 20.6 加权链\n\n要探索的最后链类型涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占的比例。加权链只能通过散开链（spread\
  \ chain）样式实现，并且链中任何响应权重属性的控件必须将其相应的尺寸属性（垂直链为 `height`，水平链为 `width`）配置为匹配约束（match\
  \ constraint）模式。控件尺寸的匹配约束模式可以通过选择控件、显示属性面板并将尺寸更改为 `match_constraint`（等于 0dp）来配置。例如，在图\
  \ 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint` (0dp)，表示控件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_match_constraints.jpg)\n\n图 20-7\n\n假设已选择散开链样式且三个按钮均已配置为宽度设置为匹配约束，则链中的控件将等比例扩展以填充可用空间：\n\
  \n![](img/as_layout_unweighted_chain.jpg)\n\n图 20-8\n\n每个控件相对于链中其他控件的占空间大小可以通过向控件添加权重属性（weight）来控制。图\
  \ 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight` 属性设置为 4，将 `button2`\
  \ 和 `button3` 均设置为 2 的效果：\n\n![](img/as_layout_weighted_chain.jpg)\n\n图 20-9\n\n\
  由于这些权重值，`button1` 占据了空间的一半 (4/8)，而 `button2` 和 `button3` 各占据空间的四分之一 (2/8)。\n\n---\n\
  \n## 20.7 比例的使用\n\nConstraintLayout 比例允许一个控件的尺寸相对于控件的另一个尺寸进行缩放（也称为宽高比）。例如，可以为 `ImageView`\
  \ 应用长高宽比设置，以确保其宽度始终是高度的两倍。\n\n尺寸比例约束是通过通过将受限的维度设置为匹配约束模式，并将该控件的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来实现的。该比例值可以指定为浮点值或宽:高 比例设置。例如，以下 XML 代码段在 `ImageView` 控件上配置了 2:1 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这需要在比例前加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度进行受限的。\n\n例如，考虑以下 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n\n在上述示例中，高度将根据应用于其上的约束来定义。在这种情况下，配置了约束，使其附加到父视图的顶部和底部，实质上是将控件拉伸以填充父视图的高度。另一方面，宽度维度被限制为\
  \ `ImageView` 高度的三分之一。因此，无论布局显示在什么种尺寸的屏幕或方向上，`ImageView` 的高度始终与父视图相同，宽度为该高度的三分之一。\n\
  \n在不手动编辑 XML 资源文件的情况下也可以相同的结果。每当控件维度设置为匹配约束模式时，属性面板的检查器区域就会出现一个比例控制开关。例如，图 20-10\
  \ 显示了按钮控件的布局宽度和高度属性分别设置为匹配约束模式和 100dp，并高亮了比例控制开关：\n\n![](img/as_layout_toggle.jpg)\n\
  \n图 20-10\n\n默认情况下，比例控制是关闭的。点击该控件可以启用比例约束，并显示一个可以更改比例的额外字段：\n\n![](img/as_layout_ratio.jpg)\n\
  \n图 20-11\n\n---\n\n### 20.8 总结\n\n链和比例都是 `ConstraintLayout` 的强大功能，旨在为设计灵活的用户界面提供更多选项。正如本章所述，Android\
  \ 编辑器已经过增强，以便在界面设计过程中使用这些功能。\n\n---\n\n## 21. ConstraintLayout 教程\n\n设计 Android\
  \ 界面的最简单且有效的方法是使用布局编辑器。本章将提供如何使用这种方法创建基于 `ConstraintLayout` 的界面的概述。本章包含的练习也将作为从“空白”Android\
  \ 项目开始活动的机会。\n\n在介绍布局编辑器之后，本章还将介绍布局检查器。\n\n### 21.1 布局编辑器示例\n\n此阶段的第一步是创建一个 Android\
  \ 项目。启动 Android Studio 并通过选择 `File -> Close Project` 关闭任何之前打开的项目。\n\n在欢迎屏幕上选择 `New\
  \ Project`，选择 `Empty Views Activity` 模板并点击 `Next`。在 `Name` 字段中输入 `LayoutSample`，并将\
  \ `com.ebookrenzy.layoutsample` 作为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API\
  \ 26: Android 8.0 (Oreo)`并将 `Language` 菜单更改为 Java。\n\n### 21.2 准备布局编辑器环境\n\n在 `app\
  \ -> res -> layout` 文件夹中找到并双击 `activity_main.xml` 布局文件，将其加载到布局编辑器。由于本教程旨在获得使用约束的经验，使用布局编辑器工具栏上的按钮关闭\
  \ `Autoconnect` 功能。一旦禁用，该按钮将出现一条删除线，正如图 21-1 所示：\n\n![](img/as_layout_sample_autoconnect_off.jpg)\n\
  \n图 21-1\n\n如果 `Autoconnect` 按钮右侧的默认间距值不是 8dp，点击它并在生成的面板中选择 8dp。\n\n用户界面设计还将使用 `ImageView`\
  \ 对象来显示图像。在继续之前，应将此图像添加到项目中，以便在章稍后的部分使用。\n\n\n\n\n\n[`www.ebookfrenzy.com/retail/giraffejava/index.php`](https://www.ebookfrenzy.com/retail/giraffejava/index.php)\n\
  \n在 Android Studio 中，显示资源管理器工具窗口（`View -> Tool Windows -> Resource Manager`）。在操作系统的文件导航器中找到\
  \ `GalaxyS23.webp` 图像并将其拖放到 Resource Manager 工具窗口中。在弹出的对话框中，点击 `Next`，然后点击 `Import`\
  \ 按钮，将图像添加到项目中。现在该图像应该出现在 Resource Manager 中，如下方的图 21-2 所示：\n\n![](img/as_resource_manager.jpg)\n\
  \n图 21-2\n\n该图像也会出现在 Project 工具窗口的 `res -> drawables` 部分：\n\n![](img/as_layout_sample_image_added.jpg)\n\
  \n图 21-3\n\n## 21.3 向用户界面添加小部件\n\n从 `Common` 调板类别中，将 `ImageView` 对象拖入显示视图的中心。注意此时会出现水平和垂直的虚线，表示显示的中心轴。居中时，释放鼠标按键将视图放置在目标位置。一旦放置在布局中，就会出现\
  \ `Resources` 对话框，请求在视图中显示的图像。在对话框顶部的搜索栏中输入“galaxy”以找到 `galaxysys6.png` 资源，如图 21-4\
  \ 所示：\n\n![](img/as_pick_a_resource.jpg)\n\n图 21-4\n\n选择图像并点击 `OK` 将其分配给 `ImageView`\
  \ 对象。如有必要，使用缩放手柄调整 `ImageView` 的大小，并将其重新定位在布局中心。此时，布局应当与图 21-5 一致：\n\n![](img/as_layout_sample_image_layout.jpg)\n\
  \n图 21-5\n\n从调板的 `Common` 部分点击并拖动 `TextView` 对象，并将其放置在 `ImageView` 上方，如图 21-6 所示：\n\
  \n使用 `Attributes` 面板，展开 `Common Attributes` 部分中的 `textAppearance` 属性条目，将 `textSize`\
  \ 属性改为 `24sp`，将 `textAlignment` 设置为居中，并将文本改为“Samsung Galaxy S23”。\n\n![](img/as_layout_sample_textview.jpg)\n\
  \n图 21-6\n\n接下来，在布局底部添加三个 `Button` 小部件，并将这些视图的文本属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应当与图\
  \ 21-7 一致：\n\n![](img/as_layout_sample_full_ui.jpg)\n\n图 21-7\n\n此时，小部件的约束还不足，以使布局引擎能够在运行时对它们进行定位和调整大小。如果现在运行程序，所有小部件都将位于在显示器的左上角。\n\
  \n在布局中添加小部件后，使用 Layout 编辑器工具栏中的设备旋转菜单（如图 21-8 中的箭头所示），以横屏模式查看用户界面：\n\n![](img/as_layout_rotate_device.jpg)\n\
  \n图 21-8\n\n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，并且部分图像以及三个按钮都位于屏幕的可视区域之外。要使此成为一个响应式用户界面，仍需要进行一些工作。\n\
  \n### 21.4 添加约束\n\n约束是创建适应设备方向变化和不同屏幕尺寸布局的关键。首先将布局旋转回竖屏模式，并选择 `ImageView` 上方的 `TextView`\
  \ 小部件。在选中小部件后，从 `TextView` 的左侧、右侧和顶部建立到父级 `ConstraintLayout` 相应侧的约束，如图 21-9 所示。将顶部约束的间距设置为\
  \ `16`：\n\n![](img/as_layout_sample_textview_constraints.jpg)\n\n图 21-9\n\n约束好 `TextView`\
  \ 小部件后，选择 `ImageView` 实例并在左右两侧建立相对的约束，每个约束都连接到父布局的相应侧。接下来，建立从 `ImageView` 顶部到 `TextView`\
  \ 底部的约束连接，以及从 `ImageView` 底部到中间 `Button` 小部件顶部的约束。如有必要，点击并拖动 `ImageView` 以保持其位于布局的垂直中心。\n\
  \n在仍选中 `ImageView` 的情况下，使用属性面板中的 `Inspector` 将 `ImageView` 的顶部和底部边距分别更改为 `24` 和\
  \ `8`，并将小部件的高度和宽度维度属性都更改为 `match_constraint`，这样小部件将根据约束调整大小。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局变化：\n\n![](img/as_layout_sample_constraints.jpg)\n\n图 21-10\n\
  \n图 21-11 显示了相对于布局中其他元素的 `ImageView` 当前实现的约束：\n\n![](img/as_layout_sample_constraints.jpg)\n\
  \n图 21-11\n\n最后的任务是为三个 `Button` 小部件添加约束。对于此示例，按钮将放置在链中。首先，通过点击 Layout 编辑器中如图 21-1\
  \ 所示的工具栏开启 `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后 Shift 点击另外两个按钮以选中三个。右键点击 `Buy\
  \ Now` 按钮并从菜单中选择 `Chains -> Create Horizontal Chain`。默认情况下，链将使用 `spread` 样式显示，这是本示例的正确行为。最后，在\
  \ `Buy Now` 按钮与布局底部之间建立约束，设置为 `8`。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应当如图 21-12 所示受到约束：\n\n\
  ![](img/as_layout_sample_button_chain.jpg)\n\n图 21-12\n\n### 21.5 测试布局\n\n向布局添加约束后，将屏幕旋转到横屏并验证布局适应新的屏幕尺寸。\n\
  \n虽然 Layout Editor 工具提供了一个设计用户界面布局的良好视觉环境，但在测试方面，运行应用程序是必要的。在物理 Android 设备或模拟器会话上启动应用，并验证用户界面反映了在\
  \ Layout Editor 中创建的布局。例如，图 21-13 显示了横屏模式下的运行应用：\n\n![](img/as_layout_sample_landscape.jpg)\n\
  \n图 21-13\n\n用户界面设计已完成。设计更复杂的用户界面布局是上述步骤的延续。根据需要将视图拖放到显示器、定位、约束并设置属性。\n\n## 21.6\
  \ 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具查看用户界面布局的组件层次结构。应用程序必须在运行 Android\
  \ API 29 或更高版本的设备或模拟器上运行才能访问此类信息。应用运行时，选择 `Tools -> Layout Inspector` 菜单选项，然后使用下方图\
  \ 21-14 中标记为 A 的菜单选择要检查的过程）。\n\n\n\n\n一旦布局检查器（Inspector）加载，左侧面板 (A) 将显示组成用户界面布局的组件层级。中间面板\
  \ (B) 可视化地表示布局设计。点击视觉布局中的一个部件会导致该项在层级列表中高亮显示，从而轻松找到视觉组件相对于整体布局层级的位置。\n\n最右侧面板（在图\
  \ 21-14 中标记为 C）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深度分析。在适当的情况下，值单元格将包含指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_sample_layout_inspector.jpg)\n\n图 21-14\n\n要以 3D 视图查看布局，点击标记为\
  \ D 的按钮。这将显示层级的“爆炸”表示，以便对其进行旋转和检查。这对于识别遮挡的视图等任务非常有用：\n\n![](img/as_layout_sample_layout_inspector_3d.jpg)\n\
  \n图 21-15\n\n点击并拖动渲染图以进行三维旋转，使用上方箭头指示的滑块来增加层之间的间距。再次点击标记为 E 的按钮返回 2D 视图。\n\n###\
  \ 21.7 总结\n\nAndroid Studio 中的布局编辑器工具与 `ConstraintLayout` 类紧密集成。本章通过创建一个示例用户界面，概述了如何使用布局编辑器工具添加部件并设置约束来实现基于\
  \ `ConstraintLayout` 的用户界面。本章还介绍了实时布局检查器（Live Layout Inspector）工具，它对于分析用户界面布局的结构组成很有用。\n\
  \n## 22 在 Android Studio 中手动设计 XML 布局\n\n虽然使用 Android Studio 布局编辑器工具设计布局极大地提高了效率，但仍然可以通过手动编辑底层\
  \ XML 创建 XML 布局。本章将介绍 Android XML 布局文件格式的基础。\n\n### 22.1 手动创建 XML 布局\n\nXML 布局文件的结构非常简单，遵循视图树的层级方法。XML\
  \ 资源文件的第一行理想情况下包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  ```\n\n该声明之后应当是布局的根元素，通常是一个容器视图（例如布局管理器）。这由起始和结束标签以及需要在视图上设置的任何属性表示。例如，下面的 XML 声明了一个\
  \ `ConstraintLayout` 视图作为根元素，并设置 `match_parent` 属性使其填充设备显示的所有可用空间：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n在上面的示例中，布局元素每个侧都配置了\
  \ 16dp（密度无关像素）的内边距。Android 布局中的任何间距规范必须使用以下测量单位之一：\n\n* `in` – 英寸。\n* `mm` – 毫米。\n\
  * `pt` – 点（1/72 英寸）。\n* `dp` – 密度无关像素。一种根据设备显示物理密度相对于 160dpi 显示基准而计算的抽象测量单位。\n*\
  \ `sp` – 字体缩放无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n* `px` – 实际像素。不建议使用，因为不同的显示器每英寸像素数不同。建议使用\
  \ `dp` 而不是此单位。\n\n任何需要添加到 `ConstraintLayout` 父元素的子元素必须嵌套在起始和结束标签之间。在接下来的示例中，添加了一个\
  \ `Button` 部件作为 `ConstraintLayout` 的子：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n按照目前的实现，该按钮没有任何连接。因此，在运行时，按钮将出现在右上角（尽管由于父元素分配的内边距，它缩进了\
  \ 16dp）。如果为按钮侧边添加了约束，它将显示在布局的居中位置：\n\n```xml\n<Button\n    android:text=\"My Button\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+button\"\n    app:layout_constraintBottom=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n要在布局布局中添加第二个部件，请将其嵌入 `ConstraintLayout` 的主体内。下面的修改示例添加了一个 `TextView`：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+button\"\n        app:layout_constraintBottom=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"My Text\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  再次，由于新添加的 `TextView` 缺少约束，它将在运行时出现在布局的左上角。下面的修改添加了连接父布局的对立约束以使部件水平居中，同时添加了一个将 `TextView`\
  \ 底部连接到 `button` 顶部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/textView\"\n    android:layout_marginTop=\"8dp\"\n    android:layout_marginBottom=\"\
  8dp\"\n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n此外，请注意 `Button` 和 `TextView` 视图声明了几个属性。这两个视图都分配了 ID，并被配置为显示由名为\
  \ `button_string` 和 `text_string` 的字符串资源表示的文本字符串。此外，两个对象都声明了 `wrap_content` 高和 `width`\
  \ 属性，以便它们的大小能够适应内容（在本例中，为字符串资源值所引用的文本）。\n\n在设计模式下从布局编辑器的预览（Preview）面板查看，上述布局的渲染结果如图\
  \ 22-1 所示：\n\n![](img/as_manual_xml_ui.jpg)\n\n图 22-1\n\n## 22.2 手动 XML 与视觉化布局设计\n\
  \n是手动编写 XML 还是使用设计模式下的布局编辑器工具，取决于个人偏好。然而，使用设计模式具有其优势。\n\n首先，设计模式通常会更快，因为它避免了输入 XML\
  \ 代码的需要。此外，设计模式避免了学习 Android SDK 视图类中各种属性值的复杂性。不需要不断查阅 Android 文档来查找正确的关键字和值，大多数属性都可以通过参考属性（Attributes）面板来找到。\n\
  \n抛开设计模式的所有优势不谈，重要的是，用户界面设计的这两种方法并不是互斥的。作为应用程序开发者，你可能会在设计模式下创建用户界面，同时通过直接编辑生成的 XML\
  \ 资源对设计进行微调和布局调整。界面设计的两种视图在 Android Studio 环境中并排显示，使得在 XML 和视觉布局之间进行无缝工作变得易许多。\n\
  \n### 22.3 总结\n\nAndroid Studio 布局编辑器工具为用户界面设计提供了一种视觉直观的方法。通过使用拖放模式结合一组属性编辑器，该工具为应用程序开发者带来了显著的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其格式结构良好且易于理解。\n\n布局编辑器工具生成 XML 资源文件的事实意味着，这两种界面设计方法可以结合，为用户界面开发提供一种“兼取优优点”的方法。\n\
  \n## 23 使用约束集管理约束\n\n到本书为止，所有的用户界面设计任务都是使用 Android Studio 布局编辑器工具（以文本或设计模式）完成的。编写\
  \ XML 资源文件或使用 Android Studio 布局编辑器的替代方案是编写 Java 代码来直接创建、配置和操作组成 Android Activity\
  \ 用户界面的视图对象。本章将探索编写 Java 代码创建用户界面的某些优缺点，然后描述如视图属性以及布局约束的创建和管理等关键概念。\n\n在下一章中，将创建并使用一个示例项目，以演示这种\
  \ Android 用户界面创建方法中涉及的一些典型步骤。\n\n### 23.1 Java 代码与 XML 布局文件\n\n相比 Java 代码，使用 XML\
  \ 资源文件设计用户界面（而不是编写 Java 代码）具有许多优势。事实上，Google 在 Android 文档中花费了大量精力来赞扬 XML 资源优于 Java\
  \ 代码的优点。正如上一节讨论的，XML 方法的一个关键优势是可以使用 Android Studio 布局编辑器工具，它可以生成 XML 资源。第二个优势是，一旦创建了应用程序，就可以通过修改\
  \ XML 文件对用户界面屏幕进行更改，从而避免重新编译应用程序。此外，即使是手动编写 XML 布局，也可以通过 Android Studio 布局编辑器的预览功能对用户界面的外观获得即时反馈。为了测试由\
  \ Java 创建的用户界面的外观，开发者不可避免地需要循环编写代码、编译和测试，以完成设计工作。\n\n关于使用 Java 代码创建布局的优势，Java 相比\
  \ XML 资源文件最显著的优势体现在处理动态用户界面时。XML 资源文件在定义静态布局时本质上最有用，静态布局在每次调用 Activity 之间不太发生显著变化。相反，Java\
  \ 代码非常适合在运行时动态创建用户界面。当用户界面可能受外部因素影响每次执行 Activity 时显示不同时，这特别有用。\n\n当必须在 Activity\
  \ 运行时实时对基于静态 XML 资源的布局进行动态更改时，在 Java 代码中处理用户界面组件的知识也会有用。\n\n最后，一些开发者倾向于编写 Java 代码而不是使用布局工具和\
  \ XML，无论后者提供了哪些优势。\n\n### 23.2 创建视图\n\n如前，Android SDK 包含了一个视图类工具箱，以满足大多数基本的用户界面设计需求。在\
  \ Java 中创建视图就是创建这些类的实例，并传递与该视图关联的 Activity 引用作为参数。\n\n第一个视图（通常是可以添加额外子视图的容器视图）通过调用\
  \ Activity 的 `setContentView()` 方法显示给用户。可以通过调用对象的 `addView()` 方法向根视图中添加额外的视图。\n\n\
  当使用 Java 代码操作 XML 布局资源文件中包含的视图时，必须获取视图的 ID。在 Java 中创建的视图遵循相同的规则。因此，对于后续 Java 代码中需要某些类型访问的任何视图，都有必要分配一个\
  \ ID。这是通过调用相关视图对象的 `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n###\
  \ 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象的外观或行为。属性的示例包括 `Button`\
  \ 对象上的文本或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用它将按钮显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackgroundColor()` 方法设置。\n\n### 23.4 约束集\n\n虽然属性设置是视图内部的并决定了视图的外观和行为，但约束集控制视图相对于父视图和其他兄弟视图的外观。每个\
  \ `ConstraintLayout` 实例都关联有一组约束，定义了子视图的位置和约束关系。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行创建、配置和向 `ConstraintLayout` 实例应用约束的任务。此外，可以将 `ConstraintLayout`\
  \ 实例的当前约束复制到 `ConstraintSet` 对象中，并应用到其他布局（无论是否经过修改）。\n\n`ConstraintSet` 实例像任何其他\
  \ Java 对象一样被创建：\n\n```\nConstraintSet set = new ConstraintSet();\n```\n\n\n\n\n\
  一旦创建了约束集，就可以调用实例上的方法来执行各种任务。\n\n#### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，并有 70dp 的间距：\n\
  \n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n            editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2 将约束应用到布局\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout`\
  \ 实例才能生效。可以通过调用 `applyTo()` 方法来应用约束集，并传递要应用设置的布局对象的引用：\n\n```java\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父级约束连接\n\n通过引用 `ConstraintSet.PARENT_ID` 常量，也可以建立子视图与其父 `ConstraintLayout`\
  \ 之间的连接。在以下示例中，约束集被配置为将 `Button` 视图的顶部边缘连接到父布局的顶部，间距为 100dp：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n            ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n#### 23.4.4 尺寸约束\n\n提供了多种方法来控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸设置为最大 `250dp`：\n\n```java\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(), 250);\n\
  ```\n\n### 23.4.5 约束偏置 (Constraint Bias)\n\n正如“Android Studio ConstraintLayout 使用指南”章节中所述，当视图具有对立的约束时，它将沿着约束轴（即水平或垂直）居中。这种居中可以通过在特定的约束轴上应用偏置来调整。当使用\
  \ Android Studio 布局编辑器时，这是通过 Attributes 工具窗口中的控件实现的。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏置，引用视图 ID 和作为 0 到 1 之间的浮点值的偏置值。\n\n例如，以下代码在应用 25% 的水平偏置之前，将\
  \ `Button` 的左侧和右侧连接到父布局的相应侧：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n            ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n#### 23.4.6 对齐约束\n\
  \n也可以使用约束集应用对齐方式。Android Studio 布局编辑器提供的全套对齐选项也可以通过 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法使用约束集进行配置，这两种方法都根据正在配置的对齐方式接收各种不同的参数。此外，可以使用 `center()` 方法将视图在两个其他视图之间居中。\n\n\
  在下面的代码中，`button2` 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例的当前约束集复制到约束集对象中。例如，以下代码将名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n一旦复制，可以将约束集直接应用于另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链 (Chains)\n\n还可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集中创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int\
  \ leftSide, int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n\
  ```\n\n根据上述语法，以下示例创建了一个从 `button1` 开始到 `button4` 结束的水平扩散链。在这些视图之间是 `button2` 和 `button3`，它们的权重都设置为零：\n\
  \n```java\nint[] chainViews = {button2.getId(), button3.getId()};\nfloat[] chainWeights\
  \ = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT,\n  \
  \      ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, chainViews, \n        chainWeights,\
  \ ConstraintSet.SPREAD);\n```\n\n### 23.4.9 引导线 (Guidelines)\n\n使用 `create()` 方法将引导线添加到约束集中，并使用\
  \ `setGuidelineBegin()`、`setGuidelineEnd()` 或 `setGuidelinePercent()` 进行定位。在下面的代码中，创建一个垂直引导线并将其放置在父布局宽度的\
  \ 50% 处。然后将 `Button` 视图的左侧连接到该引导线且无间距：\n\n```java\nset.create(R.id.myGuideline,\
  \ ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\n        R.id.myGuideline,\
  \ ConstraintSet.RIGHT, 0);\nset.applyTo(layout);\n```\n\n#### 23.4.10 移除约束\n\n可以使用\
  \ `clear()` 方法从约束集中移除约束，传递视图 ID 和要移除约束的锚点：\n\n```java\nset.clear(button.getId(),\
  \ ConstraintSet.LEFT);\n```\n\n同样，可以通过在 `clear()` 方法中引用视图来一次性移除视图的所有约束：\n\n```java\n\
  set.clear(button.getId());\n```\n\n#### 23.4.11 缩放\n\n可以使用 `ConstraintSet` 的 `setScaleX()`\
  \ 和 `setScaleY()` 方法调整布局内视图的比例，这些方法接收执行操作的视图以及表示比例的浮点值。在下面的代码中，按钮对象缩放为宽的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n#### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在\
  \ X 轴或 Y 轴上旋转视图，这两种方法必须传递要旋转视图的 ID 和表示旋转角度的浮点值。旋转轴点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。下面的代码使用位于 500, 500 的轴点将按钮视图沿 Y 轴旋转 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n\n\n\n\n[`developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`](https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet)\n\
  \n### 23.5 总结\n\n作为编写 XML 布局资源文件或使用 Android Studio 布局工具的替代方案，Android 用户界面也可以 Java\
  \ 代码中动态创建。\n\n在 Java 代码中创建布局包括创建视图类的实例，并在这些对象上设置属性，以定义所需的显示和行为。\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的定位和大小是通过使用约束集（constraint sets）来定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以可以使用广泛的方法调用进行配置，以执行诸如建立约束连接、控制视图尺寸行为以及创建链（chains）等任务。\n\
  \n在本章介绍 `ConstraintSet` 类的基础知识后，下一章将通过一个教程将这些功能应用于实际场景。\n\n# 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 `ConstraintLayout` 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将通过创建一个完全使用\
  \ Java 代码创建且不使用 Android Studio 布局工具的示例布局将这些概念付诸实践。\n\n### 24.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio，从欢迎屏幕上选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置改为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单设置为 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件将自动加载到编辑面板中。正如我们预期的那样，Android Studio\
  \ 创建了一个模板 Activity 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想位置。\n\n### 24.2\
  \ 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除此行代码：\n\n```\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n下一个修改是向 Activity 添加一个包含单个\
  \ `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 视图中，进而通过调用 Activity 实例的 `setContentView()`\
  \ 方法显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，必须向构造方法传递创建该对象的上下文（context），在本例中，它是当前的\
  \ Activity。由于上述代码位于 Activity 类中，因此通过标准的 `this` 关键字引用上下文：\n\n`Button myButton = new\
  \ Button(this);`\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见结果将显示现在 `ConstraintLayout`\
  \ 视图的左上角，一个没有文本的按钮，如图 [24-1] 所示。\n\n![](img/Image2435.jpg)\n\n图 24-1\n\n### 24.3\
  \ 设置视图属性\n\n对于此练习，我们需要 `ConstraintLayout` 视图的背景为蓝色，并让 `Button` 视图在黄色背景上显示文本为“Press\
  \ Me”。这些任务可以通过如下文代码片段所示，在 Java 代码中为视图设置属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将将其作为 `String`\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并对其进行修改，为“Press\
  \ Me”字符串添加资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用的字符串的推荐方法，但后续许多代码示例将直接在代码中输入字符串，以避免重复本书的内容。一旦字符串存储为资源，就可以从代码内部访问：`getString(R.string.press_me)`。\n\
  \n创建字符串资源后，添加代码设置文本和颜色：\n\n```java\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private void configureLayout() {\n\
  \        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当应用程序运行时，布局将反映这些属性设置，使得布局呈现蓝色背景，按钮在黄色背景上显示指定的文本。\n\n### 24.4 创建视图 ID\n\
  \n当布局完成后，它将包含一个 `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法引用这些视图之前，必须为它们分配唯一的\
  \ ID。此过程的第一步是创建一个包含这些 ID 的新资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New -> Values\
  \ Resource File` ，并将新资源文件命名为 `id.xml`。创建资源文件后，将其修改如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\" type=\"id\"\
  \ />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\n在教程的此时，只创建了\
  \ `Button`，因此编辑 `configureLayout()` 方法为对象分配相应的 ID：\n\n```java\nprivate void configureLayout()\
  \ {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n### 24.5 配置约束集\n\n如果没有约束，`ConstraintLayout` 视图将 `Button` 视图放置在屏幕的左上角。为了指示布局视图将按钮放在不同的位置（在本例中为水平和垂直居中），需要创建一个\
  \ `ConstraintSet` 实例，使用适当的设置对其初始化并将其应用于父布局。\n\n对于此示例，需要配置按钮，使其宽度和高度受其显示的文本大小限制，并将视图在父布局中居中。\n\
  \n\n\n\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\n.\n\
  \n.\n\nprivate void configureLayout() {\n    Button myButton = new Button(this);\n\
  \    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n    ConstraintSet set = new ConstraintSet();\n \
  \   set.constrainHeight(myButton.getId(),\n              ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(),\n              ConstraintSet.WRAP_CONTENT);\n\
  \    set.connect(myButton.getId(), ConstraintSet.START,\n              ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\n    set.connect(myButton.getId(), ConstraintSet.END,\n\
  \              ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP,\n              ConstraintSet.PARENT_ID, ConstraintSet.TOP,\
  \ 0);\n    set.connect(myButton.getId(), ConstraintSet.BOTTOM,\n              ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\n    set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用程序，验证\
  \ `Button` 视图现在是否出现在布局的中心：\n\n![](img/Image2444.jpg)\n\n图 24-2\n\n### 24.6 添加 EditText\
  \ 视图\n\n下一个要添加到布局中的项是 `EditText` 视图。第一步是创建 `EditText` 对象，分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。为了实现这些步骤，现在需要对\
  \ `configureLayout()` 方法进行如下代码更改：\n\n```java\nprivate void configureLayout() {\n\
  \    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText myEditText = new EditText(this);\n    myEditText.setId(R.id.myEditText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(myEditText);\n    setContentView(myLayout);\n\
  .\n\n.\n}\n```\n\n`EditText` 小部件的设计目标是根据其显示的内容调整大小，在布局中水平居中，并放置在现有 `Button` 视图上方\
  \ 70dp 处。向 `configureLayout()` 方法添加代码，使其内容如下：\n\n.\n\n.\n\nset.connect(myButton.getId(),\
  \ ConstraintSet.START,\n          ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myButton.getId(), ConstraintSet.END,\n          ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP,\n   \
  \           ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM,\n              ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM,\
  \ 0);\nset.constrainHeight(myEditText.getId(),\n                    ConstraintSet.WRAP_CONTENT);\n\
  set.constrainWidth(myEditText.getId(),\n              ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START,\n          ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\nset.connect(myEditText.getId(), ConstraintSet.END,\n\
  \          ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.BOTTOM,\n          myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n\
  \n应用程序测试运行应该显示 `EditText` 字段位于按钮上方，并有 70dp 的间距。\n\n### 24.7 将密度像素 (dp) 转换为像素 (px)\n\
  \n此练习的下一个任务是将 `EditText` 视图的宽度设置为 200dp。正如“Android Studio 布局编辑器 ConstraintLayout\
  \ 教程”章节概述的那样，在用户界面布局中设置尺寸和位置时，使用密度无关像素 (dp) 比使用像素 (px) 更好。要使用 `dp` 设置位置，必须在运行时考虑设备密度，将\
  \ `dp` 值转换为 `px` 值。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要向类中添加以下代码：\n\n```java\npackage\
  \ com.ebookrenzy.javalayout;\n\n.\n\n.\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(\n              TypedValue.COMPLEX_UNIT_DIP,\
  \ value,\n              r.getDisplayMetrics());\n    }\n\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        myLayout.addView(myEditText);\n  \
  \      int px = convertToPx(200);\n        myEditText.setWidth(px);\n.\n\n.\n  \
  \  }\n}\n```\n\n再次编译并运行应用程序，注意 `EditText` 的宽度已经更改，如图 24-3 所示：\n\n![](img/Image2451.jpg)\n\
  \n图 24-3\n\n### 24.8 总结\n\n在本章中创建的示例 Activity（颜色和视图类型除外）与“在 Android Studio 中手动设计布局”章节中创建的界面相似。尽管如此，本章至少应该让你意识到\
  \ Android Studio 布局编辑器工具在很大程度上减轻了开发的复杂性。\n\n然而，在某些情况下，使用 Java 创建用户界面是合理的。例如，这种方法在创建动态用户界面布局时最为有用。\n\
  \n# 25. Android Studio 中使用 Apply Changes 的指南\n\n现在已经涵盖了使用 Android Studio 进行开发的一些基本概念，现在是介绍\
  \ Android Studio Apply Changes 功能的好时了。正如所有经验丰富的开发者所知，等待应用程序编译和运行的每一秒都应该用于编写和优化代码。\n\
  \n### 25.1 介绍 Apply Changes\n\n在 Android Studio 的早期版本，每当需要测试项目的更改时，Android Studio\
  \ 重新编译代码、转换为 Dex 格式、生成 APK 包文件并将其安装到设备或模拟器上。在执行这些步骤后，应用程序才能启动并准备就绪。即使在快速的开发系统中，这个过程也需要大量时间。对于大型应用程序，这个过程通常需要一分钟以上。\n\
  \n相比之下，Apply Changes 允许项目中的许多代码更改在设备或模拟器运行时运行时几乎立即反映在应用程序中。\n\n考虑一个正在 Android Studio\
  \ 开发且已在设备或模拟器上启动的应用。如果对资源设置或方法内部的代码进行更改，Apply Changes 将把更新的代码和资源推送到运行的应用程序，并动态地“交换”这些更改。这样，无需构建、部署和重新启动整个应用程序，更改就会反映在运行的应用中。\n\
  \n### 25.2 理解 Apply Changes 选项\n\nAndroid Studio 提供了三种应用于运行应用程序的更改选项，形式分别为 Run App、Apply\
  \ Changes 以及 Restart Activity 和 Apply Code Changes。这些选项可以总结如下：\n\n\n\n\n\n- **运行应用\
  \ (Run App)** - 停止当前运行的应用并重启它。如果自上次启动以来项目未发生任何更改，则此选项将重启应用。相反，如果项目已发生更改，Android\
  \ Studio 将在启动应用之前重新构建并将应用重新安装到设备或模拟器上。\n- **应用代码更改 (Apply Code Changes)** - 当项目中的更改仅涉及现有方法体的修改，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用于正在运行的应用，而无需重启应用或当前运行的活动。然而，当对任何项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。如果对项目清单（manifest）进行了更改，也无法使用此选项。\n\
  - **应用更改并重启活动 (Apply Changes and Restart Activity)** - 选中后，此模式将动态应用项目内的任何代码或资源更改，并在不重新安装或重启应用的情况下重启活动。与“应用代码更改”选项不同，当对项目的代码和资源进行更改时可以使用此模式。但是，仍然适用于涉及某些结构性代码更改和清单修改的限制。\n\
  \n### 25.3 使用应用更改\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以使用工具栏上的 `run`（在图 25-1\
  \ 中标记为 A）或 `debug`（B）按钮按通常方式启动它：\n\n![](img/as_run_and_debug_buttons.jpg)\n\n图 25-1\n\
  \n在应用启动并运行后，将出现一个停止按钮（在图 25-2 中标记为 A），并且“应用更改并重启活动”（B）和“应用代码更改”（C）按钮将可用：\n\n![](img/as_apply_code_changes_buttons.jpg)\n\
  \n图 25-2\n\n如果在选定其中一个“应用更改”按钮后无法应用更改，Android Studio 将显示一条指示失败的消息和相关说明。例如，图 25-3\
  \ 显示了在对资源文件进行更改后选择“应用代码更改”选项时 Android Studio 显示的消息：\n\n![](img/as_instant_run_restart_resources.jpg)\n\
  \n图 25-3\n\n在这种情况下，解决方案是使用“应用更改并重启活动”选项（此处提供了链接）。同样地，当尝试应用涉及删除方法的更改时，将出现以下消息：\n\n\
  ![](img/as_instant_run_restart_method_removed.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击“运行应用”按钮以重新安装并重启应用。作为手动选择正确选项的备选方案，可以配置\
  \ Android Studio 自动回退到执行执行“运行应用”操作。\n\n## 25.4 配置应用更改回退设置\n\n应用更改回退设置位于 Android\
  \ Studio 设置对话框中。在设置对话框中，在左侧面板中选择 `Build, Execution, Deployment`（构建、执行、部署）然后然后选择\
  \ `Deployment`（部署），如图 25-5 所示：\n\n![](img/as_instant_run_settings.jpg)\n\n图 25-5\n\
  \n一旦启用了所需的选项，点击 `Apply`（应用），然后点击 `OK` 按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将根据需要自动重新安装并重启应用。\n\
  \n### 25.5 应用更改教程\n\n启动 Android Studio，从欢迎界面选择 `New Project`（新建项目）选项，并在生成的新项目对话框中点击\
  \ Next（下一步）按钮之前，选择 `Basic Views Activity` 模板。\n\n在 Name（名称）字段中输入 `ApplyChanges`\
  \ 并指定 `com.ebookfrenzy.applychanges` 为包名。在点击 Finish（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language`（语言）菜单设置为 `Java`。\n\n##\
  \ 25.6 使用代码更改\n\n点击运行按钮并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用在设备或模拟器上出现的时间。\n\n运行后，点击操作按钮（屏幕右下角显示信封图标的按钮）。注意会出现\
  \ `Snackbar` 实例，显示文本为“Replace with your own action”，如图 25-6 所示：\n\n![](img/as_apply_changes_snackbar.jpg)\n\
  \n图 25-6\n\n一旦应用运行，“应用更改”按钮应该已经启用，这表明某些项目更改可以在不重新安装和重启应用的情况下应用。要查看此效果，编辑 `MainActivity.java`\
  \ 文件，找到 `onCreate` 方法，并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n\n    @Override\n    public void onClick(View view)\
  \ {\n        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \              .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击“应用代码更改”按钮，注意几秒钟后出现了应用已更新的消息。点击操作按钮，注意\
  \ Snackbar 显示了消息。\n\n## 25.7 应用更改并重启活动\n\n任何资源更改都要求使用“应用更改并重启活动”选项。在 Android Studio\
  \ 中，选择 app -> res -> layout -> fragment_first.xml 布局文件。在布局编辑器的设计模式下，选择默认的 `TextView`\
  \ 并在属性窗口中更改文本为“Hello Android”。\n\n在点击“应用代码更改”按钮之前，确保关闭了上述配置应用更改回退设置。注意请求失败，因为此更改涉及项目资源。点击“应用更改并重启活动”按钮，验证活动重启并在\
  \ `TextView` 上显示新文本。\n\n### 25.8 使用运行应用\n\n如前所述，删除方法需要重新安装并重启运行中的应用。为了体验这一点，编辑 `MainActivity.java`\
  \ 文件，在 `onCreate` 方法之后添加一个新方法：\n\n```\npublic void demoMethod() {\n\n}\n```\n\n\
  使用“应用代码更改”按钮并确认更改无需重新安装应用即可应用。\n\n接下来，删除新方法并验证点击任一“应用更改”按钮都会导致请求失败。在此更改后运行应用的唯一方法是点击“运行应用”按钮。\n\
  \n### 25.9 总结\n\n应用更改是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。应用更改功能可以在许多情况下无需重新安装或重启应用即可向应用推送更新。\n\
  \n## 26. Android 事件处理概述与示例\n\n在之前的章节中已经涵盖了大量关于 Android 用户界面设计的内容。然而，尚未涵盖的领域涉及用户与界面的交互如何触发底层活动执行任务。换句话说，从之前的章节中，我们知道如何创建一个包含按钮视图的用户界面，但不知道在用户触摸时应用会发生什么。\n\
  \n\n\n\n因此，本章的主要目标是概述 Android 中的事件处理，并提供一个基于 Android Studio 的示例项目。\n\n### 26.1 理解\
  \ Android 事件\n\nAndroid 事件可以有多种形式，但通常是响应外部操作而生成的。最常见的事件形式（特别是平板电脑和智能手机等设备）涉及与触摸屏的某种形式的交互。此类事件属于输入事件类别。\n\
  \nAndroid 框架维护了一个事件队列，事件在发生时会被放入队列中。然后，事件按照先进先出（FIFO）的从队列中移除。对于输入事件（例如屏幕上的触摸），事件将传递给位于触摸发生屏幕位置的视图（view）。除了事件通知外，视图还会接收到有关事件性质的一系列信息（取决于事件类型），例如用户指尖与屏幕之间接触点的坐标。\n\
  \n要处理已传递的事件，视图必须准备好一个事件监听器。所有用户界面组件都派生自 `View` 类，该类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），它必须注册\
  \ `View.OnClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法），并实现相应的 `onClick()`\
  \ 回调方法。如果在按钮视图所在的屏幕位置检测到“点击”事件，Android 框架将在该事件从事件队列中移除时调用该视图的 `onClick()` 方法。当然，任何在响应按钮点击时调用的任务或其他方法都应该在\
  \ `onClick()` 回调方法的实现中执行。\n\n## 26.2 使用 `android:onClick` 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户“点击”用户界面中的按钮视图时调用回调方法时，可以使用快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，要求是当用户触摸按钮时，调用 activity 类中声明的名为 `buttonClick()` 方法。实现此行为仅需编写\
  \ `buttonClick()` 方法（该方法接收触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行代码即可。例如：\n\n```xml\n\
  <Button\n      android:id=\"@+id/button1\"\n      android:layout_width=\"wrap_content\"\
  \n      android:layout_height=\"wrap_content\"\n      android:onClick=\"buttonClick\"\
  \n      android:text=\"Click me\" />\n```\n\n这提供了一种捕点击事件的简单方法。然而，它没有提供事件处理器所提供的范围选项，这是本章其余部分的主题。正如后续章节概述，`onClick`\
  \ 属性在涉及 fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当在设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n## 26.3 事件监听器和回调方法\n\n在本章后面概述的示例 activity 中，将详细介绍注册事件监听器和实现回调方法的步骤。在在此之前，值得花些时间概述\
  \ Android 框架中提供的事件监听器以及每个监听器关联的回调方法。\n\n- `onClickListener` – 用于检测点击式事件，用户触摸并释放由视图占据的设备显示区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n- `onLongClickListener` – 用于检测用户是否在视图上长时间保持触摸。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener` – 用于检测与触摸屏的接触，包括单个或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调，此主题将在 Android 触摸和多点事件处理章节中进行详细介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n- `onCreateContextMenuListener` – 监听由于长按产生的上下文菜单创建。对应 `onCreateContextMenu()`\
  \ 回调方法。回调接收菜单、接收事件的视图和一个菜单上下文对象。\n- `onFocusChangeListener` – 检测焦点是否因与轨迹球或导航键的交互而移出当前视图。对应\
  \ `onFocusChange()` 回调方法，该方法传递接收事件的视图和一个指示焦点获得或丢失的 `Boolean` 值。\n- `onKeyListener`\
  \ – 用于检测当视图拥有焦点时按了设备上的按键。对应 `onKey()` 回调方法。它将接收事件的视图、按下的物理键的 `KeyCode` 和一个 `KeyEvent`\
  \ 对象作为参数传递。\n\n### 26.4 事件处理示例\n\n在本章的剩余部分中，我们将创建一个 Android Studio 项目，用于演示事件监听器和回调方法的实现，以检测用户何时点击按钮。回调方法中的代码将更新文本视图以指示事件已处理。\n\
  \n在欢迎屏幕上选择 New Project，并在生成的项目对话框中选择 Empty Views Activity 模板，然后点击 Next。\n\n在 Name\
  \ 字段中输入 `EventExample` 并指定 `com.ebookzy.eventexample` 为包名。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 26: Android 8.0 (Oreo)，并将 Language 设置为 Java。按照 11.8 将项目迁移到 View\
  \ Binding 节概述的步骤，将项目转换为视图绑定。\n\n### 26.5 设计用户界面\n\n示例中 MainActivity 类的用户界面布局将由一个\
  \ `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图 26-1](#Event_Handling.xhtml__idTextAnchor637）所示。\n\
  \n![](img/as_event_example_ui.jpg)\n\n图 26-1\n\n定位并选择由 Android Studio 创建的 `activity_main.xml`\
  \ 文件（位于 Project 工具窗口的 app -> res -> layouts 下），并双击将其加载到布局编辑器。\n\n确保 Autoconnect\
  \ 已启用，然后从调色板拖入 `Button` 组件并移动它，使其位于布局的水平中心并在现有 `TextView` 组件的下方。当位置正确时，将组件释放到位置，以便自动连接系统添加相应的约束。\n\
  \n选择“Hello World!” `TextView` 组件并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的\
  \ ID 改为 `myButton`。\n\n通过点击布局工具栏中的 Infer Constraints 按钮添加任何缺失的约束。\n\n\n\n完成用户界面布局后，下一步是注册事件监听器和回调方法。\n\
  \n## 26.6 事件监听器和回调方法\n\n在本例中，需要为 `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的\
  \ `setOnClickListener()` 方法，传递一个新的 `onClickListener` 对象作为参数，并实现 `onClick()` 回调方法来实现。由于此任务只需要在\
  \ Activity 创建时执行，因此 `MainActivity` 类的 `onCreate()` 方法是一个很好的位置。\n\n如果编辑器会话中已经打开了\
  \ `MainActivity.java` 文件，请通过点击编辑器面板中的标签页选择它。或者，在 Project 工具窗口中导航到 `(app -> java\
  \ -> com.ebookfrenzy.eventexample -> MainActivity)` 找到它，并双击将其加载到代码编辑器中。加载后，找到模板\
  \ `onCreate()` 方法并修改它以获取按钮视图的引用、注册事件监听器并实现 `onClick()` 回调方法：\n\n```java\npackage\
  \ com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.view.View;\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n\n                }\n            }\n        );\n    }\n.\n.\n}\n```\n\n\
  上述代码已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为目前\
  \ `onClick()` 回调方法的体内部尚未实现任何代码。本例的目标是在点击按钮时在 `TextView` 上上显示一条消息，因此需要进行一些进一步的代码更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                binding.statusText.setText(\"Button clicked\");\n         \
  \   }\n        }\n    );\n}\n```\n\n在 AVD 模拟器或物理 Android 设备上编译并运行应用程序以完成此教程阶段。触摸并释放按钮视图（也称为“点击”）时，文本视图应该更改为显示“Button\
  \ clicked”文本。\n\n### 26.7 消费事件\n\n对视图上的标准点击（相对于长点击）的检测是事件处理的一个简单用例。现在示例将扩展以包含对长点击事件的检测，长点击发生在用户点击并按住屏幕上的视图时，并借此我们涵盖了事件消费的主题。\n\
  \n考虑本章上述部分中 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完毕后不会向 Android 框架返回任何值。\n\n另一方面，`onClickListener`\
  \ 需要返回一个 `Boolean` 值来指示事件是否被消费。如果回调返回 `true`，框架将丢弃该事件。相反，如果返回 `false`，Android 框架将认为事件仍然激活并将其传递给下一个监听器。与许多编程概念一样，这通过示例演示最为合适：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                binding.statusText.setText(\"Button clicked\");\n         \
  \   }\n        }\n    );\n}\n```\n*（等待，源代码提供的消费示例是一个碎片化的区块，我将重新格式化所提供的逻辑）：*\n\n\
  `MainActivity` 类的 `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n        new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \          binding.statusText.setText(\"Button clicked\");\n            }\n    \
  \    }\n    );\n}\n```\n\n实际上，查看源代码中用于消费的特定碎片区块，我将按照文中呈现的方式重构逻辑：\n\n`MainActivity`\
  \ 类的 `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                binding.statusText.setText(\"Button clicked\");\n         \
  \   }\n        }\n    );\n}\n```\n*注：源代码中包含消费示例包含一个非常混乱的区块，我将根据文本进行格式。*\n\n`MainActivity`\
  \ 类的 `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    binding.myButton.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                binding.statusText.setText(\"Button clicked\");\n         \
  \   }\n        }\n    );\n}\n```\n\n### 26.8 总结\n\n如果用户界面包含的视图对用户交互没有任何反应，那么该用户界面就没有什么实际用处。Android\
  \ 通过事件监听器和回调方法的概念桥接了用户界面与应用程序后端之间的鸿沟。View 类定义了一系列事件监听器，可以注册在视图对象上。每个事件监听器都关联了一个回调方法。\n\
  \n27. Android 触摸与多点事件处理\n\n\n\n大多数基于 Android 的设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸操作如何转换为运行中的\
  \ Android 应用程序中的动作。然而，触摸事件的处理远比对视图对象上的单指点击响应要复杂得多。例如，大多数 Android 设备可以同时检测到多个触摸点。此外，触摸也不局限于设备显示器上的一点。当用户在屏幕表面上滑动一个或多个接触点时，触摸操作可以是动态的。\n\
  \n应用程序还可以将触摸操作解释为手势。例如，水平滑动通常用于翻阅电子书的页码，或者捏拢/张开动作如何对屏幕上显示的图像进行放大或缩放。\n\n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主题将在下一章中介绍。\n\
  \n### 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，下面的代码确保了对名为\
  \ `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸操作都会调用 `onTouch()` 方法：\n\n```java\n\
  binding.myLayout.setOnTouchListener(\n    new ConstraintLayout.OnTouchListener()\
  \ {\n        public boolean onTouch(View v, MotionEvent m) {\n            // 在此处执行任务\n\
  \            return true;\n        }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调需要返回一个\
  \ `Boolean` 值，指示 Android 运行时系统是将事件传递给在同一视图上注册的其他事件监听器，还是将其丢弃。该方法传递了触发事件的视图引用以及一个\
  \ `MotionEvent` 类型的对象。\n\n### 27.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中的信息包括触摸在视图中的位置以及执行的动作类型。`MotionEvent` 对象也是处理多点的关键。\n\n### 27.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是识别用户执行的动作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法获取与事件相关的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含 `ACTION_DOWN`\
  \ 动作类型以及触摸坐标。当触摸从屏幕上抬起时，会生成一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸运动都将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针分别以类型为 `ACTION_POINTER_DOWN`\
  \ 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要识别触发事件的指针索引，必须调用 `MotionEvent` 对象的 `getActionIndex()`\
  \ 回调方法。\n\n### 27.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节开始在单点触摸事件的狭窄语境下探索事件处理。在实践中，大多数\
  \ Android 设备可以响应多个连续的触摸（但需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n如前所述，在多点触摸情况下，每个触摸点被 Android\
  \ 框架视为一个指针。每个指针又通过一个索引值进行引用并分配一个 ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取当前指针的数量。当前指针列表中特定索引处的指针 ID，可以通过调用 `MotionEvent` 的 `getPointerId()` 方法获取。例如，下面的代码片段获取了指针计数以及索引为\
  \ 0 的指针 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int\
  \ pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数始终大于或等于 1（因为必须至少发生一次触摸才会触发回调）。\n\
  \n视图上的触摸（特别是涉及跨越屏幕运动的触摸）会在接触屏幕的点抬起之前产生一系列事件。应用程序可能需要跟踪跨越事件的单个触摸。虽然特定触摸的 ID 从一个事件到下一个事件不会改变，但重要的是要记住索引值会改变。这应该通过\
  \ `MotionEvent` 对象的 `findPointerIndex()` 获取。\n\n## 27.5 多点触摸应用程序示例\n\n在本章剩余部分创建的示例应用程序将跟踪跨越布局移动的最多两个触摸手势。当每个触摸的事件被触发时，每个触摸的坐标、索引和\
  \ ID 将显示在屏幕上。\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，选择“Empty Views Activity”模板。在\
  \ Name（名称）字段中输入 `MotionEvent` 并指定 `com.ebookrenzy.motionevent` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 API 26：Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ Java。\n\n按照第 11.8 节“Migrating a Project to View Binding”（迁移项目到 View Binding）所述调整项目以使用\
  \ view binding。\n\n### 27.6 设计 Activity 用户界面\n\n应用程序唯一 Activity 的界面由一个包含两个 `TextView`\
  \ 对象的 `ConstraintLayout` 组成。在 Project 工具窗口中导航到 `app -> res -> layout` 并双击 `activity_main.xml`\
  \ 布局资源文件，将其加载到 Android Studio Layout Editor 中。\n\n选择并删除默认的“Hello World!” `TextView`\
  \ 组件，然后在开启自动连接（autoconnect）的情况下，拖放一个新的 `TextView` 组件，使其水平居中并置于布局顶部的 16dp 边距线上。\n\
  \n拖入第二个 `TextView` 组件，并对其进行定位和约束，使其与第一个组件底部之间保持 32dp 的间距。\n\n使用 Attributes 工具窗口将\
  \ TextView 组件的 ID 分别更改为 `textView1` 和 `textView2`。将组件上显示的文本更改为“Touch One Status”和“Touch\
  \ Two Status”，并使用 Layout Editor 右角的警告按钮将字符串提取到资源文件中。\n\n### 27.7 实现触摸事件监听器\n\n\n\
  \n\n要接收触摸事件通知，有必要在 `MainActivity` 类的 `onCreate()` 方法中对布局视图注册一个触摸监听器。从 Android Studio\
  \ 编辑器面板中选择 `MainActivity.java` 标签以显示源代码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，代码将调用名为\
  \ `handleTouch()` 的第二个方法，并向传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n当我们设计用户界面时，父布局 `ConstraintLayout` 没有分配一个允许我们通过视图绑定（view\
  \ binding）机制访问它的 ID。由于该布局组件是 UI 布局层次结构中的顶层组件，我们能够使用上述代码中的根绑定属性（root binding property）引用它。\n\
  \n在测试应用程序之前，最后一个任务是实现由监听器调用的 `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++)\n    {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n\
  \        int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \       switch (action)\n        {\n            case MotionEvent.ACTION_DOWN:\n\
  \                actionString = \"DOWN\";\n                break;\n            case\
  \ MotionEvent.ACTION_UP:\n                actionString = \"UP\";\n             \
  \   break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n                actionString\
  \ = \"PNTR DOWN\";\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n\
  \                actionString = \"PNTR UP\";\n                break;\n         \
  \   case MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n  \
  \              break;\n            default:\n                actionString = \"\"\
  ;\n        }\n        String touchStatus = \"Action: \" + actionString + \" Index:\
  \ \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以强调所执行的任务。代码首先获取用户界面中两个\
  \ `TextView` 对象的引用，并识别视图上当前有多少个活跃的指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，`pointerCount` 变量启动了一个 `for` 循环，为每个活跃的指针执行任务。循环的前几行获取触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount; i++)\n\
  {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n\
  \    int action = m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n\
  \    String actionString;\n}\n```\n\n由于动作类型等于整数值，因此使用 `switch` 语句将动作类型转换为更具意义的字符串值，并将其存储在之前声明的\
  \ `actionString` 变量中：\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 ID 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\n\
  else\n    binding.textView2.setText(touchStatus);\n```\n\n### 27.8 运行示例\n\n编译并运行应用程序，一旦启动，在屏幕上进行单次和多次触摸实验，如图\
  \ 27-3 所示（注意，如果模拟器在工具窗口中运行，可能无法模拟多次触摸）：\n\n![](img/as_motion_event_running.jpg)\n\
  \n图 27-3\n\n### 27.9 总结\n\nActivity 通过注册监听器并实现 `onTouch()` 回调方法来接收触摸事件，该方法随后传递 `MotionEvent`\
  \ 对象，包含了触摸的信息，例如事件类型、坐标和触摸计数。\n\n本章通过创建一个示例 Android 应用程序，实现了显示最多两个同时触摸的坐标和动作类型。\n\
  \n### 28. 使用 GestureDetector 类检测常见手势\n\n“手势”一词定义了触摸屏与用户之间连续的交互。手势从屏幕首次被触摸的点开始，到最后一个手指或指向设备离开显示表面结束。\n\
  \nAndroid SDK 提供了检测常见和自定义手势的机制。常见手势涉及点击、双击、长按以及在水平或垂直方向上的滑动动作（在 Android 术语中称为 fling）。\n\
  \n\n\n\n\n本章探讨了如何使用 Android `GestureDetector` 类来检测在 Android 设备屏幕上进行的常用手势。下一章“在 Android\
  \ 上实现自定义手势和双指缩放识别”将涵盖更复杂的自定义手势，例如圆形运动和双指捏。\n\n### 28.1 实现常用手势检测\n\n当用户与 Android\
  \ 设备的屏幕进行交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传递包含用户触摸屏幕数据的 `MotionEvent` 对象。可以通过对这些数据进行解释，来识别屏幕上的动作是否匹配点击或滑动等常用手势。通过使用\
  \ Android `GestureDetectorCompat` 类，可以以极少的编程工作实现这一点。该类设计用于从应用程序接收运动事件信息，并根据检测到的（如果存在）常用手势的类型来触发方法调用。\n\
  \n检测常用手势的基本步骤如下：\n\n1. 声明实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是一个嵌套的 activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递给它。\n\
  3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以便在需要启用双击检测。\n\
  4. 在嵌套的 activity 中实现 `onTouchEvent()` 回调方法，该方法必须调用 `GestureDetectorCompat` 实例的 `onTouchEvent()`\
  \ 方法，并将当前的运动事件对象作为参数传递给该方法。\n\n一旦实现，应用程序代码中的一组方法，当检测到特定类型的手势时，这些方法将被调用。随后可以实现这些方法中的代码来执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分中，我们将创建一个示例项目，旨在将上述步骤付实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目旨在检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常用手势，并向用户显示状态信息以指示检测到的手势类型。\n\n从欢迎屏幕选择“New Project”选项，在出现的新项目对话框中，在点击“Next”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为\
  \ `Java`。\n\n按照第 11.8 将项目迁移到 View Binding 节所述的方法调整项目以使用 view binding。\n\n一旦创建了新项目，在\
  \ Project 工具窗口中导航到 `app` -> `res` -> `layout` -> `activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” TextView 组件，并在 Attributes\
  \ 工具窗口中输入 `gestureStatusText` 作为 ID。最后，将 `textSize` 设置为 `20sp` 并启用粗体文本 `textStyle`：\n\
  \n![](img/as_common_gestures_text_style.jpg)\n\n图 28-1\n\n## 28.3 实现监听器类\n\n如之前所述，必须创建一个实现\
  \ `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然可以是一个全新的类，但在当前 activity 类中实现它也是完全有效的。因此，我们将修改 `MainActivity` 类以便此示例实现这些监听器接口。编辑\
  \ `MainActivity.java` 文件使其如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \nimport android.view.GestureDetector;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener\n{\n.\n.\n}\n```\n\n声明该类实现了监听器接口要求在类中也实现相应的方法：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport android.view.MotionEvent;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n.\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \  float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                           float distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"\
  onScroll\");\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n       \
  \ binding.gestureStatusText.setText(\"onSingleTapUp\");\n        return true;\n\
  \    }\n\n    @Override\n    public void onDoubleTap(MotionEvent event) {\n    \
  \    binding.gestureStatusText.setText(\"onDoubleTap\");\n    }\n\n    @Override\n\
  \    public boolean onSingleTapConfirmed(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onSingleTapConfirmed\");\n        return true;\n    }\n\n.\n.\n}\n```\n\n注意许多这些方法返回了\
  \ `true`。这告诉 Android 框架该方法已处理事件，不需要传递给栈中的下一个事件处理器。\n\n### 28.4 创建 GestureDetectorCompat\
  \ 实例\n\n现在 activity 已更新实现了监听器接口，下一步是创建 `GestureDetectorCompat` 类的实例。由于只需要在创建 activity\
  \ 时执行一次，代码的最佳位置是 `onCreate()` 方法中。由于我们想要检测双击，代码还需要调用 `GestureDetectorCompat` 实例的\
  \ `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ GestureDetectorCompat gDetector;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        View view = binding.getRoot();\n\
  \        setContentView(view);\n        this.gDetector = new GestureDetectorCompat(this,this);\n\
  \        gDetector.setOnDoubleTapListener(this);\n    }\n\n.\n.\n}\n```\n\n## 28.5\
  \ 实现 onTouchEvent() 方法\n\n\n\n\n\n如果此时编译并运行应用程序，在设备屏幕上进行手势操作将不会产生反应。这是因为还没有添加任何代码来拦截触摸事件并传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，需要在 activity 类中重写 `onTouchEvent()` 方法，并对其进行实现，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，其代码如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 务必调用父类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意文本视图会更新以反映事件，如图 28-2\
  \ 所示：\n\n![](img/as_common_gestures_running.jpg)\n\n图 28-2\n\n### 28.7 总结\n\n用户与设备触摸屏之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然一个手势可以包含几乎任何动作序列，但有一组被触摸设备用户已经熟悉的常用手势集。这些所谓的“常用手势”中的某些可以通过使用\
  \ Android Gesture Detector 检测器类在应用程序中轻松检测到。在本章中，我们从理论和示例项目实现两个方面概述了该技术的使用。\n\n在本章涵盖常用手势之后，下一章将介绍如何检测更广泛的手势类型，包括设计和检测你自定义手势的能力。\n\
  \n## 29. 在 Android 上实现自定义手势和双指缩放识别\n\n上一节介绍了如何在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势理论上可能涉及\
  \ Android 设备屏幕上几乎任何序列的触摸动作。针对此，Android SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\
  \n### 29.1 Android Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，并存储在与 Android\
  \ 应用程序包一起的手势文件中。这些自定义手势文件最容易使用 Gesture Builder 应用程序创建。创建手势文件涉及在物理设备或模拟器上启动 Gesture\
  \ Builder 应用程序，并在灰色画布上“绘制”应用程序需要检测的手势。一旦设计好，就可以下载包含手势数据的文件并添加到应用程序项目中。在应用程序代码中，该文件被加载到\
  \ `GestureLibrary` 类的实例中，该实例可用于搜索用户在设备屏幕上执行的任何手势的匹配项。\n\n### 29.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView` 类。这个透明视图可以放置在用户界面的其他视图之上以检测手势。\n\
  \n### 29.3 检测手势\n\n手势的检测是通过加载使用 Gesture Builder 应用创建的手势文件，然后在 `GestureOverlayView`\
  \ 类的实例上注册 `GesturePerformedListener` 事件监听器来实现的。然后声明包装类实现 `OnGesturePerformedListener`\
  \ 接口以及该接口所需的相应 `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发 `onGesturePerformed`\
  \ 回调方法。\n\n### 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并将检测到手势的 `GestureOverlayView`\
  \ 对象的引用以及一个包含手势信息的 `Gesture` 对象作为参数。\n\n通过访问 `Gesture` 对象，`GestureLibrary`可以将检测到的手势与之前加载到应用程序的手势文件中包含的内容进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测分数，报告用户执行的手势与手势文件条目匹配的概率。1.0 或更高的预测分数通常被接受为文件中存储的手势与用户在设备屏幕上执行的手势之间的良好匹配。\n\
  \n### 29.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用 Gesture Builder 应用，它允许捕并保存手势动作。虽然\
  \ Google 原本提供了一个用于此目的的应用程序，但它对较新的 Android 版本没有进行充分维护。幸运的是，有一种名为 Gesture Builder\
  \ Tool 的替代方案，可以通过以下 URL 从 Play Store 获取：https://play.google.com/apps/details?id=migueldp.runeforge\n\
  \n### 29.6 创建手势文件\n\n一旦 Gesture Builder Tool 加载，点击设备屏幕底部的 New Gesture 按钮，并在灰色画布上使用圆周运动“绘制”手势，如图\
  \ 29-1 所示。假设手势显示正确（由设备屏幕上的黄色线条表示），点击保存按钮将手势添加到手势文件中，在提示名称时输入“Circle Gesture”。\n\n\
  ![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，Gesture Builder Tool 将显示当前定义的手势列表，其中仅包含新的\
  \ Circle Gesture。\n\n### 29.7 创建示例项目\n\n从欢迎界面选择 New Project 选项，并在出的新项目对话框中选择 Empty\
  \ Views Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 CustomGestures，指定 `com.ebookzy.customgestures`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单更改为 Java。按照第 11.8 迁移项目到 View Binding 节所述调整项目使用视图绑定。\n\n### 29.8 从 SD 卡提取手势文件\n\
  \n由于每个手势都在 Gesture Builder 应用程序中创建，它们会被添加到名为 `gesture.txt` 的文件中，位于运行应用程序的模拟器或设备的存储中。然而，在此文件添加到\
  \ Android Studio 项目之前，必须将其从设备存储中导出并保存到本地文件系统。这可以通过 Android Studio Device File Explorer\
  \ 工具窗口轻松实现。使用 View -> Tool Windows -> Device File Explorer 菜单显示此工具。显示后，从下拉菜单选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在该文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 Save As… 选项，将其保存到临时位置并命名为 `gestures`。\n\n![](img/as_device_explorer.jpg)\n\
  \n图 29-2\n\n\n\n\n一旦创建并从设备存储中拉取出手势文件，就可以将其作为资源文件添加到 Android Studio 项目中\n\n## 29.9\
  \ 将手势文件添加到项目\n\n在 Android Studio Project（项目）工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），并在弹出的菜单中选择\
  \ `New -> Directory`。在 `New Directory`（新建目录）对话框中，输入 `raw` 作为文件夹名称并按下键盘回车键。使用适用于你操作系统的相应文件资源管理器工具，找到之前从设备存储中拉出的手势文件，将其复制并粘贴到项目工具窗口中新的\
  \ `raw` 文件夹中。\n\n### 29.10 设计用户界面\n\n此示例应用需要一个由 `ConstraintLayout` 视图组成的用户界面，在其上方叠加一个\
  \ `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它将其加载到 Layout Editor（布局编辑器）工具中，选择并删除默认的 `TextView` 控件。\n\n切换布局编辑器的 Code 模式并修改\
  \ XML，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n### 29.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码在活动启动时加载该文件。对于此项目，实现此目的代码将如下添加到\
  \ `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\nimport\
  \ android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\nimport\
  \ android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ = GestureLibraries.fromRawResource(this, R.raw.gestures);\n        if (!gLibrary.load())\
  \ {\n            finish();\n        }\n    }\n}\n```\n\n除了必要的导入指令外，上述代码还创建了一个名为\
  \ `gLibrary` 的 `GestureLibrary` 实例，然后将 raw 资源文件夹中的手势文件内容加载到其中。活动类也经过了修改实现了 `OnGesturePerformedListener`\
  \ 接口，这需要添加 `onGesturePerformed` 回调方法（将在本章稍后创建）。\n\n## 29.12 注册事件监听器\n\n为了让活动接收到用户在屏幕上执行手势的通知，需要在\
  \ `gLayout` 视图上注册 `OnGesturePerformed` 事件监听器，如下代码所示，可以使用 `findViewById` 方法获取其引用：\n\
  \n```java\nprivate void gestureSetup() {\n    gLibrary = GestureLibraries.fromRawResource(this,\
  \ R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView\
  \ gOverlay = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformed(this);\n\
  }\n```\n\n## 29.13 实现 onGesturePerformed 方法\n\n在首次运行应用程序之前，最后剩下的工作就是实现 `onGesturePerformed`\
  \ 回调。当在 `GestureOverlayView` 实例上执行手势时，将调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \nimport android.gesture.Prediction;\nimport android.widget.Toast;\nimport android.gesture.Gesture;\n\
  import java.util.ArrayList;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements OnGesturePerformedListener {\n    private GestureLibrary gLibrary;\n\
  \n    public void onGesturePerformed(GestureOverlayView overlay, Gesture gesture)\
  \ {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n}\n```\n\n当 Android 运行时在手势叠加对象上检测到手势时，就会调用\
  \ `onGesturePerformed` 方法。传递的参数是检测到手势的 `GestureOverlayView` 对象的引用以及一个 `Gesture`\
  \ 类型的对象。`Gesture` 类用于持有定义手势的信息（本质上是屏幕上的时间点序列）。\n\n`Gesture` 对象被传递给 `gLibrary` 实例的\
  \ `recognize()` 方法，以便将当前手势与从手势文件中加载的内容进行比较。一旦任务完成，`recognize()` 方法返回一个包含每次比较结果的\
  \ `Prediction` 对象的 `ArrayList` 对象。列表按照最佳匹配（数组位置 0）到最差匹配进行排序。每个 `prediction` 对象内部包含了手势文件中对应的名称以及一个指示其与当前手势匹配程度的预测得分。\n\
  \n因此，上述方法获取位置 0 的预测，确保其得分大于 1.0，然后显示 `Toast` 消息（一种用于向用户显示弹出内容的 Android 类），显示匹配的手势名称。\n\
  \n## 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，然后在屏幕上执行圆形手势。执行时，应该出现包含检测对手势名称的\
  \ toast 通知。注意，当手势被识别时，会用亮黄色线条勾勒，而不确定的手势显示为淡黄色线条。这在开发期间很有用，但对于实际应用程序可能并不理想。因此，还有一些配置工作需要完成。\n\
  \n### 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，如下修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n\n\n重新运行应用程序后，手势现在应该是不可可见的（因为它们在 `ConstraintLayout` 视图的白色背景上被绘制为白色）。\n\
  \n### 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明覆盖层，可以放置在其他视图之上。这引出了问题：当识别出手势时，手势覆盖层拦截的事件是否应该传递给底层的视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性来控制。当设置为 `true`\
  \ 时，识别出手势时，手势事件不会传递给底层视图。当在一个配置为响应某些手势滚动的视图上执行手势时，此设置特别有用。将此属性设置为 `true` 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n### 29.17 检测缩放手势\n\n在讨论一般的触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节概述的步骤来创建和检测各种手势，但实际上，使用目前为止讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和收缩动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势最简单的方法是使用 `ScaleGestureDetector` 类。简单来说，检测缩放手势涉及以下三个步骤：\n\n1. 一个实现 `SimpleOnScaleGestureListener`\
  \ 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector`\
  \ 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在外层 Activity 中实现 `onTouchEvent()` 回调方法，该方法反调用 `ScaleGestureDetector`\
  \ 类的 `onTouchEvent()` 方法。\n\n在本章的剩余部分中，我们将创建一个示例，旨在演示缩放手势识别的实现。\n\n## 29.18 缩放手势示例项目\n\
  \n从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Views Activity”（空视图\
  \ Activity）模板。\n\n在“Name”（名称）字段中输入 `PinchExample`，并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将最低 API 设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。按照\
  \ 11.8 Migrating a Project to View Binding 中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml`\
  \ 文件中，选择默认的 `TextView` 对象，并使用属性工具窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java`\
  \ 文件到 Android Studio 编辑器中，并按如下修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\
  \n.\n\n.\n\nimport android.view.MotionEvent;\n\nimport android.view.ScaleGestureDetector;\n\
  \nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ =\n            new ScaleGestureDetector(this,\n                new MyOnScaleGestureListener());\n\
  \    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent event) {\n\
  \        scaleGestureDetector.onTouchEvent(event);\n        return true;\n    }\n\
  \n    public class MyOnScaleGestureListener extends\n            SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n### 29.19 总结\n\n手势是触摸屏幕上接触点的运动，涉及一个或多个笔画，可以作为用户与应用程序之间的通信方法。Android\
  \ 允许使用 Gesture Builder 应用程序设计手势。一旦创建，手势就可以保存到手势文件并在运行时使用 `GestureLibrary` 加载到 Activity\
  \ 中。\n\n通过用 `GestureOverlayView` 类的实例覆盖现有视图并实现 `OnGestureListener` 事件监听器，可以在显示区域上检测手势。使用\
  \ `GestureLibrary`，可以生成用户执行的手势与存储在手势文件中的手势之间的排序列表，使用预测分数来决定手势是否足够匹配。\n\n通过实现 `ScaleGestureDetector`\
  \ 类可以检测缩放手势，本章也提供了该类的示例。\n\n## 30. Android Fragments 简介\n\n随着你对本书章节的深入学习，你会明显发现\
  \ Android 系统背后的许多设计概念是为了促进构成应用程序的不同元素之间的复用和交互。本章将探索的一个此类领域涉及使用 Fragment（片段）。\n\n\
  本章将提供 Fragment 基本知识概述，介绍它们是什么以及如何在应用程序中创建和使用。下一章将通过教程演示如何在 Android Studio 中开发应用程序时使用\
  \ Fragment，包括实现 Fragment 之间的通信。\n\n### 30.1 什么是 Fragment?\n\n\n\n\n\nFragment（碎片）是应用程序用户界面中一个自包含的模块化部分及其相应的行为，可以嵌入到\
  \ Activity（活动）中。在应用程序设计阶段，可以组合 Fragment 来创建一个 Activity，并在应用程序运行期间向 Activity 中添加或移除\
  \ Fragment，从而创建动态变化的用户界面。\n\nFragment 只能作为 Activity 的一部分使用，不能作为独立的应用程序元素进行实例化。然而，Fragment\
  \ 可以被视为一个功能性的“子 Activity”，其生命周期与完整的 Activity 相似。\n\nFragment 以 XML 布局文件的形式存储。可以通过在\
  \ Activity 的布局文件中放置适当的 `<fragment>` 元素，或者通过 Activity 类实现中的代码，将其添加到 Activity 中。\n\
  \n### 30.2 创建 Fragment\n\n构成 Fragment 的两个组件都是一个 XML 布局文件和一个对应的 Java 类。Fragment 的\
  \ XML 布局文件采用的与任何其他 Activity 布局相同的格式，并且可以包含任何组合和复杂程度的布局和视图。例如，下面的 XML 布局用于一个由红色背景的\
  \ `ConstraintLayout` 组成的 Fragment，其中包含一个白色前景颜色的单个 `TextView`：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 Fragment 布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n    \
  \                        ViewGroup container,\n                            Bundle\
  \ savedInstanceState) {\n        // 胀此 fragment 的布局\n        binding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()`\
  \ 方法外，该类还可以重写标准的生命周期方法。一旦创建了 Fragment 布局和类，Fragment 就可以在应用程序 Activity 中使用。\n\n##\
  \ 30.3 使用布局 XML 文件向 Activity 添加 Fragment\n\n可以通过编写 Java 代码或将 Fragment 嵌入 Activity\
  \ 的 XML 布局文件将其整合到 Activity 中。无论使用哪种方法，需要注意的关键点是：当使用支持库以兼容旧版本的 Android 发布时，任何使用 Fragment\
  \ 的 Activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\n\
  package com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.view.Menu;\n\npublic class MainActivity extends FragmentActivity\
  \ {\n}\n}\n```\n\nFragment 使用 `FragmentContainerView` 类嵌入到 Activity 布局文件中。接接的示例布局嵌入了上一节中创建的\
  \ Fragment：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/fragment2\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        android:name=\"com.example.myfragmentdemo.FragmentOne\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n`<fragment>`\
  \ 元素中的关键属性是 `android:name`（必须引用与 Fragment 关联的类）和 `tools:layout`（必须引用包含 Fragment\
  \ 布局的 XML 文件）。一旦添加到 Activity 布局，可以在 Android Studio 编辑器中查看并操作 Fragment。\n\n## 30.4\
  \ 在代码中添加和管理 Fragment\n\n通过 Activity 布局文件添加 Fragment 的便利性是以 Activity 无法在运行时移除 Fragment\
  \ 为代价的。为了在运行期间对 Fragment 进行完全的动态控制，必须通过代码添加这些 Activity。这样做的优点是，可以在应用程序运行时动态地添加、移除甚至相互替换\
  \ Fragment。\n\n使用代码管理 Fragment 时，Fragment 仍然由一个 XML 布局文件和一个对应的类组成。区别在于宿主 Activity\
  \ 如何操作 Fragment。使用代码添加 Fragment 有一套标准的步骤序列：\n\n1. 创建 Fragment 类的实例。\n2. 通过类实例传递任何额外的参数（arguments）。\n\
  3. 获取 `FragmentManager` 实例的引用。\n4. 在 Fragment 实例上调用 `beginTransaction()` 方法。这将返回一个\
  \ `FragmentTransaction` 实例。\n5. 调用 Fragment 事务实例的 `add()` 方法，将要包含 Fragment 的视图资源\
  \ ID 和 Fragment 类实例作为参数传入。\n6. 调用 Fragment 事务实例的 `commit()` 方法。\n\n例如，下面的代码将由 `FragmentOne`\
  \ 类定义的 Fragment 添加到 ID 为 `LinearLayout1` 的容器中：\n\n```java\nFragmentOne firstFragment\
  \ = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\nFragmentManager\
  \ fragManager = getSupportFragmentManager();\nFragmentTransaction transaction =\
  \ fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1, firstFragment);\n\
  transaction.commit();\n```\n\n上面的代码将每个步骤拆分为独立的语句以便于理解。然而，最后四行可以缩写为单行代码，如下：\n\n```java\n\
  getSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1, firstFragment).commit();\n\
  ```\n\n\n\n\n一旦将 fragment 添加到容器中，随后可以通过调用 fragment 事务实例的 `remove()` 方法将其移除，该方法需要传递一个要移除的\
  \ fragment 实例引用：\n\n```\ntransaction.remove(firstFragment);\n```\n\n同样，可以通过调用 fragment\
  \ 事务实例的 `replace()` 方法用一个 fragment 替换另一个。该方法的参数是包含该 fragment 的视图 ID 以及新 fragment\
  \ 的实例。被替换的 fragment 也可以被放入所谓的“回退栈”（back stack）中，这样当用户导航回它时就可以快速恢复。这通过在调用 `commit()`\
  \ 方法之前，先调用 fragment 事务对象的 `addToBackStack()` 方法来实现：\n\n```\nFragmentTwo secondFragment\
  \ = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n# 30.5 处理 Fragment\
  \ 事件\n\n正如之前讨论过的，fragment 就像一个子活动，拥有它自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本视图）可以普通活动一样产生事件。这引发了一个问题：是哪个类来接收来自\
  \ fragment 中视图的事件，是 fragment 本身，还是嵌入该 fragment 的活动？问题的答案取决于事件处理程序是如何声明的。\n\n在标题为\
  \ Android 事件处理概述与示例的章节中，讨论了两种处理事件的方法。第一种方法在活动代码中配置事件监听器和回调方法。例如：\n\n```\nbinding.button.setOnClickListener(\n\
  \    new Button.OnClickListener() {\n        public void onClick(View v) {\n   \
  \         // 当按钮被点击时\n            // 要执行的代码\n        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nfragment\
  \ 中视图生成的事件，其通用规则是：如果在 fragment 类中使用事件监听器和回调方法的方法声明了事件监听器，则事件将首先由 fragment 处理。然而，如果使用了\
  \ `android:onClick` 资源，事件将直接传递给包含该 fragment 的活动。\n\n# 30.6 实现 Fragment 通信\n\n一旦一个或多个\
  \ fragment 被嵌入活动中，很可能需要在 fragment 与活动之间、以及 fragment 之间进行某种形式的通信。良好的实践要求 fragment\
  \ 之间不要直接通信。所有通信都应该通过封装活动进行。\n\n要与 fragment 通信，活动必须通过分配给它的 ID 来标识 fragment 对象。一旦获取了引用，活动就可以调用\
  \ fragment 对象的公共方法。\n\n反向通信（从 fragment 到活动）稍微复杂一些。首先，fragment 必须定义一个监听接口，然后在活动类中实现该接口。例如，以下代码在一个名为\
  \ `ToolbarFragment` 的 fragment 上声明了一个 `ToolbarListener` 接口。代码还声明了一个变量，稍后将存储对活动的引用：\n\
  \n```java\npublic class ToolbarFragment extends Fragment {\n    ToolbarListener\
  \ activityCallback;\n    public interface ToolbarListener {\n        public void\
  \ onButtonClick(int position, String text);\n    }\n}\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener`\
  \ 接口的类都必须实现一个名为 `onButtonClick` 的回调方法，该方法接受一个整数和一个 `String` 作为参数。\n\n接下去，需要重写并实现\
  \ fragment 类的 `onAttach()` 方法。当 fragment 初始化并与活动关联时，Android 系统会自动调用此方法。该方法被传递一个包含该\
  \ fragment 的活动引用。该方法必须存储对该活动的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n@Override\n\
  public void onAttach(Context context) {\n    super.onAttach(context);\n    try {\n\
  \        activityCallback = (ToolbarListener) activity;\n    } catch (ClassCastException\
  \ e) {\n        throw new ClassCastException(activity.toString() + \" must implement\
  \ ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，活动将存储在 `activityCallback` 中，如果该活动没有实现该接口，则会抛出异常。下一步是从\
  \ fragment 内部调用回调方法。这何时以及如何发生，完全取决于 fragment 需要联系活动的具体情况。例如，以下代码在按钮被点击时调用活动上的回调方法：\n\
  \n```java\nvoid buttonClicked(View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作就是修改活动类以实现该接口。例如：\n\n```java\npublic class MainActivity\
  \ extends FragmentActivity implements ToolbarFragment.ToolbarListener {\n    public\
  \ void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n    }\n}\n\
  ```\n\n从上述代码中可以看出，活动声明了它实现了该接口，然后开始实现 `onButtonClick()` 方法。\n\n### 30.7 总结\n\nFragment\
  \ 提供了一种创建可重用用户界面布局和应用程序行为模块的机制，这些模块一旦创建，就可以嵌入活动中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过向活动布局文件添加\
  \ fragment 或编写管理 fragment 的代码来在活动中使用 fragment。\n\n\n\n\n这两个片段将被嵌入应用程序的主活动（Activity）中，并实现如下通信机制：当点击第一个片段中的按钮时，输入到\
  \ `EditText` 视图中的文本将出现在第二个片段的 `TextView` 上，其字体大小将由第一个片段中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在较早的\
  \ Android 版本上，我们需要使用相应的 Android 支持库。\n\n## 31.2 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `FragmentExample`，并指定\
  \ `com.ebookfrenzy.fragmentexample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照 11.8 Migrating\
  \ a Project to View Binding 中列出的步骤修改项目以使用视图绑定（view binding）。\n\n返回 `Gradle Scripts`\
  \ -> `build.gradle.kts (Module :app)` 文件，并在 `dependencies` 部分添加以下指令（请注意，现在可能有更新版本的库可用）：\n\
