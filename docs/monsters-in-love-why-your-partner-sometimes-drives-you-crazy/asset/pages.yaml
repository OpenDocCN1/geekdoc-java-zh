- img_proc: true
  md: 'on, they focus their efforts at acquiring money, security, sex, or love, or
    status, or appreciation. They may use a complex and sophisticated set of strategies,
    but are really just reaching for a nipple.


    In some ways this is entirely understandable. The desire to have someone take
    care of us, and meet our every need, is baked into our DNA as we grow in the womb.


    But if we''re going to be more than babies living in adult bodies, we need to
    do more with our lives than look for nipples to suck on.


    Many physically adult people approach romance as a way to offer their nipple in
    someone else''s. One variation is trophy wives or husbands, who provide the nipples
    of youth and attractiveness in exchange for the nipples of wealth and security.
    It''s a business deal—a socially acceptable transactional exchange in which both
    partners simultaneously exploit each other.


    Other folks see romance as a bargain made in a Middle Eastern bazaar: they try
    to get as much out of the other person as they can, while providing their partner
    with a little nipple as possible. We see this in men who get women pregnant and
    then disappear, and in gold diggers who marry wealthy folks and then treat them
    badly or divorce them.


    These are all people who failed to grow up.


    Sadly, much of our culture reinforces a view of romance as two infants suckling
    each other.


    The most common theme in music—from opera to blues to Top 40—is Make me by doing
    and being what I want. In most of these songs, what do lovers call each other?
    *Baby.*¹⁴


    But we''re not babies. We''re adults. We diminish ourselves and our partners by
    acting like infants.


    Plus, acting like an infant just isn''t sexy.


    Part of the blame for this falls squarely on the shoulders of therapists. In therapy
    sessions, many therapists talk to their clients “getting your needs met.” But
    in a romantic relationship, it is not the job of either partner to meet the other’s
    needs. That''s the job of a parent with a baby.


    If you view your partner as a one-stop shop for getting your needs, eventually
    they''re going to resent it. They’ll close down on you and say, “I’m not your
    servant or your dildo or your sex doll. It’s not my job to give you whatever you
    want whenever you want it.”'
