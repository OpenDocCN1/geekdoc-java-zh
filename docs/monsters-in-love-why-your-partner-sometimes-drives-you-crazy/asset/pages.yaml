  md: 'Monitor and limit your drug use. Use prescription drugs mindfully. Take as
    much as has been prescribed, but no more. With over-the-counter medications, take
    as little as possible to obtain the desired effect. Taking too much of any drug—even
    Tylenol—can sometimes be harmful, or even deadly. The fourth leading cause of
    death in the United States is the improper use of medications.


    Be especially aware of drug interactions—what can happen when you take two or
    more different drugs at once (including over-the-counter drugs), check with your
    doctor or pharmacist to make sure the combination is okay.


    In general, avoid marijuana, cocaine, hallucinogens (such as LSD), and other recreational
    drugs. These can seriously impair your judgment. Most recreational drugs, especially
    heroin and meth, can cause harm—and can be addictive.


    Notice if you begin to fall into a negative feedback loop. For example, suppose
    you stay up worrying about your partner. Because you go to sleep late your brain
    doesn''t shut down, but keeps running through the same thoughts and memories.
    That keeps you awake, and the next day you''re dragged out and exhausted. If you
