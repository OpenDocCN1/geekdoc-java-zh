- img_proc: true
  md: 'What each of us needs to do is grow. We need to learn to become responsible
    for soothing the aches and pains of our own heart, rather than ask—or expect or
    demand—that our partner soothe them for us.


    If you don''t learn this, your emotional stalemate with your partner can continue
    for years, or even decades. You have been doing this dance for so long that it
    seems familiar and comforting, even though you know something has to change. Yet
    you also know that a split-the-difference compromise or find-a-middle-ground solution
    is impossible.


    The process can lead the two of you to eventually reach critical mass—the place
    where the pressure and stresses are so great that something has to give. Someone
    decides that they can''t go on the same way. Some springloaded energy that has
    been building up—perhaps for a very long time—is released. Often that energy has
    the power to metabolize the clean pain and transform the relationship.


    And something important changes. In a moment of peril and possibility, one of
    you makes a leap toward greater balance and integrity. Moments such you test your
    resolve—and your limitations.


    It would be great if the two of you could make the leap together. But this almost
    never happens. Usually one person makes the leap alone, while their partner shouts
    at them, "You''re an idiot! I''m not leaping into the water with you! If you leap,
    you''re leaping alone, asshole."


    After the person makes this leap, their partner almost always demands that they
    leap back and return to the status quo pattern—but they don''t. Their spine straightens,
    their eyes brighten, and they hold their ground. They don''t run away, but stand
    firm inside the relationship. They communicate to their partner, "I love you with
    my whole heart, and I''m not going back to the things they were." This knowing
    and clarity, and the accompanying physical changes, is often called a brightening
    of self.


    Now something else has to give. The other person has to either develop new emotional
    skills or shrink away.


    Sometimes the other partner leaps. If they do, there is the possibility to create
    a stronger partnership and greater trust, intimacy, and respect.


    Sometimes the other partner doesn''t leap and leaves the relationship, only to
    come up against the same problems and limitations with their next partner, or
    someone else who gets close to them.'
