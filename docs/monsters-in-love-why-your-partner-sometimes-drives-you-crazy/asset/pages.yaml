    # The Heart of Emotional Stalemates


    If you''re like most couples, you and your lover don''t have a communication problem.
    You know perfectly what your partner wants and doesn''t want, what they care about
    and don''t care about, what pisses them off, and what makes them happy. They know
    the same things about you.


    Yes, you have issues and differences. Addressing these can reduce your day-to-day
    conflicts and smooth out your lives. But that won’t necessarily keep you from
    becoming monsters to each other.


    That''s because, in marriage, we monsters naturally create one interlocking conundrum
    after another. These repeated crises—these life reps, as I call them—are built
    into intimate relationships. Each crisis challenges both monsters to stand in
    their own integrity, to grow, and, often, to burn up their asses. Each life rep
    forces the two monsters up against each other, grinding them together, pressuring
    and squeezing and pulverizing them, until they completely block each''s moves.
    What this creates is often called an emotional stalemate or emotional bottleneck,
    and it hurts like hell.


    People will do anything to try to free themselves from this situation, including
    blaming their partners, manipulating them, trying to control them, having affairs,
    abusing drugs or alcohol or any of a hundred other things, gaslighting their partners,
    or even becoming violent. Over time, these tactics may become part of the structure
    of the relationship.


    All of us in committed relationships—including therapists, other healers, and
    spiritual leaders—experience these same temptations. But none of these tactics
    works to help us grow up. In fact, they all deepen the conflict.'
  merge: -1
