  md: '# 23

    Little Traumas Can Cause Big Problems


    Many of us carry some traumatic responses in our bodies. When we’re put in a situation
    that reminds our body of an original trauma, it can cause us to fight, flee, freeze,
    fawn, or annihilate. Like Dr. Frankenstein’s monster, we watch our own body respond
    in ways we don’t understand and can’t easily control.


    I want to be clear here. Not all individuals and couples struggle with trauma.
    In many cases, people simply need to begin growing up. But some couples do stay
    stuck in a cruel or painful pattern because of past trauma. My work with high-conflict
    couples has shown me how trauma can cause otherwise rational people to have overblown
    reactions to seemingly minor situations.


    When people have such reactions, most therapists—and most lovers—don’t know how
    to address them. Therapists typically rush to use cognitive processes such as
    anger management. But anger management doesn’t work on our Godzilla brains any
    more than it would work on Godzilla. Godzilla is not reasonable.


    With trauma, anger isn’t the issue. Instead, it could be that the body is trying
    to complete the action that occurred when it created the trauma, so it can release
    the energy stored inside the trauma.'
