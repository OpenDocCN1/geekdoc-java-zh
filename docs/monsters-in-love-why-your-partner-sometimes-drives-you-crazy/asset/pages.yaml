    # Anchor 3: Accept the discomfort instead of trying to flee from it.

    At first this will be difficult, but with practice it will get much easier. There
    are some ways to practice this anchor:


    +   - When you experience an urge to tap down or push away the discomfort, don''t.
    Keep your attention focused directly on it. Stay with it.


    +   - When you get the impulse to analyze or think about the discomfort, bring
    yourself back to the discomfort itself.


    +   - When your mind spins out strategies for what to do next, don''t grab onto
    them. Just sit with the discomfort.


    +   - When thoughts or images about the past or future pop up, let them float
    past you. Stay with your body.


    # Anchor 4: Stay present and in your body as you move through the unfolding experience,
    with all its ambiguity and uncertainty, and respond from the best parts of yourself.


    Continue to use the first three anchors to hold on to yourself. At the same time,
    slowly move with your partner into the heat, peril, and possibility of the conflict.
    You and your lover will need to go forward into the unknown, moment by moment.
    Here are some helpful tips:


    +   - When you find yourself focusing on the future or the past, use the first
    three anchors to bring yourself back to your body and here and now.


    +   - When your attention moves to what''s wrong with your partner or what a jerk
    they''re being, use those first three anchors to bring you back to the present.


    +   - Find a place in your body where you experience warmth, love, or concern
    for your partner. Focus on that spot.'
