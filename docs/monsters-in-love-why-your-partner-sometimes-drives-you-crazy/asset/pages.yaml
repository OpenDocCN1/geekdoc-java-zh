    However you move, the essential question facing you is this: When the heat gets
    turned up, which cycle will you follow?


    Let’s look more closely at the growth cycle.^6 A good place to begin is at the
    bottom of the diagram “Growth Cycle of a Relationship” (Figure 1) that follows.


    As you and your partner go through life together, you find yourself up against
    more and more of your limitations. This naturally creates ambiguity and adversity,
    turning up the heat under both of you.


    If you’re like most couples, you try to deal with the heat through accommodation,
    compromise, clear communication, and other such tactics. On little things, these
    work, at least temporarily. But with the big things—things that matter to you,
    things that are tied to your integrity—all your efforts at accommodation and compromise
    fail. So do any short-term dirty-pattern strategies, as silently acquiescing,
    overriding your inner calls for integrity while privately burning with resentment,
    or ribbing your partner with sex, attention, or other things they like. And so
    do withholding sweetness and regard, stonewalling, criticism, sensing vibes of
    contempt, and acts of defensiveness. Instead, they make the conflict bigger and
    hotter. You and your partner keep coming up against the same issues, again and
    again.


    The two of you grind against each other—hours, days, months, or even years—because
    the conflict can’t be resolved by some tactical decision or agreement. Your anxiety
    about the conflict increases. So does your partners. One of you could simply acquiesce
    to the other, but that would mean violating your integrity—and you’re not going
    to do that. Your partner is in exactly the same situation.


    Eventually the two of you reach an emotional stalemate or bottleneck. Just by
    being who you are, each of you blocks the other’s position. There seems to be
    no solution.


    The conflict keeps growing until it reaches critical mass. One of you—possibly
    both of you—can’t live with the way things are anymore. Something has to change.


    This is a moment of both peril and possibility. It’s a moment of peril because
    one or both of you may choose the commonplace cruelty cycle. It’s'
