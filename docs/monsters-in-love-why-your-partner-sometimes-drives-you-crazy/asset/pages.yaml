  md: '# When Commonplace Cruelty Turns Physical


    Each of us is cruel to our partner sometimes. We slime them. We eat their heart.
    We forge a coercive alliance. We treat them like shit. Emotionally or spiritually,
    we punch them in the gut. But we usually keep any impulses to physically harm
    them in check.


    We’re cruel to our partners because—for a short time—it works. It briefly satisfies
    us to blow our own pain and anxiety through them. It gives us a sense that we
    have some power. It creates a truckload of dirty pain, but until that truck pulls
    up and unloads, we have some brief, welcome relief.


    All of this cruelty is 100 percent socially acceptable. No one goes to jail for
    it.


    Unless the cruelty gets physical. Once there’s physical cruelty of any kind—however
    brief or limited—everything flips. That form of cruelty is considered 100 percent
    unacceptable.


    And it should be.


    In our culture, we don’t say, “Physical cruelty is wrong. It needs to stop, and
    the people involved need to heal and grow up.” Instead, we shout, “ANY WHO IS
    PHYSALLY CRUEL TO THEIR PARTNER IS A MONSTER!


    And that’s completely true.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'But in the great majority of cases, the person is an ordinary human monster,
    just like you me.


    They simply got caught practicing the one and only form of commonplace cruelty
    that our culture forbids.


    # Welcome Home, Monsters


    In most relationships where there has been physical cruelty, the two lovers think
    they’re uniquely shameful or screwed up—that they’re fundamentally different from
    other, normal couples. They’re not.


    I’ve worked with hundreds of such couples, both in my private therapy practice
    and as the clinical director for the Tubman Family Alliance, a domestic violence
    treatment center in Minneapolis. I have also worked with hundreds of individuals
    who have been physically cruel to their partners and hundreds of individual folks
    who have been on the receiving end of that cruelty. Here are some of the first
    things I tell most of people:


    “You’re not special at all. You’re just like everybody else. You experience the
    same things, and you have the same urges.22 As an impulse, cruelty comes naturally
    to human beings, like compassion, empathy, generosity, and kindness.


    “You’re not even unusual in terms of being physical cruelty in your relationship.
    In a study of over 14,000 young adults, there is physical cruelty in 24 percent
    of all partnerships.


    “When someone is cruel to their partner—physically or otherwise—it’s not because
    they’re a hopeless asshole. It’s almost always because they can’t tolerate the
    heat of the situation they and their partner are in.23


    “Cruelty of any kind can act as a release valve for heat. You lost your shit because
    you were caught in an emotional bottleneck with your partner. Instead of connecting
    to your integrity, and addressing what needed to be addressed in yourself and
    your relationship, you tried to blow all your pain through your partner. You got
    overwhelmed, and you didn’t have the internal skills or resources to deal with
    it. Now it’s your responsibility to get off your ass and build them.


    “This was fundamentally an act of avoidance. Instead of confronting yourselves,
    at least one of you was physically cruel to your partner. Which is why, in therapy,
    we’ll focus on what it means to confront yourself. We won’t just focus on the
    physical cruelty.'
