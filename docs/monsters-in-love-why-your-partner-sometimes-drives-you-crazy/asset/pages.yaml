    I accidentally broke a mug,” Katarina told me in my office. “Bea said, ‘I hate
    it when you’re clumsy about sex tonight.’ It was going to be our last night in
    a motel for a week, so I said, ‘Fine. I’ll go to the Pony Club and find somebody
    there to fuck.’


    They finally reached critical mass when, in the middle of an argument, Katarina
    suddenly clenched her fists and advanced on'
