    abuser and the other a victim, there is often a hidden, secondary aspect of the
    relationship in which those roles are reversed. When one person is primarily concerned
    with power and the other with control, there may also be an undercurrent in which
    the opposite occurs simultaneously. I''ll say much more about this aspect of committed
    partnerships in later chapters.


    Both/and is who you and your partner are. Any committed partnership is always
    a combination of three entities: you, me, and the two of us together.


