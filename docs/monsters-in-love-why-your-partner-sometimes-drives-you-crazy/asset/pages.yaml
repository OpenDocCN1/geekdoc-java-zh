  md: '# Why Our Culture Sometimes Drives You Crazy—and What You Can Do About It


    Like each of us as individuals, our culture is always being called to grow up.
    Like so many of us, it often refuses.


    American culture, like all cultures, is shot through with unhealed trauma—much
    of it historical, intergenerational, and persistent and institutional.


    American culture, like all cultures, is awash in dirty pain.


    Each of us is routinely bombarded by cultural messages that encourage us to spread
    that dirty pain by blowing it through others—as well as cultural messages that
    encourage us to pause, hold onto ourselves, explore that pain, and metabolize
    the energies behind it.


    Over and over, our culture presents us with emerging perils and possibilities.


    As you may already intuit, much of what you have learned in this book about your
    relationship with your partner also applies to relationships with your neighbors,
    your fellow countrymen, and all other human beings.


    Since 2016, my work has focused primarily on Somatic Abolition, the healing of
    racialized trauma, our collective growing up around race, and'
