    # Why Most Couples Stop Having Sex


    I''ve observed most couples stop having sex for at least five to seven years during
    the course of a long-term partnership. Sometimes all at one time, and sometimes
    on off.


    In any partnership, both people need to show up for themselves and for each other.
    When that doesn''t happen, sex loses its imperative—or goes away entirely.


    If a couple isn''t having sex, we think it''s pathological, that something is
    wrong. But in the great majority of couples it''s exactly the opposite.


    When a couple isn''t having sex, it''s for a reason. If they can move into that
    reason and confront it, they can sometimes unhook it. Somebody—maybe both lovers—need
    to raise their game.


    But that''s not what usually happens. Instead, without talking about it, they
    make an agreement: I go out with my friends, you go out with your friends, we
    pay the bills, we take care of the kids. Don''t mess with me about what I do to
    blow off steam, and I won''t mess with you about no sex. They back off from each
    other and go to their separate corners.


    They need to do the opposite: grind against each other in multiple ways until
    they reach an emotional bottleneck. This is a place where one or both partners
    can''t go anywhere anymore in their way. Your position and partner''s positions
    can always block each other. You''re in an interlocking conundrum where something
    has to change, either in one partner or in both.'
