    # Rocks and Holes


    Most of us think that the success or failure of a committed partnership largely
    depends on personality—people’s backgrounds, politics, religion, likes and dislikes,
    interests, senses of humor, quirks, and so on. But these elements only speak to
    compatibility. And compatibility doesn’t get at the purpose and opportunities
    of a committed relationship.


    Compatibility is what supports a pleasant and comfortable friendship. The dynamics
    of a committed relationship are entirely different; they involve fit.


    Fit has to do with the mental templates each partner uses to live their life and
    negotiate the world. My wife and I have very different personalities. But, as
    I’ve learned over the years, we’re a perfect fit.


    In every couple, both partners’ strengths, weaknesses, traumas, fears, hopes,
    and desires fit together and are interlocked. This fit is why the two people have
    come together. It’s also why they keep sailing into emotional bottlenecks.


    If you look at a couple and wonder, Why the hell are they together? or What in
    the world do they see in each other?, it’s because of those things that interlock.
    But that might not be visible to a casual observer.


    As Dr. James Maddock used to say, the rocks in one partner’s head fit perfectly
    into the holes in the other’s.


    This is no accident. It’s how committed partnerships work.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'There’s another aspect of fit: the lived experiences that you and your partner
    bring to the relationship.


    Year by year, each of us lives out multiple stories——some purely personal, some
    persistent and institutional, some historical, some intergenerational. Some of
    these are stories of hope and success, others are stories of loss and harm. As
    we grow and age, we can choose to repeat certain stories, to stop repeating them,
    or to rewrite them.


    Here are some examples:


    +   - You often have to fight to be heard, or to have your presence recognized.

    - You are consistently rewarded for your minor achievements, while your major
    ones sometimes get overlooked.

    - You regularly find yourself stepping in calm out-of-control kids.

    - You advance quickly in most of your jobs, but within two to three years reaches
    a place where no advancement is possible.

    - You often injure yourself while playing sports.


    Similarly, over time, through repetition, certain energies come to inhabit your
    body. Your belly constricts when you sense that you are being evaluated. You reflexively
    brace yourself for a fall when someone’s body gets within a foot of yours. Your
    chest tightens when someone you care about gets angry. You experience a whole-body
    surge of excitement when you dive into the ocean.


    I call this unique set of stories and energies their *somatic throughline*. (Somatic
    simply means body-centered or related to the body.) When two people’s somatic
    timelines line up especially well, this is another classic form of fit.


    # HOLLY AND AARON


    Holly, the daughter of an Air Force lieutenant, grew moving from place to place
    every few years. When she falls in love with Aaron, an actor who makes a living
    playing minor film roles, her body experiences his constant traveling as comfortable
    and familiar.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Because Aaron was raised in a tightly controlled and highly scheduled household,
    his body experiences Holly''s flexibility and adaptability as deeply supportive.
    In these and other positive ways, Aaron''s and Holly''s somatic throughelines
    dovetail beautifully.


    But dovetailing isn’t only positive. In any couple, each person''s somatic thru
    includes unresolved issues and dirty pain. These typically line up perfectly,
    so that the rock of your unresolved issue or limitation fits perfectly into the
    hole of your partner''s issue or limitation. This causes conflict, friction, and
    often, pain and confusion.


    When this happens, nothing is going wrong. It''s exactly what is supposed to happen.


    The positive and pleasurable aspects of dovetailing usually show up early in a
    relationship—and they help the relationship to grow. But eventually—after weeks,
    months, or even years—the dovetailing of limitations and issues shows up as well.


    When this happens, most couples initially see their situation as surprising and
    tragic—maybe even as a betrayal. But it''s actually a huge opportunity.


    When one of your limitations or issues lines up with one of your partner''s, it''s
    a call for both of you to grow up. It''s also an ideal chance for each of you
    to support the other''s growth.


    If the only thing bringing you and your partner together is compatibility, it''s
    similar to hooking up with someone because they have a nice smile, or a sexy walk,
    or a talent for making you laugh. It may support some good times, but it won''t
    provide a foundation for a long-term relationship.


    If all you want a summer fling or a week of sex and partying while you''re on
    vacation, then finding someone who''s compatible will probably do. But if you
    want a real relationship with another human being, you''re going to be motivated
    by fit, whether you realize it or not.


    Here are two real-life examples of fit (with some details changed to protect people''s
    privacy).


    # CIG AND GRETA'
