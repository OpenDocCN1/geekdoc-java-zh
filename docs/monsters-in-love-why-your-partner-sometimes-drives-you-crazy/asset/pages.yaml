    of growth and play with the energies of living and relating with others.


    Psychotherapy mirrors marriage in many ways. If therapists are both playful and
    strategic, if they understand what they are seeing, and if they are willing and
    able to calm their own anxiety, then they can provide couples with wise guidance,
