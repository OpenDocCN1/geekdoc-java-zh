  md: '# 39


    # People in Therapy Are Heroes


    In therapy, you make yourself vulnerable. You open yourself to a process that
    you can’t control or predict—or even understand in a cognitive way. If you stick
    with it, you may move through something new and unknown, and you may become a
    different person.


    Don’t tell me that that’s not heroic.


    The changes people go through in therapy can be brutal. It takes great strength
    to sit in a therapy session and face the truth about yourself and your partner.


    Often tell clients, “I really hope you guys make it through this together. I’m
    going to do everything to help you, and I want both of you to be happy. But I
    don’t know if you’re going to be together when you come out the other end.” When
    I tell this to partners and they say, “All Resmaa, let’s do it; let’s go through
    this,” that’s heroic.


    In my office I see transformations that ministers and rabbis and imams tell me
    wish they could witness. I see couples hit emotional stalem, go through critical
    mass, and come out the other side as different people, with their relationships
    transformed.


    Afterward, these couples thanked me. But I always say, “Let me tell you something.
    Watching you two go through this process was inspiring. You did something deeply
    spiritual. You’re heroes to me.”'
