    has just outrun a lion will vigorously shake itself or ripple the skin along its
    back. Other animals will roll on the ground, or run in a circle, or brief mock
    fight with each other. They’re metabolizing their excess energy by discharging
    autonomously.


    After you and your partner have been in the heat of a conflict, this same kind
    of energy is bottled up in your bodies. But humans need to'
