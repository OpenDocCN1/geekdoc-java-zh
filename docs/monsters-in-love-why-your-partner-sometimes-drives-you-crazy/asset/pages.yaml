    +   - Everyone always knows whether they chose their partner or not. All you have
    to do is ask them.


    +   - Sometimes people don’t choose their partners because they’re afraid to choose.
    They know that choosing makes them vulnerable. But choosing not to choose only
    makes them more vulnerable—and disappointed.'
