    Actually, one part of you always hates your partner. In fact, the closer your
    relationship becomes, and the more vulnerable you become, the more it hates them.


    When you and your lover were dating, before you made a longterm commitment to
    each other, you probably had an unspoken agreement that either of you could end
    the relationship. It would hurt, but each of you would be all right. Both of you
    had the option to leave.


    But once you said, “I choose you,” or “Let’s be exclusive,” or “Let’s move in
    together,” your options shrank. Suddenly your actions and choices became bound
    upon your partner’s actions and choices. The things you wanted started rubbing
    against the things your partner wanted.


    Your threshold of being able to tolerate differences immediately shrank. You couldn''t
    blow off those differences anymore. “My lover wants children—we’re going to have
    to negotiate compromises for the rest of our lives.” Eventually this became a
    major bone of contention—not because someone is being unreasonable, but because
    the issue is important to both of you. That’s why it kept coming up.


    This happened with almost everything that affected both of you. Whatever bothered
    or worried you before your partner was now in your face on a regular basis—and
    whatever bothered them before you ended up front and center for them.


    In this process, the two of you moved into “I choose you,” you you had to consider
    your partner with everything you did and every decision you made. All the things
    you used to do to take pressure off became things you had to negotiate. You couldn''t
    quit your job, or move across town, or buy a new bicycle, or run up a big credit
    bill just because you wanted to. This made you even more vulnerable.


    When this happens, it drives people crazy. Suddenly the heat has been turned up
    under them—and they can''t easily lower the temperature. It’s not just about them
    anymore. In every aspect of their life, it’s now about us—them and their lover.'
