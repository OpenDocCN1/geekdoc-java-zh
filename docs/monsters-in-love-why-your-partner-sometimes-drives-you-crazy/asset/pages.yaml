  md: '# 41


    # How Therapy Mirrors Marriage


    What people do in therapists'' offices—in displaying their strengths and weaknesses,
    in avoiding and confronting themselves, and in getting stuck and breaking through—often
    mirrors what occurs in committed partnerships.


    I''ve discovered that when I start working with a client, I learn a lot about
    how they relate to their partner simply by observing how they relate to me. Usually
    there are a great many parallels. Here are the biggest and most common ones:


    Most people want to solve the problems in their relationships by getting their
    partners to change exactly the way they''d like. When individuals and couples
    first come to therapy, they do the same thing, hoping that they spend $200 or
    more per hour, the therapist will solve the problems for them. But that''s not
    how the therapist-client relationship works.


    Most people go to a marriage or family therapist because they sense that they''re
    burning up. They can''t handle the heat and pressure of their relationship. They
    want to lower the heat, take the pressure off, and find a way around their difficulties.


    This mirrors what most of us try to do with our partners: we want to make us happy,
    solve our problems for us, be, exactly what we want them to be, or handle our
    pressure or responsibility or pain for us.'
