  md: 'As part of our reflexive response, we typically make the person who was physically
    cruel into a villain, the person they were cruel to into a victim, and ourselves
    into a hero. This cartoonish, childish view of reality is also known as the victim/perpetrator/rescuer
    stance.²6


    In this view of the world, everyone plays a predetermined role. The victim is
    always helpless and powerless, the villain is always evil, and the hero always
    rescues the victim and then captures or annihilates the villain.


    In modern times, we''ve added them to this cycle: a fourth role. After Superman
    has delivered the victim to the authorities for punishment, Clark Kent writes
    about it for the *Daily Planet*, and the story goes viral.


    Occasionally, a celebrity in one story may refuse to play the role assigned to
    them. They straighten their spine and say to the media, “Please respect our privacy
    as we work through this together,” or “My partner is not a beast; we''re committed
