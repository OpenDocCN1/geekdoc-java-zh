    # # Continuous Improvement in  Relationships


    There’s much more to be said—and I’ll say it in later chapters—about integrity,
    critical mass, and the dynamics of transformation.


    But I don’t want to give you the impression that in committed partnerships, growth
    only happens when couples reach critical mass and someone changes the game. It’s
    also about continuous, incremental improvement. This improvement usually follows
    a clear sequence.


    First, both partners need to create stability in their relationship. This is a
    goal that most couples naturally seek, because it feels safe, like a boat that’s
    properly anchored. Without stability—and the trust and respect that stability
    helps to build—incremental improvement is impossible.


    What happens next, though, when catches lowers by surprise: the very act of stabilizing
    the relationship naturally brings forward difficulties and problems. Because the
    partners no longer have to focus on creating this basic stability—and because
    this stability supports trust, connection, and communication—they can begin to
    work through these difficulties together.


    In turn, the process of working through problems can create greater empathy, less
    rigidity, a better flow of energy, and more relationship glue between the two
    partners. Over time, a positive feedback loop can emerge. Issues will continue
    to pop up, but the partners will now be more'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'comfortable with addressing them. They will also have created an informal alignment
    process for handling them, as well as some norms, standards, and agreements. In
    essence, the partners say to each other, “We’re going to tolerate conflicts and
    work them out. This is how we’re going to do it, and here’s what we can expect
    from each other.” All of this creates more stability, and the cycle of continuous
    improvement tends to build on itself.


