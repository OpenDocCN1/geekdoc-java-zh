    by accusing her of flirting with her assistant. Ada responds angrily, “After all
    these years, don''t you trust me?” Jaty huffs, “Don''t dare make this my problem!”


    But, in fact, it is her problem. She''s unwilling to confront herself about her
    own fear, express it to Ada, and make herself vulnerable to her partner. By refusing
    to stand in her integrity and talk about her'
