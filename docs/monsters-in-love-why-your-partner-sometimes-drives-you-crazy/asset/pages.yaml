    # COMPASS POINTS


    +   * Power is the ability to influence. Control is the ability to regulate. All
    need power people and control people in our lives.

    * Power and control are a classic rock and hole. Without control, power is unfocused
    and ineffective. Without power, there’s nothing to control.

    * No human being is *solely* a power person or a control person. Every sane person
    has both orientations inside it. It’s a classic both/and arrangement.

    * Unfortunately, many therapists largely misunderstand power and control. They
    use the terms interchangeably, as if they were equivalents rather than opposites.
    This sometimes prevents clients from healing and growing up.'
