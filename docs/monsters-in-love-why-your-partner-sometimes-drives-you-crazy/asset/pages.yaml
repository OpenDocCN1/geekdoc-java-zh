  md: '2. We externalize the resistance as Satan, or society, or The Man. Instead
    of doing the necessary work of moving toward our best self, we devote ourselves
    to Jesus, or political organizing, or the struggle for social justice.²⁰


    3. We internalize the resistance as our ego or our dysfunction or our negative
    thoughts. Under the guise of confronting ourselves, we break ourselves into parts
