  md: '# Underground Therapy


    When most people hear the name Harriet Tubman, they think of a little Black woman
    who helped refugees from plantations make their way via the Underground Railroad.


    That’s true, but there was much more to her. For one thing, she was part of the
    Union Army, serving as (among other things) a spy. For another, she carried a
    shotgun.


    The shotgun wasn’t for fighting Confederate troops. It was for keeping plantation
    refugees focussed.


    Over time, Tubman gleaned that once people had gotten a certain distance from
    their old plantation, many would begin to have second thoughts. They knew that,
    going forward, they would face danger and the complete unknown. But if they returned
    to the plantation, they’d be back in a familiar setting—one they despised and
    feared, but understood. Sometimes people would change their minds and tell Tubman
    that they wanted to go back.


    That’s when she raised her shotgun and say, “You are going forward. You can’t
    go back. You can go all the way north, to a life of freedom. Or you can turn around
    and try to go back—but if you do, I’ll shoot you dead. You choose.


    This wasn’t just a matter of motivation. She knew that if someone did go back
    or get captured, they would tell the plantation owners about the'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'routes that were used to help people escape. This would put other refugees
    in danger.


    I don’t know the exact words Tubman used, of course. But her essential messages
    were certainly along these lines.


    I also don’t know if Tubman would have been able to articulate the five anchors
    she discussed in this book. But she certainly used them with herself, over and
    over—and that reinforced them in others with shotgun.


    When you’re familiar with something, even if it’s bad for you—even if it’s a living
    hell—there’s still an energy to it for you. You’re afraid to leave it. When you’re
    away from it, you sense its absence—and that is pulling at you to return to it.


    During the Civil War, as refugees went through the trials and tribulations of
    freedom, enslavement sometimes meant to be on their own in a world they didn’t
    know or understand. They knew they would have to grow up very, very fast. The
    north meant some relative freedom, but it also meant an onslaught of clean pain.


    Therapy is a similar process. It helps people escape from a world of old, dirty
    pain into safety and freedom. But it always means going to a new and unfamiliar
    place—a place they may recognize or understand. It always means going through
    clean pain and discomfort. And—if the therapist is any good—it always means growing
    up.


    When you go to a therapist, it’s like leaving a familiar and emotional plantation.
    Everything’s familiar will change. And once you’ve decided, you can’t go back.
    You have to keep moving forward.'
