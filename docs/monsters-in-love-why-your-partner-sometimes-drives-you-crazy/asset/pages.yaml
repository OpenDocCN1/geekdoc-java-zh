    # Both/And


    In life, many of our choices appear to be either/or—stay together or break up,
    exercise or let my body go, keep my job or stay home to raise the kids.


    But many of these apparent dualities are actually both/and. Both options are true
    or valid or valuable, though not necessarily at the same time.


    This is particularly the case with couples, who experience all sorts of apparent
    dualities: my way vs. her way, my family vs. his family, what I want vs. what
    you want.


    Every either/or conundrum naturally makes both partners uncomfortable. Each conundrum
    also naturally pushes couples toward emotional bottlenecks—and toward growth.


    Part of your job as a loving partner is to not try to block, avoid, or flee from
    this discomfort. It also means not trying to coax, debate, argue, bully, threatened,
    trick, bribe, or bullshit your partner into letting you get your way. It also
    means not giving in to your partner''s attempts to use any of these dirty-pain
    strategies.


    Instead, both of you need to live into the either/or conundrum until it transforms
    into both/and. You may also need to encourage your lover to follow your lead.


    Each situation has both limitations and possibilities. Most of us tend to focus
    reflexively on the limitations, but when we shift to focusing on the'
  merge: -1
  pgno: 149
