    # From Self-Help to Well-Being


    Everything you''ve read in this chapter so involves self-help: things you can
    do to support you and your partner''s health and happiness. Now let''s look at
    something less personal and more emergent: wellbeing.


    Well-being is built on collective energies, communal support, and an awareness
    that the health, happiness, and fates of all of us are closely bound together.


    Well-being is ongoing and timeless. It is not personal, tactical, or transactional.
    It is about being connected with others, the Earth, and the energies of creation
    itself. Perhaps most of all, it is about belonging.


    No amount of self-care—and no amount of strategy—can create well-being, or substitute
    for it. Instead, well-being emerges from a profound connection with your fellow
    human beings and with all of life.


    If well-being currently eludes you, don''t try to buy it, design and build it,
    track it down and trap it, seduce and ravish it, or receive it from a guru or
    mentor. You''ll fail every time.'
