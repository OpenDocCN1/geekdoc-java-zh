  md: 'Emotional bottlenecks are scary, because they''re places of peril and possibility.
    They''re also where we do do much of our most important emotional work with our
    partners.


    # FELICIA AND ANDÉ


    I worked with a married couple, Felicia and André. Felicia is Black; André is
    white. They hadn''t had sex for many months. In fact, Felicia had moved out of
    the bedroom, so they didn''t even sleep in the same bed.


    They''d been married for twenty-three years, and it turned out that for twenty
    of those years, André had called the shots and always gotten his way. Not just
    with sex, but in general. Without ever discussing it, that was the deal they had
    made.


    Felicia was tiny—barely five feet tall—and André was tall and broad, with a booming
    voice. When he got anxious, he would raise his voice and lean forward, creating
    a presence that some people found threatening.


    After grinding against each other in this way for two decades, Felicia couldn''t
    do it anymore. She didn''t say anything to André; she just started sleeping on
    the living room couch.


    André had no idea what the problem was. He kept trying to get her to talk about
    it, but she wouldn''t. He also tried to get her to go back to sleeping in the
    bedroom. She wouldn''t do that, either.


    André finally confronted her. As she lay on the couch, he stood over her and said
    angrily, "Tell me something. Are you ever going to sleep in our bed again?


    “I don''t know. Leave me alone."


    “Are you going to tell me what the hell is wrong?"


    “It doesn''t matter,” Felicia said, rolling to face away from him.


    “It matters to me. I''m your husband. You won''t have sex with me, you won''t
    sleep in the same bed with me, and now you won''t talk to me."


    “Good night,” Felicia said.'
