  md: '# CONCLUSION

    Unfolding Purpose


    In authentic therapy, the trajectory of people’s lives is altered for the better.
    People learn to act from their strengths, not their weaknesses, and become who
    they most want to be—and who their partner most wants them to be.


    People rarely understand this when they first show up in a therapist''s office.
    They want to change their partner to their liking. Or they want the therapist
    to give them a magic solution. Or they want a script for turning their romantic
    fantasy into reality.


    Yet the fact that they''ve walked into a therapist''s office usually means they''re
    willing to do more than just acquire easy answers. They''ve made a decision to
    go beyond blaming their partner, or themselves, or God. They don''t want things
    to stay the way they are. They’re ready for transformation.


    When couples do the painful work of growing up, they willingly drop their fantasies.
    They get better at being aware of the sensations in their bodies, staying present,
    and holding on to themselves—rather than each other—when their boats are buffeted
    by waves, slowing down their thoughts instead of reacting from their lizard and
    brains, loving each other, and loving themselves. They begin to see their partners—and
    themselves—as they are, instead of as who they wish, fear, or imagine them to
    be.


    Each person also starts to see the *relationship* for what it is: an opportunity
    to build both autonomy and togetherness, and to forge a loving, collaborative
    alliance.


    Real psychotherapy is a deeply spiritual process—not usually religious, but reflective
    and alchemical. This process always involves someone'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'standing in their integrity and saying, “This is who I am and this is what
    I want."


    In couples, it means at least one lover choosing to stand up and straighten their
    spine. It means saying to their partner in the heat of an emotional stalemate,“I
    love you to death, but I''m not going to do this anymore. We''re going to deal.
    I''m not going to leave you you or blame you in order to get through this. And
    I''m not going to hate or blame myself, either. There''s got to be something else.
    And I accept whatever pain I''m going to have experience in order to go through
    this.” Often it means coming out the other side a different person.


    This is the unfolding purpose of the relationship—and creation itself. It''s nothing
    less than spiritual transformation, and it''s experienced in the body.


    This is the point and purpose of authentic psychotherapy.


    This alchemical process can be equally spiritual for the therapist. It certainly
    is for me.


    Over and over in my office, I watch people and relationships transform. I see
    clients willingly live into the unknown, knowing that it is rife with possibility
    and peril. I bear witness as someone’s unique purpose unfolds.


    When this happens, I know that I''m beholding the birth of Creation.'
