  md: '# From One Monster to Another


    Monsters in Love was first published in 2015, under the title Rock the Boat.

    Back then, Barack Obama was president of the United States; Hong Kong was a bastion
    of freedom and stability; Kim and Kanye were newlyweds; Jamie Foxx and Katie Holmes
    were a happy, recently-engaged couple; few people outside of Indiana who Pete
    Buttigieg and Chasten Glezman were; abortion was legal in all fifty US states;
    and marriage equality had just been the law of the land.


    I''m completing this new preface in 2022. Although many aspects of our world are
    vastly different now, nothing has changed about the essential ways in we human
    beings act, react, think, experience, and relate to each other. So, although I''ve
    updated and expanded this new edition, its fundamental approaches and insights
    remain unchanged as well.


    Over the past few years, my book My Grandmother''s Hands: Racialized Trauma and
    the Pathway to Mending Our Hearts and Bodies was published, and I''m grateful
    to say, hit many bestseller lists. This led to my Somatic Abolition book by www.resmaa.com/somatic-learnings,
    to the spread of Somatic Abolition, to my book The Queaking of America: An Embodied
    Guide to Navigating Our Nation''s Upheaval and Racial Reckoning, and to many new
    opportunities for healing racialized trauma. That is currently the primary focus
    of my work—but it is not the only focus.


    I''m a healer. My work involves helping people heal from trauma, grow closer,
    build discernment and resilience, and grow up. Some of my work continues to focus
    on couples in committed relationships.


    Although I''m a healer, like you, I''m also a monster. (More about this in a few
    pages.) That''s why it was important to create this new, expanded edition—and
    to give it a more accurate (and more compelling) title and subtitle.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Some of the experiences, practices, and concepts you''ll read about Monsters
    in Love also appear in My Grandmother''s Hands (and in other things I''ve written).
    This is no accident. What can work to heal racialized trauma can also help couples
    to grow closer—and to grow up together. Some of these include:


    +   - The five anchors. These can help you to slow down, stay present, and hold
    onto yourself when things start to cook in your relationship.

    - Guidance for paying close attention to what you experience in your body.

    - Clean pain and discomfort vs. dirty pain: pain that leads more conflict and
    difficulty.

    - How moments of conflict create both peril and possibility.

    - How you and your partner can act from the best parts of yourselves.

    - Practices for keeping your body healthy and alert.

    - How to begin seeing other people as they actually are, rather than how you wish,
    fear, or imagine them to be.

    - How you and your partner, separately and together, can discover unfolding purpose.


    If you (or you and partner) are already doing some of the work of Somatic Abolition,
    then you may already be familiar with these experiences and concepts:


    +   - Life reps: situations life presents you that force you up against yourself
    and require you to choose either the clean pain and discomfort of growth or the
    dirty pain of harm.

    - Invited reps: practices you choose to practice and repeat, in order to condition
    and temper your body and mind.

    - Primal reps: foundational body-centered practices that make you more aware of
    your body and the energies that move through it.

    - Geopathic stresses: the cultural, social, political, institutional, and environmental
    stresses that weather our bodies, minds, and intimate relationships.'
