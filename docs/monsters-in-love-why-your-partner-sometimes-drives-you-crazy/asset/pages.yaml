  md: '“Each of taking yourself on is the only way you’ll be able grow up, learn to
    stand in your integrity, and stop being so cruel to your partner.


    The solution for you is is the same as for everyone: learn to tolerate the inevitable
    heat and friction of being in an intimate partnership. Practice the five anchors
    to soothe yourself, slow yourself down, and stay present when the heat gets turned
    under you. Act from the strongest parts of yourself, not the weakest. And accept
    the pain of growing up.


    “You’re here to begin learn how to do all of these things.”


    # Two Notable Exceptions


    More than 90 percent of physical cruelty in committed relationships is the result
    of ordinary human monsters unable to tolerate the inevitable heat and friction
    in their partnerships. When they’re overwhelmed, they respond from the weakest
    parts of themselves and inflict physical harm on their partners. The use of alcohol
    or drugs often worsen their response.


    That’s the kind of cruelty this chapter focuses on. But for the next five paragraphs,
    I need to talk about the exceptions.


    There are two small groups of people who don’t fit the profile of ordinary human
    monsters: people with antisocial personality disorder (usually called sociopaths
    or psychopaths) and folks with the grandiose form of narcissistic personality
    disorder (usually grandiose narcissists). These people genuinely are wired differently—and
    dangerously.


    The sociopath enjoys manipulating and inflicting harm on others and does purely
    for sport. The grandiose narcissist is so reflexively self-involved that no one
    matters to them. In both groups have no conscience and capacity for empathy. Both
    types of folks have a total disregard for other people’s needs, desires, and concerns.
    Unlike ordinary human monsters, they are often regularly abusive or violent. They
    also have one shared trait: they never heal, transform, or grow up.


    About four to five percent of all people fit one of these two profiles. (Estimates
    vary, and no one has yet done an accurate head count, but that percentage is in
    the ballpark.)


    A good therapist can smell a sociopath or grandiose narcissist—sometimes immediately,
    and almost always over time. Here are the scents these people give off:'
