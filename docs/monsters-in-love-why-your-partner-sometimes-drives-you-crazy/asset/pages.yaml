  md: 'Squeezing. Gently squeeze any part of your body with your hand, with two or
    more of your fingers; hold the squeeze for three breaths; then release. As a variation,
    gently curl your fingers into relaxed fists.


    Pushing and pulling. While maintaining your balance, gently push against a wall
    or table; then pull yourself back toward it. Or, plant your feet shoulder-width
    apart, then make pushing and pulling movements into the space around you. As a
    variation, hold your palms open and upward, if you are offering and receiving.


    Stretching. Stretch out any body part(s) that wants to be stretched, in any direction
    that your body wants to stretch; hold for three breaths; release.


    Softening.Relax all the muscles in your face and head. Let your eyelids droop
    (but not close). Let your jaw lang. Let your tongue to the bottom of your mouth.


    Curling up. Lie down on a comfortable, even surface—a bed, a trampoline, the ground.
    Slowly pull your body into a fetal curl; hold the curl briefly; then uncurl.


    Infant positioning. Lie down on a comfortable, even surface. Turn your head to
    one side. Put your hands in a “stick-em-up” position on both sides of your head,
    letting them rest comfortably. Using the muscles in your thighs and lower back,
    raise your knees toward your head, until your feet are off the ground. (This is
    the infant often take when you lay them on their back to change their diaper.)
    Hold your knees and legs in this position for a few breaths, while letting all
    your other muscles relax. Notice what vibrations, images, thoughts, meanings,
    urges, emotions, sensations, and imagin arise—especially related to submission
    or protection.


    Working with your joints. Move your head in a few slow circles; repeat in the
    opposite direction. Do with any or all of these joints, by one: shoulders, wrists,
    hips, ankles. If you like it, do with your thumbs and then each finger, one by
    one.


    When I talk about primal reps in classes and workshops, people usually flood me
