  md: '# When Something Is Missing


    In my work with couples, I often hear one partner say, “Resmaa, I’ve always sensed
    that something’s missing in our relationship.”


    As the client and I explore this sensation, we almost always discover that it’s
    visceral, not merely cognitive. The client experiences the absence in their body.


    Often what’s missing is a full commitment from the other partner. This can result
    in one lover regularly asking for more and the other reflexively withdrawing.
    The relationship becomes a dance of constant flight and pursuit. One common version
    of this is the overpowering and underpower I described in chapter 15.


    When one person senses something in their partnership is missing, it usually means
    that at least one of the partners didn’t really choose the other. They chose security
    or hotness or money or connections, but they didn’t choose the other person.


    The cliché of the billionaire and the trophy partner perfectly fits this template.
    After a few months or years of living the high life, the trophy partner starts
    to sense that something is missing. The billionaire responds by buying their partner
    a new house, or an extravagant vacation, or some magnificent new bling. This settles
    things down for a short time, but eventually the same problem returns, because
    the trophy partner is beginning to stand in their integrity.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'In other situations where one lover senses something is missing, it’s because
    they let someone else—their parents, their partner, or their spiritual leader—make
    the choice for them. They may have gotten involved with their partner not because
    they wanted to be with that unique human being, but because the person had the
    right set of characteristics. Perhaps they made a lot of money, or they had the
    right family connections, or they were prominent in a certain profession, or they
    offered a quick ticket out of town, or they pleased mom and dad, and they pissed
    the hell out of mom and dad.


    Or maybe, years ago, they were simply afraid to say no. They didn''t want to hurt
    their suitor, and they worried that no one could do better along, or they feared
    losing a passable (or familiar) longterm relationship.


    People rarely talk about this topic, even to their partners. But I''ve learned
    that everyone always knows whether they chose their partner or not. All you have
    to do is ask. And in mine, I routinely do.


    Sometimes people don''t choose their partners because they''re afraid to. Choosing
    makes people vulnerable. It opens them to the possibility of making a bad choice,
    of losing, being rejected, or ending up with nothing. It may seem safer to let
    someone else choose for them. So they choose not to, thinking that then they can''t
    lose or be disappointed.


    But that''s not how things play out. They eventually do up disappointed. Choosing
    not to choose actually makes them more vulnerable, even though they think it will
    have the opposite effect.


    Eventually they sense that something is missing. And something is: their own commitment.
    They end up in a therapist''s office, hoping to unsnl their tangle of wants and
    fears and disappointments.


    Choosing to commit to other human beings is frightening. We have no idea what
    the future will bring, or how our partner will change, or how we will change,
    or what alternative future might play out if we don''t commit.


    But guess what? If you don''t commit to someone, or something, or some purpose,
    you''ll still have no idea what the future will bring, or how you will change,
    or what would have happened if you had committed. It''s the same conundrum experienced
    from the other side.


    One common variation of being afraid to choose is being afraid to want, because
    wanting makes you even more vulnerable to loss, failure, frustration, and disappointment.
    By refusing to choose their partner—by instead acquiescing and simply allowing
    themselves to be chosen—the'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'person denies their own desires, hoping this will somehow protect them. But
    it never does.


    Instead, not wanting eventually creates all kinds of relationship problems. It
    often sets up a negative feedback loop like this one: I''m afraid to want my husband,
    because wanting makes me vulnerable to rejection and loss, and those hurt like
    hell. If I do choose him and later he leaves me or dies, I won''t be able to take
    the pain. So I won''t choose him; instead, I''ll let him choose me. I''ll say
    yes. But I''m not choosing him—and too damn bad for him.


    This line of thought may take a pernicious turn: But why the hell my partner want
    me if I don''t want them? And how can I respect them if they don''t confront me
    about this? There must be something wrong with them. I''m going to treat them
    badly. They must deserve it, to stay in a relationship with someone like me.


    Meanwhile, the other partner''s thoughts often go something like this: I don''t
    know why, but I don''t trust my partner. They haven''t cheated on me or mistreated
    the kids or spent our money, but something seems untrustworthy or inauthentic
    about them. I can''t put my finger on it, though.


    That''s the best-case scenario. If the person is being mistreated, they might
    also think, Why the hell does my partner treat me so shitty? It''s like they''re
    mad at me for just being with them. But they don''t seem to want to leave, The
    whole thing makes no sense. It''s starting to make me crazy—and angry.


    This dynamic naturally leads to an emotional bottleneck. Eventually, the partner
    who has avoided choosing or wants to confront themselves. They also have to make
    a choice: either make a genuine commitment to their partner—and to their own integrity—or
    leave the relationship.


    If they continue to refuse, then their partner has to make a choice of their own:
    leave the relationship in order to maintain their integrity, or accept the ongoing
    dirty pain of avoiding the call to grow up.


    This other partner also needs to confront themselves with some important questions:
    Why did I settle for so long for so? What do I actually want from this partnership?
    In what ways will I advocate for what I want? And if my partner refuses to change,
    I am going to leave or stay in a constricted and unsatisfying relationship?'
