  md: 'Still, grim as these statistics are, they represent an enormous improvement
    over how things used to be.


    In the United States, through the late 1950s, women were routinely brutalized—and
    sometimes raped or murdered—while our culture looked the other way. When people
    beat their partners, often no one called the police. When the police did get called,
    they would take the batterer around the corner, give them a talking to, and leave.
    There was little accountability, little prosecution, and no therapeutic intervention.
    There were also few therapeutic practices available. There was no such thing as
    crisis intervention. There no women''s shelters. Beating your partner was not
    usually considered sufficient grounds for divorce.


    Women were not protected by police, by courts, by psychologists, or by religion.
    Furthermore, if you and your partner were gay, or lesbian, or hetero and unmarried
    living together, you could be arrested.


    Psychology was especially idiotic. Homosexuality was considered a mental disorder.
    (Leaving your wife considered perfectly sane.) Psychoanalysts believed women sexual
    pleasure from being beaten by their partners; as late as 1964, an article in the
    Archives of General Psychiatry explained that wives whose husbands were physically
    cruel to them a masochistic need for pain that their husbands’ aggression fulfilled.²⁷


    By the 1950s, women had had enough of this crap. They began to take matters into
    their own hands. They created underground safe houses—places where women could
    be safe from their physically abusive partners. These were reminiscent of the
    safe houses of the Underground Railroad during the Civil War; they were also precursors
    of women’s shelters, which would appear in the mid-1960s.


    For the next two decades, things improved steadily—almost solely because of women’s
    organizing, advocacy, activism, and hard work. Law, public safety, psychology,
    and government—all of which were heavily male-dominated—mostly sat on their hands,
    and occasionally got in the way.


    Womenists wisely gave up trying to engage with these fields. Instead they said,
    “We don’t trust you to do a goddamn useful thing, so we won’t ask you to. But
    at least get the hell out of our way so we can make the world safer.” That’s exactly
    what happened. Women’s organizations set'
