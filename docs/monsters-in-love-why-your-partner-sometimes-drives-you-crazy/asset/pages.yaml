    It''s no accident that the brightening of self always involves a literal (as well
    as a metaphorical) straightening of the spine.


    The spine is like no other part of the human body. It''s at once a physical, emotional,
    and spiritual organ. It keeps us erect, and it serves as the main conduit for
    the body''s electrical and emotional energy.


    Your spine needs to be solid and flexible. If it''s not solid enough, you won''t
    be able to hold on to yourself in conflicts, difficulties, and danger. You''ll
    wimp out and give in.


    But if it''s not flexible enough, you won''t always be able to adapt or respectfully
    compromise. You''ll dig in your heels when you need to reach out or open. (Former
    Congresswoman Michelle Bachmann once boasted that she had a "titanium spine,"
    but such a solid, stiff spine would actually terribly brittle and dysfunctional.)


    Many spiritual traditions speak of the spine as the main pathway for the body''s
    spiritual energy, often known as kundalini, chi, or prana. The ancient icon for
    the practice of medicine, which depicts a snake coiled around a round, also represents
    the energy pathway up and down the spine. The equally Egyptian symbol known as
    the djed, which represents stability, is also a symbolic spine. And in the Kemetic
    fact, the spine is a symbol of transformation and grace.


    No one can predict a brightening of self will occur. It can''t be willed or planned
    or created. We don''t make it happen; it happens to and in us. It is part miracle,
    part mystery, part grace. But it only happens through intense pressure, heat,
    and friction. And it only happens after we make an internal commitment to growing
    up.


