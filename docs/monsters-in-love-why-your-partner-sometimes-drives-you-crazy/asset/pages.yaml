  md: '# 44


    ![](img/f0331d8dc5a59fa7731641cfdc004eec_340_0.png)


    # Integrity, Presence, and Not Knowing


    Good therapists know how to pay attention to bodily cues—what they see in their
    clients'' bodies and what they see and experience in their own. The better we
    get at noticing and experiencing these signals, the more helpful we can be.


    A wise therapist also knows how to look at each client—and each couplethrough
    a variety of windows. Typically these include intimacy, parenting, money, sex,
    work, families of origin, age, personal habits, and many others. Over time, a
    wise therapist is able to get a 360-degree view of the entire ecosystem of the
    partnership—for example, how Zoe''s drinking leads to Marlon''s withdrawal, which
    feeds Zoe''s resentment, which encourages Marlon''s mother''s disdain, which leads
    to fights between her and her son, who Zoe avoids by going out drinking with her
    friends.


    We therapists also need to show and tell our clients, over and over, that we''re
    exactly like them. We''re not special. We''re wired exactly the same as other
    normal human beings. We have the same kinds of challenges and problems, some of
    which involve our partners. And, like them, we have to keep growing up, day after
    day.


    This doesn''t mean we''ll always know what to do. Sometimes we won''t have a goddamn
    clue. But when we don''t know what to do, we''re honest and brave enough to say
    to our client, “I don''t know what to do or suggest right now. But let''s keep
    talking.”'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'We can stay engaged, keep listening, and move through the unknown with our
    client, in the same way couples often have to. This can be an act of deep support
    and integrity, because we''re not bullshitting our client with feigned expertise.


    Most of all, every therapist needs humility and a commitment to serve our fellow
    human beings.


    # COMPASS POINTS


    +   - Good therapists know how to pay attention to cues in their clients'' bodies
    and in their own.

    - A wise therapist knows how to look at each couple and see the entire ecosystem
    of the partnership.

    - We therapists need to show and tell clients that we face the same kinds of problems
    they do, and that we, too, have to keep growing up.

    - When a therapist has no idea what to do, they should say so, stay engaged, and
    move through the unknown with their client.

    - Most of all, every therapist needs humility and a commitment to serve.'
