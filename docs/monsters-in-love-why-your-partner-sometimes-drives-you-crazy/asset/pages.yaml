  pgno: 156
- img_proc: true
  md: 'One night, Daiyu falls asleep with a cigarette in her hand; when the smoke
    alarm wakes her a few minutes later, the edge of her blanket is smoldering. She
    rolls up the blanket, throws it in the shower stall, and turns on the water.


    The only immediate damage is to the blanket, but Chen and Brock are deeply worried.
    They agree that Daiyu could easily start a dangerous fire. They also agree that
    Daiyu''s living situation is no longer safe for her—or other tenants. Nevertheless,
    they suddenly find themselves in serious conflict—and each person''s position
    is tied deept their integrity.


    "We have to more," Chen insists. "She''ll burn the building down. We need to put
    down a deposit in an assisted-living facility and tell her she has to move"


    "I wish it was that easy," Brock says. "But you can''t force anyone into assisted
    living."


    "Let''s put her in a nursing home."


    "We can''t do that, either. She doesn''t need that kind of care." Chen says, "So
    we should just let her burn the goddamn building down?"


    "I''m saying she''s a very stubborn woman and a nicotine addict, and there''s
    no law against smoking or stubbornness. We''re not going to change your mom. We''ve
