    # Conflicts Can Be Messy—and Helpful


    If you’re like almost everyone else with a partner, you have a mental emotional
    image of who they are—and that image is not 100 percent accurate. When your partner
    acts in a way that doesn’t match your mental image, this can drive you crazy.


    As you learn to deal with your partner as they actually are, your relationship
    will naturally turn up the heat, over and over. This can drive you crazy, too,
    until you learn to accept and tolerate the heat.


    Over time, as you and your partner learn to support and lovingly challenge each
    other, both of you will change. The heat will get turned up in new ways, creating
    new difficulties—and new opportunities to tolerate that heat, grow up, and grow
    closer.


    When you go crazy in any of these ways, nothing is going wrong. The craziness
    experience is exactly what you need to go through. It’s your body and brain gut
    telling you, This can’t go on. Something has to change. You’re going to have to
    make choices.


    This choice isn’t one you want to make, or you’ve already made it. It’s probably
    something you’ve been avoiding for a long time. It’s a classic double bind. As
    Dr. James Maddock often phrased it: You’re caught between something you don’t
    want to do and something you really don’t want to do. All of your options may
    hurt. But you still have to choose.'
