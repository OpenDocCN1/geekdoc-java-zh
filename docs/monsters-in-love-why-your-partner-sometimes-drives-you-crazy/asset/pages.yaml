  md: '2. Couples are either nonviolent (and decent) or violent (and screwed up).
    This is like saying couples are either thirsty or not thirsty, either law-abiding
    or criminal, or either beautiful or ugly.


    Among us ordinary monsters, physical cruelty is mostly situational. The great
    majority of people in committed relationships share the same basic motivations
    and emotions, and follow the same basic arc as grind against each other. The only
    differences are in how much heat they are able to tolerate, how able they are
