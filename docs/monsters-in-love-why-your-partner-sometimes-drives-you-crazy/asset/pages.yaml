  md: '# 6


    # Peril and Possibility Are the Same


    In your relationship, every moment is a moment of potential peril and pain—as
    well as a moment of potential growth and transformation.


    There are never any guarantees in any relationship. No one ever knows their partnership
    will turn out. Even the strongest and closest relationship can be torn apart—by
    death, illness, deceit, poverty, trauma, or bad luck. And a relationship that
    begins on shaky ground can blossom into deep love and respect and last a lifetime.


    We’d all like to believe that love, caring, and commitment will ultimately overcome
    everything. And sometimes they do. But other times, life tears people and couples
    apart. I know of loving relationships that ended because one partner was killed
    by a drunken driver or a stray bullet. I know of sane, loving, devoted spouses
    who divorced because of sociopathic in-laws. I’ve seen marriages destroyed by
    war, natural disaster, illness, bad investments, and hospital bills.


    Life is always full of peril.


    But peril is not always what we imagine it to be. We think that peril holds us
    back. When we hurt, we want to experience some safety and security in order to
    be able to take a risk. Life doesn’t operate that way. In fact, it’s just the
    opposite. Security and safety come after taking a risk, not before.'
