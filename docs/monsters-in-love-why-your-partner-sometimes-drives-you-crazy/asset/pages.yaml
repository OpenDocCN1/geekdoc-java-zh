    # Three Bad Ideas


    The term domestic violence originally meant violence in the home or violence in
    committed couples—but over the years it has morphed to mean women getting the
    shit out of them by their asshole male partners. That''s an accurate description
    of some of the physical cruelty that occurs in committed relationships. But not
    most of it. Reality is much more complex.


    In fact, our culture now suffers from three huge, interlocking misconceptions.


    +   1. When physical cruelty occurs in couples, almost 100 percent of it involves
    men hurting women. Sexism, sexual harassment, and an unexamined tolerance for
    sexual abuse and assault all play significant roles in our culture. Nevertheless,
    it''s important to note that women are not the sole sufferers of physical cruelty.
    Overall, in cases of physical cruelty in couples, about three-quarters of it is
    inflicted by men, and about three-quarters are inflicted on women. According to
    a 2010 report from the Centers for Disease Control and Prevention,25 about 24
    percent of all women have been on the receiving end of physical cruelty from their
    partners. (This percentage is confirmed by many other surveys.) But so about 14
    percent of all men. Furthermore, multiple studies show that physical cruelty occurs
    in gay and lesbian couples at roughly the same rates as it does in hetero couples.

    Gender doesn''t necessarily change the basic dynamics of a committed partnership;
    neither does sexual orientation. That said, when it comes to sheer carnage, men
    are much more responsible. Eighty percent of the people who kill their partners
    are male.'
