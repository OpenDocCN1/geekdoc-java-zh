  md: '# Getting on Your Back to Get Your Partner Off Your Back


    People often use sex to keep their partner at bay or to pacify them.

    When a conflict arises, or when one partner senses that a conflict is nearing
    an emotional stalemate, they may be unwilling to rock the boat or stand in their
    own integrity. Instead of moving through clean pain and discomfort with their
    partner, they try to distract or win over the partner by having extra sex—or their
    partner''s favorite kind of sex.


    A breast full of milk is exactly the right thing to pacify a crying, hungry baby.
    But trying to pacify an adult partner with a breast—or a vagina, penis, or mouth—makes
    one partner into a wet nurse and the other into an infant.


    On the surface, this seems to work for both lovers: one gets lots of their sex,
    and the other gets relief from the natural pressures in the relationship. Except
    that, after a while, the sex isn''t that great, because it''s become a business
    deal. You back off about my pot smoking, and I''ll just just the way you like.'
