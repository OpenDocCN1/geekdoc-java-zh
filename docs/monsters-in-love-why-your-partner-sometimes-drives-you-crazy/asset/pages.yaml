    # You Can’t Choose Not to Choose


    When we need to make important choices, there’s always the potential for loss.
    This scares us, and can make us want to fight, flee, or freeze. common form of
    freezing is refusing to choose. In couples, this often happens when there’s a
    recurring conflict or emotional bottleneck. At these times, all choices lead to
    difficulty and serious pain, and both lovers know it. But some choices create
    dirty pain, which can be paralyzing, while at least one can travel into and through
    clean pain and discomfort. Each lover can choose clean pain or dirty pain, but
    they can’t avoid choosing.


    Refusing to choose is itself a choice. It’s choosing to dodge, to try to flee
    from responsibility, to refuse to grow up. This works only up until one of you
    decides you want something better.


    By refusing to choose, people hope to avoiding vulnerable—or responsible for a
    painful outcome. By default, they force the choice onto their partner. This worsens
    the conflict, and usually creates even more difficulty and pain. It also reduces
    the partner’s trust and respect for them, because in committed partnerships every
    important choice is about growing or not growing up.


    When you’re faced with such a choice in your partnership, and all your options
    scare you, ask yourself these questions: What am I afraid to go through? What
    haven’t I confronted? What needs to be examined and and'
