    skip this regular self-care for genuine emergencies.


    Being Present and Noticing

    Part of any growth routine is learning to be fully present—in your body and in
    the here and now.


    Here''s a simple exercise in being present that I use with most of my clients.
    It takes only a minute or two—though some people practice on their own, they slow
    it down and take more time. I call it simply coming into the room.


    +   * Find a chair and sit down on comfortably. Take or two breaths, then close
    your eyes.

    * Imagine that you''re in outer space, looking down at the Earth turning below.
    Just watch it for a few seconds.

    * Now zoom in slowly until you''re looking just at the landmass of whatever country
    you''re in. You''re positioned directly over it like a GPS satellite, so it seems
    to be standing still.

    * Slowly zoom in further, so that you''re looking down on the state, or city,
    valley, or other area you''re in right now.

    * Zoom in still further, until you''re looking down at the top of the building
    around you. If you''re outside, zoom in far enough that you can make out your
    body below, as if you''re seeing it from an airplane.

    * Continue zooming in slowly, until you can clearly see your body in detail, as
    if you''re hovering a few feet above it. Notice your clothing, your posture, and
    any movement.

    * Then, slowly, descend the rest of the way to your body and slip inside it.

    * Take a few moments to simply breathe and be in your body.

    * Now, starting with your hair or the top of your head, slowly scan your body
    from top to bottom. Pay attention to each part as you work your'
