    In committed partnerships, we often have to choose between integrity and equilibrium.
    Over time, many relationships evolve into an unhappy equilibrium that both choose
    to tolerate. Neither one likes the situation, but neither is willing to say to
    the other, "I''m not doing this anymore. I want something better."


    Lovers choose equilibrium over integrity for all kinds of reasons. They might
    believe they don''t deserve better, or that nothing better is even possible. They
    might be afraid of being alone. They might be patient or stoic to the point of
    neurosis.


    Usually, though, both partners are afraid of change or conflict—or, most of all,
    loss. They worry that if they rock the boat and disrupt the painful but tolerable
    (and familiar) equilibrium, all hell will break. They''re not willing to take
    that risk.'
