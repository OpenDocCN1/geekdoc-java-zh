  md: '# 28


    # The Dance of Protection and Growth


    When a couple has been together for years, each member automatically develops
    an internal narrative about their partner and their relationship—including its
    strengths and benefits, its weaknesses and limitations, what is possible, and
    what is not.


    This narrative isn''t something that each partner thinks about much, except in
    moments of strong conflict. It mostly gets carried in their body. Typically, each
    of these narratives includes a bodily recollection of something painful that the
    person’s partner did in the past.


    These painful memories usually cause the person to develop a protective stance—or
    a set of protective behaviors—to try to avoid being hurt in the same way. They’re
    like scabs on wounds.


    These stances and behaviors usually provide some genuine protection—but they can
    also keep people stuck. In many couples, over time these two protective scabs
    grind against each other, over and over. This can create pain, further conflict,
    and eventual gridlock.


    # MEG AND JEAN-PIERRE


    Nine years ago, while washing the dinner dishes, Jean-Pierre accidentally shattered
    his wife Meg’s favorite tea mug, which she’d'
