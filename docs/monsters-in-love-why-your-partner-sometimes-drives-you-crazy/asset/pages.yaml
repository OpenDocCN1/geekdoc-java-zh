- img_proc: true
  md: 'Here’s the thing: Even one partner didn’t choose the other in the past, that
    doesn’t mean the relationship is doomed. Both people in the relationship still
    have the chance to choose each other now.


    The bright line of choosing and wanting always appears right now. If both partners
    can lean into their suffering’s edge and stay with that clean pain and discomfort;
    if they can allow their bodies to stir and quake with what needs to emerge; and
    if they both accept the unfolding peril and possibility, they both have the opportunity
    to grow up, grow closer, and become a loving couple.


    Many relationships have gone from stalemate to resolution, and from distrust to
    trust, when the non-choosing partner straightens their spine and says, “Honey,
    I’m sorry for holding back for such a long time. Now I’m ready. I want to be your
    partner. I’m willing to be vulnerable to you. I want to take the risk of moving
    through life together with you.


    In practice, this usually happens after the other partner straightens their spine
    and says, “It’s now or never. Either choose me, with all my warts and all the
    risks of being in an adult relationship, or I’m getting the hell out.


    In life, with or without a committed relationship, there’s no way of avoiding
    peril and possibility.


    # COMPASS POINTS


