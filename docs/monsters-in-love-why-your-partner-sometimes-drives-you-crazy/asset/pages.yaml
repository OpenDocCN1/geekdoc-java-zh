  md: 'Trauma is personal, but it is not only personal. More about this shortly.

    Sometimes partners drive themselves and their partners crazy because of unresolved
    trauma. But if they can complete the action around that trauma, they can metabolize
    the energy and move through it.


    You are not responsible for healing your partner''s trauma, nor are they responsible
    for healing yours. Each of you needs to grow up and learn to deal with life on
    its own terms. A good therapist can provide guidance and support, but they can''t
    heal your trauma for you.


    Still, some therapists can be more helpful than others. Certain therapists are
    specialists: they have experience, education, and training in helping folks work
    through trauma. If you know or suspect that you need to do work, consult with
    a therapist who has such a background. If you''re already seeing a therapist,
    ask them about their own experience and training in trauma work; if necessary,
    ask them for a referral to a trauma specialist.


    In general, the deeper the trauma, the more important it is to consult with a
    therapist who specializes in trauma work.


    Traumatic, reflexive responses aren''t logical or cognitive. They happen in the
    body, which is hardwired to protect itself and recognize danger, whether it''s
    emotional or physical, or perceived real.


    From a survival standpoint, this is a crucial ability. If you''re walking through
    the woods and suddenly a bear appears, your thinking mind won''t operate fast
    enough to process the danger. Instead, your body will respond automatically. Suddenly
    you''re running away, even while your thinking brain is going, *Huh? Why the hell
    am I running away?* And then a second later it realizes, that was a bear.


    Because the body is fast but not logical, it may decide that something is dangerous
