  md: '# Praise for Monsters in Love


    “Monsters in Love delivers one truth bomb after another. Busting the myth that
    surface harmony is the sign of a good relationship and that fiery conflict is
    the mark of one on the brink, this book makes the case that learning to master
    conflict is the only way to have a healthy intimate relationship that lasts. Consistent
    with the messaging in the brilliant Somatic Abolitionist books My Grandmother’s
    Hands and The Quaking of America, Resmaa helps us see the only way we can stand
    for true, whole-hearted integrity (and hold our intimate partners accountable)
    is to condition our nervous systems to tolerate the heat of healthy conflict without
    collapsing or bullying our beloveds. My partner and I ate this up and are already
    practicing being monstrously with each other. The best relationship book I’ve
    read in a decade.”


    Lissa Rankin, MD, New York Times bestselling author of Mind Over Medicine and
    Sacred Medicine


    “We live in a therapy culture, where the focus often is on nurturing, decreasing
    the heat, and eliminating conflict. In a manner similar to his bestselling books
    on healing racial trauma in a divided culture, Resmaa shines his bright light
    on intimate relationships and shows how to go beyond standard approaches, grow
    up, and truly become back our best selves. This is about becoming adults who can
    both give and receive with a level of depth and clarity that is profoundly refreshing,
    bracing, and ultimately both life-and-relationship-saving. An outstanding, unique
    contribution to our understanding of both the reality and the possibilities of
    deep intimacy.”


    Jeffrey Rediger, MD, MDiv, author of Cured'
