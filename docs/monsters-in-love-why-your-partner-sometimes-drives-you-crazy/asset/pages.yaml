  md: 'When a client in my therapy office says to me, “My partner isn’t giving me
    what I need,” I tell them, “Good. That means both of you are normal. If your partner
    did act like your surrogate mother, you’d both have a shitload of emotional work
    to do. It’s not your partner’s job to provide for when you''re hungry, or horny,
    or scared, or whatever you''re experiencing. It’s nice when they choose to do
    what you like, but it''s not their role or obligation. Because you''re an adult,
    you can''t—and shouldn''t—expect them to take care of you. Committed partnerships
    are about balancing the energies of autonomy and togetherness, not about people
    being surrogate parents to each other.


    I''ve also had clients who bounced from one partnership to another, looking to
    find someone who will fulfill all their needs. They spend years—even decades—nipple
    shopping, with (of course) no success. They come to thinking they need a better
    way to shop for the nipple but what they actually need is to grow up.


    One common variant on this theme is when people tell me that their partners abandoned
    them. This simply isn''t true. Adults leave each other. They don''t abandon each
    other.


    You can abandon a child, because a child doesn''t have the resources and abilities
    to feed themselves. When an adult leaves their partner, the ex-partner isn''t
    going to starve to death or be at a loss about how to navigate the world.


    If your partner leaves you, you''ll hurt—perhaps a great deal—but you won''t die
    or get swallowed by the world because of it.


    What we call a “fear of abandonment” is nothing more than normal fear and dread—of
    loss, of pain, of change, and of the unknown.


    And if and when your partner does leave you—or you leave your partner—this doesn''t
    mean you''re no longer an adult. So act like an adult: lick your wounds, pick
    yourself up, and move forward with your life.


    I am not advocating that you somehow get over your loss, or that you pick yourself
    up by your own bootstraps. The first is emotionally impossible; the second is
    physically impossible; and both are bullshit. I''m saying that each of us gets
    to grieve our losses—and that fully grieving makes us more human, not less. We
    must also be mindful that we may sometimes stay rather than grieve fully and move
    forward.'
