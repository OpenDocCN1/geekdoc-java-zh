  md: '# 24


    # What We Come into This World With


    Many different experiences and elements make us what we are: our life history,
    our biology, our psychology, our culture, our family of origin, and dozens of
    other influences.


    Most of us assume that these forces start to mold us as soon as we''re born. But
    that''s not true. They begin much earlier.


    We therapists often ask our clients about the circumstances in which they grew
    up. But we often make the mistake of starting our inquiry with birth.


    When a pregnant woman drinks alcohol to damage her fetus, the child may grow up
    with fetal alcohol syndrome, which creates a range of emotional, mental, and physical
    problems. Certain medicinal and recreational drugs can also cause lifelong damage
    to a developing fetus. But these aren’t the only chemicals that can have long-lasting
    effects on a child in a womb.


    # IMOGENE, KARYN,, AND RAYMOND


    Picture Imogene, a nineteen-year-old single mom-to-be in a rough part of Las Vegas.
    She''s healthy, takes good care of herself, and eats reasonably well. She doesn''t
    smoke, and during her'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'pregnancy doesn''t touch alcohol or drugs. But she lives on a dangerous block,
    surrounded by violence, street crime, and ongoing chaos. Her baby''s father has
    skipped town. She lives with her older sister, whose boyfriend is sometimes abusive.
    It''s a difficult and stressful environment.


    In response, Imogene''s body regularly produces lots of stress hormones, such
    as cortisol and epinephrine. Those hormones travel into her fetus''s bloodstream,
    and they affect their daughter''s developing central nervous system. As a result,
    from the time that baby girl is born, she may have certain sensitivities—or oversensitivities—to
    her environment.


    When Imogene''s daughter, Karyn, is two months old, and her mother move to a much
    safer, quieter neighborhood. Nevertheless, Karyn grows up a very distressed child
    who takes great care to protect herself. Whenever she goes someplace new, she
    immediately looks around for escape routes and places she can hide, if she needs
    to.


    Now let''s forward twenty-five years. Karyn is living in suburban Atlanta with
    her fiancé, Raymond. They mostly get along well, but whenever Raymond gets upset,
    even slightly, Karyn withdraws, leaving the house to be by herself for a few hours.
    When he asks her what''s wrong, she usually says, “Nothing. Leave me alone.\ For
