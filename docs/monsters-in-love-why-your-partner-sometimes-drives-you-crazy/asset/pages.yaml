    sexual favors in exchange for not confronting them about a conflict or issue.
    In essence, they say to their partner, Give me the sex I want, and I''ll leave
    you alone about the difficult parts of our relationship.


    Using sex to lower the heat in a relationship may work for a while, but it never
    succeeds in the long term, because it does nothing to resolve the unavoidable
    conflict. This conflict is not about the particular relationship or the specific
    people in it. It’s baked into the dynamics of having someone else matter.


