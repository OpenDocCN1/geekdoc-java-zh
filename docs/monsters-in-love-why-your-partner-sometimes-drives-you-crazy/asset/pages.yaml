  md: '# Acknowledgments


    I would like to first thank my mentors; I am grateful and privileged to stand
    on their shoulders.


    The late Dr. David Schnarnach was the author of Intimacy and Desire, Passionate
    Marriage, and Resurrecting Sex, and the founder of Crucible Institute (crucibletherapy.com).
    Some important terms, insights, and concepts in this book are his; other key concepts,
    and the diagrams in chapter 3, are partly no have written this book without his
    mentorship. He combined a randy sense of humor, a sometimes-hard exterior, an
    engineer''s mindset, deep insight into the human heart, and the ability to do
    amazing work with couples. I have never met anyone remotely him. Over the years,
    I grew to love and admire him deeply and trust him enormously. He often said to
    me—tweaking the words of Pierre Teilhard de Chardin—“We are energy having a human
    experience."


    Dr. Schnarch died in October 2020, while I was working on the updated and expanded
    edition of this book. His death is a profound loss for the world, for the field
    of psychotherapy, and for, course, me.


    Dr. Schnarch did not do any of this work alone. His wife Morehouse, whom I respect
    and love immensely, was a close collaborator. Both of them were supported, assisted,
    and loved by their daughter, Sarah Morehouse. We never do this work by ourselves.


    The late Dr. James Maddock—professor emeritus at the University of Minnesota,
    founder of the University of Minnesota Medical School''s Program in Human Sexuality,
    and former president of the American Association of Sexuality Educators, Counselors,
    and Therapists—also taught me a great deal about how relationships work well.
    Dr. Maddock combined constant kindness and generosity with a complete refusal
    to tolerate bullshit. I''ve integrated some of his deepest insights into this
    book,'
