  md: '# 29


    # Resistance and Ambivalence


    All of us want to change for the better. At the same time, we don''t want to change
    at all.


    Sometimes, as you make a move toward growth, your partner will support you. Sometimes
    they''ll resist you. Sometimes they''ll do both at once.


    Sometimes when they do support you, you''ll resist that support.


    Sometimes, when your partner makes their own move toward growth, the same dynamic
    will occur with the rules reversed.


    When your partner sees this ambivalence and resistance in you, it drives them
    half crazy. Meanwhile, you see the same resistance and ambivalence in them, and
    it drives you half crazy.


    Yet—as you now know—nothing is going wrong. Resistance and ambivalence are normal
    in committed relationships. In fact, they''re extremely beneficial, because they
    help us make important decisions about who we want to be and how we want to live.


    Ambivalence isn''t problematic or painful when little is at stake. If you and
    your lover can''t decide which romantic comedy to see, or which tree to have a
    picnic under, you''re probably ambivalent because the choices aren''t that different.
    You could choose by flipping a coin. Either result would probably work out fine.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'But when we struggle with something important or difficult, we''re ambivalent
    because there''s so much at stake. The wrong choice can create a deep wave of
    pain.


    Usually when we''re ambivalent, our first inclination is to make a quick choice
    in order to lower the heat on ourselves.


    I tell them, "Hell, no. You''re sitting in uncertainty and it''s turning the heat
    up on you. Now you''re telling me that you want to lower that heat by making a
    premature decision. But if you do, something important won''t have a chance to
    cook, and you''ll deprerive yourself of an opportunity to transform.


    > "Instead of looking for a quick and direct way to resolve your ambience


    > "I don''t know where this is going to take you any more than you do. But I know
    that there''s no way to run around what you''re facing. Together, you''re going
    to live into and run through it. That''s your only clean option."


    Resistance is inherently good nor bad, right nor wrong. What''s important is where
    it comes from and what its purpose is. When it comes from a strong part of you—for
    example, when you resist your lover''s desire to overspend—it supports your partnership
    and your commitment to each other. It may also lead to an important emotional
    bottleneck.


    But when it comes from a weak part of you—if you''re afraid of being poor that
    you resist your lover''s plans for an affordable getaway—then it can create unnecessary
    conflict and dirty fight. This may also lead to an important emotional bottleneck.


    Any time you have the impulse and opportunity to grow, you''re going to face an
    equal amount of resistance. Some of it may come from inside you. Some may come
    from your family, friends, neighbors, coworkers, culture, or religion. Some of
    it may come from your partner. The more'
