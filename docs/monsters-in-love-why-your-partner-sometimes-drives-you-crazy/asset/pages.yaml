  md: '# 25


    # Trying to Get Milk from a Coke

    Machine: A Dialogue with James

    Maddock


    The late Dr. James Maddock, one of my mentors, knew more than almost anyone about
    the realities of committed relationships. He often expressed these realities in
    pithy and memorable ways. (“The rocks in your head fit perfectly into the holes
    in your partner’s”) is one example.)


    He also had his share of eccentricities. He had a thing about wizards; his office
    was full of wizard pictures and figurines, and whenever we''d meet, he''d be holding
    a mug of tea with a wizard painted on it.


    Doc, as I called him, was privileged to have had the famous psychiatrist

    Dr. Milton Erickson as his mentor. Dr. Erickson was truly a wizard of

    therapy, and Doc’s way of remembering and honoring him was through

    wizard collection.


    Dr. Maddock himself looked nothing like a wizard. He looked like

    musician John Denver, with sandy brown hair and a white beard.


    In Doc’s coaching sessions with me, I always knew we were onto

    something important when he’d slump in his chair, look down at his mug,

    and slowly unwrap the string of the tea bag from the handle. Then he’d look

    up and say something that would perfectly nail what was going on.'
