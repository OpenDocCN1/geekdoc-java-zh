  md: 'When you and your partner are looking at each other and wondering how the hell
    you''re going to make it through uncharted waters together, that''s when being
    fully present can help the most.


    Some foundational practices for being present are what I call primal reps: small,
    simple movements that make us more aware of our bodies and of the energies that
    move through them.


    These are not new-age practices developed by a yoga or meditation master. They''re
    exactly the opposite: age-old (i.e., older than the human species) practices built
    into our bodies. They''re also built into the very fabric and flows of the universe.


    In chapter 35 you read about life reps and invited reps—opportunities for using
    the five anchors to build discernment, resiliency, and connection. Primal reps
    are much briefer and much more basic. You practice them almost entirely bodily,
    with minimal cognitive direction.


    Primal reps serve a deeply valuable purpose. Over time, they can temper and condition
    your body so you can be more present to it; so it can better handle the weight,
    charge, speed, and texture of conflict; so you are more able to accept, experience,
    and metabolize clean pain and discomfort, and so you can grow up.


    Primal reps help your body become a container in which emergence can take place.
    When you and your mate both practice primal reps regularly, they also help your
    relationship become such a container.


    Most of these primal practices are things your body does naturally. In fact, as
    you''ll see, some of them are things that many living creatures, from lower primates
    to fish to single-cell organisms. These practices tie us back to creation. Each
    time you do a primal rep, you express the universe and your full participation
    in it.


    I''ll list and describe seventeen of the most common such practices below. I suggest
    doing any practice you choose for three breaths at a time, while noticing what
    you experience in your body. Three breaths equals one rep.


    A single rep should give you enough time to pause, focus, and notice what your
    body is experiencing. But if your body wants to do more than one rep—and if that
    creates positive sensations and energy—then by all means more.


    If a particular primal practice is painful for you, don''t do it.'
