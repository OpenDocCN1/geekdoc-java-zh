    # The Brightened Self


    If a couple reaches critical mass and chooses to accept the pain of growth, a
    profound shift can occur.


    This shift is neurobiological—not just mental and not just emotional. The whole
    body''s energy realigns. The person''s eyes focus and brighten. Their spine straightens.
    Often they stand or sit straighter, or lean forward. They make direct eye contact.
    Their voice becomes clear and assured. Their energy is strong and vibrant, or
    calm and quiet but full of commitment. Their entire body undergoes a profound
    vibratory change.


    This shift is sometimes called the brightening of self.


    A brightening of self occurs when someone makes a leap. Suddenly they know, deep
    in their body, who they are, what they experience, what they stand for, and, often,
    what they need to do. The look in their eyes says, I''m here. I''m fully present.
    And what''s going to happen from now on isn''t going to be happened before.


    I see this brightening regularly in my therapy office. I see it when one lover
    takes the other''s hand and says, "Honey, I love you to death, but I''m not going
    to let you emotionally hurt me or our children again. Ever." I see it when the
    man who has never stood up to his in-laws tells his partner, "I know how important
    your family is to you, but I''m done shifting from them." I see it when a woman
    whose fiancé has been sexually unresponsive for two years says to him, "You know
    what? I''m not following you around'
