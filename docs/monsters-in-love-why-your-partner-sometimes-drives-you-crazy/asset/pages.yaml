    # Collaborative and Coercive Alliances


    Power is the ability to influence. Control is the ability to regulate and/ or
    shape that influence.


    This may not seem like an important distinction. But it''s the key to understanding
    the ecology of many committed partnerships.


    Power people make things happen. They move. They act. They mobilize. They break
    through. They often break rules.


    Control people make things work. They organize. They manage. They strategize.
    They coordinate. They devise and enforce the rules.


    Properly used, power and control can each support and strengthen an intimate relationship.
    (Much more on this in chapter 33.) But when either is misused, it can seriously
    undermine that relationship.


    Every partnership is an alliance. It can either be collaborative—based on love,
    trust, and respect—or coercive, based on manipulation and the misuse of power
    or control.


    Growth simply cannot happen in a coercive alliance.


