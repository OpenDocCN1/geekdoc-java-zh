  md: '# COMPASS POINTS


    +   • Therapy never succeeds when people run for cover rather than learn to tolerate
    heat, clean pain, discomfort. But there are six other common causes of couples
    therapy that fails:

    1. Therapists who believeagainst all evidence—that the key to healing and growth
    is cognitive insight.

    2. Therapists who encourage clients to focus on the weakest parts of themselves.

    3. Therapists who force their ideas or beliefs onto their clients.

    4. Clients who make preemptive strikes.

    5. Clients who therapist-hop.

    6. Therapists who suck—or mistreat their clients.


    +   • When working with (or considering working with) any therapist, don’t just
    trust the credential on the wall. Listen to what your body tells you about them.
    If you like, comparison shop.


    +   • A wise therapist will help you heal and grow up. Don’t settle for someone
    who is less than wise.'
