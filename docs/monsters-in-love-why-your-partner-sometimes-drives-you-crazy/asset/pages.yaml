  pgno: 220
- img_proc: true
  md: 'recently received as a birthday gift from her best friend. Since then, Meg
    has kept her mugs separate from all their other dishes, and she insists that Jean-Pierre
    never touch any of them.


    Since that day nine years earlier, Jean-Pierre has been deliberately over-careful
    when he handles any of Meg''s other favorite possessions. This annoys her almost
    much as when he shattered her mug.


    A few months after the broken-mug incident, Meg and Jean-Pierre went to her parents''
    home for Thanksgiving dinner. As Jean-Pierre''s father served them, Meg saw that
    his toupee was starting to slide down one side of his head. She quickly said,
