    Strangely, it''s the result of enormous progress.


    # How We Get Here


    Commonplace physical cruelty is as old as our species. So is *uncommon* physical
    cruelty—rape, murder, torture, and enslavement.


    Today, those four crimes continue to be routinely practiced in parts of the world.
    Over time the faces and places change, but overwhelmingly, the people who commit
    these crimes are men and the victims are women.


    We think that in the United States we''ve crawled out of such a primitive, lawless,
    immoral, male-dominated approach to life. And we have—mostly.


    Today, 15 percent of women will get raped at least once. A third of women murdered
    in the United States are killed by their male partners.'
