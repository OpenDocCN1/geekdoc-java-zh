  md: '# 30


    ![](img/f0331d8dc5a59fa7731641cfdc004eec_231_0.png)


    # Changing without Growing


    There is a fundamental difference between changing for the better and ngrow up.


    I see this all the time in my therapy practice. I have clients who have stopped
    beating on their partners, or drinking, or drugging, or prowling the bars for
    late-night hookups. I acknowledge all of these positive behavioral changes. But
    that doesn''t mean the people who made them have grown up.


    The dry drunk is a classic case. They''ve stopped drinking, but they haven''t
    changed their way of being in the world. They still live according to an addict''s
    mentality. Often they get addicted to recovery, obnoxious preaching the gospel
    of the Twelve Steps to everyone they meet.


    Also common is the formerly violent partner who has learned to pound a punching
    bag, or a pillow, or a keyboard instead of their partner. While they may no longer
    be a physical threat, they may not have grown much at all.


    In both these cases, and countless others, people improve their behavior, but
    their fundamental way of being in the world remains the same. They make healthier
    choices, but they don''t choose to take themselves on and grow up.


    We often settle for these behavioral changes from our partners because things
    become so much better than how they used to be.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'But these changes are not enough. You don''t have to settle for them in your
    partner. And you don''t have to settle for them in yourself, either. Demand nothing
    less than continued growth from both of you. That''s why the two of you are together
    in the first place.


    Most of us want our partner to grow up, but we don''t want to grow up ourselves.
    Instead, we make some changes for the better and hope we can squeak by. But if
    our partner is alert and maintains their integrity, they won''t let us do it;
    they’ll continue to demand the best from us.


    If you stand in your own integrity, you won''t let your partner squeak by, either.


    If the two of you come to an unspoken agreement that you''ll both settle for improved
    behavior but no transformation, what will out. Many of your earlier issues will
    magically reappear. Before you know it, the two of you will be back in an emotional
    bottleneck.


    When you find yourself there, all the sobriety and physical safety in the world
    won''t get you out there. There''s no healthy alternative to sailing into the
    uncertain waters of clean pain and discomfort.


    What it takes to actually grow up and transform is very different from what it
    takes to simply change for the better. The two of you have to face continued heat
    and pressure until you reach critical mass. Then and only do you go through a
    fundamental, alchemical transformation.


    This is why holding on to yourself by using the five anchors is so important.
    They keep you from blowing apart, or folding up, or running away when the pressure
    and heat reach their peak. (Or, if you do blow apart, fold up, or run away, they
    can help you the next time a high-pressure situation unfolds.)


    Each time you and your partner make it through an emotional bottleneck, there’s
    a sense of relief. For a time, the energy between you may more strongly align.
    You may think, Whem. I’m glad that’s over.


    Yes, the particular conflict may be over. But the two of you will soon face a
    new difficulty or conflict or conundrum. (When this happens, nothing is going
    wrong.)


    That''s why you need to make an ongoing commitment to growth and change—and to
    encouraging growth and change in your partner.'
