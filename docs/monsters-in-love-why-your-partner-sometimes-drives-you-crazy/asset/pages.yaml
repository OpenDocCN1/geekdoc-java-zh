    that’s not how life works. Emotional nourishment comes from growing up.


    The quest for fulfilling our emotional needs can be endless. We can get stuck
    on a hamster wheel, chasing one of fulfillment after another.


    People who build their lives around meeting needs tend to be anxious, fearful,
    and frustrated. In contrast, people who have accepted the clean pain and discomfort
    of growing up have a relaxed readiness and an easy confidence about them. Their
    focus is not on acquiring fulfillment, but on being fully present. Because of
    presence, whatever happens has the potential to be emotionally nourishing.


