  md: '# 18


    # The Big Four


    Therapists often say that the four biggest sources of conflict in any committed
    partnership are money, sex, kids, and in-laws.


    Although this is true, the deeper issue is that most couples—and most therapists—approach
    these conflicts as problems to be solved. But most of these dilemmas cannot be
    solved tactically, strategically, or according to a blueprint.


    They are the four big things and your lover can’t easily compromise around. They
    are also the biggest ongoing sources of pressure in couples’ faces, day after
    day. As a result, they create some of the biggest and most frequent opportunities
    for growth.


    This is true even when the conflicts originate outside the relationship.


    # CHEN, BROCK, AND DAIYU


    Chen and Brock are concerned about Chen’s ninety-three-year-old mother, Daiyu,
    who lives on her own in an apartment. For years, Chen and her husband have implplored
    Daiyu to move to an assisted-living apartment, but Daiyu always refuses.


    Daiyu smokes two packs of cigarettes a day and often smokes in bed, even though
    Chen and Brock have repeatedly urged her not to.'
