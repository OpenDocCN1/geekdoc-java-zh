  md: 'Otherwise, there are only two other general guidelines: do primal reps often,
    and do them for as long as you live.


    **Pausing and noticing.** Simply stop what you’re doing. For three breaths, sit
    or stand still. Notice what sensations arise in your body.


    **Orienting.** Slowly turn your head, first in one direction, then the other,
    until you''ve scanned a 360-degree circle. This should include briefly looking
    behind you. Notice any colors or shapes that stand out. Note any sounds you hear,
    any aromas you smell, any warmth or coolness. Many people do this daily, when
    they first get out of bed and stand.


    **Entering and leaving.** When you walk from one room into another—from indoors
    to outside, or vice versa—pause for three breaths. Orient yourself, then notice
    what changes your experience in your body. (You can also do this when getting
    in or out of a car, on off a bicycle, into or out of an elevator, etc.)


    **Grounding.** Notice the outline of your skin and the slight pressure of the
    air around it. Experience the firmer pressure on the chair, bed, sofa, floor or
    beneath you. Then pause and notice what else you experience in your body—pressure,
    constriction, release, pleasure, pain, etc.—and where you experience it.


    **Starting.** Starting at the top of your head, slowly bring your attention down
    through your body. Notice each sensation as your attention passes through: coolness,
    warmth, relaxation, tightness, numbness, pressure, release.


    **Wiggling¹.** Wiggle your whole body using your spinal column, from your neck
    through your hips, the way a fish wiggles.


    **Pumping.** Using your hips and knees, gently pump your body and down.


    **Curling your spine.** Push out your chest and belly, curling your spine forward.
    Then pull your spine back and your shoulders forward, so that your upper body
    curls in the opposite direction.


    **Swaying.** Using your hips and while staying balanced—sway from side to side,
    or forward backward.


    **Touching.** Place your hand on any part of your body that asks to be touched.
    Let your hand rest there for three breaths. Notice what you experience in that
    part, in your hand, and in the rest of your body.'
