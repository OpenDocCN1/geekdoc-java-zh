  md: 'In many cases of transformation, cognitive insight is absent entirely. People
    suddenly know in their bodies what they need to do, without understanding why.
    Or something simply seems right or wrong to them, even though they can''t explain
    it or verbalize it.


    It''s essential to take this form of knowing seriously, and not to dismiss it,
    override it, or overrule it with questions or doubts. These bodily sensations,
    which are often called intuition or vibrations or vibes, are essential to understanding
    ourselves and each other.


    If you''re not sure what you think about something, consult your body. Where is
    there tinnitus or rigidity? Where is there fluidity or relaxation? Where is there
    pain? Where is there heat? Is it pleasant or unpleasant? Gently move your attention
    into that sensation, as if you''re getting into a bathtub. What images and thoughts
    arise as you do this?


    An entire branch of psychotherapy is built around awareness of the body. It''s
    usually called somatic psychology, or body psychotherapy, or some other variation
    of those terms. This form of psychology doesn''t dismiss thinking or cognitive
    awareness. It simply says, Look to your body first.


    Our bodies are organic antennae and amplifiers, constantly broadcasting, receiving,
    and boosting a variety of signals. We''re all familiar with the vibes we routinely
    broadcast to strangers: I''m friendly. I''m busy. Come here. Leave me alone. Hurry
    up. I''m scared. I1 want you. Help me. Back off, Jack! These vibratory messages
    are clear, simple, honest, and direct.


