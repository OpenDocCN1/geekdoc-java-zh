- img_proc: true
  md: 'rather than “That seems right to me,”


    People with strong power leanings usually find partners who have strong control
    orientations—and for good reason, because they often have difficulty controlling
    or managing their impulses. But, of course, when their partner tries to control
    them, they get pissed as hell.


    What people with extreme power orientations most need to develop is self-control.


    In contrast, somebody with an extreme control orientation spends a lot of time
    pondering, considering, and worrying. But they don’t often act—and when they do,
    it rarely involves something new, different, or challenging.


    Control people usually have strong emotions and opinions about everything—especially
    their partnership, their partner, and their partner’s behavior. They spend much
    of their time correcting or commenting on what their partner does.


    People with very strong control leanings usually experience themselves as powerless,
    so they find partners with strong power orientations. The partner brings to the
    relationship a sense of purpose and effectiveness, and an ability to get things
    done. But, of course, the control-oriented person instinctively does everything
    they can to regulate these very qualities in their partner.


    What people with extreme control orientations most need to develop is motivation:
    a willingness and ability to act.


    As with all rocks and holes, power has a control underbelly, and control has a
    power underbelly. But when someone with an extreme control orientation accesses
    their power, they can easily misuse it at first. The same is true when someone
    with an extreme power orientation begins learning to use control. They’re both
    like Frankenstein’s monster learning to use his limbs for the first time.


    # When Leanings Turn Cruel


    When there has been physical cruelty in a committed relationship, often it’s because
    at least one partner has an extreme leaning toward either power or control.


    A talented therapist can help the couple examine this issue, unhook it, and create
    a more evenly balanced relationship.'
