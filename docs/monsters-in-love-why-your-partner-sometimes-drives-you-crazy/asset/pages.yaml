  md: '# 4

    Double Binds in Committed Relationships


    Committed relationships are naturally rife with double binds: choices in which
    all options seem to be risky, painful, and uncertain.


    Each double bind forces both lovers to examine and reexamine they consider important.
    It also tests their integrity in a real situation, in real time, with someone
    they care about.


    Each double bind appears to present itself this way: If I choose A, I''ll be unhappy;
    if I choose B, I''ll also be unhappy; and if I don''t make a choice, I''ll also
    be unhappy. All choices appear to lead to pain. And often they will. But usually
    at least one choice involves clean pain and discomfort, which will help the person
    build resilience and discernment—and which may lead to greater freedom and intimacy
    on the other side of that pain.


