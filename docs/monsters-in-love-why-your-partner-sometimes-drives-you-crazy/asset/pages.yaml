    If you believe your partner is a sociopath or grandiose narcissist, take your
    situation very seriously, and consult with a therapist as soon as you safely can.
    If necessary, call the police.


    # Where We Draw the Line


    It’s essential that we draw a bright line between ordinary human monsters who
    become briefly physically cruel and people with serious personality disorders.
    That’s not where the line currently gets drawn.


    Instead, our culture—including the vast majority of mental health professionals—draws
    a single bright line between all people who have been physically cruel and all
    who have not. The person who slaps or pushes or grabs their partner in the heat
    of an argument, even once, usually gets dumped into the police into the same category
    as the sociopath. Someone can be as emotionally and spiritually cruel as they
    please, and they’re often considered decent and normal. But anyone who is in any
    way physically cruel is suddenly an irredeable villain and a beast. In this common
    view, the only thing separating you and me from the Boston Strangler and Jack
    the Ripper is a grab or a shake.


    Of course, anyone who becomes violent needs to be fully accountable for their
    actions—and to face serious negative consequences. My point here is not that violence
    is sometimes justified, but that we don’t have a cultural mechanism for discerning
    the many different trajectories that can lead to violence.


    It gets worse. Many incidents of physical cruelty in couples never get reported
    to the police. As a result, the person who regularly punches their partner but
    never gets busted for it is considered an upstanding citizen,'
