  md: 'In my office, people tell me, “I don’t know what happened. As soon as we got
    married, my partner changed.” That’s right. As soon as the two of you made a commitment
    to each other—either through a ceremony, a legal document, or an emotional choice—they
    changed, you changed, and everything changed. As soon as you said, “I do” or “I’m
    yours,” your options shrank and the pressure on you rose. Neither of you did anything
    wrong. All you did was choose each other.(Or one person chose the other, and that
    person went along with the choice. But the results are the same).


    Here’s what’s happening:


    In your cortex, thinking brain, you love your partner. But beneath your cortex,
    toward the back of your skull, is a part of the brain that we humans share with
    Godzilla. This back part of our brain—our lizard brain—only understands protection:
    fighting, fawning, fleeing, annihilating.


    Your back (and remember, your brain is very much a part of your body) loves whatever
    protects you and hates whatever you vulnerable. This part of your brain hates
    your lover because you’re vulnerable to them. That same part of your partner’s
    brain hates you for the same reason. To your lizard brains, your love for each
    other is an ongoing source of stress.


    In immature relationships, hatred and resentment usually grow over the years.
    The closer you and your partner get, the more vulnerable you become to each other,
    and the more scared your lizard brain gets. Ditto for your partner’s. Its logic
    goes like this: I hate you for loving me and making me vulnerable. If you really
    loved me, you wouldn’t make me vulnerable by loving me. The fact that your partner
    makes you happy makes your Godzilla unhappy.


    The paradox of intimacy is that the more important someone becomes to you, the
