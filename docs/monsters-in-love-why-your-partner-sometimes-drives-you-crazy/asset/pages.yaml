    In the comic strip Peanuts, when Lucy promises Charlie Brown that she’s not going
    to pull the ball away he runs up to pick it, he knows perfectly well what’s going
    to happen. She’s going to do exactly what she’s done before: pull the ball away
    from him. Even though she says, “I promise not to do it this time,” both of them
    know exactly what that means: Of course I’m going to do it this time, just like
