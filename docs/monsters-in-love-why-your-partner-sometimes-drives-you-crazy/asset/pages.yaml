    # When Therapists Cop Out


    This chapter will seriously piss off many of my colleagues—and delight some others.
    But I''m not trying to anger or please anyone. And I''m very aware that I, and
    my insights, are not for everybody. Still, I''m simply saying what urgently needs
    to be said—which is this:


    If a therapist reflexively helps you and your partner turn down the heat in your
    relationship, they''re being negligent—and leading the two of you astray.


    The things that create conflict for you and your lover are the very things the
    two of you need to lean into, because they''re tied to your integrity. Your conflict
    needs to cook—and you can''t cook without heat.


    A good therapist won reflexively try to turn down that heat. Instead, they''ll
    help you and your partner learn to modulate it and navigate through it. They can''t
    do this unless they know how to navigate that heat themselves. In their therapy
    office, they may sometimes modulate that heat, like a good chef, for the benefit
    of their clients—but they reflexively turn it down and then pretend they''re doing
    it for their clients'' safety.


    When clients get stuck in an emotional bottleneck in a therapist''s office, the
    therapist needs to be able to hold on to themselves, stay present and connected,
    and help their clients get through the bottleneck together. This is especially
    true when people are screaming and cursing at each other, squaring off like wrestlers.'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'Good therapists have fortitude, and they aren’t afraid to use it in service
    of their clients’ growth.


    A therapist’s job is to push clients to grow up. But some therapists are wimps.
    They’re not willing to confront themselves and do their own painful internal work,
    so they don''t demand hard work from their clients.


    Instead, they teach clients techniques for lowering the heat in their relationships.
    That may make the relationships less rocky, but it also keeps both partners from
    growing up.


    Most therapists demand from their clients exactly what they demand from themselves.
    As a result, a therapist’s limitations often line perfectly with those of their
    clients. The therapist takes the client only as far as the therapist is willing
    to go. It’s a version of rocks and holes. Because they can’t see beyond their
    own beliefs, fears, and limitations, the therapist doesn''t push their clients
    far enough,³³⁴ and the job remains incomplete.


    When someone is losing their mind in a therapist’s office, rocking the therapeutic
    boat like crazy, the therapist needs to straighten their spine and stay.


    I’m not saying therapists to be fearless. Sometimes we get scared, especially
    when people act like they may pull a knife or throw a punch. There have been times
    in my office when I’ve slowly reached into my pocket and clutched my phone, ready
    to dial 911. (So far, dialing that number hasn’t been necessary.)


    But in the heat of these moments, my fear is none of my business. My business
    is to hold on to myself, so I remain connected with the human beings in my office
    as events unfold, and as we move into the unknown together.


    When therapists cop out, they typically use their professional authority to cool
    down everyone in the room—all in an effort to create a sense of safety for themselves.
    Here are their most common strategies:


    +   They refocus the client on some concept, theory, name, or term.


