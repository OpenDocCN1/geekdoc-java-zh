  md: '# 9

    Integrity Appears at the Most Difficult Times


    Committed relationships force each of us to develop integrity—or flee from it—in
    the context of being connected to someone we care about.


    Most of us don''t understand how integrity works. We think it''s about respectfully
    confronting someone else—our lover, our boss, our family, our culture, our government,
    or our religion.


    That''s only looking at integrity''s most visible pieces. Much more goes on beneath
    the surface.


    When people get a glimpse of the Loch Ness Monster, all they see is its head and
    neck. Most of the creature is actually under water, keeping it upright and balanced.¹¹²
    Integrity is similar: its less-than-obvious (and often unseen) aspects are what
    give it its transformative power.


    Integrity emerges from the energy of creation itself. This emergence and expression
    through us is a natural process. Often, however, there are energies stuck in our
    bodies—and in our larger culture, systems, and structures—that thwart integrity’s
    emergence. This thwarting can have its own purpose and value: it can push us into
    critical mass and double binds, so that integrity can emerge. This is an unpredictable
    but elegant process—and, when it unfolds, nothing is going wrong.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'In your partnership, integrity is mostly about confronting yourself. It pushes
    you up against your own fears, issues, and limitations, and challenges you deal
    with them. No matter what moves you make with your partner, and no matter why
    you make them, your interlocking issues will force each of you to make a choice:
    respond from the strongest parts of yourselves or from the weakest, damaged parts.


    Integrity appears when there is conflict or stress. It doesn''t take integrity
    to do the right thing when nothing stands in your way. Boycotting Walmart doesn''t
    require any integrity if there''s a Target next door. Staying faithful to your
    partner is easy when you''re getting along well and having lots of good sex. But
    when your lover tells you, “Don’t even think of screwing me until you start acting
    like a father to your own kids,” it takes integrity to stay faithful—and to stay
    connected and calm in the heat of the moment.


    Integrity shows up at times when it''s difficult or impossible for you to compromise,
    because the things that you''re asked to compromise are important to you—closely
    tied to your sense of who you are.


    Integrity appears when you do the right thing in the face of serious trouble or
    opposition. And integrity always has a cost.


    Instead of confronting ourselves, many of us try to blow our issues or painful
    emotions through our partners. We usually do this through blame, or manipulation,
    or coercion, or even violence. None of these ever works; they only deepen the
    problem, creating new ones and producing dirty pain.


