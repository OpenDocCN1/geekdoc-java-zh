  md: '# 3


    # Not Hurting Is Not an Option


    When you and your mate were first dating, you provided each other with blessed
    relief from the rest of your lives. The two of you created a bubble outside of
    the daily grind. In this bubble, you could enjoy each other and be safe and happy.
    When you and your lover were together inside your bubble, it probably didn’t matter
    much that your job sucked or your relatives drove you crazy.


    When the two of you chose each other, you both assumed that you’d naturally continue
    to enjoy this bubble. Whenever you needed a break, the two of you could slip into
    it and catch your breath.


    But that’s not what happened. Instead, the bubble disappeared. Suddenly, all your
    own issues and conflicts were in your face—and so were your partner’s. Worse yet,
    many of your partner’s problems made your own problems more difficult.


    You thought that once you were married, the two of you would sail together in
    a single boat, navigating through life as a team. Instead, you found yourself
    in two separate canoes, side by side. Each of you has to navigate, steer, watch
    for rocks, and avoid the shallows. Each of you also has to coordinate with the
    other so that you stay close without colliding. Sometimes this is easy, but often
    it’s frustrating or exhausting.


    Welcome to the perils and possibilities of a committed relationship. The friction
    and frustration the two of you experience—and the betrayal,'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'confusion, and grief that often accompany it—are just what you need to experience.
    All are potential sources of growth and transformation.


    If you and your mate are like almost everyone else, you want a partnership that
    will ease your pain, not increase it. But in committed relationships, not hurting
    isn’t an option. In fact, paradoxically, the only way to ease your pain is to
    accept it, work with it, and use it as fuel for growth. By leaning into your pain
    you can move through it and out of it.


    In dealing with the inevitable pain of intimacy, and you and your partner have
    a choice:


    You can accept the pain and use it to activate the best parts of yourself. We
    can call this clean pain (or clean pain and discomfort). Clean gains metabolized
    when you make a leap and transform.


    The other option is dirty pain, in which a person responds from their most wounded
    parts. They become cruel, or conniving and gaslighting, or violent—or, more commonly,
    they physically or emotionally run away. It prolongs the dirty pain and deepens
    the conflict.


    Most people choose dirty pain most of the time, in part because they imagine that
    avoidance, or cruelty, will hurt less than leaping and transforming. But it always
    ends hurting more.


    Most people choose dirty pain most of the time for another reason: it’s more familiar.


    In dealing with the pain of intimacy, you and your mate can take either of two
    circular paths:


    The first—a path of clean pain and discomfort—is the growth cycle. This cycle
    can create a new level of trust, understanding, and intimacy for both partners.


    The second—a path of dirty pain that leads to distrust, harm, and sometimes, violence—is
    the commonplace cruelty cycle. This cycle deepens existing conflicts and often
    creates new ones.


    I call these sequences cycles, but what happens in each cycle doesn’t always move
    smoothly and predictably, like the cycles in a washing machine. Sometimes it’s
    just the opposite: you and your partner lurch forward, then stop, then lurch sideways,
    then stop, then inch forward. Sometimes you can seem totally in alignment with
    each other, and'
