    As adolescents and young adults, almost all of us live largely reacting reflexively
    to one perceived emotional threat after another. When kids in puberty mumble to
    their parents, "I hate you!", as they often do, they’re back brain. Most parents
    understand intuitively that their adolescent child can sometimes love and hate
    them. But we have a much harder time understanding this about our partners.


    As we get older, however, we learn to tolerate this ambiguity and metabolize our
    raw hatred toward our partners. This isn''t pathological. We all go through this,
    especially in our early romantic and sexual relationships.


    This part of your brain is hardwired into you. It never stops telling you, I''m
    vulnerable! I''m scared! Destroy Tokyo! It takes time and effort to metabolize
    the stress-response messages of your Godzilla brain and use your own situation
    as fuel for transformation.


    I said earlier that people with low self-awareness and low discernment can get
    stuck in these messages. I don''t just mean adolescents and young adults, or people
    living in violent or war-torn neighborhoods. I also mean you and me, when we''re
