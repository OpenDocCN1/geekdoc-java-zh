  md: 'coming from the past rather than the present—or from trauma rather than from
    trust.


    In these situations, each lover can use the five anchors to move into and through
    the conflict:


    +   1. Soothe and resource themselves to quiet their mind, calm their heart, and
    settle their body.


    +   2. Pause, and notice the sensations, vibrations, and emotions in their bodies,
    instead of reacting to them.


    +   3. Accept and tolerate the discomfort instead of trying to flee from it.


    +   4. Stay present and in their bodies as they move through the unfolding experience,
    with all its ambiguity and uncertainty, and respond from the best parts of themselves.


    +   5. Metabolize any energy that remains.


    Because we use our mind-maps all the time, it''s easy to forget that they’re maps.
    But reality will help keep us honest. As soon as the map in our head stops reflecting
    how things are, we''ll know it, because we''ll be surprised, shocked, or confused.


    The mental map we have about our partner needs to be solid enough we don''t have
    to reinvent our relationship with them every morning. But it also needs to be
    flexible enough to adapt to a changing reality. Our map of our partner needs to
    be like a healthy spine: solid, yet flexible. It also needs to be updated frequently
    with new information, as that information emerges.


