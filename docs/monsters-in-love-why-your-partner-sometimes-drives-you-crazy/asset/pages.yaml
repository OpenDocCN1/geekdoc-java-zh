- img_proc: true
  md: '# The Integrity of Confronting Yourself


    Self-confrontation takes place mostly in the body, and it always involves metabolizing
    pain: fully experiencing, discerning, accepting, and moving through it.


    For that pain to be clean instead of dirty, you need to learn how to hold on to
    yourself, not your partner, in the midst of conflict and uncertainty. Your partner
    needs to learn the same thing. Each of you also needs to learn to lick your own
    wounds rather than try to blow your pain through your lover.


    In addition, each of you needs to learn to tolerate the other’s emotional pain.
    Often when we see our partner hurting, we get anxious. Then, to ease our anxiety,
    we try to soothe their pain, or tell them they shouldn’t blame themselves for
    getting into trouble. We can’t tolerate our own discomfort around their pain,
    so we make things worse by blowing our anxiety through them.


    But dealing with your anxiety—even if it grows out of empathy with your partner—is
    your responsibility, not theirs. You need to soothe yourself down, not stick your
    nose deep into your partner’s business.


    # Anchoring 101


    At the heart of self-confrontation are the five anchors. These enable you to slow
    yourself down so you can see what’s happening and make conscious'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'choices, rather than follow the dictates of your lizard or bee brain.


    As you know by now, the five anchors are:


    +   1. **Soothe and resource yourself to quiet your mind, calm your heart, and
    settle your body.**


    +   2. **Pause, and then notice the sensations, vibrations, and emotions in your
    body** instead of reacting to them.


    +   3. **Accept the discomfort** instead of trying to flee from it.


    +   4. **Stay present and in your body** as you move through the unfolding experience,
    with all its ambiguity and uncertainty, and respond from the best parts of yourself.


    +   5. **Metabolize any energy that remains.**


    When you first use the anchors in any new situation, you’ll normally employ the
    first four anchors in sequence. You soothe yourself in order to calm down and
    notice what you’re experiencing in your body. You become aware of your bodily
    sensations in order to accept them. You use this awareness as a baseline, so you
    can pull yourself back to the present when your brain starts to stray. This entire
    initial sequence may take only a few seconds.


    However, once you’re moving through the experience, you’ll find yourself practicing
    all four anchors at once, or moving back and forth among them.


    The five anchors are not tactical or technical. Their use is an art, not a science.
    They are not so much places to carry out as ways to live into uncertainty in real
    time.


    The more you practice these anchors, the more capable and comfortable you’ll get
    using them. Eventually they’ll become your natural first response to conflict
    or difficulty.


    Let’s look at the anchors in detail, so you practice them whenever the heat under
    you gets turned up.


    # Anchor 1: Soothe and resource yourself to quiet your mind, calm your heart,
    and settle your body.'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'In an ideal world, when a conflict starts to boil, you''d be able to leave
    the room, take ten deep breaths, meditate for five minutes, walk around the block.
    But in the real world, you''ll almost never have that kind of opportunity. In
    the heat of a conflict, you''ll be able to soothe yourself down quickly in order
    to move into the second anchor. Here are some ways to practice Anchor 1:


    +   - First and forget, shut up. For a few seconds, don''t say anything—no matter
    how much you might want to, or how much you have to say, or how loudly your partner
    is yelling. Just breathe.

    - If you''re holding something, let it go or put it down.

    - Sit down. Put your hands in your lap or on your knees.

    - Pause. Take a breath—or two or three.

    - Mentally tell yourself, Stay calm or Keep it together or (my own favorite) Calm
    the fuck damn.

    - Go to the bathroom. Say, “I need to use the john. I''ll be right back”; then
    go in and close the door. This nowy sounds silly. But in many situations, it''s
    the best way to get two minutes alone to catch your breath and move away or say,
    “I need to be alone for a minute,” your partner might come after you. But they
    probably won''t follow you into the toilet. (Be sure to return and reengage after
    a few minutes, if possible.)

    - Do something else to slow things down without dissing your partner or running
    away. Say, “Hang on, in this here,” and take off your sweater; take a long, slow
    drink from your mug; open or close a window; reach over and pet the cat.


    # Anchor 2: Notice the sensations, vibrations, and emotions in your body instead
    of reacting to them.


    This is the key to staying in here and now. Here are some ways to practice this
    anchor:


    +   - Pay attention to what your body experiences in your clothes. Notice how
    and where your body touches your underwear, your shirt, your pants, your skirt,
    your socks or stockings, your hat.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '+   - Notice any other body sensations: your back against the chair, your tongue
    against the roof of your mouth, the wind blowing against your face. Move into
    and name each sensation: heat, cold, tightness, relaxation, hollowness, looseness,
    weakness, trembling.


    +   - As thoughts and emotions and possible reactions arise, don''t run off with
