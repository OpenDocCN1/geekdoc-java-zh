    she’d been in and out of relationships all her life and that all of them had full
    of conflict. Now she had a new partner, Beatrice—a young woman about her age.
    The partnership wasn’t going any better than her previous ones.


    She and Beatrice were homeless. Bea had a job, but it paid just above minimum
