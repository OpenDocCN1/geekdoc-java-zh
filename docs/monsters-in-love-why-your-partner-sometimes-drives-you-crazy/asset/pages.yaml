  md: '# The Rock of Power and the Hole of Control


    We all need power people and control people in our lives. Without control people,
    life would be hopelessly chaotic. Without power people, it would be hellishly
    static and regimented.


    Power and control are a classic rock and hole. Without control, power is unfocused
    and ineffective. Without power, there''s nothing to control.


    As you''ll recall from chapter 12, power people make things happen. They act.
    They move. They mobilize. They break through. Often, they break rules.


    Control people make things work. They manage. They organize. They coordinate.
    They strategize. They devise and enforce the rules.


    No human being is solely a power person or a control person. Every sane person
    has both orientations inside them. It''s a classic both/and arrangement.


    But folks with the most serious internal power/control imbalances aren''t healthy.
    People with obsessive compulsive disorder lean way too far toward control. People
    who lean way too far power tend to end up as violent criminals, prison inmates,
    or corpses.


    Most of us have a distinct leaning in one direction or the other. That''s usually
    sane and healthy. It''s only the folks with the most extreme leanings'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'who run into trouble—and often create it.


    Many successful professional relationships involve a power person and a control
    person. Think of the celebrity and their agent or manager, the CEO and their COO
    and CFO, the chef and their prep cook, or the disc jockey and their engineer.


    Unfortunately, many therapists largely misunderstand power and control. They use
    the terms interchangeably, as if they were equivalents rather than two sides of
    the same coin. It''s a bit like thinking that therapist and the rapist mean the
    same thing.


    # Power and Control for Two


    In most committed couples, one partner leans more toward power and the other move
    toward control.


    If you''re a power-oriented person, you''re likely to get together with a control-oriented
    partner, and vice versa. Each of you brings to the relationship something other
    lacks.


    But when you exercise this complementary quality within your partnership, your
    partner may not like it one. When they exercise their complementary attribute,
    you probably won''t like it, either. You''ll recognize this as the inherent paradox
    of rocks and holes. And when it occurs, of course, nothing is going wrong.


    When both members of a couple understand and acknowledge this, they can use it
    to create greater intimacy and a smoother day-to-day life. When they don''t, they
    may drive each other crazy and create boatloads of dirty pain.


    There''s one other/both aspect to this: it''s not unusual for couples to shift
    their power/control balance based on the context.


    # Meet the Extremes


    Someone with an extreme power orientation tends to be impatient and impulsive.
    They like to act, not study options, or plan strategies, or build consensus. Their
    main focus in life is trying to get everyone else to do what they want. They get
    extremely uncomfortable sitting around talking but doing nothing.


    Power people tend to respond from their heads, not their hearts. When you ask
    for their opinion, they''ll usually say, “I think it''s a smart move”'
