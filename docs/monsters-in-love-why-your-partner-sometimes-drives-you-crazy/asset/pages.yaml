  md: '# 26


    ![](img/f0331d8dc5a59fa7731641cfdc004eec_209_0.png)


    # Virtues and Limitations


    In committed partnerships, almost all of us resist changing.

    When we look at our partner’s resistance, we think we see stubbornness or thoughtlessness.
    When they look at us, they think they see the same things. But we''re both usually
    wrong.

    People in committed relationships usually resist change because of their integrity.
    *Whatever our partner wants us to change, we resist because we see it as a virtue.*


    # CLAUDIA AND HASSAN


    Claudia wants her husband, Hassan, to dress more stylishly, especially when they
    go to parties and events. She''s sometimes embarrassed by how careless—and outright
    dorky—his outfits are. She often talks to him about this, but he shrugs and says,
    “Darling, what can I say? I just don''t care about fashion. There are more important
    things in this world to worry.”

    Meanwhile, Hassan wishes Claudia put gas in the car when the tank is almost empty.
    Often when he gets in the car in the morning, he has to fill it up in order to
    get to work. He mentions repeatedly to Claudia, who tells him, “You try running
    errands with a'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'fussy two-year-old. When I have Anna with me


    To Hassan, Claudia''s habit of leaving him with an empty gas tank is a limitation.
    But to Claudia, it''s a virtue. She tells her husband, "I''m just trying to be
    a good mother and a good neighbor. I want to get through the day without having
    to deal with a tantrum in the middle of the produce aisle. Remember when Anna
    flung that eggplant at the produce manager''s head?


    There is (of course) nothing wrong with Claudia or Hassan. Each is acting out
    of their integrity—out of what is important to them. But in doing so, each can''t
    help frustrate the other.


    This is because Hassan''s and Claudia''s virtues are also their limitations. Hassan''s
    deep concern for refugee families is wrapped into his lack of concern about his
    appearance. Claudia''s care for their daughter''s well-being, the peace of mind
    of their neighbors, and her own sanity is wrapped into her lack of care about
    passing up the car.


    If you look closely, you''ll discover that everyone''s virtues are also their
    limitations. Our strengths are also our weaknesses.


    LeBron prides himself on never being late, but he can get obsessive about the
    clock. Susanna believes in being calm and thoughtful, but at times she seems cold
    and slow to respond. Best loves kids, but she never says no when her self-absorbed
    adult children expect to be their free, private daycare provider. I''m an assertive
    guy, and my assertiveness has made a huge positive difference in my life, but
    my wife tells me that sometimes I can be a bully.


    This same dynamic occurs in the ways with the world. Hal and Chris regularly volunteer
    for many good causes, but sometimes they''re busy with those causes that they
    neglect their teenage sons. Margie and Erik throw fantastic dinner parties for
    their friends; this off'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'their parents siblings, who only get invited on Thanksgiving and Christmas.
    Rachel and Leah routinely find homes for stray dogs; right now they have five
    of them, and the dogs’ barking keeps most of the block awake at night.


    Virtue and limitation are two sides of one coin. Whenever one begins to vibrate,
    the other naturally vibrates as well.


    Most of us are good at recognizing and living according to our virtues. But we
    have a much harder time recognizing, admitting to, and letting go of our limitations—precisely
    because they are our virtues’ flip side.


    No relationship highlights this paradox more clearly than an intimate partnership.


    It may seem like no big deal for Hassan to pay a little attention to how he dresses
    and for Claudia to fill up the car with gas and so on. Why are they grinding together
    over such small, simple things?


    Because to them it’s not clothing or the car. It’s about integrity, which they
    are. Hassan hears Claudia’s complaint as I want you to care more about looking
    fashionable than displaced families. Claudia hears Hassan’s complaint as I want
    you to care more about our car about our child, our neighbors, and your sanity.
    Each they think the other say, I want you to stop living according to one of your
    virtues.


    But that’s not what Hassan and Claudia are actually saying. Each is asking the
    other to look at one of their limitations.


    Most of us naturally—and vigorously—resist any call to dump one of our virtues,
    because our virtues are tied so closely to who we are and what we stand for. But
    if we were asked, “Would you be okay with getting rid of our biggest limitations?”
    not many of us would answer, “Hell, no! I cherish my limitations.


    One of the hallmarks of an emotional bottleneck is when one or partners rebuff
    repair attempts under the guise of maintaining a virtue, standing on principle,
    or establishing and holding a healthy boundary. When something is genuinely about
    virtue, we would welcome any repair attempt rather than try to avoid it, thwart
    it, or shut it down.


    For Claudia and Hassan to begin working through their emotional bottleneck, each
    partner needs to recognize their limitation and grow beyond it, while still finding
    a way to maintain one virtue.'
