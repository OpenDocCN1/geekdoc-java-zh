    # The Hook


    You want something important from your partner—sex, admiration, appreciation,
    emotional support, fun, attention, time, money, status, approval, encouragement,
    cheerfulness, optimism, or creativity. Yet they can’t won’t give it to you.


    Meanwhile, lots of other people may be very willing to give it to you. They might
    already be giving it to you, especially if the “it” is appreciation or approval
    or encouragement.


    But the person you want from most is your partner. And no matter what you say
    or do, you can’t get it from them.


    It seems like it would be so easy for them to give it to you. They know how much
    you want it from them. They ask for it, over and over. They may have routinely
    given it to you in the past. They may regularly give it to their siblings, kids,
    friends, boss, coworkers, or colleagues. But, somehow, circumstances have configured
    themselves so that it’s impossible to give it to you.


    This isn’t true about every single thing you want from your partner. It’s true
    about some of the things that are most important to you.


    You’re not alone in this. Your partner is having the exact same experience. Try
    as they might, they can’t get what they want from you.


    This is the central conundrum of every committed relationship.'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'You can pull your hair out trying to get the things you want from your partner,
    but this will only piss them off and leave you more frustrated (and less hair).
    Eventually you realize that the only way your partner can give you what you want
    is if they change. But you also come to understand that you can''t make them change.


    Meanwhile, your partner is in the exact same situation. They want to become someone
    other than you are. But you can''t be someone other than you are.


    Your desires and frustrations interlock, and the two of you block each other in
    an emotional stalemate.


    In every committed partnership, things are going to vibrate in exactly this way.
    It''s unavoidable.


    If you try to avoid this conundrum by leaving the relationship and finding someone
    else, the same dynamic will eventually appear in the new partnership (usually
    with different specifics).


    If you try to lower the heat, you''ll deepen the conflict and frustration, which
    will result in raising the heat. If your partner tries to lower the heat, the
    same thing will happen.


    No matter strategy either of you uses, you your partner will continue to block
    each other, just by being who you are.


    This is not the result of a defect in you or your partner or the relationship.
    Even if the two of you are the world''s most loving and mature couple, you''ll
    continue to experience this same dynamic, time after time.


    This is the hook you and every set of committed partners are stuck on.


    All of us try to find a way to get off this hook. You probably bought this book
    hoping to learn strategies for wiggling it off. But there aren''t any.


    Most of us try to wiggle our way off by blaming partners, or blowing our anxiety
    through them. Every time, these strategies embed the hook deeper.


    Some of us try to avoid the hook without having a partner, or by limiting our
    relationships to casual encounters. Those strategies also embed the hook deeper,
    because the hook isn''t a result of having a committed partner. It''s a result
    of being alive. With or without a partner, you''re going to bump up against your
    own limitations, fears, and over and over. (That said, intimate relationships
    tend to make the invisible more visible.)'
