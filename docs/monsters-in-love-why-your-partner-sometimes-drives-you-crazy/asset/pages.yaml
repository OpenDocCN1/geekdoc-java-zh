    # The Communication Trap


    Most couples think they don’t communicate clearly. They come to therapy hoping
    to learn to communicate better.


    Wanting to be helpful, therapists give them a bagful of communication tools. Use
    “I” statements. Take turns speaking and listening, without interrupting. Say,
    “Here’s what I heard,” and then paraphrase what your partner said.


    These can be helpful, but they’re only technical fixes. When a couple is stuck
    in an emotional bottleneck, these tools become ineffectual. They’re like throwing
    a drowning pan an oar.


    Most couples already communicate extremely well. As Dr. Schnarnach taught me,
    the real issue is that neither partner likes the messages they get from the other.


    People often say they wish their partner understood them better. What they really
    mean, though, is, “I wish my partner would agree with me more” or “I wish my partner
    would do—or think, or experience—what I want them to.


    In my office, clients often say to me, “Resmaa, I keep telling and telling my
    partner, ‘I want this,’ or ‘I don’t like that,’ or ‘You’d make me so happy if
    you’d just do X, Y, and Z.’ And after all these years, they still don’t hear me.”'
  merge: -1
