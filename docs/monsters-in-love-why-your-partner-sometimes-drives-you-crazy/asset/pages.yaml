    your spine and embracing it—their trust in you contracts. *That''s a form of dirty
    pain.


    Most of us feed our bullshit occasionally. It can be bullshit about why we didn''t
    do what we promised, or why we''ve avoided some difficult task or decision, or
    any other variation of failing to stand in our own integrity.


    None of us want our partner to bullshit us. But when we bullshit our partner,
    in our heart we don''t want them to buy our bullshit, either. We want them to
    have presence and integrity to lovingly comforting us—say, “Hold on a second;
    that''s not right.”


    That''s what goes on our heart. But what lizard brain operates on completely different
    principles. What makes our heart swell is precisely what makes our brain tremble
    in terror.


    Your lizard brain isn''t wrong or bad. It''s not lowly part of you that you need
    to despise or dispense with. It keeps you alert, protected, and alive. Its messages
    also force you to learn to grow beyond survival and protection.


    We all receive these messages from our brains. As we grow up, though, we learn
    not to react to them. We accept the ambiguity that the more we care for our lover,
    and the longer we stay with them, the more frightened our lizard brain gets, and
    the more vulnerability we experience.'
