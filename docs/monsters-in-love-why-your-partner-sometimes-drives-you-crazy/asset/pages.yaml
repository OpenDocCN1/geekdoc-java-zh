- img_proc: true
  md: 'Without such a routine, the winds of change, and the heat and pressure of intimacy,
    can tear you apart.


    When everything else in your life is painful or confusing, you need at least one
    that you can hold on to. You need something that you know will keep you sane and
    stable, no matter what happens. That “something” is your growth routine.


    The essential elements of a fully effective growth routine are:


    +   - Enough restful sleep (typically seven to eight hours a day)


    +   - Regular exercise (based on your ability)


    +   - Good nutrition, often including beneficial supplements


    +   - Simple pleasures, enjoyed regularly


    +   - Being present with yourself and the world


    In the pages that follow, I’ll discuss each of these elements and review a range
    of potential pieces of your own growth routine. You can’t possibly adopt them
    all, any more than you can go shopping at the supermarket and come home with everything.
    The suggestions in this chapter are simply options to choose from and adapt.


    You need to design your own growth routine so that it suits your life and your
    body. Don’t copy someone else’s, even if they swear by it and say, “It saved my
    life and restored my health and sanity.” The person is probably telling the truth—but
    you don’t live in their body, and they don’t live in yours. No matters how much
    my blond colleague Judy swears by a particular brand of tanning cream, I have
    no use for it. What I need is effective sunscreen.


    Especially don’t copy your partner’s growth routine. You need to create your own—one
    that is ideal for you. If, after some experimentation, discover that a growth
    routine that’s much like your partner’s works for you, then go for it. But follow
    it because it works for you.


    If your partner doesn’t have a growth routine of their own, don’t pressure them
    to create and follow one. Just continue to follow your own. It’s up to your partner
    to decide what to do or not do in support of their own health.


    Here’s what I’ve noticed, though: when one lover regularly follows a growth routine
    for several months, their partner usually begins to'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'acknowledge (at least themselves) the value of such a routine. Over time, the
    positive results of your own growth routine may, slowly and subtly, encourage
