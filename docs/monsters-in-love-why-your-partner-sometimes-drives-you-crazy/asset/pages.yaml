    # Get Enough Sleep


    Doctors recommend at seven to eight hours of sleep each day for most folks. Some
    people need even more for optimal health. If you need more, you''ll know it, because
    you''ll be tired and dragged out when you get up.


    You don''t have to get all your sleep at night. Many people find that they''re
    more alert during the workday if they sleep less at night and take a regular nap,
    especially in the afternoon.


    Getting enough sleep can improve your life in multiple ways:


    Learning and memory: Sleep helps the brain concentrate and retain information.
    In multiple studies, people who slept after learning a new task did better at
    it later.'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'Metabolism and weight: Chronic sleep deprivation may create weight gain by
    affecting the way our bodies process and store carbohydrates by altering levels
    of hormones that affect your appetite.


    **Safety:** Sleep deprivation contributes to more frequent falls, mistakes, and
    traffic accidents—and, of course, falling asleep during the day.


    **Mood:** Too little sleep can result in irritability, impatience, and other forms
    of moodiness. Too little sleep can also leave you too tired to do the things you
    like to do. A chronic lack of sleep has been linked to the symptoms of some mental
    and emotional disorders.


    **Healing:** Sleep bolsters your immune system, so getting enough sleep is essential
    to recovery from illness or trauma. As a rule of thumb, the more you need—whether
    physical, emotional, or spiritual—the more sleep you need we. Healing from clinical
    depression is an exception.


    **Cardiovascular health:** Serious sleep disorders have been linked to hypertension,
    increased stress hormone levels, and irregular heartbeat.


    Most people think that each of us has an internal sleep bank—that if we deprive
    ourselves of sleep during the week, we can catch up with extra sleep on weekends.
    But that''s not how sleep works. When you don''t get enough sleep on Tuesday night,
    you''ll be less healthy, happy, focused, and alert on Wednesday, no matter how
    much sleep you get the Sunday before (or plan to get the Sunday after).


    It''s also important to create a regular sleep pattern, including a daily routine
    of winding down at the end of the day. This makes it easier to fall asleep and
    to wake up, because your body adjusts to the regular rhythm over time. This doesn''t
    mean you have to go to sleep and get up at exactly the same time every day. You
    just need to create enough regularity that your body knows when to naturally shift
    into sleep mode.


    # **Exercise Regularly (But Not Painfully)**


    Most people need some regular exercise to be at their best, and to show up fully
    for themselves and their partners. Physical exercise also helps release the pent-up
    energy that we store in our bodies as emotion and stress.


    Multiple studies have demonstrated the mental health benefits of regular exercise.
    It can increase your resiliency and improve your mood.


    An ideal exercise program focuses on building cardiovascular strength. This means
    doing exercises that will raise your heart rate for thirty minutes'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'or more at a time. Brisk walking, jogging, swimming, or biking all give your
    heart a decent workout. This type of exercise also releases depression-fighting
    endorphins.


    If you don''t like to exercise, simply take a brisk walk of at least two miles,
    five days a week. This won''t be physically taxing—at least after the first few
    weeks—and it can pay off by improving your mood and your physical health.


    Your exercise routine doesn''t have to be grueling or painful. But it does have
    to be real and consistent. Shoot for at least five days a week, thirty to sixty
