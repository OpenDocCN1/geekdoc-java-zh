    # # The Dynamics of Critical Mass


    Critical mass is the place where at least one member of a couple can no longer
    continue with the status quo. For them, something *has* to change.


    Couples often reach critical mass around things that are finite or scarce, such
    as money, time, or physical or emotional energy. More importantly, critical mass
    nearly always involves a challenge to at least one partner’s values and integrity.


    Critical mass isn’t a position or a decision or a demand. It isn’t strategic.
    Often it’s not even cognitive. It is an unequivocal, undeniable sensation in your
    body. You *know* that the game is up.


    The process of critical mass mirrors the process by which coal is transformed
    into a diamond. Sustained heat and pressure eventually create the conditions for
    a potential transformation.


    When couples reach critical mass, both lovers face the possibility of losing something
    or someone important. They have also reached a point where at least one of them
    can''t compromise their integrity.


    Each partner now has to choose: they can *grow up*, and potentially transform
    (or end) the relationship, or they can stay stuck and worsen the problem.


    This choice usually involves an ultimatum—not to your partner, but to yourself.
    That ultimatum is usually experienced in your body, as well as in words, concepts,
    and actions. The central message of this ultimatum is:'
