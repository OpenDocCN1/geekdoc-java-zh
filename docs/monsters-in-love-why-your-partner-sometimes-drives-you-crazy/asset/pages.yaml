  md: '# The Twin Terrors of Togetherness and Autonomy


    You can''t have a healthy partnership without both togetherness and autonomy.
    Without togetherness, the relationship is a business deal in which both partners
    use each other for their own ends. Without autonomy, both partners eventually
    smother each other.


    We each need to build our capacity to experience both togetherness and autonomy,
    and to switch between them as the situation warrants.


    We''ve already seen how our Godzilla brain is terrified of togetherness and intimacy.
    That part of our brain hates our partner because it makes us vulnerable to them.
    The more committed we are, and the more vulnerable we become, the more frightened
    our lizard brain can get.


    Yet at the same time, a different part of our brain—the part that thinks like
    bees—is equally terrified of autonomy. Our bee brain doesn''t want to grow up
    and think for ourselves. Instead, it wants our partner to belong to, and for us
    to belong to our partner. This is the part of your brain that wants you and your
    lover to be each other''s baby.21


    Whenever your partner wants more intimacy than you do, your lizard brain can get
    activated, and you may experience fear or anxiety. But whenever your partner wants
    more autonomy than you do, your bee brain can get activated—and you may experience
    just as much fear or anxiety.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'All of this is baked into our DNA. It''s not wrong or dysfunctional. It''s
    how normal, healthy humans are wired. None of it is a mistake or something to
    overcome. It''s a call—in two different voices—to grow up.


    Our job isn''t to get rid of the messages from our lizard and bee brains. We need
    them for our happiness and survival—and our maturity. Without your lizard brain,
    you could end up as a member of a mind-control cult, doing the bidding of Holy
    Herbert. Without your bee brain, you might be living alone in an Idaho cave, stockpiling
    weapons and posting “Keep Out” signs.


    Our job is to metabolize the messages from both our bee and lizard brains, using
    the five anchors and the opportunities for reps that life presents us with. Over
    time, practicing these reps regularly will help us become the people we want to
    be.


    Any of us can shift from our lizard brain to our bee brain—and back again—in an
    instant. We can experience both at the same time.

    For example:


    # RAYNELLE AND QUINTON


    Raynelle: We haven''t gone out together in weeks. It seems like you''re ignoring
    me.


    Quinton: Let''s go to a movie! I''m totally up for it.


    Raynelle: Now.


    Quinton: Now.


    Raynelle: Now it seems like you''re pressing me.


    When Raynelle says to Quinton, “It seems like you''re ignoring me,” she''s speaking
    from her bee brain, which fears autonomy. A few seconds later, when she says,
    “Now it seems like you''re pressing me,” she''s speaking from her lizard brain,
    which recoils from togetherness. Those words in turn briefly activate Quinton''s
    own bee brain, which tells him, *She''s pushing you away! Sting!* In the heat
    of this situation, he might also think, *Huh? What the hell wrong with you?* You
    just said a few seconds ago that you want us to do something together.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'But he doesn''t have to speak thought or react from his bee brain. He can do
    better. He can hold on to himself and take a mental step back. This gives him
    the chance to ask himself, What is Raynelle asking me for?


    The answer is not a fun date right now, or she would have said, “Great! Let’s
    see what’s playing.”


    The answer is not an immediate solution, or his response wouldn''t seem like pressure
    to him.


    The answer is not something other than a movie, or she wouldn''t have asked, “When?”


    Because Quinton is able to hold on himself and slow himself down, he shifts from
    one part of his brain to another. He responds from a strong, grown-up place rather
    than a confused, frustrated, primitive place.


    He kisses Raynelle on the forehead and says, “I missed going out with you, and
    I’m sorry it’s been so long. Let’s plan on a couple of evenings out soon. What
    are best for you? Or would you rather that out later?”


    Quinton’s response is not merely expression of love and caring; it’s also a call
    for Raynelle to make a similar shift and grow up.


    If she heads that calls and shifts to a grown-up part of her brain, she might
