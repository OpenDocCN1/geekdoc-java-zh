    # Monsters Operate on Vibe


    We mostly experience emotions in our bodies, not only in our heads. That’s why
    we need to pay close attention to what our bodies tell us.


    During the past two decades, we’ve learned over and over that biology (our sensations
    and emotions) usually trumps biography (the stories we tell ourselves about what’s
    happening). The more we pay attention to what we experience in our bodies, the
    better we understand ourselves and our relationships.


    For many years, most psychologists thought that cognitive insight was the key
    to transformation. They told us that if we can understand the story behind something—if
    we can unlock its meaning—then we can unravel it, and write a new, better story.


    But this idea doesn’t fully match reality.


    It turns out that the key to transformation is not only cognitive insight, but
    also visceral experience.


    When this transformation happens to someone else, we can see physical changes
    in their eyes and posture; we can hear the change in their voice. Their eyes shine
    with clarity. Their voice is stronger, calm, and assured.


    Yet all of this usually precedes their cognitive understanding. That comes later—sometimes
    only seconds later, but often not for weeks or months.'
  merge: -1
  pgno: 134
