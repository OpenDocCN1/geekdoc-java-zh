    # Creating a Growth Routine


    Growing up to focus energy, resilience, patience, and tolerance for uncertainty.
    All of these require good nutrition, mindfulness, enough sleep, some regular moments
    of simple enjoyment, and at least some physical fitness.


    Your regular efforts to maintain these form your growth routine. Your growth routine
    serves as a mooring post in your life. It helps keep you stable when life with
    your partner becomes painful, difficult, or uncertain.'
