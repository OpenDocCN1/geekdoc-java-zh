  md: '# 20

    People Can Tolerate Being Used, but They Hate Being Discarded or Discounted


    In my thirty-plus years as a therapist, I''ve learned that most people can tolerate
    being taken advantage of, so long as the relationship meets some need or serves
    some purpose for them.


    This is why so many people have affairs with married folks. Most of these people
    understand on some level that their married lovers will never leave their spouses.
    Usually they know it in their bodies as aches or urgings, but not in their cognitive
    brains. Yet they appreciate the attention, gratitude, sex, excitement, fun, prestige,
    gifts, or money that their lovers provide. It''s temporary gratification, but
    at least it''s gratification.


    Most affairs with married people follow some single predictable trajectory. Sooner
    or later, the person being cheated on wakes up, straightens their spine, and takes
    a stand. They tell their partner, “I can''t stop you from having an affair. But
    if you keep having it, don''t expect me to stick around.” Sometimes, realizing
    that the game is up, their partner dump their lover-on-the-side hard and fast.


    For the jilted lover, this hurts like hell. The message they hear is, You''re
    not important to me. In fact, you never were. And they''re right.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Something similar happens with our partner when we steal their choice. When
    we have an affair and don''t tell our partner that they are now in a three-person
    relationship whether they like it or not, we become a choice thief. When we use
    some of the family savings to cocaine and don''t tell our partner, we become a
    choice thief. In each case, we ignore our partner in favor of a person, object,
    or habit. Through our actions, we tell them, My Ashley Madison hookup or coke
    habits matters to me, but what you want or need doesn''t.


    People can''t stand being ignored or discounted—or, worse, cast aside, crumpled
    up and kicked to the curb. That''s exactly how affairs with married people typically
    end.


    No one wants our partner (or ex-partner) to hate us or be mad at us. But we''d
    rather have their hate or anger than their indifference. We''ll start a fight
    or make a scene so we don''t have to accept the fact that we don''t matter to
    them.


    Sometimes we''ll smash their window, or paint graffiti on their door, so we force
    them to care about us in some way. It''s not the way we want to care about us—but
    at least we''re back on their radar screen.


    In a committed relationship, the thing we want most is to be important to our
    partner. We also want them to communicate to us just how important we are to them,
    and we know how much they want the same thing from us. This gives lovers the ability
    to slime each other big-time.


    One of the most common—and most painful—forms of commonplace cruelty is the small,
    dismissive motion or gesture or facial expression that conveys this message: You
    don''t matter. You''re not important to me. When our partner does this to us,
    suddenly experience fury, shame, or terror—without understanding why.


    A similar of slimming occurs when we try to engage with our partner, and they
    respond in an angry monotone—“I can''t care” or “It doesn''t matter” or (slimiest
    of all) “It’s fine.” Meanwhile, the vibe they send to us screams, I care and it
    does matter—a lot. But right now I''m refuse to engage with you. You won''t be
    able to do anything about your anger or my slimming, so you''ll sense that you
    don''t matter. This is a classic form of underpowering, which I described in chapter
    15. We sense that something is'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'missing, that our partner has emotionally dropped away. We also get caught
    in their double message.


    In either of these situations, the ability to stay anchored and soothe yourself
    is crucial. The lizard brain in the back of your skull will almost certainly get
    activated. You think I don''t matter? your Godzilla brain may shout. *Fuck you.
    I''ll matter to all the people on the fishing boats I''m about to destroy.*


    But you''re not a lizard. You don''t have to mindlessly follow the messages from
    the back of your brain. And you have the power to stop yourself before you destroy
    anything. Recall and practice the five anchors from chapters 5 and 35.


    As kids, most of us were taught how to handle bullying and insults. But few of
    us were taught how to handle the pain of other people'' indifference, especially
    when that indifference comes from someone we care about. As adults, we need to
    build our skills for staying centered and calm in the face of indifference, so
    that we don''t fight, freeze, fawn, or annihilate.


    There''s a flip side to this. Just as there are hundreds of ways in which we can
    subtly dismiss or dismiss our partners, there are innumerable simple, subtle ways
    in which we can show that they matter to us.


    We''re all familiar with the obvious demonstrations: bringing flowers; walking
    behind them and kissing them on their neck; or saying, “I love you. Let''s go
    out for dinner tonight.”


    There are also personal remembrings. These are the things you do for your partner
    that acknowledge something they care deeply—even if you don''t give a damn about
    it itself. Maybe your mate likes having a clean and orderly car, because it makes
    life seem less chaotic to. So, while they''re at the gym, you get the car washed
    and waxed, as a small surprise. Or maybe they''re excited about going to their
    upcoming high school reunion. So, a few days before the reunion, you make and
    send them a video montage of photos of them when they were a teenager. These remembrings
    can do a great deal to hold relationships together.


    All of these are great, but there''s one other category of remembrings: the small,
    intimate things you and your partner can do that are natural, almost matter-of-fact
    affirmations of your connection and couplehood. Some examples:'
  merge: -1
  pgno: 168
- img_proc: true
  md: '+   You and your partner are sitting on the sofa watching a movie. Your partner
    stretches out their legs and puts their feet on your lap. You respond by gently
    resting your hand on their shin.


    +   Your partner calls you at work. You answer not with, “Yo. What?” but with,
    “Hey, darling. How’s your morning been?


    +   You offer to refill your partner’s empty coffee cup. As you pour the coffee,
    they lightly touch your shoulder.


    All of these gestures, and a thousand others like them, communicate the same simple
    but deeply important message: *You matter to me.*


    These gestures, which I call *cueings*, are invitations for intimacy and connection.
    They’re not come-ons for sex (though if the energy in the moment happen lead to
    sex, that’s fine) or performances of noble intent.


    Most couples offer each other these cueings. This is why, if our partner suddenly
    stops offering them, our body goes on alert. Cognitively, we may not realize—or
    be able to articulate—what the problem is. But we can sense in our body that something
    is missing. We might even ask our lover, “What’s wrong?”


    Typically, when couples reach gridlock, they stop providing these small cueings
    to each other. Or, sometimes, only one partner will stop providing them—and the
    other will become unsettled by it. In response, they might stop their cueing,
    thereby turning up the heat on both partners. Or they might *increase* their own
    cueing, hoping to get their partner to resume their typical cueing in response.
    This usually turns up the heat, too.


    When a lack of cueing by one or both partners becomes the new norm, it usually
    means that critical mass—and an opportunity for both partners to up their games—is
    near hand.


