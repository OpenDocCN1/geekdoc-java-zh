    # # Why Everyone Hates Their Lover


    Hatred exists in all loving long-term relationships. It’s a part of how they work.


    Everyone in a committed partnership has briefly hated their partner. Everyone.


    Part of growing up is acknowledging this hatred. Most of us are afraid to admit
    this hate, because it isn’t socially acceptable. So we hide it or pretend we don’t
    experience it.


    Therapists rarely bring up the subject of hate with their clients. But when I
    ask my clients, “Have you sometimes experienced hate for your partner?” nearly
    all of them say yes.


    Denying this hate creates all kinds of problems. For starters, when it does pop
    up inside you, you don’t know how to deal with it. Hiding from it or overiding
    it doesn’t allow you to develop discernment or an awareness of nuance. So, instead,
    you may reflexively respond in a way that creates dirty panic. You might tell
    your partner, “There’s something wrong with you,” or you might say to yourself,
    “Oh shit, there’s something wrong with me. But there’s nothing wrong at all.


    If you don’t acknowledge this occasional hate, it’s going to come out in some
    other, nastier, unexamined form. You won’t recognize the hate as completely normal—and
    you won’t be willing to pause and stay with the constriction in your body, so
    discernment can develop, resources can'
