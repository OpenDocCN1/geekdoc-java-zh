    Everything Karyn reports is accurate. But she''s missing one deeply important
    piece: what life was like for her in the womb.


    Even before she was born, Karyn learned how to swim away from threats to keep
    herself safe. Years before she had any cognitive awareness of what danger was,
    her body was flooded with hormones that responded to potential threats.'
