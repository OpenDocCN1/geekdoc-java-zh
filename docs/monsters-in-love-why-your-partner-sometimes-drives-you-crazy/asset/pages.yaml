    Sometimes people are afraid to choose because they simply have no idea what to
    do. But not knowing isn’t wrong or shameful or abnormal. If you don’t know what
    to do, stand in your integrity and say to your partner, “Honestly, I don’t have
    any idea what to do.” Then pause—and notice what emerges, inside you and in the
