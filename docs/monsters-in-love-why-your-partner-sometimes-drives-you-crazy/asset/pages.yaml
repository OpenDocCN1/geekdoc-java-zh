  md: '# The Maps in Our Heads—and How They Can Mislead Us


    In our heads, we each have a mental map of the world, which we use to help us
    navigate life.


    Your own world map includes a smaller map of your partner’s brain terrain—or,
    at least, what you believe your lover’s brain terrain to be. It’s a working simulation
    of their brain inside your brain.


    The longer you’re with your partner, the more nuanced, detailed, and accurate
    you believe your map of their brain is. Nevertheless, this map always has both
    accurate and inaccurate information, because it’s based on many different things:
    your experience with your partner, your own life history, your tolerance for ambiguity
    and uncertainty, the degree to which you can adapt and be flexible, and your ability
    to stay solid, centered, and committed.


    Because of this map, you are often (but not always) able to predict what your
    partner will say or do in certain situations. Whena gives her husband, Louis,
    a certain look, he knows that the next words out of her mouth are likely to be,
    “Sugar, that dog won’t hunt.” When Corinne is reading at the kitchen table and
    suddenly senses Bobbi’s fingertips lightly touching the base of her spine, she
    knows this is an invitation to head into the bedroom—or to make love there in
    the kitchen. When Ariella says, “I'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'have a favor to ask you,” Harvey knows that she’s about to ask him to change
    one of his habits.


    This mind-mapping¹⁵ helps us recognize when something isn’t right, such as when
    our partner is deceiving us, or being inauthentic, or in serious emotional trouble.
    We can sense that something is wrong because what they say or doesn’t match the
    map in our head.


    However, past conflicts or trauma can get in the way of our ability to build an
    acute mind-map of our partner. When something activates a traumatic memory in
    our body, we may overlay trauma on top of our mental map and respond to that trauma.


    And when reality and our mental map don’t match, we have to make a choice: go
    with our (possibly inaccurate) map; gather more information; or accept the uncertainty
    and ambiguity for now, and revisit the discrepancy later.


    If we respond from a place of trauma and immediately go with the map, we can make
    both ourselves and our partner crazy.


    One notable aspect of every mental map is that it can never be as dynamic and
    emergent as a flesh-and-blood human being. Simply because it’s a map, it encourages
    us to expect (or even demand) relational consistency from our partner. But simple
    consistency is the stuff of robots and computer programs. It’s inadequate for
    human relationships.


    To create more room for growth in ourselves—and in our relationship with our partner—we
    persist more than consistency. When we persist in holding onto ourselves when
    the heat gets up under us; when we persist in living out of the strongest and
    most life-affirming parts of ourselves; and when we accept and learn into clean
    pain and discomfort, over and over, then growth and new possibilities can emerge.


    # MADISON AND HENRY


    When Madison’s partner, Henry, doesn’t call after he lands in Chicago, as they
    agreed, he reflexively thinks, He’s having an affair or He’s been in an accident
    or He doesn’t love me anymore. Madison then has an impulse to punish or confront
    Henry, instead of calling him to get more information.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Madison starts back braining. She texts Henry, RU ALL RIGHT. Henry doesn’t
    respond for the next hour. Just as Madison starts to text U BASTARD, WHY DID I
    EVER TRUST U, her phone rings. It''s Henry, breathing hard. “Hi, a tornado blew
    through Schaumburg and they had to reroute us to Milwaukee. I had to run to catch
    the last train to Chicago. Just made it."


    When something about our partner catches us by surprise—or when we encounter something
    entirely new to us—it can overwhelm us, and we can respond reflexively from a
    place of trauma or stuckness. This is what happened when villagers first looked
    at Dr. Frankenstein''s monster. Even though he was mostly wandering around, everyone
    freaked out. “Oh my God, run! We''re not safe around this hideous creature! He''s
    going to do terrible things!


    It''s also easy to forget that people change. This is the central paradox of committed
    relationships. We want our partners to stay in the ways we appreciate, but we
    also want them to change those attributes that bother us.


    Over time, some of the things we like our partner will stay the same, but others
    of the things we dislike about them will improve; some will get worse; and some
    won’t change at all.


    But even though our partner—or our situation—has changed, we may refuse to change
    our mental map. This is a recipe for problems, because reality always trumps our
    ideas about it.


    Every one of us with a partner needs to regularly amend our mental map as we go
    through life. We need to let go of any inaccurate elements—including our fears,
    hopes, and dreams—and deal with our partner as they actually are.


    Sometimes we’re slow to do this, especially when our partner changes in a way
    that we don’t care for. Suddenly our partner doesn’t match our map. That scares
    the bejeezus out of us.


    When a couple reaches an emotional stalemate, both partners sometimes have trouble
    distinguishing their mental maps from what is actually happening. They may respond
    to the pressure and grinding by'
