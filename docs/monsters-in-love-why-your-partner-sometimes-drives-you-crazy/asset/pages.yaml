  md: '# 43


    # Why Therapy Often Doesn''t Work


    Therapy never succeeds when people run for cover rather than learn to tolerate
    heat, friction, and discomfort.


    But that''s not the only reason why couples therapy can fail. There are six other
    common causes:


    +   1. Therapists who believe—against all evidence—that the key to healing and
    growth is cognitive insight. Most therapists and self-help writers have a high
    regard for meaning, which they see as the holy grail of emotional healing. The
    goal of these professionals is to help their clients *aha* moments, usually by
    delving deeply into their pasts. They believe that they can help a client sort
    out meaning in their life, healing will naturally follow.


    Clients of these therapies may have epiphany galore. But they don''t often transform,
    for two reasons: First, there''s no processing of images, emotions, or bodily
    sensations, because cognitive insight tends to speed up mental processes rather
    than slow down bodily ones. Second, cognitive insight alone typically does little
    to help people access the best parts of themselves, build strength, and grow up.


    We human beings naturally try to make meaning out of what happens to us. Often
    this is helpful, but in most high-stress situations, meaning-making tends to get
    hijacked by our lizard brain, which focuses entirely on survival.'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Our body shifts into a constricted, self-protected position. We close up just
    when we need to open.


    Unfortunately, many therapists are addicted to meaning-making. When a client makes
    a connection in their office—when they slap their head or say, "Aha! or "Oh shit”—it
    makes the therapist happy. Sometimes it makes the client happy, too. But cognitive
    insights are rarely enough to get people to actually transform. They may cognitively
    understand what they need to do, but they don''t experience enough heat under
    them to do it.


    Sometimes the therapist needs to ask a client or couple to put making aside for
    a time, in order to focus on their bodies and emotions. These are the places where
    heat gets generated, where issues and conflicts can cook, and where the process
    of cooking helps partners build their capacity for autonomy and togetherness.
    This capacity is far more important than generating an insight.


    When therapists focus solely on making, the insights that arise—although usually
    genius—tend to be small, constricted, or myopic, because they are the result of
    purely cognitive processes. But if the therapist first leads the client or couple
    through a process that involves presence, sensations, images, emotions, and their
    entire bodies, the result can be meaning that is not merely insightful, but transformational.
    It''s the difference between knowing you''re approaching orgasm and actually having
    orgasm. The first pleasures your brain; the second rocks you whole being.


    +   2. Therapists who encourage clients to focus on the weakest parts of themselves.
    Many people come to therapy think that the process involves reaching into themselves,
    pulling out their weakest parts, and saying, “Here—help me fix these.” Some therapists
    agree with that approach, so they work with their clients to make those weaknesses
    less weak.


