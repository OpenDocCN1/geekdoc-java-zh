    # # You Are Not Each Other’s Baby


    When we were infants, our lives focused on being fed, being held, and being kept
    warm and dry. Meanwhile, our parents focused on fulfilling these needs for us.


    Soon we learned that if we cried, we''d get a nipple or a hug or something we
    wanted.


    As we grew older, we discovered other ways to get our needs met. We pointed; we
    reached out and grabbed; we said a few words; we kissed mama or daddy; we threw
    a tantrum. We learned ever more complex and varied ways to get what we wanted.


    By the time we reached adolescence, we developed a large repertoire of techniques
    for getting our way: arguing, nagging, flattering, trading, promising, accusing,
    lying, pleasing, appeasing, threatening, fighting, and so on.


    Emotionally, though, we didn''t change our basic orientation. Our primary focus
    was still on getting what we wanted. This was all part of our normal human development.


    But that development doesn''t stop in early adolescence. Growing into adulthood
    means learning to see the world through a lens bigger than *How do I get what
    I want?*


    Yet many people never grow beyond this question. All that changes for them are
    the objects of their desire. Instead of reaching for a nipple to suck'
  merge: -1
