    “I’m guilty of loving you with all my heart. Guilty as hell not a bit ashamed.
    Let’s go out soon, whenever you’re ready. My first choice is Saturday night, but
    suggest another time if you like.”


    This situation presented Raynelle and Quinton with a life rep—and, as you can
    see, Quinton used the five anchors to transform the situation from one of conflict
    to connection and caring.'
