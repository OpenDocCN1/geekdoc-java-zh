  md: '# Welcome to Monsterworld


    Do you want your lover to rock your world? Good.

    Do you want to rock theirs? Even better.

    Rock rocking isn''t always a thrill ride. Rocking creates conflict and discomfort,
    challenge and opportunity, peril and possibility.

    Plus, there''s much more to an intimate relationship than just committed, each
    new moment together, each relationship also has a direction, a charge, a weight,
    a speed, and a texture. Often these create discomfort. Sometimes they drive us
    crazy.


    This book is about the reality of marriage and other committed, intimate relationships.
    It offers no comforting fantasies, false promises, or quick-easy fixes. Instead,
    it offers you and your partner a chance to make your relationship—and your lives—bigger
    and fuller.


    This book challenges several common misceptions about what makes for a successful
    partnership. It also rocks the boat of psychotherapy, calling out therapists who
    don''t bring their best to their clients.


    Every challenge in this book is not based on theory, or fads, or hopes,

    Every challenge in this book applies to all committed couples, regardless of any
    member''s gender identity (or lack of identity) or body configuration.¹


    Who am I to tell how relationships actually work?

    I''m a licensed clinical social worker, a divorce and family mediator, and a certified
    military family life consultant. For twenty-four years, I''ve worked with hundreds
    of couples, families, individuals, and organizations.

    I''ve also served as behavioral health director for African American Family Services
    in Minneapolis and director of counseling services for Tubman Family Alliance,
    a domestic violence treatment center also in'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Minneapolis, where I developed its holistic model and many of its violence
    prevention programs.


    I spent two years working for a US military contractor in Afghanistan, designing
    and overseeing counseling programs for civilian contractors and managing the wellness
    and counseling services on fifty-three US military bases. As a certified military
    family life consultant, I also worked with members of the military and their families
    on issues related to family living, deployment, and returning home.


    You may have seen me on The Oprah Winfrey Show or Dr. Phil, where I appeared as
    an expert on family dynamics and couples in conflict. If you live in the Twin
    Cities, you may also have listened to the radio show I hosted for ten years with
    former US Congressman (and now Minnesota Attorney General) Keith Ellison, or solo
    show, "Resmaa in the Morning," both from KMOJ-FM.


    More recently, you may have heard me on podcasts such as Kristaett''s Being, Dan
    Harris''s 10% Happier, Gwyneth Paltrow''s Hoop, Sounds True''s Walking Together,
    Sam Fragoso''s Talk Easy, Malcolm Gladwell''s Revisionist History, Eric Zimmer''s
    The One Feed, or Pilar Gerasimo and Dallas Hartwig''s The Living Experiment.


    # This Is About Getting Real and Serious


    Committed relationships can be gritty and in our faces. Sometimes they can seem
    dangerous. This is how they''re meant to work. They''re not always serene.


    If you already know this, read on. If you''re unsure but curious, read on. But
    if you''re committed to avoiding grit or challenge or conflict, now is the time
    to step away (from this book, not from your partner).


    Be warned: if what you strive for your relationship is comfort, this book is not
    going to help you. Like committed relationships, this book is gritty and down-to-earth.
    It''s 100 percent clinically sound. Simple, straightforward, and bullshit-free.


    If all you want is a pleasant and nurturing experience, put down this book and
    get a massage.


    If you want a relationship that helps you and your partner grow into the people
    you most want each other to be, welcome aboard.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'A lot of books about relationships aren’t serious. This book is. I’m not saying
    other books have value. A gardening book that only talks about weeding and mulching
    has some value, but it’s not serious about the entire ecology of gardening.


    You can buy a book that teaches you how to communicate better, or to learn men''s
    and women''s different needs and ways of thinking. Most of these books have some
    value, they’re not serious guides to the difficult, painful, and potentially transformative
    business of growing up as partners and as people.


    If you’re reading this book to get some new tools to add to your relationship
    toolbox, this book will shock the out of you. You and your partner don’t need
    a toolbox. Instead, in this book, you’ll open a toybox and take out some new toys—to
    explore, investigate, and share with your partner. But take careful note: these
    are toys for adults, not children. Each one will encourage you and your partner
    to grow up.


    Just by being who they are, your lower forces you into making choices in which
    you grow up or don’t. By being who are, you force them to make the same kind of
    choices. This happens over and over, day after day. Each time it happens, each
    of you has to choose grow or not. You can’t make your partner grow up, and they
    can’t grow up for you.


    When life (or your partner) pushes you into growing up, you usually won’t want
    to do it. If you’re like most people, your first impulse will be to take it personally
    and take offense. You may try to make the conflict into their problem, their pathology.
    Over time, you may grow rageful or even violent.


    Just by being together, you and your partner will also shine light on each other’s
    limitations. This is always painful at first.


    If you’re like most couples, you’ll try to unwind each other’s limitations. This
    can be terrifying—so terrifying that, at times, you lash out at each other.


    Instead, both of you need to grow up.


    This book is about choosing to grow up. That’s what makes it serious. Marriage—or
    any committed relationship—is not for the weak or timid. Each of you, without
    even trying, will naturally rock the boat of your relationship. Sometimes this
    will be uncomfortable or painful. Sometimes it will seem almost unbearable. Yet
    this is exactly what is supposed to happen.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'We''ve all been taught that the best thing to do in relationships is not rock
    the boat. Leave things alone, don''t push, and everybody will calm down, and your
    situation will become comfortable and familiar again.


    With many small, daily issues, this is exactly the right thing to do. But a strong
    partnership isn''t always about keeping your boat as stable as possible and keeping
    you and your partner aligned. It''s also about staying present and upright when
    the wind and waves are tossing you around. When it comes to matters of integrity,
    there will be times when you need to rock the boat—or let it rock. And sometimes,
    in the worst of storms, when your boat is tossed about, trying to keep it stable
    can actually sink it.


    Which is why, as it is, we''re better off seeing our partners and ourselves as
    who we really are.


    # Welcome to the Monster Fairy Tale


    Your partner is a monster. You already know that.


    You''re a monster, too. And so as I.


    Stay with me. I''ll explain.


    In the film version of Frankenstein, the monster comes to life the scientist''s
    lab, he''s curious and innocent, like a baby. Everything seems new and wondrous
    to him.


    But of course he''s not a baby. He''s large and strong. He can control his limbs,
    but he doesn''t know how much trouble they can cause. He doesn''t understand many
    of his body''s signals. He doesn''t realize his power or how to control it. He''s
    dangerous and doesn''t know it.


    He escapes from the lab and wanders off. He ends up by a lake, where he meets
    a small blind girl who gives him a handful of flowers. The girl and the monster
    toss the flowers into a lake one by one and watch them float. Both of them are
    happy until the monster runs out of flowers. Then he picks up the girl and throws
    her in the lake, thinking she can float, too, like flowers and boats. But she
    can''t swim. She struggles and drowns. The monster is confused and miserable.
    From here his life goes from bad to worse.


    In committed relationships, you and your partner—and your neighbor and their partner,
    and my wife and I—are all like Frankenstein''s monster.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'When you and your partner first got to know each other, you were curious about
    each other, you played with each other, and you focused on and responded to your
    similarities. Your relationship seemed new and open, and its possibilities appeared
    infinite.


    At some point a commitment was made. Then, suddenly, life started to get more
    and more difficult. The two of you, just by being who you are, somehow created
    conflicts. You tried your best to be loving, but your efforts led to disaster.
    At times, you may have been tempted to resort to manipulation or cruelty.


    This didn''t happen just once. The two of you became confused and miserable. It
    often seemed like you were drowning.


    Now you sometimes look at your partner and think, What is the hell wrong with
    you? Your partner looks at you and has the same thought. Looking in the mirror,
    you sometimes think, What is the hell wrong with me? Your relationship, or your
    lover, or you, have become the thing you most fear.


    But the reality, nothing is wrong. This is exactly how committed relationships
    work.


    We think that when people have a problem in their marriage, it''s because of an
    issue. You and your partner don''t communicate well. Or your different backgrounds
    and views of the world get in each other''s way. Or your masculine energy conflicts
    with your partner''s feminine energy. Or you''re Muslim and he Jewish. Or the
    two of you just grew apart.


    This is most people''s understanding of how the world works. This is also most
    therapists'' understanding of how the world works.


    But it''s only part of the picture. If it were the whole picture, then gay, lesbian,
    and transgender couples who practice the same religion and who talk to each other
    regularly about their emotions lived charms. But they''re in my office, too, asking
    me, "What is the hell wrong with us?”


    It''s my job to tell them, "Nothing is wrong."


    Couples typically look for The Answer as why they''re unhappy with each other.
    Often, they go to a therapist to assist them in their search. They hope that the
    therapist will help them explore beneath the couch cushions of their relationship
    and find the lost or missing keys. But this isn''t how intimate relationships
