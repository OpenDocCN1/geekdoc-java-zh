- img_proc: true
  md: '# CHAPTER 4 AUTOMATING EXAMPLES


    Of course, this behavior would be exposed through a user interface. But when the
    team is trying to grow and prove the behavior of this tricky algorithm, going
    through the UI to create a new rental application added significant overhead to
    each scenario that really wouldn''t help the team get around just the risk calculator
    class. Instead, the team created a suite of scenarios around just set of scenarios
    that went through the UI to prove that the risk calculations worked in context,
    but that context wasn''t required for all the nuances in the algorithm. Ultimately,
    it comes down to creating the fastest automation we can that realistically exposes
    the system behavior to business stakeholders.


    # Summary


    +   * Cucumber scenarios are automated by creating step definitions, bits of code
    that run for each step in a scenario.

    * Step definitions are linked to steps using regular expressions or Cucumber Expressions,
    giving reusability as data in step changes.

    * Step definitions are just containers for automation code. You create whatever
    code you need to put in that container, often using helper libraries like Selenium,
    Capybara, or Aruba.

    * Choose the fastest, most realistic way of driving your application. Often this
    means driving the application though the UI, but it doesn''t have to. Driving
    a service, an API, or even a database directly can be a better choice for a particular
    step.

    * Use a Cucumber scenario to describe behavior whenever the user or customer cares
    about the behavior, regardless of the size of the thing being automated. A Cucumber
    scenario that calls a single class is OK.'
