  md: 'called behavior-driven development, or BDD, to keep your whole team focused
    on the high-value details and delivering them at a high quality.


    Let''s start by finding a small, high-value slice of the project you could deliver.
    You''re testing the hypothesis that you can create a system without the problems
    of the off-the-shelf alternatives, so let''s start with one of those problems.


    +   SUSAN: How about search? I''ve heard complaints that people can''t find\ the
    book they want, even if it''s actually in the catalog.


    +   JONAH: What do people mostly search by?


    +   MARK: Title, usually. In fact, we know from online search of our printncatalog
    that it''s title 80% of the time.


    +   JONAH: So, could you start with search by and see how people use it?


    +   MARK: Yes, and maybe we could give them an opportunity to provide somenquick
    feedback if they don''t find what they want in the search results.


    +   SUSAN: Search won''t be enough if they can''t actually read the book.


    +   MARK: Good point. We have access to a collection of ebooks throughnAmazon
    that covers a lot of our most common searches.


    +   JONAH: I''m hearing that you need to include some end-to-end slice of thenfrom
    search through borrowing to make this meaningful to users.


    +   SUSAN: That''s right.


    +   JONAH: How might we make sure the parts of the process after searchnon''t
    get too big and delay feedback?


    +   MARK: Well, could we just do a small set of books and only for Kindle.

    That way, Amazon handles the delivery and expiration of the books.


    +   JONAH: Good. What we''re talking about here is what we call a minimumnmarketable
    feature or MMF. It''s the smallest set of functionality that''snworth shipping
    to users, whether you''re actually selling it or not. I''mnhearing an MMF like,
    "Find Kindle books by title and borrow them."


    +   (Writes the MMF title on the whiteboard)


    +   MARK: That''s still pretty big.'
