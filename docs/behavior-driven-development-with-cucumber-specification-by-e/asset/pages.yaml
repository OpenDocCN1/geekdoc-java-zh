  md: '# SIMPLE CUCUMBER EXPRESSIONS


    As much as some of us like regular expressions, using them to identify definitions
    is a bit like cutting birthday cake with a chainsaw—they''re perhaps too powerful
    tool. So, in 2017, Cucumber got its own text matching language, Cucumber Expressions.
    Cucumber Expressions still use regular expressions under the hood, they enable
    you to handle simple cases without regular expressions and keep step definitions
    more readable in cases where you need a regular expression.


    At the time of this writing, Cucumber Expressions are the default for the current
    Ruby, Java, and JavaScript versions of Cucumber. The generated snippets those
    languages use Cucumber Expressions rather than regular expressions. SpecFlow,
    the .NET developers will still need to use regular expressions directly.


    Let''s look at the simple Cucumber Expressions first, and then we''ll explore
    the most useful parts of regular expressions and show how the two work together.


    # Simple Cucumber Expressions


    Earlier, we saw the following step definition:


    ```

    When("search ebooks for (string)") do |query|

    visit ''/query''

    fill_in ''query'', with: query

    click_button ''search button''

    end

    ```


    which matched this step:


    When I search ebooks for "Words of Radiance"


    In the Cucumber Expressions language, {string} matches a string in quotes, captures
    the contents of the quotes, and discards the quotes. So, that same step definition
    match steps like


    When I search ebooks for "East of Eden",


    and


    When I search ebooks for "How to Open Locks with Improvised Tools",


    but not


    When I search ebooks for A Tale of Two Cities


    because the latter has no quotes.'
