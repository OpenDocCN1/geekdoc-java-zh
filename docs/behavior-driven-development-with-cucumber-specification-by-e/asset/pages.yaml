  md: '# CHAPTER 2 EXPLORING WITH EXAMPLES


    someone resists your proposed change, ask yourself, “What do they know that I
    don''t know?”


    To answer that question, we''ve found it useful to think in terms of different
    layers of resistance, or layers of buy-in, based on a model from Eli Goldratt''s
    Theory of Constraints. There are several different formulations of this, with
    different numbers of layers, but we like Dr. K. J. Youngman''s:


    +   1. We don''t agree about the extent or nature of the problem.


    +   2. We don''t agree about the direction or completeness of the solution.


    +   3. We can see additional negative outcomes.


    +   4. We can see real obstacles.


    +   5. We doubt the collaboration of others.


    Start at the beginning of the list and look for where the resistance begins. Maybe
    the person agrees there''s a problem to solve but they''re not convinced your
    proposal actually solves it. Find out what they know about the solution; perhaps
    they''ve seen something similar in the past that didn''t work. You might be able
    to learn something from failure. Or, you might be able to persuade them that this
    solution is different.


    Maybe they agree the solution will work but they also see potential side effects.
    Again, what do they know that you don''t? Perhaps you need to add something to
    your proposed change to mitigate the side effects.


