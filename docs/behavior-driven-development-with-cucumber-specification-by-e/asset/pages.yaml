  md: '# CHAPTER 1 FOCUSING ON VALUE


    Most teams who adopt an Agile approach to their work do so because they want to
    get progress, feedback, and value earlier and more often. A process framework
    like Scrum provides a good structure for adapting this—planning and reviewing
    work in short cycles, frequently inspecting the process, and working from a prioritized
    backlog are all. But for most teams, there are missing skills that keep them from
    getting the results they want. Our aim is to teach you these skills. Throughout
    this book, we will see what it looks like for Mark and his team to learn this
    new way of working and how you can apply it to your own work.


    Mark''s team has been using Scrum with many organizations at first: They commit
    to big projects, with detailed scope in a requirements document, just like they
    before Scrum. They convert these requirements into a product backlog, by Scrum,
    but early sprints don''t really deliver potentially valuable increments. Instead,
    early sprints are heavy on architecture, infrastructure, design, and planning,
    with limited value for users.


    Of course, all this back-end needs testing. But until developers finally start
    exposing the back-end code via user-facing functionality, testers struggle to
    test it. Tes find themselves underserved in early sprints and overwhelmed in later
    sprints.


    The experience is for business stakeholders and users. In a project, there isn''t
    much to see and to provide feedback on. Later, there''s an overwhelming amount
    of stuff to look at and too little time to look at it.


    Eventually, on every project it becomes clear that the team isn''t going to hit
    the deadline for the required scope, so they move the date or look for places
    to cut features or after the overall scope. Unfortunately, many features that
    could be cut are already partially implemented and some of the most essential
    features might not have been implemented yet at.


    Susan is right to be concerned that the project would use up the whole budget
    without delivering something better than the off-the-shelf alternative. Working
    the same way tends to produce the same results.


    Some Scrum teams learn how to write user stories to capture small, completes,
    of functionality. However, unlike uncertain products, developers, and testers
    fundamentally change how they collaborate with each other, they still end up with
    a mini-waterfall in each sprint, as shown in Figure 1-1.


    The first step in breaking out of mini- (or full-scale) waterfalls is to find
    a meaningful, small, increment of value to begin with. Then, BDD can help teams
    grow a system by example, planning, building, and testing every day.'
