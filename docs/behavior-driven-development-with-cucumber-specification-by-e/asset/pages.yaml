    name''s Jonah. Maybe he can work with us on this.


    SUSAN: It''s worth a try. Why don''t you set up a meeting for the three of us
    in my office?


    # When Scrum Isn''t Enough


    Many teams go through the mechanics of something like Scrum but don''t actually
    have potentially shippable product increments at the end of each sprint, let alone
    during the sprint. They simply lay sprints and Scrum meetings over their work
    as they''ve always done it.'
