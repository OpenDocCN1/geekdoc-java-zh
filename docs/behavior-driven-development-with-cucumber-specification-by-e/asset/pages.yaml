    difficult to achieve with database-dependent scenarios, but it''s worth the investment.
    The same is often true with services and other outside dependencies. If your scenarios
    run slowly, they''ll run less often and the value they provide will quickly diminish.


    That said, speed sometimes in conflict with the other characteristics. For example,
    you might find yourself doing the same setup over and again to keep your scenarios
    independent. We recommend paying attention to the other characteristics first
    and turning your attention to speed only after building a decent suite of scenarios.
