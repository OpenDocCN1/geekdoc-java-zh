    Definitely keep the first couple scenarios to prove search works to end, but you
    don''t need to go on end to end for every search variation.


    # # Choose Cucumber Based on Audience, Not Scope


    A common misconception about Cucumber is that it''s for tests that drive application
    through the user interface. Teams often do drive their UI from Cucumber, but that''s
    not why Cucumber is the right tool. Cucumber is the right tool when you want to
    expose behavior to business stakeholders, regardless of the architectural layer
    at which step definitions drive the application. Unit tools like RSpec or JUnit
    are the right tools when the behavior only needs to be exposed to developers.
    Or put it slightly differently: Cucumber is for testing customer intent, unit
    test tools are for testing developer intent. In Chapter 3, we referred to these
    as Quadrant 2 and Quadrant 1 tests, respectively.


    In the previous dialogue, the team had begun to accumulate more and more scenarios.
    Users obviously care about search, it makes sense that the behavior should show
    up in Cucumber scenarios (Quadrant 2). Of course, they''ll use it through the
    UI, but this doesn''t require every search be automated through the UI. The logic
    in the UI is the same for any search, the team could drive the search API in isolation
    for most of the scenarios.


    To give the extreme case, Richard once worked on a team where it made sense to
    use BDD to drive the behavior of a single class. (This was before Cucumber had
    a viable .NET option, so we used a different tool, but we''d choose Cucumber today).
    This application had complicated logic to determine the risk associated with a
    prospective renter. It used the prospective renter''s credit and rental history
    along with various factors to produce recommendations about how risky the renter
    was, how much security deposit to collect, and the like.'
