  md: '# CHAPTER 7 GROWING LIVING DOCUMENTATION


    And the documentation and product will inevitably diverge. In a complex environment,
    we can''t know in advance exactly what we''ll be building and how we''ll be building.
    Doing the work reveals what needs to be done. So, it doesn''t take long for the
    actual behavior of the product to diverge from the documentation that describes
    what''s going to be built.


    Documents rarely go out of date all at once. Thus, people find having to wade
    through a mix of accurate and inaccurate information to make decisions.


    Living documentation is executable. If the behavior of the product changes, the
    documentation alerts us to the change. Sometimes, the change is intentional, as
    adding a new behavior requires a change to existing behaviors. Other times, the
    change is accidental, a regression defect. Either way, the documentation should
    tell us so we can respond by correcting the documentation or the behavior.


    Living documentation is continuously updated to stay in sync with the system it
    describes. In fact, one of the signs you''ve gotten the language and level of
    abstraction for a scenario right is if the scenario has change when the behavior
    describes changes... but only then. If a new, unexpected behavior breaks an old
    scenario, there''s probably extraneous detail in the old scenario. On the other
    hand, if adding a new behavior causes you to change how functionality works, you
    should have to change the old scenario. If the scenario doesn''t have to change,
    it''s probably too abstract and maybe even tautological (see Chapter 6, "Making
    Scenarios More Expressive").


    # Cucumber Features and Other Documentation


    Cucumber scenarios replace several common kinds of documents. They easily replace
    requirements and as-built functional documents. Cucumber scenarios describe the
    intended behavior of the system, both before and after development.


    In their role as automated customer-facing tests, Cucumber scenarios also replace
    detailed tests, test cases, and test scripts. Cucumber scenarios describe what
    examples should be tested for a particular behavior or rule. If we know in advance
    that we want to test a particular case, it deserves a scenario so the team can
    implement it correctly, building quality in.


    Finally, a suite of Cucumber features replaces, or more accurately, removes the
    need for traceability documents. The requirements are the tests. Want to know
    if the system actually does what a scenario says it should? Run the scenario:
    It will pass or fail.'
