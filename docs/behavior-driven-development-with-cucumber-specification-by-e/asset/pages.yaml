  md: '# Finding the Meaningful Variations


    Once you have the happy path scenario, how do you come up with the meaningful
    variations that will make your scenarios expressive and your user story complete
    without getting buried in noise?


    There are some heuristics, a bit of art, and a lot of collaboration in making
    this work. We tend to go through a series of questions to answer like these:


    +   * Where are all the places things could be different in the happy path? In
    other words, what are the variables/variations?

    * Which variable is most likely to change?

    * What''s an example of a change that causes a different outcome? What''s another
    change that causes a different outcome?

    * Where are the boundaries of that change? Explore both sides.

    * What could go wrong? Is there value for one of the variables that breaks-something?
    What should happen?


    Repeat for other variables.

    Testers are particularly good at identifying possible variations, but you need
    the product owner to evaluate whether a particular example is relevant and valuable.
    In exploratory testing, it''s great when testers consider variations no one else
