    be something like a few well-understood examples of typical and atypical books
    to illustrate behavior across many scenarios.


    Adopting the practice of actively seeking out shared data in scenario data will
    drive important team conversations about meaningful distinctions in the data,
    increase the overall level of understanding the business domain, reduce the volume
    and complexity of the test, and simplify data cleanup logic.


    Certain data is clearly shared: seed or default data like lists of states and
    countries. There''s no reason to explicitly create this data for each scenario.
    Unless your application is concerned with managing lists of states and countries.
    But if you''re spending your time on that application, you might have bigger problems
    managing test data.


    When working with shared test data, there''s a strong tendency for this data to
    become bloated, fragmented, and disorganized if just anyone can add to it. To
    avoid this, we highly recommend that someone on the team play the role of test
    data curator for the shared data. This role is responsible for working with the
    rest of the team to ensure that shared test data is consistent, expressive, documented,
    and sufficient for the team''s needs.


    Sam and Jane took this job in the previous dialogue. They''ll come back to the
    team with some examples of books with particular characteristics, and the conversation
    that ensures we create shared understanding about the domain and the distinctions
    that matter in.


    # When to Share Data


    Other data is specific to your domain and could be either scenario-specific or
    shared. When it makes sense to go shared?


    +   - When a shared Background step performs data setup for all, or many of, the
    scenarios in a feature file


    +   - When most of the data you are providing for each scenario has little to
    do with the specific behavior the scenario describes and you want to draw attention
    away from the shared data'
