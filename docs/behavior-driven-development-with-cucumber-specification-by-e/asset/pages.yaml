    Expressions parameter type. And this requires regular expressions.


    # Regular Expressions


    Regular expressions are the key to Cucumber''s flexibility. Well-crafted regular
    expressions let you reuse step definitions, avoiding duplication and keeping your
    tests maintainable. Even experienced developers find them mysterious and overwhelming.


    Frequently, you don''t need regular expressions just to wield the power of Cucumber:


    ```

    [?:([a-z0-9%$#*''/?\~`\-]+\||([a-z0-9%$#*''/?\~`\-]+\||[-])(\w+)))]*

    [?:\x01-x08\xb0c\x0e-x1f\x1fx23-x5f\x50-x5d\x7f-x7f\x90-x9f\xb0\xc0-xde\x7f\)]*

