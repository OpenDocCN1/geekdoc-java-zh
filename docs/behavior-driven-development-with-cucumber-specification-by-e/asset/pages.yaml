  md: '# Optimizing for Discovery


    You might be surprised that the team proceeds with work on this user story before
    nailing down the rules and examples. Rather than working in a series of phases—planning,
    analysis, development, test—the team is working iteratively in small cycles. They''re
    planning and analyzing a little, doing some test design, developing production
    code, a little more testing, going back to planning, and so on.


    The traditional approach to software development assumes we not only have a clear
    understanding of the goal of a software system but also the means to achieve that
    goal, and that we know well ahead of when the software needs to be delivered to
    the customer. There is no need to further explore the customer’s space, since
    we already know what the customer requires. The waterfall development process
    is the logical outcome of this kind of thinking: the means of accomplishing the
    goal are called requirements, and all that is needed for us to implement the requirements
    as software features. In industrial work, we need to manage for consistent, repeatable,
    predictable results; we want our goals to be clear and unambiguous. Waterfall
    development takes the same approach as industrial work.


    In knowledge work we need for creativity. We are generating something new rather
    than just improving the past. This means there is no way to precisely define the
    goal in advance, because there are too many unknowns. Software development is
    knowledge work, and Agile development is fundamentally a response to this situation
    of how to know the goal and how to change it to reach it. Agile promotes embracing
    and adapting to change. Thus, doing Agile development *optimize for discovery*,
    as the Manifesto for Agile Software Development says, valuing *responding to change
    over a plan*. Furthermore, Agile processes harness change for the customer’s competitive
    advantage.


    This ability to quickly learn is at the heart of agility in software development.
    The path to the goal is not clear, and the goal may be in fact change. An Agile
    team will start out with the intention of solving a customer’s problem in a certain
    way but discover their assumptions about that customer are wrong. They might discover
    that the real need is actually different from what they thought, which leads to
    a very different solution.


    There is no such things as ‘requirements’, there are only unvalidated assumptions.
    The goal of delivering MMFs is to validate our assumptions as soon as possible,
    in case they turn out to be false and we need to change direction. Agile development
    assumes that the specific destination is unknown, so we need to iterate our way
    there. Software development is inherently a discovery process.


    +   2. Gamestorming, p. 5'
