    # Fast


    Scenarios should run as fast as you can make them run. Scenarios that run quickly
    maximize the amount of feedback that the tests will provide and increase the pace
    of your ability to code and deliver features. Fast tests get run more often.


    Scenarios that interact with databases (via in-memory operations) are notorious
