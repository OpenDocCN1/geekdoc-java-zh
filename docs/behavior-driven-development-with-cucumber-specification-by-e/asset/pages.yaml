  md: '# Characteristics of Good Scenarios


    Across domains, the scenarios created by teams experiencing success with BDD and
    Cucumber show some common characteristics. The scenarios that such teams create
    are typically


    +   - Independent

    - Repeatable

    - Researchable

    - Realistic

    - Robust

    - Maintainable

    - Fast


    Let''s address each of these concerns in turn and look at their implications for
    scenario data creation and management.


    # Independent


    Avoid any sort of coupling between scenarios. The most common cause for this is
    that state persists between scenarios. This can be accidental, or worse, by design.
    For example, one scenario adds a record to a database and subsequent scenarios
    depend on the existence of that record. This might work but create a problem if
    the scenarios run separately, in a different order, or in parallel.


    In the dialogue, Raj had an unreliable scenario due to accidental coupling with
    another scenario created by Jane. One scenario was leaving behind database records
    that randomly caused another scenario to fail.


    Scenarios need to be *independent*. Scenarios that are isolated from each other
    can run in any order. They don''t have dependencies that cause failures for reasons
    unrelated to the actual behavior being verified. Each scenario set up its own
    context (i.e., in the *given steps*) with everything it needs to run successfully.


    # Repeatable


    Scenarios must be *repeatable*: when run over and over again, they produce identical
    results. A team cannot trust scenarios that give different results each time—passing
    sometimes and failing others. *Tests that cannot be trusted get ignored.* Ignored
    tests do not provide the value that justifies developing them in the first place.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# CHARACTERISTICS OF GOOD SCENARIOS


    A scenario''s job is to reliably describe how your system works. When you discover
    a nondeterministic scenario, find out what the problem is and fix it.


    Teams often create nonrepeatable scenarios by failing to control the state of
    the system in their given steps or by failing to clean up their mess after each
    scenario. They assume that the system is in the right state without ensuring that
    it is; thus, their scenarios become unpredictable, as we saw in the dialogue.


    # Researchable


    When a scenario fails, determining the cause of the failure needs to be as easy
    as possible. That is, scenarios must be researchable. It can be very frustrating
    to know that a scenario is failing, because the functionality is unimplemented
    or because existing functionality has changed but because of some unknown reason.


    The easiest way to researchability is to use specific assertions that will provide
    informative failure messages. Rather than ''expected true, got false'', you want
    a message like ''Expected title A Tale of Two Cities, got "Book".''


    To improve researchability, we include assertions in given steps so if the starting
    state for a scenario is wrong in some way, the scenario fails early with a clear
    error message.


    Raj and Robin temporarily added logging to their scenario to troubleshoot the
    unexpected failure. This is fine when troubleshooting a single scenario, but informative
    assertions would be a much more effective solution across their Cucumber suite.


    # Realistic


    Use test data values in your scenarios that are as close to real business data
    as possible. Make them realistic, avoiding the common tendency to utilize unrealistic-developer
    test data values such as User A, User B, Sample Address, User Name, and so on
    (like Author Mockface in the dialogue). Work closely with your testers, customers,
    and whoever may be helpful in finding meaningful data for your scenarios.


    Your scenarios should maximize collaboration, learning, and discussion by focusing
    on the real details of the actual business domain. Unrealistic data gets in the
    way of you. Use real data in your scenarios where possible, or sanitize by changing
    certain details if it contains sensitive or private information. The need for
    real data will force developers to discuss the scenarios with domain experts and
    testers. It will help the team identify significant data variations and drive
    towards a deeper understanding of the nuances of the business domain and the problems
    your team is trying to solve.


    In the dialogue, using unrealistic test data actually had a bug. The two scenarios
    Raj and Jane wrote that in the library''s system, it''s possible to add an ebook


    169'
