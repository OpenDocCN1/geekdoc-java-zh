    # Frequent Visibility and Legacy Systems


    Adopting BDD with a large legacy system poses challenges that teams working on
    new systems not have to deal with. The complexity of a legacy system can make
    it difficult to transform the system with a series of small changes—any change
    in one area can break the functionality in another area.


    This would seem to prevent frequent visibility. It seems developers on a legacy
    system need to make changes in batches. But there''s an alternative approach that
    fits nicely with BDD.


    The library team used a strategy sometimes called integrate and strangle to focus
    on adding value to a legacy system without having to wrestle with all the complexity
    of the existing code. They rejected the tendency to rewrite the legacy system,
    which would have them down a road littered with the burns of failed projects.
    Instead, they integrated new code and tools with the legacy system to provide
    valuable new functionality alongside the existing system, using BDD for Cucumber
    for the new features.


    In other words, augment existing systems by extending them, rather than modifying
    them, where possible. Wrap them in services, using approaches like REST to isolate
    your new work from the existing system. Over time, the new code can replace existing
    behavior and slowly strangle the legacy system. But at every point along the'
