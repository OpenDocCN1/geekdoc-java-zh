    [?:\x01-x08\xb0\xc0-xde\x7f\x1fx-x5a5-x53-\x7f\)]*

    ```


    In fact, if you use regular expressions like this in your step definitions, you''ve
    gone too far. With most things, the 80/20 rule applies. Only a handful of common,
