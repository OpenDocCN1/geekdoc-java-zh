  md: 'BEFORE YOU START WITH CUCUMBER


    13


    +   - Change my password

    - Change my account details

    - Cancel my account

    - Etc.


    Other times the MMF is big because it includes many business rule variations,
    which we could split across multiple stories. In Chapter 6, “Making Scenarios
    More Expressive,” we look at an example of the library team working on the logic
    around for returning books late. There are many different business rules for fines
    based on whether you borrowed a book or a DVD, for example, or whether you''re
    a child or an adult. These rules can be sliced into separate stories.


    Sometimes, it''s not the variety of rules that make a feature big but the variety
    of data needs to be tested through those rules. For example, maybe the library
    catalog needs to support multiple languages. The rules are the same for each language,
    but working with the different languages may reveal edge cases and bugs, such
    significant variation needs to be tested. You might choose to start with just
    one or two representative languages rather than supporting all of them from the
    beginning.


    Occasionally, a complex user interface makes a feature big. In that case, we could
    often slice the feature to use a simple interface first and enhance it with the
    full-featured interface later. This is particularly useful when the value or learning
    is mostly associated with the behavior rather than the interface, and the interface
    just adds incremental value.


    Often a feature has a simple core, a “happy path,” with many variations and enhancements.
    That simple core can be its own story, and then the variations can be grouped
    into several more stories. This approach helps focus on what really matters in
    a feature. You might not end end building some of the variations.


    # Choosing a Start To With


    So, you''ve split your MMF into a handful of user stories; which one do you start
    with? Does it even matter? An MMF, by definition, will be released as a single
    story. We''ve defined nothing less the MMF as less than marketable. So, we don''t
    worry much about prioritizing value within an MMF. Instead, we prefer to prioritize
    by learning and risk mitigation. We''ll look for a story that will teach us about
    the problem or solution. Often, this is the story that will get us the most feedback
    from a key stakeholder to confirm that we''re solving the right problem or solving
    it in a useful way. We can safely leave the least risky or least informative stories
    for last.'
