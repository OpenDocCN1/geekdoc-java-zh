    # Finding a High-Value Feature to Start With


    Susan and Mark''s First Meeting with Jonah


    Setting: SUSAN''s office.


    (SUSAN, MARK, and JONAH are sitting around a table next to a whiteboard.)


    MARK: Jonah, let me give you a little background before we dive in. We''re looking
    at creating a system to offer our digital materials like ebooks. Susan has heard
    from other libraries that nobody likes the offshelf options, so we''re considering
    making our own. But we don''t want to spend a bunch of money to find out our system
    isn''t any better. We''d like to work with you to see if we can get value and
    feedback earlier and more often in a cost-effective way.


    We''ve been using Scrum for a while, but we still work on big projects with releases
    at the end. It seems like we''re missing something.


    JONAH: OK, there are a few things we can do to Scrum to get you valuable and feedback
    more often. We''ll see if we can structure your product backlog to get to “releable”
    frequently, and we''ll look at something'
