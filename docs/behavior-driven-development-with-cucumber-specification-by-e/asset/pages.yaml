    # log in as the given role

    end

    ```


    Now, with the addition of ?: at the beginning of the group, it will perform as
    expected.


    > Tip


    > You might be wondering how the attribute can be and still matter Given I''m
    logged in as an admin. It turns out that in Cucumber, it doesn''t matter whether
    you use Given, When, or Then to define step definition. They’re all step definitions
    and are interchangeable. It''s fairly common for today’s when to tomorrow’s Given,
    as something moves from the feature under active development to a feature on which
    a new feature builds.


