    encourage you to roll with it and see where it takes us. Have fun with it. If
    any of you have concerns or questions feel free to grab me and I''ll do my best
    to address them.


    # BDD Is a Cooperative Game


    In Alistair Cockburn''s book Agile Software Development: The Cooperative Game,
    he characterizes software development as a “cooperative game of invention and
    communication.” In competitive games, like tennis, there is a clear notion of
    winning and losing. Even in team games, like basketball, one team wins and the
    other loses. But in cooperative games, people work to win together.'
