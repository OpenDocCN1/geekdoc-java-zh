    # The Perils of Misusing Cucumber


    Cucumber is a Quadrant 2 collaboration tool. This means scenarios ought to take
    the user''s perspective and developers ought to involve product people—business
    stakeholders, product owners, business analysts—in creating and reviewing scenarios.


    Some teams make the mistake of using Cucumber exclusively as a Quadrant 1 developer-facing
    tool. This leads to unnecessary technical overhead, brittle and slow test scenarios,
    and eventually unsustainable feature files. The value is simply not when testing
    Cucumber as a developer-facing tool.


    In “The World’s Most Misunderstood Collaboration Tool,” Cucumber creator Allard
    Helsey acknowledges Cucumber’s unique value is as a collaboration tool, not as
    a pure test automation tool:


    There is a certain of ceremony involved with Cucumber. There is both Gherkin and
    Step Definitions to maintain. This can be justified if it improves collaboration
    and reduces misunderstandings, but if the tool is used in a vacuum those benefits
    will obviously never happen.


    The same is true when using Cucumber predominantly as a Quadrant 3 tool by employing
    the same test-after approach used in many enterprise test tools or other open-source
    automation tools like Selenium. In this case, scenarios tend to look like manual
    test plans. They describe how a tester would want a behavior rather than what
    user wants the behavior to be.


    # Teams Already Doing Lots of Quadrant 3 Testing


    If your team does mostly Quadrant 3 testing, the bulk of your testing is done
    (manual or automated) after the software has been written, what are your options?
    Some teams write detailed test plan documents for activities in this quadrant,
    whereas many teams take a more ad hoc approach. Some teams create automated tests
    to verify the software after it has been written, while the vast majority of teams
    focus on manual testing. BDD with Cucumber has a place for each of these situations.


