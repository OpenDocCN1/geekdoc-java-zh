  md: 'CHAPTER 1 FOCUSING ON VALUE


    organized in slices that deliver value. If you don''t have good functional slices—if
    you''re building components or doing technical tasks—you''ll end up with scenarios
    that look more like developer-facing unit tests than like examples of valuable
    behavior from a user''s perspective.


    # Finding the First MMF


    An MMF is a good place to start. MMF stands for minimum marketable feature. It''s
    a small slice (minimum) of new functionality (feature) with enough of an impact
    to be worth getting in front of real users (marketable).


    This is analogous to the concept of a minimum effective dose (MED) in medicine.
    Consider, for example, acetaminophen, a common drug for pain relief. Taking 5
    mg has no effect. For a typical adult, 650 mg can make pain away for a few hours.
    But as little as 7500 mg can cause acute liver failure. More isn''t—it''s worse.
    We want to use a slice of drug as we can achieve the desired impact because drugs
    have side effects. This amount is the minimum effective dose. Likewise, developing
    too much of a feature causes delays, missed windows, opportunity costs, waste,
    and so on. We want to build the minimum amount of feature to have the desired
    business impact and no more.


    To get at first MMF or two from a big idea, we recommend a technique we call feature
    mining:


    +   1. Get a few people in the same room (or virtual equivalent) to represent
    both the business and the technical perspectives for this project.

    2. Brainstorm answers on a whiteboard or set of flip charts to these four questions:

    1. Where''s the value or impact? (Why is this worth doing? What benefits will
    go to whom?)

    2. What makes it it? (Why do we need to slice it at all? Is there many or of it?
    What always takes a long time, even if it''s always well understood?)

    3. Where are the risks? (What irreversible consequences could happen? Write these
    as statements of the risk being realized (for example, "We''re not able to optimize
    the performance enough for the reports to run overnight," not just, "Performance")).

    4. Where are the uncertainties? (What important questions do we need to answer
    for this to succeed?)


    2. Software by Numbers, Mark Denne and Jane Cleland-Huang, p. 55ff'
