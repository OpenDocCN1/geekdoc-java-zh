  md: '# CHAPTER 3 FORMALIZING EXAMPLES INTO SCENARIOS


    It''s common to see the same When used for multiple scenarios in a feature alongside
    different Given and Then steps—taking the same action in a different context often
    yields different results. For example:


    Scenario: Admins can edit catalog items

    Given I''m logged in as an administrator

    When I go to the catalog page

    Then I should not see an edit link by any catalog item


    Scenario: Non-admins can''t edit catalog items

    Given I''m logged in as a regular user

    When I go to the catalog page

    Then I should not see an edit link by any catalog item


    The scenario title should be short, usually no more than five or six words, and
    it should express what this scenario differs from the others in the feature. Test
    results will render the scenario titles the feature title like an outline, so
    scenario titles need not repeat information already covered by the feature title.


    # Multiline String Arguments


    Sometimes a step needs more data than can be provided on a single line. For example:


    When I create a catalog item with the description:


    > Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut et ipsum turpis,
    sodales mollis nulla. Vestibulum iaculis sodales felis in ultrices. Vestibulum
    dapibus lobortis facilisis Nulla vel orci nulla viverra. Nam vitae mauris mattis
    pellentesque semper non diam. Aenean elean nisi at dui semper.


    The double quotes before and after the block of dummy text indicate a multiline
    string argument. This value will be passed as a last argument to the matching
    step. (Remember the earlier dialogue, step definitions are the bits of code that
    run for Gherkin step when you run the scenario).

    The colon at the end of the step isn''t required by Cucumber. It''s a convention
    we use to tell human readers to keep reading the rest of the step.


    # Table Step Arguments


    Sometimes a step needs more data than can be provided on a single line, and that
    data can be structured into a table. For example:


    | Name | Email |

    | Chandra Khan | chandra@somedomain.com |

    | Denise Jones | denise@anotherdomain.com |'
