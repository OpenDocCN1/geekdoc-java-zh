    If you''ve already started with BDD as you''ve read the book, we hope you''ve
    begin to experience a different kind of collaboration, with multiple roles working
    around concrete examples to build just the right behavior for your customers.
    Remember to focus on collaboration first and test automation a bit second.


    If you''re about to get started, remember the slow lane from Chapter 2, "Exploring
    with Examples." You don''t need to change everything at once. Just pick a single
    user story to practice with each sprint. Slowly learn how to do BDD well in your
    context, text, and expand your time.


    If that sounds overwhelming, start even smaller: Just use examples more in your
    conversations about your product. That one simple practice will make your collaboration
    better. Automation can come later.


