  md: '# How Does User Experience Design Fit In To?


    and then start writing the scenario. But we wanted the desired behavior to inform
    the UI design, so we like to lead with the scenarios. To give the developer something
    to automate against and to prevent the automation code from having to change too
    much, we like to use an annotated UI sketch or mockup.


    The annotated mockup functions as the contract between step definitions that drive
    a UI and the UI itself. A minimal contract enables developers and designers to
    do most of their work in parallel. Precision lets the UI designer continue to
    experiment and evolve the interface without breaking the scenarios. Developers
    can automate scenarios even against a UI that doesn''t exist yet, while having
    confidence that they won''t need to redo their automation code when the actual
    UI gets implemented.


    # How Does User Experience Design Fit In To This?


    BDD doesn''t have to say about user experience design. This might lead some people
    to think that they shouldn''t be doing any user design (UXD) at all if they are
    doing BDD. They might say, "I thought we are supposed to keep prototyping and
    mockups separate from doing BDD, or not do them at all."


    In our experience, UXD will make a big difference to the success of BDD. UXD is
    the visual component of the sample-driven approach and is a wonderful complement
    to BDD. Because " applying UXD techniques better communicates what the software
    needs to.


    How do you decide where to start when exploring examples as you play the BDD game?
    Most people are visual thinkers, so it might be harder for them to follow along
    with purely text-based business examples or a formal "Given-When-Then" syntax.
    When walking through examples, we find that a quick sketch can help illuminate
    what is needed.


    We rarely talk through examples without drawing something on some kind of visible
    surface, such as a whiteboard or flip chart. We also often start with a mockup
    and use that to direct and guide the conversation about how the feature needs
    to work, especially for a new feature in an existing system or a feature that
    involves a lot of user interaction.


    There''s a virtual cycle creating mockups and distilling business examples. By
    "virtual cycle" we mean that UXD and BDD reinforce each other in ways that are
    greater than just the sum of the parts. With BDD we seek the business examples
    and business language that help us understand what the system needs to do, and
    with UXD we use those same examples and the same language to create diagrams and
    walkthroughs to further drive our understanding.'
