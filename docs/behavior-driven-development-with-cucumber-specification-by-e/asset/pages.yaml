    # Summary


    +   * Separate the discovery step of BDD from the formalization and automation
    steps. Discovery is divergent and exploratory. Formalization is convergent.

    * It''s often to formalize a first draft of a scenario with just a couple people
    and review it with a larger group to try to write scenarios as a large group.

    * In the Agile Testing Quadrants, BDD is a Quadrant 2 activity, producing business-facing
    tests that support development.

    * BDD is complementary to manual, exploratory testing (which fits in Quadrant
    3). It doesn''t completely replace manual testing.

    * Features and scenarios are formalized using Cucumber''s Gherkin language.

    * BDD is iterative, not linear. Don''t try to do all the discovery, then all the
    formalization, then all the automation. Instead, identify some key examples, formalize
    a few of them, begin automating and implementing them, and then repeat as necessary
    to complete a user story.


