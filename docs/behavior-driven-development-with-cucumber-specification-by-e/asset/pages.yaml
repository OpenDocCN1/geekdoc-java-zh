    # Growing Living

    Documentation


    We''ve seen how Cucumber can be used to support development of new behaviors in
    a system, but Cucumber scenarios live longer than the current user story. A suite
    of Cucumber scenarios is living documentation for the behavior of the system.
    In this chapter, we explore just living documentation means and why it''s better
    than traditional documentation, we see which a Cucumber suite replaces and which
    documents continue to be useful, and we discuss how to organize and main- your
    Cucumber suite to best serve you over the long haul.


    # What Is Living Documentation, and Why Is It Better?


    When we say living documentation, there''s an implied contrast with "dead" docu-
    mentation. Typical documentation is dead in two ways:


    +   - There''s no direct connection to the product itself

    - It gets out of date quickly


    Cucumber scenarios are functional documentation, a description of how a sys- tem
    is supposed to behave. This is an area where dead documentation problems are particularly
    acute. The best "dead" functional documentation is a snapshot of the desired or
    implemented behavior of a product at a moment in time. But there''s no way to
    tell what''s accurate or not—the documentation doesn''t alert us when it diverges
    from the product itself.'
