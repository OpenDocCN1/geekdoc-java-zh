    # Wildcards and Quantifiers


    Matching specific words is fine, but you often want flexibility to match a variety
    of

    strings. Table 4-1 shows some patterns for non-exact matches.


    Table 4-1 Regular Expression Wildcards and Quantifiers

    | Pattern | Matches |

    | --- | --- |

    | .* | Anything (or nothing), literally "any character (except a newline) 0 or
    more times" |

    | .+ | At least one of anything (except a newline) |

    | [0-9]* or \d | A series of digits (or nothing) |

    | [0-9]+ or \d+ | One or more digits |

    | "[^"]* or ""? | Something (or nothing) in double quotes A or (the question mark
    makes the preceding item optional) |


    # Capturing and Not Capturing


    When you put part of a regular expression in parentheses, whatever it gets

    captured for use later. This is known as a capture group. In Cucumber, captured

    strings become step definition arguments. Typically, if you''re using a wildcard,
    you

    probably want to capture the matching value for your step definition. If the

    When step earlier used regular expressions instead of Cucumber Expressions, it

