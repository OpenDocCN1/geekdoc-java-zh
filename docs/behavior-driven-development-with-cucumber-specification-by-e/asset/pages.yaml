    # How to Make Your Scenarios More Expressive


    In his Peak, psychologist Anders Ericsson points to the importance of powerful

    mental representations of a domain as a key to expert performance. Expert chess

    players, for example, think about the positions of the pieces on a chess board
    differently from novices. The experts see combinations of positions, relative
    power, lines

    of force, where the novices see only individual pieces in arbitrary places. This
    allows

    t experts to reason more powerfully about where to move next.


    Executive Cucumber scenarios build a

    mental representation of how the system is intended to behave. The better the

    representation, the better decisions they''ll be able to make about what feature
    to

    build next, how to perform exploratory testing, and how to avoid defects, among

    others.


    Poorly written scenarios can still function as automated tests. They keep you
    from\unknowingly breaking something in the system that used to work, but they
