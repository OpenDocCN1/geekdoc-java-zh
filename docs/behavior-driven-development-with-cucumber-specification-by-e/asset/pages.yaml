  md: '# CHAPTER 1 FOCUSING ON VALUE


    When we first started this approach, we were afraid we''d run into projects where
    the value and what made the project big were inextricably linked. If we wanted
    to get the value early, we''d have to take on the hard parts first. Surprisingly,
    as we''ve done this over and over with different clients, we''ve found that the
    biggest contributor to value and the biggest contributor to size is usually an
    80/20 pattern where a relatively small effort contributes a disproportionately
    large slice of value. Then, as diminishing returns have us to start doing the
    hard parts to claw out the rest of the value. (OF course, you can always stop
    with the 80% and move on to the next 20% slice of something else.)


    After a while, this process becomes more intuitive; Jonah was able to help Susan
    and Mark find a MMF by predicting value, effort, risk, and uncertainty without
    facilitating the metric described earlier. But when you''re first starting approaching
    projects in a new way, taking it by step builds the skills and mindset you need
    to eventually do this more fluently.


