  md: '# CHAPTER 8 SUCCEEDING WITH SCENARIO DATA


    +   - When you have standard domain-specific test data, such as


    +   - A commonly used list of standard medical providers in a health-insurance
    system


    +   - A list of test products and promotions used to drive purchases for an online
    retailer''s ecommerce website


    +   - Important date ranges (such as effective dates or expiration dates) related
    to insurance policy documents


    +   - Weather and terrain conditions for a fire simulation package


    Many teams employ a combination of shared and scenario-specific data. As they
    start to see similar data repeated across scenarios multiple times, they discuss
    it with the team and domain expert then refactor it by consolidating and standardizing
    it as data.


    # Raising the Level of Abstraction with Data Personas


    In some domains, shared data is more complicated than just a single book. A scenario
    might require dozens of different things set up in a particular way. To elegantly
    solve this problem, we use what we call *data personas*.


    In user experience (UXD), a persona is a concrete description of the type of user
    for whom the team is developing. They’re used to build user empathy and shared
    understanding of users by team members.


    We extend the concept of data personas. Data personas are simply known, shared,
    and collections of data. They may be typical users or UXD personas, or they may
    be like a standard story or weather model.


    For example, Richard coached a team working on a system to help university researchers
    manage labs and research animals. Most of their features has length Background
    sections with tabs to set up each researcher, their offices, their labs, and animals,
    and so on. From an independent scenario perspective, they were correctly setting
    up and tearing down the appropriate data for each scenario. However, these complex
    Background sections made the features difficult to read and understand. And over
    time, this introduced an increased amount of friction into their development efforts
    as they worked on each new feature. Adopting data personas as shared data solved
    this problem.


    To start with, the team introduced the persona of Jennifer in a particular building,
    a lab adjacent to her office, and a particular set of research animals. Deborah,
    also a researcher, had'
