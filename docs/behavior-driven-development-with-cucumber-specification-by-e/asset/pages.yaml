  md: '# CHAPTER 2 EXPLORING WITH EXAMPLES


    Games can also be finite or infinite. A finite game, like chess, is one that intends
    to have an end. On the other hand, an infinite game, like the game an organization
    or nation typically plays, is about prolonging one’s existence.


    Games can be finite and goal-seeking, like chess, or they can be finite and non-directed,
    like jazz, where the process is the focus—there’s not a defined goal that would
    cause you to “the song”.


    If we combine these ideas to a goal-seeking, finite, cooperative game, where a
    group of people work together to reach a goal as fast as possible. Software development,
    especially Agile software development, is a similar game. Software development
    is a finite, goal-seeking, cooperative, group-game.


    BDD is a subdiscipline of the game of software development. The emphasis in BDD
    is particularly placed on helping the team operate, innovate, and communicate
    during the game, with the intention of achieving the goal of creating valuable
    software more quickly and effectively.


    # BDD is a Whole Team Thing


    Teams who find their way into BDD via a tool like Cucumber often after the misunderstanding
    that BDD is a test automation approach mostly concerns testers and developers.


    BDD is a whole-team practice. It’s a way of structuring the collaboration required
    to build the right software. As such, involves all the roles on the team.


    Product owners bring an understanding of the customer and realistic examples of
    a user doing something with the software. Testers bring their unique perspectives
    on about what could go wrong; they’re at proposing examples outside the happy
    path. Developers understand the implications of a particular example on implementation
    and often have a good understanding of the existing system and the problems it
    solves. Technical writers contribute skills with language and empathy for how
    users talk about what they do in the system.


    Early in adopting BDD, collaboration tends to occur as a whole team. This allows
    the team to build a common language for their domain. Later, smaller groups can
    leverage that to collaborate, and the work they produce will be comprehensible
    to the rest of the team.


    Because we see so much in the whole team participating in the collaboration in
    BDD, we rarely teach public BDD classes. If only some team members understand
    how to work in this way, the team is unlikely to experience the benefits. Weve
    seen cases where just the testers or just the developers get excited about a tool
    like Cucumber and just end up doing automation, the least valuable part of BDD,
    in isolation.'
