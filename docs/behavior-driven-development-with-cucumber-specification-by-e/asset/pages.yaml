  md: '# Allow Time and Space to Learn


    Did you notice how Jonah warned the team it wasn''t going to be easy? Adopting
    a new way of working takes time and practice. It takes a willingness to muddle
    through until the new skills become natural. It''s easy to forget what we went
    through to adopt our current skills—they weren''t always as natural as they seem
    now.


    Sometimes it feels like you can''t afford the time to learn something new. Maybe
    someone committed to deliver a big project (with defined scope) by a particular
    date, and it doesn''t feel like you have any room to slow down. In that case,
    mining from Chapter 1 is your secret weapon.


    This release or project commitments that feel so fixed and overwhelming are usually
    fairly high-level. We know we have to deliver, say the new sales reporting by
    June 15. But within the bullet point of "new sales reporting," there''s high-value
    work and there low-value work. Feature mining gives us a way to focus on the high-value
    work and avoid the low-value work, making the deadline less scary and buying-some
    extra capacity for improvement.


    We also don''t recommend adopting a new practice like BDD for all your work at
    once. Instead, we recommend the "slow lane" approach. Say you''ve planned eight
    user stories in your sprint. Most stories will use your existing definition of
    done, which don''t include BDD. Choose one or two to be in the "slow lane" across
    your board (see Figure 2-1). For those, you''ll use the new practice. And you
    won''t feel pressured when you do because you''ve already agreed those take longer.


    The early adopters on your team who are excited about the new practice will tend
    to sign up for those stories, working out the issues and establishing patterns
    for those who prefer to "wait and see"


    After a while, expand the slow lane to three or four stories. Eventually, you''ll
