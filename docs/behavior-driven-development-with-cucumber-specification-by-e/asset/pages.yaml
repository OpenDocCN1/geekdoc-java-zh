  md: 'If you''ve used feature mining to find your MMF, you probably already listed
    the questions you need to answer and risks you need to mitigate. These lists can
    help you prioritize the stories.


    # Keeping It Minimal


    As you split MMF, you''ll think of new variations you weren''t aware of at the
    beginning. Remember the first M of MMF, minimum. Each story should earn its own
    into the MMF. Ask yourself questions, "Is this story essential to this MMF or
    is it something we could come back later?" You don''t want nice-to-have stories
    essential story wastage.


    # Summary


    +   - BDD is exploring desired system behavior with examples in conversations
    and formalizing examples into automated tests to guide development.

    - BDD is primarily a way of collaborating, not primarily a test automation approach.

    - Approaches like Scrum are good, but insufficient, because teams often do mini-waterfalls
    within or across sprints. BDD can help avoid mini-waterfalls.

    - A prerequisite to BDD is work organized into slices of value. We recommend minimum
    marketable features (MMFs) and user stories for this.

    - Feature mining can help you find your first MMF from a big idea.

    - You can split MMFs into user stories using patterns like thin slices through
    a workflow, stories for business role variations, stories for different operations,
    and stories for data variations.

    - Start with the story that will teach you or mitigate a key risk.

    - Keep your MMFs by making each story earn its way into the MMF.

    - Once you have at least one good MMF with at least one good user story (and a
    cross-functional team to work on it), you''re ready to proceed with BDD.


    # Reference


    Denne, Mark, and Jane Cland-Huang. Software by Numbers: Low-Risk, High-Return
    Development. Santa Clara, CA: Sun Microsystems, Inc., 2004.'
