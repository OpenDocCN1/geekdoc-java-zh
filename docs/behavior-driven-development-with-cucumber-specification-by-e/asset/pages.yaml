  md: '3. When you get more than one two answers to a question, identify the most
    important answers to each question, as shown in Figure 1-2. With a larger group,
    you might need to use a technique like dot voting to get a quick answer. To vote,
    give each participant three dot stickers per list. They can apply their dots all
    on one item in the list, or they can spread the dots across two or three items.


    | Value | Size | Risk |

    |---|---|---|n| What''s the value that makes all the others relatively unimportant?
    | What contributes disproportionately to the size of the effort? | Which risk
    is scariest or most likely to derail the project? |

    | | | Which uncertainty seems most critical to resolve? |


    **Figure 1-2** Identifying the most important answer to each feature mining question


    4. Brainstorm possible ways to slice the big idea that get you a good piece of
    the value, perhaps some risk mitigation and learning, but without all the things
    that make the project big. We we like to ask the following while pointing at the
    corresponding most important answers in each column:


    +   - “How we can get some of this top impact without taking on all this ‘bigness’?
    What if we just...”

    - “How we can mitigate this risk without taking on all this ‘bigness’? What if
    we just...”

    - “How we can answer this question without taking on all this ‘bigness’? What
    if we just...”


    5. Identify an MFF to start with. It''s often the intersection of more than one
    of your possible ways to slice.


    Once you have the first MMF or two, the next MMFs tend to follow pretty naturally.
    Occasionally, the first MMFs address a major risk or uncertainty, and after completing
    those, it''s necessary to do another round of feature mining with the new information
    you gained from building the first MMFs.'
