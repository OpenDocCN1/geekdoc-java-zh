  md: '# DATA CLEANUP


    # 177


    multiple labs and multiple sets of research animals for studies with different
    dates. John was a research assistant, without an office of his own, who contributed
    to Deborah''s lab work.


    Once they defined these works, they were able to say simply, Given I''m Jennifer
    or I''m Deborah, and all the relevant data would be set up in a single step.


    Of course, this works only if everyone on the team knows what it means to be Jennifer
    or Deborah in a scenario. We''ve seening teams make posters for their personas
    with all the relevant data. Distributed teams document this in a wiki page or
    on an intranet, but we find documentation becomes invisible and gets out of sync
    with the scenarios. Instead, we recommend documenting the personas in with what
    we call glossary scenarios along the lines of


    Feature: Data Persona Definitions


    Scenario: Jennifer the researcher

    When I''m Jennifer

    Then I should have only the following office:


    +   - Room Number | AB 123

    I should have only the following lab:

    - Room Number | AB 124

    I should have the following research animals:

    - etc


    The steps in this scenario would examine the shared data about Jennifer and actually
    assure that it''s defined correctly. This makes the definition of the persona
    viable and robust. If someone changes the data behind the scenes to make their
    scenario pass, the glossary scenario will break, revealing a conversation the
    team needs to have about their shared data.


    Sometimes, creating your test objects to support your scenarios can be a lot of
    manual work. There are many frameworks and tools available that can ease this
    burden. The factory_bot library (https://github.com/thoughtbot/factory_bot) is
    a popular Ruby example.


    # Data Cleanup


    Remember to keep your scenarios independent. Make sure each scenario has the data
    it needs and cleans up its mess with context. In the previous dialogue, the library
    team planned to try a simple strategy of tracking books created in each step definition
    and deleting them in an After hook. We like this as a starting point it''s fast
    and easy to understand.'
