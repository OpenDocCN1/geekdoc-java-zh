    \n# # Summary\n\n+   * As your suite of scenarios grows, managing test data will\
    \ be increasingly challenging.\n* Good scenarios\n    * Independent—They can be\
    \ run separately or in any order\n    * Repeatable—They run the same way every\
    \ time\n    * Researchable—When they fail, it's clear why\n    * Realistic—The\
    \ data looks like the real world\n    * Robust—They don't break from small changes\
    \ in the environment\n    * Maintainable—They can be easily understood and modified\n\
    \    * Fast—Take as little time to run as possible\n* Create shared data for things\
    \ common to many scenarios.\n* Use data personas to easily refer to complicated\
