  md: '# Example Mapping Gives the Discussion Structure


    Our favorite way to add light structure to this kind of discussion is with Matt
    Wynne''s Example Mapping technique.¹ In Example Mapping, the group builds a tree;
    the story has rules that are illustrated by examples. Assumptions and questions
    are captured on the side so the core discussion about examples doesn''t get blocked
    by side conversations. The result looks something like Figure 2-2.


    Discussions about examples necessarily lead to rabbit trails—side topics that
    could distract from the core topic—because reality is complex and interlinked.
    In the meeting we just looked at, the team allowed side topics to naturally emerge
    but retained focus on the core topic with a facilitation tool called parking lot.
    The parking lot is simply a place to capture things that are worth talking about
    but not right now.


    ![](img/f569b959b06ca7cd95474b5efdc48565_40_0.png)


    Figure 2-2 Example Mapping


    > 1. https://docs.cucumber.io/bdd/example-mapping/'
