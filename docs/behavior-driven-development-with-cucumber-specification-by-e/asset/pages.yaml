    # BDD Is Iterative, Not Linear


    In the previous dialogue Sam confused different mindsets and steps of BDD with
    phases. He wanted to work on the feature file once, polish it, and move on. There''s
    a temptation, particularly for development teams to use a waterfall lifecycle,
    to make BDD for a linear process. They see that BDD involves exploration, formalization,
    and automation steps and mistake this for a serial process. However, this could
    not be further from the truth. The reality is that teams using BDD refine and
    improve their feature files over time as they explore and learn.


    At any point, a team may switch from one example to another. They might be formalizing
    a feature and realize they need to jump back into exploration because they uncovered
    a case they hadn''t thought about, and to talk about examples to get better understanding.
    The same thing can happen when automating one scenario, new scenarios present
    themselves or further exploration of examples need to happen.


    It might be confusing in the dialogue where we had the team leave placeholders
    for the rest of the scenarios. Perhaps you''re wondering. "Shouldn''t we be trying
    to get the feature file correct and complete as soon as possible? Most teams need
    to create an initial cut of a feature file to use as a conversation starter, then
    iterate and refine it as they go. For a well-understood domain, the first cut
    of the feature file might be sufficient. Some teams start with the first example
    and take it through the entire flow of formalizing it as a scenario, then automating
    the tests as they implement the production code.


    Jonah says to "focus on the content for now rather than the syntax, format, or
    layout. Does this mean Gherkin is not important? No, we''re not saying that at
    all. But, there is a time and a place for formalization. Jonah dissuaded the team
    from formalizing the scenarios in this meeting because formalizing feature files
    as a group is a brain-storming activity. It can feel like a group of people all
    writing an essay together. Better to take that offline, have one or two people
    work on it, and return to present the results to the other participants to get
    their feedback on errors and omissions.


