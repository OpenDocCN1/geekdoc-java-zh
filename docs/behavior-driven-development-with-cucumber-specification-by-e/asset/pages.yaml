  md: '# Chapter 1


    # # Focusing on Value


    This book is about the practices and skills that a team collaborating every day
    to build the right software in small slices, a set of practices known as behavior-driven
    development, or BDD. Building on the work of BDD pioneers Dan North and Liz Keogh,
    where we define BDD as


    +   - Exploring desired system behavior with examples in conversations

    - Formalizing examples into automated tests to guide development


    Most resources for those who want to learn to practice BDD with Cucumber focus
    on the test automation part of BDD. Some of emphasis is due to the fact that most
    of the tools associated with BDD—tools like Cucumber—help with the formalization
    and automation parts of BDD. That, after all, is where you need softools most.


    In our coaching, however, we''ve noticed that teams need the most help with the
    collaboration part of BDD, the part where the least help is available. Once teams
    learn how to explore changes in system behavior with examples in a series of conversations
    and to capture those examples in expressive language, automating those examples
    turns out to be relatively easy.


    This book shares what we''ve seen best work for the collaboration side of BDD.
    We show how the collaboration flows into automation—you''ll learn enough to get
    started automating your examples with Cucumber—but we haven''t written a cookbook
    for automating tests with Cucumber. This is a BDD book that uses Cucumber rather
    than a Cucumber book that mentions BDD.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# CHAPTER 1 FOCUSING ON VALUE


    This emphasis is consistent with the Agile values. The first value statement in
    the Manifesto for Agile Software Development says, “We value individuals and interactions
    over processes and tools.” We first determine who needs to be involved and how
    they need to work, and then consider what processes and tools would support and
    amplify those interactions. Starting with a process or a tool easily leads to
    suboptimal results. So, before focusing on Cucumber, a tool, it makes sense for
    us to explore and understand the interactions Cucumber is designed to support.


    BDD uses examples rather than abstract specifications to explore the behavior
    of a system. In the same way, we''re going to use examples to illustrate the BDD
    way of collaborating rather than just talking about it in theory. Throughout the
    book, we observe as the software-facing large public library gets started with
    BDD. This will make it easier to see how BDD can help your team and anticipate
    what it might look like for your team to adopt this way of working together.


    The best way to understand the BDD way of collaborating, of course, is to experience
    yourself. Beginning in Chapter 2, “Exploring with Examples,” we suggest an approach
    to slowly and safely begin experimenting with BDD on your team. First, we need
    to lay the foundation to get started.


    In this chapter, our library team—and you—learn how to start a new initiative
    with a meaningful increment of value, which is an essential prerequisite for BDD.


    # Our Story Begins


    Initial Conversation Between Mark and Susan


    SUSAN: An executive at the library, responsible for all IT projects. Originally
    a librarian.


    MARK: The software team''s product owner, has worked for the public library for
    8 years in various roles; knows the business well but has limited experience in
    software development.


    Setting: The espresso bar at the main branch of the library


    (As MARK pays for his order, he notices SUSAN waiting for her drink at the end
    of the bar.)


    MARK: Good, how''s it going?


    SUSAN: I just got back last night from LibTech, the big library technology conference.'
