  md: '# MOVING FROM EXAMPLES TO SCENARIOS


    # 67


    is a pidgin language for describing the behavior of a software system in a way
    both humans and their computers can understand.


    Gherkin is a simplified language for programmers, testers, and product people
    to collaboratively describe examples of business scenarios and thus define the
    expected system behavior. Gherkin provides a small set of terms and sufficient
    structure to enable your team to write scenarios rich with business domain language
    with minimal effort. It''s neither a full-fledged programming language like Java
    nor a complete language like English, and that''s intentional.


    # Feature Title and Description


    Cucumber features always begin with the feature keyword (or the equivalent in
    another language) and a feature title. This can be followed by text describing
    the feature. This text can be whatever you like, for example:


    +   Feature: Library patron account reinstatement following full fee payment When
    a library patron''s card is blocked she cannot check out or renew materials. Payment
    of all fees reinstates her account.


    or as we saw in the dialogue above,


    +   Feature: Search for an ebook by title Library patron searches library catalog
    for a specific ebook so she can read it on her Kindle


    Cucumber treats any text between the feature title and the first Scenario or background
    keyword as the description.


    # Scenarios and Given-When-Then


    The core of the Gherkin language is the scenario, a concrete example of a feature
    in action. scenarios begin with the Scenario keyword followed by a title and are
    specified as a sequence of steps that each start with the keyword Given, When,
    Then, And, or Or.


    ```

    Scenario: Reinstate deactivated account

    Given library patron owes $13.85 in unpaid fees and fines

    When she pays the full amount

    Then she should have no fines and fees

    And her library card should be unlocked

    ```


    A step describes the main action being taken in the scenario. There should be
    only one step per scenario. A Then step asserts something about the state of the
    system after the When step changes the system state in some way. A Given step
    sets up the context required to execute the When step.'
