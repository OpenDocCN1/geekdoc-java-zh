  md: '# Opening


    The opening phase of the game is all about opening people''s minds, opening up
    possibilities and ideas for later exploration. The opening is divergent, as illustrated
    in Figure 2-4. Generating new ideas is maximized and all critique is deliberately
    set aside. It''s about getting as many ideas out in the open as possible and avoiding
    critical thinking and skepticism.


    ![](img/f569b959b06ca7cd95474b5efdc48565_54_0.png)


    **Figure 2-4** Opening (Divergent)


    The opening stage in BDD involves brainstorming examples that help the team understand
    the business domain. These examples are focused on the customer experience and
    are as close as possible to the reality of the business domain. The goal is to
    generate a variety of examples that help the team understand the business domain
    and the customer need they are trying to address. Some teams split into pairs
    or triads to maximize the diversity of perspectives and ideas. This stage may
    take only a few minutes or much longer, depending on the complexity of the domain
    being considered.


