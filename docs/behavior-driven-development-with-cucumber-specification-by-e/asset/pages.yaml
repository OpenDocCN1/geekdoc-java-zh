    # Exploratory Testing


    Rather than inspecting for quality in development and filing bug reports, testers

    in BDD actively engage in helping the team build quality from the beginning. They

    collaborate with product people and developers in identifying and specifying

    scenarios. Sometimes, they may participate in the automation of these scenarios.
    Sometimes,

    they even pair with developers as the scenarios pass so they gain an

    understanding of the implementation, as scenarios begin to pass, testers do

    exploratory testing to identify scenarios. And the cycle continues.


    Manual regression can take so much time that some testers are largely

    unfamiliar with exploratory testing. Elizabeth Hendrickson, author of the excellent

    book on the topic, Explore It, describes exploratory testing as "Simultaneously

    learning the system while designing and executing tests, using feedback from

    the last test to inform the next."


    In an exploratory session, testers use their experience, intuition, and heur-

    st to try new scenarios around the edges of the system''s current behavior. When

    they find something that doesn''t work as expected, they note a possible missing
    sce-

    nario for traditional testing with other team members and use that might to decide
    what to

    explore next.


    This is unlike manual testing in a few key ways. First, testers don''t

    intent to plan a whole set of test cases in advance. Instead, use the outcome

    of each test to inform where to go next. Second, they don''t waste time documenting

    every they test. If the system behaves correctly, they move on (unless they''ve

    identified a behavior that''s not documented well in the Cucumber scenarios).

    Finally, unexpected behaviors are used to drive collaboration and, ultimately,
    to help


