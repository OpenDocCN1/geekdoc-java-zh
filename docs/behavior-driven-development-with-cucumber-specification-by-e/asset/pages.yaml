    A discussion about which book to add to the catalog in Jane''s scenario would
    likely have revealed books in the catalog need to match books on Amazon.


    # Robust


    Your team must be able to trust its tests. Being robust means that scenarios do
    not break easily due to unrelated issues in the team''s software ecosystem. The
    underlying step definitions should be written with a level of care that makes
    them progressively immune to other things needing to change, as development environments,
    build scripts, database schema changes, or database locations. Tests should not
    break for reasons and should avoid unintended side effects on the surrounding
    infrastructure. Be wary of audit tables, database replication, triggering emails,
    and so on. Tests that fail for the wrong reasons undermine a team''s confidence
    in the capability of the tests to verify their application''s behavior correctly.
    When scenarios fail for the wrong reasons, fix them; don''t rerun them until they
    pass.


    One common source of fragility is a dependency on the system time. Leap years,
    holidays, and weekends can break scenarios. To make date-heavy scenarios, decouple
    your application from system time and set the time explicitly in your scenarios.


    Another common source of fragility is sharing systems with other users, such as
    running the Cucumber suite on a system also also used for manual exploratory testing,
    as we saw in the dialogue in Chapter 5, “Frequent Delivery and Visibility.” Avoid
    this by dedicating a system to your automated tests and maintaining control over
    its data.


    # Maintainable


    Maintainability means that tests can be easily understood and modified after they
    are written—even if it''s not the person who wrote them. Scenarios, and the underlying
    step definition that supports them, are code too and should be treated as such.
    Dale Emery writes, “Any time spent puzzling the meaning and significance of a
    test is a maintenance cost...these ''trivial'' maintenance costs add up, and kill
    test automation efforts.*”


    +   1. Dale H. Emery, “Writing Maintainable Automated Acceptance Tests,” http://dhemery.com/pdf/writing_maintainable_automated_acceptance_tests.pdf'
