    # How Getting to Done More Often Changes All Sorts of Things


    Having the system in a stable state creates opportunities around deployment, customer
    relationships, feedback, and architecture. Things that weren''t possible with
    work in larger batches become possible.


    On past projects, Susan wouldn''t have engaged the product so early. She wouldn''t
    have considered showing it in an executive directors'' meeting in the first weeks
    of development. But knowing that the system would behave predictably, albeit for
    a limited range of scenarios, she could easily show it to senior leaders to give
    them a better sense of progress than a typical status report would provide.


    In the same way, the team was able to experiment with their application performance
    in the production-like staging environment and safely experiment with architectural
    changes, supported by a safety net of passing scenarios.


    Good Agile teams already have this stability at the iteration level or, better
    yet, the user story level. BDD brings the measurement of "done" to the scenario
    level. Moreover, the need for scenarios to be represented as automated tests align
    the team around really getting done scenario by scenario.'
