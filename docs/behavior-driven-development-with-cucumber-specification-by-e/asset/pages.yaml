    JONAH (Coach): Right. The goal isn''t fun, that''s a good side effect, though
    I believe people who enjoy their work are much likely to be productive than those
    who don''t. Don''t mistake the word “game” for something trivial or just for children.
    Games are invented and used by many people, including novelists, military tacticians,
    mathematicians, game theorists, and corporate strategists.


    So, think of BDD more like a game than a process as we move forward. Like any
    game, it takes a bit of practice to learn it. And you shouldn''t expect to be
    good at right away, especially when it involves discerning goals and learning
    to work more closely together as a team to achieve those goals.


    Let me say, in this meeting we''ll be trying an approach that is going to feel
