    Rather than waiting to hand-write test plans after each piece of functionality
    is ready to test the functionality, teams using Cucumber can collaboratively define
    the expected behavior using concrete examples in feature files, and the programmers
    can implement the functionality to make the scenarios pass. Rather than using
    a serial, manual, "throw functionality over the wall", coders and testers can
    work together to understand, implement, and verify the requirements.


    Teams writing test plans typically benefit as testers collaborate in all aspects
    of the development process, including specifying the product for development,
    testing, and deployment. Testers bring a unique perspective and expertise that''s
    useful throughout development.


    Teams taking a less formal approach by doing all manually with no documentation
    at all may expect Cucumber to introduce more overhead. As we''ve mentioned, this
    is exactly what will happen. Feature files don''t replace manual testing; they
    supplement it. The subsequent test de-fragmentation of test automation takes away
    much of the repetitive, manual work from testers, enabling teams to focus more
    attention on ensuring the whole team is "getting the software right."


    Feature files do not replace manual testing, and teams may still get value from
    writing some test plans to automate the features by describing things that must
    be tested manually due to overhead or complexity in test automation. We''re not
    saying teams with an ad hoc specification and testing approach should be writing
    test plans but rather that feature files serve dual duty providing a greater level
    of rigor for teams lacking rigorous testing efforts.


    Another thing to keep in mind is that because feature files are plain text, it
    is common for teams to store them in their version control system (that is, Subversion,
    Mercurial, or Git) as part of their source code, giving the team a full version
    history. This enables teams to document and track changes to their executable
    documentation and collaborate on changes should there be merge conflicts.'
