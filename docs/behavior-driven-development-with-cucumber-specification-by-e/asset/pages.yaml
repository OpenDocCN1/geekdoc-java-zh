    JONAH: Sounds like it. Within MMFs, we''ll split the work into what we call user
    stories, small slices of system behavior that provide increments of value to users
    and some visibility into progress for you.


    An example story for this MMF might be: "In order to find the specific ebook I''m
    looking for, as a library patron, I want to search the ebook catalog by title."


    MARK: That makes sense.


    (JONAH writes the story on the whiteboard)


    MARK (Continues): Another one could be, "In order to actually read the book, I
    want to be able to check out an ebook to my Kindle."


    JONAH: Great.


    (Writes the story on the whiteboard)


