  md: '# Chapter 5


    # Frequent Delivery and Visibility


    Most software teams spend most of their time in an "in-progress" state, with the
    product only partially working, punctuated by occasional moments of "done" when
    deadlines hit. Teams using BDD can be in a stable done multiple times per day.
    This creates opportunities for earlier and more frequent feedback from testers,
    product managers, stakeholders, and customers.


    In this chapter, we look at the many ways a team''s behavior might change to take
    advantage of more frequent delivery and increased visibility. We pay particular
    attention to how the tester''s role changes in BDD.


    # How BDD Changes the Tester''s Role


    A good tester is a good question. What happens when the user starts from this
    context instead of that? What might produce this outcome instead of that one?


    Much of manual testing is asking the same questions over and again. Testers don''t
    do this; computers can. Indeed, computers can do it better. They don''t get bored
    or distracted. If we trust the computer to keep the questions we already know
    about, we can free the tester to ask new ones.


    In BDD, testers bring this to bear in two places: when the team is first exploring
    the behavior of new stories and when the known scenarios pass and it''s time to
    discover new ones that ought to pass but not yet. In the following dialogue, we
    see both. Jane has helped the team discover and refine the initial set of scenarios,
    and she explores the boundaries of the system''s new behavior to find other scenarios
    that might be missing.'
  merge: -1
