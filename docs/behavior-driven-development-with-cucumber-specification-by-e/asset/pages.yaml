    are the focus. You want to create the conditions where "unexpected, surprising,
    and delightful things" emerge. Figure 2-5 illustrates the nonlinear, emergent
    nature of the exploring stage.


    In BDD, this stage builds on the energy and ideas that flowed into the room during
    the previous divergent stage, exploring the examples generated to see patterns
    and missing concepts and scenarios. If the team split into subgroups, this is
