  md: 'nice to have real, working slices of new functionality before getting to the
    end of the MMF. You could organize your work around architectural components and
    tasks—as many teams do—but these tend to mislead you about progress and limit
    your ability to get quality feedback along the way. Instead, we recommend slicing
    an MMF into user stories.


    # What''s a User Story?


    A user story is a description of a change in system behavior from the perspective
    of a user. Each story should add an increment of value, but you will likely have
    to accumulate a handful of stories before you have enough value to be worth splitting
    (hence the MMF). Nonetheless, user stories are complete slices of new behavior,
    which give a better indicator of progress toward the MMF and a better increment
    for seeking feedback from stakeholders.


    Stories often follow the format: "As <role> I <action/feature> so <value/goal>."
    Or, sometimes stories will use an alternative format: the important thing though,
    What''s important is answering the questions raised by the template: Who wants
    this? Why do they want?


    To that end, teams use stories rarely write a story in one of formats. Instead,
    they''ll answer the three questions in different places. If a story is for the
    main role, which is described in a product vision, they''ll use a short, two-to-four
    word title at the top of the story or in the story title field in a digital tool.
    And they''ll just write the "why" on the card or in the story description field.
    It looks something like that shown in Figure 1-3.


    So how do you get user stories from an MMF? Just as you did with feature mining
    to slice a big into MMFs, you can ask the four questions about value, size, risk,
    and uncertainty. At the MMF level, you''ll have enough of an understanding of
    value, risk, and uncertainty from doing feature mining that you won''t need to
    formally answer those questions. The interesting question here is, "What makes
    this particular MMF?


