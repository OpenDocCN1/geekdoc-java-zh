    # Slow Is Normal (at First)


    Learning a new practice takes time. In a book, this is almost too obvious to say,
    so on an actual project, it''s easy to forget; it''s easy to become impatient
    and give before you really get going.


    To space for learning when adopting a new practice, we recommend what we call
    the slow lane approach in Chapter 2, “Exploring with Examples,” This becomes particularly
    important with the automation of BDD for two reasons: First, automating your first
    few scenarios takes a long time. It''s a new skill using tools, and the first
    scenarios take the cost of a lot of basic setup and infrastructure. Second, early
    automation usually isn''t very good. It takes time to learn which patterns work
    in practice and which don''t. It''s better to learn slowly, with a small number
    of scenarios, than to scale your automation before you learn how to do it. For
    this reason, we encourage teams to still use the slow lane, even when everyone
    is enthusiastic about starting.'
