    happens when Vero, a sophisticated, ‘upper-class’ white woman, hits something
    on the road. She is not sure whether it is a boy or a dog. Without any firm evidence,
    she convinces herself that she has not killed a boy, only hit a dog. A few days
    later, when she reports that a boy’s dead body was recovered from the location
    of the accident, she dismisses it as mere coincidence. Nobody knows the facts
    of the boy’s death, and nobody wants to find out because he came from a poor indigenous
    family. The boy is a hybridized symbol of the immersed sections of Argentine society—the
    marginalized indigenous population and the ‘dis’ persons during the military dictatorship.
    Martel uses subtle clues to show the perseverance of “the terrible national id
    that [underlay] the neoliberal superpower” in the 1970s military rule and the
    present-day neoliberal regime in Argentina.¹⁰ The song “Soleil, Soleil” plays
    in the background on Vero’s car stereo just before the accident. The song used
    to be popular among “people who were not participating politically—who ignored
    the dictatorship.”¹¹


    Like the disappearance during the dictatorship, the boy’s ‘disappearance’ does
    not cause any inconvenience to the bourgeois section of society. A few calls from
    Vero’s family to the police and the hospital staff are all that is needed to destroy
    any records that might suggest her involvement in the incident. Vero and none
    of the other family members are guilty of any violence. Their distance from the
    actual crime, their race, and their social class create a contrapuntal symbolism
    to the dead boy. Vero and her family represent bystanders who believed themselves
    to be extraneous to the violence of dictatorship, as well as the white bourgeois
    class who are indifferent to the visible impoverishment and precaution of their
    proximity. Martel explains in an interview that “what was important or relevant
    wasn’t finding out whether actually killed somebody but reaction to what happened.”¹²
    By leaving the details of the boy’s dead vague, Martel shows the perdurance of
    a collective unwillingness to acknowledge the fact of visible violence—political,
    social, and economic, in the society.


