    # Lucrecia Martel’s Salta Trilogy


    # A (Trans)National Bildungsroman

    of Female Sexuality


    Java Singh


    Lucrecia Martel is part of the *Nuevo Cine Argentino* (NCA) that includes filmmakers
    like Anahí Berneri, Pablo Trapero, and Lisandro Alonso. As with any grouping that
    brings together poetics and rhetoric, the practitioners of NCA offer “heterogeneous
    cinematic designs,” sharing “distancing from the established aesthetics of films
    of renowned Argentine cineastes of the previous decade and also with [. ..] more
    commercial cinema.” Two key elements contribute to the ‘newness’ of the NCA. First,
    their filmmakers adopt a novel perspective in their criticism of the violence
    perpetrated by the state during the military dictatorship’s “Dirty War” in Argentina
    (1976–1983). They tend “to avoid the allegorical narratives, political posturing,
    and denouncement of injustice that had marked the films of their predecessors”
    and equally refuse “to buy into the ‘feel good’ memory politics of Kirchnerism.”
    Secondly, as Geoffrey Kantaris has points out, NCA is “a cultural reaction to
    the widespread imposition of neoliberal structural readjustment-policies—a kind
    of *de facto* facto infiltrated dictatorship.” Whereas the first two distinguishing
    aspects of NCA represent its ideological stance against authoritarian government
    and neoliberalism, the third is a rhetorical shift. The politics of *NCA* is articulated
    through a grammar of staccato spatial contrapositions and nonverbal soundscapes,
    while conventional strategies involving character, plot, and dialogue are deprioritized.


    This chapter examines how Lucrecia Martel’s Salta trilogy, an epitome of NCA,
    succeeds in establishing refer refer frameworks for transnational comprehension
    despite being anchored in recent Argentinian history and politics. The three films
    show stylistic and generic consistency'
