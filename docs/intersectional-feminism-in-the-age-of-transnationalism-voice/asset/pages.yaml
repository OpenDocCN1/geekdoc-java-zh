    Rosita Scerbo


    This coalition of identities can be observed in Laura Aguilar’s photographic work
    that creates dialogue and conversation, merging the US and the Mexican national
    identity’s experience. In conclusion, it is essential to direct attention to the
    enormous contribution that the field of intersectionality studies is providing
    to feminist research and scholarship. Women authors and artists, like the Mexican
    American photographer Laura Aguilar, identified the importance of integrating
    intersectionality into the development of feminist activist work. She demonstrated
    that it is not enough to create a dialogue with categories of domination according
    to gender dimensions. We cannot forget that the powerful Western patriarchal system
    is, indeed, articulated and constructed around other classifications, social classes,
    racial and ethnic groups, to sexual identities and nationalities.


