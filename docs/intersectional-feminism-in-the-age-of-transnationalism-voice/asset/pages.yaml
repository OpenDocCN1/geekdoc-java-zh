  md: '# # Chapter 2


    # ## Tuning In


    # ## Intimacy and Networks in Diamela

    Ellt’s Fuerzas especiales


    Sowmya Ramanathan


    # ## INHERITED INEQUALITIES


    In October of 2019, massive public demonstrations erupted in Santiago,

    Chile, over a 3.75% hike in public transportation fares. At the center of the

    protests were Chilean students who organized a widespread evasion of fares

    in protest of one of Latin America’s most expensive “public” transportation

    systems, the TransSantiago. In reality, the protests were precipitated

    by the fare increase, they immediately pivoted to calling out a broader set

    of issues brought by political and economic policies that have produced

    profound social inequalities in Chile, including the privatization of water and

    electric, the chipping away at pensions (AFPs) for the elderly, the impunity

    given to the wealthy and corrupt government officials and businesspeople,

    and the violent policing of poor neighborhoods. Protestors identified the 1980

    Constitution, written and drafted by Augusto Pinochet’s military government,

    as the origin of many of these issues. Ratified seven years after the 1973

    coup d’état, this document provided impunity to the military as it carried out

    a systematic and violent elimination of its opposition and paved the way for the

    country’s “economic miracle,” based on privatization, deregulation, and

    unbounded economic liberalism, which marginalized an overwhelmingly

    large fraction of the population. Seeking the date for a plebiscite, if accom-

    plished, is one accomplishment in a long list of proposed social and civil

    reforms to draft a new Constitution and reduce the vast inequalities produced

    sustained during the country’s seventeen-year dictatorship and transition

    to democracy.'
