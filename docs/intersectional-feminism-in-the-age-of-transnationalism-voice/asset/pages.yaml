    In developed countries, growing class divides became visible as a result of the
    divergent reactions to workplace shutdowns among those jobs can be moved into
    “the Cloud” and those who are tethered to physical locations by the nature of
    the work that they perform. The COVID-19-related quarantines, which many perceive
    as a nuisance, are in fact, a privilege that is inaccessible to those who already
    live in precarious situations. Ingar Solty, senior fellow for Peace and Security
    Policy at the Rosa-Luxembourg-Stiftung, observed:


    It is the workers who are risking infections by going to work, who are risking
    infecting their elder and sick relatives ... It is also they tend to live in cramped
    living conditions. It is therefore they are running a much higher risk of stress,
    marital strife and domestic violence ... It is those who are forced to choose
    whether not to work or go to work and risk killing their elder relatives through
    infections they bring home or through having their own children infect.


    In the post-COVID-19 era, it is very likely that class divides will deepen as
    global economy enters into recession and desperate job seekers attempt to prove
    their usefulness in the world that is still reeling from the pandemic.⁹


    As the newly unemployed and increasingly desperate protesters start to express
    their disagreement with the effectiveness of extended quarantines, it has become
    clear that there is little sympathy for their plight among those who can work
    remotely and can afford the luxury of an indefinite term of self-isolation. As
    Glenn Harlan Reynolds observed in a USA Article in late April, “there really are
    two Americas here: Those still getting a paycheck from government, corporations
    or universities, and those who are unemployed, or seeing their small businesses
    suffer due to shutdowns. And the America still getting paid is, so far, not having
    a lot of sympathy for the America that isn’t.” Of course, COVID-19 did not create
    the class divide between those who have digitalization of the economy and those
    whose professions and economic stability have been wiped out to make space for
    the digital economy.¹⁰ Class divisions have been growing globally throughout the
