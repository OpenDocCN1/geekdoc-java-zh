    # SUBALTERN REPRESENTATION


    There are at least two overlapping but conflicting discourses which shape the
    question of subaltern representation. One is the poststructuralist critique of
    the unitary subject as a construct which both denies and essentializes. The other
    is the politics of identity, which asserts the necessity of posing a subject with
    voice and agency. The split between these two discourses creates a double bind:
    the oppressed subject and the intellectual who theorizes her are caught choosing
    subjectivity within the terms of the dominant discourse or on the other hand,
    relinquishing the possibility of representation. Describing this double bind,
    "The radical intellectual in the West is caught in a deliberate caught of subaltern,
    granting to the oppressed that very expressive subjectivity s/ he criticizes,
    or instead, a total unrepresentability."48 Anzalúa offers a way out of this impasse
    by identifying politics of the divided/multiple subject, a subject between cultures,
    languages, and races. She theorizes this state of betweenness as a physical and
    psychic territory that she calls the borderlands. The inhabitants of the borderlands
    are defined by their divergence from hegemonic racial, cultural, and sexual identities:
    "Los atravesados live here: the squint-eye, the perverse, the queer-themong, the
    mulatto, the half-blood, the half-dead; in short those who cross over, or through
    the confines of the ‘normal.’"49


