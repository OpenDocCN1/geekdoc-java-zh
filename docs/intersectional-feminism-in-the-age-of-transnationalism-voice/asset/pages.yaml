    between the place where they live and their place of origin. In the process, Edwidge
    Danticat and Ortiz Cofer the writers discuss their own experience as immigrants
    in order to transform it into a stable construction of identity. The transnational
    identity can be defined by the metaphor of the ‘ajiaco’, as it used by Fernando
    Ortiz, in which some elements come together while preserving their distinct qualities.
    These narratives emerge from multistoric and political experience and seek to
    construct a more inclusive and diverse identity.


    Interestingly enough, these novelists write in English, placing their fiction
    in the web of the United States, and a reconstruction of the self that the transcultural
    process enters, as they find themselves located between two worlds, two languages,
    and ways of understanding the world. The characters are neither here nor but in
    a new hybrid space, articulating how migration redefines gender and national identities
    by reconstructing the contested spaces of the body, of the land and sea. Focusing
    on the relationships of power, the writers servlet the migration by placing their
    fictional characters in a moment of flux between the “here” and the “there”; formatting
    and leading into a narrative that is marked by the transnational paradigm. Concurring
    with Ferreira Pinto-Bailey’s discussion on identity, Danticat and Ortiz Cofer
    ‘rewrite the ‘major narrative’ of the nation through ‘minor narratives’ or the
    microhistory of previously invisible segments of their society through the life
    stories of everyday individuals whose experiences seem irrelevant in the large
    scale of national history.


    Danticat and Ortiz Cofer tell tales of migration, exile, assimilation, and integrity
    of self, announcing new embodiments of the self that are based on their own physical
    experience and also on a communal experience. I concur with Roger Celeste, Elaine
    DalMolin, and Isabelle de Courviron regarding fiction that these authors “use
    their writing most to express a feeling of loss with regard to their country of
    origin while also participating of a new type of freedom as women living in the
    West. The challenge is to retain or rebuild their sense of identity outside any
    form of acceptable home.”⁴⁴ Danticat and Ortiz Cofer’s preoccupation with identity
    points to their efforts to make connections to history and multiple national and
    historical issues, in order to present an identity in flux that informs the transnational
    experience. I would like to stress, however, while the writings emerge through
    a common historical process, this does not mean that the writing cannot be reduced
    to commonalities, but rather, that it invites the reader to recognize and explore
    the differences that constitute a transnational reality.


    Danticat’s and Ortiz Cofer’s works generate dialogues and testimonies that serve
    as agents for transformation. They focus their attention on the past,'
