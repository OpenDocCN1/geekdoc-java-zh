    COVID-19 quarantines end and resume lifes (at least to a degree), the already
    existing trends toward the disempowerment of the nation-state will be strengthened
    by the demonstrable weakness of national governments around the world in the face
    of the pandemic. Especially striking in this context has the contrast between
    the rapid spread of the deadly virus and the slow-motion response of the democratic
    governments of developed nations that are constrained by “political interventions
    driven by consensus[that] appear slow, coarse, and boring” in comparison to the
    frenetic activity of the global information networks which most of us use to access
    news about this and other crises.¹21


    The delegitimization of the nation-state model of governance is not a new development.
    It has accompanied the remaking of the world economy along the lines of the neoliberal
    globalization that has been taking place since the 1970s. In place of the nation-state
    system of governance that has begun to form. It does not have a settled name but
    has been termed, by various scholars, as “market-state,” “a postnational,” and
    following the line of reasoning proposed by Francis Fukuyama,.²² As nation-states
    under the assault of globalizing forces, the term ‘transnationalism’ becomes particularly
    useful to refer to the phenomena that occur in the tangible and intangible spaces
    between the weakened nation-states. Transnationalism is a result of globalization
    that the two terms do not be confused: “Transnationalism overlaps globalization
    but typically a more limited purview. Whereas global processes are largely decentered
    from specific national territories and take place in a global space, transnational
    processes are anchored in and transcend one or more nation-states.”²³ Simply,
    transnational phenomena are a small part of a large process we know as globalization.


    Transnationalism has attracted a lot of scholarly attention in the past few decades.
    There have been many debates about the precise meaning of the term ‘transnational’
    and the way it differs from concepts with partially overlapping meaning, such
    as multicultural, transcultural, transborder, and global. While there are important
    differences between the phenomena denoted by these, they all arise from the reality
    of the weakening of the nation-state and its institutions as a result of the transformations
    in the global economy that have occurred since the late 1970s. In this volume,
    have decided to forego an extensive discussion of terminology and have, instead,
    concentrated on different manifestations of transnational phenomena and their
    interactions with intersectional feminist scholarship. The contributions to our
    volume discuss such varied topics as works of fiction by Edwidge Danticat, Judith
    Ortiz-Cofer, and Diamela Elit; visual art of Laura Aguilar and Maruja Mallo; films
    directed by Lucrecia Martel; a TV series based on'
