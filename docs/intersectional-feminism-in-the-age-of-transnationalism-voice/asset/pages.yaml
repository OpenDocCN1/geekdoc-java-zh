  md: '# Chapter 3


    # Transculturation and the Body


    # Edwidge Danticat and Judith Ortiz Cofer


    Raysa E. Amador


    In reconstructing and representing transnational experiences within the space
    of fiction, Edwidge Danticat and Judith Ortiz Cofer articulate individual differences
    with regard to their ethnic and cultural heritage. The writers present the local
    and global inequalities that reflect their transnational experience as both produce
    literature that moves from the confines of a conventionally national repertoire
    to a representation of their own experience. Danticat and Ortiz Cofer construct
    a space where identity is informed by weaving history and fiction to create an
    imaginary context that is informed by a connection to multiple national, cultural,
    and historical issues. Their cultural voices ask for a renewed debate on national
    identity and the role of the fictional space they create in the articulation of
    different kinds of identity. These writers treat the woman''s experience as homogeneous
    to examine how systems of discrimination overlap in what Grabe and Else-Quest
    called transnational intersectionality. Grabe and Else-Quest argue that


    transnational intersectionality places importance on the intersection among gender,
    ethnicity, sexuality, economic exploitation, and other social hierarchies . .
    . Thus, because understanding gender oppression at the intersection of other imbalances
    of power is increasingly imperative in a globalizing world, transnational nationalist
    actors can and do use of international data to advance local cases.¹


    Danticat and Ortiz Cofer call into question the essence of difference and identity,
    providing occasions for a self-narrative of culturally marginalized people and
    integrating memory into this constructed identity. Their characters'' representation
    relies on their migration experiences, finding difficulty in speaking of any given
    national identity since they are negotiating constantly'
