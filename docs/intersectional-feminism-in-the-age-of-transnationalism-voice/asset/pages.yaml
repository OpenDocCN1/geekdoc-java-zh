    actively in their work. The title of one poem, “To live in the Borderlands means
    you,”62 insists we recognize the multiple communities to which we belong and deamine
    the conflicts, as well as the connections among them. This poem ends,“To survive
    the Borderlands / you must live sin fronteras / become a crossroads.”63 Anzalúa
    transforms the borderlands from a space in which she is caught among conflicting
    loyalties and overlapping oppressions into a space in which she remaps and reveals
    her cultural identity.


    The value of remapping for less marginal subjects is highlighted in Minnie Bue
    Pratt’s autobiographical essay “Identity: Skin Blood Heart,”64 which also transforms
    identity into essence, or from “nature” into action. Pratt, a white woman of privileged
    class origins who has entered the sexual and racial borderlands, shows in this
    essay how the (childhood) “home” she was taught to associate with “safety, comfort,
    [and family”65 revealed that the price of its protection was conformity and obedience.
    Anzaldua was limited by what she was denied, Pratt has been limited by what she
    was given. Pratt says,


    the safety of my childhood was because Laura Cates, Black and a servant, was responsible
    for me; that I . . walks with my father the words were “ours” by systematic exploitation,
    instigated, at that time, by his White Citizens Council; I was allowed one evening
    with month woman friends because I was a wife who would come home at . . I had
    no understanding of the limits that I lived within, nor of how much my memory
    and my experience of a safe space was to be placed on places by omission, exclusion,
    or violence, and on my submitting to the limits of place.”66


    One of the gains she cites as a result of this realization “a way of looking at
    the world that is more accurate, complex, multi-layered, multi-dimensional, more
    truthful to see the world of overlapping circles, like the movement on the millpond
    after a fish has jumped, instead of the courthouse square with me in the middle.”67
    Pratt discusses her losing an inherited or “natural” community, a fear she relates
    to “the fear of loss of self when we discover the connections between racism and
    anti-Semitism and our life as women.”68 Her essay reshapes identity in terms of
    rupture, struggle, or as Anzaldua, a process of “putting” history through a sieve”69
    that enables her inherited community with a chosen one she builds as she reshapes
    her personal identity. So Pratt is able to cross barriers of class, race, and
