  md: 'and technological economy.\^5 Looking at the bloque in Fuerzas especiales,
    the erosion of state protection is clear: the once social housing project has
    become a shantown squat, in which the inhabitants enjoy no social or legal protections;
    in addition, the characters are generally unemployed or restricted to the informal
    or illegal economies, working as street vendors or sex workers. They are also
    intensely aware that their highly policed reality is not unique to the bloque.
    as the protagonist states: "But that happens in the corners of the earth ... where
    the detectives and policemen attack each other for scraps they recover from the
    incomes in the bloques, in the villas,*7 and in the agglomeration of the favelas."
    The inhabitants of the bloque are of a growing population of what Renduelle has
    called the "fragile subjects" of postmodernity.^8 and their knowledge of their
    interconnectedness within this contemporary reality sheds light on the fate of
    increasingly large populations subjected to precarious living and labor conditions.


    Renduelle studies the effects of cyberutopianism—the unquestioning celebration
    of cyber-space and the internet as a horizontal and egalitarian ideal—upon contemporary
    social relationships, and he is particularly astute in coining the term "sociophobia"
    to refer to a kind of contemporary individualism that rejects traditional forms
    of social ties as outdated, old-fashioned, or reactionary. He argues, "postmodernity
    has sped the destruction of traditional social ties, though the continuity of
    employment, interpersonal relationships, and political loyalties in the air."9
    In their destructive tendencies, the processes of postmodernity that Renduelle
    produces produce fragile subjects, who cling to a subjectivity stitched together
    by atomized and individualized experiences, redefining traditional forms of relationship.
    In Fuerzas especiales, this is evident in the portrayal of the "family" as a formation
    that teeters on the brink of disappearance, which we observe in the novel''s first
    chapter in which the protagonist narrates numerous losses her family has suffered.
    She recounts that her two brothers are now incarcerated, while her sister remains
    at home, battling depression after the state removed her two young children from
    her custody. Furthermore, it is not only the protagonist''s family that experiences
    the reality of family separation. The fellow residents of the bloque, el Cojo
    Pancho, who sells fricas on the street, la Guatona Pepa, a fellow worker in the
    cyber-café, have all lost family members, a fact which is emphasized several times
    in the repetition of the phrase: "the family I have left"10 or "the women of the
    family that remain."11 The impact of precarious living conditions and an unsafe,
    daily reality reverberates through the social reality of the novel, profoundly
    shaping the characters'' consolidation of subjecthood and social relationships.'
