    does not foreground elements from “First World” or metropolitan cultures.


    To underscore these arguments, I would like to call attention to the tropes of
    hybridity and liminality in post-Independence Latin cultural debates. Andalucía
    herself invites such a connection by her references to this text, my intention
    is not to claim that this is the “proper” or natural context for her work, which
