    Other countries in the hemisphere whose economies are heavily reliant on export
    are encountering the same reduction in national revenue as a result of border
    closures in response to the pandemic. The heavy dependence of the economies in
    Central America and the Caribbean on capacity to export ‘human resources’ mimics
    the bleeding, in the colonial and postcolonial era, of Latin America’s ‘open veins’
    of everything that was “transmuted into European—or later United States—capital.¹⁶
    Neoliberal globalization has transformed the labor force of the regions in a ‘natural
    resource’ and has used the transnationalization of this resource to thwart the
