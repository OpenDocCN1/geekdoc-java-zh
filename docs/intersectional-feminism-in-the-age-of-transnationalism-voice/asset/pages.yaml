    complexity from life, so as to make information fit into smooth and transparent
    information streams:


    Pure is transparency, and things become transparent then they fit into the smooth
    streams of information and data. Data have something pornographic and obscene
    about them. They have no inside, no flip sides; they are not ambiguous. In this,
    they differ from language which does not permit things to come into perfectly
    clear focus. Data and information deliver themselves to total visibility and they
    make everything visible.²21


    As imperatives in information processing, both smoothness and symmetry strip subjects
    of interiority, making them codified and easily legible. A similar vein, German
    filmmaker Hito Steyler analyzes surveillance technologies in Duty Free: Art in
    the Age of Planetary Civil War and demonstrates the ways in which dynamic information
    is flattened, codified, and used in the process of racial profiling.Han and Steyler
    coincide in their beliefs that both visual and information technologies, in the
    effort to systematize diverse and complex social phenomena and organize them into
    simplified data points, turn the complexity of everyday life into static abstraction,
    and exteriority.


    In Fuerzas especiales, the family''s subjecthood and 예정이다 depends on a symmetry
    that erases the frictions of their existence, and simultaneously functions as
    a digital burial. In fact, code and abstraction have tangible, material impacts
    on the characters'' lives beyond this singular event covered in the newspapers,
    as evident when the protagonist''s reveals reveals that she and compadres, El
    Lucio and El Omar, were all born on the same day, of the same month, of the same
    year. The protagonist reflects on this coincidence: “The shocking coincidence
    of the numbers that we carry scares us, because we think of a combination that
    could involve bad arts of some sect or the deliberate actions of a transnational
    organization or a state agent through which the police can locate us in the center
    of their archives.”²³It is important to highlight the diversity of the contemporary
    “technologies” that fall prey to this flattening logic. The bloque, mechanisms
    are not solely of the surveillance state and a deregulated global economy, but
    also of transnational organizations and cultural practices. In this sense, Fuerzas
    especiales frames artistic and literary registers as technologies that are complicated
    in mediating subjecthood and legitimacy, producing a host of images that also
    circulate contemporaneously in these high-speed networks.


    # STAGING PERFORMATIVITY


    In an interview with performance studies scholar Diana Taylor, Eltit discussed
    the importance of theater at different moments of her career, remembering'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'her work during the 1970s and 1980s with the art collective, Colectivo de Acciones
    de Arte. With a group of artists including Lotto Rosenfeld, Raúl Zurita, Fernando
    Balcels, and Juan Castillo, Elit staged act-actions in the city of Santiago that
    were intended to disrupt the dynamics of social space and the daily rhythms of
    life during the dictatorship. Much later, thinking in conjunction with Taylor’s
    work, she comments on her broadened understanding of performance:


    I broadened my understanding of performance to think of it as an activity that
    can accompany life itself, in all its dimensions—even life practices could be
    thought of as "performative" because life practices are inserted into protocols
    and rituals—in familial, personal, or work rituals, and so on. And I think that
    it is there, in that protocol, we could also talk about a performative life, or
    performative lives lived unto the multiplicity of the “I’s” that we carry, is,
    each “I” of the multiple “I’s” that make up our identities, always ongoing, always
    difficult, complex and multiple.²⁴


    Perform life surfaces the frictions that constitute subjectivity, capturing the
    multiplicity of individual "I" that discourse and discipline attempt to. An individual’s
    effort to follow familial, personal, and social codes give rise to a notion of
    life that is fundamentally unstable: contradictory, ongoing, and difficult.


    As Elit’s narrative moves between different forms of technological, artistic,
    and psychological mediation, she mobilizes a dance between static images or codes
    and the dynamic scenes of this everyday, performative life. For Fuerzas especiales
    is a novel filled with unfings—mental, printed, and digital photographs—that add
    textures to the unholding of perception, identity, and subjectivity. In one instance,
    while walking home from the cyber-café, the protagonist is overcome by the mental
    image of her sister’s hair—“I am invaded with the image of her hair, black, and
    surprising”²⁵—which immediately causes her to replay a series of family conflicts
    in her mind. describes the violent nature of an encounter between her mother and
    sister over the latter’s hair, is deemed unattractive by her mother’s standards:
    “The beatings, her hair, hardened by her blood’s density, the silence between
