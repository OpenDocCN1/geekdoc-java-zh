  md: '# Tuning In


    # NETWORKED SUBJECTS AND DISEMBODIED CONNECTIVITY


    Eltit illuminates the increasingly complex role of the internet and contemporary
    image-space in the mediation of social life within this and disaggregated reality.
    This mediation has direct and dire consequences for the characters and subjects
    living on the fringes of society, for while an internet presence is inherently
    tied to their ability to be “subjects,” these technologies have profoundly alienating
    and disaggregating effects. As workers in the cyber-café, many of the characters
    earn enough money to temporarily abate their hunger until the next day. They sit
    in front of a webcam and provide services in virtual space to buyers from all
    the world. While this work provides the protagonist with the material subsistence
    in everyday life, she describes an alienating relationship with the computer screen:
    “Now it is time to forget the stars and the problems in my family. I have to forget
    myself in order to give myself up, in body and soul, to the transparency that
    radiates from the computer screen.\¹² Alienated from her body, and the bloque,
    she immerses herself in a universe of images and waits for her30-minute session
    to end. She embraces the distractions provided by the internet, persian Russian
    clothing sites as a way of forgetting the labor she is performing. She also reads
    articles that teach her pain is purely mental and instructs her to focus on particular
    images to shift her attention away. As a point of access to mainstream consumer
    culture and a favor of entry into the market, the cyber-cafe is a tether to subjecthood,
    providing both the possibility of self-optimization and economic subsistence.


    Furthermore, for the characters of the bloque, images of themselves circulate
    through information networks confer on their normative and legible subjecthood
    within the global economy. For instance, the protagonist describes the 48 hours
    immediately following the state’s seizure of her nephews, experiencing the powerful
    effects that coverage and outrage expressed on social networks has on her family.
    She states, “Over a year has passed since the images of the children overwhelmed
    the parents, classmates, and erupted in the frayed routes of the (social) networks.\¹³
    The images are replayed infinitely through the media, “on infinite replay”¹⁴ notes
    that the proliferation of images provides her with a confirmation of her own existence:
    “A public event that free me from questioning the veracity of my existence.\¹⁵
    This media recognition confers an individualism and subjecthood onto the children—“The
    children existed for one part of the word, and my sister existed as well, and
    finally, throughout 48 hours, all of our lives acquired a deserved significance¹⁶—and
    by extension, the family is immediately significant and recognized: “In the'
