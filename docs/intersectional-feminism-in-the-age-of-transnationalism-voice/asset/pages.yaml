  md: '# Chapter 6


    # Reimagining the Borderlands


    # Intersectionality and Transnational

    Queering of Laura Aguilar’s Self-

    Portrait Three Eagles Flying


    # Rosita Scerbo


    Laura Aguilar, daughter of a first-generation Mexican American man and a mixed-race
    mother, was an acclaimed Californian photographer who worked mainly in the genre
    of portraiture and self-portraiture. Her lesbian identification traces of both
    male and female identities and her culture is a mixture of many different races
    and cultures. By transcending beyond the limits of US and Mexican cultures, Aguilar’s
    art expression gives voice to the people of the Borderlands. This essay looks
    at one of Aguilar’s most appreciated works in the context of Chicano feminist
    studies, Three Eagles Flying (1990). This self-portrait explores the construction
    of multiple identities. The visual artist’s inner struggles were related not to
    her sexuality but also to her cultural and ethnic heritage (Leimer 30–31). In
    a single image, Aguilar manages to critically examine and include all the power
    relations inherent to intersections perspectives: race, gender, sexuality, class,
    and ability. Three Eagles Flying externalizes the author’s struggles that were
    related not to her sexual ideology also to her cultural and ethnic heritage and
    to the mental and physical disorders that characterized her existence. The symbolic
    elements in Three Eagles Flying constitute an interplay with the meaning of the
    artist’s last name, since águila “eagle” in English. Aguilar never felt supported
    by her family as a person and as an artist. Depression was a faithful companion
    of her life, and the photographer had to escape from this reality and turning
    herself into a work of art that allowed her to communicate and make herself visible.


    In this context, intersectionality serves as a helpful analytical lens’ to investigate
    how multiple inequalities may be portrayed to represent the “complex'
