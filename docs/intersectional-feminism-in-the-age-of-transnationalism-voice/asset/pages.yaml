    # THE UNDERSIDES OF GLOBAL CAPITALISM:

    LIFE FROM THE BLOQUE


    Fuerzas especiales is narrated from the perspective of an unnamed female

    protagonist, living on the peripheries of Santiago when she and the other

    characters experience a truly devastating underside of neoliberal order that

    touches all aspects of life. The bloque, home to the novel’s characters, is

    described in a typically Chilean lexicality and geography, and likely refers

    to the public housing projects built by the Chilean government beginning

    in the early 1950s. During this period, Presidents Carlos Ibáñez and Jorge

    Alessand initiated the first housing projects as a solution to a growing

    number of poblaciones callampa (“camps” or “tent cities”) emerging on the

    ipheripher. With President Salvador Allende’s election in 1970, social hous-

    ing declared an unalienable right and the government passed the Plan de

    Emergenza 1971 (Emergency Plan 1971) in order to construct 90,000 house-

    ing units within that year. While these ambitious plans could not be

    fully realized, the bloques de vivienda were seen as part of the state’s

    fundamental responsibility to provide for its citizens, a philosophy which

    would radically change after the coup d’état in 1973. Under Pinochet’s rule,

    t responsibility for constructing housing was transferred to the hands of

    private developers and the parameters for basic living needs, such as the

    minimum size of an apartment, were drastically altered to maximize profit

    rather than standard of living.³ The military was involved in many

    of these projects, leading to a higher rate of violence and policing of poor

    neighborhoods. Elite notes that one last consequence of dictatorship is

    the dissolution of public housing as a state of protection and security,

    affirming that poorer neighborhoods are, in this day, subject to constant

    policing: “How long has the district La Laguna been intervened by the

    police? Another example is the death of the mapuche youth, Matías Catrile,

    whom they killed from behind. This is the symptom of a law that borders on

    state crime.”⁴


    In Sociofibia, Spanish sociologist César Renduelles considers the global

    rise of slums and shantytowns as the often-ignored underside of the capital-

    it city: “Hypergraded urban zones, or megalons, are the colonial problem

    of the twenty-first century; like the Victorian holocaust, they are the product

    of economic liberalism. Shantytowns are the other face of casino capitalism,

    the levees that dam the human remains of an increasingly speculative'
