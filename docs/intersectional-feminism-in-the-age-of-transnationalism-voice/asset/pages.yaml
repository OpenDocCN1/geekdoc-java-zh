    women and the working classes, and to propose new systems of beliefs that would
    enable the emergence of a truly democratic world. The series of paintings under
    the titles Naturalalezas Vivas, Retratos Bidimensionales, and Máscaras, which
    were created during her American exile, are both results of her transnational
    experience and a continuation of Mallo''s long-standing search for a truly republican
    order. A few months before the outbreak of the civil war, Mallo began to paint
    the series La religión del trabajo, which later continued in exile. These paintings
    visually articulate Mallo''s unwavering faith in the eventual victory of the democratic
    values that were under attack by the repressive forces that toppled the Republican
    government. In La religión del trabajo, Mallo visually communicates the spiritual
    values of the new social order. In one of her lectures titled “Proceso histórico
    de la forma en las artes plásticas,” Mallo describes the purpose of artistic creation.
    For her, art provides the iconography that expresses a new spiritual and social
    order:


    The new civilization, bringing in it a new humanity being a mythology, had to
    provide a new plastic order, new forms of expression ... Nature, history and art
    are eternally linked together. Consciously or unconsciously, it is a form of propaganda.
    Revolutionary art is a weapon used by society in full possession of its faculties
    against one that is disintegrating. The art is not a weapon but a result; it is
    the incarnation, the symbol, of a new society.


    Therefore, the paintings in this series embodied the principles she considered
    essential to overcome, once for all, inequality, exclusion, and oppression in
    all its forms.


    The first group of paintings of La Religión del trabajo were directly inspired
    by the Workers'' March that took place in Madrid on May 1, 1936, only two months
    before the outbreak of the Spanish Civil War. During that event, Mallo was captivated
    by the sight of a worker marching and holding a loaf of bread in her hand. Mallo
    explained the significance of this event in 1977 in an interview with Juan Bonnet:


    On May 1, 1936 we watched from Columbus square the popular worker''s march. Watching
    a procession of notably pass by, I realized that if the Republic depended on these
    men, however honest as they were, it was doomed. In contrast, the proletarian
    groups marched with impressive decision. Suddenly an arm appeared, holding, in
    Eucharistic consecration, a huge loaf of bread. That''s where the picture comes
    from . . that Castilla la nueva, so what different from the sinister Castilla
    la vieja, is what inspired El canto de las espigas, which I painted in Buenos
    Aires.'
