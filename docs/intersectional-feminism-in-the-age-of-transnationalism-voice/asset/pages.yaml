  md: '# Chapter 8


    # Technologies of Affective Solidarity


    # Salvador, Brazil''s Ani Ganzala

    and Zinha Franco


    Naomi Pueo Wood


    Broader access to social media and growing transnational solidarity networks has
    led to increased attention to racial and economic inequalities across the Americas.
    Through greater integration of the internet into our daily lives, cross-cultural
    comparative analysis of representation has also led to a deeper awareness of inequalities
    globally. Due to the widely available data on the overrepresentation of black
    people in the prison system, for example, many people can no deny this modern
    method of racialized persecution and oppression. Brazil is in the top three countries
    with the highest rate of incarceration with 725 million people, third to China
    at 1.6 million, and the United States at 2.1 million.¹ And, among these 725 million,
    the population of imprisoned black women in Brazil has increased 700% since 2010²
    This data shows which Brazilian national politics (de) value certain citizens
    and legacies of slavery, settler colonialism, and exploitation in the postcolonial,
    slave-system nation. And, the prison system is only one such institution that
    cannot hide its blatant bias in a contemporary access to data. The availability
    of this information and subsequent increase in transnational solidarity is the
    context within which I will explore the connections between local *artivismo*
    and transnational, queer Afro-diasporic solidarities in the Salvador of social
    media and globalized activist networks in Salvador, Brazil.


    *Artivismo*, art-activism, is an identity exposed by artists in Brazil to signal
