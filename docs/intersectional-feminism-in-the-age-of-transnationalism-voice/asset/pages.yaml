  md: '# Reimagining the Borderlands


    activists and intellectuals, like Maria Beatriz de Nascimento, Luiza Bairros,
    Jurema Werneck, Thereza Santos, Lelia González, and Sueli Carneiro, among others,
    promoted the theory of triad of oppression, that is to say “race-class-gender”
    to articulate the differences between Brazilian woman and the dominant feminist
    discourses been ignoring. Similarly, Aguilar promotes visibility and recognition
    for the brown indigenous women who live in the Borderlands between the American
    and the Mexican territory. In this context, it is essential to emphasize intersectionality-based
    approaches regarding two issues: first, the multiplicity of experiences of sexism
    by different women, and second, the existence of social positions that do not
    suffer from marginalization or discrimination because they embody the norm itself,
    such as patriarchal masculinity, supremacist whiteness, or heteronormativity.
    For this reason, the very concept of intersectionality was coined in 1989 by the
    African American lawyer Kimberlé Crenshaw in the context of the discussion of
    a specific legal case, with aim of making clear the legal invisibility of the
    multiple dimensions of oppression experienced by the black workers of an American
    called General Motors. When Crenshaw first used this term, her objective was to
    highlight the fact that in the United States women were exposed to violence and
    discrimination on grounds related to both race and gender. However, above all,
    she aimed to create specific legal categories to help face woman discrimination
    in multiple and varied levels.


    The Argentine philosopher María Lugones introduces the concept of intersection
    relationship to be useful to interpret Aguilar’s Three Eagles Flying. The notion
    of the intersection of opp has been widely disseminated academically because of
    her reading of intersectionality as a mechanism of control, immobilization, and
    disconnection. By Lugones, this concept stabilizes social relations and fragments
    them into homogeneous categories. Moreover, it creates fixed positions and social
    movements, instead of fostering coalitions between them. Based on this interpretation,
    the immobilized and restricted body of Aguilar in Three Eagles Flying represents
    this metamorphic position. Lugones’s approach (2005) explains that the intersection
    of inequalities shows us an emptiness, an absence, where the black (or in the
    case of Aguilar, the brown) woman should neither be clearly the traditional hetero
    sexual “woman” category nor the “black” category include her. Her most valuable
    contribution given by Lugones has to do with the moment in which this vacuum has
    been identified. For the author, once this happened, that is to say, once emptiness
    has been identified, it could act politically. In this regard, Lugones proposes
    the logic of fusion as a lived possibility of resisting multiple oppressions by
    creating circles resistant to power from within, at all levels of oppression,
    and coalition of identities through complex dialogues from the interdependence
    of nondominant differences.'
