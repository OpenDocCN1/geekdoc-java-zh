  md: '# 126 Barbara Minter


    rather by the fact that it incorporates the many schools of thought that aligned
    themselves with the various forms of feminism. One of the identities on which
    Genz expounds in her book Postfeminities in Popular Culture is that of the “postfeminist
    supergirl,” which she proposes as contradictory to the “normal” female figure
    we perceive in popular culture. She is neither “feminine” nor “masculine,” and
    she does not take the backseat in her own story. As is demonstrated in Genz’s
    text, this identity can be viewed in various forms.


    Though my study focuses on Spain, the nature of the television industry forces
    us to think about how borders are affected by this sort of cultural production.
    Does anyone believe we are living in a “post” society or Genz’s concept of the
    “postfeminist supergirl” prove that we are truly able to blur the barriers and
    lines between feminism as we do through the use of transnational thinking? I echo
    Genz’s argument that the “post” does not necessarily indicate a “post” society.
    Walter Mignolo’s theory on “border thinking” helps us understand how the postfeminist
    standpoint does not necessarily indicate a “post” society. Because Mignolo requires
    thinking this allows us to belong to more than one definition. The limits that
    define each gender’s role in a patriarchal society can be crossed and challenged.
    Therefore, the “postfeminist super” is an identity that challenges those very
    borders, bringing together transnational thought and feminism, both of which link
    the path and the present.


    The idea of crossing boundaries has always been central to feminist thought. As
    Liz Bondi demonstrates in her discussion of the intersections between gender and
    geography, feminist thinkers have produced a significant amount of research that


    +   points to the way patriarchal gender relations generate gender-specific experiences
    of space and time, and demonstrates how women in particular negotiate all manner
    of boundaries, for example between home and work, between private space and public
    space, between nation-states, between cultures and classes. It also demonstrates
    how this crossing of boundaries is central to the operation of dominant economic,
    political and social systems.


    The TV series El tiempo entre costuras pays particular attention to the intersections.
    Its protagonist Quiroga exemplifies the identity of a “postfeminist supergirl”
    who crosses different kinds of borders and invites the viewers to join her on
    this journey. This kind of imaginative exercise can have great value as a catalyst
    that awaken feminist sensibilities. As Bondi argues, “at this point, real and
    imaginative geographies intersect, in feminist work concerned with the former
    has the potential to'
