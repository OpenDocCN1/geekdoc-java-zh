    # Rosita Scerbo


    ontology” of characters.Laura Aguilar’s visual art deploys multiple, complex,
    and simultaneous identities, displaying the experience of marginalized subjects
    who live in feminist theorist Anzalúa defines as Borderlands. Intersectionality
    has become the expression used to designate the theoretical and methodological
    perspective that seeks to account for the cross- or overlapping power of relations.
    This approach allows us to investigate the intersections between race and class,
    and gender. Moreover, this perspective explores the consequences of the relationships
    between the social groups involved. This concept gives voice to the political
    contributions of black and brown feminism as methods of decolonizing epistemic
    approaches. In US academic contexts, intersectionality seems to become the most
    widespread feminist approach that allows female activists to talk about either
    multiple or independent identities.On the other hand, in the field of structural
    feminism, Patricia Hill Collins was the first to speak of intersectionality as
    a paradigm, while it was Anne-Marie Hancock proposed a formalization of this paradigm,
    understood as a set that encompasses both normative theory and empirical research.


    This double genealogical affiliation historically imputed antiquity is configured
    differently according to national contexts. Scholars from different countries
    look at intersectionality in a different way based on their personal and historical
    experience. For example, while in the United States most of the academic studies
    that intersectionality theories are strongly influenced by black feminism, in
    European intersectionality is rather linked to postmodern thinking.For female
    activists and artists like Laura Aguilar, the question of race is central, as
    is the struggle that the black and brown bodies experiences in the United States
    and Mexico. Aguilar uses her art to express these concerns.


    Laura Aguilar was able to explore the real and symbolic disputes within the different
    identities that characterized her as an individual and as an emblem of modern
    feminism.She was able to do so through her photographic work. In Trees Flying,
    we can observe her partially nude body wrapped in the American flag and tied with
    ropes, while the flags of the United States and Mexico hang, respectively, on
    her left and right side. The Mexican hides her head. The central image of the
    flag, which is the Mexican eagle, covers her face. The eagle represents, using
    Barthes’ terms, ‘the studium’ of Aguilar’s photo, an element that indicates historical,
    social, or cultural meanings extracted through the semiotic analysis of the illustration.In
    this case the eagle can be read as a unifying component, which brings together
    the two identities of the photographer, the American and the Mexican, both linked
    to this emblematic image. This powerful image lends itself to an intersectional
    study, a look that puts the focus on the power relations produced at the crossroads
    of inequalitiessuch as class,'
