    affect as open-ended social: “A preintentional intensity corresponding to the
    passage from one experiential state of the body to another and implying an augmentation
    or diminishment in that body’s capacity to act. (Spinoza’s affection) is each
    such state considered as an encounter between the affected body and a second,
    affecting.¹⁴¹ Affect is an intensity that exists within and between bodies that
    impact one another. Steve Goodman builds on that “If affect describes the ability
    of one entity to connect another from a distance, then the mode of affect will
    be understood as vibrational.” As Brand Labelle, sound is also unignorably relational:
    it emanates, communicates, vibrates and agitates; it leaves a body and others;
    it binds and unhinges, harmonizes and traumatizes; it sends the body moving, the
    mind dreaming, the air oscillating. It seems elusive definition, while having
    profound effect.¹² underscored by Massumi, Goodman, and LaBelle, these vibratory
