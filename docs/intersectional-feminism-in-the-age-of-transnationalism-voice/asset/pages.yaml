    Through the trajectory of female sexuality, Martel traces the historical arc of
    her country over the last two centuries. The age of vitality parallels the idealistic
    romantic conception of the nation shortly after the onset of independence in the
    nineteenth century. In the next century, the age of liberation resonates with
    the socialist promise of the early Peronist years, the age of stagnation with
    the subsequent disillusionment with the Peronistas, and the military dictatorship
    years are marked by lies and deception like the age of bitterness. The twentieth-century
    fi de siècle neoliberal problem held the promise of an age of agency wherein the
    country would benefit from stronger linkages with the global financial and product
    markets. However, by the start of the twenty-first century, the national scenario
    quickly deteriorated to an age of decadence marked by corruption and disregard
    for the plight of marginal classes. Martel''s primary tool for evoking the link
    between female sexuality and the nation is her spatial strategy. Therefore, it
    is worthy to take a close look at one specific instrument in her spatial kit:
    the swimming pool.


