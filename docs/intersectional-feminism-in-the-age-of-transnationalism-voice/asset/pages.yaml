  md: '# About the Contributors


    **Olga Bezhanova** is an associate professor of Spanish Literature and chair of
    Department of Foreign Languages and Literature at Southern Illinois University,
    Edwardsville. Her articles on the subject of modern and contemporary Hispanic
    literature have appeared in in Romance Quarterly, Bulletin of Spanish Studies,
    Hispanófila, Revista Canadiense de Estudios Hispánicos, Letras hispanas, Anales
    galdianos, and so on. Her book *Growing Up in an Inhospitable World: Female Bildungsroman*
    in Spain was awarded the Victoria Urbano Prize for the Best Critical Monograph
    by Asociación Internacional de Literatura y Cultura Hispánica. Dr. Bezhanova''s
    second book titled *Literature of Crisis: Spain''s Engagement with Liquid Capital*
    was published by Bucknell University Press in the Fall of 2017 and was released
    in paperback in 2019. Dr. Bezhanova was awarded the Panteleimon Kulish Medal for
    the Literature, Art and Communications Academy of Ukraine for a significant contribution
    to the promotion of Ukrainian literature in the United States and Hispanic countries.
    In 2020, she became the recipient of International Medaille Heinrich Böill (wegen
    des Erfolges in der Literatur und Kommunikation) awarded by the German branch
    of the Literature, Art and Communications Academy of Ukraine.


    **Barbara Minter** is a PhD candidate in Spanish at the University of Alabama.
    Her dissertation focuses on contemporary Spanish television that reinterpre the
    first half of the twentieth century, with an emphasis on various female protagonists
    that embody postfeminidentities in several recent programs that reinterpret women
    of the past. Her research includes television studies, film studies, feminist
    studies, women writers, national studies, and identity studies. She has several
    articles published or accepted for publication and has presented at conferences
    both nationally and internationally.


    **Sownya Ramanathan** is a scholar of twentieth-century literature and visual
    arts of the Latin American Southern Country, working at the intersections of aesthetics,
    critical theory, and gender and sexuality studies. She is currently a PhD candidate
    in the Department of Spanish and Portuguese at Princeton University and holds
    a bachelor''s degree from the University of California, Berkeley, in Sociology
    and Spanish Language and Literature. Her dissertation, titled, “Diamela Eltuit:
    Texts of Reading and Writing in Times of Danger,” explores the Chilean writer''s
    dialogues with prominent figures of the Latin cultural tradition, such as José
    Donoso, Severo Sarduy, and Paz Errázuriz, illuminating a politically situated
    literary and aesthetic practice that examines new forms of collective rationality
    during the rise of neoliberalism in Chile.'
