  md: '# # Chapter 1


    # # Border Trouble


    # ## Anzaldúa’s Margins


    Leslie Bary


    Yo no soy americano

    pero comprendo el inglés


    > —Traditional, Zacatecas/California


    Por más que la gente me juzgue texano

    Yo les aseguro que soy mexicano


    > —Pepe Guízar


    Ay ay ay, soy mexicana de este lado


    > —Anzaldúa


    Gloria Anzaldúa’s Borderlands/La Frontera: The New Mestiza¹, a key literary and
    theoretical contribution to Chicana literature as well as feminist, borderlands,
    and queer studies, among other disciplines, gained immediate broad popularity
    in the United States with the multiculturalism of the 1990s². It is now a classic
    of decolonial studies, well cited in the English-speaking world and available
    in Spanish translation since 2016. The work generates wide-ranging discussions,
    and much has been written on the implications of Anzaldúa’s hybrid status for
    solidarity. Borderlands/La Frontera’s hyper-canonical status and its progressive
    diffusion across the globe have created something of an echo-effect in scholarship,
    as its relevance to a new geographical area, or another field or project is discovered,
    and the text is introduced to a new audience. Anzaldúa’s writing from This Bridge
