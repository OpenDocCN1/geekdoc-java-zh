  md: '# About the Contributors


    **Raysa E. Amador**, a professor and Chair of languages and literature at Adelphi
    University in New York, holds a doctorate in Spanish from New York University.
    She has more than two decades of experience teaching and researching Latin American
    culture, civilization, and literature. Dr. Amador is the chair of Languages and
    International Studies Department and the director of the Latin American Program
    at Adelphi. Dr. Amador is the coauthor of *The Female Body: Perspectives of Latin
    American Artists (Greenwood, 2002).* Prior to this research she undertook a programmatic
    investigation of questions pertaining to the Chronicle of Indies and the law and
    published the book *Una aproximación histórica a Los comentarios reales* (Editorial
    Pliegos, 1984). In addition, she is the author of numerous articles on Spanish
    and Latin American literature. A member of the honor society Phi Beta Kappa as
    well as former member of the New York Council Speakers of the Humanities Program,
    she has lectured extensively on the literature of the Discovery of the New World
    and on Latin writers in the United States.


    **Leslie Bary** teaches Latin American literature and culture at the University
    of Louisiana at Lafayette. She has scholarly publications on César Vallejo, Oswald
    de Andrade, Emilio Adolfo Westphalen, Rubén Dario, the question of cultural identity,
    and other topics, and she has lectured widely on representations of race in Latin
    American writing. Her current book project is *That Discerning Eye: Race and the
    State in Modern Latin American Literature*. Her translation of Pedro Granados’s
    Roxol is forthcoming from Artepoética. Her political work includes the movements
    for postconiction relief and the abolition of immigrant detention.'
