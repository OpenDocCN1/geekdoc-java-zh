    the spaces we inhabit. Indeed, theories of heterogeneity, when they solidify into
    units we inhabit, may by doing this to compensate for their inability to sustain
    an examination of power relations within liminal spaces and contradictions within
    so-called hybrid identities.


    Theories of heterogeneity develop partially out of the desire to overcome the
    limitations of a politics based on essentialized identities. But they themselves
    risk idealizing the liminal subject, and in this way constitute the creation of
    a new, unit subjectivity. In this essay I have tried to show how theories of heterogeneity,
    appear to undermine the self/other paradigm by positioning a subjectivity, bringing
    the two into contact (the “new mestiza” is a bridge between units) but do not
    necessarily call the oppositions which define self and otherness in question or
