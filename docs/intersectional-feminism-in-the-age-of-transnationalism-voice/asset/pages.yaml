    Martel''s emphatic and novel use of liquid perception emphasizes the impact of
    liquid modernity on social structures. According to Zygmunt Bauman, modernity
    has been a project of liquefaction to the start. To begin with, it ''melted''
    solids like "traditional loyalties, customary rights, and obligations," and eventually,
    "left the complex network of social relations utmost."⁴⁵ The Salta trilogy examines
    the changes in a woman''s social positionality under modernity''s liquefying forces.
    Modernity freed the woman from the obligation to be the fragile virgin when she
    is young and to the iron anchor of when she is mature. However, this is not synonymous
    with emancipation in the films. Martel creates the desirable impact of emancipation
    for the younger woman in the age of vitality, and the older woman in the age of
    agency. In contrast, the younger woman in the age of bitterness and the older
    woman in the age of decadence turn into liquefied anchors and indistinguishable
    from the floatsam and jetsam aside on the liquid surface. They have the agential
    freedom, but not the freedom from incumbent bounds. The decadent, bitter women
    mirror not Martel''s contemporary Argentina but any country that, in the grip
    of neoliberal economic fervor, has witnessed "renunciation, paying out or selling
    off by the state of all the major appurtenances of its role as the principal...
    purview of certainty and security."⁴⁶


    When the Salta trilogy is seen as part of a whole anthology, it becomes a bildungsroman
    of female sexuality and the nation. In order to justify this generic categorization,
    two aspects merit explanation. First, sexual maturation is not shown through the
    events in the life of a single character. Instead, it is presented as a progression
    in a collectif. Though the traditional understanding of the genre demanded a focus
    on individual growth, there is no longer a consensus on that aspect: "Some critics
    emphasize individuality and individual change of the self in the process of formation,
    whereas others look more like milieu, regarding the condition of the protagonist
    actively involved in the social world as."⁴⁷ Olga Bezhanova has also questioned
    the centrality of individuality in a bildungsroman by articulating a subgenre
    of the collective bildungsroman through experiments with multiple voices.⁴⁸ Secondly,
    the bildungsroman normally follows a diachronic narrative style that demonstrates
    a sequence of changes in the life of the protagonist. Martel''s synchronic depiction
    of the various ages of woman should be seen as an innovation, rather than a break
    from, the stylistic conventions of the inappropriate latter half of the bildungsroman.
    The issue of the portmanteau—roman—also needs to be addressed. The trilogy is
    not'
