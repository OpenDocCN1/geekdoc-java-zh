  md: '# “Fofeminist Supergirl” Turned Superspy 127


    redefine our theories about, and therefore our imaginative geographies of, the
    world.⁹⁹


    Sira’s character also challenges the idea of a class society. Ulrich Beck argues
    that, in the risk society of the early twenty-first century, the concept of class
    mobility has lost its meaning:


    First, processes of individualization deprive class distinctions of their social
    identity. Social groups lose their distinctive traits, both in terms of their
    self understanding and in relation to other groups... As a result of this development,
    the idea of social mobility (in the sense of individual movement between actual
    status classes), until very late in this century constituted a social and political
    theme of considerable importance for social identity formation, pales into insignificance.¹⁰


    In the series, we observe Sira class boundaries with relative ease. After abandoning
    Madrid shortly before the Spanish Civil War and suffering hardships led her to
    take some of the first steps to becoming a “postfeminist supergirl.” Sira is quick
    to jump across class classes. By ending this character with the mentality of a
    “postfeminist supergirl,” the creators of the series invite the viewers to explore
    class mobility by identifying with her, an exercise which this postfeminist identity
    facilitates.


    Sira Quiroga grows up with a mother who is a seamstress and learns the same trade,
    utilizing this seemingly feminine profession in her adult life as a way to challenge
    the patriarchal model of gender relations. After a long trajectory of rewarding
    and difficult experiences during and following the Spanish Civil War, Sira returns
    to Madrid as a new and reinvented woman. It is at this point that the audience
    is presented with Arish Agiou, Moroccan spy doubling as a fashion foreign designer
    working for Nazi sympathizers. The program begins with a flash-forward that sets
    the narrative in Tétan in 1936 in the first few minutes of the first episode.
    Afterward, the camera cuts quickly to a flashback of Sira learning to thread a
    needle as a young girl with her mother. The series does not focus on historical
    events, however. Instead, it centers on the protagonist’s endeavors against a
    very real historical background. The plot outlines how Sira moves through each
    phase of her life, or, in other words, how she crosses frontiers, the most prominent
