  md: '# About the Contributors


    Rosita Scerbo is an assistant professor of US Latinx Culture at Allegheny College,
    PA. Her research interests include Latin American and Chicanx Visual Autobiography,
    Digital Humanities, Visual Disability Narrative, Corporeal Invisibility, and Feminism,
    and Gender Studies. She received her bachelor''s degree in Foreign Languages and
    Literatures (Anglo-American and Hispanic-American) from the University of Calabria
    in 2013. In 2016, she obtained her master''s degree in Hispanic-American Literature
    and Linguistics from West Virginia University. In May 2020, she obtained her PhD
    in Latin American/Latinx Visual Studies from Arizona State University. In addition,
    Rosita is a trilingual author/writer, ethnic minorities ARTivist, and online pedagogy
    specialist, and has worked as HASTAC Communications and Digital Content Development
    Intern.


    Java Singh received her PhD in Latin American literature from Jawaharlal Nehru
    University, India. She teaches graduate and postgraduate courses at the Spanish
    department in Doon University, Dehradun. Her most recent publications are Gendered
    Ways of Transnational Unbelonging (coeditor Cambridge Scholars Publishing, 2019),
    a chapter on women''s crime fiction in Papeles del crimen (University of Barcelona
    Press, 2020), and an article on science fiction in Quadratura (Autonomous University
    of Chihuahua, 2020). Her research interests include Southern Cone women writers
    and filmmakers, comparative literature and cultural theory, and speculative cinema
    and fiction. She also holds an MBA from the Indian Institute of Management, Ahmedabad.


    Naomi Pueo Wood is an associate professor of Spanish and Portuguese at Colorado
    College. Her most recent work “O artigo coral: aquarelas e graffitti de Annie
    Ganzala” in Latin American and Latinx Visual Cultures (2019) highlights the usage
    of the erotic in the paintings and graffiti of Annie Ganzala. Her prior work “Publicando
    el queer: los gestos queer en la música y el performance de Kumbia Queers y Kubensis”
    in Letras Femininas (2016) shows how queer/lesbian musicians emphasize pleasure
    in their lyrics and music videos as a political act which deemphases protest and
    struggle as the heart of lesbian/queer activism. Her ongoing research is focused
    on Critical Race Studies Gender and Sexuality Studies in the Americas.


    María Alejandra Zanetta is distinguished professor of Spanish Literature and Culture
    at the University of Akron. She earned her PhD in Spanish Literature from the
    Ohio State University and joined the University of Akron faculty in August 1995.
    Dr. Zanetta is the author of La pintura y la prosa de Santiago Ruizol: un análisis
    comparativo (Universidad de Valladolid, 1997),'
