    and Ibero-Ccasian, and the logic of fragmentation and unity supersedes the logic
    of difference(s).


    The “cosmic” Ibero-American—exemplar of a master race?—may not have a specific
    phenotype, but the concept of racial hierarchy is preserved, and community is
    still thought of in terms of blood.


    Vasconcelos’ paradigm is here at best an oppositional stance to the US melting
    it so strongly resembles. Even if we justify it, as is possible in some of its
    contexts, as a form of “strategic” essentialism, its flaws are as unrefined enough
    to question the implications of its use. It is my contention that Vasconcelos’
    model is not simply retrograde or unsophisticated, but rather a strikingly clear
    illustration of certain risks that inherit in more liminal models as well. Some
    of these risks, as should be clear by now, that hybridity and liminality as models
    for counterhegemonic identities solidify so easily into new units, and that this
    privileging of hybridity and liminality as universal theoretical concepts may
    gloss over the telling of specific histories and consciously formulated particularities.
    This is important because, despite invitation to meet at the border, and the parallels
    a theorist Jean-Luc Nancy draws between his own “mixed” history as a twentieth-century
    Frenchman and the Chicano experience, we are not all mestizos now.¹²⁴ Some choose
    to enter the borderlands, but others are irrevocably there. Everyone may be a
    fluctuating subject, but we did not slip across the border last night, nor stand
    on a Los Angeles street corner this morning waiting to be picked up for a day
