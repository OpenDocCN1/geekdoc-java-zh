    Maria Alejandra Zanetta


    Mallo reminds us the need to adopt a concept of nonhierarchical identity by heterogeneity
    and inclusion. Inher art, Mallo expresses many of the ideas that would be later
    articulated by ecological feminist, therefore anticipating one of the main principles
    of ecofeministic thought which thinks that, is precisely the hierarchical and
    individualistic conception typical of the anthropocentric mind, that justifies
    the exclusion and abuse of all those inferior, starting with the natural world.
    The message of these paintings is very similar to that of deep ecologists for
    whom humanity''s fail- to identify with the rest of nature is the result of a
    masculine viewpoint from which the world is perceived and organized. This branch
    of ecological feminism believes that anthropocentrism is the cause that has led
    to its separation from nonhuman nature and to the environmental crisis that threatens
    the survival of the planet.¹19 As an alternative, they propose a process of personal
    transformation based on the cultivation of a “biocentric” perspect- which expands
    the identification of oneself with the entire natural world. It is evident that
    Mallo decided to adopt a similar biocentric perspective which she created most
    clearly her condemnation of the patriarchal order and of what the Australian philosopher
    Val Plumwood would decades later define as its logic of dominion.20


    At the same time as Naturalezas, Mallo created a series of paintings of female
    heads, representative of different racial types, which she titled Retratos bidimensionales.21
    These monumental feminine heads, geometrically constructed, and representing different
    races, become cosmic symbols of a new inclusive egalitarian order inspired by
    the natural and racial diversity she found in the American continent. Regarding
    the egalitarian dream that Mallo expresses in these paintings, art historian Estrella
    De Diego raises the possibility that Mallo''s interest in the concept of race
    could have been partly influenced by Ruth Benedict and her book entitled Raza,
    which was published in Spanish Mexico in 1941. Benedict, an American anthropologist,
    was, “very influenced by her passionate egalitarianism among human races.”22 As
    Carlos L. Benárdez points out, these paintings of female heads express “a claim
    of a superior humanity, synthesis of all races, the opposite of any racism.”23


    At the same time Mallo painted Retratos bidimensionales, she created the series
    titled Máscaras. This fourth series, which was deeply influenced by the rituals
    of Candomblé, continues to expand the same idea of an egalitarian order inextricably
    to nature. As José Luis Ferris explains, Mallo was very attracted to the religions
    of the indigenous peoples of the Americas and spent periods in indigenous villages
    to learn their ways of life and their religions: “From Brazil to Peru, there was
    magic and esoteric arts, the delicious crossbreeding of Africa and Africa, the
    ethnicity at a pure crossroads, Macumba, Vodou and Candomblé, the African rites
    resounding in the New Continent to enrich the inexhaustible imagery of'
