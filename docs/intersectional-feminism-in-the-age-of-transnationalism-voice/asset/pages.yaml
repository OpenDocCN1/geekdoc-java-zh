    economic immersion in the grammar of female sexuality speaks to marginalized populations
    everywhere who are excluded from the rhetoric of neoliberal prosperity. The reason
    cited by Bong Joon-ho for the transnational relevance of his film Parasite, despite
    its distinctive “Koreananness,” is also true of the Salta trilogy. The films evoke
