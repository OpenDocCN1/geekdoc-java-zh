    but not necessarily the same as Andalucía’s. This critique of decontextualized
    readings of Andalucía, advanced early by scholars like Yvonne Navarro-Bejarano,
    is not mainstream and is still needed; it is a critique of, not Andalucía’s writing,
    and does not detract from the transformative project of the text. I would also
    suggest that the emphasis on plural identities, and the use of this text bolster
    obscure subaltern positions that do not exhibit hybridity or liminality as their
