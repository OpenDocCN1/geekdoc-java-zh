    In late November and early December of 2019, the Feria Internacional del Libro
    de Guadalajara (Guadalajara International Book Fair) convened writers, artists,
    and cultural critics in the largest annual publishing gathering in Latin America.
    Present in the discussions that took place were Chilean writers and feminists,
    who discussed the significance of the recent protests. Among them were Alejandra
    Costamaga and journalist, and Andrea Jeftanic, who formed part of the Organización
    de Escritoras Chilenas (Organization of Chilean Women Writers), a group founded
    in 2009 and responsible for distributing, investigating, and forming networks
    between women writers in Chile. Costamaga spoke about the significance of this
    particular moment in Latin America more broadly and addressed the connections
    between state violence, neoliberal crisis, and popular uprisings in Chile, Nicaragua,
    Venezuela, Colombia, Bolivia, and Ecuador. From her specific competency as a writer,
    she remarked that this moment represents an opportunity to critically reflect
    on “the link between art and politics. A problematic relationship, but one that
    is important to continue.”⁵53 Jeftanic, feminist novelist and writer noted the
    presence of a polyphonic chorus on Santiago’s streets: “We maintain that this
    has to do with an awakening, with a shift in paradigm and with a form of coral
    writing that exists on the streets.”⁵54


    Elit’ lays the groundwork for giving a form to this coral writing, constituted
    by affective and vibrational connections that are irreconcilable and ambivalent
    textures of experience at the core of an interdependent social reality. Vibratory
    connections pose a form of thinking about relations beyond disembodied and networked
    connectivity, embracing the volatility of social life while resisting the unidirectional
    valorization of all relationships. Consequently, interdependence, constituted
    by this affective ambivalence, manifests in relationships and collectivities as
    an ongoing and contradictory process, rather than a fixed ideal. Against the backdrop
    of the current social processes and mediated interconnectivities in Chile, attention
    to vibratory and affective relations encourages us to consider how local practices
    of organization pose an ethical and political challenge to the neutralizing and
    disintegrating paradigms of the present. In Fuerzas especiales, the dynamic dance
    between conflict and cohesion illuminates the textures of a collect that not only
    organizes power relations, but also permits us to think beyond the power-resistance
    dyad to reframe solidarity and coalitionbuilding as ongoing and challenging processes
    tied to a specific context of emergence. As Rendueles notes, “if we see ourselves
    as fragile beings that depend on one another, we must much of cooperation as a
    human trait as essential as rational thought, perhaps even more so. Our lives
    are unthinkable without the care we offer one another.”⁵55'
