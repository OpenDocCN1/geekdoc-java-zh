  md: '# Chapter 4


    # “Postfeminist Supergirl"

    Turned Superspy


    # Crossing Borders and New Identities

    in El tiempo entre costuras


    Barbara Minter


    Recently, the small screen has become one of the most popular and widely used
    media. However, with the inclusion of streaming, the definition of what constitutes
    television has evolved over the years. In a world that is becoming increasingly
    globalized, the term transnationalism seems to become more of a buzzword that
    lacks consensus, leaving itself open to criticism. It is a concept that can be
    used figuratively and literally. Though we can certainly consider how the globalization
    of our world allows for more easily crossed borders and less of a focus on nation-states,
    the interconnectivity that exists in society, it is important to also understand
    what it means to “think transnational, to think in a way which crosses borders
    in a way that does not simply ‘add in’ countries previously ‘overlooked’ by Western/Northern
    scholarship, to” Walter Mignolo defines border thinking as “thinking from dichotomous
    concepts rather than ordering the world in.

    In considering this definition, it is important to pay attention to the transnational
    effect that the television industry has on the world, rather than just the Western
    hemisphere. Thanks to streaming, TV is no longer limited to the country in which
    it is produced. In fact, many television programs are produced across borders,
    adding to the transnational effect of this medium. Said, even though a transnational
    trend in the production of television content is important in our globalized world,
    the way in which television is distributed is impactful because it opens television
    programs to being interpreted beyond their original cultural context, linking
    together viewers from all the world to the same program.'
