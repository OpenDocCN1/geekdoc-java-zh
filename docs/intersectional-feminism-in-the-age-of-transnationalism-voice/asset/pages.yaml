  md: 'midst of powerful sparks, information detailed with deliberate cruelty erased
    our insignificance and asymmetries,"17 The confirmation of each character''s existence
    as a subject is tied to their presence in this virtual image-space, a record of
    this instant of normative legibility.


    As that may be, even as technology captures and affirms the subjectivities of
    these characters, they simultaneously see it as a kind of burial or afterlife
    in a virtual world. This is evident when the protagonist tries to photograph her
    father. One day, he gets dressed and secures the *bloque*. His ribs are broken,
    his clothing is torn and beaten, and she is plagued with fear about how he will
    protect himself from the dangers outside. As he leaves, the protagonist reaches
    for her cell phone: "I took out my cell phone to try to save the last image of
    my father. I wanted to upload the image to (social) networks and show his worry,"18
    Her comments frame the instant as a simulacrum of a burial place for his emaciated
    body, cementing his image in digital space and securing him for a bodyless afterlife.


    Perhaps this scene represents a moment in which digital and information networks
    emerge as egalitarian spaces with the potential to allow their users to live,
    work, and consume in ways that are somewhat free of the restrictions of space,
    geography, class, or politics. Routledge writes that this was the early promise
    of a digital utopia. In particular, he calls attention to the belief that digital
    or cyber-space "offers an alternative grounded in what one imagines are the new
    forms of reality: a growing network of contacts among fragile subjects, but dense
    tenuous nodes connected with the help of elaborate technological tools."19 However,
    he dedicates the entirety of *Sociophobia* to debunking the utopian myth and demonstrating
    its complexity in a larger postmodern, neoliberal capitalist model of commercializing
    experience, work, and life: "The Internet . . . is not a sophisticated laboratory
    in which the future of ages are being developed but instead a run-down zoo hiding
    the decrepit forms of old problems that still haunt us, we prefer not to see them."20
    His writings suggest that a deeper understanding of the internet and technology
    is necessary: one that is willing to interrogate the underlying and sustained
    inequalities at its center.


    In *Fuerzas especiales*, contemporary technologies and networks project "symmetry"
    onto the inhabitants of the *bloque*; through images that circle through the internet
    and the media, a socially and economically ostracized population is rid of its
    constitutive assembly (its inequality) and achieves a moment, however brief, of
    normative legibility. Why, then, does the protagonist imagine a burial?


    Perhaps we can consider the *idea of symmetry* in conjunction with Byung-Chul
    Han''s analysis of a smooth or pure aesthetic of neoliberalism. Han argues that
    neoliberalism''s technologies and networks erase the dynamic'
