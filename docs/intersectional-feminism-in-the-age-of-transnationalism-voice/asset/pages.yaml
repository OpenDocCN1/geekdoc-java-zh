    which also serves to create a sense of community. Their characters negotiate between
    the demands of a new geographical space, in this case the United States, and their
    recollections of their own fragmented and lost history. In the transnational fictional
    space, the individuals in stories negotiate the transition through traces left
    by the body in the form of a diary, recipe, letters, language, and relationships.
    The characters resist a fixed identity rooted in a nation and in history and opt
    to relate to the cross-cultural experiences of other Haitians and Puerto Ricans.


    The art of remembering is an attempted restoration of what was lost at the moment
    of displacement, bringing integrity to the past in order to go forward, suggesting
    that “memory is always a function of the imagination and that we find its condition
    to reconcile and conform to a community among those who share it.” These writers
    treat the act of writing as an act of representation and presentation that has
    been fashioned within a cultural and communal imagery. Danticat and Ortiz reconnect
    and rearrange their narrative by “carefully positioning . elements—such as imagery,
    language, metaphor, and narrative mode [which] is not only aesthetically satisfying
    but useful in terms of the kinds of personal and political statement it makes
    about female belonging within the fictional and historical as well as social and
    national communities.” The writers created here a fictional space where both personal
    and collective identities produce a body of literature in the United States that
    allows them to recollect and restore their past in order to go forward. The writers
    allows to writers a debate about the processes of acculturation, resistance, rejection,
    loss, language, culture, traditions, and history, opting for a transculturation
    process that seeks a new representation of the personal and the collective.


