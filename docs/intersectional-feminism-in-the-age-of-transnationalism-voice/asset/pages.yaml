    project to address the creation of radical American (and not North American) identities.
    To do so, she draws on traditions whose roots lie further south, and it is worth
    excavating this layer of meaning in her text.


    I also suspect this exercise may be useful in a more general way. While liminality
    and hybridity are relatively new terms in English-language studies, the Latin
    tradition on which Andalucía partially draws is much older. As it such, it has
    a chance to reveal some of the impasses that inherent in the conceptualization
