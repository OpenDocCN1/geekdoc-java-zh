  md: '# Chapter 7


    # The Transformative Experience of the

    New Continent in Maruja Mallo’s


    # María Alejandra Zanetta


    Maruja Mallo (Vivero, Lugo, 1902—Madrid, 1995) is one of the most interesting
    artists of the Spanish avant-garde. At the age of twenty, she moved to Madrid
    to study painting at the San Fernando Academy of the Arts. While attending the
    academy, she befriended many artists, thinkers, writers, and poets connected to
    the famous *Residencia de Estudiantes*, such as the surrealist painter Salvador
    Dalí, the poet Federico García Lorca and the filmmaker Luis Buñuel. The *Residencia
    de Estudiantes* in Madrid offered one of the most vivid and prolific experiences
    of scientific and artistic creation in interwar Europe. From its beginnings, it
    was conceived as a house open to creation, thought, and interdisciplinary dialogue
    very similar to the model of English colleges. The model of teaching in the Residence
    was based on direct contact between teachers and students, collective effort,
    and personal responsibility.¹¹ Mallo thrived in the liberal-minded, collaborative,
    and experimental environment of the Residence. From the beginning of her career
    Mallo questioned and rejected the restrictive social norms “the feminine” and
    those intended to keep women out of the political, intellectual, and artistic
    activity of the time. M Mallo opposed the conservative classes and the church
    which supported the reactionary monarchy of Alfonso XIII (1886–1931) and the dictatorial
    government of General Miguel Primo de Rivera (1923–1930).² In relation to Mallo’s
    thinking, Shirley Mangini explains that Mallo vehemently rejected the lack of
    humanity exhibited by the aristocracy and the conservative class and who ignored
    the hardships of the lower classes and did nothing to improve the living conditions
    of the neediest people.³


    On April 14, 1931, the Spanish Second Republic was proclaimed after the deposition
    of King Alfonso XIII. Mallo supported the newly democratically elected government
    and enthusiastically embraced its ideals of social justice'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'and its progressive agenda. Mallo wholeheartedly believed that the formation
    of the social reforms enacted by the Spanish Republic would enable a new egalitarian
    and inclusive social system for Spain. Unfortunately, these social reforms were
    met with dread by the same reactionary and conservative forces that had backed
    the monarchy of the deposed king and the dictatorship of General Miguel Primo
    de Rivera. In 1936, a military coup supported by the conservative establishment,
    the army, and led by General Francisco Franco started the Spanish Civil War. The
    bloody confrontation, which lasted until 1939, culminated with the defeat of the
    democratically elected government and the establishment of a brutal fascist dictatorship
    under General Francisco Franco.


    Due to her vocal support of the Spanish Republic, and aware of the threat that
    she would face if she were to stay in Spain, Mallo managed to flee the country
    in 1937. When Mallo arrived in Buenos Aires in 1937, she was leaving behind the
    horrors of the Spanish Civil War. Mallo was deeply affected by the traumatic moments
    she had experienced during the last months she had in Galicia, hidden from the
    nationalist forces of the Franco regime were executing and incarcerating her comrades
    and loved ones. The egalitarian social order that the Spanish Republic had to
    establish, one in which Mallo deeply believed, crumbled in front of her eyes.
    The American continent, with its diverse races, religions, and geographies presented
    itself as a beginning full of promise, the possibility of a new life. Mallo was
    deeply moved by the exuberance of America''s nature, especially the magnificent
    shells she collected with the poet Pablo Neruda while exploring with the Chilean
    beaches of the Pacific.


    During her long exile in South America, which lasted until 1964, Mallo frequently
    visited Uruguay and Brazil. During those trips, she became very interested in
    the syncretism of Afro-Uruguayan and Afro-Brazilian religions and in the powerful
    and visually striking rituals of Candomble, a religion found primarily in Brazil
    and in Uruguay with elements derived from African cultures. Mallo had also been
    interested in spiritual and philosophical traditions as an alternative to the
    Judeo-Christian tradition, and therefore, the animism of Candomble exerted a powerful
    attraction over her. Mallo was a fierce opponent of the Catholic Church, both
    as a political institution and as a belief system. The artist believed that the
    church as a political institution that supported the fascist regime of Franco
    and of the Nationalist party had a nefarious influence in Spain and was complicit
    in maintaining an unjust social order that only benefited a few while opposing
    the majority. Mallo also considered that the church''s belief system reinforced
    and propagated oppressive gender norms that segregated women and kept them chained
    to their so-called biological destiny.


    From the very beginning of her artistic career, Mallo employed her art both to
    condemn the patriarchal and conservative social order that excluded'
