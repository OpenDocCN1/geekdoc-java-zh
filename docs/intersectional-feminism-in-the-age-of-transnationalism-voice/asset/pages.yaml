  md: '# “Postfeminist Supergirl” Turned Superspy


    simply that they themselves are beyond pretending to care,”⁴ However, other critics
    such as Stéphanie Genz offer a contrasting opinion on the matter. In the introduction
    to their text, *Postfeminism: Cultural Text and Theories*, Stéphanie Genz and
    Benjamin A. Brabon propose that “the cultural presence, resonance and longevity
    of postfeminism have become hard to ignore, specifically as it continues to evolve
    with changes in the political, cultural, and economic environment.”⁵ Genz and
    Brabon explain that “rather than implementing a simple frame of definition, [they]
    discuss diverse manifestations of postfeminism in order to highlight the term’s
    multiplicity and connections between these postfeminist expressions.” Considering
    both critics’ interpretation of postfeminism, for the purposes of this study,
    it is important to remember that postfeminism does not have to be seen as a “post”
    movement at all, like Faludi suggests, but rather as a combination of ideologies.
    It is precisely because of its complexity that the “postfeminism” allows for so
    many different analyses in different contexts. In their book, Genz and Brabon
    elaborate on a variety of postfeminist identities. However, Genz’s single-author
    book *Postfeminism in Popular Culture*, although published in 2009, may still
    be more useful, as it goes into great detail on how these postfeminist identities
    are incorporated into different cultural productions, which continues to be crucial
    to every technological society today.


    Genz’s study goes into great detail about the makeup of these different postfeminist
    identities, as well as the way in which it is exemplified in a variety of anglophone
    audiovisual productions. In this chapter, I apply Genz’s conclusions to a popular
    TV series from Spain. *El tiempo entre nuestras*, *The Time In Between*, as it
    is translated into English on our US Netflix platform. This program inserts the
    fictional life of Sara Quiiroga, a humble seamstress from Madrid, into the very
    real history of Spain’s not-so-distant Civil War. In many ways this novel, and
    thus the series, can be perceived as another piece of fiction, a closer and more
    critical look allows the reader and spectator to see a connection between the
    past and the present and concentrate more closely on the feminine identity that
    takes the center stage in both cultural productions. Sara’s character portrays
    an identity that bridges the gap between the woman she plays from the past and
    the one today who is viewing on television.


    According to Stéphanie Genz, postfeminism “is indicative of the diversity of contemporary
    feminisms and the changes in feminist thinking, activism and politics.”⁶ Genz’s
    interpretation allows us to embrace this diversity, while not forgetting the work
    that has been done by any feminists in our past and present, which can consequently
    be associated with the idea of transnationalism. For Genz, postfeminism should
    not be defined by its prefix “post,” but'
