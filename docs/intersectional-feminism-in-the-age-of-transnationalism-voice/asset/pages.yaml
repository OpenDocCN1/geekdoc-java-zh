    # Rosita Scerbo


    concept of identity not only as a space in which the individual is subjective
    and interact with the outside world but also as a political notion that is fundamental
    for those strategies of power through which human beings are made subjects. From
    the reading of Foucault, the identity is unveiling as a device of domestication.³³⁷
    The nation-state, which is a form of governmentality that was theorized in the
    eighteenth century and projected from Western Europe to all regions of the world
    throughout the nineteenth and twentieth centuries, arose in order to accommodate
    massive migration from the countryside to the city, a strengthening of the bourgeoisie
    along with the decline of the old nobility, and a development of a positivist
    mentality. This new form of governmentality created a multitude of biographical
    ways of exercising control.


    Newer theory on transnational dialogues with concepts such as state sovereignty
    and territoriality through the proclamation of a borderless world and an “end
    of geography” and separations. Wendy Brown’salled States, Waning Sovere discuss
    these contradictory bordering practices, focusing on the recent spate of construction
    of new walls, fences, and others. The book resonates with the themes explored
    in Aguilar’s photography emphasizing issues surrounding the US-Mexican and Israeli-Palestinian
    borders. Brown points out that this kind of wall building can be found in the
    world in almost every political context and strongly criticizes these practices:
    “It is the weakening of state sovereignty, and more precisely, the detachment
    of sovereignty from the nation-state, that is generating much of the frenzy of
    nation-state wall building today. Rather than resurgent expressions of nation-state
    sovereignty, the new walls are icons of its erosion.³⁸ Nations and generally justify
    the construction of these barriers as a response/protection against some sort
    of nonstate threat, such as smuggling, illegal migration, terrorism, and drugs
    trafficking, all issues that help to legitimize the fear of the foreign “other.”
    As Brown confirms, these walls commonly exhibit differential rigidity based on
    ethnicity, religion, wealth, citizenship, and education, increasing the physical
    and spiritual separations that already exists among populations. In this context,
    Aguilar represents metaphorically the control that the nation-state has over an
    individual. She does through the image of her hands and body trapped and immobilized
    with heavy ropes. In Tree Eagles Flying, we are not able to see that the national
    flag covers any recognizable features of her physiognomy. She has lost her identity
    in the middle of the fight between the different levels of inequalities she represents.
    She is invisible, as a woman and as a citizen of a nation.


    Aguilar’s work contributes to a political debate that resonates with the similar
    discussions that exist in Latin American countries. One prominent case is the
    one of Brazil initiated in the 1960s. Many of public discussions in this period
    focused on the problems black women were facing as topics of political debate
    within the Brazilian Communist Party.³³⁹ Various'
