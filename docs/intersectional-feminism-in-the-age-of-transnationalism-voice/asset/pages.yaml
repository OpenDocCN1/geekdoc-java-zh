  md: '86 Sowmya Ramanathan


    A prominent voice in Chilean literary and cultural circles is that of writer,
    intellectual, and activist, Diamela Elit. Beginning in the 1970s, Elit was recognized
    as a cultural figure whose work was central to disrupting the traditional foundations
    of literature and aesthetics, while also critiquing repressive state politics
    and the advancement of neoliberal capitalism in Chile and Latin America more broadly.
    In 2018, she was awarded the National Prize for Literature (Ministry of Cultures,
    Arts, and Heritage), las Artes y el Patrimonio, making her the fifth woman in
    Chilean literary history to be honored within this prize. A year later, in the
    mid of the protests, Elit told interviewer Roberto Ibañez that despite being in
    New York and far away, she has experienced a sense of proximity unimaginable in
    the past, facilitated by messaging platforms, social networks, and access to Chilean
    television. With respect to her own work, she states, “For decades I have written
    about inequality and indifference towards the peripheries,” She comments that
    the current *estallido social* (social outcry) is the result of worsening inequalities,
    producing an enormous collective frustration that has accumulated over time.


    Elit''s penultimate novel, the focus of this chapter, is set on an apocalyptic
    stage in which contemporary networks of information sharing, surveillance, and
    technological connectivity are implicated in sustaining deeep, structural inequalities
    produced by the neoliberal project in Chile. *Fuerzas especiales*, published in
    2013, Elit explores the lives of the inhabitants of a *bloque de vivienda social*
    (a social housing block) as they navigate the daily rhythms of a highly polished
    and technologically enabled existence on the peripheries of Santiago. The novel
    narrates the inhabitants'' attempts to survive constant police brutality and stability
    in a highly speculative economy by performing sex work via webcam. From the material
    and social reality of the peripheral *bloque, Fuerzas especiales* challenges the
    rhetoric and ideology of the Chilean government from the Transition to the present.
    The novel invites us to wonder about who could truly experience the national-scale
    reconciliation and by what means collective healing can be achieved, avoiding
    the erasure and conflict with past violence. Furthermore, the novel suggests an
    interrogation of the neoliberal capitalist paradigm of “good life” and exposes
    the categorical exclusions of marginal subjects from an ideological framework
    based on practices of consumption and networked connectivity. I analyze the emergence
    of collect in *Fuerzas especiales*, based on the affective frictions and relationships
    that are generated in the characters'' efforts to subvert, challenge, and defy
    normative constraints and repressive systems of discipline from the *bloque*.
    It is my claim that Elit''s framing of affective relations in the *bloque* presents
    a notion of a “relationship” that stands in stark contrast to the atomized, technologically
    mediated'
