  md: '# Introduction


    novel by María Dueñes; art–activism of Ani Ganzala and Zinha Franco; and the philosophical
    thought of Gloria Anzldúa. They all proceed from the belief in the continued usefulness
    of intersectionality as a valuable category of critical analysis that is particularly
    necessary at the time when the effects of neoliberal globalization are undermining
    many familiar categories of critical inquiry.


    For the most part, academic treatment of transnationalism betrays a clear sympathy
    the rise in transnational phenomena. Not only is the term ‘transnational’ in vogue,
    but it is also often beneficial to academics to describe the realities that it
    denotes and mention the term frequently.24 Moreover, as scholars of the Humanities,
    we pay particular attention to art, a form of human activity that benefits from
    transcending borders and experiencing freedom of geographical mobility and other
    forms of movement. Several chapters in this volume discuss the ways in which artists
    have used their experiences of transnational displacement to their advantage.
    As feminist academics, we are all aware of the multitude of ways in which globalization
    harms marginalized populations at the same time as it offers opportunities to
    those who already enjoy a privileged status. Like the capacity to use the COVID-19
    quarantines to enhance one’s personal brand through an intensified online presence,
    the possibility of using transnational displacements to one’s artistic or academic
    career is the pursuit of the few. A truly intersectional analysis is only possible
    if we take into account the variety of ways in which a transnational of politics,
    economy, and the daily life perpetuates different forms of oppression. An unconditional
    acceptance of the effects of globalization—which the rise in transnational phenomena
    stands in the way of a truly intersectional approach which, by definition, is
    based on the belief that racialized, gender-based, class-based, and other forms
    of oppression deserve to be acknowledged and addressed.


    The tensions between the transnational and the intersectional are well known and
    have been at the heart of the debates in feminist scholarship for some time. The
    very fixedness of the identity categories which give rise to an intersectional
    analysis disturbs the privileging of fluidity and boundless malleability that
    accompanies globalization; “Intersection relies on the production and reproduction
    of fixed identity categories that are tethered to the apparatuses of the nation-state,
    which is itself problematic category and social formation, in order to make interventions.”—25
    The problematic nature of the nation-state model of governmentality is well known,
    as is its dependency on creating external and internal others which are typically
    gendered and racialized. The impulse to “break from nation-centric frames of analysis”
    that has animated much of critical approaches to the effects of the withering'
