    capacity of collaborative activism in the face of the environment of competitiveness
    that Kintê identifies. Focusing on black female beauty reflected in

    Oxum''s mirror facilitates the birth of new paradigms in the face of violent

    and repressive regimes of colonialism and slavery. In this reflection we

    witness the birth of a transformed society and the pacification of oppression-

    centered social frameworks.


