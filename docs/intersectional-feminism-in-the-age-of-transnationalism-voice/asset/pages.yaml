    spiritual communities despite violent repression.¹⁴ *Candomblé* in Salvador reflects
    the fusion of multiple ethnic groups who represent neighboring regions in Yoruba-land,
    current-day Nigeria, Togo and Benin, who are all guided by the *orixás*, spirit-gods.
    While individual *orixás* are revered in isolation in villages across multiple
    nations of West Africa, in the colonial Brazilian context different ethnic groups
    were forced and then transformed their ancestral practices into something new,
    which was Candomblé. In the Brazilian fusion, multiple orixa are worshipped simultaneously
    within the same nation rather than remaining and revered in adjacent nations as
    in Africa. *Each orixa* spirit guide is known for its association with specific
    elements of nature and particular roles in the functioning of interpersonal relations.
    The Dique de Tororó in the center of Salvador, for example, boasts statues of
    eight of the primary *orixás* that are revered by many Brazilians, both those
