    # THE CARE WE OFFER”: INIMATE NETWORKS AND VIBRATIONAL CONNECTIVITY


    In The Cultural Politics of Emotion, feminist scholar Sarah Ahmed demonstrates
    how official powers utilize a rhetoric based on emotion to discipline affective
    experience, often neutralizing contradictory experiences in moments when the state
    is pressed to assert its authority. Ahmed’s case study deals with the Australian
    government’s attempt at reconc with aboriginal tribes, in the context of postdictatorship
    Chile; Elite’s embrace of affective volatility and ambivalence presents an ethical
    challenge toward the neutralizing politics of Transition that used “consensus”
    at all costs.


    As critic Nelly Richard argues in Cultural Resides, the consensus model “neutralized
    different counterpoints, antagonistic and polemical stances . by means of an institutional
    pluralism that forced diversity to be noncontradictory.”^51 This rhetoric of consensus
    piggybacked onto the illusion of the Chilean “miracle” celebrated by Milton Friedman,
    and painted Chile as a developing nation “saved” from the dangers of socialism
    that threatened the country decades before the miraculous forces of democracy
    and the market (Grandin 22). As many scholars have argued—from Nelly Richard,
    to Francisco Masio, to Daniela Elit—these political and market-based ideological
    programs obfuscated the complex experience of the Chilean Transition, erasing
    the intimate frictions that characterized the moment in favor of reconciliation
    as an artifact, top-down project. As the neoliberal project took hold, Lauren
    Berlant’s Cruel Optimism examines its ideological promise of the “good life,”
    and recognizes how the optimism deployed by subjects in an effort to reproduce
    this ideal leads to a suppression of the lesser manifestations of performive life,
    such as “dread, anxiety, hunger, curiosity, the whole gamut.”^52 Fuerzas especiales
    asks us to consider the structural biases or inequalities inherent in these projects,
    well as the ongoing frictions that produced subjects negotiate discursive disciplinary
    constraints, construct their personal, biographical narratives and consolidate
    relationships.'
