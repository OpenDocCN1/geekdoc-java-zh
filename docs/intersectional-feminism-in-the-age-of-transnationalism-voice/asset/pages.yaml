    Maruja Mallo.\^24 Las Máscaras paintings engine, therefore, from Mallo’s personal
    contact with the religious ceremonies of Vudú, Candomlé, and Macumba.


    The Afro-Brazilian religion of Candomble reflects Brazil''s cross-national mesti
    identity and symbolizes the aspirations of Brazil to become a fully racially integrated
    nation. The concept of Brazilian identity has been reformulated in large part
    by the efforts of Brazilian Regionalism, which, since 1930, has proposed an image
    of Brazil as a country proud of its mulatto or mestizo identity.\^25 From 1930,
    as J. Roland Matory explains, Candomblé became the ideal to aspire to as. By the
    1980s, Candomblé became the emblem of "the regions" status as an exemplar and
    bastion against alienation and marginalization of people of numerous regions,
    classes, and genders in Brazil.\^26


    The social aspect of Candomblé must have resonated strongly with Mallo and her
    lifelong search for a true egalitarian order. In addition to its democratic nature,
    Candomblé is a religion that empowers its followers to find happiness in the here
    and now not in the afterlife. Like many other belief systems the Judeo-Christian
    tradition, Candomblé is a practical, here-and-now belief system that does not
    separate the spiritual and material aspects of human beings.\^27 Mallo, like her,
    the philosopher María Zambrano, rejected the imbalance and alienation caused by
    the exclusionary value system of the rationalist patriarchal madrid. Far from
    rejecting the materiality of life as inferior to the realm of thought and spirit,
    and realizing that human existence is a situated one, Mallo and Zambrano strongly
    believed that any living organism could not aspire to find happiness in a realm
    separated from the physical world. The "poetic reason" postulated by Zambrano
    as an alternative to the prevailing rationalism of her time was a new methodology
