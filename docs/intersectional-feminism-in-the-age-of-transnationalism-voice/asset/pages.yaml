    For Mallo, the image of the worker holding the loaf of bread symbolized the emergence
    of a proletarian order that would carry out the revolutionary project that Mallo
    dreamed for Spain. The painting El canto de las espigas,10 Mallo states, was directly
    inspired by this vision. In this painting, Mallo represents the Greek goddess
    Demeter, at the time of her transformation into wheat. Wheat was the goddess of
    the harvest and fertility, and presided over the cycle of life and death with
    the natural order. Wheat, for Mallo, was the symbol of a social struggle, terrestrial
    myth. In relation to the meaning of wheat in this painting, Mallo explains that
    wheat is “the universal vegetable, symbol of social struggle. The two Castillas,
    from my materialistic faith in the fish, in the rule of the wheat spike.,”11 The
    materialistic faith Mallo refers to her unwavering belief in the republican project.
    Mallo dedicated this series to the fishermen and peasants of her beloved country,
    who, for, embodied the democratic ideal of the Spanish Second Republic. The wheat
    spikes motif was one of the most widespread symbols of the Spanish Republic.12
    Therefore, the archetype of the telluric motif symbolizes the rise of a new social
    alternative to the patriarchal society that had failed to establish a democratic
    system. In order to achieve social justice and eliminate oppression, humankind
    needed to find a new way of moving forward, leaving behind the exploitation of
    people and nature.13 The telluric and permeable trinity represented in this painting,
    with her body completely open to nature, personified the natural network that
    connects all species, as expressed by the artist through the network of spikes
    that depicts the entity.


    La religión del trabajo reflects Mallo’s profound admiration for the natural order.
    As she expressed many times, wanted to emulate, to paint like nature.,14 Nature,
    for Mallo, personified a supreme intelligence that rationally maintained the universal
    balance on the concepts of completeness and connectivity. This balance is based
    on what is known as the Golden ratio or Divine proportion, a mathematical formula
    that is found throughout the universe; from the spiral of Nautilus seashell to
    the helices of galaxies. In the paintings of La religión del trabajo, these ideas
    are visually articulated through the way in which Mallo geometrically arranges
    the compositional space, symbols she employs, and the characterization of the
    divities. The female protagonists, who exhibit somewhat androgynous features,
    like ancestral goddesses closely connected with the natural order. Mallo seems
    to propose a new materialistic principle that is defined as contrary to the patriarchal
    religion of European Christian culture. Unlike the Catholic imagery where the
    role of women is reduced to that of mother and wife, in Mallo’s new mythology
    we find ourselves in front of a universe of'
