    Currently her research focuses on the artistic and literary production of Latin-American
    and Spanish avant-garde women painters and writers. In La otra cara de la vanguardia:
    estudio comparativo de la obra artística de Maruja Mallo, Angeles Santos y Remedios
    Varo (Edward Mellen Press, 2006), Zanettaetta comparatively analyzes the visual
    manifestations of these women painters central to the various ideological struggles
