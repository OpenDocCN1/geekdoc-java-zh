    Anzaldúa implies any translatability of tongues, and some sections are not translated
    at all. This is to say that text offers no, easily accessible common language.
    Its various tongues cut against each other, running together and apart. In this
    way it presents a serious challenge to the monocular reader, and it interdicts
    any facile access to the borderlands. Through their languages, these borderlands
    show layer of history to those who followed their tangled paths, or in Anzaldúa’s
    metaphor, forking tongues. This intertwining of differences does not take recourse
    in myths of commonality, imperial-humanist, or otherwise. Nor does it allow assertions
    of difference that avoid what there is of a common history. Anzaldúa’s linguistic
    tifts also engage the reader in a way that is a condition of human existence rather
    than the effect of difference that constitutes hierarchies.¹³² Rather, the use
