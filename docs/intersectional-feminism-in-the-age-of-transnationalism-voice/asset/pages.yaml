  md: '# # Introduction


    # ## Transnationalism and Intersectional Feminism—Convergence and Conflict


    Ol Bezhanova


    Much of the work on this book on transnationalism and the degree to which it is
    compatible with intersectional feminism was done as the COVID-19 pandemic disrupted
    our lives and made us even more conscious than before of planetary interconnectedness.
    In its global reach, COVID-19 has been compared to the pandemic that devastated
    the planet almost a century earlier and that is still known under the name of
    ‘the Spanish flu.’ The complex dynamic of international relations of the moment
    made the association between Spain and this deadly strain of influenza impossible,
    even though the illness did not originate.¹ As scholars of Hispanic Studies, we
    are aware of the ways that global catastrophes, of which pandemics are only one
    example, are narrated and placed in the service of already existing power layers.
    We are yet to appreciate the full consequences of COVID-19 but it is already clear,
    that any highly disruptive event of a planetary significance, the pandemic exposed
    the tensions between the global and the national as well as the national and the
    local. At the same time, the pandemic and our reactions to it highlighted the
    continued relevance of categories of sex, race, and class and the intersections
    between them.


    The impact of COVID-19 is unevenly distributed by both biological sex and its
    social expression through gender. The pandemic causes a significantly larger mortality
    in men than in women, with the death rates showing that over 60% of victims claimed
    by the disease are male². At the same time, the secondary effects of the pandemic
    have been acutely felt by women and girls. The policy brief released by the Women
    Headquarters of the United Nations on April 9, 2020, traces the exponential growth
    in gender-based violence as a result of the quarantine measures undertaken by
    many governments to combat the pandemic.³ The brief also discusses the unely ways
    in which the pandemic is undermining women’s economic gains:'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Olga Bezhanova


    Emerging evidence on the impact of COVID-19 suggests that women’s economic and
    productive lives will be affected disproportionately and differently from men.
    Across the globe, women earn less, save less, hold less secure jobs, are more
    likely to be employed in the informal sector. They have less access to social
    protections and are the majority of single-parent households. Their capacity to
    absorb economic shocks is therefore less than that of men.


    The pandemic is also having a disparate effect along racial and ethnic lines.
    In early April of 2020, Aletha Maybank, the chief health equity officer and vice
    president of the American Medical Association, issued a statement calling on the
    public authorities in the United States to release the information on the racial
    and ethnic impacts of the pandemic. There is evidence, for instance, that African
    Americans are disproportionately affected by the pandemic, yet the response to
    this axis of crisis has been lacking. A preprint titled “Assessing Differential
    Impacts of COVID-19 on Black Communities” that reflected the results of a study
    by the Public Policy Office of the Foundation for AIDS Research concluded, that
    “nearly twenty-two percent of US counties are disproportionately black and they
    accounted for 52% of COVID-19 diagnoses and 58% of COVID-19 deaths nationally...
    Social conditions, structural racism, and other factors elevate risk for COVID-19
    diagnoses and deaths in black communities.


    These disparities exist on a global scale, as well. COVID-19 has demonstrated
    that the capacity to concentrate on mitigating the effects of the pandemic is
    a luxury that some countries and regions cannot afford. As the coronavirus started
    reaching East Africa, for instance, it has become clear that for people in the
    region concerns over the pandemic will have to take second place to the devastation
    wrought by the largest infestation of locusts that East Africa have experienced
    in seventy-five years. The difficulty of getting the protective equipment, the
    medical supplies, and the trained personnel that many countries at the height
    of the COVID-19 pandemic was aggravated, in East Africa, by the need to make extraordinary
    efforts to prevent swarms of locusts from moving to parts of the continent that
    are less prepared to battle the infestation of these insects. The solidarity usually
    practiced by African countries in the face of such calamities is undermined by
    the need to maintain social distancing. As Keith Cressman, a senior locust forecasting
    officer with the Nations’ Food and Agriculture Organization put, “with travel
    restrictions in place, experts can’t get there to train people up. And even if
    they could get there, social distancing means you can’t fill rooms for lessons
    on locust control...Social distancing is a privilege that comes at a greater price
    for individuals and countries that exist in permanent scarcity.'
