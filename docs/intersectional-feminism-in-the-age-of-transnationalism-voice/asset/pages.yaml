    for Sarduy, and sound were integral to his conception of literature. He believed
    his literary and poetic texts to be embodied transmissions of the voices in his
    surrounding reality and their communication to the reader in poetic form. In “Soy
    Juana de Arco electrónica, actual,” he writes:


    Like the holy warrior [Joan of Arc] I hears voices. They don''t order my sacrifice
    or اغلب of my body or person. But I only write for these voices. The text—and
    not only a radiophonic text; all of them, a poem—never presents itself to me in
    an abstract, unemodied way, if I may say, to its nakedness or conceptuality. I
    never think of any argument or content matter that, later on, would have to render
    and carve laboriously. Everything is already “said” from the beginning, there
    is no beginning but in listening.34


