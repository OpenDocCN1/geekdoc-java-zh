    As large-scale catastrophes of the past half have tended to do, the COVID-19 pandemic
    strengthened the neoliberalizing projects that had already been in place. To give
    an example, Costa Rica, a country whose healthcare system is the best in Central
    America, experienced the lowest COVID-related mortality rates in the region. Still,
    the financial elites of the country have used this difficult moment to push for
    the flexibilization of workers contracts that would erode the hard-won gains of
    the country’s labor movements.¹⁷ In Mexico, Alfonso Ramírez Cuéar, the president
    of MORENA, has questioned the excessive reach of the austerity measures undertaken
    by the government, that Ramirez Cuellar, enhancing its capacity to conduct environmental,
    agricultural, industrial, and financial policy.¹⁸ Since in many places large public
    gatherings are prohibited to slow the transmission rates of the coronavirus, it
    becomes impossible for workers to organize protests against these measures. There
    is little doubt that the high costs of pandemic-related quarantines will be recouped
    through a variety of austerity measures that will further weaken nations. The
    World Health Organization is conscious of this possibility, and its European Director
    Hans Kluge has called to the leaders of European countries to avoid repeating
    the sad history of administering austerity cuts to social programs that characterized
    the EU’s response to the global economic crisis of 2008–2009.¹⁹ It is also likely
    that the damage wrought by the pandemic will be used to justify, for a long time
    to come, a variety of cost-cutting measures that will increase global inequality
    and advance the neoliberal assault on the concept of state sovereignty.


    As we observe the disparate effects of the COVID-19 pandemic on different genders,
    races, regions, and socioeconomic groups, it is becoming clear that an intersectional
    analysis of the effects of COVID-19 will be necessary to address the aftermath
    of the pandemic. Who do we expect to protect us during and after the pandemic?
    One of the effects of this crisis has been a realization that we still rely on
    the institutions of our respective nations-states to protect us from globally
    generated disasters. Globalization has weakened the nation-state model, and catastrophes
    of the caliber of COVID-19 highlight the consequences of this. As Philip Bobbitt
    warned in 2003, the nation-state model of governance becomes delegitimized when
    it is demonstrated to be impotent in the face of global threats: “No nation-state
    can protect its society from transnational perils, such as ozone depletion, global
    warming, and infectious epidemics. And yet guaranteeing national security, civil
    peace through law, economic development and stability, international tranquillity
    and equality, were the principal tasks of the nation-state.”²⁰ Once the'
