    a mystical bond within a group. In prehistoric societies, totems were crucial
    religious symbols built to maintain social cohesion and to transmit the cultural
    values of the community. Mallo''s totems convey a new concept of humanity which
    does not conceive itself as the center of the universe but as a part of the cosmic
    order. In this way, representing plants, seashells, and marine animals in a relationship
