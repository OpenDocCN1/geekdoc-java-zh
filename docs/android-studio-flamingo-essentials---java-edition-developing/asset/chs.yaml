  \n使用你操作系统的文件导航器，在书籍代码示例下载的 `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并将其复制。在 Project\
  \ 工具窗口中，右键点击 `app` -> `res` -> `drawable` 项，并在弹出的菜单中选择 `Paste`（粘贴）。\n\n运行时，应用栏的显示应如图\
  \ 50-7 所示：\n\n![](img/as_cardlayout_image.jpg)\n\n图 50-7\n\n向上滚动列表将导致应用栏逐渐折叠。在收缩过程中，图像将淡变为由\
  \ `scrim` 属性定义的颜色，同时标题文本的字体大小会按相应的比例缩小，直到只剩下工具栏：\n\n![](img/as_cardlayout_image_collapsed.jpg)\n\
  \n图 50-8\n\n由于 `activity_main.xml` 文件中的工具栏元素配置为使用 `pin`（固定）模式，因此在滚动动作的初始阶段，尽管灵活区域折叠，工具栏保持可见（如果继续向上滚动，工具栏也将移出视野）：\n\
  \n```xml\napp:layout_collapseMode=\"pin\"\n```\n\n如果将折叠模式设置为 `parallax`（视差），则工具栏将随视图一起收回。\n\
  \n继续向上滚动将导致工具栏也折叠，只剩下状态栏可见：\n\n![](img/as_cardlayout_image_fully_collapsed.jpg)\n\
  \n图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scroll flags` 属性包含了 `enterAlways`\
  \ 选项，向下滚动将会导致应用栏再次展开。\n\n要将工具栏固定在位置使其在向上滚动期间不再消失，请如下所示，将 `activity_main.xml` 文件中\
  \ `CollapsingToolbarLayout` 元素的 `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`：\n\
  \n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"\
  @+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n### 50.5 修改标题和 Scrim 颜色\n\
  \n最后一个任务是编辑 `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，更改折叠布局管理器实例上的标题文本，并设置不同的\
  \ `scrim` 颜色（注意 `scrim` 颜色也可以在布局资源文件中设置）：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \n.\n.\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\nimport\
  \ android.graphics.Color;\n\n.\n.\n.\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        setContentView(binding.getRoot());\n\
  \        setSupportActionBar(binding.toolbar);\n        binding.collapsingToolbar.setTitle(\"\
  My Toolbar Title\");\n        binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \        layoutManager = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n.\n.\n```\n\n最后运行一次应用，并注意新标题出现在应用栏中，并且现在滚动时会导致工具栏在移出视野时过渡到绿色。\n\n### 50.6\
  \ 总结\n\n出现在大多数 Android 应用顶部的应用栏可以由许多不同的元素组成，包括工具栏、标签页布局甚至图像视图。当嵌入在 `CoordinatorLayout`\
  \ 父布局中时，可以使用许多不同的选项来控制应用栏响应活动主要内容滚动事件的行为。为了对这种行为进行更深入的控制，`CollapsingToolbarLayout`\
  \ 管理器针对应用栏内容相对于滚动活动的展开和收缩方式提供了一系列额外的控制级别。\n\n## 51. Android Studio 主界面/详情流教程\n\n\
  本章将在介绍主界面/详情用户界面设计概念之前，详细探讨构成 Android Studio 包含的主界面/详情流模板的元素。随后将创建一个应用程序。\n\n###\
  \ 51.1 主界面/详情流 (Primary/Detail Flow)\n\n主界面/详情流是一种界面设计，其中向用户显示项目列表（称为“主列表”）。从列表中选择一个项目后，与该项目相关的附加信息将在详情面板中呈现给用户。例如，一个电子邮件应用程序可能包含一个发件者地址和消息主题的主列表。选择某条消息后，邮件正文将出现在详情面板中。\n\
  \n在横屏模式的平板电脑尺寸 Android 设备上，主列表显示在屏幕左边缘的狭窄面板中。显示器的其余部分用于详情面板，这种布局被称为“双窗模式”。图 51-1\
  \ 示例显示了双窗布局：\n\n![](img/as_detail_flow_tablet.jpg)\n\n图 51-1\n\n在较小的手机尺寸 Android\
  \ 设备上，主列表占据整个屏幕，详情面板在从主列表选择后出现在另一个屏幕上。在这种模式下，详情屏幕包含一个返回主列表的操作项。图 51-2 示例说明了 4 英寸手机上同一项目的主、详情屏幕：\n\
  \n![](img/as_detail_flow_phone.jpg)\n\n图 51-2\n\n### 51.2 创建主界面/详情流 Activity\n\n\
  在本章的下一节中，将详细介绍主界面/详情流模板的元素。这通过在使用主界面/详情流模板创建项目来实现最佳实现。\n\n从欢迎界面选择 `New Project`\
  \ 选项，在生成的新项目对话框中选择 `No Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段输入 `PrimaryDetailFlow`\
  \ 并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API`\
  \ 级别设置为 `API 26: Android 8.0 (Oreo)`并将 `Language` 菜单改为 `Java`。\n\n### 51.3 添加主界面/详情流\
  \ Activity\n\n在 Project 工具窗口中，右键点击 `app` -> `java` -> `com.ebookfrenzy.primarydetailflow`\
  \ 项，并选择 `New -> Activity -> Primary/Detail Views Flow` 菜单选项。在新活动对话框中（图 51-3），在点击\
  \ `Finish` 按钮之前，请确保勾选了 `Launcher Activity` 复选框：\n\n![](img/as_primary_detail_new.jpg)\n\
  \n图 51-3\n\n## 51.4 修改主界面/详情流模板\n\n虽然主界面/详情流模板的结构最初看起来可能困惑，但正如将要所示，对于许多主界面/详情实现需求，模板提供的许多功能可以保持不变。\n\
  \n\n\n\n\n在本章的剩余部分中，将对 `PrimaryDetailFlow` 项目进行修改，使主列表显示网站名称列表，并将详情面板更改为包含一个 `WebView`\
  \ 对象，而不是当前的 `TextView`。当用户选择某个网站时，相应的网页将随之加载并显示在详情面板中。\n\n## 51.5 修改内容模型\n\n目前示例的内容由\
  \ `PlaceholderContent` 类文件定义。因此，首先请选择 `PlaceholderContent.java` 文件（位于 Project 工具窗口中的\
  \ `app -> java -> com.ebookfrenzy.primarydetailflow -> placeholder` 文件夹中）并查看代码。在文件的底部有一个名为\
  \ `PlaceholderItem` 的类声明，该类目前能够存储三个 `String` 对象（分别代表内容字符串、详情字符串）以及一个 `ID`。相比之下，更新后的项目需要每个条目对象都包含一个\
  \ `ID` 字符串、一个网站名称字符串以及一个该网站对应的 `URL` 字符串。为了添加这些功能，请修改 `PlaceholderItem` 类，使其内容如下：\n\
  \n```java\npublic static class PlaceholderItem {\n    public String id;\n    public\
  \ String website_name;\n    public String website_url;\n    public PlaceholderItem(String\
  \ id, String website_name,\n            String website_url)\n    {\n        this.id\
  \ = id;\n        this.website_name = website_name;\n        this.website_url = website_url;\n\
  \    }\n    @Override\n    public String toString() {\n            return website_name;\n\
  \    }\n}\n```\n\n注意，封装的 `PlaceholderContent` 类目前包含一个 `for` 循环，通过多次调用名为 `createPlaceholderItem()`\
  \ 和 `makeDetails()` 方法来添加 25 个条目。这部分代码将不再需要，应按照如下方式从类中删除：\n\n```java\npublic static\
  \ final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String, PlaceholderItem>();\n\
  \nprivate static final int COUNT = 25;\n\nstatic {\n    // 添加一些示例项。\n    for (int\
  \ i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n    }\n\
  }\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改，以使用所需的网站数据初始化数据模型：\n\n```java\n\
  public static final Map<String, PlaceholderItem> ITEM_MAP =\n        new HashMap<String,\
  \ PlaceholderItem>();\n\nstatic {\n    // 添加 3 个示例项。\n    addItem(new PlaceholderItem(\"\
  1\", \"eBookFrenzy\",\n            \"https://www.ebookfrenzy.com\"));\n    addItem(new\
  \ PlaceholderItem(\"2\", \"Amazon\",\n            \"https://www.amazon.com\"));\n\
  \    addItem(new PlaceholderItem(\"3\", \"New York Times\",\n            \"https://www.nytimes.com\"\
  ));\n}\n```\n\n现在代码利用了修改后的 `PlaceholderItem` 类来存储每个条目的 `ID`、网站名称和 `URL`。\n\n###\
  \ 51.6 修改详情面板\n\n详情面板（当用户从主列表中选择条目时显示的屏幕）的布局包含在 `activity_item_detail.xml` 文件中，该文件又包含一个\
  \ `FrameLayout` 实例，用于显示实际的详情面板。如果应用在单面板模式下显示，框架容器将显示在 `fragment_item_detail.xml`\
  \ 中的布局，而多面板模式将显示 `fragment_item_detail.xml` 布局。\n\nAndroid Studio 提供的模板布局包含一个 `CoordinatorLayout`\
  \ 布局，其中包含一个应用内栏（app bar）、工具栏（toolbar）、浮动操作按钮和一个文本视图（text view）。对于本示例，我们需要显示的是 `WebView`，因此请打开此文件并删除布局中除\
  \ `item_detail_container` 以外的所有视图。执行此操作最简单的方法是在按下删除键之前，如所示在 `Component Tree` 中选择所有不需要的视图：\n\
  \n从 `Palette` 的 `Widgets` 部分拖一个 `WebView` 对象并将其放置到布局画布中心，并将 `id` 更改为 `website_detail`。接下来，编辑\
  \ `fragment_item_detail.xml` 文件，在将 `WebView` 放到布局之前删除默认的 `TextView` 实例，再次将 `id`\
  \ 更改为 `website_detail`。这两个文件的布局现在应该如下。\n\n## 51.7 修改 ItemFragment 类\n\n此时，用户界面详情面板已经修改，但相应的\
  \ Java 类仍然设计为用于 `TextView` 对象而非 `WebView` 对象。通过双击 Project 工具窗口中的 `ItemFragment.java`\
  \ 文件加载该类的源代码。为了加载与当前选中条目对应的网页，需要更改几行代码。完成此更改后，代码应如下：\n\n```java\nimport android.webkit.WebResourceRequest;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class\
  \ ItemDetailFragment extends Fragment {\n\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n            Bundle savedInstanceState) {\n   \
  \     binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\
  \        View rootView = binding.getRoot();\n        mToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \        mTextView = binding.ItemDetail;\n        updateContent();\n        rootView.setOnDragListener(dragListener);\n\
  \        return rootView;\n    }\n\n    private void updateContent() {\n       \
  \ if (mItem != null) {\n            binding.websiteDetail.setWebViewClient(new WebViewClient()\
  \ {\n                @Override\n                public boolean shouldOverrideUrlLoading(\n\
  \                        WebView view, WebResourceRequest request) {\n         \
  \           return super.shouldOverrideUrlLoading(\n                           \
  \ view, request);\n                }\n            });\n            binding.websiteDetail.loadUrl(mItem.website_url);\n\
  \        }\n    }\n}\n```\n\n在上述代码中，删除了对工具栏布局和详情元素的引用，这些元素已从 `fragment_item_detail.xml`\
  \ 中移除。\n\n接下来，修改 `updateContent()` 以访问 `website_detail`（以前是 `TextView`，现在是 `WebView`）并从选中条目中提取\
  \ URL。创建一个 `WebViewClient` 实例并分配 `shouldOverrideUrlLoading` 回调方法。实现该方法是为了强制系统使用\
  \ `WebView` 实例加载页面，而不是 Chrome 浏览器。\n\n## 51.8 修改 ItemListFragment 类\n\n还需要对 `ItemListFragment.java`\
  \ 文件进行细微调整，以确保网站名称显示在主列表中。编辑此文件，找到 `onBindViewHolder()` 方法并修改 `setText()` 调用以引用网站名称如下：\n\
