  \ – 应用程序借此获取设备上当前安装的其他应用程序信息的系统。\n* `Telephony Manager` – 为应用程序提供设备上可用电话服务的信息，例如状态和订阅者信息。\n\
  * `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置更改更新。\n\n## 9.6 应用程序\n\n位于 Android 软件栈顶端的是应用程序。这些包含了特定\
  \ Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户购买设备后安装的第三方应用程序。\n\n## 9.7 总结\n\n良好的\
  \ Android 开发知识基础需要对 Android 的整体架构有理解。Android 以软件栈架构的形式实现，由 Linux 内核、运行时及相应库、应用框架以及应用程序组成。应用程序主要使用\
  \ Java 或 Kotlin 编写并在 Android Studio 构建环境中编译为字节码格式。\n\n## 10 Android 应用程序的解析\n\n\
  无论你之前的编程经验是基于 Windows、macOS、Linux 还是 iOS 的，都很有可能 Android 开发与你遇到过的任何事情都完全不同。\n\n\n\
  \n\n因此，本章的目标是提供对 Android 应用架构背后的高层概念的理解。在此，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个内聚应用程序的机制。\n\
  \n## 10.1 Android Activities（活动）\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象语言的人都会熟悉将应用程序功能元素封装在类中，然后将其实例化为对象并进行操作以创建应用程序的概念。由于\
  \ Android 应用是用 `Java` 和 `Kotlin` 编写的，这种情况仍然适用。然而，Android 还将可重用组件的概念提升到了更高的水平。\n\n\
  Android 应用是通过汇聚一个或多个称为 `Activities` 的组件创建的。`Activity` 是应用程序功能的一个单一、独立模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个显示当天已安排预约的\
  \ Activity 屏幕。该应用程序可能还会使用第二个 Activity，该 Activity 包含一个用户可以在其中输入新预约的屏幕。\n\n`Activities`\
  \ 被设计为完全可重用且可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的 Activity。开发者可能正在编写一个也具有发送电子邮件消息要求的应用程序。开发者无需为新应用程序专门开发一个电子邮件编写\
  \ Activity，只需直接使用现有电子邮件应用程序中的 Activity 即可。\n\n`Activities` 是作为 Android `Activity`\
  \ 类的子类创建的，并且必须实现为完全独立于应用程序中的其他 Activity。换句话说，共享的 Activity 不能够依赖于在程序流的已知点处被调用（因为其他应用程序可能会以意想不到的方式使用该\
  \ Activity），而且一个 Activity 不能直接调用另一个 Activity 的方法或访问其实例数据。相反，这种功能是通过通过使用 `Intents`\
  \ 和 `Content Providers` 实现的。\n\n默认情况下，Activity 无法向调用它的 Activity 返回结果。如果需要此功能，则必须将该\
  \ Activity 特别地作为源 Activity 的子活动（sub-activity）来启动。\n\n## 10.2 Android Fragments（片段）\n\
  \n如上所述，一个 Activity 通常代表应用 内部的单一用户界面屏幕。一种方案是使用单一的用户界面布局和一个对应的 Activity 类文件来构建 Activity。然而，更好的替代方案是将\
  \ Activity 拆分为不同的部分。这些部分中的每一个都被称为 `fragment`，每个片段由用户界面布局的一部分和一个匹配的类文件（声明为 Android\
  \ `Fragment` 类的子类）组成。在这种情况下，Activity 简单地变成包含一个或多个片段的容器。\n\n事实上，片段为让每个用户界面屏幕由一个独立的\
  \ Activity 表示提供了一种高效的替代方案。相反，一个应用可以由单个 Activity 组成，并在不同的片段之间进行切换，每个片段代表不同的应用屏幕。\n\
  \n## 10.3 Android Intents（意图）\n\n`Intents` 是一个 Activity 启动另一个 Activity 并实现组成应用程序的\
  \ Activity 流的机制。`Intents` 由对要执行的操作的描述以及可选的、在该操作上执行的数据组成。\n\n`Intents` 可以是显式的（explicit），即它们通过类名引用\
  \ Activity 来请求启动特定的 Activity；也可以是隐式的（implicit），即通过说明要执行的操作类型或提供在该操作上执行的特定类型数据来实现。在隐式意图的情况下，Android\
  \ 运行时将使用称为 `Intent Resolution`（意图解析）的过程，选择最符合 `Intent` 指定标准的 Activity 来进行启动。\n\n\
  ## 10.4 Broadcast Intents（广播意图）\n\n`Intent` 的另一种类型——`Broadcast Intent`，是一种系统范围内的意图，发送给所有注册了“感兴趣”的\
  \ `Broadcast Receiver` 的应用程序。例如，Android 系统通常会发送广播意图来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕的开启或关闭。\n\
  \n`Broadcast Intent` 可以是正规（异步的），因为它在几乎相同的时间内发送给所有感兴趣的 `Broadcast Receivers`；也可以是有序的（ordered），因为它一次发送给一个接收器，接收器可以对其进行处理，然后要么中止，要么允许传递给下一个\
  \ `Broadcast Receiver`。\n\n## 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`\
  \ 是应用程序能够响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当广播一个匹配的意图时，无论注册该接收器的应用程序当前是否在运行，Android\
  \ 运行时都会都会调用该接收器。接收器随后有 5 秒钟来完成对其所要求的任何任务（例如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast\
  \ Receivers` 在后台运行，并且没有用户界面。\n\n## 10.6 Android Services（服务）\n\nAndroid `Services`\
  \ 是在后台运行且没有用户界面的进程。它们可以从 Activity、`Broadcast Receivers` 或其他 `Services` 启动并随后管理。Android\
  \ `Services` 适用于应用程序需要继续执行任务但不一定需要用户界面对用户可见的情况。虽然 `Services` 缺少用户界面，但它们仍然可以使用通知（notifications）和吐司（toasts，在屏幕上出现且不中断当前可见\
  \ Activity 的小通知消息）来通知用户事件，并且能够发布 `Intents`。\n\nAndroid 运行时赋予 `Services` 的优先级比许多其他进程更高，系统仅会在最后手段将其终止以释放资源。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次变得可用，它将自动重启。`Service` 可以通过声明自己需要在在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于终止会损害用户体验的情况（例如，如果用户正在收听由 `Service` 流的音频）。\n\n`Service` 可能作为实际解决方案的示例场景包括，如之前提到的，当应用程序不再活动时继续流的音频，或者当股票达到指定价格时需要通知用户的股票跟踪应用程序。\n\
  \n## 10.7 Content Providers（内容提供者）\n\n`Content Providers` 实现了一种在应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 向其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据（取决于权限）。对数据的访问通过由 `Content Provider`\
  \ 定义的通用资源标识符 (`URI`）提供。数据可以以文件或整个 `SQLite` 数据库的形式共享。\n\n\n\n\n原生 Android 应用包含许多标准\
  \ Content Providers（内容提供者），允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的 Content Providers\
  \ 可以通过 Content Resolver（内容解析器）定位。\n\n## 10.8 应用程序清单（Application Manifest）\n\n将组成应用程序的各种元素整合在一起的胶水是应用程序清单文件。在这个基于\
  \ XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\n## 10.9 应用程序资源（Application Resources）\n\
  \n除了清单文件包含字节码的 Dex 文件外，Android 应用包通常还包含一组资源文件。这些文件包含了用户界面中显示的资源，如字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层级结构的 `/res` 子目录下。\n\n## 10.10 应用程序上下文（Application Context）\n\
  \n当应用程序编译时，会创建一个名为 `R` 的类，该类包含对应用程序资源的引用。应用程序清单文件和这些资源结合在一起形成了所谓的“应用程序上下文”（Application\
  \ Context）。该上下文由 `Android Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文上调用许多方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 总结\n\n许多不同的元素可以组合成一个 Android 应用。在本章中，我们提供了活动（Activities）、片段（Fragments）、服务（Services）、意图（Intents）和广播接收器（Broadcast\
  \ Receivers）的概述，以及清单文件和应用程序资源的概述。\n\n通过以活动和意图的形式创建独立的功能模块，促进了最大程度的重用和互操作；而通过实现内容提供实现了应用程序之间的数据共享。\n\
  \n活动专注于用户与应用程序交互的区域（一个活动本质上等同于单个用户界面屏幕，通常由一个或多个片段组成），而后台处理通常由服务广播接收器处理。\n\n构成应用程序的组件在清单文件中为\
  \ Android 运行时系统概述，该文件结合应用程序资源，代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。但请放心，在后续章节中将对这些概念进行深入的探索和实际应用，以确保为构建自己的应用程序奠坚实的知识基础。\n\
  \n## 11. Android 视图绑定（View Binding）概述\n\n开发 Android 应用的一个重要部分是代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的选项，特别强调一种名为“视图绑定”（view\
  \ binding）的选项。在涵盖视图绑定的基础之后，本章将概述如何将 AndroidSample 项目转换为使用这种方法。\n\n## 11.1 通过 Id\
  \ 查找视图\n\n正如章节[“Android 应用剖析”]中所概述的那样，构成应用程序的所有资源都被编译成一个名为 `R` 的类。在这些资源中包含了定义布局的资源。`R`\
  \ 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用都需要实现代码与这些视图之间的交互，例如在读取输入到 `EditText`\
  \ 视图的值或更改 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问视图的最常用选项是编写代码，通过名为\
  \ `findViewById()` 的方法根据 id 手动查找视图。例如：\n\n```\nTextView exampleView: = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过\
  \ id 查找视图仍然是一个可行选项，但它具有一些局限性，`findViewById()` 最大的缺点是可能会获取尚未在布局中创建的视图引用，导致在尝试访问视图属性时出现空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经有了以视图绑定形式提供的的另一种从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定（View\
  \ Binding）\n\n当在应用模块中启用视图绑定时，Android Studio 会自动为模块内的每个布局文件生成一个绑定类（binding class）。使用此绑定类，可以在代码内部访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”（camel case），并在末尾添加单词“Binding”。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命名为 `ActivityMainBinding`。\n\nAndroid Studio Flamingo\
  \ 在项目模板中使用视图绑定方面是不一致的。例如，我们在创建 AndroidSample 项目时使用的 Empty Views Activity 模板没有使用视图绑定。另一方面，Basic\
  \ Views Activity 模板是使用视图绑定实现的。如果你使用没有使用视图绑定的模板，了解如何将其添加到你的项目中是非常重要的。\n\n## 11.3\
  \ 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 AndroidSample 项目转换为使用视图绑定而不是使用 `findViewById()`\
  \ 来练习迁移到视图绑定。\n\n首先启动 Android Studio 并打开在章节[“在 Android Studio 中创建示例 Android 应用”]中创建的\
  \ AndroidSample 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须对每个需要视图绑定的模块进行 `build.gradle`\
  \ 文件修改。对于 AndroidSample 项目，这需要在 Gradle Scripts -> `build.gradle` (Module: app) 文件进行细微更改。将此文件加载到编辑器，找到\
  \ `android` 部分并添加以下项以启用 `viewBinding` 属性：\n\n```\nplugins {\n    id 'com.android.application'\n\
  }\n\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n\
  完成更改后，点击编辑器顶部的 Sync Now 链接，然后使用 Build 菜单清理并重新构建项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n##\
  \ 11.5 使用视图绑定\n\n此过程的第一步是“实例化”（inflate）视图绑定类，以便我们可以访问布局中的根视图。然后该根视图将用作布局的内容视图。\n\
  \n执行这些任务的逻辑位置是在与布局相关的 Activity 的 `onCreate()` 方法中。典型的 `onCreate()` 方法如下：\n\n```\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n\n\n\n要切换到使用视图绑定（view binding），需要导入视图绑定类并进行如下修改。由于布局文件命名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域名，则需要更改下面的导入语句以反映此变化：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们已经有了绑定的引用，可以如下所示通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(\n                           \
  \ binding.dollarText.getText().toString());\n        Float euroValue = dollarValue\
  \ * 0.85F;\n        binding.textView.setText(String.format(Locale.ENGLISH,\"%.2f\"\
  ,\n                            euroValue));\n    } else {\n        binding.textView.setText(R.string.no_value_string);\n\
  \    }\n}\n```\n\n编译并运行应用，验证货币转换过程是否如以前一样正常。\n\n### 11.6 选择选项\n\n尽管空视图活动（Empty Views\
  \ Activity）项目模板中没有采用视图绑定，但 Google 强烈建议尽可能使用视图绑定。因此，在开发自己的项目时，应该使用视图绑定。\n\n### 11.7\
  \ 书中示例中的视图绑定\n\n书中任何依赖未实现视图绑定的项目模板的章节将首先进行迁移。然而，为了避免每次需要迁移时都重复这些步骤，这些章节将引导你回到这里进行复习（别担心，几几章节之后，必要的更改就会变成性记忆）。为了帮助这一过程，接下来的章节将更简洁地总结了迁移步骤。\n\
  \n### 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 在 Project 工具窗口中列出模块级 Gradle\
  \ 构建脚本文件，路径为 `Gradle Scripts -> build.gradle (Module :app)`，其中 `<project name>`\
  \ 是项目名称（例如 `AndroidSample`）。\n\n2. 找到文件的 `android` 部分，并添加如下条目以启用 `viewBinding` 属性：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\
  ```\n\n3. 点击编辑器顶部的 `Sync Now` 链接，以根据这些新的构建设置重新同步项目。\n\n4. 编辑 `MainActivity.java`\
  \ 文件并将其修改为如下内容（其中 `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如\
  \ `androidsample`），且 `<binding name>` 是对应布局资源文件的绑定名称（例如，`activity_main.xml` 的绑定为\
  \ `ActivityMainBinding`）。\n\n```java\nimport android.view.View;\nimport android.<reverse\
  \ domain>.<project name>.databinding.<binding name>;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private <binding name> binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        binding = <binding name>.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n5. 通过名称访问视图。\n\n### 11.9 总结\n\n在引入视图绑定之前，访问 Android 内部视图涉及手动步骤。现在有了由 Android\
  \ Studio 为每个布局自动生成的视图绑定作为替代方案。\n\n## 12. 理解 Android 应用和 Activity 生命周期周期\n\n在较早的章节中，我们了解到\
  \ Android 运行在进程中，并由组件组成。本章的目标是通过查看应用程序和 Activity 的生命周期来扩展这些知识。\n\n无论移动设备与桌面系统相比拥有多少内存和计算能力（尽管宣传很多），重要的是记住，这些设备仍然被认为是“资源受限”的。因此，Android\
  \ 的核心责任之一是确保有效管理这些有限资源，并使操作系统和应用程序保持响应。为了实现这一点，Android 对生命周期和状态拥有完全控制权。\n\n### 12.1\
  \ Android 应用与资源管理\n\n每个运行的 Android 应用都被操作系统视为一个独立的进程。如果系统识别出设备上的资源正达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有正在运行进程的优先级和状态，结合这些因素创建 Google 所说的的“重要性层次结构”。\n\n### 12.2\
  \ Android 进程状态\n\n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管的应用程序中排名最高的活动组件定义。如图\
  \ 12-1 所示，进程在任何时刻都可以处于以下五种状态之一：\n\n#### 12.2.1 前台进程\n\n这些进程被分配了最高优先级。在任何时候，活跃的前台进程可能只有一个或两个，它们通常是系统最后被终止的。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n• 托管一个用户正在交互的活动。\n\n• 托管一个与用户正在交互的活动连接的 Service。\n\n\n\n\n\n- 托管一个服务（Service），该服务通过调用\
  \ `startForeground()` 指明终止该服务会对用户体验产生干扰。\n- 托管一个正在执行 `onCreate()`、`onResume()` 或\
  \ `onStart()` 回调的服务。\n- 托管一个正在执行 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\n\
  #### 12.2.2 可见进程\n\n包含一个对用户可见但并非用户正在交互的活动（Activity）的进程被分类为“可见进程”。通常情况下，当进程中的某个 Activity\
  \ 对用户可见，但另一个 Activity（如部分屏幕或对话框）处于前台时，就会这种情况。如果进程托管了一个 `Service`，且该服务本身绑定到一个可见或前台\
  \ Activity，那么该进程也具备可见状态。\n\n#### 12.2.3 服务进程\n\n包含一个已经启动并正在执行的 `Service` 的进程。\n\n\
  #### 12.2.4 后台进程\n\n包含一个或多个当前对用户不可见的 Activity，且没有托管符合服务进程状态的 `Service` 的进程。如果需要为高优先级进程释放额外的内存，属于此类别的进程将面临极高的终止风险。Android\
  \ 维护了一个后台进程的动态列表，按时间顺序终止进程，因此最久处于前台的进程会被首先杀死。\n\n#### 12.2.5 空进程\n\n空进程不再包含任何活跃的应用程序，但被保留在内存中，准备好作为新启动应用程序的托管者。这在某种程度上类似于为了乘客到达而让公交车门开启并保持引擎运转。显然，此类进程被认为优先级最低，是第一个被杀死以释放资源的进程。\n\
  \n### 12.3 进程间依赖\n\n确定最高优先级进程的情况比前节概述的要稍微复杂一些，其简单原因是进程之间往往存在相互依赖关系。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程服务（例如，作为前台进程的内容提供者的服务进程）。作为一个基本规则，Android 文档规定，进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n### 12.4 Activity 生命周期\n\n正如我们之前确定的，Android 进程的状态很大程度上取决于构成其托管的应用程序的活动和组件的状态。因此，理解这些活动在应用程序的执行生命周期内也会经历不同的状态是非常重要的。一个活动的当前状态部分取决于它在所谓的“Activity\
  \ 栈（Activity Stack）”中的位置。\n\n### 12.5 Activity 栈\n\n对于在 Android 设备上运行的每个应用程序，运行时系统都维护着一个\
  \ Activity 栈。当应用程序启动时，第一个启动的应用程序 Activity 被放入栈中。当启动第二个 Activity 时，它会被放置在栈顶，而上一个\
  \ Activity 被向下推。栈顶的 Activity 被称为活跃（或运行中）活动。当活跃活动退出时，运行时系统会将其从栈中弹出，栈中紧邻其下方的活动将成为当前的活跃活动。例如，位于栈顶的\
  \ Activity 可能会因为其负责的任务已完成而简单地退出。或者，用户可能选择了屏幕上的“返回”按钮以回到上一个活动，导致当前活动被运行时系统从栈中弹出并因此销毁。Android\
  \ Activity 栈的可视化表示如图图 12-2 所示。\n\n如图所示，新活动在启动时会被推入栈顶。当前活跃的活动一直位于栈顶，直到它被新的 Activity\
  \ 推下，或者在它退出或用户导航到上一个活动时从栈中弹出。如果资源受限，运行时将杀死活动，从栈底开始。\n\nActivity 栈即为编程术语中所谓的“后进先出（LIFO）”栈，因为最后一个被推入栈的项是第一个被弹出的项。\n\
  \n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\n图 12-2\n\n###\
  \ 12.6 Activity 状态\n\n在应用程序内部的执行过程中，活动可以处于若干不同状态之一：\n\n- **活跃 / 运行中（Active / Running）**\
  \ – 该活动位于 Activity 栈顶，是设备屏幕上可见的前台任务，拥有焦点并正在与用户交互。在资源短缺的情况下，这种活动最不可能被终止。\n- **暂停（Paused）**\
  \ – 该活动对用户可见，但目前没有焦点（通常是因为该活动被当前活跃的活动部分遮挡）。暂停的活动保留在内存中，保持与窗口管理器连接，保留所有状态信息，并在移动到\
  \ Activity 栈顶时可以快速地恢复到活跃状态。\n- **停止（Stopped）** – 该活动当前对用户不可见（换句话说，它在设备显示上被其他活动完全遮挡）。与暂停的活动一样，它保留了所有状态和成员信息，但在低内存情况下面临更高的终止风险。\n\
  - **杀死（Killed）** – 该活动已被运行时系统为了释放内存而终止，不再存在于 Activity 栈中。如果应用程序需要，必须重启此类活动。\n\n\
  ### 12.7 配置更改\n\n到本章为止，我们已经看了导致 Android 活动状态变化的两种原因，即活动在前台和后台之间的移动，以及运行时系统为了释放内存而对活动进行的终止。事实上，还有第三种情况会导致活动状态发生剧变，这种情况涉及对设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如设备在竖屏和横屏之间旋转，或更改系统字体设置）都会导致活动被销毁并重建。背后的逻辑是此类更改会影响布局等资源，简单地销毁并重建受影响的活动是响应配置更改最快的方法。然而，也可以配置活动，使其在响应特定配置更改时不被系统重启。\n\
  \n### 12.8 处理状态变化\n\n本章至少应该让人明确，应用程序以及根据定义包含其中的组件在生命周期内会经历许多状态。特别重要的一点是，这些状态变化（包括完全终止）是\
  \ Android 运行时施加于应用程序的，并取决于用户的操作和设备资源的可用性。\n\n\n\n\n然而，在实践中，这些状态的变化并不是在无通知的情况下发生的，在大多数情况下，运行时系统会通知应用程序更改，并给予其做出相应的反应。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 两种方法来处理应用内对象生命周期状态的变化。一种方法是响应操作系统的状态更改方法调用，这将在标题为“处理 Android Activity\
  \ 状态更改”的章节中详细介绍。\n\n另一种新方法（也是 Google 推荐的方法）涉及包含在 Jetpack Android 架构组件中的生命周期类，这些类在“使用\
  \ Jetpack 构建现代 Android 应用程序架构”中介绍，并在标题为“与 Android 生命周期感知组件一起”的章节中进行了更详细的解释。\n\n\
  ## 12.9 总结\n\n移动设备通常被认为资源受限，特别是在板载内存容量方面。因此，Android 操作系统的首要责任是确保应用程序以及整个操作系统对用户保持响应能力。\n\
  \n应用程序托管在 Android 的进程中。每个应用程序反过来由 Activity 和 Service 形式的组件组成。\n\nAndroid 运行时系统有权终止进程和单个\
  \ Activity 以释放内存。运行时系统在决定一个进程是否为合适的终止候选者时，会考虑进程状态。进程的状态很大程度上取决于该进程托管的 Activity 的状态。\n\
  \n本章的核心信息是，应用程序在执行生命周期内会经历多种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。不直接与用户交互的进程和 Activity\
  \ 面临更高的被运行时终止的风险。因此，Android 应用程序开发的一个要素要素是应用程序响应操作系统提供的状态更改通知的能力。\n\n## 13 处理 Android\
  \ Activity 状态更改\n\n根据标题为“理解 Android 应用程序和 Activity 生命周期”的章节概述的信息，现在显而易见，构成应用程序的\
  \ Activity 和 Fragment 在应用程序的生命周期期间会经历各种不同的状态。从一个状态到另一个状态的变化是由 Android 运行时系统强制的，因此在很大程度上超出了\
  \ Activity 自身的控制。然而，这并不意味着应用无法对这些更改做出反应并采取适当的行动。\n\n本章的主要目标提供关于 Activity 如何通知状态更改的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及\
  \ Activity 寿命的话题。\n\n## 13.1 新旧生命周期技术\n\n直到最近，一直有一种标准方法可以向应用中构建生命周期感知能力。这是本章涵盖的方法，它涉及在\
  \ Activity 或 Fragment 实例中实现一组方法（每个生命周期状态对应一个），当该对象的生命周期状态发生变化时，操作系统会调用这些方法。这种方法自\
  \ Android 操作系统的早期以来一直没有变化，虽然在今天仍然是一个可行选项，但它确实有一些局限性，这些局限将在本章稍后进行解释。\n\n随着 Jetpack\
  \ Android 架构组件引入了生命周期类，现在有了一种更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中详细介绍。然而，理解传统的生命周期方法仍然很重要，原因有几点：首先，作为一名\
  \ Android 开发人员，你无法完全隔绝传统的生命周期方法，并且仍然会使用其中的一些。更重要的是，理解处理生命周期的旧方法将为你以后在书书中开始学习新方法提供良好的知识基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n在少数例外，应用程序中的 Activity 和 Fragment 分别被创建为 `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类。\n\n例如，考虑在“在 Android Studio 中创建 Android 示例”中创建并转换为使用视图绑定（view\
  \ binding）的 AndroidSample 项目。将此项目加载到 Android Studio 环境中并找到 `MainActivity.java` 文件（位于\
  \ `app -> java -> <your domain> -> androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容应如下：\n\n\
  ```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value);\n\
  \        }\n    }\n}\n```\n\n当创建项目时，我们指示 Android Studio 创建了一个名为 `MainActivity.java`\
  \ 的初始 Activity。如上述代码所示，`MainActivity` 类是 `AppCompatActivity` 的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身是 `FragmentActivity` 类的子类，而 `FragmentActivity` 最终是 `Activity` 类的子类。可以在\
  \ Android Studio 编辑器中使用层次结构窗口（Hierarchy tool window）验证这一点。在 `MainActivity.java`\
  \ 文件加载到编辑器后，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。层次结构窗口随后将会出现，显示所选类的层次结构。正如图\
  \ 13-1 所示，`AppCompatActivity` 显然派生自 `FragmentActivity` 类，而后者最终是 `Activity` 类的子类：\n\
  \n![](img/as_3.6_class_heirachy.jpg)\n\n图 13-1\n\n`Activity` 和 `Fragment` 类包含一系列方法旨在由\
  \ Android 运行时调用以通知对象其状态正在发生更改。在本章中，我们将这些方法称为生命周期方法。Activity 或 Fragment 类只需要重写这些方法，并在其中实现必要的功能，以对状态更改做出相应反应。\n\
  \n\n\n\n\n其中一种方法命名为 `onCreate()`。再次回到上面的代码段，我们可以看到该方法已经在 `MainActivity` 类中被我们重写并为我们实现了。在随后的章节中，我们将详细探索\
  \ `onCreate()` 以及 `Activity` 和 `Fragment` 类的其他生命周期方法。\n\n### 13.3 动态状态 vs 持久化状态\n\
  \n生命周期管理的核心目标之一是确保活动的状态在适当的时间被保存和恢复。在此语境下，我们所说的状态是指当前活动中持有的数据以及用户界面的外观。例如，活动可能在内存中维护一个数据模型，该模型需要被保存到数据库、内容提供程序或文件中。这种状态信息因为从应用程序的一次调用到另一次调用持续存在，因此被称为**持久化状态**（persistent\
  \ state）。\n\n用户界面的外观（例如输入到文本框但尚未提交到应用程序内部数据模型的文本）被称为**动态状态**（dynamic state），因为它通常只在应用程序的单次调用期间保留（也称为用户界面状态或实例状态）。\n\
  \n理解这两种状态之间的差异非常重要，因为它们的保存方式以及保存的原因都是不同的。\n\n保存持久化状态的目的是避免活动在后台被运行时系统杀死而导致的数据丢失。而，动态状态的保存和恢复的原因略为复杂。\n\
  \n例如，假设应用程序包含一个活动（我们将其称为 `Activity A`），该活动包含一个文本框和一些单选按钮。在使用应用程序的过程中，用户在文本框中输入了一些文本并在单选按钮上进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个活动，导致\
  \ `Activity A` 被推入活动栈并置于后台。一段时间后，运行时系统确定内存不足，因此杀杀了 `Activity A` 以释放资源。然而，对于用户来说，`Activity\
  \ A` 仅仅是被置于后台，并准备好随时移动到前台。当 `Activity A` 返回前台时，用户理所当然地期望输入的文本和单选按钮的选择已被保留。然而，在这种情况下，将创建一个新的\
  \ `Activity A` 实例，如果动态状态没有被保存和恢复，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是为了提供一种在前台和后台活动之间无缝切换的感知，无论活动实际上可能在用户不知情的情况下被杀死并重启。\n\
  \n保存持久化状态和动态状态的机制将在本章的后续章节中变得更加清晰。\n\n### 13.4 Android 生命周期方法\n\n正如之前解释过的，`Activity`\
  \ 和 `Fragment` 类包含许多生命周期方法，这些方法在实例状态发生时充当事件处理程序。Android `Activity` 和 `Fragment`\
  \ 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)` – 当活动首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个以\
  \ `Bundle` 对象形式的参数，该对象可能包含来自活动先一次调用的动态状态信息（通常与用户界面的状态有关）。\n- `onRestart()` – 当活动之前被运行时系统停止后、准备重启时调用。\n\
  - `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用，此方法向活动指示它即将对用户可见。如果活动移动到活动栈的顶端，此调用之后将调用\
  \ `onResume()`；如果它被另一个活动推入栈中，则调用 `onStop()`。\n- `onResume()` – 表示活动现在处于活动栈的顶端，并且是用户当前正在交互的活动。\n\
  - `onPause()` – 表示上一个活动即将成为前台活动。此调用将根据活动是回到前台还是对用户不可见，随后调用 `onResume()` 或 `onStop()`\
  \ 方法。可以在此方法中采取措施存储应用尚未保存的持久化状态信息。为了避免切换活动之间的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应确保停止任何\
  \ CPU 密集型任务（如动画）。\n- `onStop()` – 活动现在对用户不再可见。此之后可能出现两种场景：如果活动再次移动到前台，则调用 `onRestart()`；如果活动正在终止，则调用\
  \ `onDestroy()`。\n- `onDestroy()` – 活动即将被销毁，可能是因为活动已完成任务并调用了 `finish()` 方法（自），也可能是运行时为了释放内存或由于配置更改（如设备方向改变）而正在终止它。需要注意的是，活动终止时并不总是会调用\
  \ `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且活动已指示不需要重启时调用。该方法接收一个 `Configuration`\
  \ 对象，概述了新的设备配置，然后由活动负责对更改做出反应。\n\n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()` -\
  \ 当片段被分配给活动时调用。\n- `onCreateView()` - 用于创建并返回片段的用户界面布局视图层次结构。\n- `onViewCreated()`\
  \ – 在 `onCreateView()` 返回后调用。\n- `onViewRestored()` - 片段保存的视图层次结构已恢复。\n\n除了上述生命周期方法外，还有两个专门用于保存和恢复活动动态状态的方法：\n\
  \n- `onRestoreInstanceState(Bundle savedInstanceState)` – 当活动从之前保存状态的状态调用重启时，在 `onStart()`\
  \ 方法之后立即调用。与 `onCreate()` 类似，此方法接收一个包含之前状态数据的 `Bundle` 对象。此方法通常用于在 `onCreate()`\
  \ 和 `onStart()` 完成活动初始化后恢复之前状态更为合理的情况。\n- `onSaveInstanceState(Bundle outState)`\
  \ – 在活动销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法接收一个 `Bundle` 对象，状态应保存到其中，并在活动重启时，该对象随后通过\
  \ `onCreate()` 和 `onRestoreInstanceState()` 方法传递。请注意，此方法仅在运行时确定需要保存动态状态时才会被调用。\n\
  \n在重写上述方法时，必须记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对\
  \ `super` 类对应方法的调用。例如，以下方法重写了 `onRestart()` 方法，但也包含了对父类实例方法的调用：\n\n```java\nprotected\
  \ void onRestart() {\n         super.onRestart();\n}\n```\n\n\n\n\n\n```java\nLog.i(TAG,\
  \ \"onRestart\");\n}\n```\n\n如果在重写的方法中未能调用此父类（super class），会导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 方法中调用父类是可选的（例如，在实现自定义的保存和恢复行为时可以省略它们），但使用这些方法具有显著的好处，这一主题将在名为“保存和恢复\
  \ Android Activity 的状态”的章节中介绍。\n\n## 13.5 生命周期周期 (Lifetimes)\n\n最后一个要涵盖的话题涉及整个、可见和前台生命周期的大纲，activity\
  \ 或 fragment 在执行期间会经过这些周期：\n\n*   **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从初始调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的所有活动。\n*   **可见生命周期 (Visible Lifetime)**\
  \ – 涵盖从调用 `onStart()` 到 `onStop()` 之间的执行期间。在此期间，activity 或 fragment 对用户可见，但可能不是用户当前正在交互的对象。\n\
  *   **前台生命周期 (Foreground Lifetime)** – 指在调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\
  \n需要注意的是，一个 activity 或 fragment 在整个生命周期内可能会多次经过前台和可见生命周期。\n\n生命周期和生命周期方法的概念在图 13-2\
  \ 中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\
  \n## 13.6 折叠屏设备与多恢复 (Foldable Devices and Multi-Resume)\n\n正如之前讨论的，当 activity 移动到前台并是用户当前正在交互的\
  \ activity 时，它被认为处于恢复（resumed）状态。在标准设备上，一个应用在任何时间只能有一个 activity 处于恢复状态，所有其他 activity\
  \ 可能都处于暂停或停止状态。\n\n一段时间以来，Android 已经包含了多窗口支持，允许多个 activity 同时在分屏或自由窗口布局中出现。虽然该功能最初主要用于大屏幕平板电脑设备，但随着折叠屏设备的引入，该功能可能会变得更加流行。\n\
  \n在运行 Android 10 且启用了多窗口支持的设备上（大多数折叠屏也是如此），多个应用 activity 可能同时处于恢复状态（这种概念被称为“多恢复”），允许这些可见的\
  \ activity 在即使另一个 activity 当前拥有焦点的情况下继续运行（例如流媒体内容播放或更新视觉数据）。尽管多个 activity 可以处于恢复状态，但这些活动中只有一个会被认为是最顶层的恢复活动（换句话说，就是用户最近交互的那个\
  \ activity）。\n\nactivity 可以通过实现 `onTopResumedActivityChanged()` 回调方法来接收获得或丢失顶层恢复状态的通知。\n\
  \n## 13.7 禁用配置更改重启 (Disabling Configuration Change Restarts)\n\n正如之前概述，activity\
  \ 可以指明在某些配置更改发生时不重新启动。这是通过在项目清单文件（manifest file）的 activity 元素中添加 `android:configChanges`\
  \ 指令实现的。例如，下面的清单文件片段表明，发生与方向或全局字体大小相关的配置更改时，不应重启该 activity：\n\n```xml\n<activity\
  \ android:name=\".MainActivity\"\n          android:configChanges=\"orientation|fontScale\"\
  \n          android:label=\"@string/app_name\">\n```\n\n## 13.8 生命周期周期方法的局限性 (Lifecycle\
  \ Method Limitations)\n\n正如本章开头提到的，生命周期方法已经使用了多年，直到最近，它们仍然处理 activity 和 fragment\
  \ 生命周期周期状态变化的唯一机制。然而，这种方法也存在缺点。\n\n生命周期方法的一个问题是，它们没有为 activity 或 fragment 提供一种简单的方法在应用执行的任何给定点发现其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严肃的考虑因素，因为应用中的许多其他对象都可能受到特定 activity\
  \ 或 fragment 生命周期周期状态变化的影响。\n\n生命周期方法仅在 `Fragment` 和 `Activity` 类的子类中可用。因此，无法构建真正感知生命周期（lifecycle\
  \ aware）的自定义类。\n\n最后，生命周期方法导致大多数生命周期处理代码都写在 activity 或 fragment 内部，这可能导致代码复杂且容易出错。理想情况下，这些代码大部分应该位于受状态更改影响的其他类中。例如，一个流视频的应用可能会包含一个专门设计用于管理输入流的类。如果应用需要在主\
  \ activity 停止时暂停流，那么相应的代码应该位于流类中，而不是主 activity 中。\n\n所有这些以及更多问题通过使用感知生命周期组件（lifecycle-aware\
  \ components）得到了解决，该主题将从名为“使用 Jetpack 构建现代 Android 应用架构”的章节开始。\n\n## 13.9 总结\n\n\
  所有的 activity 都自 `Activity` 类，而该类又包含了许多生命周期方法，这些方法设计用于在 activity 状态更改时由运行时系统调用。同样，`Fragment`\
  \ 类也包含许多类似的方法。通过重写这些方法，activity 和 fragment 可以响应状态变化，并在必要时采取步骤保存并恢复 activity 以及应用程序当前的状态。生命周期状态可以被认为有两种形式。持久化状态是指在应用调用之间需要存储的数据（例如到文件或数据库）。而动态状态则与用户界面的当前显示有关。\n\
  \n\n\n\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File -> Close Project` 菜单选项关闭任何已打开的项目，以便显示欢迎界面。\n\
  \n在欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level`（最低 API 级别）设置更改为 `API 26`：`Android 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为\
  \ `Java`。项目创建完成后，`StateChange` 项目将列在 Android Studio 主窗口左侧的项目工具窗口中。按照节节 11.8 将项目迁移到\
  \ View Binding 中概述的步骤将项目转换为使用 view binding。\n\n接要操作涉及设计 activity 的用户界面。它存储在一个名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到布局编辑器工具中。如果没有，请在项目工具窗口中导航到它，它位于 `app -> res\
  \ -> layout` 文件夹中。一旦找到，双击该文件即可将其加载到 Android Studio 布局编辑器工具中。\n\n![](img/as_4.2_statechange_layout_editor.jpg)\n\
  \n图 14-1\n\n## 14.2 设计用户界面\n\n当用户界面布局加载到布局编辑器工具后，现在是时候为示例应用程序设计用户界面了。用户界面设计中目前有一个“Hello\
  \ World!”`TextView`，但 实际上需要一个 `EditText` 。在布局编辑器画布上选择 `TextView` 对象并按下键盘上的 `Delete`\
  \ 键将其从设计中删除。\n\n从布局编辑器左侧的`Palette（调色板）中选择 `Text`类别，从文本组件列表中点击并拖动 `Plain Text（纯文本）组件到设备屏幕的可视表示上。将组件移动到显示中心，直到出现中心引导线，然后将其放置，使布局类似于图\
  \ 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\n图 14-2\n\n使用 `EditText` 小部件时，必须为视图指定输入类型。这简单地定义了用户将输入的文本或数据类型。例如，如果输入类型设置为\
  \ `Phone（电话）`，则用户将被限制在视图中输入数字。或者，如果输入类型设置为 `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以组合。\n\
  \n对于此示例，我们将使用默认输入类型来支持通用文本输入。将来要选择不同的设置，请选择布局中的 `EditText` 小部件，并在`Attributes（属性）`工具窗口中找到\
  \ `inputType` 条目。接下来，点击当前设置左侧的标志图标以打开选项列表，如下方的图 14-3 所示。`Type（类型）`菜单提供了将输入限制为文本、数字、时间和电话号码的选项。`Variations（变体）`菜单为当前选的输入类型提供额外选项。例如，文本输入类型有一种变体，可以将电子邮件地址作为输入。\n\
  \n一旦选择了类型和变体，可以使用标志复选框列表进一步自定义输入类型：\n\n![](img/as_text_input_type.jpg)\n\n图 14-3\n\
  \n留在`Attributes（属性）`工具窗口中，将视图的 `id` 为 `editText`，并点击生成对话框中的`Refactor（重构）`按钮。\n\n\
  默认情况下，`EditText`显示的文本为“Name”。在`Attributes（属性）`面板中，从`text`属性字段中删除此内容，使视图在布局中为空白。\n\
  \n在继续之前，点击布局编辑器工具栏上的`Infer Constraints（推断约束）`按钮以添加任何缺失的约束。\n\n## 14.3 重写 Activity\
  \ 生命周期方法\n\n此时，项目包含一个名为`MainActivity`的单一 activity，它派自`Android AppCompatActivity`类。该\
  \ activity 的源代码包含在`MainActivity.java`文件中，该文件应该已经在编辑器会话中打开并在编辑器标签页栏由标签页表示。如果文件不再打开，请在项目工具窗口面板中（`app\
  \ -> java -> com.ebookfrenzy.statechange -> MainActivity`）导航到它并双击它将文件加载到编辑器中。\n\n\
  到为止， activity 重写的唯一生命方法是`onCreate()`方法，该方法已实现为在设置 activity 的用户界面之前调用方法的父类实例。我们现在将修改此方法，使其在每次执行时都在\
  \ Android Studio Logcat 面板中输出诊断消息。为了实现这一点，我们将使用`Log`类，我们需要导入`android.util.Log`并声明一个标签，以便我们能够在日志输出中过滤这些消息：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\nimport android.util.Log;\nimport\
  \ androidx.annotation.NonNull;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ static final String TAG = \"StateChange\";\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写一些方法，每个方法包含一个日志调用。这些重写方法可以手动添加，也可以使用 Android\
  \ Studio 代码基础中概述的 Alt-Insert 快捷键生成。注意 Log 调用仍然需要手动添加：\n\n```java\n@Override\nprotected\
  \ void onStart() {\n    super.onStart();\n    Log.i(TAG, \"onStart\");\n}\n\n@Override\n\
  protected void onResume() {\n    super.onResume();\n    Log.i(TAG, \"onResume\"\
  );\n}\n\n@Override\nprotected void onPause() {\n    super.onPause();\n    Log.i(TAG,\
  \ \"onPause\");\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  \    Log.i(TAG, \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n   \
  \ super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\
  \n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState) {\n  \
  \  super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n}\n```\n\n## 14.4 过滤 Logcat 面板\n\n添加到`MainActivity.java`中重写方法的代码目的是将日志信息输出到\
  \ Logcat 工具窗口。此输出可以配置为显示与设备或模拟器会话的所有事件，或限制为与当前选择应用程序相关的事件。输出也可以被进一步限制为仅匹配指定过滤器的日志事件。\n\
  \n当当前应用运行时，Logcat 工具窗口将如下方图 14-4 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\n图\
  \ 14-4\n\n\n\n\n\n上图中标记为 A 的菜单允许你选择显示日志输出的设备或模拟器。此输出显示在标记为 C 的输出面板中。通过在标记为 B 的字段中输入选项，可以过滤日志输出。默认键设置\
  \ `package:mine` 将输出限制为由当前应用包生成的日志消息（在本例中为 `com.ebookfrenzy.statechange`）。留空该字段将允许显示来自所选设备或模拟器的日志输出，包括操作系统生成的诊断消息。也可以组合多个键来进一步过滤输出。例如，我们可以如下配置\
  \ Logcat 面板，仅显示与我们的 `StateChange` 标签相关的消息：\n\n```\npackage:mine tag:StateChange\n\
  ```\n\n我们还可以通过在键值前加上减号（`-`）符号来排除某些输出。除了 `StateChange` 标签外，我们可能还有使用名为“OtherTag”的不同标签的诊断消息。为了过滤日志以排除此第二个标签的输出，我们可以输入以下键选项：\n\
  \n```\npackage:mine tag:StateChange -tag:OtherTag\n```\n\n除了你自己的标签值外，还可以从 Android\
  \ 内置的一系列预定义诊断标签中选择。当你在过滤字段中输入时，Logcat 将显示匹配标签的列表，如图 14-5 所示：\n\n![](img/as_logcat_tool_window_tags.jpg)\n\
  \n图 14-5\n\n`level` 键可用于根据严重程度控制显示哪些消息。要过滤掉错误消息以外的所有消息，将使用以下键：\n\n```\nlevel:error\n\
  ```\n\n除了错误（error），Logcat 面板还支持 `verbose`、`info`、`warn` 和 `assert` 级别设置。\n\nLogcat\
  \ 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，请点击上方的图 14-4 中标记为 D 的 `+` 按钮。使用相应的标签在不同面板之间切换，或者通过右键点击当前显示的面板并选择\
  \ `Split-Right`（向右拆分）或 `Split-Down`（向下拆分）菜单选项来水平或垂直排列面板。要重命名面板，右键点击标签并选择 `Rename\
  \ Tab`（重命名标签）选项。在继续之前，关闭除一个外的 Logcat 面板并如下配置过滤器：\n\n```\npackage:mine tag:StateChange\n\
  ```\n\n### 14.5 运行应用程序\n\n为了获得最佳结果，应在物理 Android 设备或模拟器上运行应用程序。在设备配置并连接到开发计算机后，点击\
  \ Android Studio 工具栏中绿色三角形表示的运行按钮，如下方的图 14-6 所示，选择 `Run -> Run…` 菜单选项或使用快捷键 `Shift+F10`：\n\
  \n![](img/as_run_button1.jpg)\n\n图 14-6\n\n如果出现 `Choose Device` 对话框，请从中选择物理 Android\
  \ 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用并将其安装到设备后，它应该启动并在前台运行。\n\n查看 Logcat\
  \ 面板可以指示目前哪些方法已被触发了：\n\n![](img/as_logcat_statechange_output.jpg)\n\n图 14-7\n\n\
  ### 14.6 实验 Activity\n\n随着诊断功能的正常工作，现在是时候通过运行应用程序来理解 Activity 生命周期的状态变化了。首先，考虑 Logcat\
  \ 面板中的初始日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态变化与“理解 Android\
  \ 应用和 Activity 生命周期”中概述的完全一致。但请注意，在这种情况下没有调用 `onRestoreInstanceState()`，因为 Android\
  \ 运行时检测到在这种情况下没有可以恢复的状态。\n\n点击设备显示器底部状态栏上的 `Home` 图标，并注意日志中报告的方法调用序列如下：\n\n```\n\
  onPause\nonStop\nonSaveInstanceState\n```\n\n在这种情况下，运行时注意到该 activity 不再处于前台，对用户不可见并且已经停止了该\
  \ activity，但并没有没有该 activity 保存动态状态的机会。取决于运行时最终是销毁了该 activity 还是简单地重新启动了它，该 activity\
  \ 将通过调用 `onRestart()` 通知其已重新启动，或者在用户返回该 activity 时再次经历创建序列。\n\n如“理解 Android 应用和\
  \ Activity 生命周期”所述，activity 的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要看到看到这一过程，只需在 `StateChange`\
  \ 应用程序处于前台时旋转设备即可。使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。它显示在如图 14-8\
  \ 所示的设备或模拟器屏幕底部：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-8\n\n日志中产生的方法调用序列应如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在销毁和重启之前给了 activity 保存状态的机会。\n\n### 14.7 总结\n\n“一图胜千言”的古语在学习新范式的示例中同样适用。在本章中，我们创建了一个示例应用程序，用于演示\
  \ activity 可能经过的不同生命状态。在本章的项目开发过程中，我们还查看了从 activity 内部生成日志信息的机制。\n\n在下一章中，我们将扩展\
  \ StateChange 项目，演示如何保存和恢复 activity 的动态状态。\n\n## 15. 保存和恢复 Android Activity 的状态\n\
  \n如果前面的几章达到了目标，现在应该更清楚在生命周期内的特定点保存和恢复用户界面状态的重要性。\n\n在本章中，我们将扩展在 Android Activity\
  \ 状态示例中创建的示例应用程序，演示当 activity 被运行时系统销毁和重建时涉及的步骤。\n\n保存和恢复动态状态的关键组件涉及 Android SDK\
  \ `Bundle` 类的使用，该主题在本章中也会涵盖。\n\n### 15.1 保存动态状态\n\n\n\n\n\n在上一章中，`StateChange` 示例程序的诊断输出显示，当运行该程序的设备旋转足够大以触发方向变化时，活动会经历多次状态更改。\n\
  \n再次启动 `StateChange` 应用程序，并在执行设备旋转之前向 `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中应出现以下状态更改序列：\n\nonPause, onStop, onSaveInstanceState, onDestroy, onCreate,\
  \ onStart, onRestoreInstanceState, onResume\n\n显而易见，这导致了 activity 被销毁并重建。检查运行中应用程序的用户界面发现，输入到\
  \ `EditText` 字段中的文本被保留了。鉴于 activity 被销毁并重建了，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图控件（widgets）已经实现了 activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是\
  \ activity 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法要包含对父类等效方法的调用：\n\
  \n```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n可以通过 XML 布局文件通过将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的自动状态保存。为了示例，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n为了配置 `EditText` 视图以便在 activity\
  \ 重启时不保存和恢复状态，请编辑 `activity_main.xml` 文件，使视图条目内容如下（注意可以直接点击 Layout Editor 面板底部的\
  \ Text 选项卡来编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n做出更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\n### 15.3 Bundle 类\n\
  \n对于需要保存用户界面视图组件提供的默认功能之外的状态的情况，`Bundle` 类提供了一个容器，使用键值对机制来存储数据。键的形式为字符串值，而与这些键关联可以是原始值或任何实现了\
  \ `Parcelable` 接口的对象的。许多类已经实现了 `Parcelable` 接口。自定义类通通过实现 `Parcelable` 接口中定义的一组方法来使其变为“可封包的”（parcelable），详情可以在\
  \ Android 文档中找到：\n\nhttps://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始类型（包括 Boolean、char、double 和 float 值）和对象（如\
  \ `Strings` 和 `CharSequenceences`）。\n\n为了本示例，并且已经禁用了 `EditText` 视图的文本自动保存，我们需要确保用户输入到\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象并随后恢复。这将作为如何在 Android 应用程序中手动保存和恢复状态的演示，分别使用 `Bundle`\
  \ 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n### 15.4 保存状态\n\n扩展 `StateChange`\
  \ 应用程序的第一步是确保在 `MainActivity` 对应的 `onSaveInstanceState()` 方法中从 `EditText` 组件提取用户输入的文本，然后将其作为键值对保存到\
  \ `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们首先需要在用户界面中识别该对象。显然，这涉及到活动对应的 Java 代码（包含在\
  \ `MainActivity.java` 源代码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml` 资源文件中）之间的桥。为了提取输入到\
  \ `EditText` 组件的文本，我们需要访问该用户界面对象。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，Layout Editor\
  \ 工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则类型名后跟一个顺序数字（尽管开发者可以且应该将其更改为更具意义的内容）。正如在选择\
  \ `activity_main.xml` 时检查 Android Studio 主窗口内的 Component Tree 面板所示，`EditText` 组件被分配了\
  \ id：\n\n(image/as_4.1_state_change.jpg) 图 15-1\n\n我们现在可以通过对象的 `getText()` 方法获取\
  \ `editText` 包含的文本：\n\n```java\nCharSequence userText = binding.editText.getText();\n\
  ```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()` 方法保存文本，传递键（可以是字符串值，在本实例中我们定义为“savedText”）和\
  \ `userText` 对象作为参数：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将这一切整合在一起，`MainActivity.java` 文件中的 `onSaveInstanceState()` 方法如下：\n\n```java\n\
  package com.ebookfrenzy.statechange;\n\n...\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n...\n\n    @Override\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n\n...\n}```\n\
  \n### 15.5 恢复状态\n\n现在已经采取了保存状态的步骤，下阶段是在需要时恢复它。保存的动态状态可以在传递 `Bundle` 对象作为参数生命周期方法中恢复。这让开发者可以选择使用\
  \ `onCreate()` 或 `onRestoreInstanceState()`。使用哪个方法取决于活动的性质。在活动初始化任务完成后最好恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了本示例，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法将文本显示在 `editText` 组件上：\n\n\n\n\n\n```java\n\
  Log.i(TAG, \"onRestoreInstanceState\");\n\nCharSequence userText =\n    savedInstanceState.getCharSequence(\"\
  savedText\");\n\nbinding.editText.setText(userText);\n}\n```\n\n## 15.6 测试应用程序\n\
  \n剩下的就是再次构建并运行 StateChange 应用程序。在运行并处于前台时，触摸 `EditText` 组件，并在将设备旋转到另一个方向之前输入一些文本。与之前文本更改会丢失不同，现在，得益于我们在本章中为\
  \ activity 添加的代码，新文本将保留在 `editText` 组件中。\n\n在验证代码执行符合预期后，注释掉这两个方法中的 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用，并发现文本在设备旋转后仍然被保留。默认的保存和恢复系统本质上被自定义实现所取代，从而提供了一种在\
  \ activity 内部动态且有选择地保存和恢复状态的方法。\n\n## 15.7 总结\n\n在 Android 应用中保存和恢复动态状态只需在适当的生命周期方法中实现适当的代码。对于大多数用户界面视图，这些由\
  \ `Activity` 超类自动处理。在其他实例中，通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据以键值对的形式保存到运行时系统传递给\
  \ activity 的 `Bundle` 对象中。\n\n可以在 activity 的 `onCreate()` 或 `onRestoreInstanceState()`\
  \ 方法中从 `Bundle` 对象中提取值并根据存储的值更新 activity，从而恢复状态。\n\n在本章中，我们使用了这些技术更新了 StateChange\
  \ 项目，使 `Activity` 能够在 activity 的销毁及随后的重建过程中保留更改。\n\n## 16 理解 Android 视图、视图组和布局（Layout）\n\
  \n除了可能收听流媒体音频外，用户与 Android 设备的交互本质上主要是视觉和触觉的。所有的交互都是通过设备上安装的应用程序的用户界面进行的，包括内置应用程序以及用户安装的任何第三方。因此，开发\
  \ Android 应用程序的关键要素涉及用户界面的设计和创建，这并不令人意外。\n\n在本章中，将涵盖 Android 用户界面结构主题，并概述构成用户界面的不同元素；即\
  \ Views、View Groups 和 Layouts。\n\n### 16.1 针对不同的 Android 设备进行设计\n\n“Android 设备”一词涵盖了大量具有不同屏幕尺寸和分辨率的平板电脑和智能手机产品。因此，应用程序用户界面现在必须精心设计，以确保在尽可能广泛的显示尺寸上正确显示。其关键部分之一是确保用户界面布局在不同设备上运行时能够正确调整大小。这在很大程度上可以通过仔细规划和使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数基于 Android 的智能手机和平板电脑都可以用户以竖屏或横屏模式持有。设计良好的用户界面应该能够适应此类变化，并进行合理的布局调整以利用每种方向下的可用屏幕空间。\n\
  \n### 16.2 Views（视图）与 View Groups（视图组）\n\n用户界面中的每个项都是 Android `View` 类的子类（准确来说是\
  \ `android.view.View`）。Android SDK 提供了一组预视图可用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar`\
  \ 和 `TextView` 类。这些视图被称为控件（widgets）或组件。对于 SDK 提供的控件无法满足的需求，可以通过子类并扩展现有类来创建新视图，或者通过直接在\
  \ `View` 类之上构建创建一个全新的组件。\n\n一个视图还可以由多个其他视图组成（也称为复合视图，composite view）。此类视图派自 Android\
  \ `ViewGroup` 类（`android.view.ViewGroup`），而该类本身是 `View` 的子类。此类视图的一个示例是 `RadioGroup`，它旨在包含多个\
  \ `RadioButton` 对象，以便在任何时间只有一个可以处于“开启”状态。从结构上讲，复合视图由单个父视图（派自 `ViewGroup` 类，另称为容器视图或根元素）组成，该视图能够包含其他视图（称为子视图）。\n\
  \n另一类基于 `ViewGroup` 的容器视图是布局管理器（layout manager）。\n\n### 16.3 Android 布局管理器（Layout\
  \ Managers）\n\n除了上一节讨论的控件式视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派自 `ViewGroup`），其设计的唯一目的是控制子视图在屏幕上的定位方式。\n\
  \nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\n*   `ConstraintLayout` – 引入自 Android\
  \ 7，对于大多数布局需求，都建议使用此布局管理器。`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置来定义布局中视图的位置和行为。这种布局的灵活性允许快速方便地创建复杂布局，而无需在其他布局类型内部进行嵌套，从而提升了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，否则它是书中大多数示例的首选布局。\n*   `LinearLayout` –\
  \ 根据所选的方向在单行或单列中排列子视图。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图应占据多少空间。\n*   `TableLayout`\
  \ – 将子视图排列成行和列的网格格式。表格中的每行由一个 `TableRow` 对象表示，该对象反过来包含每个单元格的视图对象。\n*   `FrameLayout`\
  \ – `FrameLayout` 的目的是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将相互叠并位于布局区域的左上角。通过为每个子视图设置重力（gravity）值来实现单个子视图的替代定位。例如，在子视图上设置\
  \ `center_vertical` 重力将使其位于容器 `FrameLayout` 视图的垂直居中。\n*   `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐方式和边距，相对于彼此以及容器布局视图进行定位。例如，子视图 A 可以被配置为位于容器 `RelativeLayout` 视图的垂直和水平居中。另一方面，视图\
  \ B 可能被配置为在布局视图中水平居中，但在 View A 顶部上方 30 像素处，从而使其垂直位置相对于 View A 进行定位。`RelativeLayout`\
  \ 管理器在设计必须适用于各种屏幕尺寸和方向的用户界面时可能特别有用。\n*   `AbsoluteLayout` – 允许在容器布局视图内通过特定的 X 和\
  \ Y 坐标对子视图进行。不建议使用此布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\n\n\n\n\n- `GridLayout` – `GridLayout`\
  \ 实例被不可见的线条划分，形成一个包含行和列单元格的网格。子视图随后被放置在单元格中，并可以配置为在水平和垂直方向上跨越多个单元格，从而快速方便地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置一种名为 `Space` 的特殊类型视图来实现，也可以通过设置外边距参数来实现。\n- `CoordinatorLayout`\
  \ – `CoordinatorLayout` 随 Android 5.0 作为 Android Design Support Library 的一部分，专门用于协调应用程序屏幕顶部应用栏（app\
  \ bar）与其他视图元素的外观行为。当使用 `Basic Views Activity` 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将从标题为与悬浮操作按钮和 Snackbar 使用 的章节开始进行更详细的介绍。\n\n在考虑在 Android 应用程序的用户界面中使用布局时，值得记住，正如下一节将概述的，这些布局可以相互嵌套，以创建出几乎任何所需复杂程度的用户界面设计。\n\
  \n## 16.4 视图层次结构\n\n用户界面中的每个视图都代表显示器上的矩形区域。视图负责在该矩形内绘制的内容，并响应发生在屏幕该区域的事件（例如触摸事件）。\n\
  \n用户界面屏幕由视图层次结构组成，其中根视图位于树的顶端，子视图位于下方的分支上。容器视图的子显示在其父视图之上，并被限制在父视图显示区域的边界内。例如，考虑图\
  \ 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上还包含许多布局视图，它们控制着可见视图的位置。图\
  \ 16-2 显示了用户界面的另一种视图，这次突出了布局视图与子视图之间的关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\n\
  正如之前讨论的，用户界面是以视图层次结构的形式构建的，根视图位于顶部。既然如此，我们也可以通过图 16-3 所示的视图树形式将上述用户界面示例视觉视化：\n\n\
  ![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能为图 16-1 所示的用户界面中构成的各种视图之间的关系提供了最清晰的概览。当用户界面显示给用户看时，Android\
  \ 运行时会遍历视图层次结构，从根视图开始沿树向下移动，并渲染每个视图。\n\n## 16.5 创建用户界面\n\n在对视图、布局和视图层次结构的概念有了更清晰的理解后，接几章将重点关注为\
  \ Android 活动创建用户界面步骤。事实上，用户界面设计有三种不同的方法：使用 Android Studio 布局编辑器工具、编写 XML 布局资源文件或编写\
  \ Java 代码，这每种方法都将被涵盖。\n\n## 16.6 总结\n\nAndroid 应用程序用户界面屏幕中的每个元素都是视图，它们最终派生自 `android.view.View`\
  \ 类。每个视图代表设备显示器上的矩形区域，既负责该矩形内显示的内容，又负责处理视图边界内的事件。多个视图可以组合成单个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（其本身 `android.view.View` 的子类）。用户界面由以后层次结构形式构建的视图组成。\n\
  \nAndroid SDK 包含了一系列预构建的视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，还包括一系列用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图来创建自定义视图，或者通过派生\
  \ `android.view.View` 并创建一个全新的视图类。\n\n用户界面可以使用 Android Studio 布局编辑器工具、编写 XML 布局资源文件或编写\
  \ Java 代码来创建。这些方法中的每一种都将在随后的章节中介绍。\n\n## 17. Android Studio 布局编辑器工具指南\n\n很难想象有一个不需要某种形式用户界面的\
  \ Android 应用程序概念。大多数 Android 设备配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间主要的交互形式。这些交互始终通过应用程序的用户界面进行。\n\
  \n一个设计良好且实现的用户界面是创建一个成功流行的 Android 应用程序的重要因素，它可以根据单个应用程序的设计需求从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 Basic 与 Empty Views Activity\
  \ 模板\n\n正如“Android 应用程序剖析 章节概述，Android 应用程序由一个或多个活动组成。活动是一个独立的应用程序模块，通常直接对应单个用户界面屏幕。因此，当处理\
  \ Android Studio 布局时，我们总是在为一个活动编写布局。\n\n在创建新的 Android Studio 项目时，有许多不同的模板可以作为主活动用户面的起点。这些模板中最基础的是\
  \ `Basic Views Activity` 和 `Empty Views Activity` 模板。尽管这些模板初看起来看起来相似，但它们之间实际上存在相当差异。要在布局编辑器中查看这些差异，请使用视图选项菜单启用“显示系统\
  \ UI”，如下方的图 17-1 所示：\n\n![](img/as_layout_editor_system_ui.jpg)\n\n图 17-1\n\n`Empty\
  \ Views Activity` 模板创建一个布局文件，由一个 `ConstraintLayout` 管理器实例包含一个 `TextView` 对象组成，如图\
  \ 17-2 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\n另一方面，`Basic Views\
  \ Activity` 由多个布局文件组成。顶层布局文件以 `CoordinatorLayout` 作为根视图，一个可配置的应用栏（包含工具栏）出现在设备屏幕顶部（如图\
  \ 17-3 中的 A 所示）和一个悬浮操作按钮（标记为 B 的电子邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还引用了一个名为\
  \ `content_main.xml` 的第二个文件，该文件包含内容布局（标记为 C）：\n\n![](img/as_basic_activity_layout.jpg)\n\
  \n图 17-3\n\n\n\n\nBasic Views Activity（基础视图活动）包含两个屏幕的布局，这两个屏幕都包含一个按钮和一个文本视图。此模板的目的是演示如何在应用内实现多个屏幕之间的导航。如果运行使用未修改的\
  \ Basic Views Activity 模板的程序，将显示这两个屏幕中的第一个（在图 17-4 中标记为 A）。点击 Next（下一步）按钮将导航到第二个屏幕\
  \ (B)，该屏幕反过来包含一个返回第一个屏幕的按钮：\n\n![](img/as_basic_activity_layout_1.jpg)\n\n图 17-4\n\
  \n此应用的行为使用了两个被称为“片段”（fragments）和“导航”（navigation）的 Android 功能，这两个功能都将从标题为 “Android\
  \ 片段简介” 和 “导航架构组件概览” 的章节开始逐一介绍。\n\n`content_main.xml` 文件包含一种名为“导航宿主片段”（Navigation\
  \ Host Fragment）的特殊片段，它允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置在视图中切换不同的内容。在\
  \ Basic Views Activity 模板的情况下，`nav_graph.xml` 文件配置为根据用户选择 Next（下一步）和 Previous（上一步）按钮，在\
  \ `fragment_first.xml` 和 `fragment_second.xml` 文件定义的用户界面布局之间进行切换。\n\n显然，如果你在活动中既不需要浮动按钮（floating\
  \ action button）不需要菜单，也不需要 `CoordinatorLayout` 提供的特殊应用栏行为（例如在某些滚动操作期间使应用栏和工具栏从视图中折叠的选项，该主题将在标题为\
  \ “与 AppBar 和折叠工具栏布局一起工作” 的章节中介绍过），那么 Empty Views Activity 模板是有用的。然而，Basic Views\
  \ Activity 的用在于它默认提供了这些元素。事实上，使用 Basic Views Activity 模板创建一个新活动并删除不需要的元素，通常比使用 Empty\
  \ Views Activity 模板并手动实现折叠工具栏、菜单或浮动按钮等行为要快得多。\n\n然而，由于书中并非所有示例都需要 Basic Views Activity\
  \ 模板的功能，因此本章的大多数示例将使用 Empty Views Activity 模板，除非示例需要 Basic Views Activity 模板提供的某项功能。\n\
  \n为了方便以后参考，如果你需要菜单但不需要浮动按钮，请使用 Basic Views Activity 并按照以下步骤删除浮动按钮：\n\n1. 在 Project（项目）工具窗口的\
  \ `app -> res -> layout` 下，双击主 `activity_main.xml` 布局文件以将其加载到 Layout Editor（布局编辑器）中。布局加载到布局编辑器工具后，选择浮动按钮并按下键盘上的\
  \ Delete 键从布局中移除该对象。\n\n2. 找到并编辑该活动的 Java 代码（位于 `app -> java -> <package name> ->\
  \ <activity class name>` 下），并如下所示从 `onCreate` 方法中移除浮动按钮代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n如果你需要浮动按钮但不需要菜单，请使用 Basic Views Activity\
  \ 模板并按照以下步骤操作：\n\n1. 编辑主活动类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 选择 Project 工具窗口中的 `res -> menu` 项，并按下键盘 Delete 键从项目中删除该文件夹和相应的菜单资源文件。\n\
  \n如果你需要使用 Basic Views Activity 模板但既不需要导航功能也不需要第二个内容片段，请遵循以下步骤：\n\n1. 在 Project 工具窗口中，导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 条目并按下键盘 delete 键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app -> java -> <package\
  \ name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res -> layout -> fragment_second.xml`）文件。\n\
  4. 最后的任务是从 `FirstFragment` 类中移除一些代码，使按钮不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 并双击它，移除代码使其内容如下：\n\
  \n```java\npublic void onViewCreated(@NonNull View view, Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \               .navigate(R.id.action_FirstFragment_to_SecondFragment);\n      \
  \  }\n    });\n}\n```\n\n## 17.2 Android Studio 布局编辑器\n\n正如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，可以在其中从调色板中选择视图并放置在代表设备的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小。此外，可以使用\
  \ Attributes（属性）工具窗口修改与所选视图相关的属性。\n\n在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行，称为\
  \ Design（设计）、Code（代码）和 Split（拆分）模式。\n\n## 17.3 设计模式\n\n在设计模式下，可以直接操作视图调色板和布局的图形表示来视觉化操作用户界面。图\
  \ 17-5 突出了 Android Studio 布局编辑器工具在设计模式下的关键区域：\n\n![](img/as_labeled_layout_editor.jpg)\n\
  \n图 17-5\n\nA – Palette（调色板）——调色板提供了 Android SDK 提供的系列视图组件。这些组件被分类以便导航。可以通过从调色板上拖拽视图组件并掉到布局上的理想位置向布局添加项。\n\
  \nB – Device Screen（设备屏幕）——设备屏幕提供了正在设计的的用户界面布局的视觉化“所见即所得”表示。该布局允许对设计进行直接操纵，允许视图被选择、删除、移动和调整大小。可以使用工具栏中的菜单随时更改布局表示的设备模型。\n\
  \n\n\n\n### C – 组件树\n如上一章（“理解 Android View、ViewGroup 和 Layout”中标记为 A）列出了 Android\
  \ SDK 支持的各种视图组件类别。当从列表中选择一个类别时，第二个面板（B）将更新，并显示属于该类别的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  图 17-6\n\n要将调色板中的组件添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖到画布上的所需位置并放开即可。\n\n要在当前选定的类别中搜索特定组件，可以点击调色板工具栏上的搜索按钮（在图\
  \ 17-6 上方标记为 C）并输入组件名称。随着字符的输入，匹配的结果将实时在组件列表面板中显示。如果你不确定组件所在的类别，只需在搜索操作之前或期间直接选择“所有结果”（All\
  \ Results）类别即可。\n\n## 17.5 设计模式和布局视图\n默认情况下，布局编辑器将显示为设计（Design）模式，如上方图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击图\
  \ 17-7 所示的最右侧的模式切换控件，随时选择设计模式：\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\
  图 17-7\n\n当布局编辑器工具处于设计模式时，可以通过两种不同的方式查看布局。上方图 17-5 中显示的视图是设计视图（Design view），显示了布局和小部件在运行应用中的外观。第二种模式被称为“蓝图视图”（Blueprint\
  \ view），可以替代设计视图显示，也可以与设计视图同时显示。图 17-8 中显示的工具栏菜单提供了显示设计视图、蓝图视图或两种视图的选项。还有用于调整色盲的设置。第五种选项“强制刷新布局”（Force\
  \ Refresh Layout）会导致布局重建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，这非常有用：\n\n![](img/as_layout_editor_select_design_surface.jpg)\n\
  图 17-8\n\n显示布局视图、设计视图或两者都取决于个人偏好。一种很好的方法是像图 17-9 所示从同时显示两者开始：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  图 17-9\n\n## 17.6 夜间模式\n在设计工作期间以夜间模式查看布局，请选择下方图 17-10 所示的菜单并将设置更改为“夜间”（Night）：\n\
  \n![](img/as_layout_editor_mode.jpg)\n图 17-10\n\n模式菜单还包括测试动态颜色的选项，该主题在“Material\
  \ Design 3 主题和动态色彩教程”章节中介绍。\n\n## 17.7 代码模式\n在使用 Android Studio 布局编辑器工具时，重要的是记住它实际上做的只是提供了一种易于用户的方法来创建\
  \ XML 布局资源文件。在设计过程中的任何时候，只需点击布局编辑器工具面板右上角的 `Code` 按钮（如图 17-11 所示），即可查看并直接编辑底层 XML：\n\
  \n![](img/as_4.0_layout_editor_code_button.jpg)\n图 17-11\n\n图 17-12 显示了 Android\
  \ Studio 布局器的代码模式，允许通过修改 XML 来更改用户界面：\n\n![](img/as_3.6_layout_editor.code.jpg)\n\
  图 17-12\n\n## 17.8 拆分模式\n在拆分模式下，编辑器并排显示设计视图和代码视图，允许通过设计画布或直接修改 XML 来修改用户界面。要进入拆分模式，请点击图\
  \ 17-13 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n图 17-13\n\n对 XML 的任何更改都会反映在设计画布上，反之亦然。图\
  \ 17-14 显示了拆分模式下的编辑器：\n\n![](img/as_4.1_layout_split_mode.jpg)\n图 17-14\n\n## 17.9\
  \ 设置属性\n属性面板提供了访问当前选中组件的所有可用设置。例如，图 17-15 显示了 TextView 组件的一些属性：\n\n![](img/as_attributes_panel.jpg)\n\
  图 17-15\n\n属性窗口分为以下部分：\n\n- `id`：包含 id 属性，该属性定义了在应用程序源代码中引用当前选中对象的名称。\n- `已声明属性（Declared\
  \ Attributes）：包含所有已赋值的属性。\n- `布局`（Layout）：定义当前选中视图对象相对于屏幕以及布局中其他对象定位和大小的设置。\n- `变换（Transforms）：包含允许对选中对象进行旋转、缩放和偏移的控件。\n\
  - `常用属性（Common Attributes）：对于当前选中的视图类经常需要更改的属性列表。\n- `所有属性（All Attributes）：当前选中对象所有可用属性的完整列表。\n\
  \n也可以通过选择属性窗口工具栏上的搜索按钮并输入属性名称来搜索特定属性。\n\n\n\n\n\n某些属性在值字段的右侧有一个窄按钮。这表示可以使用 `Resources`\
  \ 对话框来帮助选择合适的属性值。只需点击该按钮即可显示对话框。此按钮的外观会变化，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，则文本属性字段右侧的按钮将被填充，如如下方的图\
  \ 17-16 所示，表示该值并非硬编码：\n\n![](img/as_3.4_resource_extracted.jpg)\n图 17-16\n\n具有有限数量有效选项的属性将显示下拉菜单（图\
  \ 17-17），并可从中进行选择。\n\n![](img/as_4.0_type_face_menu.jpg)\n图 17-17\n\n可以点击吸管图标（如上方图\
  \ 17-16 中`backgroundTint` 字段所示）来显示颜色调色板。同样，当此位置出现标志图标时，点击它可以显示该属性可用的选项列表，而图像图标会打开资源管理器面板，允许为该属性选择图像和其他资源类型。\n\
  \n## 17.10 变换 (Transforms)\n\n属性工具窗口内的变换面板（图 17-18）提供了一组控件和属性，用于在旋转、透明度（用于视图的淡入和淡出）、缩放（大小）和平移（相对于当前位置的偏移）方面控制当前选中对象的视觉效果：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n图 17-18\n\n面板包含视图的视觉表示，该表示随属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n## 17.11 工具可见性切换 (Tools Visibility Toggles)\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现定义视图外观和行为的许多属性以\
  \ `android:` 前缀开头。这表示属性设置在 `android` 命名空间内，并在应用运行时生效。例如，以下布局文件的摘段在 `Button` 视图上设置了各种属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了一个 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器预览中生效。在设计布局时，你可能会发现让\
  \ `EditText` 视图显示某些文本很有帮助，但在应用运行时需要视图为空。为了实现这一点，你可以如下所示使用 `tools` 命名空间设置视图的文本属性：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editTextTextPersonName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"textPersonName\"\n    tools:text=\"Sample Text\"\n```\n\
  \n此类工具属性通过在属性工具窗口中向带有扳手图标标记的属性字段输入值来设置，如下所示图 17-19：\n\n![](img/as_4.1_text_tools_property.jpg)\n\
  图 17-19\n\n工具属性对于在设计过程中更改视图的可见性特别有用。布局中可能包含一个视图，在应用运行时根据用户操作程序化地显示和隐藏。为了模拟视图的隐藏，可以在视图\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n使用 `invisible`\
  \ 设置时，尽管视图不再可见，但它仍然存在于布局中，并占据其可见时相同的空间。要让布局的行为就像视图不再存在一样，应将可见性属性设置为 `gone`，如下：\n\
  \n```xml\ntools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，而对运行中的应用没有影响。要同时控制布局编辑器和运行中应用中的可见性，则应使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有，但手动编辑\
  \ XML 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio 在布局编辑器的组件树（Component Tree）面板内提供了一组切换器。要访问这些控件，点击面板中对应视图右侧的边缘。例如，图\
  \ 17-20 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换控件：\n\n![](img/as_4.2_layout_tools_visibility.jpg)\n\
  图 17-20\n\n这些切换器控制 `android` 和 `tools` 命名空间下对应视图的可见性，并提供未设置（not set）、可见（visible）、不可见（invisible）和隐藏（gone）选项。当设置了冲突属性时（例如，`android`\
  \ 命名空间切换设置为可见，而 `tools` 设置为不可见），`tools` 命名空间在布局预览中具有优先级。当做出切换选择时，Android Studio\
  \ 会自动为 XML 元素添加相应的属性。\n\n除了组件树中的可见性切换器外，布局编辑器还包含下方图 17-21 所示的工具可见性和位置切换按钮：\n\n![](img/as_4.1_layout_editor_toggle.jpg)\n\
  图 17-21\n\n此按钮切换当前的工具可见性设置。例如，如果上述 `Button` 视图当前的工具属性设置为 `gone`，则切换此按钮将使其可见。这有助于在视图添加到或从布局移除时快速检查布局行为。此切换对于检查布局中的视图是否正确约束也非常有用，该主题将在\
  \ Android Studio 中使用 ConstraintLayout 指南章节中介绍。\n\n## 17.12 转换视图 (Converting Views)\n\
  \n将布局中的视图转换为另一种类型（例如将 `TextView` 转换为 `EditText`）可以在 Android Studio 布局编辑器轻松完成，只需在屏幕布局或组件树窗口中右键点击视图并选择\
  \ `Convert view...` 选项（图 17-22）：\n\n![](img/as_layout_convert_view.jpg)\n图 17-22\n\
  \n选中后，将出现一个对话框，列出该对象符合转换条件的兼容视图类型列表。图 17-23 示例显示了现有 `TextView` 视图可以转换的类型：\n\n![](img/as_3.2_convert_layout_textview.jpg)\n\
  图 17-23\n\n此技术也适用于将布局从一种类型转换为另一种（例如将 `ConstraintLayout` 转换为 `LinearLayout`）。\n\n\
  ## 17.13 显示示例数据 (Displaying Sample Data)\n\n\n\n\n在 Android Studio 中设计布局时，可能会出现一种情况：用户界面中要显示的内容在应用程序完成并运行之前无法可用。这有时会导致我们很难从布局编辑器中评估布局在应用运行时的显示效果。为了解决这个问题，布局编辑器允许指定样本数据，并用样本图像和数据填充布局编辑器中的视图。这些样本数据仅在布局编辑器中显示，在应用运行时不会显示。可以通过直接编辑布局的\
  \ XML，或者使用设计时助手工具进行可视化操作（通过在设计区域右键点击组件并选择 `Set Sample Data`（设置样本数据）菜单选项）来配置样本数据。设计时助手面板将为选定的视图项显示一系列预配置的样本数据选项，包括各种配置下的文本和图像组合。例如，图\
  \ 17-24 显示了在选择在 `RecyclerView` 列表中显示样本数据时显示的样本数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，也可以在布局设计过程中提供自定义的文本和图像进行显示。在布局编辑器中使用样本数据的示例包含在后面的章节 “布局编辑器样本数据教程”\
  \ 中。由于样本数据是实现为 `tools` 属性的，预览中数据的可见性可以使用上方 图 17-21 中高亮显示的切换按钮按钮进行控制。\n\n### 17.14\
  \ 创建自定义设备定义\n\n布局编辑器工具栏中的设备菜单（图 17-25）提供了一个预配置设备类型列表，选择这些类型后，它们将作为设备屏幕画布出现。除了预配置的设备类型外，之前在\
  \ Android Studio 环境中配置过的任何 `AVD` 实例也会列在列表中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项，并按照章节\
  \ “在 Android Studio 中创建 Android 虚拟设备 (AVD)” 中概述的步骤进行操作。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n### 17.15 当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单选择 `Custom`（自定义）选项，点击设备屏幕右下角的缩放句柄（图\
  \ 17-26）并拖动以选择备用设备显示格式。随着屏幕缩放，将出现标记，指示可选择的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n### 17.16 布局验证\n\n布局验证选项允许在一系列 Pixel 尺寸的屏幕上同时预览用户界面布局。要访问布局验证工具窗口，可以点击\
  \ Android Studio 主窗口右侧边缘的标签，或者使用窗口左下角的 `Tool Window`（工具窗口）菜单。一旦加载，该面板将如 图 17-27\
  \ 所示显示，在多个设备屏幕配置上渲染布局：\n\n![](img/as_validation.jpg)\n\n图 17-27\n\n### 17.17 总结\n\
  \n开发 Android 应用程序的关键部分涉及创建用户界面。在 Android Studio 环境中，这是使用 `Layout Editor`（布局编辑器）工具实现的，它运行三种模式。在\
  \ `Design`（设计）模式下，从调板中选择视图组件并放置在代表 Android 设备屏幕的布局上，并使用属性列表进行配置。在 `Code`（代码）模式下，可以直接编辑表示用户界面布局的底层\
  \ `XML`。另一方面，`Split`（拆）模式允许通过可视化和直接编辑 XML 来同时创建和修改布局。这些模式结合在一起，提供了一个丰富且直观的用户界面设计环境。\n\
  \n布局验证面板允许在系列不同的设备屏幕尺寸上快速预览用户界面布局。\n\n## 18. Android ConstraintLayout 指南\n\n正如章节\
  \ “理解 Android 、视图组和布局” 中讨论的那样，Android 提供了许多布局管理器用于设计用户界面。从 Android 7 开始，Google 引入了一种布局，旨在解决旧布局管理器的许多缺点。这种名为\
  \ `ConstraintLayout` 的新布局将简单、表达且灵活的布局系统与 Android Studio 布局编辑器工具内置的强大功能相结合，以便创建响应式用户界面布局，这些布局能够自动适应不同的屏幕尺寸和设备方向的变化。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，而下一章将详细概述如何在 Android Studio 布局编辑器工具中使用 `ConstraintLayout`\
  \ 创建基于约束的布局。\n\n### 18.1 ConstraintLayout 如何工作\n\n与所有其他布局一样，`ConstraintLayout` 负责管理其包含的视觉组件（也称为\
  \ `widgets`）的定位和尺寸调整行为。它是基于设置在每个子组件上的约束连接来此此的。\n\n为了完全理解和使用 `ConstraintLayout`，理解以下关键概念至关重要：\n\
  \n- Constraints（约束）\n- Margins（外边距）\n- Opposing Constraints（对向约束）\n- Constraint\
  \ Bias（约束偏移）\n- Chains（链）\n- Chain Styles（链样式）\n- Guidelines（指南）\n- Groups（组）\n\
  - Barriers（屏障）\n- Flow（流）\n\n#### 18.1.1 约束 (Constraints)\n\n约束是一组规则，规定了组件相对于其他组件、`ConstraintLayout`\
  \ 侧边以及称为指南的特殊元素的对齐和距离。约束还决定了活动的用户界面布局在设备方向变化或在不同尺寸设备上显示时的响应。为了配置配置，组件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在和平垂直平面上解析其位置。\n\n#### 18.1.2 外边距 (Margins)\n\n外边距是指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过从 `Button` 的顶部和右边缘连接到父 `ConstraintLayout` 的对应侧的外边距约束来实现，如图 18-1\
  \ 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，每个约束连接都关联有一个外边距值，规定了组件距离父布局侧边的固定距离。在此配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象始终将距离父 `ConstraintLayout` 顶部和右边缘 20 和 15 个设备独立像素 (dp)，正如这两个约束连接指定的那样。\n\n虽然上述配置在某些情况下是可以接受的，但它在允许\
  \ `ConstraintLayout` 布局引擎调整组件位置以响应设备旋转和支持不同屏幕方面没有提供任何灵活性。为了给布局添加这种响应性，有必要实现对向约束。\n\
  \n#### 18.1.3 对向约束 (Opposing Constraints)\n\n\n\n\n\n在单个组件的同一轴上运行的两个约束被称为相反约束（opposing\
  \ constraints）。换句话说，一个左右两侧都设置了约束的组件被认为具有水平相反约束。例如，图 18-2 展示了在之前的布局基础上添加了水平和垂直方向的相反约束：\n\
  \n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实施了相反约束，组件的定位将变为基于百分比而非坐标。例如，组件不再被固定在距离布局顶部\
  \ 20dp 处，而是被放置在距离布局顶部 30% 的位置。在不同的方向以及在较大或较小的屏幕上运行时，`Button` 将始终处于相对于父布局尺寸的相同位置。\n\
  \n现在重要的是理解的是，图 18-2 所示的布局不仅使用了相反约束，还通过应用了约束偏置（constraint bias）实现的。\n\n### 18.1.4\
  \ 约束偏置 (Constraint Bias)\n\n目前已经确定，`ConstraintLayout` 中的组件可能会受到相反约束连接的影响。默认情况下，相反约束是相等的，导致相应的组件在相反的轴上居中。例如，图\
  \ 18-3 展示了一个使用相反的水平和垂直约束，在包含它的 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在存在相反约束的情况下允许调整组件的位置，`ConstraintLayout` 实现了一项名为约束偏置（constraint bias）的功能。约束偏置允许组件沿相反轴的定位根据指定的百分比向其中一个约束倾斜（产生偏置）。例如，图\
  \ 18-4 显示了具有 75% 水平偏置和 10% 垂直偏置的之前的布局：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n下一章题为在\
  \ Android Studio 中使用 ConstraintLayout 的指南，将更详细地涵盖这些概念，并解释这些功能如何集成到 Android Studio\
  \ 布局编辑器工具中。然而，在此还需要涵盖 `ConstraintLayout` 类的其他领域。\n\n#### 18.1.5 链 (Chains)\n\n`ConstraintLayout`\
  \ 链提供了一种将两个或多个组件的布局行为定义为一组的方法。链可以在垂直或水平轴上声明，并进行配置以定义链中组件的间距和大小。\n\n当组件之间通过双向约束相互连接在一起时，它们就形成了链。例如，图\
  \ 18-5 展示了三个以这种方式成链的组件：\n\n![](img/Image2468.jpg)\n\n图 18-5\n\n链中的第一个元素是链头（chain\
  \ head），它在垂直链中对应于顶部的组件，在水平链的情况下对应于最左侧的组件。整个链的布局行为主要通过设置链头组件上的属性来配置。\n\n#### 18.1.6\
  \ 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为由应用在链头组件上的链样式设置决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n* **散布链 (Spread Chain)** – 链包含的组件均匀地分布在可用空间中。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\
  \n图 18-6\n\n* **内部散布链 (Spread Inside Chain)** – 链包含的组件在链头和链中的最后一个组件之间均匀分布。头部和最后一个组件不包含在间距的分布中。\n\
  \n![](img/Image24853.jpg)\n\n图 18-7\n\n* **权重链 (Weighted Chain)** – 允许通过权重属性定义链中每个组件所占据的空间。\n\
  \n![](img/Image24922.jpg)\n\n图 18-8\n\n* **紧凑链 (Packed Chain)** – 构成链的组件紧凑在一起，没有任何间距。可以应用偏置来控制链相对于父容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n### 18.2 基线对齐 (Baseline Alignment)\n\n到为止，本章只提到了相对于组件边缘的对齐约束（通常称为侧约束）。然而，一个常见的需求是让组件相对于其显示的内容进行对齐，而不是相对于组件本身的边界。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n例如，假设来自图 18-1 的理论布局需要将 `TextView` 组件位于 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 视图基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本在垂直方向对齐。此布局的额外约束需要像图\
  \ 18-10 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button`\
  \ 的基线进行垂直对齐，并在水平方向距离 `Button` 对象 40dp。\n\n### 18.3 配置组件尺寸\n\n控制组件尺寸是用户界面设计的关键元素。`ConstraintLayout`\
  \ 提供了三个可以设置在单个组件上的选项以管理尺寸行为：\n\n* **固定 (Fixed)** – 组件固定为指定的尺寸。\n* **匹配约束 (Match\
  \ Constraint)** – 允许由布局引擎调整大小以满足约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT` 选项。\n* **包裹内容\
  \ (Wrap Content)** – 组件的大小由其包含的内容（文本或图形）决定。\n\n### 18.4 辅助线 (Guideline)\n\n辅助线是\
  \ `ConstraintLayout` 中可用的特殊元素，为连接的约束提供了附加目标。可以在 `ConstraintLayout` 实例中添加多个辅助线，并可以配置为水平或垂直方向。一旦添加，就可以建立布局中的组件到辅助线的约束连接。这在多个组件需要沿某一轴对齐时特别有用。例如，在图\
  \ 18-11 中，`ConstraintLayout` 中的三个 `Button` 对象沿垂直辅助线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n### 18.5 组 (Group)\n\n`ConstraintLayout` 的此功能允许将组件放入逻辑组中，并作为一个整体控制这些组件的可见性。`Group`\
  \ 本质上是布局其他组件的引用列表。一旦定义，更改组实例的可见性属性（可见、不可见或隐藏）将应用到所有组成成员。这使得通过更改单个属性来隐藏和显示多个组件变得简单。单个布局可以包含多个组，组件也可以属于多个组。如果组之间发生冲突，XML\
  \ 文件中最后定义的组优先级更高。\n\n### 18.6 屏障 (Barrier)\n\n\n\n\n\n与指南（guidelines）类似，屏障（barriers）是虚拟视图，可用于约束布局内的视图。与指南一样，屏障可以是垂直的或水平的，并且一个或多个视图可以被约束在其上（为了避免混淆，这些视图被称为受约束视图）。然而，与在布局中保持固定位置的指南不同，屏障的位置是由一组所谓的参考视图（reference\
  \ views）定义的。引入屏障是为了解决在某些情况下频繁发生的视图重叠问题。例如，考虑下方图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n上述布局需要注意的关键点是，`View 3` 的宽度设置为匹配约束模式（constraint mode），且该视图的左边缘连接到 `View\
  \ 1` 的右边缘。按照目前的实现方式，增加 `View 1` 的宽度将产生预期的效果，即减少 `View 3` 的宽度：\n\n![](img/Image25331.jpg)\n\
  \n图 18-13\n\n但是，如果不是 `View 1` 而是 `View 2` 的宽度增加了，就会出现问题：\n\n![](img/Image25401.jpg)\n\
  \n图 18-14\n\n显然，由于 `View 3` 仅受 `View 1` 约束，它不会为了适应 `View 2` 宽度的增加而导致视图重叠。\n\n解决此问题的办法是添加垂直屏障，并将\
  \ `View 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。这样 `View 3` 的左边缘就会相对于屏障受到约束，使其成为受约束视图。\n\
  \n现在当 `View 1` 或 `View 2` 的宽度增加时，屏障将移动以适应两个视图中最宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有限制。\n\n###\
  \ 18.7 Flow 助手\n\n`ConstraintLayout Flow` 辅助工具允许视图组以流式网格布局样式显示。与 `Group` 助手一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大控件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括展开（spread）、内部展开（spread inside）和紧凑（packed）选项。\n\n图 18-16 表示使用 `Flow`\
  \ 助手实例在水平模式下且无换行设置的五个等大小按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\n\
  图 18-17 显示了相同的按钮在水平流配置中的情况，并设置为每第三个控件后换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n图 18-18 另一方面，显示了将换行设置为内部展开链的的按钮（效果仅在第二行可见，因为第一行已满）。该配置还设置了 `gap` 属性以增加按钮之间的间距：\n\
  \n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\n作为 `Flow` 助手灵活性的最终演示，图\
  \ 18-19 显示了五个大小不一的按钮，配置为水平、紧凑链模式，并在每第三个控件后换行。此外，通过设置水平偏置（horizontal-bias）值为 1.0，网格内容已右对齐（该值为\
  \ 0.0 将导致左对齐，而 0.5 将使网格内容居中对齐）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\n图 18-19\n\
  \n### 18.8 比例\n\n控件的尺寸可以使用比例设置（ratio settings）来定义。例如，可以使用比例设置对控件进行约束，使得无论任何缩放行为如何，宽度始终是高度尺寸的两倍。\n\
  \n### 18.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供了足够的灵活性，使得可以在单个布局实例中实现旧布局的许多功能，而以前这可能需要嵌套多个布局。这样做的好处是避免了布局嵌套固有的问题，允许设计所谓的“扁平”或“浅层”布局层级，从而使布局变得不复杂，并提高了运行时用户界面的渲染性能。\n\
  \n`ConstraintLayout` 的实现还考虑了解决当市面上广泛的 Android 设备屏幕尺寸问题。`ConstraintLayout` 的灵活性使得设计能够响应并适应运行应用程序的设备的用户界面变得更容易。\n\
  \n最后，正如章节“在 Android Studio 中使用 ConstraintLayout 指南` 中所示的那样，Android Studio 布局编辑器工具已专门针对基于\
  \ `ConstraintLayout` 的用户界面设计进行了增强。\n\n### 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout`\
  \ 是从 Android 7 开始引入的，但它是作为独立的支持 SDK 库提供的，并兼容远到 API 级别 9 (Gingerbread) 的旧 Android\
  \ 版本。这使得使用这种新布局的应用程序可以在运行旧版本 Android 的设备上运行。\n\n### 18.11 总结\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的布局管理器。它的设计旨在创建灵活的布局，以适应市面上许多 Android 设备的尺寸和方向。`ConstraintLayout`\
  \ 使用约束来控制控件相对于父级 `ConstraintLayout` 实例、指南、屏障以及布局中其他控件的对齐和定位。`ConstraintLayout` 是新创建的\
  \ Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以以惊人的便利实现复杂且响应式的用户界面。\n\
  \n## 19. 在 Android Studio 中使用 ConstraintLayout 指南\n\n正如前面的章节中多次提到的，Google 对 Android\
  \ Studio 布局编辑器工具进行了重大更改，其中许多更改仅是为了支持使用 `ConstraintLayout` 进行用户界面布局设计。既然上一一章已经概述了\
  \ `ConstraintLayout` 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器工具允许设计和实现基于 `ConstraintLayout` 的用户界面的方法。\n\
  \n### 19.1 设计视图和布局视图\n\n章节“Android Studio 布局编辑器指南` 解释了 Android Studio 布局编辑器工具提供了两种查看活动用户界面布局的方式，即设计视图（Design\
  \ views）和布局视图（Layout views，也称为蓝图）。这些视图可以单独显示，也可以像图 19-1 所示并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\
  \n图 19-1\n\n\n\n\n设计视图（Design view，位于上图左侧）展示了布局的“所见即所得”表示，其中布局的外观与其在运行应用程序中的显示一致。而布局视图（Layout\
  \ view）则显示蓝图风格的视图，其中组件由阴影轮廓表示。如上方的图 19-1 所示，布局视图还会显示约束连接（在本例中，使用了用于将按钮居中布局的对向约束）。当选中布局中的特定组件或将鼠标指针悬停在设计区域上时，这些约束也会叠加在设计视图上，如图\
  \ 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\nFigure 19-2\n\n两种视图中约束连接的外观都可以通过图\
  \ 19-3 所示的“视图选项”（View Options）菜单进行更改：\n\n![](img/as_show_constraints.jpg)\nFigure\
  \ 19-3\n\n除了显示用户界面布局两种模式外，布局编辑器工具还提供了三种为特定布局设计建立所需约束的方法。\n\n### 19.2 自动连接模式 (Autoconnect\
  \ Mode)\n\n自动连接，顾名思义，会在项目添加到布局中时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮启用或禁用自动连接模式：\n\n![](img/as_autoconnect.jpg)\n\
  Figure 19-4\n\n自动连接模式使用算法，根据组件的位置以及组件与父布局侧边和布局中其他元素的距离，来决定建立的最佳约束。如果任何自动约束连接未能提供预期的行为，可以按照本章稍后介绍的内容手动更改。\n\
  \n### 19.3 推断模式 (Inference Mode)\n\n推断模式使用涉及算法和概率的启发式方法，在组件已添加到布局后自动实现约束连接。这种模式通常在关闭了自动连接功能且在没有任何约束连接的情况下将对象添加到布局时使用。这允许通过从调色板将对象拖放到布局画布上，并进行尺寸和位置更改直到布局符合要求，从而简单地设计布局。本质上涉及到在不担心约束的情况下“绘制”布局。推断模式也可以在设计过程的任何时候使用，填充布局中缺失的约束。\n\
  \n点击推断约束按钮（图 19-5）时，约束会自动添加到布局中：\n\n![](img/as_inference_mode.jpg)\nFigure 19-5\n\
  \n与自动连接模式一样，布局编辑器工具始终存在推断错误约束的可能性，尽管这些约束可以手动进行修改和修正。\n\n### 19.4 手动操作约束 (Manipulating\
  \ Constraints Manually)\n\n实现约束连接的第三种方法是手动操作。这样做时，理解布局编辑器工具中组件周围出现的各种手柄将很有帮助。例如考虑图\
  \ 19-6 所示的组件：\n\n![](img/as_4.1_constraint_handles.jpg)\nFigure 19-6\n\n显然，弹簧状线条\
  \ (A) 代表了从组件侧边到目标已建立的约束连接。对象每个角的小正方形标记 (B) 是缩放手柄，点击并拖动时可用于缩放组件。位于组件每侧的小圆圈手柄 (C)\
  \ 是侧边约束锚点。要创建约束连接，点击手柄并将生成的线条拖到要连接约束的元素（例如引导线或父布局的侧边或另一个组件的侧边），如图 19-7 所示。当连接到另一个组件的侧边时，只需将线条拖到该组件的侧边约束手柄，并在组件和手柄高亮时释放线条。\n\
  \n![](img/as_4.1_constraint_drag_line.jpg)\nFigure 19-7\n\n如果将约束线拖到组件并释放，但未附加到约束手柄，布局编辑器将显示一个菜单，其中列出了约束可以附加的侧边列表。在图\
  \ 19-8 中，例如，约束可以附加到目标按钮组件的顶部或底部边缘：\n\n![](img/as_4.1_constraint_between_widgets.jpg)\n\
  Figure 19-8\n\n额外的标记指示了基线约束（baseline constraints）的锚点，其中组件内部的内容（而非外部边缘）被用对齐点。要显示此标记，只需右键点击组件并选择“显示基线”（Show\
  \ Baseline）菜单选项。从基线约束手柄建立约束连接，只需将鼠标指针悬停在手柄上直到其高亮，然后点击并拖动到目标（如图 19-9 所示的另一个组件的基线锚点）。\n\
  \n![](img/as_baseline_constraint.jpg)\nFigure 19-9\n\n要隐藏基线锚点，再次右键点击组件并选择“隐藏基线”（Hide\
  \ Baseline）选项。\n\n### 19.5 在检查器中添加约束 (Adding Constraints in the Inspector)\n\n也可以使用图\
  \ 19-10 所示的属性窗口中的检查器（Inspector）面板向视图添加约束。中间的正方形代表当前选中的视图，周围的区域表示应用于视图对应侧边的约束：\n\n\
  ![](img/as_3.5_attributes.jpg)\nFigure 19-10\n\n视图侧边缺失约束由带有加号的蓝色圆圈的虚线表示（如上视图底部边缘所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将连接到它认为最合适的目标。\n\
  \n### 19.6 在属性窗口中查看约束 (Viewing Constraints in the Attributes Window)\n\n可以通过显示属性窗口中的“约束”部分来查看配置在当前组件上的约束列表，如下方的图\
  \ 19-11 所示：\n\n![](img/as_3.5_constraints_list.jpg)\nFigure 19-11\n\n点击列表中的约束将选中设计布局中的该约束。\n\
  \n### 19.7 删除约束 (Deleting Constraints)\n\n要删除单个约束，只需在设计布局或属性窗口中选择该约束使其高亮（例如在图 19-12\
  \ 中，选择了最右侧的约束），然后按下键盘删除键。该约束将从布局中移除。\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  Figure 19-12\n\n另一种选项是在按住 Ctrl（macOS 上为 Cmd）键并将鼠标指针悬停在约束锚点上，并在它变为红色后点击锚点：\n\n![](img/as_4.1_constraint_delete.jpg)\n\
  Figure 19-13\n\n或者，通过右键点击组件并选择“清除选择约束”（Clear Constraints of Selection）菜单选项移除组件上的所有约束。要要从布局中的每个组件中移除所有约束，请使用图\
  \ 19-14 所示的工具栏按钮：\n\n![](img/as_clear_constraints.jpg)\nFigure 19-14\n\n\n\n\n#\
  \ 19.8 调整约束偏置 (Bias)\n\n在上一节中，我们概述了使用偏置设置（bias）来让一个对立约束相对于另一个的概念。Android Studio\
  \ 布局编辑器工具中的偏置通过 `Attributes` 工具窗口中的 `Inspector` 进行调整，并如图图 19-15 所示。图中由箭头指示的两个滑块用于控制当前选中组件的垂直和水平对立约束的偏置。\n\
  \n![](img/as_3.2_constraint_bias_sliders.jpg)\n图 19-15\n\n# 19.9 理解 ConstraintLayout\
  \ 距\n\n约束可以与边距（margins）结合使用，以实现组件与其他元素（例如另一个组件、`guideline` 或父布局的边缘）之间的固定间隙。例如，考虑应用于图\
  \ 19-16 中 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n图 19-16\n\
  \n按照当前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，组件具有对立的水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置有一定的裁量权。这使得布局具有一定的活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还可以控制组件的位置直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n图 19-17\n\
  \n`ConstraintLayout` 边距可以出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化，组件也无法进入该间隙。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设置为 100%，组件也无法移动到该区域。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  图 19-18\n\n组件上的现有边距值可以在 `Inspector` 中进行修改。如图 19-19 所示，正在使用下拉菜单将当前选中组件的右边距更改为 `16dp`。或者，点击当前值也可以在字段中输入数字。\n\
  \n![](img/as_3.2_constraint_set_margins.jpg)\n图 19-19\n\n新约束的默认边距可以随时使用图 19-20 所示工具栏中高亮的选项进行更改：\n\
  \n![](img/as_constraints_margins.jpg)\n图 19-20\n\n# 19.10 对立约束和偏置的重要性\n\n正如上一节讨论的，在\
  \ ways `ConstraintLayout` 时，对立约束、边距和偏置是 Android 响应式布局设计的基石。当组件被约束但没有对立约束连接时，这些约束本质上是边距约束。这在布局编辑器工具中通过实线并连带边距测量值在视觉上表示出来，如图图\
  \ 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n图 19-21\n\n上述约束本质上将组件固定在那个位置。其结果是，如果设备旋转到横屏模式，组件将不再可见，因为垂直约束会将其推到设备屏幕的顶部之外（如图\
  \ 19-22 所示）。如果应用程序运行在比设计过程中使用的屏幕更小的设备上，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  图 19-22\n\n当实现对立约束时，约束连接由像弹簧一样的锯齿线表示（使用弹簧的比喻是为了表示组件的位置没有固定在绝对的 X 和 Y 坐标上）：\n\n![](img/as_4.1_constraints_opposing_constrained.jpg)\n\
  图 19-23\n\n在上述布局中，垂直和水平偏置设置已配置为：组件将始终位于距离父布局底部 90% 距离处以及距离左边缘 35% 距离处。因此，当旋转时，组件仍然可见，并且相对于屏幕尺寸位于相同的位置：\n\
  \n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n图 19-24\n\n在设计响应式且适应良好的用户界面布局时，手动设计用户界面布局并对自动创建的约束进行修正时，同时考虑偏置和对立约束是非常重要的。\n\
  \n# 19.11 配置组件尺寸\n\n`ConstraintLayout` 中组件的内部尺寸也可以使用 `Inspector` 配置。正如上一节概述的，组件尺寸可以设置为\
  \ `wrap content`、`fixed` 或 `match constraint`。当前选中组件的每个维度设置显示在 `Inspector` 中代表该组件的正方形内，如图图\
  \ 19-25 所示：\n\n![](img/as_3.2_constraint_dimensions.jpg)\n图 19-25\n\n在上述图中，水平和垂直维度都设置为\
  \ `wrap content` 模式（由向内的箭头符号指示）。inspector 使用以下视觉指示来表示三种模式：\n\n| 固定尺寸 (Fixed Size)\
  \ | ![](img/2826.jpg) |\n| 匹配约束 (Match Constraint) | ![](img/2834.jpg) |\n| 内容内容\
  \ (Wrap Content) | ![](img/2844.jpg) |\n\n表 19-1\n\n要更改当前设置，只需点击指示循环。当布局编辑器中视图的维度设置为\
  \ `match constraint` 时，视图相应的边将使用弹簧线而不是直线。例如，在图 19-26 中，仅视图的宽度被设置为 `match constraint`：\n\
  \n![](img/Image2855.jpg)\n图 19-26\n\n此外，可以使用 `Expand horizontally` 和 `Expand vertically`\
  \ 选项根据布局中的约束和其他组件在水平或垂直方向上扩展组件的尺寸。可以通过右键点击布局中的组件并从弹出菜单中选择 `Organize` 选项来访问它们（图 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大以填充周围的空间。\n\
  \n![](img/as_4.1_constraint_organize_menu.jpg)\n图 19-27\n\n# 19.12 设计时工具定位\n\nAndroid\
  \ Studio 布局编辑器指南章节介绍了 `tools` 命名空间的概念，并解释了如何使用它设置仅在布局编辑器内有效的可见性属性。在后台，Android Studio\
  \ 还使用 `tools` 属性在没有没有约束的情况下保持组件的位置。例如，在禁用自动连接模式时将 `Button` 放入布局。虽然组件在预览画布中看起来位置正确，但在运行应用程序时，它将出现在屏幕的左上角。这是因为组件没有约束来告诉父\
  \ `ConstraintLayout` 将其放置在何处。\n\n\n\n\n[content]\n\n组件在布局编辑器中似乎位于正确位置的原因是，Android\
  \ Studio 设置了绝对的 X 和 Y 定位工具级属性，以便在添加约束条件之前将其保持在正确位置。在 XML 布局文件中，其内容可能如下：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些工具级属性。一种快速识别哪些组件缺少约束的实用技巧（而无需等待应用运行）是点击图\
  \ 19-28 中高亮显示的按钮，以切换工具栏位置的可视性。任何跳转到左上角的组件都是未经过完全约束的，它们正被临时的工具级绝对 X 和 Y 定位属性固定着。\n\
  \n![](img/as_4.1_toggle_tools_positions.jpg)\n\n图 19-28\n\n### 19.13 添加辅助线\n\n辅助线提供了可以锚定约束的额外元素。可以通过右键点击布局并选择“垂直辅助线”（Vertical\
  \ Guideline）或“水平辅助线”（Horizontal Guideline）菜单选项，或者使用工具栏菜单选项，如图 19-29\n\n图 19-29\n\
  \n或者，也可以从调色板（Palette）的“助手”（Helpers）部分拖拽水平和垂直辅助线，并将其放置在布局画布或“组件树”（Component Tree）面板上，如图\
  \ 19-30 中的箭头所示：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\n图 19-30\n\n\
  一旦添加成功，辅助线将以虚线的形式显示在布局中，可以通过简单的点击并拖拽线条来移动。要建立到辅助线的约束连接，点击组件的约束句柄，并在释放之前拖动到辅助线。在图\
  \ 19-31\n\n图 19-31\n\n或者，辅助线也可以作为父布局总宽度或高度的百分比进行定位。要在这三种模式之间切换，请选择辅助线并点击辅助线顶部或起始处的圆圈（取决于辅助线是垂直还是水平的）。例如，图\
  \ 19-32\n\n图 19-32\n\n### 19.14 添加屏障\n\n可以通过右键点击布局并在“添加助手”（Add helpers）菜单中选择“垂直屏障”（Vertical\
  \ Barrier）或“水平屏障”（Horizontal Barrier）选项，或者使用如之前在图 19-29\n\n图 19-33\n\n要将视图作为引用视图（换句话说，控制屏障位置的视图），只需将组件从“组件树”内部拖动到屏障项上。例如，在图\
  \ 19-34\n\n图 19-34\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当在“组件树”面板中选择屏障时，它在“属性”（Attributes）工具窗口中定义：\n\
  \n![](img/as_4.1_layout_barrier_direction.jpg)\n\n图 19-35\n\n下图显示了一个包含屏障的布局，其中 `textView1`\
  \ 和 `textView2` 作为引用视图，`textview3` 作为受约束的视图。由于屏障是从引用视图的末端向受约束视图推的，因此屏障方向已设置为 `end`：\n\
  \n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n### 19.15 添加组\n\n要在布局中添加“组”（Group），右键点击布局并在“添加助手”菜单中选择“组”选项，或者使用之前在图\
  \ 19-29 所示的工具栏选项。或者，在调色板的“助手”部分找到“组”项，并将其拖放到布局画布或“组件树”面板。要向组添加组件，请在“组件树”中选择它们并将其拖放到组项上。例如，图\
  \ 19-37 显示将三个选中的组件添加到组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\n图 19-37\n\
  \n组引用的任何组件将以斜体显示在“组件树”中的组下方，如图 19-38 所示。要从组中移除组件，只需选择它并按：\n\n![](img/as_4.1_group_list.jpg)\n\
  \n图 19-38\n\n一旦组件分配给组，使用属性工具窗口的“约束”（Constraints）部分修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n\
  \n图 19-39\n\n## 19.16 使用流助手\n\n流（Flow）助手可以像之前一样通过菜单或调色板添加。与“组”助手一样（图 19-37），通过在“组件树”中拖拽组件到流实例来实现。添加流助手并为其分配组件后，在“组件树”中选择它，并使用属性窗口的“常用属性”（Common\
  \ Attributes）部分配置流布局行为：\n\n![](img/as_4.1_flow_attributes.jpg)\n\n图 19-40\n\n##\
  \ 19.17 组件组的对齐与分布\n\n当在布局中选择多个组件时，Android Studio 布局编辑器提供了一系列对齐和分布操作。只需按 Shift 点击参与操作的每个组件，右键点击布局并在“对齐”（Align）菜单显示的许多选项中进行选择：\n\
  \n![](img/as_layout_align_menu.jpg)\n\n图 19-41\n\n如下所示图 19-42，这些选项也可以通过布局编辑器工具栏上的“对齐”按钮访问：\n\
  \n![](img/as_align_menu.jpg)\n\n图 19-42\n\n同样，“打包”（Pack）菜单（图 19-43）可用于共同重新定位选中的组件，使其在垂直或水平方向上紧凑排列。它通过更改组件的绝对\
  \ X 和 Y 坐标来实现，但不应用任何约束。相反，“打包”菜单中的两个分布选项会移动选中的组件，使其在垂直或水平轴上均匀分布，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n[/content]\n\n\n\n\n###\
  \ 19.18 将其他布局转换为 ConstraintLayout\n\n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout`\
  \ 或 `LinearLayout`）的现有用户界面布局，`Layout Editor（布局编辑器）工具提供了一个选项可以将用户界面转换为使用 `ConstraintLayout`。\n\
  \n当`Layout Editor`工具打开并处于 Design（设计）模式时，`Component Tree（组件树）面板显示在`Palette（调色板）下方。要将布局转换为`ConstraintLayout`，在`Component\
  \ Tree`中找到它，右键点击它并选择`Convert <current layout> to Constraint Layout（将<当前布局>转换为 Constraint\
  \ Layout）菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\n图 19-44\n\n\
  选择此菜单选项后，`Android Studio`将将选定的布局转换为`ConstraintLayout`并使用推理建立约束，以匹配原始布局类型的布局行为。\n\
  \n### 19.19 总结\n\n重新设计的`Layout Editor`工具结合`ConstraintLayout`使得使用`Android Studio`设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束、边距和偏移（bias）的概念，同时探索了基于`ConstraintLayout`的设计如何集成到`Layout\
  \ Editor`工具中。\n\n# 20. 在 Android Studio 中使用 ConstraintLayout 链（Chains）和比例\n\n之前的章节介绍了`ConstraintLayout`类的关键特性，并概述了在`Android\
  \ Studio Layout Editor`中进行基于`ConstraintLayout`的用户界面设计的最佳实践。尽管在标题为 Android ConstraintLayout\
  \ 指南的章节中概述了`ConstraintLayout` 链和比例的概念，但我们尚未讨论如何在`Layout Editor`中利用这些功能。因此，本章的重点是提供在使用`ConstraintLayout`类时如何创建和管理链和比例的实际步骤。\n\
  \n### 20.1 创建链\n\n链可以通过在 Activity 的 XML 布局资源文件中添加几行代码来实现，也可以通过使用`Layout Editor`中某些链特有的功能来实现。\n\
  \n考虑一个由三个`Button`组件组成的布局，这些组件被约束为定位在`ConstraintLayout`父布局的左上角、顶部中央和右上角，如图图 20-1\
  \ 所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮组件的条目：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束来将这些组件分组成一条链。为了解决这个问题，需要从`button1`的右侧到`button2`的左侧添加额外的约束，并从`button3`的左侧到`button2`的右侧添加约束，如下所示：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改，组件现在有了双向约束。这实际上构成了一个`ConstraintLayout`链，在`Layout Editor`中所示如下所示](#Chains_and_Ratios.xhtml__idTextAnchor515)所示。请注意在此配置下链默认为散布样式。\n\
  \n![](img/as_4.1_chain.jpg)\n\n图 20-2\n\n链也可以通过右键点击视图并选择`Chains -> Horizontal Chain（水平链）`或`Chains\
  \ -> Vertical Chain（垂直链）`来创建。\n\n## 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout`将默认使用散布（spread）链样式。可以通过右键点击链中的任何组件并选择`Chain\
  \ Mode（链模式）`选项来更改样式。每点击一次菜单选项，样式就会`spread（散布）`、`spread inside（内部散布）`和`packed（聚集）`之间切换。\n\
  \n或者，可以在`Attributes`窗口中展开`layout_constraints`属性，并根据链的方向更改`horizontal_chainStyle`或`vertical_chainStyle`属性：\n\
  \n![](img/as_4.1_chain_style.jpg)\n\n图 20-3\n\n## 20.3 内部散布链样式\n\n图 20-4](#Chains_and_Ratios.xhtml__idTextAnchor519)说明了上述技术将链样式更改为内部散布链的效果：\n\
  \n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\n图 20-4\n\n## 20.4\
  \ 聚集链样式\n\n使用相同的技术，将链样式属性更改为`packed`会导致布局发生变化，如图 20-5](#Chains_and_Ratios.xhtml__idTextAnchor522)所示：\n\
  \n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n### 20.5 带偏移的聚集链\n\
  \n聚集链的位置可能会受到应用偏移值的影响。偏移可以是`0.0`到`1.0`之间的任何值，其中`0.5`代表父布局的中心。偏移通过选择链头组件并在`Attributes`面板中为`layout_constraintHorizontal_bias`或`layout_constraintVertical_bias`属性赋值来控制。图\
  \ 20-6](#Chains_and_Ratios.xhtml__idTextAnchor525)显示了一个水平偏移设置为`0.2`的聚集链：\n\n![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n### 20.6 权重链\n\n\n\n\n链（chains）的最后一个探索区域涉及对单个控件进行加权，以控制链中每个控件在可用空间中所占的比例。加权链仅可以使用散开链（spread\
  \ chain）样式实现，并且链中任何需要响应权重（weight）属性的控件都必须将其相应的维度属性（垂直链为高度，水平链为宽度）配置为匹配约束模式（match\
  \ constraint mode）。控件维度的匹配约束模式可以通过选择该控件、显示属性（Attributes）面板并将维度更改为 `match_constraint`（等同于\
  \ `0dp`）来配置。例如，在图 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint`（`0dp`），这表示该控件的宽度将根据现行的约束设置来来确定：\n\
  \n![](img/as_3.5_chain_match_constraints.jpg)\n\n图 20-7\n\n假设已选择散开链样式，并且三个按钮都已配置为宽度维度匹配约束，则链中的控件将等比例扩展以填充可用空间：\n\
  \n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\n图 20-8\n\n每个控件相对于链中其他控件所占的空间可以通过向控件添加权重属性（weight\
  \ properties）来控制。图 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight` 属性设置为\
  \ `4`，以及将 `button2` 和 `button3` 设置为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了空间的一半 (4/8)，而 `button2` 和 `button3` 各占据了空间的四分之一\
  \ (2/8)。\n\n## 20.7 使用比例\n\nConstraintLayout 比例（ratios）允许控件的一个维度相对于该控件的另一个维度（也称为纵横比）进行尺寸调整。例如，可以将比例设置应用于\
  \ `ImageView`，以确保其宽度始终是高度的两倍。\n\n维度比例约束通过将受约束维度设置为匹配约束模式，并将该控件上的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来实现。该比例值可以指定为浮点值或“宽:高”比例设置。例如，下面的 XML 代码段在 `ImageView` 控件上配置了 2:1 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这涉及到在指定比例前加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度受约束的。\n\n例如，考虑以下针对 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n\n在上面的示例中，高度将根据应用于其上的约束来定义。在这种情况下，约束被配置为使其连接到父视图的顶部和底部，实质上是将控件拉伸以填充父视图的整个。另一方面，宽度维度被约束为\
  \ `ImageView` 高度的三分分之一。因此，无论布局显示在什么尺寸的屏幕或何种方向上，`ImageView` 的高度始终与父视图相同，而宽度为该高度的三分之一。\n\
  \n不需要手动编辑 XML 资源文件也可以实现相同的结果。每当控件维度设置为匹配约束模式时，属性面板的检查器（Inspector）区域就会出现一个比例控制切换按钮。例如，图\
  \ 20-10 显示了按钮控件的布局宽度和高度属性分别设置为匹配约束模式和 `100dp`，并在控件尺寸预览中高亮了比例控制切换按钮：\n\n![](img/as_3.2_toggle_aspect_ratio_constraint.jpg)\n\
  \n图 20-10\n\n默认情况下，比例尺寸控制是关闭的。点击该控制可以启用比例约束并显示一个可以更改比例的额外字段：\n\n![](img/as_3.2_toggle_aspect_ratio_settings.jpg)\n\
  \n图 20-11\n\n### 20.8 总结\n\n链（chains）和比例（ratios）都是 `ConstraintLayout` 的强大功能，旨在为设计灵活且响应式的用户界面布局提供额外选项。正如本章所述，Android\
  \ Studio 布局编辑器已经增强，以便在设计过程中更容易使用这些功能。\n\n## 21. Studio 布局编辑器 ConstraintLayout 教程\n\
  \n到目前为止，为 Android 应用设计用户界面最简单且高效的方法是利用 Android Studio 布局编辑器工具。本章将提供如何使用这种方法创建基于\
  \ ConstraintLayout 的用户界概述。本章包含的练习也将作为从“空白骨” Android Studio 项目创建一个 Activity 的机会。\n\
  \n### 21.1 Studio 编辑器示例\n\n示例阶段的第一步是创建一个新的 Android Studio 项目。首先启动 Android Studio\
  \ 并通过 `File -> Close Project` 菜单关闭已打开的项目。\n\n在欢迎屏幕上选择 `New Project`，选择 `Empty Views\
  \ Activity` 模板并点击 Next。在 `Name` 字段中输入 `LayoutSample`，并指定包名为 `com.ebookzy.layoutsample`。在点击\
  \ `Finish` 按钮之前，将最小 API 级别设置为 `API 26: Android 8.0 (Oreo)`并将语言菜单设置为 `Java`。\n\n\
  ### 21.2 准备布局编辑器环境\n\n找到 `app -> res -> layout` 文件夹中的 `activity_main.xml` 布局文件并双击将其加载到布局编辑器工具中。由于本教程的目的是获得使用约束的经验，请使用工具栏上的按钮关闭自动连接（Autoconnect）功能。禁用后，该按钮将带有划线，如图\
  \ 21-1 所示：\n\n![](img/autoconnect_off.jpg)\n\n图 21-1\n\n如果自动连接按钮右侧的默认边距值不是 `8dp`，请点击它并在生成的面板中选择\
  \ `8dp`。\n\n\n\n\n在 Android Studio 中，显示 `Resource Manager` 工具窗口（`View -> Tool Windows\
  \ -> Resource Manager`）。在操作系统的文件导航器中找到 `galaxy6s.png` ，并将其拖放到 `Resource Manager`\
  \ 工具窗口中。在弹出的对话框中，点击 `Next` 然后点击 `Import` 按钮将图像添加到项目中。现在该图像应该出现在 `Resource Manager`\
  \ 中，如下方的图 21-2 所示：\n\n![](img/as_4.1_resource_manager.jpg)\n\n图 21-2\n\n该图像也会出现在\
  \ `Project` 工具窗口的 `res -> drawables` 部分：\n\n![](img/Image2451.jpg)\n\n图 21-3\n\n\
  ### 21.3 将组件添加到用户界面\n\n从 `Common` 调色板类别中，将 `ImageView` 对象拖入到显示区域的中心。注意，会出现水平和垂直虚线，表示显示的中心轴。当对齐中心时，松开鼠标按钮将视图放置在目标位置。一旦放置在布局中，就会出现\
  \ `Resources` 对话框，请求视图视图显示的图像。在对话框顶部的搜索栏中输入“galaxy”以定位 `galaxysys6.png` 资源，如图 21-4\
  \ 所示：\n\n![](img/as_layoutsample_pick_image_resource.jpg)\n\n图 21-4\n\n选择图像并点击 `OK`\
  \ 将其分配给 `ImageView` 对象。如有必要，使用缩放手柄调整 `ImageView` 的大小并将其重新定位到布局的中心。此时，布局应与图 21-5\
  \ 匹配：\n\n![](img/as_3.5_layout_sample_imageview_added.jpg)\n\n图 21-5\n\n从调色板的 `Common`\
  \ 部分点击并拖动 `TextView` 对象，并将其位置设在 `ImageView` 上方，如图 21-6 所示。\n\n使用 `Attributes` 面板，展开\
  \ `Common Attributes` 部分中的 `textAppearance` 属性项，将 `textSize` 属性更改为 `24sp`，将 `textAlignment`\
  \ 设置为 `center`，并将文本改为“Samsung Galaxy S6”。\n\n![](img/as_3.5_layout_sample_textview_added.jpg)\n\
  \n图 21-6\n\n接下来，在布局底部添加三个 `Button` 组件，并将这些视图的文本属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应与图\
  \ 21-7 匹配：\n\n![](img/as_layout_sample_buttons.jpg)\n\n图 21-7\n\n此时，组件的约束条件还不足以让布局引擎能够在运行时对组件进行定位和调整大小。如果现在运行程序，所有组件都将位于在显示器的左上角。\n\
  \n将组件添加到布局后，使用 `Layout Editor` 工具栏上的设备旋转按钮（如图 21-8 中的箭头所示）来以横向模式查看用户界面：\n\n![](img/as_layout_editor_rotate.jpg)\n\
  \n图 21-8\n\n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，并且图像部分以及三个按钮都位于屏幕的可视图之外。显然，仍然需要进行一些工作才能使其成为一个响应式用户界面。\n\
  \n### 21.4 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸的布局的关键。首先将布局旋转回竖向模式，并选择位于 `ImageView` 之上的\
  \ `TextView` 组件。选中组件后，从 `TextView` 的左侧、右侧和顶部建立到父级 `ConstraintLayout` 对应侧边的约束，如图\
  \ 21-9 所示。将顶部约束的间距设置为 `16`：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\
  \n图 21-9\n\n约束了 `TextView` 组件后，选择 `ImageView` 实例，并在左右两侧建立对立约束，每个约束都连接到父布局的相应侧边。接下来，从\
  \ `ImageView` 的顶部到 `TextView` 的底部建立约束连接，从 `ImageView` 的底部到中心 `Button` 组件的顶部建立约束。如有必要，点击并拖动\
  \ `ImageView` 使其仍保持在布局的垂直中心。\n\n在仍选中 `ImageView` 的情况下，使用 `attributes` 面板中的 `Inspector`\
  \ 将 `ImageView` 的顶部和底部外边距分别更改为 `24` 和 `8`，并将两个组件的高度和宽度维度属性均改为 `match_constraint`，以便组件能够调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局变化：\n\n![](img/as_layout_sample_constraints.jpg)\n\n图 21-10\n\
  \n图 21-11 显示了目前 `ImageView` 相对于布局中其他元素实现的约束：\n\n![](img/as_layout_constrained.jpg)\n\
  \n图 21-11\n\n最后的任务是为三个 `Button` 组件添加约束。在本示例中，按钮将放置在链中。首先通过点击 `Layout Editor` 中如图\
  \ 21-1 所示的按钮来开启 `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后 Shift 点击另外两个按钮以全选。右键点击\
  \ `Buy Now` 按钮并从弹出菜单中选择 `Chains -> Create Horizontal Chain` 。默认情况下，链将使用 `spread`\
  \ 样式显示，这是本示例的行为。\n\n最后，在 `Buy Now` 按钮与布局底部之间建立约束，边缘设置为 `8`。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如图\
  \ 21-12 所示所示所示：\n\n![](img/as_layout_button_constraints.jpg)\n\n图 21-12\n\n### 21.5\
  \ 测试布局\n\n布局添加约束后，将屏幕旋转到横向，验证布局适应新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具提供了一个设计用户界面布局的实用视觉环境，但在测试方面，没有任何方法可以替代运行应用程序。在物理\
  \ Android 设备或模拟器会话上启动应用，并验证用户界面反映了在 `Layout Editor` 中创建的布局。例如，图 21-13 显示了横向模式下运行的应用：\n\
  \n![](img/as_layout_sample_landscape.jpg)\n\n图 21-13\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要定位、约束并设置属性即可。\n\
  \n### 21.6 使用 Layout Inspector\n\n可以随时使用 `Layout Inspector` 工具查看组成用户界面布局的组件层次结构。要访问此信息，应用必须在运行\
  \ Android API 29 或更高版本的设备或模拟器上运行。应用运行时，选择 `Tools -> Layout Inspector` 菜单选项，然后使用下方图\
  \ 21-14 所示标记为 A 的菜单来选择要检查进程）。\n\n\n\n\n\n一旦布局检查器加载，最左侧的面板 (B) 显示构成用户界面布局的组件层级结构。中间面板\
  \ (C) 显示布局设计的视觉化表示。点击视觉布局中的一个部件将使该项在层级列表中高亮显示，从而轻松找到视觉组件相对于整体布局层级结构的位置。\n\n最后，最右侧的面板（在图\
  \ 21-14 中标记为 D）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含一个指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-14\n\n要以 3D 视图查看布局，请点击标记为 E 的按钮。这将显示层级结构的“爆炸”表示，以便对其进行旋转和检查。这对于识别被遮挡的视图等任务非常有用：\n\
  \n![](img/as_layout_inspector_3D.jpg)\n\n图 21-15\n\n点击并拖动渲染内容进行三维旋转，使用上图箭头指示的滑块增加层之间的间距。再次点击标记为\
  \ E 的按钮返回 2D 视图。\n\n### 21.7 总结\n\nAndroid Studio 中的布局编辑器工具与 `ConstraintLayout`\
  \ 类紧密集成。本章通过一个示例用户界面的创建，概述了如何使用布局编辑器工具通过添加部件和设置约束来实现基于 `ConstraintLayout` 的用户界面。本章还引入了实时布局检查器工具，该工具对于分析用户界面布局的结构组成非常有帮助。\n\
  \n## 22. Android Studio 中的手动设计 XML 布局\n\n虽然使用 Android Studio 布局编辑器工具设计布局极大提高了效率，但仍然可以通过手动编辑底层\
  \ XML 来创建 XML 布局。本章将介绍 Android XML 布局文件格式的基础。\n\n### 22.1 手动创建 XML 布局\n\nXML 布局文件的结构实际上简单，遵循视图树的层级方法。XML\
  \ 资源文件的第一行应当包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\
  \n该声明之后应该是布局的根元素，通常是一个容器视图（例如布局管理器）。它由起始和结束标签表示，并包含任何需要在视图上设置的属性。例如，下面的 XML 声明将\
  \ `ConstraintLayout` 视图作为根元素，并设置 `match_parent` 属性使其填充设备显示的所有可用空间：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n注意，在上面的示例中，布局元素还在每个侧都配置了\
  \ 16dp（密度无关像素）的内边距。Android 布局中的任何间距规范都必须使用以下单位之一：\n\n- `in` – 英寸。\n- `mm` – 毫米。\n\
  - `pt` – 磅（1/72 英寸）。\n- `dp` – 密度无关像素。一种基于设备显示器相对于 160dpi 显示基线的物理密度的抽象测量单位。\n- `sp`\
  \ – 缩放无关像素。与 dp 类似，但根据用户的字体偏好进行缩放。\n- `px` – 实际屏幕像素。不建议使用，因为不同的显示器每英寸像素数不同。优先使用\
  \ `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout` 父元素的子元素必须嵌套在起始和结束标签之间。在接下来的示例中，添加了一个\
  \ `Button` 部件作为 `ConstraintLayout` 的子元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n目前，按钮没有任何连接。在运行时，按钮将出现在右上角（根据父元素分配的内边距缩进\
  \ 16dp）。如果为按钮添加约束，它将居中显示：\n\n```xml\n<Button\n    android:text=\"My Button\"\n \
  \   android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+button\"\n    app:layout_constraintBottom=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStart=\"parent\"\n    app:layout_constraintTop=\"\
  parent\" />\n```\n\n要在布局中添加第二个部件，只需将其嵌入 `ConstraintLayout` 的主体中。例如，下面的修改添加了一个 `TextView`：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+button\"\n        app:layout_constraintBottom=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"My Text\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n再次，新添加的\
  \ `TextView` 缺少约束会导致它在运行时出现在布局的左上角。下面的修改添加了与父布局连接的相反约束使部件水平居中，并添加了一个将 `TextView`\
  \ 底部连接到 `button` 部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\
  \n    android:layout_marginTop=\"8dp\"\n    android:layout_marginBottom=\"8dp\"\n\
  \    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n\n\n此外，请注意 `Button` 和 `TextView` 视图声明了几个属性。这两个视图都分配了 ID，并被配置为显示由名为\
  \ `button_string` 和 `text_string` 的字符串资源表示的字符串。此外，两个对象都声明了 `wrap_content` 高和 `width`\
  \ 属性，以便它们的大小能够适应内容（在本例中，即字符串资源值所引用的文本）。\n\n在设计模式下，通过 `Layout Editor` 的 `Preview`\
  \ 面板查看，上述布局的渲染结果如图 22-1 所示：\n\n![](img/as_manual_xml_ui.jpg)\n\n图 22-1\n\n## 22.2\
  \ 手动 XML 与 可视化布局设计\n\n是手动编写 XML 还是在设计模式下使用 `Layout Editor` 工具，取决于个人偏好。然而，使用设计模式具有其优势。\n\
  \n首先，设计模式通常会更快，因为它避免了输入数行 XML 的必要性。此外，设计模式避免了学习 `Android SDK` 视图类各种属性值复杂细节的需要。与其不断参考\
  \ `Android documentation` 来寻找正确的关键字和值，大多数大多数属性可以通过参考 `Attributes` 面板来找到。\n\n抛开设计模式的所有优势不谈，重要的是，这两种用户界面设计方法绝不是互斥的。作为应用程序开发者，你很可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行微调和布局调整。毕竟，界面设计的两种视图在 `Android Studio` 环境中是并排显示的，这使得在 XML 和可视化布局之间进行无缝工作变得非常简单。\n\
  \n### 22.3 总结\n\n`Android Studio Layout Editor` 工具为设计用户界面提供了一种视觉上直观的方法。通过使用拖放范式结合一组属性编辑器，该工具为应用程序开发者带来了显著的生产力效益。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其格式结构良好且易于理解。\n\n`Layout Editor` 工具生成 XML 资源文件这一事实意味着，这两种界面设计方法可以结合，为用户界面开发提供一种“两者兼顾”的方法。\n\
  \n## 23. 使用约束集管理约束\n\n到本书为止，所有的用户界面设计任务都是使用 `Android Studio Layout Editor` 工具完成的，无论是文本模式还是设计模式。编写\
  \ XML 资源文件或使用 `Android Studio Layout Editor` 的替代方案是编写 Java 代码来直接创建、配置和操作组成 `Android\
  \ activity` 用户界面的视图对象。在本章的上下文中，将在描述编写 Java 代码创建用户界面的优缺点之前，探索一些关键概念，例如视图属性以及布局约束的创建和管理。\n\
  \n在下一章中，将创建并使用示例项目，以演示这种 Android 用户界面创建方法中涉及的一些典型步骤。\n\n### 23.1 Java 代码与 XML 布局文件\n\
  \n与编写 Java 代码相比，使用 XML 资源文件来设计用户界面具有许多关键优势。事实上，Google 在 `Android documentation`\
  \ 中花费了大量精力来赞扬 XML 资源优于 Java 代码的优点。正如前一章所讨论的，XML 方法的一个关键优势包括能够使用 `Android Studio\
  \ Layout Editor` 工具，该工具本身会生成 XML 资源。第二个优势是，一旦创建了应用程序，就可以通过简单修改 XML 文件来更改用户界面屏幕，从而避免了重新编译应用程序的必要性。此外，即使是手动编写\
  \ XML 布局，也可以使用 `Android Studio Layout Editor` 工具的预览功能对用户界面的外观获得即时反馈。为了测试 Java 创建的用户界面的外观，开发者不可避免地反复通过编写代码、编译和测试循环，以完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 优于 XML 资源文件最显著的优势可能在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，换句话说，即从一次活动调用到下一次调用不太可能发生显著变化的布局。而\
  \ Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次执行活动时显示得不同的情况下特别有用。\n\n当需要在活动运行时对基于静态\
  \ XML 资源型的布局进行实时动态更改时，在 Java 代码中操作用户界面组件的知识也会有用。\n\n最后，某些开发者简单地倾向于编写 Java 代码而不是使用布局工具和\
  \ XML，无论后方法提供了哪些优势。\n\n### 23.2 创建视图\n\n如前所述，`Android SDK` 包含一个视图类工具箱，旨在满足大多数基本的用户界面设计需求。在\
  \ Java 中创建视图仅仅是创建这些类的实例，并将与该视图关联的 activity 引用作为参数传递。\n\n第一个视图（通常是容器视图，可以向其中添加额外的子视图）通过调用\
  \ activity 的 `setContentView()` 方法显示给用户。可以通过调用对象的 `addView()` 方法向根视图添加额外视图。\n\n\
  当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的 ID。在 Java 中创建的视图也遵循相同的规则。因此，必须对任何后续 Java\
  \ 代码中需要某些类型访问的视图分配 ID。这是通过调用相关视图对象的 `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 获取视图的\
  \ ID。\n\n### 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性直接设置在视图实例上，并通常定义视图对象的外观或行为。属性的示例是 `Button`\
  \ 对象上显示的文本，或 `ConstraintLayout` 视图的背景颜色。`Android SDK` 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用并将按钮显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法来设置。\n\n### 23.4 约束集\n\n虽然属性设置是视图内部的并决定视图的外观和行为，但约束集用于控制视图相对于父视图和其他兄弟视图的外观。每个\
  \ `ConstraintLayout` 实例都关联有一组约束，定义了其子视图如何定位和约束。\n\n\n\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行诸如创建、配置和将约束应用于 `ConstraintLayout` 实例等任务。此外，`ConstraintLayout`\
  \ 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的应用于其他布局（可以对其进行修改或不修改）。\n\n`ConstraintSet`\
  \ 实例的创建方式与其他任何 Java 对象都一样：\n\n```java\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行各种任务。\n\n#### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于在视图之间建立约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，并留有 70dp 的间距：\n\
  \n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n           editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n#### 23.4.2 将约束应用到布局\n\n一旦配置了约束集，就必须将其应用于 `ConstraintLayout`\
  \ 实例才能生效。通过调用 `applyTo()` 方法应用约束集，并传递要应用设置的布局对象的引用：\n\n```java\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父布局约束连接\n\n也可以通过引用 `ConstraintSet.PARENT_ID` 常量在子视图与其父布局 `ConstraintLayout`\
  \ 之间建立连接。在下面的示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，留有 100dp 的间距：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n           ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n#### 23.4.4 尺寸约束\n\n可以使用多个方法来控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸设置为最大 250dp：\n\n```java\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(), 250);\n\
  ```\n\n#### 23.4.5 约束偏置\n\n正如[在 Android Studio 中使用 ConstraintLayout 指南]章节所述，当一个视图具有相反的约束时，它将沿约束轴（即水平或垂直方向）居中。这种居中可以通过沿特定的约束轴上应用偏置来调整。当使用\
  \ Android Studio 布局编辑器时，这可以通过属性（Attributes）工具窗口中的控件来实现。然而，在处理约束集工作时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏置，引用视图 ID 和作为 0 到 1 之间的浮点值的偏置值。\n\n例如，以下代码在应用 25% 的水平偏置之前，将\
  \ `Button` 的左侧和右侧约束到父布局的相应侧：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \           ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n           ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n#### 23.4.6 对齐约束\n\
  \n也可以使用约束集应用对齐。Android Studio 布局编辑器中提供的全套对齐选项也可以通过约束集使用 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法配置，这两个方法都根据正在配置的对齐方式接受各种参数。此外，`center()` 方法可用于在两个其他视图之间居中视图。\n\n在下面的代码中，`button2`\
  \ 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(), button1.getId());\n\
  ```\n\n#### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout` 实例的当前约束集复制到约束集对象中。例如，以下代码将名为\
  \ `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象：\n\n```java\nset.clone(myLayout);\n\
  ```\n\n复制后，可以将约束集直接应用于另一个布局，或者像示例所示，在应用到第二个布局之前进行修改：\n\n```java\nConstraintSet set\
  \ = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n#### 23.4.8\
  \ ConstraintLayout 链 (Chains)\n\n可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 在约束集中创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, ...)\n```\n\n根据上面的语法，以下示例创建了一个从 `button1` 开始到 `button4` 结束的水平链。这些视图之间是\
  \ `button2` 和 `button3`，其权重设置为零：\n\n```java\nint[] chainViews = {button2.getId(),\
  \ button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT,\n                         button4.getId(), ConstraintSet.RIGHT,\n\
  \                         chainViews, chainWeights, ConstraintSet.SPREAD);\n```\n\
  \n可以通过向 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()` 方法传递视图 ID 来从链中移除视图。可以使用\
  \ `addToHorizontalChain()` 或 `addToVerticalChain()` 将视图添加到现有链中。在这两种情况下，方法都接收要插入新视图的两个视图\
  \ ID：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n#### 23.4.9 线 (Guidelines)\n\n使用 `create()` 方法将线添加到约束集，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法定位。在下面的代码中，创建一个垂直线并将其位于父布局宽度的 50% 处。然后将按钮的左侧连接到该线，且没有间距：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDLINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\n           R.id.myGuideline,\
  \ ConstraintSet.RIGHT, 0);\nset.applyTo(layout);\n```\n\n#### 23.4.10 移除约束\n\n可以使用\
  \ `clear()` 方法从约束集的视图移除约束，并传递视图 ID 和要移除约束的锚点：\n\n```java\nset.clear(button.getId(),\
  \ ConstraintSet.LEFT);\n```\n\n同样，通过在 `clear()` 方法调用中仅引用视图即可移除该视图的所有约束：\n\n```java\n\
  set.clear(button.getId());\n```\n\n#### 23.4.11 缩放\n\n可以使用 `ConstraintSet` 的 `setScaleX()`\
  \ 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收执行操作的视图以及表示比例的浮点值。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n#### 23.4.12 旋转\n\n\n\n\n可以使用 `setRotationX()` 和 `setRotationY()`\
  \ 方法分别在 X 轴或 Y 轴上旋转视图，这两个方法都必须传入要旋转视图的 ID 以及一个表示旋转角度的浮点数值。旋转发生的枢心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。以下代码使用位于点 (500, 500) 的枢心点将按钮视图在 Y 轴上旋转 30 度：\n\n\
  ```java\nset.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n在涵盖了约束集理论和从 Java 代码创建用户界面的方法后，下一章将通过创建一个示例应用程序，其目标是将这些理论付诸实践。有关\
  \ `ConstraintSet` 类的更多细节，请参阅以下 URL 中的参考指南：\n\n[`developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`](https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet)\n\
  \n### 23.5 总结\n\n作为编写 XML 布局资源文件或使用 Android Studio 布局编辑器工具的替代方案，Android 用户界面也可以在\
  \ Java 代码中动态创建。\n\n在 Java 代码中创建布局包括创建视图类的实例并在这些对象上设置属性以定义所需的显示和行为。\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的定位和大小设置，是通过使用约束集来定义的。约束集由 `ConstraintSet` 类的实例表示，该实例一旦创建，就可以使用广泛的方法调用进行配置，以执行诸如建立约束连接、控制视图尺寸行为和创建链等任务。\n\
  \n在本章涵盖了 `ConstraintSet` 类的基础知识后，下一章将通过一个教程，将这些功能投入实际使用。\n\n## 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 `ConstraintLayout` 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将采用这些概念，通过创建一个完全完全使用\
  \ Java 代码创建、且不使用 Android Studio 布局编辑器工具的示例布局，将它们付诸实践。\n\n## 24.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio，并在欢迎屏幕上选择 New Project（新建项目）选项，在出现的新项目对话框中，选择 Empty\
  \ Views Activity 模板，然后点击 Next（下一步）按钮。\n\n在 Name 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置设置为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ Language（语言）菜单设置为 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件应自动加载到编辑面板中。正如我们预期的那样，Android\
  \ Studio 创建了一个模板活动并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想的位置。\n\n### 24.2\
  \ 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件创建用户界面。因此，首先从该方法中删除此行代码：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n下一次修改是向活动添加一个带有单个 `Button`\
  \ 视图子节点的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的的新实例。然后需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 视图中，后者又通过调用活动实例的 `setContentView()` 方法显示：\n\
  \n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，构造方法必须传入创建该对象的上下文（context），在本例中，即是当前活动。由于上述代码位于活动类内部，因此通过标准的\
  \ `this` 关键字引用上下文：\n\n```java\nButton myButton = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见的结果是在\
  \ `ConstraintLayout` 视图的左上角出现一个没有任何文本的按钮，如图 24-1 所示。\n\n### 24.3 设置视图属性\n\n为了本次练习，我们需要\
  \ `ConstraintLayout` 的背景为蓝色，并且 `Button` 显示为“Press Me”的文本。这两项任务都可以通过如下片段所示，在 Java\
  \ 代码中对视图设置属性来实现。为了让按钮上的文本能够被地翻译到其他语言，将其作为资源添加。在项目窗口中，找到 `app` -> `res` -> `values`\
  \ -> `strings.xml` 文件，并修改它以添加“Press Me”字符串：\n\n```xml\n<resources>\n    <string\
  \ name=\"app_name\">JavaLayout</string>\n    <string name=\"press_me\">Press Me</string>\n\
  </resources>\n```\n\n虽然这是代码中直接引用字符串的推荐方法，但在本书的剩余部分中，许多代码示例将直接在代码中输入字符串\n\n`getString(R.string.press_me)`\n\
  \n创建字符串资源后，向 `configureLayout()` 方法添加代码以设置文本的颜色：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n现在编译并运行应用程序，布局将反映属性设置，使得布局显示蓝色背景，按钮显示指定的文本。\n\n### 24.4 创建视图 ID\n\n布局完成后，将包含一个\
  \ `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法引用这些视图之前，必须为它们分配唯一的视图 ID。此过程的第一步是创建一个包含这些\
  \ ID 值的新资源文件。\n\n右键点击 `app` -> `res` -> `values` 文件夹，选择 New -> Values Resource File\
  \ 选项，并将新资源文件命名为 `id.xml`。创建资源文件后，编辑其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<resources>\n    <item name=\"myButton\" type=\"id\" />\n    <item name=\"\
  myEditText\" type=\"id\" />\n</resources>\n```\n\n\n\n在教程的这一阶段，仅创建了 `Button`，因此编辑\
  \ `configureLayout()` 方法为对象分配相应的 `ID`：\n\n```java\nprivate void configureLayout()\
  \ {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n### 24.5 配置约束集 (Constraint Set)\n\n在没有任何约束条件的情况下，`ConstraintLayout` 视图将\
  \ `Button` 视图放置在显示器的左上角。要指示布局视图将按钮放置在另一个位置（在本例中为在水平和垂直方向上都居中），则需要创建一个 `ConstraintSet`\
  \ 实例，使用适当的设置对其进行初始化，并将其应用于父布局。\n\n对于此示例，需要对按钮进行配置，使其宽度和高度被限制为其所显示文本的大小，并使视图在父布局中居中。再次编辑\
  \ `configureLayout()` 方法以做出这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n    ConstraintSet set = new ConstraintSet();\n \
  \   set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用程序，验证 `Button` 视图现在是否出现在布局的中心：\n\
  \n![](img/Image2444.jpg)\n图 24-2\n\n### 24.6 添加 EditText 视图\n\n要添加到布局的下一个项是 `EditText`\
  \ 视图。第一步是创建 `EditText` 对象，为其分配在 `id.xml` 资源文件中声明的 `ID`，并将其添加到布局中。实现这些步骤的代码更改现在需要按照所示对\
  \ `configureLayout()` 方法进行修改：\n\n```java\nprivate void configureLayout() {\n   \
  \ Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText myEditText = new EditText(this);\n    myEditText.setId(R.id.myEditText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(myEditText);\n    setContentView(myLayout);\n\
  }\n```\n\n`EditText` 控件的设计的大小取决于其显示的内容，在布局中水平居中，并放置在现有 `Button` 视图上方 70dp 处。向 `configureLayout()`\
  \ 方法添加代码，使其内容如下：\n\n```java\nset.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n测试运行应用程序应显示\
  \ `EditText` 字段在按钮上方居中，并有 70dp 的间距。\n\n### 24.7 将密度像素 (dp) 转换为像素 (px)\n\n此练习中的下一项任务是将\
  \ `EditText` 视图的宽度设置为 200dp。正如“Android Studio 布局编辑器教程”章节中所述，在用户界面布局中设置尺寸和位置时，使用密度无关像素\
  \ (dp) 比使用像素 (px) 更好。因此，使用 dp 时需要在运行时将 dp 值转换为 px 值，并考虑屏幕密度。为了将 `EditText` 视图的宽度设置为\
  \ 200dp，需要向类中添加以下代码：\n\n```java\npackage com.ebookzy.javayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,\
  \ r.getDisplayMetrics());\n    }\n\n    private void configureLayout() {\n     \
  \   Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 的宽度已如图 24-3 所示发生了变化：\n\n![](img/Image2451.jpg)\n\
  图 24-3\n\n## 24.8 总结\n\n在本章中创建的示例 Activity 尽管背景颜色和视图类型不同，但与早的“Android Studio 中的手动\
  \ XML 布局设计”章节中创建的界面相似。尽管如此，本章至少应该让你意识到 Android Studio 布局编辑器工具和 XML 资源在很大程度上避免了开发者处理创建\
  \ Android 用户界面布局的复杂性。\n\n然而，在某些情况下，使用 Java 创建用户界面是合理的，例如创建动态用户界面布局。\n\n## 25. Android\
  \ Studio Apply Changes 使用\n\n在涵盖了使用 Android Studio 进行 Android 开发的一些基本概念后，现在是介绍 Apply\
  \ Changes 功能的好时机。所有经验丰富的开发者都知道，等待应用程序编译和运行的每一秒都是更适合编写和优化代码的时间。\n\n### 25.1 简介 Apply\
  \ Changes\n\n\n\n\n在 Android Studio 的早期版本中，每当需要测试对项目的更改时，Android Studio 都会重新编译代码、将其转换为\
  \ Dex 格式、生成 APK 包文件并将其安装到设备或模拟器上。完成这些步骤后，应用程序最终会启动并准备好进行测试。即使在快速的开发系统上，这个过程需要相当的时间才能完成。对于大型应用程序来说，此过程花费一分钟或更长的时间并不罕见。\n\
  \n相比之下，“应用更改”（Apply Changes）允许在项目中的许多代码和资源更改在应用程序运行于设备或模拟器会话期间，几乎瞬时反映到应用中。\n\n举例来说，考虑一个正在\
  \ Android Studio 中开发的应用程序，该应用已在设备或模拟器上启动。如果对资源设置或方法内的代码进行了更改，“应用更改”将更新后的代码和资源推送到运行中的应用程序，并动态地“交换”这些更改。更改将反映在运行的应用程序中，而无需构建、部署和重新启动整个应用程序。在许多情况下，这使得可以在不使用“应用更改”所需的一短时间内完成这些更改。\n\
  \n### 25.2 理解应用更改选项\n\nAndroid Studio 提供了三种在运行的应用程序上应用更改的，形式分别为 `Run App`（运行应用）、`Apply\
  \ Changes`（应用更改）以及 `Restart Activity and Apply Code Changes`（重启活动 并应用代码更改）。这些选项可以总结如下：\n\
  \n- `Run App` - 停止当前运行的应用程序并重新启动。如果自上次启动以来项目未发生任何更改，此选项将只需重启应用程序。相反，如果项目已发生更改，Android\
  \ Studio 将在启动之前重新构建并将应用程序安装到设备或模拟器上。\n\n- `Apply Code Changes` - 当对项目进行的唯一更改涉及对现有方法体的修改，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用到运行的应用程序中，而无需重启应用程序或当前运行的\
  \ Activity。然而，当对布局文件等任何项目资源进行过更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类和其他结构性代码更改。当对项目清单（Manifest）进行更改时，也无法使用此选项。\n\
  \n- `Apply Changes and Restart Activity` - 选中后，此模式将动态应用项目内进行的任何代码或资源更改，并在不重新安装或重启应用程序的情况下重启\
  \ Activity。与 `Apply Code changes` 选项不同，当对项目的代码和资源进行更改时可以使用此选项，尽管仍然存在某些结构性代码更改和清单修改的限制。\n\
  \n### 25.3 使用应用更改\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以使用工具栏上的运行按钮（在[图 25-1]中标记为\
  \ `A`）或调试按钮（标记为 `B`）照常启动它：\n\n![](img/as_run_and_debug.jpg)\n\n图 25-1\n\n应用程序启动并运行后，运行按钮上的图标将发生变化，表示应用程序正在运行，并且\
  \ `Apply Changes and Restart Activity` 和 `Apply Code Changes` 按钮将如[图 25-2]所示被启用：\n\
  \n![](img/as_apply_changes_buttons.jpg)\n\n图 25-2\n\n如果在选择其中一个“应用更改”按钮时无法应用更改，Android\
  \ Studio 将显示一条指示失败的消息以及说明。例如，[图 25-3]显示了在对资源文件进行更改后选择 `Apply Code Changes` 选项时，Android\
  \ Studio 显示的消息：\n\n![](img/as_apply_changes_resource_error.jpg)\n\n图 25-3\n\n在这种情况下，解决方案是使用\
  \ `Apply Changes and Restart Activity` 选项（此处提供了链接）。同样，当尝试应用涉及添加或删除方法的更改时，将出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击 `Run App`\
  \ 按钮以重新安装并重启应用程序。作为在这些情况下手动选择正确选项的替代方案，可以配置 Android Studio 自动退回到执行 `Run App` 操作。\n\
  \n### 25.4 配置应用更改回退设置\n\n应用更改的回退设置位于 Android Studio 的 Preferences（偏好）窗口，通过选择 `File\
  \ -> Settings` 菜单项显示（macOS 上为 Android Studio Preferences`）。在 Preferences 对话框中，选择左侧面板中的\
  \ `Build, Execution, Deployment` 项，然后选择 `Deployment`，如[图 25-5]所示：\n\n![](img/as_3.5_apply_changes_preferences.jpg)\n\
  \n图 25-5\n\n一旦启用了所需的选项，点击 `Apply` 然后点击 `OK` 按钮以提交更改并关闭对话框。在启用这些默认设置后，Android Studio\
  \ 将将在时自动重新安装并重启应用程序。\n\n### 25.5 应用更改教程\n\n启动 Android Studio，从欢迎界面选择 `New Project`（新建项目）选项，并在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Basic Views Activity` 模板。\n\n在 `Name` 字段中输入 `ApplyChanges` 并指定\
  \ `com.ebookfrenzy.applychanges` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n### 25.6 使用应用更改\n\n\
  通过点击 `run` 按钮并选择模拟器或物理设备作为运行目标开始。点击 `run` 按钮后，跟踪示例应用程序出现在设备或模拟器所需的时间。\n\n运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意出现\
  \ `Snackbar` 实例显示文本“Replace with your own action”，如[图 25-6]所示：\n\n![](img/app_changes_snackbar.jpg)\n\
  \n图 25-6\n\n一旦应用程序运行，应用更改按钮应已启用，表示某些项目更改可以在无需重新安装和重启应用程序的情况下应用。为了此效果，编辑 `MainActivity.java`\
  \ 文件，找到 `onCreate` 方法并修改操作代码，以便在选择操作时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \            .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实施代码更改后，点击\
  \ `Apply Code Changes` 按钮，注意几秒钟会出现一条指示应用程序已更新的消息。点击操作按钮，注意新消息现在显示在 `Snackbar` 中。\n\
  \n### 25.7 使用应用更改并重启活动\n\n任何资源更改都将需要 `Apply Changes and Restart Activity` 选项。在 Android\
  \ Studio 中选择 `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器工具处于 Design（设计）模式下，选择默认的\
  \ `TextView` 组件，并在属性工具窗口将 `text` 属性更改为“Hello Android”。\n\n\n\n确保在点击“应用更改”（Apply\
  \ Code Changes）按钮之前，已关闭上方“配置应用更改回退设置”中列出的回退选项。请注意，请求失败是因为此更改涉及项目资源。点击“应用更改并重启活动”（Apply\
  \ Changes and Restart Activity）按钮，并验证活动已重启并在 `TextView` 控件上显示了新文本。\n\n### 25.8 使用运行应用\
  \ (Run App)\n\n如前所述，删除方法需要完全重新安装并重启运行中的应用程序。为了体验这一过程，请编辑 `MainActivity.java` 文件，并在\
  \ `onCreate` 方法之后添加如下新方法：\n\n```java\npublic void demoMethod() {\n\n}\n```\n\n使用“应用更改”按钮并确认更改在无需重新安装应用的情况下已应用。\n\
  \n接下来，删除该新方法并验证点击两个“应用更改”按钮中的任意一个都会导致请求失败。在此类更改后运行应用程序的唯一方法是点击“运行应用”（Run App）按钮。\n\
  \n### 25.9 总结\n\n应用更改（Apply Changes）是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。应用更改功能能够将更新推送到运行中的应用程序，在许多情况下无需重新安装甚至无需重启应用。根据应用于项目的修改的性质，应用更改提供了多种不同层次的支持。\n\
  \n## 26. Android 事件处理概述与示例\n\n之前的章节已经涵盖了许多关于 Android 应用程序用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面的交互如何触发底层活动执行任务的方式。换句话说，我们从之前的章节中已经了如何创建一个包含按钮视图的用户界面，但不知道当用户触摸它时如何让应用程序内部发生变化。\n\
  \n因此，本章的主要目标是提供 Android 应用程序事件处理的概述，并结合一个基于 Android Studio 的示例项目。\n\n### 26.1 理解\
  \ Android 事件\n\nAndroid 中的事件可以采取多种形式，但通常是响应外部动作而产生的。常见的事件形式（特别是对于平板电脑和平手机等设备）涉及与触摸屏的某种形式交互。此类事件属于输入事件。\n\
  \nAndroid 框架维护了一个事件队列，事件在发生时会被放入队列中。然后按照先进先出（FIFO）的原则从队列中移除。对于触摸屏幕等输入事件，事件将传递给位于屏幕触摸发生位置的视图。除了事件通知外，视图还会接收到关于事件性质的一系列信息（取决于事件类型），例如用户指尖与屏幕之间接触点的坐标。\n\
  \n为了能够处理传递过的事件，视图必须配备一个事件监听器（event listener）。所有用户界面组件都派生自 `View` 类，该类包含一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够对特定类型的事件做出响应，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。如果在屏幕按钮视图的位置检测到“点击”事件（原文：在屏幕按钮视图的位置处检测到“点击”事件），那么当该事件从事件队列中移除时，Android 框架将调用该视图的\
  \ `onClick()` 方法。当然，任何在响应按钮点击时应执行的任务或对其他方法的回调用用，都应该在 `onClick()` 回调方法的实现中完成。\n\n\
  ### 26.2 使用 android:onClick 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需要在用户“点击”用户界面中的按钮视图时调用回调方法时，提供了一个快捷方式。考虑一个用户界面界面布局，其中包含一个名为\
  \ `button1` 的按钮视图，要求是当用户触摸按钮时，调用在活动类中声明的名为 `buttonClick()` 方法。实现此行为只需要编写 `buttonClick()`\
  \ 方法（该方法接收触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行代码。例如：\n\n```xml\n<Button\n   \
  \ android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:onClick=\"buttonClick\"\n    android:text=\"Click me\"\
  \ />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有事件处理程序（event handlers）所提供的系列选项，后者是本章其余部分的重点。正如后续章节将概述的，`onClick`\
  \ 属性在涉及片段（fragments）的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当在设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板找到并配置\
  \ `onClick` 属性。\n\n### 26.3 事件监听器与回调方法\n\n在本章后面概述的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。在此之前，值得花时间概述\
  \ Android 框架中可用的事件监听器以及每个监听器关联的回调方法。\n\n- `onClickListener`: 用于检测点击事件，即用户触摸并释放视图占据设备显示的区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图作为参数。\n- `onLongClickListener`: 用于检测用户在视图上保持触摸一段时间。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数。\n- `onTouchListener`: 用于检测与触摸屏的任何形式接触，包括单个或多次触摸以及手势动作。`onTouch()`\
  \ 回调的相关主题将在 Android 触摸和多点事件处理章节中进行详细介绍。回调方法将接收事件的视图和 `MotionEvent` 对象作为参数。\n- `onCreateContextMenuListener`:\
  \ 监听由于长按产生的上下文菜单创建。对应 `onCreateContextMenu()` 回调方法。该回调接收菜单、接收事件的视图和一个菜单上下文对象。\n\
  - `onFocusChangeListener`: 检测由于与轨迹球或导航键交互而导致焦点离开当前视图。对应 `onFocusChange()` 回调方法，该方法传递接收事件的视图和一个指示是否获得或丢失焦点的布尔值。\n\
  - `onKeyListener`: 用于检测当视图拥有焦点时按了设备上的按键。对应 `onKey()` 回调方法。传递的参数包括接收事件的视图、按下物理键的\
  \ `KeyCode` 以及 `KeyEvent` 对象。\n\n### 26.4 事件处理示例\n\n\n\n\n在本章的剩余部分中，我们将完成一个 Android\
  \ Studio 项目的学习，该项目旨在演示如何实现事件监听器以及相应的回调方法，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图（TextView），以指示事件已处理。\n\
  \n从欢迎界面选择`New Project`（新建项目）选项，在出现的新项目对话框中，选择`Empty Views Activity`模板，然后点击`Next`（下一步）按钮。\n\
  \n在`Name`字段中输入`EventExample`，并将`com.ebookfrenzy.eventexample`指定为包名。点击`Finish`（完成）按钮之前，将`Minimum\
  \ API level`（最低 API 级别）设置为`API 26: Android 8.0 (Oreo)`，并将`Language`语言菜单设置为`Java`。按照第\
  \ 11.8 迁移项目到 View Binding 节概述的步骤，将项目转换为使用 view binding。\n\n### 26.5 设计用户界面\n\n示例中\
  \ `MainActivity` 类的用户界面布局由一个 `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图\
  \ 26-1 所示。\n\n![](img/as_event_example_ui.jpg)\n\n图 26-1\n\n找到并选择 Android Studio\
  \ 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app -> res -> layouts` 下），并双击它将其加载到\
  \ Layout Editor 工具中。\n\n确保已启用`Autoconnect`（自动连接），然后从调色板中拖入 `Button` 组件，并移动使其位于布局的水平中心且位于现有\
  \ `TextView` 组件的下方。当位置正确时，将组件释放到相应位置，以便自动连接系统添加相应的约束。\n\n选择“Hello World!” `TextView`\
  \ 组件，并使用`Attributes`（属性）面板将 `ID` 设置为 `statusText`。重复此步骤将 `Button` 组件的 `ID` 改为 `myButton`。\n\
  \n通过点击布局编辑器工具栏上的`Infer Constraints`（推断约束）按钮添加任何缺失的约束。\n\n在选中 `Button` 组件时，使用`Attributes`面板将\
  \ `text` 属性设置为`Press Me`。将按钮上的文本字符串提取到名为 `press_me` 的资源中。\n\n现在用户界面布局完成后，下一步是注册事件监听器和回调方法。\n\
  \n### 26.6 事件监听器和回调方法\n\n在本示例中，需要为 `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的\
  \ `setOnClickListener()` 方法实现，并将一个新的 `onClickListener` 对象作为参数传递，同时实现 `onClick()`\
  \ 回调方法。由于此任务只需要在 Activity 创建时执行，因此良好的位置是 `MainActivity` 类的 `onCreate()` 方法。\n\n\
  如果 `MainActivity.java` 文件已在编辑器会话中打开，请点击编辑器面板中的标签页选择它。或者，在 Project 工具窗口中导航至（`app\
  \ -> java -> com.ebookfrenzy.eventexample -> MainActivity`）找到它，并双击它将其加载到代码编辑器中。加载后，找到模板\
  \ `onCreate()` 方法并修改它，以获取按钮视图的引用、注册事件监听器并实现 `onClick()` 回调方法：\n\n```java\npackage\
  \ com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        ContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n                }\n            }\n        );\n    }\n}\n```\n\n上述代码现在已在按钮上注册了事件监听器并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有任何指示表明安装在按钮上的事件监听器正在工作，因为目前 `onClick()` 方法体内部尚未实现任何代码。该示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要进行一些额外的更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    ContentView(view);\n    binding.myButton.setOnClickListener(\n        new Button.OnClickListener()\
  \ {\n            public void onClick(View v) {\n                binding.statusText.setText(\"\
  Button clicked\");\n            }\n        }\n    );\n}\n```\n\n通过在 AVD 模拟器或物理 Android\
  \ 设备上编译并运行应用程序来完成教程的此阶段。触摸并释放按钮视图（即“点击”）时，文本视图应更改为显示“Button clicked”文本。\n\n### 26.7\
  \ 消费事件\n\n在视图上检测标准点击（而非长按）是事件处理的一个非常简单的案例。示例现在将扩展为包含对长点击事件的检测，长点击事件在用户点击并按屏幕上的视图时发生，从而涵盖事件消费的主题。\n\
  \n考虑本章上节中 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行后不会向框架返回值。\n\n相反，分配给 `onLongClickListener`\
  \ 的代码需要向 Android 框架返回 `Boolean` 值。此返回值的目的是向 Android 指示回调是否消费了事件。如果回调返回 `true` 值，事件将被框架丢弃。相反，如果回调返回\
  \ `false` 值，Android 框架将认为事件仍然有效，并随后将其传递给同一视图上注册的下一个匹配事件监听器。\n\n与许多编程概念一样，这最好通过示例来演示。第一步是在示例\
  \ Activity 中为按钮视图添加长点击事件监听器和回调方法：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n..\n    binding.myButton.setOnLongClickListener(\n    \
  \    new Button.OnLongClickListener() {\n            public boolean onLongClick(View\
  \ v) {\n                binding.statusText.setText(\"Long button click\");\n   \
  \             return true;\n            }\n        }\n    );\n}\n```\n\n显然，当检测到长点击时，`onLongClick()`\
  \ 回调方法将在文本视图上显示“Long button click”。然而，回调方法还返回了 `true` 值表示它已消费了事件。运行应用程序并按按按钮视图，直到文本视图出现“Long\
  \ button click”。释放按钮时，文本视图继续显示“Long button click”文本，表明 `onClick` 监听器未被调用。\n\n接下来，修改代码使\
  \ `onLongClick` 监听器现在返回 `false` 值：\n\n```java\nbutton.setOnLongClickListener(\n\
  \    new Button.OnLongClickListener() {\n        public boolean onLongClick(View\
  \ v) {\n            TextView myTextView = findViewById(R.id.myTextView);\n     \
  \       myTextView.setText(\"Long button click\");\n            return false;\n\
  \        }\n    }\n);\n```\n\n\n\n\n\n再次编译并运行应用程序，并对按钮进行长按，直到出现长按消息。然而，在这次释放按钮时，请注意\
  \ `onClick` 监听器也会被触发，且文本将变为“Button clicked”。这是因为 `onLongClick` 监听器代码返回的 `false`\
  \ 值指示 Android 框架该事件未被该方法消费，并且有权传递给该视图上注册的下一个监听器。在这种情况下，运行时确定按钮上的 `onClickListener`\
  \ 同样对该类型的事件也感兴趣，并随后调用了 `onClick` 监听器代码。\n\n### 26.8 总结\n\n如果用户界面中包含的视图不对比用户交互做出任何响应，那么该用户界面几乎没有实际用处。Android\
  \ 通过事件监听器和回调方法的概念弥补了用户界面与应用程序后端代码之间的差距。`View` 类定义了一 set 事件监听器，这些监听器可以注册在视图对象上。每个事件监听器都关联有一个回调方法。\n\
  \n当用户界面中的视图上发生事件时，该事件会被放入事件队列，并由 Android 运行时按照先进先出的原则进行处理。如果发生事件的视图注册了与事件类型匹配的监听器，则会调用相应的回调方法。代码随后会在返回之前执行活动\
  \ 所需的任何任务。某些回调方法需要返回一个 `Boolean` 值，以指示该事件是需要传递给视图上注册的任何其他事件监听器，还是被系统丢弃。\n\n在涵盖了事件处理的基础知识后，下一章将深入探讨触摸事件主题，特别强调多点触摸的处理。\n\
  \n## 27 Android 触摸与多点触摸事件处理\n\n大多数基于 Android 的设备使用触摸屏作为用户与设备的主要接口。上一章介绍了屏幕上的触摸转换为运行中的\
  \ Android 应用程序内动作的机制。然而，触摸事件的处理远比对视图对象上的单指点击做出响应复杂得多。例如，大多数 Android 设备可以同时检测到多个触摸。触摸也不局限于设备显示器上的单点。当然，当用户在屏幕表面滑动一个或多个接触点时，触摸也可以是动态的。\n\
  \n应用程序还可以将触摸解释为一种手势。例如，水平滑动通常用于翻页电子书的页码，或者如何使用捏合动作来放大或缩小显示在屏幕上的图像。\n\n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主题将在下一章介绍。\n\
  \n### 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了名为\
  \ `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸都会导致调用 `onTouch()` 方法：\n\n```java\n\
  binding.myLayout.setOnTouchListener(\n    new ConstraintLayout.OnTouchListener()\
  \ {\n        public boolean onTouch(View v, MotionEvent m) {\n            // 在此处执行任务\n\
  \            return true;\n        }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调需要返回一个\
  \ `Boolean` 值，向 Android 运行时系统指示是否将事件传递到同一视图注册的其他事件监听器，或将其丢弃。该方法传递了触发事件的视图引用和一个类型为\
  \ `MotionEvent` 的对象。\n\n### 27.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象包含的信息包括触摸在视图中的位置以及所执行的动作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n###\
  \ 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的动作类型。与事件关联的动作类型可以通过调用传递给 `onTouch()` 回调方法的\
  \ `MotionEvent` 对象的 `getActionMasked()` 方法来。当视图上的第一次触摸发生时，`MotionEvent` 对象将包含动作类型\
  \ `ACTION_DOWN` 以及触摸的坐标。当该触摸从屏幕上抬起时，会生成一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP`\
  \ 事件之间的任何触摸运动都将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时执行多个触摸时，这些触摸被称为指针（pointers）。在多点触摸场景中，指针分别以\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 类型的事件动作开始和结束。要识别触发事件的指针的索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n### 27.4 处理多点触摸\n\n名为“Android 事件处理概述与示例”的章节开始在单次触摸的狭窄范围内探索事件处理。在实践中，大多数\
  \ Android 设备都具有响应多点触摸的能力（尽管重要的是注意，同时触摸的数量因设备而异）。\n\n如前所述，在多点触摸情况下，每次触摸被 Android\
  \ 框架认为是一个指针。每个指针反过来通过索引值被引用并分配一个 ID。当前指针的数量可以通过调用 `getPointerCount()` 方法获取。当前指针列表中特定索引处的指针\
  \ ID 可以通过调用 `getPointerId()` 方法获取。例如，以下代码获取指针计数以及索引为 0 的指针的 ID：\n\n```java\npublic\
  \ boolean onTouch(View v, MotionEvent m) {\n    int pointerCount = m.getPointerCount();\n\
  \    int pointerId = m.getPointerId(0);\n    return true;\n}\n```\n\n注意，当触发 `onTouch`\
  \ 监听器时，指针计数始终大于或等于 1（因为必须发生至少一次触摸才会触发回调）。\n\n视图上的触摸，特别是涉及屏幕运动的触摸，会在屏幕接触点抬起之前产生一系列事件。因此，应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的\
  \ ID 在后续事件之间不会改变，但重要的是，随着其他触摸事件的出现和消失，索引值会发生变化。因此，在多个事件中处理触摸手势时，使用 ID 值作为触摸引用以确保跟踪同一个触摸是关重要的。在调用需要索引的方法时，应通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸 ID 转换为相应的索引值。\n\n### 27.5 多点触摸应用程序示例\n\
  \n在本章剩余部分将创建的示例应用程序将跟踪在布局视图上移动的最两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n\n\
  \n\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前，选择 `Empty Views Activity`\
  \ 模板。\n\n在 Name 字段中输入 `MotionEvent`，并指定 `com.ebookfrenzy.motionevent` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 Language（语言）菜单更改为\
  \ `Java`。\n\n按照第 11.8 将项目迁移到 View Binding 节所述，调整项目以使用 view binding。\n\n## 27.6 设计\
  \ Activity 用户界面\n\n应用程序唯一 Activity 的用户界面由包含两个 `TextView` 对象的 `ConstraintLayout`\
  \ 视图组成。在 Project 工具窗口中，导航到 `app` -> `res` -> `layout`，并双击 `activity_main.xml` 布局资源文件，以将其加载到\
  \ Android Studio 布局编辑器工具中。\n\n选择并删除默认的“Hello World!” `TextView` 控件，然后在启用 autoconnect（自动连接）的情况下，拖放一个新的\
  \ `TextView` 控件，使其水平居中，并放置在布局顶部边缘的 `16dp` 边距线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  \n图 27-1\n\n拖入第二个 `TextView` 控件，并对其进行定位和约束，使其与第一个控件的底部保持 `32dp` 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  \n图 27-2\n\n使用 Attributes（属性）工具窗口，将 `TextView` 控件的 ID 分别改为 `textView1` 和 `textView2`。将控件上显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用布局编辑器右上角的警告按钮将字符串提取到资源。\n\n## 27.7 实现触摸事件监听器\n\
  \n为了接收触摸事件通知，必须在 `MainActivity` Activity 类的 `onCreate()` 方法中对布局视图注册触摸监听器。从 Android\
  \ Studio 编辑器面板选择 `MainActivity.java` 标签页以显示源码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，代码将调用名为\
  \ `handleTouch()` 的第二个方法，并向传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \nimport android.os.Bundle;\n\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  \nimport com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n当我们设计用户界面时，父 `ConstraintLayout` 没有分配一个允许我们通过\
  \ view binding 机制访问它的 ID。由于此布局组件是 UI 布局层次结构中的顶层组件，我们可以使用上述代码中的 `root` 绑定属性来引用它。\n\
  \n在测试应用程序之前的最后一个任务是实现由监听器调用的 `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++) {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n \
  \       int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \       switch (action) {\n            case MotionEvent.ACTION_DOWN:\n         \
  \       actionString = \"DOWN\";\n                break;\n            case MotionEvent.ACTION_UP:\n\
  \                actionString = \"UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_POINTER_DOWN:\n                actionString = \"PNTR DOWN\"\
  ;\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n   \
  \             actionString = \"PNTR UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n         \
  \       break;\n            default:\n                actionString = \"\";\n   \
  \     }\n        String touchStatus = \"Action: \" + actionString + \" Index: \"\
  \ + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0) {\n            binding.textView1.setText(touchStatus);\n        } else {\n\
  \            binding.textView2.setText(touchStatus);\n        }\n    }\n}\n```\n\
  \n在编译和运行应用程序之前，花时间过一遍这段代码，以突出正在执行的任务。\n\n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别视图上当前有多少个活跃指针：\n\
  \n```java\nTextView textView1 = findViewById(R.id.textView1);\nTextView textView2\
  \ = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n```\n\
  \n接下来，使用 `pointerCount` 变量启动 `for` 循环，对每个活跃指针执行一组任务。循环的前几行获取指针的 `X` 和 `Y` 坐标以及相应的事件\
  \ ID、动作类型和索引。最后，声明一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount; i++) {\n\
  \    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n\
  \    int action = m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n\
  \    String actionString;\n}\n```\n\n由于动作类型等于整数，使用 `switch` 语句将动作类型转换为更有意义的字符串，存储在之前声明的\
  \ `actionString` 变量中：\n\n```java\nswitch (action) {\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 ID 以及 `X` 和 `Y` 坐标构造字符串消息。然后使用\
  \ `id` 值来决定字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0) {\n    binding.textView1.setText(touchStatus);\n\
  } else {\n    binding.textView2.setText(touchStatus);\n}\n```\n\n## 2.8 运行示例应用程序\n\
  \n编译并运行应用程序，启动后，在屏幕上尝试单次和多点触摸，并观察文本视图如何更新以反映事件，如图 27-3 所示。在模拟器上运行时，可以通过按住 `Ctrl`\
  \ 键（macOS 上为 `Cmd`）并点击鼠标来模拟多点触摸（注意：如果模拟器在工具窗口中运行，模拟多点触摸可能无效）：\n\n![](img/as_4.1_motion_event_running.jpg)\n\
  \n图 27-3\n\n## 27.9 总结\n\n\n\n\nActivity 通过注册 `onTouchListener` 事件监听器并实现 `onTouch()`\
  \ 回调方法来接收触摸事件的通知。当 Android 运行时调用该方法时，会向其传递一个 `MotionEvent` 对象。该对象包含了有关触摸的信息，例如触摸事件的类型、触摸坐标以及当前与\
  \ View 接触的触摸计数。\n\n当涉及多次触摸时，每个接触点被称为一个 `pointer`（指针），每个指针都被分配了一个 `index`（索引）和一个\
  \ `ID`。虽然触摸的 `index` 可能会在事件之间发生变化，但 `ID` 在触摸结束之前保持不变。\n\n本章将详细介绍如何创建一个 Android 应用程序示例，该程序旨在显示设备屏幕上多达两个同时触摸的坐标和动作类型。\n\
  \n在概述了通用触摸操作后，下一章（标题为 “使用 Android GestureDetector 类检测常见手势](#）将通过实现手势识别来进一步研究触摸屏幕事件的处理。\n\
  \n# 28 使用 Android GestureDetector 类检测常见手势\n\n“手势”一词用于定义触摸屏与用户之间连续的交互序列。一个典型的手势开始于屏幕首次被触摸的点，结束于最后一个手指或指针设备离开显示表面时。如果被正确利用，手势可以实现为用户与应用程序之间的一种通信形式。用于翻阅电子书页码的滑动动作，或涉及两次触摸以放大或缩小图像的捏合动作，都是使用手势与应用程序进行交互的典型示例。\n\
  \nAndroid SDK 提供了在应用程序中检测常见手势和自定义手势的机制。常见手势包括诸如点击（tap）、双击、长按或沿水平方向或垂直方向的滑动动作（在 Android\
  \ 术语中称为 fling，快速滑动）。\n\n本章的目标是探索使用 `GestureDetector` 类来检测在 Android 设备屏幕上执行常见手势。下一章标题为\
  \ “在 Android 上实现自定义手势和捏合识别](#），将涵盖更复杂的自定义手势的检测，例如圆形运动和捏合动作。\n\n## 28.1 实现常见手势检测\n\
  \n当用户与 Android 设备的屏幕交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传递包含用户与屏幕接触数据的 `MotionEvent`\
  \ 对象。这些数据可以被解释，以识别屏幕上的动作是否匹配常见手势（如点击或滑动）。通过使用 `GestureDetectorCompat` 类，只需极少的编程工作即可实现。该类专门设计用于接收应用程序的运动事件信息，并根据检测到的常见手势类型（如果有）触发方法调用。\n\
  \n检测常见手势的基本步骤如下：\n\n1. 声明一个实现了 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是全新的类，也可以是所属的 Activity 类。如果需要检测双击手势，类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 `GestureDetectorCompat` 实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，根据需要启用双击检测。\n\
  4. 在所属的 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来必须调用 `GestureDetectorCompat` 实例的\
  \ `onTouchEvent()` 方法，并将当前运动事件作为参数传递。\n\n一旦实现，结果是应用程序中一组方法，当检测到特定类型的手势时将调用这些方法。可以实现这些方法内部的代码来执行响应手势需要执行的任何任务。\n\
  \n在本章的剩余部分中，我们将通过创建一个示例项目来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类支持的所有常见手势，并向用户显示检测到的手势类型。\n\n\n\n\n```java\n    public boolean onSingleTapUp(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapUp\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleTap\");\n      \
  \  return true;\n    }\n\n    @Override\n    public boolean onDoubleTapEvent(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleTapEvent\");\n \
  \       return true;\n    }\n\n    @Override\n    public boolean onSingleTapConfirmed(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n\
  \        return true;\n    }\n}\n```\n\n注意，这些方法中的许多都返回了 `true`。这向 `Android Framework`\
  \ 表示事件已被该方法消费，不需要传递给堆栈中的下一个事件处理器。\n\n## 28.4 创建 GestureDetectorCompat 实例\n\n现在 activity\
  \ 类已更新以实现相应的监听器接口，下一步是创建 `GestureDetectorCompat` 类的实例。由于这只需要在 activity 创建时执行一次，因此这段代码的最佳位置是\
  \ `onCreate()` 方法中。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()`\
  \ 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\nimport androidx.core.view.GestureDetectorCompat;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n}\n```\n\n## 28.5 实现 onTouchEvent() 方法\n\n如果此时编译并运行应用程序，即使在设备显示屏上执行手势，也不会什么都不会发生。这是因为还没有添加代码来拦截触摸事件并将其传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，有必要在 activity 类中重写 `onTouchEvent()` 方法并实现它，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n### 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意，如图 28-1 所示，文本视图会更新以反映这些事件：\n\
  \n![](img/Image2425.jpg)\n\n图 28-1\n\n### 28.7 总结\n\n用户与设备触摸屏之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间的交互方法。虽然手势可以由几乎任何动作序列组成，但触摸屏设备用户已经熟悉了一套广泛使用的手势。通过利用\
  \ `Android Gesture Detector` 类，可以在应用程序中轻松地检测到许多所谓的“常用手势”。在本章中，我们已经从理论和实现两个方面概述了这一技术的使用。\n\
  \n\n\n\n\n# 29.6 创建手势文件\n\n一旦 Gesture Builder Tool 加载，点击设备屏幕底部的 `Create New Gesture`\
  \ 按钮，并如图 29-1 所示，在灰色画布上使用圆周运动“画出”一个手势。假设手势显示符合预期（用设备屏幕上的黄色线条表示），点击 `save` 按钮将手势添加到手势文件中，在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存保存后，Gesture\
  \ Builder Tool 将显示当前定义的句势列表，此时该列表将仅包含新创建的 Circle Gesture 手势。\n\n# 29.7 创建示例项目\n\n\
  从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `CustomGestures`，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单更改为\
  \ `Java`。按照 11.8 将项目迁移到 View Binding 节所述调整项目以使用 view binding。\n\n# 29.8 从 SD 卡中提取手势文件\n\
  \n由于每个手势都是在 Gesture Builder 应用中创建的，它们会被添加到名为 `gesture.txt` 的文件中，该文件位于运行应用的模拟器或设备的存储中。但在此文件添加到\
  \ Android Studio 项目之前，必须将其从设备存储中复制并保存到本地文件系统中。最简单的方法是使用 Android Studio 的 `Device\
  \ File Explorer` 工具窗口。通过 `View -> Tool Windows -> Device File Explorer` 菜单选项显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在该文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 菜单选项并将文件保存到临时位置，命名为 `gestures`。\n\n![](img/as_gesture_file_in_explorer.jpg)\n\
  \n图 29-2\n\n一旦创建并从设备存储中提取了手势文件，它就可以作为资源文件添加到 Android Studio 项目中了。\n\n# 29.9 将手势文件添加到项目\n\
  \n在 Android Studio Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），从弹出的菜单中选择 `New ->\
  \ Directory`。在 `New Directory` 对话框中，输入 `raw` 作为文件夹名并按键盘回车键。使用适用于你操作系统类型的适当文件资源管理器工具，找到之前从设备存储中提取的\
  \ `gestures` 文件，并将其复制、粘贴到 Project 工具窗口中新的 `raw` 文件夹中。\n\n# 29.10 设计用户界面\n\n此示例应用需要一个用户界面，其中包含一个\
  \ `ConstraintLayout` 视图，在其上方覆盖了一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app -> res\
  \ -> layout -> activity_main.xml` 文件，双击它将其加载到 Layout Editor 工具中，选择并删除默认的 `TextView`\
  \ 小部件。\n\n切换布局编辑器的 Code 模式并修改 XML 使其如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <android.gesture.GestureOverlayView\n        android:id=\"\
  @+id/gOverlay\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n# 29.11\
  \ 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码以便在活动启动时加载该文件。出于此而言，实现此目的的代码将如下所示添加到 `MainActivity.java`\
  \ 源文件的 `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\n\
  .\n\nimport android.gesture.GestureLibrary;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnPerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity implements OnPerformedListener\
  \ {\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ = GestureLibrary.fromResource(this, R.raw.gestures);\n        if (!gLibrary.load())\
  \ {\n            finish();\n        }\n    }\n}\n```\n\n除了一些必要的导入外，上述代码创建了一个 `GestureLibrary`\
  \ 实例并将手势文件的内容加载其中。活动也已修改实现 `OnPerformedListener`，这需要实现 `onPerformed` 回调（将在后续节中创建）。\n\
  \n# 29.12 注册监听器\n\n为了让活动接收到用户执行手势的通知，需要在 `GestureOverlayView` 视图上注册 `OnPerformedListener`\
  \ 事件，可以通过如下代码所示的 {获取其引用：\n\n```java\nprivate void gestureSetup() {\n    gLibrary\
  \ = GestureLibrary.fromResource(this, R.raw.gestures);\n    if (!gLibrary.load())\
  \ {\n        finish();\n    }\n    GestureOverlayView gOverlay = findViewById(R.id.gOverlay);\n\
  \    gOverlay.addOnPerformedListener(this);\n}\n```\n\n# 29.13 实现 onPerformed 方法\n\
  \n在对应用程序进行首次运行之前，只需实现 `onPerformed` 回调方法。当 `GestureOverlayView` 实例上执行手势时，将调用该方法：\n\
  \n```java\npackage com.ebookfrenzy.customgestures;\n\n.\n\n.\n\nimport android.gesture.Prediction;\n\
  import android.widget.Toast;\nimport android.gesture.Gesture;\nimport java.util.ArrayList;\n\
  \npublic class MainActivity extends AppCompatActivity implements OnPerformedListener\
  \ {\n    private GestureLibrary gLibrary;\n\n.\n\n.\n\n    public void onPerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n\
  \        if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n     \
  \       String action = predictions.get(0).name;\n            Toast.makeText(this,\
  \ action, Toast.LENGTH_SHORT).show();\n        }\n    }\n\n}\n```\n\n\n\n\n\n当 Android\
  \ 运行时检测到 `gesture overlay view` 对象上的手势时，会调用 `onGesturePerformed` 方法。作为参数传递的是检测到手势的\
  \ `GestureOverlayView` 对象的引用，以及一个类型为 `Gesture`的对象。`Gesture` 类设计用于存储定义特定手势的信息（本质上是屏幕上一系列带时间的点，描述了构成手势的笔画路径）。\n\
  \n`Gesture` 对象被传递给我们的 `gLibrary` 实例的 `recognize()` 方法，其目的是将当前手势与从手势文件中加载的每个手势进行比较。完成此任务后，`recognize()`\
  \ 方法返回一个 `ArrayList` 对象，其中包含每次比较结果的 `Prediction` 对象。该列表按照匹配程度从最好（位于数组位置 0 处）到最差进行排序。每个预测对象中包含了手势文件中对应的手势名称，以及一个指示其与当前手势匹配程度的预测评分。\n\
  \n因此，上述方法中的代码获取位置 0（最匹配项）的预测结果，确保其评分大于 1.0，然后显示一个 `Toast` 消息（一种设计用于向用户显示通知弹出窗口的\
  \ Android 类），显示匹配手势的名称。\n\n### 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，并在屏幕上执行圆圈手势。执行后，应该出现一个包含检测到的手势名称的\
  \ toast 提示。请注意，当手势被识别时，它会在屏幕上用亮黄色线条勾勒出来，而覆盖层不确定的手势则显示为淡黄色线条。虽然这在开发期间很有用，但对于实际应用程序可能并不理想。显然，因此还有一些配置工作需要完成。\n\
  \n### 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为手势期间显示黄色线条。用于绘制已识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下所示修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们被绘制在 `ConstraintLayout` 视图的白色背景上）。\n\
  \n### 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明的覆盖层，可以置于其他视图之上。这引出了了一个问题：当手势被识别后，由覆盖层拦截的事件是否应该传递给底层的视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性进行控制。当设置为 `true`\
  \ 时，当识别出手势，手势事件不会传递给底层视图。当在可能配置为响应某些手势而滚动的视图上执行手势时，此设置可能特别有用。将此属性设置为 `true` 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n### 29.17 检测缩放手势\n\n在离开通用触摸处理和特别是手势识别之前，本章的最后一个主题是处理缩放手势（pinch gestures）。虽然可以使用本章之前节概述的步骤创建并检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于缩放视图或图像）。\n\
  \n检测缩放手势的最简单方法是使用 Android 的 `ScaleGestureDetector` 类。通常来说，检测缩放手势涉及以下三个步骤：\n\n1.\
  \ 声明实现 `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和\
  \ `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 在封装的 Activity 中实现 `onTouchEvent()` 回调方法，该方法反调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分中，我们将创建一个示例，用于演示缩放手势识别的实现。\n\n### 29.18 缩放手势示例项目\n\n从欢迎屏幕选择“New\
  \ Project”选项，在生成的新项目对话框中，点击“Next”按钮之前选择“Empty Views Activity”模板。\n\n在 `Name` 字段中输入\
  \ `PinchExample` 并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击“Finish”按钮之前，将最小 API\
  \ 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。按照[11.8 Migrating a Project\
  \ to View Binding]中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml` 文件中，选择默认的\
  \ `TextView` 对象并使用属性窗口将 ID 设置为 `myTextView`。在 Android Studio 中定位并加载 `MainActivity.java`\
  \ 文件并如下修改：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\nimport android.os.Bundle;\n\
  import android.view.MotionEvent;\nimport android.view.View;\nimport android.view.ScaleGestureDetector;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport com.ebookfrenzy.pinchexample.binding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    MainBinding binding;\n\
  \    ScaleGestureDetector gestureDetector;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        gestureDetector\
  \ = new ScaleGestureDetector(this, new MyOnScaleListener());\n    }\n\n    @Override\n\
  \    public boolean onTouchEvent(MotionEvent event) {\n        gestureDetector.onTouchEvent(event);\n\
  \        return true;\n    }\n\n    public class MyOnScaleListener extends ScaleGestureDetector.SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n\n\n\n\n在 `onCreate()` 方法中，创建了一个新的 `ScaleGestureDetector`\
  \ 实例，并将封装的 的引用以及我们新创建的 `MyOnScaleGestureListener` 类实例作为参数传递通过。最后，为 activity 实现了一个\
  \ `onTouchEvent()` 回调方法，该方法简单调用 `ScaleGestureDetector` 对象对应的 `onTouchEvent()` 方法，并将\
  \ `MotionEvent` 对象作为参数传递通过。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，然后在屏幕上执行收放手势，注意文本视图会根据捏放动作显示放大或缩出的消息。在模拟器的独立模式下，可以通过按住\
  \ `Ctrl` 键（macOS 为 `Cmd` 键）并点击拖动鼠标指针来模拟捏放手势，如图 29-3 所示：\n\n![](img/Image2449.jpg)\n\
  \n图 29-3\n\n## 29.19 总结\n\n手势本质上是触摸屏幕接触点的运动，涉及一个或多个笔画，可以作为用户与应用程序之间的通信方法。Android\
  \ 允许使用 `Gesture Builder` 应用来设计手势。一旦创建，手势就可以保存到手势文件中，并在应用程序运行时使用 `GestureLibrary`\
  \ 加载到 activity 中。\n\n通过在现有视图上叠加透明 `GestureOverlayView` 类的实例并实现 `OnGesturePerformedListener`\
  \ 事件监听器，可以在显示区域检测手势。使用 `GestureLibrary` 可以生成用户执行的手势与存储在手势文件中的势之间的匹配排名列表，并使用预测分数来判断手势是否足够匹配。\n\
  \n可以通过实现 `ScaleGestureDetector` 类来检测捏放手势，本章也提供了该类的示例。\n\n## 30. Android Fragments\
  \ 简介\n\n随着你对本书章节的深入学习，你会越来越发现，Android 系统背后的许多设计概念其构想目标是促进构成应用程序的不同元素之间的复用和交互。本章将探索的一个领域就涉及\
  \ Fragment 的使用。\n\n本章将概述 fragment 的基础知识，包括它们是什么以及如何在应用程序中创建和使用它们。下一章将通过一个教程展示在 Android\
  \ Studio 中开发应用程序时 fragment 的实际应用，包括 fragment 之间通信的实现。\n\n### 30.1 什么是 Fragment？\n\
  \nFragment 是应用程序用户界面及其相应行为的一个自包含的、模块化的部分，可以嵌入到 activity 中。Fragments 可以在应用程序设计阶段组装以创建一个\
  \ activity，并在应用程序运行时添加到或从 activity 中移除，以创建动态变化的用户界面。\n\nFragments 只能作为 activity\
  \ 的一部分使用，不能被实例化为独立的应用程序元素。尽管如此，一个 fragment 可以被认为是一个功能性的“子 activity”，其生命周期与完整的 activity\
  \ 相似。\n\nFragments 以 XML 布局文件的形式存储，可以通过在 activity 的布局文件中放置适当的 `<fragment>` 元素，或者直接通过\
  \ activity 类实现中的代码将其添加到 activity 中。\n\n### 30.2 创建 Fragment\n\n构成 fragment 的两个组件是一个\
  \ XML 布局文件和一个对应的 Java 类。fragment 的 XML 布局文件采用的格式与任何其他 activity 布局的格式相同，可以包含布局管理器和视图的任何组合和复杂性。例如，下面的\
  \ XML 布局用于一个由 `ConstraintLayout` 组成的 fragment，该布局具有红色背景，并包含一个白色前色的单个 `TextView`：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment。例如：\n\n```java\n\
  package com.example.fragmentdemo;\nimport android.os.Bundle;\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport androidx.fragment.app.Fragment;\n\
  \npublic class FragmentOne extends Fragment {\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n        // Inflate\
  \ the fragment\n        binding = FragmentBinding.inflate(inflater, false);\n  \
  \      return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。一旦创建了\
  \ fragment 布局和类，就可以在 activity 中使用了。\n\n### 30.3 使用布局 XML 将 Fragment 添加 Activity\n\
  \n可以通过编写 Java 代码或将 fragment 嵌入 activity 的布局文件将其纳入 activity。无论使用哪种方法，在使用库兼容旧版本 Android\
  \ 时，任何使用 fragments 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`\
  \ 类：\n\n```java\npackage com.example.fragmentdemo;\nimport android.os.Bundle;\n\
  import androidx.fragment.app.FragmentActivity;\n\npublic class MainActivity extends\
  \ FragmentActivity {\n```\n\nFragments 使用 `FragmentContainerView` 类嵌入到 activity\
  \ 布局文件中。下面的示例将本章上一节创建的 fragment 嵌入到 activity 中：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/fragment2\"\n        android:name=\"com.ebookfrenzy.myfragmentdemo.FragmentOne\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_marginStart=\"32dp\"\n        android:layout_marginEnd=\"\
  32dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:layout=\"@layout/fragment_one\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n\n\n\n\n`<fragment>` 元素的关键属性是 `android:name`（它必须引用与 fragment 关联 类）以及 `tools:layout`（它必须引用包含\
  \ fragment 布局的 XML 资源文件）。\n\n一旦添加到 activity 的布局中，就可以在 Android Studio 布局编辑器工具中查看和操作\
  \ fragment。例如，图 30-1 显示了在 Android Studio 布局编辑器中嵌入 fragment 的上述布局：\n\n![](img/as_4.1_my_first_fragment.jpg)\n\
  \n图 30-1\n\n## 30.4 在代码中添加和管理 Fragment\n\n通过 activity 的 XML 布局文件添加 fragment 虽然方便，但代价是\
  \ activity 无法在运行时移除该 fragment。为了在运行时对 fragment 进行完全的动态控制，必须通过代码添加这些 activity。这样做的优点是，在应用程序运行期间，可以动态地添加、移除甚至让\
  \ fragment 之间相互替换。\n\n当使用代码管理 fragment 时，fragment 本身仍然由一个 XML 布局文件和一个相应的类组成。区别在于宿主\
  \ activity 中操作 fragment 的。使用代码向 activity 添加 fragment 时，有一套标准的步骤序列：\n\n1. 创建 fragment\
  \ 类的实例。\n2. 将任何额外的 intent 参数传递给该类实例。\n3. 获取 fragment manager 实例的引用。\n4. 调用 fragment\
  \ manager 实例上的 `beginTransaction()` 方法。这会返回一个 fragment 事务实例。\n5. 调用 fragment 事务实例的\
  \ `add()` 方法，将要包含 fragment 的视图的资源 ID 和 fragment 类实例作为参数传递。\n6. 调用 fragment 事务的 `commit()`\
  \ 方法。\n\n例如，以下代码添加了一个由 `FragmentOne` 类定义的 fragment，使其显示在 ID 为 `LinearLayout1` 的容器视图中：\n\
  \n```\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n为了清晰起见，上面的代码将每一步都分成了独立的语句。然而，最后四行可以缩写为单行代码：\n\
  \n```\ngetSupportFragmentManager().beginTransaction()\n        .add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦被添加到容器中，随后可以通过调用 fragment 事务实例的 `remove()`\
  \ 方法来移除 fragment，调用时传递要移除的 fragment 实例的引用：\n\n```\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment 事务实例的 `replace()` 方法用另一个 fragment 替换 fragment。该方法的参数是包含\
  \ fragment 的视图 ID 以及新 fragment 的实例。被替换的 fragment 也可以放在所谓的回退栈（back stack）中，这样当用户返回时可以快速恢复。这通过在调用\
  \ `commit()` 方法之前，调用 fragment 事务对象的 `addToBackStack()` 方法来实现：\n\n```\nFragmentTwo\
  \ secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n## 30.5 处理 Fragment\
  \ 事件\n\n如前所述，fragment 非常像一个子 activity，拥有它自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本框）能够像普通\
  \ activity 一样产生事件。这引发了一个问题：哪个类接收来自 fragment 中视图的事件？是 fragment 身，还是嵌入 fragment 的\
  \ activity？这个问题的答案取决于事件处理程序的声明方式。\n\n在标题为 Android 事件处理概述与示例 的章节中，讨论了两种处理事件的方法。第一种方法涉及在\
  \ activity 的代码中配置事件监听器和回调方法。例如：\n\n```\nbinding.button.setOnClickListener(\n   \
  \ new Button.OnClickListener() {\n        public void onClick(View v) {\n      \
  \      // 当按钮被点击时\n            // 要执行的代码\n        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\n## 30.6\
  \ 实现 Fragment 通信\n\n一旦一个或多个 fragment 被嵌入 activity 中，很有可能需要在 fragment 与 activity\
  \ 之间、以及 fragment 之间进行某种形式的通信。事实上，良好的实践规定 fragment 之间不直接相互通信。所有通信都应该通过封装它的 activity\
  \ 进行。\n\n为了让 activity 与 fragment 通信，activity 必须通过分配给它的 ID 来标识 fragment 对象。一旦获取了该引用，activity\
  \ 就可以调用 fragment 的公共方法。\n\n反向通信（从 fragment 到 activity）稍微复杂一些。首先，fragment 必须定义一个监听接口，然后在\
  \ activity 类中实现该接口。例如，以下代码在 fragment 类 `ToolbarFragment` 上声明了一个名为 `ToolbarListener`\
  \ 的接口。代码还声明了一个变量，稍后将在其中存储 activity 的引用：\n\n```java\npublic class ToolbarFragment\
  \ extends Fragment {\n    ToolbarListener activityCallback;\n\n    public interface\
  \ ToolbarListener {\n        void onButtonClick(int position, String text);\n  \
  \  }\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现回调方法 `onButtonClick`，该方法接收一个整数和一个字符串。\n\
  \n接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity 关联时，Android\
  \ 系统会自动调用此方法。该方法传递 fragment 所属 activity 的引用。该方法必须存储该 activity 的本地引用，并验证它是否实现了 `ToolbarListener`\
  \ 接口：\n\n```java\n@Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，activity 的引用将存储在本地变量\
  \ `activityCallback` 中，如果该 activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\n\n\n\n\
  下一步是在 fragment（片段）内部调用 activity（活动）的回调方法。何时以及如何发生这种情况完全取决于 fragment 需要访问 activity\
  \ 的情况。例如，下面的代码在按钮被点击时调用 activity 上的回调方法：\n\n```java\npublic void buttonClicked (View\
  \ view) {\n    activityCallback.onButtonClick(arg1, arg2);\n}\n```\n\n剩下的工作是修改 activity\
  \ 类，使其实现 `ToolbarListener` 接口。例如：\n\n```java\npublic class MainActivity extends\
  \ FragmentActivity\n            implements ToolbarFragment.ToolbarListener {\n\n\
  \    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n}\n```\n\n从上述代码中我们可以，activity 声明了它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n### 30.7 总结\n\nFragment 为创建可重用的用户界面布局和应用程序行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到\
  \ activity 中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过将 fragment 添加到 activity 的布局文件中，或者通过编写代码在运行时管理\
  \ fragment，在 activity 中使用 fragment。在代码中添加到 activity 的 fragment 可以在运行时动态地删除和替换。fragment\
  \ 之间的所有通信应该通过其所嵌入的 activity 进行。\n\n在本章涵盖了 fragment 的基础知识后，下一章将通过一个教程来强化本章中概述的技巧。\n\
  \n## 31. 在 Android Studio 中使用 Fragments - 示例\n\n如上一章所述，fragment 提供了一种创建可重用功能模块的便利机制，这些模块由用户界面部分和相应的行为组成。一旦创建，fragment\
  \ 就可以嵌入到 activity 中。\n\n在上一章探索了 fragment 的整体理论后，本章的目标是使用 Android Studio 创建一个示例 Android\
  \ 应用程序，用于演示创建和使用 fragment 的实际步骤，并实现 activity 内部两个 fragment 之间的通信。\n\n### 31.1 关于示例\
  \ Fragment 应用\n\n在本章中创建的应用程序将由单个 activity 和两个 fragment 组成。第一个 fragment 的用户界面将包含一个工具栏，由\
  \ `EditText` 视图、`SeekBar` 和 `Button` 组成，所有内容包含在 `ConstraintLayout` 视图中。第二个 fragment\
  \ 将仅包含一个 `TextView` 对象，同样包含在 `ConstraintLayout` 视图中。\n\n这两个 fragment 将嵌入到应用程序的主\
  \ activity 中，并实现如下通信：当第一个 fragment 中的按钮被按下时，输入到 `EditText` 视图中的文本将显示在第二个 fragment\
  \ 的 `TextView` 上，字体大小由第一个 fragment 中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在较早版本的 Android\
  \ 上，因此也有必要使用适当的 Android 支持库。\n\n### 31.2 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，在点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `FragmentExample`，并指定包名为为\
  \ `com.ebookfrenzy.fragmentexample`。在点击 `Finish` 按钮之前，将 Minimum API 级别设置改为 `API\
  \ 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照章节 [11.8 Migrating a Project to View\
  \ Binding] 中列出的步骤，修改项目以使用 view binding。\n\n返回 `Gradle Scripts -> build.gradle (Module\
  \ :app)` 文件，并在 dependencies 部分添加以下指令（请注意现在可能有该库的更新版本）：\n\n```gradle\nimplementation\
  \ 'androidx.navigation:navigation-fragment:2.5.2'\n```\n\n### 31.3 创建第一个 Fragment\
  \ 布局\n\n下一步是为将在我们的 activity 中使用的第一个 fragment 创建用户界面。\n\n此用户界面将由一个 XML 布局文件和一个 fragment\
  \ 类组成。虽然可以手动添加，但让 Android Studio 为我们创建会更快。在项目工具窗口中，找到 `app -> java -> com.ebookfrenzy.fragmentexample`\
  \ 条目并对其点击右键。从生成的菜单中，选择 `New -> Fragment -> Gallery...` 选项以显示图 31-1 所示的对话框：\n\n![](img/as_4.2_fragment_gallery.jpg)\n\
  \n图 31-1\n\n在点击 `Next` 按钮之前选择 `Fragment (Blank)` 模板。在后续屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件名为\
  \ `fragment_toolbar`：\n\n![](img/as_4.2_new_fragment_java.jpg)\n\n图 31-2\n\n使用 Design\
  \ 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器中。接下来，在 Component Tree 面板中右键点击 `FrameLayout`\
  \ 条目，选择 `Convert FrameLayout to ConstraintLayout` 菜单选项，并在确认对话框中接受默认设置。将 id 改为 `constraintLayout`。确保\
  \ Autoconnect 模式已启用，然后选择并删除默认的 `TextView`，并布局添加 `Plain Text`、`Seekbar` 和 `Button`\
  \ 组件，使它们的位置与图 31-3 所示。最后，将视图 id 分别更改为 `editText1`、`seekBar1` 和 `button1`。\n\n将按钮上的文本改为“Change\
  \ Text”，将文本提取为名为 `change_text` 的字符串资源，并移除 `EditText` 视图中的 `Name` 文本。最后，将 `SeekBar`\
  \ 的 `layout_width` 属性设置为 `match_constraint`，并将左右边距设置为 16dp。\n\n使用 Infer constraints\
  \ 按钮添加任何缺失约束，此时布局应与下图 31-3 所示：\n\n![](img/as_fragment_example_frag_one_ui.jpg)\n\
  \n图 31-3\n\n### 31.4 将 Fragment 迁移到 View Binding\n\n与 `Empty Views Activity` 模板一样，Android\
  \ Studio 在向项目添加新 fragment 时不会启用 view binding 支持。因此，在继续教程的下一步之前，我们需要进行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件并导入导入 binding：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（包括添加 `onDestroyView()` 方法以在 fragment\
  \ 销毁时移除引用）：\n\n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\npublic\
  \ View onCreateView(LayoutInflater inflater, ViewGroup container,\n            \
  \             Bundle savedInstanceState) {\n    // 膨胀 fragment 布局\n    return inflater.inflate(R.layout.fragment_toolbar,\
  \ container, false);\n    binding = FragmentToolbarBinding.inflate(inflater, container,\
  \ false);\n    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView()\
  \ {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n完成这些更改后，fragment\
  \ 可以使用 view binding。\n\n### 31.5 添加第二个 Fragment\n\n重复创建工具 fragment 的步骤，添加另一个命名为\
  \ `TextFragment` 的空 fragment，其布局文件名为 `fragment_text`。再次将 `FrameLayout` 容器转换为 `ConstraintLayout`（更改\
  \ id 为 `constraintLayout2`）并移除默认的 `TextView`。\n\n\n\n\n\n从调色板拖入一个 `TextView` 小部件并将其放置在布局中心，使用\
  \ `Infer`（推断）约束按钮添加任何缺失的约束。将 `TextView` 的 `id` 更改为 `textView2`，将 `text` 设置为“Fragment\
  \ Two”，并将 `textAppearance` 属性修改为 `Large`。\n\n完成后，布局应与图 31-4 所示所示匹配：\n\n![](img/as_4.0_fragment_text_layout.jpg)\n\
  \n图 31-4\n\n重复上一节中执行的步骤，将 `TextFragment` 类迁移为使用视图绑定（view binding），如下所示：\n\n```java\n\
  import com.ebookfrenzy.fragmentexample.databinding.FragmentTextBinding;\n\nprivate\
  \ FragmentTextBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // 膨胀此 fragment 的布局\n    return inflater.inflate(R.layout.fragment_text,\
  \ container, false);\n    binding = FragmentTextBinding.inflate(inflater, container,\
  \ false);\n    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView()\
  \ {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n### 31.6 将 Fragments\
  \ 添加到 Activity\n\n应用程序的主 activity 关联了一个名为 `activity_main.xml` 的 XML 布局文件。在本例中，碎片\
  \ 将使用该文件中的 `<fragment>` 元素添加到 activity 中。使用 Project 工具窗口，导航到 `FragmentExample` 项目的\
  \ `app` -> `res` -> `layout` 部分，并双击 `activity_main.xml` 文件以将其加载到 Android Studio\
  \ 布局编辑器工具中。\n\n在 Design 模式下的布局编辑器工具中，选择并删除布局中的默认 `TextView` 对象，string 在调色板中选择 `Common`\
  \ 类别。从视图列表中拖出 `FragmentContainerView` 组件并将其拖动到布局上，使其水平居中，并使虚线出现表示顶部布局边距：\n\n![](img/as_3.5_fragment_example_add_fragment.jpg)\n\
  \n图 31-5\n\n当将 fragment 释放到布局上时，会出现一个对话框，显示当前项目中可用的 Fragments 列表，如图 31-6 所示：\n\n\
  ![](img/as_4.1_fragment_list.jpg)\n\n图 31-6\n\n从列表中选择 `ToolbarFragment` 条目并点击 OK\
  \ 按钮关闭 Fragments 对话框。添加完成后，点击布局编辑器右上角的红色警告按钮以显示 Problems 工具窗口。一条“未知 fragments”的消息将指示布局编辑器工具需要知道在预览会期间要显示哪个\
  \ fragment。选择“Unknown fragment”项，然后点击右侧面板中的 `Pick Layout...` 链接，如图 31-7 所示：\n\n\
  ![](img/as_pick_layout.jpg)\n\n图 31-7\n\n在结果弹出的对话框（图 31-8）中选择 `fragment_toolbar`\
  \ 条目，然后点击 OK 按钮：\n\n![](img/as_choose_fragment.jpg)\n\n图 31-8\n\n选中 fragment 后，将\
  \ `layout_width` 属性更改为 `match_constraint`，使其占据屏幕全宽。从调色板点击并拖动另一个 `FragmentContainerView`\
  \ 条目，并将其使其水平居中并位于第一个 fragment 底部下方。在提示时，在点击 OK 按钮之前从 fragment 对话框选择 `TextFragment`\
  \ 条目。显示 Problems 工具窗口并重复之前的步骤，这次选择 `fragment_text` 布局。使用 `Infer` 约束按钮建立任何缺失的布局约束。\n\
  \n注意，碎片现在在布局中是可见的，如图 31-9 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\n图 31-9\n\
  \n在继续下一步之前，选择布局中的 `TextFragment` 实例，并在 Attributes 工具窗口中将 fragment 的 `ID` 更改为 `text_fragment`。\n\
  \n### 31.7 让 Toolbar Fragment 与 Activity 通信\n\n当用户触碰 toolbar fragment 中的按钮时，fragment\
  \ 类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送到 text fragment。正如[《Android Fragments\
  \ 简介》(#Fragments.xhtml__idTextAnchor682)]中所概述，碎片之间不应直接相互通信，而是应该使用它们嵌入的 activity\
  \ 作为中介。\n\n此过程的第一步是确保 toolbar fragment 响应按钮点击。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本例，我们将在\
  \ `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其进行修改，使其读取如下列表所示：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.annotation.Nullable;\nimport android.content.Context;\nimport android.widget.SeekBar;\n\
  \npublic class ToolbarFragment extends Fragment implements SeekBar.OnChangeListener\
  \ {\n    private static int seekvalue = 10;\n    private FragmentToolbarBinding\
  \ binding;\n\n    @Override\n    public void onViewCreated(@NonNull view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.setOnSeekBarChangeListener(this);\n        binding.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n\n    public void\
  \ buttonClicked(View view) {\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress, boolean fromUser) {\n        seekvalue = progress;\n  \
  \  }\n\n    @Override\n    public void onStartTouch(SeekBar arg0) {}\n\n    @Override\n\
  \    public void onStopTouch(SeekBar arg0) {}\n}\n```\n\n在继续之前，我们需要花时间解释上面的代码。首先，该类声明为实现\
  \ `OnChangeListener` 接口。这是因为用户界面包含一个 `SeekBar` 实例，fragment 需要在用户滑动时接收通知以更改字体。`OnChangeListener`\
  \ 接口的实现需要实现 `onProgressChanged()`、`onStartTouch()` 和 `onStopTouch()` 方法。这些方法已经实现，但只有\
  \ `onProgressChanged()` 方法实际任务，并将新值存储在名为 `seekvalue` 的变量中。在类开头还声明了一个变量用于存储 `EditText`\
  \ 对象的引用。\n\n添加了 `onViewCreated()` 方法为按钮设置 `OnClickListener`，并配置为检测到点击事件时调用名为 `buttonClicked()`\
  \ 方法。该方法也已实现，尽管此时它什么都不做。\n\n此过程的下一阶段是设置监听器，允许 fragment 在按钮被点击时调用 activity。这遵循上一节中概述的机制：\n\
  \n```javublic class ToolbarFragment extends Fragment implements SeekBar.OnChangeListener\
  \ {\n    private static int seekvalue = 10;\n    private FragmentToolbarBinding\
  \ binding;\n    ToolbarListener activityCallback;\n\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n\n  \
  \  @Override\n    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n```\n\n\n\n\n\n```java\nthrow new ClassCastException(context.toString()\n\
  \        + \" must implement ToolbarListener\");\n    }\n}\n\npublic void buttonClicked\
  \ (View view) {\n    activityCallback.onButtonClick(seekvalue,\n            binding.editText1.getText().toString());\n\
  }\n\n}\n```\n\n上述实现将在当用户点击按钮时，会调用属于 activity 类的名为 `onButtonClick()` 方法。因此，剩下的工作就是声明该\
  \ activity 类实现了新创建的 `ToolbarListener` 接口并实现 `onButtonClick()` 方法。\n\n由于在较期的 Android\
  \ 版本中使用了 Android Support Library 来支持 fragment，因此 activity 也需要更改为继承自 `FragmentActivity`\
  \ 而不是 `AppCompatActivity`。将这些要求结合起来，得到了修改后的 `MainActivity.java` 文件：\n\n```java\n\
  package com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport androidx.fragment.app.FragmentActivity;\n\nimport android.os.Bundle;\n\n\
  public class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n\n    public void onButtonClick(int fontsize, String text) {\n\n    }\n}\n\
  ```\n\n按照目前的代码更改，toolbar fragment 将检测到用户点击了按钮，并调用 activity 上的方法，传递 `EditText` 字段的内容和\
  \ `SeekBar` 视图的当前设置。现在 activity 的任务是与 `Text Fragment` 通信，并传递这些值，以便 fragment 相应地更新\
  \ `TextView` 对象。\n\n### 31.8 让 Activity 与 Text Fragment 通信\n\n正如 An Introduction\
  \ to Android Fragments”(#Fragments.xhtml__idTextAnchor682) 中概述，activity 可以通过获取 fragment\
  \ 类实例的引用，然后调用对象上的公共方法来与 fragment 通信。因此，在 `TextFragment` 类中，我们现在将实现一个名为 `changeTextProperties()`\
  \ 的公共方法，该方法接受一个整数作为字体大小，以及一个字符串作为要显示的新文本。然后该方法将使用这些值来修改 `TextView` 对象。在 Android\
  \ Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \npublic class TextFragment extends Fragment {\n\n    public void changeTextProperties(int\
  \ fontsize, String text)\n    {\n        binding.textView2.setTextSize(fontsize);\n\
  \        binding.textView2.setText(text);\n    }\n}\n```\n\n当 `TextFragment` fragment\
  \ 被放置在 activity 的布局中，它被赋予了一个 ID `text_fragment`。使用此 ID，activity 现在可以获取 fragment\
  \ 实例的引用，并调用对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.java` 文件并如下修改 `onButtonClick()`\
  \ 方法：\n\n```java\npublic void onButtonClick(int fontsize, String text) {\n    TextFragment\
  \ textFragment =\n    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 31.9 测试应用程序\n\
  \n现在该项目的编码工作已完成，最后一个剩下的任务是运行应用程序。当应用程序启动时，主 activity 将启动并转而创建并显示两个 fragment。当用户触摸\
  \ toolbar fragment 中的按钮时，toolbar fragment 将调用 activity 的 `onButtonClick()` 方法，并传递\
  \ `EditText` 视图的文本和 `SeekBar` 的当前值。随后 activity 将调用第二个 fragment 的 `changeTextProperties()`\
  \ 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![\n\n图 31-10\n\n### 31.10 总结\n\n本章的目标是创建一个示例项目，专门用于演示在\
  \ Android 应用程序中使用 fragment 所涉及的步骤。涵盖的主题包括使用 Android Support Library 以兼容引入 fragment\
  \ 之前的 Android 版本，在 activity 布局中包含 fragment，以及 fragment 间通信的实现。\n\n### 32 结合 Jetpack\
  \ 的现代 Android 应用程序架构\n\n\n\n本章的目标是创建一个示例项目，专门用于演示在 Android 应用程序中使用 fragment 所涉及的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容引入 fragment 之前的 Android 版本，在 activity 布局中包含 fragment，以及\
  \ fragment 间通信的实现。\n\n结合 Jetpack 的现代 Android 应用程序架构\n\n多年 years 多年来，Google 并没有推荐特定的构建应用方法，而是提供工具和开发工具包，让开发者自行决定什么方法对特定项目是有效的。这种情况在\
  \ 2017 年随着架构组件的引入而发生了变化，这些组件在 2018 年发布时成为了 Jetpack 的一部分。\n\n本章的目的是提供 Jetpack 概念、应用架构建议以及一些架构组件的概述。在涵盖基础知识后，将对这些主题进行详细介绍。\n\
  \n#### 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、架构组件和 Android\
  \ Support Library 以及一组建议应用 应该如何结构的指南组成。Android 架构组件的设计是为了在开发应用时更快、更容易地执行常见任务，同时符合关键指南。\n\
  \n虽然本书将涵盖所有的 Android 架构组件，但本章的目标是介绍关键的架构指南以及。\n\n在强调这些年来受欢迎的其他技术的某些缺点时，Google 并没有完全谴责那些应用开发方法。\n\
  \n在继续之前，理解 Jetpack 应用开发方法并非强制性的是重要的。在强调某些缺点……\n\nGoogle 似乎采取了这样的立场：虽然开发应用没有对错之分，但有一种的方法。\n\
  \n#### 32.2 “旧”架构\n\n在名为“在 Android Studio 中创建示例 Android 应用”(#Sample_App.xhtml__idTextAnchor041)的章节中创建了一个由单个\
  \ activity 组成的 Android 项目，包含了呈现和管理用户界面的所有代码以及应用的后端逻辑。在引入 Jetpack 之前，最常见的架构遵循这种范式，应用由多个\
  \ activity（应用中的每个屏幕一个）组成，每个 activity 类在某种程度上都混合了用户界面和后端代码。\n\n这种方法导致了与应用周期相关的一系列问题（例如，用户每次旋转设备时\
  \ activity 被销毁并重建，导致未保存到某种持久化存储的应用数据丢失），以及诸如为访问的每个应用屏幕启动新 activity 的无效导航问题。\n\n\
  #### 32.3 现代 Android 架构\n\n在最基础层面，Google 现在提倡单 activity 应用，不同的屏幕在同一个 activity 中加载内容。\n\
  \n现代架构指南还建议将应用内的不同职责划分到完全独立的模块中（一个被称为“关注点分离”的概念）。这种方法的关键之一是 `ViewModel` 组件。\n\n\
  #### 32.4 ViewModel 组件\n\n\n\n\n\n`ViewModel` 的作用是将应用中与用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码分离离开。按照这种方式设计时，应用将由一个或多个\
  \ UI 控制器（例如 `activity`）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n实际上，`ViewModel` 仅知道数据模型和相应的逻辑。它对用户界面一无所知，并且不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供。同样，当用户在用户界面内的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用的生命周期内被重建多少次，`ViewModel` 实例都会保留在内存中，从而保持数据的一致性。例如，`activity`\
  \ 使用的 `ViewModel` 将一直保留在内存中，直到该 `activity` 完全结束；在单 Activity 应用中，这意味着直到应用程序退出才会结束。\n\
  \n![](img/jetpack_diagram_1.jpg)\n图 32-1\n\n#### 32.5 LiveData 组件\n\n考虑一个显示实时数据（如金融股票当前价格）的应用。该应用可能会使用某种形式的股票价格网络服务，持续用最新信息更新\
  \ `ViewModel` 中的数据模型。显然，除非及时向用户显示这些数据，否则这些实时数据几乎毫无用处。UI 控制器只有两种方式可以确保在用户界面中显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel` 以判断数据自上次显示以来是否发生了变化。然而，这种方法的问题在于效率低下。为了维持数据馈送的实时性，UI 控制器必须在循环中运行，不断检查数据是否变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 中的特定数据项变化时接收通知。这通过使用 `LiveData` 组件实现。`LiveData`\
  \ 是一个数据持有者，它允许一个值变为可观察的。简单来说，可观察对象具有在对其数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel`\
  \ 中的数据匹配的问题。\n\n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，观察者会在该值变化时反过来接收通知。在我们假设的应用中，例如，股票价格将被封装在\
  \ `ViewModel` 中的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时要调用的方法。该方法在数据变化触发时，将从\
  \ `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n图 32-2\n\n\
  `LiveData` 实例也可以被声明为可变的，允许观察实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在\
  \ `ViewModel` 中的值的值。\n\n使用 `LiveData` 的另一个关键优势是它感知其观察者的生命周期状态。例如，如果一个 `activity`\
  \ 包含一个 `LiveData` 观察者，相应的 `LiveData` 对象将知道 `activity` 生命周期状态何时何时变化并做出相应响应。如果 `activity`\
  \ 暂停（可能是应用被置于后台），`LiveData` 对象将停止向观察者发送事件。如果 `activity` 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个\
  \ `LiveData` 事件，以便 `activity` 拥有最新的值。同样，`LiveData` 实例将知道 activity 已销毁并移除观察者以释放资源。\n\
  \n到目前为止，我们只讨论了 UI 控制器使用观察者。但在实践中，观察者可以在任何符合 Jetpack 生命周期管理方法的对象内部使用。\n\n#### 32.6\
  \ ViewModel 状态保存\n\nAndroid 允许用户将活跃的应用置于后台，并在在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源低缺时，操作系统将通过终止后台应用进程来纠正这一问题，从最久未使用的应用开始。然而，当用户返回被销毁的后台应用时，它应该处于与置于后台时相同的状态，无论它是否曾被销毁。在与\
  \ `ViewModel` 相关的数据方面，这可以通过 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在系统启动的进程终止时恢复，该主题将在本章节后续标题为\
  \ “Android ViewModel 保存状态教程” 的章节中介绍。\n\n#### 32.7 LiveData 和数据绑定\n\nAndroid Jetpack\
  \ 包含了数据绑定库（Data Binding Library），它允许 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在早先创建的\
  \ AndroidSample 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许直接在\
  \ XML 布局文件中引用引用存储在 `ViewModel` 中的 `LiveData` 值，避免了编写代码来保持布局视图更新的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  图 32-3\n\n数据绑定将在标题为 “Android Jetpack 数据绑定概述” 的章节开始进行更详细的介绍。\n\n#### 32.8 Android\
  \ 生命周期\n\n从 Android 组件创建到其销毁为止的时间被称为生命周期。在生命周期期间，组件会在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，一个\
  \ `activity` 将从初始化状态开始，过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，从那里开始循环包括创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android 框架类和组件允许其他对象访问其当前状态。生命周期观察者也可以被使用，以便在另一个对象的生命周期状态变化时接收通知。这是 `ViewModel`\
  \ 组件在后台使用的技术，用于识别观察者何时重启或被销毁。这种功能不仅限于 Android 框架和架构组件，也可以使用架构组件包含的一组生命周期组件构建到任何其他类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命周期感知（lifecycle-aware），而提供其生命周期状态的对象被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为\
  \ “使用 Android 生命周期感知组件” 的章节中进行更详细的介绍。\n\n#### 32.9 仓库模块\n\n\n\n\n\n如果一个 `ViewModel`\
  \ 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与 `ViewModel` 类分离开是非常重要的。毕竟，如果不这样做将违反关注点分离的原则。为了避免将此功能与\
  \ `ViewModel` 混合，Google 的架构指南建议将这些代码放置在独立的 `Repository`（仓库）模块中。\n\n仓库（Repository）并不是\
  \ Android 架构组件，而是由应用开发者创建的 `Java` 类，负责与各种数据源建立接口。该类随后为 `ViewModel` 提供一个接口，允许数据存储在模型中。\n\
  \n![](img/Jetpack_diagram_4.jpg)\n\n图 32-4\n\n#### 32.10 总结\n\n直直到最近，Google 倾向于不推荐任何构建\
  \ Android 应用的特定方法。随着 Android Jetpack 的推出，情况现在发生了变化。Android Jetpack 包含了一套工具、组件、库和架构指南。Google\
  \ 现在建议将应用项目划分为不同的模块，每个模块负责一个特定的功能区域，即所谓的“关注点分离”。\n\n特别是，指南建议将应用的视图数据模型与负责处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集数据的代码应该构建在独立的仓库模块中，而不是与视图模型捆绑。\n\
  \nAndroid Jetpack 包含了 Android 架构组件，这些组件专门设计用于更容易开发符合推荐指南的应用程序。本章介绍了 `ViewModel`、`LiveData`\
  \ 和 `Lifecycle` 组件。这些将从下一章开始进行更详细的介绍。本章未提到的其他架构组件将在书中后部分介绍。\n\n## 33. Android ViewModel\
  \ 教程\n\n上一章引入了 Android Jetpack 的基本概念，并概述了现代 Android 应用架构的基础。Jetpack 定义了一系列建议，描述了\
  \ Android 应用项目应该如何构建，同时提供了一系列库和组件，使用户更容易符合这些指南，其目标是用更少的代码和更少的错误开发出可靠的应用。\n\n为了帮助强化和澄清上一章提供的信息，本章将逐步演示创建一个使用\
  \ `ViewModel` 组件的示例应用项目。该示例将在下一章中通过包含 `LiveData` 和数据绑定（data binding）支持来进一步增强。\n\n\
  ### 33.1 关于项目\n\n在名为在 Android Studio 中创建示例 Android 应用的章节中，创建了一个名为 `AndroidSample`\
  \ 的项目，应用的所有代码都捆绑在主 `Activity` 类文件中。在随后的章节中，创建并使用了 `AVD` 模拟器来运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时发生的问题：当\
  \ `TextView` 组件上显示的数据在设备旋转期间丢失了。\n\n本章将实现同一个货币转换器应用，这次将使用 `ViewModel` 组件并遵循 Google\
  \ 应用架构指南，以避免 `Activity` 生命周期复杂性。\n\n### 33.2 创建 ViewModel 示例项目\n\n在创建 `AndroidSample`\
  \ 项目时，选择了 `Empty Views Activity` 模板作为项目基础。然而，对于此项目，将使用 `Basic Views Template` 模板。\n\
  \n从欢迎界面选择 `New Project`选项，在生成的各种项目对话框中，点击 `Next` 按钮之前，选择 `Basic Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo` 并指定 `com.ebookfrenzy.viewmodeldemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API` 级别设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n### 33.3 不需要的项目元素\n\n正如“Android Studio 布局编辑器工具指南`所示概述，`Basic\
  \ Views Activity` 模板包含了并非所有项目需要的特性。在将 `ViewModel` 添加到项目之前，我们首先需要按照如下移除导航功能、第二个内容片段和浮动操作按钮：\n\
  \n1. 在 Project 工具窗口中双击 `activity_main.xml` 布局文件，选择浮动操作按钮并按键盘删除 键从布局中移除该对象。\n\n2.\
  \ 编辑 `MainActivity.java` 文件并从 `onCreate` 方法中移除浮动操作按钮代码，如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    .\n    .\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAnchorView(R.id.fab)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n3. 在 Project 工具窗口中，导航并双击 `app ->\
  \ res -> navigation -> nav_graph.xml` 文件将其加载到导航编辑器中。\n\n4. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 条目，并按键盘删除 键将其从图中移除。\n\n5. 找到并删除 `SecondFragment.java` 和 `fragment_second.xml`\
  \ 文件。\n\n6. 最后一项任务是从 `FirstFragment` 类中移除一些代码，以便按钮在点击时不再导航到已不存在的第二个片段。编辑 `FirstFragment.java`\
  \ 文件并移除 `onViewCreated` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n### 33.4 设计片段布局\n\n下一步是设计片段的布局。首先，在 Project 工具窗口中找到 `fragment_first.xml`\
  \ 文件并双击它将其加载到布局编辑器。一旦布局加载，选择并删除现有的 `Button`、`TextView` 和 `ConstraintLayout` 组件。接下来，在\
  \ Component Tree 面板中的 `NestedScrollView` 实例上右键点击，并如图 33-1](#ViewModel_Tutorial.xhtml__idTextAnchor741)所示选择\
  \ `Convert NestedScrollView to ConstraintLayout` ，并在生成的对话框中接受默认设置：\n\n![](img/as_convert_nested_scrollview.jpg)\n\
  \n图 33-1\n\n选择转换后的 `ConstraintLayout` 组件并使用属性窗口将 `id` 改为 `constraintLayout`。\n\n\
  添加一个新的 `TextView`，将其放在布局中央并将 `id` 改为 `resultText`。接下来，从调色板拖入一个 `Number (Decimal)`\
  \ 视图并将其放在现有 `TextView` 之上。在布局中选中视图参考属性窗口并将 `id` 改为 `dollarText`。\n\n将一个 `Button`\
  \ 组件拖到布局中，使其位于 `TextView` 下方，并将文本属性更改为“Convert”。在按钮仍被选中时，将 `id` 属性改为 `convertButton`。此时，布局应如图\
  \ 33-2](#ViewModel_Tutorial.xhtml__idTextAnchor742)所示（注意这三个视图已使用垂直链进行约束）：\n\n![](img/as_view_model_demo_ui.jpg)\n\
  \n图 33-2\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n\n\n\n\n### 33.5 实现 View Model\n\
  \n在完成用户界面布局后，需要在 view model 中创建应用的数据模型。首先，在 Project（项目）工具窗口中找到 `com.ebookfrenzy.viewmodeldemo`\
  \ 条目，右键点击它并选择 `New -> Java Class` 菜单选项。将新类命名为 `MainViewModel` 并按下键盘回车键。编辑新类文件，使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n该类声明了变量，用于存储当前的美元字符串值以及转换后的金额，并并提供了\
  \ getter 和 setter 方法来访问这些数据值。当调用时，`setAmount()` 方法接收当前美元金额作为参数并将其存储在本地变量 `dollarText`\
  \ 中。该美元字符串值被转换为浮点数，乘以一个虚构的汇率，并将生成的欧元数值存储在 `result` 变量中。另一方面，`getResult()` 方法简单返回赋值给\
  \ `result` 变量的当前值。\n\n### 33.6 将 Fragment 与 View Model 关联\n\n显然，需要某种方式让 fragment\
  \ 获取到 `ViewModel` 的引用，以便能够访问模型并观察数据变化。`Fragment` 或 `Activity` 使用 `ViewModelProvider`\
  \ 类的实例来维护其数据数据所赖的 `ViewModels` 的引用。\n\n在 `Fragment` 内部使用 `ViewModelProvider` 类创建\
  \ `ViewModelProvider` 实例。当调用时，类初始化器将传入当前 `Fragment` 或 `Activity` 的引用，并返回如下 `ViewModelProvider`\
  \ 实例：\n\n```java\nViewModelProvider viewModelProvider = new ViewModelProvider(this);\n\
  ```\n\n一旦创建了 `ViewModelProvider` 实例，就可以使用索引值来请求特定的 `ViewModel` 类。提供程序随后将创建该 `ViewModel`\
  \ 类的新实例，或者返回一个现有实例，例如：\n\n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n\
  ```\n\n编辑 `FirstFragment.java` 文件并重写 `onCreate()` 方法以设置 `ViewModelProvider`：\n\n\
  ```java\n.\n.\nimport androidx.lifecycle.ViewModelProvider;\nimport androidx.annotation.Nullable;\n\
  .\n.\npublic class FirstFragment extends Fragment {\n    private MainViewModel viewModel;\n\
  .\n.\n  @Override\n    public void onCreate(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    }\n.\n.\n```\n\n由于现在可以访问模型视图，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n### 33.7 修改\
  \ Fragment\n\n现在需要更新 fragment 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要对用户界面布局中三个视图的引用，以便响应按钮点击、提取当前美元值并显示转换后的货币金额。\n\
  \n在标题为[在 Android Studio 中创建一个 Android 示例]的章节中，使用了 `Button` 控件的 `onClick` 属性来指定用户点击按钮时要调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 中的方法，而不能用于调用 `Fragment` 中的方法。为了克服这一局限性，我们需要向 `Fragment` 类添加一些代码，在按钮上设置\
  \ `onClick` 监听器。这可以在 `FirstFragment.java` 文件的 `onViewCreated()` 周期方法中实现，如下所示：\n\n\
  ```java\n.\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n.\n.\n  @Override\n    public void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n\n        });\n    }\n\
  .\n.\n}\n```\n\n添加监听器后，每当用户点击按钮时，`onClick()` 方法中的任何代码都会被调用。\n\n### 33.8 访问 ViewModel\
  \ 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的\
  \ `setAmount()` 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法并在 `TextView` 控件上显示转换后的值。\n\
  \n由于项目尚未未使用 `LiveData`，因此每次创建 `Fragment` 时，都有必要从 `ViewModel` 获取最新的结果值。\n\n留在 `FirstFragment.java`\
  \ 文件中，在 `onViewCreated()` 方法中按如下实现这些需求：\n\n```java\n.\n.\nimport java.util.Locale;\n\
  .\n.\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n         \
  \   viewModel.getResult()));\n        binding.convertButton.setOnClickListener(v\
  \ -> {\n            if (!binding.dollarText.getText().toString().equals(\"\")) {\n\
  \                viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n    \
  \                    binding.dollarText.getText().toString()));\n              \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n         \
  \               viewModel.getResult()));\n            } else {\n               \
  \ binding.resultText.setText(\"No Value\");\n            }\n        });\n}\n```\n\
  \n### 33.9 测试项目\n\n完成项目的此阶段后，在模拟器或物理设备上构建并运行应用，输入美元金额并点击转换按钮。转换后的金额应显示在 `TextView`\
  \ 上，这意味着 UI 控制器和 ViewModel 的重构是有效的。\n\n当运行原始 AndroidSample 应用时，旋转设备会导致显示在 `resultText`\
  \ TextView 控件上的值丢失。现在用 ViewModelDemo 应用重复此测试，并注意旋转后当前的欧元值仍然保留。这是因为当 `Fragment` 被销毁和重建时，`ViewModel`\
  \ 留在了内存中，并且每次 `Fragment` 启动时，`onViewCreated()` 方法都会使用 `ViewModel` 的结果数据值更新 `TextView`。\n\
  \n### 33.10 总结\n\n在本章中，我们回顾了书中之前创建的 AndroidSample 项目，并创建了符合 Android Jetpack 架构指南的项目版本。示例项目还展示了使用\
  \ ViewModel 将数据处理与用户界面相关的代码分离。\n\n\n\n\n\n本章将通过使用 `LiveData` 架构组件进一步增强应用设计。在本章为项目添加了\
  \ `LiveData` 支持后，接下来的章节（从“Android Jetpack Data Binding 概述”开始）将利用 Jetpack Data Binding\
  \ 库从项目中消除更大量的代码。\n\n## 34.1 LiveData - 回顾\n\nLiveData 之前在标题为使用 Jetpack 构建现代 Android\
  \ 应用架构的章节中介绍过。如前所述，`LiveData` 组件可以作为 ViewModel 内部数据值的包装器。一旦包含在 `LiveData` 实例中，这些变量就可以对应用内的其他对象变为可的（通常是\
  \ UI 控制器，如 `Activities` 和 `Fragments`）。这允许 UI 控制器在底层 `LiveData` 值发生变化时接收通知。通过创建\
  \ `Observer` 类的实例并定义 `onChange()` 方法来设置观察者，该方法会在 `LiveData` 值变化时被调用。一旦创建了 `Observer`\
  \ 实例，通过调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData` 对象上。\n\n可以使用 `MutableLiveData`\
  \ 类将 LiveData 实例声明为可变的，允许 `ViewModel` 和 UI 控制器对底层数据值进行更改。\n\n### 34.2 将 LiveData\
  \ 添加到 ViewModel\n\n启动 Android Studio，打开上一节创建的 `ViewModelDemo` 项目，并打开 `MainViewModel.java`\
  \ 文件，该文件目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n本章此阶段的目标是将\
  \ `result` 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改类，使其内容如下所示，注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport\
  \ androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\n\
  public class MainViewModel extends ViewModel {\n\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float\
  \ getResult()\n    {\n        return result;\n    }\n}\n```\n\n现在 `result` 变量已包含在可变的\
  \ `LiveData` 实例中，`setAmount()` 和 `getResult()` 方法都都需要修改。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为\
  \ `result` 变量赋值了。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法被声明为返回 `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后得到如下类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n\n    private static final Float rate = 0.74F;\n\n    private String dollarText\
  \ = \"\";\n\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n### 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在本例中，UI\
  \ 控制器是 `FirstFragment` 类。找到 `FirstFragment.java` 类（`app` -> `java` -> `<package\
  \ name>` -> `FirstFragment`），双击将其加载到编辑器中，并修改 `onViewCreated()` 方法以创建一个名为 `resultObserver`\
  \ 的新 `Observer`：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.Observer;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", viewModel.getResult()));\n    final Observer<Float> resultObserver = new\
  \ Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n}\n```\n\n`resultObserver` 实例声明了 `onChanged()`\
  \ 方法，该方法被调用时会接收当前值，然后将其转换为字符串并显示在 `resultText` 上。下一步是将观察者添加到 `LiveData` 对象中，可以通过调用\
  \ `ViewModel` 对象的 `getResult()` 方法获取其引用。由于更新 `resultText` 现在是 `onChanged()` 回调方法的职责，现在可以删除执行此任务的现有代码行：\n\
  \n```java\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\", viewModel.getResult()));\n\
  \    final Observer<Float> resultObserver = new Observer<Float>() {\n        @Override\n\
  \        public void onChanged(@Nullable Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n    viewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(v -> {\n      \
  \  if (!binding.dollarText.getText().toString().equals(\"\")) {\n            viewModel.setAmount(String.format(Locale.ENGLISH,\"\
  s\", binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", viewModel.getResult()));\n        } else {\n            binding.resultText.setText(\"\
  No Value\");\n        }\n    });\n}\n```\n\n编译并运行应用，在美元字段中输入一个值，点击转换按钮并验证转换后的欧元金额显示在\
  \ `TextView` 上。这证明了观察者收到了 `result` 值变化的通知，并调用了 `onChanged()` 方法来显示最新数据。\n\n在上述 `onViewCreated()`\
  \ 方法的实现中，注意每次调用该方法时显示当前结果的代码行已被删除。这最初是为了确保当 `Fragment` 因任何原因被重建时，显示的值不会丢失。由于 `LiveData`\
  \ 监控其观察者的生命周期状态，这一步不再需要。当 `LiveData` 检测到 UI 控制器已重建时，它会自动触发任何关联的观察者并提供最新数据。通过在 `TextView`\
  \ 对象显示欧元值时旋转设备来验证这一点，确认值不会丢失。\n\n\n\n\n\n在继续后续章节之前，请关闭项目，复制 `ViewModelDemo` 项目文件夹并将其保存为\
  \ `ViewModelDemo_LiveData`，以便稍后查看保存 ViewModel 状态时可以使用它。\n\n## 34.4 总结\n\n本章演示了如何使用\
  \ Android `LiveData` 组件来确保显示给用户的数据的数据始终与存储在 `ViewModel` 中的数据一致。这一相对简单的过程包括将 `ViewModel`\
  \ 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置一个订阅了该 `LiveData` 值的观察者。每当 `LiveData` 的值发生变化时，观察者就会收到通知，并调用\
  \ `onChanged()` 方法，传递更新后的值。\n\n为项目添加 `LiveData` 支持在很大程度上简化了项目设计。通过使用数据绑定库（Data Binding\
  \ Library），还可以实现额外且更重大的改进，相关细节将在下一章中介绍。\n\n## 35 Android Jetpack Data Binding 概述\n\
  \n在题为使用 Jetpack 构建现代 Android 应用架构章节章节，我们引入了 Android 数据绑定（Data Binding）的概念，并简要解释了如何使用它在无需编写代码的情况下，将用户界面布局中的视图直接连接到应用中其他对象的方法和数据。本章将提供更多关于数据绑定的细节，重点解释数据绑定如何在\
  \ Android Studio 项目中实现。下一章的教程（“Android Jetpack 数据绑定教程”）将提供一个数据绑定的实际操作范例。\n\n###\
  \ 35.1 数据绑定概述\n\n数据绑定支持由 Android Jetpack 数据绑定库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图与存储在应用代码中的数据（通常在\
  \ `ViewModel` 实例中）连接起来。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 组件）映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听器方法。\n\n数据绑定在结合 `LiveData` 组件使用时变得特别强大。例如，考虑绑定到 `ViewModel` 中 `LiveData`\
  \ 变量的 `EditText` 视图。通过这种连接，ViewModel 中数据值的任何变化将自动显示在 `EditText` 视图中；当使用双向绑定时，输入到\
  \ `EditText` 中的任何数据将自动用于更新 `LiveData` 值。可能最令人印象的是，这一切除了初始化绑定所需的代码之外，不需要额外的代码。\n\n\
  传统上，将交互式视图（如 `Button` 组件）连接到 UI 控制器中的方法需要开发者编写代码来实现监听器方法，以便在点击按钮时调用它。数据绑定使得这变得非常简单，只需在布局\
  \ XML 文件的 `Button` 中引用要调用的方法即可。\n\n### 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些元素涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然这初看起来看起来可能有些复杂，但分离开来，这些实际上是非常简单的步骤，一旦完成，在节省编码工作量方面是非常值得的。在本章的剩余部分，将详细介绍这些中的每一个元素。在涵盖这些基础知识后，下一章将通过一个详细的教程在实际操作中演示这些步骤。\n\
  \n#### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先配置为使用 Android 数据绑定库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，这只需要在模块级\
  \ `build.gradle` 文件（位于项目工具窗口 Gradle Scripts 下列出的 `build.gradle (Module: app)`）中添加几行即可。以下列出了启用了数据绑定的构建文件：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        dataBinding = true\n    }\n\
  }\n```\n\n#### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的界面通常包含在 XML 布局文件中。在这些布局文件中的视图利用数据绑定之前，必须先将布局文件转换为数据绑定布局文件。\n\
  \n正如书中前面提到的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。根视图总是采用布局容器的形式，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，如 `ViewModelDemo` 项目中的 `fragment_main.xml` 文件所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了使用数据绑定，布局层次结构必须有一个布局组件作为根，该组件反过来成为当前视图的父级。对于上述情况，需要对现有布局进行如下更改：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n#### 35.2.3 布局文件数据 元素\n\n数据绑定布局文件需要一种方法来声明要绑定项目中的类（例如 `ViewModel`\
  \ 或 UI 控制器）。声明这些类后，布局文件还需要一个变量以便在绑定表达式中引用这些实例。\n\n这是通过 `data` 元素实现的，示例所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  上面的数据元素声明了一个类型为 `MainViewModel` 的名为 `myViewModel` 的新变量（注意，在声明变量时必须声明 `MyViewModel`\
  \ 类的完整包名）。\n\n\n\n\ndata 元素也可以导入其他类，这些类可以在布局文件的其他绑定表达式中被引用。例如，如果你有一个类，在将值显示给用户之前需要对该值调用某个方法，则可以如下所示导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n#### 35.2.4 绑定类 (Binding Classes)\n\n对于绑定布局文件中 data 元素中引用的每个类，Android\
  \ Studio 会自动生成一个对应的绑定类。该类是 `AndroidDataBinding` 类的子类，并根据布局文件名使用单词大写字母和添加 `Binding`\
  \ 后缀进行命名。因此，名为 `fragment_main.xml` 的布局文件的绑定类将被命名为 `FragmentMainBinding`。该绑定类包含了布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍然需要编写代码来根据对应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过使用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“填充”（inflate）用户界面布局文件。这仅意味着代码打开布局文件、解析\
  \ XML 内存中创建并配置所有的视图对象。对于已有的 `Activity` 类，实现此目的的代码可以在 `onCreate()` 方法中找到，读取如下：\n\n\
  ```java\nsetContentView(R.layout.activity_main);\n```\n\n对于 `Fragment`，这发生在 `onCreateView()`\
  \ 方法中：\n\n```java\nreturn inflater.inflate(R.layout.fragment_main, container, false);\n\
  ```\n\n在 `Activity` 类中创建绑定类实例，只需要如下所示修改此初始化代码：\n\n```java\nActivityMainBinding binding;\n\
  binding = DataBindingUtil.setContentView(this, R.layout.activity_main, false);\n\
  ```\n\n对于 `Fragment`，代码读取如下：\n\n```java\nFragmentMainBinding binding;\nbinding =\
  \ DataBindingUtil.inflate(\n    inflater, R.layout.fragment_main, container, false);\n\
  binding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn view;\n\
  ```\n\n#### 35.2.5 数据绑定变量配置 (Data Binding Variable Configuration)\n\n如上述，数据绑定布局文件包含\
  \ data 元素，该元素包含变量元素，由变量名和要建立绑定的类类型。例如：\n\n```xml\n<data>\n    <variable\n      \
  \  name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要一个额外的步骤，将应用中使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该实例在上一章中已获取引用：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述 data 元素中的第二个变量以名为 `MainFragment` 的 `Fragment` 形式引用 UI\
  \ 控制器类。在这种情况下，UI 控制器（无论是 `Activity` 还是 `Fragment`）中的代码只需要如下赋值给变量：\n\n```java\nbinding.setVariable(uiController,\
  \ this);\n```\n\n#### 35.2.6 绑定表达式（单向）（Binding Expressions (One-Way)\n\n绑定表达式定义了特定视图与绑定对象交互的方式。例如，`Button`\
  \ 上的绑定表达式可能会声明响应点击时调用对象上的哪个方法。或者，绑定表达式可能会定义存储在 `ViewModel` 中的哪个数据值显示在 `TextView`\
  \ 中，以及如何呈现和格式化。\n\n绑定表达式使用声明式语言，允许在决定如何使用绑定数据时使用逻辑以及访问其他类和方法。表达式可以包含数学表达式、方法调用、字符串拼接、数组元素访问和比较操作。此外，默认导入所有标准\
  \ Java 库，因此 Java 中可以实现的许多功能也可以在绑定表达式中完成。正如讨论过的，data 元素也可以用于导入自定义类以为表达式添加更多功能。\n\n\
  绑定表达式以 `@` 符号开头，后跟包含在花括号 (`{}`) 中的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已分配给布局文件中名为\
  \ `viewModel` 的变量。如果此值被存储为 `String`，则 `TextView` 将如下：\n\n```xml\n<TextView\n   \
  \ android:id=\"@+id/resultText\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"@{viewModel.result}\"\
  \ />\n```\n\n在上面的 XML 中，`text` 属性被设置为存储在 result `LiveData` 中的值。然而，考虑一下结果在模型中存储为\
  \ `Float` 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。为了解决此类问题，绑定表达式可以使用标准 Java 类来完成转换所需的步骤：\n\
  \n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\n```\n\n在进行更改后运行应用时，需要注意\
  \ Android Studio 控制可能会出现以下警告：`warning: myViewModel.result.getValue() is a boxed\
  \ field but needs to be unboxed to execute String.valueOf(viewModel.result())`。\n\
  \n为了避免此消息，如下所示将冲突的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(viewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串后包含“dollars”单词，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(viewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串被双引号包裹，因此表达式现在使用单引号封装以避免语法错误。\n\n表达式语法还允许声明三元语句。在下面的表达式中，视图将结果值是否大于\
  \ 10 显示不同的文本：\n\n```xml\n@{viewModel.result > 10 ? \"Out of range\" : \"In range\"\
  }\n```\n\n表达式也可以被构造以访问数据数组中的特定元素：\n\n```xml\n@{viewModel.resultsArray[3]}\n```\n\
  \n### 35.2.7 绑定表达式（双向）（Binding Expressions (Two-Way)）\n\n\n\n\n\n目前涵盖的表达式类型被称为单向绑定。换句话说，布局会随着相应值的变化而不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，可以将 `EditText` 视图配置为双向绑定，这样当用户输入不同的值时，该值将用于更新相应的数据模型值。声明双向表达式时，语法与单向表达式相似，不同在于它以\
  \ `@=` 开。例如：\n\n```\nandroid:text=\"@={myViewModel.result}\"\n```\n\n#### 35.2.8\
  \ 事件和监听器绑定\n\n绑定表达式还可以用于响应视图上的事件来触发方法调用。例如，`Button` 视图可以配置为在点击时调用某个方法。在标题为在 Android\
  \ Studio 中创建一个 Android 示例应用的章节中，例如按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，其表示如下：\n\n```\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法按照以下行进行声明：\n\n```java\npublic void convertCurrency(View view) {\n\n.\n\n.\n\
  }\n```\n\n注意，这种类型的方法调用始终会被传递事件发生视图的引用。在数据绑定中，可以使用以下表达式相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n另一个选项（提供了向方法传递参数的能力）被称为监听器绑定。以下表达式使用这种方法在同一个\
  \ `viewModel` 实例上调用无参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n\
  ```\n\n以下表达式调用了一个需要三个参数的方法：\n\n```\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result,\
  \ 10, \"A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，用于将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要学习更多关于绑定表达式的知识，请查看\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一个系统，用于用户界面布局中的视图与应用架构内其他对象的数据和方法之间建立连接，无需编写代码。完成某些初始配置步骤后，数据绑定仅涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的或双向的，并且还可以用于绑定在响应用户界面按钮点击等事件时调用的方法。\n\
  \n## 36. Android Jetpack 数据绑定教程\n\n到目前为止，我们在书中已经涵盖了现代 Android 应用架构的基本概念，并详细查看了 `ViewModel`\
  \ 和 `LiveData` 组件。数据绑定的概念在上一章中也已涵盖，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n### 36.1\
  \ 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目内到本章结束时不再需要的所有代码，来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `FirstFragment.java` 文件并按如下修改代码：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n.\n\n.\n\nimport android.arch.lifecycle.Observer;\n\
  \n.\n\n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n.\n\n.\n\n    @Override\n    public void onViewCreated(@NonNull View\
  \ view,\n                             @Nullable Bundle savedInstanceState) {\n \
  \       super.onViewCreated(view, savedInstanceState);\n        final Observer<Float>\
  \ resultObserver = new Observer<Float>() {\n            @Override\n            public\
  \ void onChanged(@Nullable final Float result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                                            \"%.2f\", result));\n            }\n\
  \        };\n        viewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.getText().equals(\"\
  \")) {\n                viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                                   binding.dollarText.getText()));\n        \
  \    } else {\n                binding.resultText.setText(\"No Value\");\n     \
  \       }\n        });\n    }\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按如下删除代码（同样注意\
  \ `dollarText` 到 `LiveData` 的转换）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\
  import android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate =0.7F;\n    final MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    final MutableLiveData<Float> result\
  \ = new MutableLiveData<>();\n    public void setAmount(String value) {\n      \
  \  this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText));\n\
  \    }\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在过程中添加一些额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n### 36.2 启用数据绑定\n\n\
  使用数据绑定的第一步是在 Android Studio 项目中启用它。这需要在 Gradle Scripts -> `build.gradle` 文件中添加新属性。\n\
  \n在 `build.gradle` 文件中添加以下元素以在项目中启用数据绑定：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n\nandroid {\n...\n    buildFeatures {\n        viewBinding true\n        dataBinding\
  \ true\n    }\n.\n}\n```\n\n添加该条目后，编辑器顶部会出现一个包含 `Sync Now` 链接的栏。点击它根据新的构建配置同步项目。\n\
  \n### 36.3 添加布局元素\n\n正如 Android Jetpack 数据绑定概览所示，为了能够使用数据绑定，布局层次必须有一个布局组件作为根视图。这需要对\
  \ `fragment_first.xml` 布局文件（app -> res -> layout -> fragment_first.xml）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ Code 模式并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\n\n\
  \n\n```xml\n        </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n\
  ```\n\n完成这些更改后，切换回设计（Design）模式，注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 36-1 所示：\n\n![](img/as_view_model_demo_parent_layout.jpg)\n\
  \n图 36-1\n\n编译并运行应用，验证布局元素的添加没有以任何方式更改用户界面外观。在构建项目时，你可能会遇到包含部分内容的错误：\n\n```\norg.gradle.api.GradleException:\
  \ 'compileDebugJavaWithJavac' task (current target is 1.8) and 'kaptGenerateStubsDebugKotlin'\
  \ task (current target is 17)\n```\n\n由于 Android Studio 构建工具中的一个 bug，可以通过对 `build.gradle`\
  \ (Module: app) 文件进行以下更改来解决：\n\n```gradle\ncompileOptions {\n    sourceCompatibility\
  \ JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n}\n\n\
  kotlinOptions {\n    jvmTarget = '17'\n}\n```\n\n### 36.4 在布局文件中添加 data 元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加\
  \ `data` 元素。在本例中，布局将绑定到 `MainViewModel`，因此请编辑 `fragment_first.xml` 文件并如下所示添加 `data`\
  \ 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.viewmodeldemo.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n...\n</layout>\n```\n\n再次编译并运行应用，确保这些更改生效。\n\n### 36.5 使用绑定类\n\n下一步是修改 `FirstFragment.java`\
  \ 文件中的代码以膨胀（inflate）数据绑定。实现实现这一点的方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R;\n\npublic class MainFragment extends Fragment\
  \ {\n    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                                 @Nullable Bundle savedInstanceState)\
  \ {\n        binding = FragmentMainBinding.inflate(inflater, container, false);\n\
  \        binding = DataBindingUtil.inflate(\n                inflater, R.layout.fragment_first,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码简单地膨胀了 `fragment_first.xml` 布局文件（换句话说，创建了包含所有视图对象的布局），并返回根视图（顶层布局容器）的引用。数据绑定库包含一个工具类，它提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时，还会初始化并返回布局数据绑定类的实例。新代码调用此方法并将绑定类实例的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(\n\
  \            inflater, R.layout.fragment_first, container, false);\n```\n\n绑定对象只需要在\
  \ fragment 存在期间保留在内存中。为了确保在 fragment 消失时销毁实例，将当前 fragment 为生命周期所有者（lifecycle owner）。\n\
  \n```java\nbinding.lifecycleOwner = this;\nreturn binding.getRoot();\n```\n\n###\
  \ 36.6 将 ViewModel 实例赋值给数据绑定\n\n此时，数据绑定已经知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象。这需要额外的步骤，将应用内使用的 `MainViewModel` 实例赋值给布局文件中声明的 `viewModel`\
  \ 变量。如下所示在 `FirstFragment.java` 中的 `onViewCreated()` 方法中添加此代码：\n\n```java\nimport\
  \ static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\n@Override\npublic void\
  \ onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState) {\n   \
  \ super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ viewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 菜单重新构建项目以强制生成类。完成这些更改后，下一步开始向数据布局文件的视图中插入绑定表达式。\n\n### 36.7 添加绑定表达式\n\
  \n第一个绑定表达式将 `resultText` `TextView` 绑定到模型中的 `result` 值。编辑 `fragment_first.xml` 文件，找到\
  \ `resultText` 元素并修改 `text` 属性，使元素如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"TextView\"\n    android:text='@{safebox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safebox(myViewModel.result)) + \" euros\"\
  }'\n    app:layout_toBottomOf=\"parent\"\n    app:layout_constraintEnd=\"parent\"\
  \n    app:layout_constraintStart=\"parent\"\n    \n\napp:layout_constraintTop=\"\
  parent\" />\n```\n\n该表达式首先检查 `result` 值是否为 0，如果是，则提示输入值。然而，如果结果不为 0，则将值转换为字符串并拼接“euros”后显示给用户。`result`\
  \ 值只需要单向绑定，因为布局不需要更新 `ViewModel` 中的值。相反，`dollarValue` `EditText` 需要双向绑定，以便数据模型可以使用用户输入的最新值，并在生命周期事件（如设备旋转）时在视图中重新显示当前值。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart=\"\
  parent\"\n    app:layout_constraintTop=\"parent\" />\n```\n\n现在添加了这些初始绑定表达式，需要编写一个方法以便在用户点击\
  \ `Button` 组件时执行转换。\n\n### 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法进行转换计算，并将欧元值放入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic\
  \ class MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    final public MutableLiveData<Float> result = new MutableLiveData<>();\n   \
  \ public void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n\
  \            (!dollarValue.getValue().equals(\"\")) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\
  \ * usd_to_eu_rate);\n        } else {\n            result.setValue(0F);\n     \
  \   }\n    }\n}\n```\n\n\n\n\n\n注意，在没有有效的美元数值的情况下，结果变量 `LiveData` 将被赋值为零值。这确保了赋值给\
  \ `resultText` `TextView` 的绑定表达式在用户未输入任何值时，会显示“Enter value”（输入值）消息。\n\n### 36.9\
  \ 添加监听器绑定\n\n测试项目之前的最后一步是在布局文件中的 `Button` 元素中添加监听器绑定表达式，以便在点击按钮时调用 `convertValue()`\
  \ 方法。再次在代码模式下编辑 `fragment_first.xml` 文件，找到 `convertButton` 元素并如下所示添加 `onClick` 项：\n\
  \n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  @{() -> myViewModel.convertValue()}\"\n    android:text=\"@string/convert_text\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ### 36.10 测试应用\n\n编译并运行应用，测试在美元字段中输入数值并点击 Convert（转换）按钮后，`TextView` 是否会显示正确的结果（带有“euros”（欧元）后缀），以及在美元字段为空时尝试转换，是否会显示“Enter\
  \ value”提示。此外，验证用户界面中显示的信息在设备旋转后是否得以保留。\n\n### 36.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实用示例，展示了通过使用数据绑定结合\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接，可以节省多少代码编写。\n\n## 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保存与恢复在于，当应用被置于后台后，从外观和行为上为用户提供连续性。用户已经习惯了可以在不同应用之间切换，并在返回原始应用时，发现它正处于切换之前的完全相同的状态。\n\
  \n正如标题为 Understanding Android Application and Activity Lifecycles 的章节所述，当用户将应用置于后台时，如果资源受限，该应用可能会被操作系统终止。当用户尝试将已终止的应用返回前台时，Android\
  \ 会简单地在新进程中重新启动应用。由于这对用户来说是不可见的，因此应用有责任将自己恢复到最初置于后台时的相同状态，而不是以其“初始启动”状态呈现。对于基于 `ViewModel`\
  \ 的应用，这种行为大部分可以通过 `ViewModel` Saved State 模块来实现。\n\n### 37.1 理解 ViewModel 状态保存\n\
  \n正如前面的章节所述，`ViewModel` 为应用开发带来了许多好处，包括在设备旋转等配置更改时恢复 UI 状态。要查看其实效果，请运行 `ViewModelDemo`\
  \ 应用（如果你尚未创建项目，请从 Android Studio 加载随书籍示例代码下载的 `ViewModelDemo_LiveData` 项目）。\n\n\
  运行后，输入一个美元数值并将其转换为欧元。在显示美元和欧元数值的情况下，旋转设备或模拟器，并注意到一旦应用对方向变化做出响应，两个值仍然可见。\n\n遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍运行时，点击设备主页将\
  \ `ViewModelDemo` 应用置于后台，然后通过打开终端或命令提示符窗口并运行以下命令将其终止（其中 `<package name>` 是你创建项目时使用的名称，例如\
  \ `com.ebookfrenzy.viewmodeldemo`）：\n\n```\nadb shell am kill <package name>\n```\n\
  \n如果未找到 `adb` 命令，请参考标题为 Setting up an Android Studio Development Environment 的章节，了解设置\
  \ Android Studio 环境的步骤。\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要简单地在 Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动的一样，之前的美元和欧元数值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，本应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所预期的连续性。\n\n### 37.2 实现 ViewModel 状态保存\n\n`ViewModel` Saved State 库的引入使得基本的\
  \ ViewModel 状态保存成为可能。该库本质上扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重启期间维护状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持保存状态，需要声明一种不同的 `ViewModel` 子类，在这种情况下，它需要包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以通过创建时包含\
  \ `SavedStateHandle` 来创建此类类型的 ViewModel 实例。考虑以下标准 ViewModel 代码片段：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n}\n```\n\n创建此实例的代码可能如下所示：\n\n```\nprivate MainViewModel mViewModel;\n\
  mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n另一方面，设计用于支持状态保存的\
  \ ViewModel 子类需要如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  }\n```\n\n创建上述 ViewModel 实例时，必须向 `ViewModelProvider` 类初始化器传递一个 `SavedStateFactory`\
  \ 实例，如下：\n\n```\nSavedStateViewModelFactory factory = new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  // 注意此处应使用 factory 创建 ViewModel\n```\n\n### 37.3 保存和恢复状态\n\n可以通过将对象或值传递给 `SavedStateHandle`\
  \ 实例的 `set()` 方法从 ViewModel 保存，并提供在执行检索时引用的键字符串：\n\n```java\nprivate static final\
  \ String NAME_KEY = \"Customer Name\";\nsavedStateHandle.set(NAME_KEY, customerName);\n\
  ```\n\n在使用 `LiveData` 对象时，可以使用 `SavedStateHandle` 实例的 `getLiveData()` 方法恢复之前保存的值，再次引用相应的键：\n\
  \n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n\n\n\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回一个布尔值，表示保存的状态中是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回一个包含保存状态中所有键的字符串集合（Set）。\n\n###\
  \ 37.4 为 ViewModelDemo 项目添加保存状态支持\n\n在掌握了 ViewModel 保存状态的节点知识后，可以扩展 `ViewModelDemo`\
  \ 应用程序以包含此项支持。首先，将在 Android Jetpack LiveData 教程中创建的 `ViewModelDemo_LiveData` 项目加载到\
  \ Android Studio（示例代码下载中也有该项目的副本），打开 `build.gradle` (Module :app) 文件并添加 Saved State\
  \ 库依赖（像往常一样，检查是否有更新版本的库）：\n\n```\ndependencies {\n    implementation 'androidx.savedstate:savedstate:1.2.1'\n\
  \    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.1}\n\
  }\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接收并存储 `SavedStateHandle` 实例。同时，导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明键字符串常量，并修改结果 `LiveData` 变量，以便现在从构造函数中的保存的状态中获取值：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n\n    final private SavedStateHandle savedStateHandle;\n\
  \    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public MainViewModel(SavedStateHandle savedStateHandle) {\n        this.savedStateHandle\
  \ = savedStateHandle;\n        result = savedStateHandle.getLiveData(RESULT_KEY);\n\
  \    }\n}\n```\n\n继续留在 `MainViewModel.java` 文件中，修改 `setAmount()` 方法，以便在每次计算新的欧元金额时都包含保存结果值的代码：\n\
  \n```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n\
  \    result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 `ViewModel`\
  \ 的更改后，打开 `FirstFragment.java` 文件并进行以下更改，以便在 ViewModel 创建过程中包含一个 Saved State 工厂实例：\n\
  \n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n            new SavedStateViewModelFactory(\n\
  \                getActivity().getApplication(),this);\n    mViewModel = new ViewModelProvider(this,\
  \ factory).get(MainViewModel.class);\n    // TODO: Use the ViewModel\n}\n```\n\n\
  注意，上述代码中对 `ViewModelProvider` 调用的更改可能会导致 Android Studio 生成以下语法错误：\n\n`Cannot resolve\
  \ constructor 'ViewModelProvider(FirstFragment, SavedStateViewModelFactory)'`\n\n\
  此语法错误是错误的，可以忽略。应用程序仍然可以成功编译并运行。\n\n完成更改后，构建并运行应用程序并执行货币转换。注意，构建可能会出现以下错误：\n\n`Duplicate\
  \ class kotlin.collections.jdk8.CollectionsJDK8Kt found in modules jetified-kotlin-stdlib-1.8.0`\n\
  \n要纠正此错误，编辑 `build.gradle` (Module: app) 文件，添加以下依赖，并同步且重建项目：\n\n```\ndependencies\
  \ {\n    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.0'))\n}\n\
  ```\n\n当屏幕 UI 显示了美元和欧元值后，将应用程序置于后台，使用 `adb` 工具终止它，然后从设备或模拟器屏幕重新启动它。重启后，之前的货币金额应该仍然显示在\
  \ `TextView` 和 `EditText` 组件中，这证实状态已成功保存并恢复。\n\n### 37.5 总结\n\n设计良好的应用程序在从后台恢复时，应该始终向用户呈现相同的状态，无论在此期间包含应用程序的进程是否被操作系统终止。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel` 保存状态模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接收 `SavedStateHandle`\
  \ 实例。一旦实现了这些步骤，应用程序将在后台被终止期间自动保存和恢复状态。\n\n## 38 与生命周期感知组件一起工作\n\n早之前标题为理解应用程序和 Activity\
  \ 生命周期的章节描述了使用生命周期方法来跟踪生命周期状态。这些方法的主要问题之一是它们将处理更改的负担转嫁给了 UI 控制器。从表面上看，这似乎是逻辑上的方法，因为\
  \ UI 控制器毕竟是经历状态变化的对象。然而，事实是，通常受变化影响的代码始终位于应用程序中的其他类中。这导致 UI 控制器中出现了复杂的代码，需要响应变化来管理其他对象。显然，在遵循\
  \ Android 指南时，这是应该尽量避免的情况。\n\n一种更清晰且符合逻辑的方法是让应用程序中的对象能够观察其他对象的生命周期，并负责根据变化采取任何操作。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期，并在进入暂停状态时挂位置更新。当控制器进入恢复状态时，重新开始跟踪。这通过 Android 架构组件包中提供的 `Lifecycle`\
  \ 类和接口得以实现。\n\n本章将介绍为 Android 应用程序构建生命周期感知所需的术语和关键组件。\n\n### 38.1 生命周期感知\n\n如果一个对象能够检测并响应应用程序内其他对象生命周期状态的变化，则认为该对象是生命感知的。某些\
  \ Android 组件已经是生命感知的。也可以通过通过类实现 `LifecycleObserver` 接口将任何类配置为生命感知。\n\n### 38.2 生命周期所有者\n\
  \n生命周期感知组件只能观察作为生命所有者的对象。生命所有者实现 `LifecycleOwner` 接口，并分配一个相应的 `Lifecycle` 对象，该对象负责存储组件的状态并向生命周期观察者提供状态信息。大多数\
  \ Android Framework 组件（如 activity 和 fragment 类）都是生命所有者。自定义类也可以通过使用 `LifecycleRegistry`\
  \ 类并实现 `LifecycleObserver` 接口来配置为生命所有者。例如：\n\n```java\npublic class SampleOwner\
  \ implements LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n}\n```\n\
  \n\n\n\n\n```java\nsuper.onCreate(savedInstanceState);\n\nlifecycleRegistry = new\
  \ LifecycleRegistry(this);\n\n}\n\n@NonNull\n@Override\npublic Lifecycle getLifecycle()\
  \ {\n    return lifecycleRegistry;\n}\n}\n```\n\n除非生命周期所有者（lifecycle owner）是另一个生命感知组件的子类，否则该类需要通过调用\
  \ `LifecycleRegistry` 类的方法来触发生命周期状态的变化。可以使用 `markState()` 方法传递新的状态值来触发生命周期状态变化：\n\
  \n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用将导致调用相应的事件处理器。或者，也可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期周期观察者 (Lifecycle Observers)\n\n为了让生命感知组件能够观察生命周期所有者的状态，它必须实现\
  \ `DefaultLifecycleObserver` 接口，并重写它需要观察的任何生命周期变化事件的方法。\n\n```java\npublic class\
  \ SampleObserver implements DefaultLifecycleObserver {\n    // 生命周期事件方法的重写写在这里\n\
  }\n```\n\n随后会创建此观察者类的实例，并将其添加到由 `Lifecycle` 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new\
  \ SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，也可以在任何时候从 `Lifecycle` 对象中移除。\n\n\
  图 38-1 描述了提供生命周期感知能力的关键元素之间的关系：\n\n![](img/lifecycle_component_diagram.jpg)\n\n\
  图 38-1\n\n## 38.4 生命周期周期状态与事件 (Lifecycle States and Events)\n\n当生命周期所有者的状态发生变化时，分配的\
  \ `Lifecycle` 对象将更新为新状态。在任何时刻，生命周期所有者都处于以下五种状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n\
  - `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n\
  - `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle` 对象将对已添加到列表的任何观察者触发事件。在生命周期观察者内部，可以重写以下事件方法方法：\n\
  \n- `onCreate()`\n- `onResume()`\n- `onPause()`\n- `onStop()`\n- `onStart()`\n-\
  \ `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()` 方法：\n\n```java\n\
  @Override\npublic void onResume(@NonNull LifecycleOwner owner) {\n    // 执行响应 Resume\
  \ 状态事件的任务\n}\n```\n\n在图 38-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每次状态转换之间将会在观察者上触发的生命周期事件：\n\
  \n![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n## 38.5 总结 (Summary)\n\
  \n本章介绍了生命周期感知的基础知识，以及包含在 Android Jetpack 中的 Android `Lifecycle` 包的类和接口。该包包含许多用于创建生命周期所有者、生命周期观察者和生命感知组件的类和接口。生命周期所有者被分配了一个\
  \ `Lifecycle` 对象，该对象维护所有者的状态记录以及订阅观察者列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便其做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命感知组件，包括生命周期观察者和所有者的创建，以及对生命周期状态变化和事件的处理。\n\
  \n## 39. Android Jetpack 生命周期周期感知教程\n\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目内实现此点的关键类和接口。本章将在此知识库的基础上，构建一个\
  \ Android Studio 项目，旨在突出实际运行中的生命周期感知。\n\n### 39.1 创建示例生命周期项目\n\n从欢迎界面选择 `New Project`（新建项目）快速启动选项，在生成的新项目对话框中，点击\
  \ `Next`（下一步）之前选择 `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `LifecycleDemo`\
  \ 并指定 `com.ebookfrenzy.lifecycledemo` 为包名。在点击 `Finish`（完成）之前，将 `Minimum API level`（最低\
  \ API 级别）设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n###\
  \ 39.2 创建生命周期观察者\n\n如前所述，Activity 和 Fragment 已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainActivity` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，并在生成的菜单中选择\
  \ `New` -> `Java Class...`。在 `New Class` 对话框中，将类命名为 `DemoObserver` 并按键盘 `Return`\
  \ 创建 `DemoObserver.java` 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \npublic class DemoObserver {\n\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `DefaultLifecycleObserver`\
  \ 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n```\n\n下一步是重写\
  \ `DefaultLifecycleObserver` 类的方法。对于本示例而言，所有事件都将被处理，并在 `Logcat` 面板中输出事件类型。按照以下方式更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n    private String\
  \ LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n### 39.3 添加观察者\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainActivity`\
  \ 类中。\n\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法进行添加，该对象的引用通过调用 `getLifecycle()`\
  \ 方法获取。编辑 `MainActivity.java` 类文件并编辑 `onCreate()` 方法以添加观察者：\n\n```java\n...\nimport\
  \ com.ebookfrenzy.lifecycledemo.DemoObserver;\n...\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    getLifecycle().addObserver(new DemoObserver());\n}\n\
  ```\n\n创建观察者类并添加到生命周期所有者后，应用程序已准备好进行测试。\n\n\n\n\n\n由于 `DemoObserver` 类会将诊断信息输出到\
  \ `Logcat` 控制台，因此如果配置过滤器仅显示 `DemoObserver` 消息，将更容易看到输出。请按照之前在“通过示例说明 Android Activity\
  \ 状态变化”中列出的步骤，显示 Logcat 面板并在过滤器字段中输入以下键：\n\n```\npackage:mine tag:DemoObserver\n\
  ```\n\n应用成功启动后，Logcat 输出应指示以下生命周期状态变化和事件：\n\n- `onCreate`\n- `onStart`\n- `onResume`\n\
  \n在应用保持运行的同时，执行设备旋转以触发 activity 的销毁和重建，生成以下额外的输出：\n\n- `onPause`\n- `onStop`\n-\
  \ `onDestroy`\n- `onCreate`\n- `onStart`\n- `onResume`\n\n在移动到本章的下一节之前，请花些时间将应用的输出与上一章中图\
  \ 38-2 的流程图进行对比。\n\n## 39.5 创建生命周期 Owner\n\n本章的最后一个任务是创建一个自定义的生命周期 owner 类，并演示如何在该类内部触发事件并修改生命周期状态。\n\
  \n在 Project 工具窗口中，右键点击应用 -> `java` -> `com.ebookfrenzy.lifecycledemo` 项，并选择 `New\
  \ -> Java Class...` 菜单选项添加新类。在 `Create Class` 对话框中将类命名为 `DemoOwner`，然后按 Return 键。加载新的\
  \ `DemoOwner.java` 文件到代码编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.Lifecycle;\n\nimport androidx.lifecycle.LifecycleOwner;\n\
  \nimport androidx.lifecycle.LifecycleRegistry;\n\nimport androidx.annotation.NonNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量来存储\
  \ `LifecycleRegistry` 引用，一个构造函数来初始化 `LifecycleRegistry` 实例并添加 `getLifecycle()` 方法：\n\
  \n```java\npublic class DemoOwner implements LifecycleOwner {\n\n    private final\
  \ LifecycleRegistry lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，该类需要向注册表通知生命周期状态的变化。这可以通过 `LifecycleRegistry` 对象的 `markState()` 方法标记状态，也可以通过\
  \ `handleLifecycleEvent()` 方法触发生命周期事件来实现。在自定义类中，什么构成状态变化取决于类的用途。在本示例中，我们将添加一些方法，在调用它们时只需触发生命周期事件：\n\
  \n```java\n...\nprivate final LifecycleRegistry lifecycleRegistry;\n...\n    public\
  \ void startOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  \    }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n...\n```\n\n`DemoOwner` 类中的最后一个更改是将 `DemoObserver`\
  \ 类作为观察者添加。此调用通过向类中添加以下构造函数来实现：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainActivity.java` 文件加载到代码编辑器，找到 `onCreate()` 方法并添加代码创建 `DemoOwner`\
  \ 类实例，并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然单个观察者可以用于多个\
  \ owner，但在这种情况下移除是为了避免在 Logcat 工具窗口中产生重复且混淆的输出：\n\n```java\n...\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  ...\nprivate DemoOwner demoOwner;\n...\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n## 39.6 测试自定义的生命周期 Owner\n\n最后一次构建并运行应用，参考 Logcat 工具窗口并确认观察者按以下顺序检测到创建、启动和停止生命周期事件：\n\
  \n- `onCreate`\n- `onStart`\n- `onStop`\n\n注意，尽管没有在 `DemoOwner` 中添加代码来手动执行此操作，“已创建”状态变化仍然被触发了。\n\
  \n### 39.7 总结\n\n本章提供了在 Android 应用中实现生命周期感知所需步骤的实用演示。这包括生命周期观察者的创建以及生命周期 owner 设计和实现。\n\
  \n## 40. 导航组件（Navigation Component）概述\n\n如今极少有 Android 应用仅由单个屏幕组成。事实上，大多数应用由多个屏幕组成，用户在这些屏幕之间进行导航。在\
  \ Android Jetpack 引入之前，应用内导航的实现很大程度上是一个手动过程，没有简单的方法查看复杂的导航路径。然而，随着支持 Android Studio\
  \ 中导航图的导航架构的引入，这种情况得到了改善。\n\n### 40.1 理解导航\n\n每个应用都有一个主屏幕，该屏幕在应用启动并在任何启动屏出现后显示（启动屏是应用加载时临时显示的品牌界面）。从这个主屏幕开始，用户通常会执行任务导致其他屏幕的出现。这些屏幕通常以其他\
  \ activity 和 fragment 的形式存在。例如，一个消息应用可能有一个列出当前消息的主屏幕，用户从那里导航到另一个屏幕访问联系人列表或设置屏幕。联系人列表反过来允许用户导航到可以添加新用户或更新现有联系人的其他屏幕。在图中，应用的导航图可以像图\
  \ 40-1 所示表示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为目的地，通常是一个\
  \ fragment 或 activity。Android 导航架构使用导航栈（navigation stack）跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个放入栈的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入主目的地之上。当用户导航到其他屏幕时，它们也会推入栈。例如，图\
  \ 40-2 显示了假设消息应用在用户启动应用并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n\n\n\n当用户使用系统返回键导航回之前的屏幕时，每个目标都会从栈中弹出，直到主屏幕再次成为栈上的唯一目标。在图 40-3 中，用户从“添加联系人”屏幕导航了回来，这使得该屏幕从栈中弹出，并使“联系人列表”屏幕成为当前目标：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间进行导航和管理导航栈的所有工作都由导航控制器处理，该控制器由\
  \ `NavController` 类表示。\n\n使用 Navigation 架构组件向 Android 项目添加导航是一个简单的过程，涉及导航宿主、导航图、导航动作以及少量的代码编写，以获取导航控制器实例的引用并与其交互。\n\
  \n## 40.2 声明导航宿主\n\n导航宿主仅仅是一个特殊的 fragment（`NavHostFragment`），它被嵌入到 activity 的用户界面布局中，作为用户将要导航的目的地的占位符。例如，图\
  \ 40-4 显示了一个典型的 activity 屏幕，并突出了由导航宿主 fragment 表示的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\
  \n图 40-4\n\n可以通过 Android Studio 布局编辑器从调色板的“容器”（Containers）部分拖放实例，将 `NavHostFragment`\
  \ 放置到 activity 布局中，或者通过如下手动编辑 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿主 fragment 元素中的注意事项是：`name` 属性对 `NavHostFragment`\
  \ 的引用、将 `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity\
  \ 启动时，此导航宿主 fragment 将被导航图中指定的首页替换。当用户在应用屏幕间导航时，宿主 fragment 将被对应目的地的 fragment 替换。\n\
  \n### 40.3 导航图\n\n导航图是一个 XML 文件，包含了应用导航中包含的目的地。除了这些目的地外，该文件还包含了定义目的地之间导航的导航动作，以及从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用它通过可视化或手动编辑 XML 来设计图并实现动作。\n\n图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表 (A)\
  \ 提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中的对应目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的对话框，显示了用户界面布局的表示。在此示例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。通过将鼠标指针悬停在起点边缘直到出现一个圆圈，然后从圆圈点击并拖动到目的地来添加动作。属性面板\
  \ (D) 允许查看和修改当前选中目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项来添加新目的地。可以选择添加现有的\
  \ fragment 或 activity 作为目的地，或创建新的空白 fragment 目的地。组件树面板 (F) 提供了导航图的层级概览。\n\n可以通过将编辑器切换到代码模式来查看和修改导航图的底层\
  \ XML。以下 XML 列表代表了上方图 40-5 中所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n</navigation>\n```\n\n如有必要，导航图也可以拆分为多个文件以改进组织结构并促进重用。在这种结构下，嵌套图被嵌入到根图中。要创建嵌套图，只需\
  \ shift 点击要嵌套的目的地，在第一个目的地上右键并选择“移动到嵌套图 -> 新图”菜单选项。嵌套图将作为新节点出现。要访问嵌套图，只需双击嵌套图节点以加载图文件。\n\
  \n## 40.4 获取导航控制器\n\n从一个目的地导航到另一个目的地通常响应应用内的某种事件，例如按钮点击。在触发导航动作之前，代码必须先获取控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可以访问 activity\
  \ 的控制器。注意，为了使代码工作，activity 必须包含导航宿主 fragment：\n\n```java\nNavController controller\
  \ = Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n```\n\n\
  在这种情况下，方法调用传递了 activity 的引用以及嵌入 activity 布局的 `NavHostFragment` 的 id。\n\n或者，可以通过只需将该视图传递给方法来识别与任何视图关联导航控制器：\n\
  \n```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一种选项通过调用 `NavHostFragment` 类的 `findNavController()` 方法并传递 fragment 的引用来查找\
  \ fragment 的导航控制器：\n\n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n## 40.5 触发导航动作\n\n\n\n\n一旦找到导航控制器，就可以通过调用控制器的 `navigate()` 方法并传递要执行的操作的资源\
  \ ID 来触发导航动作。例如：\n\n```\ncontroller.navigate(R.id.goToContactsList);\n```\n\n当选中操作连接时，操作的\
  \ ID 在导航图编辑器的“属性（Attributes）”面板中定义。\n\n## 40.6 传递参数\n\n在导航动作期间，可以使用在导航图文件中声明的参数（arguments）将数据从一个目的地传递到另一个目的地。一个参数由名称、类型和一个可选的默认值组成，可以手动在\
  \ XML 中添加，也可以在图表内选择操作箭头或目的地时使用“属性（Attributes）”面板进行添加。例如，在图 40-6 中，声明了一个名为 `contactsCount`\
  \ 的整数参数，其默认值为 0：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n添加后，参数将放置在接收目的地的\
  \ XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n   \
  \ android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"contactsCount\"\n        android:defaultValue=0\n      \
  \  app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法涉及将数据放入\
  \ `Bundle` 对象中，并在动作期间将其传递给目的地，然后在目的地处进行解包（unbundled）并提取参数。\n\n这种特定方法的主要缺点是它不是“类型安全的（type\
  \ safe）”。换句话说，如果接收方目的地对参数的处理类型与其声明的类型不同（例如将字符串视为整数），此错误将不会被编译器捕获，并可能在运行时引发问题。\n\n\
  更好的选择（也是本书采用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它能够自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 参数传递方法将在下一章中进行描述和演示（“Android Jetpack 导航组件教程”）。\n\n## 40.7 总结\n\n在 Android 应用用户界面的上下文中，“导航（Navigation）”一词指的是用户在不同屏幕之间来回移动。过去实现非常耗时且难以组织，现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更容易。\n\n应用中的不同屏幕被称为目的地（destination），通常由片段（fragments）或活动（activities）表示。所有应用都有一个主目的地（home\
  \ destination），包括应用首次加载时显示的屏幕。该布局的内容区域被一个导航主机片段（navigation host fragment）取代，当用户导航应用时，它会与其他目的地片段切换。导航路径由导航图文件定义，该文件由目的地以及连接它们的操作以及在目的地之间传递的任何参数组成。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈，还提供了从应用代码启动导航动作的方法。\n\n## 41. Android Jetpack 导航组件教程\n\
  \n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航绘图功能集成，从而为 Android 应用屏幕之间的导航提供了一种简单的方法。在本章中，将创建一个使用这些导航功能来实现包含多个屏幕的示例应用的\
  \ Android Studio 项目。除了演示 Android Studio 导航图编辑器的使用外，示例项目还将实现使用类型安全参数在源和目的地屏幕之间传递数据。\n\
  \n### 41.1 创建 NavigationDemo 项目\n\n从欢迎界面选择“新建项目（New Project）”选项，在弹出的新项目对话框中，点击“下一步（Next）”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在“名称（Name）”字段输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击“完成（Finish）”按钮之前，将“最小 API 级（Minimum API level）”设置为 `API 26`：Android 8.0\
  \ (Oreo)，并将语言设置为 `Java`。\n\n### 41.2 在构建配置中添加导航\n\n新的“Empty Views Activity”项目默认不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用级的\
  \ `build.gradle` 文件。在项目工具窗口中找到此文件（Gradle Scripts -> `build.gradle (Module :app)`），双击它加载到代码编辑器中，并修改\
  \ `dependencies` 部分以添加导航库。同时利用此机会为该模块启用视图绑定（view binding）：\n\n```gradle\nandroid\
  \ {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\n...\n\ndependencies\
  \ {\n    implementation 'androidx.navigation:navigation-fragment:2.5.3'\n    implementation\
  \ 'androidx.navigation:navigation-ui:2.5.3'\n}\n```\n\n注意，自本书出版以来，这些库可能发布了更新版本。在文件中添加导航依赖后，点击“立即同步（Sync\
  \ Now）”链接以重新同步构建配置。\n\n### 41.3 创建导航图文件\n\n在构建配置中添加导航库后，现在可以向项目添加导航图资源文件。如“导航组件概述所示，这是一个\
  \ XML 文件，包含了用户可以导航的片段和活动，以及执行跳转并在目的地之间传递的任何数据。\n\n在工具窗口中，找到 `res` 文件夹（app -> res），右键点击它并选择“New->Android\
  \ Resource File”选项：\n\n![](img/as_3.2_navigation_menu.jpg)\n\n图 41-1\n\n选择菜单项后，将出现“资源文件”对话框。在此对话框中，将文件命名为\
  \ `navigation_graph`，并将“资源类型（Resource type）”菜单改为 `Navigation`（如图 41-2 所示），然后点击确定创建文件。\n\
  \n![](img/as_3.2_navigation_file.jpg)\n\n图 41-2\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备添加新目的地。将编辑器切换到“代码（Code）”模式，并在添加目的地之前查看图\
  \ XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n</navigation>\n```\n\n将编辑器切换回“设计（Design）”模式，注意“目的地（Destinations）”面板的“主机（Host）”部分显示项目中未检测到导航主机片段：\n\
  \n![](img/as_4.1_navigation_no_hosts.jpg)\n\n图 41-3\n\n### 41.4 声明导航主机\n\n在导航图中添加任何目的地之前，下一步是向项目添加导航主机片段。\n\
  \n对于此项目，导航主机片段将包含在主活动的用户界面布局中。首先，在项目工具窗口找到主活动布局文件（app -> res -> layout -> `activity_main.xml`），将其加载到布局编辑器中并删除默认的\
  \ `TextView` 组件。\n\n\n\n\n在设计（Design）模式下使用布局编辑器，从调色板（Palette）的容器（Containers）部分拖入\
  \ `NavHostFragment` 元素，并将其放置在活动布局的容器区域，如图 41-4 所示：\n\n![](img/as_navigation_add_host.jpg)\n\
  \n图 41-4\n\n在弹出的导航图（Navigation Graphs）对话框中，选择上一节中创建的 `navigation_graph.xml` 文件，并点击`OK`按钮。\n\
  \n在布局中选中新添加的 `NavHostFragment` 实例，使用属性（Attributes）工具窗口将元素的 ID 改为 `demo_nav_host_fragment`，然后点击`Infer\
  \ constraints`（推断约束）。\n\n将布局编辑器切换到代码（Code）模式并检查 XML 文件。注意编辑器已正确配置了导航图属性以引用 `navigation_graph.xml`\
  \ 文件，且 `defaultNavHost` 属性已设置为 `true`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\nxmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"409dp\"\n        android:layout_height=\"729dp\"\
  \n        app:defaultNavHost=\"true\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:navGraph=\"\
  @navigation/navigation_graph\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n返回 `navigation_graph.xml` 文件并确认已检测到 `NavHostFragment` 实例（更改生效之前，可能需要关闭并重新打开文件）：\n\
  \n![](img/as_navigation_host_added.jpg)\n\n图 41-5\n\n### 41.5 添加导航目的地\n\n继续留在导航图中，现在是时候添加第一个目的地了。点击图\
  \ 41-6 所示的新目的地按钮来选择或创建目的地：\n\n![](img/as_navigation_add_destination.jpg)\n\n图 41-6\n\
  \n接下来，从菜单中选择`Create new destination`（创建新目的地）选项。在弹出的对话框中，选择`Fragment (Blank)`模板，将新\
  \ fragment 命名为 `FirstFragment`，布局命名为 `fragment_first`，然后点击`Finish`按钮。在项目重新构建的简短等待后，新\
  \ fragment 将作为目的地出现在图中，如图 41-7 所示：\n\n![](img/as_navigation_first_fragment.jpg)\n\
  \n图 41-7\n\n位于目的地节点上方的房屋图标表示这是起始目的地（start destination）。这意味着当创建包含 `NavHostFragment`\
  \ 的活动时，该目的地将是第一个显示的。要将起始目的地更改为另一个，请在图中选中该节点并点击工具栏上的房屋按钮。\n\n通过将编辑器切换到代码模式检查导航图的\
  \ XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/firstFragment\">\n    <fragment\n        android:id=\"\
  @+id/firstFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\
  \n        android:label=\"fragment_first\"\n        tools:layout=\"@layout/fragment_first\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少需要一个目的地。重复上述步骤，添加布局为 `fragment_second`\
  \ 的 `SecondFragment`，如图 41-8 所示：\n\n![](img/as_navigation_two.jpg)\n\n图 41-8\n\n\
  ### 41.6 设计目的地布局\n\n在现在添加导航跳转操作之前，是为目的地添加一些用户界面组件的好时机。首先双击 `firstFragment` 使 `fragment_first.xml`\
  \ 加载到编辑器，然后选中并删除默认的 `TextView`。在组件树（Component Tree）中，右键点击 `FrameLayout` 条目并选择`Convert\
  \ to ConstraintLayout`（转换为 ConstraintLayout）选项，接受默认设置：\n\n![](img/as_navigation_convert.jpg)\n\
  \n图 41-9\n\n使用属性（Attributes）窗口将 `FrameLayout` 的 ID 改为 `constraintLayout`，然后将 `Button`\
  \ 和 `EditText` 控件拖入布局中，使其看起来类似于图 41-10 所示：\n\n![](img/as_navigation_first_ui.jpg)\n\
  \n图 41-10\n\n一旦视图定位正确，点击`Infer constraints`按钮以添加约束。选中 `EditText` 视图，使用属性窗口删除默认的“Name”并将\
  \ ID 改为 `userText`。\n\n返回 `navigation_graph.xml` 并双击 `SecondFragment` 将 `fragment_second`\
  \ 加载到编辑器。选中并删除 `TextView` 实例重复上述步骤将 `FrameLayout` 转换为 `ConstraintLayout`，这次将 ID\
  \ 改为 `constraintLayout2`。接下来，在布局中心拖入一个新的 `TextView`，点击`Infer constraints`按钮添加约束。选中新的\
  \ `TextView`，使用属性面板将 ID 改为 `argText`。\n\n### 41.7 为导航图添加操作\n\n现在两个目的地已添加到图中并设计了相应的用户界面，项目现在需要一种从第一个\
  \ fragment 跳转到第二个的方法。这将通过向图中添加操作来实现并在代码中引用它。\n\n要建立以第一个 fragment 为起点、第二个 fragment\
  \ 为目的地的操作连接，打开导航图并将鼠标指针悬停在 `firstFragment` 目的地右边缘的垂直中心，会出现圆圈，如图 41-11 所示：\n\n![](img/as_navigation_circle.jpg)\n\
  \n图 41-11\n\n点击圆圈并将生成的线条拖到 `secondFragment` 目的地：\n\n![](img/as_navigation_line_drag.jpg)\n\
  \n图 41-12\n\n释放线条以建立起点和目的地之间的操作连接，此时线条将变为箭头，如[图 41-13]所示：\n\n![](img/as_navigation_connected.jpg)\n\
  \n图 41-13\n\n随时可以通过选中操作连接并按下键盘 Delete 键将其删除。选中箭头后，检查属性工具窗口中的可用属性并将 ID 改为 `mainToSecond`。这是代码中引用操作的\
  \ ID。将编辑器切换到代码模式，注意操作已包含在 XML 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/navigation_graph\">\n```\n\n\n\n\n```xml\n<navigation app:startDestination=\"\
  @id/firstFragment\">\n    <fragment\n        android:id=\"@+id/firstFragment\"\n\
  \        android:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\n       \
  \ android:label=\"fragment_first\"\n        tools:layout=\"@layout/fragment_first\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n## 41.8 实现 OnFragmentInteractionListener\n\n在添加触发动作的代码之前，需要修改\
  \ `MainActivity` 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白 Fragment\
  \ 时，在 Fragment 类内部生成的。为了符合该接口，activity 需要实现一个名为 `onFragmentInteraction()` 的方法，该方法用于实现\
  \ fragment 与 activity 之间的通信。\n\n编辑 `MainActivity.java` 文件并将其修改如下：\n\n```java\nimport\
  \ android.net.Uri;\n\npublic class MainActivity extends AppCompatActivity implements\
  \ SecondFragment.OnFragmentInteractionListener {\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    @Override\n    public\
  \ void onFragmentInteraction(Uri uri) {\n    }\n}\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener`\
  \ 未定义（某些 Android Studio 版本会自动添加它，而另一些则不会），请编辑 `SecondFragment.java` 文件并添加以下内容：\n\
  \n```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: 更新参数类型和名称\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n\
  ## 41.9 为目标 Fragment 添加 View Binding 支持\n\n由于我们需要访问 fragment 布局中的某些视图，因此需要修改当前代码以启用\
  \ view binding 支持。首先编辑 `FirstFragment.java` 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentFirstBinding;\n\
  \npublic class FirstFragment extends Fragment {\n    private FragmentFirstBinding\
  \ binding;\n\n    @Nullable\n    @Override\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container,\n                    \
  \         @Nullable Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.fragment_first,\
  \ container, false);\n        binding = FragmentFirstBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n}\n```\n\n对 `SecondFragment.java` 文件重复上述步骤，这次引用 `FragmentSecondBinding`。\n\
  \n## 41.10 触发动作\n\n现在动作已经添加到导航图中，下一步是在第一个 fragment 中添加一些代码，以便在点击 `Button`（按钮）小部件时触发该动作。找到\
  \ `FirstFragment.java` 文件，将其加载到代码编辑器中并重写 `onViewCreated()` 方法，以获取按钮实例的引用，并配置 `OnClickListener`\
  \ 实例，以便在用户点击按钮时调用：\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  import android.widget.Button;\nimport androidx.navigation.Navigation;\n\npublic\
  \ class FirstFragment extends Fragment {\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        binding.button.setOnClickListener(new View.OnClickListener()\
  \ {\n            @Override\n            public void onClick(View view) {\n     \
  \           Navigation.findNavController(view).navigate(R.id.mainToSecond);\n  \
  \          }\n        });\n    }\n}\n```\n\n上述代码获取了导航器的引用并在该实例上调用了 `navigate()`\
  \ 方法，将动作的资源 ID 作为参数传递。编译并运行应用，验证点击第一个 fragment 中的按钮是否跳转到第二个 fragment。\n\n作为这种设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目标。因此，可以使用以下单行代码来启动跳转：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(R.id.mainToSecond,\
  \ null));\n```\n\n## 41.11 使用 Safeargs 传递数据\n\n下一个目标是将第一个 fragment 中 `EditText`\
  \ 视图中输入的文本传递到第二个 fragment，并在那里显示在 `TextView` 小部件上。正如上一章所述，Android 导航组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\
  \n使用 `safeargs` 的第一步向 Gradle 构建配置添加 `safeargs` 插件。使用 Project 工具窗口，找到并编辑项目级的 `build.gradle`\
  \ 文件（Gradle Scripts -> `build.gradle (Project: NavigationDemo)`），按如下所示添加插件依赖（再次记住，现在可能有更更新的版本可用）：\n\
  \n```gradle\n// 根级构建文件，可以在此处添加适用于所有子项目/模块的配置选项\nbuildscript {\n    dependencies\
  \ {\n        classpath(\"androidx.navigation:navigation-safe-plugin:2.5.3\")\n \
  \   }\n}\n\nplugins {\n}\n```\n\n接下来，编辑模块级的 `build.gradle` 文件（Gradle Scripts ->\
  \ `build.gradle (Module :app)`），如下所示应用插件并同步项目：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  \    id 'androidx.navigation.safeargs'\n}\n\nandroid {\n}\n```\n\n下一步是定义目标接收的任何参数，在本例中是第二个\
  \ fragment。编辑导航图，选择 `secondFragment` 目标并在 Attributes 工具窗口中找到 `Arguments` 部分。点击 +\
  \ 按钮（如图 41-14 所示）向目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n41-14\n\
  \n点击 + 按钮后会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，在默认值字段中输入\
  \ `No Message`，然后点击 Add 按钮：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n\
  41-15\n\n新配置的参数将出现在 `navigation_graph.xml` 文件的 `secondFragment` 元素中，如下：\n\n```xml\n\
  <fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \n        android:defaultValue=\"No Message\" />\n</fragment>\n```\n\n\n\n\n当项目构建时，`safeargs`\
  \ 插件将生成以下额外的类，这些类可以在导航过程中传递和接收参数。\n\n- `FirstFragmentDirections` - 此类表示导航动作的起点（使用导航起点的类名并在末尾添加“Directions”来命名），并提供对动作对象的访问。\n\
  - `ActionMainToSecond` - 表示执行转换的动作的类（根据导航图文件中分配给动作的 ID 命名，并带有前前缀“Action”）。该类为目标地上配置的每个参数都包含一个设置方法（setter\
  \ method）。例如，由于第二个片段目标地包含一个名为 `message` 的参数，因此该类包含一个名为 `setMessage()` 的方法。一旦配置完成，该类的实例就会被传递给导航控制器的\
  \ `navigate()` 方法以导航到目标地。\n- `SecondFragmentArgs` - 在目标片段中使用此类来访问从起点传回的参数（使用导航目的地的类名并在末尾添加“Args”来命名）。该类为每个传递到目的地的参数包含一个获取方法（getter\
  \ method），例如 `getMessage()`。\n\n使用这些类，可以对 `FirstFragment.java` 文件中 `onViewCreated()`\
  \ 方法内的 `onClickListener` 代码进行如下修改，以从 `EditText` 控件中提取当前文本，将其应用于动作并启动到第二个片段的转换：\n\
  \n```\nbinding.button.setOnClickListener(view1 -> {\n    FirstFragmentDirections.MainToSecond\
  \ action =\n            FirstFragmentDirections.mainToSecond();\n    action.setMessage(binding.userText.getText().toString());\n\
  \    Navigation.findNavController(view1).navigate(action);\n});\n```\n\n上述代码获取动作对象的引用，使用\
  \ `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果 Android Studio\
  \ 报告 `FirstFragmentDirections` 未定义，请使用 `Build -> Make Project` 菜单选项重新构建项目以生成该类。\n\
  \n只需要修改 `SecondFragment.java` 类文件，在导航执行后接收参数并将其显示在 `TextView` 控件上。对于此示例，将使用 `onStart()`\
  \ 周期方法来添加实现这些任务的代码。编辑 `SecondFragment.java` 文件并添加此方法，使其读取如下：\n\n```\n@Override\n\
  public void onStart() {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n上述方法中的代码首先获取 `TextView` 控件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法从起点提取 `SecondFragmentArgs` 对象。由于此示例中的参数在 `navigation_graph.xml` 文件中名为 `message`，因此在\
  \ `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。该字符串随后显示在 `TextView` 控件上。\n\n编译并运行应用，在点击\
  \ `Button` 控件之前输入一些文本。当第二个片段目标出现时，`TextView` 现在应该显示在第一个片段输入的文本，表明数据已在导航目的地之间成功传递。\n\
  \n### 41.12 总结\n\n本章提供了如何使用 Navigation 架构组件结合 Android Studio 导航图编辑器实现 Android 应用程序导航的实用示例。涵盖的主题包括创建包含现有和新目标片段的导航图、在\
  \ Activity 布局中嵌入导航宿主片段、编写触发导航事件的代码，以及使用 Gradle `safeargs` 插件在目的地之间传递参数。\n\n## 42.\
  \ MotionLayout 简介\n\n`MotionLayout` 类提供了一种为用户界面布局中的视图添加动画效果的简单方法。本章将首先概述 `MotionLayout`\
  \ 并引入 `MotionScenes`、`Transitions` 和 `Keyframes` 的概念。在涵盖这些基础知识后，接下来的两章（标题为“Android\
  \ MotionLayout 编辑器教程”和“MotionLayout KeyCycle 教程”）将通过创建示例项目，提供 `MotionLayout` 动画运行的更多细节和示例。\n\
  \n### 42.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局内视图从一个状态到另一个状态的转换进行动画处理。例如，MotionLayout\
  \ 可以控制 `ImageView` 实例在指定时间内从屏幕左上角移动到右下角。除了视图的位置，其他属性的变化也可以进行动画处理，例如颜色、大小或旋转角度。这些状态变化还可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循位于起点和终点之间不同位置的中间点的路径。\n\n`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全声明在 XML 中，通常不需要编写任何代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行视觉化实现，或者结合使用这两种方法。\n\n### 42.2 MotionLayout\n\
  \n在实现动画时，通常用于用户界面的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（可以通过在布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单选项来实现）。`MotionLayout` 还需要至少\
  \ `2.0.0` 版本的 `ConstraintLayout` 库。\n\n意外，由于它是 `ConstraintLayout` 的子类，`MotionLayout`\
  \ 支持 `ConstraintLayout` 的所有布局功能。因此，在使用 `MotionLayout` 处理任何不需要动画的视图时，可以以完全相同的方式设计用户界面布局。\n\
  \n对于需要动画的视图，会声明两个 `ConstraintSets` 来定义视图在动画开始和结束时的外观和位置。`transition` 声明定义了关键帧（keyframes），用于在这些开始和结束状态之间对目标视图应用额外效果，并带有用于启动和控制动画的点击和滑动处理器。\n\
  \n开始和结束的 `ConstraintSets` 以及转换都声明在 MotionScene XML 文件中。\n\n### 42.3 MotionScene\n\
  \n正如我们在前面的章节中看到的，XML 布局文件包含了配置呈现给用户的静态视图的外观和布局行为所需的必要信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（换句话说，将进行动画处理的视图），这些视图仍然声明在布局文件中，但与视图相关的开始、结束和转换声明存储在单独的\
  \ XML 文件中，称为 MotionScene 文件（之所以这样命名是因为所有声明都定义在 `MotionScene` 元素中）。该文件被导入布局 XML 文件，并包含开始和结束的\
  \ `ConstraintSet` 对以及 `Transition` 声明。\n\n\n\n\n以下列表显示了 `MotionScene` 文件的模板：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n      motion:constraintSetEnd=\"@+id/end\"\n      motion:constraintSetStart=\"\
  @id/start\"\n      motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上述 XML 中，声明了命名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），它们此时尚未包含任何约束元素（constraint\
  \ elements）。`Transition` 元素定义了这些 `ConstraintSets` 代表动画的起点和终点，并包含一个空的 `KeyFrameSet`\
  \ 元素，准备填充额外的动画关键帧项。`Transition` 元素还包含一个毫秒级持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets`\
  \ 并不意味着视图的移动。例如，可以让起始集和结束集声明屏幕上的相同位置，然后使用过渡动画来化其他属性的变化，例如缩放和旋转角度。\n\n## 42.4 配置\
  \ ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将整套 `ConstraintLayout`\
  \ 设置应用于视图的定位、尺寸调整以及与父布局和其他其他视图的关系上。此外，在 `ConstraintSet` 声明中还可以包含以下属性：\n\n- `alpha`\n\
  - `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n\
  - `translationY`\n- `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，为了在动画期间将视图旋转 180°，可以在起始和结束约束中声明如下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n    .\n  \
  \  .\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        android:rotation=\"\
  0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet android:id=\"@+id/end\"\
  >\n    <Constraint\n    .\n    .\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图将从 0° 开始，然后在动画期间旋转整个 180°，最后以倒置状态停止。\n\n### 42.5\
  \ 自定义属性\n\n除了上述列出的标准属性外，还可以指定范围内的自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上几乎任何可用属性都可以指定为自定义属性以便包含动画中。要识别属性名称，请从目标视图类的文档中查找\
  \ getter/setter 名称，删除 `get/set` 前缀并将剩余部分的第一个字母转换为小写。例如，在代码中更改 `Button` 视图的背景颜色时，我们可能如下所示调用\
  \ `setBackgroundColor()` setter 方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下选项列表适当类型声明值：\n\n\
  - `motion:customBoolean` - 布尔属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension`\
  \ - 维度属性值。\n- `motion:customFloatValue` - 浮点属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue`\
  \ 类型进行赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下来自 `MotionScene` 文件的片段除了为视图声明了起始和结束约束外，还将背景颜色从绿色更改为红色：\n\
  \n```xml\n.\n.\n    <ConstraintSet android:id=\"@+id/start\">\n        <Constraint\n\
  \            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_absoluteX=\"21dp\"\n            android:id=\"\
  button\"\n            motion:layout_topTopOf=\"parent\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\">\n            <CustomAttribute\n                motion:attributeName=\"\
  backgroundColor\"\n                motion:customColorValue=\"#33CC33\" />\n    \
  \    </Constraint>\n    </ConstraintSet>\n    <ConstraintSet android:id=\"@+id/end\"\
  >\n        <Constraint\n            android:layout_width=\"wrap_content\"\n    \
  \        android:layout_height=\"wrap_content\"\n            motion:layout_absoluteY=\"\
  21dp\"\n            android:id=\"button\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            motion:layout_constraintToEnd=\"parent\">\n            <CustomAttribute\n\
  \                motion:attributeName=\"backgroundColor\"\n                motion:customColorValue=\"\
  #F8A1F\" />\n        </Constraint>\n    </ConstraintSet>\n```\n\n### 42.6 触发动画\n\
  \n如果没有某种形式的事件告诉 `MotionLayout` 开始动画，`MotionScene` 文件中的任何设置都不会产生影响（视图将根据设置进行定位除外）。\n\
  \n动画可以配置为响应屏幕点击（OnClick）或滑动（OnSwipe）手势启动。`OnClick` 处理器会导致动画启动并运行到完成，而 `OnSwipe`\
  \ 则将同步动画沿时间线往回移动。`OnSwipe` 还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe` 处理器还提供了选项，用于配置动画如何响应不同方向以及滑动锚定在目标视图的哪侧。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，必须指定视图\
  \ ID。例如，要实现一个响应于锚定在名为 `button` 的视图底部的向下拖动的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition`\
  \ 中：\n\n```xml\n.\n.\n<Transition\n  motion:constraintSetEnd=\"@+id/end\"\n  motion:constraintSetStart=\"\
  @id/start\"\n  motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n      motion:touchAnchorId=\"@+id/button\"\n      motion:dragDirection=\"\
  dragDown\"\n      motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n或者，为同一个按钮添加\
  \ `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\n    motion:clickAction=\"\
  toggle\" />\n```\n\n在上述示例中，动作已设置为 `toggle` 模式。该模式以及其他可用选项总结如下：\n\n- `toggle` - 动画到对立状态。例如，如果视图当前处于过渡起点，它将过渡到终点，反之亦然。\n\
  - `jumpToStart` - 不使用动画直接切换到起始状态。\n- `jumpToEnd` - 不使用动画直接切换到结束状态。\n- `transitionToStart`\
  \ - 动画过渡到起始状态。\n- `transitionToEnd` - 动画过渡到结束状态。\n\n### 42.7 弧形运动\n\n\n\n\n默认情况下，视图位置的移动将在起点和终点之间沿直线移动。要将运动改为弧形路径，只需在起始约束中使用如下所示的\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧形是凹形还是凸形：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal` 弧与默认直线运动的对比：\n\
  \n![](img/motionlayout_arcMotion_three.jpg)\n图 42-1\n\n### 42.8 关键帧 (Keyframes)\n\
  \n目前为止概述的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。换句话说，如果旋转属性在终点设置为 180°，则旋转将在动画开始时开始，并在到达终点时完成。因此，无法配置在动画进行到\
  \ 50% 处达到完全 180°，然后在动画结束时旋转回原始朝向。幸运的是，使用关键帧（Keyframes）可以实现这种效果。\n\n关键帧用于定义动画过程中的中间点，并在这些点发生状态变化。例如，可以声明关键帧，使得视图的背景颜色在动画进行\
  \ 50% 处过渡到蓝色，75% 处变为绿色，并在动画结束时恢复原始颜色。关键帧实现在 `MotionScene` 文件的 `Transition` 中，并嵌入在\
  \ `KeyFrameSet` 元素中。\n\nMotionLayout 支持多种类型的关键帧，总结如下：\n\n#### 42.8.1 属性关键帧 (Attribute\
  \ Keyframes)\n\n属性关键帧（使用 `KeyAttribute` 声明）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持上述为\
  \ `ConstraintSets` 列出的相同 set 属性，并结合了指定更改在动画时间轴何处生效的能力。例如，以下关键帧声明将导致按钮在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大，在时间轴\
  \ 50% 处达到完全尺寸。对于时间轴的剩余部分，视图尺寸将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n```\n\n#### 42.8.2 位置关键帧 (Position Keyframes)\n\n位置关键帧（`KeyPosition`）用于修改视图在起点和终点之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用几乎任何复杂程度路径。位置使用\
  \ `x` 和 `y` 坐标结合过渡时间轴中的对应点进行声明。这些坐标必须相对于以下坐标系之一声明：\n\n- `parentRelative`：`x` 和 `y`\
  \ 坐标相对于父容器，坐标以百分比表示（表示为 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\
  图 42-2\n\n- `deltaRelative`：`x` 和 `y` 坐标不是相对于父容器，而是相对于起点和终点。例如，起点为 (0, 0)，终点为 (1,\
  \ 1)。请记住，`x` 和 `y` 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n图 42-3\n\
  \n- `pathRelative`：`x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为 X 轴。再次，坐标以百分比表示（0.0 到 1.0）。这与\
  \ `deltaRelative` 类似，但考虑了路径的角度。\n\n![](img/pathRelative.jpg)\n\n作为一个示例，以下 ConstraintSets\
  \ 定义了屏幕两侧的起点和终点。默认情况下，使用这些点的视图将如图 42-5 所示沿直线移动：\n\n![](img/straight_path.jpg)\n\n\
  然而，假设要求视图遵循类似于图 42-6 所示的路径：\n\n![](img/wave_path.jpg)\n\n为了实现这一点，可以在过渡中声明关键帧位置：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n    motion:percentX=\"\
  0.25\"/>\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  75\"\n    motion:keyType=\"pathRelative\"\n    motion:percentY=\"-0.3\"\n    motion:percentX=\"\
  0.75\"/>\n```\n\n上述元素在路径的 25% 和 75% 处创建了关键帧。第一个位置在 (0.25, 0.3)，第二个位置在 (0.75, -0.3)。这些位置帧可以在图\
  \ 42-7 中可视化：\n\n![](img/curve_path.jpg)\n\n## 42.9 时间线性 (Time Linearity)\n\n在没有任何设置的情况下，上述动画将以恒速执行。为了改变动画的速度（例如使其加速和减速），可以在\
  \ `ConstraintSet` 或 `Keyframe` 中使用 `transitionEasing` 属性。\n\n对于复杂的缓动需求，线性可以通过在贝塞尔曲线上绘制点来定义，例如：\n\
  \n```xml\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\n```\n\n如果你熟悉贝塞尔曲线，可以使用以下 URL 中的曲线生成器：https://cubic-bezier.com/\n\
  \n然而，对于大多数需求，可以使用内置的 `accelerate` 和 `decelerate` 值来指定缓动：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"decelerate\"\n```\n\n## 42.10 触发器 (KeyTrigger)\n\
  \n触发器关键帧（`KeyTrigger`）允许在动画到达时间轴内的指定帧位置时调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画正向还是反向运行调用不同的方法。考虑一个在动画移动超过时间轴\
  \ 20% 时变为可见的按钮。`KeyTrigger` 将在 `Transition` 元素的 `KeyFrameSet` 中如下使用 `onPositiveCross`\
  \ 属性实现：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@id/button\"\
  />\n</KeyFrameSet>\n```\n\n\n\n\n同样，如果当动画反向并降至 10% 时需要隐藏同一个按钮，可以使用 `onNegativeCross`\
  \ 属性添加第二个键触发器：\n\n```xml\n<KeyTrigger\n      motion:framePosition=\"10\"\n     \
  \ motion:onNegativeCross=\"show\"\n      motion:motionTarget=\"@id/button2\"/>\n\
  ```\n\n如果动画使用的是切换动作（toggle action），则仅需使用 `onCross` 属性即可：\n\n```xml\n<KeyTrigger\n\
  \      motion:framePosition=\"10\"\n      motion:onCross=\"show\"\n      motion:motionTarget=\"\
  @id/button2\"/>\n```\n\n## 42.11 循环（Cycle）与时间循环（Time Cycle）关键帧\n\n虽然位置帧可以用于向动画添加中间状态，但如果需要大量重复的位置和变化，这将迅速变得非常复杂。对于需要以可预测的变化重复执行状态更改的情况，`MotionLayout`\
  \ 包含了循环（Cycle）和时间循环（Time Cycle）关键帧，该主题将在题为“MotionLayout 循环教程的章节中进行详细介绍。\n\n## 42.12\
  \ 从代码启动动画\n\n在本章目前为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 程序来控制动画。也可以通过调用 `MotionLayout`\
  \ 实例的方法从代码内部启动动画。例如，以下代码为名为 `motionLayout` 的布局运行耗时为 2000ms 的从开始到结束的过渡：\n\n```java\n\
  motionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n```\n\
  \n在没有额外设置的情况下，动画使用的开始和结束状态将是 `MotionScene` 文件中 `Transition` 声明里定义的状态。要使用特定的开始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时通过 id 引用它们：\n\n```java\nmotionLayout.setTransition(R.id.myStart,\
  \ R.id.myEnd);\nmotionLayout.transitionToEnd();\n```\n\n若要在动画运行时监控其状态，如下所示为 `MotionLayout`\
  \ 实例添加过渡监听器：\n\n```java\nmotionLayout.setTransitionListener(transitionListener);\n\
  MotionLayout.TransitionListener transitionListener =\n             new MotionLayout.TransitionListener()\
  \ {\n\n    @Override\n    public void onTransitionStarted(MotionLayout motionLayout,\n\
  \                                     int startId, int endId) {\n        // 当过渡开始时调用\n\
  \    }\n    @Override\n    public void onTransitionChange(MotionLayout motionLayout,\
  \ int startId,\n                                     int endId, float progress)\
  \ {\n        // 每次属性变化时调用。跟踪进度值以找到当前位置\n    }\n    @Override\n    public void onTransitionCompleted(MotionLayout\
  \ motionLayout, int currentId) {\n        // 当过渡完成时调用\n    }\n    @Override\n  \
  \  public void onTransitionTrigger(MotionLayout motionLayout, int triggerId,\n \
  \                                    boolean positive, float progress) {\n     \
  \   // 当跨越触发关键帧阈值时调用\n    }\n};\n```\n\n## 42.13 总结\n\n`MotionLayout` 是 `ConstraintLayout`\
  \ 的子类，专门设计为用户界面布局中的视图添加动画效果。`MotionLayout` 通过对视图在由开始和结束约束集定义的两个状态之间的过渡动画来工作。利用关键帧可以在这些开始和结束点之间添加额外的动画效果。\n\
  \n动画可以通过 `OnClick` 或 `OnSwipe` 处理器触发，也可以通过调用 `MotionLayout` 实例的方法以编程方式触发。\n\n##\
  \ 43. Android MotionLayout 编辑器教程\n\n现在已经涵盖了 `MotionLayout` 的基础知识，本章将提供一个在示例项目中尝试\
  \ `MotionLayout` 的机会。除了继续探索 `MotionLayout` 的主要功能，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用它进行视觉化构建和修改。\n\
  \n### 43.1 创建 MotionLayout 项目\n\n在欢迎屏幕上点击 `New Project`，并在项目对话框中选择 `Empty Views`\
  \ 模板。在 `Name` 字段输入 `MotionLayout` 并指定 `com.examplezy.motionlayout` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `API level` 设置为 `26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n\
  ### 43.2 从 ConstraintLayout 转换为 MotionLayout\n\n一常地，Android Studio 会在 `activity_main.xml`\
  \ 文件中放置一个 `ConstraintLayout` 容器。下一步是将此容器转换为 `MotionLayout`。在 `Component Tree` 中，右键点击\
  \ `ConstraintLayout` 项并选择 `Convert to MotionLayout` 选项。\n\n### 43.3 配置开始和结束约束\n\n\
  当 `activity_main.xml` 文件加载到 `MotionLayout` 编辑器后，确保选中 `Motion Layout` 框（下方图 43-5\
  \ 中标记为 E 的部分），然后在删除默认的 `TextView` 后，从调色板拖入 `Button` 视图到布局画布的左上角，如图 43-4 所示：\n\n\
  选中按钮后，使用 `Attributes` 工具窗口将 `id` 更改为 `myButton`。\n\n\n\n\n\n如上一章所述，`MotionLayout`\
  \ 动画主要是指定视图如何在两个状态之间进行转换的。因此，实现动画的第一步是指定定义这些状态的约束。在本例中，起点将是布局视图的顶部中央。要配置这些约束，请在编辑器窗口中选择起始约束集项（图\
  \ 43-5 中的标记 A）：\n\n![](img/as_4.0_motionlayout_editor_start_labeled.jpg)\n\n图 43-5\n\
  \n选中起始框（start box）时，所有的约束和布局更改将应用于起始约束集。要返回整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\
  \n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。注意，`Source` 列显示该按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据起始约束集进行定位。在仍选中\
  \ `myButton` 条目的情况下，点击 `Edit` 按钮 (C) 并从菜单中选择 `Create Constraint`，之后按钮条目将指示视图将根据起始约束集进行定位：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\n图 43-6\n\n起始约束集需要将按钮放置在布局顶部，带有\
  \ `8dp` 的偏移量并水平居中。在 `myButton` 仍选中的情况下，使用 `Attributes` 工具窗口对视图的顶部、左侧和右侧设置约束，如下：\n\
  \n![](img/as_4.0_motionlayout_start_constraints.jpg)\n\n图 43-7\n\n选择结束约束集项（上述 图\
  \ 43-5 中的标记 D），并重复这些步骤以创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部边缘有 `8p` 的偏移量：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\
  \n图 43-8\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件并注意约束已添加到到文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTop_toTopOf=\"parent\"\n   \
  \         android:layout_marginTop=\"8dp\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_editor_absoluteY=\"\
  6dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            android:layout_marginBottom=\"8dp\" />\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n同时注意，`Transition` 元素已经预配置好，用于制作起点和终点之间的转换动画。\n\n### 43.4\
  \ 预览布局动画\n\n要在不进行构建和运行的情况下预览动画，选择过渡连接箭头以显示时间轴：\n\n![](img/as_4.0_motionlayout_timeline.jpg)\n\
  \n图 43-9\n\n当滑块移动 (B) 时，动画会随之移动 (C)。使用滑块 (D) 测试动画，可以向前播放、向后播放 (E) 或循环往复播放。\n\n###\
  \ 43.5 添加 OnClick 点击手势\n\n到目前为止，示例项目仅在演示按钮视图从屏幕上一个位置到另一个位置的运动。尽管我们还没有添加启动方式，但在 MotionLayout\
  \ 编辑器中仍然预览动画。\n\n通过选择过渡箭头（上述 图 43-9 中的标记 A），在 Attributes 窗口中找到 `OnClick` 部分并点击 `+`\
  \ 按钮：\n\n![](img/as_4.0_motionlayout_add.jpg)\n\n图 43-10\n\n在 `OnClick` 面板中会出现一个空行。对于属性名，输入\
  \ `targetId`，对于值字段输入按钮的 id（`@id/myButton`）。再次点击 `+` 按钮，这次在属性名中输入 `clickAction`。\n\
  \n![](img/as_4.0_motionlayout_actions.jpg)\n\n图 43-11\n\n对于此示例，选择 `toggle` 动作。一旦输入这些设置，它们应该与\
  \ 图 43-12 所示的内容匹配：\n\n![](img/as_4.0_motionlayout_added.jpg)\n\n图 43-12\n\n再次打开\
  \ `activity_main_scene.xml` 文件，并查看 `Transition` 元素中定义的 `OnClick` 属性：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @+id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnClick\n        motion:targetId=\"@+id/myButton\"\n        motion:clickAction=\"\
  toggle\" />\n</Transition>\n```\n\n在设备或模拟器上编译并运行应用，确认点击按钮会导致它在 `MotionScene` 文件定义的起点和终点之间往返转换。\n\
  \n### 43.6 向过渡中添加属性关键帧\n\n到目前为止，示例项目仅在演示按钮视图从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种在过渡时间轴内指定其他属性更改生效的方法。例如，可以定义一个\
  \ `KeyAttribute`，使得在视图移动通过时间轴 30% 时，其尺寸已经增加了 50%。对于此示例，我们将在动画的中点添加一个旋转效果。\n\n首先在\
  \ MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡箭头显示时间轴，然后点击 图 43-13 中高亮的按钮：\n\n\
  ![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n\n图 43-13\n\n从菜单中，选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n\n图 43-14\n\
  \n\n\n\n\n一旦选中，将显示图 43-15 所示的对话框。在对话框中，确保已选择 ID 选项并引用了 `myButton`。在 position（位置）字段中，输入\
  \ 50（这是一个百分比值，0 为起点，100 为终点）。最后在点击 Add（添加）按钮之前，从 Attribute 下拉菜单选择 rotation（旋转）项：\n\
  \n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\n图 43-15\n\n添加 `KeyAttribute`\
  \ 后，时间轴中会出现一个该属性的行。点击该行将其高亮，然后点击行最左侧边缘的展开箭头以展开属性过渡图。注意，时间轴上会出现一个小的菱形标记（如下方图 43-16\
  \ 所示），表示关键帧的位置。该图表表示了效果的线性程度。在这种情况下，按钮将稳定地旋转到指定的角度，在关键帧位置达到最大旋转。当按钮到达终点时，它将旋转回 0\
  \ 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴中选中，然后参考 Attributes（属性）工具窗口。在 `KeyAttribute` 面板中，将 rotation 属性更改为 360\
  \ 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\n图 43-17\n\
  \n通过来移动滑块并观察按钮在布局画布的动画路径上旋转，来检查属性是否正常工作。参考 `activity_main_scene.xml` 文件，其现在的内容应如下：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:motionTarget=\"@+id/myButton\"\n            motion:framePosition=\"\
  50\"\n            android:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@id/myButton\"\n        motion:clickAction=\"toggle\" />\n</Transition>\n\
  ```\n\n测试动画，可以使用过渡滑块，或者通过编译并运行应用来验证按钮现在在动画期间会旋转。\n\n## 43.7 向 Transition 添加 CustomAttribute\n\
  \n`KeyAttribute` 属性仅限于内置效果，如调整大小和旋转。通过声明 `CustomAttributes`（自定义属性）也可以实现额外的更改。与存储在\
  \ `Transition` 元素中的 `KeyAttributes` 不同，`CustomAttributes` 位于起始和结束约束集（constraint\
  \ sets）。因此，这些属性只能声明在起点和终点处生效（也就是说，你无法在过渡时间轴的中间位置指定属性关键帧）。\n\n在本示例中，我们将配置按钮使其颜色从红色逐渐变为绿色。首先，选择图\
  \ 43-18 中标记为 A 的起始框，然后是 `myButton` 视图约束集 (B)：\n\n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\
  \n图 43-18\n\n参考 Attributes 工具窗口，点击下方高亮的 `CustomAttributes` 区域中的 + 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  \n图 43-19\n\n在弹出的对话框（图 43-20）中，将属性类型更改为 `Color`并在 Attribute Name（属性名称）字段中输入 `backgroundColor`。最后，将值设置为\
  \ `#F80A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 43-20\n\n\
  点击 OK 提交更改，然后选择结束约束集（如上方图 43-18 中标记为 C），并重复步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\
  \n使用时间轴滑块或运行应用，确保按钮在动画期间改变了颜色。\n\n这些 `CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中，如下：\n\n```xml\n<ConstraintSet id=\"@+id/start\">\n    <Constraint>\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n  \
  \          motion:attributeName=\"backgroundColor\"\n            motion:customValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n## 43.8 添加位置关键帧\n\n本教程的最后一个任务是在动画路径上添加两个位置关键帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ MotionLayout 编辑器显示过渡时间轴的情况下，点击按钮以创建关键帧，如上方图 43-13 所示，并从下方图 43-21 所示的菜单中选择 `KeyPosition`：\n\
  \n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\n图 43-21\n\n在弹出的对话框中，按照图 43-22\
  \ 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition.jpg)\n\n图 43-22\n\n点击 Add 按钮提交更改，然后重复上述步骤添加第二个位置关键帧，配置如下：\n\
  - Position（位置）：75\n- Type（类型）：parentRelative\n- PercentX：0.85\n- PercentY：0.75\n\
  \n完成这些更改后，`activity_main_scene.xml` 中的 transition 元素将添加了以下关键帧项：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyPosition\n        motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"\
  25\"\n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.15\"\n        motion:percentY=\"0.25\" />\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"75\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.85\"\n        motion:percentY=\"0.75\"\
  \ />\n</KeyFrameSet>\n```\n\n最后测试一次应用，验证按钮现在按照下方所示路径移动，同时保持旋转和颜色变化：\n\n![](img/as_motionlayout_path_1.jpg)\n\
  \n图 43-23\n\n位置关键帧由预览画布中表示运动路径的虚线上菱形标记表示，如图 43-24 所示（如果标记可见，请确保在预览中选中了 `Button`\
  \ 视图）：\n\n![](img/as_motionlayout_path_2.jpg)\n\n图 43-24\n\n要视觉调整关键帧的位置，只需点击标记并将其到新位置。随着标记移动，Motion\
  \ Layout 编辑器将显示网格以及当前的 x 和 y 坐标：\n\n![](img/as_motionlayout_path_3.jpg)\n\n图 43-25\n\
  \n### 43.9 总结\n\n本章介绍了 Android Studio 内置的 MotionLayout 编辑器，并探索了如何在无需手动编写 XML 声明的情况下，使用它为\
  \ Android 应用的用户界面添加动画。本章涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在 `MotionScene`\
  \ 文件中创建起始和结束约束集以及过渡，以及添加 `OnClick`set。还涵盖了动画预览器、自定义属性和位置关键帧的使用。\n\n## 44. 一个 MotionLayout\
  \ KeyCycle 教程\n\n\n\n\n\n前面的章节介绍并演示了如何使用 `MotionLayout` 容器结合 Android Studio MotionLayout\
  \ 编辑器的功能，将动画集成到 Android 应用的用户界面中。标题为“MotionLayout 简介”的章节简要提到了循环关键帧（`KeyCycle`）和时间循环关键帧（`KeyTimeCycle`），并解释了可以如何使用这些关键帧来实现涉及大量重复状态变化的动画。\n\
  \n本章将详细介绍循环关键帧，然后演示如何在 Android Studio 和循环编辑器（Cycle Editor）的示例项目中使用它们。\n\n### 44.1\
  \ 循环关键帧概述\n\n显然，位置关键帧可以用于在动画时间线上添加中间状态变化。虽然这对于少量的状态变化非常有效，但如果数量很大，实现起来就会非常繁琐。例如，为了让按钮在被点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和反时针旋转。同样，在视图跨越屏幕时实现跳动效果也是一项耗时的任务。\n\n\
  对于需要重复执行状态变化的情况，`MotionLayout` 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者执行的任务相同，区别在于 `KeyCycle`\
  \ 帧是基于动画路径中的帧位置，而 `KeyTimeCycles` 是基于基于每秒循环次数（`Hz`）的。\n\n使用这些 `KeyCycle` 关键帧，动画时间线本质上被分为若干子部分（称为循环），每个子部分包含一个或多个波形，定义了视图属性在整个时间线上如何被修改。创建一个\
  \ `KeyCycle` 循环，需要以下信息：\n\n- target view（目标视图）：要进行更改的视图 ID。\n- `frame position`（帧位置）：循环开始的时间线位置。\n\
  - `wave period`（波周期）：循环中包含的波形数量。\n- `attribute`（属性）：被波形修改的视图属性。\n- `wave offset`（波形偏移）：从关键帧基准按指定量偏移循环。\n\
  - `wave shape`（波形形状）：波形的形状（`sin`、`cos`、`sawtooth`、`square`、`triangle`、`bounce` 或\
  \ `reverse sawtooth`）。\n\n考虑以下循环关键帧集：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n\
  \      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n \
  \     motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  25\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\"/>\n    <KeyCycle\n\
  \      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"50dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\"/>\n</KeyFrameSet>\n```\n\n上述关键帧集将时间线划分为四个相等的循环。每个循环配置为包含一个 `sin` 波，该波调整按钮的\
  \ `translationY` 属性 `50dp`。执行时，此动画将导致按钮在范围内多次振荡。此关键帧集可以可视化如图 44-1 所示，其中五个点代表关键帧位置：\n\
  \n![](img/as_4.0_cycle_sin.jpg)\n图 44-1\n\n按照目前的实现方式，每个循环包含一个波。假设我们不需要这些均匀分布的波，而是在最后一个循环内需要四个波。这可以通过增加最后一个\
  \ `KeyCycle` 元素的 `wavePeriod` 属性来轻松实现：\n\n```xml\n<KeyCycle\n  motion:framePosition=\"\
  75\"\n  motion:motionTarget=\"@+id/button\"\n  motion:wavePeriod=\"4\"\n  motion:waveOffset=\"\
  0dp\"\n  motion:waveShape=\"sin\"\n  android:translationY=\"50dp\"/>\n```\n\n做出此更改后，关键帧集可以以波形形式渲染如下：\n\
  \n![](img/as_4.0_cycle_sin_waveperiod.jpg)\n图 44-2\n\n到为止，本章的示例一直使用 `sin` 波。事实上，在\
  \ `MotionLayout` 中使用循环关键帧时，有许多不同的波形可用。图 44-3 展示了将所有循环关键帧的 `waveShape` 属性更改为 `sawtooth`（锯齿波）的效果：\n\
  \n![](img/as_4.0_cycle_sawtooth.jpg)\n图 44-3\n\n除了 `sin` 和 `sawtooth`，`MotionLayout`\
  \ 还支持 `triangle`、`square`、`bounce` 和 `reverseSawtooth` 波形。在上面的示例中，每个循环都沿 Y 轴在相同范围内移动按钮。然而，假设我们需要第二个循环沿正\
  \ Y 轴方向移动按钮更远的距离。这涉及对第二个循环的 `waveOffset` 属性进行如下调整：\n\n```xml\n<KeyCycle\n  motion:framePosition=\"\
  25\"\n  motion:target=\"@+id/button\"\n  motion:wavePeriod=\"1\"\n  motion:waveOffset=\"\
  100dp\"\n  motion:waveShape=\"sin\"\n  android:translationY=\"50dp\"/>\n```\n\n\
  通过做出此更改，我们得到了一个类似于图 44-4 的时间线：\n\n![](img/as_4.0_cycle_sin_waveoffset.jpg)\n图 44-4\n\
  \n现在在第二个循环期间，按钮的移动范围将在 Y 轴上的大约 0 到 `150dp` 之间。如果我们仍然需要范围的低端与其他波形匹配，我们可以在 `translationY`\
  \ 值中添加 `100dp`：\n\n```xml\n<KeyCycle\n  motion:framePosition=\"25\"\n  motion:target=\"\
  @+id/button\"\n  motion:wavePeriod=\"1\"\n  motion:waveOffset=\"100dp\"\n  motion:waveShape=\"\
  sin\"\n  android:translationY=\"150dp\"/>\n```\n\n此更改现在给了我们下面的波形：\n\n![](img/as_4.0_cycle_sin_waveoffset_flat.jpg)\n\
  图 44-5\n\n### 44.2 使用循环编辑器\n\n虽然并不复杂，通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle` 条目来获取所需的精确循环可能会花费时间。考虑到这一点，Google\
  \ 的 Android 工程师开发了循环编辑器。这是一个尚未成为 Android Studio 的独立 Java 工具。循环编辑器允许您可视化地设计和测试循环关键帧集。\n\
  \n循环编辑器以 Java 归档（`.jar`）的形式提供，需要在开发系统中安装 Java 运行时。安装 Java 的步骤取决于您的操作系统。\n\n安装 Java\
  \ 后，可以从以下 URL 下载 `CycleEditor.jar` 文件：\n\n`https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`\n\
  \n下载后，打开命令提示符或终端窗口，切换到 `jar` 文件所在目录并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n一旦工具加载，将出现图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n图 44-6\n\
  \n\n\n\n\n标记为 A 的面板显示了关键帧集的 XML，可以直接进行编辑，也可以使用 B 面板中的控件进行编辑。C 面板显示了波形的循环渲染情况。遗憾的是，在进行更改时，它不会实时重绘。相反，必须通过选择\
  \ `File` -> `parse xml` 菜单选项来刷新。标记为 D 的面板在点击 B 面板中的播放按钮时将显示循环动画的实时渲染。`Examples`\
  \ 菜单提供了一个示例关键帧集集合，它们既可以用于学习，也可以作为你自定义动画的基础。\n\n为了演示循环关键帧（Cycle Keyframe）和循环编辑器（Cycle\
  \ Editor）的使用，本章剩余部分将创建一个实现基于 KeyCycle 动画效果的示例项目。\n\n# 44.3 创建 KeyCycleDemo 项目\n\n\
  从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `KeyCycleDemo`，并指定 `com.ebookfrenzy.keycycledemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (O)`，并将 `Language` 菜单更改为 `Java`。\n\
  \n在 `Design` 模式下打开 `activity_main.xml` 文件，右键点击 `ConstraintLayout` 条目并选择 `Convert\
  \ to MotionLayout` 菜单选项：\n\n![](img/as_4.0_motionlayout_conversion1.jpg)\n图 44-7\n\
  \n在做出选择后，点击确认对话框中的 `Convert` 按钮。\n\n# 44.4 配置起始和结束约束\n\n本教程的目标是制作按钮从设备屏幕一侧移动到另一侧的动画，包括使视图也沿\
  \ `Y-axis` 向上向下移动的 KeyCycle 效果。第一步是配置起始和结束约束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器中，选择并删除默认的 `TextView` 组件。在从调色板中拖放 `Button` 视图之前，确保已选中 Motion Layout 框（在下方 [图\
  \ 44-9] 中标记为 E），使其垂直方向上居中并位于布局画布的左边缘：\n\n![](img/as_key_cycle_ui.jpg)\n图 44-8\n\n\
  要配置起始点的约束，选择编辑器窗口中的 `start constraint set` 条目（在 [图 44-9] 中标记为 A）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  图 44-9\n\n接下来，选择 `ConstraintSet` 列表中的按钮条目 (B)。在按钮条目仍被选中的情况下，点击 `edit` 按钮 (C) 并从菜单中选择\
  \ `Create Constraint`。\n\n在按钮仍被选中的情况下，使用 `Attributes` 工具窗口为视图的顶部、左侧和底部设置约束如下：\n\n\
  ![](img/as_4.0_keycycle_start_constraint.jpg)\n图 44-10\n\n选择 `end constraint set`\
  \ 条目（在上方方的 [图 44-9] 中标记为 D），并重复步骤创建新约束，这次在按钮的顶部、底部和右边缘设置约束：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  图 44-11\n\n### 44.5 创建循环（Cycles）\n\n下一步是使用循环编辑器为动画生成循环关键帧。在循环编辑器运行时，请参考下方 [图 44-12]\
  \ 所示的控制面板：\n\n![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n图 44-12\n\n使用标记为\
  \ A 的菜单，将要修改的属性从 `rotation` 为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制 (B) 选择 `cycle\
  \ 0`，这样在面板其他处的更改将应用于第一个循环。将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`，如 [图\
  \ 44-13] 所示（在移动滑块时，参考 XML 面板查看 `translationY` 值的精确设置）：\n\n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n\
  图 44-13\n\n要在图中看到目前为止的更改，选择 `File` -> `Parse XML` 菜单选项。使用 [表 44-1] 中列出的值配置 `KeyFrames\
  \ 1` 到 4 的设置（记住你已经配置了 `KeyCycle 0` 列中的设置）：\n\n| | KeyCycle 0 | KeyCycle 1 | KeyCycle\
  \ 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position\
  \ | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60\
  \ | 60 | 150 | 60 | 60 |\n| 表 44-1\n\n完成这些更改后，关键帧集 XML 应该如下：\n\n```xml\n<KeySet>\n\
  \  <KeyCycle\n    motion:framePosition=\"0\"\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"\
  25\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"2\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"50\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"3\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"150dp\"/>\n  <KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"2\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"/>\n  <KeyCycle\n    motion:framePosition=\"100\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"/>\n</KeySet>\n```\n\n要查看图中目前为止的更改，选择 `File`\
  \ -> `parse xml` 菜单选项以刷新波形，波形现在应该如 [图 44-14] 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\
  图 44-14\n\n### 44.6 预览动画\n\n现在可以在循环编辑器内部预览循环动画。点击播放按钮（在图 44-15 中标记为 A）启动动画。要将循环与水平移动相结合，将第二个菜单\
  \ (B) 从 `Stationary` 更改为 `West`。此外，花时间尝试 `time` 和 `linearity` 设置（C 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  图 44-15\n\n### 44.7 将 KeySet 添加到 MotionScene\n\n在循环编辑器中，突出显示并复制 XML 面板中的 `KeyCycle`\
  \ 元素，将其 Android 到 `res -> xml -> activity_main_scene.xml` 文件的 `Transition` 部分，使其置于现有的\
  \ `KeySet` 标记之间。同样注意增加的时间设置以及用于启动动画的 `OnClick` 处理程序：\n\n```xml\n<Transition\n  \
  \  motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"7000\">\n    <KeyFrameSet>\n      <KeyCycle\n        motion:framePosition=\"\
  0\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\
  \n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"/>\n      <KeyCycle\n        motion:framePosition=\"25\"/>\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/button\"\n        motion:clickAction=\"toggle\"\
  \ />\n</Transition>\n```\n\n在继续之前，检查每个目标属性是否正确声明。在编写时，循环编辑器使用的是过时的 `motion:target`\
  \ 标签。例如：\n\n`motion:target=\"@+id/button\"`\n\n\n\n\n需要对五个 `KeyCycle` 条目中的每一个进行更改，如下：\n\
  \n```\nmotion:motionTarget=\"@+id/button\"\n```\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮启动并查看动画。\n\
  \n注意，`KeyCycle` 波形形成也可以 Android Studio 的 `MotionLayout` 编辑器中查看，如下方的图 44-16 所示：\n\
  \n![](img/as_4.0_keycycle_motionlayout_timeline_waves.jpg)\n\n图 44-16\n\n`KeyCycle`\
  \ 帧集每个动画不限于一个。例如，向 `activity_main_scene.xml` 文件的 `Transition` 部分添加以下 `KeyFrameSet`，为按钮移动时添加一些旋转效果：\n\
  \n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n   \
  \     motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n   \
  \     motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"\n        android:rotation=\"80\"/>\n    <KeyCycle\n\
  \        motion:framePosition=\"50\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"150dp\"\n        android:rotation=\"45\"/>\n\
  \    <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"\n    \
  \    android:rotation=\"80\"/>\n    <KeyCycle\n        motion:framePosition=\"100\"\
  \n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n\
  \        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n</KeyFrameSet>\n```\n\n### 44.8 总结\n\n\
  循环关键帧提供了一种实用的方法，用于构建涉及匹配波形模式的大数量状态变化的帧动画。如本章所述，通过使用 `Cycle Editor` 应用可以显著简化生成这些循环关键帧的过程。\n\
  \n## 45. 使用悬浮操作按钮和 Snackbar\n\n本章的目标之一是概述 `material design`（材料设计）的概念。`material design`\
  \ 最初作为 Android 5.0 的一部分引入，它是一套设计指南，规定了 Android 用户界面以及……\n\n\n\n\n### 45.6 审查项目\n\
  \n由于选择了 Basic Views Activity 模板，该活动包含四个布局文件。`activity_main.xml` 文件包含一个 `CoordinatorLayout`\
  \ 管理器，其中包含应用栏（app bar）、Material `toolbar` 和悬浮操作按钮的条目。\n\n`content_main.xml` 文件代表活动内容区域的布局，并包含一个\
  \ `NavHostFragment` 实例。该文件通过以下 `include` 指令嵌入到 `activity_main.xml` 文件：\n\n```xml\n\
  <include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml` 文件中的悬浮操作按钮元素如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout-marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明了按钮将出现在屏幕的右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识表示（在这种情况下，它设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准 drawable 内置的电子邮件图标形式。\n\
  \n空白模板还配置了悬浮操作按钮，以便在用户点击时显示 `Snackbar` 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()`\
  \ 方法中找到，内容如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n该代码通过视图绑定（view binding）访问悬浮操作按钮，并为其添加了一个\
  \ `onClickListener` 处理器，在按钮被点击时调用。此方法简单地显示了一个配置了消息但没有操作的 `Snackbar` 实例。\n\n当项目编译并运行后，悬浮操作按钮将显示在屏幕底部，如\
  \ 图 45-3 所示：\n\n![](img/as_default_fab.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `onClickListener`\
  \ 处理器方法，导致 `Snackbar` 显示在屏幕底部：\n\n![](img/as_default_fab_snackbar.jpg)\n\n图 45-4\n\
  \n### 45.7 移除导航功能\n\n如 “Android Studio 布局编辑器工具指南” 所述，Basic Views Activity 模板包含多个片段（fragments）和按钮，用于在不同片段之间进行导航。对于本教程而言，这些功能是不必要的，而且如果不移除它们，稍后会产生问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project 工具窗口中，导航到并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在组件树（Component Tree）面板中选择 `SecondFragment` 条目，并按键盘上的删除键将其从图中移除。\n3. 定位并删除\
  \ `SecondFragment.java`（app -> java -> <package name> -> SecondFragment）和 `fragment_second.xml`（app\
  \ -> res -> layout -> fragment_second.xml）文件。\n4. 定位 `FirstFragment.java` 文件，双击它将其加载到编辑器中，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n               \
  \ .navigate(R.id.action_FirstFragment_to_SecondFragment);\n    }\n});\n```\n\n###\
  \ 45.8 修改悬浮操作按钮\n\n由于此示例的目标是配置悬浮操作按钮以向列表添加条目，目前按钮上显示的电子邮件图标需要更改为更能指示所执行操作的内容。用于按钮的图标名为\
  \ `ic_add_entry.png`，可以在从以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/flamingojava/index.php`](https://www.ebookfrenzy.com/retail/flamingojava/index.php)\n\
  \n在操作系统的文件浏览器中找到此图像并复制图像文件。在 Project 工具窗口的 `app -> res -> drawable` 条目上点击右键，并从菜单中选择“粘贴”将文件添加到：\n\
  \n![](img/as_default_fab.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml` 文件，并将图标源从\
  \ `@android:drawable/ic_email` 更改为 `@drawable/ic_add_entry`，如下所示：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout-marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的图标已更改为加号。我们也可以通过向 `OnClickListener`\
  \ 添加代码，让悬浮操作按钮在点击时执行任何操作。例如，`MainActivity.java` 文件的以下更改会在每次点击按钮时调用名为 `displayMessage()`\
  \ 的方法显示显示消息：\n\n```java\nimport android.widget.Toast;\n\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        displayMessage(\"Fab clicked\");\n        Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n    }\n});\n\npublic void displayMessage(String message) {\n  \
  \  Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\n### 45.9 为\
  \ Snackbar 添加操作\n\n也可以为 `Snackbar` 添加操作，在用户点击时执行特定任务。编辑 `MainActivity.java` 文件并修改\
  \ `Snackbar` 创建代码，添加一个标题为“My Action”的操作，并配置一个名为 `actionOnClickListener` 的监听器：\n\n\
  ```java\nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n\
  \    public void onClick(View view) {\n        Snackbar.make(view, \"Replace with\
  \ your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"My Action\"\
  , actionOnClickListener).show();\n    }\n});\n```\n\n在 `MainActivity.java` 文件中添加监听处理器：\n\
  \n```java\nView.OnClickListener actionOnClickListener = new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        displayMessage(\"\
  Action clicked\");\n        Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮操作按钮，此时\
  \ get 消息和 Snackbar 都应该出现。当 Snackbar 显示时，点击 Snackbar 中的 My Action 按钮，验证 Snackbar\
  \ 的文本变变为“Action Complete”：\n\n![](img/fab_action_clicked.jpg)\n\n图 45-6\n\n### 45.10\
  \ 总结\n\n本章提供了 Material 设计、悬浮操作按钮和 Snackbar 的概览，并完成了一个使用这些功能的示例项目。\n\n悬浮操作按钮和 Snackbar\
  \ 都是 Android 应用用户界面实现中 Material 设计方法的一部分。悬浮操作按钮为突出 Android 应用特定屏幕内最常用的操作提供了一种方式。Snackbar\
  \ 则为应用程序向用户展示信息并同时允许用户对其采取行动提供了一种方式。\n\n\n\n\n\n# 46. 使用 TabLayout 组件创建标签页界面\n\n\
  上一章概述了 Android 材料设计（material design）的概念，并引入了设计支持库提供的两个组件：悬浮操作按钮（floating action\
  \ button）和 `Snackbar`。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与 `ViewPager` 类结合使用，在 Android\
  \ Activity 中创建一个基于标签的界面。\n\n### 46.1 ViewPager2 简介\n\n虽然 `ViewPager2` 不属于设计支持库的一部分，但在与\
  \ `TabLayout` 组件配合使用实现标签页用户界面时，它是非常实用的伴侣类。`ViewPager2` 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局片段（fragment）表示。与\
  \ `ViewPager2` 关联的片段由 `FragmentStateAdapter` 类的实例管理。\n\n至少分配给 `ViewPager2` 的 pager\
  \ 适配器必须实现两个方法。第一个方法命名为 `getItemCount()`，必须返回可向用户显示的页面片段总数。第二个方法 `createFragment()`\
  \ 接收一个页码，并必须返回相应的准备好给用户显示的片段对象。\n\n### 46.2 TabLayout 组件概述\n\n正如之前讨论过的，`TabLayout`\
  \ 是作为材料设计引入的组件之一，并包含在设计支持库中。`TabLayout` 的目的是向用户提供一行标签，可以通过选择这些标签来向用户显示不同的页面。标签可以是固定的，也可以是可滚的，用户可以向左或右滑动以查看比当前屏幕容纳更多的标签。标签上显示的信息可以是基于文本的、图像或文本与图像的组合。例如图\
  \ 46-1 显示了一个包含四个显示图像的标签的 App 标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n另一方面，图\
  \ 46-2 显示了一个 `TabLayout` 配置，包含四个显示文本的标签，并采用可滚的配置：\n\n![](img/Image2434.jpg)\n\n\
  图 46-2\n\n本章的剩余部分将通过创建一个示例项目，演示如何将 `TabLayout` 组件与 `ViewPager2` 以及四个片段结合使用。\n\n\
  ## 46.3 创建 TabLayoutDemo 项目\n\n从欢迎界面选择 New Project 选项，在出现的新项目对话框中，选择 Basic Views\
  \ Activity 模板，点击 Next 按钮。\n\n在 `Name` 字段中输入 `TabLayoutDemo`，并指定 `com.ebookfrenzy.tablayoutdemo`\
  \ 为包名。在点击 Finish 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单改为 `Java`。\n\n项目创建完成后，在 Layout Editor 工具中加载 `content_main.xml` 文件，选择 `NavHostFragment`\
  \ 对象，然后将其删除。由于我们不会使用 Basic Views Activity 模板的导航功能，请编辑 `MainActivity.java` 文件并修改\
  \ `onCreate()` 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                     .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n最后，删除 `onSupportNavigateUp()`\
  \ 方法：\n\n```java\n@Override\npublic boolean onSupportNavigateUp() {\n    NavController\
  \ navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration)\n      \
  \     || super.onSupportNavigateUp();\n}\n```\n\n### 46.4 创建第一个片段\n\n`TabLayout`\
  \ 上的每个标签在选中时将显示不同的片段。在 Project 工具窗口中右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo`\
  \ 条目，选择 `New -> Fragment -> Fragment (Blank)` 来创建第一个片段。在弹出的对话框中，在 `Fragment Name:`\
  \ 字段中输入 `Tab1Fragment`，在 `Layout Name:` 字段中输入 `fragment_tab1`。\n\n![](img/as_4.2_new_fragment.jpg)\n\
  \nFragment\n\n编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有添加，请添加一个 `OnFragmentListener`\
  \ 声明：\n\n```java\nimport android.net.Uri;\n\npublic interface OnFragmentListener\
  \ {\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n在 Layout Editor 中加载新创建\
  \ `fragment_tab1.xml`（位于 `res -> layout` 下），右键点击 `FrameLayout` 条目并选择 `Convert FrameLayout`\
  \ 菜单选项。在弹出的对话框中，点击 OK 之前确认所有选项均已选中。将布局的 `ID` 改为 `constraintLayout`。\n\n一旦布局转换为 `ConstraintLayout`，删除\
  \ `TextView`。从 `Palette` 找到 `TextView` 小部件并将其拖放到布局中心。编辑对象的 `text` 属性为“Tab 1 Fragment”，提取字符串为名为\
  \ `tab_1_fragment` 的资源，然后点击 `Infer Constraints` 此时布局应与图 46-4 一致：\n\n![](img/as_3.5_tab_layout_fragment.jpg)\n\
  \n图 46-4\n\n### 46.5 复制片段\n\n目前项目包含了所需的片段。与其使用之前的步骤创建其余三个片段，不如复制第一个片段更快。每个片段由一个布局\
  \ XML 文件和一个 Java 类组成，两者都需要复制。\n\n在 Project 工具窗口中右键点击 `fragment_tab1.xml` 文件并选择 `Copy`\
  \ 选项。右键点击布局条目，这次选择 `Paste` 选项。在点击 OK 按钮之前，在对话框中将新布局文件命名为 `fragment_tab2.xml`。编辑新的\
  \ `fragment_tab2.xml` 文件并将 `TextView` 的文本更改为“Tab 2 Fragment”，按照相同步骤提取字符串为资源 `tab_2_fragment`。\n\
  \n要复制 `Tab1Fragment` 类文件，右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo` 下的类并选择\
  \ `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 条目并选择 `Paste`。在 Copy Class 对话框中，在\
  \ `New name:` 字段中输入 `Tab2Fragment` 并点击 OK。\n\n编辑新的 `Tab2Fragment.java` 文件并修改 `createView()`\
  \ 方法以加载 `fragment_tab2` 布局文件：\n\n```java\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // 加载此片段的布局\n\
  \    return inflater.inflate(R.layout.fragment_tab2, container, false);\n}\n```\n\
  \n\n\n\n再次重复上述复制步骤两次，即可为剩余两个 fragment 创建布局和类文件。完成这些步骤后，项目结构应与图 46-5 一致：\n\n![](img/as_tab_layout_files.jpg)\n\
  \n图 46-5\n\n### 46.6 添加 TabLayout 和 ViewPager2\n\n现在 fragment 创建过程已完成，下一步是在主活动布局文件中添加\
  \ `TabLayout` 和 `ViewPager2`。编辑 `activity_main.xml` 文件，并按照下方 XML 列表所示添加这些元素。注意，`TabLayout`\
  \ 组件嵌入到 `AppBarLayout` 元素中，而 `ViewPager2` 则放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.TabLayoutDemo.AppBarOverlay\"\
  >\n        <androidx.appcompat.widget.Toolbar\n            android:id=\"@+id/toolbar\"\
  \n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  ?attr/actionBarSize\"\n            android:background=\"?attr/colorPrimary\"\n \
  \           app:popupTheme=\"@style/Theme.TabLayoutDemo.PopupOverlay\" />\n    \
  \    <com.google.android.material.tabs.TabLayout\n            android:id=\"@+id/tabLayout\"\
  \n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  wrap_content\"\n            app:tabMode=\"fixed\"\n            app:tabGravity=\"\
  fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n    <androidx.viewpager2.widget.ViewPager2\n\
  \        android:id=\"@+id/view_pager\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        app:layout_behavior=\"\
  @string/appbar_scrolling_view_behavior\" />\n    <include layout=\"@layout/content_main\"\
  \ />\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_marginEnd=\"@dimen/fab_margin\"\n        android:layout_marginBottom=\"\
  16dp\"\n        app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n### 创建 Pager Adapter\n\n本示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 标签的 fragment。在布局资源中添加\
  \ `ViewPager2` 后，需要向项目中添加一个子自 `FragmentStateAdapter` 的新类，用于管理用户选择标签项时显示的 fragment。\n\
  \n在 Project 窗口中右键点击 `com.ebookfrenzy.tablayoutdemo`，选择 `New` -> `Class` 选项向项目添加新类。在新建类对话框中，在\
  \ `Name:` 字段输入 `PagerAdapter`，在列表中选择 `Class` 项并按下回车键。编辑 `PagerAdapter.java` 文件，内容如下：\n\
  \n```java\npackage com.ebookfrenzy.tablayoutdemo;\nimport androidx.annotation.NonNull;\n\
  import androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  public class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return Tab1Fragment();\n\
  \            case 1:\n                return Tab2Fragment();\n            case 2:\n\
  \                return Tab3Fragment();\n            case 3:\n                return\
  \ Tab4Fragment();\n            default:\n                return null;\n        }\n\
  \    }\n    @Override\n    public int getItemCount() {\n        return tabCount;\n\
  \    }\n}\n```\n\n该类声明为扩展 `FragmentStateAdapter` 类，并实现了一个构造函数，允许在创建实例时将所需的页数传递给类。当需要特定页面时将调用\
  \ `createFragment()` 方法。使用 `switch` 语句来识别请求的页码并返回相应的 fragment 实例。最后，`getItemCount()`\
  \ 方法简单的返回对象实例时传递的计数值。\n\n### 46.7 执行初始化任务\n\n剩余任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `PagerAdapter` 实例，并声明主活动类实现四个 fragment fragment 交互监听器。编辑 `MainActivity.java`\
  \ 文件，内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\nimport android.net.Uri;\n\
  import com.google.android.material.tabs.TabLayoutMediator;\npublic class MainActivity\
  \ extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentListener,\n \
  \   Tab2Fragment.OnFragmentListener,\n    Tab3Fragment.OnFragmentListener,\n   \
  \ Tab4Fragment.OnFragmentListener {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureTabLayout();\n\
  \    }\n    private void configureTabLayout() {\n        for (int i = 0; i < 4;\
  \ i++) {\n            tabLayout.addTab(tabLayout.newTab());\n        }\n       \
  \ final TabPagerAdapter adapter = new TabPagerAdapter(\n            this, tabLayout.getCount());\n\
  \        viewPager.setAdapter(adapter);\n        new TabLayoutMediator(tabLayout,\
  \ viewPager,\n            (tab, position) -> tab.setText(\"Tab \" + (position +\
  \ 1) + \" Item\")).attach();\n    }\n    @Override\n    public void onFragmentInteraction(Uri\
  \ uri) {\n    }\n}\n```\n\n代码通过以下方式创建四个标签并将它们添加到 `TabLayout`：\n\n```java\nfor (int\
  \ i = 0; i < 4; i++) {\n    tabLayout.addTab(tabLayout.newTab());\n}\n```\n\n接下来，创建\
  \ `PagerAdapter` 类的实例。注意创建 `PagerAdapter` 实例的代码将分配给 `TabLayout` 组件的标签数量传递了进去。然后将\
  \ `PagerAdapter` 实例赋值为 `ViewPager2` 的适配器：\n\n```java\nfinal TabPagerAdapter adapter\
  \ = new TabPagerAdapter(\n    this, tabLayout.getCount());\nviewPager.setAdapter(adapter);\n\
  ```\n\n最后，使用 `TabLayoutMediator` 类实例来连接 `TabLayout` 和 `ViewPager2` 对象：\n\n```java\n\
  new TabLayoutMediator(tabLayout, viewPager,\n    (tab, position) -> tab.setText(\"\
  Tab \" + (position + 1) + \" Item\")).attach();\n```\n\n该类确保 `TabLayout` 标签与当前 fragment\
  \ 保持同步。该过程的一部分包括确保每个标签上显示正确的文本。在这种情况下，文本被配置为“Tab <n> Item”，其中 <n> 被当前选择标签的数字替换。\n\
  \n### 46.8 测试应用程序\n\n编译并在设备或模拟器上运行程序，并确保选择标签会导致相应的 fragment 显示在屏幕的内容区域：\n\n![](img/as_tab_layout_running.jpg)\n\
  \n图 46-6\n\n### 46.9 定制 TabLayout\n\n\n\n\n\n此示例项目中的 `TabLayout` 使用固定模式（fixed mode）配置。这种模式适用于数量较少且标题较短的标签页。如图\
  \ 46-7 所示，当使用固定模式时，标签页数量过多或标题较长会迅速成为问题：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\
  图 46-7\n\n为了力求将标签页适应到可用的显示宽度内，`TabLayout` 使用了多行文本。尽管如此，第二行明显被截断了，导致无法看到完整的标题。解决此问题的最佳方案是将\
  \ `TabLayout` 切换到可滚动模式（scrollable mode）。在此模式下，标题将以全长度单行格式显示，允许用户通过水平滑动来查看所有可用的项，如图\
  \ 46-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n\n图 46-8\n\n要将 `TabLayout`\
  \ 切换到可滚动模式，只需将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”改为“scrollable”：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 以控制标签项的显示方式，以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在较宽的器（如横屏模式下的平板电脑）上更为明显。例如，设置为“fill”时，项将均匀分布在\
  \ `TabLayout` 的宽度上，如图 46-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n图 46-9\n\n\
  将属性值更改为“center”会导致项相对于标签栏的中心进行对齐：\n\n![](img/as_4.1_tab_layout_center.jpg)\n图 46-10\n\
  \n### 46.10 总结\n\n`TabLayout` 是作为 Android Material 设计实现的一部分引入的组件之一。`TabLayout` 组件的目的是展示一系列标签项，当选择这些项时，向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。与\
  \ `ViewPager2` 类和片段（fragments）结合时，可以很轻松地创建标签布局，每个标签项的选择都会显示不同的片段。\n\n## 47. 使用 RecyclerView\
  \ 和 CardView 控件\n\n`RecyclerView` 和 `CardView` 控件协同工作，为用户提供可滚的信息列表，其中信息以单个卡片的形式呈现。在介绍示例项目的设计和实现之前，本章将涵盖这两个类的详细信息。\n\
  \n### 47.1 RecyclerView 概述\n\n与标题为“悬浮操作按钮和 Snackbar”章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许以可滚列表的形式向用户展示信息。然而，`RecyclerView` 比 `ListView` 提供了许多优势。特别地，`RecyclerView`\
  \ 在管理组成列表的视图方面效率高得多，它实际上是在列表项滚动出屏幕时复用现有的列表项视图，而不是创建新的（因此命名为“recycler”，即回收器）。这既提高了性能，又减少了列表所消耗的资源，该功能在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，用于控制列表项向用户呈现的方式：\n\n*   `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg)\n图 47-1\n\n*   `GridLayoutManager`\
  \ – 列表项以网格形式呈现。当列表项大小一致时，使用此管理器最佳。\n\n![](img/Image2436.jpg)\n图 47-2\n\n*   `StaggeredGridLayoutManager`\
  \ - 列表项以交错网格格式呈现。当列表项大小不一时，使用此管理器效果最佳。\n\n![](img/Image2443.jpg)\n图 47-3\n\n对于这三个内置管理器都无法提供所需布局的情况，可以通过子类化\
  \ `RecyclerView.LayoutManager` 类来实现自定义的布局管理器。\n\n在 `RecyclerView` 中显示的每个列表项都是作为\
  \ `ViewHolder` 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\
  \n与 `ListView` 一样，`RecyclerView` 依赖适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间的中介。适配器被创建为\
  \ `RecyclerView.Adapter` 类的子类，并且至少必须实现以下方法，这些方法由分配给适配器的 `RecyclerView` 对象在不同时间点调用：\n\
  \n*   `getItemCount()` – [方法描述]\n*   `onCreateViewHolder()` – 此方法创建并返回一个带有用于显示数据的视图的\
  \ `ViewHolder` 对象。该视图通常通过加载 XML 布局创建。\n*   `onBindViewHolder()` – 此方法接收由 `onCreateViewHolder()`\
  \ 创建的 `ViewHolder` 对象以及指示即将显示的列表项的整数。`ViewHolder` 对象中包含了由 `onCreateViewHolder()`\
  \ 分的布局。`onBindViewHolder()` 方法的职责是填充布局中的视图并将其返回给 `RecyclerView`。\n\n向布局中添加 `RecyclerView`\
  \ 只需将相应的元素添加到其所在的 Activity 内容文件中即可。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    app:layout_behavior=\"\
  @string/appbar_scrolling_view_behavior\"\n    tools:context=\".MainActivity\"\n\
  \    tools:showIn=\"@layout/activity_demo\">\n\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上述示例中，`RecyclerView` 已嵌入主 Activity 布局文件的 `CoordinatorLayout` 中，并带有 `AppBar`\
  \ 和 `Toolbar`。这提供了一些额外功能，例如当用户在 `RecyclerView` 内向上滚动时，配置 `Toolbar` 和 `AppBar` 滑出屏幕（该主题在“使用\
  \ AppBar 和折叠 Toolbar 布局的章节中有更详细的介绍）。\n\n### 47.2 CardView 概述\n\n\n\n\n\n`CardView`\
  \ 类是一种界面视图，允许使用卡片隐喻来分组展示信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为显示阴影效果和圆角。例如，图\
  \ 47-4 显示了三个 `CardView` 实例，它们被配置为显示一个包含 `ImageView` 和两个 `TextView` 的布局：\n\n![](img/Image24512.jpg)\n\
  \n图 47-4\n\n要用 `CardView` 实例呈现的用户界面布局定义在 XML 布局资源文件文件中，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂度的布局，可以使用 `RelativeLayout` 和 `LinearLayout` 等标准布局管理器。以下 XML 布局文件表示一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。卡片被配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_margin=\"5dp\"\n    card_view:cardCornerRadius=\"12dp\"\n \
  \   card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"4dp\">\n   \
  \ <RelativeLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\" >\n        <ImageView\n       \
  \     android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \n            android:id=\"@+id/item_image\"\n            android:layout_alignParentLeft=\"\
  true\"\n            android:layout_alignParentTop=\"true\"\n            android:layout_marginRight=\"\
  16dp\" />\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n\
  当与 `RecyclerView` 结合创建一个可滚动的卡片列表时，复用器的 `onCreateViewHolder()` 方法会膨胀卡片的布局资源文件，将其分配给\
  \ `ViewHolder` 实例并返回给 `RecyclerView` 实例。\n\n### 47.3 总结\n\n本章介绍了 Android 的 `RecyclerView`\
  \ 和 `CardView` 组件。`RecyclerView` 提供了一种资源高效的方式，用于在 Android 应用中显示可滚动的视图列表。当以卡片形式呈现组数据（例如名称和地址列表）时，`CardView`\
  \ 非常有用。正如之前概述，并在下一章的教程中所演示的，`RecyclerView` 和 `CardView` 结合使用时特别有用。\n\n## 48. Android\
  \ RecyclerView 和 CardView 教程\n\n在本章中，将创建一个示例项目，该项目将同时利用 `CardView` 和 `RecyclerView`\
  \ 组件创建一个可滚动的卡片列表。完成后的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片将向用户显示消息，指示用户点击了哪张卡片。\n\
  \n### 48.1 创建 CardDemo 项目\n\n从欢迎界面选择“新项目”（New Project）选项，在生成的项目项目对话框中，点击“下一步”按钮之前选择“Basic\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击“完成”按钮之前，将最小 API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言设置为 `Java`。\n\n\
  ### 48.2 修改 Basic Views Activity 项目\n\n由于选择了 Basic Views Activity，布局中包含一个悬浮操作按钮，这对于本项目来说不是必需的。在布局编辑器中加载\
  \ `activity_main.xml` 布局文件，选择悬浮操作按钮并按键盘删除键将该对象从布局中删除。编辑 `MainActivity.java` 文件，如下所示从\
  \ `onCreate` 方法中删除悬浮操作按钮和导航器的代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with own action\", Snackbar.LENGTH_LONG).setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n同样，删除 `onSupportNavigateUp()` 方法，然后打开 `content_main.xml`\
  \ 文件并从布局中删除 `nav_host_content_main` 对象，只保留 `ConstraintLayout`。\n\n### 48.3 设计 CardView\
  \ 布局\n\n卡片内视图的布局将在单独的 XML 布局文件中定义。在 Project 窗口中，右键点击 `app -> res -> layout` 条目并选择\
  \ `New -> Layout Resource File` 。在新资源对话框中，在点击 `OK` 按钮之前，在 `File name:` 字段中输入 `card_layout`\
  \ 并在 `root element` 字段中输入 `androidx.cardview.widget.CardView`。\n\n用布局编辑器加载 `card_layout.xml`\
  \ 文件，切换到代码模式并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n### 48.4 添加 RecyclerView\n\n\n\n\n\
  选择 `content_main.xml` 布局文件，并将调色板的 `Containers` 部分拖入一个 `RecyclerView` 对象到布局中，使其位于屏幕中心，此时它将自动调整大小以填充整个屏幕。使用\
  \ `Infer` 约束工具栏按钮为该视图添加任何缺失的布局约束。使用 `Attributes` 工具窗口将 `RecyclerView` 实例的 ID 更改为\
  \ `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\
  \n### 48.5 添加图片文件\n\n除了两个 `TextView` 之外，卡片布局还包含一个 `ImageView`，Recycler 适配器已配置为在该显示图像。在测试项目之前，必须添加这些图像。项目将使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 提供的示例代码下载后的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/flamingojava/index.php`](https://www.ebookfrenzy.com/retail/flamingojava/index.php)\n\
  \n在操作系统的文件导航器中找到这些图像，并选择复制这八张图像。在 `Project` 工具窗口中右键点击 `app` -> `res` -> `drawable`\
  \ 项，并选择 `Paste` 将文件添加到文件夹中：\n\n![](img/Image24252.jpg)\n\n图 48-1\n\n### 48.6 创建\
  \ RecyclerView 适配\n\n如上一节所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在 `Project` 工具窗口中右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.carddemo` 项，并选择 `New` -> `Java Class` 选项将此新类添加到项目中。在新类对话框中，在\
  \ `Name` 字段中输入 `RecyclerAdapter`，并在列表中选择 `Class`，然后按键盘上的 `Return` 创建新的 Java 类文件。\n\
  \n编辑新的 `RecyclerAdapter.java` 文件以添加一些导入指令，并声明该类现在扩展 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如向适配器添加一些基础数组，作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final private String[] titles = {\"Chapter One\",\n                \"Chapter\
  \ Two\",\n                \"Chapter Three\",\n                \"Chapter Four\",\n\
  \                \"Chapter Five\",\n                \"Chapter Six\",\n         \
  \       \"Chapter Seven\",\n                \"Chapter Eight\"};\n    final private\
  \ String[] details = {\"Item one details\",\n                \"Item two details\"\
  , \"Item three details\",\n                \"Item four details\", \"Item five details\"\
  ,\n                \"Item six details\", \"Item seven details\",\n             \
  \   \"Item eight details\"};\n    final private int[] images = { R.drawable.android_image_1,\n\
  \                                   R.drawable.android_image_2,\n              \
  \                     R.drawable.android_image_3,\n                            \
  \       R.drawable.android_image_4,\n                                   R.drawable.android_image_5,\n\
  \                                   R.drawable.android_image_6,\n              \
  \                     R.drawable.android_image_7,\n                            \
  \       R.drawable.android_image_8 };\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要配置\
  \ `ViewHolder` 类的实现以引用 `card_layout.xml` 中的视图元素。留在 `RecyclerAdapter.java` 文件中，按如下方式实现此类：\n\
  \n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n      \
  \  ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n}\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个构造方法，该方法通过引用对\
  \ `card_layout.xml` 文件中视图项的引用来初始化这些变量。要添加到 `RecyclerAdapter.java` 文件的下一个项是 `onCreateViewHolder()`\
  \ 方法的实现：\n\n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup\
  \ viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n\
  \            .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n此方法将由 `RecyclerView` 调用以获取 `ViewHolder` 对象。它填充视图层级 `card_layout.xml` 文件，并创建一个带有视图层级的\
  \ `ViewHolder` 类实例，然后将其返回给 `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是向 `ViewHolder`\
  \ 对象中的视图层级填充要显示的数据。它接收一个 `ViewHolder` 对象和一个表示要显示的列表项的整数值。使用项编号作为索引进入数据数组。此数据随后通过\
  \ `ViewHolder` 构造方法创建的引用显示在布局上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器的最后一个要求是 `getItemCount()`\
  \ 方法的实现，在此情况下它返回 `titles` 数组的长度：\n\n```java\n@Override\npublic int getItemCount()\
  \ {\n    return titles.length;\n}\n```\n\n### 48.7 初始化 RecyclerView 组件\n\n此时项目包含\
  \ `RecyclerView` 实例、`CardView` 实例的 XML 布局文件以及 `RecyclerView` 的适配器。测试之前的最后一步是使用布局管理器初始化\
  \ `RecyclerView`，创建适配器实例并将其分配给 `RecyclerView` 对象。对于本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager`\
  \ 布局选项。\n\n这里有一个复杂之处，因为我们需要在 `MainActivity` 类中使用视图绑定访问 `recyclerView` 组件。问题是 `recyclerView`\
  \ 包含在 `content_main.xml` 文件中，而该文件又包含在 `activity_main.xml` 中。为了能够进入 `content_main.xml`\
  \ 文件，我们需要在包含时为其分配一个 ID。为此，编辑 `activity_main.xml` 文件并修改 `include` 元素，使其如下所示：\n\n\
  ```xml\n<include\n    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\"\
  \ />\n```\n\n为包含的文件分配 ID 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n`binding.contentMain.recyclerView`\n\
  \n现在编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法来实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setSupportActionBar(toolbar);\n\
  \        layoutManager = new LinearLayoutManager(this);\n```\n\n\n\n\n```java\n\
  binding.contentMain.recyclerView.setLayoutManager(layoutManager);\nadapter = new\
  \ RecyclerAdapter();\nbinding.contentMain.recyclerView.setAdapter(adapter);\n}\n\
  ```\n\n### 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n### 48.9 响应卡片选择\n\n此项目的最后一个阶段是使列表中的卡片变为可选择，这样点击卡片即可触发应用内部的事件。在本示例中，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，以便为每个项目视图分配一个 `onClickListener`。编辑 `RecyclerAdapter.java` 文件并修改\
  \ `ViewHolder` 类声明，使其内容如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体内部，现在可以添加代码来显示指示卡片已被点击的消息。由于由于点击后执行的操作可能取决于点击了哪张卡片，因此识别所选卡片也同样重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。在保持 `RecyclerAdapter.java`\
  \ 文件不变，向 `onClick` 处理程序添加代码，使其内容如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n});\n```\n\n最后一个任务是启用 Android 应用中点击项目时出现的 Material Design\
  \ 波纹效果（ripple effect）。这仅涉及在 `card_layout.xml` 文件的 `CardView` 实例声明中添加一些属性，如下：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n再次运行应用并验证点击列表中的卡片是否会同时触发接触处的标准波纹效果，以及显示报告所选项目编号的 `Snackbar`。\n\n\
  ### 48.10 总结\n\n本章详细介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片式项目列表的步骤。示例还涵盖了对列表项目的点击检测，包括识别所选项目以及在被点击的\
  \ `CardView` 实例上启用波纹效果视觉反馈。\n\n## 49. 布局编辑器示例数据教程\n\n在前章节中创建的 `CardDemo` 项目提供了如何使用布局编辑器设计用户界面的示例。长期以来，Android\
  \ Studio 布局编辑器一直提供了在不运行应用的情况下预览数据的功能。\n\n### 49.1 向项目中添加示例数据\n\n在布局设计阶段，可以为 `RecyclerView`\
  \ 实例填充示例数据。要查看这些数据的运行效果，请将 `content_main.xml` 文件加载到布局编辑器。选择 `RecyclerView` 并选择 `Sample\
  \ Data` 选项以显示设计时属性：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\n图 49-2\n\n\
  将模板更改为 `Email` 选项并将项目计数更改为 `12`，注意 `RecyclerView` 发生了变化以显示数据：\n\n![](img/as_3.6_recyclerview_sample_data.jpg)\n\
  \n图 49-3\n\n这些模板对于无需额外工作即可进行设计非常有用。但是对于本示例，布局中使用示例数据。在 `content_main.xml` 文件仍加载的情况下，切换到\
  \ Code 模式并找到 `RecyclerView` 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意配置的两个特殊 `tools` 属性显示 12 个项目，每个项目使用名为 `recycler_view_item` 的文件中的布局。虽然这些设置的全部介绍不在本书范围内，但可以在以下\
  \ URL 找到每个设置的完整描述：\n\nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述的 `recycler_view_item` 文件是在选择示例数据模板时由布局编辑器自动生成的，可以在项目窗口中找到。切换回 Design 模式，选中\
  \ `RecyclerView`，使用设计时视图属性面板将模板切换回默认设置。`recycler_view_item` 文件将连同 `content_main.xml`\
  \ XML 文件中的两个 tools 属性行一起从项目中移除。\n\n\n\n\n\n要切换到使用卡片布局显示示例数据，请添加一个 `listitem` 属性以引用\
  \ `card_layout.xml` 文件。在布局中选中 `RecyclerView` 后，在 `Attributes` 工具窗口中搜索 `listitem`\
  \ 属性，并在属性字段中输入如 图 49-4 所示的 `@layout/card_layout`：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\
  \n图 49-4\n\n注意，现在每个列表项上都显示了卡片布局，尽管没有任何图像且使用的是示例文本数据：\n\n![](img/as_sample_data_cards.jpg)\n\
  \n图 49-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这可以通过布局编辑器提供的模板示例数据形式实现，也可以专门为此项目添加自定义的示例数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器中，选择 `ImageView` 并按本章早些所述显示设计时视图属性（Design-time View\
  \ Attributes）面板。从 `srcCompat` 菜单中，选择如下文 图 49-6 所示的内置 `backgrounds/scenic` 图像集：\n\
  \n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\n图 49-6\n\n接下来，右键点击\
  \ `itemTitle` TextView` 对象，选择 `Set Sample Data`（设置示例数据）菜单选项，并在设计时属性面板中选择 `cities`\
  \ 文本选项。对 `itemDetail` 视图重复此步骤，这次选择 `full_names` 选项，如 图 49-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\
  \n图 49-7\n\n在设计模式打开 `content_main.xml` 文件，注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\n图 49-8\n\n### 49.2 使用自定义示例数据\n\
  \n本章的最后一步是在布局编辑器中演示自定义示例数据和图像的使用。这需要创建一个示例数据目录并添加一些文本和图像文件。在 `Project` 工具窗口中，右键点击\
  \ `app` 条目并选择 `New -> Sample Data Directory`（新建 示例数据目录）菜单选项，此时 `Project` 工具窗口中会出现一个名为\
  \ `sampledata` 的新目录。如果看不到新文件夹，请将 `Project` 工具窗口从 `Android` 模式切换到 `Project` 模式，并在\
  \ `CardDemo -> app` 下找到该文件夹，如 图 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\
  \n图 49-9\n\n右键点击 `sampledata` 目录，创建一个名为 `images` 的子目录，并按照上一章概述的相同步骤将 Android 图像复制粘贴到新文件夹中。在\
  \ `card_layout.xml` 文件中再次显示 `ImageView` 的设计时视图属性面板，这次点击 `Browse`（浏览）链接并在 `Resources`\
  \ 对话框中选择新添加的 Android 图像（如果 `images` 文件夹未出现，请重新构建项目）：\n\n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\
  \n图 49-10\n\n再次右键点击 `sampledata` 目录，选择 `New -> File`（新建 文件）选项，将文件命名为 `chapters`\
  \ 并输入以下内容：\n\n```\nChapter One\nChapter Two\nChapter Three\nChapter Four\nChapter\
  \ Five\nChapter Six\nChapter Seven\nChapter Eight\n```\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\
  \n```\nItem one details\nItem two details\nItem three details\nItem four details\n\
  Item five details\nItem six details\nItem seven details\nItem eight details\n```\n\
  \n创建示例数据文本文件后，只需在 card_layout.xml` 文件的视图元素中按所示引用它们：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/itemTitle\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  39dp\"\n    android:layout_marginStart=\"16dp\"\n    android:textSize=\"30sp\"\n\
  \    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"\
  @sample/chapters\" />\n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"16dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:layout_marginTop=\"8dp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n    tools:text=\"@sample/items\"\
  \ />\n```\n\n### 49.3 总结\n\n本章演示了在布局编辑器中使用示例数据，以便更真实地呈现用户界面的外观。教程涵盖的步骤包括使用现有的示例数据模板以及集成示例数据。\n\
  \n## 50 使用 AppBar 和折叠工具栏布局\n\n在本章中，我们将探索如何自定义 Activity 中的 AppBar，并使其对其他视图中发生的滚动事件做出反应。通过结合\
  \ `CoordinatorLayout`、`AppBarLayout` 和 `CollapsingToolbarLayout`，可以配置 AppBar 显示图像并执行淡入淡出动画。例如，可以配置列表的向上滚动使\
  \ AppBar 消失，并在向下滚动时重新出现。\n\n从概述组成 AppBar 的元素开始，本章将将介绍各种 AppBar 配置的示例。\n\n### 50.1\
  \ AppBar 的结构\n\nAppBar 是应用程序运行时显示在屏幕顶部的区域，可以配置包含各种不同的项目，包括状态栏、工具栏、标签栏和灵活区域。例如，图\
  \ 50-1 所示了一个包含状态栏、工具栏和标签栏的 AppBar：\n\n![](img/Image24271.jpg)\n\n图 50-1\n\n灵活区域可以使用空白背景色填充，也可以如\
  \ 图 50-2 所示，显示在 `ImageView` 对象上的图像：\n\n![](img/Image24361.jpg)\n\n图 50-2\n\n正如本章其余部分将演示的，如果\
  \ Activity 用户界面布局的主内容区域包含可滚动内容，可以配置 AppBar 的元素随屏幕内容的滚动而进行展开和收缩。\n\n### 50.2 示例项目\n\
  \n为了本示例，将对在早前的章节 Android RecyclerView 和 CardView 教程”(#RecyclerView_Tutorial.xhtml__idTextAnchor980)\
  \ 中创建的 `CardDemo` 项目进行修改。首先启动 Android Studio 并加载该项目。\n\n项目加载后，运行应用程序并注意向上滚动列表时，工具栏如\
  \ [图 50-3 所示保持可见：\n\n\n\n\n\n![](img/Image24431.jpg)\n\n图 50-3\n\n第一步是进行一些配置更改，使得工具栏在向上滚动时收起，在向下滚动时展开。\n\
  \n### 50.3 协调 RecyclerView 和 Toolbar\n\n将 `activity_main.xml` 文件加载到布局编辑器（Layout\
  \ Editor）工具中，切换到代码（Code）模式并查看 XML 布局设计，其层级结构如图图 50-4 所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 50-4\n\n层级的顶层是 `CoordinatorLayout`，顾其实名，它协调其包含的各种子视图元素之间的交互。例如，在“使用浮动按钮和 Snackbar”\
  \ 中提到的，当 `Snackbar` 出现时，`CoordinatorLayout` 会自动将浮动按钮向上滑动以适应它的出现，然后在状态栏消失后将按钮移回。\n\
  \n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏的元素滑入或滑出视图。图 50-4 所示所示层级结构中的其中一个元素是\
  \ `ConstraintLayout`。为了实现这种协调行为，必须在发生滚动的元素以及与滚动进行协调的元素上都设置属性。\n\n在滚动元素上（在本例中为 `RecyclerView`），必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已通过默认值设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意视图层级结构中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了让工具栏对 `RecyclerView` 中发生的滚动事件做出反应，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给此属性的值取决于所需的交互性质，并且必须由以下一个或多个选项组成：\n\n- `scroll`: 表示视图将滚动到屏幕外。如果不设置此项，视图在滚动事件期间将固定在屏幕顶部。\n\
  - `enterAlways`: 当与 `scroll` 选项配合使用时，向上滚动动作会导致视图收回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n-\
  \ `enterAlwaysCollapsed`: 当在视图上设置此项时，在向下滚动动作达到列表限制之前，该视图将不会从折叠状态展开。如果设置了 `minHeight`\
  \ 属性，视图将在初始滚动过程中出现，但仅到达到最小高度为止。随后它将保持在该高度，在到达列表顶部之前不会完全展开。注意，此选项仅在同时配合 `enterAlways`\
  \ 和 `scroll` 选项时才有效。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n\n- `exitUntilCollapsed`: 设置后，视图在向上滚动期间将折叠，直到达到\
  \ `minHeight` 阈值，在该点，它将保持在该高度，直到滚动方向改变。\n\n为了本例的目的，将对 `Toolbar` 上如下设置 `scroll` 和\
  \ `enterAlways` 选项：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n    app:layout_scrollFlags=\"scroll|enterAlways\"\
  \ />\n```\n\n设置好相应的属性后，再次运行应用程序，并在 `RecyclerView` 列表中执行向上滚动动作。这应该导致工具栏收起并移出视图（图\
  \ 50-5）。向下滚动动作应该导致工具栏重新出现。\n\n![](img/Image2459.jpg)\n\n图 50-5\n\n### 50.4 引入折叠工具栏布局\n\
  \n`CollapsingToolbarLayout` 容器通过提供更多选项以及对响应协调滚动动作的应用栏及其子元素折叠进行更深层次的控制，增强了标准工具栏的功能。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加，并提供诸如当工具栏折叠和展开时自动调整工具栏标题字体大小等功能。`parallax` 模式允许应用栏中的指定内容在折叠时从视图中淡出，而\
  \ `pin` 模式则允许应用栏的元素保持在固定位置。还有一个 `scrim` 选项用于指定工具栏在折叠期间过渡的颜色。\n\n为了演示这些功能，`activity_main.xml`\
  \ 文件中的应用栏将修改为使用 `CollapsingToolbarLayout`，并结合 `ImageView` 以演示 `parallax` 模式的效果。使用\
  \ `CollapsingToolbarLayout` 的新视图层级如图图 5-6 所示：\n\n![](img/3.0_appbar_collapsing_tree.jpg)\n\
  \n图 5-6\n\n在布局编辑器中加载 `activity_main.xml` 文件并修改布局使其内容如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.coordinator.widget.CoordinatorLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
