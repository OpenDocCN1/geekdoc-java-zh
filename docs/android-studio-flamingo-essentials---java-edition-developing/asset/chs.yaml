  \ `text` 属性显示为“Send”。配置 `onClick` 属性调用名为 `sendText` 的方法。接下来，添加一个 `EditText` 对象，使其水平居中并位于\
  \ `TextView` 上方。使用 `Attributes` 工具窗口将“Hello World!” `TextView` 设置为 `editText1`。布局完成后，点击\
  \ `Infer constraints` 按钮添加相应的约束：\n\n图片 1（此处对应原文中的图片占位符）\n\n最后，在布局编辑器的右上角点击 `intent`，并将“Send\
  \ Text”字符串提取为名为 `send_text` 的资源。布局完成后，用户界面应如 图 54-2 所示：\n\n图片 2\n\n## 54.3 创建第二个\
  \ Activity 类\n\n当点击“Send Text”按钮时，将发出 `intent` 请求启动一个可以响应的 Activity。因此，下一步是创建第二个\
  \ Activity。在 `Project` 工具窗口中右键点击 `com.ebookfrenzy.explicitintent` 包（位于 `app -> java`），选择\
  \ `New -> Activity -> Empty Views Activity` 选项，如 图 54-3 所示：\n\n图片 3\n\n在 `Activity\
  \ Name` 字段中输入 `SecondActivity`，并在 `Title` 字段中命名布局文件 `activity_second`，将 `Language`\
  \ 菜单改为 `Java`。由于此 Activity 不会在应用程序启动时启动（而是通过 `MainActivity` 启动），在点击 `Finish` 按钮之前，确保禁用\
  \ `Launcher Activity` 选项。\n\n## 54.4 设计 SecondActivity 的用户界面布局\n\n第二个 Activity 的用户界面元素需要\
  \ `EditText`、`TextView` 和 `Button` 。根据这些要求，将 `activity_second.xml` 布局加载到编辑器并添加视图。在设计过程中，注意按钮的\
  \ `onClick` 属性已配置为调用 `returnText` 方法，`TextView` 和 `EditText` 分别分配了 ID `textView2`\
  \ 和 `editText2`。完成后，布局应如 图 54-4 所示。注意按钮上的文本（Return）已提取为名为 `return_text` 的字符串。布局完成后，点击约束按钮添加：\n\
  \n图片 4\n\n## 54.5 检查应用程序文件\n\n为了 `MainActivity` 能够通过 `intent` 启动 `Second`，`AndroidManifest.xml`\
  \ 文件中必须存在 `SecondActivity` 的条目。在 `Project` 窗口（`app -> manifests`）中找到该文件，双击将其加载到编辑器并验证\
  \ Android Studio 已自动添加了该 Activity 条目：\n\n（此处为 XML 代码块，保持原样）\n\n\n\n\n</application>\n\
  \n</manifest>\n\n在清单文件中创建并列出第二个活动后，现在是时候在 `MainActivity` 类中编写代码来发布该意图（intent）了。\n\
  \n### 54.6 创建意图\n\n`MainActivity` 的目标是在用户点击“发送文本”（Send Text）按钮时创建并启动一个 `intent`。在创建意图的过程中，用户输入到\
  \ `EditText` 视图中的问题字符串将以键值对的形式添加到 `intent` 对象中。在创建 `MainActivity` 的用户界面布局时，按钮对象已配置为在用户“点击”时调用名为\
  \ `sendText()` 的方法。现在需要将此方法添加到 `MainActivity` 类源文件 `MainActivity.java` 中，如下：\n\n\
  ```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n\n.\n\nimport android.content.Intent;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public\
  \ void sendText(View view) {\n        Intent i = new Intent(this, SecondActivity.class);\n\
  \        String myString = binding.editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循了“Android 意图概述”中概述的技术。首先，创建了一个新的 `Intent` 实例，并将当前活动和 `SecondActivity` 的类名作为参数传递。接下来，将输入\
  \ `EditText` 对象的文本以键值对的形式添加到 `intent` 对象中，并通过调用 `startActivity()` 启动该 `intent`，并将\
  \ `intent` 对象作为参数传递。\n\n编译并运行应用程序，点击“发送文本”按钮以启动 `SecondActivity`。使用返回按钮（位于显示屏底部的工具栏中）或在较新的\
  \ Android 版本上从屏幕边缘向右滑动返回 `MainActivity` 屏幕。\n\n## 54.7 提取意图数据\n\n现在 `SecondActivity`\
  \ 已经从 `MainActivity` 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给 `SecondActivity`\
  \ 用户界面中的 `TextView` 对象。这除了适配活动以使用视图绑定（view binding）之外，还需要在 `SecondActivity.java`\
  \ 源文件的 `onCreate()` 方法中添加一些代码：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.content.Intent;\nimport android.view.View;\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“发送文本”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n## 54.8 作为子活动启动 SecondActivity\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，以便在 `SecondActivity` 返回时调用。此回调将提取 `SecondActivity`\
  \ 返回的数据并将其显示在 `textView1` 上。\n\n`registerForActivityResult()` 的调用返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 中调用它来启动意图。编辑 `MainActivity.java` 文件，使其如下：\n\n```java\n.\n\
  .\nimport android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n.\n.\npublic\
  \ class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startActivity(i);\n        startForResult.launch(i);\n   \
  \ }\n}\n.\n```\n\n## 54.9 从子活动返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而\
  \ `MainActivity` 反之已被修改以处理来自 `SecondActivity` 的数据。只需修改 `SecondActivity.java` 以实现\
  \ `finish()` 方法并添加一个名为 `returnText()` 的方法。`finish()` 方法在活动退出时触发（例如当用户选择返回按钮时）：\n\
  \n```java\npublic void returnText(View view) {\n    finish();\n}\n\n@Override\n\
  public void finish() {\n    Intent data = new Intent();\n    String returnString\
  \ = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\", returnString);\n\
  \    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n`finish()` 方法创建一个新的\
  \ `intent`，将返回数据作为键值对添加，然后调用 `setResult()` 方法，传递结果代码和 `intent` 对象。`returnText()`\
  \ 方法简单调用 `finish()` 方法。\n\n打开 `activity_second.xml` 文件，选择按钮小部件，并配置 `onClick` 属性调用\
  \ `returnText()` 方法。\n\n### 54.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段中输入问题并点击“发送文本”按钮。当\
  \ `SecondActivity` 出现时，向 `EditText` 视图输入文本并使用返回按钮或“返回文本”按钮返回 `MainActivity`，响应应该出现在文本对象中。\n\
  \n### 54.11 总结\n\n在上一节涵盖了意图的基础知识后，本章的目标是通过在 Android Studio 中创建一个应用程序项目，来演示显式意图的使用以及父活动与子活动之间数据传输的概念。\n\
  \n下一节将通过一个示例来演示隐式意图的用法。\n\n## 55. Android 隐式意图 – 实例演示\n\n在本章中，将在 Android Studio\
  \ 中创建一个示例应用程序，设计用于演示隐式意图的实际实现。目标是创建并发送一个 `intent`，请求加载并向用户显示特定网页的内容。由于示例应用程序本身不包含能够执行此任务的活动，将发布一个隐式\
  \ `intent`，以便让 Android 意图解析算法识别并启动另一个应用程序中合适的活动。这最可能是 Android 操作系统自带的 Chrome 浏览器的活动。\n\
  \n\n\n\n\n在成功启动内置浏览器后，将创建一个新项目，该项目也将包含一个能够显示网页的活动。此项目将安装到设备或模拟器上，并用于演示隐式许可（implicit\
  \ intents）和链接验证的使用。\n\n## 55.1 创建 Android Studio 隐式许可示例项目\n\n从欢迎界面选择 `New Project`\
  \ ，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `ImplicitIntent`，并将包名指定为\
  \ `com.ebookfrenzy.implicitintent`。由于示例将使用最新 Android 版本的功能，在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 31: Android 12.0 (S)`，并将 `Language` 菜单改为 `Java`。\n\n### 55.2\
  \ 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个 `ConstraintLayout` 和两个 `Button` 对象组成。在\
  \ Project 工具窗口中找到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到 Layout\
  \ Editor 工具中。\n\n删除默认的 `TextView`，开启 `Autoconnect` 模式，将 `Button` 控件放置在布局中，使其显示如下：\n\
  \n![](img/as_implicit_intent_ui.jpg)\n\n图 55-1\n\n分别将按钮上的文本设置为 `Show Web Page` 和\
  \ `Enable Links`，并将文本提取到字符串资源中。\n\n依次选择每个 `Button` 并使用 `Attributes` 工具窗口配置 `onClick`\
  \ 属性，以分别调用名为 `showWebPage` 和 `enableLink` 的方法。\n\n## 55.3 创建隐式许可\n\n如上所述，隐式许可将在名为\
  \ `showWebPage()` 的方法内部创建并发布，该方法随后需要在 `MainActivity` 类中实现，其代码位于 `MainActivity.java`\
  \ 源文件中。在 Project 工具窗口中找到该文件并双击它将其加载到编辑面板中。加载后，修改代码添加 `showWebPage()` 和 `enableLink()`\
  \ 方法以及一些必要的导入：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.net.Uri;\n\nimport android.content.Intent;\n\
  \nimport android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_implicit_intent);\n\
  \    }\n\n    public void showWebPage(View view) {\n        Intent intent = new\
  \ Intent(Intent.ACTION_VIEW,\n                    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n        startActivity(intent);\n    }\n\n    public void enableLink(View view)\
  \ {\n    }\n}\n```\n\n`showWebPage()` 方法执行的任务实际上非常简单。首先，创建了一个新的 `intent` 对象。然而，代码并没有指定许可的类名，而是使用\
  \ `ACTION_VIEW` 选项指示了许可的性质（向用户显示某些内容）。许可对象还包含一个包含要显示的 URL 的 `URI`。这告诉 Android 许可解析系统，该活动正在请求显示网页。然后通过调用\
  \ `startActivity()` 方法发布该许可。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，一旦运行，触摸 `Show Web Page`\
  \ 按钮。触摸时，应该出现一个浏览器视图并加载由 URL 指定的网页。一个成功的隐式许可现在已执行。\n\n## 55.4 添加第二个匹配的活动\n\n本章的剩余部分将用于演示当设备上安装了多个符合隐式许可要求的活动时产生的效果。为了实现这一点，将创建第二个应用程序并安装到设备或模拟器上。首先在\
  \ Android Studio 中创建一个新项目，应用程序名称设置为 `MyWebView`，使用与本章之前创建 `ImplicitIntent` 项目时相同的\
  \ `SDK` 配置选项，并再次选择 `Empty Views Activity`。\n\n如果你有一个可以用于托管数字资产链接（Digital Asset Links）文件的网站，并想尝试自动验证，则请在指定包名时使用您的网站\
  \ URL。例如，如果您的网站托管在 `www.mycompany.com`，则包名需要设置如下：\n\n`com.mycompany.mywebview`\n\
  \n如果您没有网站或不计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\n点击 `Finish` 创建项目，然后按照节\
  \ 11.8 将项目迁移到 View Binding 中所述将项目转换为使用 view bindings。\n\n## 55.5 为 UI 添加 Web View\n\
  \n`MyWebView` 活动的用户界面将包含 `WebView` 实例。在 Project 工具窗口中，找到 `activity_main.xml` 文件并双击将其加载到\
  \ Layout Editor。在设计模式下，删除 `TextView` 控件。\n\n从调板中将 `WebView` 对象拖到 `ConstraintLayout`\
  \ 视图中，所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 55-2\n\n在继续之前，使用删除键从布局中移除。\n\
  \n## 55.6 获取许可 URL\n\n当创建隐式许可对象以显示浏览器窗口时，要显示的网页 URL 将封装在许可对象的 `Uri` 中。`MainActivity`\
  \ 类中 `onCreate()` 方法的任务是从许可中提取此 `Uri`，将其转换为 URL。为了实现此功能，修改 `MainActivity.java` 文件使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.mywebview;\n\nimport java.net.URL;\nimport android.net.Uri;\n\
  import android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(),\n                    data.getHost(),\n\
  \                    data.getPath());\n        } catch (Exception e) {\n       \
  \     e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n`MyWebView` 项目的编码部分现在已完成。只需修改清单文件。\n\n## 55.7 修改 MyWebView 项目清单文件\n\
  \n在测试之前，必须对 `MyWebView`清单文件进行若干更改。首先，该活动需要访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加适当的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n\n\n\n此外，查看 `MyWebView` 项目中 `AndroidManifest.xml` 文件意图过滤器（intent filter）部分的内容，将发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n在上述 XML 中，`android.intent.action.MAIN` 表示该 activity 在在没有任何数据输入的情况下启动时是应用程序的入口点。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该 activity 应该列在设备的应用程序启动器屏幕中。\n\n由于该 activity 不需要作为应用程序的入口启动，无法在没有数据输入（在此例中为\
  \ URL）的情况下运行，且不需要在启动器中出现，因此该 activity 的清单文件中不需要 `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity`\
  \ activity 的意图过滤器需要进行修改，以表明它能够处理针对 http 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求，任何能够处理隐式意图（implicit\
  \ intents）且不包含 `MAIN` 和 `LAUNCHER` 条目的 activity，还必须在意图过滤器中包含所谓的可浏览（browsable）和默认（default）类别。因此，修改后的意图过滤器部分应如下，其中\
  \ `<website url>` 被替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你在创建 `MyWebView` 项目时使用的包名：\n\
  \n```xml\n<intent-filter android:autoVerify=\"true\">\n    <action android:name=\"\
  android.intent.action.VIEW\" />\n    <category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n    <data\
  \ android:scheme=\"https\" />\n    <data android:host=\"<website url>\"/>\n</intent-filter>\n\
  ```\n\n结合这些要求结合，得到了完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n                <intent-filter android:autoVerify=\"true\">\n               \
  \     <action android:name=\"android.intent.action.VIEW\" />\n                 \
  \   <category android:name=\"android.intent.category.BROWSABLE\" />\n          \
  \          <category android:name=\"android.intent.category.DEFAULT\" />\n     \
  \               <data android:scheme=\"https\" />\n                    <data android:host=\"\
  <website url>\"/>\n                </intent-filter>\n        </activity>\n    </application>\n\
  </manifest>\n```\n\n通过双击项目窗口（Project tool window）中的文件名将 `AndroidManifest.xml` 文件加载到清单编辑器中。加载后，修改\
  \ XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对清单文件进行适当的修改后，新的 activity 已准备好安装到设备上。\n\n## 55.8\
  \ 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主 activity 可以作为隐式意图的接收者之前，它必须首先安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件既不包含\
  \ `android.intent.action.MAIN` 包含 `android.intent.category.LAUNCHER` 设置，因此需要指示 Android\
  \ Studio 安装但不启动应用。要配置此行为，请从工具栏中如图 55-3 所示，选择应用 -> Edit configurations…（编辑配置…）菜单：\n\
  \n![](img/as_implicit_intent_run_edit_config.jpg)\n\n图 55-3\n\n在 Run/Debug Configurations（运行/调试配置）对话框中，将面板\
  \ Launch Options（启动选项）部分的 Launch 选项改为 `Nothing`，然后点击 Apply（应用）后点击 OK（确定）：\n\n![](img/as_3.5_implicit_intent_launch_nothing.jpg)\n\
  \n图 55-4\n\n配置好此设置后，照常运行应用。注意，应用已安装到设备上，但尚未启动。\n\n### 55.9 测试应用程序\n\n安装 `MyWebView`\
  \ 应用后，再次运行 `ImplicitIntent` 并点击 Show Web Page（显示网页）按钮。注意，网页仍然加载到 Chrome 浏览器中，而不是\
  \ `MyWebView` 应用的主 activity 中。这是因为 `MyWebView` activity 尚未通过验证或启用打开启动意图中包含的链接。要手动启用链接，需要在\
  \ `enableLink()` 方法中添加一些代码。\n\n## 55.10 手动启用链接\n\n在 `enableLink()` 方法中，我们现在需要创建并启动一个意图，以显示\
  \ `MyWebView` 应用的默认打开（Open by Default）设置屏幕。将 `MainActivity.java` 文件加载到代码编辑器并修改 `enableLink()`\
  \ 方法如下所示，确保将 `<reverse domain>` 替换为 `com.ebookfrenzy` 或你的反向域名：\n\n```java\nimport\
  \ android.provider.Settings;\nimport android.net.Uri;\n\npublic void enableLink(View\
  \ view) {\n    Intent intent = new Intent(\n            Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \            Uri.parse(\"package:<reverse domain>.mywebview\"));\n    startActivity(intent);\n\
  }\n```\n\n再次运行 ImplicitIntent 应用并点击 Enable Link（启用链接）按钮以显示默认打开屏幕：\n\n![](img/as_implicit_intent_open_by_default.jpg)\n\
  \n图 55-5\n\n点击 Add Link（添加链接）按钮（标记 A），勾选旁边的 URL，然后点击 Add 按钮：\n\n![](img/as_implicit_intent_add_link.jpg)\n\
  \n图 55-6\n\n确认链接现在显示为支持，然后点击返回箭头（如图 55-5 所示）返回 ImplicitIntent 应用。点击 Open Web Page\
  \ 现在会将页面加载到 `MyWebView` 应用中，而不是 Chrome 浏览器：\n\n![](img/as_mywebview_running.jpg)\n\
  \n图 55-7\n\n## 55.11 自动链接验证\n\n如果你在创建 `MyWebView` 项目时选择了你自己的网站 URL，现在可以采取自动链接验证的额外步骤。首先从目前测试的设备或模拟器上卸载\
  \ `MyWebView` 应用。在数字资产文件放置于网站后，我们将重新安装应用以触发验证过程。\n\n按照标题为 Android Intents 概述的章节概述步骤，找到你的\
  \ `debug.keystore` 文件并使用 `keytool` 工具获取 SHA-256 证书指纹：\n\n```bash\nkeytool -list\
  \ -v -keystore <path to debug.keystore file here>\n```\n\n接下来，在浏览器中打开以下页面：\n\nhttps://developers.google.com/digital-asset-links/tools/generator\n\
  \n页面加载后，在 Hosting site domain 字段输入你的网站 URL，`com.<domain here>.mywebview` 作为 App\
  \ 包名，并将你的 SHA-256 指纹输入 App package fingerprint (SHA256) 字段：\n\n![](img/as_implicit_intent_link_generator.jpg)\n\
  \n图 55-8\n\n点击 Generate statement 按钮显示生成的语句，将其放在名为 `assetlinks.json` 的文件中位于 Web\
  \ 服务器上的 `.well-known` 文件夹中。返回生成器页面并点击 Test statement 按钮以验证该文件有效且位置正确。\n\n\n\n\n\
  假设测试成功，我们现在可以尝试点击应用链接，在您的设备或模拟器上重新安装 `MyWebView` 应用，并使用 `Settings` 应用导航到 `MyWebView`\
  \ 的 `Open by Default` 页面。该页面应该显示链接已验证：\n\n![](img/as_implicit_intent_verified.jpg)\n\
  \n图 55-9\n\n再次运行 `ImplicitIntent` 应用，点击 `Open Web Page` 按钮，并验证页面内容出现在 `MyWebView`\
  \ 应用中，而不是 `Chrome` 浏览器。\n\n### 55.12 总结\n\n隐式意图（Implicit intents）提供了一种机制，一个活动可以通过简单指定操作类型（以及可选的要执行该操作的数据）来请求另一个活动的服务。然而，要成为隐式意图的候选目标者，活动必须配置为能够从传入的意图对象中提取适当的数据，并包含在正确的清单文件（manifest\
  \ file）中，包括适当权限和意图过滤器（intent filters）。包含目标活的应用还必须通过 Digital Asset Links 文件进行验证，或者由用户手动启用。\n\
  \n在本章中，创建了一个示例来演示隐式意图的发送、能够处理此类意图的示例活动的创建以及链接验证过程。\n\n## 56. Android 广播意图和广播接收器\n\
  \n除了提供启动应用活动的机制外，意图（intents）还用于向系统的其他组件广播系统级消息。这涉及广播意图（Broadcast Intents）和广播接收器（Broadcast\
  \ Receivers）的实现，两者都是本章的主题。\n\n### 56.1 广播意图概述\n\n广播意图是 `Intent` 对象，通过调用 `Activity`\
  \ 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()` 方法进行广播（后者用于需要从广播获取结果的情况）。在应用组件之间提供消息传递和事件系统外，广播意图还被\
  \ Android 系统用于通知感兴趣的应用程序关键系统事件（例如外部电源或耳机的连接或断开）。\n\n当创建一个广播意图时时，除了可选的数据和类别字符串（category\
  \ string）外，它必须包含一个操作字符串（action string）。与标准意图一样，数据使用意图对象的 `putExtra()` 方法结合键值对添加到广播意图中。可选的类别字符串可以通过调用\
  \ `addCategory()` 方法被分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行早于\
  \ Android 3.0 的设备上成功启动相应的广播接收器。然而，在较新的 Android 版本上，广播接收器将无法接收该意图。这是因为 Android 3.0\
  \ 引入了启动控制安全措施，防止通过意图启动已停止应用的组件。如果一个应用刚刚安装且尚未启动过，或者被用户使用设备上的应用管理器手动停止，则该应用被认为处于停止状态。然而，为了解决这个问题，可以在发送意图之前添加一个标记，以指示允许该意图启动已停止应用的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照下述代码片段的适配方式使用：\n\n```java\nIntent intent =\
  \ new Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n### 56.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `AndroidBroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。广播接收器随后可以注册在代码中（例如在活动内部），也可以注册在清单文件中。注册实现的一部分工作包括创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串来实现的。当检测到匹配的广播时，广播接收器的 `onReceive()`\
  \ 方法会被调用，此时该方法有 5 秒钟的时间在返回之前执行任何必要的任务。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android 运行时系统将在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码列出了一个广播接收器子类的模板：\n\n```java\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在此处实现检测到广播时\n        // 时要执行的代码\n    }\n\
  }\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个 `<receiver>` 条目。\n\n下面的清单文件示例注册了上述广播接收器：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector\"\n    android:versionCode=\"1\"\n\
  \    android:versionName=\"1.0\" >\n\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n       \
  \ android:label=\"@string/app_name\" >\n\n        <receiver android:name=\"MyReceiver\"\
  \ >\n\n    </application>\n</manifest>\n```\n\n在早于 Android 8.0 的版本上运行时，与接收器相关的意图过滤器可以放在清单文件的接收器元素中，如下所示：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须使用 `Activity` 类的 `registerReceiver()` 方法配合适当配置的 `IntentFilter`\
  \ 对象在代码中注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法进行注销，接收器对象的引用作为参数传递。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n记住，某些系统广播意图只有当接收器在代码中注册而非清单文件中注册时才能被检测到。可以在线查看\
  \ Android `Intent` 类文档获取系统广播意图及相应要求的详细概述：\n\n[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n### 56.3 从广播中获取结果\n\n\n\n\n\n当使用 `sendBroadcast()` 方法发送广播意图（intent）时，启动活动无法从接收该广播的广播接收器获取结果。如果需要返回值，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按顺序传递给每个注册了感兴趣内容的广播接收器。\n\n调用 `sendOrderedBroadcast()`\
  \ 方法时带有多个参数，包括指向另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器都处理完意图后将通知该接收器；同时还有一组数据引用，这些接收器可以将结果数据存放在其中。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用，并传入结果数据。\n\n### 56.4 粘性广播意图（Sticky Broadcast Intents）\n\n\
  默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理，就会消失。然而，可以将广播意图定义为“粘性”。粘性意图及其包含的数据在执行完成后仍保留在系统中。粘性广播意图中存储的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，使用通常的参数（广播接收器的引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电池电量状态相关的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将要移除的广播意图的引用作为参数传递。\n\n### 56.5 广播意图示例\n\
  \n本章的剩余部分将详细介绍如何创建一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序用于发布自定义广播意图。随后将创建一个相应的广播接收器，当检测到广播时，它将在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统系统的通知，即外部电源已从设备上断开。\n\n### 56.6 创建示例应用程序\n\n\
  从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置更改 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language`（语言）菜单更改为 `Java`。\n\n一旦创建新项目，在 Project 工具窗口的 `app -> res -> layout`\
  \ 下找到并加载 `activity_main.xml` 布局文件，并在 Design 模式下的 `Layout Editor` 中将 `TextView` 对象替换为\
  \ `Button` 视图，并设置 `text` 属性显示为“Send Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取到名为 `send_broadcast`\
  \ 的资源中。\n\n在布局中仍选中按钮的情况下，在 Attributes（属性）面板中找到 `onClick` 属性，并配置其调用名为 `broadcastIntent`\
  \ 的方法。\n\n### 56.7 创建并发送广播意图\n\n在创建了 `SendBroadcast` 应用程序的框架后，现在是实现发送广播意图代码了。这涉及实现之前指定的作为用户界面\
  \ `Button` 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，并修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n// ...\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意在此实例中意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n发送广播意图的应用程序创建此结束。剩下的就是构建一个匹配的广播接收器。\n\n### 56.8 创建广播接收器\n\n要创建广播接收器，需要创建一个自\
  \ `BroadcastReceiver` 父类的类的类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从出现的菜单中选择\
  \ `New -> Other -> Broadcast Receiver` 菜单选项，将类命名为 `MyReceiver` 并确保选中 `Exported`（导出）和\
  \ `Enabled`（启用）选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\
  \n一旦创建，Android Studio 将将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: This method is called when the BroadcastReceiver\
  \ is receiving\n        // an Intent broadcast.\n        throw new UnsupportedException(\"\
  Not implemented\");\n    }\n}\n```\n\n代码所示，Android Studio 为新类生成了模板并为 `onReceive()`\
  \ 方法生成了存根。需要对类进行一些更改以实现所需的功能。仍在 `MyReceiver.java` 文件中，修改代码使其如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: This method\
  \ is called when the BroadcastReceiver is receiving\n        // an Intent broadcast.\n\
  \        throw new UnsupportedException(\"Not implemented\");\n        Toast.makeText(context,\
  \ \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码现在完成了。\n\
  \n### 56.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并必须包含意图过滤器以指定接收器感兴趣的广播意图。在上节创建 `BroadcastReceiver`\
  \ 类时，Android Studio 已在清单文件中添加了 `<receiver>` 元素。剩下的就是在 `MainActivity.java` 文件中添加代码以创建意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n// ...\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.IntentFilter;\n// ...\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n    BroadcastReceiver receiver;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n```\n\n\n\n\n\n```java\nIntentFilter\
  \ filter = new IntentFilter();\n\nfilter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n\nreceiver = new MyReceiver();\n\nregisterReceiver(receiver, filter);\n\n}\n\
  \n.\n\n}\n```\n\n当不再需要时，注销广播接收器也是非常重要的：\n\n```java\n@Override\nprotected void onDestroy()\
  \ {\n    super.onDestroy();\n    unregisterReceiver(receiver);\n}\n```\n\n### 56.10\
  \ 测试广播示例\n\n要测试广播发送端和接收器，在设备或 `AVD` 上运行 `SendBroadcast` 应用并等待其出现在屏幕上。运行后，点击按钮，此时应该弹出一个显示“Broadcast\
  \ Intent Detected”（检测到广播意图）的 toast 信息，持续几秒后消失。\n\n### 56.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器，以也监听当外部电源断开设备时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n            \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，因此最好修改代码，使当前意图的动作字符串也显示在\
  \ toast 信息中。该字符串可以通过调用作为参数传递给 `onReceive()` 方法的 `intent` 对象的 `getAction()` 方法获取：\n\
  \n```java\npublic void onReceive(Context context, Intent intent) {\n    String message\
  \ = \"Broadcast intent detected \"\n                    + intent.getAction();\n\
  \    Toast.makeText(context, message,\n    Toast.LENGTH_LONG).show();\n}\n```\n\n\
  重新安装修改后的 `SendBroadcast` 包来测试接收器。在 `SendBroadcast` 应用中点击按钮现在应该会产生一个包含自定义动作字符串的新消息：\n\
  \n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\n接下来，拔掉当前为 Android\
  \ 设备供电的 USB 连接器，此时接收器将在 toast 信息中报告以下内容（在竖屏模式的设备上消息可能会被截断）。如果应用在模拟器上运行，请显示扩展控制，选择\
  \ `Battery` 选项并将 `Charger` 连接设置改为 `None`。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免在每次设备断开电源时都出现此消息，请在设备上启动 `Settings` 应用并选择 `Apps` 选项。从列表中选择 `SendBroadcast`\
  \ 应用并点击 `Uninstall` 按钮。\n\n### 56.12 总结\n\n广播意图是一种机制，通过它 `intent` 可以发布供 Android\
  \ 系统上的多个组件消费。广播通过注册 `Broadcast Receiver` 来检测，而接收器反过来被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器在检测到匹配的\
  \ `intent` 并被系统唤醒之前一直保持休眠状态。Android 系统也使用广播意图来发布事件通知，例如低电量警告或外部电源连接或断开。\n\n本章在提供广播意图和接收器概述外，还通过了一个发送广播意图以及监听自定义和系统广播意图的广播接收器实现示例。\n\
  \n# 57 Android 本地绑定服务 – 示例\n\n如上一章所述，绑定服务（Bound services）提供了一种实现 Android 服务与一个或多个客户端组件之间通信的机制。本章的目标是在“An\
  \ Overview of Android Services`中提供的绑定服务概述的基础上，开始对本地绑定服务的示例实现进行构建。\n\n### 57.1 理解绑定服务\n\
  \n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务上，并且一旦绑定，就可以使用多种不同的机制与该服务进行交互。\n\n绑定服务作为\
  \ `Android Service` 类的子类被创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()` 方法绑定到服务。对绑定服务的第一个绑定请求将导致调用该服务的\
  \ `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现 `ServiceConnection`\
  \ 子类，其中包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这些方法分别会在客户端-服务器连接建立或断开后被调用。在\
  \ `onServiceConnected()` 方法的情况下，将传递一个包含客户端所需信息的 `IBinder` 对象。\n\n## 57.2 绑定服务的交互选项\n\
  \n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是本地的，且与客户端组件属于同一个应用程序（也就是说，它在同一个进程中运行且对其他应用程序不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后通过 `onBind()` 方法返回该 `Binder` 对象的实例，并随后供客户端直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是应用程序本地的情况下（也就是说，它在与客户端组件不同的进程中运行），最好使用 `Messenger/Handler` 实现交互。\n\n在本章的剩余部分，将创建一个示例，旨在演示创建、启动和交互本地私有绑定服务的步骤。\n\
  \n### 57.3 本地绑定服务示例\n\n在本章的剩余部分创建的示例应用程序将由单个 Activity 和绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给显示它的\
  \ Activity。绑定服务将是本地的，且与 Activity 属于同一个应用程序。\n\n从欢迎屏幕上选择 New Project 选项，在出现的新项目对话框中，选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `LocalBound` 并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单改为 `Java`。使用第 11.8 Migrating a Project to View Binding`节中的步骤将项目迁移到视图绑定。\n\n\
  项目创建后，下一步是添加一个作为绑定服务的新类。\n\n\n\n\n\n要向项目添加新类，请在 Project 窗口中右键点击包名（位于 `app -> java\
  \ -> com.ebookfrenzy.localbound` 下），并选择 `New -> Service -> Service` 菜单选项。指定 `BoundService`\
  \ 为类名，并且在点击 `Finish` 创建类之前，确保同时勾选了 `Exported` 和 `Enabled` 选项。Android Studio 将将 `BoundService.java`\
  \ 文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n    public BoundService() {\n\n    }\n\n    @Override\n   \
  \ public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n}\n```\n\n### 57.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递一个配置适当的\
  \ `Binder` 对象来与绑定客户端进行通信。这是通过在绑定服务类内部创建一个 `Binder` 子类，并通过添加一个或多个可以被客户端调用的新方法来扩展它来实现的。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问绑定服务的数据并调用其中的方法。\n\
  \n因此，为了本示例的目的，需要对上一节中创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为\
  \ `getService()` 的方法，该方法将简单返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java`\
  \ 文件并对其修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n对类进行修改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个单一方法，唯一目的是返回 `BoundService` 类当前实例的引用。创建了 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现了一个新的公共方法，以便在被任何绑定到服务的客户端调用时返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  \nimport java.util.Date;\n\nimport java.util.Locale;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \               new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n                \
  \        Locale.US);\n        return (dateformat.format(new Date()));\n    }\n \
  \   public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n此时，绑定服务已完成，并准备好添加到清单文件中。在\
  \ Project 窗口中找到并双击 LocalBound 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，验证\
  \ Android Studio 是否已为该服务添加了如下 `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.bound\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <service\n            android:name=\"\
  .BoundService\"\n            android:enabled=\"true\"\n            android:exported=\"\
  true\" >\n        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一阶段是在 activity 中实现必要的代码以绑定服务并调用 `getCurrentTime()` 方法。\n\n## 57.6 将客户端绑定到服务\n\
  \n对于教程而言，客户端是运行中的 `MainActivity` 实例。如前所述，为了成功绑定服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，需要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并对其修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final private ServiceConnection myConnection = new ServiceConnection()\n\
  \    {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className,\n                                        IBinder service) {\n     \
  \       MyLocalBinder binder = (MyLocalBinder) service;\n            myService =\
  \ binder.getService();\n            isBound = true;\n        }\n\n        @Override\n\
  \        public void onServiceDisconnected(ComponentName name) {\n            isBound\
  \ = false;\n        }\n    };\n}\n```\n\n\n\n\n\n```java\nsetContentView(R.layout.activity_main);\n\
  \nIntent intent = new Intent(this, BoundService.class);\n\nbindService(intent, myConnection,\
  \ Context.BIND_AUTO_CREATE);\n\n}\n```\n\n### 57.7 完成示例\n\n剩下的工作是实现一种调用 `getCurrentTime()`\
  \ 方法并将结果显示给用户的机制。按照现在的惯例，Android Studio 已经为该活动创建了一个 `activity_main.xml` 模板文件，其中仅包含一个\
  \ `TextView`。将此文件加载到布局编辑器（Layout Editor）工具中，并在设计（Design）模式选择 `TextView` 组件并将 ID\
  \ 更改为 `myTextView`。在 `TextView` 之下添加一个 `Button` 视图，并将按钮文本更改为“Show Time”，将该文本提取为命名为\
  \ `show_time` 的字符串资源。完成这些更改后，布局的看起来应该类似于图 57-1 所示所示。如果缺少任何约束，请点击布局编辑器工具栏上的 `Infer\
  \ Constraints`（推断约束）按钮。\n\n![](img/as_local_bound_ui.jpg)\n\n图 57-1\n\n通过选择 `Button`\
  \ 并配置 `onClick` 属性调用名为 `showTime` 的方法，以完成用户界面的设计。\n\n最后，编辑 `MainActivity.java` 文件中的代码以实现\
  \ `showTime()` 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过活动内部的\
  \ `myService` 引用调用它），并将生成的字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \n.\n\n.\n\nimport android.widget.TextView;\n\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \n    boolean isBound = false;\n\n    public void showTime(View view)\n    {\n \
  \       String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n.\n.\n\n}\n```\n\n### 57.8 测试应用程序\n\n在完成代码更改后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图更改为显示当前日期和时间。该示例已成功启动并绑定了一个服务，然后调用了该服务的方法来执行任务并将结果返回给活动。\n\
  \n### 57.9 总结\n\n当绑定服务是本地的且对应用程序私有时，该应用程序内的组件就可以与服务进行交互，而无需诉助于进程间通信（IPC）。通俗地说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向正在运行的服务实例的引用。客户端组件实现一个 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法在服务连接和断开时被调用。前一个方法接收由 `onBind()` 方法返回的 `IBinder` 对象，允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\n## 58. Android 远程绑定服务 – 实例示例\n\n\
  在关于 Android 服务的最后一章中，将开发一个示例应用程序，以演示使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 58.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，在远程服务的情况下，这种方法不起作用，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n在远程服务的情况下，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息在客户端和服务之间跨进程边界进行传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，该实例在从客户端接收到消息时会被调用。在初始化方面，`Handler` 的工作是创建一个 `Messenger` 对象，该对象反过来创建一个\
  \ `IBinder` 对象，并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象来创建 `Messenger` 对象的实例，随后向服务处理程序发送消息。客户端每次发送一条消息时，处理器的\
  \ `handleMessage()` 方法就会被调用，并传递消息对象。\n\n本章创建的示例将包含一个 `activity` 和一个运行在独立进程中的绑定服务。将使用\
  \ `Messenger/Handler` 机制向服务发送一个字符串，服务随后将在 `Logcat` 输出中显示该字符串。\n\n### 58.2 创建示例应用程序\n\
  \n从欢迎屏幕选择 `New Project` 选项，在出现的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `RemoteBound` 并指定 `com.ebookfrenzy.remotebound` 为包名。在点击\
  \ `Finish` 按钮之前，将 Minimum API 级别设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。\n\
  \n### 58.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到布局编辑器工具中。在布局编辑器的设计模式下，右键点击\
  \ `TextView`，选择 `Convert view...` 并点击。将按钮文本更改为“Send Message”，将其提取为命名为 `show_message`\
  \ 的资源。最后，配置 `onClick` 属性调用名为 `sendMessage` 方法。\n\n### 58.4 实现绑定服务\n\n要实现此示例的远程服务，通过右键点击包名（位于\
  \ `app -> java` 下）向项目添加新类，选择 `New` -> `Service` 选项。指定 `RemoteService` 为类名，并在点击 `Finish`\
  \ 之前确保勾选了 `Exported` 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类。通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。该方法会在从客户端接收到消息时被调用。它接收一个 `Message` 对象作为参数，包含客户端需要传递给服务的数据。在此实例中，这是一个包含要显示给用户的字符串的\
  \ `Bundle` 对象。实现后，`RemoteService.java` 文件中的修改类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport android.os.Messenger;\nimport android.util.Log;\n\
  \npublic class RemoteService extends Service {\n    public RemoteService() {\n \
  \   }\n\n    static class IncomingHandler extends Handler {\n        String TAG\
  \ = \"RemoteService\";\n\n        public IncomingHandler() {\n            super(Looper.getMainLooper());\n\
  \        }\n\n        @Override\n        public void handleMessage(Message msg)\
  \ {\n            Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  MyString\");\n            Log.i(TAG, \"Message = \" + dataString);\n        }\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: 向服务返回通信通道。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n\n\n\n一旦实现了 handler，在服务代码方面唯一的任务就是修改 `onBind()` 方法，使其返回一个包含\
  \ `Messenger` 对象的 `IBinder` 对象，而该对象反过来包含了对 handler 的引用：\n\n```java\nfinal Messenger\
  \ myMessenger = new Messenger(new IncomingHandler());\n\n@Override\npublic IBinder\
  \ onBind(Intent intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码段的第一行创建了处理器类的实例，并将其传递给新\
  \ `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用 `messenger` 对象的 `getBinder()` 方法来返回 messenger\
  \ 的 `IBinder` 对象。\n\n## 58.5 在 Manifest 文件中配置远程服务\n\n为了准确描述客户端与远程服务之间的通信，有必要配置服务运行在与应用程序其他部分独立的进程中。这通过在清单文件中服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。为了启动远程服务，还需要为服务提供一个意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n### 58.6 启动并绑定远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。此外，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务 `onBind()`\
  \ 方法返回的 `IBinder` 对象，该对象将用于向服务器 handler 发送消息。在本例中，客户端是 `MainActivity`，代码位于 `MainActivity.java`。加载此文件并进行修改，以添加\
  \ `ServiceConnection` 类以及一个用于存储接收到的 `Messenger` 对象引用的变量，以及一个指示连接是否建立的 `Boolean`\
  \ 标志位：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final ServiceConnection\
  \ myConnection = new ServiceConnection() {\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            myService = new Messenger(service);\n\
  \            isBound = true;\n        }\n        public void onServiceDisconnected(ComponentName\
  \ className) {\n            myService = null;\n            isBound = false;\n  \
  \      }\n    };\n```\n\n接下来，需要添加一些代码来绑定到远程服务。这涉及到创建一个与清单文件中声明的服务的意图过滤器匹配的 `intent`，然后调用\
  \ `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例的引用作为参数传递。为了本例，这段代码将在 activity\
  \ 的 `onCreate()` 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(), RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n###\
  \ 58.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为当用户触摸用户界面上的按钮时调用。此方法需要检查服务是否连接，创建一个包含服务器要显示的字符串的\
  \ `bundle` 对象，将其添加到 `Message` 对象中并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n完成代码更改后，编译并运行应用程序。加载后，打开\
  \ Logcat 窗口并在过滤器中输入：`package:mine tag:RemoteServer`\n\n在 Logcat 窗口仍然可见的情况下，点击用户界面上的按钮，此时应该出现如下消息：\n\
  Message = Message Received\n\n### 58.8 总结\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现\
  \ `sendMessage()` 方法，该方法被配置为当用户触摸用户界面上的按钮时调用。本章涵盖了该技术的基本概念，并实现了一个演示在独立进程中运行的客户端与服务之间通信的示例。\n\
  \n## 59 Java 线程、Handler 和 Executor 概述\n\n线程是任何多任务操作系统的基石，可以被视为运行在主进程中的微进程，其目的是允许应用程序中出现并行执行路径。在本章中，我们将探讨线程在\
  \ Android 开发中的重要性，并演示如何创建和管理它们。\n\n### 59.1 主线程\n\n当 Android 应用程序启动时，运行时系统会创建一个所有应用程序组件默认运行在其中的单线程。该线程通常被称为主线程。主线程的主要作用是处理用户界面，包括事件处理和与用户界面视图的交互。在应用程序内部启动的任何组件默认也会运行在主线程上。\n\
  \n\n\n\n### 59.2 线程处理器 (Thread Handlers)\n\n显然，Android 开发的核心规则之一是绝不要在应用程序的主线程上执行耗时操作。第二条同样重要的规则是，在任何情况下，独立线程中的代码都绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内进行。这是因为 Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全的代码，通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程进行同步来实现。这通过在主线程中创建一个 `handler` 来实现，该 `handler`\
  \ 随后接收来自另一个线程的消息并据此更新用户界面。\n\n### 59.3 线程示例\n\n\n\n本章的剩余部分将通过一些简单的示例，旨在对线程提供基础介绍。第一步将强调在主线程之外的独立线程中执行耗时任务的重要性。\n\
  \n启动 Android Studio，从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，选择 `Empty Activity`（空活动）模板，然后点击\
  \ `Next`（下一步）按钮。\n\n在 `Name`（名称）字段中输入 `ThreadExample`，指定 `com.ebookfrenzy.threadexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。按照 11.8 将项目迁移到 View Binding 节中的步骤，将项目转换为使用\
  \ view binding。\n\n### 59.4 构建应用\n\n将项目的 `activity_main.xml` 文件加载到布局编辑器（Layout Editor）工具中。选择默认的\
  \ `TextView` 组件，并在属性工具窗口中将视图的 `ID` 更改为 `myTextView`。\n\n在用户界面上添加一个 `Button` 视图，位置位于现有\
  \ `TextView` 对象正下方，如图图 59-1\n\n图 59-1\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板，并为\
  \ `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将简单的暂停\
  \ 20 秒，然后在 `TextView` 对象上显示不同的文本：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序看起来像冻结了。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图图\
  \ 59-2\n\n图 59-2\n\n显然，`buttonClick()` 方法中任何需要时间完成的操作都应该在独立线程中执行。\n\n### 59.5 创建新线程\n\
  \n要创建一个新线程，需要将要在在该线程中执行的代码放置在 `Runnable` 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将\
  \ `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的 `start()` 方法来启动线程运行。因此，为了在 `buttonClick()`\
  \ 方法中执行任务，需要进行以下更改：\n\n```java\npublic void buttonClick(View view) {\n    Runnable\
  \ runnable = new Runnable() {\n        public void run() {\n            long endTime\
  \ = System.currentTimeMillis() + 20 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n        }\n    };\n    binding.myTextView.setText(\"Button Pressed\"\
  );\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\
  \n事实上，如果需要，可以通过利用 Java 表达式来简化 `runnable` 的声明。进行此更改将导致以下声明：\n\n```java\nRunnable\
  \ runnable = () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  \    while (System.currentTimeMillis() < endTime) {\n        synchronized (this)\
  \ {\n            try {\n                wait(endTime - System.currentTimeMillis());\n\
  \            } catch (Exception e) {\n            }\n        }\n    }\n};\nThread\
  \ myThread = new Thread(runnable);\nmyThread.start();\n```\n\n现在运行应用程序时，点击按钮将使延迟在新线程中执行，从而留主线程继续处理用户界面，包括响应额外的按钮点击。事实上，每次点击按钮都会创建一个新线程，允许任务并发执行。\n\
  \n仔细检查更新后的 `buttonClick()` 方法代码，会发现更新 `TextView` 的代码已被移除。如前所述，在主线程以外的线程更新用户界面元素违反了\
  \ Android 开发规则。因此，为了更新用户界面，有必要为线程实现一个 `Handler`。\n\n### 59.6 实现线程处理器 (Thread Handler)\n\
  \n线程处理器在应用程序的主线程中实现，主要用于响应进程内其他线程发送的消息来对用户界面进行更新。\n\nHandler 继承自 Android `Handler`\
  \ 类，可以通过指定线程需要执行的 `Runnable` 或通过重写 `Handler` 子类中的 `handleMessage()` 回调方法来使用，后者会在线程向处理器发送消息时被调用。\n\
  \n为了本示例，实现一个 handler 在之前创建的线程内部更新用户界面。将 `MainActivity.java` 文件加载到 Android Studio\
  \ 编辑器，并修改代码在活动中添加 `Handler` 实例：\n\n```java\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.os.Looper;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\
  \ public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个处理器，并在该处理器内部实现了 `handleMessage()`\
  \ 回调，该回调会在线程向处理器发送消息时被调用。在此实例中，代码简单的在用户界面的 `TextView` 对象上显示字符串。\n\n\n\n\n现在只需修改在\
  \ `buttonClick()` 方法中创建线程，在延迟完成后向 `handler` 发送消息：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n请注意，唯一的更改是调用了 `handler` 的 `sendEmptyMessage()` 方法。由于 `handler` 目前没有对接收到的任何消息内容进行任何处理，因此向它发送了一个空消息对象。\n\
  \n编译并运行应用程序，在执行后点击按钮。在 20 秒延迟后，新文本将出现在用户界面的 `TextView` 对象中。\n\n### 59.7 向 Handler\
  \ 传递消息\n\n虽然上一个示例触发了 `handleMessage()` handler 回调的调用，但它并没有利用消息对象向 `handler` 发送数据。在教程的这一阶段，将进一步修改示例，以便在线程和\
  \ `handler` 之间传递数据。首先，`buttonClick()` 方法中更新的线程将从系统获取字符串格式的日期和时间，并将该信息存储在 `Bundle`\
  \ 对象中。然后将调用 `handler` 对象的 `obtainMessage()` 方法从消息池中获取消息对象。最后，在通过调用 `handler` 对象的\
  \ `sendMessage()` 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n接下来，更新 `handler` 的 `handleMessage()` 方法，从消息中的 `bundle` 对象中提取日期和时间字符串并将其显示在\
  \ `TextView` 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，并测试点击按钮是否会在线程完成后在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n### 59.8 Java 并发\n\n到本章为止，我们一直查看了直接创建和管理\
  \ Java 线程。虽然对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这可能是不够的。例如，启动和停止线程涉及系统开销。因此，创建和销毁大量线程的应用程序可能会面临性能下降的风险。基础线程\
  \ API 未提供调度、重复执行或从任务中返回结果的预构建选项。\n\n通过使用 Java 并发框架（`java.util.concurrent` 的一部分）中的\
  \ `Executor` 类，可以克服直接处理线程的缺点。该框架允许创建活动线程池并管理任务如何分配给这些线程。这使得现有线程可以用于其他任务，而无需不断创建新线程。该框架还提供了额外功能，包括在任务完成后返回结果（称为\
  \ `Callable` 任务）、检查线程状态以及调度任务在超时后或按间隔运行。\n\n### 59.9 处理任务\n\n探索该框架的第一步是修改 `clicked()`\
  \ 方法，使用并发 `Executor` 在单独线程中运行任务：\n\n```java\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\n\npublic void buttonClick(View view) {\n\
  \    ExecutorService executor = Executors.newThreadExecutor();\n    executor.submit(new\
  \ Runnable() {\n        public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \         Message msg = handler.obtainMessage();\n            Bundle bundle = new\
  \ Bundle();\n            bundle.putString(\"myKey\", \"Button Pressed\");\n    \
  \        msg.setData(bundle);\n            handler.sendMessage(msg);\n        }\n\
  \    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程中执行。然而，所做的更改需要一些解释。首先，从\
  \ `Executors` 实例获取 `ExecutorService` 实例引用：\n\n```java\nExecutorService executor\
  \ = Executors.newThreadExecutor();\n```\n\n在这种情况下，请求了一个仅包含一个线程的池。可以通过以下方式请求指定数量线程的池：\n\
  \n```java\nExecutorService executor = Executors.newThreadPool(10);\n```\n\n接下来，通过\
  \ `executor` 实例的 `submit()` 方法在线程上启动一个 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable() {\n    public void run() {\n        // ... code\n    }\n});\n```\n\n\
  请注意，上面的声明可以通过将其转换为 lambda 表达式来简化：\n\n```java\nexecutor.submit(() -> {\n    // ...\
  \ code\n});\n```\n\n\n\n当执行可调用任务时，它会返回一个 `Future` 实例，应用随后可以使用该实例在任务完成时获取结果。为了直观看到这一过程，首先编辑\
  \ `activity_main.xml` 文件，添加一个标签为“Status”的额外按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 方法：\n\n![](img/as_thread_example_ui.jpg)\n\n图 59-3\n\n接下来，修改 `buttonClick()` 方法以执行一个\
  \ `Callable` 任务，该任务配置为通过 `Future` 变量返回 `String` 值：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                return(\"Task Completed\");\n            }\n   \
  \     });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个用于存储字符串值的 `Future` 变量外，对启动任务的方式也进行了一些更改：\n\n```java\nfuture = executor.submit(new\
  \ Callable<String>() {\n    public String call() {\n```\n\n这里的关键点是，我们现在不是向 `executor`\
  \ 服务提交 `Runnable` 任务，而是传递一个 `Callable` 任务（声明返回 `String` 值）。同时请注意，任务的结果被赋值给 `Future`\
  \ 变量。此外，使用了 `call()` 方法而不是之前提交 `Runnable` 任务时使用的 `run()` 方法。最后，添加了返回语句来返回字符串值：\n\
  \n```java\nreturn(\"Task Completed\")\n```\n\n### 59.12 处理 Future 结果\n\n`buttonClick()`\
  \ 方法现在配置为启动一个 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用现在需要知道任务何时完成以及结果何时可用。一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，必须在 `try/catch` 语句中执行：\n\n```java\n\
