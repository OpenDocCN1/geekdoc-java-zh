  \ `ACTION_CREATE_DOCUMENT` 意图，该配置用于创建一个纯文本 MIME 类型的文件。在设计用户界面时，“新建”按钮被配置为调用名为 `newFile()`\
  \ 的方法。在该方法内部需要启动相应的意图。\n\n在 `MainActivity.java` 文件中，按照如下方式实现此方法：\n\n```java\npackage\
  \ com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n// ...\npublic void newFile(View view) {\n    Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n    startCreateForResult.launch(intent);\n\
  }\n// ...\n```\n\n此代码创建了一个新的 `ACTION_CREATE_DOCUMENT` 对象。随后对该意图进行配置，使得文件可以通过文件描述符打开（通过\
  \ `Intent.CATEGORY_OPENABLE` 设置）。接下来，代码指定要打开的文件应具有文本 MIME 类型，并提供了一个占位符文件名（用户可以在选择器中更改该文件名）。当执行此方法且意图完成后，将调用\
  \ `startCreateForResult()` 并传递新创建文档的 `Uri`。\n\n### 保存到存储文件\n\n现在应用程序已经能够创建存储文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面被配置为当用户选择“保存”按钮时，调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将导致选择器界面出现，以便用户可以选择存储文本的文件。由于我们只处理文本文件，该意图需要配置为将用户的选择范围限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在识别出 `saveFile()` 要执行的操作后，现在可以按照如下方式将其添加到 `MainActivity.java`\
  \ 类中：\n\n```java\npublic void saveFile(View view) {\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startForResult.launch(intent);\n}\n```\n\n分配给 `startForResult()` 的 Lambda\
