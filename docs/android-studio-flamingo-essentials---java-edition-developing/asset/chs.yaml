  \ `navigation editor`（导航编辑器）中。\n2. 在编辑器中，选择图面板中的 `SecondFragment` 条，并按下键盘删除键将其从图中移除。\n\
  3. 找到并删除 `SecondFragment.java` (`app -> java -> <package name> -> SecondFragment`)\
  \ 和 `fragment_second.xml` (`app -> res -> layout -> fragment_second.xml`) 文件。\n\
  4. 找到 `FirstFragment.java` 文件，双击它将其加载到编辑器，并从 `onViewCreated()` 方法中的代码，使其内容如下：\n\n\
  ```java\npublic void onViewCreated(@NonNull View view, Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \                         .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \        }\n    });\n}\n```\n5. 编辑 `MainActivity.java` 文件并移除以下导航代码：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
