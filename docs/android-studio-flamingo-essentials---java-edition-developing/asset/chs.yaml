  \ 视图组成，其中包含命名为 `editText1`、`textView1` 和 `button1` 的 `EditText`（纯文本）、`TextView`\
  \ 和 `Button` 视图。使用 `Project` 工具窗口找到 MainActivity 的 `activity_main.xml` 资源文件（位于 `app\
  \ -> res -> layout`），并双击将其加载到 Android Studio 布局编辑器工具中。选择默认的“World!” `TextView`，使用\
