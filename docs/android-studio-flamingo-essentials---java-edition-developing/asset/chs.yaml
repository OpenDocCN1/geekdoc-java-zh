  ## 74.6 生成 Google Maps API 密钥\n\n在应用程序使用 Google Maps Android SDK 之前，必须先配置 API 密钥，将其与启用了\
  \ Maps 的 Google Cloud 项目关联。要生成 API 密钥，选择“凭据”（Credentials）菜单选项（在图 74-8 中标记为 A），然后点击“创建凭据”（Create\
  \ Credentials）按钮（B）：\n\n![](img/google_cloud_credentials.jpg)\n\n图 74-8\n\n凭据创建后，将弹出一个显示\
  \ API 密钥。在关闭 API 对话框之前复制密钥：\n\n![](img/google_cloud_console_api_key_created.jpg)\n\
  \n图 74-9\n\n## 74.7 将 API 密钥添加到 Android Studio 项目中\n\n现在我们已经生成了允许应用使用 Google Maps\
  \ SDK 的 API 密钥，我们需要将其添加到项目。。返回 Android Studio，编辑 `manifests` -> `AndroidManifest.xml`\
  \ 文件，并找到 API 密钥条目，其内容如下：\n\n```xml\n<meta-data\n    android:name=\"com.google.android.geo.API_KEY\"\
  \n    android:value=\"YOUR_API_KEY\" />\n```\n\n删除显示“YOUR_API_KEY”的文本并将其替换为在 Google\
  \ Play Console 中创建的 API 密钥。\n\n接下来，编辑 `Gradle Scripts` -> `local.properties` 文件并添加如下所示的新行（用你的项目的\
  \ API 密钥替换 `YOUR_API_KEY`）：\n\n```MAPS_API_KEY=YOUR_API_KEY\n```\n\n## 74.8 测试应用程序\n\
  \n对应用程序进行测试运行以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\n如果未显示地图，请检查以下区域：\n\n-\
  \ 如果应用程序运行在模拟器上，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择 `Tools` -> `Android`\
  \ -> `AVD Manager` 菜单选项来更改 AVD 配置的操作系统，点击 AVD 操作列中的铅笔图标，然后点击当前 Android 版本旁边的 `Change…`\
  \ 按钮。在系统镜像对话框中，选择包含 Google APIs 的目标。\n- 检查 `Logcat` 输出，查看任何与 Google Maps API 认证问题相关的区域。这通常意味着\
  \ API 密钥输入错误。确保 `AndroidManifest.xml` 和 `local.properties` 文件中的 API 密钥与 Google Cloud\
  \ 控制台中生成的密钥一致。\n- 在 Google API 控制台中验证是否在凭据面板中启用了适用于 Android 的 Maps SDK。\n\n## 74.9\
  \ 理解地理编码（Geocoding）和反向地理编码（Reverse Geocoding）\n\n如果不先介绍地理编码主题，就无法讨论地图和地理位置。地理编码可以描述为将基于文本的地理位置（如街道地址）转换为以经纬度表示的地理坐标。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 实例传递一个表示位置的字符串（如城市名、街道地址或机场代码）。`Geocoder`\
  \ 将尝试为该位置查找匹配项，并返回一个可能与位置字符串匹配的 `Address` 对象列表，并按匹配程度排序，最匹配的项位于列表的第 0 位。然后，可以从 `Address`\
  \ 对象中提取各种信息，包括潜在匹配项的经度和纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航天博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \n.\n\ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocationName(\n\
  \            \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 被作为第二个参数传递给\
  \ `getFromLocationName()` 方法。这只是告诉 `Geocoder` 在数组中只返回一个结果。鉴于所提供地址的特殊性，应该只有一个潜在的匹配项。\n\
  \n上面的代码是正向地理编码的示例，坐标基于文本。反向地理编码顾如其名，涉及将坐标翻译为人类可读的字符串。请考虑以下代码：\n\n```java\nimport\
  \ java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Country;\n\ntry {\n    geocodeMatches\
  \ =\n        new Geocoder(this).getFromLocation(38.887425, -77.0200729, 1);\n} catch\
  \ (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\n\nif (!geocodeMatches.isEmpty()) {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n\
  \    Address2 = geocodeMatches.get(0).getAddressLine(1);\n    State = geocodeMatches.get(0).getAdminArea();\n\
  \    Zipcode = geocodeMatches.get(0).getPostalCode();\n    Country = geocodeMatches.get(0).getCountryName();\n\
  }\n```\n\n在这种情况下，`Geocoder` 对象通过 `getFromLocation()` 方法使用经纬度值初始化。再次请求单个结果。然后从生成的\
  \ `Address` 对象中提取文本的地址信息。需要注意的是，地理编码并非在 Android 设备上实际执行，而是在需要翻译时连接到的服务器上执行，并在完成后返回结果。因此，只有当设备连接网络时才能进行地理编码。\n\
  \n## 74.10 向应用程序添加地图\n\n向应用程序添加地图的最简单方法。以下布局文件显示了在 Android Studio 创建的 `activity_maps.xml`\
  \ 文件中添加的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\
  \n    tools:context=\".MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 74.11 请求当前位置权限\n\n正如“在 Android 中请求运行时权限”章节中所述，某些权限被认为是危险的，对于 Android\
  \ 6.0 或更高版本需要特殊处理。一组权限允许应用程序识别用户的当前位置。编辑项目工具窗口中 `app -> manifests` 下的 `AndroidManifest.xml`\
  \ 文件并添加以下权限行：\n\n```xml\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
  \ />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"\
  \ />\n```\n\n\n\n\n\n这些设置将确保应用在旧版本的 Android 上安装时，能够为应用获取位置信息的权限。然而，为了支持 Android\
  \ 6.0 或更高版本，我们需要在 `MapsActivity.java` 文件中添加一些代码以在运行时请求此权限。\n\n首先，添加一些导入指令和一个作为权限请求代码的常量：\n\
  \n```java\npackage com.ebookfrenzy.mapdemo;\n\n.\n\n.\n\nimport androidx.annotation.NonNull;\n\
  \nimport androidx.core.content.ContextCompat;\n\nimport androidx.core.app.ActivityCompat;\n\
  \nimport android.Manifest;\n\nimport android.widget.Toast;\n\nimport android.content.pm.PackageManager;\n\
  \n.\n\n.\n\npublic class MapsActivity extends FragmentActivity implements OnMapReadyCallback\
  \ {\n    private static final int LOCATION_REQUEST_CODE = 101;\n    private GoogleMap\
  \ mMap;\n.\n\n.\n\n}\n```\n\n接下来，需要在类中添加一个方法来向用户请求指定的权限。在留在 `MapsActivity.java`\
  \ 类文件中，按如下方式实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\n\
  \                                   int requestCode) {\n    ActivityCompat.requestPermissions(this,\n\
  \                new String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应时，活动将调用\
  \ `onRequestPermissionsResult()` 方法。继续留在 `MapsActivity.java` 文件中，现在实现此方法，使其读取内容如下：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \                                     @NonNull String[] permissions, @NonNull int[]\
  \ grantResults) {\n    super.onRequestPermissionsResult(requestCode, permissions,\
  \ grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                            \"Unable to show\
  \ location - permission required\",\n                            Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment =\n              \
  \      (SupportMapFragment) getSupportFragmentManager()\n                      \
  \               .findFragmentById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户没有授予权限，应用将显示一条消息，指示无法显示当前位置。相反，如果授予了权限，地图将刷新，为显示位置标记提供机会。\n\
  \n## 74.12 显示用户的当前位置\n\n一旦授予了适当权限，就可以通过获取与显示的地图相关的 `GoogleMap` 对象引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），从而在地图上显示用户的当前位置。\n\n当地图准备好显示时，将调用 类的 `onMapReady()` 方法。当地图在上述\
  \ `onRequestPermissionsResult()` 方法中被刷新时，此方法也会被调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼市上方放置一个标记。找到并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，以移除此模板代码，并添加代码在启用显示用户当前位置之前检查位置权限是否已授予。如果未授予权限，则将通过调用之前添加的\
  \ `requestPermission()` 方法向用户发出请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 15);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.LatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                        Manifest.permission.ACCESS_FINE_LOCATION);\n        if\
  \ (permission == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                              LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\
  \n现在运行应用时，将出现图 74-10 所示对话框，请求位置权限。如果授予了权限，地图上将出现一个蓝点表示设备的当前位置。\n\n![](img/as_map_permission.jpg)\n\
  图 74-10\n\n### 74.13 更改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法来动态修改显示的地图类型，传入以下值之一：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`：一个没有任何地图瓦片的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`：由道路地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`：显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`：显示带有道路地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`：显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\
  \n```java\n.\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(\n\
  \                    this, Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                          LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n.\n```\n\n或者，可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性指定地图类型，其值为 `none`、`normal`、`hybrid`\
  \ 或 `terrain`。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n          xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n          android:id=\"@+id/map\"\n \
  \         android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"hybrid\"\n          android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 74.14 向用户显示地图控件\n\nGoogle Maps Android API 提供了若干可选显示的地图控件，包括缩放按钮、“我的位置”按钮和指南针。\n\
  \n可以通过编程或在 XML 资源文件中控制显示。要通过编程配置控件，必须获取与 `GoogleMap` 对象相关的 `UiSettings` 对象引用：\n\n\
  ```java\nimport com.google.android.gms.maps.UiSettings;\n\n.\n\n.\n\nUiSettings\
  \ mapSettings;\n\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控件通过调用 `UiSettings`\
  \ 对象的 `setZoomControlsEnabled()` 方法来启用或禁用。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n“我的位置”按钮只有在本章前面介绍的启用我的位置模式时才会出现。即使在这种模式下，也可以通过调用 `UiSettings` 实例的\
  \ `setMyLocationButtonEnabled()` 方法阻止按钮出现。\n\n## 74.15 处理地图手势交互\n\n\n\n\n\nGoogle\
  \ Maps Android API 能够响应多种不同的用户交互。这些交互可用于更改显示的地图区域、缩放级别甚至视角角度（例如为某些城市显示地图区域的 3D 表示）。\n\
  \n### 74.15.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法来启用或禁用与地图放大和缩小相关的手势。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中，也可以通过将 `map:uiZoomGestures` 属性设置为 `true` 或 `false` 来实现相同的效果。\n\
  \n当启用后，当用户在屏幕上进行捏合手势时，将会发生缩放。同样地，双击会放大，而双指轻点会缩小。另一方面，单指缩放手势是通过双击但不松开第二次点击，然后在屏幕上上下滑动手指来分别放大或缩小的。\n\
  \n### 74.15.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指在屏幕上拖动地图来在地图上移动。可以通过调用 `UiSettings` 实例的\
  \ `setScrollGesturesEnabled()` 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动功能。\n\n### 74.15.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动它们来调整倾斜角度，从而改变地图的投影角度。可以通过调用 `UiSettings` 实例的\
  \ `setTiltGesturesEnabled()` 方法启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setTiltGesturesEnabled(true);\n\
  ```\n\n倾斜手势也可以使用 XML 布局资源文件中的 `map:uiTiltGestures` 属性来启用或禁用。\n\n### 74.15.4 地图旋转手势\n\
  \n通过在屏幕上放置两个手指并进行圆周运动，当启用地图旋转手势时，用户可以旋转地图的朝向。这种手势支持在代码中通过调用 `UiSettings` 实例的 `setRotateGesturesEnabled()`\
  \ 方法启用或禁用，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setRotateGesturesEnabled(true);\n```\n\n旋转手势也可以使用 XML 布局资源文件中的 `map:uiRotateGestures`\
  \ 属性来启用或禁用。\n\n## 74.16 创建地图标记\n\n标记（Markers）用于通知用户地图上的位置，其形式为标准图标或自定义图标。标记还可能包含标题和可选的文本（称为“摘要”/snippet），并可以配置为允许用户将它们拖动到地图上的不同位置。当用户点击标记时，将弹出一个信息窗口，显示有关标记位置的附加信息。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。作为此方法的参数传递的是\
  \ `MarkerOptions` 类实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定 `latitude`（纬度）和 `longitude`（经度）值定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码在地图特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \n.\n.\n.\n\nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum\
  \ = mMap.addMarker(new MarkerOptions()\n                .position(position)\n  \
  \              .title(\"Museum\")\n                .snippet(\"National Air and Space\
  \ Museum\"));\n```\n\n执行上述代码将将标记指定的的位置，点击该位置时将显示一个包含标题和摘要的信息窗口，如图 74-11 所示：\n\n\
  ![](img/imageImage24513.jpg)\n\n图 74-11\n\n## 74.17 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球体，因此\
  \ Google Maps Android API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的摄像头一样。Google\
  \ Maps Android API 允许在应用程序内部实时更改此摄像机的目标（target）、缩放（zoom）、方位（bearing）和倾斜（tilt）：\n\
  \n- **Target（目标）** – 地图在设备显示中的中心位置，以 `longitude` 和 `latitude` 指定。\n- **Zoom（缩放）**\
  \ – 摄像机的缩放级别。\n- **Bearing（方位）** – 地图相对于北方的朝向（度数）。\n- **Tilt（倾斜）** – 摄像机的倾斜角度。\n\
  \n\n\n\n```java\nCameraPosition cameraPosition = new CameraPosition.Builder()\n\
  \    .target(position)\n    .zoom(50)\n    .bearing(70)\n    .tilt(25)\n    .build();\n\
  \nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(\n    cameraPosition));\n\
  ```\n\n## 74.18 总结\n\n本章概述了构成 Google Maps Android API 的关键类和方法，并概述了准备开发环境和应用程序项目以使用该\
  \ API 所需的步骤。\n\n## 75. 使用 Android 打印框架进行打印\n\n随着 Android 4.4 KitKat 的发布，从 Android\
  \ 应用程序内部打印内容已成为可能。虽然后续章节将更详细地探讨为自己的应用程序添加打印支持的选项，但本章将重点关注 Android 中目前可用的各种打印选项以及启用这些选项的步骤。在涵盖了这些初始主题后，本章将概述\
  \ Android 开发者在为应用程序构建打印支持时，可以使用的各种打印功能。\n\n### 75.1 Android 打印架构\n\nAndroid 打印由打印框架（Printing\
  \ framework）提供。简单来说，该框架由一个`打印管理器`（Print Manager）和若干打印服务插件（print service plugins）组成。`打印管理器`负责处理来自设备应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求得到执行。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他打印类型的打印服务插件（如果尚未安装）也可以从\
  \ Google Play 商店获取。目前可用 HP、爱普（Epson）、三星和佳能的打印服务插件，其他打印机制造商的插件未来很可能会发布，尽管 Google\
  \ Cloud Print 服务插件也可以用于从 Android 设备打印到几乎任何类型和型号的打印机。出于本书的考虑，我们将使用 HP 打印服务插件作为参考示例。\n\
  \n### 75.2 打印服务插件\n\n打印服务插件的目的是允许应用程序打印到通过局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\n通过加载\
  \ Google Play 应用并搜索“Print Service Plugin”（打印服务插件），可以验证 Android 设备上是否存在`打印服务插件`。一旦插件在\
  \ Play 商店列出，如果该插件尚未安装，可以通过点击`Install`（安装）按钮进行安装。例如，图 75-1 显示了 Google Play 中的 HP\
  \ 打印服务插件。\n\n打印服务插件会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 75-1\n\n### 75.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一项服务，允许您从任何连接互联网的地方通过网络将内容打印到自己的打印机上。Google\
  \ Cloud Print 支持以云就（Cloud Ready）和经典（Classic）打印机形式的设备和打印机型号。云就打印机内置了支持通过网页打印的技术。提供云就打印机的制造商包括百得（Brother）、佳能（Canon）、戴尔（Dell）、爱普（Epson）、HP、柯达（Kodak）和三星。要确定您的打印机是否既支持云就又受\
  \ Google Cloud Print 支持，请查看以下 URL 上的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典非云就打印机，Google Cloud Print 通过在连接经典打印机的计算机系统上（直接连接或通过家庭或办公室网络连接）安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用登录 Android 设备时相同的 Google 账户 ID 登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您在设备上的 Android 应用程序中打印时，它们将作为打印目标选项列出。\n\n###\
  \ 75.4 打印到 Google Drive\n\n除了支持实体打印机，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，选择打印面板中的`Save\
  \ to Google Drive`（保存到 Google Drive）选项。要打印的内容将被转换为 PDF 文件并保存到与设备上当前活跃 Google 账户\
  \ ID 关联的 Google Drive 云存储中。\n\n### 75.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容作为\
  \ PDF 文件本地保存到 Android 设备上。一旦选中此选项，系统将请求 PDF 文件的名称以及在设备上保存文档的位置。\n\n`Save as PDF`（保存为\
  \ PDF）和 Google Drive 选项在测试自己的 Android 应用程序的打印功能时，对于节省纸张可能是非常有价值的。\n\n### 75.6 从\
  \ Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序通过将打印选项放在溢出菜单（Overflow menu）中。许多与 Android\
  \ 捆定的应用程序现在都包含了“Print...”（打印……）菜单选项。例如，图 75-2 显示了在 Chrome 浏览器中通过选择“Share...”（分享……）选项访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n\n图 75-2\n\n一旦在应用程序中选择了打印选项，将出现标准的 Android\
  \ 打印屏幕，显示要打印内容的预览，如图 75-3](#Printing.xhtml__idTextAnchor1458）所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\
  \n图 75-3\n\n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 75-4\n\n\
  Android 打印面板提供了纸张大小、颜色、方向和份数等常用的打印选项。点击当前打印机或 PDF 输出可以选择访问其他打印目标选项。\n\n### 75.7\
  \ 为 Android App 构建打印支持的选项\n\n打印框架提供了多种在 Android 应用程序中整合打印支持的选项。这些选项可以分类如下：\n\n####\
  \ 75.7.1 图像打印\n\n正如名称所示，此选项允许在 Android 应用程序中整合图像打印。向应用程序添加此功能时，第一步是创建 `PrintHelper`\
  \ 类的实例：\n\n```java\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n\
  接下来，通过调用 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT` 图像将适应纸张大小，而不进行任何裁剪或更改比例。这通常会导致在一个维度上出现白边。\n\
  - `SCALE_MODE_FILL` 图像将填充纸张大小，必要时进行裁剪以避免打印输出中出现白边。\n\n在没有设置缩放模式的情况下，系统将默认为 `SCALE_MODE_FILL`。例如，以下代码为之前声明的\
  \ `PrintHelper` 实例设置缩放适应模式：\n\n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n\n\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()`\
  \ 方法传递以下选项之一来实现的：\n\n* `COLOR_MODE_COLOR` – 表示以彩色打印图像。\n* `COLOR_MODE_MONOCHROME`\
  \ – 表示以黑白打印图像。\n\n打印框架将默认使用彩色打印，除非按照如下方式指定了单色选项：\n\n```java\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作仅需要一个要打印的图像，并调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表打印任务名称的字符串以及图像的引用（形式为\
  \ `Bitmap` 对象或指向图像的 `Uri` 引用）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ R.drawable.oceanscene);\nimagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n\
  ```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n## 75.7.2 创建并打印 HTML\
  \ 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 内容简单方法。这些内容可以是由网站上托管的页面 URL 引用的 HTML\
  \ 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，支持以极少的代码要求进行打印。\n\
  \n当动态创建 HTML 内容（而不是加载和打印现有的网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view 客户端，在 HTML 加载到 `WebView` 完成后启动打印任务。在配置好 web view 客户端后，HTML 被加载到 `WebView`\
  \ 中，此时就会触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url)\n\
  \        {\n            return false;\n        }\n        @Override\n        public\
  \ void onPageFinished(WebView view, String url) {\n            createWebPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    String htmlDocument =\n\
  \        \"<html><body><h1>Android Print Test</h1><p>\"\n        + \"This is some\
  \ sample content.</p></body></html>\";\n    webView.loadDataWithBaseURL(null, htmlDocument,\
  \ \"text/HTML\", \"UTF-8\", null);\n    myWebView = webView;\n}\n```\n\n该方法的代码首先声明了一个名为\
  \ `myWebView` 的变量，其中存储方法中创建的 `WebView` 实例的引用。在 `printContent()` 方法中，创建一个 `WebView`\
  \ 类的实例，然后为其分配一个 `WebViewClient` 实例。然后配置该 web view 客户端，在 HTML 加载到 `WebView` 完成后启动打印任务。在配置好\
  \ web view 客户端后，HTML 被加载到 `WebView` 中，此时就会触发打印过程。\n\n该方法的代码首先声明了一个名为 `myWebView`\
