  图 72-5\n\n点击操作按钮并等待 Toast 消息显示视频名称：\n\n![](img/as_pip_window_toast.jpg)\n图 72-6\n\
  \n### 72.8 总结\n\n本章演示了如何在 Android Studio 项目中添加画中画支持，包括启用和进入 PiP 模式以及实现 PiP 操作。这包括了使用广播接收器和待处理意图（pending\
  \ intents）来实现 PiP 窗口与 activity 之间的通信。\n\n## 73 使用 MediaPlayer 和 MediaRecorder 进行\
  \ Android 音频记录和播放\n\n本章将提供 `MediaRecorder` 类的概述，并解释该类录制音频或视频的基础知识。还将介绍使用 `MediaPlayer`\
  \ 类播放音频。我们将创建一个示例应用程序来演示这些技术。在处理音频和视频的同时，本章还将涉及将保存到 SD 卡的主题。\n\n### 73.1 播放音频\n\n\
  在音频播放方面，大多数实现支持 AAC LC、HE-AACv1 (AAC+)、HE-AACv2 (增强 AAC+)、AMR-NB、AMR-WB、MP3、MIDI、Ogg\
  \ Vorbis 以及 PCM/WAVE 格式。\n\n音频播放可以使用 `MediaPlayer` 或 `AudioTrack` 类。`AudioTrack`\
  \ 是更高级的选项，它使用音频缓冲区并提供更大的控制。相比之下，`MediaPlayer` 类提供了更简单的编程接口，满足大多数音频需求。\n\n`MediaPlayer`\
  \ 类关联了一系列供应用程序调用以执行特定任务的方法。部分关键方法如下：\n\n-   `create()` – 调用创建类的新实例，传递要播放音频的 `Uri`。\n\
  -   `setDataSource()` – 设置要播放音频的源。\n-   `prepare()` – 指令播放器准备开始播放。\n-   `start()`\
  \ – 开始播放。\n-   `pause()` – 暂停播放。可以通过调用 `resume()` 方法恢复。\n-   `stop()` – 停止播放。\n\
  -   `setVolume()` – 两个浮点数参数，指定左右通道的播放音量。\n-   `resume()` – 恢复之前暂停的播放会话。\n-   `reset()`\
  \ – 重置媒体播放器实例的状态。本质上将实例置回未初始化状态。至少重置后的播放器需要重新设置数据源并调用 `prepare()` 方法。\n-   `release()`\
  \ – 当播放器实例不再需要时调用。此方法确保播放器持有的任何资源被释放。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer` 类实例，设置要播放音频的源，然后调用\
  \ `prepare()` 以及 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer = new MediaPlayer();\n\
  mediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\");\nmediaPlayer.prepare();\n\
  mediaPlayer.start();\n```\n\n### 73.2 使用 MediaRecorder 类录制音频和视频\n\n\n\n\n\n与音频播放一样，可以使用多种不同的技术进行录制。一种选择是使用\
  \ `MediaRecorder` 类，它与 `MediaPlayer` 类一样，提供了许多用于录制音频的方法：\n\n- `setAudioSource()`\
  \ – 指定要录制的音频的源（通常对于设备麦克风，这通常是 `MediaRecorder.AudioSource.MIC`）。\n- `setVideoSource()`\
  \ – 指定要录制的视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()` –\
  \ 指定录制的音频或视频要存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定用于录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` –\
  \ 配置存储录制音频或视频的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` -\
  \ 开始录制过程。\n- `stop()` – 停止录制过程。一旦录制器停止，在重启之前需要完全重新配置和准备。\n- `reset()` – 重置录制器。在重启之前，实例需要完全重新配置和准备。\n\
  - `release()` – 当录制器实例不再需要时应调用。此方法确保实例持有的所有资源都被释放。\n\n使用该类的典型实现将设置源、输出和编码格式以及输出文件。然后将调用\
  \ `prepare()` 和 `start()` 方法。当录制结束时将调用 `stop()` 方法，然后是 `reset()` 方法。当应用程序不再需要录制器实例时，建议调用\
  \ `release()` 方法：\n\n```\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  \n.\n.\n\nmediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release();\n\
  ```\n\n要录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如标题为在 Android 中请求运行时权限”的章节所述，访问麦克风属于危险权限范畴。因此，为了支持\
  \ Android 6，在应用程序启动时必须对对麦克风访问进行特定请求，相关步骤将在本章稍后部分介绍。\n\n## 73.3 关于示例项目\n\n本章的剩余部分将介绍创建一个示例应用程序，该程序旨在演示如何使用\
  \ `MediaPlayer` 和 `MediaRecorder` 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序（麦克风就是一个例子）时，在应用程序代码中尝试访问它之前，检查该功能的可用性至关重要。因此，在本章中创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频将需要存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 73.4 创建 AudioApp 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置更改为 `API 31: Android 12.0`，并将语言菜单更改为\
  \ `Java`。按照第 11.8 将项目迁移到 View Binding 节列出的步骤为项目添加 view binding 支持。\n\n### 73.5 设计用户界面\n\
  \n创建新项目后，从 Project 工具窗口中选择 `activity_main.xml` 文件，并在 Design（设计）模式下的 Layout Editor\
  \ 工具中选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖入布局中。按钮的位置对于本示例来说并不重要，但图\
  \ 73-1 显示了一个使用垂直链的建议布局。\n\n配置按钮显示读取 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们赋予\
  \ `playButton`、`recordButton` 和 `stopButton` 视图 ID。\n\n选择 Play 按钮，并在 Attributes（属性）面板中配置\
  \ `onClick` 属性，以便用户选择时调用名为 `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio`\
  \ 的方法。\n\n![](img/as_audio_app_ui.jpg)\n\n图 73-1\n\n## 73.6 检查麦克风可用性\n\n在没有麦克风的设备上录制音频会导致\
  \ Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。实现此有多种方法，包括检查设备的物理存在。一种更简单且可能在不同 Android\
  \ 设备上可行的方法是询问 Android 系统是否安装了特定功能的包。这涉及创建一个 `AndroidPackageManager` 类的实例，然后调用对象的\
  \ `hasFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是我们关注的功能。\n\n为了本示例，我们将创建一个方法\
  \ `hasMicrophone()`，以便在检查麦克风是否存在时调用它。在 Project 窗口中，双击 `MainActivity.java` 文件并修改它以添加此方法：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity {\n\n    protected boolean hasMicrophone() {\n     \
  \   PackageManager pmanager = this.getPackageManager();\n        return pmanager.hasFeature(PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 73.7 初始化 Activity\n\n下一步是修改 activity 以执行若干初始化任务。保持在 `MainActivity.java`\
  \ 文件中，按如下方式修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n// ... 代码省略 ...\n\
  ```\n\n\n\n\n\n```java\nbinding.stopButton.setEnabled(false);\n}\n\nFile audioFile\
  \ = new File(this.getFilesDir(), \"myaudio.3gp\");\naudioFilePath = audioFile.getAbsolutePath();\n\
  \n}\n}\n```\n\n新增的代码调用了 `hasMicrophone()` 方法来确定设备是否包含麦克风。如果不包含，所有按钮都将被禁用；否则仅禁用停止（Stop）和播放（Play）按钮。\n\
  \n下一行代码需要更详细的解释：\n\n```java\nFile audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );\naudioFilePath = audioFile.getAbsolutePath();\n```\n\n这段代码在应用程序的内部存储中创建一个名为 `myaudio.3gp`\
  \ 的新文件，用于存储录音。\n\n### 73.8 实现 `recordAudio()` 方法\n\n当用户触摸记录（Record）按钮时，将调用 `recordAudio()`\
  \ 方法。该方法需要启用和禁用相应的按钮，并配置 `MediaRecorder` 实例，，关于音频源信息、输出格式和编码以及存储音频的文件位置。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。结合这些要求，在 `MainActivity.java` 文件中形成了以下方法实现：\n\
  \n```java\npublic void recordAudio (View view)\n{\n    isRecording = true;\n   \
  \ binding.stopButton.setEnabled(true);\n    binding.playButton.setEnabled(false);\n\
  \    binding.recordButton.setEnabled(false);\n    try {\n        mediaRecorder =\
  \ new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(\n            MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n### 73.9 实现 `stopAudio()` 方法\n\n`stopAudio()`\
  \ 方法负责启用播放（Play）按钮，禁用停止（Stop）按钮，然后停止并重置 `MediaRecorder` 实例。实现此点的代码如下列表所示，并应添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording)\n    {\n       \
  \ binding.recordButton.setEnabled(false);\n        mediaRecorder.stop();\n     \
  \   mediaRecorder.release();\n        mediaRecorder = null;\n        isRecording\
  \ = false;\n    } else {\n        mediaPlayer.release();\n        mediaPlayer =\
  \ null;\n        binding.recordButton.setEnabled(true);\n    }\n}\n```\n\n### 73.10\
  \ 实现 `playAudio()` 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\
  \n```java\npublic void playAudio (View view) throws IOException\n{\n    binding.playButton.setEnabled(false);\n\
  \    binding.recordButton.setEnabled(false);\n    binding.stopButton.setEnabled(true);\n\
  \    mediaPlayer = new MediaPlayer();\n    mediaPlayer.setDataSource(audioFilePath);\n\
  \    mediaPlayer.prepare();\n    mediaPlayer.start();\n}\n```\n\n### 73.11 配置并请求权限\n\
  \n在测试应用程序之前，必须在清单文件（manifest file）中为请求适当的权限。具体来说，应用程序需要访问麦克风的权限。在 Project 工具窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 添加权限标签：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n<application\n```\n\n上述步骤将足以确保用户在运行 Android\
  \ 6.0 之前的版本的设备上安装应用时，能够启用麦克风访问。麦克风访问在 Android 中被归类为危险权限，因为它赋予了应用程序损害用户隐私的可能。为了让示例程序在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在运行时专门请求权限。编辑 `MainActivity.java` 文件，首先添加一些导入指令和常量，作为所请求权限的请求码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 10;\n```\n\n接下来，需要向类中添加一个方法，其目的是将请求的权限和相应的请求标识作为参数。继续留在 `MainActivity.java`\
  \ 类中，如下实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用本书“在 Android 中运行时权限”章节概述的步骤，上述方法在进行请求之前会验证指定的权限是否已经授予，并传递标识码。\n\
  \n当请求处理后，将在 Activity 上调用 `onRequestPermissionsResult()`，传递标识码和请求结果。因此下一步是在 `MainActivity.java`\
  \ 文件中如下实现该方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            binding.recordButton.setEnabled(false);\n\
  \            Toast.makeText(this, \"Record permission required\", Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码检查请求标识码以确定返回的是哪个权限请求，权限相应的权限。如果权限被拒绝，将向用户显示消息，指示应用无法运行并禁用记录按钮。\n\
  \n在测试应用之前最后剩下的是在应用启动时调用新增的麦克风访问 `requestPermission()` 方法。留在 `MainActivity.java`\
  \ 文件中，如下修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n\n    File audioFile = new File(this.getFilesDir(),\
  \ \"myaudio.3gp\");\n    audioFilePath = audioFile.getAbsolutePath();\n    requestPermission(Manifest.permission.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n}\n```\n\n\n\n\n在带有麦克风的 Android 设备上编译并运行应用程序，允许访问麦克风并点击\
  \ Record（录制）按钮。录制后，点击 Stop（停止）然后点击 Play（播放），此时录制的音频应通过设备扬器播放。\n\n### 73.13 总结\n\n\
  Android SDK 提供了多种实现音频录制的机制。本章介绍了其中两种，即 `MediaPlayer` 和 `MediaRecorder` 类。在涵盖使用这些技术的理论之后，本章详细介绍了如何创建一个示例应用程序，用于录制并回放音频。在\
  \ Android 中处理音频的过程中，本章还研究了在尝试录制音频之前，确保运行应用程序的设备具有麦克风的步骤。\n\n## 74. 在 Android Studio\
  \ 中使用 Google Maps Android API\n\n当 Google 在许多年前决定引入地图服务时，很难说他们是否曾预见到过会有可以集成到移动应用程序中的版本。当\
  \ 2005 年最初的、Google Maps 的 Web 版本发布时，iPhone 尚未引发智能手机的革命，而开发 Android 操作系统的公司在六个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有何愿景，值得注意的是，现在通过 Android 应用程序使用 Google Maps\
  \ Android API 直接访问 Google Maps 的所有功能。\n\n本章旨在概述 Google Maps 系统和 Google Maps Android\
  \ API。本章将概述构成 API 的不同元素，详细说明配置用于 Google Maps 的开发环境的必要步骤，并通过一些代码示例演示 Google Maps\
  \ Android 集成的基础知识。\n\n### 74.1 Google Maps Android API 的元素\n\nGoogle Maps Android\
  \ API 由一组核心类组成，这些类组合在一起为 Android 应用程序提供制图功能。地图的关键元素如下：\n\n- `GoogleMap` – Google\
  \ Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap` 对象不是由应用程序直接创建的，而是在创建\
  \ `MapView` 或 `MapFragment` 实例时创建的。在应用程序代码中，可以通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment`\
  \ 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView` - `View` 类的子类，该类提供了视图画布，`GoogleMap`\
  \ 对象在其上绘制地图，允许将地图放置在 activity 的用户界面布局中。\n- `SupportMapFragment` – `Fragment` 类的子类，该类允许将地图放置在\
  \ Android 布局中的 `Fragment` 中。\n- `Marker` – `Marker` 类的作用允许在地图上标记位置。通过获取与地图关联的 `GoogleMap`\
  \ 对象引用，然后调用该对象实例的 `addMarker()` 方法向地图添加标记。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。Marker\
  \ 可以进行多种配置，包括指定标题、文本和图标。Marker 还可以设置为“可拖拽的”（draggable），允许用户将标记移动到地图上的不同位置。\n- `Shapes`\
  \ – 在地图上绘制线条和形状是通过使用 `Polyline`、`Polygon` 和 `Circle` 类实现的。\n- `UiSettings` – `UiSettings`\
  \ 类提供了从应用程序内部控制地图上出现的用户界面控件的功能。例如，使用该类，应用程序可以控制缩放、当前位置和罗盘控件是否显示在地图上。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer` – 当启用时，`My Location Layer` 在地图上显示一个按钮，用户选择该按钮后，地图将中心定位到用户的当前地理位置。如果用户处于静止状态，该位置在地图上由蓝色标记表示。如果用户正在移动，该位置由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时突出 API\
  \ 的关键领域。\n\n### 74.2 创建 Google Maps 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `No Activity`（无活动）模板。\n\n在 `Name` 字段输入 `MapDemo` 并指定 `com.ebookfrenzy.mapdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置改为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n接下来，在 Project 工具窗口中右键点击 `app` ->\
  \ `java` -> `com.ebookfrenzy.mapdemo` 项，选择 `New -> Google -> Google Maps Views Activity`\
  \ 菜单选项。最后，在 `New Android Activity` 对话框中勾选 `Launcher Activity` 复选框，然后点击 `Finish`\
  \ 按钮：\n\n![](img/as_new_activity_dialog.jpg)\n\n图 74-1\n\n### 74.3 创建 Google Cloud\
  \ 结算账户\n\n在使用 Google Map APIs 之前，你必须先创建一个 Google Cloud 结算账户（除非你已经有一个，如果是可以跳到下一节）。要执行此操作，打开浏览器并使用以下链接导航到\
