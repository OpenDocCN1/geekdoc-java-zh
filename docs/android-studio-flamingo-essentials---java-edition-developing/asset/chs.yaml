  \ `Design` 模式下选择并删除 `nav_host_fragment_content_main` 对象。从调板的 `Widgets` 部分将 `WebView`\
  \ 对象拖放到设备屏幕中心。点击 `Infer constraints`（推断约束）按钮，使用 `Attributes`（属性）工具将 `WebView` 的\
  \ `layout_width` 和 `layout_height` 属性更改为 `match constraint`，使其填充整个画布。选择新添加的 `WebView`\
  \ 实例并将 `ID` 更改为 `myWebView`。在继续本教程的下一步之前，需要向项目添加额外的权限，以允许 `WebView` 对象访问互联网并下载网页。在\
  \ `Project` 窗口中找到 `AndroidManifest.xml` 文件并双击将其加载到编辑面板以添加此权限。加载后，编辑 XML 内容添加所示的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.webprint\"\
  >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\
  \ android:allowBackup=\"true\">\n</manifest>\n```\n图 76-2\n\n## 76.7 从 MainActivity\
  \ 访问 WebView\n\n与“RecyclerView 和 CardView”章节中的项目一样，我们需要能够从 `MainActivity` 类通过视图绑定访问\
  \ `content_main.xml` 中的组件（本例中为 `myWebView`）。为了能访问 `content_main.xml` 中的视图，我们首先需要在包含处为其分配一个\
  \ `id`。编辑 `activity_main.xml` 文件，使 `include` 元素如下：\n\n```xml\n<include android:id=\"\
  @+id/contentMain\" layout=\"@layout/content_main\" />\n```\n\n## 76.8 将网页加载到 WebView\n\
  \n在打印网页之前，需要将其加载 `WebView` 实例。对于本教程，这将通过调用 `WebView` 实例的 `loadUrl()` 方法来实现，该调用将放在命名为\
  \ `configureWebView()` 的方法中并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，请修改 `MainActivity.java`\
  \ 文件如下：\n\n```java\npackage com.ebookfrenzy.webprint;\n\nimport android.view.Menu;\n\
  import android.view.MenuItem;\nimport android.webkit.WebView;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n\
  \n    @Override\n    protected void onStart() {\n        super.onStart();\n    \
  \    configureWebView();\n    }\n\n    private void configureWebView() {\n     \
  \   myWebView = findViewById(R.id.myWebView);\n        myWebView.setWebViewClient(new\
  \ WebViewClient()){\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView\
  \ view, WebResourceRequest request) {\n                return super.shouldOverrideUrlLoading(view,\
  \ request);\n            }\n        });\n        myWebView.loadUrl(\"https://www.answertopia.com\"\
  );\n    }\n}\n```\n\n## 76.9 添加打印菜单选项现在可以使用“在 Android 上创建和管理溢出菜单”章节概述的技术将打印选项添加到溢出菜单中。第一个要求是用于标记菜单选项的字符串资源。在\
  \ `Project` 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击它将其加载到编辑器并修改它以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n</resources>\n\
  ```\n\n\n\n\n```xml\n<resources>\n    <string name=\"action_settings\">Settings</string>\n\
  \    <string name=\"print_string\">Print</string>\n</resources>\n```\n\n接下来，将应用\
  \ -> `res` -> `menu` -> `menu_main.xml` 文件加载到菜单编辑器中，切换到 代码模式并将 Settings 菜单选项替换为打印选项：\n\
  \n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\"\
  >\n    <item android:id=\"@+id/action_settings\"\n        android:title=\"@string/action_settings\"\
  \n        android:orderInCategory=\"100\"\n        app:showAsAction=\"never\" />\n\
  \    <item\n        android:id=\"@+id/action_print\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n配置菜单选项的最后剩余工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理方法：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n在实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前的 HTMLPrint 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \        .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                  \
  \  \" Print Test\";\n        printManager.print(jobName, printAdapter,\n       \
  \         new PrintAttributes.Builder().build());\n    }\n}\n```\n\n代码更改完成后，在物理\
  \ Android 设备或运行 Android 版本 5.0 或更高版本的模拟器上运行应用程序。一旦成功启动，`WebView` 应该是可见的并加载了指定的网页。页面加载后，从溢出菜单中选择打印\
  \ 选项，并使用生成的打印面板将网页打印到合适的目标。\n\n### 76.10 总结\n\nAndroid 打印框架包含了对 `WebView` 类的扩展，使得在\
  \ Android 应用程序内部打印基于 HTML 的内容成为可能这些内容可以是应用程序在运行时动态创建的 HTML 形式，也可以是加载到 `WebView`\
  \ 实例中的预存在网页。对于动态创建的 HTML，使用 `WebViewClient` 实例至关重要，以确保在 HTML 完全加载到 `WebView` 之前不开始打印。\n\
  \n## 77. Android 自定义文档打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或 HTML 标记形式，Android 打印框架就可以在应用程序中构建打印支持变得相对容易。更高级的打印需求可以通过打印框架的自定义文档打印功能来满足。\n\
  \n### 77.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（canvases）来表示要打印的文档页面。应用程序以形状、颜色、文本和图像将要打印的内容绘制在这些画布上。事实上，画布是由\
  \ Android `Canvas` 类实例表示的，从而提供了对绘制 API 的访问。虽然这听起来很简单，但实际上有很多需要执行的步骤，可以总结如下：\n\n\
  - 通过子类 `PrintDocumentAdapter` 实现自定义打印适配器\n- 获取 `PrintManager` 的引用\n- 创建 `PdfDocument`\
  \ 实例\n- 以 `PdfDocument.Page` 实例的形式向 `PdfDocument` 中添加页面\n- 获取与页面相关的 `Canvas` 对象的引用\n\
  - 在 `Canvas` 上绘制内容\n- 将 PDF 文档写入打印框架提供的目标位置\n- 通知打印框架文档已就绪\n\n在本章中，将提供这些步骤的概述，随后将提供一个演示自定义打印实现的教程。\n\
  \n#### 77.1.1 自定义适配器\n\n打印适配器的作用是为打印框架提供要打印的内容，并确保其根据用户的偏好（如纸张大小和方向）正确格式化。在打印 HTML\
  \ 和图像时，大部分工作是由打印框架一部分提供的适配器完成的。例如，在打印网页时，当我们调用 `WebView` 实例的 `createPrintDocumentAdapter()`\
  \ 时，会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，设计打印适配器并实现代码是应用程序开发者的责任。自定义打印适配器是通过子类 `PrintDocumentAdapter`\
  \ 并覆盖该类中的一组回调方法创建的，这些方法将在打印过程的不同阶段被打印框架调用。这些回调方法可以总结为：\n\n- `onStart()`：此方法在打印过程开始时被调用，以便应用程序代码有机会为创建打印作业执行任何必要的任务。（可选）\n\
  - `onLayout()`：此回调方法在调用 `onStart()` 之后以及每次用户更改打印设置时被调用。此方法应根据需要调整内容和布局。完成更改后，方法必须返回要打印的页数。（强制）\n\
  - `onWrite()`：此方法在每次调用 `onLayout()` 之后被调用，负责在要打印页面的画布上渲染内容。在其他参数中，此方法接收一个文件描述符，在渲染完成后必须将生成的\
  \ PDF 文档写入其中。然后会调用 `onWriteFinished()` 回调方法。（强制）\n- `onFinish()`：这是一个可选方法，如果实现，它将在打印完成后由打印框架调用一次，从而为应用程序提供执行任何清理操作的机会。\n\
  \n## 77.2 准备自定义文档打印项目\n\n从欢迎屏幕选择 New Project 选项，并在生成的新项目对话框中选择 Empty Views Activity\
  \ 模板，然后点击 Next 按钮。\n\n\n\n\n在 `Name` 字段中输入 `CustomPrint`，并将 `com.ebookfrenzy.customprint`\
  \ 指定为包名。在点击 Finish（完成）按钮之前，将 `Minimum API level`（最小 API ）设置为 `API 26: Android 8.0\
  \ (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout\
  \ Editor` 工具，并在 `Design` 模式下选择并删除“Hello World!” `TextView` 对象。从调色板的 Form Widgets\
  \ 部分拖入一个 `Button` 视图，并将其放置在布局视图的中心。选中 `Button` 视图后，将 text 属性更改为“Print Document”，并将该字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 77-1 所示所示匹配：\n\n![](img/as_custom_print_ui.jpg)\n\n图 77-1\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。在\
  \ `Attributes`（属性）工具窗口中，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n### 77.3 创建自定义打印适配器\n\
  \n在 Android 应用程序内部打印自定义文档涉及的大部分工作是自定义打印适配器的实现。本示例将需要一个实现了了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n.\n\nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \                    PrintAttributes newAttributes,\n                          \
  \           CancellationSignal cancellationSignal,\n                           \
  \          LayoutResultCallback callback,\n                                    \
  \ Bundle metadata) {\n        }\n        @Override\n        public void onWrite(final\
  \ PageRange[] pageRanges,\n                                     final ParcelFileDescriptor\
  \ destination,\n                                     final CancellationSignal cancellationSignal,\n\
  \                                     final WriteResultCallback callback) {\n  \
  \      }\n    }\n.\n.\n}\n```\n\n目前该新类的状态是它包含一个构造方法，该方法在创建类的新实例时会被调用。构造方法将调用传入的\
  \ `context` 作为参数，并对其进行存储，以便在后续两个方法中引用它。在建立类的大纲后，下一步是开始实现这两个方法，从 `onLayout()` 开始。\n\
  \n### 77.4 实现 onLayout() 回调\n\n继续留在 `MainActivity.java` 文件中，开始添加 `onLayout()` 方法代码所需的导入语句：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n.\n.\nimport android.print.PrintDocumentInfo;\n\
  import android.print.PrintedPdfDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  public class MainActivity extends AppCompatActivity {\n.\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter`\
  \ 类以声明在 `onLayout()` 方法使用的变量：\n\n```java\npublic static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter\n{\n    Context context;\n    int pageHeight;\n \
  \   int pageWidth;\n    PdfDocument myPdfDocument;\n    int totalpages = 4;\n.\n\
  }\n```\n\n注意，对于本示例而言，将打印一个四页文档。在更复杂的情况下，应用程序可能需要根据内容的数量、布局相对于用户的纸张尺寸和方向，动态计算需要打印的页数。声明变量后，按照以下代码大纲实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                                     PrintAttributes newAttributes,\n         \
  \                            CancellationSignal cancellationSignal,\n          \
  \                           LayoutResultCallback callback,\n                   \
  \                  Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ = new PrintDocumentInfo\n                .Builder(\"print_output.pdf\").setContentType(\n\
  \                    PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n                .setPageCount(totalpages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n显然，此方法执行了相当多的任务，每个任务都需要详细的解释。\n\n首先，以 `PdfDocument` 类实例的形式创建一个新的\
  \ PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是 `PrintAttributes` 类型的对象，包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置详情。这些设置在创建\
  \ PDF 文档时会结合我们通过构造方法存储的 context 使用：\n\n```java\nmyPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n```\n\n该方法随后使用 `PrintAttributes` 对象提取页的高度和宽度值。这些维度在对象中是以英寸千分之一的形式存储的。由于本示例中后续使用这些值的方法是以\
  \ 1/72 英寸为单位，因此在存储之前对其进行了转换：\n\n```java\npageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\npageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n```\n\
  \n虽然此示例没有使用颜色选择，但此属性可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取，该方法将返回 `COLOR_MODE_COLOR`\
  \ 或 `COLOR_MODE_MONOCHROME`。\n\n当 `onLayout()` 方法被调用时，会传递一个 `LayoutResultCallback`\
  \ 类型的对象。该对象提供了一种通过一组方法向打印框架反馈状态信息机制。例如，如果用户取消了打印过程，则会调用 `onLayout()` 方法。进程已取消的事通过\
  \ `CancellationSignal` 参数中的一个设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n\n\n\n当布局工作完成后，需要调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传入两个参数。第一个参数采用 `PrintDocumentInfo`\
  \ 对象的形式，包含有关要打印文档的相关信息。这些信息包括用于 PDF 文档的名称、内容类型（在此例中是文档而非图像）以及页数。第二个参数是一个 `Boolean`\
  \ 值，表示自上一次调用 `onLayout()` 方法以来，布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n  \
  \  PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n            .Builder(\"\
  print_output.pdf\")\n            .setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为 0，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架（Printing framework）报告此失败。调用 `onLayoutFinished()` 方法则通知打印框架布局工作已完成，从而触发对\
  \ `onWrite()` 方法的调用。\n\n## 77.5 实现 `onWrite()` 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法的实现如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \              pageHeight, i).create();\n            PdfDocument.Page page =\n \
  \                   myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \                destination.getFileDescriptor()));\n    } catch (IOException e)\
  \ {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法开始后遍历文档中的每一页。然而，重要的是，用户可能并没有请求打印构成文档的所有页面。事实上，打印框架的 界面面板提供了指定打印某些页面或页码范围的选项。图\
  \ 77-2 显示了配置为打印文档第 1-4 页、第 9 页以及第 11-13 页的打印面板。\n\n![](img/Image24364.jpg)\n图 77-2\n\
  \n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架会将一个 `PageRange` 对象数组作为参数传入，指示要打印的页面范围。在上面的\
  \ `onWrite()` 实现中，对每个页都会调用一个名为 `pageInRange()` 的方法，以验证该页是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在在本章后部分实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n```\n\n对于位于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()`\
  \ 方法存储的高度和宽度值将作为参数传递，以便页面尺寸与用户选择的打印选项匹配：\n\n```java\nPageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\nPdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  ```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在这种情况下，代码在关闭并取消 `myPdfDocument`\
  \ 变量的引用之前，会通知打印框架已执行取消操作：\n\n```java\nif (cancellationSignal.isCanceled()) {\n \
  \   callback.onWriteCancelled();\n    myPdfDocument.close();\n    myPdfDocument\
  \ = null;\n    return;\n}\n```\n\n只要打印过程没有取消，该方法就会调用一个方法在调用 `myPdfDocument` 对象的\
  \ `finishPage()` 方法之前在当前页面上绘制内容。\n\n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n\
  ```\n\n`drawPage()` 方法负责将内容绘制到页面，并在 `onWrite()` 方法完成后实现。\n\n当所需的页面添加到 PDF 文档后，将使用作为\
  \ `onWrite()` 方法参数的文件描述符将文档写入目标。由于某种原因写入操作失败，该方法将通过调用 `WriteResultCallback` 对象的\
  \ `onWriteFailed()` 方法通知框架：\n\n```java\ntry {\n    myPdfDocument.writeTo(new FileOutputStream(\n\
  \            destination.getFileDescriptor()));\n} catch (IOException e) {\n   \
  \ callback.onWriteFailed(e.toString());\n    return;\n} finally {\n    myPdfDocument.close();\n\
  \    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteResultCallback` 对象的 `onWriteFinished()`\
  \ 方法通知打印框架文档已准备好打印。\n\n### 77.6 检查页面在范围内\n\n如前所述，当 `onWrite()` 被调用时，会传入一个 `PageRange`\
  \ 对象数组，指示要打印的文档页面范围。`PageRange` 类设计用于存储页范围的起始和结束页，这些可以通过类的 `getStart()` 和 `getEnd()`\
  \ 方法访问。\n\n在上一节中实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()` 的方法，该方法接收 `PageRange`\
  \ 对象数组和一个页码。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，可以在 `MainActivity.java` 类中的 `MyPrintDocumentAdapter`\
  \ 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n.\n.\n    private boolean pageInRange(PageRange[] pageRanges, int page) {\n\
  \        for (PageRange pageRange : pageRanges) {\n            if ((page >= pageRange.getStart())\
  \ &&\n                (page <= pageRange.getEnd())) {\n                return true;\n\
  \            }\n        }\n        return false;\n    }\n.\n.\n}\n```\n\n### 77.7\
  \ 在页面画布上绘制内容\n\n\n\n\n\n我们现在已经到了需要编写某些代码来在页面上绘制内容的阶段，以便它们准备好进行打印。所绘制的内容完全取决于特定的应用程序，并且仅限于\
  \ `Android Canvas` 类所能实现的功能。然而，为了本示例的目的，我们将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为\
  \ `drawPage()` 的方法，该方法接收两个参数：代表当前页面的 `PdfDocument.Page` 对象和一个表示页码的整数。在 `MainActivity.java`\
  \ 文件中，该方法应该如下实现：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\n\
  import android.graphics.Canvas;\n\nimport android.graphics.Color;\n\nimport android.graphics.Paint;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n.\n    public static\
  \ class MyPrintDocumentAdapter extends PrintDocumentAdapter\n    {\n.\n.\n     \
  \   private void drawPage(PdfDocument.Page page, int pagenumber) {\n           \
  \ Canvas canvas = page.getCanvas();\n            pagenumber++; // 确保页码从 1 开始\n \
  \           int titleBaseLine = 72;\n            int leftMargin = 54;\n        \
  \    Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n    \
  \        paint.setTextSize(40);\n            canvas.drawText(\n                \"\
  Test Print Document Page \" + pagenumber,\n                leftMargin,\n       \
  \         titleBaseLine,\n                paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify that custom document\
  \ printing works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber\
  \ % 2 == 0)\n                paint.setColor(Color.RED);\n            else\n    \
  \            paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(\n                pageInfo.getPageWidth()/2,\n  \
  \              pageInfo.getPageHeight()/2,\n                150,\n             \
  \   paint);\n        }\n.\n}\n```\n\n代码中的页码计数从 `0` 开始。由于文档从第 `1` 页开始，该方法首先增加页码。然后获取与页面关联的\
  \ `Canvas` 对象的引用，并声明了一些边距和基线：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置了字体大小并绘制了页面标题：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Print Document Page \" + pagenumber,\n\
  \    leftMargin,\n    titleBaseLine,\n    paint);\n```\n\n然后缩小字体大小并在标题下方绘制了一些正文：\n\
  \n```java\npaint.setTextSize(14);\ncanvas.drawText(\"This is some test content to\
  \ verify that custom document printing works\", leftMargin, titleBaseLine + 35,\
  \ paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇是偶后，该方法获取页面的高度和宽度，然后使用这些信息将圆置于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \    pageInfo.getPageHeight()/2,\n    150,\n    paint);\n```\n\n在 `canvas` 上绘制完成后，该方法将控制权交回\
  \ `onWrite()` 方法。\n\n### 77.8 开始打印任务\n\n当用户点击“Document”按钮时，将调用 `printDocument()`\
  \ 事件处理器。在开始测试之前，剩下的工作工作是将此方法添加到 `MainActivity.java`：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n.\n\nimport android.print.PrintManager;\nimport android.view.View;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n\n    public void printDocument(View\
  \ view) {\n        PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) + \" Document\";\n \
  \       printManager.print(jobName, new MyPrintDocumentAdapter(this), null);\n \
  \   }\n}\n```\n\n### 77.9 测试应用程序\n\n在运行 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。应用程序加载后，点击“Print\
  \ Document”按钮启动打印任务，并为输出选择一个合适的目标（“保存为 PDF”选项是一个避免浪费纸张和墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形的\
  \ 4 个页面。例如，图 77-3](#Custom_Printing.xhtml__idAnchor1501) 显示了作为 PDF 文件查看并准备保存的文档四页。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每项设置更改都应该反映在打印输出中，这表明自定义文档适配器正在正常运行。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 77-3\n\n### 77.10 总结\n\n虽然自定义文档打印比 Android 打印框架的 HTML 和图像打印要复杂，但它为在 Android\
  \ 应用程序内部打印复杂内容提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义打印适配器类，使其不仅能在文档页面上绘制内容，还能在用户更改打印设置（如纸张大小和页面范围）时做出正确响应。\n\
  \n## 78. Android App Links 简介\n\n随着技术的发展，网页和移动内容之间的传统界限正变得模糊。这一点在一个领域尤为明显：渐进式 Web\
  \ 应用日益流行。\n\n另一个趋势是让移动应用内部的内容可以通过网页搜索和 URL 链接被发现。在 Android 开发的背景下，App Links 功能专门设计用于让用户能够更容易发现并访问存储在\
  \ Android 应用程序中的内容，即使他们没有安装该应用程序。\n\n\n\n\n\n应用链接（App link）是一种标准的 HTTP URL，旨在作为从外部源（如网站或应用）直接链接到应用内特定地点的便捷方式。应用链接（也称为深度链接\
  \ deep links）主要用于鼓励用户与应用进行交互，并允许用户分享应用内容。\n\n应用链接的实现是一个多步骤过程，涉及在项目清单（manifest）中添加意图过滤器（intent\
  \ filters）、在关联的应用 activity 中实现链接处理代码，以及使用数字资产链接文件（digital asset links files）将应用与基于网络的内容进行关联。\n\
  \n这些步骤可以通过手动修改项目中的内容来完成，也可以使用 Android Studio App Links 助手自动完成。\n\n本章的剩余部分将从项目需要进行的更改来概述应用链接的实现。下一章（“Android\
  \ Studio App Links 教程”）将演示如何使用 App Links 助手来实现相同的结果。\n\n## 78.2 App Link 图过滤器\n\n\
  应用链接 URL 需要映射到应用项目中的特定 activity。这通过向项目的 `AndroidManifest.xml` 文件中添加意图过滤器来实现，这些过滤器旨在响应\
  \ `android.intent.action.VIEW` 操作来启动 activity。意图过滤器声明在要启动的 activity 元素内部，并且必须包含概述应用链接\
  \ URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个意图过滤器，当检测到匹配 `http://www.example.com/welcome`\
  \ 的应用链接时启动名为 `MyActivity` 的 activity：\n\n```xml\n<activity android:name=\"com.ebookfrenzy.myapp.MyActivity\"\
  >\n    <intent-filter android:autoVerify=\"true\">\n        <action android:name=\"\
  android.intent.action.VIEW\" />\n        <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n        <category android:name=\"android.intent.category.BROWSABLE\" />\n\
  \        <data\n            android:scheme=\"http\"\n            android:host=\"\
  www.example.com\"\n            android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n\
  </activity>\n```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的 `order` 属性指定，如下所示：\n\n```xml\n<application>\n\
  \    <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n.\n.\n```\n\n意图过滤器将导致应用链接启动正确的\
  \ activity，但仍需要在目标 activity 中实现代码以恰当处理该意图。\n\n## 78.3 处理 App Link 意图\n\n在大多数情况下，启动的\
  \ activity 需要获取应用链接 URL 的访问权限，并根据 URL 的结构采取特定操作。继续上面的示例，当通过包含 `/welcome/newuser`\
  \ 路径的 URL 启动时，activity 与通过路径设置为 `/welcome/existinguser` 的 URL 启动时可能显示不同的内容。\n\n\
  当 activity 由链接启动时，它会被接收传递一个意图对象，该对象包含了有关启动 activity 的操作的数据，包括一个包含应用链接 URL 的 `Uri`\
  \ 对象。在 activity 的初始化阶段，可以添加如下代码来提取这些数据：\n\n```java\nIntent appLinkIntent = getIntent();\n\
  String appLinkAction = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件对在 activity 内要执行的操作做出决策。在下面的代码示例中，URL 的最后一个组件用于识别是否应该为新用户或现有用户显示内容：\n\
  \n```java\nString userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"\
  newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n### 78.4 将应用与网站关联\n\
  \n在应用链接生效之前，应用链接 URL 需要与该应用链接所在的网站进行关联。这通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装网站的\
  \ `.well-known` 文件夹中来实现。注意，数字资产链接仅适用于基于 https 的网站。\n\n数字资产链接文件包含一个关系声明（relation\
  \ statement），允许目标应用使用网站的链接 URL 启动，以及一个目标声明，声明了配套应用的包名和该项目的 SHA-256 证书指纹。例如，一个典型的资产链接文件可能如下：\n\
  \n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\":\
  \ \"<app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here\"] }\n}]\n```\n\nassetlinks.json 文件可以包含多个资产链接，允许单个网站关联到多个应用。\n\n### 78.5\
  \ 总结\n\nAndroid App Links 允许通过来自外部网站和应用的链接启动应用 activity。应用链接的实现结合了项目清单中的意图过滤器和启动\
  \ activity 中的意图处理代码。此外，通过使用数字链接文件，可以将应用链接使用的域名进行关联。一旦建立关联，当使用应用链接时，Android 不再需要要求用户选择目标应用。\n\
  \n## 79. Android Studio App Links 教程\n\n本章的目标是对应用链接和 Android Studio App 助手提供实用演示。\n\
  \n本章将为现有应用添加应用链接支持，允许通过 URL 启动 activity。除了启动 activity 外，显示的内容将在路径中指定。\n\n### 79.1\
  \ 关于示例应用\n\n本章使用的项目名为 `AppLink`，是一个旨在让用户获取地标信息的基础应用。该应用通过内容提供者类访问 SQLite 数据库。该应用提供了一个包含伦敦景点记录的现有数据库。\n\
  \n在当前形式下，应用允许对现有记录进行搜索并添加新记录。项目由两个 activity 组成：`AppLinkActivity` 和 `LandmarkActivity`。`AppLinkActivity`\
  \ 是启动启动的主活动。该活动允许用户输入搜索标准并向数据库添加新记录。当搜索找到匹配记录时，启动 `LandmarkActivity` 并显示相关地标的信息。\n\
  \n本章的目标是增强应用以添加应用链接支持，以便可以使用 URL 在应用内显示特定的地标记录。\n\n### 79.2 数据库模式\n\n示例应用的数据包含在项目层级\
  \ `app -> assets -> databases` 中的 `landmarks.db` 文件中。数据库包含一个名为 `locations` 的表，其结构如表\
  \ 79-1 所示：\n\n| 列 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| \\_id | String | 主索引，此列包含唯一标识数据库中地标的字符串。\
  \ |\n| title | String | 地标名称（例如 London Bridge）。 |\n| description | String | 地标描述。\
  \ |\n| personal | Boolean | 表示记录是私人的还是公共。用户添加的所有记录值均设置为 true。随应用提供的现有记录设置为 false。\
  \ |\n\n表 79-1\n\n\n\n\n\n### 79.3 加载并运行项目\n\n项目包含在示例源码下载包的 `AppLinking` 文件夹中，该包位于以下\
  \ URL：\n\n[`www.ebookfrenzy.com/retail/flamingojava/index.php`](https://www.ebookfrenzy.com/retail/flamingojava/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将出现如下方图 79-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 79-1\n\n按照目前的实现方式，地标是使用位置 ID 进行定位的。默认数据库配置当前包含两个被 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的记录。在 ID 字段中输入 `londonbridge` 并点击 Find（查找）按钮来测试搜索功能。当找到匹配的记录时，将启动第二个 Activity（`LandmarkActivity`）并传递要显示记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据（extra data）形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 79-2\
  \ 所示的屏幕向用户显示。\n\n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 79-2\n\n# 79.4\
  \ 添加 URL 映射\n\n现在应用已经加载到 Android Studio 并经过测试，项目已准备好添加应用链接（app link）支持。目标是让 `LandmarkActivity`\
  \ 屏幕在响应应用链接点击时启动并显示信息。这是通过将 URL 映射到 `LandmarkActivity` 实现的。在本例中，URL 的格式如下：\n\n`http://<website\
  \ domain>/landmarks/<landmarkId>`\n\n完成所有步骤后，例如以下 URL 应该导致应用显示伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单选项打开 App Links Assistant（应用链接助手程序）。打开后，助手程序将如图\
  \ 79-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 79-3\n\n点击 `Open URL\
  \ Mapping Editor` 开始将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在图 79-4 中高亮）来添加新的 URL：\n\n![](img/Image2473.jpg)\n\
  \n图 79-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入你自己的网站的 URL。如果你没有自己的网站可用于本教程，仍然可以使用\
  \ `http://www.example.com` 遵循本章的大部分内容，但将无法测试需要数字资产链接文件（Digital Asset Links file）存在的功能。\n\
  \n下面的 `Path` 字段（在图 79-5 中标记为 B）是声明 URL 路径组件的地方。路径必须以 `/` 开头，因此在此字段中输入 `/landmarks`。\n\
  \n`Path` 菜单 (B) 提供了以下三个路径匹配选项：\n\n- `path` – URL 必须与 URL 的路径组件完全匹配才能启动活动。例如，如果路径设置为\
  \ `/landmarks`，则 `http://www.example.com/landmarks` 将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ URL 将不被视为匹配。\n- `pathPrefix` – 指定的路径仅被视为前缀。在 `/landmarks` 组件之后可能包含额外的路径组件（例如 `http://www.example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\
  \n由于此例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应应用链接启动的活动：\n\n![](img/Image2481.jpg)\n\n图 79-5\n\n完成对话框中的设置后，点击 `OK` 按钮提交更改。在映射屏幕的\
  \ `Check URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为上方 `Host` 字段中指定的域名），检查 URL\
  \ 格式是否正确并已分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\n如果映射配置正确，`LandmarkActivity`\
  \ 将列为映射的活动：\n\n![](img/Image2489.jpg)\n\n图 79-6\n\n最新版本的 Android 要求对 HTTP 和 HTTPS\
  \ 协议都声明应用链接（App Links），即使只使用了其中一种。因此，在继续下一步之前，请重复上述步骤将 HTTPS 版本的 URL 添加到列表中。\n\n\
  下一步也将在 App Links Assistant 的 URL 映射屏幕中执行，因此请保持该屏幕选中状态。\n\n### 79.5 添加意图过滤器\n\n如前一章所述，需要意图过滤器允许目标活动在响应应用链接点击时启动。事实上，当添加\
  \ URL 映射时，意图过滤器已自动添加到项目中。在 App Links Assistant 中选中映射，向下滚动屏幕直到看到意图过滤器。预览应包含 `AndroidManifest.xml`：\n\
  \n![](img/Image296.jpg)\n\n图 79-7\n\n虽然 App Links 为我们添加了意图过滤器，但它可能没有包含处理应用链接所需的\
  \ `autoVerify` 设置。打开 `manifests -> AndroidManifest.xml` 文件，并如下向两个意图过滤器添加此设置：\n\n\
  ```\n<intent-filter autoVerify=\"true\">\n    <data scheme=\"http\" host=\"www.example.com\"\
  \ pathPrefix=\"/landmarks\" />\n</intent-filter>\n<intent-filter autoVerify=\"true\"\
  >\n    <data scheme=\"https\" host=\"www.example.com\" pathPrefix=\"/landmarks\"\
  \ />\n</intent-filter>\n```\n\n# 79.6 添加 Intent 处理代码\n\n之前的步骤确保了根据格式正确的应用链接 URL\
  \ 相应的活动。下一步是在 `LandmarkActivity` 类中处理 Intent，以便从数据库中提取记录并向用户显示。在修改 `LandmarkActivity.java`\
  \ 文件中的代码之前，查看现有代码区域是值得的。在代码编辑器中打开 `LandmarkActivity.java` 文件，并找到 `onCreate()` 和\
  \ `handleIntent()` 方法，它们目前的内容如下：\n\n```\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码预期在 `Intent` 额外数据中找到地标 ID。由于活动现在也可以通过应用链接启动，因此需要更改代码以处理这两种情况。从删除\
  \ `onCreate()` 方法中对 `handleIntent()` 的调用开始：\n\n\n\n\n\n要添加初始的应用链接（App link）意图处理代码，返回\
  \ App Links 助手面板并点击步骤 2 下列出的 `Select Activity` 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择\
  \ `LandmarkActivity` 条目：\n\n![](img/Image2504.jpg)\n\n图 79-8\n\n返回 `LandmarkActivity.java`\
  \ 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android Studio 无法完成请求，您可以手动添加此代码）：\n\n```java\n\
  // ATTENTION: This was auto-generated to handle app links.\n\nIntent appLinkIntent\
  \ = getIntent();\n\nString appLinkAction = appLinkIntent.getAction();\n\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果活动启动是应用链接的结果，则\
  \ action 字符串将被设置为 `android.intent.action.VIEW`，这与添加到清单文件中意图过滤器（intent filter）中声明的\
  \ action 相匹配。相反，如果是通过主活动中 `findLandmark()` 方法中的标准意图启动代码启动的活动，则 action 字符串将为 null。通过检查赋值给\
  \ action 字符串的值，可以编写代码来识别活动启动的方式并采取适当的操作：\n\n```java\n.\n\n.\n\nimport android.net.Uri;\n\
  \n.\n.\n\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  .\n.\n    // ATTENTION: This was auto-generated to handle app links.\n    Intent\
  \ appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的工作是在方法中添加一些额外的代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n.\n.\n    // ATTENTION:\
  \ This was auto-generated to handle app links.\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                displayLandmark(landmarkId);\n\
  \            }\n        }\n    } else {\n        handleIntent(appLinkIntent);\n\
  \    }\n}\n```\n\n如果 action 字符串不为 null，将进行检查验证它是否被设置为 `android.intent.action.VIEW`，然后提取\
  \ `Uri` 路径的最后一个组件。该组件将在进行数据库查询时作为地标 ID。相反，如果 action 字符串为 null，则调用现有的 `handleIntent()`\
  \ 方法从意图数据中提取 ID。\n\n### 79.7 测试应用\n\n在设备或模拟器上运行应用，并确保仍然可以搜索示例地标。我们现在成功地为应用添加了应用链接支持。如果您为应用链接指定了自己的网站\
  \ URL，我们现在可以通过创建并安装数字资产链接文件（Digital Asset Links file）来更进一步。\n\n### 79.8 创建数字资产链接文件\n\
  \n正如名为\"Android 意图概述\"的章节所述，为了完全支持应用链接，我们需要在链接中引用的网站上安装数字资产链接文件。首先按照\"Android 意图概述\"\
  中列出的步骤找到您的 `debug.keystore` 文件并识别您的 SHA256 指纹。\n\n接下来在网络浏览器中打开以下页面：\n\n`https://developers.google.com/digital-asset-links/tools/generator`\n\
  \n页面加载后，在 Hosting site domain 字段中输入您的网站 URL，输入 `com.ebookfrenzy.applinking` 作为 App\
  \ 包名，并将您的 SHA256 指纹输入到 App package fingerprint (`SHA256`) 字段中：\n\n![](img/asset_file_generator.jpg)\n\
  \n图 79-9\n\n点击 `Generate` 按钮显示生成的语句，并将其放在名为 `assetlinks.json` 的文件中，位于 Web 服务器 `.well-known`\
  \ 文件夹下。返回生成器页面并点击 `Test` 按钮验证文件是否位于正确位置。测试成功后，将出现类似下面的输出：\n\n![](img/asset_file_test.jpg)\n\
  \n图 79-10\n\n假设测试成功，我们现在准备好尝试应用链接了。\n\n### 79.9 测试应用链接\n\n返回 App Links 助手并点击 `Test`\
  \ 按钮测试意图处理是否正常。当提示输入测试 URL 时，输入应在设备上启动（使用链接中用的域名）并显示有关伦敦桥（London Bridge）信息的 URL。\n\
  \n### 79.10 总结\n\n本演示了在应用项目中实现应用链接支持的步骤。本章涵盖的内容包括 Android Studio 中的 App Link 助手、应用链接映射、意图过滤器、使用数字资产链接文件处理网站关联以及应用链接测试。\n\
  \n## 80. Android 生物识别认证教程\n\n许多 Android 设备现在已内置触控传感器，用于识别用户并提供通过指纹识别访问设备和应用的功能。指纹识别当然是多种身份验证方法之一，包括密码、PIN\
  \ 码以及最近的面部识别。\n\n虽然目前市场上只有少数 Android 设备提供面部识别，但它可能会在不久的将来变得更加常见。为了应对这一点，Google 已开始从以指纹为中心的应用认证方法转向一种不那么特定的方法，称为生物识别。在\
  \ Android 8 的初始版本中，这些生物识别仅涵盖指纹认证，但随着 Android 操作系统和 SDK 的未来发布和更新，将会发生变化。\n\n本章提供了生物识别的概述，以及一个演示实现生物识别方法的详细教程。\n\
  \n### 80.1 生物识别概述\n\n\n\n\n\n在完成这些基础工作后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n### 80.2\
  \ 创建生物识别项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前，选择 `Empty Views\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 29: Android (Q)`，并将 `Language`\
  \ 菜单设置为 `Java`。\n\n## 80.3 配置设备指纹认证\n\n指纹认证仅适用于带有触摸传感器的设备，并且该设备已采取了相应的配置步骤来保护设备并录入至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参阅使用和配置\
  \ Android Studio AVD 模拟器章节。\n\n若要在物理设备上配置指纹认证，首先打开 `Settings` 应用程序并选择 `Security`\
  \ 选项。在 `Security` 设置屏幕内，选择 `Fingerprint` 选项。在弹出的信息屏幕上点击 `Next` 按钮进入 `Fingerprint`\
  \ 设置屏幕。在启用指纹安全之前，必须配置一种备份锁屏解锁方法（例如 `PIN` 码）。如果锁屏尚未受保护，请按照步骤配置 `PIN`、`pattern` 或\
  \ `password` 安全。\n\n锁屏受保护后，继续进入指纹检测屏幕，并在提示时触摸传感器(图 80-1)，如果需要，重复此过程以添加额外的指纹。\n\n\
  ![](img/Image24256.jpg)\n\n图 80-1\n\n## 80.4 在 Manifest 文件中添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中找到并编辑 `app -> manifests -> AndroidManifest.xml`\
  \ 文件，如下所示添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n```\n\n### 80.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml`\
  \ 布局资源文件，将其加载到 Layout Editor 工具中。\n\n删除示例的 `TextView` 对象，从调色板的 `Common` 类别中拖放一个\
  \ `Button` 对象，并将其放置在布局画布的中心。使用 `Attributes` 工具窗口，将按钮的 `text` 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 80-2 所示所示：\n\n![](img/as_biometric_demo_ui.jpg)\n\
  \n图 80-2\n\n## 80.6 添加 Toast 便利方法\n\n在本示例代码的各个点，应用将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主 Activity 中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 `Toast`\
  \ 消息的形式显示给用户。现在编辑 `MainActivity.java` 文件并如下所示添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this,\n        \
  \          message,\n                  Toast.LENGTH_LONG).show();\n}\n```\n\n##\
  \ 80.7 检查安全设置\n\n在本章前面的部分，已采取步骤在要测试应用的设备或模拟器上配置了锁屏并注册了指纹。然而，重要的是是在应用中包含防御性代码，以确保在尝试请求指纹认证之前已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 管理服务。请注意，还添加了代码来验证已为应用配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n                    (KeyguardManager)\
  \ getSystemService(KEYGUARD_SERVICE);\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen security not enabled in Settings\");\n\
  \        }\n        if (ActivityCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.USE_BIOMETRIC) !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint permission not enabled\");\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n# 80.9 添加 CancellationSignal\n\n一旦启动，生物识别身份验证过程将独立于应用程序执行。为了为应用程序提供取消操作的方法，需要创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别身份验证过程。随后可以使用此 `CancellationSignal` 实例在需要时取消该过程。取消信号实例可以配置一个监听器，该监听器会在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下所示：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ ->\n            notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n\
  }\n```\n\n### 80.10 启动生物识别提示\n\n剩下的工作是在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt`\
  \ 实例并启动身份验证。如下所示添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n            .setTitle(\"Biometric Demo\"\
  )\n            .setSubtitle(\"Authentication is required to continue\")\n      \
  \      .setDescription(\n                \"This app uses biometric authentication\
  \ to protect your data.\")\n            .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  \                    (dialogInterface, i) ->\n                            notifyUser(\"\
  Authentication cancelled\"))\n            .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类用于创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，使其出现在提示对话框中。负按钮被配置为显示“Cancel”文本，并配置了一个在点击此按钮时显示消息的监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个配置为所需线程的 `Executor` 对象定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将一个主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用程序的主线程上进行。\n\n# 80.11\
  \ 测试项目\n\n现在项目已完成，在物理 Android 设备或模拟器会话上运行应用程序，并点击 Authenticate 按钮显示如图 80-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n\n图 80-3\n\n运行后，可以触摸指纹传感器或使用模拟器内的扩展控制面板来按照“使用和配置\
  \ Android Studio AVD 模拟器”章节概述的方法模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主活动，此时将显示来自成功身份验证回调方法的\
  \ toast 消息。\n\n再次点击 Authenticate 按钮，这次使用一个未注册的指纹尝试进行身份验证。此时，生物识别提示对话框将指示指纹未被识别：\n\
  \n![](img/as_3.2_biometric_prompt_failed.jpg)\n\n图 80-4\n\n点击生物识别提示对话框之外的区域来验证错误处理回调是否正常工作。提示对话框将消失，并显示带有以下消息的\
  \ toast 消息：\n\nAuthentication error: Fingerprint operation cancelled by user.\n\n\
  检查使用 Cancel 按钮取消提示对话框是否会触发“Authentication Canceled” toast 消息。最后，尝试使用未注册的指纹多次进行身份验证，并注意在尝试多次后，提示对话框会指示失败次数过多，在此之前无法进行后续尝试。\n\
  \n### 80.12 总结\n\n本章概述了如何将生物识别身份验证集成到 Android 应用程序项目中。这涉及 `BiometricPrompt` 类的使用，该类一旦配置了适当的消息文本和回调，就能自动处理大部分的身份验证过程。\n\
  \n# 81. 创建、测试和上传 Android App Bundle\n\n一旦 Android 应用程序的开发工作完成并在各种 Android 设备上通过了测试，下一步是准备将应用程序提交到\
  \ Google Play。然而，在进行提交之前，必须对应用程序进行发布打包并使用私钥签名。本章将介绍获取私钥、为项目准备 Android App Bundle\
  \ 以及将其上传到 Google Play 的步骤。\n\n## 81.1 发布准备过程\n\n到本书此处为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，构建通过\
  \ Google Play 向客户发布的应用程序包需要采取额外的步骤。第一个要求是应用程序必须以发布模式而非调试模式进行编译。其次，应用程序必须使用私钥签名，该私钥唯一标识你作为应用程序的开发者。最后，应用程序必须被打包成\
  \ Android App Bundle。\n\n虽然这些任务都可以在 Android Studio 之外执行，但正如本章其余部分概述，使用 Android Studio\
  \ 构建机制可以更轻松地完成。不过，首先进一步了解 Android Bundles 是重要的。\n\n### 81.2 Android Bundles\n\n\
  当用户从 Google Play 安装应用时，该应用是以 APK 文件的形式下载的。该文件包含了在用户设备上安装和运行应用所需的所有内容。在 Android Studio\
  \ 3.2 引入之前，开发者会使用 Android Studio 生成一个或多个 APK 文件并将其上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言，这可能需要为每个目标设备和语言创建并上传多个\
  \ APK 文件，或者生成一个包含所有不同配置资源和平台二进制文件的庞型通用 APK。\n\n创建多个 APK 文件涉及大量工作，且每次需要更新应用时都必须重复，这给应用程序的发布过程带来了相当的时间开销。\n\
  \n通用 APK 方案虽然开发者的负担较小，但它导致了完全意想不到的问题。通过分析应用安装指标，Google 发现安装 APK 文件越大（导致下载时间变长和设备上的存储空间占用增加），应用获得的转化率就越低。事实上，Google\
  \ 估算 APK 文件每增加 6MB，应用的转化率就会下降 1%。\n\nAndroid App Bundles 解决了这两个问题，它为开发者提供了一种在 Android\
  \ Studio 内部创建一个单一包，并让 Google Play 为每个单独支持的配置自动生成自定义 APK 文件的方法（这一概念被称为动态交付）。\n\n\n\
  \n\n\nAndroid 应用程序包（Android App Bundle）本质上是一个 ZIP 文件，其中包含了构建 `APK` 文件所需的所有文件，这些文件适用于应用项目内支持的设备和语言区域。例如，项目可能包含不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示器、处理器架构和语言区域。利用这些信息，系统会将适当的预生成 `APK` 文件传输到用户的设备上。\n\n动态交付（Dynamic\
  \ Delivery）的另一个优势是能够将应用拆分为多个模块，称为动态功能模块（dynamic feature modules），每个模块包含应用中特定功能区域的代码和资源。每个动态功能模块都包含在一个与基础模块分离的\
  \ `APK` 文件中，并且只有在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建即时动态功能模块（instant dynamic feature\
  \ modules），这些模块无需安装整个应用即可直接在设备上运行。这些主题将从题为“Android 动态功能模块概述”的章节开始详细介绍。\n\n尽管目前仍然可以通过\
  \ Android Studio 生成 `APK` 文件，但应用包现在是上传应用到 Google Play 的推荐方式。\n\n### 81.3 注册 Google\
  \ Play 开发者控制台账户\n\n提交应用的第一步是创建一个 Google Play 开发者控制台账户。为此，请访问 [`play.google.com/apps/publish/signup/`](https://play.google.com/apps/publish/signup/)\
  \ 并按照说明完成注册过程。请注意，注册需要支付一次性 25 美元的费用。一旦应用上市，Google 将保留与应用相关的所有收入的 30%。账户创建后，可以通过\
  \ [`play.google.com/console`](https://play.google.com/console%20) 访问开发者控制台。\n\n\
  下一步是收集有关该应用的信息。为了将您的应用推向市场，需要以下信息：\n\n• `Title`（标题）—— 应用标题。\n• `Short Description`（短说明）——\
  \ 最多 80 个单词的应用描述。\n• `Full Description`（完整说明）—— 最多 4000 个字的应用描述。\n• `Screenshots`（截图）——\
  \ 最多 8 张应用运行截图（至少需要 2 张）。Google 建议提交在 7 寸或 10 英寸平板电脑上运行的应用截图。\n• `Language`（语言）——\
  \ 应用语言（默认为美国英语）。\n• `Promotional Text`（推广文本）——当您的应用出现在 Google Play 环境内的特殊推广功能时使用的文本。\n\
  • `Application Type`（应用类型）——您的应用被视为游戏还是应用程序。\n• `Category`（类别）——最能描述您的应用的类别（例如金融、健康与健身、教育、体育等）。\n\
  • `Locations`（地区）——您希望应用可以购买的地理位置。\n• `Contact Details`（联系方式）——用户联系您以获取应用相关支持的方法。选项包括网页、电子邮件和电话。\n\
  • `Pricing & Distribution`（定价与发布）——有关应用价格以及营销和销售地理位置的信息。\n\n收集齐上述信息后，点击 Google Play\
  \ Console 中的 `Create app`（创建应用）按钮开始创建过程。\n\n### 81.4 在控制台中配置应用\n\n当首次点击 `Create\
  \ app` 按钮时，将显示应用详情和声明屏幕，如下下面的图 81-1 所示：\n\n![](img/as_4.1_play_create_app.jpg)\n\
  \n图 81-1\n\n应用项目完全配置完成后，点击 `Create app` 按钮（如图中所示）以添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial\
  \ setup`（初始设置）部分，并展开配置应用商店列表的步骤列表：\n\n![](img/as_4.1_play_app_initial_steps.jpg)\n\
  \n图 81-2\n\n按照链接列表操作并为您的应用提供所需信息，并确保在每一步都保存更改。\n\n### 81.5 启用 Google Play 应用签名\n\
  \n直到最近，Google Play 的上传是在 Android Studio 内部使用发布应用签名密钥进行签名的，然后上传到 Google Play 控制台。虽然此选项仍然可用，但现在推荐的文件上传方式是使用名为“Google\
  \ Play 应用签名（Google Play App Signing）”的过程。对于新创建的应用，这涉及加入 Google Play 应用签名，然后生成一个上传密钥，用于在\
  \ Android Studio 中签名应用包文件。当上传 Android Studio 生成的应用包文件时，Google Play 控制台会移除上传密钥，然后使用安全存储在\
  \ Google Play 服务器内的应用签名密钥对文件进行签名。对于现有应用，需要额外的步骤来启用 Google Play 签名，将在本章结束介绍。\n\n\
  在 Google Play 控制台中，从 `All Apps`（通过左侧导航面板顶部的选项访问）选择新添加的应用项目，展开 `Setup`（设置）部分（在图 81-3\
  \ 中标记为 A），并选择 `App Signing`（应用签名）选项 (B)。\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 81-3\n\n点击 `Create release`（创建发布）按钮 (C) 加入 Google Play 应用签名。控制台现在准备好为您的应用创建第一个测试发布版本。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。请保持当前 Google Play 屏幕打开，稍后我们将返回。\n\n### 81.6 创建密钥库文件\n\n\
  要创建密钥库文件，选择 Android Studio `Build -> Generate Signed Bundle / APK…` 菜单选项，显示如下图 81-4\
  \ 所示的 `Generate Signed Bundle or APK Wizard`：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\
  \n图 81-4\n\n在点击 `Next` 按钮之前，确保已选择 `Android App Bundle`。\n\n已有密钥库文件，在下一个屏幕上点击 `Choose\
  \ existing…` 并选择文件。尚未创建密钥库文件，点击 `Create new…` 显示 `New Key Store` 对话框。点击 `Key store\
  \ path` 字段右侧的按钮导航到文件系统的合适位置，为密钥库文件命名（例如 `release.keystore.jks`）并点击 `OK` 按钮。\n\n\
  `New Key Store` 对话框分为两个部分。顶部涉及密钥库文件。在此部分，输入强密码以保护密钥库文件，分别输入 `Password` 和 `Confirm`\
  \ 字段。对话框的下部部分涉及存储在密钥库中的上传密钥。\n\n![](img/Image2483.jpg)\n\n图 81-5\n\n在 `New Key Store`\
  \ 对话框的 `Key` 部分，输入以下详细信息：\n\n• 用于引用密钥的 `alias`（别名）。这可以是任何字符序列，但系统仅使用前 8 个。\n• 用于保护密钥的相应强密码。\n\
  • 密钥有效的年限（Google 建议有效期超过 25 年）。\n\n此外，必须在剩余字段中至少提供一个字段的信息（例如，您的姓名或组织名称）。\n\n输入信息后，点击\
  \ `OK` 按钮继续生成包。\n\n### 81.7 创建 Android 应用程序包\n\n\n\n\n下一步是指示 Android Studio 以发布（release）模式构建应用包（app\
  \ bundle），然后使用新创建的私钥对其进行签名。此时，`Generate Signed Bundle or APK` 对话框仍然显示，并且 keystore\
  \ 路径、密码和密钥别名字段已填充了信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n图 81-7\n\
  \n确保启用了 `Export Encrypted Key` 选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（见图 81-8）。在此屏幕中，检查\
  \ `Destination Folder:` 设置，以验证生成应用包文件的位置是否合适。如果偏好于其他位置，请点击文本框右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n图 81-8\n\n点击 `Finish` 按钮并等待\
  \ `Gradle` 系统构建应用包。构建完成后，将弹出一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹，或将文件加载到 `APK Analyzer`\
  \ 中的选项：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n图 81-9\n\n此时，应用已准备好提交到\
  \ Google Play。点击 `locate` 链接以打开文件系统浏览器窗口。除非指定了其他位置，否则该文件应名为 `bundle.aab` 并位于项目文件夹的\
  \ `app/release` 子目录下。\n\n在此过程中生成的私钥应在以后签名和发布未来的应用时使用，因此，应将其保存在安全的地方并进行安全备份。\n\n\
  ### 81.8 生成测试 APK 文件\n\n此阶段的可选步骤是从应用包生成 APK 文件，并在设备或模拟器会话上安装并运行它们。Google 了一个了一个名为\
  \ `bundletool` 的命令行工具，专门为此目的设计，可以从以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 文件的形式提供，可以如下所示从命令行执行（注意，版本号自本书出版以来可能已经更改）：\n\n```bash\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中可用所有选项。要从应用包生成 APK 文件，使用\
  \ `build-apks` 选项。要生成可以安装到设备或模拟器上的 APK 文件，这些文件还需要经过签名。为了实现这一点，请包含 `--ks` 选项以指定在本节之前创建的\
  \ keystore 文件路径，并以及 `--ks-key-alias` 选项以指定生成密钥时提供的别名。\n\n最后，必须使用 `--output` 标志来指定生成\
  \ APK 文件的文件路径（称为 `APK Set`）。该文件不能已存在，并且必须具有 `.apks` 文件扩展名。将这些要求结合起来，就形成了以下命令行（考虑到你的操作系统路径结构可能存在差异）：\n\
  \n```bash\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n当执行此命令时，在向指定的 APK Set 文件生成 APK 文件之前，将出现提示请求输入 keystore 密码。APK Set 文件只是一个包含从应用包生成的所有\
  \ APK 文件的 ZIP 包。\n\n要向连接的设备或模拟器安装适当的 APK 文件，请使用类似下方的命令：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n此命令将指示工具识别适用于连接设备的适当 APK 文件并安装它们，以便启动和测试应用。\n\
  \n还可以从 APK Set 中提取适用于连接设备的 APK 文件，而无需安装它们。此过程的第一步是按照如下所示方式获取连接设备的规范：\n\n```bash\n\
  java -jar bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n```\n\
  \n上述命令将生成一个类似于下方的 JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"\
  supportedLocales\": [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n\
  }\n```\n\n接下来，使用此规范文件从 APK Set 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行时，通过 `--output-dir` 标志指定的目录将包含适用于指定设备配置的 APK 文件。\n\n将 Android 应用推向市场的下一步是将其提交到\
  \ Google Play 开发者控制台，以便进行测试。\n\n### 81.9 将应用包上传到 Google Play 开发者控制台\n\n返回 Google\
  \ Play 控制台并选择 `Internal testing` 选项（见图 81-10），位于 `Testing` 部分：\n\n![](img/create_new_release.jpg)\n\
  10\n\n在生成的屏幕上，点击 `Continue` 按钮（标记为 A）以确认 Google Play 签名，然后将 Android Studio 生成的包文件拖放到投放点（B）：\n\
  \n![](img/bundle.jpg)\n811\n\n上传完成后，向下滚动屏幕并输入发布名称和可选发行说明。发布名称可以是任何帮助你识别发布的信息，对用户不可见。应用包文件上传后，Google\
  \ Play 将生成测试所需的所有 APK 文件。一旦生成 APK 文件，滚动到屏幕底部并点击 `Save` 按钮。\n\n### 81.10 探索应用包\n\n\
  在审核屏幕上，点击包右侧的箭头，如图 81-12 所示：\n\n![](img/review.jpg)\n81-12\n\n在生成的面板中，点击 `Explore\
  \ bundle` 链接加载应用包浏览器。它提供了有关应用包支持的 API 级别、屏幕布局和平台的摘要信息：\n\n![](img/explorer.jpg)\n\
  \ 81-13\n\n点击 `Go to device catalog` 链接将显示支持该 APK 文件的设备：\n\n![](img/catalog.jpg)\n\
  \ 81-14\n\n此时，应用已准备好测试，但在控制台中设置好测试者之前，无法发布。\n\n### 81.11 管理测试者\n\n如果应用仍处于内部测试、Alpha\
  \ 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择应用、点击导航面板中的 `Internal testing` 并选择 `Testers`\
  \ 选项卡来指定授权的测试者列表。\n\n要添加测试者，点击 `Create email list` 按钮，命名列表并手动或通过上传 CSV 指定测试用户的电子邮件地址。\n\
  \n现在可以从屏幕上复制 `Join on the web` URL 并提供给测试用户，以便他们接受测试邀请并下载应用。\n\n### 81.12 发布应用进行测试\n\
  \n\n\n\n\n现在已经创建了内部版本并添加了测试人员列表，应用已准备好进行测试发布。在“内部测试”（Internal testing）界面中，点击最近创建版本的`Edit”（编辑）按钮之前，先选择`Releases”（发布）标签页：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n图 81-16\n\n在审核界面上，滚动到最后并点击`Start rollout\
  \ to Internal testing”（开始发布到内部测试）按钮。在版本处理的简短延迟后，应用即可供指定用户下载并进行测试。\n\n### 81.13 上传新的\
  \ App Bundle 版本\n\n为您的应用程序上传的第一个应用包（app bundle）文件的版本代码（version code）始终为`1`。如果尝试上传具有相同版本代码的包，控制台将通过以下错误拒绝该文件：\n\
  \n`You need to use a different version code for your APK because you already have\
  \ one with version code 1.`\n\n要解决这个问题，需要增加嵌入包文件中的版本代码。这是在项目的模块级`build.gradle` 文件中完成的，如图\
  \ 81-17 所示：\n\n![](img/as_build_gradle.jpg)\n图 81-17\n\n默认情况下，该文件的内容通常如下：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'com.ebookfrenzy.androidsample'\n\
  \    compileSdk 33\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.androidsample\"\
  \n        minSdk 29\n        targetSdk 33\n        versionCode 1\n        versionName\
  \ \"1.0\"\n    }\n}\n```\n\n要更改版本代码，只需更改`versionCode`旁声明的数字。要同时更改显示给应用程序用户的版本号，请更改`versionName`字符串。例如：\n\
  \n```gradle\nversionCode 2\nversionName \"2.0\"\n```\n\n完成这些更改后，重新构建 APK 文件并再次执行上传。\n\
  \n### 81.14 分析 App Bundle 文件\n\nAndroid Studio 提供了分析应用包内容的能力。要分析包文件，选择`Android Studio\
  \ Build -> Analyze APK…`菜单选项，并导航到选择要查看的包文件。一旦加载到工具中，将显示包的原始大小和下载大小，以及包的文件结构列表，如图\
  \ 81-18 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n图 81-18\n\n选择`classes.dex`文件将在下方的面板中显示该文件的类结构。在此面板中，可以探索单个类的详细信息，一直到类方法的级别：\n\
  \n![](img/Image2583.jpg)\n图 81-19\n\n同样，在文件列表中选择资源或图像文件将在下方面板中显示文件内容。可以通过点击`Compare\
  \ with previous APK…`与之前的 APK 比较）按钮并选择第二个包文件来查看两个包文件的大小差异。\n\n### 81.15 总结\n\n一旦应用项目完成或准备好用户测试，就可以将其上传到\
  \ Google Play 控制台用于生产、内部、alpha 或 beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于 Play\
  \ Store 的截图。随后，将在 Android Studio 中生成一个发布版 Android App Bundle 文件并使用上传密钥进行签名。包文件上传后，Google\
  \ Play 将移除上传密钥并将其替换为安全存储的应用签名密钥，应用即可发布。\n\n可以随时通过将包文件加载到 Android Studio APK 分析器工具中查看包文件的内容。\n\
  \n# 82. Android 内购付费概述\n\n在 Android 和 iOS 等操作系统的移动应用早期，最常见的盈利方式是收取下载和安装应用程序的前期费用。很快，另一种收入机会以在应用内嵌入广告的形式引入了。现在最常见且利润丰厚的选项可能是应用安装后向用户收取购买应用内物品的费用。这通常表现为访问游戏的更高等级、获取虚拟商品或货币，或者订阅数字版杂志或报纸的优质内容。\n\
  \nGoogle 通过 Google Play In-App Billing API 和 Play 控制台提供了对集成内购付费的支持。本章将提供内购付费的概述，并概述如何将内购付费集成到您的\
  \ Android 项目中。在探索这些主题后，下一章将引导您创建一个创建一个包含内购付费功能的示例应用。\n\n### 82.1 为内购付费准备项目\n\n在应用中构建内购付费需要\
  \ Google Play 开发者控制台账号，其细节在之前的“创建、测试和上传 Android App Bundle”章节中涵盖过。您还需要注册 Google\
  \ 商家账户并配置您的付款设置。可以通过导航到 Play 控制台中的`Setup -> Payments profile`设置 -> 付款资料来找到这些设置。请注意，并非所有国家都提供商家注册。详细信息，请参考以下页面：\n\
  \n[`support.google.com/googleplay/android-developer/answer/930617`](https://support.google.com/googleplay/android-developer/answer/930617)\n\
  \n随后需要应用应用到控制台并启用内购付费。然而，除非在`build.gradle`文件中添加了 Google Play 库，否则控制台将为应用激活内购付费：\n\
  \n```gradle\ndependencies {\n    implementation 'com.android.billing:client:<latest\
  \ version>'\n}\n```\n\n一旦修改了构建文件并上传了应用包，下一步是添加供用户购买的应用内产品或订阅。\n\n### 82.2 创建应用内产品和订阅\n\
  \n产品和订阅是通过使用 Play 控制台导航面板中“Monetize”（变现）部分下的选项创建和管理的，如图 82-1 所示：\n\n![](img/play_console_monetization.jpg)\n\
  图 82-1\n\n每个产品或订阅都需要 ID、标题、描述和价格信息。购买分为消耗性（用户每次都需要购买，例如游戏货币）、非消耗性（用户只需购买一次，例如内容访问）和订阅。消耗性和非消耗产品统称为管理产品。\n\
  \n订阅适用于销售需要定期更新的物品，例如新闻内容或应用的优质功能。在创建订阅时，会定义一个基础方案，指定价格、更新周期（每月、每年等）以及是否自动续订。还可以为用户提供折扣优惠并提供预购订阅的选项。\n\
  \n\n\n\n\n可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，并传入当前的活动（activity）或片段（fragment）上下文。然后通过\
  \ `setListener()` 方法将购买更新处理器分配给客户端：\n\n```java\nprivate final PurchasesUpdatedListener\
  \ purchasesUpdatedListener =\n    new PurchasesUpdatedListener() {\n        @Override\n\
  \        public void onPurchasesUpdated(BillingResult billingResult, List<Purchase>\
  \ purchases) {\n            if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK\
  \ && purchases != null) {\n                // 购买成功\n                for (Purchase\
  \ purchase : purchases) {\n                    // 处理购买\n                }\n    \
  \        } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                //在此处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 82.4 连接到 Google Play  Library\n\n在成功创建 `BillingClient` 后，下一步是初始化与\
  \ Google Play Billing Library 的连接。要建立建立此连接，需要调用计单客户端实例的 `startConnection()` 方法。由于连接是异步进行的，因此需要实现一个\
  \ `BillingClientStateListener` 处理器以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()`\
  \ 方法。当与 Billing Library 的连接丢失时，会调用此方法，用于向用户报告问题并重试连接。\n\n一旦完成设置和连接任务，`BillingClient`\
  \ 实例将调用 `onBillingSetupFinished()` 方法，该方法可以检查客户端是否就绪：\n\n```java\nbillingClient.startConnection(new\
  \ BillingClientStateListener() {\n    @Override\n    public void onBillingSetupFinished(@NonNull\
  \ BillingResult billingResult) {\n        if (billingResult.getResponseCode() ==\
  \ BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else {\n\
  \            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 现有连接丢失\n    }\n});\n```\n\n## 82.5 查询可用产品\n\n一旦计单环境初始化并准备就绪，下一步就是请求可购买的产品或订阅的详情。这是通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法实现的，并传入一个配置适当的 `QueryDetailsParams`\
  \ 实例，其中包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，受管产品使用 `ProductType.INAPP`）：\n\n```java\n\
  QueryDetailsParams queryProductDetailsParams =\n    QueryDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                QueryDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        )\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsListener() {\n        public void onProductDetailsResponse(@NonNull\
  \ BillingResult billingResult, @NonNull List<ProductDetails> productDetailsList)\
  \ {\n            if (!productDetailsList.isEmpty()) {\n                // 处理匹配的产品列表\n\
  \            } else {\n                // 未找到产品\n            }\n        }\n    }\n\
  });\n```\n\n`queryProductDetailsAsync()` 方法传递了一个 `ProductDetailsListener` 处理器，该处理器反过来会被调用并接收一个包含匹配产品信息的\
  \ `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取诸如产品名称、标题、价格和优惠详情等信息。\n\n## 82.6 启动购买流程\n\
  \n一旦用户查询并选择了要购买的产品或订阅，购买流程就可以启动了。我们通过调用 `BillingClient` 的 `launchBillingFlow()`\
  \ 方法来实现，并将当前活动以及一个包含待购项目 `ProductDetail` 对象的 `BillingFlowParams` 实例作为参数。\n\n```java\n\
  BillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n    \
  \    .setProductDetailsParamsList(\n            ImmutableList.of(\n            \
  \    BillingFlowParams.ProductDetailsParams.newBuilder()\n                    .setProductDetails(productDetails)\n\
  \                    .build()\n            )\n        )\n        .build();\n\nbillingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n```\n\n购买操作的成功与将通过本章之前概述的 `PurchasesUpdatedListener` 处理器调用报告。\n\
  \n### 82.7 完成购买\n\n当购买成功时，`PurchasesUpdatedListener` 处理器将收到一个包含每个项目 `Purchase` 对象的列表。你可以如下所示调用\
  \ `Purchase` 实例的 `getPurchaseState()` 方法来验证项目是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成。\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 支付仍在处理中\n}\n```\n\n注意，只有在初始化期间调用了\
  \ `enablePendingPurchases()`，你的应用才会支持待付款订单。待付款将一直保留直到用户完成支付。当非消耗性项目的购买完成后，需要对其进行确认（acknowledge），以防止向用户退款。这需要购买令牌，通过\
  \ `Purchase` 对象的 `getPurchaseToken()` 方法获取。该令牌用于结合 `AcknowledgeResponseListener`\
  \ 处理器创建 `AcknowledgeParams` 实例。受管产品和订阅通过调用 `BillingClient` 的 `acknowledge()` 方法进行确认：\n\
  \n```java\nAcknowledgeParams acknowledgePurchaseParams = AcknowledgeParams.newBuilder()\n\
  \    .setPurchaseToken(purchase.getPurchaseToken())\n    .build();\n\nacknowledgeResponseListener\
  \ acknowledgeResponseListener = new AcknowledgeResponseListener() {\n    @Override\n\
  \    public void onAcknowledgeResponse(@NonNull BillingResult billingResult) {\n\
  \        billingClient.acknowledge(acknowledgePurchaseParams, acknowledgeResponseListener);\n\
  \    }\n};\n```\n\n对于消耗性购买，你需要在项目消耗后通知 Google Play，以便用户再次购买。这需要一个配置好的 `ConsumeParams`\
  \ 实例（包含购买令牌）、一个 `ConsumeResponseListener` 以及对计单客户端 `consumeAsync()` 方法的调用：\n\n```java\n\
  ConsumeParams consumeParams = ConsumeParams.newBuilder()\n    .setPurchaseToken(purchase.getPurchaseToken())\n\
  \    .build();\n\nConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n    @Override\n    public void onConsumeResponse(@NonNull BillingResult billingResult,\
  \ @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n            // 消耗成功\n        }\n \
  \   }\n};\n```\n\n\n\n\n\n```java\n// Purchase consumed successfully\n\n       \
  \ }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n```\n\n\
  ## 82.8 查询之前的购买记录\n\n在处理应用内购买时，检查用户是否已经购买过某个产品或订阅是一项常见需求。通过调用 `BillingClient` 实例的\
  \ `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户购买的所有特定类型的项目列表。例如，以下代码获取了所有尚未被消费的购买项目列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n                new PurchasesResponseListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List<Purchase> list) {\n            //\
  \ 处理购买列表\n        }\n    });\n```\n\n要获取活跃订阅的列表，请将 `ProductType` 值从 `INAPP` 更改为\
  \ `SUBS`。\n\n或者，要获取每个产品的最近购买记录列表，请调用 `BillingClient` 的 `queryPurchaseHistoryAsync()`\
  \ 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n    new PurchaseHistoryResponseListener()\
  \ {\n        @Override\n        public void onPurchaseHistoryResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List<PurchaseHistoryRecord> list) {\n\
  \            // 处理购买历史\n        }\n    });\n```\n\n### 82.9 总结\n\n应用内购买提供了一种向用户销售虚拟产品和订阅来从\
  \ Android 应用内部产生收入的方法。在本章中，我们探索了托管产品和订阅，并解释了消费性产品与非消费性产品之间的区别。使用 Google Play 应用内购买库为应用添加应用内购买支持，这涉及创建和初始化结算客户端，并在其调用方法以执行购买、列出可用产品和消费现有购买等任务。下一章将包含一个教程，演示如何在\
  \ Android Studio 项目中添加应用内购买功能。\n\n## 83. Android 应用内购买教程\n\n在上一章中，我们探索了如何将应用内购买集成到\
  \ Android 项目中，并查看了一些可以在开发自己的项目时使用的代码示例。本章将通过创建一个示例项目将这些理论付诸实践，演示如何向 Android 应用中添加消费性应用内产品。教程还将展示如何在\
  \ Google Play 管理台中中添加和管理应用内产品，并解释如何启用测试支付，以便在测试期间无需花费真实资金即可进行购买。\n\n### 83.1 关于应用内购买示例项目\n\
  \n该项目的简单概念是：在一个应用中，在点击按钮之前必须购买一个应用内产品。该应用内产品在每次点击按钮时都会被消费，因此用户每当想点击按钮时都需要重新购买该产品。在初始化时，应用将连接到应用商店，获取产品详情并显示产品名称。一旦应用确认该产品可用，将启用购买按钮，点击该按钮将进入购买流程。购买完成后，将启用第二个按钮，用户可以点击它并消费购买的项目。\n\
  \n### 83.2 创建 InAppPurchase 项目\n\n此项练习的第一步是创建一个新项目。启动 Android Studio 并在欢迎界面上选择 `New\
  \ Project` 选项。在新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `InAppPurchase`，并指定在 Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<your company>.InAppPurchase`）。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language`\
  \ 菜单设置为 `Java`。项目创建后，请使用 [11.8 迁移项目到 View Binding] 节中概述的步骤将项目转换为使用 view binding。\n\
  \n### 83.3 向项目添加库\n\n在我们开始编写代码之前，需要向项目构建配置添加一些库，包括标准的 Android 结算客户端库。在项目的后续部分，我们还需要使用\
  \ `ImmutableList` 类，它是 Google Guava Core Java 库的一部分。现在通过修改 Gradle Scripts -> `build.gradle`\
  \ (Module: `InAppPurchase.app`) 文件并进行以下更改来添加这些库：\n\n```gradle\ndependencies {\n\
  \    implementation 'com.android.billingclient:billing:5.2.0'\n    implementation\
  \ 'com.google.guava:guava:24.1-jre'\n}\n```\n\n点击编辑器顶部的 `Sync Now` 以提交这些更改。\n\n\
  ### 83.4 设计用户界面\n\n用户界面将由现有的 `TextView` 和两个 `Buttons` 组成。在编辑器加载了 `activity_main.xml`\
  \ 文件的情况下，将两个 `Button` 视图拖放到布局中，使一个在 `TextView` 上方，另一个在下方。选择 `TextView`并将 `id` 更改为\
  \ `statusText`。\n\n点击工具栏上的 `Clear Constraints` 按钮并按住 Shift 点击选择所有视图。右键点击顶部的视图，并在父布局中选择\
  \ `Center -> Horizontally`。再次重复此步骤，这次选择 `Chains -> Vertical`。将顶部按钮的文本属性改为“Consume\
  \ Purchase”，`id` 设置为 `consumeButton`。此外，配置 `onClick` 属性调用名为 `consumePurchase` 的方法。\n\
  \n选择底部按钮并重复上述步骤，这次将文本设置为“Buy Product”，`id` 设置为 `buyButton`，`onClick` 回调设置为 `makePurchase`。完成后，布局应与图\
  \ 83-1 所示。\n\n![Figure 83-1](img/83-1)\n\n### 83.5 将应用添加到 Google Play Store\n\n\
  使用“创建、测试和上传 Android App Bundle”章节中概述的步骤，登录 Play Console，创建一个新应用并设置一个新的内部测试轨道，包含指定测试者的电子邮件地址。返回\
  \ Android Studio 为项目生成签名发布版 bundle。一旦生成了 bundle 文件，将其上传到内部测试轨道并进行发布。\n\n现在应用已经在\
  \ Google Play Store 中占位，我们准备好为项目创建一个应用内产品了。\n\n### 83.6 创建应用内产品\n\n在 Play Console\
  \ 中选中应用后，向下滚动左侧面板中的列表直到 `Monetize` 部分出现。在该部分，选择 `Products` 下的 `In-app products`\
  \ 选项，如图 83-2 所示。\n\n![Figure 83-2](img/83-2)\n\n在应用内产品页面上，点击 `Create product` 按钮：\n\
  \n![Figure 83-3](img/83-3)\n\n在新产品屏幕上，保存新产品之前输入以下信息：\n\n•Product ID: `one_button_click`\n\
  \n•Name: `A Button Click`\n\n•Description: `这是一个测试用的应用内产品，允许点击一次按钮。`\n\n\n\n\n\n\
  - 默认价格：设置为你偏好货币的最低可能价格。\n\n## 83.7 启用许可测试人员\n\n在测试应用内购买时，能够在不花费任何费用的情况下进行测试购买是非常用的。这可以通过为内部测试道的测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收取费用。\n\
  \n在 Play Console 中，返回主屏幕并选择 `Setup`（设置） -> `License testing`（许可测试）选项：\n\n![](img/play_console_license_testing.jpg)\n\
  图 83-4\n\n在许可测试界面中，添加已添加到内部测试道的测试人员，将 `License response`（许可响应）设置改为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n图 83-5\n\n现在应用和应用内产品都已经在\
  \ Play Console 中设置完毕，我们可以开始向项目中添加代码了。\n\n## 83.8 初始化 BillingClient\n\n编辑 `MainActivity.java`\
  \ 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\nimport androidx.annotation.NonNull;\nimport\
  \ android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ BillingClient billingClient;\n    private ProductDetails productDetails;\n   \
  \ private Purchase purchase;\n    static final String TAG = \"InAppPurchaseTag\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n                    .setListener(purchasesUpdatedListener)\n\
  \                    .enablePendingPurchases()\n                    .build();\n\
  \        billingClient.startConnection(new BillingClientStateListener() {\n    \
  \        @Override\n            public void onBillingSetupFinished(\n          \
  \              @NonNull BillingResult billingResult) {\n                if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \                Log.i(TAG, \"OnBillingSetupFinish connected\");\n             \
  \       queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnBillingSetupFinish failed\");\n                }\n            }\n        \
  \    @Override\n            public void onBillingServiceDisconnected() {\n     \
  \           Log.i(TAG, \"OnBillingSetup connection lost\");\n            }\n   \
  \     });\n    }\n}\n```\n\n当应用启动时，`onCreate()` 方法现在会调用 `billingSetup()`，该方法将创建一个新的\
  \ billing client 并尝试连接到 Google Play Billing Library。当连接尝试完成后，将调用 `onBillingSetup()`\
  \ 监听器，并输出指示连接尝试成功或失败的 Logcat 消息。最后，我们实现了 `onBillingServiceDisconnected()` 回调，如果\
  \ Google Play Billing 连接丢失，该回调将被调用。如果连接成功，将调用名为 `queryProduct()` 的方法。此方法和分配给 billing\
  \ client 的 `purchasesListener` 都需要添加。\n\n### 83.9 查询产品\n\n为了确保产品可以购买，我们需要创建一个包含在\
  \ Play Console 中指定的产品 ID 的 `QueryDetailsParams` 实例，并将其传递给 billing client 的 `queryProductDetailsAsync()`\
  \ 方法。这还需要我们添加 `onProductDetailsResponse()` 回调，在其中我们将检查产品是否存在、提取产品名称并将其显示在 TextView\
  \ 上。现在我们已经获得了产品详情，可以安全地启用购买按钮。在 `MainActivity` 文件中，添加 `queryProduct()` 方法，其内容如下：\n\
  \n```java\nimport com.google.common.collect.ImmutableList;\nimport java.util.List;\n\
  \nprivate void queryProduct() {\n    QueryDetailsParams queryDetailsParams =\n \
  \           QueryDetailsParams.newBuilder()\n                    .setList(\n   \
  \                     ImmutableList.of(\n                            QueryDetailsParams.Product.newBuilder()\n\
  \                                .setProductId(\"one_button_click\")\n         \
  \                       .setProductType(BillingClient.ProductType.INAPP)\n     \
  \                           .build()))\n                    .build();\n    billingClient.queryProductDetailsAsync(\n\
  \            queryDetailsParams,\n            new ProductDetailsResponseListener()\
  \ {\n                public void onProductDetailsResponse(\n                   \
  \     @NonNull BillingResult billingResult,\n                        @NonNull List<ProductDetails>\
  \ productDetailsList) {\n                    if (!productDetailsList.isEmpty())\
  \ {\n                        productDetails = productDetailsList.get(0);\n     \
  \                   runOnUiThread(() -> {\n                            binding.buyButton.setEnabled(true);\n\
  \                            binding.statusText.setText(productDetails.getName());\n\
  \                        });\n                    } else {\n                   \
  \     Log.i(TAG, \"onProductDetailsResponse: No products\");\n                 \
  \   }\n                }\n            });\n}\n```\n\n这里使用的许多代码在上一章中应该很熟悉。监听器检查是否至少找到一个符合标准的产品。然后从第一个匹配的产品中提取\
  \ `ProductDetails` 对象，将其存储在 `productDetails` 变量中，并在 TextView 上显示产品名称。需要注意的是，当我们在状态\
  \ TextView 上显示产品名称时，我们是通过调用 `runOnUiThread()` 实现的。这是有的，因为监听器不是运行在主线程上的，因此无法直接对用户界面进行更改。`runOnUiThread()`\
  \ 方法提供了一种在主线程上执行代码的快速方便的方法，而无需使用协程（coroutines）。\n\n## 83.10 启动购买流程\n\n当用户点击购买按钮时，将调用名为\
  \ `makePurchase()` 的方法来启动购买过程。我们现在如下所示添加此方法：\n\n```java\npublic void makePurchase(View\
  \ view) {\n    BillingFlowParams billingFlowParams =\n            BillingFlowParams.newBuilder()\n\
  \                    .setProductDetailsList(\n                        ImmutableList.of(\n\
  \                            BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                                .setProductDetails(productDetails)\n          \
  \                      .build())\n                    )\n                    .build();\n\
  \    billingClient.launchBillingFlow(this, billingFlowParams);\n}\n```\n\n### 83.11\
  \ 处理购买更新\n\n购买过程的结果将通过初始化阶段分配给 billing client 的 `PurchaseUpdatedListener` 报告给应用。现在如下添加此处理程序：\n\
  \n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener = new\
  \ PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult,\n                                   List<Purchase> purchases) {\n\
  \        if (billingResult.getResponseCode() ==\n                        BillingClient.BillingResponseCode.OK\n\
  \                    && purchases != null) {\n            for (Purchase purchase\
  \ : purchases) {\n                completePurchase(purchase);\n            }\n \
  \       } else if (billingResult.getResponseCode() ==\n                        BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n```\n\n\n\n\n\n```java\nLog.i(TAG, \"onPurchasesUpdated: Error\");\n\
  \n    }\n}\n\n};\n```\n\n如果用户取消购买或发生其他错误，处理程序将输出日志消息。然而，成功的购买将调用一个名为 `completePurchase()`\
  \ 的方法，并向其传递当前的 `Purchase` 对象。按照下文概述添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n}\n\
  ```\n\n此方法在验证产品确实已购买且付款尚未处于挂起状态之前存储购买记录。随后将启用“消耗”（consume）按钮并通知用户购买成功。\n\n### 83.12\
  \ 消耗产品\n\n现在用户已经可以点击“消耗”按钮，下一步是确保产品已被消耗，这样在下次购买另一个按钮点击之前只能执行一次点击。这需要我们现在编写 `consumePurchase()`\
  \ 方法：\n\n```java\npublic void consumePurchase(View view) {\n    ConsumeParams consumeParams\
  \ =\n            ConsumeParams.newBuilder()\n                .setPurchaseToken(purchase.getPurchaseToken())\n\
  \                .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\n\
  \                @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                        BillingClient.BillingResponseCode.OK) {\n        \
  \        runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建一个 `ConsumeParams` 实例并使用当前购买的购买令牌进行配置（令牌从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象中获取）。它被传递给 `consumePurchase()` 方法，该方法在带有 `IO` 分发器的协程中启动。如果产品被成功消耗，将在主线程中执行代码以禁用消耗按钮并更新状态文本。\n\
  \n## 83.13 恢复之前的购买\n\n通过到目前添加的代码，我们可以在单个会话中购买并消耗产品。如果我们进行购买并在消耗之前退出应用，目前该购买在应用重启时将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并将其传递给结算客户端的 `queryPurchasesAsync()` 方法，同时带上监听器的引用，该监听器将在结果返回时被调用。在\
  \ `MainActivity.java` 文件中所示所示函数和监听器：\n\n```java\nprivate void reloadPurchase() {\n\
  \    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n        queryPurchasesParams,\n       \
  \ purchasesListener\n    );\n}\nprivate final PurchasesListener purchasesListener\
  \ = new PurchasesListener() {\n    @Override\n    public void onQueryasesResponse(@NonNull\
  \ BillingResult billingResult,\n            @NonNull List<Purchase> list) {\n  \
  \      if (!list.isEmpty()) {\n            purchase = list.get(0);\n           \
  \ binding.consumeButton.setEnabled(true);\n        } else {\n            binding.consumeButton.setEnabled(false);\n\
  \        }\n    }\n};\n```\n\n如果传递给监听器的购买列表不为空，则将列表中的第一个购买分配给 `purchase` 变量，并启用消耗按钮（在更完整的实现中，应该通过比较产品\
  \ ID 来检查这是否为正确的产品并处理返回多个购买的情况）。如果没有找到购买，则禁用消耗按钮，直到再次进行购买。剩下的工作工作是在结算设置期间如下所示调用我们的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n// ...\n   \
  \ if (billingResult.getResponseCode() ==\n                BillingClient.BillingResponseCode.OK)\
  \ {\n        Log.i(TAG, \"OnSetupFinish connected\");\n        queryProduct();\n\
  \        reloadPurchase();\n    } else {\n        Log.i(TAG, \"OnSetupFinish failed\"\
  );\n    }\n// ...\n}\n```\n\n### 83.14 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到 Play Console。由于我们已经上传了版本\
  \ 1，我们首先需要增加 `build.gradle`（模块: `InAppPurchase.app`）文件中的版本号：\n\n```gradle\n// ...\n\
  defaultConfig {\n    applicationId \"com.ebookfrenzy.inapppurchase\"\n    minSdk\
  \ 26\n    targetSdk 32\n    versionCode 2\n    versionName \"2.0\"\n}\n// ...\n\
  ```\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle”章节中的步骤生成新的应用 bundle，将其上传到内部测试轨道并将其发布给测试人员。接下来，使用内部测试链接，在登录了其中一个测试账户的设备或模拟器上安装应用。要找到测试链接，请在\
  \ Google Play Console 中选择应用，并在导航面板中选择“内部测试”（Internal testing）选项，然后选择“测试人员”（Testers）选项卡，如图\
  \ 83-6 所示：\n\n![](img/in-app-purchase-testers.jpg)\n图 83-6\n\n滚动到“测试人员如何加入您的测试”（How\
  \ testers join your test）部分并点击链接：\n\n![](img/in-app-purchase-copy_link.jpg)\n图 83-7\n\
  \n在测试设备或模拟器上打开 Chrome 浏览器，输入链接并按照说明从 Play Store 安装应用。应用启动后，它应该在延迟后在 TextView 上显示产品名称。点击购买按钮将开始购买流程，如图\
  \ 83-8 所示：\n\n![](img/in_app_test_purchase.jpg)\n图 83-8\n\n使用测试卡点击购买按钮，并等待消耗按钮启用。在点击此按钮之前，再次尝试购买产品并验证无法这样做，因为你已经拥有该产品。\n\
  \n点击消耗按钮并等待 TextView 上显示“已消耗”（Purchase consumed）消息。产品被消耗后，现在应该可以再次购买。再次进行购买，然后终止并重启应用。应用应该找到之前的未消耗购买并启用消耗按钮。\n\
  \n### 83.15 故障排除\n\n如果在购买时遇到问题，请确保设备已连接到 Android Studio（通过 USB 线或 WiFi），并在 Logcat\
  \ 面板中选择它。在 Logcat 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的日志。关于失败的更多信息，一个实用的技巧是从\
  \ `BillingResult` 实例获取调试消息，例如：\n\n```java\n// ...\n} else if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG, \"onPurchasesUpdated:\
  \ Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n注意，只要你不更改模块级 `build.gradle` 文件中的应用版本号，你现在现在应该可以直接在设备或模拟器上运行修改后的应用版本，而无需重新打包并上传到控制台。\n\
  \n\n\n\n\n如果没有列出测试付款卡，请确保设备上的用户账户已添加到许可测试人员列表（license testers list）中。如果应用正在实体设备上运行，请尝试在模拟器上运行。如果所有方法都失败了，你可以输入有效的支付方式进行测试购买，然后通过\
  \ Play Console 首页上的“订单管理”界面为自己退款。\n\n### 83.16 总结\n\n在本章中，我们创建了一个项目，演示了如何在 Android\
  \ 应用中添加应用内商品。这包括在 Google Play Console 中创建产品，以及编写用于初始化和连接计费客户端的代码、查询可用产品，以及最后对产品进行购买和消耗。我们还解释了如何使用\
  \ Play Console 添加许可测试人员，以便在测试期间无需花费实际金钱即可进行购买。\n\n# 84. Android 动态功能模块概述\n\n如前一章所述，应用包（app\
  \ bundles）和动态交付（dynamic delivery）的引入显著减少了用户在 Android 设备上安装应用时需要下载的包文件大小。虽然最初的目的是为每种可能的设备配置自动生成单独的包文件，但动态交付的另一个关键优势是可以将应用拆分为多个可以按需安装的动态功能模块（dynamic\
  \ feature modules）。\n\n在本章中，我们将开始探索动态功能模块的基本概念，为在下一章中进行详细的实践示例做准备。\n\n## 84.1 动态功能模块概述\n\
  \n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\n动态功能模块（也称为按需模块）允许将组成 Android\
  \ 应用的不同功能封装到单独的模块中，这些模块在用户需要时才会被下载并安装到设备上。例如，一个应用可能包含新闻和讨论两项功能。在这种情况下，应用默认可能只安装新闻功能，并将讨论功能拆分为一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问该功能，该模块将永远不会被安装，从而确保应用仅使用最少的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和时机具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常使用的模块。\n\
  \n动态功能还可能被指定为“即时”（instant）模块。这取代了早期 Android 版本中的即时应用（Instant App）概念，并允许无需安装应用即可在设备上运行动态功能模块。这使得应用可以在\
  \ Google Play 商店中带有“立即试用”按钮出现，或者通过点击网络 URL 在设备上立即启动。\n\n## 84.2 动态功能模块架构\n\nAndroid\
  \ 从设计初就考虑了模块化，特别是在 `Intents` 和 `Activities` 概念方面。动态功能将这种哲学推向了逻辑结论，允许应用在用户需要的时候仅安装用户需要的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块是使用分割 APK 文件（split APK files）构建的，这些文件允许多个 APK 文件组合在一起形成一个单一应用。\n\n\
  正如我们在“创建、测试和上传 Android 应用包”中所学习的那样，动态交付和应用包的工作原理是生成一个自定义的 APK 文件，该文件仅包含在特定设备配置上运行应用所需的字节码和资源。在这种情况下，应用仍然通过单个\
  \ APK 文件进行安装，尽管该文件是为用户的设备定制的。\n\n相比之下，动态功能模块通过将应用拆分为多个称为分割 APK 文件的文件来工作。\n\n当应用使用分割\
  \ APK 文件时，只有在首次下载应用时才会安装基础模块（base module）。基础模块通过可启动的活动（activity）作为进入应用的入口，并包含应用基础功能的字节码和资源，以及应用其他部分所需的配置和构建资源。例如，基础模块的清单（manifest）文件包含了与应用一起的任何动态功能模块的清单文件的合并。此外，所有动态功能模块的版本号由基础模块构建配置文件中的版本代码（version\
  \ code）设置决定。\n\n基础模块还包含应用包包含的动态功能模块列表，且所有动态功能模块必须在它们的构建配置中将基础模块列为依赖项。\n\n每个动态功能以模块的形式存在，包含该特定功能的字节码、清单、资源和构建配置，以及该功能的任何其他资产（如图像或数据文件）。\n\
  \n当用户从应用商店请求安装应用时，商店将为该模块生成基础 APK 文件，该文件包含所有设备配置通用的字节码和资源，以及一组专门为用户设备配置的配置 APK 文件。同样，安装动态功能模块的请求将生成一个动态功能\
  \ APK 文件，以及相应的配置 APK 文件，如下方的图 84-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\
  \n图 84-1\n\n### 84.3 创建动态功能模块\n\n可以通过添加全新的新模块或迁移现有模块向项目添加动态功能模块。要添加新模块，只需选择 Android\
  \ Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，根据要创建的动态功能类型，从左侧面板中选择`Dynamic\
  \ Feature Module`或`Instant Dynamic Feature Module`选项：\n\n![](img/as_new_module.jpg)\n\
  \n图 84-2\n\n选择合适的动态功能选项后，命名模块并更改最小 API 设置，使其与基础模块选择的 API 级别（如果这些版本不匹配，构建将失败）。\n\n\
  再次点击 Next 按钮配置按需选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\n图 84-3\n\n\
  当启用合用（Fusing）选项时，对于运行动态交付引入之前的旧版本 Android（Android 4.4 API 20 或更早）的设备，模块将与基础 APK\
  \ 一起下载。模块标题字符串长度可达 50 个字符，Google Play 在消息和通知中向用户描述该功能时将使用它。\n\n安装时间包含菜单提供了控制模块何时按需安装，而不是在用户设备上的首次安装时包含模块。菜单提供以下选项：\n\
  \n在安装时不包含模块（仅按需） - 无论设备配置和用户国家如何，模块在应用请求之前都不会被安装。\n\n安装时包含模块 - 禁用所有设备和用户国家的按需动态安装。模块将在设备上安装应用时同时安装。\n\
  \n\n\n\n\n- **仅对具有指定功能的设备在安装时包含模块** - 对于符合指定标准的设备配置和用户国家，该模块将在安装时包含。所有其他国家和设备配置将使用动态按需安装。当选择此选项时，将出现额外选项，允许输入设备功能。例如，在图\
  \ 84-4 中，该模块将在具有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，该模块将按需动态安装：\n\n![](img/as_4.2_dynamic_feature_device_features.jpg)\n\
  图 84-4\n\n其他标准（如国家和 API 级别）必须在项目清单文件 (`AndroidManifest.xml`) 中声明。例如，以下条将禁用法国用户以及运行\
  \ Android 版本低于 API 21 的设备的动态按需功能安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries\
  \ dist:exclude=\"true\">\n    <dist:country dist:code=\"FR\"/>\n  </dist:user-countries>\n\
  \  <dist:min-sdk dist:value=\"21\"/>\n</dist:conditions>\n```\n\n## 84. 将现有模块转换为动态交付\n\
  \n如果一个应用包含一个非常适合动态交付的现有功能，则可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\
  图 84-5\n\n在此项目中，app 模块将作为基础模块，而 `secondfeature` 模块是转换为动态功能模块的理想候选者。\n\n要将应用内部的现有模块转换为动态功能模块，首先编辑模块层级的\
  \ `build.gradle` 文件（在上面的示例中为 `Gradle Scripts -> build.gradle (Module: secondfeature)`），并将其修改为使用\
  \ `com.android.dynamic-feature` 替 `com.android.application` 插件，同时更改依赖关系，使模块仅依赖于基础（app）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\napply plugin: 'com.android.dynamic-feature'\n\
  \n.\n.\n\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.6.0'\n    api 'androidx.constraintlayout:constraintlayout:2.1.4'\n\
  \    testImplementation 'junit:junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑该模块的 `AndroidManifest.xml` 文件并进行如下修改（注意在此示例中，这是一个按需模块，而不是即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\"\n.\n.\n```\n\n注意 `title` 属性引用了字符串资源，该资源也需要在\
  \ `strings.xml` 文件中声明。此属性强制要求使用字符串资源而非硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle\
  \ (Module: app)`），以引用动态功能模块并将 Play Core 库作为依赖项：\n\n```gradle\napply plugin: 'com.android.application'\n\
  android {\n    compileSdkVersion 29\n.\n.\n    }\n    dynamicFeatures = [\":secondfeature\"\
  ]\n}\n\ndependencies {\n.\n.\n    api 'com.google.android.play:core:1.10.3'\n.\n\
  .\n}\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication`\
  \ 的子类：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.split.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\"\n.\n```\n\n## 4.5 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能，就需要编写代码来安装和管理这些模块。这将涉及诸许多任务，例如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都是使用\
  \ Play Core 库提供的 API 完成的，大多数这些调用涉及 `SplitInstallManager` 实例的使用，该实例可以如下所示创建：\n\n\
  ```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已安装。例如，以下代码获取已安装模块列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法，可以安装一个或多个模块：\n\n```java\n.\n.\nint mySessionID = 0;\n.\n.\nSplitInstallRequest\
  \ request =\n    SplitInstallRequest.newBuilder()\n        .addModule(\"my_dynamic_feature\"\
  )\n        .addModule(\"my_dynamic_feature2\")\n        .build();\nmanager.startInstall(request)\n\
  \    .addOnSuccessListener(new OnSuccessListener<Integer>() {\n        @Override\n\
  \        public void onSuccess(Integer sessionId) {\n            mySessionID = sessionId;\n\
  \        }\n    })\n    .addOnFailureListener(new OnFailureListener() {\n      \
  \  @Override\n        public void onFailure(Exception exception) {\n        }\n\
  \    });\n```\n\n当执行上述代码时，模块安装将立即开始。或者，可以通过将功能模块数组传递给 `deferredInstall()` 方法来执行延迟安装：\n\
  \n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\", \"my_dynamic_feature2\"\
  ));\n```\n\n延迟下载由操作系统决定在后台执行。\n\n虽然无法跟踪延迟安装的状态，但可以通过向管理器添加监听器来跟踪非延迟安装：\n\n```java\n\
  SplitInstallStateUpdatedListener listener =\n    new SplitInstallStateUpdatedListener()\
  \ {\n        @Override\n        public void onStateUpdate(SplitInstallSessionState\
  \ state) {\n            if (state.sessionId() == mySessionID) {\n              \
  \  switch (state.status()) {\n                    case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                        // 大模块需要用户许可\n                        break;\n        \
  \            case SplitInstallSessionStatus.DOWNLOADING:\n                     \
  \   // 正在下载模块\n                        break;\n                    case SplitInstallSessionStatus.INSTALLING:\n\
  \                        // 正在安装下载的模块\n                        break;\n        \
  \            case SplitInstallSessionStatus.DOWNLOADED:\n                      \
  \  // 模块下载完成\n                        break;\n                    case SplitInstallSessionStatus.INSTALLED:\n\
  \                        // 模块已成功安装\n                        break;\n          \
  \          case SplitInstallSessionStatus.CANCELED:\n                        //\
  \ 用户取消了下载\n                        break;\n                    case SplitInstallSessionStatus.PENDING:\n\
  \                        // 安装已延迟\n                        break;\n            \
  \        case SplitInstallSessionStatus.FAILED:\n                }\n           \
  \ }\n        }\n    };\n```\n\n\n\n\n\n```javascript\n// The installation failed\n\
  \n        }\n\n    }\n\n}\n\n};\n```\n\n一旦实现了监听器，就需要将其在 `SplitInstallManager` 实例上进行注册，并在不再需要时取消注册。\n\
  \n```java\nmanager.registerListener(listener);\n```\n\n`manager.unregisterListener(listener)`\n\
  \n### 84.6 处理大型动态特性模块\n\nAndroid 动态交付系统在未先请求用户许可的情况下，不允许下载大小大于 10MB 的动态特性模块。当请求下载大型特性模块时，监听器会被调用并传入一个\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，由 App 负责显示确认对话框，并可选地实现一个 `onActivityResult()`\
  \ 处理方法，以识别用户是批准还是拒绝了下载。\n\n```java\nprivate static final int REQUEST_CODE = 101;\n\
  ```\n\n```java\nSplitInstallStateUpdatedListener listener =\n    new SplitInstallStateUpdatedListener()\
  \ {\n\n    @Override\n    public void onStateUpdate(SplitInstallSessionState state)\
  \ {\n        if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    try {\n                        manager.startConfirmationDialogForResult(state,\n\
  \                            MainActivity.this, REQUEST_CODE);\n               \
  \     } catch (IntentSender.SendIntentException ex) {\n                        //\
  \ Request failed\n                    }\n                    break;\n```\n\n上述代码启动了一个意图（intent），随后会显示内置的确认对话框。该意图将向\
  \ `onActivityResult()` 方法返回结果码，该方法可以如下实现：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准安装\n        } else\
  \ {\n            // 用户拒绝安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态特性模块将自动下载并安装。\n\
  \n### 84.7 总结\n\n动态特性模块允许将 Android App 划分为独立的特性，这些特性在用户需要时按需下载。动态特性模块还可以被配置为即时特性（instant\
  \ features）。即时特性无需在设备上安装 App 即可运行，用户可以通过应用商店页面上的“立即尝试”按钮或通过 Web URL 进行访问。\n\n动态特性的实现涉及将\
  \ App 拆分为基础模块和一个或多个动态特性模块。可以在 Android Studio 中创建新的动态特性模块，并通过对项目进行少量更改将现有模块转换为动态特性模块。\n\
  \n一旦动态特性模块添加到 App 中，这些模块的下载和管理将由 App 通过 Play Core Library 中的 `SplitInstall` 类处理。\n\
  \n## 85. Android Studio 动态特性教程\n\n在上一章涵盖了 Android 动态交付和动态特性的基本概念，本章将以示例项目的形式将这些理论付诸实践。在本章创建\
  \ App 将包含两个 Activity，第一个将作为 App 的基础模块，而第二个将指定为按需下载的动态特性。\n\n#### 85.1 创建 DynamicFeature\n\
  \n从欢迎界面选择 New Project（新建项目）选项，并在项目对话框中选择 Empty Views 模板。在 Name（名称）字段中输入 `DynamicFeature`\
  \ 并指定一个包名。在点击 Finish（完成）按钮之前，将 Minimum API 设置更改为 API `26` (Oreo)，并将语言设置为 Java。\n\
  \n### 85.2 为项目添加动态特性支持\n\n在开始实现 App 之前，需要对项目进行两个更改以添加对动态特性的支持。在 Android Studio 中，打开\
  \ App 级别的 `build.gradle` 文件，找到依赖部分并添加 Play Core Library：\n\n```gradle\ndependencies\
  \ {\n    implementation 'com.google.android.play:core:10.3'\n}\n```\n\n一旦下载特性模块下载，在\
  \ App 重启之前 App 无法使用它。坦率地说，可以通过在项目中启用 `SplitCompat` 来避免这一缺陷。在 `AndroidManifest.xml`\
  \ 中如下声明应用：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookrenzy.dynamicfeature\"\
  >\n\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompat\"\
  \n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher\"\
  >\n```\n\n#### 85.3 设计基础 Activity 用户界面\n\n此时，项目包含一个 Activity，它将作为基础模块的入口点。该基础模块将负责请求、安装和管理动态特性模块。\n\
  \n为了演示动态特性的使用，基础 Activity 将由一系列按钮组成，这些按钮将允许安装、启动和移除动态特性模块。用户界面还将包含一个 `TextView`\
  \ 对象用于显示与动态特性模块相关的状态信息。考虑到这些需求，将 `activity_main.xml` 布局文件加载到布局编辑器中，删除默认的 `TextView`\
  \ 对象，并实现设计使其类似于下图 85-1 所示。\n\n![](img/as_dynamic_feature_ui.jpg)\n\n图 85-1\n\n一旦定位了对象，选择\
  \ TextView 小部件并使用 Attributes（属性）工具窗口将 `id` 属性设置为 `status_text`。开始应用布局约束：选择布局内的所有对象，右键点击\
  \ TextView 对象并从菜单中选择 Center -> Horizontally（水平居中）选项，从而将所有四个对象约束在屏幕的水平居中。\n\n在所有对象仍被选中的情况下，再次右键点击\
  \ TextView，这次选择 Chains -> Vertical Chain（垂直链）菜单选项。在继续之前，将所有按钮字符串提取到资源中，并配置三个按钮分别调用\
  \ `launchFeature`、`installFeature` 和 `deleteFeature` 方法。\n\n\n\n\n\n要向项目添加动态功能模块，选择\
  \ `File -> New -> New Module...` 菜单选项，并在弹出的对话框中从左侧面板选择 `Dynamic Feature`（动态功能）。在主面板中，将模块命名为\
  \ `my_dynamic_feature`，并将最小 API 设置为 `API 26: Android 8.0 (Oreo)`，以便与基础模块选择的 API\
  \ 级别保持一致，如图 85-2 所示：\n\n![](img/as_4.2_add_dynmaic_feature.jpg)\n\n图 85-2\n\n再次点击\
  \ `Next` 配置 `On-Demand`（按需）选项，确保启用了 `Fusing`（合并）选项。在 `Module Title` 字段中，输入文本“My\
  \ Example Dynamic Feature”：\n\n![](img/as_4.2_dynamic_feature_options1.jpg)\n\n\
  图 85-3\n\n为了本示例，在点击 `Finish` 按钮提交更改并将动态功能模块添加到项目之前，请将 `Install-time`（安装时）包含菜单设置为\
  \ `Do not include module at install time (on-demand only)`。\n\n### 85.5 审查动态功能模块\n\
  \n在继续后续步骤之前，值得花一些时间审查 Android Studio 对项目所所的更改。理解这些更改对于解决问题以及将现有 App 功能转换为动态功能时都非常有帮助。\n\
  \n首先参考 `Project`（项目）工具窗口，那里将出现一个新条目，代表包含新动态功能模块的文件夹：\n\n![](img/as_3.5_dynamic_feature_in_project_window.jpg)\n\
  \n图 85-4\n\n注意，该功能有自己的子结构，包括一个 manifest（清单）文件、一个可以添加代码和资源的包（package）以及一个 `res` 文件夹。打开并查看\
  \ `AndroidManifest.xml` 文件，它应该包含在功能创建过程中选择的属性设置，包括 `on-demand`、`fusing` 和 `feature-title`\
  \ 值：\n\n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n特别感兴趣的一点是，模块标题字符串被存储为字符串资源，而不是直接输入在\
  \ manifest 文件中。这是标题字符串的前提条件，可以在基础模块的 `strings.xml`（`app -> res -> values -> strings.xml`）找到该资源并在必要时进行修改。\n\
  \n动态功能模块的构建配置可以在 `Gradle Scripts -> build.gradle (Module: DynamicFeature.my_dynamic_feature)`\
  \ 文件找到，其内容如下：\n\n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\
  \nandroid {\n    compileSdkVersion 33\n}\n\ndependencies {\n    implementation project(\"\
  :app\")\n}\n```\n\n该文件中的关键条目应用了 `com.android.dynamic-feature` 插件，这确保了该模块被视为动态功能，以及指示该功能依赖于基础（app）模块的实现行。\n\
  \n基础模块的 `build.gradle` 文件（`Gradle Scripts -> build.gradle (Module: DynamicFeature.app)`）也包含一个列出动态功能模块的新条目。在审查文件时，添加指令以启用视图绑定（view\
  \ binding）支持：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid\
  \ {\n    buildFeatures {\n        viewBinding true\n    }\n    dynamicFeatures =\
  \ [':my_dynamic_feature']\n}\n```\n\n向项目添加任何额外的动态功能也需要在此处引用，例如：\n`dynamicFeatures\
  \ = [\":my_dynamic_feature\", \":my_second_feature\", ...]`\n\n## 85.6 添加动态功能 Activity\n\
  \n从上述图 85-4 所示的 `Project` 工具窗口可以看出，目前动态功能模块除了 manifest 文件之外几乎没有内容。下一步是向模块中添加一个 activity，以便该功能在从基础模块启动时能够执行实际操作。在\
  \ `Project` 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity ->\
  \ Empty Views Activity` 菜单选项。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout`\
  \ 选项，但在点击 `Finish` 按钮之前禁用 `Launcher Activity`。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  \n一旦 activity 添加到模块，编辑 `AndroidManifest.xml` 文件并进行修改以添加 intent filter（意图过滤器），这将允许基础模块启动该\
  \ activity（将 `<com.company>` 替换为使您的 App 在 Google 上保持唯一的唯一包名）：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\"\n            android:exported=\"true\">\n\
  \            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件的 `dependencies`\
  \ 部分以包含 Google Play 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.10.1'\n\
  }\n```\n\n为了能够在动态模块内部访问资源，需要在 `MyFeatureActivity` 内部调用 `SplitCompat.install()` 方法。编辑\
  \ `MainActivity.java` 文件并按 `onCreate()` 方法如下，包括添加视图绑定支持的更改：\n\n```java\nimport android.view.View;\n\
  import com.google.android.play.core.splitcompat.SplitCompat;\nimport com.company.dynamicfeature.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_my_feature);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n未执行此步骤通常会导致 App 在启动动态功能时崩溃，并出现类似的错误：\n`AndroidRuntime: java.lang.RuntimeException:\
  \ Unable to start activity ComponentInfo{com.ebookfrenzy.dynamicfeature/com.ebookfrenzy.my_dynamic_feature.MyFeatureActivity}:\
  \ android.content.res.Resources$NotFoundException: Resource ID #0x80020000`\n\n\
  通过将 `activity_my_feature.xml` 文件加载到布局编辑器工具并添加显示文本“My Dynamic Feature Module”的 `TextView`\
  \ 对象来完成该功能：\n\n![](img/as_3.4_dynamic_feature_activity_ui.jpg)\n\n图 85-5\n\n## 85.7\
  \ 实现 launchIntent() 方法\n\n\n\n\n当项目结构和用户界面设计完成后，现在是时候使用 Play Core 库开始动态功能模块了。第一步是实现\
  \ `launchFeature()` 方法，其目的是使用意图（intent）启动动态功能活动。然而，尝试在一个尚未安装的动态功能模块中启动会导致应用程序崩溃。因此，`launchFeature()`\
  \ 方法需要包含一些防御性代码以确保动态功能已安装。为了实现这一点，我们需要创建一个 `SplitInstallManager` 类的实例，并调用该对象的 `getInstalledModules()`\
  \ 方法来检查 `my_dynamic_feature` 模块是否已经安装。如果已安装，就可以安全地启动模块中包含的活动，否则需要在状态 `TextView`\
  \ 上向用户显示消息。在 `MainActivity.java` 文件中，对该类进行以下更改：\n\n```java\nimport android.content.Intent;\n\
  import com.google.android.play.core.splitinstall.SplitInstallManager;\nimport com.google.android.play.core.splitinstall.SplitInstallManagerFactory;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private SplitInstallManager manager;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallManagerFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n            Intent i = new Intent(\n                    \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\n            startActivity(i);\n        } else {\n            binding.statusText.setText(\"\
  Feature not yet installed\");\n        }\n    }\n}\n```\n\n## 85.8 为测试上传 App Bundle\n\
  \n现在项目已准备好进行第一阶段测试。这涉及生成发布版 app bundle 并将其上传到 Google Play Console。实现这一点的步骤已在“创建、测试和上传\
  \ Android App Bundle”章节中列概述，但可以总结如下：\n\n1. 登录 Google Play Console 并创建一个新应用程序。\n\
  2. 按照步骤配置应用的标题、描述、分类和图像资源（示例图像资源可以在随本书下载的示例代码的 `image_assets` 文件夹中找到）并保存草稿设置。此外，确保为该\
  \ bundle 启用 Google Play 应用签名。\n3. 使用 Android Studio 中的 `Build -> Generate Signed\
  \ App Bundle / APK...` 菜单生成一个签名的发布版 app bundle。\n4. 在 Google Play Console 中，从左侧导航面板选择\
  \ `Testing -> Internal testing` 。\n5. 在内部测试屏幕上，点击 `Create Release` 按钮并点击 `Continue`\
  \ 以接受让 Google 管理密钥签名任务的选项。将上方生成的 app bundle 文件拖放到上传框中并点击 `Save`。\n6. 切换到内部测试屏幕内的\
  \ `Testers` 标签页，并添加将用于在一个或多个物理设备上测试应用的账户邮箱地址。\n7. 返回 `Releases` 标签页并点击 `Edit` 按钮。滚动到结果页底部并点击\
  \ `Review release` 按钮。\n8. 在确认屏幕上，点击 `Start rollout to Internal testing` 按钮。应用程序将显示为\
  \ `Pending publication`（等待发布）。\n\n一旦发布用于测试，将向所有内部测试轨道上的用户发送通知，要求他们加入应用的测试轨道。或者，复制\
  \ `Testers` 屏幕上列出的 URL 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开将启动 Play Store 应用并打开图 85-6\
  \ 所示的 DynamicFeature 应用的下载页：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 85-6\n\n点击按钮安装应用，然后打开它并点击 `Launch` 按钮。动态功能尚未安装的事实反映在状态文本中。\n\n## 5.9 实现 `installFeature()`\
  \ 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个 `SplitInstallRequest`\
  \ 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示 `Toast` 消息，指示安装请求的状态。在 `MainActivity.java`\
  \ 文件中，按如下添加 `installFeature()` 方法：\n\n```java\nimport android.widget.Toast;\nimport\
  \ com.google.android.play.core.install.SplitInstallRequest;\nimport com.google.android.play.core.tasks.OnFailureListener;\n\
  import com.google.android.play.core.tasks.SuccessListener;\n\npublic void installFeature(View\
  \ view) {\n    SplitInstallRequest request = SplitInstallRequest.newBuilder()\n\
  \            .addModule(\"my_dynamic_feature\")\n            .build();\n    manager.startInstall(request)\n\
  \        .addOnSuccessListener(new OnSuccess<Integer>() {\n            @Override\n\
  \            public void onSuccess(Integer sessionId) {\n                Toast.makeText(MainActivity.this,\
  \ \"Module installation started\", Toast.LENGTH_SHORT).show();\n            }\n\
  \        })\n        .addOnFailureListener(new OnFailureListener() {\n         \
  \   @Override\n            public void onFailure(Exception exception) {\n      \
  \          Toast.makeText(MainActivity.this, \"Module installation failed\" + exception.toString(),\
  \ Toast.LENGTH_SHORT).show();\n            }\n        });\n}\n```\n\n修改 `build.gradle\
  \ (Module: DynamicFeature.app)` 文件，增加 `versionCode` 和 `versionName` 值，以便新版本的 app\
  \ bundle 能够进行测试：\n\n```gradle\nandroid {\n    versionCode 2\n    versionName \"\
  2.0\"\n}\n```\n\n重复此步骤，在 `build.gradle (Module: DynamicFeature.dynamic_feature)`\
  \ 文件中声明匹配的版本号。生成包含更改的新 app bundle，然后返回 Google Play Console 中的应用 `Testing -> Internal\
  \ testing` 页面，点击 `Create new release` 按钮，如下图 85-7 所示：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\
  \n图 85-7\n\n按照步骤上传新的 app bundle 并进行内部测试。在测试设备上，打开 Google Play Store 应用并确保 `Install`\
  \ 按钮已变为 `Update` 按钮（如果没有，请关闭应用商店并在几分钟后重试）并更新到新版本。更新完成后，运行应用，点击 `Install Feature`\
  \ 按钮并检查 `Toast` 消息以确保安装成功开始。当下载功能时，屏幕顶部的状态栏应短暂显示下载图标。下载完成后，点击 `Launch Feature` 按钮显示第二个活动。\n\
  \n如果安装失败或应用程序崩溃，通常可以从 LogCat 输出中识别原因。要查看此输出，将设备连接到开发计算机，打开终端或命令行提示窗口并执行以下命令：\n\n\
  ```\nadb logcat\n```\n\n\n\n\n此 `adb` 命令将实时显示 LogCat 输出，包括应用在遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n# 85.10 添加更新监听器\n\n为了更详细地跟踪动态功能模块的安装进度，可以向应用中添加 `SplitInstallStateUpdatedListener`\
  \ 实例。由于可能同时安装多个功能模块，因此添加一些代码来跟踪分配给安装过程的会话 ID。首先添加一些导入项，在 `MainActivity.java` 文件中声明一个变量来存储当前的会\
  \ ID，并修改 `installFeature()` 方法，以便在每次成功启动安装时存储会 ID 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallSessionState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallSessionStatus;\n\
  import java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private SplitInstallManager manager;\n\
  \    private int mySessionId = 0;\n\n    public void installFeature(View view) {\n\
  \        manager.registerListener(listener);\n        manager.startInstall(request)\n\
  \            .addOnSuccessListener(new OnSuccessListener<Integer>() {\n        \
  \        @Override\n                public void onSuccess(Integer sessionId) {\n\
  \                    mySessionId = sessionId;\n                    Toast.makeText(MainActivity.this,\n\
  \                            \"Module installation started\",\n                \
  \            Toast.LENGTH_SHORT).show();\n                }\n            })\n  \
  \  }\n}\n```\n\n接下来，实现监听器代码，其读取逻辑如下：\n\n```java\nSplitInstallStateUpdatedListener\
  \ listener = new SplitInstallStateUpdatedListener() {\n    @Override\n    public\
  \ void onStateUpdate(SplitInstallSessionState state) {\n        if (state.sessionId()\
  \ == mySessionId) {\n            switch (state.status()) {\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    long size = state.totalBytesToDownload();\n\
  \                    long downloaded = state.bytesDownloaded();\n              \
  \      binding.statusText.setText(String.format(Locale.getDefault(),\n         \
  \                   \"%d of %d bytes downloaded.\", downloaded, size));\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    binding.statusText.setText(\"Installing feature\");\n     \
  \               break;\n                case SplitInstallSessionStatus.DOWNLOADED:\n\
  \                    binding.statusText.setText(\"Download Complete\");\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    binding.statusText.setText(\"Installed - Feature is ready\"\
  );\n                    break;\n                case SplitInstallSessionStatus.CANCELED:\n\
  \                    binding.statusText.setText(\"Installation cancelled\");\n \
  \                   break;\n                case SplitInstallSessionStatus.PENDING:\n\
  \                    binding.statusText.setText(\"Installation pending\");\n   \
  \                 break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    binding.statusText.setText(\"Installation Failed. Error code:\
  \ \" + state.errorCode());\n                case SplitInstallSessionStatus.CANCELING:\n\
  \                    binding.statusText.setText(\"Installation canceling\");\n \
  \                   break;\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    binding.statusText.setText(\"User Confirmation Required\");\n\
  \                    break;\n                case SplitInstallSessionStatus.UNKNOWN:\n\
  \                    binding.statusText.setText(\"Unknown Status\");\n         \
  \           break;\n            }\n        }\n    }\n};\n```\n\n\n\n\nAndroid 应用的外观旨在符合\
  \ Material Design 定义的一系列指南。Material Design 由 Google 开发，旨在为不同的应用之间提供设计的一致性，同时允许应用开发者在颜色、字体和形状选择方面包含他们自己的品牌标识（这一概念被称为\
  \ **Material 主题**，Material theming）。除了设计指南之外，Material Design 还包含了一套 UI 组件，用于设计用户界面布局，我们在本书中已经一直在使用其中的许多组件。\n\
  \n在本章中，我们将概述主题化（theming）在 Android Studio 项目中是如何运作的，并探索如何修改为新项目提供的默认设计配置，以满足您的品牌需求。\n\
  \n## 86.1 Material Design 2 vs Material Design 3\n\n在开始之前，重要的是，Google 正在从 Material\
  \ Design 2 向 Material Design 3 过渡，并且 Android Studio Flamingo 是第一个默认使用 Material Design\
  \ 3 的版本。Material Design 3 为 Material You 基础，这是 Android 12 中引入的一项功能，允许应用自动调整主题元素，以匹配用户在设备上配置的偏好。例如，Material\
  \ Design 3 提供的动态颜色支持允许应用中使用的颜色自动适应以匹配用户的壁纸选择。\n\n## 86.2 理解 Material Design 主题化\n\
  \n我们当然知道，Android 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们在 XML 布局资源文件中或通过编写代码显式地覆盖颜色属性，否则所有这些组件都使用默认颜色显示。这些默认颜色由项目的主题定义。主题由一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，这些槽被分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都被程序设定为使用主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 小部件的前景和背景颜色）。因此，我们可以仅通过更改分配给特定主题槽的颜色，来更改应用的整个全局主题。当应用运行时，当渲染用户界面时，新的默认颜色将作为所有小部件的默认颜色。\n\
  \n### 86.3 Material Design 3 主题化\n\n在探索 Material Design 3 之前，我们首先需要查看它如何在 Android\
  \ Studio 项目中使用。应用程序项目使用的的主题被声明为 `AndroidManifest.xml` 文件中 `application` 元素的属性，例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <application\n.\n.\n      android:supportsRtl=\"true\"\n      android:theme=\"\
  @style/Theme.MyDemoApp\"\n      tools:targetApi=\"31\">\n      <activity\n.\n.\n\
  ```\n\n如之前讨论过的，与项目主题相关的所有文件都包含 `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml`\
  \ 文件中，如图 86-1](#Theming.xhtml__idTextAnchor1651)所示：\n\n![](img/as_theme_files_in_project_tool_window.jpg)\n\
  \n图 86-1\n\n主题本身声明在位于 themes 文件夹的两个 `themes.xml` 文件中。这些资源文件声明了不同的调色板，包含 Material\
  \ 主题颜色槽，用于设备处于亮色或深色（夜间）模式时。请注意，每个文件中的 `style name` 属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配，例如：\n\
  \n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!--\
  \ Base application theme. -->\n    <style name=\"Base.Theme.MyDemoApp\" parent=\"\
  Theme.Material3.DayNight.NoActionBar\">\n        <!-- 在此处自定义您的亮色主题。 -->\n      \
  \  <!-- <item name=\"colorPrimary\">@color/my_light_primary</item> -->\n    </style>\n\
  \    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\" />\n</resources>\n\
  ```\n\n这些颜色槽（也称为颜色属性）被 Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽被用作 `Material\
  \ Button` 组件的背景颜色。\n\nMD3 中的颜色槽被分组为 Primary（主）、Secondary（次）、Tertiary（三级）、Error（错误）、Background（背景）和\
  \ Surface（表面）。这些槽进一步分为由一个基础颜色和一个“在其之上”（on）基础颜色组成的对。这通常对应于 Material 组件的背景和前景颜色。\n\
  \n不同小部件用于着色的特定组会有不同。例如，`Material Button` 小部件将使用 `colorPrimary` 基础颜色作为背景颜色，并使用 `colorOnPrimary`\
  \ 作为其内容（即它显示的文本或图标）。相反，`FloatingActionButton` 组件使用 `colorPrimaryContainer` 作为背景颜色，使用\
  \ `colorOnPrimaryContainer` 作为前景。通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果，快速识别特定小部件类型的正确组。\n\
  \n假设我们需要将 `colorPrimary` 更改为红色。我们通过向 `colors.xml` 文件添加红色的新条目来实现，然后将其分配给 `themes.xml`\
  \ 文件中的 `colorPrimary` 槽。因此，MD3 主题中的 `colorPrimary` 槽读取如下：\n\n```xml\n<resources\
  \ xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- Base application theme.\
  \ -->\n    <style name=\"Base.Theme.MyDemoApp\" parent=\"Theme.Material3.DayNight.NoActionBar\"\
  >\n        <item name=\"colorPrimary\">@color/my_light_primary</item>\n    </style>\n\
  \    <style name=\"Theme.MyDemoApp\" parent=\"Base.Theme.MyDemoApp\" />\n</resources>\n\
  ```\n\n该颜色随后在 `colors.xml` 文件中声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<resources>\n.\n.\n    <color name=\"my_light_primary\">#FC005</color>\n</resources>\n\
  ```\n\n### 86.4 构建自定义主题\n\n如我们所述，实现主题的代码工作相对简单。然而，困难的部分通常是选择组成主题的组合颜色。幸运的是，Google\
  \ 开发了一个工具可以轻松地为应用设计自定义主题。该工具被称为 Material Theme Builder，地址如下：\n\n[`m3.material.io/theme-builder#/`](https://m3.material.io/theme-builder#/)custom\n\
  \n在自定义屏幕（图 86-2](#Theming.xhtml__idTextAnchor1653））上，通过点击颜色圆显示颜色选择框，为主颜色键（A）进行颜色选择。一旦选择了颜色，预览（B）将更改以反映所有\
  \ MD3 颜色槽的推荐颜色。此外，您可以通过点击相应的颜色圆来覆盖生成的 Secondary、Tertiary 和 Neutral 槽的颜色。\n\n标记为\
  \ B 的区域显示了示例应用界面、亮色和深色配色方案图，以及根据您的颜色选择进行更新的小部件。由于面板比典型的浏览器窗口长，您必须向下滚动以查看所有信息。\n\n\
  要将主题整合到您的设计中，点击导出按钮（C）并选择 Android 查看（XML）选项。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件来替换项目中的现有文件。请注意，导出的两个 `themes.xml` 文件中的主题名称需要更改以匹配您的项目。\n\n### 86.5 总结\n\n\n\
  \n\n\nMaterial Design 提供了定义 Android 应用外观的指南和组件。通过设计指定显示应用时使用的颜色、字体和形状的主题，可以为应用应用个性的个性的品牌化设计。Google\
  \ 最近引入了 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能，包括动态颜色。Google\
  \ 还提供了 Material Theme Builder，用于设计您自己的主题，这减轻了选择互补主题颜色的任务负担。一旦使用此工具设计好主题，就可以导出相应的文件并在\
  \ Android Studio 项目中使用。\n\n## 87. Material Design 3 主题化与动态颜色教程\n\n本章将向你展示如何使用 Material\
  \ Theme Builder 工具创建一个新的 Material Design 3 主题，并将其集成到 Android Studio 项目中。教程还将演示如何为应用添加对动态主题颜色的支持并进行测试。\n\
  \n## 87.1 创建 ThemeDemo 项目\n\n在欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `ThemeDemo`，并指定 `com.ebookfrenzy.themedemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：`Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n### 87.2 设计用户界面\n\n主活动将由一个简单的布局组成，其中包含一些用户界面组件，让我们看到之后执行的主题工作效果。有关\
  \ MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个 `Text view`（文本视图）。在布局编辑器中打开此文件，删除 `Text\
  \ view`，禁用 `Autoconnect`（自动连接）模式（在 图 87-1 中标记为 A），并点击按钮清除布局中的所有约束（B）。\n\n![](img/as_theme_demo_disable_autoconnect.jpg)\n\
  \n图 87-1\n\n从 `Palette`（调色板）的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button`\
  \ 视图拖放到布局画布上。接下来，将 `FloatingActionButton`（悬浮操作按钮）拖到布局画布上，使其位于 `Button` 组件下方。当提示选择显示在\
  \ `FloatingActionButton` 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如图图 87-2 所示：\n\n\
  ![](img/as_theme_demo_select_icon.jpg)\n\n图 87-2\n\n将 `Chip` 组件的 `text` 属性更改为“This\
  \ is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局类似于图\
  \ 87-3 左侧所示：\n\n![](img/as_theme_demo_ui.jpg)\n\n图 87-3\n\n要设置图中蓝图视图所示的约束，选择所有组件，右键点击\
  \ `Chip` 视图，并在生成的菜单中选择 `Chains -> Create Vertical Chain`（链 -> 创建垂直链）。重复此步骤，这次选择\
  \ `Center -> Horizontally in Parent`（在父容器水平居中）菜单选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面是否与上方图\
  \ 87-3 所示所示。下一步是创建一个自定义主题并应用到项目中。\n\n### 87.3 构建新主题\n\n首先打开浏览器窗口并导航到以下 URL 以访问构建工具：\n\
  \n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n加载构建器后，选择一张纸，然后点击屏幕顶部的 `Custom` 按钮，点击 `Core Colors`（核心颜色）部分的 `Primary` 颜色圆形显示颜色选择器。从颜色选择器中任选一种颜色作为你主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 87-4\n\n在 `Your Theme`（您的主题）面板中检查颜色方案，并使用\
  \ `Core colors` 设置进行任何必要的颜色调整，直到你对颜色槽满意。主题准备好后，点击右上角的 `Export`（导出）按钮并选择 `Android\
  \ Views (XML)` 选项。在提示时，将文件保存到计算机文件系统中的合适位置。主题将保存为名为 `material-theme.zip` 的压缩文件。\n\
  \n使用适用于你操作系统的工具解压主题文件，该文件应包含一个名为 `material-theme` 的文件夹，其中包含以下文件夹和文件：\n\n- `values/colors.xml`\
  \ - 颜色定义。\n- `values/themes.xml` - 亮模式的主题。\n- `values-night/themes.xml` - 暗色模式的主题。\n\
  \n现在生成主题文件，需要将其集成到 Android Studio 项目中。\n\n### 87.4 将主题添加到项目\n\n在我们将新主题添加到项目之前，首先需要删除旧的主题文件。如果\
  \ `Project`（项目）工具窗口处于 `Project Files`（项目文件）模式，这样做更容易。要切换模式，使用 `Project` 工具窗口顶部的菜单如下所示：\n\
  \n![](img/as_theme_demo_project_files_menu.jpg)\n\n图 87-5\n\n在 `Project Files` 模式下，导航到\
  \ `app -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml` 文件。同样删除\
  \ `values-night` 文件夹中的 `themes.xml` 文件。打开操作系统的文件导航工具，找到新主题 `values` 文件夹中的 `colors.xml`\
  \ 和 `themes.xml` 文件，将其复制到项目窗口中的 `values` 文件夹。\n\n将项目窗口切换回 Android 模式，此时资源部分应与图 87-6\
  \ 所示：\n\n![](img/as_new_theme_files_added.jpg)\n\n图 87-6\n\n接下来，修改 `themes.xml`\
  \ 文件以匹配当前项目：\n\n```xml\n<resources>\n    <style name=\"Base.Theme.ThemeDemo\" parent=\"\
  Theme.Material3.Light.NoActionBar\">\n        <item name=\"colorPrimary\">@color/md_theme_primary</item>\n\
  \        <item name=\"colorOnPrimary\">@color/md_theme_onPrimary</item>\n    </style>\n\
  \    <style name=\"Theme.ThemeDemo\" parent=\"Base.Theme.ThemeDemo\" />\n</resources>\n\
  ```\n\n重复这些步骤对 `themes.xml` (night) 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或再次运行应用，确认用户界面现在使用自定义主题颜色渲染。\n\
  \n### 87.5 启用动态颜色支持\n\n要测试动态颜色，需要在运行 Android 12 或更高版本的设备或模拟器上具有正确的壁纸设置。在设备或模拟器上，启动\
  \ `Settings`（设置）应用并从列表中选择 `Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上点击更改壁纸（在图 87-7 中标记为\
  \ A），并选择一张与你主题颜色显著不同的壁纸图像。选择后，将壁纸应用于主屏幕。\n\n返回 `Wallpaper & styles` 屏幕，在从颜色方案按钮中选择选项之前，确保选中了\
  \ `Wallpaper colors`（壁纸颜色）选项（B）。随着每个选项的点击，壁纸示例将随选择而发生变化（C）：\n\n![](img/compose_theme_wallpaper_and_styles.jpg)\n\
  \n图 87-7\n\n\n\n\n\n要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesIfAvailable()`\
  \ 方法。为了为整个应用启用动态颜色支持，需要在自定义 `Application` 实例的 `onCreate()` 方法中调用此方法。首先，在项目的 `app\
  \ -> java -> com.ebookfrenzy.themedemo` 目录下添加一个名为 `ThemeDemoApplication.java` 的新\
  \ Java 类文件，并对其进行如下修改如下：\n\n```java\npackage com.ebookfrenzy.themedemo;\n\nimport\
  \ android.app.Application;\n\nimport com.google.android.material.color.DynamicColors;\n\
  \npublic class ThemeDemoApplication extends Application {\n\n    @Override\n   \
  \ public void onCreate() {\n        super.onCreate();\n        DynamicColors.applyToActivitiesIfAvailable(this);\n\
  \    }\n}\n```\n\n创建自定义的 `Application` 类后，我们现在需要配置项目使用该类而不是默认的 `Application` 实例。要实现这一点，请编辑\
  \ `AndroidManifest.xml` 文件并添加一个引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n```\n\n构建并运行应用，注意布局现在在使用与壁纸颜色匹配的主题。将\
  \ `ThemeDemo` 应用置于后台，返回 `Wallpaper & styles` 设置屏幕并选择不同的壁纸。再次将 `ThemeDemo` 应用带到前台，此时它将动态适应以匹配新的壁纸。\n\
  \n### 87.6 预览动态颜色\n\n动态颜色行为也可以在 Android Studio 布局编辑器中预览。要尝试此操作，打开 `activity_main.xml`\
  \ 文件，点击主题菜单，并像图 87-8 所示选择 `More Themes` 选项：\n\n![](img/as_theme_menu.jpg)\n\n图 87-8\n\
  \n接下来，使用主题选择对话框中的搜索字段列出动态主题：\n\n![](img/as_theme_selection.jpg)\n\n图 87-9\n\n在点击\
  \ `OK` 按钮之前，选择 `Material3.DynamicColors.DayNight` 主题。返回布局编辑器后，选择 `System UI Mode`\
  \ 菜单并像图 87-10 所示选择其中一个壁纸选项：\n\n![](img/as_layout_wallpapers.jpg)\n\n图 87-10\n\n\
  一旦选择了壁纸，布局中组件的颜色将随之发生变化。\n\n### 87.7 总结\n\n在本章中，我们利用 `Material Theme Builder` 设计了一个新主题，并解释了将生成的主题文件集成到\
  \ Android Studio 项目中的步骤。最后，本章演示了如何实现和使用 `Material You` 动态颜色功能。\n\n## 88. Android\
  \ Studio 中的 Gradle 概述\n\n到为止，人们在大多数情况下认为 Android Studio 会采取必要的步骤来编译和运行所创建的应用项目。Android\
  \ Studio 一直在后台使用一个名为 `Gradle` 的系统来实现这一点。\n\n现在是时候查看如何使用 `Gradle` 来编译和打包应用项目中的各种元素，并开始探索在\
  \ Android Studio 中构建项目有更高级需求时如何配置此系统。\n\n### 88.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，它允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义如何构建项目、项目成功构建需要满足哪些依赖，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令的环境，可以通过插件集成到其他环境中。在 Android\
  \ Studio Case 中，`Gradle` 集成是通过命名恰当的 `Android Studio Plugin`提供的。\n\n尽管 Android Studio\
  \ 插件允许在 Android Studio 内部启动和管理 `Gradle` 任务，但仍可以使用 `Gradle` 命令行封装构建基于 Android Studio\
  \ 的项目，包括在未安装 Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 `Groovy` 编程语言的 `Gradle` 构建文件和脚本中。\n\
  \n### 88.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android 项目带来了许多强大功能。一些关键功能如下：\n\
  \n#### 88.2.1 合理的默认值\n\n`Gradle` 实现了一种被称为“约定优于配置”（`convention over configuration`）的概念。这简单意味着\
  \ `Gradle` 有了一组预定义的合理默认配置设置，除非它们被构建文件中的设置覆盖，否则将使用它们。这意味着可以使用开发者所需的少配置执行构建。只有当默认配置不能满足您的构建需求时，才需要更改构建文件。\n\
  \n#### 88.2.2 依赖\n\n`Gradle` 功能的另一个关键领域是依赖。例如，考虑 Android Studio 项目中的一个模块，它触发一个意图来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖，因为如果找不到第二个模块，应用程序将无法构建。这种依赖可以在第一个模块的\
  \ Gradle 构建文件中声明，以便包含第二个模块。依赖的其他示例是项目编译和运行依赖的库和 `JAR` 文件。\n\n`Gradle` 依赖可以分为本地和远程。本地依赖引用执行构建的计算机系统本地文件系统中的项。远程依赖引用远程服务器（通常称为仓库）上的项。\n\
  \nAndroid Studio 项目使用另一个名为 `Maven` 的项目管理工具来处理远程依赖。如果在 Gradle 构建文件中使用 Maven 语法声明了远程依赖，则该依赖将从指定的仓库下载并包含在构建过程中。例如，以下依赖声明会将\
  \ `AppCompat` 库添加到项目中：\n\n```\nimplementation 'androidx.appcompat:appcompat:1.6.0'\n\
  ```\n\n#### 88.2.3 构建变体\n\n除了依赖之外，`Gradle` 还为 Android 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行在许多设备上，涵盖各种处理器类型和屏幕尺寸。为了针对尽可能广泛设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个用于手机界面，另一个用于平板电脑屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可以实现的。\n\n#### 88.2.4 清单条目\n\n每个 Android Studio 项目都关联有一个\
  \ `AndroidManifest.xml` 文件，包含有关应用的配置细节。可以在 Gradle 构建文件中指定许多清单条目，这些项会在构建项目时自动生成到清单文件中。此功能与构建变体功能互补，允许为每个构建变体配置不同的应用版本号、应用\
  \ ID 和 SDK 版本信息等元素。\n\n#### 88.2.5 APK 签名\n\n\n\n\n\n标题为创建、测试和上传 Android App Bundle\
  \ 的章节涵盖了如何使用 Android Studio 环境创建签名的发布版 APK 文件。此外，你也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，以便能够从命令行生成签名的 APK 文件。\n\n#### 88.2.6 ProGuard 支持\n\n`ProGuard`\
  \ 是 Android Studio 附带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更具高效性且更难被反向工程（反向工程是指他人通过分析编译后的\
  \ Java 字节码来识别应用程序逻辑的方法）。`Gradle` 构建文件提供了在构建应用时控制是否对该应用运行 `ProGuard` 的功能。\n\n###\
  \ 88.3 属性和设置 Gradle 构建文件\n\n`gradle` 构建配置由一组配置、属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含晦涩的设置，这些设置与 Java 虚拟机 (`JVM`) 使用的命令行标志、项目是否使用 `AndroidX` 库以及 `Kotlin` 编码风格支持有关。作为典型用户，你不太可能需要更改此文件中的任何设置。\n\
  \n另一方面，`settings.gradle` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时搜索哪些在线仓库，以及项目名称。典型的 `settings.gradle`\
  \ 文件内容如下：\n\n```\npluginManagement {\n    repositories {\n        gradlePluginPortal()\n\
  \        google()\n        mavenCentral()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，不太可能需要对此文件进行更改。\n\
  \n### 88.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含构建 Android 应用所需的所有内容，由模块、库、清单文件和\
  \ `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle` 构建文件。该文件列为 `build.gradle` (项目: `<project\
  \ name>`），可以在项目工具窗口中找到，如图 88-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\n\
  图 88-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```\n// 顶层构建文件，你可以在此处添加适用于所有子项目/模块的配置选项。\n\
  plugins {\n    id 'com.android.application' version '7.3.0' apply false\n    id\
  \ 'com.android.library' version '7.3.0' apply false\n}\n\ntask clean(type: Delete)\
  \ {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件仅的作用是声明使用 `jcenter` 仓库获取远程库，并且构建依赖于\
  \ Gradle 的 Android 插件。在大多数情况下，没有必要对此构建文件进行任何更改。\n\n### 88.5 模块级 Gradle 构建文件\n\n\
  一个 Android Studio 应用项目由一个或多个模块组成。例如，有一个名为 `GradleDemo` 的假设应用项目，它分别包含两个名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要它们自己的 `Gradle` 构建文件。在项目结构方面，这些文件的位置如下：\n\n- `Module1/build.gradle`\n\
  - `Module2/build.gradle`\n\n默认情况下，`Module1/build.gradle` 文件将类似于下面的列表：\n\n```\nplugins\
  \ {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n   \
  \     viewBinding true\n    }\n    namespace 'com.ebookfrenzy.fragmentexample'\n\
  \    compileSdk 33\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.fragmentexample\"\
  \n        minSdk 26\n        targetSdk 33\n        versionCode 1\n        versionName\
  \ \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefault('proguard-optimize.txt'), 'proguard-rules.pro'\n\
  \        }\n    }\n}\n\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n\
  \    targetCompatibility JavaVersion.VERSION_1_8\n}\n\ndependencies {\n    implementation\
  \ 'androidx.appcompat:appcompat:1.6.0'\n    implementation 'com.google.android.material:1.7.0'\n\
  \    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    testImplementation\
  \ 'junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'\n}\n\
  ```\n\n\n\n\n\n```gradle\nstorePassword \"your keystore password here\"\nkeyAlias\
  \ \"your key alias here\"\nkeyPassword \"your key password here\"\n}\n}\nbuildTypes\
  \ {\n.\n.\n.\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的替代方案是从系统环境变量提取这些值：\n\n```gradle\n\
  signingConfigs {\n    release {\n        storeFile file(\"keystore.release\")\n\
  \        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your\
  \ key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n\
  ```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n    release\
  \ {\n        storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLIne(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 88.7 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个 Gradle 包装工具（wrapper），其目的是允许从命令行调用\
  \ Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该包装器在 Windows 系统上可以直接执行，但在 Linux 和 macOS 上使用之前，可能需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要该包装器的项目文件夹，并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将文件路径添加到你的 `$PATH` 环境变量中，或者在名称前加缀\
  \ `./` 来运行。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle 将项目构建视为许多不同的任务。可以通过在项目目录内运行以下命令来获取当前项目可用任务的完整列表（如果是在\
  \ macOS 或 Linux 上运行，请记住在命令前加缀 `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版（debug\
  \ release），请使用 `assembleDebug` 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本（release\
  \ version）：\n\n```bash\ngradlew assembleRelease\n```\n\n### 88.8 总结\n\n在大多数情况下，Android\
  \ Studio 在后台执行应用程序构建，无需开发人员干预。此构建过程使用 Gradle 系统处理，它是一个自动化构建工具包，允许通过一组构建配置文件对项目的构建方式进行配置和管理。虽然\
  \ Gradle 的默认行为可以满足许多基础项目构建需求，但对于更复杂的项目，配置构建过程的需求是不可避免的。本章概述了 Android Studio 项目背景下的\
  \ Gradle 构建系统和配置文件。\n\n## 索引\n\n### 符号\n- `<application>` [428]\n- `<fragment>`\
