  \n\n\n\n\nAndroid 包含一组 Intent，旨在将存储访问框架（Storage Access Framework）的功能集成到 Android\
  \ 应用程序中。这些 Intent 向用户显示存储访问框架的选择器用户界面，并通过调用启动该 Intent 的 Activity 的 `onActivityResult()`\
  \ 方法将交互结果返回给应用程序。当 `onActivityResult()` 方法被调用时，它将接收到所选文件的 `Uri` 以及一个指示操作是否成功与否的值。\n\
  \n存储访问框架 Intent 可总结如下：\n\n• `ACTION_OPEN_DOCUMENT` – 为用户提供访问选择器用户界面的权限，以便从设备上配置的文档提供者中选择文件。所选的文件将以\
  \ `Uri` 对象的格式传回应用程序。\n• `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供者存储器上的位置以及新文件的文件名。一旦完成选择，存储访问框架将创建该文件，并将该文件的\
  \ `Uri` 返回给应用程序进行后续处理。\n\n## 68.3 过滤选择器中的文件列表\n\n在启动 Intent 时，选择器用户界面中列出的文件可以使用多种选项进行过滤。例如，请考虑以下用于配置\
  \ `ACTION_OPEN_DOCUMENT` Intent 的代码：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动后，上述 Intent 将导致显示选择器用户界面，允许用户浏览并选择由可用文档提供者托管任何文件。一旦用户选择了文件，应用程序将以 `Uri`\
  \ 对象的形式获得该文件的引用。应用程序随后可以使用 `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，并非所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 Intent，从而在选择器中排除此类文件。例如：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n现在当 Intent 显示时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许按文件类型来限制可供选择的文件。这涉及指定应用程序能够处理的文件类型。例如，一个图像编辑应用程序可能只想为用户提供从文档提供者选择图像文件的选项。这是通过配置\
  \ Intent 对象，指定用户可选的文件的 MIME 类型来实现的。例如，以下代码指定了仅图像文件适用于选择器中的选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步细化以限制选择 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，一个音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能会被进一步限制为仅支持播放基于 MP4 的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在使用存储访问框架工作时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上查找到：\nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理 Intent 结果\n\n由于我们启动的是会返回结果的 Intent，需要使用 `registerForActivityResult()`\
  \ 方法（在标题为 Android Explicit Intents – A Worked Example 的章节中介绍）来创建一个启动器并声明一个处理返回数据的\
  \ lambda 表达式，例如：\n\n```java\nActivityResultLauncher<Intent> startOpenForResult =\
  \ registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 从 Uri 此处读取文件内容\n            }\n        }\n    });\n```\n\n一旦声明，可以按照如下方式配置并启动\
  \ Intent：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\nintent.setType(\"text/plain\");\n\
  startOpenForResult.launch(intent);\n```\n\n### 68.5 读取文件内容\n\n读取文档提供者托管的文件内容所需的确切步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示该文件是为了读取而打开的。其他选项是用于写访问的“w”以及用于读写的“rwt”，其中文件中的现有内容会被新内容截断。\n\
  \n读取文本文件的内容需要稍多工作，并使用 `InputStream`。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream inputStream\
  \ = getContentResolver().openInputStream(uri);\nBufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(inputStream));\nString readline;\nwhile ((readline = reader.readLine())\
  \ != null) {\n    // 对文件的每行进行操作\n}\ninputStream.close();\n```\n\n### 68.6 向文件写入内容\n\
  \n向文档提供者托管的打开文件写入内容与读取类似，区别是使用了输出流。例如，以下代码向指定的输出流写入文本：\n\n```java\ntry {\n    ParcelFileDescriptor\
  \ pFileDescriptor = this.getContentResolver().openFileDescriptor(uri, \"w\");\n\
  \    FileOutputStream fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n### 68.7 删除文件\n\n是否可以从存储器中删除文件取决于文件的文档提供者是否支持删除文件。假设允许删除，可以在指定的 Uri 上执行删除：\n\
  \n```java\nif (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n\
  \    // 删除成功\n} else {\n    // 删除失败\n}\n```\n\n### 68.8 获取文件的持久访问权限\n\n\n\n\n当应用通过\
  \ `Storage Access Framework` 访问文件时，该访问权限将一直有效，直到运行该应用的 Android 设备重启。可以通过“获取” `Uri`\
  \ 需的必要权限来获得对特定文件的持久访问权限。例如，以下代码为 `fileUri` Uri 实例所引的文件持久化了读取和写入权限：\n\n```java\n\
  final int takeFlags = intent.getFlags()\n                & (Intent.FLAG_GRANT_READ_URI_PERMISSION\n\
  \                | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\n\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用获取了文件的权限，且假设 `Uri` 已被应用保存，那么在设备重启后，用户应该应该能够继续访问该文件，而无需用户从文件选择器界面重新选择文件。\n\
  \n如果在任何时候不再需要这些持久化权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法来释放它们：\n\
  \n```java\nfinal int releaseFlags = intent.getFlags()\n                & (Intent.FLAG_GRANT_READ_URI_PERMISSION\n\
  \                | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\n\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 68. 总结\n\n思考近年来对存储的感知发生了什么变化很有趣。“存储”一词曾是大容量内置硬盘的同义词，而现在它同样可能指代托管在云端并通过互联网连接访问的存储空间。随着资源受限、内部存储容量最小的“始终连接”移动设备的广泛普及，这种情况变得日益普遍。\n\
  \n`Android Storage Access Framework` 为用户和应用开发者提供了一种无缝访问存储在云端文件的简单机制。通过使用一组 Intent\
  \ 以及用于选择文档提供程序和文件的内置用户界面，现在可以使用少量代码在 Android 应用中集成全面的云存储。\n\n# 69. Android Storage\
  \ Access Framework 示例\n\n如前所述，`Storage Access Framework` 极大地简化了将云存储访问集成到 Android\
  \ 应用中的过程。通过包含一个选择器用户界面和一组新的 Intent，现在可以相对容易地在 Android 应用中构建对 `Google Drive` 和 `Box`\
  \ 等文档提供程序上的文件访问。在前面的章节中介绍了 `Android Storage Access Framework` 的基础知识后，本章将通过创建一个示例应用，该应用使用\
  \ `Storage Access Framework` 来存储和管理文件。\n\n## 69.1 关于 Storage Access Framework 示例\n\
  \n本章创建的 Android 应用将以原始文本编辑器的形式存在，旨在创建文本文件并远程存储到云存储服务中。在实践中，该示例适用于任何兼容 `Storage Access\
  \ Framework` 的云端文档存储提供程序，但为了本示例的目的，假设使用了 `Google Drive`。\n\n从功能角度来说，该应用将向用户展示一个多行文本视图，可以在其中输入和编辑文本，以及一组允许创建、打开和保存基于存储的文本文件的按钮。\n\
  \n## 69.2 创建 Storage Access Framework 示例\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `StorageDemo` 并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。按照第 [11.8 Migrating a Project to View Binding] 部分的常规步骤为项目添加视图绑定支持。\n\
  \n### 69.3 设计用户界面\n\n用户界面需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 `Project` 工具窗口中，导航到\
  \ `app -> res -> layout` 的 `activity_main.xml` 布局文件并双击将其加载到 `Layout Editor` 工具中。在工具的\
  \ `Design` 模式下，选择并删除 `Hello World!` `TextView` 对象。\n\n将 `Button` 组件拖动并放置在布局左左角，在放置组件之前出现左侧和顶部的虚线边距指南。放置第二个\
  \ `Button`，使中心和顶部的边距指南出现。第三个 `Button` 组件应放置在顶部和右侧的边距指南出现的位置。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个\
  \ `Plain Text` 组件，使其水平居中并位于中间 `Button` 下方，以便用户界面布局与[图 69-1]所示一致。使用 `Layout Editor`\
  \ 工具栏中的 `Infer Constraints` 按钮添加任何缺失的约束。\n\n选择布局中的 `Plain Text` 组件，删除当前的文本属性设置，使字段初始为空白，并将\
  \ `ID` 设置为 `fileText`。接下来，将字符串属性提取为命名为 `string`、`open_string` 和 `save_string` 的资源值。\n\
  \n图 69-1 使用 `Attributes` 工具窗口，配置 `Button` 组件上的 `onClick` 属性以分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 方法。\n\n### 69.4 添加启动器\n\n按照“Android Intents – Worked Example”章节概述的步骤，我们需要开始注册\
  \ Activity 启动器以处理文件内容的创建、打开和保存。在 `MainActivity.java` 中，为三个操作中的每个操作添加一个启动器，如下：\n\n\
