  \ position) {\n    holder.mIdView.setText(mValues.get(position).id);\n    holder.mContentView.setText(mValues.get(position).website_name);\n\
  }\n```\n\n\n\n\n\n```java\nClipData.Item clipItem = new ClipData.Item(mValues.get(position).id);\n\
  \nClipData dragData = new ClipData(\n    ((PlaceholderContent.PlaceholderItem) v.getTag()).website_name,\n\
  \    new String[]{ClipDescription.MIMETYPE_TEXT_PLAIN},\n    clipItem\n);\n```\n\
  \n## 51.9 添加 Manifest 权限\n\n最后一步是通过清单文件为应用程序添加互联网权限。这将允许 `WebView` 对象能够访问互联网并下载网页。在\
  \ Project 工具窗口中（app -> manifests）中导航并加载 `AndroidManifest.xml` 文件，然后双击它将其加载到编辑器中。加载后，在文件中添加适当的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.PrimaryDetailflow\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n```\n\n### 51.10 运行应用程序\n\n在配置适当的模拟器或连接的\
  \ Android 设备上编译并运行应用程序。根据显示器的大小，应用程序将以小屏模式或双窗模式显示。无论如何，主列表都应预先显示内容模型中定义的三个网站名称。选择一个项目将导致相应的网站出现在详情面板中，如图\
  \ 51-6 中的双窗模式所示：\n\n![](img/as_detail_flow_running.jpg)\n\n图 51-6\n\n注意，构建可能会出现以下错误：\n\
  \n`Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt found in modules jetified-kotlin-stdlib-1.8.0`（等等，原文显示\
  \ `found in modules jetified-kotlin-stdlib-1.8.0`）\n\n要修复此错误，请编辑 `build.gradle`\
  \ (Module: app) 文件，添加以下依赖项，并同步且重建项目：\n\n```gradle\ndependencies {\n    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.0'))\n\
  }\n```\n\n## 51.11 总结\n\n主/详情用户界面由一个主列表组成，当选择某个项时，详情面板会显示有关该选择的额外信息。主/详情流（Primary/Detail\
  \ Flow）是 Android Studio 提供的一个模板，允许快速且方便地创建主/详情布局。正如本章所示，通过对默认模板文件进行细微修改，可以用极少的代码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 52. Android 服务概览\n\nAndroid `Service` 类专门设计用于允许应用程序启动并执行后台任务。与广播接收器不同（广播接收器旨在快速执行任务后退出），服务被设计用于执行完成耗时较长的任务（例如通过互联网连接下载文件或向用户流式传输），但它们不需要用户界面。\n\
  \n在本章中，将概述可用的不同类型的服务，包括绑定服务（bound services）和意图服务（intent services）。介绍这些基础知识后，后续章节将介绍服务的运行示例。\n\
  \n### 52.1 Intent Service\n\n如前所述，服务默认在与启动它的组件相同的主线程中运行。因此，服务需要执行的任何 CPU 密集型任务都应该在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个便利类（继承自 `Service` 类），它设置了一个工作线程来处理后台任务，并以异步方式处理每个请求。一旦服务处理了所有队列请求，它就会直接退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，其中包含为每个请求要执行的代码。\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐选项。然而，需要同步处理请求的服务需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n### 52.2\
  \ Bound Service\n\n绑定服务允许启动组件与服务交互并从其接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨进程边界进行。例如，一个 `activity`\
  \ 可能会启动一个服务来处理音频播放。该 `activity` 可能包含一个用户界面，为用户提供暂停播放或跳到下一曲曲目的控件。同样，服务很可能需要向调用的 `activity`\
  \ 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一曲目的详细信息。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。\n\n（注：由于原文 52.2 节存在大量重复内容，已清理冗余块以确保核心内容清晰并保持必要的技术信息。）\n\n### 52.3\
  \ 服务的结构\n\n如提到的，服务必须被创建为 Android `Service` 类（更具体说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）的子类。在继承过程中，取决于所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时调用此方法。绑定服务不需要实现此方法。\n- `onBind()` – 当组件绑定到服务时调用。在实现绑定服务时，此方法必须返回一个\
  \ `IBinder` 对象以促进与客户端的通信。\n- `onCreate()` – 旨在执行初始化任务，此方法在调用 `onStartCommand()`\
  \ 或第一次调用 `onBind()` 方法之前立即调用。\n- `onDestroy()` – 在服务被销毁时调用。\n- `onHandleWork()`\
  \ – 仅适用于 `JobIntentService` 子类。此方法被调用以处理服务的逻辑。它在独立于主应用程序的线程中执行。\n\n\n\n\n\n注意，`IntentService`\
  \ 类包含了其对 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要重新实现这些方法。\n\n## 52.4 控制已毁的服务的重启选项\n\
  \n`onStartCommand()` 回调方法需要返回一个整数值，以定义当服务被 Android 运行时系统销毁时应对服务执行什么操作。这些方法的可能的返回值如下：\n\
  \n*   `START_NOT_STICKY` – 告诉系统，如果服务被销毁，除非有等待交付的意图（intent），否则不应重启服务。\n*   `START_STICKY`\
  \ – 表示如果服务在 `onStartCommand()` 方法返回后被销毁，则应在销毁后尽快重启。如果没有等待交付的意图，则调用 `onStartCommand()`\
  \ 回调方法并传入 `NULL` 意图值。服务销毁时正在处理的意图将被丢弃。\n*   `START_REDELIVER_INTENT` – 表示如果服务在从\
  \ `onStartCommand()` 回调方法返回后被销毁，则重启服务，并将当前意图重新传递给 `onStartCommand()` 方法，随后再传递任何等待中的意图。\n\
  \n## 52.5 在 Manifest 文件中声明服务\n\n为了使服务可用，必须先在 manifest 文件中声明。这涉及在现有的 `<application>`\
  \ 条目中嵌入一个配置相应的 `<service>` 元素。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下 XML 片段所示：\n\n\
  ```xml\n<manifest>\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\" >\n      <activity\n          android:label=\"\
  @string/app_name\"\n          android:name=\".MainActivity\" >\n          <intent-filter>\n\
  \            <action android:name=\"android.intent.action.MAIN\" />\n          \
  \  <category android:name=\"android.intent.category.LAUNCHER\" />\n          </intent-filter>\n\
  \      </activity>\n      <service android:name=\".MyService\">\n      </service>\n\
  \  </application>\n</manifest>\n```\n\n默认情况下，服务被声明为公共，这意味着它们可以被其所在应用程序包之外的组件访问。要将服务设为私有，必须在\
  \ manifest 文件的 `<service>` 元素内将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n\
  <service android:name=\"MyService\"\n         android:exported=\"false\">\n</service>\n\
  ```\n\n在使用 `JobIntentService` 时，manifest 服务声明还必须如下所示请求 `BIND_JOB_SERVICE` 权限：\n\n\
  ```xml\n<service\n    android:name=\".MyJobIntentService\"\n    android:permission=\"\
  android.permission.BIND_JOB_SERVICE\" />\n```\n\n如前所述，默认情况下服务在与调用组件相同的进程中运行。要强制服务运行在自己的进程中，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个以冒号（`:`）开头的进程名称：\n\n```xml\n<service\
  \ android:name=\".MyService\"\n    android:exported=\"false\"\n    android:process=\"\
  :myprocess\">\n</service>\n```\n\n冒号前缀表示新进程是本地应用程序私有的。但是如果进程名称以小写字母而不是冒号开头，该进程将是全局的，供其他组件使用。\n\
  \n最后，通过使用与活动（activity）相同的意图过滤器机制，服务也可以向运行在设备上的其他应用程序发布其功能。关于意图过滤器的更多细节，请参阅标题为 \"\
  Android 意图概述 的章节。\n\n## 52.6 启动系统启动时运行的服务\n\n鉴于服务的后台性质，在 Android 系统首次启动时需要启动某个服务并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver），并配置意图过滤器以监听系统 `android.intent.action.BOOT_COMPLETED` 意图来实现。当检测到此类意图时，广播接收器只需调用必要的服务然后返回。注意，为了运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 52.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，即使启动它的组件被销毁，它也会继续运行。\n\
  \n服务继承自 Android Service 类。绑定服务（Bound services）为其他组件提供了通信接口，并且通常会一直运行直到最后一个客户端从服务取消绑定为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和线程中本地运行。远程服务（Remote services）可以通过对应用程序 manifest 文件中相应的 `<service>`\
  \ 条目进行细小的配置更改来启动。\n\n`IntentService` 类（本身是 Android Service 的子类）提供了一种方便的机制，用于在单独的工作线程中处理异步服务请求。\n\
  \n到本书的这个阶段，应该已经清楚 Android 应用程序由一个或多个活动组成。然而，一个尚未详细介绍的领域是一个活动如何触发另一个活动的机制。正如标题为 “应用程序剖析\
  \ 的章节中简述过的，这主要是通过使用意图（Intents）实现的。\n\n## 53. 意图概述\n\n本章的目标是以显式意图（explicit intents）和隐式意图（implicit\
  \ intents）的形式提供意图概述，并介绍意图过滤器（intent filters）。\n\n### 53.1 意图概述\n\n意图（`android.content.Intent`）是一个活动可以启动另一个活动的消息系统。例如，一个活动可以发布一个意图来请求启动应用程序内的另一个活动。然而，意图还超越了这一概念，允许活动请求设备上任何已配置权限的适当注册的活动的服务。考虑一个应用程序中需要加载并向用户显示网页的活动。与其让应用程序包含一个第二个活动来执行此任务，代码可以只需向\
  \ Android 运行时发送一个意图，请求任何注册了显示网页能力的活动。运行时系统会将请求与设备上的可用活动进行匹配，并启动匹配的活动，或者在存在多个匹配的情况下允许用户决定使用哪个活动。\n\
  \n意图还允许将数据从发送活动传输到接收活动。在之前描述的场景中，发送活动需要将要显示的网页的 URL 发送给第二个活动。同样，接收活动也可以配置为完成所需任务后将数据返回给发送活动。\n\
  \n虽然在后面的章节中才会介绍，但值得强调的是除了启动活动外，意图还用于启动和通信服务以及广播接收器。\n\n意图分为显式和隐式。\n\n### 53.2 显式意图\n\
  \n\n\n\n\n显式意图（Explicit intent）通过引用目标 Activity 的组件名称（实际上是类名）来请求启动特定的 Activity。当发送\
  \ Activity 与目标 Activity 位于同一个应用程序时，这种方法最为常见（因为应用程序开发者知道该类名）。\n\n显式意图是通过创建一个 `Intent`\
  \ 类的实例发出的，并传入 Activity 的上下文（context）和要启动的 Activity 的组件名称。然后调用 `startActivity()`\
  \ 方法并将 `intent` 对象作为参数传递。例如，以下代码段发布了一个启动类名为 `ActivityB` 的 Activity 的意图：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n可以通过调用\
  \ `intent` 对象的 `putExtra()` 方法，在启动它之前将数据添加到 `intent` 对象中，从而将其传输到接收的 Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别使用键\
  \ `myString` 和 `myInt` 向意图添加了字符串和整数（integer）值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标 Activity 作为 `Bundle`\
  \ 对象的一部分接收数据，该对象可以通过调用 `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()`\
  \ 方法返回启动 Activity 的意图，而 `Intent` 类的 `getExtras()` 方法返回一个包含数据的 `Bundle` 对象。例如，提取传递给\
  \ `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\nif (extras\
  \ != null) {\n    String myString = extras.getString(\"myString\");\n    int myInt\
  \ = extras.getInt(\"myInt\");\n}\n```\n\n当在同一个应用程序内使用意图启动其他 Activity 时，必须在应用程序清单文件（application\
  \ manifest file）中列出这些 Activity。以下 `AndroidManifest.xml` 内容对于包含名为 `ActivityA` 和 `ActivityB`\
  \ 的应用程序是配置正确的：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.intent1.intent1\"\
  \ >\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <activity\n            android:label=\"@string/app_name\"\
  \n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\" >\n   \
  \         <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n### 53.3 从 Activity\
  \ 返回数据\n\n如上一节示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个 Activity（我们将其称为 `ActivityA`）。然而，可以通过将\
  \ `ActivityB` 启动为 `ActivityA` 的子 Activity（sub-activity）来实现。通过创建 `ActivityResultLauncher`\
  \ 实例来启动一个 Activity 作为子 Activity。通过调用 `registerForActivityResult()` 方法创建 `ActivityResultLauncher`\
  \ 实例，并以 lambda 形式传递一个回调处理程序。当子 Activity 返回时，该处理程序会被调用并传递返回的数据。一旦创建了 `ActivityResultLauncher`\
  \ 实例，就可以带有 `intent` 参数调用来启动子 Activity。创建 `ActivityResultLauncher` 实例的代码通常如下：\n\n\
  ```java\nActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器准备就绪，可以如下方式调用它并传递要启动的意图：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n要向父\
  \ Activity 返回数据，子 Activity 必须实现 `finish()` 方法，其目的是创建一个包含数据的新 `intent` 对象，然后调用封装\
  \ Activity 的 `setResult()` 方法，传递结果码和包含数据的意图。结果码通常为 `RESULT_OK` 或 `RESULT_ANCELED`，但也可以根据开发者的需求使用自定义值。如果子\
  \ Activity 崩溃，父 Activity 将接收到 `RESULT_ANCELED` 代码。例如，以下代码说明了典型的子 Activity `finish()`\
  \ 方法代码：\n\n```java\npublic void finish() {\n    Intent data = new Intent();\n  \
  \  data.putExtra(\"returnString1\", \"Message to parent activity\");\n    setResult(RESULT_OK,\
  \ data);\n    super.finish();\n}\n```\n\n### 53.4 隐式意图（Implicit Intents）\n\n显式意图引用要启动的\
  \ Activity 的类名，而隐式意图通过指定要执行的操作（action）和接收 Activity 处理的数据类型来识别 Activity。例如，`ACTION_VIEW`\
  \ 操作类型配合 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并启动一个具备浏览能力的 Activity。以下隐式意图在 Android\
  \ 设备上执行时，将导致指定的网页出现在浏览器 Activity 中：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当上述隐式意图由 Activity 发布时，Android 系统将搜索设备上能够处理 http 方案数据的 Activity，这一过程被称为意图解析。在系统使用隐式意图启动\
  \ Activity 之前，该 Activity 必须经过验证或由用户启用。如果未满足这些条件之一，将无法启动该 Activity。在探索这两个选项之前，我们首先需要讨论意图过滤器（intent\
  \ filters）。\n\n### 53.5 使用意图过滤器\n\n意图过滤器是 Activity 向 Android 意图解析过程宣告其支持的操作数据处理能力的机制。这些声明还包含了执行链接验证所需的设置。以下\
  \ `AndroidManifest.xml` 文件展示了名为 `MyWebView` 的应用中名为 `WebActivity` 的 Activity 的配置，其带有适当的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity\n        android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n```\n\n\n\n\n\n此清单文件配置了\
  \ `WebActivity` 活动，使其在响应来自另一个活动的隐式意图（implicit intent）时，如果意图包含 `https://www.ebookfrenzy.com`\
  \ URL，即可启动。例如，以下代码将启动 `WebActivity` 活动（假设用户已验证或启用了 `MyWebView` 应用的支持链接）：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_VIEW,\n        Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n\nstartActivity(intent);\n```\n\n## 53.6 自动链接验证\n\n在 Android 设备上使用网络链接启动活动被认为存在潜在的安全风险。为了最大限度地降低这种风险，用于启动意图的链接必须要么经过自动验证，要么由用户在设备上手动添加为支持链接。要启用自动验证，目标活动中相应的意图声明必须将\
  \ `autoVerify` 设置为 `true`，如下所示：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n...\n...\n</intent-filter>\n```\n\n接下来，需要将链接 URL 与应用链接所依据的网站关联。通过创建一个名为\
  \ `assetlinks.json` 的数字资产链接文件并将其安装在网站的 `.well-known` 文件夹中来实现。\n\n数字资产链接文件包含两个部分：一个关系声明，用于授予目标应用使用网站链接\
  \ URL 启动的权限；以及一个目标声明，用于声明配套应用的包名和对应该项目的 SHA-256 证书指纹。一个典型的资产链接文件内容可能如下：\n\n```json\n\
  [{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n  \"target\"\
  : {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"com.ebookfrenzy.mywebview\"\
  ,\n    \"sha256_cert_fingerprints\": [\n      \"<此处填写证书指纹>\"]\n    ]\n  }\n}]\n\
  ```\n\n注意，您可以手动创建此文件，也可以使用此处 URL 提供的在线工具生成：\n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n在处理 Android 开发时，`namespace` 值始终设置为 `\"android_app\"`，而 `package_name` 对应由意图启动的应用包名。最后，证书指纹是用于构建应用的哈希值。当您测试应用时，这将是包含在\
  \ `debug.keystore` 文件中的调试证书。Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  <您的用户名>\\.android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在以下位置找到文件：\n`$HOME/.android/debug.keystore`\n\
  \n一旦找到该文件，可以通过在终端或命令提示符窗口中运行以下命令获取 SHA 256 指纹：\n\n```bash\nkeytool -list -v -keystore\
  \ <此处填写 debug.keystore 文件的路径>\n```\n\n当提示输入密码时，输入 `\"android\"`，之后将出现包含 SHA 256\
  \ 指纹的输出：\n\n```\nCertificate fingerprints:\nSHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\n\
  SHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  ```\n\n当您准备好构建应用的发布版本时，您需要确保将发布版的 SHA 256 指纹添加到资产文件中。有关生成发布版密钥库文件的详细信息请参阅名为[创建、测试和上传\
  \ Android App Bundle]的章节。一旦拥有了发布版密钥库文件，请对其运行上述 `keytool` 命令以获取指纹。\n\n一旦您将数字资产文件放置在网站的正确位置，请在设备或模拟器上安装应用并等待\
  \ 30 秒以进行链接验证。要检查验证状态，请在命令或终端提示符中运行以下命令：\n\n```bash\nadb shell pm get-app-links\
  \ --user cur com.example.mywebview\n```\n\n输出结果应包含链接已验证的确认信息：\n\n```\ncom.example.mywebview:\n\
  \    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n      www.ebookfrenzy.com:\n        User: 0\n \
  \       Verification allowed: true\n        Selection state:\n        Disabled:\n\
  ```\n\n## 53.7 手动启用链接\n\n在无法自动验证链接的情况下，唯一的选择是请求用户手动启用链接。这涉及启动“默认设置”界面，用户可以在那里启用链接。由于突然出现“默认设置”界面可能会让普通用户困惑，建议在启动设置之前显示说明性对话框。\n\
  \n为了为用户提供手动启用链接的选项，在尝试启动意图之前需要执行以下代码：\n\n```java\n// 此处为显示需要启用链接的对话框的代码\nIntent\
  \ intent = new Intent(Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n        Uri.parse(\"\
  package:com.ebookfrenzy.mywebview\"));\nstartActivity(intent);\n```\n\n上述示例代码将显示目标应用\
  \ `MyWebView` 的默认设置界面，用户可以在那里点击添加链接按钮。点击后，将弹出一个带有 `intent` 中链接的对话框。可以通过勾选框进行启用。\n\
  \n## 53.8 检查意图可用性\n\n假设某个活动适用于特定的意图通常是不明智的，特别是因为缺少匹配的操作通常会导致应用程序崩溃。幸运的是，可以在将意图发送到运行时系统之前识别活动的可用性。可以使用以下方法识别特定意图类型的活动可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n   \
  \         packageManager.queryIntentActivities(intent,\n                PackageManager.MATCH_DEFAULT_ONLY);\n\
  \    return list.size() > 0;\n}\n```\n\n### 53.9 总结\n\n\n\n\n意图（Intent）是一个 Android\
  \ Activity 启动另一个 Activity 的消息机制。显式意图（Explicit intent）通过类名引用接收的 Activity 来引用要启动的特定\
  \ Activity。显式意图通常（但并非限于）用于启动同一应用程序内的 Activity。隐式意图（Implicit intent）指定要执行的操作和要处理的数据类型，并允许\
  \ Android 运行时找到匹配的 Activity 进行启动。隐式意图通常用于启动位于不同应用程序的 Activity。\n\n在使用隐式意图时，安全限制要求在启动意图之前，包含意图目标\
  \ Activity 的应用必须经过自动验证或由用户手动启用。自动验证涉及在链接 URL 对应的网站上放置数字资产链接文件（Digital Assets Link\
  \ file）。\n\nActivity 可以通过键值对的形式将数据封装在 `intent` 对象中，并发送给接收 Activity。只有当 Activity\
  \ 作为发送 Activity 的子 Activity 启动时，才能从其返回数据。\n\nActivity 通过在应用程序清单文件（manifest file）中指定意图过滤器（intent-filters），向\
  \ Android 意图解析过程宣告功能。发送和接收 Activity 都必须请求适当权限以执行诸如访问设备联系人数据库或互联网等任务。\n\n在介绍意图理论后，接下来的章节将通过在\
  \ Android Studio 中创建示例，将显式和隐式意图付诸实践。\n\n## 54. Android 显式意图 – 实例\n\n标题为 \"Android\
  \ 意图概述\" 的章节涵盖了使用意图启动 Activity 的理论。本章通过创建一个示例应用程序将该理论付诸实践。\n\n在本章创建的示例 Android Studio\
  \ 项目将演示使用显式意图启动 Activity，包括发送和接收 Activity 之间的数据传输。下一章 (Android 隐式意图 – 实例\") 将演示隐式意图的使用。\n\
  \n## 54.1 创建显式意图示例应用程序\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择\
