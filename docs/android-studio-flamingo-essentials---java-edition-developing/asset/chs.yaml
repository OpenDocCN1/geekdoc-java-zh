  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。按照节 11.8 将项目迁移到 View Binding 中列出的步骤，将项目转换为使用 view binding。\n\
