  \n## 75.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 内容简单方法。这些内容可以是由网站上托管的页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，支持以极少的代码要求进行打印。\n\
  \n当动态创建 HTML 内容（而不是加载和打印现有的网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view 客户端，在 HTML 加载到 `WebView` 完成后启动打印任务。在配置好 web view 客户端后，HTML 被加载到 `WebView`\
  \ 中，此时就会触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView\
  \ webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url)\n\
  \        {\n            return false;\n        }\n        @Override\n        public\
  \ void onPageFinished(WebView view, String url) {\n            createWebPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    String htmlDocument =\n\
  \        \"<html><body><h1>Android Print Test</h1><p>\"\n        + \"This is some\
  \ sample content.</p></body></html>\";\n    webView.loadDataWithBaseURL(null, htmlDocument,\
  \ \"text/HTML\", \"UTF-8\", null);\n    myWebView = webView;\n}\n```\n\n该方法的代码首先声明了一个名为\
  \ `myWebView` 的变量，其中存储方法中创建的 `WebView` 实例的引用。在 `printContent()` 方法中，创建一个 `WebView`\
  \ 类的实例，然后为其分配一个 `WebViewClient` 实例。一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\
  \n#### 75.7.3 打印网页\n\n打印网页涉及的步骤与上述步骤相似，区别在于向 web view 传递要打印的网页 URL，而不是动态创建的 HTML，例如：\n\
  \n```java\nmyWebView.loadUrl(\"https://developer.android.com/index.html\");\n```\n\
  \n还需要注意的是，`WebViewClient` 配置只有在网页加载后立即自动打印时才是必要的。如果打印是由用户在页面加载后选择菜单选项启动的，则需要在应用程序代码中包含上述的\
  \ `createWebJob()` 方法中的代码。\n\n#### 75.7.4 打印自定义文档\n\n虽然打印框架引入的 HTML 和图像打印功能为从 Android\
  \ 应用程序打印内容提供了简单路径，但显然这些选项对于更高级的打印需求来说过于简单。对于更复杂的打印任务，打印框架还提供了自定义文档打印支持。这允许将文本和图形的内容绘制到画布上然后打印。\n\
  \n这些步骤可以总结如下：\n\n* 连接到 Android 打印管理器\n* 创建一个子类自 `PrintDocumentAdapter` 类的自定义打印适配器\n\
  * 创建 `PdfDocument` 实例来表示文档页面\n* 获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个 `Canvas` 实例\n\
  * 在页面画布上绘制内容\n* 通知打印框架文档已准备好打印\n\n\n\n\n\n在上述步骤中概述的自定义打印适配器需要实现许多方法，Android 系统将在打印过程中过程中调用这些方法以执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户对纸张尺寸或页面方向等设置的更改重新排列文档布局；以及 `onWrite()` 方法，它负责渲染待打印的页面。该主题将在标题为“Android\
  \ 自定义文档打印指南”的章节中详细介绍。\n\n### 75.8 总结\n\nAndroid SDK 包含了从运行中的应用程序内部打印内容的能力。打印输出可以重定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 传输到云端。从 Android 应用开发者的角度来看，通过使用`Printing framework`，可以在应用程序中使用这些功能。到目前为止，实现起来最容易的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，更高级的打印可以使用该框架的自定义文档打印功能来实现。\n\n## 76. 一个 Android HTML 和 Web 内容打印示例\n\
  \n如前一章节“使用 Android 打印框架进行打印”所述，Android 打印框架可以用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序，为这两种打印选项提供清晰的说明。\n\
  \n### 76.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将`Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n### 76.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建一些 HTML\
  \ 内容，并以打印作业的形式发送给 `Printing framework`。\n\n首先，找到 `MainActivity.java` 文件（位于 Project\
  \ 工具窗口的 `app` -> `java` -> `com.ebookfrenzy.htmlprint` 下）并将其加载到编辑面板。加载后，修改代码使其读取方式如下所示：\n\
  \n```java\npackage com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.webkit.WebView;\n\nimport android.webkit.WebViewClient;\n\
  \nimport android.webkit.WebResourceRequest;\n\nimport android.print.PrintAttributes;\n\
  \nimport android.print.PrintDocumentAdapter;\n\nimport android.print.PrintManager;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ = \"<html><body><h1>Android Test</h1><p>This is sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithBase(null, htmlDocument, \"text/html\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n\n    private void createWebPrintJob(WebView\
  \ view) {\n        PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \        PrintDocumentAdapter printAdapter = view.createPrintDocumentAdapter(\"\
  MyDocument\");\n        String jobName = getString(R.string.app_name) + \" Print\
  \ Test\";\n        printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  \    }\n}\n```\n（注：原文中的代码块乱码或不完整；上述逻辑根据提供的文本描述进行了重构）。\n\n在上述步骤中概述的自定义打印适配器需要实现许多方法，Android\
  \ 系统将在打印过程中调用这些方法以执行特定任务。其中最重要的是 `onLayout()` 方法，它负责根据用户对纸张尺寸或页面方向等设置的更改重新排列文档布局；以及\
  \ `onWrite()` 方法，它负责渲染待打印的页面。该主题将在标题为“Android 自定义文档打印指南”的章节中详细介绍。\n\n提供的源文本在代码实现部分包含重复和乱码逻辑。我已经清理了散文，以符合指令中描述的逻辑流。\n\
  \n\n\n\n\n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Basic Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `WebPrint`，并指定 `com.ebookfrenzy.webprint` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为\
  \ `Java`。\n\n## 76.4 移除浮动操作按钮\n\n选择 `Basic Views Activity` 模板提供了上下文菜单和一个浮动操作按钮。由于应用程序不需要该浮动操作按钮，因此可以在继续操作之前将其移除。将\
  \ `activity_main.xml` 布局文件加载到 `Layout Editor`（布局编辑器）中，选择浮动操作按钮并按下键盘上的 `Delete` 键将该对象从布局中删除。编辑\
  \ `MainActivity.java` 文件，如下所示从 `onCreate` 方法中移除浮动操作按钮的代码：\n\n```java\n@Override\n\
