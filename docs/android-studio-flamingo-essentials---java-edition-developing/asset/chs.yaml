  \ `Drive` 选项，然后选择 `My Drive`（我的云端硬盘），导航到 Google Drive 存储空间中的合适位置以保存文件。在选择器界面底部的文本字段中，选择\
  \ `Save`（保存）选项之前，将名称从“newfile.txt”更改为合适的名称（但保留 `.txt` 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\
  \n图 69-3\n\n一旦创建新文件，应用程序应返回主活动，通知面板可能会出现显示“1 file uploaded”（已上传 1 个文件）的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 69-4\n\n此时，你应该能够在浏览器窗口中登录你的 Google Drive 账号，并在请求的位置找到新创建的文件。如果文件丢失，请确保运行应用程序的\
  \ Android 设备已连接到互联网。你也可以通过运行 Google Drive 应用来验证设备对 Google Drive 的访问权限，许多 Android\
  \ 设备默认安装了该应用，也可以从 Google Play 商店下载。\n\n现在我们已经创建了一个文件，在点击 `Save` 按钮之前，向文本区域输入一些文本。从选择器中选择之前创建的文本文件并将内容保存到文件中。返回应用程序后，删除文本并选择\
  \ `Open` 按钮，再次选择你保存的文件。当控制权返回应用程序时，文本视图应该已填充文本文件的内容。\n\n需要注意的是，如果 Android 设备缺乏活跃的互联网连接，`Storage\
  \ Access Framework`（存储访问框架）会将存储文件缓存在本地。然而，一旦重新建立连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，在浏览器窗口中登录你的\
  \ Google Drive 账号，导航到保存的文件并点击它查看内容，如果一切正常，内容应包含应用程序保存的文本。\n\n### 69.9 总结\n\n本章完成了一个\
  \ Android Studio 应用程序的示例，该程序是一个非常基础的文本编辑器，设计用于使用基于云的存储，通过 `Android Storage Access\
  \ Framework` 来创建、保存和打开文件。\n\n## 70 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\
  \n智能手机和平电脑的主要用途之一是提供在线内容的访问。一种被广泛使用的内容形式（尤其是在平板设备上）是视频。\n\nAndroid SDK 包含了两个类，使得在开发应用程序时在\
  \ Android 设备上实现视频播放变得极其简单。本章将提供这两个类——`VideoView` 和 `MediaController` 的概述，然后创建一个视频播放应用程序。\n\
  \n### 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android 应用程序中显示视频简单的方法是使用 `VideoView`\
  \ 类。这是一个视觉组件，当它被添加到活动的布局中时，它提供一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n* H.264\
  \ AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类有一系列可以调用的方法来管理视频播放。一些较常用的方法如下：\n\
  \n* `setVideoPath(String path)` – 指定要播放的视频媒体的路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地视频文件。\n\
  * `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但接受 `Uri` 对象作为参数而不是字符串。\n\
  * `start()` – 开始视频播放。\n* `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()`\
  \ – 返回一个布尔值，表示视频是否正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – Allows 在视频准备好播放时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)`\
  \ – 允许在视频播放期间发生错误时调用回调方法。\n* `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ – 允许在视频结束时调用回调方法。\n* `getDuration()` – 返回视频持续时间。除非在 `OnPreparedListener()` 回调方法内部调用，否则通常会返回\
  \ -1。\n* `getCurrentPosition()` – 返回表示当前播放位置的整数值。\n* `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控制控件。\n\n### 70.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过向 `VideoView` 实例附加一个\
  \ `MediaController` 类的实例来解决。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上后退/向前查找）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦附加并锚定，控件将在播放开始时短暂出现，此后用户可以通过点击锚定该实例的视图在任何时间点恢复控件。\n\
  \n该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定控制器要锚定的 `View`。这指定了控件在屏幕上的显示位置。\n\
  * `show()` – 显示控件。\n* `show(int timeout)` – 按指定的时间（毫秒）显示控件。\n* `hide()` – 向用户隐藏控件。\n\
  * `isShowing()` – 返回一个布尔值，表示控件当前是否可见。\n\n### 70.3 创建视频播放示例\n\n本章剩余部分将创建一个示例应用程序，使用\
  \ `VideoView` 和 `MediaController` 类播放 MPEG-4 文件。\n\n在欢迎界面选择 `New Project` 选项，在新项目对话框中选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `VideoPlayer`，并指定包名为\
  \ `com.ebookrenzy.videoplayer`。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API\
  \ 26: Android 8.0 (Oreo)`并将 `Language` 设置为 `Java`。\n\n### 70.4 设计 VideoPlayer 布局\n\
  \n主活动的界面将仅由一个 `VideoView` 类实例组成。使用 `Project` 工具窗口找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击打开，将 `Layout Editor` 工具切换到 `Design` 模式并删除默认的 `TextView` 组件。\n\n从 `Palette`\
  \ 面板的 `Widgets` 类别中将 `VideoView` 实例拖到布局中，使其填充可用画布区域，如图 70-1 所示。使用 `Attributes` 面板，将\
  \ `layout_width` 和 `layout_height` 属性分别更改为 `match_constraint` 和 `wrap_content`。此外，移除连接\
  \ `VideoView` 底到 `ConstraintLayout` 底部的约束。最后，将组件的 ID 更改为 `videoView1`。\n\n### 70.5\
  \ 下载视频文件\n\n`VideoPlayer` 应用将播放的视频是一个使用 MPEG-4 格式编码的短动画电影片段。使用网络浏览器导航到以下 URL 以播放视频：\n\
  \n\n\n\n\n[`www.ebookfrenzy.com/android_book/movie.mp4`](https://www.ebookfrenzy.com/android_book/movie.mp4)\n\
  \n在浏览器窗口内，右键点击视频播放区域，选择保存或下载视频到本地文件的选项，选择一个合适的临时文件系统位置，并将文件命名为 `movie.mp4`。\n\n\
  在 Android Studio 中，在 `Project` 工具窗口中找到 `res` 文件夹，右键点击它并选择 `New`（新建）-> `Directory`（目录）菜单选项，在名称字段中输入\
  \ `raw` 然后按 `Return` 键。使用操作系统的文件系统导航器找到上述下载的 `movie.mp4` 文件并复制。返回 Android Studio，右键点击新创建的\
  \ `raw` 目录并选择 `Paste`（粘贴）选项将视频文件复制到项目中。添加完成后，`raw` 文件夹应与 `Project` 工具窗口中的图 70-2\
  \ 相一致：\n\n![](img/as_3.6_video_player_raw_file_added.jpg)\n\n图 70-2\n\n### 70.6\
  \ 配置 VideoView\n\n下一步是使用要播放视频的路径配置 `VideoView`，然后开始播放。这主活动初始化时执行，因此将 `MainActivity.java`\
  \ 文件加载到编辑器并按照下面的代码列表进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\nimport\
  \ android.net.Uri;\n\n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        configureVideoView();\n\
  \    }\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        binding.videoView1.start();\n    }\n}\n```\n\n这段代码的作用是获取布局中 `VideoView`\
  \ 实例的引用，为其分配一个指向 `raw` 资源目录中电影文件的 `URI` 对象，然后开始播放视频。\n\n通过在模拟器或物理 Android 设备上运行应用程序来测试它。应用程序启动后，在播放开始之前，视频内容缓冲可能会有短暂延迟（图\
  \ 70-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\n图 70-3\n\n这展示了将视频播放集成到 Android\
  \ 应用中是多么简单。在本示例中到为止的所有内容都是通过一个 `VideoView` 实例和三行代码实现的。\n\n### 70.7 在 Video View\
  \ 中添加 MediaController\n\n按照目前 `VideoPlayer` 应用的状态，用户没有方法控制播放。如前所述，可以使用 `MediaController`\
  \ 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.videoplayer;\n\n.\n\n.\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n\n    private MediaController mediaController;\n.\n\n.\n\n    private\
  \ void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当实现这些更改并启动应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上层。这些控件应该包含一个进度条，以及快进、倒退和播放/暂停按钮。当控件从视图中退去后，可以通过再次点击\
  \ `VideoView` 画布随时恢复。只需多加三行代码，我们的视频播放器现在就有了如图 70-4 所示的媒体控件。\n\n### 70.8 设置 onPreparedListener\n\
  \n作为处理视频的最后一个示例，现在现在将扩展活动以演示 `onPreparedListener`。在这种情况下，将实现一个监听器将视频时长输出到 Logcat：\n\
  \n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport android.Log;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n\n    private MediaController mediaController;\n\n    String TAG = \"\
  VideoPlayer\";\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration = \"\
  \ + binding.videoView1.getDuration());\n        });\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n现在在视频播放开始之前，Logcat 面板中将出现如下所示的消息：\n\n`2023-05-04 16:41:42.867\
  \ 5723 VideoPlayer I Duration = 13504`\n\n### 70.9 总结\n\nAndroid 设备是交付内容的优秀平台，特别是视频媒体形式。如本章所述，Android\
  \ SDK 提供了两个类，即 `VideoView` 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用变得快速简单，通常只需要几行代码。\n\
  \n## 71 Android 画中画模式\n\n在之前的章节中讨论 Android 多任务处理时，曾简单提到画中画（PiP）模式，但没有详细介绍。画 模式主要用于视频播放，允许活动屏幕缩小并放置在屏幕上的任何位置。在这种状态下，活动继续运行，并且无论设备上运行其他哪些活动，该窗口都会保持可见。\n\
  \n本章将提供画中画模式的概述，并在下一章中为 VideoPlayer 项目添加画中画支持。\n\n\n\n\n\n图 71-2 显示了被用户点击后的 PiP\
  \ 模式窗口。在此模式下，窗口显示得更大，并在中心包含一个全屏操作按钮，点击该按钮会将窗口恢复到全屏模式；同时，右上角有一个退出按钮，用于关闭窗口并将应用程序置于后台。添加到\
  \ PiP 窗口的任何自定义操作也会在以此种模式显示时显示在屏幕上。在图 71-2 所示，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 71-2\n\n本章的剩余部分将概述如何在 Android 应用程序内部启用和管理 PiP 模式。\n\n### 71.2 启用画中画模式\n\nPiP\
  \ 模式目前仅支持运行 `API 26`：Android 8.0（Oreo）或更高版本的的设备。实现 PiP 模式的第一步是在项目的清单文件（manifest）中启用它。通过在每个需要\
  \ PiP 支持的 activity 元素中添加以下行，可以按 activity 配置 PiP 模式：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\"\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 启用了该 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该活动能够处理布局配置更改。如果没有此设置，每当 activity 进入或退出 PiP 模式时，activity 都会重启，导致在切换过程中视频从头开始重新播放。\n\
  \n### 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类来定义，可以使用 `Builder` 类创建其实例，如下所示：\n\
  \n```java\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder().build();\n\
  ```\n\n上述代码创建了一个带有定义特殊参数的默认 `PictureInPictureParams` 实例。也可以使用以下可选方法来自定义参数：\n\n-\
  \ `setActions()` – 用于定义在 activity 处于 PiP 模式时可以在 PiP 窗口内执行的操作。操作将在本章稍后的部分详细介绍。\n\
  - `setAspectRatio()` – 声明 PiP 窗口显示的首选宽高比。该方法接受一个包含高度/宽度/高度比例的 `Rational` 对象作为参数。\n\
  - `setSourceRectHint()` – 接收一个 `Rect` 对象作为参数，定义要在 PiP 窗口中显示的 activity 屏幕区域。\n\n\
  例如，下面的代码在 `PictureInPictureParams` 对象中配置了宽高比参数和操作参数。对于宽高比，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\
  \n```java\nRational rational = new Rational(videoView.getWidth(),\n            \
  \                       videoView.getHeight());\nPictureInPictureParams params =\n\
  \    new PictureInPictureParams.Builder()\n              .setAspectRatio(rational)\n\
  \              .setActions(actions)\n              .build();\n```\n\n一旦定义，可以随时使用\
  \ `setPictureInPictureParams()` 方法设置 PiP 参数，如下：\n\n```java\nsetPictureInPictureParams(params);\n\
  ```\n\n在进入 PiP 模式时也可以指定参数。\n\n### 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()`\
  \ 方法并传递 `PictureInPictureParams` 对象可以将 activity 置画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n\
  ```\n\n如果不需要参数，只需按照上一节所述创建一个默认的 `PictureInPictureParams` 对象。如果之前使用 `setPictureInPictureParams()`\
  \ 方法设置了参数，这些参数将与调用 `enterPictureInPictureMode()` 方法时指定的参数合并使用。\n\n### 71.5 检测画中画模式更改\n\
  \n当 activity 进入 PiP 模式时，隐藏任何不必要的视图以只显示视频是很。当 activity 重新进入屏幕模式时，需要恢复任何隐藏的界面组件。这些和其他模式切换任务可以通过重写\
  \ `onPictureInPictureChanged()` 方法来完成。\n\n```java\n@Override\npublic void onPictureInPictureChanged(boolean\
  \ isInPictureInMode) {\n    super.onPictureInPictureChanged(isInPictureInMode);\n\
  \    if (isInPictureInMode) {\n        // 进入了画中画\n    } else {\n        // 进入了全屏\n\
  \    }\n}\n```\n\n### 71.6 添加画中画操作\n\n当 PiP 窗口被用户点击时，画中画操作将作为图标出现。实现 PiP 是一个多步骤过程，从实现一种让\
  \ PiP 窗口通知 activity 已选择操作开始。这通过设置广播接收器（broadcast receiver）来实现。下面的代码片段演示了 `Intent`、`PendingIntent`\
  \ 和 `RemoteAction` 对象的创建：\n\n```java\nfinal ArrayList<RemoteAction> actions = new\
  \ ArrayList<>();\nIntent actionIntent = new Intent(\"MY_ACTION\");\nfinal PendingIntent\
  \ pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\n        REQUEST_CODE,\
  \ actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon = Icon.createResource(MyActivity.this,\n\
  \    R.drawable.action_icon);\n\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \    \"My Action Title\",\n    \"My Action Description\",\n    pendingIntent);\n\
  \nactions.add(remoteAction);\n\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n\
  \              .setActions(actions)\n              .build();\n\nsetPictureInPictureParams(params);\n\
  ```\n\n## 71.7 总结\n\n画中画模式（PiP mode）是 Android 8.0 引入的一项多任务功能，专门设计用于允许用户在其他应用程序和活动执行任务时，视频仍能在小窗口中继续播放。在使用\
  \ PiP 模式之前，必须首先在清单文件中为支持 PiP 的 activity 启用它。\n\n\n\n\n\n当用户点击 PiP 窗口时，PiP 操作将以图标的形式覆盖在窗口上。当选中这些操作时，它们会触发活动（activity）内部的行为。PiP\
  \ 窗口通过广播接收器（broadcast receivers）和等待意图（pending intents）通知活动 执行操作。\n\n## 72. Android\
  \ 画中画教程\n\n接上一章节，本章将对现有的 `VideoPlayer` 项目进行增强，以添加画中画（Picture-in-Picture）支持，包括检测\
  \ PiP 模式的变化，以及添加一个用于显示当前正在运行视频信息的 PiP 动作。\n\n## 72.1 在 Manifest 中添加画中画支持\n\n在 Android\
  \ 应用项目中添加 PiP 支持的第一步是在项目 Manifest 文件中启用它。打开 `manifests -> AndroidManifest.xml` 文件并修改\
  \ `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\".MainActivity\"\n\
  \  android:supportsPictureInPicture=\"true\"\n  android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n  android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n### 72.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ 活动的布局仅包含一个 `VideoView` 实例。现在将向布局中添加一个 `Button`，用于切换到 PiP 模式。将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，从调色板中拖入一个 `Button` 对象到布局中，使其位置如图 72-1 所示。\n\n![](img/as_video_pip_ui.jpg)\n\
  图 72-1\n\n更改按钮上的文本，使其显示为“Enter PiP Mode”（进入 PiP 模式），并将该字符串提取到名为 `enter_pip_mode`\
  \ 的资源中。在继续下一步之前，将按钮的 ID 改为 `pipButton` 并配置 `onClick` 属性以调用名为 `enterPipMode` 的方法。\n\
  \n### 72.3 进入画中画模式\n\n现在需要将 `enterPipMode` `onClick` 回调方法添加到 `MainActivity.java`\
  \ 类文件中。找到该文件，在代码编辑器中打开它并添加此方法：\n\n```java\nimport android.app.PictureInPictureParams;\n\
  import android.util.Rational;\n\npublic void enterPipMode(View view) {\n    Rational\
  \ rational = new Rational(binding.videoView1.getWidth(),\n            binding.videoView1.getHeight());\n\
  \    PictureInPictureParams params =\n            new PictureInPictureParams.Builder()\n\
  \                .setAspectRatio(rational)\n                .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n\
  \    binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView` 宽度和高度的 `Rational` 对象。随后，使用\
  \ `PictureInPictureParams` Builder 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比传递。由于视频在\
  \ PiP 模式下不需要显示按钮，因此将其设置为不可见。视频播放控件也会被隐藏，以确保视频视图在 PiP 模式下不会被遮挡。\n\n编译并在运行 Android\
  \ 版本 8 或更高版本的设备或模拟器上运行应用，在点击 PiP 模式按钮之前等待视频开始播放。视频应该最小化并如图 72-2 所示出现在 PiP 窗口中。\n\
  \n![](img/as_3.6_video_player_action_bar.jpg)\n图 72-2\n\n虽然视频现在于 PiP 窗口中播放，但大部分视图被标准的\
  \ Android 栏（action bar）遮挡了。要移除它，需要更改活动主题样式。在 Android Studio 中，找到并编辑 `app -> res\
  \ -> values -> themes -> themes.xml` 文件，修改 `AppTheme` 元素使用 `NoActionBar` 主题：\n\n\
  ```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- Base\
  \ application theme. -->\n    <style name=\"Theme.VideoPlayer\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\"\
  >\n        <!-- Primary brand color. -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n\
  ```\n\n对 `themes.xml (night)` 资源重复此步骤。编译并运行应用，将视频切换到 PiP 模式，注意操作栏不再出现在窗口中：\n\n![](img/as_pip_window.jpg)\n\
  图 72-3 点击 PiP 窗口，然后点击窗口中心出现的全屏标记。虽然活动返回了全屏模式，但注意按钮和媒体控件仍然保持隐藏状态。显然，需要在项目中添加一些代码来检测活动内何时发生了\
  \ PiP 模式切换。\n\n### 72.4 检测画中画模式\n\n正如上一章所述，PiP 模式的变化是通过重写受影响活动中的 `onPictureInModeChanged()`\
  \ 方法来检测的。在这种情况下，需要编写该方法，使其能够检测活动是正在进入还是退出 PiP 模式，并采取适当操作重新激活按钮和播放控件。在 `MainActivity.java`\
  \ 文件中，添加此方法：\n\n```java\n@Override\npublic void onPictureInModeChanged(boolean isInPictureInMode)\
  \ {\n    super.onPictureInModeChanged(isInPictureInMode);\n    if (isInPictureInMode)\
  \ {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n    \
  \    binding.videoView1.setController(mediaController);\n    }\n}\n```\n\n当该方法被调用时，会传入一个指示活动是否处于\
  \ PiP 模式的布尔值。上述方法仅根据此值决定是否显示 PiP 按钮。\n\n### 72.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加一个动作。该动作的目的是显示包含当前播放视频名称\
  \ Toast 信息。这需要 PiP 窗口与活动之间的通信。实现此点的简单方法之一是在活动内部实现一个广播接收器（broadcast receiver），并使用等待意图（pending\
  \ intent）从 PiP 窗口广播消息。这些步骤每次活动进入 PiP 模式时都需要执行，因此需要在 `onPictureInModeChanged()` 方法中添加代码。找到该方法，首先添加代码创建意图过滤器（intent\
  \ filter）并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\nimport\
  \ android.content.Context;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInModeChanged(boolean isInPictureInMode)\
  \ {\n        super.onPictureInModeChanged(isInPictureInMode);\n        if (isInPictureInMode)\
  \ {\n            IntentFilter filter = new IntentFilter();\n            filter.addAction(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n            receiver = new BroadcastReceiver()\
  \ {\n                @Override\n                public void onReceive(Context context,\
  \ Intent intent) {\n                    Toast.makeText(context, \"Favorite Home\
  \ Movie Clips\", Toast.LENGTH_LONG).show();\n                }\n            };\n\
  \            registerReceiver(receiver, filter);\n        } else {\n           \
  \ binding.pipButton.setVisibility(View.VISIBLE);\n        }\n    }\n}\n```\n\n\n\
  \n\n\n```java\nbinding.videoView1.setMediaController(mediaController);\n\nif (receiver\
  \ != null) {\n    unregisterReceiver(receiver);\n}\n}\n}\n```\n\n## 72.6 添加 PiP\
  \ 操作\n\n在实现广播接收器后，下一步是创建一个 `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。为了本示例演示，将使用一个名为\
  \ `ic_info_24dp.xml` 的图像图标文件。该文件可以在下 URL 提供的源码下载包 `project_icons` 文件夹中找到：[`www.ebookfrenzy.com/retail/flamingojava/index.php`](https://www.ebookfrenzy.com/retail/flamingojava/index.php)\n\
  \n找到此图标文件并将其复制粘贴到 Project 工具窗口中的 `app` -> `res` -> `drawables` 文件夹中：\n\n![](img/Image24491.jpg)\n\
  图 72-4\n\n下一步是创建一个发送给广播接收器的 `Intent`。然后，需要将此意 封装在 `PendingIntent` 对象中，以便在用户点击 PiP\
  \ 窗口中的操作按钮时触发该意图。\n\n编辑 `MainActivity.java` 文件，添加一个方法来创建 `Intent` 和 `PendingIntent`\
  \ 对象，如下：\n\n```java\nimport android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent =\n            new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n        final PendingIntent pendingIntent =\n            PendingIntent.getBroadcast(MainActivity.this,\n\
  \                REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n\
  现在 `Intent` 对象和包含它的 `PendingIntent` 实例都已创建，需要创建一个 `RemoteAction` 对象，其中包含要在 PiP 窗口中显示的图标以及\
  \ `PendingIntent` 对象。在 `createPipAction()` 方法中，按如下方式添加此代码：\n\n```java\nimport android.app.RemoteAction;\n\
