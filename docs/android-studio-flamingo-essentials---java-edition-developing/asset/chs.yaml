  \        fileOutputStream.close();\n        pfd.close();\n    } catch (IOException\
  \ e) {\n        e.printStackTrace();\n    }\n}\n```\n\n分配给 `startForResult()` 的\
  \ Lambda 表达式调用了名为 `writeFileContent()` 的方法，传递要写入文本的文件的 `Uri`。（见上文代码）。\n\n### 69.6\
  \ 打开并读取文件\n\n现在应用程序已经能够创建存储文件，下一步是添加将用户输入的任何文本保存到文件的功能。（注：此处原文内容与前文重复，已按逻辑整合）。\n\
