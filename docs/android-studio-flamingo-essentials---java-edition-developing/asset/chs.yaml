  Waiting\");\n    }\n}\n```\n\n### 59.13 调度任务\n\n最后一个领域涉及使用 `ExecutorService` 调度任务。这涉及到在\
  \ `ScheduledExecutorService` 上调用 `schedule()` 方法。\n\n```java\nScheduledExecutorService\
  \ executor = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n   \
  \ // 执行任务的代码\n};\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  ```\n\n\n\n然而，对于在 Android 6.0 或更高版本上运行的应用程序，某些权限需要额外的步骤才能正常工作。我们将在下一章中遇到这些所谓的“危险”权限中的第一个。不过，在到达这一点之前，本章将概述在最新版本的\
  \ Android 上运行时请求此类权限时涉及的步骤。\n\n### 60.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予权限以允许应用执行某些任务来强制执行安全性。在\
  \ Android 6 引入之前，权限总是在应用安装到设备时请求的。例如，图 60-1 显示了在通过 Google Play 安装应用时寻求各种权限的典型界面。\n\
  \n![](img/Image24253.jpg)\n\n图 60-1\n\n对于许多类型的权限，这种场景对于 Android 6.0 或更高版本上的应用仍然适用。这些权限被称为**普通权限**（normal\
  \ permissions），仍然需要在安装时由用户接受。第二类权限被称为**危险权限**（dangerous permissions），它们必须像普通权限一样在清单文件中声明，但在应用程序首次运行时也必须向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 60-2 所示：\n\n![](img/Image24342.jpg)\n\n图 60-2\n\n属于危险类别的权限完整列表包含表 60-1 中：\n\n\
  | 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDARWRITE_CALENDAR |\n| 相机 | CAMERA\
  \ |\n| 联系人 | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS |\n| 位置 | ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION\
  \ |\n| 麦克风 | RECORD_AUDIO |\n| 通知 | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短 | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGEREAD_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE |\n\
  \n表 60-1\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问设备外部存储上的所有文件，包括属于其他应用的文件。因此，只有当 Google\
  \ 在审核过程中验证需要此级别的访问权限后，该权限才会对应用应用。在将应用提交到 Google Play 商店之前进行测试，可以执行以下 `adb` 命令来临时在测试设备上为应用启用访问：\n\
  \n```\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE allow\n\
  ```\n\n可以通过以下方式禁用此模式：\n\n```bash\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE\
  \ default\n```\n\n## 60.2 创建权限示例项目从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为\
  \ Java。\n\n### 60.3 检查权限\n\nAndroid Support Library 包含许多可以在 Android 应用代码中查找和管理危险权限的方法。无论应用运行在哪个版本的\
  \ Android 上，都可以安全地进行这些 API 调用，但只有在 Android 6.0 或更高版本上执行时，才会执行有意义的任务。\n\n在应用尝试使用需要危险权限批准的功能之前，无论之前是否授予了权限，代码都必须检查权限是否已授予。可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前 Activity 的引用和正在请求的权限作为参数传递。该方法将检查权限是否之前已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予应用录制音频的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_permission_demo);\n\
  \        setupPermissions();\n    }\n\n    private void setupPermissions() {\n \
  \       int permission = ContextCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.RECORD_AUDIO);\n\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  ```\n\n编辑 `AndroidManifest.xml` 文件（位于 Project 窗口的 `app -> manifests` 下），添加以下行来请求录制权限：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemo\"\
  \ >\n\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\
  \n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/launcher\"\n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n在设备或模拟器上运行应用并打开 Logcat 窗口。注意，尽管权限已添加到文件中，仍会出现拒绝权限的消息。这是因为 Android 要求除了在文件中添加请求外，应用必须在运行时请求危险权限。\n\
  \n### 60.4 运行时请求权限\n\n通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法请求权限。调用此方法时，权限请求将异步处理并在完成后调用名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法将当前 Activity 的引用、正在请求的权限标识符以及请求代码作为参数。请求代码可以是任意整数值，并将用于标识哪个请求触发了对\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件声明请求代码，并在权限检查失败时请求录制权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\n...\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n...\n    private void\
  \ setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n\n        if (permission !=\
  \ PackageManager.PERMISSION_GRANTED) {\n```\n\n\n\n\n```java\n                Log.i(TAG,\
  \ \"Permission to record denied\");\n\n                makeRequest();\n\n      \
  \       }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                    new String[]{Manifest.permission.RECORD_AUDIO},\n         \
  \           RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \            @NonNull String[] permissions, @NonNull int[] grantResults) {\n   \
  \ super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n  \
  \  if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length ==\
  \ 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n在模拟器器或设备上编译并运行应用程序，注意将会出现一个请求录音权限的对话框，如图 60-3 所示：\n\n\
  ![](img/android_permission_request.jpg)\n\n图 60-3\n\n点击“在使用应用期间”（While using the\
  \ app）按钮，并检查 Logcat 面板中出现了“用户已授予权限”（Permission has been granted by user）的消息。\n\n\
  一旦用户授予了请求的权限，在未来的应用程序调用中，`checkSelfPermission()` 方法调用将返回 `PERMISSION_GRANTED` ，直到用户卸载并重新安装应用程序，或者在设置中更改了应用程序的权限。\n\
  \n### 60.5 为权限请求提供理由\n\n从图 60-3 可以看出，用户有权拒绝所请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再提问”选项，否则应用程序在每次由用户启动时都会继续请求该权限。用户的反复拒绝可能表明用户不理解应用程序为什么需要该权限。因此，如果在发出请求时解释了需求的原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好的做法是将解释包含在单独对话框中，该对话框可以在向用户展示请求对话框之前显示。这引出了何时显示此解释对话框的问题。Android 文建议仅在用户之前拒绝过权限时才显示解释对话框，并提供了一个方法来识别此类情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则将返回\
  \ `true`；如果之前没有请求过，则返回 `false`。在结果为 `true` 的情况下，应用程序应该显示一个包含需要权限理由的对话框，并且用户阅读并关闭对话框后，应重复权限请求。\n\
  \n要向示例应用程序中添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder = new AlertDialog.Builder(this)\n                    .setTitle(\"Permission\
  \ required\")\n                    .setMessage(\"Permission to access the microphone\
  \ is required for this app.\")\n                    .setPositiveButton(\"OK\", (dialog,\
  \ id) -> {\n                        ActivityCompat.requestPermissions(this,\n  \
  \                              new String[]{Manifest.permission.RECORD_AUDIO},\n\
  \                                RECORD_REQUEST_CODE));\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n### 60.6 测试权限\n\n在模拟器或设备上，注意会出现一个请求录音权限的对话框，如上所示。点击“在使用应用期间”（While\
  \ using the app）按钮，并检查 Logcat 面板中出现了“用户已授予权限”（Permission has been granted by user）的消息。\n\
  \n一旦用户授予了请求的权限，在未来的应用程序调用中，`checkSelfPermission()` 方法调用将返回 `PERMISSION_GRANTED`，直到用户卸载并重新安装应用程序，或者在设置中更改了应用程序的权限。\n\
  \n### 60.7 总结\n\n从图 60-3 可以看出，用户有权拒绝所请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再提问”选项，否则应用程序在每次由用户启动时都会继续请求该权限。用户的反复拒绝可能表明用户不理解应用程序为什么需要该权限。因此，如果在发出请求时解释了需求的原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好的做法是将解释包含在单独对话框中，该对话框可以在向用户展示请求对话框之前显示。这引出了何时显示此解释对话框的问题。Android 文建议仅在用户之前拒绝过权限时才显示解释对话框，并提供了一个方法来识别此类情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则将返回\
  \ `true`；如果之前没有请求过，则返回 `false`。在结果为 `true` 的情况下，应用程序应该显示一个包含需要权限理由的对话框，并且用户阅读并关闭对话框后，应重复权限请求。\n\
  \n\n\n\n\n要查看通知，用户只需从状态栏开始向下划动，以拉下通知栏，如图 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  \n图 61-2\n\n在运行 Android 8 或更高版本的设备上，长按应用启动器图标，将显示与该应用相关的任何待处理通知，如图 61-3 所示：\n\n\
  ![](img/Image2442.jpg)\n\n图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，该点会出现在应用启动器图标上。\n\
  \n典型的通知将简单地显示一条消息，并在点击时启动负责发布该通知的应用程序。通知还可能包含操作按钮，点击这些按钮可以执行对应应用程序的特定任务。例如，图 61-4\
  \ 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\n![](img/Image2450.jpg)\n\n图 61-4\n\n用户还可以在通知中输入内联文本回复并发送给应用，如下方的图\
  \ 61-5 所示。这允许用户在无需将相应的应用程序调到前台的情况下响应通知。\n\n![](img/Image2458.jpg)\n\n图 61-5\n\n\
  本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。直接回复支持的主将在下一章节中介绍，该章节标题为“Android 直接回复通知教程”。\n\n## 61.2\
  \ 创建 NotifyDemo 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前，选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`字段中输入 `NotifyDemo`，并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置更改为 `API 33: Android\
  \ 13 (Tiramisu)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n### 61.3 设计用户界面\n\n主 Activity\
  \ 将包含一个按钮，其目的是创建并发布意图（intent）。在 `Layout Editor`（布局编辑器）工具找到并加载 `activity_main.xml`\
  \ 文件，并删除默认的 `TextView` 组件。\n\n在启用 `Autoconnect`（自动连接）的情况下，从面板拖放一个 `Button`（按钮）对象到布局画布的中心，如图\
  \ 61-6 所示。\n\n在布局中选中 `Button` 组件后，使用 `Attributes`（属性）面板配置 `onClick` 属性，以调用名为 `sendNotification`\
  \ 的方法。\n\n![](img/as_notification_ui.jpg)\n\n图 61-6\n\n选择 `Button` 组件，在 `Attributes`\
  \ 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取到字符串资源。\n\n### 61.4 创建第二个 Activity\n\n为了本示例，应用将包含第二个\
  \ Activity，用户将从通知内部启动它。右键点击 `app -> java` 下的 `com.ebookfrenzy.notifydemo` 包名，选择\
  \ `New -> Activity -> Empty Views Activity` 菜单选项显示 `New Android Activity` 对话框以添加此新\
  \ Activity。\n\n在 `Activity Name` 字段中输入 `ResultActivity`并将布局文件命名为 `activity_result`。由于此\
  \ Activity 在应用程序启动时不会启动（它将通过通知内部的意图启动），因此在点击 `Finish` 按钮之前，确保禁用了 `Launcher Activity`（启动器\
  \ Activity）选项很重要。\n\n打开第二个 Activity 的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个\
  \ `TextView` 组件，使其位于布局中心。编辑 `TextView` 的 `text`，使其显示为“Result Activity”，并将属性值提取到字符串资源。\n\
  \n### 61.5 创建通知通道\n\n在应用发送通知之前，它必须先创建一个通知通道。通知通道由一个 `ID`（用于在应用内唯一标识通道）、一个通道名称和一个通道描述（只有后两个会被用户看到）组成。通道的创建是通过配置\
  \ `NotificationChannel` 实例，然后将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法实现的。\n\n对于此示例，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager =\n            (NotificationManager)\n            \
  \    getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(\"\
  com.ebookfrenzy.notifydemo.news\", \"NotifyDemo News\", \"Example Channel\");\n\
  \    }\n\n    protected void createNotificationChannel(String id, String name, String\
  \ description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLight(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n代码声明并初始化了一个 `NotificationManager` 实例，然后根据名称和描述创建一个低级别的通道（其他选项为高、最大、最小和无）。通道还添加了一系列可选设置，以自定义用户接收通知的方式。这些设置适用于发送到该通道的所有通知。最后，通过将通知通道对象传递给通知管理实例的方法来创建通道。\n\
  \n### 61.6 请求通知权限\n\n在测试应用程序之前，必须在文件中请求适当的权限。具体而言，应用程序需要向用户发布通知的权限。在项目窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 添加该权限：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\" >\n\n    <uses-permission android:name=\"\
  android.permission.POST_NOTIFICATIONS\" />\n\n</manifest>\n```\n\n上述步骤对于确保用户在运行\
  \ Android 6.0 之前的版本设备上安装应用时启用通知权限是足够的。通知访问在 Android 中被归类为危险权限，因为它可能可能会损害用户的隐私。因此，为了让示例应用程序在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在运行时专门请求权限。\n\n\n\n\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，用作所请求权限的请求标识码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是将待请求的权限和对应的请求标识码作为参数传入。在\
  \ `MainActivity.java` 类文件中，按照如下方式实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用本书中“在 Android 中发起运行时权限请求”章节概述的步骤，上述方法在发起请求之前会验证指定的权限是否已经授予，并将标识码作为参数传递。\n\
  \n当请求被处理后，活动（activity）将调用 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件按照如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Notification permission required\", Toast.LENGTH_LONG).show();\n        }\n\
  \    }\n}\n```\n\n上述代码通过检查请求标识码来识别是哪一个权限请求返回了，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示一条消息，指示应用将无法运行且录制按钮将被禁用。\n\
  \n在测试应用之前，最后剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。在 `MainActivity.java` 文件中，按照如下方式修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS, NOTIFICATION_REQUEST_CODE);\n\
  }\n```\n\n代码更改完成后，在运行 Android 13 或更高版本的设备或模拟器上编译并运行应用。当图 61-7 所示的对话框出现时，点击“允许”按钮启用通知：\n\
  \n![](img/as_enable_notifications.jpg)\n图 61-7\n\n应用启动后，将其置于后台并打开“设置”应用。在设置中，选择“应用”，选择\
  \ NotifyDemo 项目，并在随后的屏幕上点击“通知”项。通知屏幕应该列出 NotifyDemo News 类别对用户处于激活状态：\n\n![](img/as_app_notifications_enabled.jpg)\n\
  图 61-8\n\n在继续之前，确保已为该应用启用通知点。\n\n虽然本示例不是强制要求的，但值得注意的是，可以通过调用通知管理器的 `deleteNotificationChannel()`\
  \ 方法从应用内部删除通道，并传递要删除的通道 ID：\n\n```java\nString channelID = \"com.ebookrenzy.notify.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n### 6.7 创建并发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且必须包含图标、标题和内容。打开 `MainActivity.java` 文件并按照如下方式实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookrenzy.notify.news\";\n    Notification notification = new\
  \ Notification.Builder(MainActivity.this, channelID)\n        .setContentTitle(\"\
  Example Notification\")\n        .setContentText(\"This is an example notification.\"\
  )\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setChannelId(channelID)\n\
  \        .build();\n}\n```\n\n一旦构建了通知，需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要按照如下方式添加到 `sendNotification()` 方法中：\n\
  \n```java\nprotected void sendNotification(View view) {\n    int notificationID\
  \ = 101;\n    String channelID = \"com.ebookrenzy.notify.news\";\n    Notification\
  \ notification = new Notification.Builder(MainActivity.this, channelID)\n      \
  \  .setContentTitle(\"New Message\")\n        .setContentText(\"You've received\
  \ new messages.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n \
  \       .setChannelId(channelID)\n        .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。该 ID 是任意整数，并在以后更新通知时使用。\n\n编译并运行应用，然后点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下滑动查看完整通知：\n\
  \n![](img/as_notification.jpg)\n图 61-9\n\n点击并按住通知以查看更多信息：\n\n![](img/as_notification_details.jpg)\n\
  图 61-10\n\n接下来，将应用置于后台，导航到显示所有应用启动图标的主屏幕，并注意到 NotifyDemo 图标上出现了一个通知点，如图 61-11 所示：\n\
  \n![](img/as_notification_dot.jpg)\n图 61-11\n\n如果没有点，请检查设置应用中 NotifyDemo 的通知选项，以确认已按照本章之前的说明启用通知点。如果点仍出现，长按设备主屏幕的空白区域，从生成的菜单中选择“主屏幕设置”，并启用“通知点”选项。\n\
  \n长按启动图标将显示一个包含通知的弹出窗口：\n\n![](img/as_app_dot_detail.jpg)\n图 61-12\n\n如果一个应用有多个待处理通知，长按菜单框将包含通知数量（如上图所示）。此数字可以在构建通知时通过调用\
  \ `setNumber()` 方法在应用内部配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(CHANNEL_ID)\n    .setNumber(10)\n    .build();\n```\n\n\n\n\n\
  \n按照目前的实现，无论从何处访问，点击通知都不会产生效果。下一步是配置通知，在点击时启动一个活动（activity）。\n\n## 61.8 从通知启动活动\n\
  \n理想情况下，通知应该允许用户执行某种形式的操作，例如启动相应的应用程序，或者响应通知采取其他形式的操作。一个常见的需求是在用户点击通知时，简单地启动属于该应用程序的活动。\n\
  \n这种方法需要启动一个活动，并配置一个用于启动该活动的 `Intent`。假设有一个应用程序包含一个名为 `ResultActivity` 的活动，则该 intent\
  \ 的创建方式如下：\n\n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n\
  ```\n\n然后，需要将此 intent 封装在一个 `PendingIntent` 实例中。`PendingIntent` 对象的设计目的是允许将 intent\
  \ 传递给其他应用程序，本质上是授予这些应用程序在未来某个时刻执行该 intent 的权限。在这种情况下，`PendingIntent` 对象被用于为通知系统提供一种方法，在用户点击通知面板时启动\
  \ `ResultActivity` 活动：\n\n```java\nPendingIntent pendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_IMMUTABLE\n\
  \    );\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\
  \n将这些更改整合在一起，得到一个修改后的 `sendNotification()` 方法，内容如下：\n\n```java\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_IMMUTABLE\n\
  \            );\n    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n\
  \    Notification notification = new Notification.Builder(MainActivity.this,\n \
  \                                                        CHANNEL_ID)\n         \
  \   .setContentTitle(\"Example Notification\")\n            .setContentText(\"This\
  \ is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n再次编译并运行应用程序，点击按钮并显示通知栏。然而，此时点击通知将导致 `ResultActivity` 启动。\n\n## 61.9 为通知添加操作\n\
  \n向通知中添加交互性的另一种方法是创建操作（actions）。这些操作显示为通知消息下方的按钮，并程序设定为用户点击时触发特定的 intent。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“Open”get 操作按钮，在选中时会启动引用的 pending intent：\n\n\
  ```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\n    android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n    .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(R.drawable.ic_info_2dp)\n\
  \    .setChannelId(channelID)\n    .setContentIntent(pendingIntent)\n    .setActions(action)\n\
  \    .build();\nnotificationManager.notify(notificationId, notification);\n```\n\
  \n将上述代码添加到方法并运行应用程序。发布通知，并注意通知中出现的 Open 操作（取决于 Android 版本，可能需要向下划动通知面板才能显示 Open\
  \ 操作）：\n\nimage/as_notification_action.jpg\n图 61-13\n\n点击该操作将触发 pending intend 并启动\
  \ `ResultActivity`。\n\n## 61.10 组组通知（Bundled Notifications）\n\n如果应用程序倾向于经常发布通知，则可能存在这些通知会迅速占满状态栏和通知抽的危险，从而为用户提供欠佳的体验。这对于每当有突发新闻或新消息到达时就会发送通知的新类应用尤为如此。例如，考虑图\
  \ 61-14 中的通知：\n\nimage/as_3.2_unbundled_notifications.jpg\n图 61-14\n\n现在想象一下如果收到了十条甚至二十条消息。为了避免这类问题，Android\
  \ 允许将通知打包在一起。\n\n要打包通知，每条通知都必须通过 `setGroup()` 方法指定属于同一个组，并且必须发布额外的通知并将其配置为摘要通知（summary\
  \ notification）。例如，以下代码创建并发布了图 61-14 所示的三个通知，但将它们打包在同一个组中。代码还发布了一个通知作为摘要：\n\n```java\n\
  final String GROUP_KEY_NOTIFY = \"group_key_notify\";\nNotification.Builder builderSummary\
  \ =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have\
  \ 3 new messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder2 =\n    new\
  \ Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0\
  \ = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\nint notificationId3\
  \ = 103;\nnotificationManager.notify(notificationId1, builder1.build());\nnotificationManager.notify(notificationId2,\
  \ builder2.build());\nnotificationManager.notify(notificationId3, builder3.build());\n\
  notificationManager.notify(notificationId0, builderSummary.build());\n```\n\n执行该代码时，尽管应用程序实际上发布了四条通知，状态栏中只会显示一个通知图标。在通知抽屉中，会显示一个摘要通知，列出了打包通知中每个通知的信息：\n\
  \nimage/Image2528.jpg\n图 61-15\n\n进一步向下划动通知项，面板将展开并显示每个打包通知的详细信息：\n\nimage/Image2536.jpg\n\
  图 61-16\n\n\n\n\n通知允许应用程序在未运行或当前处于后台时向用户传递消息。通知显示在状态栏和通知栏中。本地通知由正在运行的应用程序在设备上触发，而远程通知则由远程服务器启动并传递到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n正如本章所示，可以通过使用操作（actions）、意图（intents）和\
  \ `PendingIntent` 类来配置通知为用户提供选项（例如启动活动或保存消息）。通知分组（Notification bundling）提供了一种将多个通知分组的机制，从而为发送大量通知的应用程序提供更好的体验。\n\
  \n# 62. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 7 中引入的一项功能，允许用户在通知中输入文本并发送到与通知关联的应用程序。这使用户无需启动应用内的活动\
  \ 即可回复通知中的消息。本章将基于上一章学到的知识，创建一个使用此通知特性的示例应用程序。\n\n## 62.1 创建 DirectReply 项目\n\n\
  从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name`（名称）字段中输入 `DirectReply` 并指定 `com.ebookfrenzy.directreply` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 33: Android 13`，并将语言菜单设置为\
  \ `Java`。按照第 11.8 迁移项目到 View Binding 部分列出的步骤修改项目以支持视图绑定。\n\n### 62.2 设计用户界面\n\n\
  向布局工具加载 `activity_main.xml` 布局文件。在启用 `Autoconnect`（自动连接）的情况下，在现有的“Hello World!”标签下方添加一个\
  \ `Button` 对象，如图 62-1 所示。在布局中选中 `Button` 部件，使用 `Attributes`（属性）工具窗口将 `onClick` 属性设置为调用名为\
  \ `sendNotification` 的方法。如有必要，使用 `Infer Constraints`（推断约束）按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!”`TextView` 并将 `id` 属性更改为 `textView`，并将按钮文本改为“Notify”。\n\n![](img/as_direct_reply_ui.jpg)\n\
  \n图 62-1\n\n## 62.3 请求通知权限\n\n在 `Project`（项目）工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改\
  \ XML 添加权限元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.audioapp\"\
  \ >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n```\n\n.\n.\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量，用作所请求权限的标识码：\n\n\
  .\n.\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 1;\n```\n\n.\n\n接下来，需要向类中添加一个方法，其目的是将请求的权限和相应的标识码作为参数。留在 `MainActivity.java`\
  \ 类中，按如下方式实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n当请求被处理后，活动（activity）将调用 `onRequestPermissions()` 方法，并传递标识码和结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Notification required\", Toast.LENGTH_LONG).show();\n        }\n    }\n}\n```\n\
  \n在测试应用程序之前，剩下的就是在应用程序启动时调用新添加的 `requestPermission()` 方法。留在 `MainActivity.java`\
  \ 文件中，按如下方式修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n}\n```\n\n## 62.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并按如下代码创建新通道：\n\n```java\n.\n.\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\n...\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n.\n    private NotificationManager notificationManager;\n    private final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n.\n.\n        notificationManager\
  \ = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n    \
  \    createNotificationChannel(channelID, \"DirectReply News\", \"Example News Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id, String name,\
  \ String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n.\n.\n}\n```\n\n# 62.5 构建 RemoteInput 对象\n\n\n\n\n\n使得在通知中实现内联直接回复的关键元素是\
  \ `RemoteInput` 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许应用程序创建一个意图（intent），然后授予其他应用程序或服务从应用程序外部启动该意图的能力。在标题为“Android\
  \ 通知教程的章节中，创建了一个等待意图，允许从通知内部启动原始应用中的活动（activity）。`RemoteInput` 类允许将用户输入请求与意图一起包含在\
  \ `PendingIntent` 对象中。当 `PendingIntent` 对象中的意图被触发时（例如启动一个活动），该活动也将将接收到用户提供的任何输入内容。\n\
  \n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。要构建 `RemoteInput`\
  \ 对象，需要一个键值字符串（key string），用于从生成的意图中提取输入内容。该对象还需要一个标签字符串（label string），它将显示在通知的输入字段中。编辑\
  \ `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。注意还添加了一些导入指令和变量，它们将在章节后续内容中中使用：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\n\
  import android.app.RemoteInput;\nimport android.content.Intent;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int notificationId\
  \ = 101;\n    private static final String KEY_TEXT_REPLY = \"key_text_reply\";\n\
  \    private NotificationManager notificationManager;\n    private static final\
  \ String channelID =\n                            \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n        String replyLabel =\
  \ \"Enter your reply here\";\n        RemoteInput remoteInput =\n            new\
  \ RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n \
  \               .build();\n    }\n}\n```\n\n现在 `RemoteInput` 对象已经创建并用键和标签字符串初始化，它需要被放置在通知操作对象中。在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n### 62.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android\
  \ 通知教程章节中的概述相同，不同在于意图将配置为启动 `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建 `PendingIntent`：\n\
  \n```java\npublic void sendNotification(View view) {\n    String replyLabel = \"\
  Enter your reply here\";\n    RemoteInput remoteInput =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n        PendingIntent.getActivity(\n            this,\n            0,\n   \
  \         resultIntent,\n            PendingIntent.FLAG_MUTABLE\n        );\n}\n\
  ```\n\n### 62.7 创建回复操作\n\n内联回复可以通过操作按钮在通知中访问。现在需要创建此操作，并为其配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\n\npublic void\
  \ sendNotification(View view) {\n    String replyLabel = \"Enter your reply here\"\
  ;\n    RemoteInput remoteInput =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n        PendingIntent.getActivity(\n            this,\n            0,\n   \
  \         resultIntent,\n            PendingIntent.FLAG_MUTABLE\n        );\n  \
  \  final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n     \
  \       android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n        new Notification.Action.Builder(\n            icon,\n            \"\
  Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n      \
  \      .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了 `RemoteInput`、`PendingIntent` 和 `Notification`\
  \ 对象并准备就绪。下一阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View view) {\n\
  \    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n        PendingIntent.getActivity(\n \
  \           this,\n            0,\n            resultIntent,\n            PendingIntent.FLAG_IMMUTABLE\n\
  \        );\n    final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n\
  \            android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n        new Notification.Action.Builder(\n            icon,\n            \"\
  Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n      \
  \      .build();\n    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n             \
  \   android.R.color.holo_blue_dark))\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build();\n    NotificationManager\
  \ notificationManager =\n        (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n\n\n\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent` 对象中包含的 intent 启动。该\
  \ intent 中嵌入了用户通过通知输入的文本。在该 activity 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回启动该\
  \ activity 的 intent 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法，反过来将返回一个包含回复文本的\
  \ `Bundle` 对象，该文本可以被提取并赋值给 `TextView` 控件。这导致 `MainActivity.java` 文件中的 `onCreate()`\
  \ 方法被修改，其读取如下所示：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    // ...\n    createNotificationChannel(channelID, \"DirectReply News\",\n\
  \                              Example News Channel\");\n    handleIntent();\n}\n\
  \nprivate void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle\
  \ remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput !=\
  \ null) {\n        String inputString = remoteInput.getCharSequence(\n         \
  \       KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板中输入并发送一些文本。注意，`MainActivity`\
  \ 中的 `TextView` 控件已更新以显示输入的内联文本。\n\n## 62.9 更新通知\n\n在通知中发送回复后，你可能会注意到通知面板中的进度指示器持续旋转，如图\
  \ 62-4 所示：\n\n![](img/as_direct_reply_progress.jpg)\n图 62-4\n\n通知显示此指示器是因为它正在等待\
  \ activity 的响应，以确认已接收发送的文本。执行此任务的推荐方法是用新消息更新通知，指示回复已接收并处理。由于原始通知在发布时已分配了 ID，可以再次使用它来执行更新。在\
  \ `handleIntent()` 方法中添加以下代码来执行此任务：\n\n```java\nprivate void handleIntent() {\n\
  \    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.getCharSequence(\n\
  \                KEY_TEXT_REPLY).toString();\n        binding.myTextView.setText(inputString);\n\
  \        Notification repliedNotification =\n                new Notification.Builder(this,\
  \ channelID)\n                        .setSmallIcon(\n                         \
  \   android.R.drawable.ic_dialog_info)\n                        .setContentText(\"\
  Reply received\")\n                        .build();\n        notificationManager.notify(notificationId,\n\
  \                repliedNotification);\n    }\n}\n```\n\n最后测试一次应用，并验证在发送内联回复文本后进度指示器消失，并且出现了一个新面板指示回复已接收：\n\
  \n![](img/as_direct_reply_received.jpg)\n图 62-5\n\n## 62.10 总结\n\n直接回复通知功能允许用户在通知内输入文本。\n\
  \n## 63. 可折叠设备与多窗口\n\n直接回复通知功能允许用户在通知内输入文本。\n\n### 63.1 可折叠屏与多窗口\n\n多窗口支持最初在 Android\
  \ 7 中引入。大多数手机设备上支持的分屏模式提供了一个分屏环境，其中两个 activity 并列显示或一个在上一个下方。提供了一个可移动的分割线，拖动它可以调整分配给每个屏幕的百分比：\n\
  \n![](img/Image2427)\n图 63-1\n\n自由形式模式在较大的屏幕上提供了一个窗口环境，与分屏模式的区别在于它允许每个 activity\
  \ 出现在可调整大小的窗口中，并且不受限于同时两个 activity。例如，图 63-2 显示了处于自由形式模式下的设备：\n\n![](img/Image2436)\n\
  图 63-2\n\n画中画（Picture-in-picture）支持顾如名，允许视频播放在用户执行其他任务时在较小的窗口中继续，该主题将在题为 Android\
  \ 画中画 的章节开始介绍。\n\n### 63.2 使用可折叠模拟器\n\n尽管在编写时，市场上还没有可以进行应用测试的可折叠设备，但 Android SDK\
  \ 包含了可折叠模拟器。要创建可折叠模拟器，选择 Android Studio 的 `Tools -> AVD Manager` 菜单选项，点击 `Create\
  \ Virtual Device` 按钮，并在硬件选择屏幕上从下方图 63-3 所示选择一个可折叠选项：\n\n![](img/as_foldable_device_template.jpg)\n\
  图 63-3\n\n模拟器运行后，工具栏上会出现一个额外的按钮，允许模拟器在折叠和展开配置之间进行切换：\n\n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n\
  图 63-4\n\n### 63.3 进入多窗口模式\n\n可以通过显示概览（Overview）屏幕、长按工具栏中列出的应用应用图标，并选择如图 63-5 所示的分屏菜单选项来进入分屏模式：\n\
  \n![](img/as_3.5_split_screen_button.jpg)\n图 63-5\n\n进入分屏模式后，概览按钮将变为显示两个矩形（如图 63-6\
  \ 中标记的 A 所示），当前 activity 将占据屏幕部分（B），概览屏幕将出现在屏幕相邻部分，允许选择第二个 activity 进行显示（C）。\n\n\
  \n\n\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n\n图 63-6\n\n一旦选择了第二个应用，屏幕将进行均匀平分，如上文\
  \ 图 63-1 所示。\n\n要退出分屏模式，只需将分隔两个活动的分隔线拖动到边缘，使其中一个活动占据整个屏幕，或者长按“概览”（Overview）按钮直到它恢复为单个正方形。\n\
  \n## 63.4 启用和使用自由窗口支持\n\n尽管并非所有设备都正式支持此功能，但在大屏设备和模拟器上可以启用自由窗口多窗口模式。要启用此模式，请在模拟器运行或设备连接期间，运行以下\
  \ `adb` 命令：\n\n```bash\nadb shell settings put global enable_freeform_support 1\n\
  ```\n\n在进行此更改后，可能需要重启设备才能使设置生效。\n\n启用后，在概览界面中长按应用图标时，会出现一个额外的选项，如图图 63-7 所示：\n\n\
  ![](img/as_3.5_freeform_button.jpg)\n\n图 63-7\n\n## 63.5 检查自由窗口支持\n\n如本章前面的介绍，Google\
  \ 将启用自由窗口多窗口模式的选择权交给了各个 Android 设备制造商。由于自由窗口仅在较大的设备上才有意义，因此无法保证在每个可能运行该应用的设备上都支持自由窗口。幸运的是，如果设备不支持自由窗口模式，系统会忽略所有针对自由窗口的方法和属性，因此使用它们不会导致应用在不支持自由窗口的设备上崩溃。然而，在某些情况下，检测设备是否支持自由窗口多窗口模式可能是很有用的。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查了自由窗口多窗口支持，并根据测试结果返回布尔值：\n\
  \n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 63.6\
  \ 在应用中启用多窗口支持\n\n清单文件中的 `android:resizableActivity` 设置控制应用是否支持多窗口行为。该设置可以在应用级或单个活动级进行。例如，以下片段配置了名为\
  \ `MainActivity` 的活动以支持分屏和自由窗口多窗口模式：\n\n```xml\n<activity\n    android:name=\".MainActivity\"\
  \n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止活动在分屏或自由窗口模式下出现，且相应的按钮将不会出现在应用的概览菜单中。如果在分屏配置中选择一个禁用了多窗口支持的活动作为第二个活动，将显示一条消息，指示该应用可能不支持多窗口模式。\n\
  \n## 63.7 指定多窗口属性\n\n`<layout>` 元素提供了许多属性，用于指定活动在多窗口模式下启动时的尺寸和位置。当活动在自由窗口模式下启动时，可以使用以下属性指定初始高度、宽度和位置：\n\
  \n- `android:defaultWidth` – 指定应用的默认宽度。\n- `android:defaultHeight` – 指定应用的默认高度。\n\
  - `android:gravity` – 指定应用的初始位置（起始、结束、左、右、顶等）。\n\n注意，上述属性仅在活动在自由窗口模式下显示时才生效。以下示例配置了活动在屏幕起始边缘顶部以特定的高度和宽度显示：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定活动在分屏或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定活动在分屏或自由窗口模式下可以缩减的最小高度。\n- `android:minimalWidth`\
  \ - 指定活动在分屏或自由窗口模式下可以缩减的最小宽度。\n\n当用户将分屏分隔线滑出最小高度或宽度的边界时，系统将停止调整收缩活动的布局，并简单地裁剪用户界面为用户留出空间。以下清单片段实现了最小宽度和高度：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\" android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 63.8 在活动中检测多窗口模式\n\
  \n可能会出现这种情况：活动需要检测其当前是否正以多窗口模式显示给用户。可以通过调用 `Activity` 类的 `isInWindowMode()` 方法获取当前状态。调用该方法将根据活动是否全屏返回\
  \ true 或 false 值：\n\n```java\nif (isInWindowMode()) {\n    // 正在多窗口模式运行\n} else\
  \ {\n    // 不在多窗口模式\n}\n```\n\n## 63.9 接收多窗口通知\n\n如果活动重写了 `onWindowModeChanged()`\
  \ 回调方法，它将接收进入或退出多窗口模式的通知。第一个参数在进入时为 true，退出时为 false。新的配置包含在第二个参数 `Configuration`\
  \ 对象中：\n\n```java\n@Override\npublic void onWindowModeChanged(boolean isInWindowMode,\
  \ Configuration newConfig) {\n    super.onWindowModeChanged(isInWindowMode, newConfig);\n\
  \    if (isInWindowMode) {\n        // 进入了多窗口模式\n    } else {\n        // 退出多窗口模式\n\
  \    }\n}\n```\n\n如处理活动状态变化章节所述，Android 10 及更高版本允许多个活动同时处于恢复状态（也称为多恢复）。用户最近与之交互的活动被称为顶层恢复活动。为了跟踪活动获取和失去顶层恢复状态，可以在活动中实现\
  \ `onTopResumedActivityChanged()` 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // 现在是顶层恢复活动\n    } else {\n        //\
  \ 不再是顶层恢复活动\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在应用清单文件中启用以下属性，可能也可以在应用中利用多恢复：\n\
  \n```xml\n<meta-data\nandroid:name=\"android.allow_multiple_resumed-activities\"\
  \ android:value=\"true\" />\n```\n\n\n\n在本本书的“Android 显式意 – 工作示例”（#Explicit_Intents.xhtml__idTextAnchor1073）章节中，创建了一个示例应用，其中一个\
  \ activity 使用意来启动第二个 activity。默认情况下，通过意 启动的 activity 被认为与源 activity 位于同一个任务栈中。然而，通过在意中传递适当标志，可以将\
  \ activity 启动到一个新的任务栈。\n\n在多窗口模式下，当一个 activity 在同一个任务栈内启动另一个 activity 时，新 activity\
  \ 将替换分屏窗口或自由窗口窗口中的源 activity（用户通过返回键返回到原始 activity）。\n\n然而，如果在分屏模式下启动到新的任务栈中，则第二个\
  \ activity 将出现在与原始 activity 相邻的窗口中，从而允许同时查看两个 activity。在自由窗口模式下，启动的 activity 将出现在一个与原始\
  \ activity 独立的窗口中。\n\n要将 activity 启动到新的任务栈中，必须在启动意 之前在其上设置以下标志：\n\n- `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  - `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n- `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n以下代码配置并启动了一个设计为在独立窗口中显示的第二个\
  \ activity：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nstartActivity(i);\n```\n\n### 63.11 配置自由窗口 activity 的大小和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ activity 将位于屏幕中心，大小由系统决定。可以通过 `ActivityOptions` 类向意 传递启动边界设置来控制此窗口的位置和尺寸。此过程的第一步是创建一个\
  \ `Rect` 对象，该对象被配置为代表 activity 窗口的矩形的左侧 (X)、顶部 (Y)、右侧 (X) 和底部 (Y)坐标。例如，以下代码创建了一个\
  \ `Rect` 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100,\
  \ 800, 900, 700);\n```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()`\
  \ 方法通过 `Rect` 设置进行初始化：\n\n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n结合这些步骤得到的代码序列如下：\n\n```java\nIntent i = new Intent(this,\
  \ SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n \
  \          Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 处于自由窗口模式时，通过意启动第二个 activity，新 activity 窗口将根据 `Rect` 对象中定义的位置和尺寸出现。\n\
  \n### 63.12 总结\n\nAndroid 7 引入了多窗口支持，该系统允许屏幕上任何时候都显示多个 activity。这一功能现在构成了为折叠设备提供支持的基础。多窗口支持三种模式：分屏、自由窗口和画中画。在分屏模式下，屏幕被水平或垂直分为两个窗格，每个窗格显示一个\
  \ activity。自由窗口模式仅在某些 Android 设备上支持，允许每个 activity 出现在独立的、可移动和可调整大小的窗口中。正如本章概述，Android\
  \ SDK 中提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n# 64. Android SQLite 数据库概述\n\n不需要存储至少某些持久化数据的移动应用寥寥无几。数据库的使用大多数应用程序不可或缺的方面，从几乎完全由数据驱动的应用，到只需要存储诸如游戏当前得分等少量数据的应用。\n\
  \n考虑到典型的 Android 应用具有某种短暂的生命周期，持久化数据存储的重要性变得更加显而。由于 Android 运行时系统随时存在终止应用程序组件以释放资源的风险，为了避免数据丢失的全面数据存储策略是设计和实现任何应用开发策略的关键因素。\n\
  \n本章将提供 Android 操作系统自带的 SQLite 数据库管理系统的概述，并概述提供的 Android SDK 类，以便从 Android 应用内部实现基于\
  \ SQLite 的持久化数据库存储。然而，在深入 Android 开发背景下的 SQLite 具体细节之前，将对数据库和 SQL 进行简要概述。\n\n###\
  \ 64.1 理解数据库表\n\n数据库表提供了数据库中最基础的数据结构级别。每个数据库可以包含多个表，每个表都设计用于持有特定类型的信息。例如，一个数据库可能包含一个客户表，其中每个客户的姓名、地址和电话号码。同一个数据库可能还包含一个产品表，用于存储带有关联产品代码的项目描述。\n\
  \n数据库中的每个表都分配有一个名称，该名称在相应数据库内必须唯一。表名一旦分配给某个数据库中的表，除非在另一个数据库的范围内，否则不能用于另一个表。\n\n\
  ### 64.2 引入数据库模式\n\n数据库模式 (Schemas) 定义了存储在数据库表中的数据的特征。例如，客户数据库表的表模式可能定义客户名称为长度不超过\
  \ 20 个字符的字符串，客户电话号码为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库包含的各种表之间的关系。\n\n### 64.3\
  \ 列和数据类型\n\n在此阶段，将数据库表视类似于电子表格是有帮助的。每一列代表对应表中的一个数据字段。例如，表的姓名、地址和电话数据字段都是列。\n\n每列反过来被定义为包含特定类型的数据。因此，设计用于存储数字的列将（定义为包含数值数据。\n\
  \n### 64.4 数据库行\n\n保存到表的每条新记录都存储在行中。每行反过来由与所保存记录相关的列组成。\n\n再次考虑本章早些描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每列包含每个客户的数据（姓名、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行的相应列中。\n\
  \n行有时也被称为记录 (records) 或条目 (entries)，这些术语通常可以互换。\n\n### 64.5 引入主键\n\n\n\n\n\n每个数据库表都应该包含一或多列，用于唯一标识表中的每一行。这在数据库术语中被称为**主键**（Primary\
  \ Key）。例如，一个表可以使用银行账户号码作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地标识表中的特定行。没有主键，就无法检索或删除表中的特定行，因为无法确定选择的是正确的行。例如，假设存在一个表，将客户的姓氏定义为主键。想象一下，如果数据库中记录了多个姓为“Smith”（史密斯）的客户，可能会出现什么问题。如果没有某种保证的方法来唯一标识某特定行，就无法确保在任何给定时间访问的都是正确的数据。\n\
  \n主键可以由表中的单列组成，也可以由多列组成。要符合单列主键的条件，任何两行都不能包含相同的主键值。当使用多个列构造主键时，单个列的值不需要是唯一的，但所有列的值组合在一起必须是唯一的。\n\
  \n## 64.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）都是独立的服务器进程，它们独立运行，并与需要数据库访问的应用程序协作。SQLite 被称为嵌入式，是因为它是以库的形式提供的，并链接到应用程序中。因此，没有后台运行的独立数据库服务器。所有的数据库操作都是通过调用\
  \ SQLite 库中包含的函数在应用程序内部处理的。\n\nSQLite 的开发者已将该技术投入了公领域，因此它现在已成为广泛部署的数据库解决方案。\n\n\
  SQLite 使用 C 语言编写，因此 Android SDK 为底层数据库接口提供了一个基于 Java 的“封装器”（wrapper）。这本质上由了一组类组成，这些类可以在应用程序的\
  \ Java 或 Kotlin 代码中使用，创建并管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 64.7 结构化查询语言 (SQL)\n\nSQLite 数据库使用一种名为“结构化查询语言”（Structured Query Language）的高级语言访问数据。这通常缩写为\
  \ SQL，读作 \"sequel\"。SQL 是大多数关系型数据库管理系统使用的标准语言。SQLite 大多符合 SQL-92 标准。\n\nSQL 本质上是一种非常简单且易用的语言，专门设计用于读取和写入数据库数据。由于\
  \ SQL 包含一组较少的关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的 SQL 语法在很大程度上相同，因此在学习了某个系统的 SQL 后，你的技能很可能会转移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基础的 SQL 语句，但对 SQL 的详细概述超出了本书的范围。然而，还有许多其他资源可以提供比我们在此章节中希望提供的详尽得多的 SQL\
  \ 概述。\n\n## 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于通常不熟悉数据库、特别是 SQLite 的读者来说，直接开始创建一个使用\
  \ SQLite 的 Android 应用程序可能看起来有些人生畏。幸运的是，Android 预装了 SQLite，包括一个交互式环境，可以从连接到运行中的 Android\
  \ AVD 模拟器实例的 `adb` shell 会话中发布 SQL 命令。这既是学习 SQLite 和 SQL 的有用方法，也是识别运行在模拟器中的应用程序所创建的数据库问题的宝贵工具。\n\
  \n要启动交互式 SQLite 会话，首先要运行 AVD 会话。这可以通过 Android Studio 启动 Android 虚拟设备管理器（Tools ->\
  \ AVD Manager），选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 启动并运行，打开终端或命令提示符窗口，并使用 `adb`\
  \ 命令行工具连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n```\n\n\
  连接成功后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/\
  \ su\nroot@android:/ #\n```\n\n如果出现显示不允许超级用户权限的消息，可能是因为 AVD 实例包含了 Google Play 支持。要解决此问题，创建一个新的\
  \ AVD，并在“Choose a device definition”（选择设备定义）屏幕上，选择一个在“Play Store”列没有标记的设备。\n\n存储在\
  \ SQLite 数据库中的数据实际上存储在运行应用程序的 Android 设备文件系统上的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n\
  `/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果包名为 `com.example.MyDBApp`\
  \ 的应用程序创建一个名为 `mydatabase.db` 的数据库，则设备上的文件路径如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb` shell 中切换目录到 `/data/data` 并创建一个适用于 SQLite 实验的子目录层次结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，按如下方式启动交互式 SQLite 工具：\n\n```bash\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n\nSQLite version 3.8.10 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage.\n`sqlite>`\n\n在 `sqlite>` 提示符下，可以输入命令执行诸如创建表、插入和检索数据等任务。例如，要创建一个包含名称和电话字段的新表，需要以下语句：\n\
  \n```sql\ncreate table contacts (_id integer primary key autoincrement, name text,\
  \ phone text);\n```\n\n注意表中的每一行都应该有一个唯一的主键。在上面的示例中，我们将 `_id` 字段指定为主键，并要求 SQLite\
  \ 在每次添加行时增加数字。这是确保每行都有唯一主键的常用方法。在大多数其他平台上，主键的名称是任意的。但在 Android 的情况下，必须命名为 `_id`\
  \ 才能使用所有的 Android 相关类访问数据库。其余字段每个声明为 text 类型。\n\n要列出当前选择数据库中的表，使用 `.tables` 语句：\n\
  \n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\n```sql\nsqlite> insert into\
  \ contacts (name, address, phone) values (\"Bill Smith\", \"123 Main Street, California\"\
  , \"123-555-2323\");\nsqlite> insert into contacts (name, address, phone) values\
  \ (\"Mike Parks\", \"10 Upping Street, Idaho\", \"444-444-1212\");\n```\n\n从表中检索所有行：\n\
  \n```sql\nsqlite> select * from contacts;\n1|Bill Smith|123 Main Street, California|123-555-2323\n\
  2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\n\
  sqlite> select * from contacts where name=\"Mike Parks\";\n2|Mike Parks|10 Upping\
  \ Street, Idaho|444-444-1212\n```\n\n\n\n\n\n要退出 `sqlite3` 交互式环境：\n\n```\nsqlite3>\
  \ .exit\n```\n\n在模拟器环境中运行 Android 应用程序时，任何数据库文件将根据之前讨论的路径约定在模拟器的文件系统上创建。这样做的好处是，你可以通过\
  \ `adb` 进行连接，导航到数据库文件所在，将其加载到 `sqlite3` 交互式工具中，并对数据进行操作，以识别应用程序代码中可能出现的问题。\n\n同样重要的是，虽然可以通过\
  \ `adb shell` 连接到物理 Android 设备，但默认情况下，shell 并没有获得足够的权限来创建和管理 SQLite 数据库。因此，调试数据库问题的最佳实践是使用\
  \ AVD（Android 虚拟设备）会话。\n\n# 64.9 Android Room 持久化库\n\n如之前，SQLite 是用 C 语言编写的，而 Android\
  \ 应用主要使用 Java 或 Kotlin 开发。在过去，为了弥补这种“语言鸿沟”，Android SDK 包含一组类，它们在 SQLite 数据库管理系统之上提供了一个层。尽管这些类在\
  \ SDK 中仍然可用，但使用它们仍然需要编写大量的代码，并且没有利用新的架构指南和诸如 `LiveData` 和生命周期管理等特性。为了解决这些缺点，Android\
  \ Jetpack 架构组件包含了 `Room` 持久化库。该库在 SQLite 数据库系统之上提供了一个高级接口，能够以极少的代码在 Android 设备上本地存储数据，同时符合对现代应用程序架构的建议。\n\
  \n接下来的几章将提供使用 `Room` 持久化库进行 SQLite 数据库管理的概述和教程。\n\n### 64.10 总结\n\nSQLite 是一种轻量级、嵌入式的关系型数据库管理系统，作为\
  \ Android 框架的一部分，它为 Android 应用程序实现组织化的持久化数据存储提供了机制。与 `Room` 持久化库结合，Android 提供了一种从\
  \ Android 应用内部实现数据存储的现代方法。\n\n本章的目标是提供 Android 应用程序开发背景下对通用数据库以及特别是 SQLite 的概述。接下来的章节将提供\
  \ `Room` 持久化库的概述，之后我们将完成一个示例应用程序的。\n\n# 65. Android Room 持久化库\n\n`Room` 持久化库包含在\
  \ Android 架构组件中，专门设计用于更更容易为 Android 应用程序添加数据库存储支持，且这种方式符合 Android 架构指南。在上一章涵盖了 SQLite\
  \ 数据库的基础知识后，本章将探索基于 `Room` 的数据库管理的基本概念、协作在 Android 应用中实现 `Room` 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章将通过\
  \ `Room` 数据库项目的形式将这些理论付诸实践。\n\n## 65.1 重温现代应用架构\n\n标题为[“使用 Jetpack 构建现代 Android\
  \ 应用架构”]的章节介绍了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。[图 65-1] 所示的图概述了典型 Android 应用程序的推荐架构：\n\
  \n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n由于该架构的前三个层次已在本书早期的章节中进行了详细介绍，现在是时候在 `Room`\
  \ 持久化库的背景下探索仓库（repository）和数据库架构层级了。\n\n## 65.2 Room 数据库持久化的关键元素\n\n在章节稍后进行更详细讨论之前，首先值得总结使用\
  \ `Room` 持久化库操作 SQLite 数据库时涉及的关键元素：\n\n#### 65.2.1 仓库 (Repository)\n\n如之前讨论的，仓库模块包含了直接处理应用所用所有数据源所需代码。这避免了\
  \ UI 控制器和 `ViewModel` 包含直接访问数据库或网络服务等源的代码。\n\n### 65.2.2 Room 数据库\n\n`room` 数据库对象提供了对底层\
  \ SQLite 数据库的接口。它还为仓库提供了访问数据访问对象 (`DAO`）的权限。应用程序应该只有一个 `room` 数据库实例，该实例随后可以被用于访问多个数据库表。\n\
  \n#### 65.2.3 数据访问对象 (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL\
  \ 语句被映射到方法上，然后从仓库内部调用这些方法来执行相应的查询。\n\n#### 65.2.4 实体 (Entities)\n\n实体是定义数据库中表结构模式（schema）的类，它定义了表名、列名和数据类型，并标识哪一列是主键。除了声明表结构外，实体类还包含提供访问这些数据字段的\
  \ getter 和 setter 方法。由 `DAO` 响应 SQL 查询方法调用返回给仓库的数据将以这些实体类实例的形式存在。随后将调用 getter 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用在对象上配置值，然后调用 `DAO` 中声明的插入方法，传递要保存的实体实例。\n\n#### 65.2.5 SQLite 数据库\n\n\
  负责存储和提供数据的实际 SQLite 数据库。应用程序代码（包括仓库）不应直接访问此底层数据库。所有的数据库操作都通过 `room` 数据库、`DAOs` 和实体的组合完成。\n\
  \n[图 65-2] 中的架构图说明了这些元素元素交互以在 Android 应用中提供基于 `Room` 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\
  \n图 65-2\n\n上述架构图中带编号的连接可以总结如下：\n\n1. 仓库与 `room` 数据库交互以获取数据库实例，该实例反过来用于获取 `DAO`\
  \ 实例的引用。\n2. 仓库创建实体实例并配置数据，然后将其传递给 `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 的方法，传递要插入数据库的实体，并在响应查询时接收实体实例。\n\
  4. 当 `DAO` 有结果返回给仓库时，它将这些结果封装成实体对象。\n5. `DAO` 与 `room` 数据库交互以启动数据库操作并处理结果。\n6. `room`\
  \ 数据库处理与底层 SQLite 数据库的所有底层交互，提交查询并接收结果。\n\n在涵盖了使用 `Room` 持久化库进行数据库访问的关键元素概述后，现在是时候详细探索实体、`DAO`、`room`\
  \ 数据库和仓库。\n\n### 65.3 理解实体\n\n每个数据库表都将关联一个实体类。该类定义了表的结构模式，形式为标准的 Java 类，并穿插了一些特殊的\
  \ Room 注解。一个声明要存储在数据库表中的示例 Java 类可能如下：\n\n```java\npublic class Customer {\n   \
  \ private int id;\n\n    private String name;\n}\n```\n\n\n\n\n\n```java\n    private\
  \ string address;\n\n    public Customer(String name, String address) {\n      \
  \  this.id = id;\n        this.name = name;\n        this.address = address;\n \
  \   }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(int id) {\n  \
  \      this.id = id;\n    }\n\n    public void setName(String name) {\n        this.name\
  \ = name;\n    }\n\n    public void setAddress(int quantity) {\n        this.address\
  \ = address;\n    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java `class`，其中包含若干表示数据库表字段的变量以及一组\
  \ getter 和 setter 方法。然而，该类目前还不是实体（entity）。为了将此类转换为实体并使其能够在 SQL 语句中访问，需要按照如下所示添加\
  \ Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\npublic class Customer\
  \ {\n\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name\
  \ = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name = \"customerName\"\
  )\n    private String name;\n\n    private String address;\n\n    public Customer(String\
  \ name, String address) {\n        this.id = id;\n        this.name = name;\n  \
  \      this.address = address;\n    }\n\n    public int getId() {\n        return\
  \ this.id;\n    }\n\n    public String getName() {\n        return this.name;\n\
  \    }\n\n    public int getAddress() {\n        return this.address;\n    }\n\n\
  \    public void setId(@NonNull int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setAddress(int quantity) {\n        this.address = address;\n    }\n}\n```\n\n\
  上述注解首先声明了该 `class` 代表一个实体，并分配了名为“customers”的表。这是在 DAO SQL 语句中引用该表的名称：\n\n`@Entity(tableName\
  \ = \"customers\")`\n\n每个数据库表都需要一个列来作为主键。在这种情况下，客户 `id` 被声明为主键。还添加了注解来分配一个用于在 SQL\
  \ 查询中引用的列名，并指示该字段不能用于存储空值。最后，`id` 值被配置为自动生成。这意味着分配给新记录的 `id` 将由系统自动生成，以避免键冲突。\n\n\
  ```java\n@PrimaryKey(autoGenerate = true)\n\n@NonNull\n\n@ColumnInfo(name = \"customerId\"\
  )\nprivate int id;\n```\n\n客户名称字段也分配了一个列名。但请注意，`address` 字段没有分配列名。这意味着 `address`\
  \ 数据仍将存储在数据库中，但不需要在 SQL 语句中引用它。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解即可：\n\n```java\n\
  @Ignore\n\nprivate String myString;\n```\n\n最后，修改了 `id` 变量的 setter 方法以防止尝试分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n实体类中还可能包含注解，以便使用关系数据库中称为外键（foreign\
  \ keys）的概念与其他实体建立关系。外键允许一个表引用另一个表的主键。例如，可以在名为 `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\
  \n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n       \
  \ parentColumns = \"customerId\",\n        childColumns = \"buyerId\",\n       \
  \ onDelete = ForeignKey.CASCADE,\n        onUpdate = ForeignKey.RESTRICT})\npublic\
  \ class Purchase {\n\n    @PrimaryKey(autoGenerate = true)\n    @ColumnInfo(name\
  \ = \"purchaseId\")\n    private int purchaseId;\n\n    @ColumnInfo(name = \"buyerId\"\
  )\n    private int buyerId;\n}\n```\n\n### 65.4 数据访问对象\n\n数据访问对象（Data Access Object）提供了一种访问存储在\
  \ SQLite 中的数据的方法。第一步是创建接口并将其声明为 `@Dao` 注解：\n\n```java\n@Dao\npublic interface CustomerDao\
  \ {\n}\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条目。以下示例允许通过调用 `getAllCustomers()` 获取所有行数据：\n\
  \n```java\n@Dao\npublic interface CustomerDao {\n    @Query(\"SELECT * FROM customers\"\
  )\n    LiveData<List<Customer>> getAllCustomers();\n}\n```\n\n注意，`getAllCustomers()`\
  \ 返回一个包含 `Customer` 实体的 `List` 对象。DAO 还使用了 `LiveData`，以便仓库（repository）能够观察数据库的变化。参数也可以传递给方法并在\
  \ SQL 语句中引用。考虑以下 DAO 声明，它搜索与客户名称匹配的数据库记录（请注意 `WHERE` 条件中引用的列是分配给实体类的名称）：`customerName`\
  \ \n\n可以使用 `@Insert` 方便注解声明一个基础的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer\
  \ customer);\n```\n\n这被称为方便注解，因为 Room 持久库可以推断传递给 `addCustomer()` 方法的 `Customer`\
  \ 实体将插入数据库，而无需提供 SQL 语句。也可以在单个事务中插入多个数据库记录：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n以下 DAO 声明删除所有匹配客户名称的记录：\n\n```java\n@Query(\"DELETE FROM customers\
  \ WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\n作为使用 `@Query`\
  \ 注解执行删除的替代方案，也可以使用 `@Delete` 方便注解。在示例中，传递给 `deleteCustomers()` 方法的所有 `Customer`\
  \ 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer... customers);\n\
  ```\n\n`@Update` 方便注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n此类数据库操作的 DAO 方法也可以声明返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n### 65.5 Room\
  \ Database\n\nRoom 类通过扩展 `RoomDatabase` 类创建，它是 Android 系统内置 SQLite 数据库之上的层。该类负责创建并返回新的\
  \ Room 数据库实例，并提供与数据库关联的 DAO 实例的访问。\n\nRoom 持久库提供了用于创建数据库的构建器。每个 Android 应用应该只有一个\
  \ Room 数据库实例，因此最好在类中实现防御性代码以防止创建多个实例。\n\n与示例客户表使用的 Room 数据库实现如下代码列表所示：\n\n```java\n\
  import android.content.Context;\n```\n\n\n\n\n\n```java\nimport android.arch.persistence.room.Database;\n\
  \nimport android.arch.persistence.room.Room;\n\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n\n    public abstract CustomerDao customerDao();\n\n \
  \   private static CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (CustomerRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE = Room.databaseBuilder(\n           \
  \                 context.getApplicationContext(),\n                           \
  \ CustomerRoomDatabase.class, \"customer_database\")\n                         \
  \   .build();\n                }\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n上述示例中需要注意的重要区域是类声明上方的注解（它声明了数据库要工作的实体）、检查类实例是否已经创建的代码，以及为实例分配名称\
  \ `customer_database` 的赋值。\n\n### 65.6 仓库 (Repository)\n\n仓库负责获取 Room 数据库实例，使用该实例访问相关的\
  \ DAO，然后调用 DAO 方法来执行数据库操作。一个用于与 Room 数据库工作的典型仓库构造函数可能如下：\n\n```java\npublic class\
  \ CustomerRepository {\n\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase\
  \ db;\n\n    public CustomerRepository(Application application) {\n        db =\
  \ CustomerRoomDatabase.getDatabase(application);\n        customerDao = db.customerDao();\n\
  \    }\n}\n```\n\n一旦仓库获取了 DAO 的权限，它就可以调用数据访问方法。例如，以下代码调用了 `getAllCustomers()` DAO\
  \ 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\nallCustomers\
  \ = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，需要注意的是，除非该方法返回 `LiveData`\
  \ 实例（该实例会在单独的线程上自动运行查询），否则不能在应用的主线程上执行该操作。事实上，尝试这样做会导致应用崩溃，并输出以下诊断性信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要更长时间才能完成，在单独线程上运行操作可以避免应用出现假死。正如题为 “Android\
  \ Room 数据库和仓库教程” 的章节将所示，通过使用 Java 线程可以轻松解决这个问题（如需更多信息或关于使用线程的提醒，请参阅题为 “Java 线程、处理器\
  \ 和执行器的基础概述” 的章节）。\n\n### 65.7 内存数据库\n\n本章概述的示例涉及了以数据库文件形式存在于 Android 设备持久化存储上的\
  \ SQLite 数据库。这确保了即使在应用进程终止后，数据仍然存在。\n\nRoom 数据库持久化库还支持内存数据库。这些数据库完全驻留在内存中，并在应用终止时丢失。使用内存数据库唯一需要的更改是调用\
  \ Room Database 类的 `Room.inMemoryDatabaseBuilder()` 方法而不是 `Room.databaseBuilder()`。以下代码显示了方法调用之间的区别（注意，内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \            CustomerRoomDatabase.class, \"customer_database\")\n            .build();\n\
  \n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \            CustomerRoomDatabase.class)\n            .build();\n```\n\n### 65.8\
  \ 数据库检查器 (Database Inspector)\n\nAndroid Studio 包含一个数据库检查器工具，允许如图 65-3 所示对运行应用相关的数据库进行查看、搜索和修改：\n\
  \n![图 65-3](img/database_inspector.jpg)\n\n图 65-3\n\n### 65.9 总结\n\nAndroid Room\
  \ 持久化库包含在 Architecture Components 中，并作为底层 SQLite 之上的抽象层。该库的设计旨在使其遵循 Android 指南的同时更容易处理数据库工作。本章介绍了构建\
  \ Room 项目相互交互的不同元素，包括实体、仓库、数据访问对象和注解。\n\n在了 SQLite SQLite 和 Room 架构组件之后，下一步是创建一个将这些理论付诸的示例应用。由于示例的用户界面需要基于表单的布局，下一章题为\
  \ “Android TableLayout 和 Row 教程”，它将稍微偏离核心主题，介绍 TableLayout 和 Row 视图的基础知识。\n\n##\
  \ 66. 一个 Android TableLayout 和 Row 教程\n\n在开始本书的下一章（Android Room 数据库和仓库教程”）的工作时，最初打算包含设计用户界面的步骤。然而，很快明显，实现用户界面的最佳方法是利用\
  \ TableLayout 和 Row 视图，而且这个主题值得作为一个独立的章节。因此，本章将专门关注下一章要完成的数据库应用程序的用户界面设计，并在此花一些时间介绍\
  \ Android 表布局的基本概念。\n\n### 66.1 TableLayout 和 Row 布局视图\n\nTableLayout 容器视图的目的是允许用户界面元素以行和列组成的表格格式组织在屏幕上。TableLayout\
  \ 中的每一行都由一个 TableRow 实例占据，而 TableRow 继被划分为单元格，每个单元格包含一个子视图。\n\n表格的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可扩展（或两者兼有），以便相对于父级\
  \ TableLayout 改变大小。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 66-1](#TableLayout.xhtml__idTextAnchor1281)\
  \ 所示的用户界面布局：\n\n![图 66-1](img/tablelayout_ui.jpg)\n\n图 66-1\n\n从布局的外观来看，很难识别设计界面时使用的\
  \ TableLayout 结构。然而，图 66-2](#TableLayout.xhtml__idTextAnchor1282) 所示的层级树状结构变得更容易理解：\n\
  \n![图 66-2](img/tablelayout_tree.jpg)\n\n图 66-2\n\n\n\n\n显然，该布局包含一个父 `LinearLayout`\
  \ 视图，其中包含 `TableLayout`、`LinearLayout` 和 `RecyclerView` 子视图。`TableLayout` 包含三个 `TableRow`\
  \ 子视图，代表表格中的三行。每个 `TableRow` 包含两个子视图，每个子视图代表表格列单元格的内容。`LinearLayout` 子视图包含三个 `Button`\
  \ 子视图。\n\n图 66-2 所示的布局正是下一章将完成的数据库示例所要求的精确布局。因此，本章的剩余部分将用于使用 Android Studio 布局编辑器（Layout\
  \ Editor）工具逐步完成此用户界面的设计。\n\n## 66.2 创建 Room 数据库项目\n\n从欢迎界面选择 `New Project` 菜单选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `RoomDemo`，并指定 `com.ebookfrenzy.roomdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照第 11.8 将项目迁移到 View Binding 节列出的步骤将项目迁移到视图绑定（view\
  \ binding）。\n\n## 66.3 转换为 LinearLayout\n\n在 Project 工具窗口（`app -> res -> layout`）中找到\
  \ `activity_main.xml` 文件并双击它将其加载到布局编辑器工具中。默认情况下，Android Studio 使用 `ConstraintLayout`\
  \ 作为用户界面的根布局元素。这需要被转换为垂直方向的 `LinearLayout`。在设计模式下使用布局编辑器工具，在组件树（Component Tree）面板中找到\
  \ `ConstraintLayout` 组件，右键点击它以显示如图 66-3 所示的菜单，并选择 `Convert view...` 选项：\n\n![](img/as_tablelayout_covert_view.jpg)\n\
  图 66-3\n\n在弹出的对话框（图 66-4）中，在点击 `Apply` 按钮之前选择转换为 `LinearLayout` 的选项：\n\n![](img/as_4.1_room_demo_convert_linear.jpg)\n\
  图 66-4\n\n默认情况下，布局编辑器已将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在组件树窗口中选择布局组件，参考属性（Attributes）工具窗口并将\
  \ `orientation` 属性更改为垂直（vertical）：\n\n![](img/as_3.4_linearlayout_change_orientation.jpg)\n\
  图 66-5\n\n转换完成后，选择并删除布局中的默认 `TextView` 控件。\n\n## 66.4 向用户界面添加 TableLayout\n\n继续留在\
  \ `activity_main.xml` 文件中并参考调色板（Palette）的 `Layouts` 类别，拖放一个 `TableLayout` 视图，使其置于\
  \ `LinearLayout` 画布区域的顶部。\n\n一旦完成这些初始步骤，布局的组件树应该类似于图 66-6 所示。\n\n![](img/as_tablelayout_added.jpg)\n\
  图 66-6\n\n显然，Android Studio 已自动为 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个\
  \ `TableRow` 实例。可以随时从调色板中拖动 `TableRow` 对象并将其到组件树工具窗口中的 `TableLayout` 条目上为 `TableLayout`\
  \ 添加额外的行。\n\n选中 `TableLayout` 后，使用属性工具窗口将 `layout_height` 属性更改为 `wrap_content`并将\
  \ `layout_width` 更改为 `match_parent`。\n\n## 66.5 配置 TableRows\n\n在调色板的 `Text` 部分中，将两个\
  \ `TextView` 对象拖到组件树中最顶部的 `TableRow` 条目上（图 66-7）：\n\n![](img/as_tablelayout_text_added.jpg)\n\
  图 66-7\n\n选择屏幕布局中最左侧的 `TextView`，并在属性工具窗口将 `text` 属性更改为“Product ID”。对最右侧的 `TextView`\
  \ 重复此步骤，这次将文本更改为“Not assigned”并指定 `ID` 值为 `productID`。\n\n将另一个 `TextView` 控件拖放到组件树中的第二个\
  \ `TableRow` 条目，并将视图上的文本更改为“Product Name”。在调色板中找到 `Plain Text` 对象并将其拖放，使其如图 66-8\
  \ 所示所示置于组件树中 `Product Name` `TextView` 下方。接下来，从 `text` 属性中删除“Name”字符串并将 `ID` 设置为\
  \ `productName`。\n\n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n图 66-8\n\n\
  将另一个 `TextView` 和一个 `Number (Decimal)` 文本字段拖到第三个 `TableRow` 上，使 `TextView` 在层级结构位于\
  \ `EditText` 之上。将 `TextView` 上的文本更改为 Product Quantity，并将 `EditText` 对象的 `ID` 设置为\
  \ `productQuantity`。如图 66-9 所示，通过 Shift 击选择布局中的所有控件，并在属性工具窗口将 `textSize` 属性设置为 `18sp`：\n\
  \n![](img/as_4.1_room_demo_convert_linear.jpg)\n图 66-9\n\n### 66.6 添加按钮栏\n\n下一步是在父\
  \ `LinearLayout` 中添加一个水平 `LinearLayout` 视图，位于 `TableLayout` 视图的正下方。通过点击组件树中 `TableLayout`\
  \ 条目左侧的展开箭头来折叠所有内容。从调色板的 `Layouts` 部分拖出一个 `LinearLayout (horizontal)` 实例，将其置于组件树中\
  \ `TableLayout` 条目的下方，并将 `layout_height` 属性更改为 `wrap_content`：\n\n![](img/as_tablelayout_linear.jpg)\n\
  图 66-10\n\n在新 `LinearLayout` 上拖入三个 `Button` 对象，并分别为每个按钮分配字符串资源，“Add”、“Find”和“Delete”。这种类型的按钮通常以无边界样式显示。对于每个按钮，使用属性工具窗口将\
  \ `style` 设置为 `Widget.AppCompat.Button.Borderless`并将 `textColor` 属性设置为 `?attr/colorPrimary`。将按钮的\
  \ `ID` 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\n![](img/as_3.4_change_style.jpg)\n\
  图 66-11\n\n在组件树中选中新的水平 `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮水平居中。在继续之前，确保将上述步骤添加的所有文本提取到字符串资源。\n\
  \n### 66.7 添加 RecyclerView\n\n在组件树中，点击新添加的水平 `LinearLayout` 条目左侧的展开箭头以折叠所有内容。\n\n\
  从调色板的 `Containers` 部分拖入 `RecyclerView` 实例并将其如图 66-12 所示置于按钮栏下方。注意确保 `RecyclerView`\
  \ 是父垂直 `LinearLayout` 视图的直接子视图，而不是水平按钮栏 `LinearLayout` 的子视图。\n\n![](img/as_3.6_tablelayout_recyclerview.jpg)\n\
  图 66-12\n\n在布局中选中 `RecyclerView` 后，将视图的 `ID` 更改为 `product_recycler`并将 `layout_height`\
  \ 属性设置为 `match_parent`。在继续之前，检查组件树面板中的布局层级结构是否符合所示：\n\n![](img/as_tablelayout_component_tree.jpg)\n\
  图 66-13\n\n### 66.8 调整布局边距\n\n\n\n剩下的只需调整一些布局设置。首先点击“组件树（Component Tree）”面板中的第一个\
  \ `TableRow` 条目使其选中。按住键盘上的 `Cmd/Ctrl` 键，然后点击第二个和第三个 `TableRows`、水平 `LinearLayout`\
  \ 以及 `RecyclerView`，以便选中所有五个项目。在“属性（Attributes）”面板中，找到 `layout_margin` 属性类别，找到后将其值更改为\
  \ `10dp`，如图 66-14 所示：\n\n![](img/as_3.4_layout_margin.jpg)\n\n图 66-14\n\n设置好边距后，用户界面应该如图\
  \ 66-1 所示。\n\n### 66.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种以行和列配置排列视图组件的方法。虽然 `TableLayout`\
  \ 视图提供了整体容器，但每一行以及其中包含的单元格都是通过 `TableRow` 视图的实例实现的。在本章中，在 Android Studio 中使用 `TableLayout`\
  \ 和 `TableRow` 容器设计了一个用户界面。下一章将为该用户界面添加功能，使用存储库（repository）和 Room 持久库来实现 SQLite\
  \ 数据库功能。\n\n## 67. Android Room 数据库和存储库教程\n\n本章将“Android Room 持久库”章节中获得的知识与上一章创建的初始项目相结合，提供一个详细的教程，演示如何使用\
  \ Room 持久库实现基于 SQLite 的数据库存储。遵循 Android 架构指南，该项目将使用视图模型（view model）和存储库。该教程将利用“Android\
  \ Room 持久库”中涵盖的所有元素，包括实体（entities）、数据访问对象（Data Access Object）、Room 数据库以及异步数据库查询。\n\
  \n### 67.1 关于 RoomDemo 项目\n\n上一章中创建的用户界面布局是创建一个简单的库存管理应用的第一步，该应用旨在存储产品的名称和数量。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前存储在数据库中的所有产品的可滚动列表。当数据库条目被添加或删除时，此产品列表会自动更新。\n\
  \n### 67.2 修改构建配置\n\n首先启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加一些额外的库，包括\
  \ Room 持久库。找到并编辑模块级 `build.gradle` 文件（`app -> Gradle Scripts -> build.gradle (Module\
  \ :app)`）并对其进行修改：\n\n```gradle\ndependencies {\n    implementation 'androidx.recyclerview:recyclerview:1.3.0'\n\
  \    implementation 'androidx.room:room-runtime:2.5.1'\n    annotationProcessor\
  \ 'androidx.room:room-compiler:2.5.1'\n}\n```\n\n### 67.3 构建实体\n\n该项目将从创建实体开始，实体定义了数据库表的结构。实体将包含一个用于产品\
  \ ID 的整数、一个用于存储产品名称的字符串列以及另一个存储数量的整数值。product id 列将作为主键并自动生成。表 67-1 总结了该实体的结构：\n\
  \n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / Primary Key / 自动 Increment\
  \ |\n| productname | String |\n| productquantity | Integer |\n\n表 67-1\n\n通过右键点击项目工具窗口中的\
  \ `app -> java -> com.ebookfrenzy.roomdemo` 条目并选择 `New -> Java Class` 菜单选项，为实体添加类文件。在新类对话框中，将类命名为\
  \ `Product`，选择列表中的 `Class` 项并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，将其修改为如下内容：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在有了对应数据库表的变量以及相应的 getter 和 setter\
  \ 方法。当然，在添加注解之前，该类还没有成为一个实体。在类文件仍然打开的情况下，为以下内容添加注解：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    @ColumnInfo(name = \"quantity\"\
  )\n    private int quantity;\n}\n```\n\n### 67.4 创建数据访问对象\n\n定义好实体后，下一步是创建 DAO。再次引用项目工具窗口，右键点击\
  \ `app -> java -> com.ebookfrenzy.roomdemo` 条目并选择 `New -> Java Class` 选项。在新类对话框中，在\
  \ Name 字段中输入 `ProductDao` 并在列表中选择 `Interface`，如图 67-1 所示：\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n\
  \n图 67-1\n\n按回车键生成新接口，并在加载了 `ProductDao.java` 文件后进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\nimport androidx.room.Insert;\n\
  import androidx.room.Query;\nimport java.util.List;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n   \
  \ void deleteProduct(String name);\n\n    @Query(\"SELECT * FROM products\")\n \
  \   LiveData<List<Product>> getAllProducts();\n}\n```\n\nDAO 实现了从数据库中插入、查找和删除记录的方法。插入方法接收包含要存储数据的\
  \ `Product` 实体对象，而查找删除记录的方法接收包含产品名称的字符串。`getAllProducts()` 方法返回包含数据库中所有记录的 `LiveData`\
  \ 对象。此方法将用于保持用户界面布局中的 `RecyclerView` 产品列表与数据库同步。\n\n### 67.5 添加 Room 数据库\n\n在向项目添加存储库之前，最后一项任务是实现\
  \ Room 数据库实例。向项目添加一个名为 `ProductRoomDatabase` 的新类，这次选择 `Class` 选项。\n\n文件生成后，按照“Android\
  \ Room 持久库”章节中概述的步骤对其进行修改。\n\n\n\n\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.content.Context;\nimport androidx.room.Database;\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n\n    private static ProductRoomDatabase INSTANCE;\n\
  \n    static ProductRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class) {\n\
  \                INSTANCE =\n                    Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                    ProductRoomDatabase.class,\n              \
  \                      \"product_database\").build();\n            }\n        }\n\
  \        return INSTANCE;\n    }\n}\n```\n\n## 67.6 添加仓库 (Repository)\n\n在项目中添加一个名为\
  \ `ProductRepository` 的新类，并选择 `Class` 选项。\n\n仓库类将负责代表 `ViewModel` 与 `Room` 数据库进行交互，并需要提供使用\
  \ `DAO` 来插入、删除和查询产品记录的方法。除了 `getAllProducts()` DAO 方法（返回一个 `LiveData` 对象）外，这些数据库操作都需要在主线程的独立线程上执行。\n\
  \n在 `ProductRepository.java` 文件中，添加一个处理程序的代码，用于将搜索结果返回给仓库线程：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport java.util.concurrent.ExecutorService;\nimport\
  \ java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults =\n            new MutableLiveData<>();\n\n    private List<Product>\
  \ results;\n\n    Handler handler = new Handler(Looper.getMainLooper()) {\n    \
  \    @Override public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，每当异步搜索任务完成时，搜索结果就会存储其中（在稍后的教程中，`ViewModel`\
  \ 内部的观察者将监控此活动数据对象）。\n\n仓库类现在需要提供一些可以供 `ViewModel` 调用以启动这些操作的方法。然而，为了实现这一点，仓库需要通过\
  \ `ProductRoomDatabase` 实例获取 `DAO` 。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n\
  ```java\nimport android.app.Application;\n\npublic class ProductRepository {\n \
  \   private final MutableLiveData<List<Product>> searchResults =\n            new\
  \ MutableLiveData<>();\n\n    private List<Product> results;\n    private final\
  \ ProductDao productDao;\n\n    public ProductRepository(Application application)\
  \ {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，可以按照以下方式将方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.delete(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmptyMessage();\n    });\n    executor.shutdown();\n}\n```\n\
  \n在插入和删除的情况下，会创建并使用相应的 `new` 线程来执行操作。在 `findProduct` 的情况下，向 `handler` 发送了一条消息。\n\
  \n完成仓库还剩最后一个任务。用户界面中的 `RecyclerView` 需要保持更新。`DAO` 类已经包含一个方法可以选择所有记录并将其封装在 `LiveData`\
  \ 中返回。一旦设置好，当发生变化时就可以更新 UI。在 `ProductRepository.java` 文件中，添加一个 `LiveData` 变量并在构造函数中调用\
  \ `getAllProducts()`：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic\
  \ class ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ =\n            new MutableLiveData<>();\n\n    private List<Product> results;\n\
  \    private final LiveData<List<Product>> allProducts;\n    private final ProductDao\
  \ productDao;\n\n    public ProductRepository(Application application) {\n     \
  \   ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用以获取 `allProducts` 和 `searchResults`\
  \ 活动数据对象引用的方法：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n \
  \   return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n### 67.7 添加 ViewModel\n\n`ViewModel` 负责创建\
  \ `repository` 实例，并提供 UI 控制器可以利用的方法和 `LiveData` 对象，以保持用户界面与底层数据库同步。正如 `ProductRepository.java`\
  \ 实现的，构造函数需要访问应用程序上下文。为了在 `ViewModel` 内部访问应用程序上下文以便传递给仓库，`ViewModel` 需要子类 `AndroidViewModel`\
  \ 而不是 `ViewModel`。\n\n首先，在 `Project` 工具窗口中找到 `com.ebookfrenzy.viewmodel` 条目，右键点击并选择\
  \ `New -> Java Class` 选项。接下来，将新类命名为 `MainViewModel` 并按回车键。最后，编辑新类文件将类扩展 `AndroidViewModel`\
  \ 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    private final ProductRepository\
  \ repository;\n    private final LiveData<List<Product>> allProducts;\n    private\
  \ final MutableLiveData<List<Product>> searchResults;\n\n    public MainViewModel(Application\
  \ application) {\n        super(application);\n        repository = new ProductRepository(application);\n\
  \        allProducts = repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n\n\n\n\n构造函数本质上创建了一个仓库实例，然后使用它获取结果和存活数据对象的引用，以便 UI 控制器可以观察到它们。现在\
  \ `ViewModel` 中剩下的工作是实现这些方法，这些方法将在 UI 控制器中响应按钮点击以及在 `LiveData` 对象上设置观察者时调用：\n\n\
  ```java\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n### 67.8 创建产品项布局\n\n数据库中每个产品的名称将显示在主用户界面的 `RecyclerView` 列表中。这需要一个包含 `TextView`\
  \ 的布局资源文件，用于列表中的每一行。现在通过在 Project 工具窗口中右键点击 `app` -> `res` -> `layout` 项，并选择 `New`\
  \ -> `Layout Resource File` 菜单来添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并加载到布局编辑器之前，将根元素更改为垂直\
  \ `LinearLayout`。在布局编辑器的 Design 模式下，从调板中将 `TextView` 对象拖到布局中，它默认将显示在布局的顶部：\n\n![](img/as_3.5_roomdemo_item_layout.jpg)\n\
  \n图 67-2\n\n在布局中选中 `TextView`，使用 `Attributes` 工具窗口将视图的 `ID` 设置为 `product_row`并将\
  \ `layout_height` 设置为 `30dp`。在 Component Tree 窗口中选择 `LinearLayout` 项，并将 `layout_height`\
  \ 属性设置为 `wrap_content`。\n\n## 67.9 添加 RecyclerView 适配器\n\n正如与 RecyclerView 和 CardView\
  \ 组件一起工作章节详细概述的那样，`RecyclerView` 实例需要一个适配器类来提供要显示的数据。现在通过在 Project 工具窗口中右键点击 `app`\
  \ -> `java` -> `com.ebookfrenzy.roomdemo` 项，并选择 `New` -> `Java Class` 菜单。在对话框中，将类命名为\
  \ `ProductListAdapter` 并在列表中选择 `Class`，然后按回车键。将生成的 `ProductListAdapter.java` 类加载到编辑器后，按如下方式实现该类：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\n\
  import com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter\n      extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n \
  \       ViewHolder(View iteview) {\n            super(iteview);\n            item\
  \ = iteview.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n### 67.10\
  \ 准备主 Activity\n\n最后一个需要修改的组件是 `MainActivity` 类，它需要在 `Button` 视图上配置监听器，并在 `ViewModel`\
  \ 类中的存活数据对象上设置观察者。在添加此代码之前，需要进行一些准备工作以添加一些导入和变量。编辑 `MainActivity.java` 文件并进行如下修改：\n\
  \n```java\nimport androidx.lifecycle.ViewModelProvider;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ MainViewModel viewModel;\n    private ProductListAdapter adapter;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        viewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        listener();\n \
  \       observerSetup();\n```\n\n在代码的各个阶段，应用需要清除用户界面中显示的产品信息。为了避免重复，添加以下 `clearFields()`\
  \ 函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在构建应用之前，需要将从 `onCreate()` 调设置方法添加到类中。\n\n### 67.1 添加监听器\n\n主用户界面布局包含三个按钮，每个按钮在点击时都需要执行特定任务。编辑\
  \ `MainActivity.java` 文件并添加 `listener()` 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \nprivate void listener() {\n    binding.addButton.setOnClickListener(view -> {\n\
  \        String name = binding.productName.getText().toString();\n        String\
  \ quantity = binding.productQuantity.getText().toString();\n        if (!name.equals(\"\
  \") && !quantity.equals(\"\")) {\n            Product product = new Product(name,\
  \ Integer.parseInt(quantity));\n            viewModel.insertProduct(product);\n\
  \            clearFields();\n        } else {\n            binding.productID.setText(\"\
  Incomplete information\");\n        }\n    });\n\n    binding.findButton.setOnClickListener(view\
  \ -> {\n        viewModel.findProduct(binding.productName.getText().toString());\n\
  \    });\n\n    binding.deleteButton.setOnClickListener(view -> {\n        viewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行了一些基础检查，确保用户输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 对象（注意，数量字符串被转换为整数以匹配实体数据类型）。然后调用 `ViewModel.insertProduct()` 方法并传递 `Product`\
  \ 对象，最后清除字段。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n## 67.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` 存活数据对象保持同步。在 `MainActivity.java` 文件中，按如下实现\
  \ `observerSetup` 方法：\n\n```java\nimport java.util.Locale;\n\nprivate void observerSetup()\
  \ {\n    viewModel.getAllProducts().observe(this,\n            products -> adapter.setProductList(products));\n\
  \n    viewModel.getSearchResults().observe(this,\n        products -> {\n      \
  \      if (products.size() > 0) {\n```\n\n\n\n\n\n```java\nbinding.productID.setText(String.format(Locale.US,\
  \ \"%d\",\n    products.get(0).getId()));\nbinding.productName.setText(products.get(0).getName());\n\
  binding.productQuantity.setText(\n    String.format(Locale.US, \"%d\",\n       \
  \ products.get(0).getQuantity()));\n} else {\n    binding.productID.setText(\"No\
  \ Match\");\n}\n});\n}\n}\n``````\n\n“所有产品”观察者简单地将当前的产品列表传递给 `RecyclerAdapter` 的\
  \ `setProductList()` 方法，显示的列表将在此处更新。\n\n“搜索结果”观察者检查数据库中是否至少找到一个匹配的结果，从列表中提取第一个匹配的\
  \ `Product` 实体对象，从对象中获取数据，在需要时进行转换并分配给布局中的 `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品\
  \ ID `TextView` 上的消息通知用户。\n\n最后，输入现有产品的名称，将其从数据库中删除，并确认它已从 `RecyclerView` 产品列表中移除。\n\
  \n## 67.13 初始化 RecyclerView\n\n添加最终设置方法以初始化和配置 `RecyclerView` 和适配器，如下：\n\n```java\n\
  import androidx.recyclerview.widget.LinearLayoutManager;\n\nprivate void recyclerSetup()\
  \ {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n    binding.productRecycler.setLayoutManager(\n\
  \        new LinearLayoutManager(getContext()));\n    binding.productRecycler.setAdapter(adapter);\n\
  }\n}\n```\n\n## 67.14 测试 RoomDemo App\n\n在设备或模拟器上编译并运行应用，添加一些产品并确保它们自动出现在 `RecyclerView`\
