    you have 7 grapes that are available. The semicolon at the end is used to tell
    your code that you are done talking and that it can move onto the next thing that
    is written in the code. It is like the period at the end of the sentence, but
    it is there so that your code will know when it needs to stop.


    If you want to tell your visitors that there are 7 grapes that are available,
    all you have to do is write out a variable alert:


    ```javascript

    alert(''We have’ + grapes + ‘ grapes!’);

    ```

