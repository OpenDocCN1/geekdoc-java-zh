- fmt: '

    Since there is often a lot going on when you are coding, and you will need to
    remember many different things, you should write down the information as you go
    because without that information you may forget what you did to code the right
    way. Always do different things with the codes that you have and always try to
    make sure that they are written in the right way.


    ## Something New


    Don’t be afraid to try new things when you are coding. If you find a code that
    you want to try but that you have no use for, always go back to that initial practice
    web page that you had.


    Even the most experienced developers will try something new if they find it. It
    may also be helpful to try on your own to write the code. Try to put different
    information in and see what happens. This is great but document it so that you
    can come back and remove it if it does not work out or if it causes your page
    to lose a lot of information. You never know what changing around a code can do
    so document it to enable yourself to come back later and delete it.


    If you find something that you really like to do with the codes that you have,
    you should mark that down. Consider making a place in your document for things
    that you have tried and really like. While these are things that you will probably
    remember the most, you will still also want to have a reference point for them
    when you are learning how to do more things. As soon as you find something new
    in `JavaScript`, you should make every effort possible to be able to include it
    in your document.


    If you find something that you don’t like, blacklist it. That means that you should
    have a place in your document for things that you don’t like. That way, when you
    want to look for something new to do in the document, you will know not to get
    it from there because you didn’t like it the last time that you did it.


    ## Changing Things


    Changes are the best thing about `JavaScript` and will allow you to make the colors
    look different as well as the styles.


    To change the color in your `JavaScript`, all you need to do:


    ```

    var color= documentname.col.style.color = “color”

    ```


    The color that you are using can be something like red, blue or yellow to get
    a basic color. If you want to do different colors or colors that will stand out
    and be customized, use a color wheel. The color wheel that you will likely use
    on the Internet and when you are writing `JavaScript` is called a `hex`. This
    is the code for the color that you want to use. Every color has a set of letters
    and numbers that makes it unique. It starts with `FFFFFF` for white and `000000`
    for black. There are hundreds of colors that are in between, and the most involved
    `hex` codes will have many different shades of each color. Find the one that you
    like and put that where “color” is written into the code.


    When you want to have the text stop having that color or have the different object
    in your `JavaScript` markup to stop having that color, all you need to do is `</color>`.
    In general, using the `/` in between the `<>` brackets will stop something and
    return it back to the automatic color. If you want to change the color again,
    simply write a new `var color` code.


    To change the size, all you need to do is:


    ```

    var str = “Words that you want to have the same font.”

    var result = str.fontzise(14)

    ```


    The font sizes will have different meanings and can be different depending on
    the browser that you are looking at the web page with. Be sure to learn the font
    sizes and to keep track of the way that they work. It is a good idea to have a
    way that you can compare the difference in something like font size `1` and `14`.
    For many things, you will use anywhere from a `10` to a `16` with headings usually
    being in the `20’s`. The smaller font sizes, like `1-6`, will be used for small
    information that you don’t necessarily want people to be able to easily read.


    ## Making Notes


    As you make the web page and enjoy the different things that you can do with it,
    you should make sure that you are making notes.


    If you are using a document to keep track of everything, make sure that you keep
    a “notes” section. The notes will allow you the chance to write down different
    things that may not be coded.


    For example, you could include this in your notes:


    “Used color code for `FF5581` and liked the color combined with the `000000`.
    The combination looked good and used a bold tag of `<b>` to make it pop more on
    the page. Text size did not make a difference because it looks great and shows
    up in nearly every color.”


    The more that you do `JavaScript` and the more pages that you create, the more
    notes you will have so be sure to leave plenty of room for different things included
    in the notes section.


    ## Chapter 6: Hiring a Professional


    When you are considering `JavaScript` and what all you can learn from it, it may
    be tempting for you to try to find someone who can teach you everything that you
    need to know. A professional is able to both teach you the way of `JavaScript`
    and simply do it for you. This is the easy way out and something that many people
    choose to do so that they not have to learn something new. You can hire a professional,
    but why would you if you can learn it yourself? To save time, of course.


    Doing it yourself, though, isn’t for everyone. The information about hiring a
    professional will help you decide if that is the right decision for you. If that
    is the case, you should continue reading this chapter, but you should not continue
    reading the series. Doing so will teach you how to write `JavaScript`…which is
    not something that you want to do, right?


    ### Do It For You


    There are professionals who are able to do all of the `JavaScript` work for you.
    They are able to do it in a quick manner, and they can charge you a great deal
    of money for the work that they do since it is a professional skill that they
    have. They want to make money from you, and they will do everything that they
    can to do that.


    Many experts will not let in on the fact that they have templates saved and that
    it will only take them a short amount of time to finish it. Instead, they will
    tell you that it can take weeks and that it will cost a lot of money both upfront
    and throughout the process because their time is valuable.


    The secret of these professionals?


    They’re just people who have learned how to do `JavaScript` and perfected the
    craft. They are no different than what you could be if you continue on with the
    series and learn everything that you can about `JavaScript`. They make their money
    by telling you that they have the best service, but they are no different than
    what you could be if you learned.


    ### A Teacher


    If you do want to learn `JavaScript`, your first thought may be that you should
    just hire someone to help you learn all about it. These are people who may not
    necessarily sell their `JavaScript` services, but they sell the idea that they
    can help you learn how to do what the professionals do. They charge you to show
    you the things that you would typically be able to learn on your own.


    They have their own notebooks and documentation that they have made during their
    JavaScript writing days, and they want to charge you to show you what you can
    do. They likely have the same books as you, the same search engines to find codes
    and the same capabilities that you have when it comes time to do different things
    with JavaScript.


    A teacher is great, but you may not get everything that you want out of him or
    her. You may end up spending a lot of money and not getting the results that you
    desire. You may also want to learn more that they cannot teach you. When it comes
    to the JavaScript that they have taught you, you can even even find out things
    on your own. You may still need to use your own resources to find it.

