    # Introduction

    Congratulations on downloading this book and thank you for doing so.


    The following chapters will discuss how you can effectively learn JavaScript.
    While the chapters will not necessarily teach you JavaScript (although, there
    are some quick tips), they will teach you the right way to go about learning it.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # Chapter 1: Prepare to Learn

    The most important step that you will take when you are considering learning how
    to write JavaScript is preparing to learn what you need to do. Part of that preparation
    includes learning what, exactly, `JavaScript` is and how it originated. You should
    also prepare by learning the benefits of `JavaScript` over another coding language
    so that you can make sure you are really learning the right language for your
    website.


    ### What is It?

    `JavaScript` is a language. It is not like most of the languages that you know
    or has heard of in that it is only in written form and it is based on technology.
    It is a way to communicate things to people who are on the other side of a web
    page, and it allows you the chance to make sure that you have gotten your point
    across on your website. You can’t speak `JavaScript`. If you did, it would sound
    choppy and would probably not make too much sense.


    When you write something from the back end of your website in `JavaScript`, when
    it appears to the people who visit your website, it will look like you have actually
    written on it. If you do not use a coding language, your website would just appear
    to be many random numbers, symbols, and letters which could not only be confusing
    for your visitors but could be detrimental for anyone who wanted to enjoy your
    website. It could hurt the goal you are trying to accomplish with your site.


    There are many different coding languages that you can use, but `JavaScript` is
    one of the most popular. It allows you to change the way that your fonts look,
    adds clickable buttons and makes your website completely functional when people
    want to do different things on it. It is also one of the easiest coding languages
    that you can learn.


    ### Where Did it Come From?

    `JavaScript` officially became available on operating systems in 1995. This was
    when it was first used on computers, and `Netscape` was the first to recognize
    it for what the coding was able to do. It was used to help create web pages and
    other things that people would see when they are using their personal and office
    computers.


    Since the name was so similar to other names of different types of coding, some
    programs opted to call it `JScript` instead of `JavaScript`. This was the decision
    of the people who manufactured the operating systems and it is something that
    did not really stick. Most companies call it `JavaScript` now, and they do not
    get confused with other programs that are available on the market because it is
    something that has been able to be much different than some of the other things
    that are available now.


    When `JavaScript` was first created, it was done so that everybody would be able
    to use it. In the past, before 1995, the coding was difficult to do, and not many
    people knew how to do it. It was something that was somewhat of a rarity. While
    not everyone is able to do coding now, `JavaScript` has made it easier, and many
    more people are able to make sure they are getting things done the right way when
    it comes to.


    ### Are There Benefits?

    Among the many benefits that come with using `JavaScript`, ease of use is one
    of the biggest. It allows people to be able to do more with what they have at
    disposal and it gives them the option to learn a coding language quicker than
    any of the other coding languages that are used on programs.


    `JavaScript` is nearly foolproof in that others had come before and created the
    development necessary to just plug in the codes where they need to be. While it
    is important that people also learn how to write `JavaScript` if they want to
    use it all of the time, they can also just use the codes that have already been
    written. Anyone can get started with `JavaScript` in this way because it is easy
    to use.


    Other benefits include the ability to make things on web pages clickable, the
    ability to create interactive web pages and the ability to do more with what there
    is to offer on the `JavaScript` platforms. Anyone who knows how to use and wants
    to use `JavaScript` can use it to be able to increase the way that their web page
    looks. They can also use it to help themselves create more of a visitor-friendly
    atmosphere on their web page.


    All around, `JavaScript` is one of the best coding languages because of the way
    that people can use it easily and because of the many things that it brings to
    the table. It is a good idea for people who are just getting with coding to start
    out with `JavaScript` because of the ease of use.


    ### Will You Use It?

    Nearly everyone who has learned `JavaScript` has found that they use it. Whether
    they use it often on their own website or use it to help others out with their
    websites, `JavaScript` definitely comes in handy.

