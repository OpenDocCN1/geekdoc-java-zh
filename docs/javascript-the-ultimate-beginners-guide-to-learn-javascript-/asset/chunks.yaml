    由于编码时通常会有很多事情发生，而且你需要记住许多不同的事情，因此你应该边做边记录这些信息，因为如果没有这些信息，你可能会忘记自己是如何编写出正确代码的。始终对你已有的代码进行不同的尝试，并始终确保它们是以正确的方式编写的。


    ## 尝试尝试


    在编码时，不要害怕尝试新事物。如果你发现了一些想要尝试但又用不到的代码，请始终回到你最初的那个练习网页。


    即使是经验最丰富的开发者，在发现新事物时也会尝试尝试。自己尝试编写代码也可能很有帮助。尝试输入不同的信息并看看会发生什么。这很棒，但请将其记录下来，这样当它不起作用或导致你的页面丢失大量信息时，你可以回来并将其删除。你永远不知道修改代码会产生什么影响，所以请记录下来，以便你以后回来删除它。


    如果你发现了你非常喜欢用现有代码做的事情，你应该把它标记下来。考虑在你的文档中留出一个空间，存放那些你尝试过并且非常喜欢的东西。虽然这些可能是你记得最深的事情，但在学习如何做更多事情时，你仍然希望对它们有一个参考点。一旦你在
    `JavaScript` 中发现新东西，你就应该尽一切将其包含在你的文档中。


    如果你发现了一些你不喜欢的东西，就把它列入黑名单。这意味着你应该在文档中留一个空间，存放你不喜欢的东西。这样，当你想要在文档中寻找新尝试的方法时，你就知道不要从那里获取了，因为你上次做时并不喜欢。


    ## 改变事物


    改变是 `JavaScript` 最棒的地方，它将让你能够颜色以及样式看起来都不不同。


    要在你的 `JavaScript` 中更改颜色，你只需要做：


    ```

    var color= documentname.col.style.color = “color”

    ```


    你使用的颜色可以是红色、蓝色或黄色等基础颜色。如果你想制作不同的颜色或脱颖而出的自定义颜色，请使用调色轮。你在互联网上和编写 `JavaScript` 时可能会使用的色轮被称为
    `hex`（十六进制）。这是你想要使用的颜色代码。每种颜色都有一组独特的字母和数字使其独一无二。它以 `FFFFFF` 代表白色，以 `000000` 代表黑色。其间有数百种颜色，最复杂的
    `hex` 代码将包含每种颜色的许多不同深浅。找到你喜欢的那个，并把它放在代码中编写“color”的地方。


    当你想要让文本不再显示那种颜色，或者让 `JavaScript` 标记中的不同对象不再显示那种颜色时，你只需要写 `</color>`。通常情况下，在`<>`
    括号之间使用 `/` 会停止某些操作并将其恢复为自动颜色。如果你想再次更改颜色，只需编写新的 `var color` 代码即可。


    要更改大小，你只需要做：


    ```

    var str = “你希望具有相同字体的。”

    var result = str.fontzise(14)

    ```


    字体大小将具有不同的含义，并且取决于你查看网页时使用的浏览器。务必学习字体大小并跟踪它们的工作方式。拥有一种可以比较字体大小 `1` 和 `14` 之间差异的方法好主意。对于很多事情，你会使用
    `10` 到 `16` 之间的任何数字，标题通常在 `20` 左右。较小的字体（如 `1-6`）将用于你不一定想让人们轻松阅读的小信息。


    ## 笔记


    当你制作网页并享受用它能做的不同事情时，你应该确保自己正在做笔记。


    如果你使用一个文档来跟踪一切，请确保你保留一个“笔记”部分。笔记将让你有机会写下可能没有编写成代码的不同事情。


    例如，你可以在笔记中包含这些内容：


    “使用了颜色代码 `FF5581` 并喜欢这种颜色与 `000000` 的组合。这种组合看起来很好，并使用了加粗标签 `<b>` 使在页面上更加突出。字体大小没有区别，因为它看起来很棒，并且几乎每种颜色都能显示。”


    你做的 `JavaScript` 越多，创建的页面越多，你的笔记就越多，所以请确保为笔记部分的各种内容留出空间。


    ## 第 6 章：聘请专业人士


    当你考虑 `JavaScript` 以及你从中可以学到的所有东西时，你可能会想要找一个能教你所需要的所有知识的人。专业人士既能教你 `JavaScript`
    的方法，也可以直接为你完成。这是一种省事的做法，也是许多人选择这样做，这样他们就不需要学习新东西。你可以聘请专业人士，但如果你自己能学会，为什么要这样做呢？当然是为了节省时间。


    然而，自己做并不适合每个人。关于聘请专业人士的信息将帮助你决定这是否对你是一个正确的决定。如果是这样，你应该继续阅读这一章，但你不应该继续阅读该系列。这样做将教你如何编写
    `JavaScript`……这并不是你想要的，对吗？


    ### 为你做


    有些专业人士可以为你完成所有的 `JavaScript` 工作。他们能够快速完成，并可以向你收取高额费用，因为这是他们拥有的技能。他们想从你身上赚钱，并且会尽一切所能。


    这些专业人士的秘密是什么？


    他们只是学会了如何编写 `JavaScript` 并完善了这项工艺的人。如果你继续学习系列并学习关于 `JavaScript` 的一切知识，他们与你可能变成的样子没有区别。他们通过告诉你他们有最好的服务来赚钱。


    ### 老师


    如果你想学习 `JavaScript`，你的第一个想法可能是找某人来帮助你学习关于它的一切。这些人并不一定推销 `JavaScript` 服务，但他们推销可以帮助你学习像专业人士一样工作的想法。他们向你展示那些你通常可以自己学习的内容。

    '
- fmt: '

    Instead of finding out what you need to know on your own, you will need to learn
    what the teacher teaches you. It can take a long time, it will be costly, and
    you may not learn everything that you need to know.


    ## Learn a Skill


    For those who have read those two sections, you likely now know that you will
    be much better off if you just learn the `JavaScript` on your own. You do not
    need a teacher, you do not need a professional. You only need something that can
    show you all of the different things that you can do and in a way that makes sense
    to you.


    It is a good idea to do it yourself because you will learn a valuable skill. Learning
    this skill will give you the ideas that you need to make things on your own web
    page and to get creative with the `JavaScript` process.


    Once you have learned everything that you can about `JavaScript`, you can even
    become one of those professionals or teachers. They charge a lot, so that means
    that they make a lot of money for a little bit of work. If you are confident in
    your `JavaScript` skills, you will be able to do the same thing and get the money
    out of it. Even if you don’t want to teach or do `JavaScript` for people to make
    money, having this as a skill can be very helpful for you.


    ## Expensive


    Hiring someone to do the work for you or getting a teacher to show you how to
    do it is not the answer. It is a good idea to learn as much as possible from what
    you can in this series. Purchasing the rest of the books in the series about `JavaScript`
    will likely be far less expensive than even a first lesson with a teacher. It
    will be just a fraction of the cost of hiring one to do your `JavaScript`.


    Since you can move at your own pace, it may even be quicker for you to do it yourself.
    This will give you a chance to learn more, to do more and to start making money
    from it. You can save a lot of money by not hiring a professional, but you can
    make a lot of money by becoming an expert at `JavaScript`. Make sure that you
    are ready to learn and to continue doing well with each of the `JavaScript` things
    that you learn in these books.


    If you feel that you have learned what you need to know from this book, congratulations.
    You are no longer a beginner, and you can move on to the different things with
    `JavaScript`. Try out everything that this book has taught you and get ready to
    start becoming a `JavaScript` professional. You will be able to benefit from it
    in now time. Just learning the few codes that were included in this book will
    be enough to get you started. In fact, you could build a whole web page from these.
    It wouldn’t be very fun or interactive, but it would be something that you could
    do on your own.


    As you begin to learn more, keep in mind all of the things that this book taught
    you. Always document the changes that you made, keep things in one location and
    use the information that you learned to look back in reference. Even professionals
    may forget how to change the color of their text or the size of their font sometimes.
    Keeping track and documenting everything will allow you to always have a place
    you can go back to that is simpler than the advanced `JavaScript` you will learn.


    ## Conclusion


    Thank for making it through to the end of this book, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    they may be.


    The next step is to begin using the `JavaScript` that you have learned and start
    preparing. You can also check out the rest of the books in this series to learn
    much more than just the basics of `JavaScript`. The more you read about it, the
    more you will learn how to write it and what you can use it for.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!

    '
