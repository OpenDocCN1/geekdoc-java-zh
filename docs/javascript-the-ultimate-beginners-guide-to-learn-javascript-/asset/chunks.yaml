    Using the tag method may be easier for you depending on the type of host that
    you are using. When you use this method or even the link method, you will want
    to make sure that you are saving the information that you put into it. When you
    are working on the platform, you can save the work that you are working on without
    ever having to show your visitors the unfinished product. Your website will not
    appear to be live if you are working on it and visitors will just see an error
    message or a blank page.


    Once you have finished working on it and adding all of the JavaScript that you
    want to it (and saving it in the process), you can publish it. Your visitors will
    not see the changes that you made or the JavaScript that you put into your site
    until you decide to use the `publish` function on your host for your page.


    ## Format It


    You can format the different things that are in your JavaScript. The first thing
    that you want to do is design the landing page using the JavaScript. You can do
    this through `alerts` and `prompts`, or you can start out with a “script background”
    tag. You can make the background anything that you want. It can be a solid color
    or it can be something that you have taken a picture of. Always make sure that
    you are within your rights if you are using a picture as the background of your
    web page.


    You can then add different things to the page. You can use a welcome alert that
    will pop up as soon as people visit your page. You can also use the different
    `prompts` that you have learned about to make sure that people know what they
    are supposed to be doing on the page.


    Once you have learned all about the JavaScript that you can use for your site,
    you can start to change the colors and the way it looks when people first visit
    your site. This will allow you the chance to make sure that things look better
    and that they are being done the right way.


    It is a good idea to only do this after you have done the basic part of your web
    page. For example, you want to make sure that you have all of your information
    put on the web page using JavaScript before you make the decision to change the
    colors or the fonts on the web page. Always make sure that you can do everything
    possible with the JavaScript before you begin to do any type of heavy customization
    with the page that you are creating.


    ## Use As Template


    It can be hard to make sure that you have all of your formatting correct when
    you are writing the JavaScript. Since it is time-consuming to do all of this,
    you should save your work often. If you make a web page that you like with JavaScript,
    you can save it as a template to use later on with the other pages that you are
    creating under the same domain name or even under a different one. These can be
    used as templates or as starting points where you can add to them or tweak them,
    but you won’t have to completely rewrite the page each time that you want to make
    a new page.


    The more experienced you get with writing JavaScript, the more likely you will
    be to have many of these templates. You will likely have a few different templates
    that you like to use with the different pages that you have, and this will allow
    you the chance to do more with what you have. It will also give you the chance
    to make sure that you have to do less work when you are starting out with a page.
    In addition to these templates, you can also find ones that others have made with
    JavaScript and use those. While this is a great “cheat” way to get started, it
    will not teach you everything that you need to know about JavaScript.


    The easiest way for you to learn as much as possible about JavaScript is to start
    doing it on your own. Even if you have no need for a website or a web page, make
    one that you can practice your JavaScript with as you are learning to do more
    with the skill.


    ## Chapter 5: Document JavaScript


    You will never completely learn what you are doing with JavaScript if you do not
    mark down what you have done and what it does with the JavaScript that you have
    done. Make sure that you learn as much as possible about the JavaScript and always
    keep track of what you are doing with it and what you have done with it. This
    will show you what all you have learned and what you need to learn. It will also
    work as somewhat of a reference dictionary for you to be able to keep track of
    the JavaScript that you know and the JavaScript that you learn how to do.


    There are two ways that you can document. You can do it on the computer, or you
    can do it in real time. If you want to do it on a computer, begin by opening a
    Word document or another type of processing document. Don’t use a Notepad document
    because it may not work out well and it may end up getting marked up. As you learn,
    write it down. If you learn a lot about JavaScript, begin to organize the document
    in a way that makes sense to you. You can organize it by simple codes, different
    observations and even with prompts. Make sure that you include:


    - How to code a background

    - How to change font colors (or any colors)

    - How to change the font style

    - Where to move things to

    - How to make an alert and format it

    - How to make a prompt and format it

    - Changes to the way that you write different things

    - Sizes of fonts, objects, and even pages


    You can do this by organizing the Word document into different “sections” and
    labeling them. This is easy because you will always have it with you if you are
    working on your computer and you will always be able to find the exact instructions
    that you need to make sure that you are getting it done the right way.


    Another thing that you can do is keep your JavaScript documentation out of your
    computer and in “real life.” You can use a subject notebook to keep track of the
    information. When you first start out, divide it into different sections like
    fonts, alerts, and formats. As you learn different things, add them to the section
    that they correspond to.


    ### When You Learn


    As you are learning more about JavaScript and you find different codes that you
    can use, write them down. Don’t just use them and forget about them.


    For example, when you learned how to make an alert using JavaScript, you may have
    begun to use it when you were coding. This is a great way to make sure that you
    have a lot of practice, but you will need to return to this book if you forget
    how you did it. Write it down somewhere that is not on your JavaScript page.


    ### As You Code


    It is obvious that you are going to write down the codes that you learn into the
    actual JavaScript documentation but you should also write down what you did in
    the document that you are keeping for reference. Write down the code that you
    used, what it did and what it looked like when you did it.


    Doing this will allow you to come back to it if you need to on but it will also
    serve as a way to change it if something goes wrong with the code while you are
    reviewing it and testing it out. You can see exactly what you did (which can sometimes
    be hard to remember on your own) and see what you need to do to make sure that
    you do it the right way. Change it if you need to but keeping it in the document
    will allow you to see what you shouldn’t do if something goes wrong with the code.

