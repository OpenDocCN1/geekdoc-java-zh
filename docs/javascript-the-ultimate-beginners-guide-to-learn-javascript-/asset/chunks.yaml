    取决于你正在使用的主机类型，使用标签方法可能对你来说更容易。当你使用这种方法甚至使用链接方法时，你想要确保保存了你存入其中的信息。在平台上进行工作时，你可以保存正在进行的工作，而无需向访问者展示未完成的产品。当你正在处理网站时，你的网站将不会显示为在线状态，访问者只会看到错误信息或空白页面。


    一旦你完成了工作并添加了所有你想要的 JavaScript（并在此过程中保存了它），你就可以发布它了。在你决定在主机上对页面使用 `publish` 函数之前，你的访问者看不到你所做的更改或你放入网站的
    JavaScript。


    ## 格式化它


    你可以对 JavaScript 中的不同内容进行格式化。你想做的第一件事是使用 JavaScript 设计落地页。你可以通过 `alerts` 和 `prompts`
    实现这一点，或者从一个“脚本背景”标签开始。你可以设置任何你想要的背景。它可以是纯色，也可以是你拍摄的照片。在将图片作为网页背景使用时，请请务必确保你拥有相关权利。


    然后，你可以在页面上添加不同的内容。你可以使用在人们访问页面时立即弹出的欢迎警报（alert）。你还可以使用你学过的不同 `prompts`，确保人们知道他们在页面上应该做什么。


    一旦你学会了所有可以用于你网站的 JavaScript，你就可以开始更改颜色以及人们首次访问你网站时的外观了。这将让你有机会确保事物看起来更好看，并确保它们是以正确的方式执行的。


    在完成网页的基础部分后再进行此操作是一个好主意。例如，在决定更改网页的颜色或字体之前，你想要确保已经使用 JavaScript 将所有信息都放在网页上。在开始对你创建的页面进行任何类型的深度定制之前，请务必确保你已经通过
    JavaScript 完成了所有可能的操作。


    ## 作为模板


    在编写 JavaScript 时，要确保所有的格式都正确可能是困难的。由于完成所有这些非常耗时，你应该经常保存工作。如果你用 JavaScript 制作了一个你喜欢的网页，可以将其保存为模板，稍后在同一域名下甚至不同域名下创建的其他页面中时它。这些可以作为模板或起点，你可以在其基础上添加或进行调整，但你就不需要每次想创建一个新页面时都完全重写页面了。


    你编写 JavaScript 的经验越丰富，就越可能拥有许多此类模板。你可能会有几个不同的模板，用于你拥有的页面，这将让你有机会利用现有资源做更多事情。它还将让你在开始制作页面时确保需要做更少的工作。除了这些模板之外，你还可以找到别人用
    JavaScript 制作的模板并使用它们。虽然这是一个入门的极佳“捷径”方法，但它并不会教你关于 JavaScript 所需的所有知识。


    你尽可能学习 JavaScript 的最简单方法是开始亲自动实践。即使你不需要网站或网页，也做一个，以便在你学习如何利用这项技能完成更多事情时用它来练习你的
    JavaScript。


    ## 第 5 章：记录 JavaScript


    如果你不记录你用 JavaScript 做了什么以及你编写的 JavaScript 的作用，你永远无法完全掌握你在 JavaScript 上的操作。确保你尽可能多学习
    JavaScript，并始终跟踪你正在用它做什么以及已经做过了什么。这将向你展示你学了什么以及你还需要学习什么。它还可以充当你的参考字典，方便你跟踪你已经掌握的
    JavaScript 和你学会做的 JavaScript。


    你有两种方法可以进行记录。你可以在计算机上进行，也可以实时进行。如果你想在计算机上进行，请从打开一个 Word 文档或其他类型的处理文档开始。不要使用记事本文档，因为它的效果可能不好，并且最终可能会被标记格式。在学习过程中，把它写下来。如果你学习了许多
    JavaScript，开始以一种符合你逻辑的方式来组织文档。你可以通过简单的代码、不同的观察结果甚至提示（prompts）来组织。确保你包含了：


    - 如何编写背景

    - 如何更改字体颜色（或任何颜色）

    - 如何更改字体样式

    - 将内容移动到哪里

    - 如何制作警报（alert）并对其格式化

    - 如何制作提示（prompt）并对其格式化

    - 编写不同内容的方式的变化

    - 字体、对象甚至页面的大小


    你可以通过将 Word 文档组织成不同的“章节”并对其进行标记来实现。这很容易，因为如果你在计算机上工作，它会一直在你身边，你将能够找到所需的确切指令，以确保你以正确的方式完成任务。


    另一个你可以做的事情是将你的 JavaScript 文档离开计算机，放在“现实生活中”。你可以使用主题笔记本来跟踪这些信息。当你刚开始时，将其分为不同的部分，如字体、警报和格式。当你学习到不同的内容时，将它们添加到相应的章节中。


    ### 当你学习时


    当你学习更多关于 JavaScript 并发现可以使用的不同代码时，把它们写下来。不要只是用了它们就忘记了。


    例如，当你学会如何使用 JavaScript 制作警报（alert）时，你可能在编码时就开始使用它。这是一个确保你有大量练习的极佳方法，但如果你忘记了是如何做的，你需要返回这本书。把它写在不是你的
    JavaScript 页面的地方。


    ### 当你编写代码时


    显而易见，你会把学到的代码写入实际的 JavaScript 文档中，但你也应该在你留作参考的文档中写下你做了什么。写下你使用的代码、它的作用以及你执行它时的样子。


    这样做将让你在需要时可以回来查看，当你在审查和测试代码时，如果代码出现问题，它也可以作为更改代码的方法。你可以清楚地看到你做了什么（这有时靠自己记忆很难），并看到你需要做什么来确保你以正确的方式执行。如果需要，可以更改它，但保留在文档中可以让你在代码出现问题时看到你不应该做什么。

