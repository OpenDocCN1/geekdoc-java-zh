    # 介绍

    恭喜你下载本书，感谢你的支持。


    接下来的章节将讨论你如何有效地学习 JavaScript。虽然这些章节不一定会教你 JavaScript（尽管有一些快速小技巧），但它们将教你学习它的正确方法。


    市面上有很多许多关于这个主题的书，再次感谢你选择这一本！我们已尽一切努力确保它包含尽可能有用的信息，请尽情享受！


    # 第 1 章：学习准备

    当你考虑学习如何编写 JavaScript 时，采取的最重要的一步是准备好学习你需要要做的事情。准备工作的一部分包括了解 `JavaScript` 究竟是什么以及它是如何起源的。你还应该通过学习
    `JavaScript` 相比其他编程语言的优势来做好准备，以确保你确实为你的网站学习了正确的语言。


    ### 它是什么？

    `JavaScript` 是一种语言。它与你了解或听过的大多数语言不同，因为它仅以书面形式存在，并且基于技术。它是与网页另一端的人进行交流的一种方式，让你有机会确保你已经在网站上传达了你的观点。你不能“说”
    `JavaScript`。如果你这样做，它听起来会断断续续，而且可能没什么意义。


    当你从网站的后端用 `JavaScript` 编写内容时，访问你网站的人看到它，看起来就像是你实际上在上面写了东西。如果你不使用编程语言，你的网站看起来就像许多随机的数字、符号和字母，这不仅会让你的访问者感到困惑，而且对任何想要享受你网站的人不利。它可能会损害你试图通过网站实现的目标。


    有许多不同的编程语言可以使用，但 `JavaScript` 是最流行的语言之一。它允许你更改字体的外观，添加可点击的按钮，并在人们想要在网站上执行不同的操作时让你的网站具有完全的功能性。它也是你可以学习的最简单的编程语言之一。


    ### 它从哪里来？

    `JavaScript` 于 1995 年正式在操作系统可用。这是它首次在计算机上使用，`Netscape` 是第一个识别出这种代码能够实现的功能。它被用于帮助创建网页以及人们在使用个人和办公计算机时看到的其他内容。


    由于该名称与其他不同类型的编码名称非常相似，某些程序选择将其称为 `JScript` 而不是 `JavaScript`。这是制造操作系统的者的决定，但这个决定并没有真正流行。现在大多数公司都称之为
    `JavaScript`，它们不会与市场上的其他程序混淆，因为它已经与现在提供的某些东西大不相同。


    当 `JavaScript` 最初被创建时，是为了让每个人都能使用。在过去，1995 年之前，编程非常困难，很少有人会这样做。它曾是一种稀有物。虽然现在不是所有人都能编程，但
    `JavaScript` 让它变得更容易，更多的人可以确保他们以正确的方式完成工作。


    ### 有什么好处吗？

    在使用 `JavaScript` 的许多优点中，易用性是最大的之一。它允许人们利用现有的资源做更多事情，并让他们有比其他任何编程语言更快学习的机会。


    `JavaScript` 几乎是万无一失的，因为已经有人先行并创建了必要的开发，人们只需插入代码。虽然如果人们想要一直使用它，学习编写 `JavaScript`
    是重要的，但他们也可以直接使用已经编写的代码。任何人都可以这种方式开始学习 `JavaScript`。


    其他优点包括让网页上的内容变得可点击、创建交互式网页以及利用 `JavaScript` 平台提供的功能做更多事情。任何知道并想使用 `JavaScript`
    的人都可以利用它来提升他们网站的外观。他们还可以利用它来帮助自己营造更加对访问者友好的氛围。


    总之，`JavaScript` 是最好的编程语言之一，因为人们可以轻松使用它，并且因为它带来了许多好处。


    ### 你会使用吗？

    几乎每个学习过 `JavaScript` 的人都发现他们确实在使用它。无论是在自己的网站上经常使用它，还是帮助他人处理网站，`JavaScript` 确实非常有用。


