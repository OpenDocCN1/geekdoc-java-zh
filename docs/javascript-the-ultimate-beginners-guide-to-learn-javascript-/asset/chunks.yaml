    直接在标签中编写代码略有不同，但你仍然需要确保尽可能频繁地保存。你可以将其保存在网络浏览器中，也可以将其保存到 `different area`（不同的区域），以便你能够尽可能地完成工作。如果你决定直接在标签内编写，你可以始终以方便你的方式保存它，这样你就不用担心各种问题了。


    ## 尝试更多


    当你测试了网站并且发现一切都运行正常后，你可能想向其中添加更多内容。你可以为它添加不同的提示框（prompts）和警告框（alerts），这会让它看起来更专业。它还将让你有机会扩展页面，使其与你网站上的其他页面相匹配。你甚至可以编写代码将你的页面连接起来，并在访客点击其中一个页面时将他们引导到不同的页面。


    当你学会如何编写 `JavaScript` 时，你可以在网页上做很多更多事情。考虑一下当你尝试为网页添加不同选项时可以做的一切。你可能会发现，如果向网页中添加更多信息，你可以做得更多，并从你的网站中获得更多价值。


    即使是最简单的命令，如 `alerts` 和 `prompts`，你也可以让你的页面变得多维度化。尽管如此，始终尽力为页面添加更多内容，并不断学习关于 `JavaScript`
    的知识以便你添加更多功能，这是一个好主意。


    ## 添加不同的变量


    虽然 `alerts` 和 `prompts` 非常棒，但你的网站需要的不仅仅是询问人们想吃多少你的葡萄。它需要不同的页面、不同的提示框，甚至是人们可以点击的不同按钮。在这些之中，你可能想更改颜色、字体以及在页面上的位置。幸运的是，这些都是你可以通过
    `JavaScript` 完成的。


    一旦你掌握了 `JavaScript` 的基础及其工作原理，你就可以对其进行重大更改。你可以使用“text color”标签以及“text style”字体来更改文本颜色。你可以使用
    `<b>`、`<u>` 和 `<i>` 标签对网站上的内容进行加粗、下下划线和斜体处理。要停止使用这些标签，你只需要输入 `</style>` 或 `</body>`、`</u>`
    和 `</i>` 即可。


    这些中的每一项都会让你的文本看起来不同。你甚至可以使用标签来更改警告框的颜色、背景以及文本在页面上的定位方式。


    随着你学习到更多 `JavaScript`，你会发现网页上执行不同操作的选择是完全无尽的。任何你想在页面上编写或更改的内容都触手可及。是否能够使用这些不同的功能完全取决于你的想象力。


    但在你执行这些操作之前，你需要确保自己始终在测试你的网站。测试它以找出哪里出了问题。测试它以确保它看起来良好，测试它以发现你可以为其添加什么。随着你越来越熟悉
    `JavaScript`，你会发现测试是可以很有趣的，甚至可以让你你的页面功能更多。测试是确保你的网站出色的关键。


    ## 第 4 章：付诸行动


    如果没有人有机会看到这些页面，那么了解 `JavaScript` 并构建网页又有什么用处呢？你用 `JavaScript` 可以做很多很多事情，但如果你想获得成功并让你的
    `JavaScript` 知识为你服务，你就需要能够将这一切付诸行动。采取以下步骤将你的 `JavaScript` 能力付诸实践。


    ### 获取网站


    如果你想让人们能够访问你的网站，你需要一个域名。那些没有与你使用同一台电脑的人无法通过点击你创建的文件来查看你用网站创建的内容。即使你使用 `Notepad`
    创建的 `JavaScript` 是完美的，如果不能通过网站查看，访客也无法看到它。


    你可以从许多不同的来源购买域名。有些平台，比如 `Godaddy`，以非常低的价格出售域名。这些通常是允许你有机会为自己的网站命名，并通过创建你能够提供给想要访问你网站的人的东西来确保你从中获得最大价值的域名。确保该域名是你和访客都能容易记住的。


    某些域名可能因为受欢迎而价格最昂贵。例如，你可以使用你的名字作为域名，但 `joseph.com` 可能已经被占用，或者可能花费数千美元，因为它是一个非常受欢迎的、一个可能花费大量金钱的东西。网站的变体，如
    `facebookses.com` 也可能很贵。如果你想要一些基础的，比如 `ilikocode.com`，价格可能会便宜一些，因为它们并不极端常见。


    研究一下你打算托管 `JavaScript` 的域名类型是一个好主意。这对于你的网站以及对于确保你的 `JavaScript` 能够被看到来说是非常重要的。找到一个与你的网页主题以及你希望人们在访问网页时看到的内容相契合的域名是一个好主意。


    如果你刚刚开始学习 `JavaScript` 和构建页面，考虑只从获取一个非常便宜的域名开始。即使它不是你喜爱的，它也是你利用它来练习 `JavaScript`
    的极佳方式。


    ### 使用托管服务


    如果你想让人们能够访问你的网站，你需要一个域名。互联网并不像你的电脑那样。你不能只是打开一个网页就开始打字，除非你有了域名。你需要确保你正在使用托管服务。托管服务将允许你放置信息以及你构建网站的方式。托管服务是信息进入的地方，而页面是人们访问网站时看到的内容。


