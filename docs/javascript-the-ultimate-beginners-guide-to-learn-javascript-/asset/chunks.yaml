- fmt: "\nCoding directly into the tags is a little different, but you still need\
    \ to make sure that you are saving it as often as possible. You can save it in\
    \ the web browser, or you can save it into a `different area` so that you will\
    \ be able to do the best job possible. If you have made the decision to just write\
    \ within the tags, you can always save it in a way that it convenient for you\
    \ so that you don’t have to worry about different problems.\n\n## Try for More\n\
    \nWhen you have tested your website, and everything is working out the right way,\
    \ you may want to add more to it. You can add different prompts and alerts to\
    \ it, and this will allow it to appear to be more professional. It will also give\
    \ you the chance to expand the page and make it fit in with other pages that are\
    \ on your website. You can even write codes that connect your pages together and\
    \ send your visitors to different pages when they click on one of them.\n\nThere\
    \ are so much more things that you can do with your web pages when you know how\
    \ to write `JavaScript`. Consider all of the things that you can do when you are\
    \ trying to add different options to the web page. You may find that you are able\
    \ to do more and that you can get more out of your website if you add more information\
    \ into it.\n\nEven with the simplest of commands, like `alerts` and `prompts`,\
    \ you can make your page multidimensional. It is a good idea to always try your\
    \ best to add more to the page and to always learn what you can about `JavaScript`\
    \ so that you can add more.\n\n## Add Different Variables\n\nWhile `alerts` and\
    \ `prompts` are great, your website will need to be much more than just asking\
    \ people about how many of your grapes they want to eat. It will need to have\
    \ different pages, different prompts and even different buttons that people can\
    \ click. Among these, you may want to change the color, the font and the positioning\
    \ on the page. Thankfully, these are all things that you can do with `JavaScript`.\n\
    \nOnce you have mastered the basics of `JavaScript` and the way that it works,\
    \ you can make major changes to it. You can change the color of the text by using\
    \ “text color” tags as well as “text style” fonts. This you can use the `<b>`,\
    \ `<u>`, and `<i>` tags to bold, underline and italicize things on your site.\
    \ To stop using the tags, you would simply have to do `</style>` or `</b>`, `</u>`,\
    \ and `</i>`. \n\nEach of these things will make your text appear to be different.\
    \ You can even use tags to change the color of your alert boxes, the background\
    \ and the way that your text is positioned on the page.\n\nAs you learn more about\
    \ `JavaScript`, you will find that the options for doing different things on your\
    \ web page are completely endless. Anything that you would want to write or change\
    \ on the page is at your fingertips. It is all up to your imagination whether\
    \ or not you will be able to use the different things.\n\nBefore you can do each\
    \ of these, though, you need to make sure that you are always testing your site.\
    \ Test it to figure out what is wrong with it. Test it to make sure that it looks\
    \ good and test it to find out what you can add to it. As you get more comfortable\
    \ with `JavaScript`, you will find that testing can be fun and can even allow\
    \ you to do more with your page. Testing is key to making sure that your site\
    \ is great.\n\n## Chapter 4: Putting it Into Action\n\nWhat good is knowing `JavaScript`\
    \ and building web pages if there is no chance that anyone will be able to see\
    \ those pages? There are many things that you and do with `JavaScript`, but you\
    \ need to be able to put all of it into action if you want to be successful and\
    \ if you want your `JavaScript` knowledge to work for you. Take these steps to\
    \ put your `JavaScript` abilities into action.\n\n### Get a Website\n\nIf you\
    \ want people to be able to visit your website, you need to have a domain name.\
    \ Those who are not using the same computer as you cannot just click on the file\
    \ that you made to be able to see what you created with your site. Even if the\
    \ `JavaScript` that you created using `Notepad` is perfect, your visitors cannot\
    \ see it without being able to look at it through a website.\n\nYou can purchase\
    \ a domain name from many different sources. There are some, like `Godaddy`, that\
    \ sell domain names for really low prices. These are often domains that allow\
    \ you the chance to name your site and to ensure that you are getting the most\
    \ out of it by creating something that you will be able to give to people who\
    \ you want to visit your site. Make sure that the domain is something that both\
    \ you and your visitors will remember easily.\n\nThere may be different domain\
    \ names that are most costly because of their popularity. For example, you could\
    \ use your name as a domain name, but `joseph.com` could already be taken or could\
    \ be in the thousands of dollars since it is something that is very popular and\
    \ something that could cost a lot of money. Variations on websites, like `facebookses.com`,\
    \ may also be costly. If you want something basic, like, `ilikocode.com`, may\
    \ be less because they are not extremely common.\n\nIt is a good idea to research\
    \ the types of domain names where you are going to host your `JavaScript` at.\
    \ This is something that will be important when it comes to your site and when\
    \ it comes to making sure that your `JavaScript` is able to be seen. It is a good\
    \ idea to find something that fits in with what your web page is about and with\
    \ what you want people to see when they visit your web page.\n\nIf you are just\
    \ getting started with `JavaScript` and building pages, consider only getting\
    \ a very cheap domain name to start. Even if it is not something that you love,\
    \ it will be a great way for you to use it to practice your `JavaScript` with.\n\
    \n### Use a Host\n\nThe Internet isn’t all just like your computer. You can’t\
    \ just open a web page and begin to type on it because you have the domain name.\
    \ You need to make sure that you are using a host. A host will allow you the platform\
    \ to put your information in and the way that you can build your JavaScript website.\
    \ The host is what the information will go into, and the page is what people will\
    \ see when they visit your site.\n\nFind a host that is compatible with `JavaScript`.\
    \ Unlike some of the other languages, nearly all hosts will be able to work with\
    \ `JavaScript` because it is a universal coding language. This means only that\
    \ it can be used on any type of browser so the host that you choose should be\
    \ able to work with it.\n\nThere are many different hosts that are available for\
    \ you to use. With all of them, you will need to download some software onto your\
    \ computer. The most common are `WordPress`. You will just need to download the\
    \ software and then you can host your site, and the `JavaScript` will be able\
    \ to be put into that host so that your visitors can see it. From your host, you\
    \ can control everything including the codes that you use for your computer.\n\
    \nWhen it comes time to choose a host, you should make sure that you are ready\
    \ to put your `JavaScript` into it and that you can do the most with it. This\
    \ is something that is important if you want to put your `JavaScript` into action\
    \ and when you want to do different things with it.\n\n### Input Your JavaScript\n\
    \nPutting your `JavaScript` into the host that you have chosen for your domain\
    \ name is the most important part of the process especially if you want to be\
    \ able to have a functional website. Your site should appear to your visitors,\
    \ and it should look better than the other options that are available on the web.\
    \ Make sure that you do what you can to put your `JavaScript` in and that you\
    \ put it in the right way.\n\nIf you are using the link method, make sure that\
    \ your site is going to be linked the correct way to the `JavaScript` that you\
    \ have written. Always make sure that you update the file so that when people\
    \ are shown the site, they see the outcome of the `JavaScript` instead of just\
    \ seeing a large number of codes written into it.\n"
