    与其自己去寻找需要学习的内容，你只需要学习老师教你的东西。这可能花费很长的时间，成本高昂，而且你可能无法学到你需要的所有知识。


    ## 学习技能


    对于那些读过那两个章节的人来说，你现在可能知道，如果自己学习 `JavaScript` 会让你受益得多。你不需要老师，不需要专业人士。你只需要一些能够向你展示你可以所做的各种事情，并以一种让你能理解的方式呈现出来。


    自己动手尝试是一个好主意，因为你将学到一项宝贵的技能。学习这项技能将赋予你所需的思路，让你能够在自己的网页上独立制作东西，并在 `JavaScript` 的过程中发挥创意。


    一旦你掌握了关于 `JavaScript` 的所有相关知识，你甚至可以成为那些专业人士或老师之一。他们的收费昂贵，这意味着他们只需少少努力就能赚到很多钱。如果你对自己的
    `JavaScript` 技能有信心，你也可以做同样的事情并从中获利。即使你不想通过教学或为编写 `JavaScript` 来赚钱，拥有这项技能对你也会非常有帮助。


    ## 昂贵


    雇佣别人为你工作或请老师教你如何做并不是解决办法。从本系列教程中尽可能多地学习是一个好主意。购买系列中其他关于 `JavaScript` 的书籍，其价格可能比向老师学习的第一课还要便宜得多。这仅仅是雇佣他人完成你的
    `JavaScript` 工作成本的一小部分。


    由于你可以按照自己的节奏进行，自己动手甚至可能更快。这给了你一个机会去学习更多、做更多，并开始从中赚钱。通过不雇佣专业人士，你可以节省大量资金，但通过成为
    `JavaScript` 专家，你可以赚很多钱。请确保你已经准备好学习，并在从这些书中学习的每一项 `JavaScript` 技能中继续表现良好。


    如果你觉得已经从这本书中学到了你所需的知识，那么恭喜你。你不再是一个初学者了，可以转向 `JavaScript` 的其他领域了。尝试书中教给你的所有内容，准备开始成为一名
    `JavaScript` 专业人士。你从现在起就能从中受益。仅仅学习书中包含的几段代码就足够让你入门了。事实上，你完全可以用这些代码构建一个整个网页。它可能不会非常有趣或具有互动性，但它是你可以独立完成的。


    当你开始学习更多知识时，请记住这本书教给你的所有事情。始终记录你所做的更改，将内容保持在一个地方，并利用你学到的信息进行回顾参考。即使是专业人士有时也会忘记如何更改文本颜色或字体大小。跟踪并记录一切将让你始终有一个可以回溯的地方，那里会比你以后将学习的高级
    `JavaScript` 要简单。


    ## 结论


    感谢你读完这本书，希望它能提供丰富的信息，并能为你提供实现目标（无论这些目标为何）所需的所有工具。


    下一步是开始使用你学到的 `JavaScript` 并开始准备。你也可以查看该系列中的其他书籍，学习更多比 `JavaScript` 基础知识的内容。你关于它读得越多，就越能学会如何编写它，以及你可以用它来做什么。


    最后，如果你在任何方面都觉得这本书有用，我们将非常感谢你在 Amazon 上留留评价！


    '
