  md: '# APPENDIX D: MISC


    # MANUAL INSTALLATION OF SDR#


    Get around the problem: When I run install.bat a CMD/ DOS window flashes on the
    screen briefly disappears. Nothing is installed.


    +   1. Download and extract SDR# to a folder: http://sdrsharp.com/downloads/sdr-nightly.zip

    2. Download and extract the RTL-SDR SDR# plugin to the same folder: http://sdrsharp.com/downloads/sdr-nightly-rtlsdr.zip

    3. Copy and replace the SDRSharp.exe.Config file from config folder into the main
    SDR# folder.

    4. Download the RTL-SDR Drivers, extract the files from the x32 folder into the
    SDR# folder, replacing any files if it asks: http://sdr.osmocom.org/trac/attachment/wiki/rtl-sdr/RelWithDebInfo.zip

    5. Download zadig and place it into the SDR# folder: http://zadig.akeo.ie/downloads/zadig.exe
    (or if XP download the XP version from http://zadig.akeo.ie)

    6. Optional: Download ADSB# and extract it into the SDR# folder: http://sdrsharp.com/downloads/adsbsharp.zip'
