    |---|---|

    | 136.800 | USA Additional |

    | 136.900 | European Secondary |

    | 136.850 | SITA North America |

    | 136.750 | European New |

    | 131.580 | European New |


    # # ACARS TUTORIAL (WINDOWS)


    For most of this tutorial we will assume that you have an RTL-SDR dongle installed
    and working on a Windows PC. If not, please follow the Quickstart Installation
    Guide section.


    There are four commonly used ACARS decoder software programs. These are Acarsdeco2,
    PlanePlotter, AirNav ACARS 2 and ACARSD. Below we present tutorials on each software.
    At the moment we currently recommend Acarsdeco2 as the best software to use.


    For using PlanePlotter, AirNav ACARS 2 and ACARSD you will also need to have installed
    a Windows audio piping program installed. See Appendix A: Audio Piping for more
    information.


    First, we will try to receive ACARS messages in SDR# or another similar program
    such as SDR-Radio to confirm that they are receiveable.


    +   Open a general SDR program such as SDR# or SDR-Radio and tune to an ACARS
    frequency such as 131.500 MHz. Note that we highly recommend using SDR-Radio with
    multiple VFOs for SDR# if you are wanting to use PlanePlotter, AirNav ACARS2 or
    ACARSD and wanting to track multiple ACARS frequencies.'
