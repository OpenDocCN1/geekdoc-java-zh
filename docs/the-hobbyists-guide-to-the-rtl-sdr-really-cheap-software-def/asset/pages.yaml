    dots in the four corners then a lock has been achieved and you should begin to
    see an image form in lrPTOffLineDecoder software.


    ![](img/33eab9643eb7fbb4bf9363c117190041_234_0.png)


    # RECEIVING METEOSAT WEATHER SATELLITE IMAGES: LINUX TUTORIAL


    An alternative to the Windows offline method that involves less steps is to use
    Linux software that will do the receiving and decoding at the same time. To do
    this you will need a Linux system with GNU Radio 3.7+ and Python installed. See
    the GNU Radio Live DVDs section for a list of distributions that have GNU Radio
    preinstalled in them or the GNU Radio installation-'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'instructions section for information on how to install GNU Radio. Note that
    the final step for generating the actual images must still be done in Windows
    using the LRPToffLineDecode.exe decoder as shown in steps 15 and 16 in the Windows
    tutorial above.


    First download the required GNU Radio python scripts from https://www.dropbox.com/s/par34n42m1r68k3/meteor_rx.zip
    (Mirror: http://bit.ly/Yahuq6), extract them to a folder and then use the following
    instructions.


    +   1. First using Orbitron or another satellite tracker wait until it is time
    for a satellite pass to begin. When the time comes the python script using python
    meteor_qpsk_rx_rtl.py.


    +   2. The Centre in the graph using the "freq. correct" input box which is where
    you should enter your dongles PPM offset value.


    +   3. Wait for the signal to noise ratio of the Meteor-M2 signal to rise above
    5dB. When it does switch to the constellation graph in the “PLL demodulator and
    Clock sync” panel. If the signal is strong enough and has locked, the constellation
    should look like four clusters of dots. If it is still too weak the dots will
    be randomly scattered. If the constellation looks like a circle, increase the
    “PLL alpha” setting until you see four clusters of dots, then reduce the PLL alpha
    setting back down until you get to ‘1m’.'
