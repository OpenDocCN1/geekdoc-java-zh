  md: '# SETTING UP AND USING YOUR RTL-SDR


    # SDR# SETUP GUIDE (TESTED ON WINDOWS VISTA/7 + XP)


    +   1. Purchase an RTL-SDR dongle. The cheapest and best for applications is the
    R820T2 dongle. See http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/ for more
    information on the best places to buy one.


    +   2. SDR# (pronounced SDR Sharp) is the easiest to use and most popular free
    SDR receiver software that is compatible with the RTL-SDR. Go to www.sdrsharp.com
    and go to the downloads page to download SDR#.


    Note that you must have the Microsoft .NET 3.5 redistributable installed to use
    SDR#. Modern Windows PCs usually have this installed by default, but older PCs
    running XP may need this to be installed. It can be downloaded from http://www.microsoft.com/en-gb/download/details.aspx?id=21.


    +   3. Extract (unzip) the sdr-install folder from the zip file to a folder on
    your computer.


    +   4. Double click on install.bat from within the extracted folder. This will
    start a command prompt that will download SDR# and all the files required to make
    SDR# work with the RTL-SDR. Everything will be placed into a new folder within
    the sdr-install folder called'
  merge: -1
