  md: '# USING MULTIMONNG ON LINUX AND WINDOWS


    MultimonNG is a command line program available on both Windows and Linux and can
    be run on an embedded computer like the Raspberry Pi. It is capable of decoding
    a wide range of protocols such as the following.


    +   POCSAG512 POCSAG1200 POCSAG2400

    EAS

    UFSK1200 CLIPFISH AFSK1200 AFSK2400 AFSK2400_2 AFSK2400_3

    HAP4800

    FSK9600

    DTMF

    ZVEI1 ZVEI2 ZVEI3 DZVE PZEVI

    EEA EIA CCIR

    MORSE CW


    MultimonNG can be obtained from https://github.com/EliasOenal/multimon-ng/. The
    Linux compile instructions can also be found at the above link. To run MultimonNG
    on Windows download a precompiled version here: https://dl.dropboxcontent.com/u/43061070/multimonNG.exe
    (Mirror: http://bit.ly/1iNVMq).


    To run MultimonNG on Windows first download and extract the zip file to a folder
    on your computer. Then follow these instructions.


    +   1. Open your favourite SDR receiver such as SDR#.


    +   2. Set your audio output to your favourite audio pipe. Note that on Windows
    multimonng will by default listen to your default audio piping method set in Windows
    sound recording properties.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '3. Open a Windows command prompt by going to Start->All Programs>Accessories->Command
    Prompt.


    4. In command prompt change directory using the ''cd'' command to where MultimonNG
    is installed. e.g. cd c:/tools/multimonng


    5. You can now run multimon-ng using the command multimonng -a XXX where XXX should
    be replaced with the protocol you would like to decode. You can specify multiple
    decoders if you wish.


    On Linux (or Windows if desired) you will need to pipe in FM audio with a sample
    rate of 22050 into multimonNG. You can use rtl_fm to do this. See the example
    below.


    ```

    rtl_fm -f 158.1M -s 22050 -p 49 | multimon-ng -t raw -a POCSAG512 -a POCSAG1200
    -a POCSAG2400 -f alpha /dev/stdin

    ```


    Alternatively if you want to use a different bandwidth / sample rate, either use
    the -r flag in rtl_fm, or use sox for resampling and use any sample rate desired.


    ```

    rtl_fm -M fm - 157.918M -s 12k -g 30 -l 0 -p 49 | sox -traw -r12k -es -b16 -c1
    -traw -es -b16 -c1 -r22k | multimon-ng -t raw -a POCSAG512 -a POCSAG1200 -a POCSAG2400
    -f alpha /dev/stdin

    ```'
  merge: -1
