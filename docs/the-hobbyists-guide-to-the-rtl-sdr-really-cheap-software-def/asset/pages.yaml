- img_proc: true
  md: 'To use the play command used in the examples below you will need to install
    sox or aplay. Sox can be obtained on Debian Linux with sudo apt-get install sox.
    On a Mac port install sox. On Windows it can be downloaded from http://sourceforge.net/projects/sox/.
    You will need to add the folder sox is installed to the Windows PATH, so it can
    be accessed from anywhere in the command prompt. You might wish to add the folder
    with rtl_fm in it to the PATH as well so it can be accessed from anywhere in command
    prompt. In this link is a tutorial showing how to add directories to the PATH
    http://geeksswithblogs.com/renso/archive/2009/10/21/how-to-set-the-windows-path-in-windows-7.aspx.
    On Windows you will need to add a -d flag at the end of the command to select
    the default device. Additionally, on Windows the ''play'' command is replaced
    by the ''sox'' command.


    # EXAMPLES OF RTL_FM USE


    Rtl_fm needs to be piped into an audio player that can play raw audio as sox or
    aplay. We need to make one distinction in terminology for rtl_fm first. When we
    refer to rtl_fm, we are referring to the tuned area bandwidth (for example the
    shaded area in SDR#), NOT the wide band instantaneous bandwidth. Below we list
    of the possible rtl_fm flags and then show some examples of it in use.


    # RTL_FM FLAGS


    +   -M set the receive mode (wbf, fm, am, lsb, usb, raw) (default is fm)

    -s bandwidth/sample rate of tuned area (not entire spectrum)

    -g gain (default is automatic)

    -l squash level

    -t squash delay

    -p ppm offset

    -F use better filters (0 - 9)

    -r output sample rate (very low quality resampling)

    -d dongle number (for use with multiple dongles)

    -A arctan computation (std, fast, lut)

    -E special modes (dc, deemp, direct, offset)'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'For the full list type in rtl_fm -h.


    # RECEIVING WBFM


    Rtl_fm in WBFM mode uses an audio sample rate of 32k.


    ```

    rtl_fm -M wbfm -f 88.6M | play -r 32k -t raw -e -s 16 -c 1 -V1 -

    ```


    For better quality audio output the audio sample rate can be resampled to 48 kHz
    using the -r flag as follows.


    ```

    rtl_fm -M wbfm -f 88.6M -r 48k | play -r 48k -t raw -e -s 16 -c 1 -V1 -

    ```


    Instead of sock, Alsa amply can also be used as an alternative as follows. Some
    Linux computers play results in better sounding audio.


    ```

    rtl_fm -M wbfm -f 88.6M -r 48k | alplay -r 48k -f S16_LE

    ```


    On Windows use the following.


    ```

    rtl_fm -M wbfm -f 88.6M | sox -r 32k -t raw -e -s 16 -c 1 -V1 -d

    ```


    Also, instead of using -M wfm, it is possible to also use -M fm and to specify
    the bandwidth with -s and the deemphasis option with E. This method sometimes
    produces better sounding audio.


    ```

    rtl_fm -M fm -f 88.6M -s 200k -r 32k -E deemp | play -r 32k -t raw -e -s 16 -c
    1 -V1 -

    ```


    # NARROW BAND FM EXAMPLE


    ```

    rtl_fm -M fm -f 161.649M -s 12k -g 50-70 | play -r 12k -t raw -e -s 16 -c 1 -V1
    -

    ```


    # AM EXAMPLE


    ```

    rtl_fm -M am -f 127.7M -s 12k -g 50 | play -r 12k -t raw -e -s 16 -c 1 -V1 -

    ```


    For examples shown above the quality of the received signal at the expense of
    increased computation time can be increased by using the -F option. Use a number
    between 0-9 after -F, where higher numbers are higher quality downsampling filters.
    Even using a value of -F0 will improve audio quality.'
  merge: -1
  pgno: 88
- img_proc: true
  md: "# SCANNER EXAMPLE\n\nRtl_fm can also be used for scanning multiple frequencies\
    \ for activity.\n add multiple -f frequencies of the channels that you wish to\
    \ scan.\nRtl_fm will continue scanning until it finds an active signal. An example\
    \ is shown below.\n\n```\nrtl_fm -M m -f 161.649M -s 12k-161.925M -f 161.825 -s\
    \ 12k -g 50-70 -1 | play -r 12k -t raw -es -b 16 -c 1 -V1 -\n```\n\nYou can also\
    \ specify a frequency range and step size to scan. For example below to scan the\
    \ air band you could use the following,\n\n```\nrtl_fm -M am -f 118M:137M:25k\
    \ -g 50 | play -r 12k -t raw -es -b 16 -V1 -\n```\n\n# CHANGING THE AUDIO SAMPLE\
    \ RATE WITH SOX\n\nRtl_fm has the -r flag for adjusting the output sample rate.\
    \ However, it is a poor quality conversion and cannot upsample. If you need to\
    \ change the sample rate of the output of rtl_fm for whatever reason, you can\
    \ use sox follows.\n\n```\nrtl_fm -M fm -f 161.649M -s 12k -g 50 -10 | sox -r\
    \ 12k -t raw -es -b 16 -traw -r 48k -es -b 16 -c 1 | play -r 48k -t raw -es -b\
    \ 16 -c 1 -V1 -\n```\n\nAn example for better sounding WBFM and with aplay for\n\
    \n```\nrtl_fm -M fm -f 88.6M -s 170k | sox 170k -t raw -es -b 16 -traw -r 48k\
    \ -es -b 16 -c 1 | aplay -48k -f S16_LE\n```\n\nThe full documentation on rtl_fm\
    \ can be found at http://kmken.com/rtl-demod-guide/index.html.\n\nIf you want\
    \ to start rtl_fm audio over a network connect the MP3 streaming_tutorial in the\
    \ projects section. Also to use rtl_fm with digital demodulation software like\
    \ multimonng, see the MultimonongNG section later in this book."
