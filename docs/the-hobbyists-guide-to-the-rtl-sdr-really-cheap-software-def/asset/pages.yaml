  md: '# NRF24L01+ DECODING


    NRF24L01+ is a wireless 2.4 GHz protocol used by many consumer devices such as
    keyboards, mice, remote controls, toys and appliances.


    In order to receive NRF24L01+ signals you will need to first purchase a downconverter.
    A downconverter will move the 2.4 GHz signal down towards a frequency that is
    receivable by the RTL-SDR. Downconverters can be found cheaply from China on aliexpress.com.
    Search for “MMDS down converter”. You will want to purchase one for the 2.2 -
    2.4 GHz range, with a local oscillator (LO) or 19998 MHz. Here is an example of
    one that has been successfully used with the RTL-SDR http://www.aliexpress.com/item/2012-best-selling-L-O19988MHz-MMDS-down-converter/670265064.html.
    Note that to use these downconverters you will need to use a bias-t to power it.
    See the Tracking GPS section below for more information on bias-t’s.


    For decoding the packets use the Linux based command line program nrf24-btle-decoder
    whose download and compile instructions can be found at https://github.com/omriuz/NRF24-BTLE-Decoder.
    You will need to pipe the audio from rtl_fm into the decoder. Further instructions
    can be found at http://blog.cybereexplorer.me/2014/01/sniffing-and-decoding-nrf24l01-and.html.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# ANALYSING UNKNOWN SIGNALS


    # REVERSE ENGINEERING ANALYSIS PROJECTS


    Since the RTL-SDR has become popular, there have been various people who have
    used to analyze and sometimes even reverse engineer unknown protocols.


    Here someone was able to reverse engineer a wireless wall outlet http://www.embeddeddedrelated.com/showarticle/620.php.
    Another person who did something similar can be found here http://leetupload.com/blagosphere/index.php/2014/02/24/non-return-to-zero-askook-signal-replay/.


    This is a document showing how someone was able to decode an unknown 433 MHz signal
    from scratch. In the end he discovers that it is a wireless temperature sensor
    https://github.com/r-ohare/Amateur-SIGINT.


    In this reverse engineering project the experimenter was able to reverse engineer
    the protocol on his remote controlled ceiling fan. Later he was able to use his
    BladeRF (a SDR that can transmit) to control the fan http://www.irrational.net/2014/03/22/reverse-engineering-a-ceiling-fan/


    Here someone was able to receive, capture and analyze a gate opening signal for
    a gated community http://mightydevices.com/?p=300. And here someone reverse engineered
    a garage door opener used a TI Chronos RF watch to replay the signal http://courses.cs.tau.ac.il/embedded/projects/fall2013/watch-garage-door-opener.pdf.


    Here is a tutorial on analyzing 433 MHz transmitters http://arcanum.com/?p=44.'
  merge: -1
  pgno: 477
- img_proc: true
  md: 'Finally, this person used her RTL-SDR to reverse engineer the protocol used
    by her local radio controlled bus stop display. In the end she was able to decode
    things like bus ID numbers and expected waiting times http://www.windytan.com/2013/11/decoding-radio-controlled-bus-stop.com.


    After looking through most of these projects you should have a solid idea on how
    reverse engineering of a (simple) signal is done. Most of these signals were reverse
    engineered by recording a sample of the signal audio, looking at its audio waveform
    plot in a program like Audacity and then trying to determine the encoding and
    the location of things like the preamble, checksum and data bits. This is fairly
    simple to do with AM signals whose data modulation schemes like Amplitude Shift
    Keying (ASK) where the data is transmitted with On-Off-Keying (OOK). OOK is in
    a way similar to morse code (faster), where the signal is a square wave which
    represents a binary string with high representing a 1 and a low representing a
    0. Most simple range wireless home devices like temperature sensors, wireless
    wall outlets and some remote controls use some sort of ASK or OOK encoding.


    # AUDACITY


    Simple signal analysis can be performed with SDR# and an audio editor such as
    Audacity. Audacity is a free source audio editor which can be downloaded from
    http://audacity.sourceforge.net/. The most important feature of audacity for signal
    analysis is that it can record and display audio waveforms. Use audacity to analyze
    simple signals follow these instructions.


    +   1. Start SDR# or you favourite SDR receiver software and tune to a simple
    waveform that you''d like to analyze. Here we tune to a binary packet from a electricity
    energy logger on 433.94 MHz.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '+   2. Open Audacity, and set your input device, which should be your stereo
    mix or preferred audio piping method Stereo Mix (VIA High De ...


    +   3. Set the input channels to Mono 1 (Mono) Inpu


    +   4. Click the record button to begin recording audio. You may need to adjust
    the volume to get good audio levels.


    +   5. Wait for a packet to play or let your signal play for a few seconds and
    then click the stop button in audacity.


    +   6. Now delete all the static in front and after the signal by using the mouse
    to select the noise part of the waveform and then pressing the delete key.


    +   7. Zoom in the captured waveform by holding the Ctrl whilst scrolling the
    mouse wheel up.


    +   8. To increase the signal amplitude go to Effect -> Amplify.


    +   9. Now you should be clearly able to see the waveform and the bits that they
    represent.


    ![](img/33eab9643eb7fbb4bf9363c117190041_479_0.png)


    +   10. To clean up the noise from a square wave signal go to Effect -> Leveller.
    Set the degree of levelling to Heaviest and press OK. Run this leveller a few
    times using Ctrl+R to get a clean looking digital signal.


    ![](img/33eab9643eb7fbb4bf9363c117190041_479_1.png)'
