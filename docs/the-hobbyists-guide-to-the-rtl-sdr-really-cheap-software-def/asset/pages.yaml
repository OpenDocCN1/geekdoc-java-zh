    # # AIRNAV ACARS


    Another commercially available ACARS decoder is the one by AirNav, known as AirNav
    ACARS decoder 2. This product comes with a 30 day trial but costs $39.95 USD every
    six months, which makes this the priciest option available. It is available at
    http://www.airnavsystems.com/ACARS/. The advantage with this decoder is that it
    is very easy to set up and has good decoding capabilities on par with PlanePlotter.
    To use AirNav ACARS all that is required is to:


    +   1. Download and install the AirNav ACARS Decoder 2 program.


    +   2. Ensure your default audio device is set correctly in Windows sound recording
    properties. Acarsd will use the first default audio device found.


    +   3. In your SDR receiver, set the audio piping method you want to use as the
    audio output.


    +   4. Open the program. AirNav will select the default audio device.'
