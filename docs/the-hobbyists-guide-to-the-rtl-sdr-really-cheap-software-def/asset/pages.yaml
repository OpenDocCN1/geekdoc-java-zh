  md: '# ISS SATELLITE RECEPTION


    The International Space Station sometimes transmits plain NFM audio transmissions
    during spacewalks. These can be found at around 121 MHz and 130 MHz. The ISS astronauts
    also sometimes communicate to schools using ham radio at a downlink frequency
    of around 145 MHz. The signal is usually quite strong so most satellite antennas
    tuned for the 137 MHz satellite band will work and even some non tuned or non
    satellite antennas may work.


    The ISS also has an APRS packet radio repeater on 145.825 MHz which can be received
    when the satellite is overhead. See the APRS tutorial for more information on
    decoding APRS.


    You may also wish to use Orbitron to automatically allow SDR# to tune to the ISS
    satellite frequency as soon as it is available. See the Orbitron tutorial in the
    NOAA weather satellite guide but use the ISS instead of the NOAA satellites.'
  merge: -1
  pgno: 471
