  md: '![](img/33eab9643eb7fbb4bf9363c117190041_104_0.png)


    # RTL-SDR NOISE FLOOR


    Here is an image showing a frequency sweep over the RTL-SDRs entire range from
    24 MHz to 1.7 GHz with no antenna attached and the gain set to maximum. As can
    be seen from the graph, the RTL-SDR spurs are clearly visible. These large spurs
    mainly appear at multiples of 28.8 MHz, indicating that they are from the local
    oscillator. We can also see from the graph that the noise floor of the RTL-SDR
    is not flat. At around 305 MHz the noise floor rises sharply and then slowly ramps
    down again before it rises a little again at 1.264 GHz.


    ![](img/33eab9643eb7fbb4bf9363c117190041_104_1.png)'
