- img_proc: true
  md: 'If you want to listen to one or more one talkgroup, but also block others that
    you are not interested in, then you can use either the “Lockout” feature or the
    priority settings. This will allow you to mute the talkgroups you are not interested
    in.


    The lockout feature will mute a particular talkgroup. To use it go to the Call
    History in the Site window that pops up. Double click on the group that you want
    to lockout (note double click on the audience or target column) and check Lockout
    which will be under the “Listen” heading on the settings window that pops up.


    Priority allows you to prioritise which talk groups you want to listen to in the
    situation where more than one group is transmitting at once. Priority can be set
    just above the Lockout box described in the paragraph above. A priority of 1 is
    the highest, and a priority of 50 is the lowest. Talkgroups with a higher priority
    will be listened to over those with a lower priority when more than one talkgroup
    is talking at once. All talkgroups with a priority of 50 by default. The priority
    threshold can be set in the Unitunker Options under the Listen heading. Any talkgroup
    with a priority under this threshold can be listened to. So for example if your
    wanting to listen to emergency services (police, fire, ambulance) only, but the
    trunking channel is shared with other non-emergency services too, then you could
    set the priority of the police, fire and ambulance talkgroups all to 49. Then
    you could set the listen threshold to 49, which would cause all the other non
    emergency service groups to be blocked.


    # TROUBLESHOOTING


    If you have two dongles on the same computer due to the computer not being able
    to differentiate between the two dongles, then you may need to set one dongle
    to use a different serial number. This can be done'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'with rtl_eeprom which comes as part of the official Osmocom RTL-SDR

    release from http://sdr.osmocom.org/trac/wiki/rtl-sdr. See this page for

    lrt_eeprom

    instructions

    http://manpages.ubuntu.com/manpages/trusty/man1/rtl_eeprom.1.html.


    # ALTERNATIVE TRUNK FOLLOWING SOFTWARE


    Apart from Unitrunker there are two other software packages for trunking

    that will work with the RTL-SDR.


    One is Trunk88 available from http://wiki.trunk88.com/. Trunk88 is a

    Windows program that can monitor Motorola trunked radio systems and

    can directly interface with an RTL-SDR dongle.


    Another program is SDRTrunk which is available from

    https://code.google.com/p/sdtrunk/. It is a Java based program for trunk

    tacking multiple analogue and digital trunking channels using multiple

    RTL-SDR dongles. Because it is Java based it can run on either Windows or

    Linux. Currently it supports Fleetsync II, LJ-1200, LTR, RTL-Net, MDC-

    1200, MPT-1327, Passport and 1200 ANI/GPS. Fleetsync 1200 GPS is a

    system used by some Taxi companies to track the location of their vehicles.

    SDRTrunk can be used to receive these signals and plot the Taxi''s on a map.


    # DECODING DIGITAL VOICE


    # (P25/DMR/MOTOTRBO/NXXDDN/PROVOICE)


    Decoding of unencrypted digital voice signals like P25/DMR/Mototrb can

    set up in the same way as the analogue system shown above. However,

    instead of outputting audio to the speakers, audio should be output to a

    virtual audio pipe such as VAC or VB Cable using the Digital Output audio

    selection in Unitrunker. Then DSD+ should be used to listen to the audio'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'pipe. See information in Appendix A: Audio Piping for more information if you
    don’t have any audio pipes set up.


    | Deemphasis | x |

    |---|---|

    | Audio Output | Speakers (VIA High Definition A |

    | Digital Output | Line 1 (Virtual Audio Cable)|

    | Park | 0.00000 |


    DSD+ is a program that is capable of decoding digital voice protocols as P25,
    DMR/Motrotrb, NXDN and ProVoice. It is not capable of decoding encrypted digital
    voice channels. DSD+ is similar to the open source DSD version 1.6, but it has
    vastly improved decoding and better voice quality. A direct link to the latest
    version of DSD+ can be found here http://www.dsplus.com/, we suggest download
    from this link. An active discussion on DSD+ and it''s development can be found
    on the RadioReference forums at http://forums.radioreference.com/voice-control-channel-decoding-software/


    To use DSD+ download and extract the zip file into a folder for your PC. Then
    simply double click on DSDPlus.exe to start the DSD+ GUI. DSD+ will listen to
    your default sound device, so ensure you have set this correctly to your chosen
    audio pipe used in Unitrunker in the Windows sound recording properties. Adjust
    the volume levels such that the source audio waveform shows good sound levels,
    but is not too loud that the waveform begins to look squarish.


    Make sure that the Deemphasis option in Unitrunker is turned OFF (no x in the
    checkbox) for the voice receiver to make it work with DSD+. There seems to currently
    be a bug where sometimes the deemphasis filter needs to be turned off then again
    to truly turn it off, just be aware of this issue.


    When DSD+ is running correctly you will see a bunch of text scrolling in the command
    prompt window when a digital voice signal is active. The text'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'voice’ will show on the right when a voice signal is playing. The Event Log
    will show a log of all calls that were received, and the Channel Activity window
    shows the current calls being made.


    ![](img/33eab9643eb7fbb4bf9363c117190041_302_0.png)


    ![](img/33eab9643eb7fbb4bf9363c117190041_302_1.png)


    ![](img/33eab9643eb7fbb4bf9363c117190041_302_2.png)


    ![](img/33eab9643eb7fbb4bf9363c117190041_302_3.png)


    # SOME TIPS


    +   - For digital voice you may need to play with the Windows volume settings
    of your audio pipe to improve decoding.


    +   - You will require a decent antenna that is capable of receiving the trunking
    frequencies you are interested in.


    +   - Unititrunker can be coupled with a radioreference,com account to get trunk
    group names.'
