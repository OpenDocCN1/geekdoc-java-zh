  md: '# REAL TIME COCKPIT INSTRUMENT DISPLAY USING nDS-B DATA


    It is possible to use received ADS-B data together with special software to display
    a real time cockpit view similar to what the pilot in the actual aircraft would
    see. To do this a program called XHSI can be used, which is a program used by
    Flight simulator enthusiasts to display cockpit data. Another program called XHSI-Interface
    can then be used to interface between RTL1090 and XHSI. To do this follow the
    steps below.


    +   1. Download and install XHSI from http://sourceforge.net/projects/xhsi/.


    +   2. Download the precompiled XHSI interface called RTL1090-XHSI from http://www57.zippyshare.com/v/49667810/file.html
    (Mirror: http://bit.ly/1zqJNpN)


    +   3. Open RTL1090 and go into the configure menu. Change the Table 2 name under
    the HTTP server table names section to “tableb”. Save and close the configure
    window.


    +   4. Start RTL1090 (RTL1090 must be started first).


    +   5. Start RTL1090-XHSI.


    +   6. To begin monitoring data from a plane, enter the aircrafts ICAO number
    into the text box at the top of RTL1090-XHSI. Once entered you should begin to
    see that aircraft ADS-B data show in RTL1090-XHSI.


    +   7. Now open XHSI and it should automatically begin to use the ADS-B data.'
