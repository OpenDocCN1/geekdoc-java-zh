  md: '![](img/33eab9643eb7fbb4bf9363c117190041_565_0.png)


    **Left:** Image of a typical yagi uda, **Right:** 3D radiation pattern at 475
    MHz in free space.


    **Name:** Yagi Uda


    **Polarization:** Horizontal/Vertical/Circular


    **Broadband:** Somewhat. Will work well at frequencies above the design frequency.


    **Uses:** High gain antenna for directional reception.


    Yagi Uda, or just yagi antennas are highly directional antennas with very high
    directivity and gain. Their signal polarization is oriented in the same direction
    of the orientation of the elements. These antennas need to be pointed in the direction
    of the transmitting signal and will receive signals poorly from other directions.
    Yagi''s in day to day life are most commonly found as TV antennas and WiFi range
    extender antennas.


    Yagi’s make good antennas for weak AIS signals. There are some links to examples
    and tutorials for creating Yagi’s for AIS. Remember that AIS signals are vertically
    polarized, so the Yagi must be oriented vertically. Here'
  merge: -1
