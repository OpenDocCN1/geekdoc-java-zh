    4. If you are using the scheduler in the DDE plugin, then when the satellite passes
    overhead Orbitron will automatically notify the'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# DDE tracking and scheduler plugin which will in turn start the QSK decoder
    and LRPT decoder automatically.


    5. To check if the QPSK decoder has a lock on the signal, click the Out checkbox
