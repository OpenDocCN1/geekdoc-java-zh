  md: '6.


    # # APRS GUIDE


    APRS is an acronym for Automatic Position Reporting System and is a packet based
    system used by Amateur radio hobbyists. APRS is used to transmit data such as
    short messages, announcements, weather station data and also to report GPS coordinates
    of things like transmitters and moving vehicles.


    APRS data is often collected internationally on an internet server through iGate.
    Some iGates also selectively retransmit internet APRS data to the local RF network.
    Using the internet and iGate transceivers APRS messages can be transmitted overseas.


    APRS is assigned to different frequencies around the world, but is usually around
    the region of 144 MHz. A table showing common APRS frequencies is shown below.


    | FREQ (MHz) | REGION / COUNTRY |

    |---|---||

    | 144.390 | Colombia, Chile, Indonesia, North America |

    | 144.575 | New Zealand |

    | 144.660 | Japan |

    | 144.800 | South Africa, Europe, Russia |

    | 144.930 | Argentina, Uruguay |

    | 145.175 | Australia |'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# QTMM AFSK1200


    Since APRS is transmitted using Asynchronous Frequency Shift Keying (AFSK) at
    1200 bits/s the software program QTMM AFSK1200 can be used to decode the messages.
    QTMM AFSK1200 can be downloaded from http://sourceforge.net/projects/qtmm/. To
    use AFSK1200 follow the instructions below.


    +   1. Open SDR# or your favourite SDR receiver and set the audio output to your
    preferred audio piping method.

    2. Tune to a local APRS frequency and set the mode to NFM. Set the bandwidth large
    enough to cover the packet width.

    3. Open AFSK1200 and under Input select the audio piping method you are using.

    4. Press the Play button to begin listening.


    Decoded message will show up in the main window.'
  merge: -1
