- img_proc: true
  md: 'Broadband: Somewhat. Fairly broadband above design frequency.


    Uses: Good for satellite reception.


    Turnstile antennas are circularly polarized antennas that are often used for FM
    reception, but can also be used for satellites. Turnstile can operate in two modes,
    normal or axial. Normal mode creates an omnidirectional radiation pattern directed
    towards the horizon. In axial mode the turnstile gain is directed towards the
    sky. The radiation pattern shown above and in the graphs below shows the turnstile
    in axial mode. For satellites the axial mode turnstile is required. If you are
    building a satellite antenna, make sure you connect the elements in axial mode
    or you will have poor performance. For satellite reception a reflector should
    also be used.


    The turnstile in the above example images has a design frequency of 137 MHz and
    is an axial mode design for satellite reception. The VSWR is near 1 at this frequency
    and quickly ramps up to higher ratios at other frequencies.


    Here is a turnstile build for NOAA satellites http://umarca.blogspot.co.nz/2013/05/project-8-turnstile-antenna-for-weather.html.
    Here is a video tutorial showing how to build a simple turnstile out of wire for
    433 MHz https://www.youtube.com/watch?v=sCypz0ZeDdoht=201.'
