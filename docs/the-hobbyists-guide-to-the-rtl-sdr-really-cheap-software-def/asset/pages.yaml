- img_proc: true
  md: '# # RTL-SDR IMPROVEMENTS ANDnMODIFICATIONS


    # ## LOW NOISE AMPLIFICATION


    The amplifier used in the dongle is while considered poor quality for serious
    work, still ‘low noise’ enough for most applications. However there are third
    party external LNAs (Low Noise Amplifiers) that can be used to improve the signal
    quality. A poor amplifier like the one in the RTL-SDR with a noise figure of <4,5dB
    will introduce noise causing the signal to be degraded, especially as the gain
    is increased. The term noise figure is used to measure the amount of noise an
    amplifier will introduce into the signal. By using a high quality LNA with a noise
    figure <1dB this noise can be reduced.


    One good cost LNA that we recommend is the LNA4ALL. Its link can be found on our
    Buy RTL-SDR Dongles page at http://www.rtl-sdr.com/rtl-sdr-dvb-t-dongles/. There
    are also LNA kits available on Ebay, however these tend to require good surface
    mount soldering skills. A DIY design for the RTL-SDR can be found here https://github.com/loxodes/sdr-lna.
    Hapsubplies in the UK also supply high performance filtered LNA''s. Their website
    is http://ava.upuaat.net/store/index.php?route=product/category&path=72_73.


    When positioning the LNA, you want it to be as close to the antenna as possible.
    The main goal of the LNA is to amplify the signal at the antenna, in order to
    help reduce the effects of noise that can enter through the coax transmission
    cable and to help reduce attenuation over long cable runs.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'other words, it makes the received signals bigger at the antenna so that any
    noise or losses introduced by the coax cable will be negligible.


    A LNA will be of most use at frequencies above 50 MHz. At HF frequencies (<50
    MHz) the ambient RF noise is so high that a high quality LNA won''t make much
    difference compared to a more ordinary linear amplifier. The manufacturer of the
    LNA4ALL also makes the LNA4HF which uses a more linear amplifier and is designed
    for HF operation.


    Don''t be tempted to buy standard TV amps as these will perform no near as well
    as a proper modern LNA like the LNA4ALL, although if you use long runs of coax
    cable they may still help.


    Some LNAs can be powered with "phantom power". This is where the required DC 5V
    is injected into the coaxial cable and is used to power the LNA or other device
    through the cable. The LNA4ALL can be modified for phantom power, and the HAB
    supplies LNA''s all support phantom power by default. It is possible to modify
    the RTL-SDR to provide phantom power, see the Phantom Power heading below.


    # RECEIVING LF/MF/HF (0 - 30 MHZ)


    The lowest frequency that a R820T dongle can reliably tune to is about 24 MHz.
    No RTL-SDR dongle will tune to the entire LF/MF/HF band (0-30 MHz) without modifications
    or extensions. There are three methods that will allow your RTL-SDR to receive
    LF/MF/HF frequencies.


    +   1. The direct sampling mode modification.


    +   2. An upconverter circuit.


    +   3. Modified experimental drivers.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 1) DIRECT SAMPLING MODE


    RTL-SDR can be told to run in a special “direct sampling” mode, which with a small
    hardware mod allows the dongle to tune to the LF/MF/HF frequencies between 0 -
    28.8 MHz where ham radio and many other interesting signals are found. No upconverter
    circuit is required with this mod.


    The difficulty with direct sampling is that a hardware modification to the dongle
    is required. Performance with the direct sampling mod can be the same as, or even
    better than with an upconverter - assuming appropriate low pass/band pass filtering
    is used. Upconverters can introduce conversion losses.


    The direct sampling mod essentially bypasses the tuner chip and allows RF signals
    to directly enter the RTL2832U chip by *directly attaching an antenna to the RTL2832U
    microchip pins*. Care must be taken with this mod as it bypasses any electrostatic
    protection the dongle has. However, in practice damaging the chip through static
    discharge is a rare occurrence if care is taken.


    # INSTRUCTIONS


    To do this mod, you will need decent soldering skills. It involves opening the
    dongle casing, and soldering a “random wire” or “long wire antenna” to either
    pin one or two, or alternatively pin four or five of the RTL2832U chip. Even a
    short wire a few meters long will be sufficient for picking up broadcast AM stations.
    Some people report that even pressing a damp finger onto the pin will pick up
    signals. However, for most amateur radio signals, a longer wire is probably required.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Pins one and two are located below the circle indentation on the RTL2832U chip.
    It might be easier to solder the wire to one of the two capacitors which are connected
    directly to pin one and two.


    ![](img/33eab9643eb7fbb4bf9363c117190041_108_0.png)


    If you are using an R820T based dongle, it may be best to use pins four or five
    for this mode. Due to the R820T''s circuit architecture these pins on the RTL2832U
    are actually used under normal operation. Using pins four or five will allow you
    to use normal quadrature sampling for VHF/UHF and direct sampling as well as HF
    on the dongle. The problem with pins four and five is that they do not have a
    capacitor connection like pins one and two, making them very hard to solder. Reddit
    user psкато has taken a photo of his soldering (http://img42.imageshack.us/img42/3272/htjo.jpg)
    to pins four and five can be used as a reference. Some newer R820T RTL-SDR dongles
    made in the first quarter of 2015 and onwards now come with easy to solder to'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'connections for pins 4 & 5. These dongles make performing the direct sampling
    mod significantly easier.


    Once you have performed the hardware mod, activate it you will need to change
    some software settings. In SDR#, go to the configure menu and change the sampling
    mode to “Direct sampling (I branch)”, or "Direct sampling (Q branch)". The I branch
    corresponds to pins one and the Q branch corresponds to pins four and five. Pin
    three is not connected to anything. Direct sampling can also be enabled in HDSDR
    using the direct sampling option found in ExtIO settings window (same window where
    you choose the sampling rate). To enable direct sampling in GQRX, add the string
    “direct_samp=1” to the device string input box in the Configure I/O devices window.


    If a wire antenna is connected to one of these pins and the correct direct sampling
    branch is selected, you will be able to receive signals between 0 - 14.4 MHz.
    Above this you will see images of the 0 - 14.4 MHz range due to Nyquist aliasing.
    If you want to receive frequencies between 14.4 and 28.8 MHz you will need to
    build a band pass filter for this range. See the Designing Simple Filters with
    RFSim99 section below for information how to design some simple but effective
    low pass and bandpass filters.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_110_0.png)


    # IMPROVEMENTS


    The direct sampling mod described above can be improved on further. Since the
    RTL2832U uses two pins to create a differential input (+ and - signals) for each
    I and Q input, balun can be used to connect both pins one and two pins four and
    five to the antenna. Using a balun also has the added advantage of giving you
    additional antenna static discharge protection. Essentially this mod involves
    finding or winding your own balun and connecting the balun to the two pins and
    the other end of the balun to your antenna. A balun is easily made by using a
    ferrite toroid core such as the FT370-43 and some enamelled wire, both readily
    available from hobbyist electronics stores. Most experimenters have used a trifilar
    balun winding.


    The balun can also be used to match the 50 or 75 Ohm antenna input to the input
    impedance of the RTL2832U. The input impedance of the RTL2832U is not known for
    certain, but most people place it at around 200 ohms. Thus, a 4:1 impedance conversion
    for the balun seems to be the accepted value'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'which at 200 Ohms would match a 50 Ohm antenna/feedline. However note that
    some people have reported better performance with larger impedance conversions
    on the order of 8:1 or 10:1.


    Here Mikig shows a schematic for the direct sampling mod on an E4000 tuner http://mikikg.files.wordpress.com/2012/08/rtl2832u-dc-mods.pdf,
    Mikig recommends using a Minicircuits T1-6T-KK81+ RF transformer (http://www.minicircuits.com/pdfs/T1-6T-KK81.pdf)
    as the balun for best performance. Here is another writeup by l6BE on his direct
    sampling mod http://www.radioamatoripeligni/i6be/rtl2832hf/dongle.html, in his
    implementation he used a bifilar balun. An article about the direct sampling mod
    in Japanese can be found here http://blog.livedored.jp/bh5ea20tb/archives/4263275.html,
    this article has good images that show a neat and efficient way to wind a trifilar
    balun by twisting the two wires together. Interestingly, the author of the Japanese
    article recommends that 10 windings gave him the best performance, indicating
    that perhaps the RTL2832U input impedance is higher than the expected 200 Ohms.


    Most experimenters of mod find FM interference can be a problem and thus low pass
    filters might be necessary for good performance. Some users also report that adding
    a low noise amplifier (LNA) can vastly help improve reception. This is because
    the tuner chip is bypassed in direct sampling. Under normal operation the tuner
    chip gives amplification to the received signals through its internal amplifier.


    These days are modified RTL-SDR dongles being sold with the direct sampling having
    been already applied and with things like filters and amplifiers added. Some good
    pre-modified dongles are as follows:


    KNOCK: http://www.kn0ck.com/HF_SDR/'
