- img_proc: true
  md: 'load reduce the sample rate, reduce the FFT display resolution, disable the
    FFT spectrum analyzer and waterfall and reduce the filter order.


    AUDIO CHOUNDPS OR DOESN''T WORK OVER WINDOWS RDP

    Select directsound instead of MME in the audio out settings of SDR#.


    WHY IS THERE A CONSTANT SPIKE IN THE MIDDLE OF THE SPECTRUM THAT WON''T

    GO AWAY?


    This is normal and is due to the design of the RTL-SDR. If you have an

    R820T and are using SDR# the spike can be removed by enabling the

    “Correct IQ” checkbox. For an E4000 you can enable offset tuning in the

    SDR# configure menu.


    WHAT IS BULK IN INTERFACE-1?


    This is the infrared (IR) interface for the remote control which is not

    required when using the dongle as an SDR.


    IT SEEMS THAT MY PC IS NOT POWERFUL ENOUGH TO RUN SDR# AS IT USES NEAR

    100% CPU


    For graphical GUI SDR software like SDR#, at least a dual core processor is

    recommended. If you have a borderline decent CPU and still experience high

    CPU usage, try reducing the sample rate to 1 Msps or less, reducing the FFT

    display resolution (or turning it off), turning off Correct IQ and reducing the

    filter order.


    I USED ZADIG BUT IT BROKE MY KEYBOARD/MOUSE/OTHER DEVICE SOMEHOW

    This is because you probably clicked the install button in Zadig after

    selecting the wrong device in the drop down menu. Make sure you select the

    correct RTL-SDR device, (Bulk-In Interface, Interface 0) first. Zadig

    overwrites previous drivers. To get the old drivers back you should be able

    to do so in Windows device manager, update driver software.


    R820T2 RTL-SDR SHOWS UP AS AN R820T WHEN I RUN THE DIAGNOSTIC TOOL

    RTL_TEST'
