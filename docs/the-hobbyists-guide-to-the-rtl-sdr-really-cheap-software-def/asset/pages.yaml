- img_proc: true
  md: 'Recommended Default Setting: 32768


    Increasing the resolution will increase the quality of how the signal looks in
    the RF display and waterfall. Using a higher resolution may be useful when fine
    tuning, as high resolutions will allow you to see the peaks and structure of a
    signal much more clearly. Beware that high resolutions can slow your PC down and
    can cause trouble especially with single core machines. Generally, a value of
    at least 32768 should be used if your PC can handle it.


    # TIME MARKERS


    Recommended Default Setting: OFF


    Adds time markers on the waterfall display, so you know at what time a particular
    signal was broadcasting.


    # GRADIENT


    Allows you to customize the colors used in the waterfall display.


    # MARK PEAKS


    Recommended Default Setting: OFF


    Adds a circular marker on every signal peak on the RF spectrum.


    # S-ATTACK / S-DECAY


    Changes the amount of smoothing and averaging done in the RF spectrum display.


    # W-ATTACK / W-DECAY


    Changes the amount of smoothing and averaging done in the waterfall display.


    # SPEED


    Changes how fast the RF spectrum and waterfall updates.


    # ZOOM FFT'
