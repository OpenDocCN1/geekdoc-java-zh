    For the RTL-SDR this should be at 75 Ohms.

    3. Go to **Calculate** -> **NEC output-data** or press F7. This time choose Frequency
    Sweep. On the bottom you can choose your desired frequency range. Here we choose
    a sweep from 10 MHz to 1 GHz with a step size of 10 MHz. A step size of 10 MHz
    means that the SWR will be calculated at 10, 20, 30 MHz and so on. A'
