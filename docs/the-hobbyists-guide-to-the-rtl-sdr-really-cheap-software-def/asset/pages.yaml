    # # GMDSS DSC


    GMDSS DSC (Global Maritime Distress and Safety Digital System Selecting Calling)
    is a system used on HF for ships to send out a distress or safety alert. Listen
    to it in USB mode. GMDSS DSC can be found at the following frequencies in kHz.


    +   - 2187.5 (main)

    - 4207.5

    - 6312.0

    - 8414.5 (main)

    - 12577.0

    - 16804.5


    An example GMDSS DSC message might look like:'
