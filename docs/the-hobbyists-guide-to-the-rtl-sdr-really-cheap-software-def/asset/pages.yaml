  md: '# # NOAA WEATHER SATELLITE (APT)

    GUIDE


    ![](img/33eab9643eb7fbb4bf9363c117190041_199_0.png)


    # ## INTRODUCTION TO NOAA WEATHER SATELLITES


    Everyday the American NOAA (National Oceanic and Atmospheric Administration) weather
    satellites pass over your location multiple times a day. As they pass over each
    NOAA weather satellite broadcasts an Automatic Picture Transmission (APT) signal
    which contains a live weather image of your area. The RTL-SDR dongle combined
    with a good antenna, an SDR program like SDR# and a decoding program can be used
    to download and display these live images.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'There are currently three active NOAA satellites: NOAA 15, NOAA 18 and NOAA
    19. Each satellite transmits at around 137 MHz with a right hand circularly polarized
    (RHCP) signal. This means that a right hand circularly polarized antenna is required
    for good reception.


    The NOAA weather satellites use a transmission protocol known as Automatic Picture
    Transmission (APT) which was developed specifically for use on weather satellites.
    It is an analogue transmission that is somewhat similar to the HF Fax mode used
    on the HF bands. APT is transmitted in grayscale, but software can be used to
    colorize the image.


    The NOAA satellites only pass overhead at certain times of the day, broadcasting
    a signal. These signals appear at ~137 MHz and only when a satellite is passing
    overhead. Each satellite uses a different frequency. Their frequencies are shown
    below.


    +   - NOAA 15 - 137.6200 MHz

    - NOAA 18 - 137.9125 MHz

    - NOAA 19 - 137.1000 MHz


    This tutorial will show you how to set up a NOAA weather satellite receiving station,
    which will allow you to gather several live weather satellite images each day.
    Other SDRs and even hardware radio scanners can also work with this tutorial,
    provided that the radio in question has a large IF bandwidth (30 kHz+) and a discriminator
    tap.


    # NOAA WEATHER SATELLITE RECEIVE TUTORIAL


    To set up a NOAA weather satellite receiving station you will need:


    +   - An audio piping method. See Appendix A: Audio Piping if you don''t have
    one set up.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '+   - A right hand circularly polarized antenna tuned to 137 MHz.


    +   - Software such as WXtoImg for decoding the APT signal.


    # NOAA WEATHER SATELLITE ANTENNAS


    NOAA weather satellites transmit a right hand circularly polarized signal at around
    137 MHz. For satellite reception it is desirable to have a circularly polarized
    antenna with gain directed towards the sky. The two most common antennas that
    are used for this type of signal are the turnstile and quadrifilar helix antennas.


    A turnstile is simply two dipoles aligned at right angles to each other and connected
    in a way so that their signals are 90 degrees out of phase, giving the circular
    polarization. The turnstile is sometimes known as a cross dipole. If you are searching
    for turnstile build tutorials, beware that there are two types of turnstiles.
    There are normal and axial mode turnstiles. For APT satellite reception we want
    the axial mode turnstile which directs most of its radiation towards the sky.


    A Quadrifilar Helix (QFH) is a circularly polarized antenna that can be constructed
    out of PVC pipe and cable, or copper pipe. Most people report that the QFH antenna
    has slightly superior reception compared to the turnstile, but a few people have
    reported reception with the turnstile. It may pay to experiment with both if you
    find your first choice does not work so well. Another antenna that works well
    with the NOAA APT satellites is the double cross antenna (DCA). It is basically
    four dipoles arranged in a certain way to produce circular polarization. It is
    possible that other antennas such as discones and quarter wave ground planes may
    also receive the NOAA signal, if it is not a circularly polarized antenna the
    signal will fade in and out heavily. See the antenna guide for more information
    about antennas.'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Many people have reported that an LNA preamp at the antenna and a broadcast
    FM bandstop filter significantly help improve reception. See the LNA section and
    preselector section for more information.


    # WXTOIMG SOFTWARE TUTORIAL


    WXtoImg is a free weather satellite decoding program for Windows, Linux, OSX and
    even the Raspberry Pi. It can be used to decode the APT signal and also tell you
    the frequencies and times of the satellite passes. There is also a paid version
    of WXtoImg which can unlock more features, however it is not required for basic
    usage with RTL-SDR. To use WXtoImg and SDR# together follow the instructions below.


    +   1. First, download and install WXtoImg from http://www.wxtoimg.com/


    +   2. Open WXtoImg and set your Ground Station Location, (which is the coordinates
    of your antenna) by going to Options -> Ground Station Location. The city you
    are in should suffice, but you can be more accurate by entering in an exact latitude,
    longitude and altitude if you want. The location information is used to determine
    when a satellite will pass over your sky.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_203_0.png)


    *


    3. Set the audio piping method that you are using in WXtoImg. Go to have **Options
    -> Recording Options** and ensure the correct audio device is selected under the
    soundcard option.


    4. Also, in this window you can adjust the “Record only when active APT satellites
    are overhead” “with maximum elevation above (degrees)” and “record only when satellite
    is above (degrees)” settings. You may want to reduce the default values if you
    have an antenna with a good view of the sky and find that WXtoImg stops recording
    or doesn''t start fast enough though the APT signal is present in SDR#.


    Satellite passes with higher maximum elevations will get better'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'reception as they will get a more unobstructed pathway to the antenna. When
    the satellite is low on the horizon, reception will probably be bad due to obstructions.
    You should set these values according to your terrain.


    ![](img/33eab9643eb7fbb4bf9363c117190041_204_0.png)


    5. Now you will need to update your Kepler. This file contains the information
    about satellite locations which need to be periodically updated because satellites
    drift in their orbit over time. Go to **File -> Update Keplers** to do this. Make
    sure you have an internet connection for the update.


    6. Now you can go to **File -> Satellite Pass List** to find a time when a NOAA
    satellite will be passing overhead. Take note of the frequency of the pass as
    well.'
