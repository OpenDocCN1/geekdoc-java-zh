- img_proc: true
  md: '# PLAY/STOP BUTTON


    This button is used to start and stop the SDR.


    # SOURCE


    This is a drop down menu which is used to select the SDR input device being used.
    If you are using an RTL-SDR, select RTL-SDR/USB. Be sure to NOT select RTL-SDR/TCP
    unless you are using a remote server with rtl_tcp.


    # CONFIGURE MENU / RTL-SDR CONTROLLER


    Clicking this button opens the configure menu. In here you can change settings
    like the sample rate (bandwidth) and RF gain. See further for more information
    about these settings.


    # FREQUENCY INPUT


    ![](img/33eab9643eb7fbb4bf9363c117190041_38_0.png)


    Use the mouse to set the desired frequency you wish to listen to here. You can
    either click on the tops and bottoms of each individual number to increase or
    decrease the value, or simply hover over the number you want to change and use
    the mouse wheel to alter the value.


    The frequency input is divided into 4 sections with each section containing 3
    values (e.g. 000.000.000.000). The first section represents GHz frequency values,
    the third kHz and the last Hz. For example to tune to a radio station at 88.6
    MHz we would enter 000.088.600.000 into the frequency input. To tune to 861.5475
    MHz we would enter 000.861.547.500. To tune to 1.575 GHz we would enter 001.575.000.000.
    To tune to 500 kHz (with an upconverter and appropriate offset shift set (discussed
    later)) we would tune to 000.000.500.000.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# VOLUME / AF GAIN


    Set the volume level of your output speakers or audio piping device here.


    # RF SPECTRUM / FFT DISPLAY


    This part of the window shows the RF spectrum as a graph in real time visually.
    Active signals will appear as peaks on this graph.


    # RF WATERFALL


    This part of the window shows the RF spectrum graph spread over time with new
    data at the top and old data at the bottom, just like a waterfall.


    # TUNING BAR


    The vertical red line in the RF spectrum graph shows where on the RF spectrum
    the RTL-SDR is currently tuned to. Within the currently active chunk of instantantaen
    bandwidth the tuning can be altered by simply using the mouse to click and drag
    the red line, or just by clicking elsewhere in the RF spectrum.


    The shaded rectangular area around the red line shows the bandwidth of the tuned
    area (don''t confuse this with the bandwidth/sample rate that is set in the configure
    menu). The bandwidth should be set so that it covers the area of the signal that
    is tuned. The bandwidth can be adjusted by using the mouse to simply drag the
    edges of the shaded area in or out.


    # RADIO TAB'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_40_0.png)


    Here you can choose what type of demodulation mode the signal at your currently
    tuned frequency should use.


    **NFM** - Narrowband Frequency Modulation. Commonly used used by walkie talkie
    radios, weather radio and most VHF/UHF digital signals.


    **WFM** - Wideband Frequency Modulation. This is the mode that broadcast FM stations
    use (e.g. radio music stations).


    **AM** - Amplitude Modulation. Used by broadcast AM stations that are receivable
    by normal shortwave radios and also used by air band frequencies used by aircraft
    and air traffic control. Some digital signals use AM.


    **LSB/USB** - Lower Side Band/Upper Sideband. Used in the HF band by ham radio
    users to transmit voice and data efficiently with small bandwidths.


    **CW** - Continuous Wave. Used for listening to morse code.


    **DSB** - Double Side Band. Not commonly used in normal operation.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# RAW - Raw IQ signal. Almost never used.


    SHIFT

    This box offsets the tuned frequency by the amount entered. This is useful if
    you are using an upconverter. For example if you have an upconverter with a 100
    MHz oscillator, you would set the shift to be -100,000,000 (don''t forget the
    minus sign). Without the shift, when using an upconverter to tune to a signal
    at 9 MHz you would need to actually tune to 100 + 9 = 109 MHz. With the shift
    set, you can tune to 9 MHz as normal. If you have an upconverter with a 125 MHz
    oscillator you would tune to 125 + 9 = 134 MHz, or set the shift to -125,000,000.


    BANDWIDTH

    Recommended Default Setting: NFM/AM: 12500, WFM: 250000


    This is the width of the shaded part of the tunable area. You can set it manually
    here, or by dragging the edges with the mouse as described under the tuning bar
    description.


    FILTER

    Recommended Default Setting: Blackman-Harris 4


    Changes the filter type used. Different filters have different shapes. The filter
    is used to select the highlighted signal in the RF window. Blackman-Harris is
    usually the best filter to choose and this setting almost never needs to be changed.


    ORDER

    Recommended Default Setting: 500


    Changes the filter order. You may notice when using low filter orders signals
    outside of the tuned bandwidth can still be heard. Larger filter orders “tighten”
    or “sharpen” the band pass filter used within the tuned bandwidth thus preventing
    signals outside of the tuned bandwidth from being heard.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'You want to increase the filter order when there are strong signals near your
    tuned area. Using higher filter orders can cause a greater load on the CPU, so
    slow PCs may need to reduce this value. Usually there is no need to adjust the
    order, but see the setting filters section for more information about situations
    when you might want to adjust it.


    # SQUELCH


    Recommended Default Setting: OFF


    Squelch is used to mute the audio when the signal strength is below the specified
    value. A larger value requires a stronger signal to unmute the audio. It is useful
    for listening to speech as the sound of static when no one is talking will be
    muted. Note that the value of the squelch does not correspond to the dB signal
    strength values used in the RF spectrum display. You will simply need to experiment
    with different squelch values until you get the desired result.


    # CW SHIFT


    Recommended Default Setting: 600


    Mainly useful for when receiving CW (morse code) as it specifies the offset between
    CW transmit and receive frequencies.


    # FM STEREO


    Recommended Default Setting: OFF


    Will enable stereo output for broadcast radio WFM signals.


    # SNAP TO GRID / STEP SIZE


    Recommended Default Setting: OFF


    In many bands frequencies are allocated at a fixed distance apart. For instance
    in most countries air band signals are spaced 25 kHz apart (or 8.33 kHz in some
    countries). Turning on snap to grid can help with tuning on'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'causing the tuning bar to snap directly to a signal. However, to use this with
    the RTL-SDR the PPM frequency offset correction must be set correctly, otherwise
    the frequencies may not line up. The snap to step size can be set in the “Step
    Size” pull down menu.


    # CORRECT IQ


    Recommended Default Setting: ON


    Should usually be selected as ON. This setting removes the small but annoying
    centre spike that is present with R820T/R820T2 RTL-SDR dongles.


    # LOCK CARRIER


    Recommended Default Setting: OFF


    Only active in AM or DSB mode. Allows for synchronous AM reception which can significantly
    improve reception and automatically centers the signal. The centering is not shown
    in the main RF spectrum but can its effect can be seen in the Zoom FFT IF Spectrum
    window. Turn this on for better AM reception, but may increase CPU usage.


    # ANTI-FADING


    Recommended Default Setting: OFF


    Can be used when “Lock Carrier” is activated. Takes advantage of the symmetry
    of AM signals which helps with weak signals when they may be fading in and out.
    Turn this on for better AM reception, but may increase CPU usage.


    # SWAP I & Q


    Recommended Default Setting: OFF


    If you are SDR# as a panadapter, some hardware radios may have the I & Q signals
    swapped and need this option checked.'
  merge: -1
