  md: '# DECODING VHF DATA LINK MODE 2

    (VDL2)


    # INTRODUCTION TO VDL2


    The VHF Data Link mode 2 (VDL2) is a new transmission mode used on aircraft for
    sending short messages, position data (similar to ADS-B) and also allowing allowing
    traffic controllers to communicate to pilots via text and data. VDL2 is intended
    to eventually replace ACARS. It is found at a worldwide frequency of 136.975 MHz.


    MultiPSK can be used to decode VDL2 and then its data can be sent to PlanePlotter
    for plotting plane positions if GPS data is sent.


    # DECODING VDL2 WITH MULTIPSK


    MultiPSK is a sophisticated multi mode decoder that can connect directly to the
    RTL-SDR and is capable of decoding VDL2 signals. It is free, but to decode “professional”
    modes as VDL2 the paid version is required. However, MultiPSK provides 5 minutes
    of VDL2 use per opening of the program for testing. To use MultiPSK follow these
    steps.


    +   1. Download and extract the multiPSK zip file to a folder.

    2. Open MULTIPSK.exe

    3. You will be greeted with a complicated looking screen. On this screen we need
    to ensure the RTL/SDR key button (near the top middle) is pressed in.'
