    ![](img/33eab9643eb7fbb4bf9363c117190041_197_0.png)


    # MONITORING MILITARY AIRCRAFT


    While military aircraft have ADS-B Mode S transponders, they generally do not
    transmit position information. Nevertheless, there are military aircraft spotting
    enthusiasts who enjoy receiving and logging ADS-B signals from military aircraft.
    Even though position info isn''t received, the spotters can still obtain a military
    aircraft''s hex code, registration number, aircraft type, the base station location
    and altitudes.


    The enthusiasts at milaircomms.com have custom ADS-B software for the Raspberry
    Pi and Windows called MilAirComms1090 which logs military aircraft data and uploads
    and aggregates the data from many volunteers on their website. Because there are
    volunteers logging data all over the world (mostly in the USA and Europe), it
    is possible to find out where military'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'aircraft have been in the past through the logs. You can find more information
    about this project at http://milaircomms.com/mil_air_modes_logger.html.


    Similar software for another similar website at http://www.live-military-mode-s.eu/
    can be found at http://www.live-military-mode-s.eu/share/V4.0/ with a tutorial
    at http://www.jc-images.de/docs/RTL1090_Mode_S_Logger_Virtual_Server_Configuration.pdf.


    # ADS-B FOR GLIDERS AND HELDICOPTERS: FLARM


    Small aircraft like gliders and some helicopters use a modified version of ADS-B
    called FLARM. FLARM is an acronym for FLight alarm system. FLARM is a low cost
    and low power consumption ADS-B alternative which is often used by light aircraft
    for collision avoidance. It invented because gliding enthusiasts needed a cheaper
    and easier to install version of the ADS-B collision avoidance system that would
    work with the close proximity flying that is common to gliders.


    Although the signals are much weaker, with the right antenna it is possible to
    track these light aircraft just like commercial aircraft. This might be interesting
    for those living near a gliding club. FLARM signals are transmitted at 868 MHz
    and are effectively weaker by 100-100 times compared to standard ADS-B signals,
    but are still much receivable.


    The Open Glider Network at http://wiki.glidernet.org/start is glider tracking
    enthusiasts who use RTL-SDRs and custom software to track gliders in real time.
    An example of aggregated live glider tracking can be seen on their website at
    http://live.glidernet.org/ and http://live.glidernet.org/3D/. The Open Glider
    Network project is mostly active in Europe.'
  merge: -1
