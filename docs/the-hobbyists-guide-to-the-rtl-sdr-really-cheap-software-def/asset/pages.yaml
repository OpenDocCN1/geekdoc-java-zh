    with the DVB-T CD, the DVB-T drivers can be downloaded from http://download.buytra.com/driver/SPC-0155-Driver.zip
    (Mirror: http.bit.ly/ligDacW). After unzipping the file, open the Drivers and
    run setup.exe to install the drivers. If Windows has already installed its own
    drivers (or you have the SDR drivers installed), you will need to uninstall those
    first and then reinstall them using the new drivers.


    The correct drivers will have a Driver Version 64.1.521.2012. If an older version
    is shown, it probably won''t work and you should reinstall the drivers. The older
    Windows drivers will recognize the dongle, but when searching for TV stations
    the dongle will simply never find any.'
