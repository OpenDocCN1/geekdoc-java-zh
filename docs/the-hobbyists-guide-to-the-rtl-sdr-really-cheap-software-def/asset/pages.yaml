  md: '# APPENDIX B: RADIO BASICS


    This section will give a brief overview of radio for those just getting into the
    hobby with no scientific or engineering background in the subject.


    In the simplest form, radio waves can be thought of as a type of invisible light.
    An analogy is as follows. Ships in the old days used to use signal lights to send
    messages to the land and other ships. Radio can be thought of as using an invisible
    light to do the same thing.


    Various frequencies are analogous to different colours. For example, we could
    have two people using a signal sending a message with a green colour and one sending
    a message with a red colour. Because the colors are different we would be able
    to tell that they are two different messages from two different people. Radio
    waves work in the same way. One radio station will transmit on one frequency and
    another will transmit on a different frequency.


    Frequencies are measured in Hertz (Hz). Radio waves start in the kilohertz (kHz),
    and go up to the Megahertz (MHz) and Gigahertz (GHz) frequencies. The frequency
    ranges are divided into groups known as low frequency (LF), medium frequency (MF),
    high frequency (HF), very high frequency (VHF) and ultra high frequency (UHF).
    Their ranges are shown below.


    +   * LF: 0 kHz - 300 kHz

    * MF: 300 kHz—3 MHz

    * HF: 3 MHz—30 MHz

    * VHF: 30 MHz—300 MHz'
  merge: -1
  pgno: 586
- img_proc: true
  md: '+   - UHF: 300 MHz—3 GHz


    These frequency groupings are also sometimes referred to as bands (e.g. we might
    say that a signal is in the VHF band). The RTL-SDR receives mainly on the VHF
    and UHF frequencies, but some tuners like the R820T can receive the upper end
    of the HF range.


    # # PROPAGATION


    Radio waves travel in a straight line, just like light does. However, note that
    light bounces around. A light shone at a single wall will still illuminate the
    other walls a small room. Radio waves also bounce and tend to bounce around a
    lot more than light. This allows signals to be received indirectly.


    The LF/MF and HF band radio waves tend to bounce around quite a lot and even bounce
    off the atmosphere itself. This allows these frequencies to travel very long distances
    allowing them to be received even across the globe. Sometimes radio enthusiasts
    talk about the radio propagation conditions. Depending on the state of the atmosphere
    and factors such as solar activity, HF frequencies can propagate better or worse.


    VHF signals tend to bounce a lot less and they are known as ‘line of sight’ frequencies.
    This means the receiving antenna must have a good unobstructed straight line between
    the transmitter and antenna. UHF signals are even more ‘line of sight’.


    # # BASEBAND SIGNAL


    A being transmit over radio first starts as a baseband signal. This is a signal
    that is encoded in a frequency between 0 Hz and some higher cutoff frequency.
    For example a human ear operates from about 20 Hz to 20 kHz.'
  merge: -1
  pgno: 587
- img_proc: true
  md: 'So we might build a microphone that can record frequencies between 0 Hz

    and 10 kHz, the recorded audio is our baseband signal. To send this signal

    over radio frequencies, we need to shift this baseband signal up to an

    propriate radio frequency such as 2 MHz, this is done by modulating

    into a 2 MHz carrier wave.


    # BANDWIDTH


    When we talk about signal bandwidth we are talking about the size of the

    chunk of frequency the signal takes up. For example, an AM broadcast

    signal takes up 12.5 kHz of bandwidth. So an AM signal at a frequency of

    500 kHz would span between 493.75 kHz and 506.25 kHz. A broadcast FM

    station takes up about 192 kHz of bandwidth.


    The larger the bandwidth, the more information that can be transmitted. For

    digital signals this means faster more robust data transmissions and for

    analogue voice this means higher quality voice.


    # MODES


    There are several methods that can be used to transmit information over

    radio. The simplest is Amplitude Modulation (AM). In this mode

    information is encoded into the amplitude of the signal itself. In Frequency

    Modulation (FM) the information is encoded by varying the frequency of

    signal. Broadcast radio uses Wideband FM (WFM), which is simply FM

    with a large bandwidth of about 200 kHz. Walkie talkies and other similar

    voice communications use narrowband FM (NFM), which is FM will a

    small bandwidth of about 12.5 kHz.


    Single side band (SSB) modes such as Lower Sideband (LSB) and Upper

    Sideband (USB) modes are like AM, but only use half the bandwidth of an'
  merge: -1
  pgno: 588
- img_proc: true
  md: 'equivalent AM signal. Transmitting on SSB requires less bandwidth and less
    transmission power and this is why ham radio users prefer to use SSB modes. The
    disadvantage is that SSB requires finer tuning to get a signal that sounds right,
    if you are not tuned correctly the audio will sound either higher or lower pitched.
    Data modes on HF are often transmitted in the USB or LSB mode.


    # DECIBELS (DB) TO TIMES


    Decibels can be a little confusing for those unaccustomed to them. Decibels (dB)
    are used to measure the intensity of a signal. The higher the dB value, the stronger
    the signal. Sometimes we say things like “the LNA (low noise amplifier) amplifies
    the signal by 20 dB”, or “the coax cable attenuates (reduces) the signal by 3
    dB”. A 20 dB increase in signal means that the signal is increased by 100x. A
    3 dB attenuation (loss) means that the signal is decreased by 2x.


    Engineers like to use decibels instead of times because it allows them to represent
    massive ranges in smaller numbers that are much more manageable.


    The formula to convert decibels to times is as follows, where X is the value in
    decibels.


    ```

    ratio = 10 ^ (X / 10)

    ```


    To convert to decibels from a ratio or unit use the following.


    ```

    power (dB) = 10 * log(ratio)

    ```


    Here is a table converting decibels to ‘times’.


    | Decibels | Ratio |'
  merge: -1
  pgno: 589
- img_proc: true
  md: '| | (dB) | |

    | 30 | 1000 |

    | 20 | 100 |

    | 10 | 10 |

    | 9 | 8 |

    | 8 | 6.31 |

    | 7 | 5.01 |

    | 6 | 4 |

    | 5 | 3.16 |

    | 4 | 2.51 |

    | 3 | 2 |

    | 2 | 1.58 |

    | 1 | 1.26 |

    | 0 | 1 |

    | -3 | 0.5 |

    | -10 | 0.1 |

    | -20 | 0.01 |

    | -30 | 0.001 |

    | -40 | 0.0001 |

    | -50 | 0.00001 |


    Decibels must be measured with respect to a unit. It is useful to measure with
    respect to power in watts (dBW) or milliwatts (dBm). As an example, we might have
    a signal that has a power of 0.00000000001 mW just before the antenna. This corresponds
    to -140 dB or -110 dBm. Our example'
  merge: -1
  pgno: 590
- img_proc: true
  md: 'antenna has a 3 dBi gain in the direction that the signal came from. Then we
    pass it through a 20dB LNA, loose 5 dB in the coax and then amplify again at the
    dongle by further 20dB. Our total input signal strength into the receiver is then
    given by:


    -110 dBm + 3 dBi + 20 dB - 5 dB + 20 dB = -72 dBm


    In amateur radio a signal said to be at S9 (good reception) is a signal that is
    -73 dBm strong, so our -72 dBm signal is quite strong. The RTL-SDR can receive
    signals down to about -130 dBm.


    Note from this calculation you might think that antenna gain is negligible overall.
    However, remember that an LNA amplifies any received noise as well as the signal.
    An antenna with good directivity towards the signal source will pick up more signal
    and less noise from other directions.


    A good video for learning more about decibels can be found at http://www.youtube.com/watch?v=1mulRI-EZ80.'
  merge: -1
