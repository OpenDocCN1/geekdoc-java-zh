  md: '# CUBICSDR


    CubicSDR is a relatively new sdr receiver program which is showing good promise.
    If it fully cross platform supporting Windows, Linux and OSX. Setting it up is
    extremely simple.


    +   1. If you have not done so already, download and install zadig from http://zadig.ake.ie/
    and install the WinUSB drivers for RTL-SDR using the instructions in the SDR#
    setup guide above.

    2. Go to www.cubicsdr.com and download the latest version for your OS from the
    downloads page.

    3. Open the installer and follow the prompts. This will install the software as
    well as all the appropriate RTL-SDR dll files.

    4. Open CubicSDR from the start menu, or Linux/OSX equivalent.


    If your RTL-SDR is plugged in, CubicSDR will automatically start and the spectrum
    will be visible. Simply click in the bottom waterfall area to tune.


    The screen is broken up into several parts. In the top left is a zoomed RF spectrum
    and waterfall display. On the right is an audio spectrum display and the main
    section on the bottom is a wideband RF spectrum and waterfall display. The center
    frequency can be changed by using the center frequency adjustment in the center
    right of the screen and the bandwidth and tuned frequency may also be changed
    here. Bandwidth can also be changed by clicking and dragging the edges of the
    tuned area in the main waterfall display. The mode can be selected with the top
    left vertical bar. The sample rate bandwidth can be changed with the input bandwidth
    menu. To easily set the PPM offset, hold the ALT button whilst hovering over the
    frequency input.'
