- img_proc: true
  md: 'I GET THE ERROR “NO COMPATIBLE DEVICES FOUND” WHEN TRYING TO START THE DONGLE
    IN SDR#


    Long low quality USB extension cables can sometimes cause this error. Some USB
    3.0 ports are also incompatible with the dongle and can cause this error. One
    user has had luck with this error by installing zadig from safe mode. Finally,
    there is a small chance that the dongle is actually faulty. If the dongle produces
    the same error on multiple computers the dongle is probably faulty and should
    be refunded or replaced.


    ZADIG TAKES A LONG TIME TO INSTALL THE DRIVER, THEN FAILS


    You have probably not run zadig in administrator mode. Make sure to right click
    zadig, and select “Run as Administrator”.


    I DON''T SEE BULK-IN, INTERFACE (INTERFACE 0)


    Ensure Options->List All Devices is checked. Some people report seeing something
    else than the bulk in the interface. If you installed the DVB-T drivers it may
    also show up as the brand of your dongle or something prefixed with “rtl”. Those
    selections should work too. In rare cases you may receive a faulty dongle that
    will not show up no matter what USB port or computer you try it in. You should
    ask for a replacement in this case.


    I DON''T SEE RTL-SDR/USB IN SDRSHARP


    You may have downloaded a version without RTL-SDR support. Check that you have
    downloaded SDR# from the official website.


    USB 3.0 PORTS DON''T WORK


    Unfortunately many USB 3.0 controllers are buggy and don’t work with some devices.
    Generally, USB 3.0 works fine with the RTL-SDR, but there are some controllers
    that will just not recognise the dongle. In this case use USB 2.0 port instead.


    WHEN I RUN INSTALL.BAT A CMD/DOS WINDOW FLASHES ON THE SCREEN BRIEFLY THEN DISAPPEARS.
    NOTHING IS DOWNLOADED OR INSTALLED.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'There seems to be a bug or misconfiguration with some versions of Windows which
    causes any batch file to be unable to execute. One way around this is to install
    SDR# and the RTL-SDR drivers manually. For instructions on how to do this please
    see Appendix D: Misc, Manual Installation of SDR#.


    # ZADIG GIVES “SYSTEM POLICY HAS BEEN MODIFIED TO REJECT UNSIGNED DRIVERS” ERROR
    IN WINDOWS 8


    Windows 8 can cause driver issues with zadig. Some users report getting the error:
    “System policy has been modified to reject unsigned drivers”. To solve this download
    the newer Zadig 2.1+ drivers from http://zadig.akeio.io/. Note the SDR# install.bat
    file now always downloads the latest Zadig.


    # RECEPTION IN SDR# SEEMS VERY POOR/RECEIVER IS INSENSITIVE


    Make sure you have increased the RF gain slider which can be accessed by clicking
    on the configure button. Also, in poor reception areas using the stock antenna
    indoors may not be sufficient. Though rare, another cause of insensitivity is
    a dongle blown by electrostatic discharge. It is possible to receive a blown dongle
    from the factory. If this is the case the dongle should be returned for a replacement.


    SDR# GIVES ERROR “APPLICATION FAILED TO INITIALIZE PROPERLY (0XC0000035). CLICK
    OK TO TERMINATE.”


    This might mean that you do not have the Microsoft .NET 3.5 Framework installed
    which is needed for SDR#. Download it from http://www.microsoft.com/en-gb/download/details.aspx?id=21.


    SDR# GIVES ERROR “CANNOT ACCESS RTL DEVICE”


    You may have tuned to a frequency that is out of range of the RTL-SDR. Tune back
    to a known supported frequency like 000.100.000.000 and press play.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'I GET THE ERROR “1 COMPATIBLE DEVICES HAVE BEEN FOUND BUT ARE ALL BUSY"

    On some computers the USB 3.0 ports can be buggy and will not work with the dongle.
    Use a USB 2.0 port instead. Also, this message sometimes occurs after the computer
    has been suspended. To fix it simply disconnect and reconnect the dongle. Sometimes
    it may also be necessary to reinstall the Zadig drivers.


