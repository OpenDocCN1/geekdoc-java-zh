    to see links on where to buy a Scantenna.


    # PLANAR DISK ANTENNA


    Name: Planar Disk Antenna


    Polarization: Vertical


    Broadband: Yes


    Uses: General purpose antenna good for almost all frequencies.


    A planar disk antenna is another antenna with a very wide receivable frequency
    range. A planar disk antenna is very simple to build as it consists of only two
    circular metal discs placed next to each other with the coax cable soldered to
    each disk at the place the two disks touch. The lowest frequency receivable is
    determined by the 1/4 wave disk width. A disk with a 50cm wide width will receive
    down to around 140 MHz.


    We don''t know of any planar disk antennas for sale, but they are very easy to
    build out of ordinary pizza pans. A nice tutorial can be found at http://www.wa5vjb.com/references/PlanarDiskAntennas.pdf.


