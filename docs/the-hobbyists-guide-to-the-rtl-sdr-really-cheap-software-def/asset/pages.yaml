  md: '# # HEAT MAP BAND SCAN


    ![](img/33eab9643eb7fbb4bf9363c117190041_443_0.png)


    A heatmap can help you discover where in the frequency spectrum signals are being
    received over a long period of time. To do this, the Linux and Windows software
    program rtl_power which is included with the official RTL-SDR package (Windows:
    http://sdr.osmocom.org/trac/attachment/wiki/rtl-sdr/RelWithDebInfo.zip) can be
    used. However, note that we highly recommend that you use Keenerds updated version
    of rtl_power available from http://igg.kmkeen.com/builds/. Keenerds drivers and
    rtl_power version completes scans significantly faster than the original drivers.
    This tutorial will be based on Windows, but it can easily be adapted to work on
    Linux running rtl_power in Linux is much easier.


    To create a heatmap we need to use a tool rtl_power. This tool logs average frequency
    power over a wide bandwidth using binning. To explain binning we use an example.
    Let’s say we are logging 1 MHz of bandwidth and choose to use a bin size of 2
    kHz. Then each pixel in the heatmap'
  merge: -1
  pgno: 443
- img_proc: true
  md: 'image would represent the average power over the 2 kHz bin size. Therefore,
    the heatmap image would be 500 pixels wide.


    To create a heatmap in Windows follow the instructions below. The instructions
    can also be adapted for Linux. In Linux rtl_power is installed as part of the
    RTL-SDR driver installation procedure.


    +   1. Download the official RTL-SDR release for Windows from http://sdr.osmocom.com/trac/attachment/wiki/rtl-sdr/RelWithDebInfo.zip
    and unzip the files into a folder.


    +   2. Download the latest version of heatmap.py from https://github.com/keenerd/rtl-sdr-misc/blob/master/heatmap/heatmap.py
    (Older Mirror: http://kmkeen.com/tmp/heatmap.py.txt) and save it to a text file
    with a .py extension in the same folder as rtl_power in the x32 folder.


    +   3. Install Python 2.7 x32 from http://www.python.org/download/. You must be
    careful to download the older 2.7 version and also ensure that it is the x32 version
    as well. This is because the PIL (Python Imaging Library) needs this version.
    Also take note of the path that you install Python to.


    +   4. In Windows right click on Computer in your start menu and go to Properties.
    Select Advanced System Settings and then click on Environment Variables. In the
    top window where it says User Environment Variables locate the “Path” variable.
    Add the path to your newly installed Python directory.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_445_0.png)


    +   5. Install Python Image Libraries Libraries from http://www.pythonware.com/products/pil/.
    Make sure you download the Python Imaging Library 1.1.7 for Python 2.7 for Windows.


    +   6. Using the Windows command prompt navigate into the directory where you
    have extracted the official RTL-SDR release and navigate to the x32 folder.


    +   7. Run rtl_power. As an example here is a line that will log 50 MHz of bandwidth
    with 2000 Hz sized bins over the frequencies 150 MHz to 200 MHz.


    ```

    rtl_power -f 150M:200M:2k -g 20.7 logfile.csv

    ```


    +   8. When you want to finish running rtl_power, press CTRL+C to quit.


    +   9. To generate the heatmap type the following.


    ```

    python heatmap.py image.png

    ```


    Note that there appears to be a bug with current rtl_power versions which causes
    a value of -1.#J to be sometimes written to the CSV file. If you get an error
    related to this when running heatmap.py, simply open the CSV file in a text editing
    program and do a find and replace of -1.#J and replace it with -1.00.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# RTL_POWER FLAGS


    More flags can be found by using rtl_power -h at the command line, but here we
    explain the most important flags.


    +   - lower:upper:binSize Specifies the frequency range to log over. bin_size
    specifies the width in Hz that each pixel will represent.

    - i integration Interval Time the average power for each bin will be summed over.

    - g tuner Gain of the RTL-SDR.

    - crop percentage The centre on a scanned spectrum is higher quality than the
    edges. This flag specifies how much of the edges are discarded. Larger values
    give better results, but slows scanning down. Specify as an decimal (0.2) or percentage
    (20%). Recommended values are between 0.2 and 0.5.

    - downsampler filters A from 0 - 9. Larger gives better results. Configures what
    downsampling filter to use. Higher values use more CPU.

    - e exit_timer Length of time that rtl_power should run.

    - single shot mode Perform one run and then exit.


    # RTL_POWER GUI


    There is a Windows GUI available for rtl_power called rtl-pan. It is available
    from http://sourceforge.net/projects/guifortlrpower/. It is capable of generating
    a heatmap like heatmap.py.


    To use rtl_pan, download the latest rtlpan.exe file from the above link and place
    it in the same folder as rtlsdr.dll, libusb-1.0.dll and rtl_power.exe. Then double
    click rtlpan.exe to start the program. After starting the program you can select
    your desired scanning frequency range, bin size, tuner gain and ppm offset. Running
    the software over time will produce the heatmap which can be saved to an image
    by clicking the photo icon in the top right corner. At the time of writing this
    tutorial there is currently no options to select more advanced options like crop
    size and downsample filters.'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# RTLDR SCANNER


    RTLDR scanner is a Windows tool that can generate a FFT plot over a wide bandwidth.
    It can be downloaded from http://eartearoak.com/software/rtl-scanner. There is
    a Windows installer available that will automatically download the various dependencies
    that are required for the software to run. When you get to the “Choose components”
    part of the installer, make sure that all the dependencies are selected for installation
    if you are unsure what your PC has installed.


    After installing RTLDR Scanner, simply enter a range in the Start and Stop boxes
    at the bottom of the window and set the desired gain. Press Start to begin scanning.
    The mode can be set to continuous or single. In continuous mode the scanner will
    continuously refresh the spectrum every time it finishes one pass, in single mode
    the scanner will performance one scan and then stop. The dwell time indicates
    how long the scanner will average over a range before recording the power values.
    Setting it larger will help clean noisy graphs, but will slow down scanning. The
    FFT size indicates the FFT resolution used during scanning. Higher values will
    give higher resolution graphs which show the structure of signals more clearly,
    but will cause scanning to be slower. RTLDR Scanner can also display the band
    scan as a spectrogram or 3D spectrograph by changing the settings in the Display
    pull down box.


    The latest version of RTLDR Scanner can also connect to an external GPS receiver
    and be used to create radio strength heatmaps of driving around with the RTL-SDR
    and GPS logging data. This can be useful for radio direction finding, which is
    the act of trying to locate the physical location of'
  merge: -1
  pgno: 447
- img_proc: true
  md: 'a radio transmitter. See the Radio Direction Finding section below for more
    information.


    ![](img/33eab9643eb7fbb4bf9363c117190041_448_0.png)'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# # RADIO DIRECTION FINDING WITH

    RTLSDR SCANNER


    As mentioned in the last section, RTL SDR Scanner has functionality that allows
    the creation of radio strength heatmaps which can be used for radio direction
    finding. In other words this simply means that you can find the location of a
    radio transmitter by driving around with a GPS enabled laptop running RTL SDR
    Scanner. As you drive around the signal strength will be correlated against your
    GPS position allowing a signal strength heatmap to be created.


    RTLDR Scanner is compatible with external GPS receivers that can output NMEA GPS
    data serially via RS232, USB or Bluetooth. It is also compatible on Linux with
    GPSd, a Linux GPS daemon.


    If your laptop does not have a built in GPS receiver you will need to use an external
    receiver. The most common GPS receiver that most people already own is an Android
    or iPhone smartphone. In this tutorial we show how to use a common Android or
    iPhone smartphone as the GPS receiver on a Windows laptop with bluetooth. The
    instructions here are specifically for Android, but they can easily be adapted
    for a jailbroken iPhone by using the TryGPSPOut available on the Cydia store for
    $1 USD.


    +   1. Go to the Google Play store on your Android phone and download the app
    titled “Bluetooth GPS Output” by Meowbox. This is a paid app but the free version
    will run for about 10 minutes giving you enough time to verify that the app works
    as intended. The full version costs around $1 USD and can be found on the play
    store.'
  merge: -1
  pgno: 449
- img_proc: true
  md: 'There are other similar apps for free that you can try, but we were only able
    to get this particular app to work without trouble.


    +   2. Now enable bluetooth on your laptop and phone.


    +   3. Open the Bluetooth GPS app and press the settings button and choose Make
    Discoverable.


    +   4. Now your phone will become visible to your laptop. Pair the two devices.
    Note that even though the devices are paired, the app will still show “not connected”
    in the top right corner. This is normal.


    +   5. In Windows go to Control Panel, click on “Change Bluetooth Settings” which
    will be under the Devices and Printers Heading.


    +   6. Go to the COM Ports tab. Take note of which COM port has the ‘Outgoing’
    direction. In the case of the screenshot shown below it is COM6.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_451_0.png)


    +   7. Plug in your RTL-SDR dongle into the laptop and open RTLDR Scanner.


    +   8. In RTLDR Scanner go to Edit->GPS. Check the Enable GPS box and click the
    Add button. In the added box choose the Type as NMEA (Serial), the Host as the
    COM port you identified in the previous steps as the ‘Outgoing’ port and under
