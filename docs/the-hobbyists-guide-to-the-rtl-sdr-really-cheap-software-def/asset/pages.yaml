    The plotted scatter graph below shows the difference between the baseline plot
    (no filter connected) and the FM bandstop filter plot. There is a clear dip in
    power in the FM band at 88 – 108 MHz. There is also another dip around 1.4 GHz,
    and some slight loss over the rest of the band due to the filter or possibly due
    to the type of connectors used.


    ![](img/33eab9643eb7fbb4bf9363c117190041_487_0.png)


    This next plot shows the attenuation, which is simply the baseline plot subtracted
    from the FM bandstop filter plot. The attenuation shows how strongly a signal
    at a particular frequency will be reduced in strength. In the graph we can see
    that the FM band has an attenuation of around 10 – 15 dB.'
  merge: -1
  pgno: 487
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_488_0.png)


    Below we also show the attenuation of the 1090 MHz ADS-B bandpass filter.


    ![](img/33eab9643eb7fbb4bf9363c117190041_488_1.png)


    # CHARACTERIZING COAX NOTCH/STUB FILTERS


    Another class of filters that can be tested with a noise source and RTL-SDR are
    coax notch filters, aka coax stub filters. Coax stub filters are simply a length
    of coax, cut to 1/4 wavelength * velocity factor of the desired notch frequency.
    They are usually used to reduce signal strength in a region with'
  merge: -1
  pgno: 488
- img_proc: true
  md: 'overly strong signals such as the FM broadcast band. Although they are called
    notch filters, the notch is usually quite wide. The required length can be calculated
    using an online calculator available at http://www.changpuak.ch/electronics/Coaxial
    Stub Filter Designer.php, or just by using the equation below, where the Frequency
    is the frequency in MHz that you would like to notch out.


    ```

    Stub Length [m] = \frac{75}{Frequency [MHz]} \times$ Velocity Factor

    ```


    When cutting the coax we recommend cutting the coax a little longer and then using
    the noise source and RTL-SDR to fine tune the length.


    The velocity factor is a parameter that is unique to each brand and type of coax
    cable. If you are unsure what the velocity factor is, we recommend either using
    the calculator (it has pre-set velocity factor values for various coax types)
    or determining it through the instructions shown in next heading.


    To test these filters you will need a T-junction (3-way) coax splitter. In this
    experiment we used a 3-way splitter with SMA connectors and used RG174U cabling
    with unknown velocity factor to create the coax stub filter. The image below shows
    how to connect everything together.'
  merge: -1
  pgno: 489
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_490_0.png)


    The excel plot below shows the response of a coax notch filter tuned for a notch
    at 157 MHz, in order to attenuate strong pager signals. The plot shows that at
    157 MHz there is a deep notch as expected. Note that there are also notches present
    at higher frequencies as well and that the notches can have quite wide bandwidths.
    This is expected and a potential flaw of coax stub filters.


    ![](img/33eab9643eb7fbb4bf9363c117190041_490_1.png)'
  merge: -1
  pgno: 490
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_491_0.png)


    # DETERMINING THE VELOCITY FACTOR OF COAX


    Working backwards from the coax stub formula is it possible to determine the velocity
    factor of an unknown piece of coax. Simply create a coax stub filter of any known
    length with your suspect coax, then use the above method to measure where the
    main notch lies. Then use the equation:


    > Velocity Factor = Frequency [MHz] × Stub Length [m] / 75


    In the previous experiment our coax stub measured 30.8 cm and had a main notch
    at 157 MHz. So we have a velocity factor given by the following calculation.


    VF = 157 * 0.308 / 75= 0.645


    This is quite close to the expected velocity factor value for most brands of RG174U
    which is 0.66.


    # DOWNLOADS


    Below are some example spreadsheets in .xls and .ods formats that we used in the
    above tutorial. You can use them as a starting point for your own'
  merge: -1
