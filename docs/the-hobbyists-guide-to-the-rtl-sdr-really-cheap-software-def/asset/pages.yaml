  md: '# ORBITRON TUTORIAL


    Using a program called Orbitron, SDR# can be made to automatically tune

    to NOAA and other satellites as they appear on your horizon. Also, although

    not entirely necessary for the RTL-SDR Orbitron will also help to

    compensate for satellite frequency drift due to the doppler effect.


    +   1. Download and install Orbitron from http://www.stoff.pl/.

    2. Download the Orbitron DDE drivers from http://www.stoff.pl/orbitron/files/mydde.zip
    (Mirror: http://bit.ly/YR4hdd). Extract the files to the Orbitron installation
    directory (likely in Program Files (x86)/Orbitron).

    3. Download the SDR# Orbitron plugin from http://public-xrp.s3.amazonaws.com/SatelliteTracker2.zip
    (Mirror: http://bit.ly/1u04xmV). The readme file comes with installation instructions,
    but some of the instructions did not work for you. You can follow their instructions
    or the ones below.

    4. Extract the SDR# Orbitron plugin files to the SDR# directory. With notepad
    or another text editor open Plugins.xml. Within the <sharpPlugins> </sharpPlugins>
    tags add the line <add key="SatelliteSharp.SatelliteTracker.SatelliteTrackerPlugin,SDRShar.SatelliteTracker"
    /> just below it.

    5. Open Orbitron in Administrator Mode (if in Windows Vista/7/8), by right clicking
    it and selecting Run as Administrator. Orbitron may open in full screen mode.
    Press Alt+Enter to exit full screen if you wish. You will probably also be initially
    presented with a TLE file update screen. You can leave all the boxes as default.
    Click on'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'the update button, which is the icon with a globe and lightning bolt.

    Orbitron will download the new TLE files. The TLE files contain the satellite
    orbit information and will need to be periodically updated every few days. Running
    Orbitron in Administrator mode is important, as otherwise the TLE files may not
    be able to be written to. If you don''t see the setup screen, you can get to it
    by clicking on the Setup icon 🛠, in the main Orbitron tab.


