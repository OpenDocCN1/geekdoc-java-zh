- img_proc: true
  md: '# WEATHER BALLOON (RADIOSONDE) GUIDE


    Around the world meteorological weather balloons are launched twice daily. Once
    launched they continuously transmit weather telemetry to a ground station using
    something called a radiosonde. The RTL-SDR combined with a decoding program can
    be used to intercept this telemetry and display the weather data on your own computer.
    You will be able to see real time graphs and data of air temperature, humidity,
    pressure as well as the location and height of the balloon as it makes its ascent
    and descent.


    Note that radiosonde decoding may be difficult in many places in the USA. Recently
    the USA switched to Vaisala radiosondes, some of which are decodable. Unfortunately,
    they appear to be using the more difficult to receive frequency of 1680 MHz rather
    than the more common 403 - 406 MHz range used by the rest of the world. It is
    possible that some stations use the lower frequency band however. SondeMonitor
    is able to decode Digital RS92SGP, Analogue RS92AGP, Analogue RS80, Analogue 92KL,
    G DFM-06, MeteoModem M2K/M10 and Meteorabel SRS-C34 radiosonde protocols.


    This tutorial is also applicable to other software defined radios such as the
    Funcube, HackRF, BladeRF or even hardware radios with discriminator taps, but
    the RTL-SDR is the cheapest option that will work.


    # RADIOSONDE RECEIVING TUTORIAL


    # RADIOSONDE ANTENNA TUTORIAL


    In Europe and the Pacific, most radiosondes transmit at a frequency that is between
    403 and 406 MHz. In the USA and Asia they most commonly'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'transmit in the 1680 MHz band between 1668.4 and 1700 MHz. You will need an
    antenna capable of receiving those frequencies. Antennas for the 403 to 406 MHz
    band could be a quarter wave groundplane, dipole, jpole, turnstile or a QFH antenna.
    Circularly polarized antennas tend to work better. If you use good signal of the
    previously mentioned antennas may also work well for the 1680 MHz band sized for
    frequency. A Yagi antenna works especially well for the 1680 MHz band if you require
    more gain from a weak signal and are willing to track the radiosonde by hand or
    other means. See the antenna guide for more information about these antennas.


    An LNA and preselector may also aid reception. See the LNA section and preselector
    section for more information.


    # SOFTWARE TUTORIAL


    In order to receive and decode weather balloon radiosondes you will need to ready
    fine five things.


    +   - An antenna capable of picking up signals near 403 to 406 MHz (or 1680 MHz).

    - A decoding program called SondeMonitor which is able to decode radiosonde telemetry.

    - The knowledge of when and optionally where weather balloon radiosondes are launched
    in your area.

    - The knowledge of what type of radiosonde protocol is used in your area (can
    sometimes be guessed by trial and error).

    - An audio piping method. See Appendix A: Audio Piping for more information if
    you don''t have one set up.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Weather balloons are usually launched 45 minutes before the official observation
    time of 0000 UTC and 1200 UTC, though times may be different in some countries.
    You will need to either Google or check with your local meteorological agency
    for a more exact time of when they are launched in your area. You will also need
    to check with your local meteorological agency on the type of radiosonde that
    they are using. They are often happy to oblige this information.


    One of the most used radiosonde signals is the Vaisala RS92SGP digital signal.
    A waterfall example of this signal is shown below. It has a bandwidth of around
    5 kHz.


    ![](img/33eab9643eb7fbb4bf9363c117190041_242_0.png)


    To decode weather balloon radiosondes follow these steps:


    +   1. Download and install SondeMonitor. SondeMonitor is paid software with a
    25 euro price tag, but comes with a 21 day trial. Download SondeMonitor from http://www.coaa.co.uk/sondemonitor.htm.

    2. When a weather balloon is due to be launched, open SDR# or another radio receiver
    GUI program, set your audio piping method under the Audio Output drop down box
    and tune to a frequency between 403 and 406 MHz (or 1680 MHz). Scan around and
    look for a radiosonde signal, which should be a narrowband signal of around 5
    kHz bandwidth. If you find one tune to it and adjust the RF gain settings for
    best performance. Set the receive mode to NFM'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'and filter audio to OFF. Adjust the filter bandwidth so that it just covers
    the signal.


    +   3. Open SondeMonitor and go to Options -> Audio -> Audio Source and choose
    the audio piping method you are using.


    +   4. Select the radiosonde decoding protocol used in your area. These can be
    selected with these icons 彩 😖 � ⌏ which are to the right of the start and stop
    icons. Hovering over the icons will show which protocol they represent. If you
    don''t know what protocol your area uses, you can try each one at a time hope
    that one works


    +   5. Now start the decoding by clicking the green start circle ● A telemetry
    data window will pop up. Next, click on the raw signal icon ↝. Adjust the audio
    volume using the audio gain in SDR# or Windows volume settings so that the audio
    graph is loud enough to be visible, but not too loud as to cause clipping. Clipping
    is when the signal is too loud and the waveform begins to look squarish. An ideal
    volume is shown below.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_244_0.png)


    6. At this point, if your signal reception is good and you have selected the correct
    decoding method, the telemetry window will show data and have four green circles.
    Note that SondeMonitor requires some initial time to calibrate. The amount of
    the calibration process completed can be seen in the red bar in the lower left
    corner of the main window, which will slowly turn green as calibration completes.
    The calibration status can also be tracked in the telemetry window. If calibration
    does not complete, or takes a very long time, it means your signal strength is
    not good enough.'
  merge: -1
