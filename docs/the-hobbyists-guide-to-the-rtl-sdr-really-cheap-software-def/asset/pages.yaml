- img_proc: true
  md: 'You can also send the output of acarsdec through a network connection to a
    PC running PlanePlotter. To do this, first find out the IP address of the PC running
    PlanePlotter. Then on the Linux device use the following where you should replace
    IP_ADDR with the ip address of the computer running PlanePlotter.


    ```

    /acarsdec -n IP_ADDR:9742 -r 0 131.550 131.350

    ```


    Next in Windows and in PlanePlotter ensure that under Options->I/O Settings you
    have the “UDP/IP data from net” checkbox checked, then press the green button.
    As ACARS packets are received on the Linux computer running acarsdec, they will
    also show in the PlanePlotter messages. Using this you could have a remote embedded
    PC such as a Raspberry Pi running acarsdec feeding PlanePlotter from a distance.


    # RTL_ACARS_NG


    rtl_acars_ng is a much simpler ACARS command line decoder. To run rtl_acars_ng
    simply download the zip file from https://github.com/gat3way/rtl_acars_ng, extract
    it then run make as shown below. To get help run /rtl_acars_ng -h.


    ```

    sudo apt-get install libusb-dev

    git clone https://github.com/gat3way/rtl_acars_ng

    cd rtl_acars_ng

    make

    ```


    Then you can run the program using the following.


    ```

    /new_rtl_acars -f 131.550M

    ```'
