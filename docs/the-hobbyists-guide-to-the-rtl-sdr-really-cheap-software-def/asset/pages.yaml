    | SockRock Ensemble II | 0.180 - 0.1923 | Soundcard RX/TX. Filters. | 67 (TX)
    89 (RX/TX) |

    | AirSpy | 24 - 101750 | 12 | RX. Filters. | 199 |

    | Mirics (Msi3101) | 64 - 1085162240470960 | 12 | RX | 85 |

    | SDR Play | 100 - 83804302000 | 12 | RX. Filters. | 149 |


    For reception only dongles there is the AirSpy which has improved performance
    over the RTL-SDR with its improved ADC bit size and good RF design. The Funcube
    dongle is another device similar to the RTL-SDR, but with improved RF design and
    switched front end filters. The Mirics Msi3101 is another dongle like the RTL-SDR
    as was intended for DVB-T TV but also has SDR capabilities. Currently Mirics TV
    dongles are difficult to find and if you can find them they are quite expensive
    with a poor frequency range. Another SDR is the SDR Play which uses the Mirics
    Msi3101 chip in its design and also has switched first order filters. In most'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'cases according to some tests at http://www.rtl-sdr.com/comparison-several-sdrs-degradation-broadcast-fm-frequencies/,
    the Airspy is the best performing RX only device, followed by the Fucube and potentially
    the SDR Play.


    In the mid to high end of the SDR hardware spectrum we have the HackRF/BladeRF
    and USRPs which are all capable of receive and transmit. The HackRF is however
    only capable of half duplex operation, meaning that it can either transmit or
    receive at any one time. The BladeRF and USRP radios are full duplex meaning that
    they can receive and transmit at the same time. The USRP B210 is even capable
    of receiving and transmitting on two channels at the same time while the B200
    is full duplex on only one channel.


    If you are mainly interested in the HF bands where ham radio is not active, you
    may want to get a SDR dedicated to the ham HF frequencies. There are many of these
    HF SDRs available these days and they have much better performance compared to
    the more general purpose SDRs listed above. On our blog we have a very large list
    of many alternative SDRs at http://www.rtl-sdr.com/roundup-software-defined-radios/.
    One popular low cost HF only SDR is the Softrock Ensemble II (can also transmit
    with the appropriate kit) which comes as a kit. You will need good soldering and
    construction skills to complete the kit. It has excellent shortwave reception
    performance.


    For those just wanting a taste of what it might be like to own a HF SDR, there
    is the excellent online WebSDR http://websdr.ewi.utwente.nl:8901/ which is a great
    receiver for those wanting to just look at what might be in the HF bands.'
