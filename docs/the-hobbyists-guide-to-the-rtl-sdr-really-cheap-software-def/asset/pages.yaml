  pgno: 47
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_48_0.png)


    Zoom FFT is a plugin that comes by default with SDR#. It creates a zoomed in RF
    spectrum display of the tuned IF bandwidth at the bottom of SDR#.


    # ENABLE IF


    Creates a “zoomed in” RF spectrum around the area of your tuned IF bandwidth.
    Allows you to see the signal structure with much greater resolution.


    # ENABLE FILTER


    If Enable IF is checked, then you can enable a special adjustable IF filter. This
    allows you to filter the left and right side of the tuned IF individually. See
    the [setting the filters section](# below more more information on its use.


    # ENABLE MPX


    Enables you to see the MPX spectrum of a broadcast FM radio station. Broadcast
    FM is encoded in a special baseband audio format called MPX. It contains a mono
    section, a pilot tone and a stereo section, as well as sometimes subcarrier sections
    for data like RDS and special radio services like SCA. If you were to try and
    view the audio bandwidth with the “Enable Audio” button, you wouldn’t see the
    MPX structure because SDR# would have processed it into normal audio, and discarded
    the subcarriers and other sections.


    # ENABLE AUDIO


    Allows you to see the audio (baseband) spectrum.


    # DIGITAL NOISE REDUCTION (DNR)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_49_0.png)


    It is useful to turn on digital noise reduction when listening to noisy analogue
    voice signals. This setting will attempt to reduce the background ‘hiss’ sound.
    There are two DNR options available, IF and Audio. The IF uses the reudiction
    algorithm on the IF signal and the Audio option does it on the output audio signal.
    Usually the IF digital noise reduction works best and should be tried first, though
    a combination of both may work best. The sliders control the strength of the algorithm
    applied.


    # NOISE BLANKER


    ![](img/33eab9643eb7fbb4bf9363c117190041_49_1.png)


    The noise blanker is an algorithm that can be turned on to help reduce impulsive
    and pulsing like noise from sources like spark gaps. Examples of this type of
    noise may come from motors, electricity lines and switching power supplies. Using
    this option can really help when receiving a weak signal amongst noise.


    # RECORDING TAB'
  merge: -1
  pgno: 49
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_50_0.png)


    The recording tab allows you to make I/Q and Audio recordings. The sample format
    allows you to choose the level of recording quality needed. Since the RTL-SDR
    is only about 8-bits, we can select the lowest 8 Bit PCM option. Using only 8-bits
    saves a significant amount of disk space.


    An I/Q recording is a recording of the entire bandwidth you are currently tuned
    to. It saves data in that bandwidth so you can replay it at a later time. An I/Q
    recording can use up a lot of disk space, so make sure to watch the File Size
    and Duration status counters. By checking the “Baseband” check box. I/Q recordings
    can be played back in SDR# by selecting IQ File (*.wav) from the source menu.
    If you receive a lot of dropped buffers, then your PC or disk may not be fast
    enough to process the recording.


    The audio coming out of the speakers can be recorded by checking the “Audio” check
    box. This will record audio to a wav file.


    All recorded files are stored in the same folder as the SDR# executable.


    # FREQUENCY MANAGER TAB'
  merge: -1
  pgno: 50
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_51_0.png)


    The frequency manager allows you to save any frequencies of interest in a database.
    A new frequency can be added to the database by clickong on the New button. This
    will add a frequency with the current tuned frequency and settings like bandwidth.
    You can edit the frequencies name and put it into a group for easy management.


    If you check the “Show on spectrum” check box then your saved frequencies will
    be displayed in the RF spectrum.


    # RIGHT HAND SIDE SLIDERS


    ZOOM


    Recommended Default Setting: Zoomed out


    Moving this slider will cause the RF spectrum and waterfall to zoom in on your
    tuned IF bandwidth in order to see a signal closeup. However, the more you zoom
    in, the lower the resolution will be. An alternative to zooming is to either reduce
    the sample rate, or to use the special decimation drivers which are discussed
    later in the Optimizing Tuning section. These'
  merge: -1
