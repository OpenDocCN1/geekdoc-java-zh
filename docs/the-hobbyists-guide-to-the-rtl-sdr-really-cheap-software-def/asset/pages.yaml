- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_246_0.png)


    # # GPS RADIOSON LOCATION TRACKING


    For most launches, the weather balloon’s live location and altitude can be tracked
    live in Google Earth. However, some radiosonde protocols such as the RS92SGP not
    transmit latitude and longitude data directly. Instead, they transmit raw GPS
    data which can be converted into longitude and latitude on the receiving end (your
    computer). To do this, the radiosonde’s starting coordinates, UTC launch date
    and UTC time and an up to date GPS almanac are required. The almanac is a data
    file that stores information about the GPS satellite locations.


    The MeteoModem MK2/M10, Graw DFM-06 and Meteorab SRS-C34 are radiosondes which
    transmit already decoded GPS location data. The following steps are only for the
    other radiosondes which transmit raw GPS data, such as the RS92SGP.


    +   1. Download an up to date Almanac from the US Coast Guard Nav Centre at http://www.navcen.uscg.gov/?pageName=gpsAlmanacs.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'You will want to get the current SEM Almanac with the .al3 extension.


    2. In SondeMonitor, go to Tools -> GPS Arm. Enter the Latitude and Longitude of
    the weather balloon''s launch location. You will also need to enter the UTC date
    of the flight and the approximate UTC time at mid flight. Make sure the date and
    time is in UTC time. Weather balloons last about 2 to 4 hours, so just estimate
    a mid flight time. Select Almanac as your Orbital data. The other options can
    be left as default.


    ![](img/33eab9643eb7fbb4bf9363c117190041_247_0.png)


    3. Once you press OK, a file selection dialog box will pop up. Browse to the folder
    where your current .al3 Almanac file is stored and open it. Now, if you have set
    the Almanac, start coordinates and time set up correctly, the GPS Residual in
    the SondeMonitor telemetry status window will be to within a couple of hundred'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'meters. The smaller the residual, the more accurate the weather balloon location
    is. If you have gotten any parameters wrong, the residual will be very large.


    4. To see the balloon in Google Earth, go to Options -> Google Earth and ensure
    Live G-E Server has a check next to it by clicking it if it does not.


    ![](img/33eab9643eb7fbb4bf9363c117190041_248_0.png)


    5. Open with your SondeMonitor installation folder in Explorer. Find the file
    google_sonde.kml and open this file with Google Earth. You should now be able
    to see the weather balloon''s launch location and current live location in Google
    Earth.'
  merge: -1
  pgno: 248
