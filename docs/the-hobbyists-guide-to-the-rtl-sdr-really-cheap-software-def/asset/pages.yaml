    +   5. Now type the following command to start the software.


    ```

    acarsdeco2.exe --gain 38.0 --freq-correction 65 --freq 131550000 --freq 131725000
    --http-port 8090 --vrs-url http://192.168.1.10:80 --udp 127.0.0.1:9742 --net 30008

    ```


    +   6. You should set the flag values (the words with the double dashed before
    - explained below) appropriately to your conditions. The last three flags (--vrs-url,
    --udp and --net) can be omitted for simple operation unless you wish to use those
    features explained in the flags description below.


    +   --gain - the optimal gain setting you found in step 1


    +   --freq-correction - the PPM offset of your dongle (very important), must be
    set accurately)


    +   --freq - you can add up to three ACARS frequencies by specifying more than
    one --freq flag


    +   --http-port - the http port to be used for the Acarsdeco2 web interface


    +   --vrs-url - if you are running Virtual Radar Server at the same time with
    ADS-B decoding, you can get the images of the aircraft to show up in the Acarsdeco
    web interface (not required if not using Virtual Radar Server)'
