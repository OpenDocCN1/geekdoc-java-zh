  md: '# DECODING ORBCOMM SATELLITES


    Orbcomm satellites are low earth orbit communications satellites that provide
    two way data services and also global positioning services to portable terminals.
    They transmit data at 137 - 138 MHz making them easy for scanners to receive with
    a good satellite antenna. They are also easy to receive as there are many orbcomm
    satellites in the sky positioned such that there will almost always be one available
    to receive at any point on the earth.


    While Orbcomm signals can be received with a standard whip antenna tuned to the
    137-138 MHz frequencies, a dedicated satellite antenna such as a turnstile or
    QHF antenna will provide much improved reception. See the [Antenna Chapter](#)
    for more information on suitable antennas.


    Although you cannot decode actual Orbcomm data with a radio scanner like the RTL-SDR,
    you can decode Orbcomm telemetry which will let you find out satellite positions
    and uplink/download frequencies. To do this a program called OrbcommPlotter can
    be used which can be obtained from http://www.coaa.co.uk/orbcommplotter.htm Orbcomm
    plotter is not free, but there is a 21 day trial which can be used before paying
    24 euros.


    To use OrbcommPlotter follow the steps below.


    +   1. Open your favourite SDR receiver such as SDR# or SDR-Radio.


    +   2. Set the audio output device to your preferred audio piping method.


    +   3. Tune to an Orbcomm frequency and set the receiver to NFM mode.


    +   4. Open OrbcommPlotter.'
  merge: -1
  pgno: 468
- img_proc: true
  md: '5. Go to Options->->Source and choose the audio piping method you used in your
    SDR receiver.


    6. Go to the screen by pressing the signal button  Ensure Ensure the signal level
    is loud enough, but not clipping.


    7. Go to the Messages screen by pressing the messages button Ⅲ. Orbcomm telemetry
    should be displayed in this window.


    ![](img/33eab9643eb7fbb4bf9363c117190041_469_0.png)


    You may also wish to use Orbitron to automatically map SDR# tune to visible Orbcomm
    satellite frequencies. See the Orbitron tutorial in the NOAA weather satellite
    guide, but use Orbcomm satellites instead of NOAA weather satellites.


    # REFERENCES AND ADDITIONAL LINKS


