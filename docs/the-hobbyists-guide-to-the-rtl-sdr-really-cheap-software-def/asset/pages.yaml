  md: '# DIGITAL AUDIO BROADCASTING

    (DAB) RADIO GUIDE


    Digital Audio Broadcasting (DAB) is a digital radio technology used to broadcast
    commercial radio stations. It is an alternative to broadcast wideband FM stations
    that is used in many countries, especially Europe. The DVB-B TV software from
    the CD provided with some dongles actually has DAB decoding software, however
    this software requires the installation of the official drivers which would prevent
    any general SDR use.


    # DAB RECEIVE TUTORIAL WITH SDR-J


    Instead, to listen to DAB radio with the SDR drivers installed, a program called
    SDR-J can be used. SDR-J is a Windows and Linux program that is capable of receiving
    DAB and DAB+. It also comes with an FM receiver, however this won''t be used in
    our tutorial. SDR-J can be downloaded from http://www.sdr-j.tk/. Make sure to
    download the dabstick-radio zip file.


    +   1. Download SDR-J and extract the zip file to a folder.

    2. Open the dabreceiver.exe file.

    3. If your RTL-SDR dongle is plugged in and properly set up the SDR-J DAB screen
    will show.'
  merge: -1
