    # Meuring Filter Attenuation:


    http://www.rtl-sdr.com/wp-

    content/uploads/2015/03/Measure_Filter_Attenuation.xls

    http://www.rtl-sdr.com/wp-

    content/uploads/2015/03/Measure_Filter_Attenuation.ods


    # MEASURING THE VSWR OF ANnANTENNA WITH A NOISE SOURCE AND RTL-SDR


    With the same hardware needed to characterize filters shown in the tutorial above,
    and an additional piece of hardware called a directional coupler the standing
    wave ratio (SWR) of antennas can also be measured. The SWR of an antenna determines
    where the antenna is resonant and is important for tuning for the frequency you
    are interested in listening to. See the Antenna Guide section in this book for
    more information on VSWR.


    # EQUIPMENT


    For measuring the VSWR of an antenna you will need some of the same equipment
    needed for characterizing filters, as well as a directional coupler.


    +   BG7TBL Noise Source ($29.50 USD). Available on ebay and Aliexpress, search
    for “DC12V 0.2A Noise Source for External Tracking Source"


    +   12V Power Supply that can supply at least 0.2A for powering the noise source
    (~$5 USD)


    +   RTL-SDR Dongle (~$10-$25 USD)'
  merge: -1
  pgno: 492
- img_proc: true
  md: '+   - MiniCircuits ZDFC-20-5 Directional Coupler (~$38 USD). You can usually
    find a Minicircuits directional coupler on ebay by searching for “Minicircuits
    Directional Coupler”.


    MiniCircuits directional couplers can often be found, but in good condition on
    ebay for about half price. In our experiments we actually used a MiniCircuits
    ZDFC-15-5 coupler with SMA connectors, they appear to be sold out on ebay at the
    time this was written. The ZDFC-20-5 should work just as well however as will
    similarly speced directional couplers. Try and find a directional coupler that
    works over the frequencies that you are interested in. A good video showing use
    of a directional coupler in a similar experiment and explaining a bit about how
    one works can be found here https://www.youtube.com/watch?v=iBK9Zlx9YaY.


    # MEASURING THE VSWR OF AN ANTENNA TUTORIAL


    To measure the VSWR of an antenna with the noise source and RTL-SDR we will use
    the directional coupler in reverse. Here we connect the noise source to the output
    of the coupler, the antenna to the input of the coupler and the RTL-SDR dongle
    to the coupling (CPL) port of the coupler. This way power from the noise source
    should be reflected from the antenna into the RTL-SDR. The image below shows how
    to connect the noise source, directional coupler and RTL-SDR together.'
  merge: -1
  pgno: 493
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_494_0.png)


    Open the RTL-SDR Panorama GUI and enter the frequency range of which you''d like
    to check the VSWR of the antenna. Also, set the resolution to 1M and gain to 0.


    First do a sweep with the antenna disconnected from the coupler. After the sweep
    is done, stop RTL-SDR Panorama and rename the scan.csv file found in the same
    folder as rtlpan.exe to swr.csv. Note that after clicking on stop stop in RTL-SDR
    Panorama you will need to wait for the current sweep to stop before you can rename
    the swr.csv.


    Secondly do the same sweep but with the antenna connected. Now open the swr.csv
    file and the latest scan.csv files in Excel or any similar program and copy the
    power data (the last column) from scan.csv into an empty column in swr.csv.


    Now subtract the values in the first power column (power with antenna disconnected)
    from the values in the second power column (power with antenna connected) that
    you have just copied over. This will give you the return loss. If you get any
    negative values in the return loss column you may need to adjust the values so
    that the negative values are forced to be a'
  merge: -1
  pgno: 494
- img_proc: true
  md: 'positive value like 0.0001. In Excel this can be done by creating a new column
    and using the max function on the return loss column, such as “max(0.0001, J2)”.
    Negative values sometimes appear because the measurement accuracy of this method
    is not perfect.


    The VSWR can then be calculated from the return loss (RL) with the following equation.


    ```

    VSWR = \frac{10^{RL[dB]/20} + 1}{10^{RL[dB]/20} - 1}

    ```


    Calculate the VSWR in another column. The image below shows what your Excel sheet
    might look like.


    | Date | Antenna | Connected | Return Loss | Adjusted RL | VSWR |

    |---|---|---|---|---|---||

    | 26/02/2015 15:33:20 | 3.03E+08 | 3.04E+08 | 1000000 | 3 | 2.80 | -0.46 | 0.0001
    | 17717.8 |

    | 26/02/2015 15:33:20 | 3.04E+08 | 3.05E+08 | 1000000 | 1 | 0.49 | 0.65 | -0.16
    | 0.0001 | 17717.8 |

    | 26/02/2015 15:33:20 | 3.05E+08 | 3.06E+08 | 1000000 | 1 | 0.34 | 0.66 | -0.12
    | 0.0001 | 17717.8 |

    | 26/02/2015 15:33:20 | 3.06E+08 | 3.07E+08 | 1000000 | 1 | 0.44 | 0.39 | 0.05
    | 0.054688 |

    | 26/02/2015 15:33:20 | 3.07E+08 | 3.08E+08 | 1000000 | 1 | 0.66 | 0.06 | 0.6
    | 2.86468 |

    | 26/02/2015 15:33:20 | 3.08E+08 | 3.09E+08 | 1000000 | 1 | 0.54 | -0.01 | 0.55
    | 3.119541 |

    | 26/02/2015 15:33:20 | 3.09E+08 | 3.10E+08 | 1000000 | 1 | 0.45 | -0.17 | 0.62
    | 3.21589 |

    | 26/02/2015 15:33:20 | 3.10E+08 | 3.11E+08 | 1000000 | 1 | 0.37 | -0.27 | 0.64
    | 27.25568 |

    | 26/02/2015 15:33:20 | 3.11E+08 | 3.12E+08 | 1000000 | 1 | 0.35 | -0.43 | 0.78
    | 22.2848 |


    Now plot the VSWR using a scatter plot with frequency on the x-axis and SWR on
    the y-axis (vertical). Convert the vertical axis to a logarithmic scale for a
    better view.


    Below we show the VSWR plot of a monopole antenna that is 23 cm long placed on
    a 20 cm diameter cookie tin that is acting as a ground plane. A perfect ground
    plane antenna with a 23 cm length whip should be resonant at about 310 MHz. However,
    because the ground plane for this antenna is only 20 cm, the VSWR minimum point
    is pushed up to around 355 MHz. At the minimum point the VSWR is about 1.15. Using
    a larger cookie tin would cause the VSWR point to approach 300 MHz.'
  merge: -1
  pgno: 495
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_496_0.png)


    Here we compare our results with a SWR simulation of our 23 cm monopole antenna
    and 20 cm ground plane made in the antenna modelling called 4NEC2. See the 4NEC
    tutorial section for more information on this Antenna modelling software. We can
    see that the real world SWR plot approximately matches the simulation. Unmodelled
    factors such as coax cable, the type of connectors used as well as the RTL-SDR
    measurement accuracy can explain some of the discrepancies.


    ![](img/33eab9643eb7fbb4bf9363c117190041_496_1.png)'
  merge: -1
  pgno: 496
- img_proc: true
  md: 'Below we show the SWR plot of a tuned quarter wave ground plane 1090 MHz antenna
    carefully made for ADS-B reception. The SWR at 1090 MHz is about 1.5 which is
    quite decent for this kind of antenna.


    ![](img/33eab9643eb7fbb4bf9363c117190041_497_0.png)


    Many people incorrectly believe that the SWR value does not matter for receive
    only antennas. This misconception probably comes from the fact that a poor SWR
    value on a transmitting antenna could destroy the transmitter, but a poor SWR
    value on a receiving antenna poses no such threat. However, while it won''t destroy
    your radio, a poor SWR value will still significantly impact reception. By using
    the calculator available at http://www.csgnetwork.com/vswrosscalc.html, it is
    possible to determine the amount of signal loss you can expect with a particular
    SWR value. At a SWR of 1.5 we can expect a very small loss of about 0.177 dB (4%
    of the received power), while an SWR value of 10 gives a 4.807 dB loss (67% of
    the received power).


    # DOWNLOADS


    Below are some example spreadsheets in .xls and .ods formats that we used in the
    above tutorial. You can use them as a starting point for your own'
  merge: -1
