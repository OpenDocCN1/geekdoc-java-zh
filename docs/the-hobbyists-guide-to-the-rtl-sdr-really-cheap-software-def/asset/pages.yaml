- img_proc: true
  md: 'Note that LRPT.exe was actually designed for the Meteor-M1 satellite which
    is now inactive. Because of this there might be some artefacts that appear in
    the final image like black bands.


    # RECEIVING METEOSAT WEATHER SATELLITE IMAGES IN REAL TIME: WINDOWS


    Thanks to new software developments, it has recently become possible to decode
    Meteor M2 LRPT images in real time. This method is still a little difficult to
    set up, but as well as getting real time results, it also results in better satellite
    locks and better images. To use real time decoding you will need the satellite
    tracking software Orbitron, the QPSK decoder plugin for SDR#, a DDE interface
    plugin for SDR/, and a special version of LRPTDecoder. This method will also record
    a backup I/Q file of the LRPT signal, which can then be run through the offline
    method (shown above), just in case the real time method does not work. Note that
    this method is fairly new and may still be developing and changing fast.


    Note that this tutorial is based heavily on Alex’s (happysat) original tutorial
    which can be found on our blog at http://www.rtl-sdr.com/rtl-sdr-tutorial-decoding-meteor-m2-weather-satellite-images-in-real-time-with-an-rtldr/.
    If you need more help, want to learn more about real time decoding, or have trouble
    with this tutorial, please consult his tutorial as


    # DOWNLOAD THE SOFTWARE


    +   1. First download the QPSK plugin compatible LRPTdecoder software from http://meteor.robonuka.ru/for-experts/amigos/downloads/amigos-compatible-lrptofflinedec/
    and extract it to the folder C:\AMIGOS\. Note that although the file name is still
    called LRPTToffLineDecoder.exe, it is actually an online decoder.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '2. Next download the DDE orbitron interface plugin and the QPSK demodulator
    from http://www.rtl-sdr.ru/page/komplekt-plaginov-dlja-priema-sputnikov. Also
    optionally download the IF recorder plugin from http://www.rtl-sdr.ru/page/dobavlen-novyj-plugin-recorder
    if you want to be able to make a backup recording of the LRPT site, just in case
    the online method fails for reason. Note that these pages are in Russian, so use
    Google Translate. Translate the contents of these plugin zip files to your SDR#
    installation folder and add the magicline.xml file. If you need help with installing
    plugins, see the installing SDR# plugins section.


    # SYNCHRONISING WINDOWS TIME


    To improve signal locking with Meteor M2 it is critical that the Orbitron doppler
    correction is accurate, and for Windows time needs to be accurate. This is because
    Orbitron uses the current time to calculate where the satellite should be in space,
    and what doppler correction is needed for your location. As explained in the NOAA
    tutorial, Orbitron contains its own method to update PC time from the NTP servers.
    However, this only activates once you click the update button. Time correction
    isn''t critical for NOAA satellites as it is for Meteor M2, because NOAA satellites
    are analog and don''t need to lock onto a digital signal. We suggest you download
    an NTP automatic update program which will automatically synchronise the PC clock
    with NTP time every few seconds. The software can be from https://www.meinbergglobal.com/english/sw/ntp/ntp.htm#stable,
    choose the download for NTP for Windows XP and newer, and IPv6 support. Note that
    before running the installer make sure that Orbitron is closed, as it''s own'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'NTP update procedure may prevent the setup from completing successfully.

    Below we show the setup options should be configured.


    +   1. During the setup make sure you choose the closest location to you

    where it says “Want to use predefined public NTP servers (see www.pool.ntp.org?)
    Choose.


    ![](img/33eab9643eb7fbb4bf9363c117190041_226_0.png)


    +   2. You can simply click no at the next screen.


    ![](img/33eab9643eb7fbb4bf9363c117190041_226_1.png)


    +   3. The next screen can also be left as default as shown in the image below.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_227_0.png)


    4. In the next screen you will be required to create an NTP account on your PC.
    Simply enter a password, and remember it in case you need to alter some settings
    in the future.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_228_0.png)


    5. Click next and the NTP time service should install and be automatically started.
    If you receive an error about the NTP time service not being able to be started,
    ensure you have closed Orbitron and rerun the installer. After installing NTP
    you may also need to manually turn off Windows time synchronisation which is a
    very poor job compared to NTP. In control panel go to Date and Time settings,
    and ensure that Windows synchronisation is turned off.


    If you need further help with the setup of NTP sees a more in depth guide at http://www.satsignal.eu/ntp/setup.html.


    # ORBITRON AND SDR# SETUP


    Below we explain the steps to set up Orbitron and SDR# to receive and decode Meteor
    M2 in real time. We also present some optional steps that will allow you to set
    up an automatic scheduler so that your system will'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'automatically tune to the Meteor M2 frequency and open the decoders when the
    satellite begins to pass overhead.


    +   1. Go to C:\Orbitron\Config\setup.cfg and open this file with a text editor
    like Notepad. At the end of the file add the following lines, making sure to edit
    the file path to the exact location of your own SDR# installation folder and the
    SDRSharpDriverDDE file which is included with the SDR# DDE plugin.


    [Drivers]

    SDRSharp:C:\YOUR_SDRSHARP_INSTALL_FOLDER\SDRSharp\SDRSharpDriverDDE.exe


    +   2. Now open Orbitron and update your TLE files as shown in step 5 of the Orbitron
    guide above.


    +   3. Set the refresh interval to 1 second by using the drop down menu in the
    Main Orbitron tab. By default it is set to 5 seconds.


    +   4. Select Meteor M2 as the satellite to track by loading the weather.txt TLE
    file and choosing Meteor-M2 in the satellite selection area on the right.


    +   5. (Optional if you want scheduling) Set up Orbitron to automatically track
    and notify when the satellite comes into range as shown in steps 17 - 19 in the
    Orbitron tutorial above. This will allow Orbitron to begin automatically tracking
    when the satellite appears on your horizon, above a certain elevationm and notify
    the DDE plugin scheduler in SDR#. Make sure you set the AOS notification elevation
    limit to 0.


    +   6. Now open SDR# and press Play.


    +   7. Go to the Rotor/Radio tab in Orbitron.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '8. Set the Dlink/MHz frequency to 137.1 MHz and the Dlink mode to FM-W.


    9. Choose the driver as SDRSharp and then click the run icon to make Orbitron
    connect to SDR#.


    10. Now in SDR# go to the DDE tracking Client plugin. You should see the status
    showing that Orbitron is connected.


    ![](img/33eab9643eb7fbb4bf9363c117190041_230_0.png)


    11. (Optional if you want scheduling) The DDE plugin can be made to automatically
    activate and start the LRPT decoders when the satellite comes overhead by using
    the scheduler which can be activated by checking the Scheduler box. To use the
    scheduler you first need to create a settings file that will tell the plugin what
    settings to set in SDR# and what programs to start when the satellite passes over
    head. To do this you can simply download the example settings file from the QPSK
    and DDE Tracker download page, and place it into the SDR# folder. The file can
    be downloaded from http://www.rtl-sdr.ru/page/komplekt-platinov-dlja-priema-sputnikov.,
    it is the last file called ddeschedule.zip. Note that you may still need to adjust
    the path to the LRRPTOfflineddecoder.exe. Also you will need to set the minimal
    elevation. When the satellite reaches elevation'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'threshold (higher in the sky is better because you get better reception usually,
    then the decoders will start. You''ll want to set this to an elevation at which
    you start getting a strong enough signal to actually be able to decode the image.


    The "Sat came" box is for the commands that will be run when Orbitron notifies
    the DGE plugin when the satellite is overhead. The “Sat came out” boxis for when
    Orbitron notifies the DDR plugin that the satellite pass is over. Below list the
    meaning of the commands specified for Meteor M2.


    **radio_modulation_type<wfm>** - Sets the modulation type in SDR# to WFM.


    **radio_center_frequency_Hz<137100000>** - Sets the frequency in SDR# to 137.1
    MHz.


    **radio_frequency_Hz<137100000>** - Sets the tuned frequency in SDR# to 137.1
    MHz.


    **radio_bandwidth_Hz<120000>** - Sets the WFM bandwidth to 120 kHz, wide enough
    to cover the LRPT signal.'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'send_tracking_frequency_On - Enables the tracking feature on the QPSK plugin
    which can correct for small doppler effects and improve lock.


    QPSK_demodulator_Start - Starts the QPSK demodulator.


    IF_recorder_Start - Starts the IF recorder. Note that this is optional. If you
    don''t want to record IF files, remove this, as well as the


    IF_recorder_Stop command below.


    start_program_Path<C:\AMIGOS\LRPToffLineDecoder.exe> - Starts the LRPToffLineDecoder.
    The change to this location of the modified


    LRPToffLineDecoder if you don''t place it in C:\AMIGOS. Note not to use a path
    with spaces in IT.


    QPSK_demodulator_Stop - Stops the QPSK demodulator.


    send_tracking_frequency_Off - Stops the QPSK demodulator from doing doppler tracking.


    IF_recorder_Stop - Stops the IF recording. Note that this is optional. If you
    don''t want to record IF files, remove this, as well as the


    IF_recorder_Start command above.


    # QPSK PLUGIN AND LRRPTOFFLINEDECODER SETUP


    The QPSK plugin communicates with the modified LRPToffLineDecoder via a local
    TCP connection.


    +   1. In the QPSK plugin in SDR# make sure that TCP socket is selected under
    Output. (Note if you have a slow PC, real time decoding may not work correctly.
    In this case you can still record a demodulated output file that can be put through
    LRPToffLineDecoder later for offline processing. To do this select the File option
    instead.)'
  merge: -1
  pgno: 232
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_233_0.png)


    2. If you are not using the scheduler, then wait for Meteor M2 pass. Make sure
    the Tracking checkbox is checked. When it is time for the satellite to pass overhead,
    then connect Orbitron to the DDE plugin so that it tracking the Meteor M2 frequency
