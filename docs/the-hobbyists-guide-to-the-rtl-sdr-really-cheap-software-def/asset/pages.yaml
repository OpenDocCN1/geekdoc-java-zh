  md: '# RECEIVING 10 GHZ BEACONS


    A 3 cm or 10 GHz band is used by amateur radio operators usually for simple beacons
    and communications.


    To receive beacons at such high frequencies a Ku band “low noise block downconverter”
    (LNB) is required. Fortunately these can be had for very cheap on Amazon. See
    the rtl-sdr.com products page at http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/
    for more information.


    The LNB will receive the 10 GHz signal and then convert it to a frequency that
    is receivable by the RTL-SDR. Often you will need to combine a LNB with a satellite
    dish to get good performance from distant 10 GHz signals.


    There are several amateur radio beacons at 10 GHz that can be received by doing
    this. Also, there is the communications technique known as “rain scatter” which
    allows 10 GHz signals to be received by bouncing a signal off a precipitation
    cloud.


    Additional Information:


    http://www.rtl-sdr.com/rain-scatter-10-ghz-reception-rtl-sdr/

    ://www.rtl-sdr.com/receiving-10-ghz-reflected-moon-beacon-rtl-sdr/'
  merge: -1
