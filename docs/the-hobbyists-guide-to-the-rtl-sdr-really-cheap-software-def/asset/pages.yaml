  md: '# ANTENNA GUIDE


    In this section we will discuss antennas, cables and connectors. This section
    will not go in depth into antenna theory and will only provide a brief overview
    of some of the most common types of antenna. We try to provide a good starting
    point for further antenna research.


    # ANTENNA ESD SAFETY


    Note that any antenna will pick up electrostatic charges over time. Large electrostatic
    discharges into the RTL-SDR dongle can damage it, even if it has an ESD diode
    in place. Be sure to properly ground your antennas and discharge any potential
    ESD by shorting the antenna to ground before using it.


    For extra safety we recommend not using an outdoor antenna during a thunder storm
    and to disconnect the antenna from your RTL-SDR when in use.


    # ANTENNA ADAPTER GUIDE


    The most common RTL-SDR models use the relatively uncommon micro-coax (MCX) connectors
    on the dongles. These connectors are actually quite good as they work without
    much signal loss over a wide range of frequencies. We recommend buying dongles
    with the MCX connector due to their better passband. These will work better at
    higher frequencies for things like ADS-B. However, most connectors that fit onto
    coax cables and other antennas will not be MCX so you will need an adapter.'
  merge: -1
  pgno: 521
- img_proc: true
  md: 'It is important to choose a good connector and adapter. Poor connectors will
    have a small pass band which won’t work well at VHF and higher frequencies. Using
    an adapter to convert to another good connector such as SMA/BNC/N should introduce
    negligible losses.


    Dongles using the PAL connector will have poorer performance at high frequencies.
    Insertion loss expected at the ADS-B frequency (1090 MHz) is estimated to be 1-3
    dB (1.25x - 2x loss), but it can add up to more if you use PAL on both ends of
    the cable and starting adapters. But there is always the option of desering the
    MCX or PAL connector on the dongle and replacing it with a better one like SMA.


    We also prefer the use of ‘straight’ adapters over ‘pigtail’ adapters. Pigtail
    adapters are the ones with a short length of coax between each end of the adapter.
    Pigtail adapters can be noisy and lossy if they use poor quality cable. However,
    pigtail adapters tend to be more common and are easier to use mounting the RTL-SDR
    in a box for instance. Straight adapters also add more mechanical stress to one
