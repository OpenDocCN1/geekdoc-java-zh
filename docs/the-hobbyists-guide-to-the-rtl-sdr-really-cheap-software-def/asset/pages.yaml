  md: '# RECEIVING ANALOGUE TV

    (PAL/NTSC) GUIDE


    Most countries have begun phasing out transmission of Analogue TV, instead favouring
    the switch to digital transmission standards like ATSC (USA) or DVB-T (most of
    world). In the countries that still transmit Analogue TV the RTL-SDR can be used
    to receive it.


    In SDR mode the RTL-SDR is incapable of receiving the entire PAL NTSC video bandwidth,
    which is 5 MHz for PAL systems and 4.2 MHz for NTSC. However, it is still capable
    of receiving part of the luminance (black and white) part of the PAL or NTSC signal.


    A program which decodes PAL and NTSC is TVSharp. The latest version of TVSharp
    can be downloaded from http://rtl-sdr.ru/page/tvsharp-analogovoe-tv-na-rtl-tuner/tvsharp-updated-version-1-2/
    This page is in Russian, so use Google translate or just click on the link at
    the bottom of the page to download the zip. (Mirror 1: http://sdr.amoti.ru/download/view.download/4/8)
    (Mirror 2: http://bit.ly/1hMBZmy).


    To use TVSharp simply open it and then click the start button with your RTL-SDR
    dongle plugged in. Under sample rate choose either the NTSC or PAL option depending
    on the TV broadcast standard in your country and choose the 2.0 MSPS option which
    usually works best. Then use the frequency box to tune to a known analogue TV
    station. Using a higher sample rate will increase the bandwidth sampled, improving
    picture quality, but setting it too high seems to cause reception problems. You
    may need to adjust the gain to get good reception.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'The program also has automatic frequency and position correction options built
    in which will help to prevent image scrolling and not centred images. You may
    need to wait until the dongle has warmed up and stabilized its frequency offset
    before you see a stable image.


    ![](img/33eab9643eb7fbb4bf9363c117190041_289_0.png)


    There is also an NTSC decoder for GNU Radio available which may be useful if you
    want to learn about NTSC decoding. The tutorial is written in Japanese, but Google
    Translate is good enough to get the required information out of it. It can be
    found at http://bit.ly/XUdeEIv.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# GUIDE TO LISTENING TO TRUNKED RADIO: ANALOGUE AND DIGITAL P25


    In an inefficient radio system, one talkgroup (e.g one company) might use a single
    frequency for radio communications. However, this is very inefficient as the frequency
    may not be in use for the majority of the time. It would be more efficient if
    multiple talkgroups could use the same frequency, but without disrupting other
    talkgroups while it is in.


    In a trunked radio system, a small set of voice frequencies are shared between
    a large number of talkgroups. Each radio constantly receives and transmits to
    a special computer controlled control channel run by the radio service provider.
    When the talk button on a radio is pressed, the radio quickly communicates to
    a remote computer by the service provider via the control channel and determines
    a vacant voice frequency that the talkgroup can use. This helps to make radio
    frequency allocations more efficient.


    Because a talkgroup might switch between various voice frequencies often, listening
    to a conversation can be difficult for radio scanners that cannot decode the control
    channel. The software program Unitrunker can be used to decode the control channel
    and follow a voice conversation as it hops across various frequencies. With two
    RTL-SDR dongles you can set up a trunking receiver station. What follows is a
    tutorial on how to set this up.


    # UNITRUNKER VOICE TRUNKING FOLLOWING TUTORIAL


    To set up a trunking station we will assume that you have been through the [Quickstart
    guide]() in this book and thus have a working RTL-SDR setup.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'In addition you will need:


    +   - 2x R820T RTL2832U RTL-SDR dongles. See the Buy RTL-SDR dongles page at http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/
    if you don''t already have two. You will need one dongle to receive the control
    channel and one dongle to receive the voice channel. Only the R820T appears to
    be supported at the moment.


    +   - The Unitrunker software (Download and install the latest version from http://www.unitrunker.com/download)


    +   - One antenna that splits into two connections for the two dongles, or two
    separate antennas that can receive the trunking frequencies you are interested
    in.


    Now follow these steps to set up Unitrunker with the RTL2832U.


    # SETTING UP THE SIGNAL (CONTROL CHANNEL) RECEIVER


    First determine the frequency of a trunking control channel that you are interested
    in monitoring. You can use SDR# or a SDR receiver program to search for these
    first. They will be signals that are continuously transmitting. Here are some
    examples of common trunking modes. The are commonly found in the 400 and 800 MHz
    bands, but this may be different depending on your country.


    | Protocol | Waterfall Image |

    | --- | --- |

    | P25 | ![image]() |

    | DMR/MotoTRBO | |'
