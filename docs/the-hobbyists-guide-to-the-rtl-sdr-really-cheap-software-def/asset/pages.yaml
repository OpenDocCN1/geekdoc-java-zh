- img_proc: true
  md: 'Traditionally, desktop scanner radios are situated next to the user - in the
    house, or in the ham radio shack. The antenna is then usually situated a fair
    distance away, usually on the roof of the house or up a mast. This type of setup
    can require long runs of coaxial cable to connect the radio to the antenna. This
    can be a problem as the longer coaxial cable run between the antenna and radio
    is, the more signal you will lose due to attenuation and noise.


    With the RTL-SDR, the radio hardware is the dongle itself. The dongle converts
    the analogue signal from the antenna into a digital signal which is sent to a
    PC over USB. USB cables transmit digital data and digital data do not degrade
    RF signal quality. Therefore the RTL-SDR dongle should be situated right next
    to the antenna (or as close as possible), replacing the lossy coaxial cable in
    favour of non-lossy digital USB cable instead.


    However, there is a problem with USB cables. For USB 2.0 the maximum length of
    a USB extension cable is about 5 meters (16 feet) and for USB 3.0 about 3 meters.
    This limitation is due to digital timing requirements (although poor quality cable
    may also not work due to voltage drops). The USB protocol expects a sent data
    packet to be received within a certain frame. If the cable is too long, the data
    will not be received within the expected time as the data packet takes time to
    travel through the cable.


    A 5 or 3 meter cable may not be long enough to reach between your PC and antenna.
    Fortunately, there are two solutions around this problem.


    +   1. Use an active USB repeater cable or hub.


    +   2. Use an embedded computer like the Raspberry Pi or a remote computer to
    transmit the signal wirelessly or over ethernet cable to your PC.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 1) USE AN ACTIVE USB REPEATER CABLE OR HUB


    An USB repeater cable works by using a repeater circuit every few meters on a
    USB cable. The repeater circuit will receive a USB data packet, reset the timer
    and send it further down the line once again at full speed. The maximum length
    using repeaters is recommended to be 30m for USB 2.0 and about 18m for USB 3.0.


    If you have a USB hub, you can also use it as a repeater with non-active cables.
    Just place 5 meters of USB cable from the PC to the hub and then another 5 from
    the hub to dongle.


    Active USB cables or hubs can be found cheaply on Amazon or Ebay, see our Buy
    RTL-SDR dongles page http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/.


    Note: Do not use USB to Ethernet extenders. These extenders simply convert the
    USB cable into Ethernet cable, which is capable of long cable runs at USB 1.1
    speeds. Only USB 1.1 speeds are too slow for the RTL-SDR dongle, which requires
    at least USB 2.0.


    # 2) USE A MINI EMBEDDED OR REMOTE COMPUTER TO TRANSMIT THE SIGNAL WIRELESSLY
    TO YOUR PC


    This is an interesting solution where a small embedded PC such as a Raspberry
    Pi or Beaglebone running a Linux server is placed next to the dongle and antenna.
    The embedded PC is plugged into the RTL-SDR dongle, which can then be used to
    transmit the raw IQ radio data via TCP/IP (over the internet or your network).
    Transmission can be done wirelessly over WiFi, or over wired Ethernet using a
    program developed for the RTL-SDR called rtl_tcp.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'One thing to be concerned about this solution is the bandwidth of your TCP
    network connection. Since rtl_tcp uses quite a large amount of data depending
    on the bandwidth you have chosen, you will need a fast network connection. For
    2 Msps / 2 MHz of bandwidth, the commonly used 100Mbit wired connection will usually
    suffice. For WiFi, an N rated connection is probably required. In practice you
    will probably find that you will need to drop the sample rate to around 1 Msps.
    If network speed proves to be a problem with your setup, we recommend using the
    streaming fm guide in the tutorials section to stream FM rather than raw IQ data.


    Installing RTL-SDR on an embedded computer uses the same method as installing
    it on a regular Linux PC. To install the RTL-SDR drivers on a Raspberry Pi or
    other Linux based embedded PC follow the Linux installation instructions shown
    in a previous section.


    It may also be wise to use the modified “rtl_fm_python” from https://github.com/th0ma5w/rtl_fm_python.
    This software is a modified version of rtl_fm which allows the tuned frequency
    and modulation mode in rtl_fm to be modified remotely via a simple web interface.
    This is very useful for remote embedded servers.


    Refer to the RTL TCP projects section below for information on how to set and
    use rtl_tcp effectively.


    Note for Raspberry Pi users - since the Raspberry Pi uses a USB based ethernet
    controller, its ethernet speed may not be sufficient to keep up with the data
    rate of rtl_tcp when a high sample rate is used. For best performance we recommend
    using a slightly more powerful embedded computer such as a Beaglebone Black.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# # UPGRADING THE RTL-SDR DRIVERS IN SDR#


    # ## KEENERDS DRIVERS


    SDR# comes with the standard RTL-SDR drivers written by Osmocom. While these drivers
    are good, there is now a newer branch of experimental drivers by developer Keenerds
    that are much better overall. With Keenerds drivers you can expect a slightly
    lower noise floor and less out of band interference from strong signals. There
    are also other improvements such as faster retuning times which may help when
    using the drivers with scanner plugins. While the osmocom team is working on updating
    the official drivers, a final release date of these drivers is unknown. To update
    the drivers follow these steps:


    +   1. Go to http://igg.kmkeen.com/builds/ and download the latest zip file. This
    zip file contains the latest version of Keenerds RTL-SDR drivers for Windows.

    2. Open the downloaded zip file and open the sdrsharp folder.

    3. Copy all the non .exe files into the sdrsharp folder, making sure to replace
    any duplicate files.

    4. Now in the sdrsharp folder delete the rtlsdr.dll file.

    5. Rename the librtlsdr.dll file to rtlsdr.dll.


    The new drivers are now installed and ready to be used. Take note that if you
    at any time update SDR# by running install.bat again, Keenerds drivers will be
    overwritten and you will need to perform the above steps again.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# CUSTOM GAIN CONTROL AND DECIMATION RTL-SDR DRIVERS


    Keenerds drivers and the Osmocom drivers that come by default with the RTL-SDR
    are good, but they hide some inner workings of the gain stages. In the RTL-SDR
    there are actually seperate gain stages, the LNA gain, the Mixer gain and the
    VGA gain. The gain slider used in the standard drivers is simply a function of
    these three gains. For users experienced with the RTL-SDR it would be better if
    each gain stage could be controlled manually. In some cases this can allow better
    tuning by adjusting the gains perfectly so that no overloading occurs. A modified
    driver which exposes all three gains can be download from http://www.rtl-sdr.ru/page/novaja-modifikacija-sdr-rtls-drajvera,
    note that this page is in Russian so you may need to use Google translate.


    This driver also offers a special decimation feature. Decimation is a clever method
    used to essentially increase the number of effective bits in an ADC by oversampling
    the signal. When decoding to audio, SDR# and other similar software does decimation
    automatically, but it does not apply it to the visual waterfall. These drivers
    allow you to apply decimation to the visual RF spectrum and waterfall allowing
    you to more clearly see a signal and its structure. Another benefit is that decimation
    will allow you to use a larger bandwidth, and thus get more decimation, but still
    maintain a small enough bandwidth so that tuning is made.


    # DONGLE SHIELDING AND NOISE REDUCTION


    The RTL-SDR dongles have a problem in which they are susceptible to receiving
    interfering signals that enter via some way other than the'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'antenna. The solution to this problem is to simply enclose the dongle in a
    metal box which acts as an RF shield. The USB connector on the dongle and the
    shield of the RF port should make good electrical contact with the box. Therefore,
    the metal used in the box should be as conductive as possible - copper is the
    best, but the most expensive. Some metals like aluminium may be anodized which
    can severely reduce their conductivity.


    If you are enclosing the RTL-SDR in a box together with other components such
    as an LNA or upconverter, be sure to shield the RTL-SDR separately from these
    other components. It has been shown that the RTL-SDR dongle itself emits RFI which
    can interfere and be amplified in the other devices.


    Avoid using the RTL-SDR dongle near power supplies for devices such as laptops
    and mobile phones. These power supplies typically use something called a ''switch
    mode'' power supply which is prone to introducing lots of RF noise into the vicinity.
    If you are running the dongle on a laptop, ensure you are running on the battery
    and not power supply. Desktop PCs also use switch mode power supplies so the best
    PC to use the RTL-SDR on is a laptop running on battery. Switch mode RFI will
    usually look like multiple solid lines on the waterfall or multiple fuzzy lines.


    If a powered laptop is not viable, it is a good idea to use a standard or active
    USB cable to get the dongle as far away from the PC as possible to reduce PC RF
    noise interference. See the Positioning Your RTL-SDR Dongle section for more information.


    # COMMON SOURCES OF NOISE


    +   - Power lines. A faulty power line which is arcing electricity can create
    huge amounts of white noise which can drown out yours signals.


    +   - Switch mode power supplies.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '+   - Most electrical devices, such as monitors, TVs, appliances etc.


    +   - Ethernet cables. Unshielded Ethernet cables can output huge amounts of RFI.


    +   - Car alternators.


    +   - The dongle itself. You will see spikes at integer multiple of 28.8 MHz (e.g
    28.8 MHz, 2 x 28.8, 3x28.8 and so on). These spikes come from the local oscillator
    used in the dongle.


    +   - Universal Serial Bus (USB). USB typically uses a 48 MHz clock, and you may
    see spikes at multiples of these frequencies. You may also see very large noise
    spikes at 480 MHz, 960 MHz and 1440 MHz which are multiples of the 480 MHz USB
    data transfer rate.


    +   - Ethernet over power. Devices which send ethernet over power cables can really
    introduce a lot of noise. Some internet providers also transmit broadband over
    unshielded power cables which takes out most HF and some VHF frequencies.


    # DONG USB CABLE GROUNDING IMPROVEMENT


    According to the USB spec, the RTL-SDR dongle has an electrical grounding design
    flaw (though note that this USB spec is sometimes debated). Devices uses the USB
    cable shielding is usually not meant to be connected to the RF ground on the device,
    but rather to a separate ground. However, in the RTL-SDR, the USB cable shield
    connection is connected to the RF ground. This connection can cause the USB cable
    to act as an antenna, allowing unwanted RF signals to enter through the cable
    into the ground of the dongle.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Fortunately, there is an easy fix for this design flaw. The fix is to remove
    the shield connection from either the USB cable, or the dongle itself and then
    create a secondary ground such as a bunch of foil wrapped around the dongle with
    the USB cable ground connected to the foil and not connected to the dongle ground.
    Or, if you are enclosing the RTL-SDR into a metal case, connect the USB ground
    to the metal case inside. We recommend using a non-anodized aluminium or other
    conductive metal box for shielding.


    This simple fix can make a huge difference especially if you are having front
    end overload problems with signals that are too strong, such as local broadcast
    FM stations.


    # TESTING CHANGES TO NOISE PERFORMANCE


    Without a proper method for testing it can be difficult to determine if your shielding
    efforts actually have any impact on the noise received. One easy way to test this
    is with the rtl_power software. The rtl_power software is described in more detail
    in a later section Heatmap Band Scan. To do a noise analysis, first download rtl_power
    which comes as part of the official Osmocom RTL-SDR release of which a Windows
    version can be downloaded from http://sdr.osmocom.org/trac/attachment/wiki/rtl-sdr/RelWithDebInfo.zip.
    If you are running on Linux and have installed the RTL-SDR drivers, rtl_power
    can be accessed from terminal.


    Next plug in your dongle, and connect a 75 Ohm load to the antenna input. A dummy
    load can be purchased online or from your local electronics shop for a few dollars.
    To take a noise scan over the entire 24 MHz to 1.7 GHz range of the R820T dongle
    use the following code.


    ```

    rtl_power -f 24M:1M -7G:1M -g 50 -i 15m -1 noise.csv

    ```'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'This will scan the entire spectrum once using maximum gain for 15 minutes and
    output the data to noise.csv. The scan needs to run for at least 15 minutes in
    order to correctly average the data. Longer scans will result in more accurate
    scans.


    To plot the data you can use the CSV file in Excel or equivalent software and
    create a scatter plot of the last column of data. To compare changes we recommend
    doing a scan before you make any changes and then one after you have made the
    changes in order to compare the two.


    # References:


    http://sinnet3000.blogspot.com.br/2013/03/reducing-emi-in-rtl-sdr.html


    http://imgur.com/a/pQ8dM


    # USB CABLE FERRITES


    Another simple but highly effective improvement is to add clip on USB ferrites
    to the USB extension cable. These ferrites are specifically designed to remove
    interfering signals from USB cables. Make sure you get the clip on ferrites that
    are intended for USB cables. Other wrongly sized ferrites or wrap around toroid
    ferrites may actually harm performance by filtering the actual digital USB signals
    out.


    Clip on ferrites can be bought cheaply from Amazon. See http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/
    for a link.


    # PRESELECT FILTERS


    The RTL-SDR like most cost wideband SDR radios has no preselector at the front
    end. A preselector is an electronic analogue hardware circuit which filters out
    any frequency that is not in the filters passband. There are'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'several different types of preselectors such as bandpass, lowpass, highpass
    or bandstop filters.


    +   - Bandpass Filter: Only allow signals within a certain frequency range to
    pass. For example between 1 GHz and 1.2 GHz for ADS-B.

    - Low Pass Filter: Only allow signals below a certain frequency to pass.

    - High Pass Filter: Only allow signals above a certain frequency to pass.

    - Bandstop Filter: Blocks a certain frequency range (e.g. 88-108 MHz), which is
    useful for blocking strong interfering signals pagers and the FM broadcast channel.


    Using a preselector on a wide band device like the RTL-SDR would mean that only
    a small area of the 24-1700 MHz receivable range would be usable. However, preselectors
    will drastically reduce interference in the tuned frequencies. Most analogue radios
    and high end SDRs have built in preselectors. It is difficult to have preselectors
    in wideband radios like the RTL-SDR as you would need to have multiple hardware
    preselectors for each chunk of tunable frequencies. This is because you would
    need different values for the analogue filter components depending on the frequency
    ranges you are interested in.


    But still, if you are building a system for a single purpose, like for only receiving
    ADS-B signals for instance, you will want to use a preselector to drastically
    reduce radio interference and improve your signal to noise ratio. In this YouTube
    video https://www.youtube.com/watch?v=wcr-PX662Go the experimenter went from 800
    ADS-B messages received per second to'
  merge: -1
  pgno: 125
- img_proc: true
  md: '1200 messages per second with a bandpass preselector enabled. Most good upverters
    will also use a lowpass preselector filter to filter out interfering signals above
    about 30 MHz.


    A ready made ADS-B filter which includes a preamp can be bought from http://ava.upuat.net/store/index.php?route=product/product&id=85.


    If you find that you have interfering signals from a strong signal source, such
    as pagers or the FM broadcast band you can use a band stop filter. Instead of
    just passing a specific band, a band stop filter will block or “stop” a certain
    range of frequencies. Broadcast FM band stop filters are sometimes referred to
    as “FM Traps”. A very cheap but effective band stop filter is the MCM Electronics
    FM Trap. See our Buy RTL-SDR dongles page online for links http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/


    Surface mount and some inline filters can be purchased from Minicircuits http://www.minicircuits.com/products/Filters.html.
    Most mount filters can also be purchased from minicircuits with a evaluation board
    containing female SMA connectors. Without the evaluation board you will need good
    soldering skills to connect the band pass filter to a breakout board. Unfortunately,
    filters from Minicircuits are often expensive. Low cost ADS-B preselectors can
    be bought on Ebay, just search for “B1602 SAW filters Epcos”. For UHF frequencies
    like ADS-B, homemade PCB based hairpin filters can also be easily constructed,
    see http://www.w1ghz.org/filter/Recipes_for_Printed_Hairpin_Filters.pdf.


    We note that more expensive SDRs like the Funcble Dongle Pro+ have built in preselectors
    which greatly increase the cost, but also improve performance.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# DESIGNING SIMPLE FILTERS WITH RFSIM99


    Homemade low pass, high pass and band pass filters can be constructed out of capacitors
    and self wound inductors. All you need are the capacitors, some enamelled wire
    to create the inductors and the soldering iron. These types of simple capacitor
    and inductor based filters will work well for HF and possibly low VHF frequencies,
    but will really struggle to work properly at frequencies above 300 MHz. Above
    300 MHz you will need to use components like SAW or cavity filters. To design
    capacitor and inductor based filters a tool like RFSim99 can be used, which can
    be downloaded from http://www.electroschematics.com/835/rfsim99-download/. Note
    that you will need a 32-bit OS like Windows XP to run this program. This limitation
    can be worked around using Windows Virtual XP mode or by running XP in a Virtual
    Machine.


    To design a filter simply open RFSim99 and then go to Tools->Design->Filter. Enter
    the parameters for the filter you need, then press Calculate then Simulate to
    see the graph of simulated results.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_128_0.png)


    Here are some simple tips for filter design.


    +   - **Filter Type** - Here you can choose between Butterworth and Chebyshev
    filter. Both filters use the same amount of components. The difference between
    the two is that a Chebyshev filter can have a tighter roll off at the expense
    of some ripples in the pass band. A tighter roll off means that frequencies near
    the pass band will have greater rejection.


    +   - **Topology** - Here you can choose between a Low pass, High pass or Bandpass
    filter design.


    +   - **First Branch** - Sets whether the first component is connected in series
    or in parallel.


    +   - **Tolerances** - Tolerances of the components you are using.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '+   Centre Frequency - If you are designing a bandpass filter then this is
    the centre of the frequency range that you would like to pass.


    +   Bandwidth - For a bandpass filter the amount of bandwidth you would like in
    the pass area, for low pass and high pass filters the start or end of the filter
    pass/stop band.


    +   Number of Poles - Increasing the number of poles in the filter increases the
    number of components required, but also makes the filter response a tighter roll
    off.


    +   Passband Ripple - Only used when using the Chebyshev filter type. Increasing
    this value tightens the filter roll off, but increases the rippling in the pass
    band.


    +   Z in / out - The impedance of your filter, set to 50 Ohms or 75 Ohms for most
    applications.


    The inductors can be made by winding some enamelled wire around a cylindrical
    object like a pen. To calculate the inductance for a self made air wound inductor
    you can use the inductor design tool in RFSim99. To access this tool go to Tools->Component->Inductor.
    Enter the length, diameter and number of turns, then press calculate. Adjust the
    inputs until you get the inductance specified by the filter design.


    # COAX STUB FILTER


    One easy alternative to using a hardware preselector is to use a “coax stub filter”.
    A coax stub filter is a type of notch filter. A notch filter is just a band stop
    filter with a very small “stop” area. These sub filters are excellent for ‘notching
    out’ (blocking) strong interfereing pager frequencies.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'To make a coax stub filter you will need a “T” junction coax connector. The
    coax from the antenna will enter the T junction from the bottom of the T and exit
    out of the sides. On the remaining side there will be a length of coax cable,
    called a “stub”. The length of the stub will determine the frequency of the notch.


    To calculate the stub length use this formula, where freq is the frequency you
    would like to block and VF is the velocity factor of the particular coax cable
    you are using.


    ```

    stub length = 300/freq (MHz) x VF x ¼

    ```


    The formula converts the band stop frequency into a wavelength first, then adjusts
    the length using the coaxial cable velocity factor which will slow down the speed
    of light in the cable and then finally multiplies by ¼ to get the ¼ wavelength.


    # Related Links


    www.nerdsville.blogspot.com/2012/05/rtlsdr-part-4-cutting-out-noise-using.html


    # ADDING PHANTOM POWER / BIAS TEE


    It is possible to modify the RTL-SDR so that it can provide 5V DC power out the
    coaxial line which can be used for powering devices such as LNAs and active antennas.
    To perform this modification, you will need some careful soldering skills and
    a 1uF to 4.7uF surface mount inductor to create a bias tee. A bias tee allows
    DC power to exist on the coaxial cable, but prevents it from entering the dongle
    where it could cause damage. A simple bias tee'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'involves using a capacitor to block DC entering the dongle, and an inductor
    to block RF entering the power supply.


    To perform the mod all that is required is that the BAV99 ESD protection diode
    should be removed, and then one end of the inductor should be soldered on the
    center conductor of the coax output and the other end of the inductor should be
    connected to the 5V USB pin via a wire. For a more clear description see this
    post by Fabio: http://fabiobalti.com/2014/06/22/lna/.


    An inductor should behave as a short circuit to RF frequencies. However, real
    world inductors are not perfect, and choosing the perfect inductor for a bias
    tee can be difficult, especially with a simple bias tee design involving one inductor
    like this one since there is a tradeoff to. When choosing an inductor there are
    two main parameters you should worry about, the inductance and the self resonant
    frequency (SRF). Higher inductances block RF frequencies better, but they will
    have a lower SRF. The SRF is the frequency at which an inductor blocks the best,
    but at higher frequencies it stops working as an inductor, and it’s parasitic
    capacitance takes over. An inductor will still work above its SRF, but its blocking
    ability will reduce as the frequencies increase. It also allows DC to pass.


    Generally, if you are only interested in higher frequencies such as ADS-B at 1090
    MHz, it is best to choose a smaller inductor value such as 220 nH, but with a
    high SRF around 1 GHz. However, in most cases an inductor with a value between
    1uF to 4.7uF will work just fine if it has a reasonably high SRF (100-200 MHz).
    A 1uF to 4.7uF inductor should be able to cover the entire frequency range of
    the RTL-SDR with RF losses below 1dB across the spectrum.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'If you perform this mod you will need to take care not to accidentally short
    the antenna port, or use a DC shorted antenna. Shorting the USB 5V supply could
    cause the inductor to fry, and could damage your USB port.


    # IMPROVING THE STOCK ANTENNA


    Most RTL-SDR packages come with a small single length antenna. Some manufacturers
    provide a telescopic antenna instead, which is much better than the single length
    whip. But if you didn''t get the telescopic antenna or don''t have another antenna
    and you''re stuck with the standard stock antenna, here are some quick tips that
    can drastically improve its performance. These tips are also applicable to other
    similar whip antennas.


    # GROUND PLANE


    The performance of the stock antenna that comes with many RTL-SDR units can be
    improved simply by placing it on a flat metallic surface that has a radius similar
    to or larger than the length of the whip, which for the standard antenna provided
    with most dongles is 11.5 cm. Even if you can only find a metal disc with a smaller
    radius, it will help in most cases to improve reception. The metallic surface
    could be anything - most easily it could be something like the lid from a coffee
    tin, or the tin cover of a metal cookie or chocolate box.


    Placing it on a metallic surface completes the antenna as a quarter ground plane.
    This shifts the optimum SWR point to a lower frequency and usually reduces it
    to. See the SWR section in the Antenna chapter for more information about SWR.
    Below we show a waterfall image at broadcast FM frequencies comparing the antenna
    without (top) and with (bottom) a metallic ground plane with radius 12 cm. The
    noise floor is drastically reduced with the ground plane.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Below we show some NEC2 SWR simulations of the stock whip. We can see that
    for the stock whip with no ground plane (other than the 1 cm radius magnetic base
    ground plane that is part of the antenna) the antenna is resonant at about 935
    MHz and the SWR is very high for lower frequencies. When used with a 6 cm ground
    plane the SWR is reduced and the resonant frequency has been reduced to 695 MHz.
    With a ground plane with 11.5cm radius the resonant frequency is reduced to 645
    MHz, but it is a case of diminishing returns.


    Thus to conclude, to improve the performance of the stock antenna frequencies
    below 935 MHz, place the antenna on a flat metallic surface to create a ground
    plane.


    ![](img/33eab9643eb7fbb4bf9363c117190041_133_0.png)


    SWR of the stock whip with no added ground plane.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_134_0.png)


    SWR of the stock whip with a 6cm radius ground plane.


    ![](img/33eab9643eb7fbb4bf9363c117190041_134_1.png)


    SWR of the stock whip with a 11.5cm radius ground plane.


    # ADS-B


    To improve the stock antennas performance at 1090 MHz for ADS-B, cut the whip
    length down to around 6.9 cm and then use a ground plane with a 6.9 cm radius.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# COAX CHOKE


    Another improvement that can drastically improve performance is to create a common
    mode coax choke, which in ham circles is also known as the so "ugly balun". A
    choke will essentially stop unwanted currents in the coax shield. This helps to
    remove the effect of the coax cabling becoming a part of the antenna and undesirably
    skewing the radiation pattern. See the [Antenna Chapter]() for more information
    about radiation patterns.


    To create a coax choke all you need to do is find a cylindrical object about 2
    - 3 cm in diameter, like a marker pen and create about 5 - 10 turns of cabling
    around it. If you have a ferrite core such as a clip on ferrite use this as the
    winding centre for even better performance. With a ferrite core you can use less
    turns for the same performance as more turns without the ferrite. Make the winding
    as close to the antenna base as possible. Below we show an image of an example
    winding with a USB ferrite.


    ![](img/33eab9643eb7fbb4bf9363c117190041_135_0.png)


    Below we show the effect a common mode choke can have on reception. The lower
    half of the image is with the choke in place using a clip on ferrite with four
    windings. The upper half shows reception with no choke in place. As can be seen,
    the noise floor is significantly reduced.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# REPLACE STOCK ANTENNA COAX CABLE


    Many RTL-SDR users say that the coax cable on the stock antenna is bad, but in
    actuality it is not that terrible for VHF frequencies because it is only 1m long.
    The coax used in most units is a type of low quality RG174 with a very thin braid.
    We measured the insertion loss over a 1m stock antenna cable and found that from
    0-600 MHz the loss was around 0.5dB - 2dB and from 700 to 900 around 3 dB. At
    1 GHz and higher the loss rises significantly and becomes around 6dB - 8dB. Below
    we show a close up of the stock antenna coax cable with the outer sheathing removed.
    Note that there are some stock antennas come with a much worse cable which is
    just a twisted pair of thin wires, these usually have a PAL connector instead
    of an MCX one and have significantly higher losses at higher frequencies.


    ![](img/33eab9643eb7fbb4bf9363c117190041_136_0.png)


    It is possible to replace the stock coax with a better cable. Simply peel off
    the sticker at the bottom of the antenna and use a flat head screw driver to pry
    open the metallic disc a the bottom. This will expose the cable which can then
    be unsoldered.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# # CALIBRATING THE FREQUENCY OFFSET OF THE RTL-SDR


    The easiest way to calibrate the RTL-SDR is by tuning to a known frequency and
    then adjusting the PPM offset until the signal is centred. Make sure to do this
    after the dongle has been running for a while as the dongles are to have a “warm
    up” time, where the PPM offset will change as the temperature slowly increases.
    In SDR# the PPM offset setting can be adjusted from the “Configure” menu.


    # ## KALIBRATE


    It is also possible to calibrate the RTL-SDR automatically using a command line
    program called Kalibrate. However, note that Kalibrate is sometimes known to give
    inaccurate results and instead we strongly recommend manually determining the
    PPM offset with a known signal. Kalibrate requires that there are local GSM signals
    receivable by your antenna to do the calibration. GSM signals are used because
    they transmit frequency correction data which Kalibrate can use to determine the
    clock offset. Kalibrate can be downloaded from https://github.com/steve-m/kalibrate-rtl.
    A pre-built Windows version can be found at http://rtlsdr.org/files/kalibrate-win-release.zip
    - that you may need to copy in the newer rtlsdr.dll and libusb-1.0.dll files from
    the official RTL-SDR release from the osmoscom to get it to work. To compile and
    install kalibrate on Linux use the following instructions.


    +   1. Install the prerequisites

    sudo apt-get install libtool autoconf libffftw3-dev


    +   2. Download the kalibrate-rtl repository from the GitHub https://github.com/steve-m/kalibrate-rtl
    either by using git clone or'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'by downloading and extracting the zip file from the page.


    ```

    git clone https://github.com/steve-m/kalibrate-rtl

    ```


    +   3. In a terminal navigate to the kalibrate folder. Type the following compilation
    instructions into the terminal.


    ```

    /bootstrap & CXXFLAGS=''-W -Wall -O3''

    /configure

    make

    sudo make install

    ```


    +   4. Now kalibrate is ready to use by using the command shown below.

    Replace GSM900 by GSM850, GSM-R, GSM900, EGSM, DCS or PCS depending on GSM systems
    and frequencies are in use in your country. Kalibrate will run for a while searching
    for GSM stations. Also, set the gain parameter -g to whatever setting works for
    you.


    ```

    kal -v s GSM900 -g 50

    ```


    +   5. Once kalibrate has found some GSM channels, choose a channel number with
    strong power from the output displayed in the terminal and then run the following
    command to determine the RTL-SDR frequency offset in PPM.


    ```

    kal -c channel

    ```


    If kalibrate has trouble finding GSM stations or you find that the PPM offset
    is giving strange values, you may need to specify to kalibrate an initial PPM
    offset guess to help it out. You can do this using the -e flag. A good starting
    guess might be in the region of 30 to 50 ppm.'
