- img_proc: true
  md: 'In the next sections we show tutorials on how to use the four ACARS decoders
    mentioned above. We highly recommend using Acarsdeco2 however.


    # ACARCSDECO2


    Acarsdeco2 is a Windows, Linux, Raspberry Pi and OSX compatible command line based
    multi channel ACARS decoder that directly interfaces with the RTL-SDR. This means
    that no audio piping is required, and no programs like SDR# are required. In this
    tutorial we will show how to use the Windows version, but use of Linux, OSX and
    Raspberry Pi versions should be very similar. We believe that Acarsdeco2 is probably
    the best decoder for ACARS available as it has good decoding performance, is capable
    of decoding up to 3 ACARS channels simultaneously and much easier to use with
    multiple ACARS streams than using multiple VFOs in a program like SDR-Radio of
    the SDR# multiple VFO plugin. Also, while Acarsdeco2 is a command line program
    it has a web interface that can be used to browse the received ACARS messages.


    +   1. First, using SDR# or another program discover your dongles frequency offset
    and best gain settings appropriate for receiving ACARS signals. Adjust the gain
    settings until ACARS signals are received strongly without any interference. Record
    the dongles PPM offset and optimal gain, then close SDR#. If you help determining
    the PPM offset see the Setting PPM Offset section of this book. Determining the
    optimal gains and an accurate PPM offset are critical for the operation of Acarsdeco2.


    +   2. Next, download the latest Windows version of Acarsdeco2 http://forum.planefinder.net/threads/acarsdeco2-up-to-3-channels-'
  merge: -1
