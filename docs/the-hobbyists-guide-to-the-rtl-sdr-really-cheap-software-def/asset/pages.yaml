    # ACARDS


    Another program for decoding ACARS signals is Acarsd. Acarsd has the advantage
    of being completely free and also being available for Linux. Acarsd can be downloaded
    from www.acarsd.com. We find that the performance of Acarsd is not as good as
    the two paid options, but some other users have reported that Acarsd can work
    just well as not better than the paid options. Acarsd works best when the audio
    sample rate of the audio piping device is set to 44.1 kHz. See the setting sample
    rate section for information on how to change this. To use acarsd follow these
    instructions.


    +   1. Go to the acarsd website and download and install acarsd. Make sure to
    follow the instructions on the website for installing as it is an unconventional
    install procedure.


    +   2. Ensure your default audio device is set correctly in Windows sound recording
    properties. Acarsd will use the first default audio device found. Also ensure
    the Playback and Recording sample rates are set to the same value of 44100 Hz.


    +   3. In the acarsd folder run setup.exe.


    +   4. Under Configuration / Installation enable the 44 kHz option.'
