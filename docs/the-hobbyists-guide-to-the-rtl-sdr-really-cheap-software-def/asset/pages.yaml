- img_proc: true
  md: '# Broadband: No


    Uses: Often used on portable radios.


    The simplest whip antenna is just a vertical antenna like a quarter wave ground
    plane without a proper ground plane. It is then essentially a vertical wire. Removing
    the ground plane of a quarter ground plane antenna will move the SWR minimum up
    to a higher frequency and cause the lowest SWR point to not be as low as with
    a proper ground plane. To compensate and move the minimum SWR point back down
    to a lower frequency the whip should be made longer than a quarter wave.


    Whip antennas (such as the one shipped with the standard RTL-SDR) are usually
    designed with a magnetic base so they can be placed on metallic objects such as
    a car roof to act as a ground plane. Often placing the magnetic mount on a metallic
    ground plane can make the difference between receiving and not receiving a signal.
    On hand held radios that have a whip, the radio chassis and your body touching
    the chassis acts as the ground plane. The most versatile whip antenna is a telescopic
    whip, because it''s length can be adjusted to optimise the SWR for the particular
    frequency you want to listen to. The larger the ground plane, the lower the SWR,
    and the more that the whip begins to approximate a 1/4 wave plane antenna, or
    dipole.


    Below we compare the SWR of a quarter wave ground plane antenna vs one that has
    had its ground plane removed (a whip). In the whip the SWR at the design frequency
    of 145 MHz has significantly increased. Then even just by adding a small ground
    plane with a 1 cm radius as shown in the third graph, the SWR can be significantly
    reduced. Adding increasingly larger ground planes further reduces the SWR.


    A trick used in many whip antenna designs is the inclusion of an inductive loading
    coil. This is the coil that is seen on the base or middle of some'
  merge: -1
  pgno: 543
- img_proc: true
  md: 'antennas. The loading coil is used “electrically lengthen” the antenna in order
    to reduce the SWR at the desired design frequency. By using loading coils, antennas
    that have good SWR and are much smaller than a quarter wavelength can be created.
    As shown in the SWR plot below, the inclusion of a loading coil of the correct
    value significantly reduces the SWR at the design frequency.


    ![](img/33eab9643eb7fbb4bf9363c117190041_544_0.png)


    **Left:** SWR for quarter wave ground plane. Right: SWR for a whip with no ground
    plane.


    ![](img/33eab9643eb7fbb4bf9363c117190041_544_1.png)


    **Left:** Whip with ground plane of 1cm. Right: Whip with ground plane of 1cm
    and 2.23 uH loading coil at the base.'
  merge: -1
  pgno: 544
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_545_0.png)


    **Left:** Image of a typical dipole, Right: 3D Radiation Pattern at 144 MHz and
    5m high


    **Name:** Dipole


    **Polarization:** Vertical/Horizontal (Depends on orientation)


    **Broadband:** No


    **Uses:** Used in bunny ear antennas for TVs, also good as a general antenna.
    Easiest to use in the horizontal orientation for horizontally polarized signals.


    A dipole is essentially two wire elements pointing away from each other. The elements
    are not connected at the centre. One element connects to the centre of the coax
    and the other connects to the shield. It is a half wave length long, with each
    element being a quarter wavelength


    The dipole can be made horizontally or vertically polarized by placing it in the
    horizontal and vertical orientations respectively. The radiation pattern is greatest
    in the direction perpendicular to the elements. A commonly found VHF dipole in
    everyday life is the bunny ears antennas which are common'
  merge: -1
  pgno: 545
- img_proc: true
  md: 'on some older TVs. As TV transmissions are broadcast with horizontal polarization,
    bunny ears are arranged horizontally, but they can just as easily be oriented
    vertically for receiving other signals.


    More information about dipoles can be found at http://www.radio-electronics.com/info/antennas/dipole/dipole.php.
    Here is a length calculator http://www.angelfire.com/mb/amandx/dipole.html. Information
    on a very simple ADS-B dipole can be found at http://antirez.com/news/46.


    We don''t show the dipole radiation patterns here because compared to the quarter
    wave ground plane the dipole has a very similar, almost identical radiation pattern
    and SWR. A dipole is essentially equivalent to a quarter wave ground plane with
    a perfect ground plane. However, the disadvantage to a dipole is that it needs
    to be larger and it is more difficult to mount the feedline if using vertically
    polarized. The feedline should run perpendicularly away from the dipole to avoid
    altering the radiation pattern.


