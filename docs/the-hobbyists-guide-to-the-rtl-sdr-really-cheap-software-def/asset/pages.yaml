    # LINUX ONLY ACARS DECODERS


    There are various open source based ACARS decoders for Linux. The two best are
    rtl_ng and acars. Both have a significant advantage over the Windows Based ACARS
    solutions as programs will connect directly to the RTL-SDR and do not require
    any audio filtering, which both also to listen to and simultaneously'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'decode more than one ACARS channel. Acarsdec is the more feature rich software,
    but both programs should have similar performance as they are based on the same
    code base.


    These programs are great for running on an embedded device such as a Raspberry
    Pi.


    # ACARSDEC


    To run acarsdec, download and extract tar package from http://sourceforge.net/projects/acarsdec/
    or use the following at the Linux terminal.


    ```

    wget http://sourceforge.net/projects/acarsdec/files/latest/download?files=-O acarsdec.tar.gz

    tar -zxvf acarsdec.tar.gz

    ```


    Install the following dependencies as well as the librtlsdr libraries if you haven''t
    already and compile the program using making. See the installing RTL-SDR Drivers
    on Linux section for more information.


    ```

    sudo apt-get install libsndfile-dev

    sudo apt-get install libasound2

    sudo apt-get install sqlite3 libsqlite3-dev

    cd acarsdec-3.0

    make

    ```


    Run the program on an RTL-SDR dangle monitoring two frequencies use the following
    command, where -p specifies the PPM offset for your dongle, r specifies the RTL-SDR
    device number if you have more than one RTL-SDR connected and the values after
    ACARS frequencies you wish to monitor. Note that since ACARS signals are narrowband,
    it is very important to get the PPM offset set correctly. See ./acarsdec -h for
    a full list of options.


    ```

    /acarsdec -p 24 -r 0 131.550 131.450

    ```'
  merge: -1
