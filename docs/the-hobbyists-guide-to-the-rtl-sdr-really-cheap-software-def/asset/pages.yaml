    # ACTIVE GPS ANTENNAS AND BIAS-T’S


    Most GPS antennas are ‘active’ and require 5 volts of DC power to be sent down
    the coax cable. Unfortunately, we cannot directly connect a DC power source to
    the RTL-SDR antenna input as this would fry.


    To connect an active GPS antenna to the RTL-SDR you will need a simple electronic
    circuit called a bias-t. The bias-t sits between the dongle and active GPS antenna,
    allowing DC power to travel down the coax to the antenna whilst blocking the DC
    power from entering the dongle. A simple bias-t consists of a capacitor and an
    inductor. They can be bought relatively cheaply on Ebay, or easily constructed.
    A sample circuit diagram is shown below.'
  merge: -1
  pgno: 503
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_504_0.png)


    Attribution: Bias T by Matthias Buchmeier / CC 3.0


    The capacitor value must have a small enough impedance (<<50 ohm) to allow 1.5
    GHz to easily pass through and the inductor must have a high impedance (>>50ohm)
    to prevent the received GPS signal from shunting to ground the battery.


    To calculate bias-t values use the impedance formulas for capacitors and inductors.
    A good calculator can be found here http://www.qsl.net/pa2ohh/jslcimp.htm.


    Impedance of a capacitor is calculated with the following equation.


    X_c = 1 / (2 * pi * f * c)


    And the impedance of an inductor can be calculated with the following equation.


    X_l = 2 * pi * f * L


    Where f is the frequency we are interested in (in this case ~1500 MHz), C is the
    capacitance value and L is the inductance value.


    We need large capacitor and large inductor values. For example a 100 pF capacitor
    at 1.5 GHz (1500 MHz) has an impedance of about 1 Ohm, so it should be okay. Avoid
    capacitors that are too large as they can have parasitic impedance.'
  merge: -1
  pgno: 504
- img_proc: true
  md: An inductor with a value of 0.1 uH has an impedance of about 940 Ohms at 1.5
    GHz and should be okay. A homemade inductor can be wound enamelled copper wire
    and a cylindrical object or a ferrite bar. To calculate windings for a home made
    air core inductor use this calculator http://www.66pacific.com/calculators/coil_calc.aspx.
    Using a ferrite core can increase inductance further.
