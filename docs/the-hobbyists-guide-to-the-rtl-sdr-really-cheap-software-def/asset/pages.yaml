    # REMOVING THE FISHEYE EFFECT OF THE COLOR IMAGE


    Because the images are generated with a fisheye lens, the satellite image may
    look distorted. It is possible to stretch the image to make it look more normal
    using the Smooth software for Windows available at http://myweb.tiscali.co.uk/wxsatellite/meteor3m.htm.
    You can also use David Taylors free Windows LRPT Image Processor program which
    will remove the fisheye effect as well as do color correction, his program is
    available at http://www.satsignal.eu/software/LRPT-processor.html.


