    +   3. Now open a command prompt by going to the start menu and typing in "cmd"
    under search and then opening cmd.exe.


    +   4. Browse to the folder where you have unzipped the Acarsdeco2 files in command
    prompt. For example, if you stored the files in F:acarsdeco2, you would type


    ```

    F:\cd acarsdeco2

