  md: '# RECEIVING AND TRACKING GPS

    WITH THE RTL-SDR


    The RTL-SDR can be used to receive and track Global Positioning System

    (GPS) constellations in real time completely in software. To do this the

    RTL-SDR must be connected to a GPS antenna tuned at 1.57542 GHz.

    Most GPS antennas require power so you will need a bias-t to connect them

    to the RTL-SDR. Note that it is not possible to determine if the GPS signal

    is being receiving simply by looking at a waterfall. The reason is because

    GPS signals are spread spectrum and the signal strength is below the noise

    floor. Proper signal processing software is required to detect GPS signal

    such as the GNSS-SDR Linux software.


    Note: We and several other testers of this software have never been able to

