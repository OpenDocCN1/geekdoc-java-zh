  md: '# DVB-T HDTV ON LINUX


    The RTL-SDR can still be used for its original purpose: DVB-T HD TV. Note that
    DVB-T TV does not exist in the USA.


    # DRIVERS


    On Linux there are free open source drivers and software programs which can allow
    you to watch DVB-T TV. The easiest way to get it to work is to use a newer version
    of the Linux Kernel (3.6+), such as the one used by Ubuntu 13.10 or newer. On
    older versions you will need to install or update Video 4 Linux, or update your
    kernel.


    Also, if you''ve already installed the SDR drivers on Linux you''ve probably blacklisted
    the DVB-T drivers from loading at some point. You will need to unblack them to
    allow for TV watching or run modprobe dvb_usb_rtl28xxu to reload the drivers.


    # UPDATING VIDEO4LINUX


    Note: Only do this if you are running an old version of Linux. Video4Linux can
    be updated by using the following commands in terminal. Note that this update
    may not work on all Linux versions and kernels.


    ```

    sudo apt-get install linux-headers-$(uname -r) build-essential patchutils libproc-prostable-perl

    git clone http://linuxtv.org/media/media-build

    cd media_build

    /build

    sudo make install

    ```


    More info here https://help.ubuntu.com/community/DVB-T_(USB)


    # UPDATING THE KERNEL


    Note: Only do this if you are running an old version of Linux. An alternative
    to updating the Video4Linux drivers is to update the kernel on'
  merge: -1
  pgno: 513
- img_proc: true
  md: 'your Linux distribution to a newer version which includes the DVB-drivers.
    This can be done by first running the following.


    ```

    sudo apt-get update

    apt-cache search linux-image

    ```


    Look at the output to find a newer kernel version for your system. Once you''ve
    found a newer kernel type the following where linux-image-newer_version should
    be replaced with the newer linux kernel.


    ```

    sudo apt-get install linux-image-newer_version

    ```


    For example according to the terminal output in this image you could type the
    following to update to kernel 3.11 and automatically get the DVB-T drivers.


    ```

    sudo apt-get install linux-image-3.11.0-19-generic

    ```


    # DVB-T TV WATCHING SOFTWARE


    A program called Me-TV can be used to watch DVB-T TV and can be downloaded and
    installed with the following commands.


    ```

    sudo apt-get update

    sudo apt-get install me-tv

    ```


    Once installed Me TV can be found in Ubuntu’s start menu under Sound & Video.'
  merge: -1
  pgno: 514
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_515_0.png)


    Other more full featured software like MythTv can also be used.'
