- img_proc: true
  md: '6.


    # # COMPILING THE LATEST DSD

    # VERSION ON WINDOWS


    Digital Speech Decoder (Dsd) is open source software which is under active development.
    As a result to be able to use the latest version of the software you will need
    to be able to compile yourself. On Linux compilation is fairly easy with the instructions
    from https://github.com/szechys/dsd/wiki/Installation which can be pretty much
    copy and pasted into a terminal window. Compilation on Windows is a little more
    involved so we provide a tutorial. The easiest way to compile DSD is with the
    Cygwin environment.


    Note that if you are not interested in compiling the latest DSD versions, a precompiled
    version of DSD 1.7.0 can be downloaded from http://bit.ly/1nPU8E7E (Mirror 1:
    https://dl.dropboxusercontent.com/u/43061070/dsd-1.7.rar) (Mirror 2: http://bit.ly/RF0yLw),
    these will please be older versions. Remember that for most digital audio we recommend
    DSD+ which can be found at http://www.rtl-sdr.com/improved-digital-voice-p25-decoding-dsd/.
    However, DSD 1.7 is the only software that will currently work for decoding D-STAR.


    +   1. Download an install the Cygwin environment from https://www.cygwin.com/.
    Make sure to download the 32-bit version and not the 64-bit one. Cygwin is an
    environment that allows compilation of Linux software on a Windows platform.'
  merge: -1
  pgno: 380
- img_proc: true
  md: '+   2. During the installation you will be asked if you would like to install
    some packages. You will need to install the following packages: gcc-core, gcc-g++,
    libgcc1, libsndfile, libsndfile-devel, libsndfile1, cmake, make, fftw3, libfftw3-devel,
    libfftw3_3, libapack-devel, libapack0, git and wget. To install simply type their
    names in the search bar and expand the menus until you find the right name. Then
    click on the text Skip to change it to the current version number.


    Also remember the installation location of Cygwin. By default it should be C:/cygwin.


    +   3. Open the Cygwin terminal from the start menu. Now we will download and
    compile the required pre-requisites.(Note that if you have multiple compilers
    on your system when running the cmake command you should set cmake to use the
    "Unix Makefiles" generator with cmake -G "Unix Makefiles" ..


    +   4. Download mbelib (the P25 decoder library) with the following:


    ```

    git clone https://github.com/szechyjs/mbelib.git

    cd mbelib

    mkdir build

    cd build

    cmake ..

    make

    make install

    ```


    +   5. Next install ITPP.


    ```

    cd ~

    wget -O itpp-latest.tar.bz http://sourceforge.net/projects/itpp/files/latest/download?source=files

    tjar xf itpp-latest.tar.bz

    cd itpp-4.3.1 (or whatever the latest version is)

    mkdir build

    cd build

    cmake ..

    make

    make install

    ```'
  merge: -1
  pgno: 381
- img_proc: true
  md: '6. Finally compile DSD.


    ```

    cd ~

    git clone https://github.com/szechyjs/dsd.git

    cd dsd

    mkdir build

    cd build

    cmake ..

    make

    ```


    7. Now in Windows browse to the \cygwin installation directory (default directory
    is C:\cygwin) and then browse to C:\cygwin\home\NAME\dsd\build, where NAME will
    be your user name on your Windows PC.


    8. In the build folder you should be able to find dsd.exe. Copy dsd.exe into another
    folder on your computer. Now, if you were to go into command prompt and try to
    run dsd.exe you would receive an error. This is because we need to move some .dll
    files into the same folder as dsd.exe first.


    9. Browse to C:\cygwin\bin and copy cygwin1.dll, cygsndfile-1.dll, cyggcc-s-1.dll,
    cygstdc++-6.dll, cygFLAC-8.dll, cygogg-0.dll, cygvorbis-0.dll, cygvorbisenc-2.dll,
    cygfftw3-3.dll, cyggomp-1.dll, cygffortran-3.dll and finally cygquadmath-0.dll
    into the same folder as dsd.exe.


    10. From C:\cygwin\home\NAME\ittpp-4.3.1\ittpp copy cygitpp-8.dll into the same
    folder as dsd.exe.


    11. From C:\cygwin\home\NAME\mbelib\build copy cygmbe-1.dll into the same folder
    as dsd.exe.


    12. From C:\cygwin\lib\lapack copy cybglas-0.dll into the same folder as dsd.exe.'
