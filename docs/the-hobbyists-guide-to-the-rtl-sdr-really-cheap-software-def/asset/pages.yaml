  md: '# EXPLANATION OF WBFM FLOW GRAPH


    The first thing that happens in the flow graph is that the signal from the RTL-SDR
    is decimated by four times. Decimation is a way to get higher resolution data
    (higher effective number of quantization bits) out of an ADC. Essentially, by
    decimating by four, we reduce our 2 Msps sample rate to 0.5 Msps, but gain about
    one extra bit on our ADC. We need to be careful of the amount we decimate by,
    as decimating by a wrong value could cause neighbouring signals to overlap onto
    the signal of interest. For a tutorial on decimation see http://www.atmel.com/images/doc8003.pdf.


    After decimation we use a low pass filter to select only the WBFM signal that
    we are interested in, which is at the centre frequency. This is needed nearby
    WBFM frequencies are received in the same bandwidth, but we want to listen to
    only one. The bandwidth of a typical WBFM radio station is about 200 kHz. After
    decimating by four, the bandwidth of our WBFM signal is multiplied by four to
    800 kHz. The lowpass filter cutoff frequency is measured for only one side of
    the bandwidth, so here we set it to 400 kHz. The lowpass filter transition width
    defines how ‘sharp’ our filter is. The smaller the transition width, the more
    square the low pass filter becomes. However, the smaller transition width, the
    greater the number of calculations required and thus the greater CPU time required.
    With a transition width of 100e3 GNU Radio uses approximately 33% CPU, a transition
    width of 10e3 uses 45% CPU and a transition width of 1e6 tries to use over 100%
    of the CPU.


    Next comes the WBFM Receiver block which handles the WBFM to audio decoding. We
    set the Quadrature Rate at 500e6 because 0.5 Msps is our sample rate after decimation.
    We also set the audio decimation as 10, as this will bring the 0.5 Msps decimated
    signal down to a 50 kHz audio signal. This can then easily be converted to the
    48 kHz sample rate that we'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'soundcard needs. Decimation could also be done in the next rational resampler
    block, but the resampling performed in the WBFM block is of higher quality.


    As the soundcard needs 48 kHz audio we need to convert our 50 kHz audio signal
    down to 48 kHz. We do this by first taking the signal down to 1000 Hz by decimating
    by 50. Then by interpolating by 48 we get a final sample rate of 48 x 1000 = 48
    kHz. This is exactly the amount our sound card needs.


    To learn more we recommend connecting FFT sinks to the output of the first rational
    resampler and to the output of the low pass filter to see how they affect the
    signal as shown in the graphs below. The top graph is the low pass filtered signal,
    the middle graph is the decimated signal and the bottom graph is the raw signal.'
  merge: -1
