- img_proc: true
  md: '# # STREAMING MP3 FM WITH LINUX:

    # RTL_FM


    If you just want to stream a FM audio station over the network, you can use rtl_fm
    and pipe the output into sox to convert it into a mp3 file and then use socat
    to output it to the network. On the receiving end, netcat can be used to connect
    to the TCP/IP stream.


    The bandwidth required for this is far less than with rtl_tcp as it only needs
    about 8kb/s at which almost any network including the internet and WiFi can easily
    handle.


    On Ubuntu sox, socat and netcat can be installed with the following.


    ```

    sudo apt-get install sox

    sudo apt-get install socat

    sudo apt-get install netcat

    ```


    The commands to encode to mp3 and to play the received audio come from sox, so
    you will need to install sox on both the server and listener computers. You may
    also need to install the sox mp3 libraries on the listener side with sudo apt-get
    install libsox-fmt-mp3 if you hear no sound output.


    You can test if sox is working on a signal with a command that will play the mp3
    compressed audio from the RTL-SDR to your speakers. If you hear the audio with
    this command then the mp3 compression is working.


    ```

    rtl_fm -M fm -f 161.649M -s 12k -g 50 -l 70 | socat -raw r12k -es -b16 -c1 -V1
    -tmp3 | play -t mp3 -

    ```


    To send the audio over TCP/IP use the following socket command.


    ```

    rtl_fm -M fm -f 161.649M -s 12k -g 50 -l 70 | socat -raw r12k -es -b16 -c1 -V1
    -tmp3 | socat -u - tcp-listen:8080

    ```'
  merge: -1
  pgno: 441
- img_proc: true
  md: 'On the listener side use the following command.


    ```

    netcat IP_ADDRESS 8080 | play -t mp3 -

    ```


    Where you should change the IP_ADDRESS to the ip address of the server.

    You should also change the frequencies, bandwidths and other appropriate rtl_fm
    flags to those required by the signal you are listening to.'
  merge: -1
