- img_proc: true
  md: '# MEASURING THE CHARACTERISTICS OF RF FILTERS WITH AN RTL-SDR AND NOISE SOURCE


    Every RF filter has a certain response or characteristic that shows what frequencies
    it blocks and what frequencies it passes. By using an RTL-SDR dongle together
    with a cost noise source it is possible to measure the response of an RF filter.


    These tutorials are based heavily on information learned from Adam Alicajic’s
    (9A4QV) YouTube videos which can be found at https://www.youtube.com/watch?v=X_gd2gWYiGi4,
    https://www.youtube.com/watch?v=UvdaUR01Ts, https://www.youtube.com/watch?v=SAAF2FvV9g4
    and https://www.youtube.com/watch?v=WTdldF7wpLg.


    # CHARACTERIZING FILTERS


    Using just a noise source and RTL-SDR dongle it is possible to determine the properties
    of an RF filter. Aband noise source outputs RF noise over a wide range of frequencies,
    and can be thought of as transmitting noise on every frequency at once. Measuring
    the response of a filter can be very useful for those designing their own, or
    for those who just want to check the performance and characteristics of a filter
    they have purchased.


    In our experiments we used the following equipment that we bought mostly from
    ebay:'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# EQUIPMENT


    +   - BG7TBL Noise Source ($29.50 USD). Available on ebay and Aliexpress, just
    search for “DC12V 0.2A Noise Source for External Tracking Source"


    +   - 12V Power Supply that can supply at least 0.2A for powering the noise source
    (~$5 USD)


    +   - RTL-SDR Dongle (~$10–$25 USD)


    +   - T-Junction SMA 3-Way Coax Splitter for testing coax stub filters ($2 USD)


    The BG7TBL noise source is a wideband noise source that can provide strong noise
    over the entire frequency range of the RTL-SDR. It requires power from a 12V source
    which can be obtained from a common plug in power supply. It also uses an SMA
    female connector, so you may need some adapters to connect it to your filter under
    test (adapters can be found cheaply on ebay). Finally a quick warning: be careful
    when handling the circuit board after it has been powered for some time as some
    of the components can get very hot. Note that if the ebay store runs out of these
    noise sources then there is also a seller on Aliexpress with some available, just
    type “noise source” in the Aliexpress search bar. An image showing the 12V version
    of the BG7TBL noise source is shown below. There is also a 24V version available,
    but we prefer the 12V version because 12V power supplies are more common.'
  merge: -1
  pgno: 482
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_483_0.png)


    If you have a ham-it-up converter and are good at soldering small surface mount
    components you might instead consider purchasing the noise source kit add that
    is sold by Nooolec. This provides the same function as the BG7TBL noise source.
    This is a video showing how to build and test the ham-it-up noise source https://www.youtube.com/watch?v=HY1ijZjbLfb8.


    # SOFTWARE


    The software we use is as follows:


    +   - rtl_power (keeneers build) - Available at http://igg.kmkeen.com/builds/.

    - RTL-SDR Panorama (or any other rtl_power GUI or RTL-SDR spectrum analyzer) –
    (Optional) - Available at http://sourceforge.net/projects/guiforrtlpower/


    We will use rtl_power with the RTL-SDR Panorama GUI to record and graph a frequency
    sweep over the effective range of the filter. If you are experienced with command
    line use of rtl_power you may also use it without the GUI.'
  merge: -1
  pgno: 483
- img_proc: true
  md: 'To set up RTL-SDR Panorama place the rtlpan.exe file into the same folder as
    rtl_power, which can be obtained from the official RTL-SDR release, or from one
    of eerder builds (GitHub for Linux). We recommend using keerner builds as his
    modified drivers seem to retune much faster making scans of large bandwidths significantly
    faster.


    # CHARACTERIZING FILTERS TUTORIAL


    To characterize a filter simply connect the noise source to the input of the filter
    and the RTL-SDR to the output of the filter. Then with the RTL-SDR connected,
    open RTL-SDR Panorama and set the frequency range to the expected range of the
    filter and set the resolution to 1M. Also set the gain to 0 and enable Auto dB.
    Next click start and after a few seconds a graph of your filter response should
    be generated. The image below shows how the noise source and filters should be
    connected.


    ![](img/33eab9643eb7fbb4bf9363c117190041_484_0.png)


    The image below shows the response of a cheap FM bandstop filter, such as the
    one available from MCM electronics. A band stop filter is designed to attenuate
    (reduce) the signal strength of overly strong FM broad cast stations. The graph
    is plotted between 50 MHz and 150 MHz. The response'
  merge: -1
  pgno: 484
- img_proc: true
  md: 'shows how the signal strength dips in the band stop region of 88 - 108 MHz,
    which is expected. A more expensive bandstop filter would have a more rectangular
    response shape, however for simply attenuating broadcast FM signals a rough shape
    like this is fine.


    ![](img/33eab9643eb7fbb4bf9363c117190041_485_0.png)


    The image below shows the response of a 1090 MHz bandpass filter plotted between
    100 MHz and 1.7 GHz. As expected the region around 1090 MHz has strong power,
    and neighbouring regions are tapered off.


    ![](img/33eab9643eb7fbb4bf9363c117190041_485_1.png)'
  merge: -1
  pgno: 485
- img_proc: true
  md: 'After viewing the response in RTL-SDR Panorama we recommend plotting the same
    graph against a baseline graph of just the noise source connected directly to
    the RTL-SDR. This can be done using Excel or any other similar plotting software.
    Each time RTL-SDR Panorama finishes a frequency sweep, the data is stored in a
    CSV file called scan.csv. It will be located in the same folder as rtlpanam.exe.


    First do a baseline sweep with the noise source connected directly to the RTL-SDR
    (no filters connected) and then stop RTL-SDR Panorama by pressing the stop button.
    Note that after you press the stop button the final sweep will still be running,
    so wait until it finishes first. Next rename the newly produced scan.csv to baseline.csv.


    Now do a sweep with the filter connected – this will create a new scan.csv file.
    Next open baseline.csv in Excel. You should notice that the third column C contains
    the frequency values and the last column G contains the power data.


    Use the Excel plotting tools to create a scatter plot in baseline.csv with frequency
    on the x-axis and power on the y-axis. Finally, open the scan.csv file which contains
    data for the scan with the filter attached. Copy the last column containing the
    power values (column G), and paste into baseline.csv next to the baseline power
    values. Add a plot of the filtered power values next to the same plot as the baseline
    plot and compare.


    Next you can calculate the attenuation by simply subtracting the baseline column
    from the filter power column. Below we show an image of your Excel sheet might
    look like after doing the above. There is the baseline power values next to the
    FM bandstop power values, and the attenuation column is simple the baseline value
    subtracted from the bandstop filter value.'
  merge: -1
  pgno: 486
- img_proc: true
