  md: '# SOFTWARE DEFINED RADIO BASIC

    THEORY


    This book is titled “The Hobbyist’s Guide” and as such we will only very lightly
    touch on SDR algorithm theory. Below we will very simply explain SDR theory, but
    please note that there is a lot more to the theory and design of SDR systems than
    what is described below.


    A software defined radio simply works by receiving an analogue radio signal with
    an antenna and then using an Analogue to Digital Converter (ADC) to digitize the
    signal. The digitized signal can then be worked on in digital signal processing
    software on a standard PC.


    In practice an ADC will only work up to a certain frequency. The RTL2832U is a
    type of ADC which works up to 28.8 MHz. To digitize higher frequencies we need
    a mixer to convert all received frequencies down to the frequencies that the ADC
    can use. This is the job of the tuner chip (e.g R820T/E4000).


    In very brief, the total process is that the signal is received by an antenna,
    amplified with an internal LNA by the tuner, filtered to remove aliases, amplified
    again enough for the ADC to be read the signal and then digitized with the ADC.
    Once digitized the digital I/Q data is sent over USB into the PC where signal
    processing algorithms are used to demodulate and/or decode the signal.


    At any one time, an SDR receives and processes a “chunk” of the RF spectrum, e.g
    perhaps 2 MHz worth of bandwidth, or more for more advanced SDR’s. Within this
    chunk of bandwidth there may be many'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'signals. The software digital signal processing side of things handles the
    tuning of individual signals within this chunk of bandwidth.


    We might think of the following heavily simplified analogy with the color spectrum.
    Let’s say that from the color spectrum (purple to red) we want to use our SDR
    to “listen” to the green signal. First we use our antenna to receive the entire
    spectrum. The SDR digitizes a section of it (how big the section depends on the
    SDR’s bandwidth), and sends the digitized section to the computer running DSP
    software. The DSP software then uses a digital filter algorithm to extract only
    the green signal that we want to listen to.


    ![](img/33eab9643eb7fbb4bf9363c117190041_26_0.png)


    **Advanced:** RTL-SDR uses I/Q sampling, which two ADCs are used, one for the
    minus from the DC offset and one for the positive part of the DC offset. This
    is how we can get 3.2 MHz of bandwidth from a 3.2 Msps sampling rate despite the
    Nyquist limit. (If an ADC can sample at 3.2 Msps, the maximum bandwidth it can
    digitize is 3.2/2 = 1.6 MHz due to Nyquist.)


    If you are interested in a more in depth treatment of SDR theory, the ARRL has
    a good article at http://www.arll.org/files/file/Technology/tis/info/pdf/020708qex013.pdf
    and the University of Colorado College of Engineering and Applied Science has
    an excellent depth lab sheet on the SDR theory of the RTL-SDR in particular


    http://www.eas.uccs.edu/wickert/ece4670/lecture_notes/Lab6.pdf.'
  merge: -1
  pgno: 26
