- img_proc: true
  md: 'Uses: Great if you need extra gain out towards the horizon. Good for ADS-B,
    AIS etc.


    Collinear antennas can have very high gain directed towards the horizon which
    make them ideal for receiving weak signals from long distances. They work very
    well for ADS-B and AIS reception as well as terrestrial voice communications frequencies.
    They are easily built out of coax or copper wire/pipe.


    The more elements added to a collinear antenna, the greater the gain will be and
    the flatter and more directed towards the horizon radiation pattern will be. With
    enough elements the radiation pattern becomes disc like. However note that a collinear
    antenna with too many elements will yield poorer performance for some applications
    like ADS-B compared to one with less. This is because the radiation pattern can
    become too flat and will miss signals coming in from higher elevations.


    Collinear antennas with 50 Ohm impedances can be easily made out of coaxial antennas.
    See here for information on constructing an ADS-B coaxial collinear http://www.balarad.net/.
    Coax colline are also sometimes referred to as CoCo antennas. Here is a video
    showing the construction process of a CoCo antenna https://www.youtube.com/watch?v=TkuydCPFXXs.
    One difference between a wire/pipe collinear and a coax collinear is that the
    coax wire will be longer. Here is for information on constructing a coaxial collinear
    for AIS http://nmeyerrouter.com/docs/ais/aerial.html. Here is a wire collinear
    for WiFi http://martybugs.net/wireless/collinear.cgi, its element lengths could
    be adapted for other frequencies using the calculation specify.


    The antenna used in the images shown above is a collinear dipole and is designed
    for 144 MHz. It is a 300 Ohm antenna, so a matching device'
