  md: 'A j-pole schematic and calculator can be found at http://www.hamuniverse.com/jpole.html.


    The jim is an antenna that is very similar to the j-pole, except that it has an
    extra fold on the inside. Slim jims have a radiation pattern that slightly favours
    signals coming from the horizon a little more and so are usually a better choice
    for most applications.


    Slim jims and j-poles can easily be constructed out of twin lead wire. Here is
    a tutorial example http://www.g4aym.org.uk/projects/project3/page0.htm. Here is
    a slim jim calculator http://www.m0ukd.com/Calculators/Slim_Jim/. And here an
