    # INSTALL SCRIPT


    The easiest way to install the latest version of GNU Radio on almost any Linux
    OS is to use Marcus Leech''s install script. This script will also install other
    related libraries such as RTL-SDR and OsmoSDR. We prefer this method as it is
    the easiest and most likely to succeed. To use the script all that is required
    is to type the following into terminal.'
