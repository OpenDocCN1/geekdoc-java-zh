- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_453_0.png)


    10. Now start a continuous scan in RTLDR Scanner and drive around. Be sure to
    set the bandwidth relatively small around the signal you are interested in to
    get better resolution. You might try adjusting the dwell and FFT sizes to get
    faster scans.


    11. Once you have finished, press Stop. Then go to File -> Export Map. Choose
    the frequency in kHz you would like to plot on the heatmap and choose the bandwidth
    in kHz around that frequency that you would like to include in the averaging.
    For example if you were wanting the heatmap of a 100 kHz wide signal at 88.6 MHz,
    you would set the centre frequency as 88600 and the bandwidth as 50.'
