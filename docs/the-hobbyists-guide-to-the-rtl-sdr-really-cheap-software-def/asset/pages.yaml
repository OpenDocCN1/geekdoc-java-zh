    # CONFIGURE WINDOW'
  merge: -1
  pgno: 53
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_54_0.png)


    The SDR# configure window can be accessed by clicking on the cog icon at the top
    of the main SDR# window. The settings in this window affect the actual RF performance
    of the RTL-SDR, and should be set correctly to optimise the signal to noise ratio
    (SNR). The configure window has several options which are described below.


    # DEVICE


    If you have multiple RTL-SDR dongles plugged in, the device drop down menu allows
    you to choose between them.


    # SAMPLE RATE


    Recommended Default Setting: 2.048 or 2.4 MSPS


    Let you choose the size of the instantaneous bandwidth the RTL-SDR should display.
    Generally settings of up to 2.8 MSPS work well most on PCs, but if you have a
    slow PC you may want to reduce this. A larger sample'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'rate may improve reception on weak signals as this allows for more oversampling.
    We recommend a default rate of 2.048 or 2.4 MSPS.


    # SAMPLING MODE


    Recommended Default Setting: Quadrature Sampling


    Use Quadrature sampling for normal operation. The direct sampling selections should
    be used when using a modded device in the direct sampling mode. See the direct
    sampling section for more information.


    # OFFSET TUNING


    Recommended Default Setting: OFF IF R820T/2, ON IF E4000/FC0012/13


    Only useful for the E4000/FC0012/13 tuners. Selecting this will get rid of the
    large spike in the center of the spectrum that is present with the E4000/FC0012/13
    zero IF tuners.


    # RTL AGC


    Recommended Default Setting: OFF


    Enables the automatic gain control system on the RTL2832U chip. This is normally
    not useful as selecting this usually degrades reception.


    # TUNER AGC


    Recommended Default Setting: OFF


    Enables the automatic gain control system on the tuner chip. Can be useful for
    general browsing, but it is almost always better to set the gain manually.


    # RF GAIN


    Recommended Default Setting: Adjust for best performance


    This slider can be used to set the tuner RF gain manually. Will not be active
    if Tuner AGC is checked.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# FREQUENCY CORRECTION (PPM)


    Recommended Default Setting: Your dongles unique PPM offset


    Allows you to correct the frequency offset that RTL-SDRs have from having low
    quality crystal oscillators. See the setting the PPM correction section further
    down for more information.


    # SETTING THE RF GAIN


    There are three RF gain settings that can be found by clicking on the Configure
    button. RTL AGC turns on the RTL2832U chips internal automatic gain control (AGC)
    algorithm. Tuner AGC enables the RTL-SDR tuners AGC. The AGC''s attempt to automatically
    optimize the SNR of signals. Finally, the gain slider can be used to manually
    set the gain.


    The AGCs used in the RTL-SDR are designed to be used with wideband DVB-T signals,
    and do not work well with narrowband signals. We reccomend using manual gain control
    to optimize the gain of a signal, however for casual browsing turning on Tuner
    AGC may suffice. RTL AGC is almost never used as it tends to just introduce a
    lot of unwanted noise.


    The goal when setting the RF gain manually is to try and get the signal to noise
    ratio (SNR) as high as possible. This means that the maximum signal strength should
    be high, but the noise floor should also be as low as possible.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_57_0.png)


    When increasing the gain, there will come a point at which the noise floor begins
    to rise faster than the signal strength rises. This is the point at which you
    stop increasing the gain.


    You can calculate the signal to noise ratio by subtracting the peak signal height
    from the height of the noise floor. Below we show an example of the effect that
    increasing the RF gain has on a signals SNR.


    ![](img/33eab9643eb7fbb4bf9363c117190041_57_1.png)


    # SNR: -41 - -65 = 24 dB'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_58_0.png)


    # SNR: -21 - -65 = 44 dB


    ![](img/33eab9643eb7fbb4bf9363c117190041_58_1.png)


    # SNR: -12 - -57 = 45 dB'
  merge: -1
  pgno: 58
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_59_0.png)


    # SNR: -5 - -45 = 40 dB


    From the above images we see that as we raise the gain the SNR increases, but
    if we raise it too much the SNR actually begins to decrease. For this signal the
    gain was optimal at around 40.2 dB which gave us a SNR of 45 dB.


    # SETTING THE FILTERS


    Usually adjusting the filters is not required. However, sometimes there may be
    a nearby interfering signal which can be tuned out with software filtering. We
    can see the effect that the filter order has the Zoom FFT Spectrum plugin which
    is supplied with the standard SDR#. To activate this plugin, simply click on the
    “Enable IF” box in the left menu under the “Zoom FFT” heading. The Zoom FFT spectrum
    shows the signal in the tuned area after the band pass filtering. You can use
    it to investigate the effects of different filter orders and filter types. For
    example, here we are tuned to an AM radio signal. Notice how just to the left
    of this particular AM'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'signal is another signal which appears to be some sort of radar and to the
    right is another unknown source of interference.


    ![](img/33eab9643eb7fbb4bf9363c117190041_60_0.png)


    With the filter order set to 10 the radar signal can be heard in the audio and
    seen in the left of the Zoom FFT IF spectrum plugin window, even though it is
    outside of the tuned bandwidth.


    ![](img/33eab9643eb7fbb4bf9363c117190041_60_1.png)'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'By increasing the filter order to 500, the filter ‘sharpens’ and now signals
    outside of the tuned bandwidth are blocked out.


    ![](img/33eab9643eb7fbb4bf9363c117190041_61_0.png)


    In this AM radio signal there is also an interferer on the inside of the tuned
    bandwidth on the right of the signal. This interferer can be heard in the output
    audio as a subtle hissing sound. Newer versions of SDR# have a secondary filter
    which can be turned on on the Zoom FFT plugin in the left menu by checking the
    box labelled ‘Enable Filter’.


    ![](img/33eab9643eb7fbb4bf9363c117190041_61_1.png)


    The secondary filter can be used to tune out interfering signals within the tuned
    area by altering the bandwidth for each side independently. To do this simply
    click and drag on the filter edge on one side of the Zoom FFT spectrum window
    and drag the filter in or out. Note that using this secondary filter will also
    increase CPU usage.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_62_0.png)


    # SETTING THE PPM CORRECTION


    PPM is a term that stands for parts per million and is a measure that can be used
    to determine the accuracy of a crystal oscillator. The crystal oscillator is the
    “clock” or “heartbeat” of a digital circuit. High quality crystal oscillators
    have a low PPM value.


    As the RTL-SDR dongles are mass produced with low quality 28.8 MHz crystal oscillators,
    the tuned frequency can be out by to +-150 PPM or even more. Some RTL-SDRs now
    come with improved crystals with lower PPM tolerances. Ones that come with a surface
    mount (SMD) crystal will usually have a tolerance of +-30 PPM. Ones that come
    with a TCXO oscillator will usually have a tolerance of +-1 PPM or, normally won’t
    require any frequency correction to be set.


    A large tolerance can mean that a known frequency that you are tuning may not
    be exactly at the frequency that you expect it to be. You may find that the frequency
    will always be off by a few kilertz which can be very frustrating for narrow band
    signals. At small frequencies (HF), the frequency offset won''t be so visible,
    however at VHF and UHF frequencies the frequency offset will be larger. PPM works
    like this: at 1 kHz a 1 PPM offset will only be 0.001 Hz. However at 1 MHz the
    offset will be 1 Hz, at 10 MHz the offset will be 10 Hz, at 100 MHz the offset
    will be 100 Hz and so on.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'when using an RTL-SDR with large PPM offset, signals you tune to in the VHF/UHF
    ranges may not be where you expect them to be. This linear increase in frequency
    offset as the tuned frequency increases is also why you cannot correct the crystal
    offset with the “Shift” box, which is instead used for setting upconverter offsets.


    Fortunately, SDR# has an option to correct the PPM frequency offset that you may
    encounter. To set the PPM correction, you will first need to know the true frequency
    of a known radio signal, preferably a constant narrow band signal such as a trunking
    channel, or something like a strong ATIS signal. To find such frequencies, you
    can look them online in your countries national frequency database or on a website
    such as radioreference.com.


    Tune to the known frequency in SDR#. You will probably find that the actual tuned
    frequency is offset from the known signal. Zoom into the signal a little using
    the zoom slider. Click the Configure button. Now adjust the PPM offset value box
    so that the signal lines up exactly with the red tuning line. The PPM offset on
    most dongles is almost always a positive value between 0 and around 150. Remember
    to wait for the dongle to warm up after first plugging it in as changes in temperature
    can affect the PPM offset.


    The images below show the effect of settings the PPM. The first image shows what
    happens when you tune to a signal at 859.070 MHz without having the PPM set correctly.
    The tuning bar is far off the actual frequency. In the second image a PPM correct
    of 36 is set, and now the tuning bar sits in the middle of the known signal’s
    frequency.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_64_0.png)


    Another way to get an accurate PPM offset value is to use a Linux program called
    Kalibrate. This command line program uses mobile phone GSM signals to accurately
    detect the dongles offset. Obviously you will need GSM signals in your area and
    an antenna which can receive them for this to work. A tutorial on this can be
    found in the Calibrating the RTL-SDR section of this book. However, note that
    we strongly recommend the manual method as Kalibrate can sometimes give inaccurate
    results.


    # SDR SHARP PLUGINS'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'There are many plugins available for SDR# that extend its functionality. We
    recommend visiting http://www.rtl-sdr.com/sdrsharp-plugins/ and http://www.sdrsharp.com/#plugins
    for a list and brief overview of these plugins.


    To install plugins you will most often need to copy a .dll file to the SDR# directory
    and add an entry to Plugins.xml text file. This file is in the SDR# directory.
    You will need to open this file in Notepad or another editor to read it.


    The readme file that usually comes in the plugin zip file will usually tell you
    what to add. The line should be added between the <sharpPlugins></sharpPlugins>
    tags in the Plugins.xml file.


    Note that some older readme files may still instruct you to add the line to the
    SDRSharp.exe config file. This was used in older SDR# versions and is now correct.
    The line should be added to the plugins.xml file.


    ![](img/33eab9643eb7fbb4bf9363c117190041_65_0.png)


    # SDR# MINOUTPUT SAMPLE RATE


    The maximum bandwidth of the tuned area for NFM in SDR# is restricted to 32 kHz.
    However, for some applications that bandwidth is too small. The maximum bandwidth
    for an NFM/USB/LSB signal can be adjusted by changing a setting in the SDRSharp.exe.Config
    file. Open this file in a text editor and find the following line.


    ```

    <add key="minOutputStreamRate" value="32000" />

    ```'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Change this line to the following to increase the maximum bandwidth.


    ```

    <add key="minOutputSampleRate" value="100000" />

    ```


    # OTHER GENERAL PURPOSE


    # SCANNING SOFTWARE


    Once you''ve gotten the hang of the simple and easy to use SDR#, you may want
    to try other similar, but perhaps not as user friendly programs.


    # HDSDR SETUP GUIDE


    HDSDR is an advanced SDR GUI. It is based on the old WinRAD SDR program that was
    popular in the past with older SDRs.


    Along with a FFT display and waterfall, HDSDR has some extra features. Users will
    find an Audio FFT and audio waterfall display on the bottom of the screen. The
    output audio can also be bandpass filtered by dragging the filter borders on the
    audio FFT display. Bandpass filtering the audio can really help clean up a noisy
    signal. The audio processing also supports placing of notch filters either manually
    or automatically. There are also noise reduction and noise blanker features and
    an frequency focussing algorithm which will automatically centre the signal, so
    you don''t need to click exactly in the centre of a signal. Traditional ham radio
    users will also enjoy the S-units signal strength meter and the built in frequency
    manager.


    We recommend installing HDSDR after going through the quickstart guide and installing
    the drivers and SDR#. Then to install HDSDR on Windows follow the instructions
    below:


    +   1. If you have not done so already, download and install zadig from http://zadig.akeo.ie/
    and install the WinUSB drivers for RTL-SDR'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'using the instructions in the SDR# setup guide above.


    +   2. Download HDSDR from http://hdsdr.de/, using the download button at the
    bottom of the page.


    +   3. Use the installer you just downloaded to install HDSDR.


    +   4. Download the ExtIO_RTL2832U.dll dll file from https://app.box.com/s/7ipy8r6qo2bbhdkt4k
    (Mirror: http://bit.ly/1XsgFTX).


    +   5. Copy the ExtIO_RTL2832U.dll file into the HDSDR installer file which is
    by default set to C:\Program Files (x86)\HDSDR.


