    PLANEPLOTTER


    PlanePlotter is sophisticated commercial software that has a free 21 day trial.
    After the trial period a licence can be purchased for 25 Euros. PlanePlotter is
    also able to combine ACARS and ADS-B information together if you have two RTL-SDR
    sticks and can also be used to share data with the popular online ADS-B aggregator
    flightradar24.com. PlanePlotter can be downloaded from http://www.coaa.co.uk/planeplotter.htm.


    One big advantage to using PlanePlotter is that it has a multilateral option which
    can be unlocked either by regularly contributing ADS-B data to their servers,
    or by paying 12 euros a year. Multilateral is a method which is used to estimate
    positions of planes that are broadcasting ADS-B signals without position data.
    It works by using data contributed from multiple locations and users to essentially
    triangulate plane positions.


    PlanePlotter is easy to set up with the RTL-SDR, see the instructions below.


    +   1. Download and install PlanePlotter from the website. Open PlanePlotter.'
