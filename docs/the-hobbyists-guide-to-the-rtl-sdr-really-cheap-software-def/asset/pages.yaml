    # # HFDL DECODING GUIDE


    HFDL is an acronym for High Frequency Data Link. It is similar to ACARS but sent
    over HF frequencies. A list of HFDL frequencies can be found at http://qrg.globaltuners.com/?q=hfdl.
    To decode HFDL, the SDR receiver must be set to USB mode and tuned to 1440 Hz
    below the centre of the HFDL packet. The bandwidth should be set as 2800 Hz. If
    you are unfamiliar with what an HFDL signal looks like, check out the zoomed in
    example waterfall image below.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_374_0.png)


    To decode HFDL a program known as PC-HFDL can be used. PC-HFDL is not free software
    as it costs $35 USD, but it comes with a free 10 minute trial per opening. It
    is probably the best HFDL decoder available at the moment. PC-HFDL can be downloaded
    from http://www.chbrain.dircon.co.uk/. To use PC-HFL with the RTL-SDR follow these
    steps.


    +   1. Open SDR or your favourite SDR receiver software and set the audio output
    to your preferred audio piping method.

    2. Tune to a HFDL station using Upper Side Band (USB) mode.

    3. Ensure that the signal is tuned to 1440 Hz below the centre of the HFDL packets.
    This is important.

    4. Set the bandwidth to 2800 Hz.

    5. Open PC-HFDL.

    6. Go to System-Options -> Soundcard Configuration.

    7. Choose the audio piping method you are using in your SDR receiver and click
    on Select Mixer Input.'
