    # ## SCANTENNA


    **Name:** Scantenna


    **Polarization:** Vertical


    **Broadband:** Yes


    **Uses:** General purpose antenna good for almost all frequencies.


    The scantenna is an antenna similar to the discone in that it has a very wide
    receiveable bandwidth. Many people often state that the scantenna performs better
    than a discone. This is probably because the scantenna has greater gain out towards
    the horizon and is thus a better receiver for most common signal sources.'
