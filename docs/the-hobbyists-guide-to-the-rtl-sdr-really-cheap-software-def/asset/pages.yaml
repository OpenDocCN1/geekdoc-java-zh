- img_proc: true
  md: 'SomeMotorTRBO radios contain a GPS receiver within them that is used to send
    GPS locations over radio to base. This is useful for tracking a fleet of vehicles
    for instance. The protocol used to send these locations out is called Location
    Request Response Protocol or LRRP for short and it is contained within a standard
    MotorTRBO/DMR signal. DSD+ can be used to decode LRRP signals and show them on
    a map.


    To show decoded LRRP coordinates on a map when using DSD+, simply open LRRP.exe
    which is in the same directory as DSDplus.exe. Tune to a MotoTRBO signal just
    as when listening to voice. As LRRP signals are received they will start to display
    on the map. You can use the mouse to pan and zoom around the map to look at your
    local area.


    Note that many LRRP radio users use a third party GPS software system which cannot
    be decoded by DSD+. If you do not see any coordinates in the DSD+ event log when
    an LRRP event is shown in the event log this may be the case.


    # CTCSS TRUNKED SQUCH


    CTCSS is an acronym for Continuous Tone-Coded Squelch System and is a squelching
    system that is used in shared two radio systems (walkie-talkies). It is common
    for a single voice radio channel to be shared over a number of user groups for
    frequency efficiency. CTCSS uses a special tone within the voice audio that identifies
    each group of users. This tone is used to prevent a group hearing radio chatter
    from another group sharing the same channel.


    A SDR# plugin by the name of CTCSS decoder can be used to detect and use CTCSS
    tones for squelching. It can be downloaded from http://rtl-sdr.ru/page/ctcss-detektor-shumopodavitel
    (Mirror 1:'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'http://sdrts.amoti.ru/ctcss_detektor_shumopodavitel ) (Mirror 2:

    http://bit.ly/1iV44Me).


    ![](img/33eab9643eb7fbb4bf9363c117190041_308_0.png)


    # DCS TRUNKED RADIO


    DCS is an acronym for Digital Code Squelch and is a system very similar to CTCCSS
    in that it allows for radio user sharing by ensuring that radio users are not
    bothered by communications not intended for them. DCS is sometimes also known
    as Continuous Digital-Coded Squelch System (CDCSS).


    A SDR# DCS decoder and squencher plugin can be downloaded from http://www.rtl-sdr.ru/page/novyj-plagin-dcs-decoder.


    # LTR TRUNKED RADIO


    Logic trunked radio is a type of trunked radio system that does not use a control
    channel. Instead each repeater has its own control signal is modulated into the
    voice signal. LTR is known as a distributed trunking system as opposed to a dedicated
    trunking system which uses a signal control channel.


    LTR can be analysed using a Windows command line program known as LTR Analyzer
    which can be downloaded here http://home.ica.net/~phoenix/wap/LTR/. Download LTR-Analyzer.zip
    and'
  merge: -1
  pgno: 308
- img_proc: true
  md: Fleetsync II is a protocol that can transmit status information as well as GPS
    coordinates. It is usually transmitted along with a voice signal, and can be identified
    by a short sound that plays before voice. Fleetsync II can be decoded with SDR
    Trunk which is available https://code.google.com/p/sdrtrunk/. SDRTrunk will display
    decoded GPS messages on a map.
