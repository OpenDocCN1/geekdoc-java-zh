  md: '# INSTALLING GNU RADIO


    GNU Radio is a popular Linux based digital signal processing platform that is
    compatible with the RTL-SDR. GNU Radio is a large complicated program and can
    sometimes be difficult to install. Below we show the most common methods.


    Important Note: Do not run an installation process where GNU Radio is compiled
    on an embedded device running on an SDCard. The amount of writes GNU Radio does
    during the installation process can destroy the card. After installation GNU Radio
    can be started by typing gnuradio-companion at a terminal window.


    If you happen to be running GNU Radio in an Ubuntu virtual machine, you may need
    to adjust some settings found in /usr/local/etc/gnuradio/conf.d/gr-audio-salsa.conf.
    You may need to alter these values to period_time = 0.10 and nperiods = 32 if
    you choose choppy audio.


    Note unless you use the install script shown below, the RTL-SDR Linux drivers
    should be pre-installed for GNU Radio to work with the RTL-SDR. See Installing
    RTL-SDR Drivers on Linux. If you don''t want to go through the process of install
    GNU Radio there are several Linux distributions and Live DVDs that have GNU Radio
