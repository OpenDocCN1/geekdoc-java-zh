    \ updated experimental branch is keerened, which can be found here https://github.com/keenerd/rtl-sdr.\n\
    \nNote that you simply want to use the RTL-SDR, compiling the drivers is not necessary.\
    \ Just follow the Quickstart guide from the first section.\nCompiling the drivers\
    \ on Linux is simple and instructions are provided on the official osmocom page\
    \ at http://sdr.osmocom.org/trac/wiki/rtl-sdr.\nCompilation on Windows is a little\
    \ more complicated so we present a tutorial below: \n\n# COMPILING WITH MINGW\n\
