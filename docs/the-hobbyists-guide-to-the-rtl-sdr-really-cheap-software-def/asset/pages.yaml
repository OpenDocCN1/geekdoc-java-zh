  md: '4.


    # # RADIO ASTRONOMY GUIDE


    Combined with a suitable antenna and LNAs the RTL-SDR has been used as a astronomical
    tool to:


    +   - Observe the hydrogen line and galactic plane.

    - Detect meteors entering the atmosphere.


    # ## OBSERVING THE HYDROGEN LINE AND GALACTIC PLANE


    The Hydrogen line can be observed at 1420 MHz (21cm) by pointing a high gain directional
    antenna at the interstellar medium. The interstellar medium is the matter that
    exists between stars. It is made up of a large amount of neutral hydrogen which
    emits electromagnetic radiation at 1420.4057577 MHz. Although this emission is
    rare for a single hydrogen atom, the interstellar medium is made up of a huge
    amount of neutral hydrogen which makes this emission easy to detect with an appropriate
    radio and antenna.


    By observing the hydrogen line over a moving sky it is possible to detect the
    galactic plane. This is because there is more hydrogen in the plane of our galaxy
    than there is in empty space. When the antenna points towards the centre of the
    galaxy, the intensity of the signal at the hydrogen line frequency will rise.


    Additionally, it is also possible to observe the doppler shift of the arms of
    our Milky Way galaxy galaxy. As the galaxy is spinning, the hydrogen line emissions
    from the spinning arms will be doppler shifted away from 1420 MHz. When pointed
    in the right direction, it is possible to observe multiple arms as multiple spectral
    power peaks near 1420 MHz. This is because inner'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'arms will be spinning at a different speed to the outer arms, causing a difference
    in their hydrogen line doppler shifts. This is one way that astronomers were able
    to figure out the shape of our galaxy.


    Items you will need to observe the hydrogen line:


    +   - Large satellite dish (>1m), high gain Yagi antenna, Helical antenna or Horn
    antenna.

    - 1 - 2 LNA Preamps and 1 - 3 line amps.

    - 1420 MHz bandpass filter.


    Marcus Leech was one of the first people to experiment with radio astronomy and
    the RTL-SDR and he has an excellent writeup here http://www.sbr.org/files/budget_radio_telescope.pdf.
    He writes to observe the hydrogen line with the RTL-SDR you will need at least
    1 meter large dish. In most countries with satellite TV, large used dishes can
    be found relatively cheaply. If you have difficulty obtaining a dish, other experimenters
    had success with non dish directional antennas such as a 22 element Yagi http://www.y1pwe.co.uk/RAProgs/HLRrtrtl.pdf
    which may be cheaper and easier to build. Another excellent success with quad
    22-element Yagi as helical and horn antenna can also work. An example of a horn
    antenna used with the RTL-SDR for radio astronomy can be found here http://rishi-patel.blogspot.com/2013/10/summary-of-horn-antenna-project.html.
    More examples of hydrogen line experiments can be found in the following links:


    +   - 3M Dish: http://lea.hamrad.si/~s57ra/index.php/radio-astronomy/hydrogen-line-with-rtl-sdr'
  merge: -1
  pgno: 339
- img_proc: true
  md: '+   - 3.6M Dish:

    - http://lea.hamradio.si/~s53rm/Radio%20Astronomy.htm


    The Hydrogen line is observed by pointing the directional antenna/dish at the
    sky and tuning the radio to 1420 MHz. Because the hydrogen line signal is very
    weak, there a need for several amplifiers for the antenna in order to get enough
    signal strength that the receiver can actually detect. Often two or three line
    amps are used and one very noise amplifier is placed directly after the antenna.
    There is also a need for good band pass filtering around the 1420 MHz region to
    remove out of band interference from man made sources. With the right equipment,
    the hydrogen line is then observed by taking spectral power measurements over
    a period of time and then integrating or averaging the data.


    To average the data you need software that can average the FFT spectrum over a
    period of time. The RAFFT.exe software from http://1ype.co.uk/RAPProgs/index.html
    can be used to do this. There is also the Linux GNU Radio based simple_ra software
    from https://www.cgan.org/wiki/simple_ra. Useful instructions on the use of simple_ra
    can be found at http://superkul.com/rtlsdr.html#simple_ra, though at the moment
    it seems simple_ra is only available for the older version 3.6 of GNU Radio. Linrad
    is another program that can be used to average the spectrum, see http://lea.hamradio.si/~s53rm/Radio%20Astronomy.htm.
    On this page http://lea.hamradio.si/~s57ra/index.php/radio-astronomy/hydrogen-line-rtl-sdr
    is a link to a modified version of a spectrum analyzer used for the Beagle Black
    embedded PC that can be used for hydrogen line observation. The rtl-power software
    that comes with the official osmocom RTL-SDR driver releases can also be used
    for radio astronomy projects like observing the hydrogen line. The main function
    that software for observing'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'the hydrogen line needs is that it needs to record frequency power levels over
    a wide bandwidth for a set amount of time, which is exactly what rtl_power does.
    Although more advanced software will have options for calibration and options
    for setting the units to Kelvin which is the units that radio astronomers prefer
    to work with.


    Here are some more technical papers where the RTL-SDR was used for hydrogen observation:


    http://www.haystack.mit.edu/edu/undergrad/VSRT/VSRT_Memos/071.pdf

    http://www.haystack.mit.edu/edu/undergrad/srt/pdf%20files/2013 HigginsonRollinsPaper.pdf


    # METEOR SCATTER DETECTION


    The RTL-SDR can be used to detect meteors entering the atmosphere. Meteor scatter
    detection works by detecting signals from strong but distant broadcast radio stations
    by listening for radio reflections from meteor trails. As a meteor enters the
    atmosphere, it ionizes the air behind leaving a trail of RF ionized air. Note
    that the RF signals do not reflect off the meteor itself, but rather the ionized
    air that it leaves behind for a few seconds.


    Do to meteor detection there needs to be a broadcasting station with a strong
    carrier signal that is between 300 to 1200 km away from your receiving antenna.
    This is far enough out that the signal is not received too strongly directly,
    but close enough so that a meteor in the sky can reflect the signal down to your
    receiver. Frequencies in the analogue TV spectrum from 50-80 MHz are the best
    to use for meteor scatter. However analogue TV transmitters are being reduced
    due to digital TV switches over the FM band at 88 - 108 MHz can also be used as
    an alternative and possibly also digital transmissions at UHF frequencies, although
    UHF frequencies will give'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'poorer results. If you live in Europe the powerful Graves radar in France which
    transmits at 143.050 MHz is the best choice as it transmits a powerful carrier
    only signal that is perfect for this type of project. In the USA there are also
    several powerful radars which can be used, but you will need to determine which
    ones are near your area. The SNOTEL system that operates in several North American
    states at 40.670 MHz may be another transmitter to investigate.


    ![](img/33eab9643eb7fbb4bf9363c117190041_342_0.png)


    As meteor scatter signals can be weak you should use a high gain Yagi-Uda antenna
    tuned to the band you are monitoring with it pointed towards the sky in the direction
    of the broadcasting station. Non directional antennas can also work, but may not
    have enough gain for good performance. Some people have reported success with
    magnetic loop antennas. An LNA is also desirable. A detected meteor will appear
    on a RF spectrum waterfall as a curved or sloping blip and will produce a kind
    of whistle tone if the receiver is set to the USB mode.


    A good paper by amateur radio astronomer Marcus Leech describing meteor scatter
    detection with the RTL-SDR can be found here http://www.sbrac.org/files/meteor_forward_scatter.pdf.
    Some more papers by a Dr. Morgan that introduces amateur meteor scatter detection
    in general and with the RTL-SDR can be found at'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'http://www.britastro.org/radio/projects/meteorproj.html. There is also an interesting
    article by Sky at Night discussing meteor scatter and showing how to build a Yagi
    for the Graves radar here http://www.britastro.org/radio/downloads/SkyAtNight/BBC_SatN_HOWTO
    OBSERVEEMETEORS.pdf.


    While it is to monitor meteors by eye in stand SDR software like SDR#, it is more
    useful to monitor them over a long period of time using additional meteor detection
    software. Some software will automatically count the number of meteor “pings it
    detects. The software packages Baudeline, HROFFT, rtl_power, Spectrum Lab or meteor_detector
    are discussed below and can be used to monitor a small bandwidth around the transmitter
    frequency for meteor scatter detection.


    # RTL_POWER


    To monitor a small bandwidth around a transmitter at 53 MHz for 1 hour the following
    rtl_power command could be used. Note that meteor scatter it is best to use a
    very small binning size and small bandwidth in order to get a high resolution.
    See the Heatmap Bandscan Tutorial for more information on rtl_power.


    ```

    rtl_power -f 52.995M:53.005M -1 g -50 1i -1h meteor_scatter.csv

    ```


    # HROFFT


    To monitor meteor scatter, a Windows program called HROFFT can be used with the
    RTL-SDR. HROFFT will monitor the audio spectrum of your tuned frequency and output
    colorgrams (audio FFT images) every 10 minutes. HROFFT can be downloaded from
    http://www.bcmeteors.net/php/index/radio-methods/87-radio-detection-basics?showall&start=4.
    To use HROFFT follow the instructions below.


    +   1. Download and unzip HROFFT to a folder.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '+   2. Open the header.txt file and enter the information it asks for.


    +   3. Open your favourite SDR receiver like SDR# and set your preferred audio
    piping method as the output.


    +   4. Tune to the centre frequency of your distant transmitter station, then
    tune a few kHz higher. Set the receive mode to USB and increase the tuned area
    bandwidth to the maximum.


    +   5. Open HROFFT.


    +   6. Adjust the volume in SDR# and the signal level in HROFFT so that the blue
    signal levels shown at the bottom of the graph sit below the first line. A meteor
    will be counted as detected if the blue signal becomes stronger than the first
    horizontal bar so you may wish to adjust the volume and signal level settings
    accordingly so that only actual meteor reflections trigger this bar.


    +   7. After seeing a few meteor echoes, you may wish to adjust the audio bandwidth
    so that it covers the bandwidth of the signals you are detecting. The grey bar
    on the left vertical axis shows the bandwidth, which is adjustable by the f1 and
    f2 settings. This will help detect meteors better as the signal strength is taken
    from the sum of signals from this bandwidth.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_345_0.png)


    Meteors will usually appear as short blips, but larger echoes can occur from big
    meteors. Long trails may indicate radio reflections from aircraft. More information
    about analyzing HROFFT images can be found here http://www.amro-net.jp/about-hro/analyze-hrofft.htm.


    # BAUDLINE


    On Linux the frequency domain FFT baudline can also be used for recording meteor
    scatter activity. Use it to search for blips in the waterfall. Download Baudline
    from http://www.baudline.com/download.html. Baudline can be started using the
    following example.


    ```

    rtl_sdr -f 91M -s 2400000 -g 50 - | /baudline -reset -sampler 2400000 -channels
    2 -format u8 -quadrature -quadature

    ```


    Another excellent software program for detecting meteors is Spectrum Lab which
    can be downloaded freely at http://www.qsl.net/dl4yhf/spectra1.html. A guide to
    using Spectrum Lab for meteor detection with the RTL-SDR can be found in this
    document http://www.britannastbro.org/radio/downloads/TECHNIQUES_FOR_USING_THE_RTL_Dongle.pdf.
    Some additional documents on meteor detection by'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'the same author of the previous paper can be found at http://www.britastro.org/radio/projects/meteorproj.html.


    # METEOR_DETECTOR


    Meteordetector is a GNU Radio program which can be used to detect meteor scatter.
    It used to be available from https://www.cgan.org/, but it seems that the site
    is currently down at the time of writing this (January 2015). We suggest you check
    back regularly for updates, or contact patchvonbraun on IRC freenode ##rtlsdr
    for the code.


    # SOLAR INTERFEROMETRY


    The RTL-SDR can be used as a solar interferometer for measuring changes in the
    sun, such as sunspots. Interferometry is simply a method that can be used to connect
    smaller radio telescope antennas together in a way that they approximate a larger
    antenna.


    Superkh has an 11 GHz solar interferometer that he has been building. Details
    about that can be found at http://superk.com/rtlsdrinterferometer.html.


    # OTHER SIMPLE RADIO ASTRONOMY EXPERIMENTS


    More simple radio experiments can be performed using a simple 18 inch directtv
    satellite dish with LNB and an RTL-SDR. These components can be used to make something
    that has been termed the Itty Bitty Radio Telescope. A low noise block (LNB) amplifies
    and converts GHz high frequencies down to lower frequencies which the RTL-SDR
    can receive. For example, an LNB might convert a 12 GHz signal to 1.2 GHz.


    Using such a simple system the difference in the noise floor between the empty
    sky, the sun, or a persons body can be detected. Experiments can be found here
    http://www.setileague.org/articles/lbt.pdf.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'A link to Itty Bitty Radio Telescope based on the RTL-SDR can be found here
    http://www.stargazing.net/david/radio/itty_bitty_radio_telescope.html.


    As for other software there is also the RTL Bridge software available at http://cygnususa.blogspot.com/2014/07/rtl-meets-radiopipe-and-rs.html.
    This software allows an RTL-SDR dongle to interface with other programs by the
    author of RTL Bridge called Radio-SkyPipe and Radio-Sky Spectograph. Radio-Sky
    Spectrograph allows waterfall spectral visualization of phenomena such as solar
    flares while Radio-SkyPipe is a strip chart data collection program which allows
    digitally sampled analogue data in real-time over the internet or network. A strip
    chart is essentially a frequency power plot.


    # DOPPLER PASSIVE RADAR


    It is possible to use the RTL-SDR as a type of simple doppler scatter passive
    radar system. Doppler scatter radar works in a very similar way to meteor scatter
    detection that is described in the section above about radio astronomy. By tuning
    to a distant but powerful RF transmitter, aircraft and other objects can be observed
    from the reflections they send towards your receiver. Rtl_power can be used as
    a simple tool for passive radar with the RTL-SDR.


    First, find the frequency of a very strong broadcast RF transmitter that is about
    300 to 1200 kilometres away from your radius position. Examples of such transmitters
    might be broadcast FM stations or TV stations. Ideally, the frequency should be
    in the VHF band, but UHF frequencies can also work. The signal should be strong
    enough so that you can just barely see the pilot tone on the waterfall but weaker
    signals may still work.'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'Using rtl_power, monitor a small bandwidth around the transmitter pilot frequency.
    For example, the following will monitor a small bandwidth with high resolution
    for about 1 hour. After monitoring finishes, you can plot a waterfall to see the
    radar blips. See the Heatmap band scan section for information on plotting a waterfall
    using rtl_power.


    ```

    rtl_power -f 674.230M:674.230M:1 -g 50 -i 1 -e h radar.csv

    ```


    You may be interested in this discussion on a non-english forum which discusses
    the different “signatures” different types of aircraft leave on a doppler reflection
    http://www.oh7ab.fi/forumi/viewtopic.php?f=21&t=295&sid=abe828d8ad837eb9d444d2cb1dc15&start=80.


    # DUAL COHERENT PASSIVE RADAR


    Using RTL-SDR dongles running under the same clock source it is possible to create
    a “dual coherent channel” receiver (aka multistatic receiver, coherent multichannel
    receiver), which can be used for creating a passive radar that shows planes on
    a display similar to that of a real radar system. Dual coherent passive radar
    also works by using a strong distant transmitter to provide the reflections. But,
    by having two RTL-SDR dongles connected to the same clock source and two directional
    antennas together with some clever math, a passive radar can be created. The clock
    source can simply be from another RTL-SDR dongle. Simply take two RTL-SDR dongles,
    remove the clock from one dongle, and use a cable to connect the clock from the
    other dongle to the dongle with the clock removed.


    Unfortunately, we haven’t seen any code for this type of project publicly released
    yet, only demo videos are available, see the additional links.


    # Additional Links'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'http://www.rtl-sdr.com/passive-radar-dual-coherent-channel-rtl-sdr/


    http://www.rtl-sdr.com/rtl-sdr-based-coherent-multichannel-receiver/


    http://www.rtl-sdr.com/rtl-sdr-based-passive-multistatic-radar-used-track-aircraft/


    # HF MODES DECODING GUIDE


    To receive HF signals you will need an RTL-SDR dongle with an upconverter, have
    the direct sampling enabled or by using one of the experimental HF drivers. See
    the Receiving LF/MF/HF Guide earlier in the book for more information. Alternatively,
    you could use a HF capable SDR radio such as the Funcube Dongle or SoftRock SDR.
    You will also need to have a HF antenna, most VHF and UHF antennas will not pick
    up HF signals at all. See the Antenna Guide section for more information about
    HF antennas.


    # SHORTWAVE BROADCAST RADIO


    Shortwave broadcast radio is simply international AM radio that is sent over HF.
    All you need to receive this is a decent HF antenna and a HF enabled RTL-SDR.
    Sometimes the hobby of searching for and listening to shortwave radio stations
    is called SWLing (short wave listening). A list of common shortwave radio stations
    can be found here http://support.radioshack.com/support_tutorials/communications/swave-6.htm.


    # CW (MORSE CODE)


    CW is an acronym for Continuous Wave and is a communications method more commonly
    known as Morse Code. It is often used by ham radio hobbyists for making long distance
    contacts. Morse code is easy for humans'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'to decode, but it actually quite difficult for computers to decode accurately.
    Nevertheless, there are several decent CW decoders available.


    All decoders require the audio to be piped into them from a general purpose SDR
    receiver. Most SDR receiver programs will have a CW mode, but if they don''t then
    using USB mode is also okay.


    The best CW decoder is called CWSkimmer. CWSkimmer costs $75 but comes with a
    free 30 day trial. CW Skimmer can be downloaded from http://www.dxatlas.com/cwskimmer/.
    To use CW Skimmer set the hardware type to 3-kHz Radio or SoftRock IF in the settings
    menu. Set the signal I/O Device to your audio piping method. Also ensure the Audio
    output button in the main window is set to off (not pressed in).


    ![](img/33eab9643eb7fbb4bf9363c117190041_350_0.png)'
  merge: -1
  pgno: 350
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_351_0.png)


    ![](img/33eab9643eb7fbb4bf9363c117190041_351_1.png)'
  merge: -1
  pgno: 351
- img_proc: true
  md: 'Free alternative CW decoders with decent performance are CW Decoder from http://www.hotamateurprograms.com/downloads.htm,
    CWGet from http://www.dxsoft.com/en/products/cwget/ and also MultiPSK. Pipe audio
    from SDR# or another SDR receiver into these programs to enable CW decoding.


    Fldgi from http://www.w1hkj.com/Fldgi.html and MultimonNG are capable of decoding
    CW, however their decoders are not as good as CW Skimmer or the ones mentioned
    above.


    A list of CW frequencies can be found at http://www.arll.org/band-plan.


    # RTTY


    RTTY is an acronym for Radioteletype and is a way for radio amateurs to send text
    messages over radio, similar to CW but at faster speeds. A list of RTTY frequencies
    can be found at http://www.arll.org/band-plan.


    RTTY can be transmitted at various baud speeds and it is up to the receiver to
    choose the correct speed. The most common baud rate used by amateur radio hobbyists
    is 45 baud. Weather services and other commercial services also transmit information
    using RTTY but they most commonly use 50 baud. NATO military services prefer transmission
    at 75 or 100 baud. Note that military transmissions are usually encrypted.


    A good program for RTTY is TrueTTY http://www.dxsoft.com/en/products/truetty/.
    Be sure to set the baud rate under the Speed menu.


    # STANAG 4285'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'STANAG 4285 is a HF digital text data link used mostly by military naval services.
    The most common transmitter of STANAG 4285 signals is the French Navy who continuously
    transmit a test signal that repeats the French equivalent of the quick brown fox
    "VOYEZ VOUS LE BRICK GEANT QUE J EXAMINE PRES DU GRAND WHARF". These signals can
    be found all over the HF spectrum and have a bandwidth of 2500 Hz. A list of STANAG
    4285 frequencies can be found at http://qg.globaltuners.com/?q=STANAG+4285&s=1.
    The image below shows what a Stanag 4285 signal looks like zoomed in.


    ![](img/33eab9643eb7fbb4bf9363c117190041_353_0.png)


