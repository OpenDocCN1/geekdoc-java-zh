  md: '+   9. Press the Play button


    # ENABLING UNITRUNKER FOLLOWING


    Now we will make sure that Unitrunker is set to allow the voice receiver to follow
    calls from the signal channel.


    +   1. Go back to the main Unitrunker window and click on the “Options” tab at
    the bottom of the window.


    +   2. Make sure that “Enabled” is checked under Listen. This will allow the voice
    channel to follow the trunking information from the control signal.


    ![](img/33eab9643eb7fbb4bf9363c117190041_298_0.png)


    At this point your trunking receiver should now be up and running!


    # PRIORITY AND LOCKOUT'
