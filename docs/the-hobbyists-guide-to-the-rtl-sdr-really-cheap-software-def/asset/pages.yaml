- img_proc: true
  md: 'While they all have similar performance, we recommend the ones with the MCX
    connectors such as the standard and nano packages. MCX connectors have less insertion
    loss at GHz frequencies which is important for applications like ADS-B. See the
    Antenna Adapter Guide Section for information about insertion loss. Note that
    it has also been reported that the ‘nano’ models get hotter causing greater frequency
    instability. Advanced users may want the dongle with the belling connector as
    these connectors are easier to desolder and replace with a better connector like
    BNC.


    # OTHER SDRS WORTH MENTIONING


    Although there is not yet any SDR that is more value for money that the RTL-SDR,
    there are several more advanced SDR radios available for purchase. Better SDRs
    can come with improvements like front end filters, larger ADCs, wider bandwidths,
    wider frequency ranges and possibly transmit capabilities. Larger ADCs give better
    dynamic range and sensitivity and front end filters reduce out of band interference.
    We list the most popular alternative SDRs below.


    | Freq Range | Bandwidth ADC Comments Price |

    | --- | --- | --- | --- |

    | (MHz) | (MHz) | (Bits) | (USD) |

    | Fucbe | 0.150 - 0.192 | 16 | RX. Filters 200 |

    | 260 410 2050 | | | |

    | HackRF | 30 - 20 6000 | 8 | RX/TX 299 |'
