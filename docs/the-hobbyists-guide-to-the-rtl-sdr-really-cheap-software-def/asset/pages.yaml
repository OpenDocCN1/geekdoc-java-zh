  md: '![](img/33eab9643eb7fbb4bf9363c117190041_547_0.png)


    **Left:** Image of a typical j-pole, **Right:** 3D Radiation Pattern at 144 MHz
    and 5m high


    **Name:** J-Pole


    **Polarization:** Vertical


    **Broadband:** No


    **Uses:** Good all rounder with an easy way to match SWR.


    The j-pole antenna is named as such because it looks like the letter ‘J’. A jpole
    is almost equivalent in terms of radiation pattern gain performance when compared
    to a dipole or quarter wave ground. The main difference is in the feed line connection.
    In a j-pole the feedline connects across the folded part and the height of the
    connection can be adjusted to tune the antennas SWR (you’ll need an SWR meter
    to be able to easily do this). J-poles can also be somewhat easier to handle compared
    to dipoles and can even be built out of twin wire for a collapsible portable version.'
