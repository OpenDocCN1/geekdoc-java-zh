  md: '# DIGITAL SSTV


    Digital SSTV is a modern SSTV mode that uses a digital signal to transmit high
    quality images on HF. Digital SSTV is most commonly found on or near the following
    frequencies in MHz.


    +   - 3.733

    - 7.058 (Europe)

    - 14.233 (most popular freq)

    - 21.337


    A good digital SSTV decoder is EasyPal which can be downloaded from http://www.kc1cs.com.


    ![](img/33eab9643eb7fbb4bf9363c117190041_360_0.png)


    # WSPR


    WSPR (pronounced as ‘whisper’) is an acronym for weak signal propagation report.
    It is a type or signal that is used for sending and receiving very weak'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'signals on HF between amateur radio operators.


    An excellent WSPR tutorial for the Fucube Dongle (but also applicable to the upconverter/direct
    sampling mod) can be found here http://www.nerdsville.blogspot.com/2013/03/wspr-using-fucube-dongle-pro.html.


    # MARINE HF MODES


    Marine HF modes are signals that are generally intended for mariners out at sea.
    These modes are mainly used to send things like weather reports, but it can be
    interesting to receive them on land. Below we present some common marine HF modes.


    # WEATHERFAX (HFFAX) DECODING GUIDE


    WeatherFax (sometimes also known as WEFAX or HFFAX) is a HF mode used by meteorological
    agencies to transmit images of weather information charts. There is a service
    mainly by mariners at sea. There is also a Japanese newspaper known as “Kydo News”
    which transmits entire pages of its daily newspaper via HFFAX. Weatherfax frequencies
    are different in every country but there is a large record of radio fax frequencies
    for many countries that can be found from the NOAA website here http://www.nws.noaa.gov/om/marine/rfax.pdf.


    To decode HFFAX use a general SDR receiver like SDR# or SDR-Radio and pipe the
    audio into a decoder program Fldgi is capable of decoding and displaying HFFAX
    images. Fldgi can be downloaded from http://www.w1hkj.com/download.html. To receive
    weatherfax follow these instructions.


    +   1. Open your favorite SDR receiver and set the audio output method to your
    preferred audio piping method.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '2. Tune to a weatherfax signal in your SDR receiver. Use Upper Side Band (USB)
    mode and set the bandwidth to about 1900 Hz.


    3. Open Fldigi and go to Configure -> Sound Card.


    4. Change the Capture audio device to the audio piping method you have chosen.


    ![](img/33eab9643eb7fbb4bf9363c117190041_362_0.png)


    5. Now go to Op Mode -> WEFAX -> WEFAX-IOC576.


    6. Click the Automatic Frequency Control (AFC) button in the bottom right corner
    so that the light is green.


    7. When a WEFAX signal starts to play Fldigi will automatically start decoding.'
  merge: -1
