    # # SHIPLOTTER TUTORIAL


    ShipPlotter is a software tool that can decode and plot the location data stored
    in AIS signals. ShipPlotter is commercial software and costs 25 euros for personal
    use, but has a 21-day trial. ShipPlotter is only capable of listening to one AIS
