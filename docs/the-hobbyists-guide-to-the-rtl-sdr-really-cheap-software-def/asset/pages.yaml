  md: 'https://github.com/mutability/rtl-sdr/. A precompiled Windows binary for SDR#
    can be found at http://bit.ly/W2Zzqv (Mirror: https://dl.dropboxcontent.com/u/43061070/rtlsdr_OLIVERHFMOD.dll).


    Simply download this file, rename it to rtlsdr.dll and copy it to the SDR# folder
