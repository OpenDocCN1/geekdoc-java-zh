  md: '# ACARS RECEIVING GUIDE


    # INTRODUCTION TO ACARS


    ACARS is an acronym for Aircraft Communications Addressing and Reporting System.
    It is a digital communications system that commercial aircraft use to send and
    receive short messages to and from ground stations. Some messages you might hear
    on ACARS are OOOI events (messages reporting changes in major flight phases as
    Out of the gate, Off the ground, On the ground and Into the gate), digital information
    sent to the aircraft avionics and text messages to the flight crew. Some ACARS
    messages will also contain aircraft GPS coordinates, but if your goal is aircraft
    radar, the ADS-B aircraft radar section will be of more interest to you. Each
    ACARS message also contains the aircraft registration and fight identification
    number.


    Standard ACARS transmits at a VHF frequency of 131.550 MHz, but there are other
    frequencies also in use depending on your location. There are also ACARS messages
    transmitted via the Inmarsat Satellite network and on the HF bands, but these
    bands are not as commonly used as the VHF band.


    With the RTL-SDR and some decoding software, the ACARS messages around you can
    be received and displayed live on your PC. As ACARS transmits in the VHF band,
    reception is very nearly line of sight. But as aircraft fly high in the sky, with
    a good antenna you should be able to receive messages from high altitude aircraft
    that are up to 200 miles away. Because ACARS uses vertically polarized signals
    we recommend a discone, collinear, quarter wave ground plane or j-pole antenna.
    See the antenna guide section in this book for more information on these antennas.
    An LNA'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'and bandpass filter may also help but are not necessary unless you have poor
    reception. See the LNA section and preselector section for more information.


    So why receive ACARS? Well apart from watching the messages that come through,
    most decoder software will also look up the received aircraft registration number
    on the internet and display information and a photograph of the airplane transmitting.
    This is a great aid to aircraft spotters and anyone who wants to see what is flying
    in the air around them.


    In the table below we show some common ACARS frequencies.


    | Freq (MHz) | REGION / COUNTRY |

    |---|---|n| 131.550 | Primary worldwide |

    | 129.125 | USA and Canada |

    | 130.025 | USA and Secondary |

    | 130.425 | USA Additional |

    | 130.450 | USA and Additional |

    | 131.125 | USA Additional |

    | 131.450 | Japan/China Primary |

    | 131.475 | Air Canada Company |

    | 131.525 | European Secondary |

    | 131.725 | European Primary |

    | 136.700 | USA Additional |

    | 136.750 | USA Additional |'
  merge: -1
  pgno: 148
- img_proc: true
