- img_proc: true
  md: '# FFT DISPLAY


    ![](img/33eab9643eb7fbb4bf9363c117190041_46_0.png)


    # VIEW


    Recommended Default Setting: Both


    Set it to view both the RF spectrum and the waterfall, or only one of them, or
    none at all. Removing the waterfall may be useful on older PCs with slow processing
    hardware.


    # WINDOW


    Recommended Default Setting: Blackman-Harris 4


    Sets the type of filtering algorithm to use on the FFT, the default of Blackman-Harris
    4 is the best in most cases.


    # RESOLUTION'
  merge: -1
