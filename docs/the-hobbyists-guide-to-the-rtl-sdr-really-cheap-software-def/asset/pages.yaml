  md: '# RDS RECEIVING GUIDE


    RDS stands for Radio Data System and is a digital signal embedded into broadcast
    FM signals. It is used by radio stations to display the name of the radio station
    and/or current song playing on an LCD screen.


    SDR# automatically decodes RDS data in the top left of the RF spectrum when tuned
    to a broadcast radio station with the WFM mode set.


    ![](img/33eab9643eb7fbb4bf9363c117190041_409_0.png)


    If you are unsure if a radio station has RDS or not you can check it in SDR# by
    using the “Enable MPX” option in the Zoom FFT plugin. This will open a new RF
    display showing the FM MPX Spectrum. If RDS is used on a radio station, you should
    be able to see a peak at about 57k. On HDSDR the RDS peak is much easier to see.
    You can check visually in HDSDR’s audio spectrum to see if the station you are
    tuned to has RDS. In the example screenshot below there is a thin signal to the
    right of the spectrum - this is the RDS signal. An example of an FM station without
    RDS is shown below it.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_410_0.png)


