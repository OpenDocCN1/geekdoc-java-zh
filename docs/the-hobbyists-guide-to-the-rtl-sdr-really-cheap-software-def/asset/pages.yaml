  md: '# RTL-SDR FOR ANDROID


    At the time of writing this section in this book there are currently five Android
    RTL-SDR apps available on the Google Play marketplace.


    To use RTL-SDR on Android, you need a powerful device that runs at least Android
    4.0. You also need a special USB OTG (on-the-go) cable adapter. See the Buy RTL-SDR
    dongles page for a link to places where you can buy OTG cables http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/.
    Note that some mobile devices do not have enough power to run the RTL-SDR dongle
    by themselves. If this is the case you will need to buy a USB OTG cable that can
    be powered externally via a battery pack. You may want to consider a powered USB
    OTG cable regardless because running the RTL-SDR on a mobile device can quickly
    drain the battery. It may pay to use an external battery pack connected to the
    powered USB OTG cable if using RTL-SDR on Android away from a power source.


    # SDR TOUCH


    SDR Touch was the first RTL-SDR app for Android released. It is a general purpose
    SDR GUI similar in function to programs like SDR# as it has an RF spectrum and
    waterfall display and allows tuning of any frequency in multiple modes. The app
    is capable of tuning in WFM, NFM, AM, SSB (USB/LSB) and CW signals. It cannot
    decode digital signals like DRM or DAB/DAB+.


    SDR Touch can be downloaded from the Google Play store by searching for “SDR Touch”.
    There is a trial version and a paid version which can be bought for around $10
    USD. More information about the app can be found at http://www.sdrtouch.com/.
    There is also an ongoing developers'
  merge: -1
