  md: '# DECODING FUNCUBE SATELLITE

    TELEMETRY


    The Funcube-1 (a.k.a AO-78) is an educational amateur radio “cubesat” satellite.
    Its signal is fairly easy to receive, as it passes by almost every location on
    earth three times in the morning and three times at night transmitting telemetry
    at around 145 MHz. With an RTL-DR, decent satellite antenna and the Funcube telemetry
    software you can decode the Funcube-1''s telemetry data. For antennas we recommend
    a turnstile or QFH antenna tuned to 145 MHz, but a simple dipole antenna can also
    work. See the Antenna Chapter for more information on suitable antennas.


    To determine when the Funcube-1 will pass over at your location, use the free
    Orbitron software. It can be downloaded from http://www.stoff.pl/. Once installed
    follow these instructions to set up Funcube-1 tracking.


    +   1. Open Orbitron in Administrator Mode (if Windows Vista/7/8), by right clicking
    it, and selecting Run as Administrator. Orbitron may open in full screen mode.
    Press Alt+Enter to exit full screen if you wish.

    2. You will probably also be presented with a TLE file update screen. You can
    leave all the boxes as default. Click on the update button ↻. Orbitron will download
    the new TLE files. The TLE files contain the satellite orbit information and will
    need to be periodically updated every few days. Running Orbitron in Administrator
    mode is important, as otherwise the TLE files will not be able to be written to.'
  merge: -1
