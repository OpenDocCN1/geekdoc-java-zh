    # # WHAT EQUIPMENT DO I NEED TO

    GET INTO RTL-SDR?


    All that is really needed is the following commonly found equipment:


    +   * An RTL-SDR dongle.

    * An antenna for your project (purchased or home built).

    * Some coax cable and an adapter to connect the RTL-SDR to the antenna.

    * A computer (at least a dual core CPU is recommended), or Linux embedded PC.

    * RTL-SDR software and drivers (most software is free).


    Furthermore, you can get more advanced with some extras:


    +   * An upconverter to receive the HF bands (0 - 30 MHz).

    * A low noise amplifier (LNA) to improve reception.

    * Preselector filters to reduce out of band interference and noise.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Places to buy some of these products can be found at http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/.


    # RTL-SDR TECHNICAL


    # SPECIFICATIONS


    +   - 22-2200 MHz tunable range (approx. depends on tuner model).

    - 3.2 MHz max bandwidth (~2.8 MHz stable).

    - 8-bit ADC (~7 ENOB) giving a little under ~50 dBs of dynamic range.

    - < 4.5dB noise figure LNA.

    - 75 Ohm input impedance.


    # RTL-SDR ADC


    ADC is an acronym for "Analogue to Digital Converter". It is a microchip that
    reads in an analogue signal voltage and then digitizes it. The more bits ADC has,
    the more accurate the digitization can be. For an example 8-bit ADC can scale
    the analogue input voltage into values between -127 and +127, whereas a 12 bit
    ADC can scale input voltage from -2047 to +2047.


    With a low ADC certain small details in the analogue input, such as weak signals
    may be lost during digitization. This is especially if there are strong and weak
    signals nearby. **The RTL-SDR has an 8-bit ADC**, which is fairly low, but just
    large enough to give decent performance.


    Dynamic range is the range between the largest and smallest possible values. The
    dynamic range of an ADC can be calculated approximately with: number_of_bits *
    6 dB. This gives the RTL-SDR approximately 50 dB of'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'dynamic range. However, the dynamic range can be made slightly better due to
    the oversampling trick that can be performed in software.


    Some experimental tests shown in this link http://www.rtl-sdr.com/comparison-several-sdrs-degradation-broadcast-fm-frequencies/
    show that the RTL-SDR does indeed have a dynamic range that is slightly better
    than 50 dBs.


    # RTL-SDR BANDWIDTH


    The maximum bandwidth of the RTL-SDR is 3.2 MHz, however the largest stable bandwidth
    is either 2.4 MHz or 2.8 MHz depending on your PC. Setting the bandwidth too large
    can cause choppy samples to be on slow PCs, which causes choppy audio.


    Most RTL-SDR compatible software will let you choose your bandwidth which is sometimes
    referred to as sample rate as well. Although the sample rate and bandwidth are
    not the same thing, in the RTL-SDR setting the sample rate to 2 Msps (Mega samples
    per second) will give you 2 MHz of bandwidth. Setting it to 2.8 Msps will give
    you 2.8 MHz of bandwidth. (If you are familiar with Nyquist you might wonder how
    2 Msps can give 2 MHz; this is because the RTL-SDR uses I/Q sampling with two
    ADCs).


    The bandwidth is the size of the real time frequency spectrum that you can see
    at any one time.


    # INPUT IMPEDANCE


    As RTL2832U dongles are intended for use with TV hardware, they all have an input
    impedance of 75 Ohms. Most amateur and professional radio equipment runs on 50
    Ohm cabling, connectors and adapters.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'You might think this impedance mismatch will be a problem, however the signal
    loss due to the mismatch is minimal, equating to less than 0.2 dB.


    # RTL-SDR MINIMUM PC


    # SPECIFICATIONS


    To use SDR#, the most popular Windows software for the RTL-SDR any modern PC with
    a dual core processor, at least 1 GB of memory and Windows XP or newer should
    be sufficient. The PC must also have a USB 2.0 or newer port. Although the minimum
    specs are quite low, beware that older and lower speced PCs will struggle and
    may need to have the bandwidth and FFT resolutions reduced to be able to cope.


    Slower PCs and embedded microcontroller based computers like the Raspberry Pi
    can be used with efficient command line software.


    # RTL-SDR COMPATIBLE DONGLES


    Almost any DVB-T dongle with the RTL2832U chip can be used with the RTL-SDR drivers.
    However, **one must pay close attention to the tuner chip used in the dongle.**
    The type of tuner chip used defines the frequency range of the dongle.


    There are two commonly used tuner chips. These are the **R820T/R820T2 and the
    E4000.** There are also the less common FC0013 and FC0012 and the even less common
    R828D and FC2580. In the table below the frequency range of each tuner is shown.


    | Tuner | Min Freq (MHz) | Max Freq (MHz) |

    |---|---|--|'
  merge: -1
  pgno: 18
- img_proc: true
  md: '| R820T/R820T | 24 | 1766 |

    | E4000 | 52 | 2200 |

    | FC0012 | 22 | 948.6 |

    | FC0013 | 22 | 1100 |

    | R828D | 24 | 1766 |

    | FCI FC2580 | 146 - 308 | 438 - 924 |


    The R820T and its improved variant the R820T are the most commonly desired and
    purchased RTL-SDR variants. The R820T is a newer variant of the R820T tuner which
    has better sensitivity compared to the R820T. The E4000 used to be the most popular
    since they were the first available, but Elonics, the manufacturer has closed
    down making these chips rare and expensive. But don''t fret at having missed out
    on cheap E4000 dongles as the R820T/R820T tuners are the better overall performers
    in most cases. Other tuner variants are less common, especially online, but some
    compatible tuner variants can sometimes be found in local stores in the EU. These
    tuners are not as common for a reason - they don''t perform as well as the R820T/R820T''s.


    Based on price and availability, currently we recommend the R820T tuner, unless
    you require the higher frequencies that the E4000 tuner gives. If you don''t need
    these higher frequencies then buy an R820T, as there is no other real advantage
    to the E4000 tuner.


    # TIPS FOR BUYING RTL-SDR


    # DONGLES'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'There are several online places to buy RTL-SDRs. Firstly, we at RTL-SDR.com
    now sell our own RTL-SDR dongles. We sell R820T units with several improvements
    made to the stock units including use of an SMD oscillator and improved component
    tolerances. The improved component tolerances ensure that the device is operating
    optimally according to its design and the SMD oscillator offers lower frequency
    offset and drift. Our main package also includes two telescopic antennas with
    a magnetic antenna base. The magnetic antenna base has higher quality coaxial
    cable compared to other vendors and the telescopic antennas from 7cm to 20cm and
    20cm to 1.5m. As for warranty we will replace any unit that arrives faulty without
    the need for returns. We ship from the USA ensuring fast delivery for our US customers.
    See our Buy RTL-SDR Dongles online page for information on purchasing dongles
    from http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/


    If we are out of stock, or you would like an alternative the second place that
    we recommend is the Noolelec Amazon store. Like us, Noolelec are also RTL-SDR
    experts and can provide installation support over the phone you should need it.
    Noolelec also ship from the United States ensuring fast shipping. When buying
    from Amazon you also get the extra Amazon buyers protection and lenient returns
    policy.


    Dongles are also available on eBay. However, you must be careful when buying on
    eBay as sometimes sellers misrepresent their product. This is especially the case
    with the more expensive E4000 tuner dongles. Some sellers advertise E4000 dongles
    cheaply, when in fact they are actually R820T dongles. Beware of words like “E4000
    Upgrade Version”; in most cases unless the price is very high (over $50 for a
    single unit) you will receive an R820T or FC0012/13. Additionally, when buying
    on eBay most dongles priced cheaply will come directly from China, meaning slow'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'shipping and no returns policy if you receive a faulty dongle. Finally even
    dongles advertised as FC0012/13 also often turn out to be R820Ts.


    Aliexpress.com is also another place to purchase these dongles. However, the same
    warnings as Ebay apply here, plus shipping and processing times tend to be much
    slower.


    # R820T/R820T2 PACKAGES


    The commonly bought R820T/R820T2 dongle comes in many packages. The most common
    and fit for most purposes is the black dongle with MCX connector.


    ![](img/33eab9643eb7fbb4bf9363c117190041_21_0.png)


    There is also the ‘nano’ package available which is very tiny at about 1cm x 1cm
    in size.


    ![](img/33eab9643eb7fbb4bf9363c117190041_21_1.png)


    There are also these white dongles which have PAL (Belling-Lee) connectors.


    ![](img/33eab9643eb7fbb4bf9363c117190041_21_2.png)'
  merge: -1
