    +   3. Open a second terminal window or tab and open wireshark by typing sudo
    wireshark . Because we are running Wireshark as sudo, some errors and warnings
    may pop up, but these can be safely ignored. Note that we are running Wireshark
    as sudo in order to get access to the local loopback interface. Since Airprobe
    dumps data to a UDP port, we must set Wireshark to listen to this.


