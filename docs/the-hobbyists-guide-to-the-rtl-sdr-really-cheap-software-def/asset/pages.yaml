    # ## SSTV


    SSTV is an acronym for Slow Scan TV and is a mode used by amateur radio hobbyists
    to send small calling card images mainly on HF. There are several SSTV formats
    available, with Scottie S1 and Martin S1 being the most common. SSTV is most commonly
    found on or near the following frequencies in MHz.


    +   * 3.730

    * 7.171

    * 14.230 (most popular freq)

    * 21.340

    * 28.680

    * 145.5'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'SSTV can also be found transmitting in some countries be around 245.800 to
    294.075 MHz by Brazilian and Mexican radio pirates who hijack military satellites.
    The pirates hijack a military satellite transponder to transmit SSTV images and
    other signals. More information on this activity can be found here http://www.qsl.net/py4zbz/ec/ec.htm.


    A good free SSTV decoder is MMSV from http://hamsoft.ca/pages/mmsstv.php MMSV
    will automatically detect the SSTV mode used. To decode SSTV using MMSV, use USB
    mode in your SDR receiver and pipe the audio to MMSV using your preferred audio
    piping method.


    Some SSTV audio samples can be found at https://www.youtube.com/watch?v=Ke5UB2HLaZa.


    ![](img/33eab9643eb7fbb4bf9363c117190041_359_0.png)'
