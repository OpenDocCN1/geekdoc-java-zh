    # INSTALLING THE RTL-SDR DRIVERS ON LINUX


    If you want to get started with the RTL-SDR on a Linux system the first step is
    to install the drivers. First update your distribution using the following.


    ```

    sudo apt-get update

    ```


    Now if not installed already, install git, cmake and libusb which is the USB driver
    library required for RTL-SDR.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '```

    sudo apt-get install git

    sudo apt-get install cmake

    sudo apt-get install libusb-dev

    sudo apt-get install libusb-1.0-0.dev

    sudo apt-get install build-essential

    ```


    Now download, compile and install the RTL2832U Osmocom drivers. (Note that we
    also recommend trying out Kenerds drivers which can be cloned using the git link
    https://github.com/keenerd/rtl-sdr.git in place of the osmocom one)


    ```

    git clone git://git.osmocom.org/rtl-sdr.git

    cd rtl-sdr/

    mkdir build

    cd build

    cmake .. -INSTALL_UDEV_RULES=ON

    make

    sudo make install

    sudo ldconfig

    sudo cp ../../rtl-sdr.rules /etc/udev/rules.d/

    ```


    In some cases you may now need to restart Linux.


    Plug in the dongle and then run rtl-test to test the dongle installation. rtl-test
    returns strange characters under the found devices heading, or you get errors
    like the following:


    > Kernel driver is active, or device is claimed by second instance of librtlsdr.

    In the first case, please detach or blacklist the kernel module (dvb_usb_rtl28xxu),
    or enable automatic detaching at compile time.

    usb_claim_interface error -6

    Failed to open device #0.


    This means that the RTL2832U DVB-T TV drivers that are included in newer Linux
    versions are currently installed and activated. Disable them by running the following
    command.


    ```

    sudo rmmod dvb_usb_rtl28xxu

    ```


    Note that running this command will only stop the DVB-T drivers once. When you
    remove and reconnect the dongle or restart Linux, the DVB-T'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'drivers will be reloaded and you’ll need to run this line again.


    For a more permanent solution create a text file “blacklist-dvb_usb_rtl28xx.uconf”
    in /etc/modprobe.d. In that file you put the text black dvb_usb_rtl28xx. An easy
    way to do this is to simply type the following into a terminal:


    ```

    sudo echo "blacklist dvb_usb_rtl28xx" > /etc/modprobe.d/blacklist-dvb_usb_rtl28xx.conf

    ```


    After blacklisting the DVB-T drivers you can unplug and reconnect the dongle and
    it should now default to using the RTL-SDR drivers, though in some cases you may
    need to restart Linux for the blacklist to take effect.


    If you get strange characters showing up when you run rtl_test, it probably indicates
    that you did not properly install the .rules file with the cp ../rtl-sdr.rules
    /etc/udev/rules.d/ command.


    # RTL_FM


    Rtl_fm is a lightweight command line based WBFM/AM/FM/SSB audio receiver for the
    RTL-SDR which runs on both Windows and Linux. It is provided as part of the official
    RTL-SDR release from http://sdr.osmocom.com/trac/wiki/rtl-sdr. For Windows download
    the precompiled debzip release from the above link. For Linux follow the Installing
    RTL-SDR Drivers on Linux guide above. On Linux rtl_fm is installed as part of
    the RTL-SDR driver install shown above. You may also wish to try keerner updated
    versions for Linux and precompiled Windows versions be found at https://github.com/keener/rtl-sdr
    (GitHub for Linux compilation) and http://igg.kmkeen.com/builds/ (Windows binaries).'
