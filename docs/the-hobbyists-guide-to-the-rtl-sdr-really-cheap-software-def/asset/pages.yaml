  md: 'For this tutorial we will show you how to download, build and run a ready made
    GNU Radio program. We will download the GR-RDS program, which allows you to not
    only listen to WFM broadcast radio, but to also decode the RDS signals inside
    of them. To get started follow the instructions below.


    Clone the gr-rds program from Github using the following command.


    ```

    git clone git://git.github.com/bastibl/gr-rds

    ```


    Now build gr-rds with the following.


    ```

    cd gr-rds

    mkdir build

    cd build

    make ..

    make

    sudo make install

    sudo ldconfig

    ```


    Now you can run gr-rds by opening gnuradio-companion rds_rx.grc or running the
    python file as shown below.


    ```

    cd ..

    cd apps

    python rds_rx.py

    ```'
