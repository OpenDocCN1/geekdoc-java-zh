  md: '# PROJECTS FOR THE FUTURE AND


    # BETTER SDR’S


    Here we will talk about some applications that will work on current or future
    higher end devices.


    # HRPT


    HRPT is an acronym for High Resolution Picture Transmission. It is similar to
    APT and LRPT used in the NOAA and Meteor-M2 weather satellites except that the
    images are much higher in resolution. HRPT is also transmitted by some NOAA weather
    satellites but a frequency of around 1700 MHz. To receive this signal you will
    need a fairly advanced setup. It requires a high gain tracking satellite dish
    which is a computerized satellite dish that automatically follows the satellite
    in the sky. You can see the type of antenna required here http://pjm.uhf-satcom.com/twtr/antenna.jpg.


    HRPT requires a bandwidth of about 3 MHz, which is just outside the RTL-SDR stable
    maximum bandwidth. Newer SDRs like Airspy or the HackRF/BladeRF should be able
    to receive this problem. Nevertheless, it seems as if at least one RTL-SDR user
    has been successful in receiving HRPT images. If you are an advanced user this
    GNURadio code allows a RTL-SDR to receive HRPT images https://github.com/poes-weather/gr-poes-weather/blob/master/apps/pw_rtlsdr_rx_noaa_hrpt.py.


    More information at: http://www.satsignal.eu/software/hrpt.htm


    # HD RADIO


    In the USA use WFM broadcast radio station signals are surrounded by two digital
    data signals. They look like two rectangles that surround the'
  merge: -1
  pgno: 506
- img_proc: true
  md: 'WFM signal and they carry the same audio but in a digital format. This is known
    as HD Radio and is a proprietary protocol that is only decodable by special radios.
    In the future someone may discover a way to decode these signals, or the owners
    of the HD Radio protocol may release information about the protocol allowing people
    to easily decode it.


    # SOFTWARE DVB-T DECODING


    The RTL-SDR doesn''t provide enough bandwidth for decoding DVB-T signals when
    in SDR mode. Future dongles with larger bandwidths may be able to decode DVB-T
    TV completely in software.


    # DECT CORDLESS PHONES


    Modern cordless phones transmit in the 1.9 GHz band and higher using a protocol
    called DECT or Digital Enhanced Cordless Telecommunications. There is currently
    a GNU decoder under development which may allow decoding of this protocol in the
    future https://www.cgran.org/wiki/GR_DECT.


    # OTHER SOFTWARE NOT MENTIONED YET


    In this section we briefly mention a few software programs for special RTL-SDR
    projects that are not mentioned in the above tutorials but are worth checking
    out find that you have an interest in them.


    # RTL-AIRBAND


    This is a command line program for Windows, Linux and the Raspberry Pi that is
    intended for airband reception and streaming live communications to an online
    aggregation service like liveatc.net. It can simultaneously listen to'
  merge: -1
  pgno: 507
- img_proc: true
  md: 'up to 8 AM channels per dongle and can use multiple dongles to efficiently
    cover a wider bandwidth.


    # WEBSDR


    WebISR is a popular online streaming SDR service. People who have SDRs can set
    up the WebISR server software which allows for many online users to publicly listen
    to their SDR in real time. It is compatible with the RTL-SDR. The server software
    is free, but not publicly available. You must first email the owner of WebCDR
    and request it. Examples of WebCDR radios and more information can be found at
    http://www.websdr.org/.


    # RTL ENTROPY


    Radio noise received by a RTL-SDR dongle can be used as a high quality entropy
    source in Linux with a program called RTL-Entropy. Computers and their algorithms
    can not by themselves true randomness. By using a better source of random numbers,
    such as from the RTL-SDR receiving noise, better security can be obtained. RTL-Entropy
    is available from https://github.com/pwarren/rtl-entropy. A good tutorial on setting
    up RTL-Entropy as an entropy source on Linux can be found at http://blog.cros13.net/2014/08/cheap-entropy-using-rtl-sdr-as.html.


    # SWSCAN


    This is a Linux based program which can be used to scan and listen to shortwave
    stations. as well as their broadcast schedules and it will even show you the stations
    power level and distance you are from the transmitter. Swscan is based on GNU
    Radio 3.7, so you will need to have that installed first. Information about SWScan
    can be found at'
