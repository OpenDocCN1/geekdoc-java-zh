  md: '19.


    # METEOR-M RUSSIAN LRPT

    WEATHER SATELLITE GUIDE


    ![](img/33eab9643eb7fbb4bf9363c117190041_217_0.png)


    # INTRODUCTION TO METEOR-M


    The Meteor-M N2 is a polar orbiting Russian weather satellite that was launched
    on July 8, 2014. Its main missions are weather forecasting, climate change monitoring,
    sea water monitoring/forecasting and space weather analysis/prediction.


    The satellite is currently active with a Low Resolution Picture Transmission (LRPT)
    signal which broadcasts live weather satellite images, similar to the APT images
    produced by the NOAA satellites. LRPT images are however much better as they are
    transmitted as a digital signal with an image resolution 12 times greater than
    the aging analogue NOAA APT signals.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'Compare the image of New Zealand shown at the beginning of this section to
    the one shown in the NOAA APT tutorial section above this one to see the difference
    in resolution. Some example Meteor weather images can be found at http://meteor.robonica.ru/septembers-gallery/
    and the satellite can be tracked in Orbitron or online at http://www.satview.org/?sat_id=40069U.
    During the day weather image is generated using visible light and at night it
    is generated using infrared.


    The RTL-SDR and other SDRs like the Fuclobe with some free software can be used
    to receive and decode these images. LRPT images from the Meteor-M N2 are transmitted
    with a right hand circularly polarized at around 137.1 MHz, so any satellite antenna
    such as a turnstile or quadrifilar helix is commonly used with the NOAA weather
    satellites. See the antenna guide section for more information.

    As LRPT is a digital signal, reception strength must be good, so ensure you are
    using a good satellite antenna placed high with an unobstructed view of the sky.
    In some poor reception situations an LNA at the antenna and some bandpass or bandstop
    filters to remove interference may also be needed.


    # RECEIVING METEOSAT WEATHER SATELLITE IMAGES: WINDOWS TUTORIAL


    In order to receive these images on Windows you will first need to download and
    install the following software.


    +   - Audacity. A free audio editing software package. Download from http://audacity.sourceforge.net/.

    - LRPT BPSK/QPSK DeWAVulator. Download from https://www.dropbox.com/s/q1fjyitpa3j14o/software.zip
    (Mirror:'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'http://bit.ly/Yyicop. Extract the LRPT.exe file, the other files in the zip
    archive are not required.


    +   LRPTOOfflineDecoder. Download the latest version from http://meteor.robonuka/soft/
    (Mirror of 2014.09.01.0006 version: http://bit.ly/1IUKS4Y).


    Since this satellite is quite new, the decoding process is not yet as refined
    with the NOAA APT satellites. The steps below outline the process.


    +   1. Open SDR# and in the config menu change the sample rate of the RTL-SDR
    to 0.9 Msps.


    +   2. When the Meteor-M2 is about to pass over (use Orbitron to determine when),
    tune to 137.1 MHz in SDR#. Make sure “Correct IQ” is set and if you are using
    an E4000 or FC0012/13 based dongle ensure that offset tuning is enabled.


    +   3. Once the signal appears, first make sure it is centred as much as possible
    in the waterfall. Then record an 8-bit PCM baseband file using the SDR# Recording
    plugin, which is included in the standard SDR# install by default.


    ![](img/33eab9643eb7fbb4bf9363c117190041_219_0.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: '4. After the satellite has passed and the signal has died down, stop the recording
    and then open the resulting .wav file in Audacity (Remember that SDR# saves its
    recordings in the same folder as the executable file).


    5. Change the sample rate to 130000 Hz in the low left hand corner of Audacity.


    ![](img/33eab9643eb7fbb4bf9363c117190041_220_0.png)


    6. Export the resampled file as a new wav file by going to **File>Export**. Then
    choose the format as WAV (Microsoft) signed 16 bit PCM. Save the new wav file
    to a convenient folder.


    7. Now open the LRPT.exe program and load in the resampled .wav file that you
    have just exported from Audacity by clicking the change button in the Input Filename
    box on the left of the program.


    ![](img/33eab9643eb7fbb4bf9363c117190041_220_1.png)


    8. Ensure that Swap IQ is selected.


    ![](img/33eab9643eb7fbb4bf9363c117190041_220_2.png)


    9. Now manually move the slider in the middle of the window to the point at which
    signal was the strongest, which will probably be somewhere near the centre. Press
    the start button in the lower right hand corner.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_221_0.png)


    11. If it looks like an X or a square, then changing the symbol rate from 72000
    to 8000. If you see the four clusters of dots, then unfortunately the satellite
    is in 80K mode which can not currently be decoded.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_222_0.png)


    +   12. If you see the four clusters of dots in the constellation diagram at some
    point you are okay to proceed. Bring the slider back to the start position.


    +   13. Choose the save location of the decoded RAW output file by clicking the
    Change button next to the text Output Filename on the left of the program. By
    default the output file will be saved as C:\Meteor_001.raw


    | Change Output Filename |

    | /Meteor_001.raw |


    +   14. Start the decoding process by clicking on the Start button in the lower
    right corner of the program. Keep an eye on the slider and wait until it has reached
    the end, then press stop. The program will not stop by itself, so you must remember
    to click the stop button. After stopping it program using the quit button.


    +   15. Now to actually extract the image from the processed file we need to use
    the LRPToffLineDecode.exe decoder software. Open the decoded RAW file from LRPT.exe
    in LRPTToffLineDecode.exe by'
  merge: -1
