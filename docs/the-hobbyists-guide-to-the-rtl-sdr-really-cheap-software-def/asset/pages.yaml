  md: '# PREFACE


    In February 2012 the first FM radio signal was received with an RTL2832U RTL-SDR
    dongle using custom SDR drivers. Since tens of thousands of hams, security researchers,
    hackers, makers, tinkerers, students and electronics enthusiasts have purchased
    RTL-SDR dongles to use as a very cheap software radio.


    This book is intended to be a comprehensive guide for hobbyists on the use of
    the RTL-SDR dongle. The book consists mainly of tips to get the best out of your
    RTL-SDR and tutorials for some of the various interesting projects that can be
    done using the dongle.


    The information and tutorials in this book are up to date at the time of writing.
    Because SDR technology and its supporting software is evolving at such a fast
    pace, we cannot guarantee that they will work without the need for some tweaking
    in the future. We will do our best to keep this book updated and will aim for
    an update schedule of every 3 - 4 months. To receive the updates you will need
    to manually contact Kindle support by email and request the update. We cannot
    push updates automatically as this would disrupt peoples bookmarks, highlights
    and notes. You can see the edition the book is up to on Amazon sales page.


    If you discover any mistakes, missing information or just have any feedback on
    the book please feel free to contact me at rtlsdrblog@gmail.com.


    If you are unsatisfied with this book in any way, remember that it can always
    be refunded through Amazon within 7 days of the purchase. But if you enjoy this
    book we would very much appreciate it if you were to leave us good review on the
    Amazon store page.'
  merge: -1
