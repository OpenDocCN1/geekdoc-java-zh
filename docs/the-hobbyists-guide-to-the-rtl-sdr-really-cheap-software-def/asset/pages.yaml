- img_proc: true
  md: '# UNITY GAIN


    Recommended Default Setting: OFF


    Should normally be unchecked as it sets the audio gain to 0 dB.


    # FILTER AUDIO


    Recommended Default Setting: OFF


    Improves voice signals by low pass filtering the audio, removing high pitched
    hiss and interference. Turn this off if decoding digital signals.


    # AGC (AUTOMATIC GAIN CONTROL) TAB


    | | |

    |---|---|

    |[ ] Use AGC | [ ] Use Hang |

    | Threshold (dB) | -50 |

    | Decay (ms) | 100 |

    | Slope (dB) | 0 |


    Note that in some modes the AGC tab will be greyed out.


    # USE AGC


    Recommended Default Setting: ON


    Turns on the automatic gain control. The AGC will attempt to control the audio
    volume level so that loud sounds are not too loud and quiet sounds are not too
    quiet. The default settings work well for voice audio signals. It is especially
    useful to turn this on when listening to AM/USB/LSB signals as strong signals
    in these modes may sound otherwise.


    # USE HANG / THRESHOLD / DECAY / SLOPE


    Recommended Default Setting: -50, 100, 0


    Allows you to modify the default AGC behaviour, though in most cases the defaults
    are fine.'
