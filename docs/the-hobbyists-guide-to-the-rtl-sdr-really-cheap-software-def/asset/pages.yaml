    |---|---|---|---|---||

    | | | | | | Remove Connection |

    Properties

    [ ] Serial [ ] Network

    Protocol [ ] TCP [ ] UDP [ ] GPSD

    Address127.0.0.1

    DataPort 10110

    Priority [ ] [ ] Control checksum Input filtering


    +   4. Now back in AISMon under Output Options, check UDP Output, and enter 127.0.0.1:10110
    into the IP:Port box. (You will need to'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'stop monitoring first to access these options if monitoring is currently active).


    +   5. If you are running SDR-Radio and have two audio outputs for each AIS channel,
    you can open two AISMon instances where each one uses a separate audio device.
    Set the UDP output port of the second AISMon instance to 10120 or whatever port
    you have chosen to use OpenCPN.


    ![](img/33eab9643eb7fbb4bf9363c117190041_259_0.png)


    +   6. You can now click Start Monitoring again. If everything has been set up
    correctly, ships will begin to appear in the OpenCPN map.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_260_0.png)


    If you want more accurate maps or charts you will need to follow the instructions
    on the OpenCPN website for downloading charts for your particular location.


    # AIS DISPATCHER + AISMON TUTORIAL


    Another simple and easy to use free program for plotting ships with AISMon is
    AIS Dispatcher. Download it from http://www.aishub.net/aisdispatcher-description.html.
    It is available for Windows, Linux and MacOS. After downloading and extracting
