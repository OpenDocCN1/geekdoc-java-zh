    (Australia)

    Telecommand 1: Test

    Telecommand 2: No information

    No control by check sum.

    Date and time of decoding: 09/04/2014 10:29:32


    #  NAVTEX


    Navtex (Navigational Telex) is a system used by mariners on HF for sending text
    messages that are directly printed onto paper using a Navtex machine. The messages
    usually contain information about maritime weather. Navtex use USB mode and is
    typically transmitted at 518 kHz and 490 kHz. An example Navtex message might
    look like:


    ...PLEASE REFER TO COASTAL WATERS FORECASTS (CWF) AVAILABLE

    THRU NOAAWX RADIO AND OTHER MEANS FOR DETAILED COASTAL WATERS...

    SYNOPSIS FOR MID ATLC WATERS...A LOW PRES AREA WILL DEVELOP

    AND

    PASS JUST N OF THE WATERS TONIGHT AND THEN MOVE NE LATER MON

    AND

    MON NIGHT WHILE STRENGTHENING. STRONG HIGH PRES WILL BUILD E

    ACROSS THE NRN WATERS MON NIGHT THRUUEUE...AND PASS NE

    OF THE AREA WED. A COASTAL FRONT WILL FORM OFF THE CAROLINA

    COAST TUE NIGHT. LOW PRES WILL DEVELOP AND MOVE NE ALONG THE

    CAROLINA COAST LATE WED.


    # SITOR


    SITOR (Simplex Teype Over Radio) is a system used by mariners for sending text
    messages over HF radio. There is SITOR-A and SITOR-B.

    SITOR-A is used for point to point communications and SITOR-B is used for broadcasting.
    The difference between the two is that SITOR-A will request a repeat of the message
    if it contains errors, whereas SITOR-B uses forward error correction to correct
    errors. SITOR-B is also the protocol used by Navtex.


    #  DIFFERENTIAL GPS (DGPS)'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'GPS accuracy used is purposely degraded by the US military to prevent enemies
    from using it against them. To get around this limitation, differential GPS (DGPS)
    was used by GPS users who needed the greater accuracy, such as maritime users.
    It works by measuring the difference between the GPS location and a known location
    and then broadcasting the differences to the receivers. DGPS is still used these
    days to further increase GPS accuracy. The accuracy of regular GPS is about 15m,
    with DGPS it can be as good as 10cm. GPS is usually transmitted at 283.5 - 325.0
    kHz around waterways and can be decoded using MultiPSK.


    An example of a typical DGPS reception on MultiPSK is as follows.


    09/04/2014 12:55:26

    Message type : 9 (GPS partial correction set)

    Station number : 741 (Dziwinow POL 283.5 kHz TXID 481 100kbps/Chejin Dan Lt Kor
    292.0 KHz TXID 670 200bps)

    Z-count : 5973 (59 min 43.8 s)

    Sequence count : 5

    Number of words : 5

    Health : 6 (Transmission not monitored)

    Sat. ID|UD|Range rate corr.|IOD|CRC

    22 0|<=1m| -14.58 m | -0.006 m/s |25 |OK

    31 0|<=1m| -14.20 m | -0.006 m/s |30 |OK

    27 0|<=1m| -33.34 m | 0.020 m/s |41 |OK


