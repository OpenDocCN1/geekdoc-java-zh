- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_284_0.png)


    4. Make sure that “dabstick” is selected on the left-most pull down menu.


    5. Choose the BAND and DAB spectrum block designator in the two right-most pull
    down boxes on the left of the screen. In the screenshot above we used BAND III
    and the block 13F. These settings will be different for each country. Check out
