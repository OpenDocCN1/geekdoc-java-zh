  md: 'If you want the ground symbols such as Waypoints, NavAid and VORs to be displayed
    in the Navigation Display window, download the X-Plane 9.00-9.70 data from http://data.x-plane.com/get_data.html.
    Extract the data to a folder and in XHSI set the AptNav Resources directory to
