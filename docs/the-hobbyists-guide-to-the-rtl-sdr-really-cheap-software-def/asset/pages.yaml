    # 2) UPCONVERTERS


    Upverters move LF/MF/HF frequencies ''up'' into the receivable range of the RTL-SDR.
    An upconverter is connected to your antenna before the RTL-SDR dongle and simply
    increases the frequency of all received signals by about 100 MHz. Good upverters
    for HF use will have a low pass filter included helping reduce interference from
    signals above 30 MHz.


    The amount that an upconverter converts can matter. Some upverters use a 100 MHz
    local oscillator which would add 100 MHz to all frequencies. However, some users
    have complained that the 100 MHz puts some popular ham bands directly on top of
    broadcast FM stations. Although these FM stations shouldn''t appear after the
    upconversion, sometimes images can still show up. Theoretically, the low pass
    filter used in most upverters should prevent any interference from FM bands, but
    some very strong stations can overcome the filter. Most upverters now use a local
    oscillator frequency of 125 MHz, which avoids FM broadcast stations.


    There are now several commercial upverters available. One high quality and very
    popular upconverter that we recommend is the Noelec Ham-it-up. This upconverter
    is based on an opensource design and it is of very high quality production and
    decent price. It increases the frequency of all signals'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'by 125 MHz, and has a low pass filter installed. See www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/
    for information on purchasing the Ham-it-out.


    Other popular choices include the CT1FFU upconverter http://www.ct1ffu.com/site/index.php?option=com_content&view=article&id=178&ItemID=104
    http://janelectronics.com/index.php?route=product/product&product_id=97. One RTL-SDR
    blogger has done a big writeup on all the upverters that can be used with the
    RTL-SDR http://blog.kf7ze.net/2012/09/14/round-up-of-rtlsdr-upconverter-choices.


    # HOW TO USE AN SDR RECEIVER WITH AN UPCONVERTER


    To use an SDR receiver SDR# with an upconverter you will need to tune to your
    desired signal + the upverters local oscillator frequency. For example, the ham-it-out
    upconverter has a local oscillator frequency of 125 MHz, so to see a signal at
    6 MHz you would tune 125 MHz + 6 MHz = 131 MHz.


    If you don''t want to always have to do the math, you can set an offset in the
    software receiver. The offset setting will allow you to tune directly to your
    desired frequency. In SDR# you can set the ''Shift'' value to -125,000,000 for
    an upconverter with a 125 MHz oscillator (don''t forget the minus sign).


    ```

    ✔ Shift -125,000,000

    ```


    # 3) EXPERIMENTAL DRIVERS


    There are experimental drivers by programmer Oliver Jowett available that will
    allow the R820T tuner to tune all the way down to around 1 MHz. This driver is
    experimental and is still being updated. In the future it may be included in the
    standard RTL-SDR driver. The driver can be downloaded from Oliver Jowett''s experimental
    GitHub repository'
