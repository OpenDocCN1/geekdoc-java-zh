  md: '# WEATHER/TEMPERATURE SENSOR

    DECODING GUIDE


    Many weather and temperature sensors transmit on the 433 MHz ISM band. A Linux
    command line program known as rtl_433 can be used to decode some of these transmissions.
    Rtl_433 can be downloaded from https://github.com/merbanan/rtl_433.


    rtl_433 can be installed with the following procedure.


    ```

    git clone https://github.com/merbanan/rtl_433

    cd rtl_433/

    mkdir build

    cd build

    cmake ..

    sudo make install

    ```


    It can then be run with the following where PPM_OFFSET, FREQ and GAIN should be
    replaced by the required values.


    rtl_433 -p PPM_OFFSET -f FREQ -g GAIN


    If there is a sensor transmitting on a format that rtl_433 understands you will
    be able to see sensor output data. Currently the Rubicon Temperature Sensor, Prologue
    Temperature Sensor, Silvercrest Remote Control, ELV M 1000, ELV WS 2000, Waveman
    Switch Transmitter, Steffen Switch Transmitter and Acurite 5n1 Weather Station
    sensors are supported. If your sensor is not supported then you can look through
    the many forks of rtl_433 on Github for a fork that supports your sensor.


    Rtl_433 can also run in an analysis mode by using the -a flag. In this mode rtl_433
    will output raw binary data for any data that it recognizes. Using'
  merge: -1
  pgno: 472
- img_proc: true
  md: 'this raw binary data you could then reverse engineer the protocol for your
    device and decode the data.


    There are also alternative rtl_433 decoders which are able to decode different
    sensors. There is a decoder for Oregon Scientific v1 sensors available at https://github.com/kevinmehall/rtl-433m-sensor
    and one for v2.1 sensors at https://github.com/jaycedowell/rtl_osv21. Another
    Oregon Scientific decoder can be found here https://github.com/magellanh/rtl-wx.
    Here is another decoder that works with the Temperature Sensor S 300 IA, Temperature/Hygro
    sensor S 300 TH und ASH 2200 and Temperature/Hygro/Wind/Rain (“Kombi”) sensor
    KS 200/300 https://github.com/skaringa/weather-sdr-decode.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# DECODING SMART POWER METERS


    Smart meters are RF enabled electricity/gas/water meters which allow meter reader
    personnel to collect consumption data simply by standing outside the house. Typically,
    this information is broadcast in the 902 - 928 MHz ISM band.


    A Windows and Linux program called rtl_amr can be used to decode and monitor this
    information being sent. rtl_amr should be compatible with any meter that uses
    the Encoder Receiver Transmitter (ERT) protocol. Here is a list of potentially
    compatible ERT meters that the author of rtl_amr has compiled [https://github.com/bemasher/rtlamr/blob/master/meters.md].
    The ERT protocol is commonly used in the USA.


    rtl_amr can be obtained from [https://github.com/bemasher/rtlamr]. It will require
    installation of the Go language first. To install the Go language and rtl_amr
    use the following instructions.


    +   1. Download the latest version of Go from [link-1]. Make sure you get the
    correct version for your OS, 32-bit or 64-bit.

    2. Extract the contents of the tar file to the /usr/local folder.


    3. Add the following lines to the ~/.bashrc text file.


    ```

    sudo tar -C /usr/local -xzf go1.3.1.linux-amd64.tar.gz


    export GOROOT=/usr/local/go

    export GOPATH=$HOME/go

    export PATH=$PATH:$GOROOT/bin:$GOPATH/bin

    ```


    +   4. In a terminal type the following to install rtl_amr.


    go get github.com/bemasher/rtlamr'
  merge: -1
  pgno: 474
- img_proc: true
  md: '5. Now rtlamar will have been downloaded in the $HOME/go/bin./rt folder.

    6. Rtlcam can be used by running rtl_tcp in one terminal window and rtl_amr in
    another.


    If you have an Efergy Energy Meter a Linux program called rtl-sdr-efergy can be
    used to decode it https://github.com/jdesbonnet/rtl-sdr-efergy. Energy Count 3000
    meters can be decoded with the Linux program at https://github.com/EmbedME/ec3k_decoder.


    To install rtl-sdr-efergy using the following commands at a Linux terminal.


    ```

    git clone https://github.com/jdesbonnet/rtl-sdr-efergy

    cd rtl-sdr-efergy

    chmod a+x build

    ./build

    ```


    Then run it using the following, making sure to set the frequency appropriately.


    ```

    rtl_fm -f 433.55M -W 200000 -r 96000 - | | ./elite-decode -r 96000 > electricity.dat

    ```


    EC3K-Decoder can be installed with the following.


    ```

    git clone https://github.com/EmbedME/ec3k_decoder

    cd ec3k_decoder/

    gcc ec3k_decoder.c -o ec3k_decoder

    ```


    Then it can be run with the following command, making sure to change the frequency
    when necessary.


    ```

    sudo rtl_fm -f 868402000 -s 200000 -A fast - | ./ec3k_decoder

    ```'
  merge: -1
