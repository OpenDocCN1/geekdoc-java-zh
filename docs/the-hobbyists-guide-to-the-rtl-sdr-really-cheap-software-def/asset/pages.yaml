- img_proc: true
  md: '“sdrsharp”. The command prompt will automatically close when it is done.


    ![](img/33eab9643eb7fbb4bf9363c117190041_28_0.png)


    +   5. Plug in your dongle and do not install any of the software that it came
    with (if any), but ensure you wait for the plug and play popup that tries to install
    it to finish. If necessary, uninstall DVB-T software drivers you''ve installed
    from the CD that some dongles come with.


    +   6. Open the newly created sdrsharp folder and find the file zadig.exe. Right
    click this file and select “Run as administrator” if using Windows Vista/7. If
    you are using Windows XP, download the XP version of Zadig from http://zadig.akeo.ie/.


    +   7. In Zadig, go to **Options -> List All Devices** and make sure this option
    is checked.'
