    +   1. Download and install OpenCPN from http://opencpn.org/ocpn/.

    2. Open OpenCPN and then click on the Options and go to the Connections tab.

    3. Under Data Connections, click on Add Connection and add a Network UDP connection.
    Use an address of 127.0.0.1 and a port of 10110. Click Apply and OK. If you are
    using SDR-Radio and using two audio outputs, add a second UDP connection identical
    to'
  merge: -1
