    at 144 MHz and 5m high


    **Name:** Discone


    **Polarization:** Vertical


    **Broadband:** Yes


    **Uses:** General purpose antenna good for almost all frequencies.


    The discone is typically recommended as the overall useful antenna for the RTL-SDR.
    This is because a discone has a wide receivable bandwidth and can receive signals
    omnidirectionally with good gain/directivity towards the horizon. The larger the
    discone, the lower the frequency it can receive, however some discone designs
    opt to place a whip on top to lower the SWR for lower frequencies.


    Commercially constructed discones can be found cheaply on Amazon (see our buy
    RTL-SDR page at http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/) for around
    $50 USD. Most local ham radio stores should also stock them. Higher priced models
    will be made of better weather proof materials or will be larger and able to receive
    lower frequencies.


    In the radiation pattern images below we show the patterns for a discone rated
    from 125 - 1300 MHz over various frequencies. The results show that the radiation
    pattern can vary significantly as the frequency changes. At higher frequencies
    the pattern is significant ‘lobeing’, which just means that the radiation pattern
    becomes spongy or non smooth. In all cases, most of the radiation pattern is directed
    towards the horizon where most signals of interest originate from, but notice
    that as the frequency rises more and more radiation gets directed towards the
    sky, so discones tend to perform poorly at higher frequencies.'
