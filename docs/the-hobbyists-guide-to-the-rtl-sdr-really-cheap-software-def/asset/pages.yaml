  md: '# PANADAPTER GUIDE


    A panapter is a device that connects to a traditional analogue hardware radio
    and displays a visualization of the spectrum through a RF spectrum and waterfall
    display. Most RTL-SDR software shows the RF spectrum and waterfall by default
    so the RTL-SDR can be used as a super cheap panadapter. This can give you the
    great performance of a dedicated hardware radio and the visual RF display common
    to software defined radios.


    Creating an RTL-SDR panadapter is radio hardware dependant as you will need to
    discover a way to connect the RTL-SDR antenna input into the first IF of your
    hardware radio. Once the IF output is connected to the antenna input, you simply
    tune to the IF frequency using the RTL-SDR to visualize the signals on the waterfall.


    Some older or cheaper radios may need a little hardware hacking to access this
    IF output and some newer radio will have the IF as an available output on the
    back of the radio. Most hardware radios will also allow you to control it via
    GUI software Omnirig HDR SDR if you have a control cable.


    Here is an excellent tutorial showing the steps needed to set up a RTL-SDR panadapter
    for the ICOM IC-7600 radio http://www.ab4oj.com/icom/ic7600/we1x_rtl_sdr_0.pdf.
    The tutorial should also be valid for other radios with an easy IF output.


    A good tutorial on doing this for the Yaesu FT-857 can be found on this YouTube
    video https://www.youtube.com/watch?v=tshXGarnBQ#t=164. Another video showing
    the performance of the FT-857 with RTL-SDR'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'panadapter can be found here https://www.youtube.com/watch?v=wqcGACGPtrM. An
