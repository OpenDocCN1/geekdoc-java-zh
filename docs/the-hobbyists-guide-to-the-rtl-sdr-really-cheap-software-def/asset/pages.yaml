    # MODECOCO2


    ModesDeco is a Windows/OSX command line based ADS-B decoder. It can receive Mode
    S and Mode A/C simultaneously and can interface with Basestation and other graphical
    display software directly. It comes with a very nice web base GUI that can display
    maps of flights, and ADS-B stats as well. Modesdeco2 doesn''t have an official
    download or web page, but you can download the latest version from the last page
    on the forum at http://radarspotting.com/forum/index.php?topic,2978.0.html. Note
    that you may need to install the Visual C++ 2012 Redistributable from http://www.microsoft.com/en-us/download/details.aspx?id=30679,
    make sure you download the x86 version of the redistributable and not the x64
    version.


    To start decoding modesdeco2, open a command line prompt from Windows or Linux,
    navigate to the directory you extracted modesdeco2 to and run the program using
    the following command.


    ```

    modesdeco2.exe --gain 49.6 --web8088

    ```'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'After running this command you can then browse to http://127.0.0.1:8088 in
    your web browser to open the web interface.


    ![](img/33eab9643eb7fbb4bf9363c117190041_176_0.png)


    If you don''t want to use the web interface, and instead want to feed the data
    to another program as basestation you can use the following command where lat:lon
    is an optional setting for your current receiver station latitude and longitude.


    ```

    modeseco2.exe --gain 49.6 --net 10001 --sbs10001 --location lat:lon

    ```


    This mode outputs data in the base station format. To output in other formats
    such as AVR are usable by other graphical radar displays like Virtual Radar Server,
    use the following command.


    ```

    modeseco2 --gain 49.6 --sbs10001 10001 --avr 44044 --msg 30003 --location lat:lon
    --filter-nocountry --rbs --verbose

    ```'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'If you want modesdeco2 to be able to display flight extra information such
    as registration numbers, models, airlines, flight routes, airplane images, silheutes
    you''ll need to supply the appropriate commands to the input command.


    To get the registration numbers, models, airline information, silhouettes you
    can use a ready made bas.sqb file which can be downloaded from http://www.sbs-resources.com/download/index.html.
    Download and install this program, and the basestation.sqb file will be extracted
    to C:\SBS-resources\Files\Registration. The silhouettes will be stored in C:\SBS-resources\Files\SilhouettesLogos.
    Use the modesdeco2 flags --db and --silhouettes to specify these paths. If you
    want to see the commercial flight routes on the map, then you can download a flightroute.sqb
    data base from this Yahoo! https://groups.yahoo.com/neo/groups/PP-logs-and-routes/files,
    save the flightroute.sqb file into a folder, and let modesdeco2 know about its
    location with the --frdb flag.


    ```

    `modesdeco2.exe --gain 49.6 --web0088 --db c:\SBS-resources\Files\Registration
    --silhouettes c:\SBS-resources\Files\SilhouettesLogos --frdb c:\flightroute.sqb`

    ```


    COCOA1090 (MAC OSX)


    This is a ADS-B decoder writer for Mac OS X. It can be downloaded from http://www.blackcatsystems.com/software/cocoa1090.html.
    It requires use of rtl_tcp.


    GR-AIR-MODES (GNU RADIO)


    Gr-air-modes is a GNU Radio program for decoding ADS-B. The gr-air-modes project
    website is at https://github.com/bistromath/gr-air-modes. Gr-air-modes can output
    to a .k file and then the aircraft can be viewed in real time 3D in Google Earth.


    MODESMIXER'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'Modesmixer is a little different to the other decoders in that it is not actually
    a decoder. Rather it is a command line tool that can be used to combine the outputs
    from multiple decoders and then output a single combined stream. This is useful
    if you have multiple computers running ADS-B decoding software and would like
    to combine the results. Modesmixer can be downloaded from a forum post at http://radarspotting.com/forum/index.php/topic,2978.msg15240.html#msg15240.
    ModesMix can mix data from multiple ADS-B decoders, such as from a mix from dump1090,
    RTL1090 and ADS-B.


    For example, to combine two data sources together, one from a remote PC on your
    network and from your local PC, you''d specify the two IP addresses of the ADS-B
    data sources and specify the output data format you would like to use. See the
    example below. The full list of arguments and output formats available from Modesmixer
    can be found using modesmixer2 -h at the command line. If you want to use the
    web interface like modesdeco2 you can also supply the --web flag.


    ```

    modesmixer2 --inConnect 192.168.1.127:30005 --inConnect 127.0.0.1:30005 --outserver
    beast:31001 -

    --web 8088

    ```


    DUMP978

    dump978 is identical to dump1090, except that instead of decoding ADS-B at 1090
    MHz, it decodes the similar UAT protocol at 978 MHz. UAT is used in the USA commonly
    by small aircraft which find it cheaper and more useful to operate. dump978 is
    current in it''s experimental beta release stages so it''s performance may not
    be perfect. It can be downloaded from https://github.com/mutability/dump978.


    # GRAPHICAL RADAR DISPLAY SOFTWARE FOR WINDOWS


    Most of the decoders mentioned above send the decoded ADS-B data through a local
    (or public if desired) network connection. There are a few'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'software options available for receiving this network data and displaying it.

    Here we show four of the most popular, three are free, and one is paid with a

    trial option. To use these programs you will need to be running your ADS-B

    decoder at the same time as these programs.


    # VIRTUAL RADAR SERVER (WINDOWS)


    Virtual Radar Server (VRS) is Windows and Linux Mono based free software

    program which displays plane positions in a web browser using Google

    maps. The map can then be shared with other people over the internet if

    desesired. Virtual Radar Server can be downloaded from

    http://www.virtualradarserver.com/.


    If you want to view other public Virtual Radar Servers, search Google using

    the string inurl:VirtualRadar/GoogleMap.htm" to find many public Virtual

    Radar Servers.


    +   1. First download and install VRS from its website. Then open VRS

    from the start menu.

    2. Go to Tools->Options.

    3. Click on Receivers, then New. The properties of this receiver will

    show.

    4. Name your Receiver RTL-SDR under General Settings.

    5. Change the data source to “AVR or Beast Raw Feed.\n6. Keep the IP Address at
    127.0.0.1 (unless you are using a remote

    server), but change the port number to 47806 if using ADSB#, or

    31001 if using RTL1090. (Or set the port to a custom value in

    ADSB#). The following picture shows the settings you should be

    using if using RTL1090.'
  merge: -1
  pgno: 179
- img_proc: true
