  md: '2. You should see some ACARS signals on the RF spectrum and waterfall. Adjust
    the RF gain settings so that the ACARS signal is strong and free of out of band
    interference.


    3. Adjust the tuned bandwidth of your receiver to around 5-10 kHz, so that the
    bandwidth just covers the entire ACARS signal.


    4. Set the receiver mode to **AM**, turn off squelch and turn off any noise reduction
    filters. Using audio AGC may or may not work well, you will need to experiment
    with what works best. If you are looking to combine multiple ACARS channels on
    the same audio channel with multiple VFO''s it may be best to enable the squelch.


    At this point you should be able to see some ACARS signals appearing in the spectrum.
    ACARS signals come in bursts, and will look something like the waterfall image
    shown below. If you are outputting the audio to speakers you will also hear a
