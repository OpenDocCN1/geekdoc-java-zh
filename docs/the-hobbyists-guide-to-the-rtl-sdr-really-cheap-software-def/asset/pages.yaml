- img_proc: true
  md: 'are some AIS Yagi construction webpages at http://www.vk6fh.com/vk6fh/162mhzyagi.htm
    and http://www.graffdxradiothings.blogspot.com/2012/03/on-air-home-made-realization-ais.html.
    They are also great for reaching a distant radio tower or tracking a distant balloon.


    It is also possible to build circularly polarized Yagis for satellite reception.
    Since Yagis are so directional, you will need to either track the satellite by
    hand as it passes over head or build an automated tracking system. It is usually
    not too difficult to track a ~137 MHz satellite by hand when combined with an
    augmented reality smartphone app that shows where the satellite currently is.
    Satellites at higher frequencies may need more accurate tracking with motorized
    mechanisms. Circularly polarized yagi antennas are also called Crossed-Yagi antennas.


    The example antenna in the above images and graphs below is a high gain TV antenna
    designed for 475 MHz. From the SWR plot we can see that at its design frequency
