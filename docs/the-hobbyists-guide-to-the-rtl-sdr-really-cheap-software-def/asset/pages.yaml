  md: '4. Now in the GNU Radio file you will need to adjust the center and Offset2
    frequencies for the TETRA signals you wish to monitor. Leave Offset1 with the
    500 kHz value alone and calculate Offset2 for the second signal. To do this you
    will need to calculate the frequency distance between the center frequency and
    the second TETRA channel. For example if you have a TETRA signal at 858.061.500
    MHz and 858.086500 MHz, you''d calculate the center frequency as 858.06515 - .500
    MHz = 857.56115 MHz, and the second offset will be calculated as 858.086500 MHz
    - 857.56115 MHz = .525 MHz = 525000.


    5. Edit the “Center Freq” and “Offset2” labels to the values you calculated in
    the previous step.


    Instructions for setting up a four, five and six channel multi network receiver
    can be found in the telive_doc.pdf file.


    # TROUBSHOOTING


    On some installs after a reboot you may get the error “ImportError: /usr/local/lib/libgnuradio-osmdr-0.0.3git.so.0.0.0:
    undefined symbol: blader_set_correction” on the last line of a big error message
    when trying to run ./receiver1 1. This is due to some sort of complication with
    GQRX. The way to solve this problem is to uninstall GQRX and its GNU Radio 3.7
    dependencies with the following command.


    ```

    sudo apt-get remove --auto-remove gqrx-sdr

    ```


    # ANALYZING TETRA


    Even if the TETRA signal is encrypted, it is still possible to look at the system
    data being sent in a similar way to GSM signals to analyze a TETRA signal.'
