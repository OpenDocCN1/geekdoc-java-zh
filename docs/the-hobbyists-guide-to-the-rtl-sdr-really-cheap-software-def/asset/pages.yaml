  md: '+   3. Click Generate to begin the calculations.


    +   4. After the calculations are completed, you will see the gain pattern.

    If it does not show up go to Window -> Pattern or press F4. The gain pattern shows
    what signal gain you can expect for signals originating at various degrees of
    elevation. For example here we have simulated a Discone. The graph shows that
    from straight above (0 degree elevation) the gain is very poor, so we conclude
    that a discones is not a great receiver for say a satellite that is directly overhead.
    But at an elevation of 80 degrees (10 degrees above the horizon) the antenna has
    a high maximum gain of 5.1 dBi.


    By default you will see the radiation pattern for the vertical plane, but if you
    want to see the horizontal plane as well you you can in the Pattern window go
    to Far field -> Show both hor/ver, or press ‘D’.'
