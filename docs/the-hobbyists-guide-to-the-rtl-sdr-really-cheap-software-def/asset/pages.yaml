  md: '# APPENDIX A: AUDIO PIPING


    Many applications of the RTL-SDR require that the audio from SDR receiver software
    such as SDR# be “piped” into decoding software. Piping simply a method that allows
    a decoding program to listen to the output audio that is produced by the SDR receiver
    software like SDR#.


    There are several methods to pipe audio in Windows and below we show how to enable
    the Stereo Mix, VB Cable and Virtual Audio Cable piping methods. In most cases
    we recommend setting up VB Cable or Virtual Audio Cable.


    # STEREO MIX


    The simplest method is to use the Windows Stereo Mix option. With stereo mix,
    the decoding program will simply take the audio that is being sent to your speakers.
    You may not want to use this method if your decoding software outputs decoded
    audio to the speakers, as the raw digital audio will interfere. But it is fine
    for things like ACARS, weather satellite and fax reception. To enable stereo mix
    use the following instructions.


    +   1. Right click the speaker icon in your task bar and click on “Recording devices”.


    ![](img/33eab9643eb7fbb4bf9363c117190041_579_0.png)'
  merge: -1
  pgno: 579
- img_proc: true
  md: '2. Right click anywhere in the window that pops up and ensure that “Show Disabled
    Devices” and “Show Disconnected Devices” are both checked.


    ![](img/33eab9643eb7fbb4bf9363c117190041_580_0.png)


    3. Find the “Stereo Mix” option, right click it and select Enable.'
  merge: -1
  pgno: 580
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_581_0.png)


    If you have more than one recording device, such as a microphone, or you have
    also installed virtual audio cable or VB Cable make sure to set stereo mix to
    the default device. Many programs will select the default device as the audio
    pipe when looking for an audio source. Note that if you want to use another audio
    pipe such as virtual audio cable as the default device again, you will need to
    set audio pipe back to the default device.'
  merge: -1
  pgno: 581
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_582_0.png)


    Any stereo mix is enabled and ready to use! Any audio coming through your speakers
    will also be piped to stereo mix which can be selected as an audio piping source
    in most programs that require one.


    If stereo mix is not showing up in the recording properties window, try updating
    your sound card drivers.


    # VB CABLE


    VB Cable is free software that can be downloaded from http://vb-audio.pagesperso-orange.fr/Cable/.
    VB Cable installs a new audio device that acts in a similar way to stereo mix.
    The advantage with a program like VB Cable over stereo mix is that the audio will
    not play through your speakers. This is desired and required in applications like
    digital voice'
  merge: -1
  pgno: 582
- img_proc: true
  md: 'decoding, where it is desired to listen to only the decoded voice and not the
    noise of the digital signal. Additionally, if stereo mix were used, the decoded
    voice would be piped back into the decoder, causing interference to the digital
    signal.


    The disadvantage of VB Cable is that unlike VAC ( shown below), there is no options
    screen or ability to create cable repeaters.


    Note that when installing VB Cable you may need to run the installer as administrator.


    To use VB Cable, use the same method as in the stereo mix tutorial shown above,
    but instead set VB Cable to the default audio device.


    # HI-FI CABLE


    Hi-Fi Cable is made by the same programmers as VCable. The difference is that
    it allows sample rates up to 384 kHz, whereas the standard VCCable only allows
    sample rates up to 96 kHz. Usually such high sample rates are not required, however
    for some tutorials, such as with the RDS and SCA tutorials, the higher sample
    rate is required. Hi-Fi Cable can be downloaded from http://vb-audio.pagespersero-orange.fr/Cable.


    # VIRTUAL AUDIO CABLE


    Virtual Audio Cable is another tool similar to VB Cable but has a cost of $25-$50.
    It can be downloaded from http://software.muzychenko.net/eng/vac.htm. They have
    a trial version which supports up to three cables, but it introduces a watermark
    voice that periodically says "Trial Version" which might corrupt some signals.'
  merge: -1
  pgno: 583
- img_proc: true
  md: 'However, most digital signals are tolerant to this kind of interference and
    should work fine with the watermark.


    To use Virtual Audio Cable, use the same method as in the stereo mix tutorial
    shown above, but instead set Virtual Audio Cable to the default audio device.


    ![](img/33eab9643eb7fbb4bf9363c117190041_584_0.png)


    # SETTING THE AUDIO SAMPLE RATE


    For some applications and decoding programs it is essential to correctly set the
    audio sample rate. To do this using the following steps.


    +   1. Right click the speaker icon in your task bar and click on “Recording devices”.

    2. Right click on your audio piping device (eg stereo mix, VB Cable, VAC) and
    select properties.

    3. Go to the Advanced Tab.'
  merge: -1
  pgno: 584
- img_proc: true
  md: '4. Choose the sample rate your decoding software requires. Do this for both
    the Playback and Recording devices if necessary.


    ![](img/33eab9643eb7fbb4bf9363c117190041_585_0.png)'
  merge: -1
