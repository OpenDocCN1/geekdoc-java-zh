- img_proc: true
  md: '# USING RTL_TCP


    Rtl_tcp is a command line program that works on both Windows and Linux. It is
    used to send an IQ stream from a remote RTL-SDR server over TCP/IP. In other words
    it allows you to connect to a remote RTL-SDR dongle over a network. SDR# is one
    such program that can connect to a rtl_tcp server.


    In most cases you will need a fast network connection to use rtl_tcp as it can
    use a significant amount of network bandwidth. To calculate the bandwidth required
    we need to multiply the chosen SDR sample rate by the number of bits per sample.
    The number of bits in the raw RTL-SDR IQ stream is 8 bits for the I stream and
    8 bits for the Q stream. So we can use the following calculation.


    > Bandwidth (MBit/s) = Sample Rate (Ms/s) x (8+8)bits


    So for example, running at the maximum sample rate of 3.2 Msps would need 3.2
    x 16 = 51.2 MBits/s. For a more conservative 2 Msps we need 2 x 16 = 32Mbit/s.


    Standard ethernet networks run at 100 Mbits/s so they are sufficient (assuming
    the network is not heavily used by other applications and overheads are taken
    into account). For comparison USB 2.0 run up to 480 Mbits/s. Wireless 802.11a
    and 802.11g networks run up to 54Mbits/s, however this is the theoretical maximum
    and never usually run this fast. The newer 802.11n wireless standard can run up
    to 300 Mbits/s and should be sufficient for the maximum sample rate.


    Note that other factors like network congestion, ethernet cabling length, WiFi
    connection quality, number of WiFi devices and embedded device speed might affect
    your performance. To test your network speed on Windows try'
  merge: -1
  pgno: 438
- img_proc: true
  md: 'the LAN Speed test software http://www.totuso.com/downloads.html.

    Realistically, you should expect to use a lower sampling rate such as 1Msps, especially
    if you are using an embedded device like the Raspberry Pi. You should expect WiFi
    to be problematic if there are any other users or if there is significant interference.


    To use rtl-tcp on Windows follow the instructions.


    +   1. Download the rtl-sdr precompiled binaries for Windows from

    http://sdr.osmocom.com/trac/attachment/wiki/rtl-sdr/RelWithDebInfo.zip.

    2. Extract the RelWithDebInfo.zip file to a folder.

    3. Using the Windows command prompt navigate to the folder you have extracted
    the zip file to.

    4. Navigate to the x32 folder.

    5. Run rtl-tcp -h for a list of available commands.


    ![](img/33eab9643eb7fbb4bf9363c117190041_439_0.png)


    To use SDR# with rtl-tcp:


    +   1. Find your local ip address by typing ifconfig at a command prompt.

    Your ip address will be listed under an ethernet apapter: local area'
  merge: -1
  pgno: 439
- img_proc: true
  md: 'network connection heading.


    +   2. At the command prompt use the following where IP_ADDRESS should be the
    IP address of the computer you are running rtl_tcp on.


    +   3. In SDR#, select RTL-SDR/TCP and in the configure menu enter the IP Address
    of the server. The sample rate and gain controls can be adjusted from SDR#.


    +   4. Press Play.


    To use SDR Touch with rtl_tcp:


    +   1. At the command prompt use the following (where -s sets the sample rate).
    Note that the sample rate for SDR Touch must be set as 1024000.


    ```

    rtl_tcp -a IP_ADDRESS -s 1024000

    ```


    +   2. Open SDR Touch.


    +   3. Scroll down on the menu to the Remote button. Touch this button.


    +   4. Enter the IP address and port as ip_address:port and then touch connect.


    Rtl_tcp is automatically installed during the RTL-SDR Linux driver installation
    procedure and it can be used in the same way as on Windows Linux. (Note that in
    Linux the command to find your ipaddress is “ifconfig”). There appears to be a
    bug in newer Linux kernels that can cause stuttering problems with rtl_tcp due
