    # # INTRODUCTION


    # # WHAT IS SOFTWARE DEFINED RADIO (SDR)?


    In traditional hardware radios, the mathematical operations required to decode
    and process radio signals are performed using analogue circuitry.


    Recently, computers have become powerful enough to perform the required mathematical
    calculations in software, hence the term software defined radio.


    This has led to the creation of advanced radios that previously required complicated
    analogue hardware now being able to be implemented easily in software. Advanced
    radio capabilities such as wideband tuning and waterfall displays are now available
    at much lower costs.


    # # WHAT IS THE RTL-SDR?


    The RTL-SDR is an extremely cheap software defined radio which is based on mass
    produced DVB-T TV (Digital HD TV) USB receiver dongles that have the RTL2832U
    chip in them. Back in 2012 it was discovered by'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'hardware hacker Eric Fry, Linux driver developer Antti Palosaari and the Osmocom
    team (who were developing their own SDR) that the RTL2832U chip had a special
    mode which enabled it to be used as a general wideband SDR.


    Today, by using custom software drivers, a commonly found and low cost TV dongle
    (under $20 USD) can be turned into a sophisticated SDR receiver with features
    that would have until recently cost in the hundreds to thousands of dollars.


    Of course, the performance of these dongles will not match a dedicated SDR, but
    they perform extremely well for the price and almost all hobbyist projects that
    can be done with expensive radios or SDRs can also be done with the RTL-SDR. Also
    because the RTL-SDR has become so ubiquitous it also has the advantage of a large
    community, meaning that there is a greater amount of free software available.


    Owning a wideband SDR opens up interesting possible projects and avenues to explore.
    Applications of the RTL-SDR include the following, some of which will be discussed
    in more depth in the project tutorials chapter.


    +   - Listening to unencrypted Police/Ambulance/Fire/EMS conversations.

    - Listening to aircraft traffic control conversations.

    - Tracking aircraft positions like a radar with ADS-B decoding.

    - Decoding aircraft ACARS short messages.

    - Scanning commercial trunked radio conversations.

    - Decoding unencrypted digital voice transmissions.

    - Tracking maritime boat positions like a radar with AIS decoding.

    - Decoding POCSAG/FLEX pager traffic.

    - Scanning for cordless phones and baby monitors.'
  merge: -1
  pgno: 13
