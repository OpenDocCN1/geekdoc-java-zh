  md: 'If you want to install GQRX from source you will need to have GNU Radio 3.7
    and the RTL-SDR drivers from libmoscore installed first. See the Github page for
    a list of all required dependencies https://github.com/csete/gqrx. After installing
    all the dependencies it is a simple matter of running the following.


    ```

    git clone https://github.com/csete/gqrx.git gqrx.git

    cd gqrx.git

    mkdir build

    cd build

    make ..

    make

    sudo make install

    ```


    You can then run the software by typing gqrx into a terminal to start GQRX. Upon
    starting GQRX for the first time you will be greeted with a screen asking to configure
    I/O devices. Simply select the Realtek RTL2832UUHID option from the Device menu
    and choose your desired sample rate. The other settings can be left as default.'
