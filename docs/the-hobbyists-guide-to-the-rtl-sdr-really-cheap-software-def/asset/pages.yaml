    # SETTING UP THE VOICE CHANNEL RECEIVER


    +   1. Now that we have added the signal receiver and decoder we will add the
    voice receiver.


    +   2. Press the ‘Add new receiver’ button once again and on the bar that pops
    up click on the RTL2832 button.


    +   3. This time for the role choose ‘Voice’.


    +   4. For the RTL Device, choose your second RTL-SDR dongle.


    +   5. Set the gain and PPM offset for this dongle appropriately. Note that setting
    the correct PPM offset is critical for correct operation.


    +   6. Choose the Audio Output as your speakers and make sure that Mute is not
    checked.


    +   7. Set the ‘Park’ frequency to zero. This is the frequency the receiver will
    revert to there is no activity.


    +   8. If desired, set the squelch to a value that is similar to what you might
    use in SDR#. The squelch will stop static from playing when there is no voice
    signal. You may wish to leave this at zero for now, and tune it with trial and
    error later when you have everything going. If you are using trial and error try
    a value around or try somewhere around 40 - 60 first.'
