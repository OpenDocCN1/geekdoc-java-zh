  md: '# RTL-SDR PROJECT


    # TUTORIALS


    These tutorials are written with the RTL-SDR in mind but most will also be valid
    for other SDRs and even some hardware radios.


    # AUDIO PIPING


    Most of these tutorials performed in Windows require that something called an
    audio pipe be set up. An audio pipe is simply a program that routes the audio
    output from your SDR receiver (e.g SDR#, HDSDR, SDR-Radio) to the decoding program.
    Appendix A: Audio Piping for information on how to set up audio piping methods
    like stereo mix, VB Cable or Virtual Audio Cable.


