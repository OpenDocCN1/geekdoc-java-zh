    The program will will run until an LTE signal is found and it will return the
    PPM correction.


    # REMOVING THE IR DIODE


    The standard RTL-SDR unit comes with an IR LED diode which is used under DVB-T
    TV operation for the remote control. This diode has long legs which can act as
    an antenna picking up strong undesired signals. A simple improvement to the dongle
    is to cut off this IR LED diode from the PCB board. See the Image of an RTL-SDR
    Circuit Board section for info on where the IR LED is.


    # REDUCING USB NOISE ON HF


    Placing a1 uF (micro farad) tantalum capacitor across the USB +5V and GND lines
    can help to reduce noise particularly at HF frequencies. To do this, simply open
    the dongle casing and order the 1 uF capacitor across the two outer pins on the
    USB plug. Be very careful that you connect the polarized tantalum capacitor the
    correct way by using a multimeter to measure the voltage first. Also be careful
    not to short anything and try to'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'keep the capacitor leads as short as possible. If done carefully you should
    be able to easily snap the casing back on.


    This helps as capacitors act as a short to RF signals which should not be on the
    USB DC power line. A value of 1 uF is enough for almost any frequency to be shorted
    to ground. A tantalum capacitor should be used as they have lower parasitic inductance
    compared to electrolytic capacitors and can thus pass higher frequencies much
    better.


    # STABILIZING THE FREQUENCY

    OFFSET


    The cheap and low quality oscillator used in most RTL-SDR dongles is okay for
    most applications, including almost all the projects discussed in the tutorials
    below. However, some demanding applications like GPS and radio astronomy projects
    require very stable and very small frequency offsets. The local oscillator will
    drift in frequency as the dongle heats up. One simple way to stabilize the dongle
    is to remove its casing or drill extract ventilation holes. Another method that
    has been suggested is to add solder to the heat pads under the RTL2832U and R820T
    chips on the bottom of the dongle circuit to improve heat dissipation. The author
    of the SDR for Mariners blog at http://sdrforminers.blogspot.com has also suggested
    that the dongle be submerged in a can of oil to stabilize the temperature. Immersing
    the RTL-SDR in a bucket of sand is another method for temperature stabilization.


    The best (but also most expensive) way to stabilize the frequency offset is to
    replace the oscillator with a higher quality one that has a lower PPM offset.
    You could go even further and replace it with a temperature controlled oscillator
    (TCXO) which will maintain a stable frequency even as the'
  merge: -1
  pgno: 141
- img_proc: true
  md: temperature changes. There are now several vendors that sell TCXO modified dongles
    and these can be found on our Buy RTL-SDR dongles page at http://www.rtl-sdr.com/buy-rtl-sdr-dvb-t-dongles/
  merge: -1
