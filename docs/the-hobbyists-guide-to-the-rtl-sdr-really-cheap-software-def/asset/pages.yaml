- img_proc: true
  md: 'Note that DSDTuner currently does not seem to work with the latest versions
    of DSD+.


    DSD+ contains many tunable options that are shown in the help screen ''dsd-h''.
    These options are for improving vocal quality which can be tuned automatically
    with a special program DSDTuner. DSDTuner simply iterates through all possible
    options and values for those options and then selects the best.


    DSDTuner must be built from source from https://github.com/dreinhold/dsdtune.
    We have also uploaded a Windows binary at https://dl.dropboxusercontent.com/u/43061070/dsdtune.exe
    for ease, but you will probably need MingW installed with the path correctly set
    to run it. To compile this program you must have MingW with gcc installed.


    To compile DSDTune, download or git clone it from https://github.com/dreinhold/dsdtune.
    Assuming you have MingW installed, in command prompt run gcc -Wall -o dsdtune.exe
    utils.c dsdtune.c. This will generate dsdtune.exe.


    To use DSDTune first open DSD+ and listen to a digital voice channel. While decoding
    audio press the ''r'' key on your keyboard to begin logging a raw audio file.
    Press ''r'' again after about one minute to stop recording. Next copy the dsdtune.exe
    to the DSD+ folder. Then run dsdtune -i DSDPlus-Raw-Input_2013-12-28@140307.wav,
    where the wav file is the file you just recorded. Also be sure to pass the decoder
    options to dsdtune if you use any one in DSD+ (e.g., -f, -fn, -fN, -fr).


    # MOTOTRBO LOCATION REQUEST RESPONSE PROTOCOL (LRRP) DECODING'
