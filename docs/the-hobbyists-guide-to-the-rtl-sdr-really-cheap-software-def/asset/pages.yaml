    # DIGITAL RADIO MONDIALE (DRM) GUIDE


    # INTRODUCTION TO DRM


    Digital Radio Mondiale (DRM) radio is a type of digital shortwave radio signal
    that is used by international shortwave radio broadcasters. It provides superior
    audio quality compared to AM signals by using digital audio encoding. With an
    upconverter (or direct sampling mod/experimental drivers), a good antenna and
    decoding software, the RTL-SDR can be used receive and decode DRM signals. This
    tutorial is also applicable to other software defined radios that can receive
    HF, such as the Softrock and Funcube dongle.


    # HOW TO RECEIVE AND DECODE DRM SIGNALS


    To receive DRM with RTL-SDR, you will need to prepare four things.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '+   - A HF upconverter, dongle modified with the direct sampling mod or be
    using the experimental HF driver.


    +   - A HF antenna.


    +   - The DREAM DRM decoding software with AAC decoder.


    +   - An audio piping method (Virtual Audio Cable/VBCable). [Appendix A: Audio
    Pipes](https://example.com)


    DREAM is a free open-source DRM decoder. Head to the DREAM download page which
    can be found at [http://sourceforge.net/apps/mediawiki/drm/index.php?title=Main_Page.](http://example.com)


    Before you start you will need to ensure your preferred audio piping piping method
    is set to use 48 kHz as the sample rate. See the [Setting the Sample Rate section](https://example.com)
    for more information.


    +   1. Download DREAM and extract the zip file into a folder.


