    SPECIFIED” AND THE SRDSHARP FOLDER IS NOT DOWNLOADED


    This is probably because you did not unzip the files and are trying to run install.bat
    from within the zip file. Make sure you extract or move unzip.exe, install.bat
    and httppeg.exe files out of the zip file into another folder, before running
    install.bat.


    THE DONGLE CONSTANTLY DISCONNECTS FROM THE USB PORT


    First test to make sure that it is not the fault of a dodgy USB extension cable
    by plugging the dongle directly into the PC or into another high quality extension
    cable. If it still disconnects the dongle may be faulty and you should ask for
    a replacement.


    THE DONGLE WON''T CONNECT TO THE PC AND ON MODELS WITH AN LED THE DOES NOT ILLUMINATE


    The dongle is faulty and should be replaced.


    ZADIG WON''T RUN


    Some users report that Zadig crashes upon opening for them. An alternative driver
    installer can be found at http://visualgdb.com/UsbDriverTool/. Use this tool to
    install the libUSB - WinUSB drivers.


    THE AUDIO SOUNDS CHOPPY AND THE SPECTRUM DISPLAYS ARE SLOW


    Your PC may not be powerful enough to run SDR# at the settings you have chosen.
    Single core machines especially may have trouble. To reduce CPU'
