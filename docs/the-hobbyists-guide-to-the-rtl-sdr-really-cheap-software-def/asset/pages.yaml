  md: '# DVB-T ON WINDOWS


    Again, note that DVB-T TV does not exist in the USA. On Windows watching DVB-T
    TV is usually a simple matter of installing the CD software that comes with many
    dongles. However, this software is often pirated by the Chinese manufacturer and
    can sometimes stop working after a few weeks or months due to the software’s anti
    piracy features.


    There are also some issues with driver installation on newer versions of Windows.
    First for Windows 7 & 8 (perhaps vista too) you will need to turn off automatic
    driver installation otherwise Windows will continually replace the DVB-T driver
    with an older version which will not work. To do this you go to the start menu
    and type in “Device Installation Settings” into the search bar. Click on “Change
    device installation settings”. Change the settings to “No, let me choose what
    to do” and “Never install driver software from Windows Update”.'
  merge: -1
  pgno: 516
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_517_0.png)


