  md: 'Adds an offset to the dB range in the RF spectrum window. The offset is added
    to the top value on the dB level range in the RF spectrum. Usually there is no
    need to adjust this, but if you want to get really good contrast on weak signals,
    adjust this along with the range so that the signal height is the same height
