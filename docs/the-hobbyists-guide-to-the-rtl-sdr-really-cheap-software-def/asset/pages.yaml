    # OTHER DECODERS


    MultimonNG is also capable of decoding POCSAG and can also be run on Windows,
    Linux and even on an embedded device running Linux. At the command line in Linux
    use rtl_fm piped into multimon-ng to decode POCSAG and display it to the terminal.
    In the example below replace the frequency of 158.1M and the PPM offset with a
    pager frequency used in your area and your dongles PPM offset.


    ```

    rtl_fm -f 158.1M -s 22050 -p 49 | multimon-ng raw -a POCSAG52 -a POCSAG1200 -a
    alpha /dev/stdin

    ```


