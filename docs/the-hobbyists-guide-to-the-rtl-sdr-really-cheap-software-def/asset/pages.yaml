  md: '![](img/33eab9643eb7fbb4bf9363c117190041_267_0.png)


    # GR-AIS


    GR-AIS is a GNU Radio based AIS decoder which can be downloaded from https://github.com/bistromath/gr-ais.


    # AISDECODER


    AISDecoder is a Linux and Windows compatible AIS decoder which can output NMEA
    positions for use in OpenCPN. Download AISDecoder from the forum thread at http://forum.aishub.net/ais-decoder/ais-decoder-beta-release.


    To use on Windows a precompiled binary file is provided in the thread. After downloading
    AISDecoder, start up SDR# or any other general purpose SDR receiver and tune to
    an AIS channel. Next open a command prompt and open aisdecoder using the following
    line:


    ```

    aisdecoder -h 127.0.0.1 -p 10110 -a winmm

    ```


    This will start aisdecoder with its outputting data to 127.0.0.1 on port 10101.
    Aisdecoder will listen to your default audio device so make sure SDR# is'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'outputing to the correct device and it is set as the default in Windows sound
    recording properties. Adjust the volume levels until aisdecoder reads the volume
    around 50-70%.


    To use on Linux, first compile the program with the following:


    ```

    tar zxf aisdecoder.tar.gz

    cd aisdecoder

    mkdir build

    cd build

    cmake ../ -DCMAKE_BUILD_TYPE=Release

    make

    ```


    Now open two terminal windows or tabs. In one terminal window create a FIFO buffer
    with the following command.


    ```

    mkfifo /tmp/aisdata

    ```


    In the same terminal window use the following which will tune to an AIS channel
    and use so to convert the sample rate to 48 kHz which is required by aisdecoder.
    It outputs the raw audio to the FIFO. Remember to set any PPM offset required
    for rtl_fm by using the -p flag and you may need to fine tune the gain setting
    with -g.


    ```

    rtl_fm -M fm -f161.975M -s12k -p48 -g50 | sox -r12k -traw -es -b16 -traw -r48k
    -es -b16

    /tmp/aisdata

    ```


    In the second terminal window run the command


    ```

    /aisdecoder -h 127.0.0.1 -p 10110 -a file -c mono -d -l -f /tmp/aisdata

    ```


    Now in OpenCPN you can add a UDP receiver with port 10110.


    To test an AIS example file use the following.


    ```

    sox LABLSnippet.wav -t wav - | sox -t twav -traw -r48k -unsigned-integer -b16
    /tmp/aisdata

    ```


    As an alternative to a FIFO buffer you can also directly output the audio to the
    speakers and make aisdecoder listen to that.'
