  md: '# LISTENING TO SCA/SCMO FM

    SUBCAR CHANNELS


    In some countries standard broadcast FM radio contains “subcarriers” which contain
    either data or additional audio services. An example of one such data subcarrier
    is RDS which is explained in the tutorial above. In some countries an SCA subcarrier
    exists and is used to provide extra transmissions for things like reading services
    for the blind. It is possible to listen to these audio SCA transmissions using
    a combination of SDR# with the MPX Output plugin or HDSDR, Virtual Audio Cable
    and SDR#. The MPX Output plugin for SDR# can be downloaded from the list at http://rtlsdr.ru/page/vse-dostupnye-na-etom-sajte-plaginy-s-kratkim-opisaniem
    (note that this page is in Russian, so use Google translate if necessary).


    You can check if there are audio SCA services in your country by using the FM
    MPX Spectrum in SDR#, or the audio waterfall in HDSDR, just like what is shown
    in the above RDS tutorial. An audio SCA signal will be to the right of any RDS
    signal.


    HDSDR or SDR# with the MPX Output plugin must be used as the RTL-SDR receiver
    as the raw FM with subcarriers is distorted by SDR# or SDR-Radio when the WFM
    mode is used because the subcarriers are truncated. It would be okay if the NFM
    mode could be used, however the maximum bandwidth of the NFM modes in SDR# or
    SDR-Radio are not large enough to cover the width of a broadcast FM signal. You
    also need to ensure that Virtual Audio Cable of Hi-Fi Cable, not VBCable is not
    used as the audio pipe. This is because VBCable can only support up to a 96 kHz
    bandwidth and a 196 kHz bandwidth is required to the SCA subcarriers.'
  merge: -1
  pgno: 420
- img_proc: true
