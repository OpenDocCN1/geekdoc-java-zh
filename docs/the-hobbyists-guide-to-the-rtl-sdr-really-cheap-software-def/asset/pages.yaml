- img_proc: true
  md: '# MARINE AUTOMATIC

    IDENTIFICATION SYSTEM (AIS)

    GUIDE


    Large ships and passenger boats are required to broadcast an identification signal
    containing GPS position, course, speed, destination and vessel dimension information.
    This signal is used to help prevent collisions between boats as it acts as a sort
    of boat radar system, similar to the ADS-B system used for aircraft. The system
    is known as the “Automatic Identification System” or AIS for short.


    There are dedicated AIS receivers intended to be used on boats, or by hobbyists,
    but they can be expensive. A radio scanner or the cheap RTL-SDR can be used to
    receive these signals and with the help of decoding software, ship positions can
    be plotted on a map.


    This tutorial will show you how to set up an AIS receiver with the RTL-SDR. Most
    parts of this tutorial are also applicable to other software radios, such as the
    fancube dongle and HackRF, or even regular hardware scanners if a discriminator
    tap is used, but the RTL-SDR is the cheapest option.


    > Safety Warning: This probably should not be used a navigational aid on a boat
    as the field reliability of the RTL-SDR or other software radios is not proven.
    This guide is intended for land based scanner hobbyists.


    # AIS TUTORIAL


    To set up an AIS ship radar on a windows system you will need:'
  merge: -1
  pgno: 251
- img_proc: true
  md: '+   - An audio piping method. See Appendix A: Audio Piping for information
    if you don''t have one set up.


    +   - A vertically polarized antenna tuned to 162MHz.


    +   - Software for decoding the AIS signals.


    We assume you have the RTL-SDR dongle set up and working already. If you have
    not bought a dongle yet, see our Buy RTL-SDR page at www.rtldr.com/buy-rtl-sdr-dvb-t-dongles/
    for information and the check out the Quick Start Guide section earlier in this
    book for any easy setup with SDR#. You will also need to have an audio piping
    method installed and set up. Audio piping will allow the audio from a SDR receiver
    program to be passed to a decoding program. Appendix A: Audio Piping for information
    about audio piping methods.


    # AIS ANTENNA GUIDE


    AIS signals are broadcast at both 161.975 MHz and 162.025 MHz and have a maximum
    range of approximately 75 kilometres. If so your radio setup is more than 75 kilometres
    away from any boats, you will probably not be able to receive AIS signals, though
    in some cases with good visibility they can travel much further. AIS is also a
    line of sight signal, meaning that AIS signals could be blocked if there are large
    buildings or mountains between your antenna and the boats. Because of this reason
    it is important to put your antenna as high as possible.


    A good antenna for AIS is a collinear antenna. The collinear antenna has very
    high omnidirectional gain directed towards the horizon. This means it will receive
    signals from sources that are not the horizon, which is where ships will be. Other
    antennas such as a quarter wave ground plane, j-pole, dipole or discone may also
    work well. If the majority of ships in your'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'area are focused in one direction only, a Yagi antenna may be a good choice.
    A Yagi is a very directional antenna - it will only pick up signals in the direction
    it is pointed. The advantage is that with directionality we can get a large gain.
    A Yagi is also usually sensitive to a small frequency range, so a properly tuned
    Yagi will also help keep interfering signals out. See the Antenna Guide section
    for more information about these antennas.


    A bandpass filter with a centre frequency near 162 MHz such as a surface mount
    http://www.minicircuits.com/products/filters_sm_bandpass.html may also be useful.
    Alternatively, a bandstop filter to filter out the FM broadcast band and pagers
    may help. A pager bandstop filter may be particularly useful as pager frequencies
    in some countries tend to be at around 157 MHz, near AIS frequencies. A coax stub
    filter may be a cheap solution for handling pager interference.


    An LNA such as the LNA4ALL at the antenna may also receive weak signals. See the
    LNA section and preselector section for more information.


    # SOFTWARE TUTORIALS


    +   1. Set up two audio pipes in Windows using either Virtual Audio Cable or VBCable.
    Ensure the sample rates are set to 48 kHz. See the setting the sample rate section
    for information on how to change this.


    +   2. Use a SDR receiver as SDR# or SDR-Radio to tune to an AIS signal. Your
    SDR receiver set your audio piping method in the Audio output drop down box and
    tune to an AIS frequency (161.975 MHz or 162.025 MHz). The signals may not appear
    exactly on the AIS frequencies, since the RTL-SDR is not frequency accurate. Just
    tune manually until the signals are properly'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'centred, or correctly set your PPM offset.


    For AIS we highly recommend using SDR-Radio as it will allow you to tune to both
    AIS channels simultaneously. If using SDR-Radio, set up two VFOs to listen to
    both AIS channels. Ensure that each one outputs to a separate audio piping device.


    +   3. Adjust the RF gain gain until you get good reception of the AIS signals.

    nYou want to adjust the RF gain such that the signal is strong, but the noise
    floor is low.


    +   4. Set the receive mode to NFM and expand the bandwidth so that it just covers
    the AIS blips on the waterfall. The bandwidth will be either around 12.5 kHz or
    25 kHz (there are two AIS standards with different bandwidths). Turn off the squelch
    and any DSP algorithms. If using SDR# set Filter Audio to OFF.


    +   5. AIS signals look like small horizontal lines on the waterfall, as is shown
    on the image below (if you live in a high marine traffic area there will be many
    more horizontal lines). If you are listening to the AIS signals through your speakers,
    they will just sound like blips of noise. The two AIS frequencies broadcast the
    same information and are used in commercial AIS receivers for redundancy.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'Once you have AIS reception set up you can then use a program for AIS decoding.
    There are several programs useful for decoding and displaying AIS information.
    ShipPlotter is a commercial program with a 21-day trial. AISMon + OpenCPN or AISDispatcher
    are free programs, but are a little harder to set up.


    # OPENCPN + AISMON TUTORIAL


    AISMon is a free AIS decoding program. It can be downloaded from the AISMon Yahoo
    group files section at http://groups.yahoo.com/group/aismon/. You may need to
    first join this group using a Yahoo account to access the files section. The Yahoo
    group also contains a sample AIS .wav file, when used with stereo mix, can be
    used to test both AISMon and ShipPlotter.


    One advantage to AISMon over ShipPlotter (shown in the next section) is that we
    can open two instances of the program and use them to decode the two AIS channels
    simultaneously which will improve the ship update rate.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '+   1. Open AISMon, set the audio piping device to the one you have chosen
    to use and set the sampling rate to 48000 (assuming you''ve set your audio piping
    device to use a sample rate of 48000 as well, see setting the sample rate section
    for more information). Press start monitoring.


    +   2. Adjust the volume in your SDR receiver software and/or the Windows volume
    settings until the level meter in AISMon reads about halfway.


    +   3. If everything is working you should begin to see numbers appear in the
    “Demodulator Counts” section of AISMon. If you receive many demodulator errors,
    check that you have properly centered the AIS signal on the tuning bar and are
    using a bandwidth wide enough to cover the entire AIS signal.


    +   4. Open a second instance of AISMon and repeat steps 1-3 for the second audio
    pipe if you are using SDR-Radio with two VFO''s.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_257_0.png)


