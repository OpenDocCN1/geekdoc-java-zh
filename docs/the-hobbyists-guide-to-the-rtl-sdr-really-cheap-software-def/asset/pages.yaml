  md: '# LISTENING TO AND ANALYZING

    TETRA SIGNALS


    TETRA is an acronym for Terrestrial Trunked Radio and is a digital walkie talkie
    voice protocol that is often used by government agencies, public safety, rail
    staff, transport services and the military. The TETRA protocol is in some ways
    similar to the GSM protocol used in mobile phones. Most countries apart from the
    United States have a TETRA system in place. A large list of countries that use
    TETRA can be found at http://en.wikipedia.org/wiki/Terrestrial_Trunked_Radio#TETRA_usage.


    Unencrypted TETRA signals can be listened to using an RTL-SDR and Linux software.
    Even if the TETRA signal is encrypted you can still use some tools to analyze
    some of the plain text system messages and data sent by the TETRA system just
    like with GSM. We will show a tutorial that shows how to listen to and view system
    data from TETRA signals. Note that most of this tutorial is performed in Linux
    and we assume that you have some decent Linux experience in installing software
    and using the command line.


    Also note that the TETRA decoder currently requires the older version 3.6 version
    of GNU Radio to be installed. If you already have GNU Radio 3.7+ installed, we
    reccmend installing GNU Radio 3.6 on a fresh install of Linux as the two versions
    may conflict. Another thing to note is that it is easier to install the required
    software on a 32-bit version of Linux. If you are using a virtual machine to run
    Linux you will probably already be using a 32-Bit version, but if you are running
    on bare metal you will probably have a 64-bit version. For this tutorial we suggest
    using a virtual machine to run a'
  merge: -1
  pgno: 327
- img_proc: true
  md: '32-bit Linux on Windows. If using a virtual machine we also strongly suggest
    to set it to have at least two processors.


    This tutorial is based heavily on the official tutorial written by the author
    of telive software. That tutorial can be found on the GitHub download of telive
    at https://github.com/sq5bpf/telive titled telive_doc.pdf. If you haveany issues,
    we suggest you check out the FAQ in that document.


