    # MONITORING ADS-B ON AN ANDROID DEVICE


    There are several ADS-B apps available for Android, however the one most recommend
    using is the FlightAware FlightFeeder Android App. To download this app search
    for "FlightAware Feeder" on the Google Play store. This app uses an RTL-SDR to
    receive ADS-B signals on your Android device, and plots received aircraft on a
    map. In addition it not only receives ADS-B at 1090 MHz, but it can also receive
    UAT at 978 MHz at the same time by toggling between the two frequencies. Finally,
    this app will automatically broadcast the ADS-B data on your local network, so
    that the data can be accessed and plotted on a remote device such as a PC. It
    will also automatically send the data to the flightaware.com network, which is
    a crowd sourced ADS-B mapping site that combines the data from hundreds of ADS-B
