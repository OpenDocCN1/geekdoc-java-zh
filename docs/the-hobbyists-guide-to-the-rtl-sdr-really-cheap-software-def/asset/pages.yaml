  md: '# # AIR TRAFFIC CONTROL / SCANNING GUIDE


    Air traffic control voice channels can be easily scanned using the RTL-SDR and
    a scanner plugin for SDR#. A scanner plugin rapidly switches between frequencies
    looking for an active signal. When an active signal is found it stays on signal
    until the transmission is over. This tutorial can be adapted to any radio system
    that requires scanning.


    # ## SDR FREQUENCY SCANNER


    The SDR# frequency scanner plugin we will use can be downloaded from www.sdrsharpplugs.com.
    It has an automatic installer so there is no need to edit any config files. Simply
    extract the zip file to a folder and run PluginsSetup.exe make sure to follow
    the on-screen instructions.


    # ## KNOWN FREQUENCY SCANNING


    This will quickly scan a list of known frequencies for an active signal. You will
    need to find a list of frequencies used by Air Traffic control in your area. You
    can also manually search for active frequencies in the spectrum. Another way may
    be to create a heatmap or use the scanner plugins to find active frequencies.
    See the heatmap tutorial in a later section.


    +   1. In the frequency manager plugin tab, go to **Manage -> Groups** and create
    a group called Air Traffic.


    +   2. Now to add your frequencies first tune to that frequency, click the Edit
    button. In the window that pops up sure to set the Mode to AM for air traffic
    and the Filter BW to 8000. Put a checkmark next to the Air Traffic group box.
    Finally, click Add.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_279_0.png)


    3. To scan a group, first select that group in the Scan A Group tab. Then click
    the Scan button. The “minimum signal strength” slider should be set higher than
    the noise floor, but not too high to miss weak signals. Remember that a value
    of 0 indicates a very strong signal and a value of -130 indicates a very weak
    signal. You may need to tweak the signal strength slider until only valid signals
    and not noise is recognised.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_280_0.png)


    You can edit the scan speed by clicking on the spanner icon and then adjusting
    the "Radio Settle Time in Milliseconds" slider under the Performance tab.


    # GENERAL FREQUENCY SCANNING


    General frequency scanning is when you want to scan very quickly over a range
    of frequencies to find unknown active signals. While the frequency scanner plugin
    used above can do this, for type of scanning we prefer to use the "Faster Scanner
    Plugin", from http://rtl-sdr.ru/skaner-poisk-novyh-chastost which we find to work
    better. Note that this page is in Russian, but the download link is placed near
    the bottom of the article and the plugin is in English. Install the plugin according
    to the plugin install procedure.


    To use the fast scanner plugin follow these steps.


    +   1. Before starting to scan you will need to know the spacing of frequencies
    in the band you want to scan. For example, air band signals are spaced at 25 kHz
    (or 8.33 kHz in some countries) apart. You will need to set this spacing as your
    step size using the setting in the Radio Tab in SDR# which is the tab containing
    the AM/FM/SSB mode selections. The scanner will increment the frequency using
    this signal spacing.'
  merge: -1
  pgno: 280
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_281_0.png)


    2. Go to the fast scanner frequency plugin window. Choose either “screen” or “manual”
    mode in the drop down menu. Screen mode will scan for active frequencies that
    are currently displayed on the screen and manual mode will let you scan between
    an arbitrary minimum and maximum frequency.


    3. Press Scan. A “Pan View” scanner window will pop up. This window shows a frequency
    spectrum of signals.


    4. The horizontal red line indicates the power threshold a signal needs to cross
    as an active signal that the scanner will stop at. The height of the line can
    be adjusted using the SNR dB setting box.


    5. You can press the “Skip” button to skip to the next active signal when scanning.


    6. You can ignore certain signals such as noise spikes or data channels by clicking
    on them with your mouse in the pan view frequency spectrum, or by dragging the
    mouse in the pan view frequency spectrum and using the Lock and Unlock buttons.
    When a frequency in the frequency spectrum is coloured red it is ‘locked’ and
    will be ignored by the scanner.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_282_0.png)


    While scanning the fast scanner will also create a table of active signals that
    it has found in the plugin window. It shows the time that they have been active
    and the frequency they are at.'
  merge: -1
