  md: '# TRAIN TELEMETRY DATA DECODING


    | Freq (MHz) | Signal Type |

    |---|---|n| 452.9375 | Head of Train (HOT) |

    | 457.9375 | End of Train (EOT) |

    | 457.9250 | Distributed Power Unit (DPU) |


    Head of Train (HOT) and End of Train (EOT) signals are used on trains to transmit
    telemetry data such as brake line pressure and to monitor accidental separation
    of the train. An End of Train device is used to send the EOT signal which the
    HOT unit in the locomotive will pick up.


    Distributed Power Unit (DPU) signals are control signals that are used to control
    remote DPU''s on long trains. DPU''s are locomotives which are placed in the middle
    or rear of a train to help more evenly distribute pushing and pulling power over
    the entire train.


    HOT, EOT and DPU signals can be decoded and monitored using the RTL-SDR, SDR receiver
    software as SDR#, audio piping and some special decoding software. The decoding
    software goes by the names of softEOT and softDPU and can only be downloaded after
    registering for a Yahoo! Group at https://groups.yahoo.com/neo/groups/SoftEOT/.
    Registering may take a few hours as you must wait for a moderator to approve your'
  merge: -1
  pgno: 458
- img_proc: true
  md: 'application. These signals are most commonly found in the USA, but may be in
    some other countries too.


    You will probably only be able to receive these signals if you live near a train
    yard or busy train route. To use softEOT or softDPU follow the instructions below.


    +   1. Download the softEOT and/or softDPU zip files from the files section of
    the Yahoo! Group and extract them to a folder.


    +   2. Ensure you have set the default audio device for your chosen audio piping
    method in the Windows sound recording settings.


    +   3. Open your favourite SDR GUI such as SDR# or SDR-Radio.


    +   4. Set the audio output to the audio piping method you are using.


    +   5. Tune to either a HOT, EOT or DPU frequency.


    +   6. Open softEOT or softDPU.


    +   7. To begin monitoring go Monitor -> Start Monitoring.


    +   8. Go to Monitor -> Audio Level Meter and then adjust the volume in your SDR
    program or Windows such that the audio level is at around 5-10%, however the exact
    level isn’t critical.


    Decoded messages will begin to show.'
  merge: -1
