  md: '9. As the RTL-SDR is not frequency accurate and also due to the Doppler effect,
    the signal may not be at the exact frequency it should be. Just adjust the frequency
    in SDR# until the tuning bar is centred on the satellite signal.


    10. Adjust the AF Gain in SDR# and/or Windows volume settings so that the volume
    bar in the bottom right hand corner of WXtoImg shows a green colour.


    ![](img/33eab9643eb7fbb4bf9363c117190041_207_0.png)


    11. WXtoImg should now decoding and showing the weather satellite image as it
    is received. You may need to periodically adjust the frequency to centre the signal
    as the Doppler effect will cause it to move. However, with RTL-SDR adjusting for
    the Doppler shift is not critical as the filter bandwidth can be simply set larger
    than 34 kHz (try 36 - 40 kHz) so that it is large enough to receive the entire
    signal even as it shifts.


    12. Once the image has been fully received, you can play with the options under
    the Enhancements and Projection menu in order to add false colour and enhance
