    # # CHANGING THE SIMULATED ANTENNA GROUND


    The type of simulated ground used when simulating an antenna can change the antennas
    modelled radiation pattern significantly. Some antennas NEC files are modelled
    in free space (ie without a ground) to get the theoretical radiation pattern.
    To get a more accurate radiation pattern we should simulate a ground. To see what
    ground an antenna is using and to change it use these instructions.


    +   1. Go **Settings -> NEC editor (new)** and make sure it is ticked.


    +   2. Click on the Edit NEC Input-file button ![]( )'
  merge: -1
  pgno: 576
- img_proc: true
  md: '3. An editing window should have popped up. In this window open the Freq./Ground
    tab.


    4. Now under the Environment box you should be able to choose the type of ground
    you would like to simulate with. For most realistic situations we use the settings
    ‘Real Ground’ and set the ground type to ‘Average’. You can experiment with different
    types of grounds to see how they affect the radiation pattern.


    5. To finishing the ground, save the modified NEC file by going to File -> Save.
    Then re-simulate the radiation pattern of your antenna to see the changes.


    # CHANGING ANTENNA DIMENSIONS/HEIGHT


    Most antenna .NEC files will come with several variables called ‘symbols’ that
    can be adjusted to change the dimensions, design frequency and height of the antenna.
    To see what symbols an antenna you are simulating has follow these instructions.


    +   1. Go Settings -> NEC editor (new) and make sure that NEC editor (new) is
    ticked.


    +   2. Click on the Edit NEC Input-file button.


    +   3. The first tab that has been opened in the new window should be the symbols
    tab.'
