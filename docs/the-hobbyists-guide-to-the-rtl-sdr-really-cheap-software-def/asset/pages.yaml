- img_proc: true
  md: '* Stereo can be used instead of VAC or VBCable, but you will be hearing both
    the digital signal as well as the decoded voice at the same time. Also, the decoded
    voice audio will be pumped back into DSD+ causing a detrimental feedback loop.


    # DECODING DIGITAL VOICE IN SDR#


    Sometimes it might be more desirable to just decode a digital signal through SDR#
    if there is a single signal you are interested in, or you are just not interested
    in trunk following Unitrunker.


    +   1. Install DSD+ as described in previous the paragraphs.


    +   2. Next, to make things easily download the DSD+ SDR# GUI plugin from http://www.rtl-sdr.ru/page/novyj-plugin-1.
    This site is in Russian, but the download is the link at the bottom of the post.
    The plugin helps simplify the operation of DSD+ by providing a nice GUI. Of course
    it is possible to do all this without the GUI and through the command line instead
    if you prefer.


    ![](img/33eab9643eb7fbb4bf9363c117190041_303_0.png)'
  merge: -1
  pgno: 303
- img_proc: true
  md: '3. Once installed into SDR#, you will need to tell the plugin the location
    of where your DSD+ is installed to. To do this, in the plugin click the configure
    button and then under DSD Path, click on the default path and find dsd.exe in
    your file system. You will also need to set the input and output audio devices.
    The device that is set as the default audio device in the Windows audio devices
    window (accessed by right clicking the sound icon in the taskbar) will be device
    number one. Here we have set our default input audio device as a VAC audio pipe
    and the default output audio device as the speakers. See information in Appendix
    A: Audio Piping for more information if you don’t have any audio pipes up.

    In the decoder option tab you can also edit the options for the digital signal
    that you want to decode, but the default automatic options will work fine in most
    cases.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_305_0.png)


    +   4. Now to decode a digital signal, first tune to that signal in SDR#, setting
    the mode to NFM and making sure that ‘Filter Audio’ is not checked. Make sure
    that any other filters like digital noise reduction are also off.


    +   5. Ensure that your audio output device in SDR# is set to the device you are
    using as DSD+.


    +   6. In the DSD+ plugin, click “Start DSD”. Ensure the volume levels in SDR#
    are loud enough so that the Lvl displayed at the top of the DSD+ command line
