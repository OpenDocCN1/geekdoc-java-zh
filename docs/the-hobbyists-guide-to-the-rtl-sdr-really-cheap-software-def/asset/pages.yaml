    # SDR-RADIO.COM V2 SETUP GUIDE


    SDR-Radio V2 (sometimes referred to as SDR-Console) is a popular

    SDR program with many advanced features. As such is it a fair amount more

    difficult to learn and use compared to SDR# and HDSDR. Be sure you

    install version 2 and not V1.5 as only V2 has RTL-SDR support.


    Like HDSDR, not only does SDR-Radio have a RF FFT signal and waterfall

    display, but also an optional audio spectrum FFT and waterfall display. Built

    in are also several DSP features like a noise blanker, noise reduction filter,

    notch filter and squelch options. The EMNS noise reduction filter is

    particularly good at automatically cleaning up and clarifying voice signals.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'To add to the feature list, SDR-Radio also has built in PSK, RTTY decoders
    and also comes with a satellite tracker. Furthermore, SDR-Radio has an excellent
    remote server application which will allow you to easily set up and connect to
    a remote RTL-SDR server over a network or the internet. Finally, SDR-Radio is
    capable of listening up to six signals in the same chunk of visible spectrum at
    a time, or in other words it can have six simultanenous VFO’s.


    To install SDR-Radio for the RTL-SDR follow the steps below.


    +   1. If you have not done so already, download and install zadig http://zadig.akeo.ie/
    and install the WinUSB drivers for RTL-SDR using the instructions in the SDR#
    setup guide.


    +   2. Download the SDR-Radio installer from http://v2.sdr-radio.com/.


    +   3. Use the installer to install SDR-Radio.


    +   4. Download from the bottom of http://www.aa5sh.com/?page_id=65 (Mirror: http://bit.ly/1oPcWTm)
    the SDRSourceRTL2832U.dll, rtlsdr.dll and libusb-1.0.dll dll files. Copy them
    into either the C:\Program Files\SDR-RADIO-PRO.com (64 bit), or C:\Program Files
    (x86)\SDR-RADIO-PRO.com (32 bit) folder depending on what version of Windows you
    have.


    +   5. Open SDR-Radio. Upon opening it you will be greeted with the Select Radio
    screen and a prompt saying “List is empty - add radio definition now?” Click Yes.
    If this prompt does not display, click the + Definitions button.


    +   6. In the new window open the Search drop down menu and select RTL SDR (USB).
    After clicking it the RTL-SDR will be added to the Radio Definitions list. Click
    OK.'
