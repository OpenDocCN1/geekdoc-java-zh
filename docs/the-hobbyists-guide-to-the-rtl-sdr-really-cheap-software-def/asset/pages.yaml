    # SYNOP


    SynOP (Surface Synoptic Observations) is a type of RTTY signal used on HF by the
    German meteorological service Deutscher Wetterdienst for sending weather reports.
    The reports are generally intended for ships at sea. SYNOP message use 5 digit
    codes to encode a set number of weather parameters. It usually be received around
    Europe. When tuning to a synop signal you should use LSB mode. Some SYNOP frequencies
    and transmission times are shown below.'
