  md: '# # RTL-SDR MISC. INFORMATION


    # ## RTL-SDR CRYSTAL TOLERANCE


    The RTL-SDR is a mass Chinese manufactured device with poor crystal tolerances
    with up to a +150 PPM offset. The crystal oscillator in the RTL-SDR is its clock
    source (the heartbeat of the circuit). The RTL-SDR uses a 28.8 MHz oscillator
    which may be out by a few kilohertz. The end effect is that known frequencies
    may not be exactly where you expect them to be. See the [Calibrating the RTL-SDR](##)
    section or the [Setting the PPM offset](##) section for information on how to
    calibrate the RTL-SDR to remove the frequency offset.


    Some RTL-SDRs come with upgraded crystals. Ones that use an SMD crystal will probably
    have a tolerance of around +-30 PPM, and ones with a TCXO will have a tolerance
    of +-1 PPM. RTL-SDRs with a TCXO will not need any PPM offset to be set, or will
    only need an offset of 1 or 2.


    # ## RTL-SDR DC SPIKE


    The E4000 dongle (and FC0012/13) will have a large spike in the centre of the
    spectrum no matter where it is tuned. This is expected as it due to the way the
    E4000 is designed. To remove the DC spike with the E4000 and FC0012/13 dongles,
    the “Offset Tuning” option in the SDR# configure menu can be used. Offset tuning
    will do nothing for the R220/R820T2.


    The R820T2/R820T2 also has a small yet noticeable DC spike at the centre, but
    usually clicking Correct IQ in SDR# is enough to completely remove this.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# RTL-SDR SPURS


    Due to the design of the dongle there will always be spurious (unwanted) signal
    noise spikes at multiples of 28.8 MHz which is the frequency of the internal oscillator.
    You may also see strong spurs at multiples of the USB clock frequency of 48 MHz
    and multiples of the USB data rate of 480 MHz.


    There is unfortunately not much that can be done about this to know where the
    spikes are and to ignore them. An oscillator spur looks like a thin solid line
    on the RF spectrum and waterfall. It will also likely sound like a single audio
    tone on the LSB/USB modes. To check if a signal is a spur from the oscillator,
    simply divide the suspect frequency by 28.8 MHz. If the result is an integer it
    is probably a spur. A spur from something like USB may look like many spurs clustered
    together.


    # RTL-SDR ADC BIT DEPTH


    The number of physical bits used by the RTL2832U ADC is 8, however the effective
    number of bits of an ADC is usually lower, and for the RTL-SDR may be around 7.


    # RTL-SDR SENSITIVITY


    The RTL-SDR with R820T tuner has an approximate average sensitivity of about -130
    dBm over it''s receivable. Below are some sensitivity results performed by HB9AJG.
    The full report of his results can be found at http://f6fvy.free.fr/rtl_sdr/Some_Measurements_on_E4000_and_R820T_Tune.pdf.


    | Frequency (MHz) | Sensitivity E4000 (dBm) | Sensitivity R820T (dBm) |

    |---|---|---|

    | 24 | N/A | -127 |'
  merge: -1
  pgno: 97
- img_proc: true
  md: '| 52 | -139 | -134 |

    | 110 | -139 | -134 |

    | 145 | -141 | -134 |

    | 435 | -139 | -135 |

    | 700 | -136 | -136 |

    | 1000 | -129 | -137 |


    # # OPTIMIZING TUNING


    The RTL-SDR receives best when a signal is tuned in near the centre (but not directly
    on the center) of the spectrum / waterfall. There is a slight sensitivity drop
    off near the spectrum''s edges.


    # # OPTIMIZING DECIMATION - IMPROVING RECEPTION QUALITY IN SOFTWARE


    Decimation is a clever way get more bits out of an ADC by oversampling a signal
    and then processing it in software. Decimation works essentially by sampling the
    same data point several times and then averaging, thus reducing the quantization
    noise of an ADC. Every time a sample is decimated, we gain about 0.5 bits of resolution.
    By using decimation on the 8-bit ADC of the RTL-SDR it is possible to achieve
    an effective 9-10 bits of final resolution, thus improving the signal to noise
    ratio.


    Decimation works by oversampling. Thus, to increase the amount of decimation performed
    the RTL-SDR sample rate should be as large as possible. Software like SDR# automatically
    performs decimation depending on the sample rate, and IF (tuned area) bandwidth.
    By setting the sample rate to a high value such as 2.4 MSps or 2.8 MSps you are
    increasing the amount'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'of decimation performed and thus improving the quality of the signal received.


    In SDR# the amount of decimation used can be calculated by halving the sample
    rate until it is smaller than the IF bandwidth. For example, if we are listening
    to a broadcast FM station with a bandwidth of 250 kHz, then with a 2.4 MSps sample
    rate we would have 2400/2 = 1200, 1200/2 = 600, 600/2 = 300, so decimation would
    have been done 3 times, and we would gain about 1.5-bits of resolution. For a
    narrowband FM station with a bandwidth of about 12.5 kHz, we would have 2400/2
    = 1200, 1200/2 = 600, 600/2 = 300, 300/2 = 150, 150/2 = 75, 75/2 = 37.5, 37.5/2
    = 18.75. Thus we would have decimated 7 times gaining about 3.5 extra bits of
    resolution.


    The effect of decimation cannot be seen in the RF spectrum or waterfall as it
    would limit the amount of visible bandwidth. However, there are special drivers
    which can enable the RF spectrum and waterfall to see what the decimated signal
    looks like. See the [custom gain control and decimation drivers section]().


    # RTL-SDR IMAGES


    When using a bandwidth of 0.25 MHz there will be images of strong signals at every
    250 kHz. When using a bandwidth of 1 MHz, there will be images of strong signals
    at every 1 MHz intervals. And so on.


    An image is essentially an unwanted duplication of a real signal appearing at
    a frequency multiple. The only true way to get rid of this is to use a preselector
    on the front end. See the [Preselector Filters section]() for more information.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# RTL-SDR TEMPERATURE FREQUENCY DRIFT


    As the dongle warms up the crystal oscillator will so too causing the received
    frequency of signals to drift over time. Once the dongle reaches thermal equilibrium
    the frequency drift will stabilize. Usually this is not a problem for most applications
    if you just remember to allow a few minutes for the dongle to heat up after first
    plugging it in. The final frequency offset can be adjusted by setting the PPM
    offset value.


    Typically dongles with the SMD crystal tend to drift a lot less compared to the
    through hole can type oscillators.


    # USING MULTIPLE DONGLES WITH THE SAME SERIAL NUMBER


    Some RTL-SDR dongles may all have the same serial number. Most software won’t
    worry about the serial number, but some software required each dongle that is
    plugged in to have a unique serial number. This can mean that if there are multiple
    dongles plugged in, the software will only recognise the first dongle.


    The serial number is stored in the RTL-SDR’s EEPROM which is a seperate chip on
    the PCB. Note that some dongles come without an EEPROM installed, and their serial
    number is fixed and cannot be changed. If your dongles have an EEPROM, then you
    can modify the serial number by using rtl_eeprom which is a command line EEPROM
    programming tool for RTL2832 based DVB-T receivers. Instructions for using rtl_eeprom
    can be found'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'http://manpages.ubuntu.com/manpages/trusty/man1_rtl_eeprom.html.


    Simply use the -s string to make the serial number a unique value for each RTL-SDR
    that you want to connect.


    # MAX NUMBER OF DONGLES PER PORT


    The theoretical limit of a USB 2.0 bus controller with a device throughput of
    256 Mbit/s would be about 5 dongles. In practice, the maximum limit likely be
    3 to 4. If you want to connect more dongles you can buy a PCIe card to add more
    USB 2.0 controllers.


    # USING THE RTL-SDR ON A LINUX VIRTUAL MACHINE


    The RTL-SDR works well on virtual operating systems running through VMware Player.
    Virtual box tends to not work very well due to its poor USB implementation. When
    running in VMware Player, make sure you set the USB host speed to USB 2.0 in the
    VM settings (it''s set to USB 1.1 by default) and ensure that you give the VM
    sufficient RAM and processing power for your applications. We recommend setting
    the virtual machine to have at least 2 processing cores and at least 4 GB of RAM.


    Often it is good to use a Virtual Machine as some Linux RTL-SDR projects require
    installation of the older version 3.6 of GNU Radio, and require installation of
    GNU Radio 3.7+. The two GNU Radio''s cannot be installed together on the same
    system as they conflict with one another. But with a virtual machine you can run
    two seperate instances of Linux with different versions of GNU Radio installed.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Some ready to go VMWare Linux images can be found at http://www.traffictool.com/vmware/.
    We prefer to use Lubuntu 14.04 and above, but you may choose your favorite distribution.


    # INPUT STATIC PROTECTION DIODE


    After the antenna input the dongles have a diode that will shunt large voltages
    produced by static electricity to ground. This helps to protect the sensitive
    front end of the tuner chip (R820T/E4000). In the past to save costs some dongle
    manufacturers did not include the diode on the circuit, which caused damage to
    many dongles after people connected them to antennas with a static charge on them.
    These days have been no recent reports of dongles coming without static protection
    diodes, though it still pays to check. See further down for an image of a typical
    RTL-SDR board with the input protection diode labelled.


    Even though a dongle has a static protection diode it is not a guarantee that
    the dongle will be protected. Always discharge outdoor antennas before plugging
    them in.


    # RTL-SDR CURRENT USAGE


    Current use vary between tuner models and even dongle brands. Measured current
    use using an inline USB current measurement dongle. The full sized R820T uses
    approximately 60 mA of current when not in use and 260 mA of current when not
    in use. The mini R820T dongle uses about 60 ma when not in use and 240 mA when
    in use. The Terratec E4000 model needs approximately 60 mA when not in use and
    about 170 mA when in use.


    # REMOTE CONTROL'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Some resellers of RTL-SDR dongles opt to include a remote control with the
    dongle. This sometimes causes confusion as the remote control appears to do nothing.
    The remote control is only used when the dongle is used as a DVB-T tuner, with
    the official manufacturer drivers. It serves no purpose when used with the SDR
    drivers.


    # INCLUDED CD


    Some resellers also opt to include a small CD with the RTL-SDR dongle containing
    some DVB-T drivers and TV software on it. Most of the time the DVB-T software
    on these CDs is pirated and will stop working after a few weeks or months due
    to the copy protection. If you want to use the RTL-SDR as an SDR you should not
    install anything from these CDs anyway. If you want to watch DVB-T TV, then see
    the [DVB-T TV Linux](https://example.com) [Windows Guide](https://example.com)
    section in this book.


    # DEAD ON ARRIVAL FAILURE RATE


    Although quality control is slowly improving, at the moment we estimate the dongle
    dead on arrival failure rate to be around 1-2%. This means that of every 100 dongles
    you buy, there is likely to be 1 or 2 that arrive in a faulty condition from the
    factory. See our [Troubleshooting Guide](https://example.com) in the previous
    chapter for information on determining if your dongle arrived faulty.


    # IMAGE OF A TYPICAL RTL-SDR DLE CIRCUIT BOARD'
  merge: -1
