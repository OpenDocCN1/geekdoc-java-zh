    ![](img/33eab9643eb7fbb4bf9363c117190041_385_0.png)


    # WAVESINK


    Wavesink is an Android program similar to SDR Touch, but it is restricted to decoding
    Broadcast FM, FM RDS, DRM and DAB/DAB+ audio only. It is the only Android app
    that can decode DRM, DAB/DAB+ with the RTL-SDR. Audio quality on either of the
