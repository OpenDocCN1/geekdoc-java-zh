  md: '# DECODING EMERGENCY ALERT SYSTEM (EAS) SAME MESSAGES


    In the USA and Canada, and some coutnries there is an Emergency Alert System (EAS)
    which is commonly used to alert the public to local weather emergencies as tornadoes,
    flash floods and severe thunderstorms. Local EAS weather alerts are encoded with
    the SAME (Specific Area Message Encoding) protocol. They are transmitted on the
    local weather radio frequency (NOAA weather radio if in the USA) and some weather
    radio''s are capable of decoding the EAS SAME data. Dsame is an EAS decoder that
    can be used with the RTL-SDR to receive and output full EAS weather messages.
    https://github.com/cuppa-joe/dsame. An example of a d same message is as follows:


    The National Weather Service in Pleasant Hill, Missouri has issued a Required
    Weekly Test valid until 12:30 PM for the following counties in Kansas: Leonworth,
    Wyandotte, Johnson, Miami, and for the following counties in Missouri: Clay, Platte,
    Jackson, Cass. (KEAX/NWS)


    You can listen to an example EAS message at our post on http://www.rtl-sdr.com/new-eas-same-weather-alert-decoder.


    To decode EAS messages you will need an RTL-SDR, multimon-ng and Python set up
    and running on your PC (the EAS decoder will run on Windows or Linux). See the
    section on multimon-ng and the heatmap bandscan section if you need help with
    setting up Python. To run the program you can use either _fm or SDR# as the input
    source.


    To run it with SDR# or another GUI based program in Windows:'
  merge: -1
  pgno: 455
- img_proc: true
  md: '+   1. Download both dsame and multimon-ng, and place them into the same folder.
    Multimon-ng can also be downloaded from the dsame Github page.


    +   2. In the Windows sound settings set your preferred audio piping method to
    be the default device. (multimon-ng will automatically listen to the default device).


    +   3. Open up SDR# or a similar program. Set the audio output to go to your audio
    piping method in the SDR# audio settings and tune to a weather radio station in
    NFM mode.


    +   4. Open up a Command prompt and use the “cd” command to browse to the folder
    where you have saved dsame and multimon-ng.


    +   5. Use the following command to begin listening and decoding:


    ```

    dsame.py --source scripts/ source-soundcard-multimon-ng.bat

    ```


    +   6. Now when an EAS message plays it will show in the terminal.


    To decode using rtl_fm on Windows or Linux (the instructions below assume Windows,
    but if Linux simply use the .sh script instead of the .bat script):


    +   1. Copy rtl_fm and it''s supporting files to the same directory multimon-ng
    and dsame (if in Windows).


    +   2. Use a text editor to open the text file “source-rtl-fm-multimon-ng.bat”
    which is stored in the scripts folder. Set the PPM and FREQ values appropriately
    for your RTL-SDR dongle and EAS station frequency.'
  merge: -1
  pgno: 456
- img_proc: true
  md: '+   3. Open up a Command prompt (or terminal in Linux) and browse to

    the folder where you have saved dsame.


    +   4. Use the following command to begin listening and decoding


    ```

    dsame.py --source scripts\source-rtl-fm-multimon-ng.bat

    ```


    You can also set dsame to only listen to messages meant for your area by

    entering the correct SAME code for your location with the --same flag. See

    the Github page for a full list of commands.'
