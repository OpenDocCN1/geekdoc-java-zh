- img_proc: true
  md: 'alternative methods will preserve the visual resolution and allow you to see
    the signal structure much more clearly.


    # CONTRAST


    Adjusts the contrast of the waterfall. Adjust it so that signals clearly stand
    out from the background noise.


    # RANGE


    Recommended Default Setting: -70


    Modifies the dB level range shown on the left (vertical) axis of the RF spectrum
    window. You should adjust this so that the noise floor sits near the bottom of
    the RF spectrum window. This will allow signals to be visible in the FFT RF spectrum
    and waterfall displays. As the RTL-SDR has a dynamic range of approximately 50
    dB (plus a little more oversampling/decimation), you will not need a range much
    higher than 0 to -70 dB. This setting will also affect the contrast in the waterfall
    and may help weak signals easier to spot.


    ![](img/33eab9643eb7fbb4bf9363c117190041_52_0.png)


    # OFFSET


    Recommended Default Setting: 0'
