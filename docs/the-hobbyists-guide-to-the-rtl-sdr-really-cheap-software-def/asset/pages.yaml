  md: '# GNU RADIO INTRODUCTION


    GNU Radio is a Linux based advanced graphical programming tool for digital signal
    processing (DSP). It can interface with the RTL-SDR and perform real time decoding.


    This guide is intended to teach the basics of GNU Radio by helping you to create
    your first GNU Radio RTL-SDR program. If are not running a Linux distribution
    preinstalled with GNU Radio and you have not yet installed in, please see the
    [GNU Radio installation guide](#) section earlier in the book.


    # GNU RADIO PROGRAM: FFT DISPLAY


    The first program we''ll make is a simple FFT RF spectrum display using GNU Radio.


    +   1. First open GNU-Radio Companion by typing the following into a terminal.

    `gnuradio-companion`

    2. On the right side of the GNURadio Companion you''ll see a list of GNU Radio
    blocks that can be added. Locate the Sources menu and expand it. Click and drag
    the ‘RTL-SDR Source’ into the main GNU Radio window.

    3. Next double click the Variable box with the ID: samp_rate. Change the samp_rate
    (sampling rate) to 2 MHz by typing in a value of 2e6.

    **Math Tip:** The number 2e6 is equivalent to 2 x 10⁶ or 2M or 2000000.'
