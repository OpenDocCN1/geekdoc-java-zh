  md: '| MPT1327 | ![image] |

    | Motorola Type II Smartnet | ![image] |

    | EDACS96 | ![image] |


    To use Unitrunker follow these instructions:


    +   1. Plug in both dongles and then open Unitrunker.

    2. Press the ‘Add new receiver’ button and then on the bar pops up click on the
    RTL2832 button.


    | Signal | Control | Both | Inline | RTL2832 | Debug | Q & A | Cancel |


    +   3. In the new window that pops up change the Role to Signal.

    4. Under the Signal heading change the RTL Device to the stick that will be used
    for the control channel.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '+   5. Type in your dongles frequency PPM offset in Correction. Note it is
    critical that you get the PPM correction correct.


    +   6. Make sure that Mute is checked.


    +   7. Change the Park value to the frequency of the trunking channel that you
    wish to monitor.


    +   8. Under Decode check all the trunking protocols that you are interested in
    listening to.


    +   9. Now at the top of this window press the Play button. The Protocol entry
    under Decode should now show the protocol detected, and a new window with site
    information should soon pop up and the value of the Protocol setting under the
    Decode heading should change to the trunking protocol detected.


    +   10. If the window does not pop up, check the Health under the Protocol entry.
    If it is below 100, either increase the Gain value (can be set to a value 0 -
    500) or turn on the Auto Gain setting. If still no new window pops up, set the
    Audio Output setting to your speakers and uncheck the mute button. Listen to see
    if the trunking channel is being correctly played through your speakers. If not,
    you may need to fine tune the frequency with the PPM correction setting or you
    may be tuned incorrectly.'
