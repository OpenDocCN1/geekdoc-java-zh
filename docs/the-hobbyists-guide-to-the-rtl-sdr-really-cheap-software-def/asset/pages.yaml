    # # ACTIVE GPS PATCH


    **Name:** Active GPS Patch Antenna


    **Polarization:** Circular


    **Broadband:** No


    **Uses:** Only good for GPS satellite reception.


    An active GPS antenna is a patch antenna with a built in LNA. Most active GPS
    antennas require DC power to be sent down the centre conductor of the coax. Be
    careful with this, DO NOT let DC power enter the RTL-SDR dongle or it will break.




    To connect an active GPS antenna needs in-line power, you will need to use a circuit
    called a bias-t. See the [GPS tutorial section](https://example.com) for information
    about bias-t’s.


