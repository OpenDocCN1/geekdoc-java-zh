  md: '# D-STAR


    D-STAR is a VHF digital amateur voice radio mode that is usually heard around
    145.670 MHz with a bandwidth of 6.25 kHz. D-STAR uses repeaters that go through
    the internet which allows for global communications. A zoomed in D-STAR waterfall
    image looks like the image shown below.


    ![](img/33eab9643eb7fbb4bf9363c117190041_378_0.png)


    Digital Speech Decoder (DSD) version 1.7 (or newer if reading in the future) can
    be used to decode D-STAR audio. A precompiled DSD 1.7 for Windows can be downloaded
    at http://bit.ly/1nPU87E (Mirror 1: https://dl.dropboxusercontent.com/u/43061070/dsd-1.7.rar)
    (Mirror 2: http://bit.ly/RF0yLw). Download the zip file and extract the files
    to a folder.


    To use DSD 1.7 for D-STAR use the following steps.


    +   1. Set your preferred audio piping device to be the default Windows recording
    device in the Windows sound recording properties. We recommend using either VB
    Cable or Virtual Audio Cable for D-STAR.'
