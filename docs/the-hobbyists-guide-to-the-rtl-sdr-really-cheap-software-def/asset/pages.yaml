  md: 'Broadband: Somewhat. Fairly broadband above design frequency.


    Uses: Good for satellite reception.


    Quadrifilar helix (QFH) antennas are circularly polarized antennas that are best
    used for satellite reception. They tend to work better than turnstile and spiral
    antennas for this purpose and are especially good with NOAA satellites in the
    137 MHz band. From the radiation pattern we can see that QFH antennas have fewer
    and deep null areas when compared to a turnstile, making them better suited for
    good satellite reception.


    Here is a link which compares the Turnstile vs the QFH antenna http://www.satsignal.eu/wxsat/antennas/.
    His results show that the QFH works slightly better.


    A QFH antenna can be easily constructed out of coaxial cable and some spare wood
    or PVC piping. A simple tutorial on creating a QFH out of flexible wire can be
    found here http://sdrformariners.blogspot.com/2013/08/weather-satellites-antennas.html.
    Here is another design that also uses coax cable which will probably work much
    better than the previous design http://www.g4ilo.com/qfh.html. If a more rigid
    structure is required, they can also be built from copper pipe. Here is one example
    built with copper pipe http://abdallah.hio.no/QFH.


    The QFH used in the graphs below has a design frequency of 137 MHz. At this frequency
    it has good SWR match for a 75 Ohm connection at 137 MHz.'
