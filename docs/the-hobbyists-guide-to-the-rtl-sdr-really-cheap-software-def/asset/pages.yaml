- img_proc: true
  md: 'clicking on the 72K button (or possibly 80K button in the future when this
    option is available). When opening it you will need to change the file type filter
    to All (*,*) in order to be able to see the .raw file.


    +   15. Once opened the image will automatically begin generating. Generating
    may take around 10 to 15 minutes.


    +   16. After processing is complete, click on the “Generate RGB” button to see
    the final image. Note that if you notice that one of the images is not in the
    first three columns, you will need to adjust the R,G,B drop down boxes to choose
