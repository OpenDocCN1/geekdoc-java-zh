    # COAXIAL CABLE GUIDE


    Coaxial cable is the cable you use to connect your radio to your antenna. Its
    job is to carry the signal from the antenna to the radio with as little interference
    and loss as possible. There exist various types of coaxial cable available for
    purchase. Different types of cables will have different losses, levels of shielding
    and impedances. Since the RTL-SDR can go into the GHz range, we recommend using
    at least RG6 coax cable which has a much lower loss in these high UHF frequencies
    compared to other common coaxial cables like RG58. RG66 is also a 75 Ohm cable
    which better matches'
  merge: -1
  pgno: 524
- img_proc: true
  md: 'the 75 Ohm input on the RTL-SDR. Most electrical stores stock RG6 cable as
    it is commonly used for satellite TV installations. Good low loss 50 Ohm cabling
    will work just as well however, as the mismatch loss between 75 and 50 ohms is
    negligible at less than 0.2dB.


    It is also recommended to try and reduce the overall length of coax runs. Instead,
    try to get the RTL-SDR dongle as close to the radio as possible using USB extension
    cables or remote computers. See the positioning RTL-SDR dongle section for more
    information.


    # COAX LOSSES


    In the following table we showed losses in dB (lower is better) for a range of
    common coaxial cable types over a length of 1 meter. Note that low loss cable
    is often much and more difficult to work with.


    | MHz | RG 58 (50 Ω) | RG59 (75 Ω) | RG6 (75 Ω) | RG 213 (50 Ω) | RG-8 (50 Ω)
    | LMR-400 (50 Ω) |

    |---|---|---|---|---|---||

    | 1 | 0.009 | 0.03 | 0.016 | 0.006 | 0.004 | 0.004 |

    | 10 | 0.038 | 0.031 | 0.0196 | 0.02 | 0.013 | 0.013 |

    | 100 | 0.133 | 0.102 | 0.056 | 0.069 | 0.042 | 0.04 |

    | 500 | 0.346 | 0.241 | 0.162 | 0.175 | 0.099 | 0.093 |

    | 1000 | 0.539 | 0.356 | 0.2 | 0.268 | 0.147 | 0.135 |

    | 1500 | 0.708 | 0.449 | 0.216 | 0.348 | 0.186 | 0.168 |


    # VELOCITY FACTOR


    Different coaxial cable types will also have a varying property called ‘velocity
    factor’. The velocity factor in the coax cable defines what the speed of light
    in the cable will be. This property is often used when designing coaxial based
    antennas as the velocity factor will change the required coax element lengths.


    # MATERIALS'
  merge: -1
  pgno: 525
- img_proc: true
  md: 'To save costs some coax cables use aluminium braid rather than copper braid.
    This is fine, unless you need to solder to the shield. Aluminium is impossible
    to solder to, so if you are building a coax cable antenna, often it is better
    to spend more and get the copper braided cable.


    # ANTENNA GAIN/DIRECTIVITY


    Antennas do not actually have ‘gain’ in the sense of an amplifier, however they
    can be more sensitive in certain directions (directivity). Antenna gain is measured
    relative to the ‘isotropic’ antenna which is a theoretical antenna that has exactly
    a gain of 0 dBi in a sphere around the antenna. This means that the isotropic
    antenna has the same sensitivity in all directions the antenna.


    As an analogy, think of a bare light bulb as an isotropic radiator - its light
    is not focused and can weakly illuminate a small room. Now add a reflector and
    a lens to the bulb and you have a torch which can focus the light strongly onto
    a spot much further away. Now you can strongly illuminate a spot across the room,
    but other spots especially ones behind the torch will be dark. A torch is similar
    to a directional antenna (like a Yagi) with high directivity/gain. Another example
    is a lantern which omnirectionally focuses the lights towards the horizon and
    avoids wasting towards the sky and ground. A lantern is analogous to an antenna
    like a quarter wave ground plane/discone/collinear etc.


    The unit dBi means decibels over the isotropic. The isotropic antenna can be said
    to have no directivity. All antenna gain is measured relative to the isotropic
    antenna. The measure of decibels is a measure of the ‘gain’ strength. Larger DBI
    numbers mean that your signal will be received stronger if it originates from
    a direction that the antenna is good at receiving.'
  merge: -1
  pgno: 526
- img_proc: true
  md: 'As with most things, there are tradeoffs when choosing an antenna. You can
    either have a highly directional high gain antenna or an omni-directional low
    gain antenna.


    When choosing an antenna for a project, you need to think about where the signal
    is coming. For example, if your signals are coming from the horizon in many directions,
    you may want to consider an antenna with large directivity directed towards the
    horizon like a quarter wave ground plane, discone, collinear or j-pole. If you
    want to receive a weak signal coming from one direction only, choose an antenna
    like a Yagi which has high gain in the direction it is pointing.


    # RADIATION PATTERNS


    Radiation patterns show the antenna directivity, or in other words in what directions
    the antenna will receive best. In the example antennas shown below the Example
    Antennas section we show 3D and 2D total power radiation patterns. The more red/pink
    the colour and the further out the pattern extends in the 3D images, the more
    gain in that particular direction.


    Below we show a labelled example of a 2D radiation pattern plot drawn in the vertical
    plane. The values on the outside of the circle represent elevation. The horizon
    is defined to be at 90 degrees elevation and straight up into the sky (Zenith)
    is defined as 0 degrees elevation. The vertical axis is the gain in dBi. In the
    plot below we can read that this antenna has a maximum gain of 1.76 dBi at an
    elevation of 76 degrees. To read the gain at a particular elevation, follow the
    circular arc back to the vertical axis.


    The ‘main lobe’ of an antenna radiation pattern is the lobe that contains the
    maximum gain. In the example plot below we have highlighted the main lobe for
    this radiation pattern.'
  merge: -1
  pgno: 527
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_528_0.png)


    # # ANTENNA DESIGN frequency


    You also need to think about what frequency you are interested in receiving. Most
    antennas will receive well at the design frequency and near it, but poorly at
    any other frequency. An exception is wideband antennas like the discone or scantenna.


    For most antennas the length of the elements determines the design frequency.
    Radio travels in waves that have lengths measured in meters. Long radio frequencies
    such as the LF/MF/HF bands (0 - 30 MHz) have long wave lengths. Very and Ultra
    high frequencies such as VHF/UHF (50 MHz+) have shorter wavelengths.


    The size of the elements on an antenna is usually proportional to the wavelength.
    Therefore, HF antennas need to be large and VHF/UHF antennas can be much smaller.
    The wavelength in meters of any frequency measured in MHz can be easily calculated
    with the following formula.'
  merge: -1
  pgno: 528
- img_proc: true
  md: 'wavelength (m) = 300 / frequency (MHz)


    Broadband antennas are desirable as they receive all frequencies. However, in
    some cases it may be more desirable to have a narrowband antenna which only receives
    well the frequencies you are interested in. This is especially the case with a
    wideband device like the RTL-SDR. The reason is that the RTL-SDR is very sensitive
    to out of band interference. So, if your antenna attenuates out of band signals,
    performance of the in bands can be much better.


    # STANDING WAVE RATIO (SWR)


    The SWR of an antenna is a measure that says how well matched the antenna impedance
    and coax or radio impedance is for a particular frequency. Typically coax cable
    and radio inputs are standardized at 50 or 75 Ohms. The antenna impedance should
    be the same to get a good SWR. If an antenna has an impedance of say 450 Ohms,
    a matching 9:1 transformer should be used to bring its impedance down to 50 Ohms.


    A poor impedance match thus bad SWR means that most of the received signal by
    the antenna will not make through the coax. Instead the signal will be reflected
    back causing interference to the signal, kind of like an an echo. As an analogy,
    think about listening to an outdoor speaker with echo can be hard to understand.
    The same thing happens with mismatched impedances.


    A good SWR means that most of the signal makes through the cable without interference.
    A perfect SWR ratio is 1:1 and a really bad ratio might be 100:1 or higher. In
    practice a SWR under 10 is usually sufficient. SWR can be calculated by dividing
    the antenna impedance by the coax/radio'
  merge: -1
  pgno: 529
- img_proc: true
  md: 'impedance. For instance a 450 Ohm antenna connected to a 50 Ohm coax cable
    would have a SWR of 450:50 = 9:1.


    Antenna impedance and therefore SWR can vary wildly with frequency. Non-broadband
    antennas will only likely have a small range of frequencies that have a good SWR.
    Broadband antennas are designed to have a low SWR over a large frequency range.


    Note that SWR says nothing about antenna gain. The SWR may be good at a certain
    frequency, but the gain of the antenna may be poor at that frequency. Where SWR
    matters is the signal loss that the mismatch creates. This online calculator at
    http://www.csgnnetwork.com/vswrlosscalc.html can be used to calculate the loss
    in dB for a particular SWR value. Here is a table of some SWR values to give you
    an idea of the loss you could be dealing with. From this table we can see that
    if we were to use 50 Ohm coax cabling with the 75 Ohm input RTL-SDR, we would
    have a SWR of 1.5 and so we would lose 0.177 dB of signal.


    | SWR | Loss (dB) |

    |---||

    | 1.5 | 0.177 |

    | 3 | 1.249 |

    | 5 | 2.553 |

    | 10 | 4.807 |

    | 20 | 7.413 |

    | 100 | 14.07 |

    | 500 | 20.99 |

    | 1000 | 23.99 |'
  merge: -1
  pgno: 530
- img_proc: true
  md: 'Ham radio enthusiasts who transmit using high powers are particularly concerned
    about SWR. This is because a bad SWR means that large amounts of power used for
    transmitting will get reflected back into the radio causing it to break, or simply
    causing massive amounts of transmit power to be wasted. For reception a high SWR
    is not so dire as to break the radio, but a high SWR can still cause significant
    signal loss.


    # ANTENNA POLARIZATION


    Radio signals can be transmitted at different polarizations (orientations). A
    vertically polarized signal must be received with a vertically polarized antenna
    and a horizontally polarized signal must be received with a horizontally polarized
    antenna. If you use the wrong polarization then the signal will be severely attenuated.


    Below we show an image illustrating vertically, horizontally and circular polarized
    signals from left to right.


    Notice how a circularly polarized signal is a vertically and horizontally polarized
    signal that are out of phase and added together. Depending on the phase of the
    signal, a circularly polarized signal can be Right Hand Circularly Polarized (RHCP)
    or Left Hand Circularly Polarized (LHCP). Circularly polarized antennas can receive
    both horizontal and vertically polarized signals.


    A great tutorial on antenna polarization can be found here http://sv1bsx.50webs.com/antenna-pol/polarization.html.'
  merge: -1
  pgno: 531
- img_proc: true
  md: '![](img/33eab9643eb7fbb4bf9363c117190041_532_0.png)


    # # ANTENNA RECIPROCITY


    When looking at information about antennas, most articles and guides refer to
    the transmission gain and SWR of the antenna. However, antennas have something
    called reciprocity which simply means that the properties will be the same for
    reception or transmission. So an antenna that has a low SWR at 144 MHz and high
    gain towards the horizon when transmitting also have the same properties when
    receiving.


    # # ANTENNA POSITIONING


    Antennas normally work best when they are placed up as high as possible without
    obstructions. If an antenna is obstructed by for example a house, tree or hill,
    its reception from that direction will be greatly reduced. The usual place to
    mount an antenna is on the roof of your house using a mount. When mounting on
    the roof you must be weary of waterproofing and grounding in case of lightning
    strikes.


    Antennas can also be mounted in the attic or roof space of many houses without
    significant reception degradation. Mounting in the attic also has the advantage
    of waterproofing and negating lightning strike risks. The most'
  merge: -1
  pgno: 532
- img_proc: true
  md: 'commonly used roof material in many countries is asphalt shingles which won’t
    block RF signals significantly. However, metal roofs or roofs with concrete tiles
    with metal rebar or grids in them can degrade signals much more.


    The height of the antenna will also affect the radiation pattern. Antennas placed
    up higher often have better gain directed towards the horizon.


    # # COMMON MODE CHOKES


    Almost any antenna that uses coaxial cable should use a common mode choke near
    the antenna. The common mode choke was mentioned previously in this book under
    the Improvements to the stock antenna section. A common mode choke will essentially
    ensure that the coax feedline does not become part of the antenna itself. Without
    the coax cable can act as part of the antenna, drastically skewing the radiation
    pattern to something undesirable.


    All that is needed for a common mode choke is to wind a bit of the coax cable
    near the antenna in a loop a few times around a cylindrical object. It will work
    even if you use a ferrite core, but with larger cables big ferrites may be expensive
    and hard to find, so an air winding will have to do.


    # # Additional Information


    http://myantennas.com/wp/tech-info/about-cmc/


    http://www.w8ji.com/ground_plane_verticals.htm


