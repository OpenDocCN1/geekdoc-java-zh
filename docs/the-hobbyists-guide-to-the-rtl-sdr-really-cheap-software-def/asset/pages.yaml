    # # HF ANTENNAS


    # ## LONG WIRE/RANDOM WIRE


    A long wire antenna is simply a wire that is at least one wavelength long of the
    frequency you want to receive. For most HF frequencies, an antenna this long would
    be impossible to use practically as it would require too much'
  merge: -1
  pgno: 567
- img_proc: true
  md: 'space. The random wire antenna is an alternative and is quite literally a random
    length of insulated wire strung up as high and as long as you can physically get
    it. This is the simplest HF antenna and it can be quite effective for what it
    is.


    The radiation pattern of a random wire antenna is quite unpredictable, though
    radiation patterns are not critical for HF antennas, since the signal will usually
    come from multiple directions. However, this antenna may require a bit of experimentation
    with location and lengths to get the best performance.


    To make this antenna simply connect a coax cable to the antenna input of your
    upconverter or direct sampling modded RTL-SDR. Run the coax to the location at
    which your random wire antenna will start. Now connect the random wire antenna
    to the centre wire of the coaxial cable.


    To significantly decrease the amount of noise, connect the shield part of the
    coaxial cable to a ground. A good ground is a cold water pipe. Avoiding using
    the electrical ground as it could be dangerous and it is also not the best ground
    due to possible RF interference. If you don''t have a good ground accessible,
    an alternative is to use a counterpoint, which is essentially just a long wire
    thrown on the ground.


    To further improve performance you will need to make a 9:1 "unun" transformer.
    This is because the impedance of a long wire antenna is 450 Ohms (note the impedance
    actually varies across different frequencies and 450 Ohms is just an overall average).
    So to match it with the coax cable and RTL-SDRs antenna input impedance of 75
    Ohms, the impedance of the long wire antenna need to be reduced by a factor of
    about 9, which will take it down to 50 Ohms. A 50 and 75 ohm mismatch is insignificant.'
  merge: -1
  pgno: 568
- img_proc: true
  md: 'This website shows a good tutorial on creating a 9:1 unun http://www.m0ukd.com/Magnetic_Long_Wire_UnUn/
    and this PDF file shows detailed construction information for a similar 9:1 unun
    http://www.earchi.org/92011endedfiles/Endedfed6_40.pdf. Here is another PDF that
    comprehensively discusses ununs http://setax.com/wp-content/2013/12/9-to-1-Balun-for-End-Fed-Antenna.pdf.
    An even improvement is to connect an antenna tuner after the 9:1 to accurately
    tune the antenna for the interested frequency, however this will be costly if
    you do not already own one.


    # MAGNETIC LOOP


    The magnetic loop antenna is probably the best antenna for HF that can be used
    with the RTL-SDR. This is because the magnetic loop is not only an antenna, but
    it also acts as a preselector.


    The advantage is that the magnetic loop will filter out any interference from
    signals you''re tuned to. The disadvantage is that the magnetic loop can be very
    hard to tune as you need to tune to the frequency you want to listen on the computer
    and then tune a variable capacitor on the magnetic loop to tune it to the correct
    frequency as well. The loop will also work for a small band of frequencies depending
    on your variable capacitor and loop size. Also, the lower frequency you are interested
    in, the larger and more unwieldy loop will become.


    When constructing a magnetic loop antenna for receiving only, large copper pipes
    are not required. Most internet tutorials for magnetic loops focus on transmitting
    loops which need thick pipe and large air gap capacitors to support the high transmit
    voltages. Building a receive only magnetic loop is the same as building one that
    transmits, but a receive only'
  merge: -1
  pgno: 569
- img_proc: true
  md: 'loop can be built out of thinner material such as coaxial cable and smaller
    variable capacitors.


    Here is a useful magnetic loop calculator http://www.66pacific.com/calculators/small_tx_loop_calc.aspx.
    And here is a tutorial for magnetic loop construction http://www.cvarc.org/newwp/download/technical/magnetic_loop_antenna.pdf.
    Here is an example of a very simple magnetic loop built out of coaxial. This does
    not even require a tuning capacitor http://www.carc.org.uk/downloads/A%20Coaxial%20Magnetic%20Loop%20%20for%207MHz.pdf.


    # 4NEC2 TUTORIAL


    4NEC2 is a free Windows antenna modelling program available from http://www.qsl.net/4nec2/.
    This software was used to generate the radiation pattern plots and SWR plots for
    all the antennas above. Antenna models are specified as .NEC files. Writing an
    antenna model is out of the scope of this book, but there are many good example
    antenna .NEC files included with the 4NEC2 software. Various websites also have
    models or real commercially made antennas for download. Just Google for your antenna
    name + .nec file and you may find that it has already been modelled. The NEC file
    for the Discone is used in the examples below was found at http://www.qsl.net/kp4md/modelling.htm.
    If you would like to learn how to write .NEC files, refer to the official 4NEC2
    documentation.


    Here we show a brief tutorial that shows how to simulate the example .NEC files
    provided with the 4NEC2 software and any .NEC files you have downloaded. Note
    that the example files are stored in the 4NEC2 installation'
  merge: -1
  pgno: 570
- img_proc: true
  md: 'folder likely in Program Files (x86)) under the folder models. The NEC simulation
    files used in the examples above can all be downloaded from http://bit.ly/1CfSNXT.


    # HOW TO SIMULATE AN ANTENNA RADIATION PATTERN


    +   1. Open 4NEC2. Go to File -> Open 4NEC2 in/out file. Choose the .NEC file
    for the antenna you are interested in simulating.


    +   2. Go to Calculate -> NEC output-data, or press F7. Choose Far Field Pattern.
    Here you can choose what frequency you would like to generate a radiation pattern
    for and what resolution you would like to use. The resolution specifies at what
    spacing of degrees should give a smoother more accurate graph but will take longer
    to compute. Here we choose to simulate a radiation pattern for 130 MHz using a
    resolution of 2.5 degrees.


    ![](img/33eab9643eb7fbb4bf9363c117190041_571_0.png)'
  merge: -1
  pgno: 571
