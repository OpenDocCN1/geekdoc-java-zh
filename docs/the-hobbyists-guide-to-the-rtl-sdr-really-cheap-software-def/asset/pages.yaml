  md: 'The R820T2 and R820T are identical electronically except for some minor changes
    in the maximum IF filter widths. The different filters may be the reason the R820T2
    has better performance. Thus a R820T2 will show up as an R820T on the PC, since
    there is no distinction between them in the digital part of the circuit. You can
    confirm that you have a R820T2 by checking the markings on the chip.


    # SDR SHARP USERS GUIDE


    SDR# is currently the most popular SDR program used with the RTL-SDR. It is easy
    to set up and simple to use. To install SDR#, go through the RTL-SDR setup guide
    shown above. Below we explain some of the settings and displays in SDR#.


    Upon opening SDR# you will be greeted with this screen shown below. We have highlighted
    the main parts of SDR#.


    | Start/Stop Menu | Volume | Frequency Input | Center/Free Tuning | Tuning Bar
    / IF | FFT & Waterfall Display Graph Controls |

    |---|---|---|---|---|---||

    | 858.691.669 Hz | | | | | |


    After opening SDR# for the first time, we suggest you immediately remember to
    perform the following steps (if you don''t know what some of'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'these steps are, continue reading further below for more information):


    +   1. Increase the RF gain from zero to a higher value in the configure menu.


    +   2. Reduce the range slider on the right of the SDR# window to at about -70.


    +   3. Increase the FFT resolution to at least 16384 (ideally 32768 or higher
    if your computer is powerful enough) under the "FFT Display" heading on the left
    menu to give yourself a clearer resolution spectrum and waterfall image.


    +   4. Enable the "Correct IQ" setting to remove the center spike if using an
    R820T/R820T2, or enable "Offset Tuning" in the configure menu using an E4000/FC0012/13.


    +   5. Turn off the "Snap to grid" setting, or adjust the PPM offset accordingly.


    See below for more information on these settings and others.


    # MAIN SETTINGS AND WINDOWS


    Note that there is a distinction in SDR# between settings that affect the software
    side, and settings that affect the hardware side. All hardware settings can be
    found in the Configure Menu / RTL-SDR Controller window which can be accessed
    with the cog icon ⚙. Here are settings to control things like the RF gain and
    sample rate / bandwidth of the RTL-SDR. To optimise reception, you need to adjust
    settings in this window.


    Most of the settings found in the main windows of SDR# affect the software digital
    signal processing (DSP) side of things. To optimise processing of the signal you
    need to adjust these DSP settings.'
  merge: -1
