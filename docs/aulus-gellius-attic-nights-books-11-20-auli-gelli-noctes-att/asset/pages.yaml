    # A


    1 Timaeus in histori oration Graeca de rebus populi Romani composuit, et M. Varro
    in antiquitatibus rerum humanarum, terram Italiam de Graeco appellatam scripserunt,
    quiam boues Graeca uetere lingua italoe uocitati sint, quorum in Italia magna
    copia fuerit, bucetaque autem eum terra gign pasque solita sint plumurima. 2 Coniectare
    autem possum et etiam causam, quod Italia sunt et argentosissima, multam, quae
    appellatur suprema, institutam in singulos duarum ouium, boum trinta, per copia
    scilicet bout proque ouium paeneria. Sed cum eius modi pecoris antique a magistratibus
    dicta erat, adgebantur boues oues alias pretii parui, maior, quae res faciet inaequalem
    multae poenem. Idcirco postea lege Aerna constituti sunt in oues aeris deni, in
    boueis aeris centeni.


    3 Minima autem est suis unius; suprema multa est eius numeri cuius dimixus, ultra
    quem multam dicere in dies singulos iu non est, et propteria suprema appellatur,
