  B. 捕获 NPE\nC. 捕获 AIOOBE\nD. 编译失败\n\n根据 JLS §15.10.4 *数组访问表达式的运行时评估*，评估过程从方括号的左侧开始，然后——如果成功——JVM\
  \ 检查括号内的部分。规范还补充道：\n\n> 如果数组引用表达式产生 `null` 而不是数组的引用，则会在运行时抛出 `NullPointerException`，但只有在数组访问表达式的所有部分都已求值之后，且仅当这些求值正常完成后。\n\
  \n在我们的情况下，这意味着索引表达式 `spoil()` 的评估由于抛出了 `Exception` 而异常终止，因此 NPE 永远不会发生，因为评估过程甚至没有到达真时刻（即它必须检查数组引用表达式的值是否为\
  \ `null`）。\n\n这个练习还证明，尽管像数组一样访问 `null` 的槽位会产生 NPE，但我们一看到代码意图对 `null` 引用执行某些操作，就不应该立即得出结论：可能它根本不会到达那一点……\n\
  \n***\n\n* `getClass()` 定义在 `Object` 中。\n* `isArray()` 定义在 `Class` 中。\n* 分别是 `[2][0]`\
  \ 和 `[3][1]`。\n\n## 循环目标\n\n- 5.1 | 创建 `while` 循环\n- 5.2 | 创建 `for` 循环\n- 5.3 |\
  \ 创建 `do-while` 循环\n- 5.4 | 比较循环\n- 5.5 | 使用 `break` 和 `continue`\n\n循环越复杂，我们覆盖所有目标的效果越高。\n\
  \n### 循环规则\n\n- **提醒：** 循环越诡异，概率越高。\n- **核心规则：**\n    - 标准的 `for` 循环最通能。\n    -\
  \ `do-while` 至少执行一次。\n    - `break` 语句跳出循环。\n    - 可以出现嵌套循环。\n    - `for(i = 0;\
  \ i < n; i++)` 终止时，`i` 的值为 `n-1`。\n    - `for` 循环的任何部分都可以移动到循环体中。\n    - `ForInit`\
  \ 部分接受链赋值（变量必须是相同类型）。\n    - `for(;;)` 被处理为 `for(;true;)`。\n\n- `try` 块中的 `for`\
  \ 循环没有“陷阱”，它只是空闲地运行下去，编译器信任我们。\n\n- 编译器将 `for(;;)` old 为 `for(;true;)`。\n- 无限循环会导致后续语句不可达。\n\
  - 这条规则看起来显而易见，但无限循环很棘手：只有当 1) 布尔表达式可以在编译时求值，且 2) 没有跳出循环时，代码才会抛出“不可达语句”错误。\n\n- 第\
  \ 5 到第 7 行的 TCF 结构更有趣：尽管 `try` 块中的 `for` 循环没有陷阱并只是空闲地运行下去，但编译器相信我们，理论上仍存在异常的可能性，因此有一种将控制转移出循环的方法。然而，这种技巧仅在\
  \ `catch` 指定了 RTE 或扩展的 `Throwable` 或 `Exception` 时才有效。\n\n\n\n\n移除 `catch` 块将导致第\
  \ 8 行编译失败，因为 TCF 结构被视为一个单一块 → 编译器看到该块包含一个“无法逃逸”的死循环，后面紧跟着另一条语句 → 因此该语句是不可达的。\n\n\
  如果你觉得这些内容太奇特了，让我告诉你我在考试中确实遇到过一个包裹在 `try` 块中的 `while(true)` 循环……别担心，我们将在第 II.8 节，*处理异常*\
  \ 中再次介绍这种场景。\n\n![](img/00012.jpeg)循环并不需要大括号 `{}` → 注意：代码的业务逻辑可能会受到影响。\n\n![](img/00012.jpeg)`\
  \ `continue` 仅在循环内部有效；任何循环均可，包括 `for-each`、`do-while` 和 `while`。\n\n![](img/00012.jpeg)标签（Labels）：\n\
  \n![](img/00059.jpeg)可以添加到\n- 子块；\n- 任何循环结构，如 `for`、`for-each`、`while` 或 `do-while`；\n\
  - 条件结构，如 `if` 和 `switch`；\n- 表达式和赋值语句；\n- `return` 语句；\n- TCF 结构，以及\n- `throw` 语句。\n\
  \n![](img/00059.jpeg)不能添加到变量的声明中。\n\n虽然带标签的 `break` 通常用于循环，但在循环外仍然有效（例如，在 `if` 结构等中）。然而，请注意它的作用域，因为它可能会导致“不可达语句”错误。\n\
  \n带标签的 `break` 需要一个块或一个包含至少一条 `break label;` 语句的 `if` ：\n\n![](img/00363.jpeg)\n\
  \n由于标签绑定到循环或块，在它们之外标签就超出了作用域 → 编译错误。\n\n| **推论：** | 如果有带标签的 `continue`，它必须始终位于标签声明的循环内部。\
  \ |\n\n![](img/00012.jpeg)`for-each` 循环通常用于遍历如 `Lists` 之类的 `Collections`（集合）。然而，它不能用于：\n\
  \n![](img/00059.jpeg)初始化或修改数组的元素；\n![](img/00059.jpeg)删除 `Collection` 中的元素；\n![](img/00059.jpeg)在同一个循环内遍历多个集合或数组。\n\
  \n![](img/00012.jpeg)嵌套循环——交互规则：\n\n![](img/00059.jpeg)使用 `break` 退出内部循环；\n![](img/00059.jpeg)使用\
  \ `continue` 放弃内部循环的当前迭代；\n![](img/00059.jpeg)使用带标签的 `break` 退出外部循环；\n![](img/00059.jpeg)使用带标签的\
  \ `continue` 跳过外部循环的迭代。\n\n![](img/00012.jpeg)额外：：当 `if` 结构没有被包裹在循环或 `switch` 中时，是不可能跳出的，除非\
  \ `break` 语句是有标签的（已演示）：\n\n![](img/00364.jpeg)\n\n![](img/00012.jpeg)额外：`while`\
  \ 表达式接受赋值：\n\n![](img/00365.jpeg)\n\n![](img/00012.jpeg)额外：`while` 不接受变量声明；但可以使用方法调用。\n\
  \n![](img/00012.jpeg)额外：标准 `for` 循环的 ForUpdate 部分仅允许以下内容：\n- 赋值表达式；\n- 前置/后置增/减操作；\n\
  - 方法调用；\n- 类实例创建；\n\n![](img/00012.jpeg)额外：`while` 和普通的 `for` 不能将显式的 `false` 作为它们的终止条件^(78)，但\
  \ `do-while` *可以*。\n\n此外，`while(!true)` 无法编译——因为 `!true` 是一个可以在编译时评估的直接常量——但 `while(!(x=true))`\
  \ 可以可以的。标准的 `for` 也是如此：\n\n![](img/00366.jpeg)\n\n备注：`if(false)` 是该规则的例外（为了让 `if(DEBUG)`\
  \ 可用）。\n\n![](img/00012.jpeg)额外：在增强型 `for` 循环的变量声明部分不能使用现有/预定义的变量。有趣的是，这个变量（即使是原始类型！）也可以是\
  \ `final`^(79)。事实上，这是增强型 `for` 声明内部允许的唯一修饰：\n\n![](img/00367.jpeg)\n\n![](img/00012.jpeg)额外：标签是“可回收”的（因为一旦它们绑定的块或结构结束，它们就会跳出作用域）：\n\
  \n![](img/00368.jpeg)\n\n![](img/00012.jpeg)额外：陷阱模式：\n\n![](img/00059.jpeg)`i =\
  \ i++;` 永远不会递增.^(80)\n\n![](img/00059.jpeg)任何循环中的 `break-continue` 都会导致后续语句不可达\n\
