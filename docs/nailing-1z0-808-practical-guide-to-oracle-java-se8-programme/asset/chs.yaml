  可用选项强烈暗示了 `import` 方面的问题；此外，`Raspi` 类缺少其中任何一个，所以我们任务的本质显而易见。另一方面，考试非常喜欢向我们推卸冗余或语法错误的\
  \ `import`，因此在涉及位于不同包的数据类型之间交互的问题中，从 `main()` 开始并执行流要安全得多。\n\n`Raspi` 的 `main()`\
  \ 调用了 `assemble()`，后者引用了 `Peripherals` 中的一个构造函数和一个特定的 `writeImage()` 方法，而该方法在 `Raspi`\
  \ 中并未定义 → 这是 `writeImage()` 是 `static` 的明显迹——当然，前提它的调用本身是有效的 → 查看 `microSD` 确认：是的，该方法*是*\
  \ `static` 的 → 我们只需要在给定选项中寻找 `import static`^(50) → A、B 和 C 立即被排除。\n\n现在，选项 D 正确地导入了一个\
  \ `static` 方法 → 我们甚至可以将其与选项 E 进行对比，后者尝试执行相同的操作但在方法名后使用了 `()` —— 这是不允许的 → 完成。\n\n\
  在复习阶段，我们检查选项 D 中的第二行代码 → 噢 是的，它使用了完全限定名，因此不需要从 `peripherals` 包中导入任何内容。现在让我们双重确保所有其他选项确实都是错误的。\n\
  \nE 是错误的，我们已经知道了。那么 A 呢？它的第二行代码是有效的，但对 `writeImage()` 的调用仍然需要类名——或对象——而我们什么都没有。\n\
  \n选项 B 被排除，因为它的第二个 `import` 在类名后使用了通配符，就好像它是一个包一样。\n\n选项 C 确实引用了 `writeImage()`\
  \ 的类名，但编译器仍然不知道去哪里寻找这个类，因为缺少了 `import` 语句。\n\n当一切准备就绪后，程序输出 OK…… OK…… 它运行了！\n\n\
  ***\n\n^(40) 有人也将它们称为*类字段*，但我们不会这么做。毕竟，JLS（Java 语言规范）并没有“类字段”的概念；它只提到了“*超*类字段”，从语境来看，这个术语指的是在超类型中定义的实例字段。\n\
  \n^(41) 好了，好吧，构造函数不是类成员，我承认。为了简洁起见，我们就假设它们是吧。\n\n^(42) 参数是在调用时传递给方法的值，而参数是方法处理的实际值。或者你可以这样想：参数（args）定义在签名中，参数（params）用在调用中。许多人没有看出其中的区别；OCA\
  \ 考试也不会测试这一点；但对于 OCP 是需要的。\n\n^(43) 它通过提供基本类型、系统方法、广泛使用的类（如 `String`、`StringBuilder`、`Math`\
  \ 等）、线程和异常提供了语言支持。包含 104 种数据类型（至少在 1.8 版本中）。\n\n^(44) 与 C/C++ 中的 `#include` 指令不同（后者让编译器查找标准库并将头文件中复制代码到程序中，从而增加了程序大小，浪费内存和\
  \ CPU 时间），`import` 语句让 JVM 查找 Java 标准库，在其中执行代码并将结果替换到程序中。由于没有代码被复制，也没有内存或处理器资源的浪费，Java\
  \ 的 `import` 可以被认为是比 `#include` 更高效的机制。\n\n^(45) 顺便说，我在考试中没有遇到 `Arrays.binarySearch()`\
  \ 方法；这就是为什么本指南没有涵盖它。\n\n^(46) Alan 在发明“面向对象”术语时曾评论道它实际上应该是“面向对象”\n\n^(47) 加上构造函数和实例，这些家伙不是类成员。\n\
  \n^(48) 标识符不能以数字开头。对于下划线 _ 和美元符号 $，它们允许出现在开头。考试中有一个题目的变量名以数字开头。一旦你发现了它，就可以忘记标识符中的陷阱。\n\
  \n^(49) 为什么是 `import static` 而不是 `import`？\n\n^(50) 因为调用省略了名称。\n\n^(51) 标识符长度没有限制。\n\
  \n![](img/0019.jpeg)\n\n**该组中的 8 个目标：**\n\n由于前两个目标密切相关，我们将它们放在一起讨论。\n\n2.1 声明并初始化变量（包括基本类型的转换）\n\
  \n2.2 区分对象引用变量和原始类型变量\n\n2.3 知道如何读写对象字段\n\n2.4 解释对象的生命周期（创建、通过赋值解除引用和垃圾回收）\n\n2.5)\
  \ 开发使用包装类（如 `Boolean`、`Double`、`Integer`）的代码\n\n![](img/0061.jpeg) **核心规则（及额外）：**\n\
  \n声明变量是通过指定数据类型并为变量提供有效的标识符（即名称）完成的。\n\n标识符不能以数字开头。对于下划线 _ 和美元符号 $，它们允许出现在开头。考试中有一个题目的变量名以数字开头。\n\
  \nJava 关键字（如 `switch` 等）不能用作标识符。\n\n字面量是固定值，不需要进一步计算即可赋值给任何变量，只要该变量是兼容类型。\n\n数值字面量用于表示数值，可以在数字之间包含下划线，并以\
  \ 1–9、0、0x、0X、0b 或 0B 开头（其中 0 代表零）。\n\n当多个变量共享类型时，可以在同一个语句中声明并初始化它们。\n\n\n\n\n\n\
  ![](img/00012.jpeg)\n\n`Non-final` 非局部变量不需要显式初始化：它们在对象实例化（对于实例字段）或类初始化（对于 `static`\
  \ 字段）期间会自动初始化为相应的默认值（该默认值取决于涉及的数据类型）。`final` 变量强制要求显式初始化（已在考试目标 6.3，*创建和重载构造函数，包括对默认构造函数的影响*中进行更详细的讨论）。\n\
  \n额外：`final` 类中的方法实际上是 `final` 的，因为显然无法重写或隐藏它们；但对于字段，它们并不是隐式的 `final` 的：\n\n![](img/00120.jpeg)\n\
  \n![](img/00012.jpeg)局部变量（包括循环变量）在使用之前必须进行显式初始化。\n\n![](img/00012.jpeg)Java 类型的类型构建块是所谓的原始类型，它们由语言预定义。Java\
  \ 不允许用户定义原始类型。\n\n![](img/00012.jpeg)该语言定义了八种原始数据类型 – `byte`、`short`、`int`、`long`、`float`、`double`、`char`\
  \ 和 `boolean` – 可以分类如下：\n\n![](img/00059.jpeg)数值：\n\n– 整数类型\n– 浮点类型\n\n![](img/00059.jpeg)boolean\n\
  \n![](img/00012.jpeg)数值类型：\n\n![](img/00059.jpeg)数值类型可以存储整数或浮点值。\n\n![](img/00059.jpeg)`byte`、`short`、`int`\
  \ 和 `long` 可用于存储整数。\n\n![](img/00059.jpeg)`byte`、`short`、`int` 和 `long` 分别分配 8、16、32\
  \ 和 64 位来存储它们的值。\n\n![](img/00059.jpeg)`float` 和 `double` 可用于存储浮点值。\n\n![](img/00059.jpeg)`float`\
  \ 和 `double` 分别分配 32 和 64 位来存储它们的值。\n\n![](img/00059.jpeg)整数字面量的默认数据类型是 `int`。\n\
  \n![](img/00059.jpeg)要将整数指定为 `long`，我们在字面量值后附加 `L` 或 `l`。\n\n![](img/00059.jpeg)数值值可以用二进制、八进制、十进制和十六进制格式存储。\n\
  \n![](img/00059.jpeg)十进制字面量使用 0 到 9 的数字。八进制字面量使用 0 到 7 的数字（共 8 个数字）。十六进制字面量使用 0\
  \ 到 9 的数字和 A 到 F 的字母。二进制字面量使用数字 0 和 1。\n\n![](img/00059.jpeg)八进制字面量必须以 0（零）为开头，十六进制字面量以前缀\
  \ `0x` 或 `0X` 开始，二进制字面量以 `0b` 或 `0B` 开始。\n\n![](img/00059.jpeg)浮点值的默认数据类型是 `double`。\n\
  \n![](img/00059.jpeg)要将整数或浮点值指定为 `float`，我们在字面量值后添加后缀 `F` 或 `f`。\n\n![](img/00059.jpeg)后缀\
  \ `D` 和 `d` 可用于将字面量标记为 `double` 值。\n\n![](img/00059.jpeg)`char` 数据类型存储为无符号正整数。\n\
  \n![](img/00059.jpeg)`char` 可以存储单个 16 位的 Unicode 字符，范围从 `'\\u0000'`（或 0）到最大 `'\\\
  uffff'`（或 65,535），包含。\n\n![](img/00059.jpeg)当将符号赋值给 `char` 时，Java 存储其整数等效值。因此，允许给\
  \ `char` 分配正整数值而不是符号（例如，使用 `char ch = 97` 来存储字母 ‘a’）。\n\n![](img/00059.jpeg)要将符号赋值给\
  \ `char` 变量，我们使用单引号：`char ch = 'a';`\n\n![](img/00012.jpeg)数据类型 boolean：\n\n![](img/00059.jpeg)`boolean`\
  \ 可以存储只有两个可能值的数据，`true` 和 `false`，这些也被用作字面量值。\n\n![](img/00059.jpeg)与其他某些编程语言不同，Java\
  \ 不将数值字面量 1 和 0 视为有效的 `boolean` 值。\n\n![](img/00012.jpeg)转换：\n\n![](img/00059.jpeg)转换是强制使变量表现像另一种类型的变量的过程。转换适用于原始变量和引用变量，并且可以是隐式的或显式的。\n\
  \n![](img/00059.jpeg)由 Java 编译器内部完成的自动转换称为隐式转换。隐式转换用于将窄的数据类型转换为宽的数据类型。\n\n![](img/00059.jpeg)由程序员完成的转换称为显式转换。在将宽的数据类型转换为窄的数据类型时，必须进行显式转换。\n\
  \n![](img/00059.jpeg)将窄的数据类型转换为宽的数据类型称为拓宽，而将宽的数据类型转换为窄类型称为收窄。拓宽是安全的，收窄需要显式转换。\n\n\
