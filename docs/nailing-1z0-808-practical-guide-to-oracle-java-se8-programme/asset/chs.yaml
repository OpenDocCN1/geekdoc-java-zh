  \n## 问题 6.8 – D\n\n**给定：**\n\n![](img/00480.jpeg)\n\n**结果是什么？**\n\nA. double: 1.0\n\
  \nB. int: 1\n\nC. String: 1.0\n\nD. 编译失败\n\n方法重载不正确：它们都接收一个 `double` 类型的参数。这就是为什么编译器生成了两次相同的错误信息，“method\
  \ `run(double)` 已在类 `OverloadTester` 中定义”。\n\n## 问题 6.9 – AD\n\n**在不返回值的方法体中，以下哪两个是有效的？**\n\
  \nA. 省略 `return` 语句\n\nB. `return null;`\n\nC. `return void;`\n\nD. `return;`\n\n\
  `return null` 确实返回了一个值。至于关键字 `void`，它只用于方法声明。最后，允许使用空 `return`。\n\n## 问题 6.10 –\
  \ C\n\n**以下哪一个是接收两个参数并返回值的合法声明？**\n\nA. `divide(int a) { return b; }`\n\nB. `double(int\
  \ a) { return b; }`\n\nC. `int(int a) { return b; }`\n\nD. `double(int a) { return\
  \ b; }`\n\nE. `void(int a) { return b; }`\n\nF. 以上均非\n\n选项 A 漏掉了返回类型，选项 B 指定的参数错误，选项\
  \ D 没有 `return` 语句，选项 E 尝试返回值。\n\n## 问题 6.11 – B\n\n**给定：**\n\n![](img/00481.jpeg)\n\
  \n**该类编译失败的原因是什么？**\n\nA. 没有 `setValue()` 方法\n\nB. `getValue()` 返回的数据不兼容\n\nC. `static`\
  \ 字段不能是 `private`\n\nD. `main()` 方法签名错误\n\n变量 `value` 的类型是 `double`，无法隐式转换为 `int`，为了让代码工作，我们可以显式地将\
  \ `value` 转换为 `int` 或将类型改为 `double`。\n\n## 问题 6.12 – B\n\n**给定：**\n\n![](img/00482.jpeg)\n\
  \n![](img/00483.jpeg)\n\n**结果是什么？**\n\nA. 10 20 30 40\n\nB. 30 20 30 40\n\nC. 抛出运行时异常\n\
  \nD. 编译失败\n\n数组 `a` 是 `static` 的，因此，该类的所有实例共享它。这就是为什么通过操作引用 `t2` 给 `a` 的第四个槽位赋值\
  \ 30，也会影响对象 `t1` 中的 `a[3]`。\n\n## 问题 6.13 – D\n\n**给定两个类：**\n\n![](img/00484.jpeg)\n\
  \n**类 B 中有多少行代码编译失败？**\n\nA. 无\n\nB. 一行\n\nC. 两行\n\nD. 三行\n\nE. 四行\n\n`private`\
  \ 变量 `d` 根据定义只在声明它的类内部访问。包权限变量 `c` 再次根据定义只对同一个包内的类可用。\n\n对于 `protected` 变量 `b`，无法通过\
  \ `obj` 访问，因为该对象的引用类型是 `A`。在下一节中，我们将更详细地讨论继承及其细微差别，所以现在只需要记住引用类型决定了哪些是可用的。作为 `protected`，变量\
  \ `b` 根据定义对同一个包内的类或派生自 **A** 的数据类型可用。由于 **A** 显然不是自己的子类，对象 **obj** 无法看到 **b**。\n\
  \n## 问题 6.14 – B\n\n**使用访问修饰符来保护类定义变量的 Java 概念名称？**\n\nA. 抽象\n\nB. 封装\n\nC. 继承\n\
  \nD. 实例化\n\nE. 多态\n\n\n\n\n这个问题看起来简单得惊人；然而，关于抽象（abstraction）与去封装（de-encapsulation）之间关系的精确性质，存在许多困惑。为了让事情变得更加复杂，`encapsulation`（封装）和`information\
  \ hiding`（信息隐藏）这两个术语经常混用，因此在理论上，实际考试中你可能会遇到关于`information hiding`的内容。我没有遇到，但谁知道你的情况会怎样……\n\
  \n`Harry Henderson`（2009 年）编写的《计算机科学技术百科》（Encyclopedia of Computer Science and Technology）提到，`封装`“……既保护代码免不受控制的修改或访问，又隐藏了那些只想使用功能的程序员不需要知道的信息（细节）”。显而易见，封装的范围远不止数据保护或数据隐藏。\n\
  \n如果你想了解更多，这里有一篇关于该主题的好读物，尽管它出版于四分之一世纪以前，那时 `Java` 甚至不存在：Berard, E. V. “Abstraction,\
  \ Encapsulation, and Information Hiding.” White paper, Berard Software Engineering,\
  \ Inc., Baithersburg, MD, 1991.^(94)\n\n## 问题 6.15 – B\n\n**给定：**\n\n![](img/00485.jpeg)\n\
  \n**结果是什么？**\n\nA. `a = 20, b = 60`\n`a = 60, b = 60`\n`a = 40, b = 60`\n\nB. `a\
  \ = 20, b = 60`\n`a = 60, b = 60`\n`a = 0, b = 60`\n\nC. `a = 20, b = 20`\n`a =\
  \ 60, b = 60`\n`a = 40, b = 40`\n\nD. `a = 20, b = 20`\n`a = 60, b = 60`\n`a = 0,\
  \ b = 60`\n\n这个问题与问题 6.12 相似，尽管这里我们处理的是基本数据类型。变量 `a` 和 `b` 在同一个构造函数中被显式初始化，但变量 `b`\
  \ 是 `static` 的，这使得情况复杂化。此外，打印语句仅在影响我们三个对象的所有操作执行后才会运行。\n\n当创建第一个对象时，两个字段都被赋予了相同的值\
  \ 20，因为非`final` 非局部变量是隐式初始化的，且 `if(0<20)` 结果为 `true`。当第二次调用构造函数时，`b` 的值（等于 20）仍然小于\
  \ `input`（等于 60），因此两个变量再次获得相同的值。由于 `b` 是 `static` 的，它的当前值 60 被两个对象共享。\n\n当构造函数初始化第三个对象时，情况发生了变化：由于\
  \ 40 小于 60，赋值语句没有执行。由于 `b` 是 `static` 的，因此对该类的所有实例共有，变量 `b` 保持等于 60，而变量 `a` 没有被显式初始化，因此保留了其默认值零。\n\
  \n## 问题 6.16 – B\n\n**给定两个类：**\n\n![](img/00486.jpeg)\n\n**在第 X 行插入哪个代码块将实现以下要求？**\n\
  \n1. 代码应成功更新用水账单（由变量 `bill` 表示），该账单定义为客户消耗的立方米数（变量 `m3`）乘以每立方米的水价（变量 `rate`）；\n\
  2. 代码还应保护变量 `bill` 免受篡改，例如尝试通过 `WaterConsumer` 类的实例来降低其值。\n\n![](img/00487.jpeg)\n\
  \n由于通过将实例字段设为 `private` 并提供 `public` 的 getter 和 setter 是实现封装的最佳方式，我们将通过有系统地应用这些原则来解决这个问题。\n\
  \n选项 C 可以立即被排除，因为 `updateBill()` 方法是 `private` 的，其他类都将无法调用它。\n\n选项 A 没有检查方法参数，这导致计算算法容易受到攻击：对象\
  \ `wcons` 可能会传递一个负值来试图降低水费。\n\n最后，尽管选项 D 在其 `updateBill()` 方法中确实进行了此类检查，但它仍然让变量\
  \ `bill` 处于完全开放的状态，因为任何人都可以带负参数调用公共方法 `calcBill()`。\n\n## 问题 6.17 – A\n\n**给定：**\n\
  \n![](img/00488.jpeg)\n\n**结果是什么？**\n\nA. `p1.count = 20, p2.count = 20`\nB. `p1.count\
  \ = 10, p2.count = 10`\nC. `p1.count = 10, p2.count = 20`\nD. 编译失败\n\n这个问题询问的是同一个\
