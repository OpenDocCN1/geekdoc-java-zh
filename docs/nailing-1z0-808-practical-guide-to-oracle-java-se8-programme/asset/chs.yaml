  \n我们学过从概念上讲，函数式接口只有一个抽象方法。这是为了允许像 `Comparator<T>` 这样的接口进行函数式处理。因此，接口定义一个与 `Object`\
  \ 同名的抽象方法并不算函数式的。\n\n好了，基本上关于 lambda 就到这里了。既然我们的书也快结束了，在讨论中增加一些点缀如何？然后我们就结束它……\n\
  \n考虑以下程序，它测试某些物种的游泳、跳跃或飞行能力：\n\n![](img/00859.jpeg)\n\n![](img/00860.jpeg)\n\n这就是代码的输出：\n\
  \n![](img/00861.jpeg)\n\n使用了多种方法来检查特征：跳跃的能力是用所谓的老式方法测试的，即通过显式创建一个返回 `boolean` 的\
  \ getter 方法；然后我们使用 lambda 表达式来检查动物的游泳能力；注意它可以有两种形式：我们直接在方法调用的代码行上编写 LE（第 54 行），或者使用持有相应\
  \ LE 的 `Predicate<Animal>` 变量（注释掉的第 55 行）。最后两个检查（飞行能力以及之后同时飞行和跳跃的能力）展示了流和复杂阶段过滤的使用，这得益于\
  \ `Predicate` 接口定义的额外方法。\n\n例如，将第 61 行替换为以下内容：\n\n![](img/00862.jpeg)\n\n将只选择那些能跳跃或飞行的动物（即鱼、袋鼠、猫、狗、鸟、兔子和瓢虫），而此行代码\n\
  \n![](img/00863.jpeg)\n\n将选择那些能跳跃但不能行的动物（即袋鼠、猫、狗和兔子）。这就是我们将 LE 分配给单独声明的 `Predicate`\
  \ 变量派上用场的地方，因为代码变得不那么混乱，因此更具可读性和可维护性……\n\n\n\n这本书实际上已经结束了，在任何其他情况下，我都会向你道别并祝你考试顺利。但现在，我选择引用马克·吐恩的话来作为最后的收笔：\n\
  \n让你陷入麻烦的不是你所不知道的，而是你深信不疑但并非如此的事。\n\n这里有一个像“大锤”一样的论点来强调这一点：\n\n位于 `C:\\Try_Java\\\
  tempa` 文件夹下的 `Daddy.java` 文件完整内容如下：\n\n![](img/00864.jpeg)\n\n位于 `C:\\Try_Java\\\
  org\\xlator` 文件夹下的 `Twin_1.java` 文件完整内容如下：\n\n![](img/00865.jpeg)\n\n位于 `C:\\Try_Java\\\
  org\\xlator` 文件夹下的 `Twin_2.java` 文件完整内容如下：\n\n![](img/00866.jpeg)\n\n### 尝试编译并运行\
  \ `Twin_1.java` 的结果是什么？\n\nA. `Daddy` 说了两次“Sweet dreams!”，且两个双胞胎都得到了晚吻\n\nB. 在 `Twin_1`\
  \ 类中编译失败，但在 `Twin_2` 类中成功\n\nC. 在 `Twin_2` 类中编译失败，但在 `Twin_1` 类中成功\n\nD. 两个类都编译失败\n\
  \n正确答案是选项 D：\n\n![](img/00867.jpeg)\n\n伙计们，这太好笑了。`kiss()` 方法确实是 `protected` 的，但毕竟，两个后代类都继承了\
  \ `Daddy`。那么为什么我们收到了两个错误，好像哪一个子类都无法访问合法继承的方法呢？如果你认为没得到亲亲的晚吻与 `Daddy` 及其双胞胎孩子住在不同的屋檐下有关，我可以给你们展示另一个更诡异的例子，这个例子使用了同一个包内的类。\n\
  \n看这里：我们创建的任何类都继承 `Object`，因此 `Object` 中定义的所有方法对每个类都是可用的；这是 Java 的基本常识。然而，以下代码抛出了类似的错误：“`clone()`\
  \ 在 `Object` 中受保护访问”：\n\n![](img/00868.jpeg)\n\n运行时发生了什么不是我们关注的；现在的问题是为什么第 5 行编译失败。\n\
  \n这个整个极其脑筋的谜团之所以出现，是因为人们对 Java 中 `protected` 访问权限的含义有一种极其流行但完全错误的观点。当被问到这个问题时，大多数人会忠实地念叨类似于\
  \ Oracle Java 官方教程中的以下这段话：\n\n`protected` 饰符指定该成员只能在其所在的包内访问（与包私有访问相同），并且还可以由另一个包中该类的子类访问。\n\
  \n那又怎样？我温和的读者烦地问。。定义是正确的，不是吗？噢，绝对正确。我的意思是，很多人并没有清楚地意识到它包含了*两个*条件，而不是一个关于类*位置*的条件。需要考虑的第二个条件是*谁*尝试访问该\
  \ `protected` 成员。\n\n当你回答这个问题时，你就会明白我的意思了：谁想要在第 5 行创建的对象上调用 `clone()`？是类 `A` 还是类\
  \ `B`？\n\n看到了吗？`clone()` 定义在 `java.lang.Object` 中 → 它只能通过 `Object` 直接继承链上的子类在 `java.lang`\
  \ 包之外访问 → `A` 和 `B` 处于并行但不同的继承链上 → 然而 `B` 想要调用一个属于不同数据类型的方法 → “不，先生，”编译器说，“虽然 `A`\
  \ 是你的兄弟，但它从 `Daddy-O` 那里继承了自己的东西，而你无权触碰不属于你的东西。所以管好你自己的事，别碰别人的财产。现在滚吧！”\n\n或者这样看：编译器维护着道德克隆标准：“你不克隆别人。只克隆你自己。”\n\
  \n下面的示例说明了 `B` 如何使用 `A` 作为代理；现在代码可以编译了，因为 `B` 实际上调用的是它自己的 `clone()`，即它继承的那个：\n\n\
  ![](img/00869.jpeg)\n\n可怜，可怜的 `B`：它仍然很不开心，因为它忘记了支持 `Cloneable` 接口并且不知道如何复制，但那是另一个故事了。\n\
  \n无论如何，我们对继承的诡计与痛苦的短暂旅行中应该记住的是（JLS, §6.6.2, *受保护访问的细节*）：\n\n对象的 `protected` 成员或构造函数只能由负责实现该对象的代码从其声明的包外部访问。\n\
  \n图示：\n\n![](img/0870.jpeg)\n\n所以，虽然第 1 行的 `protected` 让 `Test` 类正确地继承了 `One`，但第\
  \ 2 行相同的饰符却杀死了编译……\n\n现在去大显身手吧。祝考试好运。\n\n***\n\n- 不要将“字符串池”与“常量池”混淆，后者是在运行时分配的，且“……包含各种常量，从编译时已知的数字字面量。\n\
  \n\n\n\n[Functional Interface](https://docs.oracle.com/javase/8/docs/api/java/lang/FunctionalInterface.html)](https://docs.oracle.com/javase/8/docs/api/java/lang/FunctionalInterface.html)\n\
  \n你可以在附录 C 中找到没有行号的列表。\n\n`java.lang.Object` 没有 `private` 方法。\n\n[Access Control](https://docs.oracle.com/tutorial/java/javaOO/accesscontrol.html)](https://docs.oracle.com/tutorial/java/javaOO/accesscontrol.html)\n\
