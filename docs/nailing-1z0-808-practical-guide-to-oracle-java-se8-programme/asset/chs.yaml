  \n\n\n\n我承认：我曾想过使用用户自定义的可变数据类型来为你设置一个完美的陷阱，但实际考试使用的方式与问题 4.3 的呈现方式类似，因此最终选择了更好的一致性。然而，请记住，对引用进行操作的结果可能与对基本数据类型进行操作截然不同。\n\
