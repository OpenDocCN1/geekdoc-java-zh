  \n### 7.2 开发演示多态性的代码，包括方法重写以及对象类型与引用类型：\n\n![](img/00012.jpeg)一个对象可以表现出不同的形式，其行为在部分取决于指向该对象的引用。与被隐藏的方法和变量不同，被重写的方法在运行时会被其对应的重写方法所取代。\n\
  \n![](img/00012.jpeg)只有可继承的方法可以被重写 → `private` 方法只能被隐藏（hiding）。\n\n| **不同的表述方式**：\
  \ | 父类的 `private` 方法不具具多态性，且在编译时绑定 → 子类类型（actype）的版本不会触发。 |\n\n![](img/00012.jpeg)额外：抽象方法可以被重写。\n\
  \n![](img/00012.jpeg)从应考者的角度看多态的本质：\n\n![](img/00059.jpeg)要执行的版本根据实际对象的类型进行选择；\n\
  \n![](img/00059.jpeg)在 Java 中，所有非 `private` 且非 `final` 的实例方法调用都是虚拟的，并可能具有多态性；\n\n\
  ![](img/00059.jpeg)当子类方法与父类方法同名，但其业务逻辑与被重写的方法不同时，Java 多态得以实现。\n\n![](img/00012.jpeg)方法重写的规则：\n\
  \n![](img/00059.jpeg)两个方法必须具有相同的签名（signature），\n\n![](img/00059.jpeg)重写方法的访问权限不能更低，\n\
  \n![](img/00059.jpeg)重写方法不能声明任何新的或更宽泛的异常，\n\n![](img/00059.jpeg)返回类型必须是协变的（covariant）。\n\
  \n| **推论**： | 如果返回类型是基本类型，则重写方法的返回类型必须被覆盖方法的返回类型完全匹配。如果方法返回对象，重写方法的返回类型可以是被覆盖方法返回类型的子类。\
  \ |\n\n![](img/00012.jpeg)额外：类之间 `static` 与非 `static` 以及反之的转换永远无法通过编译：\n\n![](img/00525.jpeg)\n\
  \n![](img/00012.jpeg)`Actype` 对比 reftype:\n\n![](img/00059.jpeg)`Actype` – 运行时实际对象的类型\
  \ – 决定了内存对象中存在哪些属性。\n\n![](img/00059.jpeg)`Reftype` – 指向对象的引用类型 – 指定了哪些方法和变量是可访问。\n\
  \n| **战斗版**： | Reftype 决定什么可用，而 actype 决定什么运行。 |\n\n| **考试重点**： | 看到一个新对象？先评估它的\
  \ reftype：它会让你了解该对象能够做什么以及哪些是它无法的。 |\n\n![](img/00012.jpeg)与方法不同，变量不能被重写——但它们可以被隐藏（HIDDEN）：\n\
  \n![](img/00059.jpeg)使用哪个变量取决于引用类型 (RT)，即 `RT obj = new AT();` 的左侧，其中 `AT` 是 `RT`\
  \ 的子类；\n\n![](img/00059.jpeg)运行哪个方法取决于对象类型 (AT，右侧）：\n\n![](img/00526.jpeg)\n\n![](img/00012.jpeg)额外：当祖类的变量未被隐藏且在子类中被重新赋值时，该变量在祖类中的值也会改变。\n\
  \n| **推论**： | 如果变量是 `final`，则会导致编译错误（comperr）。 |\n\n![](img/00527.jpeg)\n\n如果变量是\
  \ `static` 的，输出将是 `Child Child Child Child`。\n\n![](img/00012.jpeg)额外：多态性也扩展到构造函数：\n\
  \n![](img/00528.jpeg)\n\n在这个示例中，**Parent** 的无参构造函数调用了方法 `greet()`，该方法是虚拟的，因此将根据重写版本执行。由于\
  \ **obj** 的 actype 是 **Child**，第一次调用 `greet()` 会打印变量 `str` 的默认值，而不是字符串 \" Hello!\
  \ \"，只有在对象完全初始化后，对同一方法的第二次调用才会输出 \" Hi! \"。\n\n请注意，从构造函数中调用可重写方法（如 **Parent** 的构造函数所做的那样）是糟糕的代码习惯，因为它在一个尚未正确构造的对象上调用了方法。\n\
