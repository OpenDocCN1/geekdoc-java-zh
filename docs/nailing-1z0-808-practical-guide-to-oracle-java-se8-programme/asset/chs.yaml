  \ 编译失败\nD. 错误\n\n这个问题对于我们的考试可能太高级了，遇到类似问题的概率应该很低；尽管如此，这个问题非常有趣，因为它让我们能更深入地观察接口。\n\
  \n看起来 `run()` 的两个版本之间存在冲突；嗯，这就是 Brian Goetz 在六多年前在 Open JDK 邮件列表上写过的：\n\n**规则 #1：类优于接口。如果父类链中的某个类对该方法有声明（具体或抽象），那么你就搞定了，默认方法是无关的。**\n\
  \n如果我们记得 `default` 方法的作用是备份，以防类没有提供此类方法的实现，也没有从其父类中继承这些方法，那么这条规则就完全合理了。\n\n所以 `Parent`\
  \ 的 `run()` 胜过 `Inter` 的版本 → 代码打印 Parent。\n\n![](img/00007.jpeg)\n\n由于与继承相关的问题极其难著称，让我们再次看看这些最重要的规则，它们可能会救你的急。\n\
  \n### 复习继承规则\n（当重写涉及 `static` 方法时要特别注意）\n\n1. 尝试重写非静态方法的 `static` 方法**始终 (ALWAYS)**\
  \ 是错误的，这包括所有 (ALL) 情况：整个继承链中的接口-接口、类-类或接口-类（参见备注）。\n2. 当涉及类与类之间的重写时，`static` 和非静态方法**绝不\
  \ (NEVER)** 兼容。提醒：另一方面，非静态接口方法可以重写父接口的 `static` 方法。\n3. **任何 (ANY)** 其他重写都是有效的，**除了\
  \ (EXCEPT)** 根本非法的“抽象静态”组合，忽略与返回类型和异常相关。注意，即使在实现情况下规则 1 也成立：\n\n![](img/0634.jpeg)\n\
  \n### 简单推论\n- 子接口可以重新声明 `default` 方法并将其设为 `abstract`。\n- 子接口可以重新声明 `static` 方法，但它不会构成重写。\n\
  - `static` 方法不能重写接口之间的 `abstract` 方法，但相反是允许的。对于变量，`static` 可能会隐藏非静态变量，反之亦然。\n\n\
  ### 再次，从另一个角度看\n字段和 `static` 方法不会被重写，因此对字段和 `static` 方法的访问是在编译时根据变量类型决定的（实例方法根据对象的实际类型运行）。\n\
  \n一个类不能继承两个都定义了相同签名 `default` 方法的接口，除非实现这些接口的类用 `abstract` 或具体方法重写了这两个方法。\n\n###\
  \ 关于 static / abstract 方法区别的更多\n接口定义行为，这种行为只通过非静态方法继承（简短的说法：接口 `static` 方法不被继承）。\n\
  \n![](img/0635.jpeg)\n\n在 `Parent` 类中定义的 `static` 方法在 `reftype` 为 `Parent` 时运行：\n\
