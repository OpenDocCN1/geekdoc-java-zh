  \ 且线程 \"main\" 出现异常 `java.lang.Exception`\n\n当行 `t1` 不抛出异常时，没有任何阻止最后的打印语句执行，而另一种情况会导致未捕获的异常沿调用栈向上传播。\n\
  \n### Problem 8.5 – ACE\n\n**Java 异常机制的优点是哪三个？**\n\nA. 改进了程序结构，因为错误处理代码与正常程序功能分离\n\
  B. 提供覆盖所有可能的标准异常\nC. 改进了程序结构，因为程序员可以选择处理异常的地方\nD. 改进了程序结构，因为异常必须在发生的方法中处理\nE. 允许创建针对特定程序定制的新异常\n\
  \nOracle 官方教程列出了“分离、传播和区分”这三个优点。在所有可能的情况下，实际措辞会有不同，因此你需要思考这三个概念可能意味着什么。\n\n此类基调的问题*确实*出现在考试的“核心”部分，因为我个人两次都遇到过。\n\
  \n### Problem 8.6 – AC\n\n**给定以下两个类：**\n\n![](img/00671.jpeg)\n\n![](img/00672.jpeg)\n\
  \n**结合哪两个修改将使代码通过？**\n\nA. 在第 15 行 `main()` 方法签名中添加 `throws Exception`\nB. 替换第 17\
  \ 行为：\n\n![](img/00673.jpeg)\n\nC. 在第 9 行 `printFile()` 方法签名中添加 `throws IOException`\n\
  D. 替换第 10 行为：\n\n```\nif (checkContents(file)) throw new IOException(\"Exception\
  \ raised\");\n```\n\nE. 替换第 18 行为\n\n```\nthrow new IOException(); }\n```\n\n\n\n\
  “捕获或声明”（Catch or Declare），也称为捕获或指定规则（CSR）：这是我们在考试中处理受检异常（ChEs）时每个情况下都要遵循的规则。让我们来看看这里；罪祸首在第\
  \ 10 行，而代码没有为它提供处理器 → 遵循 CSR，我们要么在此处放置一个 TCF 结构，要么更改 `printFile()` 的签名 → 可用选项没有列出能够成功处理抛出\
  \ ChE 的代码行的 `try-catch` 块 → 我们别无选择，只能在第 9 行声明 `throws IOException` → 选项 C 确定。\n\n\
  现在调用者（即 `main()` 方法）已被告知即将到来的攻击并必须采取适当的应对措施，是时候设置防御边界（`catch`）或者，如果不行的话，向总部（GHQ）发出警告（`throws`）了。\n\
  \n选项 B 提供了一些很有前景的内容，似乎适合捕获 ChEs，但仔细观察发现这段特定的代码是有错误的：`catch(Exception e)` 子句使得下一个\
  \ `catch` 无法访问，因为 `Exception` 的范围比 `IOException` 广 → 选项 B 排除。\n\n由于选项没有给我们提供适当的\
  \ TCF 结构来从内部保护 `main()`，我们必须声明 → 唯一与 `main()` 签名有关的选择是 A。我们在此立即停止，甚至不检查此选项是否确实正确，因为将有效性分析留给评审（Review）会更好；第一遍通过是为了节省时间……\n\
  \n出于好奇，对代码还可以做些什么来满足 CSR 呢？现在应该显而易见了，我们可以将第 10 行或第 17 行封装在 `try-catch` 块中，其 `catch`\
  \ 子句可以包含 `IOException`、`Exception` 甚至 `Throwable`；交换选项 B 中的 `catch` 子句也会有帮助。\n\n\
  ### 题 8.7 – ACD\n\n**给定以下接口定义：**\n\n![](img/00674.jpeg)\n\n**哪三个实现是有效的？**\n\n![](img/00675.jpeg)\n\
  \n控制方法重写的规则之一是，子类中定义的版本可能抛出新的 ChE。很好；那么在这种特定情况下，到底什么是“新的受检异常”呢？\n\n显然，它必须是未能通过 IS-A\
  \ 测试的东西。让我们有条理地检查选项，看看能发现什么。\n\n选项 A 抛出 `IOException` → 该选项没有违反方法重写的规则，因此是正确的。\n\
  \n选项 B 抛出 `Exception`，它是 `IOException` 的超类 → 我们不能说 `Exception` IS-A `IOException`，尽管相反成立\
  \ → 选项 B 排除。\n\n至于后两个选项，对于 `FileNotFoundException` IS-A `IOException` 来说它们都是正确的，因为\
  \ `IOException` 是它的父类，而选项 D 如此谨慎，完全没有抛出任何异常，甚至一个运行时异常（RTE）也没有。\n\n### 题 8.8 – C\n\
  \n**catch 子句的参数类型始终是：**\n\nA.`Exception`\nB.`Exception` 但不包括 `RuntimeException`\n\
  C.`Throwable`\nD.`RuntimeException`\nE.`CheckedException`\nF.`Error`\n\nJava 语言规范第\
  \ §11.1.1 节*异常的种类*提到，异常由 `Throwable` 类的实例（`Object` 的直接子类）或其一个子类的实例表示。\n\n### 题 8.9\
  \ – D\n\n**假设方法 `doStuff()` 可能会抛出一个未检查的异常。以下哪项是正确的？**\n\nA.此异常必须在 `doStuff()` 内部被捕获\n\
  B.此异常必须由 `doStuff()` 在其签名中声明\nC.对 `doStuff()` 的调用必须封装在 `try-catch` 块中\nD.不需要\n\n\
  JLS 提到，未检查异常类是运行时异常类和错误类；此外，未检查异常类免于编译时检查（参见 §11.2 节*异常的编译时检查*） → 选项 A 到 C 排除。\n\
  \n### 题 8.10 – A\n\n**给定：**\n\n![](img/00676.jpeg)\n\n**什么修改将使代码成功编译并运行？**\n\nA.\
