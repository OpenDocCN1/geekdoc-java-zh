  \ `-d` 选项来实现），`.class` 文件将存储在相同的目录中，`C:\\Try_Java\\org\\xlator`。\n\n现在变得很明显了，为了成功运行\
  \ `.class` 文件，我们只需要移动到文件系统层级中相应的目录，并从那里开始工作：\n\n![](img/00110.jpeg)\n\n### Problem\
