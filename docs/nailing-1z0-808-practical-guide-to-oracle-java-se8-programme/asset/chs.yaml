  \ 3\nD. line 4\n\n![](img/00061.jpeg) **核心规则（包含额外内容）：**\n\n### 7.3 确定何时需要强制转换：\n\
  \n![](img/00012.jpeg)当我们需要访问某些无法获取的成员时，我们使用强制转换使引用变量表现另一种类型：\n\n![](img/00535.jpeg)\n\
  \n回顾上一节的规则：“Reftype 决定什么可用，而 actype 决定什么运行”。尽管对象的实际类型是 **StringBuilder**，但我们无法对其调用\
  \ `append()` 方法，因为该方法对 **Object** 不可用 → 我们将变量 `obj` 从 **Object** 转换为 **StringBuilder**。\n\
  \n![](img/00012.jpeg)引用类型之间的转换规则：\n\n![](img/00059.jpeg)宽转换（向上转型：子类 → 父类）不需要显式转换。\n\
  \n![](img/00059.jpeg)窄转换（向下转型：子类 ← 父类）需要显式转换。\n\n**战斗版**：当 reftype 比 actype 窄时没看到转换？→\
  \ 编译错误！\n\n![](img/00012.jpeg)向无关类型强制转换：\n\n许多学习指南无条件地强调编译器不允许对无关类型进行强制转换。然而，有一个关于接口的例外：\n\
  \n![](img/00059.jpeg)无关类类型之间的转换*总是*非法的…… **← 考试重点**\n\n![](img/00536.jpeg)\n\n![](img/00059.jpeg)额外：将非\
  \ `final` 类型 (107) 转换为无关的*接口*类型*总是*有效的：\n\n![](img/00537.jpeg)\n\n上述示例中的 **Test1**\
  \ 类说明了尝试将 **Short** 转换为 **Integer** 时的编译错误：尽管所有的包装类都扩展同一个父类型 **Number**，但在继承关系上它们彼此是无关的。最后一条语句是有效的，因为\
  \ **Short** 是 **Number** 的子类。\n\n\n\n\n这种清晰且无歧义的图景在我们将一个非 `final` 类型强制转换为接口类型时就会破解，正如类\
  \ `Test2` 所示所示：尽管这三个数据类型彼此完全不认识，但两种强制转换都是可行的。自然，在运行时会抛出 CCE（类转换异常），但对于编译器来说，一切都非常顺畅。这是因为编译器假设在未来的某个晴朗的日子，其中一个接口（甚至是两个）都可能被\
  \ `Test2` 的后代类实现。\n\n现在你知道如果我们把 `Test2` 声明为 `final` 会发生什么了：由于该类不能有子类，第一次强制转换立即变为非法——而如果没有第一次转换，第二次转换也将无法工作……\n\
  \n| **推论**: | 通过非 `final` 类在两个相关的接口类型之间进行强制转换始终可以通过编译。 |\n\n![](img/00012.jpeg)\n\
  即使在进行了显式且有效的转换后，如果转换的对象实际上不是目标类的实例，JVM 很有可能在运行时抛出 `CastClassException`：\n\n![](img/00538.jpeg)\n\
  \n上述示例中的第一次转换可以通过编译，但对象 `o` 的实际类型是 `String` 而不是 `StringBuilder` → 因此类型冲突并在运行时产生\
  \ CCE。第二次转换也是同样的悲剧故事……\n\n另一方面，我们可以让引用指向同一个对象，这样向下强制转换就能成功执行：\n\n![](img/00539.jpeg)\n\
