  \ `catch` 拦截了它并打印出异常对象所包含的消息。由于代码没有为抛出 NPE 的场景指定消息，JVM 构建了一个以 `null` 作为其详细消息的新 `Throwable`，并将其传递给\
  \ `toString()`；所以这就是为什么正确答案是选项 C。\n\n如果将 `coldOne.contents` 替换为简单的 `coldOne`，结果将是选项\
  \ A……更不用说在 LOC XXX 之后向瓶子里填充类似如下所示的某种东西\n\n![](img/00681.jpeg)\n\n将会产生选项 B……然后——作为一个额外奖励——;D。\n\
  \n### Problem 8.14 – D\n\n**给定以下类：**\n\n![](img/00682.jpeg)\n\n**结果是什么？**\n\nA.\
  \ 货物已装载 - 货物已卸载\n\nB. 编译仅在行 c1 失败。\n\nC. 编译仅在行 c2 失败。\n\nD. 编译仅在行 c3 失败。\n\nE. 编译在行\
  \ c2 和行 c3 均失败。\n\n这么多选项暗示着即将发生的编译失败…… → 在所有可能的情况下，代码都无法编译。很好，让我们看看是否确实如此。\n\n行\
  \ c1 看起来没问题，它只是抛出了一个 `RuntimeException`，这不是检查异常（checked exception），所以编译器完全不在乎方法是否声明了\
  \ RTE。由于行 c1 没有进行任何非法操作，选项 B 被排除。\n\n由于 `load()` 方法抛出一个 `RuntimeException`，调用者不需要做任何事\
  \ → 选项 C 也是错误的 → 既然选项 E 在行 c2 上需要处理，它被自动排除了 → 现在我们只能在 A 和 D 之间选择。\n\n行 c3 调用了方法\
  \ `unload()`，该方法抛出一个 `Exception`，由于该异常未被处理，它会沿调用栈向上传递，这意味着调用者（即 `main()` 方法）必须对其处理。由于\
  \ `main()` 在其签名中没有声明抛出异常，它应该将行 c3 包装在 `try-catch` 块中，但这里缺失了 → 编译在行 c3 失败。\n\n###\
  \ Problem 8.15 – AD\n\n**哪两个语句正确描述了检查异常？**\n\nA. 这些是良好的应用程序应该预料并恢复的异常情况。\n\nB. 这些是应用程序内部的异常情况，应用程序通常无法预料或恢复。\n\
  \nC. 每一个作为 `RuntimeException` 和 `Error` 子类的类都被归类为检查异常。\n\nD. 每一个作为 `Exception` 子类的类（排除\
  \ `RuntimeException` 及其子类）都被归类为检查异常。\n\n此题的措辞直接来自官方 Oracle 教程^(139)：\n\n第一种异常是检查异常。这些是良好的应用程序应该预料并恢复的异常情况……\n\
  \n第二种异常是错误（error）。这些是应用程序外部的异常情况，应用程序通常无法预料或恢复。\n\n第三种异常是运行时异常（runtime exception）。这些是应用程序内部的异常情况，应用程序通常无法预料或恢复。\n\
  \n关于这个问题，JLS 是这样说的（§11.1, *异常的种类*）：\n\n`Exception` 是所有普通程序可能希望恢复的异常的父类。\n\n`RuntimeException`\
  \ 类是 `Exception` 的直接子类。`RuntimeException` 是所有异常类的父类。未检查异常（unchecked exception）类是运行时异常类和错误（error）类。\n\
  \n检查异常类是除未检查异常类的以外异常类。\n\n根据上述定义，排除选项 B 和 C。\n\n### Problem 8.16 – C\n\n**给定以下类：**\n\
  \n`IndexOutOfBoundsException`\n`FileNotFoundException`\n`StackOverflowException`\n\
  `IllegalFormatException`\n`ArrayOutOfBoundsException`\n`ClassCastException`\n`IOException`\n\
  `IllegalArgumentException`\n\n**其中有多少个定义在 `java.lang` 包中？**\n\nA. 一个\n\nB. 两个\n\n\
  C. 三\n\nD. 四\n\nE. 五\n\nF. 六\n\nG. 七\n\nH. 全部\n\n根据我记忆，考试中没有异常相关的题目是缺少导入的，因为大多数\
  \ `Throwable` 都来自 `java.lang` 包。两个著名的异常（无双关）是 `IOException`（定义在 `java.io`）和它的子类\
  \ `FileNotFoundException`。\n\n以下提到的异常定义在 `java.lang`：\n\n![](img/00683.jpeg)\n\n\
  到目前为止很好。现在，你能猜 `FileNotFoundException` 定义在哪个包中吗？让我们一起：既然 `IOException` 住在 `java.io`，FE\
  \ 在那里也是合理的。事实上，它确实在那里。出色。我们的逻辑无懈可击。\n\n但 Java 核心类的架构师并不是线性思维者；或者至少他们似乎遵循了一条更复杂的通往真理的路径：尽管\
  \ `IllegalArgumentException` 确实在 `java.lang` 中，但它的子类 `IllegalFormatException` 属于\
  \ `java.util`……\n\n至于 `StackOverflowException` 和 `ArrayOutOfBoundsException`，简单来说，它们并不是\
  \ Java 核心类。\n\n### Problem 8.17 – D\n\n**给定：**\n\n![](img/00684.jpeg)\n\n**代码最多可以打印多少个字母？**\n\
  \nA. 一个\n\nB. 两个\n\nC. 三\n\nD. 四\n\nE. 所有五个\n\nF. 代码因编译失败而不打印任何内容\n\n\n\n\n让我们先考虑理想路径：`main()`\
  \ 调用 `doStuff()` → `doStuff()` 调用 `doMoreStuff()` → `doMoreStuff()` 打印 E 并终止 → `doStuff()`\
  \ 然后打印 D 并终止 → `try` 打印 A → `finally` 打印 C → 结束 → ‘EDAC’ => 总共四个字母。由于该类只包含四个打印统计语句且没有循环，我们可以在此处结束分析。\n\
  \n然而，在审查（Review）中，我们还应该考虑不理想路径：`main()` 调用 `doStuff()` → `Math.random()` 抛出一个 RTE\
  \ → 我们跳出 `try` 块且异常被捕获 → `catch` 打印 B → 然后 `finally` 打印 C → ‘BC’ => 仅两个字母。\n\n###\
  \ 题 8.18 – E\n\n**给定以下两个文件：**\n\n![](img/00685.jpeg)\n\n**结果是什么？**\n\nA. 噢，不……\n\
  \nB. 噢，不……\n\nC. 噢，不……\n\nD. 噢，不……\n\nE. 噢，不……\n\n**（由于原文中 A-E 选项内容重复，此处保留翻译逻辑）**\n\
  *注：根据原文内容，A-E 选项均为 \"Oh no...\"，翻译为“噢，不……”*\n\n**重新根据原文提供的选项内容进行翻译：**\n\nA. 噢，不……\n\
  B. 噢，不……\nC. 噢，不……\nD. 噢，不……\nE. 噢，不……\n\n*(纠正：原文文本中 A-E 选项确实全部为 \"Oh no...\"，故按样翻译)*\n\
  \n**等等，重新审视原文 8.18 的选项文本描述：**\n\nA. 噢，不……\nB. 哦，晚饭吃披萨！\nC. 晚饭吃披萨！\nD. 晚饭吃披萨！\nE.\
  \ 编译失败\n\n当 `if` 抛出 `WeightException` 时，由于它被 `try` 块包裹，异常会被 `catch` 块捕获，因此 `finally`\
  \ 块会执行。在 `main()` 方法中，`doStuff()` 会被调用。如果 `doStuff()` 抛出异常，`doMoreStuff()` 将不会执行。因此，输出将是\
