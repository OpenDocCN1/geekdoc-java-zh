  \ 指的是实例而不是数据类型。\n\n然而，这个问题不会出现在实例变量上，因为变量永远不会被重写：它们只是被隐藏了。因此，为了访问祖先类的隐藏变量，我们通过使用类型转换来“取消隐藏”，例如\
  \ `((A)c).var`，即使该变量被 `B` 隐藏，也能得到在 `A` 中定义的变量。\n\n正如前面提到的，`super.methodName()` 是子类实例方法、实例初始化器、构造函数或实例变量初始化器调用父类方法的有效方法。但它只适用于类。\n\
