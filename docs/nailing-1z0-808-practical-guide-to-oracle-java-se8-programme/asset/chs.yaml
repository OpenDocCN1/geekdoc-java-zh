  \nJLS 继续说道：\n\n隐藏与*遮蔽（hiding）*不同，遮蔽适用于本可以被继承但由于子类中的声明而没有被继承的成员。\n\n现在谈谈遮蔽，它与隐藏的区别是：\n\
  \n\n\n简单名称（simple name）可能出现在可能被解释为变量名、类型名或包名的环境中。在这些情况下，§6.5 的规则规定，变量将优先于类型选择，而类型将优先于包选择。因此，有时无法通过简单名称来引用可见的类型或包的声明。我们称这种声明是*遮蔽的（obscured）*。\n\
  \n遮蔽最典型的情况是当字段（field）与包具有相同的简单名称时。在讨论问题 1.21 时，我们曾遇到过遮蔽的问题。\n\n![](img/00012.jpeg)\
