  \ 遗憾的是，“构造函数”一词可能具有误导性，因为构造函数并不“构造”（读作‘构建’‘组装’‘制造’‘生产’‘制作’或‘创建’）对象：它们是对对象进行初始化。构造函数的实际工作是确保新创建的对象处于有效状态；这通常通过将对象字段设置为某些值来实现。\n\
  \n![](img/00012.jpeg)构造函数类似于方法（例如，它们接受参数，可以重载，并可能抛出在 TCF 结构中需要处理的异常），但它们不指定返回类型，即使是\
  \ `void`也不行。此外，构造函数必须与它们的类同名。\n\n| | |\n| --- | --- |\n| **考试陷阱**： | 一旦潜在的构造函数指定了返回类型，编译器就不会再将其视为构造函数，尽管它与类名相同\
  \ → 每当你看到构造函数时，双倍检查它是否不是一个方法。在定义任何构造函数的类中，会隐式声明一个默认无参数构造函数。 |\n| **考试陷阱**： | 默认构造函数是编译器自动提供的\
  \ → 即使显式定义的构造函数没有指定参数，它也不能是默认构造函数。 |\n| | | 每当父类没有与其他构造函数并行定义无参数构造函数时，在子类的构造函数体（如果不以\
  \ `this()` 开头）中，必须提供对相应父类构造函数的显式调用。构造函数的访问权限与类相同。 |\n| **推论**： | 由于人类定义的无参数构造函数不是默认的，上述规则不适用于它。考试陷阱\
