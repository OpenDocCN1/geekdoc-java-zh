  \n答案看起来显而易见——甚至带有侮辱性。虽然这个特定问题确实很简单，但我想借此机会提醒你，在处理对象时我们应该始终保持警惕。\n\n这个问题之所以没有陷阱，是因为\
  \ `String` 类是不可变的，所以在第 13 行后，数组的每个元素仍然指向不同的对象。现在考虑当对象不可变为会发生什么：\n\n![](img/00344.jpeg)\n\
  \n第 7 行让两个元素指向同一个对象，就像题目 4.3 中的第 12 行所做。但与 `String` 的更改创建一个新对象不同，`StringBuilder`\
  \ 的更改反映在原始对象内部，这就是为什么第 10 行也影响了 **sbar**[0]。\n\n提醒：这里是考试的核心 Java 1.8 不变类列表：\n\n\
