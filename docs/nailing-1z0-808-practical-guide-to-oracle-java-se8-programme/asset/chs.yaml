  \ 0\na = 0, b = 0\n\nB. a = 1, b = 2\na = 3, b = 4\n\nC. a = 0, b = 0\na = 3, b\
  \ = 4\n\nD. a = 1, b = 2\na = 0, b = 0\n\n`run1()` 方法没有影响字段，因为它将传入的值赋值给了局部变量，这些变量在方法终止后就会消失。\n\
