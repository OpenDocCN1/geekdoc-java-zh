  \ JLS 的要求，而选项 C 是一个傲慢的冒充者，试图伪装成 `Throwable` 类。\n\n选项 D 是“捕获或指定要求”（Catch-or-Specify\
  \ Requirement）的另一种表述，选项 E 也是正确的，因为 JLS 确实提供了多 `catch` 子句^(136)，如下：\n\n![](img/00678.jpeg)\n\
  \n虽然多 `catch` 子句似乎不在 1Z0-808 考试中，但它们本身是非常有趣的物种，并提供了许多放置和布置精妙陷阱的机会。例如，单 `catch` 中的异常参数在效果上是显式的\
  \ `final` 的，而在多 `catch` 子句中它是隐式的 `final` 的，这可能会导致“断掉一根手指”。或者考虑以下示例：\n\n![](img/00679.jpeg)\n\
  \n尽管上面的 `catch` 子句看起来像是一个编写正确的多 `catch` 块（范围较窄的 `IOException` 在范围较宽的 `Exception`\
  \ 之前），但这段代码无法运行，因为多 `catch` 子句中的备选方案不能通过继承关系相关。仅供你参考。\n\n### Problem 8.13 – C\n\n\
  **给定：**\n\n![](img/00680.jpeg)\n\n**结果是什么？**\n\nA. 什么？！没啤酒喝了？\n\nB. 太棒了！\n\nC. `null`\n\
  \nD. 处于极致的幸福与宁静中显然，`TGIF` 类是可以编译的，所以我们只需要弄清楚 `try` 块抛出什么类型的异常，以及接下来会发生什么。由于三个潜在异常都在增强型\
