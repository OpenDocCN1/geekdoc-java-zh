  \ 4），而不是数组的元素。\n\n\n\n\n最后，选项 F 编译失败，因为变量 `i` 是局部变量，因此在使用它之前需要显式初始化。\n\n### 问题 5.10\
  \ – A\n\n**给定以下代码段：**\n\n![](img/00408.jpeg)\n\n**结果是什么？**\n\nA. `a : b : c : d\
