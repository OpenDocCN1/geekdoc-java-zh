  - 《Java 语言规范》，Java SE8 版，§15.12.2，*编译时步骤 2：确定方法签名*。\n- 《Java 虚拟机规范》，Java SE8 版，§4.7.9.1，*签名*。\n\
  - “……矛盾是一切运动和活力的根源”，《逻辑学》（1812），§956。\n- 在写本文时，该文章在此可用：[`www.tonymarston.co.uk/php-mysql/abstraction.txt`](http://www.tonymarston.co.uk/php-mysql/abstraction.txt)\n\
  - 然而，`public` 类中的非 `public` *构造函数* 如果是 `protected` 的，那么是可以访问的。记住这一点，好吗？\n- §12.4.1，*初始化何时发生*。\n\
