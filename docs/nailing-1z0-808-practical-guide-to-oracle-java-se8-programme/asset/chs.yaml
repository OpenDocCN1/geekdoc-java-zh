  \ D\n\n**给定：**\n\n![](img/00789.jpeg)\n\n**哪些语句将清空 bucket 对象的内容？**\n\nA. `bucket.empty();`\n\
  \nB. `bucket.clear();`\n\nC. `bucket.delete(0, bucket.size());`\n\nD. `bucket.delete(0,\
  \ bucket.length());`\n\nE. `bucket.deleteAll();`\n\nF. `bucket.remove(0, bucket.length());`\n\
  \nG. `bucket.removeAll();`\n\n这个问题显然关于容易混淆的方法。参考与考试目标 9.1 & 9.2 的表格来复习记忆，在有疑问时。\n\
  \n`String`、`StringBuilder` 或 `ArrayList` 都没有 `empty()` 方法。`clear()` 方法属于 `ArrayList`，`remove()`\
  \ 和 `removeAll()` 也是如此 → 我们在三个 `delete()` 版本中进行选择。\n\n`deleteAll()` 是为了迷惑你；并没有这种方法，它只是看起来很像\
  \ `ArrayList` 的 `removeAll()`。\n\n最后，由于 `size()` 定义在 `ArrayList` 中，而 `StringBuilder`\
  \ 与 `String` 一样使用 `length()`，我们得正确的结论：题 9.10 的答案是选项 D。\n\n### 题 9.11 – B\n\n**给定：**\n\
  \n![](img/00790.jpeg)\n\n**结果是什么？**\n\nA. Hi! I’m Javaline\n\nB. Hi! I’m Javalina\n\
  \nC. Hi! I’m Jevaline\n\nD. Hi! I’m Jeveline\n\n\n\n\n\n`replace()` 方法在 `String`（其中它被重载了，并接受*两个*参数——目标字符串后跟替换字符串，在两种情况下都是如此）和\
  \ `StringBuilder`（其中它没有被重载，且接受*三个*参数）中都有定义。`String` 中 `replace()` 最显著的特征之一是它替换目标的*每一个*出现处\
  \ → Javeline 中的每个 ‘e’ 都会被替换为 ‘a’。\n\n### Problem 9.12 – D\n\n**给定以下 `main()` 方法：**\n\
  \n![](img/00791.jpeg)\n\n**结果是什么？**\n\nA.true true\nB.true false\nC.false true\n\
  D.false false\n\n用双引号创建的 `String` 被放置在公共字符串池中；而其他所有内容——例如使用 `new` 关键字实例化的 `String`\
  \ 或在运行时计算的 `String`——并不是……\n\n上面的句子只是一个提醒；它与我们的问题没有直接关系，因为 `str.trim()` 返回一个完全新的对象（但仅在发生变化时如此），而在我们的案例中，它完全没有被使用\
  \ → `str` 仍然指向同一个对象。\n\n现在，`String` \" \" 和 \"\" 是否存在于公共池中并不重要：它们显然是不同的 → 并且由于 `String`\
  \ 中重写了 `equals()`，它比较的是不同的内容。\n\n### Problem 9.13 – B\n\n**给定：**\n\n![](img/00792.jpeg)\n\
  \n**其中几个打印了 `Hello Duke`？**\n\nA.无（None）\nB.一个\nC.两个\nD.三个\n\n第一个打印语句（stat）看起来相当自然。至于\
  \ `append()`，它只对末尾操作，所以即使它的参数看起来也很可疑。\n\n`add()` 使用得太频繁了，到目前我们应该记得它是 `ArrayList`\
  \ 领域的成员了。\n\n`set()` 方法是一个罕见的物种，但它的逻辑决定了它简单地将第一个元素替换为 Hello —— 而我们 `StringBuilder`\
  \ 中的第一个元素只是 ‘D’。尽管如此，如果它在一个正确的对象上被调用，它本是可以运行的，因为 `set()` 也属于 `ArrayList`……\n\n###\
  \ Problem 9.14 – C\n\n**给定以下代码片段：**\n\n![](img/00793.jpeg)\n\n**代码打印了多少次 `true`？**\n\
  \nA.一次也没有\nB.一次\nC.两次\nD.三次\n\n好了，当我们开始阅读代码时，立刻意识到两个对象都是不可变的，且 `str1` 是公共字符串池的成员，而\
