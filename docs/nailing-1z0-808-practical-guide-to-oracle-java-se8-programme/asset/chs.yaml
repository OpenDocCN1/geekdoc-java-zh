  \n程序将通过编译，并顺从地反复打印 `Done! -2147483648`：\n\n### 问题 5.13 – C\n\n**给定以下类：**\n\n![](img/00412.jpeg)\n\
  \n**在 X 行处插入哪条语句将使代码打印以下表格？**\n\n![](img/00413.jpeg)\n\nA. `int x = 2, y = 3, z\
  \ = 2;`\nB. `int x = 3, y = 2, z = 4;`\nC. `int x = 3, y = 0, z = 5;`\nD. `int x\
  \ = 4, y = 3, z = 4;`\n\n这个循环看起来很凶险，但人仍然希望最终一步一步地攻克它——这会浪费五分钟或更多时间，这是不可能的。所以不，不能走这条路；我们在这里真正的是策略性思维。请回我想过，代码越诡异，它在简单问题上设置陷阱的概率越高。然而，通过观察可用选项，我们可以得出所有行代码都是干净的，因为程序既编译成功也运行成功。好了，那么怎么办？嗯，是时候给你另一个提示了：如果代码既看起来很复杂又很干净，它内部总有一个弱点。找到它，戳戳一下——泡泡很快破了。让我们看看它是如何工作的。注意，打印一堆连线的语句是由任何构造结构管理的，这意味着它在每次迭代中的执行是有保证的\
  \ → 连线被打印了三次 → 总共三次迭代 → 由于 `i` 从 0 开始，`x` 必须是 3 → 选项 A 和 D 被排除……既然说到这里，让我们再重复一遍：在终止条件形式为\
  \ `myVar < ceiling` 的 `for` 循环内部，`myVar` 的值永远等于 `ceiling`。记住这个简单而强大的规则将让你表现得非常好；我在考试中应用了六次……好了，这里是另一个排除最后一个选项的逻辑链：打印的实际数字是\
  \ `k` 的值 → 总共有五个 → `while` 循环每次增加一位 `k` → `z` 必须是 5！\n\n### 问题 5.14 – B\n\n**给定以下类：**\n\
  \n![](img/00414.jpeg)\n\n**在第 3 行插入哪条语句将使代码打印 `a = 7`？**\n\nA. `int i = 6;`\nB.\
  \ `int i = 7;`\nC. `int i = 8;`\nD. `以上都不是，因为代码在第 5 行失败`\n\n自然地，这是一个小玩笑：第 5 行本应该写成\
  \ `for(;i-- > 0;)`。此外，将更新部分与终止条件结合并没有什么非法之处。\n\n### 问题 5.15 – B\n\n**给定：**\n\n![](img/00415.jpeg)\n\
  \n**结果是什么？**\n\nA. `0`\nB. `012`\nC. `012012`\nD. `编译失败`\n\n没有任何循环强制要求大括号（尽管它们会影响业务逻辑），所以代码编译得很好。现在让我们看看它是做什么的。这个……哦！等一下！你搞对结构了吗？X\
  \ 行的 `do` 和 `while` 属于两个不同的构造；如果重写，它是：\n\n![](img/00416.jpeg)\n\n很好；现在，两个循环的终止条件都取决于同一个表达式\
  \ → 两个循环将在完全相同点终止 → 打印操作执行了 `moons.length` 次 → 选项 A 和 C 是错误的。\n\n### 问题 5.16 – C\n\
  \n**给定以下类：**\n\n![](img/00417.jpeg)\n\n**结果是什么？**\n\nA. `0`\nB. `01`\nC. `012`\n\
  D. `程序运行但没有输出`\nE. `编译失败`\n\n`while` 循环在每次访问数组元素时都会打印 `a` → 三个元素 → 输出必须包含三个数字。`break`\
  \ 语句只是虚设的，因为它除了坐在那里试图装得很重要之外什么都没做；我们可以完全删掉它。\n\n### 问题 5.17 – D\n\n**给定：**\n\n![](img/00418.jpeg)\n\
  \n**结果是什么？**\n\nA. `1`\nB. `10`\nC. `程序进入死循环`\nD. `编译失败`\n\n任何循环的终止表达式必须求值为一个 `boolean`。\n\
  \n### 问题 5.18 – A\n\n**给定：**\n\n![](img/00419.jpeg)\n\n**有多少行代码编译失败？**\n\nA. `无`\n\
  B. `一行`\nC. `两行`\nD. `三行`\nE. `四行`\n\n第一个 `while` 的终止表达式生成一个 `boolean`，所以这一行是有效的。第二个\
  \ `while` 在编译时求值为 `while(true)`，这导致了死循环——这就是为什么我们需要 `break`，否则后续语句将无法到达。第三个 `while`\
  \ 没有特殊之处；执行流没有进入它。最后，尽管 `Test` 和 `String` 类型不兼容，`equals()` 方法接受任何 `Object`，因此它是有效的并产生一个\
  \ `boolean`。`Test` 和 `String` 不兼容在双等于运算符的情况下会起关键作用，但这是完全不同的故事……\n\n### 问题 5.19 –\
  \ C\n\n**给定：**\n\n![](img/00420.jpeg)\n\n**结果是什么？**\n\nA. `A D`\nB. `B D`\nC. `A\
