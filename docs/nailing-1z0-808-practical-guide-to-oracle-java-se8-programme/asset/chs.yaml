  \ `import` 语句是冗余的；尽管这不会引发错误。第 8 行是非的，因为 `package` 语句必须在 `import` 之前且只能出现一次。第 10\
  \ 行和第 11 行可以用一个语句替换：`import java.util.*;`，如被注释掉的第 9 行所示。\n\n第 12 行抛出编译错误：“具有相同简单名的类型已通过\
  \ Date 的单类型导入定义”。\n\n第 15 行是无效的，因为源代码文件命名错误（它本应该是 `I2.java`）。由此推导出，单个 `.java` 文件不能包含多个一个\
  \ `public` 类。\n\n第 20 行使用了变量 `list`，该变量在第 22 行才声明，但并没有编译错误，因为类的声明顺序并不重要。\n\n第 22\
  \ 行指定了接口 `List`的全限定名，并作为变量 `list` 的引用类型。我们也可以取消第 9 行的注释，因为全限定名的优先级高于通配符，不会产生冲突。\n\
  \n1.3 使用 main 方法创建 Java 应用程序；从命令行运行 Java 程序，包括控制输出\n\n![](img/00012.jpeg)在任何 Java\
  \ 类被 JVM 使用之前，必须将其编译成字节码：\n\n![](img/00065.jpeg)\n\nJava 类可以是可执行的或不可执行的。可执行的 Java\
  \ 类在类名（带有可选参数）传递给 JVM 时运行：\n\n![](img/00066.jpeg)\n\n![](img/00012.jpeg)为了可执行，Java\
  \ 类必须定义 `main()` 方法，又名“入口点”，JVM 从此处开始程序执行。\n\n![](img/00012.jpeg)`main()` 方法最常用的签名是：\n\
  \n```\npublic static void main(String[] args)\n```\n\n![](img/00012.jpeg)额外说明：同样接受变长参数\
  \ `public static void main(String... args)`\n\n![](img/00012.jpeg)为了使类可执行，其 `main()`\
  \ 方法必须既是 `public` 又是 `static`。\n\n![](img/00012.jpeg)类可以定义多个同名为 `main` 方法，只要它们的签名与作为程序入口点的\
  \ `main()` 方法签名不匹配即可。\n\n\n\n\n\n![](img/00012.jpeg)入口 `main()` 接收一个 `String` 类型的数组，该数组将包含类名之后命令行中指定的参数。事实上，`main()`\
  \ 方法使用这些参数的副本作为它的参数^(42)。\n\n![](img/00012.jpeg)参数从 `args[0]` 开始被引用。访问未传递的参数会导致运行时错误（RTE），即\
  \ `AIOOBE`。\n\n![](img/00012.jpeg)额外：`public static void main()` 中的 `String[] args`\
  \ 永远不会为 `null`。如果在不带任何命令行参数的情况下运行程序，`args` 将指向一个长度为 0 的 `String` 数组。\n\n## 1.4 导入其他\
  \ Java 包以便在代码中访问它们：\n\n关于导入 Java 包的许多规则在项目 1.2 *Java 类的结构* 中已经涵盖了，因为这些目标密切相关。现在让我们再次审视这些原则，同时注意一些重要的细节：\n\
  \n![](img/00012.jpeg)Java 代码通常组织成包，它们类似于文件系统的文件夹。\n\n![](img/00012.jpeg)要引用其他包包含的公共类或接口，我们可以使用：\n\
  \n–要么使用 `import` 语句，或者\n\n–使用类/接口的全限定名。\n\n![](img/00012.jpeg)任何 `import` 语句都不能放在\
  \ `package` 声明之前。\n\n`import` 语句可以以类的名称或通配符符号（即星号 `*`）结尾。\n\n如果 `import` 语句以星号 `*`\
  \ 结尾，则意味着代码想要访问该特定包中的所有 `public` 数据类型。\n\n相反，通配符符号并不提供对该包内部可能存在的任何子包的访问。\n\n![](img/00012.jpeg)`java.lang`^(43)\
  \ 包是编译器自动导入的唯一包。\n\n包可以包含多个子包，取决于程序员如何组织他们的类和接口。\n\n默认情况下，不同包和子包中的类和接口之间是互不可见的。\n\
  \n另一方面，同一个包内的所有类和接口之间是可见的。\n\n包名和子包名通过点运算符 `.` 链接在一起。\n\n`import` 语句仅仅是告诉编译器去哪里查找特定\
  \ `public` 类或接口的一种方便方法；它并没有“导入”任何内容^(44)，而是通过允许对其他包中定义的 `public` 类和接口使用简单名称来让我们的生活变得更轻松。\n\
  \n| **推论**： | 与其使用 `import` 语句相比，我们始终可以在代码中直接编写 `public` 类或接口的全限定名——但这很快就会变得繁琐。\
  \ |\n\n![](img/00012.jpeg)额外：这也意味着 `import` 语句不能用于访问具有相同简单名称但位于不同包的多个类或接口。这个问题可以通过以下方法解决，例如对一个冲突的类使用\
  \ `import` 语句，对它的竞争类使用全限定名。另一种方法是重新考虑你整个命名空间的架构。\n\n`import` 语句允许访问包的单个 `public`\
  \ 成员，或者访问它们的所有成员（通过使用上述通配符符号）。\n\n| ![](img/00012.jpeg) | **考试中的已知陷阱** | 如果数据类型不是\
  \ `public`，则无法被导入： |\n\n![](img/00068.jpeg)与访问文件系统子文件夹的星号不同，`import` 语句的通配符符号在子包上的工作并不相似。换句话说，`*`\
  \ 不导入子包。\n\n![](img/00012.jpeg)额外：如果源文件不包含 `package` 声明，则该类/接口被视为所谓默认包”的成员。\n\n\
  ![](img/00012.jpeg)额外：默认包的成员仅对包含默认包的相同目录下的类或接口可见。\n\n![](img/00012.jpeg)额外：属于默认包的类不能在任何命名的包类中使用，无论它是否定义在同一目录中。\n\
  \n![](img/00012.jpeg)可以通过 `import static` 声明导入类的单个公共 `static` 成员或其所有的公共 `static`\
  \ 成员。\n\n要导入 `static` 方法，我们必须只使用其名称，即不带括号。\n\n如果代码看起来整洁且行号已标记，当看到以下内容时要警惕：\n\n![](img/00012.jpeg)`List`\
  \ 和 `ArrayList`\n\n![](img/00012.jpeg)预测性 lambda\n\n![](img/00012.jpeg)相关的代码行数\n\
  \n![](img/00012.jpeg)`Arrays.asList()`^(45)\n\n![](img/00012.jpeg)`Collections`\
  \ 和 `Collections.sort()`\n\n### 1.5 比较和对比 Java 的特性和组件，如平台无关性、面向对象、封装等：\n\n![](img/00012.jpeg)Java\
  \ 是一种并发、基于类且面向对象^(46) 的计算机语言。面向对象开发的优势是：\n\n- 代码的模块化开发，提高了其健壮性；\n- 代码的可重用；\n- 代码在运行时更具灵活性动态性；\n\
  - 更好的代码可维护性。\n\n![](img/00012.jpeg)基于 OOP 的开发由许多内置支持，如封装、继承、多态和抽象。\n\n![](img/00012.jpeg)封装允许对象隐藏内部特征和实现细节。每个对象可以提供许多方法供其他对象访问，从而允许它们读取和更改内部状态。\n\
  \n![](img/00012.jpeg)封装通过使用访问修饰符来实现。\n\n![](img/00012.jpeg)封装的一些优势：\n\n- 每个对象的内部状态都可以保护；\n\
  - 封装提高了代码的可用性和可维护性，因为对象的行为可以独立地修改；\n- 封装减少了耦合，即类与类之间的交互，从而提高了设计的模块化。\n\n![](img/00012.jpeg)多态是根据底层数据类型实现行为的能力。多态数据类型是指其方法也适用于其他相关类型的类型。换句话说，我们可以使用同一个变量引用不同的类型，因此方法调用根据实际对象的类型执行不同的任务。\n\
  \n![](img/00012.jpeg)继承为对象提供了获取父类（也称为超类或基类）的字段和方法的能力。继承通过在现有数据类型上添加新功能而不修改它，进一步增强了代码的可重用性。\n\
  \n![](img/00012.jpeg)Java 不支持多继承。每个类被允许扩展一个类，但可以实现多个接口。\n\n\n\n\n\n![](img/00012.jpeg)\
  \ 附加：抽象允许根据数据类型的功能来开发，而不是根据实现细节。Java 提供了对抽象类的的支持，它们可以向外部世界暴露接口，而不包含所有方法的具体实现。基本上，抽象旨在将类的实现细节与其行为分离开来。\n\
  \n![](img/00012.jpeg) 附加：抽象与封装之间的区别：\n\n![](img/00059.jpeg) 抽象和封装是互补的概念：抽象处理的是对象的行为，而封装涉及该行为的实现细节。\n\
  \n![](img/00059.jpeg) 封装通常通过隐藏有关对象内部状态的信息来实现，因此可以被视为实现抽象的一种方式。\n\n![](img/00012.jpeg)\
  \ Java 是平台无关的，这意味着它允许开发可以在具有 Java 运行时环境（JRE）的任何平台上运行应用程序，而无需重写或重新编译。\n\n![](img/00069.jpeg)\
