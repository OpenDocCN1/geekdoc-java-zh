  \n### 1.1 变量的作用范围\n\n![](img/00012.jpeg) 基本上，作用范围是指变量可见的代码部分，换句话说，就是可以访问的部分。\n\n\
  变量可以在不同级别上操作，因此它们可以有多个作用范围：\n– 类级变量，\n– 实例变量，\n– 局部变量（包括循环变量），以及\n– 方法参数。\n\n局部变量通常定义在方法/构造函数的体以及子块中。\n\
  \n变量的作用范围受最近的一对匹配大括号 `{}` 的限制。例如，如果一个变量是在方法内部的子块中声明的，那么该局部变量的作用范围小于方法的作用范围。这个子块可以是一个\
  \ `if` 语句、`switch` 结构、循环、TCF 结构，或者仅仅是一组由匹配的大括号括起来的各种语句。\n\n局部变量在定义它们的方法或子块之外是不可可见的（即：它们无法被访问）。\n\
  \n实例变量在对象内部定义并可访问，这实际上意味着我们需要一个有效的对象来操作它们。同类的类的任何实例方法都可以访问这些实例变量。\n\n类级变量（又称 `static`\
  \ 变量）由类的所有实例共享；此外，即使没有该类的对象，也可以访问它们。\n\n方法参数由接受参数的方法使用。它们的作用范围被限制在定义它们的方法内部。\n\n\
  方法参数和局部变量不能共享相同的标识符，即名称。\n\n类变量和实例变量也是如此：它们不能使用相同的名称定义。\n\n另一方面，局部变量和类/实例变量可以使用相同的名称定义。如果一个方法定义了一个与类/实例变量同名的局部变量，则该局部变量会遮蔽（shadow）类/实例变量（换句话说，使其不可）。\n\
  \n有时变量的作用范围会相互重叠；确定一个变量是否可访问的唯一方法是识别它所属的块（通过查看大括号）。\n\n循环变量对于定义它们所在的循环来说是局部的。\n\n\
  所有变量一旦声明，就会进入作用范围。\n\n类变量只要程序运行，就会一直保持在作用范围内存。\n\n实例变量在对象被垃圾回收时离开作用范围。\n\n局部变量在声明它们的块结束时离开作用范围。\n\
  \n将这些规则列写在代码中：\n\n```\n(images/00062.jpeg)\n```\n\n第 2 行声明了 `static` 变量，它们存在于类级。这些变量在所有方法和类级块内部都是可见的。作为类成员，这些字段不需要显式初始化；`static\
  \ int` `y` 自动接收值 0。\n\n第 3–5 行定义了一个静态初始化块，它只处理静态成员。该块仅执行一次，即在类加载的那一刻。请注意，第 4 行的赋值语句在任何方法之外执行。\n\
  \n第 6 行声明了非静态变量，即实例变量（又称实例字段或对象字段），它们对所有方法和类级块都是可见的，除非它们被其他变量遮蔽。实例变量不需要显式初始化，`b`\
  \ 接收值 0。\n\n接下来是实例初始化块（7–9），它在每次创建对象时都会执行。与静态初始化类似，实例初始化块内部的语句在任何方法之外执行。\n\n第 10\
  \ 行声明了一个方法参数 ``int b`，它只在方法内部可见。请注意，这个局部变量 `b` 不会与实例变量 `b` 冲突；相反，它遮蔽了实例变量 `b`。\n\
  \n局部变量 `int c` 只在 `run()` 方法内部存在；与 `static` 实例变量不同，局部变量不会自动初始化，在使用它们之前必须进行显式初始化。\n\
  \n第 13–16 行的子块尝试声明两个与之前定义的变量同名的变量：`int c` 和 `int x`。然而，第 14 行无法编译，因为两个行前声明的 `int\
  \ c` 的作用范围与第二个 `int c` 重叠，且 Java 不允许对同一个变量重复定义。对于第 15 行的 `int x`，该变量仅对其所属的方法可见，所以没有问题。第\
  \ 15 行的 `int x` 在第 16 行之后消失。\n\n正如我们看到的，变量的作用范围受一对大括号的限制。然而，这个规则有一个例外，即 `for` 循环：它们的局部变量（又称循环变量）在左括号之前定义（参见第\
  \ 17 行或此 for-each 循环示例：`for(int i : intArray){}`).\n\n第 18 行愚蠢地尝试重新声明已知的局部变量 `int\
  \ a`，其作用范围从第 11 行开始到第 23 行结束。（再次提醒：由于被遮蔽，第 6 行的实例变量 `int a` 在此时仍然不在范围内。）\n\n\n\n\
  \n\n第 19 行的局部变量 `int` `e` 仅在 17–22 行的 `for` 循环内部可见。出题者非常喜欢这种陷阱，所以请注意。`d` 和 `e` 在第\
  \ 22 行之后就会失效。\n\n第四次重新声明 `int` `a`（用作 `run()` 的参数）的尝试在第 25 行成功了，因为我们处于另一个方法内部，其匹配的大括号限制了该变量的作用范围……*松了一口气！*\
