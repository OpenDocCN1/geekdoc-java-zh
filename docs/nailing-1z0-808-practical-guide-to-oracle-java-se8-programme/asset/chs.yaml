  \ §14.9.1, *The if-then Statement*）。\n- 值得注意的是，许多 Java 运算符的使用主要是因为它们的副作用。例如，`new`\
  \ 运算符具有创建对象的深远副作用。\n- 关于 `StrictMath` 类有一个例外：“当大小为 `int` 或 `long` 且需要检测溢出错误时，方法\
  \ `addExact`、`subtractExact`、`multiplyExact` 和 `toIntExact` 在结果溢出时会抛出 `ArithmeticException`”（参考\
  \ `StrictMath` API javadoc）。\n- “当且仅当”；JLS 的作者喜欢这种缩写。\n- 在 `String` API javadoc\
  \ 语言中：“Java 语言对字符串拼接运算符 ( + ) 提供了特殊支持”。\n- 第 3 版第 [9] 页（1997）。\n- `enum` 类型不在考试范围内。\n\
  - 正式定义：«一个*常量表达式*是一个表示原始类型值或 `String` 值的表达式»（JLS, §15.28）\n- 因为 `switch` 会对包装类拆箱，而自动装箱/拆箱发生在运行时……\n\
  - 狄拉克 δ 函数 $\\delta(x)$ 在 $x = 0$ 以外处的值…………不要被动学习，记得吗？\n- 第 5.11 节：[`docs.oracle.com/javase/specs/jls/html/se-11.html`](http://docs.oracle.com/javase/specs/jls/html/se-11.html)\n\
  \n![](img/00316.jpeg)\n\n## 4.1 & 4.2\n\n| 4.1 | 4.2 |\n| :--- | :--- |\n| 声明、初始化、使用一维数组\
  \ | 声明、初始化、使用多维数组 |\n\n![](img/00317.jpeg)\n\n### 核心规则\n\n- 一旦分配，所有元素都会根据声明的类型获得默认值：\n\
  - 整数类型 `byte`、`short`、`int` 和 `long` 为 `0`；\n- 浮点类型（`float` 和 `double`）为 `0.0`；\n\
  - `boolean` 为 `false`；\n- `char` 为 `'\\u0000'`；\n- 引用类型为 `null`。\n\n**推论：**\n- 使用打印语句访问未初始化的引用类型数组不会抛出\
  \ NPE\n- 适当分配的数组即使是局部变量且没有显式初始化，它*也会*被初始化。\n\n当将所有步骤合并为单一语句时，不允许定义数组长度，因为长度是根据赋值给数组的值的数量自动计算的。例如，在声明点使用初始化块时，无法指定数组长度：\n\
  \n![](img/00318.jpeg)\n\n不带 `new` 的初始化块仅在声明中有效：\n\n![](img/00319.jpeg)\n\n如果请求的索引不在元素的有效范围内，代码将在运行时抛出\
  \ `AIOOBE`。\n\n维度表达式首先求值（从左到右）。虽然数大括号乍看起来是检查维度一致性的可靠方案，但请务必小心，因为某些元素本身可能就是数组：\n\n\
  \n\n\n\n![](img/00320.jpeg)\n\n![](img/00012.jpeg)访问未定义维度的分配数组的槽会导致 NPE（空指针异常）：\n\
  \n![](img/00321.jpeg)\n\n![](img/00012.jpeg)在没有初始化块的情况下，高层维度*必须*被定义：\n\n![](img/00322.jpeg)\n\
  \n![](img/00012.jpeg)额外：要检查一个数组是否可以赋值给另一个数组，请检查槽所引用的维度数量，*而不是*右侧数组的长度：\n\n![](img/00323.jpeg)\n\
  \n![](img/00012.jpeg)额外：访问数组时，方括号左侧的表达式会在括号内表达式的任何部分之前求值。如果此求值异常终止，括号内的表达式将不会求值：\n\
  \n![](img/00324.jpeg)\n\n![](img/00012.jpeg)额外：传递给方法的变参数（vararg）将作为普通数组使用。例如，在基于变参数的\
  \ `main()` 方法调用中，编译器在内部将 `String`… 转换为 `String[]` → JVM 对变参数一无所知。它只看到 `String[]`。\n\
  \n![](img/00012.jpeg)额外：末尾逗号是可以接受的：`new String[]{\"Hi\",}`。这用于简化元素顺序的更改，特别是当它们被垂直书写时。\n\
  \n![](img/00012.jpeg)额外：Java 中没有真正的矩阵型多维数组，由于它们被实现为数组的数组，因此结构不可变性问题仅涉及第一维：\n\n![](img/00325.jpeg)\n\
