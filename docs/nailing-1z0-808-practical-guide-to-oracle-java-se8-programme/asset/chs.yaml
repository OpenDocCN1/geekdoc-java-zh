- "# Nailing 1Z0-808：Oracle Java SE8 程序员 I 认证实用指南\n\n\n\n![](img/cover.jpeg)\n\n![](img/00003.jpeg)\n\
  \n\n\n# 关于作者\n\n## Igor Soudakevitch\n**Igor Soudakevitch** 从未想过要写这本书；当上天狠狠地拍了他屁股一耳光时，他就那样一头扎了进去。尽管如此，虽然听起来可能很奇怪，《攻克\
  \ 1Z0-808》是一件充满热爱的结作；因为 Igor 离开代码无法生存。他在十一岁时就写了他的第一个程序，并且仍然保留着那卷老旧、发黄的穿孔带。\n\nIgor\
  \ 于 1990 年搬到日本，在东京工业学院担任研究员，从事的领域如今被称为应用纳米技术和纳米科学，但他后来改变了赛道，以完全投入他生活的另一个热情，即外语的翻译和学习。\n\
  \n在日升之国和机器人王国度过了十四难忘的年后，他回到了故乡莫斯科，在那里与家人一起生活，同时将英语、法语和日语的儿童读及诺贝尔奖获得者的著作翻译成母语，折腾\
  \ `Raspi` 和 `Arduino`，并撰写关于他最喜欢的艺术——编码和翻译的文章。\n\nTamaki，没有我一无所有。\n\n感谢你出现在我的生命里。\n\
  \n# 致谢\n\n我没有尝试在文中列出准备本指南时参考的所有权威机构和来源。这样做所需的空间比现有的的还要多。\n\n然而，如果没有某些个人，这本书的编写将完全是不可能的。我特别感谢\
  \ `Simon Roberts` 提供的优秀在线课程，感谢 `Paul Anilprem` 及其 `Enthuware` 同同事提供的卓越产品，更不用他们无处不在的支持，感谢\
  \ `CodeRanch` 的所有伙伴，他们帮助我看到 Java 之光并让我走到今天。\n\n![](img/00004.jpeg)\n\n*–妈妈？你为什么要嫁给白痴？*\n\
  \n*–你怎么能这么？！我们爸爸很聪明！看，他现在正在为 Java 认证做准备呢！*\n\n*–是的，但他为什么每隔分钟就大叫“我是一个白痴”呢？*\n\n#\
  \ 作者自序\n\n由于这是个人经历，因此带有主观偏见。如果接下来的内容听起来太武断，作者希望读者不要盲目相信书中可能发生的任何事情。\n\n\n\n\n\n\
  行号从 1 开始；完整内容，然后 → 需要验证导入列表是否列在包*之后*……检查 → 所有三个类都位于不同的包中 → 红色警报！红色警报！继承链中的某些类成员或构造函数可能无法访问……\
  \ → 啊！`TargetAudience` 确实继承了另一个类！一定有猫端…… → 现在看 `main()` 方法……对的，一个对象……嗯，`reftype`\
  \ 与 `actype` 不同……噢，我们现在正在调用另一个类的构造函数，不是吗？而且是在一个不同的包里？嗯，你知道的，那个 `ctor` 最好是 `public`\
  \ 的，否则没戏…… → 是的，正如我所料的那样：它是 `protected` → `TargetAudience` 中的 `LOC16` 将无法工作。搞定！\n\
  \n这里是编译器产生的实际错误信息：\n\n![](img/00006.jpeg)\n\n这整个推理链仅花了二十秒钟，而且无论你面对的是什么问题，你以后在考试中都能做到这一点——前提是你已经顺利通过了这个包含所有障碍关卡的\
  \ OCA 强化训练营。\n\n这本书只有一个目的：磨炼你可靠且快速解决考试题目的技能；因此，它甚至没有尝试取代一份完整的 Java 学习指南。理想情况下，*攻克\
  \ 1Z0-808* 应该成为你的桥头堡，从那里发起最后的进攻，赢得梦寐以求的“Oracle 认证程序员 I”头衔。这整个调优、加油和弹药准备阶段不会超过三周。然而，为了从中充分获益，你应该已经熟悉\
  \ Java 基础知识，所以请找一本靠谱的教程，在线学习或观看^(1) 视频课程等；*前言*中列出了一些可靠的书目。\n\n![](img/00007.jpeg)\n\
  \n我非常想听听你的考试表现如何。请抽时间告诉我你的分数以及你错过了哪些目标。欢迎任何评论和建议。\n\n[www.igor.host](http://www.igor.host)\n\
  \n* *\n\n^(1) 你可以在 MIT、伯克利大学分校等地方找到免费的 Java 在线课程。但要远离 YouTube：它没有质量控制。\n\n## 缩写与术语\n\
  \n- `actype` – 运行时的实际对象类型\n- `assop` – 赋值运算符；大多用于泛指，代赋值语句\n- `castype` – 显式类型转换括号内指定的数据类型\n\
  - `comperr` – 编译错误\n- `ctor` – 构造函数\n- `def` – 定义\n- `dim` – 维度\n- `initer` – 初始化器\n\
  - `initing` – 初始化\n- `op` – 运算符\n- `paramlist` – lambda 表达式中的形式参数列表\n- `preditype`\
  \ – 泛型 `Predicate` 括号内指定的数据类型\n- `reftype` – 引用类型\n- `refvar` – 引用变量\n- `sout` –\
  \ 任何打印语句，如 `System.out.println()` 等\n- `stat` – 语句\n- `ternop` – 三元运算符；经常用于泛指三元语句\n\
  - `var` – 变量\n- `AIOOBE` – `ArrayIndexOutOfBoundsException`（数组越界异常）\n- `CCE` – `ClassCastException`（类型转换异常）\n\
  - `ChE` – checked exception（受检异常）\n- `CSR` – Catch-or-Specify Requirement（捕获或指定要求）\n\
  - `DTPE` – `DateTimeParseException`（日期时间解析异常）\n- `E` – 异常（无论类型如何）\n- `IAE` – `IllegalArgumentException`（非法参数异常）\n\
  - `IOE` – `IOException`（输入异常）\n- `IOOBE` – `IndexOutOfBoundsException`（越界异常）\n-\
  \ `LDT` – Java 1.8 中任何新的日期/时间类（如 `LocalDate`、`LocalTime` 或 `LocalDateTime`）\n- `LOC`\
  \ – 代码行\n- `NFE` – `NumberFormatException`（数字格式异常）\n- `NPE` – `NullPointerException`（空指针异常）\n\
  - `RTE` – `RuntimeException`（运行时异常）\n- `SIOOBE` – `StringIndexOutOfBoundsException`（字符串索引越界异常）\n\
  - `TCF` – `try-catch-finally` 结构（不一定包含 `catch` 或 `finally`）\n\n![](img/00008.jpeg)\n\
  \n这个故事有一个满意的结局，数据类型在屏幕上流畅地流动，几乎像老实信赖的朋友一样对我点头。然而，有那么一刻，一点也不愉快；事实上，一切看起来都非常沮丧。\n\n\
  这是作者于 2016 年 5 月 20 日发布在 CodeRanch 论坛上的（为了提高读性进行了微调）：\n\n几天前，我的 1Z0-808 考试没通过，分考了\
  \ 62%。\n\n这应该给那些梦想着瞬间获得 Oracle 认证的人提个醒。好了，说说：\n\n我是从六个月前开始认真准备的。我做的第一件事就是辞职，字面意义上的辞职。\n\
  \n在断了自己的后路之后，我看着……不，那个词用错了；我刻苦地完成了 Simon Roberts 编写关于 1Z0-803 的完整视频课程，即 *Live Lessons*。每天花十到十二小时在上面。这花了我三周时间；没有假期，没有周末，什么都没有……为什么花这么久？因为我每隔几秒钟就会按下\
  \ *暂停* 来记笔记，思考 Simon 在说什么，最重要的是，把所有内容都写成代码。通过使用 `Notepad++`，在前两个月，我没有让自己启动 IDE。\n\
  \n很快，直接从命令行运行我的微型代码变得如此枯燥，以至于我修改了注册表，编写了一个可以在资源管理器中右键运行 `.java` 文件的极简启动器。这个技巧让我每天可以编写一百多个代码。\n\
  \n根据我的粗估计，到 2016 年 1 月中，我已经构思、扭曲、折磨了……然后我开始看书。以下是清单：\n\n- *OCA: Oracle Java SE 8\
  \ Programmer I Study Guide. Exam 1Z0-808* 作者 Jeanne Boyarsky & Scott Selikoff（我喜欢这本书，非常喜欢！尽管里面有很多类型错误，但仍然很好读）\n\
  - *OCA Java 7* 作者 Mala Gupta（我喜欢这本书，尤其是那些密集的复习笔记；顺便说一下，她的新书这次是关于 1Z0-808 的，很快出版）\n\
  - *Head First Java* 作者 Kathy Sierra & Bert Bates（看了几周就放弃了；原因：它的呈现方式让我神经紧张；在我看来，它是送给宿敌的完美礼物）\n\
  - *Thinking in Java* 作者 Bruce Eckel（第 6 版）（当然不是所有内容；我没有碰集合、内部类、线程等不在考试范围的高级主题）\n\
  - *Effective Java* 作者 Joshua Bloch（打算再读十遍；纯粹的享受）\n- *Java 8 Pocket Guide* 作者 Robert\
  \ & Patricia Liguori（我总是把这本书放在手边，每天咨询几十）\n- *Java in a Nutshell* 作者 Benjamin Evans\
  \ & David Flanagan（第 6 版，涵盖了 JSE8）（我想我在他们的代码中发现了一个类型错误，但这本书本身无疑是优秀的）\n- *Exercices\
  \ en Java* 作者 Claude Delannoy（第 4 版，也涵盖 JSE8）\n- *La programmation objet en Java*\
  \ 作者 Michel Divay（他在雷恩大学教这门课程；书本身像月球尘一样干燥且无味，但它有一个巨大的优点：它使用了简单的 UML 图）\n\n- 还有三本俄语书。\n\
  \n\n\n自然地，光看书是不够的，所以我做了练习题。正如 Jeanne Boyarsky 经常重复的那样：“练习！”于是我开始了。做法是：阅读第 1 章，完成该章节的练习，不要对答案，而是阅读第\
  \ 2 章，回来重复第 1 章的练习，对比自己的答案（看看是否一致，否则意味着你对某些知识点不确定），最后对照答案进行检查。以这种方式循环直到读完。涵盖所有带有练习题的书。然后一遍又一遍，直到你每次通过的得分至少达到\
  \ 90%。\n\n如果算上三次模拟考试，Boyarsky & Selikoff 的书就包含了 345 道练习题；我把整个周期重复了三次（书本身也读了四遍，从封面到封尾；现在我正在读第五遍；我辞职了，还记得吗？）。Mala\
  \ Gupta 的书也提供了大量的练习……\n\n我还参加了莫斯科市中心鲍曼理工学院开设的为期四周的 Java 8 课程。课堂上是三小时的脑力练习，然后解决所有的家庭作业直到凌晨四点。持续了二十天。\n\
  \n参加了 JPoint，一个由当地 JUG 为学生组织的 Java 大会。我读了能拿到的所有 Java 相关的杂志，涵盖我熟悉的所有语言。坐了几个小时，破解印度许多网站上可见的\
  \ Java 面试题……\n\n我的想法是让自己沉浸在 Java 代码中，直到我吐血或累死。或者两者兼有。但并没有发生。\n\n如果没有我在做模拟考试时眯着眼睛盯着屏幕，这幅史诗般的画面将是不完整的；我也有很多这类考试：\n\
  \n–Kathy Sierra 等人编写的 `OCA SE7 Programmer I & II` 附带的两份每份 60 题的模拟考卷；\n\n–Enthuware\
  \ 题库中超过 600 道题；\n\n–Kaplan 自测，其包含 180 道题的自测；\n\n–至于 B&S 书附带的测试软件，在看到它包含这么多错误后，我就停止使用了；我更倾向于使用纸笔。\n\
  \nKathy Sierra 的测验非常困难。Enthuware 的更难——而且极其有趣味。单是解释部分就值回票价了；它们绝对是一流水平。\n\n至于 Kaplan\
  \ 的……我真希望我可以起诉那群可怜虫。他们所谓的“自测”（我为此花了 80 多美元，而且在 Pearson Vue^(2) 网上被宣传为官方 Oracle 认证包的一部分，真是讽刺）是我一生见过最糟糕的软件工作。\n\
  \n如果有人好奇我为什么如此怨恨他们，这里是原因；有两个原因……等一下！三个！\n\n首先，桌面版的 GUI 充满了视觉漏洞，字面意义上堆满了屏幕（说真的！），而且只有网页版是如宣传的那样好用。其次，他们的闪卡在解释中存在错误和歧义，最后，题目简直……怎么吧，太简单了。我在所谓的“认证模式”下参加了他们的模拟考试，得到了\
  \ 96%。没有流汗，有大把时间，甚至没有复习我的答案……\n\n现在，来说 Enthuware。我的基础测试（Foundation）得分为 77%，标准测试（Standard\
  \ Tests）1 至 6 的分为 74-79-75-81-74-80，最后一天测试（Last Day Test）得分为 78%。Enthuware 的开发者在网站上有一个记分榜；显示成千上万用户的标准测试平均分为\
  \ 74.8%，而实际考试分为 88%。我的 `avscore` 是 77.2……所以我想我搞定了这个考试，这个该死的 `1Z0-808` 玩意儿就在我口袋里……超过\
  \ 800 小时的阅读，加上编码，加上破解谜题，再加上近 9000 行的复笔记，这些笔记并非从某处复制粘贴，而是确实是我自己的脑力成果……给自己的笔记。记住这个，记住那个……“注意包装类的构造函数！它们接受底层原始类型或字符串！”……“警惕\
  \ `trim()`！`StringBuilder` 没有它！”……“switch 只接受编译时常量！”……之类的内容。甚至因为看了太多 Simon Roberts\
  \ 的视频，我得了“干眼症”，所以现在我拖着我可怜的屁股，每几秒钟擦一次右角的眼泪。像个傻子一样。所有的努力……付诸东流……\n\n你该如何称之？这种奇怪、空虚的感觉，当你以一种冰冷、冷静、甚至是宁静知足的确定性知道，你已经付出了人类所能做的一切——却仍然不够？\n\
  \n别担心，我快结束了。我想我知道我的问题在哪里，而且现在仍然在哪里。下一次将测试这个假设，大约在 6 月 17 日。将报告结果和我的发现。\n\n感谢倾听。\n\
  \n暂写到此。\n\n然后，在 2016 年 6 月 26 日……\n\n这是对我之前帖子的简单跟进：\n\n我终于通过了（98%）；现在目标是 `1Z0-809`\n\
  \n我还在 `amazon.com` 上发布了另一篇帖子，关于 Boyarsky & Selikoff 的 `OCA: Associate Java SE 8\
  \ Programmer I Study Guide`：六周前，我的 `1Z0-808` 考试只有 62%。我太天真、太自信到了傲慢——考试出题者给了我教训。就在昨天，我重新参加了考试并以\
  \ 98%通过。学习包包含了三个工具，每种工具对我来说都是必不可少的。清单如下：\n\n这本指南，它将提供每一位理论和实践知识；\n\nSimon Roberts\
  \ 的 Oracle 考试准备视频课程（他是几十年前开发这些题目最初概念的人；他的视频课程是我在阅读这本书的基础上进一步建立和扩展知识的基础）；\n\n–最后，是\
  \ Enthuware 的 Test Studio，它包含 600 多道题，它将从所有可能的方面和细节对你进行探测、训练、磨练、烹煮和炙烤。当你完成它时，你将以全新的视角看待\
  \ Java 和你自己。\n\n咬牙坚持，忍受痛苦——痛苦将接踵而来，如果你像我一样刚接触 Java——但只要坚持这三个工具，你就能获得认证。\n\n遗憾的是，这些优秀的工具都不能给你成功的第二个关键：它们都详细讨论纯技术问题，而你在实际考试中处理这些目的的方式同样重要。你应该以什么速度通过测试？由于许多题目带有陷阱，是否有必要怀疑自己并尝试用其他方式解决问题？当你立即看到“正确”答案时，应该检查其他选项吗？还是直接跳到下一题更好，因为这样可以节省时间，而时间是考试中最宝贵的资源……关于“挑选”呢？关于“稍后复习”标记呢？你应该对它们克制还是慷慨？信任你的直觉而不是按部就班、系统地检查每一行代码（LOC）安全吗？正如我发现的，而且付出了巨大的代价，这些以及许多其他问题的答案实际上是违反直觉的，甚至是悖论的。\n\
  \n\n\n\n# 策略\n\n伙计们，我在这里谈论的是策略。所有由才华横溢的人设计的学习指南、视频课程、考试模拟器和测试套件，都是你们获胜策略的一部分，但——抱歉我听起来可能像个显而易见的废话——执行才是成败的关键。如果你认为这些心理学上的垃圾是属于\
  \ 70 年代的产物，并且认为你永远用不着，那请自便。尽管去吧，我祝你们好运。你们需要它的。至于我，我不得不以最惨痛的方式吸训了这一课，对此我实际上深表感激。最初的失败迫使我抛弃并重建了我的整个方法，制定了一个万无一失的进攻计划，发明了破解循环的简写符号，绘制对象的生命周期动态图，表达继承、多态行为等，甚至制定了数十条简洁、易于记忆的规则，同时让自己完全沉浸在\
  \ `Java` 代码中，直到每当我看到错误片段时眼睛都会酸疼。我所知道的任何学习指南、软件或 Java 程序员论坛都没有教过这些技能，这让我感到非常困惑，因为它们是是或缺的。就我打算就这段经历写一本小书^(4)的话……\n\
  \n现在，如果我可以的话，给出一个直接的建议：写代码。尽可能、频繁地写代码，在阅读、听课或仅仅思考所学内容时，立即测试你所有的想法或疑问，而且最少前几周**不要**使用\
  \ IDE。坚持使用你的 `Notepad++` 并从 `CLI` 运行所有程序。这将揭示你的弱点以及你倾向于犯的典型错误。\n\n还在读？嗯。好吧，那停下吧，去买\
  \ Jeanne Boyarsky 和 Scott Selikoff 写的学习指南，Enthuware 的测试套件，以及 Simon Roberts 的视频课程吧。祝你好运！我其实很羡慕你：你还有机会获得\
  \ 100% 的满分 :)\n\n你们知道那句谚语吗，“*熟能生巧？*”这并不是真的。只有完美的练习才能造就完美。光知道语法规则、重写原理等是不够的；我亲眼见证了。你需要学习如何在压力下应用它们，当一切都与你作对时。\n\
  \n接下来的页面包含了我在准备和参加实际考试期间所使用的每一个技巧、方法或技术。我会把*所有内容*告诉你们，精确到最无聊甚至令人尴尬的细节——因为策略*关乎*细节。\n\
  \n但有一个问题。我在参加考试前签署了 NDA^(5)，所以我不可能给你们列出一份真题正确答案清单；你们通常需要通过*推断*来自己找出：这个概念正是我们在处理\
  \ `generics`（泛型）和 `lambdas`（ 表达式）时会再次遇到的。但不要担心：我会一直站在你们身边，偶尔给出提示，并在尽可能（且法律允许范围内）提供帮助。\n\
  \n让我立刻给你们展示一个例子。为什么我会在书的这一部分重复使用我的旧文章？因为这种方法说明了一个原则——你*会*！在实际考试的一个文字题^(6)中遇到这个原则。你能说出这个原则吗？它是\
  \ `polymorphism`（多态）的好处之一。\n\n提示：前面的段落已经公开了正确答案。这里是另一个提示，更像是一个提醒：`Enthuware` 的 `Test\
  \ Studio` 拥有一切。*所有答案*。你只需要再深层挖掘一下。\n\n***\n\n^(2) 而且在 Oracle University 网站上……\n\n\
  ^(3) 说起来，我还可以再加一点：`Kaplan SelfTest` 网站误导了潜在买家，让他们认为这些模拟测试能“完美模拟实际测试环境”（这个表述我是直接从他们落地页的\
  \ `Testimonials`（口碑）部分摘取的）。委婉地说，事实并非如此。事实上，没有任何模拟的 `1Z0-808` 备考套件能重现*实际*测试环境的视觉感受——这让我极其困惑。毕竟，这只是\
  \ `GUI`；不需要对业务逻辑进行任何更改就能营造真实考试的氛围……\n\n^(4) 就是你正在读的这本书。\n\n^(5) 保密协议；每当我们准备参加 Oracle\
  \ 认证考试时，都会签署此类协议。\n\n^(6) 六道题目将不包含代码；包含它们是为了测试你对面向对象编程（OOP）最基本概念的理解。\n\n# 第一部分\n\
  \n## 了解你的敌人\n\n![](img/00009.jpeg)\n\n*–年轻人！你不知道公共卫生部警告过吸烟的危险吗？*\n\n*–没关系。毕竟我是个程序员。*\n\
  \n*–？！*\n\n*–我们对警告吐唾弃，只关心错误。*\n\n![](img/00010.jpeg)\n\n一旦拿下，这个证书本应该成为我们最亲的盟友——如果不是朋友的话。然而，现在看起来更像是一场苦战。尽管如此，让我们先仔细观察敌人的据点吧。\n\
  \n正如你可能还记得，B&S^(7) 包含了对 OCA 考试历史的简要描述及其用途。用另一个角度来更好地理解即将面临的挑战如何？\n\n这是发表在 *Java\
  \ Magazine* 2015 年 7-8 月的 *Fix It* 栏目（第 14-15 页）上的：\n\n此认证 [1Z0-808 – I.S.] 的目的是让初学者展示他们对基础概念的理解。该认证面向编程初学者和/或具有非编程背景但具备基础数学、逻辑和分析问题能力并希望开始学习\
  \ Java 语言的人；也面向新手程序员以及那些倾向于从入门水平开始学习 Java 语言的程序员。成功完成此认证后，候选人可以自信地利用他们在 Java 数据类型、运算符、语句、数组、列表和异常处理技术方面的知识。\n\
  \n自然，这些问题带有小陷阱，如果你在匆忙通过而没有仔细考虑代码在做什么，陷阱就会开启。\n\n明白我的意了吗？在我看来，OCAJSE8 考试——带着它所有的“小”陷阱——是给蹒跚学步的孩子甚至是小奶婴儿准备的。\n\
  \n准备好了吗？专栏用银发导师的语气问道，并给出了这个（题 3，第二部分）：\n\n![](img/00011.jpeg)\n\n仔细观察高亮区域；希望你一眼就能发现问题。如果不能，请重读题目及其代码行（LOC）——不要匆忙，并朗读；每当你怀疑代码可能设置了陷阱时，这就是你处理代码的方式。\n\
  \n好了，到为止你应该已经明白了。作为 `public` 类，`OnlineCart` 类不可能在 `Shop.java` 文件中声明，这使得 **a** 到\
  \ **d** 的所有选项都变得无关。换句话说，在为我们这些蹒跚学步的孩子布设熊阱时，出题者^(8) 射了自己的自己的脚。\n\n\n\n\n现在，我并不是在说或暗示她的资质不足；我心里毫无疑问，她非常专业：毕竟，她的雇主是甲拉文大学，单凭这一凭证就足够让我信服了。但这个例子再真实不过了，通过它我想说明，Java\
  \ 有太多的规则、细微差别和微妙之处，以至于是最博学的人也可能偶尔出错。我们遗憾的是，考试本身并不那么体贴，也不那么宽容。引用福莱斯特·甘姆的话，`1Z0-808`\
  \ 就像一盒巧克力：*你永远不知道自己会得到什么*。但在 77 道题中如果错了 20 道，你就彻底完蛋了。\n\n## 考试环境\n\n考试通过远程服务器交付；它并不运行在本地机器上。（我实际上向我考中心的考试管理员询问过这一点，她确认了确实这样。）机器是一台外形奇特的扁箱式台式电脑，深空黑色，没有任何标记，它有一个可锁定的\
  \ CD/DVD 驱动器，且前面板没有 USB 接口。后板在触及不到的地方；我没能看一眼。老实说，我甚至连试都没试……\n\n机器连接到一个蓝色的的小盒子，在我看来像是一个普通的以太网集线器。考试室里还有一台电脑，和我的是双胞胎；它也连接在集线器上。\n\
  \n整个设置最不寻常的是显示器：它是正方形的。不是普通的 4:3、16:10 或 16:9 宽高比，不是。它是 1:1。我一生中只见过这种东西两次，两次都是 OCA\
  \ 考试。\n\n有些考中心在 Mac 上运行考试，但在我的情况下，操作系统是基于 Windows 的；可能是 MS Windows Server 的某个版本，因为它的启动闪屏上有\
  \ Windows 标志。根据我的观察，访问考试受双重认证协议的保护。\n\n似乎每场考试都是独特的，因为题目很可能是从一个更大的题库按准随机顺序抽取的。我们必须从中选择正确（或）的可用答案（即选项）在每次生成考试子集时都会被洗牌。\n\
  \n## 考试结构\n\n我说的“准随机”是指：考试看起来由三个主要部分组成：\n\n*   一个**核心部分**，包含在每场考试中对每个候选人都会出现的题目，无论日期或地点；换句话说，这些题目不是从题库中随机选择的，而会在任何情况下出现；\n\
  *   一个**高级部分**，其题目测试我们对更高水平理解的知识掌握；接近 Enthuware 分类中的“困难/极难”级别；这些是随机选取的题目；\n*   一个**“白鼠实验”部分**，由\
  \ Oracle 在我们身上测试的题目组成。如你所知，在读完 B&S 后，这些题目是不计分的。完全不计分。遗憾的是，没有办法判断当前的题目是否属于不评分类型，否则就意味着你可以对着它吐口水、踢它一脚，然后完全跳过它——而且逍然无事……\n\
  \n我认为这个通用布局大致是正确的，因为我两次都遇到了核心题，困难的题目是不一样的，而且有些看起来中等的题目我只遇到过一次。我觉得核心题占了整套题目的 70%\
  \ 到 80%。不过我也可能是错的。\n\n## 评分与目标\n\n查看分数时，你会看到一个你未达到的目标列表；第二次考试后，我的列表包含一个项目——“创建和重载构造函数；包括对默认构造函数的影响”——由于我的分是\
  \ 98%，似乎一个目标值 2%。另一方面，失败的尝试（62%）给我提供了一个包含 21 个项目的列表；现在你知道为什么我认为错了 20 道后游戏就结束了。\n\
  \n\n\n我也认为他们禁用了剪贴板；PrintScreen 键也是如此（至少如果有人要求我加固考试环境以防范随意的攻击，我至少会这么做）。除了将剪贴板排除在考虑之外，他们显然还处理了选择事件处理器，因为显示的文本本身是无法选择的。\n\
  \nPearson Vue 建议，为了熟悉考试软件的外观和感受，考生应该访问以下链接：[`www.pearsonvue.com/demo/`](http://www.pearsonvue.com/demo/)。老实说，我不认为这对我们这种情况来说特别重要，因为\
  \ 1Z0-808 的 GUI 非常简单且直观。这取决于你。\n\n不过，请务必看一看“在 Pearson VUE 考中心可以期待什么”的视频；它与我观察到的非常相似([`home.pearsonvue.com/test-taker/security.aspx`](https://home.pearsonvue.com/test-taker/security.aspx))。不过有一点说明：他们现在会检查我们的手表。当我询问管理员这是否是因为现代可穿戴设备内置了摄像头之类的玩意时，她只是甜美地笑了，什么也没说。你自己下结论吧。\n\
  \n在参加考试之前，你必须签署一些文件，包括 NDA（保密协议）和 Oracle 认证条款与条件；你将再次看到这些法律内容，这次直接显示在屏幕上。一旦你点击“I\
  \ accept”（我接受），时钟就开始倒计时了。\n\n现在，仔细听我说：`this trick`（这个小技巧）`单独就能为你节省整整十分十分钟`……噢天哪，如果你知道在考试期间时间变得多么宝贵的话……但你需要做好准备才能充分从中受益。\n\
  \n你要明白，考试中有两个计时钟。正如我刚刚说的，第一个计时钟在你点击“I accept”时开始倒计时。之后，你有 10 分钟的时间来冷静一下、调整状态、集中注意力、切换到全战斗模式，和/或阅读说明（例如，点击“Help”会弹出帮助屏幕，点击“Next”进入下一道题，而点击“Previous”回到上一题……我想你明白意思了）。所以，你可以快速略过这些显而易懂的内容，然后在在这\
  \ 10 分钟内做任何你想做的事——应该是写下一些对你破解题目非常有帮助的重要事情。\n\n现在，这些“真正重要的事情”是什么呢？你还记得 B&S（第 363\
  \ 页）中的那段小文字吗？\n\n如果你对 Java 语言的某个特定方面难以记忆，请尝试在考试前背下它，并在考试开始后立即将其写下来。……例如，你可能很难记住\
  \ `switch` 语句中允许的数据类型列表。如果是这样，我们建议你在考试前背下这些信息，并在考试开始后立即将其写下来，以便在各种题目中使用。\n\n就是这样——但有一处修正：不是在考试开始后“立即”，而是在考试*之前*。我重复一遍，你有长达\
  \ 10 分钟的时间来这样做。但请记住：你应该在这 10 分钟内点击“Start”（开始）——只有这样第二个计时器才会开始 2 小时 30 分钟的倒计时……\n\
  \nB&S 提到了 `switch` 的数据类型。在我看来，在正式考试之前，你可能还会写下另外两个项目：修饰符表和运算符优先级图的摘录。也许甚至是最“流行”的\
  \ CE + RTE 列表，加上抛出 NPE（空指针异常）的五个主要情况。再次，这取决于你。无论如何，我们将在第二部分“考试目标”或 *Pater Noster*（祷文）中讨论所有这些内容。\n\
  \n也许，说明书中唯一真正有用的信息是，你可以直接在屏幕上划掉错误答案。现在，B&S809 说：\n\n你可以右键点击题目来划掉答案。这让你在做题时将答案标记为错误，这样你在阅读时需要考虑的就更少。它也能帮助你在回到题目时记住你排除了哪些内容。\n\
  \n没错，没错——但再次有一处微小的修正：要这样做你需要按住 `Ctrl` 键。所以，`Ctrl+右键点击`将消除某个选项。记得我提到过 `Sleep`（睡眠)/`Hibernate`（休眠)/`Power\
  \ Off`（关机）按钮吗？现在你知道你可能还是需要使用键盘了，所以留神。\n\n另一个节省时间的技巧：要划掉错误答案，不要不要点击可用选项列表中的 `O` 或\
  \ `![](img/00012.jpeg)` 符号，那是无效的，你只会浪费宝贵的秒数；直接点击单词/代码。这个特定的选项会立即变灰并被划掉。这种状态是持久的，所以当你回顾答案时，你会看到你留下的那些灰色文本/代码。\n\
  \n当你完成答题后，屏幕上会出现一个表格，包含你所有标记为“回顾”的题目，以及所谓的你忘记回答的题目（或者勾选次数不足，我说“所谓的”是因为我没有测试过这个功能）。另一方面，说明确实承诺了这一点。无论如何，尽一切努力，不要留下任何题目未回答或回答不完全。务倍确认，惩罚太严厉了。\n\
  \n还有一件同样重要的。你需要采取一切预防措施，不要让任何事情干扰你的注意力。B&S 和 S809 都包含了许多有用的、实用的建议，比如层层穿衣、使用耳塞等。这些都是可靠的、真实的。\n\
  \n* * *\n\n好了，回到我们的小故事。嗯，在第一次考试中，我并没有意识到我可以从额外的 10 分钟中受益，所以在在点击“I accept”后，我花了大约三十秒浏览说明，然后在点击“Start”之前，我深叹了口气，低声说：“来来吧”。\n\
  \n而它确实来了。\n\n * *\n\n在本书中，B&S 代表 Jeanne Boyarsky 和 Scott Selikoff 编写的 OCA 1Z0-808\
  \ 学习指南。其 OCP 兄弟篇—— 1Z0-809 学习指南将被称为 B&S809。\n\nOracle 大学的 Sushma Jagannath。\n\n\n\
  \n稍后我会向你们展示我是得出这个数字的。话说回来，我的逻辑可能完全是胡道的。你们仍然有自己的判断。\n\n确定这一点的唯一方法是询问 Oracle（甲骨文）——那些家伙可不说话。\n\
  \n请参阅“缩写与术语”章节。\n\n不，我没有检查鼠标垫——因为那里根本没有！否则…… ☺\n\n是的，这确实有点狡猾，我承认；但另一方面，他们自己也公开承认：我们为你们准备了“弯球”和地雷阵。所以我认为这恰恰当；毕竟，兵不无常，爱情亦然等等……\n\
  \n![](img/00019.jpeg)\n\n概览整个 1Z0-808。它告诉了你什么？\n\n![](img/00020.jpeg)\n\n有一件事立刻显现出来——而我对此完全没有心理准备。这极其重要，但其后果更为严重。当然，你可能有完全不同的意见；我只是在和你们分享我的经验，仅此而已。\n\
  \n现在，这件要命的事情到底是什么？深吸一口气，然后缓慢阅读：\n\n### 代码是经过美化排版的\n\n*全部*。每一行该死的代码（LOC）。这一重大发现的后果是什么？\n\
  \n既然代码格式正确，我们就可以停止数大括号了…… 伙计们！我们可以停止数那些讨厌的小东西，再也不用在它们上浪费时间了！\n\n我不知道，也许只是我的个人问题，但在考试之前，我理所当然地认为可能的陷阱之一可能是缺失或位置错误的大括号。此外，一串大括号可能会产生干扰，模糊代码的含义和清晰度。“习惯于这些可恶的大括号吧”，Kathy\
  \ Sierra 和 Bert Bates 编写的学习指南中警告道，这指的是例如同一行中的这大串大括号游行：}}}}}。或者参考 B&S（第 33 页）：\n\n\
  识别代码块需要成为考试的第二本能。好消息是，有大量的代码示例可以练习。你可以查看书中任何主题的任何代码示例，并匹配大括号。\n\n但现在，所有的初始化块、所有方法体和构造函数体等都可以一目了然。我怀疑\
  \ Oracle 认证团队仅仅是厌倦了所有的投诉（在成功通过考试的几天后，你将收到一封邀请你参加调查的邮件），并最终放弃对所有代码进行美化排版。\n\n然而，我无法相信自己的眼睛，继续固执而愚蠢地匹配大括号，纯粹是在浪费时间。浪费了很多时间。第二次考试时情况完全不同：我一眼扫过所有内容，只需确保所有方法体、初始化器等都已正确闭合即可。但这次没有数数！这节省了大量时间。\n\
  \n唉，这也许是关于考试中代码美化排版的唯一好消息了，因为当你正确格式化代码行时，将大多数闭合括号放在新行，并带有缩进等格式，代码列表会变得非常长。\n\n加上字体相当大的这一事实（我想大约是\
  \ 18 字体），这意味着很多题目——更不用说答案选项了！——无法显示在一个屏幕上，从而迫使你不断地、绝望地上下滚动。该死！这让我和代码脱节了，我乱了进入状态——并且变得真的非常紧张。\n\
  \n当你紧张时会发生什么呢？有些人（包括我在内）会开始自我怀疑。怀疑会溜入并迷住你的大脑，让你变得紧张、易躁……最糟糕的恶性循环。\n\n于是我又犯了另一个可怕的错误：在勾选了我认为正确的选项后，我开始重新阅读代码，寻找之前未察觉的陷阱。每一次都是如此。\n\
  \n那真是太愚蠢了。但等等，还有另一个致命的错误：由于充满怀疑，我开始标记太多的题目进行“复习”（Review）……\n\n在这里停顿一下，想想复习的目的是什么。是为了在可能漏掉某些内容时检查你的答案，对吧？例如对嵌套循环重新运行计算，只是为了看看第一次是否完全完全正确。或者再看一遍那些你在两个选项之间犹豫不决的代码，类似此类。而当你标记了几乎每隔一道题时……这意味着什么？这意味着你实际上又考了一遍同样的试。仍然在规定的时间内。而由于多次重读，时间已经快用光了……\n\
  \n当我过完所有题目时，我只剩下 15 分钟，而“复习”列表包含了大约三十项内容。我甚至不记得哪些是最难的题了；那些真正需要我关注的……\n\n我掉入的另一个心理陷阱是，我预期每一道题都有阴险的诡计。事实是，很多题目根本没有试图欺骗你；它们直如箭矢一般。告诉我，你能发现这道题中任何哪怕一点点可疑的地方吗？\n\
  \n### 空值的陷阱\n\n我也没有发现任何异常。但在这一道题上花了几分钟而不是几秒钟，才克制住信任自己的眼睛和直觉。这完全是因为我为恶魔般的狡猾诡计做好了准备——而那里根本没有……\n\
  \n我们已经根据基本功能涵盖了考试的组成（“核心型”、“高级型”和“实验白鼠型”类型）。另一种可能的分类是基于题目欺骗你的倾向。从这个角度看，题目可以是：\n\n\
  ![](img/00012.jpeg)一支直插的箭，\n\n![](img/00012.jpeg)一个让你偏离题心的弯球，以及\n\n![](img/00012.jpeg)一个旨在让你瘫痪的陷阱器。\n\
  \n`HiThere` 类显然属于第一类。让我们来看一个弯球：\n\n![](img/00023.jpeg)\n\n**给定文件 HiThere.java:**\n\
  \n代码通过编译吗？如果通过，结果是什么？如果不通过，原因是什么？\n\n答案是：代码通过编译，第 1 行和第 2 行都打印 42，第 3 行打印 42 然后抛出\
  \ NPE，因为我们尝试通过对 `null` 对象隐式调用 `Integer.intValue()` 来自动拆箱。\n\n请不要惊慌，可能不会在考试中遇到这样的题目：它更属于\
  \ OCP 领域。但在我们的 OCA 1Z0-808 中至少有三道题与 `null` 的行为有关，这包含了几种场景——这就是你的弯球：你需要同时跟踪很多事情。我们在讨论\
  \ NPE 时会涵盖这些场景。\n\n来看一个简单但阴险的陷阱器怎么样？给定：\n\n![](img/00024.jpeg)\n\n结果是什么？\n\nA. 代码打印\
  \ 1\n\nB. 代码打印 0\n\nC 编译失败\n\nD. 代码在运行时抛出异常\n\n正确答案是 C：编译失败。\n\n考试知道我们习惯了经常看到 `insert()`——并让我们措手不及。\n\
  \n现在我要向你们吐露我犯的那个错误。真正的。包容一切的。错误之源。准备好了吗？\n\n我没读题。哈！这怎么样？你一定没预料到吧？我也没预料到 :(\n\n\n\
  \n\n但事实就是事实。我没有妥善地阅读文本部分，也就是说，没有仔细读。我当时太急于进入“干货”——即代码本身了。在考完回家的路上，我自然而然地在回忆题目时思考它们——突然发现，很多时候我试图把那些可以编译的行标记为正确，而题目要求的恰恰是那些无法编译的行，反之亦然。“啊，难怪我好几次都选选出正确数量的选项！题目要求两个，但我找到了三个……由于\
  \ GUI 不允许我勾选这么多，我只能靠盲运气只选了两个。结果两个都是错的……”\n\n摘自电影《造雨人》的一句台词：“你真是太蠢、太蠢、太蠢了！”……\n\n\
  在第一次考试失败后，在花了几周时间回忆并还原试题、分析了自己的行为并意识到自己所做的一切后，我的脑中形成了一套最简单的规则：\n\n![](img/00012.jpeg)不要直接跳到代码。先读——题目。强迫自己读完。\n\
  \n![](img/00012.jpeg)在第一遍通过时，尽力去解决问题。\n\n![](img/00012.jpeg)从容不忙地，永远不要让自己重读已经仔细读过的内容。\n\
  \n![](img/00012.jpeg)按代码的字面意思对待它。并不是每个片段都是为了骗你。\n\n![](img/00012.jpeg)不要挑拣；按照题目出现的顺序做题。\n\
  \n![](img/00012.jpeg)把你的复习（Review）标记视为金子。\n\n![](img/00012.jpeg)相信你的直觉。\n\n![](img/00012.jpeg)抵制立即重新计算的诱惑，把它留到复习阶段。\n\
  \n回想起来，这一切都变得如此痛苦而显而易见：我在*之前*没有清楚地思考我的方法。尽管这看起来如此简单……以“复习标记”规则为例。如果某些题目对你来说太难，如果你几乎不确定代码在做什么，那么将问题标记为复习并没有帮助太大——尤其是当你标记了太多题目时：你根本没有时间去好好完成。另一方面，当你像破冰一样扫过题目，而不去纠结太久，当你完全释放你程序员的直觉并让它为你服务时……你将留下大量时间，因此在复习时有很大机会发现错误并拆解之前未察觉的陷阱。更不用说第一遍时收集上下文线索了……\n\
  \n但话话到此为止了，让我们来看看硬性事实。以下是我第二次考试的时间线：\n\n- **第一遍通过（Initial pass）** – 77 道题 – 40 分钟。是的，我说的就是\
  \ 40 分钟。不是像以前那样的 2 小时 15 分钟。（“哇……我简直像希腊之神一样在快速穿过这一切……”）\n- **第一次复习（1st Review）**\
  \ – 十几个标记的题目（其中一半是循环，嵌套或其他类型） – 18 分钟。（“该死的，它们是对的。这都是小孩子的水平……”）迅速发现并修正了两个低级错误。\n\
  - **第一次完整复习（1st complete Review）** – 所有 77 道题 – 35 分钟。（“在金云上做日梦……”）在回起 Enthuware\
  \ 中的一个谜题后，更改了其中一个答案。\n- **第二次完整复习（2nd complete Review）** – 同上 – 22 分钟。（“无聊……”）这次没有发现任何错误。\n\
  \n看到我还有半小时时间，而且没有其他更有意思的事要做，我决定今天就此结束。\n\n## 两次考试后的最终结论\n\n考虑到所有因素，我必须说，引导成功的最重要、首要规则也是最简单最符合逻辑的一个：\n\
  \n先读题目，然后是选项，最后是*仔细*读代码。甚至可以小声读出来。\n\n例如，看看这个：\n\n![](img/00025.jpeg)\n\n等宽字体对眼睛非常不利，特别是当字体大小异常大时——就像实际考试中那样。要忽略上面代码中漏掉的逗号出奇地容易，*尤其是*当你做完大约五十题后感到疲惫，而且时间已经紧迫，因为：\n\
  \na) 你可能已经标记了十几个题需要复习（这意味着你需要为它们花费更多时间），以及\n\nb) 前面可能有一些令人沮丧且耗时的循环……\n\n另一个重要的指南：如果你看到的正确答案比题目要求的多，而且你仍然找不到你准备勾选的选项哪里错了，请额外仔细检查那个最“明显”的选项：它可能包含陷阱。\n\
  \n永远不要假设考试出题者犯了错。\n\n我注意到这一点：**看起来奇怪、过度复杂的代码**最有可能在非常*简单的概念*上设置陷阱（按出现频率排序）：\n\n\
  - 作用域外的变量 `vars`；\n- 无效的语法；\n- 不可到达的代码。\n\n***\n\n然而，这一点直到考试结束时我才完全意识到。\n\n说实话，我很惊讶，我所熟悉的那些基于软件的模拟考试卷（如\
  \ Kaplan、Enthuware 等）都没有模拟这种特殊特性。毕竟，当你看不见*完整*代码和*所有*可用选项时，解决问题会变得困难得多……\n\nB&S 提到了其他你可以在复习期间使用的技巧，例如应用上下文线索。\n\
  \n`insert(int offset, String str)` 属于 `StringBuilder` 类而不是 `String`。\n\n令人难以置信的是，他们在一个题目中有一个拼写错误（与\
  \ `LocalDate` 类有关）：它列出了 `DateParseExcion`。我两次都遇到了这个拼写错误……\n\n特别是涉及循环或递减/递增符号。\n\n\
  ![](img/00026.jpeg)\n\n好了，到目前为止我们一直在讨论战术，现在是时候制定针对 Z0-808 的胜利策略了。\n\n没有什么比这简单的：\n\
  \n- 通过尽可能多的编码来跟进你学的内容，以及\n- 尽可能多题。\n\n\n\n\n双击 `RWJ.reg` 将键键导入注册表。\n\n## 步骤 2：编写启动器\n\
  \n在 `C:\\JC` 文件夹中创建一个名为 `RWJ.bat` 的文本文件，并将其填充**附录 B** 中的代码（或跳转到外部资源获取下载链接）。下面是相同的代码，但带有行号，因为我们在接后的讨论中会用到它们。\n\
  \n![](img/00028.jpeg)\n![](img/00029.jpeg)\n![](img/00030.jpeg)\n![](img/00031.jpeg)\n\
  \n现在让我们运行一个测试，看看整个想法是如何工作的：\n\n1) 创建文件夹 `C:\\Try_Java`，并在其中创建另外三个子文件夹：\n   - `org`\n\
  \   - `tempa`\n   - `tempb`\n\n2) 在子文件夹 `org` 中再创建一个名为 `xlator` 的子文件夹；最终结果应该像这样的树状结构：\n\
  \n![](img/00032.jpeg)\n\n3) 转到 `C:\\Try_Java\\org\\xlator`，并在 Notepad++ 等工具的帮助下创建\
  \ `HelloWorld.java`。使用“ANSI as UTF-8”编码。如果你确定你的 Java 类不会输出 Unicode 字符，可以改为注释第 39\
  \ 行和 41 行而不是第 40 行和 42 行。这将禁用 Java 编译器的强制编码切换。默认情况下，强制编码是开启的，因为第 39 行和 41 行没有被注释：\n\
  \n![](img/00033.jpeg)\n\n4) 在 `HelloWorld.java` 中填充你想要的任何有效 Java 代码。只需确保以下两点：\n\
  \   - 文件以有效的 `package` 声明开头；\n   - 即使类不是 `public`，它的类名与 `.java` 文件的文件名也必须相同。\n\n\
  可以完全省略 `package` 声明，并直接在源文件所在的文件夹内部编译并运行 `.java` 文件。尽管如此，但不建议这样做，因为毕竟，我们必须学会如何同时处理多个包。\n\
  \n默认情况下，包声明为 `package org.xlator;`（这反映了我其中一个网站的 URL）；自然地，你可以使用其他内容；只需将 `RWJ.bat`\
  \ 中所有的 `org` 和 `xlator` 替换为你需要的任何内容；然而，现在我建议你使用以下代码测试启动器并看看它在你的机器上如何运行：\n\n![](img/00034.jpeg)\n\
  \n5) 在 Windows 资源管理器中右键点击 `HelloWorld.java` 打开打开菜单，并选择“用 Java 运行”。\n\n6) `RWJ.bat`\
  \ 将启动 `javac` 然后是 JVM，因此你会看到类似下面的内容：\n\n![](img/00035.jpeg)\n\n基本上，就是这样。剩下的讨论涉及一些简单的细节，例如应该更改以及如何更改以满足你的特定需求。\n\
  \n首先，让我们启动器精简到最基础的代码，并观察它的核心部分。在这里：\n\n![](img/00036.jpeg)\n\n是的，就这么简单：首先我们通过调用\
  \ `javac %1` 将我们的 `.java` 文件传递给 `javac`，然后将类名传递给 JVM。然而，这个技巧**仅当**类名与不带扩展的文件名完全相同时才有效——扩展名是通过\
  \ `~n` 开关删除的。\n\n让我让我重复一遍；这很重要。上述要求——类名必须与不带扩展的文件名完全相同——**与 JLS 关于包含 `public` 类的文件命名规则无关**。它的存在是因为\
  \ `~n` 开关，仅此而已。\n\n这是一个示例。将 `HelloWorld.java` 重命名为 `Brass.java`，然后将类名更改为 `Brass`；你也可以将其设为包私有（尽管保留包声明）：\n\
  \n![](img/00037.jpeg)\n\n通过右键运行 `Brass.java`。运行正常，对吧？现在将类名改为 `Glass` 并运行文件。*哎！*\
  \ “Error: could not find or load main class org.xlator.Brass”。将类 `Glass` 改回 `Brass`，它就会再次工作了。\n\
  \n现在让我们处理执行流。根据是否存在包声明，流在第 100 行通过检查第 29 行声明的 `packaged` 标记发生分叉：\n\n![](img/00038.jpeg)\n\
  \n我们将跳过 `simple_process` 部分（该部分留给不包含包声明的 `.java` 文件；自然地，在这种情况下你也将需要翻转 `packaged`\
  \ 标记），而是将注意力集中在通用情况上，由 `packaged_process` 部分表示。\n\n一旦在第 138 行进入 `packaged_process`\
  \ 部分，第 146 行的代码将检查第 30 行 `javac -d` 开关指定的目录是否存在：\n\n![](img/00039.jpeg)\n\n`javac\
  \ -d` 开关定义了编译器应该将类放在哪里。很有可能你的机器上没有 `C:\\Garbage`，所以——在征得许可后，第 147-157 行——将为你创建此目录：\n\
  \n![](img/00040.jpeg)\n\n*(注：提供的输入文本是碎片化或交织的。我已经根据逻辑内容流重新构建了它。）*\n\n\n\n正如我们所看到的，代码显然是无法编译的（顺带一下，考试中*确实*有一题会测试你关于\
  \ `final` 字段的强制初始化），因此它无法在 CLI 内部运行。在强制让 IDE 运行它后，我们看到控制台输出了“Hi there!”……不可思议。这怎么可能实现呢？\n\
  \n每当 Java 代码运行时，就意味着它有一个对应的 `.class` 文件，所以让我们反编译一下字节码^29：\n\n![](img/00050.jpeg)\n\
  \n看！NetBeans 仅仅是添加了一个包含 `throw` 语句的无参构造函数。自然地，这并不总是可能的；例如，一旦我们把变量 `str` 设为 `static`，这个技巧就失效了。为了让它再次生效，我们必须显式地定义一个无参构造函数：\n\
  \n![](img/00051.jpeg)\n\n只有在那之后，IDE 才能插入 `throw` 语句使代码变得可编译。反编译后的类与之前的情况完全相同，但变量\
  \ `str` 除外：它被声明为 `final static` 而不仅仅是 `final`。\n\n***\n\n^20 如今大多数人会将这句经典名言与绰号为\
  \ Duke 的约翰·韦恩联系在一起。我们的考试中有一道关于 Duke 的题目。正如约翰·韦恩扮演的英雄一样，这道题非常诚实且直接，没有任何陷阱。^21 或者\
  \ JEdit 等。\n\n^22 自然地，文件夹名称可以完全不同；只需处理好注册表（Registry）中的命令行。\n\n^23 最好使用“ANSI as UTF-8”编码（即“不带\
  \ BOM 的 UTF-8”），但严格来说，除非你计划使用纯 ANSI 以外的字符编码，否则没有必要。\n\n^24 所以，如果你不喜欢 `RWJ.bat`——也许它对你的标准来说太局限了——现在你可以构建自己的启动器了。\n\
  \n^25 我说这个以防万一：开关 `~n` 是传递给 `cmd` 而不是 `java`；它被称为“CMD 变量编辑”你可以在 Brian Knittel 写的\
  \ *Windows XP Under the Hood: Hardcore Windows Scripting and Command Line Power*\
  \ 中阅读更多关于这些迷内容的内容。\n\n^26 例如，在这里：[`docs.oracle.com/javase/7/docs/technotes/tools/solaris/javac.html#nonstandard`](http://docs.oracle.com/javase/7/docs/technotes/tools/solaris/javac.html#nonstandard)\n\
  \n^27 控制面板 ▶ 系统 ▶ 高级系统设置 ▶ 系统属性 ▶ 高级 ▶ 环境变量\n\n^28 此时，我建议按下 `^C` 并查看 `C:\\Garbage\\\
  classes` 文件夹，看看编译器是如何放置编译后的类的。此外，几分钟后的反编译练习我们需要一个 `.class` 文件。\n\n^29 这是一个非常简单的案例，所以\
  \ Lee Benfield 提供的 Class File Reader ([`www.benf.org/other/cfr/`](http://www.benf.org/other/cfr/))\
  \ 就足够了。\n\n### 外部资源\n\n文中提到的两期《Java Magazine》以及 `RWJ.bat`、`RWJ.reg`、与 lambda 相关的\
  \ `Filter.java` 以及从章节 II.1 到 II.9 的所有练习可以在此处下载：[www.igor.host\\nailing1z0-808\\\
  Nailing_1Z0-808_Resources.zip](http://www.igor.host\\nailing1z0-808\\Nailing_1Z0-808_Resources.zip)。\n\
  \n你可能想访问 [www.igor.host](http://www.igor.host) 查看错误列表（Errata list）、发表评论等。\n\n# 第二部分\n\
  \n## 考试目标，或 *Pater Noster*（父经）\n\n![](img/00052.jpeg)\n\n*我们要发财了！爸爸说他把整个 Java 继承都掌握在手里了！*\n\
  \n![](img/00053.jpeg)\n\n这一部分可以说是是书中最重要的部分——也是最长的部分——因为它涉及了你在考试期间将应用的所有核心 Java 类^30\
  \ 的 JLS 和 javadocs 中的每一条规则。\n\n这些规则涵盖了几乎属于核心（Core）部分的所有问题，这就是为什么这一部分被称为 *Pater Noster*：你需要把它烂记于心。是的，你确实需要；至少对于核心部分是。至于额外规则（Extra\
  \ Rules），它们涉及更多主题。\n\n### 访问修饰符\n\n![](img/00054.jpeg) 表 1\n\n文中提到的两期《Java Magazine》以及\
