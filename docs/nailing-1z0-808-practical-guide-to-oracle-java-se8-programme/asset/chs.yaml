  \ CCE（类型转换异常）触发场景时非常有用。以下是几条关于 `instanceof` 使用规则：\n\n![](img/00012.jpeg)\n`instanceof`\
  \ 仅适用于引用类型；对基本类型使用它会抛出错误（comperr）；\n\n![](img/00012.jpeg)\n如果左操作数无法转换为右侧操作数，`instanceof`\
  \ 将抛出错误；\n\n![](img/00012.jpeg)\n除非该类是 `final` 的，否则对接口类型进行转换或使用 `instanceof` 都不会抛出错误；\n\
  \n![](img/00012.jpeg)\n`instanceof` 总是产生 `false`，除非左侧^(113)不是 `null` 且可以在不引发 CCE\
  \ 的情况下转换为右侧（即 `ReferenceType`）。\n\n请同时注意用于命名对象的命名约定：第一个字母表示引用类型（reftype），第二个字母表示实际类型（actype）（例如\
  \ `fe` 表示 `RT==Flier` 且 `AT==Eagle`）。这样在查看输出时，更容易想起哪个是哪个。\n\n我们的示例使用了一个“树状”继承结构，无法应用上一个问题中的简单简写表示法，只能求画图：\n\
