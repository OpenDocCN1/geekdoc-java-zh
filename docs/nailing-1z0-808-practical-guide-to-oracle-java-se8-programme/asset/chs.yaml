  \n`public` 类中的非 `public` *构造函数* 如果是 `protected` 的，那么是可以访问的。\n\n## 核心概念与细节\n\n###\
  \ 继承与初始化\n`java.lang` 包包含 `Void` 类，根据 JavaDoc，它是“一个不可实例化的占位类，用于持有表示 Java 关键字 `void`\
  \ 的 `Class` 对象的引用”。它的父类是 `java.lang.Object`。换句话说，其类型与声明的返回类型不冲突。\n\n`static` 静态块和实例初始化块都按照它们出现的顺序执行。有两个原因：\n\
  1. 首先，变量 `str` 是 `static` 的，所以任何构造函数都是可能的。\n2. 第二，默认构造函数根据定义会被自动插入，并且只包含一条语句：`super();`（参考\
  \ JLS8, §8.8.9：“……默认构造函数简单地调用无参数的父类构造函数。”）。\n\n### 访问修饰符与构造函数\n请注意，编译器生成了一个具有误导性的错误信息，说\
  \ `One` 中的构造函数 `One()` 不是 `public` 的。嗯，它不必是 `public`；是 `protected` 就足够了。然而，`public`\
  \ 类中的非 `public` *构造函数* 如果是 `protected` 的，那么是可以访问的。\n\n### 静态导入\n记住这不是“静态导入”最简单的方法是将\
  \ `import` 关键字视为一个直接命令（即一个祈使：“嘿你！醒醒，`import static` 诸此类东西……”）。\n\n## 参考文献总结\n\n\
