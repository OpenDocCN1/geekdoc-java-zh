  \ 变量在使用之前必须显式初始化；2) 它们的作用域限于它们被声明的方法/块。\n\n`sixpack` 初始化了吗？哦，是的；因为它是一个引用变量^(137)。但是这个数组的槽位呢？它们持有什么值？答案当然是默认值\
