  E. 编译失败\n\n\n\n\n\n这行代码（LOC）盲目地遵循了一种模式，而这种模式本应只用于初始化原始变量，因为它让两个不同的引用指向了同一个对象。虽然对于原始类型来说，不同的变量只会获得相同的值，且对其中一个变量的后续操作不会影响另一个，但我们的情况更为复杂，因为我们处理的是引用。\n\
  \n遵循讨论中提到的问题 2.14 的类比，`alice` 和 `bob` 是两个不同的远程遥控器，它们操作在同一台电视上，这台电视在代码中由 `new ExamTaker()`\
  \ 创建的对象表示。在创建时，该对象是一个无名的小设备，然后第 `o1` 行给它贴了一张写有“Alice”的标签，接着第 `o2` 行永久地将其替换为“Bob”。之后，代码按下了名为\
  \ `bob` 的遥控器上的按钮，将电视调到第 62 路（变量 `score` 的值），然后抓起名为 `alice` 的遥控器并将频道切换到 100。结果是，输出向我们确认\
  \ Bob 通过了考试。\n\n### 问题 2.21 – A\n\n**给定的类：**\n\n![](img/00185.jpeg)\n\n**如果我们注释掉所有无法编译的代码行，结果是什么？**\n\
  \nA. `iVar=22, cVar=22`\nB. `iVar=200, cVar=300`\nC. `iVar=400, cVar=700`\nD. `iVar=600,\
  \ cVar=1100`\n\n显然，我们应该首先调查编译失败的原因。通过逐行扫描，我们很快就发现 `static` 方法 `main()` 尝试直接访问非 `static`\
  \ 的实例字段 `iVar`。\n\n现在该怎么办？我们应该划掉所有无效的代码行并开始计数吗？但考试软件只允许我们划掉选项，而不是划掉代码行本身 → 所以大部分任务必须在大脑中完成，或者至少在纸上完成……变量偶尔会重置……其中一个字段甚至是\
  \ `static` 的……哇，要处理和跟踪的东西太多了！\n\n幸运的是，我们已经掌握了一个实用的便利规则——代码越“复杂”，解决方案就越简单——所以我们甚至不必浪费时间在计算和写下所有内容上。仔细看：是最后一条语句负责打印结果；而在它之前的是？一个\
  \ setter（设置方法）。这个 setter 能编译通过吗？当然可以。那么就是 22-22。花了除了二十二秒以外的所有时间。\n\n考试的另一个提示：撇开与继承和重写相关的问题，通常是打印某些非法操作的统计数据提供了瞬间破解问题的关键，所以请密切关注\
  \ `println()` 及其兄弟方法。\n\n### 问题 2.22 – C\n\n**给于：**\n\n![](img/00186.jpeg)\n\n**结果是什么？**\n\
  \nA. `null 12 null 123`\nB. `Hi! 12 null 12`\nC. `Hi! 12 null 123`\nD. `编译失败`\n\n\
  我们已经看到了如何通过直接访问或 setter（又名变异器）以及 getter（又名访问器方法）来读取和写入字段。这个问题讨论了设置字段的另一种方法，即利用构造函数。\n\
  \n代码本身像往常一样简单；不包含陷阱，这个问题是一个典型的“直路题”。第一个无名对象的 `str` 字段在构造函数中初始化，该构造函数没有触及变量 `a`，而第二个对象镜像了这种情况，使得\
  \ `str` 保持不变。事实上，对于这个特定的类来说，完全没有必要给 `str` 赋值 \"null\"，因为变量默认被设置为 `null`，然后 `println()`\
  \ 就会自动打印 `null` → 输出没有变化。\n\n`println()` 方法的调用看起来很奇怪，但由于它是我们自己定义的，所以也没有错误。\n\n###\
  \ 问题 2.23 – C\n\n**给于：**\n\n![](img/00187.jpeg)\n![](img/00188.jpeg)\n\n**结果是什么？**\n\
  \nA. `80 Junior`\nB. `120 Senior`\nC. `170 Grandpa`\nD. `编译失败`\n\n另一个关于“如何通过对象引用设置字段”的调变体。这里没有惊喜；至于方法\
  \ `test2()` 中空的 `return` 语句，它虚弱地、半无力地试图在我们的路径上抛出一个一个红鱱（干扰项）——并惨遭失败，因为我们知道如何读取方法签名。\n\
  \n这段代码最重要的一点是只有一个对象，只有它的两个不同引用，所以 `System.out.println(e1 == e2)` 返回 `true`。这是因为两个方法都没有创建任何新东西，它们只是影响实例字段。\n\
  \n行 `t1` 创建了一个对象 `e1`，其字段读取为 80 和 \"Junior\"，因为它们是构造函数 `Engine()` 这样设置的。之后，`test1()`\
  \ 将它们更改为 120 和 \"Senior\" —— 然后呢？方法在第 `t2` 行给 `e2` 赋值了什么？一个全新的对象，还是对我们已有对象的引用？思考一下。\n\
  \n好的，它是对原始对象的引用；如果要返回一个新对象，第 `t3` 行应该是 `return Engine()`。\n\n### 问题 2.24 – B\n\n\
  **给于：**\n\n![](img/189.jpeg)\n\n**结果是什么？**\n\nA. `Darcula`\nB. `null : Darcula`\n\
  C. `Darcula : null`\nD. `在此时抛出空指针异常`\n\n只是关于 setter 和 getter 的简单示例。虽然 `var2` 的更改完全没有影响\
  \ `var1`（带有一些与字符串池相关的复杂性，对我们这些考生来说是如此）。\n\n### 问题 2.25 – B\n\n**给于：**\n\n![](img/190.jpeg)\n\
  \n**结果是什么？**\n\nA. `a, bc, d`\nB. `a, bd, d`\nC. `c, bd, d`\nD. `b, cc, d`\n\n原始类型和引用变量区别的另一个说明。让两个不同的引用指向同一个对象允许通过它们改变对象的状态。\n\
  \n### 问题 2.26 – D\n\n**给定以下类：**\n\n![](img/191.jpeg)\n![](img/192.jpeg)\n\n**哪条语句设置了对象\
  \ `std` 的 `name` 字段？**\n\nA. `std.setName() = \"John Smith\";`\nB. `setName(\"John\
  \ Smith\");`\nC. `Student.setName(\"John Smith\");`\nD. `std.setName(\"John Smith\"\
  );`\n\n选项 A 错误地使用了 `setName()` 方法，它需要一个 **String** 参数。\n\n选项 B 是无效的，因为 `setName()`\
  \ 不是 `static` 的，因此应该在 `std` 对象上调用。\n\n最后，选项 C 也是错误的，因为它通过类名调用 `setName()`，这只对 `static`\
  \ 成员允许。\n\n### 问题 2.27 – A\n\n**给于：**\n\n![](img/193.jpeg)\n\n**运行时内存中创建了多少个 `ObjectsGalore`\
  \ 类的对象？**\n\nA. `1`\nB. `4`\nC. `8`\nD. `编译失败`\n\n尽管 Java 提供了多种创建对象的方法，但对于 1Z0-808\
  \ 我们记住两种：1) 使用 `new` 关键字的类实例化表达式；2) 仅适用于 **String** 类的快捷方法，即通过使用双引号（带有一些与字符串池相关的复杂性，对我们这些考生来说是如此）。\n\
  \n幸运的是，这个问题不包含 **String**，所以我们可以心安无愧地问自己这里唯一的问题：这段代码包含了多少个 `new` 操作？\n\n\n\n\n\n\
  只有一个 → 因此只有一个对象，其他所有东西只是杂质。预计考试上会遇到类似的问题。\n\n### 问题 2.28 – C\n\n**给定：**\n\n![](img/00194.jpeg)\n\
  \n**哪条语句插入第 X 行可以正确初始化一个 `ExamTaker` 实例？**\n\nA. `ExamTaker examTaker = \"Bob\"\
  ;`\n\nB. `ExamTaker examTaker = ExamTaker.new(\"Bob\", 100, \" 1Z0-808\");`\n\n\
  C. `ExamTaker examTaker = new ExamTaker();`\n\nD. `ExamTaker examTaker = ExamTaker(\"\
  Bob\", 100, \" 1Z0-808\");`\n\nE. `以上均非`\n\n该题通过提供选项 E 试图误导我们。由于选项 B 和 D 显然是无效（因为\
  \ B 不正确地使用了 `new`，而 D 完全省略了 `new`），且选项 A 无法编译（因为 `ExamTaker` 类不是 `String`），我们只剩下\
  \ C 和 E。\n\n现在，人们可能想选择 E，因为它看起来选项 C 并没有初始化对象——毕竟，它没有将字段设置为某些有意义的值，对吧？——但这仅仅是表象。事实上，字段的自动初始化是任何对象生命周期中所蕴含的，因为\
  \ Java 保证“每个类变量、实例变量或数组组件在创建时都会被初始化为默认值”（回想 问题 2.1），所以即使是空构造函数也不可能意味着字段未被初始化：无参构造函数\
  \ `ExamTaker()` 并没有修改它们的默认值，仅此此了。\n\n### 问题 2.29 – C\n\n**给定：**\n\n![](img/00195.jpeg)\n\
  \n![](img/00196.jpeg)\n\n**哪条语句是正确的？**\n\nA. 在第 14 行之后，有三个对象可以被垃圾回收。\n\nB. 在第 14\
  \ 行之后，有两个对象可以被垃圾回收。\n\nC. 在第 14 行之后，有一个对象可以被垃圾回收。\n\nD. 在第 14 行之后，没有任何对象可以被垃圾回收。\n\
  \n有三个 `new` 关键字，因此有三个对象。由于第 12 – 14 行遵循某种之字形模式：\n\n![](img/00197.jpeg)\n\n人们可能想将它们简单地视为带有链式赋值的语句：\n\
  \n![](img/00198.jpeg)\n\n是的，这会将所有三个引用设置为 `null`，从而使所有三个对象都可以被垃圾回收——但我们的代码工作方式不同。要查看证明，请将第\
  \ 15 行替换为：\n\n![](img/00199.jpeg)\n\n只有尝试访问 `s2.name` 时抛出了 NPE（空指针异常）。\n\n那么，问题\
  \ 2.29 发生了什么？第 12 行将 `s1` 指向由 `s3` 引用的对象（我们称之为 \"Carol\"），然后第 13 行重新赋值 `s3` 指向由\
  \ `s2` 引用的对象 (\"Bob\"），最后将 `s2` 设置为 `null`。因此只有 `s2` 可以进行 GC（垃圾回收）。\n\n在学习这一目标时，你应该通过尝试在关键点之后访问对象的成员来检查你的结论是否正确，因为\
  \ NPE 意味着该特定对象已经可以被收割了。\n\n### 问题 2.30 – D\n\n**给定：**\n\n![](img/00200.jpeg)\n\n\
  **由第 18 行创建的对象 `ab` 何时可以进行 GC？**\n\nA. 在第 22 行之后\n\nB. 在第 23 行之后\n\nC. 在第 24 行之后\n\
  \nD. 在此程序中永远不会\n\n由于有这么多字段赋值和将引用变量设置为 `null`，这个问题似乎有点复杂。由于无法立即看出谁依赖于谁，以及当某人被移出方程式时究竟会发生什么，最好将整个故事画成图。\n\
  \n在进行了大量实验后，我发现这种对象的图形化表示对我最有效：\n\n![](img/00201.jpeg)\n\n最终结果类似于一个经过修改的粗略 UML 图，每个方面都至关重要：对象是矩形的，引用变量（换句话说就是对象的名称）位于左下角，顶部有一个开放空间，字段由线条分隔，而类型-动作类型组合（即\
  \ Rt At）位于对象内部底部。\n\n这个小工具在处理与 GC 和继承相关的问题时同样有效。在需要跟踪 `static` 字段内容的情况下，我将字段放在椭圆内（尽管你可能知道，UML\
  \ 规则规定对 `static` 特性要加下划线）。\n\n至于表示对象*内部*的行为特征，我在整个准备期间从未需要过，所以这取决于你如何想出描述方法签名的最佳方式……\n\
  \n好了，让我们把这些小技巧应用到我们的问题中，看看它们在实践中如何运作。\n\n第 17 行到 19 行画了下面的图（为了节省时间，此处为图片）：\n\n```\n\
  (images/0002.jpeg)\n```\n\n第 20 行到 22 行改变了它：\n\n```\n(images/0003.jpeg)\n```\n\n\
  最后，第 23-24 行：\n\n```\n(images/0004.jpeg)\n```\n\n以下显示所有对象都是存活的：\n\n```\n(images/0005.jpeg)\n\
  ```\n\n### 问题 2.31 – AC\n\n**给定：**\n\n![](img/0206.jpeg)\n\n**独立进行的哪两种修改可以使代码打印出\
  \ `Gone with Wind, true: 9.5`？**\n\nA. `b.title = \"Gone with Wind\";` `b.secondHand\
  \ = false;` `b.price = 9.5;`\n\nB. `this.title = \"Gone with Wind\";` `this.secondHand\
  \ = false;` `this.price = 9.5;`\n\nC. `this.title = new String(\"Gone with Wind\"\
  );` `this.secondHand = new Boolean(false);` `this.price = new Double(9.5);`\n\n\
  D. `title = \"Gone with Wind\";` `secondHand = FALSE;` `price = 9.5f;`\n\nE. `this(\"\
  Gone with Wind\", false, 9.5);`\n\n选项 B 是错误的，因为它将三个实例变量都放在了静态上下文中。\n\n选项 D 也无法编译，因为它想要将\
  \ FALSE 赋值给原始 `boolean` 变量，而 FALSE 不是 `boolean` 值的有效关键字。下面的操作可以运行，因为 Boolean 会拆箱：\n\
  \n```\n(images/0207.jpeg)\n```\n\n对于选项 E，它也会抛出异常，因为 **Book** 类没有定义相应的三个参数构造函数。\n\
  \n### 问题 2.32 – B\n\n**给定：**\n\n![](img/0208.jpeg)\n\n**结果是什么？**\n\nA. true false\
  \ false\n\nB. true true false\n\nC. false false false\n\nD. 运行时抛出 IllegalArgumentException\n\
  \nE. 运行时抛出 NullPointerException\n\n这个问题测试你是否知道 **Boolean** 类有一个不区分大小写的构造函数，它接受一个\
  \ **String**，如果输入字符串以任何拼写读取 \"true\"，则分配一个表示 `true` 值的 **Boolean** 对象，否则分配表示 `false`\
  \ 的 **Boolean**。`parseBoolean(String str)` 方法也是如此。\n\n此外，与其他所有包装类一样，**Boolean**\
  \ 还有另一个接受底层原始类型的构造函数，即 `boolean`。\n\n### 问题 2.33 – E\n\n**给定：**\n\n![](img/0209.jpeg)\n\
