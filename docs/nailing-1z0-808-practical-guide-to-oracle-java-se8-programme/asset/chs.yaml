  \ 由 Dustin Marx 编写解释了如何实现。考试中确实包含这样的问题。\n\n### 问题 7.7 – C\n\n**给定：**\n\n![](img/00582.jpeg)\n\
  \n**`objA` 的引用类型是什么？该变量引用的对象的实际类型是什么？**\n\nA. 引用类型是 A；对象类型是 A。\nB. 引用类型是 C；对象类型是\
  \ C。\nC. 引用类型是 A；对象类型是 C。\nD. 引用类型是 C；对象类型是 A。\n\n`reftype` 表示引用变量的类型，根据 Java 语法规则，它始终位于变量声明的左侧。\n\
  \n`actype` 或实际对象类型由放在声明右侧的构造函数决定。\n\n在我们的情况下，对象 `objA` 恰是 `objC`，它的 `actype` 是 `C`，这可以通过将行\
  \ `b1` 替换为以下语句来验证：\n\n![](img/00583.jpeg)\n\n`@Override` 注解可能不会出现在考试中，但被认为是一种良好的编程实践。\n\
  \n代码在没有显式转换的情况下通过编译，因为 `B` 比 `C` 宽，且 `A` 比 `B` 宽。运行时没有 `ClassCastException`，因为 `C`\
  \ 与 `B` 之间以及 `B` 与 `A` 之间的 IS-A 关系成立。相比之下，下一个代码段的最后一个赋值需要显式转换，因为 `Object` 比 `Short`\
  \ 宽，并且由于两者之间不满足 IS-A 测试（`sH produces` 产生的数据），会抛出 CCE。\n\n![](img/00584.jpeg)\n\n\
  最后，当前问题 7.7 中的代码打印出 \"Hello from C!\"，因为 `toString()` 方法非 `private` 且非 `static`，因此具有多态性\
  \ → 类 `C` 重写的 `toString()` 版本被执行，是因为 `actype` 决定了调用哪一个，而实际对象类型是 `C`。\n\n### 问题 7.8\
