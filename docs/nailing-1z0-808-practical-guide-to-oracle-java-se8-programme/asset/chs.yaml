  \ 第 4、3、2 行编译失败\n\nE. 编译失败\n\n这个问题与问题 6.12 相似，尽管这里我们处理的是基本数据类型。变量 `a` 和 `b` 在同一个构造函数中被显式初始化，但变量\
  \ `b` 是 `static` 的，这使得情况复杂化。此外，打印语句仅在影响我们三个对象的所有操作执行后才会运行。\n\n当创建第一个对象时，两个字段都被赋予了相同的值\
  \ 20，因为非`final` 非局部变量是隐式初始化的，且 `if(0<20)` 结果为 `true`。当第二次调用构造函数时，`b` 的值（等于 20）仍然小于\
  \ `input`（等于 60），因此两个变量再次获得相同的值。由于 `b` 是 `static` 的，它的当前值 60 被两个对象共享。\n\n当构造函数初始化第三个对象时，情况发生了变化：由于\
  \ 40 小于 60，赋值语句没有执行。由于 `b` 是 `static` 的，因此对该类的所有实例共有，变量 `b` 保持等于 60，而变量 `a` 没有被显式初始化，因此保留了其默认值零。\n\
  \n\n\n\n这是一个考试题示例，它省略了某些方法的定义，而仅使用占位符。如果我没记错的话，我只遇到过一次，是在第二次复习时，这可能意味着它是不计分的……\n\
  \n我不记得实际考试中是否使用了 `@Override` 注解，但我还是把它放在了这里，以提醒你注意 `Object` 类的 `toString()` 方法签名；考试的其中一道题依赖于它。\n\
  \n现在来看手头的任务。行 `E1` 是无效的，因为该类从未定义显式的无参构造函数。`default` 构造函数也不可用，因为当涉及的数据类型完全没有定义构造函数时，编译器才会插入它。\n\
  \n行 `E2` 也无法编译，因为我们不能通过类名来调用构造函数；相反，应该使用 `this()` 和 `super()` 关键字。\n\n最后一点，缺失的访问器（accessors）和修改器（mutators）定义可以这样写：\n\
  \n```\npublic void setName(String name){ this.name = name;}`\npublic void setScore(int\
  \ score){ this.score = score; }\npublic String getName(){ return this.name; }\n\
  public int getScore(){ return this.score; }\n```\n\n### Problem 6.25 – A\n\n**给定：**\n\
  \n![](img/00496.jpeg)\n\n**结果是什么？**\n\nA. Hi!\nB. Hello!\nC. 无输出\nD. 编译失败\nE. 抛出\
  \ RuntimeException\n\n这只是通过构造函数初始化实例字段的简单示例。没有陷阱或复杂的技巧。\n\n### Problem 6.26 – A\n\
  \n**给定：**\n\n![](img/00497.jpeg)\n\n**哪个类拥有默认构造函数？**\n\nA. 只有 A\nB. 只有 B\nC. 只有\
  \ C\nD. A 和 B\nE. B 和 C\nF. A 和 C\nG. 三者\n\nJava 语言规范 §8.8.9 *默认构造函数* 说：\n\n如果一个类不包含任何构造函数声明，则隐式声明一个默认构造函数。\n\
  \n在为考试学习构造函数时，我发现如果将默认构造函数视为一个隐形的自封选美，她只讨厌并害怕竞争对手，很多问题就可以解决得更快：\n\n–默认构造函数是不可见的，不是吗？\n\
  –而且如果另一个构造函数出现在领台上，Def Con 绝不会参加那场选美比赛。\n\n所以，由于选项 A 没有定义任何构造函数，Def Con 在类 `A` 内部毫无竞争地统治着。同样，由于选项\
  \ B 和 C 都定义了构造函数，Def Con 认为自己太迷人和高贵了，不屑陪它们。\n\n### Problem 6.27 – C\n\n**给定四个源文件的内容：**\n\
  \n![](img/00498.jpeg)\n\n**将哪个类定义插入到行 `C1`，将使代码通过编译？**\n\nA. `class C extends A\
  \ { }`\nB. `class C extends B { }`\nC. `class C extends D { }`\nD. `class C extends\
  \ E { }`\nE. 以上都不是\n\n位于不同包中的非公共 `class` 类是不可访问的；这可以说是是考试中最重要的规则之一。遵循这一规则，我们可以看到选项\
  \ A 是错误的。\n\n选项 B 不起作用，因为类 `B` 是 `final` 的，根据定义不能被扩展。\n\n现在看选项 D；虽然类 `E` 是 `public`\
  \ 的，因此可以从包外部访问，但它的无参构造函数是 `private` 的，因此类 `C` 无法使用。不过，以下类定义是可以行的：\n\n![](img/00499.jpeg)\n\
  \n请记住，与与其类共享访问级别的默认构造函数不同，非默认构造函数不受此规则限制；这就是为什么我们必须在行 `XXX` 的构造函数声明上添加 `public`\
  \ 修饰符。`protected` 修饰符也会有帮助。\n\n最后，选项 C 没有问题，因为扩展抽象类是自然的（毕竟，否则如何实现它的抽象方法呢？）。尽管声明\
  \ `private void D()` 看起来像一个无参构造函数，但它定义了返回类型，因此它仍然是一个恰好与类同名的方法。此外，由于类 `D` 是 `public`\
  \ 的，它的默认构造函数也是 `public` 的，因此对类 `C` 可用。\n\n### Problem 6.28 – C\n\n**给定两个类：**\n\n\
  ![](img/00500.jpeg)\n![](img/00501.jpeg)\n\n**将哪个选项插入到行 `XXX`，将使类 `Scheduler` 打印\
  \ `Bob in 2016: [1Z0-808, 1Z0-809]`？**\n\nA. `private Exams(String name, int year,\
  \ List exams)`\nB. `public void Exams(String name, int year, List exams)`\nC. `Exams(String\
  \ name, int year, List exams)`\nD. `Exams(String name, int year, ArrayList exams)`\n\
  \n由于选项 A 中的构造函数是 `private` 的，类 `Scheduler` 将无法访问它。\n\n选项 B 定义的是方法而非构造函数，而选项 D 需要\
  \ `ArrayList`，但构造函数的调用仅提供了 `List`。\n\n### Problem 6.29 – C\n\n**给定：**\n\n![](img/00502.jpeg)\n\
  \n**哪种修改将使代码编译并打印 `Hello`？**\n\nA. 移除 `Parent()` 构造函数\nB. 将 `Child()` 构造函数改为 `public`\n\
  C. 为 `Parent()` 构造函数添加 `protected` 修饰符\nD. 移除 `Child()` 构造函数\nE. 从 `Child()` 构造函数中移除\
  \ `private` 修饰符\n\n不同包的类……这意味着我们应该警惕潜在的访问权限问题。考试中的一个陷阱基于这样的规则：默认构造函数与其类具有相同的访问级别，因此以下无法编译：\n\
  \n![](img/00503.jpeg)\n![](img/00504.jpeg)\n\n在我们的情况下，父类 `Parent` 是 `public` 的，但没有默认构造函数（本应该是\
  \ public）。相反，`Parent` 显式定义了一个无参构造函数并将其变为包私有，从而阻止了类 `Child` 访问它。我们只需要让 `Parent` 的无参构造函数可见\
  \ → 除了 C 之外的所有选项都被排除。\n\n自然，我们可以将 `Parent()` 构造函数改为 `public`；也可以。\n\n### Problem\
  \ 6.30 – D\n\n**关于默认构造函数的哪个陈述是正确的？**\n\nA. 它可以接收参数\nB. 它在声明中具有隐式的 public 修饰符\nC.\
  \ 它可以由程序员添加\nD. 子类的默认构造函数总是调用父类的无参构造函数。\n\n默认构造函数根据定义是无参构造函数，所以选项 A 错误。由于它与类共享相同的访问级别，所以选项\
  \ B 也是错误的。因为默认构造函数仅由编译器添加，我们也可以排除选项 C。\n\n更有趣的是正确的选项 D，它提醒我们代码的内容比看到的要多：\n\n![](img/00505.jpeg)\n\
  \n`A` 的父类是 `Object` 类，它的 JavaDoc 可能是所有类中最短的：\n\n`Object` 是类层次结构的根。每个类都有 `Object`\
  \ 作为父类。包括数组在内的所有对象都实现了类的方法。\n\n### Problem 6.31 – DE\n\n**给定：**\n\n![](img/00506.jpeg)\n\
  \n**哪两行代码可以独立地添加到行 X？**\n\n![](img/00507.jpeg)\n\n选项 A 说明了一个你会在考试中一定会遇到的陷阱：编译器总是尝试在看到的每个可用构造函数中插入一个无参的\
  \ `super()` 调用。这里说的“可用”是指该构造函数没有它自己的 `super()` 或 `this()` 调用，无论它有多少个参数。\n\n在我们的情况下（我们仍在讨论选项\
  \ A），由于类 `Parent` 没有无参构造函数，给类 `Child` 添加一个无参构造函数会导致报错。\n\n选项 B 和 C 面临同样的问题：尽管编译器想要插入一个无参的\
  \ `super()` 调用，但类 `Parent` 没有匹配的构造函数。\n\n\n\n\n\n编译器不会发脾气的情况只有选项 D 和 E：它们自身对 `super()`\
  \ 和 `this()` 的调用防止了编译器盲目地插入无参数的 `super()` 调用。毕竟，由于对 `super()` 或 `this()` 的调用必须是任何构造方法体中的第一个语句，因此任何构造方法都不可能包含*两个*这样的调用。\n\
  \n## 问题 6.32 – A\n\n**给定：**\n\n![](img/00508.jpeg)\n\n**结果是什么？**\n\nA.i iaou iaouaoe\n\
  B.i iiaou iiaouaoe\nC.i iaou iaouiaoe\nD.i aiou aioue\n\n这个问题可能比实际考试中涉及初始化顺序的题目难一倍——如果你真的遇到过的话；因为我只遇到过一次这样的题目。无论如何，要破解它，我们需要记住四个简单的规则：\n\
  \n| 规则 1：`static` 初始化器最先运行，且它们只运行一次； |\n| 规则 2：它们在整个继承链中按声明顺序一个完成后； |\n| 规则 3：然后对于每个创建的对象，实例初始化器都会介入；\
  \ |\n| 规则 4：构造方法是最后运行的。 |\n\n将之转化为代码：\n\n![](img/00509.jpeg)\n\n代码输出：\n\n![](img/00510.jpeg)\n\
  ![](img/00511.jpeg)\n\n根据规则 1 和规则 2，当 JVM 开始执行入口处的代码（即 `main()` 方法）时，所有三个类的静态初始化器都会开始作用，从\
  \ `Grandpa` 开始，接着是 `Father`，最后由 `Grandson` 完成。看起来静态初始化器在类被访问时就会运行，但实际上，这个过程更为复杂。Java\
  \ 语言规范（JLS）是这样说的：\n\n类或接口类型 `T` 将在以下任何一种情况首次出现之前立即初始化：\n\n- `T` 是一个类且创建了 `T` 的实例。\n\
  - 调用了由 `T` 声明的静态方法。\n- 给由 `T` 声明的静态字段赋值。\n- 使用了由 `T` 声明的静态字段，且该字段不是常量变量。\n\n还有几种触发初始化的情况，但它们对于我们的讨论来说太高级了。无论如何，我们可以看到在我们的案例中是第二个条件导致了静态初始化器的运行：“调用了由\
  \ `T` 声明的静态方法”——而 `main()` 是静态的。\n\nJLS 补充道\n\n当一个类被初始化时，它的父类会被初始化（如果它们之前还没有初始化过）\n\
  \n这解释了为什么上面示例中的*三个*类都运行了它们的静态初始化器。这也解释了为什么下面的代码只打印了一次“Hello from Base!”：\n\n![](img/00512.jpeg)\n\
  \n回到之前的示例。静态初始化器完成工作后，JVM 将注意力转向 `main()` 方法的内容，该方法打印了程序即将开始创建对象。规则 3 和 4 规定任何对象的初始化都从其父类开始，这正是我们的情况：首先按声明顺序运行\
  \ `Grandpa` 类的实例初始化器，然后是 `Grandpa` 的构造方法——该过程在 `Father` 和 `Grandson` 类中重复。当 JVM\
  \ 创建第二个对象时，发生了完全相同的情况。\n\n总之，初始化顺序归结为以下事件链：\n\n![](img/00513.jpeg)\n\n现在是时候重新看我们的问题了。过程始于给静态字段\
  \ `word` 赋值一个空字符串，这为了使其非 `null`，否则我们的打印统计将输出类似 `null` 后面跟着其他内容的内容。\n\n然后第 `h3` 行的静态初始化器执行，向仍然为空的\
  \ `word` 中添加 `i`，从而使其值等于 \"i\"。此时，我们已经用完了所有的静态初始化器（无论是简单的声明还是整个代码块），因此 `main()`\
  \ 方法执行第 `t1` 行，从而打印静态变量 `word` 后面跟一个空格，即 \"i \"。\n\n接下来是第 `t2` 行，它通过调用单参数构造方法并传递一个\
  \ `String` 类型的参数来创建一个 `Hamlet` 对象。这启动了一个全新的事件链，这次涉及实例初始化器和构造方法。由于字段 `word` 是 `static`\
  \ 的，它保留了之前的值 \"i\"，实例初始化器对其添加 `a`（`h2` 行），然后是 `o`（`h4` 行），随后 `h1` 行的构造方法将其拼接为 \"\
  u\"。此时 `word` 的值变为 \"iaou\"，所以第 `t3` 行的打印语句愉快地输出了它并加上末尾空格——选项 B 和 D 被排除。\n\n当第 `t4`\
  \ 行请求一个新的 `Hamlet` 对象时，该过程重复；但这次，`word` 的值为 \"iaou\"，实例初始化器对其添加 \"ao\"，构造方法通过追加\
  \ \"e\" 完成最后的拼接。\n\n\n\n\n\n## 结果是什么？\n\nA. `str=null sb=null`\n\nB. `str=aaa sb=null`\n\
  \nC. `str=aaa sb=bbb`\n\nD. `str=aaa sb=aaabbb`\n\nE. `str=aaa sb=bbbaaabbb`\n\n\
  F. `编译失败`\n\nG. `运行时抛出 NullPointerException`\n\n由于 Java 始终是值传递的，将局部引用设置为任何值（在我们的例子中为\
  \ `null`）都不会影响调用者。正是于那些讨厌的引用上进行方法调用产生了影响 $\\rightarrow$ `XXX` 行和 `XXXX` 行是无关紧要的，而\
  \ `XX` 行确实起了作用。至于 `X` 行，由于 `String` 的不可变性，它仅仅导致了新对象的创建。\n\n***\n\n- 是的，`void` 也是一种数据类型。`java.lang`\
  \ 包包含 `Void` 类，根据 JavaDoc，它是“一个不可实例化的占位类，用于持有表示 Java 关键字 `void` 的 `Class` 对象的引用”。它的父类是\
  \ `java.lang.Object`。很自然。\n- 换句话说，其类型与声明的返回类型不冲突。\n- 请注意这不是“静态导入”（static import）。记住这一点最简单的方法是将\
  \ `import` 关键字视为一个直接命令（即一个祈使：“嘿你！醒醒，`import static` 诸此类东西……”）。\n- 请注意，编译器生成了一个具有误导性的错误信息，说\
  \ `One` 中的构造函数 `One()` 不是 `public` 的。嗯，它不必是 `public`；是 `protected` 就足够了。\n- `static`\
  \ 静态块和实例初始化块都按照它们出现的顺序执行。\n- 这有两个原因。首先，变量 `str` 是 `static` 的，所以任何构造函数都是可能的。其次，默认构造函数根据定义会被自动插入，并且只包含一条语句：`super();`（参考\
  \ JLS8, §8.8.9：“……默认构造函数简单地调用无参数的父类构造函数。”）。为 `javac` 编写错误信息的人在这个特定方面一定不及格了……很有趣。\n\
