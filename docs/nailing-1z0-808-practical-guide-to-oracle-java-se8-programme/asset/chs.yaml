  \ `Error`\n\n`java.lang.Error` 类的 API 文档说明：\n\nError 是 `Throwable` 的子类，表示合理的应用程序不尝试捕获的严重问题。大多数此类错误都是异常状况。\n\
  \n捕获错误被认为是不良习惯。响应此类问题的更好方法是打印堆栈跟踪并退出 → 选项 E 是错误的，因为 Java 没有显式禁止捕获 `Error`。\n\n现在让我们考虑选项\
  \ D。虽然无限 `for` 循环确实可能因为循环后存在不可达的语句而导致编译器，但将其封装在 `try` 块中^(130) 提供了逃逸的可能性 → 选项 D\
  \ 被排除。\n\n然而，我们的代码中发生了什么？`for(;;)` 确实是无限的^(131)，`add()` 方法将快乐地一个接一个地添加新元素，直到……直到……\
  \ 等一下！`ArrayList` 到底能有多大？！\n\n`ArrayList` 的文档说明 `size()` 方法返回一个 `int`；我们还知道 `Integer.MAX_VALUE`\
  \ 是 2 的 31 次方（因为 `int` 存储一个有符号的 32 位整数值，其中半部分空间用于表示负数）。我们是否可以将其视为表明，即我们的 `list`\
  \ 达到这个限制后，过程中某些地方必须妥协抛出异常？听起来很有逻辑，但我们还没有脱险，因为仍然需要弄清楚是什么种异常：是 RTE 还是 Error。\n\n`ArrayList`\
  \ 对 `size()` 的描述非常模糊：它只说该方法“返回此列表中元素的数量”。另一方面，`ArrayList` 实现了 `List`，而 `List` 的文档则更为通俗：\n\
  \n```\nint size()\n```\n\n返回此列表中元素的数量。如果此列表包含的元素数量超过 Integer.MAX_VALUE，则返回 Integer.MAX_VALUE。\n\
  \n事实就是如此：`ArrayList` 可能包含超过 2³¹ 个元素，只是它报告的大小不能超过这个限制 → 我们最初的推理链并不完全正确，因为代码将消耗所有可用堆空间\
  \ → 只有那时 JVM 才会抛出 `OutOfMemoryError` → 然后被捕获 → 执行将正常终止（尽管需要几秒钟）。\n\n我亲爱的读者可能会反对：我们在考试中是不允许查阅\
  \ API 文档的。确实如此，但实际问题都没有深入到那种程度。把这个问题看作是通往下一章 的桥梁，该章节涉及许多 Java 核心类，包括 `ArrayList`。此外，记住有时情况比表面看起来复杂可能不是个完全坏主意。\n\
  \n最后一点，请注意注意代码列表没有提到对 `java.util.List` 或 `java.util.ArrayList` 的导入。这符合我们被要求在考试中做出的假设一致（参考\
  \ Chapter II.0 中的 *Missing package and import statements*，以及 **Opening Remarks*）。\n\
