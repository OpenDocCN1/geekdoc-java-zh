  \ `doStuff()` 内部正在酝酿的恶性惊喜 → 编译器不能也不会让这种不可言说的事情发生。\n\n另一方面，选项 C 形成了一个适当的警告链——从 `doStuff()`\
  \ 到 `main()` 再到其他——而选项 D 为 `main()` 配备了一个升级版的网，这次不会让 IOE 溜走。\n\n### Problem 8.3\
