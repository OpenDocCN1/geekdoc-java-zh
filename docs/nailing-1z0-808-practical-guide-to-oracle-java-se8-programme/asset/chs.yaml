  \n![](img/00069.jpeg)\n\n## 答案与解析\n\n### 题目 5.1 – ABCE\n给定以下类：\n![](img/00398.jpeg)\n\
  \n哪些选项可以替换 `***` 以便类能够编译并运行？（多项选择）\n\nA. `int e : arr`\nB. `int i = 0; i < 0; i++`\n\
  C. `; ;`\nD. `int i; i < 4; i++`\nE. `boolean b = true; b; b = !b`\n\n选项 A 是一个普通的\
  \ `for-each` 循环。\n\n选项 B 是经典形式的 `for` 循环；但执行流不会进入此循环，因为终止条件从一开始就评估为 `false`。\n\n\
  由于选项 C 被处理为 `for(true)`，该循环是无限的，程序永远不会结束。如果代码在此行之后还有其他语句，它们将是不可达，从而抛出编译错误。\n\n选项\
  \ D 是无效的，因为循环变量 `i` 缺少初始化。\n\n至于选项 E，它看起来确实有点不寻，但仍然是完全有效的。它执行一次，然后终止条件（准确地说是变量 `b`\
  \ 的值）在更新部分被取反，从而停止循环。\n\n### 题目 5.2 – B\n给定以下类：\n![](img/00399.jpeg)\n\n哪个选项将使代码打印\
  \ `54321`？\n\nA. 替换第 5 行为 `System.out.print(--a);`\nB. 替换第 5 行为 `System.out.print(a);\
  \ a--;`\nC. 替换第 5 行为 `--a; System.out.print(a);`\nD. 替换第 9 行为 `return a > 0 ? false\
  \ : true;`\n\n未修改形式的代码会进入无限 `while` 循环并反复打印 5。\n\n选项 A 是错误的，因为初始输出是四个而不是五个，因为前置运算符先改变了变量的值。\n\
  \n选项 C 与选项 A 基本相同，而选项 D 没有帮助，因为它阻止了执行流进入。\n\n正确答案是 B，可以重写为 `System.out.print(a--);`。\n\
