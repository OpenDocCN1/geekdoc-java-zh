  \ `a` 未经修改的值。\n\n## 问题 6.5 – A\n\n**假设一个方法被声明为接收两个参数，但调用者只向它传递了一个参数。结果是什么？**\n\n\
  A. 编译失败。\n\nB. 缺失的参数将被赋予其声明类型的默认值。\n\nC. 在运行时抛出 `IllegalArgumentException`。\n\n\
  D. 在运行时抛出 `NoSuchMethodException`。\n\n此答案显而易见。我包含这个问题出于一个简单的原因：有一个机会更多地讨论一下方法调用。将其看作是一个帮助从另一个角度观察方法调用的小细节即可。\n\
  \n方法调用在编译时和运行时都会解析。编译器关注重载（overloading），而 JVM 则处理重写（overriding）（我们将在下一节 章节）中讨论它）。在编译时解析方法名分为以下几个步骤：\n\
  \n– 首先，编译器确定要查找哪个类或接口；\n\n– 然后，使用方法名和参数表达式对上一步确定的类型进行成员方法扫描。编译器想要那些既是 `accessible`（可访问）又是\
  \ `applicable`（适用）的方法；换句话说，它在寻找在给定参数列表中可以正确调用的声明；\n\n– 最后，编译器通过检查方法调用的参数与其目标类型之间的兼容性，来决定所选方法是否合适。\n\
  \n与重载不同，重写还涉及返回类型和 `throws` 子句。\n\n到目前为止很好；现在是有趣的部分。JLS8 规范是这样说的：\n\n最具体方法的描述符（签名加返回类型）是运行时用于执行方法分发的^(91)。\n\
  \n这在 JVM8 规范中可以找到：\n\n方法签名编码了关于（可能是泛型的）方法声明的类型信息。它描述了方法的任何类型参数；任何形式参数的（可能是参数化的）类型；任何（可能是参数化的）返回类型（如果有的话）；以及方法\
  \ `throws` 子句中声明的任何异常的类型.^(92)\n\n这就是全部——Java 共和国立法分支和行政分支之间的巨大分歧：语言规范定义了 Java 是什么，它说方法签名不包括返回类型，而\
  \ JVM 认为并非如此。我说，我们的程序竟然能运行起来真是个奇迹……\n\n虽然这些内容不在 1Z0-808 考试中，但知道 Java 生态系统充满了矛盾仍然是一件好事，这意味着它注定会进一步发展——至少如果相信黑格尔的话^(93)。\n\
  \n## 问题 6.6 – B\n\n**给定：**\n\n![](img/00478.jpeg)\n\n**结果是什么？**\n\nA. 10 20 30 11\
  \ 21 31 10 20 30\n\nB. 10 20 30 11 21 31 11 21 31\n\nC. 编译失败\n\nD. 抛出 `RuntimeException`\n\
  \n数组是一个 `Object`，因此，尽管 `modify()` 方法操作的是数组引用变量的副本，但它仍然可以被更改。我们甚至可以将数组声明为 `final`，它的槽位仍然是可以修改的。\n\
