  \ 的调用封装在捕获 `Exception` 的 `try-catch` 块中\nC. 在 `run()` 的签名中添加 `throws Exception`\n\
  D. 在 `run()` 的签名中添加 `throws Exception` 并并将 `tripOverCat()` 的调用封装在捕获 `Exception`\
  \ 的 `try-catch` 块中\n\n又是“捕获或声明”。记住：我们总是从源点开始沿着调用堆栈向上移动。\n\n`tripOverCat()` 有 `try-catch`\
  \ 处理器吗？没有 → 选项列表提供了合适的处理器吗？是的。完成。\n\n### 题 8.11 – B\n\n**给定：**\n\n![](img/00677.jpeg)\n\
  \n**结果是什么？**\n\nA.!\nB. 运行时抛出 `StringIndexOutOfBoundsException`\nC. 运行时抛出 `NullPointException`\n\
  D. 运行时抛出 `IllegalArgumentException`\n\n虽然我们将在下一个章节，*使用 Java API 中的选定类* 中详细研究 `String`\
  \ 类，但第 t1 行上的方法调用是不言自明的：代码想要获取位于 `str` 位置的字符。\n\n再次是“捕获或声明”。记住：我们总是从源点开始沿着调用堆栈向上移动。\n\
