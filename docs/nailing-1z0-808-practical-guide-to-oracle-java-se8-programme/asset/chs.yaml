  \ `ArrayIndexOutOfBoundsException`\n\n## 3.4 使用 switch 语句\n\n![](img/00012.jpeg)\
  \ `switch` 表达式接受所有基本类型及其包装类（`boolean`、`long`、`float` 和 `double` 及其对应的包装类外） + `String`\
  \ + `enum`。\n\n![](img/00012.jpeg) `switch` 块中的每个 `case` 常量表达式能够赋值给 `switch` 表达式的类型。\n\
  \n→ `switch` 表达式的类型必须足够宽容纳所有 `case` 值；下例中的第一个 `case` 将无法编译，因为 128 无法赋值给 `b`，`b`\
  \ 只能存储 -128 到 127 之间的值：\n\n![](img/00257.jpeg)\n\n| **推论**： | 如果 `switch` 承诺接收一个\
  \ `byte`，它也会接受某些 `char`（例如 ‘a’，因为 ‘a’ 的数值（即 97）在 `byte` 的范围内）。对于 `short` 也是如此。 |\n\
  \n可以这样看：执行流不是从上到下的；恰恰相反；并不是 `byte` 可以装进 128 里面：而是 128 无法装进 `byte` 里面。\n\n想象 `switch`\
  \ 是一个顶部有一个开口的盒子（`switch` 表达式）；我们需要从箱子里取出一个合适的 `case` 值来计算——但如果该值大于开口，我们就无法做到：它根本无法通过！（脑海中形成：一只爪子插在瓶里的被困的小猴子）。\n\
  \n![](img/00012.jpeg) `switch` 中不允许出现两个相同的 `case` 值。\n\n→ 注意用作 `case` 值的字面量和变量。注意使用\
  \ `int` 等整数类型的 `switch` `case` 中的下划线；可能会有相同的双胞胎。\n\n![](img/00012.jpeg) 额外：`case`\
  \ 值不能是字面量 `null`。\n\n![](img/00012.jpeg) 额外：`case` 值可以定义使用字面值的表达式，如 `1 + 2`。\n\n\
  ![](img/00012.jpeg) `switch` 需要大括号，但其主体可以是空的。\n\n好了，接下来的内容并不完全关于 `switch` 本身，但我们仍然需要复习大括号的使用规则，所以让我们开始吧：\n\
  \n方法体、`switch` 块、三元运算符 (TCF) 结构以及带有 `return` 和/或语句的 lambda 表达式必须使用大括号 `{}`；`if`\
  \ 和循环则不需要（但注意 `do-while`；它在处理多一个语句/大括号时会出问题）。此外，TCF 结构被视为单一语句，因此围绕它们的任何内容可能都不需要大括号：\n\
  \n![](img/00258.jpeg)\n\n![](img/00012.jpeg) `switch` 表达式不接受声明。\n\n![](img/00012.jpeg)\
  \ `switch` 的 `case` 需要常量表达式（换句话说，它们在运行时必须是常量）。\n\n| **推论**： | 如果 `case` 表达式使用了变量，该变量必须是\
  \ `final` 基本类型，因为虽然 `switch` 接受某些包装类，但它的 `case` 表达式必须生成常量值——包装类不是常量（即使是静态的也不是）！\
