  D. 在此程序中永远不会\n\n![](img/00061.jpeg) **核心规则（含部分附加）：**\n\n## 2.5 开发使用 `Boolean`、`Double`\
  \ 和 `Integer` 等包装类的代码：\n\n![](img/00012.jpeg) 什么是包装类？\n\nJava 为每种基本数据类型提供了对应的专用类：\n\
  \n![](img/00153.jpeg)\n\n这些被称为包装类。\n\n![](img/00012.jpeg) 为什么我们需要包装类？\n\n有时，如果基本类型是对象，处理起来会变得更容易。例如，包装类为此类情况提供了许多实用的方法，但这些方法期望对象作为参数。有时仅仅只需要：例如，作为\
  \ `Collection`，`ArrayList` 不允许包含基本类型。在这种情况下，Java 可以将传递的基本参数自动装箱为相应的包装类型——然后我们就可以对它们使用\
  \ `java.util` 包中的方便方法，如 `Collections.sort()` 等。\n\n![](img/00012.jpeg) 什么是自动装箱？\n\
  \n自动装箱是指由编译器自动将基本数据类型转换为对象（即对应包装类的实例）。\n\n![](img/00012.jpeg) 什么是自动拆箱？\n\n将对象转换为其底层基本数据类型称为自动拆箱。\n\
  \n**附加：**\n\n![](img/00012.jpeg) 关于包装类的更多信息：\n\n![](img/00059.jpeg) 除了 `Character`\
  \ 所有基本包装类的构造函数（它只有一个构造函数：`Character(char value)`）都接受 `null` 并将其视为空 `String`，但它们随后会抛出\
  \ NFE（对于 `Float` 和 `Double` 则抛出 NPE），`Boolean(null)` 构造函数除外，后者返回 `FALSE`（与基本类型的\
  \ `false` 相对）。\n\n![](img/00059.jpeg) 没有任何基本包装类具有无参数构造函数。\n\n![](img/00059.jpeg)\
  \ 所有包装类（除 `Character` 外）都接受 `String`，且全部无例外地接受其底层基本类型；\n\n![](img/00059.jpeg) 最常用方法：\n\
  \n![](img/00154.jpeg) `Boolean.FALSE` 是一个 `Object`（`Boolean.TRUE` 也是如此）。\n\n![](img/00012.jpeg)\
  \ **构造函数：大多数情况下有两个构造函数**（除 `Character` 和 `Float` 外）\n\n![](img/00155.jpeg) `primitive\
  \ == wrapper` 有效；右侧会被拆箱。\n\n![](img/00012.jpeg) 传递给 `List<Wrapper>` 的基本类型将自动装箱。\n\
  \n然而——注意！——编译器将仅执行**单步**转换！例如不能向 `List<Integer>` 中添加 `byte` 或 `short`：\n\n![](img/00156.jpeg)\n\
  \n![](img/00012.jpeg) 包装类的解析器仅接受 `String`（或 `String`, 进制）。\n\n![](img/00012.jpeg)\
  \ `Boolean.valueOf(String)` 及其重载的 `Boolean.valueOf(boolean)` 版本返回 `Boolean.TRUE`\
  \ 或 `Boolean.FALSE` 包装对象的引用，而不会创建新对象。\n\n![](img/00012.jpeg) 所有包装类都是不可变的。\n\n![](img/00012.jpeg)\
  \ `Boolean.FALSE` 和 `Boolean.TRUE` 是静态常量。\n\n![](img/00012.jpeg) `Boolean.valueOf(true)`\
  \ 和 `Boolean.valueOf(false)` 不起。\n\n\n\n\n\n现在，问题 2.1 中的代码使用嵌套的 `for` 循环为数组 `astr`\
  \ 的第二维赋值了一些其他值，但在 `t2` 行的条件表达式中以第一维的长度为标准。由于该数组是锯齿数组（其第 2 维比第 1 维长），第 2 维的最后一个位置被排除在循环之外并保留了初始值，即\
  \ `null`。如果将 `t2` 行的条件表达式重写为 `j<astr[0].length`，第 2 维就不会包含任何 `null` 了。\n\n## 问题\
