  \ 问题 1.1 记忆得太深刻了，并且打算纯粹机械机械地遵循上一个解决方案的步骤（因此通过简单的交换数值得出选项 B），要么是在注意到 83 看起来是多么的格格不入后，你可能开始相信整个练习的重点是关于八进制表示法。\n\
  \n遗憾的是，事实并非如此，因为八进制法根本不在考试范围内。这个陷阱竟然就设计在 `Integer.parseInt()` 方法中。让我们再次查看核心 Java\
  \ API 附带的文档：\n\n![](img/00210.jpeg)\n\n*十进制*（Decimal）。而不是八进制。因此，前导零被剥离，代码输出：\n\n\
  input: 2013, output: 123\n\n这当然是选项 E。\n\n诚然，这个题对于 OCA 考试来说太狡猾了，显得很牵强，甚至带有侮辱性。通过将其包含在书中，我想提醒你，存在一种非零概率，考试可能会尝试利用我们倾向于操作的方式：当两个事物非常相似时，我们会开始沿着类似的思路思考。考试永远不会对完全相同的目标测试你超过一次，所以请保持专注，不要认为任何事情理所当然。\n\
