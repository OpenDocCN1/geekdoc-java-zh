  \n![](img/00639.jpeg)\n\n### 该组内的 1Z0-808 目标：\n\n| 8.1 | 区分检查异常 (checked exceptions)、未检查异常\
  \ (unchecked exceptions) 和错误 (errors) |\n| 8.2 | 创建 `try-catch` 块并确定异常如何改变程序的正常流\
  \ |\n| 8.3 | 描述异常处理的优势 |\n| 8.4 | 创建并调用一个抛出异常的方法 |\n| 8.5 | 识别常见的异常类（如 `NullPointerException`、`ArithmeticException`、`ArrayIndexOutOfBoundsException`、`ClassCastException`）\
  \ |\n\n![](img/00061.jpeg) **核心规则（带有一些额外）：**\n\n在一个公共块中涵盖所有内容：\n\n![](img/00012.jpeg)检查异常代表可能影响程序执行的预期异常情况\
  \ → 编译器强制编码员通过程序方式处理此类情况。\n\n| *结论*： | 如果 API 客户端代码可以合理地预期从异常中恢复，则将其设置为检查异常 (ChE)。如果客户端无法采取任何操作从异常中恢复，则将其设置为未检查异常。\
  \ |\n\n![](img/00012.jpeg)必须在 `catch` 或 `finally` 块中处理或声明的内容：\n\n![](img/00640.jpeg)\n\
  \n![](img/00012.jpeg)免于编译检查的未检查异常类：\n\n![](img/00641.jpeg)\n\n![](img/00012.jpeg)考试会检查关键字\
  \ `throw` 和 `throws` 的正确用法：\n\n![](img/00059.jpeg)`throws` 用于方法声明，用以指示*可能会*抛出异常；\n\
  \n![](img/00059.jpeg)`throw` 用于程序员想要抛出异常的场景；需要配合 `new`。\n\n![](img/00012.jpeg)异常的优势：\n\
