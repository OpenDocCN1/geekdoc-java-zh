  \ 抛出了运行时错误，因为我们运行了错误的类：本应该是 Jupiter\n\n这个问题并不是在测试你对 `main()` 方法签名的了解：它考查的是你是否知道，无论源文件中包含多少种数据类型，编译器始终会将它们放在单独的\
  \ `.class` 文件中 → 意味着只要类具有可执行的 `main()` 方法，你就可以运行任何类。\n\n所以这里正是发生的情况：`javac.exe`\
  \ 将两个类都编译成独立的文件（`Jupiter.class` 和 `Juno.class`），并将它们存放在源目录下，然后我们漫不经心地将 `Juno` 类传递给\
  \ JVM —— 它就会为我们运行它，因为这两个类都有自己可执行的 `main()` 方法。`Juno` 的 `main()` 调用了 `Jupiter` 的\
