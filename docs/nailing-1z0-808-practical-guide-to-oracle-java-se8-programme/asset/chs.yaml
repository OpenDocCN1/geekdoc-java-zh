  D.运行时抛出异常\n\n许多人喜欢从 `main()` 方法开始阅读代码，然后仅仅遵循程序的业务逻辑。我们考试中的题目并不长（lambda 相关的问题可能除外——你很快就会明白我的意思），所以从顶部开始一直向下看也是可能的。无论哪种，你都应该注意到\
