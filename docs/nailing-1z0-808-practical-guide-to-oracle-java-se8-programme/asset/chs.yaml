  \n### 题目 5.7 – C\n给定代码片段：\n![](img/0404.jpeg)\n\n结果是什么？\n\nA. 编译失败\nB. `2; 4; 6;`\n\
  C. `0; 2; 4; 6;`\nD. `0; 2; 4; 6; 8;`\n\n这是一个没有陷阱的简单循环，所以排除 A。由于输出从第一个值零开始，选项 B\
  \ 也是错误的。\n\n最后，我们应该记住，对于使用小于运算符的终止条件（如 `myVar < ceiling`），`myVar` 的值在循环内永远不会等于 `ceiling`。在我们案例中\
  \ `ceiling` 是 `9 - 1 = 8`，我们永远无法到达，这消除了选项 D。\n\n### 题目 5.8 – B\n给定：\n![](img/0405.jpeg)\n\
