  \ 1.15 – CD\n\n**使用以下命令，哪两个类可以编译并成功运行：**\n\n![](img/00101.jpeg)\n\n除了选项 A 中的类外，所有类都可以编译：它的打印语句想要访问数组中的槽位，而方法签名没有提供数组类型的参数。此外，即使打印语句使用的是引用变量而不是槽位（如选项\
