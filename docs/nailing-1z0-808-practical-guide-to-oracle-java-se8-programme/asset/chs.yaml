  ![](img/00012.jpeg)Java 类的结构和功能定义在源代码文件（`.java` 文件）中。\n\n![](img/00012.jpeg)编译器为每个编译后的类创建一个单一的\
  \ Java 字节码文件（`.class` 文件），即使它是嵌套。至于 `.class` 文件本身，它们并不在 1Z0-808 考试范围内。\n\n![](img/00012.jpeg)一个类可以定义多个组件，例如：\n\
  \n![](img/00063.jpeg)\n\n![](img/00012.jpeg)单个 `.java` 文件可以定义多个类和/或接口。\n\n![](img/00012.jpeg)`public`\
  \ 类只能定义在与其同名的源代码文件中。\n\n![](img/00012.jpeg)源代码文件的结构会直接影响 Java 类的可编译性（你将在这接受测试），因此能够识别类中位置不当的语句至关重要：\n\
  \n![](img/00059.jpeg)Java 类保留在包（packages）中，包将相关的类和接口组合在一起。包还提供了访问保护和命名空间管理。\n\n\
  ![](img/00059.jpeg)`import` 语句用于从其他包导入 `public` 类和接口。\n\n![](img/00059.jpeg)额外说明：如果缺少必要的\
  \ `import` 语句，应该使用类和接口的全限定名（格式为 `pack.[subpack.]type_name`）来引用它们。\n\n![](img/00059.jpeg)可以通过类名或通配符导入类。通配符不会让编译器查找子包（子包被映射为本地文件系统的子文件夹）。\n\
  \n![](img/00059.jpeg)额外说明：在发生冲突时，类名导入的优先级高于通配符。\n\n![](img/00059.jpeg)`package`\
  \ 和 `import` 语句是可选的。如果存在，它们适用于同一个 `.java` 文件中定义的所有类和接口。\n\n![](img/00059.jpeg)字段和方法也是可选的，但与必须置于类声明之前的\
  \ `package` 和 `import` 语句不同，它们可以按任何顺序放在类内部；\n\n![](img/00059.jpeg)如果类定义了 `package`\
  \ 语句，它应该是 `.java` 文件中的第一个语句。如果 `package` 语句出现在类声明内部或之后，则是编译错误；\n\n| **推论**： | 如果类有一个\
  \ `package` 语句，所有的 `import` 都应该紧随其后。 |\n\n![](img/00059.jpeg)一个类可以恰好包含一个 `package`\
  \ 语句；\n\n![](img/00059.jpeg)一个类可以包含多个 `import` 语句；\n\n![](img/00059.jpeg)`import`\
  \ 语句使用类内部类和接口的简单名。\n\n![](img/00059.jpeg)`import` 语句不能应用于多个具有相同简单名的类或接口；\n\n![](img/00059.jpeg)允许存在冗余导入。\n\
  \n![](img/00059.jpeg)额外说明：`import` 语句需要点操作符。\n\n![](img/00012.jpeg)注释是类的另一个组件：它们被用于注释\
  \ Java 代码，可以出现在源代码文件中的任何位置。\n\n![](img/00012.jpeg)额外说明：注释可以包含整个 Unicode 字符集中的任何字符。\n\
  \n![](img/00012.jpeg)注释有三种类型：\n\n![](img/00059.jpeg)单行注释 `//`（又名“行尾注释”），它会让编译器忽略其右侧的所有内容；\n\
  \n![](img/00059.jpeg)多行注释 `/* */`，以及\n\n![](img/00059.jpeg)额外说明：Javadoc 注释 `/**\
  \ */`，这不在考试范围内。\n\n![](img/00012.jpeg)注释可以出现在多个地方：`package` 语句之前或之后，类定义之前、内部或之后，以及方法、构造函数、块、循环等等的体之前、内部或之后。\n\
  \n![](img/00012.jpeg)一个 Java 类可以定义零个或多个成员，如 `static` 字段、实例变量、方法或构造函数，它们的定义可以按类内的任何顺序排列。\n\
