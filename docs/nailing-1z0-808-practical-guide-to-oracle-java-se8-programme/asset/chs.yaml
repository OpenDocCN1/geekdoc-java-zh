  \ JLS 认可——但我发现这种自创方法有助于判断某行代码是否会产生 CCE。\n\n让我们从引入一个所谓的“转换类型”（castype）的新概念开始。我们知道引用类型（reftype）和实际类型（actype）的含义，但转换类型到底是什么？它是用于强制转换”时数据类型，就是我们在要求编译器执行强制转换时写在括号里的类型，例如：\n\
