  \ `if`，因为它没有给逻辑添加任何语义特征。起作用的关键字只有 `continue`：一旦第一个 `if` 看到 \"B\"，当前迭代终止，循环访问下一个元素。\n\
  \n### 问题 5.20 – D\n\n**给定：**\n\n![](img/00421.jpeg)\n\n**为了打印 `12345`，分别用什么语句替换\
  \ LOC1 和 LOC2？**\n\nA. `break, continue`\nB. `break, break`\nC. `continue, break`\n\
  D. `continue, continue`\n\n`break` 会让执行放弃循环 → LOC1 不能有 `break`，因为程序一遇到这个关键字就会终止\
  \ → 选项 A 和 B 是错误的。现在，我们承担的任务是打印除第一个元素之外的所有元素 → 执行不应在任何其他元素处终止，无论是 2、3、4 还是 5 → LOC2\
  \ 也不能 `break`，无论 `if` 表达式是什么。\n\n### 问题 5.21 – A\n\n**给定数组：**\n\n![](img/00422.jpeg)\n\
  \n**哪个选项打印 `orange pomelo pompia citron`？**\n\n\n\n\n![](img/00423.jpeg)\n\n在这里我们需要的是除非元素恰好为六个字母，否则防止执行流到达打印语句——只有选项\
  \ A 满足这一要求。\n\n### 问题 5.22 – B\n\n**假设在同一个包中有以下类：**\n\n![](img/00424.jpeg)\n\n**结果是什么？**\n\
  \nA. 打印一次序列 `0 1 2 3 4`\nB. 打印两次序列 `0 1 2 3 4`\nC. 打印一次序列 `0 1 2 3 4 5`\nD. 打印两次序列\
  \ `0 1 2 3 4 5`\n\n`for` 循环迭代了五次而不是六次，因此排除 C 和 D 选项。\n\n现在，由于实例变量 `i` 自动初始化为零，`while`\
  \ 循环执行了两次 → 选项 B 是正确的。\n\n最后说明一点，循环变量遮蔽了实例变量 `i`，所以没有冲突。\n\n### 问题 5.23 – C\n\n\
  **假设：**\n\n![](img/00425.jpeg)\n\n**输出是什么？**\n\nA. `Jav8av8v8av88`\nB. `Jav8Jav8Jav8Jav8Jav8`\n\
  C. `Java8`\nD. 编译失败\n\n`continue` 仅在循环内部有效，而这里的 `switch` 块被 `for` 循环包裹，正好符合，因此代码可以编译。\n\
  \n此外，由于 `continue` 与 `switch` 完全无关且仅影响循环，每当执行到它时，循环会立即放弃当前迭代，从而防止执行流穿过 `switch`\
  \ 体 → 选项 A 和 B 是错误的。\n\n### 问题 5.24 – A\n\n**假设：**\n\n![](img/00426.jpeg)\n\n**结果是什么？**\n\
  \nA.\n3\n23\n123\nB.\n30\n230\n1230\nC.\n23\n123\nD.\n230\n1230\n\n数字打印语句由 `while`\
  \ 循环控制 → 在最开始，变量 `column` 的值为三 → 排除 C 和 D → `while` 在 `for` 循环的第一次迭代中只执行了一次 → 第一行打印的内容必须包含单个数字。\n\
