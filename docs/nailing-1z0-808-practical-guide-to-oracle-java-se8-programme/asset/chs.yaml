  \ Hell true false\n\n当你在考试中看到 `String` 对象时，脑海中浮出的第一个应该是：“啊！这个动物是不可变的，所以我最好小心一点……”自然地，还有一些需要注意的奇葩方法，但基本上，就是这样了。\n\
  \n现在请列出我们考试中提到的不可变类；我们在讨论 Problem 4.3 的解决方案时提到过它们……你都找全了吗^(149)？很好。\n\n回到 `String`。由于\
  \ `str` 是不可变的，第 `h1` 行没有改变原始对象；相反创建了一个新对象——因为该引用没有被任何方式使用，所以被浪费了，因此第 `h2` 行打印的是原来的‘Hello’。当然，末尾有一个空格。另一方面，第\
  \ `h3` 行输出‘Hell ’，因为打印语句作用于 `replace()` 返回的对象。\n\n至于第 `h4` 行，`StringBuilder` 没有重写\
  \ `Object` 的 `equals()` → 因此该方法简单地比较了两个相同的引用并返回了 `true`。我们应该始终记住，方法是通过*引用*作用于对象的，这就是为什么当第二个\
  \ `append()` 完成它的工作时，两个操作数将包含相同的字符序列，即‘Hello?!’。让我们对这个原理做一个简单的说明，这次使用一个重写了 `equals()`\
  \ 的类：\n\n![](img/00777.jpeg)\n\n![](img/00778.jpeg)\n\n在上面的示例中，对象始终是同一个，通过引用对其进行的任何更改都会反映在\
  \ `equals()` 的双方。\n\n下一步（顺便说一下，我们正在回到当前的 Problem 9.1）；当我们遇到镜像情况时会发生什么：`String` 类与\
  \ `StringBuilder` 不同，它不仅不可变，而且重写了 `equals()`？第 `h5` 行通过打印 `true` 回答了这个问题。\n\n###\
  \ Problem 9.2 – D\n给定：\n\n![](img/00780.jpeg)\n\n结果是什么？\n\nA. 相同的宠物，相同的名字\n\nB.\
  \ 不同的宠物，相同的名字\n\nC. 相同的宠物，不同的名字\n\nD. 不同的宠物，不同的名字\n\nE. 编译失败\n\n由于 `StringBuilder`\
  \ 没有重写 `equals()`，`checkNames()` 是：\n\n### Problem 9.3 – A\n给定：\n\n![](img/00781.jpeg)\n\
  \n结果是什么？\n\nA. 1234Leoo\n\nB. 编译失败\n\nC. 代码抛出运行时异常\n\n### Problem 9.4 – C\n给定以下类：\n\
  \n![](img/00782.jpeg)\n\n结果为：\n\nA. _12345（_ 表示空格）\n\nB. 12345\n\nC. null 12345\n\
  \nD. 编译失败\n\nE. 抛出空指针异常\n\n\n\n\n\n### 步骤 3. \n`JLS`, `§5.1.11`, `String Conversion`:\
  \ “如果引用为 `null`，它被转换为字符串 'null'（四个 ASCII 字符 n, u, l, l）”。\n\n→ 所以既没有编译错误（comperr）也没有运行时错误（RTE）\
  \ → 这就是为什么第一次迭代的结果是‘null1’ —— 之后都是平凡的。\n\n### 题 9.5 – BE\n\n希望能在当地银行找一份初级程序员的工作，你参加了\
  \ Java 面试，被要求完成以下类，该类掩盖 20 位的账号，使得使用户只能看到最后五位，而前 15 位中的每一位都被替换为星号：\n\n![](img/00783.jpeg)\n\
  \n具体来说，你的任务是完成 `maskAccount(String accNum)` 方法，使得 `AccountMasker` 类在运行以下命令时输出 `**************67541`：\n\
  \n![](img/00784.jpeg)\n\n**哪两行代码（LOC）在独立使用时能实现这一要求？**\n\nA. `return (new StringBuilder(accNum)).substring(15,\
  \ 19).toString();`\n\nB. `return lead + accNum.substring(15, 19);`\n\nC. `return\
  \ new StringBuilder(accNum).append(lead, 15, 19).toString();`\n\nD. `return new\
  \ StringBuilder(accNum).insert(0, lead).toString();`\n\nE. `return new StringBuilder(lead).append(accNum,\
  \ 15, 19).toString();`\n\n像往常，我们从观察可用选项开始分析：如果其中某些选项可以立即排除呢？这种情况在考试中经常发生，这次也不例外。\n\
  \n输出必须包含星号（伪装为变量 `lead`）→ 选项 A 甚至没有提到该变量 → A 立即排除。\n\nB 选项呢？`substring()` 在 `String`\
  \ 和 `StringBuilder` 中的工作方式相同：它返回一个 `String`，并且针对 `(int start)` 和 `(int start, int\
  \ end)` 进行了载 → 我们有第二个版本，它返回索引 15（包含）到索引 20（不包含）之间的任何内容 → 该方法接收了什么？ → 它接收了 `replace(\"\
  \ \", \"\")` 返回的对象 → 也就是一个现在没有空格的 20 位序列，因为 `String` 的 `replace()` 作用于目标 `char`\
  \ 或 `CharSequence` 的每次出现处 → substring 包含 67541 → 在其前面加上 `lead` → 搞定。\n\n现在看选项 C。`maskAccount()`\
  \ 的参数由局部变量 `accNum` 表示，包含 20 个数字且没有空格 → 创建了一个新的 `StringBuilder` 对象 → 它包含 `accNum`\
  \ → 然后 `append()` 尝试向其添加五个从 `lead` 提取的字符 → 但在这样做过程中它走得太远了，超过了最后一个可用值，因为 `lead` 只包含\
  \ 15 个字符 → 发生越界异常（IOOBE）。\n\n选项 D：`insert()` 将 `lead` 置于 `StringBuilder` 对象的第一个位置，从而将对象原本包含的所有内容向右移动，即一个\
  \ 20 位的字符串 → 结果太长了。\n\n既然剩下的只剩选项 E，我们甚至不分析其逻辑就接受它 → 但复习阶段（Review stage）我们必须进行分析\
  \ → `append()` 为 `lead` 添加了从 `accNum` 尾部提取的五位字符串 → 然后将整个结果转换为 `String` 并返回 → 嗯，看起来没问题。\n\
  \n### 题 9.6 – D\n\n**哪条语句初始化了一个容量为 256 的 StringBuilder？**\n\nA. `StringBuilder sb\
  \ = new StringBuilder(new String(256));`\n\nB. `StringBuilder sb = StringBuilder.setCapacity(256);`\n\
  \nC. `StringBuilder sb = StringBuilder.setLength(256);`\n\nD. `StringBuilder sb\
  \ = new StringBuilder(256);`\n\n既然题目的答案显而易见，我们可以花一分钟看看大局。\n\n在我们考试中，只有两个类与这种被称为“容量”（capacity）的特殊构造直接或间接的关系，即\
  \ `StringBuilder` 和 `ArrayList`：\n\n![](img/00785.jpeg)\n\n尽管听起来是这样，但容量并不是我们可以放入\
  \ `StringBuilder` 或 `ArrayList` 中内容的上限限制；它是一个定义边界的值，超过该边界，内部数组必须重新分配空间以容纳所需的元素（对于\
  \ `ArrayList`）或 `CharSequence` 的长度（对于 `StringBuilder`）。而 `StringBuilder` 允许获取和设置其容量，`ArrayList`\
  \ 则不提供直接读取访问。\n\n回到我们的问题；选项 A 无法编译，因为 `String` 没有定义一个接受 `int` 作为唯一参数的构造函数；现在请列出考试中可能出现的\
  \ `String` 构造函数。\n\n至于选项 B 和 C，它们完全是错误的。首先，`StringBuilder` 没有静态方法，因此类名不能在任何调用中使用。其次，`setCapacity()`\
  \ 在 `StringBuilder` 中甚至不存在；最后，任何一种方法都必须返回一个 `StringBuilder` 对象，而可变类中的 setter（setters）通常是\
  \ `void` 类型——就像 `setLength()` 一样……\n\n### 题 9.7 – AD\n\n**给定代码片段：**\n\n![](img/00786.jpeg)\n\
  \n**哪两个选项将输出以下：**\n\n`System.out.println(\"I’ll \" + exam);`\n\nA. `System.out.println(\"\
  I’ll \" + exam);`\n\nB. `System.out.println(\"I’ll \" + exam);`\n\nC. `System.out.println(\"\
  I’ll \" + exam);`\n\nD. `System.out.println(\"I’ll \" + exam);`\n\n在所有的 `insert`\
  \ 方法中，`StringBuilder` 定义的确实是我们的情况。选项 B 和 C 立即被排除。\n\n### 题 9.8 – C\n\n**给定：**\n\n\
