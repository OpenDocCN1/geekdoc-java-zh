    # 12.3 WORKING WITH FRAME WINDOW


    # How to Create Frame Window


    Creating a new frame from within an applet is actually quite easy. First, create
    a subclass of Frame. Next, override any of the standard applet methods, such as
    init(), start(), and stop(), to show or hide the frame you will create. Finally,
    implement the windowClosing() method of the WindowListener interface, calling
    setVisible(false) when the window is closed. After the applet, the type of window
    you will often create is derived from Frame.


    # Frame''s Constructors are as Follow


    ```

    Frame()

    Frame(String title)

    ```


    The first form creates a standard window that does not contain a title.The second
    form creates a window with the title specified by title.We cannot specify the
    dimensions of the window. We must set the size of the window after it has been
    created. Some of the methods used when working with windows are follows


    Setting the windows:


    The getSize() method is used to set the Dimensions of the window.


    Its signature is shown here:


    ```

    void getSize(int newWidth,int newHeight)

    void getSize(Dimension newSize)

    ```


    ![](img/b566e38d12eb7459b68e241fa3902a8a_247_0.png)


    *

    the new size of the window is specified by newWidth and newHeight .Dimensions
    are specified in terms of pixels.


    getSize() method is used to obtain the current size of the window.


    Its signature is shown here:


    ```

    Dimension getSize()

    ```


    This method returns current size of the window contained within the width and
    height field of the Dimension Object.


    # Hiding and Showing a Window


    The getSize() method is used to obtain the current size of a window


    Its signature is shown here:


    ```

    Dimension getSize()

    ```


    After a frame window has been created, it will not be visible until you call setVisible().


    Its signature is shown here:


    ```

    void setVisible(boolean visibleFlag)

    ```


    Component is visible if argument to this method is true. otherwise, it is hidden.'
