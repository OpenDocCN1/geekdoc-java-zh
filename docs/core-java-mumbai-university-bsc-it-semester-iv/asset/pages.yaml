  md: "# 4.5 INSTANTIATING OBJECTS FROM A CLASS (CREATING OBJECTS)\n\n+   * An object\
    \ is an instance of the class or a variables of a user define data type class.\
    \ An object is the block of the memory that contain space to store all the instance\
    \ variables creating an objects is also referred as instantiating an object.\n\
    \n+   * Object are created by using new operator (memory allocation operator).The\
    \ new operator creates an objects of the specified class and returns a reference\
    \ to the objects created.\n\n+   * Steps for creating objects are:\n1. Declare\
    \ the objects or variables of type class to hold the objects .This variable does\
    \ not define an objects. Instead it simply a variable that can refer to an object.\n\
    \   **For example:**\n   Rectangle\n   Rec=new Rectangle();\n2. Instantiate the\
    \ object or declare variables of types class to the variables by using new operator.\
    \ Or acquire an actual, physical copy of the objects and assign it to a variable\
    \ by new() operator. The new operator dynamically allocates memory for objects.\
    \ And returns a reference to it. This reference is more, or less, the address\
    \ of the objects allocated by new operator .This the variables, In Java, all class\
    \ objects must be dynamically allocated. This provides safety because you cannot\
    \ manipulate reference as pointer. Thus objects reference cannot be manipulated\
    \ and cannot point to an arbitrary memory location.\n   **For example:**\n   Rec=new\
    \ Rectangle();\n\nThe variable Rec is now an objects of the class rectangle, as\
    \ show in following figure:\nRectangle Rec = new Rectangle();\nThe method Rectangle()\
    \ is a default constructor of the class\nAssigning Objects Reference Variable:\n\
    \n+   1. One objects reference can be assigned to another reference variable,\
    \ then the copy of objects is not created by copy of the reference is made.\n\
    2. Any number of objects can be created. Each object has its own copy of instance\
    \ variable of its class. Any that to change the variable of one objects has no\
    \ effects on another variable. It is also possible to create reference to the\
    \ same objects, as show above in figure.\n\n```\nRectangle R1 = new Rectangles();\n\
    Rectangle R2 = R1;\n```\n\n![](img/b566e38d12eb7459b68e241fa3902a8a_104_0.png)"
