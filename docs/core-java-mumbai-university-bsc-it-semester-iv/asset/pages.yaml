    # 1.22 JAVA STATEMENTS


    # Control Structures of Java


    Controlling the flow of a program is a very important aspect of programming. There
    may be many ways to find the solution to a particular problem, but you will want
    to look for the best and fastest way.


    The control statements contain one logical statement, which is usually a block
    of statements enclosed in curly braces {}.


    **True/false values** are used in the `if` and loop statements. These are either
    the Boolean values **true** and **false**, or any non-zero value for true and
    zero for false (as in C).


    Java has four types of control structures: sequential, selection (decision), repetition
    (loops), and subprograms (functions). These structures simply control the execution
    of a program.


    # 1.22.1 Types of Control Structures


    Java has four types of control structures:


    +   1. Sequential

    2. Selection (decision)

    3. Repetition (loops)

    4. Subprograms (functions).


    **1. Sequential**: Sequential statements move the program flow from one statement
    to the next, that statement moves to next, and so on. It is the simplest form
    of structure, and it is not likely to use sequential structuring when developing
    complex programs.


    **2. Selection (decision)**: Selection structures make decisions and perform commands
    according to the decision making. Selection structures includes “if statements”
    which are statements like “if this, then do that” and “if not this, then do that”.
    With “if statements”, we can also include “nested if statements”, which are “if
    statements” inside other “if statements”. Another form of selection structures
    is called a “switch statement”, which is very powerful for certain situations
    but not others. “Switch statements” focus on the value of a particular variable
    and perform different “cases” accordingly.'
