  md: '# Event Handling


    **SimpleButtonEvent** applet registers itself as the listener for the button''s
    action events that creates a Button instance.

    **ActionListener** method can be implemented by any Class including Applet. One
    point to remember here is that all listeners are always notified. Moreover, you
    can also call `AWTEvent.consume()` method whenever action is performed, where
    removeActionListener() method you don''t want an action to be processed. There
    is another method which is used by a listener to check for the consumption. The
    method is `isConsumed()` method. The processing of the events stops with the consumption
    of the events by the system once a listener is notified. Consumption only for
    `InputEvent` and its subclasses. Moreover, if you don''t want any input from your
    keyboard then you can use `consume()` method for the `KeyEvent`.

    The step by procedure of Event Handling is:


    +   1. When anything happens then the subclasses of **AWTEvent** are generated
    by the **component**.

    2. Any class can act like a Listener class promised by the Events. For example,
    `addActionListener()` method is used for any action where **Action** is the event
    type. There is another method by which you can remove the listener which is `removeXXX()`
    method, where XXX is the event type. **Actionlistener**.

    3. A listener has type of special type of listener types for which you need to
    implement multiple methods like **key** Events. There are three methods which
    are required to be implemented for Key and register them i.e., **one for release**,
    **one for key typed** and **one for key press**. There are some special classes
    which are well known as **adapters** that are used to implement the `listener
    interfaces` and stub out all the methods. These adapter classes can be sub classed
    and can **override the necessary method**.


    # 11.3 AWTEVENT


    Most of the times every event-type has **Listener interface** as **Events** subclass
    the **AWTEvent class**. However, **PaintEvent** and **InputElement** don''t have
    the Listener interface because only the `paint()` method can be overridden with
    **PaintEvent** event.


    # Low-level Events


    A **low-level input** or window operation is performed by the Low-level events.
    Types of **Low-level events are mouse movement, window opening, a key press**.
    For example, three events are generated by typing the letter ''A'' on the Keyboard
    for releasing, for pressing, and one for typing. The type of **low-level events**
    and **operations that generate each event** are shown below in a table.


