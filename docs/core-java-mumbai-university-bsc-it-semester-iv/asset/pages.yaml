    # 1.14 JAVA PLATFORM


    # The Java Programming Language Platforms


    +   There are four platforms of the Java programming language:

    1. Java Platform, Standard Edition (Java SE)

    2. Java Platform, Enterprise Edition (Java EE)

    3. Java Platform, Micro Edition (Java ME)

    4. Java FX


    All platforms consist of a Java Virtual Machine (VM) and an Application Programming
    Interface (API). The Java Virtual Machine is a program, for a particular hardware
    and software platform, that runs Java technologies. An API is a collection of
    software components that you can use to create other software components or applications.
    Each Java platform provides a virtual machine and an API, and this allows applications
    for that platform to run on any compatible system with all the advantages of the
    Java programming language: platform-independence, power, stability, ease-of-development,
    and security.


    # Java SE


    When most people think of Java programming, they think of the Java SE API''s API
    provides the core functionality of the Java programming language. It defines everything
    from the basic types and objects of the Java programming language to high-level
    classes that are used for networking, security, database access, Graphical User
    Interface (GUI) development, and XML parsing.


    In addition to the core API, the Java SE platform consists of a virtual machine,
    development tools, deployment technologies, and other class libraries and toolkits
    commonly used in Java technology applications.


    # Java EE


    The Java EE platform is built on top of the Java SE platform. The Java EE platform
    provides an API and runtime environment for developing and running large-scale,
    multi-tiered, scalable, reliable, and secure network applications.


    # Java ME


    The Java ME platform provides an API and a small-foot virtual machine for running
    Java programming applications on small devices, like mobile phones. The API is
    a subset of the Java SE API along with special class libraries for small device
    development. Java applications are often clients of Java EE services.


    # Java FX


    Java FX technology is a platform for creating rich internet applications written
    in Java ScriptTM. Java FX Script is a statically-declarative language that is
    compiled to Java technology bytecode, which can be run on a Java VM. Applications
    written for the Java FX platform can include and link to Java programming classes,
    and may be clients of Java EE platform services.'
