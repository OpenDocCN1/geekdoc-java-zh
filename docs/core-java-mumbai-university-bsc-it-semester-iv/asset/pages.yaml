  md: '# 9.3 TRY-CATCH-FINALLY


    An exception is an error or an unexpected event. The exception handler is a set
    of codes that catches executes when an exception occurs.


    Exception handling uses basically 3 blocks:


    +   (i) Try

    (ii) Throw

    (iii) Catch


    The try & catch blocks are written between open & closing curly braces ''{ }''.
    The try block is identified by keyword having block of statement between {and}.
    When the exception is detected by the try block, it is thrown using statement
    in try block.


    A catch block is defined by the keyword catch { } with block of statement. This
    catch block catches the exception thrown by statement in try block and enters
    it appropriately. When the try block throws an exception the program control leaves
    the try block and enters the catch block if the type of object thrown by the try
    block matches then only the catch block is executed for handling exception. If
    they do not match, the program is aborted using function


    # Try


    The try has a block of code that has its exceptions or needs specific code following
    try block to handle exception (Catch). The purpose is to catch exception when
    try block of code terminates for anyreason.The termination of try block could
    be due to exception or break or continue or return statements.


    # Catch


    A catch can be followed by zero or more catch clauses. Each catch clause contains
    specific code to handle various types of exceptions. Each catch clause is passed
    a single argument that specifies the type of the exception. The argument to a
    catch clause must be of Throwable class or any of its subclass.


    When an exception is thrown, the JVM looks for a catch clause with same argument
    as type of exception object. The JVM looks the first catch clause it finds. The
    code within a catch block should take necessary action to handle the exception.
    For example if the exception is java.io.FileNotFoundException user may be asked
    to check spelling for file name and again.


    # Finally


    The finally clause is used to clean up after the code in the try-catch block.
    There are various possibilities that can happen in a try block:


    +   1. If an exception occurs in the try block and there is an associated catch
    block to handle the exception, control transfers to catch block. Then it is transferred
    to finally block.

    2. In normal case (without any exception), control reaches the end of the try
    block and then to finally block. The finally block performs clean up, like closing
    any open file, myfile.close().

    3. If control leaves try block because of return, break or continue statement,
    the finally block is executed before control transfers to its destination.'
