    teachers and students of Bachelor of Information Technology, Second Year, Fourth
    Semester. This book has been written as the syllabus prescribed by the University
    with effect from academic year 2017-18.


    When Java appeared in 1995, immediately its potential as a language for beginning
    programmers noticed. satisfied today''s need for early entry in an object-oriented
    language, avoiding the complexities of C++. At the same time, Java is similar
    to C++ to serve as a stepping stone to that. At my institution, Java is the first
    language introduced, immediately followed by C++ . With no pointers to cause problems,
    Java programs are immune to those frustrating crashes that are so common in C++,
