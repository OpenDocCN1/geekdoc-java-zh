  md: '# Two-way Decisions


    Two-way decisions are handled with “if/else statements” and either do one particular
    thing or another. Similar to one-way decisions, the decision is based on a logical
    expression. If the expression is true, stmtT will be executed; if the expression
    is false, stmtF will be executed. The form of a two-way decision is as follows:


    ```

    if ( logical expression )

    stmtT;

    else

    stmtF;

    stmtT and stmtF can be simple or compound statements. Remember that compound statements
    are always enclosed with curly braces { } .

    ```


    # Multi-way Decisions


    Multi-way decisions involve using “if / else if” statements, "nested", or "switch"
    statements. They are all used to evaluate a logical expression that could have
    several possible values. “if / else if” statements are used to choose between
    ranges of values.


    The form of a multi-way decision using “if / else if” statements is as follows:


    ```

    if ( logical expression )

    stmtT1;

    elelse if ( logical expression )

    stmtT2;

    elelse if ( logial expression )

    stmtT3;

    .

    .

    else if ( logical expression )

    stTN;

    else

    stmtF;

    ```


    If the first logical expression is evaluated to true, then stmtT1 is executed.
    If the second logical expression is true, then stmtT2 is executed and so on down
    the line. If none of the logical expressions are true, then the statement after
    "else" is executed which is stmtF.


    The form of a multi-way decision using "nested ifs" is as follows:


    ```

    if ( conditionA )

    {

    if ( conditionB )

    stmtBT;

    else

    ```'
