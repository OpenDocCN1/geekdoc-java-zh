  md: '# Core Java


    Public members can be accessed by the outsider function of class.

    Some of the characteristics of object oriented programming:


    +   1. Object oriented approach provides modularizing by diving program into functions.

    2. Programs are divided into objects.

    3. Functions that operate on the data of an object are tied together in the data
    structure.

    4. Data is hidden and cannot be accessed by external functions.

    5. Objects may communicate with each other through functions.

    6. Data and functions can be combined in one encapsulated unit class.

    7. New data and functions can easily be added whenever necessary.


    Basic concepts of object-oriented programming:

    Some important concepts are needed to understand in OOP:


    +   1. Objects.

    2. Classes.

    3. Data Abstraction.

    4. Data Encapsulation.

    5. Inheritance.

    6. Polymorphism.

    7. Dynamic binding.

    8. Message passing.


    # 1. Objects:


    +   (a) Objects are the basic Run-time entities also called as Real World thing.

    (b) An object in C++ is a representation of some physical, logical or conceptual
    entity. For example, an object can be a vehicle, bank account, place, a table
    of data, any item, or it represents a person etc.


    +   (c) Every object is identified by its own properties and methods which indicates
    behaviour and states of object.

    (d) The object can take place in memory and associated in a memory like a structure
    in C or Record in Pascal.


    +   (e) An object is an instance of user-defined data type class. We can also
    say that object is a variable whose type is a user defined class.

    (f) When a program is executed, the objects interact by sending messages to one
    another.


    For example 1, if customer and account are two objects, customer object may send
    a message to the account object requesting for the bank balance.


    For example 2, if student and marks are two objects, student object may send a
    message to the marks object requesting for grade of student.'
