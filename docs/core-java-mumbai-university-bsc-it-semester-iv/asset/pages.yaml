  md: "# 4.3 SCOPE RULES\n\nBlocks can be nested, and certain scope rules apply to\
    \ local declarations in such blocks. A local declaration can appear anywhere in\
    \ a block. The general rule is that a variable declared in a block is in scope\
    \ inside the block where it is declared, but is not accessible outside of this\
    \ block.\n\n```\npublic static void main(String[] args) { // Block 1\n    String\
    \ args2 = \"\"; // (1) Cannot redeclare parameters.\n    char digit = 'z';\n\n\
    \    for (int index = 0; index < 10; ++index) { // Block 2\n        switch(digit)\
    \ {\n            case 'a': // Block 3\n                int i; // (2)\n       \
    \         int i; // (3) Already declared in the same block.\n            default:\n\
    \        } // switch\n        if (true) { // Block 4\n            int i; // (4)\
    \ OK\n            int digit; // (5) Already declared in enclosing block 1.\n \
    \           int index; // (6) Already declared in enclosing block 2.\n       \
    \ }\n        if\n    } // for\n    int index; // (7) OK\n} // main\n```\n\n# 4.4\
    \ ACCESS MODIFIER\n\nEach object has members (members and methods) which can be\
    \ declared to have specific access. Java has 4 access level and 3 access modifiers.\
    \ Access levels are listed below in the most restrictive order:\n\n+   1. **Public**:\
    \ Members (variables, methods, and constructors) declared public (least restrictive)\
    \ within a public class are visible to any class in the Java program, whether\
    \ these classes are in the same package or in another package.\n\n+   2. **Protected**:\
    \ The protected fields and methods, cannot be used for Classes and Interfaces.\
    \ Methods and constructors declared in a super-class can be accessed only by subclasses\
    \ in other packages. Classes in the same package can also access protected fields,\
    \ methods and constructors as well, even if they are not a subclass of the protected\
    \ member's class.\n\n+   3. **Default (no value)**: The default access level is\
    \ declared by not writing any access modifier at all. Any class with no declared\
    \ access modifier is accessible only by classes in the same package.\n\n+   4.\
    \ **Private**: The private (most restrictive) modifiers can be used for members\
    \ but cannot be used for classes and Interfaces. Fields, methods or constructors\
    \ declared private are strictly controlled, which means they cannot be accessed\
    \ by anywhere outside the enclosing class."
