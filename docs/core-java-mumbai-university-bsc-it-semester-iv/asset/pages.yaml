    # 11.7 ADAPTER CLASSES\n\nAn adapter class provides the default implementation\
    \ of all methods in an event listener. Adapter classes are very useful when you\
    \ process only few of the events that are handled by a particular event listener\
    \ interface. You can define a new class by extending one of the adapter classes\
    \ and implement only those which is relevant.\n\nThere are some listeners that\
    \ have multiple methods to implement. That is some of the listener interfaces\
    \ contain more than one method. For instance, the MouseListenercontains five methods\
    \ as mouseClicked, mousePressed, mouseReleased. If you want to use only one method\
    \ out of these then you will have to implement all of them. Thus, the methods\
    \ which you do not want to care about can have empty bodies. To avoid such thing,\
    \ we have adapter class.\n\nAdapter class helps us in avoiding the implementation\
    \ of the empty method bodies. Generally an adapter class is there for each listener\
    \ interface having more than one. For instance, the MouseAdapter implements the\
    \ MouseListener interface. An adapter class can be used by creating a subclass\
    \ of it and then overriding the methods which are of only use. Hence avoiding\
    \ the implementation of all the methods of the listener interface. The following\
    \ example shows the\n\nExample MouseAdapter\n\n```\nimport java.awt.*;\nimport\
    \ java.awt.event.*;\npublic class MouseAdapterExample extends MouseAdapter{\n\
    \    Frame f;\n    MouseAdapterExample(){\n        f=new Frame(\"Mouse Adapter\"\
    );\n        f.addMouseListener(this);\n        f.setSize(300,300);\n        f.setLayout(null);\n\
    \        f.setVisible(true);\n    }\n}\n```"
