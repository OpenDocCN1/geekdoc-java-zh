    #  1.34 AUTO BOXING AND UNBOXING


    Java 1.5 introduced a special feature of auto conversion of primitive types to
    the corresponding Wrapper class and vice versa.


    **Autoboxing:** Automatic conversion of primitive types to the object of their
    corresponding Wrapper class is known as autoboxing. For example – conversion of
    int to Integer, long to Long, double to Double.


    **Unboxing:** It is the reverse process of autoboxing. Automatically converting
    an object of a wrapper class to its corresponding primitive type is known as unboxing.
    For example – conversion of Integer to int, Long to long, Double to double.


    | Primitive type | Wrapper class |

    | boolean | Boolean |

    | byte | Byte |

    | char | Character |

    | float | Float |

    | int | Integer |

    | long | Long |

    | short | Short |

    | double | Double |'
