  md: '# Types of Control Structures


    Java has four types of control structures:


    +   1. Sequential

    2. Selection (decision)

    3. Repetition (loops)

    4. Subprograms (functions).


    **1. Sequential:** Sequential means the program flow moves from one statement
    to the next, that statement moves to the next, and so on. It is the simplest form
    of structures, and it is not likely to use sequential when developing complex
    programs.


    **2. Selection (decision):** Selection makes decisions and perform commands according
    to the decision making. Selection includes "if statements" which are statements
    like "if this, then do that" and "if not then, do that". With "if statements",
    we can also include "nested if statements", which is called "if statement" inside
    other "if statements". Another form of selection is called "switch statement",
    which is very powerful for certain situations but not others. "Switch statement"
    focuses on the value of a particular and can perform different cases "cases" accordingly.


    **3. Repetition (Loops):** Repetition structures are used when something needs
    to be repeated a number of times through the use of "loops". A loop is a statement
    that completes iterations or cycles until a certain value is reached and then
    execution moves to the next executable statement. For instance, if you were asked
    to enter ten values to find the average of the numbers, you could write a loop
    that would letting the user to enter values until ten numbers had been entered.


    **4. Subprograms (functions):** A function is a statement that performs a specific
    task and may return a value to the statement that called or invoked it. Functions
    programming can be very powerful once you develop a function to handle a particular
    situation, you can use that function for other programs. A function can also call
    function, which may call another function, and so on. It is a great way to organize
    your program and break your program down into logical steps.


