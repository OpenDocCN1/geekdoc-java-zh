    # Event Listeners


    A listener is an object that is notified when an event occurs. It has two major
    requirements. First, it must have registered with one or more sources to receive
    notifications about specific types of events. Second, it must implement methods
    to receive and process these notifications. The methods that receive and process
    events are defined in a set of interfaces in java.awt.event.


    For example, the MouseListener interface defines two methods to receive notifications
    when the mouse is dragged or moved. Any object may receive and process one or
    both of the events if it provides an implementation of this interface.


