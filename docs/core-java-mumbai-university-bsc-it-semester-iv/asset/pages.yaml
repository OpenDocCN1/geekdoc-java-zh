  md: '# Byte Streams


    When java program want to take i/p data from file, network or keyboard, first
    it has to form a logical connection so the data can flow through that.


    A stream is abstraction which devices and/or read information.


    Stream is logical path for flow of sequence byte from sources to destination.


    There are two kinds of stream:


    +   (a) Input stream.


    +   (b) Output stream.


    Similarly when java program need to write some data into a file, it creates/form
    output stream for destination and then write data into file.


    Note: In java programming for reading from i/p devices/resources, form a input
    stream and mention the sources for i/p data.


    Similarly for outputting the data from output stream in java program, mentioning
    the destination for o/p data sequence.


    # Stream Classes


    Java defines stream in form of classes which define in java.io packages.


    There are two types of stream. Library or character


    The classification is


    # Stream Classes


    # 1. Byte Stream


    Byte stream is defined by using two abstract class at the top of hierarchy, they
    are InputStream and OutputStream:


    +   (i) Input stream.


    +   (ii) Output stream.


    ![](img/b566e38d12eb7459b68e241fa3902a8a_208_0.png)


    These classes define several key methods. Two most important are


    +   1. read(): reads byte of data.


    +   2. write(): Writes byte of data.


    # 2. Character Stream


    Character stream is also defined by using two abstract class at the top of hierarchy,
    they are Reader and Writer:


    +   (i) Reader


    +   (ii) Writer'
