    \ terminates the execution of a function and returns control to the calling function.\
    \ Execution resumes the calling function at the point immediately following the\
    \ call. A return statement can also return a value to the calling function.\n\n\
    The return statement in Java is used to explicitly return from a method. ... A\
    \ method can return a value or reference type or not return a value. If a method\
    \ does not return a value, the method must be declared void and it doesn't need\
    \ to contain a return statement.\n\nIn a case, a return statement can be used\
    \ to branch out of a control flow block and exit the method and is simply used\
    \ like this: return; If you try to return a value from a method that is declared\
    \ void, you will get a compiler error.\n\n# Returning a Value from a Method\n\n\
    A method returns the value that is invoked when it\n\n+   * Completes all the\
    \ statements in the method,\n* Reaches a return statement, or\n* Throws an exception\
    \ (covered later),\n\nwhichever occurs first.\n\nYou declare a return type in\
    \ your method declaration. Within the body of the method, you use the return statement\
    \ to return the value.\n\nAny method declared void doesn't return a value. It\
    \ does not need to contain a return statement, but it may do so. In such a case,\
    \ a return statement can be branch out of a control flow block and exit the method\
    \ and is simply used like this:\n\n```\nreturn;\n```\n\nIf you try to return a\
    \ value from a method that is declared void, you will get a compiler error.\n\n\
    Any method that is not declared void must contain a return statement with a corresponding\
    \ return value, like this:\n\n```\nreturn returnValue;\n```"
