  md: '# 12.2 JAVA AWT HIERARCHY


    ![](img/b566e38d12eb7459b68e241fa3902a8a_246_0.png)


    # Component


    At the top of the AWT class is the Component class. Component is an abstract class
    that encapsulates all the attributes of a visual component. All user interface
    elements that are displayed on the screen and interact with the user are subclasses
    of Component. It defines over a hundred public methods that are responsible for
    managing events, such as mouse and keyboard input, positioning and sizing the
    window, and repainting. A Component object is responsible for remembering the
    current foreground and background colors and the selected text font.


    # Container


    The Container class is a subclass of Component. It has additional methods that
    allow other Component objects to be nested within it. Other Container objects
    can be stored inside of a Container (since they are themselves instances of Component).
    This makes for a multilevel containment system. A container is responsible for
    laying out (that is, positioning) any components that it contains.


    # Window


    The Window class creates atop-level window.A top-level window is not contained
    within any other object.it sits directly on the desktop. We use subclass of window
    called Frame.


    # Panel


    The Panel is a concrete subclass of Container. It doesn''t add any new methods;
    it simply implements Container. Panel is the superclass for Applet. When screen
    output is directed to an applet, it is drawn on the surface of a Panel object.
    A Panel is a window that does not contain a title bar, menu, or border. When you
    run an applet using an applet viewer, the applet viewer provides the title and
    border. Other components can be added to a Panel object by its add() method inherited
    from Container. Once these components have been added, you can position and resize
    them manually using setLocation(), getSize(), or setBounds() methods defined by
    Component.


    # Frame


    The Frame is the class that contain title bar and can have menu bars. It can have
    other components like button, textField etc.'
