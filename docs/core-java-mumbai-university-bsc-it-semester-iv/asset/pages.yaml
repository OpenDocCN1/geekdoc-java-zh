  md: '# Core Java


    If you construct a scroll bar by using one of the first two constructors, you
    then need to set its parameters by using setValues( ), shown here, before it can
    be used:


    ```

    void setValues(int initialValue, int thumbSize, int min, int max)

    ```


    The parameters have the same meaning as they have in the third constructor just
    described.


    To obtain the value of the scroll bar, call getValue( ). It returns the current
    setting. To set the current value, call setValue().


    These methods are as follows:


    +   1. getValue()

    2. setValue(newValue)


    Here, newValue specifies the new value for the scroll bar. When you set a value,
    the slider box inside the scroll bar will be positioned to reflect the new value.
    You can also retrieve the minimum and maximum values via getMinimum() and getMaximum(),
    as shown here:


    +   1. getMinimum()

    2. getMaximum()


    They return the requested quantity.


    By default, the increment is added to or subtracted from the scroll bar each time
    it is scrolled up or down line. You can change this increment by calling setUnitIncrement().
    By default, page-up and page-down increments are 10. You can change this value
    by calling setBlockIncrement().


    These methods are shown here:


    +   1. setUnitIncrement(newIncr)

    2. setBlockIncrement(newIncr)


    # Handling Scroll Bars


    To process scroll events, you need to implement the AdjustmentListener interface.
    Each time a user interacts with a scroll bar, an Adjustment object is generated.
    Its AdjustmentType() can be used to determine the type of the adjustment.


    # Creating Menus


    # JMenuBar


    An implementation of a menu bar. You add JMenu objects to construct a menu. When
    the user selects a JMenu object, its associated popup is displayed, allowing the
    user to select one of the JMenuItems on it.


    # JMenu


    An implementation of a menu -- a popup window containing items that is displayed
    when the user selects an item from the JMenu. In JMenuItems, a menu can also contain
    Separators.


    In essence, a menu is a button with an associated JPopupMenu. When the “button”
    is pressed, the JPopupMenu appears. If the “button” is on the JMenuBar, the menu
    is a top-level window. If the “button” is another menu item, then the JPopupMenu
    is “pull-right” menu.'
