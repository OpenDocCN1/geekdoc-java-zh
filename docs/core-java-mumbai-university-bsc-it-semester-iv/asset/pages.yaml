  md: "# 3.3 DO WHILE\n\ndo while loop is similar to while loop with only difference\
    \ that it checks for condition after executing the statements, and therefore is\
    \ an example of Exit Control Loop.\n\nSyntax:\n\n```\ndo {\n    statements..\n\
    }\nwhile (condition);\n```\n\n![](img/b566e38d12eb7459b68e241fa3902a8a_89_0.png)\n\
    \n+   * Do while loop starts with the execution of the statement(s). There is\
    \ no checking of any condition for the first time.\n* After the execution of the\
    \ statements, and update of the variable value, the condition is checked for true\
    \ or false value. If it is evaluated to true, next iteration of loop starts.\n\
    * When the condition becomes false, the loop terminates which marks the end of\
    \ its life cycle.\n* It is important to note that the do-while loop will execute\
    \ its statements atleast before any condition is checked, and therefore is an\
    \ example of exit control loop.\n\nExample:\n\n```\nclass dowhileDemo {\n    public\
    \ static void main(String[] args[]) {\n        int x = 21;\n        do {\n   \
    \         System.out.println(\"Value of x:\" + x);\n            x++;\n       \
    \ }\n        while (x < 20);\n    }\n}\n```"
