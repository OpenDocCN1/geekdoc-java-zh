  md: "# 3.2 WHILE LOOP\n\nA while loop is a control flow statement that allows code\
    \ to be executed repeatedly based on a given Boolean condition. The while loop\
    \ can be thought of as a repeating if statement.\n\nSyntax:\n\n```\nwhile (boolean\
    \ condition)\n{\n    loop statements...\n}\n```\n\n![](img/b566e38d12eb7459b68e241fa3902a8a_88_0.png)\n\
    \n+   - While loop starts with the checking of condition. If evaluated to true,\
    \ the loop body statements are executed otherwise first statement following the\
    \ loop is executed. For this reason it is also called Entry control loop\n\n+\
    \   - Once the condition is evaluated to true, the statements in the loop body\
    \ are executed. Normally the statements contain an update value for the variable\
    \ being processed for the next iteration.\n\n+   - When the condition becomes\
    \ false, the loop terminates which marks the end of its life cycle.\n\nExample:\n\
    \n```\nclass whileLoop_Demo\n{\n    public static void main(String[] args)\n \
    \   {\n        int x = 1;\n        while (x <= 4)\n        {\n            System.out.println(\"\
    Value of x:\" + x);\n            x++;\n        }\n    }\n}\n```"
