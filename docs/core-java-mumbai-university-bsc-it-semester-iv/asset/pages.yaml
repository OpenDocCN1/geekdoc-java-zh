    # 8.3 LIFECYCLE


    Every operating system has a view of threads that can differ in the details. But
    in most cases broadly similar at a high level. Java tries hard to abstract these
    details away, and has an enum called Thread. State—wrappers over the operating
    system''s view of the thread''s state. The values of Thread provide over the lifecycle
    of a thread:


    +   1. New Born State: When we create a thread object, the thread is born & it
    is said to be new born state, but still this thread is not scheduled for running.
    When it is scheduled by operating system for running that will be done by start
    method. Thread killing will be done by stop method, when thread is started until
    it go into the next state as “Runnable state”.

    2. Runnable state: This state means the thread is ready for execution & is waiting
    for the availability of processor. The threads which join the queue will be scheduled
    for the cpu execution by using “Round Robin Algorithm” or “First come sert”. By
    applying this scheduling it is possible that two threads may have equal priority.
    The thread is giving permission to other thread, having other priority for execution
    that can be done by “yield method”

    3. Running State: Running state means the processor has given tie to the thread
    for execution and this thread will be executed until it is interrupted by higher
    priority thread. The running thread can be suspended for the timing by using suspend
    method. It can be continued by resume method. The running state can sleep specified
    time, that means the delay can be introduced by using sleep method again it can
    move to Runnable state automatically after completion of that time in a sleep
    method.'
