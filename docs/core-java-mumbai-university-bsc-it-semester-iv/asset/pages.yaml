  md: '# Method Description


    | Method | Description |

    | :--- | :--- |

    | Throwable fillInStackTrace() | Returns a Throwable object that contains a completed
    stack trace. This object can be rethrown. |

    | Throwable getCause() | Returns the exception that underlies the current exception.
    If there is no underlying exception, null is returned. |

    | String getLocalizeMessage() | Returns a localized description of the exception.
    |

    | String getMessage() | Returns a description of the exception. |

    | StackTraceElement[] getStackTrace() | Returns an array that contains the stack
    trace, one element at a time, as an array of StackTraceElement. The method at
    the top of the stack is the last method called before the exception was thrown.
    This method is found in the first element of the array. The StackTraceElement
    class gives your program access to each element in the trace, such as its method
    name. |

    | Throwable InitCause(Throwable causesExc) | Associates causeExc with the invoking
    exception as a cause of the invoking exception. Returns a reference to the exception.
    |

    | void printStackTrace() | Displays the stack trace. |

    | void printStackTrace(PrintStream Stream) | Sends the stack trace to the specified
    stream. |

    | void printStackTrace(PrintWriter Stream) | Sends the stack trace to the specified
    stream. |

    | void setStackTrace(StackTraceElement[] elements) | Sets the stack trace to the
    elements passed in elements. This method is for specialized applications, not
    normal use. |

    | String toString() | Returns a String containing a description of the exception.
    This method is called by print() when outputting a Throwable object. |


    You may also wish to override one or more of these methods in exception classes
    that you create. Exception defines four constructors. Two were added by JDK 1.4
    to support chained exceptions, described in the next section. The other two are
    shown here:


    ```

    Exception()

    Exception(String msg)



    The first form creates an exception that has no description. The second form lets
    you specify a description of the exception. Although specifying a description
    when an exception is created is often useful, sometimes it is better to override
    toString(). Here''s why: the version of toString() ) defined by Throwable (and
    inherited by Exception) first displays the name of the exception followed by a
    colon, which is then followed by your description. By overriding toString(), you
    can prevent the exception name and colon from being displayed. This makes for
    a cleaner output, which is desirable in some cases.

    ```'
