    Exceptions are run-time condition error that a program may encounter while executing.
    Errors like division by 0 or access to an array outside of its bounds or running
    out of memory or running out of disk space.


    There are two types of exception handling:


    +   (a) Synchronous.

    (b) Asynchronous.


    A synchronous exceptions out of range index and overflow error can occur. In Asynchronous
    the events which are generated by the control like keyboard interrupts or bad
    sectors in the disc and hardware failure are called as asynchronous exceptions.


