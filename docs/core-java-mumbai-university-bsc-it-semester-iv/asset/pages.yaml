  md: '# Abstract Window Toolkit (AWT)


    # Setting a Window Title


    You can change the title in a frame window using setTitle().

    Its signature is shown here:

    void setTitle(String newTitle)

    Here, newTitle is the new title for the window.


    # Closing a Frame Window


    When using a frame window, your program must remove that from the screen when
    it is closed, by calling visible(false). To intercept a window-close event, you
    must implement the windowClosing() method of the WindowListener interface. Inside
    windowClosing(), you must remove the window from the screen.


    # 12.4 CANVAS COMPONENTS – JAVA CONTROL FUNDAMENTALS


    This article continues our exploration of the Abstract Window Toolkit (AWT). It
    examines the standard controls defined by Java. Controls are components that allow
    a user to interact with your application in various ways—for example; a commonly
    used control is the push button.


    The AWT supports the following types of controls:


    | Labels |

    |---|n| Push buttons |

    | Check boxes |

    | Choice lists |

    | Lists |

    | Scroll bars |

    | Text editing |


    These controls are subclasses of Component.


    # Adding and Removing Controls


    To include a control in a window, you must add it to the window. To do this, you
    must first create an instance of the desired control and add it to a window by
    calling add( ), which is defined by Container. The add( ) method has several forms.


    Component add(Component compObj) Here, compObj is an instance of the control that
    you want add a reference to compObj is returned. Once a control has been added,
    it will automatically be visible whenever its parent window is displayed.


    Sometimes you will want to remove a control from a window when the control is
    no longer needed. To do this, call remove( ). This method is also defined by Container.
    It has this general form:


    ```

    void remove(Component obj)

    ```


    Here, obj; is a reference to the control you want to remove. You can remove all
    controls by calling removeAll().'
