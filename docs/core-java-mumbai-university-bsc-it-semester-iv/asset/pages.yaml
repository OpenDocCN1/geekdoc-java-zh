    \ (instance variables)\n3. A static method can call only other static methods\
    \ and cannot call a non-static method from it.\n4. A static method can be accessed\
    \ directly by the class name and doesn't need any object\n5. Syntax: <class-name>.<method-name>\n\
    6. A static method cannot refer to \"this\" or \"super\" keywords in anyway\n\n\
