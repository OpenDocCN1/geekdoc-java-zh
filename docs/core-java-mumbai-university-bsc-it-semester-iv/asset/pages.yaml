    # # 1.1 INTRODUCTION TO JAVA


    Java is a Object oriented Language, Java is language of internet. Sun Micro System
    setup a team in 1990. But using pointers, multiple inheritance, and programmatic
    memory management were eliminated in Java.


    In 1994 java was becoming popular and team found this language suitable for internet.
    They named it Java. Java has Application Programming Interface (API) that can
    handle graphics and user interfaces and that can be used to create applications
    or applets.


    The Java programming language consists out of Java compiler, the Java virtual
    machine, and the Java class libraries. The Java Virtual Machine (JVM) is a software
    implementation of a computer that executes programs like a real machine.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction to Java Languages


    The Java compiler translates Java coding into so-called byte-code. The Java virtual
    machine interprets this byte-code and runs the program. The Java virtual machine
    is written specifically for a specific operating system.


    Because of its rich set of API''s, similar to Macintosh and Windows, and its platform
    independence, Java can also be thought of as a platform itself. Java also has
    standard libraries for doing mathematics.


    In Java we distinguish between applications, which are programs that perform the
    same functions as those in other programming languages, and applets, which are
    programs that can be embedded in a Web page and accessed over the Internet.


    # 1.2 JAVA (OBJECT ORIENTED PROGRAMMING LANGUAGE)


    Java is an Oriented Language and internet based Language. It is developed by Sun
    Microsystems in 1990. In 1994 internet was becoming very popular and team found
    this language suitable for internet. They named it Java. It is designed to be
    small, portable and highly reliable across different platforms as well as operating
    system.


    In Java development there are two parts 1)Java compiler 2) Java interpreter.

    The compiler generates byte-code and interpreter executes the Java program with
    JIT in JVM.


    For writing the Java programs the Editor used is Notepad, MS-DOS Editor and Edit
    Plus.

    Object contains the data and the code to manipulate that. The entire data and
    the code of an object can be a user-defined type class.


    In oops the class is the template that defined the data and the code. And when
    the variable is declared of a type class it is called as an object. Those functions,
    which are defined in the class, are called as method.


    We can create any number of the object belonging to that class.


    The general form of the variable declaration is


    ```

    Class name

    {

    private:


    variables;

    methods;


    public:


    variables;

    methods;

    }

    ```


    The class contains the declaration of the variables (Data members or properties)
    and the methods (member functions), these are called as the members of the class.


    The keyword private and the public are the access specifier.

    The variables and the methods declare in the private are accessed by the public
    members.'
