    # 10.1 INTRODUCTION TO I/O STREAM


    IO Stream

    Java performs I/O through Streams. A Stream is linked to a physical layer by java
    I/O system to make input and output operation in java. In general, a stream means
    continuous flow of data. Streams are easy to deal with input/output without having
    every part of your code understand the physical.

    Java encapsulates Stream using java.io package. Java defines two types of streams.
    They are:


    +   * **1. Byte Stream**: It provides a convenient means for handling input and
    output of byte.

    * **2. Character Stream**: It provides a convenient means for handling input and
    output of characters. Character stream uses several interfaces Unicode and therefore
    can be internationalized.


