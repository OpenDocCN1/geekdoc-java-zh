    # Events


    In the delegation model, an event is an object that describes a change in a source.
    It can be generated as a consequence of a person interacting with the elements
    in a graphical user interface. Some of the activities that cause events to be
    generated are pressing a button, entering a character via the keyboard, selecting
    an item in a list, and clicking the mouse. Many other user operations could also
    be cited examples. Events may also occur when not directly caused by interactions
    with a user interface.


    # Event Sources


    A source is an object that generates an event. This occurs when the internal state
    of that object changes in some way. Sources may generate more than one type of
    event. A source must register listeners in order for the listeners to receive
    notifications about a specific type of event. Each type of event has its own registration
    method. Here is the general form:


    ```

    public void addEventListener(Type Listener el)

    ```


    Here, Type is the name of the event and el is a reference to the event listener.'
