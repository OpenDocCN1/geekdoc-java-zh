  md: "# Enumerations and Arrays\n\nVectors are useful when the size of the array\
    \ is not known in advance or when the program needs to change sizes over the lifetime\
    \ of a program.\n\nThere are 3 ways to create a vector class object in java.\n\
    \n# Syntax Type 1:\n\n```\nVector vec = Vector();\n```\n\nIt creates a default\
    \ vector with initial capacity of 10. It means the Vector will be re-sized when\
    \ the 11th elements are inserted into the Vector.\n\nNote: By default vector doubles\
    \ its size. i.e., In this case the Vector size would remain 10 till 10 insertions\
    \ and we try to insert the 11th Element would become 20 (double of default capacity\
    \ 10).\n\n# Syntax Type 2:\n\n```\nVector object = new Vector(initialCapacity)\n\
    ```\n\n# Example:\n\n```\nVector vec = new Vector(5);\n```\n\nIt will create a\
    \ Vector of initial capacity of 5.\n\n# Syntax Type 3:\n\n```\nVector object =\
    \ new Vector(initialCapacity, capacityIncrement)\n```\n\n# Example:\n\n```\nVector\
    \ vec = new Vector(5, 8);\n```\n\nHere have provided two arguments. The initial\
    \ capacity is 5 and capacity Increment is 8. It means upon insertion of 6th element\
    \ the size would be 13 (5 + 8) and on 14th insertion it would be 21(13 + 8).\n\
    \n# Example Program:*\n\n```\nimport java.io.*;\nimport java.util.*;\nclass MyVector{\n\
