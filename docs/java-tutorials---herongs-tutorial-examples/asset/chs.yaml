  \ Examples\n\n∟断言语句和 -ea 选项\n\n### JVM \"-ea\" 和 \"-da\" 选项\n\n本节描述了 `-ea` 和 `-da`\
  \ JVM 选项，它们用于在应用程序类启用或禁用断言。\n\n默认情况下，为了节省执行时间，程序中的“assert”语句不会执行。如果你正在运行一个带有“assert”语句的\
  \ Java 应用程序，可以开启 JVM 断言选项来排查执行问题。\n\nJVM (`java` 命令）支持多个断言选项：\n\n- `\"-ea\"` - 为所有应用程序类启用断言。\n\
  - `\"-da\"` - 为所有应用程序类禁用断言。\n- `\"-ea:class_name\"` - 为指定的类启用断言。\n- `\"-da:class_name\"\
  ` - 为指定的类禁用断言。\n- `\"-esa\"` - 为所有系统类启用断言。\n- `\"-dsa\"` - 为所有系统类禁用断言。\n\n让我们使用\
  \ `\"-ea\"` 选项重新运行上一个教程中的示例程序：\n\n```\n herong> java -ea AssertStatementTest.java\
  \ 8\nHour specified: 8\nGood morning!\n\nherong> java -ea AssertStatementTest.java\
  \ 18\nHour specified: 18\nGood evening!\n\nherong> java -ea AssertStatementTest.java\
  \ 28\nHour specified: 28\nException in thread \"main\" java.lang.AssertionError:\n\
  \  Hour = 28\\. It be must be < 24.\n  at AssertStatementTest.greeting(AssertStatementTest.java:19)\n\
  \  at AssertStatementTest.main(AssertStatementTest.java:10)\n\nherong> java -ea\
  \ AssertStatementTest.java -8\nHour specified: -8\nException in thread \"main\"\
  \ java.lang.AssertionError:\n  Hour = -8\\. It be must be >= 0.\n  at AssertStatementTest.greeting(AssertStatementTest.java:16)\n\
  \  at AssertStatementTest.main(AssertStatementTest.java:10)\n```\n\n如你所见，两个“assert”语句都执行了。正确生成了\
  \ AssertionError 错误消息。\n\nJava Tutorials - Herong's Tutorial Examples\n\n∟注解语句和声明\
  \ xhtml\n\n本章提供了关于注解的教程笔记。主题包括：声明新的注解类型；使用 'interface' 创建注解；为注解元素指定默认值；单元素或无元素注解调用的简写格式；在运行时使用\
  \ `getAnnotations()` 方法获取注解信息；Java 中预定义的注解。\n\n- 什么是注解\n- 使用 \"interface\" 作为注解\n\
  - 注解元素的默认值\n- 单元素注解调用\n- 无元素（标记）注解调用\n- getAnnotations() 方法 - 注解 API\n- 预定义的注解类型\n\
  \n结论：\n\n- 注解是一种编程机制，允许你将额外信息与程序结构（如类、方法、变量等）关联起来。\n- `\"@interface\"` 语句用于声明新的注解类型，这是一种特殊的接口类型。\n\
  - 注解元素是声明在接口中的方法。\n- `\"default\"` 关键字用于为注解元素指定默认值。\n- 名为 `\"value\"` 的单元素注解调用可以简写为\
  \ `@Type(value)`。\n- 无元素的注解调用（称为标记注解）可以简写为 `@Type`。\n- Java 提供了 `getAnnotations()`\
  \ 方法和其他 API 来帮助你在运行时获取注解信息。\n- Java 提供了许多预定义的注解类型。其中大多数被编译器使用以防止编程错误。\n\nJava Tutorials\
  \ - Herong's Tutorial Examples\n\n∟注解语句和声明\n\n### 什么是注解\n\n本节描述了注解这种编程机制，它允许你将额外信息与程序结构关联起来。\n\
  \n**什么是注解？** - 注解是一种编程机制，允许你将额外信息与程序结构（如类、方法、变量等）关联起来。\n\n注解提供的信息对程序结构的行为没有影响。但\
  \ Java 编译器和其他工具可以利用这些注解信息。\n\nJava 中的注解机制设计包含 4 个组件：\n\n1. 注解类型 (Annotation Type)\
  \ - 一种由 `\"@interface\"` 声明语句定义的特殊接口类型（也称为注解声明语句）。\n2. 注解声明 (Annotation Declaration)\
  \ - `\"@interface\"` 声明语句，定义带有或带有注解元素的注解类型，以获取注解信息。\n3. 注解元素 (Annotation Element)\
  \ - 注解类型中声明的无参数特殊方法，用于获取一段注解信息。\n4. 注解调用 (Annotation Invocation) - `\"annotation_type_name(annotated_information)\"\
  ` 语句，用于使用指定的注解调用指定的注解类型。注解调用语句只能放置在目标程序结构的声明语句之前。\n\n这是一个 `\"interface\"` 声明语句的示例：\n\
  \n```\n /* Header.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\n\n// 注解声明\n@interface Header {\n   String usage();    // 目标结构的用途\n}\n```\n\
  \n现在我们可以使用这种注解类型，通过注解调用将信息与不同的程序结构关联。\n\n```\n /* HeaderTest.java\n * Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n */\n\n// 注解调用静态变量\n@Header(usage=\"\
  Testing theHeader annotation.\")\nclass HeaderTest {\n\n   // 注解调用静态变量\n   @Header(usage=\"\
  To whom you want to greet.\")\n   private static String name = \"Herong\";\n\n \
  \  // 注解调用方法\n   @Header(usage=\"The execution entry point.\")\n   public static\
  \ void main(String[] arg) {\n\n      // 注解调用局部变量\n      @Header(usage=\"The execution\
  \ entry point.\")\n      String message = \"How are you?\";\n\n      System.out.println(name+\"\
  , \"+message);\n   }\n}\n```\n\n如果你编译并运行 HeaderTest.java，你会得到：\n\n```\n herong>\
  \ javac Header.java\n\nherong> javac HeaderTest.java\n\nherong> java Header\nHerong,\
  \ How are you?\n```\n\n如你所见，这些注解调用对编译和执行没有影响。\n\n因此，从执行的角度来看注解是无用的。但它们为你的 Java 程序提供了一种添加结构化注释的标准方式。\n\
  \nJava Tutorials - Herong's Tutorial Examples\n\n∟注解语句和声明\n\n### 使用 \"interface\"\
  \ 作为注解\n\n本节提供了一个教程示例，说明如何使用 'interface' 类型大致完成与 'annotation' 类型相同的工作。\n\n根据 Java\
  \ 语言规范，注解类型实际上是接口类型。\n\n因此，我认为 Java 编译器实际上是：\n\n- 将 `\"@interface\"`（注解类型）声明语句转换为\
  \ `\"interface\"` 声明语句。\n- 将注解类型元素声明转换为接口方法声明。\n- 将注解调用语句转换为 `\"class\"` 声明语句以实现声明的接口类型。\n\
  - 将注解信息（注解元素-值对）转换为带有返回语句的方法，以重写接口中的方法。\n\n让我们看看这个使用注解类型的示例程序：\n\n\n\n\n\n```java\n\
  \ /* HeaderAnnotation.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nclass HeaderAnnotation {\n   // Annotation declaration\n   @interface Header\
  \ {\n      String usage();    // Usage of the targeted construct\n      int version();\
  \     // Version number of targeted construct\n   }\n\n   // Annotation invocation\n\
  \   @Header(\n      usage=\"The execution entry point.\",\n      version=10\n  \
  \ )\n   public static void main(String[] arg) {\n      System.out.println(\"Hello\
  \ world!\");\n   }\n}\n```\n\n我们可以使用接口类型重写上面的程序：\n\n```java\n /* HeaderInterface.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved\n */\nclass HeaderInterface\
  \ {\n   // Annotation declaration\n   interface Header {\n      public String usage();\
  \    // Usage of the targeted construct\n      public int version();     // Version\
  \ number of targeted construct\n   }\n\n   // Annotation invocation\n   class Header1\
  \ implements Header {\n      public String usage() { return \"The execution entry\
  \ point.\"; }\n      public int version() { return 10; }\n   }\n   public static\
  \ void main(String[] arg) {\n      System.out.println(\"Hello world!\");\n   }\n\
  }\n```\n\n如果你编译并运行这两个程序，你将得到：\n\n```\n herong> java HeaderAnnotation.java\nHello\
  \ world!\n\nherong> java HeaderInterface.java\nHello world!\n```\n\n如你所示，我们成功地使用接口类型而不是注解类型完成了相同的工作。\n\
  \nJava 教程 - Herong 的教程 示例\n\n∟注解语句与声明\n\n### 注解元素的默认值\n\n本节提供了一个教程示例，演示了如何为注解元素声明默认值，以及如何在注解调用语句中使用这些默认值。\n\
  \n当你声明一个注解类型时，可以为注解元素提供默认值。默认值在元素声明的末尾指定，并跟在 `default` 关键字之后。\n\n当你调用一个带有默认值元素的注解类型时，可以通过跳过参数列表中的该元素来获取该默认值。\n\
  \n这里是一个示例程序，向你展示如何声明和使用注解元素的默认值。\n\n```java\n /* DefaultValueAnnotation.java\n *\
  \ Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass DefaultValueAnnotation\
  \ {\n\n   // Annotation declaration\n   @interface Header {\n      String usage();\
  \    // Usage of the targeted construct\n      int version();     // Version number\
  \ of targeted construct\n      String author() default \"Unknown\"; // Default value\
  \ provided\n9}\n\n   // Annotation invocation - All values provided\n   @Header(usage=\"\
  Entry point\", version=1, author=\"Herong\")\n   public static void main(String[]\
  \ arg) {\n      printMsg(\"Hello world!\");\n   }\n\n   // Annotation invocation\
  \ - 使用了默认值\n   @Header(usage=\"Display message\", version=10)\n   public static\
  \ void printMsg(String msg) {\n      System.out.println(msg);\n   }\n}\n```\n\n\
  如果你编译并运行该程序，你将得到：\n\n```\n herong> java DefaultValueAnnotation.java\n\nHello world!\n\
  ```\n\nJava 教程 - Herong 的教程 示例\n\n∟注解语句与声明\n\n### 单元素注解调用\n\n本节提供了一个教程示例，演示了如何在注解调用语句中使用名为\
  \ `value` 的单元素注解简写格式。\n\n如果一个注解调用语句只有一个注解元素，且该元素的名称为 `value`，则你可以在参数列表中指定元素值而无需指定元素名称。\n\
  \n因此，如果 `@Author` 注解有一个名为 `value` 的元素，且其他元素都有默认值，那么以下两个语句是相同的：\n\n```java\n @Author(value=\"\
  Herong\") class X {...}\n\n// 上述语句的简写格式\n@Author(\"Herong\") class X {...}\n```\n\
  \n这里是一个示例程序，向你展示如何在注解调用语句中使用名为 `value` 的单元素注解简写格式。\n\n```java\n /* SingleElementAnnotation.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass SingleElementAnnotation\
  \ {\n   // Annotation declaration\n   @interface Author {\n      String value()\
  \ default \"Unknown\";    // 特殊元素\n      String email() default \"info@nowhere.com\"\
  ;\n   }\n\n   // Annotation invocation - 提供了所有元素\n   @Author(value=\"Herong\", email=\"\
  herong@nowhere.com\")\n   public static void main(String[] arg) {\n      printMsg(\"\
  Hello world!\");\n   }\n\n   // Annotation invocation - 提供了一个元素\n   @Author(value=\"\
  John\")\n   public static void printMsg(String msg) {\n      printMsgUpper(msg);\n\
  \   }\n\n   // Annotation invocation - 仅有一个值\n   @Author(value=\"Mary\")\n   public\
  \ static void printMsgUpper(String msg) {\n      System.out.println(msg.toUpperCase());\n\
  \   }\n}\n```\n\n如果你编译并运行该程序，你将得到：\n\n```\n herong> java SingleElementAnnotation.java\n\
  \nHELLO WORLD!\n```\n\nJava 教程 - Herong 的教程 示例\n\n∟注解语句与声明\n\n### 无元素（标记）注解调用\n\n\
  本节提供了一个教程示例，演示了在不需要注解元素时，如何在注解调用语句中使用标记格式。\n\n如果一个注解调用语句没有注解元素，你可以省略括号 `()`。\n\n\
  没有注解元素的注解调用语句被称为“标记注解”，因为它出现在目标程序构造的前的前。\n\n这里是一个示例程序，向你展示在不需要注解元素时，如何在注解调用语句中使用标记格式。\n\
  \n```java\n /* MarkerAnnotation.java\n * Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n */\nclass MarkerAnnotation {\n\n   // Annotation declarations\n  \
  \ @interface Herong {\n      String value() default \"Herong\";\n      String email()\
  \ default \"herong@nowhere.com\";\n   }\n   @interface John {\n      String value()\
  \ default \"John\";\n      String email() default \"john@nowhere.com\";\n   }\n\n\
  \   // Annotation invocation - 标记格式\n   @Herong public static void main(String[]\
  \ arg) {\n      printMsg(\"Hello world!\");\n   }\n\n   // Annotation invocation\
  \ - 普通格式\n   @John() public static void printMsg(String msg) {\n      System.out.println(msg);\n\
  \   }\n}\n```\n\n如果你编译并运行该程序，你将得到：\n\n```\n herong> java MarkerAnnotation.java\n\
  \nHello world!\n```\n\nJava 教程 - Herong 的教程 示例\n\n∟注解语句与声明\n\n### getAnnotations()\
  \ 方法 - 注解 API\n\n本节提供了一个教程示例，演示了如何使用 `getAnnotations()` 方法和其他注解 API 在运行时获取注解信息。\n\
  \n在之前的教程中，我们学习了如何声明自己的注解类型并在注解调用语句中使用它们。\n\n你自己的注解类型可以帮助你以更有结构的方式为 Java 源码添加信息。但需要构建自己的工具来解析、验证和处理注解信息。\n\
  \n构建注解处理工具可以通过任何编程语言编写独立程序来实现。但你也可以 Java 反射机制在运行时获取注解信息进行处理。\n\n这里是一些你可以用于在运行时获取注解信息的\
  \ Java API：\n\n1. `java.lang.annotation` 包 - 包含支持注解 API 的接口和类。\n\n2. `@Retention(value=RetentionPolicy.RUNTIME)`\
  \ 注解 - 用于标记你的注解声明，使其在运行时虚拟机中保留。\n\n3. `Class.getAnnotations()` 方法 - 返回与该类关联的所有注解。\n\
  \n4. `Method.getAnnotations()` 方法 - 返回与该方法关联的所有注解。\n\n5. `Field.getAnnotations()`\
  \ 方法 - 返回与该字段（静态或实例变量）关联的所有注解。\n\n\n\n\n\n这是一个示例程序，向你展示如何使用 Java 注解 API 在运行时获取被注解的信息进行处理\n\
  \n```java\n /* GetAnnotationsTest.java\n * Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n */\nimport java.lang.annotation.*;\nclass GetAnnotationsTest {\n\n\
  \   @Retention(value=RetentionPolicy.RUNTIME)\n   @interface Herong {\n      String\
  \ value() default \"Herong\";\n      String email() default \"herong@nowhere.com\"\
  ;\n   }\n\n   @Retention(value=RetentionPolicy.RUNTIME)\n   @interface John {\n\
  \      String value() default \"John\";\n      String email() default \"john@nowhere.com\"\
  ;\n   }\n\n   @John public static String msg = \"Hello world!\";\n\n   @Herong public\
  \ static void main(String[] arg) {\n      java.io.PrintStream out = System.out;\n\
  \n      try {\n        // processing annotations on a class\n        java.lang.Class\
  \ cls = Dummy.class;\n        Annotation[] list = cls.getAnnotations();\n      \
  \  out.println(\"Annotations on class: \"+cls.getName());\n        for (Annotation\
  \ a: list) {\n           out.println(\"   \"+a);\n        }\n\n        // processing\
  \ annotations on a method\n        java.lang.reflect.Method mtd =\n           GetAnnotationsTest.class.getMethod(\"\
  main\", String[].class);\n        list = mtd.getAnnotations();\n        out.println(\"\
  Annotations on method: \"+mtd.getName());\n        for (Annotation a: list) {\n\
  \           out.println(\"   \"+a);\n        }\n\n        // processing annotations\
  \ on a field (variable)\n        java.lang.reflect.Field fld =\n           GetAnnotationsTest.class.getField(\"\
  msg\");\n        list = fld.getAnnotations();\n        out.println(\"Annotations\
  \ on field: \"+fld.getName());\n        for (Annotation a: list) {\n           out.println(\"\
  \   \"+a);\n        }\n\n      } catch (Exception e) {\n        e.printStackTrace();\n\
  \      }\n\n      // normal execution\n      out.println(msg);\n   }\n\n   @Herong\
  \ @John public class Dummy {}\n}\n```\n\n如果你编译并运行该程序，你将得到：\n\n```\n herong> java\
  \ GetAnnotationsTest.java\n\nAnnotations on class: GetAnnotationsTest$Dummy\n  \
  \ @GetAnnotationsTest$Herong(value=\"Herong\", email=\"herong@nowhere.com\")\n \
  \  @GetAnnotationsTest$John(value=\"John\", email=\"john@nowhere.com\")\nAnnotations\
  \ on method: main\n   @GetAnnotationsTest$Herong(value=\"Herong\", email=\"herong@nowhere.com\"\
  )\nAnnotations on field: msg\n   @GetAnnotationsTest$John(value=\"John\", email=\"\
  john@nowhere.com\")\n\nHello world!\n```\n\n如你所见，我现在可以轻松地获取注解信息并生成一份良好的报告。\n\nJava\
  \ 教程 - Herong 的教程示例\n\n## 注解语句与声明\n\n### 预定义注解类型\n\n本节描述了当前 Java 版本中预定义的注解类型。还提供了一个教程示例，展示了如何使用预定义的注解\
  \ `@Deprecated`。\n\n在之前的教程中，我们已经学习了如何声明自己的注解类型并在注解调用语句中使用它们。\n\n你自己的注解类型可以帮助你以更结构化的方式为\
  \ Java 程序添加信息。但需要构建你自己的工具来解析和处理它们。\n\n在构建你自己的注解处理工具之前，你可能想查看 JDK 包中预定义的、由 `javac`\
  \ 编译器和其他工具处理的注解类型。\n\n以下是当前 JDK 版本中预定义的注解类型列表：\n\n-   `@Target` - 用于注解新的注解声明，以限制其目标程序构造类型。\n\
  -   `@Retention` - 用于注解新的注解声明，以指定新注解的保留范围，是在源代码中、字节码类中，还是在运行时虚拟机中。\n-   `@Inherited`\
  \ - 用于注解新的注解声明，指定它是否应该被继承到目标类的子类中。\n-   `@Override` - 用于注解方法声明，告知编译器目标方法覆盖了父类中的相同方法。这有助于编译器检测将重写方法写成重载方法的编码错误。\n\
  -   `@SuppressWarnings` - 用于注解任何声明，告知编译器停止在目标声明上生成某些编译警告信息。\n-   `@Deprecated` -\
  \ 用于注解任何声明，告知编译器在任何程序中使用目标声明时生成“已用”警告。\n-   `@SafeVarargs` - 用于注解方法声明，告知编译器当使用非可重构元素类型的可变参数时，停止生成“未检查”警告。\n\
  -   `@Repeatable` - 用于注解新的注解声明，指定它可以作为其他注解中的数组元素被重复使用。\n-   `@FunctionalInterface`\
  \ - 用于注解接口声明，指定它是一个函数接口。这有助于编译器检测声明错误。\n\n以下是一个示例程序，向你展示如何在类声明上使用预定义的注解 `@Deprecated`：\n\
  \n```java\n /* Dummy.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\n@Deprecated class Dummy {}\n```\n\n现在，如果你在另一个 Java 程序中使用此 `@Deprecated`，你将得到一个编译警告。\n\
  \n```java\n /* DeprecatedDummyTest.java\n * Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n */\nclass DeprecatedDummyTest {\n\n   Dummy dummy = new Dummy();\n\
  \n   public static void main(String[] arg) {\n      System.out.println(\"Hello world!\"\
  );\n   }\n}\n```\n\n编译上述程序查看警告消息：\n\n```\n herong> javac Dummy.java\n\nherong> javac\
  \ DeprecatedDummyTest.java\nNote: DeprecatedDummyTest.java uses a deprecated API.\n\
  Note: Recompile with -Xlint:deprecation for details.\n\nherong> javac -Xlint:deprecation\
  \ DeprecatedDummyTest.java\nDeprecatedDummyTest.java:6: warning: [deprecation] Dummy\
  \ in unnamed package\n   Dummy dummy = new Dummy();\n                     ^\n```\n\
  \nJava 教程 - Herong 的教程示例\n\n## Java 相关术语\n\n本章提供了与 Java 相关的术语列表。\n\n以下是与 Java 相关的术语列表：\n\
  \n-   **注解 (Annotation)**：一种允许你为程序构造（如类、方法、变量等）关联额外信息的机制。参见什么是注解**：定义在注解类型中的、没有参数的特殊方法，用于获取注解信息。参见什么是注解**：使用\
  \ `@annotation_type_name(annotated_information)` 语句使用指定的注解信息调用指定的注解类型。注解调用语句只能放在目标程序构造的声明语句之前。参见什么是注解**：通过\
  \ `@interface` 声明语句定义的特殊接口类型（也称为注解声明语句）。参见[什么是注解](#part0161.xhtml）教程。\n\n\n\n\n\n\
  **位 (Bit)** - 二进制数中的单个数字位。它只有两种可能的值：0 和 1。参见“什么是位和字节”教程中的示例。\n\n**按位运算 (Bitwise\
  \ Operation)** - 一种要求操作数以二进制格式表示的操作，并一次对一个位进行计算。参见“字节值上的按位运算”教程中的示例。\n\n**边界类型参数\
  \ (Bounded Type Parameter?)** - 只能用某些限制类型进行参数化的类型参数。这种对类型参数的限制允许你创建泛型类，为这些限制类型提供特殊函数。参见“边界类型参数”教程中的示例。\n\
  \n**`break` 语句 - 标签形式 (break Statement - Labeled Form)** - 一种分支语句，将控制转移到带标签的闭块语句的末尾。参见“标签\
  \ break 语句”教程中的示例。\n\n**`break` 语句 - 非标签形式 (break Statement - Non-Labeled Form)**\
  \ - 一种分支语句，将控制转移到直接包含的 `switch`、`while`、`do` 或 `for` 语句的末尾。参见“break 语句”教程中的示例。\n\
  \n**字节 (Byte)** - 包含 8 个二进制位的数字信息大小单位，1 字节 = 8 位，可以包含 256 种可能的值。在 Java 中，`byte`\
  \ 是一种原始数据类型，使用 1 字节（8 位）存储来存储 -128 到 127 的 256 种可能的整数。参见“byte 数据类型和隐式转换”教程中的示例。\n\
  \n**`continue` 语句 - 标签形式 (continue Statement - Labeled Form)** - 一种分支语句，将控制转移到带标签的闭循环块的末尾，并继续标签循环的下次迭代。参见“标签\
  \ continue 语句”教程中的示例。\n\n**`continue` 语句 - 非标签形式 (continue Statement - Non-Labeled\
  \ Form)** - 一种分支语句，将控制转移到直接包含的循环块的末尾，并继续循环的下次迭代。参见“continue 语句”教程中的示例。\n\n**控制流语句\
  \ (Control Flow Statement)** - 改变默认执行流的语句，按顺序逐个运行语句。参见“什么是控制流语句”教程中的示例。\n\n**死锁\
  \ (Deadlock)** - 一种执行状态，当两个或多个线程都处于等待状态时，因为两个线程持有各自的同步锁，同时等待另一个线程释放锁。参见“什么是死锁”教程中的示例。\n\
  \n**`do` 语句 (do Statement)** - 一种循环语句，立即执行包含的语句，然后在给定条件为真时重复执行。参见“do 语句”教程中的示例。\n\
  \n**枚举类型 (Enum Type)** - 一种特殊的类类型，拥有一组预定义的实例，表示一组称为枚举常量的静态值。参见“什么是枚举类型”教程中的示例。\n\
  \n**`for` 语句 - 基本形式 (for Statement - Basic Form)** - 一种循环语句，带有初始逻辑、循环条件和更新逻辑重复执行包含的语句。参见“基本\
  \ for 语句”教程中的示例。\n\n**`for` 语句 - 增强形式 (for Statement - Enhanced Form)** - 一种循环语句，为给定列表中的每个元素重复执行包含的语句。参见“增强型\
  \ for 语句”教程中的示例。\n\n**垃圾回收器 (Garbage Collector)** - 一种自动释放未使用对象占用内存的执行线程。垃圾回收器由\
  \ JVM 管理，并与应用程序线程分离执行。参见“垃圾回收和未使用的对象”教程中的示例。\n\n**泛型类 (Generic Class)** - 支持一个或多个类型参数的类。当用给类型参数调用时，泛型类变成参数化类。参见“什么是泛型类”教程中的示例。\n\
  \n**泛型方法 (Generic Method)** - 使用一个或多个类型参数（也称为类型变量）的静态方法或实例方法，使其更具通用性，以便可以作为多种变体使用，每个变体对应一组给类型参数的具体类型参数。参见“什么是泛型方法”教程中的示例。\n\
  \n**泛型类型 (Generic Type)** - 由使用类型参数的泛型类或泛型接口定义的引用数据类型。参见“原始类型、泛型类型和参数化类型”教程中的示例。\n\
  \n**`if-then` 语句 (if-then Statement)** - 一种决策语句，仅当给定的“布尔”表达式为“true”时执行包含的子语句。参见“if-then\
  \ 语句”教程中的示例。\n\n**`if-then-else` 语句 (if-then-else Statement)** - 一种决策语句，当给定的“布尔”表达式为“true”时只执行第一个包含的子语句。否则，只执行第二个包含的子语句。参见“if-then-else\
  \ 语句”教程中的示例。\n\n**Lambda 表达式 (Lambda Expression)** - 实现只有一个抽象方法的接口的特殊匿名类的简写形式。参见“什么是\
  \ Lambda 表达式”教程中的示例。\n\n**字面量 (Literal)** - 字面量是 Java 源码中数据的字符串表示。参见“原始类型的字面量”教程中的示例。\n\
  \n**标记注解 (Marker Annotation)** - 不需要参数的注解简写格式 `@Type`。参见“无元素注解调用”教程中的示例。\n\n**方法引用\
  \ (Method Reference)** - 包含一个静态方法调用的特殊 Lambda 表达式的简写形式。参见“方法引用 Lambda”教程中的示例。\n\n\
  **模块 (Module)** - 一种管理 Java 程序和相关资源的聚合机制。参见“什么是 Java 模块”教程中的示例。\n\n**参数化类型 (Parameterized\
  \ Type)** - 由使用类型参数的泛型类泛化版本定义的引用数据类型。参见“原始类型、泛型类型和参数化类型”教程中的示例。\n\n**原始类型 (Raw Type)**\
  \ - 省略了类型参数的参数化类型。Java 支持原始类型以保持旧应用程序运行。在大多数情况下，原始类型等同于以 `Object` 为类型参数的参数化类型。参见“原始类型、泛型类型和参数化类型”教程中的示例。\n\
  \n**移位运算 (Shift Operation)** - 一种要求操作数以二进制格式表示的操作，然后将所有位向左或向右移动。参见“移位运算 - 左移、右移或无符号右移”教程中的示例。\n\
  \n**`switch` 语句 (switch Statement)** - 执行语句块的一部分。执行的部分从标签匹配给定表达式值的语句开始，到块的最后一个语句结束。否则，只执行第二个包含的子语句。参见“switch\
  \ 语句”教程中的示例。\n\n**同步 (Synchronization)** - 一种允许多个执行线程同步共享资源的编程技术。参见“同步技术 - 锁和同步代码”教程中的示例。\n\
  \n**类型参数推断 (Type Argument Inference)** - 在未指定所需的类型参数时，由编译器执行确定实际类型参数的过程。参见“什么是类型参数推断”教程中的示例。\n\
  \n\n\n\n\n# `while` 语句 - 循环语句，当给定条件为真时，重复执行包含的语句。请参阅\"'while' 语句\"教程中的示例。\n\n# `通配符泛型类型`\
  \ - 泛型类或接口的参数类型，其中参数类型代表一组类型，而不是单个类型。请参教程中的示例。\n\n## Java 教程 - Herong 的教程示例\n\n\
