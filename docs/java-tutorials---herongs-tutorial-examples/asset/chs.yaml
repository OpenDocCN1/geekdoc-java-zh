  \ 0 值时。\n- `main` 线程通过调用 `count_down.isAlive()` 不断检查 `count-down` 线程的状态。一旦检测到 `count-down`\
  \ 线程终止，它将通过 `normal_clock.interrupt()` 向普通时钟线程发送中断信号。\n- `normal clock` 线程通过调用 `isInterrupted()`\
  \ 不断检查其中断状态。一旦收到主线程的中断信号，它将跳出循环并自行终止。\n- 在向普通时钟发送中断信号后，`main` 线程也会自行终止。\n- `stop-watch`\
  \ 线程将在主 线程终止后由 JVM 强制终止，因为它是由 `main` 线程创建的并标记为守护线程。\n\n请同时注意：\n\n- 中断信号可能在线程处于睡眠中间到达。当发生这种情况时，`sleep()`\
  \ 调用将立即返回并抛出 `InterruptedException`。该线程应该快速自行终止。\n\n\n\n\n\n# ThreadGroup 类与概述\n\
  \n* 线程中模拟的闹钟完全不准确。执行 `sleep()` 语句之外的其他语句所花费的额外时间也会计算在内。你会发现普通时钟线程的运行速度比你的手表要慢。\n\
  * 我使用了 `System.out.print()` 方法配合 `'\\r'` 字符，使输出文本在屏幕的同一行内重复。这会让输出看起来更像一个真实的时钟。\n\
  * 我的程序中使用了 `GregorianCalendar` 类来获取当前的时、分、秒和毫秒值，并将这些值格式化为字符串。我在我的另一本关于 JDK 的书中有关于日历类的更多笔记。\n\
  \n### 我的程序运行一次的输出：\n\n```\n Normal clock  Stop watch    Count-down\n21:19:13:764\
  \  00:05:000  000\n```\n\n## ThreadGroup 类与 \"system\" ThreadGroup 树\n\n本章提供了关于\
  \ `ThreadGroup` 类和 `'system'` `ThreadGroup` 树的教程笔记和示例。主题包括：\n* `ThreadGroup` 类的方法\n\
  * 显示 `'system'` `ThreadGroup` 树\n* 添加线程和线程组\n* 测试 JDK 1.3 - 未启动线程的内存泄漏\n\n#### 结论\n\
  \n* Java 中的线程被组织成线程树。\n* `JVM` 启动时带有一个名为 `\"system\"` 的线程组，它包含一个名为 `\"main\"` 的子组。\n\
  * Java 应用运行在 `\"main\"`组中。\n\n## ThreadGroup 类 - 线程和组的容器\n\n本节描述了 `ThreadGroup`\
  \ 类及其主要方法。`ThreadGroup` 对象代表 `Thread` 对象和线程组的集合。\n\n### ThreadGroup 类的特征\n\n* 所有\
  \ `ThreadGroup` 类对象都组织成树形。除了根节点外，每个 `ThreadGroup` 对象在树中必须有一个父 `ThreadGroup` 对象。\n\
  * 树的根对象由 Java 虚拟机 (`JVM`) 提供并管理。\n\n### 主要方法\n\n* `getParent()`：返回父 `ThreadGroup`\
  \ 对象。\n* `activeCount()`：返回此 `ThreadGroup` 对象及其子树中活跃的 `Thread` 对象数量。\n* `activeGroupCount()`：返回此\
  \ `ThreadGroup` 对象及其子树中活跃的 `ThreadGroup` 对象数量。\n* `enumerate(Thread[] l)`：复制 `ThreadGroup`\
  \ 对象及其子树中活跃的 `Thread` 对象。\n* `enumerate(ThreadGroup[] l)`：复制 `ThreadGroup` 对象及其子树中活跃的\
  \ `ThreadGroup` 对象。\n* `interrupt()`：对此 `ThreadGroup` 对象及其子树中的所有 `Thread` 对象调用 `interrupt()`\
  \ 方法。\n\n## 显示 \"system\" ThreadGroup 树\n\n本节提供了一个如何使用 `enumerate()` 和 `list()`\
  \ 方法显示 `'system'` `ThreadGroup` 树的教程示例。如前节所述，`JVM` 管理一个单一的树结构来组织所有的 `ThreadGroup`\
  \ 类和线程类。以下是该树维护的规则：\n\n* 树的根节点是一个名为 `\"system\"` 的 `ThreadGroup` 对象。\n* `\"system\"\
  ` 组包含若干若干执行 `JVM` 任务的线程。\n* `\"system\"` 组仅包含一个名为 `\"main\"` 的 `ThreadGroup` 对象。\n\
  * `\"main\"` 组包含一个名为 `\"main\"` 的线程，它是应用程序的启动线程。\n* `\"main\"` 组不包含其他 `ThreadGroup`\
  \ 对象。\n* 如果创建新的 `ThreadGroup` 对象时没有指定父 `ThreadGroup` 对象，它将被添加到 `\"main\"` 组中。\n\
  * 如果创建新的 `Thread` 对象时没有指定 `ThreadGroup` 对象，它将被添加到 `\"main\"` 组中。\n\n以下是一个示例程序，展示如何使用\
  \ `ThreadGroup` 类中的某些方法从 ThreadGroup 树获取信息：\n\n```\n /* ThreadGroupTree.java\n *\
  \ Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass ThreadGroupTree\
  \ {\n   public static void main(String[] args) {\n      Thread t = Thread.currentThread();\n\
  \      ThreadGroup g = t.getThreadGroup();\n      g = g.getParent();\n      printInfo(g,\"\
  \");\n      g.list();\n   }\n   public static void printInfo(ThreadGroup g, String\
  \ p) {\n      System.out.println(p+\"ThreadGroup name = \"+g.getName());\n     \
  \ System.out.println(p+\"   Has parent thread group = \"\n         +(g.getParent()!=null));\n\
  \      int n = g.activeCount();\n      System.out.println(p+\"   # of active threads\
  \ = \"+n);\n      Thread[] l = new Thread[n];\n      n = g.enumerate(l, false);\n\
  \      for (int i=0; i<n; i++) {\n         System.out.println(p+\"   Thread name\
  \ = \"+l[i].getName());\n      }\n      n = g.activeGroupCount();\n      System.out.println(p+\"\
  \   # of active sub thread groups = \"+n);\n      ThreadGroup[] s = new ThreadGroup[n];\n\
  \      n = g.enumerate(s, false);\n      for (int i=0; i<n; i++) {\n         printInfo(s[i],\"\
  \   \"+p);\n      }\n   }\n}\n```\n\n输出：\n\n```\n ThreadGroup name = system\n  \
  \ Has parent thread group = false\n   # of active threads = 5\n   Thread name =\
  \ Reference Handler\n   Thread name = Finalizer\n   Thread name = Signal Dispatcher\n\
