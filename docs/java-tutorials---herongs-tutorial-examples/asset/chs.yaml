  \      statement block_2\n   }\n   public synchronized void m3() {\n      statement\
  \ block_3\n   }\n   public void m4() {\n      synchronized (this) {\n         statement\
  \ block_4\n      }\n   }\n}\n```\n\n- 一个线程执行 `block_1` 可能因为另一个线程正在执行 `block_1` 而阻塞吗？\n\
