  \ `block_1` 而阻塞吗？\n- 一个线程执行 `block_2` 可能因为另一个线程正在执行 `block_2` 而阻塞吗？\n- 一个线程执行 `block_2`\
  \ 可能因为另一个线程正在执行 `block_3` 而阻塞吗？\n- 一个线程执行 `block_2` 可能因为另一个线程正在执行 `block_4` 而阻塞吗？\n\
