  对于一个编写良好的应用程序，可以管理多个代码段以使其同时执行。在这里，执行流被称为一个 `thread`（线程）。能够管理多个线程的程序被称为多线程程序。\n\n\
  多线程程序的一个很好的例子是计算机游戏，它们模拟了多个人物和/或移动对象的实时活动。\n\n在 Java 架构下，Java 虚拟机（`JVM`）将为你提供 Java\
  \ 应用程序创建和管理多个线程所需的所有帮助。请阅读后续章节获取教程示例。\n\nJava 教程 - Herong 的教程示例\n\n∟执行线程与多线程 Java\
  \ 程序\n\n### \"Thread\" 类 - 通过 Thread 子类创建线程对象\n\n本节提供了一个教程示例，介绍如何通过扩展 `Thread` 类的自定义类来创建新线程。你需要在自己的类中重写\
  \ `run()` 方法。\n\n在 Java 程序中创建新线程的第一种方法是：\n\n* 继承 `Thread` 类创建一个新类。\n* 在新类中定义 `run()`\
  \ 方法，以重写 `Thread` 类中的 `run()` 方法。\n* 实例化新类的新对象。\n* 在新对象上调用 `start()` 方法。\n\n这里是一个展示如何这样操作的教程示例程序：\n\
  \n```\n /* HelloThread.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nclass HelloThread extends Thread {\n   public static void main(String[] a)\
  \ {\n      HelloThread t = new HelloThread();\n      t.start();\n      System.out.println(\"\
  Hello world! - From the main program.\");\n   }\n   public void run() {\n      System.out.println(\"\
  Hello world! - From a thread.\");\n      try {\n         sleep(1000*60*60);\n  \
  \    } catch (InterruptedException e) {\n         System.out.println(\"Interrupted.\"\
  );\n      }\n   }\n}\n```\n\n输出：\n\n```\n Hello world! - From the main program.\n\
  Hello world! - From a thread.\n```\n\n关于此程序你应该了解的几点：\n\n* 该程序在打印这些消息后将运行（实际上是睡眠）大约小时。因此，你可能需要按下\
  \ `Ctrl-C` 来终止程序。\n* 程序中实际上有两个线程在运行。第一个是主线程，执行 `main()` 方法中的所有语句。第二个是由由 `t.start()`\
  \ 语句启动的子线程。子线程执行 `run()` 方法中的所有语句。\n* 注意控制台上打印出的消息顺序。它告诉我们，子线程在被主线程启动后，运行其第一条语句花费了稍微长一点。\n\
  * 多线程程序在所有线程都到达执行终点之前不会终止。在我们的示例中，主线程在打印消息后将结束。但子线程需要大约一小时来执行 `sleep()` 调用语句。因此，在子线程结束之前，整个程序都不会终止。\n\
  * `Thread` 类中的 `run()` 方法是空的，所以如果你想让线程做一些工作，你需要重写 `run()` 方法。\n\nJava 教程 - Herong\
  \ 的教程示例\n\n∟执行线程与多线程 Java 程序\n\n### \"Runnable\" 接口 - 通过 Runnable 对象创建线程对象\n\n本节提供了一个教程示例，介绍如何使用\
  \ `Thread` 类和 Runnable 对象创建新线程，这些对象是通过实现 `Runnable` 接口的类创建的。\n\n创建新线程的第二种方法是：\n\n\
  * 在你的类中实现 `Runnable` 接口。\n* 在你的类中实现 `Runnable` 接口中定义的 `run()` 方法。\n* 实例化你类类的 Runnable\
  \ 对象。\n* 使用指定的 Runnable 对象实例化一个 `Thread` 类的线程对象。\n* 在新对象上调用 `start()` 方法。\n\n这里是一个展示如何这样操作的教程示例程序：\n\
  \n```\n /* HelloRunnable.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nclass HelloRunnable implements Runnable {\n   public static void main(String[]\
  \ a) {\n      HelloRunnable r = new HelloRunnable();\n      Thread t = new Thread(r);\n\
  \      t.start();\n      System.out.println(\"Hello world! - From the main program.\"\
  );\n   }\n   public void run() {\n      System.out.println(\"Hello world! - From\
  \ a thread.\");\n      try {\n         Thread.sleep(1000*60*60);\n      } catch\
  \ (InterruptedException e) {\n         System.out.println(\"Interrupted.\");\n \
  \     }\n   }\n}\n```\n\n输出：\n\n```\n Hello world! - From the main program.\nHello\
  \ world! - From a thread.\n```\n\n注意：\n\n* 程序的行为与之前的程序 `HelloThread` 相同。\n* `Thread`\
  \ 对象 `t` 是通过特殊的 `Thread` 构造函数创建的，它接受一个 `Runnable` 对象作为输入。如果你启动一个这样创建的 `Thread` 对象，`Runnable`\
  \ 对象的 `run()` 方法将作为一个新线程执行。\n* 由于我们的类不再继承 `Thread` 类，我们需要通过在类名前加上 `Thread` 来显式地调用\
  \ `sleep()`。\n\n你可能在想为什么我们需要创建新线程的第二种方法，因为它似乎没有第一种方法直观？答案是 Java 类不能继承两个不同的类。所以，如果你处于需要通过扩展现有类来继承该类的某些特性，并且同时又想让新类可以作为线程执行，那么你就必须使用第二种方法在你的类中实现\
  \ `Runnable` 接口。\n\nJava 教程 - Herong 的教程示例\n\n∟执行线程与多线程 Java 程序\n\n### 多线程共享的 CPU\
  \ 执行时间\n\n本节提供了一个教程示例，介绍如何测量分配给不同 `Priorities`（优先级）线程的 CPU 执行时间。\n\n问题：如果单个 CPU\
  \ 系统上运行着 5 个应用程序，且每个运行的应用程序中都有 5 个线程在运行，那么这 25 个线程是如何在一个 CPU 上同时执行的？\n\n答案是，这 25\
  \ 个线程在任何时刻并不是同时执行的。它们轮流执行以共享单个 CPU 的处理时间。下面的简单示例说明了处理时间如何被多个线程共享。\n\n假设：\n\n* 操作系统设计为轮流执行运行中的应用程序。每次轮转，选中的应用程序执行\
  \ 1 毫秒。\n* 如果一个应用程序被执行，它将轮流执行运行中的线程。每次轮转，选中的线程执行 0.01 毫秒。\n* 在 5 个运行的应用程序中每个都运行着\
  \ 5 个线程。\n* 在 CPU 中切换线程和应用程序花费的时间可以忽略不计。\n\n如果我们让系统运行 0.1 秒，每个应用程序将执行 20 次，总耗时为\
  \ 20 毫秒，每个线程将执行 400 次，总耗时为 4 毫秒。因此，在极短的时间（1/10 秒），所有应用程序中的所有线程将执行大约 4 毫秒。这会让你觉得所有线程都是同时执行的。现在让我们使用下面的程序来看看每个线程是如何获取其\
  \ CPU 时间份额的：\n\n\n\n\n```java\n /* RacingThread.java\n * Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n */\nimport java.util.*;\nclass RacingThread extends Thread\
  \ {\n   private static final long s_maxi = 1000000; // 步数最大\n   private static final\
  \ int t_maxi = 5; // 线程数最大\n   private static long[] t_done = new long[t_maxi];\n\
  \   private static int t_last = -1; // 上一个线程的索引\n   private int t_indx;\n   private\
  \ static int n_prime = 0;\n   public static void main(String[] a) {\n      System.out.println(\"\
  Priority: (min, norm, max) = (\"+\n         Thread.MIN_PRIORITY+\", \"+\n      \
  \   Thread.NORM_PRIORITY+\", \"+\n         Thread.MAX_PRIORITY+\")\");\n      long\
  \ start_time = new Date().getTime();\n      for (int i=0; i<t_maxi; i++) {\n   \
  \      RacingThread t = new RacingThread();\n         if (i==0) t.setPriority(Thread.MIN_PRIORITY);\n\
  \         else if (i==1) t.setPriority(Thread.NORM_PRIORITY);\n         else t.setPriority(Thread.MAX_PRIORITY);\n\
  \         t.start();\n      }\n      System.out.print(\"Threads: \");\n      for\
  \ (int i=0; i<t_maxi; i++) {\n         System.out.print(i+\" \");\n      }\n   \
  \   System.out.print(\"Time\");\n      while(true) {\n         try {\n         \
  \   sleep(100);\n         } catch (InterruptedException e) {\n            System.out.println(\"\
  Interrupted.\");\n         }\n         System.out.print(\"\\n  Steps: \");\n   \
  \      for (int i=0; i<t_maxi; i++) {\n            System.out.print(t_done[i]+\"\
  \ \");\n         }\n         System.out.print((new Date()).getTime()-start_time);\n\
  \      }\n   }\n   public RacingThread() {\n      t_last++;\n      t_indx = t_last;\n\
  \      t_done[t_indx] = 0;\n   }\n   public void run() {\n      for (long s=0; s<s_maxi;\
  \ s++) {\n         int n = 0;\n         for (int i=3; i<100; i++) {// 让其忙碌一段时间\n\
  \            boolean is_prime = true;\n            for (int j=2; j<i; j++) {\n \
  \              is_prime = (i%j>0);\n               if (!is_prime) break;\n     \
  \       }\n            if (is_prime) n++;\n         }\n         n_prime = n;\n \
  \        t_done[t_indx] = s;\n      }\n   }\n}\n```\n\n### 程序设计说明：\n\n*   创建了 5\
  \ 个子线程，在每一步中执行相同的工作。步骤重复 1000000 次。\n*   该工作的内容是统计 100 以下有多少个质数。\n*   第一个子线程被赋予最低优先级，第二个子线程被赋予中等优先级，其余\
  \ 3 个子线程被赋予最高优先级。\n*   每个子线程在每一步结束时记录其到为止完成的步数。\n*   主线程反复检查记录数组，以查看每个子线程的执行进度。\n\
  *   主线程每次检查记录数组时，还会报告以毫秒为单位经过的时间。\n*   每个子线程通过构造函数并借助静态变量 `t_last` 获得一个索引号进行标识。\n\
  *   静态变量 `n_prime` 由所有 5 个子线程反复更新为相同的值。我没有提供打印 `n_prime` 值的语句来验证其准确性，但我在另一个程序中检查了我的质数计数算法的正确性。\n\
  *   主线程永远不会结束。你需要按 `Ctrl-C` 来终止程序。\n\n请查看下一节关于该程序的执行输出。\n\nJava 教程 - Herong 的教程示例\n\
