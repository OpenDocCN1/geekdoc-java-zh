  \   Tuesday\");\n      }\n      out.println(\"   Wednesday\");\n\n      out.println(\"\
  \\\"break\\\" statement in a two-level block:\");\n      boolean isPrime;\n    \
  \  int i = 3;\n      int operations = 1;\n\n      blockOuter: while (true) { //\
