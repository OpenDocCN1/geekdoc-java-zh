  8+2 = 10\n\nherong> java LambdaCalculator 8 - 2\nLambdaCalculator$1@cf9800\n8-2\
  \ = 6\n\nherong> java LambdaCalculator 8 \"*\" 2\nLambdaCalculator$1Multiply@cf9800\n\
  8*2 = 16\n```\n\n以下是我从输出中学习到的内容：\n\n*   lambda 表达式 `(a,b) -> {return a+b;}` 确实定义了一个名为\
