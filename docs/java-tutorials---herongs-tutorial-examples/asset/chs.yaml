  \ Runtime 对象方法\n\n### Runtime.getRuntime() - 获取 Runtime 对象\n\n本节描述了系统 `Runtime`\
  \ 对象以及通过 `Runtime.getRuntime()` 方法从 JVM 获取它。\n\n当 Java 应用程序在 JVM 内部运行时，JVM 为程序提供一个\
  \ `Runtime` 类实例。Java 程序可以使用此 Runtime 实例与 JVM 以及支持的操作系统进行交互。\n\n`Runtime` 实例上有几种有趣的类型方法：\n\
  \n* 获取有关 JVM 的动态信息，如 `freeMemory()`。\n* 在操作系统级别启动单独进程，如 `exec()`。\n* 与 JVM 的关闭序列进行交互，如\
  \ `addShutdownHook()`。\n* 强制 JVM 执行垃圾回收工作，如 `gc()`。\n\n`Runtime` 类是一个特殊类。它代表运行在\
  \ JVM 内部的 Java 应用程序的环境。你不能在应用程序中创建 `Runtime` 类的实例。你只能通过调用 `Runtime.getRuntime()`\
  \ 方法获取 JVM 为你的应用程序创建的实例。\n\n因此，以下代码是错误的：\n\n```java\n Runtime rt = new Runtime();\n\
  \   rt.gc();\n```\n\n以下代码是正确的：\n\n```java\n Runtime rt = Runtime.getRuntime();\n\
  \   rt.gc();\n```\n\nJava 教程 - Herong 的教程示例\n\n∟系统属性和 Runtime 对象方法\n\n### freeMemory()\
  \ - 获取 JVM 空闲内存信息\n\n本节提供了一个教程示例，介绍了如何使用 `Runtime` 类的 `freeMemory()`、`totalMemory()`\
  \ 和 `maxMemory()` 来获取 JVM 总内存和空闲内存信息。\n\nJava 中有两个与内存管理相关的值：\n\n* **空闲内存 (Free Memory)**：可供应用程序使用的字节数。\n\
  \n\n\n\n\n- **总内存**：分配给应用程序的内存字节数。\n- **最大内存**：可以分配给应用程序的最大字节数。\n\n在 `Runtime` 类中有一个方法可以用来获取这些值中的每一个。以下程序展示了如何正确地使用这些方法：\n\
  \n```java\n /* FreeMemory.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\npublic class FreeMemory {\n   private static long[] fm = new long[5];\n  \
  \ private static long[] tm = new long[5];\n   private static long[] mm = new long[5];\n\
  \   private static long[] um = new long[5];\n   public static void main(String[]\
  \ a) {\n      Runtime rt = Runtime.getRuntime();\n      getMemoryInfo(rt,0);\n \
  \     getMemoryInfo(rt,1);\n      getMemoryInfo(rt,2);\n      getMemoryInfo(rt,3);\n\
  \      getMemoryInfo(rt,4);\n      printMemoryInfo(rt,0);\n      printMemoryInfo(rt,1);\n\
  \      printMemoryInfo(rt,2);\n      printMemoryInfo(rt,3);\n      printMemoryInfo(rt,4);\n\
  \      for (int i=0; i<5; i++) {\n         System.out.println(\"Get memory info\
  \ - step = \"+i);\n         System.out.println(\"   Free memory = \"+fm[i]);\n \
  \        System.out.println(\"   Total memory = \"+tm[i]);\n         System.out.println(\"\
  \   Maximum memory = \"+mm[i]);\n         System.out.println(\"   Memory used =\
  \ \"+um[i]);\n      }\n   }\n   public static void getMemoryInfo(Runtime rt, int\
  \ i) {\n      fm[i] = rt.freeMemory();\n      tm[i] = rt.totalMemory();\n      mm[i]\
  \ = rt.maxMemory();\n      um[i] = tm[i]-fm[i];\n   }\n   public static void printMemoryInfo(Runtime\
  \ rt, int i) {\n      long fm = rt.freeMemory();\n      long tm = rt.totalMemory();\n\
  \      long mm = rt.maxMemory();\n      System.out.println(\"Print memory info -\
  \ step = \"+i);\n      System.out.println(\"   Free memory = \"+fm);\n      System.out.println(\"\
  \   Total memory = \"+tm);\n      System.out.println(\"   Maximum memory = \"+mm);\n\
  \      System.out.println(\"   Memory used = \"+(tm-fm));\n   }\n}\n```\n\n这个程序看起来可能让人困惑：\n\
  \n- 为什么我需要两个不同的方法来获取内存信息？\n- 为什么方法被重复调用了 5 次？\n- 为什么 `getMemoryInfo()` 方法的打印语句没有紧跟在方法调用之后？\n\
  \n你需要阅读这个程序的输出来回答这些问题：\n\n```\n Print memory info - step = 0\n   Free memory = 1777568\n\
