  \n```java\n /* WeekDayCounter.java\n * Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n */\nimport java.util.*;\nclass WeekDayCounter extends Thread {\n \
  \ private static final int s_year = 2000; // 起始年份\n  private static int y_maxi =\
