  \n通过观察输出结果，我们可以看到：\n\n- 在没有任何同步机制的情况下，执行 `doTransaction1()`，我们可以看到每个账户都损坏了。例如，`BankingMain`\
  \ 类报告的 0 号账户余额为 1051.87，但它实际上应该是 465.73。\n\n- 使用同步方法 `doTransaction2()`，`BankingMain`\
  \ 类中的余额保持了完全正确，但性能大幅下降。在没有同步的情况下，`BankingThread` 执行了约 444 次交易。\n\n- 通过将同步从方法级移动到语句级\
  \ `doTransaction3()`，性能略有提升，从 169 次增加到 172 次。\n\n- 通过将中心锁 `o_lock` 替换为每个账户独立的锁 `a_lock[i]`，性能大幅提升，从\
  \ 172 次增加到 281 次。使用中心锁时，当一个线程运行同步块时，我们会让所有线程等待；使用独立锁时，只有当线程恰好操作同一个账户时，才会让它们等待。这种情况发生的概率大约是账户数量的倒数。随着账户数量的增加，`BankingThread`\
  \ 的表现会越来越好。\n\n**练习**：假设以下类用于多线程程序：\n\n```\npublic class C {\n   public static synchronized\
