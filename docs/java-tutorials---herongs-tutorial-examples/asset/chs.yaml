  \  static void show(InterfaceA a) {\n      System.out.println(a.toString());\n \
  \  }\n   public static void main(String[] arg) {\n      // show(a->b->c->d->\"Hello\"\
  );\n\n      // InterfaceD iD = d->\"Hello\";\n      InterfaceD iD = new InterfaceD()\
  \ {\n         public Object methodD(Object o) {return \"Hello\";}\n      };\n\n\
  \      // InterfaceC iC = c->iD;\n      InterfaceC iC = new InterfaceC() {\n   \
  \      public InterfaceD methodC(Object o) {return iD;}\n      };\n\n      // InterfaceB\
  \ iB = b->iC;\n      InterfaceB iB = new InterfaceB() {\n         public InterfaceC\
  \ methodB(Object o) {return iC;}\n      };\n\n      // InterfaceA iA = a->iB;\n\
  \      InterfaceA iA = new InterfaceA() {\n         public InterfaceB methodA(Object\
  \ o) {return iB;}\n      };\n\n      show(iA);\n   }\n   interface InterfaceD {\n\
  \      Object methodD(Object o);\n   }\n   interface InterfaceC {\n      InterfaceD\
  \ methodC(Object o);\n   }\n   interface InterfaceB {\n      InterfaceC methodB(Object\
  \ o);\n   }\n   interface InterfaceA {\n      InterfaceB methodA(Object o);\n  \
  \ }\n}\n```\n\n# Java 教程 - Herong 的教程示例\n\n# Lambda 表达式与方法引用\n\n### 作为方法引用的 Lambda\
  \ Expression\n\n本节描述了什么是方法引用，它是一种特殊 Lambda 表达式的简写形式，其体部只包含一个静态方法调用。\n\n**什么是方法引用？**\
  \ 方法引用是特殊 Lambda 表达式的简写形式，其体部只包含一个静态方法调用。当然，静态方法的参数列表和返回值应该与基础接口匹配。\n\n以下是方法引用的语法：\n\
  \n```\n class_name :: method_name\n```\n\n上述方法引用语法实际上是以下 Lambda 表达式语法的简写形式：\n\n\
  ```\n (parameter_list) -> class_name.method_name(actual_parameter_list)\n```\n\n\
  对比两种语法，我发现：\n\n*   方法引用中省略了 \"parameter_list\"（参数列表）。编译器可以通过查看基础接口中唯一的抽象方法来获取它们。\n\
  *   方法引用中省略了 \"->\"。因为 `::`（双冒号）标记是在方法引用中引入的，用作方法引用的标识。\n*   使用 `class_name` 和 `method_name`\
  \ 通过方法引用来标识要调用的方法。\n*   方法引用中省略了 \"actual_parameter_list\"（实际参数列表）。编译器会自动将 `parameter_list`\
  \ 中的所有参数按相同顺序传递给 `actual_parameter_list`。\n\n以下是一个方法引用的示例：\n\n```\n ClassC :: methodM\n\
  ```\n\n编译器将像处理下面的 Lambda 表达式一样处理上述方法引用：\n\n```\n (TypeA a, TypeB b) -> ClassC.methodM(a,\
  \ b)\n```\n\n当然，我们假设基础接口必须具有以下抽象方法：\n\n```\n public TypeC c methodI(TypeA a, TypeB\
  \ b);\n```\n\n请参下一节使用方法引用的示例程序。\n\n# Java 教程 - Herong 的教程示例\n\n# Lambda 表达式与方法引用\n\
  \n### 方法引用示例 - LambdaMethodRefernce.java\n\n本节提供了一个如何使用方法引用的教程示例。\n\n为了玩转方法引用，让我们尝试将\
  \ Lambda 表达式示例程序 `LambdaCalculator.java` 转换为使用方法引用。以下是我的版本：\n\n```java\n /* LambdaMethodRefernce.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass LambdaMethodRefernce\
  \ {\n   interface Operation {\n      int operate(int a, int b);\n   }\n   public\
  \ static int add(int a, int b) {\n      return a+b;\n   }\n   public static int\
  \ subtract(int a, int b) {\n      return a-b;\n   }\n   public static int multiply(int\
  \ a, int b) {\n      return a*b;\n   }\n   public int calculate(int a, int b, Operation\
  \ o) {\n      System.out.println(o.toString());\n      return o.operate(a, b);\n\
  \   }\n\n   public static void main(String[] arg) {\n      int x = 1;\n      String\
  \ s = \"+\";\n      int y = 2;\n      if (arg.length>0) x = Integer.parseInt(arg[0]);\n\
  \      if (arg.length>1) s = arg[1];\n      if (arg.length>2) y = Integer.parseInt(arg[2]);\n\
  \n      LambdaMethodRefernce c = new LambdaMethodRefernce();\n      if (s.equals(\"\
  +\"))\n         System.out.println(x+s+y+\" = \"\n            +c.calculate(x,y,LambdaMethodRefernce::add));\n\
  \      else if (s.equals(\"-\"))\n         System.out.println(x+s+y+\" = \"\n  \
  \          +c.calculate(x,y,LambdaMethodRefernce::subtract));\n      else if (s.equals(\"\
  *\"))\n         System.out.println(x+s+y+\" = \"\n            +c.calculate(x,y,LambdaMethodRefernce::multiply));\n\
  \   }\n}\n```\n\n在 JDK 8 中编译并运行示例程序。你将得到如下结果：\n\n```\n1+2 = 3\n1-2 = -1\n1*2 = 2\n\
  ```\n\n输出证实了方法引用就是 Lambda 表达式。\n\nJava 教程 - Herong 的教程示例\n\n# Lambda 表达式与方法引用\n\n\
  ### Lambda 表达式流流水线\n\n本节提供了一个如何使用方法引用的教程示例。`LambdaStream.java` 使用日期作为流并过滤掉“13 号星期五”。\n\
  \n使用 Lambda 表达式的最佳位置可能是流操作。请下面的示例程序 `LambdaStream.java`：\n\n```java\n /* LambdaStream.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nimport java.util.*;\n\
  import java.text.*;\nimport java.util.stream.Stream;\nclass LambdaStream {\n   public\
  \ static void main(String[] arg) {\n      Calendar today = new GregorianCalendar();\n\
  \      Stream\n         .iterate(today, d->{\n            Calendar n = (Calendar)d.clone();\n\
  \            n.add(Calendar.DATE,1);\n            return n;\n          })\n    \
  \     .filter(d->d.get(Calendar.DATE)==13\n            && d.get(Calendar.DAY_OF_WEEK)==Calendar.FRIDAY\n\
  \          )\n         .limit(10)\n         .map(d->d.getTime())\n         .forEach(d->System.out.println(\n\
  \            new SimpleDateFormat(\"dd-MMM-yyyy\").format(d)\n          ));\n  \
  \ }\n}\n```\n\n`LambdaStream.java` 使用了 JDK 8 引入的 `Stream` 接口的多个流水线操作：\n\n*   流水线由五个操作组成：`iterate()`、`filter()`、`limit()`、`map()`\
  \ 和 `forEach()`。\n*   在流水线的开头，使用 `iterate()` 创建一个新的 `Stream` 对象，以 `Calendar` 对象\
  \ `today` 为第一个元素，并使用 Lambda 表达式生成下一个元素。\n*   在 `iterate()` 中使用的 Lambda 表达式 `d->{\
  \ Calendar n = (Calendar)d.clone(); n.add(Calendar.DATE,1); return n; }` 返回了从给定\
  \ `Calendar` 对象克隆的第二天对象。\n*   流水线的下一个操作是 `filter()`，它从流中移除不符合给定准标准的元素。\n*   在 `filter()`\
  \ 中使用的 Lambda 表达式 `d->d.get(Calendar.DATE)==13 && d.get(Calendar.DAY_OF_WEEK)==Calendar.FRIDAY`\
  \ 如果给定的 `Calendar` 对象是 13 号星期五，则返回 true。\n*   流水线的下一个操作是 `limit()`，它在指定数量的元素后直接结束流。\n\
  *   流水线的下一个操作是 `map()`，它将所有元素从一种对象类型转换为另一种对象类型。\n*   在 `map()` 中使用的 Lambda 表达式 `d->d.getTime()`\
  \ 从给定的 `Calendar` 对象返回一个 `Date` 对象。\n\n\n\n\n\n*   在流水线的末尾，使用 `forEach()` 对每个元素应用最终操作。\n\
  *   `forEach()` 中使用的 Lambda 表达式 `\"d->System.out.println( new SimpleDateFormat(\"\
  dd-MMM-yyyy\").format(d) )\"` 会为每个给定的 `Date` 对象在控制台中打印日期。\n\n总的来说，该程序正在尝试寻找下一个 10\
  \ 个“13 号星期五”日期。\n\n```\n13-Mar-2020\n13-Nov-2020\n13-Aug-2021\n13-May-2022\n13-Jan-2023\n\
  13-Oct-2023\n13-Sep-2024\n13-Dec-2024\n13-Jun-2025\n13-Feb-2026\n```\n\nJava 教程\
