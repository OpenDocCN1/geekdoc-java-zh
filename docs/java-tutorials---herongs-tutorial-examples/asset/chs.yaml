  Total # of years = \"+sum);\n  }\n  public WeekDayCounter() {\n    t_last++;\n \
  \   t_indx = t_last;\n    t_done[t_indx] = false;\n    t_year[t_indx] = 0;\n   \
  \ t_logs[t_indx] = 0;\n  }\n  public void run() {\n    GregorianCalendar c = new\
  \ GregorianCalendar();\n    for (int y=s_year; y<s_year+y_maxi; y++) {\n      t_year[t_indx]\
  \ = y;\n      if (y_days[y-s_year]==0) {\n        y_days[y-s_year] = -1;\n     \
