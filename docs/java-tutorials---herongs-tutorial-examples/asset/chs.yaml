  \ more src\\com.herongyang.base\\com\\herongyang\\point\\Point.java\n\n/* Geometry.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\npackage com.herongyang.geometry;\n\
  import com.herongyang.point.Point;\nimport com.herongyang.line.Line;\npublic class\
  \ Geometry {\n   public static double p2p(double a1, double a2, double a3,\n   \
  \   double b1, double b2, double b3) {\n      Point a = new Point(a1,a2,a3);\n \
  \     Point b = new Point(b1,b2,b3);\n      return a.distance(b);\n   }\n   public\
  \ static double p2l(double p1,double p2, double p3,\n      double a1, double a2,\
  \ double a3, double b1, double b2, double b3) {\n      Point p = new Point(p1,p2,p3);\n\
  \      Point a = new Point(a1,a2,a3);\n      Point b = new Point(b1,b2,b3);\n  \
  \    Line l = new Line(a,b);\n      return l.distance(p);\n   }\n   public static\
  \ void main(String[] args) {\n      double p2p = p2p(1,0,0, 0,1,0);\n      System.out.println(\n\
  \         \"Point to point distance: (1,0,0) and (0,1,0) = \"+p2p);\n      double\
  \ p2l = p2l(0,0,1, 0,0,0, 1,1,1);\n      System.out.println(\n         \"Point to\
  \ line distance: (0,0,1) and (0,0,0)-(1,1,1) = \"+p2l);\n   }\n}\n```\n\n编译 `com.herongyang.math`\
