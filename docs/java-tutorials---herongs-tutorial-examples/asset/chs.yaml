  \ 7\nEnding BThread 8\nThreadGroup name = system\n   Has parent thread group = false\n\
  \   # of active threads = 6\n   Thread name = Reference Handler\n   Thread name\
  \ = Finalizer\n   Thread name = Signal Dispatcher\n   Thread name = Attach Listener\n\
