  > 使用 com.herongyang.math 模块的应用\n\n### 结论：\n\n*   Java 模块是在 Java 9 中引入的。\n*   Java\
  \ 模块是一种比 Java 包层级更高的 Java 代码及文件聚合机制。\n*   Java 模块使用模块描述符 `module-info.java` 来声明其名称、模块依赖和包导出列表。\n\
  *   Java 模块使用 `JMOD` 文件来存储模块类代码和相关文件（例如法律声明）。\n*   `jmod` 命令设计用于创建和管理 `JMOD` 文件。\n\
  *   Java 模块也可以使用 `JAR` 文件仅存储模块类代码。但模块 `JAR` 文件无法存储非类文件。\n*   Java 模块可以嵌入到自定义的 `JRE`\
  \ 中以帮助分。\n*   `javac` 命令支持 `--add-modules` 和 `--module-path` 来解析模块相关的类型引用。\n*  \
  \ 模块 `JAR` 文件或 `JMOD` 文件可以用于 `javac` 模块路径。\n*   `java` 命令支持 `--add-modules` 和 `--module-path`\
  \ 来从 Java 模块加载所需的类。\n*   只有模块 `JAR` 文件可以用于 `java` 模块路径。模块 `JMOD` 文件不能在运行时使用。\n\n\
  Java 教程 - Herong 的教程示例\n\n∟ Java 模块 - Java 包聚合\n\n### 什么是 Java 模块\n\n本节描述了什么是 Java\
  \ 模块 —— 一种比 Java 包层级更高的 Java 代码和资源聚合机制。\n\n**什么是 Java 模块**？Java 模块是一种比 Java 包层级更高的\
  \ Java 代码及相关文件聚合机制。\n\nJava 模块包含 2 个组件：\n\n*   Java 模块代码 - 包含名为 `module-info.java`\
  \ 的模块描述符文件和 Java 包列表。\n*   Java 模块归档 - 包含 Java 模块代码以及其他 5 类相关资源文件：原生库、原生命令、配置、头文件和法律声明。\n\
  \nJava 模块在 Java 9 中引入，其目标是：\n\n*   提供更好的代码依赖管理 - 每个模块必须显式地声明其依赖的模块。\n*   提供更强的代码封装\
  \ - 每个模块都维护一个导出的 Java 包列表。其他模块无法访问 Java 模块中未导出的包。\n*   提供可扩展的 JRE（Java 运行环境） - Java\
  \ 平台现在被划分为多个小模块。你可以只选择应用程序所需的模块来构建一个较小的自定义 `JRE`。\n*   提供更好的部署打包 - 你可以将运行应用程序所需的所有文件放在单个模块归档文件中。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟ Java 模块 - Java 包聚合\n\n### 模块描述符 - module-info.java\n\
  \n本节描述了什么是 Java 模块 —— 一种比 Java 包层级更高的 Java 代码和资源聚合机制。\n\n**什么是 Java 模块**？Java 模块是一种比\
  \ Java 包层级更高的 Java 代码及相关文件聚合机制。\n\nJava 模块包含 2 个组件：\n\n*   Java 模块代码 - 包含名为 `module-info.java`\
  \ 的模块描述符文件和 Java 包列表。\n*   Java 模块归档 - 包含 Java 模块代码以及其他 5 类相关资源文件：原生库、原生命令、配置、头文件和法律声明。\n\
  \nJava 模块在 Java 9 中引入，其目标是：\n\n*   提供更好的代码依赖管理 - 每个模块必须显式地声明其依赖的模块。\n*   提供更强的代码封装\
  \ - 每个模块都维护一个导出的 Java 包列表。其他模块无法访问 Java 模块中未导出的包。\n*   提供可扩展的 JRE（Java 运行环境） - Java\
  \ 平台现在被划分为多个小模块。你可以只选择应用程序所需的模块来构建一个较小的自定义 `JRE`。\n*   提供更好的部署打包 - 你可以将运行应用程序所需的所有文件放在单个模块归档文件中。\n\
  \n`module-info.java` 文件定义了模块的名称、依赖和导出包。\n\n### 创建 \"Hello World!\" 模块\n\n本节提供了如何创建一个简单模块的教程，且包含了模块编译和执行。\n\
  \n*   模块名称：`com.herongyang`\n*   包名：`com.herongyang.greeting`\n*   主类名：`Hello`\n\
  \n这里是源码树结构：\n\n```\nherong> tree /F \\src\n|---com.herongyang\n    |   module-info.java\n\
  \    |\n    |---com\n        |---herongyang\n            |---greeting\n        \
  \            Hello.java\n```\n\n这里是模块中的 2 个源码：\n\n```\nherong> more .\\src\\com.herongyang\\\
  module-info.java\nmodule com.herongyang {\n}\n\nherong> more .\\src\\com.herongyang\\\
  com\\herongyang\\greeting\\Hello.java\npackage com.herongyang.greeting;\npublic\
  \ class Hello {\n   public static void main(String[] a) {\n      System.out.println(\"\
  Hello world! - From Module\");\n   }\n}\n```\n\n这里是我编译模块并运行主类的操作：\n\n```\nherong>\
  \ javac --module com.herongyang --module-source-path \\src \\\n   -d \\cls\n\nherong>\
  \ java --module-path \\cls \\\n   --module com.herongyang/com.herongyang.greeting.Hello\n\
  \nHello world! - From Module\n```\n\n我从这个教程中学到的：\n\n*   源码文件应该放在与模块名同名的目录下。\n* \
  \  模块描述符 `module-info.java` 应该放在模块的根目录下，所有包目录之上。\n*   如果你只使用 `java.base` 模块，则不需要在\
  \ `module-info.java` 中声明任何依赖。\n*   如果没有其他模块使用该模块，则不需要在 `module-info` 中声明导出列表。\n\
  *   包类源码 `Hello.java` 中特殊代码。\n*   使用 `javac --module ... --module-source-path ...`\
  \ 来编译模块中的所有源码。\n*   可以使用 `java --module-path ... --module ...` 来启动模块中的主类。\n*   类名需要加上\
  \ `module_name/` 前缀才能作为模块类启动。\n\n\n\n\n\n```\nherong> java --module com.herongyang/com.herongyang.greeting.Hello\
  \ \\\n   --module-path .\\cls\n\nError occurred during initialization of boot layer\n\
  java.lang.module.FindException: Module com.herongyang not found\n```\n\n模块文件的目录结构是向后兼容的。你仍然可以将模块中的任何类作为非模块类启动：\n\
  \n```\nherong> java -classpath .\\cls\\com.herongyang \\\n   com.herongyang.greeting.Hello\n\
  \nHello world! - From Module\n```\n\n# Java 教程 - Herong 教程示例\n\n### ∟Java 模块 - Java\
  \ 包包聚合](#part0112.xhtml)\n\n## \"jmod create\" - 创建 JMOD 文件\n\n本节提供了一个教程示例，说明了如何使用\
  \ `jmod create` 命令创建一个 JMOD 文件，用于存储 Java 模块的所有类文件及其相关文件。\n\n在编译 Java 模块代码后，你可以使用\
  \ `jmod create` 命令将所有模块类和其他相关文件打包成单个 JMOD 文件。\n\n根据上一个教程，我已将 `com.herongyang` 模块的所有类文件编译在\
  \ `.\\cls` 目录树中。现在我想在 `.\\license` 子目录下创建一个许可文件：\n\n```\nherong> more .\\license\\\
  copyright.txt\n\nCopyright (c) HerongYang.com, All Rights Reserved.\n```\n\n要创建\
  \ JMOD 文件，我使用了以下 `jmod` 命令：\n\n```\nherong> jmod create --class-path .\\cls\\com.herongyang\n\
  \   --legal-notices .\\license com.herongyang.jmod\n\nherong> jmod list com.herongyang.jmod\n\
  classes/module-info.class\nclasses/com/herongyang/greeting/Hello.class\nlegal/copyright.txt\n\
  \nherong> jmod describe com.herongyang.jmod\ncom.herongyang\nrequires java.base\
  \ mandated\ncontains com.herongyang.greeting\n```\n\n`jmod` 命令将所有类文件存储在 `.\\classes`\
  \ 子目录中，并将法律声明存储在 `.\\legal` 子目录中。如果你包含了其他类型的文件，将创建其他子目录。有关关于 JMOD 文件结构和 `jmod` 命令的更多信息，请参阅\
  \ [herongyang.com/Java-Tools](https://www.herongyang.com/Java-Tools/) 上的《Java Tools\
  \ Tutorials - Herong's Tutorial Examples》书籍。\n\n# Java 教程 - Herong 教程示例\n\n### ∟Java\
  \ 模块 - Java 包包聚合](#part0112.xhtml)\n\n## ∟\"jlink --add-modules\" - 创建自定义 JRE\n\n\
  本节提供了一个教程示例，说明了如何使用 `jlink --add-modules` 命令为你自己的 Java 模块创建一个自定义 JRE。\n\n当模块文件封装在\
  \ JMOD 文件 `com.heronyang.jmod` 中，你可以使用 `jlink` 命令仅为该 Java 模块创建一个自定义 JRE：\n\n```\n\
  herong> jlink --strip-debug --add-modules com.herongyang\n   --module-path com.herongyang.jmod\
  \ --output .\\helloJRE\n   --launcher hello=com.herongyang/com.herongyang.greeting.Hello\n\
  \nherong> .\\helloJRE\\bin\\hello\nHello world! - From Module\n```\n\n酷酷。我使用 Java\
  \ 模块编写了一个简单的 Java 应用程序，并创建了一个带有启动脚本的自定义 JRE 来运行该应用程序！\n\n使用的 `jlink` 命令选项如下：\n\n\
  * `--strip-debug` - 开启标志以移除输出 JRE 中的调试代码。\n* `--add-modules com.herongyang` - 指定要包含在输出\
  \ JRE 中的哪些 Java 模块。\n* `--module-path com.herongyang.jmod` - 指定查找 Java 模块的位置。\n\
  * `--output .\\helloJRE` - 指定存储输出 JRE 的子目录。\n* `--launcher hello=com.herongyang/com.herongyang.greeting.Hello`\
  \ - 指定新的脚本名称以及使用该脚本启动的模块类。脚本文件将位于输出 JRE 的 `.\\bin` 子目录中。\n\n以下是输出 JRE 目录树的结构：\n\n\
  ```\nherong> tree /F helloJRE\n.\\HELLOJRE\n|   release\n|\n|---bin\n|   |   hello\n\
  |   |   hello.bat\n|   |   java.dll\n|   |   java.exe\n|   |   javaw.exe\n|   |\
  \   jimage.dll\n|   |   jli.dll\n|   |   keytool.exe\n|   |   msvcp120.dll\n|  \
  \ |   msvcr120.dll\n|   |   net.dll\n|   |   nio.dll\n|   |   verify.dll\n|   |\
  \   zip.dll\n|   |\n|   |---server\n|           jvm.dll\n|\n|---conf\n|   |   net.properties\n\
  |   |\n|   |---security\n|       |   java.policy\n|       |   java.security\n| \
  \      |\n|       |---policy\n|           |   README.txt\n|           |\n|     \
  \      |---limited\n|           |       default_local.policy\n|           |    \
  \   default_US_export.policy\n|           |       exempt_local.policy\n|       \
  \    |\n|           |---unlimited\n|                   default_local.policy\n| \
  \                  default_US_export.policy\n|\n||---include\n|   |   classfile_constants.class\n\
  ```\n\n\n\n\n\n```\nherong> javac -classpath .\\cls\\com.herongyang Greeting.java\n\
  \nherong> dir Greeting.*\n   314 Greeting.class\n   135 Greeting.java\n\nherong>\
  \ java -classpath (;.\\cls\\com.herongyang Greeting\nHello world! - From Module\n\
  ```\n\n本教程演示了 Java 模块如何保护你的 Java 包和类不被他人使用（如果没有导出）。但他人仍然可以使用类路径（class path）而不是模块路径（module\
  \ path）来绕过模块保护。\n\nJava 教程 - Herong 的教程示例\n\n∟Java 模块 - Java 包聚合\n\n## 模块依赖与包的访问性\n\
  \n本节提供了一个教程示例，展示了如何设计具有依赖关系和包访问性的两个模块。\n\n在之前的教程中，我们学习了如何创建一个 Java 模块、编译它、将其打包成\
  \ `JMOD` 文件，并用它构建一个自定义的 `JRE`。\n\n现在，我将创建 2 个 Java 模块，以学习如何在模块描述符 `module-info.java`\
  \ 中使用 `requires` 和 `exports` 语句。\n\n### com.herongyang.base 模块 - 它包含以下提供基本类的包：\n\
  \n* `com.herongyang.point` 包包含 `Point` 类，用于表示一个点。它将被导出到模块外部。\n* `com.herongyang.line`\
  \ 包包含 `Line` 类，用于表示线。它将被导出到模块外部。\n* `com.herongyang.vector` 包包含 `Vector` 类，用于支持\
  \ `Line` 对象及其操作。它将被隐藏在模块内部。\n\n以下是 `com.herongyang.base` 模块的 `module-info.java`：\n\
  \n```\n herong> more .\\src\\com.herongyang.base\\module-info.java\n\n/* module-info.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nmodule com.herongyang.base\
  \ {\n   exports com.herongyang.point;\n   exports com.herongyang.line to com.herongyang.math;\n\
  }\n```\n\n在上面的模块描述符中，我使用了以下访问控制：\n\n* `com.herongyang.point` 包导出给所有其他模块。\n* `com.herongyang.line`\
  \ 包仅导出给 `com.herongyang.math` 模块。\n* `com.herongyang.vector` 包未导出。其他模块无法访问它。\n\n\
  以下是 `com.herongyang.math` 模块的 `module-info.java`：\n\n```\n herong> more .\\src\\\
  com.herongyang.math\\module-info.java\n\n/* module-info.java\n * Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n */\nmodule com.herongyang.math {\n   requires com.herongyang.base;\n\
  \   exports com.herongyang.geometry;\n}\n```\n\n在上面的模块描述符中，我声明了：\n\n* `com.herongyang.geometry`\
  \ 包导出给所有其他模块。\n* 运行此模块需要 `com.herongyang.module` 模块。\n\nJava 教程 - Herong 的教程示例\n\
  \n∟Java 模块 - Java 包聚合\n\n## com.herongyang.base 模块实现\n\n本节描述了如何使用 3 个包中的 3 个类（`Point.java`,\
  \ `Vector.java` 和 `Line.java`）实现 `com.herongyang.base` 模块。\n\n根据上一个教程中设计的 `com.herongyang.base`\
  \ 模块，现在让我实现它的包和类。\n\n`com.herongyang.point` 包包含 `Point` 类，用于三维空间中的一个点：\n\n```\n\
  \ herong> more src\\com.herongyang.base\\com\\herongyang\\point\\Point.java\n\n\
  /* Point.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n */\npackage\
  \ com.herongyang.point;\npublic class Point {\n   public double x = 0.0;\n   public\
  \ double y = 0.0;\n   public double z = 0.0;\n   public Point(double x, double y,\
  \ double z) {\n      this.x = x;\n      this.y = y;\n      this.z = z;\n   }\n \
  \  public double distance(Point t) {\n      return Math.sqrt((t.x-x)*(t.x-x)+(t.y-y)*(t.y-y)+(t.z-z)*(t.z-z));\n\
  \   }\n   public static void main(String[] a) {\n      Point p = new Point(1, 0,\
  \ 0);\n      Point q = new Point(0, 1, 0);\n      System.out.println(\"Point p =\
  \ (\"+p.x+\", \"+p.y+\", \"+p.z+\")\");\n      System.out.println(\"Point q = (\"\
  +q.x+\", \"+q.y+\", \"+q.z+\")\");\n      System.out.println(\"Distance from p to\
  \ q = \"+p.distance(q));\n   }\n}\n```\n\n`com.herongyang.vector` 包包含 `Vector` 类，用于三维空间中的一个向量：\n\
  \n```\n /* Vector.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\npackage com.herongyang.vector;\npublic class Vector {\n   public double x\
  \ = 0.0;\n   public double y = 0.0;\n   public double z = 0.0;\n   public Vector\
  \ (double x, double y, double z) {\n      this.x = x;\n      this.y = y;\n     \
  \ this.z = z;\n   }\n   public double length() {\n      return Math.sqrt(x*x + y*y\
  \ + z*z);\n   }\n   public Vector crossProduct(Vector v) {\n      Vector w = new\
