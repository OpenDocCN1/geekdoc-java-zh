  \ 教程 - Herong 教程示例\n\n∟JDK - Java 开发工具包\n\n# 在 Mac 上下载并安装 JDK\n\n本节描述了如何在 macOS\
  \ 系统上下载并安装 `JDK 13`。\n\n要学习 Java，你需要在机器上安装一个 `JDK`（Java 开发工具包）。如果你是 Mac 用户，可以按照此教程在你的\
  \ Mac 电脑上下载并安装 `JDK 13`。\n\n1. 访问 Oracle Java SE 下载网站 [oracle.com/technetwork/java/javase/downloads/index.html](https://www.oracle.com/technetwork/java/javase/downloads)。\n\
  2. 点击“Java Platform (JDK) 13”旁边的“Download”。\n3. 从下载列表中点击 `jdk-13_osx-x64.bin.tar.gz`。它将自动保存到你的“Downloads”目录。\n\
  4. 启动 `Terminal` 窗口并运行以下命令进行安装。\n\n```\n herong$ cd ~/Downloads\n\nherong$ gunzip\
  \ jdk-13_osx-x64.bin.tar.gz\n\nherong$ tar -xf jdk-13_osx-64.bin.tar\n\nherong$\
  \ sudo mv jdk-13.jdk/ /Library/Java/JavaVirtualMachines/\n```\n\n要测试安装，请打开命令行窗口并尝试\
  \ `java` 命令。如果你得到以下输出，说明安装成功：\n\n```\n herong$ java -version\n\njava version \"\
  13\" 2019-09-17\nJava(TM) SE Runtime Environment (build 13+33)\nJava HotSpot(TM)\
  \ 64-Bit Server VM (build 13+33, mixed mode, sharing)\n```\n\nJava 教程 - Herong 教程示例\n\
  \n∟JDK - Java 开发工具包\n\n# 编写第一个 Java 程序\n\n本节提供了一个如何使用 `JDK` 编写、编译和执行第一个 Java 程序的教程示例。\n\
  \n当机器上安装了 `JDK` 时，它提供了两个命令供你编译和运行 Java 程序。\n\n*   `javac class_name.java` - 编译存储在程序类同名文件中的\
  \ Java 程序。\n*   `java -classpath . class_name` - 运行编译后的 Java 程序。`-classpath .` 指定当前目录为类路径。\n\
  \n用一个非常简单的 Java 程序尝试这些命令。使用记事本将以下 Java 程序输入到名为 `Hello.java` 的文件中：\n\n```\n class\
  \ Hello {\n   public static void main(String[] a) {\n      System.out.println(\"\
  Hello world!\");\n   }\n}\n```\n\n然后在命令行窗口中使用 `javac` 命令编译此程序：\n\n```\n herong>\
  \ \\progra~1\\java\\jdk-17.0.1\\bin\\javac Hello.java\n```\n\n使用 `java` 命令执行程序：\n\
  \n```\n herong> \\progra~1\\java\\jdk-17.0.1\\bin\\java Hello\n\nHello world!\n\
  ```\n\n恭喜你，你已经成功地输入、编译并执行了你的第一个 Java 程序。\n\nJava 教程 - Herong 教程示例\n\n∟JDK - Java\
  \ 开发工具包\n\n# 将 JDK \"bin\" 目录添加到 Path 设置中\n\n本节提供了关于如何将 JDK `bin` 目录添加到 `path` 系统环境变量的教程。\n\
  \n为了运行 Java，请将 `path` 环境变量设置为 JDK `bin` 目录。\n\n*   打开“控制面板” > “系统” > “高级系统设置”。\n\
  *   点击“环境变量”。\n*   在“系统变量”下选择 `path` 并点击“编辑”。\n*   点击“新建”并粘贴 JDK `bin` 文件夹的路径，例如\
  \ `C:\\Program Files\\Java\\jdk-17.0.1\\bin`。\n*   在所有窗口上点击“确定”。\n\n现在无需输入完整路径即可运行\
  \ Java 命令。要验证这一点，请检查 `path` 变量：\n\n```cmd\necho %path%\n```\n\n要测试安装，请打开命令行窗口并尝试\
  \ `java` 命令。如果你得到以下输出，说明安装成功：\n\n```\njava -version\n\njava version \"17.0.1\" 2021-10-19\
  \ LTS\nJava(TM) SE Runtime Environment (build 17.0.1+12-LTS-39)\nJava HotSpot(TM)\
  \ 64-Bit Server VM \n  (build 17.0.1+12-LTS-39, mixed mode, sharing)\n```\n\n\n\n\
  \n\n* `public static void main(String[] a)` 是类在 虚拟机 (JVM) 中启动时的执行入口点。\n* JVM 为所有应用程序提供了\
  \ 3 个默认 I/O 数据流：`\"in\"`、`\"out\"` 和 `\"err\"`。\n\nJava 教程 - Herong 的教程示例\n\n执行过程、入口点、输入和输出\n\
  \n## 创建、编译和执行 Java 程序\n\n本节描述了 Java 程序的创建、编译和执行过程。同时也描述了 JDK 中的 `javac` 和 `java`\
  \ 命令。\n\n构建和运行 Java 程序涉及 3 个步骤：\n\n* **创建程序源代码**：创建一个编写有 Java 语言语句的文本文件，用于定义每个 Java\
  \ 类或其他程序单元。该文本文件称为源代码文件，其文件名必须与文件中定义的类名相同，且扩展名为 `.java`。其中一个源代码文件应该定义主类，该类包含包含 `\"\
  main\"` 方法作为执行起点。其他源代码文件则定义额外的类和其他程序单元以支持主类。\n* **编译源代码**：将程序所有的源代码文件转换为以 Java 虚拟机\
  \ (JVM) 指令编写的字节码文件。字节码文件必须与源代码文件名相同，且扩展名为 `.class`。\n* **执行 Java 程序**：将主类的字节码文件加载到\
  \ JVM 中并从 `\"main\"` 方法开始执行其 JVM 指令。\n\n创建源代码文件可以使用简单的文本编辑器、记事本或复杂的 Java 开发环境工具，如\
  \ Eclipse 或 Visual J++。\n\n编译源代码文件需要 Java 编译器。JDK 软件包包含一个 Java 编译器，可以通过命令 `javac`\
  \ 调用。`javac` 命令接受源代码文件名作为命令行参数。例如，在命令行窗口中输入以下命令将调用 `javac` 编译器来编译 `Hello.java` 源代码文件：\n\
  \n```\nherong> javac Hello.java\n```\n\n`javac` 命令还有几个可用的命令选项：\n\n* `-d`：指定编译器生成的字节码文件存放的目录，如果你不想将它们放在当前目录中。\n\
  * `-classpath`：指定搜索字节码格式的类或接口定义的目录，如果在源代码文件中使用了这些类或接口。\n* `-sourcepath`：指定搜索源代码格式的类或接口定义的目录，如果在源代码文件中使用了这些类或接口。\n\
  \n例如，以下命令：\n\n```\nherong> javac -d .\\cls -classpath .\\lib;.\\cls \\\n   -sourcepath\
  \ .\\src .\\src\\Hello.java\n```\n\n调用了 `javac` 编译器并告诉它：\n\n* 编译 `.\\src` 目录下的 `Hello.java`\
  \ 源代码文件。\n* 将字节码文件 `Hello.class` 放在 `.\\cls` 目录下。\n* 在 `.\\lib` 和 `.\\cls` 目录中搜索\
  \ `Hello.java` 中使用的类或接口的字节码格式定义。\n* 在 `.\\src` 目录中搜索 `Hello.java` 中使用的类或接口的源代码格式定义。\n\
  \n执行 Java 程序需要 JVM。JDK 也包含一个 JVM，称为 HotSpot，可以通过命令 `java` 调用。`java` 命令接受启动类名作为命令行参数。例如，以下命令：\n\
  \n```\nherong> java -classpath .\\lib;.\\cls;. Hello\n```\n\n调用 HotSpot：\n\n* 将\
  \ `Hello` 类加载到 HotSpot 中。\n* 执行 `Hello` 类的 `main()` 方法。\n\n`-classpath` 指定类路径，该路径包含了\
  \ JVM 在需要时搜索启动类和其他程序单元的字节码文件的目录。\n\nJava 教程 - Herong 的教程示例\n\n执行过程、入口点、输入和输出\n\n\
  ## main() 方法 - Java 执行入口点\n\n本节描述了 Java 程序的入口点，即启动类的 `main()` 方法。命令行参数作为字符串数组参数传递给\
  \ `main()` 方法。\n\n如上一节所述，Java 应用程序必须有一个主类，并包含一个特殊的方法调用 `main()` 作为执行入口点。`main()`\
  \ 方法必须定义为：\n\n```\npublic static void main(String[] a) {\n      // 语句块\n   }\n```\n\
  \n注意，`main()` 方法必须声明为 `public static void`。\n\n`main()` 方法的参数是一个 `\"String\"` 数组，它包含了\
  \ `java` 命令行中类名参数之后的额外参数。让我们使用以下 Java 程序来演示这些参数是如何传递到 `main()` 方法的：\n\n```\n /*\
  \ CommandLine.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n */\n\
  class CommandLine {\n   public static void main(String[] a) {\n      System.out.println(\"\
  Number of arguments = \"+a.length);\n      for (int i=0; i<a.length; i++) {\n  \
  \       System.out.println(\"  a[\"+i+\"] = \"+a[i]);\n      }\n   }\n}\n```\n\n\
  编译类后，使用以下命令行执行它：\n\n```\nherong> javac CommandLine.java\n\nherong> java -classpath\
  \ . CommandLine bread milk banana apple\n\nNumber of arguments = 4\n  a[0] = bread\n\
  \  a[1] = milk\n  a[2] = banana\n  a[3] = apple\n```\n\n在命令行类名之后指定了 4 个参数。JVM 将它们放入一个包含\
  \ 4 个元素的数组并将数组传递给 `main()` 方法。\n\n使用稍不同的命令行再次执行：\n\n```\nherong> java -classpath\
  \ . CommandLine \"bread milk\" \"banana apple\"\n\nNumber of arguments = 2\n  a[0]\
  \ = bread milk\n  a[1] = banana apple\n```\n\n这次，使用双引号将两个空格分隔的单词视为单个参数。\n\nJava\
  \ 教程 - Herong 的教程示例\n\n执行过程、入口点、输入和输出\n\n## Java 执行控制台 - \"in\", \"out\" 和 \"err\"\
  \ 数据流\n\n本节提供了如何使用默认输入输出数据流的教程示例：`System.in`、`System.out` 和 `System.err`。\n\n当 JVM\
  \ 执行 Java 应用程序时，它需要一个控制窗口为 Java 程序提供 3 个预定义的输入输出数据流，即：\n\n* `System.in`：连接控制窗口的标准输入流。\n\
  * `System.out`：连接控制窗口的标准输出流。\n* `System.err`：连接控制窗口的标准错误流。\n\n当你使用 JDK 软件包执行 Java\
  \ 程序时，控制窗口就是你输入 `java` 命令的同一个窗口。\n\n注意，所有 3 个标准流都定义为 `System` 类的公共静态变量。我们在第一个 Java\
  \ 程序 `Hello.java` 中使用了 `System.out` 在控制窗口上打印欢迎消息。这里是另一个使用了所有 3 个标准流的程序：\n\n\n\n\n\
  \n```java /* Reverser.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.io.*;\npublic class Reverser {\n   public static void main(String[]\
  \ arg) {\n      InputStream in1 = System.in;\n      InputStreamReader in2 = new\
  \ InputStreamReader(in1);\n      BufferedReader in = new BufferedReader(in2);\n\
  \      PrintStream out = System.out;\n      PrintStream err = System.err;\n    \
  \  err.println(\"This program reverses the character positions of \");\n      err.println(\"\
  each line from the standard input stream.\");\n      err.println(\"Enter '.' to\
  \ end the program.\");\n      try {\n         String s = in.readLine();\n      \
  \   while (s!=null) {\n            char[] a = s.toCharArray();\n            if (s.equals(\"\
  .\")) break;\n            int n = a.length;\n            for (int i=0; i<n/2; i++)\
  \ {\n               char c = a[i];\n               a[i] = a[n-1-i];\n          \
  \     a[n-i-1] = c;\n            }\n            out.println(new String(a));\n  \
  \          s = in.readLine();\n         }\n      } catch (IOException e) {\n   \
  \      err.println(e.toString());\n      }\n   }\n}\n```\n\n请注意：\n\n* `System.in`\
  \ 是一个 `InputStream` 对象，它只提供按字节读取信息的方法。为了每行读取一个 `String`，我需要将 `System.in` 转换为 `BufferedReader`\
  \ 对象。\n\n* `while` 循环应该在 `System.in` 达到流末尾时结束。然而，Windows 上的 HotSpot 没有提供从键盘指示标准输入流结束的方法。因此，我使用了一种特殊模式，即行中有一个且仅有一个字符\
  \ `.` 来结束循环。\n\n使用以下命令编译并运行程序：\n\n```\n herong> javac Reverser.java\n\nherong> java\
  \ -classpath . Reverser\n```\n\n然后从键盘输入以下文本：\n\n```\n Fish, I love you and respect\
  \ you very much.\nBut I will kill you dead before this day ends.\n.\n```\n\n我在控制窗口上看到以下内容：\n\
  \n```\n This program reverses the character positions of\neach line from the standard\
  \ input stream.\nEnter '.' to end the program.\nFish, I love you and respect you\
  \ very much.\n.hcum yrev uoy tcepser dna uoy evol I ,hsiF\nBut I will kill you dead\
  \ before this day ends.\n.sdne yad siht erofeb daed uoy llik llik I tuB\n.\n```\n\
  \n请注意：\n\n* 前 3 行来自 `System.err` 流。\n\n* 第 4、第 6 和第 8 行是 `System.in` 流文本行的复制，因为控制窗口会回显我在键盘上输入的所有内容。\n\
  \n* 第 5 和第 7 行来自 `System.out` 流。\n\nWindows 系统也可以将控制台输入和输出重定向到文件。首先，我将 2 行文本和 `.`\
  \ 保存到名为 `input.txt` 的文件中，然后运行以下命令：\n\n```\n herong> java -classpath . Reverser <\
  \ input.txt > output.txt\n```\n\n我只在控制窗口上得到了来自 `System.err` 的文本：\n\n```\n This program\
  \ reverses the character positions of\neach line from the standard input stream.\n\
  Enter '.' to end the program.\n```\n\n`output.txt` 文件包含：\n\n```\n .hcum yrev uoy\
  \ tcepser dna uoy evol I ,hsiF\n.sdne yad siht erofeb daed uoy llik llik I tuB\n\
  ```\n\nJava 教程 - Herong 的教程示例\n\n## 基本数据类型和字面量\n\n本章提供了关于基本数据类型和字面量的教程笔记和示例代码。主题包括\
  \ 8 种基本数据类型；每个数据类型的存储大小；每个数据类型源代码字面量的格式规则；关于基本类型的 Java 程序示例。\n\n> Java 支持的数据类型\n\
