  \      reg.register(new String(\"Java\"));\n      reg.register(new String(\"C++\"\
  ));\n      reg.register(new String(\"PHP\"));\n      o.println(\"# of objects registered:\
  \ \"+reg.size());\n   }\n}\n```\n\n\n\n\n\n# 什么是边界类型参数（Bounded Type Parameter）？\n\
  \n边界类型参数只能用某些限制类型参数化的类型参数。这种对类型参数的限制允许你创建泛型类，为这些限制类型提供特殊函数。\n\n声明边界类型参数的语法是添加 `extends`\
  \ 关键字并跟一个或多个基类。示例列所示：\n\n```\n class Name<T extends C> {}\nclass Name<T extends\
  \ I> {}\nclass Name<T extends I1 & I2...> {}\nclass Name<T extends C & I1 & I2...>\
  \ {}\n```\n\n这里是一个教程示例，向你展示如何创建一个带有边界类型参数的泛型类：\n\n```\n /* AddRegister.java\n *\
  \ Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass AddRegister<T extends\
  \ Number> {\n   private double sum;\n\n   public AddRegister() {\n      sum = 0.0;\n\
  \   }\n\n   public void add(T item) {\n      sum += item.doubleValue();\n   }\n\n\
  \   public double getSum() {\n      return sum;\n   }\n\n   public static void main(String[]\
  \ a) {\n      java.io.PrintStream o = System.out;\n      AddRegister<Float> reg\
  \ = new AddRegister<Float>();\n      reg.add(Float.valueOf(\"99.99\"));\n      reg.add(Float.valueOf(\"\
  \ 6.50\"));\n      reg.add(Float.valueOf(\"11.99\"));\n      o.println(\"Total price:\
  \ \"+reg.getSum());\n\n      // 不允许 - 给类型参数提供了错误的类型\n      // AddRegister<String>\
  \ test = new AddRegister<String>();\n   }\n}\n```\n\n该示例运行正常。查看下方的输出：\n\n```\n Total\
  \ price: 118.4799976348877\n```\n\n如果你取消示例中不允许的行的注释，你将得到编译错误：\n\n```\n AddRegister.java:28:\
