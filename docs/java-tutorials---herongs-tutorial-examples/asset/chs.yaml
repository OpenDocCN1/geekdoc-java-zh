  \n* `float` - 支持范围在 -10³⁸ 到 10³⁸ 之间的有符号实数，精度约为 7 位有效数字。\n* `double` - 支持范围在 -10³⁰⁸\
  \ 到 10³⁰⁸ 之间的有符号实数，精度约为 15 位有效数字。\n\n\n\n\n\n*   `float` - 将其值存储在 32 位（4 字节）的空间中，包含：1\
  \ 位符号位、8 位指数部分和 23 位小数部分，以 IEEE 754 标准中描述的二进制格式表示。\n*   `double` - 将其值存储在 64 位（8\
  \ 字节）的空间中，包含：1 位符号位、11 位指数部分和 52 位小数部分，以 IEEE 754 标准中描述的二进制格式表示。\n\n欲了解更多信息，请阅读我的《C#\
