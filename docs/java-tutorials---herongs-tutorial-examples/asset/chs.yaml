  \n∟归档教程\n\n### 归档：JDK 1.3 缺陷 - 未启动线程的内存泄漏\n\n本节描述了一个针对 `JDK 1.3` 的缺陷，未启动的 `thread`\
  \ 对象会导致内存泄漏。\n\n2001 年针对 `JDK 1.3` 提交了一个标题为“Unstarted Thread causes memory leak”的缺陷。详情请参阅\
  \ [`developer.java.sun.com/developer/bugParade/bugs/4410846.html`](http://developer.java.sun.com/developer/bugParade/bugs/4410846.html)。\n\
  \n该缺陷报告包含了以下显示内存泄漏的程序：\n\n```\n public class ThreadTest {\n    public static void\
  \ main(String args[]) {\n  while (true) {\n    try {\n        Thread t = new Thread();\n\
  \    // start thread for memory leak workaround\n//        t.start();\n    t = null;\n\
  \        System.gc();\n    Thread.sleep(500);\n  } catch (InterruptedException ie)\
  \ {\n    ie.printStackTrace();\n  }\n        }\n    }\n}\n```\n\n我在我的 `J2SDK 1.4.1`\
  \ 系统上运行了这个程序。正如预测的，`JVM` 的内存占用以每 15 秒约 4K 的速度缓慢上升。\n\n正如我在之前的章节中提到的，未指定特定线程组创建的\
  \ `Thread` 对象将被添加到 \"main\" 组。因此，在缺陷报告包含的 `ThreadTest` 程序中，所有创建的线程将被添加到 \"main\"\
  \ 组，并一直留在那里直到启动并结束。如果我们继续创建新线程，“main\" 组中的线程数量将会增加，内存占用也会随之增长。\n\n但我看来，这并不是真正的缺陷。`JDK`\
  \ 的设计目的是将所有的 `Thread` 和 `ThreadGroup` 对象组织在单一线程组树中。应用程序被迫使用这种结构并必须遵循这些规则。\n\n然而，如果使用不当，这个设计特性是非常危险的，正如缺陷报告所示。如果创建了新线程但由于某种原因没有执行\
  \ `start()` 调用，对于任何类型的服务器都可能存在这种风险。\n\n解决此问题的一种方案是：\n\n* 在 `Thread` 对象创建时，使用 `WeakReference`\
  \ 将其添加到线程组。\n* 在启动时（调用 `start()` 时），将 `WeakReference` 改为普通引用。\n\n关于该方案的几点说明：\n\n\
  * 对于未启动线程的 `weak reference` 允许垃圾回收器在没有指向应用程序的普通引用的情况下移除该线程。\n* 在线程启动时将 `weak reference`\
  \ 替换为普通引用，可以防止垃圾回收器移除正在运行的线程，即使没有指向应用程序的普通引用。\n* 该方案的实现可以是线程组中两个独立的线程集合：一个用于带有弱引用的未启动线程，另一个用于带有普通引用的已启动线程。\n\
  \n在没有 `JDK` 任何帮助的情况下，从应用程序端找到简单的解决方法是不容易的。\n\n但是，你可以在应用程序中加入逻辑来监控未启动线程的数量。如果这个数字在增长，你就知道应用程序的某处创建了线程但没有\
  \ `start()`。以下是计算未启动线程数量的代码：\n\n```\n ThreadGroup g = Thread.currentThread().getThreadGroup();\n\
  \   while (g.getParent()null) g = g.getParent();\n   Thread[] l = new Thread[g.activeCount()];\n\
  \   int unstartedThreadCount = g.activeCount() - g.enumerate(l,true);\n```\n\nJava\
