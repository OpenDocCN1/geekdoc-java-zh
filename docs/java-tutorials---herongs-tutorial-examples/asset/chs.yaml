  \nJava 教程 - Herong 的教程示例\n\n∟枚举类型与枚举常量\n\n## java.lang.Enum 超类\n\n本节提供了一个如何验证 java.lang.Enum\
  \ 超类支持的枚举类型层次结构的教程。\n\n从之前的教程中我们可以看到，“enum\" 声明语句比 \"class\" 声明语句提供了一种更简单的定义常量的方法。\n\
  \n使用 \"enum\" 声明语句的另一个用处是，生成的枚举类型是 `java.lang.Enum<E extends Enum<E>>` 的子类型，它实现了\
  \ 3 个接口：`Serializable`、`Comparable<E>`、`Constable`。\n\n因此，如果你用 \"enum\" 声明语句定义一个枚举类型\
  \ `E`，`E` 将自动成为 `Enum<Rank>` 和 `Enum<?>` 的子类型。`E` 也将变为 `Serializable`、`Comparable<E>`\
  \ 和 `Constable`。\n\n这是一个用于验证枚举类型层次结构的示例程序：\n\n\n\n\n\n```java\n /* EnumTypeHierarchy.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nimport java.lang.Enum;\n\
  import java.lang.Comparable;\nimport java.lang.constant.Constable;\nimport java.io.Serializable;\n\
  class EnumTypeHierarchy {\n   enum Rank {\n      GOLD, SILVER, BRONZE;\n   }\n \
  \  enum Color {\n      RED, GREEN, BLUE;\n   }\n\n   public static void main(String[]\
  \ arg) {\n      java.io.PrintStream out = System.out;\n      out.println(\"Converting\
  \ enum constant to string:\");\n      out.println(\"   Rank.GOLD = \"+Rank.GOLD);\n\
  \      out.println(\"   Rank.SILVER = \"+Rank.SILVER);\n      out.println(\"   Rank.BRONZE\
  \ = \"+Rank.BRONZE);\n\n      Rank gold = Rank.GOLD;\n      out.println(\"Enum constant\
  \ class:\");\n      out.println(\"   gold instanceof Rank = \"+(gold instanceof\
  \ Rank));\n      out.println(\"   gold class name = \"+gold.getClass().getName());\n\
  \n      out.println(\"Reifiable class types - Gold:\");\n      out.println(\"  \
  \ is a Rank = \"+(gold instanceof Rank));\n      out.println(\"   is a Enum<?> =\
  \ \"+(gold instanceof Enum<?>));\n      out.println(\"   is a Object = \"+(gold\
  \ instanceof Object));\n\n      out.println(\"Reifiable interface types - Gold:\"\
  );\n      out.println(\"   is Serializable = \"+(gold instanceof Serializable));\n\
  \      out.println(\"   is Comparable<?> = \"+(gold instanceof Comparable<?>));\n\
  \      out.println(\"   is Constable = \"+(gold instanceof Constable));\n\n    \
  \  out.println(\"Non-reifiable types:\");\n      Enum<Rank> enumRank = gold;\n \
  \     out.println(\"   gold is an Enum<Rank> = true\");\n      // Enum<Color> enumColor\
  \ = gold;\n      out.println(\"   gold is not an Enum<Color> = false\");\n     \
  \ Comparable<Rank> comparableRank = gold;\n      out.println(\"   gold is an Comparable<Rank>\
  \ = true\");\n      // Comparable<Color> comparableColor = gold;\n      out.println(\"\
  \   gold is an Comparable<Color> = false\");\n   }\n}\n```\n\nIf you compile and\
  \ run `EnumTypeHierarchy.java`, you should get:\n\n```\n herong> java EnumTypeHierarchy.java\n\
  \nConverting enum constant to string:\n   Rank.GOLD = GOLD\n   Rank.SILVER = SILVER\n\
  \   Rank.BRONZE = BRONZE\nEnum constant class:\n   gold instanceof Rank = true\n\
  \   gold class name = EnumTypeHierarchy$Rank\nReifiable class types - Gold:\n  \
  \ is a Rank = true\n   is a Enum<?> = true\n   is a Object = true\nReifiable interface\
  \ types - Gold:\n   is Serializable = true\n   is Comparable<?> = true\n   is Constable\
  \ = true\nNon-reifiable types:\n   gold is an Enum<Rank> = true\n   gold is an Enum<Color>\
  \ = false\n   gold is an Comparable<Rank> = true\n   gold is an Comparable<Color>\
  \ = false\n```\n\nJava Tutorials - Herong's Tutorial Examples\n\n∟Enum Types and\
  \ Enum Constants\n\n∟ Enum Constant Inherited Methods\n\nThis section provides a\
  \ tutorial on how to invoke static and instance method inherited from the generic\
  \ base class of `java.lang.Enum`.\n\nFrom previous tutorial, we learned that all\
  \ enum types have a common super type of `java.lang.Enum<?>` supported by the generic\
  \ base class of `java.lang.Enum<E extends Enum<E>>`. The base class implements 3\
  \ interfaces: `Serializable`, `Comparable<E>`, `Constable`. It also provided several\
  \ interesting static and instance methods:\n\n*   `name()` - Returning the name\
  \ of this enum constant as specified in the declaration list.\n*   `ordinal()` -\
  \ Returning the ordinal (the position in the declaration list) of this enum constant.\n\
  *   `toString()` - Returning the name of this enum constant as specified in the\
  \ declaration list.\n*   `compareTo()` - Comparing this enum constant to another\
  \ in the same enum type by their declaration position.\n*   `getDeclaringClass()`\
  \ - Returning the `Class` object of this enum constant.\n*   `valueOf()` - Returning\
  \ an enum constant of the specified enum type with the specified name.\n\nHere is\
  \ a sample program that shows you how to invoke methods listed above:\n\n```java\n\
  \ /* EnumInheritedMethods.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.lang.Enum;\nclass EnumInheritedMethods {\n   enum Rank {\n   \
  \   GOLD, SILVER, BRONZE;\n   }\n\n   public static void main(String[] arg) {\n\
  \      java.io.PrintStream out = System.out;\n      Rank gold = Rank.GOLD;\n   \
  \   Rank silver = Rank.SILVER;\n\n      out.println(\"Inherited instance methods:\"\
  );\n      out.println(\"   silver.name() = \"+silver.name());\n      out.println(\"\
  \   silver.toString() = \"+silver.toString());\n      out.println(\"   silver.ordinal()\
  \ = \"+silver.ordinal());\n      out.println(\"   silver.compareTo() = \"+silver.compareTo(gold));\n\
  \      out.println(\"   silver.getClass() = \"+silver.getClass());\n      out.println(\"\
  \   silver.getDeclaringClass() = \"\n         +silver.getDeclaringClass());\n\n\
  \      out.println(\"Base static methods:\");\n      out.println(\"   Enum.valueOf()\
  \ = \"+Enum.valueOf(Rank.class, \"GOLD\"));\n   }\n}\n```\n\nIf you compile and\
  \ run `EnumInheritedMethods.java`, you should get:\n\n```\n herong> java EnumInheritedMethods.java\n\
  \nInherited instance methods:\n   silver.name() = SILVER\n   silver.toString() =\
  \ SILVER\n   silver.ordinal() = 1\n   silver.compareTo() = 1\n   silver.getClass()\
  \ = class EnumInheritedMethods$Rank\n   silver.getDeclaringClass() = class EnumInheritedMethods$Rank\n\
  Base static methods:\n   Enum.valueOf() = GOLD\n```\n\nJava Tutorials - Herong's\
  \ Tutorial Examples\n\n∟Enum Types and Enum Constants\n\n∟ Enum Implicit Methods\n\
  \nThis section describes 2 static methods implicitly to enum types.\n\nWhen you\
  \ define an enum type with an `enum` statement, the Java compiler implicitly adds\
  \ methods to the resulting class.\n\n1. `public static E valueOf(String name)` -\
  \ Returning the enum constant of this enum type with the specified name. This method\
  \ is equivalent to `public static E valueOf(Class<E> enumType, String name)` static\
  \ method defined in the base class `java.lang.Enum<E>`.\n2. `public static E[] values()`\
  \ - Returning an array of this enum type containing all enum constants.\n\nNote\
  \ that those implicit methods are not mentioned in JDK documentation. You have to\
  \ read the Java language specification to find them.\n\nHere is a sample program\
  \ that shows you how to invoke:\n\n```java\n /* EnumImplicitMethods.java\n * Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n */\nimport java.lang.Enum;\nclass EnumImplicitMethods\
  \ {\n   enum Rank { GOLD, SILVER, BRONZE; }\n   public static void main(String[]\
  \ arg) {\n      java.io.PrintStream out = System.out;\n      out.println(\"Enum\
  \ type implicit static methods:\");\n      out.println(\"   Rank.valueOf() = \"\
  +Rank.valueOf(\"GOLD\"));\n      out.println(\"   Rank.values() =\");\n      for\
  \ (Rank r : Rank.values()) out.println(\"      \"+r);\n   }\n}\n```\n\nIf you compile\
  \ and run `EnumImplicitMethods.java`, you should get:\n\n```\n herong> java EnumImplicitMethods.java\n\
  \nEnum type implicit static methods:\n   Rank.valueOf() = GOLD\n   Rank.values()\
  \ =\n      GOLD\n      SILVER\n      BRONZE\n```\n\nJava Tutorials - Herong's Tutorial\
  \ Examples\n\n∟StringBuffer - The String Buffer Class\n\nThis chapter describes\
  \ the StringBuffer class included in the java.lang package. Topics include StringBuffer\
  \ properties and methods, implementing a simple string buffer class, comparing performances\
  \ of String and StringBuffer classes.\n\nConclusion:\n\n*   StringBuffer class allows\
  \ you to manipulate text information more efficiently that String class.\n\nJava\
  \ Tutorials - Herong's Tutorial Examples\n\n∟StringBuffer - The String Buffer Class](#part0069.xhtml)\n\
  \n∟ StringBuffer Class Properties and Methods\n\nThis section describes the StringBuffer\
  \ class, it properties and methods.\n\n**java.lang.StringBuffer** - A class represents\
  \ a mutable sequence of characters stored in an internal buffer. An instance of\
  \ StringBuffer has 3 important properties:\n\n\n\n\n* **Buffer（缓冲区）**：存储字符的地方。\n\
  * **Capacity（容量）**：存储的大小。\n* **Length（长度）**：缓冲区中存储的字符数量。\n\n缓冲区字符序列可以通过以下方法进行操作：\n\
  \n* `append()`：在序列末尾添加更多字符。\n* `insert()`：在序列的指定位置插入更多字符。\n* `delete()`：从序列中删除某些字符。\n\
  * `replace()`：替换序列中的某些字符。\n* `reverse()`：反转序列中所有字符的位置。\n* `setLength()`：截断序列，或用\
  \ `'\\u0000'` 填充序列，以使字符数量等于指定值。\n\n缓冲区的大小（容量，容量）可能会受到以下方法的影响：\n\n* `append()`、`insert()`\
  \ 和 `replace()`：如果当前容量不足以容纳增加的字符，可能会导致容量增加。\n* `setLength()`：如果当前容量小于指定值，可能会导致容量增加。\n\
  * `ensureCapacity()`：如果当前容量小于指定值，可能会导致容量增加。\n\n是否有任何方法可以导致容量减小？我没有看到任何方法。\n\n`StringBuffer`\
  \ 类中的许多方法返回当前对象。这允许我们在一个语句中编写多个方法调用，如下所示：\n\n```\n s = s.append(\"It's \").append(10).append(\"\
  \ o'clock.\");\n```\n\n根据 J2SDK API 规范，`StringBuffer` 实例被 Sun Java 编译器用于实现字符串拼接操作。例如，下述语句：\n\
  \n```\n s = \"It's \" + 10 + \" o'clock.\";\n```\n\n将被编译为：\n\n```\n s = new StringBuffer().append(\"\
  It's \").append(10)\n      .append(\" o'clock.\").toString();\n```\n\nJava 教程 -\
  \ Herong 的教程示例\n\n∟StringBuffer - 字符串缓冲区类\n\n∟SimpleStringBuffer - 我的 StringBuffer\
  \ 实现\n\n本节提供了一个教程示例，介绍如何实现一个与 `java.lang` 包包含的 `StringBuffer` 类类似的简单字符串缓冲区类。\n\n\
  为了更好地理解 `StringBuffer` 类，我编写了以下程序 `SimpleStringBuffer`，它实现了一个仅包含一个 `append()` 方法的非常简单的字符串缓冲区类：\n\
  \n```\n /* SimpleStringBuffer.java\n * Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n */\npublic class SimpleStringBuffer {\n   private char[] buffer;\n\
  \   private int capacity;\n   private int length;\n   public SimpleStringBuffer()\
  \ {\n      this(16);\n   }\n   public SimpleStringBuffer(int l) {\n      capacity\
  \ = l;\n      buffer = new char[capacity];\n      length = 0;\n   }\n   public synchronized\
  \ SimpleStringBuffer append(String str) {\n      String s = str;\n      if (s==null)\
  \ s = \"null\";\n      if (length+s.length()>capacity) {\n         int l = Math.max(length+s.length(),\
  \ 2*capacity);\n         char[] b = new char[l];\n         for (int i=0; i<length;\
  \ i++) {\n            b[i] = buffer[i];\n         }\n         buffer = b;\n    \
  \     capacity = l;\n      }\n      for (int i=0; i<s.length(); i++) {\n       \
  \  buffer[length+i] = s.charAt(i);\n      }\n      length += s.length();\n     \
  \ return this;\n   }\n   public String toString() {\n      return new String(buffer,\
  \ 0, length);\n   }\n```\n\n关于该类的几点说明：\n\n* 我使用字符数组 `char[]` 作为字符串缓冲区的存储器。\n* 提供了两个构造方法：一个采用默认的\
  \ 16 个字符的缓冲区容量，另一个允许调用者指定特定的容量。\n* 主方法是 `append()`，它将指定的字符串附加到缓冲区的末尾。\n* 如果缓冲区没有足够的空空间来附加指定的字符串，缓冲区将以更高的容量进行扩展。\n\
