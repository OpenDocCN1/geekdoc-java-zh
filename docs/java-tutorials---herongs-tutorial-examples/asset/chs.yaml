  以下是 \"if-then\" 语句的语法。注意，“then” 并没有被作为语句中的关键字使用。\n\n```\n if (condition_expression)\
  \ contained_statement\n```\n\n包含的子语句可以是一个简单的单语句，也可以是一个复杂的语句块。这里有一个示例程序，展示了如何使用 \"\
