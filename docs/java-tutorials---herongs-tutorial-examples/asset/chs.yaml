  Time = 6920\n...\n```\n\n### 关于结果的几个有趣的说明：\n\n- 正如预期，随着程序中添加的线程越多，总执行时间在缓慢增长。因为只有一个\
  \ CPU，当一个线程在执行时，其他线程必须等待。添加更多线程时增加的少量额外执行时间是管理更多线程的开销。\n\n- 然而，输出中有一个惊喜。程序使用 10\
  \ 个线程运行的其中一次执行仅用了 3925 毫秒，而相同线程数量的另一次执行则用了 6750 毫秒。那次执行发生了什么，为什么运行得那么快？我不知道答案。可能是操作系统通过长时间阻塞其他应用程序，为我的应用程序提供了一些额外的\
  \ CPU 资源。\n\n- 输出还显示，即使所有线程的优先级相同，线程也可能被应用程序中的其他线程阻塞较长时间。15 线程执行输出中的一个例子是，线程 4、5、6\
  \ 和 7 线程在起点处被阻塞，直到线程 1 已经检查并/或处理了 638 年。\n\nJava 教程 - Herong 的教程示例\n\n∟执行线程与多线程\
  \ Java 程序\n\n∟`interrupt()` - 终止线程的方法\n\n本节提供了一个关于如何使用 `interrupt()` 方法终止运行线程的教程示例。\n\
  \n终止线程有 3 种方式：\n\n1. 线程完成了它设计执行的工作，并自然地退出 `run()` 方法。\n2. 线程在工作时收到了中断信号。它决定不再继续工作并退出\
  \ `run()` 方法。它也可能决定忽略信号并继续工作。\n3. 线程被标记为守护线程（daemon thread）。当创建该线程的父线程终止时，该线程将被\
  \ JVM 强制终止。\n\n下面的程序演示了终止线程的 3 种方式。该程序设计为按计时器运行。它可以设置为运行给定的分钟数。一旦启动，程序会创建 3 个子线程：\n\
  \n- 一个充当普通时钟，从当前时间开始。\n- 一个充当秒表，从 0 开始。\n- 一个充当倒计时器，从目标设定的时间量开始。\n\n```java\n /*\
  \ TimerThread.java\n * Copyright (c) Herong.com. All Rights Reserved. */\nimport\
  \ java.util.*;\nimport java.text.*;\nclass TimerThread extends Thread {\n   static\
  \ final int NORMAL_CLOCK = 1;\n   private static final int COUNT_DOWN = 2;\n   private\
  \ static final int STOP_WATCH = 3;\n   private int type; // 时钟类型\n   private int\
  \ c_millisecond, c_second, c_minute, c_hour;\n   private static int remaining_minutes\
  \ = 5;\n   private static int clock_interval = 100; // 毫秒 < 1000\n   public static\
  \ void main(String[] a) {\n      System.out.println(\"Normal watch Count-down\"\
