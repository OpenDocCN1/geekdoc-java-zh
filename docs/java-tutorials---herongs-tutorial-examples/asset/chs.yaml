  \ \"main\" 线程组中。\n* 线程 \"AThread 1\" 从未启动过。它被 `list()` 方法报告了，但没有包含在 `enumerate()`\
  \ 方法中。\n* 根据上一点，我们可以通过 `activeCount()-enumerate(Thread[] l, true)` 计算出线程组中未启动线程的数量。\n\
  * 线程组 \"Group Y\" 已被 `destroy()` 方法销毁。\n\n\n\n\n-   同步规则：当执行线程中遇到同步块时，将检查与之相关的锁。如果锁已锁定，执行将停止，直到锁被释放。如果锁未被锁定，则将锁定锁，并执行同步块语句。当执行到同步块的末尾时，锁将被释放。根据此规则，两个与同一锁关联的同步块永远不会同时执行。\n\
  \n现在，让我们看看是否可以在银行应用程序中使用同步技术来帮助该银行。让我们在每个线程中定义一个从“获取账户余额”操作到“设置账户余额”操作的同步块，并将该块与一个锁关联。通过此更改，你和你的朋友仍然可以各提取\
  \ 50.00 美元，但你的账户将一无所有了：\n\n```\n Time     01:01      02:01     03:01      04:02\n\
  \         -----------+---------++--------++-------\nLock     Unlocked   Locked \
  \   Locked     Unlocked\n```\n\n```\n Time     01:01      02:01     03:01     04:01\n\
  \         +----------+---------+---------+--------\nThread 1            Get    \
  \   Set\nAction   You        Account   Account   You\n         Withdraw   Balance\
  \   Balance   Receive\n         $50.00     $100.00   $50.00    $50.00\n```\n\n```\n\
  \ Time      01:02      02:02     03:02     04:02     05:02\n         -+----------+---------+---------+---------+------\n\
  Thread 2             Get       Get       Set\nAction    Friend     Account   Account\
  \   Account   Friend\n          Withdraw   Balance   Balance   Balance   Receive\n\
  \          $50.00     Stopped   $50.00    $0.00     $50.00\n```\n\n```\n Time  \
  \   01:01      02:01     03:01      04:02     05:02\n         -----------++--------++--------++---------+------\n\
  Account  $100.00    $100.00   $50.00     $0.00     $0.00\n```\n\n同步技术确实帮助银行避免了亏损。但它也增加了总交易时间。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟同步技术与同步代码块\n\n∟\"synchronized\" - Java 如何支持同步\n\n本节描述了\
  \ `synchronized` 关键字以及 Java 如何通过 3 种方式支持同步——同步类方法、同步实例方法、同步语句块。\n\nJava 并不是让程序员自己设计锁、管理同步块并应用同步规则，而是在每个\
  \ `Object` 类的实例上提供了一个同步监控器（monitor），以便可以用作同步锁。由于所有类都是 `Object` 的子类，因此 Java 中的所有对象都可以作为同步锁。\n\
  \nJava 还提供了三种定义同步块的方法。\n\n### 同步类方法\n\n```\n class class_name {\n   static synchronized\
  \ type method_name() {\n      statement block\n   }\n}\n```\n\n方法中的所有语句都成为同步块，类对象就是锁。\n\
  \n### 同步实例方法\n\n```\n class class_name {\n   synchronized type method_name() {\n\
  \      statement block\n   }\n}\n```\n\n方法中的所有语句都成为同步块，实例对象就是锁。\n\n### 同步语句\n\n\
  ```\n class class_name {\n   type method_name() {\n      synchronized (object) {\n\
  \         statement block\n      }\n   }\n}\n```\n\n同步语句括号中指定的所有语句都成为同步块，语句中指定的\
  \ `object` 就是锁。\n\nJava 通过将锁的监控器所有权分配给运行同步块的线程来应用同步规则。其工作原理如下：\n\n- 当执行线程到达同步点（clock）时，它将尝试获取锁\
  \ `object` 监控器的所有权。如果另一个线程拥有锁的监控器，它将等待。\n- 一旦锁的监控器空闲，等待线程将成为监控器的所有者，并开始执行同步块。\n\
  - 一旦同步块执行完毕，监控器将再次释放。\n\n注意，一个程序可以有很多锁，每个锁可以与许多不同的同步块关联。但同步规则仅适用于同步块与其关联锁之间。\n\n\
  例如，以下代码定义了两个同步块。它们都与同一个锁（实例对象）关联。\n\n```\n class class_name {\n   type method_name()\
  \ {\n      synchronized (this) {\n         statement block 1\n      }\n   }\n  \
  \ synchronized type method_name() {\n      statement block 2\n   }\n}\n```\n\n块\
  \ 1 永远不会与块 2 同时执行。\n\n以下代码定义了两个同步块。但它们关联到两个不同的锁，一个是类对象，另一个是实例对象。这两个同步块永远不会互相等待。\n\
  \n```\n class class_name {\n   type method_name() {\n      synchronized (this) {\n\
  \         statement block 1\n      }\n   }\n   static synchronized type method_name()\
  \ {\n      statement block 2\n   }\n}\n```\n\nJava 教程 - Herong 的教程示例\n\n∟同步技术与同步代码块\n\
  \n∟BankingThread.java - 同步示例\n\n本节提供了关于如何使用 Java 同步方法解决银行问题的示例。现在，让我们编写一个 Java 程序来看看同步技术如何解决银行问题。这两个类设计了一个银行系统：\n\
  \n- `BankingThread` 类：充当 ATM 机，接收客户的存款或取款请求，并要求 `BankingMain` 类执行交易。\n- `BankingMain`\
  \ 类：充当控制中心，管理 `BankingThread` 实例，并处理来自每个 `BankingThread` 的交易。\n\n`BankingThread`\
  \ 类：\n\n```\n BankingThread.java\n * Copyright (c) Herong.com. All Rights Reserved.\n\
  \ */\nimport java.util.*;\npublic class BankingThread extends Thread {\n   private\
  \ long[] t_balance; // 账户余额\n   private long t_count; // 已完成交易次数\n   public BankingThread(ThreadGroup\
  \ g, String n) {\n      super(g,n);\n      t_count = 0;\n      int m = BankingMain.accountCount();\n\
  \      t_balance = new long[m];\n      for (int i=0; i<m; i++) t_balance[i] = 0;\n\
  \   }\n   public long transactionCount() {\n      return t_count;\n   }\n   public\
  \ long getBalance(int i) {\n      return t_balance[i];\n   }\n   public void run()\
  \ {\n      while (!isInterrupted()) {\n         t_count++;\n         Random r =\
  \ BankingMain.getRandom();\n         long t_step = BankingMain.getStep();\n    \
  \     int m = BankingMain.accountCount();\n         int n = r.nextInt(m); // 账户号码\n\
