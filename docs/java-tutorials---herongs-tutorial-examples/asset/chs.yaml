  \  AddRegister<String> test = new AddRegister<String>();\n                  ^\n\
  \  where T is a type-variable:\n    T extends Number declared in class AddRegister\n\
  AddRegister.java:28: error: type argument String is not within bounds\n   of type-variable\
  \ T\n      AddRegister<String> test = new AddRegister<String>();\n             \
  \                                    ^\n  where T is a type-variable:\n    T extends\
  \ Number declared in class AddRegister\n2 errors\n```\n\nJava 教程 - Herong 的教程示例\n\
  \n∟泛型类与参数化类型\n\n## 原始类型（Raw Type）、泛型类型（Generic Type）和参数化类型（Parameterized Type）\n\
  \n本节提供了一个教程示例，说明旧应用程序如何继续使用原始类型而不是参数化类型。但编译器会给你“未检查或不的操作”（unchecked or unsafe operations）警告。\n\
  \n### 什么是泛型类型？\n泛型类型是使用类型参数的泛型类或接口。\n\n### 什么是参数化类型？\n参数化类型是泛型类或接口的参数化版本。例如，`Vector<String>`\
  \ 是参数化类型。\n\n### 什么是原始类型？\n原始类型是省略了参数类型参数的参数化类型。例如，`Vector` 是原始类型。\n\nJava 支持原始类型以保持旧应用程序的运行。在大多数情况下，原始类型等于以\
  \ `\"Object\"` 作为类型参数的参数化类型。\n\n这是一个仍然使用 `Vector<E>` 泛型类原始类型的旧版示例。\n\n```\n /* RawTypeTest.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nimport java.util.*;\n\
  class RawTypeTest {\n   public static void main(String[] a) {\n      java.io.PrintStream\
  \ o = System.out;\n\n      Vector myList = new Vector();\n      myList.add(new String(\"\
  Milk\"));\n      myList.add(Float.valueOf(\"3.99\"));\n\n      String name = (String)\
  \ myList.get(0);\n      Float price = (Float) myList.get(1);\n      o.println(name+\"\
  : \"+price);\n   }\n}\n```\n\n编译并运行此示例。你将得到：\n\n```\n herong> javac RawTypeTest.java\n\
  \nNote: RawTypeTest.java uses unchecked or unsafe operations.\nNote: Recompile with\
  \ -Xlint:unchecked for details.\n\nherong> java RawTypeTest\nMilk: 3.99\n```\n\n\
  如你所示，编译器允许你使用原始类型。但它给出了“未检查或不的操作”警告。如果你用 `-Xlint` 重新编译，你将看到更多细节：\n\n```\n herong>\
  \ javac -Xlint RawTypeTest.java\n\nRawTypeTest.java:9: warning: [rawtypes] found\
  \ raw type: Vector\n      Vector myList = new Vector();\n      ^\n  missing type\
  \ arguments for generic class Vector<E>\n  where E is a type-variable:\n    E extends\
  \ Object declared in class Vector\nRawTypeTest.java:9: warning: [rawtypes] found\
  \ raw type: Vector\n      Vector myList = new Vector();\n                      \
  \    ^\n  missing type arguments for generic class Vector<E>\n  where E is a type-variable:\n\
  \    E extends Object declared in class Vector\nRawTypeTest.java:10: warning: [unchecked]\
  \ unchecked call to add(E) as\na member of the raw type Vector\n      myList.add(new\
  \ String(\"Milk\"));\n                ^\n  where E is a type-variable:\n    E extends\
  \ Object declared in class Vector\nRawTypeTest.java:11: warning: [unchecked] unchecked\
  \ call to add(E) as\na member of the raw type Vector\n      myList.add(Float.valueOf(\"\
  3.99\"));\n                ^\n  where E is a type-variable:\n    E extends Object\
  \ declared in class Vector\n4 warnings\n```\n\nJava 教程 - Herong 的教程示例\n\n∟泛型类与参数化类型\n\
  \n## 参数化类型子化（Parameterized Type and Subtyping）\n\n本节描述了源自泛型类或接口的参数化类型的子类型关系。\n\n\
  泛型类的参数化类型根据以下规则形成子类型关系：\n\n1. 如果两个泛型类或接口具有子类型关系，它们在使用相同的参数类型时也具有子类型关系。例如：\n\n```\n\
  \ // 声明的类\n   class LinkedHashSet<E> extends HashSet<E> {}\n\n   // 有效的子类型关系\n \
  \  // supertype: HashSet<Integer>\n   // subtype: LinkedHashSet<Integer>\n```\n\n\
  2. 如果泛型类或接口使用两个参数类型进行参数化，生成的参数化类型不具有子类型关系。例如：\n\n```\n // 声明的类\n   class ObjectRegister<E>\
  \ {}\n\n   // 无效的子类型关系\n   // supertype: ObjectRegister<Number>\n   // subtype:\
  \ ObjectRegister<Integer>\n```\n\n下面的图向你展示了参数化类型子类型的一些示例：\n\n![](img/image182.jpeg)\n\
  \n# Java 参数化类型子化\n\nJava 教程 - Herong 的教程示例\n\n∟泛型类与参数化类型\n\n## 通配符参数化类型（Wildcard\
  \ Parameterized Types）\n\n本节描述参数类型包含通配符字符 `?` 并代表一组类型的通配符参数化类型。\n\n### 什么是通配符类型？\n\
  泛型类型是泛型类或接口的参数化类型，其参数类型代表一组类型，而不是单一类型。\n\n使用通配符类型的目的是创建一个比普通参数化类型更宽的参数化类型，以便作为普通参数化类型的父类型使用。这里有一些通配符参数化类型的示例：\n\
  \n```\n java.util.List<?> a;\n   java.util.List<? extends Number> b;\n   java.util.List<?\
  \ extends Integer> c;\n   java.util.List<? super Integer> d;\n```\n\n通配符参数化类型可以分为三组：\n\
  \n*   无界通配符参数化类型使用 `<?>` 语法创建同泛型类所有其他参数化类型的父类型。例如，`java.util.List<?>` 是 `java.util.List<Number>`\
  \ 的父类型。\n\n*   上界通配符参数化类型使用 `<? extends T>` 语法创建同泛型类中参数类型窄于 `T` 的参数化类型的父类型。例如，`java.util.List<?\
  \ extends Number>` 是 `java.util.List<Integer>` 的父类型。\n\n\n\n\n\n# 下界通配符参数化类型\n\n\
  语法为 `<? super T>` 的下界通配符参数化类型创建了相同泛型类中参数类型比 `T` 更宽的参数化父类型。例如，`java.util.List<? super\
  \ Integer>` 是 `java.util.List<Number>` 的父类型。\n\n下面的图展示了通配符参数化类型与参数化类型之间的一些类型子类型关系示例：\n\
  \n![](img/image00183.jpeg)\n\nJava 通配符参数化类型子类型\n\nJava 教程 - Herong 的教程示例\n\n∟泛型类与参数化类型\n\
  \n∟通配符参数化类型测试\n\n## 通配符参数化类型测试\n\n本节提供了一个关于如何使用通配符参数化类型声明变量的教程示例。\n\n通配符参数化类型与参数化类型之间的父类-子类关系非常复杂。因此让我们尝试一个教程示例：\n\
  \n```\n /* WildcardParameterizedType.java\n * Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.util.*;\nclass WildcardParameterizedType {\n\
  \   public static void main(String[] a) {\n\n      // 记得类 Integer extends Number\
  \ {}\n      // 允许 - 从子类型到父类型的隐式转换\n      Vector<?> unbounded = new Vector<String>();\n\
  \      Vector<? extends Number> upperBounded = new Vector<Integer>();\n      Vector<?\
  \ super Integer> lowerBounded = new Vector<Number>();\n\n      unbounded = lowerBounded;\n\
  \      System.out.println(\"Initial capacity: \"+unbounded.capacity());\n\n    \
  \  // 不允许 - 编译错误\n      // Vector<String> paramString = unbounded;\n      // Vector<Integer>\
  \ paramInteger = upperBounded;\n      // Vector<Number> paramNumber = lowerBounded;\n\
  \   }\n}\n```\n\n如果你直接编译并运行此示例，将不会看到任何问题。\n\n但如果你取消那些不允许的行，你将在 JDK 8 中会看到这些编译错误：\n\
  \n```\n WildcardParameterizedType.java:18: error: incompatible types:\n Vector<CAP#1>\
  \ cannot be converted to Vector<String>\n      Vector<String> paramString = unbounded;\n\
  \                                   ^\n  where CAP#1 is a fresh type-variable:\n\
  \   CAP#1 extends Object from capture of ?\nWildcardParameterizedType.java:19: error:\
  \ incompatible types:\n Vector<CAP#1> cannot be converted to Vector<Integer>\n \
  \     Vector<Integer> paramInteger = upperBounded;\n                           \
  \          ^\n  where CAP#1 is a fresh type-variable:\n   CAP#1 extends Number from\
  \ capture of ? extends Number\nWildcardParameterizedType.java:20: error: incompatible\
  \ types:\n Vector<CAP#1> cannot be converted to Vector<Number>\n      Vector<Number>\
  \ paramNumber = lowerBounded;\n                                   ^\n  where CAP#1\
  \ is a fresh type-variable:\n   CAP#1 extends Object super: Integer from capture\
  \ of ? super Integer\n3 errors\n```\n\n编译器拒绝将通配符参数化类型向下转型回参数化类型。但你可以尝试进行显式向下转型，例如\
  \ `Vector<Integer> paramInteger = (Vector<Integer>) upperBounded;`。编译器仍然会给你发出“未检查或不安全的操作”（unchecked\
  \ or unsafe operations）的警告。\n\n注意，如果你使用的是 JDK 7，将得到略有不同的错误信息：\n\n```\n WildcardParameterizedType.java:18:\
  \ error: incompatible types\n      Vector<String> paramString = unbounded;\n   \
  \                                ^\n  required: Vector<String>\n  found:    Vector<CAP#1>\n\
  \  where CAP#1 is a fresh type-variable:\n   CAP#1 extends Object from capture of\
  \ ?\nWildcardParameterizedType.java:19: error: incompatible types\n      Vector<Integer>\
  \ paramInteger = upperBounded;\n                                     ^\n  required:\
  \ Vector<Integer>\n  found:    Vector<CAP#1>\n  where CAP#1 is a fresh type-variable:\n\
  \   CAP#1 extends Number from capture of ? extends Number\nWildcardParameterizedType.java:20:\
  \ error: incompatible types\n      Vector<Number> paramNumber = lowerBounded;\n\
  \                                   ^\n  required: Vector<Number>\n  found:    Vector<CAP#1>\n\
  \  where CAP#1 is a fresh type-variable:\n   CAP#1 extends Object super: Integer\
  \ from capture of ? super Integer\n3 errors\n```\n\nJava 教程 - Herong 的教程示例\n\n∟泛型类与参数化类型\n\
  \n∟通配符参数化子类型\n\n## 通配符参数化子类型\n\n本节描述了通配符参数化类型上的子类型规则。无界通配符参数化类型是所有其他类型的父类型。\n\n\
  更令通配符参数化类型感到困惑的是，通配符参数化类型也可以通过这些规则相互形成父-子类型关系：\n\n*   无界通配符参数化类型是相同泛型类中所有其他通配符参数化类型的父类型。例如，`java.util.List<?>`\
  \ 是 `java.util.List<? extends Number>` 的父类型。\n\n*   如果一个上界通配符参数化类型的边界类型是另一个上界通配符参数化类型边界类型的父类型，那么它就是相同泛型类中后者的一个上界通配符参数化类型的父类型。例如，`java.util.List<?\
  \ extends Number>` 是 `java.util.List<? extends Integer>` 的父类型。\n\n*   如果一个下界通配符参数化类型的边界类型是另一个下界通配符参数化类型边界类型的子类型，那么它就是相同泛型类中后者的一个下界通配符参数化类型的父类型。例如，`java.util.List<?\
  \ super Integer>` 是 `java.util.List<? super Number>` 的父类型。\n\n以下教程示例可能帮助你更好地理解通配符类型的子类型规则：\n\
  \n```\n /* WildcardParameterizedType.java\n * Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.util.*;\nclass WildcardParameterizedType {\n\
  \   public static void main(String[] a) {\n      // 记得类 Integer extends Number {}\n\
  \n      // 允许 - 从子类型到父类型的隐式转换\n      Vector<?> unbounded = new Vector<String>();\n\
  \      Vector<? extends Number> upperBounded = new Vector<Integer>();\n      Vector<?\
  \ super Integer> lowerBounded = new Vector<Number>();\n\n      unbounded = lowerBounded;\n\
  \      System.out.println(\"Initial capacity: \"+unbounded.capacity());\n\n    \
  \  // 不允许 - 编译错误\n      // Vector<String> paramString = unbounded;\n      // Vector<Integer>\
  \ paramInteger = upperBounded;\n      // Vector<Number> paramNumber = lowerBounded;\n\
  \   }\n}\n```\n\n如果你仍然困惑，请看下面的图片，它展示了参数化类型与通配符类型相互关系的示例：\n\n![](img/image00184.jpeg)\n\
  \nJava 通配符参数化子类型示例\n\nJava 教程 - Herong 的教程示例\n\n∟泛型类与参数化类型\n\n∟通配符参数化子类型示例\n\n##\
  \ 通配符参数化子类型示例\n\n本节提供了一个使用 `java.util.Hashtable` 类中的 `putAll()` 方法进行通配符参数化子类型的教程示例。\n\
  \n让我们看看通配符类型如何在 JDK 泛型类中使用的。这里是 JDK 1.7 中泛型类 `java.util.HashMap` 的一个很好的示例：\n\n```\n\
  \ package java.util;\nclass Hashtable<K,V> {\n   ...\n   void putAll(Map<? extends\
  \ K,? extends V> t) {}\n   ...\n}\n```\n\n我对 `putAll()` 定义的理解是：\n\n*   在类级别定义了两个参数类型：`K`\
  \ 和 `V`，其中 `K` 用于键对象，`V` 用于值对象。\n\n*   `putAll(Map<? extends K,? extends V> t)`\
  \ 意味着参数 `t` 需要的是 `Map<? extends K,? extends V>` 的通配符参数化类型。\n\n*   如果你创建一个 `Hashtable<K,V>`\
  \ 对象并尝试调用 `putAll()` 注入来自 `Map<S,T>` 对象的键值对，`putAll(Map<? extends K,? extends V>\
  \ t)` 声明将帮助编译器确保这些键值对与 `K` 和 `V` 兼容。\n\n下面的教程示例没有编译错误，因为在 `putAll()` 中提供的对象符合类型要求：\n\
  \n\n\n\n\n```java\n /* HashtablePutAll.java\n * Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.util.*;\nimport java.awt.*;\nimport javax.swing.*;\n\
  class HashtablePutAll {\n   public static void main(String[] a) {\n      // Hashtable\
  \ API:\n      //    Class Hashtable<K,V> {\n      //       void putAll(Map<? extends\
  \ K,? extends V> t) {}\n      //    }\n\n      Hashtable<Number,Container> hashNumberContainer\n\
  \         = new Hashtable<Number,Container>();\n\n      // allowed - Integer extends\
  \ Number & Box extends Container\n      HashMap<Integer,Box> mapIntegerBox = new\
  \ HashMap<Integer,Box>();\n      mapIntegerBox.put(Integer.valueOf(777), new Box(BoxLayout.X_AXIS));\n\
  \      hashNumberContainer.putAll(mapIntegerBox);\n      System.out.println(\"#\
  \ of entries: \"+mapIntegerBox.size());\n\n      // not allowed - Component does\
  \ not extend from Container\n      // HashMap<Number,Component> mapNumberComponent\n\
  \      //   = new HashMap<Number,Component>();\n      // hashNumberContainer.putAll(mapNumberComponent);\n\
  \   }\n}\n```\n\n但如果你取消示例中“不允许的”几行的注释，你将获得编译错误：\n\n```\n HashtablePutAll.java:26:\
  \ error: no suitable method found for\n   putAll(HashMap<Number,Component>)\n  \
  \     hashNumberContainer.putAll(mapNumberComponent);\n                        \
  \  ^\n    method Map.putAll(Map<? extends Number,? extends Container>) is\n    not\
  \ applicable\n      (argument mismatch; HashMap<Number,Component> cannot be\n  \
  \    converted to Map<? extends Number,? extends Container>)\n    method Hashtable.putAll(Map<?\
  \ extends Number,? extends Container>)\n    is not applicable\n      (argument mismatch;\
  \ HashMap<Number,Component> cannot be\n      converted to Map<? extends Number,?\
  \ extends Container>)\n1 error\n```\n\nJava 教程 - Herong 的教程示例\n\n# 泛型方法与类型推断\n\n\
  本章节提供了泛型方法和类型推断的教程笔记和示例代码。主题包括：什么是泛型方法；声明类型参数；指定类型参数；编译器执行类型参数推断；在参数化类型中使用类型参数。\n\
  \n- 什么是泛型方法\n- 泛型方法与非泛型方法的比较\n- 非泛型方法示例 - maxNonGeneric()\n- 泛型方法示例 - maxGeneric()\n\
  - java.util.Collections 类中的泛型方法\n- 在 Collections 类中测试泛型方法\n- 什么是类型参数推断\n- 通过参数列表进行类型参数推断\n\
  - 通过返回值进行类型参数推断\n- 使用参数化类型的泛型方法\n- 参数化类型作为泛型方法的返回类型\n\n### 结论：\n\n- 泛型方法使用一个或多个类型参数（也称为类型变量）来使其更具通用性，以便可以作为多种变体使用。\n\
  - 泛型方法的签名为 `<A, B, C, ...> SomeType someMethod(...)`，其中 `<A, B, C, ...>` 是类型参数。\n\
  - 类型参数可以被限制为 `<T extends C & I1 & I2...>`，以确保强类型并减少运行时的类型不匹配。\n- 在调用泛型方法时，可以将类型参数指定为\
  \ `someObject.<X,Y,...>someMethod(...)`。\n- 类型参数推断是编译器在泛型方法调用表达式中未指明类型参数时，所执行的以确定类型参数的过程。\n\
  \nJava 教程 - Herong 的教程示例\n\n# 泛型方法与类型推断](#part0093.xhtml)\n\n## 什么是泛型方法\n\n本节描述了什么是泛型方法、如何声明类型参数，以及如何在泛型方法定义中使用类型参数。\n\
  \n**什么是泛型方法？** 泛型方法是一种静态方法或实例方法，它使用一个或多个类型参数（也称为类型变量）来使其更具通用性，以便可以作为多种变体使用，每种变体对应于给类型参数的一组特定类型参数。\n\
  \n**如何为泛型方法声明类型参数？** 为泛型方法声明类型参数，你需要在返回类型之前指定类型参数，格式为括在角括号内的逗号分隔列表。例如，`static <T>\
  \ void someMethod(...){...}` 是一个声明了一个类型参数 `T` 的静态泛型方法。\n\n**什么是边界类型参数？** 边界类型参数是使用\
  \ `\"<T extends B>\"` 语法声明的带有超类边界限制的类型参数。实际上，一个普通的无边界类型参数也可以被视为超类边界类型为 `\"Object\"\
  ` 的边界类型参数。例如，`\"<T>\"` 等同于 `\"<T extends Object>\"`。\n\n**类型参数如何在方法参数列表中使用？** 一旦声明了类型参数，就可以在泛型方法的参数列表定义中使用，帮助定义每个参数的类型。例如，`static\
  \ <T> void someMethod(T o){...}` 使用类型参数 `T` 作为参数 `o`。\n\n**类型参数如何在方法返回类型中使用？** 一旦声明了类型参数，就可以在泛型方法的返回类型定义中使用，帮助定义返回值的类型。例如，`static\
  \ <T> T someMethod(){...}` 使用类型参数 `T` 作为返回类型。\n\n**类型参数如何在参数化类型中使用？** 一旦声明了类型参数，就可以在参数化类型中使用，帮助定义方法参数和返回值的类型。例如，`static\
  \ <T> Enumeration<T> someMethod(Collection<T> c){...}` 在参数化类型中使用类型参数 `T`。\n\n**调用泛型方法时如何指定类型参数？**\
  \ 在调用泛型方法时指定类型参数以替换类型参数，需要在 `.` 操作符之后提供类型参数，格式为括在角括号内的逗号分隔列表。例如，`SomeClass.<String>someMethod(...)`\
  \ 是调用类型参数为 String 的泛型方法的表达式。\n\n**为什么要使用泛型方法？** 使用泛型方法的主要优势是可以在不使用类型转换的情况下，开发一个支持方法接口数据类型的单一方法。生成的源代码类型更安全且可读性更好。\n\
  \n在下一节中，我们将比较泛型方法和非泛型方法，以查看我们通过使用泛型方法获得了什么。\n\n\n\n\n\n```\n String max = (String)\
  \ maxNonGeneric(\n   new String(\"1234\"), new String(\"789\")); //正确调用\n\nString\
  \ max = (String) maxNonGeneric(\n   new String(\"1234\"), new Integer(\"789\"));\
  \ // 运行时异常\n\nInteger max = (Integer) maxNonGeneric(\n   new String(\"1234\"), new\
  \ String(\"789\")); // 运行时异常\n```\n\n以下是我针对相同需求的泛型版本方法：\n\n```java\n public static\
  \ <T extends Comparable<T>> T maxGeneric(T a, T b) {}\n```\n\n此定义在方法签的类型要求方面现在变得更强大得多：\n\
  \n- 类型参数 `T` 必须限制为 `Comparable<T>` 的子类。\n- 两个参数 `a` 和 `b` 必须与类型参数 `T` 的类型相同。\n-\
  \ 返回值将与类型参数 `T` 的类型相同。\n\n现在，当程序员尝试调用这个泛型方法时，他们仍然有可能犯下同样的错误。但由于方法的定义更加严格，编译器将捕获这些错误。生成的字节码发生运行时异常的概率会降低。\n\
  \n```\n String max = SomeClass.<String>maxGeneric(\n   new String(\"1234\"), new\
  \ String(\"789\"));\n   // 正确调用。源码中不需要 (String) 强制转换。\n\nInteger max = SomeClass.<String>maxGeneric(\n\
  \   new String(\"1234\"), new String(\"789\")); // 编译错误\n\nString max = SomeClass.<String>maxGeneric(\n\
  \   new String(\"1234\"), new Integer(\"789\")); // 编译错误\n```\n\n注意，类名 `SomeClass`\
  \ 是必要的，因为类型参数 `<String>` 需要出现在点（`.`)运算符之后。\n\nJava 教程 - Herong 的教程示例\n\n泛型方法与类型推断\n\
  \n## 非泛型方法示例 - `maxNonGeneric()`\n\n本节提供了一个非泛型方法 `maxNonGeneric()` 的教程示例，展示了类型兼容性错误在编译时不会被检测。\n\
  \n为了支持我们在上一节提供的分析，我编写了以下教程示例来实现并测试该非泛型方法：\n\n```java\n /* MaxNonGenericMethod.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nclass MaxNonGenericMethod\
  \ {\n   public static Comparable maxNonGeneric(\n      Comparable a, Comparable\
  \ b) {\n      if (a.compareTo(b)>=0) {\n         return a;\n      } else {\n   \
  \      return b;\n      }\n   }\n   public static void main(String[] a) {\n    \
  \  String max = (String) maxNonGeneric(\n         new String(\"1234\"), new String(\"\
  789\"));\n      System.out.println(\"Maximum: \"+max);\n\n      // 错误 1：调用 compareTo()\
  \ 时发生运行时异常\n      String max1 = (String) maxNonGeneric(\n         new String(\"\
  1234\"), Integer.valueOf(\"789\"));\n\n      // 错误 2：强制转换返回值时发生运行时异常\n      Integer\
  \ max2 = (Integer) maxNonGeneric(\n         new String(\"1234\"), new String(\"\
  789\"));\n   }\n}\n```\n\n如果你编译并运行这个教程示例，你将得到：\n\n```\n herong> javac MaxNonGenericMethod.java\n\
  \nNote: MaxNonGenericMethod.java 使用了未检查或不的操作。\nNote: 请使用 -Xlint:unchecked 重新编译。\n\
  \nherong> java MaxNonGenericMethod\n\nMaximum: 789\nException in thread \"main\"\
  \ java.lang.ClassCastException:\n   java.base/java.lang.Integer cannot be cast to\
  \ java.base/java.lang.String\n        at java.base/java.lang.String.compareTo(String.java:124)\n\
  \        at MaxNonGenericMethod.maxNonGeneric(MaxNonGenericMethod.java:7)\n    \
  \    at MaxNonGenericMethod.main(MaxNonGenericMethod.java:19)\n```\n\n从输出可以看出，编译器没有捕获\
  \ `(String max1 = (String) maxNonGeneric(new String(\"1234\"), new Integer(\"789\"\
  ));)` 调用中的第一个类型兼容性错误。生成的字节码在调用 `compareTo()` 时遇到了类转换异常。\n\n如果注释掉第 19 行到第 20 行并重新运行程序：\n\
  \n```\n herong> javac MaxNonGenericMethod.java\n\nNote: MaxNonGenericMethod.java\
  \ 使用了未检查或不的操作。\nNote: 请使用 -Xlint:unchecked 重新编译。\n\nherong> java MaxNonGenericMethod\n\
  \nMaximum: 789\nException in thread \"main\" java.lang.ClassCastException:\n   java.base/java.lang.String\
  \ cannot be cast to java.base/java.lang.Integer\n        at MaxNonGenericMethod.main(MaxNonGenericMethod.java:23)\n\
  ```\n\n从输出可以看出，编译器没有捕获 `(Integer max2 = (Integer) maxNonGeneric(new String(\"1234\"\
  ), new String(\"789\"));)` 调用中的第二个类型兼容性错误。生成的字节码在将返回值赋值给 `max2` 时遇到了另一个类转换异常。\n\n\
  **结论**：非泛型方法会导致类型兼容性错误在编译时无法被检测。这导致了运行时异常的高概率发生。\n\nJava 教程 - Herong 的教程示例\n\n泛型方法与类型推断\n\
  \n## 泛型方法示例 - `maxGeneric()`\n\n本节提供了一个泛型方法 `maxGeneric()` 的教程示例，展示了兼容性错误在编译时会被检测。\n\
