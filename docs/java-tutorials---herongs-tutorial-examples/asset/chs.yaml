  \n∟控制流语句\n\n∟\"continue\" 语句\n\n本节描述了非标签 'continue' 语句，这是一种分支语句，将控制转移到相邻循环块的结尾并继续循环的下一次迭代。\n\
  \n\"continue\" 语句有两种形式：非标签 \"continue\" 和 标签 \"continue\" 语句。\n\n### 什么是非标签 \"continue\"\
  \ 语句？\n非标签 \"continue\" 语句是一种将控制转移到相邻循环块结尾并继续循环下一次迭代的分支语句。\n\n非标签 \"continue\" 语句的语法如下：\n\
  \n```\n while|do|for ... { // continue here\n   ...\n   continue\n   ...\n}\n```\n\
  \n注意，“continue\"语句不能用于 switch、while、do 或 for 语句以外的语句。以下是一个展示如何使用非标签 \"continue\"\
  \ 语句的示例程序：\n\n```java\nimport java.util.*; /* ContinueTest.java\n * Copyright (c)\
  \ HerongYang.com.\n\n.*;\n. java.file.*;\nimport java.time.*;\nclass ContinueStatement\
  \ {\n   public static void main(String[] arg) {\n      java.io.PrintStream out =\
  \ System.out;\n\n      out.println(\"\\\"continue\\\" statement in a single-level\
  \ loop:\");\n      long bytes = 0;\n      int counts = 0;\n      Path dir = FileSystems.getDefault().getPath(arg[0]);\n\
  \      try {\n         DirectoryStream<Path> stream = Files.newDirectoryStream(dir);\n\
  \         for (Path path : stream) { // continue here\n            if (path.isDirectory())\
  \ continue;\n            bytes += path.toFile().length();\n            counts++;\n\
  \         }\n      } catch (Exception e) {\n         e.printStackTrace();\n    \
  \  }\n      out.println(\"   # of files: \"+counts);\n      out.println(\"   total\
  \ bytes: \"+bytes);\n\n      out.println(\"\\\"continue\\\" statement in a two-level\
  \ loop:\");\n      LocalDate now = LocalDate.now();\n      int year = now.getYear();\n\
  \n      for (int y = year-5; y < year; y++) {\n         counts = 0;\n         LocalDate\
  \ d = LocalDate.of(y, 1, 1);\n\n         for ( ; d.getYear() == y; d = d.plusDays(1)\
  \ ) { // continue here\n\n            if (d.getDayOfWeek() != DayOfWeek.SUNDAY)\
  \ continue;\n            counts++;\n         }\n         out.println(\"   \"+counts+\"\
  \ Sundays in year \"+y);\n      }\n   }\n}\n```\n\n如果你编译并运行上述程序，你将看到：\n\n```\n herong>\
  \ java ContinueStatement.java\n\n\"continue\" statement in a single-level loop:\n\
  \   # of files: 13\n   total bytes: 11827\n\n\"continue\" statement in a two-level\
  \ loop:\n   52 Sundays in year 2015\n   52 Sundays in year 2016\n   53 Sundays in\
  \ year 2017\n   52 Sundays in year 2018\n   52 Sundays in year 2019\n```\n\n###\
  \ 标签 \"continue\" 语句\n标签 \"continue\" 语句是一种将控制转移到带标签循环块结尾并继续标签循环下一次迭代的分支语句。\n\n\
  标签 \"continue\" 语句的语法如下：\n\n```\n loop_label : while|do|for ... { // continue here\n\
  \   ...\n   while|do|for ... {\n      ...\n      continue loop_label\n      ...\n\
  \   }\n   ...\n}\n```\n\n注意，“continue\"语句不能用于 switch、while、do 或 for 语句以外的语句。以下是一个展示如何使用\
  \ 标签 \"continue\" 语句的示例程序：\n\n```java\nimport java.util.*; /* LabeledContinue.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\nimport java.io.*;\n\
  import java.nio.file.*;\nimport java.time.*;\nclass LabeledContinue {\n   public\
  \ static void main(String[] arg) {\n      java.io.PrintStream out = System.out;\n\
  \n      out.println(\"\\\"continue\\\" statement in a single-level loop:\");\n \
  \     long bytes = 0;\n      int counts = 0;\n      Path dir = FileSystems.getDefault().getPath(arg[0]);\n\
  \      try {\n         DirectoryStream<Path> stream = Files.newDirectoryStream(dir);\n\
  \         for (Path path : stream) { // continue here\n            if (path.isDirectory())\
  \ continue;\n            bytes += path.toFile().length();\n            counts++;\n\
  \         }\n      } catch (Exception e) {\n         e.printStackTrace();\n    \
  \  }\n      out.println(\"   # of files: \"+counts);\n      out.println(\"   total\
  \ bytes: \"+bytes);\n\n      out.println(\"\\\"continue\\\" statement in a two-level\
  \ loop:\");\n      LocalDate now = LocalDate.now();\n      int year = now.getYear();\n\
  \n      outerLoop: for (int y = year-5; y < year; y++) {\n         counts = 0;\n\
  \         LocalDate d = LocalDate.of(y, 1, 1);\n\n         for ( ; d.getYear() ==\
  \ y; d = d.plusDays(1) ) { // continue here\n\n            if (d.getDayOfWeek()\
  \ != DayOfWeek.SUNDAY) continue outerLoop;\n            counts++;\n         }\n\
  \         out.println(\"   \"+counts+\" Sundays in year \"+y);\n      }\n   }\n\
  }\n```\n\n如果你编译并运行上述程序，你将看到：\n\n```\n herong> java LabeledContinue.java .\n\n\"\
