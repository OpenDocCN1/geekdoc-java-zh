  \ 类中的泛型方法\n\n本节提供了我对 `java.util.Collections` 类中定义的一些泛型方法的理解。\n\n在之前的章节中，我们学习了如何读取泛型方法的定义。现在让我们来看\
  \ `java.util.Collections` 类中定义的一些泛型方法，看看我们是否理解它们的定义。\n\n*   `<T> List<T> singletonList(T\
  \ o)` - 创建一个包含 `T` 对象的 `List`。在本例中，泛型类型被用作返回类型。\n*   `<T> List<T> nCopies(int n,\
  \ T o)` - 创建一个包含 `n` 次重复 `T` 对象的 `List`。\n*   `<T> Enumeration<T> enumeration(Collection<T>\
  \ c)` - 从给定的 `T` 的 `Collection` 返回 `T` 的 `Enumeration`（枚举器）。在本例中，泛型类型被用作方法参数。\n\
  *   `<T> ArrayList<T> list(Enumeration<T> e)` - 将 `T` 的 `Enumeration` 转换为 `T` 的\
  \ `ArrayList`。\n*   `<T> boolean replaceAll(List<T> list, T oldVal, T newVal)` -\
  \ 在类型为 `T` 的 `List` 中查找并将旧对象替换为 `T` 的新对象。\n*   `<T> void fill(List<? super T> list,\
  \ T obj)` - 用一个 `T` 对象填充 `T` 的任何父类类型的 `List`。在本例中使用了通配符泛型类型。\n*   `<T> void copy(List<?\
  \ super T> dest, List<? extends T> src)` - 将 `T` 的任何子类的 `List` 拷贝到 `T` 的父类 `List`\
  \ 中。\n*   `<T> List<T> emptyList()` - 返回一个空的 `T` `List`。\n*   `<T> int binarySearch(List<?\
  \ extends Comparable<? super T>> list, T key)` - 在 `Comparable<? super T>` 的任何子类的\
  \ `List` 中搜索类型为 `T` 的 `\"key\"` 并返回 `\"key\"` 的索引。在本例中使用了嵌套通配符泛型类型。\n*   `<T extends\
  \ Object & Comparable<? super T>> T max(Collection<? extends T> coll)` - 根据元素的自然排序返回给定集合中的最大元素。\n\
  *   `<T extends Comparable<? super T>> void sort(List<T> list)` - 根据元素的自然排序将指定的列表按升序排序。\n\
  \n请查看下一节关于如何使用这些泛型方法的教程示例。\n\n# Java 教程 - Herong 教程示例\n\n# 泛型方法与类型推断\n\n## Collections\
  \ 类中泛型方法的测试\n\n本节提供了一个关于测试 `java.util.Collections` 类中提供的泛型方法的教程示例。\n\n如果你想练习如何使用泛型方法，可以参考下面的教程示例：\n\
  \n```java\n /* CollectionsGenericMethods.java\n * Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n */\nimport java.util.*;\nclass CollectionsGenericMethods\
  \ {\n   public static void main(String[] a) {\n      java.io.PrintStream o = System.out;\n\
  \n      // 获取一个包含单个 String 的 List\n      List<String> myList\n         = Collections.<String>singletonList(\"\
  Java\");\n\n      // 获取其 String 的 Enumeration\n      Enumeration<String> myEnum\n\
  \         = Collections.<String>enumeration(myList);\n\n      // 转换为 String 的 ArrayList\n\
  \      ArrayList<String> myArrayList\n          = Collections.<String>list(myEnum);\n\
  \n      // 添加更多元素\n      myArrayList.add(\"Bean\");\n      myArrayList.add(\"Language\"\
  );\n      myArrayList.add(\"Coffee\");\n\n      // 列表排序\n      Collections.<String>sort(myArrayList);\n\
  \n      // 获取最小元素\n      String min\n         = Collections.<String>min(myArrayList);\n\
  \n      // 找到最小元素的位置\n      int loc =\n         Collections.<String>binarySearch(myArrayList,\
  \ min);\n\n      // 显示位置和值\n      o.println(\"Minimum element, \"+min+\", is at\
  \ \"+loc);\n   }\n}\n```\n\n编译并运行该示例，你应该看到没有编译错误和运行时异常。结果看起来是正确的：\n\n```\n Minimum\
  \ element, Bean, is at 0\n```\n\n# Java 教程 - Herong 教程示例\n\n# 泛型方法与类型推断\n\n## 什么是类型推断\n\
  \n本节描述了在调用泛型方法时，编译器用于确定类型参数的类型推断。\n\n### 什么是类型推断？\n类型推断是编译器在调用泛型方法时，确定实际类型参数的过程。在实例化泛型类对象时也会发生类型推断。更多细节请参阅本书的其他部分。\n\
  \n### 为什么需要类型推断？\n只有在你没有指定类型参数时，才需要类型推断。\n\n当如下所示在类型列表中指定类型时，编译器知道类型参数是什么，不需要执行类型推断：\n\
  \n```java\n // 不需要类型推断\n   Collections.<String>sort(myArrayList);\n```\n\n当如下所示未指定类型时，编译器不知道类型参数是什么，它将执行类型推断来确定类型参数：\n\
  \n```java\n // 需要类型推断\n   Collections.sort(myArrayList);\n```\n\n我个人总是会显式指定类型参数以避免类型推断，因为编译器可能会推导出错误的类型参数导致类型不兼容问题。但如果你是一个懒程序员，可以冒险让编译器为你工作。\n\
  \n### 如何进行类型推断？\n如果你在调用泛型方法时没有指定类型参数，编译器将根据以下规则执行类型推断过程：\n\n*   如果类型参数在一个方法参数中使用，编译器将查看对应参数的类型以推断类型参数。\n\
  *   如果类型参数在多个方法参数中使用，编译器将查看所有对应参数的类型以推断单个类型参数。如果不可行，则抛出编译错误。\n*   如果类型参数没有在任何方法参数中使用，它将用于返回值的类型。编译器将查看调用该方法的表达式上下文来推断类型参数。\n\
  *   如果编译器未能从上下文中推断出类型参数，它将使用默认类型参数 `Object`。\n\n接下来的章节将展示编译器如何进行类型推断的示例。\n\n# Java\
  \ 教程 - Herong 教程示例\n\n# 泛型方法与类型推断\n\n## 通过参数列表的类型推断\n\n本节提供了一个通过参数列表进行类型推断的教程示例。如果类型参数在方法参数列表中使用，编译器将通过查看方法参数列表的实际参数来推断类型参数。\n\
  \n\n\n\n\n```java\n /* TypeInferenceByParameter.java\n * Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n */\nclass TypeInferenceByParameter {\n   public static\
  \ <T extends Comparable<T>> T maxGeneric(T a, T b) {\n      if (a.compareTo(b)>=0)\
  \ {\n         return a;\n      } else {\n         return b;\n      }\n   }\n   public\
  \ static void main(String[] a) {\n      String as = \"1234\";\n      String bs =\
  \ \"789\";\n      Integer ai = Integer.valueOf(1234);\n      Long bl = Long.valueOf(789);\n\
  \n      /* 测试 1 - 类型参数指定为 String */\n      String ms\n         = TypeInferenceByParameter.<String>maxGeneric(as,\
  \ bs);\n      System.out.println(\"Maximum: \"+ms);\n\n      /* 测试 2 - 通过查看参数 as\
  \ 和 bs，将类型参数推断为 String\n      Object os = TypeInferenceByParameter.maxGeneric(as,\
  \ bs);\n      System.out.println(\"Maximum: \"+os);\n      */\n\n      /* 测试 3 -\
  \ 类型参数推断失败，\n                  无法推导出单一类型\n      Long ml = TypeInferenceByParameter.maxGeneric(ai,\
  \ bl);\n      System.out.println(\"Maximum: \"+ml);\n      */\n\n      /* 测试 4 -\
  \ 类型参数推断失败，\n                  无法推导出 Comparable 的子类型\n      Integer mi = TypeInferenceByParameter.maxGeneric(\n\
  \         (Number)ai, (Number)bl);\n      System.out.println(\"Maximum: \"+mi);\n\
  \      */\n\n      /* 测试 5 - 类型参数推断为 Short\n                  但发生了运行时异常\n      Number\
  \ mn = TypeInferenceByParameter.maxGeneric(\n         (Short)(Number)ai, (Short)(Number)bl);\n\
  \      System.out.println(\"Maximum: \"+mn);\n      */\n   }\n}\n```\n\n在测试 1 中，我没有使用类型参数推断。因此，没有编译错误和运行时异常。执行结果是正确的：\n\
  \n```\n Maximum: 789\n```\n\n在测试 2 中，我让编译器进行类型推断。编译器很好地将类型参数推断为 \"String\"，结果也是正确的：\n\
  \n```\n Maximum: 789\nMaximum: 789\n```\n\n在测试 3 中，我故意在参数列表中提供了不一致的类型 \"ai, bl\"\
  。JDK 1.7 编译器在类型推断过程中失败了，并给我返回了此编译错误。错误信息说推断出的类型为 `INT#1` 且不符合 get 声明的边界。但我发现根本原因是找到的类型\
  \ `Integer,Long` 不匹配所需的类型 `T,T`，其中两个类型必须是相同的类型：\n\n```\n TypeInferenceByParameter.java:31:\
  \ error: method maxGeneric in class\nTypeInferenceByParameter cannot be applied\
  \ to given types;\n      Long ml = TypeInferenceByParameter.maxGeneric(ai, bl);\n\
  \                                        ^\n  required: T,T\n  found: Integer,Long\n\
  \  reason: inferred type does not conform to declared bound(s)\n    inferred: INT#1\n\
  \    bound(s): Comparable<INT#1>\n  where T is a type-variable:\n    T extends Comparable<T>\
  \ declared in method <T>maxGeneric(T,T)\n  where INT#1,INT#2 are intersection types:\n\
  \    INT#1 extends Number,Comparable<? extends INT#2>\n    INT#2 extends Number,Comparable<?>\n\
  ```\n\n在 JDK 1.8 中，测试 3 的编译错误信息更完善了：\n\n```\n TypeInferenceByParameter.java:31:\
  \ error: method maxGeneric in class\n   TypeInferenceByParameter cannot be applied\
  \ to given types;\n      Long ml = TypeInferenceByParameter.maxGeneric(ai, bl);\n\
  \                                        ^\n  required: T,T\n  found: Integer,Long\n\
  \  reason: inference variable T has incompatible bounds\n    equality constraints:\
  \ Integer,Long\n    lower bounds: Long,Integer\n  where T is a type-variable:\n\
  \    T extends Comparable<T> declared in method <T>maxGeneric(T,T)\n1 error\n```\n\
  \n在测试 4 中，我确实提供了一致的类型 \"Number,Number\"。但 \"Number\" 不是 \"Comparable\" 的子类型。因此编译器再次失败，并给出了适当的消息，说明推断类型为\
  \ \"Number\" 且不符合声明的边界。\n\n```\n TypeInferenceByParameter.java:37: error: method\
  \ maxGeneric in class\n   TypeInferenceByParameter cannot be applied to given types;\n\
  \      Integer mi = TypeInferenceByParameter.maxGeneric(\n                     \
  \                      ^\n  required: T,T\n  found: Number,Number\n  reason: inferred\
  \ type does not conform to upper bound(s)\n    inferred: Number\n    upper bound(s):\
  \ Comparable<Number>\n  where T is a type-variable:\n    T extends Comparable<T>\
  \ declared in method <T>maxGeneric(T,T)\n1 error\n```\n\n在测试 5 中，我将两个参数对象都强制转换为了相同的类型\
  \ \"Short\"。编译器很很笨，将类型参数推断为 \"Short\" 且没有报错。但运行时捕获了类型转换问题并抛出了 \"ClassCastException\"\
  。\n\n```\n Maximum: 789\nException in thread \"main\" java.lang.ClassCastException:\n\
  java.lang.Integer cannot be cast to java.lang.Short\n   at TypeInferenceByParameter.java:44\n\
  ```\n\n\n\n\n在测试 3 中，编译器通过查看字符串拼接操作的预期类型，很好地推断出类型参数为 `\"String\"`。见下方的结果：\n\n```\n\
  \ Alias: 1234\nAlias: Hello 1234\n```\n\n在测试 4 中，编译器表现尚可，通过查看赋值操作的左侧，推断出类型参数为 `\"\
  Long\"`。但这导致了运行时的 `ClassCastException`：\n\n```\n Alias: 1234\nException in thread\
  \ \"main\" java.lang.ClassCastException:\n   java.lang.String cannot be cast to\
  \ java.lang.Long\nat TypeInferenceByReturnValue.main(TypeInferenceByReturnvalue.java:30)\n\
  ```\n\n在测试 5 中，编译器表现尚可，通过查看返回值上的转换操作，推断出类型参数为 `\"Short\"`。但这导致了运行时的 `ClassCastException`：\n\
  \n```\n Exception in thread \"main\" java.lang.ClassCastException:\njava.lang.String\
  \ cannot be cast to java.lang.Short\nat TypeInferenceByReturnValue.main(TypeInferenceByReturnvalue.java:36)\n\
  ```\n\n在测试 6 中，JDK 1.7 中的编译器未能推断出可以满足 `Integer.valueOf()` 要求的类型。它使用了默认类型 `\"Object\"\
  ` 作为类型参数，导致 `Integer.valueOf()` 发生编译错误：\n\n```\n TypeInferenceByReturnvalue.java:44:\
  \ error: no suitable method found\nfor valueOf(Object)\n         = Integer.valueOf(TypeInferenceByReturnValue.alias(s));\n\
  \                  ^\n    method Integer.valueOf(int) is not applicable\n      (actual\
  \ argument Object cannot be converted to int by method\n      invocation conversion)\n\
  \    method Integer.valueOf(String) is not applicable\n      (actual argument Object\
  \ cannot be converted to String by method\n      invocation conversion)\n    method\
  \ Integer.valueOf(String,int) is not applicable\n      (actual and formal argument\
  \ lists differ in length)\n```\n\n然而，JDK 1.8 中的编译器在测试 6 上没有生成任何错误。它返回了预期的结果 `\"\
  Alias: 1234\"`。\n\n如果你想看到更多使用泛型方法和类型参数推断的示例，请参见下一节。\n\nJava 教程 - Herong 的教程示例\n\n\
  ∟泛型方法与类型推断\n\n#### 使用参数化类型的泛型方法\n\n本节提供关于使用参数化类型的泛型方法的教程示例。在 `java.util.Collections`\
  \ 类的泛型方法 `singletonList()` 上提供了类型参数推断测试。\n\n在本节中，我想继续测试对在参数化类型中使用类型参数的泛型方法进行类型参数推断。这里是我关于测试\
  \ `Collections` 类中泛型方法 `\"<T> List<T> singletonList(T o)\"` 的第一个教程示例。\n\n```\n /*\
  \ GenericMethodSingletonList.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.util.*;\nclass GenericMethodSingletonList {\n   public static\
  \ void main(String[] a) {\n      testSingletonList();\n   }\n   public static void\
  \ testSingletonList() {\n      java.io.PrintStream o = System.out;\n      o.println(\"\
  Testing: <T> List<T> singletonList(T o)\");\n\n      String s = \"777\";\n     \
  \ List<String> ls = Collections.singletonList(s);\n      String e = ls.get(0);\n\
  \      o.println(\"   Class name of ls: \"+ls.getClass().getName());\n      o.println(\"\
  \   First element of ls: \"+e);\n\n      // 测试 1\\. 编译错误 - 类型不可转换\n      // List<String>\
  \ ls1 = Collections.singletonList((Object) s);\n\n      // 向上转换为通配符参数化类型\n     \
  \ List<?> lw = ls;\n\n      // 向上转换到父接口\n      Collection<String> cs = ls;\n\n \
  \     // 测试 2\\. 编译错误 - 类型不可转换\n      // List<Integer> li1 = (List<Integer>) ls;\n\
  \      // Collection<Integer> ci1 = (Collection<Integer>) ls;\n\n      // 测试 3\\\
  . 编译警告 - 未检查的或不安全的操作\n      // List<Integer> li2 = (List<Integer>) (List<?>) ls;\n\
  \      // o.println(\"   Class name of li2: \"+li2.getClass().getName());\n\n  \
  \    // 测试 4\\. 运行时异常 - 无法转换\n      // Integer e2 = li2.get(0);\n      // o.println(\"\
  \   First element of li2: \"+e2);\n   }\n}\n```\n\n编译并运行该示例，你将得到：\n\n```\n Testing:\
  \ <T> List<T> singletonList(T o)\n   Class name of ls: java.util.Collections$SingletonList\n\
  \   First element of ls: 777\n```\n\n观察调用泛型方法的语句（`List<String> ls = Collections.singletonList(s);`），以下是我对编译器如何进行类型推断以确定类型参数\
  \ `T` 的实际类型并对该语句进行类型检查的猜测：\n\n*   编译器查看输入对象 `s` 的类型，看到它的类型是 `String`。\n*   编译器根据输入对象推断类型参数\
  \ `T` 的实际类型应该是 `String`。\n*   编译器根据返回定义推断方法的返回类型应该是 `List<String>`。\n\n\n\n\n```\n\
  \ Testing: <T> List<T> singletonList(T o)\n   Class name of ls: java.util.Collections$SingletonList\n\
  \   First element of ls: 777\n   Class name of li2: java.util.Collections$SingletonList\n\
  Exception in thread \"main\" java.lang.ClassCastException:\n   java.lang.String\
  \ cannot be cast to java.lang.Integer\n        at GenericMethodSingletonList.testSingletonList\n\
  \        (GenericMethodSingletonList.java:37)\n        at GenericMethodSingletonList.main\n\
  \        (GenericMethodSingletonList.java:7)\n```\n\n但为什么根源所在的语句上没有运行时异常呢：`List<Integer>\
  \ li2 = (List<Integer>) (List<?>) ls;`？\n\n答案是 Java 实际上允许在运行时将 `List<String>` 强制转换为\
  \ `List<Integer>`。因为它们实际上是来自同一个类 `List<T>` 的对象，而在编译后的字节码中它实际上是 `List<Object>`。这被称为“类型擦除”。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟泛型方法与类型推断\n\n### 泛型类型作为泛型方法的类型\n\n本节提供了使用 `java.util.Collections`\
  \ 类中的泛型方法 `emptyList()` 的教程示例。类型参数仅用于返回类型的定义，而没有用于方法参数的定义。\n\n在之前的教程中，我们测试了 `<T>\
  \ List<T> singletonList(T o)` 泛型方法，并学习了编译器如何使用输入参数表达式进行类型参数推断，以确定类型参数 `T`。\n\n在本教程中，我们将看到如果类型参数\
  \ `T` 仅用于返回类型，编译器将如何确定其实际类型。这里有一个使用 `<T> List<T> emptyList()` 泛型方法的教程示例程序。\n\n```\n\
  \ /* GenericMethodsEmptyList.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.util.*;\nclass GenericMethodsEmptyList {\n   public static void\
  \ main(String[] a) {\n      testEmptyList();\n   }\n   public static void testEmptyList()\
  \ {\n      java.io.PrintStream o = System.out;\n      o.println(\"Testing: <T> List<T>\
  \ emptyList()\");\n\n      List<String> ls = Collections.emptyList();\n      o.println(\"\
  \   Class name of ls: \"+ls.getClass().getName());\n\n      List<?> lw = (List<?>)\
  \ Collections.emptyList();\n      o.println(\"   Class name of lw: \"+lw.getClass().getName());\n\
  \n      // 编译错误：不可转换的类型\n      // List<Number> ln = (List<Number>) Collections.emptyList();\n\
  \   }\n}\n```\n\n编译并运行示例，你将得到：\n\n```\n Testing: <T> List<T> emptyList()\n   Class\
  \ name of ls: java.util.Collections$EmptyList\n   Class name of lw: java.util.Collections$EmptyList\n\
  ```\n\n观察调用泛型方法的第一个语句（`List<String> ls = Collections.emptyList();`）和（`List<?> lw\
  \ = (List<?>) Collections.emptyList();`），关于编译器如何确定类型参数 `T` 的实际类型以及是否对语句进行类型检查，我的猜测如下：\n\
  \n*   编译器查看返回引用引用的表达式上下文，以确定类型参数 `T` 的实际类型应该是什么。\n*   编译器确定在第一种情况下，类型参数 `T` 的实际类型应该是\
  \ `String`（即 `List<String> ls = Collections.emptyList();`），因为期望的是 `List<String>`。\n\
  *   编译器确定在第二种情况下，类型参数 `T` 的实际类型应该是 `Object`（即 `List<?> lw = (List<?>) Collections.emptyList();`），因为强制转换操作可以作用于任何类型。因此，编译器使用默认类型\
  \ `Object` 作为类型参数。\n\n编译器使用默认类型 `Object` 作为类型参数的行为可以更好地演示，如果你取消 `List<Number> ln\
  \ = (List<Number>) Collections.emptyList();` 语句的注释并在 JDK 1.8 中尝试编译，你会看到此错误：\n\n\
  ```\n GenericMethodsEmptyList.java:20: error: incompatible types:\n   List<Object>\
  \ cannot be converted to List<Number>\n      List<Number> ln = (List<Number>) Collections.emptyList();\n\
  \                                                            ^\n1 error\n```\n\n\
  如果你用 JDK 1.7 编译，错误信息会有不同：\n\n```\n GenericMethodsEmptyList.java:20: error: inconvertible\
  \ types\n       List<Number> ln = (List<Number>) Collections.emptyList();\n    \
  \                                                         ^\n  required: List<Number>\n\
  \  found:    List<Object>\n1 error\n```\n\n错误中的 \"found: List<Object>\" 部分证实了编译器假设\
  \ (`Collections.emptyList();`) 具有默认类型 \"List<Object>\"。\n\nJava 教程 - Herong 的教程示例\n\
  \n# Lambda 表达式与方法引用\n\n本章提供了关于 Java 8 引入的 Lambda 表达式和方法引用的教程笔记。主题包括 Lambda 表达式语法；方法引用语法；单抽象方法接口（函数式接口）；以及在\
  \ stream 流水线操作中使用 Lambda 表达式。\n\n> 什么是 Lambda 表达式\n> LambdaCalculator.java - Lambda\
  \ 表达式示例\n> Lambda 表达式语法\n> Lambda 表达式作为方法引用\n> 方法引用示例 - LambdaRefernce.java\n> Lambda\
  \ 表达式操作\n\n#### 结论\n\n*   函数式接口是一个单抽象方法。\n*   Lambda 表达式是匿名类的简写形式。\n*   方法表达式是静态方法的简写形式。\n\
  *   使用 Lambda 表达式的最佳位置是流操作。\n*   Lambda 表达式和方法引用是在 Java 8 中引入的。\n\nJava 教程 - Herong\
  \ 的教程示例\n\n∟Lambda 表达式与方法引用\n\n### 什么是 Lambda 表达式\n\n本节描述什么是 Lambda 表达式，它是实现单抽象方法的匿名类的简写形式。\n\
  \n**什么是 Lambda 表达式？** Lambda 表达式是实现只有一个抽象方法的匿名类的简写形式。Lambda 表达式是在 Java 8 中引入的。\n\
  \n只有一个抽象方法的接口被称为**函数式接口**。\n\n这是 Lambda 表达式的语法：\n\n```\n(parameter_list) -> {method_body}\n\
  ```\n\n上述 Lambda 表达式语法实际上是以下匿名类的简写形式：\n\n```\nnew interface_name() {\n   return_type\
  \ method_name(parameter_list) {method_body}\n}\n```\n\n下表提供了匿名类语法与 Lambda 表达式语法之间每个元素的对比：\n\
  \n```\nAnonymous class      |  Lambda expression\n                     |\nnew  \
  \                |\ninterface_name() {   |\n   return_type       |\n   method_name\
  \       |\n   (parameter_list)  |  (parameter_list)\n                     |  ->\n\
  \   {method_body}     |  {method_body}\n}                    |\n```\n\n从上面的对比可以看出：\n\
  \n*   Lambda 表达式省略了 `new` 运算符。\n*   Lambda 表达式省略了 `interface_name`。编译器通过查看使用 Lambda\
  \ 表达式的上下文来确定基接口。\n*   Lambda 表达式省略了 `return_type`。编译器通过查看基接口的唯一抽象方法确定返回类型。\n*  \
  \ Lambda 表达式省略了 `method_name`。编译器通过查看基接口的唯一抽象方法确定方法名。\n*   `parameter_list` 在 Lambda\
  \ 表达式中保留了。参数列表对于实现基接口中的唯一抽象方法是绝对需要的。\n\n\n\n\n\n*   `->`（箭头）标记在 lambda 表达式中引入，作为\
  \ lambda 表达式的标识。\n*   lambda 表达式中维护了 `method_body`。方法体对于实现基接口中唯一的抽象方法是绝对必要的。\n\n\
  由于 lambda 表达式只是特殊匿名类的简写形式，它的作用方式与匿名类相同，但存在一些细微差异，总结如下：\n\n*   像匿名类一样，lambda 表达式在本地定义了一个没有名称的类。但与匿名类不同，lambda\
  \ 表达式在编译时不会产生任何类字节码。\n*   像匿名类一样，lambda 表达式会根据 lambda 表达式定义的类创建一个新对象。该新对象的引用将是 lambda\
  \ 表达式的求值结果。\n*   与匿名类不同，lambda 表达式只能实现包含单个抽象方法的接口。\n\n请参下一节查看 lambda 表达式的简单示例。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟Lambda 表达式与方法引用\n\n∟`LambdaCalculator.java` - Lambda\
  \ 表达式示例\n\n本节提供了一个关于使用 lambda 表达式匿名定义实现单个抽象方法接口的类的教程示例。并使用了匿名类和局部类作为比较。\n\n我的第一个\
  \ lambda 表达式程序 `LambdaCalculator.java` 遵循 Oracle Java 教程中的一个示例。以下是源代码：\n\n```\n\
  \ /* LambdaCalculator.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nclass LambdaCalculator {\n   interface Operation {\n      int operate(int\
  \ a, int b);\n   }\n   public int calculate(int a, int b, Operation o) {\n     \
  \ System.out.println(o.toString());\n      return o.operate(a, b);\n   }\n\n   public\
  \ static void main(String[] arg) {\n      int x = 1;\n      String s = \"+\";\n\
  \      int y = 2;\n      if (arg.length>0) x = Integer.parseInt(arg[0]);\n     \
  \ if (arg.length>1) s = arg[1];\n      if (arg.length>2) y = Integer.parseInt(arg[2]);\n\
  \n      // Using a lambda expression\n      Operation add = (int a, int b) -> {return\
  \ a+b;};\n\n      // Using anonymous class\n      Operation subtract = new Operation()\
  \ {\n         public int operate(int a, int b) {return a-b;}\n      };\n\n     \
  \ // Using a local class\n      class Multiply implements Operation {\n        \
  \ public int operate(int a, int b) {return a*b;}\n      }\n      Operation multiply\
  \ = new Multiply();\n\n      LambdaCalculator c = new LambdaCalculator();\n    \
  \  if (s.equals(\"+\"))\n         System.out.println(x+s+y+\" = \"+c.calculate(x,y,add));\n\
  \      else if (s.equals(\"-\"))\n         System.out.println(x+s+y+\" = \"+c.calculate(x,y,subtract));\n\
  \      else if (s.equals(\"*\"))\n         System.out.println(x+s+y+\" = \"+c.calculate(x,y,multiply));\n\
  \      else\n         System.out.println(x+s+y+\" = Undefined\");\n   }\n}\n```\n\
  \n注意，我的示例程序使用了 lambda 表达式、匿名类和局部类来实现同一个接口：\n\n*   `Operation` 是一个嵌套在 `LambdaCalculator`\
  \ 类中的单抽象方法接口。\n*   `Operation add = (int a, int b) -> {return a+b;};` 使用 lambda\
  \ 表达式来实现加法操作。从实现类创建一个新对象并赋值给 `add`。\n*   `Operation subtract = new Operation() {\
  \ ... };` 使用匿名类来实现减法操作。从实现类创建一个新对象并赋值给 `subtract`。\n*   `Operation multiply = new\
  \ Multiply();` 使用局部类来实现乘法操作。从实现类创建一个新对象并赋值给 `multiply`。\n\n现在使用 JDK 1.8 编译并运行 `LambdaCalculator.java`，你将得到：\n\
  \n```\n herong> java LambdaCalculator\nLambdaCalculator$$Lambda$1/518248@cf9800\n\
