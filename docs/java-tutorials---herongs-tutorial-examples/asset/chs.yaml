  \ 垃圾回收方法\n\n## 使用 `gc()` 方法的示例程序\n\n#### 结论\n- 垃圾回收器是 Java 虚拟机 (`JVM`) 中始终运行的独立线程。\n\
  - 当分配内存的空闲空间较低，垃圾回收器会自动移除未使用的对象。\n- 可以调用 `gc()` 方法来显式执行垃圾回收。\n\n## 垃圾回收与未使用的对象\n\
  \n本节描述了什么是垃圾回收以及什么是未使用对象。\n\n**垃圾回收器**：一个自动释放未未使用对象所占内存的执行线程。垃圾回收器由 `JVM` 管理，并与应用程序线程独立执行。\n\
  \n**垃圾回收**：垃圾回收器主动识别未使用的对象并将其删除以释放内存的过程。\n\n垃圾回收涉及两个关键问题：\n- 垃圾回收器如何识别对象为未使用的对象？\n\
  - 垃圾回收器何时执行收集过程？\n\n**未使用的对象**：没有任何存活引用（live reference）指向的对象。`Java` 没有为我们提供任何设施来检查特定对象有多少个引用，但我们可以通过阅读程序源代码来判断。\n\
  \n例如，在执行以下代码段后：\n\n```\n String a = new String(\"Apple\");\n   a = new String(\"\
  Banana);\n   new String(\"Orange\");\n   String g = sub(\"Grape\");\n   String x\
  \ = \"Kiwi\";\n   String y = x;\n   x = null;\n   ...\n   static String sub(String\
  \ b) {\n      String l = new String{\"Peach\");\n      return new String(\"Pear\"\
  );\n   }\n```\n\n代码创建的对象将具有以下状态：\n- \"Apple\" String 对象：未使用，因为来自 `a` 的唯一引用已消失。现在\
  \ `a` 指向另一个对象。\n- \"Banana\" String 对象：已使用，因为它仍然被 `a` 引用。\n- \"Orange\" String 对象：未使用，因为它被创建了但从未被任何变量引用过。\n\
  - \"Grape\" String 对象：未使用，因为来自 `b` 的引用已消失。在执行方法 `sub()` 后，`a` 已经超出了作用范围。\n- \"Peach\"\
  \ String 对象：未使用，因为来自 `l` 的引用已消失。在执行方法 `sub()` 后，`l` 已经超出了作用范围。\n- \"Pear\" String\
  \ 对象：已使用，因为方法 `sub()` 返回的引用现在位于 `g` 中。\n- \"Kiwi\" String 对象：已使用，因为它仍然被 `y` 引用，即使来自\
  \ `x` 的引用已消失。\n\n## 自动垃圾回收过程\n\n本节是一个关于如何发现垃圾回收器何时自动执行垃圾回收过程的教程示例。\n\n为了理解 `JVM`\
  \ 何时会垃圾回收器执行垃圾回收过程，我编写了以下教程示例运行运行许多步骤的循环。在每一步中，都会创建一个新的 1-MB 对象并释放一个旧的 1-MB 对象，前\
  \ 32 步除外：\n\n```\n /* GarbageCollection.java\n * Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n */\nclass GarbageCollection {\n   public static void main(String[]\
  \ a) {\n      int steps = 10000;\n      int size = 32;\n      Object[] queue = new\
  \ Object[size];\n      Runtime rt = Runtime.getRuntime();\n      System.out.println(\"\
  Memory: Maximum   Total   Free   Used\");\n      for (int m=0; m<steps; m++) {\n\
  \         for (int n=0; n<size-1; n++)\n            queue[size-n-1] = queue[size-n-2];\n\
  \         queue[0] = getOneMega();\n         System.out.println(m+\"   \"+rt.maxMemory()\n\
  \            +\"   \"+rt.totalMemory()+\"   \"+rt.freeMemory()\n            +\"\
  \   \"+(rt.totalMemory()-rt.freeMemory()));\n         try {\n            Thread.sleep(1000/10);\n\
  \         } catch (InterruptedException e) {\n            System.out.println(\"\
  Interreupted...\");\n         }\n      }\n   }\n   private static Object getOneMega()\
  \ {\n      return new long[1024*128]; // 1MB\n   }\n}\n```\n\n注意：\n- 方法 `getOneMega()`\
  \ 用于创建一个 1-MB 的对象，这是一个包含 `1024*128 = 131072` 个元素的 \"long\" 数组。由于 \"long\" 数据类型的大小为\
  \ 8 字节，数组的总大小为 `131072 * 8 = 1048576` 字节 (1MB)。\n- `queue` 是一个用于 32 个对象引用的数组。\n\
  - 外层循环 `for (int m=0; m<steps; m++) {...}` 控制测试步骤。\n- 在每一步中，内层循环 `for (int n=0;\
  \ n<size-1; n++) {...}` 将所有引用向右移动一位。\n- 在每一步中，内层循环 `for (int n=0; n<size-1; n++)\
  \ {...}` 将 `queue` 中的所有引用移动一位。\n- 移动操作后，新的 1-MB 对象的引用被添加到 `queue` 的开头。\n- 前 32 步中，移动操作将移除对任何现有对象的引用，因为\
  \ `queue` 尚未填满。\n- 前 32 步之后，移动操作将从 `queue` 中移除最旧对象的引用。\n\n运行此示例程序，我得到了以下输出：\n\n\n\
  \n\n\n本节提供了关于如何使用 `Runtime` 对象的 `gc()` 方法来控制垃圾回收过程的教程。\n\n如果你不喜欢 JVM 自动执行垃圾回收的方式，可以使用\
  \ `Runtime` 对象的 `gc()` 方法来手动控制收集过程。\n\n为了测试这个 `gc()` 方法，我修改了上一节中提供的教程示例，当空闲内存低于\
  \ 10 MB 时显式地执行垃圾回收：\n\n```java\n /* GarbageForced.java\n * Copyright (c) HerongYang.com.\
  \ All Rights Reserved\n */\nclass GarbageForced {\n   public static void main(String[]\
  \ a) {\n      int steps = 10000;\n      int size = 32;\n      Object[] queue = new\
