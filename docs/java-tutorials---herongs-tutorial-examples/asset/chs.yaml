  \ 的教程示例\n\n∟位、字节、位运算与移位操作\n\n## 对 \"byte\" 数据类型值的操作\n\n本节提供了一个教程示例，说明了当 'byte' 值参与算术、比较和位运算时，是如何被转换为\
  \ 'int' 值的。\n\n实际上，Java 中没有定义直接针对 \"byte\" 数据类型值的操作。\n\n但 \"byte\" 数据类型值可以参与所有为整数值定义的操作。更具体地说：\n\
  \n- 当 `byte` 值参与 `+`、`-`、`*`、`/` 或 `%` 等算术运算时，它在进入操作之前会被强制转换为 `int` 值。\n- 当 `byte`\
  \ 值参与 `==`、`!=`、`>`、`<`、`>= 或 `<=` 等比较操作时，它在进入操作之前会被转换为 `int` 值。\n- 当 `byte` 值参与\
  \ `&`、`|`、`^` 或 `~` 等位运算时，它在进入操作之前会被转换为 `int` 值。\n- 当 `byte` 值参与 `<<`、`>>` 或 `>>>`\
  \ 等移位操作时，它在进入操作之前会被转换为 `int` 值。\n\n为了验证上述规则，我编写了以下示例程序 `ByteOperations.java`：\n\n\
  ```\n /* ByteOperations.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\npublic class ByteOperations {\n   public static void main(String[] arg) {\n\
  \      byte b1 = 127;\n      int o1 = (b1+b1-0)*5/10; // arithmetic operations\n\
  \n      byte b2 = 0x0000007F;\n      boolean o2 = b2 > b2 || b2 != b2 || b2 == b2;\
  \ // comparisons\n\n      byte b3 = (byte) 127;\n      int o3 = b3 & 0x0000000F\
  \ | 0x00000070; // bitwise operations\n\n      byte b4 = (byte) 0x0000007F;\n  \
  \    int o4 = b4 >> 4 << 4; // shift operations\n\n      System.out.println(\"o1:\
  \ \"+o1);\n      System.out.println(\"o2: \"+o2);\n      System.out.println(\"o3:\
  \ \"+o3);\n      System.out.println(\"o4: \"+o4);\n   }\n}\n```\n\n执行该程序后，我得到了没有任何意料的输出：\n\
  \n```\n o1: 127\no2: true\no3: 127\no4: 112\n```\n\nJava 教程 - Herong 的教程示例\n\n∟位、字节、位运算与移位操作\n\
  \n## \"byte\" 值的位运算\n\n本节描述了 4 种位运算，“与”、“或”、“异或”和“补码取反”，这些运算通过 'int' 值间接作用于 'byte'\
  \ 值。\n\n### 什么是位运算？\n\n位运算是指通过 'int' 值间接应用于 'byte' 值的 4 种位运算：“与”、“或”、“异或”和“补码取反”。\n\
  \n位运算是指对 `int` 值表示的二进制格式进行的运算。Java 定义了针对 `int` 类型的位运算。位运算有 4 种：“与”、“或”、“异或”和“取反”。\n\
  \n### 1. “与”运算 (&)\n\n`&` 运算是两个 `int` 值之间的运算，描述为：\n- 两个 `int` 操作。\n- 将两个输入字符串合并为\
  \ 32 位的输出字符串，只有当两个字符串的对应位都为 1 时，输出位才为 1。\n- 将输出字符串转换为 `int` 值。\n\n以下是 `&` 运算的示例图：\n\
  \n```\n Decimal        Hex          Binary\n   858993459     33333333     00110011001100110011001100110011\n\
  & 1431655765   55555555     01010101010101010101010101010101\n------------   ----------\
  \   ---------------------\n= 286331153   11111111     0001000100010001\n```\n\n\
  ### 2. “或”运算 (|)\n\n`|` 运算是两个 `int` 值之间的运算，描述为：\n- 两个 `int` 操作。\n- 将两个输入字符串合并为 32\
  \ 位的输出字符串，只要字符串中任意一个位为 1，输出位就为 1。\n- 将输出字符串转换为 `int` 值。\n\n以下是 `|` 运算的示例图：\n\n```\n\
  \ Decimal        Hex          Binary\n   858993459     33333333     00110011001100110011001100110011\n\
  | 1431655765   55555555     01010101010101010101010101010101\n------------   ----------\
  \   ---------------------\n= 2004318071   77777777     01110111011101110111011101110111\n\
  ```\n\n### 3. “异或”运算 (^)\n\n`^` 运算是两个 `int` 值之间的运算，描述为：\n- 两个 `int` 操作。\n- 将两个输入字符串合并为\
  \ 32 位的输出字符串，只有当两个字符串的对应位不同时，输出位才为 1。\n- 将输出字符串转换为 `int` 值。\n\n以下是 `^` 运算的示例图：\n\
  \n```\n Decimal        Hex          Binary\n   858993459     33333333     00110011001100110011001100110011\n\
  ^ 1431655765   55555555     01010101010101010101010101010101\n------------   ----------\
  \   ---------------------\n= 1717986918   66666666     01100110011001100110011001100110\n\
  ```\n\n### 4. “补码取反”运算 (~)\n\n`~` 运算是对单个 `int` 值的运算，描述为：\n- 单个 `int` 操作数。\n- 将输入字符串推导出\
  \ 32 位的输出字符串，只有当输入字符串的对应位为 0 时，输出位才为 1。\n- 将输出字符串转换为 `int` 值作为运算结果。\n\n\n\n\n\n\
  以下图表给出了 `~` 操作的 3 种示例：\n\n```\n Decimal        Hex          Binary\n~  858993459\
  \   ~ 33333333   ~ 00110011 00110011 00110011 00110011\n------------   ----------\
  \   -------------------------------------\n= 3233857728   = C0C0C0C0   = 11001100\
  \ 11001100 11001100 11001100\n```\n\nJava 教程 - Herong 的教程示例\n\n∟位、字节、位运算和移位操作\n\n\
  ∟ \"byte\" 值的位运算 - 示例程序\n\n本节提供了一个关于 4 种位运算（“与”、“或”、“异或”和“取反”）如何作用于 `int` 类型值的教程示例。\n\
  \n为了验证上一节中给出的位运算规则，我编写了以下测试程序 `BitwiseOperations.java`：\n\n```\n /* BitwiseOperations.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\npublic class BitwiseOperations\
  \ {\n   public static void main(String[] arg) {\n      int a = 858993459;  // binary:\
  \ 00110011001100110011001100110011\n      int b = 1431655765; // binary: 01010101010101010101010101010101\n\
  \n      int o1 = a & b; // 位与 (And)\n      int o2 = a | b; // 位或 (Or)\n      int\
  \ o3 = a ^ b; // 位异或 (Exclusive Or)\n      int o4 = ~a;    // 位取反 (Complement)\n\
  \n      System.out.println(\" a: \"+getBitString(a) +\" = \"+a);\n      System.out.println(\"\
  \ b: \"+getBitString(b) +\" = \"+b);\n      System.out.println(\"o1: \"+getBitString(o1)\
  \ +\" = \"+o1);\n      System.out.println(\"o2: \"+getBitString(o2) +\" = \"+o2);\n\
  \      System.out.println(\"o3: \"+getBitString(o3) +\" = \"+o3);\n      System.out.println(\"\
  o4: \"+getBitString(o4) +\" = \"+o4);\n   }\n   private static String getBitString(int\
  \ x) {\n      StringBuffer buf = new StringBuffer();\n      for (int i=1; i<=32;\
  \ i++) buf.append(x>>>(32-i) & 0x00000001);\n      return buf.toString();\n   }\n\
  }\n```\n\n以下是测试程序的输出结果：\n\n```\n a: 00110011001100110011001100110011 = 858993459\n\
  \ b: 01010101010101010101010101010101 = 1431655765\no1: 00010001000100010001000100010001\
  \ = 286331153\no2: 01110111011101110111011101110111 = 2004318071\no3: 01100110011001100110011001100110\
  \ = 1717986918\no4: 11001100110011001100110011001100 = -858993460\n```\n\n程序输出的结果值与我在上一节示例中给出的一致。程序输出中取反运算的结果显示为\
  \ `-858993460`，这与用有符号 32 位整数格式表示的 `3233857728` 相同。\n\nJava 教程 - Herong 的教程示例\n\n\
  ∟位、字节、位运算和移位操作\n\n∟ 移位操作 - 左移、右移或无符号右移\n\n本节描述移位操作：“左移”、“右移”和“无符号右移”。提供了一个教程示例，向你展示移位操作如何作用于\
  \ `int` 类型的值。\n\n### 什么是移位操作？\n\n移位操作要求操作数以二进制格式表示（视为位字符串），然后将所有位值向左或向右移动。\n\n同样，Java\
  \ 针对 `int` 类型值定义移位操作，而不是针对 `byte` 类型值。因此，移位操作要求涉及的 `int` 值是 32 位的字符串。移位操作将向左或右移动。Java\
  \ 定义了以下移位操作：“左移”、“右移”和“无符号右移”。\n\n#### 1. 左移 (<<)\n\n左移操作对 `int` 值的描述为：将其 32 位的位字符串向左移动，并在空位补\
  \ `0`。以下是 `<<` 操作的图示：\n\n```\n Decimal             Binary\n-858993460  << 6    \
  \ 001100110011001100110011000000\n```\n\n#### 2. 右移 (>>)\n\n右移操作对 `int` 值的描述为：将其\
  \ 32 位的位字符串向右移动，并在空位补符号位（即最高位）。以下是 `>>` 操作的图示：\n\n```\n Decimal             Binary\n\
  -858993460  >> 6     111111110011001100110011001101\n```\n\n#### 3. 无符号右移 (>>>)\n\
  \n无符号右移操作对 `int` 值的描述为：将其 32 位的位字符串向右移动，并在空位统一补 `0`。以下是 `>>>` 操作的图示：\n\n```\n Decimal\
  \             Binary\n-858993460  >>> 6     000000110011001100110011001101\n```\n\
  \n为了验证上述示例，我编写了以下测试程序 `ShiftOperations.java`：\n\n```\n /* ShiftOperations.java\n\
  \ * Copyright (c) HerongYang.com. All Rights Reserved.\n */\npublic class ShiftOperations\
  \ {\n   public static void main(String[] arg) {\n      int a = -858993460; // binary:\
  \ 11001100110011001100110011001100\n\n      int o1 = a << 6;  // 左移\n      int o2\
  \ = a >> 6;  // 右移\n      int o3 = a >>> 6; // 无符号右移\n\n      System.out.println(\"\
  \ a: \"+getBitString(a) +\" = \"+a);\n      System.out.println(\"o1: \"+getBitString(o1)\
  \ +\" = \"+o1);\n      System.out.println(\"o2: \"+getBitString(o2) +\" = \"+o2);\n\
  \      System.out.println(\"o3: \"+getBitString(o3) +\" = \"+o3);\n   }\n   private\
  \ static String getBitString(int x) {\n      StringBuffer buf = new StringBuffer();\n\
  \      for (int i=1; i<=32; i++) buf.append(x>>>(32-i) & 0x00000001);\n      return\
  \ buf.toString();\n   }\n}\n```\n\n测试程序的输出与我之前的示例一致：\n\n```\n a: 11001100110011001100110011001100\
  \ = -858993460\no1: 00110011001100110011001100000000 = 858993408\no2: 11111111001100110011001100110111\
  \ = -13421773\no3: 00000011001100110011001100110111 = 53687091\n```\n\n\n\n\n在许多应用程序中，信息必须以位字符串的形式进行存储和操作。遗憾的是，Java\
  \ 没有提供任何内置的数据类型或类来支持位字符串。有几个第三方的 `BitString` 类可以让你来存储和管理你的位字符串。\n\n另一种存储和管理位字符串的方法是使用字节数组\
  \ `byte[]`。我在实现 `DES`（数据加密标准）加密算法时使用过它们，请参阅 [www.herongyang.com/Cryptography/](https://www.herongyang.com/Cryptography/)\
  \ 的“加密教程 - Herong 的教程笔记”。\n\n只要你定义了一对 `setBit()` 和 `getBit()` 方法，在字节数组中存储和管理位字符串并不困难。以下是我在加密教程中使用的方法集。当然，这些方法还有改进的空间。你可以自己尝试一下。\n\
  \n### 1. setBit() - 在位字符串的指定位置用指定的位值设置一个位：\n\n```java\n private static void setBit(byte[]\
  \ data, int pos, int val) {\n      int posByte = pos/8;\n      int posBit = pos%8;\n\
  \      byte oldByte = data[posByte];\n      oldByte = (byte) (((0xFF7F>>posBit)\
  \ & oldByte) & 0x00FF);\n      byte newByte = (byte) ((val<<(8-(posBit+1))) | oldByte);\n\
  \      data[posByte] = newByte;\n   }\n```\n\n#### 解释：\n\n*   该方法接口期望调用者提供存储位字符串的字节数组、位字符串中需要设置位值的位置，以及作为\
  \ \"int\" 值给出的新位值。\n*   第一条语句计算包含要设置位的受影响字节的数组索引 `posByte`。\n*   第二条语句计算受影响字节中需要设置位值的偏移\
  \ `posBit`。\n*   第三条语句将受影响的字节获取到临时变量 `oldByte` 中。\n*   第四条语句在 `posBit` 位位置上将 `oldByte`\
  \ 的值设置为 0。\n*   第五条语句在 `posBit` 位位置上将输入的 `val` 设置为 `oldByte` 并赋值给 `newByte`。\n\n\
  为了理解第四条语句是如何工作的，让我们假设 `posBit` = 2。那么该语句的求值过程可以描述为：\n\n```\n 0xFF7F    : 11111111\
  \ 11111111 11111111 01111111\n>> 2\n-----------------------------------------------\n\
  \          = 11111111 11111111 11111111 11011111\n& oldByte : ???????? ????????\
  \ ???????? xxxxxxxx\n-----------------------------------------------\n         \
  \ = ???????? ???????? ???????? xx0xxxxx\n& 0x00FF  : 00000000 00000000 00000000\
  \ 11111111\n-----------------------------------------------\n          = 00000000\
  \ 00000000 00000000 xx0xxxxx\n```\n\n第五条语句可以描述为：\n\n```\n val       : 00000000 00000000\
  \ 00000000 0000000y\n<< 5\n-----------------------------------------------\n   \
  \       = 00000000 00000000 00000000 00y00000\n| oldByte : 00000000 00000000 00000000\
  \ xx0xxxxx\n-----------------------------------------------\n          = 00000000\
  \ 00000000 00000000 xxyxxxxx\n```\n\nJava 教程 - Herong 的教程示例\n\n∟在字节数组中管理位字符串\n\n\
  ### 2. getBit() - 从字节数组中检索位\n\n本节提供了一个教程示例，说明了如何从字节数组的指定位位置获取一个位 - `getBit()`。\n\
  \n#### 2. getBit() - 从存储在字节数组中的位字符串的指定位置获取一个位：\n\n```java\n private static int getBit(byte[]\
  \ data, int pos) {\n      int posByte = pos/8;\n      int posBit = pos%8;\n    \
  \  byte valByte = data[posByte];\n      int valInt = valByte>>(8-(posBit+1)) & 0x0001;\n\
  \      return valInt;\n   }\n```\n\n#### 解释：\n\n*   该方法接口期望调用者提供存储位字符串的字节数组、位字符串中需要检索位值的位置。\n\
  *   第一条语句计算包含要检索位的源字节的数组索引 `posByte`。\n*   第二条语句计算源字节中需要检索位值的偏移 `posBit`。\n*   第三条语句将源字节获取到临时变量\
  \ `valByte` 中。\n*   第四条语句从 `valByte` 的 `posBit` 位位置获取位值。\n\n为了理解第四条语句是如何工作的，让我们假设\
  \ `posBit` = 2。那么该语句的求值过程可以描述为：\n\n```\n valByte   : ???????? ???????? ????????\
  \ xxxxxxxx\n>> 5\n-----------------------------------------------\n          = 00000000\
  \ 00000000 00000000 00y00000\n& 0x0001  : 00000000 00000000 00000000 00000001\n\
  -----------------------------------------------\n          = 00000000 00000000 00000000\
  \ 00000000\n```\n\nJava 教程 - Herong 的教程示例\n\n∟在字节数组中管理位字符串\n\n### rotateLeft() -\
  \ 字节数组的位左旋转\n\n本节提供了一个教程示例，说明了如何对字节数组中的位进行左旋转 - `rotateLeft()`。\n\n如果你尝试实现 `DES`（数据加密标准）加密算法，你需要在位字符串中进行位旋转。有了上面定义的\
  \ `getBit()` 和 `setBit()` 方法，对存储在字节数组中的位字符串进行旋转变得简单。这里是我的 `rotateLeft()` 方法。\n\n\
  ```java\n private static byte[] rotateLeft(byte[] in, int len, int step) {\n   \
  \   int numOfBytes = (len-1)/8 + 1;\n      byte[] out = new byte[numOfBytes];\n\
  \      for (int i=0; i<len; i++) {\n         int val = getBit(in,(i+step)%len);\n\
  \         setBit(out,i,val);\n      }\n      return out;\n   }\n```\n\n#### 解释：\n\
  \n*   该方法接口期望调用者提供存储输入位字符串的字节数组、位字符串的长度以及旋转步数。\n*   第一条语句计算存储输出位字符串所需的字节数。\n*  \
  \ 第二条语句定义一个新的字节数组来存储输出位字符串。\n*   第三条语句遍历输出位字符串中的每一个位。\n*   循环中的第四条语句通过调用 `getBit()`\
  \ 从输入位字符串从当前位向右旋转后的位置获取位值。旋转步数由调用者给出。\n*   循环中的第五条语句通过调用 `setBit()` 在输出位字符串的当前位位置设置位值。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟在字节数组中管理位字符串\n\n### bitStringTest.java - 测试程序\n\n本节提供了一个教程示例程序，用于测试\
  \ `setBit()`、`getBit()` 和 `rotateLeft()` 以管理字节数组中的位字符串。\n\n为了测试我的位字符串方法，我编写了以下测试程序\
  \ `bitStringTest.java`。\n\n\n\n\n\n```java\n /* BitStringTest.java\n * Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n */\npublic class BitStringTest {\n\
  \   public static void main(String[] arg) {\n      byte[] inString = new byte[5];\n\
  \      inString[0] = (byte) 0x00FF; // binary: 11111111\n      inString[1] = (byte)\
  \ 0x0000; // binary: 00000000\n      inString[2] = (byte) 0x00FF; // binary: 11111111\n\
  \      inString[3] = (byte) 0x0000; // binary: 00000000\n      inString[4] = (byte)\
  \ 0x0000; // binary: 00000000\n      int length = 5*8; // 40 bits in total\n\n \
  \     int step = 6; // steps to rotate\n      byte[] outString = rotateLeft(inString,\
  \ length, step);\n      printBytes(inString, \" Input\");\n      printBytes(outString,\
  \ \"Output\");\n   }\n   private static byte[] rotateLeft(byte[] in, int len, int\
  \ step) {\n      int numOfBytes = (len-1)/8 + 1;\n      byte[] out = new byte[numOfBytes];\n\
  \      for (int i=0; i<len; i++) {\n         int val = getBit(in,(i+step)%len);\n\
  \         setBit(out,i,val);\n      }\n      return out;\n   }\n   private static\
  \ int getBit(byte[] data, int pos) {\n      int posByte = pos/8;\n      int posBit\
  \ = pos%8;\n      byte valByte = data[posByte];\n      int valInt = valByte>>(8-(posBit+1))\
  \ & 0x0001;\n      return valInt;\n   }\n   private static void setBit(byte[] data,\
  \ int pos, int val) {\n      int posByte = pos/8;\n      int posBit = pos%8;\n \
  \     byte oldByte = data[posByte];\n      oldByte = (byte) (((0xFF7F>>posBit) &\
  \ oldByte) & 0x00FF);\n      byte newByte = (byte) ((val<<(8-(posBit+1))) | oldByte);\n\
  \      data[posByte] = newByte;\n   }\n   private static void printBytes(byte[]\
  \ data, String name) {\n      System.out.println(\"\");\n      System.out.println(name+\"\
  :\");\n      for (int i=0; i<data.length; i++) {\n         System.out.print(byteToBits(data[i])+\"\
  \ \");\n      }\n      System.out.println();\n   }\n   private static String byteToBits(byte\
  \ b) {\n      StringBuffer buf = new StringBuffer();\n      for (int i=0; i<8; i++)\n\
  \         buf.append((int)(b>>(8-(i+1)) & 0x0001));\n      return buf.toString();\n\
  \   }\n}\n```\n\n这里是测试程序的输出结果：\n\n```\n Input:\n11111111 00000000 11111111 00000000\
  \ 00000000\nOutput:\n11111100 00001111 11000000 00000000 00000000\n```\n\n\n\n\n\
  由于类类型变量存储的是类对象的引用，因此单个对象的引用存储在多个变量中是非常常见的现象。这里有一个教程示例程序，向你展示如何将单个对象的引用存储在变量中：\n\n\
  ```\n /* ClassTypeVariable.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.util.*;\nclass ClassTypeVariable {\n   public static void main(String[]\
  \ a) {\n      java.io.PrintStream o = System.out;\n\n      // assigning the reference\
  \ of a Date object\n      Date myTime = new Date();\n\n      // showing the object\
  \ content\n      o.println(\"myTime before = \"+myTime);\n\n      // assigning the\
  \ reference to another variable\n      Date hisTime = myTime;\n\n      // modifying\
  \ the object content\n      hisTime.setTime(hisTime.getTime()+1000*60*60);\n\n \
  \     // showing the object content\n      o.println(\"myTime after = \"+myTime);\n\
  \      o.println(\"hisTime after = \"+hisTime);\n   }\n}\n```\n\n编译并运行示例，你将得到：\n\
  \n```\n myTime before = Sun May 04 22:14:47 PDT 2018\nmyTime after = Sun May 04\
  \ 23:14:47 PDT 2018\nhisTime after = Sun May 04 23:14:47 PDT 2018\n```\n\n结果证明 `myTime`\
  \ 和 `hisTime` 都是同一个对象的引用。当对象值被修改时，时间移动到了 1 小时后，通过 `hisTime` 引用，`myTime` 引用也能看到变化。\n\
  \nJava 教程 - Herong 的教程示例\n\n∟引用数据类型和变量\n\n### 接口类型变量\n\n本节描述了如何使用接口类型变量来存储实现该接口的类的对象的引用。\n\
  \nJava 中的接口类型变量遵循以下基本规则：\n\n* 接口类型变量可以存储实现该接口的类的对象的引用。\n* 接口类型变量的点运算符 `.` 只能调用在该接口中声明的方法。\n\
  \n这里有一个教程示例程序，向你展示如何使用接口类型变量：\n\n```\n /* InterfaceTypeVariable.java\n * Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n */\nimport java.util.*;\nclass InterfaceTypeVariable\
  \ {\n   public static void main(String[] a) {\n      java.io.PrintStream o = System.out;\n\
  \n      // assigning the reference of a LinkedList object\n      LinkedList<String>\
  \ bookList = new LinkedList<String>();\n\n      // assigning the reference to an\
  \ implemented interface\n      // LinkedList<E> implements Queue<E>\n      Queue<String>\
  \ bookQueue = bookList;\n\n      // accessing interface methods\n      bookQueue.add(\"\
  Java Tutorials\");\n      bookQueue.add(\"PHP Tutorials\");\n      String next =\
  \ bookQueue.remove();\n\n      o.println(\"Next book in the queue = \"+next);\n\
  \   }\n}\n```\n\n编译并运行示例，你将得到：\n\n```\n Next book in the queue = Java Tutorials\n\
  ```\n\nJava 教程 - Herong 的教程示例\n\n∟引用数据类型和变量\n\n### 类与接口层次结构\n\n本节描述了 Java 类和接口的层次级关系，以支持对象继承：父类-子类关系、父接口-子接口关系以及接口-类关系。\n\
  \nJava 允许创建具有层次关系的类和接口以支持对象继承。类和接口层次结构支持 3 种关系：\n\n1. **父类-子类关系** - 子类扩展父类并继承父类的所有行为。下列出了示例：\n\
  \n```\n class javax.net.ssl.X509ExtendedKeyManager\n   extends java.lang.Object\
  \ {};\n   // superclass: java.lang.Object\n   // subclass: javax.net.ssl.X509ExtendedKeyManager\n\
  ```\n\n2. **父接口-子接口关系** - 子接口扩展父接口并继承父接口的所有行为。下列出了示例：\n\n```\n interface javax.net.ssl.X509KeyManager\n\
  \   extends javax.net.ssl.KeyManager {};\n   // superinterface: javax.net.ssl.KeyManager\n\
  \   // subinterface: javax.net.ssl.X509KeyManager\n```\n\n3. **接口-类关系** - 类实现接口并继承接口的所有行为。下列出了示例：\n\
  \n```\n class javax.net.ssl.X509ExtendedKeyManager\n   implements javax.net.ssl.X509KeyManager\
  \ {};\n   // interface: javax.net.ssl.X509KeyManager\n   // class: javax.net.ssl.X509ExtendedKeyManager\n\
  ```\n\n下图展示了一个简单的类接口层次结构示例：\n\n![](img/image00180.jpeg)\n\nJava 类接口层次结构示例\n\n默认情况下，所有类都扩展\
  \ `java.lang.Object` 类。换句话说，所有类都是 `java.lang.Object` 类的子类。\n\nJava 教程 - Herong 的教程示例\n\
  \n∟引用数据类型和变量\n\n### 超类型与子类型\n\n本节描述了超类型-子类型关系：超类型对应被扩展或实现的类或接口。基于类和接口的关系，超类型-子类型关系如下：\n\
  \n* **超类型** - 直接或间接实现的类或接口。\n* **子类型** - 直接或间接扩展的类或接口。\n\n使用类接口层次结构示例，超类型-子类型关系如下所示：\n\
  \n![](img/image181.jpeg)\n\n类接口层次结构\n\n根据图片，我们可以说：\n\n* `javax.net.ssl.X509ExtendedKeyManager`\
  \ 是 `java.lang.Object` 的子类型。\n* `javax.net.ssl.X509ExtendedKeyManager` 是 `javax.net.ssl.KeyManager`\
  \ 的子类型。\n* `javax.net.ssl.KeyManager` 是 `javax.net.ssl.X509KeyManager` 的超类型。\n*\
  \ `javax.net.ssl.X509KeyManager` 是 `java.lang.Object` 的子类型。\n* `java.lang.Object`\
  \ 是所有其他类类型的超类型。\n\nJava 教程 - Herong 的教程示例\n\n∟引用数据类型和变量\n\n### 显式与隐式类型转换\n\n本节描述了\
  \ Java 支持的类型转换：向上转型（宽引用转换）和向下转型（窄引用转换）。转换操作可以显式地使用转换运算符 `(T)` 编写，也可以隐式地不使用运算符。\n\
  \n在 Java 中，类和接口引用类型可以通过两种方式使用转换操作从一种类型转换为另一种：\n\n1. **宽引用转换** - 将类型 `S` 转换为类型 `T`，其中\
  \ `S` 是 `T` 的子类型。这被称为向上转型，因为它将子类型转换为超类型。向上转型总是允许的，因为子类型的引用对象总是与超类型兼容。例如：\n\n```\n\
  \ String msg = new String(\"Hello\");\n\n    // 从 String 到 Object 的向上转型\n    Object\
  \ obj = (Object) msg;\n```\n\n2. **窄引用转换** - 将类型 `T` 转换为类型 `S`，其中 `T` 是 `S` 的超类型。这被称为向下转型，因为它将超类型转换为子类型。只有当引用对象与子类型兼容时，向下转型才允许。如果引用对象与子类型不兼容，将导致编译错误或运行时异常。例如：\n\
  \n```\n Object obj = new String(\"Hello\");\n\n    // 从 Object 到 String 的向下转型\n\
  \    String msg = (String) obj;\n```\n\n有 2 种语法格式可以编写类型转换操作：\n\n\n\n\n\n## 类型转换\n\
  \n1. **显式转换**：在 `cast-from type` 的左侧添加 `(cast-to type)`。例如：\n\n```java\nString msg\
  \ = new String(\"Hello\");\n\n// 显式转换\nObject obj = (Object) msg;\n```\n\n2. **隐式转换**：让编译器根据表达式上下文自动进行类型转换。例如：\n\
  \n```java\nString msg = new String(\"Hello\");\n\n// 隐式转换\nObject obj = msg;\n```\n\
  \nJava 教程 - Herong 的 教程示例\n\n∟参考数据类型和变量\n\n∟类型转换示例程序\n\n本节提供了一个关于如何显式和隐式地使用向上转型和向下转型的教程示例。\n\
  \n现在让我们来看一个显式和隐式使用向上和向下转型的教程示例程序：\n\n```java\n /* TypeCasting.java\n * Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n */\nclass TypeCasting {\n   public\
  \ static void main(String[] a) {\n      java.io.PrintStream o = System.out;\n\n\
  \      // 获取一个引用类型的对象：Thread\n      Thread alarmThread = new Thread();\n\n     \
  \ // 显式向上转型为 Object\n      Object alarmObject = (Object) alarmThread;\n\n      //\
  \ 显式向下转型为 Runnable\n      Runnable alarmRunnable = (Runnable) alarmObject;\n\n \
  \     // 显式向下转型为 Thread\n      Thread copyThread = (Thread) alarmRunnable;\n\n \
  \     // 隐式向上转型为 Runnable\n      Runnable copyRunnable = copyThread;\n\n      o.println(\"\
  alarmThread = \"+alarmThread);\n      o.println(\"alarmObject = \"+alarmObject);\n\
  \      o.println(\"alarmRunnable = \"+alarmRunnable);\n      o.println(\"copyThread\
  \ = \"+copyThread);\n      o.println(\"copyRunnable = \"+copyRunnable);\n   }\n\
  }\n```\n\n编译并运行该示例，你将得到：\n\n```\n alarmThread = Thread[Thread-0,5,main]\nalarmObject\
  \ = Thread[Thread-0,5,main]\nalarmRunnable = Thread[Thread-0,5,main]\ncopyThread\
  \ = Thread[Thread-0,5,main]\ncopyRunnable = Thread[Thread-0,5,main]\n```\n\n如你所示，所有的向上转型和向下转型都是有效的，因为引用对象\
  \ `new Thread()` 与 `Object`、`Runnable` 和 `Thread` 兼容。\n\nJava 教程 - Herong 的 教程示例\n\
