  \ static void main(String[] a) {\n      Vector i = new Vector(1, 0, 0);\n      Vector\
  \ j = new Vector(0, 1, 0);\n      Vector k = i.crossProduct(j);\n      System.out.println(\"\
  Vector i = (\"+i.x+\", \"+i.y+\", \"+i.z+\")\");\n      System.out.println(\"Vector\
  \ j = (\"+j.x+\", \"+j.y+\", \"+j.z+\")\");\n      System.out.println(\"i x j =\
  \ (\"+k.x+\", \"+k.y+\", \"+k.z+\")\");\n   }\n}\n```\n\n`com.herongyang.line` 包包含\
  \ `Line` 类，用于表示三维空间中的线：\n\n```\n herong> more src\\com.herongyang.base\\com\\herongyang\\\
  line\\Line.java\n\n/* Line.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
