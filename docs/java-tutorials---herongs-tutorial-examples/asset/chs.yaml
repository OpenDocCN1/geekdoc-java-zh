  \n∟原生数据类型和字面量\n\n### 原生类型字面量\n\n本节描述了如何在 Java 源代码中使用字面量来表示原生数据值。示例包括：`911`、`0x38fL`、`'\\\
  n'`、`3.14F`、`1e137`、`0x1p3`、`true` 等。\n\n**什么是字面量？** 字面量是 Java 源代码中数据值的字符串表示形式。\n\
  \n以下列表总结了不同原生类型的数据值如何通过字面量表示。\n\n*   `byte` 字面量 - 不支持。\n*   `short` 字面量 - 不支持。\n\
  *   `int` 字面量 - 支持 4 种格式：十进制、十六进制、八进制和二进制。示例为：`911`、`0x38f`、`0177` 和 `0b11100011111`。\n\
  *   `long` 字面量 - 支持 4 种格式：十进制、十六进制、八进制和二进制。示例为：`911L`、`0x38fL`、`0177L` 和 `0b11100011111L`。\n\
  *   `char` 字面量 - 支持使用引号 ASCII 字符或转义序列。示例为：`'x'`、`'\\''`、`'\\n'`、`'\\177'` 和 `'\\\
  u03a9'`。\n*   `float` 字面量 - 支持 2 种格式：十进制和十六进制。示例为：`1e1F`、`2.F`、`.3F`、`0F`、`3.14F`、`0x1p3F`\
  \ 和 `6.022137e23F`。\n*   `double` 字面量 - 支持 2 种格式：十进制和十六进制。示例为：`1e1`、`2.`、`.3`、`0.0`、`3.14`、`1e137`、`0x1p3`\
  \ 和 `1e-9D`。\n*   `boolean` 字面量 - 支持 2 个值：`true` 和 `false`。\n\nJava 对原生类型字面量支持的一些有趣特性：\n\
  \n*   下划线（`_`）可以用分隔符，在整数字面量和浮点字面量中将数字分组。示例为：`0xffff_ffff`、`0377_7777_7777`、`0b1111_1111_1111_1111_1111_1111_1111_1111`\
  \ 以及 `911_911_911_911.99999_9`。这一特性有助于提高包含许多数字字面量的可读性。\n*   前导零（`0`）用八进制整数字面量的指示。示例为：`0177`\
  \ 和 `0177L`。这与十六进制整数字面量不一致，后者需要两个前导字符（`0x`）作为指示。这一特性可能会引起混淆，因为人类会忽略前导零，将 `0177`\
  \ 读取为十进制值 177，而不是八进制值 177。\n*   浮点字面可以用十六进制格式表示。示例为：`0x1p3` 是 `\"double\"` 数据类型中\
  \ `8.0` 的十六进制浮点字面量。这是 JDK 5 引入的非常非常棒的特性，允许对特定的浮点值进行精确且可预测的规范。\n*   如果没有后缀，整数字面量的默认数据类型为\
  \ `\"int\"`。如果整数字面量需要被视为 `\"long\"` 数据类型，则必须使用后缀 `\"L\"` 或 `\"l\"`。这一特性对大多数开发者来说不应该感到意外。\n\
  *   如果没有使用后缀，浮点字面量的默认数据类型为 `\"double\"`。如果浮点字面量需要被视为 `\"float\"` 数据类型，则必须使用后缀。\n\
