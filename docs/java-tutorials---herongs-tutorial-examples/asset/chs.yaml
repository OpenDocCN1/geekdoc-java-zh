  \     }\n      }\n   }\n}\n```\n\n输出：\n\n```\n Thread 1: Holding lock 1...\nThread\
  \ 2: Holding lock 2...\n Thread 1: Waiting for lock 2...\nThread 2: Waiting for\
  \ lock 1...\n```\n\n如输出所示，在获取锁 1 后，线程 1 被挂起等待锁 2，而锁 2 正被线程 2 持有且永远不会释放，因为线程 2 也被挂起等待锁\
  \ 1，而锁 1 正好被 `thread1` 持有。因此，它们都无法继续执行。你必须按下 `Ctrl-C` 来停止程序。\n\nJava 教程 - Herong\
  \ 的教程示例\n\n∟死锁条件示例程序\n\n## 死锁示例 - 5 个餐哲学家\n\n本节提供了一个 Java 程序，模拟死锁示例 - 5 个餐哲学家。\n\
  \n五个哲学家的故事是死锁问题最有趣的说明。以下是来自 Sun Microsystems《Java 教程》中的故事版本。\n\n“五位哲学家坐在一圆桌旁。每位哲学家面前都有一碗饭。每两个哲学家之间有一根筷子。在一位哲学家吃饭之前，他必须拥有两根筷子，一把从左边拿，一把从右边拿。哲学家们必须找到分享筷子的方法，以便他们都能吃上。”\n\
  \n在这个故事中，如果所有哲学家同时从左侧拿筷子，并且在拿到右侧筷子之前没有人愿意放下，就会发生死锁。\n\n以下是一个模拟该故事的 Java 程序：\n\n\
  ```\n /* DinerThread.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.util.*;\npublic class DinerThread extends Thread {\n   public\
  \ static final int numberOfThreads = 5;\n   public static Object[] listOfLocks =\
  \ new Object[numberOfThreads];\n   public static char[] dinerTable = new char[4*numberOfThreads];\n\
  \   public static char[] lockedDiner = new char[4*numberOfThreads];\n   public static\
  \ Random randomGenerator = new Random();\n   public static int unitOfTime = 500;\n\
  \   private int threadIndex;\n   public static void main(String[] a) {\n      for\
  \ (int i=0; i<numberOfThreads; i++) listOfLocks[i] =\n         new Object();\n \
  \     for (int i=0; i<numberOfThreads; i++) {\n         dinerTable[4*i] = '|';\n\
  \         dinerTable[4*i+1] = ' ';\n         dinerTable[4*i+2] = '-';\n        \
  \ dinerTable[4*i+3] = ' ';\n         lockedDiner[4*i] = ' ';\n         lockedDiner[4*i+1]\
  \ = '|';\n         lockedDiner[4*i+2] = '=';\n         lockedDiner[4*i+3] = ' ';\n\
  \      }\n      for (int i=0; i<numberOfThreads; i++) {\n         Thread t = new\
  \ DinerThread(i);\n         t.setDaemon(true);\n         t.start();\n      }\n \
  \     String lockedString = new String(lockedDiner);\n      System.out.println(\"\
  The diner table:\");\n      long step = 0;\n      while (true) {\n         step++;\n\
  \         System.out.println((new String(dinerTable))+\"   \"+step);\n         if\
  \ (lockedString.equals(new String(dinerTable)))\n            break;\n         try\
  \ {\n            Thread.sleep(unitOfTime);\n         } catch (InterruptedException\
  \ e) {\n            System.out.println(\"Interrupted.\");\n         }\n      }\n\
  \      System.out.println(\"The diner is locked.\");\n   }\n   public DinerThread(int\
  \ i) {\n      threadIndex = i;\n   }\n   public void run() {\n      while (!isInterrupted())\
  \ {\n         try {\n            sleep(unitOfTime*randomGenerator.nextInt(6));\n\
  \         } catch (InterruptedException e) {\n            break;\n         }\n \
  \        // 尝试获取左边的筷子\n         Object leftLock = listOfLocks[threadIndex];\n  \
  \       synchronized (leftLock) {\n            int i = 4*threadIndex;\n        \
  \    dinerTable[i] = ' ';\n            dinerTable[i+1] = '|';\n            dinerTable[i+2]\
  \ = '=';\n            try {\n               sleep(unitOfTime*1);\n            }\
  \ catch (InterruptedException e) {\n               break;\n            }\n     \
  \       // 尝试获取右边的筷子\n            Object rightLock =\n               listOfLocks[(threadIndex+1)%numberOfThreads];\n\
  \            synchronized (rightLock) {\n               dinerTable[i+2] = 'o';\n\
  \               dinerTable[i+3] = '|';\n               dinerTable[(i+4)%(4*numberOfThreads)]\
  \ = ' ';\n               try {\n                  sleep(unitOfTime*1);\n       \
  \        } catch (InterruptedException e) {\n                  break;\n        \
  \       }\n               dinerTable[i] = '|';\n               dinerTable[i+1] =\
  \ ' ';\n               dinerTable[i+2] = '-';\n               dinerTable[i+3] =\
  \ ' ';\n               dinerTable[(i+4)%(4*numberOfThreads)] = '|';\n          \
  \  }\n         }\n      }\n   }\n}\n```\n\n在程序中，餐桌由一个字符数组表示。`|` 代表筷子，`-`、=` 和 `o`\
  \ 分别代表没有筷子、有一根筷子和两根筷子的哲学家。\n\n有 5 个线程代表 5 个哲学家。每个线程在尝试与左侧筷子相关的锁进行同步之前，都会暂停一段时间。在通过第一次同步后，线程将获取左边的筷子，并继续尝试与右侧筷子相关的锁进行同步。在通过第二次同步后，线程将获取右边的筷子，并持有一会儿。然后，线程会放下两根筷子并释放两个锁。\n\
  \n多次运行该程序。你会发现每次的行为都不同。但迟或晚，餐桌将会被锁定，此时每个线程都持有一个被左侧线程需要的锁，并等待一个由右侧线程持有的锁。\n\n我的其中一次执行结果给出了以下输出：\n\
