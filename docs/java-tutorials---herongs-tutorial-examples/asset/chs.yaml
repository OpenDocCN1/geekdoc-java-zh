  \ = 1770280\n   Total memory = 2031616\n   Maximum memory = 134217728\n   Memory\
  \ used = 261336\nPrint memory info - step = 4\n   Free memory = 1768064\n   Total\
  \ memory = 2031616\n   Maximum memory = 134217728\n   Memory used = 263552\nGet\
  \ memory info - step = 0\n   Free memory = 1777568\n   Total memory = 2031616\n\
  \   Maximum memory = 134217728\n   Memory used = 254048\nGet memory info - step\
  \ = 1\n   Free memory = 1777568\n   Total memory = 2031616\n   Maximum memory =\
  \ 134217728\n   Memory used = 254048\nGet memory info - step = 2\n   Free memory\
