  \\nTime = \"+(t2.getTime()-t1.getTime()));\n    System.out.println(\"Thread #, Years\"\
  );\n    int sum = 0;\n    for (int i=0; i<t_maxi; i++) {\n      sum += t_logs[i];\n\
