  \ memory info - step = 4\n   Free memory = 1777568\n   Total memory = 2031616\n\
  \   Maximum memory = 134217728\n   Memory used = 254048\n```\n\n\n\n\n\n如果你仔细观察数组分配前后的总内存值，你会发现\
  \ JVM 向操作系统请求了额外的 `2MB` 内存，以便有足够的内存分配给数组。我的推测是，总内存的扩展触发了垃圾回收调用，这移除了 JVM 中一些未使用的对象。\n\
  \n避免总内存扩展的方法是使用以下命令以初始总内存为 `4MB` 启动 JVM：\n\n```\n herong> java -Xms4m MemoryUsage\n\
  ```\n\n输出：\n\n```\n Memory usage before array allocation:\n   Free memory = 3874400\n\
  \   Total memory = 4128768\n   Maximum memory = 134217728\n   Memory used = 254368\n\
  Memory usage after array allocation:\n   Free memory = 1777232\n   Total memory\
  \ = 4128768\n   Maximum memory = 134217728\n   Memory used = 2351536\nMemory usage\
  \ summary:\n   Allocated to the array = 2097152\n   Memory usage increase = 2097168\n\
  \   Overhead of single array = 16\n```\n\n这一次程序的运行符合我的预期。内存使用量比存储数组数据元素所需的字节数多出了\
  \ `16 bytes`。因此，这 `16 bytes` 是一维数组的内存开销，用于存储数组的大小以及关于数组的其他信息。\n\nJava 教程 - Herong\
  \ 的教程示例\n\n∟系统属性和运行时对象方法\n\n∟`exec()` - 执行操作系统命令\n\n本节提供了一个关于如何计算大数组内存使用的教程示例。\n\
  \n`Runtime` 实例还提供了方法，允许 Java 应用程序作为子进程执行操作系统命令。以下程序使用 `exec()` 方法来执行 `chkdsk` 命令：\n\
  \n```\n /* CheckDisk.java\n * Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \ */\nimport java.io.*;\npublic class CheckDisk {\n   private static String cmd\
  \ = \"C:\\\\Windows\\\\System32\\\\chkdsk f:\";\n   public static void main(String[]\
  \ a) {\n      Runtime rt = Runtime.getRuntime();\n      try {\n         Process\
  \ p = rt.exec(cmd);\n         Reader in = new InputStreamReader(p.getInputStream());\n\
  \         int c = in.read();\n         while (c!=-1) {\n            System.out.print((char)c);\n\
  \            c = in.read();\n         }\n      } catch (IOException e) {\n     \
  \    System.out.println(e.toString());\n      }\n   }\n}\n```\n\n注意，该程序假设你连接了一个驱动器\
