  \ 位是最小的存储单位，只能存储两个可能的值：0 和 1。\n* 字节是包含 8 位的存储单位。\n* \"byte\" 是 Java 中的一种原始数据类型。`byte`\
  \ 变量可以存储 -128 到 127 范围内的整数。\n* 要为 `byte` 变量赋值，你需要隐式地或显式地（使用 `(byte)`）将原始值转换为 `byte`\
  \ 数据类型。\n* `byte` 变量可以参与任何算术和比较操作。但在操作之前，它们的值会被转换为 `int` 数据类型。\n* 位运算是针对 `int` 数据类型定义的，而不是\
  \ `byte`。\n* 移位操作是针对 `int` 数据类型定义的，而不是 `byte`。\n\nJava 教程 - Herong 的教程示例\n\n## 位、字节、位运算与移位操作\n\
  \n### 什么是位和字节\n\n本节介绍了位和字节作为数据存储单位以及数据类型。\n\n**位 (Bit)** - 计算机世界中最小的存储单位。它只能包含两个可能的值：0\
  \ 和 1。\n\n**位 (Bit)** - 数字信息大小的最小计量单位。\n\n**位 (Bit)** - 二进制数中的单个数字。它只能有两个可能的值：0\
  \ 和 1。\n\n**字节 (Byte)** - 一个包含 8 位的存储单位。一个字节可以存储 256 个可能的值。\n\n**字节 (Byte)** - 数字信息大小的计量单位。1\
  \ 字节 = 8 位。例如，一个 Java 源代码文件 `Hello.java` 的大小为 109 字节。\n\n**字节 (Byte)** - 许多编程语言中的一种数据类型。它可以存储\
  \ 256 个可能的整数值。在 Java 中，`byte` 是一种原始数据类型，可以存储 -128 到 127 范围内的整数值。\n\nJava 教程 - Herong\
