- - '###'
  - 实现的第二个代价是增加了漏洞和安全概率
- - '###'
  - 实现的第三个代价是增加了发布版本相关的负担。
- - '###'
  - 实现接口不是可以轻率采取的。
- - '###'
  - 为继承设计的类（Item 17）应该很少实现，接口应该很少扩展。
- - '###'
  - 违反规则会给扩展类或实现接口带来沉重的负担。
- - '###'
  - 某些情况下，如果一个类或接口的存在为了所有参与者都实现 `Serializable` 的框架，那么该类或实现或扩展 `Serializable` 是完全合理的。
