  - 5. 当你写完 equals 方法后，问问自己三个问题：它是对称的吗？它是传递的吗？它是一致的吗？不要仅仅问问自己；要编写单元测试来检查这些属性是否成立！如果它们不成立，请找出原因并相应地修改
    `equals` 方法。当然，你的 `equals` 方法还必须满足另外两个属性（自反性和“非空性”），但这两个属性通常会自动处理好。
