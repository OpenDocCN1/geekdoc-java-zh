  trans: "\n\n![](img/00001.jpeg)\n\n# Java 8 中的 Lambda 表达式\nVLIGHT\n\n## 目录\n- 为什么使用\
    \ Lambda\n- 标准语法\n- 参数类型可以推断\n- 多行代码\n- 带有推断泛的单个参数\n- 方法引用\n\n## 为什么使用 Lambda\
    \ \n在 Java 8 中，Lambda 表达式本质上是一段可以被到处传递并执行的代码块。\n\n如果你想执行一段代码块，通常需要先创建一个对象，然后传递该对象。\n\
    \nLambda 表达式非常强大且极具吸引力。\n\nLambda 表达式可以通过以下几种方式声明：\n- 标准语法\n- 参数类型可以推断\n- 多行代码\n\
    - 带有推断泛的单个参数\n- 方法引用\n\n## 标准语法\nLambda 表达式的标准语法包含以下部分：\n- 括在括号内的、用逗号分隔的形参参数列表\n\
    - 箭头 (`->`)\n- 由单个表达式或代码块组成的主体\n\n### 示例代码\n```java\nString[] friendList = {\"\
    Tuan\", \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n(String friend01, String\
    \ friend02) ->\n  Integer.compare(friend01.length(), friend02.length()));\n\n\
    System.out.print(Arrays.toString(friendList));\n```\n\n### 输出\n`[Lan, Nam, Tuan]`\n\
    \n## 参数类型可以推断\n如果可以从上下文中推断，可以省略参数类型。这会让你的代码更加整洁。\n\n### 示例代码\n```java\nString[]\
    \ friendList = {\"Tuan\", \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n(friend01,\
    \ friend02) ->\n  Integer.compare(friend01.length(), friend02.length()));\n\n\
    System.out.print(Arrays.toString(friendList));\n```\n\n### 输出\n`[Lan, Nam, Tuan]`\n\
    \n## 多行代码\n如果你的代码无法在一行内完成，可以将其包含在 `{}` 中，并且代码现在必须显式地包含一个 `return` 语句。\n\n### 示例代码\n\
    ```java\nString[] friendList = {\"Tuan\", \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n\
    (String friend01, String friend02) ->\n{\n  if (friend01.length() > friend02.length())\n\
    \      return -1;\n  else\n      return 0;\n});\n\nSystem.out.print(Arrays.toString(friendList));\n\
    ```\n\n### 输出\n`[Lan, Nam, Tuan]`\n\n## 带有推断泛的单个参数\n当单个参数的类型可以推断时，你可以省略括号。\n\n\
    ### 示例代码\n```java\nString[] friendList = {\"Tuan\", \"Nam\", \"Lan\"};\n\nStream<String>\
    \ friendStream = Stream.of(friendList);\n\nstream.forEach(friend -> System.out.println(friend));\n\
    ```\n\n### 输出\n`Tuan`\n`Nam`\n`Lan`\n\n## 方法引用\n你可以使用方法引用 (`::`) 来减少代码。\n\n###\
    \ 示例代码\n```java\nString[] friendList = {\"Tuan\", \"Nam\", \"Lan\"};\n\nStream<String>\
    \ friendStream = Stream.of(friendList);\n\nstream.forEach(System.out::println);\n\
    ```\n\n### 输出\n`Tuan`\n`Nam`\n`Lan`\n\n"
