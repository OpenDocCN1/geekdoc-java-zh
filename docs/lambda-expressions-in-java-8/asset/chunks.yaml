- fmt: "\n![](images/00001.jpeg)\n\n# Lambda Expressions in Java 8\nVLIGHT\n\n## Table\
    \ Of Contents\n- [Why Lambdas](#why-lamb)\n- [Standard syntax](#standard-syntax)\n\
    - [Parameter type can be inferred](#)\n- [Multiple lines of code](#)\n- [Single\
    \ parameter with inferred types](#)\n- [Method references](#)\n\n## Why Lambdas\
    \ \nIn Java 8, a Lambda Expression is nothing but a block of code which can be\
    \ passed around to execute.\n\nYou need to create an object then pass the object\
    \ around if you want a block of code to be executed.\n\nLambda Expressions are\
    \ very powerful and compelling.\n\nA Lambda Expression can be declared in some\
    \ ways as follows:\n- Standard syntax\n- Parameter type can be inferred\n- Multiple\
    \ lines of code\n- Single parameter with inferred types\n- Method references\n\
    \n## Standard syntax\nThe standard syntax of a lambda expression has the following\
    \ blocks:\n- A comma-separated list of formal parameters which are enclosed in\
    \ the parenthesis\n- The arrow (`->`)\n- A body which consists of a single expression\
    \ or a block of code\n\n### Sample Code\n```java\nString[] friendList = {\"Tuan\"\
    , \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n(String friend01, String friend02)\
    \ ->\n  Integer.compare(friend01.length(), friend02.length()));\n\nSystem.out.print(Arrays.toString(friendList));\n\
    ```\n\n### Output\n`[Lan, Nam, Tuan]`\n\n## Parameter type can be inferred\nThe\
    \ parameter types can be omitted if they can be inferred from the context. This\
    \ makes your code more cleaner.\n\n### Sample Code\n```java\nString[] friendList\
    \ = {\"Tuan\", \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n(friend01, friend02)\
    \ ->\n  Integer.compare(friend01.length(), friend02.length()));\n\nSystem.out.print(Arrays.toString(friendList));\n\
    ```\n\n### Output\n`[Lan, Nam, Tuan]`\n\n## Multiple lines of code\nIf your code\
    \ cannot be written in 1 line, it can be enclosed in `{}` and your code now should\
    \ explicitly contain a return statement.\n\n### Sample Code\n```java\nString[]\
    \ friendList = {\"Tuan\", \"Nam\", \"Lan\"};\n\nArrays.sort(friendList,\n(String\
    \ friend01, String friend02) ->\n{\n  if (friend01.length() > friend02.length())\n\
    \      return -1;\n  else\n      return 0;\n});\n\nSystem.out.print(Arrays.toString(friendList));\n\
    ```\n\n### Output\n`[Lan, Nam, Tuan]`\n\n## Single parameter with inferred types\n\
    You can omit the parenthesis for a single parameter when its type can be inferred.\n\
    \n### Sample Code\n```java\nString[] friendList = {\"Tuan\", \"Nam\", \"Lan\"\
    };\n\nStream<String> friendStream = Stream.of(friendList);\n\nstream.forEach(friend\
    \ -> System.out.println(friend));\n```\n\n### Output\n`Tuan`\n`Nam`\n`Lan`\n\n\
    ## Method references\nYou can reduce code using the method reference (`::`).\n\
    \n### Sample Code\n```java\nString[] friendList = {\"Tuan\", \"Nam\", \"Lan\"\
    };\n\nStream<String> friendStream = Stream.of(friendList);\n\nstream.forEach(System.out::println);\n\
    ```\n\n### Output\n`Tuan`\n`Nam`\n`Lan`\n"
