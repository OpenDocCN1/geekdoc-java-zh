    \ FIFO）。这意味着当一个元素被添加到栈时，它也是第一个从栈中出来的元素。你可以将栈想象成一堆物理对象。栈中的每个节点都引用它下方的对象，而获取下方对象的唯一方法是移除顶部的对象。我们使用右侧的图表表示栈。\n\
