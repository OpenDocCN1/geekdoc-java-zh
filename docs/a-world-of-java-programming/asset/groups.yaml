    # Introduction


    In the world that we live in today, technology is a growing factor and influence
    in different jobs and lifestyles. People using phones and computers to do their
    everyday tasks, and companies running databases to keep track of all their data;
    all come from code.


    Code, seen as the basis of everything that functions in today''s society, can
    be anything from the code of the human being (DNA) to the code that creates high-end
    software. In a world where technology is becoming more vital, it is important
    to understand this new direction, and perhaps take a part in its development.


    Everything starts at a beginning, and as you open this book for the first time
    you shall find an adventure that will lead you through the basis of a coding language
    called Java, all the way to using Java to create GUIs. The adventure that you
    will go on is one of trial and error, learning, and most of all, giving you the
    experience and the basis to understand the direction that the future is heading.


    As you go through this book, we have prepared examples, example code, questions,
    and images that will all help you on your journey. We hope that you shall find
    your adventure to be successful, and we wish you the best of luck on your journey
    to becoming a programmer!


    # Chapter One: Hello World


    ### What is Java


    Almost everything around us is ran by some type of program. From cars to dishers
    almost every device has a computer built into it. But what is a program, and what
    is a computer?


    In computer science, a computer is any device that can store and manipulate data.
    In a traditional electronic computer data is stored in two locations: the hard
    drive (used for long-term storage) and the random-access memory (abbreviated RAM
    and used for short-term storage). All memory in an electronic computer is stored
    as 0s and 1s. These 0s and 1s are called bits (short for binary digits). The computer
    manipulates the data in memory using its central processing unit (CPU). The CPU
    is the brains of the computer. Don''t worry too much about how of these systems
    work. You just need to have a basic understanding of them and know that they exist.


    A program is a set of instructions that tell a computer how to manipulate the
    data that is stored in memory. For example, we could have a simple program that
    just adds two numbers in the RAM together. However, computers only understand
    the binary 0s and 1s (called machine language). So, talking to them and telling
    them what to do is tricky and hard to understand. Because of this, programmers
    have invented programming languages.


    A programming language is a set of words and phrases that can be easily translated
    into machine language, so computers can understand it. There are many kinds of
    programming languages, and they all have their own strengths and weaknesses. The
    Java programming language is just one of these.


    Java can be classified as a high-level, object-oriented, byte code interpreted
    programming language. That is a mouthful to say so let''s break it down. A high-level
    language is any programming language that is relatively close to sounding like
    a real language (such as English). This makes it easier to look at and understand.
    An object-oriented language specializes in putting code in little packets called
    objects (these will be discussed in later). Lastly, byte code interpreted is how
    it is processed.


    The Java programming language is like:

    - 1. High-level

    - 2. Object-oriented

    - 3. Byte code interpreted


    # Setting Up Your Environment


    Before you can start programming, you will first need to get the SDK (Software
    Development Kit). This set contains everything Java will need. Called Integrated
    Development Environments (or IDEs), these programs include useful features like:

    - Spell checking

    - Logic error detection

    - Syntax error detection

    - Built-in compilers


    There are many different IDEs out there and each one has its pros and cons. This
    book is designed to work with either Eclipse or IntelliJ.


    # Creating a Program In Eclipse


    Once you have downloaded Eclipse it''s time to create our first program. To start,
    open Eclipse and select the default workspace by selecting "OK". You will have
    to do this each time you open Eclipse.


    The first time you open a new workspace you will be greeted by the Eclipse welcome
    screen. Here you can get an overview of the entire IDE along with a few tutorials.
    For now, just click the "restore" button at top right of the screen.


    Now that we have opened the editor there are three important windows to take note
    of:


    - Package Explorer: Located on the left-hand side of the screen, this is where
    we will see all of the projects (programs) that are saved to this particular workspace.

    - Editor Window: The large blank space in the center of the screen is the editor
    window. This will be used later to edit and create our code.

    - Console: The console can be found at the bottom of the screen under the console
    tab, this is where any print statements, errors, or other important information
    will be displayed when we run our programs. If the console isn''t being displayed,
    then go to: "Windows" -> "Show View" -> "Console".


    To create a new Project, you will need to go to "File" -> "New" -> "Java Project".
    This opens open "New Java Project" window. Here we can specify many things about
    the program creating. For now, just set the project name to "HelloWorld" then
    click "Finish".


    Next, right-click on the folder and select "New" -> "Class". This will bring up
    the "New Java Class" window. This window will allow you many of the settings that
    define a Java class. For right now we are only interested in two of these fields.
    First, set the "Name" of the class to "HelloWorld". Second click on the check
    box for "public static void main(String[] args)", this will create the Main Method
    in our program. Once you are done click "Finish".

