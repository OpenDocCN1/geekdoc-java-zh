    The while loop is the most basic of the loops but also the most powerful. At the\
    \ top of the while loop you have a condition. This condition is always a boolean\
    \ expression and the loop will continue to run until the expression is false.\
    \ Inside the loop we put the code we want to run repeatedly. Below is a while\
    \ loop that adds all the numbers between zero and one thousand.\n\n```java\nint\
    \ num = 1; // The number to be added\nint sum = 0; // The current sum\n\nwhile\
    \ ( num <= 1000 ) {\n    sum += num;\n    num++;\n}\n\nSystem.out.println( sum\
    \ );\n```\n\nIn this example the while loop will run as long as num <= 1000. Each\
