  mdcn: "\n\n## 在 IntelliJ 中创建程序\n\n安装好 IntelliJ 后，你就可以准备好创建第一个程序了。首先，打开 IntelliJ\
    \ 并在弹出窗口中选择“Create New Project”（创建新项目）。点击后，将打开“New Project”窗口。\n\n当加载下一页时，检查 IntelliJ\
    \ 是否已自动找到你的 Java SDK。如果没有，你将需要点击“New...”（新建）按钮并选择你安装的 SDK。完成后继续下一步。\n\n下一页允许你从模板加载项目。我们在本书中不会使用任何模板，因此只需确保没有选中任何模板，然后点击“Next”（下一步）。\n\
    \n接下来的页面是我们定义项目名称的地方。对于此示例，请将项目名称更改为“HelloWorld”，不要有空格。完成后，选择“Finish”（完成）。此时，你可能需要等待\
    \ IntelliJ 创建工作空间。构建完成后，屏幕左侧将出现一个面板，显示我们的项目名称“HelloWorld”和一个箭头。\n\n选择箭头以展开我们的项目文件夹。右键点击“src”文件夹，选择\
    \ New（新建）→ Java Class（Java 类）。将类命名为“HelloWorld”并点击“OK”（确定）。这将加载一个包含我们代码的新标签页。\n\
    \n现在你已经成功创建了项目，让我们来回顾 IntelliJ IDE 的不同部分。\n\n- 激活工具窗口（Active Tool Window）：位于屏幕左侧，在这里我们可以看到在当前项目中使用的所有文件。\n\
    - 编辑器窗口（The Editor Window）：屏幕中心的大型空白区域是编辑器窗口。它将在稍后用于编辑和创建我们的代码。\n- 控制台（The Console）：在我们运行代码之前控制台是不可见的，但它将出现在屏幕底部。当我们运行程序时，任何打印语句、错误或其他重要信息都将在控制台中显示。\n\
    \n## 编写代码\n\n现在你已经知道 IDE 每个部分的作用，让我们来编写第一个程序。将编辑器窗口中的代码更改为下面的代码。\n\n```java\n\
    public class HelloWorld {\n    public static void main (String [] args) {\n  \
    \      System.out.print(\"Hello World!\");\n    }\n}\n```\n\n现在你已经创建了代码，可能在好奇它是做什么的。我们将逐步介绍代码的每一个部分，并解释每一个组件。\n\
    \n- 类定义（Class Definition）：告诉 Java 该类可以做什么和不能做什么（目前我们不会为类添加任何特殊限制）。它还告诉我们类的名称（在本例中为\
    \ \"HelloWorld\"）。\n- 主方法（Main Method）：运行程序时将调用的第一个方法。你可以将此方法想象为告诉程序该做什么的“老板”。\n\
    \n```java\npublic static void main(String [] args) {\n    System.out.println(\"\
    Hello World!\");\n}\n```\n\n- 大括号（{}）：告诉 Java 类或方法从哪里开始。\n- 右括号（}）：告诉 Java 类何时结束或主方法何时结束。\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String [] args)\
    \ {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n现在你可能在好奇这些高亮单词的意思。其中一些单词我们称为修饰符（modifiers）。每个修饰符都会告诉编译器关于方法、类或变量可以做什么或不能做什么的信息。这里有两个包含你可能会发现的有用修饰符的表格；修饰符的完整列表请书末的“Useful\
    \ Tables and References”（常用表格和参考）。\n\n## 方法修饰符：\n\n| 修饰符 | 说明 |\n| :--- | :---\
    \ |\n| public | 此类可以被任何其他类访问 |\n| static | 程序中只能有一个同名的方法 |\n\n## 类修饰符：\n\n| 修饰符\
    \ | 说明 |\n| :--- | :--- |\n| public | 此类可以被任何其他类访问 |\n| default | 此类只能被相同包（文件夹）中的其他类使用\
    \ |\n\n现在让我们仔细观察主方法，看看它到底意味着什么。我们已经知道 `public static` 意味着方法可以被任何其他类访问，且程序中只能有一个主方法，但\
    \ `void` 是什么意思？方法签名中的这部分是我们所说的返回类型（return type）。你可以将方法想象为一个机器，我们可以向其中放入东西（称为参数或参数），有时我们还可以从中取出东西（称为返回类型）。在我们的主方法中，我们不想返回任何内容，所以写了\
    \ `void`。括号中的内容是参数（我们喂给机器的东西）。\n\n你在 Java 中创建的任何方法看起来都会像这样：\n\n```java\npublic\
    \ static void main ( String[] args ) {\n```\n\n现在不要太担心方法签名中参数部分的意思，那将在后面的章节中讨论。\n\
    \n取决于你选择的是什么 IDE，它还可能包含一段额外的代码，以两个正斜杠 `//` 开头或者被 `/* **/` 包围。这在 Java 中被称为注释（comment）。在运行代码时，注释内编写任何内容都会被忽略。当你想要描述代码某些部分时可以使用此功能。关于你应该注释哪些内容的更多信息，请参阅书末的指南。\n\
    \n接下来，让我们谈谈打印语句。双引号内的任何内容在语句执行时都会打印到控制台上。\n\n```java\npublic class HelloWorld\
    \ {\n    public static void main (String [] args) {\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\n为了测试代码，我们需要编译。\n\n### Eclipse 用户：\n只需点击绿色按钮运行。在这种情况下，Eclipse\
    \ 可能会提示保存。\n\n### IntelliJ 用户：\n要运行代码，选择 Run > Run。这将打开控制台并打印 Hello!.\n\n恭喜你！你刚刚创建了你的第一个程序！虽然现在可能觉得有些不可从，但你已经迈向了成为程序员的第一步。\n\
    \n"
