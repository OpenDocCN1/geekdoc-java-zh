  mdcn: "\n需要记住的一点是，每个对象会在不同的方法中存储自己的数据，因此如果你有两个不同的对象并在它们中存储了数据，那么数据只能从同一个对象被调用。这意味着\
    \ `object1.getData()` 获取的是 `object1` 仅属于该对象的数据，而 `object2.getData()` 获取的是 `object2`\
    \ 仅属于该对象的数据。\n\n假设你想要读取一个自定义的整数并对其进行处理。我们应该使用哪种方法呢？我们将使用 `nextInt()` 来获取输入的整数并将其存储在\
    \ `integer` 类型中，这样类型就能匹配：\n\n```java\nimport java.util.Scanner;\n\npublic class\
    \ UserInput {\n\n    public static void main( String [ ] args ) {\n\n        Scanner\
    \ name = new Scanner ( System.in );\n        System.out.println(\"Enter an integer:\
    \ \");\n        int x = name.nextInt();\n        name.close( );\n\n    }\n}\n\
    ```\n\n这段代码创建了一个新的扫描器，然后设定整数 `x` 等于你在控制台中输入的任何整数。例如，如果你输入 9，`x` 就会被设置为 9。\n\n\
    一个需要记住的重要事项是**始终关闭扫描器**。这非常重要，因为如果你在代码中尝试其他操作，它会消耗大量内存，导致电脑变慢，而且极其不安全。它会使代码的部分处于开启状态，黑客或其他人员进入并操纵你的代码，导致存储的数据不安全、暴露且容易被破解。\n\
    \n你说你想对数据进行处理。要对其进行处理，你只需要获取存储你输入的变量，并像处理普通变量一样对其进行操作即可。\n\n例如，假设 `x` 仍然是 9，并且你运行下面的代码，该代码将输出\
    \ 27。\n\n```java\nimport java.util.Scanner;\n\npublic class TextInput {\n    public\
    \ static void main( String [ ] args ) {\n        Scanner name = new Scanner (\
    \ System.in );\n        System.out.println( \"Enter an integer: \" );\n      \
    \  int x = name.nextInt();\n        System.out.println( 3 * x );\n        name.close(\
    \ );\n    }\n}\n```\n\n虽然这对于获取单个输入很好，但假设我们想要程序无限重复，这样它每次都会重新启动扫描器，直到输入了打破循环的命令或者一直无限运行下去。我们将为此使用无限的\
    \ `for` 循环。其中一种循环看起来如下：\n\n```java\nfor ( ; ; ) {\n    // 扫描器和打印行的代码\n}\n```\n\
    \n这个 `for` 循环目前这样会一直运行，直到你物理停止程序。\n\n无限 `for` 循环适用于简单的操作，例如想要对所有输入求和，直到输入 -1，然后代码打印出总和平均值？\n\
    \n```java\nimport java.util.Scanner;\npublic class UserInput {\n    public static\
    \ void main( String [ ] args ) {\n        Scanner scan = new Scanner ( System.in\
    \ );\n        int n = 0;\n        int x = 0;\n        int sum = 0;\n        for\
    \ ( ; ; ){\n            System.out.print(\"Enter a number: \");\n            x\
    \ = scan.nextInt();\n            if ( x == -1 ) {\n                break;\n  \
    \          } else {\n                sum += x;\n                n++;\n       \
    \     }\n        }\n        double avg = ( double ) sum / n;\n        System.out.println(\"\
    Sum \" + sum );\n        System.out.print(\"Average \" + avg + \"\\n\");\n   \
    \     scan.close( );\n    }\n}\n```\n\n左侧代码中的 `for` 循环将运行到输入 -1 为止，使用代码跳出循环。需要记住的一点是，我们在循环外部创建了所有变量。这样我们就能连续地累加它们，而不是在每次循环重启时让它们回到\
    \ 0。\n\n这是另一种为你正在工作的程序提供数据和其他信息的方法。这种提供信息的方式是通过你的代码扫描文件，并执行与用户通过控制台输入时完全相同的处理任务。\n\
    \n同样重要的是指出，`for ( ; ; )` 等同于 `while ( true )`。这两者中的任何一个都会创建一个无限循环。\n\n## 使用文件作为输入\n\
    \n为此，我们需要需要在项目中创建一个空的文本文件。这样做，右键点击项目文件夹，选择新建（new），并创建文件（file）。将文件命名为 `test.txt`。确保创建的文件在项目文件夹内，而不是源文件夹内。在文件中写入数字\
    \ 5 和 6，中间留一个空格。\n\n现在你准备好开始编写代码了！\n\n还记得我们创建扫描器时使用了 `System.in` 命令吗？要使用文件作为输入，我们所做的只是将其替换为文件对象，如下所示：\n\
    \n```java\nFile file = new File(\"test.txt\");\nScanner scan = new Scanner(file);\n\
    ```\n\n记住，我们可能需要从 `java.io` 导入文件对象和 `FileNotFoundException`。\n\n对于第一个示例，让我们创建一个：\n\
    \n- 一个名为 `scanInput` 的静态方法，返回一个 `int`。\n- 然后，使用上面的两行代码并创建一个新文件和一个扫描器。\n- 使用 `while`\
    \ 循环使扫描器在还有剩余内容时进行读取。\n- 将读取的每个整数加到 `total` 中。\n- 然后关闭扫描器并返回 `total`。\n\n```java\n\
    public static int scanInput() {\n    int total = 0;\n    try {\n        File file\
    \ = new File(\"test.txt\");\n        Scanner scan = new Scanner(file);\n\n   \
    \     while (scan.hasNext()) {\n            total += scan.nextInt();\n       \
    \ }\n        scan.close();\n    } catch (FileNotFoundException e) {\n        e.printStackTrace();\n\
    \    }\n\n    return total;\n}\n```\n\n"
