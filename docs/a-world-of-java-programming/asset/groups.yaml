  mdcn: "\n\n## 5: 变量访问修饰符 †\n\n| 修饰符 | 描述 |\n| :--- | :--- |\n| default* 默认 | 此变量只能由同一包中的类使用（访问）\
    \ |\n| private 私有 | 此变量只能由它所在的类使用（访问） |\n| protected 保护的 | 此方法只能由同一包中的类或此类的子类使用。\
    \ |\n| public 公有 | 此变量可以被任何类使用（访问） |\n\n## 6: 变量非访问修饰符 †\n\n| 修饰符 | 描述 |\n| :---\
    \ | :--- |\n| final 最终 | 这是该变量的最终版本，不能被更改 |\n| static 静态 | 从所有实际角度来看，这使得类中只能有一个同名的变量。\
    \ |\n\n## 7: 特殊字符\n\n| 特殊字符 | 输出内容 |\n| :--- | :--- |\n| \\\" | 双引号 |\n| \\' |\
    \ 单引号 |\n| \\\\ | 反斜杠 |\n| \\n | 换行 |\n| \\t | 制表符 |\n| \\b | 退格 |\n|| \\r | 回车\
    \ |\n\n- 如果类、方法或变量没有定义访问修饰符，Java 将自动为其分配默认修饰符。\n- 并不是所有的修饰符都包含在内，因为有些过于高级，在入门书中无法解释。\n\
    \n## 表 8: 变量类型\n\n| 名称 | 存储内容 |\n| :--- | :--- |\n| byte 字节 | 单个字节，一个 127 到 -128\
    \ 之间的数字。 |\n| short 短型 | -32,767 到 32,768 之间的整数。 |\n| int 整型 | -2,147,483,648\
    \ 到 2,147,483,647 之间的整数。你应该始终优先使用它而不是 short，除非你需要更大的数字或者你担心内存使用。 |\n| long 长整型\
    \ | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 之间的整数。long 占据的空间比 int\
    \ 多，仅在需要时使用。 |\n| float 浮点型 | 约 6 位有效数字的小数。 |\n| double 双精度浮点型 | 约 15 位有效数字的小数。虽然\
    \ double 占据的空间比 float 大，除非你有理由不使用，否则你应该始终使用 double。 |\n| boolean 布尔 | 真或假 |\n\
    | char 字符 | 单个 ASCII 字符 |\n| String 字符串 | 一系列字符 |\n\n## 表 9: 常见泛型类型 §\n\n| 泛型类型\
    \ | 存储内容 |\n| :--- | :--- |\n| <Integer> | int |\n| <Double> | double |\n| <Boolean>\
    \ | boolean |\n| <Character> | char |\n| <String> | String |\n\n> ‡ : 记住所有的 ASCII\
    \ 值都以整数的形式存储。因此，给字母“a”加 1 将得到“b”。\n\n```\nchar letter = 'a';\nletter += 1;\nSystem.out.println(\
    \ letter );\n```\n打印 \"b\"\n\n§ : 任何对象都可以作为泛型类型。例如，ArrayList<Lion> 将创建一个持有我们在第七章中\
    \ Lion 类的数组列表。\n\n## 如何安装并接受下载 Java\n\n对于 Windows：\n\n- 1. 进入 Java SE 下载网站。\n\
    - 2. 找到最新版本的 Java SE 并选择 JDK。\n- 3. 选择适用于你操作系统的正确版本：\n    * 对于 32 位操作系统选择“Windows\
    \ x64”。\n    * 对于 64 位操作系统选择“Windows x86”。\n- 4. 运行下载程序程序，并接受所有默认设置。\n- 5. 启动：控制面板\
    \ -> 系统 -> 高级设置\n- 6. 在“系统变量”下，滚动到“Path”并选择“编辑”\n\n对于 Windows 10：\n\n- I. 点击“新建”并输入\
    \ JDK bin 目录的路径\n默认情况下将类似于：“c:\\Program Files\\Java\\jdk1.#.#_bin”，其中 # 取决于版本。\n\
    - III. 选择“上移”将新的路径变量移动到顶部。\n\n对于 Windows 10 之前的操作系统：\n\n- I. 阅读所有步骤，此操作不可撤销。\n\
    - II. 将“变量值”中的所有文本复制到文本文件中，以防你搞错。\n- III. 在文本开头写入 JDK bin 目录的路径。默认情况下类似于：“c:\\\
    Program Files\\Java\\jdk1.#.#_bin”，其中 # 取决于版本。\n- IV. 在路径后加上一个分号 (;)。\n- V. 不要删除任何其他条目。如果你没有将旧文本复制回来并重新开始，将会导致问题。\n\
    \n- 8. 将下载的文件解压到你想存储程序文件的目录中。\n\n对于 Mac OS：\n\n- 1. 在某些 Mac 系统上已经安装了 JDK。要进行检查，请搜索“Terminal”（终端）并运行它。\n\
    - 2. 运行此命令：`javac -version`\n如果返回了版本号，说明你已经安装了 JDK。否则，继续执行第三步。\n- 3. 进入 Java SE\
    \ 网站并下载适用于 Mac OS 的最新 JDK。\n- 4. 双击下载的文件并按照说明操作。\n\n## 答案\n\n第 1 章：\n\n- 1. 计算机是任何可以存储数据的设备。\n\
    - 2. 软件是计算机执行的指令。\n- 3. 编译器是把源代码翻译成机器码的程序。\n- 4. 解释器是逐行执行代码的程序。\n- 5. 调试是寻找并修复错误的过程。\n\
    - 6. 变量是存储数据的命名空间。\n- 7. 常量是不可更改的变量。\n- 8. 方法是执行特定任务的代码块。\n- 9. 类是创建对象的模板。\n-\
    \ 10. 对象是类的实例。\n- 11. 继承允许一个类重用另一个类的代码。\n\n第 2 章：\n\n- 1. 变量类型定义了变量可以存储什么类型。\n\
    - 2. 标识符是变量的名称。\n- 3. 运算符是用于执行操作的符号。\n- 4. 赋值运算符用于将值赋给变量。\n- 5. 比较运算符用于比较两个值。\n\
    - 6. 逻辑运算符用于组合布尔值。\n- 7. 条件语句用于控制程序的执行流。\n- 8. 循环语句用于重复执行代码块。\n- 9. 数组是存储相同类型元素的集合。\n\
    - 10. 字符串是字符的序列。\n\n第 3 章：\n\n- 1. 方法调用是执行方法代码的过程。\n- 2. 参数是传递给方法的值。\n- 3. 返回值是方法执行后的结果。\n\
    - 4. 作用域定义了变量的可访问范围。\n- 5. 异常是运行时发生的错误。\n- 6. try-catch 块用于处理异常。\n- 7. throw 关键字用于抛出异常。\n\
    - 8. 文件流是用于读取或写入文件的。\n- 9. 输入输出流是处理数据传输的。\n- 10. 序列化是将对象转换为字节流的过程。\n\n第 4 章：\n\
    \n- 1. 泛型允许类处理任意类型。\n- 2. 泛型参数在类型括号中。\n- 3. 接口是定义方法行为的约。\n- 4. 类实现接口以提供具体行为。\n\
    - 5. 抽象类是不能实例化的类。\n- 6. 抽象方法没有方法体。\n- 7. 多态允许一个类对父类的方法进行重写。\n- 8. 重载允许同类中有同名不同的方法。\n\
    - 9. 重写允许子类修改父类的方法。\n- 10. 包用于组织相关的类和接口。\n\n第 5 章：\n\n- 1. 线程是程序执行的独立单元。\n- 2.\
    \ 多线程编程允许多个任务同时运行。\n- 3. 锁用于同步线程对共享资源的访问。\n- 4. 死锁是多个线程互相等待对方的情况。\n- 5. 网络编程是用于计算机间通信的。\n\
    - 6. Socket 是用于网络通信的端点。\n- 7. 垃圾回收是自动管理内存的机制。\n- 8. 性能优化是提高程序运行速度。\n- 9. 测试是验证代码正确性的过程。\n\
    - 10. 文档是关于代码如何使用的说明。\n\n"
