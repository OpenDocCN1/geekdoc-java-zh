    \n## 第三章：条件语句\n\n## 布尔表达式\n\n在上一章中，我们学习了布尔值以及它们如何存储真或假。布尔值本身并不用。然而，它们可以用来提问。布尔表达式是一组变量和运算符，其求值结果真或假。\n\
    \n| 运算符 | 名称 | 描述 | 示例 |\n| --- | --- | --- | --- |\n| == | 等于 | A 等于 B 吗？ | 2\
    \ == 3 为 false |\n| > | 大于 | A 大于 B 吗？ | 2 > 3 为 false |\n| >= | 大于等于 | A 大于等于\
    \ B 吗？ | 2 >= 3 为 false |\n| < | 小于 | A 小于 B 吗？ | 2 < 3 为 true |\n| <= | 小于等于\
    \ | A 小于等于 B 吗？ | 2 <= 3 为 true |\n| != | 不等于 | A 不等于 B 吗？ | 2 != 3 为 true |\n\
    | ! | 非 | 假的吗？ | false |\n| || | 逻辑或 | A 或或 B 为真吗？ | true || false 为 true |\n\
    | && | 逻辑与 | A 和 B 都为真吗？ | true && false 为 false |\n\n你还可以组合逻辑运算符来提出更复杂的问题。例如，你可以问：(A\
    \ > 5) && (A < 10)。这等同于说“A 大于5且小于10吗？”\n\n## if 语句\n\n虽然我们现在可以在代码中提问，但仍然无法根据问题的答案改变程序的运行方式。这就是\
    \ if 语句大显用场的地方。if 语句是一种选择形式，告诉代码根据问题的答案执行某些操作。例如，这里的代码只有在 min 为偶数时才打印“Is Even”。\n\
    \n```java\nint num = 9;\nif ( ( num % 2 ) == 0 ) {\n  System.out.println(\"Is\
    \ Even\");\n}\n```\n\n注意，我们用大括号（{{}}）围绕 if 语句中的代码，就像对待方法和类一样。\n\n除了 if 语句外，你还可以添加\
    \ else 语句。else 会捕捉任何没有正确回答原始 if 语句问题的项。我们可以将此添加到之前的代码中到 20\n\n"
