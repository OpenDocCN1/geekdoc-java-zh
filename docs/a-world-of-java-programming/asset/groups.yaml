    \ + sum );\n        System.out.print(\"Average \" + avg + \"\\n\");\n        scan.close(\
    \ );\n    }\n}\n```\n\nThe code on the left, the for loop will run until -1 is\
    \ typed in, using the code to break out of the loop. An important thing to remember,\
    \ is that we created all of our variables outside the loop. This way we were able\
    \ to continuously add to them, instead of them running back to 0 every time the\
    \ loop restarted.\n\nHere is another way to provide data and other information\
