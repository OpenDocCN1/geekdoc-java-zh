  - "[PAGE 44]\n\n# Recursion\n\nAnother useful trick in programming is the art of\
    \ mastering recursion. Recursion is any action that occurs when a method calls\
    \ upon itself multiple times. This can be a real challenge to some beginners because\
    \ of the threat of creating infinite loops. However, with the basics of if statements\
    \ and other conditionals, simple recursion is an easy feat to accomplish.\n\n\
    In this following example, we use a for loop to add all numbers less than a given\
    \ number n.\n\n```\npublic int sum ( int n ) {\n    int sum = 0;\n\n    for (\
    \ int i = n; i > 0; i-- ) {\n        sum += i;\n    }\n\n    return sum;\n}\n\
    ```\n\nThe code can be rewritten recursively as follows:\n\n```\npublic int sumR\
    \ ( int n ) {\n    if ( n <= 1 ) {\n        return 1;\n    } else {\n        return\
    \ n + sumR ( n - 1 );\n    }\n}\n```\n\nThe first if statement is called the base\
    \ case. The base case is the most important part of any recursive code. If it\
    \ is defined incorrectly or doesn't exist at all, the program can enter infinite\
    \ recursion. This can cause our program to crash, freeze, or"
  - "[PAGE 45]\n\notherwise behave unpredictably. In the example on the previous page,\
    \ any number passed to our method will eventually reach a value that is less than\
    \ or equal to 1. This is guaranteed because we are always subtracting.\n\nA more\
    \ complex example of recursion is used to calculate the Fibonacci numbers. In\
    \ case you don't know what they are, the Fibonacci numbers are a famous set of\
    \ numbers where the next number in the series is equal to the sum of the previous\
    \ two numbers. The sequence starts with 0, 1, 1, 2, 3, 5, 8, and so on.\n\nAs\
    \ you can see 1 = 1 + 0, 2 = 1 + 1, 3 = 2 + 1.. Here is the code to calculate\
    \ these numbers using recursion.\n\n```\npublic int fib ( int n ) {\n    if (\
    \ n == 0 ) {\n        return 0;\n    } else if ( n == 1 ) {\n        return 1;\n\
    \    } else {\n        return fib( n - 1 ) + fib ( n - 2 );\n    }\n}\n```\n\n\
    This code returns the nth Fibonacci number (ex. fib(4) returns 3). In this case,\
    \ we have two base cases (n == 1 and n==0). We need both because our recursive\
    \ program calls n - 1 and n - 2."
