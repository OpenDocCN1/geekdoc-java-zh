    \ 3 != 5 ) && ( 4 > 6 )\nd) ( 10 % 6 <= 2 ) || ( 5 * 4 == 20 ) && !( 8 == 7 +\
    \ 3 ) )\n\n- 5. 为了确定一个数字是否为偶数，我们可以使用 `( num % 2 ) == 0`。我们用什么来判断一个数字是否是 17 的倍数？\n\
    \n- 6. 异或 (xor) 是额外的布尔运算符。它的定义如下：\n\n```java\n! ( A && B ) && ( A || B )\n```\n\
