    \ b );\nSystem.out.println( c );\n```\n\n# Chapter Four:\nLoops\n\nWhy are they\
    \ important?\nImagine that you had been tasked with adding up all the numbers\
    \ between zero and ten. This wouldn't take too long to do by hand and would be\
