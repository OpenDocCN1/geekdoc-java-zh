    \ through having your code scan through a file, and performing the same tasks\
    \ of manipulation that you can use when user inputs through the console.\n\nIt\
    \ is also important to point out that for ( ; ; ) is equivalent to while ( true\
    \ ). Either one of these will create an infinite loop.\n\n## Using Files as Input\n\
    \nTo do this, first we need to make an empty text file within the project. To\
    \ do this, right click on the project folder, select new, and create file. Name\
    \ your file test.txt. Make sure that the file created is inside the project folder\
    \ and not in the source folder. Inside the file write the numbers 5 and 6 with\
    \ a space between them.\n\nNow you are ready to start coding!\n\nRemember how\
    \ when we made a scanner we used the System.in command? To use a file as the input,\
    \ all we have to do is replace it with a file object so it looks like:\n\n```java\n\
    File file = new File(\"test.txt\");\nScanner scan = new Scanner(file);\n```\n\n\
    Keep in mind that we may have to import the file object and the FileNotFoundException\
