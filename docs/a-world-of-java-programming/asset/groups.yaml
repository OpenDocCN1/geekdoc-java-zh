  - "[PAGE 28]\n\n# # Chapter Four:\nLoops\n\nWhy are they important?\nImagine that\
    \ you had been tasked with adding up all the numbers between zero and ten. This\
    \ wouldn't take too long to do by hand and would be simple program. But what if\
    \ you had been asked to add all the numbers up to 1,000? 100,000,000? At this\
    \ point it would no longer be practical to add these numbers by hand or to write\
    \ each addition as its own line of code. However, by using loops we can get this\
    \ task done easily. A loop is a section of code that is done repeatedly until\
    \ a certain condition is met.\n\nWhile Loops:\nThe while loop is the most basic\
    \ of the loops but also the most powerful. At the top of the while loop you have\
    \ a condition. This condition is always a boolean expression and the loop will\
    \ continue to run until the expression is false. Inside the loop we put the code\
    \ we want to run repeatedly. Below is a while loop that adds all the numbers between\
    \ zero and one thousand.\n\n```\nint num = 1; // The number to be added\nint sum\
    \ = 0; // The current sum\n\nwhile ( num <= 1000 ) {\n    sum += num;\n    num++;\n\
    }\n\nSystem.out.println( sum );\n```\n\nIn this example the while loop will run\
    \ as long as num <= 1000. Each time the loop is run num will be added to the sum\
    \ variable. Then, num will be incremented by 1 (this is what num++ means)."
  - "[PAGE 29]\n\nWhen num reaches our value 1001, it will no longer be <= 1000.\n\
    So, when we ask our question again it loop, going to the System.out.println(sum).\n\
    \nThe most important thing to remember when creating loops is to make sure that\
