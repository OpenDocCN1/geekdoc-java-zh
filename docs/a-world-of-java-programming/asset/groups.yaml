    ## 数组列表 (Array Lists)\n\n第二个用的结构是数组列表。在 Java（以及大多数编程语言）中，数组的长度是固定的。当你不知道需要存储多少数据时，这使得很难使用。通常，程序员通过让数组非常大或不断创建新数组以适应数据来解决这个问题。然而，通过使用引用和节点，我们可以创建一个既像数组一样使用又能像栈一样增长的结构。\n\
