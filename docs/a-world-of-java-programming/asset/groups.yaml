    \ a + num == 124 ? 60 : 50;\nchar c = (a + b) / num > 10 ? 'x' : 'z';\n\nSystem.out.println(\
    \ a );\nSystem.out.println( b );\nSystem.out.println( c );\n```\n\n# 第四章：\n循环\n\
    \n为什么它们很重要？\n假设你被要求相加从零到十之间的所有数字。手动完成这不需要花费长时间，而且是一个简单的程序。但如果你被要求相加到 1,000 的所有数字呢？100,000,000\
    \ 呢？此时，手动相加这些数字或为每次加法单独写一行代码已变得是不切实际的。然而，通过使用循环，我们可以轻松地完成任务。循环是一段重复执行的代码，直到满足特定条件。\n\
    \nWhile 循环：\n`while` 循环是最基础的循环，也是最强大的。在 `while` 循环的顶部你有一个条件。这个条件始终是一个布尔表达式，循环将一直运行直到该表达式为假。在循环内部，我们放入想要重复运行的代码。下面是一个在零到一千之间加上所有数字的\
    \ `while` 循环。\n\n```java\nint num = 1; // 要加的数字\nint sum = 0; // 当前总和\n\nwhile\
    \ ( num <= 1000 ) {\n    sum += num;\n    num++;\n}\n\nSystem.out.println( sum\
    \ );\n```\n\n在这个示例中，只要 `num <= 1000`，`while` 循环就会运行。在循环内部我们放入想要重复运行的代码。\n\n（注：由于提供的原文文本在此处出现大量重复和断句，翻译已根据提供的逻辑片段结束）\n"
