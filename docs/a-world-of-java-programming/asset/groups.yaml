    \ same code that calculates the sum of all numbers from zero to one thousand using\
    \ a for loop.\n\n```\nint sum = 0; // The current sum\n\nfor ( int num = 0; num\
    \ <= 1000; num++ ) {\n    sum += num;\n}\n\nSystem.out.print( sum );\n```\n\n\
    Let's break down the loop. The first part of the loop creates a new integer variable\
    \ called num and sets it equal to zero. The second part tells us that that loop\
    \ will end when num is no longer less than or equal to 1000. Lastly, the third\
    \ part tells us that after each time the loop is run we will increment num by\
