    # Constructors


    We now have one Lion in our Zoo, but what if we wanted to add three Lions? One
    hundred? Of course, these Lions are not going to have the same weight or age,
    and it would be a nightmare trying to write a class of Lion. This is where constructors
    come in manly. A constructor is a simple section of code that acts like a method.
    Its one and only job is to load initial values into our object, and to help with
    the instantiation process.


    # Basic Constructor Example:


    ```

    public NameOfClass ( input1, input2, ... ) {

    //What we do with the inputs:



    \}

    ```


    Before we can add a constructor to our Lion class we will need to make a few small
    changes first. Because we are initializing (setting) some of the variables when
    we make the class, we no longer have to define these variables explicitly. Secondly,
    when we create our Lion in the Zoo we must tell our Lion what the value of these
    variables are.


