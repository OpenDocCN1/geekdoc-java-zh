- md: "\n10. What is recursion and why is it a useful tool?\n\n11. What are the dangers\
    \ to recursion?\n\n12. What does the following recursive program print?\n\n```java\n\
    public class Example {\n\n    public int getNumber ( int n ) {\n        if ( n\
    \ <= 0 ) {\n            return 1;\n        } else {\n            return ( n *\
    \ getNumber ( n - 1 );\n        }\n    }\n\n    public static void main ( String\
    \ args [ ] ) {\n        int number = getNumber ( 4 );\n        System.out.println\
    \ ( number );\n    }\n}\n```\n\n# Chapter Eight: Objects\n\n## Basic Objects\n\
    \nUp to this point everything you have coded in Java has been in one class file.\
    \ We are now going to be creating other class files to use in our programs. This\
    \ will allow us to create more complex programs and to make our programs much\
    \ easier to read. However, to understand what it means to use multiple classes\
    \ we must first go over something called an object. In Java you can think of an\
    \ object and a class as the same thing (although this isn’t exactly true in all\
    \ fields of computer programming).\n\nIn Java an object is anything that you can\
    \ describe. That might sound very vague, but an object can be literally anything\
    \ that can be described using numbers, words, actions, etc. For example, we can\
    \ describe a lion using a table. We call tables like this UML (Unified Modeling\
    \ Language) diagrams. They are very useful for explaining what an object is and\
    \ what it can do. By looking at our UML diagram of a lion we can easily see what\
    \ things need to be included in our object.\n\n| Lion | What It Can Do (Actions)\
    \ |\n| :--- | :--- |\n| - Has Fur | |\n| - Has Claws | |\n| - Has a Tail | |\n\
    | - Lives in the Savana | |\n| - Age | |\n| - Weight | |\n| - Eat | |\n| - Sleep\
    \ | |\n| - Pounce | |\n| - Roar | |\n\nWe are now going to create our lion object.\
    \ So lets create a new project called “Zoo” and a new class also called “Zoo.”\
    \ (Remember to create your main method in this Zoo class.) To create our lion,\
    \ add a new class to the project by right-clicking on our Zoo Class and selecting\
    \ New → Class. Name this class “Lion.” Do not make a main method in this class,\
    \ we don't want to have two main methods in our project.\n\nYou should now see\
    \ a new class in the source folder named “Lion”. In Java you can create as many\
    \ classes as you need for your program. However, it is always good practice to\
    \ use packages (folders) to organize class files when you start getting too many\
    \ of them. Typically once you have six or more class files you should start thinking\
    \ about placing them in packages. For this program we won't be needing packages.\n\
    \nRight now, our Lion object doesn't do anything. To fix this, add the list of\
    \ characteristics to the Lion class as variables.\n\n```java\npublic class Lion\
    \ {\n\n    boolean hasFur = true;\n    boolean hasClaws = true;\n    boolean hasTail\
    \ = true;\n\n    String habitat = \"Savana\";\n    int age = 0;\n    int weight\
    \ = 300;\n\n}\n```\n\nOur object now has descriptions of what it is, but it still\
    \ can't “do” anything. Let’s add some methods to our Lion describing things it\
    \ can “do”.\n\n```java\npublic class Lion {\n\n    //----------Characteristics-----------\n\
    \    boolean hasFur = true;\n    boolean hasClaws = true;\n    boolean hasTail\
    \ = true;\n\n    String habitat = \"Savana\";\n\n    int age = 0;\n    int weight\
    \ = 300;\n\n    //----------Actions-----------\n\n    public String eat ( String\
    \ food ) {\n        return \"Ate: \" + food;\n    }\n\n    public String sleep\
    \ ( ) {\n        return \"zzzzz\";\n    }\n\n    public String pounce ( String\
    \ animal ) {\n        return \"Pounced on: \" + animal;\n    }\n\n    public String\
    \ roar ( ) {\n        return \"ROAAAAAAAAAAR!!\";\n    }\n}\n```\n\nOur object\
    \ now has variables that define it and methods that tell us what it can do, but\
    \ if we run our program it doesn't do anything. The reason nothing happens is\
    \ we have not instantiated our Lion in our main method. To do this switch back\
    \ to the Zoo class. Change the main method to look like this:\n\n```java\npublic\
    \ static void main ( String [ ] args ) {\n    Lion simba = new Lion ( );\n}\n\
    ```\n\n## Accessibility\n\nWe have now created a new Lion object called \"simba.\"\
    \ In Java, classes like Lion always begin with a uppercase letter, but the names\
    \ of specific objects like simba begin with a lowercase letter.\n\nAlthough we\
    \ now have a Lion named simba in our Zoo class, it still doesn't do anything.\
    \ Like with all we tell the program what to do with this new object. Let's access\
    \ a few of its variables and print them out:\n\n```java\npublic static void main\
    \ ( String [ ] args ) {\n    Lion simba = new Lion ( );\n\n    boolean hasClaws\
    \ = simba.hasClaws;\n    String habitat = simba.habitat;\n    int age = simba.age;\n\
    \n    System.out.println ( hasClaws );\n    System.out.println ( habitat );\n\
    \    System.out.println ( age );\n}\n```\n\nThe code above outputs:\ntrue\nSavana\n\
    8\n\nAs can be seen in the above example, we can easily access the variables from\
    \ the objects we create. To do this we simply write the name of our object (*simba*),\
    \ then add what is called a “dot operator” (it's just a period but programmers\
    \ like to be fancy), followed by the variable we want to access. For example if\
    \ we wanted to access *simba*'s weight we would write: simba.weight\n\n| simba\
    \ | weight | |\n| :--- | :--- | :--- |\n| Name of Object | Dot Operator | Name\
    \ of Variable We Want |\n\nTo use one of our methods in Lion we do something very\
    \ similar:\n\n| simba | roar () | |\n| :--- | :--- | :--- |\n| Name of Object\
    \ | Dot Operator | Name of Method We Want |\n\nSo, if we wanted to make our Lion\
    \ roar we could write:\n\n```java\npublic static void main ( String [ ] args )\
    \ {\n    Lion simba = new Lion ( );\n    System.out.println ( simba.roar ( ) );\n\
    }\n```\n\nThe code above prints “ROAAAAAAAAAAR!!!”\n\nEarlier in this book we\
    \ talked about the difference between methods and variables that are declared\
    \ *public* vs *private*. Although it probably didn't seem important back then,\
    \ this is where it makes a big difference. Anything that is public can be accessed\
    \ using the dot operator. Whereas anything declared private can't be used with\
    \ the dot operator.\n\nBy using these public/private modifiers we can create variables\
    \ that cannot be tampered with by buggy or malicious programs.\n\n## Constructors\n\
    \nWe now have one Lion in our Zoo, but what if we wanted to add three? One hundred?\
    \ Of course, these Lions are not going to have the same weight or age, and it\
    \ would be a nightmare trying to write a class. This is where constructors come\
    \ in. A constructor is a simple section of code that acts like a method. Its one\
    \ and only job is to load initial values into our object, and to help with the\
    \ instantiation process.\n\n### Basic Constructor Example:\n\n```java\npublic\
    \ NameOfClass ( input1, input2, ... ) {\n//What we do with the inputs:\n```\n\n\
    Before we can add a constructor to our Lion class we will need to make a few changes\
    \ first. Because we are initializing (setting) some of the variables when we make\
    \ the class, we no longer have to define these variables explicitly. Secondly,\
    \ when we create our Lion in the Zoo we must tell our Lion what the value of these\
    \ variables are.\n\n```java\npublic class Lion {\n    int age;\n    int weight;\n\
    \n    public Lion ( int age, int weight ) {\n        this.age = age;\n       \
    \ this.weight = weight;\n    }\n}\n```\n\nIf you look at the constructor in our\
    \ Lion class you will see that we are taking an integer for the age of our Lion\
    \ and another integer for the Lion's weight. The next line states: this.age =\
    \ age; What does that mean? In Java the keyword \"this\" refers to the object\
    \ you are currently inside of (in this case \"this\" refers to the Lion object).\
    \ Therefore you could read the lines as \"This object's age is equal to the input\
    \ age.\" If you don't want to use the \"this\" keyword, all you must do is name\
    \ the input variable something different from other variable in your class:\n\n\
    ```java\npublic Lion ( int newAge, int newWeight ) {\n    age = newAge;\n    weight\
    \ = newWeight;\n}\n```\n"
  mdcn: "\n\n10. 什么是递归？它为什么是一个有用的工具？\n\n11. 递归有哪些危险？\n\n12. 下面的递归程序会打印什么？\n\n```java\n\
    public class Example {\n\n    public int getNumber ( int n ) {\n        if ( n\
    \ <= 0 ) {\n            return 1;\n        } else {\n            return ( n *\
    \ getNumber ( n - 1 );\n        }\n    }\n\n    public static void main ( String\
    \ args [ ] ) {\n        int number = getNumber ( 4 );\n        System.out.println\
    \ ( number );\n    }\n}\n```\n\n# 第八章：对象\n\n## 基础对象\n\n到为止，你在 Java 中编写的所有代码都在一个类文件中。现在，我们将创建其他的类文件并在我们的程序中使用。这将允许我们创建更复杂的程序，并让我们的程序更易于阅读。然而，在理解使用多个类的含义之前，我们必须首先了解一种被称为“对象”的东西。在\
    \ Java 中，你可以将对象和类看作同一种东西（尽管在计算机编程的所有领域这并不完全准确）。\n\n在 Java 中，对象是你任何可以描述的任何事物。这听起来非常模糊，但对象从字面上可以是任何可以用数字、单词、动作等描述的物体。例如，我们可以用一个表格来描述一只狮子。我们将这样的表格称为\
    \ UML（统一建模语言）图。它们对于解释对象是什么以及它能做什么非常有用。通过查看我们的狮子 UML 图，我们可以轻松地看到对象中需要包含哪些内容。\n\n\
    | 狮子 | 它能做什么（动作） |\n| :--- | :--- |\n| - 有皮毛 | |\n| - 有爪子 | |\n| - 有尾巴 | |\n|\
    \ - 生活在草原上 | |\n| - 年龄 | |\n| - 重量 | |\n| - 吃 | |\n| - 睡 | |\n| - 扑咬 | |\n| -\
    \ 吼 | |\n\n现在我们要创建自己的狮子对象。所以让我们创建一个名为“Zoo”的新项目和一个也名为“Zoo”的新类类。（记得在这个 Zoo 类中创建你的\
    \ main 方法。）为了创建我们的狮子，右键点击我们的 Zoo 类并选择 New → Class，向项目添加一个新类。将此类命名为“Lion”。不要在这个类中创建\
    \ main 方法，我们不想在项目中拥有两个 main 方法。\n\n你现在应该能在源文件夹中看到一个名为“Lion”的新类。在 Java 中，你可以根据程序需要创建任意数量类。然而，当你开始有太多类文件时，使用包（文件夹）来组织类文件始终是一个良好的习惯。通常，一旦你有六个或更多类文件，就应该开始考虑将它们放在包中。对于这个程序，我们不需要包。\n\
    \n现在，我们的 Lion 对象什么都没做。为了修复这个问题，请将特征列表作为变量添加到 Lion 类中。\n\n```java\npublic class\
    \ Lion {\n\n    boolean hasFur = true;\n    boolean hasClaws = true;\n    boolean\
    \ hasTail = true;\n\n    String habitat = \"Savana\";\n    int age = 0;\n    int\
    \ weight = 300;\n\n}\n```\n\n我们的对象现在有了关于它是什么的描述，但它仍然不能“做”任何事情。让我们给 Lion 添加一些方法，来描述它能“做”的事。\n\
    \n```java\npublic class Lion {\n\n    //----------特征-----------\n    boolean hasFur\
    \ = true;\n    boolean hasClaws = true;\n    boolean hasTail = true;\n\n    String\
    \ habitat = \"Savana\";\n\n    int age = 0;\n    int weight = 300;\n\n    //----------动作-----------\n\
    \n    public String eat ( String food ) {\n        return \"Ate: \" + food;\n\
    \    }\n\n    public String sleep ( ) {\n        return \"zzzzz\";\n    }\n\n\
    \    public String pounce ( String animal ) {\n        return \"Pounced on: \"\
    \ + animal;\n    }\n\n    public String roar ( ) {\n        return \"ROAAAAAAAAAAR!!\"\
    ;\n    }\n}\n```\n\n我们的对象现在有了定义它的变量和告诉我们它能做什么的方法，但如果我们运行程序，它什么 own发生。什么都没有发生的原因是，我们没有在\
    \ main 方法中实例化我们的 Lion。要这样做，切换回 Zoo 类。将 main 方法更改为如下所示：\n\n```java\npublic static\
    \ void main ( String [ ] args ) {\n    Lion simba = new Lion ( );\n}\n```\n\n\
    ## 可访问性\n\n我们现在创建了一个名为 \"simba\" 的新 Lion 对象。在 Java 中，像 Lion 这样的类总是以大写字母开头，但特定对象的名称（如\
    \ simba）以小写字母开头。\n\n尽管我们现在在 Zoo 类中有一个名为 simba 的 Lion，但它仍然什么都没做。就像所有事情一样，我们要告诉程序对这个新对象做什么。让我们访问它的几个变量并将其打印出来：\n\
    \n```java\npublic static void main ( String [ ] args ) {\n    Lion simba = new\
    \ Lion ( );\n\n    boolean hasClaws = simba.hasClaws;\n    String habitat = simba.habitat;\n\
    \    int age = simba.age;\n\n    System.out.println ( hasClaws );\n    System.out.println\
    \ ( habitat );\n    System.out.println ( age );\n}\n```\n\n上面的代码输出为：\ntrue\nSavana\n\
    8\n\n如上面的示例所示，我们可以轻松地从创建的对象中访问变量。要这样做，我们只需编写对象的名称（*simba*），然后添加一个所谓的“点运算符”（它只是一个点，但程序员喜欢用得花哨），最后我们想要访问的变量。例如，如果我们想访问\
    \ *simba* 的重量，我们将写：simba.weight\n\n| simba | weight | |\n| :--- | :--- | :---\
    \ |\n| 对象名称 | 点运算符 | 我们想要访问的变量名称 |\n\n要使用 Lion 中的某个方法，我们要做非常相似的操作：\n\n| simba\
    \ | roar () | |\n| :--- | :--- | :--- |\n| 对象名称 | 点运算符 | 我们想要的方法名称 |\n\n所以，如果我们想让我们的狮子吼，我们可以写：\n\
    \n```java\npublic static void main ( String [ ] args ) {\n    Lion simba = new\
    \ Lion ( );\n    System.out.println ( simba.roar ( ) );\n}\n```\n\n上面的代码打印“ROAAAAAAAAAAR!!!”\n\
    \n在本书的前面部分，我们讨论了声明为 *public*（公共）与 *private*（私有）的方法与变量之间的区别。尽管在当时似乎并不重要，但现在正是它产生巨大差异的地方。任何公共内容都可以使用点运算符访问。而任何声明为私有的内容则不能使用点运算符。\n\
    \n## 构造函数\n\n我们现在在 Zoo 中有一个狮子，但如果我们想增加三个呢？一百个呢？当然，这些狮子的重量或年龄不会相同，尝试编写这样的类将是一场噩梦。这就是构造函数的用用场。构造函数是一段像方法的简单代码。它的唯一工作是将初始值加载到对象中，并协助实例化过程。\n\
    \n### 基础构造函数示例\n\n```java\npublic NameOfClass ( input1, input2, ... ) {\n// 我们对输入的操作\n\
    ```\n\n在向 Lion 类添加构造函数之前，我们首先需要进行一些更改。由于我们在创建类时初始化（设置）了一些变量，我们不再需要显式地定义这些变量。其次，当我们在\
    \ Zoo 中创建狮子时，我们必须告诉 Lion 这些变量的值。\n\n```java\npublic class Lion {\n    int age;\n\
    \    int weight;\n\n    public Lion ( int age, int weight ) {\n        this.age\
    \ = age;\n        this.weight = weight;\n    }\n}\n```\n\n如果你查看 Lion 类中的构造函数，你会看到我们为狮子的年龄接收一个整数，并为重量接收另一个整数。下一行写道：this.age\
    \ = age; 这意味着什么？在 Java 中，关键字 \"this\" 指向你当前内部的对象（在这种情况下，“this” 指的是 Lion 对象）。因此，你可以将这些行代码读为“这个对象的年龄等于输入的年龄”。如果你不想使用\
    \ \"this\" 关键字，你要做的只是将输入变量命名与类中其他变量不同的名称：\n\n```java\npublic Lion ( int newAge,\
    \ int newWeight ) {\n    age = newAge;\n    weight = newWeight;\n}\n```\n\n"
