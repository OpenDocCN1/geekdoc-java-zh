    ```\n\n通常情况下，任何三元运算符的结构如下：\n\n# 变量 = 布尔表达式 ? 为真时的值 : 为假时的值\n\n使用三元运算符的几规则：\n\n\
    - 1.) 仅对短的布尔表达式使用它们。\n- 2.) **不要**嵌套三元运算符。这会让它们几乎无法阅读。\n- 3.) 如果某些操作需要超过一个三元运算符，请改用\
    \ `if` 语句。\n\n# 条件语句 - 练习题\n\n- 1. 什么是布尔表达式？\n\n- 2. 为什么布尔表达式在编码时很有用？\n\n- 3.\
    \ 求出以下布尔表达式的值：\na) ! ( false )\nb) true && true\nc) false || false\nd) ! ( false\
