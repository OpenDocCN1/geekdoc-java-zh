    \ Here is the same code that calculates the sum of all numbers from zero to one\
    \ thousand using for loop.\n\n```java\nint sum = 0; // The current sum\n\nfor\
    \ ( int num = 0; num <= 1000; num++) {\n    sum += num;\n}\n\nSystem.out.print(\
