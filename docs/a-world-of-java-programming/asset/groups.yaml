    # Chapter Ten:

    Java FX


    So far in your programing experience you have used the console to interact with
    your programs, taking in user input and printing our various things. However,
    this is not most programs interact with people. The vast majority of programs
    (internet browsers, text editors, operating systems, etc.) have windows, buttons,
    sliders, and other graphics that make it easy to interact with the program. In
    this chapter, you will learn the basics of how to do just that by using JavaFX.


    Before we get started here is some terminology that will be used:


    +   - User - A person who will use our program.

    - Graphical User Interface (GUI) - Often just called a GUI (pronounced Gooey),
    the GUI is the collection of windows, buttons, etc. that allow users to interact
    with our program without using the console.


    So, what is JavaFX exactly? JavaFX is a collection of objects that allow us to
    easily create GUIs using the concepts of inheritance and object oriented design.


    Eclipse and JavaFX


    If you are using Eclipse to program then you will have to preform one extra step
    before you can use JavaFX. You will have to install e(fx)clipse before you can
    continue with this chapter.


    +   1.) In Eclipse go to Help -> Install New Software

    2.) In the drop down select the version of Eclipse you are using.

    3.) In filter type "e(fx)clipse".

    4.) Once it loads, select e(fx)clipse.

    5.) Click next and follow the rest of the installation instructions'
- md: "\n## Create Your First GUI\n\nMake a new Java project.\n\nCreate a new Class\
    \ and name it \"FXExample\".\n\nMake your class inherits from Application:\n\n\
    ```\npublic class FXExample extends Application {\n```\n\nThere will be an error\
    \ in your program because Java doesn't know what an application is. To fix this\
    \ hover your mouse over the word \"Application\" and select: Import 'Application'\
    \ (Javafx.application). In this chapter it is important that you only import objects\
    \ from Javafx, not from form or swing. Importing the wrong one will cause major\
    \ bugs in your program.\n\nOnce Application is imported you will get another error,\
    \ this time because your class doesn't have a required method. So, we will have\
    \ to add it. Change your code to look like this:\n\n```java\npublic class FXExample\
    \ extends Application {\n    public static void main( String [ args ) {\n    }\n\
    \n    @Override\n    public void start ( Stage arg0 ) {\n    }\n```\n\nNotice\
    \ that in addition to overriding the start method (the method needed to be included)\
    \ we have also added the main method to our program.\n\n7. Under our main method\
    \ write:\n\n```java\npublic static void main( String [ ] args ) {\n    launch(\
    \ args );\n}\n```\n\nThis line of code is what tells JavaFX to start running.\
    \ Without it, our program won’t work.\n\n8. Under the start method, write the\
    \ following:\n\n```java\n@Override\npublic void start( Stage arg ) {\n    Pane\
    \ root = new Pane( );\n    Button btn = new Button( );\n    btn.setText( \"Hello\
    \ World!\" );\n    root.getChildren( ).add( btn );\n\n    arg.setScene( new Scene(root,\
    \ 300, 250) );\n    arg.setTitle( \"Hello World!\" );\n    arg.show( );\n}\n```\n\
    \nNOTE: Depending on what version of Eclipse you are using the variable arg might\
    \ be named something different.\n\nSo, what does this all mean? The first line\
    \ creates something called the pane. The next three lines in the main method create\
    \ a button and set the text on the button to be “Say Hello World!” and add the\
    \ button to the pane. The final three lines create the actual window by making\
    \ a new scene, setting the title of the window, and finally showing the window.\
    \ If you run the code a new window like the one on the next page will pop-up.\n\
    \nNow, let's talk about the different parts of a window. There are three main\
    \ parts of a window in JavaFX: the stage, scene, and pane. The stage is the actual\
    \ window. Its job is to create a space that we can display things in (just like\
    \ a theatre stage in real life). The scene is responsible for keeping track of\
    \ what is currently being displayed. The pane (often called the root) is where\
    \ all the action happens. This is where you put all the buttons, textfields, and\
    \ animations. Together these three parts create the backbone of a functioning\
    \ GUI.\n\n, to make the GUI do anything you need to add nodes to the pane. Nodes\
    \ are specialized objects like buttons, shapes, or text that can be added to the\
    \ pane to change how the window looks or interacts.\n\n## User Interactivity and\
    \ Event Handlers\n\nLooking back at our example, the GUI we created doesn’t do\
    \ much at all. It just creates a window with a single button that doesn’t do anything\
    \ when it’s clicked. To make our GUI interactive with the user (make it do something\
    \ based on input), we must learn about a new type of method called event handlers.\n\
    \nEvent handlers are methods that run only when a certain thing happens (someone\
    \ clicks a shape, enters text, or presses a button for example). Unlike the basic\
    \ methods that we have used before these ones aren’t called directly. For example,\
    \ let’s say we want the text “Hello World!” to appear on the screen when we click\
    \ our button. To do this we would write the following code. Remember to always\
    \ import from JavaFX. Compare your code to the new version below.\n\n```java\n\
    public class FXExample extends Application {\n    boolean btnPushed = false;\n\
    \n    public static void main( String [ ] args) {\n        launch( args );\n \
    \   }\n\n    @Override\n    public void start( Stage arg ) {\n        Pane root\
    \ = new Pane();\n        Label text = new Label(\"Hello World!\");\n        text.setTextFill(\
    \ Color.BLUE);\n        text.setLayoutX( 100);\n        text.setLayoutY( 100 );\n\
    \        Button btn = new Button();\n        btn.setText( \"Say Hello World\"\
    \ );\n        btn.setOnAction( new\n            EventHandler<ActionEvent>() {\n\
    \                @Override\n                 void handle( ActionEvent event )\
    \ {\n                    if ( btnPushed == false ) {\n                       \
    \ root.getgetChildren( ).add( text );\n                        btnPushed = true;\n\
    \                    }\n                });\n\n        root.getgetChildren( ).add(\
    \ btn );\n\n        arg.setScene( new Scene(root, 300, 250) );\n        arg.setTitle(\"\
    Hello World!\");\n        arg.show( );\n    }\n}\n```\n\nLet's walk through these\
    \ new objects methods one at a time. Label is a simple object that can store a\
    \ string which is displayed. In this example, we set the label font, size, and\
    \ color. The next part of the code is the event handler. The first line tells\
    \ the button to call the handle method. The handler is a simple if statement that\
    \ adds whatever the button is pressed. A text field is where the user can input\
    \ text. In this example, we will just display whatever the user enters. Add this\
    \ code to the start method:\n\n```java\nLabel message = new Label( \"\");\nmessage.setTextFill(\
    \ Color.GREEN );\nmessage.setLayoutX( 0 );\nmessage.setLayoutY( 200 );\nroot.getChildren(\
    \ ).add( message );\n\nTextField txtField = new TextField();\ntxtField.setLayoutX(\
    \ 0 );\ntxtField.setLayoutY( 150 );\nroot.getChildren( ).add( txtField );\n\n\
    Button getText = new Button();\ngetText.setText( \"Get Text\" );\ngetText.setLayoutX(\
    \ 0 );\ngetText.setLayoutY( 175 );\ngetText.setOnAction( new EventHandler<ActionEvent>()\
    \ {\n    @Override\n    public void handle( ActionEvent event ) {\n        message.setText(\
    \ txtField.getText() );\n    }\n});\nroot.getgetChildren( ).add( getText );\n\
    ```\n\nWhenever the “Get Text” button is pressed the label will be changed to\
    \ whatever the user entered. Try changing some of the code and customize the GUI.\
    \ Can you change the text color? Font? Try changing what the buttons do.\n\n##\
    \ Shapes\n\nBesides text fields, buttons, and labels you can also add shapes to\
    \ windows. To begin, we will create a new project just like we did earlier in\
