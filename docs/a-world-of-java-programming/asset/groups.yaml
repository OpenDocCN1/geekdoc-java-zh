    Is Even\");\n} else if (num < 0) {\n    System.out.println(\"Is Negative Odd\"\
    );\n} else {\n    System.out.println(\"Is Positive Odd\");\n}\n```\n\n# 三元运算符\n\
    \n虽然 `if` 语句非常有用，但有时为了非常简单的操作编写整个 `if` 语句会很麻烦。对于此类情况，我们使用一种称为三元运算符的简写版本。三元运算符可以被认为是一个单行的\
    \ `if/else` 语句。\n\n三元运算符通常只用于给变量赋值，因为较长的语句很难阅读。\n\n例如，以下代码在 `num` 为正数时将变量 `a`\
