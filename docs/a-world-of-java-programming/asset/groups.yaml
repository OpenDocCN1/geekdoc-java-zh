    \ total = 0;\n    try {\n        File file = new File(\"test.txt\");\n       \
    \ Scanner scan = new Scanner(file);\n\n        while (scan.hasNext()) {\n    \
    \        total += scan.nextInt();\n        }\n        scan.close();\n    } catch\
