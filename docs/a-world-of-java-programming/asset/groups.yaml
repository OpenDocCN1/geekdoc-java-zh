    # Chapter Two:

    Variables


    Imagine you have a standard deck of cards, where each of these cards have different
    suits with their corresponding values. Now you might be asking, what do these
    cards have to do with programming? Well, in programming, different values are
    stored within different suits, called variables. These variables can hold a variety
    of different values and types for as as the type matches. An example of this would
    be say we picked up a card that was the 2 of Hearts. In this instance, the Hearts
    would be a data type (variable), and the 2 would be the data value stored in it.
    We achieve this through a process of instantiation.


    Instantiation is the process that we use to create the variable. Each variable
    can only be instantiated once, and and after that the values are free to do whatever
    you want them to.


    An example of this if we used our card analogy would be:


    ```

    Heart heart = 2

    ```


    In code, it would look more like:


    ```

    int heart = 2;

    ```


    Notice that in front of the name that we gave, there lies the word int (in this
    case int is the data type). Overall there are many different data types that each
    hold their own respective variables. The different variables that we will be using
    throughout this book are int, double, boolean, char, and String.'
- md: "\n## What is an *int*?\n\nAn *int*, pronounced integer, is a type of variable\
    \ that holds a specific type of number. The *int* data type can only hold whole\
    \ numbers like -3, -2, -1, 0, 1, 2, 3. Integers can hold positive and negative\
    \ values, and are often used for keeping a count of different objects and functions.\n\
    \n## What is a *double*?\n\nA *double* can be any number, including the ones with\
    \ decimal points such as 1.2, 2.2 or 3.2. Although they can hold whole numbers\
    \ like 1, 2, and 3, they are stored as 1.0, 2.0, 3.0. This is more useful for\
    \ calculations and when you want to have a more precise value as an answer.\n\n\
    ## What is a *boolean*?\n\nA *boolean* is a variable that can only hold true or\
    \ false. This is important for telling your code to perform different functions\
    \ or to change the output based on whether something is true or false. An example\
    \ of this would be collision. Think of a video game that you have played. When\
    \ you walk around, and say you walk into an object, do you run through it? Most\
    \ likely not! This is because the code is telling the character that its movement\
    \ is false when it collides, and therefore can't walk through the object. These\
    \ types events will be discussed later in the book.\n\n## What is a *char*?\n\n\
    A *char*, short for character, is an individual character that has a specific\
    \ ASCII (or numeric) value. Stored between single quotation marks such as 'a',\
    \ chars are useful because they allow us to manipulate specific characters in\
    \ words. An example of this would be an encryption program. This type of program\
    \ would take in a bunch of different *chars*, and apply a change to each *char*\
    \ so it could be stored as something else. Remember that in computer science a\
    \ character can be anything from the letter to a space (' '), period ('.'), or\
    \ tab ('\\t').\n\n## What is a String?\n\nA String is defined as a character array,\
    \ meaning that each String is full of multiple characters together to be stored\
    \ in a single variable. Denoted by quotation marks (E.g. \"Hello World\"), Strings\
    \ are useful because they hold words and phrases that can be printed out and used\
    \ to display text, instead of printing out each char individually. Also note that\
    \ Strings use a capital \"S\". They are the only basic variable type that uses\
    \ a capital letter.\n\n## Manipulation of Variables\n\nThink back to the variable\
    \ of heart that we created earlier. Now you might be thinking, what use is it\
    \ if it is always 2 for its whole life? Well, it doesn't always have to be that\
    \ way. There are various ways that you can change the variable so it holds other\
    \ values, but keeps the same name. An example of this would be:\n\n```\nHeart\
    \ heart = 2\nheart = 3\nheart = 4\n```\n\nNow what value does heart hold? 4. Also,\
    \ notice how we did not have to declare what type heart was when we changed its\
    \ value from 2 to 3 to finally 4. Another example would be:\n\n```java\nint heart\
    \ = 3;\nheart += 1;\nheart -= 2;\n```\n\nNow try and see what heart holds. If\
    \ you guessed 2, then you guessed correctly! Don't worry if you didn't get the\
    \ right answer. You may be asking yourself, what exactly does += and -= do? Take\
    \ the example above. When we say that heart += 1, we are really saying:\n\n```java\n\
    heart = heart + 1;\n```\n\nHowever that can be shortened using a += and the value\
    \ we want to add to it after the symbols. Say we used:\n\n```java\nheart += 1;\n\
    ```\n\nWe would be adding 1 to heart due to the 1 being on the right side of the\
    \ equation.\n\nThe same goes for -=. When we say -= 1, we are really saying:\n\
    \n```java\nheart = heart - 1;\n```\n\nThe same holds true for using multiplication\
    \ and division, denoted *= and /= respectively.\n\n## Modulus\n\nYou already know\
    \ about addition, subtraction, multiplication, and division, but there is a fifth\
    \ operator that you are probably not aware of. The modulus operator (represented\
    \ by the percent sign %) is a mathematical operator used all the time in computer\
    \ programming. Modulus returns the remainder after division of the two numbers\
    \ given.\n\nNow, that sounds technical, so let's use the example of 5 % 2 (read\
    \ 5 modulo 2). In order to do this, we divide 5 by 2 using long division.\n\n\
    - 1) How many 2s can we fit into 5 using only whole numbers?\n  Answer: 2\n- 2)\
    \ Next, we multiply 2 by our answer.\n  2 * 2 = 4\n- 3) Then subtract the answer\
    \ from 5.\n  5 - 4 = 1\n- 4) 1 is the remainder after division because two can't\
    \ fit into 1.\n\nThis means that 5 % 2 = 1.\n\n## Variable Naming Conventions\n\
    \nAn important rule to follow is that you can’t name a variable whatever you want.\
    \ There are many different names you can use however, as long as it follows these\
    \ three rules:\n\n- 1) Always start the name of the variable with a letter. This\
    \ means that you can’t start your variable with a number such as 2heart, but you\
    \ can name the variable heart2.\n- 2) Never put a space in your variable name.\
    \ You must always remove all spaces.\n- 3) Variable names and their cases are\
    \ important. Hello is not the same as hello.\n\n## Variables - Exercises\n\n-\
    \ 1. What is the type of:\n- 2. What is the output of:\n- 3. What is the output\
    \ of:\n- 4. What is the output of:\n- 5. What is the output of:\n- 6. What is\
    \ the output of:\n- 7. What is the output of:\n- 8. What is the output of:\n-\
    \ 9. What is the output of:\n- 10. What is the output of:\n\n## Chapter Three:\
    \ Conditional Statements\n\n## Boolean Expressions\n\nIn the previous chapter,\
    \ we learned about booleans and how they can hold true or false. On their own\
    \ booleans are not very useful. However, they can be used to ask questions. A\
    \ boolean expression is a set of variables and operators that evaluates to either\
    \ true or false.\n\n| Operator | Name | Description | Example |\n| --- | --- |\
    \ --- | --- |\n| == | Equal To | Is A equal to B? | 2 == 3 is false |\n| > | Greater\
    \ Than | Is A greater than B? | 2 > 3 is false |\n| >= | Greater Than or Equal\
    \ To | Is A or equal to B? | 2 >= 3 is false |\n| < | Less Than | Is A less than\
    \ B? | 2 < 3 is true |\n| <= | Less Than or Equal To | Is A or equal to B? | 2\
    \ <= 3 is true |\n| != | Not Equal to | Is A not equal to B? | 2 != 3 is true\
    \ |\n| ! | Not | Is the false? | false |\n| || | Conditional Or | Is A and/or\
    \ B true? | true || false is true |\n| && | Conditional And | Are A and B both\
    \ true? | true && false is false |\n\nYou can also combine the logical operators\
