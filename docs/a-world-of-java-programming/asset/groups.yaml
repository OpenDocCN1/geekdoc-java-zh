    # Chapter Six:

    Strings


    One type of variable you might still have questions is the String. As you already
    know, a String variable that contains a series of letters and symbols. A simple
    example of a string would be "Hello World!!!" You might also remember that a char
    is a variable that holds a single letter or symbol, for example ''a''. What you
    might not know is that a String is just a special type of array that holds chars.


    The String "Hello!!!" can be thought of as the following array, where each character
    is one element in the array.


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|---||

    | H | e | l | l | o | ! | | ! |


    However, there are a few differences between Strings and Arrays that you should
    know about:


    | char [] word = {''h'', ''i''} | String word = "hi" |

    |---|---|

    | Get a Letter | word[0] | word.charAt(0) |

    | Change a Letter | word[1] = ''Z'' | Must create a new String: word = "HZ" |

    | Print | Must convert to a String before printing: String(word) | Use normal
    printing conventions |

    | Get Size | word.length | word.length() |

    | Adding New Elements | A new array must be created char[]wordTo = {''h'', ''i'',
    ''!''} | word += "!" |


    By far the two biggest differences to keep in mind is that an array can be changed
    but a String cannot, and that you can always make a String longer but an array
    has a fixed length.'
