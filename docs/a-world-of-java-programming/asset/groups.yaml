    Other useful tricks that one can use to manipulate strings are the toUpperCase(
    ) and toLowerCase( ) methods. These methods are incredibly useful for trying to
    make a String all the same case, eliminating the need for case sensitivity.


    The code below prints out “HELLO” and “hello” respectively


    ```

    String word = "Fox";


    word = word.toUpperCase( );

    System.out.println( word );


    word = word.toLowerCase( );

    System.out.println( word );

    ```


    # Special Characters


    When printing Strings there are a few things that you might want to print but
    don''t know how to. For example, how do you print a tab, go to a new line, or
    print a quotation mark?


    To add any of these to our Strings we need the backslash character "\ When the
    Java sees the backslash in a String or character it lets Java know that it needs
    to print something special. Below are the codes for a few different characters
    you might find useful. Experiment with them to see what they look when printed.


    | Special Character | What is Printed |

    |---|---|

    | " | Double Quotation Mark |

    | '' | Single Quotation Mark |

    | \ | Back Slash |

    | \n | New Line |

    | \t | Tab |

    | \b | Backspace |

    | \r | Carriage Return |'
