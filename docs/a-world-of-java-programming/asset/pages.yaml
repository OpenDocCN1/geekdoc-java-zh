  md: '# Variable Naming Conventions


    An important rule to follow is that you can’t name a variable whatever you want.
    There are many different names you can use however, as long as it follows these
    three rules:


    +   1) Always start the name of the variable with a letter. This means that you
    can’t start your variable with a number such as 2heart, but you can name the variable
    heart2.


    +   2) Never put a space in your variable name. You must always remove all spaces.


    +   3) Variable names and their cases are important. Hello is not the same as
    variable as hello. Programmers also write using camel case, meaning that the first
    word is normally lower case and the following words are upper case, such as HelloWorld
    (notice the w is capitalized).


    +   4) Avoid underscores("_") as much as possible'
