  md: "# # Chapter Four:\nLoops\n\nWhy are they important?\nImagine that you had been\
    \ tasked with adding up all the numbers between zero and ten. This wouldn't take\
    \ too long to do by hand and would be simple program. But what if you had been\
    \ asked to add all the numbers up to 1,000? 100,000,000? At this point it would\
    \ no longer be practical to add these numbers by hand or to write each addition\
    \ as its own line of code. However, by using loops we can get this task done easily.\
    \ A loop is a section of code that is done repeatedly until a certain condition\
    \ is met.\n\nWhile Loops:\nThe while loop is the most basic of the loops but also\
    \ the most powerful. At the top of the while loop you have a condition. This condition\
    \ is always a boolean expression and the loop will continue to run until the expression\
    \ is false. Inside the loop we put the code we want to run repeatedly. Below is\
    \ a while loop that adds all the numbers between zero and one thousand.\n\n```\n\
    int num = 1; // The number to be added\nint sum = 0; // The current sum\n\nwhile\
    \ ( num <= 1000 ) {\n    sum += num;\n    num++;\n}\n\nSystem.out.println( sum\
    \ );\n```\n\nIn this example the while loop will run as long as num <= 1000. Each\
    \ time the loop is run num will be added to the sum variable. Then, num will be\
    \ incremented by 1 (this is what num++ means)."
  merge: -1
  pgno: 28
- img_proc: true
  md: "When num reaches our value 1001, it will no longer be <= 1000.\nSo, when we\
    \ ask our question again it loop, going to the System.out.println(sum).\n\nThe\
    \ most important thing to remember when creating loops is to make sure that it\
    \ will end at some point. A loop that never ends is called an infinite loop, and\
    \ can be very dangerous in more complicated programs because they can cause strange\
    \ and unpredictable things to happen. A simple example would be to change the\
    \ increment (num++) to a decrement (num--). In this case num will always be less\
    \ than any number on thousand so the loop will never exit. Before you run any\
    \ program will a loop in double check that no infinite loops exist.\n\n# For Loops:\n\
    \nThe second type of loop is called a for loop. These loops specialize in changing\
    \ a variable until its value reaches a certain number. Here is the same code that\
    \ calculates the sum of all numbers from zero to one thousand using a for loop.\n\
    \n```\nint sum = 0; // The current sum\n\nfor ( int num = 0; num <= 1000; num++\
    \ ) {\n    sum += num;\n}\n\nSystem.out.print( sum );\n```\n\nLet's break down\
    \ the loop. The first part of the loop creates a new integer variable called num\
    \ and sets it equal to zero. The second part tells us that that loop will end\
    \ when num is no longer less than or equal to 1000. Lastly, the third part tells\
    \ us that after each time the loop is run we will increment num by one.\n\nSo,\
    \ the first time we enter the for loop sum is equal to zero and num is equal to\
    \ zero. We check if num is <= 1000. It is so we enter the for loop. Next, we add\
    \ num to sum (0 = 0 + 0) so sum is still zero. When we reach the ending brace\
    \ ('}') we add one to num"
  merge: -1
  pgno: 29
- img_proc: true
  md: "because the last part of the for loop says num++. So, num is now equal to one.\n\
    \nThen we loop back to the top of the for loop and ask our question again: is\
    \ num <= 1000? Yes, so we enter the for loop again. This time when we compute\
    \ sum += num we will get 1 = 0 + 1. Once again we reach the closing brace of our\
    \ for loop we add one to num.\n\nThis will continue until our question is no longer\
    \ true ( num is no longer less than or equal to 1000). When this happens we exit\
    \ out our for loop. This simply means that we skip all the way to the code after\
    \ our closing brace. In this example, when we exit out our for loop we would go\
    \ right to the System.out.println( sum );\n\nSo far we have only talked about\
    \ num++ and num--, but there is also ++num and -num. When the ++ or - is placed\
    \ before the variable in a for loop, the increment or decrement is evaluated before\
    \ we ask our question. This means that we used ++num in the above example: num\
    \ would start at 0, then be incremented to 1, then num (1) would be added to sum.\n\
    \nAlthough an increment or decrement is often used in a for loop, you don't have\
    \ to do that. The following program adds all the powers of two between one and\
    \ one thousand.\n\n```\nint sum = 0; // The current sum\nfor ( int i = 0; i <=\
    \ 1000; i *= 2 ) {\n  sum += i;\n}\n\nSystem.out.print( sum );\n```\n\nAs you\
    \ can probably see, a for loop is just a fancy while loop. As a programmer, it\
    \ is good practice to use a for loop whenever you can because because they are\
    \ often easier to read and understand than while loops. However, while loops can\
    \ be much more powerful than for loops in certain situations."
