  md: "# Chapter Seven:\nMethods\n\nBasic Methods\n\nAs you start to put together\
    \ all of the different things that you have learned, you might begin to notice\
    \ that your code is getting rather complicated and crowded. A way that programmers\
    \ deal with this, and to keep their code more organized and efficient, is to use\
    \ different methods.\n\nMethods are created much like a class, however with fewer\
    \ identifying keywords. An example of a method would be:\n\n```\npublic String\
    \ getString ( String x ) {\n    // your code here\n    return x;\n}\n```\n\nIf\
    \ we take a closer look at each of the words that make up the declaration of the\
    \ method, we see the words public, String, getString, and (String x). Each of\
    \ these means something, and can be changed.\n\nPublic is the visibility declaration\
    \ of the method. Public means that anyone can use this method. Private on the\
    \ other hand means that only this class can use it.\n\n> (See Useful Tables and\
    \ Reference for a list of modifiers)\n\nString, the second word, is the return\
    \ type. In this example, the method would return a String variable. However, if\
    \ the second word was int, the method would have to return an integer.\n\nThe\
    \ third word \"getString\" is the name of the method. Every method should be named\
    \ using conventional rules: the first word is lowercase, and all following words\
    \ are uppercase."
