  md: '# # Chapter Five:

    Arrays


    Suppose you wanted to have a program that stores the grades of all one hundred
    students in a programming class. Although we could create one hundred variables
    to hold every person’s grade this would take a lot of time and make our code hard
    to read. Frankly programmers have created a way to do exactly that in a simple
    and easy to understand way.


    An array is a chunk of computer memory that is reserved for a certain type of
    variable. These chunks can hold as few as one variable or as many as the computer
    allows (many, many more than we will ever need in this book). All the variables
    stored in this way are assigned a unique number so that you can pull them out
    of memory whenever you need to. For example, the array below hold up to eight
    variables (x) numbered 0-7.


    | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

    |---|---|---|---|---|---|---|--|

    | X1 | X2 | X3 | X4 | X5 | X6 | X7 | X8 |


    Always remember that the numbering (called indexing) of the array starts at zero.
    So, the fifth element in the array is indexed as 4.


    To create an array in Java we first need to specify what type of variable we are
    saving in our chunk of memory. We then need to name the array and specify how
    many elements it can hold. The size of an array cannot be changed once it is created,
    so it is important to use the correct size in the beginning. Below are the three
    different ways to create an array in Java.'
