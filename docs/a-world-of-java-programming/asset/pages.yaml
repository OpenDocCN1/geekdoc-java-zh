  md: '# Chapter Two:

    Variables


    Imagine you have a standard deck of cards, where each of these cards have different
    suits with their corresponding values. Now you might be asking, what do these
    cards have to do with programming? Well, in programming, different values are
    stored within different suits, called variables. These variables can hold a variety
    of different values and types for as as the type matches. An example of this would
    be say we picked up a card that was the 2 of Hearts. In this instance, the Hearts
    would be a data type (variable), and the 2 would be the data value stored in it.
    We achieve this through a process of instantiation.


    Instantiation is the process that we use to create the variable. Each variable
    can only be instantiated once, and and after that the values are free to do whatever
    you want them to.


    An example of this if we used our card analogy would be:


    ```

    Heart heart = 2

    ```


    In code, it would look more like:


    ```

    int heart = 2;

    ```


    Notice that in front of the name that we gave, there lies the word int (in this
    case int is the data type). Overall there are many different data types that each
    hold their own respective variables. The different variables that we will be using
    throughout this book are int, double, boolean, char, and String.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# What is an *int*?


    An *int*, pronounced integer, is a type of variable that holds a specific type
    of number. The *int* data type can only hold whole numbers like -3, -2, -1, 0,
    1, 2, 3. Integers can hold positive and negative values, and are often used for
    keeping a count of different objects and functions.


    # What is a *double*?


    A *double* can be any number, including the ones with decimal points such as 1.2,
    2.2 or 3.2. Although they can hold whole numbers like 1, 2, and 3, they are stored
    as 1.0, 2.0, 3.0. This is more useful for calculations and when you want to have
    a more precise value as an answer.


    # What is a *boolean*?


    A *boolean* is a variable that can only hold true or false. This is important
    for telling your code to perform different functions or to change the output based
    on whether something is true or false. An example of this would be collision.
    Think of a video game that you have played. When you walk around, and say you
    walk into an object, do you run through it? Most likely not! This is because the
    code is telling the character that its movement is false when it collides, and
    therefore can''t walk through the object. These types events will be discussed
    later in the book.


    # What is a *char*?


    A *char*, short for character, is an individual character that has a specific
    ASCII (or numeric) value. Stored between single quotation marks such as ''a'',
    chars are useful because they allow us to manipulate specific characters in words.
    An example of this would be an encryption program. This type of program would
    take in a bunch of different *chars*, and apply a change to each *char* so it
    could be stored as something else. Remember that is computer science a character
    can be anything from the letter to a space ('' ''), period (''.''), or tab (''\t'').'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# What is a String?


    A String is defined as a character array, meaning that each String is full of
    multiple characters together to be stored in a single variable. Denoted by quotation
    marks (E.g. “Hello World”),), Strings are useful because they hold words and phrases
    that can be printed out and used to display text, instead of printing out each
    char individually. Also note that Strings use a capital “S”. They are the only
    basic variable type that uses a capital letter.


    # Manipulation of Variables


    Think back to the variable of heart that we created earlier. Now you might be
    thinking, what use is it it is always 2 for its whole life? Well, it doesn''t
    always have to be that way. There are various ways that you can change the variable
    so it holds other values, but keeps the same name. An example of this would be:


    ```

    Heart heart = 2

    heart = 3

    heart = 4

    ```


    Now what value does heart hold? 4. Also, notice how we did not have to declare
    what type heart was when we changed its value from 2 to 3 to finally 4. Another
    example would be:


    ```

    int heart = 3;

    heart += 1;

    heart -= 2;

    ```


    Now try and see what heart holds. If you guessed 2, then you guessed correctly!
    Don''t worry if you didn''t get the right answer. You may be asking yourself,
    what exactly does += and -= do? Take the example above. When we say that heart
    += 1, we are really saying:


    ```

    heart = heart + 1;

    ```'
