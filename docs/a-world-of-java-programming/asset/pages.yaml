  md: '# # Useful Tables and References


    Table 1: Class Access Modifiers


    | Modifier | Description |

    | default* | This class can only be accessed by classes within the same package
    |

    | public | This class can be accessed by any other class |


    Table 2: Class Non-Access Modifiers


    | Modifier | Description |

    | abstract | This class must be inherited. You can''t use this class only its
    children |

    | final | This class can''t be inherited |


    Table 3: Method Access Modifiers †


    | Modifier | Description |

    | default* | This method can only be used (accessed) by classes in the same package
    |

    | private | This method can only be used (accessed) by the class it is located
    in |

    | protected | This method can only be used by classes in the same package or children
    of this class |

    | public | This method can be used (accessed) by any class |


    Table 4: Method Non-Access Modifiers †


    | Modifier | Description |

    | abstract | You must override this method in a child class in order to use it
    |

    | final | This is the final version of the method and it can''t be overwritten
    |

    | static | For all practical purposes this makes it so that there can only be
    one method with this name in your class.'
