  md: '# Style Guide


    Naming Conventions:


    Projects:


    +   - Name should begin with an uppercase letter (ex. Game).

    - The first letter of every word in the name should be uppercase (ex. @, _, MyFirstGame).

    - No spaces or special characters (@, #, _, ~, ...).

    - Avoid using numbers (i.e. use "One" instead of "1”).

    - Try to keep it short and relative to what the project does.


    Packages:


    +   - Naming convention is similar to projects but should use lower case letters.


    Classes:


    +   - Naming Convention is similar to projects.


    Methods:


    +   - Name should begin with an lowercase letter (ex. run()).

    - The first letter of every word after in the name should be uppercase (ex. runGame()).

    - No spaces or special characters (@, #, _, ~, ...).

    - Avoid using numbers (i.e. use "One" instead of "1”).

    - Try to keep it short and relative to what the project does.


    Variables:


    +   - Naming convention is similar to methods


    Comments:


    +   - There should be a header in each class file listing the author(s), date
    the class was last modified, and a short description of what it does. Occasionally,
    the header will also include the programmer’s contact information.'
