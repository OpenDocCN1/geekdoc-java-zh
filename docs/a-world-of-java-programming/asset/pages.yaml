    Where each box represents a node object and each arrow represents a reference.
    You will notice node two points to a circle, this represents null. Although this
    might seem rather useless right now, by exploiting this concept we can obtain
    very interesting behavior.


    Stacks

    A stack is a first-in-first-out data structure (abbreviated FIFO). This means
    that when an element is added to a stack it is also the first element out out
    of the stack. You can think of a stack as a literal stack of objects. Each node
    in the stack references the object below it, and the only way to get to a lower
    object is to remove the ones on top of it. We represent a stack using the diagram
    to the right.


    ![](img/00e171bfc78f24d2c0e91ef6ab7498fa_66_1.png)


    To access node two, you must first remove node one and follow its reference. This
    rule is what makes stacks the FIFO behavior. You can think of stacks as storage
    devises that reverse the order you put things in. For example, if you put in 3,
    2, 1 you will reverse the order you take each of the number back out (1, 2, 3)
    because the stack is a FIFO structure.


    Although you can make your own stack class, and all the methods required for it,
    Java already has one built. To use it just import it from java.util.Stack. Here
    is a sample code that reverses an array of characters.'
