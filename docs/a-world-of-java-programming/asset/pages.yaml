    \ where the next number in the series is equal to the sum of the previous two\
    \ numbers. The sequence starts with 0, 1, 1, 2, 3, 5, 8, and so on.\n\nAs you\
    \ can see 1 = 1 + 0, 2 = 1 + 1, 3 = 2 + 1.. Here is the code to calculate these\
    \ numbers using recursion.\n\n```\npublic int fib ( int n ) {\n    if ( n == 0\
    \ ) {\n        return 0;\n    } else if ( n == 1 ) {\n        return 1;\n    }\
    \ else {\n        return fib( n - 1 ) + fib ( n - 2 );\n    }\n}\n```\n\nThis\
    \ code returns the nth Fibonacci number (ex. fib(4) returns 3). In this case,\
    \ we have two base cases (n == 1 and n==0). We need both because our recursive\
    \ program calls n - 1 and n - 2."
