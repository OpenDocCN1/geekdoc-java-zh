  md: '# Table 8: Variable Types


    | Name | What it Holds |

    |--- |--- |

    | byte | A single byte, a number between 127 to -128. |

    | short | Whole numbers between -32,767 to 32,768. |

    | int | Whole numbers between -2,147,483,648 and 2,147,483,647. You should always
    use this over, short, and unless you either need a larger number or you need to
    be concerned about memory usage. |

    | long | Whole numbers between -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807.
    The long takes up more space than the int, only use it when necessary |

    | float | A decimal number with about 6 significant digits. |

    | double | A decimal number with about 15 significant digits. Although a double
    takes up more space as a float, you should always use a double unless you have
    a good reason not to. |

    | boolean | True or False |

    | char | A single ASCII character |

    | String | A series of char(s) |


    # Table 9: Common Generic Types §


    | Generic Type | What it Holds |

    |--- |--- |

    | <Integer> | int |

    | <Double> | double |

    | <Boolean> | boolean |

    | <Character> | char |

    | <String> | String |


