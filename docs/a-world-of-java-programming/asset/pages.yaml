  md: '# # Chapter Eight: Objects


    # ## Basic Objects


    Up to this point everything you have coded in Java has been in one class file.
    We are now going to be creating other class files to use in our programs. This
    will allow us to create more complex programs and to make our programs much easier
    to read. However, to understand what it means to use multiple classes we must
    first go over something called an object. In Java you can think of an object and
    a class as the same thing (although this isn’t exactly true in all fields of computer
    programming).


    In Java an object is anything that you can describe. That might sound very vague,
    but an object can be literally anything that can be described using numbers, words,
    actions, etc. For example, we can describe a lion using a table. We call tables
    like this UML (Unified Modeling Language) diagrams. They are very useful for explaining
    what an object is and what it can do. By looking at our UML diagram of a lion
    we can easily see what things need to be included in our object.


    | Lion | Name |

    |---|---n| - Has Fur | |

    | - Has Claws | |

    | - Has a Tail | |

    | - Lives in the Savana | |

    | - Age | |

    | - Weight | |

    | - Eat | |

    | - Sleep | |

    | - Pounce | |

    | - Roar | What It Can Do (Actions) |'
