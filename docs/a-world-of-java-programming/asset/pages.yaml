  md: '# Setting Up Your Environment


    Before you can start programming in Java, you will first need to get the Java
    SDK (Software Development Kit). This set of files contains everything Java will
    need to convert your programs to Java Byte Code. (See “How to Download Java")


    Although it is possible to write Java code using almost any simple text editor,
    there are professional programs that streamline the process of writing code. Called
    Integrated Development Environments (or IDEs), these programs include useful features
    like: spell checking, logic error detection, syntax error detection, built in
    compilers, and many more features.


    There are many different IDEs out there and each one has its pros and cons. This
    book is designed to work well with either the Eclipse IDE or the IntelliJ IDE.
    We recommend looking at both and choosing the one that works best for you. Remember
    that your, decision is not set in stone, feel free to tryout one and switch if
    you don’t like it.


    The next two sections will show how to create your first program in Eclipse and
    Intellij respectively. Skip to the section that describes the IDE that you will
    be using.


    # Creating a Program In Eclipse


    Once you have downloaded Eclipse it’s time to create our first program. To start,
    open Eclipse and select the default workspace by selecting “OK” on the pop-up
    window. You will have to do this each time you open Eclipse.


    The first time you open a new workspace you will be greeted by the Eclipse welcome
    screen. Here you can get an overview of the entire Eclipse IDE along with a few
    simple tutorials. For now, just click the “restore” button at the top right corner
    of the screen.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Now that we have opened the Eclipse editor there are three important windows
    to take note of:


    +   - Package Explorer: Located on the left-hand side of the screen, this is where
    we will see all of the projects (programs) that are saved to this particular workspace.


    +   - The Editor Window: The large blank space in the center of the screen is
    the editor window. This will be used later to edit and create our code.


    +   - The Console: The console can be found at the bottom of the screen under
    the console tab, this is where any print statements, errors, or other important
    information will be displayed when we run our programs. If the console isn''t
    being displayed, then go to: "Windows" → "Show View" → "Console"


    To create a new Project, you will need to go to "File" → "New"→ "Java Project."
    This will open the "New Java Project" window. Here we can specify many things
    about the program creating. For now, just set the project name to "HelloWorld"
    then click "Finish."


    Next, right-click on the folder and select "New" → "Class." This will bring up
    the "New Java Class" window. This window will allow you to many of the settings
    that define a Java class. For right now we are only interested in two of these
    fields. First, set the "Name" of the class to "HelloWorld." Second click on the
    check box for "public static void main(String[] args)," this will create the Main
    Method in our program. Once you are done click "Finish."'
