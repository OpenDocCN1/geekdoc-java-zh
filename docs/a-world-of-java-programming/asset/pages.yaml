  md: '# Chapter Three:

    Conditional Statements


    # Boolean Expressions


    In the previous chapter, you learned about booleans and how they can hold values
    of either true or false. On their own booleans are not very useful. However, they
    can be used as a way of asking questions in a program when you combine them to
    form a boolean expression.


    A boolean expression is a set of variables and operators that evaluates to either
    true or false. This is useful if you want to ask a question like *num* an even
    number? This question can be coded into Java like this:


    ```

    int num = 9;

    boolean isEven = ((num % 2) == 0);

    ```


    Remember that the modulus operator (%) returns the remainder of the first number
    divided by the second number. Any even number divided by 2 will always have a
    remainder of zero. Now you might have noticed that a double equals sign (==) was
    used instead of the usual single one (=). In short, == asks if something is equal
    to something else and = sets something equal to something else. The key point
    here is that == is a question and = is a statement.'
  merge: -1
