  md: '# Creating a Program In IntelliJ


    After installing IntelliJ you will be ready to create your first program. To begin
    open IntelliJ and select “Create New Project” from the popup window. Once you
    do this the New Project Window will open.


    When the next page loads check to see if IntelliJ has automatically found your
    Java SDK. If not, then you will have to click the “New...” button and select the
    SDK that you installed. Once you are done next.


    The next page allows you to load a project from a template. We won’t be using
    any templates in this book so just make sure no templates are selected then click
    next.


    The following page is were we define the name of our project . For this example
    change the project name to “HelloWorld” with no spaces. Once that is done select
    “Finish”. At this point you might have to wait for IntelliJ to create your workspace.
    When it is done building a panel on the left hand side of the screen will appear
    with the name of our project “HelloWorld” and an arrow.


    Select the arrow to expand our project folder. Right click on the “src” folder
    and select New → Java Class. Name the class “HelloWorld” and click “OK”. This
    will load a new tab containing our code.


    Now that you have successfully created your project, lets go over the different
    parts of the IntelliJ IDE.


    +   - Active Tool Window: Located on the left-hand side of the screen, this is
    where we will see all of the files you are using in your current project.


    +   - The Editor Window: The large blank space in the center of the screen is
    the editor window. This will be used later to edit and create our code.'
