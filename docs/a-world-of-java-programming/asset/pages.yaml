  md: '# Class Modifiers:


    | Modifier | Description |

    | --- | --- |

    | public | This class can be accessed by any other class |

    | default | This class can only be used by other classes in the same package (folder).
    |


    Now let''s take a closer look at the main method to see what it all means. We
    already know that public static means that the method can be accessed by any other
    class and that there can only be one main method in the program, but what does
    void mean? This part of the method signature is what we call the return type.
    You can think of a method as a machine that we can put stuff into (called the
    arguments or parameters) and we can sometimes get stuff out (called the return
    type). In the case of our main method we don''t want to return anything so we
    write void. The stuff in parentheses is the argument (the stuff we feed into the
    machine).


    Every method you will ever create in Java will look like this:


    ```

    public static void main ( String[] args ) {

    ```


    For right now don''t worry too much about what the arguments portion of the method
    signature means, that will be discussed in a later chapter.


    Depending on what IDE of code you chose might also have an additional section
    of code that either begins with two forward slashes or is surrounded by "/* **/".
    This is what is called a comment in Java. Anything written within the comment
    is ignored when you run the code. This feature can be used when you want to write
    about what certain sections of your code. For more information on what you should
    comment see the style guide in the back of the book.'
