  md: "# Do While Loops:\n\nThe *do while* loop is probably the hardest loop to understand.\
    \ Much like a *while* loop, the *do while* loop has one boolean expression that\
    \ it checks every time it loops. If this expression is false it stops looping\
    \ and exits.\n\nHowever, unlike a *while* loop we ask this question at the end\
    \ of the loop (not at the beginning). This means that a *do while* loop will always\
    \ execute at least once. An example *do while* loop that calculates the sum of\
    \ all numbers from one to one thousand is shown below.\n\n```\nint sum = 0;  \
    \ // The current sum\nint num = 0;\ndo {\n    num++;\n    sum += num;\n} while\
    \ ( num < 1000 );\n\nSystem.out.print( sum );\n```\n\nNote that we ask our question\
    \ at the end (after we add one to *num*) we have to change our question to ask\
    \ if *num < 1000* rather than *num <= 1000*. We do this because when *num* is\
    \ equal to 999 we know that we will add one to it immediately after we ask our\
    \ question (adding 1000 to our sum). However, when *num* is equal to 1000 if we\
    \ let it loop again would actually add 1001 to our sum (something we don't want).\n\
    \nIn practice you shouldn't use a *do while* loop unless it makes the program\
    \ significantly easier to understand, shorter, or more efficient. For a beginner\
    \ you should try sticking to *for* and *while* loops whenever possible."
  merge: -1
