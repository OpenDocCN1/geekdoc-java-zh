  md: '# Chapter Nine:

    Object Structures


    Advanced Object Design


    In the last chapter, you were introduced to basic object oriented design. This
    included how to create a basic object and the fundamentals of inheritance. However,
    objects are even more powerful than anything we discussed in the previous chapter.
    One of the most important tools in advanced object design is pointers.


    Pointers and Nodes


    You might be wondering what an object actually is in a computer? In truth, there
    is no computer on Earth that knows what an object is, but they do know how to
    section off parts of memory (like with arrays). This is where objects live in
    computers, large chunks of memory. When we create an object like Lion *simba*
    = new Lion() what we are really doing is telling Java to make a chunk of memory
    big enough to hold our *Lion* class and store the location of that memory in our
    variable *simba*.


    In Java, we call these variables references†. A reference is any variable that
    points to an object in memory. By using this fact to our advantage we can create
    more complex objects. On the next page is an example code that uses this feature


    > †: Note For C and C++ Programmers:

    A reference is not the same as a pointer in C or C++. You can''t perform arithmetic
    or other such operations on Java references. There are also other more complex
    reasons for this distinction that are beyond the scope of this book.'
