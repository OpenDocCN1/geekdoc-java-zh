  md: "# Array Lists\n\nA second useful structure is the array list. In Java (and\
    \ most programming languages) arrays have a fixed length. This makes them hard\
    \ to use when you don't know how much data you have to store. Generally, programmers\
    \ solve this problem by either making their arrays huge, or constantly making\
    \ new arrays to fit their data. By using references and nodes, however, we can\
    \ create a structure that can be used like an array and grows like a stack.\n\n\
    The following code stores the numbers one to ninety-nine in an array list.\n\n\
    ```\nArrayList <Integer> list = new ArrayList <>() ;\nfor ( int i = 0; i < 100;\
    \ i++ ) {\n    list.add( i );\n}\nfor ( int i = 0; i < list.size( ); i++ ) {\n\
    \    System.out.print( list.get( i ) + \" \" );\n}\n```\n\nJust like the stack,\
    \ you will have to import the array list from java.util.ArrayList. Here are the\
    \ basic methods in the array list class.\n\n+   - add( element ) - Adds the given\
    \ element to the end of the array list.\n\n+   add( element, index ) - Adds the\
    \ given element to the array list, inserting it at the given index.\n\n+   get(\
    \ index ) - returns the element stored at the given index.\n\n+   size( ) - returns\
    \ the number of elements stored in the array list."
