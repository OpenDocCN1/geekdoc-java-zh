  md: 'However that can be shortened using a += and the value we want to add to it
    after the symbols. Say we used:


    ```

    heart += 1;

    ```


    We would be adding 1 to heart due to the 1 being on the right side of the equation.


    The same goes for -=. When we say -= 1, we are really saying:


    ```

    heart = heart - 1;

    ```


    The same holds true for using multiplication and division, denoted *= and /= respectively.


    # Modulus


    You already know about addition, subtraction, multiplication, and division, but
    there is a fifth operator that you are probably not aware of. The modulus operator
    (represented by the percent sign %) is a mathematical operator used all the time
    in computer programming. Modulus returns the remainder after division of the two
    numbers given.


    Now, that sounds technical, so let''s use the example of 5 % 2 (read 5 modulo
    2). In order to do this, we divide 5 by 2 using long division.


    +   1) How many 2s can we fit into 5 using only whole numbers?

    Answer: 2

    2) Next, we multiply 2 by our answer.

    2 * 2 = 4

    3) Then subtract the answer from 5.

    5 - 4 = 1

    4) 1 is the remainder after division becasue two can''t fit into 1.


    This means that 5 % 2 = 1.'
