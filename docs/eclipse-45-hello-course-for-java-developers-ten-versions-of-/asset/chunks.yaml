    Cross-platform file format that groups, and possibly compresses, multiple class
    files and other files such as graphics and sound files into one file. A single
    HTTP transaction downloads the entire `JAR` file. An EJB Jar is a special form
    of a `JAR` that contains an EJB.


    ## What''s a JAR file (.jar file)?


    File that aggregating many files into one using a compressed format (JAR file
    format) based on `PKZIP` format. Java reads `JAR` files without decompressing
    them. Can have (usually have) relative directory structure. Can be viewed (but
    not created by) `ZIP` viewers. Can be created by more powerful `ZIP` tools like
    `WinZip` or `7UP`.


    ## What''s an executable jar file?


    Jar file that contains a manifest file that lists a main class. Entering the name
    of the file at the command line starts the main method of the main class.


    ## What''s an EAR (Ear file) (EAR file) (Enterprise ARchive file)?


    Contains all the class files and other resources an enterprise application needs
    to run. Often used as a synonym for enterprise application or J2EE enterprise
    application. `Ear` files are deployed on an application server.


    ## What''s extract required libraries?


    Copy required classes into an executable jar.


    ## What''s package required libraries


    Copy entire library `jars` into an executable jar.


    ## Questions


    All these questions assume the project is an open expanded project.


    ## Appendices


    ### Appendix I: Answers to questions


    #### Chapter 7


    What are two additional ways to create a new project? Hint: Click on `File`. Look
    at the dropdown then mouse over the toolbar icons.


    Click on `File->New`. Click on the `New` icon (blue and white rectangle with a
    yellow plus sign) on the far left of the tool bar then click on `New`.


    What are two additional ways to open `HelloWorld.java` in the Java editor?


    Double click on `HelloWorld.java` in the `Project Explorer` tab. Right click on
    `HelloWorld.java`. When the dropdown appears, click on `Open`. BTW: What happens
    when you click on `Open With`?


    What additional way is there to close the Java editor?


    Click on the `X` to the editor tab.


    What additional ways are there to save the changed `HelloWorld.java` file?


    Click on the `X` on the editor tab and answer the popups.


    What additional ways are there to run the Hello project?


    Click on `Run` (or, `Run As`) under the `Run` menu. Click on the `Run` icon (green
    ball with a white right pointing triangle). BTW: What happens when you click on
    the dropdown to the left of the launcher icon (green ball with a white right pointing
    triangle with a toolbox under it)?


    What additional ways are there to close the Hello project?


    Highlight the project, click on the `Project` menu, then select `Close Project`.


    When you see a menu dropdown entry with three dots, what does it mean?


    Another menu is going to appear if you click on the entry.


    Where did Eclipse get the text for the `@author` tag?


    Open File Manager and look at the names under `Users`.


    #### Chapter 8


    What other ways are there to open a closed project?


    Select the project in `Project Explorer` Click on `Project->Open Project`.


    Why doesn''t `File-> Close` close an open project?


    Closes edit windows.


    #### Chapter 10


    How can I add Javadoc comments to new methods I add?


    Type `/**[ENTER]` the `*/[ENTER}`


    Why doesn''t `Source->Generate Element Comment` add a comment to a method?


    I''m not sure. It seems broken.


    #### Chapter 12


    What could you do instead of clicking on the small folder with red x to get help?


    Click on the `Help` menu.


    ## Author''s Biography


    John R Hines has degrees from two party schools (the University of Colorado and
    Arizona State University). He has been a semiconductor engineer, a programmer,
    a writer and a teacher. He is now retired in Lucas, Texas.


    In the 1980s, the US Patent and Trademark Office granted him six patents and he
    began writing about using computers to solve problems. He wrote a book about circuit
    simulation and taught SPICE (Simulation Program with Integrated Circuit Emphasis)
    classes at Fortune 500 companies.


    In the 1990s, he had computer-related columns in popular trade magazines like
    Electronic Test and Design Automation and scholarly magazines like IEEE Spectrum
    and taught C, C++, Delphi and Java.


    In the 2000s, he was a Java developer for America’s best telephone company.


    In 2014, he retired. He writes eBooks and is looking for a part-time Android programming
    job. Google him under JR Hines, John Hines and John R Hines.


    Eclipse 4.5 Hello Course is his thirteenth self-published book.


    He has previously published two large and one small eDictionaries (Mostly Java
    – a Dictionary of Distributed Computing, Dictionary of 17th – 19th Century Terms
