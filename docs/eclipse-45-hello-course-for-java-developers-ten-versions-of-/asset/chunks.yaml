    > `  return "Hello from HelloSeparation and Eclipse!";`


    > `}`


    In Project Explorer, highlight HelloMessageProvider.java then right click on it. 
    When the dropdown appears, click on "Source->Format".  When Eclipse finishes formatting
    it, save and close it.


