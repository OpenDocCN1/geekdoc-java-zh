  trans: "\n将 `HelloSeparation` 复制到 `HelloSeparationWithInterfaces`。（你关闭 `HelloSeparation`\
    \ 了吗？你已经将 `HelloSeparationWithInterfaces` 设置为打开展开的项目了吗？）我们（最终）将能够通过让 `HelloMessageProvider`\
    \ 和 `HelloMessageRender` 实现接口来更改消息。\n\n在 `HelloSeparationWithInterfaces` 项目中，右键点击\
    \ `HelloMessageProvider.java`。当下拉菜单出现时，点击 `\"Refactor-> Extract Interface\"`。当出现\
    \ `\"Extract Interface\"` 弹出窗口时，输入名称 `MessageProvider`，点击 `getMessage()` 旁的复选框，然后点击\
    \ `\"OK\"`。顺便说：注意接口的图标是一张纸，右上角有一个球，里面有一个大写的 `J` 和一个小写的 `I`。在并排的 Java 编辑器中打开 `MessageProvider.java`\
    \ 和 `HelloMessageProvider.java`。这里不需要做其他，只需在 `HelloMessageProvider.java` 中将消息更改为\
    \ `\"Hello from HelloSeparationWithInterfaces and Eclipse\"` 并保存文件。\n\n重复上述操作，从\
    \ `HelloMessageRenderer.java` 提取接口。在并排的 Java 编辑器中打开 `MessageRenderer.java` 和 `HelloMessageRenderer.java`。忽略注解（以\
    \ `@` 开头的行）。\n\n运行 `HelloSeparationWithInterfaces`。它运行并显示了适当的消息。\n\n#### 问题\n\n\
    所有这些问题都假设项目是一个打开展开的项目。\n\n#### 我如何为我添加的新方法添加 Javadoc 注释？\n输入 `/**` [ENTER]，然后输入\
    \ `*/` [ENTER]\n\n#### 为什么 `\"Source->Generate Element Comment\"` 没有给方法添加注释？\n\
    它本应该起作用的，但并没有生效。\n\n## 第 11 章：添加工厂以改进 Hello 分离\n\n#### 类引用可以赋值什么？\n`null` 或该类的对象，或该类的某个子类的对象。父类对象不能赋值给该引用。警告：该引用唯一能做的是调用原始接口中的方法。\n\
    \n#### 接口引用可以赋值什么？\n`null` 或实现该接口的某个（已定义的）类的对象、该类的某个子类的对象，或实现该接口子类的某个类的对象。实现父接口的类对象不能赋值该引用。警告：该引用唯一能做的是调用原始接口中的方法。\n\
    \n#### 什么是子类？\n子类别的另一个名称。\n\n#### 什么是工厂（工厂类）？\n通过组合或扩展创建其他类或对象的类或对象。\n\n#### 什么是父类？\n\
    超类的另一个名称。\n\n#### 什么是引用？\n具有类型的数据元素，其值是该类型对象或其子类型对象（在堆上）的地址。以前的 C 语言程序员可能将引用想为具有自控制功能的指针。\n\
    \n#### 什么是类引用？\n指向对象的引用，该引用只知道该对象的（已存在的）类或某个父类的特征和行为。\n\n#### 什么是子引用（子类引用）？\n\
    指向某个（已定义的）子类对象的引用。\n\n#### 什么是父引用（父类引用）？\n指向父类（超类）的引用。父类引用可以赋值给子类对象，但它只能访问对象继承自其父类的部分。\n\
    \n#### 什么是接口引用？\n指向对象的引用，该引用只知道对象所在的类所实现的某些接口的行为。\n\n#### 我为什么要关心类引用和接口引用？\n它们可以减少耦合并简化编码。\n\
    \n### 练习 11-1：通过添加工厂改进 Hello 分离\n\n将 `HelloSeparationWithInterfaces` 复制到 `HelloSeparationWithInterfacesAndFactory`。\n\
    \n在 `HelloSeparationWithInterfacesAndFactory` 项目中，右键点击 `\"(default package)\"\
    `。当下拉菜单出现时，点击 `\"New->Class\"`。使用名称 `MessageSupportFactory`。（你点击 `\"Generate comments\"\
    ` 旁的复选框了吗？）将下面的代码插入到 `MessageSupportFactory` 的体中。\n\n```java\nprivate static MessageSupportFactory\
    \ instance = null;\nprivate Properties props = null;\nprivate MessageRenderer\
    \ renderer = null;\nprivate MessageProvider provider = null;\nprivate MessageSupportFactory()\
    \ {\n    props = new Properties();\n    try {\n        props.load(new FileInputStream(\"\
    msf.properties\"));\n        // get the implementation classes\n        String\
    \ rendererClass = props.getProperty(\"renderer.class\");\n        String providerClass\
    \ = props.getProperty(\"provider.class\");\n        renderer = (MessageRenderer)\
    \ Class.forName(rendererClass).newInstance();\n        provider = (MessageProvider)\
    \ Class.forName(providerClass).newInstance();\n    } catch (Exception ex) {\n\
    \        ex.printStackTrace();\n    }\n}\nstatic {\n    instance = new MessageSupportFactory\
    \ ();\n}\n```\n\n出现了很多错误。点击第一次使用 `Properties` 右侧带有红色 `x` 的球。当帮助窗口弹出时，双击 `\"import\
    \ 'Properties' (java.util)\"`。在编辑器窗口顶部注释正下方插入 `\"import java.util.Properties\"\
    ` 后，大部分错误都消失了。在第一次使用 `FileInputStream` 右侧带有红色 `x` 的球处重复操作。双击导入 `'FileInputStream'\
    \ (java.io)`。不再有错误了！右键点击 public class 右侧的文本 `\"MessageSupportFactory\"` 并重新格式化类。注意该类假设我们会创建一个用于读取的\
    \ `msf.properties` 文件。\n\n右键点击 `\"MessageSupportFactory\"`。当下拉菜单出现时，点击 `\"Source->Generate\
    \ Getters and Setters\"`。选择 `instance`、`provider` 然后点击 `\"OK\"`。我们不会使用 setter\
    \ 方法，所以把它们删除。\n\n保存 `MessageSupportFactory.java`。双击 `HelloLauncher.java`。将 `main`\
    \ 方法体替换为以下代码：\n\n```java\nMessageRenderer mr = MessageSupportFactory.getInstance().getRenderer();\n\
    MessageProvider mp = MessageSupportFactory.getInstance().getProvider();\nmr.setMessageProvider(mp);\n\
    mr.render();\n```\n\n保存更改后的文件并关闭它。这段代码做什么的？如果在 `msf.properties` 中找到了 `HelloMessageProvider`\
    \ 和 `HelloMessageRenderer`，`MessageSupportFactory` 就可以创建这些对象，代码运行方式如之前。但它也可以创建任何实现了\
    \ `MessageProvider` 和 `MessageRenderer` 的其他类，如果是那样，代码运行可能会不同。\n\n双击 `HelloMessageProvider.java`。将返回消息更改为\
    \ `\"Hello from HelloSeparationWithInterfacesFactory and Eclipse.\"` 保存并关闭。\n\n\
    现在创建 `msf.properties` 文件。右键点击 `HelloSeparationWithInterfacesFactory`。当下拉菜单出现时，点击\
    \ `\"New->File\"`。输入文件名 `\"msf.properties\"` 然后点击 `\"Finish\"`。在文件中输入以下文本。保存并关闭文件。顺便问：文件在项目结构中哪里？\n\
    \n```properties\n# msf.properties\nrenderer.class=HelloMessageRenderer\nprovider.class=HelloMessageProvider\n\
    ```\n\n最后，编辑 `HelloMessageProvider.java` 中的消息，使其显示为 `\"Hello From HelloSeparationWithInterfacesFactory\"\
    `。\n\n运行 `HelloSeparationWithInterfacesFactory`。它运行并显示了适当的消息。\n\n### 练习 11-2：通过添加工厂改进\
    \ Hello 分离 部分 2\n\n将 `HelloSeparationWithInterfacesAndFactory` 复制到 `HelloSeparationWithInterfacesAndFactory2`。\n\
    \n在 `HelloSeparationWithInterfacesAndFactory2` 项目中，右键点击 `HelloMessageProvider.java`，当下拉菜单出现时，点击\
    \ `\"Copy\"`。右键点击 `\"default package\"`——当下拉菜单出现时，选择 `\"Paste\"`。为新类使用 `GoodbyeMessageProvider.java`。双击它在编辑器窗口中打开。将字符串更改为\
    \ `\"Goodbye from HelloSeparationWithInterfacesFactory and Eclipse.\"` 保存并关闭。双击\
    \ `\"msf.properties\"` 在编辑器窗口中打开。更改以 `provider` 开头的行，使其变为\n\n`provider.class=GoodbyeMessageProvider`\n\
    \n保存并关闭。\n\n"
- fmt: "\nRun `HelloSeparationWithInterfacesAndFactory2`. It runs and gives a different\
    \ message. So it is possible to change the behavior of an application with simple\
    \ changes in a text file. No compiling is required!\n\n## Questions\n\nAll these\
    \ questions assume the project is an open expanded project.\n\n## Chapter 12:\
    \ Reduce coupling even more with a smarter factory\n\n### What is Spring?\nThe\
    \ owner of the Spring family of frameworks, including lightweight open source\
    \ application server that simplifies developing Java enterprise applications.\
    \ Formerly known as SpringSource (`http://www.springsource.org`).\n\n### What's\
    \ a user library?\nCollection of useful external jars that have some common purpose.\n\
    \n### What's an appender?\nIn `Log4j`, an output destination for log file data.\n\
    \n### What's an external jar?\nJar file that is not built by a project in the\
    \ workspace, typically an API Jar file provided by some external site.\n\n## Exercise\
    \ 12-1: Improving Hello separation by using a factory from Spring Framework\n\n\
    To access Spring Framework, you'll need to download Spring Framework `3.2.16`\
    \ (zip) ALL Binary from `http://olex.openlogic.com/packages/spring/3.2.16`. Use\
    \ \"Extract all\" or some zip program to unzip the Spring jars to `c:\\MyCode`\
    \ (or some such place-it doesn't matter as long as you don't forget where).\n\n\
    Copy `HelloSeparationWithInterfacesAndFactory` to `HelloSeparationWithInterfacesAndSpring`.\n\
    \nRight click on the `HelloSeparationWithInterfacesAndSpring` project. When the\
    \ dropdown appears, click on \"Build Path -> Configure Build Path\". When the\
    \ `Java Build Path` wizard pops up, click on the `Add Library…` button. When the\
    \ `Add Library` wizard pops up, double click on `User Library`. When the `User\
    \ Library` wizard pops up, click on the `User Libraries…` button. When the `User\
    \ Libraries` wizard pops up, click on the `New…` button. When the `New User Library`\
    \ wizard pops up, enter the name `Spring 3.2.16` then click on `OK`. Back in the\
    \ `User Libraries` wizard, the `Spring 3.2.16` user library should be highlighted.\
    \ Click on the `Add External JARs…` button. When the Jar Selection wizard pops\
    \ up, go to the location where you unzipped the Spring Framework jars. Double\
    \ click on `libs` folder. In the folder, highlight `spring-beans.3.2.16.RELEASE`,\
    \ `spring-beans.3.2.16.RELEASE-javadocs`, `spring-core-3.2.16.RELEASE` and `spring-core-3.2.16.RELEASE-javadocs`\
    \ jars and click on `Open`. Back in `User Libraries`, look at the results then\
    \ click on `OK`. Back in `User Library`, click on `Finish`. Back in `Java Build\
    \ Path`, click on `Apply` then on `OK`. Note the change in the `HelloSeparationWithInterfacesAndSpring`\
    \ project. BTW: If you get any Oomph popups, just click on `OK`. You shouldn't\
    \ but ….\n\nOpen `HelloLauncher.java` in the editor window. Replace the code inside\
    \ `main` with the code below:\n\n```\nBeanFactory factory = getBeanFactory();\n\
    MessageRenderer mr = (MessageRenderer) factory.getBean(\"renderer\");\nMessageProvider\
    \ mp = (MessageProvider) factory.getBean(\"provider\");\nmr.setMessageProvider(mp);\n\
    mr.render();\n```\n\nClick on the small folder with red x icon to the far right\
    \ of \"BeanFactory with a red squiggle underneath\". When the on-help pops up,\
    \ double click on the highlighted `import 'BeanFactory' …` line. Note the import\
    \ statement added to the top of `HelloLauncher.java`. Yes, there's still a problem\
    \ with `getBeanFactory()` - it doesn't exist yet. Paste the method below into\
    \ `HelloLauncher.java` below `main()`.\n\n```java\nprivate static BeanFactory\
    \ getBeanFactory() throws Exception {\n  // get the bean factory\n  DefaultListableBeanFactory\
    \ factory = new DefaultListableBeanFactory();\n  // create a definition reader\n\
    \  PropertiesBeanDefinitionReader rdr = new PropertiesBeanDefinitionReader(factory);\n\
    \  // load the configuration options\n  Properties props = new Properties();\n\
    \  props.load(new FileInputStream(\"beans.properties\"));\n  rdr.registerBeanDefinitions(props);\n\
    \  return factory;\n}\n```\n\nAdd the missing import statements that remove the\
    \ errors the editor shows you.\n\nYou still have problems with `getBeanFactory()`.\
    \ Again, click on the small folder with the red x icon. Oh, it's just an unhandled\
    \ exception. Notice the help offers to options. Add `throws Exception` error message\
    \ to `main()` or surround with `try/catch`. Since `main` starts the application,\
    \ you don't have a choice: you have to use the `try/catch` so double click on\
    \ that choice. Unfortunately, you now have the problem that `factory` may not\
    \ be initialized. A sleazy but quick solution is to initialize `factory` to null:\n\
    \n```java\nBeanFactory factory = null ;\n```\n\nYou have no compile errors so\
    \ you can run the app. However, you do indeed get a file io error because there\
    \ is no file `beans.properties`. That's easy to fix. Right click on the project.\
    \ When the dropdown appears, select \"New->File\". When the File wizard appears,\
    \ enter the file name `beans.properties` then click on `Finish`.\n\nYou have no\
    \ errors so you can run the app. Now you have a puzzling error: the `LogFactory`\
    \ not found. This is puzzling unless you waste a lot of time read Spring docs.\
    \ Spring uses the Apache Log4j and.\n\nYou'll need to download `log4j-1.2.17.zip`\
    \ from `http://logging.apache.org/log4j/1.2/download.html`. Use \"Extract all\"\
    \ or some zip program to unzip the Spring jars to `c:\\MyCode` (or some such place-it\
    \ doesn't matter as long as you don't forget where).\n\nBack to \"Build Path->Configure\
    \ Build Path\", create a `User Library`, add `log4j` and `commons-logging` to\
    \ the library. You have no errors so you can run the app. But you have a puzzling\
    \ error: no bean `renderer`. Then you remember there is nothing in `beans.properties`.\
    \ Place the following code in `beans.properties`:\n\n```properties\n# renderer\n\
    renderer.class=HelloRenderer\n# Ask Spring to assign provider bean to the MessageProvider\n\
    # of the renderer bean\nrenderer.ref=provider\n# Message provider\nprovider.class=HelloProvider\n\
    ```\n\nAgain, no errors so you can run the app. This time, you have puzzling warnings\
    \ like \"log4j:WARN No appenders could be found for logger (org.springframework.core.Environment)\"\
    . An experienced Log4j user will recognize you need to add a `Log4j.properties`\
    \ file and supply you with an example like:\n\n```properties\nlog4j.rootLogger\
    \ = ERROR, myConsole\nlog4j.logger.com.spring = DEBUG, myFile, myConsole\nlog4j.additivity.com.spring\
    \ = false\nlog4j.appender.myConsole = org.apache.log4j.ConsoleAppender\nlog4j.appender.myFile\
    \ = org.apache.log4j.FileAppender\nlog4j.appender.myFile.file = myFile.log\nlog4j.appender.myConsole.layout\
    \ = org.apache.log4j.SimpleLayout\nlog4j.appender.myFile.layout = org.apache.log4j.PatternLayout\n\
    #log4j.appender.myFile.layout.ConversionPattern=%r %p %c %x - %m%n\nlog4j.appender.myFile.layout.ConversionPattern=%-5p\
    \ : %m %d{dd-MM-yy HH:mm:ss}%n\n```\n\nRight click on \"(default package)\". When\
    \ the dropdown appears, click on \"New->Other.\" When the \"Select a wizard\"\
    \ popup appears, click on \"General->File\" then click on the \"Next\" button.\
    \ When the \"File\" popup appears, enter `Log4j.properties` then click on `Finish`.\
    \ When `Log4j.properties` appears in the text editor view, paste the above lines\
    \ into the file. If you don’t see any errors, save and close. BTW: This file may\
    \ or may not save the information you want in Log4j's myFile. But, you can test\
    \ and see what gets logged!\n"
