  trans: "\n\n> 你有两个带有 `main` 方法的类。如果你右键点击项目并使用“Run as->Java Application”，将运行哪个类？在这种情况下，很容易看出：`HelloWorld`\
    \ 没有 `main` 方法体，所以如果运行它，控制台选项卡中不会显示任何内容；`HelloWorld` 有 `main` 方法体，所以如果运行它，控制台选项卡中应该显示\
    \ \"Hello ...\"。试一下。Eclipse 会保护你：弹出一个“Select Java Application”窗口，显示两个带有 `main`\
    \ 方法的类。你必须在运行程序之前选择一个。\n\n> 为了避免这个问题，删除 `HelloWorld` 中 `main` 方法的 Javadoc 注释和该方法本身，然后再次运行“Run\
    \ As->Java App”。弹出“Save and Run”向导，它保存了现在没有 `main` 方法的 `HelloWorld.java` 然后启动了\
    \ `HelloLauncher.java`。这正是我们希望的结果。\n\n## Questions\n\n所有这些问题都假设项目是一个打开并展开的项目。\n\
    \n- 打开已关闭的项目还有其他什么方法？\n- 为什么“File->Close”不会关闭已打开的项目？\n\n## 第 9 章：调试 HelloLauncher\n\
    \n### 什么是调试 (debugging)\n\n在程序中识别错误、定位错误原因并修复错误的过程。\n\n### 什么是断点 (breakpoint)？\n\
    \n源代码中某个位置的/或某些条件，调试器在该处临时暂停程序执行，以便开发者在继续执行程序之前检查变量值。\n\n### “Toggle breakpoint（切换断点）”意味着什么？\n\
    \n如果鼠标光标所在位置没有断点，则在该处开启断点；如果已存在开启的断点，则禁用该断点。\n\n### 练习 9-1：调试 HelloLauncher 项目\n\
    \n在 Project Explorer（项目资源）中，展开“HelloLauncher”并在编辑器中打开 `HelloLauncher.java`。在编辑器最左侧的栏上右键点击，对应\
    \ `main` 方法中 `System....` 语句的行。当下拉菜单出现时，点击“Toggle breakpoint”，侧栏上会出现一个顶部带有一个极小箭头的深色圆圈（表示断点已激活）。在同一位置右键点击。当下拉菜单出现时，点击“Toggle\
    \ breakpoint”，断点就会消失。设置断点后，右键点击它。当下拉菜单出现时，选择“Disable breakpoint（禁用断点）”，侧栏上会出现一个浅色圆圈。第三次，点击“Enable\
    \ breakpoint（启用断点）”，圆圈再次变为深色。\n\n在 Project Explorer 中，右键点击 `HelloLauncher` 项目。当下拉菜单出现时，选择“Debug\
    \ as ->Java Application”。当弹出“Confirm Perspective Switch（确认切换视图）”时，点击“Yes”（不要点击“Remember\
    \ my decision（记住我的决定）”旁边的复选框）。视图分组增加了第三种视图“Debug”，并变为当前视图。然后，Project Explorer\
    \ 的“main”区域被切换为 Debug 的“main”区域。\n\n下方显示一张图片。学习你新获得的信息。将鼠标悬停在所有调试按钮上。将鼠标悬停在“Console（控制台）”选项卡右侧的图标上。\n\
    \n![](img/00008.jpg)\n\n点击“Terminate debugging（终止调试）”按钮。你仍然处于“Debug”视图中。为了清理界面，右键点击“Debug”视图。当下拉菜单出现时，点击“Close”，然后点击“Java\
    \ EE”视图图标。在“Project Explorer”中关闭项目并休息一下。\n\n## Questions\n\n所有这些问题都假设项目是一个打开并展开的项目。\n\
    \n## 第 10 章：通过职责分离减少耦合（更多但更小的类）\n\n**警告：** 规则变了：如果你被教过如何做某事，你将得自己找到在哪里以及如何做。我只会教你如何做新事情。\n\
    \n### 什么是 @Override\n\n通知编译器你打算重写父类中的方法。如果编译器在其中一个父类中没有发现该方法，它将生成错误。注意：快速识别拼写错误或\
    \ API 变化。\n\n### 什么是耦合 (coupling)？\n\n代码元素之间接口的相对复杂度（代码元素之间的相对独立性）。“松耦合（loose\
    \ coupling）”描述简单或最小耦合（复杂度低）（良好的设计），而“紧耦合（tight coupling）”描述复杂或最大耦合（复杂度高）（坏设计）。它描述了模块的相对独立性（一件好事）。\n\
    \n### 什么是提供者 (provider)？\n\n提供其他类需要（通常是信息）的类或方法。替代：可交换工厂的工厂（实现抽象工厂模式）。减少耦合。\n\n\
    ### 什么是渲染器 (renderer)？\n\n将信息编码并解码为其他类或方法可以理解的格式的类或方法。减少耦合。\n\n### 什么是 SoR（职责分离\
    \ Separation of Responsibilities）？\n\n一个类应该：(1) 负责软件功能的单一部分；(2) 该责任应该完全由类封装。它所有的服务都应该与该职责紧密对齐。替代：每个类应该做极少数几件事并完全地完成它们。\n\
    \n### 什么是注解 (annotation)？\n\n元数据的形式，提供关于程序的信息，但这些信息不是程序本身的一部分（对被标记代码的运行没有直接影响）。(1)\
    \ 给编译器的信息（可以使用它们来检测错误或抑制警告），(2) 编译时部署时的处理（软件工具可以处理注解信息以生成代码、XML 文件等），(3) 运行时处理（可以在运行时进行检查）。注意：Java\
    \ 和 Android 注解以“at”字符 (@) 开头。\n\n### 练习 10-1：改进 Hello 分离（减少 Hello 耦合）（解耦 Hello）\n\
    \n将 `HelloLauncher` 复制到 `HelloSeparation`。（你把 `HelloSeparation` 设置为打开并展开的项目了吗？你关闭了\
    \ `HelloLauncher` 吗？）添加空类 `HelloMessageProvider` 和 `HelloMessageRenderer` 到项目。。（你把它们放在默认包了吗？你添加了\
    \ Javadoc 注释吗？这两个类都在编辑器器中打开了吗？如果没有，请打开它们。）在 `HelloMessageProvider` 中添加空行和以下方法：\n\
    \n```java\npublic String getMessage() {\n  return \"Hello from HelloSeparation!\"\
    ;\n}\n```\n\n在 Project Explorer 中，右键点击 `HelloMessageProvider.java`。当下拉菜单出现时，点击“Source->Format”。当\
    \ Eclipse 完成格式化后，保存并关闭。\n\n在 `HelloMessageRenderer` 中添加以下语句：\n\n```java\nprivate\
    \ HelloMessageProvider messageProvider = null;\npublic void render () {\n  if\
    \ (messageProvider == null) {\n    throw new RuntimeException (\"Set the property\
    \ messageProvider of class:\" + HelloMessageRenderer.class.getName());\n  }\n\
    \  System.out.println(messageProvider.getMessage());\n}\n```\n\n为 `HelloMessageRenderer`\
    \ 生成 setter 和 getter。\n\n在 Project Explorer 中，右键点击 `HelloMessageRenderer`。当下拉菜单出现时，点击“Source->Format”。当\
    \ Eclipse 完成格式化 `HelloMessageRenderer.java` 后，保存并关闭。\n\n将 `HelloLauncher.java`\
    \ 的 `main()` 体替换为：\n\n```java\nHelloMessageRenderer hmr =new HelloMessageRenderer\
    \ ();\nHelloMessageProvider hmp =new HelloMessageProvider ();\nhmr.setMessageProvider(hmp);\n\
    hmr.render();\n```\n\n在 Project Explorer 中，右键点击 `HelloLauncher`。当下拉菜单出现时，点击“Source->Format”。当\
    \ Eclipse 完成格式化 `HelloLauncher.java` 后，保存并关闭。\n\n运行 `HelloSeparation`。运行成功。然而，`HelloMessageRender`\
    \ 和 `HelloMessageProvider` 被硬编码在项目中（在 `HelloLauncher` 中）。更改消息将将困难。\n\n> 可能的误步骤\
    \ 10-1\n\n> `HelloWorld.java` 是否被项目 `HelloSeparation` 使用？不，它被 `HelloLauncher`、`HelloMessageProvider`\
    \ 和 `HelloRender` 替换了。\n\n从项目中删除 `HelloWorld.java`。运行 `HelloSeparation`。运行成功。整洁了一些。\n\
    \n### 练习 10-2：使用接口改进 Hello 分离\n\n"
- fmt: "\nCopy `HelloSeparation` to `HelloSeparationWithInterfaces`. (Did you close\
    \ `HelloSeparation`? Did you make `HelloSeparationWithInterfaces` an open expanded\
    \ project?) We are going to (eventually) be able to change the message by making\
    \ `HelloMessageProvider` and `HelloMessageRender` implement interfaces. But, that's\
    \ in the future.\n\nIn the `HelloSeparationWithInterfaces` project, right click\
    \ on `HelloMessageProvider.java`. When the dropdown appears, click on `\"Refactor->\
    \ Extract Interface\"`. When the `\"Extract Interface\"` popup appears, enter\
    \ the name `MessageProvider`, click on the checkbox next to `getMessage()` then\
    \ click on `\"OK\"`. BTW: Note the icon for an interface is a piece of paper with\
    \ a large `J` and a small `I` inside a ball at the right top of the paper. Open\
    \ `MessageProvider.java` and `HelloMessageProvider.java` in side-by-side Java\
    \ editors. Nothing to do here except change the message to `\"Hello from HelloSeparationWithInterfaces\
    \ and Eclipse\"` in `HelloMessageProvider.java` and save the file.\n\nRepeat by\
    \ extracting the interface from `HelloMessageRenderer.java`. Open `MessageRenderer.java`\
    \ and `HelloMessageRenderer.java` in side-by-side Java editors. Ignore the annotations\
    \ (the lines beginning with `@`)).\n\nRun `HelloSeparationWithInterfaces`. It\
    \ runs and displays an appropriate message.\n\n### Questions\n\nAll these questions\
    \ assume the project is an open expanded project.\n\n#### How can I add Javadoc\
    \ comments to new methods I add?\nEnter `/**` [ENTER] then enter `*/` [ENTER]\n\
    \n#### Why doesn't `\"Source->Generate Element Comment\"` add a comment to a method?\n\
    It should work but doesn't.\n\n## Chapter 11: Add a factory to improve Hello separation\n\
    \n#### What can be assigned to a class reference?\nNull or an object of the class\
    \ or an object of some child class of that class. No object of a parent class\
    \ can be assigned to the reference. Warning: The only thing the reference can\
    \ do is call methods in the original interface.\n\n#### What can be assigned to\
    \ an interface reference?\nNull or an object of some (already defined) class that\
    \ implements the interface or an object of some child class of that class or an\
    \ object of some class that implements a child of the interface. No object of\
    \ a class that implements a parent interface can be assigned to the reference.\
    \ Warning: The only thing the reference can do is call methods in the original\
    \ interface.\n\n#### What's a child class?\nAnother name for subclass.\n\n####\
    \ What's a factory (factory class)?\nClass or object that creates other classes\
    \ or objects, either by composition or extension.\n\n#### What's a parent class?\n\
    Another name for superclass.\n\n#### What's a reference?\nData element that has\
    \ a type and whose value is an address (on the heap) of an object of that type\
    \ or of a child type. Former C programmers might think of a reference as a pointer\
    \ with self-control.\n\n#### What's a class reference?\nReference to an object\
    \ that only knows about the characteristics and behaviors of the object's (already\
    \ existing) class or of some parent class.\n\n#### What's a child reference (child\
    \ class reference)?\nReference to an object of some (already defined) child class.\n\
    \n#### What's a parent reference (parent class reference)?\nReference to a parent\
    \ class (superclass). A parent class reference can be assigned to child class\
    \ object but it can only the parts of the object inherited from its parent class.\n\
    \n#### What's an interface reference?\nReference to an object that only knows\
    \ about the behaviors of some interface implemented by the object's class.\n\n\
    #### Why do I care about class references and interface references?\nThey can\
    \ reduce coupling and simplify coding.\n\n### Exercise 11-1: Improving Hello separation\
    \ by adding a factory\n\nCopy `HelloSeparationWithInterfaces` to `HelloSeparationWithInterfacesAndFactory`.\n\
    \nIn the `HelloSeparationWithInterfacesAndFactory` project, right click on `\"\
    (default package)\"`. When the dropdown appears, click on `\"New->Class\"`. Use\
    \ the name `MessageSupportFactory`. (Did you click on the checkbox next to `\"\
    Generate comments\"?) Insert the code below into the body of `MessageSupportFactory`.\n\
    \n```java\nprivate static MessageSupportFactory instance = null;\nprivate Properties\
    \ props = null;\nprivate MessageRenderer renderer = null;\nprivate MessageProvider\
    \ provider = null;\nprivate MessageSupportFactory() {\n    props = new Properties();\n\
    \    try {\n        props.load(new FileInputStream(\"msf.properties\"));\n   \
    \     // get the implementation classes\n        String rendererClass = props.getProperty(\"\
    renderer.class\");\n        String providerClass = props.getProperty(\"provider.class\"\
    );\n        renderer = (MessageRenderer) Class.forName(rendererClass).newInstance();\n\
    \        provider = (MessageProvider) Class.forName(providerClass).newInstance();\n\
    \    } catch (Exception ex) {\n        ex.printStackTrace();\n    }\n}\nstatic\
    \ {\n    instance = new MessageSupportFactory ();\n}\n```\n\nLots of errors. Click\
    \ on the ball with the red x to the right of the first use of `Properties`. When\
    \ help pops up, double click on `\"import 'Properties' (java.util)\"`. Most of\
    \ the errors go away when `\"import java.util.Properties\"` is inserted just below\
    \ the comment at the top of the editor window. Repeat at the ball with the red\
    \ x to the right of the first use of `FileInputStream`. Double click on import\
    \ `'FileInputStream'` (java.io). No more errors! Right click on the text `\"MessageSupportFactory\"\
    ` to the right of public class and reformat the class. Note the class assumes\
    \ we will create an msf.properties file to be read.\n\nRight click on `\"MessageSupportFactory\"\
    `. When the dropdown appears, click on `\"Source->Generate Getters and Setters\"\
    `. Select `instance`, `provider` then click on `\"OK\"`. We're not going to use\
    \ the setters so remove them.\n\nSave `MessageSupportFactory.java`. Double click\
    \ on `HelloLauncher.java`. Replace the body of `main` with the following code:\n\
    \n```java\nMessageRenderer mr = MessageSupportFactory.getInstance().getRenderer();\n\
    MessageProvider mp = MessageSupportFactory.getInstance().getProvider();\nmr.setMessageProvider(mp);\n\
    mr.render();\n```\n\nSave the changed file and close it. What does this code do?\
    \ `MessageSupportFactory` can make objects using `HelloMessageProvider` and `HelloMessageRenderer`\
    \ if that's what it finds in `msf.properties` and the code works as before. But,\
    \ it can also make any other classes that implement `MessageProvider` and `MessageRenderer`\
    \ if that's what it finds and the code may work different.\n\nDouble click on\
    \ `HelloMessageProvider.java`. Change the return message to `\"Hello from HelloSeparationWithInterfacesFactory\
    \ and Eclipse.\"`. Save it and close it.\n\nNow create `msf.properties` file.\
    \ Right click on `HelloSeparationWithInterfacesFactory`. When the dropdown appears,\
    \ click on `\"New->File\"`. Enter the file name `\"msf.properties\"` then click\
    \ on `\"Finish\"`. Enter the text below into the file. Save and close the file.\
    \ BTW: Where is the file in the project structure?\n\n```properties\n# msf.properties\n\
    renderer.class=HelloMessageRenderer\nprovider.class=HelloMessageProvider\n```\n\
    \nLast, edit the message in `HelloMessageProvider.java` so it says `\"Hello From\
    \ HelloSeparationWithInterfacesFactory\"`.\n\nRun `HelloSeparationWithInterfacesFactory`.\
    \ It runs and displays an appropriate message.\n\n### Exercise 11-2: Improving\
    \ Hello separation by adding a factory Part 2\n\nCopy `HelloSeparationWithInterfacesAndFactory`\
    \ to `HelloSeparationWithInterfacesAndFactory2`.\n\nIn the `HelloSeparationWithInterfacesAndFactory2`\
    \ project, right click on `HelloMessageProvider.java`, when the dropdown appears,\
    \ click on `\"Copy\"`. Right click on `\"default package\"`- and when the dropdown\
    \ appears, select `\"Paste\"`. Use the name `GoodbyeMessageProvider.java` for\
    \ the new class. Double click on it to bring it up in the editor window. Change\
    \ the string to `\"Goodbye from HelloSeparationWithInterfacesFactory and Eclipse.\"\
    `. Save and close it. Double click on `\"msf.properties\"` to bring it up in the\
    \ editor window. Change the line that begins with `provider` so it says\n\n`provider.class=GoodbyeMessageProvider`\n\
    \nSave and close it.\n"
  raw: 'Copy HelloSeparation to HelloSeparationWithInterfaces.  (Did you close HelloSeparation? 
    Did you make HelloSeparationWithInterfaces an open expanded project?)  We are
    going to (eventually) be able to change the message by making HelloMessageProvider
    and HelloMessageRender implement interfaces.  But, that''s in the future.


    In the HelloSeparationWithInterfaces project, right click on HelloMessageProvider.java. 
    When the dropdown appears, click on "Refactor-> Extract Interface".  When the
    "Extract Interface" popup appears, enter the name "MessageProvider", click on
    the checkbox next to getMessage ( ) then click on "OK".  BTW:  Note the icon for
    an interface is a piece of paper with a large J and a small I inside a ball at
    the right top of the paper.  Open "MessageProvider.java" and "HelloMessageProvider.java"
    in side-by-side Java editors.  Nothing to do here except change the message to
    "Hello from HelloSeparationWithInterfaces and Eclipse" in HelloMessageProvider.java
    and save the file.


    Repeat by extracting the interface from HelloMessageRenderer.java.  Open "MessageRenderer.java"
    and "HelloMessageRenderer.java" in side-by-side Java editors.   Ignore the annotations
    (the lines beginning with @)). 


    Run HelloSeparationWithInterfaces.  It runs and displays an appropriate message.


    Questions


    All these questions assume the project is an open expanded project.


    How can I add Javadoc comments to new methods I add?


    Enter /** [ENTER] then enter */[ENTER]


    Why doesn''t "Source->Generate Element Comment" add a comment to a method?


    It should work but doesn''t. 


    Chapter 11:  Add a factory to improve Hello separation


    What can be assigned to a class reference?


    Null or an object of the class or an object of some child class of that class. 
    No object of a parent class can be assigned to the reference.  Warning:  The only
    thing the reference can do is call methods in the original interface.


    What can be assigned to an interface reference?


    Null or an object of some (already defined) class that implements the interface
    or an object of some child class of that class or an object of some class that
    implements a child of the interface.  No object of a class that implements a parent
    interface can be assigned to the reference.  Warning:  The only thing the reference
    can do is call methods in the original interface.


    What''s a child class?


    Another name for subclass.


    What''s a factory (factory class)?


    Class or object that creates other classes or objects, either by composition or
    extension.


    What''s a parent class?


    Another name for superclass.


    What''s a reference?


    Data element that has a type and whose value is an address (on the heap) of an
    object of that type or of a child type.  Former C programmers might think of a
    reference as a pointer with self-control. 


    What''s a class reference?


    Reference to an object that only knows about the characteristics and behaviors
    of the object''s (already existing) class or of some parent class.


    What''s a child reference (child class reference)?


    Reference to an object of some (already defined) child class.


    What'' a parent reference (parent class reference)?


    Reference to a parent class (superclass).  A parent class reference can be assigned
    to child class object but it can only the parts of the object inherited from its
    parent class.


    What''s an interface reference?


    Reference to an object that only knows about the behaviors of some interface implemented
    by the object''s class.


    Why do I care about class references and interface references?


    They can reduce coupling and simplify coding.


    Exercise 11-1:  Improving Hello separation by adding a factory


    Copy HelloSeparationWithInterfaces to HelloSeparationWithInterfacesAndFactory.


    In the HelloSeparationWithInterfacesAndFactory project, right click on "(default
    package").  When the dropdown appears, click on "New->Class".  Use the name MessageSupportFactory. 
    (Did you click on the checkbox next to "Generate comments"?)  Insert the code
    below into the body of MessageSupportFactory.


    > `private static MessageSupportFactory instance = null;`


    > `private Properties props = null;`


    > `private MessageRenderer renderer = null;`


    > `private MessageProvider provider = null;`


    > `private MessageSupportFactory() {`


    > `props = new Properties();`


    > `try {`


    > `props.load(new FileInputStream("msf.properties"));`


    > `// get the implementation classes`


    > `String rendererClass = props.getProperty("renderer.class");`


    > `String providerClass = props.getProperty("provider.class");`


    > `renderer = (MessageRenderer) Class.forName(rendererClass).newInstance();`


    > `provider = (MessageProvider) Class.forName(providerClass).newInstance();`


    > `} catch (Exception ex) {`


    > `ex.printStackTrace();`


    > `}`


    > `}`


    > `static {`


    > `  instance = new MessageSupportFactory ();`


    > `}`


    Lots of errors.  Click on the ball with the red x to the right of the first use
    of Properties.  When help pops up, double click on "import ''Properties'' (java.util)". 
    Most of the errors go away when "import java.util.Properties" is inserted just
    below the comment at the top of the editor window.  Repeat at the ball with the
    red x to the right of the first use of FileInputStream.  Double click on import
    ''FileInputStream'' (java.io).  No more errors!  Right click on the text "MessageSupportFactory"
    to the right of public class and reformat the class. 


    Note the class assumes we will create an msf.properties file to be read.


    Right click on "MessageSupportFactory".  When the dropdown appears, click on "Source->Generate
    Getters and Setters".  Select instance, provider, renderer then click on "OK". 
    We''re not going to use the setters so remove them.


    Save and close MessageSupportFactory.java.  Double click on HelloLauncher.java. 
    Replace the body of main with the following code.


    > `MessageRenderer mr = MessageSupportFactory.getInstance().getRenderer();`


    > `MessageProvider mp = MessageSupportFactory.getInstance().getProvider();`


    > `mr.setMessageProvider(mp);`


    > `mr.render();`


    Save the changed file and close it.


    What does this code do?  MessageSupportFactory can make objects using HelloMessageProvider
    and HelloMessasgeRenderer if that''s what it finds in msf.properties and the code
    works as before.  But, it can also make any other classes that implement MessageProvider
    and MessageRenderer if that''s what is finds in in msf.properties and the code
    may work different. 


    Double click on HelloMessageProvider.java.  Change the return message to "Hello
    from HelloSeparationWithInterfacesAndFactory and Eclipse.".  Save it and close
    it.


    Now create msf.properties file.  Right click on the HelloSeparationWithInterfacesAndFactory. 
    When the dropdown appears, click on "New->File".  Enter the file name "msf.properties"
    then click on "Finish".  Enter the text below into the file.  Save and close the
    file.  BTW:  Where is the file in the project structure?


    > `# msf.properties`


    > `renderer.class=HelloMessageRenderer`


    > `provider.class=HelloMessageProvider`


    Last, edit the message in HelloMessageProvider.java so it says "Hello From HelloSeparationWithInterfacesAndFactory". 


    Run HelloSeparationWithInterfacesAndFactory.  It runs and displays an appropriate
    message.


    Exercise 11-2:  Improving Hello separation by adding a factory Part 2


    Copy HelloSeparationWithInterfacesAndFactory to HelloSeparationWithInterfacesAndFactory2


    In the HelloSeparationWithInterfacesAndFactory2 project, right click on HelloMessageProvider.java,
    when the dropdown appears, click on "Copy".  Right click on "default package"
