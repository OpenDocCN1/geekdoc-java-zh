    # 入门

    ## 第 0 章：入门

    ### 先决条件

    学生必须：

    - 具有 Java 经验。（如果你无法编写 `HelloWorld.java` 程序、编译并运行它，那么你就不具备成功完成这门课程的背景。）

    - 拥有一个 U 盘（4GB 或更大）并每节课都携带。


    ### 术语

    | 术语 |  |

    | :--- | :--- |

    | 点击 (Click) | 在屏幕对象上左点击。除非单词前面是右键，否则始终左键点击。 |

    | 高亮 (Highlight) | 鼠标从左向右移动以高亮。有时，点击选择区域任何位置即可高亮。 |

    | 悬停 (Mouse over) | 将鼠标移动到工具图标上方并暂停。应该弹出提示。 |

    | 右点击 (Right click (Right-click)) | 在屏幕对象上右点击。 |


    ### 字体

    在描述 Java 语法时使用以下术语。


    | 字体 | 说明 |

    | :--- | :--- |

    | Courier 正文文本 | 必选 |

    | Courier 粗体文本 | 默认 |

    | Courier 斜体 | 用户定义 |

    | `a\|b` | `a` 或 `b` |

    | `[ ]` | 可选项目 |

    | `{ }` | 必选项目 |

    | `…` | 项目列表 |

    | `+` | 可以重复 |


