    ![](images/00006.jpg)

    Right click on the `Project Explorer` main window (not on tab at the top). When
    the dropdown appears, click on `New->Project`. When the `Select a wizard` popup
    appears, select `Java->Java Project` then click on `Next`. When the `Create a
    Java Project` wizard appears, enter the project name (`Hello1`) click on the checkbox
    next to `Use default location`, and click on `Finish`.


    When the `Open Associated Perspective?` popup appears, click on `Yes`. (Don''t
    click on `Remember my decision`. Never change a default until you understand the
    implication of changing it!) Notice you now have two perspectives, `Java EE` and
    `Java`. (What is the current perspective? Which one is highlighted?)


    > **Possible misstep 7-2**

    > What happened to the toolbars when `Java` became the current perspective? What
    happened in the "Big picture region" when `Java` became the current perspective?
    Click on the `Java EE` icon to make `Java EE` the current perspective. Same questions.
    If you''re not seeing what you expect in the toolbars or in the big picture region,
    you may be in the wrong current perspective. BTW: What buttons appear in the `Java`
    perspective toolbars that are missing in the `Java EE` perspective toolbars?


    > **Possible misstep 7-3**

    > What happened in the "big picture" region? Bring back the `Project Explorer`
    tab in the "big picture" region by clicking on `Window->Show View->Project Explorer`.
    You should see both a `Package Explorer` tab and a `Project Explorer` tab in the
    "big picture" region.


    Using `File Manager`, go look in your workspace directory for the `Hello1` project
    (it should be there). In `File Manager`, expand the `Hello1` directory if it''s
    not open expanded. What folder and files do you see under the project name? Source
    folders named `.settings`, `bin` (maybe), and `src` as well as the `.classpath`
    and `.project` files.


    > **Possible misstep 7-4**

    > Why do you see strange icons instead of the file and directory names? These
    are "dot" files (they don''t have a name in front of the dot). "dot" files and
    folders are usually treated as invisible. BTW: In `File Manager`, go back to workspace
    directory. Double click on the "dot" file with the paper icon. Notepad or some
    other editor will bring up the `.log` file! You can see what errors eclipse has
    been writing to `.log` since you installed it.


    In `Project Explorer`, click on the `>` next to `Hello` project. Right click on
    `src` then, when the popup menu appears, click on `New->Class`. When the dropdown
    menu appears, click on `New->Class`. When the `Java Class` window appears, enter
    the name `Hello1World` then click on the `Finish` button.


    Still in `Project Explorer`, where is the `Hello1World.java` file located? What
    package is it in? (Eclipse created a default package since you didn''t enter one
    and placed the java file in that package.)


    ![](images/00012.jpg)

    **Exercise 7-2: Create a Hello project with a main and comments**


    Repeat Exercise 7-1 except use the project name `Hello`. Don''t forget to create
    java file `HelloWorld`. (Same name, different project! Sounds like scope, doesn''t
    it.) When the `Java Class` window appears, check the checkboxes next to `public
    static void main…` and `Generate comments`.


    **Exercise 7-3: Compare HelloWorld.java and Hello1World.java**


    In the `Project Explorer`, both `Hello1` and `Hello` should open projects. Make
    both projects open and expanded by clicking on the `>` icon. Drill down to the
    `HelloWorld` classes. Double click on `HelloWorld.java` and it appears in the
    `Editors` pane of the detail region. Double click on `Hello1World.java` and it
    appears in a second tab of the `Editors` pane. To see both at the same, click
    and hold the mouse on `Hello1World.java`''s tab, drag it to the left until a smaller
    pane appears, then release the mouse button. What differences do you see? `HelloWorld.java`
    has shells for Javadocs and a main method so the class can run stand-alone. `HelloWorld1.java`
    does not.


    ![](images/00004.jpg)

    **Possible Misstep 7-5**


    > On the left (not the far, far left) of the `Hello` project''s `HelloWorld.java`
    in the Java editor you''ll see dark circles with a `+` in the circle and/or light
    circles with a `-` in the circle next to the beginning of Javadoc comments and
    blocks (usually methods). The dark circles with `+` indicate code folding, the
    light circles with `-` indicate no code folding. Click on the light circle at
    the top of the file (the beginning of the class Javadoc). The circle becomes dark
    and only one line of the comment or the block. Do NOT think anything is lost.
    Click on a dark circle and it becomes a light circle and the entire comment or
    block appears.


    **Exercise 7-4: Close Hello and Hello1**


    In the `Project Explorer`, both `Hello` and `Hello1` should be open. (If not,
    open the one that is closed.) Right click on `Hello`. When the dropdown appears,
    click on `Close Project`.


    **Exercise 7-5: Delete Hello1 project**


    In the `Project Explorer`, right click on `Hello1`. When the dropdown appears,
    click on `Delete`. When the `Resources` popup appears, click on `OK`. Can''t be
    recovered (easily).


    **Exercise 7-6: Add a method call inside main**


    In the `Project Explorer`, make the `Hello` project an open project. Load `HelloWorld.java`
    into the Java editor. Notice the `TODO` comment inside `main`. Now, look in the
    `Outlines` pane. Find and highlight `//TODO` in `main()` then type `System.` (You
    need the dot!) Eclipse pops up the `System` document. Find and highlight `out`,
    press ENTER (or double click) and `out` is postpended to `System.`. Type another
    dot (.) after `System.out`. Eclipse pops up the `PrintStream` document. Find and
    highlight `println`, and press ENTER. Now you see `System.out.println();`. Type
    `"Hello from HelloWorld"` inside the parentheses (`System.out.println("Hello from
    HelloWorld");`). Now there are no error indicators.


    Right click on the main pane of the `HelloWorld.java` editor. When the dropdown
    menu appears, click on `save`. Close the `HelloWorld.java` tab.


    **Exercise 7-7: Run Hello project**


    In `Project Explorer`, right click on the `Hello` project. When the dropdown menu
    appears, click on `Run as -> Java application`. Note that a console opens in the
    "output" region and the string `"Hello World from Java and Eclipse"` appears in
    Console. Click on the `Problems` tab and note that no errors are listed.


    **Exercise 7-8: Why a Hello project warning?**


    In `Project Explorer`, if the `Hello` project is open, you may see a project warning
    icon (folder with a yellow triangle with an exclamation mark) between `>` and
    the project name. Drill down to the `HelloWorld.java` file then double click on
    it to open it in the Java editor. If you don''t see a `Problems` tab in the output
    region, click on `Window->Show View->Other…->General->Problems`. Now you see a
    "problems" tab in the output region. Click on the word "Problems" and read the
    warning description. If the message is "no JREs … strictly compatible", ignore
    the project warning.


    **Exercise 7-9: Close Hello project**


    In `Project Explorer`, right click on the `Hello` project. When the dropdown menu
    appears, click on `Close Project`. The icon for the project is now a closed folder.


    **Questions**


    All these questions assume the project is an open expanded project.


    What are two additional ways to create a new project? Hint: Click on `File`. Look
    at the dropdown then mouse over the toolbar icons.

    '
