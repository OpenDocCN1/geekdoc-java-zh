    importing a service or software module specified or "injected" by the caller. 
    There are three common forms of dependency injection: setter-, interface- and
    constructor-based injection, where the responsibility of injecting the dependency
    lies upon the client, the service or the constructor method respectively.  Spring
    uses DI extensively. 


