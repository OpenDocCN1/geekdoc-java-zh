- fmt: '

    I first saw a collection of more and more complex Hello programs that eventually
    emphasized Spring Framework in a PDF attributed to Rebecca Ong. Since, I have
    seen similar collections of Hello programs associated with other developers. The
    last exercise came from Oz Brown at Collin County Community College Continuing
    Ed.


    Most of my examples are slightly different since my goal is to teach Eclipse creation
    and editing, not to teach object-oriented programming. But, thanks to Rebecca
    and Oz.


    ## Where did these notes come from?


    These notes are the result of thirty years of programming and twenty years of
    web searches. Which means that some sections are not the latest and greatest.
    However, they describe ways of getting things done.


    (What can you expect from someone who started programming in `GW Basic` and wrote
    his first book in Windows Write 1.0?)


    ## Why isn''t this eBook copy protected?


    You will want to cut and paste from the book. I recommend you use `Calibre` to
    convert this book to `DOCX`. You can expand the images so you can see them better.


    BTW: If you want an Eclipse course taught at your company, send me an email at
    `JRHInLucas@Yahoo.com`.


    ## Chapter 1: Why Eclipse 4.5?


    ### What books should I read?


    A good short book is Lars Vogel''s Eclipse IDE ([http://www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B006O1J39S/ref=sr_1_3?s=books&ie=UTF8&qid=1457579814&sr=1-3&keywords=lars+vogel](http://www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B006O1J39S/ref=sr_1_3?s=books&ie=UTF8&qid=1457579814&sr=1-3&keywords=lars+vogel)).


    A good but very pricey book is Ram Kulkarni''s Java EE Development with Eclipse
    ([http://www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFNB40/ref=sr_1_13?s=books&ie=UTF8&qid=1457579962&sr-1-13&keywords=eclipse+computer](http://www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFNB40/ref=sr_1_13?s=books&ie=UTF8&qid=1457579962&sr-1-13&keywords=eclipse+computer)).


    A useful but complex book in the almost useless dead tree format is Kate Thompson''s
    Zero Bugs and Program Faster ([http://www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/0996193308/ref=sr_1_38?s=books&ie=UTF8&qid=1457580123&sr-1-38&keywords=eclipse+computer](http://www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/0996193308/ref=sr_1_38?s=books&ie=UTF8&qid=1457580123&sr-1-38&keywords=eclipse+computer)).
    Only recommended for experienced programmers with good eyes.


    ### Why use the Eclipse IDE?


    In 2014 (last year data was available), Eclipse (free) has 48% of the IDE market,
    `IntelliJ` (big bucks) has 33%, `NetBeans` (free) has 10%, and `Spring` (free,
    based on Eclipse) has 4%. Unless you want to develop both Java and Android applications
    using the same (well, similar) `IntelliJ` IDE, Eclipse is the tool of choice,
    especially at frugal companies. (Eclipse is free.)


    ### Why use Eclipse 4.5?


    It''s the second version on Eclipse based on `Java 8`. It''s solid and reliable.


    ## Chapter 2: Getting Started with Eclipse


    ### How is the Eclipse project managed?


    All work at Eclipse is done in sub-projects and components organized under top-level
    projects. Top-level projects are managed by `PMCs` (project management committees).


    ### What are the 4.x versions of Eclipse?


    | 4.2 | Juno | First Eclipse 4 |

    | :--- | :--- | :--- |

    | 4.3 | Kepler | Maven integration |

    | 4.4 | Luna | Java 8 integration |

    | 4.5 | Mars | Support for Java lambda expressions |

    | 4.6 | Neon | To be released in June, 2016. Prerelease versions available now.
    |


    ### What is a wizard?


    A fill-in-the-boxes windows that simplifies creating something. Eclipse is big
    on wizards.


    ### What is Eclipse?


    An open source community of software developers who are focused on building an
    open development platform with extensible frameworks, tools and runtimes that
    will build, deploy and manage software across the software lifecycle. Alternate:
    The Eclipse.


    ### What is Eclipse "Big Picture"?


    ```

    images/0001.jpg

    ```


    Alternate look shown below:


    ```

    images/0001.jpg

    ```


    ### What is Eclipseedia?


    [http://eclipse.org/Main_Page](http://eclipse.org/Main_Page)


    ### What is open source?


    The term open source makes code available for others.


    ### What is the difference between Eclipse 3 and 4?


    Eclipse 3 is 7.1. Eclipse 4 is 8.


    ### What is Eclipse architecture?


    ```

    images/0001.jpg

    ```


    ### What is Eclipse platform?


    The extensible IDE developed by the platform.


    ### What is Eclipse workbench?


    The term used for the generic UI.


    Wait, the Eclipse `wiki.eclipse.org/Main_Page`:


    [http://wiki.eclipse.org/Main_Page](http://wiki.eclipse.org/Main_Page)


    [wiki.eclipse.org/Main_Page](http://wiki.eclipse.org/Main_Page)


    Wait, the 3.1.


    Alternate look shown below:


    ```

    images/0001.jpg

    ```


    ### What is Wiki?


    A website that uses the engine.


    ### When did Eclipse integrate 7?


    Eclipse 7.1.


    ### When did Eclipse integrate 8?


    Eclipse 4.4.


    ## Chapter 3: Installing Eclipse 4 Java


    ### Do I have a `JAVA_HOME` environment variable?


    Right-click on `Start->System`. When the System window appears, click on `Advanced
    system settings`. When the `System Properties` popup appears, click on `Environment
    Variables`. When the `Environment Variables` pops up, scroll down `System Variables`.
    If you don''t see `JAVA_HOME`, click on `New` and fill in the `New System Variable`
    form. The variable value should be the location of your `jdk`. Click on all the
    `OK` buttons to save and return to System window. Click on the `x` in the upper
    right corner to close.


    ### What version of Java do I have?


    Right-click on the Start icon and select Command Prompt (Admin). When the `cmd`
    window pops up, type:


    ```

    java -version

    ```


    It should show some version of build 1.8 and some version of SE Runtime Environment.
    If not, download the `jdk` from [http://www.oracle.com/technetwork/java/downloads/index.html](http://www.oracle.com/technetwork/java/downloads/index.html)).


    ### How do I start eclipse using some predetermined workspace?

