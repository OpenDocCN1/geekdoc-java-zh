    编辑器视图、大纲视图位于输出视图之上（可以移动）。警告：有很多标签页，且每个透视图（perspective）都有它们自己的输入和输出视图。你可以随意移动它们。但是，在你不搞清楚每个部分是什么之前，最好让一切保持在默认位置。


    这些只是启动时的视图。你可以随意移动它们。但是，在你不搞清楚每个部分是什么之前，最好让一切保持在默认位置。


    ![](img/00005.jpg)


    ## 项目资源管理器视图（Project Explorer view）和包管理器视图（Package Explorer view）之间有什么区别？


    `Project Explorer` 是工作台（Workbench）中构件的分级视图（由你工作台的特定配置进行定制）。它可以用于许多语言和项目类型。额外的插件为
    `Project Explorer` 视图提供了“额外信息”，使其变得更加“复杂”。例如，当 `Project Explorer` 中安装了 `JDT`（Java
    开发者工具）插件时，当 `Project Explorer` 用于 Java 项目时，`Package Explorer`（`JDT` 的）中的许多功能就会出现在
    `Project Explorer` 中。


    ## 什么是大纲视图（outline view）？


    在 Java 和 Java EE 透视图中，大纲和任务区域中的大纲标签显示当前选中的类。它在这些透视图中始终可见的。


    ## 什么是问题视图（problem view / problem 标签页）？


    在 Java 和 Java EE 透视图中，输出区域的 `problem tab` 显示错误和警告。你通常需要通过点击 `Window->Show View->Other->General->Problems`
    来调出 `problem view`（问题视图）。


    ## 我可以在哪里找到关于 IDE 中使用的图标的信息？


    对于 Mars 版本，请查看 [`help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm`](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm)。对于
    Luna 版本，请查看 [`help.eclipse.org/luna/index.jsp?topic=/org.eclipse.jdt.doc.user/reference/ref-icons.htm`](http://help.eclipse.org/luna/index.jsp?topic=/org.eclipse.jdt.doc.user/reference/ref-icons.htm)。


    ## 我在哪里可以找到 Eclipse 的在线帮助？


    尝试 [`help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm`](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm)。


    ## 我在哪里可以找到 eclipse 错误日志？


    查看 `.metadata` 文件夹。


    ## 使用 Eclipse 创建基础 Java 应用


    ### 第 7 章：使用 Eclipse IDE 创建、构建和运行 HelloWorld


    #### 启动 Eclipse


    当你启动 Eclipse 时，`Welcome`（欢迎）标签页不应该出现（你在安装期间关闭了它）。如果出现了，请将其关闭。点击 `File`（文件）。当菜单出现时，点击
    `Switch Workspace`（切换工作空间）并选择你的 Hello 工作空间（我使用的是 `C:\MyCode\workspace-mars-hello`）。


    ## 错误图标是什么样子的？


    在 Java 编辑器视图的左侧有一个带有“!”的红色三角形圆圈。三角形位于右下角 ![](img/00016.jpg) (可快速修复的错误) 或 ![](img/00015.jpg)
    (更复杂的错误)。


    ## 警告图标是什么样子的？


    在 Java 编辑器视图的左侧有一个带有“!”的黄色三角形圆圈。三角形位于右下角 ![](img/00020.jpg) (可快速修复的警告) 或 ![](img/00002.jpg)
    (更复杂的警告)。


    ## 什么是折叠编辑器（folding editor）？


    允许用户隐藏和显示文本块——通常是有命名的。通常这样做是为了让用户能够更好地构想文档或程序的的整体结构。


    ## 什么是警告（warning）？


    在构建期间发送给用户的消息，用于警告某些不寻（通常是异常）的情况，但这些情况还不足以抛出异常并终止执行。程序将运行，但可能不会产生想要的结果。


    ## 什么是错误（error）？


    在构建期间发送给用户的消息，警告某些错误条件，这些条件严重到足以抛出异常并终止执行，可能严重到足以阻止执行。另一种情况是运行时环境内部错误或资源问题，导致应用程序无法继续。在程序运行之前必须修复。


    ## 什么是执行环境 JRE？


    目标（目标）计算机上允许的最旧 JRE 运行时环境。只要构建过程知道最旧允许的 JRE 是什么，构建应用时使用的 JRE 版本可以比运行时版本新。


    ## 什么是 CDC-1 执行环境？什么是 JRE1-1 执行环境？什么是 OSGi/Minimum 执行环境？


    与 Java 1.0、1.1 或（有时）1.2 兼容的目标。仅具有好奇价值。


    ## 什么是 J2SE-1.x 环境？


    与 J2SE 1.1、……或 1.5 兼容的目标。主要具有好奇价值。


    ## 什么是 JavaSE-1.x 环境？


    J2SE 1.6、1.7 或 1.8 执行环境。


    ## 什么是代码折叠（code folding）？


    编辑器压缩和展开代码、标记和注释的能力。


    ## 什么是“下钻（drill down）”？


    在反转结构中（如文件系统），点击一系列节点以进入某个地方。例如，点击 `C:` 驱动器查看根目录，然后点击 `Windows` 查看目录。


    ## 什么是 Javadoc？


    解析 `.java` 文件中的声明和注释并生成描述类、接口、构造函数、方法和字段的 HTML 页面的工具。


    ## 如何识别 Javadoc 注释？


    以 `/**` 开头，有多行，并以 `*/` 结尾。（与以 `/*` 和 `*/` 结尾的 C 注不同）。


    ## 我如何查看 Javadoc？


    打开 Javadoc 视图。（点击 `Window`。当菜单出现时，点击 `Show View->Java->Javadoc`。输出区域会出现 Javadoc
    标签页。）


    ## 什么是作用域（scope）？


    描述类型安全使用的区域的特征。类作用域、局部作用域和模块作用域。


    ## 关闭的项目、打开的项目和展开的项目之间有什么区别？


    在 `Project Explorer` 中，关闭的项目是带有闭合文件夹图标和项目名称的单行；打开的项目是带有 `>` 图标、打开文件夹图标和项目名称的单行；展开的项目是多行的，带有向下的箭头图标、打开文件夹图标（第一行是项目名称，下方列出了项目下的资源）。


    ## 如何将关闭的项目变为打开的项目？


    双击闭合文件夹图标。


    ## 如何将打开的项目变为展开的项目？


    双击打开的文件夹图标。或者，只需点击 `>` 图标。总之，通常情况下点击 `>` 意味着“显示下一层”。


    ## 如何将打开或展开的项目变为关闭的项目？


    右键点击项目名称。当下拉菜单出现时，点击 `Close Project`（关闭项目）。


    ## 项目资源管理器（Project Explorer）和包管理器（Package Explorer）之间有什么区别？


    `Project Explorer` 显示所有项目。`Package Explorer` 显示单个项目。


    #### 练习 7-1：创建一个 Hello1 项目


    你在“大图”区域的 `Project Explorer` 标签中创建项目。


    > 可能的操作 7-1


    > 右键点击 `Project Explorer` 主窗口顶部的标签。弹出一个带有“close”项目的菜单。点击“close”。发生了什么？总之：你可以通过右键点击最右侧的“Java
    EE”图标并选择“reset”来回到默认的 IDE 区域和格式。


