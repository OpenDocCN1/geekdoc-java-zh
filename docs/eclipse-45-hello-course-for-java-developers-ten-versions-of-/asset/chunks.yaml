    a red squiggle underneath".  When the on-help pops up, double click on the highlighted
    "import ''BeanFactory'' …" line. Note the import statement added to the top of 
    HelloLauncher.java.  Yes, there''s still a problem with getBeanFactory() - it
    doesn''t exist yet.  Paste the method below into HelloLauncher.java  below main().


