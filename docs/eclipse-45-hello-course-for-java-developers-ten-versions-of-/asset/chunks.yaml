    一种将项目中的一个或多个资源转换为项目中的另一种资源（称为 `build`）的工具。所有的 Eclipse `builders` 都是增量式的——在全量构建（有时称为
    "build all"）之后，`builder` 只构建自上次构建以来更改的内容（有时称为 "rebuild"）。`builder` 始终与项目相关。


    ### 什么是全量构建 (full build)？

    对项目中的所有资源进行构建。


    ### 什么是自动构建 (autobuild)？

    由于以下原因触发的增量构建：(1) 资源发生了变化 (2) 启用了自动构建功能。注意：除非你正在进行特殊操作，否则 `autobuild` 应该是开启的！


    ### 什么是增量构建 (incremental build)？

    从上次构建的结果开始的部分构建，仅修改更改的内容。速度更快！


    ### 什么是包 (bundle)？

    一种用于分组、交付和管理内容的机制。将 `bundles` 视为 Eclipse 中组件的实现。在 Eclipse 中，`bundles` 和 `plug-ins`（插件）之间没有区别。注意：每个
    `bundle` 都有自己的 `classloader` 和自己的 `manifest.mf` 文件。


    ### 什么是切面 (facet)？

    `facet` 是可以添加到项目中的功能单元。`Java` 是一个 `facet`。（也是一个 `feature`，以及其他许多东西。）


    ### 什么是功能 (feature)？

    相关 `plug-ins` 的组。（例如，`JDT` 就是一个 `feature`。）


    ### 什么是文件 (file)？

    与 Eclipse 工作空间中的项目或项目中的 `folder` 关联的虚拟（或实际）`file`。


    ### 什么是文件夹 (folder)？

    与 Eclipse 工作空间中的项目关联的虚拟（或实际）`directory`（目录）。`Folders` 是分层存储项目资源的有用工具。


    ### 什么是视图 (perspective)？

    共享共同的 `editors`（编辑器）和 `views`（视图）集合。


    ### 什么是当前视图？

    工具栏最右侧高亮的 `perspective`。当前的 `perspective` 控制主 `Window`（窗口）的显示外观。


    ### 什么是插件 (plug-in)？

    Eclipse 平台的基础构建块。`JDT` 是 `plug-ins` 的集合。


    ### 什么是项目 (project)？

    将资源分组为可构建、可重用单元的容器。


    ### 什么是资源 (resource)？

    `project`、`folder` 或 `file`。`Projects` 可以包含 `folders` 和/或 `files`。`Folders` 可以包含
    `files`。


    ### 什么是标签 (tag)？

    放置在代码中的标记（特殊文本），指示稍后在 `tag` 所在位置的工作。Eclipse `tags` 可以在 `Task` 标签页（`Task` ）找到。


    ### 什么是任务列表 (task list)？

    与错误跟踪器关联的 `tasks` 列表。


    ### 什么是任务视图 (task view) (标签视图 tag view)？

    源文件中需要被代码替换的 `tags` 列表。


    ### 什么是视图 (view)？

    一个带有 Eclipse `resource` 图形化显示的窗口。Eclipse 不区分 `view` 与显示它的 `perspective`。


    ### 什么是编辑器 (editor)？

    `resource` 的一个可编辑 `view`。它为操作由 `resource` 表示的数据提供了定制的化行为。不同的 `editors` 与不同类型的
    `files` 关联。当你通过在其中一个导航视图中双击 `file` 来进行编辑时，`Workbench` 会 `Workbench` 中打开关联的 `editor`。如果
    `resource` 没有关联的 `editor`，`Workbench` 会尝试在 `Workbench` 外部启动适当外部 `editor`。


    ### 什么是“内置的” (baked-in)？

    内置（由 eclipse 开发，而非第三方开发）的委婉说法。


    ### 什么是 JDT (Java 开发工具)？

    `JDT` 是让 Eclipse Java IDE 不同于 Eclipse C/C++ IDE 或……顺便说一下：`JDT` 是一个 `feature`，而不是
    `plug-in`。尽管许多开发者误用了 `feature` 这个术语。


    ### 什么是构建路径 (build path)？

    指定完成项目所需的所有依赖项。`Code` 和其他资源（在源文件夹中）、关联的 `jars` 和 `classes` 文件夹，以及项目引用（需要）的 `classes`
    和 `libraries`（库）。


    # 第 5 章：Eclipse 4 文件系统


    ### Eclipse 平台如何组织信息？Eclipse 工作区如何组织信息？

    `workbench` 通过 `workspace`（工作空间）然后该 `workspace` 中的 `project` 来组织信息。当 Eclipse `workbench`
    启动时，如果用户没有选择默认 `workspace`，它会要求用户选择一个 `workspace`。Eclipse 将该 `workspace` 中的所有
    `projects` 加载到 `Project Explorer`（项目资源管理器）。


    ### 工作目录里有什么？

    | `.metadata` | 在此处查找错误日志！ |

    | :--- | :--- |

    | `.recommenders` | `JSON` 文件。 |

    | `RemoteSystemsTempFiles` | 由 eclipse 的远程系统管理器创建。忽略即可。 |

    | `Various project directories` | 你的项目。 |


    ### 项目目录里有什么？

    | `.settings` 目录 | 项目特有的设置 |

    | :--- | :--- |

    | `bin` | eclipse 创建的二进制文件。 |

    | `src` 目录 | 项目特定的资源 |

    | `target` 目录 | 从资源创建的文件 |

    | `.classpath` 文件 | maven 创建的可选 xml 文件 |

    | `.project` 文件 | maven 创建的可选 xml 文件 |

    | `pom` 文件 | maven 创建的可选 xml 文件 |


    ### .metadata 文件夹里有什么？

    `.metadata` 文件夹包含工作空间特定的配置。


    ### .metadata 文件夹里有什么？

    `.metadata` 文件夹包含工作空间特定的配置。


    # 第 6 章：Eclipse 4


    ### Java IDE 看起来不同吗？

    当你首次启动时，`perspective` 会为 `Project Explorer` 添加新选项。例如，添加 Java 视图会将 `Package Explorer`（包管理器）添加到大图区域。


    ### 这三个区域是什么？

    Java 和 EE IDE 具有相同的三个区域：(1) 顶部的 `Menus and toolbar region`（菜单和工具栏区域），(2) `Main
    region`（主区域，左侧是大图区域，右侧是详情区域）以及 (3) 底部的 `Current status region`（当前状态区域）。


