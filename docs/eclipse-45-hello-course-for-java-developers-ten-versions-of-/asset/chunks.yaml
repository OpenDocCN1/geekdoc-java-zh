    在 Java 编辑器中打开 `HelloWorld.java` 有两种方法？


    还有什么其他方法可以关闭 Java 编辑器？


    还有什么其他方法可以保存修改后的 `HelloWorld.java` 文件？


    还有什么其他方法可以运行 `Hello` 项目？


    还有什么其他方法可以关闭 `Hello` 项目？


    当你看到带有三个点的菜单项时，它意味着什么？


    Eclipse 从哪里获取了 `@author` 标签的文本？


    # 第 8 章：从 Hello 项目创建一个新项目


    从零开始创建一个新项目需要大量的点击和操作。如果你有一个相似的项目，那么复制该项目通常比创建一个新项目简单得多。Eclipse 拥有一个重构工具，可以简化对现有程序副本的修改。


    ### 什么是全限定名？


    带有其路径（相对于工作空间）的对象的名称。


    ### 什么是重构？


    对软件进行持续的重新设计以提高其对变化的响应能力。也指 IDE 中用于简化重新设计的软件工具。


    ### 什么是启动器模式（设计模式）？


    使用带有 `main` 方法的类来启动应用程序的设计模式。通常应用程序中的其他类没有 `main` 方法，以防止它们被误用。


    ### 什么是启动器（launcher）？


    带有 `main` 方法且几乎没有其他内容的类。它所做的就是启动应用程序。


    ## 练习 8-1：复制 Hello 项目并将其命名为 HelloArgs


    #### 可能的误操作 8-1


    > 关闭 `Hello` 项目，然后在该项目上点击右键。当下拉菜单出现时，点击“复制”。在项目资源器的空白处点击右键。当下拉菜单出现时，点击“粘贴”。哎，出现了一个关于“无法复制剪贴板……”的错误。哪里出错了？当项目被关闭时，所有的复制操作只是复制项目的全限定名（在此情况下为
    `/Hello`）。要复制项目（对象），它必须处于打开状态。


    如果 `Hello` 已关闭，请在项目资源管理器主窗口中对其点击右键。当下拉菜单出现时，点击“打开项目”（或双击 `Hello`）。在项目资源管理器主窗口中对
    `Hello` 项目点击右键。当下拉菜单出现时，点击“复制”。在项目下方的空白区域点击右键。当下拉菜单出现时，点击“粘贴”。当“复制项目”弹出窗口出现时，输入项目名称“HelloArgs”，然后点击“完成”。


    #### 可能的误操作 8-2


    > 如果你正在运行与另一个已打开项目相似的项目，很容易不小心修改了错误的项目。通过对你想要操作的项目点击右键来避免这个问题。当下拉菜单出现时，点击“关闭无关项目”。当“关闭无关项目”弹出窗口出现时，点击“确定”。


    点击 `HelloArgs` 前面的 `>` 图标以展开项目。层层找到 `HelloWorld.java`，然后对其点击右键。当下拉菜单出现时，点击“重构->重命名”。当“重命名编译单元”弹出窗口出现时，输入新名称“HelloWorldArgs”，勾选“更新文本……”旁边的复选框，然后点击“完成”按钮。（如果弹出“重命名编译单元”向导并警告你该类具有
    `main` 方法，请忽略该警告并再次点击“完成”。）文件名和类名已更改，文件内部也已进行了相应的更改。双击 `HelloWorldArgs.java` 使其在
    Java 编辑器中显示。将文本“Hello from …”替换为 `args[0]`，然后保存文件。


    如何添加命令行参数？右键点击项目。当下拉菜单出现时，点击“运行方式……->运行配置……”。当“创建、管理和运行配置”向导弹出时，双击“Java ”。当右侧窗口变化时，输入主类名“HelloWorldArgs”，点击“参数”标签页。当该标签被激活时，在“程序参数”窗口中输入“Hello
    from HelloArgs and Eclipse”，然后点击“运行”按钮。“创建……”向导运行，消息“Hello from HelloArgs and
    Eclipse”出现在输出窗口的“控制台”标签页。


    ## 练习 8-2：将 Hello 项目复制为 HelloLauncher


    如果 `HelloArgs` 项目仍打开，请关闭它。打开并复制 `Hello` 项目，将其粘贴到项目资源器的主面板，并将其命名为 `HelloLauncher`。右键点击
    `HelloLauncher`。当下拉菜单出现时，点击“关闭无关项目”（这仅在项目资源管理器中有两个或更多项目时出现）。将 `HelloLauncher`
    变为展开状态的项目，并向下查找资源文件夹 `src`，直到找到“default package”。对“default package”点击右键。当下拉菜单出现时，点击“新建->类”。当“新建
    Java 类”向导出现时，输入名称“HelloLauncher”。不要忘记点击“…main…”和“生成 …”旁边的标签。点击“完成”。当 `HelloLauncher.java`
    在 Java 编辑器中出现时，将 TODO 注释替换为语句：


    ```java

    HelloWorld h = new HelloWorld ("Hello from HelloLauncher and Eclipse");

    ```


    语句的最左侧会出现一个错误图标（确切地说，是一个可以快速修复的错误消息）。当你点击错误图标时，会弹出快速修复（Quick Fix）建议。如果 `Hello`
    已关闭，请在项目资源管理器主窗口中对其点击右键。当下拉菜单出现时，点击“打开项目”（或双击 `Hello`）。在项目资源管理器主窗口中对 `Hello` 项目点击右键。当下拉菜单出现时，点击“复制”。在项目下方的空白区域点击右键。当下拉菜单出现时，点击“粘贴”。当“复制项目”弹出窗口出现时，输入项目名称“HelloArgs”，然后点击“完成”。


    语句的最左侧会出现一个错误图标（确切地说，是一个可以快速修复的错误消息）。当你点击错误图标时，会弹出快速修复（Quick Fix）建议。如果 `Hello`
