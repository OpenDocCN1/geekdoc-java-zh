    Chapter 6:  Eclipse 4 IDE


    Warning:  The images are from my Windows 10 development box.


    Does the Java EE IDE look different from the Java IDE?


    Yes.  When you first start the IDE, the title bar of the Java EE IDE says "Java
    EE Eclipse" while the Java IDE says "Java IDE".  The tab below the menu bar on
    the Java EE IDE says "Project Explorer" while the Java IDE says "Package Explorer". 
    The Perspective panel to the far left of the toolbar in Java EE IDE says "Java
    EE" while the Java IDE says "Java".  And, the panel at the bottom of the IDE shows
    different choices. Warning:  This is the last reference I’ll make to the Java
    IDE.  Everything below relates to the Java EE IDE.


    What are the three  regions in the IDE?


    Both the Java and Java EE IDEs have the same three regions: (1) "Menus and the
    toolbar region" at the top of the IDE, (2)"Main region" ("Big picture region"
    on the left below the menus and toolbar and "Detail region" on right below the
    menus and toolbars) and (3) "Current status region" at the bottom.  Most of your
    work is in the Main region; some of it is done in the Menus and toolbar region;
    almost none of it is in the Current status region.


    ![](images/00019.jpg)


    What''s in the "Menus and tool bar region"?


    Mostly self-explanatory to a developer who''s used other Windows IDEs:   just
    run the mouse over them.  (Warning:   you may have to click on a tool and wait
    a few seconds before the hints are visible.  You may also have to click on a nearby
    empty space to close a menu or a tooltip.)  However, the area to the right of
    the last dashed vertical line has some unusual things. 


    What does "Open perspective" (the grid box to the right of the last dotted vertical
    bar) on the tool bar do?


    Pops up the "Open Perspective" window so you can add a perspective (and its tools)
    to the current project.  For example, adding the Java perspective adds new options
    to the Project Explorer.  (It will also add the Package Explorer" to the "big
    picture" region.


    What does "Quick Access" box (the text box to the right of the last dotted vertical
    bar) on tool bar do?


    You can directly run searches from the box.  (The box is near the far right on
    the tool bar.)


    What''s in the "Main region" (everything between the tool bar region and the current
    status region)?


    The big picture view and the detail view.


    What''s the "Big-picture region" (Big-picture view) (Big-picture pane) (Big-picture
    window)?


    After installation (can be moved), the smaller window on the left side of the
    "Main region" below the buttons and above the bottom margin.  The project and
    package explore appear as tabs in this view.


    What''s the "Detail region" (Detail view) (Detail pane) (Detail view)?


    After installation (can be moved), the large window on the right side of the main
    pane below the buttons and above the bottom margin.


