    known as SpringSource [(http://www.springsource.org](file:///C:%5CUsers%5CJohnR_000%5CDocuments%5CMy%20Documents%5CMy%20Programming%20Notes%5CEclipse%5Cword%20eclipse%204%5C(http:%5Cwww.springsource.org)).


