    Chapter 8: Create a new project from the Hello project


    Creating a new project from scratch requires a lot of points and clicks.  If you
    have a similar project, it is often easier to copy that project than to create
    a new one.  Eclipse has a refactoring tool that simplifies modifying a copy of
    an existing program.


    What is a fully qualified name?


    The name of an object with its path (relative to the workspace).


    What is refactoring?


    The ongoing redesign of software to improve its responsiveness to change.  Also
    describes a software tool in an IDE which simplifies redesign. 


    What is the launcher pattern (design pattern)?


    Design pattern that uses a class with a main to start an application.  Usually
    the other classes in the application do not have mains, preventing them from being
    misused.


    What''s a launcher?


    Class with a main method and little else.  All it does is launch the application. 


    Exercise 8-1:  Make a copy of the Hello project and name it HelloArgs


    Possible Misstep 8-1


    > Close the Hello project then right click on the project.  When the dropdown
    menu appears, click on "Copy".  Right click on a blank part of the Project Explorer. 
    When the dropdown menu appears, click on "Paste".  Oops.  Error about "can''t
    copy the clipboard …".  What went wrong?  When a project is closed, all copy does
    is copy the fully qualified name of the project (in this case, "/Hello").  To
    copy the project (the object), it must be open.


    If Hello is closed, right click on it in the Project Explorer main window.  When
    the dropdown appears, click on "Open Project" (or, double click on Hello).  Right
    click on the Hello project in the Project Explorer main window.  When the dropdown
    menu appears, click on "Copy".  Right click on a blank region below the project. 
    When the dropdown appears, click on "Paste".  When the "Copy Project" popup appears,
    enter the project name "HelloArgs" then click on "Finish".


    Possible Misstep 8-2


    > If you are working in a project that is similar to another open project, it
    is easy to accidently make changes to the wrong project.  Avoid this problem by
    right clicking on the project you want to work on.  When the dropdown appears,
    click on "Close Unrelated Projects".  When the "Close Unrelated Projects" popup
    appears, click on "OK".


    Click on the ">" icon in front of HelloArgs to expand the project.  Drill down
    to HelloWorld.java, then right click on it.  When the dropdown appears, click
    on "Refactor->Rename".  When the "Rename Compilation Unit" popup appears, enter
    the new name "HelloWorldArgs", click on the check box next to "Update textual
    …" then click on the "Finish" button.   (If the "Rename Compilation Unit" wizard
    popups up and warns you that the class has a main method, ignore the warning and
    click on "Finish" again.)  The name of file and the class is changed and appropriate
    changes have been made inside the file.  Double click on HelloWorldArgs.java to
    show it in the Java editor.  Replace the text "Hello from …" with args[0], then
    save the file. 


    How do you add command line arguments?  Right click on project.  When the dropdown
    appears, click on "Run As …->Run Configurations …".   When the "Create, manage,
    and run configurations" wizard pops up, double click on "Java Application".  When
    the right windows changes, enter the Main class name "HelloWorldArgs", click on
    the "Arguments" tab.  When the tab is highlighted, enter "Hello from HelloArgs
    and Eclipse" in the "Program arguments" window and click on the "Run" button. 
    The "Create …" wizard runs and the message "Hello from HelloArgs and Eclipse"
    appears in the "Console" tab in the output window. 


    Exercise 8-2:  Make a copy of the Hello project into HelloLauncher


    Close the project HelloArgs if it''s still open.  Open and copy the Hello project,
    paste it into the Project Explorer main pane, and name it HelloLauncher.  Right
    click on HelloLauncher.  When the dropdown appears, click on "Close Unrelated
    Projects".  (This only appears if you have two or more projects in Project Explorer.) 
    Make HelloLauncher an expanded project and drill down the resource folder src
    until you find "default package".  Right click on "default package".  When the
    dropdown appears, click on "New->Class".  When the "New Java Class" wizard appears,
    enter the name "HelloLauncher".  Don''t forget to click next to the labels "…main…"
    and "Generate …".  Click on "Finish".  When HelloLauncher.java" appears in a Java
    editor, replace the TODO comment with the statement


    > `HelloWorld h = new HelloWorld ("Hello from HelloLauncher and Eclipse");`


    An error icon (to be exact, a quick fixable error message) appears to the far
    left of the statement.  When you click on the error icon, Quick Fix advice pops
    up.  BTW:  The thin red line in the scrollbar to the right of the statement is
    also an error message.  In large files, clicking on the thin red line will take
    you directly to the error statement.  Also, you can estimate the number of errors
    in the file by counting the number of thin red lines.  However, clicking the thin
    red line does not popup Quick Fix. 


    In this case, the Quick Fix is only partially helpful.  The problem is that HelloWorld
    doesn''t have a constructor that takes a string as an argument so you will have
    to modify HelloWorld.java.  Save HelloLauncher.java. 


    Open the HelloWorld.java editor window. 


    Add the data member


    `private String message;`


    inside the class and above the Javadoc comment for "main".  BTW:  Notice what
    just happened in the Outline tab in the detail and task region.   If the statement
    is not formatted correctly, right click on the line.  When the dropdown appears,
    click on "Source->Format element".  Note the change. 


    Right click on the line below the data member.  When the dropdown appears, click
    on "Source->Generate Getters and Setters".  When the "Generate getters and setters"
    wizard appears, click on the checkboxes for "message" and "Generate method comments",
    then click on the "OK" button.  Note the changes in the source and in the Outline
    tab. 


    Right click on the line above the Javadoc comment for "main".  When the dropdown
    appears, click on "Source->Generate constructor using fields".  Note the constructor
    created.


    Last, highlight the body of main and delete it. 


    Save HelloWorld.java then reopen the HelloLauncher.java editor.  If you still
    the red error, you may need to refresh the editor by saving the file again.  Now,
    you should not see an error.  But you do have a quick fixable warning icon (the
    yellow triangle with an "!" inside) on the far left of the edit window.  Mouse
    over it to see the message.  Oh, yeah, h is created but never used.  Insert this
    statement just below the statement creating h: 


    `System.out.println ( h.getMessage() );`


    The warning icon goes away because h is now used in the println method!  (If you
    still see the warning, save the file and the warning will go away.)  Select the
    entire main method, right click on it.  When the dropdown appears, format the
    method. 


    Right click on the project.  When the dropdown appears, click on "Run as->Java
    Application".  The "Select Java Application" popup appears because you have two
    classes in the project with main methods.  BTW:  If you haven''t saved your changes
    to HelloWorld.java, the "Save and Launch" popup appears.  Click on the "OK" button. 
    Highlight the HelloLauncher class and click on "OK".  You should see the hello
    message in the Console. If you don''t see any error or warning indicators, you''ve
    been successful. 


    Possible misstep 8-4'
