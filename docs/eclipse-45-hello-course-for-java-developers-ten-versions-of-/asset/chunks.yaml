- fmt: '

    A tool that converts one or more resources in a project into another resource
    (called a `build`) in the project. All eclipse `builders` are incremental - after
    full build (sometimes called a "build all"), the `builder` only builds what has
    changed since the last build (sometimes called a "rebuild"). A `builder` is always
    associated with a project.


    ### What’s a full build?

    A build where all resources in the project are built.


    ### What’s an autobuild?

    An incremental build triggered automatically because (1) a resource has changed
    and (2) the autobuild feature is on. Note:: unless you are doing something unusual,
    `autobuild` should be on!


    ### What’s an incremental build?

    A partial build that starts with the results of a previous build and only modifies
    what''s been changed. Faster!


    ### What’s a bundle?

    A mechanism for grouping, delivering, and managing content. Think of `bundles`
    as the implementation of components in Eclipse. There is no distinction in Eclipse
    between `bundles` and `plug-ins`. Note: Every `bundle` has its own `classloader`
    and its own `manifest.mf` file.


    ### What’s a facet?

    A `facet` is a unit of functionality that can be added to a project. `Java` is
    a `facet`. (And a `feature`. And several other things.)


    ### What''s a feature?

    Group of related `plug-ins`. (`JDT` is a `feature`, for example.)


    ### What’s a file?

    A virtual (or actual) `file` associated with a project or a `folder` in a project
    in an Eclipse workspace.


    ### What’s a folder?

    A virtual (or actual) `directory` associated with a project in an Eclipse workspace.
    `Folders` are useful tools for storing project resources hierarchically.


    ### What''s a perspective?

    Collection of `editors` and `views` that share some common purpose.


    ### What''s the current perspective?

    The `perspective` highlighted in the far right of the toolbar. The current `perspective`
    controls the appearance of the main `Window`.


    ### What’s a plug-in (plugin)?

    Fundamental building block of the Eclipse platform. `JDT` is a collection of `plug-ins`.


    ### What’s a project?

    A container that groups resources into buildable, reusable units.


    ### What''s a resource?

    Either a `project`, a `folder`, or a `file`. `Projects` can contain `folders`
    and/or `files`. `Folders` can contain `files`.


    ### What''s a tag?

    Marker (special text) placed in code to indicate work to be done later at the
    location of the `tag`. Eclipse `tags` can found with the `Task` tab (`Task` view).


    ### What''s a task list?

    List of `tasks` associated with bug trackers.


    ### What''s a task view (task tab) (tag view)?

    List of `tags` in source files that need to be replaced by code.


    ### What’s a view?

    A window with a graphical display of an Eclipse `resource`. Eclipse makes no distinction
    between a `view` and the `perspective` in which it is displayed.


    ### What’s an editor?

    An editable `view` of a `resource`. It provides customized behavior for manipulating
    the data represented by the `resource`. Different `editors` are associated with
    different types of `files`. When you open a `file` for editing by double-clicking
    it in one of the navigation views, the `Workbench` opens the associated `editor`
    in the `Workbench`. If there is no associated `editor` for a `resource`, the `Workbench`
    attempts to launch an appropriate external `editor` outside the `Workbench`.


    ### What''s "baked-in"?

    Euphemism for built-in (developed by eclipse, not by a third-party).


    ### What''s JDT (Java Development Tools)?

    The `JDT` is what makes the Eclipse Java IDE different from the Eclipse C/C++
    IDE or …. BTW: `JDT` is a `feature`, not a `plug-in`. Many developers misuse the
    term `feature`, though.


    ### What''s the build path?

    Specifies all dependencies required to complete a project. `Code` and other resources
    (in source folders), associated `jars` and `classes` folder(s), and `classes`
    and `libraries` referenced by (needed by) the project.


    # Chapter 5: Eclipse 4 file system


    ### How does the Eclipse platform organize information? How does the Eclipse workbench
    organize information?

    The `workbench` organizes information by `workspace` then by `project` in that
    `workspace`. When the Eclipse `workbench` starts, it asks the user to select a
    `workspace` if the user has not selected a default `workspace`. Eclipse loads
    all the `projects` in that `workspace` into `Project Explorer`.


    ### What''s in a workspace directory?

    | `.metadata` | Look for error logs here! |

    | :--- | :--- |

    | `.recommenders` | `JSON` files. |

    | `RemoteSystemsTempFiles` | Created by eclipse''s remote system explorer. Ignore
    this. |

    | `Various project directories` | Your projects. |


    ### What''s in a project directory?

    | `.settings` directory | Project-unique settings |

    | :--- | :--- |

    | `bin` | Binary files created by eclipse. |

    | `src` directory | Project-unique resources |

    | `target` directory | Files created from resources |

    | `.classpath` file | Optional xml file created by maven |

    | `.project` file | Optional xml file created by maven |

    | `pom` file | Optional xml file created by maven |


    ### What''s in the .metadata folder?

    The `.metadata` folder contains workspace-specific configuration.


    ### What''s in the .metadata folder?

    The `.metadata` folder contains workspace-specific configuration.


    # Chapter 6: Eclipse 4


    ### Does the Java IDE look different?

    When you first start, the `perspective` adds new options to the `Project Explorer`.
    For example, adding the Java perspective adds the Package Explorer to the big
    picture region.


    ### What are the three regions?

    Both the Java and EE IDEs have the same three regions: (1) `Menus and toolbar
    region` at the top, (2) `Main region` (big picture region on the left and Detail
    region on right) and (3) `Current status region` at the bottom.

