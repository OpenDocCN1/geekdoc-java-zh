    ![](img/00006.jpg)

    在 `Project Explorer` 主窗口上右键点击（不是顶部的标签）。当下拉菜单出现时，点击 `New->Project`。当 `Select a
    wizard` 弹出窗口出现时，选择 `Java->Java Project` 然后点击 `Next`。当 `Create a Java Project`
    向导出现时，输入项目名称（`Hello1`），点击 `Use default location` 旁的复选框，并点击 `Finish`。


    当 `Open Associated Perspective?` 弹出窗口出现时，点击 `Yes`。（不要点击 `Remember my decision`。在你不理解更改它的影响之前，永远不要更改默认设置！）注意你现在有两个视图（perspective）：`Java
    EE` 和 `Java`。（当前视图是哪一个？哪一个被高亮了？）


    > **可能的错误误区 7-2**

    > 当 `Java` 成为当前视图时，工具栏发生了什么变化？当 `Java` 成为当前视图时，“大局区域（Big picture region）”发生了什么变化？点击
    `Java EE` 图标使 `Java EE` 成为当前视图。同样的问题。如果你在工具栏或大局区域中看到的不是预期内容，你可能处于错误的视图中。顺便问一下：`Java`
    视图工具栏中出现了哪些 `Java EE` 视图工具栏中缺失的按钮？


    > **可能的错误误区 7-3**

    > “大局”区域发生了什么变化？通过点击 `Window->Show View->Project Explorer` 在“大局”区域中找回 `Project
    Explorer` 标签。你应该能在“大局”区域同时看到 `Package Explorer` 标签和 `Project Explorer` 标签。


    使用 `File Manager`，进入你的工作空间目录查找 `Hello1` 项目（它应该在那里）。在 `File Manager` 中，如果 `Hello1`
    目录未展开，请将其展开。在项目名称下你看到了哪些文件夹和文件？名为 `.settings`、`bin`（可能）和 `src` 的源文件夹，以及 `.classpath`
    和 `.project` 文件。


    > **可能的错误误区 7-4**

    > 为什么你看到的是奇怪的图标而不是文件目录名称？这些是“点”文件（在点前面没有名称）。“点”文件和文件夹通常被视为不可见的。顺便问一下：在 `File Manager`
    中返回工作空间目录。双击带有纸张图标的“点”文件。Notepad 或或其他编辑器将打开 `.log` 文件！你可以看到自安装 eclipse 以来它向 `.log`
    写入了哪些错误。


    在 `Project Explorer` 中，点击 `Hello` 项目旁的 `>`。在 `src` 上右键点击，当弹出菜单出现时，点击 `New->Class`。当下拉菜单出现时，点击
    `New->Class`。当 `Java Class` 窗口出现时，输入名称 `Hello1World` 然后点击 `Finish` 按钮。


    仍在 `Project Explorer` 中，`Hello1World.java` 文件位于何处？它在哪个包（package）中？（由于你没有输入包，Eclipse
    创建了一个默认包并将 java 文件放置在那个包中。）


    ![](img/00012.jpg)

    **练习 7-2：创建一个包含 main 方法和注释的 Hello 项目**


    重复练习 7-1，但使用项目名称 `Hello`。不要忘记创建 java 文件 `HelloWorld`。（相同的名称，不同的项目！这听起来像是有作用域，，不是吗？）当
    `Java Class` 窗口出现时，勾选 `public static void main…` 和 `Generate comments` 旁的复选框。


    **练习 7-3：比较 HelloWorld.java 和 Hello1World.java**


    在 `Project Explorer` 中，`Hello1` 和 `Hello` 都应该是打开的项目。点击 `>` 图标让两个项目都处于打开并展开状态。找到
    `HelloWorld` 类。双击 `HelloWorld.java`，它会出现在详情区域的 `Editors` 窗格中。双击 `Hello1World.java`，它会出现在
    `Editors` 窗格的第二个标签中。要同时查看两者，点击并按住 `Hello1World.java` 标签，将其向左拖动直到出现一个较小的窗格，然后松开鼠标。你看到了什么区别？`HelloWorld.java`
    具有 Javadocs 壳结构和一个 main 方法，因此该类可以独立运行。`HelloWorld1.java` 则。


    ![](img/00004.jpg)

    **可能的错误误区 7-5**


    > 在 Java 编辑器中 `Hello` 项目 `HelloWorld.java` 的左侧（不是最左侧），你会看到 Javadoc 注释和块开头（通常是方法）旁边有带有
    `+` 的深圆和/或带有 `-` 的浅圆。带有 `+` 的深圆表示代码折叠，带有 `-` 的浅圆表示未折叠。点击文件顶部的浅圆（类 Javadoc 的开头）。圆圈变深，只显示注释或块的一行。不要认为任何内容都丢失了。点击深圆，它会变成浅圆，并且整个注释或块就会出现。


    **练习 7-4：关闭 Hello 和 Hello1**


    在 `Project Explorer` 中，`Hello` 和 `Hello1` 都应该是打开的。（如果不是，请打开关闭的那个。）在 `Hello` 上右键点击。当下拉菜单出现时，点击
    `Close Project`。


    **练习 7-5：删除 Hello1 项目**


    在 `Project Explorer` 中，右键点击 `Hello1`。当下拉菜单出现时，点击 `Delete`。当 `Resources` 弹出窗口出现时，点击
    `OK`。（无法轻易恢复。）


    **练习 7-6：在 main 中添加方法调用**


    在 `Project Explorer` 中，让 `Hello` 项目成为打开的项目。将 `HelloWorld.java` 加载到 Java 编辑器。注意
    `main` 内部的 TODO 注释。现在查看 `Outlines` 窗格。在 `main()` 中高亮 `//TODO` 然后输入 `System.`（你需要点！）Eclipse
    弹出 `System` 文档。高亮 `out` 并按回车（或双击），`out` 就会追加在 `System.` 后面。后面再输入一个点 (.)。Eclipse
    弹出 `PrintStream` 文档。高亮 `println` 并按回车。现在你看到 `System.out.println();` 在括号内输入 `"Hello
    from HelloWorld"`。现在没有错误指示。


    在 `HelloWorld.java` 编辑器的主区域右键点击。当下拉菜单出现时，点击 `save`。关闭 `HelloWorld.java` 标签。


    **练习 7-7：运行 Hello 项目**


    在 `Project Explorer` 中，右键点击 `Hello` 项目。当下拉菜单出现时，点击 `Run as -> Java application`。注意“输出”区域打开了一个控制台，字符串
    `"Hello World from Java and Eclipse"` 出现在控制台中。点击 `Problems` 标签并注意没有列出任何错误。


    **练习 7-8：为什么会有项目警告？**


    在 `Project Explorer` 中，如果 `Hello` 项目是打开的，你可能会在 `>` 和项目名称之间看到项目警告图标（带有感叹号的黄色文件夹）。展开找到
    `HelloWorld.java` 文件，然后双击它在 Java 编辑器中打开它。如果你在输出区域没有看到 `Problems` 标签，点击 `Window->Show
    View->Other…->General->Problems`。现在你在输出区域看到了一个“problems”标签。点击“Problems”一词并阅读警告描述。如果信息是“no
    JREs … strictly compatible”，请忽略该项目警告。


    **练习 7-9：关闭 Hello 项目**


    在 `Project Explorer` 中，右键点击 `Hello` 项目。当下拉菜单出现时，点击 `Close Project`。项目图标现在是一个关闭的文件夹。


    **问题**


    所有这些问题都假设项目是打开并展开的项目。


    创建新项目的另外两种方法是什么？提示：点击 `File`。查看下拉菜单然后将鼠标悬停在工具栏图标上。


