    with Text on Screen), a short note about the calendar (Gregorian Calendar Tiny
    Notes), a Calibre Course. (He thinks he is smarter now so the previous books will
    be rewritten and reissued.)


    He has learned to write iPhone and iPad code and written two small eBooks about
    iOS 8 programming "Notes on the OS X Yosemite File System: A Windows Programmer:
    He does not like much.

