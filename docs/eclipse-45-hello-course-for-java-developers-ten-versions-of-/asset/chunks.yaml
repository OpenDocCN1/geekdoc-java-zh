    The editor views, the outline views sit on top the output view (can be moved).
    Warning: There are many tabs and each perspective has its own input and output
    views. You can move them around. However, until you know what is what, it’s better
    to leave everything in its default position.


    These is just startup views. And, you can move them around. However, until you
    know what is what, it’s better to leave everything in its default position.


    ![](images/00005.jpg)


    ## What''s the difference between the Project Explorer view and the Package Explorer
    view?


    The `Project Explorer` is a hierarchical view of the artifacts in the Workbench
    (customized by the specific configuration of your Workbench). It can be used for
    many languages and project types. Additional plugins contribute "extra information"
    to the `Project Explorer` view making it much more "sophisticated". For example,
    when the `JDT` (Java developer tools) plugin is installed in the `Project Explorer`,
    many of the features in the `Package Explorer` (part of `JDT`) appear in the `Project
    Explorer` when it is used for java projects.


    ## What''s the outline view?


    In the Java and Java EE perspectives, the outline tab in the outlines and tasks
    regions shows of the currently selected class. It is always visible in these perspectives.


    ## What''s the problem view (problem tab)?


    In the Java and Java EE perspectives, the `problem tab` in the output region showing
    errors and warnings. You normally have to bring up the `problem view` by clicking
    on `Window->Show View->Other->General->Problems`.


    ## Where can I find information about the icons used in the IDE?


    For Mars, look in [http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm).
    For Luna, look in [http://help.eclipse.org/luna/index.jsp?topic=/org.eclipse.jdt.doc.user/reference/ref-icons.htm](http://help.eclipse.org/luna/index.jsp?topic=/org.eclipse.jdt.doc.user/reference/ref-icons.htm).


    ## Where do I find on-line help for Eclipse?


    Try [http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm).


    ## Where do I find eclipse error logs?


    Look in the `.metadata` folder.


    ## Creating basic Java apps using Eclipse


    ### Chapter 7: Create, build and run HelloWorld using the Eclipse IDE


    #### Starting Eclipse


    When you start Eclipse, the `Welcome` tab should not appear. (You closed it during
    installation.) If it does, close it. Click on `File`. When the dropdown menu appears,
    click on `Switch Workspace` and select your Hello workspace (I''m using `C:\MyCode\workspace-mars-hello`).


    #### What does the error icon look like?


    Circle with a red triangle containing an "!" in the left hand side of the Java
    editor view. The triangle is in the lower right corner. ![](images/00016.jpg)
    (quick fixable error) or ![](images/00015.jpg) (more complex error).


    #### What does the warning icon look like?


    Circle with a yellow triangle containing an "!" in the left hand side of the Java
    editor view. The triangle is in the lower right corner. ![](images/00020.jpg)
    (quick fixable warning) or ![](images/00002.jpg) (more complex warning).


    #### What''s a folding editor?


    Allows user to hide and reveal blocks of text—usually named. Typically done to
    allow the user to better picture the overall structure of a document or program.


    #### What is a warning?


    Message sent to the user during build that warns of some unusually (usually abnormal)
    condition that isn''t serious enough to throw an exception and terminate execution.
    The app will run but probably won''t give the desired results.


    #### What is an error?


    Message sent to the user during build warns of some error condition that is serious
    enough to throw an exception and terminate execution, possibly serious enough
    to prevent execution. Alternative: Run-time environment internal error or resource
    problem that prevents the application from continuing. Must be fixed before the
    program can run.


    #### What is an execution environment JRE?


    Oldest allowable JRE runtime on the target (destination) computer. The JRE used
    to build an app can be a newer version than the runtime version as long as the
    build knows what the oldest allowable JRE is.


    #### What is a CDC-1 execution environment? What is a JRE1-1 execution environment?
    What is an OSGi/Minimum execution environment?


    Java 1.0, 1.1 or (sometimes) 1.2 compatible target. Curiosity value only.


    #### What is a J2SE-1.x environment?


    J2SE 1.1, …, or 1.5 compatible target. Mostly curiosity value.


    #### What is a JavaSE-1.x environment?


    J2SE 1.6, 1.7 or 1.8 execution environment.


    #### What is code folding?


    Editor’s ability to compress and expand code, markup and comment.


    #### What is "drill down"?


    In inverted structures (like a file system), clicking on a series of nodes to
    get to some place. For example, clicking on `C:` drive to see the root, then clicking
    on `Windows` to see the directories.


    #### What is Javadoc (JavaDoc)?


    Tool that parses the declarations and documentation comments in a set of `.java`
    files and produces a set of HTML pages describing the classes, interfaces, constructors,
    methods, and fields.


    #### How do I recognize a Javadoc comment?


    Begins with `/**`, may have multiple lines, and ends with `*/`. (Not the same
    as a C comment which begins with `/*` and ends with `*/`).


    #### How do I see Javadoc?


    Open the Javadoc view. (Click on `Window`. When the dropdown appears, click on
    `Show View->Java->Javadoc`. A Javadoc tab will appear in the output region.)


    #### What is scope?


    Characteristic of a type or data item that describes the region where the type
    or item name can be safely used without conflict. See class scope, local scope
    and module scope.


    #### What is the difference between a closed project, an open project and an open
    expanded project?


    In `Project Explorer`, a closed project is a single line with a closed folder
    icon and the project name; an open project is a single line with a `>` icon, an
    open file icon, and the project name; an open expanded project is on multiple
    lines, a down pointing arrow icon, an open file icon (the project name on the
    first line and then a list of resources under the project).


    #### How do I change a closed project into an open project?


    Double click on the closed folder icon.


    #### How do I change an open project to an open expanded project?


    Double click on the open folder icon. Or, just click on the `>` icon. BTW: In
    general, clicking on the `>` means "Show the next layer down".


    #### How do I change an open or open expanded project into a closed project?


    Right click on the project name. When the dropdown appears, click on `Close Project`.


    #### What''s the difference between the Project Explorer and the Package Explorer?


    The `Project Explorer` shows all projects. The `Package Explorer` shows a single
    project.


    #### Exercise 7-1: Create a Hello1 project


    You create projects in the `Project Explorer` tab in the "big picture" region.


    > Possible misstep 7-1


    > Right click on the tab at the top of `Project Explorer` main window. A dropdown
    with the entry "close" pops up. Click on "close". What happens? BTW: You can get
    back to the default IDE regions and formats by right clicking on the "Java EE"
    icon at the far right then selecting "reset".

