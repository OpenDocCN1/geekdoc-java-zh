    我第一次在一份归属于 Rebecca Ong 的 PDF 中看到了一系列越来越复杂的 Hello 程序，这些程序最终强调了 Spring 框架。从那以后，我看到了与其他开发者相关的类似的
    Hello 程序集合。最后一个练习来自科林林县社区学院继续教育部门的 Oz Brown。


    我的大多数示例都略有不同，因为我的目标是教授 Eclipse 的创建和编辑，而不是教授面向对象的编程。但是，要感谢 Rebecca 和 Oz。


    ## 这些笔记从哪里来？


    这些笔记是三十年编程和二十年网络搜索的成果。这意味着某些章节不是最新、最好的。然而，它们描述了解决问题的方法。


    （对于一个从 `GW Basic` 开始编程并在 Windows Write 1.0 中写下第一本书的人，你对他有什么期待呢？）


    ## 为什么本电子书没有复制保护？


    你可能想从书中进行复制和粘贴。我建议你使用 `Calibre` 将此书转换为 `DOCX`。你可以放大图片以便看得更清楚。


    顺便说一下：如果你想在公司开设一门 Eclipse 课程，请发送邮件至 `JRHInLucas@Yahoo.com`。


    ## 第 1 章：为什么选择 Eclipse 4.5？


    ### 我应该读哪些书？


    一本好的短书是 Lars Vogel 的 Eclipse IDE ([`www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B006O1J39S/ref=sr_1_3?s=books&ie=UTF8&qid=1457579814&sr=1-3&keywords=lars+vogel`](http://www.amazon.com/Eclipse-IDE-vogella-Lars-Vogel-ebook/dp/B006O1J39S/ref=sr_1_3?s=books&ie=UTF8&qid=1457579814&sr=1-3&keywords=lars+vogel))。


    一本很好但非常贵的书是 Ram Kulkarni 的 Java EE Development with Eclipse ([`www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFNB40/ref=sr_1_13?s=books&ie=UTF8&qid=1457579962&sr-1-13&keywords=eclipse+computer`](http://www.amazon.com/Java-Development-Eclipse-Ram-Kulkarni-ebook/dp/B014HFNB40/ref=sr_1_13?s=books&ie=UTF8&qid=1457579962&sr-1-13&keywords=eclipse+computer))。


    一本有用但采用几乎毫无用的“死树”格式的复杂的书是 Kate Thompson 的 Zero Bugs and Program Faster ([`www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/0996193308/ref=sr_1_38?s=books&ie=UTF8&qid=1457580123&sr-1-38&keywords=eclipse+computer`](http://www.amazon.com/Zero-Bugs-Program-Faster-Thompson/dp/0996193308/ref=sr_1_38?s=books&ie=UTF8&qid=1457580123&sr-1-38&keywords=eclipse+computer))。仅推荐给眼睛良好的资深程序员。


    ### 为什么使用 Eclipse IDE？


    在 2014 年（去年的可用数据），Eclipse（免费）占据了 48% 的 IDE 市场，`IntelliJ`（高价）占据 33%，`NetBeans`（免费）占据
    10%，而 `Spring`（免费，基于 Eclipse）占据 4%。除非你想使用同一个（嗯，相似的）`IntelliJ` IDE 同时开发 Java 和
    Android 应用程序，否则 Eclipse 是首选工具，特别是在节约经费的公司中。（Eclipse 是免费的。）


    ### 为什么使用 Eclipse 4.5？


    它是基于 `Java 8` 的 Eclipse 第二版本。它稳健且可靠。


    ## 第 2 章：开始使用 Eclipse


    ### Eclipse 项目是如何管理的？


    Eclipse 的所有工作都是在顶级项目组织下的子项目和组件中完成的。顶级项目由 `PMCs`（项目管理委员会）管理。


    ### Eclipse 的 4.x 版本是什么？


    | 4.2 | Juno | 第一代 Eclipse 4 |

    | :--- | :--- | :--- |

    | 4.3 | Kepler | Maven 集成 |

    | 4.4 | Luna | Java 8 集成 |

    | 4.5 | Mars | 支持 Java lambda 表达式 |

    | 4.6 | Neon | 将于 2016 年 6 月发布。目前提供预发布版本。 |


    ### 什么是向导（wizard）？


    一个通过填充内容的窗口来简化某些内容的创建。Eclipse 非常重视向导。


    ### 什么是 Eclipse？


    一个由软件开发者组成的开源社区，专注于构建一个带有可扩展框架、工具和运行时的开放开发平台，可以在整个软件生命周期内构建、部署和管理软件。别名：Eclipse。


    ### 什么是 Eclipse “全景图”？


    ```

    images/0001.jpg

    ```


    下方显示的另一种视图如下：


    ```

    images/0001.jpg

    ```


    ### 什么是 Eclipseedia？


    [`eclipse.org/Main_Page`](http://eclipse.org/Main_Page)


    ### 什么是开源？


    开源术语意味着代码对他人可用。


    ### Eclipse 3 和 4 有什么区别？


    Eclipse 3 是 7.1。Eclipse 4 是 8。


    ### 什么是 Eclipse 架构？


    ```

    images/0001.jpg

    ```


    ### 什么是 Eclipse 平台？


    由平台开发的扩展 IDE。


    ### 什么是 Eclipse 工作空间（workbench）？


    用于通用 UI 的术语。等待，Eclipse `wiki.eclipse.org/Main_Page`：


    [`eclipse.org/Main_Page`](http://eclipse.org/Main_Page)


    [wiki.eclipse.org/Main_Page](http://wiki.eclipse.org/Main_Page)


    等待，3.1。


    下方显示如下：


    ```

    images/0001.jpg

    ```


    ### 什么是 Wiki？


    使用引擎的网站。


    ### Eclipse 什么时候集成 7？


    Eclipse 7.1。


    ### Eclipse 什么时候集成 8？


    Eclipse 4.4。


    ## 第 3 章：安装 Eclipse 4 Java


    ### 我有 `JAVA_HOME` 环境变量吗？


    右键点击 `开始->系统`。当系统窗口出现时，点击`高级系统设置`。当`系统属性`弹出窗口出现时，点击`环境变量`。当`环境变量`弹出时，向下滚动`系统变量`。如果你没有看到
    `JAVA_HOME`，点击`新建`并填写`新建系统变量`表。变量值应该是你的 `jdk` 路径。点击所有`确定`按钮以保存并返回系统窗口。点击右上角的 `x`
    关闭。


    ### 我有的是什么版本的 Java？


    右键点击开始图标并选择命令提示符（管理员）。当 `cmd` 窗口弹出时，输入：


    ```

    java -version

    ```


    它应该显示某些 1.8 的构建版本和某些 SE 运行时环境。如果没有，请从 [`www.oracle.com/technetwork/java/downloads/index.html`](http://www.oracle.com/technetwork/java/downloads/index.html))
    下载 `jdk`。


    ### 如何使用某些预定义的工作空间启动 eclipse？


    '
- fmt: '

    Create a batch file with the single line like `"C:\eclipse\Mars 4.5.1 EE \eclipse.exe"`
    -data `C:\MyCode\workspace-mars-hello`.


    ## What’s an IDE?


    Acronym for Integrated Development Environment, a development tool with a WIMP
    interface.


    ## What should I know before I start installing?


    Where to install eclipse, what version of eclipse, which type of eclipse IDE,
    32- or 64-bit Windows, directory that will contain workspaces. Warning: Don''t
    use spaces in directory of file names. It may not matter. But, it might. Don''t
    do it!


    | Option | Suggestion |

    | :--- | :--- |

    | Where should I install Eclipse? | Under a root directory named Eclipse. You
    can install multiple versions of Eclipse in this directory. |

    | What version of Eclipse should I install? | Mars EE (Eclipse 4.5.1) |

    | Do I have 32- or 64-bit Windows? | You''ll have to find out by running "System
    Information". |

    | What directory will contain workspaces? | To avoid privileges issues, create
    a root (`C:\`) directory named MyCode (no spaces). |

    | Should you avoid spaces in names? | Absolutely. It may not hurt. But, it might.
    |


    ## Installation


    Warning: The fundamental rule for all installations is don''t change anything
    you are not absolutely sure you understand.


    ### Step 1: What release (version) to install?


    Either install the current version of Eclipse (Eclipse 4.5.1, Mars in January,
    2016) or whatever version your company uses. Warning: Never install a new version
    (of any kind of software) until two or three months after its release. ("Never
    use version x.0.") Eclipse does releases in June so install the previous version
    in June and July.


    If you install version 4.3 or newer, you will be using Java 8 by default. If you
    install version 4.2 or 3.7, you will be using Java 7 by default.


    Before you go to Step 2, you should know the version of eclipse you want to install.


    ### Step 2: What type to install (classic ide, standard ide, Java ide or Java
    EE ide)?


    If you install the "classic" ide version of eclipse (3.7, 4.2), you will have
    to manually install a build system, desktop development tools, Java development
    tools, a version control system, and XML tools. (Not recommended.)


    If you install the "standard" version of eclipse (4.3), you will have to manually
    install a build system and XML tools. (Not recommended.)


    If you install the Java ide version of eclipse (4.3 or newer), you will not have
    to manually install any of the above. (Not recommended if you plan on doing databases
    or web development.)


    If you install the Java EE ide version of eclipse, you also get data tools and
    a bundle of web development tools. The ide is a little more complex but you don’t
    have to learn a slightly different ide if you have to move to EE.


    Before you go to Step 3, you should know the version and type (Classic ide, Standard
    ide, Java ide, or Java EE ide).


    ### Step 3: 32- or 64-bit Windows?


    If you are running Windows, you need to know if you are running 32-bit or 64-bit
    Windows. Click on the Start icon, click on "All apps->Windows Administrative Tools->System
    information". Look for "System Type".


    Before you go to Step 4, you should know what version of Windows you have.


    ### Step 4: Go to the eclipse website


    Go to [https://www.eclipse.org/ide/](https://www.eclipse.org/ide/)


    ![](images/00007.jpg)


    Select Java IDE or Java EE (recommended). Select the release you want.


    ![](images/00021.jpg)


    Select OS.


    ![](images/00014.jpg)


    Download Eclipse. Warning: You may get "gifts" if you download from one of the
    Members. To avoid complications, click on the left side download button.


    Note: The end of the name of the file (`win32-x86_64.zip`) tells you that you
    are going to download the 64-bit version of the file. Wait patiently! (BTW: The
    donation is optional.)


    ![](images/00009.jpg)


    ### Step 5: Unzip and deploy Eclipse.


    In File Manager, go to the download directory, right click on the zip file and
    select "extract all" and select the default destination. You may find it''s helpful
    to put the eclipse file system inside a directory named Eclipse. When eclipse
    releases a new version, you can install the new version next to the current version.


    ### Step 6: Decide where you are going to save your source files


    Drill down to find `eclipse.exe`. Double click on it. Wait! When the "Select a
    workspace" popup appears, enter the directory where you want your source saved.
    If you select the default, 64-bit Windows may require privilege tweaking to see
    the contents of the default directory under Users. (I recommend creating a root
    directory named `MyCode` then a subdirectory named `workspace-mars-hello`.) Note:
    Many new versions of Eclipse "upgrade" a workspace which prevents older versions
    of Eclipse from using it. So, giving each a name like `workspace-mars` that indicates
    the release using it is helpful: each version will have its own unique workspace.


    ![](images/00013.jpg)


    ### Step 7: View the Welcome screen


    After you’ve selected the workspace, the eclipse start screen appears while it
    loads. Eventually, the Welcome screen appears. Look through the links on the page.
    Once you’re done, close the Welcome window by clicking on the x to the left of
    Welcome (you will no longer see this page when you start Eclipse) or click on
    the "workbench" icon in the pane''s upper right corner.


    ![](images/00003.jpg)


    ### Step 8: Look at help


    When the workbench pops up, click on "Help". Look through the help. Start "About"
    from the Help menu.


    If you’ve installed the Java IDE, it should look like this.


    ![](images/00022.jpg)


    If you installed the Java EE, it should look like this.


    ![](images/00023.jpg)


    ### Step 9: Look at your workspace


    (This may require privilege ting.) Use File Manager to look at your workspace.
    The `.metadata` folder indicates you''re in a workspace. You may also see a directory
    called `RemoteSystemsTemp`. It''s a free gift from eclipse that''s created by
    the remote systems explorer. Ignore it. Or, google it and note how many users
    want to make it go but have difficulty doing so.)


    ### Step 10: Set helpful defaults


    Click on "Windows->Preferences". Scroll through the top-level preferences. You
    will spend most of your time in the Java top-level preferences, the rest in the
    General preferences. Ignore the others for now.


    Go to "General->Startup and Shutdown->Workspaces" and select your workspace for
    the Hello projects and click on "Apply". Shrink the General-preferences. Do NOT
    click on "OK" unless you want to return to the eclipse windows.


    Go to "Java->Build Path->Installed JREs->Execution Environment". Click on `JavaSE-1.8`
    (compatible with jdk 1.8 and higher) then click on the checkbox next to a jre
    currently installed in your environment.


    Click on "OK" to close the Preferences window.


    ### Step 11: Look all the dropdowns and mouse over all the icons


    You may need to click on a blank space on the tool bar to close a dropdown or
    a tool popup (no program is perfect. "). Grayed out dropdowns and buttons are
    currently disabled.


    ### Step 12: Done


    You’ve successfully installed eclipse. Congratulations.


    Where do I find on-line help for mars?


    Go to [http://help.eclipse.org/mars/index.jsp](http://help.eclipse.org/mars/index.jsp).


    Where do I find the meaning of Eclipse icons for mars?


    Look in [http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%2Fref-icons.htm).


    ## Chapter 4: Eclipse 4 terms


    ### What’s a build (noun)?


    A build project resource created by a builder from other resources of that project.
    Build (verb) is what a builder does.


    ### What’s a builder?

