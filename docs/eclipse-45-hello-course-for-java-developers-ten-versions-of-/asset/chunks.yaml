    创建一个包含单行的批处理文件：`"C:\eclipse\Mars 4.5.1 EE \eclipse.exe"` -data `C:\MyCode\workspace-mars-hello`。


    ## 什么是 IDE？


    集成开发环境（Integrated Development Environment）的缩写，一种具有 WIMP 界面的开发工具。


    ## 在开始安装之前我应该知道什么？


    在哪里安装 eclipse、哪个版本的 eclipse、哪种类型的 eclipse IDE、32 位还是 64 位的 Windows、包含工作区的目录。**警告：不要在目录或文件名中使用空格。**
    这可能没关系，但可能会有影响。不要这样做！**


    | 选项 | 建议 |

    | :--- | :--- |

    | 我应该在哪里安装 Eclipse？ | 在一个名为 Eclipse 的根目录下安装。你可以在此目录下安装多个版本的 Eclipse。 |

    | 我应该安装哪个版本的 Eclipse？ | Mars EE (Eclipse 4.5.1) |

    | 我的 Windows 是 32 位还是 64 位的？ | 你需要运行“系统信息”来确定。 |

    | 哪个目录将包含工作区？ | 为了避免权限问题，创建一个名为 MyCode（无空格）的根目录（C:\）。 |

    | 我应该避免在名称中使用空格吗？ | 绝对应该。这可能无害，但可能会有问题。 |


    ## 安装


    **警告：所有安装的基本规则是，不要更改任何你不绝对确定自己理解的内容。**


    ### 步骤 1：安装哪个发布（版本）？


    要么安装当前版本的 Eclipse（Eclipse 4.5.1，2016 年 1 月发布的 Mars），或者你公司使用的任何版本。**警告：在任何新版本（任何软件）发布两三个月之前，千万不要安装新版本。**（永远不要使用
    x.0 版本。）Eclipse 在 6 月发布新版本，因此请在 6 月和 7 月安装上一个版本。


    如果你安装 4.3 或更高版本，默认将使用 Java 8。如果你安装 4.2 或 3.7 版本，默认将使用 Java 7。


    在进入步骤 2 之前，你应该已经知道你想安装的 eclipse 版本。


    ### 步骤 2：安装哪种类型（classic ide、standard ide、Java ide 还是 Java EE ide）？


    如果你安装 eclipse 的 "classic" ide 版本（3.7, 4.2），你必须手动安装构建系统、桌面开发工具、Java 开发工具、版本控制系统和
    XML 工具。（不推荐。）


    如果你安装 eclipse 的 "standard" 版本（4.3），你必须手动安装构建系统和 XML 工具。（不推荐。）


    如果你安装 eclipse 的 Java ide 版本（4.3 或更高版本），你将无需手动安装上述任何内容。（如果你计划进行数据库或 Web 开发，则不推荐使用此版本。）


    如果你安装 eclipse 的 Java EE ide 版本，你还将获得数据工具和一组 Web 开发工具包。该 ide 稍微复杂一点，但如果你必须迁移到 EE，就不需要重新学习略有不同的
    ide 了。


    在进入步骤 3 之前，你应该知道版本和类型（Classic ide、Standard ide、Java ide 或 Java EE ide）。


    ### 步骤 3：32 位还是 64 位的 Windows？


    如果你正在运行 Windows，你需要知道你运行的是 32 位还是 64 位的 Windows。点击开始图标，点击“所有应用->Windows 管理工具->系统信息”。查找“系统类型”。


    在进入步骤 4 之前，你应该知道你使用的是什么版本的 Windows。


    ### 步骤 4：前往 eclipse 网站


    访问 [`www.eclipse.org/ide/`](https://www.eclipse.org/ide/)


    ![](img/00007.jpg)


    选择 Java IDE 或 Java EE（推荐）。选择你需要的版本。


    ![](img/00021.jpg)


    选择操作系统。


    ![](img/00014.jpg)


    下载 Eclipse。**警告：如果你从某个成员那里下载，可能会收到“礼物”。** 为了避免麻烦，请点击左侧的下载按钮。


    注意：文件名的末尾（`win32-x86_64.zip`）告诉你你下载的是文件的 64 位版本。请耐心等待！（顺便说一下：捐赠是自发的。）


    ![](img/00009.jpg)


    ### 步骤 5：解压并部署 Eclipse。


    在文件管理器中进入下载目录，右键点击 zip 文件并选择“解压所有”，然后选择默认目标。你可能会发现将 eclipse 文件系统放在一个名为 Eclipse
    的目录中很有帮助。当 eclipse 发布新版本时，你可以在当前版本旁边安装新版本。


    ### 步骤 6：决定将源文件保存在哪里


    深入找到 `eclipse.exe`。双击它。等等！当出现“选择工作区”弹出窗口时，输入你想要保存源代码的目录。如果你选择默认路径，64 位 Windows
    可能需要调整权限才能查看 Users 目录下默认目录的内容。（**我建议创建一个名为 `MyCode` 的根目录，然后创建一个名为 `workspace-mars-hello`
    的子目录。**）注意：许多新新版本的 Eclipse 会“升级”工作区，这会导致旧版本的 Eclipse 无法使用它。因此，为每个版本命名为如 `workspace-mars`
    这样指示对应版本的名称是有帮助：每个版本将有自己独特的工作区。


    ![](img/00013.jpg)


    ### 步骤 7：查看欢迎界面


    选择工作区后，Eclipse 加载时会出现屏幕。最后会出现欢迎界面。查看页面上的链接。完成后，点击 Welcome 左侧的“x”关闭欢迎窗口，或者点击界面右上角的“workbench”图标。


    ![](img/00003.jpg)


    ### 步骤 8：查看帮助


    当工作区弹出时，点击“帮助”。浏览帮助。从菜单中点击“关于”。如果你安装了 Java IDE，应该是这样的：


    ![](img/00022.jpg)


    如果你安装了 Java EE，应该是这样的：


    ![](img/00023.jpg)


    ### 步骤 9：查看你的工作区


    （这可能需要权限。）使用文件管理器查看你的工作区`.metadata` 文件夹表示你位于工作区。你可能还会看到一个名为 `RemoteSystemsTemp`
    的目录。这是远程系统管理器生成的免费礼物。忽略它。）或者去谷歌搜一下为什么用户对此感到困难


    ### 步骤 10：设置常用默认


    点击“Window->Preferences”。浏览顶部设置。你大部分时间将花在 Java 设置上，剩下的花在 General 设置上。暂时忽略其他。


    进入“General->Startup and Shutdown->Workspaces”，选择你的工作区并点击“Apply”。缩小 General 设置。除非你想返回
    eclipse 窗口，否则不要点击“OK”。


    进入“Java->Build Path->Installed JREs->Execution Environment”。点击 `JavaSE-1.8`（兼容
    jdk.8 及更高），然后勾选环境中已安装的 jre 旁边的复选框。


    点击“OK”关闭设置窗口。


    ### 步骤 11：查看所有下拉菜单并将鼠标悬停在图标上


    你可能需要点击工具栏上的空白处来关闭下拉菜单或工具弹出窗口（没有程序是完美的。”灰色的下拉菜单和按钮是禁用的。


    ### 步骤 12：完成


    你已成功安装 eclipse。恭喜。


    哪里可以找到 mars 的在线帮助？


    访问 [`help.eclipse.org/mars/index.jsp`](http://help.eclipse.org/mars/index.jsp)。


    哪里可以找到 Eclipse 图标含义？


    查看 [`help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%Fref-icons.htm`](http://help.eclipse.org/mars/index.jsp?topic=%2Forg.eclipse.jdt.doc.user%2Freference%Fref-icons.htm)。


    ## 第 4 章：Eclipse 4 术语


    ### 什么是 build (名词)?


    由 builder 从项目的其他资源创建的构建项目资源。Build（动词）是 builder 执行的操作。


    ### 什么是 builder?


