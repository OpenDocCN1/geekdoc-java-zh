    Questions


    All these questions assume the project is an open expanded project.


    What could you do instead of clicking on the small folder with red x to get help?


    Chapter 14:  Export an existing project, import an existing project


    What does export mean in Eclipse?


    Converting an existing file or file system in an Eclipse format to a non-Eclipse
    format (or, some other Eclipse format).  Warning:  You must distinguish between
    Java exports and Eclipse exports.


    What does export mean in Java?


    Converting an existing uncompressed file or file system to a Java compressed format
    (typically an EAR, a JAR, or a RAR).  You must distinguish between Java exports
    and Eclipse exports.


    What does import mean in Eclipse?


    Converting an existing Eclipse file or file system or non-Eclipse file system
    into some format (usually a project).  You must distinguish between Java imports
    and Eclipse imports.


    What does import mean in Java?


    Converting an existing file in some compressed Java file format into an (1) uncompressed
    format or (2) some other compressed Java file format.  You must distinguish between
    Java imports and Eclipse imports.


    What is EAR file format?


    Compressed compiled encapsulated platform-independent file format that contains
    all the class files and other resources an enterprise application needs to run. 
    Often used as a synonym for enterprise application or J2EE enterprise application. 
    Ear files are deployed on an application server.


    What is JAR file format?


    Compressed compiled encapsulated platform-independent file format that aggregates
    many files into one.  Multiple Java classes and their requisite components (.class
    files, images, sounds and other resource files) can be bundled in a JAR file and
    subsequently downloaded to a client in a single HTTP transaction.  The format
    also supports file compression and digital signatures.


    What is WAR file format?


    Compressed compiled encapsulated platform-independent web application that contains
    a directory structure.  The war file is deployed to a web server.  A type of jar
    file.


    What''s a Jar (Java ARchive)?'
