    folder.  In the folder, highlight "spring-beans.3.2.16.RELEASE", "spring-beans.3.2.16.RELEASE-javadocs",
    "spring-core-3.2.16.RELEASE" and "spring-core-3.2.16.RELEASE-javadocs" jars and
    click on "Open".  Back in "User Libraries", look at the results then click on
    "OK".  Back in "User Library", click on "Finish".  Back in "Java Build Path",
    click on "Apply" then on "OK".  Note the change in the HelloSeparationWithInterfacesAndSpring
    project.  BTW:  If you get any Oomph popups, just click on "OK".  You shouldn''t
    but ….


    Open HelloLauncher.java in the editor window. Replace the code inside main with
    the code below:


    `BeanFactory factory = getBeanFactory();`


    `MessageRenderer mr = (MessageRenderer) factory.getBean("renderer");`


