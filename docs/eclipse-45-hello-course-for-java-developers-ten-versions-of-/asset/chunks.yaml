    for the new class.  Double click on it to bring it up in the editor window.  Change
    the string to "Goodbye from HelloSeparationWithInterfacesFactory2 and Eclipse." 
    Save and close it.  Double click on "msf.properties" to bring it up in the editor
    window.  Change the line that begins with provider so it says


    `provider.class=GoodbyeMessageProvider`


    Save and close it.'
