- fmt: "\n> You have two classes with main methods. If you right click on the project\
    \ and use \"Run as->Java Application\", which class will be run? In this case,\
    \ it's easy to tell: `HelloWorld` has no body for `main` so nothing will appear\
    \ in the Console tab if it runs; `HelloWorld` has a body for `main` so \"Hello\
    \ ...\" should appear in the Console tab if it runs. Try it anyway. Eclipse will\
    \ protect you: \"Select Java Application\" pops up with the two classes that have\
    \ mains. You have to select one before running the app.\n\n> To avoid this problem,\
    \ remove the Javadoc shell for `main` and the method `main` from `HelloWorld`\
    \ then run \"Run As->Java App\" again. The \"Save and Run\" wizard pops up, saves\
    \ the now mainless `HelloWorld.java` then starts `HelloLauncher.java`. Exactly\
    \ what we hoped for.\n\n## Questions\n\nAll these questions assume the project\
    \ is an open expanded project.\n\n- What other ways are there to open a closed\
    \ project?\n- Why doesn't \"File->Close\" close an open project?\n\n## Chapter\
    \ 9: Debugging HelloLauncher\n\n### What is debugging\n\nProcess of identifying\
    \ errors in a program, locating the cause of errors and fixing the errors.\n\n\
    ### What is a breakpoint (break point)?\n\nLocation and/or conditions at a location\
    \ in source where the debugger temporarily halts program execution so the developer\
    \ can examine variable values before continuing program execution.\n\n### What\
    \ does \"Toggle breakpoint\" mean?\n\nTurn on a breakpoint at the location of\
    \ the mouse cursor if there is no breakpoint. Disable the breakpoint if one is\
    \ there and turned on.\n\n### Exercise 9 -1: Debug HelloLauncher project\n\nIn\
    \ the Project Explorer, expand \"HelloLauncher\" and open `HelloLauncher.java`\
    \ in the editor. Right click on the bar at the far left of the editor across from\
    \ the \"System....\" statement of the `main` method. When the dropdown appears,\
    \ click on \"Toggle breakpoint\" and a dark circle with a very small arrow across\
    \ the top (indicating an active breakpoint) appears on the bar. Right click in\
    \ the same place. When the dropdown appears, click on \"Toggle breakpoint\" and\
    \ the breakpoint disappears. Set the breakpoint, right click on it. When the dropdown\
    \ appears, select \"Disable breakpoint\" and a light circle appears on the bar.\
    \ For the third time, click on \"Enable breakpoint\" and the ball with again be\
    \ a dark again.\n\nIn the Project Explorer, right clicking on `HelloLauncher`\
    \ project. When the dropdown appears, select \"Debug as ->Java Application\".\
    \ When \"Confirm Perspective Switch\" popup appears, click on \"Yes\". (Do not\
    \ click on the checkbox next to \"Remember my decision\".) A third perspective\
    \ \"Debug\" is added to the perspective grouping and it becomes the current perspective.\
    \ Then, the Project Explorer \"main\" region is swapped for the Debug \"main\"\
    \ region.\n\nAn image is shown below. Study the new information you have available.\
    \ Mouse over all seven debugging buttons. Mouse over the icons at the far right\
    \ of the \"Console\" tab.\n\n![](images/00008.jpg)\n\nClick the \"Terminate debugging\"\
    \ button. You are still in the \"Debug\" perspective. To remove clutter, right\
    \ click on the \"Debug\" perspective. When the dropdown appears, click on \"Close\"\
    , then click on \"Java EE\" perspective icon. In the \"Project Explorer\", close\
    \ the project and take a break.\n\n## Questions\n\nAll these questions assume\
    \ the project is an open expanded project.\n\n## Chapter 10: Reduce coupling with\
    \ separation of responsibility (more but smaller classes)\n\n**Warning:** The\
    \ game has changed: If you've been shown how to do something, you'll have to find\
    \ out where and how. I'll only show you how to do new things.\n\n### What is @Override\n\
    \nInforms the compiler that you intend to override a method in the superclass.\
    \ If the compiler does not detect the method in one of the superclasses, it will\
    \ generate an error. Note: Quickly identify typos or API changes.\n\n### What\
    \ is coupling?\n\nThe relative complexity of the interfaces between code elements\
    \ (the relative independence of code elements). The phrase \"loose coupling\"\
    \ describe simple or minimum coupling (little complexity) (good design) while\
    \ \"tight coupling\" describes complex or maximum coupling (much complexity) (bad\
    \ design). It describes the relative independence of modules (a good thing).\n\
    \n### What is a provider?\n\nClass or method that provides something other classes\
    \ need, usually information. Alternative: A factory of swappable factories (implements\
    \ the abstract factory pattern. Reduces coupling.\n\n### What is a renderer?\n\
    \nClass or method that encodes and decodes information in a format that other\
    \ classes or methods can understand. Reduces coupling.\n\n### What is SoR (Separation\
    \ of Responsibilities)?\n\nA class should be (1) responsibility over a single\
    \ part of the software functionality and (2) that responsibility should be entirely\
    \ encapsulated by the class. All its services should be narrowly aligned with\
    \ that responsibility. Alternative: Each class should do a very few things and\
    \ do them completely.\n\n### What is an annotation?\n\nForm of metadata that provides\
    \ information about a program that is not part of the program itself (has no direct\
    \ effect on the operation of the code it annotates. (1) information for the compiler\
    \ (it can use them to detect errors or suppress warnings), (2) compile-time and\
    \ deployment-time processing (software tools can process annotation information\
    \ to generate code, XML files, and so forth), and (3) runtime processing (it can\
    \ be examined at runtime). Note: Java and Android annotations begin with an \"\
    at\" character (@).\n\n### Exercise 10-1: Improve Hello separation (Reducing Hello\
    \ coupling) (Decoupling Hello)\n\nCopy `HelloLauncher` to `HelloSeparation`. (Did\
    \ you make `HelloSeparation` an open expanded project? Did you close `HelloLauncher`?)\
    \ Add empty classes `HelloMessageProvider` and `HelloMessageRenderer` to the project.\
    \ (Did you put them in the default package? Did you add Javadoc comments?) (Are\
    \ both classes open in the Java editor? If not, open them.) Add to `HelloMessageProvider`\
    \ a blank line and the following method:\n\n```java\npublic String getMessage()\
    \ {\n  return \"Hello from HelloSeparation and Eclipse!\";\n}\n```\n\nIn Project\
    \ Explorer, highlight `HelloMessageProvider.java` then right click on it. When\
    \ the dropdown appears, click on \"Source->Format\". When Eclipse finishes formatting\
    \ it, save and close it.\n\nAdd to `HelloMessageRenderer` the following statements:\n\
    \n```java\nprivate HelloMessageProvider messageProvider = null;\npublic void render\
    \ () {\n  if (messageProvider == null) {\n    throw new RuntimeException (\"Set\
    \ the property messageProvider of class:\" + HelloMessageRenderer.class.getName());\n\
    \  }\n  System.out.println(messageProvider.getMessage());\n}\n```\n\nGenerate\
    \ setters and getters for `HelloMessageRenderer`.\n\nIn Project Explorer, highlight\
    \ `HelloMessageRenderer` then right click on it. When the dropdown appears, click\
    \ on \"Source->Format\". When Eclipse finishes formatting `HelloMessageRenderer.java`,\
    \ save and close it.\n\nReplace the body of `HelloLauncher.java`'s `main()` with:\n\
    \n```java\nHelloMessageRenderer hmr =new HelloMessageRenderer ();\nHelloMessageProvider\
    \ hmp =new HelloMessageProvider ();\nhmr.setMessageProvider(hmp);\nhmr.render();\n\
    ```\n\nIn Project Explorer, highlight `HelloLauncher` then right click on it.\
    \ When the dropdown appears, click on \"Source->Format\". When Eclipse finishes\
    \ formatting `HelloLauncher.java`, save and close it.\n\nRun `HelloSeparation`.\
    \ It runs. However, `HelloMessageRender` and `HelloMessageProvider` are hard coded\
    \ in the project (in `HelloLauncher`). Changing the text of the message would\
    \ be difficult.\n\n> Possible misstep 10-1\n\n> Does `HelloWorld.java` get used\
    \ in the project `HelloSeparation`? No, it's been replaced by `HelloLauncher`,\
    \ `HelloMessageProvider` and `HelloRender`.\n\nDelete `HelloWorld.java` from project.\
    \ Run `HelloSeparation`. It runs. Somewhat cleaner.\n\n### Exercise 10-2: Improving\
    \ Hello separation with interfaces\n"
