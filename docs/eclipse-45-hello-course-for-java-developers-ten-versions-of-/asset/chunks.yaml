  trans: "\n运行 `HelloSeparationWithInterfacesAndFactory2`。它运行并给出了不同的消息。因此，通过简单的文本文件更改应用程序的行为是可能的。无需编译！\n\
    \n## 问题\n\n所有这些问题都假设项目是一个开放扩展的项目。\n\n## 第 12 章：使用更智能的工厂进一步减少耦合\n\n### 什么是 Spring？\n\
    Spring 框架家族的所有者，包括一个简化 Java 企业级应用开发的轻量级开源应用程序服务器。以前被称为 SpringSource (`http://www.springsource.org`)\n\
    \n### 什么是用户库 (user library)？\n共同用途的有用外部 jar 包集合。\n\n### 什么是 appender？\n在 `Log4j`\
    \ 中，日志文件数据的输出目标。\n\n### 什么是外部 jar？\n不是由工作区项目构建的 Jar 文件，通常由某些外部网站提供的 API Jar 文件。\n\
    \n## 练习 12-1：使用 Spring Framework 中的工厂改进 Hello 分离\n\n要访问 Spring Framework，你需要从\
    \ `http://olex.openlogic.com/packages/spring/3.2.16` 下载 Spring Framework `3.2.16`\
    \ (zip) ALL Binary。使用“解压所有”或某些 zip 程序将 Spring jars 解压到 `c:\\MyCode`（或类似的地点，只要你不忘记放在哪里即可）。\n\
    \n将 `HelloSeparationWithInterfacesAndFactory` 复制到 `HelloSeparationWithInterfacesAndSpring`。\n\
    \n右键点击 `HelloSeparationWithInterfacesAndSpring` 项目。当下拉菜单出现时，点击“Build Path -> Configure\
    \ Build Path”。当 `Java Build Path` 向导弹出时，点击 `Add Library…` 按钮。当 `Add Library` 向导弹出时，双击\
    \ `User Library`。当 `User Library` 向导弹出时，点击 `User Libraries…` 按钮。当 `User Libraries`\
    \ 向导弹出时，点击 `New…` 按钮。当 `New User Library` 向导弹出时，输入名称 `Spring 3.2.16` 然后点击 `OK`。回到\
    \ `User Libraries` 向导，`Spring 3.2.16` 用户库应被选中。点击 `Add External JARs…` 按钮。当 Jar\
    \ Selection 向导弹出时，转到解压 Spring Framework jars 的位置。双击 `libs` 文件夹。在文件夹中，高亮 `spring-beans.3.2.16.RELEASE`、`spring-beans.3.2.16.RELEASE-javadocs`、`spring-core-3.2.16.RELEASE`\
    \ 和 `spring-core-3.2.16.RELEASE-javadocs` jars 并点击 `Open`。回到 `User Libraries`，查看结果后点击\
    \ `OK`。回到 `User Library`，点击 `Finish`。回到 `Java Build Path`，点击 `Apply` 然后点击 `OK`。注意\
    \ `HelloSeparationWithInterfacesAndSpring` 项目的变化。顺便说：如果你收到任何 Oomph 弹出窗口，只需点击 `OK`。你不应该收到，但是……\n\
    \n在编辑器窗口中打开 `HelloLauncher.java`。将 `main` 内部的代码替换为下面的代码：\n\n```\nBeanFactory factory\
    \ = getBeanFactory();\nMessageRenderer mr = (MessageRenderer) factory.getBean(\"\
    renderer\");\nMessageProvider mp = (MessageProvider) factory.getBean(\"provider\"\
    );\nmr.setMessageProvider(mp);\nmr.render();\n```\n\n点击“BeanFactory with a red\
    \ squiggle underneath”最右侧带有红色 x 图标的小文件夹。当帮助信息弹出时，双击高亮的 `import 'BeanFactory' …`\
    \ 行。注意添加到 `HelloLauncher.java` 顶部的导入语句。是的，`getBeanFactory()` 仍然存在问题 - 它还不存在。将下面的方法粘贴到\
    \ `HelloLauncher.java` 的 `main()` 下方。\n\n```java\nprivate static BeanFactory getBeanFactory()\
    \ throws Exception {\n  // 获取 bean 工\n  DefaultListableBeanFactory factory = new\
    \ DefaultListableBeanFactory();\n  // 创建定义读取器\n  PropertiesBeanDefinitionReader\
    \ rdr = new PropertiesBeanDefinitionReader(factory);\n  // 加载配置选项\n  Properties\
    \ props = new Properties();\n  props.load(new FileInputStream(\"beans.properties\"\
    ));\n  rdr.registerBeanDefinitions(props);\n  return factory;\n}\n```\n\n添加缺失的导入语句以消除编辑器向你显示的错误。\n\
    \n你仍然在 `getBeanFactory()` 上存在问题。再次点击带有红色 x 图标的小文件夹。哦，这只是一个未处理的异常。注意帮助提供了两个选项。在\
    \ `main()` 中添加 `throws Exception` 错误信息，或者用 `try/catch` 包围。由于 `main` 启动应用程序，你没有选择：你必须使用\
    \ `try/catch`，所以双击那个选项。不幸的是，你现在面临 `factory` 可能未初始的问题。一个拙劣但快速的解决方案是将 `factory`\
    \ 初始化为 null：\n\n```java\nBeanFactory factory = null ;\n```\n\n你没有编译错误，所以可以运行程序。然而，你确实得到了一个文件\
    \ io 错误，因为没有 `beans.properties` 文件。这很容易修复。右键点击项目。当下拉菜单出现时，选择 \"New->File\"。当 File\
    \ 向导出现时，输入文件名 `beans.properties` 然后点击 `Finish`。\n\n你没有错误所以可以运行程序。现在你遇到了一个困惑的错误：找不到\
    \ `LogFactory`。除非你浪费大量时间阅读 Spring 文档，否则这很困惑。Spring 使用了 Apache Log4j 和。\n\n你需要从\
    \ `http://logging.apache.org/log4j/1.2/download.html` 下载 `log4j-1.2.17.zip`。使用“解压所有”或某些\
    \ zip 程序将 Spring jars 解压到 `c:\\MyCode`（或类似的地点，只要你不忘记放在哪里即可）。\n\n回到 \"Build Path->Configure\
    \ Build Path\"，创建一个 `User Library`，将 `log4j` 和 `commons-logging` 添加到库。你没有错误所以可以运行程序。但你有一个困惑的错误：找不到\
    \ bean `renderer`。然后你想起 `beans.properties` 是空的。在 `beans.properties` 中放置以下代码：\n\
    \n```properties\n# renderer\nrenderer.class=HelloRenderer\n# 让 Spring 将 provider\
    \ bean 分配给\n# renderer bean\nrenderer.ref=provider\n# Message provider\nprovider.class=HelloProvider\n\
    ```\n\n再次，没有错误所以可以运行程序。这次，你遇到了类似 \"log4j:WARN No appenders could be found for\
    \ logger (org.springframework.core.Environment)\" 的警告。经验丰富的 Log4j 用户会意识到你需要添加一个文件，并提供如下示例：\n\
    \n```properties\nlog4j.rootLogger = ERROR, myConsole\nlog4j.logger.com.spring\
    \ = DEBUG, myFile, myConsole\nlog4j.additivity.com.spring = false\nlog4j.appender.myConsole\
    \ = org.apache.log4j.ConsoleAppender\nlog4j.appender.myFile = org.apache.log4j.FileAppender\n\
    log4j.appender.myFile.file = myFile.log\nlog4j.appender.myConsole.layout = org.apache.log4j.SimpleLayout\n\
    log4j.appender.myFile.layout = org.apache.log4j.PatternLayout\n#log4j.appender.myFile.layout.ConversionPattern=%r\
    \ %p %c %x - %m%n\nlog4j.appender.myFile.layout.ConversionPattern=%-5p : %m %d{dd-MM-yy\
    \ HH:mm:ss}%n\n```\n\n右键点击 \"(default package)\"。当下拉菜单出现时，点击 \"New->Other...\"\
    。当 \"Select a wizard\" 弹出时，点击 \"General->File\" 然后点击 \"Next\" 按钮。当 \"File\" 弹出时，输入\
    \ `Log4j.properties` 然后点击 `Finish`。当 `Log4j.properties` 出现在文本编辑器视图中，将上述行粘贴到文件中。如果你没有看到任何错误，保存并关闭。顺便说：这个文件可能可能不会在\
    \ Log4j 的 myFile 中保存你想要的信息。但是，你可以测试并查看记录了什么！\n"
