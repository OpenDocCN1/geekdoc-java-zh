    在索引时，JavaScript 使用数值 `0` 来索引第一个字符。这与 `.length` 属性不同，因为 JavaScript 使用数值 `1` 来计数第一个字符。换句话说，最后一个索引值总是比长度值小
    1。


    使用存储在变量 `hello` 中的字符串，其 `length` 属性的值为 `22`，最后一个索引数字为 `21`。现在，你可能会问，为什么我们需要索引值呢？


    我们使用它来查找字符串中的特定字符。这是通过 `charAt()` 方法实现的，我们像使用 `.length` 属性一样将它放在变量之后。例如，我们想知道变量
    `hello` 中索引数字为 `20` 的对应字符是什么。我们只需要输入以下内容：


    ```

    hello.charAt(20) → “e”

    ```


    ## 使用变量创建消息


    现在你已经知道如何在变量中存储值了，让我们使用变量来创建消息吧。让我们再创建一个变量，与我们现有的变量 `hello` 结合。


    ```

    var enjoy = "Please enjoy your visit!"

    ```


    现在我们已经有了第二个变量，让我们将它们结合并创建一个新变量，作为我们的欢迎消息。


    ```

    var welcome = hello + enjoy

    ```


    每当我们调用变量 `welcome` 时，都会得到以下输出。


    ```

    welcome→"Welcome to my website! Please enjoy your visit!"

    ```


    ## 第 3 章 – 构建与运行 JavaScript


    学习变量很有趣，不是吗？然而，没有人想在控制台中编写 JavaScript 语言。在本章中，你将学习如何构建 JavaScript 文件。你还将学习如何在
    HTML 内部运行这些文件。让我们开始吧。


    ![programming](img/00010.jpeg)


    ### 创建源文件


    仅在控制台中编写 JavaScript 代码无法向用户的浏览器传达我们想要表达的内容。因此，我们需要找到一种方法将想要的内容呈现给用户。为了实现这一点，我们需要创建
    JavaScript 源并在 HTML 文件中运行这些文件。这里是最常见的 HTML 文件 `index.html` 的示例。


    ```html

    <<html><head><script src="greetings.js"></script></head><body><h1>WELCOME TO JAVASCRIPT!</h1>…</body></html>

    ```

    如你所见，我们在这个文件中使用了 `<script>` 标签。该标签命令此 HTML 文件加载特定的 JavaScript 源文件，这样访问者的浏览器就能以你想要的方式看到你的网站。注意我们在
    `<script>` 标签内部有 `src` 关键字。这是给 HTML 文件的命令，指示它去加载 JavaScript 源文件。


    在这个示例中，我们正命令 `index.html` 文件加载保存在 `greetings.js` 内部的所有变量和值。


    为了创建此 `.js` 文件，你只需要打开任何文本编辑器（如记事本或文本编辑）。在其中编写所有的 JavaScript 代码，并将文件保存为 `.js` 格式。在该文件中，我们断言希望访问者在进入网站时立即执行的所有
    JavaScript 代码。


    ### 将源文件放在哪里？


    在浏览网站的文件管理器时，你绝不会漏掉一个名为 `root/` 的文件夹。这是我们找到网站内一切内容的地方。这也是你网站 `index.html` 的默认位置。


    基于上面的 `index.html` 文件，我们指示它在同一文件夹内查找 JavaScript 源文件——即 `root/` 文件夹。因此，我们应该将 `greetings.js`
    放在同一个位置。


    ```

    + root/      - index.html      - greetings.js

    ```


    然而，有些网站会将所有的 JavaScript 源文件放在子文件夹中。它们源文件最常见的目录是 `scripts/` 文件夹下。以下是它们在你网站目录中的样子。


    ```

    + root/      - index.html      + scripts/           - greetings.js

    ```


    如果你想这样组织源文件，那么我们需要修改示例 `index.html` 中的 `<script>` 标签。你的 HTML 代码看起来应该是这样的。


    ```html

    <<html><head><script src="scripts/greetings.js"></script></head><body><h1>WELCOME
    TO JAVASCRIPT!</h1>…</body></html>

    ```

    注意，在这段代码中，我们正在指示 `index.html` 从 `scripts/` 子文件夹中加载 `greetings.js`。


    ### 在源文件中编写代码


    在 `greetings.js` 中直接编写控制台风格的表达式会导致错误。让我们尝试在源文件中编写以下几行作为例如。


    ```

    var hello = "Welcome to my website! "var enjoy = "Please enjoy your visit!"hello
    + enjoy

    ```

    一旦我们打开 `index.html` 并进入浏览器控制台，我们将看到错误之外什么也看不到。这是因为网络浏览器对你真正想要显示的内容感到困惑。错误来自我们的
    JavaScript 源文件。与控制台不同，我们需要在源文件中以不同的方式断言 JavaScript 代码。我们通过在每个语句后添加分号（`;`）来实现。因此，我们应该这样写我们的
    JavaScript 代码。


    ```

    var hello = "Welcome to my website! ";var enjoy = "Please enjoy your visit!";hello
    + enjoy;

    ```

    使用分号编写代码后，当你尝试访问控制台时将不再看到错误。然而，你会在控制台中看不到任何内容。这意味着我们的代码尚未传递到控制台。JavaScript 代码的执行仅发生在源文件中。为了解决这个问题，我们需要使用
    `console.log()` 方法。


    我们在这里想要做的是显示由 `hello` 和 `enjoy` 拼接而字符串。


    ```

    var hello = "Welcome to my website! ";var enjoy = "Please enjoy your visit!";console.log(hello
    + enjoy);

    ```

    通过使用 `console.log()` 方法，你现在可以在控制台中看到字符串了。换句话说，我们现在有一个由 `index.html` 运行的 JavaScript
    程序。


    ## 总结


    此时，你已经知道如何在 JavaScript 语言中编写值。你刚刚学习了 JavaScript 如何解释数字和纯文本，以及如何将文本转换为字符串值。你还学习了如何使用运算符和比较符将这些值转换为表达式和语句。


    在第二章中，你被引入了变量。你学习了如何在变量中存储值，以及通过拼接方法如何以变量的形式快速处理值。我们还介绍了一些方法，例如 `charAt()` 方法和
    `.length` 属性——这些都是帮助你高效分析值的工具。


    在第三章中，你学习了如何创建自己的 JavaScript 源文件。注意，与控制台相比，需要在源文件中以不同的方式断言 JavaScript 代码。你还了解
    `console.log()` 方法，它允许你在浏览器控制台中打印值。


    感谢阅读。希望你喜欢。请你提供诚恳的反馈。


