    《通俗易懂的 JavaScript》书籍系列分为几个部分，帮助你掌握这门编程语言而不会不知所措。许多初学者放弃了，因为他们认为 JavaScript 太难处理。整个系列旨在以最简单的方法带你进入
    JavaScript 的核心。


    # 第 1 章 – 认识数字、运算符和字符串


    仅仅浏览互联网就能让你接触数百万行的 JavaScript 代码。当你启动你喜爱的浏览器（例如 Google Chrome、Mozilla Firefox
    和 Internet Explorer）并开始访问某个网站时，你已经在使用 JavaScript 语言进行通信了。


    在本章中，我们将讨论 JavaScript 语言的基础构建模块。这将帮助你在之后转向 `jQuery` 等高级框架时建立坚实的基础。


    你将学习更多关于数字、运算符和字符串的知识。本章还将涵盖使用运算符操作值的不同过程，以及如何将这些值存储在变量中。最后，你学习如何在 HTML 代码中创建、运行和查找
    JavaScript 代码。


    ## 控制台 (Console)


    在进行任何操作之前，访问浏览器控制台对你非常重要。浏览器控制台是开发者工具之一，它记录与当前网页相关的信息。这些信息包括 CSS、安全错误和 JavaScript。控制台还允许你通过断言
    JavaScript 表达式来与网页交互。


    我们将在这里执行书中的示例 JavaScript 代码。你可以通过按下键盘上的 `F12` 键访问它。寻找 `Console`（控制台）标签页，现在你可以开始了。


    ![c8SPG](img/00007.jpeg)


    ## 基础数字与提示符 (Prompt)


    在开始学习 JavaScript 时，有两个符号你需要熟悉：


    - `>`：大于符号；以及，

    - `→`：箭头符号


    `>` 符号代表 JavaScript 提示符。我们所有想要输入到控制台的代码都将写在这个符号之后。`→` 符号指的是我们输入的代码所产生的结果。


    在 JavaScript 语言中，数字会被自动识别。在提示符后输入数字并按下键盘上的回车键，将得到相同的值作为结果。尝试在控制台中输入数字 `13`，它将返回相同的值。


    | `| > 13→ 13 |`


    带有小数数值的数字也是如此。


    | `| > 13.29→ 13.29 |`


    ## 运算符


    在 JavaScript 中，数学运算也是允许的。JavaScript 语法中常用的运算如下：


    - 加法

    - 减法

    - 乘法

    - 除法

    - 取模


    加法通过 `+` 号表示。


    | `| > 1 + 3→ 4 |`


    减法通过 `–` 号表示。


    | `| > 10 – 5→ 5 |`


    乘法通过 `*` 号表示。


    | `| > 2 * 9→ 18 |`


    除法通过 `/` 号表示。


    | `| > 25 / 5→ 5 |`


    另一方面，取模（Modulus）是 JavaScript 语言中的一种特殊运算。它通过 `%` 号表示。你得到的结果是两个数字相除后的余数。


    | `| > 23 % 2→ 1 |`


    在在上面的取模示例中，控制台将 `23` 除以 `2`。即使在数字 `23` 中可以除 11 次，控制台也只显示余数作为结果，即 `1`。


    ### PEMDAS 顺序


    JavaScript 编程遵循流行的数学运算顺序：PEMDAS。这个缩写代表：


    - **P**: 括号 (Parentheses)

    - **E**: 指数 (Exponents)

    - **M**: 乘法 (Multiplication)

    - **D**: 除法 (Division)

    - **A**: 加法 (Addition)

    - **S**: 减法 (Subtraction)


    让我们以以下表达式为例。


    ```

    > (10 + 5) * 3

    ```

    按下回车后，控制台将给你这个答案。


    ```

    → 45

    ```

    括号内的运算首先求解。在我们的案例中是 `10 + 5`，得到 `15`。之后，将总和乘以 `3`。因此，控制台给了你 `45`。


    让我们尝试一个较长的表达式。


    ```

    > (7 * 2) + 5 – 10 / 2

    ```

    按照 PEMDAS 顺序，表达式将如下如下求解：

    1. `7 * 2` = `14`

    2. `10 / 2` = `5`

    3. `14 + 5` = `19`

    4. `19 – 5` = `14`


    因此，控制台将给你这个答案。


    ```

    → 14

    ```


    ### 比较运算符 (Comparators)


    除了运算符，JavaScript 语言还识别逻辑运算符，我们称其为比较运算符。JavaScript 中常用的比较运算符通过以下方式表示：


    - `>`：大于

    - `<`：小于

    - `==`：等于

    - `!=`：不等于

    - `>=`：大于等于

    - `<=`：小于等于


    使用这些比较运算符在 JavaScript 中发送表达式，就像向控制台提一个逻辑问题一样。你从控制台得到的答案可能是 `true`（真）或 `false`（假）。这些答案被称为布尔值（Boolean
    values）。


    让我们尝试向控制台发送以下表达式。


    ```

    >10 != 9

    ```

    这个表达式就像是在问控制台：在 JavaScript 语言中，`10` 是否**不等于** `9`。因此，控制台将给你 `true` 作为答案，因为 `10`
    在数值上不等于 `9`。


