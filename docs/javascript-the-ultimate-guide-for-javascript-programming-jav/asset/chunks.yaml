    # Introduction


    Computers, in this generation, seems to be no longer intimidating. They are now
    becoming one of our everyday tools – allowing us to make things easier and efficient.
    Although the latest computer operations today are user-friendly, there are still
    a lot of hidden complexities. Most people will find them difficult to understand.
    Hence, this book was written for those who want to discover the maximum potentials
    of computers in the simplest way possible.


    In order to do that, you have to keep in mind that communication is a vital part
    of computer processes. This is not a process between computers but rather between
    the user behind the keyboard and the operating machine. The basic element, of
    course, is language. Learning a language like `C` will allow you to command the
    machine in the way you want and how you want it to be.


    In this book, you will learn one of the most important languages of computers
    – the `JavaScript`.


    ## Programming in a Nutshell


    Before moving on to `JavaScript`, it is vital to understand what is programming
    first.


    A computer program can be anything. The software you’re using to read this eBook
    is a program. The internet browser you use is a program. The application which
    plays your music files is a program. The game you are playing is a program. In
    other words, everything you see and you use in your computer is a program. All
    these were products of a single process known as programming.


    ![Computer-Programming2(images/00005.jpeg)


    Programming is an art. It is where programmers type a piece of text that commands
    the computer to perform specific operations. Let us take the human body as an
    analogy.


    If you are given a mathematical problem to solve, your brain has to process it.
    Depending on the scale of the equation, you might find yourself counting your
    fingers or solving a formula on a sheet of paper. In short, there are several
    bodily functions at work.


    In programming’s perspective, all these body functions are programs and your whole
    body is the machine. The mechanical counterpart of your brain is the machine’s
    memory. The equation is the data we want to process.


    Our primary goal here is to process the data. In the scenario above, that is to
    have the correct answer for the mathematical problem. For our body to be able
    to do that, your eyes need to see the problem and relay that to your brain. For
    a machine, you need a program to relay that signal to the computer’s memory.


    Going back to the human body, your eyes need to see the problem and relay that
    to your brain. For a machine, you need a program to relay that signal to the computer’s
    memory.


    ## Introducing JavaScript


    ![javascript(images/00006.jpeg)


    Before anything else, you might have been familiar with another programming language
    called `Java`. Keep in mind that `JavaScript` and `Java` have almost nothing to
    do with each.


    `JavaScript` was originally named `Mocha` and was created in `1995`. It was the
    product of 10 days of hard work of `Brendan Eich` who was, at that time, working
    at `Netscape`. The name `Mocha` was picked by the Netscape’s founder, `Marc Andreessen`.


    In September of the same year, the name of the language was changed to `LiveScript`.
    In December of the same year, its name changed once again to `JavaScript` after
    receiving a trademark license from `Sun`. Apparently, the name was a marketing
    move since the `Java` language was being heavily campaigned and becoming more
    popular during those times.


    Today, `JavaScript` is one of the programming languages that every beginner can
    easily learn. It is also a must-learn language for web developers alongside `CSS`
    and `HTML`. Web developers prefer `HTML` in defining their web content. They use
    `CSS` in specifying their web layouts. Lastly, they use `JavaScript` in programming
    their website’s behavior. And so, `JavaScript` is considered to be the programming
    language of the web.


    Even though the idea behind `JavaScript` was to give easier programming realm
    for beginners, the flexibilities offered by the language has major advantages
    to veteran programmers as well. It gives you numerous spaces for programming techniques
    that are impossible to do in more rigid programming languages. You will see more
    of these techniques later on. So if you are not new in programming but just starting
    to learn `JavaScript`, don’t hate it if it usually interprets the codes you give
    differently. You just need to be patient and be open because `JavaScript` is not
    only fun, but it will bring you to a whole new world of programming.


    ## What Can You Find In This Book?


    This book is the first part of `JavaScript in Simple Words` series. This part
    of the series features 3 chapters. The first chapter will introduce you to values
    and how to process these values in `JavaScript` language. You will learn how to
    use operators, comparators, and how to create strings. The second chapter discusses
    variables. In this chapter, you will learn how to assign values inside variables.
    You will also learn how to create versatile messages by combining multiple variables.
    The last chapter discusses the creation of `JavaScript` source files. In this
    chapter, you will learn how to write `JavaScript` codes inside the source file
    properly. In addition, you will learn how to execute this file inside an `HTML`
    file.

