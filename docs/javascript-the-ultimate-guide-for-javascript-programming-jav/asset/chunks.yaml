    allows you to print values in the browser’s console. However, this is not yet
    the most efficient way to deliver JavaScript codes. Imagine if you are going to
    deliver hundreds of values into the browser? That would mean repetitive programming
    and too much hassle.


    In the next part of the JavaScript in Simple Words series, we will bring you to
    the loops of JavaScript where you will learn how to manage repetitive coding efficiently.Several
    topics will also be discussed on the second part of the book series including,
    but not limited to, the use of conditions and the creation of dialog boxes.


    Thank you for reading. I hope you enjoy it. I ask you to leave your honest feedback.'
