    ## 比较运算符与字符串


    除了数字外，比较运算符也可以用于比较字符串以获取布尔值作为输出。让我们尝试使用等号比较运算符。


    | > “Obi-Wan Kenobi” == “Obi-Wan Kenobi”→true |


    基于上面的示例，我们得到了布尔值“true”，因为第一个字符串与第二个字符串完全相同。让我们尝试修改其中一个字符串。


    | > “Obi-Wan Kenobi” == “Obi-Wan Kinobi”→ false |


    请记住，JavaScript 语言是区分大小大小的。因此，如果第一个字符串用大写字母写，而第二个字符串完全用小写字母写；那么控制台将它们视为为不相等。


    | > “Obi-Wan Kenobi” == “obi-wan kenobi”→ false |


    ## 计算字符串长度


    在 JavaScript 语言中，你可以轻松地访问字符串的长度。这样做将命令控制台计算引号之间的所有字符，包括空格和非字母字符。我们通过在字符串后直接添加以下属性来实现。


    `.length` 命令让控制台计算其后字符串内的字符。


    这是我们的编写方式以及我们将得到什么种的输出。


    | > “Pneumonoultramicroscopicsilicovolcanoconiosis”.length→45 |


    现在让我们尝试使用一个带有空格和非字母字符的字符串。


    | > “Pink, Blue, Black, Red, Purple, White, and Green”.length→48 |


    ## 第 2 章 – 发现变量


    现在你已经知道如何在 JavaScript 语言中编写、格式化和处理数据，现在是时候学习变量了。在本章中，你将学习如何使用变量存储值。如果你不学习如何编写变量，将无法做到这一点。话话不多说，让我们开始变量世界的之旅。


    ![3_variables_write](img/00009.jpeg)


    ### 值的存储


    为了在 JavaScript 语言中管理数据，你需要将它们存储在变量中。让我向你展示一个名为“Learn Easy”的变量的基本赋值语法。


    | >varlearnEasy = 6 |


    这里的代码 `var` 指的是变量关键字。它命令浏览器为此变量预留特定的空间。下一个是 `learnEasy` 指的是变量名。这是我们将分配给这个示例变量语法的名称。这里的等号充当赋值操作符。注意我们这里只使用单等号，不同于我们之前用于比较的双双等号。最后，这里的数字
    `6` 是我们要存储在名为 `learnEasy` 的变量中的值。


    现在我们已经已经在变量中存储了一个值，现在我们可以仅使用变量名来调用它。在控制台中断言变量名 `learnEasy` 将带我们赋值的值作为其输出。


    | >learnEasy→ 6 |


    在为变量分配名称时，JavaScript 语言中有一些我们需要遵循的规则。这些规则如下：


    1. 变量名中不能有空格。（例如：`var learn easy`, `var sweet java`）

    2. 变量名开头不能是数字。（例如：`var 4life`, `var 1piece`）


    你可以在变量名中使用一些特殊字符。但最好使用简单的名称以使 JavaScript 语言不那么复杂。


    1. 你可以在变量名中使用下划线 (`_`)。（例如：`varlearn_easy`）

    2. 你可以在变量名中使用美元符号 (`$`)。（例如：`varlearnEa$y`）

    3. 你可以同时使用下划线和美元符号。（例如：`varlearn_ea$y`）


    一个良好的变量名应该是这样的。它被称为“驼峰命名法”（Camel Case），它以小写字母开头，后续单词的首字母大写。


    | >varsimpleAndClean |


    如果你喜欢重用一个变量名来存储不同的值，那么你可以在末尾添加一个数字来简化一切。


    | >varAndClean |


    ### 修改变量中的赋值值


    让我们回到示例 `learnEasy`。目前我们为它分配了数值 3。假设你想更改这个值。你可以通过输入变量名、赋值操作符，然后是你想要分配的值来轻松实现。


    | >learnEasy = 13 |


    注意这里不再使用变量关键字。这是因为控制台记得该值是存在的。一旦你调用这个变量，你现在将获得值。


    | >learnEasy→ 13 |


    你也可以使用它自己的名称更改现有变量的值。格式应该是变量名后跟操作符。它应该是这样的。


    | >learnEasy = learnEasy + 16 |


    这会将我们的值变为 29，因为该表达式调用了当前值。


    还有另一种方法这样做。我们将使用不同的语法更改存储的值。它是这样的。


    | >learnEasy += 2 |


    这里的 `+=` 操作符命令控制台将变量的当前值加上 2。然后它命令控制台将新值存储到同一个变量中。由于我们的当前值是 29，我们现在将在 `learnEasy`
    中得到 31。


    ### 在变量中存储字符串


    除了数值，你还可以将字符串存储在变量中。语法使用相同的格式。让我们创建一个变量来欢迎客人们。


    | >var hello = "Welcome to my website!" |


    将字符串存储在变量中，你不再需要输入长字符串。只需调用变量名控制控制就会给你存储的字符串。它应该是这样的。


    | >hello→“Welcome to my website!” |


    你也可以使用变量名使用长度属性。你将获得的输出值与在字符串后添加长度属性是相同的。让我们假设有一个名为 `fox` 的变量，它包含字符串“The quick
    brown fox jumped over the lazy dog”。我们只需在变量名后添加 `.length`，我们的控制台中就会出现以下行：


    | >fox.length→44 |


    ## 在字符串中查找字符


    JavaScript 语言有自己的方式来索引字符串中的每个字符。让我们以变量 `hello` 为例。


    “Welcome to my website!”


