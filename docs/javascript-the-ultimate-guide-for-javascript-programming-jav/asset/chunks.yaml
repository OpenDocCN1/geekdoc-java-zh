    # 引言


    在这一代，计算机似乎不再令人生畏了。它们现在正成为我们日常工具之一——让我们事情变得更简单、更高效。虽然今天最新的计算机操作对用户友好，但仍然有许多隐藏的复杂性。大多数人会发现它们难以理解。因此，这本书是写给那些想要以最简单的方法发现计算机最大潜能的人的。


    为了实现这一点，你必须记住通信是计算机处理过程中至关重要的部分。这不是计算机之间的过程，而是键盘后的用户与运行的机器之间的过程。基础元素当然是语言。学习像
    `C` 这样的语言将允许你以你想要的方式和按照你想要的方式命令机器。


    在书中，你将学习计算机最重要的语言之一——`JavaScript`。


    ## 编程简介


    在继续学习 `JavaScript` 之前，理解什么是编程至关重要。


    计算机程序可以是任何东西。你用来阅读本电子书的软件是一个程序。你使用的网络浏览器是一个程序。播放你音乐文件的应用程序是一个程序。你玩的游戏是一个程序。换句话说，你在计算机中看到和使用的一切都是程序。这一切都是一个被称为编程的单一过程的产物。


    ![Computer-Programming2(images/00005.jpeg)


    编程是一门艺术。程序员输入一段文本，命令计算机执行特定操作。让我们以人体作为类比。


    如果你被给你一个数学题来解决，你的大脑必须处理它。根据方程的规模，你可能会发现自己在数手指或在纸上求解公式。简而言之，有几种身体功能在工作。


    从编程的角度来看，所有这些身体功能都是程序，你的整个身体就是机器。你大脑的机械对应物是机器的内存。方程是我们想要处理的数据。


    我们首要目标是处理数据。在上面的场景中，就是数学题的正确答案。为了让我们的身体能够做到，你的眼睛需要看到问题并将其传递给大脑。对于机器，你需要一个程序将该信号传递给计算机内存。


    回到人体，你的眼睛需要看到问题并将其传递给大脑。对于机器，你需要一个程序将该信号传递给计算机内存。


    ## 介绍 JavaScript


    ![javascript(images/00006.jpeg)


    在其他事情之前，你可能已经熟悉另一种名为 `Java` 的语言。记住 `JavaScript` 和 `Java` 之间几乎没有任何关系。


    `JavaScript` 最初被命名 `Mocha`，于 1995 年创建。它是当时在 `Netscape` 工作的 `Brendan Eich` 十天努力工作的成果。`Mocha`
    这个名字是由 Netscape 创始人 `Marc Andreessen` 选定的。


    在同年的 9 月，语言的名字改为 `LiveScript`。在同年 12 月，在获得 `Sun` 的商标许可后再次改为 `JavaScript`。显然，这是一个营销手段，因为当时
    `Java` 语言正在被大力推广并变得流行。


    今天，`JavaScript` 是每个初学者都能轻松学习的编程语言之一。它是网页开发者除 `CSS` 和 `HTML` 之外必学的语言。网页开发者使用 `HTML`
    定义内容。使用 `CSS` 指定布局。最后，他们使用 `JavaScript` 设计网站的行为。因此，`JavaScript` 被认为是网页编程语言。


    尽管 `JavaScript` 的理念为初学者提供更简单的编程领域，但该语言提供的灵活性对资深程序员也有巨大的优势。它为你提供了许多在更严格的编程语言中无法实现的技巧空间。稍后我们会看到更多技巧。所以，如果你不是编程新手，只是开始学习
    `JavaScript`，如果它通常以不同的方式解释你的代码，请讨厌它。你只需要耐心和开放，因为 `JavaScript` 不仅有趣，还会带你进入一个全新的编程世界。


    ## 你在书中能找到什么？


    这本书是《简单学 JavaScript》系列的第一部分。该系列包含 3 章。第一章将为你介绍值以及如何在 `JavaScript` 语言中处理这些值。你将学习如何使用运算符、比较符以及创建字符串。第二章讨论变量。在这一章中，你将学习如何为变量赋值。你还将学习通过组合多个变量来创建灵活的消息。最后一章讨论
    `JavaScript` 源文件的创建。在这一章中，你将学习如何正确源文件中编写 `JavaScript` 代码。此外，你将学习如何在 `HTML` 文件中执行该文件。


