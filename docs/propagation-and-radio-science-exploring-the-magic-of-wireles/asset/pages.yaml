- img_proc: true
  md: '# Keeping Up With Kepler and Friends


    Unlike most aspects of radio propagation we have discussed, satellite propagation
    is pretty much like clockwork. While the ionosphere and lower regions of the atmosphere
    can affect satellite propagation to some degree, these effects are relatively
    minor. The biggest challenge for most radio amateurs when it comes to satellite
    communications is locating the satellite in the first place. Because of the ready
    availability of useful satellite tracking software, even this is not the challenge
    it used to be.


    In addition, with the plethora of low Earth orbiting satellites (“LEOs”), and
    general improvement in amateur station hardware performance, particularly on the
    receiving end, satellite communications is just downright simple. Gone are the
    days (with some infrequent exceptions) of having to steer massive dishes or complex
    arrays in the hope of achieving a fleeting glimmer of an amateur satellite signal.
    Armed with nothing more than a handheld VHF/UHF transceiver, and a handheld Yagi
    antenna, countless hams are making routine satellite communications.


    Nevertheless, understanding some of the classic problems of satellite communications
    will increase your success and enjoyment of existing satellites and modes, as
    well as any future birds and modes that may come into existence.


    # Orbital Mechanics in a Nutshell


    Figuring out satellite orbits isn’t rocket science. Oh, wait. Yes, it is, come
    to think of it! Fortunately, it’s a great deal easier to take advantage of satellites
    in orbit around the Earth than to put them up in the first place.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'By definition, any device in orbit around another is a satellite. The Earth
    is a satellite of the Sun, and the Moon is a satellite of the Earth. Commercial
    and amateur satellites (along with a lot of other space junk) are in orbit around
    the Earth, as well as.


    Once a satellite is in orbit around the Earth, there is only one force in play
    keeping it, and that is gravity. There is also one force that wants to prevent
    it from staying up there, and that''s friction.


    Now, will some protest that it is centrifugal force that''s keeping the satellite
    up there. But actually, there is no such as centrifugal force. Centrifugal force
    is merely the apparent reaction to centripetal force, which is the force that
    gravity exerts on the craft. Once the craft is in orbit, and the booster engine
    has stopped boosting, there is no change in the kinetic energy of the orbiting
    satellite. The centripetal force is always at right angles to the movement of
    the satellite, so it neither adds nor subtracts any kinetic energy from the satellite.
    In the absence of any friction (which would only occur if space were a perfect
    vacuum), any satellite would continue to orbit for eternity.


    With that physics lesson out of the way, let''s talk about things that actually
    matter to the amateur satellite operator. Orbiting satellites of any kind always
    orbit in ellipse. In some cases, the ellipse will be highly eccentric, as in the
    case of many polar orbiting satellites. In some cases, the ellipse will be nearly
    non-eccentric, or circular, as in the case of a geostationary satellite. But even
    commercial geostationary satellites have some eccentricity, which can contribute
    to a small amount of Doppler shift, which can have a significant effect on telecommunications
    links and such.


    Depending on the type of orbit (degree of eccentricity) and the plane of the orbit
    relative to the Earth, the orbital mechanics can range from very simple to rather
    complex. The simplest orbit to figure out is the geostationary orbit, where a
    satellite maintains a relative fixed position over a point on the Earth''s equator.
    Obviously, a geostationary path can only be in an equatorial plane. Unfortunately,
    the geostationary orbit is one of the most expensive orbits to obtain, since the
    bird has to be some 22,236 miles high (very approximately the circumference of
    the Earth, by coincidence only). It is unlikely anyone is going to launch a geostationary
    amateur satellite any time soon.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'Most amateur satellites are in much lower orbits than geostationary satellites,
    and can be in a plane far removed from the equatorial plane. Interestingly enough,
    the plane of any orbit will remain unchanged once the satellite is in a polar
    orbit, for instance, the plane of the orbit will remain fixed (relative to space),
    while the Earth rotates around underneath. This can, obviously enough, require
    some interesting mathematics to figure out where the satellite is going to be
    at any time relative to your location. And what is *Keplerian orbital elements*
    or “Keps” are all about.


    Keplerians are generally referred to an *epoch*, which is a specific point in
    time at which you want to know what''s happening. Since orbital mechanics don''t
    really care about man-made time zones (or even solar time of day), you will first
    have to recalibrate your time to the epoch.


    For a very detailed description of Keplerian elements, you can go to the AMSAT
    site: www.amsat.org/amsat/keps/kepmodel.html. This is highly recommended for the
    dedicated amateur satellite operator. But to get you up and running, the following
    abbreviated descriptions will give you a good understanding of how to find a satellite.
    These terms are fairly standardized on any satellite software you''re likely to
    encounter. However, there are some optional elements that may or not be required
    (or available) on some. Keep in mind the Earth is round, so you may have to alter
    your flat Earth thinking to make sense of all of these, but it''s not hard at
    all with practice!


    Epoch: As described above, this is simply the time that the data is referred to,
    generally designated as T0. (That''s T zero, not T “O”). Orbital Inclination (I0):
    Likewise, this is “I,” not I (“O”). This element is the departure of the satellite
    orbit from an equatorial orbit. Equatorial would be 0 and a polar orbit would
    be 90. However, the number you input into your software can range from 0 to 180.
    How can this be? Well, it depends on which way the orbit is “leaning.” Theoretically,
    you could assign a + for a “right lean” and a – for a “left lean,” but convention
    dictates a scale of 0 to 180 degrees.


    Right Ascension of Ascending Node (OO): While the angle of inclination tells us
    how far the orbital plane is leaning, it doesn''t tell us which *axis* it''s leaning
    around. Imagine driving a broomstick through a hula hoop at diametrically opposed
    points. If the broomstick is horizontal, the Right'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'Ascension is the "azimuth" of the broomstick. Now, even if we orient the broomstick
    based on a 360 degree circle, there will still be some ambiguity of which direction
    the satellite is in orbit...in other words, we define around the hula hoop it''s
    traveling. Again by convention, we define Right Ascension as the south to north
    direction of the satellite, based on your position on the Earth. Obviously the
    descending node is going to be on the other side of the Earth going from north
    to south. Now, keep in mind the Earth is also rotating underneath this orbit,
    so depending on the time of day at your position on the Earth, a Right Ascension
    can be a Descent. To avoid ambiguity, this plane of ascension is not defined relative
    to the spinning Earth, but to a fixed point in space.


    Argument of Perigee (WO): Since all orbits are elliptical, we need to define the
    direction the ellipse is "tilted." It''s handy to know that the center of the
    Earth will always be at one of the focal points of ellipse. This means we only
    need to define a "Non-Earth-centered" point to define which way the axis of the
    ellipse is tilted. We could use the second focus of the ellipse, which really
    has no practical significance. Instead we define the point of perigee, which is
    where the satellite is closest to the Earth. The complementary point is the apogee,
    where the satellite is farthest from the Earth. If we define the perigee, we can
    determine which way the ellipse is "leaning," This angle is, by convention, between
    0 and 360 degrees.


    (By now, you are probably wondering why there isn''t much consistency in these
    definitions. It could be said that they''re uniformly inconsistent. What we mean
    is, as some of these definitions are, everyone uses the same odds!)


    Eccentricity (E0): This figure tells you how the orbit departs from a circle.
    A value of 0 is a perfect circle, while a value of 1 is a line. This definition
    is at least consistent with the term you learned in high school geometry. (Whew!)
    This figure is simply the ratio of the minor axis to the major axis. A value between
    0 and 1 is a normal ellipse.


    Mean Motion (NO): So far, we''ve pretty well defined the orientation and shape
    of the orbit. But we haven''t said anything about how big the orbit is. The orbital
    size has the most significant effect on the period, or how often the bird will
    be visible in a given period of time. We know by Kepler''s Third Law that there
    is an inverse relationship between orbital size and period. The simplest way to
    express this is the period; that is the time it'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'takes the satellite to return to an exact location in space. This is a simple
    figure given in revolutions per day.


    Mean Anomaly (MO): While anomaly is normally associated with something abnormal,
    in this sense it means the difference between where the satellite is and some
    reference point. In this case, our reference point is the Epoch, or the starting
    time of whatever orbit’re looking at. The location of the satellite at any point
    of time is “phase shifted” from our epoch by some value. This is defined by a
    360 degree circle, with the center of the circle being at the center of the Earth.


    Drag (NI): This is an optional figure. Notice the “1” designation as opposed to
    a “0” or fundamental designation. There isn’t much you can do about this; it simply
    tells you how much each orbit is going to change from the actual owner of the
    satellite, this means a lot. Your regularly updated Keps incorporate this figure
    in their calculations.


    For the typical amateur, this is pretty meaningless, while for the previous one.
    There are a few other parameters that take into account the bumpiness of the Earth’s
    gravitational field and such, but you will probably not be too concerned with
    this, unless, again, you’re a launch mechanic.


    The ARRL and other sources provide regular bulletins of Keplerian elements. Most
    amateurs use one of the satellite tracking software packages to handle the calculations
    and even control rotators. See Figures 16.1 and


    Figure 16.2 for examples.'
  merge: -1
  pgno: 197
- img_proc: true
