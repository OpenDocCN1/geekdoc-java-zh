  pgno: 206
- img_proc: true
  md: '# Power Play


    It should be noted that the S meter had become largely standardized well before
    the adoption of coaxial transmission lines by the average ham. The standard input
    of most HF receivers was a pair of 300 Ω screw terminals, either balanced or unbalanced.


    Nowadays, of course, the nominal input impedance of a communications receiver
    is 50 Ω, not because that has any particular advantage for receiving, other than
    it allows things to be standardized across the board for 50 Ω coaxial cable. But
    let''s step back a few years and look at what, if anything, was magical about
    50 μV being S-9. We can actually thank the phone company for this.


    # Now Hear This


    When Telephone first started standardizing things, they determined that a good
    listening level for a standard telephone headset occurred with an input power
    of –13 dB (dBm is decibels relative to a milliwatt; 1 mW is 0 dBm). In fact –13
    dB is still standard operating level for twisted pair analog lines, where such
    relics still exist.


    By the S meter rolled around, the heterodyne receiver had become fairly standard.
    (You won’t find many meters on vintage regenerative receivers, for instance, though
    there might have been a few in existence). A typical superheter receiver had an
    overall gain, if you included the RF, and audio gain together, of about 60 dB,
    or a 1,000,000:1 power gain. This could be achieved with five or six vacuum tubes,
    a typical run-of-the-mill communications receiver.


    Let’s work backward from the audio output and come with some numbers. (By the
    way, –13 dB comes out to 0.00005 W). Recall that the overall power we get up to
    0.00005 W is 1,000,000:1. So we can divide 0.00005 by 1,000,000, and we come up
    with 0.00005/1,000,000 = 0.000000005 W. Now, remember, this is for an S-9 signal.
    Now, just as a sanity check, let’s work this out from the antenna end.


    A modern receiver has a nominal 50 Ω antenna input impedance. What input power
    does 50 microvolts across a 50 Ω load represent? Well, using E over R (E²/R, the
    standard power formula with a known voltage'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'and resistance), we have (0.00005 × 0.00005)/50. Lo behold, when it all comes
    out in the wash we have 50 picowatts. That seems to match up.


    Now remember, a watt is a watt. 50 picowatts is 50 picowatts. An S-9 signal is
    50 picowatts. The fact that ancient receivers didn''t have 50 Ω input impedance
    is irrelevant. An S-9 signal was the input power level, that with typical gain,
    could give you a “listenable” signal in a Bell standard telephone earpiece, regardless
    of antenna input impedance. It just turns out that with a modern receiver having
    an input impedance of 50 Ω, that because most receivers have a nominal input impedance
    of 50 Ω, we, by convention, calibrate our S meters in microvolts instead of picowatts.


    If you want to build a big speaker, you''ll have to add 30 dB or so audio power
    gain. Incidentally, a receiver with 1 W of audio power output is generally enough
    to blister paint off the walls of a typical ham shack. We won''t include this
    gain in our following discussions, but can refer to this as “outboard” gain.


    # And Some AGC


    Actually, by the time the S meter came about, most receivers had a lot more than
    60 dB of gain available, but they weren''t generally “flat out.” Almost from the
    beginning, the S meter was AGC-driven, that is, it was driven from an automatic
    gain control dc bus, which was used to automatically reduce the gain, in order
    to keep signal levels somewhat uniform. In reality, this means there''s a considerable
    amount of gain reduction for an S-9 signal in any typical receiver.


    An interesting byproduct of using AGC derived S meter readings is that there''s
    a built-in logarithmic function in the process. This log function is true of any
    negative feedback amplifier, the feedback itself is variable. The S meter voltage
    itself is a logarithmic function of the antenna voltage. This allows the S meter
    to cover a much wider dynamic range than would be possible if the S meter were
    simply a sample of headphone voltage, for instance. While the log function is
    in place any time there is AGC action, it''s a lot noticeable at the “loud” end
    of the scale, which means that below S-9, the scale can be somewhat linear, while
    above S-9, it could be highly compressed.'
