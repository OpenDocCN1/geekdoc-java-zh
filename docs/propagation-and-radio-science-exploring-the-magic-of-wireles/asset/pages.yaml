  md: '# Demystifying the Ionosphere


    It is safe to say that one of the most baffling aspects of Amateur Radio is long
    distance ionospheric radio propagation. It is also one of the most fascinating
    aspects of our hobby. And for at least a couple of generations of radio amateurs,
    ionospheric propagation was central to most Amateur Radio activity as with a focus
    of a good portion of on-air technical discussion, and with good reason.


    Like the weather, everyone talks about propagation, but nobody does anything about
    it. Despite the fact that the average ham has only a skeletal concept of how the
    ionosphere really works, for nearly a century hams have been able to effectively
    exploit this fickle entity. It might be a little audacious to suggest that we
    can demystify the ionosphere entirely. And, in fact, we probably wouldn''t want
    to, as the mystery and romance of the unpredictable radio sky is a huge part of
    Amateur Radio''s appeal.


    Nevertheless, there are a lot of things about the ionosphere *do* know, and by
    starting with a firm foundation, we can not only enjoy Amateur Radio to its fullest,
    but explore many of the more unusual aspects of Amateur Radio. It is a subject
    of inexhaustible intrigue.


    # Models and Modes


    Whenever our understanding of any scientific field is incomplete (and that much
    includes all of them), we must resort to the use of *models*. A model doesn''t
    have to be complete or even absolutely accurate in order to be incredibly useful.
    Whenever studying something as complex as the ionosphere, we need to use models
    based on what we can consistently observe, and then extrapolate them to (hopefully)
    logical conclusions.


    The ionosphere is just one such entity; there are many models to describe what
    we observe, based on what we can reproduce under controlled conditions. As you
    might suspect, however, the ionosphere is *not* a'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'controlled environment. We think know what most of the contributing factors
    to its behavior are, but there''s still a lot to learn. And that means there''s
    still a lot of work to be done by radio amateurs.


    ![](img/59293a6d87bff070066bbaf783df6263_69_0.png)


    To keep things manageable, let''s first look at some things we do know about the
    ionosphere, in no particular order.


    The ionosphere is huge. The unassisted breathable atmosphere around the Earth
    compared to the planet itself, is roughly proportional to the paper skin around
    the outside of an onion. It goes from ground level to about 5 miles. In contrast,
    the ionosphere....that part of the atmosphere responsible for doing interesting
    things with radio, is equal in volume to one third of the Earth''s volume. It
    starts at about 60 miles in altitude and ends at about 500 miles. After 500 miles
    is the useful upper limit for HF/VHF as the ionosphere decreases above the F2
    peak. This height can depend on the latitude, as well; the lines of demarcation
    between within layers is a bit fuzzy.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'The ionosphere is incredibly sparse. Despite the tremendous volume of the ionosphere,
    there is almost nothing there. Physicists at the EISCAT facility in Tromso, Norway,
    not long ago calculated the mass of the entire atmosphere...it is on the order
    of *one* metric ton. Get that. One Metric Ton. You could compress the ionosphere
    and roll it into the corner of your usable garage with a hand truck. The density
    of the outer limits of the usable level. ionosphere is on the order of a *quadrillionth*
    of the atomic density at ground level. **Figure 6.1** shows the common concept
    of the ionosphere, and **Figure 6.2** shows a much more realistic model.


    The ionosphere has weather. Since the ionosphere is *made from “normal” atmosphere*,
    it basically rides on top of it. It is not surprising that it has all kinds of
    weather-like effects — storms, turbulence, even tides. We should not be surprised
    that it''s *ever* unpredictable at times. We should be more surprised that it''s
    ever predictable!


    On the average, the ionosphere has about the same number of ions as it does free
    electrons. This may seem fairly obvious, but it is important point to remember
    that if it were not the case, “normal” ionospheric propagation would *probably*
    not be possible.'
