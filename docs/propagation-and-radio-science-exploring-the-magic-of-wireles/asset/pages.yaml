  md: '# Appendix 4


    # Locking in to Some Real Science


    It''s exciting to see the renewed interest in weak and very weak signal modes
    among amateurs, largely propelled by the advent of the “JT” modes. The well-deserved
    buzz about this family of new digital modes speaks well of the health of Amateur
    Radio experimentation. These weak signal modes allow even the most impoverished
    ham access to a realm of Amateur Radio once reserved for the most exotic research
    labs.


    Nevertheless, before we become too enamored with any technology just because it''s
    digital, we need to recognize that even the most astute bittwiddler has to work
    within the rules of physics, especially that most unforgiving rule of physics,
    the NFL (no free lunch) principle. In weak signal work, NFL manifests itself in
    the law that says the weaker the signal, the longer it takes to detect it. JT65
    is extremely sensitive, but it''s also extremely slow. At least in this universe,
    there''s no way of escaping this dichotomy. While digital and analog methods both
    approach the NFL problem from very different angles, they still end up to solve
    the same problem.


    This brings us to the relatively ancient methodology of the lock-in amplifier,
    which in certain cases is capable of detecting coherent radio signals 60 dB or
    more below the noise floor. Lock-in methods are used in everything from seismology
    to materials testing, but hold a valuable place in weak signal radio work, as
    well. Like our now-familiar weak signal digital modes, the Lock-in amplifier is
    subject to NFL; it takes a long time to do its magic.


    The happy converse of the NFL equation however is this: If you have enough time,
    you can detect anything. (Provided, of course, the thing you''re trying to detect
    sticks around long enough for the detection process to work.)


    # The Hardware'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'The lock-in amplifier is essentially the same as the IQ receiver, which outputs
    in-phase (I) and quadrature (Q) channels for use with digital signal processing
    (DSP) software. (See “Raising Your IQ” in Appendix 3.) The primary difference
    is the post detection audio filter. While normally we characterize the filter
    in terms of bandwidth, in the lock-in amplifier, we speak of *periods* or *integration
    times*. In ELF and ULF work, we may be dealing with radio frequencies on the order
    of thousands of megertz. The period of a millertz radio signal is in the thousands
    of seconds. Depending on how many cycles we wait to *integrate*, we could have
    integration times on the order of *hours*. So, basically, our receiver''s bandpass
    filters before integrators with really long time constants.


    Weak signal work, especially down in the 500 kHz experimental band, primarily
    consists of very slow CW, sometimes known as QRSS, or QRSS, or QRSSS. There are
    no firm definitions of these speeds, but by the weakest signal cases, we’re dealing
    with fractions of a character per minute.


    Now, the real tricky part of the lock-in amplifier is that the local oscillator
    to be phase coherent with the transmitted signal you’re looking for. This is,
    of course, not always practical…or even. However, with the widespread availability
    of GPS, it’s a lot more than it was in the past. It’s not too difficult to build
    a *disciplined* oscillator at the distant transmitter that is phase locked to
    a GPS satellite. The transmitter’s frequency can then be known to extreme accuracy.
    The local oscillator in the lock-in amplifier can likewise be disciplined by the
    same GPS. Short-term errors in the GPS frequency, due to Doppler shift or other
    factors, are swamped out by the very long integration times, while long term phase
    lock is maintained.


    Now, in the case of QRSSS, you have to choose your integration times carefully.
    If they are too long, you’ll end up filling the gaps between dashes and dots even
    at the slowest speeds. The integration time needs to match the symbol rate to
    some degree. There is a bit of an art form to this, so nothing replaces a little
    experience.


    # Hybrids


    Commercial lock-in amplifiers can be a bit on the pricey side. At the core they
    are simple analog instruments, but most of them are hybrids that'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'incorporate precision DDS (direct digital synthesis) to generate the local
    oscillator signals (both sine and cosine), as well as some elegant DSP in the
    output filters. In addition, the front end devices are often extremely low-noise
    semiconductors, which can be fairly expensive too. A lot of this cost can be reduced
    by “rolling your own” DDS or DSP with Arduino or similar technology, and we expect
    to see the price of lock-in amps fall dramatically as more hams apply these tools.
    In the meantime, lower-tech, all-analog lock-in amps can be built by anyone who
    is capable of building a direct conversion receiver.


    # Final Notes


    Analog technology will always be around. This is because radio itself is primarily
    an analog phenomenon. It never hurts to have a few alternative techniques in your
    toolbox. It''s always best to fit the technology to the task.


