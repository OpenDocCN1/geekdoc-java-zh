  md: 'In this discussion of polarization, we save the best for last, namely circular
    polarization. This very special case of polarization has far more application
    in Amateur Radio than commonly thought. As we will learn the sections on ionospheric
    propagation, nearly all HF signals are circularly polarized, although very few
    hams actually use circular polarization on HF


    ![](img/59293a6d87bff070066bbaf783df6263_44_0.png)


    **Figure 3.3 — A circularly polarized wave has the E and H fields in quadrature
    in both time and position.** The circularly polarized signal (CPOL) wave is extremely
    important in ionospheric communications. Nearly all linearly polarized EM waves
    entering the ionosphere split off into two counter-rotating CPOL waves, called
    the Ordinary ray, and the other being the Extraordinary ray.


    Circular polarized wave is one in which the plane of the E field (as well as the
    H field) rotates about the direction of transmission at precisely one revolution
    per wavelength of travel (see **Figure 3.3**). Think of a circularly polarized
    signal as “screwing its way through space.” It can have either right hand or left
    hand threads.


    The simplest to generate a circularly polarized (CPOL) wave is to construct two
    dipoles at right angles and feed them 90 degrees apart electrically (in quadrature).
    This is certainly not the only way of creating a CPOL wave, but it is the most
    direct and reliable.


    As turns out, most real world antennas over real earth are circularly polarized
    in *some direction*. It may be a very narrow window where CPOL is observed, but
    it is there nonetheless. (Even a simple dipole over real ground has a couple of
    slivers of radiation that are circularly polarized, as can be clearly shown with
    *NEC* antenna modeling.)'
