  md: '# The Optical Factor


    When we want to look at radio propagation in its purest form, it''s most helpful
    to refer to familiar optical phenomena. The properties of light were, for the
    most part, pretty well known a couple of centuries before the prediction and subsequent
    discovery of radio waves. You can see light directly, while a lot of the behavior
    of radio waves has to be determined by inference. We''re fortunate to live in
    the 21st century, at a time when radio waves and light are absolutely known to
    be composed of the same “stuff,” namely electromagnetic waves. This wasn''t the
    case, barely a hundred years ago, when the connection between light and radio
    waves was tenuous at best, even among the best minds.


    Although the techniques of fiddling with light differ from those used for fiddling
    with radio, sometimes profoundly, we''re still working with the same ingredients.
    To be sure, there are different priorities and significances when comparing visible
    light with “normal” radio waves (see the Appendix “Walking the Planck”), but we
    can still perfectly scale electromagnetic phenomena from dc to daylight. What
    does this actually mean? It means that the numbers are different (vast differences
    in wavelength, for instance), the behavior is the same. The actual “antenna” to
    emit visible light may be microscopic, or even atomic, but the fields and forces
    work in precisely the same manner as a wire diode used for the 40 meter amateur
    band.


    To simplify matters even further, we can use the concept of geometrical optics
    to explain many radio phenomena. By geometrical optics, we mean optics that can
    be explained entirely with a compass, a protractor, and a straight edge, completely
    ignoring any chemical or other microscopic factors. In other words we can often
    ignore the materials involved, and merely look at intuitive, familiar, and obvious
    behavior of light.


    # Mirror, Mirror in the Sky'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'A perfect example of geometrical optics is the common mirror. By the time most
    of us escape elementary school we know that for a flat mirror, the angle of incidence
    equals the angle of reflection (the Law of Reflection). By the time we escape
    high school, we probably know that this even applies for surfaces that aren’t
    flat. For example, the law applies for a spherical mirror, if we use an imaginary
    flat surface tangential to the point of reflection on the sphere. See Figure 2.1.
    In fact, the spherical reflector is a pretty good first order approximation for
    calculation of skip dances for certain types of over-the-horizon propagation such
    as sporadic-E and troposscatter, which are highly specular (mirror-like) reflections,
    which we’ll describe in detail. It’s actually a pretty model for ionospheric propagation,
    but we have to wait somewhere. For ionospheric skip, the spherical mirror analogy
    is what I’d call a half-order approximation of skip distance — assuming we can
    actually estimate the height of the ionosphere — which is a fairly complex matter
    in it.


    Since we’re going to be looking at normal propagation for the duration of this
    major section, it’s best to look at radio phenomena which are most closely akin
    to optics, which implies free space propagation in a vacuum, and relatively distant
    from interfering objects. This is one reason an antenna test range can be much
    more effective at VHF and UHF than at, HF or lower). “Free space” does not necessarily
    mean “line-of-sight” however. A radio (or light) wave in a vacuum reflected by
    a perfect mirror would be considered a free space path, but not a line of sight
    path, obviously.


    ![](img/59293a6d87bff070066bbaf783df6263_30_0.png)


    Figure 2.1 — Although true reflection is actually somewhat rare in ionospheric
    propagation, we can often simplify things by using a rudimentary concept. The
    angle of incidence is equal to the angle of reflection in a simple optical reflector,
    such as a mirror. This can also give a good first order approximation for radio
    behavior, but don’t carry the analogy too far. As Einstein once said, “Things
    should be as simple as possible, but no simpler.'
