  md: '# A Wide World for the Technician Class Amateur


    There’s a common misconception that Technician class Amateur operators don’t have
    high frequency (HF) privileges, and must wait until they upgrade to General or
    Amateur Extra status to take advantage of worldwide shortwave communications.
    This is not true. As a Technician licensee, you have “inherited” all the HF privileges
    of the former Novice class license, which affords privileges on 80, 40, 15, and
    10 meters. This is in addition to the more commonly advertised VHF and UHF privileges
    you already know about.


    Back in the day (before the codeless Technician boom in the early 1990s), just
    about every new amateur started out with a Novice license. When the Novice license
    was created in 1951, Novices had some HF CW privileges, along with CW and on 2
    meters. The license was good for two years and not renewable. In later years,
    the 2 meter privileges went away and once 10 meter data and privileges were added
    and the Novice license was renewable with the same terms as the other licenses.


    While restricted to CW operation (and later a small segment on 10 meter RTTY,
    data and SSB) and relatively low power, “old timers” worked the world on the Novice
    bands. By the time they upgraded to one of the more advanced licenses, most hams
    had a good feel for HF propagation. In fact, long before obtaining their Novice
    licenses, most hams had some experience tuning around on the shortwave bands with
    a general receiver (SWLing) and had at least an idea of what to expect when it
    came to long distance radio behavior.


    This is no longer the case. A lot of recent Amateur Radio material geared toward
    the new Technician license mentions HF as a mere footnote, if at all, while concentrating
    on local VHF and UHF operation. Most new hams have little or no idea what HF propagation
    is about;'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'fairly large proportion them have never operated a shortwave radio, even briefly.
    This is a shame, because much of the exciting stuff happening in Amateur Radio
    is on the HF bands.


    We’ll take some considerable time here to talk about what you can do on HF with
    “only” a Technician license, so you have no excuse not to explore the core of
    Amateur Radio.


    # The Code is the Mode


    Except for 10 meters, where a portion of the band is allocated to voice (phone)
    privileges, your HF Technician privileges allow for CW (Morse code) only. While
    there is no prohibition against using a computer to generate and receive CW, there
    is reason reason to learn Morse code (more officially known as the International
    Telegraph Code). Ironically enough, that Morse code is not required for any class
    of license, there is actually more high quality CW on the air than ever before.
    This is because a lot of hams learn CW because they want to, not because they
    have to!


    Besides a great deal of fun, CW can punch through poor radio conditions quite
    well, and it uses very little bandwidth. In other words, you can fit a lot of
    CW stations within a limited frequency range.


    # A Good Sampling


    While the frequency ranges of each HF Technician band are rather small, the four
    HF bands are nicely distributed throughout the entire Amateur Radio frequency
    range, giving you a wonderful sampling of each type of HF radio propagation. And
    there are vast differences in propagation characteristics between each Technician
    HF band. We’ll go into these different bands in detail so you can take full advantage
    of your privileges, whether you decide to upgrade or remain a Tech indefinitely.


    # 80 Meters: Your Friendly Local Ham Band


    The 80 meter band (3.525 – 3.600 MHz) is traditionally used for local communications
    out to around 30 miles or during the day, and quite bit farther at night. A large
    number of local and regional evening nets meet on'
  merge: -1
  pgno: 10
- img_proc: true
  md: '80 meters, often to exchange traffic via relay to other regional nets. Slow
    speed code nets can also be found within the Technician segment of 80 meters.
    Your very first HF CW contacts will quite likely occur on 80 meters.


    During the daytime, 80 meter propagation is either by direct wave (line-of-sight),
    or ground wave if you erect an antenna designed to take advantage of this mode.
    During the daytime, D-layer ionospheric absorption is very high, or even total,
    which eliminates most communication beyond the radio horizon which is about 30%
    beyond the visual horizon.


    A typical Technician class 80 meter antenna will be relatively low dipole or inverted
    V. Such an antenna produces little if any ground wave, but can be a very effective
    near vertical incident skywave (NVIS) antenna at night. More on NVIS later.


    To take advantage of 80 meter ground wave propagation, you must erect a vertical
    antenna (which can be a major challenge considering the long wavelength, and preferably
    some kind of ground system). The latter requirement depends greatly on your local
    geography and geology. Many hams, however, have considerable success with shortened
    vertical antennas, using various means of loading. Mobile operation on 80 meters
    is a popular activity, using highly abbreviated whips and a basically nonexistent
    ground. It is safe to say, however, that nearly all 80 meter daytime communication
    is by direct wave, not ground wave.


    It''s an entirely different world at night, however. As night falls, the D layer
    (around 60 kilometers in altitude) disappears. You can now take advantage of F2
    layer propagation (that layer is on the order of 250 kilometers in altitude),
    which can result in very long distance propagation. But before we go to very long
    distance, let''s talk about somewhat distance propagation, via NVIS. During the
    evening, when the D layer absorption is gone, reliable communications on 80 meters
    are available out to 100 miles radius, using simple dipole antennas. A low dipole
    transmits a good amount of its energy nearly straight up, which is then reflected
    nearly straight downward with very little loss. This is the primary mode that
    makes regional evening traffic nets effective.


    80 meters was never traditionally considered a DX (long distance) band, worldwide
    communications are possible, but you have to know what'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'you''re doing. Of course, this only happens at night, when the D layer is gone.
    But just because you don''t have a D layer, you can''t assume you''ll good DX
    propagation. Probably no band has more variation in DX capabilities over a given
    period of time than 80 meters. It''s hard to spell out any rules for 80 meter
    DX is going to be possible. However, here are some things you will want to know.


    First of all, an effective DX antenna for 80 meters will need to be a low angle
    radiator. A horizontal antenna needs to have an appreciable height to radiate
    at low angles, over typical ground conditions. It takes some dedication to this,
    of course. On the other hand, even a very vertical antenna is capable of radiating
    low angle signals, and this includes your typical mobile 80 meter installation.
    When it comes to 80 meters, a little power going where you want it is worth more
    than a whole lot of power going where you don''t want it to!


    # 40 Meters: The Default DX Band


    Your Technician 40 meter (7.025 – 7.125 MHz) privileges alone are worth having
    a ham radio license. Numerous surveys have asked seasoned hams (the human kind,
    the barnyard kind), “If you had only one Amateur Radio band, which one would you
    choose?” Hands down, 40 meters always wins. The reason is clear: 40 meters has
    more hours, days, and even years overall, where long distance propagation is available
    to some place. Even during the “dead” times of the 11 sunspot cycle, worldwide
    40 meter DX is possible. This is the reason so many high power shortwave broadcast
    stations are found on 40 meters (much to the annoyance of radio amateurs through
    the ages). Despite the interference the broadcasters cause in some segments of
    the band, hams still love 40 meters (again, for the same reason the broadcasters
    do). For the Technician class operator, all the broadcast interference is on the
    top end of 40 meters, far away from the Technician allocation. In this regard,
    Techs may actually have an advantage over higher class operators!


    Now, like 80 meters, 40 is primarily a night-time band. D layer absorption is
    high during the day (though not as high as on 80). On the other hand, ground wave
    propagation is even more difficult on 40 as the losses are extremely high. Nevertheless,
    40 meter direct wave propagation'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'is usually very good. For this reason, local 40 meter mobile nets were once
    nearly universal throughout the country, only diminishing with the advent of VHF
    FM repeaters, where antenna installations were far compact.


    Unlike 80 meters, it’s quite practical for the average ham to build a 40 meter
    dipole at a reasonable height for low-angle radiation, generally around 35 feet
    or so. “Back in the day,” most Novices worked their first real DX on 40 meters.
    Most likely, as a Tech, you will too.


    Skip distances tend to be very long on 40 meters, as the signals penetrate the
    F2 layer farther until being reflected (actually refracted) Because of the long
    skip distances, you will usually have large “skip zones” where the signal overshoots
    a large swath of real estate while it lingers in the ionosphere. This makes for
    40 very local and very distant communications…but somewhat poor between.


    Unless you NVIS! The 40 meter band is actually pretty good for NVIS most of the
    time. However, in many cases, 40 meters are above the critical frequency...that
    is the frequency at which vertical signals completely pass through the F2 layer
    into outer space. This is part of the reason 40 meters can appear to have sudden
    “blackouts.” In reality, the critical frequency has simply fallen below 7 MHz
    — usually right during the middle of a traffic net!


    #  15 Meters: Daylight Delight


    The 15 meter band (21.025 – 21.1 MHz) is a daytime DX band. It is sometimes called
    the “manic band” when propagation is good, it’s really good, and when it’s bad,
    it’s really bad. The 15 meter band can remain dead for several years of the sunspot
    cycle, only to scream to life during the solar peak. When conditions are good,
    worldwide communication is possible with extremely low power.


    An unusual feature is that 15 meters is on the third harmonic (exactly three times
    the frequency) of 40 meters. This means that a simple dipole for 40 meters will
    work beautifully on 15 meters as well. This allows the simplest two-band operation
    possible; with one antenna you get a nighttime band and a daytime band.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Unlike the “low bands” you can expect essentially zero ground wave propagation,
    no matter what kind of antenna you use. You will seldom if ever hear any local
    network operation on 15 meters. It’s really sort of an “all or nothing” band,
    where “all” means “DX.” Contacts with closer stations are sometimes possible via
    sporadic E or backscatter.


    Because of the short wavelength, a ham with limited space can build an antenna
    with appreciable gain for 15 meters. A three element Yagi, or two element quad
    for 15 meters can be built that doesn’t blot out a large region of sky...or the
    bank account. It is a great band for experimenting with antennas. We highly recommend
    Cubical Quad Notes by L.B. Cebik (W4RNL, SK) for practical, low cost ideas. See
    www.antennex.com.


    # 10 Meters: Easy HF with Elbow Room


    The 10 meter band is by far the largest chunk HF spectrum available to the Technician,
    a full 500 kHz wide (28.0 – 28.5 MHz). Not only is there a lot of elbow room for
    you and your fellow Technicians, but you can also use voice and all the nearly
    countless digital modes on parts of this band out. Effective antennas for 10 meters
    are very small, and there’s little excuse for any ham not to be get up and running
    on 10.


    Like 15 meters, 10 meters is somewhat “manic.” However, there is a lot more local
    activity on 10 during the solar “down times” than on 15. Part of the reason for
    this is day night. An 8 foot mobile whip is a very efficient antenna for 10 meters,
    and 10 meter mobile is actually a lot like 2 meter simplex on steroids. The “line
    of sight” is far greater on 10 meters than VHF.


    Again, like 15, when 10 is “hot” it’s really hot. Worldwide communications can
    be had with just a couple of watts of power, a mere fraction of the 200 W your
    Tech license allows. You can experiment with voice, data, CW, and have some real
    fun.


    One of the long-standing presences on 10 meters is 10-10 International, which
    was formed to encourage 10 meter activity back in the 1960s when going through
    some solar doldrums. The goal of 10-10 is to work 10 other members of 10-10 International,
    after which you get a lifetime “10-10 number.”'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'For the experimental minded (and cheap!) ham, it''s hard to beat 10 meters.
    Many projects over the years involved converting CB radios to 10 meters. It''s
    a great way to learn how to dig into a radio...without the danger of destroying
    an otherwise expensive rig!


    Because of the fickleness of 10 meter propagation, a large network of 10 meter
    beacons has been assembled over the years. If there''s any propagation at all,
    you should be able to tune in a beacon station, most of which are within your
    Tech allocation. Of course, you don''t need a license to listen to beacon stations.
    Listening to the beckoning beacons is a great way to learn some radio science
    in the process,


    # 6 Meters: The Magic Band


    Although 6 meters (50 – 54 MHz) is VHF rather than HF, it is often overlooked
    in the Tech literature. A lot of new HF transceivers include 6 meters, so it''s
    not as difficult as it once was to try this interesting band. It has many of the
    characteristics of both HF and VHF. Like VHF, the antennas are small, so it''s
    pretty easy to set up an effective station just anywhere. The band is also fairly
    wide, so there''s not too much crowding (except when things get really!). There
    are a number of FM repeaters on 6 meters around the country, as well. But the
    real action, as in the case of HF, is in the "weak signal" work...meaning SSB,
    CW and digital modes.


    Compared to VHF and UHF, it''s a bit easier to obtain 6 meter weak signal performance
    without being a rocket scientist. Building low noise front ends for higher VHF
    or UHF bands can be a challenge for the new ham. Six meters uses fairly common
    technology, and transmission line losses are reasonably low. Like the higher HF
    bands, 6 meters lends itself to antenna experimentation.


    You can experience a number of very interesting propagation modes on 6 meters.
    It can work in the same manner as HF, using F2 refraction. But it is also responsive
    to the lower F1 layer, as well as sporadic E. It can use various tropospheric
    modes such as ducting. You can also do exotic things like meteor scatter on 6
    meters. It is also, more than any other band, capable of using multiple propagation
    modes between distant locations. This is part'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'of the “magic” of the magic band; you often don’t know which mode is actually
    in play.


    Since the band is so unpredictable, the secret of success is just being there.
    Successful 6 meter operators are on the air a lot. Spectacular openings can be
    fleeting.


    # Final Notes


    As a Technician Class Licensee, you’ve earned your privileges. You should use
    them! If you avoid HF you are missing out on at least half the ham radio fun.
    Familiarize yourself with the entire Amateur Radio allocations and see if there’s
    something that might interest you, off the beaten path. This will keep ham radio
    forever fascinating!'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# About the ARRL


    The seed for Amateur Radio was planted in the 1890s, when Guglielmo Marconi began
    his experiments in wireless telegraphy. Soon he was joined by dozens, tens, hundreds,
    of who were enthusiastic about sending and receiving messages through the air—some
    with a commercial interest, but others solely out of a love for this new communications
    medium. The United States government began licensing Amateur Radio operators in
    1912.


    By 1914, there were thousands of Amateur Radio operators—hams—in the United States.
    Hiram Percy Maxim, a leading Connecticut inventor and industrialist, saw the need
    for an organization to band together this fledgling group of radio experimenters.
    In May 1914 he founded the American Radio Relay League (ARRL) to meet that need.


    Today ARRL, with approximately 166,000 members, is the largest organization of
    radio amateurs in the United States. The ARRL is a not-for-profit organization
    that:


    +   - promotes interest in Amateur Radio communications and experimentation

    - represents US amateurs in legislative matters, and

    - maintains fraternism and a high standard of conduct among Amateur Radio operators.


    At ARRL headquarters in the Hartford suburb of Newington, the staff serves the
    needs of members. ARRL is also International Secretariat for the International
    Amateur Radio Union, which is made of similar societies in 150 countries around
    the world.

    ARRL publishes the monthly QST and an interactive digital version of QST, as well
    as newsletters and many publications covering all aspects of Amateur Radio. Its
    headquarters, W1AW, transmits bulletins of interest to radio amateurs and Morse
    code practice sessions. The ARRL also coordinates an extensive field organization,
    which includes volunteers who provide technical information and other support
    services for radio amateurs as well as communications for public-service activities.
    In'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'addition. ARRL represents US amateurs with the Federal Communications Commission
    and other government agencies in the US and abroad.


    Membership in ARRL means much more than receiving QST each month. In addition
    to the services already described, ARRL offers membership services on a personal
    level, such as the Technical Information Service—where members can get answers
    by phone, email or the ARRL website, to all their technical and operating questions.


    Full ARRL membership (available only to licensed radio amateurs) gives you a voice
    in how affairs of the organization are governed. ARRL policy is set by a Board
    of Directors (one from each of 15 Divisions). Each year, one-third of the ARRL
    Board of Directors stands for election by the full members they represent. The
    day-to-day operation of ARRL HQ is managed by an Executive Vice President and
    his staff.


    No matter what Amateur Radio attracts you, ARRL membership is relevant and important.
    There would be no Amateur Radio as we know today were it not for the ARRL. We
    would be happy to welcome you as a member! (An Amateur Radio license is not required
    for Membership.) For more information about ARRL and answers to any questions
    you may have about Amateur Radio, write or call:


