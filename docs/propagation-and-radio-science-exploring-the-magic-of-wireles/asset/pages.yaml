- img_proc: true
  md: '# A Guided Tour


    We can start putting a lot of pieces together by following a radio wave on its
    journey from a radio transmitter to its final destination. We''ll describe the
    phenomena a radio signal is likely to encounter its often circuitous path during
    fairly normal conditions, and then do the exercise again with a few more unusual
    factors included.


    Let''s say we want to transmit a radio signal between Palo Alto, California (the
    center of Silicon Valley) and Virginia Beach, Virginia (on the opposite coast,
    but near the same latitude) on 20 meters. There''s nothing sacred about 20 meters,
    other than it''s somewhere near the middle of the HF Amateur spectrum, and has
    fairly decent daylight and nighttime characteristics. We''ll use a moderate gain
    Yagi antenna to direct most of the radio signal in the direction of interest.
    We can use a Great Circle map to tell us, within relatively wide limits, where
    we should aim our antenna. Now, it may seem, at first blush, that if Virginia
    Beach is on the same latitude as Palo Alto, we''d want to aim east. Well, this
    only works if you''re at the equator. In reality, the Great Circle path requires
    that you aim slightly north of east if you want to hit a location at precisely
    the same latitude. (If you''re below the equator, you will need to aim slightly
    south of in a similar fashion). You can easily check this out with a globe and
    a length of string. But it''s even better to use one of the many heading calculators
    available online (see Chapter 15, Software and Such). It''s pretty simple geometry,
    at least in concept. The actual calculation of Great Circle paths is a bit more
    tedious.


    Now, we need to keep in mind that a Yagi antenna is not a laser. On 20 meters,
    a typical decent Yagi may have a beamwidth of 60 degrees or so in azimuth (measured
    at the half power points), and generally an even greater beamwidth in elevation!
    This means your steering can be off about 30 degrees before the other station
    notices it.


    But, for the sake of argument, let''s assume you are steered "down the bore" of
    the station in Virginia Beach. We still have a very "tall" beam in terms of elevation.
    Our "launch angle" can vary between horizontal and well over 60 degrees! We can
    certainly base some calculations on the center of the beam, center being the elevation
    of absolute maximum signal strength. And this is quite useful for determining'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'the so-called “skip distance.” If we know the height of reflection and the
    elevation of the center of the beam, we can, to a good approximation, determine
    where it’s going to “land” after the first skip. We can use some straightforward
    geometrical optics to figure this out. And, we can even get a ballpark figure
    of how many skips it takes to get across the country if we make the assumption
    that the ionosphere is fairly uniform across its entire path. If it is high noon
    at the midpoint Palo Alto and Virginia Beach, and the ionosphere is fairly calm,
    we can consider this useful assumption. At least it will be easy to visualize
    that if we look at the wide


    "vertical fan” pattern of a typical HF transmitted signal, after every “bounce”
    the fan gets wider. The range of launch angles every return to Earth becomes greater.
    In fact, many shortwave broadcast stations take advantage of this skip, launching
    at fairly high right out of the chute as it were, so that there are no “dead”
    zones along the path between the transmitter and the target destination. We radio
    amateurs however, are more interested in getting a strong signal at a final destination,
    and not too concerned with picking up an “audience” along the way. For cross-country
    amateur operation, it’s usually an advantage to launch at the lowest possible
    so as to require the fewest skips. Of course the ionosphere dictates elevation
    angles are available over a path and the antenna’s job is to put the most energy
    at that angle, whether it be high or low. Or as we will explore later, few h pay
    any attention to the vertical launch angle of their signals, under the common
    assumption that they can’t do much about it anyway. As we will see later, there’s
    a lot under your control in this regard than commonly thought!


    # Your Friend the Ionogram


    If you operate HF, it’s never too early to learn about the ionogram, one of the
    most useful tools in radio propagation and analysis. An ionogram is a graph generated
    by an instrument called ionosonde. The ionosonde is a high frequency radar; it
    sends short radio pulses straight upward (normally) and receives the returning
    signal after reflection from the ionosphere. Each pulse is transmitted at an increasing
    frequency throughout one or all of the HF range. The X-axis scale at the bottom
    is the'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'frequency, and the Y-axis scale is the reflection height. There is a wealth
    of information that can be derived from an ionogram, and we will look at some
    of these in detail as we move along.


    The ionogram shown in Figure 6.6 is from the Boulder, Colorado, Digesinde, conveniently
    located between Palo Alto and Virginia Beach. A number of Digondes are active
    around the world, and you can find likely one relatively close to your location.
    You can often find one near the midpoint of where you are and where you want your
    signal to go, which is where it will be most useful, but this ideal state isn’t
    necessary. You can learn a lot by looking at any ionogram.


    Well, let''s take a look at this particular ionogram in Figure 6.6. As you can
    see on the X-axis, we have a scale running from 1 to 17; this is the range of
    frequencies, in MHz, that the ionosonde scans are programmed to cut off at 8 or
    9 MHz. It typically takes a minute or so for a complete scan to be performed.
    Depending on the particular site, a new ionogram is generated every 15 minutes
    or so.


    Along the Y-axis, we have a scale running from 60 to 700; this is the reflection
    height in kilometers. The Y-axis is really a flight of light, and the reflection
    height (let’s call it the “virtual height”) assumes the wave travels at the speed
    of light. This can also be reprogrammed to show lower reflections, but 60 km at
    the bottom is a very typical configuration.'
