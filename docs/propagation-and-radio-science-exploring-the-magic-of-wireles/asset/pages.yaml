    # Low Band Mysteries Abound


    At the other end of the spectrum, but in the same “sphere” we have some unusual
    happenings, too. Theoretically, ground wave communications, such as nearly 160
    meter contacts (or even AM broadcasting reception) should be utterly unaffected
    by tropospheric conditions of any kind, other than the moisture content of the
    ground caused by precipitation. For the most part, AM broadcasting within the
    ground wave region is astonishingly predictable. And yet, there is a volume of
    well-documented cases of “broadcast blackouts” where AM signals have entirely
    disappeared within line of sight.


    Several theories have been put forth to explain these outages, ranging from heavy
    particles such as magnetic monopoles or other exotic high energy oddballs passing
    through the Earth causing hugely absorptive'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'ionization at the surface, to total phase cancellation from near vertical incident
    skywave (NVIS) propagation.


    Likewise, truly bizarre propagation events on 160 meters (both good and bad) are
    observed too frequently to ignore, yet defy all “normal” explanations. Like many
    other intermittent phenomenon, we probably aren’t going to learn much by merely
    speculating on the matter whenever these events happen to show up. The answers
    will come when we deliberately set out to look for these; a process which requires
    time, dedication, and well thought out instrumentation and methods.


    Just as broadcast TV stations are valuable instruments for prediction of ducting,
    AM broadcasting is a good reliable benchmark for exploring unusual low-band openings
    as well as outages.


    One that is seldom discussed in Amateur Radio literature is cyclotron resonance,
    or electron gyro frequency, that is the natural resonant frequency of gyration
    of electrons (as well as ions) around the Earth’s magnetic fields. One of these
    resonances falls in the middle of the AM broadcast band, but there are weaker
    resonances in the 160 meter band, as well. What the exact effects of these gyro
    frequencies on Amateur Radio communication are as yet unknown, but they could
    be rather absorptive. Again, this is something that amateurs can readily explore
    with little more than some scientific discipline.


    # Distraction by Diffraction


    Most VHF denizens are familiar with the phenomenon known as knifeedge diffraction;
    its occurrence is generally predictable enough to be a “non-phenomenon.” Knife
    edge diffraction is a well-known optical principle, where when a wave encounters
    a sharp demarcation, such as a mountaintop (or a genuine knife edge), it bends
    abruptly at the boundary. This allows radio reception behind an otherwise opaque
    mountain ridge, for instance. For the most part, mountain ridges stay where they
    are, if knifeedge diffraction is observed at any time in a particular location,
    it should be available just about any time.


    It is not uncommon, however, for hams to talk about “seasonal” knife edge diffraction,
    which doesn’t really seem to make much sense. A couple of possibilities arise.
    The most straightforward explanation is that the actual'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'conductivity of the knife edge is variable...again, dependent on precipitation,
    or even nearby foliage. Another likely suspect is that the “complainant” is using
    a combination of knife edge diffraction and something else — as troposposcatter.
    When one of them goes away, as troposposcatter is want to do, so does the signal.


    No propagation phenomenon is mutually exclusive with any other. In, most practical
    long-distance radio propagation probably results from bits and pieces of many
    known phenomena.


    # The Scatter Matter


    This brings us to the matter of troposcatter, which, while related to trop ducting,
    is not exactly the same thing. Troposcatter can occur from any kind of discontinuity
    in the troposphere, not just inversion layers, as in trop ducting. However, in
    classical troposcatter, these discontinuities are microscopic…most water vapor…which
    randomly scatter VHF signals in all directions, some of which, hopefully, in the
    direction you want to go. Being far more lousy than trop ducting, troposcatter
    is a lot more reliable. It always works, but it always works poorly!


    While great distances can be achieved with legal power and high gain antennas
    (preferably at both ends), probably very few hams experience true troposcatter.
    In addition, where lower VHF will work for troposcatter, in general it works best
    above 2 GHz — high enough to be out of the range of the highly absorptive molecular
    resonance of water. In the middle of the last century, long-haul commercial and
    military troposcatter circuits were used in Alaska and elsewhere, where reliability
    took a high priority over efficiency. However, with state-of-the-art weak signal
    digital modes, such as the “JT” modes, day troposcatter may be ripe for amateur
    experimentation. On the digital modes developed by Joe Taylor, K1JT is available
    at: http://physics.princeton.edu/pulsar/k1jt/)


    # Underground Radio


    As established earlier, all ground-surface waves are vertically polarized…out
    of necessity. But what about underground radio waves — those that are launched
    entirely under the surface? Can such a thing even exist?'
  merge: -1
