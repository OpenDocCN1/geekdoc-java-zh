  md: '![](img/59293a6d87bff070066bbaf783df6263_103_0.png)


    **Figure 8.1—The Earth''s magnetic poles are displaced considerably from the true
    poles.** In addition, the north and south magnetic poles are far from antipodal.
    This gives the Earth a lopsided magnetic environment. Note also that near the
    magnetic poles, the field lines are nearly vertical (normal to the Earth''s surface
    at the entry points). Radio propagation is very different near the poles. Near
    the magnetic equator, the field is weaker, and more horizontally oriented.


    The poles are located well beneath the surface of the Earth, most likely in the
    mantle. They tend to wander about a bit, and there is some indication that they
    are in the early stages of a pole reversal; this has probably happened a couple
    of times before in human history. (It’s safe to say that probably weren''t a lot
    of hams around the last time the poles “flipped” however). The poles are best
    defined as the place where the magnetic field lines are perfectly vertical. The
    amount of vertical angle of the magnetic field at any location on Earth is known
    as the *inclination*. (In Fairbanks, Alaska, this inclination is about 15 degrees).
    The more familiar *declaration* is the difference between True North and magnetic
    North. This wanders around a bit, too. If you still know what a magnetic compass
    is, you have probably adjusted it for the declination at your home location.


    The south magnetic pole is currently off Antarctica between Adelie Land and Wilkes
    Land. Needless to say there are a few hams in the vicinity of the South magnetic
    pole than the North magnetic pole (where the highest concentration of hams per
    capita resides).


    Like many other exercises, determining the actual depth of the magnetic poles
    is extremely difficult. You can’t know the location on the surface without knowing
    the depth, and you can’t know the depth without some very interesting triangulation
    from the surface! This is the sort of ambiguity'
