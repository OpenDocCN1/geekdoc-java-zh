    # Long Path, Wrong Path'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'It’s hard to talk gray line propagation for very long without entering the
    discussion of long-path propagation. If you look at a gray line, you will notice
    it’s not really a line, but a closed loop. There are always, at least in theory,
    two ways to get from Point A to Point B along the gray line. These two paths are
    known as short path, and long path. Now the obvious question arises, is one path
    necessarily longer than the other? What’s the deal?


    As it turns out, the "deal" is pretty much just statistical. In North America,
    at least, the two possible gray line paths to nearly any DX station will be radically
    different in length. This is largely due to the fact that 90% of the Earth’s population
    lives above the equator, making things rather unsymmetrical to start with. (Since
    hams are, for the most part, a subset of humans, it probably safe to say that
    90% of the ham population lives above the equator, as well.) Now any experienced
    Dxer will tell you that the gray line is not the only place where long path can
    happen. It’s just, in general, a lot easier to do long path via the gray line.


    Now, to the best of our knowledge, there are no specific awards for working a
    DX station path. There’s no “DXCC short+long” award, we checked (though maybe
    there should be). But working a station long and short path is a great deal of
    fun anyway, and at the very least it helps confirm the notion that the Earth is
    actually round, a fact of which hams need occasional reminding.


    # Beaming with Joy


    Some of the earliest software used by radio amateurs was used for determining
    beam headings. Like the gray line map, determining beam headings is not really
    a prediction task, but on the other hand, it’s not a trivial pursuit, mathematically,
    either. If the Earth were still flat, determining beam headings would be a trivial
    matter, thanks to Christopher Columbus’ ill-conceived experiment, the Earth is
    now round, making the proper determination of a DX beam heading much more of a
    chore.


    Fortunately for all involved, there are a number of programs out there that will
    give you correct beam headings to any on Earth based on your location. You can
    order azimuth charts centered on your'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'location from a number of sources as well (for example, online at cqmaps.myshopify.com).


    If you want to go old school, you can obtain a world globe, paste a compass card
    onto the globe, centered on your location, oriented so the NORTH is aimed at the
    North Pole. Take a piece of string, and run it between the center of the compass
    card and the DX location in question. Where the string crosses the compass card
    is the direction you want steer your beam. This method is not Neanderthal as it
    may seem; such readings can be done extremely quickly with some practice.


    If you''re like most hams, you''ll probably want to use some technology from the
    current millennium. There are even logging and DX software packages, such as Ham
    Radio Deluxe, www.ham-radio-deluxe.com, that will do your beam steering for you
    with the appropriate interface.


    # Scientific Plotting Software


    A picture''s worth a thousand words. While not for the rank beginner, scientific
    plotting programs such as Matlab, Mathcad, Octave, and OriginLab can produce some
    amazing 3D images to help visualize a lot of obscure electromagnetic principles.
    Figure 15.5, a plot generated with OriginLab 9.1, with inverted the relative field
    strength versus azimuth and elevation of an inverted V antenna over real ground.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_191_0.png)


    # # Wish List


    While radio propagation software is widely available, there are still a few computer
    tools that we wish were out there. If you''re an enterprising ham or code poet,
    you might look into developing such a product. Here are a few suggestions.


    +   1) More X and O propagation tools. We mentioned that Proplab Pro is the only
    current offering. It would be nice to have an open source version with the same
    functionality, (Proplab Amateur?) not just because hams are cheap, but because
    they always like to tweak things to make them better. It has been aptly said that
    open source software is the “new homebrew.”


    +   2) Real time adaptive control. This is software that would automatically adjust
    beam headings, frequency, polarization, power levels, and other factors, based
    on feedback from the distant receiving station. Shortwave broadcasters have used
    this technology for a long time to compensate for'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'the vagaries of HF propagation. This is an area where hams can make a real
    contribution to the state of the radio art.


    +   3) “Intelligent” diversity reception methods. We describe earlier how diversity
    reception has been around for a long time, but there are digital and mixed-mode
    methods available now that can greatly improve on these tried and true methods.'
  merge: -1
