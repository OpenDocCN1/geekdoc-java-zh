- img_proc: true
  md: 'None of this feedback theory has changed in the last 70 years, by the way;
    we just use different technology to do the job nowadays! There were some really
    smart people who worked out this S meter business, and there hasn''t been anyone
    sufficiently smarter since then (that we know of) to justify abandoning it completely.


    # The Rise and Fall of the Signal Report


    It really is a shame, in light of all the thought that went into the development
    of the S meter, for most hams it amounts to little more than a hood ornament.
    While it''s true that for typical amateur communications the intelligibility of
    a signal relies more on signal-to-noise ratio than actual signal strength, the
    S meter is all important for doing anything meaningful with propagation investigation.
    At this juncture we probably need to acknowledge that the universal S-9 “contest
    report,” as annoying as it is, probably is as good as it needs to be. You either
    copy the station or you don''t.


    But that''s not what the issue is in this discussion...or in this entire book.
    Any kind of meaningful propagation study requires that you look at actual signal
    strength. And for probably 95% of our readers, the S meter is (or can, with some)
    the most accurate indicator of signal strength to be found in the amateur station.
    A small number of radio amateurs do actual, calibrated, absolute field intensity
    meters available, but these are expensive and rare devices. Fortunately, for the
    bulk of what we do in propagation studies, a sensitive, stable, and repeatable
    relative signal indicator is all we need, and the S meter fills the bill in style...with
    a few caveats.


    # Below S-9: Where the Action Is


    While some hams like the thought of their signals slamming the distant station''s
    meter (not necessarily an immense goal), when it comes to actually measuring things,
    it''s below S-9 counts. First of all, between S-0 (if your meter actually has
    such a marking) and S-9, the S meter is linear. And, furthermore, it''s directly
    related to antenna voltage. In addition, each S unit represents a halving of antenna
    voltage (6'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'dB). This is an extremely convenient scaling, by the way, for a number of reasons.


    We know that the field intensity (voltage) of an electromagnetic wave decreases
    by the function of 1/R, where R is the radial distance from the source. (Remember
    that at any significant distance from a transmitter, the wavefront of a radio
    wave becomes spherical). This means as you double R, the field strength drops
    in half, or by 6 dB, or 1 S unit. Remember the formula for decibels when voltage
    is concerned:


    ```

    dB = 20 log(V1/V2)

    ```


    When using dB to express voltage ratios, also recall that both V1 and V2 have
    to be the same impedance.


    You will also recall that the available power attenuates as the inverse square,
    so each S unit represents a power ratio of 4:1. However, voltage is much easier
    to measure directly than power, so for our purposes voltage ratios are perfectly
    fine to use. We just have to be sure that comparative measurements are made using
    the same impedance, in this case the input impedance of our receiver.


    # Real Receivers


    We need to recognize that the 50 Ω input impedance of a receiver is a nominal
    value. In the case of most modern, broadbanded, solid state HF receivers, the
    actual input impedance of a receiver is pretty close to that. You can easily verify
    this if you routinely use an antenna tuner with a transceiver. If you tune your
    antenna tuner for the best received signal of a distant station, it will also
    be a good match to your transmitter. As they say, your mileage may vary. However,
    at any frequency, the input impedance of a receiver will be the same regardless
    of input level — up to the point where the front end saturates. For measurement
    purposes, we will be operating well below this point.


    Older vacuum tube receivers may have much wider variations in antenna input impedance,
    especially from band to band. This is one of the main reasons the S meter achieved
    a bad rap once hams entertained the notion of obtaining actual absolute field
    strength measurements. You couldn’t really'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'derive actual antenna input power without knowing what made the input impedance
    was. Hold that thought for a moment.


    # Infinite Impedance


    One of the ways you can accurately measure field intensity without accurately
    knowing the load impedance of the receiver is to use a receiver with infinite
    input impedance. In reality, this is the ideal instrument. The-called "active
    antenna" closely approximates this ideal. Basically we want to create a voltage
    probe that samples the electric field intensity of the incoming radio wave without
    disrupting that radio wave. This is the same principle of using a high impedance
    voltmeter to measure high impedance electronic circuits. In an active antenna,
    there is no effort to achieve impedance matching; its purpose is merely to "sample"
    the radio wave.


    This is decidedly different from your impedance matched receiver, where the goal
    is to extract as much power as possible from the incoming radio wave, in to maximize
    the sensitivity of the receiving system.


    Let us return to our vintage vacuum tube receiver with the widely varying input
    impedance. Is it still possible to make valid field intensity measurements with
    such a beast? A qualified "yes" would be the answer. We can certainly make valid
    relative measurements. In most propagation studies, we only need to know the direction
    (sign) and degree of change of signal strength. If we can consistently demonstrate
    that a 2:1 change of field intensity results in 1 S unit of change on our S meter
    (at one given frequency) we can have a powerful instrument.


    One of the most reliable means of independently verifying the linearity and scaling
    of an S meter is by using calibrated RF attenuators. A number of excellent switchable
    (ladder) attenuator projects have appeared in QST magazine and the ARRL Antenna
    Book over any dedicated experimenter should have a precision attenuator in the
    shack. It also helps to have a well-calibrated RF signal generator around, but
    this isn''t absolutely necessary if you have a steady radio signal available,
    as from WWV.


    What you want to do is simply see if switching in 6 dB of attenuation results
    in a change of 1 S unit, at your frequency of interest. Ideally, you want to test
    this out for every increment between S-1 and S-9. If your'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'meter does not track your attenuator settings, you have several options. One
    of these is to build up a calibration chart. This is simply a spreadsheet or graph
    that shows S meter reading corresponds to which actual amount of attenuation.
    This can be a bit tedious to develop a calibration chart, but this sort of thing
    was standard practice in lot of ham shacks (and professional labs) long before
    computers were around.


    Another alternative is to use only your attenuators. The way to do this is to
    always adjust your attenuators to achieve some S meter reading, say S-6. As the
    signal under test changes, you simply adjust your attenuators to retain an S-6
    reading. The amount of attenuation you add or subtract will be equal to the actual
    variation in signal strength. This is probably the most reliable method, since
    the linearity of the S meter circuitry becomes irrelevant. The downside is that
    it can be a bit inconvenient from an operational standpoint.


    # Swampland


    We mentioned above that one way to make the receiver input impedance irrelevant
    is to use an active antenna with infinite impedance. Another method is to pad
    down or “swamp” the front end of the receiver with lots of fixed attenuation.
    This method greatly levels out the input impedance of the receiver, but at the
    cost of greatly reduced sensitivity. Again, for measurement purposes, we aren''t
    trying to achieve maximum sensitivity; we just need enough signal to make valid
    measurements.


    By the magical means of swamping, even the most decrepit boat receiver can exhibit
    an astonishingly flat front end. The liberal use of padding and swamping is standard
    practice in the microwave industry, by the way. Most microwave directional couplers
    and filters require the generous use of padding to function properly. Efficiency
    and precision are pretty much inversely proportional to the microwave lab!


    # It’s All Relative


    From a purely practical standpoint, as radio amateurs, we want to know if Action
    A results in Result B getting better or Result B getting worse. We want to know
    if doing a certain tweak improves or degrades some aspect of performance, and
    by how much.'
