    # Circular Reasoning


    For the above reasons, and others as well, many hams use circular polarization
    for satellite communications. A circularly polarized ground station antenna doesn’t
    care what polarization the satellite’s signal is. One of the most common uses
    of circular polarization is when you don’t have the desire or capability of tracking
