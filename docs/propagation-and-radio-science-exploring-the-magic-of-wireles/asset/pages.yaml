- img_proc: true
  md: 'To further define our conditions, we''d like to borrow the concept of lumped
    constants from the electronic circuit world. In other words, for the sake of normal
    propagation, we will consider a mirror, say, to exist at one discrete location,
    not distributed over a large volume of space. In contrast to this model, ionospheric
    propagation consists almost entirely of distributed components. The ionosphere
    is not a reflective surface like a mirror, but rather resembles a very, long (and
    lossy) three-dimensional transmission line. This is why we will not include ionospheric
    propagation in this normal propagation section! There is nothing “normal” about
    ionospheric propagation, even under the most normal of circumstances!


    # In Prism


    Of course, the mirror is not the only common optical component. The prism is probably
    the second most familiar optical device next to the mirror. A prism can come in
    several forms; it can be a wedge-shaped piece of glass or plastic, or it can be
    a collection of water droplets, which, as you have guessed, create the rainbow
    after a shower. The prism works on the principle of refraction rather than reflection.
    Refraction is the bending of radio or light waves as a result of moving from one
    medium to another. Electromagnetic waves slow down when they encounter a new medium,
    and if they encounter the medium at an angle, the waves will be bent away from
    their axis. The amount of bending is a function of the refractive index of the
    medium (or more accurately, the change of refractive index between the two mediums).


    # Dispersing Some Misconceptions


    We need to be careful here to distinguish between plain refraction and dispersion.
    The property of a prism separates white light into the colors of the rainbow is
    both refraction and dispersion. Refraction is the bending of light rays through
    a change of medium, while dispersion is the selective bending of light waves with
    respect to their wavelengths.


    Refraction and dispersion are not the same phenomena, but they occur commonly
    together in many substances that they are erroneously used interchangeably. You
    can’t have dispersion without refraction, but you can'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'have refraction without dispersion. In fact, most high quality lenses are specifically
    designed to have refraction without dispersion...such devices are called achromatic
    lenses. They are designed to create focused objects, not rainbows!


    Likewise, in radio, both refraction and dispersion are important concepts, but
    they must remain distinguished from one another! Like the prism, the ionosphere
    is both refractive and dispersive....among a lot of other things. Again, we''ll
    save this for later.


    # Let’s Make This Plan


    Before we get too dispersed in our talk talk a little bit about rays. Like many
    other concepts in physics, the ray is a purely mathematical construct. There are
    no such things as rays...either light rays or radio waves. They are useful models
    to demonstrate the flow of power from a source through space, but they can be
    misleading without some interpretation.


    Radio waves (and again, we can always replace radio with light), generally attenuate
    (get weaker) with distance, even in a perfect vacuum with no material to absorb
    the energy. This is a result of geometric attenuation which results because the
    “rays” (note the quotes) move away from the source in a spherical manner. If you
    start out with a given amount of energy, and the energy encompasses a larger sphere
    as it moves away from the source, the energy per square foot of sphere must decrease
    with distance. This is why the radiation from the Sun decreases with distance.
    The Sun is essentially an “isotropic radiator” that emits energy equally in all
    directions. (This is only strictly true in the larger sense....at great distances
    from the Sun. Close to the surface, the radiation of the Sun can be very directional,
    but that’s irrelevant to this discussion.'
