  md: '# Polarization, Gain, and other Antenna Matters


    So far, our discussion of free space wave propagation hasn’t mentioned much about
    wave *polarization*. In a lot of Amateur Radio literature, the topic is either
    largely ignored, or otherwise subjected to a great deal of misinformation and
    tortured “explanations.” In the following section, we will devote more to the
    normal amount of time exploring this important topic, as it is one of the areas
    where amateurs are most likely to be able to contribute to the state of the radio
    art, as well as to take advantage of the proper use of polarization for best communications
    effectiveness.


    # But First, Some Definitions


    A “normal” electromagnetic wave consists of two plane waves, oriented at right
    angles, and electrically *in phase* as shown in **Figure 3.1**. These two orthogonal
    components are the electric component and the magnetic component (shown as vertical
    arrows and horizontal arrows, respectively), and their interplay results in an
    *electromagnetic (EM)* wave, logically enough. The velocity of an electromagnetic
    wave in free space is very close to 300,000,000 meters/second, independent of
    the frequency of the wave. For the sake of this preliminary discussion, we’ll
    limit our study to waves in a vacuum, where all the relevant characteristics are
    consistent and predictable.'
