- img_proc: true
  md: 'In Chapter 3, we described the depressing radar equation and how it applies
    to reflections from relatively nearby objects. When considering moonbounce, we
    need to extrapolate the depressing radar equation even further. The typical path
    loss for an EME (Earth-Moon-Earth path is on the order of 250 dB. That''s an awful
    big amount of loss!


    Now, here''s something quite interesting. A polished metal sphere, regardless
    of diameter, has a radar cross section of essentially a pin point. Geometrically,
    this is very simple to visualize. If you shine a laser pointer at a 3 foot diameter
    polished steel sphere in a dark room, the only time you''ll see a reflection is
    when the beam is *precisely perpendicular* to the surface of the sphere! Any reflection
    from anywhere dead center is scattered somewhere else, and you''ll never see it.
    The effective “size” of the sphere is essentially zero.


    Now, if this is the case, how do we get *anything* back from the Moon? As it turns
    out, it''s the roughness of the Moon''s surface saves the day! No matter where
    a radio signal hits the Moon, the rough surface is going to *reflect of* it in
    the same direction it came. If we have millions and billions of little crevice
    and bumps, even if they scatter most of the signal somewhere else, there will
    be a certain quantity (statistically speaking) that bounce back toward the *source
    in phase*. In effect, the Moon, as far as radar goes, looks *nearly the same size*
    as a disk of its diameter.


    Now, the downside of this is that the Moon is not too stationary. It tends to
    “rock” in its orbit, which means the relative distance of all the countless reflecting
    surfaces change slightly, causing the relative phasing of the reflected waves
    to shift. This is called *libation fading*. And, as annoying as it is, it''s a
    small price to pay for no detectable reflection!


    Now, here''s just one more little in the works. The subtended angle of the Moon
    is about half degree. What we mean is that if you stood in your backyard and took
    a protractor and measured the angle difference between the “east side” and the
    “west side” of the Moon, you''d have a half degree. Now, a really good Moonbounce
    antenna may have a half-power beamwidth of about a degree. This would be a world
    class installation with perhaps a 30 foot dish. Most moonbouncers are probably
    using antennas with between 1 and 2 degrees of beamwidth. This means the Moon
    only intercepts a fraction of its direction. So, this makes the Moon appear a
    little “smaller” than it would with a perfectly'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'matched beam pattern. Again, this “slop” actually makes it a little easier
    to find the Moon in the first place, but it does contribute materially to the
    signal loss.


    Despite all of this, hams have been doing moonbounce for about half a century.


    The article, “EME on a Budget: Moonbounce for the Rest of Us” by Paul Bock, K4MSG,
    gives some valuable insights into this. See [www.k4rg.org/Projects/K4MSG_EME/](www.k4rg.org/Projects/K4MSG_EME/).


    # Really Out There


    No chapter on space communications could be considered complete without at least
    passing mention of deep space radio. Radio amateurs are *still* receiving radio
    signals from Voyager 2, the deep space probe launched in 1977, and now traveling
    through the *magnetosheath* region of the outer regions of our solar system. This
    is astonishing even the most jaded science geek. While it speaks volumes about
    the technology, it is also a testament to the amazing nature of electromagnetic
    radiation itself. Theoretically, it’s possible to receive a radio signal forever;
    its strength keeps dropping off as a square of the distance for infinity. Of course
    there are *practical* limits to this, but it still never ceases to astound, how
    well radio works!


    It is probably not out the realm of possibility that fully “Mars bounce” should
    occur. This obviously would require some serious signal processing — not to mention
    some really long integration times — but the government has been talking to Mars
    craft for a long time. It’s really only a matter of scale.


    # Practical Pointers


    On Earth, let us tie up some loose ends with regard to Kepler. As we explained,
    Keplerian elements will tell you where to need to point your antenna to hit your
    satellite of interest. It’s one thing to know where to point your antenna. It
    may be another entirely to actually be able to do it.


    When working with a very large array (especially one you built yourself), it’s
    easy to assume that the main lobe of the antenna is physically where the antenna
    is pointing. For a single high gain Yagi, this is probably reasonably'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'true. The fact that countless hams are talking to birds with hand held Yagis
    testifies to this.


    Some more exotic satellites (such as the Moon!) may need a little more elaborate
    means of antenna pointing. For instance, a large array of phased Yagis (a rather
    typical moonbounce setup) requires very close matching of the phasing harnesses
    and such. It doesn’t take much error to throw the main lobe several degrees off
    where you think the thing should be pointing. (This applies to any phased array,
    actually.) Aiming by “eyeball” you can still miss the Moon entirely, unless the
    array is extremely well constructed.


    One way you can verify the alignment of your antenna is by using the Sun as a
    noise source. If your receiver is adequate for receiving moonbounce, it is certainly
    capable of receiving solar noise. Peak the antenna for maximum solar noise, and
    use that to boresight the Sun optically (using adequate eye protection, of course!).


    Traditionally, a sighting tube was used to align an antenna with the Moon. However,
    inexpensive and sensitive tower-mounted CCD cameras make the whole process that
    much easier. You can steer the array from the comfort of your warm shack, rather
    than standing out in the yard at the foot of the tower, staring up through the
    bore sight, screaming at your assistant (if you can find one), poised at the rotator
    controls.


    # Where to from Here?


    The predictability and reliability of satellite communications can give the impression
    that there really isn’t much to learn about radio propagation, at least compared
    to HF radio, for instance. This assumption can be deceptive, however. Subtle effects
    such as Faraday rotation, scintillation, and even fading, reveal some fascinating
    things about our universe. It is precisely because satellite communications are
    so predictable that they form a great reference point for observing the new and
    unique. Insatiable curiosity and a scientific mindset will keep amateur satellite
    activity exciting for a long time to come.'
