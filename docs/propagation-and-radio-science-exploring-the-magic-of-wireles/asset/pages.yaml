- img_proc: true
  md: 'ease of ionization, and volume of ionizable particles. The result of this balance
    gives us the all-important electron density profile seen in the ionogram in Figure
    6.3 (more on ionograms in a later section). We see that there''s a definite peak
    in the concentration of free electrons at a specific altitude, typically around
    250 kilometers at local high noon. This height can be highly variable, as well
    as the actual concentration at that height, which adds to the interest of ionospheric
    propagation.


    Another fascinating aspect of this, one that has only recently confirmed by *in
    situ* sounding rocket measurement, is that the ion density almost exactly tracks
    the electron density profile. This strongly suggests that the electrons never
    stray far from the ions from which they are separated. Of course, we already described
    how something like this would be necessary in order to have a well-defined reflective
    layer, rather than willy-nilly globs of random electrons floating around.


    We need to re-emphasize that at no point in the ionosphere we have nothing but
    electrons, or nothing but ions. Every electron comes from somewhere, and that
    somewhere is a nearby atom or molecule. The density profile shows us the concentration
    of ions and electrons at a certain altitude, but they are still mixed in neutrals.


    # A Truly Magnetic Personality


    No explanation of the ionosphere is truly possible without considering the Earth''s
    magnetic field. For decades, most amateur literature has ignored the importance
    of the Earth''s magnetic field, and as a result most has have attributed many
    weird behaviors of the ionosphere to just the nature of the beast. As we turn
    out, the bizarre things we see in the ionosphere are explained, or at least simplified,
    when you consider the Earth''s magnetic field.


    The primary effect of a magnetic field on a plasma (a region of ionized gas) is
    that the plasma becomes birefringent. This means there are two refractive indices,
    and they exist simultaneously. These two refractive indices are dependent on the
    *direction* of radio signals passing through the plasma. A radio signal passing
    through a birefringent medium becomes circularly polarized, as well, with one
    mode the (*ordinary* or O-mode) ray spinning one direction and the *extraordinary*
    or (X-mode) ray spinning the'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'opposite direction. This has profound effects on radio propagation. Here are

    just a few of the more common ones:


    +   * The ionosphere is no longer reciprocal. The old radio “wisdom” that

    there is no thing like one way propagation is rendered invalid. In fact, as

    we shall see, in the strictest sense, one way propagation is the *norm.*

    * Great Circle routes are increasingly meaningless as you approach the

    Earth’s magnetic poles. This is more obvious to anyone who has ever

    operated in Arctic regions!

    * All ionospherically refracted signals become either X or O waves,

    frequently. There is no other option, unless the entire path happens to

    precisely along the magnetic equator — a virtually impossible condition.

    * X and O waves can take radically different paths, although this depends on

    frequency. At the higher end of the HF bands (say 28 MHz), the O-wave

    and X-wave paths are very similar (as absorption). At the low end (say

    1.8 MHz), they are not. Compare the ray traces from Propl Prop

    propagation software in Figure 6.3 (10 meters) and Figure 6.4 (160 meters).

    There can be a tremendous advantage, therefore, to using circularly

    receiving antennas.


    # Specifics About Species


    In Plasma physics, the primary science behind the ionosphere, one uses

    t term *species* to describe the actual type of neutral or atom with which

    one is dealing. Most Amateur Radio literature doesn’t spend a lot of

    tabout whether we’re ionizing oxygen or nitrogen, or some other

    molecule or atom. There’s a good reason for this. It doesn’t really matter

    too much. The main ingredient of radio interaction is the free *electron*,

    really don’t care where the free electron comes from. We’d gladly take a

    free electron or from any species willing to give it up!


    However, certain phenomena we observe, such as the differentiation

    between the F1 and the F2 layers are the result of different ion species. The

    F1 layer, being lower, consists of generally heavier species such as oxygen

    and nitrogen, that don’t ionize very easily, and thus is not seen

    frequently. The F2 layer, on the other hand, consists of helium, hydrogen,

    and noble “neon light* gases which are much more easily ionized, and tend

    to hang around longer after ionization, thus the F2 layer is available for'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'more hours than the F1 layer. The F2 layer is primarily caused by the ionization
    of oxygen atoms, with recombination due to molecular oxygen and molecular nitrogen.


