  md: 'As in the case of a dipole, a CPOL radio wave will transfer the maximum power
    when the receiving antenna is matched to its CPOL polarization. The equivalent
    of “cross polarization” for a CPOL antenna is circular polarization of the opposite
    sense or “handedness.” A right hand CPOL antenna is cross-polarized with a left
    CPOL antenna.


    On the other hand, a CPOL antenna of either sense does not know (or care) about
    the polarization of an incoming plane polarized wave. It is this property that
    is most used by radio amateurs, especially for satellite communications. Having
    a “polarization blind” antenna makes a lot easier if you don''t know what the
    polarization of the incoming wave, or if that polarization happens to be slowly
    changing. (By the way, slow rotation of the plane of polarization, such as Faraday
    rotation, is absolutely not the same thing as circular polarization! To be circularly
    polarized, the rotation needs to be synchronized with the wave travel, as described.)
    However, this technique only works if the incoming wave is plane polarized. If
    it happens to be CPOL, then you must match the sense of your receiving antenna
    to that.


    Conversely, a simple dipole does not care about the sense of a CPOL wave. (It
    is this fact that accounts for the fact that very few hams know that HF signals
    are circularly polarized. We will discuss this at length in upcoming chapters).


    # Let’s Reciprocate


    We need to re-emphasize that all this electron wobbling is entirely reciprocal,
    as are all the other aspects of polarization we discussed. An EM wave accelerates
    electrons; an accelerated electron generates an EM wave. The direction of the
    electric field of an EM wave so generated is in the direction of the electron
    acceleration.


    In free space, reciprocity is absolute and universal. However, it’s important
    to not “over-apply” this principle to non-free-space situations. There are many
    other non-reciprocal factors that can occur along the path between two perfectly
    reciprocal antennas.


