  md: 'Death Valley, California, even with a 200 foot tower, what with his mile-plus
    height advantage. We know that''s not the case!


    The real advantage of having a really tall tower (at least that you are up high
    to take advantage of far field ground reflections, plus being up high to avoid
    lossy ground coupling (near field induction and capacitive losses). As it turns
    out, you really need to be close to the “legal limit” of 200 feet to take advantage
    of this. Amateurs who want to construct an antenna structure more than 200 feet
    must notify the FAA and register the tower with the FCC to avoid unknowingly creating
    hazards to aircraft. Additional restrictions apply if the antenna is within about
    4 miles of a public use airport or heliport.)


    For simply taking advantage of near field reflections for lowest launch angles,
