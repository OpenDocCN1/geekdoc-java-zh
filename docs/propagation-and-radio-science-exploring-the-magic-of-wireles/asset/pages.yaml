  md: '![](img/59293a6d87bff070066bbaf783df6263_33_0.png)


    One notable exception to the spherical wave phenomenon is the laser, which emits
    coherent and collimated (parallel) rays that undergo little or no geometric attenuation
    with distance. In reality a laser consists of trillions of atom-sized antennas,
    each of which emits a spherical wave, but when all these are combined in proper
