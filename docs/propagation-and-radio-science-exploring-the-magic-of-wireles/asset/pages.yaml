    # # Tipping the Scales


    When looking at the process by which electromagnetic (EM) waves accelerate electrons
    and, conversely how accelerating electrons create EM waves, the question may come
    about wavelength and frequency. For most Amateur Radio purposes, the wavelengths
    involved are so huge compared to the size of electrons that for free space propagation,
    wavelength is irrelevant. It is only when EM waves approach the'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'dimensions of atoms (such as in visible light) that we need to worry much about
    scaling factors...that is the amount of energy as a function of frequency. This
    is all neatly tied up in a figure known as Planck''s constant, which is fairly
    irrelevant to Amateur Radio frequencies.


    Any practical radio wave is going to trillions of times larger than the dimension
    of an electron, so we can safely simplify a lot of things, at least when free
    space conditions prevail. At visible light and shorter wavelengths, on the other
    hand, physicists speak of the relationship between energy and frequency...we can
    actually ignore that. Radio waves have amplitudes and frequencies, and they are
    independent factors. We can have any combination of frequency and amplitude we
    desire, with no complicated scaling factors to contend with. For more on this,
    see the Appendix article “Walking the Planck.”


    # Chorus Line


    When one defines a certain material as being a good conductor, it''s generally
    meant that the material has a lot of free electrons. While this is true, it''s
    not a complete picture. Yes, we need free electrons in order to have an electric
    current, but those electrons need to have a somewhat unobstructed path in order
    to be of much use, at least as far as we’re concerned.'
