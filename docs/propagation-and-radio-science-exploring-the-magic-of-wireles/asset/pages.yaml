  md: '![](img/59293a6d87bff070066bbaf783df6263_90_0.png)


    Figure 6.7 — This ionogram shows for f01 at 4.4 MHz (the small inflection in the
    electron density profile) as well as the obvious F2 layer peak at 10.6 MHz. [courtesy
    Carl Luetwelschab, K9LA]


    Now shouldn''t it a rocket scientist to conclude that if the F layer retreats
    on the dark side of the Earth and advances on the daylight side, the entire ionosphere
    cannot be truly spherical? And, in addition, it has to have a pretty big bit somewhere
    along the line. The net result of this is that if you launch an HF signal from
    the daylight side of the Earth into the nighttime side (or vice versa), the vertical
    angle of arrival will be much different than the vertical launch angle! Again,
    some simple geometry prevails.


    This factor is not noticed by hams, since, as we indicated earlier, very few are
    aware of or equipped to systematically deal with different vertical angles of
    arrival. As we delve into this more, however, we will find that, for the average
    HF operation, the control of antenna elevation may be every bit as important,
    or even more so, as azimuth control!'
