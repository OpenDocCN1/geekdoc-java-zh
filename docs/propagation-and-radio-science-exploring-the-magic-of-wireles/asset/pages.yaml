  md: 'Hopefully, this earthly little example has shed light on who''s the chicken
    and who''s the egg when it comes around to fields and forces. It''s largely determined
    by where any component is in the pecking order.


    # Newtonian Mechanics and Other Delights


    It''s very fortunate that a great deal of what we observe when it comes to electromagnetic
    waves can be described by old fashioned Newtonian mechanics. Concepts such as
    work, power, energy, acceleration, and mass all have their counterparts in the
    invisible world of radio propagation. We can do a lot of shuffling around particles
    and waves because of this our wonderful symmetry. So, whenever we can use a mechanical
    analogy, we will. Again, we need to remember that a model is not perfect, but
    it''s extremely useful.


    One of the guiding principles of Newtonian mechanics and electromagnetism is:
    force (f) equals mass (m) times acceleration (a), expressed in the familiar equation:


    $f=ma$


    We can use any system of units for the particular terms, as long as we''re consistent.
    Force can be in pounds or Newtons; mass can be in slugs or kilograms; and acceleration
    can be in miles per hour, or feet per second squared, and so on. (Nobody has ever
    satisfactorily defined a square second, though!)


    The reason this equation is so important is all radio waves are the result of
    charged particles. Particles have mass, they are accelerated by a force, and the
    overall result is the product of the force and the mass. As we move into antenna
    theory a bit, we will see that mysterious entities exist as radiation resistance
    exist because we are doing real work on real particles.


    # It''s a Complex World


    It''s rather unfortunate that we use terms such as “imaginary” and “complex” to
    describe mathematical methods that are inseparable from not only Newtonian mechanics,
    but radio itself. In fact, these mathematical'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'concepts greatly simplify some basic physical behaviors that would be nearly
    impossible to describe by any other means. Sure, you can describe the motion of
    the planets from the point of view of the Earth being the center of the universe
    (as was once thought), but it’s much simpler to describe planetary motions with
    reference to the Sun. Likewise, the imaginary and the complex number were not
    invented to make high school math more miserable; they were invented to, in the
    simplest terms, describe the universe as it really is. So, it’s best to just swallow
    the live load and learn how to work with complex numbers. Because...


    # Direction Matters


    When applying Newtonian mechanics to charged particles and other entities of interest
    to radio, we have to know not only the magnitude (size) of the particle acceleration,
    but also the direction. In the real world, objects can be subjected to several
    forces at once, so we also need to resolve the net force applied to any piece
    of matter. See Figure 1.1. The direction of acceleration of any matter is always
    in the direction of the net force, but this doesn’t necessarily mean the net force
    (and acceleration) is in the same direction as its current movement. In fact,
    an electron in orbit around a nucleus is in a constant state of acceleration —
    yet no energy is gained or lost because the acceleration is always at right angles
    to its movement. This condition is precisely and concisely described by the imaginary
    number.


    We will, in addition, discover that just about everything in the universe comes
    in what’s known as orthogonal pairs, that are values of some physical that are
    at right angles to each other in either space or time. Though these orthogonal
    pairs are related, it’s also possible to totally isolate each component, not only
    mathematically, but physically. We will see this in action as we describe the
    oscillating orthogonal electric and magnetic pairs of a propagating radio wave.
    In this regard, we will find that radio waves are complex, but they aren’t complicated.
    Stay with us for a while, because this is actually some very neat stuff!'
