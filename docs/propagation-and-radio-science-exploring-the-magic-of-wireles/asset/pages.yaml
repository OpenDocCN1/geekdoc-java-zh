    # Faraday Rotation


    Another reason to use circular polarization is to minimize the effects of Faraday
    rotation. Faraday rotation is the rotation of the plane of a linearly polarized
    wave as it travels through the ionosphere. This is very different from X and O
    propagation, in that a Faraday rotated plane wave is still a plane wave. X and
    O waves as described earlier are circularly polarized. There is often great confusion
    over this matter. However, these two phenomena are entirely different causes,
    and different manifestations.


    Faraday rotation is seldom appreciable at UHF frequencies, but increases as the
    square of the wavelength. It can be quite noticeable on 2 meters while nearly
    undetectable on 70 cm. The degree of Faraday rotation is also directly related
    to the Earth''s magnetic field, as well as the number of free electrons available.
    As such, Faraday rotation can be an extremely sensitive indicator of sporadic
    E, meteor burst, and a number of upper tropospheric phenomena. The real difficulty
    in using Faraday rotation for measuring such phenomena is finding a stable source
    of plane polarized waves to start with. Interestingly enough, moonbounce signals
    are one of the most promising sources of stably polarized signals, although they
    tend to be a bit unstable in other regards.


    # But, While We''re on the Moon Anyway


    Moonbounce communications until relatively recently were near the extremes of
    Amateur Radio emission. In the early days, it took massive antennas, exotic receivers
    (sometimes cryogenically cooled) and absolute maximum legal RF transmitter power.
    Astonishing technological improvements, especially on the receiving end, largely
    due to extremely low noise devices such GaAsFET preamplifiers and the like, have
    changed the game entirely. In addition, very low noise, weak signal digital processing
    protocols, such as those found in WSJT software, have made moonbounce nearly as
    accessible as the amateur satellites.'
