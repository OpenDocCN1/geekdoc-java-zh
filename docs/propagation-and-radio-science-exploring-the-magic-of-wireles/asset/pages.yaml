- img_proc: true
  md: 'σ = conductivity (Siemens/meter, S/m)


    μ = \mu_r \mu_0 = permeability


    \mu_0 = permeability of vacuum = 4p10^{-7} [Henry/meter]


    m_r = relative permeability [dimensionless]


    \varepsilon = \varepsilon_r \varepsilon_0 = permittivity [Farad/meter]


    \varepsilon_0 = permittivity of vacuum = 8.854 \times 10^{-12} [Farad/meter]


    \varepsilon_r = relative permittivity [dimensionless]


    By some manipulation of this equation, it can be used to calculate the depth to
    which the current density is some fraction of that at the surface. The depth at
    which the current density is 37% (1/e) of that the surface, often referred to
    as skin depth is the depth at which the current density would be zero if it was
    distributed uniformly instead of exponentially ....


    Notice the beloved "skin depth" which pokes up its pretty head whenever we deal
    with radio frequency electric currents. While the moderately horrendous equation
    presented above is well, moderately horrendous, the simplified implication is
    pretty straightforward. Electric currents like to travel on the outside of conductors,
    and whether that conductor is a piece of wire or a piece of real estate, the principle
    is the same. The higher the frequency, the less the current is going to penetrate
    the conductor. Lower radio frequencies penetrate further into the Earth (or the
    ocean) than higher frequencies.


    Now, we know that the ultimate radio frequency signal strength at a distant receiver
    is the result of the contribution of all radiators, and is a function of both
    the amplitudes of all contributing sources of radiation and their relative phase
    angles. A contributing source can be a radiator, a reflector, a director, or even
    a "virtual element" such as one might see from a ground reflection.


    # The Skinny on Skin Depth


    As one might suspect, a piece of copper wire, consisting of a uniform mass of
    a single element, is a lot simpler to analyze than dirt, especially in regard
    to skin depth. Unlike a piece of wire, the actual location of a reflecting "wire"
    under the ground is not easy to define.'
