  md: '# Preface


    # The Invisible Journey


    For about a century, radio amateurs have been launching radio signals into the
    ether, using equipment ranging from the primitive to the elegant. Technology and
    technique has improved enormously over the years, greatly increasing the reliability
    and effectiveness of this thing we call radio. However, the one radio amateurs
    have no control over is propagation, the unseen path between transmitter and receiver
    that every radio signal must take, whether across the street or to the Moon and
    back. There are countless varieties of ways a radio signal can get from Point
    A to Point B, a path that can be fascinating, frustrating, mystifying, and mesmerizing.


    There’s a lot we know about radio propagation, but there’s a lot we don’t know.
    It is a field still wide open to exploration and experimentation. For radio amateurs,
    the ether is still free.


    Many Amateur Radio books include valuable sections on radio propagation, the subject
    is so vast and wide that a chapter or two simply cannot do justice to this most
    fascinating aspect of Amateur Radio. It is appropriate to have a book dedicated
    to nothing but radio propagation. Propagation and Radio Science is just that;
    in this comprehensive tome we explore radio propagation from dc to daylight, from
    the trivial to the truly bizarre. We trust that you will find it a worthy companion
    to the venerable ARLRL Handbook and ARL Antenna Book.


    In Propagation and Radio Science, the most daunting mathematics is “safely” tucked
    away, while the free-flowing narrative presents the story of radio propagation
    in simple, intuitive, and graphic terms. This method will allow the reader to
    understand this somewhat complex topic on different levels, according to his or
    her experience and needs, either practical application, or a complete theoretical
    exploration. In the final chapters, we'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'will delve into the still-unknown nooks and crannies of radio propagation and
    suggest areas of exploration for the curious radio amateur.


    Special thanks to Carl Leutzelschchwab, K9LA, for reviewing this work.


    Eric P. Nichols, KL7AJ


    North Pole Alaska, March 2015'
