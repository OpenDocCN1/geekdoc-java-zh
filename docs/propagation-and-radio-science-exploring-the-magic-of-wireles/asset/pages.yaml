- img_proc: true
  md: 'For many decades, a lot of unexplained “bizarre” radio behavior has been summarily
    dismissed as being...well...just bizarre unexplained radio behavior. Part of the
    charm and romance of Amateur Radio is, of course, due to the fact that we don’t
    know everything, and it is always a thrill to discover something nobody else has
    observed. However, a good deal of what we simply write off as inexplicable is
    indeed the result of very well-known physical principles. Real progress is made
    when we logically and systematically study our observations, no matter how bizarre,
    erratic, or random they may seem.


    Many of us have heard that HF radio signals are “randomly” polarized. This not
    only does a great service to rigorous radio science practitioners, but to the
    physical universe itself, which is a whole more consistent than most of us give
    it credit for. As turns out, with extremely few exceptions, of what we observe
    with regard to HF radio propagation can be explained using known radio physics.
    It becomes “random” when we ignore one of the main ingredients of radio propagation:
    the Earth’s ever-present magnetic field. When you ignore it, almost nothing makes
    sense. When you include it, nearly everything makes sense.


    The fact that we have been able to explain radio propagation with any consistency
    at all, while omitting such a crucial factor, is astonishing in itself.


    Many old timers will argue that they’re blue in the face that there is “no such
    thing” as one way propagation. This totally misapplied “law of reciprocity” has
    been propagated, pardon the pun, so consistently and so effectively, and for so
    long, that it has taken on the totally undeserved fragrance of truth, despite
    all empirical evidence…and physical law…to the contrary. When we understand the
    birefringent nature of a magnetized plasma, the fact that we have ever anything
    reciprocal propagation is nearly miraculous! As we discover, it is only due to
    the fact that the average HF antenna is so bad we can use the for both transmitting
    and receiving over the typical long distance HF path! It’s a good thing that most
    of us are using high gain Yagis at the most, and not lasers; in the latter case
    the chances of both paths crossing each other would be nearly non-existent!'
