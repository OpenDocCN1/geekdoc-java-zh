  md: 'Not only is an electron a lighter than a proton, but it is a whole lot smaller.
    In fact, physicists tell us that the electron has no size at all...it is infinitely
    small. However, it does have a much larger “personal space” which makes its apparent
    size a bit larger. But it''s still really, really small.


    # Charge!


    As important as electrons and protons are, when it comes to radio, it''s not the
    particles themselves that are so magical, but rather their associated *charges*.
    In fact, for our purposes, the protons and electrons are merely “necessary evil”
    *charge carriers*. Charges cannot exist without the particles, but it''s really
    the charge we want. But before we go too far down that road, we really need to
    talk about what charge is. Most electrons have a somewhat intuitive idea of what
    charge is, but it is often misinterpreted.


    To understand charge, we will use a useful, but oversimplified *model*. A model
    is really a sort of allegory or parable to describe how something behaves. It
    can be extremely useful even if it''s quite incomplete. So the following allegory
    can be used to understand charge.


    Imagine a proton being the Titanic, and an electron being one of the lifeboats.
    Let drop off one of the lifeboats into the ocean next to the Titanic. Now, let''s
    bring in a 30 mile per hour wind. Neither the lifeboat nor the Titanic ship has
    sails, so the wind isn''t going to do much for either one of them. Let''s now
    put a square foot sail on top of the Titanic, and a similar square foot sail on
    the lifeboat. The 30 mile-per-hour wind now has something to blow. The sail in
    each case is equivalent to the **charge**. A 1 square foot sail has a charge of
    1. We need to add a small refinement to complete the picture though. If you have
    any maritime experience, you probably know that a sailboat can go *upwind*, depending
    on the *set* of sails. There are upwind and downwind sails. Even though our two
    boats have equal size sails, they have different directions. The downwind sail
    on the lifeboat has a -1 charge, while the upwind sail of the Titanic has a +1
    charge. For a given speed, each boat will have an equal but opposite force on
    the boat it''s on.


    An individual proton or electron has a charge magnitude of precisely 1; it can
    be no other value.'
