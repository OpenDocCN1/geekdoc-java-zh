  md: 'Now, we need to mention at this time that we’re dealing with real world components
    in this regard. There are no perfect capacitors or inductors, and any physically
    “makeable” components also have some resistance. All real world components are
    therefore more accurately described by complex values. More on this when we get
    around to doing actual measurements!


    # So What


    With these thoughts rattling around in our collective cranial cavities we need
    to segue back into this matter of matter. A lot of what we will be dealing with
    as we move into propagation —especially ionospheric propagation — will be the
    result of the orthogonal fields and forces acting on actual particles with real
    mass. The direction of these fields and forces relative to the particles they
    act upon will have profound effects in real radio propagation.


    There are a lot of alphabets in the soup, but with a little careful study we will
    find that this whole business of radio propagation is a lot more predictable (or
    at least explicable!) than commonly believed. Radio waves behave the way they
    do primarily because of known factors. The careful study of these factors will
    in no way subtract from the romance and mystery of radio propagation, but it will
    go a long way eliminating a lot of just plain misinformation.


    As we proceed with this fascinating study, we will keep returning to the first
    principles. There’s a lot of material to keep track of, but as long as we periodically
    touch bases with the basics, things will fall into place.'
