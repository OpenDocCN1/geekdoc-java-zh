    # # Contributions, Please


    At this time we would like to again plagiar some passages from the ARRL Antenna
    Book, but add some further relevant commentary. These passages address the contribution
    of the Earth to radio propagation, especially to horizontally polarized waves.
    Again, from the 16th Edition, Chapter 3:


    “In considering earth characteristics, questions about depth of RF penetration
    often arise. For instance, if a given location consists of a 6-foot layer of soil
    overlying a highly resistive rock strata, which material dominates? The answer
    depends on the frequency, the soil and rock dielectric constants, and their respective
    conductivities. The following equation can be used to calculate the current density
    at any depth:


    Knowing $\sigma$ and $e_p$, the skin depth in an arbitrary material can be


    ```

    $$\delta = \frac{\sqrt{2}}{\omega\mu}}\sqrt{1+\left(\frac{\sigma}{\omega\epsilon}\right)^{-2}}$

    ```


    where


    $\delta=$ skin or penetration depth [m]

    $\omega = 2\pi f, f=$ frequency [Hertz]'
