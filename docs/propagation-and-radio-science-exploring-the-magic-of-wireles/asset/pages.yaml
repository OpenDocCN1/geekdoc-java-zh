  md: '![](img/59293a6d87bff070066bbaf783df6263_83_0.png)


    Figure 6.6 - A typical ionogram. See the text for a detailed discussion.


    Now, let''s look at the actual reflections, the plots we see on the graph. There
    are actually traces of interest, the O-mode trace and the X-mode trace. Remember
    how we discussed the magnetized ionosphere as being birefringent? These two traces
    show this phenomenon clearly. The red and green traces are separated by two circularly
    polarized receiving antennas, one clockwise and one counterclockwise, while the
    transmitting antenna is linearly polarized.


    Let''s look at the O-mode trace first (the one over here; it is in color on the
    actual ionogram). Look at the curve near 270 km in altitude, where the curve is
    fairly horizontal, between 4 and 6 MHz (There appears to be a “cloud” around 570
