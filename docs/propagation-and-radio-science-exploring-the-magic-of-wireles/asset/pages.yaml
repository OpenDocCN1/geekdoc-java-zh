  md: 'Chapter 18


    # # Loads of Modes


    When considering ionospheric propagation, it’s tempting to just assume that “RF
    is RF” The actual modulation applied to a radio frequency carrier would, on the
    surface, seem to have very little to do with how the radio signal travels from
    Point A to Point B. This is largely true, but as we discovered in the chapter
    on diversity methods, there can be rather sudden and profound differences in propagation
    over the space of just a few kilertz...sometimes less.


    This phenomenon rarely came to light during the early years of HF packet radio.
    Unlike many instances in Amateur Radio when things seem to work a lot better than
    they should, HF packet almost never seemed to work as well as it should have.
    Even when signals were S-9++ going both directions, HF packet was plagued by countless
    retries, slow data rates, and all the other maladies that could possibly affect
    digital radio. This is not to say that HF packet doesnt still exist. There are
    still a few chirps to be found on the HF bands. But for the most part it suffered
    a long, slow gasping death, as nearly every other HF mode seemed to work better.


    For a while, there weren’t any satisfying explanations for why HF packet didn’t
    work as advertised. The error correcting protocol was robust. The nominal data
    rate was not excessive. It was a well-conceived protocol.


    As turns out, not many in amateur circles recognized how rapid and selective ionospheric
    fading could be. Some well-seasoned RTTY operators had some hints, but they never
    pushed the limits of data rates as packet did. (It be hard for anyone raised on
    Internet to consider 300 baud as pushing any kind of limit, but such was the case!)


    The ionosphere can undergo tremendous amounts of Doppler shift — enough to shift
    ionosphically reflected signals in both frequency and time delay. After a lot
    of investigation (not only by radio amateurs, but also by professional radio scientists
    who were also dabbling'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'in packet techniques) it was determined that the real culprit was intersymbol
    interference caused by highly selective time-of-flight errors. There was enough
    of a difference in reflection height between mark and space frequencies that they
    “sloped over” each other more often than not. No increase in signal strength or
    signal-to-noise ratio could help remedy this iota. And, as it turned out, this
    effect just come into play at around 300 baud; it was seldom noticeable at typical
    45 baud RTTY rates. Of course, the effect was progressively worse at higher data
    rates.


    # Clover


    Clover, a very expensive (at the time) protocol, was the first HF digital protocol
    to actually recognize the intersymbol problem. It was first made readily by HAL
    Communications, a company famous for bringing high quality RTTY terminal units
    to radio amateurs. And it addressed the issue in some clever, innovative, and
    interactive ways. In fact, Clover wasn’t a single protocol, but several. One of
    the most obvious was, more closely spaced, frequency shifts. And it also incorporated
    some frequency and time diversity methods. And it did some serious crunching to
    figure out what was the best combination of “fixes” to apply at any one time.


    Because of its relative expense, Clover fell off the radar in its early adolescence,
    but seems to be enjoying a bit of a revival, primarily because the necessary computer
    processing has got a lot cheaper than Clover was first rolled out.


    Another interesting feature of Clover is a very long sequence forward error correction
    (FRC) protocol, which slowed things down a bit, but was phenomenally reliable
    under the most abominable conditions. In FEC it far surpassed AMTOR, nearly matching
    the performance of AMTOR in ARQ mode.


    # AMTOR Notes


    AMTOR deserves more than passing mention here. AMTOR was derived from the highly
    successful commercial maritime SITOR system. In fact, the systems are nearly identical.
    AMTOR’s real power was its automatic repeat request (ARQ) connected correction,
    which was the first amateur'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'protocol to use this. Under ARQ the connected link would yield essentially

    100% perfect copy...or nothing at all. AMTOR has a few liabilities,

    besides the fact that you never hear it on the air any more. Like RTTY,

    AMTOR was limited to the standard 5 bit Baudot character set, which only

    included capital letters and numerals. The Internet generation would call

    this the “yelling mode.” In addition, the rapid fire talk-and-list ARQ

    mode required the transceivers at both ends to continually flip between

    transmit and receive a few times a second. If you had any TR or antenna

    ays would drive you to the wall, and if you didn''t do your antenna

    and other peripherals much good. If you had break-in (QSK) it

    worked very nicely, but at the time there weren''t a lot of full power solid

    state switches available.


    Despite its shortcomings, AMTOR paved the way for PACTOR, “Packet

    AMTOR,” which is pretty the default standard for automatic

    HFing, such as Winlink. PACTOR has the complete ASCII character

    set, as well a lot of concepts borrowed from Clover, such as long

    sequence forward error correction, adaptive data rates, and multitone

    quadrature modulation (in the later versions). PACTOR has evolved a bit

    itself, and is now up to PACTOR 4, which is used primarily on commercial

    circuits.


    # And Some ALE


    Automatic Link Establishment (ALE) is a framework developed by the

    military for automatically establishing HF radio links under a wide variety

    ofconditions. It is not one specific protocol, but rather some broad concepts

    that were formulated into specific protocols by Winlink and others. An ALE

    system often uses an interactive propagation predicting program such as

    ITS-HF in order to optimize its frequency and data rates.


    # Ping Pong


    In our earlier sections on channel probes, we described how important

    a feedback is in optimizing signal paths, something radio amateurs are

    just beginning to implement. While a channel probe (a beacon transmitter

    pired with a dedicated receiver) is useful for evaluating a known path, it'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'can''t tell you the best HF path of numerous options, or even tell you what

    those options are.


    A refined ALE system, on the other hand, will scan the radio spectrum

    (least the parts it is duly licensed for) and determine which frequency

    "works" for the required mission. This is called "pinging," a term derived

    from SONAR, but also wholesale by network administrators.

    Pinging was actually well developed by the government for meteor burst

    communications. Meteor burst paths are short and fleeting, and extremely

    reliable when they exist. Many scientific sites rely on meteor burst

    communications when no other infrastructure exists.


    The concept is simple. A remote site will ping the sky (generally in the 5,

    6, or 7 meter frequency range) for a radio path to the "home base." If the

    home base receives a signal, it immediately fires back to the remote site,

    "We have a path!" upon which the remote site sends a big data dump.

    Meteor burst is capable for extremely broadband data, but only at random

    intervals. Again, this concept isn''t well developed for government and

    scientific purposes, but hasn''t been implemented much by radio amateurs,

    especially at HF, where the concept could be extremely useful.


    # Sound Cards Galore


    One of the most popular sound card software packages is known as fldigi,

    which has 16 basic modes, not including the various data rates available for

    many of those modes. See Figure 18.1. A "more mature" all-mode

    package, known as MultiPSK (Figure 18.2), has nearly an equal number of

    modes, many of them essentially discontinued. One might ask why there are

    so many different digital modes; how many ways can one send text,

    anway?'
  merge: -1
  pgno: 217
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_218_0.png)


    Figure 18.1 – FDgl is probably the most popular all mode soundcard program. It''s
    extremely easy to set up, and it can even decode signals by putting a laptop''s
    microphone in front of a general coverage receiver''s speaker. It''s amazing to
    ignore background noise. however, one should always have ''hard wire'' to their
    rig for good engineering practices.


    ![](img/59293a6d87bff070066bbaf783df6263_218_1.png)


    Figure 18.2 – MultiPSK is an early-mode program (with recent updates) that has
    a very busy GUI (graphical interface). Nevertheless, it''s a reliable, robust
    program that actually works on all the modes it offers. It also has a few modes
    most h have never heard of. What more can you expect from a free program?'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'It is fairly safe to say that each mode was developed to compensate for, or
    take advantage of, a particular peculiarity of ionospheric propagation. The ever
    present drive for greater data throughput, compatible with available RF bandwidth,
    has instigated some truly unique, and sometimes truly odd modes. Some of them,
    like Olivia, even sound strange.


    The peculiarities one must contend with are: fading, selective fading, Doppler
    shift, polarization shift, selective (differential) “time of flight” and various
    types of noise. These peculiarities may apply individually, or in combination,
    and each mode deals with with greater or lesser success. Since these software
    packages are absolutely free, it costs nothing but a lot of experimenting, to
    find out what works for you at any given time.


    # Error Correction


    One of the interesting aspects of these different modes is how they handle error
    correction, and the overall philosophy related to this. As in any other engineering
    discipline, there are tradeoffs.


    In a perfect world, you wouldn''t need any error correction. If you could devise
    a modulation scheme that flawlessly compensated for all the known variations of
    ionospheric propagation (or other volatile propagation paths), you could get by
    without any error correction. Of course, in practice, the best you can do is make
    an educated guess, and hope that you''ve covered most of the bases. On the other
    hand, you could use a simpler modulation scheme (which almost dictates that it
    would be faster) that is much more subject to errors, but then use a sophisticated
    error detection and correction scheme, which takes processing power and time.
    Either way there is a cost, and that cost is throughput or ultimate data rate.
    Without simplifying too much, we can narrow your choices down to two:


    +   - Saying it slowly and precisely once.


    +   - Saying it fast and sloppy a whole lot of times.


    As limited as these choices are, how to apply them, and in which proportion, can
    be a very complex engineering issue.


    As an example, let''s take the case of slow speed CW, which ostensibly has the
    best possible signal-to-noise ratio for a given bandwidth, that bandwidth being
    very narrow. Assuming we aren’t worried about speed in'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'the first place, it''s easy to assume that very slow CW with a very narrow
    filter will give us something intelligible when the conditions are bad. But this
    theory falls apart in the case of something like the libration fading encountered
    when moonbounce (discussed in Chapter 16). A long dash, when subject to libration
    fading, can be chopped up into what looks like a lot of dots. In this case, you
    can actually increase your effective signal to noise ratio by increasing the speed
    to the point where a dash is shorter than (or equal to) the libration period.


    The same principle can be expanded to multitone data modes during rapid fading.
    You have a better chance of getting some information through a high data rate,
    between fades, as opposed to using a slower data rate where a symbol or character
    covers several fade cycles. This is somewhat akin to the Nyquist sampling theorem,
    where the sampling rate can be precisely follow Nyquist, because the fade rates
    are neither uniform in time, nor completely "on" or "off." A very crude but effective
    analogy would be attempting to paint a detailed picture on a very bumpy canvas.
    The resolution of the information you''re trying to convey can''t be any better
    than the background medium, in this case the ionospheric fading “picture.”


    Don''t forget, that the ionosphere, as we''ve so emphatically stated, is not reciprocal.
    There may be many times where it''s beneficial to operate one digital mode going
    one way, and another going the other way. This would seem to be a neat area in
    which to do some experimentation. You don''t know until you try!


    # Low and Slow


    While the emphasis of many newer digital modes has been to increase data rates
    within the confines of nature, there are times when speed is the last priority.
    A great example would be the experimenters'' band down 500 kHz (600 meters). There''s
    a lot of fascinating experimentation going down with low speed modes. By far,
    QRSS (Super Slow) or QRSSS (Super, Super Slow) CW are the mainstay of 600 meter
    operation. Some of the JT digital modes are showing promise as well. Because of
    the extreme power limitations imposed on the experimental 600 meter stations and
    the compromise nature of practical antennas for those frequencies, most signals'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'are well below the noise floor, and in a region of the radio spectrum that
    has very high noise to start with.


    QRSS/QRSSS is attractive because of its simplicity and theoretically infinite
    gain (assuming you have an infinite amount of time to decode the signals!). Extremely
    weak signals can be extracted from noise by the principle of long time integration.
    Assuming the background noise is uniform, and a zero bandwidth carrier exists
    in that noise, if you periodically sample everything around carrier, and then
    average it, the carrier will increase with each sampling, while the noise remains
    constant. Signal averaging is used in many scientific disciplines, and is cheap
    and effective.


    Another effective method, often used in conjunction with signal averaging, coherent
    detection, which is the simple multiplication of a carrier with a known reference
    carrier. The simple direct conversion (DC) receiver is a coherent detector if
    the local oscillator is precisely of the same frequency and phase as the signal
    you want to detect. The bandwidth of a coherent detector is determined entirely
    by the bandwidth of a low-pass filter following the detector.


    A special type of direct conversion receiver, called the lock-in amplifier, consists
    of two DC receivers operating in quadrature. The advantage of the lock-in amplifier
    over the simple DC receiver is that you can look at the amplitude of the signal,
    independent of the phase angle, as long as your local oscillator is within the
    bandwidth of the incoming signal. This may still be a challenge, however, if your
    bandwidth is on the order of millertz...or microertz. Such narrow bandwidths are
    easy to achieve with a lock-in amplifier. An effective lock-in amplifier requires
    that the receiver local oscillator and the transmitter are locked to a common
    reference. With the ready availability of GPS, this is not as difficult a task
    as it was once, especially if the transmitter and receiver are separated by hundreds
    or thousands of miles.


    Here is a project for a homebrew GPS disciplined oscillator that can be used as
    a local oscillator for a coherent detector or lock-in amplifier: www.rollant.org/~jpe/projects/GPSslave_writeup.pdf.


    One of these would be needed at both the transmitter and receiver site. Incrementally,
    the use of a DDS (direct digital synthesis) module, available from several sources,
    allows you to use a reference frequency of any'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'arbitrary value. So you don''t need to worry about the GPS disciplined oscillator
    being on the local oscillator frequency itself. The accuracy and stability of
    the DDS will be the same as the GPS reference.


    # Natural Radio


    No discussion of radio propagation would be complete without more than a passing
    mention of the fascinating world of VLF and ULF (very low frequency and ultra
    low frequency) radio. Although you don''t have any actual Amateur Radio allocations
    in the VLF/ULF regions, there is plenty to listen to there. VLF is the region
    between 3 and 30 kHz, while ULF is the region between 300 Hz and 3 kHz. Put together,
    the VLF/ULF range approximates the audio frequency range, and not too surprisingly,
    these frequencies can be detected using common audio amplifier technology. In
    fact, the typical computer sound card, in concert with a random wire antenna,
    makes a pretty good VLF/ULF receiver, especially when used in conjunction with
    a waterfall program that allows you to see signals buried in the noise.


    While there is a good deal of interesting commercial, military, and scientific
    communications activity in the VLF/ULF range, by far the most interesting “transmitters”
    are the countless natural sources that generate radio signals in that range. Signals
    such as “whistlers” are ionospheric VLF signals excited by distant lightning strikes.
    These have been observed well before the advent of radio, and were first observed
    on telephone landlines, particularly military field telephone installations. Since
    that time, entire catalogs of new sounds such as choruses, auroral roar, auroral
    buzz, chirps, clickers, and more have been observed, and have raised more questions
    than answers.


    One of the best sites on the Internet for those interested in the nether regions
    of radio is Radio Waves Below 22 kHz at www.vlf.it. This website has plenty of
    projects for the natural radio experimenter. One nice thing about these frequencies
    is that there''s always something happening down even when the HF bands are at
    their “deadest.”


    # But is it Radio?'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Because of the extreme wavelengths involved in VLF/ULF radio, there is a valid
    question as to whether we observe is actually radio, or merely magnetic induction.
    In most cases, at least at ULF, any receiver is going to be well within the near
    field of any terrestrial ULF transmitter. This ambiguity in no way detracts from
    the fascination of these phenomena. It simply serves to make their analysis a
    little trickier.


    As an interesting side note, well before Marconi and his peers were “playing”
    with radio, telephone and telegraph hobbyists were taking advantage of magnetically
    coupled phone systems, using the induction to take the place of wires in many
    cases, over surprisingly long distances.


    # Closing Remarks


    Modern technology has made it extremely simple to experiment with countless modes
    and regions of the radio spectrum once the well-heeled scientist. Don''t get into
    too much of an operating rut! Experiment with new modes and bands. Again, we need
    not remind you that if we don''t figure out what to do with our more exotic Amateur
    Radio bands, someone else will.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Sea Shanty


    Since most of the Earth''s surface is sea water, we should give maritime propagation
    more than a parenthetical mention. Practical radio underwent some of its most
    rapid and impressive development on the high seas near the turn of the 20th century.
    Unlike on land, where there were alternative communications technologies ranging
    from telegraph to telephone to carrier pigeon, before radio, ships were pretty
    much incommunicado for long periods of time.


    At the lower HF and medium wave frequencies, sea propagation is essentially ground
    wave propagation but with a nearly perfect ground system — the surface of the
    sea. Saltwater is a very good conductor, and a vertically polarized signal travels
    with very little attenuation over great distances along its surface. Experienced
    ship telegraph operators will you that the 500 kHz frequency maritime radio “network”
    was a 24 hour day party line, with extremely reliable communications to and from
    any ship on the high seas to any other ship on the high seas.


    Of course, 500 kHz is not available for radio amateurs, except on a limited experimental
    basis, but 160 meters (1.8 MHz) can offer a lot of the benefits for the seafaring
    radio amateur.


    # Making Things Plane


    As we have described before, normal radio waves in free space attenuate because
    the rays expand in a spherical fashion from the source. This results in a field
    voltage attenuating as 1/R.


    Because a sea-surface wave is guided, the pure geometric attenuation should be
    much less. Rather than the waves spreading out in a planar fashion, attenuating
    only in two dimensions rather than three. The real-world experiences of our aforementioned
    ships’ telegraphers seem to bear out this assertion. While there is some resistive
    loss of a surface conducted wave, the geometric'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'attenuation is so much less than in free space that we should expect some extremely
    reliable operation over the sea’s surface.


    While the majority of the surface of the Earth is seawater, a relatively small
    number of radio amateurs actually operate on the sea, or even communicate with
    ships at sea. The real significance of sea propagation is that a very large percentage
    of DX Amateur Radio communications take place over maritime paths. Most Long Amateur
    Radio propagation paths make at *some* of their journey over one or more seas,
    which makes understanding sea propagation all more interesting.


    # ### What’s for Launch?


    Nearly every radio amateur who has had the privilege of operating near the seashore
    will tell you that DXing just works much better when you’re near the sea, and
    when a signal has a “choice,” the propagation works best in the direction of most
    water. This observation is not limited to those low bands where surface propagation
    can be taken advantage of; this observation seems to hold even on the high bands
    where ground wave propagation is all but impossible.


    What is happening here? Is there something that favors radio propagation over
    the sea, even when a surface wave is impossible? Does being near a big body of
    sea water help the signal in some way?


    As it turns out, there are a number of factors at play here. It’s probably more
    helpful to talk about the immediate environment of the antenna and work out to
    get the complete picture.


    # ### Groundwater


    As we’ve described in the first few chapters, most hams severely underestimate
    the contribution of the ground in the vicinity of their antenna systems...either
    for good or ill. Unless you have a really tower on 10 meters (or higher frequency
    bands) the ground under your antenna is going to be pretty tightly coupled to
    your antenna. In addition, the character of the ground a significant number of
    wavelengths away from the base of your antenna is going to have a significant
    effect. In recent years have antenna modeling programs really taken the “far ground”
    seriously.


    For the sake of argument, we can consider a 20 meter horizontally polarized Yagi
    about 1/4 wavelength above ground, right on the beach of a'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'large continent (as opposed to being on a rock in the middle of the ocean).
    The continental “dirt” is of only moderate conductivity, forming an average ground.
    In the direction of the water, we have very good conductivity. The overall arrangement
    would be similar to having half a buried system, with the existing radials “aiming”
    out toward the ocean. We know that the overall beam shape is function of both
    the antenna’s free-space pattern, and that of the ground reflection. A perfect
    ground underneath a horizontal antenna (either a simple dipole, or a gain antenna)
    will give you the lowest possible launch angle, all things being equal. This can
    be confirmed by looking at the catalog of patterns versus height above any antenna
    reference such as the ARRL Antenna Book. So we know we’re going to have a nice
    low launch angle over the ocean, which is generally desirable for DX. Looking
    in the landward direction, it’s likely that our effective height above ground
    is going to be a bit higher, as the reflection surface of average “dirt” is well
    below the surface. Plus it’s a lot lossier. So we have a less reflective ground
    at a less desirable height over the continental path.


    Well, that all makes perfect sense with launching the signal in the first place.
    But what about after a few skips where the initial radiation pattern is irrelevant?
    Is there reason to believe that a radio signal propagates better over the ocean
    than over land, again disregarding vertically surface waves?


    The answer would be a qualified yes. Not that propagation over sea water, per
    se, is lossy; that reflections from the sea’s surface are going to be less lossy
    than reflections from normal earth. The more skips you have, the greater this
    difference would be noticed. The reflecting surface of the sea is well defined,
    and as a result, reflections therein are going to be nearly specular (mirror-like).
    Reflections from normal ground are not only going to be lossier, but the depth
    of penetration over a number of hops is more than likely going to be very inconsistent,
    resulting in a rarer diffuse (and lumpy) wavefront.


    # Naval Navigating


    In general, radio amateurs aren’t primarily interested in radio navigation, but
    we can learn a few things about radio propagation by looking at some classic issues
    of the technology.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Radio direction finding (RDF) is one of the disciplines first developed on
    the high seas. Again, like radio itself, RDF began on the low end of the radio
    spectrum. Vertically polarized medium wave signals travel with low attenuation
    in contact with the surface of the sea.


    The traditional means of homing in on signals is by means of a vertically polarized
    tuned loop antenna. The tuned loop consists of a number of turns of wires in a
    loop a foot or two in diameter, preferably enclosed in an electrostatic shield.
    The ferrite loopstick antenna built into most AM portable radios has similar characteristics
    to the classical tuned loop, minus the electrostatic shielding. If the tuned loop
    is very small relative to the wavelength, it exhibits the properties of a wave
    antenna... very different from a full sized quad loop or delta loop element. See
    Figure 19.1.


    The tuned loop antenna is very strongly vertically polarized, and has a very sharp
    null perpendicular to the plane of the loop. (Actually two nulls, 180 degrees
    apart). For true sea-surface waves, this antenna is extremely precise, and was
    used for many decades to home in on shipboard or land based beacon transmitters
    by swinging the antenna around for a sharp null.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_228_0.png)


    **Figure 19.1 — A wave antenna operates in a rather different fashion than a more
    typical antenna.** As a wave progresses through two different regions of the antenna,
    different voltages are induced because of the difference in phase of the passing
    wave. The sensitivity of such an antenna is directly related to the physical size
    of the antenna, as a greater phase difference will be seen in the larger antenna.
    This principle applies whether one is talking about a tuned loop or a long Beverage
    antenna.


    However, the unshielded loop can suffer from serious error if signals arrived
    from high angles. While a vertically polarized antenna can launch a good “sea
    wave” there is nothing to stop it from also launching a vertically polarized skywave.
    During the daytime, D layer absorption all but eliminates skywave propagation.
    During the night, when the D layer absorption is low or nonexistent, skywave signals
    can arrive in addition to the desired “sea wave.”


    The first undesirable effect of this is that the user will not be able to obtain
    perfect or even reasonably sharp nulls with the loop. For signals'
  merge: -1
  pgno: 228
- img_proc: true
  md: This is one factor that probably accounts for the many growing reports of DX
    by hams using shore-based vertical antennas. Certainly a vertical antenna has
    inherently low launch angles, but this probably is not the entire story. The one
    way to absolutely confirm this would be to establish HF
  merge: -1
  pgno: 229
- img_proc: true
  md: continual communications with a ship traveling away from shore for a few thousand
    miles and see if there are any dead spots (skip zones). This could be an interesting
    project for experimentally minded hams.
  merge: -1
