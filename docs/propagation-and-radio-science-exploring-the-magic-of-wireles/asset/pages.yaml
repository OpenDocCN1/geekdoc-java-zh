  md: '# Chapter 21


    # # Unexplored Territory


    Amateur Radio has been around for a century now, and while we have learned a great
    deal about how radio works, there is still a lot we don’t know. And there’s no
    indication that we will ever come to the end of the road when it comes to radio
    know-how. The reason a good number of us are hams is to satisfy our curiosity
    as much as to provide practical communications. Of course, these are not mutually
    exclusive pursuits by any stretch of the imagination. Most of the technologies
    and techniques we consider absolutely necessary were at one time the result of
    some experiment gone seriously awry. Any student of the history of science knows
    this to be the case. Scientific knowledge is seldom an orderly, linear path.


    We trust this volume has imparted enough knowledge to spare the newcomer to reinvent
    the wheel, as well as to help explain a few of the behaviors even the more experienced
    may have never considered. Knowing how radio is supposed to work will save hours
    of frustration for the new amateur. The science and physics of radio propagation
    are very different from the technology used to exploit them. Most new hams “get”
    technology, while relatively few of them “get” radio propagation.


    At one time, many radio amateurs arrived in the hobby with a fairly good feel
    for radio propagation, especially on the HF bands, having had some exposure to
    shortwave radio. It is safe to say that the vast majority of new Technician licensees
    (and many other amateurs as well) had no exposure whatsoever to shortwave radio,
    and have no idea what to expect before they get on the air…especially on the HF
    bands.


    It’s a good thing to know as much as possible of the fascinating subject of radio
    propagation before getting on the air. But perhaps too much knowledge might not
    be a good thing.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Avoiding the Paralysis of Analysis


    Knowledge is supposed to make things easier. As we suggested at the beginning
    of this tome, it is truly amazing what early radio amateurs were able to accomplish
    with very little understanding. While we want to give the current generation of
    hams a running start over those early pioneers, we also want to avoid going too
    far in the other extreme. Countless newcomers to Amateur Radio are convinced that
    if they don''t have a high-end transceiver and a sky-filling multiband Yagi atop
    an Eiffel Tower they can''t do effective distance radio communications. A disconcerting
    number of hams progress beyond their Technician licenses (or use all of the privileges
    they have within that license) because they have the erroneous impression that
    HF radio is a big ticket item. Timers need to remind them (and ourselves) that
    for decades, radio amateurs worked the world with rudimentary transmitters feeding
    what our friends across the Pond refer to as “tatty bits of wire.”


    This be be up by saying that Amateur Radio is for experimenters. This book is
    intended as a guide, not the final word on the topic. Practical and theoretical
    knowledge gleaned from this work should inst further exploration and discovery;
    it is this aspect that will keep Amateur Radio vibrant and fascinating for the
    foreseeable future. While we have touched on most of the known topics pertinent
    to radio propagation in all its forms, there are still aspects where we are in
    our collective infancy with regard to our understanding. We will close with an
    overview of subjects that still need explanation and exploration.


    # Antennas


    While antennas and radio propagation are entirely different topics, they are inextricably
    linked. Our only “window” into radio propagation is the antenna. It is the only
    interface between electromagnetic radiation and our physical senses. While the
    interaction between antennas and electromagnetic fields is well understood, there’s
    still a lot of work to be done with antenna designs that truly take advantage
    of all the peculiarities of radio propagation.


    In particular, amateurs can do more with circular polarization at HF. Although
    CPOL has been explored in the past, it has not been widely'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'accepted. Carl Leutzschwab, K9LA, points out that in the December 1962 RSGB
    Bulletin, George Messenger, the original holder of the K6CT call sign, had an
    article noting the superiority of crossed Yagis in quadrature. He formed the Space-Raider
    antenna company, offering CPOL 6, 10, 15 and 20 meter antennas with ads in QST
    magazines of the era. Unfortunately they never caught on. In the November 1989
    issue of Practical Wireless (later reprinted in the November 1990 issue of Communications
    Quarterly), B. Sykes, G2HCG, described a CPOL 10 meter antenna (again using two
    Yagis fed in quadrature) and noted observations on 10 meter beacons.


    # Band Usage


    We have a lot of Amateur Radio bands at our disposal, each of them with very different
    properties. We have 12 microwave bands that beg for more exploration. Each of
    these microwave bands has unique properties that aren''t likely to be discovered
    until hame do with them! Microwave transmitter and receiver design is not for
    the faint of heart, but the rewards can be huge. Exploration of the microwave
    bands is one area where h can still make a major contribution to the radio art.
    We dare not take these valuable allocations lightly!


    # Coding


    We''ve discussed the plethora of novel digital modes available to the radio amateur.
    However, there are undoubtedly many new modes to be discovered. Inexpensive and
    powerful tools such as Arduino, Raspberry Pi, and other tools put previously daunting
    computer coding into the hands of just about anyone. In a recent discussion with
    an Amateur Radio equipment manufacturer, we learned that they are interested in
    creating an ionosode that works with FCC Part 15 power levels...all because of
    clever signal processor coding. A device like a Part 15 ionosode would revolutionize
    Amateur Radio ionospheric research.


    # Digital Relay Stations'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'There’s still a lot to be learned with regard to effective digital relay technology,
    such as Winlink, ALE, and a number of other automatic relay modes. A lot of this
    has more to do with regulatory issues than technology, but it''s nevertheless
    a wide open field for the experimenter.


    # Experimentation


    Of course, this is all-inclusive. There are certain propagation modes we haven''t
    even discovered yet. We are likely to discover these on the microwave bands, but
    we could also discover new things down on the VLF bands as well.


    # Field Aligned Irregularities


    Field aligned irregularities (FAI) events are structures in the auroral zone.
    These are thought to be formed by “plasma tubes” that follow the magnetic field
    lines through the aurora. These structures are highly reflective, though quite
    “bumpy.” Effective VHF and UHF communications can be achieved using FAIs. Experimentation
    with more effectively using FAIs would mark a significant new technology


    # Ground Wave Propagation (Sea Wave Propagation)


    Although ground wave propagation is as old as radio, there are still aspects of
    it that remain a mystery. “When all else fails, use ground wave” may be a valid
    philosophy if we have effective means of taking advantage of ground wave signals.
    Modern digital signal processing technologies should enable ground wave communications
    under conditions once deemed unusable.


    # Heating


    Ionospheric heating is normally deemed to be the domain of super high transmitter
    facilities such as HAARP and EISCAT. Ionospheric heating is the method of “pumping”
    the ionosphere into nonlinearity, where all kinds of interesting phenomena can
    occur. Recent observations, indicate that some ionospheric heating can occur at
    Amateur Radio power levels. This is wide open for experimentation.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Ionospheric Physics


    Another all-encompassing topic. There''s a lot we know about ionospheric physics.
    And there''s a lot we don''t know. Fully understanding ionospheric physics goes
    far beyond radio; it could even lead to practical controlled nuclear fusion.


    # Weak Signal Digital Modes


    The JT weak signal digital modes have opened up entire new worlds for the radio
    amateur. We certainly have not exhausted the possibilities of such weak signal
    modes. We should probably expect to see many similar JT modes in the near future.


    # K-index and its Kin


    There''s a somewhat tenuous connection between solar indices and radio propagation.
    For example, 160 meters seems to defy a lot of conventional wisdom when it comes
    to solar activity and radio “goodness.” While we certainly cannot ignore solar
    indices, they far explain all that we observe when it comes to ionospheric radio
    propagation. More powerful computing methods may make the connection more clear.


    # LEOs other Launches


    Low Earth orbiting satellites can reveal a lot about the ionosphere and atmosphere.
    Radio amateurs have a great deal of input when it comes to scientific satellites,
    and we need to continue to pursue this. Even high altitude balloons can reveal
    a lot about our radio world.


    # Magnetic Fields


    As we''ve discussed in detail, the Earth’s magnetic field has been all but ignored
    in radio propagation studies, at least in Amateur Radio circles. Now, there is
    no excuse to neglect this all-important ingredient of radio propagation, especially
    at HF In addition to propagation prediction programming, considering the Earth’s
    magnetic field will change the way we do radio.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# NVIS


    We suspect that certain digital modes may be particularly suitable to NVIS operation.
    In addition, the development of compact NVIS antennas can solve a lot of antenna
    restriction issues. Antenna experimentation and construction will always be part
    and parcel of Amateur Radio. NVIS is one area where there aren’t yet a lot of
    original ideas. This is a wide open field.


    # Open Source


    While not directly related to propagation, every ham needs to know that software
    is the “new homebrew.” There is so much wonderful open source software and hardware
    out there, that is little excuse for any ham not to “roll your own.” The Open
    Source movement is closely linked with the Amateur Radio philosophy.


    # Polarization Modulation


    One of the more curious modes available to the radio amateur (though not explicitly
    spelled out in the FCC rules) is polarization modulation. Polarization modulation
    can include incremental shifts in wave polarization in response to voice modulation,
    or it can involve shifting between horizontal and vertical polarization in response
    to a MARK or a SPACE. In theory, polarization modulation could transmit intelligence
    with zero bandwidth. In practice, the transmission of extremely high bandwidths
    with very little bandwidth should be possible.


    # Quadrature Methods


    As described in the first chapters, the entire universe seems to be based on orthogonal
    axes in time, space, and even frequency. While quadrature modulation is common
    in many commercial and amateur applications, it could also be applied directly
    to electromagnetic radiation, such as digital polarization described above. Or
    it can involve switching between right and left hand circular polarization at
    a digital rate. While in theory, these methods should have very predictable results
    in free space, they may have quite unexpected results in the ionosphere or other
    dispersive media. You don’t know until you try it!'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Radio Sounding


    Included in this we could include beacon transmitters, channel probes, and ionosondes.
    While prediction of propagation is important, it''s just as important to know
    what propagation actually is, rather than just what it should be. Radio amateurs
    miss a lot of band openings — from dc to daylight because nobody happens to be
    listening. We need to start looking at putting more beacons out there, especially
    on the microwave bands. This could also encourage a lot more activity.


    # Signal Measurement


    We covered this topic somewhat extensively in the chapter on S meters, but there''s
    still work to be done. We need some good inexpensive field strength meters, as
    well as more amateurs who understand the importance of accurate signal measurement.
    This one discipline could go a long way toward Amateur Radio a more scientific
    hobby.


    # Transequatorial Propagation


    No matter how you cut it, transequatorial propagation is still weird. While a
    number of “explanations” for TE have been put forth over the years, including
    the ones already described in this book, none of them are fully satisfactory.
    The true mystery of TE will probably yield only the careful application of 3D
    triangulation described earlier. This method will tell us precisely where the
    reflection points are, rather than more speculation.


    # Unidirectional Propagation


    While the mechanisms of one-way ionospheric propagation are well understood, one
    way propagation has been observed on every band from dc to daylight. While some
    of the processes are probably analogous to ionospheric phenomena, we suspect there
    might be a few new things to learn.


    # Very Weak Signal Work'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'JT-65 and other digital modes have brought us a long way in this regard, but
    there are still a few tricks to be learned. High tech isn’t necessarily synonymous
    with “digital.” There are still some impressive analog methods for making sense
    out of chaos. The lock-in amplifier is one such method, as described in an earlier
    chapter. New low noise devices, some silicon, some not, issue from the chip makers
    on a regular basis.


    # Wave Antennas


    This special class of antennas deserves a lot more research. Wave antennas include
    devices as varied as the venerable Beverage to the multituned loop. Wave antennas
    reveal some basic and so basic properties of electromagnetic waves, especially
    in inhomogeneous media. For example, a wave antenna can be used to determine the
    velocity factor (and dielectric constant) of the Earth or other media.


    # X-Mode Propagation


    While O-mode propagation is generally the most observed mode, primarily because
    it propagates with less loss, the X-mode ray can reveal a lot more about the ionosphere
    and the related physics. It is certainly gratifying to see the amateur literature
    finally recognize the existence of X mode propagation (as well as O-mode propagation),
    there’s still a long ways to go in this regard. We need to keep driving home the
    point that HF propagation is either X or O mode.


    # Youth


    As fascinating as this whole radio propagation business is, most of the world’s
    experts, both commercial and amateur are old people. And yet the need for radio
    propagation experts has never been greater. Where are the experts designing all
    the new wireless devices going to from? Radio science is actually very fun stuff,
    and we need to convey that fact to as many young scientists as we can. Radio technology
    is as central to our dominance in the science and tech fields as digital design.
    In fact, at the higher speeds, even digital technology becomes an RF problem!'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Zulu Time


    Well, perhaps not so much Zulu time, but time in general. The emergence of the
    GPS receiver has made radio science a whole lot easier and more accurate. We already
    described the GPS receiver used as a frequency reference for a lock-in amplifier.
    Better time and better instrumentation all around makes the study and understanding
    of radio propagation all that much better.


    # Your Own Path


    Undoubtedly we have left out a lot of possibilities. As a radio amateur, an insatiable
    curiosity will be your best tool for advancing the state of the radio art. Radio
    allows the “Average Joe” access to the mysteries of the universe that no other
    activity can remotely match. Everything we know about the universe outside of
    our own back yards is revealed to us through electromagnetic radiation…radio propagation.
    We trust this book has opened a small window to that vast universe.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# The Romance of Radio, or The Art of Being There


    You can have a successful Amateur Radio experience knowing little or nothing of
    what has been explored in this tome. For more than a century, countless hams have
    made untold millions of exciting and rewarding radio contacts using nothing but
    “tatty bits of wire draped over the willows.”


    There has always been the danger (probably more imagined than real) of sacrificing
    the romance and intrigue of radio, particularly of the amateur sort, by understanding
    it too well. For generations of radio practitioners, both amateur and commercial,
    the unpredictability and fickleness of radio has its main attraction. If you are
    a typical radio amateur, there is always the sense that there is something more
    to learn, some new quirk to discover.


    Of course, there are a number of inviolable laws of nature we must work (or play).
    Maxwell’s equations are chiseled in granite, or perhaps more aptly, the fabric
    of space itself. We know that even the most bizarre, fleeting, and sometimes disturbing
    radio phenomenon we might encounter will eventually be found unswervingly to some
    law. This is not to say we know all the laws. And even if we did all the applicable
    radio laws, we know that not all of them apply all the time in equal doses. Radio
    propagation, except in empty space, is always a complicated process, as we’ve
    learned.


    Having a deep knowledge of all the applicable laws doesn’t necessarily give us
    any more dominion over the subject, either. Knowing exactly how sunspots affect
    ionospheric behavior doesn’t give us one iota of advantage over the neophyte,
    if we can’t do anything about sunspots.


    Furthermore, all the predictive tools we now have, which our recent radio ancestors
    could only dream of, can be a mixed blessing. The more we understand about radio,
    the more unlikely it seems that the thing can work'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'at all,at least in a real environment. When it comes to propagation modeling,
    a detailed analysis will, often as not, tell us it''s not even worth bothering
    to turn on the rig. This is, indeed, the real danger of “too much” knowledge in
    this area. It applies in a few other spheres of life, as well. The “paralysis
    of analysis” is a very real phenomenon, and it can be insidious.


    We cannot over-emphasize the importance of just being on the air…a lot. Radio
    openings that defy the rules occur at any time, any place, and from basically
    “dc to Daylight.”


    Of course, we need to acknowledge that in many cases, the time one can allocate
    to Amateur Radio is limited. Amateur Radio is, after all, amateur. A fortunate
    few among us are to parlay their Amateur Radio passion into a career, where they
    can spend a good part of their waking hours playing with radio in some incarnation
    or other. This probably does not describe the typical reader.


    The judicious use of propagation prediction tools can make our limited, precious
    hours on the air fruitful, in the same way that a good antenna program can save
    you a lot of cutting and pruning and trial error out in the field or antenna range.
    But prediction modeling is not a substitute for experience. No computer program
    can give you any insight, or suggest a new avenue for exploration. The latter
    is, more often than not, of the sheer luck...being in the right place at the right
    time. That will never happen if you don''t turn your radio on.


    Never operate under the onus that you don''t have what it takes to make a new
    discovery...or re-discovery...as a lowly radio amateur. Allow me to use as a case
    in point, X and O mode propagation. I would love to be able to say that I discovered
    the phenomenon. In reality, the basics of Extraordinary and Ordinary waves were
    known nearly 200 years ago, in the field of optics, before “radio” even had a
    name. Physicists and other professionals knew all about X and O ionospheric propagation
    over 70 years ago, and it had been discussed in World Radio magazine by Bob Brown,
    NM7M and Carl Luetzschwab, K9LA, back in the 1990s. I learned about X and O propagation
    working at Hipas Observatory, 25 years after I had been licensed as a ham…and
    nearly as long in the field of broadcasting. I take credit for understanding the
    phenomenon.


    What I can take credit for is realizing its importance to normal Amateur Radio.
    My December 2010 QST article, “Gimme and X, Gimme an O” was'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'the first ARRL publication in more than 70 years to mention the phenomenon.
    In classic Amateur Radio fashion, I was just in the right place at the right time:
    Proplab Pro 3 makes it easy to demonstrate my X and O assertions, not that they
    needed any proof.


    Knowing about X and O propagation was, perhaps, the first “discovery” in Amateur
    Radio for a long time that actually suggested a fundamentally new way of actually
    doing ham radio...using circularly polarized antennas on HF, a preposterous idea!


    Amateur Radio needs more preposterous ideas. The best computer program probably
    won’t suggest any preposterous ideas, but it can certainly help confirm them.


    We trust the last chapter, “Unexplored Territory,” wobbled a few new brain follicles.
    We still have a great opportunity to “advance the state of the radio art” as spelled
    out in FCC Part 97.1, which delineates our “basis and purpose” as radio amateurs.
    Nowhere is it potentially more likely for the “Average Joe Ham” to make a real
    contribution to the radio art than in the understanding and exploitation of some
    frontier of radio propagation.'
  merge: -1
