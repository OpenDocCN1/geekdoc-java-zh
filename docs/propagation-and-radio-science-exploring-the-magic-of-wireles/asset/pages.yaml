  pgno: 103
- img_proc: true
  md: 'that can drive a scientist nuts and the process of locating the actual position
    of these is far from complete...even if they didn''t wander around! But we we
    know this information with enough accuracy to be truly useful, at least for Amateur
    Radio purposes.


    # Magnets in a Vacuum


    It''s fascinating to realize that a stationary magnetic field in a vacuum — no
    matter how strong — has absolutely no effect whatsoever on an electromagnetic
    wave. Now, we should interject here that the Earth’s magnet, while huge in volume,
    is actually very weak. The field concentration of a refrigerator magnet is orders
    of magnitude more than the Earth’s field, even right at the aforementioned geomagnetic
    poles.


    Because of the relative feebleness of the natural terrestrial magnetic field,
    it''s easy to assume that its effect on the ionosphere would be negligible. But,
    remember how we described little ionospheric matter actually exists, that the
    entire mass of the ionosphere is on the order of one metric ton? The ionosphere
    is extremely thin. It doesn''t take much to scoot it around a great deal.


    Now, as we will see, it''s the interplay of the magnetic field and the ionospheric
    plasma that gives it its particular influence over radio waves.


    # Being Biased


    In the absence of a magnetic field, a plasma (a body or region of ionized gas)
    is extremely bi-lateral when it comes to radio waves. Or, put another, radio propagation
    through a non-magnetized plasma is reciprocal. This is not to say that a uniform
    plasma has no effect on radio waves by itself, but its effect is entirely symmetrical
    or isotropic. It doesn''t matter which way a radio wave goes through a uniform
    plasma; it always has the same effect, most frequently a slowing down of the radio
    wave.


    In addition, a uniform plasma is essentially non-dispersive. It will refract radio
    waves, but it will refract them the same amount, regardless of frequency.


    In the ionosphere, there are several factors influencing the uniformity of the
    plasma. First we have the differential...air gets thinner with'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'altitude. So we have a gravity gradient to the plasma. This is, naturally,

    pretty independent of azimuth; it is strictly dependent on height. We also

    talked about the electron density profile: the ionization level is dependent

    on altitude as well. The overall vertical gradient is, as we have shown, a

    complex function of altitude and ionization, but still extremely uniform

    with respect to azimuth.


    If we apply a magnetic field to the plasma, a number of interesting

    asymmetries occur. First, a magnetic field tends to further change the

    plasma density, above and beyond the gravity gradient. Now, this may or

    not be in the same direction as the gravity gradient. If you are directly

    over one of the poles where the magnetic field is vertical (parallel with the

    gravity gradient), what you will “see” will be just an exaggeration of the

    gravity gradient. Now, if we were to transmit a radio signal vertically,

    precisely in parallel with the field lines, we won''t see much result from

    the magnetic field other than an increased refractive index. In other words,

    t radio wave will travel slightly more slowly than in the case of the non-

    magnetized ionosphere.


    Things get more interesting very quickly, however, once we transmit a

    signal that''s affecting perfectly parallel to the magnetic field. In this

    situation, we have a component of the wave that is affected by the magnetic

    field, because it now cuts across it. The degree to which the magnetic field

    lines affect this propagation is directly related to how perpendicular the

    wave motion is to the magnetic field line.


    But something else is happening at the same time. Once a linearly

    polarized radio wave begins to enter the magnetized ionosphere, it begins to

    split into two counter-rotating circularly polarized rays. These two rays

    diverge widely in both vertical angle and azimuth. One of these rays, the

    inary mode (O-mode) ray, travels along the field lines with not too much

    “weirdness.” Its propagation path is much like that of a wave in the non-\magnetized
    ionosphere...except for the fact that it''s circularly polarized.


    The other component or “characteristic wave” is the X or extraordinary

    ray. (Nobody said physicists could spell!) This ray follows basically

    perpendicular to the field lines, and has more peculiar properties. The

    Xmode ray tends to be lossier, and it travels more slowly. It can also get

    “trapped” between the F1 and F2 layers, as if inside a waveguide,

    eventually emerging at some location far from its associated O-mode ray.'
