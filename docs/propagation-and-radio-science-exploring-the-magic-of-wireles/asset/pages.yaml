- img_proc: true
  md: 'As noted in Chapter 6, the divergence between X and O mode rays depends on
    frequency. In the 10 meter ray traces in Figure 6.4, the difference in absorption
    between the O-wave and X-wave is likely imperceptible in the real world. On 160
    meters (Figure 6.5), the X-wave is considered out of the picture. Carl Leutzelschwag,
    K9LA, observes that from Prolab ray traces, on frequencies below the electron
    gyro frequency (for example, on our 630 meter band) the X-wave suffers less absorption
    than the O-wave. More investigation is needed here.


    For a slightly different perspective on this, refer to "Ionosphere Properties
    and Behaviors, Part 2" by Marcel H. DeCanck, ON5AU, in the July 2006 issue of
    antennex(www.antennex.com). DeCanck points out that nearly all propagation predictions
    are based on the O-mode wave behavior, which means we miss out on a great deal
    of interesting X-mode propagation.


    # So What


    One could write a whole book about just this X and O mode business (and in the
    physics circles there are entire books on the matter). Buthams are notoriously
    practical about such matters, and are correct in asking the question, why do we
    care about X and O modes? Does knowing of their existence have any effect on how
    we operate? Yes indeed! Let''s look at the fundamental implications of X and O
    mode waves.


    # Not so Great Circle Paths


    One of the most direct effects of the magnetic field is that Great Circle paths
    are increasingly meaningless (or decreasing meaningful) as you approach one of
    the magnetic poles. In the northern hemisphere, the O-mode ray will diverge towards
    the North pole, while the X-mode ray will diverge towards the magnetic equator.
    Anyone who has ever operated in interior Alaska will testify to how frustrating
    it is to figure out where to steer your beam antenna, not only for over-the-pole
    signals, but also from signals arriving from the "Lower 48." Now, while this divergence
    is most extreme in polar regions, it exists to some degree everywhere. Unless
    the entire path is along the magnetic equator, there will always be some X-O divergence.'
