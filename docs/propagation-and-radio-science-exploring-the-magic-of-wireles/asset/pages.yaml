  md: 'normal “geometric” calculations. However, this refraction occurs continuously
    along very great distances and at very low heights, from a radio standpoint. Tropo
    ducted signals take low, grazing paths along the bottom side of the inversion
    layer. It is truly amazing how well this process can work, nearly no losses occurring
