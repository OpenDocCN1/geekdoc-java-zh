  md: 'above, we see a continuous gradient of currents when a radio signal penetrates
    the Earth (**Figure 12.2**).


    What we really want to know is where the greatest current density is, because
    a region of greatest current density most closely approximates a wire. And, if
    we have the patience to actually apply the aforementioned moderately horrendous
    equation to all our known dirt components, we could accurately pinpoint this location.
    We could find an actual depth of our reflecting underground virtual wire. What
    we would end up with is a virtual depth of our ground. And, as it turns out, this
