    \ this phenomenon is quite common...which may lead one to wonder why it's even\
    \ called a phenomenon.\n\nThe troposphere is the part of the atmosphere we live\
    \ in, and more or less extends from ground level to about 25,000 feet or so. Weather\
    \ occurs in the troposphere, and as we know much weather phenomena are a result\
    \ of atmospheric pressure changes. One of the results of high pressure tropospheric\
    \ conditions is the potential of an inversion layer forming. This is where the\
    \ temperature goes up with altitude over a small region. This gives the air in\
    \ the region well-defined refractive index gradient, which is ideal for refracting\
    \ VHF and UHF radio waves.\n\n Ordinarily, the troposphere is transparent to radio\
    \ waves, as there are no ions unless non-ionized species can have a dielectric\
    \ constant different from vacuum, though normally slightly so. This is more evident\
    \ at VHF and UHF frequencies where the wavelengths are short enough to “wobble”\
    \ atoms by a number of resonance effects. Neutral is normally unaffected by radio\
    \ because the charges are so close together as experience equal and opposite forces\
    \ from an impending radio wave. But remember, electrons are in orbit around their\
    \ nuclei, so there can be a time differential between the force on the positive\
    \ charges and the force on their negative charges (electrons). Under the right\
    \ conditions, this time differential can have significant effects, such as the\
    \ heating of water by microwave radiation.\n\nTrue resonance effects are not likely\
    \ to occur at VHF and UHF frequencies, but the waves are short enough to have\
    \ slightly different effects on the electrons and the nuclei, thus causing a sort\
