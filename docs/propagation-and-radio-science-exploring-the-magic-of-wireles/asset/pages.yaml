- img_proc: true
  md: '# Chapter 13


    # Diversity Methods


    The ionosphere is fickle. The fact that a large number of hams practically make
    a career out of attempting to predict propagation (with varying degrees of success)
    attests to this. The variability of ionospheric (and other types) of propagation
    has been observed for nearly as long as radio itself. We say nearly as long, because
    for a decade or after its inception, nearly all Amateur Radio was conducted via
    the annoyingly consistent ground wave (or "sea wave").


    Part of good engineering practice is knowing what you can fix, and knowing what
    you can''t fix. Applied to radio propagation, it''s safe to say that there''s
    really little point in attempting nighttime communications on 10 meters during
    a sunspot minimum. "It just ain''t gonna happen." If there''s no ionosphere, there''s
    no skip. This is not to discount anomalous events like meteor burst that can happen
    about any time. But we can reasonably predict those times when it''s just not
    worth the bother to turn on the rig on a certain band.


    Diurnal (daily) variations in maximum usable frequency (MUF) follow a nearly clockwork
    pattern of predictability, as we can plan our operating habits around them, such
    as using known "daytime bands" during the day and "nighttime bands" at night.


    On the other hand, there are short-term variations in propagation that can be
    dramatic...unpredictable. We refer here to *fading*, which has a number of specific
    forms, and a variety of interesting solutions.


    # Normal Fading


    We know that the ionosphere is not a solid object; it tends to drift around, wobble,
    and wrinkle. As we''ve discussed earlier, it''s rather amazing that it ever works
    at all, given all the parts that have to fall into place. So it stands to reason
    that a certain amount of fading is normal and expected.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'If you have listened around the shortwave broadcast bands at all (and every
    self-respecting ham needs to do this occasionally) will notice that even the strongest
    stations can have random dips in signal strength. These dips generally have a
    time scale of a few seconds to perhaps a minute or so. And they can be surprisingly
    deep. One of the primary incentives for the invention of the automatic gain control
    (AGC) or the earlier-named automatic volume control (AVC) on broadcast receivers
    was to compensate for ionospheric fading. Incidentally, skywave AM broadcast signals
    can have dramatic fading, as well. A typical plot of signal strength over a period
    of minutes (**Figure 13.1**) will show how deep “normal” fading can be. This plot
    shows the signal strength of the 15 MHz WWV signal received in Fairbanks, Alaska,
    on a quiet day from 11 AM to 1 PM. Vertical scale is in relative S to represent
    what you will typically see. Actual field strength variations are much deeper.
    The same data is shown with some mathematical smoothing for clarity in **Figure
    13.2.**


    ![](img/59293a6d87bff070066bbaf783df6263_160_0.png)


    Figure 13.1 — Ionospheric fading can be surprisingly rapid and deep. This graph
    shows the signal strength of 15 MHz WWV over a period of two hours, monitored
    near Fairbanks, Alaska. Maximum signal strength is set at “S-6” at the distant
    receiver. Rapid fading is primarily caused by phase cancellation as reflected
    signals from different points of the “wobbling” ionosphere add and subtract in
    a random fashion. “Wrinkles” in the ionosphere can also simply redirect the reflected
    wave to different points on the Earth’s surface.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_161_0.png)


    **Figure 13.2** — This graph shows the same data as Figure 13.1 but with some
    mathematical averaging applied, so the peaks and valleys in signal strength can
    be seen more clearly.


    Although localized pockets of absorption can occasionally cause fading, this is
    not the most common process. Typically, fading occurs when a signal is redirected,
    that is the reflecting surface that normally reflects the signal toward your receiver
    is “warped” and so reflects the signal in somewhere else, causing it to skip over
    your head or make landfall before it gets to you. We also cannot discount lateral
    deflection, when the signal is redirected in azimuth due to the Earth’s magnetic
    field. However, this is usually a long-term effect, not generally responsible
    for the short-term excursions we associate with fading.


    In reality, it’s a good thing that most HF radio transmissions are not laser beams;
    if such were the case, fading would be much more dramatic. As it is, radio reflections
    typically involve a large swath of ionosphere, so that localized ripples are somewhat
    averaged out. In other words, the ionosphere has somewhat of a diversity property
    built in, working in concert with a typically wide beam of an Amateur Radio transmission,
    or even a broadcast transmission.


    Most radio signals take a number of paths to get from point A to point B, even
    if these multiple paths are very close to one another.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Phase Cancellation and Reinforcement


    Another common form of fading is phase cancellation between a ground wave and
    a skywave, when both waves arrive at the receiver at the same time (**Figure 13.3**).
    You are most likely to notice this effect if you''re listening to a relatively
    distant AM broadcast late at night while driving. You will often hear a station
    fade in and fade out at regular intervals of distance, often accompanied by large
    amounts of distortion during the “down-fade” intervals. The signals reinforce
    when they arrive in phase, and tend to cancel out when they arrive out of phase.
    Depending on the relative strengths of the skywave and ground wave signals, the
    cancellation can be nearly total.


    # AVC, AGC, and Their Kin


    The traditional method of dealing with short term fading has been the AGC circuitry
    incorporated in nearly every modern receiver, which is also closely tied in with
    the typical S meter. Over the years, the AGC has evolved, as understanding of
    ionospheric fading (and improvement in radio circuitry) has progressed. If the
    attack time and recovery time of an AGC system are closely matched to the ionospheric
    fading characteristics, deep fading can be made almost unnoticeable in actual
    operation.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_163_0.png)


    # Dispersion


    We''ve established that the ionosphere is **dispersive**, that is the refractive
    index is dependent on frequency. Most hams understand this when they go about
    selecting a band to operate on. What most don''t realize is that this dispersion
    can be significant within the bandwidth of a single radio transmission! If you
    are operating full AM, the upper sideband, being higher in frequency, will penetrate
    the ionosphere slightly further than the lower sideband, and therefore has a slightly
    longer propagation path. This is not to imply that if you transmit an AM signal,
    your lower sideband will arrive in San Angeles, and both paths comfortably overlap.
    But not always. There are many cases of *selective fading* where two segments
    of one''s transmission arrive far enough apart to be receivable with the same
    antenna! In fact, this was one of the compelling incentives for the development
    of Single Sideband. An SSB signal has less frequency dispersion than a full AM
    signal, and is more likely to arrive intact at a distant location.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'But you don''t even have to be transmitting voice to experience selective fading
    issues. The problem first became...well...a problem during the 1930s, and was
    further more problematic when the first radioteype (RTTY) circuits were deployed.
    RTTY uses frequency keying (FSK) to generate MARK or SPACE tones, and typically,
    these are just a few herz apart. As it turns out, the MARK and SPACE tones can
    show severe fading issues, which could make communications utterly impossible.
    And it is the same phenomenon that makes HF packet unreliable; more advanced methods
    such as FACTOR take into account selective fading.


    # Diversity


    This brings us to a topic and a method, which while being widely deployed in military
    and commercial applications, has seen limited use in Amateur Radio, namely diversity
    reception. Now, there are a few different types of diversity used in various radio
    services, but here we are speaking of spatial diversity. A diversity receiving
    system has two widely spaced antennas, two receivers, and a method of locking
    the receivers directly in frequency. Often, they are connected together to share
    a common detector bus, as well.


    The diversity method was developed by Harold H. Beverage (famous for the low noise
    receiving antenna bearing his name) and his colleague H.O. Peterson. A fascinating
    history of their discovery of the mechanism of selective fading can be found here:


    www.radioblvd.com/DiversityDD1.html.


    Fundamentally, the solution to selective fading is to have two receivers far apart
    so that, at least statistically, neither will fade out entirely at the same time.
    You may have noticed in the cited article, that Beverage and company had built
    a large number of triple diversity receiving sites. This may be a little overkill
    for amateur operation, but certainly worth experimenting with!


    It should be fairly obvious that you might have to experiment to find not only
    the optimum spacing for diversity receiving antennas, but also the best orientation
    relative to one another. And of course, this can only be optimum for one frequency,
    or perhaps a narrow band of frequencies.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'Because of the complexity of a true diversity system, the place in Amateur
    Radio where it is most likely to be of great benefit would be in a fixed point
    digital link, such as those commonly set up for PACTOR III. The combination of
    selective fading immunity afforded by such protocols addition to a diversity reception
    scheme would make for an incredibly robust and reliable HF link.


    # Synchronous Detection


    While not a diversity method itself, so-called synchronous detection can reduces
    or eliminate several problems relating to selective fading. Remember our example
    of driving along listening to a distant AM station, and how''d periodically receive
    the signal with lots of distortion? This distortion is a result of the carrier
    wave going away, either due to phase cancellation between the ground wave and
    the skywave, or simply selective fading.


    The use of a synchronous detector mitigates the problem by supplying the missing
    carrier with a local oscillator. Synchronous detection has been around for a long
    time (in fact, the reception of suppressed carrier SSB is a form of synchronous
    detection), but it has only recently been used to any significant degree in Amateur
    Radio.


    A true synchronous detector has a phase locked loop that is locked to the carrier
    frequency of an incoming AM signal, which is then used in a product detector to
    demodulate that AM signal. If the original carrier level drops below the level
    necessary to maintain phase lock, the free-running PLL is still enough to fill
    in until the carrier returns to a suitable level, effectively getting rid of the
    selective fading distortion problem.


    The synchronous detection method should be of interest to anyone operating AM,
    whether a boat anchoricionado, or ham wanting to experiment with full AM. There
    are still many advantages to full AM, especially with regard to ionospheric research
    and experimentation. See the Appendix, Understanding AM for more information about
    this mode.


    # Frequency Diversity


    While frequency diversity is a method generally used by commercial entities at
    microwave frequencies, it still has potential for HF. Radio'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'amateurs instinctively use a form of frequency diversity whenever they change
    bands to accommodate changing conditions. At a somewhat higher degree of sophistication
    is adaptive frequency selection, more often used in military applications, where
    optimization of HF frequency is determined by “pinging” a path and adjusting the
    frequency to best propagation. It is questionable as to whether this method should
    ever be used on amateur bands, as it has the potential of causing tremendous interference
    if misapplied...but it does demonstrate a great truth. You can only determine
    the best path to a distant station by acquiring some kind of feedback from that
    station. The feedback can consist of something as simple as an honest signal report
    (you always give those out, don’t you?). Or it can be something more sophisticated,
    as an in-band telemetry signal from the other end (which is perfectly legal, by
    the way, seldom if ever implemented).


    One method that is tantamount to frequency diversity is full duplex operation.
    While standard practice on the maritime bands, it is essentially never used on
    amateur bands (except some amateur satellite operation). As we have established,
    HF propagation is seldom reciprocal; the best frequency (or even band!) from point
    A to point B might not be the best (or band) going from point B to point A. With
    full duplex, you can optimize the AB and BA paths and equipment separately.


    Full duplex operation requires a bit more station complexity, of course, since
    you need two receivers and two transmitters. For reliable emergency communications,
    it is well worth the effort, and the advantages are quite obvious, the primary
    one being there is no delay time between transmission and reception, a most for
    rapid-fire emergency and tactical communications. (By the way, this somewhat simplifies
    interfacing with a phone patch where there are no VOX adjustments to fiddle with,
    or PTT switching involved). And yes, phone patching ever works with cell phones!)
    There’s also the simple matter of redundancy; two radios are usually better than
    one. By the way, contrary to some “information” out, full duplex on HF is perfectly
    legal; it’s the same as running split. While some split up more bandwidth, this
    is really a highly illogical conclusion).


    Although space diversity antenna systems can use a bit more real estate than “normal”
    antennas, receiving antennas can be much smaller than'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'transmitting antennas in many cases. Space diversity can work with small tuned
    loops just as well as with full sized dipoles or other large antennas. It is an
    old, proven technique that deserves a place in Amateur Radio, especially in emergency
    communications scenarios.


    # Stretching Your Days


    Certain antennas have a reputation for “working longer hours” than others. In
    other words, as daylight fades along with its attendant good propagation (at least
    on the high bands), some antennas seem to keep working later. Likewise, some antennas
    are credited with “waking earlier” too. While the debate, informed as by folklore
    and mythology as science, promses to continue for the foreseeable future, the
    principles necessary for “long day” antennas are well known. Simple geometry tells
    us that the daylight light path approaches the horizon, an antenna with a lower
    angle of radiation will generally work better. And, as we’ve established, up to
    a certain point, the higher the antenna, the lower the angle of radiation, all
    things being equal. One antenna’s often credited with having “longer days” is
    the cubical quad. Most likely this is due to the fact that, in comparison with
    a Yagi of equivalent gain, the quad’s pattern is a little more “squashed” in the
    vertical plane. In addition, most hams, when talking about the height of their
    antennas, use the height of the feed point as the reference. A cubical quad fed
    at the bottom has a lot of activity well above that point, so in effect, the center
    of radiation is a bit higher than that of the Yagi. This demonstrates why it’s
    so important to use uniform standards. Most hams are guilty of comparing apples
    to oranges a lot of time.


    But there may be some validity to the cubical quad advantage in that the cubical
    quad occupies a bit more volume of sky than the Yagi. In other words, it probably
    has a bit of built-in space diversity due to its larger enclosed volume. It is
    unknown whether anyone has done any rigorous experimentation to prove this out,
    but it might be well worth the time for some ambitious hams to actually do this.


    # Multipath Matters'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'Multipath propagation, that is the ability for a single transmitted signal
    to take more than one path from Point A to Point B, can manifest itself on wavelengths
    anywhere from ELF up to the color blue and beyond. Whenever a multipath situation
    exists, there is always the potential for constructive or destructive interference.
    Of course, nothing is inherently wrong with either type of interference; all directional
    antennas rely on interference for their function. But it''s a different situation
    when two or more paths have a relative delay time on the order of thousands or
    hundreds of a second of *microseconds*. Long time multipath effects can have detrimental
    effects on audio intelligibility or the ability to decode digital signals at all.


    Most HF operators of long standing have heard short-path and long-DX signals,
    often at the same time. When the conditions are such that signals can be heard
    with approximately the same signal strength, the result can be anything from “curious”
    audio effects on phone to complete *blurring* or *smearing* of CW or digital signals.
    The most obvious solution is to have enough antenna front-to-back ratio to eliminate
    one of the signals. This may be a bit easier than said done, especially on low
    bands. Fortunately such conditions are rarely enough, so that they''re generated
    more of a curiosity than a problem.


    Multipath problems can be severe — well as far more frequent — using *near-vertical-incident-skywave*
    (NVIS) methods. This is because one can often receive F1 and F2 layer reflections
    as well as the X and O mode waves from each! This is more likely to happen near
    the magnetic equator, where the X and O signals are relatively well overlapped
    in azimuth, but rather divergent in reflection height. (In places like interior
    Alaska, the X and O mode signals are highly divergent in reflection height and
    direction, so you don''t often receive them both at the same place, especially
    in an NVIS configuration.) Note: the reason high latitude ionograms so clearly
    show the X and O traces is because the transmitting antennas are wide-beamed,
    while being nominally “VIS” patterns, they cover a lot of sky. The same is essentially
    true of the receiving antennas as well, unless specially configured to be narrow-beamed.
    More on this in the upcoming chapter on NVIS methods.


    So, what *can* be done to eliminate multipath if both signals are coming from
    the same direction, delayed in time, such as in the case of'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'simultaneous F1/F2 reflections? Obviously, no known antenna configuration can
    solve this problem. However, some intriguing possibilities exist in the area of
    digital signal processing. Since time-delayed multipath signals are generally
    very similar in pattern to the desired signals, DSP can be used effectively to
    erase the duplicate signal. This is not much different from using a DSP audio
    to get rid of an offending carrier; it just takes a little more processing and
    sophistication to get rid of a vocal snippet. DSP is evolving at an impressive
    rate, and as it is used to address these particular propagation issues, we can
    expect to see some significant improvements in performance, even if overall HF
    conditions deteriorate.


    # In Conclusion


    There is a lot more experimentation that can be done with diversity receiving
    methods. Several commercial radio manufacturers have incorporated diversity reception
    methods into their HF transceivers. We have included a couple of block diagrams
    for effective diversity reception to get you started in an Appendix.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 14


    # WWV and Channel Probes


    One of the most useful tools for studying and predicting the ionosphere is free
    for the taking. We''re talking about the continuous broadcasts of NIST stations
    WWV (Fort Collins, Colorado) and WWWH (Kauai, Hawaii). NIST, the National Institute
    of Standards and Technology, formerly the National Bureau of Standards (NBS),
    has continuously transmitted time, frequency, and propagation information since
    nearly the beginning of radio. There is a wealth of information in these broadcasts,
    both hidden and not-so-hidden, that is of great benefit to radio amateurs. You
    are strongly urged to investigate the NIST Time and Frequency Services website
    at www.nist.gov/pml/div688/grp40/ to learn more about these stations and their
    broadcasts.


    The repeating broadcast format, valid for all the WWV frequencies is shown in
    **Figure 14.1**. According to the website, beginning in April 2014 there is also
    experimental temporary broadcast on 25 MHz, which may become a permanent feature
    in the future. For many years NBS broadcast on 25 MHz, but discontinued that broadcast
    around the time it became NIST. During periods of more solar activity, this 25
    MHz broadcast is increasingly useful.


    It is important to note that not only the WWV and WWWH broadcast frequencies are
    extremely precise, but so are the audio tones, as well as the effective radiated
    power. Most hams are well familiar with the “atomic accuracy” of WWV’s time signals,
    but do pay much attention to, and seldom use, the precise RF characteristics of
    the station(s). NIST''s scientists and engineers have put a tremendous amount
    of time and energy into producing this world class instrument, freely available
    to anyone with a general coverage receiver. Hams would do well to take advantage
    of all WWV has to offer.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_171_0.png)


    Figure 14 — The WWV schedule. The repeating broadcast format is valid for all
    the WWV frequencies.


    In addition to the better known WWV and WWVH broadcasts, there are the VLF broadcasts
    of WWVB at 60 kHz, also originating from Fort Collins, Colorado. This is the broadcast
    that most low-cost-“atomic accuracy” wall clocks use for their reference. It is
    a fun and somewhat challenging project to build a receiver for 60 kHz, and is
    good practice for any ham interested in experimenting with the “long waves.”


    # More than Time


    There is no excuse for any 21st century radio amateur to not know exactly where
    he is as well as when he is. Of course, most have have set their station clocks
    to WWV for the better part of a century. The master clocks at WWV have had atomic
    accuracy, and have now, for some time, been able to come close to that accuracy…at
    least for the short term. Only in recent years have h (or anyone else) had access
    to equivalent accuracy when it comes to position.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'Today, with the ready available of GPS receivers, any ham or other person can
    determine their absolute location on Earth to within a few feet. Needless to say,
    WWV knows the location of their antennas to equal accuracy.


    “So what?” you may ask, if we know the precise location of a transmitter and say
    to within a few wavelengths, and the precise time at both locations, we can do
    some really interesting experiments.


    One of the features of a WWV broadcast is the “time tick.” These once-second,
    very precise audio tune bursts (which only sound like a tick to the human ear),
    give us the ability to do “time of flight” measurements. That means measuring
    the time it takes for a radio signal to get from point A to point B. Now, obviously,
    if we’re using WWV as time reference by itself, it isn’t too useful for determining
    how long it takes for a WWV tick to get from Fort Collins, Colorado, wherever
    we happen to be. However, with GPS we have an absolute, coordinated and synchronized
    time reference. With some fairly simple apparatus, namely a general coverage receiver,
    an oscilloscope, and a GPS receiver (optimized for time), we can now look at the
    absolute time of travel of the leading edge of WWV’s tick to our location, easily
    to within a few microseconds.


    As just one example, with this information we can determine with a lot more reliability
    how many hops it for a signal from WWV to get to us. Or, perhaps we already know,
    by some other means, just how many hops it to get to us. In this case, we can
    determine the reflection height, again by doing a time flight measurement.


    Knowing the total number of hops as well the height per hop, allows us to determine
    the total path length. Well, this probably brings up another “so what?” which
    we will address immediately.


    # Absolutely


    One of the reasons hams are careless about S meter reports is that signal strength
    is “all relative, anyway.” All that’s really important is how loud the station
    is compared to the previous station, right? Ionospheric propagation is random
    and nobody knows what their antenna gain anyway, so what good are S meter readings?
    These are the kind of comments one always hears implied, if not stated explicitly
    on the air.'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'The truth is, absolute measurements are absolutely possible. Would WWV spend
    so much effort assuring absolute ERP radiation specifications if they weren''t?


    Let''s make this very simple. If you know a distant transmitter''s absolute effective
    radiated power (ERP), you know the distance this radio signal travels to you,
    and you know your antenna gain and receiver sensitivity, you can absolutely determine
    the path loss between the distant station and you. Or, conversely, if you know
    the path loss and your antenna gain and receiver sensitivity, you can determine
    absolutely the transmitting station''s effective radiated power!


    The bottom line is, we radio amateurs already have at our disposal the means to
    make accurate, absolute measurements of just about anything that needs measuring
    — if we simply apply a little scientific discipline. Of course, there''s more
    to Amateur Radio than making measurements; most of us are happy to make communications
    happen. A large number of hams also want to make their signals better, yet go
    out it in a very haphazard manner.


    # Probing for Information


    The channel probe, described in Chapter 9, consists of a beacon transmitter paired
    with a dedicated receiver, the purpose of which is to continuously monitor a propagation
    path between the two points. The nice thing about WWV is that the amateur community
    can put together an extensive network of channel probes without having to pay
    for a single transmitter.


    Signal strength is just one piece of information you can derive from a channel
    probe, however. Measuring Doppler shift is a great way to determine the stability
    of the ionosphere, and a sensitive predictor of disruptions on the horizon. Although
    it''s easiest to measure Doppler shift when you have a single reference oscillator
    for both the transmitter and receiver, as in the case of an ionosphere, most modern
    amateur receivers have more than enough stability to detect Doppler shift of incoming
    signals.


    If you have a computer with a sound card, all you need to do is connect your receiver''s
    audio output to the sound card line input, and tune the receiver, in USB mode
    for a low frequency note (100 Hz or so, high'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'enough to be in the passband of your sound card) between the BFO and the carrier
    of the station in question (WWV in this case). You may have to use your IF shift
    to scout your SSB filter down to accommodate the tone, if it normally cuts off
    at 300 Hz or so. Doppler shift will manifest itself as a slight audio frequency
    shift, upward in frequency for an advancing (lowering) ionosphere, and lower in
    frequency for a retreating (rising) ionosphere. If you have an audio program like
    Audacity, you can do an FFT frequency measurement of the beat note. Or if you
    want to go low tech, you can just connect a frequency counter to your receiver''s
    audio output.


    # Minding the Gaps


    Since no WWV transmission is inside any amateur band (the closest it gets to being
    so is on 10 MHz, which is just a sliver below the 30 meter band), you may have
    to interpret the results by listening to WWV to actual Amateur Radio conditions.
    In most cases, little extrapolation is necessary. The 15 MHz WWV signal is a pretty
    doggone indicator of 20 meter propagation. The 20 MHz WWV signal is an even better
    predictor of 15 meters.


    On the other hand, there''s a pretty big gap between 5 MHz and 10 MHz, and conditions
    can vary radically between these two frequencies. Which of these frequencies is
    a good predictor of 40 meter propagation? This is a real tough call. Fortunately
    (or unfortunately) there are a lot of shortwave broadcast stations in this gap,
    and they are very reliable indicators of 40 meter propagation.


    For the newcomer who have felt chagr by the number we sometimes have to work around
    40 meters shortwave stations between 7200 and 7300 kHz, remember this. The broadcasters
    are specifically because it is such a good segment of HF real estate. There are
    more hours per year — indeed, per decade — where propagation on 40 meters is good
    for the better part of a century 40 meters has been the default HF band. In fact,
    recent semi-scientific Internet poll asked the question, “If you had only one
    HF Amateur Radio band, which one would you choose?” Forty meters won, hands down.
    So, despite all the warts and wrinkles and frustrations, 40 meters is a wonderful
    band. And it''s also arguable that it''s wonderful for more hours of the year'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'than any other band. It is perhaps the only true all-around day-and-night HF
    band.


    Well, back to the gaps. Since it''s very close to WWV''s 5 MHz broadcast, we can
    expect that WWV is a great predictor of 60 meter propagation. Incidentallyally,
    as limited as the current 60 meter allocation is, it fills a much needed gap in
    propagation between 80 and 40 meters. A small but growing contingent specially
    appreciates this band in interior Alaska, where it has nearly ideal NVIS properties
    for the region. It’s a resource many hams should use.


    Our 80 meter band falls into a pretty big one, too between the WWV 2.5 MHz and
    5 MHz broadcasts. The 80 meter band is an interesting case in itself. Percentage-wise,
    it’s divided into 75/80 meters, primarily because of the somewhat different “psychologically”
    “missions” of the upper and lower parts. But few hams realize the profound difference
    in propagation that can exist between the top end and the bottom end of the 75/80
    meter band...certainly enough to deem the band physically worthy of being two
    bands.


    Long distance 80 meter propagation resides in that thin line (almost literally!)
    the highly absorptive D layer and the lower edge of the F region. There can be
    remarkably abrupt changes in absorption as you move between 75 and 80 meters.
    Some hams report that it''s just plain easier to work DX on 75 meters than 80
    meters. This is despite the fact that 80 meters is populated by a lot more weak
    signal modes.


    At rate, 5 MHz WWV is probably a weak indicator of propagation on 75 meters, and
    a poor one for 80 meters. This brings us to, if not least, 2.5 MHz. Although 2.5
    MHz is the closest WWV frequency to 80 meters, it’s not close enough to really
    do much good. (At least for amateurs. For shortwave listeners, there’s plenty
    of commercial “tropical band” broadcasting that 2.5 MHz WWV does predict well.)
    The bottom end of 80 meters is 1.4 times the frequency of WWV. That’s a big gap.
    So, probably the best predictor of 80 meter propagation is...80 meters!


    What about 160 meters? Likewise, it’s also a big band, with significant differences
    in propagation between the top and bottom ends. As it turns out, however, the
    best predictor of 160 meter propagation is AM broadcast DX, particularly the top
    end. When you start hearing lots of distant stations your car radio, it’s generally
    time to fire up the 160 meter station. Keep in'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'mind that the AM band is absolutely huge, percentage wise, with the top end
    being well over three times the frequency of the bottom end. So be sure to use
    the upper end of the dial as your “160 beacon.”


    # ## What about Me?


    Needless to say, Fort Collins, Colorado, where WWV resides, is not the center
    of the radio universe, and so, may not be the best predictor of radio “goodness”
    in your bailwick. Even the fine folks at NIST realize this, which is why they
    duplicated WWV (for the most part) in Hawaii, in the form of WWVH. Ideally, to
    create the best overall “picture” it would be nice if VHF were diametrically opposite
    the Earth with WWV, since there’s basically nobody there, they had to come up
    with a compromise. And WWVH is a good one. Between WWV and WWVH, you can really
    get a pretty fair global propagation tool. (Note of curiosity. Directly antipodal
    to Fort Collins, Colorado, is Amsterdam Island, a rock in the southern Indian
    Ocean. Earlier this year there was an amateur Radio DXpedition to Amsterdam Island,
    FT5ZM. Just goes to show you that radio amateurs will do about anything to check
    out radio propagation theories.)


    # ## Triangulation in 3D


    One of the most useful features of a channel probe is that you can do some very
    interesting path studies. By now we trust that we have driven home the concept
    that radio waves (or rays) are affected both in azimuth and elevation by a great
    number of factors. In the case of a channel probe, presumably we know the location
    of both the receiver and the transmitter in question. Knowing both ends of the
    “circuit” we can make fairly reliable determinations about the paths from point
    A to point B. However, this is not so straightforward in many cases.


    Most at one time or another have been involved in fox hunts or hidden transmitter
    hunts. Locating a remote transmitter by triangulation is quite straightforward,
    if the radio signal travels unperturbed in more or less a straight line from the
    transmitter to the receiver. Some very simple trigonometry will allow you to pinpoint
    the location of the transmitter by taking two directional “fixes” from widely
    separated locations. The farther'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'these points are from each other, generally the more accurate your prediction
    will be. As you get closer to the transmitter, you can use simple signal strength
    to do the final homing in the target.


    This process is a whole more interesting if the propagation path is via the ionosphere.
    Before 2 meters became immensely popular, many ham radio clubs on 80 meter fox
    hunts, which were far more challenging even under the best of conditions.


    It is relatively easy to triangulate on an 80 meter signal if it is primarily
    on ground wave. But what if the path is not ground wave, but rather skywave...or
    a combination of both? Can it be done? Yes, it can, but it takes some clever techniques.


    One of the practical uses for HF direction finding is determining the location
    of interfering or interloping HF stations. The ARRL Intruder Watch is on the alert
    for foreign broadcasters and other entities that creep into the amateur bands
    uninvited, and generally unappreciated.


    It''s a relatively simple matter to determine the general direction in azimuth
    using a directional antenna — assuming of course, we take into account the X and
    O propagation information discussed in previous chapters. But finding the distance
    to the offending station (or interference source) can be extremely challenging
    if the distance is great (such as half way around the world).


    To achieve any kind of accuracy using two-point triangulation requires that the
    receiving stations are relatively far apart compared to the distance to the transmitting
    station, which may be impossible to do from the same continent. But the problem
    is even more “tricky” if the received signal is arriving from a high angle, which
    also suggests that it has probably taken multiple hops to get to “us.” Without
    some clever methodology, the best we can do is pinpoint the location in the ionosphere
    where the last hop occurs. In many cases, this may be enough, if we make some
    reasonable assumptions.


    # Vertical Plane Triangulation


    As suggested above, triangulation in the azimuth is familiar methodology for most
    hams, Triangulation in the vertical plane is rarely employed, and yet quite important
    to fully understand a lot of ionospheric phenomena. Very'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'rough estimation of vertical angle of arrival can be done with a single antenna
    or array, but to accurately pinpoint a radio source (which may be a reflection
    or secondary radio source) generally requires two widely separated stations, each
    at a significantly different distance from the source. Figure 14.2. If each of
    the stations can determine the angle to the source, then simple trigonometry can
    be used to determine the height of the reflection. Once this reflection point
    is determined, then one can make some reasonable assumptions as to the location
    of the primary transmitter.


    ![](img/59293a6d87bff070066bbaf783df6263_178_0.png)


    Figure 14.2—This illustration shows the rarely used method of vertical/angle triangulation.
    The principle is identical to triangulating in azimuth, but can yield for more
    meaningful results for the student of the ionosphere. The farther the two receive
    sites are separated, the greater the accuracy of the measurements.


    # The Interferometer


    The interferometer is an instrument that is probably worthy of an entire chapter,
    except for the fact that most radio amateurs probably don’t have the real estate
    to build a really effective one, for HF frequencies. Instead, we will discuss
    the principles of interferometry in just enough detail that you can adapt it to
    your needs and curiosity level.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Any directional antenna — and we truly mean any directional antenna — ultimately
    functions on the principle of wave interference. This is true whether you’re working
    with a Yagi, a phased array, a parabolic dish, or even a random wire. Any time
    you have multiple sources of radiation, there is the certainty of either constructive
    (in phase) or destructive (out of phase) interference at some distant location.
    Perhaps you might ask how a Yagi could be multiple sources of radiation. If you
    recall our strong emphasis on reradiation early in this book, you will realize
    that every “reflector” is actually a secondary emitter. In the case of a Yagi,
    the driven element and parasitic sources are quite close together. The same is
    the case for the typical phased array.


    The interferometer, is simply stated, a receiving array where the currents and
    phases on each of the elements is closely measured. There is no strict line of
    demarcation between a normal directional receiving antenna and an interferometer.
    However, it can be said that in an interferometer the elements are far enough
    apart that there is no interaction (magnetic coupling). A large baseline interferometer
    in which the spacing between elements is many hundreds or thousands of wavelengths
    apart at the frequency of operation. In such a case, each element is associated
    with a separate receiver.


    Large baseline and very large baseline arrays are used extensively in radio astronomy.
    In order to reassemble a proper picture, the relative phases of each of the elements
    must be precisely synchronized. At one time this would be an unthinkable prospect
    for any radio amateur; nowadays, fully coherent multiple receiving stations are
    within the reach of any technically astute radio amateur, at least in the HF frequency
    range. However, this is somewhat geeky stuff that is beyond the scope of this
    chapter, though you should at least know the technology exists.


    A much practical interferometer for most hams is a relatively widely spaced array
    of a few elements feeding a single receiver or a group of co-located receivers.


    An interferometer array can be one-dimensional, such as a collinear array of dipoles.
    It can also be an end-fire array of dipoles. A two-dimensional interferometer
    can consist of a combination of collinear and end-fire dipoles. Theoretically,
    a 3D interferometer could be built of multiple layers'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'of 2D arrays, but this is normally too unwieldy to consider amateur work.


    A wide-spaced square array of four horizontal dipoles can be used to determine
    both azimuth and elevation angle of incoming radio signals. Actually this can
    be done with just three dipoles in a triangular array, but the number crunching
    is a bit more involved.


    # The Direct Conversion Shortcut


    The most elaborate array of antennas won''t tell you much unless you have a receiver,
    or several receivers. In an interferometer, the receiver at the very minimum must
    extract signal phase information from its associated antenna element. In some
    cases, it''s helpful to have amplitude information, but for strictly direction
    finding, this isn''t too crucial. The relative phases of each element need to
    be accurately determined as well, which requires fully phase coherent receivers.
    This used to be a considerable engineering challenge, but not with the direct
    conversion receiver. Using simple direct conversion techniques, actually nothing
    more than a stable local oscillator and a number of doubly balanced mixers, a
    phase coherent receiver with any number of channels can be assembled very easily.


    The output voltage of a doubly balanced mixer is a dc voltage which is directly
    proportional to the phase angle between the incoming signal and the local oscillator
    (which is on the same frequency as the signal of interest). By looking at the
    relative dc voltages coming from each of the balanced mixers, we can then determine
    the direction of arrival of a signal. The actual circuit configuration is covered
    in more detail in *Radio Science for the Amateur* for those interested in pursuing
    this technology further.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Chapter 15


    # Software and Other Tools


    There are a number of extremely useful and fascinating prediction tools available
    to the radio amateur. Often these are associated with antenna modeling programs,
    which makes perfect sense. Antennas are our only interface between radio propagation
    and everything else we do in the ham shack. We take advantage of propagation characteristics
    primarily by making adjustments to our antenna systems...ranging from minor tweaks
    to major overhauls.


    One must be cautious when using propagation modeling tools, as with any computer
    modeling software. Computers are notoriously lacking in common sense; won won''
    actually think for you. You need to have a fairly good idea of what the answer
    will be before you feed your problem to a computer.


    As we have already elaborated, only in recent years have any propagation modeling
    programs (at least those available to the radio amateur) incorporated the effects
    of the Earth''s magnetic field. Even now, you will be hard-pressed to find a propagation
    program that distinguishes between X and O modes. Nevertheless, with the software
    we do have, and considering the information we know about the mechanics of ionospheric
    propagation, we can do some pretty useful modeling. Hopefully, the “code poets”
    amongst us will be motivated to work more X and O parameters in propagation programs.


    To get a glimpse of what''s available in terms of propagation software, here is
    a great site: www.dxzone.com/catalog/Software/Propagation/.


    We''ll take a look at a number of these programs and give you some pros and cons
    of each of them. Another good site is www.astrosurf.com/luxorium/qsl-review-propagation-dos.htm,
    which also includes some comprehensive reviews of existing propagation software.
    And there is a lot of information on the ARRL website at www.arrl.org/propagation-of-rf-signals.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Probably the first propagation prediction program (say that three times fast!)
    widely known to radio amateurs was MINIMUF. It was presented in December 1982
    QST by Robert B. Rose, K6GKU. Written in a mere 80 lines of BASIC code, its purpose
    was to predict the maximum usable frequency (MUF) between two selected locations
    on Earth. Despite its primitive command-line coding, it served well for over a
    decade, at a time when hams were first inviting these strange devices known as
    computers into their ham shacks. Development of this software emerged from the
    Naval Ocean Systems Center (NOS) as MINIMUF 3 (about the same time as MININEC
    3 antenna modeling software came out). It says something that the best and brightest
    nights on the planet could create a scientific computer program with 80 lines
    of code, while a typical modern operating system needs a million times that just
    to clear its throat!


    Maximum usable frequency, as described earlier, is still one of the best benchmarks
    for predicting usable radio paths and times of operation. As a good of thumb,
    the lowest path occurs when the operating frequency is at 10% below the MUF. Obviously,
    you don''t always have the option of selecting the optimum operating frequency
    based on MUF, since that frequency is as likely to fall outside an amateur band
    as within it. But MUF is certainly capable of telling you which band you need
    to be operating for the best results.


    We can get a first order approximation of MUF from the simple formula:


    ```

    MUF = \frac{Critical Frequency}{Cos(\theta) Angle of Incidence}$

    ```


    where the angle of incidence is the angle from the zenith (not elevation angle).


    Of course we need to know what the critical frequency is first at the “mid-hop”
    which can only be measured with something like a vertical incidence iononde. MINIMUF
    was the first “ham-available” program that could derive the critical frequency
    directly from solar data. Of course you needed to get that solar flux from somewhere,
    such as the WWV broadcasts.


    As groundbreaking as MINIMUF was, it wasn''t long before a number of hams ran
    across some deficiencies of varying severity in the modeling,'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'especially with regard to polar paths. A search through the QST archives (available
    from the ARRL website to any ARRL member) for MINIMUF will reveal some interesting
    revisions and comments pertinent to MINIMUF. At this point in time, MINIMUF is
    probably only important as a historical curiosity; however, it''s probably safe
    to say that all modern propagation prediction software has its roots in MINIMUF.


    A fairly direct descendant of MINIMUF is MicroMUF, which was also written in BASIC.
    It was developed at BBC and Radio Netherlands, primarily for use by avid European
    SWLs (shortwave listeners), but worked itself into the Amateur ranks, which is
    still highly popular. It lacks the elegant user interface of a lot of modern programs,
    but it is a powerful piece of software that addresses many of the issues with
    the MINIMUF. As with MINIMUF, the source code for MicroMUF is readily available,
    an important consideration for the radio amateur who actually wants to continue
    to improve the software. Several third party interfaces have been created to use
    MicroMUF as the “back end” as well. In regard, the development path of MicroBUF
    has been quite similar to the many antenna modeling programs based on NEC-2 and
    MININEC...that is, the addition of increasingly user graphical interfaces to a
    “back end” that is already powerful and proven. (More information on antenna modeling
    may be found at www.arrl.org/antenna-modeling.)


    # Suite Deal


    The Institute for Telecommunications Sciences (ITS) has developed an extensive
    suite of propagation prediction software in a package called ITSHF. (Like nearly
    all HF propagation programs, this software is free). ITS-HF is also included as
    a plug-in with 4nec antenna modeling software.


    At the cost of ITS-HF are a couple of mature programs, IONCAP and VOACAP. IONCAP
    stands for Ionospheric Communications and Prediction program, while VOACAP was
    the same program with enhancements developed by Voice of America (VOA). A detailed
    history of the development of VOACAP is available here:


    www.astrosurf.com/luxurion/qsl-soft-voacap.htm.


    Like a lot of hard core number-crunching programs, it was written in Fortran,
    but parts of it have since been ported to some other modern'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'languages. However, Fortran is still the benchmark program for most numerically
    intensive number crunching. It will be around for a long time to come.


    At any rate, the ITS-HF suite allows you to insert just about every possible variable
    between a transmitter and a receiver, including such parameters as antenna gain
    or local noise levels. Then, through a series of subroutines, based on your priorities,
    it will tell you the total signal path, the path loss, the per hop, the optimum
    working frequency, beam headings for transmitter and receiver, optimum time of
    day, month, or even solar cycle. There are too many parameters to describe in
    detail here, but it only takes a few minutes to download and install the entire
    suite, so the best advice is to just start playing with the program. The documentation
    is extensive, but most of the input fields are self-explanatory anyway.


    One interesting feature of IONCAP is that it correctly assumes that there will
    be a number of possible paths a signal can take through the ionosphere between
    Point A and Point B. It allows you to choose which ionospheric layer you use...or
    all of this. This is especially useful for “The Magic Band (6 meters), for instance,
    where sporadic E, F1, and F2 paths might exist simultaneously.


    # Prolab Pro, Version 3


    Prolab Pro, Version 3 software (www.spacew.com/prolab/) deserves special note,
    because at this point in time, it is the only commercially available software
    (that we know of) that models X and O propagation modes independently (or at all).
    It explicitly calculates non-Great Circle paths and other parameters uniquely
    related to X and O propagation.


    These features alone make it worth the somewhat hefty price (on the order of $350),
    for the serious radio propagation student. It also has some eye catching-tracing
    graphics, if that sort of thing is important to you. Of course it is; if you use
    this program at all, you''ll find yourself using it a lot. You don’t want to bore
    your eyeballs with lame graphics! See Figures 15.1 through Figure 15.3 for a glimpse
    of Prolab Pro’s capabilities.


    # Gray Area'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Most worthy propagation prediction programs include gray line information (Figure
    15.4), although it may be a bit difficult to call the presentation of gray line
    information “prediction.” This is because the gray line is as predictable as clockwork;
    it’s an anomalous phenomenon. There are a number of great free-standing gray line
    clocks and gray line overlays for propagation charts.


    Just because the gray line is so predictable, doesn''t mean it’s of any less importance
    in radio propagation studies. In fact, all propagation prediction software that
    you input your time of day, or the other station’s time of day, or both.


    One aspect of gray line that is not a gray area is its importance for any serious
    DXer. Many hard-core DXers confine their entire operation to gray contacts because
    this has the greatest possibility of yielding the best results most of the time.


    ![](img/59293a6d87bff070066bbaf783df6263_185_0.png)


    Figure 15.1 — ProProp Pro 3 is a true ray program showing the paths of the O ray
    (red on the computer screen, the top trace in this illustration) and the X ray
    (green on the screen, the lower trace here). You can see all the hops between
    the transmitter and the receiver...if the signal can actually make it there. This
    plot shows a 7 MHz path between Fairbanks, Alaska, and Baffin, Canada.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_186_0.png)


    Figure 15.2 — We have the same source and destination plotted as in Figure 15.1,
    but with the graph turned to look straight down. Fairbanks, Alaska is the small
    square, and Baffin Island is the small triangle in the upper left. A straight
    line between these symbols represents a Great Circle. Notice how the rays diverge
    not only from the Great circle. Proplab is the only propagation program available
    that accounts for the Earth''s Magnetic field. (After I discovered this program,
    it''s the only one I use!)


    Of course, this does not work everywhere. A good example of the “gray line exception”
    is here in northern Alaska, where in the dead of winter, the gray line is perfectly
    horizontal where it intersects Fairbanks. To shoot the gray line you need to aim
    due East or West. If you aim west, you might graze some Eastern Europe, but if
    you aim East, there''s nothing there! The gray line goes into a black hole, ham
    radio wise. There are a number of other locations where no two distant locations
    (at least with any population) happen to lie on the same gray line. So, useful
    as the gray line is for a lot of hams, it can be useless for others.


    One clear advantage of working gray line, when possible, is that the gray line
    path is less selective than other paths. Since it is the twilight zone between
    daylight propagation and nighttime propagation, it can be characterized as neither
    a “high-band” nor “low-band” mode. In fact, it is both. You have a much greater
    chance of earning 5-band (or more) DXCC “wallpaper” by working gray line than
    you do “normal” paths. Another advantage, from a software point of view, is that
    multi-hop propagation “number crunching” is a bit simpler. The reason for this
    should be clearly clear. Along the gray line, the ionization levels, reflection
    heights,'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'and critical frequencies are going to be very similar. Therefore a single hop
    profile can be more readily extrapolated to a multi-hop path. Any point along
    the gray line is, from a propagation standpoint, the same time of day. This also
    holds true for any point on a line parallel to the gray line. Or, put another
    way, you don''t have to shoot down the center of the gray line (which is not a
    line, but a rather fat band); you can hug one edge of it, as long as the other
    end hugs the same edge. This is not to imply that you can’t “cross” the gray line
    with great effectiveness; it’s just that if you want to see the uniformity of
    gray line propagation, you need to run parallel to it.


    This is another instance of why the “sloppiness” of a typical HF antenna pattern
    is actually helpful. Any practical ham radio beam pattern is going to effectively
    cover the entire width of the gray line, under most circumstances. Gray line propagation
    is, for the most part, a very forgiving mode of operation, one that works very
    well for most hams of limited means. The only real price you pay for being a dedicated
    gray line operator is sleep deprivation! No matter where on the gray line you
    happen to be, whenever there’s decent propagation to where you want to propagate
    to, it always seems like it’s three in the morning. Of course, there’s no scientific
    proof for this!'
  merge: -1
  pgno: 187
- img_proc: true
