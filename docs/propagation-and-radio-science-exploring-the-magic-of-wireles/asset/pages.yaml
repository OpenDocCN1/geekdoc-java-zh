  md: '# Matters About Matter


    # Some Ado about Nothing


    Before fully describing how radio waves behave in empty space, it might be helpful
    to define what empty space is. The obvious answer, of course, is that it''s space
    with nothing in it. However, physicists have debated for ages about just what
    is meant by “dense soup of understanding of empty space. The most recent understanding
    of empty space is that it''s actually a countless trillions of particles and antiparticles
    continuously being created and annihilated. It probably doesn’t sound very empty...or
    helpful. The good news is that all these particles being created and annihilated
    don’t really matter to us much as radio amateurs. For our purposes, we can consider
    empty space truly empty. So called “classical” electromagnetism describes how
    we can have electromagnetic waves without the need for “anything” for them to
    propagate through. James Clerk Maxwell created a famous set of equations that
    show that an “ether” is not necessary for the propagation of electromagnetic waves
    (although nothing disproves the existence of an ether). It’s just not necessary
    in order to make radio happen.


    # First Things First


    In texts on radio propagation, it’s assumed that the audience has a working knowledge
    of electrical principles in normal conductors, such as Ohm’s Law, capacitive and
    inductive reactance, and so forth. Although it’s certainly helpful to have this
    information in advance, it’s not strictly necessary. In fact, many misconceptions
    and some confusion about normal electrical circuits can be avoided by looking
    at the sorts of forces common to radio and regular electricity. We will find an
    amazing and comforting reciprocity between circuits and waves. In either case,
    we will'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'start with the behavior of some fundamental building blocks of matter, primarily
    electrons and protons and their associated charges.


    In addition to ignoring the “particle soup” in the paragraphs above, we can also
    ignore the more common neutrons. For electronics and radio folks, neutrons are
    pretty much mere intellectual placeholders; their interactions with our radio
    waves are essentially nonexistent.


    # A Weight Matter


    If you were to pick up a piece of copper wire, you would recognize it as having
    some mass. This is not the same thing as weight. Weight is the effect that gravity
    has on mass. Weight is a force, mass is not. In outer space, your piece of copper
    wire would have no weight, but it would still have mass. This is merely a matter
    of semantics; later on we will have to have a firm grasp of mass to make sense
    of this whole radio business. Now, not only do you recognize that copper wire
    has mass, but you probably recognize it as being copper. What makes copper uniquely
    copper, and not, say, iodine? Copper is made of copper atoms. Each atom has 39
    protons (39 electrons). You can clip the wire into as small a morsel as you like,
    and each morsel will be copper. This was the historic understanding of atom: an
    indivisible sample of some substance. Now, we know there are things smaller than
    atoms. In fact we know there are things smaller than protons and neutrons, which
    are made of yet smaller things quarks and such. We don''t need to worry about
    quarks either, but they’re fun to know about.


    A proton has 2000 times as much mass as an electron. And most types of atoms have
    numerous protons in them. So goes without saying that far as our senses go, the
    protons are much more important. We could probably not feel the extra weight the
    electrons would contribute to the piece of copper we’re holding. In fact, electrons
    weren’t even recognized until a little over a hundred years ago, even the ancient
    Egyptians did things like electroplating, which is the result of movement of atoms
    through a chemical solution. More precisely, it is the movement of ions, which
    are charged atoms that do the work in such processes. Much more on ions later.'
