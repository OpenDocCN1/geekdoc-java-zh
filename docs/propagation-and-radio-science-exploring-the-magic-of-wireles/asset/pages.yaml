  md: 'hot! A resistor''s value is real (resistance measured in ohms), meaning that
    it consumes actual power and converts it into either real work or heat. It is
    a very straightforward concept, and is the dominant factor in all dc circuits.
    In fact, you can go through life pretty nicely without imaginary numbers if all
    you work with is dc circuits.


    # Imagine That


    In contrast real values, imaginary values designate the storage of energy. Capacitive
    reactance and inductive reactance are designated by imaginary numbers because
    they describe components that don''t actually consume energy (do real work), but
    merely store it for release at a later time. We use the word “merely” under advice,
    because this property is of no mere significance. But it is of a very different
    significance. We find that resistance and reactance are orthogonal values...inseparably
    related, but each maintaining their unique identity (Figure 1.2).


    ![](img/59293a6d87bff070066bbaf783df6263_27_0.png)


    Figure 1.2 — Most physical systems in the universe can be described by a complex
    number. Most hams are familiar with the concept of impedance, which consists of
    the real part and the imaginary reactive part. But this concept can be applied
    to many aspects of wave propagation as well.'
