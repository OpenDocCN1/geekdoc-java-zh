- img_proc: true
  md: 'One of the unnecessarily confusing figures you’ll find in this business the
    difference between “virtual” and “true” height. Because the ionosphere is a refractor,
    not a reflector, the speed of radio is not constant through its journey. As the
    radio wave penetrates the ionosphere, it gradually slows down, so it appears that
    the reflection point is a lot higher than it is. (Since time of flight is the
    only indicator we have on Earth for the reflection height, we have to take this
    into account). The “real” or “true” reflection height; that is, the point where
    the wave velocity slows to zero, reverses direction, and accelerates toward the
    surface, is a bit lower, depending on many factors. When calculating skip distances,
    it’s the virtual height that really matters, because it locates the “reflection”
    point in the ionosphere. We will address some of the other parameters later, especially
    with regard to E and sporadic E propagation.


    # Electrons


    Last but not least, we have the electron density profile. This is the black squiggle
    line that starts at 95 km in altitude and runs around 575 km. What this line shows
    the relative number of free electrons versus altitude. The horizontal scale is
    not shown, but it is generally measured in electrons per cubic centimeter or some
    such. Note that it’s not the actual numbers that are important but the relative
    density. Notice there is a well-defined peak at 250 km. This is where you have
    the greatest number of free electrons. The peak of the F2 layer electron density
    is at the F2 layer frequency — from that it’s easy to calculate the number of
    electrons. This is called the critical height, and it’s also the height above
    which ground sounding is impossible.


    Now, the dashed part of the line above the peak of the electron density profile.
    It’s interesting to know that we can get no reflections above this altitude. The
    reason the upper part of the line is dashed, is that the electron density cannot
    be directly measured above this point, so it must be extrapolated. Fortunately,
    it is well known that the electron distribution follows a parabolic curve above
    that point.


    Notice also the tiny bump in density at around 100 km. This is E or sporadic E.
