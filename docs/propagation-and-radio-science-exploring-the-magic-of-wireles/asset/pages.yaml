- img_proc: true
  md: '# Billboard


    One of the most surprising and interesting phenomenon one might encounter when
    using an NVIS antenna, especially in high latitudes, is how well it can work as
    a DX antenna...at times. If a signal is launched vertically and encounters a horizontal
    reflector (the ionosphere) the signal needs to return nearly vertically as well.
    The big *if* here is if the ionosphere is horizontal! As it turns out, the “horizontalness”
    of the ionosphere is a broad assumption that falls apart in many places at times.
    In polar or near-polar regions, the ionosphere can slope down severely, causing
    it to appear as a big slanted billboard or drive-in movie screen (Figure 20.1).
    NVIS signals can reflect off this tilted layer and be reflected at horizontal
    or near horizontal angles, forming a very effective DX antenna.


    ![](img/59293a6d87bff070066bbaf783df6263_234_0.png)


    Figure 20.1 — A tilted ionosphere clearly explains why an NVIS signal at one location
    can appear as a low angle signal at another, and vice-versa. The majority of propagation
    prediction software packages do not account for ionospheric tilt. *Proplab Pro*,
    described in Chapter 15, is one notable exception.


    In Chapter 15, we mentioned the propagation prediction software package *Proplab
    Pro*. In addition to being the only readily available'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'software package that deals with X and O propagation, it is also the only program
    that deals with ionospheric tilt. Both real-life experience and this modeling
    program confirm that this ionospheric tilt can be very dramatic, up to 60 degrees
    or more near the Arctic Circle! This can certainly put some kinks in our understanding
    of “normal” ionospheric propagation.


    Like all ionospheric phenomena, ionospheric tilt is subject to change. During
    much of the year the over interior Alaska can be pretty normal, which is why NVIS
    acts like NVIS a good part of the year. But when ionospheric tilt is in play,
    propagation can be phenomenal...as well has highly non-reciprocal.


    Interior Alaska is often referred to as the “Bermuda Triangle” of radio. While
    signals from just anywhere can be heard most of the time, there are large chunks
    of the year when nothing at all seems to go out. It''s not that the absorption
    is excessively high in the region, but rather that the Earth’s magnetic field
    is nearly vertical at this location, which has profound effects on the divergence
    of the X and O waves, neither of which go in expected directions. This factor
    combined with ionospheric tilt can make radio propagation so difficult to predict
    as to deemed non-existent.


    The advent of Propl Pro begins to make some sense of our strange northern propagation.
    Incidentally, most of what is experienced in high northern latitudes should be
    similarly observed in high southern latitudes. However, since the population is
    so much lower in the southern polar regions, these phenomena aren''t well documented
    or complained about!


    # 60 Meter Magic


    No discussion of NVIS propagation would be complete without some discussion of
    60 meters. 60 meters is actually a very good band for NVIS, since it is nearly
    always above the D-layer absorption frequency, and yet almost always below the
    critical frequency, regardless of your location. This discovery was made in interior
    Alaska long before we had an amateur band in that frequency range. The Alaska
    public fixed frequency of 5167.5 kHz (actually a maritime allocation) has for
    decades before a default emergency frequency in Bush Alaska. Although Amateur
    Radio use of this frequency was forbidden, regular equipment tests were permitted,
    and this frequency proved to be very reliable for most of the state. When'
  merge: -1
  pgno: 235
- img_proc: true
  md: '60 meters first became available, many Alaskan hams knew just what to do with
    it. It is highly recommended that emergency communications minded hams fully explore
    60 meters for its reliable regional NVIS characteristics.


    Also, as in the case of some of your other bands, having regular activity on the
    band is more likely to elicit some DX responses as well. On occasions too numerous
    to mention, many ham bands are deemed to be dead, when the fact is simply that
    nobody is on the air!


    # NVIS Mobile Tricks and Treats


    It''s probably fair to say that the military has led the charge for mobile NVIS
    communications. An Army communications manual from the 1950s illustrates a 12
    foot "tank whip" mounted on the rear of a jeep


    Well, the fact of the matter is that this does work, and it works quite well.
    What the Army lacks in verbosity, they make up for in pragmatism.


    Strolling through the parking lot of the Dayton Hamvention, one will encounter
    a veritable forest of HF mobile antennas. Many of these are low band "Texas Bugcatchers"
    and such, optimized for effective ground wave coverage, no mean that considering
    the restraints one has to work with. Building an HF mobile antenna that works
    at all takes serious plotting and planning, not to mention loading coils with
    a lot of wind drag.


    As we''ve already established, low frequency waves attenuate rapidly, even if
    you have a good ground to start with — a privilege you don''t have in any mobile
    installation. Optimizing a mobile antenna for NVIS can significantly reduce the
    hardware requirements for effective HF mobile operation.


    First of all, an NVIS antenna doesn''t need to be anywhere near as *efficient*
    as a typical HF mobile antenna. The path loss of an NVIS signal is much less than
    wave for most low-band HF frequencies and'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'situations. In most cases, with a long whip, installed as in the Jeep example
    above, a loading coil or tuner at the *base* of the antenna is more than adequate.
    Certainly a center loaded whip, such as a Texas Bugcatcher is much better from
    an efficiency standpoint. However, using NVIS, we aren’t trying to launch a worm-roasting
    ground wave.


    Now, the astute Amateur Radio guru is certain to remind us that bending an antenna
    so that a large portion of it is parallel and in close proximity to the car’s
    body will lower the radiation resistance and efficiency. This is true. But the
    gains achieved by taking advantage of NVIS still outweigh this increased load
    in many if not most situations.


    Here’s another trick you might not have thought about. Instead of just using a
    rope to tie the “top” of the antenna down near the front bumper, you could insert
    a capacitor between the tip of the antenna and the car body. This capacitive end
    loading will create a much more uniform current distribution on the whip, raising
    the effective radiation resistance in the process. You will find that you need
    less loading inductance at the base, as well. Capacitive loading is almost always
    more efficient than inductive loading, anyway.


    # Station Mobile NVIS


    A “station” may be a contradiction in terms, because by definition a station is...well...stationary.
    Nevertheless, there are many instances where a mobile installation is very effective
    even when you aren’t moving. In light of the fact that operating a radio of radius
    is being looked upon in ever more suspicious terms (perhaps rightfully so), it
    will be worth our look to “parked mobile” operations, especially of the NVIS variety.


    While folding a rear bumper whip decreases the radiation resistance, folding it
    *backward* does the opposite; it increases the radiation resistance and efficiency.
    Needless to say, driving a vehicle with an 8 foot whip poking out straight backward
    is probably frowned upon, this can be an effective NVIS antenna while parked at
    your friendly local rest stop or even in your driveway.


    # The Radiating Car'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'Despite the fact that HF mobile antennas have been discussed in great depth
    for decades, there’s one aspect that has been somewhat misrepresented. Most models
    and discussions of HF mobile operation describe the vehicle’s body in terms of
    being an amorphous capacitor plate, with the Earth beneath being some kind of
    counterpoise. This might be a semi-valid analysis if the vertical antenna was
    precisely in the center of the car body, at frequencies where the car body is
    on the order of a half wavelength. This would approximate a “two radial” ground
    plane of sorts. Of course, this model would be entirely invalid for low bands
    where the vehicle is too short in any direction to be a “radial” as well as having
    too little surface area to form a counterpoise.


    Recent, and not recent, antenna modeling has long proven this counterpoise concept.
    We strongly recommend you read the late.B. Cebik’s excellent treatise on the counterpoise
    — and how no device actually exists! (It''s published online at www.annext.com/shack/Dec06/cps.html)
    The truth of the matter is that the typical rear bumper mounted low-band HF antenna
    appears as a vertical whip with very short radial. The fact is that the car body
    has a lot of mass or volume has zero relevance with regard to radiation. The entire
    car body can be resolved into a single wire, moving away from the base of the
    whip, toward the front of the vehicle. This can be proven with any valid NEC modeling
    program, and confirmed with near current measurements.


    Now, while this “radial” is very short in terms of wavelength (at least the low
    bands) it is roughly the same order as a typical vertical whip — eight feet or
    so. What this means is that in actuality about half the signal is radiated from
    the whip and the other half from the car body. This can be viewed as an inverted
    V lying on one leg. The main lobe of radiation bisects the V. In the mobile installation,
    this means the radiation is at about 45 degrees above the hood of the car. (Again,
    this can be confirmed by actual field strength measurements).


    Having established that the car body in most cases radiates just as much as the
    mobile antenna itself, if we were to fold the antenna back horizontally, we can
    reasonably approximate a center loaded, very short dipole (again, assuming low
    band operation). And, of course, this dipole'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'would be ideally oriented for NVIS operation, though perhaps, not at an optimal
    height.


    # For Further Investigation


    While not directly related to NVIS operation, if we recognize that a typical vehicle
    is not a counterpose, but rather half of an antenna, we might consider things
    a bit differently. For example, in the case of base loading, it might be beneficial
    to split the loading coil in half, one half serving as the loading coil for the
    car body, and the other half being for the antenna. The RF would be fed to the
    center of this coil, instead of at the bottom end. This might be a little more
    complicated to implement from a circuit topology standpoint, but it may conceivably
    increase the overall efficiency by “loading” the car itself.


    # A Viable Alternative


    As more and more h face restrictive antenna situations at their home stations,
    the effective HF mobile installation is a very attractive alternative. In fact,
    in many cases a mobile ham station can be much better than a home station even
    without considering antenna restrictions. Even in the most urbanized areas of
    the country, you can often drive to where manmade noise levels are nearly nonexistent.
    Being NVIS savvy can only add to your mobile Amateur Radio enjoyment and effectiveness.'
