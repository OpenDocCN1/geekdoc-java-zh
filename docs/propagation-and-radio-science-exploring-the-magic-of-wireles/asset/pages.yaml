- img_proc: true
  md: 'Let us now return to the venerable Digisonde and see what else we can learn.
    Eielson AFB near Fairbanks, Alaska, recently deployed a Digisonde, much to our
    delight. We''ve been without an ionosonde in this area for many years, and it''s
    great to get a sounder online again.


    In Figure 9.3** above we have a fabulous example of sporadic E as seen on an ionogram.
    Notice the perfectly horizontal trace at above 110 km height. We know this is
    sporadic E because it is frequency independent. But notice the three other horizontal
    traces at 220 km, 330 km and 440 km. These are actually multiple hops...straight
    up and down. This tells us that the absorption is **extremely low**. As noted
    in Chapter 6, in the discussion of Figure 6.6, what''s really happening is the
    energy is going up, coming back to Earth, going back and then coming back down.
    Since we''re really measuring time of flight, it shows up as 2, 3 and 4 times
    the original altitude it''s 2, 3 and 4 times the time of flight.


    These are perfect conditions for smoking hot high-band DX. Notice also that we
    see normal F2 traces above the sporadic E, as well (again with multiple reflections).
    This reveals something very interesting — the fact that as as sporadic E reflections,
    they are not total. Enough RF gets past the E layer to undergo a nice reflection
    at the F2 layer too. This is not always the case; often when there is a strong
    sporadic E event, you don''t see anything happening above it. This gives further
    evidence that the ionization process for F2 is very different than that for sporadic
    E, which is most likely activated by highly localized sources, such as lightning,
    wind shear, or meteor bursts. These events are completely independent of “normal”
    solar radiation ionization.


    Learning how to interpret ionograms completely takes a little practice, but it''s
    a lot of fun too. You are encouraged to look at whatever Digisonde is closest
    to you to see if you correlate its data to the actual propagation you''re experiencing.
    Check out the Digisonde station list at www.digisonde.com/stationlist.html. It
    shows every Digisonde in the world that''s available online (and a few that aren''t).'
  merge: -1
  pgno: 121
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_122_0.png)


    Figure 9.3 — ionogram showing sporadic E propagation. See text for details.


    A few of the sites may need a password to log in. Most of these sites are pretty
    accommodating to radio amateurs; if you just drop the webmaster a note, they''ll
    often give you a temporary login. As a general rule, Digondes are programmed to
    perform a sounding every fifteen minutes; and you can usually access archived
    data back at least a couple of years. Some sounders are set up to perform oblique
    (non-vertical incident) sounding as well, so be sure to read all the supplementary
    data that''s on the ionogram.


    A great reference is UAG-23A, the URSI Handbook of Ionogram Interpretation and
    Reduction. This publication contains the agreed standard rules for interpreting
    ionograms. You can find the latest edition online at https://www.ursi.org/files/Commission
    Websites/INAG/index.html.


    # Dabbling in Doppler


    The ionosphere is not chisled in granite; it moves around a lot. Most Digondes
    are set up to show Doppler shift resulting from the movement of the reflection
    point. Doppler shift is shown by the color of the traces. For the O-mode, downward
    movement will show a shift toward purple, and upward movement will show a shift
    toward orange, with'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'monochromatic red being stationary. (This is equivalent to Red and Blue shift,
    for the astronomers in our midst).


    As mentioned earlier, Doppler shift can be extreme during nightfall, but there
    will almost always be some present during the most stable conditions. The Digisonde
    is set up for oblique sounding, Doppler shift will show drift of the ionosphere
    in azimuth; in effect it shows ionospheric “wind”.


    Again, be sure check all the entries in the legend of the particular ionogram
    in question. Most of the time there will be quite a blank entries, but if the
    ionosonde is set up with all the possible features, the entire column on the left
    may be full of meaningful data!


    # Other Online Instruments


    For the average ham, next to the Digisonde, magnetometer data is probably the
    most useful data, as it can actually predict certain aspects of propagation. While
    the Digisonde, online magnetometers abound, but you may have to look a bit harder
    for them. While the Digisonde pretty dominates the ionosonde market there are
    countless magnetometer manufacturers. Many of them are semi-commercial homebrew
    instruments, being constructed by university students and such, so you won’t find
    a single magnetometer station list (as of this).


    Here is a typical magnetometer website, this one being from the Swedish Institute
    of Space Physics: www.irf.se. Click on Observatory and then Magnetometers.


    This displays the data from a typical three-axis magnetometer, X being north-south,
    Y being east-west, and Z being up-down. There is a lot of useful and educational
    supplemental information on this site, it is common to use a flux gate magnetometer
    to detect the Earth’s magnetic field...actually the change in the Earth’s magnetic
    field. Magnetometer readings are normalized to calm day magnetism. If you look
    at the magnetometer plots in the example, you will see a sharper spike on a couple
    of the axes, which indicates a pretty strong disturbance. Being a three-axis device,
    we can know not only the strength, but the direction of the disturbance in three
    dimensions.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'The much-obsessed-over solar indices can be derived from local magnetometerdata
    data. More on these factors will be coming up later.

    Another instrument that is of particular use in Polar regions is known as the
    riometer, for relative ionosphere opacity meter. This device is a sensitive receiver
    operating in the 30 MHz region that looks for diurnal variations in cosmic noise,
    and is an indicator of ionospheric absorption. Auroral activity is generally highly
    absorptive, and auroral events are clearly seen on the riometer. However, ionospheric
    opacity is a variable that can have large effects in nonpolar regions, as well.


    # Index Finger


    We now come to the most common, if not the most reliable, predictors of ionospheric
    propagation, the solar indices. There are three primary factors that predict what
    propagation on Earth will be: the solar flux, the K index and the A index. Although
    these are important factors, they are not the only factors, and they need to be
    taken with a certain degree of educated interpretation, not if a grain of salt
    or two.


    Before going into these too far, we need to recognize a few things. Number one,
    the ionosphere is a closer to us than the Sun! The Sun is about 93,000,000 miles
    away, while the ionosphere is between 60 and 400 miles away, at the far edges.
    Solar indices can tell you what may happen, while the ionosphere tells you what
    is happening.


    Just as weather "hindcasting" is always more accurate than weather forecasting,
    ionospheric sounding is always more accurate than ionospheric prediction. This
    doesn''t mean that it''s always useful. If you''re a contender, you''d like to
    know what conditions are going to be during the upcoming weekend, to know if it''s
    worth bothering to turn on the rig! And if conditions are currently good, you
    probably don''t need an ionoscope to tell you that! So we need to know what we''re
    looking for, and adjust our prediction and measurement methods accordingly.


    # Suntan


    We described earlier how the best condition for creating a consistent ionosphere
    is a steady bath of UV radiation. The solar flux is measured in solar flux units
    (SFU), where'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# SFU = 10^{-22} W m^{-2} Hz^{-1}


    is a numerical indicator of the amount of UV radiation coming from the Sun. It
    is, by tradition, (and nothing else!) measured at a wavelengths of 10.7 cm. The
    figure is a measurement of the solar radio noise detected at 2.8 GHz (originally
    2.695 GHz). The official measuring station for this figure is the Pentiction Radio
    Observatory in British Columbia, Canada, but if you like, can easily build your
    own 10.7 cm monitoring station. The solar flux is a good indication of the overall
    electromagnetic radiation hitting the Earth, and thus a good indicator of the
    overall ionization level of the ionosphere. There is a fairly direct relationship
    between sunspot numbers and solar flux, expressed in the simplified formula:


    SF = 73.4 + 0.62 R


    where SFU is solar flux and R is the daily sunspot count. A slightly more accurate
    formula is:


    SF = 63.7 + 0.73 R + 0.0009 R^2


    where again R is the daily sunspot count.

    Note these equations are for smoothed sunspot number and smoothed solar flux.
    The correlation between the daily sunspot number and daily solar flux is poor.


    If you are inclined, you can count sunspots yourself, (being sure to use proper
    safety procedures, of course!) and compare your calculations to the periodic broadcasts
    of solar flux by WWV.

    Now, since solar flux is an indicator of electromagnetic radiation, which travels
    at the speed of light, it is a fairly immediate indication of solar UV radiation.
    It takes eight minutes for electromagnetic radiation to get from the Sun to us.
    However, the ionization process is not instantaneous, so we generally need to
    look at a day or so of solar flux numbers to get meaningful propagation information.
    In addition, sunspots themselves form and disappear over the time frame of several
    hours at the fastest. The SFU, by the way, can reach as high as 300. In general,
    high SFU numbers are beneficial, but they aren''t the only story.


    Solar UV radiation isn''t the only factor that determines the state of the ionosphere
    at any given location. Geomagnetic field activity and events in'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'the lower atmosphere also contribute to the ultimate ionization — and this
    is why we have a monthly median ionosphere model.


    # Particular about Particles


    Although we like a strong bath of UV radiation, we don''t particularly want high
    energy particles. Whenever there is a lot of sunspot activity, there is the potential
    for fast moving electrons and protons to be ejected. These particles, since they
    are charge carriers, both create and disrupt magnetic fields when they come in
    close proximity to the Earth. In particular, when these particles cross magnetic
    field lines, they become part of an electrical generator.


    The aforementioned magnetometers can measure the contribution of charged particles
    to the Earth''s field. Two indices, the A index and the K index are measured by
    the horizontal magnetometers (the X and Y devices). The Z axis magnetometer is
    primarily unaffected by particles coming in perpendicular to the Earth''s surface
    (and thus parallel to the Z magnetometer''s magnetic field), and are therefore
    not part of the K and A index measurements.


    Charged particles are generally disruptive to propagation, they disturb the smooth
    layering of the ionosphere, among other things. The best conditions exist, therefore,
    when we have a high solar flux (again, resulting from strong electromagnetic radiation),
    along with low magnetic activity (a result of minimal charged particles arriving).


    Now, since charged particles have real mass, they take a lot longer to get to
    Earth than the UV radiation, on time scales ranging from hours or days to even
    weeks. Hold that thought.


    # What’s in a Number?


    While the SFU is an actual unit ( defined above), the magnetic indices are semi-arbitrary
    scales derived from magnetic information, and are referred to as indices...or
    indicators of some characteristic. Let''s look at the K index first.


    There is a network of magnetometers scattered around the Earth. They are all calibrated
    so that a given level of magnetic disturbance gives the same indication at each
    site. This is why we more specifically called the planetary'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'K index or Kp. The K index is registered on a scale of 0–9, with 0 being calm
    and 9 being highly disturbed. Now, it probably goes without saying that the disturbance
    of the magnetic field is highly dependent on location, which is why all the sites
    are calibrated to a known standard. The actual reading is also logarithmic, which
    means direct averaging of various sites is impractical. As useful as the K index
    is, it''s a bit unruly, for lack of a better term. So the A index was developed.
    The A index is measured with the same instruments, but averaged on a daily basis.
    It is also scaled differently. **Table 9.1 shows the relationship between the
    A and K scales.


    Geomagnetic storms are seldom beneficial for radio propagation. While there is
    a connection between geomagnetic storms and ionospheric storms, there can be a
    time lag between them as well. Again, ideal conditions would preclude any high
    geomagnetic numbers of either the A or K sort. Often, some unusual propagation
    can exist in the midst of a geomagnetic storm; a storm doesn''t necessarily mean
    a radio blackout.


    We should also mention that the A index varies from station to station; while
    it represents an average over time, it is not normalized with respect to location
    as is the K index. This means that both the A and K indices have their places,
    and it''s probably not best practice to look only at the K index, as is sometimes
    advised in recent years.


    # The Whole Elephant


    We''ve all heard the allegory of the three blind men attempting to describe an
    elephant. One blind man takes hold of a leg and declares, “The elephant is like
    a tree.” The second blind man grabs an ear and says, “The elephant is like a big
    leaf.” The third one finds its trunk and says, “The elephant is like a fire hose.”'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'Table 9.1

    Numerical Relationship between A and K Values

    | A | K | Condition |

    |---|---||

    | 0 | 0 | Quiet |

    | 2 | 1 | Quiet |

    | 3 | 1 | Quiet |

    | 4 | 1 | Quiet to unsettled |

    | 7 | 2 | Unsettled |

    | 15 | 3 | Active |

    | 27 | 4 | Active |

    | 48 | 5 | Minor storm |

    | 80 | 6 | Major storm |

    | 132 | 7 | Severe storm |

    | 208 | 8 | Very major storm |

    | 400 | 9 | Very major storm |


    All these are apt descriptions, but fail to describe an elephant to a fourth adequately.
    Attempting to predict future radio propagation by means of A and K indices, which
    are already rather indirect indications of solar activity, is unpredictable, at
    best. Since particle activity can lag electromagnetic activity by hours or days,
    even having three ingredients of the elephant — the solar flux, the A index, and
    the K index — may not be enough since they don''t occur at the same time!


    Propagation is an art form, and we have been getting something better over the
    past century, it is far from a hard science. We still can''t predict when...or
    how many...sunspots may pop up at any time. And we are still not sure where we
    are in the current sunspot cycle. Top experts still can''t agree on whether we''re
    having the best or the worst solar cycle in the history of radio...or the history
    of Man! It is very this unpredictability that helps make Amateur Radio so much
    fun!


    # Your Personal Scientific Toolbox


    While it is important to know how to collect and interpret data that others folks
    have generated, there are a lot of interesting measurements you can make yourself.
    In fact, you can make a lot of the instruments yourself. Here are just a few suggestions:


    +   1) A field strength meter. This doesn''t need to be precise, or calibrated
    to an absolute standard for a lot of radio work. On the other hand, an absolute
    field strength meter can be valuable for advanced propagation studies.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Field strength is measured in volts per meter (V/m). A 1 meter long piece of
    wire “dipped” in a field of 1 volt per meter will have a 1 V difference of potential
    between its ends. While extremely simple in concept, it''s a bit trickier to actually
    measure the voltage across the ends of such a wire. Most of us are used for measuring
    voltage at the middle of a wire! Once you break the wire to insert a voltmeter,
    you no longer have a 1 meter piece of wire. If you leave the wire intact, but
    try to measure the voltage at the ends, your voltage meter are well part of the
    antenna and mess things up too! So, an actual calibrated field strength meter
    is generally built around some form of loop antenna which is calibrated to be
    equivalent to a straight piece of wire. The math to do this is beyond the scope
    of this book, which is why such instruments are a bit pricey. However, if you
    have a known field strength, you can use that as a calibration standard for a
    much simpler meter. The ARRL Antenna Book has a field strength meter that can
    be calibrated to an absolute standard in this manner.


    +   2) A reference transmitter. This is a transmitter of known power, feeding
    an antenna of known gain. While a dipole is the easiest thing to calibrate in
    this regard, there''s nothing that says you can''t use an antenna with significant
    “negative gain.” This is useful for calibrating your field strength meter (described
    above), as well as providing a source for general antenna gain measurements.


    +   3) A good DF (direction finding) antenna (or antennas) for your frequency
    of interest. At lower frequencies, a multitun tuned loop, preferably shielded,
    is pretty much standard. Such a loop provides a sharp null in the direction of
    the radio source. At VHF and UHF, standard practice is to use a high gain Yagi
    and look for the maximum signal strength. This method is seldom as accurate as
    a nulling method, however. Various forms of interferometers are well suited to
    VHF direction finding. Being able to direction find, both in the azimuth and in
    the vertical plane, is a crucial part of a lot of ionospheric study.


    +   4) A good general coverage receiver. This is probably the best test tool for
    any ham radio shack, for propagation studies it is crucial. You want the receiver
    to be as stable as humanly possible (or affordable). You don''t need a lot of
    bells and whistles, but you want a clean receiver, with a minimum of “birdies”
    and other weird artifacts. One of the best “science'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'radios” is the direct conversion receiver, an item that''s easy to build for
    the average ham.

    5) A computer with a sound card and “waterfall” software. Any of the HF digital
    software packages work fine. It doesn’t need to be a screaming fast machine, though
    it helps to have some horsepower if you’re doing propagation modeling with a program
    such as Prolab Pro.


    6) An oscilloscope. This doesn’t have to be fancier. Some of the best propagation
    experiments are “self-correcting,” meaning you can use some pretty primitive equipment
    to get wonderful results.


    7) Another ham across the country. This may be your most important tool. If you
    can collaborate and coordinate experiments with a like-minded ham at a distant
    location, you can make some real contributions to the radio art.


    8) A compass and a sextant or a transit. No


    # And a Sidebar


    The sidebar on Active Antennas will provide you with some food for thought as
    well as a great idea for a homebrew project. The active antenna has been greatly
    undervalued in the ham shack.


    # The Active Antenna: Real Science in a Small Package


    Most amateurs and a good number of SWLs are familiar with the so-called active
    antenna. While generally considered a second rate workaround for a full sized
    antenna, there are aspects of the active antenna that make it a very useful and
    potentially very precise instrument.


    An active antenna is a very short antenna (in terms of wavelength), usually but
    not always, in the form of a single-ended whip. (A circularly polarized antenna
    is shown in Figure 9.4.) Generally less than a few percent of a wavelength at
    the highest frequency of operation, the active antenna has a radiation pattern
    approaching that of an isotropic radiator. Directivity is essentially impossible
    with a single active antenna, but may'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'be achieved with an array of active antennas. And, it should go without saying
    that the active antenna is a receiving antenna only. In the following paragraphs
    we will compare the active antenna with “normal” receiving antennas.


    ![](img/59293a6d87bff070066bbaf783df6263_131_0.png)


    A conventional full-sized resonant receiving antenna, the goal is to transfer
    as much power to the receiver as possible. An approximate, if not precise, impedance
    match is usually desirable, as it is the intent to extract much power from the
    ether as possible, and direct it into the front end of the receiver. A perfectly
    matched receiving antenna will transfer half the intercepted power to the load
    (the receiver) and reradiate the other half. This is the absolute best you can
    do with a receiving antenna of any kind.


    An active antenna works in a very different manner. First of all, consider a “whip”
    on the order of 1/100 of a wavelength. The radiation resistance will be essentially
    nothing, while the capacitive reactance will be huge. We


    Figure 9.4 — Roger Weggel, WL7LU, and Clayton Cranor, KL3AB, Inspect a prototype
    “eXOogon” HF CPOL active antenna, designed by the author.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'could use a large loading coil to bring the whip to resonance, but in this
    case it would be extremely narrow-banded. This is essentially the situation with
    an AM radio with a normal vehicle antenna. But we generally use active antennas
    because they''re extremely broadbanded. We make no effort to resonate the antenna
    or match its impedance to the receiver. This would be counterproductive in addition
    to being an exercise in futility. The active antenna should be thought of as a
    pure voltage probe, the impedance being so high as have essentially no current
    flowing. The power transfer from the antenna is all basically zero.


    Now, this brings up a reasonable question, how does it work at all?

    The trick is the amplifier. If we look at any amplifier that has an infinite input
    impedance, and an output impedance of anything less than finite, the power gain
    is *infinite*! If this seems to defy logic, just answer the question, "How much
    power can you put into a circuit with infinite input impedance?" The answer is
    zero. How much power do we get out of such an amplifier? Well, if we have any
    voltage and current, we have some power. Well, power gain is defined as output
    power divided by input power, so if we have any output power with no input power,
    we have infinite power gain! This is kind of what we want, to compensate for an
    antenna with no power to offer, isn''t it?


    Now, the amplifier associated with an active antenna does not have truly infinite
    input impedance, but it''s very, very high — on the order of several gigahoms.
    A MOSFET or a MOSFET op-amp will have this kind of input impedance. Typically
    the first stage of an active amplifier is a source follower FET which has extremely
    high impedance and a fairly low output impedance. The output voltage will generally
    be slightly lower than the input voltage. We have gobs of current gain, and basically
    no, or slightly less than unity voltage gain. This still results in tons of power
    gain...this sensitivity.


    In addition, a source follower has very wide bandwidth, which is something we''re
    ever after.


    Now, there are a few caveats when assembling an active amplifier. Since the antenna
    reactance, and thus its total impedance is so huge, any parallel capacitance will
    essentially short out the antenna. You cannot use normal coax cable between the
    whip and the electronics. In fact, you shouldn''t use any. The whip should be
    connected directly to the gate of the device, or'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'through an appropriate series coupling capacitor. Any unnecessary stray capacitance
    to the chassis must be avoided. This includes even the feedthrough insulator from
    the antenna to the amplifier.


    Once you have an active antenna constructed and tested, it will be a very valuable
    measurement tool, in conjunction with your receiver. You can measure electric
    field voltage directly, with essentially no disturbance of the same. Being very
    close to an isotropic radiator, you don''t have to worry about aiming it, either.'
