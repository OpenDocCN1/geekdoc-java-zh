  md: 'radio, and we call it absorption. At the upper microwave frequencies, optical
    opacity can indeed manifest itself as radio absorption — some microwave links
    in Los Angeles have serious problems on particularly smog days. The lower you
    go in frequency, however, the less connection there is optical "smog” and radio
    absorption.


    As it turns out, most “normal” radio frequencies, the Earth’s atmosphere is almost
    totally transparent to radio waves. As we move even lower in frequency, however,
    we find that a stranger phenomenon happens. An optically transparent atmosphere
    can become highly absorptive at radio frequencies! This is particularly true at
    medium wave frequencies, where the so-called D-layer absorption can be very high,
    yet exhibits absolutely no optical effects whatsoever. Much more on this later!


    Note the term “D-layer” in the previous paragraph. The word “layer” implies something
    akin to thin layers on an onion, but you should be aware that the ionospheric
    “layers” are many miles thick. That’s why ARRL publications tend to refer to the
    D region, E region and so on, rather than the D layer or E layer.


    # Some Polarizing Words


    In most Amateur Radio literature, the matter of wave polarization is thrown in
    as somewhat of a footnote. However, this matter is of such importance, especially
    in light of some more recent discoveries of radio propagation, that it merits
    an entire chapter of its own. In the next chapter, we’ll again introduce the familiar
    optical properties of polarization first, and then translate them to practical
    radio frequency applications. We will even further explore this whole matter of
    polarization when we finally move into ionospheric propagation, where it becomes
    nearly all-important.'
