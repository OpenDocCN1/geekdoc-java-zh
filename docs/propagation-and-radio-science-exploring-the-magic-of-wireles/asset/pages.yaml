  md: '# Chapter 7


    # # The Anomalous Ionosphere


    In Chapter 6 we gave a rather broad overview of known ionospheric principles,
    employing some of the straightforward geometric optics discussed early in the
    book. Familiar tools such as Great Circle charts, solar indices, and countless
    thousands of person-years of experience have made it fairly simple to work most
    of the world at one time or another, with a reasonable level of reliability.


    - indices, and countless thousands of person-years of experience have made it
    fairly simple to work most of the world at one time or another, with a reasonable
    level of reliability.


    There are at least two reasons to explore the more bizarre aspects of radio propagation:
    to perform effective radio communications when conditions aren’t “right,” and
    for sheer scientific intrigue. Radio amateurs are a curious lot (or there is still
    a great deal we don’t know about the ionosphere (and other spheres as well), and
    we are in a unique position to explore these realms. New modes of propagation
    have been discovered more or less regularly throughout the history of Amateur
    Radio, which in due time we have learned to exploit in practical fashion. For
    example, amateurs discovered transequatorial propagation (TE) and documented it
    in December 1959 QST. However, there is a lot of “stuff” up there which may be
    unlikely to serve any purpose for the foreseeable future, and yet should be of
    interest to any radio amateur with a modicum of curiosity. Anomalous propagation
    can range anywhere from the readily explicableal hop propagation discussed later
    in this chapter to the totally mysterious.


    # ## Low in the Tropo


    There is probably no propagation phenomenon observed by more radio amateurs than
    tropospheric ducting, where VHF signals are propagated far greater distances than
    they are “supposed to go.” This is most likely due to the fact that in relatively
    recent history more hams start out using 2 meters than any other band. Nearly
    every active radio amateur has'
