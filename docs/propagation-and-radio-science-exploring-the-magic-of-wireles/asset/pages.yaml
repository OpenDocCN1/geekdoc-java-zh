    radio terminology, field strength) and aim. Knowledge of the environment into
    which the golfer is going to launch his ball is of course important. The actual
    time the ball spends in contact with the club (the antenna) is minuscule relative
    to the remainder of the flight.


    # The Isotropic Bean Bag Chair


    One of the concepts that seem to confuse a lot of new hams is the idea of antenna
    gain. Antenna gain is one of many areas where NFL reigns supreme. No, we don''t
    mean National Football League, but rather No Free Lunch. An antenna, no matter
    how elaborate or large, can never radiate more power into space than we put into
    it. While many radio amateurs pay lip service to this concept, by listening to
    a lot of on-the-air discussion of the matter, it seems that many don''t quite
    believe it.


    An antenna can achieve gain only by taking whatever is fed into and redistributing
    it. Hopefully that distribution results in a large percentage of the applied power
    going in some useful direction.


    Let’s imagine a beanbag chair. The skin (outer covering) of the chair is made
    of something like leather that is infinitely flexible, totally non-stretchable.
    In other words, we can punch the bean bag chair into any shape we like, but the
    total surface area remains absolutely constant.


