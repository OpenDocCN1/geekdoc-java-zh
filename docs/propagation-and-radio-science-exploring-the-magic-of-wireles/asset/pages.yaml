  md: 'Now, it should be apparent that the Titanic with a 1 square foot sail isn’t
    going to move anywhere near as fast as the lifeboat for a given wind speed, because
    of the difference in masses. (It will also move in the opposite direction). This
    is the reason why the *electron* is the more important *charge* carrier for radio
    generation.


    As lame as this allegory, it is really pretty good at showing electron behavior
    when we start moving them around with our “electrical wind,” or electromotive
    force.


    # # Forces and Fields


    We can all well to know about without knowing what it’s made of. We know it has
    a force and it has a direction. Although we also know (if we’ve been born in the
    last centuries) that air is made of molecules of nitrogen, oxygen, and a few other
    ingredients, that tell us very little about how it behaves. It’s more important
    to know what it does than what it is.


    This is precisely the case when at this mysterious electrical wind as electromotive
    force or EMF. We don’t really know what it is, but we know precisely how charges
    respond to it. A charge responds precisely and predictably to an applied EMF.
    To make things a little more interesting, the charge itself produces a *field*.


    # # Chickens and Eggs


    One of the more disturbing aspects of this whole force/charge business is that
    charges create EMF, while EMF can move charges around. So, who’s the mover and
    who the “movee”? It doesn’t need to be too brain-tangling however, if we take
    a very mechanical approach to this. In fact, mechanical analogies work surprisingly
    well for a number of invisible electrical phenomena.


    If you will, an old Colonial mill stream. People in American Colonial days did
    a lot of things with water power. Factories of all kinds, from grain mills to
    sawmills, used the power of moving water to do what needed to be done, and were
    built near natural streams. Now imagine a paddle wheel constructed over the stream
    so that its blades dipped into the flowing water. The most primitive arrangement
    used an an “undershot” wheel,'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'which didn’t involve much modification of the stream itself. More advanced
    “overshot” wheels were used in conjunction with man-made channels which directed
    the **entire** stream onto a paddle wheel). For reasons we’ll see, the **undershot**
    wheel is a better analogy for us. As interesting as it is to see a wheel spin
    around because of the water pressing against its blades; it’s generally more useful
    to have something actually attached to the shaft...like a blade saw or a grinding
    wheel...so let’s just do it.


    Now, imagine you’re a new apprentice mill operator, and you know nothing about
    how the mill works, other than the fact that if you show up in the barn you might
    get some dollars at the end of the day. So you walk into the little barn and see
    a grinding wheel spinning around. You might think to yourself that the shaft is
    the source of power that turns the grinding wheel. But then your new boss comes
    and asks you what is making the shaft turn. Pleading ignorance, the boss patiently
    takes you outside the barn and shows you how the shaft is connected to the paddle
    wheel sitting out there in the middle of the stream. “Aha!” you say. “The paddle
    wheel is actually the source of power!” So, with limited knowledge of machinery,
    you conclude that the paddle wheel is generating power and the spinning wheel
    is using up the power. In modern, high-tech language, the paddle wheel is the
    **source** and the grinding wheel is the sink.


    But this is really an incomplete picture. In fact, the wheel is a **sink** for
    another **source**, which is the flowing water. The prime mover is really moving
    water. But even that’s not totally correct. It is **gravity**, which is the original
    moving force for the water. So you see, depending on your point of view, various
    items in the **entire system** can be either a source or a sink of power.


    Now, let’s translate this entire business back to electrical work. If we imagine
    the flowing mill stream as being an electric *field*, we can see that it can produce
    movement of an item of some sort. The paddle wheel can be considered a charged
    particle in this regard. What makes this analogy work so nicely is that, at least
    in the case of the undershot wheel, the wheel uses only a small percentage of
    the total “*field*” of water. In electrical terms, *most* of an electrical field
    is wasted in that only a small percentage of its entire volume is moving actual
    charges around.'
