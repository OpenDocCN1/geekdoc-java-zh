  md: '# Magnetic Personality


    It is more than a little mystery as to why the role of the Earth’s magnetic field
    on radio propagation has been all ignored in Amateur Radio literature. The characteristic
    X and O mode waves have been thoroughly understood in the scientific community
    since at least 1940. In fact, in that year, QST did publish an article on the
    matter. The late Bob Brown, NM7M, began writing about X and O waves in January
    1992 WorldRadio column, and in subsequent issues of WorldRadio and Communications
    Quarterly magazine. Carl Leutelschwb, K9LA, began writing about this in his September
    1998 Worldradio column, and in subsequent publications and articles on his website
    (http://k9la.us). The topic of X and O waves didn’t return to QST until December
    2010, “Gimme an X, Gimme an O....What’s that Spell?” It has been gratifying to
    see a number of authors pick up the baton in the past couple of years and give
    the topic attention it should richly deserves.


    We should mention that the existence of X and O mode propagation does not in any
    way negate what knowledge we have about ionospheric radio propagation; rather,
    it completes the story. See the sidebar “Taking Advantage of X and O Modes.”


    # The Earth’s Magnetic Field


    The permanent magnet embedded in the Earth is much like any permanent magnet,
    only a lot bigger (Figure 8.1). Relative to obvious geographic poles, the magnetic
    poles are a bit out of. The North and South magnetic poles are considerable distances
    from the “true” poles, and in addition, they are not antipodal (geographically
    opposed) to one another. There is a somewhat stronger overall magnetic field over
    the Pacific region, as both poles are located in that “quadrant.”'
  merge: -1
