  md: '# Instrumentation and Interpretation


    Whether you plan on just using the ionosphere, or wish to make a meaningful contribution
    to understanding the ionosphere, there are a number of instruments and practices
    at your disposal. Every radio amateur should know how to read an ionogram. Although
    sophisticated instruments such as the Lowell Digisone present a lot more information
    than you really need, the general principles should be well understood. The ionosphere
    is probably the most useful instrument for predicting radio propagation and for
    understanding the conditions that currently exist.


    For a great overview of ionospheric sounding, here is the place to start: www.digisonde.com/instrument-description.html


    As we mentioned in the previous chapter, hams don''t have direct access to radar
    methods, but Digisone data is widely available, as data are from countless instruments
    around the world.


    Keep in mind that the world is big, very big. Someone else''s ionosphere is not
    your ionosphere. You want to get good data not only for your location but for
    the location of the DX station you want to work, and as many points as you can
    in. Most hams agree this is preferable to using random luck...though not always
    romantic. It should be noted that, as complex and vast as the ionosphere, it''s
    unlikely that we will know so much about that mystery, romance, and intrigue will
    be lost. It is safe to say that it will never happen. Chances are, the more you
    know about the ionosphere (or any other topic of scientific interest) the more
    awestruck you will be at the wonder of our natural universe.


    # Being Scientific About It


    Amateur Radio is the scientific hobby, and it''s always a good idea to review
    the principles of good scientific method; even we old timers need reminders from
    time to time. Maybe especially we old timers! Here are just a few of'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'those principles which will make your Amateur Radio technological progress
    more fruitful.


    +   - The physical universe is governed by laws, not suggestions. We don''t know
    everything, this does not mean things are knowable. Scientific laws exist with
    or without our help. Our job is to discover these laws, and make use of them where
    appropriate.


    +   - Technology is not science. Although we hams make use of both science and
    technology, there are important differences. Technology is how we apply scientific
    principles to practical matters. This is an art, and art, like every other human
    endeavor, is subject to change. Science is based on unchanging laws.


    +   - Scientific law is universal...and technology nearly so. A Russian schematic
    diagram looks pretty like an American schematic diagram. Mathematics supersedes
    politics. There''s a reason we amateurs are in a unique position to “promote international
    good will” as spelled out in our raison d''etre in FCC Part 97.1e.


    +   - Good science is subject to peer review. If something sounds fishy, it probably
    is. There are snake oil salesmen in Amateur Radio, in every endeavor, but collectively
    we should be able to sniff them out.


    +   - The best thing that could happen to a ham is to have a scientific law named
    after him or her. While this is not absolute scientific truth, it probably passes
    the peer test.


    With these principles in mind, let us look at how we can take a more scientific
    approach to Amateur Radio operation and activities. For the relative newcomer,
    we trust that you recognize your ham ticket as merely the entry point, not the
    destination, of Amateur Radio knowledge.


    There is no better tool for learning radio propagation than a good old fashioned
    shortwave receiver, now more commonly known as a general coverage receiver. Some
    truly excellent receivers are available for a song, but it''s a good idea to get
    the best you can afford. A “dc to daylight” communications receiver, which includes
    VLF, LF, MF, HF, VHF, UHF, and perhaps a microwave band or two, is certainly going
    to be more of an investment than a classic boat anchor, but will be a lot more
    useful instrument in the long run.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Beacons Beckoning


    You should be aware of WWV, WWVH, and other time and frequency stations. There
    is a complete description of these valuable stations in the ARRL Handbook. WWV,
    because broadcasts on numerous HF bands throughout the shortwave spectrum, serves
    as a reliable general propagation beacon. While it won''t tell you much about
    conditions in Asia or Africa, for the most part it will tell you the general state
    of the ionosphere. Beyond WWV, we have countless worldwide shortwave broadcast
    stations. Despite the predictions that shortwave broadcasting was going to go
    away (and for a short while, it almost seemed this was the case), there has been
    a resurgence of activity throughout the shortwave bands — both friendly and nefarious
    — that gives us assurance that, while the players may change, there will always
    be players. Shortwave bands are alive and kicking! Give us a list!


    By the way, since WWV sends “ticks” along with all the other information, you
    can actually get time-of-flight information. You can sometimes hear the time lag
    between the X and O signals of WWV as a subtle double click where there should
    be none. (WWV does periodic double clicks. Again, refer to the WWV schedule.)


    # The S Meter is Your Friend


    One of the most annoying habits of “hamdom” is the general disregard for honest
    signal reporting. Traditionally, signal reporting was one of the most important
    activities in Amateur Radio. The development of an actual functional S meter (Figure
    9.1) was a major innovation at the time, and its advent should not be taken lightly!
    Many h dims S meter readings as “meaningless,” since you''re really looking for
    is signal-to-noise ratio (S/N), anyway. Like so many aspects of our hobby, a little
    knowledge is a dangerous thing. Certainly signal-to-noise is important for communications
    intelligibility, but it''s not the only factor…especially when it comes to actually
    making advances in the radio art.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Figure 8.1 — In modern transceivers, the S meter is often "virtual"; an on-screen
    representation rather than an actual meter.


    ![](img/59293a6d87bff070066bbaf783df6263_119_0.png)


    A communications receiver with a well-calibrated S meter is an extremely valuable
    instrument. A lot of smart folks collaborated in the design of the standardized
    S meter format, and it hasn''n''t been significantly improved upon in many decades.
    In addition, we now have at our disposal extremely inexpensive and accurate data
    acquisition equipment, which can make recording signal strengths very simple (and
    a lot of fun).


    We''ll discuss S meters thoroughly in Chapter 17, Your Friend the S Meter.


    # Channel Probes


    Most radio amateurs are familiar with their many Amateur Radio beacons, especially
    on 10 and 6 meters. These are great for learning when there''s a band opening,
    and from where. But we can greatly expand the usefulness of beacon stations by
    means of the channel probe. The channel probe is simply a beacon station with
    a dedicated monitor station at some distant location. Channel probes can be quite
    elaborate, able to resolve polarization angles, angle of arrival (often in two
    axes), and sometimes even total time of flight.


    Channel probes have around a long time in the professional ionospheric circles,
    but are just coming into their own in Amateur Radio, most frequently in the form
    of "grabber stations." Grabber stations are remote-controlled receivers accessible
    via the Internet. A grabber station, among other things, allows you to make real
    time corrections to your transmitting setup to achieve the best signal at the
    target location.'
  merge: -1
  pgno: 119
- img_proc: true
