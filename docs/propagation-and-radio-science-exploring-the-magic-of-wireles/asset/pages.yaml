    more so. Unfortunately, free electrons are an unruly lot; they repel each other
    with vigor, and without some form of pipe to contain their enthusiasm, they aren’t
    going to be of much use to us. So, despite the fact that this technology is called
    *wireless*, we rely heavily on wires to keep things moving along as they should.


    Nevertheless, it is the acceleration of electrons that is our true bottom line.
