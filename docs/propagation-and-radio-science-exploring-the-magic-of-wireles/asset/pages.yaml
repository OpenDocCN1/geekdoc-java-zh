    meters is not only subject to phenomenal ionospheric propagation at times, but
    also troposospheric propagation... simultaneously! This is not the case with 2
    meters, which is well above any ionospheric propagation, frequency wise.


    Part of the 6 meters is known as the “magic band” is because of its response to
    both ionospheric and troposospheric propagation, the only band that has this property
