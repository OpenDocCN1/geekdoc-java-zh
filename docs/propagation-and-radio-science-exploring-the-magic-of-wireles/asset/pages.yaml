    # # A Word of Note


    In a lot of satellite literature, you’ll hear it say that as an orbit “decays”
    the satellite will “speed up.” By “speeding up” it means that the *period* will
    shorten, that is its Mean Motion increases. This *does not* mean that the velocity
    of the satellite is increasing in its direction of travel! Friction (due to the
    atmosphere, as thin as it is) burns up kinetic energy, causing the velocity of
    the satellite to decrease. This concept suffers from nearly universally lame usage
    of terminology. You cannot violate conservation of energy or Kepler’s Laws!


    # # Some More Polarizing Words


    Every satellite user will eventually encounter the ambiguity of polarization terminology.
    Polarization is typically defined as *vertical* or *horizontal*. “Vertical or
    horizontal compared to what?” you rightly ask. It’s easy to define the polarization
    of a radio signal traveling parallel to the surface of the Earth. If the electric
    field is perpendicular to the ground, it is vertically polarized; if it’s parallel
    to the ground, it is horizontally polarized. No problem.


    But what if the signal is traveling *perpendicular* to the Earth’s surface, which
    describes most satellite signals? In this case, you can only define'
  merge: -1
