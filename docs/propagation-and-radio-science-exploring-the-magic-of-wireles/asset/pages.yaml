    Returning to the left column, we can drop down to Fx, which is the Ocritical frequency.
    It’s a little more than 500 kHz above that of the Omode ray, 7.95 MHz, seen clearly
    on the O-mode trace well. A few lines down, we have MUF of 23.34, again, is the
    case for a horizontal launch. A few more lines down, we have hmF2, which is the
    height of the reflection at the “normal” region of the O-mode. The flatness of
    this region can vary considerably, but it’s a good first approximation of the
