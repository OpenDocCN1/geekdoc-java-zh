    # Parametric Paradoxes


    Anyone who''s been on 80 meters for very long, from time to time, experienced
    so-called "chordal hop" propagation (Figure 7.1). This is rather easy to explain.
    The ionosphere is somewhat elliptical, with the greater height being on the dark
    side of the Earth away from the Sun. There are two reasons for this. As described
    in the previous chapter, the dark side ionosphere retreats "from the bottom up"
    creating a higher ionosphere at midnight. In addition, the solar wind passing
    around the Earth from the daylight side drags some of the ionosphere along with
    it, tending to "pull" the ionosphere toward outer space. Both of these serve to
    form a rather lopsided ionosphere, where the path on the dark side is very high.
    With'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'such an arrangement, a low-band radio wave can bounce off the ionosphere several
    times with no intervening bounces from the Earth’s surface. It travels in chords
    around the ellipse.


    Such signals tend to be unusually strong, following the path around the dark side
    much like troposeric ducting. However, there are many reports of such signals
    far stronger than can be accounted for by free space conditions; in other words,
    it seems like they are actually being amplified along the way. Is this possible?


    Answer: Possible? Yes. Likely? No.


    This phenomenon, known as parametric amplification can be created consistently
    in plasma chambers, under tightly controlled conditions of magnetic field, pressure,
    gas species, frequency, polarization, and a few other minor details. Physicists
    can create parametric amplification on demand.


    In the ionosphere, all ingredients necessary for parametric amplification are...sometimes.
    The real question is whether all the ingredients are there at the same time in
    the right proportion for “in the wild” parametric amplification to occur. This
    is extremely unlikely. However, with countless Amateur Radio discoveries, there’s
    a difference between extremely unlikely and impossible.


    Of course, it should be obvious before one attempts to find the reason for a phenomenon,
    one needs to show convincingly that the phenomenon actually exists. Does it only
    seem like these signals are amplified, or have any actual measurements performed
    to confirm that the signals are stronger than equivalent signals in free space?
    If we can prove that the latter is the case, then we can collectively proceed
    to some really interesting experiments!


    # LDEs or Little Green Men?


    Another equally puzzling phenomenon is that of long delayed echoes (LDEs). Far
    too many reliable observations of LDEs have been made for many decades that it
    is impossible to write these off. Something real is happening here. There are
    a few plausible explanations that don’t require any extraterrestrial intelligence.
    Like parametric amplification, long delayed echoes can be created in plasma chambers
    using the known behaviors of ion'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'acoustic waves. Again, the question is, are all the ingredients in place at
    the right time to create long delayed echoes “in the wild”? Again, another long
    shot, but not entirely impossible.

    The answers will come when we set out to deliberately explore these events, not
    merely speculate on their sources when or if we happen to encounter them. Of course,
    this is easier said than done, but we have a lot of hams spread out over a very
    big Earth. Our odds may be better than we think!'
