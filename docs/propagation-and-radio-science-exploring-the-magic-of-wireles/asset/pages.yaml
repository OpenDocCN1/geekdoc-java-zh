- img_proc: true
  md: '# Free Electron Propagation


    For the VHF UHF enthusiast, some of the most interesting propagation is the result
    of high concentrations of almost nothing but free electrons, or “electron cloud”
    propagation (Figure 10.1). As we''ve touched on earlier, the “normal” ionosphere
    is a soup of different species of particles, and even though electrons are the
    primary ingredient of propagation, we seldom have regions of nothing but electrons.
    Phenomena such as refraction and dispersion are the result of the mixture of ions
    and free electrons. Things can behave quite when we have large electron clouds,
    and some of the most intriguing...and baffling...beyond-the-horizon communications
    on the shorter wavelengths are the results of these electron clouds.


    ![](img/59293a6d87bff070066bbaf783df6263_134_0.png)


    Figure 10.1 — Random scattering off of electrons is an extremely inefficient mode
    of radio propagation, nearly always present to some degree. Scattering can be
    observed everywhere from the HF frequencies up to the highest microwave bands.
    Electron clouds can result from a multitude of sources: micrometeor ablation,
    local lighting storms, wind shear, and simple random “clumping” of electrons from
    other processes. Clouds of nothing but electrons, regardless of their sources,
    are short-lived, because the electrons will repel each other, causing them to
    dissipate into the neutral atmosphere.


    # How Free is Free?'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'We described in our discussion of ionospheric propagation how the electron
    density profile is related to most factors of HF propagation. In the F region,
    the electron density profile closely tracks the ion density profile, suggesting
    that the electrons never stray too far from the atoms from which they were originally
    torn. There is the presence of the nearby ions that keeps the electrons in something
    resembling layers, while still allowing them the degree of freedom they need to
    respond to radio waves.


    How can an electron, or a whole mob, be removed from their associated ions and
    still maintain collective integrity to work for radio propagation? This is an
    important question, and one that''s coming under a lot of scrutiny by, in particular,
    meteor burst aficionados.


    All electrons come from somewhere. To the best of our knowledge, on the grand
    scale of things, the universe seems to have the same number of electrons as protons.
    Or, put another way, the overall electric charge of the universe is neutral. While
    most of the universe seems to be in a plasma state, it seems to be a relatively
    balanced plasma, which is probably a good thing. Large electrical charges seem
    to be fairly localized.


    When the Earth gets a blast of solar wind, likewise, we don''t seem to build up
    net electrical charges overall. Otherwise we''d have a really bad static problem
    on the surface of the Earth — probably sufficient to preclude any life!


    The Earth is bombarded by untold trillions of micrometers every day. Some of these
    micrometers are no bigger than talcum powder. To have a visible meter on a cloudless
    night requires nothing bigger than a grain of sand to enter the atmosphere. When
    these micrometers “burn up” or ablate, a couple of things happen. They can form
    compounds with the air, and they “rub off” free electrons. As it turns out, the
    chemistry can be fairly complex, but one of the possible outcomes is that the
    chemical reaction creates a new neutral compound, leaving free electrons with
    no affinity to anything. In other words, unlike in the F region, there are no
    ions left to “reclaim” these electrons. So, for all practical purposes, we have
    clouds of free electrons... interspersed with neutral atoms or compounds.


    Now, we know that a cloud of electrons will rapidly disperse, because electrons
    “want” to repel one another. We also know that in a plasma, the electrons will
    only drift so far until they are pulled back home by their'
  merge: -1
  pgno: 135
- img_proc: true
  md: '“mother ions. But what about neutrals? Well, as it turns out, a neutral interposed
    between two electrons has a partial shielding effect. While neither attracting
    nor repelling the electron, it can also prevent the electrons from repelling each
    other.


    What this means is that you can have a relatively stable, long lasting cloud of
    electrons that, as a passing radio wave is like a clump of truly free electrons.
    There seems to be some pretty hairy statistical math to describe how this shielding
    works…doesn''t. On the whole — again, statistically — it does look like a stable
    free cloud. This is just what we need for a fairly low-loss radio reflection,
    or rather, absorption and re-radiation.


    Another source of free electrons is lightning. We also have some chemistry happening
    during a lightning storm, but somewhat different from micrometeor ablation. One
    of the more common reactions of a lightning bolt “burning” air is the generation
    of ozone, among other molecules, which leaves some free electrons. However, lightning
    is an interesting situation, because in order to have enough charge to create
    a strike in the first place, there has to be some aggregation (pre-ionization)
    of the molecules (most frequently water) to start. So, it looks like lightning
    itself is merely a second source of ionization; most likely is *wind shear* and
    similar atmospheric effects that create the energy necessary for ionization in
    the first place. The jury is still out on this.


    # What We Know


    One of the certainties of “free electron” propagation is that is always occurs
    at relatively low altitudes, such as the D and lower E region. It is only at these
    altitudes that we have enough neutrals to perform the “shielding” function, as
    well as to supply electrons in the first place, without radiative input.


    Because E layer propagation is frequency insensitive, it is most amenable to VHF
    propagation where high gain, narrow beam antennas are practical. By using careful
    triangulation methods (in three dimensions), we should be able to determine fairly
    accurately the locations of electron clouds. This is an area few hams are exploring.
    One of the big mysteries of sporadic E is'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'just how big (or small) the clouds are that allow such effective communications.


    This is also an area where we could be using a lot more of our microwave bands.
    The upper troposphere and lower ionosphere are regions that have strong effects
    on microwave frequencies. And it is quite likely we could see some frequency dependent
    effects in the upper microwave region, again, this is pretty sparsely populated,
    as far as harms are concerned.


    # Auroral Matters


    Auroral phenomena may also be partially the result of free electron masses. Auroral
    propagation can be in effect throughout the upper HF, VHF, and UHF frequency ranges.
    The visible aurora actually begins at E level altitudes and extends into the F2
    region. People are quite surprised when they learn that a “full curtain” aurora
    can be hundreds of miles tall! Because the auroral region covers a vast region
    of sky, it is difficult to categorize auroral propagation into just one mode.
    However, we can make a few generalizations. Visible auroras are the result of
    charged particles, and since these particles can be infused with great intensity
    and suddenness, we can expect largeations of free electrons to be present, if
    short-lived.


    These electrons, if there is a strong magnetic field nearby, will become part
    of plasma tube structures which have extremely well-defined borders. Imagine a
    shear of free electrons enclosing a thin core, somewhat like a coaxial cable.
    So we sweep a VHF or UHF signal across the region. UHF radar methods show these
    FAIs even more clearly. So what we have in this case is actually a free electron
    structure embedded within a normal F-region plasma soup.


    It should be noted here that auroras can occur any time day or night, at any time
    of the year. They are clearly visible on HF radar in interior Alaska, even during
    the long summer of the midnight Sun. Figure 10.2 shows some vintage returns from
    a 28 MHz radar. And, as mentioned above, the auroral region, being as tall as
    it is, forms a fairly good sized billboard reflector even for upper HF frequencies.
    Auroral propagation may account for a lot more HF than we commonly give credit
    for.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# More Oddities


    As we’ve suggested, fast-moving charged particles are in general, counterproductive
    to good radio. With any great general principle, it’s the exceptions that make
    it interesting!


    To reiterate, fast-moving charged particles disturb the geomagnetic field, which
    “wrinkles” the ionosphere, thus spoiling its smooth reflective and refractive
    properties, among other things.


    ![](img/59293a6d87bff070066bbaf783df6263_138_0.png)


    Figure 10.2 — Back in the 1950s, 10 meters was commonly used for auroral radar.
    The image on the left shows radar returns from an auroral current and the image
    on the right shows radar returns from an auroral streamer. [courtesy Richard Dickman,
    former site manager of Hipas Observatory]


    On the other hand, clumps of slow moving, or even stationary electrons give us
    all kinds of interesting surfaces off which to bounce radio waves.


    The good news in all of this is that fast-moving charged particles eventually
    become slow-moving charged particles. This is why we sometimes have so wonderful
    — and peculiar — propagation events immediately following a near complete radio
    blackout after a coronal mass ejection (CME), where the Sun “blows chunks.


    Remember how we described just sparse and tenuous the ionosphere really is? The
    fact that we have layers at all is actually a pretty delicate process, and it
    takes time for things to settle out after a disruption to the point where we have
    any recognizable structure. A major solar disruption can totally stir up the ionosphere,
    blending all the layers into an amorphous'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'colloidal suspension-like blob. Fortunately (not just for radio, but probably
    for life itself, the ionosphere (and all our other spheres) are fairly self-correcting.
    You can take water, salad oil, honey, and gasoline and put them all in a blender,
    and come out with a grayish-yellow milkshake or something. (We don''t recommend
    drinking this.) But after a while, you will have layers forming, because of the
    different densities of the liquids. With a little stretching of the imagination,
    the ionosphere is a bit like this.


    Now, in the intermediate stages between chaos and normal layering, we can have
    some interesting effects. One phenomenon is known as electron precipitation, which
    is exactly what it sounds like http://blogs.agu.org/geospace/2010/12/14/its-raining-electrons/).


    After a major auroral event, a lot of free electrons fall out of the “milkshake”
    and follow the magnetic field lines to the surface of the Earth. (In places like
    Fairbanks, Alaska, you can actually measure this electron precipitation with a
    simple old-school electroscope, after a strong visible aurora.) Since these precipitating
    electrons are fairly slow (they can, at least, although there are energetic precipitating
    electrons), they can be useful for bouncing radio signals.


    # Rain Man


    Water is capable of taking on a tremendous electrostatic charge. Water droplets
    accumulate on their surfaces, primarily because water is a pretty bad conductor.
    If you have a lot of finely atom water, you have a lot of surface area upon which
    to accumulate a static charge, i.e., electrons. A charged water droplet is basically
    a bag of free electrons for the taking, except that the bag is on the inside.
    This suggests that we should be able to use clouds as highly reflective radio
    surfaces...if we choose the right frequencies. You don''t want to pick a frequency
    near to avoid the “microwave oven band” near 2.45 GHz. Fortunately, the closest
    bands we have to that are 2.300–2.310 GHz and 2.390–2.450 GHz. All our other microwave
    bands are far enough away to not be absorbed by resonance effects. This leaves
    at least 10 other bands with good potential for rain cloud bounce. Again, we really
    need to activate these “orphan” bands to explore this sort of thing.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'Of course, not every cloud is highly charged. Neutral clouds floating around
    probably would not be of much use in this application. But what this potentially
    gives us the ability to predict lightning storms by pinging suspect clouds with
    various microwave frequencies and seeing how they respond; a lightning cloud about
    to “blow” would be highly reflective.


    Incidently, this is a bit of off topic, but maybe of some interest to meteorologically-minded
    hams. For many decades, it was assumed that rain clouds always needed some kind
    of “seed” for raindrops to form. The ancient process of “seeding” clouds with
    iodine crystals and other chemicals for the purpose of making it rain was never
    much questioned. However, recent research in the plasma lab fairly conclusively
    shows that the main keeping water vapor aloft in cloud form is *static electricity*.
    If you discharge the vapor, the surface tension is broken and the vapor can condense
    into larger droplets. (You can make absolutely pure water “rain” inside a plasma
    chamber by discharging an electrically suspended cloud, though.) This also largely
    explains why so often rains directly after a lightning strike. Now you know.


    # A Bit Higher, a Bit Weirder


    While cloud-bounce is most likely the realm of UHF and microwave, there are a
    couple of mysterious atmospheric phenomena that are highly reflective of HF and
    even medium wave frequencies. These are known as noctilucent clouds, and polar
    mesospheric summer echoes (PSMEs) which many scientists believe are actually the
    same thing, but at different seasons. This is still under intense investigation.


    PMSE’s are below the D layer, in the no-man’s land between the stratosphere and
    the ionosphere. When they are in “action” they can appear as fully specular reflections
    at frequencies as low as 2.5 MHz, and possibly lower. At Hipas Observatory, we
    would convert our HF heater array to serve as a medium wave vertical incident
    radar to investigate these). They can come and go within seconds, but when they
    exist are unavoidable, creating near total reflection of vertical incident radio
    signals. Needless to say, in order to provide such an effective reflection for
    medium wave signals, they have to occupy a *lot* of sky. And, presumably, they
    have to'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'have extremely high concentrations of free electrons. As of this point, the
    only active radio investigation of these involves vertical incident probing. Oblique
    (low angle) sounding of these has not been performed in the scientific community,
    and may be something of interest for Amateur Radio investigation. Imagine really
    short skip on 160 meters! Although these were once considered a purely arctic
    phenomenon, there is some evidence that whatever they are, they’re gradually expanding
    southward as well.


    # How About Free Proton Propagation?


    Since it''s a given that all electrons have to come from somewhere, it goes without
    saying that for every electron we have, there must be a free ion somewhere. We
    can likewise use ion clouds to bounce radio signals from? Theoretically, yes;
    practically, no.


    As we know, every proton has the same charge as every electron. But the proton
    2000 times the mass...and to add insult to injury, the ion clouds that we have
    in the atmosphere and elsewhere are not likely to be proton clouds, but of much
    heavier ions.


    Recall our discussion earlier on nonlinear ionospheric phenomena. Now, while we
    may not be able to wobble an ion enough to get a meaningful level of RF re-radiation,
    it is possible that we might be able to instigate something known as ion acoustic
    waves. Ion acoustic waves are essentially sound waves, but rather than the result
    of collisions between neutrals, they are the result of propagated repulsive nudges.
    As such, they are compression (longitudinal) waves, and they travel much more
    slowly than electromagnetic waves, although much faster than waves at ground level.
    It is conceivable that ion acoustic waves are a component of long-delayed echoes
    and similar phenomena. The jury is still out on this.


    # Try it and See


    As with every other phenomenon we encounter, there is always room for experimentation.
    We still have a lot to learn, and as a radio amateur you are in the perfect position
    to just that.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 11


    # # Neutral Propagation


    By neutral propagation, we mean propagation through normal air. For the most part,
    Amateur Radio literature (and commercial radio literature, for that matter), has
    dealt with propagation through air as being essentially the same as propagation
    through a vacuum. However, there are enough


    observable effects of radio propagation through “normal” atmosphere to merit giving
    the matter some attention.


    # Dielectrics and Other Delights


    The dielectric constant of air at one atmosphere of pressure is 1.00059. If a
    pure vacuum has a dielectric constant of 1.00000, it’s pretty clear that air should
    act pretty much like a vacuum, as far as radio is concerned. But let’s take a
    look at the actual process by which a dielectric affects propagation. The terms
    insulator and dielectric are often used interchangeably, they are actually two
    different properties. While a good insulator generally has a high dielectric constant,
    these can both exist independently. An insulator is a material with low electrical
    conductivity (or inversely, very high resistance). A dielectric, while almost
    always being a highly resistive material, also has a relative permeability which
    is the ability of the atoms to be polarized. A vacuum has high resistivity because
    there is nothing in it to conduct electricity, and it has a low dielectric constant
    because there’s nothing in it to polarize!


    Air, likewise, a good insulator, because there are no free electrons (unless it’s
    ionized), and at atmospheric pressure there aren’t many molecules around to be
    polarized. So it also has a very low dielectric constant (though slightly more
    than a vacuum).


    When we send a radio signal through a volume of air, the atoms align themselves
    with the electric field of the electromagnetic wave…that is, they will shift their
    position slightly within the bulk material. But, you'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'may protest, “How can the molecules respond at all to a radio wave since they’re
    neutral?” Didn’t we long ago establish that only charged particles respond to
    radio waves?


    This is absolutely true, when we look at the atom or molecule from a distance
    (**Figure 11.1**). But any atom has *asymmetries* at some point in time. If we
    take a single hydrogen atom, for instance, with one electron circulating one proton,
    we still have this asymmetry. An electric field applied to the hydrogen atom will
    apply an equal and opposite force to the proton and the electron (**Figure 11.2**)
    — but not at the same time! This is because the electron is already moving around
    the proton. So, the field will still apply a “bias” to the entire system.


    ![](img/59293a6d87bff070066bbaf783df6263_143_0.png)


    Figure 11.1 — A neutral atom will generally be invisible to distant electromagnetic
    fields because the forces upon the opposite charges are equal and opposite.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_144_0.png)


    **Figure 11.2** — Although to the outside world there is no net acceleration of
    a neutral radio wave, there is an effect *internally*. Radio waves can cause neutrals
    to spin, for instance.


    Now, this is a bit oversimplified, since in air we have not only molecules, but
    different types of them. Nevertheless, the electric field passing through the
    midst of a “chunk” of air will offset the molecules, either in position, or rotation...or
    sometimes both. This process is not instantaneous. Since the particles have mass
    (or angular momentum) it takes a finite time for them to shift to their new polarized
    state. When the next half cycle of RF passes through, they not only have to return
    to their original state, but pass on to the *opposite* polarized state.


    But that''s not all! Remember the universal concept of reciprocity? Every accelerating
    charge creates an electromagnetic wave and every electromagnetic wave moves an
    electric charge. This applies here as well. The atom or molecule returns to its
    non-polarized position, it creates a small electromagnetic wave, which contributes
    to the original wave. The sum of the original wave and the “re-radiated” delayed
    wave contributed by the polarized molecules creates a new wave which is slower
    than the original wave.


    This process can be either lossy or lossless. In other words, the polarization
    can be entirely *elastic*, wherein all the energy is returned to the original
    wave, but slightly delayed in time. Or the process can be inelastic, where the
    polarization results in heat loss (friction). The amount of loss is rather complex,
    and depends on temperature, chemical composition, and'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'other factors. In a dielectric, this heat loss is sometimes referred to as
    a loss tangent, and mathematically shows up as an electrical resistance. You’re
    probably asking yourself about now, “How can the loss tangent increase the resistance,
    when it’s already in a perfect insulator?” This is an excellent question. The
    answer is that there are countless parallel resistances in a real dielectric material,
    and a loss resistor in parallel with an open circuit is still a loss resistor!
    (This explains why you sometimes increase ground losses of an antenna by adding
    more radials! An open circuit has less heat than a lousy circuit!) We’ll discuss
    this further in Chapter 12, Cheaper Than Dirt.


    # Mirages and Such


    As we seen, things are not always as they seem. A “perfect” insulator can have
    an effect on radio waves. Although we have countless different dielectric materials,
    air is somewhat special because the vast of our Amateur Radio communications take
    place in air. We know that air having varying densities as well, dependent on
    altitude, barometric pressure, and temperature. Water content has an effect, as
    well.


    The constant of air changes with respect to pressure, as well. Under typical conditions,
    change of pressure is so gradual that we don’t see much effect on radio signals
    of any frequency. There will be a small amount of dispersion of a VHF signal as
    we move from ground level to the stratosphere, barring any unusual activity, such
    as sporadic E, until we get to the ionosphere, radio propagation is nearly the
    same through air as in a perfect vacuum.


    However, sudden changes in pressure (or density) can result in sudden changes
    in dielectric constant and refractive index. When a radio signal encounters an
    abrupt border between air of one refractive index and air of another, we can have
    substantial refraction...or even reflection...occurring. We’ve all seen mirages
    over a road on a hot day, caused by the abrupt change in density of air directly
    over hot pavement to that of air a few feet higher. Objects far beyond the normal
    horizon can be seen clearly. Radio is electromagnetic, just like light, and can
    undergo the same effects. Radio “mirages” can occur at VHF, but even more dramatically
    at microwave frequencies. These reflections can actually become quite problematic
    for'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'commercial microwave links. If they happen to arrive out of phase at a receiving
    antenna with the direct wave, total blackouts can occur.


    “Clear air” reflections can also occur in the case of a strong inversion layer
    where a region of high pressure sits on a low pressure region. In optics, we have
    “superior” and “inferior” mirages, which are reflections from an inversion “ceiling”
    and an inversion “floor” respectively. Likewise we can have either type of radio
    mirage or both simultaneously.


    # The Art of Being There


    Predicting conditions amenable to over-the-horizon tropospheric propagation is
    very...well...unpredictable. Since these events are so tied to weather phenomena,
    their prediction is quite unreliable. It has been noted that though scientists
    have been predicting weather for millennia, while ionospheric physicists have
    less than a century under their collective prognosis belts, ionospheric prediction
    is much more accurate than weather prediction. To their credit, meteorologists
    don''t have the advantage of advance warning ionospheric physicists have. Solar
    conditions have somewhat direct and known effects on the ionosphere, where there
    is no such predictor for local weather.


    The take-away from this is that hams are successful at taking advantage of the
    myriad of exciting tropospheric events are successful because they are around
    when they happen. Such events can be rare and short-lived. Even if there were
    more reliable methods of predicting them, by the time you get the word, the event
    could be here and gone. This is not only true of tropospheric events, but also
    sporadic E, which again is called sporadic E for a reason!


    By now, it should be somewhat apparent that no mode of long distance radio propagation
    is mutually exclusive. There is nothing to prevent a radio signal, say, from undergoing
    sporadic E for one leg of a journey, followed by a nice F1 hop, finishing up with
    a conventional F2 hop. Multimode propagation paths can exist from HF frequencies
    clear up to the microwave bands. It is this fact that accounts for a lot of Amateur
    Radio discussion, when it comes to identifying just what path a radio signal is
    taking from'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Point A to Point B. This is also a great part of the intrigue. By the way,
    here is a neat overview of some “multimode” propagation paths, by the National
    Institute of Standards and Technology (NIST), formerly known as the National Bureau
    of Standards: http://nvpubls.nist.gov/nistpubs/sp958-lide/120-122.pdf.


    It is almost certain that so called transequatorial propagation is just such a
    multimode phenomenon. We''ll discuss transequatorial “skip” in more detail later
    in a more appropriate chapter, as it is definitely not a neutral type of propagation.


    # All Wet


    No discussion of neutral propagation would be complete without talking a bit about
    fresh water. We specifically mention fresh water (which is most of the Earth’s
    surface) has a profoundly different effect on radio than fresh water.


    As with any dielectric medium, fresh water has two fundamental electrical properties,
    namely electrical resistance and dielectric constant. Curiously enough, the dielectric
    constant of salt water is essentially the same as that of fresh water, while the
    conductivity is very different. Sea water is highly conductive, while distilled
    water is nearly a perfect insulator. Not not quite.


    One thing that makes water so unique (and it''s somewhat paradoxical that a substance
    is so prevalent on our planet is also so weird), that it is a polar molecule.
    Water has a property known as self-ionization, which is a relatively weak property
    and not of great interest as radio propagation goes. However, it has a very high
    dielectric constant at room temperature of 80.18. This means radio waves slow
    a lot when they pass through liquid water. However since pure water is a good
    insulator, the losses are generally negligible. HF and VHF frequencies can easily
    penetrate long distances through fresh water. A couple of scuba divers could easily
    use a pair of 2 meter transceivers to communicate with each other underwater —
    if they were in a fresh water water tank. However, it would be nearly impossible
    for a person above the tank to communicate with a scuba diver in the tank, because
    the abrupt change of dielectric constant from air to water will cause nearly total
    reflection from the surface. Any'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'signal that *did* manage to penetrate the surface would be sharply bent *below*
    the surface.


    The bottom line of this is that large bodies of fresh water, such as the Great
    Lakes behave pretty much the same for reflecting incoming skywave signals as do
    the oceans. However, for low angle *ground* waves, the Great Lakes and the oceans
    are very different! We’ll talk more about the “ground wave” properties of water
    in the next chapter.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 12


    # Cheaper Than Dirt


    Most professional and amateur antenna literature discusses the role of the immediate
    ground conditions on the performance of an antenna, but little is generally said
    about the long distance effects of the ground on radio propagation. In actuality,
    the ground has a great deal to do with both the antenna characteristics and the
    distant propagation characteristics. More recent antenna modeling programs do
    a much better job of describing the "far ground" characteristics than those of
    the recent past, so we''ll mention a few words about modeling the ground. But
    first, let us look at some basics.


    # Look Out Below


    Unless you are working with upper UHF or microwave frequencies, most Amateur Radio
    antennas are going to be close enough to the ground, relative to wavelength, the
    effects of the ground are non-negligible. In a majority of cases, the term "non-negligible"
    is a gross overstatement; most hammers underestimate the effect of the ground
    underneath their antennas, regardless of whether they''re working MF, HF, or even
    VHF. Of course, the effects of the Earth are progressively less as you increase
    in frequency, for a given antenna height, but there can occasionally be surprising
    ground effects even at microwave frequencies on the right (or wrong) conditions.


    In keeping with good scientific methodology, it''s best to explore the normal
    before attempting to explain the extraordinary. As a first order approximation,
    the ground underneath an antenna can be thought of as an infinitely large plane
    reflector. The quality of this reflector is highly variable, but it can be helpful
    to look at it as being a perfect mirror to start with. As a benchmark, let''s
    consider a 40 meter horizontal dipole, erected at a height of 1/4 wavelength,
    or 10 meters over the ground. This was a pretty common "default" antenna for a
    few generations of impoverished radio'
