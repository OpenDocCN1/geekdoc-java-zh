- img_proc: true
  md: '# Chapter 20


    # # NVIS Modes and Methods


    In recent years, radio amateurs have taken a renewed interest in emergency communications,
    especially those which don’t require a lot of high technology or fragile infrastructure.
    Closely connected with this development is the renewal of interest in near vertical
    incident skywave (NVIS) propagation and methods. While NVIS is as old as Amateur
    Radio, the acronym itself would be difficult to find in any amateur literature
    more than a decade old or so. More traditionally, this was referred to as “short
    skip” or “really short.",


    Most practical Amateur Radio emergency and public service communications take
    over moderate distances


    # ## Up and Down


    A perfect vertical incident skywave (VIS) signal would only be receivable at precisely
    the location from which it was launched. Here’s an interesting little point you
    may not have thought before. If the Earth had a diameter of zero, and the ionosphere
    were a sphere, say 5000 miles in diameter, all signals would be VIS signals if
    launched from the Earth, no matter which way you aimed them! The reality is the
    outer surface of the Earth is nearly the same diameter as the outer reaches of
    the ionosphere. This is where a lot of the models of the ionosphere youve encountered
    are a bit skewed. If you were to expand the surface of the Earth to the size of
    an orange, the surface of the Earth would be the inner surface of the rind, and
    the upper reaches of the F2 layer would be the outside surface of the rind! So,
    relatively'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'speaking, we can consider the “ceiling” to be a horizontal plane, rather than
    a sphere.


    Now, the vertical incident ionosphere we discussed theoretically looks at only
    true VIS signals. In practice, any physically “doable” antenna has a significant
    beamwidth, so if it’s aimed precisely vertically, it has a combination of a VIS
    ray (dead center of the pattern) surrounded by a cone of NVIS rays. Only the true
    VIS ray in the middle of the cone is going to come precisely straight down, while
    most of the cone’s rays come down at some distance from the launch site.


    NVIS signals are generally very low loss, because they spend relatively little
    time in the ionosphere; in other words, their total paths are relatively short.
    Effective NVIS can occur at any frequency below the critical frequency but above
    the D-layer absorption frequency (LUF).


    In practice, the best frequency is about 10% below the critical frequency. Obviously
    there are a lot of times when this particular frequency won’t fall within any
    ham band, so it’s best to choose the highest frequency ham band that’s below the
    critical frequency in your region.


    On rare occasions, the critical frequency can actually be below the LUF, in which
    case NVIS propagation would be impossible. In reality, NVIS on the low bands is
    useful nearly from sundown to sunrise,in most locations. It takes very little
    ionization to create effective reflections on 80 meters. Recall that as the local
    evening approaches, the ionosphere retreats from the bottom end up, the band will
    “go long.” This is particularly noticeable on NVIS links, even where very low
    antennas may become very effective for DX!


    # Cloud Burners


    Hams call any antenna that concentrates most of its energy straight upward “cloud
    burner.” This does not mean that NVIS requires high gain antennas. However, if
    you really want to optimize your station for excellent NVIS reliability, there
    are some effective favorite antennas. One of the best low-band cloud burners is
    essentially a cubical yard lying on its back. It is a full wave loop, about 1/4
    wavelength above ground, with a full wave loop reflector at or slightly above
    ground level. This is a very popular antenna in Alaska, where NVIS dominates the
    regional evening nets on 75 meters.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'These antennas produce consistently imposing signals just about anywhere in
    interior Alaska, usually several S units above those stations using verticals,
    and even inverted Vs and dipoles.


    In the absence of the motivation (or real estate) for such an antenna, a very
    effective alternative is a dipole or inverted V at 1/4 wave with a reflector mounted
    underneath. While a large reflective ground is ideal, one or two reflecting wires
    can gain you a dB or two of gain over a dipole. Another effective arrangement
    is a phased array of two or more dipoles operating in a broadside manner. This
    will allow you to steer the antenna to some degree along one axis, by adjusting
    the phasing, which may help at times with NVIS communications.


    # X and O Once More


    Probably nowhere will you notice a more profound difference between X and O propagation
    when using NVIS. One very effective NVIS antenna is a pair of crossed inverted
    Vs, fed 90 electrical apart. This is the standard configuration for ionospheric
    research, where such antennas are often combined in large 2D arrays. This antenna
    only needs one support, such as a push up, with the antenna elements serving as
    the guy wires. By switching the phasing of this antenna you can select either
    X or O mode propagation. You can easily observe a three S unit difference in signal
    strength between X and O modes.


    In addition, by selectively transmitting through a CPOL antenna, you can select
    between two reflection heights in the ionosphere, thus changing the range of your
    signal. This is a method that is just beginning to gain some traction in interior
    Alaska, and presumably some other areas that rely heavily on NVIS.


    X and O mode selectivity can be built into any type of antenna, though it can
    take a bit more real estate for some designs. Two of the aforementioned quad loop
    burners fed in quadrature would make a killer X-O NVIS antenna. One of the interesting
    aspects of circular polarization is that the N-S and E-W axes don''t need to cross
    each other. Two quad loops side by side, fed in quadrature, make a perfectly acceptable
    CPOL antenna.'
