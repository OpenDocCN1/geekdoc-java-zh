- img_proc: true
  md: 'The E layer lies between about 90 and 120 kilometers in altitude. It''s a rather
    thin region, though it might be hard to fathom 30 mile slice of sky as being thin!
    In terms of the entire ionosphere, it is a mere onion skin, however.


    The E layer consists mainly of ionized molecular oxygen, ($O_2$), ionized primarily
    by soft (long wave) ultraviolet. Most crucially, “normal” E is sort of a backward
    absorption layer; at low angles of incidence, it absorbs signals above 10 MHz
    and refracts those below 10 MHz quite effectively. However, because the layer
    is so thin, it''s quite easy to “miss” low angle E-layer refraction. In addition,
    because it is thin, it is unlikely to observe dispersive effects. Above the absorption
    frequency, the reflections from this layer are relatively independent of frequency.


    While “normal” E propagation subsides quickly after sunset, sporadic E, on the
    other hand, can occur at any time of day or night. This is because the ionization
    process is not due to a steady bath of UV, but rather by intense localized events.
    While the jury is still out on, there are three most likely causes of this intense
    ionization: ablation of meteorites (micrometers), lightning storms, and wind shear.
    All these phenomena generate vast concentrations of free electrons. Wind shear
    is the most intuitive, because it is most analogous to the buildup of static electricity
    by the rubbing of dissimilar objects. You have highly reflective mirrors. Sporadic
    E reflections are notable because of their highly specular or mirror-like reflections.
    Using HF radar, sporadic E reflections look like solid metallic objects, with
    well-defined boundaries. These blobs of electrons are effective reflectors of
    any radio signals whose wavelength is significantly less than their dimensions,
    up to the upper VHF range, where absorption becomes an issue.


    # The F Region


    Above the E we have the F region, which actually consists of two layers, ranging
    from about 200 km to 600 km in altitude. It is by far the “biggest” region of
    the ionosphere, by volume, and as such has for the widest variation of propagation
    within its domain. It is in the F region where we observe wide radio frequency
    *dispersion*, the frequency dependent'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'propagation of HF signals. Because the F region is so thick, HF radio signals
    spend a lot of time there in transit.


    During the daytime, in seasons of high solar activity, the F region can separate
    into two distinct layers, the lower F1 layer and the higher F2 layer. The F2 layer
    remains considerably thicker, however, and for the most part, the F2 will play
    the predominant role in worldwide HF communications. One can spend a long “career”
    in Amateur Radio without actually noticing F1 activity. When it exists, however,
    the F2 layer is clearly visible on an ionogram, and can be responsible for very
    strong “short skip” signals.


    Figure 6.7 shows an ionogram with fF1 (the F1 critical frequency) reported at
    4.43 MHz. In this image, fF1 corresponds to an inflection point in the electron
    density profile — it’s not another peak like the F2 layer (fF2 at 10.6 MHz).


    As the Sun goes down, the F region “retreats” from the bottom up. The upper extreme
    pretty stays fixed, while the region gets thinner. The F1 layer, naturally, goes
    away first, and the band “goes long” as the reflection height increases in the
    F2 layer. What’s truly amazing is just how fast this retreat can be. Using Doppler
    ionosonde methods, the reflection height can be seen to move upward by more than
    700 meters per second, right after local sundown! This can continue for a half
    hour or so until the reflection height settles in its nighttime altitude.'
