  md: '# Walking the Planck: Why Photons Don’t Matter (Very Much)


    Inevitably, whenever a discussion of radio propagation ensues among hams and other
    reasonably astute technical types, the matter (in the linguistic sense, not the
    physical sense) of **photons** comes up. “Why are we talking about rays and electric
    waves and magnetic waves and fields and stuff like that, when everyone born after
    the 19th century knows that radio waves are made of *photons*?” we all refrain,
    spoken or implied.


    This is certainly a fair question, which we will address here as concisely and
    painlessly as possible.


    Yes, photons exist, and every principle we discuss in this book can be reframed
    in a modern quantum-mechanical understanding of nature. With sufficient mathematical
    gymnastics, we can describe radio behavior in terms of streams of particles (photons)
    emanating from antennas and other generators. However, as it turns out, it’s not
    very efficient or helpful to do. *Classical* electromagnetism can explain 95%
    of everything we experience in radio propagation, and *Newtonian* mechanics can
    usually explain another 4.5%. The remaining 0.5% of what we observe as radio amateurs
    yields best to “photon thinking.”


    # A Small Fly in a Big Ointment


    There’s a little number, a very little number, known as Planck’s Constant that
    basically shows us how irrelevant photons are at frequencies we normally use for
    radio communications. (A few of us experiment with optical communications methods,
    where this number becomes a bit more meaningful, but this is a somewhat rare exception.)


    Let’s look at the number:


    Planck’s constant (h) = $6.62606957 \times 10^{-34} \text{ m}^2\text{ kg/s}$'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Even without being a mathematical whiz, we can deduce that E anything to the
    minus 34th power is going to be really small. What does Planck’s constant really
    mean? When everything is boiled down, it turns out to be a proportionality constant,
    which relates Energy to Frequency by the formula:


    E = hv


    where


    +   - E is Energy

    - h is Planck’s constant

    - v is frequency.


    We don’t need to derive any actual values to demonstrate that if h is extremely
    small, v must be extremely large in order for E to be meaningful. For a seasoned
    “radio guy” or “radio lady” this concept is not all that intuitive. In radio work,
    we generally consider *energy* and *frequency* to be totally independent values.
    A radio wave has a *certain power level* (energy per unit of time) and a frequency,
    and never the shall meet. We never consider that a 100 W, 10 meter signal actually
    has more energy than a 100 W, 80 meter signal. Planck’s constant will tell us
    that the difference in energy levels between the two frequencies would be so minuscule
    that it is not measurable by any instrumentation.


    It is only when the wavelengths involved become the order of the dimensions of
    an atom photons become meaningful, or put another way, that Planck’s constant
    becomes a large number relative to other things. When considering the ionization
    process due to solar UV radiation, Planck’s constant becomes meaningful. The energy
    difference between long UV and short UV significant, as does the difference between
    UV and X-ray radiation. X-rays have much larger energy and ionization capability
    than long UV rays. Photons in this regard become a more useful “medium of exchange”
    than they do at “normal” radio frequencies.


    # Bunches


    If we now know that the energy (or power) of photons is a function of *frequency*,
    then how in the world do we “translate”RF power to the photon world? It’s quite
    simple. If the energy level of a photon is a measure of its'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'frequency, the number of photons tells us how much RF power we have. So a 100
    W 80 meter transmitter pumps out more photons per second than a 50 W, 80 meter
    transmitter. In either case, we’re pumping out bunches of photons, but the energy
    level of each photon is small beyond minuscule.


    You are certainly welcome to use photons for all your radio work. I just don’t
    envy you working with those kinds of numbers!'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Understanding AM


    There are two kinds of hams in the world: those who use AM and those who would
    like to.


    Archaic Modulation, Ancient Modulation, Aztec Modulation...call what you will...
    has always been a certain primitive charm to old amplitude modulation. Long considered
    the sole domain of crusty old “AM still has a few tricks up its sleeve. Modern
    hardware (and software) allows the modern ham to explore this mode with little
    difficulty or danger to life and limb, something that couldn''t always be said
    of the first generation of AM experiments. We''ll look at a few interesting nooks
    and crannies of AM, which will happily suggest some ideas for experimentation.


    To the best of our knowledge, amplitude modulation was the first method available
    for applying voice to a radio signal. Because of its simplicity, it is easy to
    overlook some of the obscure and fascinating aspects of this time-honored technology.
    The fundamental method is implicit in the name, amplitude modulation. It is the
    art of changing the amplitude of a radio frequency signal in accordance with the
    intelligence (or lack thereof) that one wishes to transmit. The earliest methods
    of achieving this were painfully and frighteningly simple, such as inserting a
    carbon microphone in series with the high voltage lead of a spark gap transmitter!
    A number of early experimenters survived to tell about this alchemy...er...technology.


    Needless to say, the audio character of a “note” of a typical spark gap Morse
    transmitter in itself was about as pleasant as the receiving end of a chainsaw
    cutting through a porcelain sink; the addition of voice modulation to the cacophony
    only added to the tortured screech. Fortunately for all involved, amplitude modulated
    spark gap transmitter technology never really caught on a significant way; it
    took the advent of an actual'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'continuous wave (CW) transmitter to form the foundation for practical voice
    modulation. We need to be careful not to denigrate the aforementioned Medieval
    Method of Modulation too much, however, because it did provide a basis of understanding
    for what was to follow.


    # Options...of Sorts


    When one looks at a unmitigated radio frequency carrier, one realizes that there
    aren''t a whole lot of things you can do to the thing, if applying intelligence
    is your goal. You can change its strength (amplitude modulation). You can change
    its frequency (frequency modulation). You can change its direction (directional
    modulation). Yes Virginia, there is such an animal). You can change its phase
    (phase modulation). And you can change its polarization (polarization modulation).
    Hmmm...maybe you have a few interesting options. But AM came first, and it''s
    lasted the longest. And it''s the easiest to analyze mathematically.


    # Math Smithmath


    As it turns out, radio amateurs (and commercial radio folks, too) were producing
    some pretty decent AM signals without much of a mathematical basis for it. It''s
    not the appropriate math didn''t exist. That famous dead French mathematician
    Joseph Fourier had pretty well described all the mathematics we needed a couple
    of centuries before we needed it. But somehow, we managed to muddle through without
    it, largely through the incredibly precise application of trial and error...mostly
    error.


    In fact, for much of the early history of AM radio, little or nothing was mentioned
    about sidebands, for instance. And it''s still true that you can build a pretty
    decent AM transmitter without knowing diddly-squ about sidebands. But you can
    do it even better if you know such things.


    # What AM Isn''t


    On the surface it may seem that an easy way to create amplitude modulation is
    to simply add an audio voltage (Figure A2.2) on top of a radio frequency carrier
    (Figure A2.1). Take some radio, take some audio; throw it all in a pot and viola...AM
    radio. Unfortunately it doesn''t quite'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'work this way. If you take a radio frequency carrier and add an audio voltage
    on top of it, what you end up with is a thing called a radio frequency carrier
    with an audio voltage added on top of it (Figure A2.3).


    ![](img/59293a6d87bff070066bbaf783df6263_257_0.png)


    **Figure A2.1** — An unmodulated AM carrier is a simple sine wave. It has zero
    bandwidth. The envelope of the carrier is defined by the upper and lower peaks
    of its amplitude.


    ![](img/59293a6d87bff070066bbaf783df6263_257_1.png)


    **Figure A2.2** — A modulating signal is much lower in frequency than the carrier.
    For simplicity of analysis, we will use a single audio sine wave; in “real life”
    the modulating signal is much more complex... but can be analyzed as the summation
    of a number of sine waves if varying frequency, amplitude, and phase.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_258_0.png)


    Figure A2.3 — What AM modulation isn''t? Simply adding an audio signal (in this
    case a pure sine wave) to a radio frequency carrier simply results in frequencies
    occupying the same space. The Individual signals retain their complete identities,
    imparting no information to the radio signal whatsoever.


    ![](img/59293a6d87bff070066bbaf783df6263_258_1.png)


    Figure A2.4 — That''s more like it! Here have genuine AM modulation happening,
    wherein the amplitude of the radio frequency carrier is modulated by the audio.
    The AM process also generates sidebands, which are separated above and below the
    carrier by frequency. These two sidebands, being different in frequency may have
    considerably different propagation paths, resulting in selective fading. This
    was one of the primary motivations for the development of single sideband, where
    selective fading is greatly reduced.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'Mathematically speaking, the result shown in Figure A2.3 is simply the algebraic
    addition of the two voltages. In a linear system (that is, one that follows Ohm’s
    Law), the principle of superposition holds forth. Superposition tells us that
    each frequency maintains its original identity, with no interaction whatsoever.
    it’s a good thing Superposition exists, or we would live in a very odd universe
    indeed! Superposition “works” in free space, in wires, and in resistors. The superposition
    of audio on top of a radio frequency carrier does nothing to the radio frequency
    carrier. The amplitude of said radio frequency carrier remains absolutely untouched,
    and we have no information applied whatsoever.


    What we really want to happen is shown in Figure A2.4. This is the result of algebraic
    multiplication of the two signals. (This is absolutely not to be confused with
    frequency multiplication; it is the amplitudes of the signals which are multiplied
    together). This is not to say that frequency multiplication cannot also take place
    at the same time, but that is a secondary effect. The primary result we want is
    the multiplication of the radio frequency amplitude by the audio frequency amplitude
    (at any given point in time).


    # How We Do It


    In order to perform the multiplication function, we need some nonlinear element
    in the cauldron. This can be a diode, a Class C amplifier (either vacuum tube
    or transistor), or combinations thereof. You cannot use a linear RF amplifier
    to create AM, although you can certainly use one to amplify an AM signal that’s
    already been created “upstream.” A transmitter that performs the modulation process
    in the final stage is known as “high level” modulation, with a transmitter that
    performs the modulation upstream and then feeds the results to a linear amplifier
    is known as “low level” modulation. Most modern rigs use low modulation for AM,
    whereas the aforementioned AM spark transmitter clearly falls into the high level
    modulation category.


    # Heavy Iron


    The most straightforward means of modulating a Class C amplifier is with a modulation
    transformer. In this configuration, the plate voltage of the'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'final RF amplifier is passed through the secondary of a heavy iron transformer.
    The primary of the transformer is driven by the audio, typically via a push-pull
    class B amplifier, but on occasion using a single ended Class A. In either case,
    a significant amount of audio power is necessary, thus requiring a fairly substantial
    transformer. To fully modulate (we''ll talk about percentage of modulation shortly)
    an AM transmitter requires that you supply 50% of the RF amplifier''s dc input
    power in the form of audio. For example, if you have a 100 W RF amplifier (unmodulated),
    and the amplifier is 75% efficient, the dc input power to that stage will be 133
    W. This means you need to supply at least 66.5 W of clean audio power into the
    modulation transformer. Now, it''s not always necessary to fully modulate (100%)
    an AM transmitter (Figure A2.5). Many times there are advantages to “undermodulating”
    a transmitter (Figure A2.4 again). Many military and aviation transmitters use
    fairly low levels of modulation. But for working DX, you want to be able to modulate
    as “deeply” as possible. As we will see, the peak power output increases as the
    square of the modulating (or envelope) voltage.

    Keep in mind while there is no theoretical maximum positive level of modulation
    (maximum peak carrier amplitude), there is a theoretical maximum negative modulation,
    where the carrier is completely pinched off at the middle as in Figure A2.5. You
    can''t transmit less than zero power... although attempting to do so will create
    horrendous distortion!'
  merge: -1
  pgno: 260
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_261_0.png)


    Figure A2.5- Here we also have AM modulation, but with greater depth. This is
    the maximum modulation one can achieve with a sine wave audio signal as the carrier
    level is "pinched off" to zero during the negative modulation peaks.


    # # Square Law Stuff


    In our discussion so far, we have shown only the voltages involved in the AM modulation
    process. However, if we''re transmitting into an actual load of some sort (say
    50 ohms) the actual power at any time is described by E²/R. So, doubling the peak
    amplitude is four times the RF power! A fully modulated AM signal therefore has
    4 times the peak envelope power of the unmodulated transmitter. So you can see
    that any high power AM transmitter has to have some reserve power capacity all
    around.


    # # Not So Heavy Iron


    Because of the size and expense of "normal" high powered AM transmitters, clever
    hams looked for ways of circumventing the modulation transformer. As it turns
    out, modulating the screen grid of a tetrode or pentode tube operating in Class
    C results in fairly high levels of modulation with minimal applied audio power.
    You could also modulate the control grid, but with a lot more distortion in the
    final product. This was sometimes known as efficiency modulation, but more commonly
    referred to as deficiency modulation, because of the generally poor audio quality.
    (Despite'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'the size and weight, the classic heavy iron transmitter capable of the cleanest
    signal, with regard to audio distortion. This is why it was long the preferred
    method of AM broadcasting, as well.)


    Broadcasters themselves weren''t averse to experimentation, either. Several interesting
    (and proprietary) systems came out of the broadcast biz, things like Doherty modulation,
    the RCA Ampliphase system (ages ahead of its time), and various forms of semi-digital
    Pulse modulation. (I doubt there are any hams running a surplus Ampliphase transmitter,
    but one never knows!)


    # Pushing the Envelope


    As soon as hams discovered the oscilloscope, they discovered that audio voltage
    waveforms were not symmetrical....transmitting the human voice is not the same
    as transmitting audio tones. In fact, they can be very asymmetrical by a factor
    of 6:1 or more. In fact, this is not a problem, but if you wanted to modulate
    heavily, you could overshoot on the negative modulation peaks long before you
    reached full modulation on the "high" side. Again, clever hams discovered that
    if you could intentionally "flip" the modulation around so that the larger peaks
    were always positive, you could get a lot more envelope power out. This led to
    supermodulation, which was probably the next best thing to single sideband. Probably
    the most interesting (and controversial) part of this was that, according to the
    FCC rules for the time, power limit was determined by the dc input power to the
    final stage (2000 W). This did not account for modulation whatsoever! What this
    meant was, in the 1950s, one could perfectly transmit up to around four times
    the present day PEP single sideband output limits! (This was using the natural
    asymmetry of the typical male voice; with some actual processing, this power figure
    could be even higher!) Alas, with the current FCC rules specifying output power,
    one can no longer use the “AM Cheat.\ How sad.


    # Variations on a Theme


    I have a prized, pretty rare boat anchor, a Central Electronics 100V. It was one
    of the first commercially available single sideband transmitters, folks weren''t
    quite ready in 1959 to abandon their familiar AM altogether.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'This gem has every imaginable variety of AM: Double sideband with carrier,
    double sideband suppressed carrier, upper sideband with carrier, lower sideband
    with carrier, upper sideband suppressed carrier, lower sideband suppressed carrier,
    and FM thrown in good measure. (It also has some really ahead-of-the-curve features
    for its time, such as broadband tuning, but that''s a topic for another time).
    The point is, there was a semi rocky road toward the widespread adoption of single
    sideband, and a few of the intermediate steps are worth noting.


    A standard AM signal occupies a bandwidth equal to twice the highest audio frequency.
    The voice energy is contained in two (redundant, by the way) sidebands. Well,
    not redundant, but mirror images. But the effect is the same. You knew we''d eventually
    get around to sidebands, didn''t you? Well, not to tell. This is actually pretty
    neat stuff. If you have a "full AM" transmitter and want to pass audio from, say,
    300 to 3000 Hz, whose occupied bandwidth will be 6 kHz as shown in Figure A2.4.
    (You will also have a 600 Hz "hole" in the center of your occupied spectrum, well,
    which is often forgotten by many AM operators). There''s no reason you couldn''t
    fit a few CW stations inside that hole...but for some reason, this was never normal
    practice, even during the heyday of AM.


    At any rate, you can improve overall system effectiveness, by eliminating one
    sideband, or the carrier, or both (One QST article from the era suggested "suppressed
    sideband, full carrier" as a viable option as us). If you don''t get the joke,
    stick with us for a moment.


    One of the inevitable byproducts of the AM modulation is the generation of sidebands.
    Msr. Fourier''s wonderful equations explain this (if one can ever consider an
    equation "explanation" for anything). But as it turns out, sidebands are more
    than mere appendages; indeed they carry all the intelligence (or stupidity) of
    an AM signal! You cannot have AM without sidebands, and without sidebands, you
    have no AM!


    Which brings us to a chicken and egg paradox of sorts. Are sidebands really the
    product of the AM modulation process, or do sidebands *create* AM? As it turns
    out, both are true. One way you can create a "full AM" signal is by means of three
    signal generators, one tuned to the carrier frequency, one tuned to the lower
    sideband frequency, and one tuned to the upper sideband frequency. You can feed
    these signals into a *linear* combiner (such as three resistors) and lo, a genuine
    AM signal emerges.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '(You do have to appropriately set the relative phase of the three signals,
    by the way. Nobody actually generates AM this way (at least nobody in their right
    mind), but it''s doable.


    # ## Foray into Fourier


    Nobody hates math more than yours truly, so I like to use “thought experiments”
    to convey some self-evident principles that are a lot easier to grasp than things
    like Fourier Analysis. by the way, narrowly escaped beheading during the French
    Revolution, supposedly due to his politics. Personally, I think it was because
    of one of his math classes, but that''s neither here nor.


    Imagine a radio frequency wave of one frequency, say 1 MHz. As long as it''s a
    pure sine wave, it has one and only one frequency. Now, let''s take that sine
    wave and gradually decrease its amplitude. Most semi-astute radio folks would
    say, “Oh, that''s a sine wave with a gradually decreasing amplitude.” But it is,
    really? As it turns out, you *cannot* change the amplitude of a sine wave without
    changing its *shape* somewhere along the line. Each cycle will have a slightly
    different shape than the one before. The shape and size are inextricably linked.
    So, what we have is no longer a sine wave. In the process of changing the size
    of the wave, we also incrementally add other frequencies, by virtue of changing
    its shape. The more quickly we change the shape, the greater the difference frequency
    between the sidebands and the original sine wave.


    Now, as bizarre as some of this may seem, it is what makes it possible to manipulate
    sidebands independently, and thus create all these wonderful newfangled like single
    sideband, suppressed carrier. The math may be complicated, but the hardware is
    pretty simple....everything boils down to using the right filter.


    # ## Keeping Balanced


    One of the most common ways of generating any kind of AM signal these days is
    by means of the balanced mixer (most commonly the doubly-balanced sort). A DBM
    is really nothing more than a precision multiplier. Internally, it consists of
    four diodes in a ring configuration (hence its alternate name *ring modulator*)
    and a couple of center tapped transformers.'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'A modern DBM has three ports: RF input, IF output, and local oscillator (LO).
    These building blocks can be used in a wide variety of applications, and as a
    modulator, it''s very versatile. IF you apply an RF carrier to the RF port, and
    audio to the LO port, you get sideband suppressed carrier out the IF port. You
    can also unbalance the DBM by means of a small dc voltage superimposed on the
    audio going into the LO port; this gives you AM generated in this manner is extremely
    clean, and can easily be followed by a chain of linear amplifiers to yield a world
    class high power AM signal. You can control the amount of carrier power by the
    dc offset voltage, signal, and the modulation depth by the audio voltage. Pretty
    slick.


    # Where AM Shines


    Since the overall efficiency of a single sideband suppressed carrier system is
    vastly greater than that of an AM system, is there any reason, other than nostalgia,
    for the radio amateur to be interested in AM? Absolutely.


    One of the problems with a single sideband suppressed carrier link is that the
    frequency of any detected audio signal is strongly dependent on the frequency
    accuracy of a number of components, both in the transmitter and the receiver.
    Everything must be perfectly matched to “put everything back together” at the
    receiving end. Now, with the advent of things like precision synthesizers, this
    is nowhere the problem it once was, there are still applications where absolute
    frequency stability is a must.


    Imagine you have an HF telemetry setup, where you need to know exactly the frequency
    of an audio signal at the transmitting end. Sure, you could connect the audio
    frequency into the mic input of a modern SSB transmitter, and with a well matched
    receiver, extract that audio frequency at the distant receiver. This is assuming
    every local oscillator in the system is right on the money.


    With a full AM system, there is absolutely no error. “reference oscillator” (the
    carrier) goes along the ride! No matter how many frequency conversions the signal
    may encounter along the way, the demodulated audio frequency will remain unchanged.
    (By the way, the 440 Hz, 500 Hz, and 600 Hz tones that WWV sends can be precisely
    received'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'with an inexpensive receiver with atomic accuracy, because WWV transmits single
    sideband *with carrier*).


    Several navigational systems use AM as well, for the same reason.

    AM really helps for some digital modes too. Digital modes can consist of combinations
    of phase shift keying and amplitude shift keying, (QAM). Detecting frequency shift
    is pretty easy with a single sideband system, but what about amplitude shift...especially
    if you have several different values of amplitude shift to contend with? Can it
    be a real problem if you don''t have a reference carrier level. With full AM,
    you always have a carrier level to refer to, even with fading.(Selective fading
    can still be a problem with AM, greatly this much slower than the symbol rate,
    so it still helps to have that old carrier for the ride!)


    # Setting Up Your Newfangled AM Rig


    If you''re a recently minted ham, you probably stumbled across the AM mode on
    your HF rig by accident. Old time Boatanchorologists don''t need help getting
    a decent AM signal out of their heavy iron, but if you''re using a design for
    SSB, there are things to keep in mind. If you anticipate using AM, set the carrier
    output level for no more than 25% of the peak output capability. If you have a
    nominal 100 W rig, set the unmodulated carrier for no more than 25 w. This may
    seem a bit wispy, but remember our square law discussion; you will indeed reach
    your full 100 W on voice peaks. If you have an unsymmetrical voice (the only way
    to really check this is with an oscilloscope), you may be able to reduce the carrier
    level even further, while reaching 100% on the positive peaks.


    # Isn''t this Cheating?


    Some pundits consider it a travesty of some sort to use a state-of-the-art rig
    for AM; it''s sort of having an outboard motor on a Viking ship, according to
    their thinking. In the long term, this is probably true. But if you''re not sure
    what to invest in the heavy iron necessary to operate “Real AM,” using your 21st
    century rig is perfectly acceptable for getting your feet wet, and learning how
    AM is done. For a true feel of operation, my November 1993 QST article, “Solder
    to Talk. Be'
  merge: -1
  pgno: 266
- img_proc: true
  md: forewarned, AM operation is addictive, and once you let a boat anchor into your
    shack, more are certain to follow.
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Diversifying Your Options


    When performing radio communications in any environment other than free space
    (and this covers nearly all practical amateur radio communications), there is
    always a high likelihood of multipath conditions. This is true for frequencies
    ranging from medium wave clear up to microwave. This can be a mixed blessing.
    On the plus side of the ledger, it means there is often more than one way to get
    from Transmitter A to Receiver B, and vice versa. The most celebrated case is
    on HF, where you often have the option of "going long path," or "going short path."
    An unexpected long-path signal is generally cause for excitement, rather than
    an annoyance to contend with (except on extremely rare occasions).


    On the liability side, two simultaneous radio paths between two points can often
    result in destructive interference. A medium wavewave combined with a skywave
    signal can result in effects ranging from moderate distortion to total signal
    cancellation.


    In addition to multipath, we can also have rapid, to deal with variations occurring
    along a single path. Radio signals can significantly change skip distance, polarization,
    and angle of arrival over surprisingly small time scales.


    A number of so-called diversity methods can address and reduce most of the vagaries
    of radio propagation, including multipath and fading. While these methods are
    commonly employed in commercial and military systems, they are seldom taken advantage
    of radio amateurs.


    # Spacing Out


    Perhaps the most familiar form of diversity reception is spatial diversity. This
    method was commonly used to deal with selective fading, which is caused by slightly
    propagation paths taken by different frequencies due to ionospheric dispersion.
    To the uninitiated, it can see a bit'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'surprising that a few hundred hertz difference between radio signals could
    result in even measurable, much less harmful selective fading. But such is the
    case indeed. The difference in MARK and SPACE frequencies can be dispersive to
    cause complete annihilation of RTTY signals. For a relatively broadbanded signal
    like AM phone, the distortion caused by selective fading can be significant, and
    this was one of the strong incentives for the development of single sideband and,
    more recently, synchronous AM.


    The simplest method of reducing selective fading is by installing widely spacing
    antennas, where the likelihood of both antennas undergoing the same fading conditions
    simultaneously is greatly reduced.


    A typical diversity system consists of two antennas, two identical receivers,
    and a post detection combining system (usually the detector level). Some military
    receivers such as the venerable R-390s have built-in provision for diversity reception.


    This isn''t ayrıca practical option for the budget-strapped amateur, who may have
    a difficult time scratching together two receivers, much less two matching receivers.


    # Raising Your IQ


    There are a number of applications in radio where having two or more identical
    receivers would be nice. The once-disparaged direct conversion (DC) receiver has
    found an irreplaceable niche in radio science. Modern components make possible
    the construction of extremely high performance and inexpensive DC receivers, but
    more importantly, DC receiving methods allow the construction of many identical
    receivers. In addition, it is very easy to deploy DC receivers in phase quadrature,
    providing a whole new dimension in flexibility, not only for diversity methods,
    but also depth radio studies. An “I/Q” receiver (In phase and Quadrature), simply
    uses two detectors, shifted in phase by 90 degrees.


    The block diagram in Figure A3.1 shows a representative multiple receiver system,
    which can be expanded to as many receivers as desired. The only critical component
    in the system is the local oscillator, which needs to be clean and stable. The
    good news is, you only need one of them, no matter how many receivers you have!'
  merge: -1
  pgno: 269
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_270_0.png)


    For the dedicated experimenter, we cannot recommend the Novatech quadrature DDS
    8m synthesizer too highly:

    www.novatechsales.com/PDF files/dds8m.pdf. This module provides two very clean
    quadrature signals (sine and cosine) using direct digital synthesis (DDS). You
    can program this system to operate from dc to 100 MHz, as well as perform many
    sweep and modulation functions.


    The price of $695 may seem steep, but again, you only need one of these gems to
    form the core of a world class scientific receiver array. You can even build a
    full-fledged spectrum analyzer around the unit!


    # More Polarizing Thoughts


    The same IQ receiver system can be used to obtain polarization diversity, such
    as when using a separate vertical and horizontal dipole. Or perhaps, more revealing,
    a clockwise CPOL antenna and a counterclockwise CPOL antenna. For linearly polarized
    signals that slowly or randomly'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'change polarization, this can greatly reduce fading. For known CPOL

    sign (X and O waves), this can be used to quickly determine which of

    these waves you''re dealing with.


    # The Plot Thickens


    Although we refer to the detected output of our DC receivers as audio, in

    many cases this is nothing more than a dc voltage. This will often be the

    case when you''re doing propagation experiments with WWV or other

    beacon stations. One of the fascinating things you can do with any IQ

    receiver is to use an oscilloscope in the XY mode to plot the detected

    voltage. Connect the I to the X channel of the scope and the Q output

    t the Y channel of the scope. If you use, say, a vertical/horizontal diversity

    antenna, you will see the dot move to the axis where the greatest signal is.

    You will be surprised how much this moves around under even the most

    upposedly stable conditions!


    # Doppler for Fun and Profit


    One of the neatest things that an I/Q receiver shows is Doppler shift. You

    don''t need more than one receiver or antenna to show this. A single IQ

    receiver connected to an XY oscilloscope will show you how fast the

    ionosphere can move around. If a signal is moving lower in frequency,

    yll see a dot move around in a circle one direction; if it''s moving higher

    frequency, it will run around the screen in the other direction. During

    nightfall, the ionosphere will retreat by as much as 700 feet per second,

    which can cause the trace to spin around quite a merry rate!


    # Doppler Diversity


    As much as it is to watch ionospheric Doppler in action, it doesn''t

    much for the enhancement of watch communications. As any satellite operator

    tell you, Doppler shift can be a real pain. However, the effects of

    Doppler shift on HF are a bit more subtle...and unlike a low orbiting

    sellite which will always have Doppler, the ionosphere only exhibits

    significant Doppler during sunrise or sundown, as it''s either advancing or

    retreating. During the daytime or nighttime, there may be localized'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'movements and waves in the ionosphere, but on the average it''s fairly stable.


    All this being said, if you were to desire to create a Doppler cancelling diversity
    scheme, it would require two different frequency receivers, one slightly above
    and one slightly below the radio frequency of the signal of interest. For a pair
    of DC receivers, this would suggest a frequency separation of a few tens of Hertz,,the
    typical Doppler shift frequency of a receding ionosphere in the mid-HF frequency
    region. It might only be really useful during the fifteen minutes or so when this
    activity is in full force, but it could reveal some interesting physics.


    # The Goniometer Is Not Gone


    One of the most interesting radio devices of days past is the radioniometer, a
    radio direction finding device that did not need to physically steer the antenna.
    It consisted of two loop antennas at right angles. The outputs of these antennas
    fed a pair of orthogonal coils with a rotatable tickler coil inside them. By rotating
    the tickler could deduce which direction the signal was arriving fromminus the
    ever-confounding ambiguity that “normal” loop antenna gave you. It was an extremely
    clever and effective device, but did require extreme care and a lot of shielding
    around the tickler assembly.


    A 21st century incarnation of the radioniometer can be implemented using a pair
    of dipoles (or loops if so desired) and a single I/Q receiver. One antenna feeds
    the I channel, and the other feeds the Q channel. The outputs of the receiver
    are fed, and to any XY oscilloscope. The direction of arrival of a signal can
    be determined by the location of the spot on the oscilloscope. But here’s the
    real part. Because of the 90 degree phase difference between the channels, the
    180 degree ambiguity of either antenna is eliminated unless the signal is arriving
    PRECISELY from a north-south or an east-west direction! A signal arriving from
    any other direction can result in only one “quadrant” activated on the oscilloscope.


    Now, unless your receiver is actually phase locked to the incoming signal, there
    will usually be a few hertz difference between your local oscillator and the incoming
    signal. This will cause the display to be not a'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'fixed dot, but rather a dot that moves slowly in an ellipse...the orientation
    of the ellipse being representative of the direction of arrival.


    # Roll Your Own


    As you can see, the multi-IQ receiver setup can give you nearly limitless possibilities
    for various types of diversity reception. There are undoubtedly some forms of
    diversity reception we haven''t thought of. Again, the DC receiver is a cheap,
    versatile means of doing some real radio science. We encourage you to explore
    this fascinating technology, and do feel free to share your ideas and findings.'
