  md: 'Most radio amateurs, even seasoned veterans, give little or no consideration
    to the vertical launch angle of their signals. Probably even less attention is
    given to the incoming vertical arrival angle of incoming signals. Let''s deal
    with the former first.


    We might as well put it down in writing: Half of any antenna you use is ground.


    This may not be strictly accurate from a numeric standpoint, but since the ground
    has been undervalued for so long, we''re probably in no danger of giving it too
    much value, in at least one chapter.


    Many-heeled (or heavily indentured) radio amateurs spend a great deal of consideration
    and money on optimizing the azimuth gain of their antennas. Naturally, one wishes
    to aim as much energy as possible in the general direction one wishes to communicate.
    And, since most masts with which one wishes to communicate somewhere near ground
    level, they assume that is all that matters. A corollary to this thinking is that
    higher is always better. The composite result of this thinking is that the best
    antenna is, almost by definition, the most expensive. Getting big heavy objects
    in the sky is always an expensive proposition. So is keeping them there.


    If you were to ask the average ham why he or she wants to have the antenna as
    high as possible, he or she will answer something like, “That''s a really stupid
    question. The higher the antenna, the farther your horizon will!


    Oh really?


    A little thought and simple calculations will reveal just quickly you reach the
    point of diminishing returns when it comes to horizon distance versus antenna
    height...especially at HF. Remember, the horizon distance only goes up to the
    square root of antenna height! For all practical purposes, you will gain absolutely
    no discernible advantage over about 45 feet!


    “But...but...but...look at all those big stations with their 200 foot towers!
    They always clean up in the contests, so they must be doing something right!


    Certainly, they’re doing something right, but not for the reasons you think. If
    horizon distance were the main issue, then someone with a 30 foot tower in Denver,
    Colorado, would always clean the clock of any ham in'
