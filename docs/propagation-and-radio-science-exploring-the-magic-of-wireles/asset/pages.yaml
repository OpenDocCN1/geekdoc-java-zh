  md: '# Foreword


    One of the most fascinating and rewarding activities in Amateur Radio is studying
    the often baffling and sometimes frustrating phenomenon of radio propagation.
    Actually, radio propagation is not just one phenomenon, but rather many phenomena,
    all of which add up to an intriguing journey of radio waves from transmitter to
    receiver through the voids of space.


    Unlike sound, radio waves travel without the need for a medium, a truly amazing
    property that has intrigued physicists and philosophers for over a century. Understanding
    how radio waves interact with their environment is an important factor in achieving
    effective Amateur Radio communications. Amateur frequencies span the entire electromagnetic
    spectrum, at least in chunks, and each portion of the radio spectrum has unique
    advantages and potential pitfalls.


    A dedicated and skillful radio amateur may take great pains to ensure that the
    station''s transmitter, receiver, and antennas are functioning at their optimum
    performance, yet once a radio wave leaves the antenna, it is at the mercy of the
    ether.


    Because we have no control over the ether, our only option is to understand what
    it is doing and accommodate its often fickle behavior. This can be a ham''s greatest
    joy or a source of great frustration. And yet, unpredictable propagation can be
    at times, there is a great deal that we do know. And this is what this book is
    about.


    In Propagation and Radio Science, author Eric Nichols, KL7AJ, puts propagation
    front and center. In his lively and engaging writing style, Eric explains many
    of the phenomena we observe on the amateur bands and encourages us to learn more
    and experiment using readily available tools. We hope you will make use of the
    wealth of information found here.'
  merge: -1
