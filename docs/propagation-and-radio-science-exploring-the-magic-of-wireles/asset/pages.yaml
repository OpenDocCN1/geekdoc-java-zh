- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_71_0.png)


    Figure 6.2 — This shows a much more realistic scale of the relative distances
    Involved in long distance radio propagation. Although the ionosphere is a *sphere*,
    over small distances it appears more like a horizontal ceiling. This factor actually
    simplifies calculations, especially when multiple “hops” are involved.


    The Earth’s magnetic field has a **tremendous** effect on the ionosphere. This
    aspect has been greatly underestimated in most books on radio propagation, as
    well as propagation modeling programs. As we will see, it is the Earth’s magnetic
    field that accounts for the vast majority of “oddball” ionospheric phenomena,
    and it’s not as odd as we’ve often believed.


    My ionosphere is not the same as **your** ionosphere. This, again, should be obvious
    to the active ham, but the fact that the ionosphere changes rapidly in time and
    space is often neglected in propagation literature.


    # How to Make an Ionosphere


    Perhaps it’s more important at this point to ask **why** make an an ionosphere.
    Why is the ionosphere special? What makes it different from some of the other
    spheres, say the *troposphere*, we might encounter with radio?


    Here is where you will appreciate why we started out with some principles of particles
    in the first chapter. The **neutral** atmosphere — the'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'atmosphere that consists of oxygen, nitrogen, and a few other rarer gases —
    is totally invisible to radio. Well, *totally*, as we will learn later, *nearly*
    so. This is because in a neutral atom (or molecule) there are equal charges of
    positive and negative. There is no *net charge* for an intercepting radio signal
    to interact with. The forces will always be equal and opposite. No matter how
    much radio power you have available, you cannot wobble a neutral particle around
    it. A neutral''s charges are pretty wellabsorbed within the neutral; they really
    don''t care about external fields and forces. This truth is modified slightly
    when the wavelength of the intercepting radio wave approaches the physical dimensions
    of the neutral itself, but this doesn''t happen in Amateur Radio. Exotic technologies
    such as “laser induced fluorescence” can “drill down” into the inner workings
    of a neutral...but this is not “normal” radio behavior.


    In order to prepare a particle to respond to a radio signal, we have to separate
    the electrons from the protons...or more generally, from the *nucleus*. This process
    is called *ionization*. This takes a tremendous amount of energy...at least in
    comparison with what we can supply from Earth with our nearly HF transmitters.
    The primary ionizing agent is radiation from the Sun, primarily in ultraviolet
    (UV). X-rays can also cause ionization, but this tends to be actually disruptive,
    from a radio standpoint.


    When an atom (say nitrogen) is ionized by a UV blast, an electron gets out of
    orbit, and moves away from the remaining nucleus (which is now a positive ion).
    However, it doesn''t move too far, because the nucleus is now *positively* charged,
    and has an electrostatic attraction for the off-slapped electron. This is actually
    a very good thing for radio. If by some magic, we could throw a bunch of free
    electrons up without any remaining ions, the electrons would do what they do naturally:
    repel each other. They would scatter into the far reaches of the atmosphere, not
    doing any of us whatsoever.


    So, even though the free electrons are the end result we''re looking for, without
    the ions to keep them in check, they wouldn''t do us good. That''s why we call
    it the ionosphere, not the “electronosphere.” Even though the ions and electrons
    are approximately equal in number, it''s the ions that hold everything in a *sphere*
    rather than an amorphous cloud of unruly electrons.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Now, you’re probably muttering to yourself, “Okay, but what keeps the ions
    in a sphere?” The answer would be the same as the answer to “What keeps the atmosphere
    in a sphere?” That would be gravity. Remember that a proton weighs 2000 times
    as much as an electron. And, the nature of gravity is that it’s totally isotropic.
    It pulls perfectly symmetrically towards its center, which is why the atmosphere
    is pretty close to a perfect sphere... minus local disturbances. So, you can see
    that the whole system seems to be custom made specifically to make radio happen.
    At least some of us like to think so!


    Well, there are a lot of things that can go wrong in the process, and even when
    they all go right, it can be pretty complicated. But it can also be modeled pretty
    accurately.


    Let’s expand our model from just one or two ionized particles, and replace it
    with untold trillions. We’ll marinate our atmosphere with a nice bath of UV rays,
    so that a large proportion of the atoms are ionized. If all the available atoms
    were ionized, we would call the “target” fully ionized, but that only happens
    rarely, and in relatively small regions. As we will discover, it is the mixture
    of ions and neutrons (and, of course, free electrons) that give the ionosphere
    its “personality” at any given time.


    A few self-evident truths should emerge from this, one being that the greatest
    amount of ionization should occur on the side facing the source of UV (the Sun).
    And the highest ionization levels should occur at local high noon, after all things
    being equal. And, not surprisingly, we find that there is a high degree of correlation
    between the height of the sun and the maximum usable frequency (MUF), a parameter
    we will discuss thoroughly in a little while.


    A good deal of the unpredictability or “charm” of ionospheric propagation is due
    to the mixture of ions and neutrons, and their interactions. We will find that
    some modes of propagation such as sporadic E are more straightforward in some
    respects, where the reflection is largely due to highly concentrated clouds of
    electrons.


    The mixture of ions and neutrons is largely (but not entirely) responsible for
    the frequency dependent character of the ionosphere. But before we go too deeply
    into this aspect, let’s look at a few more self-evident aspects of the ionosphere.'
