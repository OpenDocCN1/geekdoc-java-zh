- img_proc: true
  md: '# But What Can We Do About It?


    This is a great question, with a profound answer. If you’re a typical DXer, you
    are probably using a beam antenna of some sort, and, as often not, using the same
    beam antenna for receiving and transmitting. If you hear a tasty DX station arriving
    from afar, your response is to steer your receiving antenna for maximum received
    signal, with the assumption that this will orient your antenna for the best signal
    with his location as well. As the previous discussion strongly implies, this is
    a bad assumption! The magnetic field almost certainly ensures that the path is
    not reciprocal...and it''s certainly not a Great Circle path.


    If you conclude that it would be beneficial to separate transmitting and receiving
    antennas, you would be absolutely correct! Now the question remains is this: how
    do you know where to steer your transmitting beam if you can’t rely on your receiving
    antenna’s heading? This most likely would require that you actually ask the distant
    station your signal. It might take a bit of give and take to get your antenna
    aimed down boresights... and the same for him on his end...assuming he also has
    two!


    The real issue is to really take advantage of the way radio really propagates,
    we need some sort of feedback. Verbal feedback is fine; it gives you something
    to talk about while honing in your antennas! But interestingly, it suggests some
    interesting possibilities for closed loop telemetry tricks as well. (See the sidebar,
    “Taking Advantage of X and O Modes.”


    This operating practice might also promote the use of honest signal reports, as
    well.


    Now, while this may seem somewhat tedious (and slow) for contest operation, for
    DX ragchewing, this could greatly increase your window of opportunity. Standard
    practice is to assume if you’re experiencing fading on the DX station’s signal,
    so is he or she, and thus it’s a hint that you should be getting ready to end
    the contact soon. But once it’s understood that propagation paths (and current
    conditions) are not reciprocal at all, you can adjust your operation accordingly.
    One can never how how QSOs were unnecessarily lost because of not understanding
    the “one way” nature of most HF conditions.'
