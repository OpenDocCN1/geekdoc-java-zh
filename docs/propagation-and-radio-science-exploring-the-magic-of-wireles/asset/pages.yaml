    # # Getting Real


    It''s probably a bit unfortunate that the square root of negative one is is called
    an imaginary number. It''s even more unfortunate that imaginary numbers are usually
    taught in high school class with no point of reference in the real world. As we
    will learn in the next pages, imaginary numbers have profound and very tangible
    physical significance. The significance of an imaginary number is just as “real”
    as a real number, but in a different manner than a “true” real number. Let''s
    forgive our mathematician friends; they had their reasons for calling imaginary
    numbers, but don''t let the name cause you to believe they are any less physically
