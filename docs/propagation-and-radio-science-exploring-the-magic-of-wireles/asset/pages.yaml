  md: '# Taking Advantage of CPOL


    There probably aren’t more than a handful of hams actually using circular polarization
    on HF As it turns out, without at least a CPOL receiving antenna, you can never
    know for sure whether you''re receiving the distant station''s X or O mode signal.
    You can sometimes guess, based on the fact that O mode signals are generally stronger,
    and more closely follow great circle paths. But this is only an educated guess.
    The fact of the matter is, to take advantage of X and O mode propagation, you
    need to be circularly polarized, just as the signals themselves are.


    Now, although a linearly polarized antenna responds just as well to a circularly
    polarized signal, regardless of the polarization, there will always be a 3 dB
    loss. This means that by “going CPOL” will gain you 3 dB of signal strength over
    a linearly polarized antenna of the same gain. This is, of course, assuming that
    your CPOL antenna is the right sense. If your receiving antenna is the wrong sense,
    it can reduce the signal to nothing...at least in theory.


    As it turns out, under typical conditions, a hastily constructed CPOL receiving
    antenna will show about a 3 S unit difference between the “correct” sense and
    the opposite one on any HF ionosphically propagated signal. Most hams are astonished
    when they perform this simple experiment. A simple, practical antenna for experimenting
    with HF CPOL is a crossed inverted V antenna with a simple 90 degree phasing stub.
    It requires only a single support pole, and has a reasonably small footprint even
    on 40 meters, CPOL effects are most evident. (Again, see the sidebar, “Taking
    Advantage of X and O Modes.”)


    # What About X?


    Obviously, radio amateurs have done just fine for decades without knowing anything
    about the X-mode ray...or the O-mode ray. Again, it’s a true testimony to the
    romance of Amateur Radio that we can do so much while knowing so little! But now
    the cat is out of the bag, and it will be pretty hard to put back in. Hams now
    know about X and O mode propagation, and once something it can''t be unknown.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'It’s been suggested, by default, most hams on a daily basis deal mainly with
    the O-mode signal, mainly because it tends to be stronger, and a little more “conventional”
    in behavior. But the fact is that every time you launch an HF signal into the
    ionosphere, you generate both an X and an O ray. Approximately half of all Amateur
    Radio power transmitted in the world is in an X-mode ray...somewhere. And that
    is the big “X Factor.” Where does X-mode ray go? Where on Earth is half of my
    radiated power ending up?


    As we stated earlier, you can’t know for sure without a CPOL antenna. It doesn’t
    mean you can’t receive an X-mode signal just fine with a dipole... or a vertical...or
    a Yagi...or any other kind of antenna. It''s just that you don’t know for sure
    if it’s an X-mode signal or not. But we can certainly use an educated guess even
    if we don’t happen to have a CPOL receiving antenna. We know that in the northern
    hemisphere (where the vast majority of hams reside anyway), the X mode ray is
    going to diverge the magnetic equator from where it’s “supposed” to go. So, in
    this itself gives you a strong hint. If I’m in Hawaii, and I’m hearing a station
    in California where the antenna has aimed at Alaska, it’s a fair bet I’m receiving
    the “X-ray.” By the same token, if I’m in Fairbanks, and I hear a Californian
    who swears he’s aimed at Hawaii, it’s almost certainly I’m receiving his O-mode
    signal.


    Again, as demonstrated in Chapter 6, this effect depends on frequency. The example
    in Figure 6.4, there is little deviation in azimuth by either the O-wave and X-wave
    on 10 meters. More investigation (or modeling!) is warranted.


    # Taking Advantage of X and O Modes


    The material presented here is an extremely abbreviated introduction to a long
    and complex topic, but one that is inseparable from a topic that is dear to most
    radio amateurs: HF radio propagation. The following topic might be considered
    highly controversial if it weren’t for the fact that it’s barely mentioned at
    all. A controversy, by definition, requires two opposing voices. In this instance;
    one voice has been almost entirely absent!'
