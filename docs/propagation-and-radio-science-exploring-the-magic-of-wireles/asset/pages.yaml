    [Courtesy Carluetschwab, KWSLA]


    We also have negative ions, while generally short lived, have some effect on ionospheric
    behavior, but exactly what role they play is not completely understood.


    # Excite Me


    In addition to the various ionization levels available to the different species,
    we also have different excitation levels. Excitation of a molecule or atom occurs
    when an electron is moved into a higher (larger diameter) orbit within the atom.
    Excitation requires a less energy than ionization, although both can occur simultaneously
    in the air. Visible light is emitted when an electron drops out of a higher level
    orbit into a lower level. Certain atoms such as nitrogen have numerous different
    excitation levels and modes, which can account for a large variety of colors seen
    in an aurora, as the excited electrons return to their ground state.


    One of the oddities of excitation levels is that they have a definite and well-defined
    lifetime, the time they stay in an excited state. This lifetime'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'can range from milliseconds to minutes. Since an electron “dropping back” to
    its ground state is pretty much random event, it may seem odd that there can be
    a defined excited lifetime. As it turns out, lifetime is a purely statistical
    phenomenon, and while the lifetime of an individual excited state is random, as
    a collective “gas” the lifetime turns out to be quite precise. The so-called “population
    inversion” that causes a laser to “laser” in synchronization is closely related
    to this excitation lifetime.


    Now, as for radio propagation is concerned, excitation levels have little effect.
    It is only when you start poking the ionosphere with optical frequencies that
    these excitation states become truly relevant. Interesting phenomena such as laser
    induced fluorescence are the result of various excitation states. Laser induced
    fluorescence has been used as an experimental communications mode, by the way,
    and is a wide open field for Amateur Radio experimentation, since we are effectively
    “licensed” for all frequencies above 300 GHz! Not long ago, the types of lasers
    necessary for performing this were beyond the reach of nearly every radio amateur,
    but with the incredible recent advances in laser diode technology, this is no
    longer the case!


    # Don’t Skip This Part!


    As suggested earlier, radio amateurs have done some pretty amazing things with
    radio with some really rudimentary understanding of what’s actually happening
    “up there.” And we will never deny that a great deal of the romance of Amateur
    Radio is a result of the mystery and unpredictability of the ionosphere, as well
    as some of sheer ignorance.

    The phenomenon of radio “skip” has been observed for nearly a century, and many
    aspects of it are pretty intuitive…if we consider the ionosphere to be a reflecting
    “sphere.” You don’t need to know much (if anything) about ionospheric chemistry
    to have a lot of fun and effective Amateur Radio communications! To make any real
    progress toward “advancing the radio art,” we should learn all we can about this
    vast part of our world. For any radio amateur with a modicum of sheer curiosity,
    there’s enough here to keep one occupied for a lifetime. Ionospheric propagation
    will probably never be fully predictable, but it can be largely understandable.'
