  md: 'We know that air pressure depends on altitude; the density of particles decreases
    as you move upward. But since air is compressible, the density decreases in an
    exponential manner with altitude, not linearly. (Conversely, if you''re a scuba
    diver, water pressure is nearly directly proportional to depth). The net result
    is that air gets very thin very fast as you move above the troposphere, which
    is part of the atmosphere we normally consider the "weather region." Since ions
    come from air, it''s fairly obvious that ion density would decrease with altitude
    in a similar manner. Well, to some extent, but not entirely.


