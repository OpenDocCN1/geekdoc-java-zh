- img_proc: true
  md: 'As it turns out, there is a balancing point. For those of you who have worked
    with high powered radio transmitters for a while, you know that it’s standard
    practice to silver plate RF coils and cavities, because you want the highest conductivity
    on the surface where the greater currents are. This follows our reasoning with
    regard to “I Squared R” losses. But skin effect is a two-way street. We can affect
    where the maximum current density exists by changing the conductivity of the material!


    And this is the primary “hitch” when dealing with a real Earth consisting of different
    layers of differing conductivity. The differing layers can “massage” the current
    density contour to a region that seems to defy the normal effect calculations.


    We also need to rethink the common “wisdom” that electricity always “takes the
    path of least resistance.” The truth is that the aforementioned “wisdom” is that
    the greatest current takes the path of least resistance.


    Now, let us return to our plagiarism of ARRL Antenna Book and gain some insights.
    Continuing on:

    …The depth in fresh water is about 156 feet and is nearly independent of frequency
    in the amateur bands below 30 MHz. In salt water, the depth is about seven inches
    at 1.8 MHz and decreases rather steadily to about 30 MHz. Dissolved minerals in
    moist earth increase its conductivity...


    We should note here that the skin depth is not a brick wall. With any logarithmic
    function, such as the familial RC time constant, or the inverse square law of
    radiative power, it gives us a useful line of demarcation between “good” and “bad.”
    And 1/e is a great “cutoff” point, since it exists everywhere in nature. You’d
    be hard pressed to find any physical function that does not follow the 1/e. It’s
    hardwired into the universe.


    # Counterpoint


    You may have noticed some similarities between the ionosphere and dirt. They are
    refractive, reflective, and conductive. They are both dispersive…that is, frequency
    dependent. Recall that frequency is a factor of skin depth, just as it is with
    the depth of penetration of the ionosphere. Both the ionosphere and dirt are characterized
    by a complex number,'
