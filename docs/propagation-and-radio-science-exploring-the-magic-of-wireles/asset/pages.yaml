    ![](img/59293a6d87bff070066bbaf783df6263_53_0.png)


    Figure 4.1 — As a radio signal emanates from a point source (small black square
    at the left) it attenuates as the square of the distance. if the waves are reflected
    from a distant object (vertical “wire” at the right) they are “re-radiated” as
    if from another point source. These reflected waves also attenuate as the square
    of the distance (R). This means that the total attenuation from a reflected object
    is 1/R! This is the gist of the depressing radar equation (There is the equation,
    but the important part is the attenuation versus R). Despite the tremendous “geometric
    attenuation” this process undergoes, hams very effectively reflected radio signals
    in a variety of situations.


    # But Now for Some Good News'
