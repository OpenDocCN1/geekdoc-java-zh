  md: '# The Invisible Journey!


    There are countless ways for radio signals to travel from transmitter to receiver,
    and understanding how radio waves interact with their environment is an important
    factor in successful radio communications. While radio amateurs can maximize station
    performance and reliability with the right equipment, knowledge, and skill, we
    cannot control propagation. Through scientific exploration and experimentation,
    we can improve our understanding of propagation and how it affects radio signals.


    Propagation and Radio Science presents a comprehensive overview of one of the
    most fascinating and rewarding aspects of Amateur Radio. Author Eric Nichols,
    KL7AJ, uses his lively, engaging approach to present the complex subject of radio
    propagation in simple, easy-to-understand terms. This book covers topics ranging
    from theoretical exploration to practical application. It explains the phenomena
    we observe on the amateur bands and invites you to embark on the journey through
    the still-unknown radio propagation universe.


    Chapters include:


    +   * Matters About Matter

    * The Optical Factor

    * Polarization, Gain, and Other Antenna Matters

    * The "Reflection" Process

    * The Ground Wave

    * Demystifying the Ionosphere

    * The Anomalous Ionosphere

    * Magnetic Personality

    * Instrumentation and Interpretation

    * Free Electron Propagation

    * Neutral Propagation

    * Cheaper Than Dirt

    * Diversity Methods

    * WWV and Channel Probes

    * Software and Other Tools

    * Keeping Up with Kepler and Friends

    * Your Friend the S Meter

    * Loads of Modes

    * Sea Shanty

    * NVIS Modes and Methods

    * Unexplored Territory


    About the Amateur Radio Service

    Aateur (Ham) Radio provides the broadest and most powerful wireless communications
    capability available to any private citizen in the world. The principles of this
    freely licensed service include public service, radio experimentation, training,
    and internationally provided. ARRL is the national membership association for
    Amateur Radio operators. ARRL has books, software, online courses, and other resources
    for licensing, operating, and education.


