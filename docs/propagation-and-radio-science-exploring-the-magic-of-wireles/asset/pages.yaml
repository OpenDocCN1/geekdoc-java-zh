  md: '# PROGRESSIVELY SLOWER WAVE PROPAGATION


    Figure 12.2 — Real earth has some similarities to the ionosphere. Dirt can have
    many layers of different conductivities and dielectric constants. In most cases,
    at least at HF frequencies, the depth of penetration can be significant. In addition,
    because of the sometimes high dielectric constant exhibited by soil, the radio
    waves slow down significantly, making the virtual reflection depth much deeper.


    Now, if you''ve been following carefully, you might have discovered a bit of a
    paradox with this skin effect business. We know that, at least for a uniform medium,
    the current density decreases with depth. So, intuitively we think that the further
    down you go, the greater the losses are. But remember losses are subject to Ohm’s
    Law — the “I Squared R” law rules supreme. For a given value of resistance, the
    greater the current, the greater the losses. So, based on this, it would seem
    that you''ve had the greatest loss where the greatest conductivity is, because
    that''s where the greatest current is....and we have already established that
    this is at the surface of a conductor. So does this mean that a lousy conductor
    has less loss than a good conductor at radio frequencies?'
