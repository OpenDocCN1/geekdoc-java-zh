  md: 'Fortunately for us radio amateurs, the situation isn''t quite bleak as the
    numbers suggest. Remember in the original radar equation we had this $\sigma$
    symbol? This is the radar cross section...that is, the effective size of the target.
    However, granted, a dipole 300 miles away is a pretty microscopic target. However,
    in most applications we''re concerned with, we are attempting to bounce a signal
    off a considerable chunk of sky! In fact, the cross section of just about anything
    we normally use for beyond-the-horizon communications is pretty huge....it can
    be a "patch" or hundreds of miles across. Or in the case of "dark side" propagation,
    it can be a hemispherical surface hundreds of miles across! So, we can breathe
    somewhat of a sigh of relief, knowing that re-radiated ham signals of strength
    are certainly possible. Of course, we know that already, didn''t we?


    There is more to cross section than size. The reflectivity, or lack thereof, of
    the material making up the desired "radio mirror" can vary widely, from almost
    nothing, to almost perfect. Large bodies of moist air can reradi waves — but generally
    poorly — so the effective cross section of large meteorological regions can be
    very small. And, even if it is highly re-radiative, if it doesn''t readiate in
    a useful direction, its cross section is also going to be very low. The radar
    cross section of a polished metal sphere is pretty much an infinitesimal point,
    regardless of the diameter of the sphere! Any signal reflected other than perfectly
    normal (perpendicular) to the surface of the sphere is going to be scattered off
    into oblivion as shown in **Figure 4.3**. The perfect stealth aircraft would be
    a perfectly round polished metal sphere... except that it would probably be pretty
    hard to fly!


    At this point, you will probably wonder how moonbounce (EME) is even possible,
    since the Moon is a sphere. Actually, it wouldn''t be possible, except for the
    fact that the Moon is very rough! There are enough nooks and cranniesies and crags
    scattered across the surface of the Moon, that, statistically speaking, it looks
    almost like a disk of the same diameter.'
