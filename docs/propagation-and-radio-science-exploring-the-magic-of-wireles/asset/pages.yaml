  md: 'up) of micrometeors entering the atmosphere, or local lightning strikes. It
    is likely also that wind shear effects may cause these electrons to appear. What
    makes these electrons very different from “normal” ionospheric electrons is that
    in this region we have almost nothing but electrons, without nearby associated
    ions. Because we don’t have the stabilizing effect of ions in this area, the electron
    clouds are, by necessity, short lived, or “sporadic.” Another feature of sporadic
    E (which will be shown in a different ionogram) is that there is no discernible
    frequency dependence... the reflection curve is remarkably flat. This speaks of
    true reflection instead of refraction. We go abruptly from a region of no free
    electrons to nothing but free electrons when sporadic E is in play. There is still
    a great deal to be learned about sporadic E, and it is a wide open field for experimentation.


    # Layer by Layer


    We’ve described how the presence of ions guides the ionosphere into fairly well-defined
    layers, which serve to make the whole region suitable for radio propagation. Let’s
    talk a bit more about these layers and their unique characteristics. There’s really
    something for everybody “up there” whether you operate “from dc to daylight” or
    never venture out of the confines of your 2 meter handheld.


    Ionospheric layers are sorted by letters of the alphabet, beginning with the D
    layer. Perhaps you’re wondering there’s no A, B, or C layers. Well, actually there
    are, but those are not actually ionospheric layers, but the troposphere, the stratosphere,
    and the mesosphere, respectively. Those particular spheres are not part of the
    ionosphere because they are not ionized, roughly enough. This is not strictly
    true, a lightning bolt creates very high levels of ionization, right down to the
    ground, but these are confined to very small regions and nothing resembling a
    worldwide sphere. And this is not to imply that there aren’t very interesting
    things happening near ground level. But for the most part, we begin our radio
    adventure at the D layer, which lies at an altitude between 60 and 90 kilometers.


    # An Absorbing Subject'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'The actual process of D layer absorption is more complex and counterintuitive
    in comparison with the more “beneficial” layers. One could understandably conclude
    that if a little ionization is good for radio propagation, a lot of ionization
    is better. And indeed, it takes a lot more energy to cause ionization to occur
    at the low altitude of the D layer. Well, there can be too much of a good thing.
    D layer absorption is caused by frequent collisions between electrons, where they
    don''t have the degree of freedom that they do at higher altitudes. resonance
    phenomena happening here, which contributes to the losses at low frequencies.
    Higher frequencies radio signals tend to slip by the resonances, unperturbed to
    a large degree.


    D layer absorption phenomena can be particularly strong in polar regions where
    the Earth’s magnetic field lines converge. Cyclotron resonances are prominent
    in these regions, as electrons oscillate about the magnetic field lines. The program
    Propl Pro 3 is one of the few ionospheric programs available that addresses cyclotron
    resonances. See Chapter 15, Software and Such.


    # E is for Excellent


    Once you manage to make it past the D layer, radio becomes a lot of fun. The next
    level of interest is the E layer. For many hands, E is synonymous with sporadic
    E; in fact, you hardly ever heard about non-sporadic E in typical Amateur Radio
    discussion. The fact of the matter is that E is a region and sporadic E is a phenomenon.
    Sporadic E happens in the E region, but there is a lot of other stuff happening
    there!'
