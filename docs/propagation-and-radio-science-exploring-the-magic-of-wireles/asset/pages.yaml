- img_proc: true
  md: 'This depends on your definition of ground. If by ground you mean a solid volume
    of highly conductive medium — what we like to think the Earth is made of — the
    answer is no. Conductive volumes short out the E field of radio waves, and prevent
    the propagation through them. At extremely low frequencies where the skin depth
    is very deep, radio waves can propagate somewhat, with extremely high loss. undersea
    radio propagation can take place at ELF. Both of these modes are so dreadfully
    inefficient and lossy as be utterly useless for Amateur Radio.


    On the other hand, if by ground mean "beneath the visible surface of the Earth,”
    underground radio can certainly exist. For instance, here in interior Alaska,
    the ground conductivity is so poor that it basically appears as an insulator.
    Many hams in the bush operate just fine with an 80 meter dipole or horizontal
    loop lying on the ground. Likewise, in similar regions, underground antennas act
    pretty much as if they were embedded in a chunk of glass. Back during the Cold
    War, a number of underground ham antennas were marketed as being blast-proof,
    indestructible, and so on. In some places, they actually sort of worked, but for
    the most part were miserable failures. Some antennas such as magnetic loops are
    supposedly better able to work underground better, because the electric field
    component is less in proportion to the magnetic component, and thus less subject
    to the “shorting out” phenomenon. This is dubious at best, still probably worth
    some experimentation.


    # Nonlinear Radio


    Now we get to the most interesting and unexplored “region of the weird”: nonlinear
    HF propagation. For the most part, ionospheric propagation is a linear phenomenon,
    in that the acceleration of charges is in direct proportion to the E field of
    the radio wave. Of course there are countless factors at play, but for any given
    state of environmental conditions, the signal coming out the ionosphere is in
    direct proportion to the signal going into the ionosphere. This is true even if
    we include the magnetic effects (X and O mode waves). We radio amateurs rely heavily
    on this linear property of the ionosphere. Things would be really strange if the
    ionosphere were something other than linear almost all the time.'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Back in the 1930s, a phenomenon known as the Luxembourg Effect gave the first
    hint that the ionosphere was something other than a passive reflector. The Luxembourg
    Effect was the observation that another distant shortwave station was able to
    cross-modulate with Radio Luxembourg''s powerful shortwave signal. The phenomenon
    was later observed on several pairs of shortwave stations. Since Radio Luxembourg
    was thousands of miles away from the secondary station, there was no possibility
    of front mixing or another similar circuit phenomenon. The mixing was clearly
    taking place in the ionosphere, but only at very high power levels. At the time
    Radio Luxembourg was the most powerful HF station in existence.


    This phenomenon instigated a decades-long exploration of ionospheric physics,
    especially in connection with high power radio, culminating in the construction
    of experimental facilities such as HAARP, Arecibo, EISCAT, and a number of large
    “heating” facilities scattered around the world. The research still goes on.


    The ability of the ionosphere to “mix” RF signals is a result of nonlinearities,
    just as in a common diode. There are several sources of these nonlinearities,
    but they all stem from the fact that both electrons and ions are accelerated by
    passing electromagnetic waves...but at different rates of acceleration. It is
    the combination of these different accelerations that gives us the nonlinearity
    of the ionosphere that results in so many interesting phenomena.


    The reason we don''t normally see nonlinear effects is that the ion is the proton,
    which is nearly 2000 times the mass of the electron, but with the same charge.
    This means we need at least 2000 times the E field to see the same acceleration
    from a proton as from an electron. Keep in mind that most ionospheric ions are
    much heavier than single protons!


    The bottom line is that at power power, we aren''t very likely to be able to wobble
    an ion enough to see the results back on Earth. It doesn''t mean it isn''t happening.
    It''s all a matter of degree. As experiments at HAARP (High Frequency Auroral
    Research Program) and elsewhere shown, there is no power threshold above which
    nonlinear action happens, and below which it doesn''t happen. It''s just that
    the results (that is, converted radio frequency re-transmissions) are usually
    far below any noise floor we can observe. With enough receiver sensitivity, and'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'perhaps some digital manipulation, it is not out of the realm of possibility
    that any ham can be a HAARP!


