- img_proc: true
  md: 'representing conductance and dielectric constant. Of course, the dirt doesn’t
    generally move around as much as the ionosphere, but it does have periodic and
    non-periodic changes.


    Up till now, we''ve dealt with ground conductivity (or lack thereof) as a necessary
    evil. We know that things would be much simpler if we did everything in free space.
    We have learned that we can''t simply ignore the ground and its effect on our
    radio enjoyment. Now we will look on the other side of this, and talk about how
    to really use the ground to our advantage, not just merely tolerate it.


    # Multihop


    Most of us understand that multihop ionospheric propagation would be impossible
    without intermediate ground reflections. The one exception to this is the relatively
    rare chond hop propagation discussed in an earlier chapter.


    While most HF propagation prediction tools are good at taking account the local
    ionospheric conditions, even through multiple time zones, they don''t take into
    account local or regional variations in ground conductivity, but model the ground
    reflections on a perfectly conducting sphere. This works reasonably well, but
    probably is far from ideal. Perhaps what the world needs is a good “multihopagation”
    prediction program!


    # What’s for Launch?


    It may seem a bit illogical to write an entire book to explain phenomena and behaviors
    of nature which you can do absolutely nothing! Inasmuch as we''re 12 chapters
    into this exercise, it''s a bit late to be thinking about such rhetorical existential
    matters. We''re here now.


    Actually, the situation is however near as grim as you may think. As the saying
    goes, “You can''t stop it from raining, but you can bring an umbrella.” And, as
    unpredictable and uncontrollable as radio propagation can be, we do have a lot
    of umbrellas up our sleeves, and a few other tools we haven''t even thought of.
    Knowing the difference between what you can control and what you can''t is often
    the best tool you can have.


    This brings us to the greatly underrated idea of vertical launch angle control.'
