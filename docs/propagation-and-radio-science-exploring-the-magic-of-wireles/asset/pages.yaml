- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_37_0.png)


    **Figure 3.1** — Electromagnetic radiation consists of an electric field and a
    magnetic field in phase with respect to time, but in quadrature relative to position.
    By convention, the polarization of an electromagnetic wave is defined as the polarization
    of the electric (E) field.


