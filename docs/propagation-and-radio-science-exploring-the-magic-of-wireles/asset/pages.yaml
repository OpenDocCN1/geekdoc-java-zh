  md: 'Another factor few hams consider is the incoming vertical angle of arrival
    of distant signals, which is actually a lot more important than typically acknowledged.
    We very seldom notice this, however, because in order to ascertain the direction
    of arrival of a signal, your antenna needs to match the polarization of the incoming
    signal. Since, as we will soon see, HF ionosphically propagated signals are, without
    exception, circularly polarized, virtually no radio amateurs are capable of accurately
    determining this direction of arrival — much less take advantage of the unique
    properties this circular polarization has to offer.


    In this very discussion, we cannot delve very far into the inner sanctum of the
    physics that these these and fascinating circularly polarized waves to emerge.
    However, we can treat the magnetized ionosphere as a “black box” with extremely
    predictable “output” behavior based on “input” behavior.


    When a linearly polarized radio wave enters the ionosphere, the interaction of
    the Earth’s magnetic field and the ions in the path causes the wave to split into
    two separate rays, one being clockwise circularly polarized, and the other being
    counterclockwise circularly polarized. This transition does not happen instantaneously,
    but rather gradually, as the radio passes through a medium of constantly changing
    density gradient. These two separate rays, known as the X-mode ray and the O-mode
    rays, diverge from one another in azimuth, vertical angle, and velocity. The amount
    of attenuation depends on the direction these rays travel with respect to the
    magnetic fields.


    These paths are neither reciprocal nor do they follow Great Circle paths....except
    for statistically rare recurrences. The only case where the X and O rays would
    follow nearly identical paths would be of both the transmitting and receiving
    stations were precisely on the magnetic equator, which would be about as likely
    as a Congressman voting himself a pay cut.


    The result of all this is not only fascinating, but also, ultimately, quite useful.
    If we were to deliberately select one or the other of these rays, we could achieve
    frequency re-use of nearly any HF signal path, amongst other things.


    Knowing that the X and the O mode signals have different reflection heights should
    present some obvious benefits. We can select their skip'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'distance by selecting our polarization, for example. There are a few complications
    here.


    From a more practical standpoint, the average will benefit more from the use of
    a CPOL receiving antenna, generally speaking. In addition, most hams need to prove
    it to themselves that X and O actually exist in the first place before they invest
    a lot of trouble and expense converting their entire stations into X and O mode
    juggernauts. It is extremely easy to build a CPOL receiving antenna to demonstrate
    the profound circularity of HF propagated signals. Even a hastily assembled CPOL
    turn will show a 3 S unit difference in strength between “correct” circular polarization
    sense and “wrong” circularly polarized sense. Most h are absolutely astonished
    to discover this, even with many years of on the air operation and experience
    with HF propagation.


    Once you have seen for yourself that HF signals are indeed circularly polarized,
    it''s usually a small step to the “so what” of all this. This knowledge itself
    suggests all kinds of new experiments and also suggests new ways of “doing business”
    as HF radio operators.


    This introduction is by no means the last word on the topic. In most cases it
    is the first word on the topic on X and O propagation for the vast majority of
    hams. I trust a number of you will test this and see for yourself! Don’t take
    my word for it. All scientific progress requires a healthy gift of suspicion.


    At the very least, I hope that this new knowledge helps explain what you have
    already observed, and goes a way toward removing some of the “chaos theory” you
    have been subjected to in your radio operation. — Eric Nichols, KL7AJ'
