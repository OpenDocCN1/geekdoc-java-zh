  md: '# The Ground Wave


    From a historical perspective, the first beyond-the-horizon radio propagation
    was the result of what is known as ground wave propagation. In recent years, most
    Amateur Radio literature has relegated ground wave propagation to a mere footnote;
    however resurgence of interest in medium wave (300 kHz to 3 MHz) and lower frequency
    propagation merits a closer look at this classical means of long distance propagation.
    We can even learn a bit about ionospheric propagation by looking at ground wave
    propagation in detail. Since most radio amateurs live on the Earth, it''s probably
    a good idea to talk about the Earth itself, and how it affects propagation.


    # Down and Dirty


    Now that we know how radio waves travel through free space, let us look at another
    very common medium we''ll encounter in our day-to-day Amateur Radio operation.
    We''re talking about dirt, the stuff that covers most of the Earth that we live
    on. (Of course, most of the Earth''s surface is water, but relatively few radio
    amateurs live on the water, or operate from that environment. However, we will
    dedicate an appropriate amount of discussion to sea propagation towards the end
    of this chapter). Any medium other than a vacuum has two fundamental properties:
    resistivity and dielectric constant. Both of these have important, but very different
    effects on radio waves that pass through a medium. And, by now, you will not be
    surprised to learn that dirt, or any other non-vacuum medium has orthogonal properties;
    in other words, it is described by a complex number. Without taking into account
    the fact that dirt has a complex impedance, we can never fully explain (or exploit)
    ground wave propagation. Furthermore, nearly any practical amateur antenna is
    going to be affected by the proximate ground, regardless of whether we''re actually'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'using ground wave propagation or not. So, bear with us as we take what may
    seem to be an inordinate amount of time discussing the nature of dirt.


    # Intrinsic and Extended Properties


    Any radio amateur should be familiar with the concept of resistance. Resistance
    is the opposition to the flow of current in a particular conductor or other component.
    It is measured in ohms, of course. A less familiar term to many radio amateurs
    is resistivity which is an intrinsic property of the material in question, say
    copper. There are actually a few forms of resistivity: linear resistivity, surface
    resistivity, and volume resistivity. Linear resistivity is probably the most intuitive;
    it is measured in ohms per inch, or ohms per foot. A certain gauge of copper wire,
    for instance, has a certain linear resistivity. However, even linear resistivity
    is a somewhat derived value, as aren''t too many natural objects that come in
    the form of a wire!


    A more fundamental value, something that is more intrinsic to the material in
    question, is volume resistivity. If you take a cube of a certain volume of copper,
    and measure the resistance from one face to the opposite face, say a meter away,
    you will have a resistivity measurement in ohmmeters, or ohm-inches, or some such.
    If you have a cube of material with a conductive plate on a pair of opposite surfaces,
    the substance under question can be considered to be forms of a whole lot of parallel
    resistors (**Figure 5.1**). The total resistance is inversely proportional to
    the sectional area of the sample, and to its length.


    The situation is quite a bit complicated if you want to measure ground resistivity
    (or its reciprocal, ground conductivity) by means of a couple of stakes driven
    into the ground, the standard means of determining local ground conductivity.
    The reason is that you have a whole lot of nonlinear paths between the two stakes,
    as seen in **Figure 5.2**. Solving this requires the use of elliptic integrals,
    which are not much fun for the average math student. Fortunately, there are charts
    available that run these calculations for you, based on just one measurement.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_59_0.png)


    **Figure 5.1** — The electrical path through a solid mass, such as the Earth,
    can be extremely complicated. In the simplest form it appears like a lot of resistors
    in parallel...but not quite. There''s a lot of "lane changing" going throughout
    the journey. Ground conductivity is much more easily measured than calculated.


    ![](img/59293a6d87bff070066bbaf783df6263_59_1.png)


    **Figure 5.2** — Calculating ground conductivity can be a real challenge. If you
    drive two rods into the ground some distance apart, you will have an infinite
    number of elliptical paths for current to flow. The length of each of these paths
    can only be determined by extremely difficult *dielectric integral calculus*.
    Fortunately, we have charts and tables to help us figure these things out. Even
    more practically, we can do some fairly simple measurements to determine our local
    conductivity.


    Now we get to the fun part. **Ground conductivity (or resistivity) is only part
    of what we need to know about dirt.** Equally important (and frankly, a whole
    lot more interesting) is the matter of *dielectric constant*. As we discussed
    Chapter 2''s sections on optics, a medium with a different dielectric constant
    than vacuum has a different velocity of propagation that does free space.


    The combination of these two properties, volume resistivity and dielectric constant,
    has two primary effects on any radio wave passing'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'through. It absorbs energy, causing attenuation, and it slows the radio wave
    down. (In actuality, there are some media which actually have a negative dielectric
    constant, causing the phase velocity to be greater than that of free space, but
    we don''t encounter such oddities in most of Amateur Radio.)


    The attenuation is fairly straightforward, and easy to explain. The electric field
    of the wave, passing through a conductor, causes a voltage to be impressed across
    the conductor, which in turn causes current to flow in the direction of the instantaneous
    E field. Since it''s not a good conductor, there is heat loss (ohmic heating),
    which is real and measurable. This heat loss is relatively constant regardless
    of the direction of wave travel through, assuming the material (dir) is isotropic
    — that is, containing the same resistivity throughout the travel of the radio
    wave. This is not always the case, however, as the bulk resistivity of real world
    dirt can vary considerably with depth. But this can be a tricky bit to measure,
    and we can determine some of this by inference.


    Now, for sake of simplicity, let us consider a radio wave coming straight down
    through the air and encountering typical earth perpendicular (or normal) to the
    surface. We know that, since the dirt is partially conductive, there has to be
    a certain quantity of free electrons available. Since the process of absorption
    and re-radiation applies, regardless of the medium, we see that electrons are
    accelerated to some degree at each increment of depth. If we imagine the dirt
    as being an extremely large number of thin layers of conductor, we will have countless
    reflections occurring along the path of the descending radio wave. Each layer
    absorbs and reradiates the impinging radio signal. However, each layer radiates
    both in a forward direction (to the next lower layer) as well as backward (in
    an upward direction) This bucket brigade action of each layer absorbing and re-radiating
    to the next layer has the bulk effect of slowing down the wave propagation.


    Although the internal workings of such a system are extremely difficult to completely
    visualize and analyze, the general effect is that of a single sheet reflector
    below the surface of the Earth. We can replace all these partial reflectors with
    a single sheet with an effective depth of some finite distance below the surface.
    As we start looking at the optimal height of an antenna above ground, we can use
    this effective depth to great benefit.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'From a circuit oriented point of view, we can consider the attenuation loss
    as the resistive component, and the delay as being akin to reactance. We don''t
    want to over-extend this analogy too far, except to realize that both components
    are intertwined. And, in optics, the total value is a complex number, one axis
    being resistive, and the other axis being reactive. Again, we need to defer to
    the optics definition, by convention, and designate the dielectric constant as
    the real component, and the loss component (also called the lost tangent) as the
    imaginary component. Again, this is at odds with normal concept of real in the
    physical sense.


    The important thing to remember is that ground is indeed a complex figure, and
    we need to address the dielectric constant just as much as the resistance.


    # Grazing Paths


    Things become more interesting when the radio signal enters the Earth at an angle,
    rather than normal to the surface. Let''s look at the extreme case, when the radio
    wave is coming in parallel to the surface of the Earth, the low-grazing path.
    To make things even more extreme (and interesting), let''s imagine the Earth''s
    surface as being a perfect conductor, but all that conductor is confined to a
    very thin skin; in other words the Earth is made of a hollow, thin-walled copper
    ball. Let''s further define the situation and stipulate that the wave horizontally
    polarized, that is, the electric component of the wave is horizontal. The electric
    component, in free space, attempts to apply a voltage across its two "terminals."
    Now, obviously, a wave doesn''t have terminals, per se. It does have two polarities,
    that the opposite amplitude extremes. If we are to apply this voltage source to
    a short circuit, what happens? Well, the voltage source is short out. It will
    attempt to cause infinite current to flow through the Earth''s surface (in the
    same direction as the voltage difference of potential), but that can''t happen.
    What does happen is the difference of potential (the E component) is reduced to
    essentially nothing, and the wave ceases to propagate at all.


    Now let''s change the polarization of the wave to vertical; that is the E component
    is perpendicular to the Earth. We can imagine half of the E component being "under"
    and half above the surface. Even if'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'the copper is perfectly conducting, we will only short out the “center” of
    the E-wave, where the voltage is at near zero. The thin-skinned Earth will have
    essentially no effect on the vertically polarized radio wave. We can make a broad
    statement therefore, that true ground wave signals are vertically polarized. By
    true ground wave, we mean radio signals that propagate for an appreciable distance
    in contact with the surface of the Earth. This is in sharp distinction with radio
    waves either bouncing off the ground, or with space propagation, which, while
    in proximity to the ground, makes no direct contact.


    We can show that the surface of the Earth itself is a polarized device. But it''s
    actually a lot easier to demonstrate this principle with a simple optics experiment.
    All you need is a microscope slide, a point source of light (a light bulb or fluorescent
    tube fixes), and a polarized sheet of plastic (a pair of polarized sunglasses
    will do).


    Set the microscope slide down on a table so you can see the reflection of the
    light bulb in the slide, or at about 45 degree angle (**Figure 5.3**). Now, at
    the reflection through the polarized lenses, and rotate the lens around its plane.
    The reflection from the glass slide will become much dimmer at some point of the
    lens’s rotation. At this point the polarized lens is 90 degrees with the vertically
    polarized reflection from the glass slide, proving that the reflected ray is indeed
    polarized. You can adjust the angle of incidence to a point where the reflection
    completely disappears when it''s cross-polarized; this angle is known as the Brewster
    angle. In radio, we have what''s called the “pseudo-Brewster” angle, because the
    reflection point is nowhere as well as it is with a microscope slide. However
    the underlying physics is nearly identical.


    The pseudo-Brewster angle has some significance for radio signals arriving at
    medium vertical angles. But now, let''s concentrate on very low angles of arrival...signals
    running essentially parallel with the Earth’s surface.


    A vertically polarized, horizontally moving wave can travel with its bottom half
    below the Earth’s surface, and the upper half above the Earth’s surface. In this
    state, we have two parts of the same wave traveling through different media...and
    at different velocities. This would theoretically require the wave to “break”
    at the demarcation between the two media'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'shown in Figure 5.4. However, this is a physically impossible situation. You
    absolutely cannot have a “split wave” propagate. Only continuous waves can propagate.


    ![](img/59293a6d87bff070066bbaf783df6263_63_0.png)


    **Figure 5.3** — Any “true” ground wave must be vertically polarized. In addition,
    any wave that reflects off the ground at a low angle also becomes vertically polarized.
    This effect can be easily demonstrated with simple optical apparatus. At lower
    frequencies, (radio frequencies), the so-called “pseudo-Brewster” angle applies.
    Although the physical principle is identical, the effect is not well-defined in
    radio as it is in optics.


    **We can**, however, “reconnect” the split waves by allowing the wave to bend
    downward. We now have a continuous wave with a slightly different velocity between
    the top and the bottom halves (**Figure 5.5**). It is this action that allows
    true ground wave propagation beyond the horizon. In fact, this is very effective
    for long distance maritime communications, saltwater has a very low loss tangent,
    a fairly high dielectric constant. Again, it’s important to realize that *only
    vertically polarized signals can propagate in this manner*. With this in mind,,
    it’s almost given that any long distance medium and long-wave signals will be
    most effectively received with vertically polarized antennas.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_64_0.png)


    **Figure 5.4** — An electromagnetic wave travels more slowly through a medium
    like dirt than it does through air or free space. This presents an impossible
    scenario when part of the wave passes through air and part through Earth. The
    two different speeds would require a “breaking” of the wave at the junction between
    the two media, as shown here. However, the laws of physics won’t allow this to
    happen. All electromagnetic waves must be continuous.


    ![](img/59293a6d87bff070066bbaf783df6263_64_1.png)


    **Figure 5.5** — To resolve the impossible situation in Figure 5.4, the wave must
    bend toward the slower medium to keep the wave “connected”. This process that
    causes waves to follow the contours of the Earth. Perhaps the “Slinky” analogy
    might help. If you lay out a Slinky on a table in a straight line, and compress
    the coils on one side (the equivalent of slower propagation), the Slinky must
    bend in the direction of the compressed side of the coils.


    An interesting antenna that merits special consideration in this regard is the
    Beverage antenna, which operates in a different fashion than most conventional
    Amateur Radio antennas. A true Beverage antenna, while being physically constructed
    of a long horizontal wire, is actually vertically polarized, and very strongly
    so. Ordinarily a wave arriving “end on” to a wire introduces absolutely no voltage
    along the wire, which is why a dipole has a perfect null at the ends. However,
    as we have shown, a low angle, vertically polarized wave leans forward slightly.
    This leaning action creates a small voltage differential component along the wire.
    It should be evident'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'that a Beverage would not work at all in free space, but rather relies on the
    Earth’s dielectric constant for its function.


    One of the interesting results of the polarization filtering of the Earth’s surface
    is that, since only vertically polarized signals can propagate along said surface,
    one may conclude that low angle incoming radio waves are inherently vertically
    polarized. They may or not be. As we will discuss in detail later, nearly all
    practical HF ionosphically propagated signals are circularly polarized. However,
    when such a wave encounters the Earth at a grazing angle, the horizontal component
    is suppressed, leaving only a vertically polarized signal as a result. Much erroneous
    thought about ionosphically propagated waves is a result of this phenomenon, and
    one has to get a fair distance away from the Earth’s surface, or use some other
    clever tricks to eliminate the polarization filtering of the Earth to learn the
    true nature of ionospheric sky waves.


    # Seafaring Signals


    Since two-thirds of the Earth’s surface is water, we would be remiss if we didn’t
    discuss some of the particulars about radio propagation over the sea. As we mentioned
    at the beginning of this article, the first truly long distance radio signals
    were propagated over the world’s oceans. Radio is actually very good when you’re
    at sea, for a number of reasons. Radio amateurs who are privileged to operate
    on or near the ocean are always delighted by the wonderful conditions which always
    affords.


    Because sea water is highly conductive, it forms an excellent reflector for signals
    arriving at high angles. This can result in numerous low-loss hops across long
    distances, particularly noticeable at HF frequencies, and certainly not restricted
    to that part of the spectrum. Reflections from terrestrial Earth are generally
    quite loss, as we have described above. In addition, the ocean’s surface is, on
    the average, a flatter than land; it forms a much more effective reflecting plane
    for downward arriving signals. Just about any experienced DX operator can testify
    to how much easier it is to operate long distances over ocean paths than land-locked
    ones, at least on the average.


    But you don’t have to be on a ship to take advantage of this. Just being near
    the ocean, whether on an island or a large coastal area, can give you a'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'tremendous advantage both for high angle signals for low angle ones. Any good
    antenna modeling program takes into account not only the ground conditions directly
    below the antenna, but also on conditions many wavelengths from the antenna. Large
    bodies of sea water are good ground planes!


    # Fresh Ideas


    What about fresh water? This is a very good question! We do have a few ocean-sized
    fresh water lakes in the United States, as well as other areas of the world. (The
    US Great Lakes are among the world''s largest, however). Is there any advantage
    to working on or near a Great Lake...or just a great lake?


    For a useful answer to this, we need to talk about little skin depth. For a quick
    background, we''ll refer to an excellent article by Rudy Severs, N6LF, on skin
    depth of soils. Rudy''s article may be found at www.antennasbyn6lf.com/files/ground_skin
    depth and wavelength.f


    Although, as you can see, the formulas are a bit involved, the conclusions are
    fairly straightforward. The better the conductivity of the medium, the shallower
    penetration of an incident radio wave. The skin depth (penetration depth) of average
    sea water to HF radio signals is about six inches! This means that there is no
    way you can use your HF "manpack" radio to talk to a boat on the surface when
    you''re scuba diving at 50 feet...or 5 feet...regardless of how much power you
    have! (Not to mention building an antenna that works under sea water without shorting
    out is a real trick in itself!)


    Because the skin depth is so low for salt water, as well as frequency dependent,
    we find the only frequencies available for effective submarine communications
    are in the ELF (Extremely Low Frequency) region, generally a few hundred Hertz.
    Since most hams probably aren''t going to doing much submarine communication,
    this may be a moot point, but it does demonstrate some interesting physics.


    Now fresh water is an entirely different animal. While the dielectric constant
    (propagation velocity) of sea water and fresh water are about the same, the conductivity
    of fresh water is nearly zero, and the skin depth'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'very large. In fact, it would be no problem to communicate with submarines
    in the Great Lakes with HF radio methods. To the best of our knowledge there aren''t
    a lot of submarines prowling around the Great Lakes, but one never knows. Likewise,
    it would be no problem to use your 2 meter handheld at the bottom of your swimming
    pool. From a more practical standpoint, because of the essentially non-reflective
    properties of fresh water, there would be minimal advantage of operating from
    or near a large body of fresh water. Many hams dispute this, however; this author
    knows a few hams near the Great Lakes who vehemently assert that it''s just good
    as living near the shore of the Atlantic Ocean, propagation-wise. There are certainly
    a lot of other factors involved in any discussion of this nature. This may be
    difficult to conclusively prove one way or the other, and certainly merits some
    systematic investigation.


    In later chapters we''ll discuss more specific methods one can take advantage
    of one''s local and not-so-local ground conditions. We trust that this introductory
    chapter on the subject shows that since most of us operate quite close to the
    Earth, the properties of the Earth itself have profound effects on most of what
    we do as radio amateurs.'
