- img_proc: true
  md: 'amateurs wanting to get on the air as quickly as possible. Most hams could
    get a wire antenna 30 feet or so into the air, suspended by a couple of appropriately
    spaced trees, typically by bribing a younger sibling to risk life and limb (both
    of the tree and his own) to climb up and tie off the ends of the antenna to a
    couple of accommodating branches.


    This is actually a rather effective arrangement, for a number of reasons. The
    effective radiation resistance of a dipole over real ground is the product of
    its free space resistance (theoretically 72 Ω) and the contribution of the ground
    reflected signal. This ground reflected signal is dependent on both reflectivity
    of the ground and the effective height.


    Interestingly enough, at 1/wavelength, the radiation resistance for both the perfect
    ground state and the real world ground state is nearly identical, and quite close
    to 72 Ω. This is shown clearly in Figure 12.1. As a result, the antenna presents
    a good impedance match to every modern transmitter with any length of coaxial
    cable.


    In addition, the horizontal radiation pattern, resulting from both the direct
    radiation and the ground reflection is a good compromise, giving a fair balance
    of low-angle radiation and high angle radiation. Some skeptics describe this general
    antenna as working “equally poorly in most directions, and not at all in others,”
    but it deserves more credit than that, actually. One surprising effect of the
    ground underneath the dipole is that it has radiation off the ends, but this radiation
    is vertically polarized! This is clearly shown in any NEC antenna modeling program,
    but born out in experience. Very few hams report perfect nulls (or even any deep
    nulls) from any direction (in azimuth) when using a simple HF dipole, which would
    certainly exist if in free space! (To be fair to the skeptics, this antenna does
    indeed show a deep null at very low elevation angles, nearly regardless of azimuth).
    But the overall analysis is that this is a pretty good antenna.'
