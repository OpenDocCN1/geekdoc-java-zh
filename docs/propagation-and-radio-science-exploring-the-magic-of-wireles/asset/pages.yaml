  md: '# Your Friend the S Meter


    Since about 1940 or so, radio amateurs have declared the standard signal strength
    meter, or S meter, to be obsolete. And yet, there hasn''t been a commercially
    made HF transceiver built since at least that time that hasn''t included an S
    with demonstrably identical characteristics as that of its predecessor of 70 years
    ago (Figure 17.1 and Figure 17.2).


    The fact that it''s been around for so long is a pretty good indication that the
    device was well conceived in the first place. Nobody''s come out with anything
    that''s demonstrably better when it comes to evaluating propagation conditions
    on a large scale. Let us look at the S meter in detail and show why it is still
    unswervingly useful in light of known ionospheric propagation characteristics.


    ![](img/59293a6d87bff070066bbaf783df6263_205_0.png)


    Figure 17.1 — The S meter of a classic National NC-109 receiver, with a full scale
    deflection of 40 dB over S9.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '![](img/59293a6d87bff070066bbaf783df6263_206_0.png)


    Figure 17.2 — A Heathkit HR-10 Meter, with a full scale deflection of 60 dB over
    S-9. Vintage receivers can have quite accurate S meters, providing they are calibrated
    at the frequency of operation. Modern receivers tend to have much more uniform
    response throughout the HF spectrum.


    # # An Old Standard


    The standard issue S meter incorporated on most amateur grade HF receivers and
    transceivers have fairly uniform characteristics. The S meter has a linear scale
    beginning at S-1 on the bottom end, and extending up to S-9 at about 2/3 scale.
    Above S-9, the meter has a logarithmic scale with divisions in terms of decibels
    over S-9, generally in increments of 10 dB. The greatest variation in S meters
    is typically where the meter tops out. Older communications such as the semi-venerable
    Hallcrafters SX-100 had a scale that went up to +80 dB. Most modern transceivers
    are a bit more pessimistic at the top end, often no higher than +50 dB or +60
    dB.


    With a well calibrated S meter, each S unit below S-9 represents a change of 6
    dB, or a halving of antenna voltage. One interesting feature of this arrangement
    is that below S-9, the meter is indicative of *voltage*, while above S-9, it is
    indicative of *power*.'
