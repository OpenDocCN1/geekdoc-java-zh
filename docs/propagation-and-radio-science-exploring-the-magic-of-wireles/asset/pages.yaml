  md: '# Forgiven


    Most hams can be forgiven for not knowing anything about the circular polarized
    nature of HF signals (at least before they read this book). CPOL signals can be
    received on linearly polarized antennas just fine, and unless you''re actually
    looking for such things as X and O rays, you can go a long time without noticing
    them! In fact, if it weren''t for the optics folks, we might still have no clue
    about the characteristic rays of the ionosphere. Ionospheric physicists discovered
    X and O mode propagation because they were looking for it! The principles of birefringence
    were known long before experiments with crystals and magnets and polarized candle
    light.


    # Not So Random


    For many decades, the “wisdom” in Amateur Radio was that the polarization of HF
    antennas didn''t matter because HF reflected signals were “randomly” polarized
    anyway. While it is true, statistically speaking, a randomly polarized signal
    can be received some of the time on a randomly polarized antenna, the actual results
    are generally much better than this can account for.


    The fact of the matter is that vertical or horizontal antennas work pretty doggone
    most of the time for HF signals of any origin. This can only be true if the signals
    are essentially circularly polarized, which an antenna of any polarization can
    respond to well. Again, we may have a 3 dB loss over a properly polarized CPOL
    antenna, but a lot of other factors can account for a lot more than that. It is
    indeed the fact that X and O modes exist that makes Amateur Radio as forgiving
    as it is!


    # Getting Flighty


    One tool that the professional HF scientists have that (at least directly) is
    the ionosonde. Because an ionosonde is a radar, it can derive time-of-flight information
    that is not readily available to “normal” Amateur Radio methodology. Because the
    virtual heights of X and O mode reflections are significantly different, they
    show up very clearly as double traces on an ionosonde, even without the use of
    a CPOL receiving antennas. Early scientific researchers saw these double traces
    and immediately'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'suspected X and O modes...because such things were already available on their

    “radar”! All it took was a CPOL receiving antenna to confirm their

    suspicion.


    # Both


    A vertical incident ionosonde is one of the few cases where you’ll see the

    X and O mode rays at the same place. In such an instance, they haven’t

    traveled far enough to diverge very far, and since the receiving antennas are

    pretty wide-beamed, they can still “see” the X and O modes from

    essentially the same place. This is not likely to happen for typical amateur

    DX operation, though both the X and O modes can be available at the same

    Alaska, for instance), both (common in Interior

    receiver. So the obvious question is, what happens if an X and O mode

    signal are picked up by the same antenna at the same time?


    On the practical side, this is never going to happen. As we’ve just

    discussed, the time of flight of the X and O signals is different, so if

    you receive them both on the same antenna, they wouldn''t sound like a

    very short-term echo...actually a rather common occurrence for NVIS

    operation. The typical “hollow, reverb-y” sound of many NVIS signals are

    do the slight time delay between the X and O mode signal arrivals —

    generally on the order of a few milliseconds.


    On the purely theoretical, ideal side of this, here’s what happens. If an X

    and O signal of equal intensity arrive at precisely the same time on a

    linearly polarized antenna, they will precisely cancel out; you will get

    nothing. On the other hand, if you are using a CPOL antenna, you will only

    receive the ray for which your antenna is matched (of the same sense).


    # You Send Me


    Here’s something to ruminate on. We have described how linearly

    polarized signal becomes circularly polarized upon entering the ionosphere,

    splitting into both an X and O mode ray. What happens if we start out with

    c circularly polarized signal?


    As it turns out, under most cases, the signal will remain whatever it

    started out in. If you transmit an X mode signal, it tends to stay X mode'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'throughout its journey. If you transmit O mode signal, it tends to stay that
    way too. We can already hear the collective gears grinding within thousands of
    amateurs'' heads as we mention this. Does this mean we can use polarization to
    actually steer our signals? Absolutely! Now, it should be evident that you don''t
    have quite as many options here. A signal can be either X or O, it can''t be of
    anything in between. So if you launch an X signal, or an O signal, it will follow
    the normal X path (for a given set of conditions, of course). Are we having fun
    yet?


    # Dealing with Reversals


    We''ll conclude with a phenomenon that actually has nothing to do with propagation,
    but with some simple...well, moderately so....Geometry This is something you need
    to consider if plan on going whole hog with circular polarization on HF


    When you transmit a right hand CPOL signal through free space, the antenna at
    the receiving end has to be left hand CPOL. (VHF folks know all about.) You can
    easily demonstrate this by taking two wood screws and aiming them at each other
    point-to-point. Which way do you have to turn the screw to make it go forward?
    Which way do you have to turn it to make it come toward...as in the case of an
    incoming signal? What this means is if you''re set up for CPOL, either you want
    to use a separate receiving antenna of the correct sense (the ideal case), or
    have a sense reversing relay tied to your push to talk circuitry, in the case
    of a single antenna for transmit and receive.


    # Try this at Home


    This chapter on X and O modes is certainly not the last word on the topic. It
    is our sincere desire that we have encouraged you to experiment with these fascinating
    modes. It''s one of the areas available for us to make meaningful strides toward
    “advancing the state of the radio art,” which is what we''re all called to do
    in some capacity.'
