    \n## 联系列表（Contact List）\n\n哈希表将存储姓名和电话号码。\n\n## 哈希表\n\n哈希表（也称为哈希表）是一种根据键高效组织和检索数据结构。哈希表通常使用链法来处理这些冲突。\n\
    \n## 解决方案（Proposed Solution）\n\n这是使用的类的定义：\n\n```java\nclass Contact {\n    public\
    \ String name;\n    public String phone;\n    public Contact next;\n\n    public\
    \ Contact() {\n        this.name = null;\n        this.phone = null;\n       \
    \ this.next = null;\n    }\n}\n\npublic class ContactList {\n    private static\
    \ final int HASH_SIZE = 100;\n    private Contact[] bucketTable;\n}\n```\n列表 4-1:\
    \ `ContactList.java`\n\n`ContactList` 类包含一个 100 个条目的表。每个条目包含一个 `Contact` 对象的引用。本质上，`ContactList`\
    \ 类是链表的数组；通过这种方式，联系列表可以随着我们添加元素而扩展。\n\n联系人根据其特定的哈希值插入到桶中。我们将使用哈希函数根据联系字符串创建一个\
    \ 0 到 99 之间的数字：\n\n```java\nprivate int hash(String name) {\n    int hash = 5381;\n\
    \    for (int i = 0; i < name.length(); i++) {\n        hash = ((hash << 5) +\
    \ hash) + name.charAt(i);\n    } \n    return Math.abs(hash) % HASH_SIZE;\n}\n\
    ```\n列表 4-2: `ContactList.java`\n\n此方法基于 Daniel J. Bernstein 编写哈希函数（也称为 dj2）。该方法返回哈希表的索引，我们应该在那里插入特定的联系人。\n\
    \n在类构造函数中我们将桶初始化为 `null`：\n\n```java\npublic ContactList() {\n    bucketTable\
    \ = new Contact[HASH_SIZE];\n    for (int i = 0; i < HASH_SIZE; i++) {\n     \
    \   bucketTable[i] = null;\n    }\n}\n```\n列表 4-3: `ContactList.java`\n\n我们首先根据联系人的计算哈希索引，然后创建一个新的\
    \ `Contact` 对象。在填充对象属性后，我们将对象插入到相应桶的头部。以下是添加联系人的代码：\n\n```java\npublic void contactAdd(String\
    \ name, String phone) {\n    //根据联系姓名获取索引\n    int hashIndex = hash(name);\n \
    \   Contact newContact = new Contact();\n    newContact.name = name;\n    newContact.phone\
    \ = phone;\n    newContact.next = bucketTable[hashIndex];\n    bucketTable[hashIndex]\
    \ = newContact;\n}\n```\n列表 4-4: `ContactList.java`\n"
