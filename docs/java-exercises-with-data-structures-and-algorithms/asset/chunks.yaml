  trans: "\n\n![](img/image_rsrc5RM.jpg)\n\n# 数据结构与算法 Java 练习\n\nISBN: 9798325955266\n\
    Copyright © 2024 Haris Tsetsekas\n\n## 目录\n\n1. 大学课程\n2. 餐厅预约\n3. 图书馆\n4. 联系列表\n\
    5. 优先级待办事项\n6. 歌曲列表\n7. 任务分配\n8. 词频统计\n9. 语法检查器\n10. 迷宫求解器\n11. 文件索引器\n12. 基于\
    \ AVL 树的库存\n13. 社交网络\n14. 航班\n15. MNIST 图像比较\n16. 带缓存的 HTTP 服务器\n17. 分布式拍卖\n\n\
    ## 1. 大学课程\n\n让我们创建一个处理大学课程选课的程序。每门课程都有一个或多个先修课程，即学生必须完成这些课程后才能修读特定的特定课程。\n\n\
    ### 建议的解决方案\n\n首先，我们将为大学中的学生定义类：\n\n```java\npackage UniversityCourses;\npublic\
    \ class Student {\n    public int id;\n    public String name;\n    public int[]\
    \ courses;\n    public int courseCount;\n    public Student(int id, String name,\
    \ int courseCount, int[] courses) {\n        this.id = id;\n        this.name\
    \ = name;\n        this.courseCount = courseCount;\n        this.courses = courses;\n\
    \    }\n}\n```\n列表 1-1: Student.java\n\n该类包含关于学生及其已成功完成课程的信息。`Courses` 数组包含课程的\
    \ ID。\n\n接下来，我们为大学课程定义一个类：\n\n```java\npackage UniversityCourses;\npublic class\
    \ Course {\n    public int id;\n    public String name;\n    public int prereqCount;\n\
    \    public int[] prereqIDs;\n    public Course(int id, String name, int prereqCount,\
    \ int[] prereqIDs) {\n        this.id = id;\n        this.name = name;\n     \
    \   this.prereqCount = prereqCount;\n        this.prereqIDs = prereqIDs;\n   \
    \ }\n    public boolean canEnroll(Student student) {\n        for (int prereqId\
    \ : this.prereqIDs) {\n            boolean hasPrereq = false;\n            for\
    \ (int courseId : student.courses) {\n                if (courseId == prereqId)\
    \ {\n                    hasPrereq = true;\n                    break;\n     \
    \           }\n            }\n            if (!hasPrereq) {\n                return\
    \ false;\n            }\n        }\n        return true;\n    }\n}\n```\n列表 1-2:\
    \ Course.java\n\n每门课程包含一个先修课程 ID 数组。该类还包含一个方法，用于判断学生是否可以选某门课程。对于每门先修课程，该方法都会尝试与学生已修过的课程进行匹配。\n\
    \n最后，是 `main()` 方法：\n\n```java\npackage UniversityCourses;\npublic class UniversityCourses\
    \ {\n    public static void main(String[] args) {\n        Course[] courses =\
    \ {\n            new Course(0, \"Intro to Programming\", 0, new int[] { -1 }),\n\
    \            new Course(1, \"Data Structures\", 1, new int[] { 0 }),\n       \
    \     new Course(2, \"Algorithms\", 1, new int[] { 1 }),\n            new Course(3,\
    \ \"Database Management\", 1, new int[] { 0 }),\n            new Course(4, \"\
    Web Development\", 1, new int[] { 0 }),\n            new Course(5, \"Operating\
    \ Systems\", 2, new int[] { 1, 2 }),\n            new Course(6, \"Computer Networks\"\
    , 2, new int[] { 1, 5 }),\n            new Course(7, \"Software Engineering\"\
    , 2, new int[] { 1, 2 }),\n            new Course(8, \"Machine Learning\", 2,\
    \ new int[] { 1, 2 }),\n            new Course(9, \"Distributed Systems\", 1,\
    \ new int[] { 5 }),\n            new Course(10, \"Cybersecurity\", 2, new int[]\
    \ { 2, 3 }),\n            new Course(11, \"Cloud Computing\", 2, new int[] { 2,\
    \ 3 }),\n            new Course(12, \"Mobile App Development\", 1, new int[] {\
    \ 4 }),\n            new Course(13, \"Game Development\", 1, new int[] { 4 }),\n\
    \            new Course(14, \"Artificial Intelligence\", 2, new int[] { 2, 3 }),\n\
    \            new Course(15, \"Big Data Analytics\", 2, new int[] { 2, 3 }),\n\
    \            new Course(16, \"Blockchain Technology\", 2, new int[] { 2, 3 }),\n\
    \            new Course(17, \"UI/UX Design\", 2, new int[] { 2, 3 }),\n      \
    \      new Course(18, \"Embedded Systems\", 2, new int[] { 2, 3 }),\n        \
    \    new Course(19, \"Computer Graphics\", 2, new int[] { 2, 3 })\n        };\n\
    \        Student student = new Student(1, \"John Doe\", 2, new int[] {0, 1});\n\
    \        for (Course course : courses) {\n            if (course.canEnroll(student))\
    \ {\n                System.out.println(\"- Can enroll in \" + course.name);\n\
    \            } else {\n                System.out.println(\"- Cannot enroll in\
    \ \" + course.name + \" due to missing prerequisites.\");\n            }\n   \
    \     }\n    }\n}\n```\n列表 1-3: UniversityCourses.java\n\n## 2. 餐厅预约\n\n对于这个练习，我们将创建一个处理预约的小程序。每张桌子以其容量为特征。简单来说，预约可以跨越多个时间段。\n\
    \n### 建议的解决方案\n\n首先，我们将为顾客定义类：\n\n```java\npackage Restaurant;\npublic class Customer\
    \ {\n    public String name;\n    public Customer(String name) {\n        this.name\
    \ = name;\n    }\n}\n```\n列表 2-1: Customer.java\n\n该类包含姓名。它也可以包含电话或其他详情。\n\n接下来，我们为餐厅桌子定义类：\n\
    \n```java\npackage Restaurant;\npublic class Table {\n    public int id;\n   \
    \ public int capacity;\n    public Table(int id, int capacity) {\n        this.id\
    \ = id;\n        this.capacity = capacity;\n    }\n}\n```\n列表 2-2: Table.java\n\
    \n桌子对象包含其 ID 以及其容量信息（可以容纳的人数）。\n\n接下来，我们定义 `Reservation` 类：\n\n```java\npackage\
    \ Restaurant;\npublic class Reservation {\n    public Customer customer;\n   \
    \ public Table table;\n    public int startTimeSlot;\n    public int endTimeSlot;\n\
    \    public Reservation(Customer customer, Table table, int startTimeSlot, int\
    \ endTimeSlot) {\n        this.customer = customer;\n        this.table = table;\n\
    \        this.startTimeSlot = startTimeSlot;\n        this.endTimeSlot = endTimeSlot;\n\
    \    }\n}\n```\n列表 2-3: Reservation.java\n\n预约包含对 `Customer` 和 `Table` 对象的引用。它还包含起始和结束时间段（不包含结束）。\n\
    \n我们还创建一个 `Restaurant` 类来实现创建新预约的功能：\n\n```java\npackage Restaurant;\nimport java.util.ArrayList;\n\
    import java.util.List;\n\npublic class Restaurant {\n    private final List<Table>\
    \ tables = new ArrayList<>();\n    private final List<Reservation> reservations\
    \ = new ArrayList<>();\n\n    public void addTable(Table table) {\n        tables.add(table);\n\
    \    }\n}\n```\n列表 2-4: Restaurant.java\n\n`addTable()` 方法将桌子的引用添加到 `tables` 列表中。\n\
    \n在 `isTableAvailable()` 方法中，我们从 `reservations` 列表中获取一个流。我们使用流的 `noneMatch()`\
    \ 方法来判断在指定时间段内是否存在未被预约的桌子。\n\n```java\npublic boolean isTableAvailable(Table table,\
    \ int startTimeSlot, int endTimeSlot) {\n    return reservations.stream().noneMatch(reservation\
    \ ->\n        reservation.table.id == table.id &&\n        ((startTimeSlot >=\
    \ reservation.startTimeSlot && startTimeSlot < reservation.endTimeSlot) ||\n \
    \        (endTimeSlot > reservation.startTimeSlot && endTimeSlot <= reservation.endTimeSlot)\
    \ ||\n         (startTimeSlot <= reservation.startTimeSlot && endTimeSlot >= reservation.endTimeSlot))\n\
    \    );\n}\n```\n列表 2-5: Restaurant.java\n\n"
- fmt: "\nMethod `findAvailableTables()` searches the stream obtained from the `tables`\
