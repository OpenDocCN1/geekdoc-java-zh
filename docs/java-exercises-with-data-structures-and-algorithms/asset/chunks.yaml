- fmt: "\n![](image_rsrc5RM.jpg)\n\n# Java Exercises with Data Structures and Algorithms\n\
    \nISBN: 9798325955266\nCopyright © 2024 by Haris Tsetsekas\n\n## Table of Contents\n\
    \n1. [University Courses](#part0003.xhtml_a5M0)\n2. [Restaurant Reservations](#part0004.xhtml_a5M1)\n\
    3. [Library](#part0005.xhtml_a5M2)\n4. [Contact List](#part0006.xhtml_a5M3)\n\
    5. [Priority Todo List](#part0007.xhtml_a5M4)\n6. [Songs List](#part0008.xhtml_a5M5)\n\
    7. [Task allocation](#part0009.xhtml_a5M6)\n8. [Word Frequencies](#part0010.xhtml_a5M7)\n\
    9. [Syntax Checker](#part0011.xhtml_a5M8)\n10. [Maze Solver](#part0012.xhtml_a5M9)\n\
    11. [File Indexer](#part0013.xhtml_a5MA)\n12. [Inventory with AVL Tree](#part0014.xhtml_a5MB)\n\
    13. [Social Network](#part0015.xhtml_a5MC)\n14. [Flights](#part0016.xhtml_a5MD)\n\
    15. [MNIST Image Comparison](#part0017.xhtml_a5ME)\n16. [HTTP Server with Caching](#part0018.xhtml_a5MF)\n\
    17. [Distributed Auction](#part0019.xhtml_a5MG)\n\n## 1. University Courses\n\n\
    Let’s create a program that will handle the enrollment for university courses.\
    \ Each course has one or more prerequisites, i.e. courses that must have been\
    \ completed by a student in order to be able to enroll in the specific one.\n\n\
    ### Proposed Solution\n\nFirst of all, we will define the class for a student\
    \ in the university:\n\n```java\npackage UniversityCourses;\npublic class Student\
    \ {\n    public int id;\n    public String name;\n    public int[] courses;\n\
    \    public int courseCount;\n    public Student(int id, String name, int courseCount,\
    \ int[] courses) {\n        this.id = id;\n        this.name = name;\n       \
    \ this.courseCount = courseCount;\n        this.courses = courses;\n    }\n}\n\
    ```\nListing 1-1: Student.java\n\nThis class contains information about the student\
    \ and the courses that have been completed successfully. The `Courses` array contains\
    \ the ID of the course.\n\nNext, we define a class for the university courses:\n\
    \n```java\npackage UniversityCourses;\npublic class Course {\n    public int id;\n\
    \    public String name;\n    public int prereqCount;\n    public int[] prereqIDs;\n\
    \    public Course(int id, String name, int prereqCount, int[] prereqIDs) {\n\
    \        this.id = id;\n        this.name = name;\n        this.prereqCount =\
    \ prereqCount;\n        this.prereqIDs = prereqIDs;\n    }\n    public boolean\
    \ canEnroll(Student student) {\n        for (int prereqId : this.prereqIDs) {\n\
    \            boolean hasPrereq = false;\n            for (int courseId : student.courses)\
    \ {\n                if (courseId == prereqId) {\n                    hasPrereq\
    \ = true;\n                    break;\n                }\n            }\n    \
    \        if (!hasPrereq) {\n                return false;\n            }\n   \
    \     }\n        return true;\n    }\n}\n```\nListing 1-2: Course.java\n\nEach\
    \ course contains an array of the IDs of the prerequisite courses. The class also\
    \ includes a method that finds out whether a student can enroll at a course. For\
    \ each prerequisite course, this method tries to match it with a course already\
    \ taken by the student.\n\nFinally, the `main()` method:\n\n```java\npackage UniversityCourses;\n\
    public class UniversityCourses {\n    public static void main(String[] args) {\n\
    \        Course[] courses = {\n            new Course(0, \"Intro to Programming\"\
    , 0, new int[] { -1 }),\n            new Course(1, \"Data Structures\", 1, new\
    \ int[] { 0 }),\n            new Course(2, \"Algorithms\", 1, new int[] { 1 }),\n\
    \            new Course(3, \"Database Management\", 1, new int[] { 0 }),\n   \
    \         new Course(4, \"Web Development\", 1, new int[] { 0 }),\n          \
    \  new Course(5, \"Operating Systems\", 2, new int[] { 1, 2 }),\n            new\
    \ Course(6, \"Computer Networks\", 2, new int[] { 1, 5 }),\n            new Course(7,\
    \ \"Software Engineering\", 2, new int[] { 1, 2 }),\n            new Course(8,\
    \ \"Machine Learning\", 2, new int[] { 1, 2 }),\n            new Course(9, \"\
    Distributed Systems\", 1, new int[] { 5 }),\n            new Course(10, \"Cybersecurity\"\
    , 2, new int[] { 2, 3 }),\n            new Course(11, \"Cloud Computing\", 2,\
    \ new int[] { 2, 3 }),\n            new Course(12, \"Mobile App Development\"\
    , 1, new int[] { 4 }),\n            new Course(13, \"Game Development\", 1, new\
    \ int[] { 0 }),\n            new Course(14, \"Artificial Intelligence\", 2, new\
    \ int[] { 2, 8 }),\n            new Course(15, \"Big Data Analytics\", 2, new\
    \ int[] { 2, 3 }),\n            new Course(16, \"Blockchain Technology\", 2, new\
    \ int[] { 2, 3 }),\n            new Course(17, \"UI/UX Design\", 2, new int[]\
    \ {}\n            new Course(18, \"Embedded Systems\", 2, new int[] {}\n     \
    \       new Course(19, \"Computer Graphics\", 1, new int[] {})\n        };\n \
    \       Student student = new Student(1, \"John Doe\", 4, new int[] {0, 1, 2,\
    \ 3});\n        for (int i = 0; i < courses.length; i++) {\n            if (courses[i].canEnroll(student))\
    \ {\n                System.out.println(\"- Can enroll in \" + courses[i].name);\n\
    \            } else {\n                System.out.println(\"- Cannot enroll in\
    \ \" + courses[i].name + \" due to missing prerequisites.\");\n            }\n\
    \        }\n    }\n}\n```\nListing 1-3: UniversityCourses.java\n\n## 2. Restaurant\
    \ Reservations\n\nFor this exercise, we will create a small program that will\
    \ create reservations. Each table is characterized by its capacity. For simplicity,\
    \ a reservation can span multiple slots.\n\n### Proposed Solution\n\nFirst of\
    \ all, we will define the class for a customer:\n\n```java\npackage Restaurant;\n\
    public class Customer {\n    public String name;\n    public Customer(String name)\
    \ {\n        this.name = name;\n    }\n}\n```\nListing 2-1: Customer.java\n\n\
    This class contains the name. It could also include the phone number or other\
    \ details.\n\nNext, we define a class for the restaurant tables:\n\n```java\n\
    package Restaurant;\npublic class Table {\n    public int id;\n    public int\
    \ capacity;\n    public Table(int id, int capacity) {\n        this.id = id;\n\
    \        this.capacity = capacity;\n    }\n}\n```\nListing 2-2: Table.java\n\n\
    Each table object its ID as well as information about its capacity (the number\
    \ of people it can accommodate).\n\nNext, we define the `Reservation` class:\n\
    \n```java\npackage Restaurant;\npublic class Reservation {\n    public Customer\
    \ customer;\n    public Table table;\n    public int startTimeSlot;\n    public\
    \ int endTimeSlot;\n    public Reservation(Customer customer, Table table, int\
    \ startTimeSlot, int endTimeSlot) {\n        this.customer = customer;\n     \
    \   this.table = table;\n        this.startTimeSlot = startTimeSlot;\n       \
    \ this.endTimeSlot = endTimeSlot;\n    }\n}\n```\nListing 2-3: Reservation.java\n\
    \nEach reservation contains references to `Customer` and `Table` objects. It also\
    \ contains the starting and ending time slot (not inclusive).\n\nWe also create\
    \ a `Restaurant` class that will implement the functionality for the creation\
    \ of new reservations:\n\n```java\npackage Restaurant;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport java.util.stream.Collectors;\n\npublic class Restaurant\
    \ {\n    private final List<Table> tables = new ArrayList<>();\n    private final\
    \ List<Reservation> reservations = new ArrayList<>();\n\n    public void addTable(Table\
    \ table) {\n        tables.add(table);\n    }\n}\n```\nListing 2-4: Restaurant.java\n\
    \nMethod `addTable()` adds the reference of a table into the `tables` list.\n\n\
    In method `isTableAvailable()` we use a stream that we obtain from the `reservations`\
    \ list. We use the `noneMatch()` method of the stream to determine if there exists\
    \ a table that is not reserved in the specified timeslot.\n\n```java\npublic boolean\
    \ isTableAvailable(Table table, int startTimeSlot, int endTimeSlot) {\n    return\
    \ reservations.stream().noneMatch(reservation ->\n        reservation.table.id\
    \ == table.id &&\n        ((startTimeSlot >= reservation.startTimeSlot && startTimeSlot\
    \ < reservation.endTimeSlot) ||\n         (endTimeSlot > reservation.startTimeSlot\
    \ && endTimeSlot <= reservation.endTimeSlot) ||\n         (startTimeSlot <= reservation.startTimeSlot\
    \ && endTimeSlot >= reservation.endTimeSlot))\n    );\n}\n```\nListing 2-5: Restaurant.java\n"
