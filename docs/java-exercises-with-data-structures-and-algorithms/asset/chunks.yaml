    \    }\n            } catch (NumberFormatException e) {\n                System.out.println(\"\
    Invalid input. Please enter a number.\");\n            }\n        } while (choice\
    \ != 0);\n        scanner.close();\n    }\n}\n```\nListing 5-1: `Todo.java`\n\n\
    `main` 方法处理用户输入并调用链表的相应方法。\n\n这里是 `Task` 类的定义：\n\n```java\npackage Todo;\npublic\
    \ class Task {\n    public String description;\n    public int priority;\n   \
    \ public Task next;\n    public Task() {\n    }\n}\n```\nListing 5-2: `Task.java`\n\
    \n链表由 `Task` 节点组成。`head` 变量指向链表的头部：\n\n```java\npackage Todo;\npublic class TodoList\
    \ {\n    private Task head;\n    private int size;\n\n    public TodoList() {\n\
    ```\nListing 5-3: `TodoList.java`\n\n构造函数初始化链表结构。\n\n`addTask()` 方法创建一个新节点并将其插入链表末尾：\n\
    \n```java\npublic void addTask(String description, int priority) {\n    Task task\
    \ = new Task();\n    task.description = description;\n    task.priority = priority;\n\
    \    task.next = null;\n\n    if (head == null) {\n        // List is empty\n\
    \        head = task;\n    } else {\n        Task temp = head;\n        // Find\
    \ the last node\n        while (temp.next != null) {\n            temp = temp.next;\n\
    \        }\n        // Insert the task after the last node\n        temp.next\
    \ = task;\n    }\n    size++;\n}\n```\nListing 5-4: `TodoList.java`\n\n接下来，我们定义\
    \ `removeTask()` 方法：\n\n```java\npublic void removeTask(int index) {\n    if (head\
    \ == null) {\n        System.out.println(\"List is empty.\");\n        return;\n\
    \    }\n    if (index == 0) {\n        // We remove the first item in the list\n\
    \        Task temp = head;\n        head = head.next;\n        temp = null;\n\
    \        size--;\n        return;\n    }\n\n    Task previous = null;\n    Task\
    \ current = head;\n    int i = 0;\n    // Go to selected index\n    while (current\
    \ != null && i < index) {\n        previous = current;\n        current = current.next;\n\
    \        i++;\n    }\n    if (current == null) {\n        System.out.println(\"\
    Index out of bounds.\");\n        return;\n    }\n    previous.next = current.next;\n\
    \    current = null;\n    size--;\n}\n```\nListing 5-5: `TodoList.java`\n\n待办事项列表的参数是链表中的索引，我们在任务列表期间显示。\n\
    \n这里是任务列表的代码：\n\n```java\npublic void displayTasks() {\n    Task temp = head;\n\
    \    int i = 1;\n    while (temp != null) {\n        System.out.println(i++ +\
    \ \") Description: \" + temp.description+ \", Priority: \" + temp.priority);\n\
    \        temp = temp.next;\n    }\n}\n```\nListing 5-6: `TodoList.java`\n\n最后，我们展示根据优先级排序任务的代码：\n\
    \n```java\npublic void sortTasks() {\n    int swapped;\n    Task ptr1;\n    Task\
    \ ptr2 = null;\n    if (head == null) return;\n    do {\n        swapped = 0;\
    \ // will change if swapping happens\n        ptr1 = head;\n        while (ptr1.next\
    \ != ptr2) {\n            // Swap data of adjacent nodes\n            if (ptr1.priority\
    \ > ptr1.next.priority) {\n                int tempPriority = ptr1.priority;\n\
    \                ptr1.priority = ptr1.next.priority;\n                ptr1.next.priority\
    \ = tempPriority;\n\n                String tempDescription = ptr1.description;\n\
    \                ptr1.description = ptr1.next.description;\n                ptr1.next.description\
    \ = tempDescription;\n                swapped = 1; //swap happened in this loop\
    \ pass; don't stop yet\n            }\n            ptr1 = ptr1.next;\n       \
    \ }\n        ptr2 = ptr1;\n    } while (swapped != 0); //quit loop when no swap\
    \ happened\n}\n```\nListing 5-7: `TodoList.java`\n\n代码采用冒泡排序算法执行任务排序操作。在冒泡排序中，我们对链表进行多次遍历。每当我们发现一个任务的优先级低于下一个任务时，就会对这些相邻任务进行交换。随着时间的推移，所有条目将根据优先级进行排序，最终会出现一次没有发生交换的循环。这就是算法结束的时候。\n\
    \n# 6.        歌曲列表\n\n我们将创建一个简单的程序，接收一个歌曲数组并按照艺术家、专辑或发行日期对其排序，使用插入排序。\n\n"
