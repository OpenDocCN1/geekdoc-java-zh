  trans: "\n完成完成后，我们使用上一个节点映射中存储的信息重构从源点到终点的最短路径，从而确定路线的总价格。\n\n为了避免在图的遍历过程中陷入无限循环，我们记录了当前路径中访问过的城市（`dist\
    \ map`）。如果某个城市在当前路径中已经被访问过，我们将跳过从该城市出发的航班搜索，以防止环路。\n\n我们可以使用深度优先搜索 (DFS) 计算并打印两个城市之间所有可能的航班：\n\
    \n```java\n//Display all possible flights between two cities using DFS\npublic\
    \ void displayAllFlights(String src, String dest) {\n    if (!cities.containsKey(src)\
    \ || !cities.containsKey(dest)) {\n        System.out.println(\"Invalid cities\
    \ entered.\");\n        return;\n    }\n\n    Set<String> visited = new HashSet<>();\n\
    \    Stack<String> path = new Stack<>();\n    path.push(src);\n    dfs(src, dest,\
    \ visited, path);\n}\n```\nListing 14-5: `Flights.java`\n\n我们看到 `displayAllFlights()`\
    \ 方法调用了递归的 `dfs()` 方法：\n\n```java\n//Recursive DFS function to find all flights\
    \ between source and destination\nprivate void dfs(String src, String dest, Set<String>\
    \ visited, Stack<String> path) {\n    visited.add(src);\n    if (src.equals(dest))\
    \ {\n        printPath(path);\n    } else {\n        for (String flight : cities.get(src).flights.keySet())\
    \ {\n            if (!visited.contains(flight)) {\n                path.push(flight);\n\
    \                dfs(flight, dest, visited, path);\n                path.pop();\n\
    \            }\n        }\n    }\n    visited.remove(src);\n}\n```\nListing 14-6:\
    \ `Flights.java`\n\n`FlightGraph` 类中的 `dfs()` 方法通过递归实现深度优先搜索 (DFS)，用于在航班网络中寻找源城市和终点城市之间所有可能的航班。\n\
    \n它首先将当前城市标记为已访问，并检查它是否为终点城市。如果到达终点，则打印当前路径。否则，它将通过递归调用自身来探索所有尚未访问的邻居城市。\n\n在探索过程中，它将邻居城市推入\
    \ `path` 栈中，并继续搜索，直到探索完当前城市的所有可能路径，或者到达终点。\n\n在回溯时，它会将当前城市从 `path` 栈中移除并标记为未访问，以便探索其他替代路径。此过程不断重复，直到网络中的所有城市都经过探索。\n\
    \n我们使用上述栈在 `PrintPath()` 方法中打印最终路径：\n\n```java\n//Helper function to print a path\
    \ (stack content)\nprivate void printPath(Stack<String> path) {\n    System.out.println(String.join(\"\
    \ -> \", path));\n}\n```\nListing 14-7: `Flights.java`\n\n最后在 `main()` 中，我们向图中添加了城市和航班，并要求用户选择一对城市以计算最佳（最廉价）的航班组合：\n\
    \n```java\npublic static void main(String[] args) {\n    Scanner scanner = new\
    \ Scanner(System.in);\n    FlightGraph graph = new FlightGraph();\n    graph.addCity(\"\
    London\");\n    graph.addCity(\"Paris\");\n    graph.addCity(\"Berlin\");\n  \
    \  graph.addCity(\"Rome\");\n    graph.addCity(\"Madrid\");\n    graph.addCity(\"\
    Amsterdam\");\n    graph.addFlight(\"London\", \"Paris\", 100);\n    graph.addFlight(\"\
    London\", \"Berlin\", 150);\n    graph.addFlight(\"London\", \"Madrid\", 200);\n\
    \    graph.addFlight(\"Paris\", \"Berlin\", 120);\n    graph.addFlight(\"Paris\"\
    , \"Rome\", 180);\n    graph.addFlight(\"Berlin\", \"Rome\", 220);\n    graph.addFlight(\"\
    Madrid\", \"Rome\", 250);\n    graph.addFlight(\"Madrid\", \"Amsterdam\", 170);\n\
    \    graph.addFlight(\"Amsterdam\", \"Berlin\", 130);\n    System.out.print(\"\
    Enter departure city: \");\n    String departure = scanner.nextLine();\n    System.out.print(\"\
    Enter destination city: \");\n    String destination = scanner.nextLine();\n\n\
    \    //Display all possible flights\n    System.out.println(\"All possible flights\
    \ between \" + departure + \" and \" + destination + \":\");\n    graph.displayAllFlights(departure,\
    \ destination);\n\n    //Find the cheapest route and total price\n    Map<String,\
    \ Integer> dist = new HashMap<>();\n    List<String> route = graph.findCheapestRoute(departure,\
    \ destination, dist);\n    int totalPrice = dist.get(destination);\n\n    //Display\
