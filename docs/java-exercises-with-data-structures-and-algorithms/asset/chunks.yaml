    \ the linked list, as it is presented during task listing. As we will see in the\
    \ next snippet, we start listing tasks from 1, which is something we take into\
    \ account.\n\nHere is the code for the task listing:\n\n```java\npublic void displayTasks()\
    \ {\n    Task temp = head;\n    int i = 1;\n    while (temp != null) {\n     \
    \   System.out.println(i++ + \") Description: \" + temp.description+ \", Priority:\
    \ \" + temp.priority);\n        temp = temp.next;\n    }\n}\n```\nListing 5-6:\
    \ `TodoList.java`\n\nFinally, we present the code for the sorting of tasks according\
    \ to their priority:\n\n```java\npublic void sortTasks() {\n    int swapped;\n\
    \    Task ptr1;\n    Task ptr2 = null;\n    if (head == null) return;\n    do\
    \ {\n        swapped = 0; // will change if swapping happens\n        ptr1 = head;\n\
    \        while (ptr1.next != ptr2) {\n            // Swap data of adjacent nodes\n\
    \            if (ptr1.priority > ptr1.next.priority) {\n                int tempPriority\
    \ = ptr1.priority;\n                ptr1.priority = ptr1.next.priority;\n    \
    \            ptr1.next.priority = tempPriority;\n\n                String tempDescription\
    \ = ptr1.description;\n                ptr1.description = ptr1.next.description;\n\
    \                ptr1.next.description = tempDescription;\n                swapped\
    \ = 1; //swap happened in this loop pass; don't stop yet\n            }\n    \
    \        ptr1 = ptr1.next;\n        }\n        ptr2 = ptr1;\n    } while (swapped\
    \ != 0); //quit loop when no swap happened\n}\n```\nListing 5-7: `TodoList.java`\n\
    \nThe code employs the bubble sort algorithm to perform the task sorting operation.\
    \ In bubble sort, we perform multiple passes of the linked list. Each time we\
    \ find a task that has lower priority than its next task, then we perform swapping\
    \ of those adjacent tasks. Over time, all entries will be sorted according to\
    \ priority and there will eventually be a loop pass where no swapping will occur.\
    \ This is when the algorithm will end.\n\n# 6.         Songs List\n\nLet’s create\
    \ a simple program that takes an array of songs and sorts them by artist, album\
    \ or release date, using insertion sort.\n"
