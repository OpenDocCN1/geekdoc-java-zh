    \n遍历树意味着访问树中的每个节点，这是递归执行的，首先处理左分支，然后处理右分支。\n\n在树中搜索产品的工作方式类似：我们访问一个节点，并检查产品的 ID。如果它与搜索\
    \ ID 匹配，我们就打印产品详情并返回方法。否则，我们根据搜索 ID 递归地访问树的左分支或右分支。\n\n我们到为止定义的所有方法都是私有的。我们还定义了三个公共方法，它们将调用这些私有方法：\n\
    \n```java\npublic void insertProduct(Product product) {\n    root = insertProduct(root,\
    \ product);\n}\npublic void traverseTree() {\n    traverseTree(root);\n}\npublic\
    \ InventoryNode searchProduct(int id) {\n    return searchProduct(root, id);\n\
    }\n```\n列表 12-7：`Inventory.java`\n\n我们使用这种约定是因为具有相同名的私有方法（`insertProduct`、`traverseTree`\
    \ 和 `searchProduct`）会被递归调用。通过这种方式，我们为使用我们代码的程序员提供了一个整洁的接口。\n\n最后，这里 `main()` 方法：\n\
    \n```java\npublic static void main(String[] args) {\n    Inventory inv = new Inventory();\n\
    \    Product[] products = new Product[100];\n    Random random = new Random();\n\
