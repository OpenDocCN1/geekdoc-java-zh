    \ path) {\n            fileName = name;\n            filePath = path;\n      \
    \      left = null;\n            right = null;\n        }\n    }\n\n    private\
    \ Node root;\n    ... \n```\n\nListing 11-1: `FileIndexer.java`\n\nEach node of\
    \ the tree contains two strings, the file name and the file location. It also\
    \ contains references to the two children nodes.\n\nNext, we define a method to\
    \ insert a new node into the tree:\n\n```java\n//Insert node to tree\nprivate\
    \ void insertNode(String fileName, String filePath) {\n    //If the tree is empty,\
    \ insert node here\n    if (root == null) {\n        root = new Node(fileName,\
    \ filePath);\n        return;\n    }\n    //If not empty, then go down the tree\n\
    \    Node current = root;\n    while (true) {\n        if (fileName.compareTo(current.fileName)\
    \ < 0) {\n            if (current.left == null) {\n                current.left\
    \ = new Node(fileName, filePath);\n                return;\n            }\n  \
    \          current = current.left;\n        } else {\n            if (current.right\
    \ == null) {\n                current.right = new Node(fileName, filePath);\n\
    \                return;\n            }\n            current = current.right;\n\
    \        }\n    }\n}\n```\n\nListing 11-2: `FileIndexer.java`\n\nStarting from\
    \ the root of the tree, we move downwards to the left or to the right depending\
    \ on the inserted value.\n\nNext, we define the method that will recursively index\
    \ all files into the tree:\n\n```java\n//Index the specified directory\nprivate\
    \ void indexDirectoryHelper(String dirPath) {\n    //If it's not a directory,\
