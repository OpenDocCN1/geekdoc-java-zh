    \n# 13. Social Network\n\nA social network is essentially a graph of nodes that\
    \ depicts the users of the network with their connections. In this exercise, we\
    \ will create such a graph and we will implement the functionality to recommend\
    \ new friends according to a user’s current connections.\n\n## Proposed Solution\n\
    \nThere are various ways to implement the users’ graph, for example using sparse\
