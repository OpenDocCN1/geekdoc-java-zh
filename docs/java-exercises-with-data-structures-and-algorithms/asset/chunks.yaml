- fmt: "\nWe first try to find the requested book by reading all the entries from\
    \ the books file with `.lines().toArray(String[]::new)`. The book entries will\
    \ be stored in an array of strings. `String[]::new` is a function that makes new\
    \ `String` arrays. It will be called by `toArray()` in order to create the new\
    \ array.\n\nWe iterate this array and we split each entry into the book details\
    \ (title, author, availability). When we find the book (and if it is available),\
    \ we mark it as not currently available.\n\nAfterwards, we record the lending\
    \ event by writing a new entry at the end of the respective binary file. Finally,\
    \ we write all the entries in the array back to the books text file, overwriting\
    \ the file.\n\nNext, we present the functionality for returning a book:\n\n```java\n\
    public void returnBook() throws IOException {\n    if (!new File(LendingFilename).exists())\
    \ {\n        System.out.println(\"No lending events entered so far\");\n     \
    \   return;\n    }\n    String bookTitle;\n    Scanner scanner = new Scanner(System.in);\n\
