    \nUsers can index the contents of a folder and then they can search for a specific\
    \ filename.\n\n# 12. Inventory with AVL Tree\n\nIn this exercise, we will create\
    \ an inventory program, that will store information about the company’ products\
    \ in an AVL tree.\n\n## Proposed Solution\n\nAn AVL (Adelson-Velsky and Landis)\
