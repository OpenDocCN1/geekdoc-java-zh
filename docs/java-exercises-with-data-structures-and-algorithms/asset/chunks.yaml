    \        return rotateLeft(node);\n    }\n    return node;}\n```\n列表 12-5：`Inventory.java`\n\
    \n这里的思想是在向树插入新节点后检查树的平衡。如果树变得不平衡，我们必须向左或向右对其进行旋转。\n\n接下来，我们展示在打印树内容的同时遍历树的方法，以及在树中搜索特定产品代码：\n\
    \n```java\nprivate void traverseTree(InventoryNode node) {\n    if (node != null)\
