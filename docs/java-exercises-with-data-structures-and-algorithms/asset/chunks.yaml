    The `main` method handles the user input and calls the respective methods of the\
    \ todo list.\n\nHere is the definition of the `Task` class that makes the objects\
    \ of the linked list structure:\n\n```java\npackage Todo;\npublic class Task {\n\
    \    public String description;\n    public int priority;\n    public Task next;\n\
    \    public Task() {\n        this.description = null;\n        this.priority\
    \ = 0;\n        this.next = null;\n    }\n}\n```\nListing 5-2: `Task.java`\n\n\
    The linked list consists of `Task` nodes that get linked one to the other via\
    \ the `next` reference. The `head` variable points to the first element in the\
    \ list:\n\n```java\npackage Todo;\npublic class TodoList {\n    private Task head;\n\
    \    private int size;\n\n    public TodoList() {\n        head = null;\n    \
    \    size = 0;\n    }\n...\n```\nListing 5-3: `TodoList.java`\n\nThe class constructor\
    \ initializes the linked list structure.\n\nThe `addTask()` method creates a new\
    \ task node and inserts it at the end of the linked list:\n\n```java\npublic void\
    \ addTask(String description, int priority) {\n    Task task = new Task();\n \
    \   task.description = description;\n    task.priority = priority;\n    task.next\
    \ = null;\n\n    if (head == null) {\n        // List is empty\n        head =\
    \ task;\n    } else {\n        Task temp = head;\n        // Find the last node\n\
    \        while (temp.next != null) {\n            temp = temp.next;\n        }\n\
    \        // Insert the new task after the last node\n        temp.next = task;\n\
    \    }\n    size++;\n}\n```\nListing 5-4: `TodoList.java`\n\nNext, we define the\
    \ `removeTask()` method:\n\n```java\npublic void removeTask(int index) {\n   \
    \ if (head == null) {\n        System.out.println(\"List is empty.\");\n     \
    \   return;\n    }\n    if (index == 0) {\n        // If we remove the first item\
    \ in the list\n        Task temp = head;\n        head = head.next;\n        temp\
    \ = null;\n        size--;\n        return;\n    }\n\n    Task previous = null;\n\
    \    Task current = head;\n    int i = 0;\n    // Go to the selected index\n \
    \   while (current != null && i < index) {\n        previous = current;\n    \
    \    current = current.next;\n        i++;\n    }\n    if (current == null) {\n\
    \        System.out.println(\"Index out of bounds.\");\n        return;\n    }\n\
    \    previous.next = current.next;\n    current = null;\n    size--;\n}\n```\n\
