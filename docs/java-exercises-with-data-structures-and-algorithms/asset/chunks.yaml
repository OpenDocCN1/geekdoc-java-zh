    \ = new Product();\n        products[i].id = random.nextInt(1000);\n        products[i].name\
    \ = \"Product \" + i;\n        products[i].price = random.nextDouble() * 100;\n\
    \        products[i].quantity = random.nextInt(10);\n    }\n    for (Product p\
    \ : products) {\n        inv.insertProduct(p);\n    }\n    inv.traverseTree();\n\
    }\n```\n\n# 13 社交网络 (Social Network)\n\n社交网络本质上是一个表示用户及其连接的图。在这个练习中，我们将创建一个这样的图并实现根据用户推荐新朋友的功能。\n\
    \n## 解决方案\n\n有多种方法可以实现用户图，例如使用稀疏矩阵。在这里我们将使用单链表来构建图，其中存储了连接：\n\n```java\npackage\
    \ SocialNetwork;\nclass FriendNode {\n    public String name;\n    public FriendNode\
    \ next;\n    public FriendNode(String name) {\n        this.name = name;\n   \
    \     this.next = null;\n    }\n}\nclass User {\n    public String name;\n   \
    \ public FriendNode friends;\n\n    public User(String name) {\n        this.name\
    \ = name;\n        this.friends = null;\n    }\n}\n```\n列表 13-1：`SocialNetwork.java`\n\
    \n`User` 类包含了用户名称以及朋友的链表。\n\n接下来，我们定义了一个队列类，将用于推荐算法。为了学习目的，我们将自己实现队列，而不是使用 `java`\
    \ 包中的包：\n\n```java\nclass MyQueue {\n    private class QueueNode {\n        public\
    \ int userIndex;\n        public QueueNode next;\n        public QueueNode(int\
    \ userIndex) {\n            this.userIndex = userIndex;\n            this.next\
    \ = null;\n        }\n    }\n    private QueueNode front;\n    private QueueNode\
    \ rear;\n\n    public MyQueue() {\n        front = rear = null;\n    }\n\n   \
    \ public boolean isEmpty() {\n        return front == null;\n    }\n\n    public\
    \ void enqueue(int userIndex) {\n        QueueNode newNode = new QueueNode(userIndex);\n\
    \        if (isEmpty()) {\n            front = rear = newNode;\n        } else\
    \ {\n            rear.next = newNode;\n            rear = newNode;\n        }\n\
    \    }\n\n    public int dequeue() {\n        if (isEmpty()) {\n            System.out.println(\"\
    队列为空！\");\n            return -1;\n        }\n        int userIndex = front.userIndex;\n\
    \        front = front.next;\n        if (front == null) {\n            rear =\
    \ null;\n        }\n        return userIndex;\n    }\n}\n```\n列表 13-2：`SocialNetwork.java`\n\
    \n队列包含用户的索引，因为它们将出现在用户数组中（见下文 `Graph` 类）。\n\n"
- fmt: "\nNow, let’s see how we will insert users into the graph and how we will define\
    \ the connections with their friends. We define the `Graph` class, that essentially\
    \ contains an array of all the users of the social network:\n\n```java\nclass\
    \ Graph {\n    private static final int MAX_USERS = 100;\n    private User[] users;\n\
    \    private int numUsers;\n    public Graph() {\n        users = new User[MAX_USERS];\n\
    \        numUsers = 0;\n        ...\n    }\n}\n```\nListing 13-3: `SocialNetwork.java`\n\
    \nNext, we provide the functionality to add a new user to the graph:\n\n```java\n\
    public void addUser(String name) { \n    if (numUsers >= MAX_USERS) {\n      \
    \  System.out.println(\"Max user limit reached!\");\n        return;\n    }\n\
    \    users[numUsers] = new User(name);\n    numUsers++;\n}\n```\nListing 13-4:\
    \ `SocialNetwork.java`\n\nWe use the following method to add a new connection\
    \ to a user:\n\n```java\npublic void addConnection(int src, int dest) {\n    if\
    \ (src < 0 || src >= numUsers || dest < 0 || dest >= numUsers) {\n        System.out.println(\"\
    Invalid user index!\");\n        return;\n    }\n    //Add bidirectional connection\n\
    \    FriendNode newFriendSrc = new FriendNode(users[dest].name);\n    newFriendSrc.next\
    \ = users[src].friends;\n    users[src].friends = newFriendSrc;\n    FriendNode\
    \ newFriendDest = new FriendNode(users[src].name);\n    newFriendDest.next = users[dest].friends;\n\
    \    users[dest].friends = newFriendDest;\n}\n```\nListing 13-5: `SocialNetwork.java`\n\
    \nNote that when we add a new connection, we make it bidirectional. That is, we\
    \ insert a friend node for each one of the connection’s ends.\n\nNext, we proceed\
    \ to the more interesting stuff, the recommender method:\n\n```java\npublic void\
    \ recommendFriends(int userIndex) {\n    System.out.println(\"Recommended friends\
    \ for \" + users[userIndex].name + \":\");\n    // Store the indexes of the user’s\
    \ friends\n    MyQueue queue = new MyQueue();\n    // Store the persons that we\
    \ have already visited\n    boolean[] visited = new boolean[MAX_USERS];\n    visited[userIndex]\
    \ = true;\n    // Enqueue the starting user\n    queue.enqueue(userIndex);\n \
    \   while (!queue.isEmpty()) {\n        int currentUserIndex = queue.dequeue();\n\
    \        FriendNode current = users[currentUserIndex].friends;\n        // Traverse\
    \ the user's friends\n        while (current != null) {\n            int friendIndex\
    \ = -1;\n            // Find the friend's index\n            for (int i = 0; i\
    \ < numUsers; i++) {\n                if (current.name.equals(users[i].name))\
    \ {\n                    friendIndex = i;\n                    break;\n      \
    \          }\n            }\n            // Check if the friend is already visited\n\
    \            if (friendIndex != -1 && !visited[friendIndex]) {\n             \
    \   System.out.println(\"- \" + current.name);\n                // Add friend\
    \ to visited array\n                visited[friendIndex] = true;\n           \
    \     // Enqueue friend\n                queue.enqueue(friendIndex);\n       \
    \     }\n            // Move to the next friend\n            current = current.next;\n\
    \        }\n    }\n}\n```\nListing 13-6: `SocialNetwork.java`\n\nThe `recommendFriends()`\
    \ method uses breadth-first search (BFS) to traverse the social network graph,\
    \ starting from the specified user and visiting all connected users to recommend\
    \ friends. It marks users as visited (using the `visited[]` array) to avoid recommending\
    \ the same friend multiple times and enqueues each friend to ensure all potential\
    \ friends are discovered and recommended.\n\nThe BFS algorithm makes use of a\
    \ queue, where we store the indexes of the user’s friends as we follow the linked\
    \ list. We then use the queue to get the friends of the user’s friends, and in\
    \ this way, we are able to travel through the connections of the graph and find\
    \ all the connected people to the specific user.\n\nFinally, here is the `main()`\
    \ method:\n\n```java\npublic class SocialNetwork {\n    public static void main(String[]\
    \ args) {\n        Graph graph = new Graph();\n        graph.addUser(\"User A\"\
    );\n        graph.addUser(\"User B\");\n        graph.addUser(\"User C\");\n \
    \       graph.addUser(\"User D\");\n        graph.addUser(\"User E\");\n     \
    \   graph.addUser(\"User F\");\n        graph.addUser(\"User G\");\n        graph.addUser(\"\
    User H\");\n        graph.addConnection(0, 1);\n        graph.addConnection(1,\
    \ 2);\n        graph.addConnection(2, 3);\n        graph.addConnection(4, 5);\n\
    \        graph.addConnection(5, 7);\n        graph.addConnection(3, 6);\n    \
    \    graph.recommendFriends(0);\n        graph.recommendFriends(1);\n        graph.recommendFriends(7);\n\
    \    }\n}\n```\nListing 13-7: `SocialNetwork.java`\n\nIn `main()`, we add users\
    \ to the graph and we enter their friend connections. Then we run the algorithm\
    \ to get friend recommendations.\n\nYou can find this project in GitHub:\n\nhttps://github.com/htset/java_exercises_dsa/tree/master/SocialNetwork\n\
    \n# 14. Flights\n\nLet’s create a console application that will maintain a list\
    \ of flights between cities and that will find the best combination of flights\
    \ in terms of ticket cost.\n\n## Proposed Solution\n\nThis problem involves creating\
    \ a graph between the cities. This graph will be weighted, with the cost of the\
    \ respective ticket. We will use Dijkstra’s algorithm to find the cheapest path\
    \ between two of those cities.\n\nFirst, we define the `City` class that will\
    \ store a map of the connected cities and the respective costs:\n\n```java\npackage\
    \ Flights;\nimport java.util.*;\npublic class Flights {\n    // Structure to represent\
    \ each city\n    public static class City {\n        public String name;\n   \
    \     public Map<String, Integer> flights;\n        public City(String name) {\n\
    \            this.name = name;\n            this.flights = new HashMap<>();\n\
