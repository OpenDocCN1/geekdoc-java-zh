    Book '\" + bookTitle + \"' has been returned.\");\n                    break;\n\
    \                }\n            }\n            //Write lending events back to\
    \ file\n            try (PrintWriter lendingFile= new PrintWriter(new FileWriter(LendingFilename)))\
    \ {\n                for (String line : lendingLines) {\n                    lendingFile.println(line);\n\
    \                }\n            }\n            break;\n        }\n    }\n    if\
    \ (!bookFound) {\n        System.out.println(\"Book '\" + bookTitle + \"' not\
    \ found or already returned.\");\n    }\n    //Write books back to file\n    try\
    \ (PrintWriter file = new PrintWriter(new FileWriter(BooksFilename))) {\n    \
    \    for (String line : booksLines) {\n            file.println(line);\n     \
    \   }\n    }\n}\n```\nListing 3-7: `Library.java`\n\nHere, we read again all the\
    \ book file entries into an array of strings, and we try to find the requested\
    \ file. Then, we read all the book lending events from the respective file and\
    \ we search for the lending event of the specific book.\n\nIf we find the event,\
    \ then we change its status to “returned” and we write all the entries back to\
    \ the lending file. Finally, we also store all the book entries into the respective\
    \ file, after having changed the book availability status back to 1 again.\n\n\
    Now, let’s see the events listing method:\n\n```java\npublic void listLendingEvents()\
    \ throws IOException {\n    if (!new File(LendingFilename).exists()) {\n     \
    \   System.out.println(\"No lending events entered so far\");\n        return;\n\
    \    }\n    System.out.println(\"Lending events:\");\n    try (BufferedReader\
