    \ line;\n        while ((line = file.readLine()) != null) {\n            String[]\
    \ parts = line.split(\"\\\\|\");\n            System.out.println(\"Book Title:\
    \ \" + parts[0]);\n            System.out.println(\"User Name: \" + parts[1]);\n\
    \            System.out.println(\"Lending Date: \" + parts[2]);\n            System.out.println(\"\
    Returned: \" + (parts[3].equals(\"1\") ? \"True\" : \"False\"));\n           \
    \ System.out.println(\"------------------------------\");\n        }\n    }\n\
    }\n```\nListing 3-8: `Library.java`\n\nAnd finally, the `main()` method that handles\
    \ the interaction with the user:\n\n```java\npublic static void main(String[]\
    \ args) throws IOException { \n    Library lib = new Library();\n    int choice;\n\
    \    Scanner scanner = new Scanner(System.in);\n    do {\n        System.out.println(\"\
    \\n1. Add a book\\n2. List all books\\n\" + \"3\\. Lend a book\\n4. Return a book\\\
    n5. List lending events\\n0. Exit\");\n        System.out.print(\"Enter your choice:\
    \ \");\n        choice = scanner.nextInt();\n        switch (choice) {\n     \
    \       case 1: lib.addBook(); break;\n            case 2: lib.listBooks(); break;\n\
    \            case 3: lib.lendBook(); break;\n            case 4: lib.returnBook();\
    \ break;\n            case 5: lib.listLendingEvents(); break;\n            case\
    \ 0: System.out.println(\"Exiting.\"); break;\n            default: System.out.println(\"\
    Invalid choice. Please try again.\");\n            break;\n        }\n    } while\
    \ (choice != 0);\n}\n```\nListing 3-9: `Library.java`\n\nYou can find this project\
    \ in GitHub:\n\n[https://github.com/htset/java_exercises_dsa/tree/master/Library](https://github.com/htset/java_exercises_dsa/tree/master/Library)\n\
    \n## Contact List\n\nIn this exercise, we will create a list that will store the\
    \ names and phone numbers. For faster search, the contacts will be a hash map.\n\
    \n## Proposed Solution\n\nA hash map, also known as a hash table, is a data structure\
    \ that efficiently organizes and retrieves data based on key. In cases where multiple\
    \ keys hash to the same index, hash maps often employ strategies such as chaining\
    \ to handle these collisions.\n\nHere is the definition of the classes used:\n\
    \n```java\nclass Contact {\n    public String name;\n    public String phone;\n\
    \    public Contact next;\n\n    public Contact() {\n        this.name = null;\n\
    \        this.phone = null;\n        this.next = null;\n    }\n}\n\npublic class\
    \ ContactList {\n    private static final int HASH_SIZE = 100;\n    private Contact[]\
    \ bucketTable;\n```\nListing 4-1: `ContactList.java`\n\nThe `ContactList` class\
    \ contains a table of 100 entries. Each entry contains a reference to a `Contact`\
    \ object. The `Contact` class contains the name and the phone number, as well\
    \ as a reference to another `Contact` object, making it a linked list. Essentially,\
    \ the `ContactList` class is an array of linked lists; in this way the contact\
    \ list can expand as we add elements, avoiding collisions.\n\nA contact will be\
    \ inserted into one of the buckets according to its specific hash number. We will\
    \ use a hash function that will create a number between 0 and 99 based on the\
    \ contact name string:\n\n```java\nprivate int hash(String name) {\n    int hash\
    \ = 5381;\n    for (int i = 0; i < name.length(); i++) {\n        hash = ((hash\
    \ << 5) + hash) + name.charAt(i);\n    } \n    return Math.abs(hash) % HASH_SIZE;\n\
    }\n```\nListing 4-2: `ContactList.java`\n\nThis method is based on a hash function\
    \ written by Daniel J. Bernstein (also know as djb2). This method returns the\
    \ index of the hash map, where we should insert the specific contact.\n\nIn the\
    \ class constructor we initialize the buckets with nulls:\n\n```java\npublic ContactList()\
    \ {\n    bucketTable = new Contact[HASH_SIZE];\n    for (int i = 0; i < HASH_SIZE;\
    \ i++) {\n        bucketTable[i] = null;\n    }\n}\n```\nListing 4-3: `ContactList.java`\n\
    \nWe first calculate the hash index based on the contact’s name and then we create\
    \ a new `Contact` object. After populating the object properties, we insert the\
    \ object at the beginning of the respective bucket.\n\nHere is the code for the\
    \ contact addition:\n\n```java\npublic void contactAdd(String name, String phone)\
    \ {\n    //get index from contact name\n    int hashIndex = hash(name);\n    Contact\
    \ newContact = new Contact();\n    newContact.name = name;\n    newContact.phone\
    \ = phone;\n    newContact.next = bucketTable[hashIndex];\n    bucketTable[hashIndex]\
    \ = newContact;\n}\n```\nListing 4-4: `ContactList.java`\n"
