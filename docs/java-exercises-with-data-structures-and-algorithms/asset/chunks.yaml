    );\n    System.out.println(String.join(\" -> \", route));\n    System.out.println(\"\
    Total Price: \" + totalPrice);\n}\n```\nListing 14-8: `Flights.java`\n\n你可以在 GitHub\
    \ 上找到这个项目：\n\nhttps://github.com/htset/java_exercises_dsa/tree/master/Flights\n\
    \n# 15. MNIST 图像比较\n\n在这个练习中，我们将处理 MNIST 数据库中的手写数字图像。\n\n## 建议解决方案\n\nMNIST 数据库（http://yann.lecun.com/exdb/mnist/）是一组描绘手写数字的图像。这些图像维度为\
    \ 28x28，通常用于学习模式识别和机器学习技术。\n\n![MNIST sample](http://yann.lecun.com/exdb/mnist/sample.jpg)\n\
    \n来源：维基百科\n\n我们将下载以下文件并将其解压：\n\nhttp://yann.lecun.com/exdb/mnist/train-images-ubyte.gz\n\
    \n并将其重命名为 `input.dat`。文件包含图像的元数据：\n\n```java\npackage MNIST;\nimport java.io.*;\n\
    import java.util.*;\n\nclass Image {\n    public byte[] data;\n    public int\
    \ id;\n\n    public Image(byte[] data, int id) {\n        this.data = data;\n\
    \        this.id = id;\n    }\n\n    public void print() {\n        for (int i\
    \ = 0; i < data.length; i++) {\n            System.out.print(\"*\");\n       \
    \ }\n        System.out.println();\n    }\n\n    public double euclideanDistance(Image\
    \ img) {\n        double distance = 0.0;\n        for (int i = 0; i < data.length;\
    \ i++) {\n            distance += Math.pow(this.data[i] - img.data[i], 2);\n \
    \       }\n        return Math.sqrt(distance);\n    }\n}\n```\nListing 15-1: `MNISTImages.java`\n\
    \n在类内部，我们实现了 `Image` 构造函数和一个打印星号的方法。我们还实现了一个计算当前图像与传入参数图像之间欧几里得距离的方法。如果图像相似，距离将最小；相反，如果图像差异很大，距离会更高。\n\
    \n现在来看 `main()` 方法：\n\n```java\npublic class MNISTImages {\n    static final int\
    \ ImageSize = 784;\n    static final int MetaDataSize = 15;\n\n    public static\
    \ void main(String[] args) {\n        List<Image> images = new ArrayList<>();\n\
    \        try (FileInputStream ifs = new FileInputStream(\"input.dat\")) {\n  \
    \          // 跳过文件开头的元数据\n            ifs.skip(MetaDataSize);\n            byte[]\
    \ pixels = new byte[ImageSize];\n            int count = 0;\n            // 从文件读取数据并插入列表\n\
    \            while (ifs.read(pixels) > 0) {\n                images.add(new Image(pixels,\
    \ count++));\n            }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n        System.out.println(\"Total images: \" + (images.size() - 1));\n\
    \n        // 示例：找到与随机选择的图像最相似\n        // 设置随机数生成器\n        Random rand = new\
    \ Random();\n        // 在列表长度范围内生成随机索引\n        int randomIndex = rand.nextInt(images.size());\n\
    \        System.out.println(\"Random index: \" + randomIndex);\n        Image\
    \ randomImage = images.get(randomIndex);\n        randomImage.print();\n\n   \
    \     Image closestImage = null;\n        double minDistance = Double.POSITIVE_INFINITY;\n\
    \        int minIndex = 0;\n        for (int i = 0; i < images.size(); i++) {\n\
    \            double distance = randomImage.euclideanDistance(images.get(i));\n\
    \            if (distance != 0 && distance < minDistance) {\n                minDistance\
    \ = distance;\n                minIndex = i;\n                closestImage = images.get(i);\n\
    \            }\n        }\n        // 输出最相似图像的标签\n        System.out.println(\"\
    \\nClosest image (distance=\" + minDistance + \", index = \" + minIndex + \")\\\
    n\");\n        // 打印最相似的图像\n        closestImage.print();\n    }\n}\n```\n"
- fmt: "\n# Listing 15-2: `MNISTImages.java`\n\nWe use an `ArrayList` object to store\
    \ the image references. After we open the `input.dat` binary file, we skip the\
    \ first 15 bytes with `skip()`. Then, in a loop, we read one image at a time (784\
    \ bytes) with `read()` into a buffer and we copy them to the respective `Image`\
    \ object into the list.\n\nAfterwards, we get a randomly selected image from the\
    \ list, and we print it using empty space where the byte is zero and an asterisk\
    \ (`**`) in places where the image bytes are non-zero. This way, we can get an\
    \ idea of the handwriting digit that was chosen:\n\n![](image_rsrc5RP.jpg)\n\n\
    After printing the selected image, we iterate the images list, and we calculate\
    \ the Euclidian distance between the randomly selected image and the currently\
    \ selected image from the list. We maintain the minimum distance encountered and\
    \ the corresponding image along with its ID.\n\nAt the end, we print the closest\
    \ image that we got; it seems that the algorithm is working fine.\n\n![](image_rsrc5RR.jpg)\n\
    \nAs a final note, this algorithm will take a lot of time to get the closest image,\
    \ as it is checking all the images, one by one. There are other algorithms that\
    \ will make this operation faster, albeit, with a loss of precision.\n\nOne such\
    \ example is the Locality-Sensitive Hashing (LSH) algorithm, a technique used\
    \ for approximate nearest neighbor search in high-dimensional spaces. LSH is particularly\
    \ useful when dealing with large datasets where traditional exact nearest neighbor\
    \ search methods become computationally expensive.\n\nYou can find this project\
    \ in GitHub:\n\n[https://github.com/htset/java_exercises_dsa/tree/master/MNISTImages](https://github.com/htset/java_exercises_dsa/tree/master/MNISTImages)\n\
    \n# 16. HTTP Server with Caching\n\nIn this exercise, we will create a simple\
    \ HTTP server that will serve static content (only HTML files). The web server\
    \ will make use of a cache mechanism that will keep the most recently served content,\
    \ in order to boost the server’s performance.\n\n## Proposed Solution\n\nThe web\
    \ server cache is a structure that stores the content that was previously sent\
    \ to the client browser. The cache has limited space, so when it is filled up,\
    \ we will need to empty the least recently used (LRU) entry in order to make space\
    \ for the new entry. Moreover, when an entry is used by the server to send content\
    \ to the client, then this entry is moved to the head of the list, as it is the\
    \ more recently used entry.\n\nLet’s see the cache definition:\n\n```java\npackage\
    \ WebServerCache;\npublic class LRUCache {\n    static final int CACHE_SIZE =\
    \ 3;\n    Node head;\n    Node tail;\n    int size;\n\n    static class Node {\n\
    \        String url;\n        String content;\n        Node prev;\n        Node\
    \ next;\n    }\n    public LRUCache() {\n        size = 0;\n        head = null;\n\
    \        tail = null;\n    }\n    ...\n```\n\n### Listing 16-1: `LRUCache.java`\n\
    \nThe cache is implemented as a doubly linked list. In this kind of linked list,\
    \ we can move to both directions, forward and backward. The doubly linked list\
    \ is beneficial in our case as we can efficiently remove and insert nodes anywhere\
    \ in the list without needing to traverse the list from the beginning. The same\
    \ effect could be achieved with simple linked lists, or even arrays, but with\
    \ lower performance.\n\nLet’s skip the rest of the cache definition for now, and\
    \ jump to the `main()` method of our program:\n\n```java\npublic static void main(String[]\
    \ args) {\n    HttpServer server = new HttpServer();\n    try {\n        server.start();\n\
    \    } catch (IOException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n\
    ### Listing 16-2: `WebServerCache.java`\n\nHere, we create an object of the `HttpServer`\
    \ class, that will handle the connections with the clients. Let’s see how it is\
    \ implemented:\n\n```java\npackage WebServerCache;\nimport java.io.*;\nimport\
    \ java.net.*;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\n\
    class HttpServer {\n    static final int PORT = 8080;\n    static final int MAX_REQUEST_SIZE\
    \ = 1024;\n    LRUCache cache;\n    public HttpServer() {\n        cache = new\
    \ LRUCache();\n    }\n    public void start() throws IOException {\n        //Open\
    \ server socket\n        ServerSocket server = new ServerSocket(PORT);\n     \
    \   System.out.println(\"Server started on port \" + PORT);\n        while (true)\
    \ {\n            //Wait for connections\n            Socket client = server.accept();\n\
    \            handleRequest(client);\n            client.close();\n        }\n\
    \    }\n    void handleRequest(Socket client) throws IOException {\n        //Read\
    \ request\n        InputStream inputStream = client.getInputStream();\n      \
    \  byte[] buffer = new byte[MAX_REQUEST_SIZE];\n        int bytesRead = inputStream.read(buffer);\n\
    \        String request = new String(buffer, 0, bytesRead, StandardCharsets.UTF_8);\n\
    \        System.out.println(\"Received request: \" + request);\n        //Find\
    \ request type (GET)\n        String[] parts = request.split(\" \");\n       \
    \ if (parts.length < 2 || !parts[0].equals(\"GET\")) {\n            System.out.println(\"\
    Invalid request format.\");\n            return;\n        }\n        //Get request\
    \ url and check whether it is already stored in the cache\n        String url\
    \ = parts[1];\n        String content = cache.getContent(url);\n        if (content.isEmpty())\
    \ {\n            //If not found in cache, read it from the HTML file\n       \
    \     try {\n                content = new String(Files.readAllBytes(new File(url.substring(1)).toPath()),\
    \ StandardCharsets.UTF_8);\n                System.out.println(\"Got content from\
    \ file: \" + content);\n                cache.putContent(url, content);\n    \
    \        } catch (FileNotFoundException e) {\n                System.out.println(\"\
    File not found: \" + url);\n            }\n        } else {\n            System.out.println(\"\
    Serving content from cache.\");\n        }\n        //Build the response\n   \
    \     String contentType = \"text/plain\";\n        if (url.endsWith(\".html\"\
    ) || url.endsWith(\".htm\")) {\n            contentType = \"text/html\";\n   \
    \     }\n        String response = \"HTTP/1.1 200 OK\\r\\nContent-Type: \" + contentType\
    \ + \"\\r\\n\\r\\n\" + content;\n        byte[] responseBytes = response.getBytes(StandardCharsets.UTF_8);\n\
    \        OutputStream outputStream = client.getOutputStream();\n        outputStream.write(responseBytes);\n\
    \    }\n}\n```\n\n### Listing 16-3: `WebServerCache.java`\n\nHere we create a\
    \ `ServerSocket` object that continuously accepts HTTP connections from web browsers\
    \ at port8080. When a connection is accepted, then the `handleRequest()` method\
    \ is called.\n\nInitially, the web request stream is received into the `buffer`\
    \ byte array. Then we create a string object that will contain the request. The\
    \ string is split in order to retrieve the request type and the URL; only GET\
    \ requests are handled by our server.\n\nWe then use the request URL to search\
    \ in the cache for a previously stored response for this URL. If such an entry\
    \ is not found in the cache, then we open the requested HTML file (The HTML files\
    \ are stored in the same folder as our executable), and we transmit its HTML content\
    \ in the response. Note that, before sending the content, we must send the header\
    \ of the response:\n\nHTTP/1.1 200 OK\nContent-Type: ... \n\nIf the URL is found\
    \ in the cache, then we get the content from there and we send it with the response.\n\
    \nLet’s see how we do this, in method `getContent()` from the `LRUCache` class:\n\
    \n```java\n//Get the content associated with a URL from the cache\npublic String\
    \ getContent(String url) {\n    Node current = head;\n    while (current != null)\
    \ {\n        if (current.url.equals(url)) {\n            moveToHead(current);\n\
    \            System.out.println(\"Got content from cache: \" + current.content);\n\
    \            return current.content;\n        }\n        current = current.next;\n\
    \    }\n    return \"\";\n}\n```\n\n### Listing 16-4: `LRUCache.java`\n\nWe start\
    \ from the head of the list, and we search for the URL in the cache’s nodes. If\
    \ we find the URL, then we move the node to the head of the cache (the most recently\
    \ used entry) and we return the stored HTML content. The method returns an empty\
    \ string if the URL is not found in the cache.\n\nWhen a page is read from its\
    \ file, then we store its content into the cache, with `putContent()`:\n\n```java\n\
    //Put a URL-content pair into the cache\npublic void putContent(String url, String\
    \ content) {\n    if (size == CACHE_SIZE) {\n        deleteNode(tail);\n     \
    \   size--;\n    }\n    Node newNode = createNode(url, content);\n    insertAtHead(newNode);\n\
    \    size++;\n}\n```\n\n### Listing 16-5: `LRUCache.java`\n"
