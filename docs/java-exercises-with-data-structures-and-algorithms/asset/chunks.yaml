    \ artist, the album and the release year:\n\n```java\npackage Songs;\npublic class\
    \ Song {\n    public String title;\n    public String artist;\n    public String\
    \ album;\n    public int releaseYear;\n    public Song(String title, String artist,\
    \ String album, int releaseYear) {\n        this.title = title;\n        this.artist\
    \ = artist;\n        this.album = album;\n        this.releaseYear = releaseYear;\n\
    \    }\n}\n```\nListing 6-1: `Song.java`\n\nNext, we define three methods, that\
    \ will be used for the comparisons:\n\n```java\npackage Songs;\nimport java.util.Comparator;\n\
    public class Songs {\n    //Compare songs based on artist\n    public static int\
    \ compareByArtist(Song a, Song b) {\n        return a.artist.compareTo(b.artist);\n\
    \    }\n    //Compare songs based on album\n    public static int compareByAlbum(Song\
    \ a, Song b) {\n        return a.album.compareTo(b.album);\n    }\n    //Compare\
    \ songs based on release date\n    public static int compareByReleaseDate(Song\
    \ a, Song b) {\n        return a.releaseYear - b.releaseYear;\n    }\n}\n```\n\
    Listing 6-2: `Songs.java`\n\nIn the first two methods, we compare two strings,\
    \ while in the third one we compare two integers. Those methods will be used by\
    \ the `insertionSort()` method:\n\n```java\npublic static void insertionSort(Song[]\
    \ arr, Comparator<Song> comparator) { \n    for (int i = 1; i < arr.length; i++)\
    \ {\n        Song key = arr[i];\n        int j = i - 1;\n        //Move elements\
    \ of arr[0..i-1], that are greater than key,\n        //to one position ahead\
    \ of their current position\n        while (j >= 0 && comparator.compare(arr[j],\
    \ key) > 0) {\n            arr[j + 1] = arr[j];\n            j = j - 1;\n    \
    \    }\n        arr[j + 1] = key;\n    }\n}\n```\nListing 6-3: `Songs.java`\n\n\
    We use the `Comparator` interface in order to use one of the 3 static methods\
    \ that we defined earlier. This interface is then used as a parameter for the\
    \ `insertionSort()` method to specify the comparison logic for sorting the `Song`\
    \ array.\n\nFor instance, if we call `insertionSort()` like this:\n\n`insertionSort(songs,\
    \ Songs::compareByArtist);`\n\nthen, the following code inside `insertionSort()`:\n\
    \n`while (j >= 0 && comparator.compare(arr[j], key) > 0)`\n\nwill result in calling\
    \ the `compareByArtist()` method. In this way, we don’t have to write `insertionSort()`\
    \ three times to accommodate for the three different types of comparison.\n\n\
    Note that we are essentially using a Lambda Expression with a reference to a static\
    \ method. We could do this in a more traditional way, by creating three classes\
    \ that implement the `Comparator` interface, like the following:\n\n```java\n\
    //Comparator class for comparing songs by artist\nclass CompareByArtist implements\
    \ Comparator<Song> {\n    @Override\n    public int compare(Song a, Song b) {\n\
    \        return a.artist.compareTo(b.artist);\n    }\n}\n```\nListing 6-4: `Songs.java`\n\
    \nThen we would call `insertionSort()` like this:\n\n`insertionSort(songs, new\
    \ CompareByArtist());`\n\nInsertion sort works by taking each element in the array\
    \ and moving it to the left part of the array in a sorted position. At any time,\
    \ the left part of the array is sorted, while we take items from the right part.\
    \ As we move an element to a place in the array, all the items to the right will\
    \ have to move one place to the right.\n\nThis is all illustrated in the `main()`\
    \ method where we call `insertionSort()` three times, each time passing a different\
