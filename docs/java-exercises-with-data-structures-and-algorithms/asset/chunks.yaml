  trans: "\n如果我们已经达到了最大缓存大小，那么 LRU 算法就会启动：我们删除最近未使用的条目（列表末尾的节点），并为新条目的插入（在列表头部）腾出空间。\n\
    \n现在，我们可以检查一下处理缓存操作的方法。首先，让我们看看如何创建一个新节点：\n\n```java\n//Create a new node\nNode\
    \ createNode(String url, String content) {\n    Node newNode = new Node();\n \
    \   newNode.url = url;\n    newNode.content = content;\n    newNode.prev = null;\n\
    \    newNode.next = null;\n    System.out.println(\"New node created: \" + content);\n\
    \    return newNode;\n}\n```\nListing 16-6: `LRUCache.java`\n\n接下来，我们看看如何向缓存头部插入新节点：\n\
    \n```java\n//Insert a new node at the head of the cache\nvoid insertAtHead(Node\
    \ node) {\n    node.next = head;\n    node.prev = null;\n    if (head != null)\n\
    \        head.prev = node;\n    head = node;\n    if (tail == null)\n        tail\
    \ = node;\n    System.out.println(\"Node inserted at head: \" + node.content);\n\
    }\n```\nListing 16-7: `LRUCache.java`\n\n注意，在所有操作中，我们必须处理所有的四个引用：`head`、`tail`、`next`、`prev`。\n\
    \n作为 LRU 算法的一部分，我们需要将节点移动到列表头部：\n\n```java\n//Move a node to the head of the cache\n\
    void moveToHead(Node node) {\n    if (node == head)\n        return;\n    if (node.prev\
    \ != null)\n        node.prev.next = node.next;\n    if (node.next != null)\n\
    \        node.next.prev = node.prev;\n\n    node.prev = null;\n    node.next =\
    \ head;\n    if (head != null)\n        head.prev = node;\n    head = node;\n\
    \    if (tail == null)\n        tail = node;\n    System.out.println(\"Node moved\
    \ to head: \" + node.content);\n}\n```\nListing 16-8: `LRUCache.java`\n\n最后，这里是节点删除的代码：\n\
    \n```java\n//Delete a node from the cache\nvoid deleteNode(Node node) {\n    if\
    \ (node == null)\n        return;\n    if (node == head)\n        head = node.next;\n\
    \    if (node == tail)\n        tail = node.prev;\n    if (node.prev != null)\n\
    \        node.prev.next = node.next;\n    if (node.next != null)\n        node.next.prev\
    \ = node.prev;\n    System.out.println(\"Node deleted: \" + node.content);\n}\n\
    ```\nListing 16-9: `LRUCache.java`\n\n你可以在 GitHub 上找到这个项目：\n\n`https://github.com/htset/java_exercises_dsa/tree/master/WebServerCache\n\
    \n# 17. 分布式拍卖\n\n在这个练习中，我们将创建一个分布式拍卖，它将由一个接收多个客户端出价的拍卖服务器组成。客户端将通过 socket 与服务器通信。服务器将等待\
    \ 20 秒（使用定时器）来接收新出价，否则拍卖结束，最高出价者获胜。如果及时提交了新出价，定时器将重置。\n\n## 建议解决方案\n\n让我们从拍卖服务器开始。服务器应该能够容纳多个客户端。因此，每个客户端将在单独的线程中提供服务，该线程会在服务器\
    \ socket 接受新连接时被创建：\n\n```java\npackage AuctionServer;\nimport java.io.*;\nimport\
    \ java.net.*;\nimport java.nio.charset.StandardCharsets;\nimport java.util.Timer;\n\
    import java.util.TimerTask;\npublic class AuctionServer {\n    //代表每个连接到服务器的客户端的类\n\
    \    static class Client { \n\n        private final Socket socket;\n        private\
    \ final BufferedWriter writer;\n        private final int id;\n        // Client\
    \ 类的构造函数\n        public Client(Socket socket, int id) throws IOException {\n\
    \            this.socket = socket;\n            // 设置 writer 以向客户端发送数据\n     \
    \       this.writer= new BufferedWriter(new OutputStreamWriter(socket.getOutputStream(),StandardCharsets.UTF_8));\n\
    \            this.id = id;\n        }\n        public Socket getSocket() {\n \
    \           return socket;\n        }\n        public BufferedWriter getWriter()\
    \ {\n            return writer;\n        }\n        public int getId() {\n   \
    \         return id;\n        }\n    }\n...\n```\nListing 17-1: `AuctionServer.java`\n\
    \n在这里，我们将 `Client` 类定义为 `AuctionServer` 类内部的 `static` 类。`Client` 存储了已连接客户端的信息（其\
    \ `ID` 以及相应的 `Socket` 和 `BufferedWriter` 对象）。\n\n接下来，我们定义了一些常量和类属性：\n\n```java\n\
    //常量\nprivate static final int PORT = 8080; //服务器端口号\nprivate static final int\
    \ MAX_CLIENTS = 5; // 最大客户端数量\n//服务器和客户端\nprivate static ServerSocket server;\n\
    private static Client[] clients = new Client[MAX_CLIENTS]; // 用于持有客户端的数组\n//拍卖详情\n\
    private static int bestBid = 0; // 收到的最高出价\nprivate static int winningClient =\
    \ 0; // 获胜的客户端\n//拍卖结束的定时器\nprivate static Timer timer;\n```\nListing 17-2: `AuctionServer.java`\n\
    \n现在我们展示 `main()` 方法：\n\n```java\npublic static void main(String[] args) {\n \
    \   try { \n        //设置服务器\n        server = new ServerSocket(PORT);\n      \
    \  System.out.println(\"Server listening on port \" + PORT);\n        //启动定时器\n\
    \        timer = new Timer();\n        timer.schedule(new TimerTask() {\n    \
    \        @Override\n            public void run() {\n                timerCompletion();\n\
    \            }\n        }, 20000); //每 20 秒触发一次定时器\n        while (true) {\n \
    \           //接受新连接\n            Socket clientSocket = server.accept();\n    \
    \        System.out.println(\"Client connected: \"+ clientSocket.getRemoteAddress());\n\
    \            //寻找可用空位\n            int clientId = -1;\n            for (int i\
    \ = 0; i < MAX_CLIENTS; i++) {\n                if (clients[i] == null) {\n  \
    \                  clientId = i;\n                    break;\n               \
    \ }\n            }\n            if (clientId != -1) {\n                //在单独线程中处理客户端\n\
    \                clients[clientId] = new Client(clientSocket, clientId);\n   \
    \             System.out.println(\"Client. \" + clientId + \" connected.\");\n\
    \                new Thread(() -> handleClient(clientId)).start();\n         \
    \   }\n        }\n    } catch (Exception ex) {\n        System.out.println(\"\
    Server error: \" + ex.getMessage());\n    } finally {\n        try {\n       \
    \     if (server != null) server.close();\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\nListing 17-3: `AuctionServer.java`\n\
    \n我们打开 `ServerSocket` 并监听新连接。我们还启动了一个 20 秒的定时器。当定时器过期时，`timerCompletion()` 方法将被调用，结束拍卖过程。\n\
    \n当新连接到达时，我们在 `clients` 数组中存储客户端详情并产生新线程。该线程将运行 `handleClient()` 方法，与特定的客户端进行通信。\n\
    \n现在，让我们看看 `handleClient()` 方法：\n\n```java\n//处理客户端报价\nprivate static void handleClient(int\
    \ clientId) { \n    try {\n        Client client = clients[clientId];\n      \
    \  Socket clientSocket = client.getSocket();\n        BufferedReader reader= new\
    \ BufferedReader(new InputStreamReader(clientSocket.getInputStream(),StandardCharsets.UTF_8));\n\
    \        String bid;\n        while (true) {\n            //从客户端读取报价\n       \
    \     bid = reader.readLine();\n            if (bid == null) {\n             \
    \   //客户端断开连接\n                System.out.println(\"Client disconnected: \"+ clientSocket.getRemoteAddress());\n\
    \                clients[clientId] = null;\n                break;\n         \
    \   }\n            int bidAmount = Integer.parseInt(bid);\n            System.out.println(\"\
    Received bid \" + bidAmount + \" from client \"+ client.getId());\n          \
    \  synchronized (AuctionServer.class) {\n                if (bidAmount > bestBid)\
    \ {\n                    bestBid = bidAmount;\n                    winningClient\
    \ = client.getId();\n                    String msg = \"New best bid: \" + bestBid+\
    \ \" (Client: \" + winningClient + \")\";\n                    broadcastMessage(msg);\n\
    \                    System.out.println(\"New best bid: \" + bestBid+ \" (Client:\
    \ \" + winningClient + \")\");\n                    //重置定时器\n                \
    \    timer.cancel();\n                    timer = new Timer();\n             \
    \       timer.schedule(new TimerTask() {\n                        @Override\n\
    \                        public void run() {\n                            timerCompletion();\n\
    \                        }\n                    }, 20000, 20000);\n          \
    \      } else {\n                    String msg = \"Received lower bid. Best bid\
    \ remains at: \" + bestBid;\n                    broadcastMessage(msg);\n    \
    \                System.out.println(\"Received lower bid. Best bid remains at:\
    \ \" + bestBid);\n                }\n            }\n        }\n    } catch (Exception\
