  trans: "\n现在，让我们看看如何将用户插入到图中，以及如何定义他们与朋友之间的连接。我们定义了 `Graph` 类，它本质上包含社交网络中所有用户的数组：\n\
    \n```java\nclass Graph {\n    private static final int MAX_USERS = 100;\n    private\
    \ User[] users;\n    private int numUsers;\n    public Graph() {\n        users\
    \ = new User[MAX_USERS];\n        numUsers = 0;\n        ...\n    }\n}\n```\n\
    列表 13-3: `SocialNetwork.java`\n\n接下来，我们提供了向图中添加新用户的功能：\n\n```java\npublic void\
    \ addUser(String name) { \n    if (numUsers >= MAX_USERS) {\n        System.out.println(\"\
    Max user limit reached!\");\n        return;\n    }\n    users[numUsers] = new\
    \ User(name);\n    numUsers++;\n}\n```\n列表 13-4: `SocialNetwork.java`\n\n我们使用以下方法为用户添加新的连接：\n\
    \n```java\npublic void addConnection(int src, int dest) {\n    if (src < 0 ||\
    \ src >= numUsers || dest < 0 || dest >= numUsers) {\n        System.out.println(\"\
    Invalid user index!\");\n        return;\n    }\n    //Add bidirectional connection\n\
    \    FriendNode newFriendSrc = new FriendNode(users[dest].name);\n    newFriendSrc.next\
    \ = users[src].friends;\n    users[src].friends = newFriendSrc;\n    FriendNode\
    \ newFriendDest = new FriendNode(users[src].name);\n    newFriendDest.next = users[dest].friends;\n\
    \    users[dest].friends = newFriendDest;\n}\n```\n列表 13-5: `SocialNetwork.java`\n\
    \n注意，当我们添加新连接时，我们将其是双向的。也就是说，我们为连接的每个端都插入了一个朋友节点。\n\n接下来，我们进入更有趣的内容：推荐方法：\n\n\
    ```java\npublic void recommendFriends(int userIndex) {\n    System.out.println(\"\
    Recommended friends for \" + users[userIndex].name + \":\");\n    // 存储用户朋友的索引\n\
    \    MyQueue queue = new MyQueue();\n    // 存储已经访问过的人\n    boolean[] visited =\
    \ new boolean[MAX_USERS];\n    visited[userIndex] = true;\n    // 入队起始用户\n   \
    \ queue.enqueue(userIndex);\n    while (!queue.isEmpty()) {\n        int currentUserIndex\
    \ = queue.dequeue();\n        FriendNode current = users[currentUserIndex].friends;\n\
    \        // 遍历用户的朋友\n        while (current != null) {\n            int friendIndex\
    \ = -1;\n            // 寻找朋友的索引\n            for (int i = 0; i < numUsers; i++)\
    \ {\n                if (current.name.equals(users[i].name)) {\n             \
    \       friendIndex = i;\n                    break;\n                }\n    \
    \        }\n            // 检查朋友是否已经被访问\n            if (friendIndex != -1 && !visited[friendIndex])\
    \ {\n                System.out.println(\"- \" + current.name);\n            \
    \    // 将朋友加入访问数组\n                visited[friendIndex] = true;\n            \
    \    // 将朋友入队\n                queue.enqueue(friendIndex);\n            }\n  \
    \          // 移动到下一个朋友\n            current = current.next;\n        }\n    }\n\
    }\n```\n列表 13-6: `SocialNetwork.java`\n\n`recommendFriends()` 方法使用广度优先搜索 (BFS)\
    \ 来遍历社交网络图，从指定的用户开始，并访问所有连接的用户以推荐朋友。它使用 `visited[]` 数组将用户标记为已访问，以避免重复推荐同一个朋友，并将每个朋友入队，以确保所有潜在朋友都能被发现和推荐。\n\
    \nBFS 算法利用队列，我们在跟随链表时在其中存储用户朋友的索引。然后，我们使用队列获取用户朋友的朋友，通过这种方式，我们能够遍历图的连接并找到与特定用户连接的所有人员。\n\
    \n最后，这里是 `main()` 方法：\n\n```java\npublic class SocialNetwork {\n    public static\
    \ void main(String[] args) {\n        Graph graph = new Graph();\n        graph.addUser(\"\
    User A\");\n        graph.addUser(\"User B\");\n        graph.addUser(\"User C\"\
    );\n        graph.addUser(\"User D\");\n        graph.addUser(\"User E\");\n \
    \       graph.addUser(\"User F\");\n        graph.addUser(\"User G\");\n     \
    \   graph.addUser(\"User H\");\n        graph.addConnection(0, 1);\n        graph.addConnection(1,\
    \ 2);\n        graph.addConnection(2, 3);\n        graph.addConnection(4, 5);\n\
    \        graph.addConnection(5, 7);\n        graph.addConnection(3, 6);\n    \
    \    graph.recommendFriends(0);\n        graph.recommendFriends(1);\n        graph.recommendFriends(7);\n\
    \    }\n}\n```\n列表 13-7: `SocialNetwork.java`\n\n在 `main()` 中，我们向图中添加用户，并输入他们的朋友连接。然后我们运行算法来获取朋友推荐。\n\
    \n你可以在 GitHub 上找到这个项目：\n\nhttps://github.com/htset/java_exercises_dsa/tree/master/SocialNetwork\n\
    \n# 14. 航班\n\n让我们创建一个控制台应用程序，维护城市之间的航班列表，并根据票价找到最佳航班组合。\n\n## 建议的解决方案\n\n这个问题涉及在城市之间创建一个图。该图是带权重的，权重为相应的机票费用。我们将使用\
    \ Dijkstra 算法来寻找这两个城市之间最廉价的路径。\n\n首先，我们定义 `City` 类，它将存储连接城市及其相应的映射：\n\n```java\n\
    package Flights;\nimport java.util.*;\npublic class Flights {\n    // 表示每个城市的结构\n\
    \    public static class City {\n        public String name;\n        public Map<String,\
    \ Integer> flights;\n        public City(String name) {\n            this.name\
    \ = name;\n            this.flights = new HashMap<>();\n        }\n    }\n...\n\
    ```\n列表 14-1: `Flights.java`\n\n接下来，我们定义 `FlightGraph` 类：\n\n```java\npublic static\
    \ class FlightGraph {\n    // 表示所有城市的图类\n    public Map<String, City> cities =\
    \ new HashMap<>();\n    ...\n```\n列表 14-2: `Flights.java`\n\n该类包含所有城市及其名称的映射。我们可以通过以下方法添加城市和航班连接：\n\
    \n```java\n// 向图中添加城市\npublic void addCity(String name) {\n    cities.put(name,\
    \ new City(name));\n}\n// 添加两个城市之间的航班及其费用\npublic void addFlight(String src, String\
    \ dest, int cost) {\n    cities.get(src).flights.put(dest, cost);\n}\n```\n列表\
    \ 14-3: `Flights.java`\n\n注意，我们假设航班是双向的，并且具有相同的价格。\n\n接下来，我们使用 Dijkstra 算法计算两个城市之间的最短路径：\n\
    \n```java\n// 寻找两个城市之间最短路径的方法\npublic List<String> findCheapestRoute(String src,\
    \ String dest, Map<String, Integer> dist) {\n    // 初始化距离映射和前驱节点映射\n    dist.clear();\n\
    \    Map<String, String> prev = new HashMap<>();\n    PriorityQueue<Map.Entry<String,\
    \ Integer>> pq = new PriorityQueue<>(Map.Entry.comparingByValue());\n    // 设置所有距离为无穷\n\
    \    for (String city : cities.keySet()) {\n        dist.put(city, Integer.MAX_VALUE);\n\
    \        prev.put(city, null);\n    }\n    // 起始城市的距离为 0\n    dist.put(src, 0);\n\
    \    pq.offer(new AbstractMap.SimpleEntry<>(src, 0));\n    // 处理每个节点的主循环\n   \
    \ while (!pq.isEmpty()) {\n        Map.Entry<String, Integer> entry = pq.poll();\n\
    \        String u = entry.getKey();\n        int uDist = entry.getValue();\n \
    \       // 处理当前节点的每个邻居\n        for (Map.Entry<String, Integer> flight : cities.get(u).flights.entrySet())\
    \ {\n            String v = flight.getKey();\n            int cost = flight.getValue();\n\
    \            // 如果发现到达 v 的更短路径\n            if (dist.get(u) != Integer.MAX_VALUE\
    \ && dist.get(u) + cost < dist.get(v)) {\n                dist.put(v, dist.get(u)\
    \ + cost);\n                prev.put(v, u);\n                pq.offer(new AbstractMap.SimpleEntry<>(v,\
    \ dist.get(v)));\n            }\n        }\n    }\n    // 从源到目的地重建路径\n    List<String>\
    \ path = new ArrayList<>();\n    for (String at = dest; at != null; at = prev.get(at))\
    \ {\n        path.add(at);\n    }\n    Collections.reverse(path);\n    return\
    \ path;\n}\n```\n列表 14-4: `Flights.java`\n"
- fmt: "\nUpon completion, we reconstruct the shortest path from the source to the\
    \ destination using the information stored in the previous node map, facilitating\
    \ the determination of the total price of the route.\n\nTo avoid getting stuck\
    \ in loops during the graph traversal, we keep track of the cities visited in\
    \ the current path (`dist map`). If a city has already been visited in the current\
    \ path, we skip exploring flights from that city to prevent loops.\n\nWe can calculate\
    \ and print all the possible flights between two cities using Depth-First Search\
    \ (DFS):\n\n```java\n//Display all possible flights between two cities using DFS\n\
    public void displayAllFlights(String src, String dest) {\n    if (!cities.containsKey(src)\
    \ || !cities.containsKey(dest)) {\n        System.out.println(\"Invalid cities\
    \ entered.\");\n        return;\n    }\n\n    Set<String> visited = new HashSet<>();\n\
    \    Stack<String> path = new Stack<>();\n    path.push(src);\n    dfs(src, dest,\
    \ visited, path);\n}\n```\nListing 14-5: `Flights.java`\n\nWe see that method\
    \ `displayAllFlights()` calls the recursive `dfs()` method:\n\n```java\n//Recursive\
    \ DFS function to find all flights between source and destination\nprivate void\
    \ dfs(String src, String dest, Set<String> visited, Stack<String> path) {\n  \
    \  visited.add(src);\n    if (src.equals(dest)) {\n        printPath(path);\n\
    \    } else {\n        for (String flight : cities.get(src).flights.keySet())\
    \ {\n            if (!visited.contains(flight)) {\n                path.push(flight);\n\
    \                dfs(flight, dest, visited, path);\n                path.pop();\n\
    \            }\n        }\n    }\n    visited.remove(src);\n}\n```\nListing 14-6:\
    \ `Flights.java`\n\nThe `dfs()` method in the `FlightGraph` class implements Depth-First\
    \ Search (DFS) recursively to find all possible flights between a source and a\
    \ destination city within a flight network.\n\nIt begins by marking the current\
    \ city as visited and checks if it matches the destination city. If the destination\
    \ is reached, it prints the current path. Otherwise, it explores all neighboring\
    \ cities not yet visited by recursively calling itself for each neighbor.\n\n\
    During exploration, it pushes the neighboring city onto the `path` stack and continues\
    \ the search until all possible paths from the current city are explored or until\
    \ the destination is reached.\n\nUpon backtracking, it removes the current city\
    \ from the `path` stack and marks it as unvisited, allowing exploration of alternative\
    \ paths. This process is repeated until all cities in the network are explored.\n\
    \nWe use the aforementioned stack to print the final path in `PrintPath()` method:\n\
    \n```java\n//Helper function to print a path (stack content)\nprivate void printPath(Stack<String>\
    \ path) {\n    System.out.println(String.join(\" -> \", path));\n}\n```\nListing\
    \ 14-7: `Flights.java`\n\nFinally in `main()`, we add cities and flights to the\
    \ graph and we ask the user to select a pair of cities to calculate the best (cheapest)\
    \ combination of flights:\n\n```java\npublic static void main(String[] args) {\n\
    \    Scanner scanner = new Scanner(System.in);\n    FlightGraph graph = new FlightGraph();\n\
    \    graph.addCity(\"London\");\n    graph.addCity(\"Paris\");\n    graph.addCity(\"\
    Berlin\");\n    graph.addCity(\"Rome\");\n    graph.addCity(\"Madrid\");\n   \
    \ graph.addCity(\"Amsterdam\");\n    graph.addFlight(\"London\", \"Paris\", 100);\n\
    \    graph.addFlight(\"London\", \"Berlin\", 150);\n    graph.addFlight(\"London\"\
