    New best bid: \" + bestBid+ \" (Client: \" + winningClient + \")\");\n       \
    \             //Reset the timer\n                    timer.cancel();\n       \
    \             timer = new Timer();\n                    timer.schedule(new TimerTask()\
    \ {\n                        @Override\n                        public void run()\
    \ {\n                            timerCompletionRoutine();\n                 \
    \       }\n                    }, 20000, 20000);\n                } else {\n \
    \                   String msg = \"Received lower bid. Best bid remains at: \"\
    \ + bestBid;\n                    broadcastMessage(msg);\n                   \
    \ System.out.println(\"Received lower bid. Best bid remains at: \" + bestBid);\n\
    \                }\n            }\n        }\n    } catch (Exception ex) {\n \
