    \         System.out.print(\"Enter your choice: \");\n            choice = scanner.nextInt();\n\
    \            switch (choice) {\n                case 1:\n                    addTask(workerQueue,\
    \ tasks, scanner);\n                    break;\n                case 2:\n    \
    \                displayTasks(tasks);\n                    break;\n          \
    \      case 3:\n                    printWorkersQueue(workerQueue);\n        \
    \            break;\n                case 4:\n                    System.out.println(\"\
    Exiting program...\");\n                    break;\n                default:\n\
    \                    System.out.println(\"Invalid choice! Please try again.\"\
    );\n                    break;\n            }\n        } while (choice != 4);\n\
    \        scanner.close();\n    }\n}...\n```\n列表 7-3：`TaskAllocation.java`\n\n\
    接下来，我们实现添加任务并将其分配给工作者的方法：\n\n```java\n// 添加任务并分配给工作者的方法\nstatic void addTask(PriorityQueue<Worker>\
    \ workerQueue,List<Task> tasks, Scanner scanner) {\n    System.out.print(\"Enter\
    \ task description: \");\n    String description = scanner.next(); \n\n    System.out.print(\"\
    Enter task duration (in minutes): \");\n}\n```\n"
- fmt: "\n```java\nint duration = scanner.nextInt();\nif (workerQueue.size() == 0)\
    \ {\n    System.out.println(\"No workers available! Task cannot be assigned.\"\
    );\n    return;\n}\n// Dequeue the worker with the shortest workload\nWorker worker\
    \ = workerQueue.poll();\n// Assign the task to the worker and update workload\n\
    tasks.add(new Task(description, duration));\nSystem.out.println(\"Task added successfully\
    \ and allocated to Worker \" + worker.id + \"!\");\n// Update workload\nworker.workload\
    \ += duration;\n// Store updated worker back to queue\nworkerQueue.add(worker);\n\
    ```\nListing 7-4: `TaskAllocation.java`\n\nIn order to find the worker that has\
    \ the lowest workload, we store workers in the priority queue. Note that we are\
    \ using the `workload` property as the parameter that will be used to sort the\
    \ priority queue. This is specified in the definition of the queue in `main()`:\n\
    \n```java\nPriorityQueue<Worker> workerQueue = new PriorityQueue<>(Comparator.comparingInt(w\
    \ -> w.workload));\n```\n\nWhen we dequeue an item from the queue, then we will\
    \ get the item with lowest workload.\n\nIn `addTask()`, we get the worker with\
    \ the lowest workload (the one that is positioned at the front of the queue) and\
    \ we add the task’s workload to the worker’s own workload. Then, we store the\
    \ task into the `tasks` list. Finally, the worker is inserted into the queue again;\
    \ now the worker will be positioned according to the newly updated workload.\n\
    \nFinally, we present the code for two other operations, displaying the tasks\
    \ and the workers information respectively:\n\n```java\n// Method to display all\
    \ tasks\nstatic void displayTasks(List<Task> tasks) {\n    System.out.println(\"\
    Task List:\");\n    for (Task task : tasks) {\n        System.out.println(\"Task\
    \ description: \" + task.description + \", Duration: \" + task.duration + \" minutes\"\
    );\n    }\n}\n\n// Method to print the workers queue\nstatic void printWorkersQueue(PriorityQueue<Worker>\
    \ workerQueue) {\n    System.out.println(\"Workers Queue:\");\n    for (Worker\
    \ item : workerQueue) {\n        System.out.println(\"Worker ID: \" + item.id\
    \ + \", Workload: \" + item.workload + \" minutes\");\n    }\n}\n```\nListing\
    \ 7-5: `TaskAllocation.java`\n\nNote that traversing the priority queue will give\
    \ us an unordered workers list. Apparently, this is the only way to get the contents\
    \ of a priority queue, without dequeueing each element.\n\nYou can find this project\
    \ in GitHub:\n\n`https://github.com/htset/java_exercises_dsa/tree/master/TaskAllocation`\n\
    \n## 8. Word Frequencies\n\nWe will create a simple program that will parse a\
    \ text file and will find the frequencies of all the words that appear in it.\n\
    \n### Proposed Solution\n\nThis project is a use case for a dictionary structure.\
    \ We will use a `HashMap` class that will store word and word frequency pairs.\n\
    \nHere is the program code:\n\n```java\npackage WordFrequencies;\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\nimport java.util.HashMap;\n\
    import java.util.Map;\n\npublic class WordFrequencies {\n    static String cleanWord(String\
    \ word) {\n        return new String(word.chars().filter(Character::isLetter).map(Character::toLowerCase).toArray(),\
    \ 0, (int) word.chars().filter(Character::isLetter).count());\n    }\n\n    public\
    \ static void main(String[] args) {\n        Map<String, Integer> wordFrequency\
    \ = new HashMap<>();\n        // Read text from file\n        try (BufferedReader\
    \ inputFile= new BufferedReader(new FileReader(\"input.txt\"))) {\n          \
    \  String line;\n            while ((line = inputFile.readLine()) != null) {\n\
    \                for (String word : line.split(\" \")) {\n                   \
    \ String cleanedWord = cleanWord(word);\n                    if (!cleanedWord.isEmpty())\
    \ {\n                        wordFrequency.put(cleanedWord, wordFrequency.getOrDefault(cleanedWord,\
    \ 0) + 1);\n                    }\n                }\n            }\n        }\
    \ catch (IOException e) {\n            e.printStackTrace();\n        }\n     \
    \   // Display word frequencies\n        System.out.println(\"Word Frequencies:\"\
    );\n        wordFrequency.forEach((key, value) -> System.out.println(key + \"\
    : \" + value));\n    }\n}\n```\nListing 8-1: `WordFrequencies.java`\n\nBy using\
    \ a `BufferedReader` object, we are reading the input file, line by line. Then,\
    \ we split each line, based on spaces and we process each word to make it lowercase\
    \ and remove non-letter characters. This processing is performed by the `cleanWord()`\
    \ method, that takes a string, breaks it into characters, then filters the characters\
    \ to keep only letters and numbers. Finally, it maps each character into lowercase\
    \ ones and creates a new string based on them.\n\nThen, we add the word in the\
    \ `HashMap`. If the word does not already exist in the `HashMap`, then `getOrDefault()`\
    \ will return zero, otherwise it will return its frequency so far.\n\nFinally,\
    \ we employ a `forEach()` loop to print all the words and their frequencies to\
    \ the console. Note the use of a lambda function as argument to `forEach()`.\n\
    \nYou can find this project in GitHub:\n\n`https://github.com/htset/java_exercises_dsa/tree/master/WordFrequencies`\n\
    \n## 9. Syntax Checker\n\nLet’s create a trivial syntax checker that will scan\
    \ a source code file and will determine whether the parentheses, brackets, or\
    \ braces in the code are balanced or not.\n\n### Proposed Solution\n\nIn source\
    \ code, when we open a series of parentheses, brackets, or braces, we have to\
    \ make sure they are closed in the reverse order. The fact that items entered\
    \ in a stack are extracted in the reverse order, makes it suitable for this algorithm:\n\
    \n```java\npackage SyntaxChecker;\npublic class Stack {\n```\nListing 9-1: `Stack.java`\n\
    \nHere is the code for stack initialization:\n\n```java\npublic Stack() {\n```\n\
    Listing 9-2: `Stack.`\n\nNext, we add the code for stack `push` and `pop`, as\
    \ well as a method to check if the stack is empty:\n\n```java\npublic void push(char\
    \ c) {\n    if (top == items.length - 1) {\n        System.out.println(\"Stack\
    \ is full\");\n        System.exit(1);\n    }\n    items[++top] = c;\n}\npublic\
    \ char pop() {\n    if (top == -1) {\n        System.out.println(\"Stack is empty\"\
    );\n        System.exit(1);\n    }\n    return items[top--];\n}\npublic boolean\
    \ isEmpty() {\n    return (top == -1);\n}\n```\nListing 9-3: `Stack.java`\n\n\
    The most interesting part of the code is the algorithm that checks whether the\
    \ file is balanced:\n\n```java\npackage SyntaxChecker;\nimport java.io.BufferedReader;\n\
    import java.io.InputStreamReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    \npublic class SyntaxChecker {\n    static int checkBalanced(String filename)\
    \ {\n        try (BufferedReader file = new BufferedReader(new FileReader(filename)))\
    \ {\n            int c;\n            Stack stack = new Stack();\n            while\
    \ ((c = file.read()) != -1) {\n                char ch = (char) c;\n         \
    \       if (ch == '(' || ch == '[' || ch == '{') {\n                    stack.push(ch);\n\
    \                } else if (ch == ')' || ch == ']' || ch == '}') {\n         \
    \           if (stack.isEmpty()) {\n                        return 0;\n      \
    \              }\n                    char openingChar = stack.pop();\n      \
    \              if ((ch == ')' && openingChar != '(') || (ch == ']' && openingChar\
    \ != '[') || (ch == '}' && openingChar != '{')) {\n                        return\
    \ 0;\n                    }\n                }\n            }\n            return\
    \ stack.isEmpty() ? 1 : 0;\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \            return 0;\n        }\n    }\n\n    public static void main(String[]\
    \ args) {\n        try (BufferedReader reader = new BufferedReader(new InputStreamReader(System.in)))\
    \ {\n            System.out.print(\"Path to the source file: \");\n          \
    \  String filename = reader.readLine();\n            if (checkBalanced(filename)\
    \ == 1) {\n                System.out.println(\"The input file is balanced.\"\
    );\n            } else {\n                System.out.println(\"The input file\
    \ is not balanced.\");\n            }\n        } catch (IOException e) {\n   \
    \         e.printStackTrace();\n        }\n    }\n}\n```\nListing 9-4: `SyntaxChecker.java`\n\
    \nWe open and parse the source code file, and we push the bracket opening characters\
    \ into the stack. When we encounter a closing character, then we pop the first\
    \ available opening character from the stack.\n\nIf there is a mismatch between\
    \ those two characters, we conclude that the file is not balanced. At the end,\
    \ we also check that the stack is emptied; if not, then the file is still unbalanced.\n"
