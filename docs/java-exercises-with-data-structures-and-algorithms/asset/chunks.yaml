    我们将使用栈结构来解决这个迷宫。当我们穿过迷宫时，我们将进入的入入点坐标存储在栈中。当我们遇到死胡同时，我们就必须回溯，我们将通过从栈中弹出一个点来实现这一点。这种算法被称为深度优先搜索\
    \ (DFS)，因为它尽可能地深入迷宫内部，只有在找不到路时才返回并尝试另一个方向。\n\n这里是坐标点的代码：\n\n```java\npackage MazeSolver;\n\
    public class Point {\n    public int row, col;\n    public Point() {\n       \
    \ row = 0;\n        col = 0;\n    }\n    public Point(int x, int y) {\n      \
    \  row = x;\n        col = y;\n    }\n}\n```\n列表 10-2: `Point.java`\n\n这里是栈的代码：\n\
    \n```java\npackage MazeSolver;\n\npublic class Stack<T> {\n    private T[] items;\n\
    \    private int top;\n    public Stack(int capacity) {\n        items = (T[])\
    \ new Object[capacity];\n        top = -1;\n    }\n    public boolean isEmpty()\
    \ {\n        return top == -1;\n    }\n    public void push(T t) {\n        top++;\n\
    \        items[top] = t;\n    }\n    public T pop() {\n        return items[top--];\n\
    \    }\n```\n列表 10-3: `Stack.java`\n\n为了让它更有趣，我们使用泛型创建了一个栈。栈最终将包含一个点对象的数组。我们定义了初始化栈的方法、检查它是否为空以及\
    \ `push` 和 `pop` 方法。注意我们保持简单，没有包含边界检查，因为我们将实例化容量为 `ROWS*COLS` 的栈来解决迷宫。\n\n现在，是时候引入一个处理迷宫的类了：\n\
    \n```java\npackage MazeSolver;\npublic class Maze {\n    private Stack<Point>\
