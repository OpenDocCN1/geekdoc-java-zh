    ```\nListing 17-4: `AuctionServer.java`\n\nThis method takes care of the communication\
    \ with the client. It gets as input the client’s ID, that was passed in `main()`:\n\
    \n`new Thread(() -> handleClient(clientId)).start();`\n\nThen, in an endless `while`\
