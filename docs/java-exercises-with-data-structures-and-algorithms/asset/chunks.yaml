    \n```java\n//在 AVL 树中插入产品\nprivate InventoryNode insertProduct(Node node, Product\
    \ product) {\n    if (node == null)\n        return newNode(product);\n    //\
    \ 插入产品\n    if (product.id < node.product.id)\n        node.left = insertProduct(node.left,\
    \ product);\n    else if (product.id > node.product.id)\n        node.right =\
    \ insertProduct(node.right, product);\n    else\n        return node; // 不允许重复\
    \ ID\n    // 更新此节点的高度\n    node.height = 1 + Math.max(getHeight(node.left), getHeight(node.right));\n\
    \    // 获取平衡因子\n    int balance = getBalance(node);\n    // 左左情况\n    if (balance\
    \ > 1 && product.id < node.left.product.id)\n        return rotateRight(node);\n\
    \    // 右右情况\n    if (balance < -1 && product.id > node.right.product.id)\n  \
