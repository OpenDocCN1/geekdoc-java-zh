- fmt: "\nIf the client has actually sent a valid bid, we compare it with the current\
    \ maximum bid and we update this value if we got a higher bid. We also proceed\
    \ with informing all clients about the submitted bid. We also reset the timer\
    \ to get a new 20 seconds’ period.\n\nHere, `bestBid` and `winningClient` are\
    \ shared resources that might be accessed and modified by multiple client handler\
    \ threads. To protect these shared resources, we synchronize the critical sections\
    \ where these variables are read or written.\n\nNext, we define the `broadcastMessage()`\
    \ method, that sends messages to the clients:\n\n```java\n//Broadcast message\
    \ to all clients\nprivate static void broadcastMessage(String msg) throws IOException\
    \ {\n    for (int i = 0; i < MAX_CLIENTS; i++) {\n        if (clients[i] != null)\
    \ {\n            clients[i].getWriter().write(msg);\n            clients[i].getWriter().newLine();\n\
    \            clients[i].getWriter().flush();\n        }\n    }\n}\n```\nListing\
    \ 17-5: `AuctionServer.java`\n\nWhen the timer eventually expires, the `timerCompletionRoutine()`\
    \ method will be called:\n\n```java\n//Timer completion routine when auction end\n\
    private static void timerCompletionRoutine() {\n    System.out.println(\"Auction\
    \ finished. Winning bid: \" + bestBid+ \", winner: client no. \" + winningClient);\n\
    \    String msg = \"Auction finished. Winning bid: \" + bestBid+ \", winner: client\
    \ no. \" + winningClient;\n    try {\n        broadcastMessage(msg);\n    } catch\
    \ (IOException e) {\n        e.printStackTrace();\n    }\n    //Exit the program\n\
    \    System.exit(0);\n}\n```\nListing 17-6: `AuctionServer.java`\n\nAfter informing\
    \ all clients about the winning bid, we exit the program. The client sockets will\
    \ be closed by the respective clients when they receive the message of the auction\
    \ completion.\n\nNow for the auction client, we first implement the `main()` method:\n\
    \n```java\npackage AuctionClient;\nimport java.io.*;\nimport java.net.*;\nimport\
    \ java.nio.charset.StandardCharsets;\npublic class AuctionClient {\n    private\
    \ static final int PORT = 8080; //Port number to connect to the server\n    private\
    \ static final String SERVER_IP = \"127.0.0.1\"; //Server IP address\n    private\
    \ static Socket client;\n    private static boolean isRunning = true;\n    private\
    \ static Thread receiveThread;\n    public static void main(String[] args) {\n\
    \        //Connect to the server\n        try {\n            client = new Socket(SERVER_IP,\
    \ PORT);\n            System.out.println(\"Connected to server.\");\n        }\
    \ catch (Exception ex) {\n            System.out.println(\"Connect failed: \"\
    \ + ex.getMessage());\n            return;\n        }\n        //Start receive\
    \ handler thread \n        receiveThread = new Thread(AuctionClient::receiveHandler);\n\
    \        receiveThread.start();\n        //Send bids until the user quits\n  \
    \      try (BufferedReader consoleReader= new BufferedReader(new InputStreamReader(System.in));\n\
    \             BufferedWriter writer= new BufferedWriter(new OutputStreamWriter(client.getOutputStream(),StandardCharsets.UTF_8)))\
    \ {\n            String bid;\n            while (isRunning) {\n              \
    \  System.out.print(\"\\nEnter your bid (or 'q' to quit): \");\n             \
    \   bid = consoleReader.readLine();\n                if (\"q\".equalsIgnoreCase(bid))\
    \ {\n                    isRunning = false;\n                    client.close();\n\
    \                    receiveThread.interrupt(); //Interrupt the receive thread\n\
    \                    break;\n                }\n                try {\n      \
    \              writer.write(bid);\n                    writer.newLine();\n   \
    \                 writer.flush();\n                } catch (Exception ex) {\n\
    \                    System.out.println(\"Send failed: \" + ex.getMessage());\n\
    \                    return;\n                }\n            }\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n        //Ensure\
    \ client is closed\n        try {\n            client.close();\n        } catch\
    \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
    Listing 17-7: `AuctionClient.java`\n\nHere, we create a `Socket` object, and we\
    \ connect to the server. If the connection is successful, we spawn a new thread\
    \ that will be used to receive and print the information from the server.\n\n\
    The sending part of the communication, i.e. the submission of bids to the server,\
    \ will be performed by the main thread. If we had the same thread handle sending\
    \ and receiving of data, we would have a problem, as the `readLine()` method would\
    \ block and would not let the user send a new bid.\n\nHere is the callback method\
    \ for the thread handler:\n\n```java\n//Handle incoming messages from the server\n\
    private static void receiveHandler() { \n    try (BufferedReader reader = new\
    \ BufferedReader(new InputStreamReader(client.getInputStream(), StandardCharsets.UTF_8)))\
    \ {\n        while (isRunning) {\n            try {\n                if (Thread.interrupted())\
    \ {\n                    break; //Exit if the thread is interrupted\n        \
    \        }\n                String message = reader.readLine();\n            \
    \    if (message == null || message.isEmpty()) {\n                    System.out.println(\"\
    \\nServer disconnected.\");\n                    break;\n                }\n \
    \               System.out.println(\"\\nServer: \" + message);\n             \
    \   if (message.startsWith(\"Auction\")) {\n                    System.out.println(\"\
    Auction ended. Exiting program.\");\n                    isRunning = false;\n\
    \                    break;\n                }\n            } catch (IOException\
    \ ex) {\n                if (isRunning) {\n                    //Check if still\
    \ running to avoid printing// error when stopping intentionally\n            \
    \        System.out.println(\"Receive failed: \" + ex.getMessage());\n       \
    \         }\n                break;\n            }\n        }\n    } catch (IOException\
    \ e) {\n        if (isRunning) {\n            //Check if still running to avoid\
    \ printing// error when stopping intentionally\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\nListing 17-6: `AuctionClient.java`\n\nThis thread receives\
    \ messages from the auction server and prints them in the console. When the final\
    \ message, starting with “Auction” arrives, then it closes down the resources\
    \ and exits the program.\n\nYou can find this project in GitHub:\n\n- https://github.com/htset/java_exercises_dsa/tree/master/AuctionServer\n\
    - https://github.com/htset/java_exercises_dsa/tree/master/AuctionClient\n"
