    \\\\|\"); \n        if (parts[0].equals(bookTitle) && parts[2].equals(\"0\"))\
    \ {\n            booksLines[i] = parts[0] + \"|\" + parts[1] + \"|1\";\n     \
    \       bookFound = true;\n            //Get all lending events\n            String[]\
