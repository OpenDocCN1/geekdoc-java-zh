    ## 8. 单词频率\n\n我们将创建一个简单的程序，解析文本文件并找到其中出现的所有单词的频率。\n\n### 建议的解决方案\n\n该项目是字典结构的一个用例。我们将使用\
    \ `HashMap` 类来存储单词和单词频率值对。\n\n以下是程序代码：\n\n```java\npackage WordFrequencies;\n\
    import java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    import java.util.HashMap;\nimport java.util.Map;\n\npublic class WordFrequencies\
    \ {\n    static String cleanWord(String word) {\n        return new String(word.chars().filter(Character::isLetter).map(Character::toLowerCase).toArray(),\
    \ 0, (int) word.chars().filter(Character::isLetter).count());\n    }\n\n    public\
    \ static void main(String[] args) {\n        Map<String, Integer> wordFrequency\
    \ = new HashMap<>();\n        // 从文件读取文本\n        try (BufferedReader inputFile=\
    \ new BufferedReader(new FileReader(\"input.txt\"))) {\n            String line;\n\
    \            while ((line = inputFile.readLine()) != null) {\n               \
    \ for (String word : line.split(\" \")) {\n                    String cleanedWord\
    \ = cleanWord(word);\n                    if (!cleanedWord.isEmpty()) {\n    \
    \                    wordFrequency.put(cleanedWord, wordFrequency.getOrDefault(cleanedWord,\
    \ 0) + 1);\n                    }\n                }\n            }\n        }\
    \ catch (IOException e) {\n            e.printStackTrace();\n        }\n     \
    \   // 显示单词频率\n        System.out.println(\"Word Frequencies:\");\n        wordFrequency.forEach((key,\
    \ value) -> System.out.println(key + \": \" + value));\n    }\n}\n```\n代码列表 8-1：`WordFrequencies.java`\n\
    \n通过使用 `BufferedReader` 对象，我们逐行读取输入文件。然后，根据空格拆分每行，并处理每个单词将其转换为小写并移除非字母字符。这种处理由\
    \ `cleanWord()` 方法完成，它接收一个字符串，将其拆分为字符，然后过滤字符以只保留字母和数字。最后，它将每个字符映射为小写，并根据它们创建一个新字符串。\n\
    \n然后，我们将单词添加到 `HashMap` 中。如果单词已于 `HashMap` 中，则 `getOrDefault()` 将返回零，否则它将返回目前为止的频率。\n\
    \n最后，我们使用 `forEach()` 循环将所有单词及其频率打印到控制台。注意在 `forEach()` 的参数中使用了 lambda 表达式。\n\n\
    你可以在 GitHub 上找到此项目：\n\n`https://github.com/htset/java_exercises_dsa/tree/master/WordFrequencies`\n\
