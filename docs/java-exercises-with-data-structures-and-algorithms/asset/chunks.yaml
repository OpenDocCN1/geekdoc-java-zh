  trans: "\n`Song` 类将包含有关歌曲标题、艺术家、专辑和发行年份的信息：\n\n```java\npackage Songs;\npublic class\
    \ Song {\n    public String title;\n    public String artist;\n    public String\
    \ album;\n    public int releaseYear;\n    public Song(String title, String artist,\
    \ String album, int releaseYear) {\n        this.title = title;\n        this.artist\
    \ = artist;\n        this.album = album;\n        this.releaseYear = releaseYear;\n\
    \    }\n}\n```\n列表 6-1：`Song.java`\n\n接下来，我们定义了三个方法，用于比较：\n\n```java\npackage\
    \ Songs;\nimport java.util.Comparator;\npublic class Songs {\n    // 根据艺术家比较歌曲\n\
    \    public static int compareByArtist(Song a, Song b) {\n        return a.artist.compareTo(b.artist);\n\
    \    }\n    // 根据专辑比较歌曲\n    public static int compareByAlbum(Song a, Song b)\
    \ {\n        return a.album.compareTo(b.album);\n    }\n    // 根据发行日期比较歌曲\n  \
    \  public static int compareByReleaseDate(Song a, Song b) {\n        return a.releaseYear\
    \ - b.releaseYear;\n    }\n}\n```\n列表 6-2：`Songs.java`\n\n在前两个方法中，我们比较两个字符串，而在第三个方法中，我们比较两个整数。这些方法将被\
    \ `insertionSort()` 方法使用：\n\n```java\npublic static void insertionSort(Song[]\
    \ arr, Comparator<Song> comparator) { \n    for (int i = 1; i < arr.length; i++)\
    \ {\n        Song key = arr[i];\n        int j = i - 1;\n        // 将 arr[0..i-1]\
    \ 中大于 key 的元素\n        // 移动到其当前位置的前一个\n        while (j >= 0 && comparator.compare(arr[j],\
    \ key) > 0) {\n            arr[j + 1] = arr[j];\n            j = j - 1;\n    \
    \    }\n        arr[j + 1] = key;\n    }\n}\n```\n列表 6-3：`Songs.java`\n\n我们使用\
    \ `Comparator` 接口是为了使用之前定义的 3 个静态方法之一。该接口随后被用作 `insertionSort()` 方法的参数，指定对 `Song`\
    \ 数组排序的比较逻辑。\n\n例如，如果我们像这样调用 `insertionSort()`：\n\n`insertionSort(songs, Songs::compareByArtist);`\n\
    \n那么，`insertionSort()` 内部的后续代码：\n\n`while (j >= 0 && comparator.compare(arr[j],\
    \ key) > 0)`\n\n将导致调用 `compareByArtist()` 方法。通过这样，我们不需要为了适应三种不同的比较类型而编写三次 `insertionSort()`。\n\
    \n请注意，我们本质上是在使用带有静态方法引用的 Lambda 表达式。我们可以通过更传统的方式来实现，即创建三个实现 `Comparator` 接口的类，如下：\n\
    \n```java\n// 用于按艺术家比较歌曲的 Comparator 类\nclass CompareByArtist implements Comparator<Song>\
    \ {\n    @Override\n    public int compare(Song a, Song b) {\n        return a.artist.compareTo(b.artist);\n\
    \    }\n}\n```\n列表 6-4：`Songs.java`\n\n然后我们像这样调用 `insertionSort()`：\n\n`insertionSort(songs,\
    \ new CompareByArtist());`\n\n插入排序的工作原理是取数组中的每个元素，并将其移动到数组左侧的排序位置。在任何时刻，数组的左部分都是排序的，而我们从右部分获取项目。当我们把一个元素移动到数组中的某个位置时，右侧的所有项目都必须向右移动一位。\n\
    \n这一切在 `main()` 方法中都得到了说明，在该方法中我们调用了三次 `insertionSort()`，每次传递一个不同的比较方法。每次，数组都以不同的方式进行排序：\n\
    \n```java\npublic static void main(String[] args) {\n    Song[] songs = {\n  \
    \      new Song(\"Song1\", \"Artist2\", \"Album1\", 2010),\n        new Song(\"\
    Song2\", \"Artist1\", \"Album2\", 2005),\n        new Song(\"Song3\", \"Artist3\"\
    , \"Album1\", 2015),\n        new Song(\"Song4\", \"Artist4\", \"Album3\", 2008),\n\
    \        new Song(\"Song5\", \"Artist1\", \"Album2\", 2003),\n        new Song(\"\
    Song6\", \"Artist3\", \"Album4\", 2019),\n        new Song(\"Song7\", \"Artist2\"\
    , \"Album3\", 2012),\n        new Song(\"Song8\", \"Artist4\", \"Album4\", 2017),\n\
    \        new Song(\"Song9\", \"Artist5\", \"Album5\", 2014),\n        new Song(\"\
    Song10\", \"Artist5\", \"Album5\", 2011)\n    };\n    // 按艺术家排序\n    insertionSort(songs,\
    \ Songs::compareByArtist);\n    System.out.println(\"Sorted by Artist:\");\n \
    \   for (Song song : songs) {\n        System.out.println(song.title + \" from\
    \ \" + song.artist);\n    }\n    System.out.println();\n    // 按专辑排序\n    insertionSort(songs,\
    \ Songs::compareByAlbum);\n    System.out.println(\"Sorted by Album:\");\n   \
    \ for (Song song : songs) {\n        System.out.println(song.title + \" from \"\
    \ + song.artist);\n    }\n    System.out.println();\n    // 按发行日期排序\n    insertionSort(songs,\
    \ Songs::compareByReleaseDate);\n    System.out.println(\"Sorted by Release Date:\"\
    );\n    for (Song song : songs) {\n        System.out.println(song.title + \"\
    \ from \" + song.artist);\n    }\n}\n```\n列表 6-5：`Songs.java`\n\n你可以在 GitHub 上找到这个项目：\n\
    \n`https://github.com/htset/java_exercises/tree/master`\n\n## 解决方案\n\n我们将创建一个用户可以输入任务的程序。我们将使用优先级队列来表示差异。\n\
    \n让我们先定义 `Task` 和 `Worker` 类：\n\n```java\npackage TaskAllocation;\npublic class\
    \ Task {\n    public String description;\n    public int duration;\n    public\
    \ Task(String description, int duration) {\n        this.description = description;\n\
    \        this.duration = duration;\n    }\n}\n```\n列表 7-1：`Task.java`\n\n```java\n\
