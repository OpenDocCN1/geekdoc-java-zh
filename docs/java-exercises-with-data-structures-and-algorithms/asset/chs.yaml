  \ x) {\n    InventoryNode y = x.right;\n    InventoryNode T2 = y.left;\n    //执行旋转\n\
  \    y.left = x;\n    x.right = T2;\n    //更新高度\n    x.height = Math.max(getHeight(x.left),\
  \ getHeight(x.right)) + 1;\n    y.height = Math.max(getHeight(y.left), getHeight(y.right))\
  \ + 1;\n    //返回新根节点\n    return y;}\n```\n列表 12-4：`Inventory.java`\n\n这两个方法将在我们尝试向树中插入新节点时使用：\n\
  \n```java\n//在 AVL 树中插入产品\nprivate InventoryNode insertProduct(Node node, Product\
  \ product) {\n    if (node == null)\n        return newNode(product);\n    // 插入产品\n\
  \    if (product.id < node.product.id)\n        node.left = insertProduct(node.left,\
  \ product);\n    else if (product.id > node.product.id)\n        node.right = insertProduct(node.right,\
  \ product);\n    else\n        return node; // 不允许重复 ID\n    // 更新此节点的高度\n    node.height\
  \ = 1 + Math.max(getHeight(node.left), getHeight(node.right));\n    // 获取平衡因子\n\
  \    int balance = getBalance(node);\n    // 左左情况\n    if (balance > 1 && product.id\
  \ < node.left.product.id)\n        return rotateRight(node);\n    // 右右情况\n    if\
  \ (balance < -1 && product.id > node.right.product.id)\n        return rotateLeft(node);\n\
  \    // 左右情况\n    if (balance > 1 && product.id > node.left.product.id) {\n    \
  \    node.left = rotateLeft(node.left);\n        return rotateRight(node);\n   \
  \ }\n    // 右左情况\n    if (balance < -1 && product.id < node.right.product.id) {\n\
  \        node.right = rotateRight(node.right);\n        return rotateLeft(node);\n\
  \    }\n    return node;}\n```\n列表 12-5：`Inventory.java`\n\n这里的思想是在向树插入新节点后检查树的平衡。如果树变得不平衡，我们必须向左或向右对其进行旋转。\n\
  \n接下来，我们展示在打印树内容的同时遍历树的方法，以及在树中搜索特定产品代码：\n\n```java\nprivate void traverseTree(InventoryNode\
