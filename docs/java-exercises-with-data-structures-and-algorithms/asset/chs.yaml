  \    }\n    return 0;\n}\n```\n列表 10-7: `Maze.java`\n\n# 11. 文件索引器\n\n在这个练习中，我们将创建一个程序，递归地索引指定文件夹中的所有文件。索引文件的信息（文件名和在磁盘上的位置）将存储在二叉搜索树\
  \ (BST) 中，以便快速搜索。\n\n二叉搜索树结构是一种每个节点只有两个子节点（左和右）的树。这里是该类的定义：\n\n\n\n\n```java\npackage\
  \ FileIndexer;\nimport java.io.*;\nimport java.nio.file.*;\nimport java.util.Scanner;\n\
  class FileIndexer {\n    private class Node {\n        public String fileName;\n\
