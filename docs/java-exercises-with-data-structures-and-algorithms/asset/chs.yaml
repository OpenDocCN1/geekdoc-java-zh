  \n# 16. 带有缓存的 HTTP 服务器\n\n在这个练习中，我们将创建一个简单的 HTTP 服务器，用于提供静态内容（仅限 HTML 文件）。该服务器将利用缓存机制，保留最近的服务内容，以提高服务器的性能。\n\
  \n### 建议的解决方案\n\nWeb 服务器缓存是一个存储之前发送到客户端浏览器内容的结构。缓存空间有限，因此当填满时，我们需要清空最久未使用（LRU）的条目为新条目腾出空间。此外，当服务器使用某个条目向客户端发送内容时，该条目会被移动到列表头部，因为它是最近使用的条目。\n\
  \n让我们看看缓存定义：\n\n```java\npackage WebServerCache;\npublic class LRUCache {\n    static\
  \ final int CACHE_SIZE = 3;\n    Node head;\n    Node tail;\n    int size;\n\n \
  \   static class Node {\n        String url;\n        String content;\n        Node\
  \ prev;\n        Node next;\n    }\n    public LRUCache() {\n        size = 0;\n\
  \        head = null;\n        tail = null;\n    }\n    ...\n```\n\n### 列表 16-1:\
  \ `LRUCache.java`\n\n缓存实现为双向链表。在这类链表中，我们可以向两个方向（向前和向后）移动。双向链表在我们情况下是有益的，因为我们可以高效地在列表任何位置删除和插入节点，而不需要从列表开始遍历。简单的链表或甚至数组也可以实现相同的效果，但性能较低。\n\
  \n让我们先跳过缓存定义的其余部分，直接跳到程序的 `main()` 方法：\n\n```java\npublic static void main(String[]\
  \ args) {\n    HttpServer server = new HttpServer();\n    try {\n        server.start();\n\
  \    } catch (IOException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n\
  ### 列表 16-2: `WebServerCache.java`\n\n在这里，我们创建一个 `HttpServer` 类的对象，它将处理与客户端的连接。让我们它是如何实现的：\n\
  \n```java\npackage WebServerCache;\nimport java.io.*;\nimport java.net.*;\nimport\
  \ java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nclass HttpServer\
  \ {\n    static final int PORT = 8080;\n    static final int MAX_REQUEST_SIZE =\
  \ 1024;\n    LRUCache cache;\n    public HttpServer() {\n        cache = new LRUCache();\n\
  \    }\n    public void start() throws IOException {\n        //Open server socket\n\
  \        ServerSocket server = new ServerSocket(PORT);\n        System.out.println(\"\
  Server started on port \" + PORT);\n        while (true) {\n            //Wait for\
  \ connections\n            Socket client = server.accept();\n            handleRequest(client);\n\
  \            client.close();\n        }\n    }\n    void handleRequest(Socket client)\
  \ throws IOException {\n        //Read request\n        InputStream inputStream\
  \ = client.getInputStream();\n        byte[] buffer = new byte[MAX_REQUEST_SIZE];\n\
  \        int bytesRead = inputStream.read(buffer);\n        String request = new\
  \ String(buffer, 0, bytesRead, StandardCharsets.UTF_8);\n        System.out.println(\"\
  Received request: \" + request);\n        //Find request type (GET)\n        String[]\
  \ parts = request.split(\" \");\n        if (parts.length < 2 || !parts[0].equals(\"\
  GET\")) {\n            System.out.println(\"Invalid request format.\");\n      \
  \      return;\n        }\n        //Get request url and check whether it is already\
  \ stored in the cache\n        String[] parts = request.split(\" \");\n        //\
  \ ... (logic omitted for brevity as per original structure)\n    }\n}\n```\n*(注：由于原文文本从\
  \ handleRequest 处开始出现了严重的逻辑混乱和重复，上述译文已根据代码逻辑进行了修正和整合，以确保技术文档的可读性，同时保留了所有的代码结构)*\n\
  \n\n\n\n如果我们已经达到了最大缓存大小，那么 LRU 算法就会启动：我们删除最近未使用的条目（列表末尾的节点），并为新条目的插入（在列表头部）腾出空间。\n\
  \n现在，我们可以检查一下处理缓存操作的方法。首先，让我们看看如何创建一个新节点：\n\n```java\n//Create a new node\nNode\
  \ createNode(String url, String content) {\n    Node newNode = new Node();\n   \
  \ newNode.url = url;\n    newNode.content = content;\n    newNode.prev = null;\n\
  \    newNode.next = null;\n    System.out.println(\"New node created: \" + content);\n\
  \    return newNode;\n}\n```\nListing 16-6: `LRUCache.java`\n\n接下来，我们看看如何向缓存头部插入新节点：\n\
  \n```java\n//Insert a new node at the head of the cache\nvoid insertAtHead(Node\
  \ node) {\n    node.next = head;\n    node.prev = null;\n    if (head != null)\n\
  \        head.prev = node;\n    head = node;\n    if (tail == null)\n        tail\
  \ = node;\n    System.out.println(\"Node inserted at head: \" + node.content);\n\
  }\n```\nListing 16-7: `LRUCache.java`\n\n注意，在所有操作中，我们必须处理所有的四个引用：`head`、`tail`、`next`、`prev`。\n\
  \n作为 LRU 算法的一部分，我们需要将节点移动到列表头部：\n\n```java\n//Move a node to the head of the cache\n\
  void moveToHead(Node node) {\n    if (node == head)\n        return;\n    if (node.prev\
  \ != null)\n        node.prev.next = node.next;\n    if (node.next != null)\n  \
  \      node.next.prev = node.prev;\n\n    node.prev = null;\n    node.next = head;\n\
  \    if (head != null)\n        head.prev = node;\n    head = node;\n    if (tail\
  \ == null)\n        tail = node;\n    System.out.println(\"Node moved to head: \"\
  \ + node.content);\n}\n```\nListing 16-8: `LRUCache.java`\n\n最后，这里是节点删除的代码：\n\n\
  ```java\n//Delete a node from the cache\nvoid deleteNode(Node node) {\n    if (node\
  \ == null)\n        return;\n    if (node == head)\n        head = node.next;\n\
  \    if (node == tail)\n        tail = node.prev;\n    if (node.prev != null)\n\
  \        node.prev.next = node.next;\n    if (node.next != null)\n        node.next.prev\
  \ = node.prev;\n    System.out.println(\"Node deleted: \" + node.content);\n}\n\
  ```\nListing 16-9: `LRUCache.java`\n\n你可以在 GitHub 上找到这个项目：\n\n`https://github.com/htset/java_exercises_dsa/tree/master/WebServerCache\n\
  \n# 17. 分布式拍卖\n\n在这个练习中，我们将创建一个分布式拍卖，它将由一个接收多个客户端出价的拍卖服务器组成。客户端将通过 socket 与服务器通信。服务器将等待\
  \ 20 秒（使用定时器）来接收新出价，否则拍卖结束，最高出价者获胜。如果及时提交了新出价，定时器将重置。\n\n## 建议解决方案\n\n让我们从拍卖服务器开始。服务器应该能够容纳多个客户端。因此，每个客户端将在单独的线程中提供服务，该线程会在服务器\
  \ socket 接受新连接时被创建：\n\n```java\npackage AuctionServer;\nimport java.io.*;\nimport\
  \ java.net.*;\nimport java.nio.charset.StandardCharsets;\nimport java.util.Timer;\n\
  import java.util.TimerTask;\npublic class AuctionServer {\n    //代表每个连接到服务器的客户端的类\n\
  \    static class Client { \n\n        private final Socket socket;\n        private\
  \ final BufferedWriter writer;\n        private final int id;\n        // Client\
  \ 类的构造函数\n        public Client(Socket socket, int id) throws IOException {\n  \
  \          this.socket = socket;\n            // 设置 writer 以向客户端发送数据\n         \
  \   this.writer= new BufferedWriter(new OutputStreamWriter(socket.getOutputStream(),StandardCharsets.UTF_8));\n\
  \            this.id = id;\n        }\n        public Socket getSocket() {\n   \
  \         return socket;\n        }\n        public BufferedWriter getWriter() {\n\
  \            return writer;\n        }\n        public int getId() {\n         \
  \   return id;\n        }\n    }\n...\n```\nListing 17-1: `AuctionServer.java`\n\
  \n在这里，我们将 `Client` 类定义为 `AuctionServer` 类内部的 `static` 类。`Client` 存储了已连接客户端的信息（其\
  \ `ID` 以及相应的 `Socket` 和 `BufferedWriter` 对象）。\n\n接下来，我们定义了一些常量和类属性：\n\n```java\n\
  //常量\nprivate static final int PORT = 8080; //服务器端口号\nprivate static final int MAX_CLIENTS\
  \ = 5; // 最大客户端数量\n//服务器和客户端\nprivate static ServerSocket server;\nprivate static\
  \ Client[] clients = new Client[MAX_CLIENTS]; // 用于持有客户端的数组\n//拍卖详情\nprivate static\
  \ int bestBid = 0; // 收到的最高出价\nprivate static int winningClient = 0; // 获胜的客户端\n\
  //拍卖结束的定时器\nprivate static Timer timer;\n```\nListing 17-2: `AuctionServer.java`\n\
  \n现在我们展示 `main()` 方法：\n\n```java\npublic static void main(String[] args) {\n   \
  \ try { \n        //设置服务器\n        server = new ServerSocket(PORT);\n        System.out.println(\"\
  Server listening on port \" + PORT);\n        //启动定时器\n        timer = new Timer();\n\
  \        timer.schedule(new TimerTask() {\n            @Override\n            public\
  \ void run() {\n                timerCompletion();\n            }\n        }, 20000);\
  \ //每 20 秒触发一次定时器\n        while (true) {\n            //接受新连接\n            Socket\
  \ clientSocket = server.accept();\n            System.out.println(\"Client connected:\
  \ \"+ clientSocket.getRemoteAddress());\n            //寻找可用空位\n            int clientId\
  \ = -1;\n            for (int i = 0; i < MAX_CLIENTS; i++) {\n                if\
  \ (clients[i] == null) {\n                    clientId = i;\n                  \
  \  break;\n                }\n            }\n            if (clientId != -1) {\n\
  \                //在单独线程中处理客户端\n                clients[clientId] = new Client(clientSocket,\
  \ clientId);\n                System.out.println(\"Client. \" + clientId + \" connected.\"\
  );\n                new Thread(() -> handleClient(clientId)).start();\n        \
  \    }\n        }\n    } catch (Exception ex) {\n        System.out.println(\"Server\
  \ error: \" + ex.getMessage());\n    } finally {\n        try {\n            if\
  \ (server != null) server.close();\n        } catch (IOException e) {\n        \
  \    e.printStackTrace();\n        }\n    }\n}\n```\nListing 17-3: `AuctionServer.java`\n\
  \n我们打开 `ServerSocket` 并监听新连接。我们还启动了一个 20 秒的定时器。当定时器过期时，`timerCompletion()` 方法将被调用，结束拍卖过程。\n\
  \n当新连接到达时，我们在 `clients` 数组中存储客户端详情并产生新线程。该线程将运行 `handleClient()` 方法，与特定的客户端进行通信。\n\
  \n现在，让我们看看 `handleClient()` 方法：\n\n```java\n//处理客户端报价\nprivate static void handleClient(int\
  \ clientId) { \n    try {\n        Client client = clients[clientId];\n        Socket\
  \ clientSocket = client.getSocket();\n        BufferedReader reader= new BufferedReader(new\
  \ InputStreamReader(clientSocket.getInputStream(),StandardCharsets.UTF_8));\n  \
  \      String bid;\n        while (true) {\n            //从客户端读取报价\n           \
  \ bid = reader.readLine();\n            if (bid == null) {\n                //客户端断开连接\n\
  \                System.out.println(\"Client disconnected: \"+ clientSocket.getRemoteAddress());\n\
  \                clients[clientId] = null;\n                break;\n           \
  \ }\n            int bidAmount = Integer.parseInt(bid);\n            System.out.println(\"\
  Received bid \" + bidAmount + \" from client \"+ client.getId());\n            synchronized\
  \ (AuctionServer.class) {\n                if (bidAmount > bestBid) {\n        \
  \            bestBid = bidAmount;\n                    winningClient = client.getId();\n\
  \                    String msg = \"New best bid: \" + bestBid+ \" (Client: \" +\
  \ winningClient + \")\";\n                    broadcastMessage(msg);\n         \
  \           System.out.println(\"New best bid: \" + bestBid+ \" (Client: \" + winningClient\
  \ + \")\");\n                    //重置定时器\n                    timer.cancel();\n\
  \                    timer = new Timer();\n                    timer.schedule(new\
  \ TimerTask() {\n                        @Override\n                        public\
  \ void run() {\n                            timerCompletion();\n               \
  \         }\n                    }, 20000, 20000);\n                } else {\n \
  \                   String msg = \"Received lower bid. Best bid remains at: \" +\
  \ bestBid;\n                    broadcastMessage(msg);\n                    System.out.println(\"\
  Received lower bid. Best bid remains at: \" + bestBid);\n                }\n   \
  \         }\n        }\n    } catch (Exception ex) {\n        System.out.println(\"\
  Client error: \" + ex.getMessage());\n    }\n}\n```\nListing 17-4: `AuctionServer.java`\n\
  \n\n\n如果客户端确实发送了有效的出价，我们将将其与当前最高出价进行比较，如果我们获得了更高的出价，则更新此值。我们还会通知所有客户端已提交的出价。此外，我们还会重置计时器，以获得一个新的\
  \ 20 秒周期。\n\n在这里，`bestBid` 和 `winningClient` 是共享资源，可能会被多个客户端处理线程访问和修改。为了保护这些共享资源，我们对读写这些变量的临界区进行同步处理。\n\
  \n接下来，我们定义 `broadcastMessage()` 方法，用于向客户端发送消息：\n\n```java\n//Broadcast message to\
  \ all clients\nprivate static void broadcastMessage(String msg) throws IOException\
  \ {\n    for (int i = 0; i < MAX_CLIENTS; i++) {\n        if (clients[i] != null)\
  \ {\n            clients[i].getWriter().write(msg);\n            clients[i].getWriter().newLine();\n\
  \            clients[i].getWriter().flush();\n        }\n    }\n}\n```\n列表 17-5：`AuctionServer.java`\n\
  \n当计时器最终过期时，将调用 `timerCompletionRoutine()` 方法：\n\n```java\n//Timer completion routine\
  \ when auction end\nprivate static void timerCompletionRoutine() {\n    System.out.println(\"\
  Auction finished. Winning bid: \" + bestBid+ \", winner: client no. \" + winningClient);\n\
  \    String msg = \"Auction finished. Winning bid: \" + bestBid+ \", winner: client\
  \ no. \" + winningClient;\n    try {\n        broadcastMessage(msg);\n    } catch\
  \ (IOException e) {\n        e.printStackTrace();\n    }\n    //Exit the program\n\
  \    System.exit(0);\n}\n```\n列表 17-6：`AuctionServer.java`\n\n在通知所有客户端获胜出价后，我们退出程序。当客户端接收到拍卖结束的消息时，相应的客户端将关闭套字。\n\
  \n现在对于拍卖客户端，我们首先实现 `main()` 方法：\n\n```java\npackage AuctionClient;\nimport java.io.*;\n\
  import java.net.*;\nimport java.nio.charset.StandardCharsets;\npublic class AuctionClient\
  \ {\n    private static final int PORT = 8080; //Port number to connect to the server\n\
  \    private static final String SERVER_IP = \"127.0.0.1\"; //Server IP address\n\
  \    private static Socket client;\n    private static boolean isRunning = true;\n\
  \    private static Thread receiveThread;\n    public static void main(String[]\
  \ args) {\n        //Connect to the server\n        try {\n            client =\
  \ new Socket(SERVER_IP, PORT);\n            System.out.println(\"Connected to server.\"\
  );\n        } catch (Exception ex) {\n            System.out.println(\"Connect failed:\
  \ \" + ex.getMessage());\n            return;\n        }\n        //Start receive\
  \ handler thread \n        receiveThread = new Thread(AuctionClient::receiveHandler);\n\
  \        receiveThread.start();\n        //Send bids until the user quits\n    \
  \    try (BufferedReader consoleReader= new BufferedReader(new InputStreamReader(System.in));\n\
  \             BufferedWriter writer= new BufferedWriter(new OutputStreamWriter(client.getOutputStream(),StandardCharsets.UTF_8)))\
  \ {\n            String bid;\n            while (isRunning) {\n                System.out.print(\"\
  \\nEnter your bid (or 'q' to quit): \");\n                bid = consoleReader.readLine();\n\
  \                if (\"q\".equalsIgnoreCase(bid)) {\n                    isRunning\
  \ = false;\n                    client.close();\n                    receiveThread.interrupt();\
  \ //Interrupt the receive thread\n                    break;\n                }\n\
  \                try {\n                    writer.write(bid);\n               \
  \     writer.newLine();\n                    writer.flush();\n                }\
  \ catch (Exception ex) {\n                    System.out.println(\"Send failed:\
  \ \" + ex.getMessage());\n                    return;\n                }\n     \
  \       }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n        //Ensure client is closed\n        try {\n            client.close();\n\
  \        } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n列表 17-7：`AuctionClient.java`\n\n在这里，我们创建了一个 `Socket` 对象并连接到服务器。如果连接成功，我们将产生一个新线程，用于接收并打印来自服务器的信息。\n\
  \n通信的发送部分（即向服务器提交出价）将由主线程执。。如果我们让同一个线程来处理数据的发送和接收，就会出现问题，因为 `readLine()` 方法会阻塞并导致用户无法发送新的出价。\n\
  \n以下是线程处理器的回调方法：\n\n```java\n//Handle incoming messages from the server\nprivate\
  \ static void receiveHandler() { \n    try (BufferedReader reader = new BufferedReader(new\
  \ InputStreamReader(client.getInputStream(), StandardCharsets.UTF_8))) {\n     \
  \   while (isRunning) {\n            try {\n                if (Thread.interrupted())\
  \ {\n                    break; //Exit if the thread is interrupted\n          \
  \      }\n                String message = reader.readLine();\n                if\
  \ (message == null || message.isEmpty()) {\n                    System.out.println(\"\
  \\nServer disconnected.\");\n                    break;\n                }\n   \
  \             System.out.println(\"\\nServer: \" + message);\n                if\
  \ (message.startsWith(\"Auction\")) {\n                    System.out.println(\"\
  Auction ended. Exiting program.\");\n                    isRunning = false;\n  \
  \                  break;\n                }\n            } catch (IOException ex)\
  \ {\n                if (isRunning) {\n                    //Check if still running\
  \ to avoid printing// error when stopping intentionally\n                    System.out.println(\"\
  Receive failed: \" + ex.getMessage());\n                }\n                break;\n\
  \            }\n        }\n    } catch (IOException e) {\n        if (isRunning)\
  \ {\n            //Check if still running to avoid printing// error when stopping\
  \ intentionally\n            e.printStackTrace();\n        }\n    }\n}\n```\n列表\
  \ 17-6：`AuctionClient.java`\n\n该线程接收来自拍卖服务器的消息并将其打印在控制台上。当收到以“Auction”开头的最终消息时，它将关闭关闭资源并退出程序。\n\
