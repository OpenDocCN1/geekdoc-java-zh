  \n# 5. 优先级待办事项列表\n\n我们将实现一个简单的待办事项应用程序。每个条目将包含任务描述以及一个表示其优先级的数字（最高优先级等于 1）。\n\n\
  待办事项列表将使用链表实现。除了添加、删除和显示任务的功能外，还将使用冒泡排序对链表进行排序。\n\n### 建议的解决方案\n\n首先来看 `Todo.java`\
  \ 中的 `main()` 方法：\n\n```java\npackage Todo;\nimport java.util.Scanner;\npublic class\
  \ Todo {\n    public static void main(String[] args) {\n        TodoList list =\
  \ new TodoList();\n        Scanner scanner = new Scanner(System.in);\n        int\
  \ choice = 0;\n        String description;\n        int priority;\n        int index;\n\
  \        do {\n            try {\n                System.out.println(\"\\nTo-Do\
  \ List Manager\");\n                System.out.println(\"1\\. Add Task\");\n   \
  \             System.out.println(\"2\\. Remove Task\");\n                System.out.println(\"\
  3\\. Display Tasks\");\n                System.out.println(\"4\\. Sort Tasks by\
  \ Priority\");\n                System.out.println(\"0\\. Exit\");\n           \
  \     System.out.print(\"Enter your choice: \");\n                choice = Integer.parseInt(scanner.nextLine());\n\
  \                switch (choice) {\n                    case 1:\n              \
  \          System.out.print(\"Enter task description: \");\n                   \
  \     description = scanner.nextLine();\n                        System.out.print(\"\
  Enter priority: \");\n                        priority = Integer.parseInt(scanner.nextLine());\n\
  \                        list.addTask(description, priority);\n                \
  \        System.out.println(\"Task added successfully.\");\n                   \
  \     break;\n                    case 2:\n                        System.out.print(\"\
  Enter number of task to remove: \");\n                        index = Integer.parseInt(scanner.nextLine());\n\
  \                        list.removeTask(index - 1);\n                        System.out.println(\"\
  Task removed successfully.\");\n                        break;\n               \
  \     case 3:\n                        System.out.println(\"List of tasks:\");\n\
  \                        list.displayTasks();\n                        break;\n\
  \                    case 4:\n                        list.sortTasks();\n      \
  \                  System.out.println(\"Tasks sorted by priority.\");\n        \
  \                break;\n                    case 0:\n                        System.out.println(\"\
  Exiting...\");\n                        break;\n                    default:\n \
  \                       System.out.println(\"Invalid choice. Please try again.\"\
  );\n                        break;\n                }\n            } catch (NumberFormatException\
  \ e) {\n                System.out.println(\"Invalid input. Please enter a number.\"\
  );\n            }\n        } while (choice != 0);\n        scanner.close();\n  \
  \  }\n}\n```\nListing 5-1: `Todo.java`\n\n`main` 方法处理用户输入并调用链表的相应方法。\n\n这里是 `Task`\
  \ 类的定义：\n\n```java\npackage Todo;\npublic class Task {\n    public String description;\n\
  \    public int priority;\n    public Task next;\n    public Task() {\n    }\n}\n\
  ```\nListing 5-2: `Task.java`\n\n链表由 `Task` 节点组成。`head` 变量指向链表的头部：\n\n```java\n\
  package Todo;\npublic class TodoList {\n    private Task head;\n    private int\
  \ size;\n\n    public TodoList() {\n```\nListing 5-3: `TodoList.java`\n\n构造函数初始化链表结构。\n\
  \n`addTask()` 方法创建一个新节点并将其插入链表末尾：\n\n```java\npublic void addTask(String description,\
  \ int priority) {\n    Task task = new Task();\n    task.description = description;\n\
  \    task.priority = priority;\n    task.next = null;\n\n    if (head == null) {\n\
  \        // List is empty\n        head = task;\n    } else {\n        Task temp\
  \ = head;\n        // Find the last node\n        while (temp.next != null) {\n\
  \            temp = temp.next;\n        }\n        // Insert the task after the\
  \ last node\n        temp.next = task;\n    }\n    size++;\n}\n```\nListing 5-4:\
  \ `TodoList.java`\n\n接下来，我们定义 `removeTask()` 方法：\n\n```java\npublic void removeTask(int\
  \ index) {\n    if (head == null) {\n        System.out.println(\"List is empty.\"\
  );\n        return;\n    }\n    if (index == 0) {\n        // We remove the first\
  \ item in the list\n        Task temp = head;\n        head = head.next;\n     \
  \   temp = null;\n        size--;\n        return;\n    }\n\n    Task previous =\
  \ null;\n    Task current = head;\n    int i = 0;\n    // Go to selected index\n\
  \    while (current != null && i < index) {\n        previous = current;\n     \
  \   current = current.next;\n        i++;\n    }\n    if (current == null) {\n \
  \       System.out.println(\"Index out of bounds.\");\n        return;\n    }\n\
  \    previous.next = current.next;\n    current = null;\n    size--;\n}\n```\nListing\
  \ 5-5: `TodoList.java`\n\n待办事项列表的参数是链表中的索引，我们在任务列表期间显示。\n\n这里是任务列表的代码：\n\n```java\n\
  public void displayTasks() {\n    Task temp = head;\n    int i = 1;\n    while (temp\
  \ != null) {\n        System.out.println(i++ + \") Description: \" + temp.description+\
  \ \", Priority: \" + temp.priority);\n        temp = temp.next;\n    }\n}\n```\n\
  Listing 5-6: `TodoList.java`\n\n最后，我们展示根据优先级排序任务的代码：\n\n```java\npublic void sortTasks()\
  \ {\n    int swapped;\n    Task ptr1;\n    Task ptr2 = null;\n    if (head == null)\
  \ return;\n    do {\n        swapped = 0; // will change if swapping happens\n \
  \       ptr1 = head;\n        while (ptr1.next != ptr2) {\n            // Swap data\
  \ of adjacent nodes\n            if (ptr1.priority > ptr1.next.priority) {\n   \
  \             int tempPriority = ptr1.priority;\n                ptr1.priority =\
  \ ptr1.next.priority;\n                ptr1.next.priority = tempPriority;\n\n  \
  \              String tempDescription = ptr1.description;\n                ptr1.description\
  \ = ptr1.next.description;\n                ptr1.next.description = tempDescription;\n\
  \                swapped = 1; //swap happened in this loop pass; don't stop yet\n\
  \            }\n            ptr1 = ptr1.next;\n        }\n        ptr2 = ptr1;\n\
  \    } while (swapped != 0); //quit loop when no swap happened\n}\n```\nListing\
  \ 5-7: `TodoList.java`\n\n代码采用冒泡排序算法执行任务排序操作。在冒泡排序中，我们对链表进行多次遍历。每当我们发现一个任务的优先级低于下一个任务时，就会对这些相邻任务进行交换。随着时间的推移，所有条目将根据优先级进行排序，最终会出现一次没有发生交换的循环。这就是算法结束的时候。\n\
  \n# 6.        歌曲列表\n\n我们将创建一个简单的程序，接收一个歌曲数组并按照艺术家、专辑或发行日期对其排序，使用插入排序。\n\n\n\n\n\
  `Song` 类将包含有关歌曲标题、艺术家、专辑和发行年份的信息：\n\n```java\npackage Songs;\npublic class Song\
  \ {\n    public String title;\n    public String artist;\n    public String album;\n\
  \    public int releaseYear;\n    public Song(String title, String artist, String\
  \ album, int releaseYear) {\n        this.title = title;\n        this.artist =\
  \ artist;\n        this.album = album;\n        this.releaseYear = releaseYear;\n\
  \    }\n}\n```\n列表 6-1：`Song.java`\n\n接下来，我们定义了三个方法，用于比较：\n\n```java\npackage Songs;\n\
  import java.util.Comparator;\npublic class Songs {\n    // 根据艺术家比较歌曲\n    public\
  \ static int compareByArtist(Song a, Song b) {\n        return a.artist.compareTo(b.artist);\n\
  \    }\n    // 根据专辑比较歌曲\n    public static int compareByAlbum(Song a, Song b) {\n\
  \        return a.album.compareTo(b.album);\n    }\n    // 根据发行日期比较歌曲\n    public\
  \ static int compareByReleaseDate(Song a, Song b) {\n        return a.releaseYear\
  \ - b.releaseYear;\n    }\n}\n```\n列表 6-2：`Songs.java`\n\n在前两个方法中，我们比较两个字符串，而在第三个方法中，我们比较两个整数。这些方法将被\
  \ `insertionSort()` 方法使用：\n\n```java\npublic static void insertionSort(Song[] arr,\
  \ Comparator<Song> comparator) { \n    for (int i = 1; i < arr.length; i++) {\n\
  \        Song key = arr[i];\n        int j = i - 1;\n        // 将 arr[0..i-1] 中大于\
  \ key 的元素\n        // 移动到其当前位置的前一个\n        while (j >= 0 && comparator.compare(arr[j],\
  \ key) > 0) {\n            arr[j + 1] = arr[j];\n            j = j - 1;\n      \
  \  }\n        arr[j + 1] = key;\n    }\n}\n```\n列表 6-3：`Songs.java`\n\n我们使用 `Comparator`\
  \ 接口是为了使用之前定义的 3 个静态方法之一。该接口随后被用作 `insertionSort()` 方法的参数，指定对 `Song` 数组排序的比较逻辑。\n\
  \n例如，如果我们像这样调用 `insertionSort()`：\n\n`insertionSort(songs, Songs::compareByArtist);`\n\
  \n那么，`insertionSort()` 内部的后续代码：\n\n`while (j >= 0 && comparator.compare(arr[j],\
  \ key) > 0)`\n\n将导致调用 `compareByArtist()` 方法。通过这样，我们不需要为了适应三种不同的比较类型而编写三次 `insertionSort()`。\n\
  \n请注意，我们本质上是在使用带有静态方法引用的 Lambda 表达式。我们可以通过更传统的方式来实现，即创建三个实现 `Comparator` 接口的类，如下：\n\
  \n```java\n// 用于按艺术家比较歌曲的 Comparator 类\nclass CompareByArtist implements Comparator<Song>\
  \ {\n    @Override\n    public int compare(Song a, Song b) {\n        return a.artist.compareTo(b.artist);\n\
  \    }\n}\n```\n列表 6-4：`Songs.java`\n\n然后我们像这样调用 `insertionSort()`：\n\n`insertionSort(songs,\
  \ new CompareByArtist());`\n\n插入排序的工作原理是取数组中的每个元素，并将其移动到数组左侧的排序位置。在任何时刻，数组的左部分都是排序的，而我们从右部分获取项目。当我们把一个元素移动到数组中的某个位置时，右侧的所有项目都必须向右移动一位。\n\
  \n这一切在 `main()` 方法中都得到了说明，在该方法中我们调用了三次 `insertionSort()`，每次传递一个不同的比较方法。每次，数组都以不同的方式进行排序：\n\
  \n```java\npublic static void main(String[] args) {\n    Song[] songs = {\n    \
  \    new Song(\"Song1\", \"Artist2\", \"Album1\", 2010),\n        new Song(\"Song2\"\
  , \"Artist1\", \"Album2\", 2005),\n        new Song(\"Song3\", \"Artist3\", \"Album1\"\
  , 2015),\n        new Song(\"Song4\", \"Artist4\", \"Album3\", 2008),\n        new\
  \ Song(\"Song5\", \"Artist1\", \"Album2\", 2003),\n        new Song(\"Song6\", \"\
  Artist3\", \"Album4\", 2019),\n        new Song(\"Song7\", \"Artist2\", \"Album3\"\
  , 2012),\n        new Song(\"Song8\", \"Artist4\", \"Album4\", 2017),\n        new\
  \ Song(\"Song9\", \"Artist5\", \"Album5\", 2014),\n        new Song(\"Song10\",\
  \ \"Artist5\", \"Album5\", 2011)\n    };\n    // 按艺术家排序\n    insertionSort(songs,\
  \ Songs::compareByArtist);\n    System.out.println(\"Sorted by Artist:\");\n   \
  \ for (Song song : songs) {\n        System.out.println(song.title + \" from \"\
  \ + song.artist);\n    }\n    System.out.println();\n    // 按专辑排序\n    insertionSort(songs,\
  \ Songs::compareByAlbum);\n    System.out.println(\"Sorted by Album:\");\n    for\
  \ (Song song : songs) {\n        System.out.println(song.title + \" from \" + song.artist);\n\
  \    }\n    System.out.println();\n    // 按发行日期排序\n    insertionSort(songs, Songs::compareByReleaseDate);\n\
  \    System.out.println(\"Sorted by Release Date:\");\n    for (Song song : songs)\
  \ {\n        System.out.println(song.title + \" from \" + song.artist);\n    }\n\
  }\n```\n列表 6-5：`Songs.java`\n\n你可以在 GitHub 上找到这个项目：\n\n`https://github.com/htset/java_exercises/tree/master`\n\
  \n## 解决方案\n\n我们将创建一个用户可以输入任务的程序。我们将使用优先级队列来表示差异。\n\n让我们先定义 `Task` 和 `Worker` 类：\n\
  \n```java\npackage TaskAllocation;\npublic class Task {\n    public String description;\n\
  \    public int duration;\n    public Task(String description, int duration) {\n\
  \        this.description = description;\n        this.duration = duration;\n  \
  \  }\n}\n```\n列表 7-1：`Task.java`\n\n```java\npackage TaskAllocation;\npublic class\
  \ Worker {\n    public int id;\n    public int workload;\n    public Worker(int\
  \ id, int workload) {\n        this.id = id;\n        this.workload = workload;\n\
  \    }\n}\n```\n列表 7-2：`Worker.java`\n\n`Worker` 类包含了工作者的 ID 以及工作负载。\n\n接下来，我们定义\
  \ `main()` 方法：\n\n```java\npackage TaskAllocation;\nimport java.util.ArrayList;\n\
  import java.util.Comparator;\nimport java.util.List;\nimport java.util.PriorityQueue;\n\
  import java.util.Scanner;\n\npublic class TaskAllocation {\n    public static void\
  \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n   \
  \     List<Task> tasks = new ArrayList<>();\n        PriorityQueue<Worker> workerQueue\
  \ = new PriorityQueue<>(Comparator.comparingInt(w -> w.workload));\n\n        System.out.print(\"\
  Enter the number of workers: \");\n        int numWorkers = scanner.nextInt();\n\
  \        // 初始化负载为 0\n        for (int i = 0; i < numWorkers; i++) {\n         \
  \   workerQueue.add(new Worker(i, 0));\n        }\n\n        int choice;\n     \
  \   do {\n            System.out.println(\"\\nMenu:\");\n            System.out.println(\"\
  1. Add Task\");\n            System.out.println(\"2. Display Tasks\");\n       \
  \     System.out.println(\"3. Print Workers Queue\");\n            System.out.println(\"\
  4. Exit\");\n            System.out.print(\"Enter your choice: \");\n          \
  \  choice = scanner.nextInt();\n            switch (choice) {\n                case\
  \ 1:\n                    addTask(workerQueue, tasks, scanner);\n              \
  \      break;\n                case 2:\n                    displayTasks(tasks);\n\
  \                    break;\n                case 3:\n                    printWorkersQueue(workerQueue);\n\
  \                    break;\n                case 4:\n                    System.out.println(\"\
  Exiting program...\");\n                    break;\n                default:\n \
  \                   System.out.println(\"Invalid choice! Please try again.\");\n\
  \                    break;\n            }\n        } while (choice != 4);\n   \
  \     scanner.close();\n    }\n}...\n```\n列表 7-3：`TaskAllocation.java`\n\n接下来，我们实现添加任务并将其分配给工作者的方法：\n\
  \n```java\n// 添加任务并分配给工作者的方法\nstatic void addTask(PriorityQueue<Worker> workerQueue,List<Task>\
  \ tasks, Scanner scanner) {\n    System.out.print(\"Enter task description: \");\n\
  \    String description = scanner.next(); \n\n    System.out.print(\"Enter task\
  \ duration (in minutes): \");\n}\n```\n\n\n\n\n```java\nint duration = scanner.nextInt();\n\
  if (workerQueue.size() == 0) {\n    System.out.println(\"No workers available! Task\
  \ cannot be assigned.\");\n    return;\n}\n// 取出工作量最短的线程\nWorker worker = workerQueue.poll();\n\
  // 将任务分配给该线程并更新工作量\ntasks.add(new Task(description, duration));\nSystem.out.println(\"\
  Task added successfully and allocated to Worker \" + worker.id + \"!\");\n// 更新工作量\n\
  worker.workload += duration;\n// 将更新后的线程存回队列\nworkerQueue.add(worker);\n```\n代码列表\
  \ 7-4：`TaskAllocation.java`\n\n为了找到工作量最低的线程，我们将线程存储在优先级队列中。请注意，我们使用 `workload` 属性作为用于排序优先级队列的参数。这在\
  \ `main()` 方法中的队列定义中已经指定：\n\n```java\nPriorityQueue<Worker> workerQueue = new PriorityQueue<>(Comparator.comparingInt(w\
  \ -> w.workload));\n```\n\n当我们从队列中取出项时，将获得工作量最低的项。\n\n在 `addTask()` 中，我们获取工作量最低的线程（位于队列头部的线程），并将任务的工作量加到线程自身的工作量中。然后，我们将任务存储到\
  \ `tasks` 列表中。最后，将线程再次插入队列中；现在该线程将根据新更新的工作量重新确定位置。\n\n最后，我们展示了另外两个操作的代码，分别显示任务和线程信息：\n\
