  \      System.out.println(\"Invalid cities entered.\");\n        return;\n    }\n\
  \n    Set<String> visited = new HashSet<>();\n    Stack<String> path = new Stack<>();\n\
  \    path.push(src);\n    dfs(src, dest, visited, path);\n}\n```\nListing 14-5:\
