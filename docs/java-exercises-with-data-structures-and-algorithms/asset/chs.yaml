  \n# 14. 航班\n\n让我们创建一个控制台应用程序，维护城市之间的航班列表，并根据票价找到最佳航班组合。\n\n### 建议的解决方案\n\n这个问题涉及在城市之间创建一个图。该图是带权重的，权重为相应的机票费用。我们将使用\
  \ Dijkstra 算法来寻找这两个城市之间最廉价的路径。\n\n首先，我们定义 `City` 类，它将存储连接城市及其相应的映射：\n\n```java\n\
  package Flights;\nimport java.util.*;\npublic class Flights {\n    // 表示每个城市的结构\n\
  \    public static class City {\n        public String name;\n        public Map<String,\
  \ Integer> flights;\n        public City(String name) {\n            this.name =\
  \ name;\n            this.flights = new HashMap<>();\n        }\n    }\n...\n```\n\
  列表 14-1: `Flights.java`\n\n接下来，我们定义 `FlightGraph` 类：\n\n```java\npublic static class\
  \ FlightGraph {\n    // 表示所有城市的图类\n    public Map<String, City> cities = new HashMap<>();\n\
  \    ...\n```\n列表 14-2: `Flights.java`\n\n该类包含所有城市及其名称的映射。我们可以通过以下方法添加城市和航班连接：\n\
  \n```java\n// 向图中添加城市\npublic void addCity(String name) {\n    cities.put(name,\
  \ new City(name));\n}\n// 添加两个城市之间的航班及其费用\npublic void addFlight(String src, String\
  \ dest, int cost) {\n    cities.get(src).flights.put(dest, cost);\n}\n```\n列表 14-3:\
  \ `Flights.java`\n\n注意，我们假设航班是双向的，并且具有相同的价格。\n\n接下来，我们使用 Dijkstra 算法计算两个城市之间的最短路径：\n\
  \n```java\n// 寻找两个城市之间最短路径的方法\npublic List<String> findCheapestRoute(String src,\
  \ String dest, Map<String, Integer> dist) {\n    // 初始化距离映射和前驱节点映射\n    dist.clear();\n\
  \    Map<String, String> prev = new HashMap<>();\n    PriorityQueue<Map.Entry<String,\
  \ Integer>> pq = new PriorityQueue<>(Map.Entry.comparingByValue());\n    // 设置所有距离为无穷\n\
  \    for (String city : cities.keySet()) {\n        dist.put(city, Integer.MAX_VALUE);\n\
  \        prev.put(city, null);\n    }\n    // 起始城市的距离为 0\n    dist.put(src, 0);\n\
  \    pq.offer(new AbstractMap.SimpleEntry<>(src, 0));\n    // 处理每个节点的主循环\n    while\
  \ (!pq.isEmpty()) {\n        Map.Entry<String, Integer> entry = pq.poll();\n   \
  \     String u = entry.getKey();\n        int uDist = entry.getValue();\n      \
  \  // 处理当前节点的每个邻居\n        for (Map.Entry<String, Integer> flight : cities.get(u).flights.entrySet())\
  \ {\n            String v = flight.getKey();\n            int cost = flight.getValue();\n\
  \            // 如果发现到达 v 的更短路径\n            if (dist.get(u) != Integer.MAX_VALUE\
  \ && dist.get(u) + cost < dist.get(v)) {\n                dist.put(v, dist.get(u)\
  \ + cost);\n                prev.put(v, u);\n                pq.offer(new AbstractMap.SimpleEntry<>(v,\
  \ dist.get(v)));\n            }\n        }\n    }\n    // 从源到目的地重建路径\n    List<String>\
  \ path = new ArrayList<>();\n    for (String at = dest; at != null; at = prev.get(at))\
  \ {\n        path.add(at);\n    }\n    Collections.reverse(path);\n    return path;\n\
  }\n```\n列表 14-4: `Flights.java`\n\n\n\n完成完成后，我们使用上一个节点映射中存储的信息重构从源点到终点的最短路径，从而确定路线的总价格。\n\
  \n为了避免在图的遍历过程中陷入无限循环，我们记录了当前路径中访问过的城市（`dist map`）。如果某个城市在当前路径中已经被访问过，我们将跳过从该城市出发的航班搜索，以防止环路。\n\
