  \ right;\n        public Node(String name, String path) {\n            fileName\
  \ = name;\n            filePath = path;\n            left = null;\n            right\
  \ = null;\n        }\n    }\n\n    private Node root;\n    ... \n```\n\n列表 11-1:\
  \ `FileIndexer.java`\n\n树的每个节点都包含两个字符串：文件名和文件位置。它还包含指向两个子子节点的引用。\n\n接下来，我们定义了一个方法来向树中插入新节点：\n\
  \n```java\n// 将节点插入到树中\nprivate void insertNode(String fileName, String filePath)\
  \ {\n    // 如果树为空，在此处插入节点\n    if (root == null) {\n        root = new Node(fileName,\
  \ filePath);\n        return;\n    }\n    // 如果不为空，则沿树向下移动\n    Node current = root;\n\
  \    while (true) {\n        if (fileName.compareTo(current.fileName) < 0) {\n \
  \           if (current.left == null) {\n                current.left = new Node(fileName,\
  \ filePath);\n                return;\n            }\n            current = current.left;\n\
  \        } else {\n            if (current.right == null) {\n                current.right\
  \ = new Node(fileName, filePath);\n                return;\n            }\n    \
  \        current = current.right;\n        }\n    }\n}\n```\n\n列表 11-2: `FileIndexer.java`\n\
  \n从树的根开始，根据插入的值向左或向右移动。\n\n接下来，我们定义了递归将所有文件索引到树中的方法：\n\n```java\n// 索引指定的目录\nprivate\
  \ void indexDirectoryHelper(String dirPath) {\n    // 如果不是目录，返回\n    if (!Files.isDirectory(Paths.get(dirPath)))\
  \ return;\n    // 遍历目录内的文件\n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(Paths.get(dirPath)))\
  \ {\n        for (Path entry : stream) {\n            if (Files.isRegularFile(entry))\
  \ {\n                String fileName = entry.getFileName().toString();\n       \
  \         insertNode(fileName, entry.toString());\n            }\n        }\n  \
  \  } catch (IOException e) {\n        e.printStackTrace();\n    }\n    // 遍历目录内的目录\n\
  \    try (DirectoryStream<Path> stream = Files.newDirectoryStream(Paths.get(dirPath)))\
  \ {\n        for (Path entry : stream) {\n            if (Files.isDirectory(entry))\
  \ {\n                // 递归索引\n                indexDirectoryHelper(entry.toString());\n\
  \            }\n        }\n    } catch (IOException e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n列表 11-3: `FileIndexer.java`\n\n我们使用 `java.nio.file` 包的方法来检查路径是否存在并对应于目录（`Files.isDirectory`）。然后我们逐一遍历目录内的所有文件，并将它们作为新节点插入树中。\n\
  \n然后，我们遍历目录并同样递归地索引它们。\n\n接下来，我们定义了一个递归删除树节点节点的方法：\n\n```java\n// 递归释放内存\nprivate\
  \ void deleteSubtree(Node root) {\n    if (root != null) {\n        deleteSubtree(root.left);\n\
  \        deleteSubtree(root.right);\n        root = null;\n    }\n}\n```\n\n列表 11-4:\
