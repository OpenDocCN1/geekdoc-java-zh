- "# Java 数据结构与算法练习指南\n\n\n\n![](img/image_rsrc5RM.jpg)\n\n\nCopyright © 2024 Haris\
  \ Tsetsekas\n\n## 目录\n\n1. 大学课程\n2. 餐厅预约\n3. 图书馆\n4. 联系列表\n5. 优先级待办事项\n6. 歌曲列表\n\
  7. 任务分配\n8. 词频统计\n9. 语法检查器\n10. 迷宫求解器\n11. 文件索引器\n12. 基于 AVL 树的库存\n13. 社交网络\n14.\
  \ 航班\n15. MNIST 图像比较\n16. 带缓存的 HTTP 服务器\n17. 分布式拍卖\n\n## 1. 大学课程\n\n让我们创建一个处理大学课程选课的程序。每门课程都有一个或多个先修课程，即学生必须完成这些课程后才能修读特定的特定课程。\n\
  \n### 建议的解决方案\n\n首先，我们将为大学中的学生定义类：\n\n```java\npackage UniversityCourses;\npublic\
  \ class Student {\n    public int id;\n    public String name;\n    public int[]\
  \ courses;\n    public int courseCount;\n    public Student(int id, String name,\
  \ int courseCount, int[] courses) {\n        this.id = id;\n        this.name =\
  \ name;\n        this.courseCount = courseCount;\n        this.courses = courses;\n\
  \    }\n}\n```\n列表 1-1: Student.java\n\n该类包含关于学生及其已成功完成课程的信息。`Courses` 数组包含课程的 ID。\n\
  \n接下来，我们为大学课程定义一个类：\n\n```java\npackage UniversityCourses;\npublic class Course\
  \ {\n    public int id;\n    public String name;\n    public int prereqCount;\n\
  \    public int[] prereqIDs;\n    public Course(int id, String name, int prereqCount,\
  \ int[] prereqIDs) {\n        this.id = id;\n        this.name = name;\n       \
  \ this.prereqCount = prereqCount;\n        this.prereqIDs = prereqIDs;\n    }\n\
  \    public boolean canEnroll(Student student) {\n        for (int prereqId : this.prereqIDs)\
  \ {\n            boolean hasPrereq = false;\n            for (int courseId : student.courses)\
  \ {\n                if (courseId == prereqId) {\n                    hasPrereq\
  \ = true;\n                    break;\n                }\n            }\n      \
  \      if (!hasPrereq) {\n                return false;\n            }\n       \
  \ }\n        return true;\n    }\n}\n```\n列表 1-2: Course.java\n\n每门课程包含一个先修课程 ID\
  \ 数组。该类还包含一个方法，用于判断学生是否可以选某门课程。对于每门先修课程，该方法都会尝试与学生已修过的课程进行匹配。\n\n最后，是 `main()` 方法：\n\
  \n```java\npackage UniversityCourses;\npublic class UniversityCourses {\n    public\
  \ static void main(String[] args) {\n        Course[] courses = {\n            new\
  \ Course(0, \"Intro to Programming\", 0, new int[] { -1 }),\n            new Course(1,\
  \ \"Data Structures\", 1, new int[] { 0 }),\n            new Course(2, \"Algorithms\"\
  , 1, new int[] { 1 }),\n            new Course(3, \"Database Management\", 1, new\
  \ int[] { 0 }),\n            new Course(4, \"Web Development\", 1, new int[] { 0\
  \ }),\n            new Course(5, \"Operating Systems\", 2, new int[] { 1, 2 }),\n\
  \            new Course(6, \"Computer Networks\", 2, new int[] { 1, 5 }),\n    \
  \        new Course(7, \"Software Engineering\", 2, new int[] { 1, 2 }),\n     \
  \       new Course(8, \"Machine Learning\", 2, new int[] { 1, 2 }),\n          \
  \  new Course(9, \"Distributed Systems\", 1, new int[] { 5 }),\n            new\
  \ Course(10, \"Cybersecurity\", 2, new int[] { 2, 3 }),\n            new Course(11,\
  \ \"Cloud Computing\", 2, new int[] { 2, 3 }),\n            new Course(12, \"Mobile\
  \ App Development\", 1, new int[] { 4 }),\n            new Course(13, \"Game Development\"\
  , 1, new int[] { 4 }),\n            new Course(14, \"Artificial Intelligence\",\
  \ 2, new int[] { 2, 3 }),\n            new Course(15, \"Big Data Analytics\", 2,\
  \ new int[] { 2, 3 }),\n            new Course(16, \"Blockchain Technology\", 2,\
  \ new int[] { 2, 3 }),\n            new Course(17, \"UI/UX Design\", 2, new int[]\
  \ { 2, 3 }),\n            new Course(18, \"Embedded Systems\", 2, new int[] { 2,\
  \ 3 }),\n            new Course(19, \"Computer Graphics\", 2, new int[] { 2, 3 })\n\
  \        };\n        Student student = new Student(1, \"John Doe\", 2, new int[]\
  \ {0, 1});\n        for (Course course : courses) {\n            if (course.canEnroll(student))\
  \ {\n                System.out.println(\"- Can enroll in \" + course.name);\n \
  \           } else {\n                System.out.println(\"- Cannot enroll in \"\
  \ + course.name + \" due to missing prerequisites.\");\n            }\n        }\n\
  \    }\n}\n```\n列表 1-3: UniversityCourses.java\n\n## 2. 餐厅预约\n\n对于这个练习，我们将创建一个处理预约的小程序。每张桌子以其容量为特征。简单来说，预约可以跨越多个时间段。\n\
  \n### 建议的解决方案\n\n首先，我们将为顾客定义类：\n\n```java\npackage Restaurant;\npublic class Customer\
  \ {\n    public String name;\n    public Customer(String name) {\n        this.name\
  \ = name;\n    }\n}\n```\n列表 2-1: Customer.java\n\n该类包含姓名。它也可以包含电话或其他详情。\n\n接下来，我们为餐厅桌子定义类：\n\
  \n```java\npackage Restaurant;\npublic class Table {\n    public int id;\n    public\
  \ int capacity;\n    public Table(int id, int capacity) {\n        this.id = id;\n\
  \        this.capacity = capacity;\n    }\n}\n```\n列表 2-2: Table.java\n\n桌子对象包含其\
  \ ID 以及其容量信息（可以容纳的人数）。\n\n接下来，我们定义 `Reservation` 类：\n\n```java\npackage Restaurant;\n\
  public class Reservation {\n    public Customer customer;\n    public Table table;\n\
  \    public int startTimeSlot;\n    public int endTimeSlot;\n    public Reservation(Customer\
  \ customer, Table table, int startTimeSlot, int endTimeSlot) {\n        this.customer\
  \ = customer;\n        this.table = table;\n        this.startTimeSlot = startTimeSlot;\n\
  \        this.endTimeSlot = endTimeSlot;\n    }\n}\n```\n列表 2-3: Reservation.java\n\
  \n预约包含对 `Customer` 和 `Table` 对象的引用。它还包含起始和结束时间段（不包含结束）。\n\n我们还创建一个 `Restaurant`\
  \ 类来实现创建新预约的功能：\n\n```java\npackage Restaurant;\nimport java.util.ArrayList;\nimport\
  \ java.util.List;\n\npublic class Restaurant {\n    private final List<Table> tables\
  \ = new ArrayList<>();\n    private final List<Reservation> reservations = new ArrayList<>();\n\
  \n    public void addTable(Table table) {\n        tables.add(table);\n    }\n}\n\
  ```\n列表 2-4: Restaurant.java\n\n`addTable()` 方法将桌子的引用添加到 `tables` 列表中。\n\n在 `isTableAvailable()`\
  \ 方法中，我们从 `reservations` 列表中获取一个流。我们使用流的 `noneMatch()` 方法来判断在指定时间段内是否存在未被预约的桌子。\n\
  \n```java\npublic boolean isTableAvailable(Table table, int startTimeSlot, int endTimeSlot)\
  \ {\n    return reservations.stream().noneMatch(reservation ->\n        reservation.table.id\
  \ == table.id &&\n        ((startTimeSlot >= reservation.startTimeSlot && startTimeSlot\
  \ < reservation.endTimeSlot) ||\n         (endTimeSlot > reservation.startTimeSlot\
  \ && endTimeSlot <= reservation.endTimeSlot) ||\n         (startTimeSlot <= reservation.startTimeSlot\
  \ && endTimeSlot >= reservation.endTimeSlot))\n    );\n}\n```\n列表 2-5: Restaurant.java\n\
  \n\n\n\n\n`findAvailableTables()` 方法搜索从 `tables` 列表获取的流，以便找到指定时间段内所有可表格。\n\n```java\n\
  public List<Table> findAvailableTables(int capacity, int startTimeSlot,int endTimeSlot)\
  \ {\n    List<Table> availableTables = tables.stream().filter(table -> table.capacity\
  \ >= capacity&& isTableAvailable(table, startTimeSlot, endTimeSlot)).collect(Collectors.toList());\n\
  \    availableTables.sort(Comparator.comparingInt(a -> a.capacity));\n    return\
  \ availableTables;\n}\n```\nListing 2-6: `Restaurant.java`\n\n我们使用 `filter()` 来获取容量符合或超过人数的空桌。选定的桌子将通过\
  \ `collect()` 方法收集到一个新的列表中。该列表在根据桌子容量按升序排序后返回，因为我们正尝试先填满最小的桌子。\n\n接下来，`addReservation()`\
  \ 方法将动态创建一个新订单并将其插入到 `reservations` 列表中。当然，这是在找到了合适的桌子的情况下。请注意，我们获取的是排序列表中的第一个表格，即容量最小的桌子。\n\
  \n```java\npublic void addReservation(String name, int capacity, int startSlot,\
  \ int endSlot) {\n    List<Table> availableTables = findAvailableTables(capacity,\
  \ startSlot, endSlot);\n    if (!availableTables.isEmpty()) {\n        reservations.add(new\
  \ Reservation(new Customer(name),availableTables.get(0), startSlot, endSlot));\n\
  \        System.out.println(\"Reservation successfully added.\");\n    } else {\n\
  \        System.out.println(\"No available tables for the requested time slot.\"\
  );\n    }\n}\n```\nListing 2-7: `Restaurant.java`\n\n接下来，我们有一个方法可以在控制台中打印所有订单：\n\
  \n```java\npublic void printReservations() {\n    System.out.println(\"All reservations:\"\
  );\n    for (Reservation reservation : reservations) {\n        System.out.println(\"\
  Customer: \" + reservation.customer.name +\", Table Capacity: \" + reservation.table.capacity\
  \ +\", Start Time Slot: \" + reservation.startTimeSlot +\", End Time Slot: \" +\
  \ reservation.endTimeSlot);\n    }\n}\n```\nListing 2-8: `Restaurant.java`\n\n最后，在\
  \ `main()` 方法中，我们向 `Restaurant` 对象添加桌子，并尝试为特定的容量和时间段预订。某些订单将成功，但另一些订单将没有可用桌子。最后，我们打印系统中所有可用的订单。\n\
  \n```java\npublic static void main(String[] args) {\n    Restaurant restaurant =\
  \ new Restaurant();\n    //Add tables \n    restaurant.addTable(new Table(1, 6));\n\
  \    restaurant.addTable(new Table(2, 4));\n    restaurant.addTable(new Table(3,\
  \ 2));\n    //Find available tables for a new reservation\n    restaurant.addReservation(\"\
  Customer 1\", 4, 1, 3);\n    restaurant.addReservation(\"Customer 2\", 6, 2, 4);\n\
  \    restaurant.addReservation(\"Customer 3\", 4, 3, 5);\n    restaurant.addReservation(\"\
  Customer 4\", 4, 1, 3);\n    restaurant.printReservations();\n}\n```\nListing 2-9:\
  \ `Restaurant.java`\n\n你可以在 GitHub 上找到这个项目：\n\n`https://github.com/htset/java_exercises_dsa/tree/master/Restaurant`\n\
  \n# 3. 图书\n\n在这里我们将为图书馆创建一个控制台应用程序。用户将输入书籍并列出图书馆中所有的标题。他们还可以借书、还书以及列出所有的借阅事件。书籍和借阅事件将存储在文本文件中。\n\
  \n## 建议解决方案\n\n让我们从定义 `Book` 和 `LendingEvent` 类开始：\n\n```java\npackage Library;\n\
  public class Book {\n    public String title;\n    public String author;\n    public\
  \ int available;\n}\n```\nListing 3-1: `Book.java`\n\n```java\npackage Library;\n\
  import java.time.LocalDateTime;\npublic class LendingEvent {\n    public String\
  \ bookTitle;\n    public String userName;\n    public LocalDateTime lendingDate;\n\
  \    public int returned;\n}\n```\nListing 3-2: `LendingEvent.java`\n\n对于每本书，我们记录标题和作者。我们还保留了关于它是否可用或当前已借出的信息（分别为\
  \ 1 或 0）。\n\n对于每个借阅事件，我们记录书名和借阅该书的图书馆用户名。我们还保留了借阅日期以及是否已归的整数值（分别为 1 或 0）。\n\n我们还定义了\
  \ `Library` 类，它包含了添加和显示书籍信息的所有功能：\n\n```java\npackage Library;\nimport java.io.*;\n\
  import java.time.LocalDateTime;\nimport java.util.Scanner;\n\npublic class Library\
  \ {\n  private static final String BooksFilename = \"books.txt\";\n  private static\
  \ final String LendingFilename = \"lending_events.txt\";\n...\n}\n```\nListing 3-3:\
  \ `Library.java`\n\n`Library` 类的第一个方法用于在图书馆目录中添加新书籍：\n\n```java\npublic void addBook()\
  \ throws IOException {\n    try (PrintWriter file = new PrintWriter(new FileWriter(BooksFilename,\
  \ true))) {\n        Book book = new Book();\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Book title: \");\n        book.title = scanner.nextLine();\n\
  \        System.out.print(\"Author: \");\n        book.author = scanner.nextLine();\n\
  \        //Mark book as available\n        book.available = 1;\n        file.println(book.title\
  \ + \"&#124;\" + book.author + \"&#124;\" + book.available);\n    }\n    System.out.println(\"\
  Book added.\");\n}\n```\nListing 3-4: `Library.java`\n\n在开始，我们使用 `PrintWriter` 对象打开书籍文件。构造函数的第二个参数是\
  \ `true`，这意味着我们将内容附加到文件末尾，当前内容不会被擦除。从用户那里获取书籍标题和作者后，我们将新的书籍对象写入文件末尾。使用的格式如下：\n\n\
  `书名`|`作者`|`是否可用 (0 或 1)`\n\n接下来，我们实现书籍列表功能：\n\n```java\npublic void listBooks()\
  \ throws IOException {\n    //check if text file exists\n    if (!new File(BooksFilename).exists())\
  \ {\n        System.out.println(\"No books entered so far\");\n        return;\n\
  \    }\n    System.out.println(\"Books available in the library:\");\n    try (BufferedReader\
  \ file = new BufferedReader(new FileReader(BooksFilename))) {\n        String line;\n\
  \        while ((line = file.readLine()) != null) {\n            String[] parts\
  \ = line.split(\"\\\\124;\");\n            System.out.println(\"Title: \" + parts[0]);\n\
  \            System.out.println(\"Author: \" + parts[1]);\n            System.out.println(\"\
  Available: \"+ (parts[2].equals(\"1\") ? \"True\" : \"False\"));\n            System.out.println(\"\
  ------------------------------\");\n        }\n    }\n}\n```\nListing 3-5: `Library.java`\n\
  \n在这里，我们从开始打开文件并使用 `readLine()` 读取每本书的详情。\n\n我们继续实现借书功能：\n\n```java\npublic void\
  \ lendBook() throws IOException {\n    //check if text file exists\n    if (!new\
  \ File(BooksFilename).exists()) {\n        System.out.println(\"No books entered\
  \ so far\");\n        return;\n    }\n    String bookTitle, userName;\n    Scanner\
  \ scanner = new Scanner(System.in);\n    System.out.print(\"Enter the title of the\
  \ book to lend: \");\n    bookTitle = scanner.nextLine();\n    //Get 文件中所有行的数组\n\
  \    String[] lines = new BufferedReader(new FileReader(BooksFilename)).lines().toArray(String[]::new);\n\
  \    boolean bookFound = false;\n    for (int i = 0; i < lines.length; i++) {\n\
  \        //分割行分为书籍详情\n        String[] parts = lines[i].split(\"\\\\124;\");\n \
  \       if (parts[0].equals(bookTitle) && parts[2].equals(\"1\")) {\n          \
  \  lines[i] = parts[0] + \"&#124;\" + parts[1] + \"&#124;0\";\n            bookFound\
  \ = true;\n            System.out.print(\"Enter your name: \"); \n            userName\
  \ = scanner.nextLine();\n            //将借阅事件写入文件\n            try (PrintWriter lendingFile=\
  \ new PrintWriter(new FileWriter(LendingFilename, true))) {\n                lendingFile.println(bookTitle\
  \ + \"&#124;\" + userName + \"&#124;\"+ LocalDateTime.now() + \"&#124;0\");\n  \
  \          }\n            System.out.println(\"Book '\" + bookTitle + \"' has been\
  \ lent to \"+ userName + \".\");\n            break;\n        }\n    }\n    if (!bookFound)\
  \ {\n        System.out.println(\"Book '\" + bookTitle + \"' not found or not available.\"\
  );\n    }\n    //将书籍写回文件（覆盖文件）\n    try (PrintWriter file = new PrintWriter(new\
  \ FileWriter(BooksFilename))) {\n        for (String line : lines) {\n         \
  \   file.println(line);\n        }\n    }\n}\n```\nListing 3-6: `Library.java`\n\
  \n\n\n\n我们首先尝试通过 `.lines().toArray(String[]::new)` 读取书籍文件中的所有条目来查找所需的书籍。书籍条目将存储在一个字符串数组中。`String[]::new`\
  \ 是一个创建新 `String` 数组的函数。它会被 `toArray()` 调用以创建一个新数组。\n\n我们遍历该数组，并将每个条目拆分为书籍详情（标题、作者、可用性）。当我们找到该书籍时（如果它是可用的），我们将其标记为当前不可用。\n\
  \n此后，我们通过在相应的二进制文件末尾写入一个新条目来记录借阅事件。最后，我们将数组中的所有条目写回书籍文本文件，并覆盖该文件。\n\n接下来，我们展示还书书籍的功能：\n\
  \n```java\npublic void returnBook() throws IOException {\n    if (!new File(LendingFilename).exists())\
  \ {\n        System.out.println(\"No lending events entered so far\");\n       \
  \ return;\n    }\n    String bookTitle;\n    Scanner scanner = new Scanner(System.in);\n\
  \    System.out.print(\"Enter the title of the book to return: \");\n    bookTitle\
  \ = scanner.nextLine();\n    //Get a string array of all lines in file \n    String[]\
  \ booksLines = new BufferedReader(new FileReader(BooksFilename))\n            .lines().toArray(String[]::new);\n\
  \    boolean bookFound = false;\n    for (int i = 0; i < booksLines.length; i++)\
  \ {\n        String[] parts = booksLines[i].split(\"\\\\|\"); \n        if (parts[0].equals(bookTitle)\
  \ && parts[2].equals(\"0\")) {\n            booksLines[i] = parts[0] + \"|\" + parts[1]\
  \ + \"|1\";\n            bookFound = true;\n            //Get all lending events\n\
  \            String[] lendingLines = new BufferedReader(new FileReader(LendingFilename)).lines().toArray(String[]::new);\n\
  \            for (int j = 0; j < lendingLines.length; j++) {\n                parts\
  \ = lendingLines[j].split(\"\\\\|\");\n                if (parts[0].equals(bookTitle)\
  \ && parts[3].equals(\"0\")) {\n                    lendingLines[j] = parts[0] +\
  \ \"|\" + parts[1] + \"|\" + parts[2] + \"|1\";\n                    System.out.println(\"\
  Book '\" + bookTitle + \"' has been returned.\");\n                    break;\n\
  \                }\n            }\n            //Write lending events back to file\n\
  \            try (PrintWriter lendingFile= new PrintWriter(new FileWriter(LendingFilename)))\
  \ {\n                for (String line : lendingLines) {\n                    lendingFile.println(line);\n\
  \                }\n            }\n            break;\n        }\n    }\n    if\
  \ (!bookFound) {\n        System.out.println(\"Book '\" + bookTitle + \"' not found\
  \ or already returned.\");\n    }\n    //Write books back to file\n    try (PrintWriter\
  \ file = new PrintWriter(new FileWriter(BooksFilename))) {\n        for (String\
  \ line : booksLines) {\n            file.println(line);\n        }\n    }\n}\n```\n\
  列表 3-7: `Library.java`\n\n在这里，我们再次将所有的书籍文件条目读入字符串数组，并尝试查找所需的文件。然后，我们从相应文件中读取所有的借阅事件，并搜索特定书籍的借阅事件。\n\
  \n如果我们找到了该事件，则将其状态更改为“已还”，并将所有条目写回借阅文件。最后，在将书籍可用性状态改回 1 之后，我们还将所有的书籍条目存储到相应的文件中。\n\
  \n现在，让我们来看列出事件的方法：\n\n```java\npublic void listLendingEvents() throws IOException\
  \ {\n    if (!new File(LendingFilename).exists()) {\n        System.out.println(\"\
  No lending events entered so far\");\n        return;\n    }\n    System.out.println(\"\
  Lending events:\");\n    try (BufferedReader file = new BufferedReader(new FileReader(LendingFilename)))\
  \ {\n        String line;\n        while ((line = file.readLine()) != null) {\n\
  \            String[] parts = line.split(\"\\\\|\");\n            System.out.println(\"\
  Book Title: \" + parts[0]);\n            System.out.println(\"User Name: \" + parts[1]);\n\
  \            System.out.println(\"Lending Date: \" + parts[2]);\n            System.out.println(\"\
  Returned: \" + (parts[3].equals(\"1\") ? \"True\" : \"False\"));\n            System.out.println(\"\
  ------------------------------\");\n        }\n    }\n}\n```\n列表 3-8: `Library.java`\n\
  \n最后是处理与用户交互的 `main()` 方法：\n\n```java\npublic static void main(String[] args) throws\
  \ IOException { \n    Library lib = new Library();\n    int choice;\n    Scanner\
  \ scanner = new Scanner(System.in);\n    do {\n        System.out.println(\"\\n1.\
  \ Add a book\\n2. List all books\\n\" + \"3\\. Lend a book\\n4. Return a book\\\
  n5. List lending events\\n0. Exit\");\n        System.out.print(\"Enter your choice:\
  \ \");\n        choice = scanner.nextInt();\n        switch (choice) {\n       \
  \     case 1: lib.addBook(); break;\n            case 2: lib.listBooks(); break;\n\
  \            case 3: lib.lendBook(); break;\n            case 4: lib.returnBook();\
  \ break;\n            case 5: lib.listLendingEvents(); break;\n            case\
  \ 0: System.out.println(\"Exiting.\"); break;\n            default: System.out.println(\"\
  Invalid choice. Please try again.\");\n            break;\n        }\n    } while\
  \ (choice != 0);\n}\n```\n列表 3-9: `Library.java`\n\n在这里，我们再次将所有的书籍文件条目读入字符串数组，并尝试查找所需的文件。然后，我们从相应文件中读取所有的书籍借阅事件，并搜索特定书籍的借阅事件。\n\
  \n如果我们找到了该事件，则将其状态更改为“已还”，并将所有条目写回借阅文件。最后，在将书籍可用性状态改回 1 之后，我们还将所有的书籍条目存储到相应的文件中。\n\
