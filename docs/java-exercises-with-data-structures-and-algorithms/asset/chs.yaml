  \ else if (ch == ')' || ch == ']' || ch == '}') {\n                    if (stack.isEmpty())\
  \ {\n                        return 0;\n                    }\n                \
  \    char openingChar = stack.pop();\n                    if ((ch == ')' && openingChar\
  \ != '(') || (ch == ']' && openingChar != '[') || (ch == '}' && openingChar != '{'))\
