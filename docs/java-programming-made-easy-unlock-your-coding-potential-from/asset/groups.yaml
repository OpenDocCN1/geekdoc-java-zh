    ## 第 13 章：多线程：Java 并发编程


    在当今高需求的计算世界中，顺序执行或一次执行一个任务可能无法满足现代应用程序的需求。用户期望应用程序能够并发执行任务，以提高效率并提升整体用户体验。本章介绍了多线程，这是
    Java 的一项关键特性，通过允许并发编程来解决这一需求。


    ## 13.1 什么是线程？


    简单来说，线程是程序中一条独立的执行路径。它是操作系统可以调度的最小单位。一个进程可以包含多个线程，所有线程都并发运行，并可能在不同的时刻执行不同的任务。


    ## 13.2 在 Java 中创建线程


    Java 提供了两种创建线程的方法：一种是通过扩展 `Thread` 类，另一种是通过实现 `Runnable` 接口。


    扩展 `Thread` 类：


    ```java

    class MyThread extends Thread { public void run() { System.out.println("Thread
    is running."); } } public class Main { public static void main(String[] args)
    { MyThread myThread = new MyThread(); myThread.start(); } }

    ```


    实现 `Runnable` 接口：


    ```java

    class MyRunnable implements Runnable { public void run() { System.out.println("Thread
    is running."); } } public class Main { public static void main(String[] args)
    { Thread myThread = new Thread(new MyRunnable()); myThread.start(); } }

    ```


    在两种情况下，`run()` 方法都包含要在线程中执行的代码。调用 `start()` 方法来启动线程的执行。


    ## 13.3 线程状态和生命周期


    - 新型 (New)：新创建但尚未启动的线程。

    - 可运行 (Runnable)：在 JVM 中执行的线程。


    理解这些状态对于有效管理线程执行至关重要。


    ## 13.4 线程同步


    当多个线程访问共享资源时，可能会产生冲突。同步是一种调节多个线程访问共享资源的机制。在 Java 中，我们使用 `synchronized` 关键字来实现这一点：


    ```java

    javaCopy code

    class Counter { int count; synchronized void increment() { count++; } } public
    class Main { public static void main(String[] args) { Counter c = new Counter();
    };

    ```


    ```java

    Thread t1 = new Thread(() -> for (int i = 0; i < 1000; i++) { c.increment(); }
    }); Thread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) { c.increment();
    } }); t1.start(); t2.start(); // join the threads to ensure count is updated after
    both threads finish t1.join(); t2.join(); System.out.println("Count: " + c.count);
    }

    ```


    在这里，一次只有一个线程可以访问 `increment()` 方法，防止了它们之间的任何干扰。


    ## 13.5 线程通信


    线程可以使用 `wait()`、`notify()` 和 `notifyAll()` 方法相互通信。这些方法在 `synchronized` 上下文中使用，允许线程等待资源可用，并在资源可用时通知其他线程。


    ## 13.6 线程池


    为每个任务创建新线程在时间和资源方面可能是是昂贵的。线程池是一组预先实例化并准备好执行任务的线程。


    多线程是一个强大的概念，允许在 Java 中进行并发编程。虽然本章触及了多线程的许多关键方面，但精通多线程需要时间、实践以及对并发计算背后原理的深度理解。


    从创建和管理线程，到理解它们的生命周期、同步任务，甚至将其池化以进行高效的资源管理，我们涵盖了大量内容。请花时间消化这些概念，通过实际示例进行练习，并探索
    Java 为多线程编程提供的丰富 API。请记住，学习的旅程是渐进的，每一步都让你更接近于精通多线程编程的艺术。编码愉快！


