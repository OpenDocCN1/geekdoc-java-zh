    \ `Shape` 类即可。在编程术语中，`Shape` 将是“超类”或“父类”，而 `Circle` 将是“子类”或“子类”。\n\n## 7.2 继承语法\n\
    \n例如，在 Java 中，继承使用 `extends` 关键字声明，如下：**`class Circle extends Shape { ... }`**。在\
