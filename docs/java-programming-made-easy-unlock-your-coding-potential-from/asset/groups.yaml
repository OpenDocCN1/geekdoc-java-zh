    \n## 7.4 方法重载与重写\n\n方法重载指的是定义多个具有相同但参数不同的方法。这就像一个多才多艺的人，可以根据手头的资源执行不同的任务。\n\n\
    相比之下，方法重写涉及在子类中重新定义已经在其父类中定义的方法。这比比孩子对父母最初讲述的故事形成了他们自己的版本。\n\n## 7.5 实践中的继承与多态\n\
    \n让我们通过一个例子让这些概念活起来。假设我们正在为动物园设计一个系统。我们有一个基类 `Animal`（动物），它包含如 `name`（名称）、`age`（年龄）等属性以及方法\
