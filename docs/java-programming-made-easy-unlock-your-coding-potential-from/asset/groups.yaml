    Generics are more than just parameterized types for collections. They can also
    be used in class, interface, and method declarations.


    A simple generic class could look like this:


    ## 14.5 Lambda Expressions and Functional Interfaces


    Lambda expressions are typically used to implement methods defined by functional
    interfaces - interfaces that declare a single abstract method. Java offers numerous
    pre-defined functional interfaces contained within the java.util.function package.


    For instance, the Predicate interface represents a simple condition or boolean-valued
    function:


    ```java

    javaCopy code

    Predicate<Integer> isEven = num -> num % 2 == 0; System.out.println(isEven(4));
    // prints true

    ```


    ## 14.6 Advanced Stream Operations


    Streams provide a rich API for manipulating data. You can chain multiple operations
    together in a pipeline, which can be parallelized for efficiency.

