    ## 2.2 Primitive Data Types


    Java provides several primitive data types that represent basic values, such as
    numbers and characters. Let''s explore the most commonly used primitive data types
    and their characteristics.


    ### Step 1: Integer Data Types


    Integers represent whole numbers without decimal places. In Java, you can choose
    from several integer data types based on the range of values you need:


    - **byte**: Represents a small integer ranging from -128 to 127.

    - **short**: Represents a short integer ranging from -32,768 to 32,767.

    - **int**: Represents a standard integer ranging from -2,147,483,648 to 2,147,483,647.

    - **long**: Represents a large integer ranging from -9,223,372,036,854,775,808
    to 9,223,372,036,854,775,807.


    ### Step 2: Floating-Point Data Types


    Floating-point numbers represent numbers with decimal places. Java offers two
    floating-point data types:


    - **float**: Represents single-precision floating-point numbers with 32 bits of
    precision.

    - **double**: Represents double-precision floating-point numbers with 64 bits
    of precision.


    ### Step 3: Character Data Type


    The **char** data type represents a single character. It can hold any Unicode
    character, such as letters, digits, symbols, or even special characters. To assign
    a character to a char variable, enclose it in single quotes("").


