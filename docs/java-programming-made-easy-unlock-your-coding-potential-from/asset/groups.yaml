    \ `Animal` 超类的 `sound()` 方法。\n\n## 7.6 继承与多态的力量\n\n继承的力量在于它可以提高代码的可重用性和可维护性。通过将公共属性和行为分组到超类中，我们创建了一个单一的真理来源，子类可以在此基础上进行扩展。这不仅减少了冗余，还使代码更容易于管理和维护。\n\
    \n另一方面，多态赋予了灵活性。它允许我们编写更通用的代码，只要这些类共享一个共同的超类。\n\n## 7.7 总结\n\n在结束本章之际，让我们回顾一下所学内容。继承和多态如果用得当，可以显著增强代码的模块化灵活性。随着我们开发更复杂的应用程序，这些\
    \ OOP 原则将变得日益重要。记住，就像任何强大的工具一样，艺术不仅在于如何使用它们，更在于知道何时使用它们。\n\n# 第 8 章：异常处理：处理错误\n\
    \n在之前的章节中，我们探索了如何构建和构建代码以增强重用性和扩展性。现在，让我们关注健壮编程的一个基本方面：异常处理。编写按预期运行的代码是重要的，但预测并处理出现故障的情况同样关键。\n\
    \n## 8.1 理解异常\n\n异常是指在程序运行期间发生的事件，会导致指令序列的中断。异常处理提供了一种结构化、一致的方法来处理这些错误，并确保程序能够继续运行或优雅失败。\n\
    \n## 8.2 Try-Catch 块\n\n处理异常常用的方法是使用 try-catch 块。可能触发异常的代码段放置在 try 块中。如果发生异常，控制流将转移到相应的\
    \ catch 块，其中对异常进行处理。catch 块本质上是我们的程序的安全网，防止其由于未处理的异常而崩溃。\n\n考虑一个除法操作。在这里，除以零将抛出\
    \ ArithmeticException。通过将此操作放在 try-catch 块中，我们可以捕获此异常并向用户提供有意义的信息，而不是让程序崩溃。\n\n\
    ## 8.3 Finally 块\n\n除了 try-catch 之外，我们还有 finally 块。无论是否发生异常，finally 块中的代码都会执行。它主要用于清理工作，例如关闭数据库连接。\n\
