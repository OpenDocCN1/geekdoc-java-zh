    \n```java\nArrays.sort(numbers);\n```\n\n### 4. 搜索元素\n\n要在数组或 ArrayList 中搜索元素，你可以使用循环进行检查。这是一个示例：\n\
    \n```java\nboolean found = false;\nfor (String name : names) {\n    if (name.equals(\"\
    Alice\")) {\n        found = true;\n        break;\n    }\n}\n```\n\n## 4.4 使用集合增强你的程序\n\
    \n恭喜你！你已经对 Java 中的数组和 ArrayList 有了深入理解。通过掌握这些，你可以高效地存储和操作数据。但请记住，这只是开始。\n\n# 第\
    \ 5 章：面向对象编程原则\n\n欢迎来到《Java编程入门：从零解锁你的编程潜力！》第 5 章。在本章中，我们将探索面向对象编程（OOP）的基本原则。面向对象编程是一种强大的范式，允许你以模块化的组织代码。通过理解这些原则，你将能够创建健壮且易于维护的应用程序。\n\
    \n## 5.1 面向对象编程 (OOP) 简介\n\n面向对象编程代表了一种以“对象”为核心的编程方法。对象表示现实世界中的物品或概念，包含了它的属性和方法。OOP\
    \ 促进使用类和对象来解决复杂问题。\n\n### 1. 封装 (Encapsulation)\n\n封装是将数据以及操作这些数据的方法封装在一个名为“类”（class）的单一单元中的实践。它允许你隐藏内部实现细节，并只暴露与对象交互的必要接口。通过封装数据，你确保了数据的完整性。\n\
    \n### 2. 抽象 (Abstraction)\n\n抽象代表了通过突出关键特征同时隐藏非本质细节来简化复杂系统的技术。在 OOP 中，抽象通过抽象类和接口（interfaces）实现。抽象类定义了一组相关类共享的共同特征，而接口定义了类必须遵守的合约。\n\
    \n### 3. 继承 (Inheritance)\n\n继承是一种允许你基于现有类定义新类的机制。新类被称为子类（subclass）或派生类，它继承现有类（被称为父类或基类）的属性和行为。继承促进了代码的重用，并允许你创建特化的类。\n\
