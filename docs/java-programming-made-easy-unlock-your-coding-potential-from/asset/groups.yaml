    \ loop. Here's an example:\n\n```java\nfor (int i = 0; i < names.size(); i++)\
    \ {\n    System.out.println(names.get(i));\n}\n```\n\n### 2. Finding Size\n\n\
    To determine the size of array or ArrayList, you can use size() method.\n\n```java\n\
    int size = names.size();\n```\n\n### 3. Sorting Elements\n\nYou can sort array\
    \ using Arrays.sort().\n\n```java\nArrays.sort(numbers);\n```\n\n### 4. Searching\
    \ for Elements\n\nTo search for element in array or ArrayList, you can use loop\
    \ to check. Here's an example:\n\n```java\nboolean found = false;\nfor (String\
    \ name : names) {\n    if (name.equals(\"Alice\")) {\n        found = true;\n\
    \        break;\n    }\n}\n```\n\n## 4.4 Enhance Your Programs with Collections\n\
    \nCongratulations! You've gained a solid understanding of arrays and ArrayLists\
    \ in Java. By mastering these, you can efficiently store and manipulate data.\
    \ But remember, this is just the beginning.\n\n# Chapter 5: Object-Oriented Programming\
    \ Principles\n\nWelcome to Chapter 5 of \"Java Programming Made Easy: Unlock Your\
    \ Coding Potential from Scratch! In this chapter, we'll explore the foundational\
    \ principles of Object-Oriented Programming (OOP). Object-Oriented Programming\
    \ is a powerful paradigm that allows you to structure your code in a modular way.\
    \ By understanding these principles, you'll be able to create robust and maintainable\
    \ applications.\n\n## 5.1 Introduction to Object-Oriented Programming (OOP)\n\n\
    Object-Oriented Programming represents a programming approach that is centered\
    \ on the notion of objects. An object denotes a real-world item or idea, encompassing\
    \ its attributes and methods. OOP promotes the use of classes and objects to solve\
    \ complex problems.\n\n### 1. Encapsulation\n\nEncapsulation is the practice of\
    \ bundling data and methods that operate on that data within a single unit called\
    \ a class. It allows you to hide internal implementation details and expose only\
    \ the necessary interfaces to interact with the object. By encapsulating data,\
    \ you ensure data integrity.\n\n### 2. Abstraction\n\nAbstraction represents the\
    \ technique of streamlining intricate systems by highlighting crucial characteristics\
    \ while concealing non-essential specifics. In OOP, abstraction is achieved through\
    \ abstract classes and interfaces. Abstract classes define common characteristics\
    \ shared by a group of related classes, while interfaces define a contract that\
    \ classes must adhere to.\n\n### 3. Inheritance\n\nInheritance is a mechanism\
    \ that allows you to define a new class based on an existing class. The new class,\
    \ called a subclass or derived class, inherits the attributes and behaviors of\
    \ the existing class, called the superclass or base class. Inheritance promotes\
    \ code reuse and enables you to create specialized classes.\n\n### 4. Polymorphism\n\
    \nPolymorphism grants the ability to handle objects from diverse classes as if\
    \ they belong to a shared parent class. It enables you to use a single interface\
    \ to represent different implementations. Polymorphism is accomplished via two\
    \ techniques: method overriding and method overloading.\n"
  mdcn: "\n\n# 第 4 章：数组与 ArrayList：操作集合\n\n欢迎来到《Java编程入门：从零解锁你的编程潜力！》第 4 章。在本章中，我们将深入探讨\
