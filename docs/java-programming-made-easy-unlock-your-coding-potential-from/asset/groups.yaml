    Lambda 表达式是 Java 向函数式编程转变的基础部分。它们提供了一种简洁的方式来表示方法接口。Lambda 表达式有利于事件处理和数据处理。


    ```java

    Function<Integer, Integer> square = (num) -> num * num; System.out.println(square.apply(5));
