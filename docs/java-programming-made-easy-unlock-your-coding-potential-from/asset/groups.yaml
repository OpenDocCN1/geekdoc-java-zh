    ## 2.4 Type Casting


    It''s particularly useful when you need to perform operations or assignments between
    different data types. Let''s explore the two types of type casting: implicit casting
    and explicit casting.


    ### Step 1: Implicit Casting


    Implicit casting, also known as widening conversion, happens automatically when
    you assign a value of a smaller data type to a larger data type. For example,
    assigning an **int** value to a **long** variable is an implicit cast because
    **long** can accommodate the larger range of **int**.


    ### Step 2: Explicit Casting


    Explicit casting, also known as narrowing conversion, requires you to specify
    the target data type in parentheses before the value. Explicit casting is necessary
    when you want to assign a larger data type to a smaller data type, potentially
    resulting in a loss of precision.


    ## 2.5 Choosing the Right Data Type


    Choosing the appropriate data type is crucial for efficient memory usage and program
    execution. Let''s discuss some guidelines to help you choose the right data type
    for your variables.


    ### Step 1: Consider Data Range and Precision


    Choose a data type that can adequately represent the range of values you need.
    If you require decimal precision, opt for floating-point data types. For whole
    numbers, use appropriate integer types.


    ### Step 2: Account for Memory Usage


    Consider the memory requirements of your program. Using larger data types when
    smaller ones can waste memory. Optimize memory usage by selecting the smallest
    data type that can hold your required values.


    ### Step 3: Ensure Compatibility with Operations


    Some operations may have specific data type requirements. Ensure that the data
    types you choose are compatible with the operations you intend to perform. For
    example, if you need to perform mathematical calculations, floating-point data
    types might be necessary.


    ## 2.6 Ready to Harness the Power of Variables and Data Types


    Congratulations! You''ve gained a solid understanding of variables and data types
    in Java. By mastering these concepts, you have the foundation to create dynamic
    and versatile programs. But remember, this is just the tip of the iceberg in your
    Java programming journey.


    In the next chapter, we''ll explore control flow statements, such as conditionals
    and loops, which allow your programs to make decisions and repeat actions.


    # Chapter 3: Control Flow: Conditionals and Loops


    Conditionals, also known as decision-making statements, allow your program to
    execute different blocks of code based on specified conditions. This gives you
    the power to control the flow of your program''s execution. Let''s dive into the
    most commonly used conditional statements in Java.


    ### Step 1: if Statement


    For example, let''s say you want to check if a person is eligible to vote. You
    can use an if statement to determine if their age is 18 or above:


    ```java

    int age = 20; if (age >= 18) { System.out.println("You are eligible to vote!");
    }

    ```


    For example, let''s say you want to check if a number is positive or negative.
    You can use an if-else statement to display the appropriate message:


    ```java

    int number = -5; if (number > 0) { System.out.println("The number is positive.");
    } else { System.out.println("The number is negative."); }

    ```


    ### Step 3: if-else if-else Statement


    The if-else if-else statement allows you to handle multiple conditions and execute
    different blocks of code based on those conditions. The syntax is as follows:


    For example, let''s say you want to assign a letter grade based on a student''s
    score. You can use an if-else if-else statement to determine the appropriate grade:


    ```java

    int score = 75; if (score >= 90) { System.out.println("Grade: A"); } else if (score
    >= 80) { System.out.println("Grade: B"); } else if (score >= 70) { System.out.println("Grade:
    C"); } else if (score >= 60) { System.out.println("Grade: D"); } else { System.out.println("Grade:
    F"); }

    ```


    ## 3.2 Introduction to Loops


    Loops allow you to repeat a block of code multiple times, making it easier to
    perform repetitive tasks and iterate over data structures. Let''s explore the
    different types of loops in Java.


    ### Step 1: Loop


    The for loop is used when you know the exact number of iterations you want to
    perform. You can use a for loop to achieve this:


    ```java

    for (int i = 1; i <= 5; i++) { System.out.println(i); }

    ```


    ### Step 2: while Loop


    The **while** loop is used when you want to repeat a block of code as long as
    a condition is true. The syntax of a **while** loop is as follows:


    ```java

    while (condition) { // Code to be executed as long as the condition is true }

    ```


    For example, let''s say you want to print the numbers from 1 to 5 using a **while**
    loop:


    ```java

    int i = 1; while (i <= 5) { System.out.println(i); i++; }

    ```


    ### Step 3: do-while Loop


    The **do-while** loop is similar to the **while** loop, but it guarantees that
    the code block is executed at least once, even if the condition is initially false.
    The syntax of a **do-while** loop is as follows:


    ```java

    do { // Code to be executed } while (condition);

    ```


    For example, let''s say you want to ask the user for a positive number. You can
    use a **do-while** loop to repeatedly prompt the user until they enter a positive
    number:


    ```java

    int number; do { System.out.println("Enter a positive number: "); number = scanner.nextInt();
    } while (number <= 0);

    ```


    ## 3.3 Breaking and Skipping Loop Iterations


    Sometimes, you may need to prematurely exit a loop or skip certain iterations
    based on specific conditions. Java provides keywords that allow you to achieve
    these behaviors.


    ### Step 1: break Statement


    The **break** statement allows you to exit a loop prematurely, even if the loop
    condition is still true. It is often used when a certain condition is met, and
    you want to stop the loop. For example:


    ```java

    for (int i = 1; i <= 10; i++) { if (i == 5) { break; } System.out.println(i);
    }

    ```

    In this example, the `break` statement is used to exit the `for` loop when `i`
    is 5. As a result, only the numbers 1, 2, 3, and 4 will be printed.


    ### Step 2: continue Statement


    The `continue` statement allows you to skip the rest of the current iteration
    and move to the next iteration of the loop. It is often used when you want to
    skip certain iterations based on a condition. For example:


    ```java

    for (int i = 1; i <= 10; i++) { if (i % 2 == 0) { continue; } System.out.println(i);
    }

    ```

    In this example, the continue statement is used to skip even numbers. When i is
    divisible by 2, the remaining code within the loop is skipped, and the loop moves
    on to the next iteration.


    ## 3.4 Nested Loops


    In Java, you can have loops within loops, known as nested loops. This allows you
    to perform complex iterations and work with multi-dimensional data structures.
    Let''s explore an example of a nested loop.


    ### Step 1: Nested for Loops


    Nested for loops are commonly used when working with multi-dimensional arrays
    or performing iterations over two or more variables. For example, let''s say you
    want to print a pattern of stars in the shape of a right triangle:


    ```java

    for (int i = 1; i <= 5; i++) { for (int j = 1; j <= i; j++) { System.out.print("*");
    } System.out.println(); }

    ```

    In this example, the outer loop controls the number of rows, while the inner loop
    controls the number of stars in each row. As a result, the program will print
    the following pattern:


    ```

    *

    **

    ***

    ****

    *****

    ```


    ## 3.5 Ready to Take Control of Your Code


    Congratulations! You''ve gained a solid understanding of control flow in Java.
    By mastering conditionals and loops, you have the power to make decisions and
    perform repetitive tasks in your programs.


    But remember, this is just the beginning of your coding journey. In the next chapter,
    we''ll explore arrays and ArrayLists, which will enable you to work with collections
    of data more efficiently.

