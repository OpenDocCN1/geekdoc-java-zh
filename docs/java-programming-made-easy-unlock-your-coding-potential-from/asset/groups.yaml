    ## Chapter 13: Multithreading: Concurrent Programming in Java


    In today''s high-demand computing world, executing tasks sequentially or one at
    a time may not meet modern application needs. Users expect applications to perform
    tasks concurrently, enhancing efficiency and improving the overall user experience.
    This chapter introduces multithreading, a key feature in Java that addresses this
    need by allowing concurrent programming.


    ## 13.1 What is a Thread?


    In the simplest terms, a thread is a separate path of execution in a program.
    It''s the smallest unit that can be scheduled by an operating system. A single
    process can contain multiple threads, all running concurrently and potentially
    performing different tasks.


    ## 13.2 Creating a Thread in Java


    Java offers two methods for thread creation: one through the extension of the
    Thread class and another by implementing the Runnable interface.


    Extending the Thread class:


    ```java

    class MyThread extends Thread { public void run() { System.out.println("Thread
    is running."); } } public class Main { public static void main(String[] args)
    { MyThread myThread = new MyThread(); myThread.start(); } }

    ```


    Implementing the Runnable interface:


    ```java

    class MyRunnable implements Runnable { public void run() { System.out.println("Thread
    is running."); } } public class Main { public static void main(String[] args)
    { Thread myThread = new Thread(new MyRunnable()); myThread.start(); } }

    ```


    In both cases, the run() method contains the code to be executed in the thread.
    start() method is called to initiate the thread''s execution.


    ## 13.3 Thread States and Life Cycle


    - New: A newly created thread that has not yet started.

    - Runnable: A thread that is executing in the JVM.


    Understanding these states is crucial for managing thread execution effectively.


    ## 13.4 Thread Synchronization


    When multiple threads access shared resources, conflicts can arise. Synchronization
    is a mechanism that regulates the access of multiple threads to shared resources.
    In Java, we use the synchronized keyword to achieve this:


    ```java

    javaCopy code

    class Counter { int count; synchronized void increment() { count++; } } public
    class Main { public static void main(String[] args) { Counter c = new Counter();
    };

    ```


    ```java

    Thread t1 = new Thread(() -> for (int i = 0; i < 1000; i++) { c.increment(); }
    }); Thread t2 = new Thread(() -> { for (int i = 0; i < 1000; i++) { c.increment();
    } }); t1.start(); t2.start(); // join the threads to ensure count is updated after
    both threads finish t1.join(); t2.join(); System.out.println("Count: " + c.count);
    }

    ```


    Here, only one thread can access the increment() method at a time, preventing
    any interference between them.


    ## 13.5 Thread Communication


    Threads can communicate with each other using wait(), notify(), and notifyAll()
    methods. These methods are used in synchronized context to allow threads to wait
    for resources to become available and to notify other threads when resources have
    become available.


    ## 13.6 Thread Pool


    Creating a new thread for every task can be expensive in terms of time and resources.
    A thread pool is a group of pre-instantiated threads ready to execute tasks.


    Multithreading is a powerful concept that allows for concurrent programming in
    Java. While we''ve touched on many of the key aspects of multithreading in this
    chapter, mastering multithreading requires time, practice, and a deep understanding
    of the principles behind concurrent computing.


    From creating and managing threads, to understanding their lifecycle, synchronizing
    their tasks, and even pooling them for efficient resource management, we''ve covered
    a lot of ground. Take your time to digest these concepts, practice with hands-on
    examples, and explore the rich API that Java provides for multithreaded programming.
    Remember, the journey of learning is gradual, and each step forward brings you
    closer to mastering the art of multithreaded programming. Happy coding!


    ## Chapter 14: Advanced Topics: Generics, Lambda Expressions, and Streams


    As we venture deeper into Java, it becomes imperative to acquaint ourselves with
    some advanced topics that can significantly enhance your coding skills and broaden
    your understanding of the language. In this chapter, we''ll explore Generics,
    Lambda Expressions, and Streams, all of which play a vital role in developing
    robust and efficient Java applications.


    ## 14.1 Generics


    Generics add stability to your code by allowing you to specify, at compile time,
    the specific types that a collection can contain, or a method can operate upon.
    This feature helps prevent runtime type-casting errors and adds a layer of abstraction.


    For example, here''s a generic method that accepts an object of any type and prints
    it:


    ```java

    public static <T> void print(T object) { System.out.println(object); }

    ```


    And here''s how you might use generics with collections:


    ```java

    List<String> names = new ArrayList<>(); names.add("Alice"); names.add("Bob");

    ```


    ## 14.2 Lambda Expressions


    Lambda expressions are a fundamental part of Java''s shift towards functional
    programming. They provide a concise way to represent one method interface using
    an expression. Lambda expressions are beneficial for event handling and data processing.


    ```java

    Function<Integer, Integer> square = (num) -> num * num; System.out.println(square.apply(5));
    // prints 25

    ```


    ## 14.3 Streams


    Streams in Java 8 are a major abstraction that simplify operations on sets of
    data. Streams are particularly useful when working with large amounts of data,
    as they can optimize and simplify tasks such as filtering, mapping, or iterating
    over collections.


    Here''s an example of using a Stream to filter and print elements:


    ```java

    javaCopy code

    List<String> names = Arrays.asList("Alice", "Bob", "Charlie", "David"); names.stream()
    .filter(name -> name.startsWith("A")).forEach(System.out::println); // prints
    "Alice"

    ```


