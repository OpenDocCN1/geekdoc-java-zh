    # # Chapter 10: Introduction to GUI

    Programming with JavaFX


    We''ve written algorithms, dealt with exceptions, and manipulated files. Now let''s
    venture into a new domain: graphical user interfaces (GUIs). The console is a
    great tool for interaction, but when it comes to creating user-friendly applications,
    nothing beats a well-crafted GUI. In this chapter, we''ll explore GUI programming
    using JavaFX, a powerful platform for creating rich internet applications in Java.


    # ## 10.1 What is JavaFX?


    JavaFX is a Java library used to create desktop applications, as well as rich
    internet applications that can run on various devices. It''s a modern replacement
    for Swing, the older Java GUI toolkit, providing a much cleaner and more intuitive
    API.


    # ## 10.2 Setting Up Your Environment


    To get started with JavaFX, you need to have a suit-'
  - '[PAGE 74]


    able IDE installed, such as IntelliJ IDEA or Eclipse, and the JavaFX SDK. "The
    SDK can be obtained from the official site for download." Once downloaded, you
    need to set up the JavaFX library in your IDE. A plethora of online resources
    and official documentation are available to guide you through the setup process.


    # 10.3 Understanding the JavaFX Architecture


    At the heart of every JavaFX application is the Application class. Each JavaFX
    application needs to extend this class, where you''ll define the initial user
    interface within the start() method.


    JavaFX applications follow a stage-scene-graph metaphor. The Stage class represents
    the top-level container, or window. Inside this stage, you have a Scene that can
    hold various graphical components. These components are known as nodes, forming
    a tree-like structure, referred to as a scene graph.


    # 10.4 Layouts and Controls


    JavaFX provides a wide range of controls, such as'
- md: '

    buttons, text fields, checkboxes, and more. These controls can be added to the
    scene graph to create your user interface.


    To organize these controls, JavaFX offers different layouts including HBox, VBox,
    GridPane, and BorderPane, among others. Each layout has its own rules for arranging
    nodes, allowing you to create complex and responsive user interfaces.


    ## 10.5 Event Handling


    Interactive applications respond to user actions, such as clicks or key presses.
    In JavaFX, these are handled by registering event handlers on nodes. An event
    handler is simply a piece of code that''s executed in response to a specific event.


    For instance, a button click event can be handled by registering an EventHandler<ActionEvent>
    to the button, and providing an handle() method that dictates what happens when
    the button is clicked.


    ## 10.6 Styling with CSS


    JavaFX adopts web-standard Cascading Style Sheets (CSS) for styling its user interfaces.
    This allows you to separate the application''s look-and-feel from the application
    logic. JavaFX''s CSS is similar to the CSS used in web development, making it
    a familiar territory for those with web development background.


    ## 10.7 Scene Builder


    While it''s perfectly fine to create your JavaFX UI programmatically, using a
    tool like Scene Builder can drastically simplify the process. Scene Builder is
    a visual layout tool that lets you design your JavaFX application interface by
    dragging and dropping components, and it automatically generates the corresponding
    FXML code.


    As we wrap up this introductory chapter on JavaFX, keep in mind that building
    an effective GUI is both an art and a science. Understanding the mechanics of
    JavaFX is crucial, but so is the ability to craft an intuitive, user-friendly
    interface.


    While JavaFX might feel different from what we''ve covered so far, it''s an essential
    skill for Java programmers. So, dive in, experiment, and start building your own
    user interfaces. And remember, as with everything-else in programming, practice
    is key.


    ## Chapter 11: Event Handling and User Interaction


    With the basics of GUI programming under your belt, it''s time to bring your applications
    to life. A static interface can be attractive, but without the capability to interact
    with the user, it remains an inert digital painting. In this chapter, we''ll unravel
    the art of event handling and user interaction, adding responsiveness to your
    applications.


    ### 11.1 What is Event Handling?


    Event handling in programming refers to how a program responds to actions from
    the user, system, or another program. These actions, or "events," could be a mouse
    click, a key press, a system-generated notification, or more.


    As a coder, your task is to define "event handlers" - sections of code that respond
    to specific events. The event triggers the handler, which then executes the code
    to respond to the event.


    ### 11.2 Button Click Event in JavaFX


    Let''s start with a common event - a button click in JavaFX. You''d start by defining
    a button:


    ```java

    Button myButton = new Button("Click me");

    ```


    Now, let''s assign an event handler to this button using a lambda expression:


    ```java

    myButton.setOnAction(e -> { System.out.println("The button was clicked!"); });

    ```


    Here, setOnAction() is the method we use to register an event handler. The handler
    itself is a lambda expression, which gets triggered upon the click event. When
    the button is clicked, "The button was clicked!" will be printed to the console.


    ### 11.3 Event Handler for TextField


    Now, let''s see how we can handle events for a TextField. Let''s say we want our
    program to react when the user presses Enter after typing into a TextField.


    ```java

    TextField myTextField = new TextField();

    myTextField.setOnAction(e -> { System.out.println("You entered: " + myTextField.getText());
    });

    ```


    In this code, **myTextField.getText()** is used to get the text that the user
    entered. When the user hits Enter, the text field''s content will be printed to
    the console.


    ### 11.4 Mouse Events


    In addition to keyboard events, GUI applications often respond to mouse events,
    like clicks, movements, and drags. Let''s make our application react to a double-click
    event.


    ```java

    Scene myScene = new Scene(new Group(), 800, 600);

    myScene.setOnMouseClicked(e -> { if (e.getClickCount() == 2) { System.out.println("Double
    click detected!"); } });

    ```


    Here, we are setting the event handler directly on the scene. The getClickCount()
    function yields the quantity of mouse clicks tied to the given event. If it''s
    equal to 2, we print a message indicating a double click.


    ### 11.5 Understanding Event Types


    JavaFX has a wide range of event types that you can handle, from drag-and-drop
    events to touch events. By handling different event types, you can make your application
    highly interactive and responsive.


    For instance, let''s handle a key pressed event. We want to print a message to
    the console whenever the user presses the spacebar:


    ```java

    myScene.setOnKeyPressed(e -> { if (e.getCode() == KeyCode.SPACE) { System.out.println("Spacebar
    pressed!"); } }});

    ```


    Here, the setOnKeyPressed() method sets the event handler for the key pressed
    event. The getCode() method is used to determine which key was pressed.


    ### 11.6 Event Propagation


    In JavaFX, events have a specific propagation path. They start at the targeted
    node and then move up through the parent nodes. This is why an event can be handled
    by the node that was the target of the event or by any of its parent nodes.


    By understanding this event propagation, you can manage and control how events
    are handled in your application.


    Event handling is the heart of interactive programming. It brings your applications
    to life, allowing users to engage with your software in intuitive and meaningful
    ways.


    As we end this chapter, I encourage you to play around with event handling. Try
    different event types, play with event propagation, and experiment with various
    GUI components. Remember, hands-on practice is the best way to cement your understanding
    and hone your skills. Happy coding!


    ## Chapter 12: Working with Databases: JDBC and SQL


    The ability to persist and manipulate data is a cornerstone of modern software
    applications. Databases are integral to this process, enabling the storage, retrieval,
    and manipulation of data in an organized manner. This chapter will dive into Java''s
    interaction with databases, using JDBC (Java Database Connectivity) and SQL (Structured
    Query Language).


    ### 12.1 Understanding Databases and SQL


    Databases allow you to manage large amounts of data efficiently.


    SQL is a standard language used to manage and manipulate relational databases.
    It provides commands for tasks such as creating tables, inserting records, updating
    records, and fetching data.


    ### 12.2 Introduction to JDBC


    JDBC is a Java API that manages connecting to a database, executing commands and
    queries, handling result sets obtained from the database. It enables interaction
    with a wide range of databases, including MySQL, Oracle, and SQLite.


    ### 12.3 Setting Up a Database Connection


    Before you can interact with a database, you need to establish a connection using
    the **DriverManager.getConnection()** method. Here''s a basic example:


    ```java

    String url = "jdbc:mysql://localhost:3306/Database"; String username = "root";
    String password = "root"; Connection connection = DriverManager.getConnection(url,
    username, password);

    ```


    Remember to close the connection after you''re done to free up resources:


    ```java

    connection.close();

    ```


    ### 12.4 Executing SQL Statements


    With a connection established, you can execute SQL statements. The Statement and
    PreparedStatement interfaces allow you to execute SQL commands.


    For example, to execute a SELECT statement:


    ```java

    String sql = "SELECT * FROM Users"; Statement statement = connection.createStatement();
    ResultSet resultSet = statement.executeQuery(sql);

    ```


    While executing a query, the returned result is a ResultSet object, which can
    be used to iterate over the resulting records.


    ### 12.5 Processing Result Sets


    A ResultSet provides various methods to process the returned data. The next()
    method moves the cursor to the next row, and various getter methods (like getString(),
    getInt(), etc.) retrieve column values.

