    \n这是一个减少冗余和增加代码可重用性的极其强大的工具。在现实世界中，你可以将继承想象为孩子从父母那里继承特质。\n\n假设我们有一个名为 `Shape`（形状）的基类，它具有如颜色等属性以及\
