    # 2.4 Type Casting


    It''s particularly useful when you need to perform operations or assignments between
    different data types. Let''s explore the two types of type casting: implicit casting
    and explicit casting.


    Step 1: Implicit Casting


    Implicit casting, also known as widening conversion, happens automatically when
    you assign a value of a smaller data type to a larger data type. For example,
    assigning an **int** value to a **long** variable is an implicit cast because
    **long** can accommodate the larger range of **int**.


    Step 2: Explicit Casting


    Explicit casting, also known as narrowing conversion, requires you to specify
    the target data type in parentheses before the value. Explicit casting is necessary
    when you want to assign a larger data type to'
