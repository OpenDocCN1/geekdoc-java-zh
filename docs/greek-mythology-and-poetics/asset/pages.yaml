    In fact, it can be argued that the principle of economy is not a cause but an
    effect of traditional tradition. From the diachronic standpoint of one can imagine
    a scenario for the development of a distinctive generic epithet. Suppose that
    a traditional theme about one hero as given epithet becomes applied and reapplied
    to a succession of other heroes. Within parallel epic actions, then this epithet
    would follow these other heroes. If the theme is broad enough, and influential
    enough, may in time accommodate a whole class of heroes, as the figures assigned
    by tradition to the times of the Trojan War. By then, one original hero’s epithet
    may become appropriate to a whole set of other heroes to speak.


    As for epithets that still function in a distinctive phase, one sees them from
    the diachronic standpoint as capsules of traditional themes associated with the
    noun described. A distinctive epithet is a small theme that conjures a thought-association
    with the traditional essence of an epic figure, thing, or concept. To cite an
    example that has deserved become a commonplace: Odysseus is πολυtas ‘muchsuffering
    throughout the Iliad he is already in an epic tradition about adventures that
    he will after Troy. My saying “after” applies only to the narrative sequence:
    the Iliad is recording the fact that Odysseus already has an Odyssey tradition
    about him—which is certainly not the fixed Odyssey, the fixed text that has come
    down to us. In sum, the diachronic viewpoint suggests that the prime regulator
    of Homeric epithet in particular and formula in general is traditional theme rather
    than current meter.,22


