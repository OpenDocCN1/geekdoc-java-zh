    The primary narrative of Greek epic, which is the Trojan War, is self-motivated
    by the Indo-European social principle of counterbalancing praise and blame.

    It is precisely in this theme, the Judgment of Paris, that has found the most
    overt Greek example of a general Indo-European social ideology that he describes
    as trunctionalism. In Dumézil''s formulation, society as reflected by the Indo-European
    languages tends to divide the following three lines of ideological organization:
    (1) sovereignty, (2) warfare, (3) agriculture, herding, and fertility in general.53
    The theme of the Judgment of Paris reflects this pattern of trunctionalism. Paris
    the herdsman is being offered a gift from each of the three functions: (1) sovereignty,
    from Hera; (2) military supremacy, from Athena; and (3) sexual relations with
    Helen, the most beautiful woman on earth, from Aphrodite.54


    Thus the Judgment of Paris, the ultimate point of departure for the narrative
    traditions that we know as Homer''s epics, can it be judged as an epic theme with
    an Indo-European foundation. More broadly, Homer, can can be judged an authoritative
    source for the myths inherited by and through the Greek language.


