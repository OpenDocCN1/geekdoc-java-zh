  md: '# Séma má Noésis 203


    For understanding *sema* as a word connected with the semantics of thinking to
    be found in its working relationship with another word connected with mental activity,
    namely the noun *nous* ‘mind, sense, perception’, along with its derivative word
    *neoó* ‘perceive, take note, think, think through’ (whence the derivative noun
    *noesis*—and the second part of the title for this presentation). In order to
    grasp the semantic range of this difficult word *nodos* and its derivatives, it
    will be necessary to consider its etymology, as explored in a seminal work by
    Douglas Frame, who traces it back to an Indo-European root *nes-* meaning something
    like ‘return to light and life’.⁵ Ultimately, the etymology of both *sema* and
    *nous* will shed light on the working relationship of these words as reflected
    in poetic diction. And this working relationship will in turn, it is hoped, shed
    light on Greek concepts of cognition.⁶


    It seems easiest to begin with instances of *sema* as the key to a specific aspect
    of cognition. In particular, Homeric diction deploys *sema* as the conventional
    word for signs that lead to the recognition of Odysseus by *philoi*, who are ‘near
    and dear’ to him.⁷ Thus, for example, the scar of the disguised Odysseus is specified
    by *sema* for his old nurse Eurkleia (*Odyssey* xxii 73), for his loyal herds
    Eumaeus and Philoitiis (xx 217), and for his aged father Laertes (xx 329). An
    appropriate word for the ‘recognition’ of *sema* is the verb *anagnorizein* (ἀναγνώριζντος
    xxii 329), in the case of Laertes. The same verb recurs in the context of Penelope’s
    ‘recognizing’ (ἀναγνώριν xxiii 206) the *sema* (plural, same line) specified by
    the disguised Odysseus as clothes given to the real Odysseus by Penelope herself
    (that the clothes are the *sema* is confirmed at xx 255–257).


    In all these instances the narrative features the recognition of the *sema* ‘sign’
    as the crucial prerequisite for the recognition of Odysseus himself.⁸ Moreover,
