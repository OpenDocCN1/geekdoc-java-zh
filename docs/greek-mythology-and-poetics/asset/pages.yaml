    nThe Oral Poetics of Homer


    Since the discoveries of Milman Parry¹ and Albert Lord² about the nature of “oral
    poetry,” some problems have developed over how to define the formula. Parry’s
    own definition will serve as a useful point of departure: the formula is “a group
    of words which is regularly employed under the same metrical conditions to express
