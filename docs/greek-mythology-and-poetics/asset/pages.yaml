    as he had led here in vain host of Achaeans.


    In this imaginary situation the Trojan is entertaining the possibility of general
    failure after on the basis of one specific failure.


    There are times when the hyperbole achieved with this idiom here seems to be the
    case with the words spoken by Odysseus to the Cyclops after the hero has blinded
    the monster. If only I could you, say Odysseus to Cyclops, as surely as your father
    Poseidon will not restore your eyesight (Odyssey 523–525)! The hispanic reality
    of blinding of a god who is antagonistic to the hero is the basis for the even
    more hysteric wish of actually killing him. Similarly, in the first two passages
    that we have considered, Hektor can actually entertain the possibility of becoming
    a god himself on the basis of his certainty that he is about to destroy the Achaean
    expedition. The first time that Hektor uses the idiom under theory he is expressing
    his certainty that come next morning, he will defeat the Achaeans, most notably
    Diomedes (Iliad VIII 526–538); the second time, he is expressing the same certainty,
    although the focus of his attention has shifted from Diomedes to Ajax (XIII 829–832).
    Of course, the perceived reality of Hektor’s premise is at odds with the reality
    of the narrative: Hektor will not succeed in killing Diomedes or Ajax, nor for
    matter that he will succeed in repelling the Achaeans from Troy. Therefore, his
    hispanic wish to be a god is built on a premise of self-delusion, and his wording
    becomes an extended exercise in self-delusion. Since Hektor is speaking, we have
    no right to impose the reality of the narrative on Hektor’s perception of reality:
    for the wish to be a god is not contrary to fact, and it would be better for us
    to abandon the decidedly-to-fact translations “If I were not immortal . .” and
    “If only I were the child of aegis-bearing Zeus . . .” for VIII 538 and XIII 825,
    substituting something more neutral: “If I could be immortal . .” and “If only
    I could be the child of aegis-bearing Zeus . . .


