  md: '# The Hellenization of Indo-European Poetics


    The notion that the Homeric and Hesiodic poems were a pan-Hellenic phenomenon
    going back to the eighth century leads to the tempting scenario of connecting
    a likewise pan-Hellenic phenomenon, alphabetic writing: the formative stage of
    the Greek alphabet, after all, is dated to the eighth century. According to this
    scenario, the Homer and Hesiodic poems were enshrined for the Greeks because they
    were written down, thus becoming fixed texts thatated throughout the Hellenic
    world. The problem is, how exactly are we to imagine this proliferation? It is
    clear that literacy was a tenuous phenomenon throughout the archaic period of
    Greece, and the pan-Hellenic spread of the Homeric and Hesiodic poems during this
    period stretching from the eighth to the fifth century could hardly be attributed
    to some hypothetical circulation of manuscripts. To put it bluntly: it seems difficult
    to imagine an incipient eighth-century reading public—let alone one that could
    have stimulated this widespread circulation of the Homeric and Hesiodic poems.


    The argument for an archaic reading public is actually rendered pointless by the
    historical fact that the medium of transmitting the Homeric and Hesiodic poems
    was consistently of performance, not reading. One traditional context of poetic
    performance was the institution of pan-Hellenic festivals, where there may have
    well other appropriate poetic events. The competing performers at such events
    were called poets (as in Herodotus 5.67,1), one of whom has immortalized in Plato’s
    Ion. We learn the rhapsode Ion has come from his home in Ephesus to compete with
    other rhapsodes by reciting Homer at the Feast of the Panathenaia at Athens, having
    already won at another festival, the Feast of Asclepius in Epidauros (Ion 503ab).
    In the dialogue dramatized by Plato, Socrates asserts that Ion is a specialist
    in Homer, to the exclusion of Hesiod and Archilochus (Ion 531a and 532a)—the implication
    being that other rhapsodes specialize in these poets. Socrates and Ion then go
    to discuss the different repertoires required for the rhapsodes (see especially
    Ion 531d-a). In fact, Plato elsewhere presents Homer and Hesiod themselves as
    itinerant rhapsodes (Republic 600d). The examples could be multiplied, but the
    point is already clear: the proliferation of the Homeric and Hesiodic poems throughout
    Greece in the archaic period (and beyond) did depend on the factor of writing.


    8 Cf. N 1979a.8 § 15n1.

    9 For more on the rhapsodic recitation of the poetry of Archilochus, see e.g.
    Clearchus F 92 Weihr.'
