    from Helios. She promises Phaeton that, if his request is granted, he will have
    proof that his origin is divine (Θεοῦ πέπκας Euripides Phaeton 48). Phaeton wavers
    (51) but finally decides to go to Helios (61–62). His one request, to drive the
    chariot of Helios, is of course granted by his father. Ironically, however, this
    proof of his divine nature, inherited from his father, leads to fiery death. His
    death in turn is proof of his human nature, inherited from his mother. The self-delusion
    of Phaeton is that he overrated the relationship with his father. His real identity
    is composed of two ingredients, part “father” = immortal, part “mother” = mortal,
    but his imagined identity is all “father,” that is, he imagines he can function
    as an immortal since his father is immortal. His imagined identity impels him
    to assume the role of his father, but his real identity, part mortal, destines
    him to fail and die. Viewed from a standpoint outside the myth, Phaeton’s real
    identity is indeed that of the Sun, by way of hypostasis. Inside the myth, however,
    this identity is simply Phaeton’s imagination, and real identity is only partially
    solar. The self-delusion of Phaeton is comparable to another tragic figure, Oedipus.
    The delusion of Oedipus is that he underrated the relationship with his wife.
    His real identity is both “husband” and “son” of the same woman, but his imagined
    identity is only “husband.”66 A basic distinction between the delusions of Phaeton
    and Oedipus is that one forgets his real reality whereas the other is unaware
    of. Forgetting that his mother is human, Phaeton tries to be the Sun. Not knowing
    who his mother is, Oedipus marries her. In both cases, the imagined identity is
    tragically shattered.


    Aside from telling the dilemma of being human, the Phaeton myth also tells us
    something about the mystery of the Sun. A priori, we expect the Sun-god to be
    immortal. In the diction of Greek epic, he is counted among the ranks of the immortals
    gods. The movements of the sun suggest the theme of death and rebirth. With the
    waning of day, the old sun emerges beyond the horizon into the West Oceans; then,
    after night has passed, a new sun emerges from the East Oceans with the inescapable
    fact of human mortality, the fundamental dichotomy of man vs. mortal god = immortal,
    as we see throughout Greek epic diction: aththanatoi ‘immortals’ is a synonym
    of dei ‘gods’. Accordingly, it becomes inappropriate to associate any inherent
    death / rebirth of the sun directly with Helios the sun-god,


