    # The Language of Hesiod


    The figure of Hesiod can proudly announce his local origins and still speak in
    a language that has evolved to match the language of pan-Hellenic hymns, which
    in turn have evolved to match the language of the epics that they inaugurate.
    The poet of the Theogony can even equate the artistry of composing a pan-Hellenic
    theography with that of composing an epic (100–101)—and the ritual context that
    a local theogy would surely entail for us all forgotten.


    In fact, the diction of Hesiodic poetry is so akin to the Homeric that its self-proclaimed
    Boeetian provenance would be nearly impossible to detect on the basis of language.
    What is more, the Ionic phase of evolution and eventual crystallization is actually
    even stronger in the Hesiodic tradition than in the Homeric.⁹


    Granted, there have been attempts to establish linguistic differences between
    Homer and Hesiod, the most interesting of which is the finding that the first-
