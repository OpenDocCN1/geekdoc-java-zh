  md: '# 32 The Hellenization of Indo-European Poetics


    identical metrical positioning and identical phrasing.65 And yet, flexibility
    should not be confused with irregularity. Hainsworth''s study of flexibility in
    Homeric phraseology shows really just the opposite of irregularity, in the processes
    whereby one formula is transformed into another, with different metrical position,
    inflection, qualifier, and so on, are themselves highly regulated. The flexibility
    is also regular. In other words, the variations on the irregularities are also
    regular. The strictness is still there, and the synchronic perspective is simply
    not adequate to account for all its aspects.


    Here is where the dichronic approach is needed. It is from this perspective, as
    we see implicitly by the work of Russo and others,66 that the interaction between
    formula and meter can be best understood. The colon system of Greek hexameter,
    Russo argues, is correlated with a formula system that in turn is correlated with
    a syntax system. Russo is intuiting something about the evolution of traditional
    Greek poetry that can be seen readily from the comparative evidence of Indic poetry.
    (As in linguistics, the comparative method is invaluable for the dichronic perspective.)
    In the Rig-Veda we find that the correlations between metrical units (verse) and
    syntactic units (phrase or clause) are much more simple than those in Greek epic.
    Furthermore, as a synchronic examination will show, the regularities of meter
    are clearly subordinate to the diachronically generated from phraseological units.67
    Meter may then become a viable structure in its own right, and it may develop
    independently of traditional poetry. The Greek hexameter, as I have argued elsewhere,
    is an example of such development; it is built from smaller inherited meters,
    and thus can regularly accommodate two formulas and over.68


    Even if formula lengths do not correspond to the overall verse lengths of the
    Greek hexameter, they correspond to the metrical components of the verse length,
    namely the cola. Such correspondences are verifiable from a synchronic description.,69
    but it is important not to overemphasize the factor of cola and underemphas the
    factor of formulas. Again, the dichronic perspective suggests that formula shapes
    generated colon shapes, not vice versa.70 Accordingly, from the syn-


