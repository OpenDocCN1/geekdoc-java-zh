  md: '# 296 The Hellenization of Indo-European Social Ideology


    A more serious flaw in Combellack''s reasoning is that he has not examined exhaustively
    the Homeric parallels to the idiom that he has isolated in the two speeches of
    Hektor. Taking his examples from Leaf''s incomplete list of Homeric passages where
    the same idiom occurs, he cites the following as the closely parallel:


    > αἰ γὰρ μιν θανάτοιο δυσχυχέος ὧδε δύναίμν νόσφ ἀ ἀκρυπναι, ὅτε μιν μόρός αἰνὸς
    ἰκάνο,

    νῶς οἱ τεύχηα καλλὰ παρασέσεται


    Iliad XVIII 464–66


    If only I had the power to hide him from sorrowful death, when his dreadful fate
    comes upon him—as surely as there will be fine for him!


    Hephaistos is here wishing for something that seems at the moment impossible,
    and the wish is linked by the adverb ὧδε ‘so’ with the conjunction ὡς ‘as’ introduced
    an absolute certainty,that Achilles will have fine armor. In other words, the
    impossibility of the wish (that Achilles will be saved from death) is supposedly
    correlated with the certainty of the premise (that Achilles will have fine armor).
    The αἰ γάρ (+ optative) of the wish and the ὅδε ... ... ὡς that links it with
    the premise are parallel to the εἰ γάρ (+ optative) of Hektor''s wish to be an
    immortal (VIII 538 and XIII 825) and the ὅδε/οὐτος ... ὡς that links his wish
    with his premise disaster will surely befall the Achaeans (VIII 538–541 and XIII
    825–828).


    What has eluded Combellack, however, is that this same idiom can occur in situations
    where the wish was introduced by εἰ γάρ or the variants αἰ γάρ καὶ εἰθε is not
    perceived as impossible by the speaker. For example, the disguised Odysseus has
    this to say to Eumaios:


    > αἰθ’ οὗτος Ἔύμαι, φίλος Δὶ πατρί γένοιο

    ὡῶς ἐῷ, ὅτι τοῖν ἐόνν’ ἀγαθαῖν γεραίρεις


    Odyssey xiv 440–441


    If only, Eumaios, you would be dear to Zeus as surely you are dear to me, since
    you grace me, as I am, with good things.


    +   9 In this presentation I will for the sake of convenience reader Greek ‘so
    ... as’ constructions are treated consistently in the most of ‘... so ... as...’
    (pace Combellack 1981.119).'
