  md: '# The Hellenization of Indo-European Myth and Ritual


    3. name of the first sacrificer on earth, ancestor of mankind


    From these Vedic contexts of *vivasat*, it appears that the usage of the Indic
    verb *vas-* was appropriate to three parallel themes: the shining of the sun,
    the kindling of the sacrificial fire, and the begetting of progeny. Furthermore,
    as we have also seen, *vas-* implied creation as well as procreation.


    To repeat, Dumélüz argues that the root Indic *vas-* is cognate with the root
    *ues-* of Greek ‘heart’ (ἑστία) and of Latin Vesta, Roman goddess of hearth. Going
    beyond Dumélüz’s position, we may consider that this root *ues-* could be reconstructed
    further as *h₂ues*, despite the absence of any phonological trace of word-initial
    *h₂* before *u* in Greek *uestiā*, whence *hestiā* (ἑστία).²¹ This reconstruction
    is not essential to the main points to be said. If it turns out not to be valid,
    then the root *h₂ues-* of the Greek noun *hestiā* may be interpreted as a variant
    of the root *h₁es-* in the Hittite noun *hašuš* ‘earth’—and, I would add, in the
    Hindi verb *bah-* ‘beget’. A neat root-variation *h₂ues-* *h₁es-* would be in
    line with an Indo-European pattern attested in a series of possible examples


    > ⁰ 1954.34-35. In Ionic and other Greek dialects, there is a variant of Attic
    *hestiā* (ἑστία), nominal (Ionic genitive see DELG 379. I draw attention to the
    loss of *e* after the first labialt* in *hestiā*, to be reconstructed as *ustiā*.
    Such replacement of *e* by *u* in the labials is a feature of the “standard” Mycenaean
    dialect: see Householder and Nager 1972:784-785. In other words, there is a possibility
    that the variant form is a feature of the standard Mycenaean dialect of the second
    millennium b.c. For a further definition of “Mycenaean dialect”, see Rich 1996
    (updated in Rich 1979). For an alternative explanation of the *e* in *hestiā*,
    see Winter 1985:195-200. ²⁰ The absence of *h₂* before *u* in a hypothetical Greek
    formation *uestiā* may be explained by the basis of a combination of morphological
    and phonological factors. The first: the sub-formation of labials is a feature
    of *uestiā*, see DELG 379 out, suggests that this noun is derived from an adjective
    *uestā*, or possibly from *jestā*. Formation of *jest-* is a typical first in
    the second half of compound. What brings us to the second concern, that of morphology.
    It appears that *h₂*,*h₁* can disappear without trace in the second half of compounds
    (see Beekes 1969:242-243 for a list of examples; cf. Mayhofner 1986:125, 129,
    140). If so, then the argument in DELG that root *vas-* may be a derivative of
    cognates, we may explain the pattern of phonological instability in *uestiā*.
    There is another factor leading to a pattern of phonological instability in *hestiā*:
    ²¹, the expected *e* before *u* of *uesti-* is not ruled out (DELG 379). What
    we see at work is the force of analogy; we may posit a pairing in cognates of
    *hestiā* (ἑστία) and *eskharā* (ἐσχαρά): that eskharā is not valid, as DELG 379
    means. Because the semantic convergences between these two words for ‘fireplace’,
    *hestiā* and *eskharā* should we note, at this point, an important divergence
    that is pertinent to the semantics of other words for ‘fireplace’ to be studied
    later on in this presentation: unlike the *hestiā*, the *eskharā* is potentially
    movable: see Rabi 1981 (also DELG 379-380).'
