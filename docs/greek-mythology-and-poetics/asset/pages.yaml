  md: '# Unattainable Wishes 297


    αἰθ’ὕτος Εὔμαιε, φῖλος Διὶ πατρί γένοιο ὡς ἐμοί, ὅτι μ ἐπαουσας ἀλης καὶ οἰύζος
    αἰνῆς


    Odyssey xv 341–342


    If only, Eumaios, you would be dear to Zeus the Father as surely as you are dear
    to me, since you stopped my wandering and my dreadful sorrow.


    Clearly, it is not impossible that Eumaios should be dear to Zeus. The implication
    seems to be that he is probably, and this probability is reinforced by the certainty
    of Odysseus’ premise: that Eumaios is dear to Odysseus. In this connection, we
    may observe that Priam ironically addresses Achilles: αἰθ θευσί φῖλος τοσόνδὲ
    γένοιο ὅσσον ἐμοῖ ‘If only he would be dear to the gods as he is to me! (Iliad
    XXII 41–42).


    The idiom under consideration is frequently found in prayers, as Telemachus explains:


    > αὶ γάρ, Zeus Ζτὲ πάτέρ καὶ Ἀθναιναι καὶ Ἀπολλων, οὔτο νῦν μνηστήρσῃ δὲ ἡμετέροις
    δομοις νεῦπεν κεφαλὰς δεδσμιοι δεδεμένον, ο μέν ἐν αὐλῇ, ο 아닌 δ’ ἔνθοθε δόμο,
    λέῦτο δὲ γυῖ ἐκάστου, ὡς νῦν Ίρος κείνός ἀλείξῃ θύρινις ἕται νεστάζν κεφάλ


    Odyssey xviii 235–240


    > O Father Zeus, Athena, and Apollo, if only in our house the suitors could be
    defeated and bow their heads, some in the courtyard and some inside the house,
    the limbs unstrung in each of them—as surely as Iros is sitting at the courtyard
    gates, bowing his head


    Clearly, someone who prays is not contrasting the impossibility of his wish with
    the certainty of a situation (as Combbrack’s concept of the idiom would require);
    rather, he is appealing to this certainty as grounds for hope that the wish will
    be fulfilled.


