    Although the particulars may vary, Theognis, like Hesiod and Solon, is presented
    through his poetry as a personal exponent of *dikē* by virtue of his life as dramatized
    through his poetry. Unlike Solon''s poetry, which can refer to the *dikē* of a
    written law code as well (F 36.18–20), the poetry of Theognis refers only the
    *dikē* that emerges from his teachings, addressed to his young *hetairos* ''comrade''
    Kyrtnos and various minor characters. Still, this *dikē* has the force of a law
    code handed by a downlayer, as Theognis himself proclaims.³83


    χρὴ με παρ στάθην καὶ γάλώνα τίνδε δικάσσαι

    Κύρνε δίκην, εἰσον τ᾽ ἀμφότετερους δμεν·nμαντέις τ οἴνοχοις τε αὐθόμεις ἱρεοισιν,

