  md: '# viii Foreword


    as derived from Greek *müth*, is a case in point: the meaning of this word brings
    to life, in microcosm, the relationship between myth and ritual in ancient Greek
    society.


    In order to grasp the special meaning of Greek *müth*, let us consider the distinction
    between marked and unmarked speech (in the terminology of Prague School linguistics).
    We find that marked speech occurs as a rule in ritual contexts, as we can observe
    most clearly in the least complex or smallest-scale societies. It is in such societies
    also that we can observe most clearly the symbiosis of ritual and myth, and the
    ways in which the language of ritual and myth is marked, whereas “everyday” language
    is unmarked. The Greek language gives us an example of these semantics: *mio*
    mean “I have my eyes closed” or “I have my mouth closed” in everyday situations,
    but “I see in a special way” or “say in a special way” in ritual. Here *mistes*
    is “one who is initiated” and *mysterion* is “that into which one is initiated,
    *mysterium* (Latin). Hence *mythos*, “myth”: this word, it has been argued, is
    a derivative of *mio* and at an earlier stage mean “special” as opposed to “everyday”
    speech.


    A later example of such early patterns of thought occurs in Sophocles, *Oedipus
    at Columbus* 1641–1644—the visualization and the verbalization of what happened
    to Oedipus in the precinct of the Euclides at Columbus are restricted, that the
    precise location of the corpse is a sacred secret; Theseus, by virtue of being
    the proto-first for the Athenians of the here-and-now, is to what happened, which
    is called the *drömena* (1644). This word was Jane Harrison used to designate
    “ritual” in her formulation: myth is the plot of the *drömena*. Thus the visualization
    and the verbalization of the myth, what happened to Oedipus, are restricted by
    the context of ritual, controlled by the heritage of priestly authority from Theseus,
    culture-hero of the Athenian democracy.


    From an anthropological point of view, “myth” is indeed “special speech” in that
    it is a means by which society affirms its reality. Such a thought is pertinent
    to the territories of J. L. Austin and J. R. Searle concerning the performative
    aspects of language. A speech-act, according to Austin and Searle, entails a situation
    in which the word is the action; the antithesis of word and action is neutralized.
    Here we may invoke Barbara Johnson’s application of Austin’s notion of speech-act
    as poetry—an application that himself resisted. We may also go one step further,
    with the help of Richard Martin’s *Language of Heroes*, the first book in Myth
    and Poetics.³ Martin applies the notion of speech-act


    ³ R. P. Martin, *The Language of Heroes: Speech and Performance in the Iliad*
    (Ithaca, N.Y., 1989).'
