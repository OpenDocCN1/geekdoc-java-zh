    But the allusiveness extends even further. The ‘boneless one’ is also to be understood
    as an octopus (compare the syntax of *Works and Days 524*) containing *anósteos*,
    with that of Hesiod F 304.129 MW, containing *átríhos* ‘hairless one = snake,
    an animal that is conventionally pictured in Greek lore as eating its foot when
    it is hungry.¹¹⁷ The hungry octopus gnawing at its foot is described as living
    in cold and wretched haunts (*Works and Days 525), and this image of poverty takes
    us back to an earlier image of a poor man in winter, hiding swollen foot in emaciated
    hand (496–497); the Proclus commentary here cites an Ephesus law to the effect
    that a child could not be exposed until his father’s feet were swollen with famine.¹¹⁸
    Our thoughts turn to *Oidipous* ‘whose feet are swollen’, and the story of his
    exposure.


    In this connection we come to another occurrence of the word *poís* in this passage
    about winter: at *Works and Days 533–535*, the winter storm is described as making
    everyone turn over like a ‘three-footed’ man (533; compare 518). This knowing,
    which designates a man leaning on a walking stick, corresponds to the *aíigma*
    ‘riddle’ of the Sphinx as solved by Oidipous (Sophocles Oedipus Tyrannus 393,
    1525).¹¹⁹ Like the ‘boneless one’ who ‘gnaws’ his foot (*Works and Days 524*)
    and riddably knows by way of divination, the oracular tone of this passage of
    solving the Sphinx is sustained later (at *Works and Days 571*) with another kerning,
    *phériakos* ‘he carries his house (= snail),’, which is introduced by the expression
    *allót* ‘but whenever . .’ (571), a frequent introductory phrase in oracles.¹²⁰


    This said, we are still typically from understanding all the implications of this
    passage, just as we are far from understanding all that can be understood about
    Hesiod and his works.


    A definitive assessment of Hesiod’s poems is elusive, since we still know so little
    about their background. The best hope is that there will be further progress in
    rigorous internal analysis and systematic comparison with other attested Greek
    poetic traditions, so that tomorrow’s reader may better appreciate the mechanics
    and aesthetics of Hesiodic poetry. Even so, we shall always fall short, unless
    we recover all that this poetry presupposes of its own audience at large.


