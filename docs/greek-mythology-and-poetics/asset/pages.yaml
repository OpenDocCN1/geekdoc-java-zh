  md: '# Introduction


    This book concentrates on what ancient Greek society inherited through its language,
    described by linguists as belonging to the Indo-European language family. The
    span of time covered is roughly between the eighth and the fifth centuries B.C.
    My emphasis on the language of the Greeks, calling for comparison with the testimony
    of related Indo-European languages including Latin, Indic, and Hittite, reflects
    my long-standing interest in Indo-European linguistics, a discipline that has
    in the past been applied to the systematic study of society in such pioneering
    works as Emile Benveniste''s Le vocabulaire des institutions indo-européennes.¹
    This discipline of Indo-European linguistics aims to reconstruct, from various
    related Indo-European languages, a proto-language once described as "a glorious
    artifact, which is far more precious than anything an archaeologist could ever
    hope to unearth." To put it in most modest terms: the attempt to reconstruct a
    proto-language translates into an attempt to recover various patterns in society
    as articulated by language. Throughout the pages that follow, the primary aim
    is to examine the Greek language, by way of comparison with cognate languages,
    as a reflection of Greek society, as a vehicle of mythology and poetics.


    The emphasis of this book, however, is not on the Indo-European heritage of the
    Greek language. Rather, it is on the forces that transformed this Indo-European
    heritage into a distinctly Greek heritage; let us call it Hellenism. As for the
    process of transformation, let us call it


    ¹ Benveniste 1969.

    ² Haas 1969.34; cf. Watkins 1969.xx, 1973b.'
