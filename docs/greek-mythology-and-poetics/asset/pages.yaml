    It has been argued oftenen, and in many ways, that the poetry of Homer is unique,
    transcending his poetic heritage. The point of departure for this presentation
    is a confrontation with one such argument, concerning the meaning of the Homeric
    expression κλέος ἄφιθiton ‘fame ... imperishable’ at Iliad IX 413, cognate with
    the Indic expression śrasvas ... akṣitamam ‘fame ... imperishable’ at Rig-Veda
    1.9.7. I stress, at the very beginning, my own conclusion about these two expressions,
    following a long series of previous works leading to the same conclusion:¹ Greek
    κλέος ἄφιθiton and Indic śrasvas ... akṣitamam is a common Indo-European poetic
    expression.² An article concerning these two expressions, however, stresses the
    differences between the Greek and the Indic, concluding that the Homeric vision
    of imperishable fame is distinct and therefore unique to Homer.³ In


    ¹For a thorough bibliographical dossier, see Schmidt 1967.61–71.

    ²1974a, esp. 140–149, 244ff. On the factual matters that may be involved in the
    thesis of śrasvas and akṣitam see 1979b,605f.

    ³1980. The germ of the present chapter is derived from the N 1981a, which was
    written in response to Floyd’s arguments. There is another article that goes further:
    Floyd, Finkelberg 1986 (when Floyd was N 1980 but not N 1981a), claiming that
    the Homeric expression κλέος ἄφιθτον in Iliad IX 415 is not even an inherited
    formula. In response to a critique of Finkelberg, see [A.T.] Edwards 1988; also
    Watkins 1989. In Finkelberg’s argument that κλέος ἄφιθiton as used in Iliad IX
    413 is not a “self-contained unit,” I point to the discussion in N 1974a:104–109,
    where we discuss the relationships that link the phrase-types κλέος ἄφιθἔτον (as
    in Iliad IX 413), κλέος (as in VI 458), and κλέος ἄφιθον (as in Sappho F 4.4.4)
    are explored from the perspective of a narrower understanding of “Formula.” I
