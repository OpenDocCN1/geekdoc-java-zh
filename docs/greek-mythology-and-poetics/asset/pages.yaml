  md: '# Unattainable Wishes 301


    body exposed to the dogs and to refuse any ransom offered by Priam, the ghastly
    wish about cannibalism is as real as the almost as ghastly premise upon which
    it is founded. Achilles means what he wishes. It makes no sense to claim that
    he mentions the cannibalism as the most impossible thing he can think of in order
    to emphasize the certainty of the dogs tearing Hektor''s body.¹14 This is no time
    for Achilles to be resuring Hektor of a sort of modified beastiality, that he
    will go so far as to expose Hektor''s corpse to dogs but not so far as to eat
    himself. Rather, the beastly is an amplification of an already beastly premise.


    I come to the last example in my survey, a passage where Agamemnon has these words
    to say to Nestor:


    > ὦ γέρον, εἰθ'', ὡς θυμὸς ἐνὶ στήθεσσι φύλοσιν, ὡς το γόνατα ἔποτο, βήη δὲ τοῦ
    ἔπεδος εἴτε


    # Iliad IV 313–314


    Aged sir, if only your knees could keep with the pace and your strength could
    remain steadfast—as surely as the spirit within you is steadfast!


    The speaker is not telling the old man that it is impossible for him to keep up.
    Rather, he is paying tribute to an extraordinary man''s extraordinary spirit by
    amplifying his admiration with a wish.¹⁵


    For this idiom, especially in the last example, serves as a metaphor for the Hellenization
    with the ideal, the wish-fulfillment of human social ideology. If we may equate
    the Indo-European the ideal, the wish-fulfillment of human progress, then the
    Indo-European heritage of the Greek language, as an incomplete reflection of the
    past and the here-and-now, is a promise for that fulfillment.


    ¹⁴Combellack 1981.117.


    ¹⁵In the original version'
