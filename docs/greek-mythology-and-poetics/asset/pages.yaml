  md: '# Hesiod and the Poetics of Pan-Hellenism


    Life of Homer and the Life of Hesiod traditions. In its present form it is a late
    and accretive reworking that has generated much controversy about its authorship,
    a problem that cannot be addressed here.¹107 One thing is, however: the basic
    premise of the story—that Homer and Hesiod competed in a poetic contest—exhibits
    the characteristics of a traditional theme. This theme, moreover, corresponds
    to a basic truth about archaic Greek society: the performance of poetry, from
    the days of the oral poets all the way to the era of the rhapsodes, was by its
    nature a matter of competition.¹108


    # Prospects


    To treat Hesiod as an author will only accentuate our inability to appreciate
    fully his poems, as he represents a culmination of what must have been successive
    generations of singers interacting with their audiences throughout the Greek-speaking
    world. Whatever poetic devices we admire in the poems have been tested thousands
    of times, we may be sure, on the most discerning audiences. The unmistakable grounds
    of a Hesiodic poem''s structural unity are the result of streamlining by the tradition
    itself, achieved in the continuous process of a poem''s being recomposed in each
    new performance. Instead of referring to a poem in such a context, moreover, it
    would be better to speak in terms of *a tradition of performing a certain kind
    of poem.*


    With the important added factor of pan-Hellenic diffusion, the successive reimings
    of Hesiodic poetry in time become less varied, and more and crystallized, as the
    requirements of composition became increasingly universal. Of the rate of such
    crystallization, and the date, could have been different in each poem or even
    in different parts of the same poem. From this point of view, we can in principle
    include as Hesiodic even a composition like the Shield of Heracles, though it
    may contain references to the visual arts of the early sixth century. Scholars
    are took to dismiss this poem as not a genuine work on the basis of the dating
    alone, and it becomes the easier for them to undermine its artistic qualities
    on the grounds that it is merely an imitation of Hesiod.


