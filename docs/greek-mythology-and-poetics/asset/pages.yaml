    *haš-''beget'' to the noun *hašsa-''sacrificial fireplace''. As I hope to show
    in due course, the actual context for a semantic relationship between the concepts
    of ''beget'' and ''fireplace'' may be latent in the heritage of myth and ritual.


    There is a related problem, I suggest, in the semantics of the Hittite noun *haššu*,
    meaning ''king'', which has been connected in some studies with the verb *haš-''beget''.¹²
    In what follows, I shall be arguing that this noun and ''sacrificial fireplace''
    are derived from the same Hittite verb *haš-get''.¹³ Already at this point, we
    may note an analogous semantic relationship, if we fail to understand as of now
    the precise application of the note ''beget''. The English noun *king* and the
    German cognate *König* stem from a Germanic formation *kuningaz. This noun is
    a derivative of *kun-* (as in Gothic *kunī*, family''), a root with cognates in
    Latin *genus*, *gens*, *gignito* (e.g. Ennius Anals 24).¹⁴ As I also hope to show
    in due course, the actual context for a semantic relationship between the concepts
    of ''beget'' and ''king'' may be latent in the heritage of myth and ritual.


