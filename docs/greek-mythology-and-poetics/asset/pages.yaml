  md: '# Hesiod and the Poetics of Pan-Hellenism


    Perses has been reduced to utter penury and “now” comes to beg from Hesiod. The
    poet refuses to give him anything, teaching him instead to work the land for a
    living (396–397). While the authority of dīke emanating from Zeus and as represented
    by Hesiod is eventually taking hold, the sense of indignation originally felt
    by the poet against his brothers begins to recede; already by verse 286 he is
    expressing his good intentions toward Perses. Toward the latter half of the poem,
    the figure of Perses recedes in favor of a generalized second-person singular:
    it is as if Perses now tacitly ready to accept the teachings of his righteous
    brother.


    In the end, dīke ‘justice’ is totally vindicated in the Works and Days, and its
    eventual triumph is dramatized in the time that elapses in the course of the poem.
    Moreover, the function of the basileis ‘king’ as the authority who tells what
    is and not thēmis divine law by way of his dīke ‘judgment’ is taken over by the
    poet itself. The vantage point is pan-Hellenic, in that all cities of the Hellenes
    are reduced to two types, the polis of dīke (225–237) and the polis of húbris
    (238–247). Even the consistently plural of basileis ‘kings’ in the Works and Days
    suggests a pan-Hellenic perspective: from the Homeric tradition we see that each
    city is ruled by a single king.


    With an elision of kings, the Works and Days can address itself to any polis of,
    the eighth century or thereafter—whether its government is an oligarchy, a democracy,
    or even a tyranny. And the poem in effect communicates the universal foundation
    of the law codes to each Greek city-state.


    Even in a democracy like Athens, the laws of Solon, as his poetry proclaims, are
    founded on the authority of Zeus as king (F 31 W). Just as Zeus is the one ‘straightens
    as is crooked and withers the overweaving [Works and Days], as he is implied by
    Hesiod to ‘straighten the divine laws [thēmis plural] with dīke’ (9), so Solon’s
    Eonomía ‘good government by way of good law’ is a goddess who ‘hacks those without
    dīke’ (F 43 W), ‘blackens húbris’ (withers the sprouting outgrowths of democracy)
    (4.35), and ‘straightens crooked judgments [dīke democracy]’ (4.36). In the Theogony
    we see Zeus himself Eonomía, as well as Dīke (902); moreover, their mother is
    Thēmis, in the incarnation of divine law and order after defeating Typhoeus and
    swallowing Metis, the last two remaining threats to cosmic order.


    Assuming the stance of a lawgiver, Solon says in his poetry that he ‘wrote down’
    this themlois ‘laws’ after having adjusted a dīke that is straight for the noble
    and the base alike (F 36.18–20 W). But besides this law code, we must keep in
    mind the poetic traditions attributed to Solon; and in these traditions the figure
    of Solon functions'
