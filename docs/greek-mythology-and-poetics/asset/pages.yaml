    - Greek ἀσβόνη, ἀσβόλος - sacrificial fireplace, altar

    - Latin ārea, altāria - sacrificial fireplace, altar

    - Umbrian asa - sacrificial fireplace, altar

    - Umbrian aso - sacrificial fireplace (movable)


    The semantically anomalous reflexes of *h₂es- remain the Hittite verb haš-‘beget’
    and noun haššu-‘king’. In light of the myths and rituals that we have surveyed,
    these fit the broader context of the sacrificial fireplace as the generatrix of
    kingship and the authority of kingship, which has been all the focus of this inquiry.


