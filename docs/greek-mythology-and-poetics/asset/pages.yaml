    of a *neikos* ‘quarrel’ that the two of them must ‘sort out’ for themselves (verb
    *diakrīīnō* again), this time in the middle verse; verse 35.


    The figure of Hesiod resorts to reacting to the violent seizure of his property
    by Perses. He first tells the story of Prometheus and Pandora (Works and Days
    42–105), motivating the prime theme of man’s inherent need to work the land for
    a life. Then he tells Perses the myth of the five generations of mankind (106–201),
    which shows how mankind is elevated by *dikē* ‘justice’ and debased by its opposite,
    *hūbris* ‘outrage’. The Seventh and present generation, which is the Age of Iron,
    a time when *dikē* and *hūbris* are engaged in an ongoing struggle. As happens
    elsewhere in myths about the ages of mankind, the present encompassed by the final
    age merges with the future and becomes a prophecy⁷⁷ In a deeply pessimistic tone
    Hesiod predicts that *dikē* will fail lose to *hūbris* (Works and Days 190–194).
    Next, Hesiod tells the tale of the hawk and the nightingale (202–212), addressing
    it to kings whom he diplomatically presupposes to be *phronantes* ‘aware’ (202).
    Again the tone is pessimistic, at least in the immediate context: the hawk sees
    the nightingale, described as an *aoidos* ‘singer’, that is, ‘poet’ (206, 207,
    210), and he boasts of having the ultimate power of either releasing or devouring
    him (209).


    At this point Hesiod turns to Perses and, applying all that he has just told him,
    by urging his brother to expose *dikē* and reject *hūbris* (Works and Days 213).
    He warns that the fulfillment of *dikē* is an eventual process, and that *dikē*
