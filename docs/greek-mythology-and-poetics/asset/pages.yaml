    The Avestan ahu-‘essence’ of afterlife is ambivalent: for the good, it is vahiśta-
    ahu-‘best essence’ (Yasna 9.19, etc.), while for the bad it is acišta- ahu-‘worst
    essence’ (Yasna 30.4, etc.). There is a semantic parallel in the Vedic combination
    of as-u- and the epithet bhadrā-‘good’ (Rig-Veda 10.14.12).¹³⁴ In the Indic evidence,
    the contents of as-u are one-sided good. It happens, however, that the Avestan
    analogue to the Rig-Vedic combination of as-u plus root nī-‘lead’ (as in as-nūti-‘path
    leading to as-u)’¹³⁵ is in an evil context: tēm… ahim… naśatat may lead to such
    an [evil] ahu- (Yasna 31.20). As for good, another term for it ahu- manahia-‘essence’
    of manah, spiritual essence’ (Yasna 57.25, etc.), as opposed to the negative ahu-
    austuant-‘essence of bones’, Yasna 28.2, etc.). Not only is Avestan man-u cognate
    with Vedic as-u but also words, ahu- and mānas, that designate the elements of
    afterlife in the Indic traditions as correlates¹³⁶ Furthermore, as Vedic ahu-
    and mānas-ahu can function as correlates (Atharva-Veda 18.2.24, etc.), so also
    Avestan ahu and manah-¹³⁷


    yaohacā anhaat apṣatəm anhuš

    acišta dr̥gvyuatam

    aat asāūne vahištəm manō


    Yasna 30.4


    as the ahu- will be finally.

    It [ahu-] of the righteous will be the worst [acišta-], but the righteous will
    be the best [vahišta-] manah-


    The Iranian comparative evidence, where we see not only noun manah- coordinated
    with noun ahu- but also the adjective of noun manah- coordinated to noun ahu-
    (ahu- manahia-), helps account for the Greek evidence, where the adjective ei
    (hū) is subordinated to the noun mēnos (μένος) in the expression mēnos eū (μένος
    εῦ), in Iliad XX XXIV (66)¹³⁸ In brief, then we find coordination and subordination
    in Iranian (manah- plus ahu-, manahia- plus asū-), but only coordination in Indic
    (mānas- plus asú-) and only subordination in Greek (mēnos eū). The directions
    of subordination, moreover, are reversed in Greek and Iranian.


    ¹³⁴ See pp. 117.

    ¹³⁵ On which we see pp. 114.

    ¹³⁶ See pp. 87.

