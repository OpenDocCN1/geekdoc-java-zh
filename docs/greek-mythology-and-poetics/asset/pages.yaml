    ‘gust of wind’), and the other, Okupéê, the one who is ‘swifly flying’ (267).
    In short, the epic attestations of hárpuia betray a regal association with wind.
    Furthermore, this noun may be formally connected with the verb transmitted as
    ἀνηρεψάν ‘snatched up’ and ἀνερευμμένη ‘snatching up’ in Homer and Hesiod, respectively,
    as we may infer from the variant arepēia, attested in the Etymologicum Magnum
