  md: '# 20 The Hellenization of Indo-European Poetics


    reconstructed protolanguage may perhaps justifiably be called "a glorious artifact,
    one which is far more precious than anything an archaeologist could ever hope
    to unearth.\^8 Nevertheless, the point remains that reconstruction cannot yield
    all the answers. What is also needed is a thorough description of the structure
    of a given language as it exists at a time and place. Since the influential work
    of the linguist Ferdinand de Saussure, a perspective on language has been called
    ''synchronic,'' in contrast to the ''diachronic'' perspective, where we see the
    structure of a language as it evolves through time.^9 For solving most problems
    of language, it is now generally recognized that both perspectives are needed.^10


    These concepts of synchronic and diachronic are readily applicable to the study
    of oral poetry. What I propose to do throughout this presentation is to stress
    their abiding faithfulness. But first, let us quickly compare the history of oral
    studies with the history of fieldwork on South Slavic epic, which is an example
    of synchronic analysis, came much later than philological research into the genesis
    of the Homeric corpus, which is clearly diachronic analysis. In general, then,
    the evolution of linguistics and oral studies is parallel. In particular, too,
    it was the historical perspective, I submit, that had led Parry at the outset
    of his fieldwork to believe that South Slavic oral poetry lacked the degree of
    phrasing that could be found in the Iliad and Odyssey. Let it not go unsaid, though,
    Parry''s approach to the Homeric corpus was strictly synchronic: he was studying
    its formulas as blocks of a real system of traditionalition. My point is that
    Parry''s impressions of South Slavic poetry were influenced by the diachronic
    standpoint of his Homerist predecessors. Once his own synchronic perspective took
    hold, the essence of South Slavic oral poetry presented him with an altogether
    different picture.


