    the foundations of Dīké (4.14), who will come to exact just punishment “with the
    passage of time” (4.16).


    The Works and Days dramatizes the actual passage of time required for the workings
    of Hesiod. At the beginning of the poem we find the goddess implicitly violated
    through the forcible taking of Hesiod’s property by Perses and through the crooked
    judgment pronounced in unjust brother’s father by the greedy kings. At verse 39
    “this judgment [dīkē]” is still implicitly crooked as the poet begins to teach
    about Dīké, and the initial teachings are pessimistic about the outcome of the
    struggle between hūbris and dīké, as well the power of the hawk/king over the
    martingale/poet. By the time we reach verses 249 and 269, however, “this judgment
    [dīkē]” is in the light of the vengeance that Dīké herself took on those who violated
    her. Perses is urged to espouse her in the sense of ‘justice’ (275), since without
