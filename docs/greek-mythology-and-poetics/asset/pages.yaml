    περίβαλον γάρ οἱτερόφορον δέμας


    Aeschylus Agamemnon 1147


    for they [the gods] have flung [verb periballō] around her [Philomele] a feather-wearing
    body [démas]


    While contending that the verb *periballō* implies ''transform'' in this passage,
    other critics reject the argument that usage applies also to the context of Stesochorus
    PMG 236.³ Rather, he reads *periballō* in the Stesochorus fragment to merely deerskin
    Actaeon. For support, he cites the evidence from Greek iconography, where the
    motif of a dying Actaeon in deerskin is clearly attested.⁴ As a prime example,
    he singles out a metope from Temple E in Selinus (middle century B.C.).⁵, which
    features Actaeon wearing the deerskin and his hounds lunging more than at him.⁶


    Such evidence, however, is inconclusive: the theme of Actaeon''s wearing rather
    than the hide of a stag may be a visual as verbal metaphor. On the verbal level
    *periballō* implies clothing, as in the Philomele passage of a nightingale, but
    the words of Aeschylus represent the action as if she clothed with the *démas*
    ''body'' of a nightingale.


    The meaning of *periballō* as ''cloth'' is commonplace in Greek (Odyssey v 23,
    xii 148; Herodotus 1152.1, 9.109.1; Euripides Iigenia in Taurus 1150, and so on),
    and the derivative *peribléma* actually means ''garment'' (Aristotle Problemata
    870a27, etc.). I propose, then, that the *periballō* in Stesochorus PMG 236 is
    also metaphorical: ἐλάφου περιβαλεῖν δέρμα ''that the goddess flung the hide of
    a stag Actaeon'', meaning that the goddess transformed him into a stag.


    In favor of the nonmetaphorical interpretation, the objection remains that *démas*
    [deers-skin] is not the same as *démas* [body].⁷This does not reckon, however,
    with the traditional theme of equating one''s identity with one''s ''hide''. The
    lexical evidence of the Indo-European languages reveals traces of this equation.
    We may consider, for example, a cognate of Indic *tv-* ''hide'' and Greek *sakos*
    ''cowhide-shield'', namely Hittite *tweka*: besides meaning ''body'', this word
    is also regularly used to designate ''person, self, one''s own self.


    +   ³ Bowra 1961.99–100.

    ⁴ Bowra pp. 99–100, 125–126, with the alternative representation of Actaeon as
    sprouting antlers also taken into account.

    ⁵ Richter 1950 fig. 411.

    ⁶ Bowra 1961.125.

    ⁷ Bowra p. 100.'
