    that much than Hector he is of course expected not to retreat. What is hidden
    in these comparisons, however, is the relative status of the god; the uncle is
    Hektor and Hektor is Hektor to Apollo.11 From the standpoint of Hector, the premise
    in Apollo''s wish of the idiom is: the reality is inferior to Hector. From the
    standpoint of Apollo and the narrative, the premise is false: Apollo is superior,
    inferior, to Hector. Therefore the wish that is based on the premise that “that
    much of let me be much superior to you” is immeasurably more than Hector might
    think.


    By now I have discussed, besides those Homeric examples I have found myself, every
