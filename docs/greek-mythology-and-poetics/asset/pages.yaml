  md: '# 86 The Hellenization of Indo-European Myth and Ritual


    ultimately became the Greek language. Even more important for my purposes, the
    comparative evidence also suggests that the cremation of Patroklos is a traditional
    theme founded upon concepts of afterlife beyond Hades.


    For the moment, I choose the word “afterlife” instead of “rebirth” or eschatology.
    These other words are so pertinent to my inquiry: as we shall see in what follows,
    the Indo-European languages, Greek included, abound with early patterns of thought
    concerning life after death.⁴ Still, it is useful to start with the most general
    term possible.


    The concept of afterlife, as I argue, is implicit in the Homeric narrative of
    the cremation of Patroklos. Comparable concepts, as we shall see, are explicitly
    attested in Indic institutions, especially in prayers to the God Savity and in
    rituals involving the so-called Triple Fire. After a detailed exposition of the
    evidence, soon to follow, we shall also see that closely analogous concepts are
    represented—albeit indirectly—in the Greek evidence, specifically in the diction
    of Homeric poetry.⁵


