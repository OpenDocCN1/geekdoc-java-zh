    of old tritries or phrāiai were replaced by subdivisions of new tritries, further
    subdivided into territorial entities called dèoi. Aristotle says explicitly, it
    is also true that Kleisthenes did not reform the phrāiai or their constituencies,
    the genē ‘lineages’ (*Constitution of the Athenians* 21.6), so that the phrāiai
    would survive and live in minds even cooperate with the dēmoi. Still, that the
    new tritries were territorial units not necessarily mean that the phrāiai, ousted
    from functioning as subdivisions of the phūlai, had been devoid of any territorial
    principle. The subdivisions of the polis need not be conceived as marking differentiations
    exclusively in terms of territory or exclusively in terms of kinship (in the broader,
    particular sense of the word). After all, the Athenian dēmoi, by virtue of subdivisions
    of the new phūlai, became functional determinants of actual senses. Moreover,
    the concept of tritry, equated with phrātia by Aristotle in the fragment that
    we have considering, suggests some kind of distributive mechanism: we may recall
    that the concept of the new tritry, as established after Kleisthenes, served to
    distribute each of the ten new phūlai into distinct territorial variations.


