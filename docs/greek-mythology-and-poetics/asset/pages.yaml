    with eōs ‘dawn’ (six 320). This formērgenēa* is comparable to *Eridanos*, the
    first part of which is built upon ei; the second part *danos* means ‘dew’ or ‘fluid’
    (cf. Indic *dānu-*–fluid, dew).⁷⁷⁴


    We now come to the association of Phaethon with Aphrodite in Theogony 988–991.
    It arises, I propose, for a sexual theme implicit in a solar transition from death
    to rebirth. In the logic of the myth, it appears that the setting sun mates with
    the goddess of regeneration so that the rising sun may be reborn. If the setting
    sun is the same as the rising sun, then the goddess of regeneration may be viewed
    as both mother and foster.


