    in toponyms like Hammerfest. Conversely, Lithuanian akmuo ''rock, stone'' is cognate
    with Greek ákmōn, which means not ''hammer'' but ''anvil''. To complicate matters
    further, there are traces of the meaning ''thunderbolt'' in the usage of akmōn
    in Homer and Hesiodic deict.⁸¹ We even hear of a god Akmōn, father of Ouranos
    ''Sky'' (Alcmans PMG 61). Also, in a seventeenth-century account of pagan Lithuanian
    practices, there is a god (mentioned alongside Perkūnas himself) who is named
    Akmo and is described as saxum grandius.⁸² Amidst this complicated evidence, namely,
    that the word for the thunder-weapon is being applied to the thunder-target itself;
    also, that the meaning may be simplified to the extent of designating the weapon
    or the target, without any overt message about the thunder-stroke.


    As further illustration of the weapon/target ambiguity, we may consider the Indic
    noun asmán, cognate of Greek ákmōn and Lithuanian akmuo. This word is used in
    the Rig-Veda to designate the weapon of Indra (2.30.5, 4.22.1, 7.104.19). The
    activities of Indra, this national war-god, are as a rule in a specialized language
    that is so stylized that it tends to blur the naturalistic attributes of his background
    as thunder-god, more visible in his counterpart Parjnya.⁸³ Nevertheless, the natural
    attributes of Indra in the Rig-Veda gives rain (4.226.2), lightning comes from
    him (2.137.7), and he is likened to a thunder-cloud deriver (6.44.12), and he
    is specifically described as equal to Parjanya at meantime (8.6.1). Indra''s weapon
    is predominantly called the vātra, which, in keeping the stylistic specialization
    of his descriptions, becomes Indra''s personal distinguishing feature in the diction
    of the Rig-Veda. Like its owner, the vātra, too, has natural attributes that it
    thunders (1.100.13) and roars (2.11.10). With this vātra of his, Indra violently
    strikes boulders and thereby releases water or light—a theme so common that any
    listing of the attributes would be superfluous.⁸⁴ Suffice to note here that one
    of the words for ''boulder'' in the Rig-Veda is asmán (1.130.3, etc.), the same
    word that can designate Indra''s weapon (2.30.5, etc.).⁸⁵


