  md: '# On the Death of Actaeon 265


    may consider also Latin uersipellis, meaning literally ‘he whose hide is turned’
    (from verb verto ‘turn’ and noun pellis ‘hide, skin’). In Plautus Amphitruito
    123, uersipellis designates Jupiter when he transformed himself into the human
    Amphitru; in Pliny Natural History 8.34 and Petronius 62, uersipellis means ‘werewolf’.


    Thus we have comparative evidence in favor of the argument that the text of Stesochorus
    PMG 236 reflects a traditional usage, which we can interpret metaphorically to
    mean that Actaeon was indeed transformed into a stag. The iconographical evidence
    may be explained as an equally symbolic means of representing the same conception
    as we find in the poetic evidence.


    One last problem remains. It has been argued that such expressions as periballo
    in Stesochorus PMG 236 “are ultimately not metaphorical” on the grounds that the
    Actaeon myth seems to be connected with rituals of hunting. If I understand this
    argument, its underlying assumption is that metaphor must be incompatible with
    ritual. Such an assumption seems to me unjustified: for a ritual participant to
    wear the skin of a stag in a ritual context is potentially just as much a matter
    of metaphor as it is for an audience of myth to hear that Artemis flung the deerskin
    on Actaeon’s body.


    > 8Renner 1978.286n16, citing e.g. Burkert 1983.111–114.'
