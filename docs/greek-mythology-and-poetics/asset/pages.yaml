  md: '# Foreword


    *Greek Mythology and Poetics* is the second book in the Myth and Poetics series.
    My goal, as series editor, is to encourage work that will help integrate literary
    criticism with the approaches of anthropology and that will pay special attention
    to problems concerning the nexus of ritual and myth.


    For such an undertaking, we may look to the comparative testimony of relatively
    complex societies, such as the Ndembu of Zambia, and also of the very smallest,
    such as the Yukuna of the Colombian Amazon. Just as important as, we must pursue
    the varied testimonies of the most stratified societies, including those who go
    under the general heading “Western civilization.” It is precisely here that the
    meaning of myth is the most misleading—and challenging. In a small-scale society
    myth tends to be the encoding of society’s concept of truth; at the same time,
    from the viewpoint of Western civilization, myth has to be the opposite of fact,
    the antithesis of truth,


    Since the ancient Greek concept of *polia* serves as the foundation for the very
    word “civilization” and for our concept of Western civilization, more than one
    of the books in this series will deal primarily with ancient Greece and the ancient
    Greek city-state, or *polis*. The testimony of the Greeks is particularly instructive
    with regard to our central concern, the relationship between ritual and myth.
    The very word “myth,”


    > ^1V. Turner, *The Forest of Symbols: Aspects of Ndembu Ritual* (Ithaca, N.Y.,
    1967), and P.-Y. Jacopin, *La parole génative: De la mythologie des Indiens Yukuna*
    (diss., University of Neuchâtel, 1981).


    > ^2See especially M. Detienne, *L''invention de la mythologie* (Paris, 1981),
    and my review in Annales: Economies Sociétés Civilisations *37* (1982) 778–780.'
