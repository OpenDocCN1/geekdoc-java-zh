  md: 'Days 637–638. We see here a pointed contrast with a theme characteristic of
    ktisis (''foundation'') poetry, a genre that concerned itself with the great colonizations
    launched towards distant cities from the mainland and its periphery.⁹²


    One of the thematic conventions of foundation poetry is that the new cities sprang
    up in Asia Minor and elsewhere in the era of colonizations were founded by intrepid
    adventurers fleeing the poverty that overwhelmed them in the old cities. A worthy
    example is Kolophon, one of whose founders was ''the man in rags'', Râkios, who
    got his name ''because of his poverty and shabby clothes'' (scholia by Apollonius
    of Rhodes 1.308).⁹³ So also in the poetic traditions of Megara, which celebrated
    the city''s role as starting point for the foundations of many great cities, including
    Byzantium, in the era of colonizations⁹⁴ in search of relief from beneficial penia
    ''poverty'' (Theognis 179–180). When him, Hesiod''s father traveled all the way
    to Askra from Kyme, fleeing penia ''poverty'' (Works and Days 638), was in effect
    reversing the conventional pattern of colonization as narrated in ktisis poetry.


    To repeat, we have here a pointed negative reference as well: Hesiod''s father
    fled from penia ''poverty'' (Works and Days 638) and did not flee from wealth
    (637). The theme of wealth conjures the colonizers advance from rags to riches,
    making their new cities fabulously wealthy.⁹⁵ Another worthy is the city of Kolophon,
    which in time grew excessively rich (Athenaeus 1103–1104 quoting Xenophanes of
    Kolophon F 3 W), which led to Kolophon''s utter destruction. This fate, as the
    poet warns, is now looming over Megara as well. Further, we see that the hubris
    affecting Megara is manifested specifically as greed for the possessions of others,
    and that it brings about the ultimate debacement of the city''s nobility (Theognis
    833–836).


    Such warnings about debacement and even destruction recall the Hesiodic scheme
    of the two: the city of dike becomes fertile and rich (Works and Days 225–235),
    so that no one needs to sail the seas for a living (236–237), the city of hubris
    becomes sterile and poor (238–247), and its people are afflicted by wars (246)
    or by the storms that Zeus sends against them as they sail the seas


