    The most striking feature of this Aeneas/Achilles episode is that the Iliad in
    XX actually allows part of the Aeneas tradition to assert itself at the expense
    of Achilles, who had haunted Aeneas by predicting that he will never replace Priam
    as king of Troy (XX 178–183). The god Poseidon himself then predicts the opposite
    (XX 302–308); the dynasty of Aeneas will prevail in the Troad, and there will
    be a vindication of mēnis ‘anger’ against King Priam (XIII 460–461)—a theme that
    finds a parallel in the mēnis ‘anger’ of Achilles against King Agamemnon in Iliad
    Book I, verses 1 and following.


    One of the most obvious traces of a variant epic in Iliad XX is the surprising
    rescue of Trojan Aeneas by one of the most prominent Olympians, the god Poseidon.
    From the researches of Jacoby and others, we can reconstruct a motivation for
    the use of such a tradition. During the times that Iliad was evolving into its
    ultimate form, there may have well existed a cult affinity between the god Poseidon
    and a dynasty of Aeneadas descending from Aeneas. In Iliad XX (302–308) as well
    as in the Homeric Hymn to Aphrodite (196–197), the contemporary importance of
    such a dynasty is being rejected into the Heroic Age by such epic devices as the
    prophecy to Aeneas that his descendants, will be the ones who are to hold sway
    in the Troad. What has not been sufficiently stressed in previous studies, is
    that the traditions about the Aeneada themselves have been transmitted through
    the medium of epic. In other words, the wording of the Aeneas/Achilles episode
    shows that there had been a regional epic tradition about Aeneas that was destined
    to glorify the Aeneada–give them kleos.


