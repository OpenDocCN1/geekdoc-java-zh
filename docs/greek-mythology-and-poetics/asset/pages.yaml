    so on, emerged a complementary phenomenon of pan-Hellenism, formalized in institutions
    such as the Olympic Games, the Delphic Oracle, and the Homeric poems themselves.¹13


    In fact, Homeric poetry is a formalization of these phenomena: it synthesizes
    the diverse local traditions of each major city-state into a unified pan-Hellenic
    model that itself the ideology of the polis in general, but without being restricted
    to the ideology of any one polis in particular.¹⁴ Perhaps the clearest example
    is the Homeric concept of the Olympian gods, which incorporates yet goes beyond
    the religious traditions of each polis; the pan-Hellenic perspective of Homeric
    poetry has transcended local phenomena such as the cult of gods, which is functional
    only on the local level of the polis.¹⁵ By “cult” I mean a set of practices combining
    elements of ritual as well as myth. For a working definition of “ritual,” I choose
    the following formulation: “Ritual, in its outward aspect, is a programme of demonstrative
    acts to be performed in sequence and at a set place—sacred insofar as omission
    or deviation arouse anxiety and calls forth sanctions. As communication and social
