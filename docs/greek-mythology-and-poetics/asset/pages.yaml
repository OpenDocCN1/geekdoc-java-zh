  md: '# 146 The Hellenization of Indo-European Myth and Ritual


    # Greek Hestia, Latin Vesta, Indic Vivasat


    According to Georges Dumézil, the root *ues- of Greek *hestiā* ''earth'' (ἑστία)
    and Latin Vesta, Roman goddess of the hearth, is a cognate in the Indic form *vi-vās-vat*.$^{15}$
    The mythical Vivasat (*vi-vās-vat*), as we have already seen, is the first person
    to receive fire on earth; by virtue of the first sacrificer on earth; he is ipso
    facto the ancestor of the human race.$^{16}$ In Vedic, to say *sādane vivasvā*
    ''at the sacrifice of the Vivasat'' (Rig-Veda 1.53,1, etc.) is the same as saying
    ''at the sacrifice''. Vivasat, father of Yama (10.14.5, 10.17.1), is formally
    and thematically cognate with a figure in the Zoroastrian Avesta, Vivahvant, father
    of Yama. Vivahvant was the first person ever to prepare Haoma (Yajna 9.3–4). The
    association of Iranian Vivahvant with Haoma is crucial because the Indic has special
    associations with Soma (Rig-Veda 9.26.4, 9.10.5, etc.), and further, because Soma/Haoma
    (from Indo-Iranian *sauma*) constitutes Indo-Iranian sacrifice per excellence.$^{17}$


    The Indic form *vivāsvat* is an adjective derived from the verb *vas*, with the
    attested meaning ''shine''.$^{18}$ The Vedic god of sacrificial fire, Agni himself,
    is called the Vivasat at the morning sacrifice, as Usas the goddess of dawn appears
    (Rig-Veda 1.44.1, 7.9.3).$^{19}$ Uşas the Dawn is in the turn called the feminine
    equivalent, Vivasvati:


    ```

    diddykyanta usā yāmann aktor vivasvāty māhi citrām āṁīkam

    ```


    Rig-Veda 3.30.13


    at the coming of Usas from the darkness, they learn to see the great shining visage
    of the Vivasat


    When the fire-god Agni forgot the human race, "eye" was vivasvat:


    ```

    imah prajā anajanayan manunām vivasvā kākṣā dyām apś ca

    ```


    Rig-Veda 1.96.2


    $^{15}$ Dumézil 1954.34–35.

    $^{16}$ See p. 104.

    $^{17}$ See pp. 104ff.

    $^{18}$ Dumézil 1954.34.

    $^{19}$ Cf. p. 104, where Rig-Veda 7.9.3 is quoted.'
