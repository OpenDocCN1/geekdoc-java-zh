    Theognis 543–546


    I must pronounce this *dikē*, along [the straight line of] a carpenter''s life
    and square,

    and must give to both sides their equitable share,

    with the help of seers [mántis plural], portents, and burning sacrifice,

    and I must not incur shameful forfeit for veering.


    Solon, who protects “both sides” and allows “neither side” (*ἀμφότεροι/οὐδετέρους*
    at 544 above), Theognis presents himself as giving an equal share to “both sides”
    (*ἀμφότεροι*) Kyrtnos to walk “the middle road” (219–220, 331–332) and to give
    to “neither side” which belongs to the other (μηδετέτροι 332).


    The fact that Theognis pronounces this *dikē* (verse 544) in a setting of sacrifice
    and ritual correctness is significant in view of the later part of the *Works
    and Days*, where moral and ritual correctness are consistently made parallel.
    At verses 333–335 Hesiod''s clinging moral injunction to shun “deeds without *dikē*”
    is-followed up by further advice, this time a ritual injunction:


    καδὸ δύναμεν δ᾿ ἐπερὶν ἰερὶ δ᾿ ἀναθάτοσι θεοῖν

    ἄγνιῶς καὶ καθαρῶς, ἐπὶ δ᾿ ἀγλαὰ μὴρία καίειν·

    ἄλλο δὲ σπονδὴν θύεσις τε ἱλάσκεσθαι,

    ἡμεν ὅτ᾽ ἐὐνάκηη καὶ ὅτ᾽ φάς ἱερν ἔλθ,

    ὡς κεί το Ἰαλον κρδίνην καὶ θύμν ἔξωσιν.


