  md: '# Hesiod and the Poetics of Pan-Hellenism


    composes, composes while he performs. Looking beyond Yugoslavia, however, we find
    oral traditions in other cultures where the factor of performance has become separated
    from that of composition—revealed, for example, in the Old Provençal contrast
    of troubad (composer) and joglar (performer). There are also oral traditions,
    like those of the Somali, where composition may precede performance without any
    aid of writing. These and other examples are discussed in Ruth Finnegan''s Oral
    Poetry, which is useful for its adjustments to the Parry-Lord theories, that sometimes
    confuses oral poetry with the kind of free-associative improvisations that mark
    certain types of modern poetry in the West.


    "Improvise" is a particularly pernicious word when applied to traditional poetry—including
    that of Homer and Hesiod. An oral poet in a traditional society does not "make
    things up," since his function is to re-create the inherited values of those whom
    he composes/performs. As perhaps the most striking available example, I cite the
    Vedas of the Indic people—a vast body of sacred poems displaying the strictest
    imaginable form as well as content—formalizing the ideology of the priestly class
    without perceptible change for over two millennia. It should be added to this
    that, despite the availability of writing, the authority of the Vedas to day abides
    in the spoken word, not in any written text. Moreover, the Vedas have been transmitted
    unchanged, as a fixed "text," for all these years by way of mnemonic techniques
    that had been part of the oral tradition.¹⁹ Given the authority of the Homeric
    and Hesiodic poems by the time they surface in the historical period of Greece,
    it is not unreasonable to suppose that their rhapsodic transmission entailed comparable
    mnemonic efforts—which need not have required writing at all. In theory, though,
    written texts of the Homeric and Hesiodic poems could have been generated at many
    times—in fact—during the lengthy phase of rhapsodic transmission.


    In the case of Homeric and Hesiodic poetry, composition and proliferation had
    not been separate factors. It is not as if composition had to evolve into perfection
    before it was disseminated throughout the city-states. Rather, in view of the
    pan-Hellenic status ultimately achieved by the Homeric and Hesiodic poems, it
    is more likely that their composition and proliferation were combined factors.
    These poems, represent the culmination of compositional trends that were reaching
    their ultimate form, from the eighth century onward, and in the context of competitive
    performances at pan-Hellenic festivals and other


