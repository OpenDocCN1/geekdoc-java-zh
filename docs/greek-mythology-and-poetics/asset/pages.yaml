  md: '# 102 The Hellenization of Indo-European Myth and Ritual


    Apām Nāpāt, Apām Nāpāt is not Agni in all respects. Specifically, Apām Napāt lacks
    one of Agni’s three aspects: he is not at work on earth.


    To round out this complex picture of tripartite Agni, let us briefly consider
    his first provenance. Besides the earth-born Second Agni of the sacrificial fire
    and the water-born Third Agni of the sun, there is also the sky-born First Agni
    of lightning (*Rig-Veda* 10.45.1–3; also 1143.2, 3.2.13, 6.2). The water-born
    Agni has two *sadhastha*-‘abodes’, Sky and Ocean, the sky-born Agni in the form
    of lightning can go directly from Sky to Earth through the *antāriksa-*‘intermediate
    space’ (6.8.2, 10.65).


    The tripartite distribution of Agni is subject to a number of confusions. As lightning,
    sky-born Agni qualifies as being in the third sky (*Rig-Veda* 1.143.2, etc.);
    yet the sky-born Agni is the first Agni. Also, with the concept of celestial waters
    matching terrestrial waters (1.32.2, 12, etc.), it may seem tempting to imagine
    the water-born Agni as not only the sun but also lightning; and, yet, Indic ritual
    shows that water-born Agni was basically incompatible with the fire of lighting:
    according to the *Śatapapaṭ-Brāhmaṇa* (12.4.4.4; cf. Aitareya-Brāhmaṇa 7.7), “the
    Agni in the waters” must be extracted from lightning which has been mixed with
    sacrificial fire⁷⁵


    Lightning, however, is not the only form in which Agni comes from Sky to Earth.
    We are now about to see the purpose of Agni’s tripartition, which links the mastery
    with the mystery of terrestrial fire’s origin from celestial fire. We begin with
    the Vedic concept of human reproduction, where the male plants the *garbha*‘embryo’
    in the uterus of the female: then when Agni impregnates Earth with rainwater,
    the embryo is no other than the ‘Agni in the waters, and this embryo is lodged
    within the plants that grow out of impregnated Earth (*Rig-Veda* 7.9.3, 8.43.9,
    1.114.4, etc.)⁷⁴ One of the designations of Agni within plants is actually *apām
    garbha*--‘embryo of the waters’ (7.9.3); one of the designations of ‘plant’ is
    *oṣadhi*:-


    ```

    apsv agne sādhi tva

    sauṣhiṛ anu rudhyase

    ```


    Rig-Veda 8.43.3


    Your station is in waters, Agni;

    you grow into oṣadhiś.


    ⁷⁵ Also in the *Atharva-Veda*, there is an explicit distinction between the Agni-s
    of the waters and the Agni-s of lightning (3.21.1, 7; 8.11.11, 12.1.37).

    ⁷⁴ Cf. Bergaigne 1878 1:17, Oldenberg 1917.113–114.'
