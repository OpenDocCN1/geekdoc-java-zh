    the utter defeat of hūbris by the deity of Zeus.


    Hesiod''s pervasive affinities with Zeus, as with Apollo and his Olympian Muses,
    are paralleled by his affinities with the goddess Hekate she is celebrated in
    Theogony 404–452. Like Zeus, this goddess is an ideal paradigm for the pan-Hellenic
    nature of Hesiodic poetry. Thanks to the sanctions of the supreme god (*Theogony*
    411–415, 423–425), Hekate has to share a share in the divine functions of all
    the gods (421–422). Accordingly, the invocation of Hekate at a sacrifice is tantamount
