  md: '# CHAPTER 12


    # # Mythical Foundations of Greek Society

    and the Concept of the City-State


    The kinship terminology of the various Indo-European languages, as outlined in
    Emile Benveniste''s Le vocabulaire des institutions indo-européennes (1969), shows
    clearly that the basis of Indo-European social organization was the tribe.^1 For
    the word ''tribe,'' I find the working definition of Montgomery Watt, in his study
    of pre-Islamic Arab society, particularly useful: ''a body of people linked together
    by kinship, whether in the male or in the female line.''2 The kinship, of course,
    may be a matter of confederation, not genetic affiliation, and the common ancestry
    of the given body of people may be a matter of mythopoeic thinking, not reality.^3


    The problem is, efforts to study the Indo-European heritage of tribal organization
    have been impeded by the fact that most Indo-European languages are attested in
