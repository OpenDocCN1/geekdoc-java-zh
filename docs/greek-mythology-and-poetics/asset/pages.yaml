  md: '# Patroklos and the Indic Triple Fire 99


    which has it that there is an East Ocean and a West Ocean (10.136.5), and that
    there are four Oceans (9.33.6). These concepts seem to be based on myopoetic patterns
    of cosmic order rather than geographical experience, so there is room for believing
    also in an upper Ocean matching the Sky as well as a lower Ocean matching the
    Earth (cf. 10.98.5,12). But this distinction is a sophisticated elaboration: the
    basic idea remains that the Ocean comes between where the Earth stops and the
    Sky begins. It follows, then, that the sun submerges in the Ocean at sunset and
    emerges from it at sunrise; in fact, this concept is explicit in the testimony
    of the Taittīrya-Āryaka (4.42.33) and the Aitareya-Brāhmāna (4.20.13; cf. Atharva-Veda
    13.2.14). Thus the birth of Pūsan from the Sky/Earth (Rig-Veda 10.17.6) must mean
    that the sun was born of the Ocean. It is for this reason that Pusan’s solar correlate
    Savity is specifically called apām napāt ‘progeny of the waters’ (12.26); furthermore,
    Savit as Apām Napät knows such secrets as the fountainhead of the Ocean gushes
    forth (10.149.2). As for the two sathhas ‘abodes’ of Pūsan (10.17.6), it must
    be the Sky and the Ocean: as he travels to and fro (*ā pārā carāti*), he goes
    east to west in the Sky at day, and somehow, west to east after night having plunged
    into the Ocean.


    To contrasted with the two sathhas ‘abodes’ of Pūsan are the three sathhas of
    the fire-god Agni (Rig-Veda 3.20.2, etc.); in fact of Agni’s epithets is having
    three sathhas’ (5.4.8, etc.). Unlike the fire of the sun, which has abodes only
    in the sky and in water, Agni as sacrificial fire abides also on earth. The word
    itself means ‘fire’, cognate with Latin ignis. Agni as sacrificial fire is kindled
    on earth so that the sun may rise (4.3.11, 5.6.4). If there were no sacrificial
    fire at dawn, there would be no sunrise ofatapatha-Brāhmāna (2.3.1). From a cosmic
    point of view, Agni himself caused the rise (Rig-Veda 10.15.6).


    The three sathhas ‘abodes’ of Agni correspond to three different provences of
    Agni, and the Rig-Veda reveals them in the following order (10.45.1).


