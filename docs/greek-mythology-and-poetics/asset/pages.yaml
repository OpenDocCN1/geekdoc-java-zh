  md: '# Patroklos and the Indic Triple Fire 107


    — the sun plunges into the waters of the west only to be reborn the next day from
    the waters of the east;


    — celestial fire is hidden in raindrops that impregnate the earth; it remains
    in plants that grow out of the earth; then it is rubbed off of wood as terrestrial
    fire.


    The distinction in myth, as we shall now see, is ritually conveyed by the interplay
    of the Gārhapatya and the Āhavaniya.


    The fireplace of the Gārhapatya is set up in a circular enclosure, with the space
    on the inside representing the earth and the space on the outside representing
    the ocean around it (these ritual symbols are definitively and explicitly recounted
    in Satpathabrahhma 7.1.1.8, 13); the enclosure, set off with bricks, is circular
    because the shape of the earth is circular (7.1.1.37). We note that the being
    are symbolized as being outside the enclosure that is to receive the terrestrial
    fire, the Gārhapatya.


    By contrast, the fireplace of the Āhavaniya is set up in a quadrilateral enclosure
    representing the dyiaus ‘sky’, with a lotus leaf placed inside the enclosure for
    the specific purpose of representing the waters (again, these symbols are definitively
    and explicitly recounted in Satpatha 7.3.1.9). The enclosure of the Āhavaniya
    is quadrilateral because the four directions—north, south, east, west—can be ascended
    from the dynamics of the sky (the sun’s path, the stars’ positions); orientation
    comes from the sky, not from earth—which is therefore symbolized as circular,
    that is, without directional coordinates of its own. We note that the waters are
    symbolized as being inside the enclosure that is to receive the celestial fire,
    the Āhavaniya. Unlike terrestrial fire, celestial fire is compatible with its
    opposite element, water: in microcosm, the sun dips into the waters of the west
    only to be reborn the next day in the waters of the east.


    While taking into account the distinctions between the cults of the Indic peoples,
    attested at a nomadic stage, and the cults of the Italic peoples, attested at
    a sedentary stage of development, Dumézil⁵ has noticed a remarkable parallelism
    between the Indic Āhavaniya and the ordinary Roman templum, a quadrilateral precinct
    drawn along the lines of the four cardinal points of the sky (cf. Vitruvius 4.5);
    also between the Indic Gārhapatya and the aedes of Vesta, with its foundations
    built in the shape of a circle (hence the designation aedes instead of temple).
