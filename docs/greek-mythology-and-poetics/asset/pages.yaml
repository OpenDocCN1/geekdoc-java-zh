    of *dēmoi* ‘demes’. The mechanism for the territorial distribution of the *phūlai*
    was not the number 10 of the *phūlai* but the number 3 of the subdivisions of
    the *phūlai*, the tritties the territory of Athens was subdivided into three categories,
    (A) coastal, and (C) interior, and each of these categories of *tritties* was
    further subdivided into subtritties assigned to the ten *phūlai*.55 In other words,
    the ten *phūlai* were sufficiently distributed in each of the three areas A B
    C.56 Thus the ten *phūlai* were in effective territorial subdivisions of the A
    B C categories of the tritties, not of the one polis, while the A B C were political
    subdivisions of the ten *phūlai.


    As for the political system of Athens before the reform of Kleisthenes, there
    is a report that the polis had been subdivided into four *phūlai*, which each
    were subdivided into three tritties or *phráteries* (Aristotle Constitution of
    the Athenians, F 385 Note).57 The earlier phūlai of Athens, the Géontes, the Aikigores,
    the Argadeis, and the Hoplētes, were recognized as cognate with the basic four
