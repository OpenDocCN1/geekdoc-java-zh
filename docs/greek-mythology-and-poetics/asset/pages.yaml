  md: '# Formula and Meter 29


    Lack of uniformity is caused by the dimension of time as well as that of space.
    Although the medium of oral poetry may look upon itself as containing the original,
    actual words of the Heroic Age,"irrereplaceable and immortal,"45 its Dichtersprache
    will nevertheless undergo change in time, much as everyday language does. Since,
    however, epic resists change in order to preserve the ipsissima verba, the linguistic
    innovations that do occur in its Dichtersprache will not keep pace with the linguistic
    innovations of the everyday language from which it evolves. Consequently, the
    language of a body of oral poetry like the Iliad and Odyssey does not and cannot
    belong to any one time, any one place: in a word, it defies synchronic analysis46
    Such chronological stratification in form can surely be expected to affect content.
    Whereas, content, too, can be expected to shift with the passage of time—even
    if the actual shifts in the presentation of a given traditional theme to audiences
    from one generation to the next be too subtle for detection at any occasion of
    performance/composition. Change is possible if both performer and audience expect
    strict adherence to the traditional theme.


    Once made due allowances for some degree of evolution and variation in traditional
    theme, I must now return to emphasizing its remarkable stability and archaism.
    The fixing of phrasing in oral poetry, as I have argued, is actually due to the
    factor of traditional theme rather than meter. Accordingly, I offer a working
    definition of the formula that leaves out the factor of meter as the prime conditioning
    force: the formula is a fixed phrase conditioned by the traditional themes of
    oral poetry. Furthermore, I am ready to propose that meter is diachronically generated
    by phrase rather than versa.


    By applying the linguistic techniques of comparative reconstruction47 to the fixed
    prosody of native Greek and Indian poetry, I have argued elsewhere48 that it is
    possible to find cognate phrases containing shaped rhythms. The existence of such
    comparanda would corroborate the theory that the speakers of two Indo-European
    languages have preserved two cognate poetic systems.49 In the oldest attested
    phases of Indian poetry, moreover, it can be shown that phrase-ology is regular
    even where meter is irregular.50 This set of facts can be


