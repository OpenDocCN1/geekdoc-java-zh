  md: '# Hesiod and the Poetics of Pan-Hellenism


    Even if Homer and Hesiod were meant to be heard in performance, not read, there
    are those who insist that writing was an essential factor at least in the composition
    and transmission of their poetry. Here we must turn to the study of oral poetry,
    perfected by Milman Parry and Albert Lord.¹¹⁰ The fieldwork of these scholars
    was based on the living poetic traditions of the South Slavic peoples, and the
    theories that were developed from their fieldwork were then tested on Homeric—and
    on Hesiodic—poetry.¹¹¹ The findings of Parry and Lord have on occasion been viewed
    with suspicion by prominent Hellenists, who fear that the analogy between the
    typical Slavic guslar and a Homer demeans the latter and overly exalt the former.
    This is to misunderstand the intellectual basis of fieldwork—and of anthropological
    research in general Hellenists. The mechanics of living traditions, however lowly
    they may seem to, can provide indispensable information for extensive typological
    comparison with those of traditions, living or dead.


    We learn from the experience of fieldwork that composition in oral poetry becomes
    reality only in performance, and that the poet''s interaction with his audience
    can directly affect the form and content of composition as well as performance.
    Moreover, the actual works of formulaic dear are to be ascertained directly in
    the dimension of performance—a dimension that is course now extinct in the case
    of the Homeric and Hesiodic texts. In studying this factor of performance reflected
    by the living South Slavic traditions, Parry and Lord worked out criteria of formulaic
    behavior that, when applied to the Homeric text, it, too, as oral poetry. For
    example, one reliable indication of oral poetry is the principle of economy as
    it operates on the level of each individual performance; each position in the
    verse tends toward one way, rather in many ways, of saying one thing.¹² As it
    turns out, this principle is at work in Homeric poetry as well, which suggests
    that the composition of the Iliad and the Odyssey is also a matter of performance.¹³
    The principle of economy, as G. P. Edwards has demonstrated.¹⁴ is also at work
    in Hesiodic poetry; moreover, both Homeric and Hesiodic poetry reveal parallel
    patterns of general adherence to and occasional deviation from this principle.¹⁵


    If, then the Homeric and Hesiodic poems are reflexes of oral poetry, we can in
    theory eliminate writing as a factor in the composition of these


