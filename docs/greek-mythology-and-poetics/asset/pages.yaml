  md: '# 180 The Hellenization of Indo-European Myth and Ritual


    India.${103}$ Moreover, manure is the domestic fuel in latter-day India. If the
    custom of using manure for fuel is of Indo-Iranian provenance, then Avestan saairie
    hiia- may have at an early stage designated simply a place where manure was burned.


    To sum up: Zoroastrian orthodoxy prescribes manure as a resting place for the
    corpse; since corpse burning is forbidden, it follows that manure burning should
    also be forbidden because of the surviving association of manure with the resting
    place of the corpse. Because of this association, the use of manure for secular
    fuel may be forbidden along with its cremating of the corpse.


    In fact, the cost of burning manure may be of Indo-European provenance: we may
    consider the Latin noun *fimus* ''manure'', apparently derived from *fio* as *fumigative*
    (Cato de rustica 113.1) or ''burn for the purpose of fumigation'' (Pliny Natural
    History 28.42, etc.); we may compare the root-formation **dhū-* of suffix with
    the *dhū-* of fumus ''smoke''.${104}$ We may note also about the *stercus* ''manure''
    that is swept out of the precinct of Vesta, Roman goddess of the domestic fireplace
    (Varro De lingua latina 6.32, Festus 334 Lindsay).${105}$


    The subject of fumigation brings this presentation to a close. And so might say,
    very the entire study, the setting of the sacrificial fire. I cite the formation
    of fumigation **pūrigo*, which happens to be parallel to *pūrgo* ''purify'', from
    an earlier *pūrgo* (in Plautus Miles 177).${106}$ Following Rudolf Thurnysen,${107}$
    I interpret *pūrgo* ''purify'' as derived from an underlying expression **pūr
    agere* ''carry fire'', by way of the intermediate expression *rēmum agere* ''row'',
    derived from an underlying expression *remex*, remegis. Against the conventional
    rejection of Thurnysen sets an ordering **pur agere* ''carry fire'',${108}$ I
    cite the Umbrian colocation *pī ahtimmen tentu* ''place fire in the ahti-'' in
    Iguine Tables Ib 12, where pī (*<pūr*) is combined with the abstract noun ahti
    (*<ag-ti-*); derived from a verb surviving in Latin as agere.${109}$ The Umbrian
    receptacle of the sacred fire, is the source of purification for the community.


