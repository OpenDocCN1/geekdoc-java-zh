    # The Meaning of Hittite haš-/hašša-*haššu- from the Standpoint of Myth and Ritual


    Among the non-reflexes of the Indo-European root *h₂es-, our survey has suggested
    that the semantic basis is the notion of ‘fireplace’


    +   - Hittite haša - sacrificial fireplace

    - Indic aśa - ashes

    - Old Norse arrinn, etc. - sacrificial fireplace

    - German Esse, etc. - smith''s fireplace

