  md: '# Hesiod and the Poetics of Pan-Hellenism 37


    structure of epic, as is the case with mythmaking in general, frames a value system
    that sustains and in fact educates a given society.³ Conversely, as we shall see,
    the teachings of Hesiod frame an implicit narrative about the poet and his life.


    The question is, why were these poets universally accepted by the Greeks of Classical
    times? Such acceptance is especially remarkable in view of the striking diversity
    that characterizes Greece throughout this period. Each polis or ''city'' was a
    state unto itself, with its traditions in government, law, religion. Moreover,
    the diversity that prevailed among the many city-states of Greece had already
    taken shape by the eighth century, the very era that scholars agree in assigning
    to Homer and Hesiod. How, then, could the diversification of the Greeks coincide
    with the consolidation of their poetic heritage? The evidence of archaeology provides
    a partial answer. In the eighth century the emergence of distinct city-states
    with localized traditions was simultaneous with a countertrend of intercommunication
    among the elite of these city-states—the trend of pan-Hellenism.⁴ The patterns
    of intercommunication were confined to a few social phenomena, all dating with
    the eighth century: the organization of the Olympic Games; Apollo’s sanctuary
    and oracle at Delphi; organized colonies (the Greek word for which is ktisis);
    the proliferation of the alphabet⁵.


    Another phenomenon that may be included is Homeric and Hesiodic poetry, featuring
    overall traditions that synthesize the diverse local traditions of each major
    city-state into a unified pan-Hellenic model that sustains most city-states but
    corresponds to none.⁶ Rohde cites in particular the Homeric and Hesiodic concept
    of the Olympian gods, which transcends the individual concepts of these same gods
    as they are worshipped on the level of cult in the localized traditions of the
    states⁷ We have in this example what amounts to internal evidence corroborating
    the eternal summed up in Herodotus'' statement: Homeric and Hesiodic poetry systematized
    the city-states'' diverse ideologies into a set of attributes and functions that
    Hellenes could accept.(The earliest unambiguous attestation of the word panellenes
    in the sense of “pan-Hellenes” or “all Greeks” is in Hesiod Works and Days 528.)


