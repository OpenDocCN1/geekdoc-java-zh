    Through the intermediacy of the fire that cremates the body, vision and breath
    can become one with sun and wind.¹¹⁷ It is therefore a vital fact that the fire
    of cremation is itself called ‘memos of fire’ in *Iliad* XXIII 238 and XXIV 792;
    moreover, in the first passage, the body that is cremated is of Patrolos himself.¹¹⁸
    By way of this intermediacy, we can now see how a root like, which designates
    the blowing of winds at Iliad XX 40, has a non-derivative *psūkhē* that can function
    as the synonym of *memos* at the moment of dying. Or again, we now see how the
    Indo-European verb root *an-* (*₂hneh₁-), as attested in Indic *āniti* ‘blows’,
    leads to non-derivatives like both *anemos* ‘wind’ in Greek and *animus* ‘spirit’
    in Latin. Specifically, the word anemos (plural) in Greek can also designate ‘spirits
    of the ancestors’ (e.g. *Suda* s.v. triatopētes).¹¹⁹ Further, Latin *fumus* and
    Indic *dhumā*, both meaning ‘smoke’, are cognate with Greek *thīmos*; we can better
    understand these semantic specializations when we exhaust the sacrificial fire
    as it transforms the body of life into wind (and we have already witnessed this
    in an earlier passage).¹²⁰


    We are still left, however, with the problem of the *petit ei* (ενεῦ). Semantically,
    it cognates to brahadram ‘good’ in the Vedic breath *brahmadṛ…mānas*.¹²¹ For-as
    we now say, *eu* cognates to the noun *ásu*, which is used in combination with
    *mānas* to designate the conveyors of identity after death. Before we can examine
    this formal connection, however, we shall have to survey the concrete visualizations
    of *asu*—the moment of creation and thereafter.


