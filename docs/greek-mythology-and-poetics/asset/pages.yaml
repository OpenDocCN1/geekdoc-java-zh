    in South Slavic poetry is in fact all-pervasive.6


    The experience of fieldwork, then, has ultimately corrected an initial impression
    induced under the Homeric influence. It should be emphasized, that Homeric poetry
    did not mislead the worker about Homeric poetry; rather, misled him about South
    Slavic poetry. And yet, why should one archaic text, the Homeric corpus, have
    more to say about the myriad songs sung in the living South Slavic tradition?
    The answer is simple: we know a great deal more about the Homeric tradition. Centuries
    of philology had passed in pursuit of every aspect in the evolution of the Iliad
    and Odyssey. Prodigious efforts at discovering the genesis of Greek epic had a
    way of inspiring confidence that we was on the track of its essence as well. No
    matter what we call this quest—the "Homeric Question" or whatever—the assumption
    is there: essence through origins.


    Here the evolution of another field of study, that of linguistics, teaches the
    student of oral poetry an important lesson: searching for origins does not necessarily
    lead to grasping the essence. In the nineteenth century the study of language
    was preoccupied with its genealogy rather than its structure. Historical linguistics
    proved other approaches, as we can see from Pedersen''s eloquent account in The
    Discovery of Language (1931). But historical linguistics is by no means adequate
    as the approach to language. For example, we will not really know the Latin language
    simply by tracing it back to an Indo-European proto-language—even though the technique
    of reconstructing Latin and all the other Indo-European languages to a common
