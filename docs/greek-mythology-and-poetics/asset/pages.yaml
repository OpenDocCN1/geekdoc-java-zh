    etc.

    ''advance''

    ''wheel, turn, face about''

    ''engage in close fight''


    The signum in isolation is arbitrary, but each signal in the left column above
    is part of an internally cohesive system or code. For the Roman soldier, each
    signal corresponds to a message in the right column above, a particular military
    action. Thus when the signum ''standard'' is planted into the ground by the signifer
    ''standard-bearer'', the soldier encamps, when it is taken out again, he decamps;
    and so on. One might say that the Roman soldier recognizes his commands because
    he recognizes the system of signals. He can effectively obey individual commands
    because he grasps the overall code.¹18


    While codes as the Roman system of military signa leave little room for interpretation
    on the part of the destined recipients of their messages, there are other codes
    that prodigious feats of interpretation. For example, here is the reply given
    by the disguised Odysseus to a command given by Eumaios:


    γινώσκω, φρονέω - τά γέ δὴ νοέντον κλεύεις


