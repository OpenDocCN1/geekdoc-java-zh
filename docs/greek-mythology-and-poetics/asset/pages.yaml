    same time. Singing, performing, composing are facets of the same act."¹¹


    This aspect of oral poetry, which Parry learned from his fieldwork in Yugoslavia,
    had vital significance for Parry''s concept of the formula. The Homeric evidence
    taught him that the formula is a traditional group of words regularly recurring
    in a given rhyth framework, and in metrical slots. Now he learns from Slavic evidence
    that oral poetry may require you to compose while you perform, while you compose.
    Such a medium, it follows, puts pressure on the poet/singer to have a ready-made
    phrase available to every position in the verse, which is the overall frame for
    his phraseology. Then too, the singer has to make verse follow rapidly. As Lord
