  md: '# The Hellenization of Indo-European Poetics


    the goal of this poetry, the poet says, is to be heard by all Hellenes everywhere
    (Theognis 22–23, 237–254). It seems as if such a goal can be reached only with
    the evolution of the poetry into a form that is performable at pan-Hellenic events.
    In the case of the elegiac, that would be Ionic. And such evolution entails again,
    the eventual crystallization of oral poetic traditions into the kind of fixed
    poems that are the repertoire of rhapsodes. As we shall observe in the next section,
    Theognis too—like Archilochus and other masters of lyric—may be considered an
    idealized creation of the poetry in which he has an integral function—and which
    he is credited with creating.


    There is an important difference, however, between the poems of a Hesiod, and
    of a Theognis or Archilochus, on the other. The difference is one of degree: these
    three figures, seemingly having in common an intent to address all Hellenes, Hesiod
    has far more authority than all the other poets. A Theognis or Archilochus speaks
    from the perspective of his city, though the localized aspects of the city are
    shaded and the pan-Hellenic aspects are highlighted. In the case of Hesiod, however,
    the perspective is meant to be of all cities. This transcendence is of course
    facilitated by the historical fact that the figure of Hesiod has no native city
    to claim since Askra was destroyed by Thespiae. Because Askra is no more, its
    traditions need not infringe on of other cities. By allowing Hesiod to speak as
    a native of Askra, the pan-Hellenic tradition is in effect making him a native
    of all Greek cities, as we shall see in our survey of the *Works and Days*. The
    *Theogony*, too, expresses this transcendence in two interrelated ways: the form
    in which the Muses are invoked and the nature of the gift that they confer on
    Hesiod.


    We begin with the second. Whereas the mark of Archilochus’ transformation from
    coward to poet in night encounter is a muse, Hesiod’s transformation from shepherd
    to poet in likewise nighttime encounter (Theogony 10) is marked by his gift of
    a skēpton ‘staff, scepter’ (verse 30). There has been much fruitless debate over
    questions as whether this gift implies that Hesiod had not learned how to play
    the lyre, and not enough attention has been paid to the implications of the word
    *skēptron* as it is actually used in archaic poetry. The *skēptron* is a staff
    held by kries (*Iliad* 279, II 86), by Chryses as priest of Apollo (I 15, 28),
    by Teiresias as prophet (*Odyssey* xi), by kerukes ‘heralds’ (*Iliad* II 277),
    or generally by one who stands up to speak in the *agor* ‘assembly’ (*Iliad* III
    218, XXIII 568).53


