    Manu can be described as a specialized multiform of Vivasvat: both figures are
    primordial sacrifices, both are ancestors of the human race, both have special
    affinities with Mātariśvan and the Gāṛapatha. In fact, Manu is in some versions
    the “son” of Sylvain and thus bears the epithet Vaivasvat (*Satatapatha-Brahmana*
    14.4.3.3, etc.). Also “son” of Vivasvat is Yama (*Rig-Veda* 10.14.5, etc.), who
    likewise the epithet Vaivasvat (10.14.1, etc.). As the first person to experience
    death, Manu Vaivasvat is ruler of the living sacrificers (*Satatapatha-Brahmana*
    14.4.3.3–5).


    The etymology of *manu*—is transparent: it is derived from the verb *man*—to have
    mind’. The meaning of Manu as ‘mindful’ is appropriate to the theme of Manu: Sylvain
    Lévy points out, his virtuosity in the ‘delicate art of sacrifice’ confers upon
    him an incontestable authority over matters of ritual.¹⁰⁴ There is no sacrificial
    error for which he does not know a remedy (*Tittiriya-Samhita* 2.2.10.2, etc.).
    To the degree that the ritual was the informing principle of law in the social
    history of the Indic peoples, Manu’s authority was extended: he was also regarded
    as a soft of lawgiver, and it is for this reason that the Indic corpus of juridical
    and moral is named after him.¹⁰⁵


    The semantics of *Manu*-goes beyond the theme of being ‘mindful’ as a sacrifice.
    The broader implications are visible in another derivative from the root *man*,
    the noun *mān*. As we see, *mās*-conveys both the mental power of prayer at sacrifice
    and the cosmic power triggered by such prayer. It also along with the name *āsu*,
    the aspect of man that survives death.¹⁰⁶ *Just Manu-* assures the perpetuity
    of the human race by way of sacrificial fire, so also *mās*-assures the regeneration
    of the individual—again by way of Agni as sacrificial fire.¹⁰⁷


    ¹⁰⁴ Levi 1966 [J381], p. 70. See Christensen 1916 for further documentation of
    the ubiquitous mythological type that Manu was the first sacrificer. In this connection
    we may note that Manu, the name of the primordial Indic man, is cognate with English.
    In Germanic lore, as we hear from Tacitus (*Germania* 2), the first man was Mannus,
    son of Tuisto; the etymology of the latter name reveals the ‘twin’, and we may
    consider the meaning of Manu’s “brother”: it is likewise ‘twin’. For documentation,
