    The explanation of *tarkhū* that I have just offered is corroborated by the evidence
    of comparative linguistics. The Indo-European root *terhg*, which survives as
    Hittite *tarh-* ''conquer, overpower, overcome'', also survives as Indo *tar(i)*-''overcome,
    cross over'', which takes the shape *-tur-* in compounds (e.g. *ap-tūr-* ''crossing
    over the water''). The latter corresponds to the *-tar* of Greek *Nk-tar*, the
    substance that sustains the immortality of the Olympian gods; furthermore, the
    root *nek-tar* is the same as in Latin *nec* ''death'' and Greek *nek-us*/ *nek-rīs*
    ''corpse''.⁶⁷ Thus the word *nek-tar* must once have meant something like ''overcoming
    death''; in fact, there is a Greek sacral poetry, where the verb *tar(i)*-''overcome''
    is actually attested in a context where *mrtysū*-''death'' is its direct object
    (Atharva-Veda 4.35.1-6d).⁶⁸


    This evidence not only provides another argument for the heritage of Indo-European
    poetic language.⁶⁹ More immediately, it gives us a broader perspective on the
    semantics of Greek. To put it another way: the meaning of Greek *-tar* in *nek-tar*,
    where the root is directly inherited from Indo-European, may help us understand
    the meaning of Greek *tarkhua*, where the stem *tarkhu-* is indirectly inherited
