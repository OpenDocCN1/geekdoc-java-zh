  md: 'festivals—and what he recites remains unchanged as he travels from city to
    city. On the other hand, the typical *aoidós* as portrayed in, say, the *Odyssey*
    (ix 3–11) sings to a local community. As the studies of Wilhelm Radloff concerning
    the oral poetry of the Kirghiz people have made clear, the oral poet in a local
    situation will course adjust his composition/performance to the nature of his
    audience. For example, the presence of rich and distinguished members of society
    will prompt the Kirghiz akyn ‘poet’ to introduce echoes reflecting traditions
    that glorify them²⁴ Now, the audiences of Greece in the eighth century must have
    challenged the poet with a veritable kaleidoscope of repertoires; each city would
    had its own poetic traditions, often different from those of other cities. We
    have a reference to the regional variety of poetic repertoires in the *Iliad*
    (XX 24).⁵ Moreover, even the traditions of any city could change radically with
    changes in population or government; the genre of *ktísis* ‘foundational’ poetry
    seems particularly vulnerable.⁶


    The obvious dilemma of the poet is that each of the local traditions in his repertoire
    will have validity only when it is performed in the appropriate location. With
    the surge of intercommunication among the cities from the eighth century onward,
    the horizons for the poet’s travels would continually expand, and thus the regional
    differences between one audience and the next would become increasingly pronounced.
    The greater the regional differences, the greater the gap between what one community
    and another would hold to be true. What was held to be true and false will keep
    shifting as the poet travels from place to place, and he may even resort to using
    alternative traditions as a foil for the one that he is re-creating for his audience.
    This device is still clearly reflected in *Homeric Hymn 1*, where the poet declares
    in his prayer to Dionysus that the god was not born in Drakon or in Ikaria or
    Naxos or even on the banks of the Alpheios or in Thebes (verses 1–5), and those
    who claim any of these proveniences are *pseudóménoi* ‘lying’ (6); he goes to
    say that the god was really born at the mountain Nysa (6–9; compare Hymn 26.5).
    The localization of Nysa is a separate problem, and the point now is simply that
    various local traditions are here being discounted as false in order to legitimize
    one tradition that is acceptable to the poet’s audience.


