    By dying, Penelope will have the experience of having her thýmós ''spirit'' plunge
    into the Okeanos (Odyssey xx 65), but later there is a further detail, that she
    will gone underneath the earth (xx 80–81). These themes of (1) falling into Okeanos
    and (2) going underneath the earth also apply to the movements of the sun itself
    (e.g. Iliad III 485, Odyssey xx 190–193). For humans, Okeanos has a function that
    can be described as follows: when you die, a gust wind carries your spirit to
    the extreme west, where it drops you into the Okeanos; when you traverse the Okeanos,
    you reach the underworld, which is underneath the earth. For the sun itself, an
    analogous function: when the sun reaches the extreme west at sunset, it likewise
    drops into the Okeanos; before the sunrise in the extreme east, it stays hidden
    underneath the earth. When the sun rises, it emerges from the Okeanos in the east
    (Iliad VII 421–423; cf. Odyssey xiii 433). Thus the movements of the sun into
    and from the Okeanos serve as a cosmic model for death and rebirth. From the human
    standpoint, sun dies in the west in order to be reborn in the east. Since Okeanos
    is parallel to Eridanos, the sunset of a dead Phaethon falling upon Eridanos implies
    an inverse sunrise of a reborn Phaethon emerging from Eridanos.


    In respect, a detail about Phaethon''s mother Eōs ‘the Dawn’ becomes especially
    significant. Homeric Eōs has a fixed epithet *ērgenēa* ‘early-generated’ (or ‘early-generating’)
