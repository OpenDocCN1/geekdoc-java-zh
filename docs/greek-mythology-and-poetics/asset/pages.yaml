    To illustrate the current consensus against the notion of a tribal heritage in
    the Greek polis, I cite the detailed book of Denis Roussel (1976). He deplores
    the equation, made by by Classicists in general, between the notion of ''tribe''
    and the Greek word *phoulé*, which is given in the dictionary of Liddell and Scott
    as ''race'', ''tribe''. As Roussel recognizes, the *phoulé* is in fact a subdivision
    of society in the polis, as we see from the traditional four-*phoulai* systems
    of Ionian cities and the traditional threfour-*phoulai* systems of Dorian cities.
    For Aristotle, it is held even to imagine the existence of a polis without subdivisions
    into phoulai, not to mention sub-subdivisions of it ph(v)triai (Politics 1264a8).
    The fact that the *phoulé* was a distinctive feature of the polis but not of the
    *ethnos* had Max Weber to postulate that the phoulé was the invention, as it were,
