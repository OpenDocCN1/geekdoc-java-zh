  md: '# 272 The Hellenization of Indo-European Social Ideology


    that conventionally centers on the ritual core of the sacrifice of a victim and
    the distribution of its meat.¹12


    Thus the elegance of elegiac poetry, supplemented by that epic poetry, implies
    a coherent picture of dikē ‘justice’ in terms of an orderly apportioning of meat
    at a feast that centers on a correctly executed sacrifice; conversely, húbris
    ‘outrage’ is represented as the disruption and perversion of this process.¹13
    Given that the poems of Tyrtaeus, one of which is even called Eonomía (as we have
    seen), are representative of the function elegiac poetry as an expression of the
    polis, the performance of this poet is ideologically suited to the ritual reported
    by Philochorus, namely, the awarding of a cut of meat to the who gives the best
    performance.


