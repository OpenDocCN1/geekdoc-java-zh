  md: '# The Hellenization of Indo-European Poets


    goal seems to be achieved by assigning the remotest imaginable traditional place
    of birth to the god (Nyse is pictured as “near the streams of Aigyptos”, verse
    9). In the case of the Theogony we see this sort of process in a global dimension:
    the many theologies of the various citystates are to be superseded by one global
    Olympian scheme.


    As we noted already, the Olympus of Hesiodic and Homeric poetry is a pan-Hellenic
    structure that elevates the gods beyond their localized attributes. It is a historical
    fact about Greece in the archaic period that whatever can be classified as religious
    practice or ideology was confined to the local level, and a survey of the attested
    evidence, gleaned from sources like Pausaniias or epigraphic inscriptions, reveals
    clearly that each city had a very distinct pattern of cults. A god as worshipped
    in one city could be radically different from a god bearing the same name as he
    was worshipped in another city.


    Under these circumstances, the evolution of most major gods from major cities
    into the integrated family at Olympus to a synthesis is not just artistic but
    also political, comparable with the evolution of the pan-Hellenic genres known
    as the Olympics, another crucial phenomenon originating in the eighth century.
    As in any political process, the evolution of the pan-Hellenic poems would afford
    some victories and many concessions on the part of each region: some one salient
    feature of a god may become accepted by all audiences, while countless features
    happen to contradict the traditions of other cities will remain unspoken. For
    example, Cythera and Cyprus may well be Aphrodite (the narrative specifies that
    she did so in that order, see Theogony 192–193), but very little about their local
    role will ever come to the surface of Hesiodic and Homeric poetry.


    The oral poet represented by the poetry itself is one who can sing both epics
    and theologies, as we learn in this description of the poetic repertory of Phemios.


    > ἐρὐ ἄνδρων τε θεῶν, τά τέ κλείουσιν ἀοιδοί


    Odyssey 338


    the deeds of men and gods, upon which the singers confer glory [kleos]


    So also in this description of a generic poet:


    αὐτὰρ ἀοιδδὸς


    Μουσάν θεράάων κλεῖα προτέρων ἀνθρώπων'
