    # Appendix. Conflicting Semiotics of Cremation, Inhumation, Exposition: An Iranian
    Case in Point


    In Avestan, the root *ās-(from *h₂es-) is attested as the compound *pah*(ah-ya)
    in the compounding of *sairria-* *ahii- = sairii.hiia. The word *sairria-* designates
    the dried manure used as a proper funerary resting place for the corpse, Vendidad
    8:8; the word *sairii* is attested only once, Vendidad 8:83. It has been traditionally
    interpreted as ‘apparatus for drying manure’,86 the semantics of root correspond
    to what we find in Latin *arier* ‘be dry’, Tocharian *as-’dry’, and so on.87 I
    propose an alternative explanation of *sairii.hiia*, interpreting its etiology
    as ‘apparatus for burning manure’. As we see this, this interpretation explains
    some crucial details of conflicting Iranian ideologies concerning the funerary
    practices of cremation, inhumation, and exposition.


