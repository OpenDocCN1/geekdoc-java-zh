    but also cultural remoteness. In all three instances elaboration on the theme
    is seriously avoided as if were inappropriate, perhaps even too primitive. The
    theme is indeed “primitive,” in the sense that we can find it commonly attested
    in the widest spectrum of societies. In the mythmaking traditions of many peoples
