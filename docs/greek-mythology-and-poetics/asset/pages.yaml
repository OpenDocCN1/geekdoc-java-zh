    situated on Cape Leukas and an ancestral cult practice connected with it. Every
    he reports, some criminal was cast down from the white rock into the sea for the
    sake of averting evil, ἀποτροπψις χάριν (ibid.). Wings and birds would be fastened
    to him, and men in fishing boats would be stationed before the rock in order to
    retrieve the victim after his plunge (ibid.).


