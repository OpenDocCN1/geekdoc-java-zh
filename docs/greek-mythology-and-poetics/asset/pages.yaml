    accepting this probability, primarily because the historicity of Hesiod is thereby
    endangered, “and no one assumes Hesiod himself to be an assumed character.”88


    Throughout this presentation it has been generally argued that the persona of
    the poet in any archaic Greek poem is a function of the traditions inherited by
    poet; accordingly, the assumption of Hesiod’s historicity, as in the statement
