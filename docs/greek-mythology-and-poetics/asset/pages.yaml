  md: '# Unattainable Wishes 295


    The translations I offer here, based roughly on the rendition of Homer by Richard
    Latimore,¹ I have been taken from a chapter I have written on the death of Hektor,
    where I deduce these two passages in arguing that the hero''s wish to be a god
    draws him into a force field of antagonism with the gods, notably Athena.2 In
    the view of F. M. Combelack, however, I and many others have misunderstood these
    passages.³ He claims that "though Hector says in these passages is grammatically
    a wish he does not express any desire to be immortal or to the child of Zeus."4


    In making this claim, Combellack attempts to define an idiom that is at work here,
    citing a formulation found in Walter Leaf''s comments on these passages: "a form
    of wish, where a thing is vividly depicted as certain opposing to an imaginary
    event which is obviously impossible."5 What Hektor is really saying, Combellack
    insists, is "I wish I were of immortality (or of being the son of Zeus) as I am
    that this day brings evil to the Greeks."6 The author continues⁷


    If I say, "wish I were certain of being elected President as my taxes will go
    up this year," my sentence is grammatically a wish, but no one would imagine an
    absurdity that I am expressing a desire to become President. I am using an idiom
    to emphasize my certainty that my taxes will go up. And Hektor is merely emphasizing
    his certainty that evil is in store for the Greeks.


    There is a serious flaw, however, in Combellack''s reasoning. He is assuming that
    the perspective of Hektor is the same as the perspective of the reader of Homer.
    What is an absurdity for the reader—or, to put it more rigorously, for the intended
    audience of Homeric poetry—is assumed to be an absurdity for the character who
    is speaking. This is to overlook a central feature in the composition of Homeric
    speeches, where a given character''s perception of reality is frequently at odds
    with the reality that emerges from the overall narrative—that is, with the perception
    of reality by the intended audience of Homeric poetry. We shall explore some examples
    below, but it will suffice for the moment to cite a book on Homeric speeches that
    is well worth reading in this regard.8


