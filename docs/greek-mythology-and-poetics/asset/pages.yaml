  md: '# Homer and Comparative Mythology 9


    countless variations in tradition without any deviation from tradition itself.
    Parry and Lord have successfully applied to the Homeric Iliad and Odyssey the
    criteria that they developed from their experience in field-work, and their demonstration
    that these marvels of Western literature are composed in the patterns of oral
    poetry may further justify applying the criteria that Dumésil has developed from
    his experience in the systematic comparison of surviving epic texts.As we can
    ascertain independently with Parry and Lord, Homer is a master of mythe et épée.


    There are serious problems, however, in connecting the epic traditions of ancient
    Greece with those of other societies belonging to the Indo-European language family.
    Dumésil himself gives the clearest account of these problems, which can be summarized
    as follows:


    +   (1) generally, it is difficult to connect the narrative of the Homeric poems
    with the basic patterns of Indo-European society reconstructed from comparable
    narratives in languages to Greek;(2) specifically, the themes associated with
    the major Homeric heroes seem not to match the themes associated with gods—at
    least, they do not match as they do, for example, in the clearly Indo-European
    epic traditions of the Indic Mahābhārata.


    A solution to the second millennium may be found in archaeology—not in the evidence
    of the second millennium B.C., the represented era of the Homeric heroes, but
    in the evidence of the eighth century B.C., the era of the incipient Homeric audience.
    Whereas the archaeology of the second millennium has encouraged students of Hellas
    to concentrate on the historical realities found in Greek epic, the archaeology
    of the eighth century may lead them to perceive the mythical framework that integrates
    these realities.


    A 1971 book by Anthony Snodrass, The Dark Age of Greece, has made it plain that
    the eighth century B.C., the era in which the Iliad and Odyssey were reaching
    their ultimate form, is as important for our understanding of Homeric poetry as
    the late second millennium B.C., the era that provides the overt matter for both
    of these epics.¹11 Granted, Homeric poetry draws on details that archaeologists
    can assign to the late second millennium.¹12 But the point is that it reflects
