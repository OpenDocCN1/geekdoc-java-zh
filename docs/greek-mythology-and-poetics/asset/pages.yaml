  md: '# 4 Introduction


    To grasp the essence of Greek religion, I suggest, is to understand the relationship
    between myth and ritual in the historical context of ancient Greece. Moreover,
    it is at times impossible to achieve an understanding of a given myth without
    taking into account a corresponding ritual, or the other way around: in the myths
    and rituals of Adonis, for example, we can see clearly that the fact of sacrifice
    in ritual corresponds to the fact of catastrophe in myth, that ''play acting''
    the catastrophe of Adonis is supposed to avert catastrophe for the sacrificers.


    The relationship of myth to ritual can have a direct bearing on poetics. In the
    myth of the Divine Twins, the rituals connected with these figures are a key to
    understanding not only the historical setting of the dual kingship at Sparta but
    also the poetics of Alcman PMG 7, concerning the alternating komma of the Twins,
    their death-sleep. In the case of Adonis myth, for another example, the connections
    of this figure with rituals of mourning are pertinent to a general anthropological
    assessment of mourning as demonstrative self-humiliation and selfaggression. Further,
    these connections are pertinent to the poetics of Sappho, the explicit theme of
    mourning may be connected with the implicit theme of Sappho''s self-identification
    with Aphrodite. In this context, we may note Burkert''s observation that the standard
    mythical sequence, as formulated by Vladimir Propp, of Sappho''s poetry as the
    disquieting and Adonic sequence of love''s abruptly ending in failure.


    Some of the essays collected in this book took some years ago, the one on Sappho
    as early as 1973 (recast as Chapter 9). Another of the essays appeared recently,
    in 1987 (recast as Chapter 12). For this reason and for the purposes of the elements
    in general, there had to be a great deal of reorganization and rewriting. New
    references to additional secondary sources, however, have been kept to a minimum.
    Such new references are there to concentrate on those works that had a role in
    reshaping specific lines of argumentation. There are undoubtedly many other works
    that should have played a role, but some of these have been saved for future reference
    in altogether new projects


    > 11 A crucial work in this regard: Burkert 1970.

