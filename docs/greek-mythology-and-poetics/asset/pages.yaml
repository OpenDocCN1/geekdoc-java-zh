  md: '# Séma et Noésis 213


    useful to reconsider a sēma* ''sign'' given by Hesiod, the sound of the migrating
    crane, which signals the season of autumn ploughing (Works and Days 450–451).
    As it turns out, this sēma is itself twofold, the time when one must plough in
    the autumn is the same time when one must not sail the seas (Works and Days 618–623).
    Besides the contrast of the negative “do not sail” (622) with the positive “do
    plough” (623), the latter teaching is reinforced with the expression memnéménos
    ‘being mindful’ (622), picking up from memnēmnos arōto* ‘being mindful of ploughing’
    at 616, which is the positive equivalent of the negative oudé me/se/hētei ‘and
    it does not escape my/his mind’.⁷ One who is memnēmnos ‘mindful’, then, by implication
    one noos reads the sēma of the crane and perceives that it is time to plough and
    not to sail.⁸ Similarly with the expression oudé lēsei (xi 126) is by implication
    changeling the noos of Odysseus with a twofold message: what is an o for seafarers
    is a winning shovel for inlanders (ci 121–137, xiii 265–284).


    The message of this sēma, however, is twofold for the seafarers for the inlanders,
    since the former can surely distinguish oars from winning shovels while the latter
    are presented as knowing only about winning shovels. Rather, the message is twofold
