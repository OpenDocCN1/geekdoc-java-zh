    Zeus himself, who is the subject of the verb hērpasen ‘snatched’ designating the
    abduction of Ganymedes (Hymn to Aphrodite 202–211). As compensation for the abduction
    of Ganymedes, Zeus gives to the boy’s father a team of wondrous horses (described
    as having feet of wind ἀελλποδεσαν 217). In this instance, both themes, of taking
    and giving in return, center on the element of wind.


    After ascertained how the likes of Phaethon were abducted, we may ask where they
    were taken. The most explicit Homeric imagery about this aspect of thielliai/hárpuai,
    the snatching gusts of wind, occurs in the passage already quoted for a gust of
    wind to snatch her and drop her into the Okeanos (63–65). The immediate agent
