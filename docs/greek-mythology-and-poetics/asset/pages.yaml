    According to Zoroastrian precepts, exposing a corpse to be eaten by dogs and birds
    is the proper funerary procedure, rather than cremation or inhumation (Vendidad
    8 pass). I draw attention here to the contrast with the Indian custom of cremation
    (e.g. Rig-Veda 10.16.),⁸⁸ and with the Greek customs of cremation and inhumation,
    as discussed earlier.¹⁸⁹ More specifically, I also draw attention to the contrast,
    established by the sacredness of cremating a corpse, which I have argued is considered
    the key to successful afterlife,⁹⁰ and the abomin of exposing a corpse to be eaten
    by dogs and birds, a custom cited at the very beginning of the *Iliad* ( 1–5)
    and pervading the rest of the epic as the ultimate image of inhumanity, a symbolic
