    The interaction between Cheiron and Achilles in the *Precepts* of Cheiron is so
    strikingly similar to the one between Hesiod and Persians and the one between
    Theognis and Kyrnos that F. G. Welcker led to propose, in the preface to his 1826
    edition of Theognis, that Persians and Kyrnos as generic figures dramatized familiarity
    with Hesiod and Theognis makes it possible for these poets to offer well-intended
    advice to their audiences, which really consist of strangers.86 Such Near eastern
    parallels to Ahiqar and Nadan and the Proverbs of Solomon to the probability that
