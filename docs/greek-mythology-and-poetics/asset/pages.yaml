  md: '# Thunder and the

    Birth of Humankind


    In the mythmaking traditions of a wide variety of societies, there is a convergent
    pattern of thought concerning the origin of fire: that a stroke of thunder can
    deposit fire into trees or rocks and that this fire of thunder is extracted whenever
    friction is applied to these materials.¹ Oftentimes the god of the thunderbolt
    is pictured as being incarnated within the material.² There are numerous occurrences
    of a related line of thought, equating making fire with the friction of making
    love. Besides the ample documentation of this equation in the lore of diverse
    societies, we may consider the formulation of the philosopher Gaston Bachelard,
    who views the metaphorical syntax of sexual arousal as the inspiration, as it
    were, for, Man’s discovery of how to make fire by friction.⁴ Theories aside, can
    it be argued that the infusion of fire into wood and thunder is a sexual and anthropogenic
    theme in the logic of myth. What follows is an attempt to present such an argument,
    with special reference to the anthropogenic traditions of the Greeks. In the course
    of examining the pertinent myths, we shall see that the stroke of the thunderbolt
    may be viewed as not only destructive but also proactive. Furthermore, the concept
    of procreation can presuppose that creation itself⁵


