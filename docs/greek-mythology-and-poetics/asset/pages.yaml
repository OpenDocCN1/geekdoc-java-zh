    Indeed, Varro (*Rerum diuinarumum*) reports that amidst the ærae that are consecrated,
    *foci* too are regularly consecrated, as in the Capitolium Jupiter, Juno, Minerva;
    likewise in most cities and towns; and that this is regularly done publicly and
    privately; ... and that it is not allowed to perform public or private sacrifices
    without a *focus*. Which is what the Poet [Virgil] shows here.


    Varro''s report on the use of the *focus* in the Capitolium can be directly linked
    with the mention of the derivative word *focus* in the *Arval Brethren*, year
    A.D. 87; the setting is in Capitolio (a. 87 I 2), and the *promagister* of the
    brethren is presiding (I 2 and following); after the preliminary sacrificial proceedings
    (I 2–7), “on the same day and in the same place” (*exem idem in area I 18*), the
    same *promagister* does the following:


