    But this is to misunderstand the accretive nature of myths about poets and their
    poetry: even if we concede that the detail about the Athenian provenance of Tyrtaeus
    reflects an anachronistic elaboration, it does not follow that the other details
    of the Tyrtaeus story as reported by Athenian sources are alike anachronistic.$^{17}$
    Moreover, there is reason to doubt that the story of an Athenian Tyrtaeus is necessarily
    an Athenian tradition. There is evidence to suggest that about the foreign provenances
    of Sparta''s poets are not foreign but native Spartan traditions, suited to the
    overall ideology of the polis.$^{18}$ Besides, it is a common tradition that the
    culture of a given polis is likely a foreign or at least one who introduces his
    cultural boon from a foreign source.$^{19}$


