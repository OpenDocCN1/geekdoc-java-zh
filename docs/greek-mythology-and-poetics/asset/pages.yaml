    speaker can refer with but one word, such as οὕῶς ‘so’ = just as surely as what
    has happened in this context’. Thus when the suitor Antinoos the disguised Odysseus,
    Penelope responds to this outrage by saying: αἰθ’ὕτος αὐτόν σε βάάλοι κλυτοτόξος
    Ἀπολων ‘If only Apollo, famed for his bow, would strike you just as surely as
    you struck Odysseus!’ (Odyssey xv 494). Penelope’s prayer is then'
