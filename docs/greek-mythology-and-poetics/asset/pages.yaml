  md: '# 8 The Hellenization of Indo-European Poetics


    diverse groups as the ancient Greek and Indic peoples have a common Indo-European
    heritage not only on the level of language but also on the level of society. To
    appreciate the breadth and the depth of this Indo-European heritage in Greek institutions,
    one has only to read through the prodigious collection of detailed evidence assembled
    by Emile Benveniste in Le vocabulaire des institutions indo-européennes. For now,
    however, we shall concentrate on Dumzil''s argument that one Indo-European institution
    is the tradition of epic as reflected, for example, in the Indic Māhabhārata.
    The comparative approach, as we shall see, gives a vision of epic that is significantly
    different from the picture emerging from a "separatist" approach that restricts
    the field of vision to Homeric standards.


    What comparative theology teaches us that epic is not so much of historical events
    as myth. According to this scheme, epic allows myth to take precedence over reality
    as we know it. Even where epic utilizes the raw material of real events, the argument
    goes, it will reshape these events to accommodate the requirements of myth.


    This insight from comparative mythology concerning myth is a far cry from our
    contemporary usage of the word "myth," which conveys the opposite of reality.
    Myth, in societies where it exists as a living tradition, must not be confused
    with fiction, which is a matter of individual and personal creativity. Rather,
    myth represents a collective expression of society, an expression that itself
    seems to be true and valid. From the standpoint of the given society that it articulates,
    myth is the primary reality. For the purposes of the present argument, then, "myth"
    can be defined as a "a traditional narrative that is used as a designation of
    reality. Myth is applied narrative. Myth describes a meaningful and important
    reality that applies to the aggregate, going beyond the individual.


    The links between myth and epic are explored from another angle in the researches
    of Milton Parry and Albert Lord on the nature of oral epic poetry. From their
    fieldwork in the living Slavic oral traditions, we can directly see how the composition
    and performance of epic are aspects of the same process, how myth is re-created
    in each new performance, and how there can be


