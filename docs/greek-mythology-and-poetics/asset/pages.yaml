    the water-born Agni is also called apām napāt ‘progeny of the waters’ (Rig-Veda
    3.1.12-13, 3.9.1, etc.). Elsewhere, Apām Napāt seems to exist as a separate entity
    (10.3–4, etc.); he is celebrated in one whole hymn (2.35), but even here he is
    identified with Agni in the last stanza. Just as Savitr as specialized sky-god
    has features derivable from Daus ‘Sky’⁶⁵ so Apām Napāt: whereas Savitr is called
    prajpati, the creator of the universe (4.53.2),⁶⁶ Apām Napāt is described as the
    one who ‘created all things’ (viśvāni ... bhuvāna 2.35.2)⁶⁷


