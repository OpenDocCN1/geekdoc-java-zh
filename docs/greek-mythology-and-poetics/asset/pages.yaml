  md: '# CHAPTER 3


    # Hesiod and the Poetics

    of Pan-Hellenism


    # The Hesiodic Question


    From the vantage point of the ancient Greeks themselves, no accounting of Homer
    is possible without an accounting of Hesiod as well. In the fifth century B.C.,
    Herodotus was moved to observe (2.53.2) that the Greeks owed the systematization
    of their gods—we may say, of their universe—to two poets, Homer and Hesiod. The
    current fashion is to argue, that both lived sometime in the latter half of the
    eighth century, roughly three hundred years before Herodotus composed his *Histories*—although
    there is considerable controversy about which of the two was earlier. For Herodotus,
    as for all Greeks of the Classical period, the importance of Homer and Hesiod
    was based not on any historical facts about these poets and their times. Whatever
    Homer and Hesiod may have meant, the only surviving historical fact about them
    centers on what their poems did indeed mean to the succeeding centuries extending
    into the historical period. From Herodotus and others, we know that the poems
    of Homer and Hesiod were the primary artistic means of encoding a value system
    common to all Greeks.¹


    In this connection it is worthwhile to correct a common misconception: Homer is
    not simply an exponent of *narrative* any more than Hesiod is an exponent of purely
    *didactic poetry*.² The explicitly narrative


