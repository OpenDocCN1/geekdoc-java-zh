  md: '# 42 The Hellenization of Indo-European Poetics


    such events. By way of countless performances for over two centuries, each recomposition
    at each successive performance could become less and less variable. Such gradual
    crystallization into what became set poems would have been a direct response to
    the exigencies of a pan-Hellenic audience.²


    Recalling the testimony of Herodotus and others to the effect that Homer and Hesiod
    provide a systematization of values common to all Greeks, we may go so far as
    to say that “Homer” and—Hesiod—are the cumulative embodiment of this systematization—the
    ultimate poetic response to pan-Hellenic audiences from the eighth century onward.
    An inevitable consequence of such evolution from compositional trends to set poems
    is that the oral poem, who performs and performs while he composes, evolves with
    the passage of time into a mere performer. We must not be too quick to dismiss
    the importance of the rhapsode, however: he must have been a master of mnemonic
    techniques inherited from oral poets. In such minute details as accentual patterns,
    as we have seen, we preserved the heritage of a genuine oral poet. The etymology
    of rhapsōdos ‘stitcher of songs’ reveals a traditional concept of the oral poet
    as expressed by the poet himself in cognate Indo-European poetic traditions.²
    There is, then, no demolition implicit in the formal distinction between rhapsodos
    and aoidós ‘singer’—which is the word used by the Homeric and Hesiodic poems to
    designate the genuinely oral poet.² It is simplistic and misleading to contrast,
    as many have done, the “creative” aoidos with the “reduplicating” rhapsodos. We
    must keep in mind that even the traditional oral poet does not really “create”
    in the modern sense of authorship; rather, he re-creates for his listeners the
    inherited values that serve as foundations for their society. Even the narrative
    of epic, as we have noted, is a vehicle for re-creating traditional values, with
    a set program that will not deviate in the direction of personal invention, away
    from the traditional plots known and expected by the audience.² If, then, the
    aonde is an upholder of such poetic ways, he is not so removed from the rhapsodos
    as from the modern concept of “poet.”


    The more significant difference between aonde and rhapsodos lies in the nature
    of their respective audiences. The rhapsodos, and aonde, as we have seen, recites
