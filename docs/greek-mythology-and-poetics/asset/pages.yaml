  md: '# Patroklos, Concepts of Afterlife,

    and the Indic Triple Fire


    The rituals occasioned by the Funeral of Patroklos, as narrated in

    Iliad XIII, have been compared with the royal funerary rituals of the

    Hittites. The parallels in details and ideology suggest a common

    Indo-European heritage, with view of additional comparative evidence

    available from the Indic traditions. If indeed the Funeral of Patroklos

    reflects an ideology so early as be of Indo-European, then a

    basic criterion for the dating of narrative traditions in the Homeric

    poems has to be revised. Archaeologists tend to interpret the

    of Patroklos in particular and of Homeric heroes in general as inspired

    by practices that went into effect only in the first millennium B.C., when

    cremation and inhumation are found to exist side by side; in this respect,

    then, Homeric poetry is supposed to reflect a near-contemporary state of

    Mycenaean era of the second millennium B.C., a period when cremation

    is sporadic and inhumation is the norm. The comparative evidence, on

    other hand, now suggests that the procedures and ideologies of cre-

    mation attested in Homeric poetry are in fact so archaic as to precede

    t second millennium B.C., thus reflecting—albeit distantly— customs

    go back to a time even before the entry into Greece, in the beginning

    of the second millennium, the Indo-European language that


