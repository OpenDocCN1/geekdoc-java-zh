  md: '# Formula and Meter 35


    I close with a general statement that again links the study of oral poetry with
    linguistics. In the intellectual history of linguistics as an academic discipline,
    the diachronic approach preceded the synchronic. For the actual methodology of
    linguistics, it is now recognized that the synchronic analysis of language is
    not sufficient and must be supplemented with the diachronic. however, the synchronic
    approach is not the diachronic approach. I am proposing the same program for solving
    the problem of formula and meter in the study of oral poetry. The synchronic approach,
    although it is the essential first step, is not sufficient. As Albert Lord says
    about traditional poetry,78


    It cannot be treated as a flat surface. All the elements in traditional poetry
    have depth, and our task is to plumb their sometimes hidden recesses; for there
    will be willing to use the new tools for investigation of multiforms of themes
    and patterns, and we must be willing to learn from the experiences of other oral
    traditional poetries. Otherwise “oral” is only an empty label and “traditional”
    is devoid of sense. Together they form merely a façade behind which scholarship
    can continue to apply the poetics of written literature.


    78Lord 1968.46.'
