  md: '# The Hellenization of Indo-European Myth and Ritual


    Two key words in this presentation will be Baltic (Lithuanian) *perūnas* and Slavic
    *perunǐ*, meaning ''thunderbolt''.⁶ In examining the formal and semantic connections
    between these two words, we shall discover a pervasive association of the concept
    of ''thunderbolt'' with traditional lore two particular kinds of material that
    attract the thunderbolt, that is, wood and stone. We shall further discover that
    the very forms of these nouns, *perūnas* and *perunǐ*, are related to the forms
    of other nouns that designate wood, especially oak wood, and stone—not to mention
    still nouns designating elevated places that attract the thunderbolt, such as
    mountains, boulders, or wooded hilltops. Even further, we shall see the emergence
    of a neat pattern of parallelism linking myths about thunderbolts and oaks with
    myths about thunderbolts and rocks. Finally, we shall consider another dimension
    of this parallelism, that is, in the myths about the creation of humankind. Such
    myths, as we shall see, are reflected by a Greek proverb that refers to ancient
    myths of anthropogeny with a distancing attitude of indifference, as if humans
    had originated from either oaks or rocks. When Penelope challenges the Odysseus
    to reveal his hidden identity by revealing his lineage (xix 162), she adds the
    following words:


    > οὐ γάρ δρὺς ἐσοσι παλαφαῦ οὐδ ἀπο πέτρη


    > Odyssey xix 163


    For surely you are not from an oak, in the old stories, or from a rock.


    To begin at the very beginnings is to begin with the oak and the rock, at least
    in the logic of the proverb, and it is for this reason, as we shall see, the persona
    of Hesiod, reproaching himself for lingering long at the beginning of beginnings
    in the *Theogony*, finally declares, with impatience:


    > ἀλλὰ τί μοί τατα περὶ δρῦν ἢ πέτρήν;


    > Hesiod *Theogony* 35


    But why do I have these things about the oak or about the rock?


    In the interest of making our own beginning, let us without further delay proceed
    to the Baltic and the Slavic evidence.


    ⁶ For the difficult task of establishing the etymological links between these
    words, I cite the pathfinding work of Ivanov 1958 and Toporov 1970, following
    Jacobson 1950, 1955; cf. Watkins 1966.33–34, 1970.350, 1974.107. Book-length treatment
    in Ivanov and Toporov 1974.'
