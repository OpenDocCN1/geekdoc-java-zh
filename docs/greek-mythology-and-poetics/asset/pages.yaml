    The prime significance of this contextual work is that it establishes how Phaethon,
    Kephalos, Tithonos, Kleiton, and Ganymedes were abducted in the poetic imagination:
    they were snatched by a gust of wind. The imagery is most explicit in the story
    of Ganymedes. The immediate agent of the abduction is a gust of wind, and Ganymedes’
    father does not know how the álla ‘gust of wind’ has ‘snatched up’ his son, anêparse
