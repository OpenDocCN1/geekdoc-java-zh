    the city (e.g. Ion institutes the four old *phoulai* of Athens: Herodotus 5.6.2,
    *Euripides* 1579–1588; Aletes institutes the eight *phoulai* of Corinth: Suda
    \pi 225 Adler s.v. *panta okto*). Accordingly, the reasoning says, tribes were
    never praised. For Roussel, if indeed this institution was a functional subdivision
    of the polis, there is no reason to think that this institution was reflex of
    tribal society.^7


