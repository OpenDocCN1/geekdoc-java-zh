    This theme brings back to our starting point, that is, the Indo-European pattern
    of thought that links the rising of the sun at dawn parallel to the kindling of
    the sacrificial fire. This parallelism, as we have seen, is explicit in the ritual
    language of the Vedas and is implicit in the possible affinity between Indo-European
    roots words for ''dawn'', notably Greek *ēōs* and in words for ''earth'', notably
