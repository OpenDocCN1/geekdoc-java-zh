    The kind of reasoning that leads to the discounting of one variant as an invention
    on another variant is a symptom of a more general oversight that afflicts the
    study of Homer: in our struggle to come to terms with the concept of “oral poetry,”
    we tend to forget something fundamental, that oral poetry is traditional poetry.
    An oral poet does not make up stories; however, he retells stories that his audience
    has heard before and expects to hear again. As Albert Lloyd observes “The picture
    that emerges is not really one of conflict between preserver of tradition and
    creative artist; it is rather one of the preservation of tradition by the constant
    re-creation of it. The ideal is a true story well and retold.”⁴²


    With these thoughts in mind, we are ready to consider the Greek word of Anatolian
    origin that occurs in the Iliadic poetry telling of the death and funeral of Sarpedon,
