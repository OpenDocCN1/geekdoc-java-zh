    In Slavic, *perun* designates both ''thunderbolt'' and ''thunder-god''.⁷ By ''thunder''
    I mean both thunder and lightning, in the spirit of the older expression ''thunderstruck''
    as opposed to the newer ''struck by lightning''. In the case of the Slavic form
    *perun*, the meaning ''thunderbolt'' is basic in the attested Slavic languages
    (Russian perun, Czech Polish pior, and so on), while the meaning ''thunder-god''
    is residual. The second meaning is least obscure in the Russian evidence, where
    the word *perun* ''thunderbolt'' survives also as one of the names constituting
    the native pantheon. The Old Russian *Chronicles*⁸ told of wooden idols in the
    image of the god Perun, set up on hills overlooking Kiev and Novgorod. They also
    tell how people of Kiev as the Christian-Prince Vladimir had the idol of Perun
    cast down into the Dnepr River. At Novgorod, the god was topped, and as his ideal
    floating downstream in the Volkhov River, Perun took revenge: believe that he
    hurled his wife at a bridge, hurting and frightening the others.⁹ The Perun figure
    has survived also in the folklore of Belarusia.¹⁰ He is Pian, who lives on mountaintops
    and smites the Serpent.¹¹ He made the first fire: accidentally, when he struck
    a tree in which the demon was hiding.¹¹


