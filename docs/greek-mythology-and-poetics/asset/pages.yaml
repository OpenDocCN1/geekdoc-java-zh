  md: '# Introduction


    Hellenization. Hence the titles of the three parts into which the book is divided:


    +   I: The Hellenization of Indo-European Poetics

    II: The Hellenization of Indo-European Myth and Ritual

    III: The Hellenization of Indo-European Social Ideology


    The use of such terms as “poetics,” “myth,” “ritual,” and “social ideology” will
    be brought into sharper focus as the discussion proceeds, another question of
    meaning must be addressed at the very start. The term “Indo-European” will never
    be used here as any sort of racial or ethnic classification: to say that something
    is Indo-European is merely to reconstruct an aspect of that by way of comparing
    cognate languages, inasmuch as language is a reflection of society and its institutions.


    In the case of ancient Greek—and the same goes for the Romans and the Hittites
    and so—is misleading to speak of it as “Indo-European” because comparative linguistics
    has established that the Greek language is predominantly Indo-European in nature.
    Still, the story of Hellenization can be at least retold in the history of an
    Indo-European language that has settled into a Mediterranean setting.


    In the historical context of the ancient Greeks, the Indo-European heritage of
    their language can be expected to elucidate some, though hardly all, the inherited
    institutions of their society. Other institutions will have been inherited from
    layers of language speakers that preceded the Indo-European layer. Still others
    will have been borrowed at different times from different societies. One thing
    is: all Greek social institutions, whatever their provenance, will continue to
    interact and change in the course of history. That process of interaction and
    change I am describing as Hellenization. In this book, the distinctive Hellenism
    or “Greeksness” of Hellenization is empirical given.


    It follows that there can be no such thing as a controlling EuroEuropean model
    for the Greek heritage of mythology and poetics. In particular, the influence
    of the Near East is pervasive in the ongoing process of Hellenization. In the
    poetics of Sappho, as we shall see in Chapter 9, the Indo-European myths about
    the Morning Star and Evening Star have merged with the Near Eastern myths about
    the Planet


    > ³ Here I look to the démarche de Benveniste 1969.


    > ⁴ I stress the distinctive or “otherness” of Hellenism, not its perceived affinities
    with “Western Civilization.” Such perceptions lead to the impulse of “Orientalism,”
    as dissected by Said 1978.'
