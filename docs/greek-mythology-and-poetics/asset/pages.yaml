    dynamics, Orion’s movements are accordingly astral, not solar, and we see an astral
    representation of the Orion figure already in Homeric poetry (v 274; *Iliad* XVIII
    488).^98 Like the Sun, the constellation Orion rises from the Okeanos and sets
    in it (v 275, *Iliad* XVIII 489), unlike the Sun, it rises and sets at nighttime,
    not daytime. In the summer, at threshing time, Orion starts rising before Dawn
    (Hesiod Works and Days 598–599). In the winter, at plough time, Orion starts setting
    before Dawn (Works and Days 615–616). In summer the light of Dawn catches up with
    the rising Orion, and he can be late to keep Orion from setting into the Okeanos.^99
    In the light of Dawn arrives too late to set, however, one related story that
    does not set, is Arktos (v 275 = *Iliad* XVIII 488). The Arktos ‘Bear’ watches
    Orion, *doikei* (v 274 = *Iliad* XVIII 488), and the verb doikei implies doom.
    In Homeric dictum it is used when marksmen or savage beasts take aim at their
    victims (*Iliad* XIII 545,). For the Arktos ‘Bear’, the name implies the goddess
    Artemis.^100 In other words, the astral passages of *Odyssey* 273–275 and *Iliad*
