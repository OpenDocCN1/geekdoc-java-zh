  md: '# The Hellenization of Indo-European Poetics


    the attitude of Hellenic society toward the aoidós ''singer'' and the attitude
    of the singer toward his craft.³34 The traditional boast of the Hellenic singer,
    as an individual performer, is that he preserves the truth about heroic actions
    without having to be an eyewitness. Instead, the craft is his simply by virtue
    of his hearing from the Muses what they saw. As the singer declares at the beginning
    of the Catalogue,


    ὑμεῖς γὰρ θεαὶ ἐόστε, παρέράστέν τε, ἰστέ πέντα

    ἡμεῖς δὲ κλέος οἴμεν ἀκόουμεν οὐδὲ τἶδμεν


    Iliad II 485–496


    We [Muses] are gods: you are there [when things happen] and you know everything.

    But we [singers] know nothing: we just hear kleos.


    The claim of knowing nothing masks a highly sophisticated boast. From its etymology,
    we know that the Greek word kleos (kleos) was originally an abstract noun meaning
    “the act of hearing.” The word came to mean “fame” because it had been appropriated
    by the singer in his traditional role as an individual performer to designate
    what he sang about the actions of gods and heroes. The meaning “fame” betrays
    the consequences. It shows the social prestige of the poet’s art form. The actions
    of gods and heroes gain fame through the medium of the singer, and the singer
    calls his medium kleos, from “the act of hearing.” The singer starts his performance
    by asking his Muse to “tell him” the subject, his composition is in fact being
    presented to his audience as something that he hears from the very custodians
    of all stages of reality. The Muses are speaking to them, and they have the ipsissima
    verba of the Heroic Age.


    The poet’s inherited conceit, then, that he has access only to the content but
    to the actual form of what his eyewitnesses, the Muses, speak as they describe
    the realities of remote generations. I should emphasize that this conceit is linked
    with the poet’s inherited role as an individual performer, and that “only in performance
    can the formula exist and have clear definition.”⁶ The formulas are the selfless
    spoken by the Muses themselves: they are records of the Muses who were there when
    everything happened. In fact, the frame in which these formulas are contained,
    the dactylic hexameter, was actually called


