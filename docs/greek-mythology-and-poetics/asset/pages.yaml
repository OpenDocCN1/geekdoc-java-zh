    Obviously, all this thematic evidence makes it tempting to trace the Baltic and
    Slavic words for ''thunder''/''thunder-god'' to a common formal source. The task
    is forbidding, however, as we may see from the skepticism recorded in the standardological
    dictionary of Russian.27 The received opinion is here that perūnus has the common
    Slavic suffix -ūni and is probably derived from the verb *per- as in Old Slavonic
    *per/pirāti*.28 While the Slavic perūn looks like a deverative meaning ''the striker'',
    the form of Lithuanian looks like a denominative. On the basis of such formations
    Latin Portūnus (from *portūnos), derived from the u-stem noun portus, Lithuanian
    has been reconstructed as *perkinos, derived from perkkus.*29 A u-stem noun is
    actually within Latin querc ''oac''*30 Without the comparative evidence, it seems
    that perkūnas is a denominative. Other Lithuanian nouns with the suffix -ūnas
    are known to be derived from u-stems;31 only nouns with the suffix -ūnas may be
