  md: '# CHAPTER 1


    # Homer and Comparative Mythology


    Still under the spell of Heinrich Schliemann’s rediscovery of Troy, students of
    ancient Greece have been accustomed to regard the Greek epic tradition as a reporting
    of events that really happened in the second millennium B.C., the Mycenaean Bronze
    Age.1 This view may be modified by the perspective of comparative mythology, as
    most clearly articulated in a three-volume series, *Mythe et épopée* by Georges
    Dumézil.2 This perspective takes the methodology of Indo-European linguistics
    beyond the level of pure language and applies it to the level of myth as expressed
    by language. In this sense, it is appropriate to think of comparative mythology,
    more broadly, as *comparative mythology*:


    +   One of the services that "comparative philology" can render the "separate
    philologies" [as, for example, Classical philology] is to protect them against
    their own unchecked attitudes concerning "origins," to orient them toward empirical
    process, positive or negative, that goes beyond the uncertainty and consequent
    arbitrariness that can result from evaluating facts purely from a Greek or Roman
    or Indic or Scandinavian point of view.3


    Just as the *Greek language* is cognate with Indo-European languages, including
    Latin, Indic, and Old Norse, so various Greek *institutions* are cognate with
    the corresponding institutions of other peoples speaking other Indo-European languages.
    In other words, such


    1 A notable example is Page 159.

    2 Dumézil 1968, 1971, 1973.

    3 Dumézil 1985.15 (my translation).'
