  md: '# 2. JSP — Environment Setup


    A development environment is where you would develop your JSP programs, test them
    and finally run them.


    This tutorial will guide you to set up your JSP development environment which
    involves the following steps:


    # Setting up Java Development Kit


    This step involves downloading an implementation of the Java Software Development
    Kit (SDK) and setting up the PATH variable appropriately.


    You can download SDK from Oracle''s Java site: Java SE Downloads.


    Once you download your Java implementation, follow the given instructions to install
    and configure the setup. Finally set the PATH and JAVA_HOME environment variables
    to refer to the directory that contains java and javac, java_install_dir/bin and
    java_install_dir respectively.


    If you are running Windows and install the SDK in C:\jdk1.5.0_20, you need to
    add the following line in your C:\autoexec.bat file.


    ```

    set PATH=C:\jdk1.5.0_20\bin;%PATH%

    set JAVA_HOME=C:\jdk1.5.0_20

    ```


    Alternatively, on Windows NT/2000/XP, you can also right-click on My Computer,
    select Properties, then Advanced, followed by Environment Variables. Then, you
    would update the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.5.0_20
    and you use the C shell, put the following into your .cshrc


    ```

    setenv PATH /usr/local/jdk1.5.0_20/bin:$PATH

    setenv JAVA_HOME /usr/local/jdk1.5.0_20

    ```


    Alternatively, if you use an Integrated Development Environment (IDE) like Borland
    JBuilder, Eclipse, IntelliJ IDEA, or Sun One Studio, compile and run a simple
    program to confirm that the IDE knows you installed Java.


    # Setting up Web Server: Tomcat


    A number of Web Servers that support Java Pages and Servlets development are available
    in the market. Some web servers can be downloaded for free and Tomcat is one of
    them.


    Apache Tomcat is an open source software implementation of the Java Pages and
    Servlet technologies and can act as a standalone server for testing JSP and Servlets,


    ![](img/5626302a090fb89f52cde01d391f8bdc_13_0.png)'
  merge: -1
