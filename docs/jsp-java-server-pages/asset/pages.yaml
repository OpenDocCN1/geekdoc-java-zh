  md: 'In this chapter, we will discuss File Uploading in JSP. A JSP can be used with
    an HTML form tag to allow users to upload files to the server. An uploaded file
    can be a text file or a binary or an image file or just any document.


    # Creating a File Upload Form


    Let us now understand how to create a file upload form. The following HTML code
    creates an uploader form. Following are the important points to be noted:


    +   * The form method should be set to POST and GET method should not be used.

    * The form enctype attribute should be set to multipart/form-data.

    * The form action attribute should be set to a JSP file which would handle uploading
    at backend server. Example is using uploadFile.jsp program file to upload.

    * To upload a single file you should use a single <input .../> tag with attribute="file".
    To allow multiple files uploading, include more than one input tag with different
    values for the name attribute. The browser associates a Browse button with each
    of them.


    ```

    <html>

    <head>

    <title>File Uploading Form</title>

    </head>

