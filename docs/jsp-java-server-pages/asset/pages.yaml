    ```\n\n```\n// Pass request back down the filter chain\nchain.doFilter(request,response);\n\
    ```\n\n```\n}\npublic void destroy() {\n    /* Called before the Filter instance\
    \ is removed\n    from service the web container*/\n}\n```\n\nCompile LogFilter.java\
    \ in the usual way and put your LogFilter.class file in <Tomcat-installation-directory>/webapps/ROOT/WEB-INF/classes.\n\
    \n# ## JSP Filter Mapping in Web.xml\n\nFilters are defined and then mapped to\
    \ a URL or JSP name, which is the same way as Servlet is defined and mapped to\
    \ a URL pattern in web.xml. Creating the entry for filter tag in the deployment\
    \ descriptor file web.xml\n\n```\n<filter>\n  <filter-name>LogFilter</filter-name>\n\
    \  <filter-class>LogFilter</filter-class>\n  <param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Parameter</param-value>\n  </param>\n</filter>\n\
    <mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </mapping>\n```\n\nThe above filter will apply to all the servlets and JSP because\
    \ we specified /* in our configuration. You can specify a particular servlet or\
    \ the JSP path if you want to apply filter on few servlets or JSP only.\n\nNow\
    \ try to call any servlet or JSP and you will see generated log in your web server\
    \ log. You can use Log4J logger to log again in a separate file.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_87_0.png)"
