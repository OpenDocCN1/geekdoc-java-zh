  md: "# Form Based Authentication\n\nWhen you use the FORM authentication method,\
    \ you must supply a login form to prompt the user for a username and password.\
    \ Following is a simple code of login.jsp. This helps create a form for your same\
    \ purpose:\n\n```\n<html>\n<body bgcolor=\"#ffffff\">\n<form method=\"POST\" action=\"\
    j_security_check\">\n  <table border=\"0\">\n  <tr>\n    <td>login</td>\n    <td><input\
    \ type=\"text\" name=\"j_username\"></td>\n  </tr>\n  <tr>\n    <td>Password</td>\n\
    \    <td><input type=\"password\" name=\"j_password\"></td>\n  </tr>\n  </table>\n\
    \  <input type=\"submit\" value=\"Login!\">\n</center>\n</form>\n</body>\n</html>\n\
    ```\n\nHere you have to make sure that the login form must contain the form elements\
    \ named j_username and j_password. The action in the <form> tag must be j_security_check.\
    \ POST must be used as the form method. At the same time, you will have to modify\
    \ the <login-config> tag to specify the auth-method as FORM:\n\n```\n<web-app>\n\
    ...\n  <security-constraint>\n    <web-resource-collection>\n      <web-resource-name>\n\
    \        SecuredBookSite\n      </web-resource-name>\n      <url-pattern>secured/*</url-pattern>\n\
    \      <http-method>GET</http-method>\n      <http-method>POST</http-method>\n\
    \    </web-resource-collection>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_271_0.png)"
