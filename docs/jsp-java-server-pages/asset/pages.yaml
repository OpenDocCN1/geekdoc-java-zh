  md: '# Setting up CLASSPATH


    Since servlets are not part of the Java Platform, Standard Edition, you must identify
    the servlet classes to the compiler.


    If you are running Windows, you need to put the following lines in your C:\autoexec.bat
    file.


    ```

    set CATALINA=C:\apache-tomcat-5.5.29

    set CLASPATH=%CATALINA%\common\lib\jsp-api.jar;%CLASSP%

    ```


    Alternatively, on Windows NT/200/XP, you can also right-click on My Computer,
    select Properties, then Advanced, then Environment Variables. Then, you would
    update the CLASSPATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if you are using the C shell, you would put the
    following lines into your .cshrc file.


    ```

    setenv CATALINA=/usr/local/apache-tomcat-5.5.29

    setenv CLASSPATH=$CATALINA/common/lib/jsp-api.jar:$CLASSPATH

    ```


    **NOTE:** Assuming that your development directory is C:\JSPDev (Windows) or /usr/JSPDev
    (Unix), then you would need to add these directories as well in CLASSPATH.'
  merge: -1
