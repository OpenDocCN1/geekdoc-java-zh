  md: '# 17. JSP — Handling Date


    In this chapter, we will discuss how to handle data in JSP. One of the most important

    advantages of using JSP is that you can use all the methods available in core
    Java. We will

    take you through the Date class which is available in the java.util package; this
    class

    encapsulates the current date and time.


    The Date class supports two constructors. The first constructor initializes the
    object with

    t current date and time.


    ```

    Date( )

    ```


    The following constructor accepts one argument that equals the number of milliseconds

    that have elapsed since midnight, January 1, 1970


    ```

    Date(long millisec)

    ```


    Once you have a Date object available, you can call any of the following support
    methods

    to play with dates:


    | S. No. | Methods with Description |

    |---|---|n| 1 | boolean after(Date date)

    Returns the invoking Date object contains a date that is later than the

    specific by date, otherwise, it returns false. |

    | 2 | boolean before(Date date)

    Returns true if the invoking Date object contains a date that is earlier than
    the

    specific by date, otherwise, it returns false. |

    | 3 | Object clone( )

    Duplicates the invoking Date object. |

    | 4 | int compareTo(Date date)

    pares the value of the invoking object with that of date. Returns 0 if the

    values are equal. Returns a negative value if the invoking object is earlier than

    date. Returns a positive value if the invoking object is later than date. |

    | 5 | int compareTo(Object obj)

    Operates identically to compareTo(Date) if obj is of class Date. Otherwise, it

    throws a ClassCastException. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_110_0.png)'
