  md: '# Formatting Tags


    The JSTL formatting tags are used to format and display text, the date, the time,
    and numbers for internationalized Websites. Following is the syntax to include
    Formatting library in your JSP:


    ```

    <%@ taglib prefix="fmt"

    uri="http://java.sun.com/jsp/jstl/fmt" %>

    ```


    Following is the list of Formatting JSTL Tags:


    | Tag | Description |

    |---|---|

    | <fmt:formatNumber> | To render numerical value with specific precision or format.
    |

    | <fmt:Number> | Parses the string representation of a number, currency, or percentage.
    |

    | <fmt:formatDate> | Formats a date and/or time using the supplied styles and
    pattern. |

    | <fmt:parseDate> | Parses the string representation of a date and/or time. |

    | <fmt:bundle> | Loads a resource bundle to be used by its tag body. |

    | <fmt:setLocale> | Stores the given locale in the locale configuration variable.
    |

    | <fmt:setBundle> | Loads a resource bundle and stores it in the named scoped
    variable or the bundle configuration variable. |

    | <fmt:timeZone> | Specifies the time zone for any time formatting or parsing
    actions nested in its body. |

    | <fmt:setTimeZone> | Stores the given time zone in the time zone configuration
    variable. |

    | <fmt:message> | Displays an internationalized message. |

    | <fmt:requestEncoding> | Sets the request character encoding |


    ![](img/5626302a090fb89f52cde01d391f8bdc_148_0.png)'
