  md: "# Example\n\nResource bundles contain locale-specific objects. Resource bundles\
    \ contain key/value pairs. When your program needs locale-specific resource, you\
    \ keep all the common keys to the locale but you can have translated values specific\
    \ to locale. Resource bundles help in providing specific content to locale.\n\n\
    A resource bundle file contains a series of key-to-string mappings. The method\
    \ that we focus on involves compiled Java classes that extend the java.util.ListResource\
    \ class. You must compile these class files and make them available to the classpath\
    \ of your Web application.\n\nLet us define a default resource bundle as follows:\n\
    \n```\npackage com.tutorialspoint;\n\nimport java.util.ListResourceBundle;\n\n\
    public class Example_E extends ListResourceBundle {\n    public Object[][] getContents()\
    \ {\n        return contents;\n    }\n    static final Object[][] contents = {\n\
    \        \"count.one\", \"One\",\n        \"count.two\", \"Two\",\n        \"\
    count.three\", \"Three\",\n    };\n}\n```\n\nLet us compile the class Example.class\
    \ and make it available in the CLSPATH of your Web application. Now you can use\
    \ the following JSTL tags to display the three numbers as follows:\n\n```\n<%\
