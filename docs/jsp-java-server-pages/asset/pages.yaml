  md: 'We will now write one Error Handling JSP ShowError.Jsp, which is given below.
    Notice that the error-handling page includes the directive <@ page isError="true">.
    This directive causes the JSP compiler to generate the exception instance variable.


    ```

    <@ page isError="true" %>

    <html>

    <head>

    <title>Show Error Page</title>

    </head>

    <body>

    <h1>Oops...</h1>

    <p>Sorry, an error occurred.</p>

    <p>Here is the exception stack trace: </p>

    <pre>

    <% exception.printStackTrace(response.getWriter()); %>

    </pre>

    </body>

    </html>

    ```


    Access the main.jsp, you will receive an output somewhat like the following:


    ```

    java.lang.RuntimeException: Error condition!!!


    ......


    Oops...

    Sorry, an error occurred.


    Here is the exception stack trace:

    ```


    # Using JSTL Tags for Error Page


    You can use JSTL tags to write an error page ShowError.jsp. This page has almost
    same logic as in the above example, with better structure and more information:


    ```

    <@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core" %>

    <@ page isError="true" %>

    <html>

    <head>

    <title>Show Error Page</title>

    </head>

    ```


