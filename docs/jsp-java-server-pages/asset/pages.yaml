  md: 'In this chapter, we will discuss Internationalization in JSP. Before we proceed,
    let us understand the following three important terms:


    +   **Internationalization (i18n):** This means enabling a website to provide
    different versions of content translated into the visitor''s language or nationality.


    +   **Localization (l10n):** This means adding resources to a website to adapt
    it to a particular geographical or cultural region for example Hindi translation
    to a web site.


    +   **locale:** This is a particular geographical or cultural region. It is usually
    referred to as a language symbol followed by a country symbol which are separated
    by an underscore. For example, **en_US** represents locale for US.


    There are a number of items which should be taken care of while building up a
    global Website. This tutorial will not give you complete detail on this but will
    give you a good example on how you can offer your Webpage in different languages
    to the internet community by their location, i.e., locale.


    A JSP can pick appropriate version of the site based on the requester''s locale
    and provide appropriate site version according to the local language, culture
    and requirements. Following is the method of request object returns the Locale
    object.


    ```

    java.util.Locale request.getLocale()

    ```


    # Detecting Locale


    Following are the important locale methods which you can use to detect requester''s
    location, language and of course locale. All the methods display the country name
    and language name set in the requester''s browser.


    | S.NO. | Method & Description |

    |---|---|n| 1 | **String getCountry()**<br>This method returns the country/region
    code in upper case for this locale in ISO 3166 2-letter format. |

    | 2 | **String getDisplayName()**<br>This method returns a name for the locale''s
    country that is appropriate for display to the user. |

    | 3 | **String getLanguage()** |


    ![](img/5626302a090fb89f52cde01d391f8bdc_274_0.png)'
