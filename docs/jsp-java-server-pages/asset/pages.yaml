  md: '# JSP - The page Directive


    The page directive is used to provide instructions to the container that pertain
    to the current JSP page. You may code the page directives anywhere in your JSP
    page. By convention, page directives are coded at the top of the JSP page.


    Following is the basic syntax of page directive:


    ```

    <@ page attribute="value" %>

    ```


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsp:directive.page attribute="value" />

    ```


    # Attributes


    Following table lists out the attributes associated with the page directive:


    | Attribute | Purpose |

    | buffer | Specifies a buffering model for the output stream. |

    | autoFlush | Controls the behavior of the servlet output buffer. |

    | contentType | Defines the character encoding scheme. |

    | errorPage | Defines the URL of another JSP that reports on Java runtime exceptions.
    |

    | isErrorPage | Indicates if this JSP page is a URL specified by another JSP''s
    errorPage attribute. |

    | extends | Specifies a superclass that the generated servlet extend. |

    | import | Specifies a list of packages or classes for use in the JSP as the Java
    import statement does for Java classes. |

    | info | Defines a string that can be accessed with the servlet''s getServletInfo()
    method. |

    | isThreadSafe | Defines the threading model for the generated servlet. |

    | language | Defines the programming language used in the JSP page. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_35_0.png)'
  merge: -1
  pgno: 35
- img_proc: true
  md: '| session | Specifies whether or not the JSP page participates in HTTP sessions.
    |

    | isELIgnored | Specifies whether or not the EL expression within the JSP page
    will be ignored. |

    | isScriptingEnabled | Determines if the scripting elements are allowed for use.
