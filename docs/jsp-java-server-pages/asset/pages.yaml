- img_proc: true
  md: '# 9. JSP – Client Request


    In this chapter, we will discuss Client Request in JSP. When a browser requests
    a Webpage, it sends a lot of information to the web server. This information cannot
    be read directly because this information travels as a part of header of request.
    You can check HTTP Protocol for more information on this.


    Following table lists the important header information which comes from the browser.
    This information is frequently used in web programming:


    | Header | Description |

    | --- | --- |

    | Accept | This header specifies the MIME types that the browser or other clients
    can handle. Values of image/png or image/jpeg are the two most common possibilities.
    |

    | Accept-Charset | This header specifies the character sets that the browser can
    use to display the information. For example, ISO-8859-1. |

    | Accept-Encoding | This header specifies the types of encodings that the browser
    knows to handle. Values of gzip or compress are the two most common possibilities.
