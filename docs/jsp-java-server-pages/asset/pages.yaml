  md: '# The <jsp:plugin> action is Action


    The plugin action is used to insert JSP components into a JSP page. It determines
    the type of browser and inserts the <object> or <embed> tags as needed.


    If the needed plugin is not present, it downloads the plugin and executes the
    Java component. The Java component can be an Applet or a JavaBean.


    The plugin action has several attributes that correspond to common HTML tags used
    to format Java components. The <param> element can also be used to send parameters
    to the Applet


    Following is the typical syntax of using the plugin action: type="applet" codebase="dirname"
    code="MyApplet.class"


    ```

    <jsp:plugin type="applet" codebase="dirname" code="MyApplet.class"

    width="60" height="80">

    <jsp:param name="font" value="red" />

    <jsp:param name="background" value="black" />


    <jsp:fallback>

    Unable to initialize Java Plugin

    </jsp:fallback>

    </jsp:plugin>

    ```


    You can try this action using some applet if you are interested. A new element,
    the <fallback> element, can be used to specify an error string to be sent to the
    user in case the component fails.


    The <jsp:element> Action

    The <jsp:body> ActionThe <jsp:element>, It;<jsp:attribute> and <jsp:body> actions
    are used to define XML elements dynamically. The word dynamically is important,
    because it means the XML elements can be generated at request time rather than
    statically at compile time.


    Following is a simple example to define XML elements dynamically:'
  merge: -1
