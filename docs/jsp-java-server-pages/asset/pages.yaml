  md: '# JSTL Core <c:out> Tag


    The <c:out> tag can automatically escape XML tags so they aren''t evaluated as
    actual tags.


    # Attribute


    The <c:out> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|---|

    | value | Information to output | Yes | None |

    | default | Fallback information to output | No | body |

    | escapeXml | True if the tag should escape special XML characters | No | true
    |


    # Example


    ```

    <@taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title><c:out> Tag Example</title>

    </head>

    <body>

    <c:out value="${<tag>, &;"/>

    </body>

    </html>

    ```


    The above code will produce the following result:


    ```

    <tag> , &

    ```


    # JSTL Core <c:set> Tag


    The <c:set> tag is JSTL-friendly version of the setProperty action. The tag is
    helpful because it evaluates an expression and uses the results to set a value
    of a JavaBean java.util.Map object.


    ![](img/5626302a090fb89f52cde01d391f8bdc_132_0.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Attribute


    The <c:set> tag has following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|-|

    | value | Information to save | No | body |

    | target | Name of the variable whose property should be modified | No | None
    |

    | property | Property to modify | No | None |

    | var | Name of the variable to store information | No | None |

    | scope | Scope of variable to store information | No | Page |


    If target is specified, property must also be specified.


    # Example


    ```

    <%@taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title><c:set Tag Example</title>

    </head>

    <body>

    <c:set var="salary" scope="session" value="${2000*2}"/>

    <c:out value="${salary}"/>

    </body>

    </html>

    ```


    The above code will produce the following result:


    ```

    4000

    ```


    # JSTL Core <c:remove> Tag


    The <c:remove> tag removes a variable from either a specified scope or the first
    scope where the variable is found (if no scope is specified). This action is not
    particularly helpful, but it can aid in ensuring that JSP cleans up any scoped
    resources it is responsible for.


    ![](img/5626302a090fb89f52cde01d391f8bdc_133_0.png)'
