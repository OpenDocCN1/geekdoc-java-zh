    # The HttpServletResponse


    The response object is an instance of a `javax.servlet.http.HttpServletResponse`
    object. Just as the server creates the request object, it also creates an object
    to represent the response to the client.


    The response object also defines the interfaces that deal with creating new HTTP
    headers. Through this object, the JSP programmer can add new cookies or dates,
    HTTP status codes, etc.


    The following methods can be used to set HTTP response header in your servlet
    program. These methods are available with the `HttpServletResponse` object. This
    object represents the server response.


    | S.NO. | Method & Description |

