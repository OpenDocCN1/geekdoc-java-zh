    # Accessing JavaBeans Properties


    Along with `<jsp:useBean..>` action, you can use the `<jsp:getProperty/>` action
    to access the get methods and the `<jsp:setProperty/>` action to access the set
    methods. Here is the full syntax:


    ```

    <jsp:useBean id="id" class="bean''s class" scope="bean" scope>

    <jsp:setProperty name="bean''s id" property="property name" value="value"/>


    <jsp:getProperty name="bean''s id" property="property name"/>


    </jsp:useBean>

    ```


    The name attribute references the id of a JavaBean previously introduced to the
    JSP by the `useBean` action. The property attribute is the name of the `get` or
    the `set` methods that should be invoked.


