  md: '# About the Tutorial


    Java Server Pages (JSP) is a server-side programming technology that enables the
    creation of dynamic, platform-independent method for building Web-based applications.
    JSP have access to the entire family of Java APIs, including the JDBC API to access
    enterprise databases. This tutorial will teach you how to use Java Server Pages
    to develop your web applications in simple and easy steps.


    # Audience


    This tutorial has been prepared for the beginners to help them understand basic
    functionality of Java Server Pages (JSP) to develop your web applications. After
    completing this tutorial you will find yourself at a moderate level of expertise
    in using JSP from where you can take yourself to next levels.


    # Prerequisites


    We assume have little knowledge of how web applications work over HTTP, what is
    web server and what is web browsers. It will be great if you have some knowledge
    of web application development using any programming language.


