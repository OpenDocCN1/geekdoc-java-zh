    # JSTL SQL <sql:query> Tag


    The <sql:query> tag executes an SQL SELECT statement and saves the result in a
    scoped variable.


    # Attribute:


    The <sql:query> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|--|

    | sql | SQL command to execute (should return a ResultSet) | | Body |

    | dataSource | Database connection to use (overrides default) | No | Default database
    |

    | maxRows | Maximum number of results to store in the variable | No | Unlimited
    |

    | startRow | Number of the row in the result at which to start recording | No
    | 0 |

    | var | Name of the variable to represent the database | No | Set default |

    | scope | Scope of variable to expose the result from the database | No | Page
    |


    # Example


    To start with the basic concept, let us create an Employees table in the TEST
    database and create few records in that table as follows:


    Follow these steps to create the Employees table:


    # Step 1:


    Open a Command Prompt and change to the installation directory as follows:


    ```

