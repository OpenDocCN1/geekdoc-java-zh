    # Servlet Cookies Methods


    Following is the list of useful methods associated with the Cookie object which
    you can use while manipulating cookies in JSP:


    | S.NO. | Method & Description |

    |---|---|n| 1 | public void setDomain(String pattern)<br>This method sets the
    domain to which the cookie applies; for example, tutorialspoint.com. |

    | 2 | public String getDomain()<br>This method gets the domain to which the cookie
    applies; for example, tutorialspoint.com. |

    | 3 | public void setMaxAge(int expiry)<br>This method sets how much time (in
    seconds) should elapse before the cookie expires. If you don''t set this, the
    cookie will last only for the current session. |

    | 4 | public int getMaxAge()<br>This method returns the maximum age of the cookie,
    specified in seconds. By default, -1 indicating the cookie will persist until
    the browser shutdown. |

    | 5 | public String getName()<br>This method returns the name of the cookie. The
    name cannot be changed after the creation. |

    | 6 | public void setValue(String newValue)<br>This method sets the value associated
    with the cookie. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_91_0.png)'
