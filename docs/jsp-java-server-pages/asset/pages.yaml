  md: "# 18. JSP – Page Redirecting\n\nIn this chapter, we will discuss page redirection\
    \ with JSP. Page redirection is generally used when a document moves to a new\
    \ location and we need to send the client to this new location. This can be because\
    \ of load balancing, or for simple randomization.\n\nThe simplest way of redirecting\
    \ a request to another page is using sendRedirect() method of response object.\
    \ Following is the signature of this method:\n\n```\npublic void response.sendRedirect(String\
    \ location)\nthrows IOException\n```\n\nThis method sends back the response to\
    \ the browser along with the status code and new page location. You can also use\
    \ the setStatus() and the setHeader() methods together to achieve the same redirection\
    \ example:\n\n```\n...\nString site = \"http://www.newpage.com\" \nresponse.setStatus(response.SC_MOVED_TEMPORARILY);\n\
    response.setHeader(\"Location\", site);\n...\n```\n\n# Example\n\nThis example\
    \ shows how a JSP performs page redirection to an another location:\n\n```\n<%\
    \ page import=\"java.io.*,java.util.*\" %>\n<html>\n<head>\n<title>Page Redirection</title>\n\
    </head>\n<body>\n<center>\n<h1>Page Redirection</h1>\n</center>\n%\n\n// New location\
    \ to be redirected\nString site = new String(\"http://www.photofuntoos.com\")\n\
    response.setStatus(response.SC_MOVED_TEMPORARILY);\nresponse.setHeader(\"Location\"\
    , site);\n%>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_115_0.png)"
