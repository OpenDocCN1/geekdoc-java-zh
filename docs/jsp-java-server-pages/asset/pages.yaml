  md: '# 25. JSP – JavaBeans


    A JavaBean is a specially constructed Java class written in the Java and coded
    according to the JavaBean API specifications.


    Following are the unique characteristics that distinguish a JavaBean from other
    Java classes:


    +   - It provides a default, no-argument constructor.

    - It should be serializable and that can implement the Serializable interface.

    - It may have a number of properties which can be read or written.

    - It may have a number of "getter" and "setter" methods for the properties.


    # JavaBeans Properties


    A JavaBean property is a named attribute that can be accessed by the user of the
    object. The attribute can be of any Java data type, including the classes that
    you define.


    A JavaBean property may be read, write, read only, or write only. JavaBean properties
    are accessed through two methods in the JavaBean''s implementation class:


    | Method | Description |

    | --- | --- |

    | getPropertyName() | For example, if property name is firstName, your method
    would be getFirstName() to read that property. This method is called accessor.
    |

    | setPropertyName() | For example, if property name is firstName, your method
    would be setFirstName() to write that property. This method is called mutator.
    |


    A read-only attribute will have only a getPropertyName() method, and a write-only
    attribute will have only a setPropertyName() method.


    # JavaBeans Example


    Consider a student class with few properties:


    ```

    package com.tutorialspoint;


    public class Students implements java.io.Serializable

    {

    ```


