    \ fmt-bundle Tag</title>\n</head>\n<body>\n<fmt:bundle basename=\"com.tutorialspoint.Example\"\
    \ prefix=\"count\">\n<fmt:message key=\"one\"/><br/>/>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_160_0.png)"
