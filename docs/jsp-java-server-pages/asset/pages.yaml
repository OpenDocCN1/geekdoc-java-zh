  md: 'In this chapter, we will discuss how to handle exceptions in JSP. When you
    are writing a JSP code, you might make coding errors which can occur at any part
    of the code. There may occur the following type of errors in your JSP code:


    # Checked exceptions


    A checked exception is an exception that is typically a user error or a problem
    that cannot be foreseen by the programmer. For example, if a file is to be opened,
    but the file cannot be found, an exception occurs. These exceptions cannot simply
    be ignored at the time of compilation.


    # Runtime exceptions


    A runtime exception is an exception that probably could have been avoided by a
    programmer. As opposed to the checked exceptions, runtime exceptions are ignored
    at the time of compilation.


    # Errors


    These are not exceptions at all, but problems that arise beyond the control of
    the user or the programmer. Errors are typically ignored in your code because
    you can rarely do anything about an error. For example, if a stack overflow occurs,
    an error will arise. They are also ignored at the time of compilation.


    We will further discuss how to handle runtime exception/error occurring in your
    JSP code.


    # Using Exception Object


    The exception object is an instance of a subclass of Throwable (e.g., java.lang.NullPointerException)
    and is only available in error pages. Following table lists out the important
    methods available in the Throwable class.


    | S. No. | Methods with Description |

    |---|---|

    | 1 | **public String getMessage()**<br>Returns a detailed message about the exception
    that has occurred. This message is initialized in the Throwable constructor. |
    |

    | 2 | **public Throwable getCause()**<br>Returns the cause of the exception as
    represented by a Throwable object. |

    | 3 | **public String toString()** |


    ![](img/5626302a090fb89f52cde01d391f8bdc_259_0.png)'
  merge: -1
  pgno: 259
- img_proc: true
  md: "| | Returns the name of the class concatenated with the result of getMessage().\
    \ |\n| 4 | **public void printStackTrace()**<br>Prints the result of toString()\
    \ along with the stack trace to System.err, the error output stream. |\n| 5 |\
    \ **public StackTraceElement [] getStackTrace()**<br>Returns an array containing\
    \ each element on the stack trace. The element index 0 represents the top of the\
    \ call stack, and the last element in the array represents the method at the bottom\
    \ of the call stack. |\n| 6 | **public Throwable fillInStackTrace()**<br>Fills\
    \ the stack trace of this Throwable object with the current stack trace, adding\
    \ to any previous information in the stack trace. |\n\nJSP gives you an option\
    \ to specify Error Page for each JSP. Whenever the page throws an exception, the\
