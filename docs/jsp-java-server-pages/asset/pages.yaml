  md: '# Locale Specific Percentage


    You can use the java.text.NumberFormat class and its static getPercentInstance()
    method to get locale specific percentage. Following example shows how to format
    percentage to a given locale:


    ```

    <@page import="java.io.*,java.util.Locale" %>

    <@page import="javax.servlet.*,javax.servlet.http.*" %>

    <@page import="java.text.NumberFormat,java.util.Date" %>


    <%%

    String title = "Locale Specific Percentage";

    //Get the client''s Locale

    Locale locale = request.getLocal(); );

    NumberFormat nft = NumberFormat.getPercentInstance(locale);

    String formattedPerc = nft.format(0.51);

    %>

    <html>

    <head>

    <title><% out.print(title); %></title>

    </head>

    <body>

    <center>

    <h1><%% out.print(title); %</h1></h1>

    </center>

    <div align="center">

    <p>Formatted Percentage: <% out.print(formattedPerc); %></p>

    </div>

    </body>

    </html>

    ```


