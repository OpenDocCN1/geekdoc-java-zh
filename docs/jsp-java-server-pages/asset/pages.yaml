    \ code that represents the ISO-639 language code and an ISO-3166 country code\
    \ | Yes | en_US |\n| variant | Browser-specific variant | No | None |\n| scope\
    \ | Scope of the locale configuration variable | No | Page |\n\n# Example\n\n\
    Resource bundles contain locale-specific objects. Resource bundles contain key/value\
    \ pairs. When your program needs a locale-specific bundle you keep all the keys\
    \ common to all the locale but can have translated values specific to locale.\
    \ Resource bundles help in providing content specific to locale.\n\nA resource\
    \ bundle contains a series of key-to-string mappings. The method that we focus\
    \ on involves creating compiled Bundle classes that extend the java.util.ListResource\
    \ class. You must compile these class files and make them available to the classpath\
    \ of your application.\n\nLet us define a default resource bundle as:\n\n```\n\
    package com.tutorialspoint;\n\nimport java.util.ListResourceBundle;\n\npublic\
    \ class Example_En extends ListResourceBundle {\n    public Object[][][] getContents()\
    \ {\n        return contents;\n    }\n    static final Object[][] contents = {\n\
    \        \"count.one\", \"One\",\n        \"count.two\", \"Two\",\n        \"\
    count.three\", \"Three\",\n    };\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_162_0.png)"
