  md: '# (3) Sending the Cookie into the HTTP response headers: You use response.addCookie
    to add cookies in the HTTP response header as follows:


    | response.addCookie(cookie); |


    # Example


    Let us modify our Form Example to set the cookies for the first and the last name.


    ```

    <%

    // Create cookies for first and last names.

    Cookie firstName = new Cookie("first_name");

    request.getParameter("first_name"));

    Cookie lastName = new Cookie("last_name");

    request.getParameter("last_name"));


    // Set expiry date after 24 Hrs for both the cookies.

    firstName.setMaxAge(60*60*24);

    lastName.setMaxAge(60*60*24);


    // Add both the cookies in the response header.

    response.addCookie(firstName);

    response.addCookie(lastName);

