  md: '| Connection | This header instructs the browser whether to use persistent
    HTTP connections or not. A value of close instructs the browser not to use persistent
    HTTP connections and keep-alive means using persistent connections. |

    | Content-Disposition | This header lets you request that the browser ask the
    to save the response to disk in a file of the given name. |

    | Content-Encoding | This header specifies the way in which the page was encoded
    transmission. |

    | Content-Language | This header signifies the language in which the document
    is written. For example, en, en-us, ru, etc. |

    | Content-Length | This header indicates the number of bytes in the response.
    This information is needed only if the browser is using a persistent (keep-alive)
    HTTP connection. |

    | Content-Type | This header gives the MIME (Multipurpose Internet Mail Extension)
    type of the response document. |

    | Expires | This header specifies the time at which the content should be considered
    out-of-date and thus no longer be cached. |

    | Last-Modified | This header indicates when the document was last changed. The
    client can cache the document and supply a date by an IfModified-Since request
    header in later requests. |

    | Location | This header should be included with all responses that have a status
