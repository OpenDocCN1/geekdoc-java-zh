  md: '# Programmatic Security in a Servlet/JSP


    The HttpServletRequest provides the following methods, which can be used to mine
    security information at runtime:


    | S.No. | Method and Description |

    |---|---|

    | 1 | **String getAuthType()**<br>The getAuthType() method returns a String object
    that represents the name of the authentication scheme to protect the Servlet.
    |

    | 2 | **boolean isUserInRole(java.lang.String)**<br>The isUserInRole() method
    returns a boolean value: true if the user is in the given role or if they are
    not. |

    | 3 | **String getProtocol()**<br>The getProtocol() method returns a String object
    representing the protocol that was sent to the request. This value can be checked
    to determine if a secure protocol was used. |

    | 4 | **boolean isSecure()**<br>The isSecure() method returns a boolean value
    representing if the request was made using HTTPS. A value of true means it was
    and the connection is secure. A value of false means the request was not. |

    | 5 | **Principle getUserPrincipal()**<br>The getUserPrincipal() method returns
    a java.security.Principle object that contains the name of the authenticated user.
    |


    For example, a Java Page that links to pages for managers, you might have the
    following code:


    ```

    <% if (request.isUserRole("manager")) { %>

    <a href="managers/mgreport.jsp">Manager Report</a>

    <a href="managers/personnel.jsp">Personnel Records</a>

    <% } %>

    ```


    By checking the user''s role in a JSP or servlet, you can customize the Webpage
    to show only the users she can access. If you need the user''s name as it was
    entered in the authentication form, you can call the getRemoteUser method in the
    request object.


