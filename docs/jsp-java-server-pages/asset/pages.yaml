    # JSTL Core <c:forEach>, <c:Tokens> Tag


    These tags are a good alternative to embedding a Java for, while, or do-while
    loop via a scriptlet. The <c:forEach> tag is a commonly used tag because it iterates
    over a collection of objects. The <c:Tokens> tag is used to break a string into
    tokens and iterate through each of the tokens.


    # Attribute


    The <c:forEach> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | items | Information to loop over | No | None |

    | begin | Element to start with (0 = first item, 1 = second item, ...) | No |
    0 |

    | end | Element to end with (0 = first item, 1 = second item, ...) | No | Last
    element |

    | step | Process every step items | No | 1 |


