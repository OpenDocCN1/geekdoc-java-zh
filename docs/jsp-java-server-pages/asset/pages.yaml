  md: "# 13. JSP – Filters\n\nIn this chapter, we will discuss Filters in JSP. Servlet\
    \ and JSP Filters are Java classes that can be used in Servlet and JSP Programming\
    \ for the following purposes:\n\n+   * To Intercept requests from a client before\
    \ they access a resource at back end.\n* To manipulate responses from server before\
    \ they are sent back to the client.\n\nThere are various types of filters suggested\
    \ by the specifications:\n\n+   * Authentication Filters\n* Data compression Filters\n\
    * Encryption Filters\n* Filters that trigger resource access events\n* Image Conversion\
    \ Filters\n* Logging and Auditing Filters\n* MIME-TYPE Chain Filters\n* Tokenizing\
    \ Filters\n* XSL/T Filters That Transform XML Content\n\nFilters are deployed\
    \ in the deployment descriptor web.xml and then map to either servlet or JSP names\
    \ or URL patterns in your application's deployment descriptor. The deployment\
    \ descriptor file web.xml can be found in <Tomcat-installation-directory>/conf\
    \ directory.\n\nWhen the JSP container starts up your web application, it creates\
    \ an instance of each filter that you have declared in the deployment descriptor.\
    \ The filters execute in the order that they are declared in the deployment descriptor.\n\
    \n# Servlet Filter Methods\n\nA filter is simply a Java class that implements\
    \ the javax.servlet.Filter interface. The javax.servlet.Filter interface defines\
    \ three methods:\n\n| S.NO. | Method & Description |\n| --- | --- |\n| | public\
    \ void doFilter(ServletRequest, ServletResponse, FilterChain) \n This method is\
    \ called by the container each time a request/response pair is passed through\
    \ the chain by a client request for a resource at the end of the chain. |\n| 2\
    \ | public void init(FilterConfig filterConfig) |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_85_0.png)"
  merge: -1
  pgno: 85
- img_proc: true
  md: "This method is called by the web container to indicate to a filter that it\
    \ is being placed into service.\n\npublic void destroy()\nThis method is called\
    \ by the web container to indicate to a filter that it is being taken out of service.\n\
    \n# JSP Filter Example\n\nFollowing example shows how to print the client's IP\
    \ address and the current date time, each time it would access any JSP file. This\
    \ example will give you a basic understanding of the JSP Filter, but you can write\
    \ more sophisticated filter applications using the same concept.\n\n```\n// Import\
    \ required java libraries\nimport java.io.*;\nimport javax.servlet.*;\nimport\
    \ java.util.*;\n\n// Implements Filter class\npublic class LogFilter implements\
    \ Filter {\n    public void init(FilterConfig config)\n        throws ServletException\
    \ {\n        // Get init parameter\n        String testParam = config.getInitParameter(\"\
    test-param\");\n\n        // Print the init parameter\n        System.out.println(\"\
    test Param: \" + testParam);\n    }\n    public void doFilter(ServletRequest request,\n\
    \        ServletResponse response,\n        FilterChain chain)\n        throws\
    \ java.io.IOException, ServletException {\n\n        // Get the IP address of\
    \ client machine.\n        String ipAddress = request.getRemoteAddr();\n\n   \
    \     // Log the IP address and current timestamp.\n}\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_86_0.png)"
