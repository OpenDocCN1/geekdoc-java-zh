  md: '# JSP


    | time | Time zone of the parsed date | No | Default zone |

    | var | Name of the variable to store the parsed date | No | Print to page |

    | scope | Scope of the variable to store the formatted date | No | page |


    A pattern attribute is provided that works just like the pattern attribute for
    the <fmt:dateFormat> tag. However, in the case of parsing, the pattern attribute
    tells the parser what format to expect.


