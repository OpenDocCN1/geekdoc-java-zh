  md: 'In this chapter, we will discuss the Custom Tags in JSP. A custom tag is a
    user-defined JSP language element. When a JSP page containing a custom tag is
    translated into a servlet, the tag is converted to operations on an object called
    a tag handler. The Web container invokes those operations when the JSP page''s
    servlet is executed.


    JSP tag extensions let you create tags that you can insert directly into a JSP.
    The JSP 2.0 specification introduced the Simple Handlers for writing your custom
    tags.


    To write a custom tag, you can simply extend SimpleTagSupport class and override
    the doTag() method, where you can place your code to generate content for the
    tag.


    # Create "Hello" Tag


    Consider you want to define a custom tag named <ex:Hello> and you want to use
    it in the following fashion without a body:


    ```

    <ex:Hello />

    ```


    To create a JSP tag, you must first create a Java class that acts as a tag handler.
    Let us now create the HelloTag class as follows:


    ```

    package com.tutorialspoint;


    import javax.servlet.jsp.tageext.*;

    import javax.servlet.jsp.*;

    import java.io.*;


    public class HelloTag extends SimpleTagSupport {


    public void doTag() throws JspException, IOException {

    spWriter out = getJspContext().getWriter();nout.println("Hello Custom Tag!");

    }

    }

    ```


    The above code has simple coding where the doTag() method takes the current JspContext
    object using the getJspContext() method and uses it to send "Hello Custom Tag!"
    to the current JspWriter object.'
