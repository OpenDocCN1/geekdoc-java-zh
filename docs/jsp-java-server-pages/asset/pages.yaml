  md: '# Locale Specific Currency


    You can use the java.txt.NumberFormat class and its static getCurrencyInstance()
    method to format a number, such as a long or double type, in a locale specific
    currency. Following is the example shows how to format currency specific to a
    given locale:


    ```

    <@page import="java.io.*, java.util.Locale %>

    <@page import="javax.servlet.*, javax.servlet.http.* %>

    <@page import="java.text.NumberFormat, java.util.Date %>


    <%

    String title = "Locale Specific Currency";n// Get the client''s Locale

    Locale locale = request.getLocal();

    NumberFormat nft = NumberFormat.getCurrencyInstance(locale);

    String formattedCurr = nft.format(1000000);

    %>

    <html>

    <head>

    <title><% out.print(title); %></title>

    </head>

    <body>

    <center>

    <h1><% out.print(title); %></h1>

    </center>

    <div align="center">

    <p>Formatted Currency: <% out.print(formattedCurr); %></p>

    </div>

    </body>

    </html>

    ```'
