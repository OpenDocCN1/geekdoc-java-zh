  md: 'In this chapter, we will discuss Actions in JSP. These actions use constructs
    in XML syntax to control the behavior of the servlet engine. You can dynamically
    insert a file, reuse JavaBeans components, forward the user to another page, or
    generate HTML for the Java plugin.


    There is only one syntax for the Action element, as it conforms to the XML standard:


    ```

    <jsp:action_name attribute="value" />

    ```


    Action elements are basically predefined functions. The following table lists
    out the available JSP actions:


    | Syntax | Purpose |

    | jsp:include | Includes a file at the time the page is requested. |

    | jsp:useBean | Finds or instantiates a JavaBean. |

    | jsp:setProperty | Sets the property of a JavaBean. |

    | jsp:getProperty | Inserts the property of a JavaBean into the output. |

    | jsp:forward | Forwards the requester to a new page. |

    | jsp:plugin | Generates browser-specific code that makes an OBJECT EMBED tag
    for the Java plugin. |

    | jsp:element | Defines XML elements dynamically. |

    | jsp:attribute | Defines dynamically-defined XML element''s attribute. |

    | jsp:body | Defines dynamically-defined XML element''s body. |

    | jsp:text | Used to write template text in JSP pages and documents. |


    # Common Attributes


    There are two attributes that are common to all Action elements: the id attribute
    and the scope attribute.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Id attribute


    The id attribute uniquely identifies the Action element, and allows the action
    to be referenced inside the JSP page. If the Action creates an instance of an
    object, the id value can be used to reference it through the implicit object PageContext.


    # Scope attribute


    This attribute identifies the lifecycle of the Action. The id attribute and the
    scope attribute are directly related, as the scope attribute determines the lifespan
    of the object associated with the id. The scope attribute has four possible values:
    **(a) page, (b)request, (c)session,** and **(d) application.


    # The <jsp:include> Action Action


    This action inserts file into the page being generated. The syntax looks like
    this:


    ```

    <jsp:include page="relative URL" flush="true" />

    ```


    Unlike the include directive, which inserts the file at the time the JSP page
    is translated into a servlet, this action inserts the file at the time page is
    requested.


    Following is the list of attributes associated with the action:


    | Attribute | Description |

    | --- | --- |

    | page | The relative URL of the page to be included. |

    | flush | The boolean attribute determines whether the included resource has its
    buffer flushed before it is included. |


    # Example


    Let us define the two files **(a)date.jsp** and **(b) main.jsp** as follows:


    Following is the content of the **date.jsp** file:


    ```

    <p>

    Today''s date: <%= (new java.util.Date()).toLocaleString() %>

    </p>

    ```


    Following is the content of the **main.jsp** file:


    ```

    <html>

    <head>

    <title>The include Action Example</title>

    </head>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_45_0.png)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '```

    <body>

    <center>

    <h2>The include action Example</h2>

    <jsp:include page="date.jsp" flush="true" />

    </center>

    </body>

    </html>

    ```


    Let us now keep keep all these files in the root directory and try to access main.jsp.
    You will receive the following output:


    # The include action Example

    Today''s date: 12-Sep-2010 14:54:22


    # The <jsp:useBean> Action


    The useBean is quite versatile. It first searches for an existing object utilizing
    the id and scope variables. If an object is not found, it then tries to create
    the specified object.


    The simplest way to load a bean is as follows:


    ```

    <jsp:useBean id="name" class="package.class" />

    ```


    Once a bean is loaded, you can use jsp:setProperty and jsp:getProperty actions
    to modify and retrieve the bean properties.


    Following table lists out the attributes associated with useBean action:


    | Attribute | Description |

    |---|---|

    | class | Designation the full package name of the bean. |

    | type | Specifies the type of the variable that will refer to the object. |

    | beanName | Gives the name of the bean as specified by the instantiate () method
    of the java.beans.Beans class. |'
  merge: -1
