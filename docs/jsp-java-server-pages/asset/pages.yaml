  md: 'In this chapter, we will discuss the Server Response in JSP. When a Web server
    responds to a HTTP request, the response typically consists of a status line,
    some response headers, a blank line, and the document. A typical response looks
    like this:


    ```

    HTTP/1.1 200 OK

    Content-Type: text/html

    Header2: ...

    ...

    Header: ...

    (Blank Line)

    <!doctype ...>

    <html>

    <head>...</head>

    <body>

    ...

    </body>

    </html>

    ```


    The status line consists of the HTTP version (HTTP/1.1 in the example), a status
    code (200 in the example), and a very short message corresponding to the status
    code (OK in the example).


    Following is a summary of the most useful HTTP 1.1 response headers which go back
    to the browser of the web server. These headers are frequently used in web programming:


    | Header | Description |

    |---|---|

    | Allow | This header specifies the request methods (GET, POST, etc.) that the
    server supports. | This header specifies the circumstances in which the response
    document can safely be cached. It can have values private or no-cache etc. Public
    means document is cacheable, Private means document is for a single user and can
    only be stored in private (nonshared) caches and no-cache document should never
    be cached. |'
