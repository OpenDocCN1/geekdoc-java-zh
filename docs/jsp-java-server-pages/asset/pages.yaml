    </fmt:bundle>\n\n<fmt:bundle basename=\"com.tutorialpoint.Example\" prefix=\"\
    count\">\n  <fmt:message key=\"title\"/>\n</fmt:bundle>\n```\n\n# Attribute\n\n\
    The **<fmt:bundle>** tag has the following attributes:\n\n| Attribute | Description\
