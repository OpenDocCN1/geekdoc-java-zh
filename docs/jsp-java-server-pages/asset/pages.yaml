  md: "# 24. JSP – XML Data\n\nWhen you send the XML data via HTTP, it makes sense\
    \ to use JSP to handle incoming outgoing XML documents; for example, RSS documents.\
    \ As an XML document is merely a bunch of text, creating one through JSP is much\
    \ easier than creating an HTML document.\n\n# Sending XML from a JSP\n\nYou can\
    \ send the XML content using JSPs the same way you send HTML. The only difference\
    \ is that you must set the content type of page to text/xml. To set the content\
    \ type, use the `<%@page%>` tag, like this:\n\n```\n<@ page contentType=\"text/xml\"\
    \ %>\n```\n\nFollowing example will how to show XML content to the browser:\n\n\
    ```\n<@ page contentType=\"text/xml\" %>\n\n<books>\n  <book>\n    <name>Padam\
    \ History</name>\n    <author>ZARA</author>\n    <price>100</price>\n  </book>\n\
    </books>\n```\n\nAccess the above XML using different browsers to see the document\
    \ tree presentation of the above XML.\n\n# Processing XML in JSP\n\nBefore you\
    \ proceed with XML processing using JSP, you will need to copy the following XML\
    \ and XPath rated libraries into your `TomcatInstallationDirectory\\lib:`\n\n\
    +   - XercesImpl.jar: Download it from http://www.apache.org/dist/xerces/j/\n\
    - xalan.jar: Download it from http://xml.apache.org/xalan-j/index.html"
