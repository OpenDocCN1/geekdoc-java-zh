    <head>\n<title>Error Handling Example</title>\n</head>\n<body>\n%\n  // Throw\
    \ an exception to invoke the error page\n  int x = 1;\n  if (x == 1) {\n    throw\
    \ new RuntimeException(\"Error condition!!!\");\n  }\n%\n</body>\n</html>\n```\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_260_0.png)"
