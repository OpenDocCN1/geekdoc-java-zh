  md: "# Delete Cookies with JSP\n\nTo delete cookies is very simple. If you want\
    \ to delete a cookie, then you simply need to follow these three steps:\n\n+ \
    \  - Read an already existing cookie and store it in Cookie object.\n* Set cookie\
    \ age as zero using the setMaxAge() method to delete an existing cookie.\n* Add\
    \ this cookie back into the response header.\n\nExample\nFollowing example will\
    \ show you how to delete an existing cookie named \"first_name\" and when you\
    \ run main.jsp JSP next time, it will return null value for first_name.\n\n```\n\
    <html>\n<head>\n<title>Reading Cookies</title>\n</head>\n<body>\n<center>\n<h1>Reading\
    \ Cookies</h1>\n</center>\n</body>\n</html>\n\n<%\nCookie cookie = null;\nCookie[]\
    \ cookies = null;\n// Get an array of Cookies associated with this domain\ncookies\
    \ = request.getCookies();\nif(cookies != null) {\n  out.print(\"<h2> Found Cookies\
    \ Name and Value</h2>\\n  for (int i = 0; i < cookies.length; i++) {\n    cookie\
    \ = cookies[i];\n    if(cookie.getName().compareTo(\"first_name\") == 0) {\n \
    \     cookie.setMaxAge(0);\n      response.addCookie(cookie);\n      out.print(\"\
