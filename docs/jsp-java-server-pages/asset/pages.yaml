  md: '# JSTL SQL <sql:dateParam> Tag


    The <sql:dateParam> tag is used as a nested action for the <sql:query> and the
    <sql:update> tag to supply a date and time value for a value placeholder. If a
    null value is provided, the value is set to SQL NULL for the placeholder.


    # Attribute


    The <sql:dateParam> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---||

    | value | Value of the date parameter to set (java.util.Date) | No | Body |

    | type | DATE (date only), TIME (time only), or TIMESTAMP (date and time) | No
    | TIMESTAMP |


