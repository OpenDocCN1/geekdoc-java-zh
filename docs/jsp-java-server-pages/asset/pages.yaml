  md: '| 7 | **public String getValue()**<br>This method gets the value associated
    with the cookie. |

    | 8 | **public void setPath(String uri)**<br>This method sets the path to which
    this cookie applies. If you don''t specify a path, the cookie is returned for
    all URLs in the same directory as the current page as well as all subdirectories.
    |

    | 9 | **public String getPath()**<br>This method gets the path to which this cookie
    applies. |

    | 10 | **public void setSecure(boolean flag)**<br>This method sets the boolean
    value indicating whether the cookie should only be sent over encrypted (i.e.,
    SSL) connections. |

    | 11 | **public void setComment(String purpose)**<br>This method specifies a comment
    that describes a cookie''s purpose. The comment is useful if the browser presents
    the cookie to the user. |

    | 12 | **public String getComment()**<br>This method returns the comment describing
    the purpose of this cookie, or null if the cookie has no comment. |


    # # Setting Cookies with JSP


    Setting cookies with JSP involves three steps:


    **(1) Creating a Cookie object:** You call the Cookie constructor with a cookie
    name and a cookie value, both of which are strings.


    ```

    cookie cookie = new Cookie("key","value");

    ```


    Keep in mind, neither the name nor the value should contain white space or any
    of the following characters:


    ```

    [ ] ) = " " / ? @ : ;

    ```


    **(2) Setting the maximum age:** Use setMaxAge to specify how long (in seconds)
    the cookie should be valid. The following code will set up a cookie for 24 hours.


    ```

    cookie.setMaxAge(60*60*24);

    ```'
