  md: "# 29. JSP — Debugging\n\nIn this chapter, we will discuss Debugging a JSP.\
    \ It is always difficult testing/debugging a JSP and servlets. JSP and Servlets\
    \ tend to involve a large amount of client/server interaction, making errors likely\
    \ but hard to reproduce.\n\nThe following are a few hints and suggestions that\
    \ may aid you in your debugging.\n\n# Using System.out.println()\n\nSystem.out.println()\
    \ is easy to use as a marker to test whether a certain piece of code is being\
    \ executed or not. We can print variable values as well. Consider the following\
    \ additional points:\n\n+   * Since the System object is part of the Java objects,\
    \ it can be used everywhere without the need to install any extra classes. This\
    \ includes Servlets, JSP, RMI, EJB's, ordinary Beans and classes, and standalone\
    \ applications.\n* Compared to stopping at breakpoints, writing to System.out\
    \ doesn't interfere much with the normal execution flow of the application, which\
    \ makes it very valuable when the timing is crucial.\n\nFollowing is the syntax\
    \ to use System.out.println():\n\n```\nSystem.out.println(\"Debugging message\"\
    );\n```\n\nFollowing example how to use System.out.println():\n\n```\n<@taglib\
    \ prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>n<html>\n<head><title>System.out.println</title></head>\n\
    <body>\n<c:forEach var=\"counter\" begin=\"1\" end=\"10\" step=\"1\">\n<c:out\
    \ value=\"${counter-5}\"/><br>\n<% System.out.println(\"counter = \" + \npageContext.findAttribute(\"\
    counter\"); ); %>\n</c:forEach>\n</body>\n</html>\n```\n\nAccess the above JSP,\
    \ the browser will show the following result:\n\n```\n-4\n-3\n-2\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_264_0.png)"
  merge: -1
