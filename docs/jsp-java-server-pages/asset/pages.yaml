  md: '# Action


    The forward action terminates the action of the current page and forwards the
    request to another resource such as a static page, another JSP page, or a Java
    Servlet.


    Following is the syntax of the forward action:


    ```

    <jsp:forward page="Relative URL" />

    ```


    Following table lists the required attributes associated with the forward action:


    | Attribute | Description |

    | --- | --- |

    | page | Should consist of a relative URL of another resource such as a static
    page, another JSP page, or a Java Servlet. |


    # Example


    Let us reuse the following files (a) date.jsp and (b) main.jsp as follows:


    Following is the content of the date.jsp file:


    ```

    <p>

    Today''s date: <%= (new java.util.Date()).toLocaleString() %>

    </p>

    ```


    Following is the content of the main.jsp file:


    ```

    <html>

    <head>

    <title>The include Action Example</title>

