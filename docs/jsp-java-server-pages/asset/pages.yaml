    # The buffer Attribute


    The buffer attribute specifies the buffering characteristics for the server output
    response object.


    You may code a value of "none" to no buffering so that the servlet output is immediately
    directed to the response object or you may code a maximum buffer size in kilobytes,
    which directs the servlet to write to the buffer before writing to the response
    object.


    To direct the servlet to write the output directly to the response output object,
    use the following:


    ```

    <@ page buffer="none" %>

    ```


    Use the following to direct the servlet to write the output to a buffer of size
    not less than 8 kilobytes:


    ```

    <@ page buffer="8kb" %>

    ```


    # The autoFlush Attribute


    The autoFlush specifies whether buffered output should be flushed automatically
    when the buffer is filled, or whether an exception is raised to indicate the buffer
    overflow.


    A value of true (default) indicates automatic buffer flushing and a value of false
    throws an exception.


    The following directive causes the servlet to throw an exception when the servlet''s
    output is full:


    ```

    <@ page autoFlush="false" %>

    ```


    This directive causes the servlet to flush the output buffer when full:


    ```

    <@ page autoFlush="true" %>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_36_0.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Usually, the buffer and the autoFlush attributes are coded on a single page
    directive as follows:


    ```

    <@ page buffer="16kb" autoflush="true" %>

    ```


    # The contentType Attribute


    The contentType attribute sets the encoding for the JSP page and for the generated
    response page. The default content type is text/html, which is the standard content
    type for HTML pages.


    If you want to use XML from your JSP, use the following page directive:


    ```

    <@ page contentType="text/xml" %>

    ```


    The following statement directs the browser to render the generated page as HTML:


    ```

    <@ page contentType="text/html" %>

    ```


    The following directive sets the content type as a Microsoft Word document:


    ```

    <@ page contentType="application/msword" %>

    ```


    You can also specify the character encoding for the response. For example, if
    you wanted to specify the resulting page that is returned to the browser uses
    ISO Latin 1, you can use the following page directive:


    ```

    <@ page contentType="text/html;charset=ISO-8859-1" %>

    ```


    # The errorPage Attribute


    The errorPage attribute tells the JSP engine to display if there is an error while
    the current page runs. The value of the errorPage attribute is a relative URL.


    The following directive displays MyErrorPage.jsp when uncaught exceptions are
    thrown:


    ```

    <@ page errorPage="MyErrorPage.jsp" %>

    ```


    # The isErrorPage Attribute


    The isErrorPage attribute indicates that the current JSP can be used as the error
    page for another JSP.


    The value of isErrorPage is either true or false. The default value of the isErrorPage
    attribute is false.


    For example, the handleError.jsp sets the isErrorPage option to true because it
    is supposed to handle errors:


    ```

    <@ page isErrorPage="true" %>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# The extends attribute


    The extends attribute specifies a superclass that the generated servlet may extend.

    For example, the following directive directs the JSP translator to generate the
    servlet such that the servlet extends somePackage.SomeClass:


    ```

    <@ page extends="somePackage.SomeClass" %>

    ```


    # The import Attribute


    The import attribute serves the same function as, and behaves like, the Java import
    statement. The value for the import option is the name of the package you want
    to import.

    To import java.sql.*, use the following page directive:


    ```

    <@ page import="java.sql.*" %>

    ```


    To import multiple packages, you can separate them by comma as follows:

    By default, a container automatically imports java.lang.*, javax.servlet.*, javax.servlet.jsp.*,
    and javax.servlet.http.


    ```

    <@ page import="java.sql.*,java.util.*" %>

    ```


    # The info Attribute


    The info attribute lets you to provide a description of the JSP. The following
    is a coding example:


    ```

    <@ page info="This JSP Page Written By ZARA" %>

    ```


    # The isThreadSafe Attribute


    The isThreadSafe option marks a page as being thread-safe. By default, all JSPs
    are considered thread-safe. If you set the isThreadSafe option to false, the JSP
    engine ensures that only one thread is at a time executing your JSP.

    The following page directive sets the isThreadSafe option to false:


    ```

    <@ page isThreadSafe="false" %>

    ```


    # The language Attribute


    The language attribute indicates the programming language used in scripting the
    JSP.

    For example, because you usually use Java as the scripting language, your language
    option looks like:


    ```

    <@ page language="java" %>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# The session Attribute


    The session attribute indicates whether or not the JSP page uses HTTP sessions.
    A value of true means that the JSP page has a builtin session object and a value
    of false means that the JSP page cannot access the builtin session object.


    Following directly allows the JSP page to use any of the builtin object session
    methods such as session.getCreationTime() and session.getLastAccessTime():


    ```

    <@ page session="true" %>

    ```


    # The isIgnored Attribute


    The isIgnored attribute gives the ability to disable the evaluation of Expression
    Language (EL) expressions which have been introduced in JSP 2.0.


    The default value of the attribute is true, meaning that expressions, ${...},
    are evaluated as dictated by the JSP specification. If the attribute is set to
    false, then expressions are not evaluated but rather treated as static text.


    Following directive sets an expression not to be evaluated:


    ```

    <@ page isIgnored="false" %>

    ```


    # The isScriptingEnabled Attribute


    The isScriptingEnabled attribute determines if the scripting elements are allowed
    for use.


    The default value (true) enables scriptlets, expressions, and declarations. If
    the attribute''s value is set to false, a translation-time error will be raised
    if the JSP uses scriptlets, expressions (non-EL), or declarations.


    The attribute''s value can be set to false if you want to restrict the usage of
    scriptlets, expressions (non-EL), or declarations:


    ```

    <@ page isScriptingEnabled="false" %>

    ```


    # The include Directive


    The include directive is used to include a file during the translation phase.
    This directive tells the container to merge the content of other external files
    with the current JSP during the translation phase. You may code the include directives
    anywhere in your JSP page.


    The general usage of this directive is as follows:


    ```

    <@ include file="relative url" >

    ```


    The filename in the include directive is actually a relative URL. If you just
    specify a filename with no path, the JSP compiler assumes that the file is in
    the same directory as your JSP.


    You can write the XML equivalent of the above syntax as follows:


    ![](img/5626302a090fb89f52cde01d391f8bdc_39_0.png)'
