  md: "The compilation process involves three steps:\n\n+   - Parsing the JSP.\n-\
    \ Turning the JSP into a servlet.\n- Compiling the servlet.\n\n# JSP Initialization\n\
    \nWhen a container loads a JSP it invokes the jspInit() method before servicing\
    \ any requests. If you need to perform JSP-specific initialization, override the\
    \ jspInit() method:\n\n```\npublic void jspInit(){\n    // Initialization code;\n\
    }\n```\n\nTypically, initialization is performed only once and as with the servlet\
    \ init method, you generally initialize database connections, open files, and\
    \ create lookup tables in the JSP method.\n\n# JSP Execution\n\nThis phase of\
    \ the JSP life cycle represents all interactions with requests until the JSP is\
    \ destroyed.\n\nWhenever a browser requests a JSP and the page has been loaded\
    \ and initialized, the JSP engine invokes the _jspService() method in the JSP.\n\
    \nThe _jspService() method takes an HttpServletRequest and an HttpServletResponse\
    \ as its parameters as follows:\n\n```\nvoid _jspService(HttpServletRequest request,\n\
    \    HttpServletResponse response)\n{\n    // Service handling code...\n}\n```\n\
    \nThe _jspService() method of a JSP is invoked on request basis. This is responsible\
    \ for generating responses for that request and this method is also responsible\
    \ for generating responses to all seven of the HTTP methods, i.e., GET, POST,\
    \ DELETE, etc.\n\n# JSP Cleanup\n\nThe destruction phase of the JSP life cycle\
    \ represents when a JSP is being removed from use by a container.\n\nThe jspDestroy()\
    \ method is the JSP equivalent of the destroy method for servlets. Override jspDestroy()\
    \ when you need to perform any cleanup, as releasing database connections or opening\
    \ files.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_20_0.png)"
