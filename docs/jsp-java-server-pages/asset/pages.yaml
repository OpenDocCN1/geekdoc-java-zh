  md: '# 27. JSP — Expression Language (EL)


    JSP Expression Language (EL) makes it possible to easily access application data
    stored in JavaBeans. JSP EL allows you to create expressions with (a) arithmetic
    and (b) logical. Within a EL expression, you can use integers, floating point
    numbers, strings, the built-in constants true and false for boolean values, and
    null.


    # Simple Syntax


    Typically, when you specify an attribute value in a JSP tag, you simply use a
    string. For example:


    ```

    <jsp:setProperty name="box" property="perimeter" value="100"/>

    ```


    JSP EL allows you to specify an expression for any of these attribute values.
    A simple syntax for JSP EL is as follows:


    ```

    $${expr}

    ```


    Here expr specifies the expression itself. The most common operators in JSP EL
    are and []. These two operators allow you to access various attributes of Java
    Beans and built-in JSP objects.


    For example, the above syntax <jsp:setProperty> tag can be written with an expression
    like:


    ```

    <jsp:setProperty name="box" property="perimeter" value="$${box.width+2*box.height}"/>

    ```


    When the JSP compiler compiles the ${} form in an attribute, it generates code
    to evaluate the expression and substitutes the value of expression.


    You can also use the JSP expressions within template text for a tag. For example,
    the <jsp:text> tag inserts its contents within the body of the JSP. The following
    <jsp:text> declaration inserts <h1>Hello JSP!</h1> into the JSP output:


    ```

    <jsp:text>

    <h1>Hello JSP!</h1>

    </jsp:text>

    ```'
