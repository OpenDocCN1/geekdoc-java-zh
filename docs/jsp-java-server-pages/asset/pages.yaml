  md: 'In this chapter, we will discuss the Implicit Objects in JSP. These objecs
    are the Java objects that the JSP Container makes available to the developers
    in each page and the developer can call them directly without being explicitly
    declared. JSP Implicit Objects are also called pre-defined variables.


    Following table lists the nine Implicit Objects that JSP supports:


    | Object | Description |

    | --- | --- |

    | request | This is the HttpServletRequest object associated with the request.
    |

    | response | This is the HttpServletResponse object associated with the client.
    |

    | out | This is the PrintWriter object used to send output to the client. |

    | session | This is the HttpSession object associated with the request. |

    | application | This is the ServletContext object associated with application
    context. |

    | config | This is the ServletConfig object associated with the page. |

    | pageContext | This encapsulates use of server-specific features like higher
    performance Jspriters. |

    | page | This is simply a synonym for this, and is used to call the methods defined
    by the translated servlet class. |

    | Exception | The Exception object allows the exception data to be accessed by
    designated JSP. |


    # The request Object


    The request object is an instance of a javax.servlet.http.HttpServletRequest object.
    Each time a client requests a page JSP engine creates a new object to represent
    that request.


    ![](img/5626302a090fb89f52cde01d391f8bdc_54_0.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'The request object provides methods to get the HTTP header information including
    data, cookies, HTTP methods etc.


    We can cover a complete set of methods associated with the request object in a
    subsequent chapter: JSP - Client Request.


    # The response Object


    The response object is an instance of a javax.servlet.http.HttpServletResponse
    object. As the server creates the request object, it also creates an object to
    represent the response to the client.


    The response object also defines the interfaces that deal dealing with new HTTP
    headers. Through this the JSP programmer can add new cookies or date stamps, HTTP
    status codes, etc.


    We will cover a complete set of methods associated with the response object in
    a subsequent chapter: JSP - Server Response.


    # The out Object


    The out implicit is an instance of a javax.servlet.jsp.JspWriter object and is
    used to send content in a response.


    The initial PspWriter is instantiated differently depending on whether the page
    is buffered or not. Buffering can be easily turned off using the buffered=''false''
    attribute of the page directive.


    The JspWriter contains most of the same methods as the java.io.PrintWriter class.
    However, PspWriter has some additional methods to deal with buffering. Unlike
    the PrintWriter object, JspWriter throws IOExceptions.


    Following table lists the important methods that we will use to write boolean
    char, int, double, String, etc.


    | Method | Description |

    | --- | --- |

    | out.print(dataType dt) | Print a data type value |

    | out.println(dataType dt) | Print a data type value then terminate the line with
    new line. |

    | out.flush() | Flush the stream. |


    # The session Object


    The session object is an instance of javax.servlet.http.HttpSession and behaves
    exactly the same way that session objects behave under Java Servlets.


    The session object is used to track client session between client requests. We
    will cover the complete usage of session object in a subsequent chapter: JSP -
    Session Tracking.


    ![](img/5626302a090fb89f52cde01d391f8bdc_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# The application Object


    The application object is direct wrapper around the ServletContext object for
    the generated Servlet and in reality an instance of a javax.servlet.ServletContext
    object.


    This is a representation of the JSP page through its entire lifecycle. This object
    is created when the JSP page is initialized and is removed when the JSP page is
    removed by the jspDestroy() method.


    By adding an attribute to application, you can ensure that all JSP files that
    make up your web application have access to it.


    We will check the use of Application Object in JSP - Hits Counter chapter.


    # The config Object


    The config object is an instantiation of javax.servlet.ServletConfig and is a
    direct wrapper around the ServletConfig object for the generated servlet.


    This object allows the JSP programmer to access the Servlet or JSP engine initialization
    parameters such as the paths or file locations etc.


    The following config method is the only one you might use, and its usage is trivial:


    ```

    config.getServletName();

    ```


    This returns the servlet name, which is the string contained in the <servlet-name>
    element defined in the WEB-INF\web.xml file.


    # The pageContext Object


    The pageContext object is an instance of a javax.servlet.PageContext object. The
    pageContext object is used to represent the JSP page.


    This object is intended as a means to access information about the page while
    avoiding some of the implementation details.


    This object stores references to the request and response objects for each request.
    The application, config, session, and out objects are derived by accessing attributes
    of this object.


    The PageContext class defines several fields, including PAGE_SCOPE, REQUEST_SCOPE,
    SESSION_SCOPE, and APPLICATION_SCOPE, which identify the scopes. It supports more
    than 40 methods, about half of which are inherited from the javax.servlet.jsp.JspContext
    class.


    One of the important methods is removeAttribute. This method accepts one or two
    arguments. For example, pageContext.removeAttribute("attrName") removes the attribute
    from all scopes, while the following code removes it from the page scope:


    ```

    pageContext.removeAttribute("attrName", PAGE_SCOPE);

    ```


    The use of pageContext can be checked in JSP - File Uploading chapter.


    ![](img/5626302a090fb89f52cde01d391f8bdc_56_0.png)'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# The page Object


    This object is an actual reference to the instance of the page. It can be thought
    of as an object that represents the entire JSP page.


    The page object is really a direct synonym for the this object.


    # The exception Object


    The exception object is a wrapper containing the exception thrown from the previous
    page. It is typically used to generate an appropriate response to the error condition.


    We will cover the complete usage of this object in JSP - Exception Handling chapter.'
  merge: -1
