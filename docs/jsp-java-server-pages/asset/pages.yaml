    \ Info:</h3>\n\n<c:set var=\"xmltext\">\n<books>\n  <book>\n  <name>Padam History</name>\n\
    \  <author>ZARA</author>\n  <price>100</price>\n  </book>\n  <book>\n  <name>Great\
    \ Mistry</name>\n  <author>NUHA</author>\n  <price>2000</price>\n  </book>\n</books>\n\
    </c:set>\n\n<x:parse xml=\"${xmltext}\" var=\"output\"/>\n<x:when select=\"${output/book/author\
    \ = 'ZARA'>nBook is written by ZARA\n</x:when>\n<x:when select=\"${output/book/author\
    \ = 'NUHA'>\nBook is written by NUHA\n</x:when>\n<x:otherwise>\nUnknown author.\n\
    </x:otherwise>\n</x:choose>\n```"
