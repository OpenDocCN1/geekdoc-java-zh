- img_proc: true
  md: 'Let us now discuss the jsp:setProperty and the jsp:getProperty actions before
    giving a valid example related to these actions.


    # The <jsp:setProperty> Action


    The setProperty action sets the properties of a Bean. The Bean must have been
    previously defined before this action. There are two basic ways to use the setProperty
    action:


    You can use jsp:setProperty after, but outside of a jsp:useBean element, as given
    below:


    ```

    <jsp:useBean id="myName" ... />

    ...

    <jsp:setProperty name="myName" property="someProperty" .../>

    ```


    In this case, the jsp:setProperty is executed regardless of whether a new bean
    was instantiated or an existing bean was found.


    A second context in which jsp:setProperty can appear inside the body of a jsp:useBean
    element, as given below:


    ```

    <jsp:useBean id="myName" ... />


    <jsp:setProperty name="myName" property="someProperty" .../>

    </jsp:useBean>

    ```


    Here, the jsp:setProperty is executed only if a new object was instantiated, not
    if an existing one was found.


    Following table lists out the attributes associated with the setProperty action:


    | Attribute | Description |

    | --- | --- |

    | name | Designates the bean the property of which will be set. The Bean must
    have been previously defined. |

    | property | Indicates the property you want to set. A value of "*" means that
    all request parameters whose name match bean names will be passed to the appropriate
    setter methods. |

    | value | The value that is to be assigned to the given property. The parameter''s
    value is null, or the parameter does not exist, the setProperty action is ignored.
    |'
  merge: -1
  pgno: 47
- img_proc: true
  md: "| param | The param attribute is the name of the request parameter whose value\
    \ the property is to receive. You can't use both value and param, but it is permissible\
