    # 30. JSP — Security


    Java Pages and servlets make several mechanisms available to Web developers to
    secure applications. Resources are protected declaratively by identifying them
    in the application deployment descriptor and assigning a role to them.


    Levels of authentication are available, ranging from basic authentication using
    identifiers and passwords to sophisticated authentication using certificates.


    # Role Based Authentication


    The authentication mechanism in the servlet specification uses a technique called
    role-based security. The idea is rather than restricting resources at the user
    level, you create roles and restrict resources by role.


    You can define different roles in tomcat-users.xml, which is located off Tomcat''s
    home directory in conf. An example of this file is shown below:


    ```

    <?xml version=''1.0'' encoding=''utf-8''?>

    <tomcat-users>

    <role rolename="tomcat" />

    <role rolename="role1" />

    <role rolename="manager" />

    <role rolename="admin" />

    <user username="tomcat" password="tomcat" roles="tomcat" />

    <user username="role1" password="tomcat" roles="role1" />

    <user username="both" password="tomcat" roles="tomcat,role1" />

    <user username="admin" password="secret" roles="admin,manager" />

    </tomcat-users>

    ```


    This file defines a simple mapping between username, password, and role. Notice
    that a given user may have multiple roles; for example, username="both" is in
    the "tomcat" role and the "role1".


    Once you have identified and defined different roles, role-based security restrictions
    can be placed on different Web Application resources by using the <security-constraint>
    element in web.xml file available in the WEB-INF directory.


    ![](img/5626302a090fb89f52cde01d391f8bdc_269_0.png)'
