    \ type\n  response.setContentType(\"text/html\");\n  // Set spanish language code.\n\
    \  response.setHeader(\"Content-Language\", \"es\");\n  String title = \"En Español\"\
    ;\n%>\n<html>\n<head>\n<title><% out.print(title); %></title>\n</head>\n<body>\n\
    <center>\n<h1><% out.print(title); %></h</h1>\n</center>\n<div align=\"center\"\
    >\n<p>En Español</p>\n<p>¡Hola Mundo!</p>\n</div>\n</body>\n</html>\n```\n\n##\
    \ 区域特定日期\n\n你可以使用 java.text.DateFormat 类及其静态方法 getDateTimeInstance() 来格式化特定于区域的日期和时间。以下示例展示了如何格式化特定区域的日期：\n\
    \n```jsp\n<@ page import=\"java.io.*,java.util.Locale\" %>\n<@ page import=\"\
    javax.servlet.*,javax.servlet.http.*\" %>\n<@ page import=\"java.text.DateFormat,java.util.Date\"\
    \ %>\n\n<%\nString title = \"Locale Specific Dates\";\n//Get the client's Locale\n\
    Locale locale = request.getLocale();\nString date = DateFormat.getTimeInstance(\n\
    DateFormat.FULL,\nDateFormat.SHORT,\nlocale).format(new Date());\n%>\n\n<html>\n\
    <head>\n<title><% out.print(title); %></title>\n</head>\n<body>\n<center>\n<h1><%\
    \ out.print(title); %></h</h1>\n</center>\n<div align=\"center\">\n<p>Local Date:\
    \ <% out.print(date); %></p>\n</div>\n</body>\n</html>\n```\n\n## 区域特定货币\n\n你可以使用\
    \ java.text.NumberFormat 类及其静态方法 getCurrencyInstance() 将数字（如 long 或 double 类型）格式化为特定区域的货币。以下示例展示了如何格式化特定于区域的货币：\n\
    \n```jsp\n<@page import=\"java.io.*, java.util.Locale %>\n<@page import=\"javax.servlet.*,javax.servlet.http.*\
    \ %>\n<@page import=\"java.text.NumberFormat,java.util.Date %>\n\n<%\nString title\
