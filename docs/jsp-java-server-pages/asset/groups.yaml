    \ 30 |\n\n# 24. JSP – XML Data\n\nWhen you send the XML data via HTTP, it makes\
    \ sense to use JSP to handle incoming outgoing XML documents; for example, RSS\
    \ documents. As an XML document is merely a bunch of text, creating one through\
    \ JSP is much easier than creating an HTML document.\n\n# Sending XML from a JSP\n\
    \nYou can send the XML content using JSPs the same way you send HTML. The only\
    \ difference is that you must set the content type of page to text/xml. To set\
    \ the content type, use the `<@page%>` tag, like this:\n\n```jsp\n<%@ page contentType=\"\
    text/xml\" %>\n```\n\nFollowing example will how to show XML content to the browser:\n\
    \n```jsp\n<%@ page contentType=\"text/xml\" %>\n\n<books>\n  <book>\n    <name>Padam\
    \ History</name>\n    <author>ZARA</author>\n    <price>100</price>\n  </book>\n\
    </books>\n```\n\nAccess the above XML using different browsers to see the tree\
    \ presentation of the above XML.\n\n# Processing XML in JSP\n\nBefore you proceed\
    \ with XML processing using JSP, you will need to copy the following XML and XPath\
    \ libraries into your `TomcatDirectory\\lib`:\n\n- XercesImpl.jar: Download it\
    \ from http://www.apache.org/dist/xerces/j\n- xalan.jar: Download it from http://xml.apache.org/xalan-j/\n\
    \nLet us put the following content in books.xml:\n\n```xml\n<books>\n<book>\n\
    \  <name>Padam History</name>\n  <author>ZARA</author>\n  <price>100</price>\n\
    </book>\n<book>\n  <name>Great Mistry</name>\n  <author>NUHA</author>\n  <price>2000</price>\n\
    </book>\n</books>\n```\n\nTry the following main.jsp, keeping in the same directory:\n\
    \n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n\
