    \ : ${string2}</p>\n</body>\n</html>\n```\n\nYou will receive the following result:\n\
    \nFinal sub string : This\n\n# JSTL fn:toLowerCase() Function\n\nThe fn:toLowerCase()\
    \ function converts all the characters of a string to lowercase.\n\n# Syntax\n\
    \nThe fn:toLowerCase() function has the following syntax:\n\n```\njava.lang.String\
    \ toLowerCase(java.lang.String)\n```\n\n# Example:\n\nFollowing is the example\
    \ to explain the functionality of the fn:toLowerCase() function:\n\n```\n<@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/functions\" prefix=\"fn\" %>\n<html>\n<head>\n<title>Using\
