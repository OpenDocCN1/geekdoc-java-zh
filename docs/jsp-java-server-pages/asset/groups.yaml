    \n# 创建记录\n\n我们将在 Student 表中创建若干记录：\n\n```sql\nmysql> INSERT INTO Students\nVALUES\
    \ (100, 'Zara', 'Ali', '2002/05/16');\nQuery OK, 1 row affected (0.05 sec)\n```\n\
    \n```sql\nmysql> INSERT INTO Students\nVALUES (101, 'Mahnaz', 'Fatma', '1978/11/28');\n\
    Query OK, 1 row affected (0.00 sec)\n```\n\n```sql\nmysql> INSERT INTO Students\n\
    VALUES (102, 'Zaid', 'Khan', '1980/10/10');\nQuery OK, 1 row affected (0.00 sec)\n\
    ```\n\n```sql\nmysql> INSERT INTO Students\nVALUES (103, 'Sumit', 'Mittal', '1971/05/08');\n\
    Query OK, 1 row affected (0.00 sec)\n```\n\n现在让我们来写一个 JSP，使用 `<sql:update>` 标签配合\
    \ `<sql:transaction>` 标签来执行 SQL UPDATE 语句。这里 `<sql:transaction>` 标签内部的代码要么完全执行要么不执行：\n\
    \n```jsp\n<%@ page import=\"java.io.*,java.util.*,java.sql.*\" %>\n<%@ page import=\"\
    javax.servlet.*,javax.servlet.*\" %>\n<%@ page import=\"java.util.Date,java.text.*\"\
    \ %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@\
    \ taglib uri=\"http://java.sun.com/jsp/jstl/sql\" prefix=\"sql\" %>\n\n<html>\n\
