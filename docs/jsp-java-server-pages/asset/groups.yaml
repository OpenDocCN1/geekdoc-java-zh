    <html>\n<head>\n<title>c:forTokens Tag Example</title>\n</head>\n<body>\n<c:forTokens\
    \ items=\"Zara,nuha,roshy\" delims=\",\" var=\"name\">\n<c:out value=\"${name}\"\
    /></p>\n</c:forTokens>\n</body>\n</html>\n```\n\nThe above code will produce the\
    \ following result:\n\n| Zara |\n| nuha |\n| roshy |\n"
