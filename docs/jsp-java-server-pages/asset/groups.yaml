- md: "\n# 12. JSP – Form Processing\n\nIn this chapter, we will discuss Form Processing\
    \ in JSP. You must have come across many situations when you need to pass some\
    \ information from your browser to the web server and ultimately to your backend\
    \ program. The browser uses two methods to pass this information to the web server.\
    \ These methods are the GET Method and the POST Method.\n\n## The Methods in Form\
    \ Processing\n\nLet us now discuss the methods in Form Processing.\n\n### GET\
    \ method\n\nThe GET method sends the encoded user information appended to the\
    \ page request. The page and the encoded information are separated by the ? character\
    \ as follows:\n\n```\nhttp://www.test.com/hello?key1=value1&key2=value2\n```\n\
    \nThe GET method is the default method to pass information from the browser to\
    \ the web server and it produces a long string that appears in your browser's\
    \ Location:box. It is recommended that the GET method is better not used if you\
    \ have password or sensitive information to pass to the server.\n\nThe GET method\
    \ has size limit: only 1024 characters can be in a request string.\n\nThis information\
    \ is passed using QUERY_STRING header and will be accessible through QUERY_STRING\
    \ environment variable which can be handled using getQueryString() and getParameter()\
    \ methods of request object.\n\n### POST method\n\nA generally more reliable method\
    \ of passing information to a backend program is the POST method.\n\nThis method\
    \ packages the information in exactly the same way as the GET method, but instead\
    \ of sending it as a string after a ? in the URL it sends as a separate message.\
    \ This message comes to the backend program in the form of the standard input\
    \ which you can parse and use for your processing.\n\nJSP handles this type of\
    \ requests using getParameter() to read simple parameters and getInputStream()\
    \ to read binary data stream coming from the client.\n\n### Reading Form Data\
    \ using JSP\n\nJSP handles form parsing automatically using the following methods\
    \ depending on the situation:\n\n- getParameter(): You call request.getParameter()\
    \ method to get the value of a form parameter.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_77_0.png)\n\
    \n- getParameterValues(): Call this method if the parameter appears more than\
    \ once and returns multiple values, for example checkbox.\n\n- getParameterNames():\
    \ Call this method if you want a complete list of parameters in the current request.\n\
    \n- getInputStream(): Call this method to read binary data stream coming from\
    \ the client.\n\n### GET Method Example Using URL\n\nThe following URL will pass\
    \ two values to HelloForm program using GET method.\n\n```\nhttp://localhost:8080/main.jsp?first_name=ZARA&last_name=ALI\n\
    ```\n\nBelow is the main.jsp JSP program to handle input given by web browser.\
    \ We are going to use the getParameter() method which makes it very easy to access\
    \ the passed information:\n\n```html\n<html>\n<head>\n<title>Using GET Method\
    \ to Read Form Data</title>\n</head>\n<body>\n<center>\n<h1>Using GET Method to\
    \ Read Form Data</h1>\n<ul>\n<li><p><b>First Name:</b></p>\n<% request.getParameter(\"\
    first_name\") %>\n</p></li>\n<li><p><b>Last Name:</b></p>\n<% request.getParameter(\"\
    last_name\") %>\n</p></li>\n</ul>\n</center>\n</body>\n</html>\n```\n\nNow type\
    \ http://localhost:8080/main.jsp?first_name=ZARA&last_name=ALI in your browser's\
    \ Location:box. This will generate the following result:\n\n> Using GET Method\
    \ to Read Form Data\n* First Name: ZARA\n* Last Name: ALI\n\n### GET Method Example\
    \ Using Form\n\nFollowing is an example that passes two values using the HTML\
    \ FORM and the submit button. Here are going to use the same JSP main.jsp to handle\
    \ this input.\n\n```html\n<html>\n<body>\n<form action=\"main.jsp\" method=\"\
    GET\">\nFirst Name:<input type=\"text\" name=\"first_name\">\n<br />\nLast Name:\
    \ <input type=\"text\" name=\"last_name\" />\n<input type=\"submit\" value=\"\
    Submit\" />\n</form>\n</body>\n</html>\n```\n\nKeep this HTML in a file Hello.htm\
    \ and put it in <Tomcat-installation-directory>/webapps/ROOT directory. When you\
    \ access http://localhost:8080/Hello.htm, you will receive the following output:\n\
    \n| First Name: | | |\n| Last Name: | Submit |\n\nTry to enter the First Name\
    \ and the Last Name and then click the submit button to see the result on your\
    \ local machine where tomcat is running. Based on the input provided, it will\
    \ generate similar result as mentioned in the above example.\n\n### POST Method\
    \ Example Using Form\n\nLet us do a little modification in the above JSP to handle\
    \ both the GET and the POST method. Using the main.jsp JSP program to handle the\
    \ input given by web browser using the GET or the POST methods.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_79_0.png)\n\
    \nInfact there is no change in the above JSP because the only way of passing parameters\
    \ is changed and no binary data is being passed to the JSP program. File handling\
    \ related concepts will be explained in sapate chapter where we need to read the\
    \ binary data stream.\n\n```html\n<html>\n<head>\n<title>Using GET and POST Method\
    \ to Read Form Data</title>\n</head>\n<body>\n<center>\n<h1>Using GET Method to\
    \ Read Form Data</h1>\n<ul>\n<li><p>bFirst Name:</b>\n<%= request.getParameter(\"\
    first_name\") %>\n</p></li\n<li><p>bLast Name:</b>\n<%= request.getParameter(\"\
    last_name\") %>\n</p></li\n</ul>\n</center>\n</body>\n</html>\n```\n\nFollowing\
    \ is the content of Hello.htm:\n\n```html\n<html>\n<body>\n<form action=\"main.jsp\"\
    \ method=\"POST\">\nFirst Name: <input type=\"text\" name=\"first_name\">\n<br\
    \ />\nLast Name: <input type=\"text\" name=\"last_name\" />\n<input type=\"submit\"\
    \ value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\nLet us now keep main.jsp\
    \ and hello.htm in <Tomcat-installation-directory>/webapps/ROOT/. When you access\
    \ http://localhost:8080/Hello.htm, you will receive the following output.\n\n\
    ![](img/5626302a090fb89f52cde01d391f8bdc_80_0.png)\n\n| First Name: | | |\n| Last\
    \ Name: | Submit |\n\nTry to enter the First Name and the Last Name and click\
    \ the submit button to see the result on your local machine where tomcat is running.\
    \ Based on the input provided, you will receive similar results as in the above.\n\
    \n### Passing Checkbox Data to JSP\n\nCheckboxes are used when more than one option\
    \ is required to be selected. Following is an example HTML code, Check.htm, for\
    \ a form with two checkboxes\n\n```html\n<html>\n<body>\n<form action=\"main.jsp\"\
    \ method=\"POST\" target=\"_blank\">\n<input type=\"checkbox\" name=\"maths\"\
    \ checked=\"checked\" /> Maths\n<input type=\"checkbox\" name=\"physics\" /> Physics\n\
    <input type=\"checkbox\" name=\"chemistry\" checked=\"checked\" /> Chemistry\n\
    <input type=\"submit\" value=\"Select Subject\" />\n</form>\n</body>\n</html>\n\
    ```\n\nThe above code will generate the following result:\n\n- Maths\n- Physics\n\
    - Select Subject\n\nFollowing is main.jsp JSP program to handle the input given\
    \ by the web browser for checkbox button.\n\n```html\n<html>\n<head>\n<title>Reading\
    \ Checkbox Data</title>\n</head>\n<body>\n<center>\n<h1>Reading Checkbox Data</h1>\n\
    <ul>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_81_0.png)\n\n```html\n<html>\n\
    <body>\n<li><p>bMaths Flag:</b></p>\n<%= request.getParameter(\"maths\") %>\n\
    </p></li\n<li><p>bPhysics Flag:</b></p>\n<%= request.getParameter(\"physics\"\
    ) %>\n</p></li\n<li><p>bChemistry Flag:</b></p>\n<%= request.getParameter(\"chemistry\"\
    ) %>\n</p></li\n</ul>\n</body>\n</html>\n```\n\nThe above program will generate\
    \ the following result:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_82_0.png)\n\
    \n### Reading All Form Parameters\n\nFollowing is a generic example which uses\
    \ getParameterNames() method of HttpServletRequest to read all the available form\
    \ parameters. This method returns an Enumeration that contains the parameter names\
    \ in an unspecified order.\n\nOnce we have an Enumeration, we can loop down the\
    \ Enumeration in the standard manner, using hasMoreElements() method to determine\
    \ when to stop and using nextElement() method to get each parameter name.\n\n\
    ```jsp\n<%@ page import=\"java.*,java.util.* %>\n<html>\n<head>\n<title>HTTP Header\
    \ Request Example</title>\n</head>\n<body>\n<center>\n<h2>HTTP Header Request\
    \ Example</h2>\n<table width=\"100%\" border=\"1\" align=\"center\">\n<tr bgcolor=\"\
    #949494\">\n<th>Param Name</th><th>Param Value(s)</th>\n</tr>\n<%\nEnumeration\
    \ paramNames = request.getParameterNames();\n\nwhile(paramNames.hasMoreElements())\
    \ {\n  String paramName = (String)paramNames.nextElement();\n  out.print(\"<tr><td>\"\
    \ + paramName + \"</td>\\n\");\n  String paramValue = request.getHeader(paramName);\n\
    \  out.println(\"<td>\" + paramValue + \"</td></tr>\\n\");\n}\n%>\n</table>\n\
    </center>\n</body>\n</html>\n```\n\nFollowing is the content of Hello.htm:\n\n\
    ```html\n<html>\n<body>\n<form action=\"main.jsp\" method=\"POST\" target=\"_blank\"\
    >\n<input type=\"checkbox\" name=\"maths\" checked=\"checked\" /> Maths\n<input\
    \ type=\"checkbox\" name=\"physics\" /> Physics\n<input type=\"checkbox\" name=\"\
    chemistry\" checked=\"checked\" /> Chem\n<input type=\"submit\" name=\"Select\
    \ Subject\" />\n</form>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_83_0.png)\n"
