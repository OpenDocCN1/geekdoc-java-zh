- md: "\nLet us keep the code in CurrentDate.jsp and then call this JSP using the\
    \ URL http://localhost:8080/CurrentDate.jsp. You will receive the following result:\n\
    \nDisplay Current Date & Time\n\nMon Jun 21 21:46:49 GMT+04:00 2010\n\nRefresh\
    \ the page with the URL http://localhost:8080/CurrentDate.jsp. You will find difference\
    \ in seconds everytime you would refresh.\n\n## Date Comparison\n\nAs discussed\
    \ in the previous sections, you can use all the available Java methods in your\
    \ JSP scripts. If you need to compare two dates, consider the following methods:\n\
    \n- You can use getTime() method to obtain the number of milliseconds that have\
    \ elapsed since midnight, January 1, 1970, for both objects and then compare these\
    \ two values.\n- You can use the methods before(), after(), and equals() because\
    \ the 12th of the month comes before the 18th; for example, new Date(99, 2, 18)\
    \ returns true.\n- You can use the compareTo() method; this method is defined\
    \ by the Comparable interface and implemented by Date.\n\n## Date Formatting using\
    \ SimpleDateFormat\n\nSimpleDateFormat is a concrete class for formatting and\
    \ parsing dates in a locale-sensitive manner. SimpleDateFormat allows you to start\
    \ by choosing any user-defined patterns for date-time formatting.\n\nLet modify\
    \ the above example as follows:\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*\"\
    \ %>\n<%@ page import=\"javax.servlet.*,java.text.*\" %>\n<html>\n<head>\n<title>Display\
    \ Current Date & Time</title>\n</head>\n<body>\n<center>\n<h1>Display Current\
    \ Date & Time</h1>h1>\n</center>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_112_0.png)\n\
    \n```jsp\n<%\nDate dNow = new Date( );\nSimpleDateFormat ft = new SimpleDateFormat(\"\
    yyyy.MM.dd 'at' hh:mm:ss zzz\");\nout.print(\"<h2 align=\\\"center\\\">\" + ft.format(dNow)\
    \ + \"</h2>\");\n%>\n</body>\n</html>\n```\n\nCompile the above servlet once again\
    \ and then call this servlet using the URL http://localhost:8080/Current. You\
    \ will receive the following result:\n\n## Display Current Date & Time\n\nMon\
    \ 2010.06.21 at 10:06:44 PM GMT+04:00\n\n## SimpleDateFormat Format Codes\n\n\
    To specify the format, use a time pattern string. In this pattern, all ASCII letters\
    \ are reserved as pattern letters, which are defined as the following:\n\n| Character\
    \ | Description | Example |\n| --- | --- | --- |\n| G | Era designator | AD |\n\
    | y | Year in four digits | 2001 |\n| M | Month in year | July or 07 |\n| d |\
    \ Day in month | 10 |\n| h | Hour in A.M./P.M. (1~12) | 12 |\n| H | Hour in day\
    \ (0~23) | 22 |\n| m | Minute in hour | 30 |\n| S | Second in minute | 55 |\n\
    | s | Millisecond | 234 |\n| E | Day in week | Tuesday |\n| D | Day in year |\
    \ 360 |\n| F | Day of week in month | 2 (second Wed. in July) |\n| w | Week in\
    \ year | 40 |\n| W | Week in month | 1 |\n| a | A.M./P.M. marker | PM |\n| k |\
    \ Hour in day (1~24) | 24 |\n| K | Hour in A.M./P.M. (0~11) | 10 |\n| z | Time\
    \ zone | Eastern Standard Time |\n| ' | Escape for text | Delimiter |\n| \" |\
    \ Single quote | ' |\n\nFor a complete list of constant available methods to manipulate\
    \ date, you can refer to the standard Java documentation.\n\n## 18. JSP – Page\
    \ Redirecting\n\nIn this chapter, we will discuss page redirection with JSP. Page\
    \ redirection is generally used when a document moves to a new location and we\
    \ need to send the client to this new location. This can be because of load balancing,\
    \ or for randomization.\n\nThe simplest way of redirecting to another page is\
    \ using sendRedirect() method of response. Following is the signature of this\
    \ method:\n\n```java\npublic void sendRedirect(String location) throws IOException\n\
    ```\n\nThis method sends back the response to the browser along with status code.\
    \ You can also use setStatus() and setHeader() methods together to achieve the\
    \ same redirection:\n\n```jsp\n...\nString site = \"http://www.newpage.com\";\n\
    response.setStatus(response.SC_MOVED);\nresponse.setHeader(\"Location\", site);\n\
    ...\n```\n\n### Example\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*\" %>\n\
    <html>\n<head>\n<title>Page Redirection</title>\n</head>\n<body>\n<center>\n<h1>Page\
    \ Redirection</h1>\n</center>\n<%\n// New location\nString site = \"http://www.photofunto.com\"\
    ;\nresponse.setStatus(response.SC_MOVED);\nresponse.setHeader(\"Location\", site);\n\
    %>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_115_0.png)\n\
    \n## 19. JSP – Hits Counter\n\nIn this chapter, we will discuss Hits Counter in\
    \ JSP. A hit counter tells you about the number of visits on a particular page.\
    \ Usually you attach hit counter with your index.jsp page assuming land on home\
    \ page.\n\nTo implement a hit counter you can make use of Application Implicit\
    \ object and associated methods getAttribute() and setAttribute(). This object\
    \ is representation of the JSP page through its entire lifecycle. This object\
    \ is created when the JSP page is initialized and will be removed by destroy()\
    \ method.\n\nFollowing is the syntax to set a variable at application level:\n\
    \n```java\napplication.setAttribute(String Key, Object Value);\n```\n\nYou can\
    \ use the above method to set hit counter variable and to reset the same variable.\
    \ Following is the method to read the variable:\n\n```java\napplication.getAttribute(String\
    \ Key);\n```\n\nEvery time a user accesses your page, you can read the current\
    \ value of the hit counter and increase it by one and again set it for future\
    \ use.\n\n### Example\n\nThis example shows how you can use JSP to count the total\
    \ number of hits on a particular page. If you want to count the total number of\
    \ hits of your website then you will have to include the same code in all the\
    \ JSP pages.\n\n```jsp\n<%@ import=\"java.io.*,java.util.*\" %>\n<html>\n<head>\n\
    <title>Application object in JSP</title>\n</head>\n<body>\n<%\nInteger hitsCount\
    \ = (Integer)application.getAttribute(\"hitCounter\");\nif(hitsCount==null ||\
    \ hitsCount == 0) {\n    /* First visit */\n    out.println(\"Welcome to my website!\"\
    );\n    hitsCount = 1;\n} else {\n    /* return visit */\n    out.println(\"Welcome\
    \ back to my website!\");\n    hitsCount += 1;\n}\n%>\napplication.setAttribute(\"\
    hitCounter\", hitsCount);\n%>\n<center>\n<p>Total number of visits: <%= hitsCount></p>\n\
    </center>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_117_0.png)\n\
    \n## Auto Refresh Page\n\nIn this chapter, we will discuss Auto Refresh in JSP.\
    \ Consider a webpage which is displaying live game score or stock status or currency\
    \ exchange ratio. For all such type of pages, you would need to refresh your webpage\
    \ regularly using refresh or reload button with your browser.\n\nJSP makes this\
    \ job easy by providing you a mechanism where you can make a webpage in such a\
    \ way that would refresh automatically after a given interval.\n\nThe simplest\
    \ way of refreshing a webpage is by using the setHeader() method of response object.\
    \ Following is the signature of this method:\n\n```java\npublic void setHeader(String\
    \ header, int headerValue)\n```\n\nThis method sends back the header \"Refresh\"\
    \ to the browser along with an integer value which indicates time in example.\n\
    \n### Example\n\nIn following example, we will use the setHeader() method to set\
    \ Refresh header. This will help simulate a digital clock:\n\n```jsp\n<%@ import=\"\
    java.io.*,java.util.*\" %>\n<html>\n<head>\n<title>Auto Refresh Header Example</title>\n\
    </head>\n<body>\n<center>\n<h2>Auto Refresh Header Example</h2>\n</center>\n<%\n\
    // Set refresh, autoload time as 5 seconds\nresponse.setHeader(\"Refresh\", 5);\n\
    // Get current time\nCalendar calendar = new GregorianCalendar();\nString ampm;\n\
    int hour = calendar.get(Calendar.HOUR);\nint minute = calendar.get(Calendar.MINUTE);\n\
    int second = calendar.get(Calendar.SECOND);\nif(calendar.get(Calendar.AM_PM) ==\
    \ 0)\nam_pm = \"AM\";\n%>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_119_0.png)\n"
  mdcn: "\n我们将代码保留在 `CurrentDate.jsp` 中，然后通过 URL http://localhost:8080/CurrentDate.jsp\
