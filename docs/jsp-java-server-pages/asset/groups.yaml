    \n# JSTL Core <fmt:requestEncoding> Tag\n\nThe <fmt:requestEncoding> tag is used\
    \ to specify the encoding type used by forms that post data back to the Web application.\n\
    \n# Attribute\n\nThe <fmt:requestEncoding> tag has the following attributes:\n\
    \n| Attribute | Description | Required | Default |\n| --- | --- | --- | --- |\n\
    | key | Name of character encoding you want to apply when decoding request parameters.\
    \ | Yes | None |\n\nYou use the <fmt:requestEncoding> tag when you want to specify\
    \ character encoding for decoding data posted from forms. This tag must be used\
    \ with character encodings that are different from ISO-8859-1. The tag is required\
    \ since most browsers do not include a Content-Type header in their requests.\n\
    \nThe purpose of the <fmt:requestEncoding> tag is to specify the content type\
    \ of the request. You must specify the content type, even if the encoding of the\
    \ page generating the response is specified via the ContentAttribute of a page\
    \ directive. This is because the response's actual locale (and character encoding)\
    \ may differ from the value specified in the page directive.\n\nIf the page contains\
    \ an I18N-compatible formatting action that affects the response's locale (and\
    \ thus character encoding) by calling ServletResponse.setLocale(), any encoding\
    \ specified in the page directive will be overridden.\n\n# Example\n\n```\n<%@taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<%@taglib uri=\"\
    http://java.sun.com/jsp/jstl/fmt\" prefix=\"fmt\" %>\n<html>\n<head>\n<title>JSTL\
    \ fmt message Tag</title>\n</head>\n<body>\n\n<fmt:requestEncoding value=\"UTF-8\"\
    \ />\n<fmt:setLocale value=\"es_ES\" />\n<fmt:setBundle basename=\"com.tutorialspoint.Example\"\
    \ var=\"lang\" />\n\n<fmt:message key=\"count.one\" bundle=\"${lang}\"/><br/>\n\
    <fmt:message key=\"count.two\" bundle=\"${lang}\"/><br/>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_170_0.png)\n\
    \n```\n<fmt:message key=\"count.three\" bundle=\"${lang}\"/><br>\n</body>\n</html>\n\
    ```\n\nThe above code will produce the following result:\n\n| Uno |\n| Dos |\n\
    | Tres |\n\n# SQL tags\n\nThe JSTL SQL tag library provides tags for interacting\
    \ with relational databases (RDBMSs) such as Oracle, MySQL, or Microsoft SQL Server.\n\
    \nFollowing is the syntax to include JSTL SQL library in your JSP:\n\n```jsp\n\
    <%@ taglib prefix=\"sql\"\nurl=\"http://java.sun.com/jsp/jstl/sql\" %>\n```\n\n\
    Following table lists out the SQL JSTL Tags:\n\n| Tag | Description |\n| --- |\
    \ --- |\n| <sql:setDataSource> | Creates a simple DataSource suitable for prototyping\
    \ |\n| <sql:query> | Executes the SQL query defined in its body or through the\
    \ attribute. |\n| <sql:update> | Executes the SQL update defined in its body or\
    \ through the attribute. |\n| <sql:param> | Sets a parameter in an SQL statement\
    \ to the specified value. |\n| <sql:date> | Sets a parameter in an SQL statement\
    \ to the specified Java.util.Date value. |\n| <sql:transaction> | Provides nested\
    \ database elements with a shared Connection, to execute all statements as one.\
    \ |\n\n# JSTL SQL <sql:setDataSource> Tag\n\nThe <sql:setDataSource> tag sets\
    \ the data source configuration or saves information in a scoped variable that\
    \ can be used as input to JSTL database actions.\n\n# Attribute\n\nThe <sql:setDataSource>\
    \ tag has the following attributes:\n\n| Attribute | Description | Required |\
    \ Default |\n| --- | --- | --- | --- |\n| driver | Name of the JDBC class to be\
    \ registered | No | None |\n| url | JDBC URL for the database | No | None |\n\
    | user | Database username | No | None |\n| password | Database password | No\
    \ | None |\n| dataSource | Database prepared in advance | No | None |\n| var |\
    \ Name of the variable to represent the database | No | Default |\n| scope | Scope\
    \ of the variable to represent the database | No | Page |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_172_0.png)\n\
    \n# Example\n\nConsider the following information about your MySQL setup:\n\n\
    - We are using JDBC driver.\n- We are going to connect TEST database on local\
    \ machine.\n- We would use user and password to access TEST database.\n\nAll the\
    \ above parameters will vary based on your MySQL or other database setup. Considering\
    \ the above parameters, example uses setDataSource tag:\n\n```jsp\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jst/sql\" prefix=\"sql\" %>\n<html>\n<head>\n<title>JSTL\
    \ sql:setDataSource Tag</title>\n</head>\n<body>\n\n<sql:setDataSource var=\"\
    snapshot\" driver=\"com.mysql.jdbc.Driver\"\n      url=\"jdbc:mysql://localhost/TEST\"\
    \n      user=\"root\" password=\"password\"/>\n\n<sql:query dataSource=\"${snapshot}\"\
    \ var=\"result\" />\n\n</body>\n</html>\n```\n\nWe will use <sql:dataSource> in\
    \ subsequent tags.\n\n# JSTL SQL <sql:query> Tag\n\nThe <sql:query> tag executes\
    \ an SQL SELECT statement and saves the result in a scoped variable.\n\n# Attribute:\n\
    \nThe <sql:query> tag has the following attributes:\n\n| Attribute | Description\
    \ | Required | Default |\n| ---|---|---|--|\n| sql | SQL command to execute (should\
    \ return a ResultSet) | | Body |\n| dataSource | Database connection to use (overrides\
    \ default) | No | Default database |\n| maxRows | Maximum number of results to\
    \ store in the variable | No | Unlimited |\n| startRow | Number of the row in\
    \ the result at which to start recording | No | 0 |\n| var | Name of the variable\
    \ to represent the database | No | Set default |\n| scope | Scope of variable\
    \ to expose the result from the database | No | Page |\n\n# Example\n\nTo start\
    \ with the basic concept, let us create an Employees table in the TEST database\
    \ and create few records in that table as follows:\n\nFollow these steps to create\
    \ the Employees table:\n\n# Step 1:\n\nOpen a Command Prompt and change to the\
    \ installation directory as follows:\n\n```\nC:\\>\nC:\\>cd Program Files\\MySQL\\\
    bin\nC:\\Program Files\\MySQL\\bin>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_174_0.png)\n\
    \n# Step 2:\n\nLogin to the database as follows:\n\n```\nC:\\Program Files\\MySQL\\\
    bin>mysql -u root -p\nEnter password: ********\nmysql>\n```\n\n# Step 3:\n\nCreate\
    \ the table Employee in TEST database as follows:\n\n```mysql\nmysql> use TEST;\n\
    mysql> create table Employee\n(\n  id int not null,\n  age int not null,\n  first\
    \ varchar (255),\n  last varchar (255)\n);\nQuery OK, 0 rows affected (0.08 sec)\n\
    mysql>\n```\n\n# Create Data Records\n\nWe will now create few records in Employee\
    \ table as follows:\n\n```mysql\nmysql> INSERT INTO Employees VALUES (100, 18,\
    \ 'Zara', 'Ali');\nQuery OK, 1 row affected (0.05 sec)\n```\n\n```mysql\nmysql>\
    \ INSERT INTO Employees VALUES (101, 25, 'Mahnaz', 'Fatma');\nQuery OK, 1 row\
    \ affected (0.00 sec)\n```\n\n```mysql\nmysql> INSERT INTO Employees VALUES (102,\
    \ 30, 'Zaid', 'Khan');\nQuery OK, 1 row affected (0.00 sec)\n```\n\n```mysql\n\
    mysql> INSERT INTO Employees VALUES (103, 28, 'Sumit', 'Mittal');\nQuery OK, 1\
    \ row affected (0.00 sec)\nmysql>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_175_0.png)\n\
    \n# JSP\n\nLet us create a JSP which will make use of <sql:query> to execute an\
    \ SQL statement as follows:\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*,java.sql.*\"\
    \ %>\n<%@ page import=\"javax.servlet.*,javax.servlet.*\" %>\n<%@ taglib uri=\"\
    http://www.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@ taglib uri=\"http://www.sun.com/jsp/jst/sql\"\
    \ prefix=\"sql\" %>\n```\n\n```html\n<html>\n<head>\n<title>JSP sql query Tag</title>\n\
    </head>\n<body>\n\n<sql:setDataSource var=\"snapshot\" driver=\"com.mysql.jdbc.Driver\"\
    \n      url=\"jdbc:mysql://localhost/TEST\"\n      user=\"root\" password=\"pass123\"\
    />\n\n<sql:query dataSource=\"${snapshot}\" var=\"result\">\nSELECT * from Employees;\n\
    </sql:query>\n```\n\n```html\n<table border=\"1\" width=\"100%\">\n<tr>\n<th>Emp\
    \ ID</th>\n<th>First Name</th>\n<th>Last Name</th>\n<th>Age</th>\n</tr>\n<c:forEach\
    \ var=\"row\" items=\"${result.rows}\">\n<tr>\n<td><c:out value=\"${row.id}\"\
    /></td>\n<td><c:out value=\"${row.first}\"/></td>\n<td><c:out value=\"${row.last}\"\
    /></td>\n<td><c:out value=\"${row.age}\"/></td>\n</tr>\n</c:forEach>\n</table>\n\
    ```\n"
