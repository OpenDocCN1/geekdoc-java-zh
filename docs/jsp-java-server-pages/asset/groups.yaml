    \ is very good.\n    </c:when>\n    <c:otherwise>\n      No comment sir...\n \
    \   </c:otherwise>\n  </c:choose>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_138_0.png)\n\
    \nThe above code will produce the following result:\n\n```\nYour salary is : 4000\n\
    Salary is very good.\n```\n\n## JSTL Core <c:choose>, <c:when>, <c:otherwise>\
    \ Tag\n\nThe <c:choose> works like a Java switch statement. It chooses between\
    \ a number of alternatives. Where the switch statement has the case statements,\
    \ the <c:choose> tag has the <c:when> tags. A statement has the default clause\
    \ to specify a default action, the <c:choose> as the <c:otherwise> tag as the\
    \ default clause.\n\n## Attribute\n\n- <c:choose> tag does not have any attribute.\n\
    - <c:when> tag has one attributes which is listed below.\n- <c:otherwise> tag\
    \ does not have any attribute.\n\nThe <c:when> tag has the following attributes:\n\
    \n| Attribute | Description | Required | Default |\n|---|---|---|---|\n| test\
    \ | Condition to evaluate | Yes | None |\n\n## Example\n\n```html\n<@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n<title><c:choose>\
    \ Tag Example</title>\n</head>\n<body>\n<c:set var=\"salary\" scope=\"session\"\
    \ value=\"${2000*2}\" />\n<p>Your salary is : <c:out value=\"${salary}\"/></p>\n\
