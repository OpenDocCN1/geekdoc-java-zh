    \ to the source document | No | None |\n| doc | XML document to be parsed | No\
    \ | Page |\n| scope | Scope of the variable specified in the var attribute | No\
    \ | Page |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_194_0.png)\n\n## Example\n\
    \nThe following example shows how parse can be used to read the external XML file:\n\
    \nWe have seen how we can parse XML from the body of the given document. Let us\
    \ now put the following content in the books.xml file:\n\n```xml\n<books>\n  <book>\n\
    \    <name>Padam History</name>\n    <author>ZARA</author>\n    <price>100</price>\n\
    \  </book>\n  <book>\n    <name>Great Mistry</name>\n    <author>NUHA</author>\n\
    \    <price>2000</price>\n  </book>\n</books>\n```\n\n```jsp\n<%@ taglib prefix=\"\
    c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ taglib prefix=\"x\" uri=\"\
