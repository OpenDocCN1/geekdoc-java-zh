    # JSTL Core: <c:catch> Tag


    The <c:catch> tag catches Throwable that occurs in its body and optionally exposes
    it. It is used for error handling and to deal more gracefully with the problem.


    # Attribute


    The <c:catch> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | --- | --- | --- | --- |

    | var | The name of the variable to hold the java.lang.Throwable if thrown by
    elements in the body. | No | None |


    # Example


    ```

    <@taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title><c:catch> Example</title>

    </head>

    <body>


    <c:catch var="catchException">

    <% int x = 5/0;%>

    </c:catch>


    <c:if test="${catchException != null}>

    <p>The exception is : ${catchException} <br />

    There is an exception: ${catchException.message}</p>

    </c:if>


    </body>

    </html>

    ```


    The above code will produce the following result:


    ```

    The exception is : java.lang.ArithmeticException / by zero

    There is an exception : / by zero

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_135_0.png)'
