    # 15. JSP — 会话跟踪


    在本章中，我们将讨论 JSP 中的会话跟踪。HTTP 是一种“无状态”协议，这意味着客户端每次检索 Web 页面都会向 Web 服务器开启一个单独连接，而服务器不会自动保留之前客户端请求的任何记录。


    ## 在 Web 客户端与服务器之间维护会话


    让我们现在讨论在 Web 客户端和 Web 服务器之间维护会话的方法：


    ### Cookies


    Web 服务器可以每个 Web 客户端分配一个唯一的会 ID 作为 Cookie，对于客户端随后的请求，将通过收到的 Cookie 进行识别。


    这可能不是一种有效的方法，因为浏览器有时不支持 Cookie。不建议使用此程序来维护会话。


    ### 隐藏表单字段


    Web 服务器可以如下分配一个隐藏的 HTML 表单字段以及唯一的会话 ID：


    ```

    <input type="hidden" name="sessionid" value="12345">

    ```


    此输入意味着当提交表单时，指定的名称和值会自动包含在 GET 或 POST 数据中。每当 Web 浏览器发送请求时，可以使用 `session_id` 值来跟踪不同的
    Web 浏览器。


    这是一种有效的跟踪会话的方法，但点击普通的（<A HREF->）超链接不会导致表单提交，因此隐藏表单字段无法支持通用会话跟踪。


    ### URL 重写


    你可以在每个 URL 的末尾添加一些额外数据。这可以标识会话，服务器可以将该会话标识符与其存储的会话数据相关联。


    例如，使用 http://tutorialspoint.com/file.htm;sessionid=12345，会话标识符以 `sessionid=12345`
    的形式附加，可以在 Web 服务器上访问识别客户端。


    URL 重写是维护会话的更好方法，适用于不支持 Cookie 的浏览器。缺点是，你必须动态生成每个 URL 来分配会话 ID，即使页面只是一个简单的静态 HTML
    页面。


    ![](img/5626302a090fb89f52cde01d391f8bdc_98_0.png)


    ## session 对象


    除了上述选项外，JSP 使用了 servlet 提供的 **HttpSession 接口**。该接口提供了一种跨越范围识别用户的方法：


    - 页面请求或

    - 访问网站或

    - 存储关于该用户的信息


    默认情况下，JSP 启用了会话跟踪，并会为每个新客户端自动实例化一个新的 HttpSession 对象。禁用会话跟踪需要显式地通过将页面指令属性设置为 `false`
    来关闭，如下：


    ```jsp

    <% page session="false" %>

    ```


    JSP 引擎通过隐式 **session** 对象向 JSP 作者暴露 HttpSession。由于 session 已经提供给 JSP 程序员，程序员可以立即开始从该对象中存储和检索数据，而无需任何初始化或调用
    **getSession()**。


    以下是通过 session 对象提供的可用方法总结：


    | 序号. | 方法与描述 |

    |---|---|

    | 1 | **public Object getAttribute(String name)**<br>此方法返回绑定到此会话中指定名称的对象，如果该名称下没有绑定任何对象，则返回
    null。 |

    | 2 | **public Enumeration getAttributeNames()**<br>此方法返回一个 String 对象的枚举，包含所有绑定到此会话的对象名称。
    |

    | 3 | **public long getCreationTime()**<br>此方法返回该会话创建的时间，以自 GMT 时间 1970 年 1 月
    1 日午夜起的毫秒数计算。 |

    | 4 | **public String getId()**<br>此方法返回包含分配给此会话的唯一标识符的字符串。 |

    | 5 | **public long getLastAccessedTime()**<br>此方法返回客户端发送与此会话相关的最后请求时间，以自 GMT
    时间 1970 年 1 月 1 日午夜起的毫秒数计算。 |

    | 6 | **public int getInactiveInterval()**<br>此方法返回 servlet 容器在客户端访问之间保持此会话开启的最大间隔（以秒为单位）。
    |

    | 7 | **public void invalidate()**<br>此方法使此会话失效并解绑绑定到上面的任何对象。 |

    | 8 | **public boolean isNew()**<br>如果客户端尚不知道该会话，或者客户端选择不加入会话，则返回 true。 |

    | 9 | **public void removeAttribute(String name)****<br>此方法从此会话中移除绑定到指定名称的对象。
    |

    | 10 | **public void setAttribute(String name, Object value)****<br>此方法使用指定的名称将对象绑定到此会话。
    |

    | 11 | **public void setMaxInactiveInterval(int interval)****<br>此方法指定了客户端请求之间
    servlet 容器使此会话失效之前的时间（以秒为单位）。 |


    ## 会话跟踪示例


    此示例描述了如何使用 HttpSession 对象来查找会话的创建时间和最后访问时间。如果已不存在会话，我们将为请求关联一个新的会话。


    ```jsp

    <@ page import="java.io.*,java.util.*" %>

    // 获取会话创建时间。

    Date createdAt = new Date(session.getCreationTime());

    // 获取此页面的最后访问时间。

    Date lastAccessedTime = new Date(session.getLastAccessedTime());


    String title = "Welcome Back to my website";

    Integer visitCount = new Integer(0);

    String visitCountStr = new String("visitCount");

    String userIDKey = new String("userID");

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_99_0.png)


