    \ the following result:\n\nFinal string : this is first string.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_226_0.png)\n\
    \n# JSTL fn:toUpperCase() Function\n\nThe fn:toUpperCase() function converts all\
    \ the characters of a string to uppercase.\n\n# Syntax\n\nThe fn:toUpperCase()\
    \ function has following syntax:\n\n```\njava.lang.String toUpperCase(java.lang.String)\n\
    ```\n\n# Example\n\nFollowing is the example to explain the functionality of the\
    \ fn:toUpperCase() function:\n\n```\n<@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<%@@ taglib uri=\"http://java.sun.com/jsp/jstl/functions\"\
    \ prefix=\"fn\" %>\n<html>\n<head>\n<title>Using JSTL Functions</title>\n</head>\n\
    <body>\n<c:set var=\"string1\" value=\"This is first String.\"/>\n<c:set var=\"\
    string2\" value=\"${fn:toUpperCase(string1)}\" />\n\n<p>Final string : ${string2}</p>\n\
    </body>\n</html>\n```\n\nYou will receive the following result:\n\n| Final string\
    \ : THIS IS FIRST STRING. |\n\n# JSTL fn:trim() Function\n\nThe fn:trim() function\
    \ removes white space from both ends of a string.\n\n# Syntax\n\nThe fn:trim()\
    \ function has following syntax:\n\n```\njava.lang.String trim(java.lang.String)\n\
    ```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_227_0.png)\n\n# Example\n\nFollowing\
    \ is the example to explain the functionality of the fn:trim()\n\n```\n<@ taglib\
    \ uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@@ taglib uri=\"\
    http://java.sun.com/jsp/jst/functions\" prefix=\"fn\" %>\n<html>\n<head>\n<title>Using\
    \ JSTL Functions</title>\n</head>\n<body>\n\n<c:set var=\"string1\" value=\"This\
    \ is first String\" />\n<c:set var=\"string2\" value=\"${fn:trim(string1)}\" />\n\
    \n<p>Final string : ${string2}</p>\n</body>\n</html>\n```\n\nYou will receive\
    \ the following result:\n\n| String (1) Length : 29 |\n| String (2) Length : 20\
    \ |\n| Final string : This is first String |\n\nIn this chapter, we will discuss\
    \ how to access database with JSP. We assume you have good understanding on how\
    \ JDBC application works. Before starting with database access through JSP, make\
    \ sure you have proper JDBC environment setup along with a database.\n\nFor more\
    \ detail on how to access database using JDBC and its environment setup you can\
    \ go through our JDBC Tutorial.\n\n# Create Table\n\nTo create the Employees table\
    \ in the EMP database, use the following steps:\n\nStep 1:\n\nOpen a Command Prompt\
    \ and change to the installation directory as follows:\n\n```\nC:\\\nC:\\cd Program\
