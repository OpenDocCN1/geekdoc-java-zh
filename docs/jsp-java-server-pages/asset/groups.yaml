    \ %>\n```\n\nThe following directive sets the content type as a Microsoft Word\
    \ document:\n\n```\n<@ page contentType=\"application/msword\" %>\n```\n\nYou\
    \ can also specify the character encoding for the response. For example, if you\
    \ wanted to specify the resulting page that is returned to the browser uses ISO\
    \ Latin 1, you can use the following page directive:\n\n```\n<@ page contentType=\"\
    text/html;charset=ISO-8859-1\" %>\n```\n\n## The errorPage Attribute\n\nThe errorPage\
    \ attribute tells the JSP engine to display if there is an error while the current\
    \ page runs. The value of the errorPage attribute is a relative URL.\n\nThe following\
    \ directive displays MyErrorPage.jsp when uncaught exceptions are thrown:\n\n\
    ```\n<@ page errorPage=\"MyErrorPage.jsp\" %>\n```\n\n## The isErrorPage Attribute\n\
    \nThe isErrorPage attribute indicates that the current JSP can be used as the\
    \ error page for another JSP.\n\nThe value of isErrorPage is either true or false.\
    \ The default value of the isErrorPage attribute is false.\n\nFor example, the\
    \ handleError.jsp sets the isErrorPage option to true because it is supposed to\
    \ handle errors:\n\n```\n<@ page isErrorPage=\"true\" %>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_37_0.png)\n\
    \n## The extends attribute\n\nThe extends attribute specifies a superclass that\
    \ the generated servlet may extend.\nFor example, the following directive directs\
    \ the JSP translator to generate the servlet such that the servlet extends somePackage.SomeClass:\n\
    \n```\n<@ page extends=\"somePackage.SomeClass\" %>\n```\n\n## The import Attribute\n\
    \nThe import attribute serves the same function as, and behaves like, the Java\
    \ import statement. The value for the import option is the name of the package\
    \ you want to import.\nTo import java.sql.*, use the following page directive:\n\
    \n```\n<@ page import=\"java.sql.*\" %>\n```\n\nTo import multiple packages, you\
    \ can separate them by comma as follows:\nBy default, a container automatically\
    \ imports java.lang.*, javax.servlet.*, javax.servlet.jsp.*, and javax.servlet.http.\n\
    \n```\n<@ page import=\"java.sql.*,java.util.*\" %>\n```\n\n## The info Attribute\n\
    \nThe info attribute lets you to provide a description of the JSP. The following\
    \ is a coding example:\n\n```\n<@ page info=\"This JSP Page Written By ZARA\"\
    \ %>\n```\n\n## The isThreadSafe Attribute\n\nThe isThreadSafe option marks a\
    \ page as being thread-safe. By default, all JSPs are considered thread-safe.\
    \ If you set the isThreadSafe option to false, the JSP engine ensures that only\
    \ one thread is at a time executing your JSP.\nThe following page directive sets\
    \ the isThreadSafe option to false:\n\n```\n<@ page isThreadSafe=\"false\" %>\n\
    ```\n\n## The language Attribute\n\nThe language attribute indicates the programming\
    \ language used in scripting the JSP.\nFor example, because you usually use Java\
    \ as the scripting language, your language option looks like:\n\n```\n<@ page\
    \ language=\"java\" %>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_38_0.png)\n\
    \n## The session Attribute\n\nThe session attribute indicates whether or not the\
    \ JSP page uses HTTP sessions. A value of true means that the JSP page has a builtin\
    \ object and a value of false means that the JSP page cannot access the builtin\
    \ object.\nFollowing directly allows the JSP page to use any of the builtin methods\
    \ such as session.getCreationTime() and session.getLastAccessTime():\n\n```\n\
    <@ page session=\"true\" %>\n```\n\n## The isIgnored Attribute\n\nThe isIgnored\
    \ attribute gives the ability to disable evaluation of Expression Language (EL)\
    \ expressions which have been introduced in JSP 2.0. The default value of the\
    \ attribute is true, meaning that expressions, ${...}, are evaluated by the JSP\
    \ specification. If the attribute is set to false, then expressions are not evaluated\
    \ but treated as static text.\nFollowing directive sets an expression not be evaluated:\n\
    \n```\n<@ page isIgnored=\"false\" %>\n```\n\n## The isScriptingEnabled Attribute\n\
    \nThe isScriptingEnabled attribute determines if scripting elements are allowed\
    \ for use. The default value (true) enables scriptlets, expressions, and declarations.\
    \ If the attribute's value is set to false, a translation-time error will be raised\
    \ if the JSP uses scriptlets, expressions (non-EL), or declarations. The attribute's\
    \ value can be set to false:\n\n```\n<@ page isScriptingEnabled=\"false\" %>\n\
    ```\n\n## include Directive\n\nThe include directive is used to include a file\
    \ during the translation phase. This directive tells the container to merge the\
    \ content of external files with the current JSP during the translation phase.\
    \ You may code the include directives anywhere in your JSP.\nThe general usage\
    \ of this directive is as follows:\n\n```\n<%@ include file=\"relative url\" %>\n\
    ```\n\nThe filename in the include directive is actually a relative URL. If you\
    \ just specify a filename with no path, the JSP compiler assumes the file is in\
    \ the same directory as your JSP.\nYou can write the XML equivalent of the above\
    \ syntax:\n\n```xml\n<jsp:include file=\"relative url\" />\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_39_0.png)\n\
    \n## JSP - Include Directive\n\nThe include directive is used to include a file\
    \ during the translation phase. This directive tells the container to merge the\
    \ content of external files with the current JSP during the translation phase.\
    \ You may code the include directives anywhere in your JSP page.\nThe general\
    \ usage of this directive is as follows:\n\n```\n<%@ include file=\"relative url\"\
    \ %>\n```\n\nThe filename in the include directive is actually a relative URL.\
    \ If you specify a filename with no path, the JSP compiler assumes that the file\
    \ is in the same directory as your JSP.\nYou can write the XML equivalent of the\
    \ above syntax:\n\n```xml\n<jsp:include file=\"relative url\" />\n```\n\n## Example\n\
    \nA good example of the include directive is including a common header and footer\
    \ with multiple pages of content. Let us define following files (a) header.jsp,\
    \ (b) footer.jsp, and (c) main.jsp as follows:\nFollowing is the content of header.jsp:\n\
    \n```jsp\n<%\nint pageCount = 0;\nvoid addCount() {\n  pageCount++;\n}\n%>\n<html>\n\
    <head>\n<title>The include Example</title>\n</head>\n<body>\n<center>\n<h2>The\
    \ include Example</h2>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_40_0.png)\n\
    \nJSP\n```jsp\n<p>This site has been visited <% pageCount %> times.</p>\n</center>\n\
    <br/>\n```\n\nFollowing is the content of footer.jsp:\n\n```jsp\n<%@ include file=\"\
    header.jsp\" %>\n<center>\n<p>Thanks for visiting my page.</p>\n</center>\n<%@\
    \ include file=\"footer.jsp\" %>\n```\n\nLet us now keep all these files in the\
    \ root directory and try to access main.jsp. You will receive the following output:\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_41_0.png)\n\nRefresh main.jsp and you\
    \ will find that the page hit counter keeps increasing. You can design your webpages\
    \ based on your creative instincts; it is recommended you design the dynamic parts\
    \ of your website in separate files and then include them in the main file. This\
    \ makes it easy when you need to change a part of your webpage.\n\n## The tagline\
    \ Directive\n\nThe JavaServer Pages allow you to define custom JSP tags that look\
    \ like HTML or XML tags and a tag library is a set of user-defined tags that implement\
    \ custom behavior. The tagline directive declares that your JSP page uses a set\
    \ of custom tags, identifies the location of the library, and provides means for\
    \ identifying the custom tags in your JSP page.\nThe tagline directive follows\
    \ the syntax given below:\n\n```\n<@ taglib uri=\"uri\" prefix=\"prefixOfTag\"\
    \ %>\n```\n\nHere, the uri attribute value refers to a location a container understands\
    \ and the prefix attribute informs a container bits of markup are custom actions.\n\
    You can write the XML equivalent of the above syntax as follows:\n\n```xml\n<jsp:taglib\
    \ uri=\"uri\" prefix=\"prefixOfTag\" />\n```\n\nFor more details related to the\
    \ tagline directive, check the Taglib Directive.\n\n## JSP - The tagline Directive\n\
    \nThe JavaServer Pages allow you to define custom JSP tags that look like HTML\
    \ or XML tags and a tag library is a set of user-defined tags that implement custom\
    \ behavior. The tagline directive declares that your JSP page uses a set of custom\
    \ tags, identifies the location of the library, and provides means for identifying\
    \ the custom tags in your JSP page.\nThe tagline directive follows the syntax\
    \ given below:\n\n```\n<@ taglib uri=\"uri\" prefix=\"prefixOfTag\" %>\n```\n\n\
    Where the uri attribute value refers to a location a container understands and\
    \ the prefix attribute informs a container bits of markup are custom actions.\n\
    You can write the XML equivalent of the above syntax as follows:\n\n```xml\n<jsp:taglib\
    \ uri=\"uri\" prefix=\"prefixOfTag\" />\n```\n\nWhen you use a custom tag, it\
    \ is typically of the form <prefix:tagname>. The prefix is the same as the prefix\
    \ you specify in your JSP directive, and the tagname is the name of a tag implemented\
    \ in the tag library.\n\n## Example\n\nFor example, suppose the custlib tag library\
    \ contains a tag called hello. If you wanted to use the hello tag with a prefix\
    \ of mytag, your tag would be <mytag:hello> and it will be used in your JSP file\
    \ as follows:\n\n```\n<@ taglib uri=\"http://www.example.com/custlib\" prefix=\"\
    mytag\" %>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_42_0.png)\n"
