    \ 或 SERIALIZABLE） | 否 | 数据库默认 |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_187_0.png)\n\
    \n# JSP 示例\n\n从基本概念开始，我们在 TEST 数据库中创建一个 Students 表并创建若干记录：\n\n### 步骤 1\n\n打开命令提示符并切换到目录：\n\
    \n```cmd\nC:\\>cd \"C:\\Program Files\\bin\"\n```\n\n### 步骤 2\n\n登录数据库：\n\n```cmd\n\
