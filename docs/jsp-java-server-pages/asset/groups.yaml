  - '[PAGE 17]


    # 3. JSP – Architecture


    The web server needs a JSP engine, i.e., a container to process JSP pages. The
    JSP container is responsible for intercepting requests for JSP pages. This tutorial
    makes use of Apache which has built-in JSP container to support JSP pages development.


    A JSP container works with the Web server to provide the runtime environment and
    other services a JSP needs. It knows how to understand the special elements that
    are part of JSPs.


    Following diagram shows the position of JSP container and JSP files in a Web application.


    ![](img/5626302a090fb89f52cde01d391f8bdc_17_0.png)


    # JSP Processing


    The following steps explain how the web server creates the Webpage using JSP:


    +   - As a normal page, your browser sends an HTTP request to the web server.

    - The web server recognizes that the HTTP request is for a JSP page and forwards
    it to a JSP engine. This is done by using the URL or JSP page ends with .jsp instead
    of .html.

    - The JSP engine loads the JSP from disk and converts it into a servlet. This
    conversion is very simple in which all text is converted to println() statements
    and all JSP elements are converted to Java code. This code implements the corresponding
    dynamic behavior of the page.

    - The JSP engine compiles the servlet into an executable class and forwards the
    original request to a servlet engine.

    - A part of the web server calls the servlet engine loads the Servlet class and
    executes it. During execution, the servlet produces an output in HTML format.
    This output is further passed on the web server by the servlet engine inside an
    HTTP response.'
  - '[PAGE 18]


    # JSP


    +   * The web server forwards the HTTP response to your browser in terms of static
    HTML content.

    * Finally, the web browser handles the dynamically-generated HTML page inside
    the HTTP response exactly as if it were a static page.


    All the above mentioned steps can be seen in the following diagram:


    ![](img/5626302a090fb89f52cde01d391f8bdc_18_0.png)


    Typically, the JSP engine checks to see whether a servlet for a JSP file already
    exists and whether the modification date on the JSP is older than the servlet.
    If the JSP is older than its generated servlet, the JSP container assumes that
    the JSP hasn''t changed and the generated servlet still matches the JSP''s contents.
    This makes the process more efficient than the other scripting languages (such
    as PHP) and therefore faster.


    So in a way, a JSP page is really just another way to write a servlet without
    having to be a Java programming wiz. Except for the translation phase, a JSP page
    is handled exactly like a regular servlet'
  - '[PAGE 19]


    # 4. JSP – Lifecycle


    In this chapter, we will discuss the lifecycle of JSP. The key to understanding
    the low-level functionality of JSP is to understand the simple life cycle they
    follow.


    A JSP life cycle is defined as the process from its creation till the destruction.
    This is similar to a servlet life cycle with an additional step which is required
    to compile a JSP into servlet.


    # Paths Followed By JSP


    The following are the paths followed by a JSP


    +   * Compilation

    * Initialization

    * Execution

    * Cleanup


    The four major phases of a JSP life cycle are very similar to the Servlet Life
    Cycle. The four phases have been described below:


    ![](img/5626302a090fb89f52cde01d391f8bdc_19_0.png)


    # JSP Compilation


    When a browser asks for a JSP, the JSP engine first checks to see whether it needs
    to compile the page. If the page has never been compiled, or if the JSP has been
    modified since it was last compiled, the JSP engine compiles the page.


    ![](img/5626302a090fb89f52cde01d391f8bdc_19_1.png)'
  - "[PAGE 20]\n\nThe compilation process involves three steps:\n\n+   - Parsing the\
    \ JSP.\n- Turning the JSP into a servlet.\n- Compiling the servlet.\n\n# JSP Initialization\n\
    \nWhen a container loads a JSP it invokes the jspInit() method before servicing\
    \ any requests. If you need to perform JSP-specific initialization, override the\
    \ jspInit() method:\n\n```\npublic void jspInit(){\n    // Initialization code;\n\
    }\n```\n\nTypically, initialization is performed only once and as with the servlet\
    \ init method, you generally initialize database connections, open files, and\
    \ create lookup tables in the JSP method.\n\n# JSP Execution\n\nThis phase of\
    \ the JSP life cycle represents all interactions with requests until the JSP is\
    \ destroyed.\n\nWhenever a browser requests a JSP and the page has been loaded\
    \ and initialized, the JSP engine invokes the _jspService() method in the JSP.\n\
    \nThe _jspService() method takes an HttpServletRequest and an HttpServletResponse\
    \ as its parameters as follows:\n\n```\nvoid _jspService(HttpServletRequest request,\n\
    \    HttpServletResponse response)\n{\n    // Service handling code...\n}\n```\n\
    \nThe _jspService() method of a JSP is invoked on request basis. This is responsible\
    \ for generating responses for that request and this method is also responsible\
    \ for generating responses to all seven of the HTTP methods, i.e., GET, POST,\
    \ DELETE, etc.\n\n# JSP Cleanup\n\nThe destruction phase of the JSP life cycle\
    \ represents when a JSP is being removed from use by a container.\n\nThe jspDestroy()\
    \ method is the JSP equivalent of the destroy method for servlets. Override jspDestroy()\
    \ when you need to perform any cleanup, as releasing database connections or opening\
    \ files.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_20_0.png)"
  - "[PAGE 21]\n\nThe jspDestroy() method has the following form:\n\n```\npublic void\
    \ jspDestroy() {\n    // Your cleanup code goes here.\n}\n```"
- md: "\n## 5. JSP – Syntax\n\nIn this chapter, we will discuss Syntax in JSP. We\
    \ will understand the basic use of simple syntax (i.e., elements) involved in\
    \ JSP development.\n\n## Elements of JSP\n\nThe elements of JSP have been described\
    \ below:\n\n### The Scriptlet\n\nA scriptlet can contain any number of JAVA language\
    \ statements, variable or method declarations, or expressions that are valid in\
    \ the page scripting language.\n\nFollowing is the syntax of Scriptlet:\n\n```\n\
    <% code fragment %>\n```\n\nYou can write the XML equivalent of the above syntax\
    \ as follows:\n\n```\n<jsplet>\ncode fragment\n</jsplet>\n```\n\nAny text, HTML\
    \ tags, or JSP elements you write must be outside the scriptlet. Following is\
    \ the simple and first example for JSP:\n\n```html\n<html>\n<head><title>Hello\
    \ World</title></head>\n<body>\nHello World!<br>\n<%\nout.println(\"Your IP address\
    \ is \" + request.getRemoteAddr());\n%>\n</body>\n</html>\n```\n\n**NOTE:** Assuming\
    \ that Apache Tomcat is installed in C:\\apache-tomcat-7.0.2 and your environment\
    \ is set as per setup tutorial.\n\nLet us keep the above code in JSP file **hello.jsp**\
    \ and put this file in **C:\\apache-tomcat-7.0.2\\webapps\\ROOT** directory. Browse\
    \ through the same using URL **http://localhost:8080/hello.jsp**. This would generate\
    \ the following result:\n\n12\n\n![](img/5626302a090fb89f52cde01d391f8bdc_22_0.png)\n\
    \n## JSP Declarations\n\nA declaration declares one or more variables or methods\
    \ that you can use in Java code later in the JSP file. You must declare the variable\
    \ or method before you use it in the JSP file.\n\nFollowing is the syntax for\
    \ JSP Declarations:\n\n```\n<%! declaration; [ declaration; ]+ ... %>\n```\n\n\
    You can write the XML equivalent of the above syntax as follows:\n\n```\n<jsp:declaration>\n\
    code fragment\n</jsp:declaration>\n```\n\nFollowing is an example for JSP Declarations:\n\
    \n```jsp\n<%! int i = 0; %>\n<%! int a, b, c; %>\n<%! a = new Circle(2.0); a %>\n\
    ```\n\n## JSP Expression\n\nA JSP expression element contains a scripting language\
    \ expression that is evaluated, converted to a String, and inserted where the\
    \ expression appears in the JSP file.\n\nBecause the value of an expression is\
    \ converted to a String, you can use an expression within a line of text, whether\
    \ or not it is tagged with HTML, in a JSP file.\n\nThe expression element can\
    \ contain any expression that is valid according to the Java Language Specification\
    \ but you cannot use a semicolon to end an expression.\n\nFollowing is the syntax\
    \ of JSP Expression:\n\n```\n<%= expression %>\n```\n\nYou can write the XML equivalent\
    \ of the above syntax as follows:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_23_0.png)\n\
    \n```\n<jsp:expression>\nexpression\n</jsp:expression>\n```\n\nFollowing example\
    \ shows a JSP Expression:\n\n```html\n<html>\n<head><title>A Comment Test</title></head>\n\
    <body>\n<p>\nToday's date: <%= (new java.util.Date()).toString() %</p>\n</body>\n\
    </html>\n```\n\nThe above code will generate the following result:\n\nToday's\
    \ date: 11-Sep-2010 21:24:25\n\n## JSP Comments\n\nJSP comment marks the text\
    \ or the statements that the JSP container should ignore. JSP comment is useful\
    \ when you want to hide or \"comment out\", a part of your JSP page.\n\nFollowing\
    \ is the syntax of the JSP comments:\n\n```\n<%-- This is JSP comment --%>\n```\n\
    \nFollowing example shows the JSP Comments:\n\n```html\n<html>\n<head><title>A\
    \ Comment Test</title></head>\n<body>\n<h2>A Test of Comments</h2>\n<%-- This\
    \ comment will not be visible in the page source --%>\n</body>\n</html>\n```\n\
    \nThe above code will generate the following result:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_24_0.png)\n\
    \n## A Test of Comments\n\nThere are a small number of characters you can use:\n\
    \n| Syntax | Purpose |\n| :--- | :--- |\n| `<-- ... --%>` | JSP comment. Ignored\
    \ by the browser. |\n| `<% ... %>` | JSP literal. |\n| `\\%` | Single quote. |\n\
    | `\\\"` | Double quote. |\n\n## JSP Directives\n\nA directive affects the overall\
    \ structure of the servlet. It usually follows form:\n\n```\n<%@ directive ...\
    \ %>\n```\n\nThere are three types:\n\n| Directive | Description |\n| :--- | :---\
    \ |\n| `<@ page ... %>` | Affects the page. |\n| `<@ include ... %>` | Includes\
    \ a file. |\n| `<@ taglib ... %>` | Declares custom library. |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_25_0.png)\n\
    \n## JSP Actions\n\nJSP actions use XML tags to control the servlet. They generate\
    \ code:\n\n```xml\n<jsp:action ... />\n```\n\nActions are predefined functions:\n\
    \n| Action | Purpose |\n| :--- | :--- |\n| `<jsp:useBean ... />` | Finds a bean.\
    \ |\n| `<jsp:setProperty ... />` | Sets the property. |\n| `<jsp:getProperty ...\
    \ />` | Gets the property. |\n| `<jsp:forward ... />` | Forwards the page. |\n\
    | `<jsp:include ... />` | Includes a file. |\n\n## JSP Implicit Objects\n\nJSP\
    \ supports nine automatically defined variables, which are called implicit objects:\n\
    \n| Objects | Description |\n| :--- | :--- |\n| `request` | This is the HttpServletRequest\
    \ associated with the request. |\n| `response` | This is the HttpServletResponse\
    \ associated with the client. |\n| `out` | This is the PrintWriter object used\
    \ to send output. |\n| `session` | This is the HttpSession object associated with\
    \ the request. |\n| `application` | This is the ServletContext object associated\
    \ with application. |\n| `config` | This is the ServletConfig object associated\
    \ with the page. |\n| `pageContext` | This encapsulates use of server-specific\
    \ features. |\n| `page` | This is simply a synonym for `this`, and is used to\
    \ call methods defined by the translated servlet. |\n| `exception` | The Exception\
    \ object allows the exception data to be accessed by designated JSP. |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_27_0.png)\n\
    \n## Control-Flow Statements\n\nYou can use all the APIs and building blocks of\
    \ Java in your JSP programming including decision-making statements, loops, etc.\n\
    \n## Decision-Making Statements\n\nThe If...else block starts like an ordinary\
    \ Scriptlet, but the Scriptlet is closed at each line with HTML text included\
    \ between the Scriptlet tags.\n\n```html\n<% int day = 3; %>\n<html>\n<head><title>IF...ELSE\
    \ Example</title></head>\n<body>\n<% if (day == 1 || day == 7) { %>\n  <p>Today\
    \ is weekend</p>\n<% } else { %>\n  <p>Today is not weekend</p>\n<% } %>\n</body>\n\
    </html>\n```\n\nThe above code will generate the following result:\n\n```\nToday\
    \ is not weekend\n```\n\nNow look at the following switch...case block which has\
    \ been written a bit differently using out.println() and inside Scriptlet:\n\n\
    ```jsp\n<% int day = 3; %>\n<html>\n<head><title>SWITCH...CASE Example</title></head>\n\
    <body>\n<% switch(day) {\ncase 0:\n  out.println(\"It's Sunday.\");\n  break;\n\
    case 1:\n  out.println(\"It's Monday.\");\n```\n</body>\n</html>\n```\n"
