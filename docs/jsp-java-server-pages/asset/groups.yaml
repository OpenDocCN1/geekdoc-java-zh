    # 19. JSP – Hits Counter


    In this chapter, we will discuss Hits Counter in JSP. A hit counter tells you
    about the number of visits on a particular page of your web site. Usually you
    attach a hit counter with your index.jsp page assuming first land on your home
    page.


    To implement a hit counter you can make use of the Application Implicit object
    and associated methods getAttribute() and setAttribute().


    This object is a representation of the JSP page through its entire lifecycle.
    This object is created when the JSP page is initialized and will be removed when
    the JSP page is removed by the jDestroy() method.


    Following is the syntax to set a variable at application level:


    ```

    application.setAttribute(String Key, Object Value);

    ```


    You can use the above method to set a hit counter variable and to reset the same
    variable. Following is the method to read the variable set by the previous method:


    ```

    application.getAttribute(String Key);

    ```


    Every time a user accessesyourpage, you can read the current value of the hit
    counter and increase it by one and again and set it for future use.


    # Example


    This example shows how you can use JSP to count the total number of hits on a
    particular page. If you want to count the total number of hits of your website
    then you will have to include the same code in all the JSP pages.


    ```

    <@page import="java.io.*,java.util.* %>

    <html>

    <head>

    <title>Application object in JSP</title>

    </head>

    <body>

    <%Integer hitsCount =

    (Integer)application.getAttribute("hitCounter");

    if(hitsCount==null || hitsCount == 0) {

    /* First visit */

    out.println("Welcome to my website!");

    hitsCount = 1;

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_117_0.png)'
