    <body>\n...\n</body>\n</html>\n```\n\n状态行包含 HTTP 版本（示例中 HTTP/1.1）、状态码（示例为 200）以及与状态码对应的简短消息（示例为\
    \ OK）。\n\n以下是返回给 Web 服务器浏览器的最常用 HTTP 1.1 响应头部摘要。这些头部在 Web编程中被频繁使用：\n\n| 头部 (Header)\
