    # Locale Specific Dates


    You can use the java.text.DateFormat class and its static getDateTimeInstance()
    method to format date and time specific to locale. Following is the example which
    shows how to format date specific to a locale:


    ```

    <@ page import="java.io.*,java.util.Locale" %>

    <@ page import="javax.servlet.*,javax.servlet.http.*" %>

    <@ page import="java.text.DateFormat,java.util.Date" %>


    String title = "Locale Specific Dates";

    //Get the client''s Locale

    Locale locale = request.getLocale();

    String date = DateFormat.getTimeInstance(

    DateFormat.FULL,

    DateFormat.SHORT,

    locale).format(new Date());


    <html>

    <head>

    <title><% out.print(title); %></title>

    </head>

    <body>

    <center>

    <h1><% out.print(title); % ></h1>

    </center>

    <div align="center">

    <p>Local Date: <% out.print(date); %></p>

    </div>

    </body>

    </html>

    ```'
