    \ | 不支持的媒体类型。 | |\n| 417 | Expectation Failed | 未满足预期。 |\n| 500 | Internal Server\
    \ Error | 服务器遇到了意外情况。 |\n| 501 | Not Implemented | 服务器不支持该功能。 |\n| 502 | Bad Gateway\
    \ | 服务器从上游服务器接收到无效响应。 | |\n| 503 | Service Unavailable | 服务器临时过载或宕机。 | |\n| 504\
    \ | Gateway Timeout | 网关超时。 | |\n| 505 | HTTP Not Supported | 服务器不支持 \"http\"\
    \ 版本。 |\n\n## 设置 HTTP 状态码的方法\n\n可以使用以下方法在 servlet 中设置 HTTP 状态码。这些方法通过 `HttpServletResponse`\
    \ 对象可用。\n\n| 序号 | 方法与描述 |\n|---|---|\n| 1 | **public void setStatus ( int statusCode\
    \ )** 此方法设置任意状态码。`setStatus` 方法接受一个 `int`（状态码）作为参数。你的响应将包含一个特殊的状态码，请确保在使用 PrintWriter\
    \ 返回任何内容之前调用 **setStatus**。 |\n| 2 | **public void sendRedirect(String url)**\
    \ 此方法生成 302 响应，并有一个 *Location* 标头，指示新文档的 URL。 |\n| 3 | **public void sendError(int\
    \ code, String message)** 此方法发送一个状态码（通常为 404）以及一条短消息，该消息会自动格式化并在 HTML 文档中发送给客户端。\
    \ |\n\n## HTTP 状态码示例\n\n下面的示例显示了如何向客户端浏览器发送 407 错误码。之后，浏览器将向你显示 \"Need authentication!!!\"\
    消息。\n\n```jsp\n<html>\n<head>\n<title>设置 HTTP 状态码</title>\n</head>\n<body>\n<%\n\
    // 设置错误码和原因。\nresponse.sendError(407, \"Need authentication!!!\");\n%>\n</body>\n\
    </html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_75_0.png)\n\n你将收到以下输出：\n\
    \n| HTTP Status 407 - Need authentication!!! |\n| type Status report |\n| message\
    \ Need authentication!!! |\n| description The client必须先向代理（Apache Tomcat/5.5.29）进行身份验证\
    \ |\n\n为了更熟悉 HTTP 状态码，请尝试设置不同的状态码及其描述。\n\n"
