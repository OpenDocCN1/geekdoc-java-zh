- md: "\nLet us make the following changes in the above tag code to process the body\
    \ of the tag:\n\n```\npackage com.tutorialpoint.jsptagext;\n\nimport javax.servlet.jsptagext.*;\n\
    import javax.servlet.jsp.*;\nimport java.io.*;\n\npublic class HelloTag extends\
    \ SimpleTagSupport {\n\n    PrintWriter sw = new StringWriter();\n    public void\
    \ doGetTag()\n    throws JSPException, IOException\n    {\n        getJspBody().invoke(sw);\n\
    \        getJspContext().getOut().println(sw.toString());\n    }\n}\n```\n\nHere,\
    \ the output resulting from the invocation is first captured into a StringWriter\
    \ before written to the JspWriter associated with the tag. We need to change TLD\
    \ file as follows:\n\n```xml\n<taglib>\n<tlib-version>1.0</tlib-version>\n<jsp-version>2.0</jsp-version>\n\
    <short-name>Example TLD with Body</short-name>\n<tag>\n<name>Hello</name>\n<tag-class>com.tutorialpoint.HelloTag</tag-class>\n\
    <body-content>scriptless</body-content>\n</tag>\n</taglib>\n```\n\nLet us now\
    \ call the above tag with proper body as follows:\n\n```jsp\n<@ taglib prefix=\"\
    ex\" uri=\"WEB-INF/custom.tld\">\n<html>\n<head>\n  <title>Sample custom tag</title>\n\
    </head>\n<body>\n  <ex:Hello>\n    This is message body\n  </ex:Hello>\n</body>\n\
    </html>\n```\n\nYou will receive the following result:\n\n| This is message body\
    \ |\n\n# Custom Tag Attributes\n\nYou can use various attributes along with your\
    \ custom tags. To accept an attribute value, a custom tag class needs to implement\
    \ the setter methods, identical to the JavaBean setter methods as shown below:\n\
    \n```java\npackage javax.servlet.jsp.tagext.*;\n\nimport javax.servlet.jsp.*;\n\
    import java.io.*;\n\npublic class HelloTag extends SimpleTagSupport {\n\n  private\
    \ String message;\n\n  public void setMessage(String msg) {\n    this.message\
    \ = msg;\n  }\n\n  StringWriter sw = new StringWriter();\n\npublic void doTag()\n\
    \    throws JspException, IOException\n{\n    if (message != null) {\n       \
    \ /* Use message attribute */\n        JspWriter out = getJspContext().getWriter();\n\
    \        out.println(message);\n    } else {\n        /* use message from the\
    \ body */\n        getJspBody().invoke(sw);\n        getJspContext().getPage().println(sw.toString());\n\
    \    }\n}\n```\n\nThe attribute's name is \"message\", so the setter method is\
    \ setMessage(). Let us add this attribute in the TLD file using the <attribute>\
    \ element as follows:\n\n```xml\n<taglib>\n  <taglib-version>1.0</taglib-version>\n\
    \  <jsp-version>2.0</jsp-version>\n  <short-name>Example TLD with Body</short-name>\n\
    \  <tag>\n    <name>Hello</name>\n    <tag-class>com.tutorialspoint.HelloTag</tag-class>\n\
    \    <body-content>scriptless</body-content>\n    <attribute>\n      <name>message</name>\n\
    \    </attribute>\n  </tag>\n</taglib>\n```\n\nLet us follow JSP with message\
    \ attribute as follows:\n\n```jsp\n<%@ taglib prefix=\"ex\" uri=\"WEB-INF/custom.tld\"\
    \ %>\n<html>\n<head>\n<title>A sample custom tag</title>\n</head>\n<body>\n<ex:Hello\
    \ message=\"This is custom tag\" />\n</body>\n</html>\n```\n\nYou will receive\
    \ the following result:\n\nThis is custom tag\n\nConsider including the following\
    \ properties for an attribute:\n\n| Property | Purpose |\n| --- | --- |\n| name\
    \ | The name element defines the name of an attribute. Each attribute name must\
    \ be unique for a particular tag. |\n| required | This specifies if this attribute\
    \ is required or is an optional one. It would be false for optional. |\n| rtexprvalue\
    \ | Declares if a runtime expression value for a tag attribute is valid |\n| type\
    \ | Defines the Java class-type of this attribute. By default it is assumed as\
    \ String |\n| description | Informational can be provided. |\n| fragment | Declares\
    \ if this attribute value should be treated as a JspFragment. |\n\nFollowing is\
    \ the example to specify properties related to an attribute:\n\n```xml\n......\n\
    <attribute>\n  <name>attribute_name</name>\n  <required>false</required>\n  <type>java.util.Date</type>\n\
    \  <fragment>false</fragment>\n</attribute>\n...\n```\n\nIf you are using two\
    \ attributes, then you can modify your TLD as follows:\n\n```xml\n......\n<attribute>\n\
    \  <name>attribute_name1</name>\n  <required>false</required>\n  <type>java.util.Boolean</type>\n\
    \  <fragment>false</fragment>\n</attribute>\n<attribute>\n  <name>attribute_name2</name>\n\
    \  <required>true</required>\n  <type>java.util.Date</type>\n</attribute>\n...\n\
    ```\n\n# 27. JSP — Expression Language (EL)\n\nJSP Expression Language (EL) makes\
    \ it possible to easily access application data stored in JavaBeans. JSP EL allows\
    \ you to create expressions with (a) arithmetic and (b) logical. Within a EL expression,\
    \ you can use integers, floating point numbers, strings, the built-in constants\
    \ true and false for boolean values, and null.\n\n# Simple Syntax\n\nTypically,\
    \ when you specify an attribute value in a JSP tag, you simply use a string. For\
    \ example:\n\n```jsp\n<jsp:setProperty name=\"box\" property=\"perimeter\" value=\"\
    100\"/>\n```\n\nJSP EL allows you to specify an expression for any of these attribute\
    \ values. A simple syntax for JSP EL is as follows:\n\n```jsp\n${expr}\n```\n\n\
    Here expr specifies the expression itself. The most common operators in JSP EL\
    \ are and []. These two operators allow you to access various attributes of Java\
    \ Beans and built-in JSP objects.\n\nFor example, the above syntax <jsp:setProperty>\
    \ tag can be written with an expression like:\n\n```jsp\n<jsp:setProperty name=\"\
    box\" property=\"perimeter\" value=\"${box.width+2*box.height}\"/>\n```\n\nWhen\
    \ the JSP compiler compiles the ${} use parentheses to group subexpressions. For\
    \ example, ${(1 + 2) * 3} equals 9, but ${1 + (2 * 3)} equals 7.\n\nTo deactivate\
    \ the evaluation of EL, we specify the isIgnored attribute of the page directive\
    \ as:\n\n```jsp\n<%@ page isELored=\"true\" %>\n```\n\nThe valid values of this\
    \ attribute are true and false. If it is true, EL expressions are ignored when\
    \ they appear in static text or tag attributes. If it is false, EL expressions\
    \ are evaluated by the container.\n\n# Basic Operators in EL\n\nJSP Expression\
    \ Language (EL) supports most of the arithmetic and logical operators supported\
    \ by Java. Following table lists out the most frequently used:\n\n| Operator |\
    \ Description |\n| --- | --- |\n| . | Access a bean property or Map entry |\n\
    | [] | Access an array or List element |\n| () | Group a subexpression to change\
    \ the evaluation order |\n| + | Addition |\n| - | Subtraction or negation of a\
    \ value |\n| * | Multiplication |\n| / | Division |\n| % or mod | Modulo (remainder)\
    \ |\n| == or eq | Test for equality |\n| != or ne | Test for inequality |\n| <\
    \ or lt | Test for less than |\n| > or gt | Test for greater than |\n| <= or le\
    \ | Test for less than or equal |\n| >= or ge | Test for greater than or equal\
    \ |\n| && or and | Test for logical AND |\n| || or or | Test for logical OR |\n\
    | ! or not | Unary Boolean complement |\n| empty | Test for empty variable values\
    \ |\n\n# Functions in JSP EL\n\nJSP EL allows you to use functions in expressions\
    \ as well. These functions must be defined in the custom tag libraries. A function\
    \ usage has the following syntax:\n\n```jsp\n${ns:func(param1, param2, ...)}\n\
    ```\n\n**ns** is the namespace of the function, **func** is the name of the function\
    \ and **param1** is the first parameter value. For example, the function **fn:length**,\
    \ which is part of the JSTL library. This function can be used as follows to get\
    \ the length of a string.\n\n```jsp\n${fn:length(\"Get my length\")}\n```\n\n\
    To use a function from any tag library (standard or custom), you must install\
    \ that library on your server and include the library in your JSP using the **<taglib>**\
    \ directive as explained in the JSTL chapter.\n"
