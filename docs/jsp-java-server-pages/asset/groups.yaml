    # XML Tags


    The JSTL XML tags provide a JSP-centric way of creating and manipulating the XML
    documents. Following is the syntax to include the JSTL XML library in your JSP.


    The JSTL XML library has custom tags for interacting with the XML data. This includes
    parsing the XML, transforming the XML data, and the flow control based on the
    XPath expressions.


    ```

    <@ taglib prefix="x"

    uri="http://java.sun.com/jsp/jstl/xml" %>

    ```


    Before you proceed with the examples, you will need to copy the following two
    XML and XPath related libraries into your \Tomcat Installation Directory>\lib:


    +   - XercesImpl.jar: Download from it http://www.apache.org/dist/xerces//

    - xalan.jar: Download from it http://xml.apache.org/xalan-j/index.html


    Following is the list of XML JSTL Tags:


    | Tag | Description |

    |---|---|


    ![](img/5626302a090fb89f52cde01d391f8bdc_191_0.png)'
  - '[PAGE 192]


    JSP


    | <x:out> | Like %= ... >, but for XPath expressions. |

    | <x:parse> | Used to parse the XML data specified either via an attribute or
    in the tag body. |

    | <x:set > | Sets a variable to the value of an XPath expression. |

    | <x:if> | Evaluates a test XPath expression and if it is true, it processes its
    body. If the test condition is false, the body is ignored. |

    | <x:forEach> | To loop over nodes in an XML document. |

    | <x:choose> | Simple conditional tag that establishes a context for mutually
    exclusive conditional operations, marked by <when> and <otherwise> tags. |

    | <x:when > | Subtag of <choose> that includes its body if its expression evaluates
    to ''true''. |

    | <x:otherwise > | Subtag of <choose> that follows the <when> tags and runs only
    if all of the prior conditions evaluates to ''false''. |

    | <x:transform > | Applies an XSL transformation on an XML document. |

    | <x:param > | Used along with the transform tag to set a parameter in the XSLT
    stylesheet. |


    # JSTL XML <x:out> Tag


    The **<x:out>** tag displays the result of an XPath expression. It functions the
    same as the `<%= %> syntax.


