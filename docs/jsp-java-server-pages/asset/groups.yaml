    # The tagline Directive


    The JavaServer Pages allow you to define custom JSP tags that look like HTML or
    XML tags and a tag library is a set of user-defined tags that implement custom
    behavior.


    The tagline directive declares that your JSP page uses a set of custom tags, identifies
    the location of the library, and provides means for identifying the custom tags
    in your JSP page.


    The tagline directive follows the syntax given below:


    ```

    <@ tagline uri="uri" prefix="prefixOfTag" >

    ```


    Here, the uri attribute value refers to a location a container understands and
    the prefix attribute informs a container bits of markup are custom actions.


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsp:directive.taglib uri="uri" prefix="prefixOfTag" />

    ```


    For more details related to the tagline directive, check the Taglib Directive.


    # JSP - The tagline Directive


    The JavaServer Pages allow you to define custom JSP tags that look like HTML or
    XML tags and a tag library is a set of user-defined tags that implement custom
    behavior.


    The tagline directive declares that your JSP page uses a set of custom tags, identifies
    the location of the library, and provides means for identifying the custom tags
    in your JSP page.


    The tagline directive follows the syntax given below:


    ```

    <@ tagline uri="uri" prefix="prefixOfTag" >

    ```


    Where the uri attribute value refers to a location a container understands and
    the prefix attribute informs a container bits of markup are custom actions.


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsp:directive.taglib uri="uri" prefix="prefixOfTag" />

    ```


    When you use a custom tag, it is typically of the form <prefix:tagname>. The prefix
    is the same as the prefix you specify in your JSP directive, and the tagname is
    the name of a tag implemented in the tag library.


    # Example


    For example, suppose the custlib tag library contains a tag called hello. If you
    wanted to use the hello tag with a prefix of mytag, your tag would be <mytag:hello>
    and it will be used in your JSP file as follows:


    ```

    <@ tagline uri="http://www.example.com/custlib" prefix="mytag" >

    ```


