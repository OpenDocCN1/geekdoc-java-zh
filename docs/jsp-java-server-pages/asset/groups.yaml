    \n# JSTL Core <fmt:requestEncoding> 标签\n\n<fmt:requestEncoding> 标签用于指定向 Web 应用程序提交数据的表单所使用的编码类型。\n\
    \n# 属性\n\n<fmt:requestEncoding> 标签具有以下属性：\n\n| 属性 | 说明 | 必须 | 默认 |\n| --- | ---\
    \ | --- | --- |\n| key | 解码请求参数时想要应用的字符编码名称。 | 是 | 无 |\n\n当你想要为从表单提交的数据指定字符编码时，请使用\
    \ <fmt:requestEncoding> 标签。此标签必须与不同 ISO-8859-1 的字符编码配合使用。由于大多数浏览器在请求中不包含 Content-Type\
    \ 请求头，因此该标签是必需的。\n\n<fmt:requestEncoding> 标签的目的是指定请求的内容类型。你必须指定内容类型，即使生成响应的页面编码是通过页面指令的\
    \ `ContentAttribute` 指定的。这是因为响应的实际本地语言（以及字符编码）可能与页面指令中指定的值不同。\n\n如果页面包含兼容 I18N\
    \ 的格式化动作，通过调用 `ServletResponse.setLocale()` 影响响应的本地语言（从而字符编码），则页面指令中指定的任何编码都将被覆盖。\n\
    \n# 示例\n\n```\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"\
    \ %>\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/fmt\" prefix=\"fmt\" %>\n<html>\n\
    <head>\n<title>JSTL fmt message 标签</title>\n</head>\n<body>\n\n<fmt:requestEncoding\
