    # JSTL Core <c:url> Tag


    The <c:url> tag formats a URL into a string and stores it into a variable. This
    tag automatically performs URL rewriting when necessary. The var attribute specifies
    the variable that will contain the formatted URL.


    The JSTL url tag is just an alternative method of writing the call to the response.encodeURL()
    method. The only real advantage the url tag provides proper URL encoding, including
    any parameters specified by the child param tag.


    # Attribute


    The <c:url> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|--|

    | value | Base URL | Yes | None |

    | context | / followed by the name of a local web application | No | Current application
    |

    | var | Name of the variable to expose the processed URL | No | Print to page
    |

    | scope | Scope of the variable to expose the processed URL | No | Page |


    # Example


    ```

    <@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c %>

    <html>

    <head>

    <title><c:url> Tag Example</title>

    </head>

    <body>

    <a href="<c:url value="jsp/index.htm/">TEST</a>

    </body>

    </html>

    ```


    This will produce the following result:


    ![](img/5626302a090fb89f52cde01d391f8bdc_147_0.png)'
