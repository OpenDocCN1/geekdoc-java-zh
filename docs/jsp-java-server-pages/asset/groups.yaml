    # 14. JSP — Cookies Handling


    In this chapter, we will discuss Cookies Handling in JSP. Cookies are text files
    stored on the client computer and they are kept for various information tracking
    purposes. JSP transparently supports HTTP cookies using underlying servlet technology.


    There are three steps involved in identifying and returning users:


    +   - Server sends set cookies to the browser. For example, name, age, or identification
    number, etc.

    - Browser stores this information on the local machine for future use.

    - When the next time the browser sends any request to the server then it sends
    those cookies to the server and uses information to identify the user or may be
    for some other purpose as well.


    This chapter will teach you how to set or reset cookies, how to access them and
    how to delete them using JSP programs.


    # The Anatomy of a Cookie


    Cookies are usually set in an HTTP header (although JavaScript can also set a
    cookie directly on a browser). A JSP that sets a cookie must send headers that
    look something like this:


    ```

    HTTP/1.1 200 OK

    Date: Fri, 04 Feb 2000 21:03:38 GMT

    Server: Apache/1.3.9 (UNIX) PHP/4.0b3

    Set-Cookie: name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT;

    path=/; domain=tutorialspoint.com


    Connection: close

    Content-Type: text/html

    ```


    As you can see, the Set-Cookie header contains a name value pair, a GMT date,
    a path and a domain. The name and value will be URL encoded. The expires field
    is an instruction to the browser to "forget" the cookie after the given date and
    time.


    If the browser is configured to store cookies, it will then keep this information
    until the expiry date. If the user posts the browser at any path that matches
    the path and domain of the cookie, it will resend the cookie to the server. The
    browser''s headers might look like this:


    ```

    GET / HTTP/1.0

    Connection: Keep-Alive

    User-Agent: Mozilla/4.6 (X11; I; Linux 2.2.6-15apmac llc)

    Host: zink.demo.co.uk:1126

    ```


