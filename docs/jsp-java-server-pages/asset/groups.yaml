    \n| Uno |\n| Dos |\n| Tres |\n\n# SQL 标签\n\nJSTL SQL 标签库提供了用于与关系型数据库（RDBMS，如 Oracle、MySQL\
    \ 或 Microsoft SQL Server）交互的标签。\n\n以下是在 JSP 中引入 JSTL SQL 库的语法：\n\n```jsp\n<%@\
    \ taglib prefix=\"sql\"\nurl=\"http://java.sun.com/jsp/jstl/sql\" %>\n```\n\n\
    下表列出了 SQL JSTL 标签：\n\n| 标签 | same |\n| --- | --- |\n| <sql:setDataSource> | 创建一个适用于原型设计的简单数据源\
    \ |\n| <sql:query> | 执行在其主体内定义或通过属性定义的 SQL 查询。 |\n| <sql:update> | 执行在其主体内或通过属性定义的\
    \ SQL 更新。 |\n| <sql:param> | 将 SQL 语句中的参数设置为指定的值。 |\n| <sql:date> | 将 SQL 语句中的参数设置为指定的\
    \ Java.util.Date 值。 |\n| <sql:transaction> | 提供具有共享连接的嵌套数据库元素，以便所有语句作为一个整体执行。\
    \ |\n\n# JSTL SQL <sql:setDataSource> 标签\n\n<sql:setDataSource> 标签设置数据源配置或将信息保存在作用域变量中，并可以作为\
    \ JSTL 数据库操作的输入。\n\n# 属性\n\n<sql:setDataSource> 标签具有以下属性：\n\n| 属性 | 说明 | 必须 |\
    \ 默认 |\n| --- | --- | --- | --- |\n| driver | 要注册的 JDBC 类名 | 否 | 无 |\n| url |\
    \ 数据库的 JDBC URL | 否 | 无 |\n| user | 数据库用户名 | 否 | 无 |\n| password | 数据库密码 | 否 |\
    \ 无 |\n| dataSource | 预备的数据库 | 否 | 无 |\n| var | 表示数据库的变量名 | 否 | 默认 |\n| scope\
    \ | 表示数据库的变量范围 | 否 | 页面 |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_172_0.png)\n\
    \n# 示例\n\n考虑以下关于 MySQL 设置的设置：\n\n- 我们正在使用 JDBC 驱动。\n- 我们将连接本地机器上的 TEST 数据库。\n\
    - 我们将使用 user 和 password 访问 TEST 数据库。\n\n上述参数将根据你的 MySQL 或数据库设置而变化。根据上述参数，使用 setDataSource\
    \ 标签：\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"\
    c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/sql\" prefix=\"sql\" %>\n\
    <html>\n<head>\n<title>JSTL sql:setDataSource 标签</title>\n</head>\n<body>\n\n\
    <sql:setDataSource var=\"snapshot\" driver=\"com.mysql.jdbc.Driver\"\n      url=\"\
    jdbc:mysql://localhost/TEST\"\n      user=\"root\" password=\"password\"/>\n\n\
