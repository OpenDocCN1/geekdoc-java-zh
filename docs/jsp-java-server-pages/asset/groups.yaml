    \ bundle=\"${lang}\"/><br/>\n<fmt:message key=\"count.two\" bundle=\"${lang}\"\
    /><br/>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_170_0.png)\n\n```\n<fmt:message\
