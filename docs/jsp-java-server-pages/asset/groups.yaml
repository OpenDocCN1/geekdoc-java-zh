    \ />\n</body>\n</html>\n```\n\n访问上面的 JSP，将显示结果：\n\n书籍信息：\n第二本书的价格：null\n\n## JSTL\
    \ XML <x:if> 标签\n\n<x:if> 标签评估 test XPath 表达式，如果为 true，则处理其体。如果 test 条件为 false，则忽略该体。\n\
    \n## 属性\n\n<x:if> 标签具有以下属性：\n\n| 属性 | 描述 | 是否强制 | 默认 |\n|---|---|---|---|\n| select\
    \ | 要评估的 XPath 表达式 | 是 | 无 |\n| var | 存储结果的变量名 | 否 | 无 |\n| scope | var 属性指定的变量的作用范围\
