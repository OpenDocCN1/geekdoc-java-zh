    \n## JSTL Core <fmt:bundle> Tag\n\nThe **<fmt:bundle>** tag will make the specified\
    \ bundle available to all **<fmt:message>** tags that occur between the bounding\
    \ **<fmt:bundle>** and **</fmt:bundle>** tags. You do not need to specify the\
    \ resource bundle for each of your **<fmt:message>** tags.\n\nFor example, the\
    \ two **<fmt:bundle>** blocks will produce the same output:\n\n```\n<fmt:bundle\
    \ basename=\"com.tutorialpoint.Example\">\n  <fmt:message key=\"one\"/>\n</fmt:bundle>\n\
    \n<fmt:bundle basename=\"com.tutorialpoint.Example\" prefix=\"count\">\n  <fmt:message\
