    \ %>\n\n<html>\n<head>\n<title>JSTL Tags</title>\n</head>\n<body>\n<h3>Books Info:</h3>\n\
    \n<c:set var=\"xmltext\">\n<books>\n<book>\n<name>Padam History</name>\n<author>ZARA</author>\n\
    <price>100</price>\n</book>\n<book>\n<name>Great Mistry</name>\n<author>NUHA</author>\n\
