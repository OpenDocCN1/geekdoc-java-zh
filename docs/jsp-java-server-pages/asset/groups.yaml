- md: "\n```xml\n<% taglib uri=\"http://java.sun.com/jsp/jstl/core prefix=\"c\" %>\n\
    <html>\n<head>\n<title>c:forTokens Tag Example</title>\n</head>\n<body>\n<c:forTokens\
    \ items=\"Zara,nuha,roshy\" delims=\",\" var=\"name\">\n  <c:out value=\"${name}/></p>\n\
    </c:forTokens>\n</body>\n</html>\n```\n\nThe above code will produce the following\
    \ result:\n\nZara\nnuha\nroshy\n\n## JSTL Core <c:param> Tag\n\nThe <c:param>\
    \ tag allows proper URL request parameter to be specified with URL and also does\
    \ the necessary URL encoding if required.\nWithin a <c:param> tag, the name attribute\
    \ indicates the parameter name, and the value attribute indicates the parameter\
    \ value:\n\n## Attribute\n\nThe <c:param> tag has the following attributes:\n\n\
    | Attribute | Description | Required | Default |\n| :--- | :--- | :--- | :---\
    \ |\n| name | Name of the request parameter to set in the URL | Yes | None |\n\
    | value | Value of the request parameter to set in the URL | No | Body |\n\n##\
    \ Example\n\n![](img/5626302a090fb89f52cde01d391f8bdc_145_0.png)\n\nIf you need\
    \ to pass parameters to a <c:import> tag, use the <c:url> tag to create the URL\
    \ first as shown below:\n\n```xml\n<c:url value=\"index.jsp\" var=\"myURL\">\n\
    <c:param name=\"trackingId\" value=\"1234\"/>\n<c:param name=\"reportType\" value=\"\
    summary\"/>\n</c:url>\n<c:import url=\"${myURL}\"/>\n```\n\nThe above request\
    \ will pass the URL as below - Try it yourself.\n\n## JSTL Core <c:redirect> Tag\n\
    \nThe <c:redirect> tag redirects the browser to an alternate URL by facilitating\
    \ automatic rewriting,, it supports context-relative URLs, and it also supports\
    \ the <c:param> tag.\n\n## Attribute\n\nThe <c:redirect> tag has the following\
    \ attributes:\n\n| Attribute | Description | Required | Default |\n| :--- | :---\
    \ | :--- | :--- |\n| url | URL to redirect the user's browser to | Yes | None\
    \ |\n| context | / followed by the name of a local web application | No | Current\
    \ application |\n\n## Example\n\nIf you need to pass parameters to a <c:import>\
    \ tag, use the <c:url> tag to create the URL first as shown below:\n\n```xml\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title><c:redirect> Tag Example</title>\n</head>\n<body>\n<c:redirect\
    \ url=\"http://www.photofuntoos.com\"/>\n</body>\n</html>\n```\n\nThe above code\
    \ will redirect request to http://www.photofuntoos.com - Try it yourself.\n\n\
    ## JSTL Core <c:url> Tag\n\nThe <c:url> tag formats a URL into a string and stores\
    \ it into a variable. This tag automatically performs URL rewriting when necessary.\
    \ The var attribute specifies the variable that will contain the formatted URL.\n\
    \nThe JSTL url tag is just an alternative method of writing the call to the response.encodeURL()\
    \ method. The only real advantage the url tag provides proper URL encoding, including\
    \ any parameters specified by the child param tag.\n\n## Attribute\n\nThe <c:url>\
    \ tag has the following attributes:\n\n| Attribute | Description | Required |\
    \ Default |\n| :--- | :--- | :--- | :--- |\n| value | Base URL | Yes | None |\n\
    | context | / followed by the name of a local web application | No | Current application\
    \ |\n| var | Name of the variable to expose the processed URL | No | Print to\
    \ page |\n| scope | Scope of the variable to expose the processed URL | No | Page\
    \ |\n\n## Example\n\n```xml\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:url> Tag Example</title>\n</head>\n\
    <body>\n<a href=\"<c:url value=\"jsp/index.htm/\">TEST</a>\n</body>\n</html>\n\
    ```\n\nThis will produce the following result:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_147_0.png)\n\
    \n## Formatting Tags\n\nThe JSTL formatting tags are used to format and display\
    \ text, the date, the time, and numbers for internationalized Websites. Following\
    \ is the syntax to include Formatting library in your JSP:\n\n```xml\n<%@ taglib\
    \ prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n```\n\nFollowing\
    \ is the list of Formatting JSTL Tags:\n\n| Tag | Description |\n| :--- | :---\
    \ |\n| <fmt:formatNumber> | To render numerical value with specific precision\
    \ or format. |\n| <fmt:Number> | Parses the string representation of a number,\
    \ currency, or percentage. |\n| <fmt:formatDate> | Formats a date and/or time\
    \ using the supplied styles and pattern. |\n| <fmt:parseDate> | Parses the string\
    \ representation of a date and/or time. |\n| <fmt:bundle> | Loads a resource bundle\
    \ to be used by its tag. |\n| <fmt:setLocale> | Stores the given locale in the\
    \ locale variable. |\n| <fmt:setBundle> | Loads a resource bundle and stores it\
    \ in the bundle configuration. |\n| <fmt:timeZone> | Specifies the time zone for\
    \ any formatting or parsing nested in its body. |\n| <fmt:setTimeZone> | Stores\
    \ the given time zone in the time zone variable. |\n| <fmt:message> | Displays\
    \ an internationalized message. |\n| <fmt:requestEncoding> | Sets the request\
    \ encoding ![](img/5626302a090fb89f52cde01d391f8bdc_148_0.png) |\n\n## JSTL Core\
    \ <fmt:formatNumber> Tag\n\nThe <fmt:formatNumber> tag is used to format numbers,\
    \ percentages, and currencies.\n\nThe <fmt:formatNumber> tag has the following\
    \ attributes:\n\n| Attribute | Description | Required | Default |\n| :--- | :---\
    \ | :--- | :--- |\n| value | Numeric value to display | Yes | None |\n| type |\
    \ NUMBER, CURRENCY, or PERCENT | No | Number |\n| pattern | Specify a custom formatting\
    \ pattern for the output. | No | None |\n| currencyCode | Currency code (for type=\"\
    currency\") | No | From the default locale |\n| currencySymbol | Currency symbol\
    \ (for type=\"currency\") | No | From the default locale |\n| groupingUsed | Whether\
    \ to group numbers (TRUE or FALSE) | No | true |\n| maxIntegerDigits | Maximum\
    \ number of integer digits to print | No | None |\n| minIntegerDigits | Minimum\
    \ number of integer digits to print | No | None |\n| maxFractionDigits | Maximum\
    \ number of fractional digits to print | No | None |\n| minFractionDigits | Minimum\
    \ number of fractional digits to print | No | None |\n| var | Name of the variable\
    \ to store the formatted number | No | Print to page |\n\n- If the type attribute\
    \ is percent or number, then you can use several number-formatting attributes.\
    \ The <maxIntegerDigits> and <minIntegerDigits> attributes allow you to specify\
    \ the size of the fractional portion of the number. If the actual number exceeds\
    \ maxIntegerDigits, the number is truncated.\n- Attributes are also provided to\
    \ allow you to determine how many decimal places should be used. The <minFractionDigits>\
    \ and <maxFractionDigits> attributes allow you to specify the number of decimal\
    \ places. If the number exceeds the maximum number of fractional digits, the number\
    \ will be rounded.\n- Grouping can be used to insert commas between thousands.\
    \ Grouping is specified by setting the <groupingUsed> attribute to true or false.\
    \ When using <minIntegerDigits>, you must be careful to get your intended result.\n\
    - You may select the pattern attribute. This attribute lets you include special\
    \ characters that specify how you would like encoded. Following table lists the\
    \ codes.\n\n| Symbol | Description |\n| :--- | :--- |\n| 0 | Represents a digit.\
    \ |\n| E | Represents in exponential form. |\n| # | Represents a digit; displays\
    \ 0 as absent. |\n| . | Serves as a placeholder for a decimal separator. |\n|\
    \ , | Serves as a placeholder for a grouping separator. |\n| ; | Separates formats.\
    \ |\n| - | Used as the default negative prefix. |\n| % | Multiplies by 100 and\
    \ displays as a percentage. |\n| ? | Multiplies by 1000 and displays as mille.\
    \ |\n| x | Represents the currency sign; replaced by currency symbol. |\n| X |\
    \ Indicates that any other characters can be used in the prefix or suffix. |\n\
    | ' | Used to quote special characters in a prefix or suffix. |\n\n## Example\n\
    \n```xml\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n\
    <%@ taglib prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n\n<html>\n\
    <head>\n<title>JSTL fmt:formatNumber Tag</title>\n</head>\n<body>\n<h3>Number\
    \ Format:</h3>\n<c:set var=\"balance\" value=\"12000.2309\" />\n<p>Formatted Number\
    \ (1): <fmt:formatNumber value=\"${balance}\" type=\"currency\"/></p>\n<p>Formatted\
    \ Number (2): <fmt:formatNumber type=\"number\" maxIntegerDigits=\"3\" value=\"\
    ${balance\"/></p>\n<p>Formatted Number (3): <fmt:formatNumber type=\"number\"\
    \ maxFractionDigits=\"3\" value=\"${balance\"/></p>\n<p>Formatted Number (4):\
    \ <fmt:formatNumber type=\"number\" groupingUsed=\"false\" value=\"${balance\"\
    /></p>\n<p>Formatted Number (5): <fmt:formatNumber type=\"percent\" maxIntegerDigits=\"\
    3\" value=\"${balance\"/></p>\n<p>Formatted Number (6): <fmt:formatNumber type=\"\
    percent\" minFractionDigits=\"10\" value=\"${balance\"/></p>\n<p>Formatted Number\
    \ (7): <fmt:formatNumber type=\"number\" maxIntegerDigits=\"3\" value=\"${balance\"\
    /></p>\n<p>Formatted Number (8): <fmt:formatNumber type=\"number\" pattern=\"\
    #,###.##0\" value=\"${balance\"/></p>\n<p><fmt:setLocale value=\"en_US\" /><fmt:formatNumber\
    \ value=\"${balance}\" type=\"currency\"/></p>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_151_0.png)\n"
