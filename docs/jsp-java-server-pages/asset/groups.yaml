    ```\n\n**(3) Sending the Cookie into the HTTP response headers:** You use response.addCookie\
    \ to add cookies in the HTTP response header as follows:\n\n```java\nresponse.addCookie(cookie);\n\
    ```\n\n# Example\n\nLet us modify our Form Example to set the cookies for the\
    \ first and the last name.\n\n```jsp\n<%\n// Create cookies for first and last\
    \ names.\nCookie firstName = new Cookie(\"first_name\", request.getParameter(\"\
    first_name\"));\nCookie lastName = new Cookie(\"last_name\", request.getParameter(\"\
    last_name\"));\n\n// Set expiry date after 24 Hrs for both the cookies.\nfirstName.setMaxAge(60*60*24);\n\
    lastName.setMaxAge(60*60*24);\n\n// Add both the cookies in the response header.\n\
    response.addCookie(firstName);\nresponse.addCookie(lastName);\n%>\n<html>\n<head>\n\
    <title>Setting Cookies</title>\n</head>\n<body>\n<center>\n<h1>Setting Cookies</h1>\n\
    </center>\n<ul>\n<li><p>First Name:</p>\n<%= request.getParameter(\"first_name\"\
    ) %>\n</p></li>\n<li><p>Last Name:</p>\n<%= request.getParameter(\"last_name\"\
    ) %>\n</p></li>\n</ul>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_93_0.png)\n\
    \nLet us put the above code in main.jsp file and use it in the following HTML\
    \ page:\n\n```html\n<html>\n<body>\n<form action=\"main.jsp\" method=\"GET\">\n\
    First Name: <input type=\"text\" name=\"first_name\">\n<br />\nLast Name: <input\
    \ type=\"text\" name=\"last_name\" />\n<input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n</body>\n</html>\n```\n\nKeep the above HTML content in a file\
    \ hello.jsp and put hello.jsp and main.jsp in `<Tomcat-installation-directory>//webapps/ROOT`\
    \ directory. When you access `http://localhost:8080/hello.jsp`, here is the actual\
    \ output of the form.\n\nFirst Name:\n\nLast Name:\n\nTry to enter the First Name\
    \ and the Last Name and then click the submit button. This will display the first\
    \ name and last name on your screen and will set two cookies firstName and lastName.\
    \ These cookies will be passed back to the server when the next time you click\
    \ the Submit button.\n\nIn the next section, we will explain how you can access\
    \ these cookies back in our web application.\n\n# Reading Cookies with JSP\n\n\
    To read cookies, you need to create an array of javax.servlet.Cookie objects by\
    \ calling the getCookies() method of HttpServletRequest. Then cycle through the\
