    # # JSTL fn:contains() Function


    The **fn:contains()** function determines whether an input string contains a specified
    substring.


    # # Syntax


    The **fn:contains()** function has the following syntax:


    ```

    boolean contains(java.lang.String, java.lang.String)

    ```


    # # Example


    Following example explains the functionality of **fn:contains()**


    ```

    <@ taglib uri="http://java.sun.com/jsp/jst/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jst/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL Functions</title>

    </head>

    <body>

    <c:set var="theString" value="I am a test String"/>

    <c:if test="${fn:contains(theString, ''test'')}">

    <p>Found test string</p>

    </c:if>

    <c:if test="${fn:contains(theString, ''TEST'')}">

    ```


