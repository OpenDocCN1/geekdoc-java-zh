    <head>\n<title>Using JSTL Functions</title>\n</head>\n<body>\n<c:set var=\"string1\"\
    \ value=\"This is first String.\"/>\n<c:set var=\"string2\" value=\"${fn:substring(string1,\
    \ 5, 15)}\" />\n\n<p>Final sub string : ${string2}</p>\n</body>\n</html>\n```\n\
    \nYou will receive the following result:\n\n| Final sub string : is first S |\n\
    \n# JSTL fn:substringAfter() Function\n\nThe fn:substringAfter() function returns\
    \ the part of a string after a specified substring.\n\n# Syntax\n\nThe fn:substringAfter()\
    \ function has the following syntax:\n\n```\njava.lang.String substringAfter(java.lang.String,\
    \ java.lang.String)\n```\n\n# Example\n\nFollowing is the example to explain the\
    \ functionality of the fn:substringAfter() function:\n\n```\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/functions\"\
