    # JSTL SQL <sql:transaction> Tag


    The <sql:transaction> tag is used to group the <sql:query> and the <sql:update>
    tags into transactions. You can put as many <sql:query> and <sql:update> tags
    as statements inside the <sql:transaction> tag to create a single transaction.


    It ensures that the database modifications performed by the nested actions are
    either committed or rolled back if an exception is thrown by any nested action.


    # Attribute


    The <sql:transaction> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|---|


