    \ uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ taglib prefix=\"x\" uri=\"\
    http://java.sun.com/jsp/jstl/xml\" %>\n\n<html>\n<head>\n<title>JSTL x:if Tags</title>\n\
    </head>\n<body>\n<h3>书籍信息：</h3>\n\n<c:set var=\"xmltext\">\n<books>\n<book>\n\
