    # 1. JSP – Overview


    ## What is JavaServer Pages?


    JavaServer Pages (JSP) is a technology for developing Webpages that supports dynamic
    content. This helps developers insert Java code in HTML pages by making use of
    special JSP tags, most of which start with <% and end with %>.


    A JavaServer Pages component is a type of Servlet which is designed to fulfill
    the role of a user interface for a Java web application. Developers write JSP
    as text files that combine HTML or XHTML code, XML elements, and embedded JSP
    actions and commands.


    Using JSP, you can collect input from users through Webpage forms, present records
    from a database or other source, and create Webpages dynamically.


    JSP tags can be used for a variety of purposes, such as retrieving information
    from a database or registering user preferences, accessing JavaBeans, passing
    control between pages, and sharing information between requests, pages etc.


    ## Why Use JSP?


    JavaServer Pages often serve the same purpose as programs implemented using the
    Common Gateway Interface (CGI). But JSP offers several advantages in comparison
    with the CGI.


    - Performance is significantly better because JSP allows embedding Dynamic Elements
    in HTML Pages itself instead of having separate CGI files.

    - JSP are always compiled before they are processed by the server unlike CGI/Perl
    which requires the server to load an interpreter and the target script each time
    the page is requested.

    - JavaServer Pages are built on top of the Java Servlets API, like Servlets, JSP
    also has access to all the powerful Java APIs, including JDBC, JNDI, EJB, JAXP,
    etc.

    - JSP pages can be used in combination with servlets that handle the business
    logic, the model supported by Java servlet templates.


    Finally, JSP is an integral part of Java EE, a complete platform for enterprise
    applications. This means that JSP can play a part in the simplest applications
    to the most complex and demanding.


    ![](img/5626302a090fb89f52cde01d391f8bdc_11_0.png)


    ## Advantages of JSP


    Following is the list of other advantages of using JSP over other technologies:


    ### vs. Active Server Pages (ASP)


    The advantages of JSP are twofold. First, the dynamic part is written in Java,
    not Visual Basic or other MS specific language, so it is more powerful and easier
    to use. Second, it is portable to other operating systems and non-Microsoft Web
    servers.


    ### vs. Pure Servlets


    It is more convenient to write (and modify) HTML than to have Servlets.


    ### vs. Server-Side Includes (SSI)


    SSI is really intended for simple inclusions, not for "real" programs.


    ### vs. JavaScript


    JavaScript can generate HTML on the client but hardly interact with the server.


    ### vs. Static HTML


    Regular HTML cannot contain dynamic information.


    ### What is Next?


    I would take you step by step to set up your environment. If you are not aware
    of Java Programming, then we would recommend you go through our Tutorial to understand.


    ![](img/5626302a090fb89f52cde01d391f8bdc_12_0.png)


    # 2. JSP — Environment Setup


    A development environment is where you develop your JSP programs, test them and
    finally run them. This tutorial will guide you to set up your environment which
    involves the following steps:


    ### Setting up Java Development Kit


    This step involves downloading an implementation of the Java Development Kit (SDK)
    and setting up the PATH variable.


    You can download SDK from Oracle''s site: Java SE Downloads.


    Once you download your implementation, follow the given instructions to install
    and configure the setup. Finally set the PATH and JAVA_HOME environment variables
    to refer to the directory that contains java and javac, java_dir/bin and respectively.


    If you are running Windows and install the SDK in C:\jdk1.5.0_20, you need to
    add the following line in your C:\autoexec.bat file.


    ```batch

    set PATH=C:\jdk1.5.0_20\bin;%PATH%

    set JAVA_HOME=C:\jdk1.5.0_20

    ```


    Alternatively, on Windows NT/2000/XP, you can also right-click on My Computer,
    select Properties, then Advanced, followed by Environment Variables. Then, you
    would update the PATH value and press the OK button.


    On Unix (Solaris, Linux, etc.), if the SDK is installed in /usr/local/jdk1.5.0_20
    and you use the C shell, put the following into your .cshrc


    ```bash

    setenv PATH /usr/local/jdk1.5.0_20/bin:$PATH

    setenv JAVA_HOME /usr/local/jdk1.5.0_20

    ```


    Alternatively, if you use an Integrated Development Environment (IDE) like Borland
    JBuilder, Eclipse, IntelliJ IDEA, or Sun One Studio, compile and run a simple
    program to confirm that the IDE knows you installed Java.


    ### Setting up Web Server: Tomcat


    A number of Web Servers that support Java Pages and Servlets development are available
    in the market. Some web servers can be downloaded for free and Tomcat is one of
    them.


    Apache Tomcat is an open source software implementation of the Java Pages and
    Servlet technologies and can act as a standalone server for testing JSP and Servlets,

