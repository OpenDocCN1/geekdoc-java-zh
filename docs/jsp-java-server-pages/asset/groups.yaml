    # # Setting Cookies with JSP


    Setting cookies with JSP involves three steps:


    **(1) Creating a Cookie object:** You call the Cookie constructor with a cookie
    name and a cookie value, both of which are strings.


    ```

    cookie cookie = new Cookie("key","value");

    ```


    Keep in mind, neither the name nor the value should contain white space or any
    of the following characters:


    ```

    [ ] ) = " " / ? @ : ;

    ```


    **(2) Setting the maximum age:** Use setMaxAge to specify how long (in seconds)
    the cookie should be valid. The following code will set up a cookie for 24 hours.


    ```

    cookie.setMaxAge(60*60*24);

    ```'
