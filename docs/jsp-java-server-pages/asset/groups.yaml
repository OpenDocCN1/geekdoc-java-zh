    \ 文档永远不应缓存。 |\n| Connection | 此头部指示浏览器是否使用持久 HTTP 连接。值 close 指示浏览器不使用持久 HTTP 连接，keep-alive\
    \ 意味着使用持久连接。 |\n| Content-Disposition | 此头部允许你请求浏览器将响应保存为磁盘上指定名称的文件。 |\n| Content-Encoding\
    \ | 此头部指定了页面用于传输的编码方式。 |\n| Content-Language | 此头部标识页面编写时使用的语言。 |\n| Content-Length\
    \ | 此头部指示响应体中的字节数。 |\n| Content-Type | 此头部给出响应的 MIME 类型。 |\n| Expires | 此头部指定了内容被视为过期的日期。\
    \ |\n| Last-Modified | 此头部指示文档最后一次更改的时间。 |\n| Location | 此头部指定了重定向地址。 |\n| Refresh\
    \ | 此头部指定了浏览器在多少秒后应该刷新。 |\n| Retry-After | 此头部可以与 503（服务不可用）响应配合使用。 |\n| Set-Cookie\
    \ | 此头部指定了与响应相关的 cookie。 |\n\n# JSP\n\n# HttpServletResponse\n\n响应对象是 `javax.servlet.http.HttpServletResponse`\
    \ 的实例。正如服务器创建请求对象一样，它也会为客户端创建响应。\n\n可以使用以下方法设置 HTTP 头部、日期或状态码。\n\n| 序号 | 方法与描述\
