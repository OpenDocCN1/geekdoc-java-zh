    # #<jsp:text> Action


    The <jsp:text> action can be used to write the template text in JSP pages and
    documents. Following is the simple syntax for this action:


    ```

    <jsp:text>Template data</jsp:text>

    ```


    The body of the template cannot contain other elements; it can only contain text
    and EL expressions (EL expressions are expressed in a subsequent chapter). Note
    that in XML files, you cannot use expressions such as ${whatever gt 0}, because
    the greater signs are illegal. Instead, use the gt form, such as ${whatever gt
    0} or an alternative is to embed the value in a CDATA section.


