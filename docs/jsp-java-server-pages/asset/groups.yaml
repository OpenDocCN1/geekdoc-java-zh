    \ %></title>\n</head>\n<body>\n<center>\n<h1><% out.print(title); %></h</h1>\n\
    </center>\n<div align=\"center\">\n<p>Formatted Currency: <% out.print(formattedCurr);\
    \ %></p>\n</div>\n</body>\n</html>\n```\n\n## 区域特定百分比\n\n你可以使用 java.text.NumberFormat\
    \ 类及其静态方法 getPercentInstance() 获取特定区域的百分比。以下示例展示了如何将百分比格式化为特定区域：\n\n```jsp\n<@page\
    \ import=\"java.io.*,java.util.Locale\" %>\n<@page import=\"javax.servlet.*,javax.servlet.http.*\"\
    \ %>\n<@page import=\"java.text.NumberFormat,java.util.Date\" %>\n\n<%\nString\
    \ title = \"Locale Specific Percentage\";\n//Get the client's Locale\nLocale locale\
    \ = request.getLocale();\nNumberFormat nft = NumberFormat.getPercentInstance(locale);\n\
    String formattedPerc = nft.format(0.51);\n%>\n<html>\n<head>\n<title><% out.print(title);\
    \ %></title>\n</head>\n<body>\n<center>\n<h1><% out.print(title); %></h</h1>\n\
    </center>\n<div align=\"center\">\n<p>Formatted Percentage: <% out.print(formattedPerc);\
    \ %></p>\n</div>\n</body>\n</html>\n```\n\n"
