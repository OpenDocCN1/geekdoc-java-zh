    <head>\n  <title>JSTL x:parse Tags</title>\n</head>\n<body>\n  <h3>Books Info</h3>\n\
    \  <c:import var=\"booksInfo\" url=\"http://localhost:8080/books.xml\"/>\n  <x:parse\
    \ xml=\"${booksInfo}\" var=\"output\"/>\n  <b>The title of the first book is</b><c:out\
    \ select=\"$output/books/book[1]/name\" />\n  <br/>\n  <b>The price of the second\
    \ book is</b>\n  <c:out select=\"$output/books/book[2]/price\" />\n</body>\n</html>\n\
    ```\n\nAccess the above JSP using http://localhost:8080/main.jsp, the following\
    \ result will be displayed:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_238_0.png)\n"
