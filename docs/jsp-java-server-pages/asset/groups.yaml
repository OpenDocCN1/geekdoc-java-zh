    正如在前面的节中讨论的那样，你可以在 JSP 脚本中使用所有可用的 Java 方法。如果你需要比较两个日期，请考虑以下方法：\n\n- 你可以使用 `getTime()`\
    \ 方法来获取自 1970 年 1 月 1 日午夜以来经过的毫秒数，然后比较这两个值。\n- 你可以使用 `before()`、`after()` 和 `equals()`\
