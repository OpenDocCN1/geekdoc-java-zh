    Following table lists out the SQL JSTL Tags:


    | Tag | Description |

    | --- | --- |

    | <sql:setDataSource> | Creates a simple DataSource suitable only for prototyping
    |

    | <sql:query> | Executes the SQL query defined in its body or through the SQL
    attribute. |

    | <sql:update> | Executes the SQL update defined in its body or through the SQL
    attribute. |

    | <sql:param> | Sets a parameter in an SQL statement to the specified value. |

    | <sql:dateParam> | Sets a parameter in an SQL statement to the specified Java.util.Date
    value. |

    | <sql:transaction> | Provides nested database action elements with a shared Connection,
    up to execute all statements as one transaction. |


    # JSTL SQL <sql:setDataSource> Tag


    The <sql:setDataSource> tag sets the data source configuration variable or saves
    the data-source information in a scoped variable that can be used as input to
    the JSTL database actions.


    # Attribute


    The <sql:setDataSource> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | --- | --- | --- | --- |

    | driver | Name of the JDBC driver class to be registered | No | None |

    | url | JDBC URL for the database connection | No | None |

    | user | Database username | No | None |

    | password | Database password | No | None |

    | password | Database password | No | None |


    ![](img/5626302a090fb89f52cde01d391f8bdc_172_0.png)'
