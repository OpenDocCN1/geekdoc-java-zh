    \ %></title>\n</head>\n<body>\n<center>\n<h1><% out.print(title); %></h</h1>\n\
    </center>\n<div align=\"center\">\n<p>Formatted Percentage: <% out.print(formattedPerc);\
    \ %></p>\n</div>\n</body>\n</html>\n```\n"
