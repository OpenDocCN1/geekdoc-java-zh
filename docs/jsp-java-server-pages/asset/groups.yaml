    String formattedCurr = nft.format(1000000);\n%>\n<html>\n<head>\n<title><% out.print(title);\
    \ %></title>\n</head>\n<body>\n<center>\n<h1><% out.print(title); %></h>\n</center>\n\
    <div align=\"center\">\n<p>Formatted Currency: <% out.print(formattedCurr); %></p>\n\
    </div>\n</body>\n</html>\n```\n\n## Locale Specific Percentage\n\nYou can use\
    \ the java.text.NumberFormat class and its static getPercentInstance() method\
    \ to get locale specific percentage. Following example shows how to format percentage\
    \ to a given locale:\n\n```jsp\n<@page import=\"java.io.*,java.util.Locale\" %>\n\
    <@page import=\"javax.servlet.*,javax.servlet.http.*\" %>\n<@page import=\"java.text.NumberFormat,java.util.Date\"\
    \ %>\n\n<%\nString title = \"Locale Specific Percentage\";\n//Get the client's\
    \ Locale\nLocale locale = request.getLocale();\nNumberFormat nft = NumberFormat.getPercentInstance(locale);\n\
