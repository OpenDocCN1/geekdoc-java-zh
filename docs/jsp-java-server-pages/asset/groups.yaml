    \ |\n| 410 | Gone | The requested page is no longer available. |\n| 411 | Length\
    \ Required | Content-Length is defined. |\n| 412 | Precondition Failed | The precondition\
    \ given in the request evaluated to false. |\n| 413 | Entity Too Large | The entity\
    \ is too large. |\n| 414 | URI Too Long | The url is too long. |\n| 415 | Unsupported\
    \ Media Type | The media type is not supported. |\n| 417 | Expectation Failed\
    \ | The expectation was not met. |\n| 500 | Internal Server Error | The server\
    \ met an unexpected condition. |\n| 501 | Not Implemented | The server did not\
    \ support the functionality. |\n| 502 | Bad Gateway | The server received an invalid\
