    # 6. JSP – Directives


    In this chapter, we will divuss Directives in JSP. These directives provide directions
    and instructions to the container, telling it how to handle certain aspects of
    the JSP processing.


    A JSP directive affects the overall structure of the servlet class. It usually
    has the following form:


    ```

    <@% directive attribute="value" %>

    ```


    Directives can have a number of attributes which you can list down as key-value
    pairs separated by commas,


    The blanks between the @ symbol and the directive name, and between the last attribute
    and the closing %>, are optional.


    There are three types of directive tag:


    | Directive | Description |

    | --- | --- |

    | <@% page ... %> | Defines page-dependent attributes, such as scripting language,
    error page, and buffering requirements. |

    | <@% include ... %> | Includes a file during the translation phase. |

    | <@% taglib ... %> | Declares a tag library, containing custom actions, used
    in the page |


    # The page Directive


    The page directive is used to provide instructions to the container. These instructions
    pertain to the current JSP page. You may code page directives anywhere in your
    JSP page. By convention, page directives are coded at the top of the JSP page.


    Following is the basic syntax of the page directive:


    ```

    <@% page attribute="value" %>

    ```


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsp:directive.page attribute="value" />

    ```'
