    ## JSTL fn:indexOf() Function


    The fn:indexOf() function returns the index within a string of the first occurrence
    of a specified substring.


    ## Syntax


    The fn:indexOf() function has the following syntax:


    ```

    int indexOf(java.lang.String, java.lang.String)

    ```


    ## Example


