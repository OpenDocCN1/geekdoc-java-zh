    # JSTL Core <c:choose>, <c:when>, <c:otherwise> Tag


    The <c:choose> works like a Java switch statement. It chooses between a number
    of alternatives. Where the switch statement has the case statements, the <c:choose>
    tag has the <c:when> tags. A statement has the default clause to specify a default
    action, the <c:choose> as the <c:otherwise> tag as the default clause.


    # Attribute


    +   - <c:choose> tag does not have any attribute.

    - <c:when> tag has one attributes which is listed below.

    - <c:otherwise> tag does not have any attribute.


    The <c:when> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---|--|\| test | Condition to evaluate | Yes | None |


    # Example


    ```

    <@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c %>

    <html>

    <head>

    <title>c:choose> Tag Example</title>

    </head>

    <body>

    <c:set var="salary" scope="session" value="${2000*2}" />

    <p>Your salary is : <c:out value="${salary}\/></p>

    <c:choose>

    <c:when test="${salary <= 0}>

    Salary is very low to survive.

    </c:when>

    <c:when test="${salary > 1000}">

    ```


