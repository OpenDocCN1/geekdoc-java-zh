    \n## Languages Setting\n\nA JSP can output a page written in a Western European\
    \ language such as English, Spanish, German, French, Italian, Dutch each. Here\
    \ it is important to set Content-Language header to display all the characters\
    \ properly.\n\nAnother important point is to display all the special characters\
    \ using HTML entities; for example, \"&#241;\" represents \"ñ\", and \"&#161;\"\
    \ represents \"i\" as follows:\n\n```jsp\n<@ page import=\"java.*,java.util.Locale\"\
    \ %>\n<@ page import=\"javax.servlet,javax.servlet.http.* %>\n<%\n  // Set response\
    \ content type\n  response.setContentType(\"text/html\");\n  // Set spanish language\
    \ code.\n  response.setHeader(\"Content-Language\", \"es\");\n  String title =\
    \ \"En Español\";\n%>\n<html>\n<head>\n<title><% out.print(title); %></title>\n\
    </head>\n<body>\n<center>\n<h1><% out.print(title); % ></</h1>\n</center>\n<div\
    \ align=\"center\">\n<p>En Español</p>\n<p>¡Hola Mundo!</p>\n</div>\n</body>\n\
    </html>\n```\n\n## Locale Specific Dates\n\nYou can use the java.text.DateFormat\
    \ class and its static getDateTimeInstance() method to format date and time specific\
    \ to locale. Following is the example which shows how to format date specific\
    \ to a locale:\n\n```jsp\n<@ page import=\"java.io.*,java.util.Locale\" %>\n<@\
    \ page import=\"javax.servlet.*,javax.servlet.http.*\" %>\n<@ page import=\"java.text.DateFormat,java.util.Date\"\
    \ %>\n\n<%\nString title = \"Locale Specific Dates\";\n//Get the client's Locale\n\
    Locale locale = request.getLocale();\nString date = DateFormat.getTimeInstance(\n\
    DateFormat.FULL,\nDateFormat.SHORT,\nlocale).format(new Date());\n%>\n\n<html>\n\
    <head>\n<title><% out.print(title); %></title>\n</head>\n<body>\n<center>\n<h1><%\
    \ out.print(title); % ></</h1>\n</center>\n<div align=\"center\">\n<p>Local Date:\
    \ <% out.print(date); %></p>\n</div>\n</body>\n</html>\n```\n\n## Locale Specific\
    \ Currency\n\nYou can use the java.text.NumberFormat class and its static getCurrencyInstance()\
    \ method to format a number, such as a long or double type, in a locale specific\
