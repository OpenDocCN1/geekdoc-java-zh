    \ url=\"http://localhost:8080/books.xml\"/>\n\n<x:parse xml=\"${bookInfo}\" var=\"\
    output\"/>\n<b>The title of the first book is</b>\n<x:out select=\"$output/books/book[1]/name\"\
    \ />\n<br>\n<b>The price of the second book</b>\n<x:out select=\"$output/books/book[2]/price\"\
    \ />\n\n</body>\n</html>\n```\n\nAccess the above JSP using http://localhost:8080/main.jsp,\
    \ the following result will be displayed:\n\nBooks Info:\nThe title of the first\
    \ book is: Padam History\nThe price of the second book: 2000\n\n## JSTL XML <x:set>\
    \ Tag\n\nThe <x:set> tag sets a variable to the value of an XPath expression.\n\
    \nIf the XPath expression results in a boolean, <x:set> tags a java.lang.Boolean\
    \ object; for a string, java.lang.String; and for a number, java.lang.Number.\n\
    \n## Attribute\n\nThe <x:set> tag has the following attributes:\n\n| Attribute\
    \ | Description | Required | Default |\n|---|---|---|---|\n| var | A variable\
    \ that is set to the value of the XPath expression | Yes | Body |\n| select |\
    \ The XPath expression to be evaluated | No | None |\n| scope | Scope of the variable\
