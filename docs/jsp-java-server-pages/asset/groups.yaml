    Let us now put the code in main.jsp and call this JSP using the URL http://localhost:8080/main.jsp.
    This will display the hit counter value which increases as and when you refresh
    the page. You can try accessing the page using different browsers and you will
    find that the hit counter keep increasing with every hit and you will receive
    the result as follows:


    Welcome back to my website!

    Total number of visits: 12


    # Hit Counter Resets


    What when you restart your application, i.e., web server, this will reset your
    application variable and your counter will reset to zero. To avoid this loss,
    consider the following points:


    +   - Define a database table with a single count, let us say hitcount. Assign
    a zero value to it.

    - With every hit, read the table to get the value of hitcount.

    - Increase the value of hitcount by one and update the table with new value.

    - Display new value of hitcount as total page counts.

    - If you want to count hits for all the pages, implement above logic for all the
    pages.


