  mdcn: "\nServlet 中的 `getMaxInactiveInterval( )` 方法返回该会话的超时时间（单位为秒）。因此如果你在 `web.xml`\
    \ 中配置会话为 15 分钟，`getMaxInactiveInterval( )` 将返回 900。\n\n在本章中，我们将讨论 JSP 中的文件上传。JSP\
    \ 可以与 HTML 表单标签配合使用，允许用户将文件上传到服务器。上传的文件可以是文本文件、二进制文件、图像或任何文档。\n\n## 创建文件上传表单\n\
    \n现在让我们了解如何创建一个文件上传表单。以下 HTML 代码创建了一个上传表单。以下是需要注意的重要点：\n\n- 表单的 `method` 应该设置为\
    \ `POST`，而不应使用 GET 方法。\n- 表单的 `enctype` 属性应设置为 `multipart/form-data`。\n- 表单的 `action`\
    \ 属性应设置为一个 JSP 文件，该文件将在后端服务器处理上传。示例是使用 `uploadFile.jsp` 程序文件进行上传。\n- 要上传单个文件，应使用带有\
    \ `type=\"file\"` 属性的单个 `<input .../>` 标签。要上传多个文件，请包含多个具有不同 `name` 属性值的 input\
    \ 标签。浏览器会为每个标签关联一个“浏览”按钮。\n\n```\n<html\n<head>\n<title>File Uploading Form</title>\n\
    </head>\n<body>\n<<h3>File Upload:</h3>\nSelect a file to upload: <br />\n<form\
    \ action=\"UploadServlet\" method=\"post\"\nctype=\"multipart/form-data\">\n<input\
    \ type=\"file\" name=\"file\" size=\"50\" />\n<br />\n<input type=\"submit\" value=\"\
    Upload File\" />\n</form>\n</body>\n</html>\n```\n\n这将显示如下结果所示。你现在可以从本地 PC 选择一个文件，当用户点击“Upload\
    \ File”时，表单将同所选的文件一起提交：\n\nFile Upload:\n\nSelect a file to upload:\n\nChoose\
    \ File No file chosen\n\nUpload File\n\n注意：上面的表单只是一个示例表单且无法工作；你应该在自己的机器上尝试上述代码以使其生效。\n\
    \n## 编写后端 JSP 脚本\n\n让我们定义一个存储上传文件的位置。你可以在程序中硬编码此路径，也可以通过外部配置（使用 `web.xml` 中的 `context-param`\
    \ 元素）添加此目录名，如下：\n\n```\n<web-app>\n...\n<context-param>\n  <description>Location\
    \ to store uploaded file</description>\n  <param-name>file-upload</param-name>\n\
    \  <param-value>\n    c:\\apache-tomcat-5.5.29\\webapp\\data\\\n  </param-value>\n\
    </context-param>\n...\n</web-app>\n```\n\n以下是 `UploadFile.jsp` 的源代码。它可以同时处理多个文件的上传。现在让我们在上传文件之前考虑以下几点：\n\
    \n- 下面的示例依赖于 `FileUpload`；确保你的 classpath 中最新版本的 `commons-fileupload-x.x.jar`。你可以从\
    \ http://commons.apache.org/fileupload/ 下载它。\n- `FileUpload` 依赖 `Commons IO`；确保你的\
    \ classpath 中最新版本的 `commons-io-x.x.jar`。你可以从 http://commons.apache.org/io/ 下载它。\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_106_0.png)\n\n- 在测试以下示例时，你上传的文件大小应小于\
    \ `maxFileSize`，否则文件将无法上传。\n- 确保你已经提前创建了 `c:\\temp` 和 `c:\\apache-tomcat-5.5.29\\\
    webapp\\data` 目录。\n\n```\n<%@ page import=\"java.io.*, java.util.*, javax.servlet.*\"\
    \ %>\n<%@ page import=\"java.servlet.http.*\" %>\n<%@ page import=\"org.apache.commons.fileupload.*\"\
    \ %>\n<%@ page import=\"org.apache.commons.fileupload.disk.*\" %>\n<%@ page import=\"\
    org.apache.commons.fileupload.servlet.*\" %>\n<%@ page import=\"org.apache.commons.io.output.*\"\
    \ %>\n\n\nFile file;\nint maxFileSize = 5000 * 1024;\nint maxMemSize = 5000 *\
    \ 1024;\nServletContext context = pageContext.getServletContext();\nString filePath\
    \ = context.getParameter(\"file-upload\");\n\n// 验证内容类型\nString contentType =\
    \ request.getContentType();\nif ((contentType.indexOf(\"multipart/form-data\"\
    ) >= 0) {\n\nDiskFileItemFactory factory = new DiskFileItemFactory();\n// 存储在内存中的最大大小\n\
    factory.setSizeThreshold(maxMemSize);\n// 存储大于 maxMemSize 数据的位置\nfactory.setRepository(new\
    \ File(\"c:\\\\temp\"));\n\n// 创建一个新的文件上传处理器\nServletFileUpload upload = new ServletFileUpload(factory);\n\
    // 最大上传文件大小\nupload.setMaxSize(maxFileSize);\ntry{\n\n// 解析请求以获取文件项。\nList fileItems\
    \ = upload.parseRequest(request);\n\n// 处理上传的文件项\nIterator i = fileItems.iterator();\n\
    ```\n\n```java\nout.println(\"<html>\");\nout.println(\"<head>\");\nout.println(\"\
    <title>JSP File upload</title>\");\nout.println(\"</head>\");\nout.println(\"\
    <body>\");\nwhile ( i.hasNext() )\n{\n    FileItem fi = (FileItem)i.next();\n\
    \    if ( !fi.isFormField() )\n    {\n        // 获取表单字段\n        String fileName\
    \ = fi.getFileName();\n        String fileName = fi.getName();\n        boolean\
    \ isInMemory = fi.isInMemory();\n        long sizeInBytes = fi.getSize();\n  \
    \      // 写入文件\n        if(fileName(\"\\\\\n```\n\n现在使用你创建的 HTML 表单尝试上传文件。当你访问\
    \ http://localhost:8080/UploadFile.htm 时，将显示如下结果。这将帮助你从本地机器上传。\n\n![](img/5626302a090fb89f52cde01d391f8bdc_109_0.png)\n\
    \n如果你的 JSP 脚本正常工作，文件应该位于 c:\\apache-tomcat-5.5.29\\webapp\\data。\n\n## JSP — 处理日期\n\
    \n在本章中，我们将讨论如何处理日期。使用 JSP 的主要优势之一是可以使用 java.util 中的所有方法。Date 类支持两个构造函数。第一个构造函数初始化对象为当前日期。\n\
    \n```\nDate()\n```\n\n一旦有了 Date 对象，就可以调用以下方法：\n\n| 序号 | 方法 |\n|---|---|\n| 1 |\
    \ boolean after(Date date) 如果调用对象包含比指定日期晚的日期则返回 true，否则返回 false。 |\n| 2 | boolean\
    \ before(Date date) 如果调用对象包含比指定日期早的日期则返回 true，否则返回 false。 |\n| 3 | Object clone()\
    \ 复制调用 Date 对象。 |\n| 4 | int compareTo(Date date) 比较调用对象的值与 date 值。如果值相等返回 0。如果调用对象早于\
    \ date返回负值。如果调用对象晚于 date返回正值。 |\n| 5 | int compareTo(Object obj) 如果 obj 是 Date\
    \ 类，则操作方式与 compareTo(Date) 相同。否则抛出 ClassCastException。 |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_110_0.png)\n\
    \n| 6 | boolean equals(Object date) 如果调用对象包含与指定日期相同的时间则返回 true，否则返回 false。 |\n\
    | 7 | long getTime() 返回自 1970 年 1 月 1 日以来经过的毫秒数。 |\n| 8 | int hashCode() 返回调用对象的哈希码。\
    \ |\n| 9 | void setTime(long time) 设置日期和时间为指定的时间，该时间表示自 1970 年 1 月 1 日午夜以来的毫秒数。\
    \ |\n| 10 | String toString() 将调用 Date 对象转换为字符串并返回结果。 |\n\n## 获取当前日期和时间\n\n使用\
    \ JSP 程序获取当前日期和时间非常简单。你可以使用简单的 Date 对象配合 toString() 方法如下所示打印当前日期和时间：\n\n```jsp\n\
    <%@ page import=\"java.io.*,java.util.*, javax.servlet.*\" %>\n<html>\n<head>\n\
    <title>Display Current Date & Time</title>\n</head>\n<body>\n<center>\n<h1>Display\
    \ Current Date & Time</h1>\n</center>\n<%\nDate date = new Date();\nout.print(\"\
    <h2 align=\\\"center\\\">\" + date.toString() + \"</h2>\");\n%>\n</body>\n</html>\n\
    ```\n\n"
