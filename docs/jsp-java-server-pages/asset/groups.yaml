    \n| connection | Keep-Alive |\n| --- | --- |\n| cache-control | no-cache |\n\n\
    You can try working on all the methods in a similar way.\n\nIn this chapter, we\
    \ will discuss the Server Response in JSP. When a Web server responds to a HTTP\
    \ request, the response typically consists of a status line, some response headers,\
    \ a blank line, and the document. A typical response looks like this:\n\n```\n\
    HTTP/1.1 200 OK\nContent-Type: text/html\nHeader2: ...\n...\nHeader: ...\n(Blank\
    \ Line)\n<!doctype ...>\n<html>\n<head>...</head>\n<body>\n...\n</body>\n</html>\n\
    ```\n\nThe status line consists of the HTTP version (HTTP/1.1 in the example),\
    \ a status code (200 in the example), and a very short message corresponding to\
    \ the status code (OK in the example).\n\nFollowing is a summary of the most useful\
    \ HTTP 1.1 response headers which go back to the browser of the web server. These\
    \ headers are frequently used in web programming:\n\n| Header | Description |\n\
    |---|---|\n| Allow | This header specifies the request methods (GET, POST, etc.)\
    \ that the server supports. |\n| Cache-Control | This header specifies the circumstances\
    \ in which the response document can safely be cached. It can have values private\
    \ or no-cache etc. Public means document is cacheable, Private means document\
    \ is for a single user and can only be stored in private (nonshared) caches and\
    \ no-cache document should never be cached. |\n| Connection | This header instructs\
    \ the browser whether to use persistent HTTP connections or not. A value of close\
    \ instructs the browser not to use persistent HTTP connections and keep-alive\
    \ means using persistent connections. |\n| Content-Disposition | This header lets\
    \ you request that the browser ask to save the response to disk in a file of the\
    \ given name. |\n| Content-Encoding | This header specifies the way in which the\
    \ page was encoded for transmission. |\n| Content-Language | This header signifies\
    \ the language in which the page is written. |\n| Content-Length | This header\
    \ indicates the number of bytes in the response body. |\n| Content-Type | This\
    \ header gives the MIME type of the response. |\n| Expires | This header specifies\
    \ the date at which the content should be considered outdated. |\n| Last-Modified\
    \ | This header indicates when the document was last changed. |\n| Location |\
    \ This header specifies the address of the redirect. |\n| Refresh | This header\
    \ specifies how many seconds after which the browser should refresh. |\n| Retry-After\
    \ | This header can be used in conjunction with 503 (Service Unavailable) responses.\
    \ |\n| Set-Cookie | This header specifies a cookie associated with the response.\
    \ |\n\n# JSP\n\n# HttpServletResponse\n\nThe response object is an instance of\
    \ `javax.servlet.http.HttpServletResponse`. Just as the server creates the request\
    \ object, it also creates the response to the client.\n\nThe following methods\
    \ can be used to set HTTP headers, dates, or status codes.\n\n| S.NO. | Method\
    \ & Description |\n| 1 | **String encodeRedirect(String url)** Encodes the specified\
    \ URL for use in `sendRedirect` or, if encoding is needed, returns the URL unchanged.\
    \ |\n| 2 | **String encodeURL(String url)** Encodes the specified URL by including\
    \ the session ID in it, or, if encoding is needed, returns the URL unchanged.\
    \ |\n| 3 | **boolean containsHeader(String name)** Returns a boolean indicating\
    \ whether the named response header has already been set. |\n| 4 | **boolean isCommitted()**\
    \ Returns a boolean indicating if the response has been committed. |\n| 5 | **void\
    \ addCookie(Cookie cookie)** Adds the specified cookie to the response. |\n| 6\
    \ | **void addHeader(String name, long date)** Adds a response header with the\
    \ given name and date-value. |\n| 7 | **void addHeader(String name, String value)**\
    \ Adds a response header with the given name and value. |\n| 8 | **void addIntHeader(String\
    \ name, int value)** Adds a response header with the given name and integer value.\
    \ |\n| 9 | **void flushBuffer()** Forces any content in the buffer to be written\
    \ to the client. |\n| 10 | **void reset()** Clears any data that exists in the\
    \ buffer as well as the status code and headers. |\n| 11 | **void resetBuffer()**\
    \ Clears the content of the underlying buffer in the response without clearing\
    \ headers or status code. |\n| 12 | **void sendError(int sc)** Sends an error\
    \ response to the client using the specified status code and clearing the buffer.\
    \ |\n| 13 | **void sendError(int sc, String msg)** Sends an error response to\
    \ the client using the specified status and message. |\n| 14 | **void sendRedirect(String\
    \ location)** Sends a temporary redirect response to the client using the specified\
    \ redirect location URL. |\n| 15 | **void setBufferSize(int size)** Sets the preferred\
    \ buffer size for the body of the response. |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_67_0.png)\n"
