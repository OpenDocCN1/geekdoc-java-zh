    \n# 22. JSP – Standard Tag Library (JSTL) Tutorial\n\nIn this chapter, we will\
    \ understand the different tags in JSP. The JavaServer Pages Standard Tag Library\
    \ (JSTL) is a collection of useful JSP tags which encapsulates the core functionality\
    \ common to many JSP applications.\n\nJSTL has support for common, structural\
    \ tasks such as iteration and conditionals, tags for manipulating XML documents,\
    \ internationalization tags, and SQL tags. It also provides a framework for integrating\
    \ the custom tags with the JSTL tags.\n\n# Install JSTL Library\n\nTo begin working\
    \ with JSP tags you need to first install the JSTL library. If you are using the\
    \ Apache Tomcat container, follow these two steps:\n\n**Step 1**: Download the\
    \ binary distribution from Apache Standard Taglib and unpack the compressed file.\n\
    \n**Step 2**: To use the Standard Taglib from its Jakarta Taglibs distribution,\
    \ simply copy the JAR files in the distribution's 'ROOT/WEB-INF' directory to\
    \ your application's webapps directory.\n\nTo use any of the libraries, you must\
    \ include a <taglib> directive at the top of each JSP that uses the library.\n\
    \n# Classification of The JSTL Tags\n\nThe JSTL tags can be classified, according\
    \ to their functions, into the following JSTL library groups that can be used\
    \ when creating a JSP page:\n\n- Core Tags\n- Formatting tags\n- SQL tags\n- XML\
    \ tags\n- JSTL Functions\n\n# Core Tags\n\nThe core group of tags are the most\
    \ commonly used JSTL tags. Following is the syntax to include the JSTL Core library\
    \ in your JSP:\n\n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_130_0.png)\n\nFollowing\
    \ lists lists out the core JSTL Tags:\n\n| Tag | Description |\n|---|---|\n| <c:out\
    \ > | Like<%= ... %>, but for expressions. |\n| <c:set > | Sets the result of\
    \ an expression evaluation in a 'scope' |\n| <c:remove > | Removes a _scoped variable_\
    \ (from a particular scope, if specified). |\n| <c:catch> | Catches any _Throwable_\
    \ that occurs in its body and optionally exposes it. |\n| <c:if> | Simple conditional\
    \ tag that evaluates its body if the supplied condition is true. |\n| <c:choose>\
    \ | Simple conditional tag that establishes a context for mutually exclusive conditional\
    \ operations, marked by <when> and <otherwise>. |\n| <c:when> | Subtag of <choose>\
    \ that includes its body if its condition evaluates to 'true'. |\n| <c:otherwise\
    \ > | Subtag of <choose> that follows the <when> tags and runs only if all of\
    \ the prior conditions evaluated to 'false'. |\n| <c:import> | Retrieves an absolute\
    \ or relative URL and exposes its contents to either the page, a String in 'var',\
    \ or a Reader in _varReader_. |\n| <c:forEach > | The basic iteration tag, accepting\
    \ many collection types and supporting subsetting and other functionality. |\n\
    | <c:forTokens> | Iterates over tokens, separated by a supplied delimiters. |\n\
    | <c:param> | Adds a parameter to a containing 'import' tag's URL. |\n| <c:url>\
    \ | Creates a URL with optional query parameters |\n\n# JSTL Core <c:out> Tag\n\
    \nThe <c:out> tag can automatically escape XML tags so they aren't evaluated as\
    \ actual tags.\n\n# Attribute\n\nThe <c:out> tag has the following attributes:\n\
    \n| Attribute | Description | Required | Default |\n|---|---|---|---|\n| value\
    \ | Information to output | Yes | None |\n| default | Fallback information to\
    \ output | No | body |\n| escapeXml | True if the tag should escape special XML\
    \ characters | No | true |\n\n# Example\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:out> Tag Example</title>\n</head>\n\
    <body>\n<c:out value=\"${tag}\" />\n</body>\n</html>\n```\n\nThe above code will\
    \ produce the following result:\n\n```html\n<tag>\n```\n\n# JSTL Core <c:set>\
    \ Tag\n\nThe <c:set> tag is a JSTL-friendly version of the set action. The tag\
    \ is helpful because it evaluates an expression and uses the results to set a\
    \ value of a java.util.Map object.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_132_0.png)\n\
    \n# Attribute\n\nThe <c:set> tag has following attributes:\n\n| Attribute | Description\
    \ | Required | Default |\n|---|---|---|---|\n| value | Information to save | No\
    \ | body |\n| target | Name of the variable whose property should be modified\
    \ | No | None |\n| property | Property to modify | No | None |\n| var | Name of\
    \ the variable to store | No | None |\n| scope | Scope of variable to store |\
    \ No | page |\n\nIf target is specified, property must also be specified.\n\n\
    # Example\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title><c:set> Tag</title>\n</head>\n<body>\n<c:set var=\"\
    salary\" scope=\"session\" value=\"${2000*2}\"/>\n<c:out value=\"${salary}\"/>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following result:\n\n\
    ```\n4000\n```\n\n# JSTL Core <c:remove> Tag\n\nThe <c:remove> tag removes a variable\
    \ from either a specified scope or the first scope where the variable is found\
    \ (if scope is specified). This action is not particularly helpful, but it can\
    \ aid in ensuring JSP cleans up any resources.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_133_0.png)\n\
    \n# Attribute\n\nThe <c:remove> tag has the following attributes:\n\n| Attribute\
    \ | Description | Required | Default |\n|---|---|---|---|\n| var | Name of the\
    \ variable to remove | Yes | None |\n| scope | Scope of the variable to remove\
    \ | No | All scopes |\n\n# Example\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:remove> Tag</title>\n</head>\n<body>\n\
    <c:set var=\"salary\" scope=\"session\" value=\"${2000*2}\"/>\n<p>Before Remove\
    \ Value: <c:out value=\"${salary}\"></p>\n<c:remove var=\"salary\"/>\n<p>After\
    \ Remove Value: <c:out value=\"${salary}\"></p>\n</body>\n</html>\n```\n\nThe\
    \ above code will produce the following result:\n\n```\nBefore Remove Value: 4000\n\
    After Remove Value: \n```\n\n# JSTL Core <c:catch> Tag\n\nThe <c:catch> tag catches\
    \ Throwable that occurs in its body and optionally exposes it. It is used for\
    \ error handling and to deal more gracefully with the problem.\n\n# Attribute\n\
    \nThe <c:catch> tag has the following attributes:\n\n| Attribute | Description\
    \ | Required | Default |\n|---|---|---|---|\n| var | The name of the variable\
    \ to hold the java.lang.Throwable if thrown by elements in the body. | No | None\
    \ |\n\n# Example\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:catch> Example</title>\n</head>\n\
    <body>\n\n<c:catch var=\"catchException\">\n<% int x = 5/0;%>\n</c:catch>\n\n\
    <c:if test=\"${catchException != null}\">\n<p>The exception is : ${catchException}\
    \ <br />\nThere is an exception: ${catchException.message}</p>\n</c:if>\n\n</body>\n\
    </html>\n```\n\nThe above code will produce the following result:\n\n```\nThe\
    \ exception is : java.lang.ArithmeticException / by zero\nThere is an exception\
    \ : / by zero\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_135_0.png)\n\n\
    # JSTL Core <c:if> Tag\n\nThe <c:if> tag evaluates an expression and displays\
    \ its body content only if the expression evaluates to true.\n\n# Attribute\n\n\
    The <c:if> tag has the following attributes:\n\n| Attribute | Description | Required\
    \ | Default |\n|---|---|---|---|\n| test | Condition to evaluate | Yes | None\
    \ |\n| var | Name of the variable to store the condition's result | No | None\
    \ |\n| scope | Scope of the variable to store the condition's result | No | page\
    \ |\n\n# Example\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:if> Tag</title>\n</head>\n<body>\n\
    <c:set var=\"salary\" scope=\"session\" value=\"${2000*2}\" />\n<c:if test=\"\
    ${salary > 2000}\">\n<p>My salary is: <c:out value=\"${salary}\"/></p>\n</c:if>\n\
    </body>\n</html>\n```\n\nThe above code will produce the following result:\n\n\
    ```\nMy salary is: 4000\n```\n\n# JSTL Core <c:choose> Tag\n\nThe <c:choose> works\
    \ like a Java switch statement that it lets you choose between a number of alternatives.\
    \ Where the switch statement has cases, the <c:choose> has <c:when> tags. As a\
    \ switch statement has the default clause to specify a default action, <c:choose>\
    \ has <c:otherwise> as the default clause.\n"
