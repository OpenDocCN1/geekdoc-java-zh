    \ 文件 **hello.jsp** 中，并将此文件放入 **C:\\apache-tomcat-7.0.2\\webapps\\ROOT** 目录下。使用\
    \ URL **http://localhost:8080/hello.jsp** 访问。这将生成以下结果：\n\n12\n\n![](img/5626302a090fb89f52cde01d391f8bdc_22_0.png)\n\
