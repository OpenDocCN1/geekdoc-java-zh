    \ |\n\n## 示例\n\n资源包（Resource bundles）包含特定区域的资源。资源包包含键/值对。当你的程序需要特定区域的包时，你可以保留所有区域通用的键，但可以拥有针对特定区域的翻译值。资源包有助于提供针对特定区域的内容。\n\
