    \ JSP – 标准标签库 (JSTL) 教程\n\n在本章中，我们将理解 JSP 中不同的标签。JavaServer Pages 标准标签库 (JSTL)\
    \ 是一组有用的 JSP 标签，封装了许多 JSP 应用程序通用的核心功能。\n\nJSTL 支持常见的结构性任务，如迭代和条件判断、处理 XML 文档的标签、国际化标签以及\
    \ SQL 标签。它还提供了一个将自定义标签与 JSTL 标签的框架。\n\n# 安装 JSTL 库\n\n要开始使用 JSP 标签，你首先需要安装 JSTL\
    \ 库。如果你使用的是 Apache Tomcat 容器，请遵循以下两个步骤：\n\n**步骤 1**：从 Apache Standard Taglib 下载二进制发行包并解压缩文件。\n\
    \n**步骤 2**：要使用来自 Jakarta Taglibs 分发版的 Standard Taglib，只需将发行包中 'ROOT/WEB-INF' 目录下的\
    \ JAR 文件复制到应用程序的 webapps 目录中。\n\n要使用任何库，你必须在使用该库的每个 JSP 顶部包含 `<taglib>` 指令。\n\n\
    # JSTL 标签分类\n\nJSTL 标签可以根据其功能分为以下 JSTL 库组，在创建 JSP 页面时可以使用：\n\n- 核心标签 (Core Tags)\n\
    - 格式化标签 (Formatting tags)\n- SQL 标签 (SQL tags)\n- XML 标签 (XML tags)\n- JSTL 函数\
    \ (JSTL Functions)\n\n# 核心标签\n\n核心标签组是最常用的 JSTL 标签。以下是在你的 JSP 中包含 JSTL 核心库的语法：\n\
    \n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n\
    ```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_130_0.png)\n\n以下列表列出了核心 JSTL 标签：\n\
    \n| 标签 | 描述 |\n|---|---|\n| <c:out > | 类似于 <%= ... %>，但用于表达式。 |\n| <c:set > |\
    \ 在“作用域”(scope) 中设置表达式求值的结果 |\n| <c:remove > | 移除一个 *作用域变量*（如果指定，则从特定作用域移除）。 |\n\
    | <c:catch> | 捕获体内部发生的任何 *Throwable* 并可选地暴露它。 |\n| <c:if> | 简单的条件标签，如果提供的条件为真，则评估其体。\
    \ |\n| <c:choose> | 简单的条件标签，为互斥的条件操作建立上下文，由 <when> 和 <otherwise> 标记。 |\n| <c:when>\
    \ | <choose> 的子标签，如果其条件求值为 'true'，则包含其体。 |\n| <c:otherwise > | <choose> 的子标签，紧跟在\
    \ <when> 标签之后，且仅在所有先决条件求值为 'false' 时运行时运行。 |\n| <c:import> | 获取绝对或相对 URL，并将其内容暴露给页面、'var'\
    \ 中的字符串或 *varReader* 中的 Reader。 |\n| <c:forEach > | 基础迭代标签，接受许多集合类型并支持子集划分和其他功能。\
    \ |\n| <c:forTokens> | 遍历由提供的分隔符分隔的标记 (tokens)。 |\n| <c:param> | 为包含它的 'import'\
    \ 标签的 URL 添加一个参数。 |\n| <c:url> | 创建一个带有可选查询参数的 URL |\n\n# JSTL 核心 <c:out> 标签\n\
    \n<c:out> 标签可以自动转义 XML 标签，使其不会被视为实际标签评估。\n\n# 属性\n\n<c:out> 标签有以下属性：\n\n| 属性 |\
    \ 描述 | 是否强制 | 默认 |\n|---|---|---|---|\n| value | 输出的信息 | 是 | 无 |\n| default |\
    \ 输出的备用信息 | 否 | body |\n| escapeXml | 如果标签应转义特殊 XML 字符则为 true | 否 | true |\n\n\
    # 示例\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title><c:out> 标签示例</title>\n</head>\n<body>\n<c:out value=\"\
    Hello World\"/>\n</body>\n</html>\n```\n\n# JSTL 核心 <c:out> 标签\n\n<c:out> 标签可以自动转义\
    \ XML 标签，使其不会被视为实际标签评估。\n\n一旦你获取了所有信息，就可以使用上述程序来发送邮件。\n\n```jsp\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n<title><c:out>\
    \ 标签示例</title>\n</head>\n<body>\n<c:out value=\"Hello World\"/>\n</body>\n</html>\n\
    ```\n\n# JSTL 核心 <c:set> 标签\n\n<c:set> 标签用于在“作用域”中设置表达式求值的结果。\n\n```jsp\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n\
    <title><c:out> 标签示例</title>\n</head>\n<body>\n<c:set var=\"name\" value=\"John\
    \ Doe\"/>\n<c:out value=\"${name}\"/>\n</body>\n</html>\n```\n\n# JSTL 核心 <c:set>\
    \ 标签\n\n<c:set> 标签是 JSTL 友好的 set 操作，它评估一个表达式并可选地暴露它。\n\n```jsp\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n<title><c:out>\
    \ 标签示例</title>\n</head>\n<body>\n<c:set var=\"name\" value=\"John Doe\"/>\n<c:out\
    \ value=\"${name}\"/>\n</body>\n</html>\n```\n\n# JSTL 核心 <c:remove> 标签\n\n<c:remove>\
    \ 标签移除一个 *作用域变量*（如果指定，则从特定作用域移除）。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:out> 标签示例</title>\n</head>\n<body>\n\
    <c:set var=\"name\" value=\"John Doe\"/>\n<c:remove var=\"name\"/>\n</body>\n\
    </html>\n```\n\n# JSTL 核心 <c:catch> 标签\n\n<c:catch> 标签捕获其体内部发生的任何 *Throwable*\
    \ 并可选地暴露它。\n\n```jsp\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title><c:out> 标签示例</title>\n</head>\n<body>\n<c:catch\
    \ var=\"catchException\">\n    <% int x = 5/0; %>\n</c:catch>\n<c:if test=\"${catchException\
    \ != null}\">\n    <p>异常是: ${catchException}</p>\n</c:if>\n</body>\n</html>\n\
    ```\n\n# JSTL 核心 <c:if> 标签\n\n<c:if> 标签是一个简单的条件标签，如果提供的条件为真，则评估其体。\n\n```jsp\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title><c:out> 标签示例</title>\n</head>\n<body>\n<c:set var=\"salary\" value=\"\
    4000\"/>\n<c:if test=\"${salary > 2000}\">\n    <p>我的薪水是: <c:out value=\"${salary}\"\
    /></p>\n</c:if>\n</body>\n</html>\n```\n\n# JSTL 核心 <c:choose> 标签\n\n<c:choose>\
    \ 标签是一个简单的条件标签，为互斥的条件操作建立上下文，由 <when> 和 <otherwise> 标记。\n\n```jsp\n<%@ taglib\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n\
    <title><c:out> 标签示例</title>\n</head>\n<body>\n<c:set var=\"salary\" value=\"4000\"\
    />\n<c:choose>\n    <c:when test=\"${salary > 2000}\">\n        <p>我的薪水是: <c:out\
    \ value=\"${salary}\"/></p>\n    </c:when>\n    <c:otherwise>\n        <p>薪水不足</p>\n\
    \    </c:otherwise>\n</c:choose>\n</body>\n</html>\n```\n\n"
