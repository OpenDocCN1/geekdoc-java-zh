    # JSP EL Implicit Objects


    The JSP expression language supports the following implicit objects:


    | Implicit object | Description |

    | :--- | :--- |

    | pageScope | Scoped variables from page scope |

    | requestScope | Scoped variables from request scope |

    | sessionScope | Scoped variables from session scope |

    | applicationScope | Scoped variables from application scope |

    | param | Request parameters as strings |

    | paramValues | Request parameters as collections of strings |

    | header | HTTP request headers as strings |

    | headerValues | HTTP request headers as collections of strings |

    | initParam | Context-initialization parameters |

    | cookie | Cookie values |

    | pageContext | The JSP PageContext object for the current page |


    You can use these objects in an expression as if they were variables. The examples
    that follow will help you understand the concepts:


    ## The pageContext Object


    The pageContext object gives you access to the pageContext JSP object. Through
    the pageContext object, you can access the request object. For example, to access
    the incoming query string for a request, you can use the following expression:


    ```

    ${pageContext.request.queryString}

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_256_0.png)


    ## The Scope Objects


    The pageScope, requestScope, sessionScope, and applicationScope variables provide
    access to variables stored at each scope level.


    For example, if you need to explicitly access the box variable in the application
    scope, you can access it through the applicationScope.box.


    ## The param and paramValues Objects


    The param and paramValues objects give you access to the parameter values normally
    available through the request.getParameter and request.getParameterValues methods.


    For example, to access a parameter named order, use the expression ${param.order}
    or ${param["order"]}.


    Following is the example to access a request parameter named username:


    ```jsp

    <%@ page import="java.io.*,java.util.*" %>

    <%

    String title = "Accessing Request Param"

    %>

    <html>

    <head>

    <title><% out.print(title); %></title>

    </head>

    <body>

    <center>

    <h1><% out.print(title); %></h1>

    </center>

    <div align="center">

    <p>${param["username"]}</p>

    </div>

    </body>

    </html>

    ```


    The param object returns single string values, whereas the paramValues object
    returns string arrays.


    ![](img/5626302a090fb89f52cde01d391f8bdc_257_0.png)


    ## header and headerValues objects


    The header and headerValues objects give you access to the header values normally
    available through the request.getHeader and the request.getHeaders methods.


    For example, to access a header named user-agent, use the expression ${header.user-agent}
    or ${header[''user-agent'']}.


    Following is the example to access a header named user-agent:


    ```jsp

    <%@ page import="java.io.*,java.util.*" %>

    <%

    String title = "User Agent Example";

    %>

    <html>

    <head>

    <title><% out.print(title); %></title>

    </head>

    <body>

    <center>

    <h1><% out.print(title); % ></h1>

    </center>

    <div align="center">

    <p>${header["user-agent"]}</p>

    </div>

    </body>

    </html>

    ```


    The output will be somewhat like the following:


    # User Agent Example


    Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1; WOW64; Trident/4.0; SLCC2;
    .NET CLR 2.0.50727; .NET CLR 3.5.30729; .NET CLR 3.0.30729; Media Center PC 6.0;
    HPNTDF; .4.0C; InfoPath.2


    The header object returns single string values, whereas the headerValues object
    returns string arrays.


    In this chapter, we will discuss how to handle exceptions in JSP. When you are
    writing a JSP code, you might make coding errors which can occur at any part of
    the code. There may occur the following type of errors in your JSP code:


    ## Checked exceptions


    A checked exception is an exception that is typically a user error or a problem
    that cannot be foreseen by the programmer. For example, if a file is to be opened,
    but the file cannot be found, an exception occurs. These exceptions cannot simply
    be ignored at the time of compilation.


    ## Runtime exceptions


    A runtime exception is an exception that probably could have been avoided by a
    programmer. As opposed to the checked exceptions, runtime exceptions are ignored
    at the time of compilation.


    ## Errors


    These are not exceptions at all, but problems that arise beyond the control of
    the user or the programmer. Errors are typically ignored in your code because
    you can rarely do anything about an error. For example, if a stack overflow occurs,
    an error will arise. They are also ignored at the time of compilation.


    We will further discuss how to handle runtime exception/error occurring in your
    JSP code.


    ## Using Exception Object


    The exception object is an instance of a subclass of Throwable (e.g., java.lang.NullPointerException)
    and is only available in error pages. Following table lists out the important
    methods available in the Throwable class.


    | S. No. | Methods with Description |

    | :--- | :--- |

    | 1 | getMessage() - Returns a message about the exception. |

    | 2 | getCause() - Returns the cause of the exception. |

    | 3 | toString() - Returns a string representation of the exception. |

    | 4 | printStackTrace() - Prints the stack trace to the stream. |

    | 5 | getStackTrace() - Returns an array of stack trace elements. |

    | 6 | fillStackTrace() - Fills the stack trace with information. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_259_0.png)

