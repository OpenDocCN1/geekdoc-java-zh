    \ | See Other | The requested page can be found under a different url |\n| 304\
    \ | Not Modified | |\n| 305 | Use Proxy | |\n| 306 | Unused | |\n| 307 | Temporary\
    \ Redirect | The requested page has moved temporarily. |\n| 400 | Bad Request\
    \ | The server did not understand the request. |\n| 401 | Unauthorized | The request\
