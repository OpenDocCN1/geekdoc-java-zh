    ```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_139_0.png)\n\nThe above code will\
    \ generate the following result:\n\n| Your salary is : 4000 |\n| Salary is very\
    \ good. |\n\n## JSTL Core <c:import> Tag\n\nThe <c:import> tag provides all functionalities\
    \ of the <include> action but also allows the inclusion of absolute URLs. For\
    \ example, using the import tag allows for the inclusion of content from a different\
    \ website or an FTP server.\n\n## Attribute\n\nThe <c:import> tag has the following\
    \ attributes:\n\n| Attribute | Description | Required | Default |\n|---|---|---|---|\n\
    | url | URL to retrieve and import into the page | Yes | None |\n| context | followed\
    \ by the name of a local web application | No | Current application |\n| charEncoding\
    \ | Character set to use for imported data | No | ISO-8859-1 |\n| var | Name of\
    \ the variable to store imported text | No | Print to page |\n| scope | Scope\
    \ of the variable used to store imported text | No | Page |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_140_0.png)\n\
    \n## Example\n\n```html\n<%@taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
    c\" %>\n<html>\n<head>\n<title>c:import Tag</title>\n</head>\n<body>\n<c:import\
    \ var=\"data\" url=\"http://www.tutorialspoint.com/index.htm\"/>\n<c:out value=\"\
    ${data}\"/>\n</body>\n</html>\n```\n\nThe above example will fetch complete content\
    \ from tutorialspoint.com and store in data variable which will be printed. Try\
    \ it by yourself.\n\n## JSTL Core <c:forEach>, <c:forEach> Tag\n\nThese tags are\
    \ a good alternative to embedding in a Java for, while, or do-while loop via a\
    \ scriptlet. The <c:forEach> tag is a commonly used tag because it iterates over\
    \ a collection of objects. The <c:forEach> tag is used to break a string into\
    \ tokens and iterate through each of the tokens.\n\n## Attribute\n\nThe <c:forEach>\
    \ tag has the following attributes:\n\n| Attribute | Description | Required |\
    \ Default |\n|---|---|---|---|\n| items | Information to loop over | No | None\
    \ |\n| begin | Element to start with (0 = first item, 1 = second item, ...) |\
    \ No | 0 |\n| end | Element to end with (0 = first item, 1 = second item, ...)\
    \ | No | Last element |\n| step | Process every step items | No | 1 |\n| var |\
    \ Name of the variable to expose the current item | No | None |\n| varStatus |\
    \ Name of the variable to expose the loop status | No | None |\n\nThe <c:forTokens>\
    \ tag has similar attributes as that of the <c:forEach> tag except one additional\
    \ attribute `delims` which specifies characters to use as delimiters.\n\n| Attribute\
    \ | Description | Required | Default |\n|---|---|---|---|\n| delims | Characters\
    \ to use delimiters | Yes | None |\n\n## Example for <c:forEach>\n\n```html\n\
    <%@taglib uri=\"http://java.sun.com/jsp/core\" prefix=\"c\" %>\n<html>\n<head>\n\
    <title><c:forEach> Tag Example</title>\n</head>\n<body>\n<c:forEach var=\"i\"\
    \ begin=\"1\" end=\"5\">\nItem <c:out value=\"${i}\"/></p>\n</c:forEach>\n</body>\n\
    </html>\n```\n\nThe above code will produce the following result:\n\n| Item 1\
