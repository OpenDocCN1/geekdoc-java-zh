  - '[PAGE 267]


    You can use Log4J Framework to log messages in different files based on their
    severity levels and importance.


    # Debugging Tools


    NetBeans is a free and open-source Java Integrated Development Environment that
    supports the development of standalone Java applications and Web applications
    supporting the JSP and servlet specifications and includes a JSP debugger as well.


    NetBeans supports the following basic debugging functionalities:


    +   - Breakpoints

    - Stepping through code

    - Watchpoints


    You can refer to NBeans documentation to understand above debugging functionalities.


    # Using JDB Debugger


    You can debug JSP and servlets with the same jdb commands you use to debug an
    applet or an application.


    To debug a JSP or servlet, you can debug sun.servlet.http.HttpServer, then observe
    as HttpServer executes the JSP/servlets in response to HTTP requests we make from
    a browser. This is similar to how applets are debugged. The difference is that
    with applets, the actual program being debugged is sun.applet.AppletViewer.


    Most debuggers hide this by automatically knowing how to debug applets. Until
    they do the same for JSP, you have to help your debugger by the the following:


    +   - Set your debugger''s classpath. This helps you find your sun.servlet.http.HttpServer
    and the associated classes.

    - Set your debugger''s classpath. This helps you find your JSP and support classes,
    typically ROOT/WEB-INF/classes.


    Once you have the proper classpath, start debugging sun.servlet.http.HttpServer.
    You can set breakpoints in whatever you are interested in debugging, then use
    a web browser to make a request to the HttpServer for the given JSP (http://localhost:8080/JSPToDebug).
    The execution here at breakpoints.


    # Using Comments


    Comments in your code can help the debugging process in various ways. Comments
    can be used in lots of others in the debugging process.


    The JSP uses Java comments and single line ( // ...) and multiple line (/* ...
    */) comments can be used to temporarily remove parts of your Java code. If the
    bug disappears, take a closer look at the code you just commented and find out
    the problem.


    ![](img/5626302a090fb89f52cde01d391f8bdc_267_0.png)'
  - '[PAGE 268]


    # Client and Server Headers


    Sometimes when a JSP doesn''t behave as expected, it''s useful to look at the
    raw HTTP request and response. If you''re familiar with the structure of HTTP,
    you can read the request and response and see what exactly is going with those
    headers.


    # Important Debugging Tips


    Here is a list of some more debugging tips on JSP debugging:


    +   - Ask a browser to show the raw content of the page it is displaying. This
    can help identify formatting problems. It''s usually an option under the View
    menu.

    - Make sure the browser isn''t caching a previous request''s output by forcing
    a full reload of the page. With Netscape Navigator, use Shift-Reload; with Internet
    Explorer use Shift-Refresh.'
- md: "\n# 30. JSP — Security\n\nJava Pages and servlets make several mechanisms available\
    \ to Web developers to secure applications. Resources are protected declaratively\
    \ by identifying them in the application deployment descriptor and assigning a\
    \ role to them.\n\nLevels of authentication are available, ranging from basic\
    \ authentication using identifiers and passwords to sophisticated authentication\
    \ using certificates.\n\n## Role Based Authentication\n\nThe authentication mechanism\
    \ in the servlet specification uses a technique called role-based security. The\
    \ idea is rather than restricting resources at the user level, you create roles\
    \ and restrict resources by role.\n\nYou can define different roles in tomcat-users.xml,\
    \ which is located off Tomcat's home directory in conf. An example of this file\
    \ is shown below:\n\n```xml\n<?xml version='1.0' encoding='utf-8'?>\n<tomcat-users>\n\
    <role rolename=\"tomcat\" />\n<role rolename=\"role1\" />\n<role rolename=\"manager\"\
    \ />\n<role rolename=\"admin\" />\n<user username=\"tomcat\" password=\"tomcat\"\
    \ roles=\"tomcat\" />\n<user username=\"role1\" password=\"tomcat\" roles=\"role1\"\
    \ />\n<user username=\"both\" password=\"tomcat\" roles=\"tomcat,role1\" />\n\
    <user username=\"admin\" password=\"secret\" roles=\"admin,manager\" />\n</tomcat-users>\n\
    ```\n\nThis file defines a simple mapping between username, password, and role.\
    \ Notice that a given user may have multiple roles; for example, username=\"both\"\
    \ is in the \"tomcat\" role and the \"role1\".\n\nOnce you have identified and\
    \ defined different roles, role-based security restrictions can be placed on different\
    \ Web Application resources by using the <security-constraint> element in web.xml\
    \ file available in the WEB-INF directory.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_269_0.png)\n\
    \nFollowing is a sample entry in web.xml:\n\n```xml\n<web-app>\n  ..\n  <security-resource-constraint>\n\
    \    <web-resource-collection>\n      <web-resource-name>\n        SecuredBookSite\n\
    \      </web-resource-name>\n      <url-pattern>/secured/*</url-pattern>\n   \
    \   <http-method>GET</http-method>\n      <http-method>POST</http-method>\n  \
    \  </web-resource-collection>\n    <auth-constraint>\n      <description>\n  \
    \      Let only managers use this app\n      </description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-resource-constraint>\n  <security-role>\n\
    \    <role-name>manager</role-name>\n  </security-role>\n  <login-config>\n  \
    \  <auth-method>BASIC</auth-method>\n  </login-config>\n  ..\n</web-app>\n```\n\
    \nThe above entries matched when /secured/* would mean:\n\n- Any HTTP GET or POST\
    \ request to a URL matched by /secured/* would be subject to the security restriction.\n\
    - A person with the role of a manager is given access to the secured resources.\n\
    - The **login-config** element is used to describe the **BASIC** form of authentication.\n\
    \nIf you try browsing any URL including the **security** directory, the following\
    \ dialog box will be displayed for username and password. If you provide a user\
    \ \"admin\" and password \"secrer\", then you will have access to the URL matched\
    \ by /secured/* as we have defined the user admin with manager role who is allowed\
    \ to access this resource.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_270_0.png)\n\
    \n## Form Based Authentication\n\nWhen you use the FORM authentication method,\
    \ you must supply a login form to prompt the user for a username and password.\
    \ Following is a simple code of login.jsp. This helps create a form for your same\
    \ purpose:\n\n```html\n<html>\n<body bgcolor=\"#ffffff\">\n<form method=\"POST\"\
    \ action=\"j_security_check\">\n  <table border=\"0\">\n  <tr>\n    <td>login</td>\n\
    \    <td><input type=\"text\" name=\"j_username\"></td>\n  </tr>\n  <tr>\n   \
    \ <td>Password</td>\n    <td><input type=\"password\" name=\"j_password\"></td>\n\
    \  </tr>\n  </table>\n  <input type=\"submit\" value=\"Login!\">\n</form>\n</body>\n\
    </html>\n```\n\nHere you have to make sure that the login form must contain the\
    \ form elements named j_username and j_password. The action in the <form> tag\
    \ must be j_security_check. POST must be used as the form method. At the same\
    \ time, you will have to modify the <login-config> tag to specify the auth-method\
    \ as FORM:\n\n```xml\n<web-app>\n...\n  <security-constraint>\n    <web-resource-collection>\n\
    \      <web-resource-name>\n        SecuredBookSite\n      </web-resource-name>\n\
    \      <url-pattern>secured/*</url-pattern>\n      <http-method>GET</http-method>\n\
    \      <http-method>POST</http-method>\n    </web-resource-collection>\n```\n\n\
    ![](img/5626302a090fb89f52cde01d391f8bdc_271_0.png)\n\n```xml\n<auth-constraint>\n\
    \  <description>\n    Let only managers use this app\n  </description>\n  <role-name>manager</role-name>\n\
    </auth-constraint>\n</security-resource-constraint>\n<security-role>\n  <role-name>manager</role-name>\n\
    </security-role>\n<login-config>\n  <auth-method>BASIC</auth-method>\n</login-config>\n\
    </web-app>\n```\n\n## Programmatic Security in Servlet\n\nThe HttpServletRequest\
    \ provides the following methods:\n\n| S.No | Method |\n|---|---|\n| 1 | **String\
    \ getAuthType()** The getAuthType() returns a String representing authentication\
    \ scheme. |\n| 2 | **boolean isInRole(String)** The isInRole() returns a boolean\
    \ if user is in role. |\n| 3 | **String getProtocol()** The getProtocol() returns\
    \ a String representing the protocol used. |\n| 4 | **boolean isSecure()** The\
    \ isSecure() returns a boolean if the connection is secure. |\n| 5 | **Principal\
    \ getUserPrincipal()** The getUserPrincipal() returns a java.security.Principal\
    \ object that contains the name. |\n\nNow when you try to access any resource,\
    \ it will display for username and password. If you provide a user \"admin\" and\
    \ password \"secrer\", then you will have access to the URL matched by /secured/*\
    \ as we have defined the user admin with manager role who is allowed to access\
    \ this resource.\n\nBy checking the user's role in a JSP, you can customize the\
    \ Webpage. For example, you might have the following code:\n\n```jsp\n<% if (request.isInRole(\"\
    manager\")) { %>\n<a href=\"managers/report.jsp\">Manager Report</a>\n<a href=\"\
    managers/personnel.jsp\">Personnel Records</a>\n<% } %>\n```\n\nThere are a number\
    \ of items which should be taken of while building up a global Website. This tutorial\
    \ will not give you complete detail on this but will give you a good example on\
    \ how you can offer your Webpage in different languages by their location, i.e.,\
    \ locale.\n\n- **Internationalization (i18n):** This means enabling a website\
    \ to provide different versions of content translated into the visitor's language.\n\
    - **Localization (l10n):** This means adding resources to a website to adapt it\
    \ to a particular geographical or region for example Hindi translation to a website.\n\
    - **locale:** This is a particular geographical or cultural region. It is usually\
    \ referred to as a language symbol followed by a country symbol which are separated\
    \ by an underscore. For example, **en_US** represents locale for US.\n\nIn this\
    \ chapter, we will discuss Internationalization in JSP. Before we proceed, let\
    \ us understand the following terms:\n\nA JSP can pick appropriate version of\
    \ the site based on the requester's locale and provide appropriate site version\
    \ according to the local language, culture and requirements. Following is the\
    \ method of request returns the Locale object.\n\n```java\njava.util.Locale request.getLocale()\n\
    ```\n\n## Detecting Locale\n\nFollowing are the important locale methods which\
    \ you can use to detect requester's location, language and of course locale. All\
    \ the methods display the country name and language name set in the requester's\
    \ browser.\n\n| S.NO. | Method & Description |\n|---|---|\n| 1 | **String getCountry()**\
    \ This method returns the country/region code in upper case for this locale in\
    \ ISO 3166 2-letter format. |\n| 2 | **String getDisplayName()** This method returns\
    \ a name for the locale's country that is appropriate for display to the user.\
    \ |\n| 3 | **String getLanguage()** |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_273_0.png)\n"
  mdcn: "\n\n# 30. JSP — 安全\n\nJava Pages 和 servlets 为 Web 开发人员提供了多种机制来保护应用程序。资源可以通过声明的方式进行保护，方法是在应用部署描述符中标识它们，并为它们分配角色（role）。\n\
    \n系统提供了多种层级的身份验证，从使用标识符和密码的基本认证，到使用证书的高级认证不等。\n\n## 基于角色的认证\n\nServlet 规范中的认证机制使用了一种名为基于角色的安全（role-based\
    \ security）的技术。其核心思想不是在用户级别限制资源，而是创建角色并根据角色来限制资源。\n\n你可以在 `tomcat-users.xml` 中定义不同的角色，该文件位于\
    \ Tomcat 目录下的 `conf` 文件夹中。该文件的示例所示：\n\n```xml\n<?xml version='1.0' encoding='utf-8'?>\n\
    <tomcat-users>\n<role rolename=\"tomcat\" />\n<role rolename=\"role1\" />\n<role\
    \ rolename=\"manager\" />\n<role rolename=\"admin\" />\n<user username=\"tomcat\"\
    \ password=\"tomcat\" roles=\"tomcat\" />\n<user username=\"role1\" password=\"\
    tomcat\" roles=\"role1\" />\n<user username=\"both\" password=\"tomcat\" roles=\"\
    tomcat,role1\" />\n<user username=\"admin\" password=\"secret\" roles=\"admin,manager\"\
    \ />\n</tomcat-users>\n```\n\n该文件定义了用户名、密码和角色之间的简单映射。注意，一个用户可以拥有多个角色；例如，用户名=\"\
    both\" 既属于 \"tomcat\" 角色也属于 \"role1\" 角色。\n\n一旦你识别并定义了不同的角色，就可以使用 WEB-INF 目录下\
    \ `web.xml` 文件中的 `<security-constraint>` 元素，对不同的 Web 应用资源设置基于角色的安全限制。\n\n![](img/5626302a090fb89f52cde01d391f8bdc_269_0.png)\n\
    \n以下是 web.xml 中的一个示例条目：\n\n```xml\n<web-app>\n  ..\n  <security-resource-constraint>\n\
    \    <web-resource-collection>\n      <web-resource-name>\n        SecuredBookSite\n\
    \      </web-resource-name>\n      <url-pattern>/secured/*</url-pattern>\n   \
    \   <http-method>GET</http-method>\n      <http-method>POST</http-method>\n  \
    \  </web-resource-collection>\n    <auth-constraint>\n      <description>\n  \
    \      仅允许经理使用此应用\n      </description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-resource-constraint>\n  <security-role>\n\
    \    <role-name>manager</role-name>\n  </security-role>\n  <login-config>\n  \
    \  <auth-method>BASIC</auth-method>\n  </login-config>\n  ..\n</web-app>\n```\n\
    \n当 `/secured/*` 匹配时，上述条目意味着：\n\n- 任何指向匹配 `/secured/*` 的 URL 的 HTTP GET 或 POST\
    \ 请求都将受到安全限制。\n- 拥有 manager 角色的人员将获得访问受保护资源的权限。\n- **login-config** 元素用于描述 **BASIC**\
    \ 形式的认证。\n\n如果你尝试浏览任何包含 **security** 目录的 URL，将显示请求用户名和密码的对话框。如果你提供了用户 \"admin\"\
    \ 和密码 \"secrer\"，那么你就可以访问匹配 `/secured/*` 的 URL，因为我们已经定义了具有 manager 角色的用户 admin，其允许访问此资源。\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_270_0.png)\n\n## 基于表单的认证\n\n当你使用 FORM\
    \ 认证方法时，必须提供一个登录表单提示用户输入用户名和密码。以下是 login.jsp 的简单代码。这有助于实现登录：\n\n```jsp\n<html>\n\
    <body>\n  <form action=\"loginServlet\" method=\"POST\">\n    Username: <input\
    \ type=\"text\" name=\"username\"><br>\n    Password: <input type=\"password\"\
    \ name=\"jpassword\"><br>\n    <input type=\"submit\" value=\"Login\">\n  </form>\n\
    </body>\n</html>\n```\n\n在 `web.xml` 中通过如下配置来启用 FORM 认证：\n\n```xml\n<web-app>\n\
    \  ..\n  <security-resource-constraint>\n    <web-resource-collection>\n     \
    \ <web-resource-name>\n        SecuredBookSite\n      </web-resource-name>\n \
    \     <url-pattern>/secured/*</url-pattern>\n      <http-method>GET</http-method>\n\
    \      <http-method>POST</http-method>\n    </web-resource-collection>\n    <auth-constraint>\n\
    \      <description>\n        仅允许经理使用此应用\n      </description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-resource-constraint>\n  <security-role>\n\
    \    <role-name>manager</role-name>\n  </security-role>\n  <login-config>\n  \
    \  <auth-method>FORM</auth-method>\n    <form-config>\n      <form-login-page>/login.jsp</form-login-page>\n\
    \      <form-error-page>/error.jsp</form-error-page>\n    </form-config>\n  </login-config>\n\
    \  ..\n</web-app>\n```\n\n当 `/secured/*` 匹配时，上述条目意味着：\n\n- 任何指向匹配 `/secured/*`\
    \ 的 URL 的 HTTP GET 或 POST 请求都将受到安全限制。\n- 拥有 manager 角色的人员将获得访问受保护资源的权限。\n- **login-config**\
    \ 元素用于描述 **FORM** 形式的认证。\n\n## 编编程安全\n\n在 Servlet 中，你可以通过代码实现安全。HttpServletRequest\
    \ 提供了以下方法：\n\n```java\nif (request.isRole(\"manager\")) {\n    // 允许访问\n} else\
    \ {\n    // 拒绝访问\n}\n```\n\n在 JSP 中检查用户的角色，可以自定义页面。例如，你拥有如下代码：\n\n```jsp\n<% if\
    \ (request.isRole(\"manager\")) { %>\n  <a href=\"managers/report.jsp\">经理报告</a>\n\
    \  <a href=\"managers/personnel.jsp\">人员记录</a>\n<% } %>\n```\n\n"
