    \n# 13. JSP – 过滤器 (Filters)\n\n在本章中，我们将讨论 JSP 中的过滤器。Servlet 和 JSP 过滤器是 Java 类，可以用于\
    \ Servlet 和 JSP 编程，用于以下目的：\n\n- 在客户端访问后端资源之前拦截其请求。\n- 在服务器将响应发送回客户端之前对响应进行处理。\n\
    \n规范中建议了多种类型的过滤器：\n\n- 身份验证过滤器 (Authentication Filters)\n- 数据压缩过滤器 (Data compression\
    \ Filters)\n- 加密过滤器 (Encryption Filters)\n- 触发资源访问事件的过滤器\n- 转换过滤器 (Image Conversion\
    \ Filters)\n- 日志和审计过滤器 (Logging and Auditing Filters)\n- MIME-TYPE 链过滤器\n- 分词过滤器\
    \ (Tokenizing Filters)\n- 转换 XML 内容的 XSL/T 过滤器\n\n过滤器部署在部署描述符 `web.xml` 中，然后映射到应用程序部署描述符中的\
    \ servlet 或 JSP 名称或 URL 模式。部署描述符文件 `web.xml` 可以在 `<Tomcat安装目录>/conf` 目录下找到。\n\n\
    当 JSP 容器启动你的 Web 应用程序时，它会为你在部署描述符中定义的每个过滤器创建一个实例。过滤器按照它们在部署描述符中声明的顺序执行。\n\n# Servlet\
    \ Filter 方法\n\n过滤器是一个实现 `javax.servlet.Filter` 接口的 Java 类。`javax.servlet.Filter`\
    \ 接口定义了三个方法：\n\n| 序号 | 方法与描述 |\n| --- | --- |\n| 1 | public void doFilter(ServletRequest,\
    \ ServletResponse, FilterChain) 每当客户端请求链末端的资源时，导致一个请求/响应对通过该链时，容器都会调用此方法。 |\n\
    | 2 | public void init(FilterConfig filterConfig) |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_85_0.png)\n\
    \n此方法由 Web 容器调用，指示过滤器它正被投入服务。\n\n```java\npublic void destroy()\n```\n此方法由 Web\
    \ 容器调用，指示过滤器它正被停止服务。\n\n# JSP 过滤器示例\n\n下面的示例展示了如何在每次访问任何 JSP 文件时打印客户端的 IP 地址和当前日期时间。这个示例将让你对\
    \ JSP 过滤器有一个基本的了解，但你可以使用相同的概念编写更复杂的过滤器应用程序。\n\n```java\n// 导入所需的 java 库\nimport\
    \ java.io.*;\nimport javax.servlet.*;\nimport java.util.*;\n\n// 实现 Filter 类\n\
    public class LogFilter implements Filter {\n    public void init(FilterConfig\
    \ config)\n        throws ServletException {\n        // 获取初始化参数\n        String\
    \ testParam = config.getInitParameter(\"test-param\");\n\n        // 打印初始化参数\n\
    \        System.out.println(\"test Param: \" + testParam);\n    }\n    public\
    \ void doFilter(ServletRequest request,\n        ServletResponse response,\n \
    \       FilterChain chain)\n        throws java.io.IOException, ServletException\
    \ {\n\n        // 获取客户端机器的 IP 地址。\n        String ipAddress = request.getRemoteAddr();\n\
    \n        // 记录 IP 地址和当前时间戳。\n        System.out.println(\"IP \" + ipAddress +\
    \ \", Time \"\n        + new Date().toString());\n\n        // 将请求传回过滤器链\n   \
    \     chain.doFilter(request,response);\n    }\n    public void destroy() {\n\
    \        /* 在 Web 容器从服务中移除 Filter 实例之前调用 */\n    }\n}\n```\n\n以按照通常的方式编译 `LogFilter.java`，并将你的\
    \ `LogFilter.class` 文件放在 `<Tomcat安装目录>/webapps/ROOT/WEB-INF/classes`。\n\n# ##\
    \ Web.xml 中的 JSP 过滤器映射\n\n过滤器的定义后映射到 URL 或 JSP 名称，这与 Servlet 在 `web.xml` 中定义并映射到\
    \ URL 模式的方式相同。在部署描述符文件 `web.xml` 中为 filter 标签创建条目\n\n```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n\
    \  <filter-class>LogFilter</filter-class>\n  <param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Parameter</param-value>\n  </param>\n</filter>\n\
    <mapping>\n  <filter-name>LogFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </mapping>\n```\n\n上述过滤器将应用于所有 servlet 和 JSP，因为我们在配置中指定了 `/*`。如果你只想对少数 servlet\
    \ 或 JSP 应用过滤器，可以指定特定的 servlet 或 JSP 路径。\n\n现在尝试调用任何 servlet 或 JSP，你将在你的 Web 服务器日志中看到生成的日志。你可以使用\
    \ Log4J 日志器再次记录到单独的文件。\n\n![](img/5626302a090fb89f52cde01d391f8bdc_86_0.png)\n\
    \n# 使用多个过滤器\n\n你的 Web 应用程序可以定义多个过滤器。考虑以下两个过滤器的示例：LogFilter 和 AuthenFilter。\n\n\
    ```xml\n<filter>\n  <filter-name>LogFilter</filter-name>\n  <filter-class>LogFilter</filter-class>\n\
    \  <param>\n    <param-name>test-param</param-name>\n    <param-value>Initialization\
    \ Parameter</param-value>\n  </param>\n</filter>\n<mapping>\n  <filter-name>LogFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</mapping>\n\n<filter>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <filter-class>AuthenFilter</filter-class>\n  <param>\n    <param-name>test-param</param-name>\n\
    \    <param-value>Initialization Parameter</param-value>\n  </param>\n</filter>\n\
    <mapping>\n  <filter-name>AuthenFilter</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </mapping>\n```\n\n# 过滤器顺序\n\n`web.xml` 中过滤器的顺序决定了容器应用它们的顺序。例如，以下示例将首先应用 LogFilter，然后将\
    \ AuthenFilter 应用到任何 servlet：\n\n```xml\n<mapping>\n  <filter-name>AuthenFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</mapping>\n\n<mapping>\n  <filter-name>LogFilter</filter-name>\n\
    \  <url-pattern>/*</url-pattern>\n</mapping>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_87_0.png)\n\
    \n# 14. JSP — Cookie 处理 (Cookies Handling)\n\n在本章中，我们将讨论 JSP 中的 Cookie 处理。Cookie\
    \ 是存储在客户端计算机上的文本文件，用于各种目的。JSP 使用 Servlet 技术支持 Cookie。\n\n识别和返回用户涉及三个步骤：\n\n- 服务器向浏览器发送\
    \ Cookie。例如名称、年龄或标识符。\n- 浏览器在本地机器上存储这些信息。\n- 浏览器下次向服务器发送请求时会发送这些 Cookie。\n\n本章将教你如何使用\
    \ JSP 设置或重置 Cookie 以及删除它们。\n\n# Cookie 的结构\n\nCookie 通常在 HTTP 头部设置（尽管 JavaScript\
    \ 也可以直接设置 Cookie）。设置 Cookie 的 JSP 必须发送类似下面的头部：\n\n```http\nHTTP/1.1 200 OK\nDate:\
    \ Fri, 04 Feb 2000 21:03:38 GMT\nServer: Apache/1.3.9 (UNIX) PHP/4.0b3\nSet-Cookie:\
    \ name=xyz; expires=Friday, 04-Feb-07 22:03:38 GMT;\npath=/; domain=tutorialspoint.com\n\
    \nConnection: close\nContent-Type: text/html\n```\n\n可以看出，Set-Cookie 头部包含一个键值对、GMT\
    \ 日期、路径和域。名称和值将经过 URL 编码。`expires` 字段是指令浏览器在指定的日期时间之后“忘记” Cookie。\n\n如果浏览器配置为存储\
    \ Cookie，它将保留这些信息直到过期。如果用户访问匹配 Cookie 路径和域的路径，浏览器会将 Cookie 重发给服务器。浏览器的头部可能如下：\n\
    \n```http\nGET / HTTP/1.0\nConnection: Keep-Alive\nUser-Agent: Mozilla/4.6 (X11;\
    \ I; Linux 2.2.6-15apmac llc)\nHost: zink.demo.co.uk:1126\n```\n\n80\n\n![](img/5626302a090fb89f52cde01d391f8bdc_90_0.png)\n\
