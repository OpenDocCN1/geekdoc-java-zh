    # 5. JSP – Syntax


    In this chapter, we will discuss Syntax in JSP. We will understand the basic use
    of simple syntax (i.e., elements) involved in JSP development.


    # Elements of JSP


    The elements of JSP have been described below:


    # The Scriptlet


    A scriptlet can contain any number of JAVA language statements, variable or method
    declarations, or expressions that are valid in the page scripting language.


    Following is the syntax of Scriptlet:


    ```

    <% code fragment %>

    ```


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsplet>

    code fragment

    </jsplet>

    ```


    Any text, HTML tags, or JSP elements you write must be outside the scriptlet.
    Following is the simple and first example for JSP:


    ```

    <html>

    <head><title>Hello World</title></head>

    <body>

    Hello World!<br>

    %

    out.println("Your IP address is " + request.getRemoteAddr());

    %

    </body>

    </html>

    ```


    **NOTE:** Assuming that Apache Tomcat is installed in C:\apache-tomcat-7.0.2 and
    your environment is set as per setup tutorial.


    Let us keep the above code in JSP file **hello.jsp** and put this file in **C:\apache-tomcat-7.0.2\webapps\ROOT**
    directory. Browse through the same using URL **http://localhost:8080/hello.jsp**.
    This would generate the following result:


    12


    ![](img/5626302a090fb89f52cde01d391f8bdc_22_0.png)'
  - '[PAGE 23]


    # JSP Declarations


    A declaration declares one or more variables or methods that you can use in Java
    code later in the JSP file. You must declare the variable or method before you
    use it in the JSP file.


    Following is the syntax for JSP Declarations:


    ```

    <%! declaration; [ declaration; ]+ ... %>

    ```


    You can write the XML equivalent of the above syntax as follows:


    ```

    <jsp:declaration>

    code fragment

    </jsp:declaration>

    ```


    Following is an example for JSP Declarations:


    ```

    <%! int i = 0; %>

    <%! int a, b, c; %>

    <%! a = new Circle(2.0); a %>

    ```


    # JSP Expression


    A JSP expression element contains a scripting language expression that is evaluated,
    converted to a String, and inserted where the expression appears in the JSP file.


    Because the value of an expression is converted to a String, you can use an expression
    within a line of text, whether or not it is tagged with HTML, in a JSP file.


    The expression element can contain any expression that is valid according to the
    Java Language Specification but you cannot use a semicolon to end an expression.


    Following is the syntax of JSP Expression:


    ```

    <%= expression %>

    ```


    You can write the XML equivalent of the above syntax as follows:


    ![](img/5626302a090fb89f52cde01d391f8bdc_23_0.png)'
  - '[PAGE 24]


    ```

    <jsp:expression>

    expression

    </jsp:expression>

    ```


    Following example shows a JSP Expression:


    ```

    <html>

    <head><title>A Comment Test</title></head>

    <body>

    <p>

    Today''s date: <%= (new java.util.Date()).toString() %>n</p>

    </body>

    </html>

    ```


    The above code will generate the following result:


    Today''s date: 11-Sep-2010 21:24:25


    # JSP Comments


    JSP comment marks the text or the statements that the JSP container should ignore.
    JSP comment is useful when you want to hide or "comment out", a part of your JSP
    page.


    Following is the syntax of the JSP comments:


    ```

    <-- This is JSP comment --%>

    ```


    Following example shows the JSP Comments:


    ```

    <html>

    <head><title>A Comment Test</title></head>

    <body>

    <h2>A Test of Comments</h2>

    <-- This comment will not be visible in the page source --%>

    </body>

    </html>

    ```


    The above code will generate the following result:


    ![](img/5626302a090fb89f52cde01d391f8bdc_24_0.png)'
  - '[PAGE 25]


    # A Test of Comments


    There are a small number of special constructs you can use in various cases to
    insert comments or characters that would otherwise be treated specially. Here''s
    a summary:


    | Syntax | Purpose |

    | --- | --- |

    | <-- comment --%> | A JSP comment. Ignored by the JSP engine. |

    | <!-- comment --> | An HTML comment. Ignored by the browser. |

    | <\% | Represents static <% literal. |

    | %\> Represents static %% literal. |

    | \'' | A single quote in an attribute that uses single quotes. |

    | \" | A double quote in an attribute that uses double quotes. |


    # JSP Directives


    A JSP directive affects the overall structure of the servlet class. It usually
    has the following form:


    ```

    <@ directive attribute="value" %>

    ```


    There are three types of directive tag:


    | Directive | Description |

    | --- | --- |

    | <@ page ... %> | Defines page-dependent attributes, such as scripting language,
    error page, and buffering requirements. |

    | <@ include ... %> | Includes a file during the translation phase. |

    | <@ taglib ... %> | Declares a tag library, containing custom actions, used in
    the page |


    We would explain the JSP directive in a separate chapter — JSP - Directives


    ![](img/5626302a090fb89f52cde01d391f8bdc_25_0.png)'
  - '[PAGE 26]


    # JSP Actions


    JSP actions use constructs in XML syntax to control the behavior of the servlet
    engine. You can dynamically insert a file, reuse JavaBeans components, forward
    the user to another page, or generate HTML for the Java plugin.


    There is only syntax for the Action element, as it conforms to the XML standard:


    ```

    <jsp:action_name attribute="value" />

    ```


    Action elements are basically predefined functions. Following table lists out
    the available JSP Actions:


    | Syntax | Purpose |

    | --- | --- |

    | jsp:include | Includes a file at the time the page is requested. |

    | jsp:useBean | Finds or instantiates a JavaBean. |

    | jsp:setProperty | Sets the property of a JavaBean. |

    | jsp:getProperty | Inserts the property of a JavaBean into the output. |

    | jsp:forward | Forwards the requester to a new page. |

    | jsp:plugin | Generates browser-specific code that makes an OBJECT EMBED tag
    for the Java plugin. |

    | jsp:element | Defines XML elements dynamically. |

    | jsp:attribute | Defines dynamically-defined XML element''s attribute. |

    | jsp:body | Defines dynamically-defined XML element''s body. |

    | jsp:text | Used to write template text in JSP pages and documents. |


    We would explain JSP actions in a separate chapter - JSP - Actions'
  - '[PAGE 27]


    # JSP Implicit Objects


    JSP supports nine automatically defined variables, which are also called implicit
    objects. These variables are:


    | Objects | Description |

    | --- | --- |

    | request | This is the HttpServletRequest object associated with the request.
    |

    | response | This is the HttpServletResponse object associated with the client.
    |

    | out | This is the PrintWriter object used to send output to the client. |

    | session | This is the HttpSession object associated with the request. |

    | application | This is the ServletContext object associated with application
    context. |

    | config | This is the ServletConfig object associated with the page. |

    | pageContext | This encapsulates use of server-specific features like higher
    performance JspW. |

    | page | This is simply a synonym for this, and is used to call the methods defined
    by the translated servlet class. |

    | Exception | The Exception object allows the exception data to be accessed by
    designated JSP. |


    We would explain JSP Implicit Objects in a separate chapter — JSP - Implicit Objects.


