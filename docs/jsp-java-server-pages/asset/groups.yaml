    # Action


    The forward action terminates the action of the current page and forwards the
    request to another resource such as a static page, another JSP page, or a Java
    Servlet.


    Following is the syntax of the forward action:


    ```jsp

    <jsp:forward page="Relative URL" />

    ```


    Following table lists the required attributes associated with the forward action:


    | Attribute | Description |

    | --- | --- |

    | page | Should consist of a relative URL of another resource such as a static
    page, another JSP page, or a Java Servlet. |


    # Example


    Let us reuse the following files (a) date.jsp and (b) main.jsp as follows:


    Following is the content of the date.jsp file:


    ```jsp

    <p>

    Today''s date: <%= (new java.util.Date()).toLocaleString() %>

    </p>

    ```


    Following is the content of the main.jsp file:


    ```jsp

    <html>

    <head>

    <title>The include Action Example</title>

    </head>

    <body>

    <center>

    <h2>The include action Example</h2>

    <jsp:forward page="date.jsp" />

    </center>

    </body>

    </html>

    ```


    Let us keep all these files in the root directory and try to access main.jsp.
    This would display result something like as below.


    Here we discarded the content from the main page and displayed the content from
    forwarded page only.


    ![](img/5626302a090fb89f52cde01d391f8bdc_50_0.png)


    # The <jsp:plugin> action is Action


    The plugin action is used to insert JSP components into a JSP page. It determines
    the type of browser and inserts the <object> or <embed> tags as needed.


    If the needed plugin is not present, it downloads the plugin and executes the
    Java component. The Java component can be an Applet or a JavaBean.


    The plugin action has several attributes that correspond to common HTML tags used
    to format Java components. The <param> element can also be used to send parameters
    to the Applet.


    Following is the typical syntax of using the plugin action: type="applet" codebase="dirname"
    code="MyApplet.class"


    ```jsp

    <jsp:plugin type="applet" codebase="dirname" code="MyApplet.class"

    width="60" height="80">

    <jsp:param name="font" value="red" />

    <jsp:param name="background" value="black" />


    <jsp:fallback>

    Unable to initialize Java Plugin

    </jsp:fallback>

    </jsp:plugin>

    ```


    You can try this action using some applet if you are interested. A new element,
    the <fallback> element, can be used to specify an error string to be sent to the
    user in case the component fails.


    # The <jsp:element> Action


    The <jsp:body> ActionThe <jsp:element>, <jsp:attribute> and <jsp:body> actions
    are used to define XML elements dynamically. The word dynamically is important,
    because it means the XML elements can be generated at request time rather than
    statically at compile time.


    Following is a simple example to define XML elements dynamically:


    ```jsp

    <@page language="java" contentType="text/html\n<html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:jsp="http://java.sun.com/JSP/Page">


    <head><title>Generate XML Element</title></head>

    <body>

    <jsp:element name="xmlElement">

    <jsp:attribute name="xmlElementAttr">

    Value for the attribute

    </jsp:attribute>

    <jsp:body>

    Body for XML element

    </jsp:body>

    </jsp:element>

    </body>

    </html>

    ```


    This would produce the following HTML code at run time:


    ```html

    <html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:jsp="http://java.sun.com/JSP/Page">

    <head><title>Generate XML Element</title></head>

    <body>

    <xmlElement xmlElementAttr="Value for the attribute">

    Body for XML element

    </xmlElement>

    </body>

    </html>

    ```


    # The <jsp:text> Action


    The <jsp:text> action can be used to write the template text in JSP pages and
    documents. Following is the simple syntax for this action:


    ```jsp

    <jsp:text>Template data</jsp:text>

    ```


    The body of the template cannot contain other elements; it can only contain text
    and EL expressions (EL expressions are expressed in a subsequent chapter). Note
    that in XML files, you cannot use expressions such as ${whatever gt 0}, because
    the greater signs are illegal. Instead, use the gt form, such as ${whatever gt
    0} or an alternative is to embed the value in a CDATA section.


    42


    ![](img/5626302a090fb89f52cde01d391f8bdc_52_0.png)


    If you need to include a DOCTYPE declaration, for instance for XHTML, you must
    also use the <jsp:text> element as follows:


    ```jsp

    <jsp:text><![CDATA[<!DOCTYPE html

    PUBLIC "-//W3C//DTD HTML 1.0 Strict//EN"

    "DTD/html1-strict.dtd">]></jsp:text>

    <head><title>jsp:text action</title></head>

    <body>


    <books>book

    Welcome to JSP</books>


    </body>

    </html>

    ```


    Try the above example with <jsp:text>.


    In this chapter, we will discuss Implicit Objects. These objects are available
    to the page without being explicitly declared. Following table lists the implicit
    objects:


    | Object | Description |

    | --- | --- |

    | request | This is the HttpServletRequest associated with the request. |

    | response | This is the HttpServletResponse associated with the client. |

    | out | This is the JspWriter used to send output. |

    | session | This is the HttpSession object associated with the request. |

    | application | This is the ServletContext associated with application. |

    | config | This is the ServletConfig object associated with the page. |

    | pageContext | This encapsulates page-specific features. |

    | page | This is simply a synonym for this. |

    | Exception | The Exception object allows exception data to be accessed. |


    # The request Object


    The request object is an instance of javax.servlet.http.HttpServletRequest. Each
    time a client requests a page the JSP engine creates a new object to represent
    that request.


    ![](img/5626302a090fb89f52cde01d391f8bdc_54_0.png)


    The request object provides methods to get the HTTP header information including
    data, cookies, etc.


    We can cover a complete set of methods associated with the request object in a
    subsequent chapter: JSP - Client Request.


    # The response Object


    The response object is an instance of javax.servlet.http.HttpServletResponse.
    As the server creates the request object, it also creates an object to represent
    the response to the client.


    The response object also defines the interfaces that deal with new HTTP headers.
    Through this the JSP programmer can add new cookies or date stamps, HTTP status
    codes, etc.


    We will cover a complete set of methods associated with the response object in
    a subsequent chapter: JSP - Server Response.


    # The out Object


    The out implicit is an instance of javax.servlet.jsp.JspWriter object and is used
    to send content. The initial PspWriter is instantiated differently depending on
    whether the page is buffered or not. Buffering can be easily turned off using
    the buffered=''false'' attribute of the page directive.


    The JspWriter contains most of the same methods as the java.io.PrintWriter class.
    However, PspWriter has some additional methods to deal with buffering. Unlike
    the PrintWriter object, JspWriter throws IOExceptions.


    Following table lists the important methods that we will use to write boolean,
    char, int, double, String, etc.


    | Method | Description |

    | --- | --- |

    | out.print(dataType dt) | Print a data type value |

    | out.println(dataType dt) | Print a data type value then terminate the line with
    new line. |

    | out.flush() | Flush the stream. |


    # The session Object


    The session object is an instance of javax.servlet.http.HttpSession and behaves
    exactly the same way that session objects behave under Java Servlets.


    The session object is used to track client session between client requests. We
    will cover the complete usage of session object in a subsequent chapter: JSP -
    Session Tracking.

