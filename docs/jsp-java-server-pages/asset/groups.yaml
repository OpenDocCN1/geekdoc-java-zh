  mdcn: "\n\n| org.apache.jasper.servlet.JspServlet.service(JspServlet.java:265) |\n\
    | javax.servlet.http.HttpServlet.service(HttpServlet.java:722) |\n\n## 使用 Try...Catch\
    \ 块\n\n如果你想在同一个页面内处理错误并采取某些操作而不是抛出错误页面，可以使用 try...catch 块。\n\n下面是一个简单的示例，展示了如何使用\
    \ try...catch 块。我们将以下代码放入 main.jsp 中：\n\n```jsp\n<html>\n<head>\n  <title>Try...Catch\
    \ Example</title>\n</head>\n<body>\n<%\ntry{\n  int i = 1;\n  i = i / 0;\n  out.println(\"\
    The answer is \" + i);\n}\n catch (Exception e){\n  out.println(\"An exception\
    \ occurred: \" + e.getMessage());\n}\n%>\n</body>\n</html>\n```\n\n访问 main.jsp，它应该生成类似下面的输出内容：\n\
    \n| 发生了一个异常：除以 0 |\n\n## 29. JSP — 调试\n\n在本章中，我们将讨论 JSP 的调试。测试/调试 JSP 和 Servlet\
    \ 总是很困难。JSP 和 Servlet 往往涉及大量的客户端/服务器交互，使得错误容易发生但难以重现。\n\n以下是一些可能帮助你调试的提示和建议。\n\
    \n### 使用 System.out.println()\n\nSystem.out.println() 非常易用，可以作为标记来测试某段代码是否正在执行。我们也可以打印变量的值。考虑以下额外几点：\n\
    \n- 由于 System 对象是 Java 对象的一部分，可以在任何地方使用，而无需安装任何额外的类。这包括 Servlet、JSP、RMI、EJB、普通的\
    \ Bean 和类，以及独立应用程序。\n- 与停止在断点处相比，向 System.out 写入不会对程序的正常执行流产生太大干扰，这使得它在时机至关何时非常有价值。\n\
    \n以下是使用 System.out.println() 的语法：\n\n```java\nSystem.out.println(\"Debugging message\"\
    );\n```\n\n以下是如何使用 System.out.println() 的示例：\n\n```jsp\n<@taglib prefix=\"c\"\
    \ uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<html>\n<head><title>System.out.println</title></head>\n\
    <body>\n<c:forEach var=\"counter\" begin=\"1\" end=\"10\" step=\"1\">\n<c:out\
    \ value=\"${counter-5}\"/><br>\n<% System.out.println(\"counter = \" + pageContext.findAttribute(\"\
    counter\")); %>\n</c:forEach>\n</body>\n</html>\n```\n\n访问上面的 JSP，浏览器将显示以下结果：\n\
    \n```\n-4\n-3\n-2\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_264_0.png)\n\
    \n```\n-1\n0\n1\n2\n3\n4\n5\n```\n\n如果你使用的是 Tomcat，你还会发现这些行被追加到日志目录下的 **stdout.log**\
    \ 的末尾。\n\n```\ncounter=1\ncounter=2\ncounter=3\ncounter=4\ncounter=5\ncounter=6\n\
    counter=7\ncounter=8\ncounter=9\ncounter=10\n```\n\n通过这种方式，你可以将变量和其他信息引入系统日志中，通过对日志进行分析来找出问题的根源或其他出于各种目的的原因。\n\
    \n### 使用 JDB Logger\n\nJ2EE 框架设计用于为运行在 JVM 中的任何类提供日志服务。我们可以利用此框架来记录任何信息。\n\n让我们使用\
    \ JDK logger API 重写上面的示例：\n\n```jsp\n<@taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n<%@ page import=\"java.util.logging.Logger\" %>\n\n<html>\n<head><title>Logger</title></head>\n\
    <body>\n<% Logger logger=Logger.getLogger(this.getClass().getName());%>\n\n<c:forEach\
    \ var=\"counter\" begin=\"1\" end=\"10\" step=\"1\">\n  <c:set var=\"myCount\"\
    \ value=\"${counter-5}\" />\n![](img/5626302a090fb89f52cde01d391f8bdc_265_0.png)\n\
    <c:out value=\"${myCount}\"/><br>\n<% String message = \"counter=\"\n    + pageContext.findAttribute(\"\
    counter\")\n    + \"myCount=\"\n    + pageContext.findAttribute(\"counter\");\n\
    \    logger.info( message );\n%>\n</c:forEach>\n</body>\n</html>\n```\n\n上面的代码会在浏览器中生成类似的结果，但你会在\
    \ stdout.log 中获得额外的信息。我们使用 logger 的 info 方法是为了这个目的。以下是 stdout.log 文件的快照：\n\n```\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=1myCount=-4\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=2myCount=-3\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=3myCount=-2\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=4myCount=-1\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=5myCount=0\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=6myCount=1\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=7myCount=2\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=8myCount=3\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=9myCount=4\n\
    24-Sep-2010 23:31:31 org.apache.jsp.main_jsp_service\nINFO: counter=10myCount=5\n\
    ```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_266_0.png)\n\n"
