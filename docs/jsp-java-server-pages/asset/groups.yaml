    # Date Comparison


    As discussed in the previous sections, you can use all the available Java methods
    in your JSP scripts. In you need to compare two dates, consider the following
    methods:


    +   * You can use getTime() method to obtain the number of milliseconds that have
    elapsed since midnight, January 1, 1970, for both objects and then compare these
    two values.

    * You can use the methods before(), after(), and equals() because the 12th of
    the month comes before the 18th; for example, new Date(99, 2, 18) returns true.

    * You can use the compareTo() method; this method is defined by the Comparable
    interface and implemented by Date.


    # Date Formatting using SimpleDateFormat


    SimpleDateFormat is a concrete class for formatting and parsing dates in a locale-sensitive
    manner. SimpleDateFormat allows you to start by choosing any user-defined patterns
    for date-time formatting.


