  - '[PAGE 253]


    # 27. JSP — Expression Language (EL)


    JSP Expression Language (EL) makes it possible to easily access application data
    stored in JavaBeans. JSP EL allows you to create expressions with (a) arithmetic
    and (b) logical. Within a EL expression, you can use integers, floating point
    numbers, strings, the built-in constants true and false for boolean values, and
    null.


    # Simple Syntax


    Typically, when you specify an attribute value in a JSP tag, you simply use a
    string. For example:


    ```

    <jsp:setProperty name="box" property="perimeter" value="100"/>

    ```


    JSP EL allows you to specify an expression for any of these attribute values.
    A simple syntax for JSP EL is as follows:


    ```

    $${expr}

    ```


    Here expr specifies the expression itself. The most common operators in JSP EL
    are and []. These two operators allow you to access various attributes of Java
    Beans and built-in JSP objects.


    For example, the above syntax <jsp:setProperty> tag can be written with an expression
    like:


    ```

    <jsp:setProperty name="box" property="perimeter" value="$${box.width+2*box.height}"/>

    ```


    When the JSP compiler compiles the ${} form in an attribute, it generates code
    to evaluate the expression and substitutes the value of expression.


    You can also use the JSP expressions within template text for a tag. For example,
    the <jsp:text> tag inserts its contents within the body of the JSP. The following
    <jsp:text> declaration inserts <h1>Hello JSP!</h1> into the JSP output:


    ```

    <jsp:text>

    <h1>Hello JSP!</h1>

    </jsp:text>

    ```'
  - '[PAGE 254]


    You can now include a JSP EL expression in the body of a <jsp:text> tag (or any
    other tag) with the same ${} syntax you use for attributes. For example:


    ```

    <jsp:text>

    Box Perimeter is: ${2*box.width + 2*box.height}

    </jsp:text>

    ```


    EL expressions use parentheses to group subexpressions. For example, ${(1 + 2)
    * 3} equals 9, but ${1 + (2 * 3)} equals 7.


    To deactivate the evaluation of EL expressions, we specify the isELIgnored attribute
    of the page directive as below:


    ```

    <% page isELIgnored="true|false" %>

    ```


    The valid values of this attribute are true and false. If it is true, EL expressions
    are ignored when they appear in static text or tag attributes. If it is false,
    EL expressions are evaluated by the container.


    # Basic Operators in EL


    JSP Expression Language (EL) supports most of the arithmetic and logical operators
    supported by Java. Following table lists out the most frequently used operators:


    | Operator | Description |

    | --- | --- |

    | . | Access a bean property or Map entry |

    | [] | Access an array or List element |

    | () | Group a subexpression to change the evaluation order |

    | + | Addition |

    | - | Subtraction or negation of a value |

    | * | Multiplication |

    | / div | Division |

    | % or mod | Modulo (remainder) |

    | == or eq | Test for equality |'
  - '[PAGE 255]


    | | |

    |---|---|

    | != or ne | Test for inequality |

    | < or lt | Test for less than |

    | > or gt | Test for greater than |

    | <= or le | Test for less than or equal |

    | >= or ge | Test for greater than or equal |

    | && or and | Test for logical AND |

    | || or or | Test for logical OR |

    | ! or not | Unary Boolean complement |

    | empty | Test for empty variable values |


    # # Functions in JSP EL


    JSP EL allows you to use functions in expressions as well. These functions must
    be defined in the custom tag libraries. A function usage has the following syntax:


    ```

    ${ns:func(param1, param2, ...)}

    ```


    **ns** is the namespace of the function, **func** is the name of the function
    and **param1** is the first parameter value. For example, the function **fn:length**,
    which is part of the JSTL library. This function can be used as follows to get
    the length of a string.


    ```

    ${fn:length("Get my length")}

    ```


    To use a function from any tag library (standard or custom), you must install
    that library on your server and include the library in your JSP using the **<taglib>**
    directive as explained in the JSTL chapter.'
