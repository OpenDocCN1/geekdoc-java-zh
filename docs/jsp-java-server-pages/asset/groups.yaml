    \n| time | Time zone of the parsed date | No | Default zone |\n| :--- | :--- |\
    \ :--- | :--- |\n| var | Name of the variable to store the parsed date | No |\
    \ Print to page |\n| scope | Scope of the variable to store the formatted date\
    \ | No | page |\n\nA pattern attribute is provided that works just like the pattern\
    \ attribute for the <fmt:dateFormat> tag. However, in the case of parsing, the\
    \ pattern attribute tells the parser what format to expect.\n\n## Example\n\n\
