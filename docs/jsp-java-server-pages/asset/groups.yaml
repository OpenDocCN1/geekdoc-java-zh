    \        SecuredBookSite\n      </web-resource-name>\n      <url-pattern>/secured/*</url-pattern>\n\
    \      <http-method>GET</http-method>\n      <http-method>POST</http-method>\n\
    \    </web-resource-collection>\n    <auth-constraint>\n      <description>\n\
    \        Let only managers use this app\n      </description>\n      <role-name>manager</role-name>\n\
    \    </auth-constraint>\n  </security-resource-constraint>\n  <security-role>\n\
    \    <role-name>manager</role-name>\n  </security-role>\n  <login-config>\n  \
    \  <auth-method>BASIC</auth-method>\n  </login-config>\n  ..\n</web-app>\n```\n\
    \nThe above entries matched when /secured/* would mean:\n\n+   - Any HTTP GET\
    \ or POST request to a URL matched by /secured/* would be subject to the security\
    \ restriction.\n- A person with the role of a manager is given access to the secured\
    \ resources.\n- The **login-config** element is used to describe the **BASIC**\
    \ form of authentication.\n\nIf you try browsing any URL including the **security**\
    \ directory, the following dialog box will be displayed for username and password.\
    \ If you provide a user \"admin\" and password \"secrer\", then you will have\
    \ access to the URL matched by /secured/* as we have defined the user admin with\
    \ manager role who is allowed to access this resource.\n\n![](img/5626302a090fb89f52cde01d391f8bdc_270_0.png)"
