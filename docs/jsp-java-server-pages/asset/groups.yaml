    </head>\n<body>\n<center>\n<h1>显示当前日期和时间</h1>h1>\n</center>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_112_0.png)\n\
    \n```jsp\n<%\nDate dNow = new Date( );\nSimpleDateFormat ft = new SimpleDateFormat(\"\
    yyyy.MM.dd 'at' hh:mm:ss zzz\");\nout.print(\"<h2 align=\\\"center\\\">\" + ft.format(dNow)\
    \ + \"</h2>\");\n%>\n</body>\n</html>\n```\n\n再次编译上面的 servlet，然后使用 URL http://localhost:8080/Current\
    \ 访问此 servlet。你将得到以下结果：\n\n## 显示当前日期和时间\n\nMon 2010.06.21 at 10:06:44 PM GMT+04:00\n\
    \n## SimpleDateFormat 格式代码\n\n要指定格式，请使用时间模式字符串。在此模式中，所有 ASCII 字母都被留作模式字母，其定义如下：\n\
    \n| 字符 | 说明 | 示例 |\n| --- | --- | --- |\n| G | 时代标识符 | AD |\n| y | 四位数的年份 | 2001\
    \ |\n| M | 年中的月份 | July 或 07 |\n| d | 月中的日 | 10 |\n| h | A.M./P.M. 小时 (1~12) |\
    \ 12 |\n| H | 一天中的小时 (0~23) | 22 |\n| m | 小时中的分钟 | 30 |\n| S | 分钟中的秒 | 55 |\n\
    | s | 毫秒 | 234 |\n| E | 一周中的几 | Tuesday |\n| D | 年中的日 | 360 |\n| F | 月中的星期 | 2\
    \ (7月的第二个周三) |\n| w | 年中的周 | 40 |\n| W | 月中的周 | 1 |\n| a | A.M./P.M. 标记 | PM |\n\
    | k | 一天中的小时 (1~24) | 24 |\n| K | A.M./P.M. 小时 (0~11) | 10 |\n| z | 时区 | Eastern\
    \ Standard Time |\n| ' | 文本转义 | 分隔符 |\n| \" | 单引号 | ' |\n\n要获取操作日期的完整可用常量方法列表，你可以参考标准的\
    \ Java 文。\n\n## 18. JSP – 页面重定向\n\n在本章中，我们将讨论 JSP 中的页面重定向。页面重定向通常用于文档移动到新位置，我们需要将客户端发送到该新位置。这可能是由于负载均衡或为了随机化。\n\
    \n重定向到另一个页面的最简单方法是使用 response 的 `sendRedirect()` 方法。以下是该方法的签名：\n\n```java\npublic\
    \ void sendRedirect(String location) throws IOException\n```\n\n该方法将响应连同状态码发送回浏览器。你也可以结合\
    \ `setStatus()` 和 `setHeader()` 方法来实现相同的重定向：\n\n```jsp\n...\nString site = \"\
    http://www.newpage.com\";\nresponse.setStatus(response.SC_MOVED);\nresponse.setHeader(\"\
    Location\", site);\n...\n```\n\n### 示例\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*\"\
    \ %>\n<html>\n<head>\n<title>页面重定向</title>\n</head>\n<body>\n<center>\n<h1>页面重定向</h1>\n\
    </center>\n<%\n// 新位置\nString site = \"http://www.photofunto.com\";\nresponse.setStatus(response.SC_MOVED);\n\
    response.setHeader(\"Location\", site);\n%>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_115_0)\n\
    \n## 19. JSP – 访问计数\n\n在本章中，我们将讨论 JSP 中的访问计数。访问计数通常用于记录页面访问次数。\n\n实现访问计数的最简单方法是使用\
    \ `application` 对象的 `getAttribute()` 和 `setAttribute()` 方法。该对象在页面初始化时创建，并在销毁时移除。\n\
    \n以下是设置变量的语法：\n\n```java\napplication.setAttribute(String Key, Object Value);\n\
    ```\n\n读取变量的示例：\n\n```java\napplication.getAttribute(String Key);\n```\n\n当用户访问页面时，你可以通过该对象来增加访问计数。\n\
    \n### 示例\n\n此示例展示了如何使用 application 对象来计数访问次数。\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*\"\
    \ %>\n<html>\n<head>\n<title>访问计数</title>\n</head>\n<body>\n<%\nInteger hitsCount\
    \ = (Integer)application.getAttribute(\"hitCounter\");\nif(hitsCount==null ||\
    \ hitsCount == 0) {\n    /* 第一次访问 */\n    out.println(\"欢迎访问网站！\");\n    hitsCount\
    \ = 1;\n} else {\n    /* 访问 */\n    out.println(\"欢迎回来访问网站！\");\n    hitsCount\
    \ += 1;\n}\n%>\napplication.setAttribute(\"hitCounter\", hitsCount);\n%>\n<center>\n\
    <p>访问次数：<%= hitsCount ?></p>\n</center>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_117_0.png)\n\
    \n## 自动刷新\n\n在本章中，我们将讨论 JSP 中的自动刷新。考虑一个显示实时比分、股票状态或货币汇率的网页。对于所有此类页面，你需要定期使用浏览器的刷新或重载按钮来刷新页面。\n\
    \nJSP 通过提供一种机制，让你让页面在给定的间隔后自动刷新。\n\n刷新页面的最简单方法是使用 response 对象的 `setHeader()` 方法。以下是该方法的签名：\n\
    \n```java\npublic void setHeader(String header, int headerValue)\n```\n\n该方法将\
    \ \"Refresh\" 头部连同一个整数值发送回浏览器。\n\n### 示例\n\n在下面的示例中，我们将使用 `setHeader()` 方法设置 Refresh\
    \ 头部。这将模拟一个数字钟：\n\n```jsp\n<%@ page import=\"java.io.*,java.util.*\" %>\n<html>\n\
    <head>\n<title>自动刷新头部示例</title>\n</head>\n<body>\n<center>\n<h2>自动刷新头部示例</h2>\n\
    </center>\n<%\n// 设置刷新，自动加载时间为5秒\nresponse.setHeader(\"Refresh\", 5);\n// 获取当前时间\n\
    Calendar calendar = new GregorianCalendar();\nString ampm;\nint hour = calendar.get(Calendar.HOUR);\n\
    int minute = calendar.get(Calendar.MINUTE);\nint second = calendar.get(Calendar.SECOND);\n\
    if(calendar.get(Calendar.AM_PM) == 0)\nampm = \"AM\";\n%>\n</body>\n</html>\n\
    ```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_119_0.png)\n"
