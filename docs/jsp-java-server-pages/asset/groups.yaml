    # 22. JSP – Standard Tag Library (JSTL) Tutorial


    In this chapter, we will understand the different tags in JSP. The JavaServer
    Pages Standard Tag Library (JSTL) is a collection of useful JSP tags which encapsulates
    the core functionality common to many JSP applications.


    JSTL has support for common, structural tasks such as iteration and conditionals,
    tags for manipulating XML documents, internationalization tags, and SQL tags.
    It also provides a framework for integrating the custom tags with the JSTL tags.


    # Install JSTL Library


    To begin working with JSP tags you need to first install the JSTL library. If
    you are using the Apache Tomcat container, follow these two steps:


    **Step 1**: Download the binary distribution from Apache Standard Taglib and unpack
    the compressed file.


    **Step 2**: To use the Standard Taglib from its Jakarta Taglibs distribution,
    simply copy the JAR files in the distribution''s ''ROOT/WEB-INF'' directory to
    your application''s webapps directory.


    To use any of the libraries, you must include a <taglib> directive at the top
    of each JSP that uses the library.


    # Classification of The JSTL Tags


    The JSTL tags can be classified, according to their functions, into the following
    JSTL library groups that can be used when creating a JSP page:


    +   * Core Tags

    * Formatting tags

    * SQL tags

    * XML tags

    * JSTL Functions


    # Core Tags


    The core group of tags are the most commonly used JSTL tags. Following is the
    syntax to include the JSTL Core library in your JSP:


    ```

    <@ taglib prefix="c"

    uri="http://java.sun.com/jsp/jstl/core" %>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_130_0.png)'
