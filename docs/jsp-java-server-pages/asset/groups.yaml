    # 15. JSP — Session Tracking


    In this chapter, we will discuss session tracking in JSP. HTTP is a "stateless"
    protocol which means each time a client retrieves a Webpage, the client opens
    a separate connection to the Web server and the server automatically does not
    keep any record of previous client request.


    # Maintaining Session Between Web Client And Server


    Let us now discuss a few options to maintain the session between the Web Client
    and the Web Server:


    # Cookies


    A webserver can assign a unique session ID as a cookie to each web client and
    for subsequent requests from the client they be recognized using the received
    cookie.


    This may not be an effective way as the browser at times does not support a cookie.
    It is not recommended to use this procedure to maintain the sessions.


    # Hidden Form Fields


    A web server can assign a hidden HTML form field along with a unique session ID
    as follows:


    ```

    <input type="hidden" name="sessionid" value="12345">

    ```


    This entry means that, when the form is submitted, the specified name and value
    are automatically included in the GET or the POST data. Each time the web browser
    sends the request, the session_id value can be used to keep the track of different
    web browsers.


    This can be an effective way of tracking the session by clicking on a regular
    (<A HREF->) hyperlink does not result in a form submission, so hidden form fields
    cannot support general session tracking.


    # URL Rewriting


    You can add some extra data at the end of each URL. This identifies the session,
    the server can associate that session identifier with the data it has stored about
    session.


    For example, with http://tutorialspoint.com/file.htm;sessionid=12345, the session
    identifier is attached as sessionid=12345 which can be accessed at the web server
    to identify the client.


    URL rewriting is a better way to maintain sessions and works for the browsers
    who don''t support cookies. The drawback is here that you will have to generate
    every URL dynamically to assign a session ID though page is a simple static HTML
    page.


    ![](img/5626302a090fb89f52cde01d391f8bdc_98_0.png)'
  - '[PAGE 99]


    # The session Object


    Apart from the above mentioned options, JSP makes use of the servlet provided

    **HttpSession Interface**. This interface provides a way to identify a user across


    +   - a page request or

    - visit to a website or

    - store information about that user


    By default, JSPs have session tracking enabled and a new HttpSession object is
    instantiated for each new client automatically. Disabling session tracking requires
    explicitly turning it off by setting the page directive attribute false as follows:


    ```

    <% page session="false" %>

    ```


    The JSP engine exposes the HttpSession to the JSP author through the implicit
    **session** object. Since session is already provided to the JSP programmer, the
    programmer can immediately begin storing and retrieving data from the object without
    any initialization or **getSession()**.


    Here is a summary of methods available through the session object:


    | S.NO. | Method & Description |

    |---|---|

    | 1 | **public Object getAttribute(String name)**<br>This method returns the object
    bound with the specified name in this session, or null if no object is bound under
    the name. |

    | 2 | **public Enumeration getAttributeNames()**<br>This method returns an Enumeration
    of String objects containing the names of all the objects bound to this session.
    |

    | 3 | **public long getCreationTime()**<br>This method returns the time when this
    session was created, measured in milliseconds since midnight January 1, 1970 GMT.
    |

    | 4 | **public String getId()**<br>This method returns a string containing the
    unique identifier assigned to this session. |

    | 5 | **public long getLastAccessedTime()**<br>This method returns the last time
    the client sent a request associated with this session, as the number of milliseconds
    since midnight January 1, 1970 GMT. |'
