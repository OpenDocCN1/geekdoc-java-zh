    \n```\nHTTP/1.1 200 OK\nContent-Type: text/html\nHeader2: ...\n...\nHeaderN: ...\n\
    (Blank Line)\n<!doctype ...>\n<html>\n<head>...</head>\n<body>\n...\n</body>\n\
    </html>\n```\n\nThe status line consists of the HTTP version (HTTP/1.1 in the\
    \ example), a status code (200 in the example), and a very short message corresponding\
    \ to the status code (OK in the example).\n\nFollowing table lists out the HTTP\
    \ status codes and associated messages that might be returned from the Web Server:\n\
