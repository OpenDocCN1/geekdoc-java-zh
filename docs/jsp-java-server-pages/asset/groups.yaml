    # JSTL Core <c:import> Tag


    The <c:import> tag provides all functionalities of the <include> action but also
    allows for the inclusion of absolute URLs.


    For example, using the import tag allows for the inclusion of content from a different

    Website or an FTP server.


    # Attribute


    The <c:import> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | url | URL to retrieve and import into the page | Yes | None |

    | context | / followed by the name of a local web application | No | Current application
    |

    | charEncoding | Character set to use for imported data | No | ISO-8859-1 |

    | var | Name of the variable to store imported text | No | Print to page |

    | scope | Scope of the variable used to store imported text | No | Page |


    ![](img/5626302a090fb89f52cde01d391f8bdc_140_0.png)'
  - '[PAGE 141]


    | varReader | Name of an alternate variable to expose java.io.Reader | No | None
    |


    # Example


    ```

    <%@taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title>c:import Tag Example</title>

    </head>

    <body>

    <c:import var="data" url="http://www.tutorialspoint.com/"

    <c:out value="${data}"/>

    </body>

    </html>

    ```


    The above example will fetch complete content from tutorialsspoint.com/index.htm
    and store in data variable which will be printed eventually. Try it by yourself.


    # JSTL Core <c:forEach>, <c:Tokens> Tag


    These tags are a good alternative to embedding a Java for, while, or do-while
    loop via a scriptlet. The <c:forEach> tag is a commonly used tag because it iterates
    over a collection of objects. The <c:Tokens> tag is used to break a string into
    tokens and iterate through each of the tokens.


    # Attribute


    The <c:forEach> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | items | Information to loop over | No | None |

    | begin | Element to start with (0 = first item, 1 = second item, ...) | No |
    0 |

    | end | Element to end with (0 = first item, 1 = second item, ...) | No | Last
    element |

    | step | Process every step items | No | 1 |


    ![](img/5626302a090fb89f52cde01d391f8bdc_141_0.png)'
  - '[PAGE 142]


    # JSP


    | var | Name of the variable to expose the current item | No | None |

    | varStatus | Name of the variable to expose the loop status | No | None |


    The <c:forTokens> tag has similar attributes as that of the <c:forEach> tag except
    one additional attribute `delims` which specifies characters to use as delimiters.


    | Attribute | Description | Required | Default |

    | delims | Characters to use as delimiters | Yes | None |


    # Example for <c:forEach>


    ```

    <%@taglib uri="http://java.sun.com/jsp/jst/core" prefix="c" %>

    <html>

    <head>

    <title>c:forEach Tag Example</title>

    </head>

    <body>

    <c:forEach var="i" begin="1" end="5">

    Item <c:out value="${i}"></p>

    </c:forEach>

    </body>

    </html>

    ```


    The above code will produce the following result:


    | Item 1

    Item 2

    Item 3

    Item 4

    Item 5 |


    132


    ![](img/5626302a090fb89f52cde01d391f8bdc_142_0.png)'
