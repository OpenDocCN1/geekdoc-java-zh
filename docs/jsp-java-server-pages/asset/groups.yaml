    \ | public String getDomain()<br>This method gets the domain to which the cookie\
    \ applies; for example, tutorialspoint.com. |\n| 3 | public void setMaxAge(int\
    \ expiry)<br>This method sets how much time (in seconds) should elapse before\
    \ the cookie expires. If you don't set this, the cookie will last only for the\
    \ current session. |\n| 4 | public int getMaxAge()<br>This method returns the\
    \ maximum age of the cookie, specified in seconds. By default, -1 indicating the\
    \ cookie will persist until the browser shutdown. |\n| 5 | public String getName()<br>This\
    \ method returns the name of the cookie. The name cannot be changed after the\
    \ creation. |\n| 6 | public void setValue(String newValue)<br>This method sets\
    \ the value associated with the cookie. |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_91_0.png)\n\
    \n| 7 | **public String getValue()**<br>This method gets the value associated\
    \ with the cookie. |\n| 8 | **public void setPath(String uri)**<br>This method\
    \ sets the path to which this cookie applies. If you don't specify a path, the\
    \ cookie is returned for all URLs in the same directory as the current page as\
    \ well as all subdirectories. |\n| 9 | **public String getPath()**<br>This method\
    \ gets the path to which this cookie applies. |\n| 10 | **public void setSecure(boolean\
    \ flag)**<br>This method sets the boolean value indicating whether the cookie\
    \ should only be sent over encrypted (i.e., SSL) connections. |\n| 11 | **public\
    \ void setComment(String purpose)**<br>This method specifies a comment that describes\
    \ a cookie's purpose. The comment is useful if the browser presents the cookie\
    \ to the user. |\n| 12 | **public String getComment()**<br>This method returns\
    \ the comment describing the purpose of this cookie, or null if the cookie has\
    \ no comment. |\n\n# Setting Cookies with JSP\n\nSetting cookies with JSP involves\
    \ three steps:\n\n**(1) Creating a Cookie object:** You call the Cookie constructor\
    \ with a cookie name and a cookie value, both of which are strings.\n\n```java\n\
    Cookie cookie = new Cookie(\"key\",\"value\");\n```\n\nKeep in mind, neither the\
    \ name nor the value should contain white space or any of the following characters:\n\
    \n```\n[ ] ) = \" \" / ? @ : ;\n```\n\n**(2) Setting the maximum age:** Use setMaxAge\
    \ to specify how long (in seconds) the cookie should be valid. The following code\
