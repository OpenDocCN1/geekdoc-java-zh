    # JSTL Core <fmt:formatNumber> Tag


    The <fmt:formatNumber> tag is used to format numbers, percentages, and currencies.


    Attribute

    The <fmt:formatNumber> tag has the following attributes:


    | Attribute | Description | Required | Default |

    | --- | --- | --- | --- |

    | value | Numeric value to display | Yes | None |

    | type | NUMBER, CURRENCY, or PERCENT | No | Number |

    | pattern | Specify a custom formatting pattern for the output. | No | None |

    | currencyCode | Currency code (for type="currency") | No | From the default locale
    |

    | currencySymbol | Currency symbol (for type="currency") | No | From the default
    locale |

    | groupingUsed | Whether to group numbers (TRUE or FALSE) | No | true |

    | maxIntegerDigits | Maximum number of integer digits to print | No | None |

    | minIntegerDigits | Minimum number of integer digits to print | No | None |

    | maxFractionDigits | Maximum number of fractional digits to print | No | None
    |

    | minFractionDigits | Minimum number of fractional digits to print | No | None
    |

    | var | Name of the variable to store the formatted number | No | Print to page
    |'
  - '[PAGE 150]


    # Scope of the variable to store the formatted number


    +   - If the type attribute is percent or number, then you can use several number-formatting
    attributes. The **maxIntegerDigits** and **minIntegerDigits** attributes allow
    you to specify the size of the nonfractional portion of the number. If the actual
    number exceeds maxIntegerDigits, the number is truncated.


    +   - Attributes are also provided to allow you to determine how many decimal
    places should be used. The **minFractionalDigits** and **maxFractionalDigits**
    attributes allow you to specify the number of decimal places. If the number exceeds
    the maximum number of fractional digits, the number will be rounded.


    +   - Grouping can be used to insert commas between thousands groups. Grouping
    is specified by setting the **groupingUsed** attribute to **true** or **false**.
    When using with **minIntegerDigits**, you must be careful to get your intended
    result.


    +   - You may select the pattern attribute. This attribute lets you include special
    characters that specify how you would like your encoded. Following table lists
    out the codes.


    | Symbol | Description |

    | 0 | Represents a digit. |

    | E | Represents in exponential form. |

    | # | Represents a digit; displays 0 as absent. |

    | . | Serves as a placeholder for a decimal separator. |

    | , | Serves as a placeholder for a grouping separator. |

    | ; | Separates formats. |

    | - | Used as the default negative prefix. |

    | % | Multiplies by 100 and displays as a percentage. |

    | ? | Multiplies by 1000 and displays as per mille. |

    | x | Represents the currency sign; replaced by actional currency symbol. |'
  - '[PAGE 151]


    | X | Indicates that any other characters can be used in the prefix or suffix.
    |

    | '' | Used to quote special characters in a prefix or suffix. |


    # Example


    ```

    <@ taglib prefix="c" uri="http://java.sun.com/jsp/jstl/core %>

    <%@ taglib prefix="fmt" uri="http://java.sun.com/jsp/jstl/fmt %>%


    <html>

    <head>

    <title>JSTL fmt:formatNumber Tag</title>

    </head>

    <body>

    <h3>Number Format:</h3></h3>

    <c:set var="balance" value="12000.2309" />

    <p>Formatted Number (1): <fmt:formatNumber value="${balance}" type="currency"
    /></p>

    <p>Formatted Number (2): <fmt:formatNumber type="number"

    maxIntegerDigits="3" value="${balance}" /></p>

    <p>Formatted Number (3): <fmt:formatNumber type="number"

    maxFractionDigits="3" value="${balance}" /></p>

    <p>Formatted Number (4): <fmt:formatNumber type="number"

    groupingUsed="false" value="${balance}" /></p>

    <p>Formatted Number (5): <fmt:formatNumber type="percent"

    maxIntegerDigits="3" value="${balance}" /></p>

    <p>Formatted Number (6): <fmt:formatNumber type="percent"

    minFractionDigits="10" value="${balance}" /></p>

    <p>Formatted Number (7): <fmt:formatNumber type="number"

    maxIntegerDigits="3" value="${balance}" /></p>

    <p>Formatted Number (8): <fmt:formatNumber type="number"

    pattern="#,###.##0" value="${balance}" /></p>

    <p><fmt:setLocale value="en_US" />

    <fmt:formatNumber value="${balance}" type="currency" /></p>

    </body>

    </html>

    ```


