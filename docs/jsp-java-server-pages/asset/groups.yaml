    \      <http-method>GET</http-method>\n      <http-method>POST</http-method>\n\
    \    </web-resource-collection>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_271_0.png)"
  - '[PAGE 272]


    # JSP


    ```

    <auth-constraint>

    <description>

    Let only managers use this app

    </description>

    <role-name>manager</role-name>

    </auth-constraint>

    </security-constraint>

    <security-role>

    <role-name>manager</role-name>

    </security-role>

    <login-config>

    <auth-method>FORM</auth-method>

    <form-login-config>

    <form-login-page>login.jsp</form-login-page>

    <form-error-page>error.jsp</form-error-page>

    </form-login-config>

    </login-config>

    ...

    </web-app>

    ```


    Now when you try to access any resource with URL /secured/* it will display the
    form asking for the user id and password. When the container sees the **j_security_check**
    action, it uses some internal mechanism to authenticate the caller.


    If the login succeeds and the client is authorized to access the secured resource,
    the container uses a session-id to identify a login session for the caller from
    that point on. The container maintains the login session with a cookie containing
    the session-id. The server sends the cookie back to the client, and as long as
    the client presents this with subsequent requests, the container will know who
    the caller is.


    If the login fails, the server sends back the page identified by the form-error-page
    setting


    Here, **j_security_check** is the action that applications using form login have
    to specify for the login. In the same form, you should also have a text input
    control **j_username** and a **password input control** called **j_password**.
    When you see this, it means that the information contained in the form will be
    submitted to the server, which will check name and password. How this is done
    is specific.


    Check Standard Realm Implementations to understand how **j_security_check** works
    for Tomcat container.


    ![](img/5626302a090fb89f52cde01d391f8bdc_272_0.png)'
