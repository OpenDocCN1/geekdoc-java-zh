    # 1. JSP – 概述


    ##  JavaServer Pages？


    JavaServer Pages (JSP) 是一种用于开发支持动态内容的网页的技术。它允许开发者通过使用特殊的 JSP 标签在 HTML 页面中插入 Java
    代码，大多数标签以 `<%` 开头并以 `%}` 结束。


    JavaServer Pages 组件是 Servlet 的一种，旨在为 Java Web 应用程序提供用户界面。开发者将 JSP 写为文本文件，其中结合了
    HTML 或 XHTML 代码、XML 元素以及嵌入的 JSP 动作（actions）和命令。


    使用 JSP，你可以通过网页表单收集用户输入，从数据库或其他源展示记录，并动态创建网页。


    JSP 标签可以用于多种用途，例如从数据库中检索信息或注册用户偏好、访问 JavaBeans、在页面之间传递控制以及在请求、页面等之间共享信息。


    ## 为什么使用 JSP？


    JavaServer Pages 的通常与使用通用网关接口 (CGI) 实现程序相同。但与 CGI 相比，JSP 具有几个优势：


    - 性能显著更好，因为 JSP 允许在 HTML 页面本身中嵌入动态元素，而不是拥有独立的 CGI 文件。

    - JSP 在被服务器处理之前总是会被编译，而 own CGI/Perl 需要服务器在每次请求页面时都加载解释器和目标脚本。

    - JavaServer Pages 构建在 Java Servlet API 之上，就像 Servlets 一样，JSP 也可以访问所有强大的 Java
    API，包括 JDBC、JNDI、EJB、JAXP 等。

    - JSP 页面可以与处理业务逻辑的 servlet 结合，即 Java Servlet 模板支持的模型。


    最后，JSP 是 Java EE 的不可缺的一部分，这是一个用于企业级应用的完整平台。这意味着 JSP 可以从最简单的应用到最复杂、要求最高的应用中发挥作用。


    ![](img/5626302a090fb89f52cde01d391f8bdc_11_0.png)


    ## JSP 的优势


    以下是使用 JSP 相比其他技术的其他优势列表：


    ### 相比 Active Server Pages (ASP)


    JSP 的优势是两方面的。首先，动态部分是用 Java 编写的，而不是 Visual Basic 或微软特有的语言，因此它更强大且更容易使用。其次，它可以迁移到其他操作系统和非微软
    Web 服务器上。


    ### 对比纯 Servlets


    编写（并修改）HTML 比使用 Servlets 更加方便。


    ### 相比服务器端包含 (SSI)


    SSI 真正用于简单的包含，而不是用于“真正的”程序。


    ### 相比 JavaScript


    JavaScript 可以在客户端生成 HTML，但很难与服务器交互。


    ### 相比静态 HTML


    普通的 HTML 无法包含动态信息。


