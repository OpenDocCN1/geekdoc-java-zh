    \ |\n| Formatted Number (7) | 023% |\n| Formatted Number (8) | 120E3 |\n| Currency\
    \ in USA | $120,000.23 |\n\n## JSTL Core <fmt:parseNumber> Tag\n\nThe <fmt:parseNumber>\
    \ tag is used to parse **numbers, percentages, and currencies.**\n\n## Attribute\n\
    \nThe <fmt:parseNumber> tag has the following attributes:\n\n| Attribute | Description\
    \ | Required | Default |\n| :--- | :--- | :--- | :--- |\n| value | Numeric value\
    \ to read (parse) | No | Body |\n| type | NUMBER, CURRENCY, or PERCENT | No |\
    \ number |\n| parseLocale | Locale to use when parsing the number | No | Default\
    \ locale |\n| integerOnly | Whether to parse to an integer (true) or floating-point\
    \ number (false) | No | false |\n\n![](img/5626302a090fb89f52cde01d391f8bdc_152_0.png)\n\
    \n| pattern | Custom parsing pattern | No | None |\n| :--- | :--- | :--- | :---\
    \ |\n| time | Time zone of the displayed date | No | Default time zone |\n| var\
    \ | Name of the variable to store the parsed number | No | Print to page |\n|\
    \ scope | Scope of the variable to store the formatted number | No | page |\n\n\
    A pattern attribute is provided that works just like the pattern attribute for\
    \ the <fmt:number> tag. However, in the case of parsing, the pattern attribute\
    \ tells the parser what format to expect.\n\n## Example\n\n```\n<@ taglib prefix=\"\
    c\" uri=\"http://java.sun.com/jstl/core\" %>\n<@ taglib prefix=\"fmt\" uri=\"\
    http://java.sun.com/jstl/fmt\" %>\n\n<html>\n<head>\n<title>JSTL fmt:parseNumber\
    \ Tag</title>\n</head>\n<body>\n<h3>Number Parsing:</h3>\n<c:set var=\"balance\"\
    \ value=\"1250003.350\" />\n<fmt:parseNumber var=\"i\" type=\"number\" value=\"\
    ${balance}\" />\n<p>Parsed Number (1) : <c:out value=\"${i}\" /></p>\n<fmt:parseNumber\
    \ var=\"parseNumber\" type=\"number\" value=\"${balance}\" integerOnly=\"true\"\
    \ />\n<p>Parsed Number (2) : <c:out value=\"${i}\" /></p>\n</body>\n</html>\n\
    ```\n\nThe above code will produce the following result:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_153_0.png)\n\
    \n## Number Parsing:\n\nParsed Number (1) : 1250003.35\n\nParsed Number (2) :\
    \ 1250003\n\n## JSTL Core <fmt:formatDate> Tag\n\nThe <fmt:formatDate> tag is\
    \ used to format dates in a variety of ways.\n\n## Attribute\n\nThe <fmt:formatDate>\
    \ tag has the following attributes:\n\n| Attribute | Description | Required |\
    \ Default |\n| :--- | :--- | :--- | :--- |\n| value | Date value to display |\
    \ Yes | None |\n| type | DATE, TIME, or BOTH | No | date |\n| dateStyle | FULL,\
    \ LONG, MEDIUM, SHORT, or DEFAULT | No | default |\n| timeStyle | FULL, LONG,\
    \ MEDIUM, SHORT, or DEFAULT | No | default |\n| pattern | Custom formatting pattern\
    \ | No | None |\n| timeZone | Zone of the displayed date | No | Default zone |\n\
    | var | Name of the variable to store the formatted date | No | Print to page\
    \ |\n| scope | Scope of the variable to store the formatted date | No | page |\n\
    \nThe pattern attribute is used to specify even more precise handling of the date:\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_154_0.png)\n\n| Code | Purpose | Sample\
    \ |\n| :--- | :--- | :--- |\n| G | The era designator | AD |\n| y | The year |\
    \ 2002 |\n| M | The month | April & 04 |\n| d | The day of the month | 20 |\n\
    | h | The hour(12-hour time) | 12 |\n| H | The hour(24-hour time) | 0 |\n| m |\
    \ The minute | 45 |\n| s | The second | 52 |\n| S | The millisecond | 970 |\n\
    | E | The day of the week | Tuesday |\n| D | The day of the year | 180 |\n| F\
    \ | The day of the week in the month | 2 (2nd Wed in the month) |\n| w | The week\
    \ in the year | 27 |\n| W | The week in the month | 2 |\n| a | The a.m./p.m. indicator\
    \ | PM |\n| k | The hour(12-hour time) | 24 |\n| K | The hour(24-hour time) |\
    \ 0 |\n| z | The time zone | Standard Time |\n| ' | The escape for text |\n\n\
    ## Example\n\n```\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n<%@ taglib prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n\n\
    <html>\n<head>\n  <title>JSTL fmt:dateFormat Tag</title>\n</head>\n<body>\n  <h3>Number</h3>\n\
    \  <c:set var=\"now\" value=\"<%= java.util.Date() %> />\n\n  <p>Formatted Date\
