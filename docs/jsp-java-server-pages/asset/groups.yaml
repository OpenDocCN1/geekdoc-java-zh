    ## 21. JSP – Sending Email\n\nIn this chapter, we will discuss how to send emails\
    \ using JSP. To send an email using a JSP, you should have the JavaMail API and\
    \ the Java Activation Framework (JAF) installed on your machine.\n\n- You can\
    \ download the latest version of JavaMail (Version 1.2) from the Java's standard\
    \ website.\n- You can download the latest version of JavaBeans Activation Framework\
    \ JAF (Version 1.0.2) from the Java's standard website.\n\nDownload and unzip\
    \ these files, in the newly-created top-level directories. You will find a number\
    \ of jar files for both the applications. You need to add the mail.jar and the\
    \ activation.jar files in your CLASSPATH.\n\n### Send a Sample Email\n\nHere is\
    \ an example to send a simple email from your machine. It is assumed that your\
    \ localhost is connected to the Internet and that is capable enough to send an\
    \ email. Make sure all the files from the Java Email API package and the JAF package\
    \ are available in CLASSPATH.\n\n```jsp\n<%@ page import=\"java.*,java.util.*,javax.mail.**\"\
    %>\n<%@ page import=\"java.mail.internet.*,javax.activation.**\"%>\n<%@ page import=\"\
    java.servlet.*,javax.servlet.*\" %>\n<%\nString result;\n// Recipient's email\
    \ ID needs to be mentioned.\nString to = \"abcd@gmail.com\";\n\n// Sender's email\
    \ ID needs to be mentioned\nString from = \"cmcmhod@gmail.com\";\n\n// Assuming\
    \ you are sending email from localhost\nString host = \"localhost\";\n\n// Get\
    \ system properties object\nProperties properties = System.getProperties();\n\n\
    // Setup mail server\nproperties.setProperty(\"mail.smtp.host\", host);\n```\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_121_0.png)\n\n```java\n// Get the default\
    \ Session object.\nSession mailSession = Session.getDefaultInstance(properties);\n\
    \ntry{\n    // Create a default MimeMessage object.\n    MimeMessage message =\
    \ new MimeMessage(mailSession);\n    // Set From: header field of the header.\n\
    \    message.setFrom(new InternetAddress(from));\n    // Set To: header field\
    \ of the header.\n    message.addRecipient(Message.RecipientType.TO, new InternetAddress(to));\n\
    \    // Set Subject: header field\n    message.setSubject(\"This is the Subject\
    \ Line!\");\n    // Now set the actual message\n    message.setText(\"This is\
    \ actual message\");\n    // Send message\n    Transport.send(message);\n    result\
    \ = \"Sent message successfully....\";\n} catch (MessagingException exception)\
    \ {\n    exception.printStackTrace();\n    result = \"Error: unable to send message...\"\
    ;\n}\n%>\n<<html>\n<head>\n<title>Send Email using JSP</title>\n</head>\n<body>\n\
    <center>\n<h1>Send Email using JSP</h1>\n</center>\n<p align=\"center\">\n<%\n\
    \    out.println(\"Result: \" + result + \"\\n\");\n%>\n</p>\n</body>\n</html>\n\
    ```\n\n```html\n<html>\n```\n\nLet us now put the above code in SendEmail.jsp\
    \ file and call this JSP using the URL http://localhost:8080/SendEmail.jsp. This\
    \ will help send an email to the given email ID abcd@gmail.com. You will receive\
    \ the following response:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_123_0.png)\n\
    \nResult: Sent message successfully....\n\nIf you want to send an email to multiple\
    \ recipients, then use the following methods to specify multiple IDs:\n\n```java\n\
    void addRecipients(Message.RecipientType type, Address[] addresses)\nthrows MessagingException\n\
    ```\n\nHere is the description of the parameters:\n\n- type: This would be set\
    \ to TO, CC or BCC. BCC represents Black Carbon Copy. Example Message.RecipientType.TO\n\
    - addresses: This is the array of email ID. You would need to use the InternetAddress()\
    \ method while specifying email IDs\n\n### Send an HTML Email\n\nHere is an example\
    \ to send an HTML email from your machine. It is assumed that your localhost is\
