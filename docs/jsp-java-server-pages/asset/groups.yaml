    \ javax.servlet.http.HttpServlet.service(HttpServlet.java:722) |\n\n## Using Try...Catch\
    \ Block\n\nIf you want to handle errors within the same page and to take some\
    \ action instead of firing an error page, you can make use of the try...catch\
    \ block.\n\nFollowing is a simple example which shows how to use the try...catch\
    \ block. Let us put the following code in main.jsp:\n\n```jsp\n<html>\n<head>\n\
    \  <title>Try...Catch Example</title>\n</head>\n<body>\n<%\ntry{\n  int i = 1;\n\
    \  i = i / 0;\n  out.println(\"The answer is \" + i);\n}\n catch (Exception e){\n\
    \  out.println(\"An exception occurred: \" + e.getMessage());\n}\n%>\n</body>\n\
    </html>\n```\n\nAccess the main.jsp, it should generate an output somewhat like\
    \ the following:\n\n| An exception occurred: / by zero |\n\n## 29. JSP — Debugging\n\
    \nIn this chapter, we will discuss Debugging a JSP. It is always difficult testing/debugging\
    \ a JSP and servlets. JSP and Servlets tend to involve a large amount of client/server\
    \ interaction, making errors likely but hard to reproduce.\n\nThe following are\
    \ a few hints and suggestions that may aid you in your debugging.\n\n### Using\
    \ System.out.println()\n\nSystem.out.println() is easy to use as a marker to test\
    \ whether a certain piece of code is being executed or not. We can print variable\
    \ values as well. Consider the following additional points:\n\n- Since the System\
    \ object is part of the Java objects, it can be used everywhere without the need\
    \ to install any extra classes. This includes Servlets, JSP, RMI, EJB's, ordinary\
    \ Beans and classes, and standalone applications.\n- Compared to stopping at breakpoints,\
    \ writing to System.out doesn't interfere much with the normal execution flow\
    \ of the application, which makes it very valuable when the timing is crucial.\n\
    \nFollowing is the syntax to use System.out.println():\n\n```java\nSystem.out.println(\"\
    Debugging message\");\n```\n\nFollowing example how to use System.out.println():\n\
    \n```jsp\n<@taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n\
    <html>\n<head><title>System.out.println</title></head>\n<body>\n<c:forEach var=\"\
    counter\" begin=\"1\" end=\"10\" step=\"1\">\n<c:out value=\"${counter-5}\"/><br>\n\
    <% System.out.println(\"counter = \" + pageContext.findAttribute(\"counter\"));\
    \ %>\n</c:forEach>\n</body>\n</html>\n```\n\nAccess the above JSP, the browser\
    \ will show the following result:\n\n```\n-4\n-3\n-2\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_264_0.png)\n\
    \n```\n-1\n0\n1\n2\n3\n4\n5\n```\n\nIf you are using Tomcat, you will also find\
    \ these lines appended to the end of **stdout.log** in the logs directory.\n\n\
    ```\ncounter=1\ncounter=2\ncounter=3\ncounter=4\ncounter=5\ncounter=6\ncounter=7\n\
    counter=8\ncounter=9\ncounter=10\n```\n\nThis way you can bring variables and\
    \ other information into the system log which can be analyzed to find out the\
    \ root cause of the problem or for various other reasons.\n\n### Using the JDB\
    \ Logger\n\nThe J2EE framework is designed to provide logging services for any\
    \ class running in the JVM. We can make use of this framework to log any information.\n\
    \nLet us re-write the above example using JDK logger API:\n\n```jsp\n<@taglib\
    \ prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ page import=\"\
    java.util.logging.Logger\" %>\n\n<html>\n<head><title>Logger.info</title></head>\n\
    <body>\n<% Logger logger=Logger.getLogger(this.getClass().getName());%>\n\n<c:forEach\
    \ var=\"counter\" begin=\"1\" end=\"10\" step=\"1\">\n  <c:set var=\"myCount\"\
    \ value=\"${counter-5}\" />\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_265_0.png)\n\
    \n```\n<c:out value=\"${myCount}\"/><br>\n<% String message = \"counter=\"\n \
    \   + pageContext.findAttribute(\"counter\")\n    + \"myCount=\"\n    + pageContext.findAttribute(\"\
    myCount\");\n    logger.info( message );\n%>\n</c:forEach>\n</body>\n</html>\n\
    ```\n\nThe above code will generate similar result on the browser and in stdout.log,\
    \ but you will have additional information in stdout.log. We will use the info\
    \ method of the logger because log message is for just purpose. Following is a\
