    # JSTL Core <c:if> Tag


    The <c:if> tag evaluates an expression and displays its body content only if the
    expression evaluates to true.


    # Attribute


    The <c:if> tag has the following attributes:


    | Attribute | Description | Required | Default |

    |---|---|---||}{

    | test | Condition to evaluate | Yes | None |

    | var | Name of the variable to store the condition''s result | No | None |

    | scope | Scope of the variable to store the condition''s result | No | page |


    # Example


    ```

    <@taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    <html>

    <head>

    <title><c:if> Tag</title>

    </head>

    <body>

    <c:set var="salary" scope="session" value="${2000*2}" />

    <c:if test="${salary > 2000}>

    <p>My salary is: <c:out value="${salary}"/></p>

    </c:if>

    </body>

    </html>

    ```


    The above code will produce the following result:


    My salary is: 4000


    # JSTL Core <c:choose> Tag


    The <c:choose> works like a Java switch statement that it lets you choose between
    a number of alternatives. Where the switch statement has cases, the <c:choose>
    has <c:when> tags. As a switch statement has the default clause to specify a default
    action, <c:choose> has <c:otherwise> as the default clause.


    ![](img/5626302a090fb89f52cde01d391f8bdc_136_0.png)'
- md: "\n## Attribute\n\n- The <c:choose> tag does not have any attribute.\n- The\
