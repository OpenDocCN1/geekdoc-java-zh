    # # Methods to Set HTTP Status Code


    Following methods can be used to set the HTTP Status Code in your servlet program.
    These methods are available with the HttpServletResponse object.


    | S.NO. | Method & Description |

    |---|---|

    | 1 | **public void setStatus ( int statusCode )**

    This method sets an arbitrary status code. The setStatus method takes an int (the
    status code) as an argument. Your response includes a special status code and
    a document, be sure to call **setStatus** before actually returning any of the
    content with the PrintWriter. |

    | 2 | **public void sendRedirect(String url)**

    This method generates a 302 response along with a *Location* header giving the
    URL of the new document. |

    | 3 | **public void sendError(int code, String message)**

    This method sends a status code (usually 404) along with a short message that
    is automatically formatted inside an HTML document and sent to the client. |


    # # HTTP Status Code Example


    Following example shows how a 407 error code is sent to the client browser. After
    this, the browser would show you "Need authentication!!!" message.


    ```

    <html>

    <head>

    <title>Setting HTTP Status Code</title>

    </head>

    <body>

    %

    // Set error code and reason.

    response.sendError(407, "Need authentication!!!");

    %

    </body>

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_75_0.png)'
