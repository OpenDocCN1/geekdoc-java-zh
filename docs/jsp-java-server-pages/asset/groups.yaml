    # The application Object


    The application object is a direct wrapper around the ServletContext object for
    the generated Servlet and in reality an instance of a javax.servlet.ServletContext
    object.


    This is a representation of the JSP page through its entire lifecycle. This object
    is created when the JSP page is initialized and is removed when the JSP page is
    removed by the jspDestroy() method.


    By adding an attribute to application, you can ensure that all JSP files that
    make up your web application have access to it.


    We will check the use of Application Object in JSP - Hits Counter chapter.


    # The config Object


    The config object is an instantiation of javax.servlet.ServletConfig and is a
    direct wrapper around the ServletConfig object for the generated servlet.


    This object allows the JSP programmer to access the Servlet or JSP engine initialization
    parameters such as the paths or file locations etc.


    The following config method is the only one you might use, and its usage is trivial:


    ```

    config.getServletName();

    ```


    This returns the servlet name, which is the string contained in the <servlet-name>
    element defined in the WEB-INF\web.xml file.


    # The pageContext Object


    The pageContext object is an instance of a javax.servlet.PageContext object. The
    pageContext object is used to represent the JSP page.


    This object is intended as a means to access information about the page while
    avoiding some of the implementation details.


    This object stores references to the request and response objects for each request.
    The application, config, session, and out objects are derived by accessing attributes
    of this object.


    The PageContext class defines several fields, including PAGE_SCOPE, REQUEST_SCOPE,
    SESSION_SCOPE, and APPLICATION_SCOPE, which identify the scopes. It supports more
    than 40 methods, about half of which are inherited from the javax.servlet.jsp.JspContext
    class.


    One of the important methods is removeAttribute. This method accepts one or two
    arguments. For example, pageContext.removeAttribute("attrName") removes the attribute
    from all scopes, while the following code removes it from the page scope:


    ```

    pageContext.removeAttribute("attrName", PAGE_SCOPE);

    ```


    The use of pageContext can be checked in JSP - File Uploading chapter.


    ![](img/5626302a090fb89f52cde01d391f8bdc_56_0.png)


    # The page Object


    This object is an actual reference to the instance of the page. It can be thought
    of as an object that represents the entire JSP page.


    The page object is really a direct synonym for the this object.


    # The exception Object


    The exception object is a wrapper containing the exception thrown from the previous
    page. It is typically used to generate an appropriate response to the error condition.


    We will cover the complete usage of this object in JSP - Exception Handling chapter.


    # 9. JSP – Client Request


    In this chapter, we will discuss Client Request in JSP. When a browser requests
    a Webpage, it sends a lot of information to the web server. This information cannot
    be read directly because this information travels as a part of header of request.
    You can check HTTP Protocol for more information on this.


    Following table lists the important header information which comes from the browser.
    This information is frequently used in web programming:


    | Header | Description |

    | --- | --- |

    | Accept | This header specifies the MIME types that the browser or other clients
    can handle. Values of image/png or image/jpeg are the two most common possibilities.
    |

    | Accept-Charset | This header specifies the character sets that the browser can
    use to display the information. For example, ISO-8859-1. |

    | Accept-Encoding | This header specifies the types of encodings that the browser
    knows to handle. Values of gzip or compress are the two most common possibilities.
    |

    | Accept-Language | This header specifies the client''s preferred languages in
    case the servlet can produce results in more than one language. For example, en,
    en-us, ru, etc. |

    | Authorization | This header is used by clients to identify themselves when accessing
    password-protected webpages. |

    | Connection | This header indicates whether the client can handle persistent
    HTTP connections. Persistent connections permit the client or other browser to
    retrieve multiple files with a single request. A value of Keep-Alive means that
    persistent connections should be used. |

    | Content-Length | This header is applicable only to POST requests and gives the
    size of the POST data in bytes. |

    | Cookie | This header returns cookies to servers that previously sent them to
    the browser. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_58_0.png)


    | Header | Description |

    | --- | --- |

    | Host | This header specifies the host and port as given in the original URL.
    |

    | If-Modified-Since | This header indicates that the client wants the page only
    if it has been changed after the specified date. The server sends a code, 304
    which means Not Modified if no newer result is available. |

    | If-Unmodified-Since | This header is the reverse of If-Modified-Since; it specifies
    that the operation should succeed only if the document is older than the specified
    date. |

    | Referer | This header indicates the URL of the referring webpage. For example,
    if you are at Webpage 1 and click on a link to Webpage 2, the URL of Webpage 1
    is included in the Referer header when the browser requests Webpage 2. |

    | User-Agent | This header identifies the browser or other client making the request
    and can be used to return different content to different types of browsers. |


    ## HttpServletRequest Object


    The request is an instance of javax.servlet.http.HttpServletRequest. This object
    allows the JSP programmer to access the Servlet or JSP engine initialization parameters
    such as the paths or file locations etc.


    The following config method is the only one you might use, and its usage is trivial:


    ```

    config.getServletName();

    ```


    This returns the servlet name, which is the string contained in the <servlet-name>
    element defined in the WEB-INF\web.xml file.


    The request provides methods to get the header.


    | NO. | Method | Description |

    | --- | --- |

    | 1 | getHeader(String name) | Returns the value of the specified header as a
    String. |

    | 2 | getCookies() | Returns an array of Cookie objects containing all the |

    | 3 | getHeaderNames() | Returns an enumeration of the header names. |

    | 4 | getContextPath() | Returns the portion of the request URI that indicates
    the context. |

    | 5 | getMethod() | Returns the name of the HTTP method with which this request
    was made, for example, GET, or POST. |

    | 6 | getParameter(String name) | Returns the value of a request parameter as
    a String, or null if the parameter does not exist. |

    | 7 | getPathInfo() | Returns any extra path information associated with the URL
    the client sent when it was made. |

    | 8 | getProtocol() | Returns the name and version of the protocol the request
    uses. |

    | 9 | getQueryString() | Returns the query string that is contained in the request
    URL after the path. |

    | 10 | getRemoteAddr() | Returns the Internet Protocol (IP) address of the client
    that sent the request. |

    | 11 | getRemoteHost() | Returns the fully qualified name of the client that sent
    the request. |

    | 12 | getRemoteUser() | Returns the login of the user making this request, if
    the user has been authenticated, or null if the user has not been authenticated.
    |

    | 13 | getRequestURI() | Returns the part of this request''s URL from the protocol
    name up to the query string in the first line of the HTTP request. |

    | 14 | getAttribute(String name) | Returns the value of the named attribute, as
    an Object. |


    ![](img/5626302a090fb89f52cde01d391f8bdc_59_0.png)


    # The exception Object


    The exception object is a wrapper containing the exception thrown from the previous
    page. It is typically used to generate an appropriate response to the error condition.


    We will cover the complete usage of this object in JSP - Exception Handling chapter.


    # The HeaderNames


    Returns an enumeration of the header names.


    # The ParameterNames


    Returns an enumeration of the parameters.


    # The HttpSession


    Returns the current session, or if there is no session, creates one.


    # The HttpSession(boolean create)


    Returns the current session or if create is true, returns a new session.


    # The Locale


    Returns the preferred Locale that the client will accept based on the Accept-Language
    header.


    # The CharacterEncoding


    Returns the name of the character encoding used in the body.


    # The ContentType


    Returns the MIME type of the request, or null if the type is not known.


    # The InputStream


    Retrieves the body of the request as binary data.


    # The AuthType


    Returns the name of the authentication scheme used to protect the servlet, for
    example, "BASIC" or "SSL", or null if the JSP was not protected.


    ![](img/5626302a090fb89f52cde01d391f8bdc_60_0.png)

