    \ var=\"snapshot\" driver=\"com.mysql.jdbc.Driver\"\nurl=\"jdbc:mysql://localhost/TEST\"\
    \nuser=\"root\" password=\"cohondb\"/>\n```\n\n```jsp\n<%\nDate DOB = new Date(\"\
    2001/12/16\");\nint studentId = 100;\n%>\n```\n\n```jsp\n<sql:transaction dataSource=\"\
    ${snapshot}\">\n  <sql:update var=\"count\">\n    UPDATE Students SET last = 'Ali'\
    \ WHERE Id = 102\n  </sql:update>\n  <sql:update var=\"count\">\n    UPDATE Students\
    \ SET last = 'Shah' WHERE Id = 103\n  </sql:update>\n  <sql:update var=\"count\"\
    >\n    INSERT INTO Students\n    VALUES (104, 'Nuha', 'Ali', '2010/05/26');\n\
    \  </sql:update>\n</sql:transaction>\n```\n\n```jsp\n<sql:query dataSource=\"\
    ${snapshot}\" var=\"result\">\n  SELECT * from Students;\n</sql:query>\n```\n\n\
    <table border=\"1\" width=\"100%\">\n  <tr>\n    <th>Emp ID</th>\n    <th>First\
    \ Name</th>\n    <th>Last Name</th>\n    <th>DOB</th>\n  </tr>\n  <tr>\n    <td><c:out\
    \ value=\"${row.id}\"/></td>\n    <td><c:out value=\"${row.first}\"/></td>\n \
    \   <td><c:out value=\"${row.last}\"/></td>\n  </tr>\n```\n\n```jsp\n    <td><c:out\
    \ value=\"${row.dob}\"/></td>\n  </tr>\n  </c:forEach>\n</table>\n\n</body>\n\
    </html>\n```\n```jsp\n</body>\n</html>\n```\n```\n\n访问上面的 JSP，将显示以下结果：\n\n| Emp\
    \ ID | First Name | Last Name | Dob |\n|---|---|---|---|\n| 100 | Zara | Ali |\
    \ 2001-12-16 |\n| 101 | Mahnaz | Fatma | 1978-11-28 |\n| 102 | Zaid | Ali | 1980-10-10\
    \ |\n| 103 | Sumit | Shah | 1971-05-08 |\n| 104 | Nuha | Ali | 2010-05-26 |\n\n\
    # XML 标签\n\nJSTL XML 标签提供了一种以 JSP 为中心的方法创建和操作 XML。以下是在 JSP 中引入 XML 库的语法：\n\n```jsp\n\
    <%@ taglib prefix=\"x\" uri=\"http://java.sun.com/jstl/xml\" %>\n```\n\n在继续示例之前，你需要在\
    \ Tomcat\\lib 中拷贝以下两个 XML 相关的库：\n\n- XercesImpl.jar: 下载 http://www.apache.org/dist/xerces\n\
    - xalan.jar: 下载 http://xml.apache.org/xalan-j/index.html\n\n以下是 XML JSTL 标签列表：\n\
    \n| 标签 | 说明 |\n|---|---|\n\n![](img/5626302a090fb89f52cde01d391f8bdc_191_0.png)\n\
    \n| <x:out> | 类似于 <%= % |\n| <x:parse> | 通过属性或标签体解析 XML。 |\n| <x:set > | 将变量设置为\
    \ XPath 表达式的值。 |\n| <x:if> | 评估测试 XPath 表达式，如果为真，则处理正体。如果条件为假，则忽略正体。 |\n| <x:forEach>\
    \ | 遍历 XML 文档中的节点。 |\n| <x:choose> | 普通条件标签，建立互斥条件操作上下文，由 <when> 和 <otherwise>\
    \ 标签标记。 |\n| <x:when> | <choose> 的子标签，如果其表达式为真，则包含其正体。 |\n| <x:otherwise > | <choose>\
    \ 的子标签，当所有先前的条件为“假”运行时运行。 |\n| <x:transform > | 对 XML 文档应用 XSL 转换。 |\n| <x:param\
    \ > | 与 transform 标签一起使用，在 XSLT 表中设置参数。 |\n\n# JSTL XML <x:out> 标签\n\n**x:out>**\
    \ 标签显示 XPath 表达式的结果。它的功能与 `<%= %>` 语法相同。\n\n182\n\n![](img/5626302a090fb89f52cde01d391f8bdc_192_0.png)\n\
    \n"
