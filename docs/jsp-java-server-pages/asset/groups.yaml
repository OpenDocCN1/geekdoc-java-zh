    # 21. JSP – Sending Email


    In this chapter, we will discuss how to send emails using JSP. To send an email
    using a JSP, you should have the JavaMail API and the Java Activation Framework
    (JAF) installed on your machine.


    +   * You can download the latest version of JavaMail (Version 1.2) from the Java''s
    standard website.

    * You can download the latest version of JavaBeans Activation Framework JAF (Version
    1.0.2) from the Java''s standard website.


    Download and unzip these files, in the newly-created top-level directories. You
    will find a number of jar files for both the applications. You need to add the
    mail.jar and the activation.jar files in your CLASSPATH.


