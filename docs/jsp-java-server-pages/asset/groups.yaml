    \ | 否 | 无 |\n\n<c:forTokens> 标签的属性与 <c:forEach> 标签相似，多了一个额外的属性 `delims` 用于指定作为分隔符的字符。\n\
    \n| 属性 | 描述 | 是否必须 | 默认值 |\n|---|---|---|---|\n| delims | 用于分隔符的字符 | 是 | 无 |\n\
    \n## <c:forEach> 示例\n\n```html\n<%@taglib uri=\"http://java.sun.com/jsp/core\"\
    \ prefix=\"c\" %>\n<html>\n<head>\n<title><c:forEach> 标签示例</title>\n</head>\n\
    <body>\n<c:forEach var=\"i\" begin=\"1\" end=\"5\">\nItem <c:out value=\"${i}\"\
