    You will receive the following result:\n\nFinal sub string : is first String.\n\
    \n# JSTL fn:substringBefore() Function\n\nThe fn:substringBefore() function returns\
    \ the part of a string before a specified substring.\n\n# Syntax\n\nThe fn:substringBefore()\
    \ function has following syntax:\n\n```\njava.lang.String substringBefore(java.lang.String,\
