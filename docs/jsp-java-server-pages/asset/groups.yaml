    \ Tags</title>\n</head>\n<body>\n<h3>Books Info:</h3>\n<c:set var=\"xmltext\"\
    >\n<books>\n<book>\n<name>Padam History</name>\n<author>ZARA</author>\n<price>100</price>\n\
    </book>\n<book>\n<name>Great Mistry</name>\n<author>NUHA</author>\n<price>2000</price>\n\
    </book>\n</books>\n</c:set>\n\n<c:import url=\"http://localhost:8080/style.xsl\"\
    \ var=\"xslt\"/>\n<x:transform xml=\"${xmltext}\" xslt=\"${xslt}\" />\n</body>\n\
    </html>\n```\n\nThe following result will be displayed:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_240_0.png)\n\
    \n| | | |\n|---|---|---|\n| Padam History | ZARA | 100 |\n| Great Mistry | NUHA\
    \ | 2000 |\n\nTo know more about XML processing using JSTL, you can check JSP\
    \ Standard Tag Library.\n\n# 25. JSP – JavaBeans\n\nA JavaBean is a specially\
    \ constructed Java class written in the Java and coded according to the JavaBean\
    \ API specifications.\n\nFollowing are the unique characteristics that distinguish\
    \ a JavaBean from other Java classes:\n\n- It provides a default, no-argument\
    \ constructor.\n- It should be serializable and that can implement the Serializable\
    \ interface.\n- It may have a number of properties which can be read or written.\n\
    - It may have a number of \"getter\" and \"setter\" methods for the properties.\n\
    \n# JavaBeans Properties\n\nA JavaBean property is a named attribute that can\
    \ be accessed by the user of the object. The attribute can be of any Java data\
    \ type, including the classes that you define.\n\nA JavaBean property may be read,\
    \ write, read only, or write only. JavaBean properties are accessed through two\
    \ methods in the JavaBean's implementation class:\n\n| Method | Description |\n\
    | --- | --- |\n| getPropertyName() | For example, if property name is firstName,\
    \ your method would be getFirstName() to read that property. This method is called\
    \ accessor. |\n| setPropertyName() | For example, if property name is firstName,\
    \ your method would be setFirstName() to write that property. This method is called\
    \ mutator. |\n\nA read-only attribute will have only getPropertyName() method,\
    \ and a write-only attribute will have only setPropertyName() method.\n\n# JavaBeans\
    \ Example\n\nConsider a student with few properties:\n\n```java\npackage com.tutorialspoint;\n\
    \npublic class Students implements java.io.Serializable {\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_242_0.png)\n\
    \n```java\nprivate String firstName = null;\nprivate String lastName = null;\n\
    private int age = 0;\n\npublic Students() {\n}\npublic String getFirstName() {\n\
    \  return firstName;\n}\npublic String getLastName() {\n  return lastName;\n}\n\
    public int getAge() {\n  return age;\n}\npublic void setFirstName(String firstName)\
    \ {\n  this.firstName = firstName;\n}\npublic void setLastName(String lastName)\
    \ {\n  this.lastName = lastName;\n}\npublic void setAge(int age) {\n  this.age\
    \ = age;\n}\n```\n\n# Access JavaBeans\n\nThe JavaBean declares a Bean for use\
    \ in JSP. Once declared, the bean becomes a scripting variable that can be accessed\
    \ by both scripting elements and other tags in the JSP. The full syntax for the\
    \ JavaBean is as follows:\n\n```jsp\n<jsp:useBean id=\"\" name=\"\" scope=\"\"\
    \ type=\"\"/>\n```\n\nThe scope attribute can be page, request, session or application\
    \ based on your requirement. The id attribute may be any value as long as it is\
    \ unique among other Bean declarations in the same JSP. Following example shows\
    \ how to use the JavaBean action:\n\n```html\n<html>\n<head>\n<title>useBean Example</title>\n\
    </head>\n<body>\n<jsp:useBean id=\"date\" class=\"java.util.Date\" />\n<p>The\
    \ date/time is <%= date %></p>\n</body>\n</html>\n```\n\nYou will receive the\
    \ following result:\n\n| The date/time is Thu Sep 30 18:11 GST 2010 |\n\n# Access\
    \ JavaBeans Properties\n\nAlong with `<jsp:useBean>` action, you can use the `<jsp:getProperty>`\
    \ action to access the get methods and the `<jsp:setProperty>` action to access\
    \ the set methods. Here is the full syntax:\n\n```jsp\n<jsp:useBean id=\"\" name=\"\
    \" scope=\"\" type=\"\"/>\n<jsp:setProperty name=\"\" property=\"\" value=\"\"\
    />\n<jsp:getProperty name=\"\" property=\"\"/>\n```\n\nThe name attribute of `useBean`\
    \ references the id of a JavaBean previously introduced to the JSP by the `useBean`\
    \ action. The property attribute is the name of the `get` or `set` methods that\
    \ should be invoked. Following example shows how to access the data using the\
    \ above syntax:\n\n```html\n<html>\n<head>\n<title>get and set properties Example</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_244_0.png)\n\
    \n```jsp\n<jsp:useBean id=\"students\" class=\"com.tutorialspoint.StudentsBean\"\
    >\n<jsp:setProperty name=\"students\" property=\"firstName\" value=\"Zara\"/>\n\
    <jsp:setProperty name=\"students\" property=\"lastName\" value=\"Ali\"/>\n<jsp:setProperty\
    \ name=\"students\" property=\"age\" value=\"10\"/>\n</jsp:useBean>\n```\n\n<p>Student\
    \ First Name:\n<jsp:getProperty name=\"students\" property=\"firstName\"/>\n</p>\n\
    <p>Student Last Name:\n<jsp:getProperty name=\"students\" property=\"lastName\"\
    />\n</p>\n<p>Student Age:\n<jsp:getProperty name=\"students\" property=\"age\"\
    />\n</p>\n\n```html\n<body>\n</html>\n```\n\nWe make the StudentsBean.class available\
    \ in CLASPATH. Access the above JSP. the following result will be displayed:\n\
    \n| Student First Name: Zara |\n| Student Last Name: Ali |\n| Student Age: 10\
    \ |\n\nIn this chapter, we will discuss the Custom Tags in JSP. A custom tag is\
    \ a user-defined JSP language element. When a JSP page containing a custom tag\
    \ is translated into a servlet, the tag is converted to operations on an object\
    \ called a tag handler. The Web container invokes those operations when the JSP\
    \ page's servlet is executed.\n\nJSP tag extensions let you create tags that you\
    \ can insert directly into a JSP. The JSP 2.0 specification introduced the Simple\
    \ Handlers for writing your custom tags.\n\nTo write a custom tag, you can simply\
    \ extend SimpleTagSupport class and override the doTag() method, where you can\
    \ place your code to generate content for the tag.\n\n# Create \"Hello\" Tag\n\
    \nConsider you want to define a custom tag named <ex:Hello> and you want to use\
    \ it in the following fashion without a body:\n\n```xml\n<ex:Hello />\n```\n\n\
    To create a JSP tag, you must first create a Java class that acts as a tag handler.\
    \ Let us now create the HelloTag class as follows:\n\n```java\npackage com.tutorialspoint;\n\
    \nimport javax.servlet.jsp.tagext.*;\nimport javax.servlet.jsp.*;\nimport java.io.*;\n\
    \npublic class HelloTag extends SimpleTagSupport {\n\npublic void doTag() throws\
    \ JspException, IOException {\nspWriter out = getJspContext().getWriter();\nout.println(\"\
    Hello Custom Tag!\");\n}\n}\n```\n\nThe above code has simple coding where the\
    \ doTag() method takes the current JspContext object using the getJspContext()\
    \ method and uses it to send \"Hello Custom Tag!\" to the current JspWriter object.\n\
    \nLet us compile the above class and copy it in a directory available in the environment\
    \ variable CLASPATH. Finally, create the following tag library file: <Tomcat-Installation-Directory>webapps\\\
    ROOT\\WEB-INF\\custom.tld.\n\n```xml\n<taglib>\n<tlib-version>1.0</tlib-version>\n\
    <jsp-version>2.0</jsp-version>\n<short-name>Example TLD</short-name>\n<tag>\n\
    \  <name>Hello</name>\n  <tag-class>com.tutorialspoint.HelloTag</tag-class>\n\
    \  <body-content>empty</body-content>\n</tag>\n</taglib>\n```\n\nLet us now use\
    \ the above defined custom tag Hello in our JSP as follows:\n\nCall the above\
    \ JSP and this should produce the following result:\n\n| Hello Custom Tag |\n\n\
    # Accessing the Tag Body\n\nYou can include a message in the body of the tag as\
    \ you have seen with standard tags. Consider you want to define a custom tag named\
    \ <ex:Hello> and you want to use it in the following fashion with a body:\n\n\
    ```xml\n<ex:Hello>\n  This is message body\n</ex:Hello>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_247_0.png)\n"
