    ## JSTL Core <c:param> 标签\n\n<c:param> 标签允许通过 URL 指定妥当的 URL 请求参数，并在需要时进行必要的 URL\
    \ 编码。\n在 `<c:param>` 标签内部，`name` 属性表示参数名称，`value` 属性表示参数值：\n\n## 属性\n\n`<c:param>`\
    \ 标签具有以下属性：\n\n| 属性 | 说明 | 必用 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| name |\
    \ 在 URL 中设置的请求参数名称 | 是 | 无 |\n| value | 在 URL 中设置的请求参数值 | 否 | Body内容 |\n\n## 示例\n\
    \n![](img/5626302a090fb89f52cde01d391f8bdc_145_0.png)\n\n如果你需要向 `<c:import>` 标签传递参数，请使用\
    \ `<c:url>` 标签先创建 URL，如下所示：\n\n```xml\n<c:url value=\"index.jsp\" var=\"myURL\"\
    >\n<c:param name=\"trackingId\" value=\"1234\"/>\n<c:param name=\"reportType\"\
    \ value=\"summary\"/>\n</c:url>\n<c:import url=\"${myURL}\"/>\n```\n\n上述请求将传递如下所示的\
    \ URL - 请亲自尝试一下。\n\n## JSTL Core <c:redirect> 标签\n\n`<c:redirect>` 标签通过便于自动重写将浏览器重定向到备\
    \ URL，它支持上下文相关的 URL，并且支持 `<c:param>` 标签。\n\n## 属性\n\n`<c:redirect>` 标签具有以下属性：\n\
    \n| 属性 | 说明 | 必用 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| url | 重定向用户浏览器的 URL\
    \ | 是 | 无 |\n| context | / 后跟本地 Web 应用程序的名称 | 否 | 当前应用程序 |\n\n## 示例\n\n如果你需要向\
    \ `<c:import>` 标签传递参数，请使用 `<c:url>` 标签先创建 URL，如下所示：\n\n```xml\n<%@ taglib uri=\"\
    http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n<head>\n<title><c:redirect>\
    \ 标签示例</title>\n</head>\n<body>\n<c:redirect url=\"http://www.photofuntoos.com\"\
    />\n</body>\n</html>\n```\n\n上述代码将请求重定向到 http://www.photofuntoos.com - 请亲自尝试一下。\n\
    \n## JSTL Core <c:url> 标签\n\n`<c:url>` 标签将 URL 格式化为字符串并将其存储在变量中。该标签在必要时自动执行 URL\
    \ 重写。`var` 属性指定包含格式化 URL 的变量。\n\nJSTL url 标签只是调用 `response.encodeURL()` 方法的替代方法。url\
    \ 标签提供的唯一实际优势是妥的 URL 编码，包括由子 param 标签指定的任何参数。\n\n## 属性\n\n`<c:url>` 标签具有以下属性：\n\
    \n| 属性 | 说明 | 必用 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| value | 基础 URL | 是\
    \ | 无 |\n| context | / 后跟本地 Web 应用程序的名称 | 否 | 当前应用程序 |\n| var | 暴露处理后 URL 的变量名称\
    \ | 否 | 打印到页面 |\n| scope | 暴露处理后 URL 的变量作用域 | 否 | 页面 (Page) |\n\n## 示例\n\n```xml\n\
    <%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\" %>\n<html>\n\
    <head>\n<title><c:url> 标签示例</title>\n</head>\n<body>\n<a href=\"<c:url value=\"\
    jsp/index.htm/\">TEST</a>\n</body>\n</html>\n```\n\n这将产生以下结果：\n\n![](img/5626302a090fb89f52cde01d391f8bdc_147_0.png)\n\
    \n## 格式化标签\n\nJSTL 格式化标签用于为国际化网站格式化并显示文本、日期、时间和数字。以下是在你的 JSP 中包含格式化库的语法：\n\n```xml\n\
    <%@ taglib prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n```\n\n\
    以下是格式化 JSTL 标签列表：\n\n| 标签 | 说明 |\n| :--- | :--- |\n| <fmt:formatNumber> | 使用特定的精度或格式渲染数值值。\
    \ |\n| <fmt:Number> | 解析数字、货币或百分比的字符串表示。 |\n| <fmt:formatDate> | 使用提供的样式和模式格式化日期和或时间。\
    \ |\n| <fmt:parseDate> | 解析日期和/或时间的字符串表示。 |\n| <fmt:bundle> | 加载供其标签使用的资源包。 |\n\
    | <fmt:setLocale> | 设置给定的区域。 |\n| <fmt:setBundle> | 加载资源包。\n| | <fmt:timeZone>\
    \ | 指定时区。 |\n| <fmt:message> | 显示国际化消息。 |\n| <fmt:requestEncoding> | 格式化消息。 |\n\
    | | <fmt:formatNumber> | 用于格式化数字。 |\n\n## JSTL Core <fmt:formatNumber> 标签\n\n\
    `<fmt:formatNumber>` 标签用于格式化数字、百分比和货币。<fmt:formatNumber>` 标签具有以下属性：\n\n| 属性 |\
    \ 说明 | 必用 | 默认值 |\n| :--- | :--- | :--- | :--- |\n| value | 数值值 | 是 | 无 |\n| type\
    \ | 数字、货币或百分比 | 否 | 数字 |\n| pattern | 格式化模式 | 否 | 无 |\n| currencyCode | 货币代码 |\
    \ 否 | 默认 |\n| currencySymbol | 货币符号 | 否 | 默认 |\n| groupingUsed | 是否进行分组 | 否 |\
    \ true |\n| maxIntegerDigits | 最大整数位数 | 否 | 无 |\n| minIntegerDigits | 最小整数位数 |\
    \ 否 | 无 |\n| maxFractionDigits | 最大小数位数 | 否 | 3 |\n| minFractionDigits | 最小小数位数\
    \ | 否 | 0 |\n| var | 存储格式化结果的变量 | 否 | 打印到页面 |\n| scope | 变量的作用域 | 否 | Page |\n\
    \n## 示例\n\n```xml\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n<%@ taglib prefix=\"fmt\" uri=\"http://java.sun.com/jsp/jstl/fmt\" %>\n\n\
    <html>\n<head>\n<title>fmt:formatNumber 标签示例</title>\n</head>\n<body>\n<h3>数字格式化：</h3>\n\
    <c:set var=\"balance\" value=\"12000.2309\" />\n<p>格式化数字 (1): <fmt:formatNumber\
    \ value=\"${balance}\" type=\"currency\"/></p>\n<p>格式化数字 (2): <fmt:formatNumber\
    \ type=\"number\" maxIntegerDigits=\"3\" value=\"${balance}\" /></p>\n<p>格式化数字\
    \ (3): <fmt:formatNumber type=\"number\" maxFractionDigits=\"3\" value=\"${balance}\"\
    \ /></p>\n<p>格式化数字 (4): <fmt:formatNumber type=\"number\" groupingUsed=\"false\"\
    \ value=\"${balance}\" /></p>\n<p>格式化数字 (5): <fmt:formatNumber type=\"percent\"\
    \ maxIntegerDigits=\"3\" value=\"${balance}\" /></p>\n<p>格式化数字 (6): <fmt:formatNumber\
    \ type=\"percent\" minFractionDigits=\"10\" value=\"${balance}\" /></p>\n<p>格式化数字\
    \ (7): <fmt:formatNumber type=\"number\" maxFractionDigits=\"3\" value=\"${balance}\"\
    \ /></p>\n<p>格式化数字 (8): <fmt:formatNumber type=\"number\" pattern=\"#,###.##0\"\
    \ value=\"${balance}\" /></p>\n<p><fmt:setLocale value=\"en_US\" /><fmt:formatNumber\
    \ value=\"${balance}\" type=\"currency\"/></p>\n</body>\n</html>\n```\n\n"
