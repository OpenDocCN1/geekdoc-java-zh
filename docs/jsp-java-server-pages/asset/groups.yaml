    # 12. JSP – Form Processing


    In this chapter, we will divuss Form Processing in JSP. You must have come across
    many situations when you need to pass some information from your browser to the
    web server and ultimately to your backend program. The browser uses two methods
    to pass this information to the web server. These methods are the GET Method and
    the POST Method.


    # The Methods in Form Processing


    Let us now discuss the methods in Form Processing.


    # GET method


    The GET method sends the encoded user information appended to the page request.
    The page and the encoded information are separated by the ? character as follows:


    ```

    http://www.test.com/hello?key1=value1&key2=value2

    ```


    The GET method is the default method to pass information from the browser to the
    web server and it produces a long string that appears in your browser''s Location:box.
    It is recommended that the GET method is better not used. if you have password
    or sensitive information to pass to the server.


    The GET method has size limit: only 1024 characters can be in a request string.


    This information is passed using QUERY_STRING header and will be accessible through
    QUERY_STRING environment variable which can be handled using getQueryString()
    and getParameter() methods of request object.


    # POST method


    A generally more reliable method of passing information to a backend program is
    the POST method.


    This method packages the information in exactly the same way as the GET method,
    but instead of sending it as a string after a ? in the URL it sends as a separate
    message. This message comes to the backend program in the form of the standard
    input which you can parse and use for your processing.


    JSP handles this type of requests using getParameter() to read simple parameters
    and getInputStream() to read binary data stream coming from the client.


    # Reading Form Data using JSP


    JSP handles form parsing automatically using the following methods depending on
    the situation:


    +   getParameter(): You call request.getParameter() method to get the value of
    a form parameter.


    ![](img/5626302a090fb89f52cde01d391f8bdc_77_0.png)'
  - '[PAGE 78]


    +   - getParameterValues(): Call this method if the parameter appears more than
    once and returns multiple values, for example checkbox.


    +   - getParameterNames(): Call this method if you want a complete list of parameters
    in the current request.


    +   - getInputStream(): Call this method to read binary data stream coming from
    the client.


    # GET Method Example Using URL


    The following URL will pass two values to HelloForm program using GET method.


    ```

    http://localhost:8080/main.jsp?first_name=ZARA&last_name=ALI

    ```


    Below is the main.jsp JSP program to handle input given by web browser. We are
    going to use the getParameter() method which makes it very easy to access the
    passed information:


    ```

    <html>

    <head>

    <title>Using GET Method to Read Form Data</title>

    </head>

    <body>

    <center>

    <h1>Using GET Method to Read Form Data</h1>

    <ul>

    <li><p><b>First Name:</b></p>

    <% request.getParameter("first_name") %>

    </p></li>

    <li><p><b>Last Name:</b></p>

    <% request.getParameter("last_name") %>

    </p></li>

    </ul>

    </center>

    </body>

    </html>

    ```'
