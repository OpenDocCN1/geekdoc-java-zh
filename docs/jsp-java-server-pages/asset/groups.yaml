- md: '

    | Function | Description |

    |---|---|

    | fn:contains() | Tests if an input string contains the specified substring. |

    | fn:containsIgnoreCase() | Tests if an input string contains the specified substring
    in a case insensitive way. |

    | fn:endsWith() | Tests if an input string ends with the specified suffix. |

    | fn:escapeXml() | Escapes characters that can be interpreted as XML markup. |

    | fn:indexOf() | Returns the index within a string of the first occurrence of
    a specified substring. |

    | fn:join() | Joins all elements of an array into a string. |

    | fn:length() | Returns the number of items in a collection, or the number of
    characters in a string. |

    | fn:replace() | Returns a string resulting from replacing in an input string
    all occurrences with a given string. |

    | fn:split() | Splits a string into an array of substrings. |

    | fn:startsWith() | Tests if an input string starts with the specified prefix.
    |

    | fn:substring() | Returns a subset of a string. |

    | fn:substringAfter() | Returns a subset of a string following a specific substring.
    |

    | fn:substringBefore() | Returns a subset of a string before a specific substring.
    |

    | fn:toLowerCase() | Converts all of the characters of a string to lower case.
    |

    | fn:toUpperCase() | Converts all of the characters of a string to upper case.
    |

    | fn:trim() | Removes white spaces from both ends of a string. |


    ## JSTL fn:contains() Function


    The **fn:contains()** function determines whether an input string contains a specified
    substring.


    ## Syntax


    The **fn:contains()** function has the following syntax:


    ```

    boolean contains(java.lang.String, java.lang.String)

    ```


    ## Example


    Following example explains the functionality of **fn:contains()**


    ```

    <@ taglib uri="http://java.sun.com/jsp/jst/core" prefix="c" %>

    <%@ taglib uri="http://java.sun.com/jsp/jst/functions" prefix="fn" %>

    <html>

    <head>

    <title>JSTL Functions</title>

    </head>

    <body>

    <c:set var="theString" value="I am a test String"/>

    <c:if test="${fn:contains(theString, ''test'')}">

    <p>Found test string</p>

    </c:if>

    <c:if test="${fn:contains(theString, ''TEST'')}">

    ```


    ![](img/5626302a090fb89f52cde01d391f8bdc_214_0.png)


    ```

    <p>Found TEST string</p>

    </c:if>


    </body>

    </html>

    ```


    You will receive the following result:


    ## JSTL fn:containsIgnoreCase() Function


