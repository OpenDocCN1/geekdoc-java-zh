    \ prefix=\"fn\" %>\n<html>\n<head>\n<title>Using JSTL Functions</title>\n</head>\n\
    <body>\n<c:set var=\"string1\" value=\"This is first String.\" />\n<c:set var=\"\
    string2\" value=\"${fn:replace(string1, 'first', 'second')}\" />\n<p>Final String\
    \ : ${string2}</p>\n</body>\n</html>\n```\n\nYou will receive the following result:\n\
    \n```\nFinal String : This is second String.\n```\n\n# JSTL fn:split() Function\n\
    \nThe fn:split() function splits a string into an array of substrings based on\
    \ delimiter\n\n# Syntax\n\nThe fn:split() function has following syntax:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_221_0.png)\n\
    \njava.lang.String[] split(java.lang.String, java.lang.String)\n\n# Example\n\n\
    Following is the example to explain the functionality of the fn:split() function:\n\
    \n```\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@\
    \ taglib uri=\"http://java.sun.com/jsp/jst/functions\" prefix=\"fn\" %>\n<html>\n\
    <head>\n<title>JSTL Functions</title>\n</head>\n<body>\n<c:set var=\"string1\"\
    \ value=\"This is first String.\"/>\n<c:set var=\"string2\" value=\"${fn:split(string1,\
    \ ' ')}\"/>\n<c:set var=\"string3\" value=\"${fn:join(string2, '-')}\"/>\n\n<p>String\
    \ (3) : ${string3}</p>\n\n<c:set var=\"string4\" value=\"${fn:split(string3, '-')}\"\
    />\n<c:set var=\"string5\" value=\"${fn:join(string4, ' ')}\"/>\n\n<p>String (5)\
    \ : ${string5}</p>\n\n</body>\n</html>\n```\n\nYou will receive the following\
    \ result:\n\n| String (3) : This-is-first-String. |\n| String (5) : This is first-String.\
    \ |\n\n# JSTL fn:startsWith() Function\n\nThe fn:startsWith() function determines\
    \ if an input string starts with a specified substring.\n\n# Syntax\n\nThe fn:startsWith()\
    \ function has the following syntax:\n\n![](img/5626302a090fb89f52cde01d391f8bdc_222_0.png)\n\
    \n# Example\n\nFollowing example explains the functionality of the fn:startsWith()\
    \ function:\n\n```\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"\
    c\" %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/functions\" prefix=\"fn\"\
    \ %>\n<html>\n<head>\n<title>Using JSTL Functions</title>\n</head>\n<body>\n<c:set\
    \ var=\"string\" value=\"Second: This is first String.\"/>\n<c:if test=\"${fn:startsWith(string,\
    \ 'First')}\">\n<p>String starts with First</p>\n</c:if>\n<br />\n<c:if test=\"\
    ${fn:startsWith(string, 'Second')}\">\n<p>String starts with Second</p>\n</c:if>\n\
    </body>\n</html>\n```\n\nYou will receive the following result:\n\nString starts\
    \ with Second\n\n# JSTL fn:substring() Function\n\nThe fn:substring() function\
    \ returns a subset of a string specified by start and end indices.\n\n# Syntax\n\
    \nThe fn:substring() function has following syntax:\n\n```\njava.lang.String substring(java.lang.String,\
    \ int, int)\n```\n\n# Example\n\n![](img/5626302a090fb89f52cde01d391f8bdc_223_0.png)\n\
    \nFollowing@ taglib explains the functionality of the fn:substring() function:\n\
    \n```\n<%@ taglib uri=\"http://java.sun.com/jsp/jst/core\" prefix=\"c\" %>\n<%@\
