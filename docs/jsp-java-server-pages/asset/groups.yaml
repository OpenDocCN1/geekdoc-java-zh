    ```\n\nAccess the above JSP, the following result will be displayed:\n\nBooks\
    \ Info:\nThe price of the second book: null\n\n## JSTL XML <x:if> Tag\n\nThe <x:if>\
    \ tag evaluates a test XPath expression and if is true, it processes its body.\
    \ If the test condition is false, the body is ignored.\n\n## Attribute\n\nThe\
    \ <x:if> tag has the following attributes:\n\n| Attribute | Description | Required\
    \ | Default |\n|---|---|---|---|\n| select | The XPath expression to be evaluated\
    \ | Yes | None |\n| var | Name of the variable to store the condition's result\
    \ | No | None |\n| scope | Scope of the variable specified in the var attribute\
    \ | No | Page |\n\n## Example\n\nFollowing is an example that shows the use of\
    \ the <x:if> tag:\n\n```jsp\n<%@ taglib prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ %>\n<%@ taglib prefix=\"x\" uri=\"http://java.sun.com/jsp/jstl/xml\" %>\n\n\
    <html>\n<head>\n<title>JSTL x:if Tags</title>\n</head>\n<body>\n<h3>Books Info:</h3>\n\
    \n<c:set var=\"xmltext\">\n<books>\n<book>\n  <name>Padam History</name>\n  <author>ZARA</author>\n\
    \  <price>100</price>\n</book>\n<book>\n  <name>Great Mistry</name>\n  <author>NUHA</author>\n\
    \  <price>2000</price>\n</book>\n</books>\n</c:set>\n```\n\n```jsp\n<x:parse xml=\"\
    ${xmltext}\" var=\"output\"/>\n<x:if select=\"${output/book}\">\nDocument has\
    \ at least one <book> element.\n</x:if>\n<br />\n<x:if select=\"${output/books[1]/book/price\
    \ > 100}\">\nBook prices are very high\n</x:if>\n\n</body>\n</html>\n```\n\nLet\
    \ us now access the above JSP, the following result will be displayed:\n\nBooks\
    \ Info:\nDocument has at least one <book> element.\nBook prices are very high\n\
    \n## JSTL XML <x:forEach> Tag\n\nThe <x:forEach> tag is used to loop over nodes\
    \ in an XML document.\n\n## Attribute\n\nThe <x:forEach> tag has the following\
    \ attributes:\n\n| Attribute | Description | Required | Default |\n|---|---|---|---|\n\
    | select | The XPath expression to be evaluated | Yes | None |\n| var | Name of\
    \ the variable to store the current item for each loop | No | None |\n| begin\
    \ | The start index for the iteration | No | None |\n| end | The end index for\
    \ the iteration | No | None |\n| step | The size of the index increment while\
    \ iterating over the collection | No | None |\n| varStatus | The name of the variable\
    \ in which the status of the iteration is stored | No | None |\n\n## Example\n\
    \nThe following example shows the use of the <x:forEach> tag.\n\n```jsp\n<%@ taglib\
    \ prefix=\"c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ taglib prefix=\"\
    x\" uri=\"http://java.sun.com/jsp/jstl/xml\" %>\n\n<html>\n<head>\n<title>JSTL\
    \ x:forEach Tags</title>\n</head>\n<body>\n<h3>Books Info:</h3>\n\n<c:set var=\"\
    xmltext\">\n<books>\n<book>\n  <name>Padam History</name>\n  <author>ZARA</author>\n\
    \  <price>100</price>\n</book>\n<book>\n  <name>Great Mistry</name>\n  <author>NUHA</author>\n\
    \  <price>2000</price>\n</book>\n</books>\n</c:set>\n```\n\n```jsp\n<x:parse xml=\"\
    ${xmltext}\" var=\"output\"/>\n<ul class=\"list\">\n  <x:forEach select=\"$output/name\"\
    \ var=\"item\">\n    <li>Book Name: <x:out select=\"$item\" /></li>\n  </x:forEach>\n\
    </ul>\n</body>\n</html>\n```\n\nYou will receive the following result:\n\nBooks\
    \ Info:\n- Book Name: Padam History\n- Book Name: Great Mistry\n\n## JSTL XML\
    \ <x:choose>, <x:when>, <x:otherwise> Tags\n\nThe <x:choose> tag works like a\
    \ Java switch statement. With this, you can choose between a number of alternatives.\
    \ Where the switch statement has the case statements, and the <x:choose> tag has\
    \ the <x:when> tags. Just as the switch statement has the default clause to specify\
    \ a default action, <x:choose> tag has the <x:otherwise> tag as a default clause.\n\
    \n## Attribute\n\n- The <x:choose> tag does not have any attribute.\n- The <x:when>\
    \ tag has one attributes which is listed below.\n- The <x:otherwise> tag does\
    \ not have any attribute.\n\nThe <x:when> tag has the following attributes:\n\n\
    | Attribute | Description | Required | Default |\n|---|---|---|---|\n| select\
    \ | Condition to evaluate | Yes | None |\n\n## Example\n\n```jsp\n<%@ taglib prefix=\"\
    c\" uri=\"http://java.sun.com/jsp/jstl/core\" %>\n<%@ taglib prefix=\"x\" uri=\"\
    http://java.sun.com/jsp/jstl/xml\" %>\n\n<html>\n<head>\n<title>JSTL x:choose\
    \ Tags</title>\n</head>\n<body>\n<h3>Books Info:</h3>\n\n<c:set var=\"xmltext\"\
    >\n<books>\n<book>\n<name>Padam History</name>\n<author>ZARA</author>\n<price>100</price>\n\
    </book>\n<book>\n<name>Great Mistry</name>\n<author>NUHA</author>\n<price>2000</price>\n\
    </book>\n</books>\n</c:set>\n```\n\n```jsp\n<x:parse xml=\"${xmltext}\" var=\"\
    output\"/>\n<x:choose>\n  <x:when select=\"$output/book[1]/price < 100\">\n  \
    \  The first book is cheap.\n  </x:when>\n  <x:otherwise>\n    The first book\
    \ is expensive.\n  </x:otherwise>\n</x:choose>\n</body>\n</html>\n```\n\n![](img/5626302a090fb89f52cde01d391f8bdc_202_0.png)\n"
