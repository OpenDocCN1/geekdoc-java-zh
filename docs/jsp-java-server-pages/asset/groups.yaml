    在  上执行以下命令可以启动 Tomcat：


    ```

    %CATALINA_HOME%\startup.bat


    or C:\apache-tomcat-5.5.29\bin\startup.bat

    ```


    在 Unix（Solaris, Linux 等）机器上执行以下命令可以启动 Tomcat：


    ```

    $CATALINA_HOME/bin/startup.sh


    or/usr/local/apache-tomcat-5.5.29/bin/startup.sh

    ```


    成功启动后，访问 http://localhost:8080 即可使用 Tomcat 自带的默认 Web 应用程序。


    执行后，你将收到以下输出：


    ![](img/5626302a090fb89f52cde01d391f8bdc_15_0.png)


    关于配置和运行 Tomcat 的更多信息可以在此处包含的文档中以及 Tomcat 网站上找到：http://tomcat.apache.org


    在 Windows 机器上执行以下命令可以停止 Tomcat：


    | %CATALINA_HOME%\bin\shutdown |

    | or |

    | C:\apache-tomcat-5.5.29\bin\shutdown |


    在 Unix（Solaris, Linux 等）机器上执行以下命令可以停止 Tomcat：


    | $CATALINA_HOME/bin/shutdown.sh |

    | or |

    | /usr/local/apache-tomcat-5.5.29/bin/shutdown.sh |


    # 设置 CLASSPATH


    由于 servlet（servlets）不是 Java 平台标准版的一部分，你必须向编译器标识 servlet 类。


    如果你运行的是 Windows，你需要在你的 `C:\autoexec.bat` 文件中放入以下行。


    ```

    set CATALINA=C:\apache-tomcat-5.5.29

    set CLASPATH=%CATALINA%\common\lib\jsp-api.jar;%CLASSP%

    ```


    或者，在 Windows NT/200/XP 上，你也可以右键点击“我的电脑”，选择“属性”，然后是“高级”，然后是“环境变量”。然后更新 CLASSPATH
    值并点击确定 按钮。


    在 Unix（Solaris, Linux 等）上，如果你使用 C shell，你需要将以下行放入你的 .cshrc 文件中。


    ```

    setenv CATALINA=/usr/local/apache-tomcat-5.5.29

    setenv CLASSPATH=$CATALINA/common/lib/jsp-api.jar:$CLASSPATH

    ```


    **注意：** 假设你的开发目录是 `C:\JSPDev` (Windows) 或 `/usr/JSPDev` (Unix)，那么你还需要 CLASSPATH
    中添加这些目录。


    # 3. JSP – 架构


    Web 服务器需要一个 JSP 引擎，即一个处理 JSP 页面的容器。JSP 容器负责拦截对 JSP 页面的请求。本教程使用了带有内置 JSP 容器的 Apache
    来支持 JSP 面的开发。


    JSP 容器与 Web 服务器协作，为 JSP 提供所需的运行时环境和其他服务。它知道如何理解 JSP 组成部分的特殊元素。


    下面的图显示了 JSP 容器和 JSP 文件在 Web 应用程序中的位置。


    ![](img/5626302a090fb89f52cde01d391f8bdc_17_0.png)


    # JSP 处理


    以下步骤解释了 Web 服务器如何使用 JSP 创建网页：


    - 作为一个普通页面，你的浏览器向 Web 服务器发送 HTTP 请求。

    - Web 服务器识别出该 HTTP 请求是针对 JSP 页面的，并将其转发给 JSP 引擎。这是通过使用 URL 或 JSP 页面以 .jsp 而不是 .html
    结尾来实现的。

    - JSP 引擎从磁盘加载 JSP 并将其转换为 servlet。这种转换非常简单，所有的文本都被转换为 `println()` 语句，所有的 JSP 元素都被转换为
    Java 代码。这些代码实现了页面相应的动态行为。

    - JSP 引擎将 servlet 编译成可执行的类，并将原始请求转发给 servlet 引擎。

    - Web 服务器的一部分调用 servlet 引擎加载 Servlet 类并执行它。在执行期间，servlet 生成 HTML 格式的输出。该输出通过 servlet
    引擎在 HTTP 响应内部进一步传递给 Web 服务器。


    # JSP


    - Web 服务器以静态 HTML 内容的形式向你的浏览器发送 HTTP 响应。

    - 最后，Web 浏览器处理 HTTP 响应内部动态生成的 HTML 页面，就像处理静态页面一样。


    上述所有步骤都可以在下面的图中看到：


    ![](img/5626302a090fb89f52cde01d391f8bdc_18_0.png)


    通常，JSP 引擎会检查是否已经存在针对 JSP 文件的 servlet，以及 JSP 文件的修改日期是否匹配。


    - * Web 服务器以静态 HTML 内容的形式向你的浏览器发送 HTTP 响应。

    * 最后，Web 浏览器处理 HTTP 响应内部动态生成的 HTML 页面，就像处理静态页面一样。


