    \ | Zaid | Khan | 1980-10-10 |\n| 103 | Sumit | Mittal | 1971-05-08 |\n\n# JSTL\
    \ SQL <sql:transaction> 标签\n\n`<sql:transaction>` 标签用于将 `<sql:query>` 和 `<sql:update>`\
    \ 标签分组为事务。你可以在 `<sql:transaction>` 标签内部放置任意数量 `<sql:query>` 和 `<sql:update>` 标签作为语句，以创建一个事务。\n\
    \n它确保由嵌套操作执行的数据库修改要么提交，要么在任何嵌套操作抛出异常时回滚。\n\n# 属性\n\n`<sql:transaction>` 标签具有以下属性：\n\
    \n| 属性 | 说明 | 是否必须 | 默认值 |\n|---|---|---|---|\n| dataSource | 要使用的数据库连接（覆盖默认值）\
