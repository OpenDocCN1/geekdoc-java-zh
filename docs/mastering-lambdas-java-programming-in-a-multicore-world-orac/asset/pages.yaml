  md: '# 6.5 Stateful and Stateless Operations


    Intuitively, it is clear that some intermediate operations lend themselves more
    easily to parallelization than others. For example, the application of map to
    a stream can obviously be implemented by an element-by-element evaluation of map''s
    behavioral parameter applied to the stream elements. By contrast, sorted of the
    elements of a stream cannot complete until it has accumulated all the values that
    the stream will yield before exhaustion. Because map can process each stream element
    without reference to any other, it is called stateless. Other stateless operations
    include filter, flatMap, and the variants of map and flatMap that produce streams.
    Pipelines containing exclusively stateless operations are processed in a single
    pass, whether sequential or parallel, with little or no data buffering.


    Operations like sorted, which do need to retain information about already-processed
    values, are called stateful. Stateful operations store some, or even-multiple
    passes are required—all of the stream data in memory. Other operations include
    distinct and the truncation operations skip and limit. The library implementations
    use various strategies to avoid in-memory buffering when possible; these make
    it very difficult to predict how a stateful operation will influence parallel
    speedup. For example, a naive benchmark measuring performance of sorted on a stream
    can report speedup of 2.5 on four cores (http://git.io/6kdkW) where the conditions
    happen to be right for optimization. On the other hand, the Oracle team experienced
    frustration with the unexpected and intuitive difficulty of efficiently limit,
    which remains an operation to use with caution in a parallel stream. Fortunately,
    further work on the stream library, implementing further optimizations and changing
    existing ones, will continually improve the situation for library users.


