    lines representing something, a way of delivering a sequence of values to an operation.
    This is different from any kind of collection, because at a given moment the values
    to be delivered by a connector may not have all been generated. These value sequences
    are called streams. Streams differ from collections in they provide an (optionally)
    ordered sequence of values without providing any storage for those values; they
    are “data in motion,” a means for expressing bulk data operations. If the idea
    of streams is new to you, it may help to imagine a kind of iterator over which
    the only operation is next, besides returning the next value, it can signal that
    there are no more values to get. In the Java 8 collections are represented by
    interfaces—Stream for reference values, IntStream, LongStream, and DoubleStream
    for primitives—in the package java.util.stream.


    In this view, the operations represented by the boxes in Figure 1-1 are operations
    on streams. The boxes in this figure represent two applications of an operation
    called map; it transforms each stream element using a systematic rule. Looking
    at map alone, we might think that we were dealing with operations on individual
    stream elements. But we will see other stream operations that can reorder, drop,
    or insert values; each of these operations can be described as taking a stream
    and transforming it in some way. Each rectangular box represents an intermediate
    operation, one that is not only defined on a stream, but also returns a stream
    as its output. For example, assuming a a stream forms the input to the first operation,
    the transformations made by the intermediate operations of Figure 1-1 can be represented
    in code:


    ```

    StreamPoint points = intStream.map(i -> new Point(i % 3, i / 3));nDoubleStream
    distances = points.mapToDouble(p -> p.distance(0, 0));

    ```


    The circle at the end of the pipeline represents the terminal operation max. Terminal
    operations consume a stream, optionally returning a single value, or if the stream
    is empty—nothing, represented by an Optional or one of its specializations (p.
    65):


    ```

    OptionalDouble maxDistance = distances.max();

    ```'
