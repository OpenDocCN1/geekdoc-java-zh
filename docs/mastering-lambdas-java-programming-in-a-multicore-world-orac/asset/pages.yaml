  md: "# 1.4 Composing Behaviors\n\nEarlier in this chapter we saw how functionally\
    \ similar lambda expressions are to anonymous inner classes. Writing them so frequently\
    \ leads to different ways of thinking about them. Lambda expressions look like\
    \ functions, so it's so natural to ask whether we can make them behave like functions.\
    \ That change of perspective will encourage us to think about working with behaviors\
    \ rather than objects, and that in turn will lead to the decomposition of some\
    \ very different programming and library APIs.\n\nFor example, a core operation\
    \ on functions is composition: combining two functions to make a third, whose\
    \ effect is the same as applying its two components in succession. It is not an\
    \ idea that arises naturally in connection with anonymous inner classes, but in\
    \ a generalized form it corresponds very well to the construction of traditional\
    \ object-oriented programs. And just as object-oriented programs are broken down\
    \ by decomposition, the reverse of composition will work for functions too.\n\n\
    Suppose, for example, that we want to sort a list of Point instances in order\
    \ of their x coordinate. The standard Java idiom for a \"custom\" sort is to create\
    \ a Comparator:\n\n```\nComparator<Point> byX = new Comparator<Point>() {\n  \
    \  public int compare(Point p1, Point p2) {\n        return Double.compare(p1.getX(),\
    \ p2.getX());\n    }\n};\n```\n\n```\nComparator<Point> byX = (p1, p2) -> Double.compare(p1.getX(),\
    \ p2.getX());\n```\n\nBut that doesn't help with another very significant problem:\
    \ Comparator is monolithic. If we wanted to use a comparator that on y instead\
    \ of x coordinates, we would have to copy the entire declaration, substituting\
    \ getY for every. Good programming practice should lead us to look for a better\
    \ solution, and a moment's reflection shows that Comparator is actually carrying\
    \ out two functions—extracting sort from its arguments and comparing these keys.\
    \ We should be able to improve the code of by building a Comparator function parameterized\
    \ over these two components. We'll now evolve the code to do that. The intermediate\
    \ stages might seem awkward and verbose, but persist: the conclusion will be worthwhile.\n\
    \n> Two ways of comparing and sorting objects are standard in the Java platform:\
    \ a class can have a natural order; in this case, it implements the interface\
    \ Comparable and exposes a compareTo method that an object can use to compare\
    \ itself with another. Or a Comparator can be created for the purpose, as in this\
    \ case."
