  md: "# 6 Mastering Lambdas\n\nOf course, this toy code is absurdly specialized;\
    \ we aren't really going to write a new interface for every element type we need\
    \ to work with. Fortunately, we don't need to; there is nothing special about\
    \ the names PointAction and doForEach; if we simply replace them consistently\
    \ with other names, nothing changes. In the Java 8 collections they are called\
    \ Consumer and accept. So our PointAction interface becomes:\n\n```\npublic interface\
    \ Consumer<T> {\n    void accept(T t);\n}\n```\n\nParameterizing the type of the\
    \ interface interfaces allows us to dispense with the specialized ArrayList subclass\
    \ and instead add the method forEach directly to the class itself, as by inheritance\
    \ in Java 8. This method takes a java.util.function.Consumer, which will receive\
    \ and process each element of the collection.\n\n```\npublic class ArrayList<E>\
    \ {\n    ...\n    public void forEach(Consumer<E> c) {\n        for (E e : this)\
    \ {\n            c.accept(e);\n        }\n    }\n}\n```\n\nApplying these changes\
    \ to the client code, we get\n\n```\nclass TranslateByOne implements Consumer<Point>\
    \ {\n    public void accept(Point p) {\n        p.translate(1, 1);\n    }\n}\n\
    ```\n\n...pointList.forEach(new TranslateByOne());\n\nYou may think that this\
    \ code is still pretty clumsy. But notice that the clumsiness is now concentrated\
    \ in the representation of each command by an instance of a class. In many cases,\
    \ it is overkill. In the present case, for example, all that we really needs is\
    \ the behavior of the single method accept of the object that has been supplied\
    \ to it. State and all the other apparatus that make up the object are included\
    \ only because method arguments in Java, if not primitives, have to be object\
    \ references. But we have always needed to specify this apparatus—until now."
