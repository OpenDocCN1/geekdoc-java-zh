    # 5.5 Conclusion


    This chapter had connected purposes: to explore the library facilities for creating
    streams, to explain the mechanism by which stream creation works, and to show
    how and why you would write your own implementation of it. We saw that stream-bearing
    methods have been added to a variety of platform classes, allowing streams to
    fulfill their role of conveying any kind of data for processing through intermediate
    operations and into a terminal operation. Processing streams from any of these
    methods, you gain the advantages in expressiveness and readability of parallel-ready
    code; whether you can effectively extract parallelism depends, as we have seen,
    how effectively the stream source can split its data. Splittability is only part
    of the story, however; in Chapter 6 we will see how it combines with other factors,
    such as data size and pipeline workload, to determine the overall speedup that
    can be obtained by parallelization.


    The main example of the chapter showed off some of the strengths of the Stream
    API: the solutions for the earlier options were straightforward, and specifying
    the problem to simulate the different options required only small corresponding
    changes in the code. In the last part of the example, we saw how cooperation with
    Java NIO enables the Stream API to process input from large files, as we will
    see in $6.7, a very high degree of parallel speedup.'
