    # 6.8 Collector Performance


    The behavior of terminal operations, like that of stream sources, is more complex
    for parallel than sequential streams. In the sequential case, collection consists
    only of calling the collector''s accumulator function, which, if it consumes values
    from the stream quickly enough, can avoid being a bottleneck for the entire process.
    For parallel streams, the framework treats collectors differently according to
    which they declare themselves CONCURRENT, by means of the characteristics by which
    collectors report their properties. A concurrent collector guarantees that its
    accumulator is threadsafe, so the framework does not need to take responsibility
    for avoiding concurrent accumulator as it calls for non-threadsafe structures.
    In principle, avoiding the framework overhead of managing thread confinement should
    lead to better parallel performance. This can be realized in practice, as we shall
    see, by choosing appropriate data sets and configuration parameters.


    Collectors report only two other characteristics besides CONCURRENT: a collector
    can have IDENTITY_FINISH, which tells the framework that it need to make provision
    for a finisher function, and UNORDERED, which tells the framework that there is
    no need to maintain an encounter order on the stream, as the collector will discard
    it anyway.'
