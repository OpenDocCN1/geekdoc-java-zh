  md: "# 166 Mastering Lambdas\n\nplace whether the default keyword should be mandatory,\
    \ given that it is not needed to make the syntax unambiguous—an interface method\
    \ declaration with a block body can only be a default method. One advantage of\
    \ making it mandatory is that it immediately prompts a reader's understanding,\
    \ in the same way as the modifier abstract (also not strictly necessary) for abstract\
    \ methods and classes.\n\nThe main syntactic difference between default methods\
    \ and concrete instance methods is in the modifiers that they are allowed—or,\
    \ in the case of default, required—to have. Obviously, default methods may not\
    \ be declared or static, since these distinguish the other kinds of interface\
    \ methods (we will explore interface methods in $7.5). They may not be declared\
    \ final, because they must always be overridden by instance methods, as we will\
    \ see in the next section. All like interface methods, they may be declared public\
    \ but are implicitly public anyway; no other accessibility is possible.\n\nThe\
    \ keyword super has its usual meaning; it refers to the current object, referenced\
    \ using the type of the interface. For example, the method Iterator.forEachRemaining\
    \ has the following implementation (slightly simplified for presentation):\n\n\
    ```\ndefault void forEach(Consumer<T> action) {\n  for (T t : this) {\n    action.accept(t);\n\
    \  }\n}\n```\n\nThe keyword super is also allowed, but only when it is qualified\
    \ by the name of a superinterface, as the next section explains.\n\nInterfaces\
    \ are not allowed to declare a default method with the same signature as any of\
