  md: '# 44 Mastering Lambdas


    n Chapter 1 we saw two main themes in the motivations for introducing lambdas
    to Java. These two themes—better code and easier parallelism—come together in
    the introduction of the streams for processing collections. Although lambda expressions
    are (in practice) essential for programming with streams, they are not enough:
    use streams effectively, we need some ideas specific to the programming model
    that enable them. In this chapter, we explore the ideas underlying streams, with
    relatively straightforward examples of streams that should help to develop a basic
    intuition about how they work. In later chapters, we will go further, exploring
    some theoretical practices, seeing how stream can simplify common collection processing
    tasks, and finally investigating the performance of sequential and parallel streams
    in different situations.


    The individual stream operations that we will learn are not very powerful on their
    own. The power of the Stream API lies in the possibilities that are created by
    composing these operations together. In this, design draws on long historical
    precedent in computing. One of its closest ancestors is the so-called “Unix philosophy,”
    of which the authors of The Unix Programming Environment (Kernighan and Pike,
    1984) wrote


    > At its heart is the idea that the power of a system comes more from the relationships
    among programs than the programs themselves. Many UNIX programs do quite trivial
    things in isolation, but combined with other programs, become general and useful
    tools.


    If you are familiar with the realization that philosophy in the Unix pipeline,
    you will see that reflected clearly in the intermediate operations of streams.
    But, broadly, the principle of composition was central throughout the design of
    the Java 8 changes: in $1.4 we saw how lambda expressions enable the design of
    finer-grained, more comparable operations, and later we will see its influence
    in the design of stream collectors.


    In following the trail that takes us through the technical detail of streams,
    we should be sure not to lose sight of their fundamental justification: the more
    expressive formulation of common aggregate operations. The success of the stream
    mechanism will be assessed by how far it achieves the goal of clearer expression
    of common business logic.


    # 3.1 Stream Fundamentals


    Streams were introduced in $1.2 as optionally ordered value sequences. In operational
