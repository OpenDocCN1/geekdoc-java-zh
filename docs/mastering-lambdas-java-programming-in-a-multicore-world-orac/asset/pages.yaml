    # Search Operations


    The Stream methods that can be classified as “search” operations fall into two
    groups: the first group comprises matching operations, which test whether any
    or all stream elements satisfy a given Predicate:


    | Stream<T> | |

    |--- |--- |

    | anyMatch(Predicate<T>) | boolean |

    | allMatch(Predicate<T>) | boolean |

    | noneMatch(Predicate<T>) | boolean |


    The names are indicative: anyMatch returns true on finding an element that satisfies
    the predicate; allMatch returns false on finding an element that does not satisfy
    it, and noneMatch is analogous, returning false on finding any element that satisfies
    it, and returning true otherwise.


    For example, planning the organization of my bookshelves is complicated by the
    fact that these built-in shelves are not all of the same height. If I need to
    know whether my history books can be placed on the top shelf, whose headroom is
    19 cm, I can write:


    ```

