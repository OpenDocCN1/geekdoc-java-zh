    # 7.5.1 Using Static Methods


    Again, it is too soon to know what idioms in API design will emerge to make use
    of static interface methods. In Java 8, the platform classes expose as factory
    methods—as with Stream.of, Collector.of, and Comparator.comparing—and ways of
    locating functionality that are often an improvement over the traditional use
    of utility classes.


    Utility classes can present major difficulties in locating functionality. The
    most extreme example in the platform library, java.util.Collections contains more
    than 60 static methods, of which the majority are not associated with collections
    in general but with one of Set, List, Queue, or Map (the last of which is not
    even a subtype of Collection). A newcomer to the Java Framework cannot deduce
    in any systematic way where to find a factory method for producing, say a Map.
    Such arbitrary allocation of function is a major obstacle to learning an API.
    Now that interfaces can expose methods like Comparator.comparing—and Stream.of,
    they can be where a developer would naturally expect to find them. This improvement
    is not restricted to new methods; for example, Java 8 introduces a factory method
    Comparator.reverseOrder, which is implemented simply by delegation to the existing
    (but poorly located) method Collections.reverseOrder.


    That said, it is unlikely that utility classes Collections will altogether appear
    in new APIs. Consider the interface Collector; there are more than 40 factory
    methods for this interface in the Stream API. Only two have been declared as static
    methods of the interface itself, namely the general-purpose overloads of Collector.of
    of that were discussed in $4.3. The forty-odd predefined factory methods, described
    in $4.1, deserve and get a class—Collectors—of their own; putting all into the
    Collector interface would overwhelm their core function. This example leads us
    to expect that a balance of usage between static interface methods and utility
    classes will emerge over time.


    # 7.6 Conclusion


    It is no easy to change a programming language that has been in widespread use
    for nearly two decades. When the feature to be changed is as central to the language
    as interfaces are to Java, the problem is even more difficult. Despite the problems
    described in this chapter, the addition of behavior to Java interfaces has, overall,
    caused remarkably few difficulties.


    This is partly because the features have been strictly tailored to the purpose
    of enabling API evolution. Some of the controversy around the introduction of
    default'
