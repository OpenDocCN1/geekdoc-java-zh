    # 2.9 Conclusion


    We''ve seen all of the syntax changes needed to introduce lambdas; the other major
    change for Java 8, the introduction of default methods, supports API evolution
    by allowing interfaces to define behavior. Default methods will be covered in
    Chapter 7. Some of the details in this chapter may have seemed intricate, but
    overall, the ideas are quite simple, much simpler than seemed achievable at many
    points in the long debate that led to their final form.


