    the method `Collection.parallelStream` is specified to return a "possibly parallel"
    stream).


    If order is significant for a stream source, the elements that the spliterator
    covers after it has executed `trySplit` must succeed those covered by the spliterator
    that it returned.


    **tryAdvance** This method combines the functions of the `Iterator` methods next
    and hasNext. If no elements remain, `tryAdvance` returns false; otherwise, it
    returns true after calling the accept method of the supplied `Consumer` with the
    next element as the argument. This is the heart of the two major improvements
    that spliterators offer over iterators: fewer method calls are needed for each
    element, resulting in performance improvements, and there is now no risk of the
    race conditions that can arise as a result of a collection being mutated between
    a call of `hasNext` and a call of next.'
