    # 4.3.3 Rules for Collectors


    When a collector is executed in the way pictured in Figure 4-12, a complex interplay
    takes place between the framework and the collector-supplied components. For this
    to work correctly, each side must be able to rely on the obeying certain rules.
    This section lays rules down: what a collector can expect from the framework,
    and the constraints it must itself respect.


    The framework guarantees to respect the following conditions:


    +   - New values will appear only as the second argument to the accumulator; all
    other values will be results returned from supplier, accumulator, or combiner.

    - Results from the supplier, accumulator, and combiner may be returned to the
    caller of `collect`; otherwise, they will only ever be used as arguments to the
    accumulator, combiner, or finisher.

    - Values passed to the combiner or finisher and not returned are never used again;
    their contents have been processed and should not be reused.


    The collector must respect the following constraints:


    +   - Unless it has the characteristic CONCURRENT (see §4.2.1), it must ensure
    that any result returned from the supplier, accumulator, or combiner functions
    are thread-confined (i.e., it must not have made available to any other thread).
    This allows the collector framework to parallelize processing without being concerned
    about interference from external threads.

    - If it has the characteristic CONCURRENT, the accumulator must be threadsafe
    using the same concurrently modifiable result container, as the framework may
    call it concurrently from multiple threads. Concurrent collectors cannot be used
    when ordering is significant.

    - The identity constraint: the empty result container should leave other elements
    unchanged when combined with them. More formally, for any value of s:


    ```

    s == combiner.apply(s, supplier.get())

    s == combiner.apply(supplier.get(), s)

    ```'
