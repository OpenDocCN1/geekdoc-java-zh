    # 2.7.1 What Exactly Is a Function Type?


    In the rest of this chapter, the idea of a function type will often be important
    to understanding how type checking works, so it is worth pinning it down precisely.
    In fact, the simple definition in $2.4 is sufficient in most cases: the function
    type of a functional interface is the type of its single abstract method—that
    is, its type parameters together with its parameter, return, and thrown types.


    However, this simple definition can be complicated by two factors: all interfaces
    declare (implicitly, if not explicitly) abstract methods corresponding to the
    public methods in Object, and the single abstract method of a functional interface
    is in addition to these. Most of the Object methods are declared implicitly, but
    not always; for example, Comparator explicitly declares a method equals that matches
    the equals of Object. In such cases the explicit declaration makes no difference;
    Comparator still meets the definition of a functional interface.


    The second complicating factor is that two interfaces have methods that are not
    identical but related by erasure. For example, the methods of the two interfaces


    ```

    interface Foo { void bar(List<String> arg); }

    interface Foo2 { void bar(List arg); }

    ```


    are to be override-equivalent. If the superinterfaces of an interface contain
    override-equivalent methods, the function type of that interface is the type of
    a single method that can legally override all inherited abstract methods. In this
    example, if


    then the function type of Foo is the method type corresponding to


    ```

    public void bar(List arg);

    ```


    These complications do not have general impact on the appealingly simple idea
    of a single abstract method, but it is useful to bear them in mind when encountering
    corner cases like Comparator.


