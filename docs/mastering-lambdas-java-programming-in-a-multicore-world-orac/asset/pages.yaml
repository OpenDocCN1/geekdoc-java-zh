  md: '# Mastering Lambdas


    For a client, the interface still has the same meaning: it defines a type and
    lists the declarations of the methods that a client can call on that type. For
    an implementation, the main element of its relationship with the interface is
    also unchanged: it is still required to override the interface-implementation
    relationship, however: the implementation can now choose to override default method
    declarations—because these are virtual and replace or modify their behaviors,
    just as in traditional Java instance method overriding.


    Now an interface can be extended to allow client code new methods without requiring
    any immediate change in existing implementations. This removes a serious block
    on API evolution, ever since JDK1.0. It is worth asking why this block was allowed
    in place for so long.


    Aside from the considerable difficulties in making a change of this size, attitudes
    to multiple inheritance had to change. Aversion to multiple inheritance was a
    strong element in the original design of Java because of the difficulties that
    it brought to other languages, most prominently to C++ in the form of the “diamond
    problem” (p. 169). Even so, multiple inheritance of interfaces has always been
    acceptable because interfaces were essentially type definitions, and multiple
    inheritance of types did not involve the problems. Introducing default methods
    extends the role of interfaces to provide behavior, so multiple inheritance of
    behavior would now have to be allowed. The Java 8 designers were able to devise
    rules that make the problems with behavior inheritance manageable; the classic
    problems of multiple inheritance are associated with inheritance of state, which
    Java does not and never support.


    # 7.1 Using Default Methods


    After a change as big as this, it takes time for the best new idioms to emerge.
    Some cases can be seen in the Java 8 platform classes already, here are four of
    them:


    +   Methods intended to be overridden The previous section presented methods like
    Collection.stream as the central use case for default methods. The implementation
    of stream is delegated to another default method, spliterator (defined in Iterable,
    the superinterface of Collection). The purpose of this method is to return a spliterator
    that takes advantage of the structure of the collection to partition its contents
    for processing by different threads, like the MappedByteBuffer spliterator of
    $5.4. Of course, the default implementation itself cannot fulfill its intention;
    it is suboptimal for most classes because it has no knowledge of the structure
    of the object it is splitting. Virtual method dispatch allows Collection implementations
    to override'
