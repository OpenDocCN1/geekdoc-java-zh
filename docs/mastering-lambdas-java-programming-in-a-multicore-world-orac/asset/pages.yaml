  md: "# 16 Mastering Lambdas\n\nTo start, let's turn the two concrete component functions\
    \ that we have into lambda form. We know the type of the functional interface\
    \ for the key extractor function—Comparator—but we also need the type of the functional\
    \ interface corresponding to the Comparator `p -> p.get()`. Looking in the package\
    \ devoted to the declaration of functional interfaces, java.util.function, we\
    \ find the interface Function:\n\n```\npublic interface Function<T,R> {\n    public\
    \ R apply(T t);\n}\n```\n\nSo we can now derive the lambda expressions for both\
    \ extraction and key comparison:\n\n```\nFunction<Point,Double> keyExtractor =\
    \ p -> p.getX();\nComparator<Double> keyComparator = (d1, d2) -> Double.compare(d1,\
    \ d2);\n```\n\nAnd our version of Comparator<Point> can be reassembled from two\
    \ smaller functions:\n\n```\nComparator<Point> compareBy = (p1, p2) -> keyComparator.compare(keyExtractor.apply(p1),\
    \ keyExtractor.apply(p2));\n```\n\nThis matches the form of ① but represents an\
    \ important improvement (one that would be much more significant in a larger example):\
    \ you could plug in any keyComparator or keyExtractor that had previously been\
    \ defined. After all, the whole purpose of seeking to parameterize the larger\
    \ function on its smaller components.\n\nBut recalculating the Comparator in this\
    \ way has improved its structure, we have lost the conciseness of ②. We can recover\
    \ that in the special but very common case where keyComparator expresses the natural\
    \ ordering on the extracted keys. Then it can be rewritten as:\n\n```\nComparator<Point>\
    \ compareByX = (p1, p2) -> keyExtractor.apply(p1).compareTo(keyExtractor.apply(p2));\n\
    ```\n\nAnd, noticing the importance of this special case, the platform library\
