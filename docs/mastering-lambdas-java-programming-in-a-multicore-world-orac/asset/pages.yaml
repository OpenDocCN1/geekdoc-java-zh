    **trySplit** As we have seen, this creates a new `Spliterator` and transforms
    some—ideally, half—of its elements to it. Splits that do not achieve this ideal
    may still be effective; for example, splitting an approximately balanced binary
    tree can still lead to useful parallelism. On the other hand we have `BufferedReader`,
