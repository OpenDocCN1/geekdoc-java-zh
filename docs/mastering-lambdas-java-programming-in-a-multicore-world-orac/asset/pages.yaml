  md: '# 6.1.3 Experimental Method


    Finally, we apply two of the standard safeguards of experimental science to the
    results of our experiments.


    **Statistics** Given the number of factors that we now know affect microbenchmark-ments,
    we can hardly expect that the same experiment, repeated several times, will produce
    exactly the same result; the influence of external factors will vary from one
    set of observations to another. We can calculate a point estimate (such as the
    mean) for the most probable value, but will have little meaning if external factors
    dominate the experiments. If we can assume that the effects of external factors
    are varying randomly, running the same experiment a number of times can increase
    our confidence in the result. This can be quantified in a **confidence interval
    (CI)**—a range of values within which we can state with a degree of certainty
    (conventionally 95%) that the “true” value lies—that is, the value that we might
    get from many experiments. The larger the experiment, the narrower the confidence
    intervals that we can obtain.


    Confidence intervals give us a useful indicator of experimental significance:
    if CIs from two different situations do not overlap, it is an indication that
    those situations do really give different results, assuming that the other factors
    are varying in a way that would not bias one set against another. In practice,
    for the experiments of this chapter, the variation between conditions is small
    compared to the differences, and the number of trials is large enough that the
    confidence intervals are not too small to appear on the plots.


    **Open peer review** Like all scientific experiments, performance measurements
    are subject to flaws and bias. A partial safeguard against sources of error is
    to enable open peer review of measurement experiments. This means publishing not
    only the summarized results, but also enough detail about the experimental conditions
    to enable others to reproduce and check them. This information includes the hardware,
    operating system, and JVM environments, as well as statistical information about
    the results. What follows is an example: a benchmark and its resulting data used
    for Figure 6-1. Instead of tediously reproducing this for each experiment in this
    chapter, a URL refers to the location on the book website of the full setup; as
    the experiments are easy to reproduce, experimental results are not usually provided.


