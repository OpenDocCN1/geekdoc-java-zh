  md: '# 2.5 Using Lambda Expressions


    A lambda expression can be written wherever a reference to a functional interface
    instance would be valid, provided that the context of the occurrence provides
    an appropriate target type—that is provided, the context unambiguously requires
    a functional interface type. For example, the target type of the declaration


    ```

    IntPredicate ip = i -> i > 0;

    ```


    is IntPredicate, a functional interface whose function type is compatible with
    the lambda i -> i > 0. By contrast, the declaration


    ```

    Object o = i -> i > 0;    // invalid

    ```


    does not compile, because the target type required by the context is not that
    of a functional interface, does not give the compiler the information that it
    needs to compile the lambda.


    Six kinds of contexts can provide appropriate target types:


    +   * Method or constructor arguments, for which the target type is the type of
    the appropriate parameter. We have already seen straightforward examples throughout
    Chapter 1.

    * Variable declarations and assignments, for which the target type is the type
    being assigned to:


    ```

    Comparator<String> cc =

    (String s1, String s2) -> s1.compareToIgnoreCase(s2);

    ```


    Array initializers are similar except that the target type is the type of the
    array component:


    ```

    IntBinaryOperator[] calculatorOps = new IntBinaryOperator[] {

    (x,y) -> x + y, (x,y) -> x - y, (x,y) -> x * y, (x,y) -> x / y

