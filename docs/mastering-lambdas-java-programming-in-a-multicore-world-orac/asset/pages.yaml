  md: "# 160 Mastering Lambdas\n\ndefault methods allow interfaces to define behavior.\
    \ Why did we need this change, and what are its consequences? The short answer\
    \ to the first question is: to support API evolution. The need for this has been\
    \ felt for a long time, but becoming pressing with the requirement for stream\
    \ support in collections. (The longer answer is that, once introduced, default\
    \ methods have other uses as well, as we see.) The Java Collections Framework–like\
    \ its extensions, for example Google Guava–is strongly interface-based: that is,\
    \ the capabilities of a collection (with some exceptions) defined by the Javadoc\
    \ contract of its interface. For the existing collections library to be enhanced\
    \ with stream support, interface methods like Collection Collections Framework–would\
    \ have presented entirely unattractive problems of compatibility and code maintenance.\n\
    \nSo it was decided to change the situation in adding methods to interfaces created\
    \ unmanageable compatibility problems. Reviewing these problems will help us understand\
    \ what the designers made in implementing that decision. Consider, for example,\
    \ adding an abstract method stream to Collection. (But note that the problem described\
    \ here applies to all published interfaces, not just those in the platform library.)\
    \ Prior to Java 8, Collection declared only abstract methods:\n\n```\npublic interface\
    \ Collection<E> {\n    int size();\n    boolean isEmpty();\n    // 11 more abstract\
    \ method declarations\n}\n```\n\nand a class implemented the interface only if\
    \ it overrode every abstract method declaration with a concrete method:\n\n```\n\
    class CustomCollection implements Collection<E> {\n    public int size() { ...\
    \ }\n    public boolean isEmpty() { ... }\n    // 11 more concrete method declarations\n\
    }\n```\n\nNow consider the problem of making collections into stream sources.\
    \ The interface Collection had to be extended with a method stream; without default\
    \ methods, that could be done only by adding an abstract method declaration:\n\
    \n```\npublic interface Collection<E> {\n    int size();\n    boolean isEmpty();\n\
    \    // 11 more abstract methods\n    Stream<E> stream(); // abstract method -\
    \ not added in reality\n}\n```"
