    # # 6.1 Microbenchmarking


    Our aim is to discover the execution cost of a particular code fragment. But the
    argument in this chapter so far has been that a measurement of such cost is meaningful
    only in a working system under realistic load. Profiling or metering a production
    system is not practical; the alternative, of simulating the production system
    on a load-testing platform, is more feasible but involves the difficulty of setting
    up an environment that reproduces the production system in all aspects: hardware
    and operating system configuration, demand resources by other processes, the network
    and disk environments, and of course typical and extreme loads.


    A more practical alternative is microbenchmarking, which compares two different
    code fragments operating in an isolated (unrealistic) setting. Each of these results
    will be meaningful in absolute terms, but the comparison between them can be meaningful—provided
    all aspects are controlled. The idea of a controlled experiment is simple in principle.
    If all the factors listed earlier (the hardware and software environments, the
    system load, and so on) are held constant and only the code being compared is
    allowed to vary, variation in the results must be due to what has been changed.


    # # 6.1.1 Measuring a Dynamic Runtime


    Even when we have succeeded in controlling external influences on program behavior,
    others will await. We suppose our experiments follow this template:


    ```

    long start = System.currentTimeMillis();

    // code being benchmarked

    long end = System.currentTimeMillis();

    System.out.println("My task executed in " + (end - start) + " ms.");

    ```


    The apparent simplicity of this pattern hides some difficulties. Some of these
    relate to the measuring process itself, particularly for short run times:

    System.currentTimeMillis may be much less accurate than its name suggests, because
    it depends on a system clock that on some platforms may be updated only'
