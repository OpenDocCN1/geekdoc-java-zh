  md: "# 142 Mastering Lambdas\n\nGarbage collection This is not a result of optimizations,\
    \ but is a problem inherent in measuring programs that use automatic memory management:\
    \ almost all benchmarks create objects, and some of these will become garbage\
    \ while the benchmark is running. Eventually the garbage collector will be called,\
    \ and its execution will contribute to the timing results. It may be possible\
    \ to reduce this effect by manually triggering garbage collection before a measure,\
    \ but this might be unrealistic: in fact, it may be desirable to include garbage\
    \ collection effects in the benchmark measurements if they will have a significant\
    \ impact on performance in production. A better possibility may be to run the\
    \ programs long enough for these costs to be amortized over many iterations.\n\
    \n# 6.1.2 The Java Microbenchmarking Harness\n\nThese, and many others, must be\
    \ controlled to ensure that we measured what we wanted. Controlling them is such\
    \ a common—and difficult—problem that benchmarking frameworks have become popular.\
    \ These frameworks create test classes specifically designed to avoid the numerous\
    \ pitfalls of microbenchmarking. The test cases are synthesized from the framework\
    \ benchmarking source code that you supply. Examples of benchmarking frameworks\
    \ are Google Caliper (http://code.google.com/p/caliper) and the framework used\
    \ to obtain the results of such chapter, the Java Microbenchmarking Harness (JMH)\
    \ (http://openjdk.java.net/projects/jmh/).\n\nJMH helps to solve the problems\
    \ listed in the previous section. For example, the JMH API includes a static method,\
    \ Blackhole.consumeCPU, which consumes CPU time in proportion to its argument\
    \ without side-effect and without risking DCE and other optimizations. (The absolute\
    \ amount of time used is unimportant, consumeCPU will only ever be used for comparisons\
    \ between microbenchmarks.)\n\nTo create a Benchmark using JMH, you only have\
    \ to annotate a method with @Benchmark. JMH has different modes of use; in the\
    \ throughput mode, it executes each annotated method repeatedly for a time period,\
    \ automatically passing the returned value to the method Blackhole.consume to\
