    When these three changes are applied (http://git.io/wZe_tg), the parallel stream
    program shows a speedup of 2.5 (for four cores) over the sequential version, for
    a data set of a million elements, each requiring 200 JMH tokens to process.


    # 6.9 Conclusion


    The last example emphasizes again that the parallelization mechanism of the Stream
    API is by no means bound to produce performance improvement. To achieve that,
    your application must fall into the focus area for fork/join—CPU-bound processing
    of memory, random-access data—and must satisfy the other conditions for sufficiently
    large data size and per-element processing cost. Fork/join parallelism is no silver
    bullet: the good news, however, that your investment in writing parallel-ready
    code will not be wasted, whatever the outcome of your performance analysis. Your
    code will be better, and when advances in technology change the cost-benefit balance
    of going parallel, it will—as the name suggests—be ready.'
