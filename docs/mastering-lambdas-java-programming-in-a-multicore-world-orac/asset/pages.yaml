    new feature can have with existing ones; a case in point is the complexity, outlined
    in this chapter, that boxing/unboxing and untyped poly expressions have brought
    to method overload resolution. Another is the difficulty of writing lambdas that
    throw checked exceptions. Of the many trade-offs that had to be considered in
    the design and implementation of lambda syntax, the ones involving type inference
    probably be most noticeable, in particular because it sometimes seems less powerful
    than you would expect. That is because the overriding motivation in designing
    the type inference rules was to make them simple and consistent—the same motivation
