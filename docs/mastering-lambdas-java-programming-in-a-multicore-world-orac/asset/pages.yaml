  md: '# 6.4 Ordering


    Of the characteristics listed in the previous section, ordering is the one that
    deserves attention in a performance chapter, because dispensing with ordering
    can remove a big overhead from parallel processing for some pipelines. Moreover,
    as Chapter 1 emphasized, this is the characteristic that we are most likely to
    impose unnecessarily from our long familiarity with iterative processing—think
    of the friend in §1.1.1 who insisted that you put the letters for mailing into
    the letterbox in alphabetical order. So it is very much worthwhile those cases
    in which ordering really matters.


    A stream is said to have an encounter order if the ordering of the elements is
    significantly denoted. For example, take List: when a sequence of operations to
    add elements to a List, the contract specifies how those elements will be positioned
    and guarantee their ordering when returning them, for example by iteration. Now
    considering processing the elements of a List using a stream:


    ```

    joined = stringList.parallelStream()

    .map(String::toUpperCase)

    .collect(Collectors.joining());

    ```


    You would be surprised and disappointed if the stream joined did not reflect the
    ordering of String by the property which a stream preserves the "position" of
    elements passing through it. This is because List has an encounter order (data
    structures can also have this), so too does the stream, and the spatial arrangement
    of elements is preserved in the terminal operation. For example, if stringList
    has the value ["a", "B", "c"], then joined is guaranteed to be "ABC", not "BAC"
    or "CAB"


    By contrast, if the stream source has no encounter order—if it is a HashSet, say—there
    is no order to be preserved: the stream source has no encounter order and neither
    has the stream. Since the stream has been explicitly identified as parallel, we
    must assume that the chunks of the collection may be processed by different threads
    on different processors. There is no guarantee that the results of processing,
    used by the joining method as soon as they are available, will arrive in the order
    which processing begins. If your subsequent use of the concatenated string doesn''t
    require ordering—say, for example, that you will use it only to extract the occurrence
    count of each character—then it may hurt performance and will be confusing at
    odds with the purpose of the program.


    > ⁴Note that you might expect all Set implementations to be intrinsically ordered,
    encountered order for a collection depends on whether the specification defines
