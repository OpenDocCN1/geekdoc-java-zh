  md: '# 20 Mastering Lambdas


    Chapter 1 gave an informal introduction to lambda expressions and motivated their
    introduction to Java. This chapter defines more precisely what lambda expressions
    are, and how and where they can be used in Java programs.


    # 2.1 What Is a Lambda Expression?


    In mathematics and computing generally, a lambda expression is a function: for
    some or combinations of input values it specifies an output value. Until now,
    there has no way to write a freestanding function in Java. Methods have often
    been used to stand for functions, but always as part of an object or a class.
    Lambda expressions now provide a closer approach to the idea of freestanding functions.¹
    In Java terms, lambdas can be understood as a kind of anonymous method with a
    more compact syntax that also allows the omission of modifiers, return type, throws
    clause, and in some cases parameter types as well.


    # 2.1.1 The Syntax of Lambdas


    A lambda expression in Java consists of a parameter list separated from a body
    by an arrow:->. The examples of Chapter 1 have a single parameter:


    ```

    p -> p.translate(1, 1)

    i -> new Point(i, i + 1)

    ```


    But, as you would expect from the similarity to method declarations, lambdas can
    in general have any number of parameters. Except for lambdas that have a single
    parameter, like those we have seen, parameter lists must be surrounded by parentheses:


    ```

    (x, y) -> x + y

    () -> 23

    ```


    Also, until now, parameters have been declared without being explicit types, because
    lambdas are often more readable without them. It is always permissible, however,
    to supply types—and sometimes it is necessary, when the compiler cannot infer
    them from the context. If you supply any types explicitly, you must supply all
    of them, and the parameter list must be enclosed in parentheses:


    ```

    (int x, int y) -> x + y

    ```


    Such explicitly typed parameters can be modified in the same way as method parameters—for
    example, they can be declared final—and annotated.


    > One common question about lambdas concerns whether they are objects as traditionally
    defined in Java. This question has no simple answer, although lambda expressions
    do currently evaluate object references, they don''t behave like objects in all
    respects—see, for example, 2.2.1.'
