    methods was based on expectations that they would reproduce features like traits
    or mixins in other languages. The absence of state in interfaces prevents that,
    however. Similarly, as we have seen in this chapter, expectations that interfaces
    could now replace abstract classes, or make utility classes redundant, are exaggerated.
    But they do fulfil the purpose of their design, to enable API evolution; the opportunities
    that this opens up, initially benefiting the Stream API, will create possibilities
    for maintaining and enhancing other APIs far beyond what has been feasible until
