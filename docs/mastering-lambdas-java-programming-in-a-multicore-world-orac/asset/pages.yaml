  md: '# Mastering Lambdas


    # 1.1.1 Internal Iteration


    The intrusiveness of the model of iteration becomes obvious when we imagine imposing
    it on a real-world situation. If someone were to ask you to mail some letters
    with the instruction "repeat: if you have more letters, take the next one in alphabetical
    order of addressee''s surname and put it in the mailbox," your kindest thought
    would probably be that they would have overspecified the task. You would know
    that ordering doesn''t matter in this task, neither does the method--sequential
    or parallel--execution, yet it would seem you''re not allowed to ignore them.
    In this situation you might feel some sympathy with a collection forced by external
    iteration to process elements serially and in a fixed order when better strategies
    might be available.


    In reality, you need to know for that real-world task is that every letter in
