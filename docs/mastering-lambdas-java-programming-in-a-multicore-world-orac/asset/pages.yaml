    A more general form is the “statement lambda,” in which the body is a block—that
    is, a sequence of statements surrounded by:


    ```

    (Thread t) -> { t.start(); }

    () -> { System.gc(); return 0; }

    ```


    An expression lambda


    ```

    args -> expr

    ```


    can be seen as a short form of the corresponding statement lambda


    ```

    args -> { return expr; }

    ```


    The rules for using or omitting the return keyword in a block body are the same
    as those for an ordinary method body—that is, return is required whenever expression
    within the body is to return a value, or can be used without an argument to terminate
    execution of the body immediately. If the lambda returns void, then return may
    be omitted or used without an argument.


    Lambda expressions are neither required nor allowed to use a throws clause to
    declare the exceptions they throw.


