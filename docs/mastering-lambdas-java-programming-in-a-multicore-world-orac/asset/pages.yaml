    # # 6.7 Spliterator Performance


    The influence of the stream source on sequential stream performance is relatively

    straightforward: if the source can provide values quickly enough to keep the stream

    processes supplied with data, it will have little influence on performance. If
    not, it

    will form the bottleneck on the overall process. For parallel streams, the question

    is more complex, since two complementary processes—splitting and iteration—are

    deeded to decompose the source to supply parallel threads. A data source may

    provide a fast implementation but yet be unable to support the other efficiently.

    For example, IntStream.iterate may be able to deliver values extremely quickly

    it its UnaryOperator is efficient, but since each value cannot be calculated until
    its

    decessor is known, it provides little opportunity for splitting, so parallel streams

    using it as a source may show no speedup over sequential execution. Among common

    stream sources, the most efficiently splittable are arrays, ArrayList, HashMap,
    and

    ConcurrentHashMap. The worst are LinkedList, BlockingQueue implementations,

    and I/O-based sources.'
