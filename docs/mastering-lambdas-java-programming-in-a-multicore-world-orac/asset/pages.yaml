    # The class Optional


    In the last section we saw Optional<T> used as a return value from find operations,
    and earlier ($3.1.2) we encountered one of the primitive variants OptionalInt.
    We need Optional and its variants when applying terminal operations to empty streams—for
    example, one which a filter has eliminated all its elements. The last section
    described the problems of using null; Optional<T> avoids this by providing a special
    empty value that can never be confused with a T.


    For the limited use we made in this book, it is enough to briefly explain a few
    of the methods that allow client code to use its value:


    | Optional<T> |

    |---||

    | get() | T |

    | ifPresent(Consumer<T>) | void |

    | isPresent() | boolean |

    | orElse(T) | T |

    | orElseGet(Supplier<T>) | T |


    The purpose of these operations is as follows:


    +   - get: Returns a value if one is present; otherwise, this method throws NoSuchElementException.
    This is the “unsafe” operation for accessing an Optional’s contents, normally
    to be avoided in favor of one of the safe alternatives.

    - ifPresent: If a value is present, supplies it to the Consumer; otherwise, does
    nothing.

    - isPresent: Returns true if a value is present; otherwise, returns false.

    - orElse: Returns the value if present; otherwise, returns the argument. This
    and orElseGet are the safe operations for accessing the contents. In the normal
    use of Optional, with the possibility of an empty value, these operations are
    much more useful than get.

    - orElseGet: Returns the value if present; otherwise, invokes the Supplier and
    returns its result.


