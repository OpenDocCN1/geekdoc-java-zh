  md: '# Chapter 4: Ending Streams: Collection and Reduction 81


    etc.) Rather provide specialized classifying collectors for these various use
    cases, the Collector API provides an extension point by allowing collectors to
    be composed together.

    Composition allows new collectors to be created by combining the effects of two
    or more collectors or other operations. The most important format it takes is
    allowing groupBy to be combined with a second, "downstream," collector. In this
    composition, groupBy provides the classifier function and the classification keys,
    and the elements associated with a given key are forwarded to the downstream collector
    for further summarization. Figure 4-5 shows how this works for the simple groupBy
    overload that we already saw, in which the default downstream collector is the
    one returned by Collectors.toList.


    ![](img/22ee2c9e1fde5c9d7b79f9a94d441e1c_99_0.png)


    FIGURE 4-5. groupBy is a composition.


    A second Collectors factory method is provided to allow the creation of a classifying
    collector composed with a user-supplied downstream collector:


    | Collectors | | |

    | groupBy(Function<T,K>, Collector<T,A,D>) | Collector<T?,Map<K,D>> |'
