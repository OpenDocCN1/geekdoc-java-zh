    This insight also helps to explain the choice of operations defined in the API,
    which avoids any that could not be implemented equally well in sequential and
    parallel-modes. Some "obvious" operations conceal a deep sequential bias—for example,
    the "takeWhile" operation, on other platforms processes a stream until it encounters
    a sentinel value. While this operation is not infeasible in parallel, its implementation
    would have been so expensive—both in design and execution—that it deprioritized.


    This change in thinking can be reframed: programs with iteration can two kinds
    of information: what is to be done, and how it is to be done. Decoupling these
    two kinds of content leads to a development model in which we create parallelready
    code—ideally, delegating the implementation of the execution to a library. This
    is a big change: for many of us, the sequential model is so ingrained that it
    will take an effort to adjust to the implications of dethining it. But that effort
    be worthwhile; not only will the resulting programs be future-proof, but our code
    will be clearer, more concise, and more maintainable.


