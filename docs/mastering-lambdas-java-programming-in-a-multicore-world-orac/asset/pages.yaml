  md: '# Chapter 2: The Basics of Java Lambda Expressions 39


    Here is a short summary of the challenge of overload resolution: calls to overloads
    of different arities are usually easily distinguished, but choosing between two
    overloads of the same arity requires the compiler to know the type of the arguments
    supplied. In the case of untyped lambda this is a problem, since its type cannot
    be inferred without a target type, and the target type is provided by the method
    declaration, it cannot be known until overload resolution is done! It''s possible
    to break this circularity by imposing some arbitrary rules, making the process
    of type inference counterintuitive and unpredictable, or to force the user to
    supply lambda parameter types. To avoid these undesirable alternatives, the designers
    opted for making overload resolution more tolerant of reasoning under uncertainty
    and designing new APIs as to allow allow effective overload resolution with implicitly
    typed lambdas.


    # 2.8.1 Overloading with Lambda Expressions


    Before exploring the difficulties of using type inference, let''s see how it works
    in a straightforward case. Chapter 1 (§1.4) introduced the method Comparator comparing,
    which using a key extractor, creates a Comparator from it. This is one example
    of overload comparing (with most types bounded for readability):


    ```

    public static <T extends Comparable<U>>

    Comparator<T> comparing(Function<T, U> keyExtractor)

    ```


    Suppose that we want to sort strings by their length. Given an untyped target
    type as assignment, provides can take using an untyped lambda and it to create
    a Comparator for the purpose:


    ```

    Comparator<String> cs = Comparator.comparing(s -> s.length());

    ```


    Here is a highly simplified account of how the lambda type in ② is resolved. First,
    the compiler must choose a set of overloads against which to check the lambda.
    This set can contain only ①, given that the other overload has arguments. Now
    that the overload has been chosen, matching the return type of ① against the target
    type provided by ② allows the compiler to deduce that in this case T is String.
    The lambda expression can be matched against the function type Function<T, U>:


    ```

    public U apply(T t)

    ```


    Since the argument type T to the lambda is known to be String, the type returned
    by String.length—which is int, boxed to Integer—can be substituted for U. All
    the types are now known and the bound on U is ①, which guarantees that the result
    of the lambda, can be checked for Integer. Everything is consistent, and the call
    can be compiled.'
