    For example, I could classify my books by topic as:


    ```

    Map<Topic,List<Book>> booksByTopic = library.stream()

    .collect(groupingBy(Book::getTopic));

    ```


    Figure 4-3 shows how this works: for each incoming element, the classifier is
    called to determine the key. If the key is not present, it is added, with the
    value being a singleton List containing only the current element. If the key and
    a List value are already present, the stream element is added to the list. The
    supplier is the no-arguments constructor for a framework-chosen implementation
    of Map<Topic, List<Book>>, and the accumulator has the function of adding incoming
    element as just described. Both of these defaults can be overridden, as we shall
    see in the next section.


    A variant of groupingBy is the convenience method partitioningBy, in which the
    key K is specialized to Boolean:


