  md: '# Chapter 3: Introduction to Streams and Pipelines


    single pass. Moreover, because for each element these operations are executed
    by a single thread, optimizations that depend on code and data locality can operate.

    This is a very different model from bulk collection processing, which is normally
    implemented by a series of passes, each transforming every element of a collection
    and storing the results in a new one. In Chapter 1 we saw how a sequence of loops
    (e.g., p. 10) can be translated into an equivalent sequence of stream operations
    (p. 12). The stream code is both shorter and more efficient (as reported on p.
    148), because it is implemented by fusing the separate operations.


    # 3.1.1 Parallel-Ready Code


    Lazy value sequences are a very old idea in programming; what distinguishes their
    implementation in Java is the extension of this concept to include parallel processing
    of their elements. Although sequential processing is still a very important model
    for computing, it is no longer the unique reference: as Chapter 1 explained, parallel
    processing has become so important that we have to rethink our model of computation
    towards one that results in code that is agnostic about how it is executed, sequentially
    or in parallel. In that way, both our code—and even more importantly, our coding
    style—is insured against the need to change when, in the future, the balance of
    advantage shifts towards parallel execution. The Stream API encourages this view;
    a key to understanding it is the insight that all operations are defined so that
    the programmer follows some simple rules. In fact, this way of thinking about
    processing modes de-facto could have been deduced from the choice of a single
    `Stream` interface to represent both sequential and parallel streams; the API
    designers explored the idea of providing sequential-only and parallel-only methods
    in separate interfaces, and rejected it.


    Notice that this definitely does not mean operations will always produce exactly
    the same result in nondeterministic order. forEach, for example, is explicitly
    allowed to execute in nondeterministic order. In sequential mode it may preserve
    ordering, by happy accident of the implementation, but it is a mistake to depend
    on this; forEach and other nondeterministic operations are equally nondeterministic
    in sequential and in parallel mode. Conversely, an operation that is defined to
    be deterministic in either mode is guaranteed to work deterministically in both.
    The motivation for providing nondeterministic operations like forEach is provided
    by situations where unnecessary determinism has a significant performance cost.
    Choosing a deterministic alternative, like forEachOrdered, requires a conscious
    judgement that ordering is a requirement of the problem, rather than just an accidental
    by-product of the implementation.


    > A well-known example of this is the ReentrantLock class, which can be created
    with either a fair (deterministic) or non-fair (nondeterministic) thread scheduling
    policy. Fair locks are at least an order of magnitude less efficient and in practice
    are rarely used, as fair scheduling is not often required (Brian Goetz et al.,
    Java Concurrency in Practice, Addison-Wesley, 2006.)'
