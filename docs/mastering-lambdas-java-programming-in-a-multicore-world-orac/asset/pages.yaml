  md: "# Chapter 7: API Evolution with Default Methods 167\n\nfaces. The language\
    \ specification rules for method call resolution are complex, but they are carefully\
    \ designed so that they can be understood by reference to two simple principles.\n\
    \nThe first principle ensures that instance methods are chosen in preference to\
    \ default methods. This is sometimes stated as \"classes win over interfaces.\"\
    \ For example, in the following code Foo inherits the method hello from both the\
    \ interface Foo and the superclass Bar:\n\n```\n// competing instance and default\
    \ method declarations of hello()\n\ninterface Foo { default String hello() { return\
    \ \"Foo\"; } }\nclass Bar { public String hello() { return \"Bar\"; } }\n\nclass\
    \ FooBar extends Bar implements Foo {\n    public static void main(String[] args)\
    \ {\n        System.out.print(\"Hello \" + new FooBar().hello());\n    }\n```\n\
    \nWhen FooBar.main is run, the output is Hello from Bar. This principle holds\
    \ whether the instance is declared within the class or inherited from a superclass,\
    \ and whether the instance is abstract or concrete. The motivation for this rule\
    \ is to prevent behavioral incompatibility: that is, the addition of a default\
    \ method resulting in a change in the behavior of an implementing class. If classes\
    \ always win, then a class calling a method inherited from a superclass will continue\
    \ to call that method even when one of the interfaces it implements introduces\
    \ a method declaration of its own.\n\nThe second principle ensures that if more\
    \ than one competing default method is inherited by a class, the non-overridden\
    \ default method* is selected. By \"non-overridden method*\" we mean a default\
    \ method not overridden by any other that is also inherited by the class. For\
    \ example:\n\n```\n// competing default method declarations of hello()\n// Bar.hello(Foo.hello()),\
    \ so is a non-overridden method\n\ninterface Foo { default String hello() { return\
    \ \"Foo\"; } }\ninterface Bar extends Foo { default String hello() { return \"\
    Bar\"; } }\n\nclass FooBar implements Foo, Bar {\n    public static void main(String[]\
    \ args) {\n        System.out.print(\"Hello \" + new FooBar().hello());\n    }\n\
    ```"
