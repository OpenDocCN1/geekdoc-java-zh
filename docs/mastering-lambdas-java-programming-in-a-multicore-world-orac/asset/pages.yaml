  md: "# Mastering Lambdas\n\nhe changes in Java 8 are the biggest in the history\
    \ of the language, combining coordinated changes to the language, the libraries,\
    \ and the virtual machine. They promise to alter the way we think about the execution\
    \ of Java programs and to make the language fit for use in a world, soon to arrive,\
    \ massively parallel hardware. Yet for such an important, the actual changes to\
    \ the language seem minor. What is it about these apparently minor modifications\
    \ that will make such a big difference? And why should we change a programming\
    \ model that has served us so well throughout the lifetime of Java, and for much\
    \ longer before that? In this chapter we will explore some of the limitations\
    \ of that model and how the lambda-related features of Java 8 will enable Java\
    \ to evolve to meet the challenges of a new generation of hardware architectures.\n\
    \n# 1.1 From External to Internal Iteration\n\nLet's start with code that simply\
    \ iterates over a collection of mutable objects, calling a single method on each\
    \ of them. java.awt.Point objects (Point is a conveniently simple library class,\
    \ consisting only of a pair (x,y) coordinates). Our code then iterates over the\
    \ collection, translating (i.e., moving) each Point by a distance of 1 over the\
    \ x and y axes.\n\n```\nList<Point> pointList = Arrays.asList(new Point(1, 2),\
    \ new Point(2, 3));\nfor (Point p : pointList) {\n  p.translate(1, 1);\n}\n```\n\
    \nBefore Java 5 introduced the for-each loop, we would have written the loop like\
    \ this:\n\n```\nfor (Iterator pointItr = pointList.iterator(); pointItr.hasNext();\
    \ ) {\n  ((Point) pointItr.next()).translate(1, 1);\n}\n```\n\nOr, in a clearer\
    \ idiom (though less favored because it increases the scope of pointItr);\n\n\
    ```\nIterator pointItr = pointList.iterator();\nwhile (pointItr.hasNext()) {\n\
    \  ((Point) pointItr.next()).translate(1, 1);\n}\n```\n\nWe are asking pointList\
    \ to create an Iterator object on our behalf, and we are then using that to access\
    \ the elements of pointList in turn. This version is still relevant, because today\
    \ is the code that the Java compiler generates to implement the for-each loop.\
    \ Its key aspect for us is that the order of access to the"
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1: Taking Java to the Next Level 3


    elements of point controlled by an Iterator—there is nothing that we can do to
    change it. The Iterator for an ArrayList, for example, will return the elements
    of the list in sequential order.


    Why is this problematic? After all, when the Java Collections Framework was designed
    in 1998, it seemed perfectly reasonable to dictate the access order of list elements
    in this way. What has changed since then?


    Part of the answer lies in how hardware has been evolving. Workstations and servers
    have been equipped with multiple processors for a long time, but between the design
    of the Java Collections Framework in 1998 and the appearance of the first dual-core
    processors in personal computers in 2005, a revolution had taken place in chip
    design. A 40-year trend of exponentially increasing processor speed has been hindered
    by inescapable limits: signal lag, inadequate heat dissipation, and the hard truth
    that, even at the speed of light, data cannot cross a chip quickly enough for
    further processor speed increases.


    But clock limits notwithstanding, the density of chip components continued to
    increase. So, since it wasn''t possible to offer a 6 GHz core, the chip vendors
    began to offer dual-core processors, each core running at 3 GHz. This trend has
    continued, with currently no end in sight; at the time of the Java 8 date (March
    2014) quad-core processors have become mainstream, even-core processors are appearing
    in the commodity hardware market, and specialist servers have long been aligned
    with dozens of cores per processor. The direction is clear, and any programming
    that doesn''t adapt will fail in the face of competition from models that adapt.
    Adaptation would mean providing developers with an accessible way of making use
    of the processing power of multiple cores by distributing tasks over to be executed
    in parallel.¹ Failing to adapt, on the other hand, would mean a greater speed
    disadvantage compared to programs in languages that had found ways to assist users
    in easily parallelizing their code.


    The need for change is shown by the code at the start of this section, which could
    only access list elements one at a time in the order dictated by the iterator.
    Collection processing is not the only only processor-intensive task that programs
    have to carry out, but it is one of the most. The model of iteration embodied
    in Java''s loop forces collection element processing into a serial straitjacket,
    and that is a serious problem at a time when the processing requirement for runtimes—at
    least as far as fairness is concerned—is precisely the opposite: to distribute
    over multiple cores. Although we will see in Chapter 6 that by no means every
    problem will benefit from parallelization, the best cases give us speedup that
    is nearly linear in the number of cores.


    > The distribution of a processing task over multiple processors is often called
    parallelization. Even if we dislike this word, it''s a useful shorthand that will
    sometimes make explanations shorter and more readable.'
  merge: -1
