    .filter(b -> b.getTop() == HISTORY)

    .allMatch(b -> b.getHeight() < 19);

    ```


    But this is not what I want if I am planning the allocation of topics to shelves.
    It would be much better to determine in a single operation all of the topics that
    would fit on this low shelf (or, better, to calculate for each topic what headroom
    requires). This can be achieved by wrapping this code in a loop, but only at the
    cost of repeatedly calling library.stream—an inefficient and ugly solution. In
    Chapter 4 we will see much better solutions using the standard collectors.


    Note that, in accordance with the standard rules of logic, allMatch called on
