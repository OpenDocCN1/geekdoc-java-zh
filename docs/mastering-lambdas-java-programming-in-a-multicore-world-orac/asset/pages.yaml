    Chapter 3 briefly introduced the subject of stream sources in general, but the
    subsequent stream processing examples have all used either collections or stream
    factory methods for their source. This reflects the expected usage, but it is
    now time to explore other aspects of stream creation. In this chapter we will
    cover


    +   - Stream-bearing methods of the platform classes

    - Treatment of exceptions thrown by stream sources and in intermediate operations

    - The mechanism by which stream sources work

    - An example bringing these topics together


    # 5.1 Creating Streams


    After the stream-bearing methods of the Collection interface (see p. 50), perhaps
    the most important ways of creating streams are the factory methods of the stream
    interfaces themselves. Of these, Stream.empty and Stream.of were also introduced
    in Chapter 3. The next group consists of iterate and generate:


    | Stream<T> | |

    |---||

    | iterate(T,UnaryOperator<T>) | Stream<T> |

    | generate(Supplier<T>) | Stream<T> |


    The method iterate accepts a seed and a function (represented by the functional
    interface UnaryOperator) and repeatedly applies the function to produce successive
    stream elements. Analogous iterate methods are declared by all the primitive streams.
    Primitive streams have analogous methods. For example, to create a sequential
    IntStream that will deliver alternating values of 1 and -1 indefinitely, we could
    write


    ```

    IntStream.alternatingSigns(1, i -> -i);

    ```


    Each element in the stream is produced by applying the function to the producing
    element. Streams produced by iterate are infinite; you get useful results from
    them only by using an operation that can be applied to a finite initial stream,
    like limit and the short-circuit ''search'' operations (p. 63).


    The method generate takes a Supplier, representing a function that produces a
    value without requiring input, and repeatedly calls it to produce successive stream
    elements. The resulting sequential stream is not ordered, so generate is intended
    for situations where a series of values is within a distribution rather than sequentially'
