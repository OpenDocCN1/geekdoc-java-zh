    # 4.1 Using Collectors


    Later sections of this chapter explore the idea of the collector pattern in depth,
    and discuss when and how you might want to create a custom collector. But before
    that, we consider the most common and straightforward occurrence of the pattern
    in everyday programming: namely, the use of predefined collectors supplied by
    the factory methods of the Collectors class. These can be divided into two types:
    stand-alone collectors, useful in their own right, and collectors designed for
    use in others.


    # 4.1.1 Stand-alone Predefined Collectors


    Stand-alone collectors can be divided into three groups, depending on their function:


    +   - To accumulate to framework-supplied containers.

    - To accumulate to custom collections.

    - To accumulate elements into a classification map.


    We already met most of the first group in Chapter 3 (p. 67ff)—those for which
    the supplier is the constructor for a framework-supplied collection: for toSet
    it is an implementation of Set, for toList of List, and for the two overloads
    of toMap it is'
