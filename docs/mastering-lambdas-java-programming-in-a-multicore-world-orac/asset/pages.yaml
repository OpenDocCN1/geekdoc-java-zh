  md: "# Chapter 6: Stream Performance 141\n\nevery 15ms or less. A better alternative\
    \ on many platforms is System.nanoTime(), whose update resolution is typically\
    \ only microseconds (which can add significant measurement overhead). Further,\
    \ these calls measure elapsed time, so they include overheads like garbage collection.\n\
    \nThe JVM itself contributes misleading effects. Many of these relate to the dozens\
    \ of optimizations that are applied by the bytecode-to-native compiler. Here are\
    \ just three examples of the type of measurement problems that JVM operation can\
    \ produce.\n\nWarmup effects Measuring the cost of performing, say the first 100\
    \ executions of a code fragment will often produce different results from taking\
    \ the same measurement late. A variety of initialization overhead may contribute\
    \ to the earlier measurement, for example class loading—an expensive operation,\
    \ which the JVM delays until the classes are actually required. Another source\
    \ of inaccuracies is by JIT compilation: the JVM interprets bytecode directly,\
    \ compiles to native code when it has been executed enough times to qualify as\
    \ a “hot spot” (and then continues to profile it in the interests of further optimization).\
    \ The compilation overhead, followed by markedly improved performance, will give\
    \ results out of line with the steady-state observations that we require.\n\n\
    Dead code elimination A recurrent problem in writing microbenchmarks is ensuring\
    \ that something is done with the result of the computation. Dead code elimination\
    \ (DCE), an important compiler optimization, has the purpose of eliminating code\
    \ that has no effect. For example, the following code is a naive attempt to measure\
    \ the cost of addition:\n\n```\nlong start = System.currentTimeMillis();\nlong\
    \ sum = 0;\nfor (int i = 0; i < 1_000_000; i++) {\n    sum += i;\n}\nlong end\
    \ = System.currentTimeMillis();\nSystem.out.println(\"Elapsed time: \" + (end\
    \ - start) + \"ms\");\n```\n\nRunning this on a naive JVM will result in very\
    \ low execution times, because the compiler can detect that sum is never used,\
    \ so it is unnecessary to execute the loop at all. In this case, there is a simple\
    \ remedy: including the final value of sum in the output statement should ensure\
    \ that it has to be calculated, although even then a compiler may detect that\
    \ it can use an algebraic formula to calculate it without iterating; in general\
    \ it is quite difficult to devise ways of preventing the compiler from applying\
    \ DCE without distorting the measurements by introducing expensive new operations."
