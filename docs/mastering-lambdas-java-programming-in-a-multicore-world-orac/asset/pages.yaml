  md: '# About the Author


    Maurice Naftalin has over 30 years'' experience in IT as a developer, designer,
    architect, manager, teacher, and author. Naftalin, a certified Java programmer,
    has worked in every release of Java to date. His experience in Java and business
    gives him a unique perspective on the fundamental change that comes with introducing
    lambda expressions in Java SE 8. Naalin is a frequent presenter at conferences
    worldwide, including the annual JavaOne. He runs a popular tutorial site in collaboration
    with Oracle''s development team, www.lambdafaq.org, focused on the new language
    features in Java 8.


    # About the Technical Editors


    Stuart Marks works on the JDK Core Libraries team in the Java Platform Group at
    Oracle. He is currently working on lambda, streams, and collections, as well as
    improving test quality and performance. He has previously worked on JavaFX and
    Java ME at Sun Microsystems. He has over 20 years of software platform product
    development experience in the areas of window systems, interactive graphics, and
    embedded systems. Stuart holds a master''s degree in Computer Science and a bachelor''s
    degree in Electrical Engineering from Stanford University. He lives with his wife
    and daughter in California.


    Brian Goetz is one of the leading authorities on Java programming. He is the author
    of the very successful Java Concurrency in Practice, as well as over 75 articles
    on Java development. He was the specification lead for JSR-335 (Lambda Expressions
    for the Java Language) and has served on numerous other JCP Expert Groups. Brian
    is the Java Language Architect at Oracle.'
