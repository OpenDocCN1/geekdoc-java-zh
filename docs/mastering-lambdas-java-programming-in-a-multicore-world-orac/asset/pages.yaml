    # 6.2 Choosing Execution Mode


    This book has presented the opportunity of parallelism as a major motivation for
    programming with streams. But until now there has been no discussion of when you
    should actually take that opportunity.² there are three sets of factors to consider.


    **Execution context** What is the context in which your program is executing?
    Remember that the implementation of parallel streams is the common fork/join pool,
    which by default decides its thread count on the basis of a query to the operating
    system for the number of hardware cores. Operating systems vary in their responses
    to this query; for example, they may take account of multithreading, a technology
    that allows two threads to share a single core, so that the core does not have
    to idle when one thread is waiting for data. In a processor-bound application,
    that may well result in parallelism over more threads than can be used at one.


    Another aspect of the execution context is competition from other applications
    running on the same hardware. An implicit assumption in the common fork/join pool
    configuration is that there are no other demands on the hardware while parallel
    operations are being performed. If the machine is already heavily loaded, then
    either of the fork/join pool threads will be starved of CPU time, or the performance
    of the other applications will be degraded.


    If either of these problems means you want to reduce the number of threads in
    the common fork/join pool—or, if you want to change it for any other reason—the
    system java.util.concurrent.ForkJoinPool.common.parallelism can be set to override
    the default configuration of the fork/join pool. Of course, if you do this, then
    you have the challenging task of justifying your change by measuring the resulting
    change in your application''s performance!


    In addition to external competition, you should consider internal competition
    in deciding whether to execute streams in parallel. Some applications are already
    highly concurrent; for example, a web server, which will perform best if it can
