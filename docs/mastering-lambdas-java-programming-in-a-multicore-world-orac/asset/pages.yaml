    \ needed to make streams. To actually make, the utility class StreamSupport provides\
    \ methods that accept a Spliterator to create a reference stream, or one of Spliterator's\
    \ specialized primitive subtypes, Spliterator.ofInt, Spliterator.ofLong, or Spliterator.ofDouble,\
    \ to create a primitive stream. In the last section of this chapter we will see\
    \ a practical example of the creation of a stream from a custom spliterator.\n\
    \nIt is worth noting here, that StreamSupport.stream can also be used as a slightly\
