    his book has put forward two reasons for using lambdas and streams: to get programs,
    and to get better performance. Now, the code examples should have demonstrated
    the claim for better programs, but we have not yet investigated the claims about
    performance. In this chapter, those claims will be investigated through the technique
    of microbenchmarking.


    This is a dangerous business: results from microbenchmarking the risk of being
    used to guide program design directly. Since the overwhelming majority of situations
    are unsuitable, that is a serious problem! For example, a programmer''s intuition
    is a highly unreliable guide for locating bottlenecks in a complex system; the
    only sure to find them is to measure program behavior. So initial development,
    in which there is no working system to measure, is a prime instance of an unsuitable
    time for applying optimizations.


    This is important, mistakenly optimizing code that is not performance-critical
    is actually harmful.


    +   - It wastes valuable effort, since even successful optimization will not improve
    overall system performance.


    +   - It diverts attention from the important objectives of program design—to
    produce code that is well structured, readable, and maintainable.


    +   - Source-code optimizations may prevent well just-in-time compilers from applying
    their own (current and future) optimizations, because these optimizations are
    tuned to work on common idioms.


    That said, programmers enjoy learning about code performance, and there are real
    benefits to doing so. Among most this is the ability to develop by the Stream
    API to tune code—by choosing between sequential and parallel execution—without
    altering its design or behavior. This kind of unobtrusive performance management
    is new to the Java core libraries, but may become as successful and widespread
    as it already is in enterprise programming. To take advantage of it, you need
    a mental model of the influences on the performance of streams.


    However, even if you act on that model directly, it can help to guide (but not
    dictate!) your design, complementing the mental model that programmers already
