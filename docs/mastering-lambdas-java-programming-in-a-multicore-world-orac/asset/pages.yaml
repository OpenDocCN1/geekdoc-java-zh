    # 4.1.2 Composing Collectors


    Stand-alone collectors are useful in themselves, but the real power of the Collector
    API lies in the way that the collectors are designed to work together and with
    other functions. The importance of composition in the design of Java 8 emphasized
    at the beginning of Chapter 3; the Collector API provides a good example of this
    design principle in action.


    For example, suppose we want to represent the distribution of a set of values—say,
    the number of books in my library on each topic. In the last section, we learned
    about classifying collectors, which indeed produce mappings in which the key is
    a property such as the topic of a book. But the type of the value of these mappings
    has so far fixed as a list of the stream elements. To represent a distribution,
    this list needs to be replaced with an element count. This is only one example
    of values that can replace a list of elements in the mapping: other possibilities
    include a list of derived properties of the elements (the publishers of these
    books, say), or other reductions over the element values (the oldest in the topic,
    the sum of the pages,'
