  md: "# Chapter 7: API Evolution with Default Methods 161\n\nIf the implementation\
    \ CustomCollection were now compiled against this new version of Collection, the\
    \ result would be a source incompatibility: compilation would fail Collection\
    \ now declares an abstract method not overridden by CustomCollection. Without\
    \ default methods, the only fix would be to make CustomCollection match the new\
    \ definition of Collection by adding a concrete overriding declaration of stream.\
    \ But if the interface is part of a library—Collection is particularly widely\
    \ used, but any published API could be an example—then it would be hard practically\
    \ to accompany every enhancement with a requirement for extensive source changes\
    \ to all its implementations.\n\nNote, that without replacement, existing bytecode\
    \ for CustomCollection could still link and run against the new version of collection—interface\
    \ and implementation, according to the Java Language Specification (§13.2). By\
    \ leaving the implementation unchanged would only transfer the problem to the\
    \ client programmer; now code written to take advantage of the advertised new\
    \ capability of the interface would compile without problems:\n\n```\nCollection<Integer>\
    \ c = new Collection<>();\nStream<Integer> s = c.stream();\n```\n\nbut would fail\
    \ at runtime with an AbstractMethodError.\n\nThe basic problem was that the traditional\
    \ role of a java interface was restricted to defining a contract between client\
    \ and implementation; the responsibility for providing the functionality by the\
    \ lay entirely with the implementation. Naturally, if the requirements of a supply\
    \ contract are extended, the supplier must be aware of the change and must fulfill\
    \ the new part. Once an interface has been published, however, it becomes impracticable\
    \ to insist on this for all implementations. As a result, published interfaces\
    \ are never extended with abstract methods.\n\nThe introduction of default methods\
    \ changed this situation by extending the role of the interface beyond the definition\
    \ of a contract to include its partial implementation. Interfaces can now include\
    \ code, in the form of two kinds of non-abstract methods: default methods and\
    \ static methods. Default methods are now central to API evolution; for example,\
    \ how Collection.stream is actually declared in Java 8:\n\n```\npublic interface\
    \ Collection<E> {\n    int size();\n    boolean isEmpty();\n    // 11 more abstract\
    \ methods\n    default Stream<E> stream() {\n        // delegate to splitter,\
    \ also a default method of Collection\n        return StreamSupport.stream(spliterator(),\
    \ false);\n    }\n}\n    // other default methods\n```"
