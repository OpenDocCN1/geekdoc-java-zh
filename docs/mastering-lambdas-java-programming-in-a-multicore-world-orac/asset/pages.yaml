  md: "# Mastering Lambdas\n\nPipelines are ended by terminal operations, which we\
    \ saw in Chapter 3 are divided into three groups: search operations, reductions,\
    \ and operations with side-effects. Although we surveyed all three groups then,\
    \ there is much more to say about reductions; this chapter takes up story.\n\n\
    Broadly speaking, reductions are operations which return a single value in some\
    \ way summarizes the values of the stream elements. But this description does\
    \ not make a distinction—between summarizing operations that create new objects\
    \ and those that change their operands. Traditional ideas about reduction practice\
    \ Java programming encourages immutability; although modern Java programming encourages\
    \ immutability in general, most pipelines will be in mutable collections. So collection,\
    \ also called mutable, is the most important kind of terminal operation in the\
    \ Stream API. Collection is a generalization of classical reduction, which in\
    \ Java programming will be useful with primitive streams. Collection is like reduction\
    \ in the sense that it summarizes values of stream elements into a single object,\
    \ but it does so via mutation.\n\nHere is a simple comparison between traditional\
    \ Java bulk processing code and if we allow a real-life data source to be modeled\
    \ by an Iterable<Book>, declared here as library, we would usually accumulate\
    \ values from it to a List<Book> like this:\n\n```\nList<Book> book = new ArrayList<>();\n\
    for (Book b : library) {\n    bookList.add(b);\n}\n```\n\nIn Java 8, modelling\
    \ the data source by a Stream<Book>, we could get a similar effect by writing\n\
    \n```\nList<Book> bookList = libraryStream\n.collect(Collectors.toList());\n```\n\
    \nThe collector version has a number of advantages, beyond the obvious improvement\
    \ in conciseness and readability; the stream operations can be safely executed\
    \ in parallel, even if the List into which the stream elements are accumulated\
    \ (ArrayList is used in the current implementation) is not threadsafe. Further,\
    \ the collector pattern turns out to be very flexible, and collectors are easily\
    \ composed: Figure 4-1 provides a preview of examples developed later in this\
    \ chapter to give an idea of this flexibility.\n\nIn the imperative version, the\
    \ key components are the creation of the container (new ArrayList<>()) and the\
    \ accumulation of elements into it (bookList.add(b)). Collectors also have components\
    \ for these two tasks, called, respectively, the supplier and the accumulator.\
    \ We can identify these components in the diagrams introduced"
