    在这里，你创建了一个指向整数的指针并为它分配了一些内存。由于 `i` 仍然是指针而不是变量，你必须将 `i` 所指向的值设置为五，而不是设置 `i` 本。这改变了
    `i` 指向的位置，并导致 RAM 中某处预留的内存变成了孤儿。这种被遗忘的内存被称为**内存泄漏**。为了防止这种情况，请务必使用 `delete` 运算符来释放你最初分配的内存。


    不过，为单个变量分配内存并没有多大帮助。如果你知道该变量将会存在，就可以正常进行声明。这种做法创建了在编译时不可知的变长大小数组。但实际上，你怎么可能预先知道呢？你无法创建一个指针数组并在需要时访问它们，那仅仅是创建一个巨大数组并希望一切顺利的一种更耗费内存（RAM）的实现方式而已。


    现在你已经了解了什么是动态内存以及如何使用它，让我们在下一章中看看类和对象。


    # 第十一章 - 类与对象


    这实际上是 C++ 设计的初衷：支持类和对象。没有了它们，C++ 只是一个真正的 C 语言。但是之前提到的类和对象到底是什么呢？类是一种模具，而对象就是从模具中产生的实体。这些模具是灵活的，可以用于制作你任何类型的对象。模具可以是通用的，也可以是具体的。


    假设你想制造一辆汽车。这是一个抽象的教程，因为代码实际上并没有执行任何操作。思考一下汽车需要哪些属性。它们需要速度、价格、颜色、制造商和型号。如果是四驱驱动呢？你对它能做什么？你可以启动引擎和停止它吗？


    让我们看看汽车外观的类定义。


    ```cpp

    1 class Car

    2 {

    3 private:

    4

    5 bool running;

    6

    7 public:

    8

    9 string manufacturerName;

    10 string modelName

    11 bool fwd;

    12

    13 double topSpeed;

    14 double price;

    15

    16 unsigned int color; // 像 0xB9DDCED 这样的颜色

    17

    ```


    ```cpp

    18 Car(string manufacturerName, string modelName, double topSpeed, double price,
    unsigned int color,

    19 bool fwd)

    20 {

    21 this->manufacturerName = manufacturerName;

    22 this->modelName = modelName;

    23 this->topSpeed = topSpeed;

    24 this->price = price;

    25 this->color = color;

    26 this->fwd = fwd;

    27 this->running = false;

    28 }

    29

    30 void start ()

    31 {

    32 this->running = true;

    33 }

    34

    35 void stop ()

    36 {

    37 this->running = false;

    38 }

    39

    40

    ```


    正如你所看到的，类的定义与结构体（struct）非常相似，这是合理的，因为它们都是分组数据的方式。但这个类包含了结构体无法具备的内容：函数。


    # 总结


    到这里，你已经学会了如何创建第一个简单程序以及许多其他内容！你知道什么是变量、如何扩展程序、如何使用运算符、条件、循环、数组、函数、指针、动态内存以及类和对象来将你的程序蜕变为杰作！你看，C++
    并没有像你曾经认为的那样困难，尽管它确实有一定难度。


    下一步是汇总你从书中汲取的知识，并继续阅读更多关于 C++ 编程奇妙世界的内容。一旦你熟悉了，就一台虚拟机在其中进行编码并开始吧！你将学到一项在当今计算机行业中非常有价值的技能。


