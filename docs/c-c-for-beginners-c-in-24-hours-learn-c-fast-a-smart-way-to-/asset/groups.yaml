- md: "\n# The Ultimate Beginners Guide\n\n## C++\nFOR BEGINNERS\n\n## A Smart Way\
    \ To Learn C++\nPlain, Fast and Easy Steps\n\nSTANLEY HOFFMAN\n\n## C++\n## C++\
    \ for Beginners, C++ in 24 Hours, Learn C++ fast!\n\n## Introduction\n\nC++ is\
    \ an up and coming programming language that’s based on objects and compiling.\
    \ If you’re someone’s never programmed before, you might be confused by the words\
    \ object and compiling.\n\nA program that utilized compiling is read by the computer’s\
    \ CPU rather than being interpreted by a program installed on the computer to\
    \ run that program. Therefore, the program speaks more to the computer’s processing\
    \ system rather than a program.\n\nYou may already know this, but computers are\
    \ not able to read letters and have to read binary code, so the code has to be\
    \ translated into a computer readable one. Now, object-oriented code is just how\
    \ the code is structured. You’ll understand that tidbit a little better in the\
    \ following chapters.\n\nSo what does all mean and why do you need to know it?\
    \ As a programmer using C++, you’re going to need more than just the average text\
    \ editor. There only a few programming languages where that’s all you’ll need,\
    \ and they’re not really programming languages. One of the things you are going\
    \ to need is a compiler.\n\nAnother thing you’re going to want an Integrated Development\
    \ Environment, also known as an IDE. This is a programmer-oriented text editor\
    \ that has a syntax highlighting and is compiler integrated. For Windows and Linux,\
    \ you can use a few different options.\n\nYou don’t really need an IDE because\
    \ a basic text editor will, but something like Notepad is going to make things\
    \ a little more difficult. Word processors are also a bad choice because they\
    \ have autocorrect with spelling and grammar, which will miss up your code if\
    \ you’re not careful.\n\nTo begin with C++, you should understand that it is a\
    \ rigid syntax. This means the code is case sensitive, so typing ‘Hello’ is going\
    \ to be different than typing ‘hello’. In addition, you should know that the programming\
    \ language doesn’t care much about white space, so don’t worry about it.\n\nSo\
    \ that’s all you need to know about C++ when you first begin. Let’s get into some\
    \ actual coding to get you started!\n\nI think next book will also be interesting\
    \ for you:\n\n**Computer Hacking** by Matt Benton\n\n## Contents\n\n- Introduction\n\
    - Chapter One – Your First Program\n- Chapter Two – Variables\n- Using Variables\n\
    - Chapter Three – Expanding Your Program\n- iostream Library\n- Chapter Four –\
    \ Operators\n- Chapter Five – Conditionals\n- Chapter Six – Loops\n- Chapter Seven\
    \ – Arrays\n- Chapter Eight – Functions\n- Chapter Nine – Pointers\n- Chapter\
    \ Ten – Dynamic Memory\n- Chapter Eleven - Classes and Objects\n- Conclusion\n\
    \n## Chapter One – Your First Program\n\nDue to being this short tutorial on how\
    \ to get started with C++, we are going to start you out with a program in the\
    \ first chapter. Your first program is going to be very simple. All you are going\
    \ to do is write a single phrase on the screen, it is not as simple as writing\
    \ it in a Word document. First, take a look at the code and we will go further\
    \ into what it means.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    cout << \"Hello, world!\";\n    return 0;\n}\n```\n\nThe line\
    \ is going to tell the compiler it has to link to the iostream library to the\
    \ program. A library is a repository where snippets of code are stored, known\
    \ as functions. The library stores other things, like variables and operators.\n\
    \nThe iostream library has code that will let you send characters into the text\
    \ stream, which is then fed onto the screen. Think of it like a river. You are\
    \ the source and the screen the sea. Whatever is put into the river from the source\
    \ is going to go onto the screen.\n\nThe following line, line two, lets the compiler\
    \ know that you want to use the namespace known as std, which is a standard namespace.\
    \ Namespaces are an area where the code is stored. This is useful if you have\
    \ two pieces of code that have the same name. Normally, pieces of code are not\
    \ able to share the same name, but if one of them is in a separate namespace then\
    \ they can have the same name.\n\nThe third line of code is the beginning of the\
    \ code. It is the main block, as the name implies. Everything inside the braces\
    \ will be translated by the compiler. You will need that line because nothing\
    \ will happen without it.\n\nNow comes the printing of the phrase ‘Hello World!’.\
    \ To do this, you use code that is stored inside the iostream library. This part\
    \ of the code is known as cout, which sends information to the stream. The <<\
    \ comes after cout is an operator. This means output.\n\nThe following stream\
    \ is ‘Hello, World!’ and is known as a string. Strings are a sequence of characters\
    \ and are shown by enclosing them in double quotation. This ends with a semicolon\
    \ and signifies the end of the statement. If the semicolon is not used, then the\
    \ program is not going to compile.\n\n```\n}\n```\n\nThe last line, the closing\
    \ brace, is very simple but very important. It is placed at the end of main and\
    \ tells the computer that the main block has finished. It will return a value\
    \ of 0 to the CPU. A non-zero value will create an error, so it is a necessary\
    \ line. Now that you have the source code of the program, you will have to compile\
    \ it. By knowing how to create your first program and what it looks like let’s\
    \ look at variables!\n\n## Chapter Two – Variables\n\nIn the last chapter, variables\
    \ were mentioned and it was said they would be discussed. Now is the time to discuss\
    \ them. A variable is something that stores a value. Imagine that every variable\
    \ is a box and every box is labeled with a name.\n\nThe category is what type\
    \ of item is storing and its name is the specific variable called. Boxes are able\
    \ to store many things, but only if that thing fits inside the box. This is the\
    \ same with variables. They all have a type, name, and size that govern what they\
    \ are and able to store.\n\nFor example, one type of variable is the integer.\
    \ If you know basic mathematics, then you know that integers are whole numbers\
    \ and their negative counterparts. So -5, 0 are all integers. In addition, integer\
    \ variables have a fixed size. They are only able to hold one number between others.\
    \ You probably won’t need numbers larger than that, so we’ll save the rest for\
    \ another time.\n\nHere’s to see the different types of variables you can use.\n\
    \n| C++ Type | Stores |\n| :--- | :--- |\n| int | Whole numbers (integers) |\n\
    | bool | True or False (0 or 1) |\n| float | Fractional numbers (reals) |\n| double\
    \ | Float with twice the precision |\n| char | A single ASCII character |\n\n\
    There are a few different variable types. You’ll probably use them all when you\
    \ program, but for now you’re only going to use a few.\n\n## Using Variables\n\
    \nTake a look at the following program:\n\n```cpp\n1 #include <iostream>\n2 using\
    \ namespace std;\n3\n4 int variable;\n5\n6 int main()\n7 {\n8\n9 variable = 42;\n\
    10\n11 cout << variable;\n12 return 0;\n13\n14 }\n```\n\nMost of this program\
    \ is going to look familiar, except for the fourth and sixth lines. The first\
    \ part declares the variable. This is telling the compiler that you’re going to\
    \ use a variable. In declarations, the variable type is going to come first. In\
    \ the example, it’s using the int type. Next is the variable’s name, which would\
    \ be known as var.\n\nIt’s easy and simple. A variable name can be anything, but\
    \ be sure it’s something relevant and not something that it’s already reserved\
    \ and means something in C++ and doesn’t begin with a number or a special character.\
    \ You should start with a lowercase letter, and end the statement with a semicolon.\n\
    \nLine nine in the code above is known as an assignment and assigns a value to\
    \ the variable. The equal sign is the assignment operator, and it is what it does\
    \ assigning. The variable on the left is given the value on the right, and the\
    \ = is a binary operator because it has two operands. One to the left and the\
    \ other to the right. The operand on the right doesn’t have to be a value. It\
    \ can be another variable. The left has to be a variable and you can’t change\
    \ the meaning of the number. In the example, the integer var is a value of forty-two.\n\
    \nYou can see the cout statement doesn’t have quotation marks around the variable\
    \ name. That’s because you want to output the value of the var and not display\
    \ the string ‘var’. If you were compiling the program, it would print ‘42’ because\
    \ that is the value of the var has. By trying it to another integer and look at\
    \ the output.\n"
  mdcn: "\n\n# 初学者终极指南\n\n## C++\n初学者必读\n\n## 学习 C++ 的智能方法\n简单、快速、易学的步骤\n\nSTANLEY\
    \ HOFFMAN\n\n## C++\n## 针对初者的 C++，24小时学会 C++，快速学习 C++！\n\n## 序言\n\nC++ 是一门新兴的编程语言，它基于对象和编译。如果你是一个从未编写过程序的人，可能会对“对象”和“编译”这些词汇感到困惑。\n\
    \n利用编译的程序是由计算机的 CPU 读取的，而不是通过安装在计算机上运行该程序的程序进行解释的。因此，该程序更多的是与计算机的处理系统直接对话，而不是与某个程序对话。\n\
    \n你可能已经知道这一点，但计算机无法读取字母，必须读取二进制代码，因此代码必须翻译成计算机可读的形式。现在，面向对象的代码只是代码的组织方式。你将在接下来的章节中更更好地理解这一小知识。\n\
    \n那么，这一切意味着什么，你为什么需要知道它呢？作为一名使用 C++ 的程序员，你需要的不仅仅是普通的文本编辑器。只有少数编程语言只需要编辑器，而它们实际上并不是真正的编程语言。你将需要的工具之一是编译器。\n\
    \n另一个你可能想要的是集成开发环境，也称为 IDE。这是一种面向程序员的文本编辑器，具有语法高亮功能并集成了编译器。对于 Windows 和 Linux，你可以使用几种不同的选项。\n\
    \n你并不真的需要 IDE，因为基础的文本编辑器也可以，但像记事本这样的工具会让事情变得有点困难。文字处理软件也是一个糟糕的选择，因为它们带有拼写和语法的自动纠正功能，如果不小心，会搞乱你的代码。\n\
    \n开始学习 C++ 之前，你应该理解它的语法是严格的。这意味着代码对大小写敏感，所以输入‘Hello’会和输入‘hello’不同。此外，你应该知道这种编程语言并不在乎空格，所以不用担心它。\n\
    \n以上就是你初学 C++ 时需要知道的所有内容。让我们进入实际代码阶段让你上手吧！\n\n我想下一本书对你可能也会趣：\n\nMatt Benton 著\
    \ **计算机黑客技术**\n\n## 目录\n\n- 序言\n- 第一章——你的第一个程序\n- 第二章——变量\n- 使用变量\n- 第三章——扩展你的程序\n\
    - iostream 库\n- 第四章——运算符\n- 第五章——条件语句\n- 第六章——循环\n- 第七章——数组\n- 第八章——函数\n- 第九章——指针\n\
    - 第十章——动态内存\n- 第十一章——类与对象\n- 结\n\n## 第一章——你的第一个程序\n\n由于这是一个关于如何开始 C++ 的简短教程，我们将在第一章让你开始一个程序。你的第一个程序将非常简单。你所做的就是在屏幕上写一个短语，这不像在\
    \ Word 文档中写那么简单。首先，看一眼代码，我们将进一步探讨它的含义。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    cout << \"Hello, world!\";\n    return 0;\n}\n```\n\n\
    这一行将告诉编译器，它必须将 iostream 库链接到程序。库是一个存储代码片段的地方，这些片段被称为函数。库还存储其他内容，如变量和运算符。\n\niostream\
    \ 库的代码允许你将字符发送到文本流中，然后将其输入到屏幕上。把它想象成一条河流。你是源头，屏幕是海洋。从源头进入河流的任何东西都会显示在屏幕上。\n\n\
    接下来的第二行让编译器知道你想使用名为 std 的命名空间，这是一个标准命名空间。命名空间是存储代码的区域。如果你有两个名称相同的代码，这非常有用。通常情况下，代码不能共享相同的名称，但如果其中一个在独立的命名空间中，它们就可以有相同的名称。\n\
    \n代码的第三行是代码的开头。它是主块（main block），正如名称所示。大括号内的所有内容都将被编译器翻译。你需要那行代码，因为没有它什么都不会发生。\n\
    \n现在是打印短语‘Hello World!’的时候。为了实现这一点，你使用了存储在 iostream 库中的代码。代码的这部分被称为 cout，它向流发送信息。紧接在\
    \ cout 之后的 `<<` 是一个运算符。这意味着输出。\n\n接下来的流是‘Hello, World!’，被称为字符串。字符串是字符序列，通过用双引号括起来来显示。它以分号结束，表示语句的结束。如果没有使用分号，程序将无法编译。\n\
    \n```\n}\n```\n\n最后一行，即右大括号，非常简单但非常重要。它放置在 main 的末尾，告诉计算机主块已结束。它将向 CPU 返回一个值 0。非零值将产生错误，所以它是必须的一行。现在你已经有了程序的源代码，你必须编译它。在了解了如何创建第一个程序以及它是什么样子后，让我们来看看变量吧！\n\
    \n## 第二章——变量\n\n在上一章中，提到了变量，并说将讨论它们。现在是讨论它们了。变量是存储值的东西。想象每个变量都是一个盒子。每个变量都是一个盒子，并贴有标签。\n\
    \n变量类型可以存储很多东西，但现在你只需要使用几个。变量类型是整数。\n\n例如，整数 的类型是赋值。等号是赋值运算符，它是它所执行的操作。左边的变量被赋予右边的值，赋值\
    \ 是二进制运算符，因为它有两个操作数。右边的操作数不必须是一个值，它可以是另一个变量。把剩下的留给以后。\n\n这里是你可以使用的变量类型。\n\n| C++\
    \ 类型 | 存储 |\n| :--- | :--- |\n| int | 整数（整数型） |\n| bool | 真或假（0 或 1） |\n| float\
    \ | 浮点数（实数） |\n| double | 双精度浮点数 |\n| char | 单个 ASCII 字符 |\n\n有几种不同的变量类型。当你编写程序时可能会使用所有类型，但现在你只需要几个。\n\
    \n## 使用变量\n\n看看下面的程序：\n\n```cpp\n1 #include <iostream>\n2 using namespace std;\n\
    3\n4 int variable;\n5\n6 int main()\n7 {\n8\n9 variable = 42;\n10\n11 cout <<\
    \ variable;\n12 return 0;\n13\n14 }\n```\n\n程序的其他部分看起来很熟悉，除了第四行部分声明了变量。这告诉编译器你将使用一个变量。在声明中，变量类型在前。在示例中，它使用的是\
    \ int 类型。接下来是变量的名字，被称为 var。\n\n这很简单很方便。变量名可以是任何内容，但要确保它是相关的，而不是 C++ 中保留且具有含义的名称，并且不以数字或特殊字符开头。你应该从小写字母开始，并用分号结束语句。\n\
    \n你可以看到 cout 语句变量名周围没有加引号。这是因为你想输出变量的值，而不是显示字符串‘var’。如果你编译该程序，它将打印‘42’，因为那是 var\
    \ 拥有的值。通过将其改为另一个整数并查看输出。\n\n"
