  md: '# Introduction


    C++ is an up and coming programming language that ’s based on objects and compiling.
    If you ’re someone ’s never programmed before, you might be confused by the words
    object and compiling.


    A program that utilized compiling is read by the computer ’s CPU rather than being
    interpreted by a program installed on the computer to run that program. Therefore,
    the program speaks more to the computer ’s processing system rather than a program.


    You may already know this, but computers are not able to read letters and have
    to read binary code, so the code has to be translated into a computer readable
    one. Now, object-orientedcode is just how the code is structured. You ’Il understand
    that tidbit a little better in the following chapters.


    So what does all mean and why do you need to know it? As a programmer using C++,
    you ’re going to need more than just the average text editor. There only a few
    programming languages where that ’s all you ’ll need, and they ’re not really
    programming languages. One of the things you are going to need is a compiler.


    Another thing you ’re going to want an Integrated Development Environment, also
    known as an IDE. This is a programmer-oriented text editor that has a syntax highlighting
    and is compiler integrated. For Windows and Linux, you can use a few different
    options.


    You don ’t really need an IDE because a basic text editor will, but something
    like Notepad is going to make things a little more difficult. Word processors
    are also a bad choice because they have autocorrectwith spelling and grammar,
    which will miss up your code if you ’re not careful.


    To begin with C++, you should understand that it is a rigid syntax. This means
    the code is case sensitive, so typing ’Hello ’ is going to be different than typing
    ’hello’. In addition, you should know that the programming language doesn ’t care
    much about white space, so don ’t worry about it.


    So that ’s all you need to know about C++ when you first begin. Let ’s get into
    some actual coding to get you started!'
