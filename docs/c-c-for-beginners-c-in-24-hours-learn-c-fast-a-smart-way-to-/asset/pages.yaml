  md: '# Using Variables


    Take a look at the following program:


    ```

    1 #include <iostream>

    2 using namespace std;

    3

    4 int variable;

    5

    6 int main()

    7 {

    8

    9 variable = 42;

    10

    11 cout << variable;

    12 return 0;

    13

    14 }

    ```


    Most of this program is going to look familiar, except for the fourth and sixth
    lines. The first unfamiliar part declares the variable. This is telling the compiler
    that you’re going to use a variable. In declarations, the variable type is going
    to come first. In the example, it’s using the int type. Next is the variable’s
    name, which would be known as var.


    It’s easy and simple. A variable name can be anything, but be sure it’s something
    relevant and not something that it’s already reserved and means something in C++
    and it doesn’t begin with a number or a special character. You should start with
    a lowercase letter, and end the statement with a semi-colon.


    Line nine in the code above is known as an assignment and assigns a value to the
    variable. The equal sign is the assignment operator, and it is what it does assigning.
    The variable on the left is given the value on the right, and the = is a binary
    operator because it has two operands. One to the left and the other to the right.
    The operand on the right doesn’t have to be a value. It can be another variable.
    The left has to be a variable and you can’t change the meaning of the number seven.
    In the example, the integer var is a value of forty-two.


    You can see the cout statement doesn’t have quotations marks around the variable
    name. That’s because you want to output the value of the var and not display the
    string ‘ var’. If you were compiling the program, it would print ‘ 42 ’ because
    that is the value of the var has. By trying it to another integer and look at
    the output.'
