  md: '# Chapter Ten - Dynamic Memory


    So far you ''ve been able to create variables at compile-time and modify them
    during runtime; however, you can create them in run-time, too when you use dynamic
    memory allocation. This method uses allocation and deallocation of RAM as the
    program is running. Since you ''re accessing RAM, it ''s natural to assume that
    you ''ll do it with pointers, but dynamic memory in C++ is utilized differently
    than it is in C.


    Take a look at the following block of code.


    ```

    int* i = new int;

    2

    3 *i = 5;

    4

    5 cout <<*i << "at address"<<i

    6 << "which itself is at address " <<& << std::endl;

    7 delete i;

    ```'
