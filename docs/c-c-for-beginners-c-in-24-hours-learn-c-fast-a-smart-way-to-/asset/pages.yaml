    aside memory in RAM somewhere. This memory has been forgotten known as memory
    leak. To stop this, be sure to deallocate the memory you set aside in the first
    place using the delete operator.


    ![](img/ff37a0bcb18b4a432276b7406e26478e_48_0.png)


