  md: "*Preface* \n\n*xv *\n\n**To** **the** **student** \n\nWe hope that this textbook\
    \ provides you with an enjoyable introduction to the ﬁeld \n\nof algorithms. We\
    \ have attempted to make every algorithm accessible and inter- \n\nesting. To\
    \ help you when you encounter unfamiliar or difﬁcult algorithms, we \n\ndescribe\
    \ each one in a step-by-step manner. We also provide careful explanations \n\n\
    of the mathematics needed to understand the analysis of the algorithms and sup-\
    \ \n\nporting ﬁgures to help you visualize what is going on. \n\nSince this book\
    \ is large, your class will probably cover only a portion of its \n\nmaterial.\
    \ Although we hope that you will ﬁnd this book helpful to you as a course \n\n\
    textbook now, we have also tried to make it comprehensive enough to warrant space\
    \ \n\non your future professional bookshelf. \n\nWhat are the prerequisites for\
    \ reading this book? \n\n \n\nYou need some programming experience. In particular,\
    \ you should understand \n\nrecursive procedures and simple data structures, such\
    \ as arrays and linked lists \n\n(although Section 10.2 covers linked lists and\
    \ a variant that you may ﬁnd new). \n\n \n\nYou should have some facility with\
    \ mathematical proofs, and especially proofs \n\nby mathematical induction. A\
    \ few portions of the book rely on some knowledge \n\nof elementary calculus.\
    \ Although this book uses mathematics throughout, Part I \n\nand Appendices A–D\
    \ teach you all the mathematical techniques you will need. \n\nOur website, http://mitpress.mit.edu/algorithms/,\
    \ links to solutions for some of \n\nthe problems and exercises. Feel free to\
    \ check your solutions against ours. We ask, \n\nhowever, that you not send your\
    \ solutions to us. \n\n**To** **the** **professional** \n\nThe wide range of topics\
    \ in this book makes it an excellent handbook on algo- \n\nrithms. Because each\
    \ chapter is relatively self-contained, you can focus on the \n\ntopics most relevant\
    \ to you. \n\nSince most of the algorithms we discuss have great practical utility,\
    \ we address \n\nimplementation concerns and other engineering issues. We often\
    \ provide practical \n\nalternatives to the few algorithms that are primarily\
    \ of theoretical interest. \n\nIf you wish to implement any of the algorithms,\
    \ you should ﬁnd the transla- \n\ntion of our pseudocode into your favorite programming\
    \ language to be a fairly \n\nstraightforward task. We have designed the pseudocode\
    \ to present each algorithm \n\nclearly and succinctly. Consequently, we do not\
    \ address error handling and other \n\nsoftware-engineering issues that require\
    \ speciﬁc assumptions about your program- \n\nming environment. We attempt to\
    \ present each algorithm simply and directly with- \n\nout allowing the idiosyncrasies\
    \ of a particular programming language to obscure its \n\nessence. If you are\
    \ used to 0\\-origin arrays, you might ﬁnd our frequent practice of"
