  md: "*1226* \n\n*Appendix* *D* *Matrices* \n\nBecause multiplying the zero vector\
    \ by any matrix yields a zero vector, the set \n\nof permutations of S n deﬁned\
    \ by multiplying by n  n 0\\-1 matrices with full rank \n\nover *GF*.2/ cannot\
    \ include all permutations of S n . Let’s extend the class of per- \n\nmutations\
    \ deﬁned by matrix-vector multiplication to include an additive term, so \n\n\
    that x 2 S n maps to Ax C c , where c is an n\\-bit vector and addition is performed\
    \ \n\nover *GF*.2/. For example, when \n\nA D \n\nෂ 1\n\n0 \n\n1\n\n1 \n\nස \n\
    \nand \n\nc D \n\nෂ 0 \n\n1 \n\nස \n\n; \n\nwe get the following permutation \
    \ A;c :  A;c .0/ D 2,  A;c .1/ D 1,  A;c .2/ D 0, \n\n A;c .3/ D 3. We call any\
    \ permutation that maps x 2 S n to Ax C c , for some n  n \n\n0\\-1 matrix A\
    \ with full rank and some n\\-bit vector c , a ***linear*** ***permutation***.\
    \ \n\n***d.*** Use a counting argument to show that the number of linear permutations\
    \ of S n \n\nis much less than the number of permutations of S n . \n\n***e.***\
    \ Give an example of a value of n and a permutation of S n that cannot be achieved\
    \ \n\nby any linear permutation. (*Hint: *For a given permutation, think about\
    \ how \n\nmultiplying a matrix by a unit vector relates to the columns of the\
    \ matrix.) \n\n**Appendix** **notes** \n\nLinear-algebra textbooks provide plenty\
    \ of background information on matrices. \n\nThe books by Strang \\[422, 423\\\
    ] are particularly good."
