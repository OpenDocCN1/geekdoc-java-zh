  md: "*1012* \n\n*Chapter* *33* *Machine-Learning* *Algorithms* \n\nIf Lloyd’s procedure\
    \ really required k ^n^ iterations, it would be impractical. In \n\npractice,\
    \ it sometimes sufﬁces to terminate the procedure when the percentage de- \n\n\
    crease in f .S; C/ in the latest iteration falls below a predetermined threshold.\
    \ Be- \n\ncause Lloyd’s procedure is guaranteed to ﬁnd only a locally optimal\
    \ clustering, one \n\napproach to ﬁnding a good clustering is to run Lloyd’s procedure\
    \ many times with \n\ndifferent randomly chosen initial centers, taking the best\
    \ result. \n\nThe running time of Lloyd’s procedure is proportional to the number\
    \ T of it- \n\nerations. In one iteration, assigning points to clusters based\
    \ on the nearest-center \n\nrule requires O.dkn/ time, and recomputing new centers\
    \ for each cluster requires \n\nO.dn/ time (because each point is in one cluster).\
    \ The overall running time of the \n\nk\\-means procedure is thus O.Tdkn/. \n\n\
    Lloyd’s algorithm illustrates an approach common to many machine-learning \n\n\
    algorithms: \n\n \n\nFirst, deﬁne a hypothesis space in terms an appropriate\
    \ sequence � of pa- \n\nrameters, so that each � is associated with a speciﬁc\
    \ hypothesis h ෂ . (For the \n\nk\\-means problem, � is a dk\\-dimensional vector,\
    \ equivalent to C , containing \n\nthe d \\-dimensional center of each of the\
    \ k clusters, and h ෂ is the hypothesis that \n\neach data point x should be grouped\
    \ with a cluster having a center closest to x.) \n\n \n\nSecond, deﬁne a measure\
    \ f .E; �/ describing how poorly hypothesis h ෂ ﬁts the \n\ngiven training data\
    \ E. Smaller values of f .E; �/ are better, and a (locally) opti- \n\nmal solution\
    \ (locally) minimizes f .E; �/. (For the k\\-means problem, f .E; �/ \n\nis just\
    \ f .S; C/.) \n\n \n\nThird, given a set of training data E, use a suitable optimization\
    \ procedure to \n\nﬁnd a value of � ^^ that minimizes f .E; � ^^ /, at least\
    \ locally. (For the k\\-means \n\nproblem, this value of � ^^ is the sequence\
    \ C of k center points returned by \n\nLloyd’s algorithm.) \n\n \n\nReturn �\
    \ ^^ as the answer. \n\nIn this framework, we see that optimization becomes a\
    \ powerful tool for machine \n\nlearning. Using optimization in this way is ﬂexible.\
    \ For example, ***regularization*** \n\nterms can be incorporated in the function\
    \ to be minimized, in order to penalize \n\nhypotheses that are “too complicated”\
    \ and that “overﬁt” the training data. (Regu- \n\nlarization is a complex topic\
    \ that isn’t pursued further here.) \n\n**Examples** \n\nFigure 33.1 demonstrates\
    \ Lloyd’s procedure on a set of n D 49 cities: 48 U.S. \n\nstate capitals and\
    \ the District of Columbia. Each city has d D 2 dimensions: \n\nlatitude and longitude.\
    \ The initial clustering in part (a) of the ﬁgure has the initial \n\ncluster\
    \ centers arbitrarily chosen as the capitals of Arkansas, Kansas, Louisiana,"
