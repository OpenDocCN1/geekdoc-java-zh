    \ can always either subtract 1 \n\nfrom our indices or just overallocate the array\
    \ and leave position 0 unused. \n\nWe understand that if you are using this book\
    \ outside of a course, then you \n\nmight be unable to check your solutions to\
    \ problems and exercises against solutions \n\nprovided by an instructor. Our\
    \ website, http://mitpress.mit.edu/algorithms/, links \n\nto solutions for some\
    \ of the problems and exercises so that you can check your \n\nwork. Please do\
    \ not send your solutions to us. \n\n**To** **our** **colleagues** \n\nWe have\
    \ supplied an extensive bibliography and pointers to the current literature. \n\
    \nEach chapter ends with a set of chapter notes that give historical details and\
    \ ref- \n\nerences. The chapter notes do not provide a complete reference to the\
    \ whole ﬁeld \n\nof algorithms, however. Though it may be hard to believe for\
    \ a book of this size, \n\nspace constraints prevented us from including many\
    \ interesting algorithms. \n\nDespite myriad requests from students for solutions\
    \ to problems and exercises, \n\nwe have adopted the policy of not citing references\
    \ for them, removing the temp- \n\ntation for students to look up a solution rather\
    \ than to discover it themselves. \n\n**Changes** **for** **the** **fourth** **edition**\
    \ \n\nAs we said about the changes for the second and third editions, depending\
    \ on how \n\nyou look at it, the book changed either not much or quite a bit.\
    \ A quick look at the \n\ntable of contents shows that most of the third-edition\
    \ chapters and sections appear \n\nin the fourth edition. We removed three chapters\
    \ and several sections, but we have \n\nadded three new chapters and several new\
    \ sections apart from these new chapters. \n\nWe kept the hybrid organization\
    \ from the ﬁrst three editions. Rather than \n\norganizing chapters only by problem\
    \ domains or only according to techniques, \n\nthis book incorporates elements\
    \ of both. It contains technique-based chapters on \n\ndivide-and-conquer, dynamic\
    \ programming, greedy algorithms, amortized analy- \n\nsis, augmenting data structures,\
    \ NP-completeness, and approximation algorithms. \n\nBut it also has entire parts\
    \ on sorting, on data structures for dynamic sets, and on \n\nalgorithms for graph\
    \ problems. We ﬁnd that although you need to know how to ap- \n\nply techniques\
    \ for designing and analyzing algorithms, problems seldom announce \n\nto you\
    \ which techniques are most amenable to solving them. \n\nSome of the changes\
    \ in the fourth edition apply generally across the book, and \n\nsome are speciﬁc\
    \ to particular chapters or sections. Here is a summary of the most \n\nsigniﬁcant\
