    \ the invariant—usually \n\nalong with the reason that the loop terminated—gives\
    \ us a useful property that \n\nhelps show that the algorithm is correct. \n\n\
    When the ﬁrst two properties hold, the loop invariant is true prior to every iteration\
    \ \n\nof the loop. (Of course, you are free to use established facts other than\
    \ the loop \n\ninvariant itself to prove that the loop invariant remains true\
    \ before each iteration.) \n\nA loop-invariant proof is a form of mathematical\
    \ induction, where to prove that a \n\nproperty holds, you prove a base case and\
    \ an inductive step. Here, showing that the \n\ninvariant holds before the ﬁrst\
    \ iteration corresponds to the base case, and showing \n\nthat the invariant holds\
    \ from iteration to iteration corresponds to the inductive step. \n\nThe third\
    \ property is perhaps the most important one, since you are using the \n\nloop\
    \ invariant to show correctness. Typically, you use the loop invariant along with\
    \ \n\nthe condition that caused the loop to terminate. Mathematical induction\
    \ typically \n\napplies the inductive step inﬁnitely, but in a loop invariant\
    \ the “induction” stops \n\nwhen the loop terminates."
