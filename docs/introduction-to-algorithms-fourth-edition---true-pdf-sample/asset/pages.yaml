  md: "*xiv* \n\n*Preface* \n\nThe text is intended primarily for use in undergraduate\
    \ or graduate courses in \n\nalgorithms or data structures. Because it discusses\
    \ engineering issues in algorithm \n\ndesign, as well as mathematical aspects,\
    \ it is equally well suited for self-study by \n\ntechnical professionals. \n\n\
    In this, the fourth edition, we have once again updated the entire book. The \n\
    \nchanges cover a broad spectrum, including new chapters and sections, color illus-\
    \ \n\ntrations, and what we hope you’ll ﬁnd to be a more engaging writing style.\
    \ \n\n**To** **the** **teacher** \n\nWe have designed this book to be both versatile\
    \ and complete. You should ﬁnd it \n\nuseful for a variety of courses, from an\
    \ undergraduate course in data structures up \n\nthrough a graduate course in\
    \ algorithms. Because we have provided considerably \n\nmore material than can\
    \ ﬁt in a typical one-term course, you can select the material \n\nthat best supports\
    \ the course you wish to teach. \n\nYou should ﬁnd it easy to organize your course\
    \ around just the chapters you \n\nneed. We have made chapters relatively self-contained,\
    \ so that you need not \n\nworry about an unexpected and unnecessary dependence\
    \ of one chapter on an- \n\nother. Whereas in an undergraduate course, you might\
    \ use only some sections \n\nfrom a chapter, in a graduate course, you might cover\
    \ the entire chapter. \n\nWe have included 931 exercises and 162 problems. Each\
    \ section ends with exer- \n\ncises, and each chapter ends with problems. The\
    \ exercises are generally short ques- \n\ntions that test basic mastery of the\
    \ material. Some are simple self-check thought \n\nexercises, but many are substantial\
    \ and suitable as assigned homework. The prob- \n\nlems include more elaborate\
    \ case studies which often introduce new material. They \n\noften consist of several\
    \ parts that lead the student through the steps required to ar- \n\nrive at a\
    \ solution. \n\nAs with the third edition of this book, we have made publicly\
    \ available solutions \n\nto some, but by no means all, of the problems and exercises.\
    \ You can ﬁnd these so- \n\nlutions on our website, http://mitpress.mit.edu/algorithms/.\
    \ You will want to check \n\nthis site to see whether it contains the solution\
    \ to an exercise or problem that you \n\nplan to assign. Since the set of solutions\
    \ that we post might grow over time, we \n\nrecommend that you check the site\
    \ each time you teach the course. \n\nWe have starred (?) the sections and exercises\
    \ that are more suitable for graduate \n\nstudents than for undergraduates. A\
    \ starred section is not necessarily more difﬁ- \n\ncult than an unstarred one,\
    \ but it may require an understanding of more advanced \n\nmathematics. Likewise,\
    \ starred exercises may require an advanced background or \n\nmore than average\
    \ creativity."
  merge: -1
  pgno: 15
