  md: "*34 *\n\n*Chapter 2 Getting Started *\n\nUsing ‚\\-notation, give the average-case\
    \ and worst-case running times of linear \n\nsearch. Justify your answers. \n\n\
    ***2.2-4*** \n\nHow can you modify any sorting algorithm to have a good best-case\
    \ running time? \n\n**2.3** **Designing** **algorithms** \n\nYou can choose from\
    \ a wide range of algorithm design techniques. Insertion sort \n\nuses the ***incremental***\
    \ method: for each element AŒic, insert it into its proper place \n\nin the subarray\
    \ AŒ1 W ic, having already sorted the subarray AŒ1 W i  1c. \n\nThis section\
    \ examines another design method, known as “divide-and-conquer,” \n\nwhich we\
    \ explore in more detail in Chapter 4. We’ll use divide-and-conquer to \n\ndesign\
    \ a sorting algorithm whose worst-case running time is much less than that \n\n\
    of insertion sort. One advantage of using an algorithm that follows the divide-and-\
    \ \n\nconquer method is that analyzing its running time is often straightforward,\
    \ using \n\ntechniques that we’ll explore in Chapter 4. \n\n**2.3.1** **The**\
    \ **divide-and-conquer** **method** \n\nMany useful algorithms are ***recursive***\
    \ in structure: to solve a given problem, they \n\n***recurse*** (call themselves)\
    \ one or more times to handle closely related subprob- \n\nlems. These algorithms\
    \ typically follow the ***divide-and-conquer*** method: they \n\nbreak the problem\
    \ into several subproblems that are similar to the original prob- \n\nlem but\
    \ smaller in size, solve the subproblems recursively, and then combine these \n\
    \nsolutions to create a solution to the original problem. \n\nIn the divide-and-conquer\
    \ method, if the problem is small enough—the ***base*** \n\n***case***—you just\
    \ solve it directly without recursing. Otherwise—the ***recursive*** ***case***\
    \ \n\n—you perform three characteristic steps: \n\n**Divide** the problem into\
    \ one or more subproblems that are smaller instances of the \n\nsame problem.\
    \ \n\n**Conquer** the subproblems by solving them recursively. \n\n**Combine**\
    \ the subproblem solutions to form a solution to the original problem. \n\nThe\
    \ ***merge*** ***sort*** algorithm closely follows the divide-and-conquer method.\
    \ In \n\neach step, it sorts a subarray AŒp W rc, starting with the entire array\
    \ AŒ1 W nc and \n\nrecursing down to smaller and smaller subarrays. Here is how\
    \ merge sort operates:"
