    What are algorithms? Why is the study of algorithms worthwhile? What is the role\
    \ \n\nof algorithms relative to other technologies used in computers? This chapter\
    \ will \n\nanswer these questions. \n\n**1.1** **Algorithms** \n\nInformally,\
    \ an ***algorithm*** is any well-deﬁned computational procedure that takes \n\n\
    some value, or set of values, as ***input*** and produces some value, or set of\
    \ values, as \n\n***output*** in a ﬁnite amount of time. An algorithm is thus\
    \ a sequence of computational \n\nsteps that transform the input into the output.\
    \ \n\nYou can also view an algorithm as a tool for solving a well-speciﬁed ***computa-***\
    \ \n\n***tional*** ***problem***. The statement of the problem speciﬁes in general\
    \ terms the desired \n\ninput/output relationship for problem instances, typically\
    \ of arbitrarily large size. \n\nThe algorithm describes a speciﬁc computational\
    \ procedure for achieving that in- \n\nput/output relationship for all problem\
    \ instances. \n\nAs an example, suppose that you need to sort a sequence of numbers\
    \ into mono- \n\ntonically increasing order. This problem arises frequently in\
    \ practice and provides \n\nfertile ground for introducing many standard design\
