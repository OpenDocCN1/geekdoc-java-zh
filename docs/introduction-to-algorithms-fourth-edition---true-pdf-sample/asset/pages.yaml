    \ preceding a in T ⁰^ is the last character in row 4, \n\n*BWT *Œ4c D b, and the\
    \ last ﬁve characters of T ⁰^ are baga$. And so on, until all n \n\ncharacters\
    \ of T ⁰^ have been identiﬁed, from back to front. \n\n***b.*** Given the array\
    \ *BWT *Œ1 W nc, write pseudcode to compute the array *rank*Œ1 W nc in \n\n‚.n/\
    \ time, assuming that the alphabet size is constant. \n\n***c.*** Given the arrays\
    \ *BWT *Œ1 W nc and *rank*Œ1 W nc, write pseudocode to compute T ⁰^ in \n\n‚.n/\
    \ time. \n\n**Chapter** **notes** \n\nThe relation of string matching to the theory\
    \ of ﬁnite automata is discussed by Aho, \n\nHopcroft, and Ullman \\[5\\]. The\
    \ Knuth-Morris-Pratt algorithm \\[267\\] was invented \n\nindependently by Knuth\
    \ and Pratt and by Morris, but they published their work \n\njointly. Matiyasevich\
    \ \\[317\\] earlier discovered a similar algorithm, which applied \n\nonly to\
    \ an alphabet with two characters and was speciﬁed for a Turing machine \n\nwith\
    \ a two-dimensional tape. Reingold, Urban, and Gries \\[377\\] give an alterna-\
    \ \n\ntive treatment of the Knuth-Morris-Pratt algorithm. The Rabin-Karp algorithm\
    \ \n\nwas proposed by Karp and Rabin \\[250\\]. Galil and Seiferas \\[173\\] give\
    \ an interest- \n\ning deterministic linear-time string-matching algorithm that\
    \ uses only O.1/ space \n\nbeyond that required to store the pattern and text.\
    \ \n\nThe sufﬁx-array algorithm in Section 32.5 is by Manber and Myers \\[312\\\
    ], who \n\nﬁrst proposed the notion of sufﬁx arrays. The linear-time algorithm\
    \ to compute the \n\nlongest common preﬁx array presented here is by Kasai et\
    \ al. \\[252\\]. Problem 32-2 \n\nis based on the DC3 algorithm by K¨ arkk¨ ainen,\
    \ Sanders, and Burkhardt \\[245\\]. For \n\na survey of sufﬁx-array algorithms,\
