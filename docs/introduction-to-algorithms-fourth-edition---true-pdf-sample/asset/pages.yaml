  md: "**Introduction** \n\nWhen you design and analyze algorithms, you need to be\
    \ able to describe how they \n\noperate and how to design them. You also need\
    \ some mathematical tools to show \n\nthat your algorithms do the right thing\
    \ and do it efﬁciently. This part will get you \n\nstarted. Later parts of this\
    \ book will build upon this base. \n\nChapter 1 provides an overview of algorithms\
    \ and their place in modern com- \n\nputing systems. This chapter deﬁnes what\
    \ an algorithm is and lists some examples. \n\nIt also makes a case for considering\
    \ algorithms as a technology, alongside tech- \n\nnologies such as fast hardware,\
    \ graphical user interfaces, object-oriented systems, \n\nand networks. \n\nIn\
    \ Chapter 2, we see our ﬁrst algorithms, which solve the problem of sorting \n\
    \na sequence of n numbers. They are written in a pseudocode which, although not\
    \ \n\ndirectly translatable to any conventional programming language, conveys\
    \ the struc- \n\nture of the algorithm clearly enough that you should be able\
    \ to implement it in the \n\nlanguage of your choice. The sorting algorithms we\
    \ examine are insertion sort, \n\nwhich uses an incremental approach, and merge\
    \ sort, which uses a recursive tech- \n\nnique known as “divide-and-conquer.”\
    \ Although the time each requires increases \n\nwith the value of n, the rate\
    \ of increase differs between the two algorithms. We \n\ndetermine these running\
    \ times in Chapter 2, and we develop a useful “asymptotic” \n\nnotation to express\
    \ them. \n\nChapter 3 precisely deﬁnes asymptotic notation. We’ll use asymptotic\
    \ notation \n\nto bound the growth of functions—most often, functions that describe\
    \ the running \n\ntime of algorithms—from above and below. The chapter starts\
    \ by informally deﬁn- \n\ning the most commonly used asymptotic notations and\
    \ giving an example of how to \n\napply them. It then formally deﬁnes ﬁve asymptotic\
    \ notations and presents conven- \n\ntions for how to put them together. The rest\
    \ of Chapter 3 is primarily a presentation \n\nof mathematical notation, more\
    \ to ensure that your use of notation matches that in \n\nthis book than to teach\
    \ you new mathematical concepts."
