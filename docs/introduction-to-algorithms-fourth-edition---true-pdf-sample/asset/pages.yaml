  md: "*12* \n\n*Chapter* *1* *The* *Role* *of* *Algorithms* *in* *Computing* \n\n\
    **1.2** **Algorithms** **as** **a** **technology** \n\nIf computers were inﬁnitely\
    \ fast and computer memory were free, would you have \n\nany reason to study algorithms?\
    \ The answer is yes, if for no other reason than that \n\nyou would still like\
    \ to be certain that your solution method terminates and does so \n\nwith the\
    \ correct answer. \n\nIf computers were inﬁnitely fast, any correct method for\
    \ solving a problem \n\nwould do. You would probably want your implementation\
    \ to be within the bounds \n\nof good software engineering practice (for example,\
    \ your implementation should \n\nbe well designed and documented), but you would\
    \ most often use whichever \n\nmethod was the easiest to implement. \n\nOf course,\
    \ computers may be fast, but they are not inﬁnitely fast. Computing \n\ntime is\
    \ therefore a bounded resource, which makes it precious. Although the saying \n\
    \ngoes, “Time is money,” time is even more valuable than money: you can get back\
    \ \n\nmoney after you spend it, but once time is spent, you can never get it back.\
    \ Memory \n\nmay be inexpensive, but it is neither inﬁnite nor free. You should\
    \ choose algorithms \n\nthat use the resources of time and space efﬁciently. \n\
    \n**Efﬁciency** \n\nDifferent algorithms devised to solve the same problem often\
    \ differ dramatically in \n\ntheir efﬁciency. These differences can be much more\
    \ signiﬁcant than differences \n\ndue to hardware and software. \n\nAs an example,\
    \ Chapter 2 introduces two algorithms for sorting. The ﬁrst, \n\nknown as ***insertion***\
    \ ***sort***, takes time roughly equal to c 1 n ²^ to sort n items, where c 1\
    \ \n\nis a constant that does not depend on n. That is, it takes time roughly\
    \ proportional \n\nto n ²^ . The second, ***merge*** ***sort***, takes time roughly\
    \ equal to c 2 n lg n, where lg n \n\nstands for log 2 n and c 2 is another constant\
    \ that also does not depend on n. Inser- \n\ntion sort typically has a smaller\
    \ constant factor than merge sort, so that c 1 < c 2 . \n\nWe’ll see that the\
    \ constant factors can have far less of an impact on the running \n\ntime than\
    \ the dependence on the input size n. Let’s write insertion sort’s running \n\n\
    time as c 1 n  n and merge sort’s running time as c 2 n  lg n. Then we see that\
    \ where \n\ninsertion sort has a factor of n in its running time, merge sort has\
    \ a factor of lg n, \n\nwhich is much smaller. For example, when n is 1000, lg\
    \ n is approximately 10, and \n\nwhen n is 1,000,000, lg n is approximately only\
    \ 20. Although insertion sort usu- \n\nally runs faster than merge sort for small\
    \ input sizes, once the input size n becomes \n\nlarge enough, merge sort’s advantage\
    \ of lg n versus n more than compensates for \n\nthe difference in constant factors.\
    \ No matter how much smaller c 1 is than c 2 , there \n\nis always a crossover\
    \ point beyond which merge sort is faster."
