  md: "*6* \n\n*Chapter* *1* *The* *Role* *of* *Algorithms* *in* *Computing* \n\n\
    called an ***instance*** of the sorting problem. In general, an ***instance***\
    \ ***of*** ***a*** ***problem*** ¹^ \n\nconsists of the input (satisfying whatever\
    \ constraints are imposed in the problem \n\nstatement) needed to compute a solution\
    \ to the problem. \n\nBecause many programs use it as an intermediate step, sorting\
    \ is a fundamental \n\noperation in computer science. As a result, you have a\
    \ large number of good sort- \n\ning algorithms at your disposal. Which algorithm\
    \ is best for a given application \n\ndepends on—among other factors—the number\
    \ of items to be sorted, the extent \n\nto which the items are already somewhat\
    \ sorted, possible restrictions on the item \n\nvalues, the architecture of the\
    \ computer, and the kind of storage devices to be used: \n\nmain memory, disks,\
    \ or even—archaically—tapes. \n\nAn algorithm for a computational problem is ***correct***\
    \ if, for every problem in- \n\nstance provided as input, it ***halts***—ﬁnishes\
    \ its computing in ﬁnite time—and out- \n\nputs the correct solution to the problem\
    \ instance. A correct algorithm ***solves*** the \n\ngiven computational problem.\
    \ An incorrect algorithm might not halt at all on some \n\ninput instances, or\
    \ it might halt with an incorrect answer. Contrary to what you \n\nmight expect,\
    \ incorrect algorithms can sometimes be useful, if you can control \n\ntheir error\
    \ rate. We’ll see an example of an algorithm with a controllable error rate \n\
    \nin Chapter 31 when we study algorithms for ﬁnding large prime numbers. Ordi-\
    \ \n\nnarily, however, we’ll concern ourselves only with correct algorithms. \n\
    \nAn algorithm can be speciﬁed in English, as a computer program, or even as \n\
    \na hardware design. The only requirement is that the speciﬁcation must provide\
    \ a \n\nprecise description of the computational procedure to be followed. \n\n\
    **What** **kinds** **of** **problems** **are** **solved** **by** **algorithms?**\
    \ \n\nSorting is by no means the only computational problem for which algorithms\
    \ have \n\nbeen developed. (You probably suspected as much when you saw the size\
    \ of this \n\nbook.) Practical applications of algorithms are ubiquitous and include\
    \ the follow- \n\ning examples: \n\n \n\nThe Human Genome Project has made great\
    \ progress toward the goals of iden- \n\ntifying all the roughly 30,000 genes\
    \ in human DNA, determining the sequences \n\nof the roughly 3 billion chemical\
    \ base pairs that make up human DNA, stor- \n\ning this information in databases,\
    \ and developing tools for data analysis. Each \n\nof these steps requires sophisticated\
    \ algorithms. Although the solutions to the \n\nvarious problems involved are\
    \ beyond the scope of this book, many methods to \n\nsolve these biological problems\
    \ use ideas presented here, enabling scientists to \n\naccomplish tasks while\
    \ using resources efﬁciently. Dynamic programming, as \n\n1 Sometimes, when the\
