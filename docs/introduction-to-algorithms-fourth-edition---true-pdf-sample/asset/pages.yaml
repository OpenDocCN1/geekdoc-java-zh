  md: "*26 *\n\n*Chapter 2 Getting Started *\n\nyou can identify the most efﬁcient\
    \ one. There might be more than just one viable \n\ncandidate, but you can often\
    \ rule out several inferior algorithms in the process. \n\nBefore you can analyze\
    \ an algorithm, you need a model of the technology that \n\nit runs on, including\
    \ the resources of that technology and a way to express their \n\ncosts. Most\
    \ of this book assumes a generic one-processor, ***random-access*** ***ma-***\
    \ \n\n***chine*** ***(RAM)*** model of computation as the implementation technology,\
    \ with the \n\nunderstanding that algorithms are implemented as computer programs.\
    \ In the RAM \n\nmodel, instructions execute one after another, with no concurrent\
    \ operations. The \n\nRAM model assumes that each instruction takes the same amount\
    \ of time as any \n\nother instruction and that each data access—using the value\
    \ of a variable or storing \n\ninto a variable—takes the same amount of time as\
    \ any other data access. In other \n\nwords, in the RAM model each instruction\
    \ or data access takes a constant amount \n\nof time—even indexing into an array.\
    \ ^(9 )\n\nStrictly speaking, we should precisely deﬁne the instructions of the\
    \ RAM model \n\nand their costs. To do so, however, would be tedious and yield\
    \ little insight into al- \n\ngorithm design and analysis. Yet we must be careful\
    \ not to abuse the RAM model. \n\nFor example, what if a RAM had an instruction\
    \ that sorts? Then you could sort \n\nin just one step. Such a RAM would be unrealistic,\
    \ since such instructions do \n\nnot appear in real computers. Our guide, therefore,\
    \ is how real computers are de- \n\nsigned. The RAM model contains instructions\
