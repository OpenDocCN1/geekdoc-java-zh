    \ the universe U D f0; 1; : : : ; m  1g, \n\nwhere m is not too large. \n\nTo\
    \ represent the dynamic set, you can use an array, or ***direct-address*** ***table***,\
    \ de- \n\nnoted by T Œ0 W m  1c, in which each position, or ***slot***, corresponds\
    \ to a key in the \n\nuniverse U . Figure 11.1 illustrates this approach. Slot\
    \ k points to an element in the \n\nset with key k. If the set contains no element\
    \ with key k, then T Œkc D NIL. \n\nThe dictionary operations DIRECT\\-ADDRESS\\\
    -SEARCH, DIRECT\\-ADDRESS\\- \n\nI NSERT, and DIRECT\\-ADDRESS\\-DELETE on the\
    \ following page are trivial to im- \n\nplement. Each takes only O.1/ time. \n\
    \nFor some applications, the direct-address table itself can hold the elements\
    \ in \n\nthe dynamic set. That is, rather than storing an element’s key and satellite\
    \ data in \n\nan object external to the direct-address table, with a pointer from\
    \ a slot in the table \n\nto the object, save space by storing the object directly\
    \ in the slot. To indicate an \n\nempty slot, use a special key. Then again, why\
    \ store the key of the object at all? \n\nThe index of the object *is *its key!\
