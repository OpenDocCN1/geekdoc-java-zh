  md: "*4* \n\n*Part* *I* *Foundations* \n\nChapter 4 delves further into the divide-and-conquer\
    \ method introduced in \n\nChapter 2. It provides two additional examples of divide-and-conquer\
    \ algorithms \n\nfor multiplying square matrices, including Strassen’s surprising\
    \ method. Chapter 4 \n\ncontains methods for solving recurrences, which are useful\
    \ for describing the run- \n\nning times of recursive algorithms. In the substitution\
    \ method, you guess an answer \n\nand prove it correct. Recursion trees provide\
    \ one way to generate a guess. Chap- \n\nter 4 also presents the powerful technique\
    \ of the “master method,” which you can \n\noften use to solve recurrences that\
    \ arise from divide-and-conquer algorithms. Al- \n\nthough the chapter provides\
    \ a proof of a foundational theorem on which the master \n\ntheorem depends, you\
    \ should feel free to employ the master method without delv- \n\ning into the\
    \ proof. Chapter 4 concludes with some advanced topics. \n\nChapter 5 introduces\
    \ probabilistic analysis and randomized algorithms. You \n\ntypically use probabilistic\
    \ analysis to determine the running time of an algorithm \n\nin cases in which,\
    \ due to the presence of an inherent probability distribution, the \n\nrunning\
    \ time may differ on different inputs of the same size. In some cases, you \n\n\
    might assume that the inputs conform to a known probability distribution, so that\
    \ \n\nyou are averaging the running time over all possible inputs. In other cases,\
    \ the \n\nprobability distribution comes not from the inputs but from random choices\
    \ made \n\nduring the course of the algorithm. An algorithm whose behavior is\
    \ determined \n\nnot only by its input but by the values produced by a random-number\
    \ generator is a \n\nrandomized algorithm. You can use randomized algorithms to\
    \ enforce a probability \n\ndistribution on the inputs—thereby ensuring that no\
    \ particular input always causes \n\npoor performance—or even to bound the error\
    \ rate of algorithms that are allowed \n\nto produce incorrect results on a limited\
    \ basis. \n\nAppendices A–D contain other mathematical material that you will\
    \ ﬁnd helpful \n\nas you read this book. You might have seen much of the material\
    \ in the appendix \n\nchapters before having read this book (although the speciﬁc\
    \ deﬁnitions and nota- \n\ntional conventions we use may differ in some cases\
    \ from what you have seen in \n\nthe past), and so you should think of the appendices\
    \ as reference material. On the \n\nother hand, you probably have not already\
    \ seen most of the material in Part I. All \n\nthe chapters in Part I and the\
    \ appendices are written with a tutorial ﬂavor."
