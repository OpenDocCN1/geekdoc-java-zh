    \ algorithms and strate- \n\ngies for scheduling parallel programs. \n\nThe parallel\
    \ pseudocode and programming model were inﬂuenced by Cilk \\[290, \n\n291, 383,\
    \ 396\\]. The open-source project OpenCilk (www.opencilk.org) provides \n\nCilk\
    \ programming as an extension to the C and C++ programming languages. All \n\n\
    of the parallel algorithms in this chapter can be coded straightforwardly in Cilk.\
    \ \n\nConcerns about nondeterministic parallel programs were expressed by Lee\
    \ \\[281\\] \n\nand Bocchino, Adve, Adve, and Snir \\[64\\]. The algorithms literature\
    \ contains many \n\nalgorithmic strategies (see, for example, \\[60, 85, 118,\
    \ 140, 160, 282, 283, 412, \n\n461\\]) for detecting races and extending the fork-join\
    \ model to avoid or safely em- \n\nbrace various kinds of nondeterminism. Blelloch,\
    \ Fineman, Gibbons, and Shun \n\n\\[59\\] showed that deterministic parallel algorithms\
    \ can often be as fast as, or even \n\nfaster than, their nondeterministic counterparts.\
