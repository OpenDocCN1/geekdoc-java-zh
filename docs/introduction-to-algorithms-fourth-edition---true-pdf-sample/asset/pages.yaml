  md: "Preface \n\nNot so long ago, anyone who had heard the word “algorithm” was\
    \ almost certainly \n\na computer scientist or mathematician. With computers having\
    \ become prevalent in \n\nour modern lives, however, the term is no longer esoteric.\
    \ If you look around your \n\nhome, you’ll ﬁnd algorithms running in the most\
    \ mundane places: your microwave \n\noven, your washing machine, and, of course,\
    \ your computer. You ask algorithms \n\nto make recommendations to you: what music\
    \ you might like or what route to \n\ntake when driving. Our society, for better\
    \ or for worse, asks algorithms to suggest \n\nsentences for convicted criminals.\
    \ You even rely on algorithms to keep you alive, \n\nor at least not to kill you:\
    \ the control systems in your car or in medical equipment. ¹^ \n\nThe word “algorithm”\
    \ appears somewhere in the news seemingly every day. \n\nTherefore, it behooves\
    \ you to understand algorithms not just as a student or \n\npractitioner of computer\
    \ science, but as a citizen of the world. Once you understand \n\nalgorithms,\
    \ you can educate others about what algorithms are, how they operate, \n\nand\
    \ what their limitations are. \n\nThis book provides a comprehensive introduction\
    \ to the modern study of com- \n\nputer algorithms. It presents many algorithms\
    \ and covers them in considerable \n\ndepth, yet makes their design accessible\
    \ to all levels of readers. All the analyses \n\nare laid out, some simple, some\
    \ more involved. We have tried to keep explanations \n\nclear without sacriﬁcing\
    \ depth of coverage or mathematical rigor. \n\nEach chapter presents an algorithm,\
    \ a design technique, an application area, or a \n\nrelated topic. Algorithms\
    \ are described in English and in a pseudocode designed to \n\nbe readable by\
    \ anyone who has done a little programming. The book contains 231 \n\nﬁgures—many\
    \ with multiple parts—illustrating how the algorithms work. Since \n\nwe emphasize\
    \ *efﬁciency* as a design criterion, we include careful analyses of the \n\nrunning\
    \ times of the algorithms. \n\n1 To understand many of the ways in which algorithms\
    \ inﬂuence our daily lives, see the book by \n\nFry \\[162\\]."
  merge: -1
  pgno: 14
