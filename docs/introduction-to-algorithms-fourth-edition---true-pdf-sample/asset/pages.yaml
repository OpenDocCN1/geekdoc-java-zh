  md: "*27.2* *Maintaining* *a* *search* *list* \n\n*795 *\n\n**Exercises** \n\n***27.1-1***\
    \ \n\nSuppose that when hedging your bets, you wait for p minutes, instead of\
    \ for k \n\nminutes, before taking the stairs. What is the competitive ratio as\
    \ a function of p \n\nand k? How should you choose p to minimize the competitive\
    \ ratio? \n\n***27.1-2*** \n\nImagine that you decide to take up downhill skiing.\
    \ Suppose that a pair of skis \n\ncosts r dollars to rent for a day and b dollars\
    \ to buy, where b > r . If you knew in \n\nadvance how many days you would ever\
    \ ski, your decision whether to rent or buy \n\nwould be easy. If you’ll ski for\
    \ at least db=r e days, then you should buy skis, and \n\notherwise you should\
    \ rent. This strategy minimizes the total that you ever spend. \n\nIn reality,\
    \ you don’t know in advance how many days you’ll eventually ski. Even \n\nafter\
    \ you have skied several times, you still don’t know how many more times \n\n\
    you’ll ever ski. Yet you don’t want to waste your money. Give and analyze an \n\
    \nalgorithm that has a competitive ratio of 2, that is, an algorithm guaranteeing\
    \ that, \n\nno matter how many times you ski, you never spend more than twice\
    \ what you \n\nwould have spent if you knew from the outset how many times you’ll\
    \ ski. \n\n***27.1-3*** \n\nIn “concentration solitaire,” a game for one person,\
    \ you have n pairs of matching \n\ncards. The backs of the cards are all the same,\
    \ but the fronts contain pictures of \n\nanimals. One pair has pictures of aardvarks,\
    \ one pair has pictures of bears, one pair \n\nhas pictures of camels, and so\
    \ on. At the start of the game, the cards are all placed \n\nface down. In each\
    \ round, you can turn two cards face up to reveal their pictures. If \n\nthe pictures\
    \ match, then you remove that pair from the game. If they don’t match, \n\nthen\
    \ you turn both of them over, hiding their pictures once again. The game ends\
    \ \n\nwhen you have removed all n pairs, and your score is how many rounds you\
    \ needed \n\nto do so. Suppose that you can remember the picture on every card\
    \ that you have \n\nseen. Give an algorithm to play concentration solitaire that\
    \ has a competitive ratio \n\nof 2. \n\n**27.2** **Maintaining** **a** **search**\
    \ **list** \n\nThe next example of an online algorithm pertains to maintaining\
    \ the order of ele- \n\nments in a linked list, as in Section 10.2. This problem\
    \ often arises in practice for \n\nhash tables when collisions are resolved by\
    \ chaining (see Section 11.2), since each \n\nslot contains a linked list. Reordering\
    \ the linked list of elements in each slot of the \n\nhash table can boost the\
    \ performance of searches measurably."
