    ## 第5章 概率分析与随机算法


    我们可以尝试使用每个 $Pr(L_j)$ 的上界来评估这个和，类似于在不等式 (5.10) 中计算的那样。遗憾的是，这种方法得到的界较松散。然而，我们可以利用上述分析获得的直觉来获得一个良好的界。在方程
    (5.11) 的求和，没有任何一项的因子 $j$ 和 $Pr(L_j)$ 同时是大的。为什么呢？当 $j \ge 2^{\lg n} e$ 时，$Pr(L_j)$
    非常小；而当 $j < 2^{\lg n} e$ 时，$j$ 较小。更准确地说，由于对于 $j = 0; 1; ...; n$ 的事件 $L_j$ 是互斥的，长度至少为
    $2^{\lg n} e$ 的连续正出现在任何地方的概率为 $\sum_{j=2^{\lg n} e}^n (Pr(L_j))^j$。（不等式 (5.10))


    告诉我们长度至少为 $2^{\lg n} e$ 的连续正出现在任何地方的概率小于 $1/n$，这意味着 $\sum_{j=2^{\lg n} e}^n (Pr(L_j))^j
    (< 1/n)$。（同时，注意到 $\sum_{j=0}^\infty (Pr(L_j))^j = 1$），我们得到 $(2^{\lg n} e)^{-1}
    \sum_{j=0}^\infty Pr(L_j) \ge 1$。因此，我们得到：


    $E(L_c) = \sum_{j=0}^n j Pr(L_j)$

    $= \sum_{j=0}^{2^{\lg n} e} j Pr(L_j) + \sum_{j=2^{\lg n} e}^n j Pr(L_j)$

    < 2^{\lg n} e^{-1} \sum_{j=0}^{2^{\lg n} e} Pr(L_j) + \sum_{j=2^{\lg n} e}^n n
    Pr(L_j)$

    $= 2^{\lg n} e (2^{\lg n} e)^{-1} \sum_{j=0}^\infty Pr(L_j) + n \sum_{j=2^{\lg
    n} e}^n Pr(L_j)$

    < 2^{\lg n} e (1 + n)^{1/n}$

    $= O(\lg n) :$


    连续正超过 $r^{\lg n} e$ 次的概率随 $r$ 的增加而迅速减小。让我们对于 $r \ge 1$，出现至少 $r^{\lg n} e$ 次连续正的概率得到一个粗略的界。至少
    $r^{\lg n} e$ 次连续正从位置 $i$ 开始概率为：


    $Pr(A_i; r^{\lg n} e) = (1/2)^{r^{\lg n} e}$


    至少 $r^{\lg n} e$ 次连续正不能出现在最后 $n - r^{\lg n} e + 1$ 次抛掷中，但让我们通过允许它出现在 $n$ 次硬币抛掷的任何地方来高估这种连续正的概率。那么至少
    $r^{\lg n} e$ 次连续正出现的概率


