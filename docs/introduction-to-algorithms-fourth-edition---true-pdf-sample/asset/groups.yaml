    ## 第 2 章 入门


    使用 $\Theta$ 符号给出线性搜索的平均情况和最坏情况的运行时间。并给出你的证明理由。


    ***2.2-4*** 你可以如何修改任何排序算法使其具有良好的最佳情况运行时间？


    ## 2.3 算法设计


    你可以选择多种算法设计技术。插入排序使用了***增量式***（incremental）方法：对于每个元素 $A[i]$，将其插入子数组 $A[1 \dots
    i]$ 中的正确位置，而此时子数组 $A[1 \dots i-1]$ 已经是有序的。


    本节将介绍另一种设计方法，被称为“分治法”，我们将在第 4 章中对其进行更详细的探讨。我们将使用分治法设计一种排序算法，其最坏情况的运行时间远小于插入排序。使用遵循分治法的算法的一个优点是，分析其运行时间通常非常直观，可以使用我们即将在第
    4 章中探索的技巧。


    ### 2.3.1 分治法


    许多有算法在结构上是***递归的***（recursive）：为了解决一个给定的问题，它们会***递归***（调用自身）一次或多次来处理紧密相关的子问题。这些算法通常遵循***分治法***：它们将问题分解为若干与原问题相似但规模更小的子问题，递归地解决这些子问题，然后将这些解决方案组合以创建原问题的解决方案。


    在分治法中，如果问题足够小——即***基础情况***（base case）——你只需要直接解决它而无需递归。否则——***递归情况***（recursive
    case）——你执行以下三个具有特征的步骤：


    - **划分**（Divide）将问题分解为一个或多个相同问题的更小实例子问题。

    - **解决**（Conquer）通过递归解决这些子问题。

    - **合并**（Combine）将子问题的解决方案组合形成原问题的解决方案。


    ***归并排序***算法密切遵循分治法。在每一步中，它都对子数组 $A[p \dots r]$ 进行排序，从整个数组 $A[1 \dots n]$ 开始并递归到越来越小的子数组。以下是归并排序的操作过程：


    - **划分**将待排序的子数组 $A[p \dots r]$ 分为两个相邻的、大小各占一半的子数组。为此计算 $A[p \dots r]$ 的中点 $q$（取
    $p$ 和 $r$ 的平均值），并将 $A[p \dots r]$ 分为子数组 $A[p \dots q]$ 和 $A[q+1 \dots r]$。

    - **解决**通过使用归并排序递归地解决两个子数组 $A[p \dots q]$ 和 $A[q+1 \dots r]$。

    - **合并**通过将两个已排序的子数组 $A[p \dots q]$ 和 $A[q+1 \dots r]$ 合并回 $A[p \dots r]，产生排序后的答案。


    当待排序的子数组 $A[p \dots r]$ 仅包含 1 个元素时（即 $p$ 等于 $r$），递归就会“到底”——它达到了基础情况。正如我们在插入排序循环不变式的初始化参数中所注的，包含单个元素的子数组始终是有序的。


    归并排序算法的关键操作发生在“合并”步骤，该步骤合并两个相邻的已排序的子数组。合并操作通过下一页上的辅助过程 $MERGE(A, p, q, r)$ 执行，其中
    $A$ 是一个数组，$p, q, r$ 是数组的索引，使得 $p \le q \le r$。该过程假设相邻的子数组 $A[p \dots q]$ 和 $A[q+1
    \dots r]$ 已经过递归排序。它***合并***这两个已排序的子数组形成一个单一的排序子数组，替换当前的子数组 $A[p \dots r]$。


    为了理解 MERGE 过程如何工作，让我们回到玩牌的类比。假设桌子上有两堆正朝上的牌。每堆牌都是有序的，值最小的牌在最上方。你想将这两堆牌合并为一堆排序后的输出堆，输出堆将面朝放在桌子上。基本步骤是选择两个正朝堆顶部牌中较小的一张，将其从它所在的堆中取出——这会露出一张新的顶端牌——并将这张牌面朝放在输出堆上。重复这一步骤，直到其中一个输入堆为空，此时你只需要取出剩下的输入堆并翻转整堆牌，将其面朝放在输出堆上。


    让我们思考合并两堆有序纸牌需要多长时间。每个基本步骤花费常数时间，因为你只需要比较两张顶端牌。如果你开始时的两堆排序牌每堆都有 $n=2$ 张牌，那么基本步骤的数量至少是
    $n/2$（因为在任意一堆为空时，每张牌都被发现比另一堆的某张牌小），且最多为 $n$（实际上最多为 $n-1$，因为在执行 $n-1$ 个基本步骤后，其中一堆必须为空）。由于每个基本步骤花费常数时间，且基本步骤总数在
    $n/2$ 到 $n$ 之间，我们可以说合并所需的时间大约与 $n$ 成比例。也就是说，合并需要 $\Theta(n)$ 时间。


    详细而言，MERGE 过程的工作如下。它将两个子数组 $A[p \dots q]$ 和 $A[q+1 \dots r]$ 复制到临时数组 $L$ 和 $R$（“左”和“右”），然后将
    $L$ 和 $R$ 中的值合并回 $A[p \dots r]$。第 1 和 2 行计算子数组 $A[p \dots q]$ 和 $A[q+1 \dots r]$
    的对应长度 $n_L$ 和 $n_R$。


    ```text

    MERGE(A, p, q, r)

    1  nL = q - p + 1              // A[p..q] 的长度

    2  nR = r - q                  // A[q+1..r] 的长度

    3  设 L[0..nL-1] 和 R[0..nR-1] 为新数组

    4  for i = 0 to nL-1          // 将 A[p..q] 复制到 L[0..nL-1]

    5    L[i] = A[p+i]

    6  for j = 0 to nR-1          // 将 A[q+1..r] 复制到 R[0..nR-1]

    7    R[j] = A[q+1+j]

    8  i = 0                       // i 是 L 中元素的索引

    9  j = 0                       // j 是 R 中元素的索引

    10 k = p                      // k 是 A 中的索引

    11 while i < nL and j < nR     // 只要 L 和 R 都包含未合并的元素，

    12   将最小的未合并元素合并回 A[p..r]。

    13   if L[i] <= R[j]

    14     A[k] = L[i]

    15     i = i + 1

    16   else

    17     A[k] = R[j]

    18     j = j + 1

    19   k = k + 1

    20 // 处理完 L 和 R 中的某一个后，将另一个的

    21 // 部分复制到 A[p..r] 的末尾。

    22 while i < nL

    23   A[k] = L[i]

    24   i = i + 1

    25   k = k + 1

    26 while j < nR

    27   A[k] = R[j]

    28   j = j + 1

    29   k = k + 1

    ```


    第 3 行创建 $L[0 \dots n_L-1]$ 和 $R[0 \dots n_R-1]$，其长度分别为 $n_L$ 和 $n_R$。第 4 到 5 行的循环将
    $A[p \dots q]$ 复制到 $L$，第 6 到 7 行的循环将 $A[q+1 \dots r]$ 复制到 $R$。第 8 到 18 行（如图 2.3
    所示）执行基本步骤。第 12 到 18 行的循环反复识别 L 和 R 中尚未合并的最小值。该过程是罕见的同时使用 1 索引（针对数组 $A$）和 0 索引（针对数组
    $L$ 和 $R$）的情况。对 $L$ 和 $R$ 使用 0 索引可以使不变式更简单。


    练习 2.3-3。


