    ## 1 算法在计算中的作用


    什么是算法？为什么研究算法是有价值的？算法相对于计算机使用的其他技术处于什么地位？本章将回答这些问题。


    ### 1.1 算法


    从非正式的角度来说，***算法***是任何一种定义良好的计算过程，它接受某些值或一组值作为***输入***，并在有限时间内产生某些值或一组值作为***输出***。因此，算法是一系列将输入转换为输出的计算步骤。


    你也可以将算法视为解决一个定义明确的***计算问题***的工具。题目的陈述通常用通用术语规定了问题实例所需的输入/输出关系，这些实例的大小通常是任意的。算法则描述了一种特定的计算过程，用于为所有问题实例实现该输入/输出关系。


    作为一个例子，假设你需要将一个数字序列按单调递增顺序进行排序。这个问题在实践中频繁出现，并为引入许多标准设计技术和分析工具提供了肥沃土壤。以下是我们对***排序问题***的形式定义：


    **输入：** 一个包含 $n$ 个数字的序列 $\langle a_1; a_2; \dots; a_n \rangle$。


    **输出：** 一个排列（重排序）$\langle a^{(1)}; a^{(2)}; \dots; a^{(n)} \rangle$（输入序列），使得 $a^{(1)}
    \le a^{(2)} \le \dots \le a^{(n)}$。


    因此，给定输入序列 $\langle 31; 41; 59; 26; 41; 58 \rangle$，正确的排序算法返回输出序列 $\langle 26;
    31; 41; 41; 58; 59 \rangle$。这样的输入序列被称为排序问题的***实例***。通常情况下，***问题的实例***¹（本身直接称为“问题”）由计算问题解决方案所需的输入（满足问题陈述中施加的任何约束）组成。


    由于许多程序将排序作为中间步骤，排序是计算机科学中的一项基础操作。因此，你有大量的优秀排序算法可用。对于特定的应用，哪种算法最好取决于（其他因素之外）待排序项目的数量、项目已经部分排序的程度、对项目值的可能限制、计算机架构以及使用的存储设备类型：主内存、磁盘，甚至是过时的磁带。


    如果对于每一个作为输入的问题实例，一个计算问题的算法都能***停止***——在有限时间内完成计算——并输出该实例的正确解决方案，那么该算法就是***正确的***。正确的算法***解决了***给定的计算问题。一个不正确的算法在某些输入实例上可能完全不停止，或者可能带有错误的答案停止。与你预想的相反，如果你能控制它们的错误率，错误的算法有时是有用的。我们将在第
    31 章研究寻找大质数的算法时，看到一个具有可控错误率的算法示例。但通常，我们只关注正确的算法。


    算法可以用英文指定，可以用计算机程序指定，甚至可以作为硬件设计指定。唯一的要求是规范说明必须对要遵循的计算过程提供精确描述。


    **算法解决了哪些类型的问题？**


    排序绝不是已开发算法的唯一计算问题。（当你看到这本书的厚度时，你可能已经怀疑了。）算法的实际应用无处不在，包括以下示例：


    - 人类基因组计划在以下目标方面取得了巨大进展：识别人类 DNA 中约 30,000 个基因、确定组成人类 DNA 的约 30 亿个化学碱基对的序列、将这些信息存储在数据库中以及开发数据分析工具。这些每一步都需要复杂的算法。虽然涉及的各种问题的解决方案超出了本书的范围，但许多解决这些生物学问题的方法使用了这里介绍的思想，使科学家能够在高效利用资源的同时完成任务。如第
    14 章所示，动态规划是解决这些生物学问题的重要技术，特别是那些涉及确定 DNA 序列之间相似性的问题。节省体现在人类和机器的时间以及金钱上，因为通过实验室技术可以提取更多信息。


    - 互联网让各地的人能够快速访问和检索大量信息。在巧妙算法的帮助下，互联网网站能够管理和处理海量数据。必须使用算法的问题示例包括寻找数据传输的良好路径（解决此类问题的技术出现在第
    22 章），以及使用搜索引擎快速查找存有特定信息的页面（相关技术在第 11 章和第 32 章）。


    - 电子商务使得商品和服务能够电子方式进行谈判和交换，它依赖于个人信息（如信用卡号、密码和银行对单）的隐私性。电子商务使用的核心技术包括公钥加密和数字签名（在第
    31 章涵盖），这些基于数值算法和数论。


    - 制造业和其他商业企业经常需要以最有利的方式分配稀缺资源。石油公司可能希望知道在哪里分配资源以实现利润最大化。航空公司可能希望分配航班以实现成本最小。互联网服务提供商可能希望分配资源以实现效率最大化。所有这些都是可以高效解决的问题，第
    29 章展示了这一点。


    - 给定一张地图，你希望找到两个交叉路口之间的最短路径。即使地图很小，可能的路径数量也可能是巨大的。这个问题是最短路径的实例，第 22 章展示了如何高效解决它。


    - 给定一组代表规则时间间隔采样的信号的数值值，离散傅里叶变换将其转换为频率域，以识别主频。该问题是拓扑排序的实例，第 20 章展示了如何高效解决它。


    - 医生需要判断一张图像代表的是恶性肿瘤还是良性肿瘤。医生拥有许多肿瘤图像，其中一些已知是恶性的，另一些已知是良性的。恶性肿瘤可能与其他恶性肿瘤比与良性肿瘤更相似。通过使用聚类算法（如第
    33 章所示），医生可以识别哪种结果更有可能。


    - 你需要压缩一个包含文本的大文件以减少其占据的空间。已知许多此类方法，包括寻找重复字符序列的“LZW 压缩”。第 15 章研究了另一种方法，“哈夫曼编码”，它用不同长度的位序列对字符进行编码，出现频率越高的字符使用的位序列越短。


    '
