    *xvi*


    *Preface*


    indexing arrays from 1 a minor stumbling block. You can always either subtract
    1 from our indices or just overallocate the array and leave position 0 unused.


    We understand that if you are using this book outside of a course, then you might
    be unable to check your solutions to problems and exercises against solutions
    provided by an instructor. Our website, http://mitpress.mit.edu/algorithms/, links
    to solutions for some of the problems and exercises so that you can check your
    work. Please do not send your solutions to us.


    **To our colleagues**


    We have supplied an extensive bibliography and pointers to the current literature.
    Each chapter ends with a set of chapter notes that give historical details and
    references. The chapter notes do not provide a complete reference to the whole
    field of algorithms, however. Though it may be hard to believe for a book of this
    size, space constraints prevented us from including many interesting algorithms.


    Despite myriad requests from students for solutions to problems and exercises,
    we have adopted the policy of not citing references for them, removing the temptation
    for students to look up a solution rather than to discover it themselves.


    **Changes for the fourth edition**


    As we said about the changes for the second and third editions, depending on how
    you look at it, the book changed either not much or quite a bit. A quick look
    at the table of contents shows that most of the third-edition chapters and sections
    appear in the fourth edition. We removed three chapters and several sections,
    but we have added three new chapters and several new sections apart from these
    new chapters.


    We kept the hybrid organization from the first three editions. Rather than organizing
    chapters only by problem domains or only according to techniques, this book incorporates
    elements of both. It contains technique-based chapters on divide-and-conquer,
    dynamic programming, greedy algorithms, amortized analysis, augmenting data structures,
    NP-completeness, and approximation algorithms. But it also has entire parts on
    sorting, on data structures for dynamic sets, and on algorithms for graph problems.
    We find that although you need to know how to apply techniques for designing and
    analyzing algorithms, problems seldom announce to you which techniques are most
    amenable to solving them.


    Some of the changes in the fourth edition apply generally across the book, and
    some are specific to particular chapters or sections. Here is a summary of the
    most significant general changes:


    - We added 140 new exercises and 22 new problems. We also improved many of the
    old exercises and problems, often as the result of reader feedback. (Thanks to
    all readers who made suggestions.)


    *xvii*


    *Preface*


    - We have color! With designers from the MIT Press, we selected a limited palette,
    devised to convey information and to be pleasing to the eye. (We are delighted
    to display red-black trees in—get this—red and black!) To enhance readability,
    defined terms, pseudocode comments, and page numbers in the index are in color.


    - Pseudocode procedures appear on a tan background to make them easier to spot,
    and they do not necessarily appear on the page of their first reference. When
    they don’t, the text directs you to the relevant page. In the same vein, nonlocal
    references to numbered equations, theorems, lemmas, and corollaries include the
    page number.


    - We removed topics that were rarely taught. We dropped in their entirety the
    chapters on Fibonacci heaps, van Emde Boas trees, and computational geometry.
    In addition, the following material was excised: the maximum-subarray problem,
    implementing pointers and objects, perfect hashing, randomly built binary search
    trees, matroids, push-relabel algorithms for maximum flow, the iterative fast
    Fourier transform method, the details of the simplex algorithm for linear programming,
    and integer factorization. You can find all the removed material on our website,
    http://mitpress.mit.edu/algorithms/.


    - We reviewed the entire book and rewrote sentences, paragraphs, and sections
    to make the writing clearer, more personal, and gender neutral. For example, the
    “traveling-salesman problem” in the previous editions is now called the “traveling-salesperson
    problem.” We believe that it is critically important for engineering and science,
    including our own field of computer science, to be welcoming to everyone. (The
    one place that stumped us is in Chapter 13, which requires a term for a parent’s
    sibling. Because the English language has no such gender-neutral term, we regretfully
    stuck with “uncle.”)


    - The chapter notes, bibliography, and index were updated, reflecting the dramatic
    growth of the field of algorithms since the third edition.


    - We corrected errors, posting most corrections on our website of third-edition
    errata. Those that were reported while we were in full swing preparing this edition
    were not posted, but were corrected in this edition. (Thanks again to all readers
    who helped us identify issues.)


    The specific changes for the fourth edition include the following:


    - We renamed Chapter 3 and added a section giving an overview of asymptotic notation
    before delving into the formal definitions.


    - Chapter 4 underwent substantial changes to improve its mathematical foundation
    and make it more robust and intuitive. The notion of an algorithmic recurrence
    was introduced, and the topic of ignoring floors and ceilings in recurrences was
    addressed more rigorously. The second case of the master theorem incorporates
    polylogarithmic factors, and a rigorous proof of a “continuous” version of the
    master theorem is now provided. We also present the powerful and general Akra-Bazzi
    method (without proof).


    - The deterministic order-statistic algorithm in Chapter 9 is slightly different,
    and the analyses of both the randomized and deterministic order-statistic algorithms
    have been revamped.


    - In addition to stacks and queues, Section 10.1 discusses ways to store arrays
    and matrices.


    - Chapter 11 on hash tables includes a modern treatment of hash functions. It
    also emphasizes linear probing as an efficient method for resolving collisions
    when the underlying hardware implements caching to favor local searches.


    - To replace the sections on matroids in Chapter 15, we converted a problem in
    the third edition about offline caching into a full section.


    - Section 16.4 now contains a more intuitive explanation of the potential functions
    to analyze table doubling and halving.


    - Chapter 17 on augmenting data structures was relocated from Part III to Part
    V, reflecting our view that this technique goes beyond basic material.


    - Chapter 25 is a new chapter about matchings in bipartite graphs. It presents
    algorithms to find a matching of maximum cardinality, to solve the stable marriage
    problem, and to find a maximum-weight matching (known as the “assignment problem”).


    - Chapter 26, on task-parallel computing, has been updated with modern terminology,
    including the name of the chapter.


    - Chapter 27, which covers online algorithms, is another new chapter. In an online
    algorithm, the input arrives over time, rather than being available in its entirety
    at the start of the algorithm. The chapter describes several examples of online
    algorithms, including determining how long to wait for an elevator before taking
    the stairs, maintaining a linked list via the move-to-front heuristic, and evaluating
    replacement policies for caches.


    - In Chapter 29, we removed the detailed presentation of the simplex algorithm,
    as it was math heavy without really conveying many algorithmic ideas. The chapter
    now focuses on the key aspect of how to model problems as linear programs, along
    with the essential duality property of linear programming.


    - Section 32.5 adds to the chapter on string matching the simple, yet powerful,
    structure of suffix arrays.


    *xviii*


    *Preface*

