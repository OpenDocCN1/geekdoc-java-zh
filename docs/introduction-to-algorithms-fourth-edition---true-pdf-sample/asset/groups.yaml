    ## Chapter 2 Getting Started


    first have to implement it in a real programming language, since you cannot run
    our pseudocode directly. What would such a timing test tell you? You would find
    out how long insertion sort takes to run on your particular computer, on that
    particular input, under the particular implementation that you created, with the
    particular compiler or interpreter that you ran, with the particular libraries
    that you linked in, and with the particular background tasks that were running
    on your computer concurrently with your timing test (such as checking for incoming
    information over a network). If you run insertion sort again on your computer
    with the same input, you might even get a different timing result. From running
    just one implementation of insertion sort on just one computer and on just one
    input, what would you be able to determine about insertion sort’s running time
    if you were to give it a different input, if you were to run it on a different
    computer, or if you were to implement it in a different programming language?
    Not much. We need a way to predict, given a new input, how long insertion sort
    will take.


    Instead of timing a run, or even several runs, of insertion sort, we can determine
    how long it takes by analyzing the algorithm itself. We’ll examine how many times
    it executes each line of pseudocode and how long each line of pseudocode takes
    to run. We’ll first come up with a precise but complicated formula for the running
    time. Then, we’ll distill the important part of the formula using a convenient
    notation that can help us compare the running times of different algorithms for
    the same problem.


    How do we analyze insertion sort? First, let’s acknowledge that the running time
    depends on the input. You shouldn’t be terribly surprised that sorting a thousand
    numbers takes longer than sorting three numbers. Moreover, insertion sort can
    take different amounts of time to sort two input arrays of the same size, depending
    on how nearly sorted they already are. Even though the running time can depend
    on many features of the input, we’ll focus on the one that has been shown to have
    the greatest effect, namely the size of the input, and describe the running time
    of a program as a function of the size of its input. To do so, we need to define
    the terms “running time” and “input size” more carefully. We also need to be clear
    about whether we are discussing the running time for an input that elicits the
    worst-case behavior, the best-case behavior, or some other case.


    The best notion for *input size* depends on the problem being studied. For many
    problems, such as sorting or computing discrete Fourier transforms, the most natural
    measure is the *number of items in the input*—for example, the number n of items
    being sorted. For many other problems, such as multiplying two integers, the best
    measure of input size is the *total number of bits* needed to represent the input
    in ordinary binary notation. Sometimes it is more appropriate to describe the
    size of the input with more than just one number. For example, if the input to
    an algorithm is a graph, we usually characterize the input size by both the number
    of vertices and the number of edges in the graph. We’ll indicate which input size
    measure is being used with each problem we study.


    ### 2.2 Analyzing algorithms


    The *running time* of an algorithm on a particular input is the number of instructions
    and data accesses executed. How we account for these costs should be independent
    of any particular computer, but within the framework of the RAM model. For the
    moment, let us adopt the following view. A constant amount of time is required
    to execute each line of our pseudocode. One line might take more or less time
    than another line, but we’ll assume that each execution of the kth line takes
    $c_k$ time, where $c_k$ is a constant. This viewpoint is in keeping with the RAM
    model, and it also reflects how the pseudocode would be implemented on most actual
    computers.


    Let’s analyze the INSERTION-SORT procedure. As promised, we’ll start by devising
    a precise formula that uses the input size and all the statement costs $c_k$.
    This formula turns out to be messy, however. We’ll then switch to a simpler notation
    that is more concise and easier to use. This simpler notation makes clear how
    to compare the running times of algorithms, especially as the size of the input
    increases.


    To analyze the INSERTION-SORT procedure, let’s view it on the following page with
    the time cost of each statement and the number of times each statement is executed.
    For each $i = 2, 3, \dots; n$, let $t_i$ denote the number of times the **while**
    loop test in line 5 is executed for that value of $i$. When a **for** or **while**
    loop exits in the usual way—because the test in the loop header comes up FALSE—the
    test is executed one time more than the loop body. Because comments are not executable
    statements, assume that they take no time.


    The running time of the algorithm is the sum of running times for each statement
    executed. A statement that takes $c_k$ steps to execute and executes $m$ times
    contributes $c_k m$ to the total running time. We usually denote the running time
    of an algorithm on an input of size $n$ by $T(n)$. To compute $T(n)$, the running
    time of INSERTION-SORT on an input of $n$ values, we sum the products of the cost
    and times. There are some subtleties here. Computational steps that we specify
    in English are often variants of a procedure that requires more than a constant
    amount of time. For example, in RADIX-SORT on page 21, one line “use a stable
    sort to sort array” which, we shall see, takes more than a constant time. Also,
    although a statement calls a subroutine takes only constant time, the subroutine
    itself, once invoked, may take more. That is, we separate the process of *calling*
    the subroutine—passing parameters to it—from the process of *executing* the subroutine.
    This characteristic does not necessarily hold for resource such as memory. A statement
    that references $m$ words of memory and is executed $n$ times does not necessarily
    reference $mn$ distinct words of memory.


    Even for inputs of a given size, an algorithm’s running time may depend on which
    input of that size is given. For example, in INSERTION-SORT, the best case occurs
    when the array is already sorted. In this case, each time line 5 executes, the
    value of $key—the value originally in $A[i]$—is already greater than or equal
    to all values in $A[1..i-1]$, so that the **while** loop of lines 5–7 always exits
    upon the first test in line 5. Therefore, we have that $t_i = 1$ for $i = 2, 3,
    \dots; n$, and the best-case running time is given by


    $T(n) = c_1n + c_2(n-1) + c_4(n-1) + c_5(n-1) + c_8(n-1)$

    $= (c_1 + c_2 + c_4 + c_5 + c_8)n - (c_2 + c_4 + c_5 + c_8)$  (2.1)


    We can express this running time as $an + b$ for constants $a$ and $b$ that depend
    on the statement costs $c_k$ (where $a = c_1 + c_2 + c_4 + c_5 + c_8$ and $b =
    c_2 + c_4 + c_5 + c_8$). The running time is thus a *linear function* of $n$.


    The worst case arises when the array is in reverse sorted order—that is, it starts
    out in decreasing order. The procedure must compare each element $A[i]$ with each
    element in the entire sorted subarray $A[1..i-1]$, and so $t_i = i$ for $i = 2,
    3, \dots; n$. (The procedure finds that $A[j] > key$ every time in line 5, and
    the **while** loop exits only when $j$ reaches 0.) Noting that $\sum_{i=2}^n i
    = \sum_{i=1}^n i - 1 = \frac{n(n+1)}{2} - 1 = \frac{n^2+n-2}{2}$ (by equation
    (A.2) on page 1141)

