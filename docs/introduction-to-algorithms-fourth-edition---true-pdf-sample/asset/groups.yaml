    ## 11.1 直接寻址表


    直接寻址是一种简单的技术，当键空间 $U$ 较小时，其效果良好。假设某个应用程序需要一个动态集合，其中每个元素都有一个来自键空间 $U = \{0; 1;
    \dots; m-1\}$ 的不同键，其中 $m$ 并不大。


    为了表示这个动态集合，你可以使用数组，称为***直接寻址表***（direct-address table），记为 $T[0 \dots m-1]$，其中每个位置（称为***槽***，slot）对应于键空间
    $U$ 中的一个键。图 11.1 展示了这种方法。槽 $k$ 指向集合中键为 $k$ 的元素。如果集合中不包含键为 $k$ 的元素，则 $T[k] = \text{NIL}$。下一页的字典操作
    DIRECT-ADDRESS-SEARCH、DIRECT-ADDRESS-INSERT 和 DIRECT-ADDRESS-DELETE 易于实现。每个操作只需要
    $O(1)$ 时间。


    对于某些应用程序，直接寻址表本身就可以存储动态集合中的元素。也就是说，与其将元素的键和卫星数据存储在直接寻址表外部的对象中（并从表中的槽指向该对象），不如直接将对象存储在槽中以节省空间。使用特殊键来指示空槽。话又回来，为什么还要存储对象的键呢？对象的索引*本身就是*它的键！当然，这时你需要某种方法来判断槽是否为空。


    **图 11.1** 如何通过直接寻址表 $T$ 实现动态集合。键空间 $U = \{0; 1; \dots; 9\}$ 中的每个键对应于表中的一个索引。实际键集合
    $K = \{2; 3; 5; 8\}$ 决定了表中包含指向元素指针的槽。其他槽（蓝色部分）包含 NIL。


    ## 13.1 红黑树的性质


    **图 13.1** 一棵红黑树。红黑树中的每个节点要么是红色要么是黑色，红色节点的子节点都是黑色，且从节点到其后代的每条简单路径包含相同数量的黑色节点。(a)
    每个叶子节点（显示为 NIL）都是黑色的。每个非 NIL 节点标记了其黑高，其中 NIL 的黑高为 0。(b) 相同的红黑树，将每个 NIL 替换为单一哨兵节点
    $T.\text{nil}$（它始终是黑色的），并省略了黑高。根节点的父也是哨兵节点。(c) 相同的红黑树，但省略了叶子和根节点的父。本章其余部分将使用这种绘制风格。


    **图 13.7** RB-DELETE-FIXUP 过程中第 3–22 行的情况。棕色节点具有由 $c$ 和 $c''$ 表示的颜色属性，可以是 RED
    或 BLACK。字母 $\alpha; \beta; \dots$ 表示任意子树。每种情况通过改变某些颜色和/或执行旋转将左侧的配置转换为右侧。$x$ 指向的任何节点都有额外的黑色，要么是双黑要么是红黑。只有情况
    2 会导致循环。(a) 通过交换节点 B 和 D 的颜色并执行左旋转，将情况 1 转换为情况 2、3 或 4。(b) 在情况 2 中，由指针 $x$ 的额外黑色通过将节点
    D 染为红色并设置 $x$ 指向节点 B 沿树向上移动。如果通过情况 1 进入情况 2，则 while 循环终止，因为新节点 $x$ 是红黑的，因此其颜色属性的值
    $c$ 为 RED。(c) 通过交换节点 C 和 D 的颜色并执行右旋转，将情况 3 转换为情况 4。(d) 情况 4 通过改变某些颜色并执行左旋转（不违反红黑树属性）移除
