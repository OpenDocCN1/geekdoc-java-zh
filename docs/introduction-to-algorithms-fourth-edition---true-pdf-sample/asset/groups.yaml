    \nis therefore already sorted. Otherwise, we must have p < r , and MERGE-SORT\
    \ \n\nruns the divide, conquer, and combine steps. The divide step simply computes\
    \ an \n\nindex q that partitions A[p..r] into two adjacent subarrays: A[p..q],\
    \ containing \n\n⌊n/2e elements, and A[q+1..r], containing bn/2c elements. (15)\
    \ The initial call \n\nMERGE-SORT(A, 1, n) sorts the entire array A[1..n]. \n\n\
    Figure 2.4 illustrates the operation of the procedure for n D 8, showing also\
    \ the \n\nsequence of divide and merge steps. The algorithm recursively divides\
    \ the array\n\ndown to 1-element subarrays. The combine steps merge pairs of 1-element\
    \ sub-\n\nrays. (13) If you’re wondering where the “+1” comes from, imagine that\
    \ r D ⌮p + 1. Then subarray A[p..r] consists of two elements, and r D ⌮p + 1 D\
    \ 2. (14) Chapter 3 shows how to formally interpret Θ-notation. (15) The expression\
    \ ⌊xe denotes the least integer greater than or equal to x, and ⌈xc denotes greatest\
    \ integer less than equal to x. These notations are defined in Section 3.3. The\
    \ easiest way to verify that setting q to ⌮r/2c yields subarrays A[p..q] and A[q+1..r]\
    \ of sizes ⌊n/2e and ⌈n/2c, respectively, is to examine the four cases that arise\
    \ depending on each of p and r is odd or even.\n\n### 2.3 Designing algorithms\n\
    \nMERGE-SORT(A, p, r)\nif p ≥ r                   // zero or one element?\n  \
    \  return                  // (39)\nq = ⌮(p+r)/2c           // midpoint of A[p..r]\n\
    MERGE-SORT(A, p, q)        // recursively sort A[p..q]\nMERGE-SORT(A, q+1, r)\
    \      // recursively sort A[q+1..r]\nMERGE(A, p, q, r)          // Merge A[p..q]\
    \ and A[q+1..r] into A[p..r]\n\n### 2.3.2 Analyzing divide-and-conquer algorithms\n\
    \nWhen an algorithm contains a recursive call, you can often describe its running\
    \ time by a **recurrence equation** or **recurrence**, which describes the overall\
    \ time on a problem of size n in terms of running time of the same algorithm on\
    \ smaller inputs. You can then use mathematical tools to solve the recurrence\
    \ and provide bounds on the performance of the algorithm. A recurrence for the\
    \ running time of a divide-conquer algorithm falls out from the three steps of\
    \ basic method. As we did for insertion sort, let T(n) be the worst-case running\
    \ time on a problem of size n. If the problem size is small enough, say n < n₀\
    \ for some constant n₀ > 0, the straightforward solution takes constant time,\
    \ which we write as Θ(1). (16) Suppose that the division of problem yields a subproblems,\
    \ each with size n/b, that is, n/b the size of original. For merge sort, both\
    \ a and b are 2, but we’ll see other divide-and-conquer algorithms in which a\
    \ ≠ b. It takes T(n/b) time to solve one subproblem of size n/b, and so it takes\
    \ aT(n/b) time to solve all of them. If it takes Θ(n) time to divide the problem\
    \ into subproblems and Θ(n) time to combine the solutions to the subproblems into\
    \ the solution to the original problem, we get the recurrence. If you’re wondering\
    \ where Θ(1) comes from, think of it way. When we say that n/100 is Θn², we are\
    \ ignoring the coefficient 1/100 of the factor n². Likewise, when we say that\
    \ a constant c is Θ(1), we are ignoring the coefficient c of the factor 1 (which\
    \ you can also think of as n⁰).\n\nFigure 2.4 illustrates the operation of the\
    \ procedure for n D 8, showing also the sequence of divide and merge steps. The\
    \ algorithm recursively divides the array down to 1-element subarrays. The combine\
    \ steps merge pairs of 1-element subarrays to form sorted subarrays of length\
    \ 2, merges those to form sorted subarrays of length 4, and merges those to form\
    \ final subarray of length 8. If n is not an exact power of 2, then some divide\
    \ steps create subarrays whose lengths differ by 1 (For example, when dividing\
    \ a subarray of length 7, one subarray has length 4 and the other has length 3.)\
    \ Regardless of the lengths of the two subarrays merged, the time to merge a total\
    \ of n items is Θ(n).\n"
