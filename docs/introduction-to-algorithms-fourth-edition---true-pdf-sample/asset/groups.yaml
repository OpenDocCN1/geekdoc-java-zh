    当我们脱离比较排序模型时，排序的 $n \lg n$ 下界就不再适用。计数排序的一个重要属性是它是**稳定**的：具有相同值的元素在输出数组中的顺序与它们在输入数组中的顺序相同。也就是说，它通过以下规则处理元素之间的平局：在输入数组中先先出现的元素，在输出数组中也先出现。通常，只有当被排序的元素携带了卫星数据（satellite
    data）时，稳定性属性才重要。计数排序的稳定性还有另一个原因：排序经常被用作基数排序的子程序。正如我们在下一节看到的，为了使基数排序正确工作，计数排序必须是稳定的。


