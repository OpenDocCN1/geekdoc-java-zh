    ## Chapter 33 Machine-Learning Algorithms


    If Lloyd’s procedure really required $k^n$ iterations, it would be impractical.
    In practice, it sometimes suffices to terminate the procedure when the percentage
    decrease in $f(S, C)$ in the latest iteration falls below a predetermined threshold.
    Because Lloyd’s procedure is guaranteed to find only a locally optimal clustering,
    one approach to finding a good clustering is to run Lloyd’s procedure many times
    with different randomly chosen initial centers, taking the best result.


    The running time of Lloyd’s procedure is proportional to the number $T$ of iterations.
    In one iteration, assigning points to clusters based on the nearest-center rule
    requires $O(dnkn)$ time, and recomputing new centers for each cluster requires
    $O(dn)$ time (because each point is in one cluster). The overall running time
    of the k-means procedure is thus $O(Tdkn)$. Lloyd’s algorithm illustrates an approach
    common to many machine-learning algorithms:


    - First, define a hypothesis space in terms of an appropriate sequence $\theta$
    of parameters, so that each $\theta$ is associated with a specific hypothesis
    $h_\theta$. (For the k-means problem, $\theta$ is a $dk$-dimensional vector, equivalent
    to $C$, containing the $d$-dimensional center of each of the $k$ clusters, and
    $h_\theta$ is the hypothesis that each data point $x$ should be grouped with a
    cluster having a center closest to $x$.)


    - Second, define a measure $f(E, \theta)$ describing how poorly hypothesis $h_\theta$
    fits the given training data $E$. Smaller values of $f(E, \theta)$ are better,
    and a (locally) optimal solution (locally) minimizes $f(E, \theta)$. (For the
    k-means problem, $f(E, \theta)$ is just $f(S, C)$.)


    - Third, given a set of training data $E$, use a suitable optimization procedure
    to find a value of $\theta^*$ that minimizes $f(E, \theta^*)$, at least locally.
    (For the k-means problem, this value of $\theta^*$ is the sequence $C$ of $k$
    center points returned by Lloyd’s algorithm.)


    - Return $\theta^*$ as the answer.


    In this framework, we see that optimization becomes a powerful tool for machine
    learning. Using optimization in this way is flexible. For example, ***regularization***
    terms can be incorporated in the function to be minimized, in order to penalize
    hypotheses that are “too complicated” and that “overfit” the training data. (Regularization
    is a complex topic that isn’t pursued further here.)


    **Examples**


    Figure 33.1 demonstrates Lloyd’s procedure on a set of $n = 49$ cities: 48 U.S.
    state capitals and the District of Columbia. Each city has $d = 2$ dimensions:
    latitude and longitude. The initial clustering in part (a) of the figure has the
    initial cluster centers arbitrarily chosen as the capitals of Arkansas, Kansas,
    Louisiana...


    ## Problems for Appendix D


    For the remainder of this problem, we’ll work over $GF(2)$, and all matrix and
    vector entries will be 0 or 1. Define the ***rank*** of a 0-1 matrix (a matrix
    for which each entry is either 0 or 1) over $GF(2)$ the same as for a regular
    matrix, but with all arithmetic that determines linear independence performed
    over $GF(2)$. We define the ***range*** of an $n \times n$ 0-1 matrix $A$ by


    $R(A) = \{y \mid y = Ax \text{ for some } x \in S^n\}$;


    so that $R(A)$ is the set of numbers in $S^n$ that are produced by multiplying
    each value $x \in S^n$ by $A$.


    ***a.*** If $r$ is the rank of matrix $A$, prove that $|R(A)| = 2^r$. Conclude
    that $A$ defines a permutation on $S^n$ only if $A$ has full rank.


    For a given $n \times n$ matrix $A$ and a given value $y \in R(A)$, we define
    the ***preimage*** of $y$ by


    $P(A, y) = \{x \mid Ax = y\}$;


    so that $P(A, y)$ is the set of values in $S^n$ that map to $y$ when multiplied
    by $A$.


    ***b.*** If $r$ is the rank of $n \times n$ matrix $A$ and $y \in R(A)$, prove
    that $|P(A, y)| = 2^{n-r}$.


    Let $0 < m < n$, and suppose that we partition the set $S^n$ into blocks of consecutive
    numbers, where the $i$th block consists of the $2^m$ numbers $i2^m; i2^m+1; ...;
    (i+1)2^m-1$. For any subset $S \subseteq S^n$, define $B(S, m)$ to be the set
    of size-$2^m$ blocks of $S^n$ containing some element of $S$. As example, when
    $n=3, m=1$, and $S=\{1, 4, 5\}$, then $B(S, m)$ consists of blocks 0 (since 1
    is in 0th block) and 2 (since both 4 and 5 belong to block 2).


    ***c.*** Let $r$ be the rank of the lower left $n-m \times m$ submatrix of $A$,
    that is, matrix formed by taking the intersection of the bottom $n-m$ rows and
    leftmost $m$ columns of $A$. Let $S$ be any size-$2^m$ block of $S^n$, and let
    $S^0 = \{y \mid y = Ax \text{ for some } x \in S\}$. Prove that $|B(S^0, m)| =
    2^r$ and for each block in $B(S^0, m)$, exactly $2^{m-r}$ numbers in $S$ map to
    that block.


    Because multiplying the zero vector by any matrix yields a zero vector, the set
    of permutations of $S^n$ defined by multiplying by $n \times n$ 0-1 matrices with
    full rank over $GF(2)$ cannot include all permutations of $S^n$. Let’s extend
    the class of permutations defined by matrix-vector multiplication to include an
    additive term, so that $x \in S^n$ maps to $Ax+c$, where $c$ is $n$-bit vector
    and addition is performed over $GF(2)$. For example, when $A=\begin{pmatrix} 1
    & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1 \end{pmatrix}$ and $c = \begin{pmatrix} 0 \\
    1 \\ 0 \end{pmatrix}$, we get the following permutation: $A;c(0)=2, A;c(1)=1,
    A;c(2)=0, A;c(3)=3$. We call any permutation that maps $x \in S^n$ to $Ax+c$,
    for some $n \times n$ 0-1 matrix $A$ with full rank and some $n$-bit vector $c$,
    a ***linear permutation***.


    ***d.*** Use a counting argument to show that the number of linear permutations
    of $S^n$ is much less than the number of permutations of $S^n$.


    ***e.*** Give an example of a value of $n$ and a permutation of $S^n$ that cannot
    be achieved by any linear permutation. (*Hint: For a given permutation, think
    about how multiplying a matrix by a unit vector relates to columns of the matrix.)


    **Appendix notes**


    Linear-algebra textbooks provide plenty of background information on matrices.
    The books by Strang [422, 423] are particularly good.


    **Bibliography**


    [428] Robert E. Tarjan. A class of algorithms which require nonlinear time to
    maintain disjoint sets. *Journal of Computer and Systems Sciences*, 18(2):110–127,
    1979.


    [429] Robert E. Tarjan. *Data Structures and Algorithms*. Society for Industrial
    and Applied Mathematics, 1983.


    [430] Robert E. Tarjan. Amortized computational complexity. *SIAM Journal on Algebraic
    and Discrete Methods*, 6(2):306–318, 1985.


    [431] Robert E. Tarjan. Class notes: Disjoint set union. COS 423, Princeton University,
    1999. Available at https://www.cs.princeton.edu/courses/archive/spr00/cs423/handout3.pdf.


    [432] Robert E. Tarjan and Jan van Leeuwen. Worst-case analysis of set union algorithms.
    *Journal of the ACM*, 31(2):245–281, 1984.


    [433] George B. Thomas, Jr., Maurice D. Weir, Joel Hass, and Frank R. Giordano.
    *Thomas’ Calculus*. Addison-Wesley, eleventh edition, 2005.


    [434] Mikkel Thorup. Faster deterministic sorting and priority queues in linear
    space. In *Proceedings of the 9th ACM-SIAM Symposium on Discrete Algorithms*,
    pages 550–555, 1998.


    [435] Mikkel Thorup. Undirected single-source shortest paths with positive integer
    weights in linear time. *Journal of the ACM*, 46(3):362–394, 1999.


    [436] Mikkel Thorup. On RAM priority queues. *SIAM Journal on Computing*, 30(1):86–109,
    2000.


    [437] Mikkel Thorup. High speed hashing for integers and strings. http://arxiv.org/abs/1504.0684,
    2015.


    [438] Mikkel Thorup. Linear probing with 5-independent hashing. http://arxiv.org/abs/1509.0449,
    2015.

