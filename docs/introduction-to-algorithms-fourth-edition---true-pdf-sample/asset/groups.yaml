    We typically organize data into ***objects***, which are composed of ***attributes***.
    We access a particular attribute using the syntax found in many object-oriented
    languages: the object name, followed by a dot, followed by the attribute name.
    For example, if an object $x$ has attribute $f$, we denote this attribute by $x.f$.


    We treat a variable representing an array or object as a pointer (known as a reference
    in some programming languages) to the data representing the array or object. For
    example, if $x$ is a parameter of a called procedure, the assignment $y = x$ causes
    $y.f$ to equal $x.f$. Moreover, if we now set $x.f = 3$, then not only does $x.f$
    equal 3, but $y.f$ as well. In other words, $x$ and $y$ point to the same object
    after the assignment.


    Our attribute notation can "cascade." For example, suppose that the attribute
    $f$ is itself a pointer to some type of object that has an attribute $g$. Then
    the notation $x.f.g$ is implicitly parenthesized as $(x.f).g$. In other words,
    if we had assigned $y = x.f$, then $x.f.g$ is the same as $y.g$.


    Sometimes a pointer refers to no object at all. In this case, we give it the special
    value NIL.


    - We pass parameters to a procedure ***by*** ***value***: the called procedure
    receives its own copy of the parameters, and if it assigns a value to a parameter,
    the change is *not* seen by the calling procedure. When objects are passed, the
    pointer to the data representing the object is copied, but the object’s attributes
    are not.


