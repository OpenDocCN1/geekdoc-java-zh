    ## 11.1 Direct-address tables


    Direct addressing is a simple technique that works well when the universe $U$
    of keys is reasonably small. Suppose that an application needs a dynamic set in
    which each element has a distinct key drawn from the universe $U = \{0; 1; \dots;
    m-1\}$, where $m$ is not too large.


    To represent the dynamic set, you can use an array, or ***direct-address table***,
    denoted by $T[0 \dots m-1]$, in which each position, or ***slot***, corresponds
    to a key in the universe $U$. Figure 11.1 illustrates this approach. Slot $k$
    points to an element in the set with key $k$. If the set contains no element with
    key $k$, then $T[k] = \text{NIL}$. The dictionary operations DIRECT-ADDRESS-SEARCH,
    DIRECT-ADDRESS-INSERT, and DIRECT-ADDRESS-DELETE on the following page are trivial
    to implement. Each takes only $O(1)$ time.


    For some applications, the direct-address table itself can hold the elements in
    the dynamic set. That is, rather than storing an element’s key and satellite data
    in an object external to the direct-address table, with a pointer from a slot
    in the table to the object, save space by storing the object directly in the slot.
    To indicate an empty slot, use a special key. Then again, why store the key of
    the object at all? The index of the object *is* its key! Of course, then you’d
    need some way to tell whether slots are empty.


    **Figure 11.1** How to implement a dynamic set by a direct-address table $T$.
    Each key in the universe $U = \{0; 1; \dots; 9\}$ corresponds to an index into
    the table. The set $K = \{2; 3; 5; 8\}$ of actual keys determines the slots in
    the table that contain pointers to elements. The other slots, in blue, contain
    NIL.


    ## 13.1 Properties of red-black trees


    **Figure 13.1** A red-black tree. Every node in a red-black tree is either red
    or black, the children of a red node are both black, and every simple path from
    a node to a descendant contains the same number of black nodes. (a) Every leaf,
    shown as NIL, is black. Each non-NIL node is marked with its black-height, where
    NILs have black-height 0. (b) The same red-black tree with each NIL replaced by
    the single sentinel $T.\text{nil}$, which is always black, and with black-height
    omitted. The root’s parent is also the sentinel. (c) The same red-black tree but
    with leaves and the root’s parent omitted. The remainder of this chapter uses
    this drawing style.


    **Figure 13.7** The cases in lines 3–22 of the procedure RB-DELETE-FIXUP. Brown
    nodes have color attributes represented by $c$ and $c''$, which may be either
    RED or BLACK. The letters $\alpha; \beta; \dots$ represent arbitrary subtrees.
    Each case transforms the configuration on the left into the right by changing
    some colors and/or performing a rotation. Any node pointed to by $x$ has an extra
    black and is either doubly black or red-and-black. Only case 2 causes the loop
    to repeat. (a) Case 1 is transformed into case 2, 3, or 4 by exchanging the colors
    of nodes B and D and performing a left rotation. (b) In case 2, the extra black
    represented by the pointer $x$ moves up the tree by coloring node D red and setting
    $x$ to point to node B. If case 2 is entered through case 1, the while loop terminates
    because the new node $x$ is red-and-black, and therefore the value $c$ of its
    color attribute is RED. (c) Case 3 is transformed to case 4 by exchanging the
    colors of nodes C and D and performing a right rotation. (d) Case 4 removes the
    extra black represented by $x$ by changing some colors and performing a left rotation
    (without violating the red-black properties), and then the loop terminates.


    **Figure 14.5** The m and s tables computed by MATRIX-CHAIN-ORDER for $n=6$ and
    the following matrix dimensions: $A_1: 30 \times 35, A_2: 35 \times 15, A_3: 15
    \times 5, A_4: 5 \times 10, A_5: 10 \times 20, A_6: 20 \times 25$. The tables
    are rotated so that the main diagonal runs horizontally. The m table uses only
    the main diagonal and upper triangle, and the s table uses only the upper triangle.
    The minimum number of scalar multiplications to multiply the 6 matrices is $m[1,6]
    = 15125$. Of the entries that are not taken together:

    - $m[2,5] = 13000$

    - $m[1,4] = 7125$

    - $m[3,6] = 9375$

    - $m[1,5] = 9375$

    - $m[2,4] = 4375$

    - $m[3,5] = 7875$

    - $m[1,3] = 5375$

    - $m[2,3] = 2625$

    - $m[3,4] = 1000$

    - $m[4,5] = 2500$


    ### Step 4: Constructing an optimal solution


    Although MATRIX-CHAIN-ORDER determines the optimal number of scalar multiplications
    needed to compute a matrix-chain product, it does not directly show how to multiply
    the matrices. The table $s[1 \dots n-1, 2 \dots n]$ provides the information needed
    to do so. Each entry $s[i, j]$ records a value of $k$ such that an optimal parenthesization
    of $A_i \dots A_j$ splits the product between $A_k$ and $A_{k+1}$. The final matrix
    multiplication in computing $A_1 \dots A_n$ optimally is $A_1 \dots A_k A_{k+1}
    \dots A_n$. The s table contains the information needed to determine the earlier
    matrix multiplications as well, using recursion: $s[1, k]$ determines the last
    matrix multiplication when computing $A_1 \dots A_k$ and $s[k+1, n]$ determines
    the last matrix multiplication when computing $A_{k+1} \dots A_n$. The recursive
    procedure PRINT-OPTIMAL-PARENS on the facing page prints an optimal parenthesization
    of the matrix chain product $A_i \dots A_j$, given the $s$ table computed by MATRIX-CHAIN-ORDER
    and the indices.

