    ### 数据结构


    本书还介绍了几种数据结构。数据结构是用于存储和组织数据的方法，以便于访问和修改。使用合适的数据结构或多个结构是算法设计中的重要部分。没有一种单一的数据结构可以适用于所有场景，因此你应该了解其中几种算法的优点和局限性。


    ### 技巧


    尽管你可以把这本书当成算法的“菜谱”来使用，但你可能会遇到无法轻易找到已发表算法的问题（例如书中的许多练习和问题）。本书将教你算法设计和分析的技巧，以便你能够自己开发算法，证明它们能给出正确答案，并分析它们的效率。不同的章节涉及算法解决问题的不同方面。有些章节针对特定问题，例如第
    9 章中寻找中位数和统计量，第 21 章计算最小生成树，以及第 24 章确定网络最大流。其他章节则介绍了技术，例如第 2 章和第 4 章的分治法、第 14
    章的动态规划以及第 16 章的摊还分析。


    ### 困难问题


    本书大部分内容关于高效算法。我们通常的效率衡量标准是：算法产生结果需要多长时间？然而，对于某些问题，我们知道没有任何算法能够在合理的时间运行。第 34 节研究了这些问题中一个有趣的子集，即
    NP 完全问题。


    为什么 NP 完全问题很有趣呢？首先，虽然从未发现过任何针对 NP 完全问题的高效算法，但还没有人证明过这种算法是不存在的。换句话说，没有人知道 NP 完全问题是否存在高效算法。其次，NP
    完全问题集具有一个显著的特性：如果其中任何一个问题存在高效算法，那么所有这些问题都存在高效算法。NP 完全问题之间的这种关系使得高效解决方案的缺失变得更加引人入胜。第三，几个
    NP 完全问题与我们已知的具有高效算法的问题相似但并不完全相同。计算机科学家对“问题陈述的微小变化如何导致已知最佳算法效率的巨大变化”感到着迷。


    你应该了解 NP 完全问题，因为其中一些问题会出人意料地出现在实际应用中。如果你被要求为一个 NP 完全问题产生高效算法，你可能会花费大量时间在徒劳的搜索中。相反，如果你能证明该问题是
    NP 完全的，你就可以花时间开发近似算法，即给出一个良好但未必是最优解的算法。


    作为一个具体的例子，考虑一家拥有中心仓库的送货公司。每天，它在仓库装载卡车并将它们派往多个地址进行送货。在一天结束时，每辆卡车都必须回到仓库，以便第二天再次装载。为了降低成本，公司希望选择一种送货顺序，使得每辆卡车的行驶距离最短。这个问题就是众所著名的“旅行推员问题”，它是
    NP 完全的。目前没有已高效算法。然而，在某些假设下，我们知道存在计算出接近最小可能总距离的高效算法。第 35 节讨论了这类“近似算法”。


    ### 替代计算模型


    多年来，我们可以依靠处理器时钟频率的稳定增长。然而，物理限制为不断增加的时钟频率带来了根本性的障碍：因为功率密度随时钟频率呈超线性增长，芯片一旦时钟频率足够高，就有融化的风险。因此，为了每秒执行更多计算，芯片的设计包含的不只是一个而是多个处理“核心”。我们可以将这些多核计算机比作单个芯片上的几台串行计算机。换句话说，它们是一种“并行计算机”。为了从多核计算机中获得最佳性能，我们需要从并行性的考虑来设计算法。第
    26 节介绍了一种“任务并行”算法模型，该模型利用了多个处理核心。这种模型在理论和实践方面都具有优势，许多现代并行编程平台都采用了类似于这种并行模型的设计。


    (2) 准确准确地说，只有决策问题——那些有“是/否”答案的问题——才能是 NP 完全的。旅行推员问题的决策版本问的是是否存在一种送货顺序，其总距离不超过给定的金额。


    书中的大多数示例都假设在算法开始运行时所有输入数据都是可用的。算法设计中的大部分工作也做了同样的假设。然而，对于许多重要的现实世界示例，输入实际上是随时间到达的，算法必须在不知道未来将到达什么数据的情况下决定如何进行。在数据中心，作业不断到达和离开，调度算法必须决定在何时何地运行作业，而不知道未来将到达哪些作业。互联网中的流量必须根据当前状态进行路由，而不知道未来流量将到达何处。医院急诊室在不知道其他患者何时到达的情况下，对先治疗哪些患者做出分诊决策。随时间接收输入而非在开始时全部呈现的算法是在线算法，第
    27 节研究了这类算法。


    ## 1.2 作为技术的算法


    如果计算机是无限快的且内存是免费的，你还有理由学习算法吗？答案是肯定的，为了确保你的实现能够终止并给出正确答案，并分析它们的效率。如果计算机是无限快的且内存是免费，任何正确的方法都可以。


    当然，计算机可能很快，但并非无限快。因此，计算时间是一种有限资源，这使其变得宝贵：时间比金钱重要。你应该选择高效利用时间的算法。


    ### 效率


    解决同一个问题的不同算法在效率上往往存在巨大差异。这些差异可能比硬件和软件的差异大得多。


    例如，第 2 章介绍了两种排序算法。第一种被称为插入排序，排序 $n$ 个元素大约需要 $c1 n^2$ 时间，其中 $c1$ 是一个不依赖于 $n$ 的常数。也就是说，所需时间与
    $n^2$ 正比。第二种是归排序，大约需要 $c2 n \lg n$ 时间，其中 $\lg n$ 代表 $\log_2 n，$c2$ 是另一个不依赖于 $n$
    的常数。插入排序的常系数通常比归排序小，因此 $c1 < c2$。我们将看到，常系数对运行时间的影响远小于对输入规模 $n$ 的依赖。让我们把插入排序的运行时间写为
    $c1 n^2$，归排序的运行时间写为 $c2 n \lg n$。然后可以看到，当插入排序的运行时间包含因子 $n$ 时，归排序包含的因子是 $\lg n$，后者要小得多。例如，当
    $n$ 为 1000 时，$lg n$ 大约为 10；当 $n$ 为 1,000,000 时，$lg n$ 大约为 20。虽然对于较小的输入规模，插入排序通常比归排序快，但一旦输入规模
    $n$ 足够大，归排序在 $\lg n$ 对 $n$ 上的优势就足以补偿了常系数的差异。


