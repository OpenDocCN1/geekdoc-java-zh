    ## 第2章 入门


    首先，必须在一种真实的编程语言中实现它，因为你无法直接运行我们的伪代码。这样的一个计时测试能告诉你什么？你会发现，在你的特定计算机上、针对特定的输入、在在你创建的特定实现下、使用你运行的特定编译器或解释器、使用你链接的特定库，以及在计时测试的同时并发运行的特定后台任务（例如检查网络入站信息）的情况下，插入排序运行需要多长时间。如果你在你的计算机上使用相同的输入再次运行插入排序，你甚至可能会得到不同的计时结果。如果仅在某一台计算机上针对某一个输入运行一次插入排序，那么如果你给它不同的输入、在不同的计算机上运行它，或者用不同的编程语言实现它，你对插入排序的运行时间还能确定什么？没多少。我们需要一种方法，在给定新输入的情况下，预测插入排序需要多长时间。


    与其对插入排序进行一次或多次运行并计时，我们不如通过分析算法本身来确定所需的时间。我们将检查伪代码中的每一行被执行了多少次，以及每行伪代码运行需要多久。首先，我们将得出一个精确但复杂的运行时间公式。然后，我们将使用一种方便的符号来提炼公式中的重要部分，这有助于我们比较同一问题不同算法的运行时间。


    我们如何分析插入排序？首先，让我们承认运行时间取决于输入。排序一千个数字比排序三个数字花费更长时间，这你不应该感到非常惊讶。此外，插入排序两个相同大小输入数组可能花费不同的时间，这取决于它们已经接近排序的程度。尽管运行时间可能取决于输入的许多特征，但我们将关注被证明影响最大的一个特征，即输入的大小，并将程序的运行时间描述为其输入大小的函数。为了做到这一点，我们需要更仔细地定义“运行时间”和“输入规模”这两个术语。我们还需要明确，我们讨论的是触发最坏情况、最好情况或其他其他情况的输入运行时间。


    *输入规模*的最恰概念取决于所研究的问题。对于许多问题（如排序或计算离散傅里叶变换），最自然的度量是*输入中项的数*——例如，正在排序的项数 $n$。对于许多其他问题（如两个整数相法），输入规模的最佳度量是使用普通二进制表示法表示所需的*总位数*。有时，用不仅仅一个数字来描述输入规模更为合适。例如，如果算法的输入是一个图，我们通常通过图中顶点数和边数来刻画输入规模。我们将在研究每个问题时说明所使用的是哪种输入规模度量。


    ### 2.2 分析算法


    算法在特定输入上的*运行时间*是执行的指令数量和数据访问次数。我们计算这些成本的方式应该独立于任何特定的计算机，但应在 RAM 模型的框架内。目前，让我们采用以下观点：执行我们伪代码的每一行都需要恒定的时间。某一行花费的时间可能比另一行长或短，但我们假设第
    $k$ 行的每次执行都花费 $c_k$ 的时间，其中 $c_k$ 是一个常数。这种观点符合 RAM 模型，它也反映了伪代码在大多数实际计算机上的实现方式。


    让我们分析 `INSERTION-SORT` 过程。正如承诺的，我们将首先设计一个使用输入规模和所有语句成本 $c_k$ 的精确公式。然而，这个公式证明非常杂乱。然后我们将切换到一种更简洁、更易使用的符号。这种更简洁的符号清晰地说明了如何比较算法的运行时间，特别是当输入规模增加时。


    为了分析 `INSERTION-SORT` 过程，请看下一页，那里有每个语句的时间成本和每个语句执行的次数。对于每个 $i = 2, 3, \dots; n$，令
    $t_i$ 表示第 5 行中的 **while** 循环测试在该 $i$ 值执行的次数。当 **for** 或 **while** 循环以通常方式退出时（因为循环头部的测试为假），测试的执行次数比循环体多一次。由于注释不是可执行的语句，假设它们不消耗时间。


    算法的运行时间是执行的每条语句运行时间之和。执行需要 $c_k$ 步并执行 $m$ 次的语句对总运行时间贡献 $c_k m$。我们通常用 $T(n)$ 表示算法在规模为
    $n$ 的输入上的运行时间。为了计算 $T(n)$（即 INSERTION-SORT 在包含 $n$ 个值的输入上的运行时间），我们将成本与次数的乘积求和。这里有一些细微之处。我们在英语中指定的计算步骤通常是需要超过常数时间的过程的变体。例如，在第
    21 页的 RADIX-SORT 中，有一行“使用稳定排序来对数组进行排序”，我们将看到，这花费了超过常数的时间。此外，虽然调用子程序仅花费常数时间，但子程序本身一旦被调用，可能会花费更多时间。也就是说，我们将*调用*子程序的过程（向其传递参数）与*执行*子程序的过程隔离开。这种特性对于内存等资源并不一定成立。一个引用
    $m$ 个内存单元并执行 $n$ 次的语句并不一定引用 $mn$ 个不同的内存单元。


    即使对于给定规模的输入，算法的运行时间也取决于给出的是什么输入。例如，在 INSERTION-SORT 中，当数组已经排序时会出现最好情况。在这种情况下，每当第
    5 行执行时，$key$（即 $A[i]$ 中的值）已经大于或等于 $A[1..i-1]$ 中的所有值，因此第 5-7 行的 **while** 循环在第一次测试时就会退出。因此，对于
    $i = 2, 3, \dots; n$，$t_i = 1$，最好情况的运行时间为：


    $T(n) = c_1n + c_2(n-1) + c_4(n-1) + c_5(n-1) + c_8(n-1)$

    $= (c_1 + c_2 + c_4 + c_5 + c_8)n - (c_2 + c_4 + c_5 + c_8)$  (2.1)


    我们可以此运行时间表示为 $an + b$，其中 $a$ 和 $b$ 是取决于语句成本 $c_k$ 的常数（$a = c_1 + c_2 + c_4 + c_5
    + c_8$ 且 $b = c_2 + c_4 + c_5 + c_8$）。因此，运行时间是 $n$ 的*线性函数*。


    当数组呈逆序排列时会出现最坏情况——即它是递的。程序必须将每个元素 $A[i]$ 与整个排序子数组 $A[1..i-1]$ 中的每个元素进行比较，因此对于
    $i = 2, 3, \dots; n，$t_i = i$。（程序在第 5 行的每次执行中发现 $A[j] > key$，且 **while** 循环只有在
    $j$ 到 0 时才会退出。）注意到 $\sum_{i=2}^n i = \sum_{i=1}^n i - 1 = \frac{n(n+1)}{2} - 1
    = \frac{n^2+n-2}{2}$（见第 1141 页的公式 (A.2)）。


