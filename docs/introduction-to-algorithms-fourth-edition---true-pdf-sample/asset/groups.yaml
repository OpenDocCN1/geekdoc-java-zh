    在节点 $i = 2$ 处违反了最大堆属性，因为它并不大于两个子节点。在 **(b)** 中，通过交换 $A[2]$ 和 $A[4]$ 恢复了节点 2 的最大堆属性，但这破坏了节点
    4 的最大堆属性。递归调用 `MAX-HEAPIFY(A, 4)` 现在 $i=4$。如 **(c)** 所示，交换 $A[4]$ 和 $A[9]$ 后，节点
