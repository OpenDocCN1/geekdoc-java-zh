    ## 2.1 Insertion sort


    *21


    Let’s see how these properties hold for insertion sort.


    **Initialization:** We start by showing that the loop invariant holds before the
    first loop iteration, when $i = 2$. The subarray $A[1 \dots i-1]$ consists of
    just the single element $A[1]$, which is in fact the original element in $A[1
    \dots 1]$. Moreover, this subarray is sorted (after all, how could a subarray
    with just one value not be sorted?), which shows that the loop invariant holds
    prior to the first iteration of the loop.


    **Maintenance:** Next, we tackle the second property: showing that each iteration
    maintains the loop invariant. Informally, the body of the **for** loop works by
    moving the values in $A[i-1]$, $A[i-2]$, $A[i-3]$, and so on by one position to
    the right until it finds the proper position for $A[i]$ (lines 4–7), at which
    point it inserts the value of $A[i]$ (line 8). The subarray $A[1 \dots i]$ then
    consists of the elements originally in $A[1 \dots i]$, but in sorted order. ***Incrementing***
    $i$ (increasing its value by 1) for the next iteration of the **for** loop then
    preserves the loop invariant.


    A more formal treatment of the second property would require us to state and show
    a loop invariant for the **while** loop of lines 5–7. Let’s not get bogged down
    in such formalism just yet. Instead, we’ll rely on our informal analysis to show
    that the second property holds for the outer loop.


    **Termination:** Finally, we examine loop termination. The loop variable $i$ starts
    at 2 and increases by 1 in each iteration. Once $i$''s value exceeds $n$ in line
    1, the loop terminates. That is, the loop terminates once $i$ equals $n+1$. Substituting
    $n+1$ for $i$ in the wording of the loop invariant yields that the subarray $A[1
    \dots n]$ consists of the elements originally in $A[1 \dots n]$, but in sorted
    order. Hence, the algorithm is correct.


    This method of loop invariants is used to show correctness in various places throughout
    this book.


    ### Pseudocode conventions


    We use the following conventions in our pseudocode.


    - Indentation indicates block structure. For example, the body of the **for**
    loop that begins on line 1 consists of lines 2–8, and the body of the **while**
    loop that begins on line 5 contains lines 6–7 but not line 8. Our indentation
    style applies to **if-else** statements as well. Using indentation instead of
    textual indicators of block structure, such as **begin** and **end** statements
    or curly braces, reduces clutter while preserving, or even enhancing, clarity.


    - The looping constructs **while**, **for**, and **repeat-until** and the **if-else**
    conditional construct have interpretations similar to those in C, C++, Java, Python,
    and JavaScript. In this book, the loop counter retains its value after the loop
    is exited, unlike some situations that arise in C++ and Java. Thus, immediately
    after a **for** loop, the loop counter’s value is the value that first exceeded
    the **for** loop bound. We used this property in our correctness argument for
    insertion sort. The **for** loop header in line 1 is **for** $i = 2$ **to** $n$,
    and so when this loop terminates, $i$ equals $n+1$. We use the keyword **to**
    when a **for** loop increments its loop counter in each iteration, and we use
    the keyword **downto** when a **for** loop ***decrements*** its loop counter (reduces
    its value by 1 in each iteration). When the loop counter changes by an amount
    greater than 1, the amount of change follows the optional keyword **by**.


    - The symbol "//" indicates that the remainder of the line is a comment.


    - Variables (such as $i$, $j$, and *key*) are local to the given procedure. We
    won’t use global variables without explicit indication.


    - We access array elements by specifying the array name followed by the index
    in square brackets. For example, $A[i]$ indicates the $i$th element of the array
    $A$. Although many programming languages enforce 0-origin indexing for arrays
    (0 is the smallest valid index), we choose whichever indexing scheme is clearest
    for human readers to understand. Because people usually start counting at 1, not
    0, most—but not all—of the arrays in this book use 1-origin indexing.


    ^2 When the loop is a **for** loop, the loop-invariant check just prior to the
    first iteration occurs immediately after the initial assignment to the loop-counter
    variable and just before the first test in the loop header. In the case of INSERTION-SORT,
    this time is after assigning 2 to the variable $i$ but before the first test of
    whether $i \le n$.


    3 In an **if-else** statement, we indent **else** at the same level as **if**.

