    ## 1.2 作为技术的算法


    为了举一个具体的例子，让我们把运行插入排序的快速计算机（计算机 A）与一台运行合并排序的较慢计算机（计算机 B）进行对比。它们都必须对一个包含 1000 万个数字的数组进行排序。（尽管
    1000 万个数字看起来很多，但如果数字是 8 字节整数，输入将占用约 80 MB，即使是廉价的笔记本电脑，内存也能装下多次。）假设计算机 A 每秒执行 100
    亿条指令（比本文写作时的任何单机计算机都要快），而计算机 B 每秒仅执行 1000 万条指令（远慢于大多数现代计算机），因此计算机 A 的原始计算能力是计算机
    B 的 1000 倍。为了让这种差异更加显著，假设世界上最高明的程序员为计算机 A 用机器语言编写了插入排序代码，生成的代码排序 $n$ 个数字需要 $2n^2$
    条指令。进一步假设由一名普通的程序员使用带有低编译器的高级语言实现了合并排序，生成的代码需要 $50n \lg n$ 条指令。排序 1000 万个数字，计算机
    A 需要的时间：


    $\frac{2(10^7)^2}{10^{10} \text{ instructions/second}} = 2(10^4) = 20,000 \text{
    秒（超过 5 小时）}$


    而计算机 B 需要的时间：


    $\frac{50(10^7) \lg 10^7}{10^7 \text{ instructions/second}} \approx 1163 \text{
    秒（不到 20 分钟）}$


    通过使用运行时间增长更慢的算法，即使编译器糟糕，计算机 B 的运行速度也比计算机 A 快 17 倍！在排序 1 亿个数字时，合并排序的优势更加明显：插入排序需要超过
    3 天的时间，而合并排序不到 4 小时。尽管 1 亿看起来是一个很大的数字，但全球每小时有超过 1 亿次网络搜索，每分钟发送超过 1 亿封邮件，某些最小的星系（被称为超紧密星系）也包含约
    1 亿颗恒星。通常，随着问题规模的增大，合并排序的相对优势也随增大。


    ## 算法与其他技术


    上面的例子说明，你应该像对待软件一样，将算法视为一种技术。系统的总性能取决于对高效算法的选择，也取决于硬件的速度。正如其他技术正在取得飞速进展，算法领域也是如此。你可能会想，考虑到其他技术，如先进的体系体系、易用且直观的图形用户界面（GUI）、面向对象的系统、集成
    Web 技术、快速网络（包括有线和无线）以及移动设备，算法是否真的重要？


    答案是肯定的。虽然某些应用程序在应用层不需要算法内容（例如某些简单的 Web 应用），但许多应用需要。例如，考虑一个确定如何从一个地方旅行到另一个地方的 Web
    服务。它的实现将依赖快速硬件、图形用户界面、广域网，可能还需要定位技术。它还需要算法来处理各种操作，如寻找路径（可能使用最短路径算法）、渲染地图和插值地址。


    此外，即使是一个在应用层不需要算法内容的应用程序，也高度依赖算法：


    - 应用程序是否依赖快速硬件？

    - 应用程序是否依赖图形用户界面？

    - 应用程序是否依赖网络？

    - 应用程序是否是用机器码以外的语言编写的？如果是，它会被编译器、解释器或汇编器处理，而所有这些都大量使用了算法。


    算法是现代计算机使用的大多数技术的核心。机器学习可以被视为一种执行算法任务的方法，它不需要显式设计算法，而是从数据中推断模式，从而学习解决方案。乍一看，自动化算法设计过程的机器学习似乎让学习算法变得过时了。然而，事实恰相反。机器学习本身就是算法的集合，只是换了一个名字。此外，目前机器学习的成功似乎主要针对那些我们作为人类并不真正理解什么是正确算法的问题。显著的例子包括计算机视觉和自动语言翻译。对于人类非常理解的算法问题（例如书中的大多数问题），为解决特定问题设计的高效算法通常比机器学习方法更成功。


    数据科学是一门跨学科领域，目标是从结构化和非结构化数据中提取知识和洞察。数据科学使用了统计学、计算机科学和优化理论中的方法。算法的设计和分析是该领域的基础。数据科学的核心技术与机器学习技术有很大重叠，包含了书中的许多算法。


    此外，随着计算机能力的不断提高，我们正在利用它们解决比以往任何时候更大的问题。正如我们在上面比较插入排序和合并排序时看到的，正是在问题规模更大时，算法效率之间的差异才变得格外显著。


    拥有扎实的算法知识和技术是定义真正熟练程序员的特征之一。凭借现代计算技术，你可以在不了解算法的情况下完成某些任务，但如果你有良好的算法背景，你可以做得很多得多。


