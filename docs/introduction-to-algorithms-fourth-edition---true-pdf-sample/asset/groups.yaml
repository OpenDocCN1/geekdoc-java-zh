    ## 第33 章 机器学习算法


    如果 Lloyd 过程真的需要 $k^n$ 次迭代，那么它将是不实际的。在实践中，当最近一次迭代中 $f(S, C)$ 的百分比下降低于预设阈值时，终止该过程通常就足够了。因为
    Lloyd 过程保证只能找到局部最优聚类，因此寻找良好聚类的一种方法是使用不同的随机选择初始中心运行多次 Lloyd 过程，并取最佳结果。


    Lloyd 过程的运行时间与迭代次数 $T$ 成正比。在单次迭代中，根据最近中心规则将点分配到聚类中需要 $O(dnkn)$ 的时间，而为每个聚类重新计算新中心则需要
    $O(dn)$ 的时间（因为每个点都属于一个聚类）。因此，k-means 过程的总体运行时间为 $O(Tdkn)$。Lloyd 算法展示了许多机器学习算法中通用的方法：


    - 首先，根据适当的参数序列 $\theta$ 定义一个假设空间，使得每个 $\theta$ 都与一个特定的假设 $h_\theta$ 相关。（对于 k-means
    问题，$\theta$ 是一个 $dk$ 维向量，等同于 $C$，包含 $k$ 个聚类的每个 $d$ 维中心，而 $h_\theta$ 是假设每个数据点 $x$
    应该分到距离 $x$ 最近的中心的聚类中。）


    - 其次，定义一个度量 $f(E, \theta)$ 来描述假设 $h_\theta$ 拟合训练数据 $E$ 的程度。$f(E, \theta)$ 值越小越好，且（局部）最优解（局部）最小化了
    $f(E, \theta)$。（对于 k-means 问题，$f(E, \theta)$ 只是 $f(S, C)$。）


    - 第三，给定一组训练数据 $E$，使用合适的优化过程找到一个使 $f(E, \theta^*)$ 最小的 $\theta^*$ 值，至少在局部是如此。（对于
    k-means 问题，这个 $\theta^*$ 值就是 Lloyd 算法返回的 $k$ 个中心点的序列 $C$。）


    - 返回 $\theta^*$ 作为答案。


