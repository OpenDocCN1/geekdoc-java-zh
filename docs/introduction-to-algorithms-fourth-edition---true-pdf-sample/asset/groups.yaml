    序言


    不久以前，任何听到“算法”一词的人几乎都是计算机科学家或数学家。然而，随着计算机在现代生活中变得普及，这个术语已不再深奥莫测。如果你环顾家园，发现在最平凡的地方都有算法：你的微波炉、洗衣机，当然，还有你的电脑。你要求算法为你提供建议：你可能喜欢什么，或者开车时该走哪条路线。我们的社会，无论好坏，都要求算法确保你的安全，或者至少不让你丧命。“算法”这个词每天都会出现在新闻某处。因此，你不仅作为计算机科学的学生或从业者，而且作为一名世界公民，理解算法是很有必要的。一旦你理解了算法，你就可以教育他人什么是算法、它们是如何运作的以及它们的局限性何。


    本书对现代算法研究提供了全面的介绍。它介绍了许多算法并涵盖了相当深入的内容，同时使这些设计对所有水平的读者都易于理解。所有的分析都已列出，我们努力在保持解释清晰的同时不牺牲覆盖的深度或数学严谨性。每一章都介绍了一种算法、一种设计技术、一个应用领域或相关主题。算法用英文和伪代码描述，伪代码旨在让任何做过少量编程的人都能读懂。书中包含插图——许多插图包含多个部分——用来说说明算法的工作原理。由于我们强调效率作为设计准则，因此对算法的运行时间包含了仔细的分析。要了解算法影响我们日常生活的许多方式，请参本书。


    本文主要用于本科或研究生的算法或数据结构课程。因为它既讨论了工程问题，也讨论了数学方面，因此同样适用于技术人员的自学。在这一第四版中，我们再次更新了整本书。变化涵盖了广泛的范围，包括新的章节和节、彩色插图，以及我们希望你会认为更具吸引力的写作风格。


    对于教师，我们设计这本书是为了兼顾通用性和完整性。你应该发现它对各种课程都有用，从本科数据结构课程到研究生算法课程都是。因为我们提供的材料远多于一个典型学期课程能容纳的量，你可以选择最支持你所教学课程的材料。你应该会发现根据所需的章节来组织课程非常容易。我们将各章设计得相对独立，这样你就不必担心某章之间存在意料之外且不必要的依赖。在本科课程中，你可能只使用章节中的某些部分，而在研究生课程中，你可能会涵盖整个章节。我们包含了
    931 道练习题和 162 道思考题。每节结束都有练习题，每章结束都有思考题。练习题通常是测试对材料基础掌握情况的短问题。其中一些简单的自测练习，但许多是内容充实的，适合作为布置作业。思考题包含了更详细的案例研究，通常会引入新材料。它们通常由几个部分组成，引导学生完成得出解决方案所需的步骤。与本书的第三版一样，我们公开了部分但并非所有的思考题和练习的解答。你可以在我们的网站
    http://mitpress.mit.edu/algorithms/ 上找到这些解答。你可能想检查该网站，看看是否包含你计划布置的练习或题目的解答。由于我们发布的解答集可能会随时间增加，我们建议你在每次教课时都检查一下网站。我们对更适合研究生而非本科生的节和练习标记了星。带星的节并不比不带星的难，但它可能需要对更高级数学的理解。同样，带星的练习可能需要高级背景或额外的创造力。


    对于学生


    我们希望本教材能为你提供算法领域的良好介绍。我们尝试让每种算法都易于理解且有趣。为了帮助你在遇到陌生或困难算法时，我们以逐步的方式描述每种算法。我们还对理解算法分析所需的数学知识提供了仔细的解释，并配有插图帮助你可视化。


    由于本书很大，你的课程可能只涵盖部分材料。虽然我们希望你现在发现这本书作为课程教材对你有帮助，但我们也试图让它足够全面，值得在你未来的专业书架上占有一席。


    阅读这本书的先决条件是什么？


    你需要编程经验。特别是，你应该理解递归过程和简单的数据结构，如数组和链表（尽管第10.2节涵盖了链表以及一种你可能会觉得新的变体）。


    你应该对数学证明有一定的掌握，特别是数学归纳法。书中部分内容依赖于初微积分的知识。虽然书中到处使用数学，但第一部分和附录 A–D 将教你所需的所有数学技术。


    我们的网站 http://mitpress.mit.edu/algorithms/ 提供了部分思考题和练习的解答链接。你可以将你的解答与我们的进行对比。然而，我们请不要将解答发送给我们。


