    ## 27.2 Maintaining a search list


    795


    ### Exercises


    ***27.1-1***

    Suppose that when hedging your bets, you wait for $p$ minutes, instead of for
    $k$ minutes, before taking the stairs. What is the competitive ratio as a function
    of $p$ and $k$? How should you choose $p$ to minimize the competitive ratio?


    ***27.1-2***

    Imagine that you decide to take up downhill skiing. Suppose that a pair of skis
    costs $r$ dollars to rent for a day and $b$ dollars to buy, where $b > r$. If
    you knew in advance how many days you would ever ski, your decision whether to
    rent or buy would be easy. If you’ll ski for at least $db/r$ days, then you should
    buy skis, and otherwise you should rent. This strategy minimizes the total that
    you ever spend. In reality, you don’t know in advance how many days you’ll eventually
    ski. Even after you have skied several times, you still don’t know how many more
    times you’ll ever ski. Yet you don’t want to waste your money. Give and analyze
    an algorithm that has a competitive ratio of 2, that is, an algorithm guaranteeing
    that no matter how many times you ski, you never spend more than twice you would
    have spent if you knew from the outset how many times you’ll ski.


    ***27.1-3***

    In “concentration solitaire,” a game for one person, you have $n$ pairs of matching
    cards. The backs of the cards are all the same, but fronts contain pictures of
    animals. One pair has pictures of zebra, one pair has pictures of bears, one pair
    has pictures of camels, and so on. At the start of the game, the cards are all
    placed face down. In each round, you can turn two cards face up to reveal their
    pictures. If the pictures match, then you remove that pair from the game. If they
    don’t match, then you turn both of them over, hiding their pictures again. The
    game ends when you have removed all $n$ pairs, and your score is how many rounds
    you needed to do so. Suppose that you can remember the picture on every card that
    you have seen. Give an algorithm to play solitaire that has a competitive ratio
    of 2.


    ## 27.2 Maintaining a search list


    The next example of an online algorithm pertains to maintaining the order of elements
    in a linked list, as in Section 10.2. This problem often arises in practice for
    hash tables when collisions are resolved by chaining (see Section 11.2), since
    each slot contains a linked list. Reordering the linked list of elements in each
    slot can boost the performance of searches measurably.


    Problems for Chapter 32


    The BWT is the rightmost column, agtbaa$ur (The row numbering will be helpful
    in understanding how to compute the inverse BWT.) The BWT has applications in
    bioinformatics, and it can also be a step in text compression. That is because
    it tends to place identical characters together, as in the BWT of rutabaga, which
    places two instances of a together. When identical characters are placed together,
    or even nearby, additional means of compression become available. Following the
    BWT, combinations of move-to-front encoding, run-length encoding, and Huffman
    coding (see Section 15.3) provide significant text compression. Compression ratios
    with the BWT tend to improve as the text length increases.


    a. Given the suffix array for $T$, show how to compute the BWT in $\Theta(n)$
    time. In order to decompress, the BWT must be invertible. Assuming that the alphabet
    size is constant, the inverse BWT can be computed in $\Theta(n)$ time from the
    BWT. Let’s look at the BWT of rutabaga, denoting it by $BWT[]$. Each character
    in the BWT has a unique lexicographic rank from 1 to $n$. Denote the rank of $BWT[i]$
    by $rank[i]$. If a character appears multiple times in the BWT, each instance
    of the character has a rank 1 greater than the previous instance of the character.
    Here are the BWT and rank for rutabaga:


    | $i$ | $BWT[i]$ | $rank[i]$ |

    | :--- | :--- | :--- |

    | 1 | a | 2 |

    | 2 | g | 6 |

    | 3 | t | 8 |

    | 4 | b | 5 |

    | 5 | a | 3 |

    | 6 | a | 4 |

    | 7 | $ | 1 |

    | 8 | u | 9 |

    | 9 | r | 7 |


    For example, $rank[1] = 2$ because $BWT[1] = a$ and the only character that precedes
    the first a lexicographically is $ (which we defined to precede all other characters,
    so that $ has rank 1). Next, we have $rank[2] = 6$ because $BWT[2] = g$ and five
    characters in the BWT precede g lexicographically: $, the three instances of a,
    and b. Jumping ahead to $rank[5] = 3$, that is because $BWT[5] = a$, and because
    this $a$ is the second instance of a in the BWT, its rank value is 1 greater than
    the rank value for the previous instance of a, in position 1.


    There is enough information in $BWT$ and $rank$ to reconstruct $T$ from back to
    front. Suppose that you know the rank $r$ of a character $c$ in $T$. Then $c$
    is the first character in row $r$ of the sorted cyclic rotations. The last character
    in row $r$ must be the character that precedes $c$ in $T$. But you know which
    character is the last character in row $r$, because it is $BWT[r]$. To reconstruct
    $T$ from back to front, start with $, which you can find in $BWT$. Then work backward
    using $BWT$ and $rank$ to reconstruct $T$.


    Let’s see how this strategy works for rutabaga. The last character of $T$, $,
    appears in position 7 of $BWT$. Since $rank[7] = 1$, row 1 of the sorted cyclic
    rotations of $T$ begins with $. The character that precedes $ in $T$ is the last
    character in row 1, which is $BWT[1]: a$. Now we know that the last two characters
    of $T$ are aa. Looking up, we have $rank[1] = 2$, so that row 2 of the sorted
    cyclic rotations of $T$ begins with a. The character that precedes a in $T$ is
    the last character in row 2, which is $BWT[2]: g$. Now we know that the last three
    characters of $T$ are ag. Continuing on, we have $rank[2] = 6$, so that row 6
    of the sorted cyclic rotations of $T$ begins with g. The character that precedes
    g in $T$ is the last character in row 6, which is $BWT[6]: a$. Now we know that
    the last four characters of $T$ are aga. Because $rank[6] = 4$, a row 4 of the
    sorted cyclic rotations of $T$ begins with a. The character that precedes a in
    $T$ is the last character in row 4, which is $BWT[4]: b$. Now we know that the
    last five characters of $T$ are agab. And so on, until all $n$ characters of $T$
    have been identified, from back to front.


    b. Given the array $BWT[]$, write to compute the array $rank[]$ in $\Theta(n)$
    time, assuming that the alphabet size is constant.


    c. Given the arrays $BWT[]$ and $rank[]$, write to compute $T$ in $\Theta(n)$
    time.


    ### Chapter notes


    The relation of string matching to the theory of finite automata is discussed
    by Aho, Hopcroft, and Ullman [5]. The Knuth-Morris-Pratt algorithm [267] was invented
    independently by Knuth and Pratt and by Morris, but they published their work
    jointly. Matiyasevich [317] earlier discovered a similar algorithm, which applied
    only to an alphabet with two characters and was specified for a Turing machine
    with a two-dimensional tape. Reingold, Urban, and Gries [377] give an alternative
    treatment of the Knuth-Morris-Pratt algorithm. The Rabin-Karp algorithm was proposed
    by Karp and Rabin [250]. Galil and Seiferas [173] give an interesting deterministic
    linear-time string-matching algorithm that uses only O.1/ space beyond that required
    to store the pattern and text.


    The suffix-array algorithm in Section 32.5 is by Manber and Myers [312], who first
    proposed the notion of suffix arrays. The linear-time algorithm to compute the
    longest common prefix array presented here is by Kasai et al. [252]. Problem 32-2
    is based on the DC3 algorithm by Käräläinen, Sanders, and Burkhardt [245]. For
    a survey of suffix-array algorithms, see the article by Puglisi, Smyth, and Turpin
    [370]. To learn more about the Burrows-Wheeler transform from Problem 32-3, see
    the articles by Burrows and Wheeler [78] and Manzini [314].

