    in each recursive step is shown in tan, with the dark tan element selected as
    the pivot for the next partitioning. Blue elements are outside $A\langlep \dots
    r\rangle$. The answer is the tan element in the bottom array, where $p=r=5$ and
    $i=1$. The array designations $A\langle(0)\rangle; A\langle(1)\rangle; \dots;
