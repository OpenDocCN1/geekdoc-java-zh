    ## Chapter 2 Getting Started


    Using $\Theta$-notation, give the average-case and worst-case running times of
    linear search. Justify your answers.


    ***2.2-4*** How can you modify any sorting algorithm to have a good best-case
    running time?


    ## 2.3 Designing algorithms


    You can choose from a wide range of algorithm design techniques. Insertion sort
    uses the ***incremental*** method: for each element $A[i]$, insert it into its
    proper place in the subarray $A[1 \dots i]$, having already sorted the subarray
    $A[1 \dots i-1]$.


    This section examines another design method, known as “divide-and-conquer,” which
    we explore in more detail in Chapter 4. We’ll use divide-and-conquer to design
    a sorting algorithm whose worst-case running time is much less than that of insertion
    sort. One advantage of using an algorithm that follows the divide-and-conquer
    method is that analyzing its running time is often straightforward, using techniques
    that we’ll explore in Chapter 4.


    ### 2.3.1 The divide-and-conquer method


    Many useful algorithms are ***recursive*** in structure: to solve a given problem,
    they ***recurse*** (call themselves) one or more times to handle closely related
    subproblems. These algorithms typically follow the ***divide-and-conquer*** method:
    they break the problem into several subproblems that are similar to the original
    problem but smaller in size, solve the subproblems recursively, and then combine
    these solutions to create a solution to the original problem.


    In the divide-and-conquer method, if the problem is small enough—the ***base case***—you
    just solve it directly without recursing. Otherwise—the ***recursive case*** —you
    perform three characteristic steps:


    - **Divide** the problem into one or more subproblems that are smaller instances
    of the same problem.

    - **Conquer** the subproblems by solving them recursively.

    - **Combine** the subproblem solutions to form a solution to the original problem.


    The ***merge sort*** algorithm closely follows the divide-and-conquer method.
    In each step, it sorts a subarray $A[p \dots r]$, starting with the entire array
    $A[1 \dots n]$ and recursing down to smaller and smaller subarrays. Here is how
    merge sort operates:


    - **Divide** the subarray $A[p \dots r]$ to be sorted into two adjacent subarrays,
    each of half the size. To do so, compute the midpoint $q$ of $A[p \dots r]$ (taking
    the average of $p$ and $r$), and divide $A[p \dots r]$ into subarrays $A[p \dots
    q]$ and $A[q+1 \dots r]$.

    - **Conquer** by sorting each of the two subarrays $A[p \dots q]$ and $A[q+1 \dots
    r]$ recursively using merge sort.

    - **Combine** by merging the two sorted subarrays $A[p \dots q]$ and $A[q+1 \dots
    r]$ back into $A[p \dots r]$, producing the sorted answer.


    The recursion “bottoms out”—it reaches the base case—when the subarray $A[p \dots
    r]$ to be sorted has just 1 element, that is, when $p$ equals $r$. As we noted
    in the initialization argument for INSERTION-SORT’s loop invariant, a subarray
    comprising just a single element is always sorted.


    The key operation of the merge sort algorithm occurs in the “combine” step, which
    merges two adjacent, sorted subarrays. The merge operation is performed by the
    auxiliary procedure $MERGE(A, p, q, r)$ on the following page, where $A$ is an
    array and $p, q,$ and $r$ are indices into the array such that $p \le q \le r$.
    The procedure assumes that the adjacent subarrays $A[p \dots q]$ and $A[q+1 \dots
    r]$ were already recursively sorted. It ***merges*** the two sorted subarrays
    to form a single sorted subarray that replaces the current subarray $A[p \dots
    r]$.


    To understand how the MERGE procedure works, let’s return to our card-playing
    motif. Suppose that you have two piles of cards face up on a table. Each pile
    is sorted, with the smallest-value cards on top. You wish to merge the two piles
    into a single sorted output pile, which is to be face down on the table. The basic
    step consists of choosing the smaller of the two cards on top of the face-up piles,
    removing it from its pile—which exposes a new top card—and placing this card face
    down onto the output pile. Repeat this step until one input pile is empty, at
    which time you can just take the remaining input pile and flip over the entire
    pile, placing it face down onto the output pile.


    Let’s think about how long it takes to merge two sorted piles of cards. Each basic
    step takes constant time, since you are comparing just the two top cards. If the
    two sorted piles that you start with each have $n=2$ cards, then the number of
    basic steps is at least $n/2$ (since in whichever pile was emptied, every card
    was found to be smaller than some card from the other pile) and at most $n$ (actually,
    at most $n-1$, since after $n-1$ basic steps, one of the piles must be empty).
    With each basic step taking constant time and the total number of basic steps
    being between $n/2$ and $n$, we can say that merging takes time roughly proportional
    to $n$. That is, merging takes $\Theta(n)$ time.


    In detail, the MERGE procedure works as follows. It copies the two subarrays $A[p
    \dots q]$ and $A[q+1 \dots r]$ into temporary arrays $L$ and $R$ (“left” and “right”),
    and then it merges the values in $L$ and $R$ back into $A[p \dots r]$. Lines 1
    and 2 compute the lengths $n_L$ and $n_R$ of the subarrays $A[p \dots q]$ and
    $A[q+1 \dots r]$, respectively.


    ```text

    MERGE(A, p, q, r)

    1  nL = q - p + 1              // length of A[p..q]

    2  nR = r - q                  // length of A[q+1..r]

    3  let L[0..nL-1] and R[0..nR-1] be new arrays

    4  for i = 0 to nL-1          // copy A[p..q] into L[0..nL-1]

    5    L[i] = A[p+i]

    6  for j = 0 to nR-1          // copy A[q+1..r] into R[0..nR-1]

    7    R[j] = A[q+1+j]

    8  i = 0                       // i indexes the smallest element in L

    9  j = 0                       // j indexes the smallest element in R

    10 k = p                      // k indexes the location in A

    11 while i < nL and j < nR     // As long as each of L and R contains an unmerged
    element,

    12   copy the smallest unmerged element back into A[p..r].

    13   if L[i] <= R[j]

    14     A[k] = L[i]

    15     i = i + 1

    16   else

    17     A[k] = R[j]

    18     j = j + 1

    19   k = k + 1

    20 // Having gone through one of L and R entirely, copy the

    21 // remainder of the other to the end of A[p..r].

    22 while i < nL

    23   A[k] = L[i]

    24   i = i + 1

    25   k = k + 1

    26 while j < nR

    27   A[k] = R[j]

    28   j = j + 1

    29   k = k + 1

    ```


    Line 3 creates $L[0 \dots n_L-1]$ and $R[0 \dots n_R-1]$ with respective lengths
    $n_L$ and $n_R$. The loop of lines 4–5 copies $A[p \dots q]$ into $L$, and the
    loop of lines 6–7 copies $A[q+1 \dots r]$ into $R$. Lines 8–18, illustrated in
    Figure 2.3, perform the basic steps. The while loop of lines 12–18 repeatedly
    identifies the smallest value in $L$ and $R$ that has yet to. This procedure is
    the rare case that uses both 1-indexing (for array $A$) and 0-indexing (for arrays
    $L$ and $R$). Using 0-indexing for $L$ and $R$ makes a simpler loop invariant.


    Exercise 2.3-3.

