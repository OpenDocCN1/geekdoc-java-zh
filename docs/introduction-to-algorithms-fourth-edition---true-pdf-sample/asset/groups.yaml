    ## 27.2 维护搜索列表


    795


    ### 练习


    ***27.1-1***

    假设在进行对冲策略时，你在爬楼梯之前等待了 $p$ 分钟，而不是 $k$ 分钟。竞争率作为 $p$ 和 $k$ 的函数是多少？你应该如何选择 $p$ 以使竞争率最小？


    ***27.1-2***

    想象你决定去滑雪雪。假设一对滑雪板每天的租赁费用为 $r$ 元，购买费用为 $b$ 元，其中 $b > r$。如果你预先知道自己会滑多少天，那么决定租用还是购买将是很容易。如果你会滑至少
    $db/r$ 天，那么你应该买滑雪板，否则应该租用。这种策略可以使你的总支出最小。在现实中，你并不知道自己 最终会滑多少天。即使在你已经滑了几次之后，你仍然不知道未来还会滑多少次。但你不想浪费钱。请给出并分析一个竞争比为
    2 的算法，即该算法保证无论你滑了多少次，你的花费都不会超过你如果从一开始就知道要滑多少次所花费的两倍。


    ***27.1-3***

    在一种单人游戏的“集中独占牌”中，你有 $n$ 对匹配的卡片。卡片的背面都是完全相同的，但正面有动物图片。有一对是斑马，有一对是熊，有一对是骆驼，以此类推。游戏开始时，所有卡片都朝下放置。在每一轮中，你可以翻开两张卡片以显示它们的图片。如果图片匹配，你就可以从游戏中移除那对卡片。如果不匹配，你就将它们都翻过去，再次隐藏图片。当你移除所有
    $n$ 对卡片时，游戏结束，你的得分是完成这一操作所需的轮数。假设你可以记住见过的每张卡片的图片。请给出一个竞争比为 2 的独占牌算法。


    ## 27.2 维护搜索列表


    下一个在线算法的示例涉及维护链表中的元素顺序，如第 10.2 节所示。这个问题在哈希表中经常出现，当通过链链法解决冲突（见第 11.2 节）时，因为每个槽都包含一个链表。重新排列每个槽中元素的链表可以显著提高搜索性能。


    第 32 节练习


    BWT 是最右侧的一列，`agtbaa$ur`（行编号有助于理解如何计算逆 BWT。）BWT 在生物信息学中有许多应用，它也可以作为文本压缩的一个步骤。这是因为它倾向于将相同的字符放在一起，例如
    `rutabaga` 的 BWT，它将两个 `a` 放在在了一起。当相同字符被放在一起，甚至是相邻位置时，额外的压缩手段就可用了。在 BWT 之后，移动到前端编码（move-to-front
    encoding）、游程编码（run-length encoding）和霍夫曼编码（见第 15.3 节）的组合提供了显著的文本压缩。BWT 的压缩率往往随着文本长度的增加而提高。


    a. 给定 $T$ 的后缀数组，展示如何在 $\Theta(n)$ 时间内计算 BWT。为了解压缩，BWT 必须是可逆的。假设字母表大小是常数，可以从 BWT
    在 $\Theta(n)$ 时间内计算逆 BWT。让我们看看 `rutabaga` 的 BWT，记作 $BWT[]$。BWT 中的每个字符都有一个从 1 到
    $n$ 的唯一字典序排名。将 $BWT[i]$ 的排名标记为 $rank[i]$。如果一个字符在 BWT 中出现多次，该字符的每个实例的排名比其上一个实例大
    1。以下是 `rutabaga` 的 BWT 和排名：


    | $i$ | $BWT[i]$ | $rank[i]$ |

    | :--- | :--- | :--- |

    | 1 | a | 2 |

    | 2 | g | 6 |

    | 3 | t | 8 |

    | 4 | b | 5 |

    | 5 | a | 3 |

    | 6 | a | 4 |

    | 7 | $ | 1 |

    | 8 | u | 9 |

    | 9 | r | 7 |


    例如，$rank[1] = 2$ 是因为 $BWT[1] = a$，且在字典序上位于第一个 `a` 之前的唯一字符是 `$`（我们定义 `$` 在所有其他字符之前，因此它的排名为
    1）。接下来，我们有 $rank[2] = 6$，是因为 $BWT[2] = g$，且 BWT 中在字典序上位于 `g` 之前的五个字符：`$`、三个 `a`
    和 `b`。跳到 $rank[5] = 3$，是因为 $BWT[5] = a$，而且由于这个 `a` 是 BWT 中第二个 `a` 实例，它的排名值比位置
    1处上一个 `a` 实例的排名值大 1。


    $BWT$ 和 $rank$ 中包含了足够的信息来从后往前重构 $T$。假设你知道字符 $c$ 在 $T$ 中的排名 $r$。那么 $c$ 就是排序后的循环旋转第
    $r$ 行的第一个字符。第 $r$ 行的最后一个字符必须是 $T$ 中在 $c$ 之前的字符。但你知道哪个字符是第 $r$ 行的最后一个字符，因为它是 $BWT[r]$。从后往前重构
    $T$，从 `$` 开始，你可以在 $BWT$ 中找到它。然后使用 $BWT$ 和 $rank$ 向后重构 $T$。


    让我们看看这个策略对于 `rutabaga` 是如何工作的。$T$ 的最后一个字符 `$` 出现在 $BWT$ 的第 7 位。由于 $rank[7] = 1$，
    $T$ 的排序循环旋转的第 1 行以 `$` 开始。$T$ 中在 `$` 之前的字符是第 1 行的最后一个字符，即 $BWT[1]: a$。现在我们知道 $T$
    的最后两个字符是 `aa`。查找发现，有 $rank[1] = 2$，所以 $T$ 的排序循环旋转的第 2 行以 `a` 开始。$T$ 中在 `a` 之前的字符是第
    2 行的最后一个字符，即 $BWT[2]: g$。现在我们知道 $T$ 的最后三个字符是 `ag`。继续下去，我们 $rank[2] = 6$，所以 $T$
    的排序循环旋转的第 6 行以 `g` 开始。$T$ 中在 `g` 之前的字符是第 6 行的最后一个字符，即 $BWT[6]: a$。现在我们知道 $T$ 的最后四个字符是
    `aga`。因为 $rank[6] = 4$， $T$ 的排序循环旋转的第 4 行以 `a` 开始。$T$ 中在 `a` 之前的字符是第 4 行的最后一个字符，即
    $BWT[4]: b$。现在我们知道 $T$ 的最后五个字符是 `agab`。以此类推，直到 $T$ 的所有 $n$ 个字符都已识别出来。


    b. 给定数组 $BWT[]$，在 $\Theta(n)$ 时间内计算数组 $rank[]$，假设字母表大小为常数。


    c. 给定数组 $BWT[]$ 和 $rank[]$，在 $\Theta(n)$ 时间内计算 $T$。


    ### 章节注释


    字符串匹配与有限状态机的关系由 Aho、Hopcroft 和 Ullman [5] 讨论。Knuth-Morris-Pratt 算法 [267] 由 Knuth
    和 Pratt 以及 Morris 独立发明，但他们共同发表了工作。Matiyasevich [317] 早期发现了一种类似的算法，仅适用于两个字符的字母表，并且是为具有二维带的图灵机指定的。Reingold、Urban
    和 Gries [377] 对 Knuth-Morris-Pratt 算法给另一种处理。Rabin-Karp 算法由 Karp 和 Rabin [250]
    提出。Galil 和 Seiferas [173] 提供了一种有趣的确定性线性时间字符串匹配算法，除了存储模式和文本所需的空间外仅使用 O(1) 空间。


    第 32.5 节的后缀数组算法来自 Manber 和 Myers [312]，他们首次提出了后缀数组的概念。这里提出的计算最公共前缀数组的线性时间算法来自
    Kasai 等人 [252]。题 32-2 基于 Käräläinen、Sanders 和 Burkhardt [245] 的 DC3 算法。关于后缀数组算法的综述，参见
    Puglisi、Smyth 和 Turpin [370] 的文章。要了解更多关于题 32-3 的 Burrows-Wheeler 变换，请参见 Burrows
    和 Wheeler [78] 以及 Manzini [314] 的文章。


