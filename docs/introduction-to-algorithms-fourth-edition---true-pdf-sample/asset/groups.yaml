    ## 5.3 Randomized algorithms


    139


    PERMUTE-WITH-ALL(A, n)

    1 for i = 1 to n

    2 swap A[i] with A[RANDOM(1, n)]


    ***


    Professor Knievel suggests the procedure PERMUTE-BY-CYCLE to generate a uniform
    random permutation. Show that each element A[i] has a 1/n probability of winding
    up in any particular position in B . Then show that Professor Knievel is mistaken
    by showing that the resulting permutation is not uniformly random.


    PERMUTE-BY-CYCLE(A, n)

    1 let B[1..n] be a new array

    2 offset = RANDOM(1, n)

    3 for i = 1 to n

    4 dest = i + offset

    5 if dest > n

    6 dest = dest - n

    7 B[dest] = A[i]

    8 return B


    ***

    Professor Gallup wants to create a **random sample** of the set {1, 2, 3; ...;
    n}, that is, an m-element subset S , where 0 ≤ m ≤ n, such that each m-subset
    is equally likely to be created. One way is to set A[i] = i , for i = 1; 2; 3;
    ...; n, call RANDOMLY-PERMUTE(A), and then take just the first m array elements.
    This method makes n calls to the RANDOM procedure. In Professor Gallup’s application,
    n is much larger than m, and so the professor wants to create a random sample
    with fewer calls to RANDOM.


    RANDOM-SAMPLE(m, n)

    1 S = {}

    2 for k = n - m + 1 to n

    3 // iterates m times

    4 i = RANDOM(1, k)

    5 if i ∉ S

    6 S = S U {k}

    7 else S = S U {i}

    8 return S


