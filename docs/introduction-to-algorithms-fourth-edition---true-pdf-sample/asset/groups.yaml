    $x$ 有属性 $f$，我们用 $x.f$ 表示该属性。


    我们将代表数组或对象的变量视为指向数组或对象的指针（在某些编程语言中称为引用）。例如，如果 $x$ 是调用过程的参数，赋值 $y = x$ 会导致 $y.f$
    等于 $x.f$。此外，如果我们现在设置 $x.f = 3$，那么不仅 $x.f$ 等于 3，$y.f$ 也是如此。也就是说，赋值后 $x$ 和 $y$ 指向同一个对象。


