    ## 1.2 Algorithms as a technology


    For a concrete example, let us pit a faster computer (computer A) running insertion
    sort against a slower computer (computer B) running merge sort. They each must
    sort an array of 10 million numbers. (Although 10 million numbers might seem like
    a lot, if the numbers are eight-byte integers, then the input occupies about 80
    megabytes, which fits in the memory of even an inexpensive laptop many times over.)
    Suppose that computer A executes 10 billion instructions per second (faster than
    any single sequential computer at the time of this writing) and computer B executes
    only 10 million instructions per second (much slower than most contemporary computers),
    so that computer A is 1000 times faster than computer B in raw computing power.
    To make the difference even more dramatic, suppose that the world’s craftiest
    programmer codes insertion sort in machine language for computer A, and the resulting
    code requires $2n^2$ instructions to sort $n$ numbers. Suppose further that just
    an average programmer implements merge sort, using a high-level language with
    an inefficient compiler, with the resulting code taking $50n \lg n$ instructions.
    To sort 10 million numbers, computer A takes


    $\frac{2(10^7)^2}{10^{10} \text{ instructions/second}} = 2(10^4) = 20,000 \text{
    seconds (more than 5 hours)}$


    while computer B takes


    $\frac{50(10^7) \lg 10^7}{10^7 \text{ instructions/second}} \approx 1163 \text{
    seconds (under 20 minutes)}$


    By using an algorithm whose running time grows more slowly, even with a poor compiler,
    computer B runs more than 17 times faster than computer A! The advantage of merge
    sort is even more pronounced when sorting 100 million numbers: where insertion
    sort takes more than 3 days, merge sort takes under four hours. Although 100 million
    might seem like a large number, there are more than 100 million web searches every
    hour, more than 100 million emails sent every minute, and some of the smallest
    galaxies (known as ultracompact galaxies) contain about 100 million stars. In
    general, as the problem size increases, so does the relative advantage of merge
    sort.


    ## Algorithms and other technologies


    The example above shows that you should consider algorithms, like software, as
    a technology. Total system performance depends on choosing efficient algorithms
    as much as on fast hardware. Just as rapid advances are made in other technologies,
    they are being made in algorithms as well. You might wonder whether algorithms
    are truly important in light of other technologies, such as advanced computer
    architectures, easy-to-use, intuitive graphical user interfaces (GUIs), object-oriented
    systems, integrated web technologies, fast networking, both wired and wireless,
    and mobile devices.


    The answer is yes. Although some applications do not require algorithmic content
    at the application level (such as some simple web-based applications), many do.
    For example, consider a web-based service that determines how to travel from one
    location to another. Its implementation would rely on fast hardware, graphical
    user interface, wide-area networking, and also possibly orientation. It would
    also require algorithms for operations such as finding routes (probably using
    a shortest-path algorithm), rendering maps, and interpolating addresses.


    Moreover, even an application that does not require algorithmic content at the
    application level relies heavily upon algorithms:


    - Does the application rely on fast hardware?

    - Does the application rely on graphical user interfaces?

    - Does the application rely on networking?

    - Was the application written in a language other than machine code? Then it was
    processed by a compiler, interpreter, or assembler, all of which make extensive
    use of algorithms.


    Algorithms are at the core of most technologies used in contemporary computers.
    Machine learning can be thought of as a method for performing algorithmic tasks
    without explicitly designing an algorithm, but instead inferring patterns from
    data and thereby learning a solution. At first glance, machine learning, which
    automates the process of algorithmic design, may seem to make learning about algorithms
    obsolete. The opposite is true, however. Machine learning is itself a collection
    of algorithms, just under a different name. Furthermore, currently seems that
    the successes of machine learning are mainly for problems which we, as humans,
    do not really understand what the right algorithm is. Prominent examples include
    computer vision and automatic language translation. For algorithmic problems that
    humans understand well, such as most of the problems in this book, efficient algorithms
    designed to solve a specific problem are typically more successful than machine-learning
    approaches.


    Data science is an interdisciplinary field with the goal of extracting knowledge
    and insights from structured and unstructured data. Data science uses methods
    from statistics, computer science, and optimization. The design and analysis of
    algorithms is fundamental to the field. The core techniques of data science, which
    overlap significantly with those in machine learning, include many of the algorithms
    in this book.


    Furthermore, with the ever-increasing capacities of computers, we use them to
    solve larger problems than ever before. As we saw in the above comparison between
    insertion sort and merge sort, it is at larger problem sizes that the differences
    in efficiency between algorithms become particularly prominent.


    Having a solid base of algorithmic knowledge and technique is one characteristic
    that defines the truly skilled programmer. With modern computing technology, you
    can accomplish some tasks without knowing much about algorithms, but with a good
    background in algorithms, you can do much, much more.


    ## Exercises


    ### 1.2-1

    Give an example of an application that requires algorithmic content at the application
    level, and discuss the function of the algorithms involved.


    ### 1.2-2

    Suppose that for inputs of size $n$ on a particular computer, insertion sort runs
    in $8n^2$ steps and merge sort runs in $64n \lg n$ steps. For which values of
    $n$ does insertion sort beat merge sort?


    ### 1.2-3

    What is the smallest value of $n$ such that an algorithm whose running time is
    $100n^2$ runs faster than an algorithm whose running time is $2^n$ on the same
    machine?


