    ## 第2章 入门


    被调用的过程对调用过程是不可见的。然而，赋值语句 $x := *f * 3$ 如果调用过程有一个指向与 $x$ 相同对象的指针，那么它是可见的。同样，数组是通过指针传递的，因此传递的是数组的指针而不是整个数组，而且对单个数组元素的修改对调用过程来说是可见的。同样，大多数现代编程语言都是这样工作的。


    **return** 语句立即将控制权传回到调用过程中的调用点。大多数 **return** 语句还会取一个值并传递给调用者。我们的伪代码与许多编程语言不同之处在于，我们允许在单个
    **return** 语句中返回多个值，而无需创建对象将它们打包在一起。⁸ Python 的元组表示允许 **return** 语句返回多个值，而无需从程序员定义的类中创建对象。


    布尔运算符“and”和“or”是***短路***的。也就是说，通过先求值 x 来评估表达式“x and y”。如果 x 的结果为 FALSE，则整个表达式就不可能为
    TRUE，因此不再求值 y。相反，如果 x 的结果为 TRUE，则必须求值 y 以确定整个表达式的值。同样，在表达式“x or y”中，只有当 x 的结果为
    FALSE 时，才会求值表达式 y。短路运算符允许我们编写如“x ≠ NIL and x:*f * = y”之类的布尔表达式，而无需担心当 x 为 NIL
    时求值 x:*f 会发生什么。


    关键字 **error** 表示发生了错误，因为不满足调用该过程的条件，该过程会立即终止。调用过程负责处理错误，因此我们不指定要采取什么行动。


    **练习题**


    ***2.1-1***

    以图 2.2 为模型，说明插入排序（INSERTION-SORT）对一个初始包含序列 $\langle 31, 41, 59, 26, 41, 58 \rangle$
    的数组的操作。


    ***2.1-2***

    考虑对应页上的 SUM-ARRAY 过程。它计算数组 $A[1 \dots n]$ 中 $n$ 个数字的和。为该过程说明一个循环不变性，并利用它的初始化、维护和终止属性证明
    SUM-ARRAY 过程返回了 $A[1 \dots n]$ 中数字的和。


    SUM-ARRAY($A; n$):

    1. *sum := 0*

    2. **for** i = 1 **to** n

    3. *sum := sum + A[i]*

    4. **return** *sum*


    ***2.1-3***

    重写 INSERTION-SORT 过程，使其按单调递减而不是单调递增的排序。


    ***2.1-4***

    考虑**搜索问题**：

    **输入**：存储在数组 $A[1 \dots n]$ 中的 $n$ 个数字序列 $\langle a_1, a_2, \dots, a_n \rangle$
    和一个值 $x$。

    **输出**：一个索引 $i$，使得 $x$ 等于 $A[i]$；如果 $x$ 不在 $A$ 中，则返回特殊值 NIL。

    为**线性搜索**（linear search）编写伪代码，它从头到尾扫描数组以寻找 $x$。使用循环不变性证明你的算法是正确的。确保你的循环不变性满足三个必要的属性。


    ***2.1-5***

    考虑将两个 $n$ 位二进制整数 $a$ 和 $b$ 相加的问题，存储在两个 $n$ 元素的数组 $A[0 \dots n-1]$ 和 $B[0 \dots
    n-1]$ 中，每个元素为 0 或 1，$a = \sum_{i=0}^{n-1} A[i] 2^i$，且 $b = \sum_{i=0}^{n-1} B[i]
    2^i$。和 $c = a + b$（这两个整数的和）应该以二进制形式存储在 $(n+1)$ 个元素的数组 $C[0 \dots n]$ 中，其中 $c =
    \sum_{i=0}^{n} C[i] 2^i$。编写一个过程 ADD-BINARY-INTEGERS（输入为数组 $A$ 和 $B$ 以及长度 $n$，并返回持有和的数组
    $C$）。


    ## 2.2 算法分析


    **分析**算法已经意味着预测算法所需的资源。你可能需要考虑内存、通信带宽或能量消耗等资源。然而，通常你希望测量计算时间。如果你对一个问题分析几个候选算法，就可以识别出效率最高的一个。可能不止一个候选算法，但你通常可以在过程中排除较差的算法。


    在分析算法之前，你需要一个它所运行的技术平台模型，包括该技术的资源以及表达其成本的方法。本书的大部分内容假设一种通用的单处理器随机访问机器（RAM）计算模型，其前提是算法是一个接一个地执行的，没有并发操作。RAM
    模型假设每条指令所需的时间与其他任何指令相同，且每次数据访问——使用变量的值或将其存储到变量中——所需的时间与任何其他数据访问相同。换句话说，在 RAM 模型中，每条指令或数据访问都花费恒定的时间。严格来说，我们应该精确地定义
    RAM 模型的指令及其成本。然而，这样做将非常枯燥，并且对算法的设计和分析几乎没有帮助。尽管如此，我们必须小心不要滥用 RAM 模型。例如，如果 RAM 有一条用于排序的指令呢？那么你只需要一步就能完成排序。这样的
    RAM 是不现实的，因为此类指令在真实计算机中并不存在。因此，我们的指导标准是真实计算机是如何工作的。RAM 模型包含了真实计算机中常见的指令：算术（如加、减、乘、除、取余、取整、向上取整）、数据移动（加载、存储、拷贝）和控制（条件分支和无条件分支、过程调用和返回）。


    RAM 模型中的数据类型有整数、浮点数（用于存储近似值）和字符。真实计算机通常没有布尔值 TRUE 和 FALSE 的单独数据类型。相反，它们通常会测试整数值是否为
    0（FALSE）或非零（TRUE），正如 C 语言一样。尽管我们通常不关心浮点数的精度（许多数字无法精确表示），但精度对于大多数应用至关重要。我们还假设每个数据字的位数都有限制。例如，在处理大小为
    $n$ 的输入时，我们假设给定数组的每个元素占据相同的字节，且给定数组的元素存储在连续的内存位置上。例如，如果数组 $A[1 \dots n]$ 从内存地址
    0 开始，且每个元素占据相同的字节，那么 $A[1 \dots n]$ 存储在连续的内存位置上。


