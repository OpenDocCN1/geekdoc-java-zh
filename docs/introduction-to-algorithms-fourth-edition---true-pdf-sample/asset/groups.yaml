- md: "\n## 2 Getting Started\n\nThis chapter will familiarize you with the framework\
    \ we’ll use throughout the book to think about the design and analysis of algorithms.\
    \ It is self-contained, but it does include several references to material that\
    \ will be introduced in Chapters 3 and 4. (It also contains several summations,\
    \ which Appendix A shows how to solve.)\n\nWe’ll begin by examining the insertion\
    \ sort algorithm to solve the sorting problem introduced in Chapter 1. We’ll specify\
    \ algorithms using a pseudocode that should be understandable to you if you have\
    \ done computer programming. We’ll see why insertion sort correctly sorts and\
    \ analyze its running time. The analysis introduces a notation that describes\
    \ how running time increases with the number of items to be sorted. Following\
    \ a discussion of insertion sort, we’ll use a method called divide-and-conquer\
    \ to develop a sorting algorithm called merge sort. We’ll end with an analysis\
    \ of merge sort’s running time.\n\n### 2.1 Insertion sort\n\nOur ﬁrst algorithm,\
    \ insertion sort, solves the ***sorting problem*** introduced in Chapter 1:\n\n\
    **Input:** A sequence of $n$ numbers $\\langle a_1, a_2, \\dots, a_n \\rangle$.\n\
    \n**Output:** A permutation (reordering) $\\langle a^0_1, a^0_2, \\dots, a^0_n\
    \ \\rangle$ (of the input sequence such that $a^0_1 \\le a^0_2 \\le \\dots \\\
    le a^0_n$).\n\nThe numbers to be sorted are also known as the ***keys***. Although\
    \ the problem is conceptually about sorting a sequence, the input comes in the\
    \ form of an array with $n$ elements. When we want to sort numbers, it’s often\
    \ because they are the keys associated with other data, which we call ***satellite\
    \ data***. Together, a key and satellite data form a ***record***. For example,\
    \ consider a spreadsheet containing student-records with many associated pieces\
    \ of data such as age, grade-point average, and number of courses taken. Any one\
    \ of these quantities could be a key, but when the spreadsheet sorts, it moves\
    \ the associated record (the satellite data) with the key. When describing a sorting\
    \ algorithm, we focus on the keys, but it is important to remember that there\
    \ usually is associated satellite data.\n\nIn this book, we’ll typically describe\
    \ algorithms as procedures written in a ***pseudocode*** that is similar in many\
    \ respects to C, C++, Java, Python,¹¹ or JavaScript. (Apologies if we’ve omitted\
    \ your favorite programming language. We can’t list them all.) If you have been\
    \ introduced to any of these languages, you should have little trouble understanding\
    \ algorithms “coded” in pseudocode. What separates pseudocode from real code is\
    \ that in pseudocode, we employ whatever expressive method is most clear and concise\
    \ to specify a given algorithm. Sometimes the clearest method is English, so do\
    \ not be surprised if you come across an English phrase or sentence embedded within\
    \ a section that looks more like real code. Another difference between pseudocode\
    \ and real code is that pseudocode often ignores aspects of software engineering—such\
    \ as data abstraction, modularity, and error handling—in order to convey the essence\
    \ of the algorithm more concisely.\n\nWe start with ***insertion sort***, which\
    \ is an efficient algorithm for sorting a small number of elements. Insertion\
    \ sort works the way you might sort a hand of playing cards. Start with an empty\
    \ left hand and the cards in a pile on the table. Pick up the first card in the\
    \ pile and hold it with your left hand. Then, with your right hand, remove one\
    \ card at a time from the pile, and insert it into the correct position in your\
    \ left hand. As Figure 2.1 illustrates, you find the correct position for a card\
    \ by comparing it with each of the cards already in your left hand, starting at\
    \ the right and moving left. As soon as you see a card in your left hand whose\
    \ value is less than or equal to the card you’re holding in your right hand, insert\
    \ the card that you’re holding in your right hand just to the right of this card\
    \ in your left hand. If all the cards in your left hand have values greater than\
    \ the card in your right hand, then place this card as the leftmost card in your\
    \ left hand. At all times, the cards held in your left hand are sorted, and these\
    \ cards were originally the top cards of the pile on the table.\n\nThe pseudocode\
    \ for insertion sort is given as the procedure INSERT-SORT on the facing page.\
    \ It takes two parameters: an array $A$ containing the values to be sorted and\
    \ the number $n$ of values of sort. The values occupy positions $A[1]$ through\
    \ $A[n]$ of the array, which we denote by $A[1 \\dots n]$. When the INSERT-SORT\
    \ procedure is finished, array $A[1 \\dots n]$ contains the original values, but\
    \ in sorted order.\n\n¹ If you’re familiar with only Python, you can think of\
    \ arrays as similar to Python lists.\n\n[Figure 2.1: Sorting a hand of cards.\
    \ A sequence of cards with values 2 4 3 1 4 5 7 10 is being moved from a pile\
    \ into a sorted left-hand sequence.]\n\n[Figure 2.2: The INSERT-SORT algorithm.\n\
    ```\nINSERT-SORT(A, n)\nfor i = 2 to n\n    key = A[i]\n    j = i - 1\n    while\
    \ j > 0 and A[j] > key\n        A[j+1] = A[j]\n        j = j - 1\n    A[j+1] =\
    \ key\n```\n"
  mdcn: "\n\n## 2 入门\n\n本章将使你熟悉我们在书中将使用的框架，用以思考算法的设计和分析。本章是自包含的，但它包含了对第 3 章和第 4 章将介绍的材料的引用。（它还包含了几个求和，附录\
    \ A 展示了如何求解这些求和。）\n\n我们将首先通过检查插入排序算法来解决第 1 章中引入的排序问题。我们将使用伪代码来指定算法，如果你做过计算机编程，这些伪代码对你来说是可以理解的。我们将看到为什么插入排序能够正确地排序，并分析它的运行时间。该分析引入了一种符号，用于描述运行时间如何随待排序元素数量的增加而增加。在讨论插入排序后，我们将使用一种称为“分治”的方法来开发一种名为“合并排序”的排序算法。我们将以对合并排序运行时间的分析结束。\n\
    \n### 2.1 插入排序\n\n我们的第一个算法——插入排序，解决了第 1 章中引入的***排序问题***：\n\n**输入：** 一个包含 $n$ 个数字的序列\
    \ $\\langle a_1, a_2, \\dots, a_n \\rangle$。\n\n**输出：** 一个排列序列 $\\langle a_1,\
    \ a_2, \\dots, a_n \\rangle$。\n\n待排序的数字被称为***键***（keys）。虽然问题本质上是关于排序的，但输入通常是以包含\
    \ $n$ 个元素的数组形式呈现。我们将这些数据称为***卫星数据***（satellite data）。例如，考虑一个包含年龄、平均分和课程数量的记录，键和卫星数据共同构成***记录***。在描述排序算法时，我们关注的是键，但重要的是记住，这些数据通常是\
    \ $n$ 个元素中的一个，我们移动***卫星数据***。\n\n在书中，我们通常使用类似于 C、C++、Python 或 JavaScript 的***伪代码***来描述算法。（抱歉我们没有列出所有语言。）如果你接触过这些语言中的任何一种，应该不难理解用伪代码“编码”算法。伪代码与真实代码的区别在于，在伪代码中我们使用最清晰简洁的方式来指定。伪代码与真实代码的区别在于，伪代码通常忽略了软件工程的方面（如数据抽象、模块化和错误处理），以便更简洁地传达算法的本质。\n\
    \n我们从***插入排序***开始，这是一种对少量元素进行排序的高效算法。插入排序的工作方式就像洗牌。从空手和桌子上的堆牌开始。拿起堆中的第一张牌放在左手。然后，用右手每次从堆中取出一张牌，将其插入到左手的正确位置。如图\
    \ 2.1 所示，你通过与左手中已有的牌进行比较（从右向左移动）来找到牌的正确位置。一旦在左手中看到一张值小于或等于右手牌的牌，就将右手牌插入到左手中该牌的右侧。如果左手中所有牌的值都比右手牌大，则将这张牌放在左手的最左侧。在任何时刻，左手中的牌都是有序的，而这些牌原本是桌子上堆中的牌。\n\
    \n插入排序的伪代码在对页的 INSERT-SORT 程序所示。它接受两个参数：一个包含待排序值的数组 $A$ 以及待排序值的数量 $n$。这些值占据数组从\
    \ $A[1]$ 到 $A[n]$ 的位置，我们记为 $A[1 \\dots n]$。当 INSERT-SORT 程序完成后，数组 $A[1 \\dots\
    \ n]$ 包含了原始值，但已按顺序排列。\n\n¹ 如果你只熟悉 Python，可以将数组 比 Python 列表。\n\n[图 2.1：排序手牌。一组值为\
    \ 2 4 3 1 4 5 7 10 的牌正在从堆中移动到有序的左手序列中。]\n\n[图 2.2：INSERT-SORT 算法。\n```\nINSERT-SORT(A,\
    \ n)\nfor i = 2 to n\n    key = A[i]\n    j = i - 1\n    while j > 0 and A[j]\
    \ > key\n        A[j+1] = A[j]\n        j = j - 1\n    A[j+1] = key\n```\n]\n"
