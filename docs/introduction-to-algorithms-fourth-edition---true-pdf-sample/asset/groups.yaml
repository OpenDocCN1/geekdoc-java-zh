    ## 1 The Role of Algorithms in Computing


    What are algorithms? Why is the study of algorithms worthwhile? What is the role

    of algorithms relative to other technologies used in computers? This chapter will

    answer these questions.


    ### 1.1 Algorithms


    Informally, an ***algorithm*** is any well-defined computational procedure that
    takes

    some value, or set of values, as ***input*** and produces some value, or set of
    values, as

    ***output*** in a finite amount of time. An algorithm is thus a sequence of computational

    steps that transform the input into the output.


    You can also view an algorithm as a tool for solving a well-specified ***computational-problem***.
    The statement of the problem specifies in general terms the desired

    input/output relationship for problem instances, typically of arbitrarily large
    size.

    The algorithm describes a specific computational procedure for achieving that-input/output
    relationship for all problem instances.


    As an example, suppose that you need to sort a sequence of numbers into monotonically
    increasing order. This problem arises frequently in practice and provides

    fertile ground for introducing many standard design techniques and analysis tools.

    Here is how we formally define the ***sorting problem***:


    **Input:** A sequence of $n$ numbers $\langle a_1; a_2; \dots; a_n \rangle$.


    **Output:** A permutation (reordering) $\langle a^{(1)}; a^{(2)}; \dots; a^{(n)}
    \rangle$ (of the input sequence) such that $a^{(1)} \le a^{(2)} \le \dots \le
    a^{(n)}$.


    Thus, given the input sequence $\langle 31; 41; 59; 26; 41; 58 \rangle$, a correct
    sorting algorithm

    returns as output the sequence $\langle 26; 31; 41; 41; 58; 59 \rangle$. Such
    an input sequence is

    called an ***instance*** of the sorting problem. In general, an ***instance of
    a problem***¹ (are themselves simply called “problems.”) consists of the input
    (satisfying whatever constraints are imposed in the problem

    statement) needed to compute a solution to the problem.


    Because many programs use it as an intermediate step, sorting is a fundamental

    operation in computer science. As a result, you have a large number of good sorting
    algorithms at your disposal. Which algorithm is best for a given application

    depends on—among other factors—the number of items to be sorted, the extent

    to which the items are already somewhat sorted, possible restrictions on the item

    values, the architecture of the computer, and the kind of storage devices to be
    used: main memory, disks, or even—archaically—tapes.


    An algorithm for a computational problem is ***correct*** if, for every problem
    instance provided as input, it ***halts***—finishes its computing in finite time—and
    outputs the correct solution to the problem instance. A correct algorithm ***solves***
    the

    given computational problem. An incorrect algorithm might not halt at all on some

    input instances, or it might halt with an incorrect answer. Contrary to what

    you might expect, incorrect algorithms can sometimes be useful, if you can control

    their error rate. We’ll see an example of an algorithm with a controllable error
    rate

    in Chapter 31 when we study algorithms for finding large prime numbers. Ordinarily,
    however, we’ll concern ourselves only with correct algorithms.


    An algorithm can be specified in English, as a computer program, or even as

    a hardware design. The only requirement is that the specification must provide
    a

    precise description of the computational procedure to be followed.


    **What kinds of problems are solved by algorithms?**


    Sorting is by no means the only computational problem for which algorithms have

    been developed. (You probably suspected as much when you saw the size of this

    book.) Practical applications of algorithms are ubiquitous and include the following
    examples:


    - The Human Genome Project has made great progress toward the goals of identifying
    all the roughly 30,000 genes in human DNA, determining the sequences of the roughly
    3 billion chemical base pairs that make up human DNA, storing this information
    in databases, and developing tools for data analysis. Each of these steps requires
    sophisticated algorithms. Although the solutions to the various problems involved
    are beyond the scope of this book, many methods to solve these biological problems
    use ideas presented here, enabling scientists to accomplish tasks while using
    resources efficiently. Dynamic programming, as in Chapter 14, is an important
    technique for solving several of these biological problems, particularly ones
    that involve determining similarity between DNA sequences. The savings realized
    are in time, both human and machine, and in money, as more information can be
    extracted by laboratory techniques.


    - The internet enables people all around the world to quickly access and retrieve
    large amounts of information. With the aid of clever algorithms, sites on the
    internet are able to manage and manipulate this large volume of data. Examples
    of problems that make essential use of algorithms include finding good routes
    on which the data travels (techniques for solving such problems appear in Chapter
    22), and using a search engine to quickly find pages on which particular information
    resides (related techniques are in Chapters 11 and 32).


    - Electronic commerce enables goods and services to be negotiated and exchanged
    electronically, and it depends on the privacy of personal information such as
    credit card numbers, passwords, and bank statements. The core technologies used
    in electronic commerce include public-key cryptography and digital signatures
    (covered in Chapter 31), which are based on numerical algorithms and number theory.


    - Manufacturing and other commercial enterprises often need to allocate scarce
    resources in the most beneficial way. An oil company might wish to know where
    to allocate resources to maximize profit. An airline might wish to allocate flights
    to minimize costs. An internet service provider might wish to allocate resources
    to maximize efficiency. All of these are problems that can be solved efficiently,
    which Chapter 29 shows.


    - Given a road map, you wish to find the shortest path between two intersections.
    The number of possible routes can be huge, even if the road map is small. This
    problem is an instance of shortest path, and Chapter 22 shows how to solve it
    efficiently.


    - Given a set of numerical values representing samples of a signal taken at regular
    time intervals, the discrete Fourier transform converts them into the frequency
    domain to identify the dominant frequencies. This problem is an instance of topological
    sorting, and Chapter 20 shows how to solve it efficiently.


    - A doctor needs to determine whether an image represents a cancerous or a benign
    tumor. The doctor has available images of many tumors, some of which are known
    to be cancerous and some of which are known to be benign. A cancerous tumor is
    likely to be more similar to other cancerous tumors than to benign tumors. By
    using a clustering algorithm, as in 33, the doctor can identify which outcome
    is more likely.


    - You need to compress a large file containing text so it occupies less space.
    Many ways to do so are known, including “LZW compression,” which looks for repeating
    character sequences. Chapter 15 studies a different approach, “Huffman coding,”
    which encodes characters by bit sequences of various lengths, with characters
    occurring more frequently encoded by shorter bit sequences.

    '
