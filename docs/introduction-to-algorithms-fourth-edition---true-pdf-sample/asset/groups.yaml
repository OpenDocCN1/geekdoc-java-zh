    ## Chapter 8 Sorting in Linear Time


    **Figure 8.2** The operation of COUNTING-SORT on an input array $A\langle1 \dots
    8\rangle$, where each element of $A$ is a non-negative integer no larger than
    $k=5$. **(a)** The array $A$ and the auxiliary array $C$ after line 5. **(b)**
    The array $C$ after line 8. **(c)–(e)** the output array $B$ and the auxiliary
    array $C$ after one, two, and three iterations of the loop in lines 11–13, respectively.
    Only the tan elements of array $B$ have been filled in. **(f)** The final sorted
    array $B$.


    The $n \lg n$ lower bound for sorting does not apply when we depart from comparison
    sort model. An important property of counting sort is that it is stable: elements
    with the same value appear in the output array in the same order as they do in
    the input array. That is, it breaks ties between elements by the rule that whichever
    appears first in the input array appears first in the output array. Normally,
    the property of stability is important only when satellite data are carried around
    the element being sorted. Counting sort’s stability is important for another reason:
    sort is often used as a subroutine in radix sort. As we see in the next section,
    for radix sort to work correctly, counting sort must be stable.


    **Exercises**


    **8.2-1** Using Figure 8.2 as a model, illustrate the operation of COUNTING-SORT
    on the array $A = \langle6;0;2;0;1;3;4;6;1;3;2\rangle$.


    **8.2-2** Prove that COUNT-SORT is stable.


