    m \le n$，使得每个 $m$ 元子都有等概率被创建。一种方法是设置 $A[i] = i$，对于 $i = 1; 2; 3; ...; n$，调用 `RANDOMLY-PERMUTE(A)`，然后只取前
    $m$ 个数组元素。这种方法对 `RANDOM` 过程调用 $n$ 次。在 Gallup 教授的应用中，$n$ 远大于 $m$，因此教授希望用更少的 `RANDOM`
    调用来创建一个随机样本。


    RANDOM-SAMPLE(m, n)

    1 S = {}

    2 for k = n - m + 1 to n

