    \ back into A[p..r], and the **while** loop of lines 24–27 copies \n\nthe remaining\
    \ values of R back into the end of A[p..r]. \n\nTo see that the MERGE procedure\
    \ runs in Θ(n) time, where n D r-⌮p + 1, (13) \n\nobserve that each of lines 1–3\
    \ and 8–10 takes constant time, and the **for** loops \n\nof lines 4–7 take Θ(nL\
    \ + nR) = Θ(n) time. (14) To account for the three **while** \n\nloops of lines\
    \ 12–18, 20–23, and 24–27, observe that each iteration of these loops \n\ncopies\
    \ exactly one value from L or R back into A and that every value is copied \n\n\
    back into A exactly once. Therefore, these three loops together make a total of\
    \ n \n\niterations. Since each iteration of each of the three loops takes constant\
    \ time, the \n\ntotal time spent in these three loops is Θ(n). \n\nWe can now\
    \ use the MERGE procedure as a subroutine in the merge sort al-\n\ngorithm. The\
