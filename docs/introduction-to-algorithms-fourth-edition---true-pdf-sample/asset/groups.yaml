    *xvi*


    *前言*


    从 1 开始索引数组是一个小小的障碍。你总是可以对索引减去 1，或者直接多分配数组空间并让位置 0 闲置。


    我们理解到，如果您在课程之外使用本书，可能无法对照讲师提供的答案来检查问题和练习题的解答。我们的网站 http://mitpress.mit.edu/algorithms/
    提供了部分问题和练习题的解答，以便您检查作业。请不要将您的答案发送给我们。


    **致我们的同事们**


    我们提供了详尽的参考文献和指向当前文献的索引。每章末尾都有一组章节注释，提供了历史细节和参考。然而，章节注释并没有提供整个算法领域的完整参考。尽管对于如此长度的书来说，这可能难以相信，但空间限制让我们无法包含许多有趣的算法。尽管学生大量要求提供问题的解答，但我们采取了不提供答案的策略，以消除他们查阅答案而非自己发现。


    **第四版的变化**


    正如我们在第二版和第三版中中提到的，取决于你如何看待，这本书的变化有的不小，有的很大。快速浏览目录可以发现，第三版的大部分章节和章节都出现在第四版中。我们删除了三个章节和几个节，但增加了三个新章节和几个节。我们保留了前三版的混合组织形式。本书不再仅按问题领域或仅按技术组织章节，而是结合了两者。它包含了关于分治法、动态规划、贪心算法、摊还分析、增强数据结构、NP
    完备性和近似算法的章节。但它也有关于排序、动态集合数据结构和图算法的完整部分。我们发现第四版的一些变化适用于全书，而有些是针对特定章节或节的。以下是主要的通用变化总结：


    - 我们增加了 140 道练习题和 22 道新题。我们还改进了许多旧题题，这通常源于读者的反馈。（感谢所有提供建议的读者。）


    *xvii*


    *前言*


    - 我们使用了颜色！与 MIT Press 的设计师一起，我们选择了有限的色调，旨在传达信息并具有视觉美感。（我们很高兴展示了红黑树——得到这个！）为了增强可读性，术语、伪代码注释以及索引中的页码使用了彩色。


    - 伪代码程序出现在浅色背景上，以便更容易识别，它们并不一定出现在每一页。当它们没有出现时，正文会将你引导至相关页码。同样，对编号方程、定理和引理的引用包含了页码。


    - 我们删除了很少教授的主题。我们完全删除了关于斐波契堆、van Emde Boas 树和计算几何的章节。此外，删除了以下内容：最大子数组问题、指针和对象的实现、完美哈希、随机二叉树、拟阵、最大流的
    push-label 算法、迭代快速傅里叶变换、线性规划的单纯形算法细节以及整数分解。你可以在我们的网站 http://mitpress.mit.edu/algorithms/
    上找到所有被删除的内容。


    - 我们审查了整本书，并重写了句子、段落和章节，使写作更加清晰、自然且性别中立。例如，以前版本中的“旅行推销问题”现在被称为“旅行销售问题”（traveling-salesperson
    problem）。我们认为对于工程和科学（包括我们计算机科学领域），欢迎所有人至关重要。（一个让我们困扰的地方在第 13 章，那里需要一个描述“父母兄弟”的术语。由于英语中没有这样的性别中立术语，我们遗憾地保留了“uncle”（叔）。）


    - 章节注释、参考文献和索引都已更新，反映了自第三版以来算法领域的巨大增长。


    - 我们修正了错误，并将大部分修正发布在我们的第三版误误网站上。那些在我们全力准备本版期间报告的错误没有发布，但在本版中得到了纠正。（再次感谢所有帮助我们识别问题的读者。）


    第四版的具体变化包括：


    - 我们重新命名了第 3 章，并在深入探讨正式定义之前增加了一个提供渐近符号概述的章节。


    - 第 4 章经过了重大变化，以改进其数学基础并使其更加健壮和直观。书中引入了算法递归的概念，并更严谨地处理了递归中忽略取整和向上取整的问题。主定理的第二种情况包含了对数对数因子，现在提供了一个主定理“连续”版本的严谨证明。我们还展示了强大且通用的
    Akra-Bazzi 方法（无证明）。


    - 第 9 章中的确定性顺序统计算法略有不同，并且对随机和确定性顺序统计算法的分析都经过了重构。


    - 除了栈和队列，第 10.1 节讨论了存储数组和矩阵的方法。


    - 第 11 章关于哈表的内容包含了对哈函数的现代处理。它还强调了当底层硬件实现有利于局部搜索的缓存时，线性探测是解决冲突的高效方法。


    - 为了替换第 15 章中拟阵的章节，我们将第三版中一个关于离线缓存的问题转换为了整个章节。


    - 第 16.4 节现在包含了对分析哈表扩容和缩减的势能函数的更直观的解释。


    - 第 17 章关于增强数据结构的章节从第三部分移动到了第五部分，反映了我们认为这种技术超越了基础材料的观点。


    - 第 25 章是一个关于二分图匹配的新章节。它介绍了寻找最大基数匹配、解决稳定婚姻问题以及寻找最大权重匹配（被称为“任务指派问题”）的算法。


    - 第 26 章关于任务并行计算已使用现代术语进行了更新，包括章节名称。


    - 第 27 章涵盖在线算法是另一个新章节。在在线算法中，输入随时间到达，而不是在算法开始时就完全可用。该章节描述了在线算法的几个例子，包括等电梯等多久爬楼梯、通过调调启发式维护链表以及评估缓存的替换策略。


    - 在第 29 章中，我们删除了单纯形算法的详细介绍，因为它数学性太强，并没有传达许多算法思想。该章现在关注如何将问题建模为线性规划，以及线性规划本质的对偶性质。


    - 第 32.5 节为字符串匹配章节增加了后缀数组这一简单而强大的结构。


