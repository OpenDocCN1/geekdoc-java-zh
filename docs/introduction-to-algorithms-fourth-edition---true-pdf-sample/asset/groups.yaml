    *前言*


    *xix*


    第 33 章关于机器学习的内容是第三个新章节。它介绍了机器学习中使用的几种基本方法：将相似项分组在一起的聚类、加权多数算法，以及寻找函数最小值的梯度下降法。


    第 34.5.6 节总结了多项式时间归约的策略，用于证明问题是 NP-hard的。


    第 35.3 节中集合覆盖问题近似算法的证明经过修订。


    **网站**


    你可以使用我们的网站 http://mitpress.mit.edu/algorithms/ 获取补充信息并与我们联系。该网站链接了已知错误列表、第三版中未包含在第四版中的材料、选定练习题和问题的解答、书中书中许多算法的
    Python 实现、一个解释那些“老古教授笑话”的列表（当然如此），以及我们可能会添加的其他内容。该网站还告诉你如何报告错误或提出建议。


