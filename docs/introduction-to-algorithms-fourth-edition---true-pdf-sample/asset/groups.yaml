    \ the number T of it- \n\nerations. In one iteration, assigning points to clusters\
    \ based on the nearest-center \n\nrule requires O.dkn/ time, and recomputing new\
    \ centers for each cluster requires \n\nO.dn/ time (because each point is in one\
