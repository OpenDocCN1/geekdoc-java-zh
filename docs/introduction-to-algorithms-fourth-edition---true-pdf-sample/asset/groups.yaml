    $y = x.f$，那么 $x.f.g$ 与 $y.g$ 相同。


    有时指针指向任何对象。在这种情况下，我们赋予它特殊值 NIL。


    - 我们通过***值***（value）将参数传递给过程：调用过程接收的是参数的副本，如果它对参数赋值，该更改*不会*被调用过程看到。当传递对象时，代表对象的指针被复制，但对象的属性不会被复制。


