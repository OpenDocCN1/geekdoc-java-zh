    \ \n\n**Conquer** the subproblems by solving them recursively. \n\n**Combine**\
    \ the subproblem solutions to form a solution to the original problem. \n\nThe\
    \ ***merge*** ***sort*** algorithm closely follows the divide-and-conquer method.\
    \ In \n\neach step, it sorts a subarray AŒp W rc, starting with the entire array\
    \ AŒ1 W nc and \n\nrecursing down to smaller and smaller subarrays. Here is how\
    \ merge sort operates:"
  - "[PAGE 56]\n\n*2.3 Designing algorithms *\n\n*35 *\n\n**Divide** the subarray\
    \ AŒp W rc to be sorted into two adjacent subarrays, each of half \n\nthe size.\
    \ To do so, compute the midpoint q of AŒp W rc (taking the average of p \n\nand\
    \ r ), and divide AŒp W rc into subarrays AŒp W qc and AŒq C 1 W rc. \n\n**Conquer**\
    \ by sorting each of the two subarrays AŒp W qc and AŒq C 1 W rc recursively \n\
    \nusing merge sort. \n\n**Combine** by merging the two sorted subarrays AŒp W\
    \ qc and AŒq C 1 W rc back into \n\nAŒp W rc, producing the sorted answer. \n\n\
    The recursion “bottoms out”—it reaches the base case—when the subarray AŒp W rc\
    \ \n\nto be sorted has just 1 element, that is, when p equals r . As we noted\
    \ in the ini- \n\ntialization argument for I NSERTION\\-SORT’s loop invariant,\
    \ a subarray comprising \n\njust a single element is always sorted. \n\nThe key\
    \ operation of the merge sort algorithm occurs in the “combine” step, \n\nwhich\
    \ merges two adjacent, sorted subarrays. The merge operation is performed \n\n\
    by the auxiliary procedure MERGE.A; p; q; r/ on the following page, where A is\
    \ \n\nan array and p, q, and r are indices into the array such that p හ q < r\
    \ . The \n\nprocedure assumes that the adjacent subarrays AŒp W qc and AŒq C 1\
    \ W rc were al- \n\nready recursively sorted. It ***merges*** the two sorted subarrays\
    \ to form a single sorted \n\nsubarray that replaces the current subarray AŒp\
    \ W rc. \n\nTo understand how the MERGE procedure works, let’s return to our card-playing\
    \ \n\nmotif. Suppose that you have two piles of cards face up on a table. Each\
    \ pile is \n\nsorted, with the smallest-value cards on top. You wish to merge\
    \ the two piles \n\ninto a single sorted output pile, which is to be face down\
    \ on the table. The basic \n\nstep consists of choosing the smaller of the two\
    \ cards on top of the face-up piles, \n\nremoving it from its pile—which exposes\
    \ a new top card—and placing this card \n\nface down onto the output pile. Repeat\
    \ this step until one input pile is empty, at \n\nwhich time you can just take\
    \ the remaining input pile and ﬂip over the entire pile, \n\nplacing it face down\
    \ onto the output pile. \n\nLet’s think about how long it takes to merge two sorted\
    \ piles of cards. Each basic \n\nstep takes constant time, since you are comparing\
    \ just the two top cards. If the two \n\nsorted piles that you start with each\
    \ have n=2 cards, then the number of basic steps \n\nis at least n=2 (since in\
    \ whichever pile was emptied, every card was found to be \n\nsmaller than some\
    \ card from the other pile) and at most n (actually, at most n  1, \n\nsince\
    \ after n  1 basic steps, one of the piles must be empty). With each basic step\
    \ \n\ntaking constant time and the total number of basic steps being between n=2\
    \ and n, \n\nwe can say that merging takes time roughly proportional to n. That\
    \ is, merging \n\ntakes ‚.n/ time. \n\nIn detail, the MERGE procedure works as\
    \ follows. It copies the two subarrays \n\nAŒp W qc and AŒq C 1 W rc into temporary\
