    ## Chapter notes

    There are many excellent texts on the general topic of algorithms, including those
    by Aho, Hopcroft, and Ullman [5, 6], Dasgupta, Papadimitou, and Vazirani [107],
    Edmonds [133], Erickson [135], Goodrich and Tamassia [195, 196], Kleinberg and
    Tardos [257], Knuth [259, 260, 261, 262, 263], Levitin [298], Louridas [305],
    Mehlhorn and Sanders [325], Mitzenmacher and Upfal [331], Neapolitan [342], Roughgarden
    [385, 386, 387, 388], Sanders, Mehlhorn, Dietzfelinger, and Dementiev [393], Sedgewick
    and Wayne [402], Skiena [414], Soltys-Kulinicz [419], Williamson and Shmoys [459].
    For less technical material, see the books by Christian and Griffiths [92], Cormen
    [104], Erwig [136], MacCormick [307], and Vöcking et al. [448]. Overviews of the
    algorithms used in computational biology can be found in books by Jones and Pevzner
    [240], Elloumi and Zomaya [134], and Marchisio [315].

