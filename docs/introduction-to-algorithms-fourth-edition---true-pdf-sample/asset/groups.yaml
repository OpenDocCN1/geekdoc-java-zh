    the number of elements in the low side of the partition, plus 1 for the pivot
    element. Line 5 then checks whether $A[q]$ is the $i$th smallest element. If it
    is, then line 6 returns $A[q]$. Otherwise, the algorithm determines in which of
    the two subarrays $A\langlep \dots q-1\rangle$ and $A\langleq+1 \dots r\rangle$
    the $i$th smallest element lies. If $i < k$, then the desired element lies on
    the low side of the partition, and line 8 recursively selects it from the subarray.
    If $i > k$, however, then the desired element lies on the high side of the partition.
    Since we already know $k$ values that are smaller than the $i$th smallest element
    of $A\langlep \dots r\rangle$—namely, the elements of $A\langlep \dots q\rangle$—the
    desired element is the $(i-k)$th smallest element of $A\langleq+1 \dots r\rangle$,
    which line 9 finds recursively. The code appears to allow recursive calls to subarrays
    with 0 elements, but Exercise 9.2-1 asks you to show that this situation cannot
    happen. The worst-case running time for RANDOMIZED-SELECT is $\Theta(n^2)$, because
    it could be extremely unlucky and always partition around the largest remaining
    element before identifying the $i$th smallest when only one element remains. In
    this worst case, each recursive step removes only the pivot from consideration.
    Because partitioning takes $\Theta(n)$ time, the recurrence for the worst-case
    running time is the same as for QUICKSORT


