    *Preface*


    *xix*


    Chapter 33, on machine learning, is the third new chapter. It introduces several
    basic methods used in machine learning: clustering to group similar items together,
    weighted-majority algorithms, and gradient descent to find the minimizer of a
    function.


    Section 34.5.6 summarizes strategies for polynomial-time reductions to show that
    problems are NP-hard.


    The proof of the approximation algorithm for the set-covering problem in Section
    35.3 has been revised.


    **Website**


    You can use our website, http://mitpress.mit.edu/algorithms/, to obtain supplementary
    information and to communicate with us. The website links to a list of known errors,
    material from the third edition that is not included in the fourth edition, solutions
    to selected exercises and problems, Python implementations of many of the algorithms
    in this book, a list explaining the corny professor jokes (of course), as well
    as other content, which we may add to. The website also tells you how to report
    errors or make suggestions.


    **How we produced this book**


    Like the previous three editions, the fourth edition was produced in LaTeX2. We
    used the Times font with mathematics typeset using the MathTime Professional II
    fonts. As in all previous editions, we compiled the index using Windex, a C program
    that we wrote, and produced the bibliography using BibTeX. The PDF files for this
    book were created on a MacBook Pro running macOS 10.14.


    Our plea to Apple in the preface of the third edition to update MacDraw Pro for
    macOS 10 went for naught, and so we continued to draw illustrations on pre-Intel
    Macs running MacDraw Pro under the Classic environment of older versions of macOS
    10. Many of the mathematical expressions appearing in illustrations were laid
    in with the psfrag package for LaTeX2.


    **Acknowledgments for the fourth edition**


    We have been working with the MIT Press since we started writing the first edition
    in 1987, collaborating with several directors, editors, and production staff.
    Throughout our association with the MIT Press, their support has always been outstanding.
    Special thanks to our editors Marie Lee, who put up with us for far too long,
    and Elizabeth Swayze, who pushed us over the finish line. Thanks also to Director
    Amy Brand and to Alex Hoopes.


    *xx*


    *Preface*


    As in the third edition, we were geographically distributed while producing the
    fourth edition, working in the Dartmouth College Department of Computer Science;
    the MIT Computer Science and Artificial Intelligence Laboratory and the MIT Department
    of Electrical Engineering and Computer Science; and the Columbia University Department
    of Industrial Engineering and Operations Research, Department of Computer Science,
    and Data Science Institute. During the COVID-19 pandemic, we worked largely from
    home. We thank our respective universities and colleagues for providing such supportive
    and stimulating environments. As we complete this book, those of us who are not
    retired are eager to return to our respective universities now that the pandemic
    seems to be abating.


    Julie Sussman, P.P.A., came to our rescue once again with her technical copy-editing
    under tremendous time pressure. If not for Julie, this book would be riddled with
    errors (or, let’s say, many more errors than it has) and would be far less readable.
    Julie, we will be forever indebted to you. Errors that remain are the responsibility
    of the authors (and probably were inserted after Julie read the material). Dozens
    of errors in previous editions were corrected in the process of creating this
    edition. We thank our readers—too many to list them all—who have reported errors
    and suggested improvements over the years.


    We received considerable help in preparing some of the new material in this edition.
    Neville Campbell (unaffiliated), Bill Kuszmaul of MIT, and Chee Yap of NYU provided
    valuable advice regarding the treatment of recurrences in Chapter 4. Yan Gu of
    the University of California, Riverside, provided feedback on parallel algorithms
    in Chapter 26. Rob Shapire of Microsoft Research altered our approach to the material
    on machine learning with his detailed comments on Chapter 33. Qi Qi of MIT helped
    with the analysis of the Monty Hall problem (Problem C-1). Molly Seaman and Mary
    Reilly of the MIT Press helped us select the color palette in the illustrations,
    and Wojciech Jarosz of Dartmouth College suggested design improvements to our
    newly colored figures. Yichen (Annie) Ke and Linda Xiao, who have since graduated
    from Dartmouth, aided in colorizing the illustrations, and Linda Xiao.


    Finally, we thank our wives—Wendy Leiserson, Gail Rivest, and Nicole—and our families
    whose patience and encouragement made this project possible. We affectionately
    dedicate this book to them.


    THOMAS H. CORMEN, Cambridge, Massachusetts

    CHARLES E. LEISON, Cambridge, Massachusetts

    RONALD L. RIVEST, Cambridge, Massachusetts

    CLIFORD STEIN, New York, New York


    *Introduction*


    *Part I: Foundations*


    *Introduction*


    **Introduction**


    When you design and analyze algorithms, you need to be able to describe how they
    operate. Chapter 1 provides an overview of what an algorithm is and lists some
    examples. In Chapter 2, we see our first algorithms, which are written in pseudocode
    that you should be able to implement in any language. The algorithms are insertion
    sort, which uses an incremental approach, and merge sort, which uses technique
    known as “divide-and-conquer.” You also need some mathematical tools to show your
    algorithms do the right thing and do it efficiently. Chapter 3 defines asymptotic
    notation. The chapter starts by informally defining the most commonly used notations
    and giving examples of how to apply them. It then formally defines five notations
    to ensure that your use of notation matches that in this book. The rest of Chapter
    3 is primarily a presentation of mathematical concepts, to.


    *4*


    *Part I: Foundations*


    Chapter 4 delves further into the divide-and-conquer method introduced in Chapter
    2. It provides two additional examples of divide-and-conquer algorithms for multiplying
    square matrices, including Strassen’s method. Chapter 4 contains methods for solving
    recurrences, which are useful for describing the running times of algorithms.
    In the substitution method, you guess an answer and prove it correct. Recursion
    trees provide one way to generate a guess. Chapter 4 also presents the powerful
    technique of the “master method,” which you can often use to solve recurrences
    that arise from divide-conquer algorithms. Although the chapter provides a proof
    of a foundational theorem on which the master theorem depends, you should feel
    free to employ the master method without delving into the proof.


    Chapter 5 introduces probabilistic analysis and randomized algorithms. You typically
    use probabilistic analysis to determine the running time of an algorithm in cases
    in which due to an inherent probability distribution, the running time may differ
    on different inputs of the same size. In some cases, you might assume that the
    inputs conform to a known probability distribution, so that you are averaging
    the running time over all possible inputs. In other cases, the probability distribution
    comes not from the inputs but from random choices made during the course of the
    algorithm. An algorithm whose behavior is determined not only by its input but
    by the values produced by a random-number generator is a randomized algorithm.
    You can use randomized algorithms to enforce a probability distribution on the
    inputs—thereby ensuring that no particular input always causes poor performance—or
    even to bound the error rate of algorithms that are allowed to produce incorrect
    results on a limited basis.


    Appendices A–D contain other mathematical material that you will find helpful
    as you read this book. You might have seen much of the material in the appendix
    chapters before reading this book (although the specific definitions and notational
    conventions we use may differ in some cases from what you have seen in the past),
    and so you should think of the appendices as reference material. On the other
    hand, you probably have not already seen most of the material in Part I. All the
    chapters in Part I and the appendices are written with a tutorial flavor.

