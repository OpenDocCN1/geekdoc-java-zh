    ## 2.1 插入排序


    *21*


    让我们来看看这些属性在插入排序中是如何保持的。


    **初始化：** 我们首先证明在第一次循环迭代之前，循环不变性成立，此时 $i = 2$。子数组 $A[1 \dots i-1]$ 仅包含单个元素 $A[1]$，它实际上是
    $A[1 \dots 1]$ 中的原始元素。此外，该子数组是有序的（毕竟，一个只有一个值的子数组怎么可能是无序的呢？），这说明循环不变性在循环第一次迭代之前成立。


    **维护：** 接下来，我们处理第二个属性：证明每次迭代都保持循环不变性。从非正式地说，**for** 循环体的工作原理是将 $A[i-1]$、$A[i-2]$、$A[i-3]$
    等中的值向右移动一个位置，直到找到 $A[i]$ 的适当位置（第 4–7 行），此时在该位置插入 $A[i]$ 的值（第 8 行）。随后，子数组 $A[1
    \dots i]$ 包含了原先在 $A[1 \dots i]$ 中的元素，但按有序顺序排列的。对于下次 **for** 循环迭代***递增*** $i$（将其值增加
    1）则保持了循环不变性。


    对第二个属性进行更正式的处理需要我们为第 5–7 行的 **while** 循环说明并证明一个循环不变性。我们先不要陷入这种形式化中。相反，我们将依靠非正式分析来证明第二个属性适用于外层循环。


    **终止：** 最后，我们检查循环的终止。循环变量 $i$ 从 2 开始，并在每次迭代中增加1。一旦第 1 行中 $i$ 的值超过 $n$，循环就会终止。也就是说，当
    $i$ 等于 $n+1$ 时，循环终止。在循环不变性的表述中将 $n+1$ 替换为 $i$，得到子数组 $A[1 \dots n]$ 包含了原先在 $A[1
    \dots n]$ 中的元素，但按有序顺序排列。因此，该算法是正确的。


    这种循环不变性的方法被用于书中多个地方证明正确性。


    ### 伪代码规范


    我们在伪代码中使用以下约定。


    - 缩进表示块结构。例如，从第1行开始的 **for** 循环体由第2–8行 组成，而从第5行开始的 **while** 循环体包含第6–7行，但不包含第8行。我们的缩进样式也适用于
    **if-else** 语句。使用缩进代替文本结构指示器（如 **begin** 和 **end** 语句或大括号），可以减少杂乱，同时保留甚至增强清晰度。


    - 循环构造结构 **while**、**for** 和 **repeat-until** 以及 **if-else** 条件构造的解释与 C、C++、Java、Python
    和 JavaScript 中的解释相似。在书中，循环计数器在退出循环后仍保留其值，这与 C++ 和 Java 中出现的某些情况不同。因此，在 **for**
    循环之后，循环计数器的值是第一个超过 **for** 循环边界的值。我们在插入排序的正确性论证使用了这一属性。第 1 行中的 **for** 循环头部为 **for**
    $i = 2$ **to** $n$，因此当该循环终止时，$i$ 等于 $n+1$。当 **for** 循环在每次迭代中增加循环计数器时，我们使用关键字 **to**；当
    **for** 循环***递减***其循环计数器（每次迭代将其值减少1）时，我们使用关键字 **downto**。当循环计数器的变化量大于1时，变化量遵循可选关键字
    **by**。


    - 符号 "//" 表示行的剩余部分是注释。


    - 变量（如 $i$、$j$ 和 *key*）对于给定的过程是局部的。如果没有明确说明，我们不会使用全局变量。


    - 我们通过指定数组名后跟方括号中的索引来访问数组元素。例如，$A[i]$ 表示数组 $A$ 的第 $i$ 个元素。尽管许多编程语言强制数组使用 0 基索引（0
    是最小的有效索引），但我们选择对人类读者来说最清晰的索引方案。由于人们通常从 1 开始计数而不是 0，因此书中书中大多数（但不是所有）数组都使用 1 基索引。


    ^2 当循环是 **for** 循环时，第一次迭代之前的循环不变性检查发生在对循环计数器变量进行初始赋值之后，并在循环头部第一次测试之前。在 INSERTION-SORT
    的情况下，这个时间是在给变量 $i$ 赋值 2 之后，但在第一次测试 $i \le n$ 之前。


