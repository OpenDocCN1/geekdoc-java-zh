    从时域转换到频域。也就是说，它将信号近似为正弦波的加权和，产生各种频率的强度，这些强度相加后可以近似采样信号。离散傅里叶变换不仅处于信号处理的核心，在数据压缩以及大多项式和整数的乘法中也有广泛应用。第
