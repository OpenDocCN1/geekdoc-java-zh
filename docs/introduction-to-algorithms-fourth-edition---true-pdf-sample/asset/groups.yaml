    C 程序 Windex 编译索引，并使用 BibTeX 生成参考文献。这本书的 PDF 文件是在一台运行 macOS 10.14 的 MacBook Pro
    上创建的。


    我们在第三版前言中向 Apple 请求更新适用于 macOS 10 的 MacDraw Pro，但结果无缘而终，因此我们继续在运行旧版 macOS 10 的
    Classic 环境的非 Intel 时代 Mac 上使用 MacDraw Pro 绘制插图。插图中出现的许多数学表达式是使用 LaTeX2 的 `psfrag`
    包导入的。


    **第四版致谢**


    自 1987 年开始编写第一版以来，我们一直与 MIT Press 合作，与多位主管、编辑和制作人员协作。在与 MIT Press 合作的期间，他们的支持一直非常出色。特别感谢我们的编辑
    Marie Lee，她忍受了我们太长时间，以及 Elizabeth Swayze，她推着我们冲过了终点线。感谢主管 Amy Brand 和 Alex Hoopes。


    *xx*


    *前言*


    与第三版一样，我们在制作第四版时地理位置上是分散的，分别工作在达特茅学院计算机科学系；麻省理工学院计算机科学与人工智能实验室以及麻省理工学院电气工程与计算机科学系；以及哥比亚大学工业工程与运筹学系、计算机科学系和数据科学研究所。在
    COVID-19 疫情期间，我们很大程度上都在家里工作。感谢我们各自大学的同事提供了如此具有支持性且富有启发性的环境。在我们完成这本书时，由于疫情似乎正在缓解，我们这些未退休的人渴望渴望回到各自的大学。


    Julie Sussman (P.P.A.) 再次在巨大的时间压力下通过她的技术文字校对工作营救了我们。如果没有 Julie，这本书将充斥着错误（或者说，错误会比它现在拥有的要多得多），而且可读性会差得多。Julie，我们将永远感激你。遗留的错误由作者负责（可能是在
    Julie 读完材料后插入的）。在创建这个版本的过程中，之前版本中的几十个错误得到了纠正。我们感谢我们的读者——多到无法一一列举——他们多年来报告了错误并提出了改进建议。


    我们在准备本版中的一些新材料时得到了相当的帮助。Neville Campbell（独立人士）、MIT 的 Bill Kuszmaul 和纽约大学的 Chee
    Yap 就第 4 章中递归式的处理提供了宝贵建议。加州大学河滨分校的 Yan Gu 对第 26 章的并行算法提供了反馈。微软研究院的 Rob Shapire
    通过对 33 章的详细注释改变了我们处理机器学习材料的方法。MIT 的 Qi Qi 帮助分析了蒙提霍问题（问题 C-1）。MIT Press 的 Molly
    Seaman 和 Mary Reilly 帮助我们选择了插图的色调，达特茅学院的 Wojciech Jarosz 对我们新上色的图形提出了设计改进。从达特茅学院毕业的
    Yichen (Annie) Ke 和 Linda Xiao 协助了插图的上色。


    最后，感谢我们的妻子——Wendy Leiserson、Gail Rivest 和 Nicole——以及我们的家庭，他们的耐心和鼓励使这个项目成为可能。我们亲本书献给他们。


    THOMAS H. CORMEN，马萨诸塞州剑桥市

    CHARLES E. LEISON，马萨诸塞州剑桥市

    RONALD L. RIVEST，马萨诸塞州剑桥市

    CLIFORD STEIN，纽约州纽约市


    *引言*


    *第一部分：基础*


    *引言*


    **引言**


    当你设计和分析算法时，你需要能够描述它们是如何运行的。第 1 章概述了算法定义并列了一些示例。在第 2 章中，我们看到了第一批算法，它们是用伪代码编写的，你应该能够在任何语言中实现它们。这些算法是插入排序（使用增量方法）和归并排序（使用一种被称为“分治法”的技巧）。你还需要一些数学工具来证明你的算法执行是正确的，并且执行是高效的。第
    3 章定义了渐近符号。该章首先非正式地定义了最常用的符号，并给出了应用它们的示例。然后正式定义了五种符号，以确保你对符号的使用与书中一致。第 3 章的其余部分主要是数学概念的介绍。


    *4*


    *第一部分：基础*


    第 4 章进一步探讨了第 2 章引入的分治法。它提供了两个用于方阵矩阵乘法的分治算法的额外示例，包括 Strassen 方法。第 4 章包含了求解递归的方法，这些方法对于描述算法的运行时间非常有。在替换法中，你猜一个答案并证明它的正确性。递归树提供了一种生成猜想的方法。第
    4 章还介绍了强大的“主定理法”，你通常可以用它来解决来自分治算法的递归。尽管该章提供了主定理所依赖的基础定理的证明，但你可以直接使用主定理而无需深究其证明。


    第 5 章引入了概率分析和随机算法。你通常使用概率分析来确定算法的运行时间，即由于内在的概率分布，相同大小输入的运行时间可能会不同。在某些情况下，你可能假设输入符合已知概率分布，因此对所有可能的输入运行时间取平均。在其他情况下，概率分布不是来自输入，而是来自算法执行过程中的随机选择。一个行为不仅取决于输入，还取决于随机数生成器产生值的算法就是随机算法。你可以使用随机算法对输入强制执行概率分布——从而确保没有特定的输入总是导致糟糕性能——甚至可以限制允许在范围内产生错误结果的算法的错误率。


    附录 A–D 包含了阅读本书时会有帮助的其他数学材料。你在阅读这本书之前可能已经见过附录章节中的大部分内容（尽管在某些情况下我们使用的特定定义和符号习惯与你过去看到的不同），因此你应该将附录视为参考材料。相反，你可能还没有见过第一部分中的大部分内容。第一部分的所有章节和附录都是以教学风格编写的。


