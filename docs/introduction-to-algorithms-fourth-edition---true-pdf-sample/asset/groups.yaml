    ## 1.1 Algorithms


    the time domain to the frequency domain. That is, it approximates the signal as
    a

    weighted sum of sinusoids, producing the strength of various frequencies which,

    when summed, approximate the sampled signal. In addition to lying at the heart
    of

    signal processing, discrete Fourier transforms have applications in data compression

    and multiplying large polynomials and integers. Chapter 30 gives an efficient

    algorithm, the fast Fourier transform (commonly called the FFT), for this problem.

    The chapter also sketches out the design of a hardware FFT circuit.


    ### Data structures


    This book also presents several data structures. A data structure is a way to
    store

    and organize data in order to facilitate access and modifications. Using the appropriate

    data structure or structures is an important part of algorithm design. No single

    data structure works well for all purposes, and so you should know the strengths

    and limitations of several of them.


    ### Technique


    Although you can use this book as a “cookbook” for algorithms, you might

    sometimes encounter a problem for which you cannot readily find a published algorithm

    (many of the exercises and problems in this book, for example). This book will

    teach you techniques of algorithm design and analysis so that you can develop

    algorithms on your own, show that they give the correct answer, and analyze their

    efficiency. Different chapters address different aspects of algorithmic solving.

    Some chapters address specific problems, such as finding medians and statistics
    in Chapter 9, computing minimum spanning trees in Chapter 21, and determining
    a maximum

    flow in network in Chapter 24. Other chapters introduce techniques, such as divide-and-conquer
    in Chapters 2 and 4, dynamic programming in Chapter 14, and amortized analysis
    in Chapter 16.


    ### Hard problems


    Most of this book is about efficient algorithms. Our usual measure of efficiency
    is: how long does an algorithm take to produce its result? There are some problems,
    however, for which we know of no algorithm that runs in a reasonable

    amount of time. Chapter 34 studies an interesting subset of these problems, which
    are known as NP-complete.


    Why are NP-complete problems interesting? First, although no efficient algorithm
    for an NP-complete problem has ever been found, nobody has ever proven that one
    cannot exist. In other words, no one knows whether efficient algorithms exist
    for NP-complete problems. Second, the set of

    NP-complete problems has the remarkable property that if an efficient algorithm
    exists for any one of them, then efficient algorithms exist for all of them. This
    relationship among the NP-complete problems makes the lack of efficient solutions
    all the more tantalizing. Third, several NP-complete problems are similar, but
    not identical, to problems for which we know of efficient algorithms. Computer
    scientists are intrigued by how a small change to the problem statement can cause
    a big change to the efficiency of the best known algorithm.


    You should know about NP-complete problems because some of them arise surprisingly
    in real applications. If you are called upon to produce an efficient algorithm
    for an NP-complete problem, you are likely to spend a lot of time in fruitless
    search. If, instead, you can show that the problem is NP-complete, you can spend
    your time developing an approximation algorithm, that is, an algorithm that gives
    a good, but not necessarily best possible, solution.


    As a concrete example, consider a delivery company with a central depot. Each
    day, it loads up trucks at the depot and sends them around to deliver goods to
    several addresses. At the end of the day, each truck must end up back at the depot
    so that it is ready to be loaded for the next day. To reduce costs, the company
    wants to select an order of delivery stops that yields the lowest distance traveled
    by each truck. This problem is the well-known “traveling-salesperson problem,”
    and it is NP-complete. It has no known efficient algorithm. Under certain assumptions,
    however, we know of efficient algorithms that compute overall distances close
    to the smallest possible. Chapter 35 discusses such “approximation algorithms.”


    ### Alternative computing models


    For many years, we could count on processor clock speeds increasing at a steady
    rate. Physical limitations present a fundamental roadblock to ever-increasing
    clock speeds, however: because power density increases superlinearly with clock
    speed, chips run the risk of melting once their clock speeds become high enough.
    In order to perform more computations per second, therefore, chips are being designed
    to contain not just one but several processing “cores.” We can liken these multicore
    computers to several sequential computers on a single chip. In other words, they
    are a type of “parallel computer.” In order to elicit the best performance from
    multic computers, we need to design algorithms with parallelism in mind. Chapter
    26 presents a model for ”task-parallel” algorithms, which take advantage of multiple
    processing cores. This model has advantages from both theoretical and practical
    standpoints, and many modern parallel-programming platforms embrace something
    similar to this model of parallelism.


    (2) To be precise, only decision problems—those with a “yes/no” answer—can be
    NP-complete. The decision version of the traveling salesperson problem asks whether
    there exists an order of stops whose distance totals at most a given amount.


    Most of the examples in this book assume that all of the input data are available
    when an algorithm begins running. Much of the work in algorithm design makes the
    same assumption. For many important real-world examples, however, the input actually
    arrives over time, and the algorithm must decide how to proceed without knowing
    what data will arrive in the future. In a data center, jobs are constantly arriving
    and departing, and a scheduling algorithm must decide when and where to run a
    job, without knowing what jobs will be arriving in the future. Traffic must be
    routed in the internet based on the current state, without knowing about where
    traffic will arrive in the future. Hospital emergency rooms make triage decisions
    about which patients to treat first without knowing when other patients will be
    arriving in the future. Algorithms that receive input over time, rather than having
    all present at the start, are online algorithms, which Chapter 27 examines.


    ## 1.2 Algorithms as a technology


    If computers were infinitely fast and memory were free, would you have any reason
    to study algorithms? The answer is yes, for no other reason than to be certain
    that your implementation terminates and gives the correct answer, and analyze
    their efficiency. If computers were infinitely fast and memory were free, any
    correct method would do.


    Of course, computers may be fast, but they are not infinitely fast. Computing
    time is therefore a bounded resource, which makes it precious: time is more than
    money. You should choose algorithms that use the resources of time and space efficiently.


    ### Efficiency


    Different algorithms devised to solve the same problem often differ dramatically
    in their efficiency. These differences can be much more significant than differences
    due to hardware and software.


    As an example, Chapter 2 introduces two algorithms for sorting. The first, known
    as insertion sort, takes time roughly equal to c1 n² to sort n items, where c1
    is a constant that does not depend on n. That is, it takes time roughly proportional
    to n². The second, merge sort, takes time roughly equal to c2 n lg n, where lg
    n stands for log 2 n and c2 is another constant that does not depend on n. Insertion
    sort typically has a smaller constant factor than merge sort, so that c1 < c2.
    We’ll see that the constant factors can have far less of an impact on the running
    time than the dependence on the input size n. Let’s write insertion sort’s running
    time as c1 n² and merge sort’s running time as c2 n lg n. Then we see that where
    insertion sort has a factor of n in its running time, merge sort has a factor
    of lg n, which is much smaller. For example, when n is 1000, lg n is approximately
    10, and when n is 1,000,000, lg n is approximately 20. Although insertion sort
    usually runs faster than merge sort for small input sizes, once the input size
    n becomes large enough, merge sort’s advantage of lg n versus n more than compensates
    for the difference in constant factors. No matter how much smaller c1 is than
    c2, there is always a crossover point beyond which merge sort is faster.

