  md: '# # STAR WARS

    # AGE OF REPUBLIC


    ![](img/3e38935a173f88314b60cc19bd2c893c_26_0.png)


    # # LEGACY OF A JEDI


    He may be long gone, but Qui-Gon Jinn''s impact on the galaxy can still be felt.

    By Glenn Greenberg


    As far as Luke Skywalker ever knew, Obi-Wan Kenobi had only. But in 1999, The
    Phantom Menace revealed an additional Jedi who groomed Obi-Wan to fulfill knighthood—Qui-Gon
    Jinn remains unknown, but he probably played a pivotal role in the reshaping of
    the galaxy near the end of the Old Republic. Indeed, he was one of the most consequential
    Jedi of all time, with repercussions of his life still felt decades after his
    death.


    In The Phantom Menace, we saw what was likely the most significant disagreement
    between Qui-Gon and his Jedi colleagues: the one involving a boy named Anakin
    Skywalker.


    certainly as importantly, was George Lucas said it. "Anakin is the chosen one,"
    Lucas declared in an interview included on the Revenge of the fifth DVD. When
    Anakin turns into Vader, he is still the chosen one."


    # ## Jedi''s Faith


    # ## A Voice From Beyond


    Qui-Gon, of course, brought Anakin—who, as an adult, would father Luke and Leia—before
    the Jedi Council, who convinced that the "chosen one" prophesied to destroy the
    Force and bring back to life. When the Council rejected Skywalker—with even Obi-Wan
    warning that he was dangerous—Anakin defied them all, intending to be the positive
    influence that Anakin needed. With Qui-Gon''s influence on Anakin''s life had
    ended forever forward. But with his dying breath, Qui-Gon compelled Obi-Wan to
    train the boy and ensure that the boy became a Jedi.


    Just as him, after his death, discovered how to communicate with Jedi from the
    brotherhood of the Force. He taught this ability to Yoda, and Obi-Wan learned
    it, with many long-term repercussions. The galaxy would be a very different place
    if his spirit had guided Skywalker through the Battle of Yavin, or if he had met
    Yoda on the planet Dagobah.


    From Qui-Gon, Obi-Wan gained the skills and the wisdom that would train him so
    well as a Jedi and as a military leader during the Clone Wars. But there was a
    sharp contrast between them. While Obi-Wan felt safely in line with the Jedi Council,
    Qui-Gon did not hesitate to go where he wanted. Anakin described Qui-Gon as independent,
    always testing the rules, and he had become known for his "refusal to go along
    with the program."


    Even Qui-Gon''s powers had their limits, however, he could not guide the future,
    but could not see Anakin ultimately turn the Jedi and Emperor Palpatine exterminate
    of them in his new identity of Darth Vader.

    Anakin fulfilled the prophecy—


    Since Yoda, so in The Last Jedi, can still appear and offer a last bit of counsel
    to an older Luke—and affect the physical world—decades after his passing, it is
    clear that Qui-Gon trained the being exceptionally well. It is safe to see that
    Qui-Gon Jinn''s legacy truly lives on, in a way that


    > NOTE: except all George Lucas and Ian Nelson are taken from Star Wars: The Making
    of Episode—The Phantom Menace, by Laurent Boureau and John Duncan, Del Rey, 1999.'
