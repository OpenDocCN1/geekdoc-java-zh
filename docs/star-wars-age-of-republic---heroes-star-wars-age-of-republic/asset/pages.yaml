  md: '# # STAR WARS

    # REPUBLIC


    # Jar Jar Binks


    Exiled by his people, the Gungans, Jar Jar Binks of Naboo by his clumsiness, had
    a life-changing encounter with Qui Gon Jinn and Obi-Wan Kenobi during the Trade
    Federation''s blockade of his homeworld. Alongside them he met and befriended
    Pad Amidala—Naboo''s queen—and, during a side trip to Tatooine, young Anakin Skywalker.


    Throughout the Prequel Trilogy and The Clone Wars, Jar jar demonstrated a dedication
    to serving loyalty to his friends and an innocence that some used against him.
    He was manipulated into introducing the measure that would grant Chancellor Palatine
    emergency powers, which led to the Clone Wars and, ultimately, to the rise of
    Palatine''s Galactic Empire.


    Lucas told Rolling Stone in 1999. More importantly, Jar Jar was the first fully
    computer-generated character in a feature film. "We finally developed the ability
    to do photo-realistic characters that is believable," "I was able to do it with
    Yoda as a puppet," Lucas said, "but Jar Jar could actually walk around with the
    characters and do physical humor."


    So Jar Jar helped usher in the spectacular technical wizardry that we see in movies
    today. Not a bad day for a klutz.


    Jar Jar proved his worth by helping to unite the Gungans against the Trade Federation
    and then leading an army of Trade Federation battle droids. Later he entered politics
    becoming a representative for his people in the Galactic Senate and working closely
    with now-Senator Amidala.


    The 2017 novel Ammaticith: Empire''s End revealed that Binks was exiled by the
    Gungans, who blamed him for Palatine''s reign of darkness. He ended up as a street
    performer on Naboo, entertaining children—somewhat fitting, since he was created
    to be comic relief.


    > "I think the comic-relief character is an important dramatic device," George


