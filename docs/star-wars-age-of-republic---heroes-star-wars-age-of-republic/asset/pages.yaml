    Anakin Skywalker: The Most Complicated Hero

    By Bryan Young


    If you know there Anakin ''Skywalker'', my father,'' Luke tells Darth Vader after
    surrendering everything he had to save the galaxy to forest moon of End.


    “Name no longer has any meaning for me,” Vader yells.

    It''s easy to see why Vader wanted to forget the name of his true self. Anakin
    Skywalker was a hero, and the person he became was anything but.


    It might be difficult to imagine the charred-faced life on Tatooine—with a group
    of strangers with no thought of reward—would grow up to become one of the most
    villainous in the galaxy. It was almost inevitable.


    In giving of the story Anakin Skywalker from his time before transformation into
    Darth Vader, Lucas gave us a lesson in how even the best can go wrong under circumstances,
    and at the end of his life, to realize that it''s too late to fight against our
    worst impulses.


    tragedy. In an interview for Moviefone conducted by Hayden Christensen to promote
    Revenge of the Sith, George explains how important Anakin and Vader were from
    the beginning. When I wrote the very, first script, it was about Anakin Skywalker
    and his Jedi were remnants of that found its way into the final Star Wars, so
    I would say right from the very beginning Vader was the central character.


    for what sounds like reasons through the Clone Wars, whether that''s in torturing
    Plo Koon the Lesser to save the life of his Padawan, Ahsoka, or trying to protect
    his wife by punching Rush Clovis in the face. He continues to do bad things in
