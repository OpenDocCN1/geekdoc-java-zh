    Ryan Church 概念图


    ## 扩张的银河系

    ### 没有了这些出色的配角，《星大战》传奇将大不相同

    作者：Glen Greenberg


    很久很久以前——具体来说是在1977年至1983年间——*星大战*银河系要小得多。如果你让粉丝们选出他们最喜欢的角色，你可能会听到重复出现的同样名字：卢克·天行沃克、汉·索罗、莉娅公主、R2-D2、尤达。或者，在那些命运较阴暗的角色中，如达斯·维德或赏金猎人波勃·费特。


    瑞克斯（Rex）是一个忠诚且受重视的士兵，也是欧比旺·肯诺比、安纳金·天行沃克以及天行沃克的徒弟阿索卡·塔诺的信任战友，他与他们建立了深厚的友谊。独立见见的天行沃克和意志坚强的安纳金启发了瑞克斯，随着越来越多的兄弟牺牲，毁灭在银河系中蔓延，他最终开始质疑克隆战争的意义。


    尽管温文（Windu）最初对西斯的回归以及前绝地武士会爵杜杜·库克的反派行为持怀疑态度，但温文还是选择前往格奥诺西斯营救天行沃克、肯诺比和议员帕德梅·阿米达拉。后来，在发现帕尔帕廷是一个西斯领主后，温文冲出去逮捕他。但他被天行沃克背叛，并被那个成为皇帝的男人所毁。


    但随着乔治·卢卡斯扩展了这一传奇，无论是在大幕上——通过前传三部曲《幽灵威胁》、《克隆人的攻击》和《西斯的复仇》——还是在动画剧《克隆战争》中，许多新角色被引入。突然之间，你可能会发现一组完全不同的名字被视为最爱。今天，许多粉丝发现无法想象一个没有这些配角的星大战银河系。


    饰演温文的塞缪尔·L·杰克逊曾争取出演星大战电影。乔治·卢卡斯给出了杰克逊无法拒绝的邀请。在2013年的采访中，杰克逊透露：“我想拍这部电影。如果我是一个风暴兵，你可以让我穿上装备，在屏幕上跑过，大家需要认识我，我就会在这里！”


    ## 瑞克斯队长


    第501军团领袖瑞克斯队长——CC7567——于2008年的电影《星大战：克隆战争》中首次登场，随后出现在剧集中。和所有克隆人一样，瑞克斯是根据赏金猎人詹戈·费特的遗传材料创造的，出生和成长就是为了服务共和国并保护其公民。


    ## 弥斯·温文


    在整个前传和克隆战争期间，绝地大师温文是一个事事不虚的管理者，也是一位有着坚坚定信念和原则的技高高战士。他怀疑绝地大师奎-刚·金恩的断言，奎-刚金恩认为黑暗面更倾向于摧毁西斯并为原力带来平衡。随着天行沃克的成长，温文对他产生了疑虑——事实证明安纳金确实转向了黑暗面并变成了达斯·维德。


    温文的紫色光剑的想法也由此产生——与通常的蓝色或绿色不同——杰克逊解释道，“我们在格奥诺西斯和所有绝地武士进行了一场激烈的辩论。当时我想……我希望能在这部电影的某场戏中找到我自己！”


    结果，在动画剧中，瑞克斯在克隆战争中牺牲，并收到了第66号指令执行对绝地人的灭绝。在《反叛军》中，在《克隆战争》近二十年后，瑞克斯决定加入反抗军联盟，为其提供他的军事经验和知识。


    # 星球大战

    # 共和国


    ## 贾贾·宾克斯


    纳布星的贾贾·宾克斯因为他的笨拙被他的同族昆人（Gungans）放逐，在贸易联邦封锁他的家园期间，他与奎-刚·金恩和欧比旺·肯诺比有了一次改变生活的相遇。与他们在一起，他遇到了帕德梅·阿米达拉——在前往塔图因的途中，他遇到了年轻的安纳金·天行沃克。


    在整个前传三部曲和克隆战争期间，贾贾表现出了对朋友的忠诚和纯真。他被操纵并引入了一项授予帕尔帕廷紧急权力措施，这导致了克隆战争，并导致了帕尔帕廷银河帝国的崛起。卢卡斯在1999年告诉《滚石》杂志：“贾贾是第一个完全计算机生成的角色。我们终于能够制作出如此逼真的角色，‘但贾贾实际上可以在角色周围走动’，这就是我们今天看到的惊叹技术的魔术。对贾贾来说并不是糟糕的一天。”


    贾贾通过帮助昆人对抗贸易联邦证明了自己的价值，随后他进入了政治领域，与议员帕德梅·阿米达拉紧密合作。2017年的小说揭示了宾克斯被指责帕尔帕廷统治的黑暗。他最终成为了纳布星的街头艺人——逗孩子们——这很合适，因为他被创造是为了喜剧角色。


    “我认为这个喜剧角色是一个重要的戏剧装置，”乔治·卢卡斯


