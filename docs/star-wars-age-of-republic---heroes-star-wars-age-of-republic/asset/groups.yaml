    ## AGE OF REPUBLIC

    ### Padmé Amidala: The Hero for a Generation

    By Bria LaVorgna


    Padmé Amidala is recognizable for the months I spent when she was nine years old
    hoping to be elected queen just like her. I was unexpectedly reminded that even
    teenage queens, she remains a woman I strive to be two decades later.


    It was that same planetary invasion that showed she wasn''t averse to handling
    a blaster politician who was also protected by both the royal security force and
    her loyal handmaids. Whether it was leading the attack to take back her home or
    battling for her life in an execution area, right alongside Jedi and fellow Skywalker,
    risking their lives even if they didn''t do so well. She was one of the best on
    onscreen scenes in the Star Wars films, hitting her targets more accurately than
    most.


    Padmé was also a woman who loved the people in her life deeply, though she worked
    to dominate home. From her family and friends to the people she worked for, Padmé
    cared about all of them and always wanted to believe the best. That faith extended
    to her husband, Anakin Skywalker, even after she was gone down in flames with
    irrefutable evidence. With dying breath, she told Obi-Wan, "There is good in him,"
    a belief eventually proven to be true decades later.


    To some fans, Padmé in the Prequel Trilogy perhaps mostly known for being Anakin''s
    wife and Luke and Leia''s mother. But there''s more to her than that. To an entire
    generation of young women, she was an inspiration, showing that all sorts of girls
    can be heroes. Padmé''s beautiful appearance, which drew from cultures across
    the world, never defeated her strength of character or made her lesser in any
    way. They were sometimes a tactical foe that fooled adversaries underestimating
    her. It was great that George portrays, explains Anakin Skywalker in "P-19," the
    behind-scenes look at The Clones. "They can be powerful and so soft they can wear
    beautiful clothes and that doesn''t contradict her strength." Someone who faced
    down an entire planetary invasion at the age of fourteen can be described as strong.


    A CHANCE is ALL WE CAN ASK FOR. A CHANCE TO PROVE THAT OUR HOPE for a BETTER GALAXY
    ISN''T UNFOUNDED.

    END.

