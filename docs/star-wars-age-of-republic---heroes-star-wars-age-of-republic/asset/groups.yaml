    ## A GROWING GALAXY

    ### The Star Wars Saga Just Wouldn''t Be the Same Without These Stellar Supporting
    Characters

    By Glen Greenberg


    A long time ago—specifically from 1977 to 1983—*Star Wars* Galaxy was a much smaller
    place. If you asked fans to pick back to a favorite, you would likely hear the
    same names repeating: Luke Skywalker, Han Solo, Princess Leia, R2-D2, Yoda. Or,
    from those with darker fates, Darth Vader or the bounty hunter Bob Fett.


    Rex was a loyal and valued soldier and a trusted comrade to Obi-Wan Kenobi, Anakin
    Skywalker and Skywalker''s apprentice, Ahsoka Tano, with whom he formed a strong
    friendship. The independent-minded Skywalker and the strong-willed Anakin inspired
    Rex, and he ultimately began to question the purpose of the Clone Wars as more
    of his brothers were killed and destruction spread across the galaxy.


    Although Windu was initially skeptical of the Sith''s return and of former Jedi
    Count Dooku''s villains, Windu chose to go to Geonosis to rescue Skywalker, Kenobi
    and Senator Padmé Amidala. Later, upon discovering that Palpatine was a Sith Lord,
    Windu rushed out to arrest him. But he was betrayed by Skywalker and destroyed
    by the man who became Emperor.


    But as George Lucas extended the saga, both on the big screen—via the Prequel
    Trilogy *The Phantom Menace, Attack of the Clones and Revenge of the Sith*—and
    on the animated series Clone Wars many new characters were introduced. And suddenly,
    you were likely to find a completely different bunch of names cited as favorites.
    Today, many fans find it impossible to imagine the Star Wars galaxy without its
    supporting characters.


    Samuel L. Jackson, who played Windu, had lobbied to be in a Star Wars movie. George
    Lucas responded with an offer Jackson couldn''t reject. In a 2013 interview, Jackson
    revealed, "I wanted to be in the movie. If I were a stormtrooper, you could put
    me in a suit, let me run across the screen, movebody needs to know me, and I''d
    be here!"


    ## Captain Rex


    Leader of the 501st Legion of clones, Captain Rex—CC7567—debuted in 2008 in *Star
    Wars: The Clone Wars* movie and went on to appear in the TV series. Like all clones,
    Rex was created from the genetic material of the bounty hunter Jango Fett, born
    and bred to serve the Republic and protect its citizens.


    ## Mace Windu


    Throughout the Prequel and the Clone Wars, Jedi Master Windu was a non-nonsense
    administrator and a highly skilled warrior with strong beliefs and principles.
    He doubted Jedi Master Qui-Gon Jinn''s assertions that the dark side was the one
    prone to destroy the Sith and bring balance to the Force. As Skywalker grew up,
    Windu had misgivings about him—which turned out to be Anakin''s turn to the dark
    side and transformation into Darth Vader.


    It also came up with the idea of Windu''s amethyst lightsaber—as opposed to the
    usual blue or green—“We had a big debate (on Geonosis), with all these Jedi,"
    Jackson explained. "And I was like...I wanted to be able to find myself in this
    movie of scene!"


    As a result in the animated series, Rex was killed by the Clone Wars and returned
    to him officer Order 66 and the extermination of the Jedi. In *Rebels*, nearly
    two decades after The Clone Wars, Rex decides to join the Rebel Alliance, providing
    it with his military experience and knowledge.


    # STAR WARS

    # REPUBLIC


    ## Jar Jar Binks


    Exiled by his people, the Gungans, Jar Jar Binks of Naboo by his clumsiness, had
    a life-changing encounter with Qui Gon Jinn and Obi-Wan Kenobi during the Trade
    Federation''s blockade of his homeworld. Alongside them he met and befriended
    Pad Amidala—Naboo''s queen—and, during a side trip to Tatooine, young Anakin Skywalker.


    Throughout the Prequel Trilogy and The Clone Wars, Jar jar demonstrated a dedication
    to serving loyalty to his friends and an innocence that some used against him.
    He was manipulated into introducing the measure that would grant Chancellor Palatine
    emergency powers, which led to the Clone Wars and, ultimately, to the rise of
    Palatine''s Galactic Empire.


    Lucas told Rolling Stone in 1999. More importantly, Jar Jar was the first fully
    computer-generated character in a feature film. "We finally developed the ability
    to do photo-realistic characters that is believable," "I was able to do it with
    Yoda as a puppet," Lucas said, "but Jar Jar could actually walk around with the
    characters and do physical humor."


    So Jar Jar helped usher in the spectacular technical wizardry that we see in movies
    today. Not a bad day for a klutz.


    Jar Jar proved his worth by helping to unite the Gungans against the Trade Federation
    and then leading an army of Trade Federation battle droids. Later he entered politics
    becoming a representative for his people in the Galactic Senate and working closely
    with now-Senator Amidala.


    The 2017 novel Ammaticith: Empire''s End revealed that Binks was exiled by the
    Gungans, who blamed him for Palatine''s reign of darkness. He ended up as a street
    performer on Naboo, entertaining children—somewhat fitting, since he was created
    to be comic relief.


