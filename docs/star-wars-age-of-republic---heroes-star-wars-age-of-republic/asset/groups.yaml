    # # HELLO THERE!

    ## Obi-Wan Kenobi: Charming, Wise and Powerful

    By Bryan Young


    "Hello there."


    Who could have guessed the first we ever heard Obi-Wan Kenobi say on the big screen
    become so iconic? In both New Hope and Revenge of the Sith, this has become one
    of his most memorable lines.


    At Star Wars Celebration V, held in 2010, John Stewart interviewed George Lucas
    and Stewart asked about Obi-Wan''s origins. Lucas replied, "This is one of the
    first things I wrote in the very first script. He comes from the planet Stewon."


    filmmaking and how stories are told in a constant push-pull of what''s best for
    the story rather than in absolutes. (Only a Sith deals in absolutes.)


    And it stuck.


    In fact, even before Alec Guinness accepted the part of Obi-Wan Kenobi, it was
    offered to Japanese acting legend Toshiro Mifune, whose who stepped into the part
    rather than in his most famous films.


    # Killing Kenobi


    The gentle warmth might be rooted in the profiling style of the original actor—Sir
    Alec Guinness and his history as a comic actor for Early Studios. His conceptualization
    of Obi-Wan is very serious but still possesses an awesome of barely restrained
    sarcasm.


    George Lucas never knew exactly what he was going to do with the character of
    Obi-Wan. In a recording about his early work on the script for A New Hope, Lucas
    revealed, "In that draft, he continued through the battle air. And he continued
    on the next two stories (Empire Strikes Back and Return of the Jedi). And I looked
    at it and said, ''No, you stay around for the last 25 percent of [A New] Hope]
    and he has no other function."


    "You mean you have never heard of the Millennium Falcon?" Han Solo answers earnestly
    in response to the Jedi''s less-impressed expression.


    It would be much more powerful, satisfying and if Darth Vader took the place of
    Obi-Wan, and then he were to go to a different form.


    Kenobi blinks and deands, "Is that all",


    Mifune ultimately turned down the role. Can you imagine how Star Wars would be
    if he had said yes? Would it have been the one of the best moments in The Force
    Awakens, when Rey heard the voice of Obi-Wan, voiced once more by Evan Guinness.
    "These are your first stories."


    But if Guinness sarcasm to the part, Evan McGregor took the role through the prequel
    films, imbued godly charm to the character. His delivery of Obi-Wan''s memorable
    line comes at a moment in Revenge of the Sith with General Grievous on Uttaau."Hello
    there," he says, restraining a battle conflict mind against all odds.


    Hearing those words brings a chill to the spine of Star Wars fans and leaves us
    all to hope that we''re not through with stories Obi-Wan Kenobi. But even if he
    were gone, he''d still be more powerful than we could possibly imagine.


    As Ken, he could also be funny and fun, and so no surprise that Obi-Wan Kenobi
    was born on planet Stewon: a planet named after a famous comedy.


    Lucas said later in that interview killing Kenobi presented challenges for the
