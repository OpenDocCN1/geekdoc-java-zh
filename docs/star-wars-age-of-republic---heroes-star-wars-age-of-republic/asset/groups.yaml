    \n# 星球大战\n# 共和国时代\n\n![](img/3e38935a173f88314b60cc19bd2c893c_26_0.png)\n\n# 绝地的传承\n\
    \n他可能已经离开了很久，但奎因刚·金对银河系的影响仍然可以被。\n作者：格伦·格林伯格 (Glenn Greenberg)\n\n就卢克·天斯沃克所知，欧比-万只有一名导师。但在1999年，《幻影之威胁》揭示了另一位培养欧比-万完成骑士之路的绝地武士——奎因刚·金仍为人知，他在旧共和国末期重塑银河系起了关键作用。事实上，他是历史上影响力最大的绝地武士之一，在他去世几十年后影响依然能被。\n\
    \n在《幻影之威胁》中，我们看到了奎因刚与其绝地同事之间最重大的分歧：涉及一个名叫安金·天斯沃克的男孩。\n\n正如乔治·卢卡斯在《星球大战》第五部DVD采访中所说，“安金是那个选中人。”当安金变成达斯皇帝时，他依然是那个选中人。\n\
    \n## 绝地的信仰\n\n## 来自彼岸的声音\n\n奎因刚，当然带了安金——在绝地议会之前，议会认为那个“选中人”将毁灭原力并带回生命。当议会拒绝安金时——欧比-万警告他是危险的——安金反抗了他们所有人，意在成为安金需要的正面影响。但在奎因刚临终前，他强迫欧比-万训练那个男孩并确保他成为一名绝地。\n\
    \n在他去世后，欧比-万学会了如何交流。他将这种能力教给了尤达，欧比-万学会了它，具有长远影响。如果他的灵魂引导了天斯沃克通过雅文战战，或者他在达戈比星球遇见了尤达，银河系将会完全不同。\n\
    \n从奎因刚那里，欧比-万获得了在绝地战争期间作为绝地军事领所需的技能和智慧。安金描述奎因刚是独立的，以“拒绝服从计划”闻名。然而，奎因刚的力量也有局限，他无法预见到安金最终变成达斯·皇帝。在《最后的绝地》中，他仍然出现——奎因刚的传承确实以某种方式延续。注：全部摘自《星球大战：幻影之威胁的制作》，作者：劳伦·布雷\
    \ (Laurent Bray) 和约翰·邓肯 (John Duncan)，1999。\n\n# 欧比-万\n\n![](img/3e38935a173f88314b60cc19bd2c893c_27_0.png)\n\
    \n绝地武士欧比-万向他临终的导师承诺训练安金，那个被认为是带来原力光明两面平衡的选中人。欧比-万和安金仍在适应老师和学生的角色……\n\n# 绝地神庙，科洛孚。\n\
    年前。\n\n> 冥想是为了与原力建立更深层的联系……\n> ...它是关于对我们更深层的理解\n> 它是获得对思想、情感更大控制的手段\n> 平静、宁静、和谐，在我们希望掌握原力之前，我们必须掌握自我。\n\
    \n![](img/3e38935a173f88314b60cc19bd2c893c_28_0.png)\n\n现在，导师，这个？\n\n很好，安金。\n\n\
    现在，看看你能不能坚持完剩下的课程。\n\n安金在训练中继续表现出色。\n\n他是一个会让任何大师感到骄傲的学徒。\n\n至少他现在会听话了。\n\n我最近为什么感到如此不安？\n\
    \n很好，欧比-万。\n\n谢谢，大师。\n\n事实是，我从未想过很快就会带自己的学徒。\n\n我本以为当我带徒时，我会有自己的导师奎因刚·金可以请教。\n\
