    \n是的，在中环的达洛尔星球上。\n\n那不是一个共和国星球，但考古小组遇到了此——\n\n你又要离开了吗？\n\n我不会离开多久，你可以继续接受尤达大师的训练。\n\
    \n和那些小孩子一起。我总是比他们领先很多。\n\n也许吧。但训练并不由学生来决定。\n\n我那……\n\n绝地神庙图书馆。\n\n总有更多的需要学习。\n\
    \n你好，尤达大师。我刚才在绝地档案中搜索关于达洛尔的信息。\n\n我发现了关于那个星球的记载，但没有任何去过那里的绝地的记录。\n\n他们的名字已被时间遗忘。\n\
    \n除非我们能找回原力法，假设古人是正确的。\n\n嗯。我们将获得名字和知识。\n\n带年轻的天斯沃克去执行这次任务，好吗？\n\n我没计划，不。我不确定他是否准备好了。\n\
    \n“确保你是否已经准备好。”\n\n“因此，他落后了。在其他学徒之后。”\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_0.png)\n\
    \n他明白自己比任何其他学者都要来得晚。\n\n明白在通往绝地的道路上，他还有很多需要学习的。\n\n但他还需要导师的信念。\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_1.png)\n\
