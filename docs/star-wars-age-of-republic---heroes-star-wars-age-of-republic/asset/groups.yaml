    # 星际大战：共和国时代特别篇


    ## 501 团加一


    克斯上尉带领着他的克隆士兵，与分离派机器人军队进行英勇的战斗。

    在保卫高贵的银河共和国时，还有什么比这更完美的盟友呢？……贾贾贾·宾克斯？


    ## 欧萨萨隆。外环领域。


    ![](img/3e38935a173f88314b60cc19bd2c893c_94_0.png)

    ![](img/3e38935a173f88314b60cc19bd2c893c_94_1.png)


    一切正常。绝晶武巡逻已经通过。


    ![](img/3e38935a173f88314b60cc19bd2c893c_94_2.png)


    看来尽管共和国拥有这么多资源，他的同伴们还是没能在这些石头下面找到他。呃，为什么？


    然而，他看起来相当自信。你知道的，对于一个即将完死的人来说。


    而对于这样一个年轻的恐怖分子来说，你看起来也很有自信——


    自由战士。


    学校学习对我来说没用，在外环边缘根本没有未来。在这里，只有“冷酷的古塔塔科”在教我们现在需要的知识。


    也许吧……但孩子应该在学校里，而不是在洞穴里发动战争。


    你小时候就被带走，并被一个军阀的仇恨侵化了。


    --你应该多担心你自己！


    间谍们说得对。绝晶武古塔塔科独自一人带了前哨站。


    从哪里被带走？在街上乞要食物吗？


    我已经有了仇恨，古塔塔科主给了食物填饱我的肚子，而且——


    （啪）


    噢，丘塔，绝晶武。


    我们毫不费力地缴获并摧毁了他的武器。


    凯斯克，你是事业的贡献者，至于你……温杜大师……


    ……欢迎来到我的行动基地。

    这里看起来很普通，但从这些卑微的开始，我的军队将发动一场革命，为这个星系带来真正的自由！


    看起来更像是你躲避的安全的地方，而你却送孩子上战场。


    ……如果你的动机如此纯洁，为什么你的行动资金是由坦克人资助的？


    啊，原来如此，麦斯·温杜大师之所以来到这个偏远之地是为了进行他的圣洁审判。


    每一个伟大的事业都需要牺牲……

    接受坦克人的资源是为了在正确的地方播种混乱，或者是招募新兵。


    ![](img/3e38935a173f88314b60cc19bd2c893c_96_0.png)


    你并没有招募那 26 名学生。你的部队嘲笑他们的老师，并绑架了运货的孩子。


    你不是那种能激励人心的领导，对吧？


    一个足以让受尊敬的瓦卢姆总理恐惧的领导，否则你不会在这里。那些学生会在我身上学到……更伟大的东西。


    我见过你们那些童兵的尸体。这一切现在结束了。而且在没有好用的光剑的情况下。


    ……你无力自救……


    你说得对。这一切现在结束了……你处决的广播将吸引许多新的信徒加入古塔塔科的事业……更不用说我最新的自由战士了。


    我给你一个和平投降的机会。


    哈哈哈哈哈！你认为你的朋友会设法赶来救你吗？


    噢，他们很快就会到，但在那之前我已经完事了。


    ……我们中有一个被派到这里是为了带领其他人找到这个点的……


    哈！你指望他们怎么找到你？


    欧萨萨隆有 8 万公里的隧道，你们的绝晶武搜寻一个世纪也找不到这个精确的洞穴……


    ……除非——


    除非……被俘获本来就是你的计划之一……


    通过原力向其他绝晶武发出信号是我作为帕达万学到的第二课……


    第二课？什么……第一课是什么？


    我做不到这个，胡扬大师！我永远无法制造出我的光剑。


    是原力将它们结合在一起的……通过你。这让你成为了武器。你所制造的秘密是这些碎片根本不需要被“制造”。


    我……我做到了！


    不要让它落到绝晶武手里！


    （咔哒）


    （咔哒）


    它在自己移动！


    不……不是自己移动的！


    杀了他！


    （格斗）（格斗）


    （嗡）

    （嗡）


    不！！！


    这不能这样结束！


    （砰）（砰）（砰）


    嗯。


    （汤）


    啊啊！


    你们阻止不了事业的！


    你们的事业已经失败了！


    -从你们采取绑架并为坦克人工作的那刻起！


    卡扎扎卡


    ![](img/3e38935a173f88314b60cc19bd2c893c_101_0.png)


    你们大家加入聚会真好。我们本该早来的，但你们知道有多少隧道吗——大约有 8 万公里的规模。我听。

    ![](img/3e38935a173f88314b60cc19bd2c893c_103_0.png)


    做得好，温杜大师。你救了所有的孩子。那那个女孩呢？她是一个年轻的孤儿，也许可以找到新家。那么我们并没有救下所有人……对吧？由于她所有的恐怖攻击却没有被监禁，她会干扰当地法律，我们做不到。

    ![](img/3e38935a173f88314b60cc19bd2c893c_103_1.png)


    # 阿兰塔之战

    > 克斯。留在我身边，克斯……

    > 斯凯沃克将军？

    > 罪名成立。

    > 你……是为了我来的。

    > 本该是我先去的。

    > 真正的领导总是从前线指挥。

    > ……移动！！！


    # 米班之战

    > 射击！前进！跳跃者，后撤！

    > 向你保证，我可以照顾我自己，克斯上尉。

    ![](img/3e38935a173f88314b60cc19bd2c893c_105_0.png)


    > 凯斯！把参议员带出去！

    > 我很想去！她根本就不该在这里！

    > 我们需要一个沼泽原住民来与米班对接。

    > 我想死了！！！

    > 我该回家的！！！

    > 他在执行任务。只要送他去安全的地方。我们需要——啊！！！

    ![](img/3e38935a173f88314b60cc19bd2c893c_105_1.png)


    我们这里遭到了猛烈火力！命令，长官？将军离开后，指挥链交给了参议员。撤退，进行火力压掩护我们的撤退。杰西，把参议员带到安全的地方。


    我们需要重组。跟我说话。护盾发生器还有三波能量。我们会在它的四分之一处击毙。敌人太多了。凯斯说得对……这是一场自杀任务。上尉？联系。标记我们的降落点。让他们送来一艘撤离船。我们要撤退了，长官？遵从您的命令，是的，长官。

    ![](img/3e38935a173f88314b60cc19bd2c893c_107_0.png)


    # 之后


    你认为你要去哪里？去那个护盾发生器。一个人？


    我们需要摧毁那个发生器，否则行星就完了。


    --我不会再冒险任何士兵了。这样伤亡较少。除了你。


    长官——撤离船正在路上。把营带带安全。如果我摧毁了护盾，就推进。并保持参议员安全。你是意思是……我的意思是安全。是的，也是如此。


    # 几个激战小时后。


    共和国渣滓！死吧！哼……啊！（砰）浪费他。收到，收到。

    ![](img/3e38935a173f88314b60cc19bd2c893c_109_0.png)

    ![](img/3e38935a173f88314b60cc19bd2c893c_109_1.png)

    ![](img/3e38935a173f88314b60cc19bd2c893c_109_2.png)

    ![](img/3e38935a173f88314b60cc19bd2c893c_109_3.png)

