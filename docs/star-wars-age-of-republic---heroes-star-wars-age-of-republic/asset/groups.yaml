    ## QUI-GON JINN


    ![](img/3e38935a173f88314b60cc19bd2c893c_5_0.png)


    ## "BALANCE"

    Jedi Master Qui-Gon Jinn has long served the Jedi Council and the Galactic Republic
    faithfully. But his faith in the Jedi and the Force is about to be tested... Qui-Gon.


    ## BALANCE

    QUI-GON JINN


    ## BALANCE

    QUI-GON JINN


    THEY ARE STILL COMING, JEDI!


    YES, MISTRESS, I HAD NOTICED. I SUGGEST THAT WE KEEP MOVING AS WELL.


    OBI-WAN, READY THE SHIP? THE PRIESTESS OF WATER AND I AM HEADING YOUR WAY!


    WE''RE NOT ALONE. THERE IS LITTLE GROUND BETWEEN CUTTING DOWN AND NOT CUTTING
    A TREE. MISTRESS''S SEEMS WILLING TO CUT DOWN OPPOSITION WHO STANDS IN THEIR WAY.


    MASTER JEDI... WE APPEAR TO BE SURROUNDED.


    YOUR WORD OR YOUR BLOOD, MISTRESS. THE TREES WILL FALL WITH ONE OR THE OTHER.
    YOU THINK THAT YOU CAN FACE THE MIGHT OF THE JEDI WARRIOR?


    WHAT ARE YOU— I WAS SENT TO FIND A PEACEFUL SOLUTION TO YOUR PEOPLE''S PROBLEM,
    MISTRESS. AND THIS IS CLEAR: NO TIME OR PLACE WHERE THEY WILL PREVAIL. DON''T
    LET THEM ESCAPE!


    HANG ON, MISTRESS. TAKE US UP! WHERE ARE WE HEADING, MASTER? BACK TO CORUSCANT.
    I CANNOT ABANDON MY TREES TO THE METAL CLAN! BY YOUR OWN LAWS, BY THEIR OWN ADMISSION,
    THEY NEED YOUR WORD OR YOUR BLOOD TO HARM A SINGLE LEAF.


    ## Coruscant.

    Capital Of The Republic.


    > "FOR NOW, THEY SHALL HAVE ACCESS TO NEITHER."


    A CITY OF METAL ABOMINATION? YOU WILL BE SAFE HERE FOR THE TIME BEING. I WILL
    BE SAFE WHEN EVERY MEMBER OF THE METAL CLAN IS DEAD. STRIKE THEM DOWN WITH LIGHTSABER
    END THIS CONFLICT. THAT IS NOT THE WAY OF THE JEDI, MISTRESS.


    BUT YOU FOUGHT FOR ME, YOU CHOSE MY SIDE! I DEFENDED YOUR LIFE WHATEVER YOU THINK
    I— I HAD HEARD THE JEDI WERE GREAT WARRIORS, RUNNING AT THE FIRST SIGN OF A FIGHT.
    THE LEGENDS NEVER HINTED AT YOUR COWARDICE.


    ## The Jedi Temple.


    MASTER QUI-GON, YOUR REPORT, THE COUNCIL REQUESTS. MASTER YODA, SURELY YOU DID
    NOT TRACK ME DOWN FOR MORE REPORT. Especially WHEN MY PADAWAN HAS BEEN SO DILIGENT
    IN FILLING HIS OWN. NO. GREAT TURMOIL I SENSE IN YOU, AND I KNOW IT IS NOT. IF
    I AM TO BE HONEST, THIS MISSION, THE WORDS OF THE PRIESTESS OF WATER... THERE
    ARE CONCERNS THAT I HAVE HAD FOR SOME TIME NOW. A COWARD? YOU ARE NOT, QUI-GON
    JINN. HER PLANET, YOU HAD TO LEAVE. BEING CALLED A COWARD ISN''T WHAT BOTHERED
    ME, MASTER YODA. IT WAS BEING CALLED A GREAT WARRIOR.


    EVEN HERE ON CORUSCANT, THE HOME OF THE JEDI COUNCIL, THERE IS LITTLE UNDERSTANDING
    OF OUR PURPOSE. WE ARE SEEN AS SOLDIERS OF POLITICIANS, WITH LITTLE MENTION OF
    THE FORCE ITSELF. MYSTERIOUS, THE FORCE REMAINS TO MANY, AND MISUNDERSTOOD THOSE
    WHO WOULD THE FORCE OF. YET OUR ACTIONS ARE A REFLECTION OF OUR PURPOSE. PERHAPS
    THE JEDI COUNCIL RESIDING HERE IN THE CAPITAL IS PART OF THE PROBLEM. WE ARE USED
    AS WEAPONS OF THE REPUBLIC AND THUS WE ARE SEEN AS SUCH, PERHAPS EVEN BY OURSELVES.
    ON THIS POINT, THE COUNCIL WOULD NOT AGREE. OF COURSE, BUT THE COUNCIL OR MYSELF,
    I FEEL THERE IS A LOSS OF VISION. WHEN WE HAVE QUESTIONS, A DEEPER UNDERSTANDING
    FROM THE FORCE WE MUST SEEK. ON THAT WE AGREE, MASTER YODA.


    > "AND A METAL CITY, AS MISTRESS THERE SO APTLY PUT IT, IS HARDLY THE PROPER PLACE
    FOR SUCH COMMUNION."


    > BUT WHERE TO GO...


    > AS IN THINGS, THE ANSWERS LIE IN THE FORCE.


    > LET IT GUIDE US.


    > I JUST HAVE TO TRUST THE HEART OF THE FORCE... AND THAT IS TO FIND THE ANSWER
    I SEEK.


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_0.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_1.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_2.png)


    > FOR MISTRESS AS WELL AS MYSELF.


    ![](img/3e38935a173f88314b60cc19bd2c893c_15_0.png)


    NO, CHARTED LONG AGO, BUT NOT IMPORTANT ENOUGH TO HAVE A DESIGNATION. NO EVIDENCE
    OF TECHNOLOGY BUT AN ABUNDANCE OF LIFE. LET''S SEE WHY THE FORCE BROUGHT ME HERE...


    A BEAUTIFUL PLACE... ...BUT THERE MUST BE MORE TO IT THAN SIMPLY— WAIT. I SENSE...
    SOMETHING...


    SOMETH FEELS WRONG. COLD. THERE IS A CORRUPTION HERE, A DARKNESS.


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_0.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_1.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_2.png)


    THE FORCE. IT IS STRONG HERE. THE DARK SIDE. TEMPTATION? OR A LESSON? I SEEK ANSWERS
    FROM THE LIVING FORCE. PERHAPS EVEN IN THIS DARK MONUMENT... I AM MEANT TO FIND
    LIGHT.


    ![](img/3e38935a173f88314b60cc19bd2c893c_19_0.png)

