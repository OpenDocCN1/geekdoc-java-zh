    # AGE OF REPUBLIC


    Padmé Amidala: The Hero for a Generation


    By Bria LaVorgna


    Padmé Amidala Naberry is recognizable for the three months I spent when she was
    nine years old hoping to be elected queen just like her. I was unexpectedly reminded
    that even teenage queens, she remains a woman I strive to be like two decades
    later.


    It was that same planetary invasion that showed she wasn''t averse to handling
    a blaster fellow politician who was also protected by both the royal security
    force and her loyal handmaids. Whether it was leading the attack to take back
    her home or battling for her life in an execution area, right alongside Jedi and
    fellow Skywalker, risking their lives even if they didn''t do so as well. She
    was one of the best on onscreen scenes in the Star Wars films, hitting her targets
    more accurately and than most.


    Padmé was also a woman who loved the people in her life deeply, though she worked
    to dominate her home. From her family and friends to the people she worked for,
    Padmé cared about all of them and always wanted to believe the best. That faith
    extended to her husband, Anakin Skywalker, even after she was gone down in flames
    with irrefutable evidence. With dying breath, she told Obi-Wan, "There is good
    in him," a belief eventually proven to be true decades later.


    To some fans, Padmé in the Prequel Trilogy perhaps mostly known for being Anakin''s
    wife and Luke and Leia''s mother. But there''s more to her than that. To an entire
    generation of young women, she was an inspiration, showing that all sorts of girls
    can be heroes. Padmé''s beautiful appearance, which drew from cultures across
    the world, never defeated her strength of character or made her lesser in any
    way. They were sometimes a tactical foe that fooled adversaries underestimating
    her. It was great that George sort portrays, explains Anakin Skywalker in "P-19,"
    the behind-scenes look at The Clones. "They can be powerful and so soft they can
    wear beautiful clothes and that doesn''t contradict her strength." Someone who
    faced down an entire planetary invasion at the age of fourteen can be described
    as strong.


    While not one to shy away from a conflict, she also advocated for diplomacy, using
    "aggressive negotiations" when all other venues were exhausted. She was a child
    when she decided to join the Apprentice Leaders and dedicate her life to public
    service, and even a teenager when she elected queen of her planet. It was her
    calling to say the least. Her diplomacy even brought the Gungan to her, uniting
    their two civilizations to fight for their planet despite a long history of tension.
    Her memory often even put her directly in harm''s way, especially during the Clone
    Wars, but the danger never deterred her.


    From her compassion to character, Padmé is every hero both of her children. "She
    doesn''t act for her own good or for power she truly needs. I think she''s a role
    model for everyone and it would be good for young girls to see," Portman said
    in the "Star Wars feature for The Phantom Menace. And as Natalie Porttrill has
    grown up like many of us have, the lessons Padmé taught us to heart. For what
    you believe in. Diplomacy in no way detracts from the quality of your convictions.
    Always work for a better world. How it to feel that there''s still good in everyone
    even when all seem lost. And most importantly, always keep a spare blaster in
    the arm of your throne.'
