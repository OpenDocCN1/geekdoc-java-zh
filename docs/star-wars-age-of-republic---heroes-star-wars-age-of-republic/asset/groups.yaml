    \nALWAYS MORE TO LEARN, THERE IS.\n\nHELLO, MASTER YODA. I WAS JUST SEARCHING\
    \ THE JEDI ARCHIVES FOR INFORMATION ON DALLOR.\n\nI'VE FOUND MENTION OF THE PLANET,\
    \ BUT THERE ARE NO RECORDS OF ANY JEDI WHO WENT THERE.\n\nLOST TO TIME, THEIR\
    \ NAMES ARE.\n\nUNLESS WE CAN RETRIEVE THE HOLOCRON, ASSUMING THE ANCIENTS ARE\
    \ CORRECT.\n\nMMM. NAMES AND KNOWLEDGE, WE SHALL GAIN.\n\nTAKE YOUNG SKYWALKER\
    \ ON THIS QUEST, WILL YOU?\n\nI HADN'T PLANNED ON IT, NO. I'M NOT SURE HE'S READY.\n\
    \n\"ENSURE YOU ARE READY OR NOT.\"\n\n\"AND SO, BEHIND REMAINS. BEHIND THE OTHER\
    \ PADAWANS.\"\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_0.png)\n\nHE UNDERSTANDS\
    \ THAT HE CAME TO US FAR LATER THAN ANY OF THE OTHER INITIATES.\n\nTHAT HE STILL\
    \ HAS MUCH TO LEARN ON, HIS PATH TO BECOMING A JEDI.\n\nBUT HIS MASTER'S BELIEF\
    \ IN HIM, HE ALSO NEEDS.\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_1.png)\n\
    \nTRUE THIS IS.\n\nFORGIVE ME, MY BLUNTNESS, MASTER, BUT YOUR SUPPORT OF ANAKIN\
    \ IS SURPRISING.\n\nYOU WERE ONE OF THE COUNCIL MEMBERS WHO WAS AGAINST HIM BECOMING\
    \ A PADAWAN IN THE FIRST PLACE.\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_2.png)\n\
    \nVERY DANGEROUS. A POORLY TRAINED JEDI IS. TO OTHERS AND TO HIMSELF.\n\n![](img/3e38935a173f88314b60cc19bd2c893c_33_3.png)\n\
    \nIF TRAIN HIM YOU MUST, YOUNG... ...TRAIN HIM WELL.\n"
