    奎·金


    ![](img/3e38935a173f88314b60cc19bd2c893c_5_0.png)


    ## “平衡”

    绝地大师奎·金长期忠诚地服务于绝地议会和银河共和国。但他对绝地和原力的信仰将面临考验……奎·金。


    ## 平衡

    奎·金


    ## 平衡

    奎·金


    他们还在来，绝地大师！


    是的，女士，我注意到了。我建议我们继续移动。


    欧比旺，船准备好了吗？水之公主正向你走来！


    我们并不孤单。在砍伐树木和不砍伐树木之间没有中间地带。女士似乎愿意砍掉挡路的人。


    绝地大师……我们似乎被包围了。


    你的誓言或你的血，女士。树木将随着其中一种选择而倒下。你认为你能面对绝地战士的力量吗？


    你是——我被派来为你们的问题寻找和平解决方案，女士。这很明确：没有任何时间或地点他们能胜利。不要让他们逃了！


    等一下，女士。带我们上空！我们要去哪里，大师？回到科斯塔。我不能把我的树木留给金属族！根据你们自己的法律，根据他们自己的承认，他们需要你的誓言或你的血来伤害一片叶子。


    ## 科斯塔。

    共和国首都。


    > “现在，他们两者都无法获得。”


    一座金属异类的城市？你在这里是安全的。当金属族的每个成员都死时，我才是安全的。用光剑击败他们结束这场冲突。这不是绝地之道，女士。


    但你为我战斗，你选择了我这边！我保护了你的生命，无论你怎么想我——我听过绝地是伟大的战士，看到战斗迹象就会逃跑。传说从未暗示过你的懦弱。


    ## 绝地神殿。


    奎·金大师，议会请求你的报告。大师大师，你一定不是为了更多的报告才找到我的。尤其是我的帕达旺已经如此勤奋地完成自己的报告了。不。我感觉到你身上巨大的动荡，我知道那不是。如果我诚实，这次任务，水之公主的话……我一直以来一直有些顾虑。懦弱？你不是的，奎·金。她的星球，你不得不离开。被称为懦弱并不是困扰我的，尤大师。我是被称为伟大的战士。


    即使在科斯塔，绝地议会的所在地，人们对我们目的的理解也寥寥无几。我们被视为政治人物的士兵，很少提到原力本身。原力对许多人来说仍然神秘的，并且误解了那些运用原力的人。然而，我们的行动是我们目的的反映。也许居住在首都的绝地议会是问题的一部分。我们被当作共和国的武器，因此被视为如此，也许在我们自己眼里。在这一点上，议会不会同意。当然，但无论是议会还是我，我都感到愿景的迷失。当我们有疑问时，必须对原力有更深层的理解。是的，尤大师。


    > “而且一座金属城市，正如你贴切描述的，并不适合这种感应。”


    > 但我们要去哪里……


    > 答案在原力之中。


    > 让它引导我们。


    > 我只需要信任原力的核心……


    > 那就是找到我寻找的答案。


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_0.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_1.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_14_2.png)


    > 像女士和我一样。


    ![](img/3e38935a173f88314b60cc19bd2c893c_15_0.png)


    不，很久以前就记录过了，但并不重要到命名。没有技术的迹象，但生命勃勃。看看原力为什么带我来到这里……


    一个美丽的地方……但这里不仅仅是——等等。我感觉到了……某种……


    感觉不对。冰冷。这里有腐败，有黑暗。


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_0.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_1.png)


    ![](img/3e38935a173f88314b60cc19bd2c893c_17_2.png)


    原力。它在这里很强大。黑暗面。诱惑？还是教训？我从活原力中寻求答案。也许在这个黑暗的纪念碑中……我注定要找到光。


