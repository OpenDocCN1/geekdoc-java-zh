    \n# LEGACY OF A JEDI\n\nHe may be long gone, but Qui-Gon Jinn's impact on the\
    \ galaxy can still be felt.\nBy Glenn Greenberg\n\nAs far as Luke Skywalker ever\
    \ knew, Obi-Wan Kenobi had only one. But in 1999, The Phantom Menace revealed\
    \ an additional Jedi who groomed Obi-Wan to fulfill knighthood—Qui-Gon Jinn remains\
    \ unknown, but he probably played a pivotal role in the reshaping of the galaxy\
    \ near the end of the Old Republic. Indeed, he was one of the most consequential\
    \ Jedi of all time, with repercussions of his life still felt decades after his\
    \ death.\n\nIn The Phantom Menace, we saw what was likely the most significant\
    \ disagreement between Qui-Gon and his Jedi colleagues: the one involving a boy\
    \ named Anakin Skywalker.\n\nCertainly as importantly, as George Lucas said it.\
    \ \"Anakin is the chosen one,\" Lucas declared in an interview included on the\
    \ Revenge of the fifth DVD. When Anakin turns into Vader, he is still the chosen\
    \ one.\"\n\n## Jedi's Faith\n\n## A Voice From Beyond\n\nQui-Gon, of course, brought\
    \ Anakin—who, as an adult, would father Luke and Leia—before the Jedi Council,\
    \ who believed that the \"chosen one\" prophesied to destroy the Force and bring\
    \ back to life. When the Council rejected Skywalker—with even Obi-Wan warning\
    \ that he was dangerous—Anakin defied them all, intending to be the positive influence\
    \ that Anakin needed. With Qui-Gon's influence on Anakin's life ended forever\
    \ forward. But with his dying breath, Qui-Gon compelled Obi-Wan to train the boy\
    \ and ensure that the boy became a Jedi.\n\nJust after his death, Obi-Wan discovered\
    \ how to communicate with Jedi. He taught this ability to Yoda, and Obi-Wan learned\
    \ it, with many long-term repercussions. The galaxy would be a very different\
    \ place if his spirit had guided Skywalker through the Battle of Yavin, or if\
    \ he had met Yoda on the planet Dagobah.\n\nFrom Qui-Gon, Obi-Wan gained the skills\
    \ and the wisdom that would train him so well as a Jedi and a military leader\
    \ during the Clone Wars. While Obi-Wan felt safely in line with the Jedi Council,\
    \ Qui-Gon did not hesitate to go where he wanted. Anakin described Qui-Gon as\
    \ independent, always known for his \"refusal to go along with the program.\"\
    \ Even Qui-Gon's powers had their limits, however, he could not guide the future,\
    \ but could not see Anakin ultimately turn into Darth Vader. In The Last Jedi,\
    \ he can still appear—it is clear that Qui-Gon Jinn's legacy truly lives on in\
    \ a way. NOTE: All taken from Star Wars: The Making of Episode I Menace, by Laurent\
    \ Bray and John Duncan, 1999.\n\n# OBI-WAN KENOBI\n\n![](img/3e38935a173f88314b60cc19bd2c893c_27_0.png)\n\
    \nJedi Knight Obi-Wan Kenobi made a promise to his dying master to train Anakin,\
    \ thought to be the Chosen One prophesied to bring balance between the light and\
    \ dark sides of the Force. Both Obi-Wan and Anakin are still adjusting to their\
    \ roles as teacher and student...\n\n# Jedi Temple, Coruscant.\nYears Ago.\n\n\
    > MEDITATION IS ABOUT MORE THAN FORGING A DEEPER CONNECTION TO THE FORCE...\n\
    > ...IT IS ABOUT GAINING A DEEPER UNDERSTANDING OF OURSELVES\n> IT IS A MEANS\
    \ OF OBTAINING GREATER CONTROL OVER OUR THOUGHTS, OUR EMOTIONS.\n> PEACE, SERENITY,\
    \ HARMONY WE MUST MASTER OURSELVES BEFORE WE HOPE TO MASTER THE FORCE.\n\n![](img/3e38935a173f88314b60cc19bd2c893c_28_0.png)\n\
    \nNow. HOW IS THIS, MASTER?\n\nVERY GOOD, ANAIN.\n\nNow, SEE IF YOU CAN HOLD IT\
    \ FOR THE REST OF THE SESSION.\n\nANAKIN CONTINUES TO EXCEL AT HIS TRAINING.\n\
    \nHE IS A PADAWAN THAT WOULD MAKE ANY MASTER PROUD.\n\nWHEN HE ACTUALLY LISTENS\
    \ AT LEAST.\n\nWHY HAVE I FELT SUCH UNEASE OF LATE?\n\nVERY GOOD, OBI-WAN.\n\n\
    THANK YOU, MASTER.\n\nIT'S TRUE I NEVER EXPECTED TO TAKE A PADAWAN OF MY OWN SOON.\n\
    \nAND I THOUGHT THAT WHEN I DID, I WOULD HAVE MY OWN MASTER, QUI-GON JINN, TO\
    \ TURN TO ADVICE.\n\nIF CIRCUMSTANCES WERE DIFFERENT...\n\nMASTER KENOBI?\n\n\
    HELLO, MASTER. HOW CAN I HELP YOU?\n\nTHE JEDI COUNCIL HAS ANOTHER MISSION FOR\
    \ YOU.\n\nAN ARCHAEOLOGY TEAM BELIEVES THEY'VE DISCOVERED AN ANCIENT JEDI HOLOCRON.\n\
    \nYES, ON THE PLANET DALLOR IN THE MID RIM.\n\nIT'S NOT A REPUBLIC WORLD, BUT\
    \ THE ARCHAEOLOGY TEAM ENCOUNTERED CIT--\n\nYOU'RE LEAVING AGAIN?\n\nI SHOULD'T\
    \ BE GONE FOR LONG, AND YOU CAN CONTINUE YOUR TRAINING WITH MASTER YODA.\n\nWITH\
    \ THE LITTLE KIDS. I'M ALWAYS SO FAR AHEAD OF THEM.\n\nPERHAPS. BUT IT'S NOT UP\
