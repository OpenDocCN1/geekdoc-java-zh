  md: 'their values can be changed during the execution of a program.


    # Control Flow:


    Java provides various control flow statements to dictate the execution order of
    code. The if-else statement is used for conditional branching, allowing the program
    to make decisions based on certain conditions. Loops, such as the for loop and
    while loop, are used for repetitive execution of code blocks. These control flow
    statements provide flexibility in designing the logic of a program.


    # Object-Oriented Programming (OOP):


    Java is an object-oriented programming language, which means it emphasizes the
    concept of objects. Objects have properties (variables) and behaviors (methods).
    The class serves as a blueprint for creating objects. OOP principles, such as
    encapsulation, inheritance, and polymorphism, allow for modular and reusable code.
    Encapsulation ensures that the internal workings of an object are hidden from
    external access, promoting data integrity and security.'
