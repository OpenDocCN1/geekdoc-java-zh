    # **Syntax and Structure:


    Java code is organized into classes, which serve as blueprints for creating objects.
    Each class contains variables (data) and methods (functions) that define the behavior
    of objects created from that class. The code is written in plain text files with
    a .java extension. Java programs follow a strict syntax and structure defined
    by the language.


    # **Variables and Data Types:


    In Java, variables are used to store data. Before using a variable, it must be
    declared with a specific data type. Java has several built-in data types, including
    int (for integers), double (for floating-point numbers), boolean (for true/false
    values), and String (for textual data). Variables can be assigned values, and'
  merge: -1
  pgno: 32
