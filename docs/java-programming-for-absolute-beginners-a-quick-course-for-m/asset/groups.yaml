    Chapter 5: operators


    Chapter 6: objects and classes


    Chapter 7: decision making


    Chapter 8: Loop control


    Chapter 9: File handling


    Chapter 10: Exception handling


    Conclusion


    # Introduction


    Java is a cross-platform, high-level language that was developed by Sun microsystems
    under the leadership of James Gosling. The first version of this Language was
    released in 1995 in the form of Java 1.0 [J2se]. Since then, java has come a long
    way and we are presently working on Java 8. besides this, several versions of
    java like j2me (for mobile applications) and j2ee (Java for enterprise applications)
    have also been released. java was released as open source software under gnu gpl
    by Sun in 2006. The process of this transformation was completed in 2007.


    This book is a beginner''s course on java fundamentals. Therefore, it has been
    created keeping in mind that the reader has little to know background knowledge
    about java. however, a little background of programming languages shall be helpful
    for better understanding. Through this course, we hope to instill the basics of
    programming in the reader from the perspective and with special focus on java.


    before you, it is good for you to understand that programming concepts are generic
    and apply well to a range of programming languages. Therefore, if you works building
    programming concepts instead of learning syntax, you will be able to learn many
    programming languages with minimal effort. Focus on the concept instead of the
    syntax


