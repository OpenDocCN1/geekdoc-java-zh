    \n## 调用方法\n\n方法需要被调用或执行才能被使用。如上面提供的示例代码所示，该方法正在执行某些计算并返回计算结果。这种方法返回一个值，其返回值已经在方法声明中已经指定。除此之外，还存在另一种类型的方法。这类方法不返回任何内容，通常被称为无返回值方法。\n\
