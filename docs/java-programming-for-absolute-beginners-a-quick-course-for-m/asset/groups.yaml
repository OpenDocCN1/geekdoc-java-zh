    # 第一章：开始学习 Java


    在进入 Java 编程之前，让我们先简要介绍一下 Java 编程语言的背景，以及学习这种编程语言的先决条件。该语言最重要的特征之一是它是跨平台的。这从 Java
    首次广告口号“一次编写， anywhere运行”（Write once, Run Anywhere）中显而易见。因此，你只需要编写代码、编译它，然后在任何系统上运行，无论是
    Windows、Unix、Linux 还是 Macintosh。


    除了上述之外，Java 的其他特性包括——


    - 平台无关

    - 对象面向

    - 简单

    - 安全

    - 可移植性

    - 架构无关

    - 解释型

    - 健壮

    - 分布式

    - 多线程

    - 动态

    - 高性能


    # 启动要求


    为了开始 Java 编程，你首先需要有一台运行 Linux、Windows 或 Macintosh 的可用电脑。在该系统上，你将使用两个工具进行 Java
    编程。其中第一个工具是文本编辑器。如果你在 Windows 上工作，可以使用记事本（Notepad）。


    对于其他操作系统，你可以尝试 textedit 或 VI 或本地可用的任何文本编辑器。Java 编程的第二个要求是 Java 8。你需要在你的系统上安装 Java
    8。如果你不想在本地环境中工作，也可以尝试可用的在线选项来编译和运行你的 Java 程序。


    # 准备好本地环境


    假设你已经准备好系统，并在系统上安装了文本编辑器，我们将直接跳到在系统上安装 Java。首先，你需要下载 Java。Java SE 是免费版本，你可以通过
    Google 搜索提供的链接进行下载。务必下载适用于你操作系统的开发版本。


    下载完成后，你将获得一个可执行文件，你需要运行它进行安装。安装完成后，你将收到一条提示完成的消息。然而，你还没有完成，在设置环境变量之前，Java 将无法工作。你可以使用以下指令在你的系统上设置环境变量——


    # Windows


    很大情况下，你通过点击安装包附带的 .exe 文件安装的 Java 版本必须安装在目录：`c:\Program Files\java\jdk`。假设如此，你只需要通过右键点击“我的电脑”来打开属性。在出现的对话框中，打开“高级”并进入“环境变量”。在现有字段内容的末尾添加
    `c:\Program Files\java\jdk\bin`。


    # Linux/freeBSD/Unix/Solaris


    按照惯例，环境变量的路径是 Java 安装二进制文件放置的路径。你可以在系统上查找这些二进制文件以获取实际路径，然后编辑 `.bashrc` 文件。当你使用任何文本编辑器打开此文件时，你需要添加以下语句：


    ```

    Export path = /path/to/java:$path

    ```


    虽然运行 Java 程序的标准方法是在记事本或任何文本编辑器中创建 `.java` 文件，然后使用命令行执行该文件。然而，在多年来，也出现了一些想法来让这项任务对程序员变得轻松。Netbeans
    和 Eclipse 就是这样两种流行的方案。你可以在网上阅读关于它们的信息，看看它们是否对你感兴趣。


    # 第二章：编写你的第一个 Java 程序


    Java 实现了面向对象的编程原则。因此，一个 Java 程序是一个类文件，在执行时会创建一组对象。这些对象通过方法相互通信。在 Java 术语中你经常遇到的一些术语已解释如下——


    Java 程序的要素元素是类（class）。它仅仅是一个定义对象状态和行为的模板。


    - 对象的的状态由变量（Variables）定义，行为由方法（methods）描述。因此，类包含了变量和方法。这里需要说明，每个使用类创建的对象都有自己的一组变量，因此变量也称为实例变量（Instance
    Variables）。

    - 当我们实例化一个类时，我们就创建一个对象（object），它是 Java 编程的第二个基本元素。


    为了帮助你理解这个概念，让我们举个例子。假设我们创建了一个名为 Car（汽车）的类。Car 是所有四轮小型车辆的通用术语，每辆汽车都有不同的规格，如品牌、颜色、发动机、变速箱和功能。这些功能是可以修改的。例如，你可能会更改颜色或增强某项功能。


    因此，car 是模板（在我们的案例中是一个类），但具体的汽车是该类的对象或实例。规格集是变量，而我们对这些变量进行的任何初始化或操作都是通过方法完成的。


    这个例子也可以很好地用于理解封装（encapsulation）和抽象（abstraction）这两个面向对象的原则。类将变量和方法封装在其中。因此，作为用户，你处理的是
    car 类，而其实现细节对你是隐藏的。这就是 Java 实现抽象的方式。


    '
