    \ (-2^63)\n- 64-bit signed 2's complement integer\n- maximum value = 9,223,372,036,854,775,807\
    \ (inclusive) (2^63-1)\n- this is used when the variable is expected to hold large\
    \ numbers.\n\n# Float\n\n- default value = 0.0f\n- 32-bit IEEE 754 floating point\n\
    - Single-precision\n- This data type is used as the default data type for storing\
    \ floating point numbers.\n- The use of this data type for storing values that\
    \ require precise calculations must be avoided.\n\n# double\n\n- 64-bit IEEE 754\
    \ floating point\n- double-precision\n- default value = 0.0d\n- This data type\
    \ is used for variables that need to store decimal values. however, like float,\
    \ the value of variables stored using double may vary. Thus, these data types\
    \ are not used for critical calculations like that concerning currency.\n\n# boolean\n\
