    # Chapter 1: getting Started With Java


    before we move on to Java programming, let us give you a brief background of java,
    the programming language, and the prerequisites of learning this programming language.
    One of the most important features of this programming language is that it is
    cross-platform. This is evident from the fact that java was first advertised with
    the tagline ''Write once, Run Anywhere''. So, all you need to write a code, compile
    it and then you can run it on any system, be it Windows, Unix, Linux or macintosh.


    besides the above-mentioned, other features of java include –


    - Platform independent

    - Object oriented

    - Simple

    - Secure

    - Portable

    - Architecture-independent

    - Interpreted

    - Robust

    - distributed

    - multithreaded

    - dynamic

    - high Performance


    # Requirements to get Started


    In order to get started with java programming, you need to first have a working
    computer with Linux or Windows or macintosh. On this system, you are going to
    use two tools for java programming. The first of these tools is a text editor.
    If you are working on Windows, you can use notepad.


    For other operating systems, you can try textedit or VI or whichever text editor
    is locally available. The second requirement for java programming is java 8. You
    will need to install Java 8 on your system. If you do not wish to Work on a local
    environment setup, you can also try one of the online options available to compile
    and run your java programs.


    # getting a Local Setup Ready


    Assuming that you have the system ready and you already have a text editor installed
    on the system, we are directly jumping to the installation of java on the system.
    To start with, you will need to download java. Java SE is the free version that
    you can download using the link that google Search for the same provides. Be sure
    to download the version that is developed for your operating system.


    Once the download is complete, you will have an executable, which you are required
    to run for installation. Upon completion of installation, you will get a message
    stating the same. however, you are not done yet java will not work until you set
    environment variables. You can set the environment variables on your system using
    the following instructions –


    # Windows


    In all probability, the java version that you installed by clicking on the .exe
    file that came along with the installation package must have installed in the
    directory: c:\Program Files\java\jdk. Assuming this, you just need to open properties
    by right clicking on ‘my computer’. In the dialog box that appears, open ‘Advanced’
    and go to ‘Environment variables’. Append the existing contents of the field by
    ‘c:\Program Files\java\jdk\bin’.


    # Linux/freeBSD/Unix/Solaris


    As a rule, the path of the environment variable is the path at which the binaries
    of the java installation are placed. You can look for these binaries on your system
    to get the actual path and then edit .bashrc file. When you open this file using
    any text editor, you need to add the statement:


    ```

    Export path = /path/to/java:$path

    ```


    While the standard way to run java programs is to create .java files in notepad
    or any text editor for the matter and then execute the file using command-line
    commands. however, over all these years, several ideas have also come into exist
    to make this task hassle-free for the programmer. netbeans and Eclipse are two
    such popular ideas. You can read about them online to see if they interest you.


    # Chapter 2: Writing Your First Java Program


    java implements object-oriented programming principles. Therefore, a java program
    is a class file that upon execution creates a set of objects. These objects communicate
    with each other by means of methods. Some of the terms that you will commonly
    encounter in the Java terminology have been explained –


    The foundation element of a java program is class . It is simply a template that
    defines the state and behavior of an object.


    - The state of the object is defined by Variables and the behavior is described
    by methods. Therefore, a class includes variables and methods. It is important
    to mention here that each object created using a class has its own set of variables
    and thus, variables are also called Instance Variables.

    - When we instantiate a class, we create an object , which is the second fundamental
    element of java programming.


    In order to help you understand this concept, let us take an example. Suppose
    we create a class called Car. Car is a general term for all four-wheeled small
    vehicles, every car has a different set of specifications like brand, color, engine,
    transmission type and features. These features can be modified. For example, you
    may get the color changed or a feature enhanced.


    Therefore, car is a template (or in our case a class) but specific cars are objects
    or instances of this class. The set of specifications are variables and any initialization
    or manipulations that we perform on these variables are done using methods.


    This example can also be best used to understand the object oriented principles
    of encapsulation and abstraction. The class encapsulates variables and methods
    into it. So, as the user, you are dealing with only the class car and its implementation
    is hidden from you. This is how java implements abstraction.

