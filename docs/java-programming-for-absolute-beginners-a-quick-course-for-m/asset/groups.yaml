    \ The use of enums is an error-reduction strategy and it was introduced in java\
    \ 5.0. It is possible to define enum inside a class or outside it. moreover, enums\
    \ can have constructors, variables and methods.\n\n# Keywords\n\nThe words that\
    \ are part of the java programming language and cannot be used as identifiers\
    \ are called keywords. These keywords are –\n\n| Assert | Abstract | break | boolean\
    \ |\n| :--- | :--- | :--- | :--- |\n| Catch | Char | byte | Case |\n| Const |\
    \ Class | default | Continue |\n| Else | Enum | | double |\n| Final | Extends\
    \ | Float | Finally |\n| If | Implements | For | goto |\n| Instanceof | Import\
    \ | Interface | Int |\n| new | Package | Long | native |\n| Protected | Private\
    \ | Return | Public |\n| Strictfp | Super | Short | Static |\n| Synchronized |\
    \ Switch | Throw | This |\n| Try | Void | Throws | Transient |\n| While | Volatile\
    \ | | |\n\n# Comments\n\nIn java, there is support for single-line and multi-line\
    \ comments. Single line comments start with // while multi-line comments start\
    \ with /* and end with /. You can look for these comments in the sample code given\
    \ above.\n\n# Blank Lines\n\nAny line that has a comment or no characters or whitespace\
    \ characters is not considered by Java. It is simply ignored.\n\n# Implementing\
    \ Inheritance\n\nThe inheritance characteristic of object-oriented programming\
    \ is implemented in java using the concept of deriving a new class from an existing\
    \ class. This allows you to reuse existing code. The existing class is called\
    \ a superclass while the derived class is referred to as a derived class.\n\n\
    # Interfaces\n\nIn case two objects need to communicate with each other, then\
