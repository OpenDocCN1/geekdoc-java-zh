    ## modifier types


    The behavior and access to the variables can be modified using modifiers. There
    are two main types of modifier types namely access modifiers and non-access modifiers.


    ### Access control modifiers


    - Java supports several access levels and each of this level has a corresponding
    keyword for it. These include:

    - Public: Accessible to everyone

    - Private: Accessible to the class

    - Protected: Accessible to the class and its subclasses

    - default: If no keyword is mentioned, the variable is accessible to the package.


    ### NON-access modifiers


    There are other modifiers, which are also available IN java. These include –


    - Static

    - Final

    - Abstract

    - Volatile and synchronized


    ## Chapter 5: operators


    Variables can be manipulated using operators. There are six classes of operators
    supported by java. Each of these classes has been discussed in detail below.


    ## Arithmetic operators


    All mathematical operations are performed using operators that fall under the
    category of arithmetic operators. List of supported operators have been given
    below.


    ### Addition (+)


    This operator performs addition between two numbers. If a and b are two variable
    holding 5 and 6 respectively. Then, c = a+b, will yield c = 11.


    ### Multiplication (*)


    This operator performs multiplication between two numbers. If a and b are two
    variable holding 5 and 6 respectively. Then, c = a*b, will yield c = 30.


    ### Subtraction (-)


    This operator performs subtraction between two numbers. If a and b are two variable
    holding 5 and 6 respectively. Then, c = a-b, will yield c = -1.


    ### division (/)


    This operator performs division between two numbers. If a and b are two variable
    holding 10 and 5 respectively. Then, c = a/b, will yield c = 2.


    ### modulus (%)


    This operator returns the remainder left after dividing the two numbers. If a
    and b are two variable holding 10 and 5 respectively. Then, c = a%b, will yield
    c = 0.


    ### Increment (++)


    This operator adds 1 to the value of the variable. If a is a variable holding
    the value 1, then a++ will yield the value 2.


    ### decrement (--)


    This operator reduces 1 from the value of the variable. If a is a variable holding
    the value 1, then a-- will yield the value 0.


    ## Relational operators


    All operations involving comparison are performed using relational operators.
    A list of the operators supported by this programming language is given below
    –


    - not EQUAL to (!)


    This operator is applied on two operands. It checks equality between two operands.
    If they are equal, it returns FALSE else it return true.


    - EQUAL to (==)


    This operator is applied on two operands. It checks equality between two operands.
    If they are equal, it returns true else it return FALSE.


    - greater than (>)


    This operator is applied on two operands. It checks equality between two operands.
    If the first operand is greater than the second operand, it returns true else
    return FALSE.


    - LESS than (<)


    This operator is applied on two operands. It checks equality between two operands.
    If the first operand is less than the second operand, it returns true else return
    FALSE.


    - greater than or EQUAL to (>=)


    This operator is applied on two operands. It checks equality between two operands.
    If the first operand is greater or equal to the second operand, it returns true
    else return FALSE.


    - LESS than or EQUAL to (<=)


    This operator is applied on two operands. It checks equality between two operands.
    If the first operand is less or equal to the second operand, it returns true else
    return FALSE.


    ## bitwise operators


    The only difference between normal operators and bitwise operators is that these
    operators perform operations bit-by-bit. moreover, these operators can be applied
    on byte, int, short, long and char. The list of bitwise operators supported in
    java include –


    - bitwise And (&)


    This operator works on two operands and the output for each set of input bits
    is 1 if both the inputs are one else the output is zero.


    - bitwise or (|)


    This operator works on two operands and the output for each set of input bits
    is 1 if one or both of the inputs is one else the output is zero.


    - bitwise xor (^)


    This operator works on two operands and the output for each set of input bits
    is 1 only if one of the inputs is one else the output is zero.


    - bitwise complement (~)


    This operator works on a single operand and negates the values from 0 to 1 and
    from 1 to 0.


    - Left shift (<<)


    This operator works on two operands. The bits of the left operand are shifted
    left. The number of places is equal to the number specified as value for the second
    operand.


    - Right shift (>>)


    This operator works on two- operands. The bits of the left operand are shifted
    right by the number specified as value for the second operand.


    - Zero FILL right shift (>>>)


    This operator works on two operands. The bits of the left operand are shifted
    right by the number specified as value for the second operand. moreover, 0 replaces
    the bits that are shifted.


    In order to understand how bitwise operations take place, let us take an example.
    Assume two variables, a and b, having the values 60 and 13 respectively. The binary
    equivalent of a and b are as follows


    A = 00111100

    b = 00000101


    Using the And truth table according to which the output is 1 only if both the
    inputs are 1. Correspondingly, the output of a&b = 00001100. Similarly other bitwise
    operations can also be performed.


    ## Logical operators


    All the logical operations in Java are performed using logical operators. The
    list of operators supported by this programming language is given below.


    ### Logical And


    This operator works on two operands. If both the operands are non-zero, the expression
    returns true else it returns FALSE.


    ### Logical or


    This operator works on two operands. If one or both the operands are non-zero,
    the expression returns true else it returns FALSE.


    ### Logical not


    This operator works on one operand. If the operand is zero, this expression returns
    true else it returns FALSE.


    ## Assignment operators


    The list of assignment operators supported by Java include –


    - Simple Assignment operator (=)


    This operator assigns the value computed by the right hand side to the variable
    on the left hand side. If a, b and c are three variable...


    - Add Assignment operator (+=)


    This operator assigns the value computed by the addition of the right hand side
    to the left hand side. If a and c are two variable and the expression is c+=a,
    then the value of a+b is assigned to c.


    - Subtract Assignment operator (-=)


    This operator assigns the value computed by the subtraction of the right hand
    side from left hand side. If a and c are two variable and the expression is c-=a,
    then the value of c-a is assigned to c.


    - multiply Assignment operator (*=)


    This operator assigns the value computed by the multiplication of the right hand
    side to the left hand side. If a and c are two variable and the expression is
    c*=a, then the value of c*a is assigned to c.


    - divide Assignment operator (/=)


    This operator assigns the value computed by the division of the left hand side
    with right hand side to the variable on the left hand side. If a and c are two
    variable and the expression is c/=a, then the value of c/a is assigned to c.


    - modulus Assignment operator (%=)


    This operator assigns the value computed by the modulus of the left hand side
    with right hand side to the variable on the left hand side. If a and c are two
    variable and the expression is c%=a, then the value of c%%a is assigned to c.


    - Left Shift Assignment operator (<<=)


    If a and c are two variable and the expression is c<<=a, then the value of c<<a
    is assigned to c.


    - Right Shift Assignment operator (>>=)


    If a and c are two variable and the expression is c>>=a, then the value of c>>a
    is assigned to c.


    - bitwise And Assignment operator (&=)


    If a and c are two variable and the expression is c&=a, then the value of c&a
    is assigned to c.


    - bitwise xor Assignment operator (^=)


    If a and c are two variable and the expression is c^=a, then the value of c^a
    is assigned to c.


    - bitwise Inclusive or and Assignment operator (|=)


    If a and c are two variable and the expression is c|=a, then the value of c|a
    is assigned to c.


    ## Operator Precedence


    If an expression uses multiple operators, then operator precedence rules are used
    to determine the order to execution of operations. The precedence of operators
    in terms of whether they will be evaluated from right to left or left to right
    is defined for groups of operators in the following manner –


    Right to Left


    - Unary

    - Conditional

