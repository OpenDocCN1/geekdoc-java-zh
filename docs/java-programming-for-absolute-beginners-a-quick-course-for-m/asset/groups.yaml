    - Logical And\n- Logical or\n\nFor example, if we have to evaluate the expression\
    \ a = 3 + 5 * 5, then multiplication is performed before addition. Therefore,\
    \ a = 28 instead of 40.\n\n# Chapter 6: objects and classes\n\nTo start with,\
    \ let us understand the concept of classes and objects. Class is a template, which\
