    \ }\n}\n```\n\n该代码执行后的输出如下\n\n# 第 9 章：文件处理\n\n所有文件操作都由 Java java.io 包支持，这些函数的实现基于流的概念。流简单来说的数据序列，分为两种类型：输入流和输出流。前者用于读取数据，后者用于写入数据。\n\
    \n## 字节流\n\nJava 支持的第一种流是字节流。在这种分类下，i/o 操作被限制为8 位大小。在我们开始编码之前，你需要意识到用于执行输入和输出的类分别是\
