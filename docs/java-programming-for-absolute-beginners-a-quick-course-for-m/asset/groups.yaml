    # 引言


    Java 是一种跨平台的高级语言，由 Sun Microsystems 在 James Gosling 的领导下开发。该语言的第一个版本于 1995 年以
    Java 1.0 [J2se] 的形式发布。从那时起，Java 取得了巨大的进步，我们目前正在使用 Java 8。此外，Java 的几个版本，如 j2me（用于移动应用程序）和
    j2ee（用于企业级应用程序的 Java）也已经发布。Java 在 2006 年由 Sun 以 GNU GPL 协议开源软件发布。这一转型过程在 2007
    年完成。


    这本书是一本关于 Java 基础的入门课程。因此，它的创建考虑到了读者对 Java 的背景知识很少或完全没有。然而，少量的编程语言背景知识将有助于更好地理解。通过这门课程，我们希望从
    Java 的视角并特别关注 Java，在读者心中植入编程基础。


    在开始之前，你最好了解编程概念是通用的，并适用于适用于一系列编程语言。因此，如果你侧重于构建编程概念而不是学习语法，你将能够以最小的努力学习许多编程语言。关注概念而不是语法。


