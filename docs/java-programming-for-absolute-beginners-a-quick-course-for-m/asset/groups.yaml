    \   default:\n            System.out.print(999);\n            break;\n    }\n\
    }\n```\n\nThe output of this code upon execution is as follows –\n\n# Conditional\
    \ operator\n\nJava also supports the conditional operator, which is also KNOWN\
    \ as the ?: operator. This operator is used to replace the ‘if else’ construct.\
    \ Its syntax is as follows –\n\nExpression1 ? Expression2 : Expression3\n\nhere,\
    \ Expression1 is the condition that is to be tested. If the condition is true,\
    \ Expression2 is executed else Expression3 is executed.\n\n![](img/73ee4bf5cc63fca6a92dbd634bd146b7_81_0.png)\n\
    \n# Chapter 8: Loop control\n\nThere are several situations that require you to\
    \ iterate the same set of instructions a number of times. For instance, if you\
    \ need to sort a set of numbers, you will need to scan and rearrange the set several\
    \ times to get the desired arrangement. This flow of execution is known as loop\
    \ control.\n\nSimply, a loop is a construct that allows execution of a block of\
    \ code many times. Java supports several constructs that can be used for implementing\
    \ loops. These include while loop, for loop and do while loop.\n\n- A while loop\
    \ executes a block of code iteratively until the condition specified for the while\
    \ loop is true. The moment this condition fails, while loop stops.\n\n- For loop\
    \ allows the programmer to manipulate the condition and loop variable in the same\
    \ construct. Therefore, you can initialize a loop variable, increment/decrement\
    \ it and run the loop until a condition on this variable is true.\n\ndo while\
    \ loop is similar to while loop, however, in the while loop, the condition is\
    \ checked before executing the block code. On the other hand, in a do while loop,\
    \ the block of code is executed and then the condition is checked. If the condition\
    \ is satisfied, the loop execution is again initiated else the loop is terminated.\
    \ It would not be wrong to state that the do while loop once implemented will\
    \ execute at least once.\n\n# Loop statements\n\nThere are two keywords that are\
    \ specifically used in connection with loops and are also termed as control statements\
    \ as they allow transfer of control from one section of the code to a different\
    \ section. These keywords are –\n\nbreak\n\nThis keyword is used inside the loop\
    \ at a point where you want the execution flow to terminate the loop and directly\
    \ start execution from the first instruction that appears after the loop.\n\n\
    Continue\n\nThis keyword is used inside the loop at a point where the programmer\
    \ wants the computer to overlook the rest of the loop and move the control to\
    \ the first statement of the loop.\n\nIn order to help you understand how loops\
    \ are executed, let us take an example and implement it using all the three types\
    \ of loop control.\n\n# For Loop Implementation\n\n```java\nPublic class fordemo\
    \ {\n    Public static void main(String[] args[]) {\n        int [] numberarray\
    \ = {100, 300, 500, 700, 900};\n        For(int i=0; i<5; i++) {\n           \
    \ System.out.print(numberarray[i]);\n        }\n    }\n}\n```\n\nThe output of\
    \ this code upon execution is as follows –\n\n# While Loop Implementation\n\n\
    Public class whileledemo {\n\npublic static void main(String[] args[]) {\n   \
    \ int [] numberarray = {100, 300, 500, 700, 900};\n    int i = 0;\n    While(i<5)\
    \ {\n        System.out.print(numberarray[i]);\n        System.out.print(\",\"\
    );\n        i++;\n    }\n    System.out.print(\"\\n\");\n}\n```\n\nThe output\
    \ of this code upon execution is as follows –\n\n# do Loop Implementation\n\n\
