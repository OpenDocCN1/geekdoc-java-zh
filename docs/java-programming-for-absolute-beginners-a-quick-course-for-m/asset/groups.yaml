    \ that are used for accessing an object. They are usually created using class\
    \ constructors and their type, once defined, cannot be changed. Array variables\
    \ and class objects reference variables. Lastly, the default value in this case\
    \ is null.\n\n# Java Literals\n\nLiteral is used to represent a fixed value. They\
    \ are declared as variables and have a data type. Sample declaration of a literal\
    \ is - Char x = 'X';\n\nYou may notice integers and float with different bases.\
    \ As a rule, any literal value that has 0 prefix is octal numbers while 0x prefix\
    \ indicates hexadecimal numbers. If you are working with strings, then string\
    \ literals are always defined as sequence of characters enclosed within double\
    \ inverted commas. Another set of characters that you will work with is escape\
    \ characters. A list of escape characters has been given below –\n\n- Carriage\
    \ Return (\\r)\n- NEWLINE (\\n)\n- backspace (\\b)\n- Formfeed (f)\n- Tab (t)\n\
    - Space (\\s)\n- Single quote (\\')\n- double quote (\\\")\n- hexadecimal character\
    \ (\\uxxxx)\n- Octal character (\\ddd)\n- backslash (\\\\)\n\n# Chapter 4: Variables\n\
    \nThe simplest definition of a variable is that it is a name given to some memory\
    \ area. however, there are many types of variables, which java supports. On the\
    \ basis of the type of variable, the following parameters are determined –\n\n\
    - Size of memory blocked for the variable.\n- Layout of the blocked memory.\n\
    - Operations that can be performed on the variable.\n- Range of values that the\
    \ variable can hold.\n\nAs a rule, every variable needs to be declared before\
    \ use. The standard statement for variable declaration is data_type variable_name;\n\
    \nhere, data_type is the data type of the variable while variable_name is the\
    \ identifier used for the variable. If you are using multiple variables of the\
    \ same type, you can club them in the same statement by specifying the name of\
    \ the variables in a comma-separated manner. As mentioned previously, java supports\
    \ three types of variables namely, class variable, instance variable and local\
    \ variables. This chapter explains these variable types in detail.\n\n# Local\
    \ Variables\n\nVariables that are declared inside a method or block of code are\
