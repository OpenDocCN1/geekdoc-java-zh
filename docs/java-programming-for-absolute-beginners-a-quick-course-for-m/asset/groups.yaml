    \n## 这是 finalize() 方法\n\n在 Java 编程中，你会处理大量的对象，所有这些对象都会在内存中占用空间。如果你正在编写大规模代码，可能要求在终止程序之前清除这些对象所占的空间。为了方便这一操作，Java\
