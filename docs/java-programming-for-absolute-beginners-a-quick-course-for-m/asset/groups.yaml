    \n# Variable Arguments\n\nIn some programs, there may be a requirement where you\
    \ don't know the exact number of arguments that the main method will give during\
    \ execution. To allow dynamicity of this level, var-args or variable arguments\
    \ are used. Var-args are declared in the method parameter using the syntax:\n\n\
    <type>...<var_name>\n\nThe var_name given in the variable declaration is an array\
    \ that contains all the variable values sent by the main method while executing\
    \ before implementing this concept, you need to remember two things –\n\n- Only\
    \ one var-args can be implemented per method.\n- If the method has other arguments\
    \ (regular in nature), these arguments must appear before the var-args. In other\
    \ words, var-args must be the last argument in a method.\n\nA sample implementation\
    \ of this concept is given below.\n\n```\nPublic class demovarargs {\n    Public\
    \ static void main(String args[]) {\n        Printnum(56.5, 3, 34, 2, 3);\n  \
    \      Printnum(new double[]{2, 1, 3});\n    }\n    Public static void printnum(\
    \ double... number) { if (number.length == 0) {\n        System.out.println(\"\
