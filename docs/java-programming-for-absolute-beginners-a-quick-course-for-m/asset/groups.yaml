    \ is declared within a class, outside the method block, using the word static\
    \ is called class variable.\n\n# Creating objects\n\nEvidently, as the class is\
    \ a template, you will need to create objects using this template. The keyword\
    \ 'new' is used. Creation of an object involves three steps. The first step is\
    \ to declare a variable for the object. The second step is to create an object\
    \ using the new. Lastly, the object needs to be initialized using the constructor\
    \ for the class.\n\nIn you omit the third step, java uses the default constructor\
    \ method for object initialization. All these three steps are combined into one\
    \ statement for object creation. For example, we have a class democlass and we\
    \ wish to create object o1, then this can be done using the statement –\n\n```\n\
    democlass o1 = new democlass\n```\n\nThe variables and methods of the class for\
    \ which the object can be accessed using '.' operator. Therefore, if we have a\
    \ class democo with the variable x and we create an object o1, then we can access\
    \ x using the following statement: o1.x.\n\n# Constructors\n\nWhen you get down\
    \ to creating classes and objects, the first thing that you need to do is initialize\
    \ the object. java has a dedicated method implementation for initialization, which\
    \ is called constructor. These elements are implemented\n\nLike methods, but they\
    \ carry the same name as the class and have no return type.\n\nSo, where can you\
    \ use a constructor? You can use it whenever you are creating an object of a class\
    \ and you need to initialize some parameters or perform some function that is\
    \ common to all the objects of the class. For example, if you create a class called\
    \ rectangle. You can create a constructor to initialize the length and breadth\
    \ of the rectangle.\n\nIf you don't define a constructor, java uses the default\
    \ constructor for your program. This constructor program initializes the value\
