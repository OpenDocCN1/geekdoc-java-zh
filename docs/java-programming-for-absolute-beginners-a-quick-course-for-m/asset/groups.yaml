    ```\nSwitch(variable){\nCase <value1>:\n    /*body*/\n    break;\nCase <value2>:\n\
    \    /* Body */\n    break;\ncase <value3>:\n    /* Body */\n    break;\ndefault:\n\
    \    /* body */\n    break;\n}\n```\n\n![](img/73ee4bf5cc63fca6a92dbd634bd146b7_78_0.png)\n\
    \nSample implementation for this construct is given below – public class switchdemo\
