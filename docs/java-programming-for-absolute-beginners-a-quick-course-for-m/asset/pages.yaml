    There are some important things to know and remember about java. These include
    –


    +   - names given to identifiers can begin with alphabets (lower case or upper
    case) and special characters – underscore (_) and currency ($). This also means
    that an identifier''s name cannot begin with a number or any special character.


    +   - The use of a defined keyword as an identifier is not allowed.


    +   - Lastly, always remember that java is case-sensitive and icount and icount
    are different identifiers.


    # Modifiers


    Classes, methods and variables can be modified only using modifiers. There are
    two types of modifiers, which are as follows –


    +   **non-access modifiers** - strictfp, abstract, final Access **modifiers**
    - pualic, default, private, protected


    Access modifiers determine how the class, method or variable can be accessed and
    all who have the permission to access them. Other modifiers, which do not work
    on similar lines are classified as non-access modifiers.


    # Variables


    Java supports three types of variables namely class variable, local variables
    and instance variables. Class variables are also called static variables while
    instance variables have been termed as non-static variables.


    # Arrays


    A collection of elements of the same type is called an array. Java supports array
    objects of different types.


    # EnUMs'
