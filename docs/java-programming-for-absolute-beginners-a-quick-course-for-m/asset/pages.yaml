    # Implementing Inheritance


    The inheritance characteristic of object-oriented programming is implemented in
    java using the concept of deriving a new class from an existing class. This allows
    you to reuse existing code. The existing class is called a superclass while the
    derived class is referred to as a derived class.


    # Interfaces


    In case two objects need to communicate with each other, then a protocol of communication
    needs to be established between these objects. This protocol of communication
    is called an interface. This concept is usually used in the implementation of
    the inheritance concept. An interface is used to define the methods that a subclass
    must have. however, it is the subclass that implements those methods.'
