  md: '# Chapter 10: Exception handling


    Exception is any event that is unexpected, usually in manner that cannot be handled
    by the program concerned. Obviously, the normal flow of execution of the program
    is hampered in such a situation and the program may either terminate with an error
    or behave abnormally. This is the reason why exceptions need to be handled by
    the program only.


    So, why do exceptions occur? Exceptions may occur because of a range of reasons.
    Some of the scenarios that may lead to this inadvertent situation include –


    +   Invalid data entry


    +   The program is trying to open a file that is not present at the specified
    location


    +   The JVM has fallen short of memory


    +   network communication is being carried out and the system loses network connection.


    Evidently, exceptions may occur due to problems created by the system, user or
    issues at the program level. On the basis of this observation, three classes of
    exceptions have been created. These three classes of exceptions have been discussed
    in chapter.


