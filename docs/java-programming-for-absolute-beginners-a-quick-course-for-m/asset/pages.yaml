  md: '# Chapter 2: Writing Your First Java Program


    java implements object-oriented programming principles. Therefore, a java program
    is a class file that upon execution creates a set of objects. These objects communicate
    with each other by means of methods. Some of the terms that you will commonly
    encounter in the Java terminology have been explained –


    The foundation element of a java program is class . It is simply a template that
    defines the state and behavior of an object.


    +   The state of the object is defined by Variables and the behavior is described
    by methods. Therefore, a class includes variables and methods. It is important
    to mention here that each object created using a class has its own set of variables
    and thus, variables are also called Instance Variables.


    +   When we instantiate a class, we create an object , which is the second fundamental
    element of java programming.


    In order to help you understand this concept, let us take an example. Suppose
    we create a class called Car. Car is a general term for all four-wheeled small
    vehicles, every car has a different set of specifications like brand, color, engine,
    transmission type and features. These features can be modified. For example, you
    may get the color changed or a feature enhanced.


    Therefore, car is a template (or in our case a class) but specific cars are objects
    or instances of this class. The set of specifications are variables and any initialization
    or manipulations that we perform on these variables are done using methods.


    This example can also be best used to understand the object oriented principles
    of encapsulation and abstraction. The class encapsulates variables and methods
    into it. So, as the user, you are dealing with only the class car and its implementation
    is hidden from you. This is how java implements abstraction.'
