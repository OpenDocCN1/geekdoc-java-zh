  md: 'It gave the result that it did.


    Firstly, writing a program in java requires you to follow some conventions. These
    are listed below –


    Java is a case-sensitive language. In other words, class and class are two different
    words for Java. be careful when you are using keywords or any other elements in
    the program.


    As a convention, the first letter of every word of the class name is supposed
    to be capital. For example, if the name of the class is car, the ''c'' is supposed
    to be capital. On the other hand, if the name of the class is Sportcar, then S
    and c must be capital as both of them are first letters of the two words that
    form the name of the class.


    method names also follow a capitalization convention according to which the first
    letter of the method name must be small in case. however, if the name if made
    from more than one word, except for the first word, every other word''s first
    letter must be capital. For example, if the method''s name is add, then ''a''
    must be small, but if the method''s name is addnumbers, then ''a'' will be small
    and ''n'' will be capital.


    The name of the java file must be same as the name of the class, followed by .java
    extension. For example, if the name of your class is sampleapplication, then the
    name of the java file must be sampleapplication.java. Also remember that the case
    of the letter must also match. If you do not fulfill any of these requirements,
    you will not be able to compile the program.


    The execution of a java program begins with the main method. Therefore, every
    java program must have a main method and the main method in java programming is
    defined as


    ```

    Public static void main(String args[])

    but again, if your program doesn''t have a main method, the

    program will not run.

    ```'
