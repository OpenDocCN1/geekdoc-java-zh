  md: '# Chapter 4: Variables


    The simplest definition of a variable is that it is a name given to some memory
    area. however, there are many types of variables, which java supports. On the
    basis of the type of variable, the following parameters are determined –


    +   - Size of memory blocked for the variable.


    +   - Layout of the blocked memory.


    +   - Operations that can be performed on the variable.


    +   - Range of values that the variable can hold.


    As a rule, every variable needs to be declared before use. The standard statement
    for variable declaration is data_type variable_name;


    here, data_type is the data type of the variable while variable_name is the identifier
    used for the variable. If you are using multiple variables of the same type, you
    can club them in the same statement by specifying the name of the variables in
    a comma-separated manner. As mentioned previously, java supports three types of
    variables namely, class variable, instance variable and local variables. This
    chapter explains these variable types in detail.


    # Local Variables


    Variables that are declared inside a method or block of code are local to the
    scope and called local variables. The variable is created as and when it is declared
    and defined in the block. moreover, the variable is destroyed once the scope of
    the block gets over. Variables of this type cannot make use of access modifiers
    (described later in this chapter).


    Since, this type of variable is alive within the scope of the method or block,
    it can only be accessed within this block of code. Internally, local variables
    are created at the stack-level. So, when they are created, they are pushed onto
    stack and as soon as the block finishes execution, the stack is emptied. Lastly,
    the default'
