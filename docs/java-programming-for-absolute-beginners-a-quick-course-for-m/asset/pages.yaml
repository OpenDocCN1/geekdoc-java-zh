  md: '# Chapter 3: data types


    When we declare variables, we basically block space in the memory and give it
    a reference name so that we can access it later and manipulate its contents. The
    amount of memory reserved for a variable depends on the data type given at the
    time of declaration. Therefore, by giving different data types to variables, you
    can reserve different amounts of memory for the variable in the memory. There
    are two main types in java, which are primitive datatypes and object datatypes.


    # Primitive data types


    java supports eight primitive data types and there is a keyword corresponding
    to each of these data types to allow declaration of variables under this data
    type. These data types include –


    +   byte

    maximum value = 127 (inclusive)(2^7 -1)

    minimum value = -128 (-2^7)

    8-bit signed 2''s complement integer

    default value = 0

    This data type is generally used in cases where memory is to be saved.

    byte data type is used to save space in large arrays, mainly in place of integers,
    since a byte is four times smaller than an integer.


    # Short


    +   maximum value = 32,767 (inclusive) (2^15-1)'
