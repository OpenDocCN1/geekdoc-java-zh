  raw: "Prototype is unique among creational design pattern in that it does not require\
    \ a class. It just needs an object. The key idea here is that an object can spawn\
    \ other objects similar to itself. If you have one tree in computer game, you\
    \ could create many trees just by cloning fret tree. All modern languages like\
    \ Java, C# offers built in clone function at System.Object level that can be overridden\
    \ by custom classes to achieve prototype functionality.\n\n**Implementation**\n\
    \nThe use case here is that client would like a construct a home. Home needs parts\
    \ like doors and windows. Doors and windows of one home are similar in nature.\
    \ They may vary by size.\n\nDBContext is helper class that fetches default width\
    \ and height from database. When home needs first door, we can create a basic\
    \ door from scratch and keep it ready. First door is created using a constructor\
    \ and it would call DbContext’s getDefaultDoorHeight() and getDefaultDoorWidth()\
    \ to get default width and height for door. It is time consuming call and requires\
    \ 2 roundtrips to database. \n\nWhen home needs another door, instead of creating\
    \ from scratch, we can copy the data from first door and modify its properties\
    \ as necessary. IClonable interface represents ability to copy an object. It just\
    \ has clone() function. Any class that needs to implement copy functionality,\
    \ they can override clone() function and provide their implementation of clone().\
    \ Door and Window class implement IClonable interface, thus provide ability to\
    \ clone them. Client can call clone function on door and window object to create\
    \ as any doors and windows as necessary for the home. When a door or window is\
    \ cloned, we just make copy of existing object and then update as necessary. This\
    \ cloning ability prevents expensive roundtrips to database.\n\nThis is depicted\
    \ in picture below. \n\n ![Image](Images/image00049.jpeg)\n\nHere is java code\
    \ that implements above classes.\n\nFile: DBContext.java\n\n**public class** DBContext\
    \ {\n\n **public static double** getDefaultDoorHeight()\n\n {\n\n *//simulate\
    \ database connection value* System.***out***.println(**\"Connecting to database...\"\
    **);\n\n System.***out***.println(**\"Fetching default door height...\"**);\n\n\
    \ *//simulate value obtained from database* **return** 20.0;\n\n }\n\n **public\
    \ static double** getDefaultDoorWidtht()\n\n {\n\n *//simulate database connection\
    \ value* System.***out***.println(**\"Connecting to database...\"**);\n\n System.***out***.println(**\"\
    Fetching default door width...\"**);\n\n *//simulate value obtained from database*\
    \ **return** 10.0;\n\n }\n\n **public static double** getDefaultWindowHeight()\n\
    \n {\n\n *//simulate database connection value* System.***out***.println(**\"\
    Connecting to database...\"**);\n\n System.***out***.println(**\"Fetching default\
    \ window height...\"**);\n\n *//simulate value obtained from database* **return**\
    \ 5.0;\n\n }\n\n **public static double** getDefaultWindowWidth()\n\n {\n\n *//simulate\
    \ database connection value* System.***out***.println(**\"Connecting to database...\"\
    **);\n\n System.***out***.println(**\"Fetching default window width...\"**);\n\
    \n *//simulate value obtained from database* **return** 6.0;\n\n }\n\n}\n\nFile:\
    \ IClonable.java\n\n**public interface** IClonable {\n\n Object clone();\n\n}\n\
    \nFile: Door.java\n\n**public class** Door **implements** IClonable{\n\n **public\
    \ double** **hingSize** = 4.0;\n\n **public double** **width** = 0.0;\n\n **public\
    \ double** **height** = 0.0;\n\n **public** Door()\n\n {\n\n **this**.**height**\
    \ =DBContext.*getDefaultDoorHeight*();\n\n **this**.**width** = DBContext.*getDefaultDoorWidtht*();\n\
    \n }\n\n @Override **public** Object clone() {\n\n Door theDoor = **new** Door();\n\
    \n theDoor.**hingSize** = **this**.**hingSize**;\n\n theDoor.**width** = **this**.**width**;\n\
    \n theDoor.**height** = **this**.**height**;\n\n **return** theDoor;\n\n }\n\n\
    \ **public void** fixHinge()\n\n {\n\n System.***out***.println(**\"Fixing hinge\
    \ to the door\"**);\n\n **this**.**hingSize** = 20.0;\n\n }\n\n}\n\nFile: Window.java\n\
    \n**public class** Window **implements** IClonable {\n\n **public double** **glassSize**\
    \ = 10.0;\n\n **public double** **width** = 0.0;\n\n **public double** **height**\
    \ = 0.0;\n\n **public** Window()\n\n {\n\n **this**.**height** = DBContext.*getDefaultWindowHeight*();\n\
    \n **this**.**width** = DBContext.*getDefaultWindowWidth*();\n\n }\n\n @Override\
    \ **public** Object clone() {\n\n Window theWindow = **new** Window();\n\n theWindow.**glassSize**\
    \ = **this**.**glassSize**;\n\n theWindow.**width** = **this**.**width**;\n\n\
    \ theWindow.**height** = **this**.**height**;\n\n **return** theWindow;\n\n }\n\
    \n **public void** fixGlass()\n\n {\n\n **this**.**glassSize** = 5.0;\n\n System.***out***.println(**\"\
    Fixing glass to the window\"**);\n\n }\n\n}\n\nFile: Client.java\n\n**public class**\
    \ Client {\n\n **public static void** main(String[] args)\n\n {\n\n *//Build a\
    \ home with 2 doors and 4 windows\n\n //First door create from scratch* Door door1\
    \ = **new** Door();\n\n *//Build Second door by cloing first door* Door door2\
    \ = (Door)door1.clone();\n\n door1.fixHinge();\n\n door2.fixHinge();\n\n *//Build\
    \ first windo from scratch* Window window1 = **new** Window();\n\n *//Build 3\
    \ other windows by cloing first window* Window window2 = (Window)window1.clone();\n\
    \n Window window3 = (Window)window1.clone();\n\n Window window4 = (Window)window1.clone();\n\
    \n window2.fixGlass();\n\n window2.fixGlass();\n\n window3.fixGlass();\n\n window4.fixGlass();\n\
    \n }\n\n}\n\nOutput:\n\nConnecting to database...\n\nFetching default door height...\n\
    \nConnecting to database...\n\nFetching default door width...\n\nConnecting to\
    \ database...\n\nFetching default door height...\n\nConnecting to database...\n\
    \nFetching default door width...\n\nFixing hinge to the door\n\nFixing hinge to\
    \ the door\n\nConnecting to database...\n\nFetching default window height...\n\
    \nConnecting to database...\n\nFetching default window width...\n\nConnecting\
    \ to database...\n\nFetching default window height...\n\nConnecting to database...\n\
    \nFetching default window width...\n\nConnecting to database...\n\nFetching default\
    \ window height...\n\nConnecting to database...\n\nFetching default window width...\n\
    \nConnecting to database...\n\nFetching default window height...\n\nConnecting\
    \ to database...\n\nFetching default window width...\n\nFixing glass to the window\n\
    \nFixing glass to the window\n\nFixing glass to the window\n\nFixing glass to\
    \ the window\n\nProcess finished with exit code 0\n\n**Benefits**\n\n**Scalability:**\
    \ Prototype pattern fast way to create new objects by cloning existing object\
    \ which in turn improves efficiency of resource usage and improves scalability\
    \ of overall system. \n\n**Simplicity and Consistency :** Prototype patterns simplifies\
    \ new object creation by enforcing cloning ability via IClonable interface. Using\
    \ IClonable interface also makes closing behavior consistent across all classes.\n\
    \n## **CHAPTER FIVE**\n\n### ***Singleton***\n\n**Background**\n\nSingleton design\
    \ pattern is used when as a designer of class, you need to control number of instances\
    \ of your class that user can control . Specifically the number of instances that\
    \ external consumer can create is restricted to one and only one. There are many\
    \ use cases where restricting number of instances is obvious and safe choice.\
    \ For instance the class that reads configuration information of application and\
    \ is used as read only class should be singleton. Other examples of singleton\
    \ classes are print spooler class,. Usually constructor of a Singleton class is\
    \ made private. It just has a static method to access the only instance. The only\
    \ instance serves as global point of access to the object.\n\n**Implementation**\n\
    \nThe use case here is that client would like access a configuration information\
    \ of an application. This configuration information is stored in a text file in\
    \ key value pairs. "
