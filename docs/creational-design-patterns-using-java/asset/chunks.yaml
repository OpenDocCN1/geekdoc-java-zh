  trans: "\n原型模式在创建类设计模式中是独一无二，因为它不需要类，只需要一个对象。这里的核心思想是对象可以产生与自身相似的其他对象。如果你在计算机游戏中有一棵树，你只需克隆这棵树就可以创建很多棵树。所有现代语言（如\
    \ `Java`、`C#`）在 `System.Object` 级别提供了内置的 `clone` 函数，自定义类可以通过重写该函数来实现原型功能。\n\n\
    ### 实现\n\n此处的用例是客户端想要构建一栋房屋。`Home` 需要门和窗户等部件。一栋房屋的门和窗户本质上是相似的，它们在尺寸上有所不同。\n\n\
    `DBContext` 是一个辅助类，从数据库中获取默认宽度和高度。当 `home` 需要第一扇门时，我们可以从零创建一个基础门并将其准备好。第一扇门是通过构造函数创建的，它会调用\
    \ `DbContext.getDefaultDoorHeight()` 和 `DbContext.getDefaultDoorWidth()` 来获取门的默认宽度和高度。这是一个耗时的调用，并且需要与数据库交互往返。\n\
    \n当 `home` 需要另一扇门时，我们不需要从零开始，而是从第一扇门复制数据并根据需要修改其属性。`IClonable` 接口表示复制对象的能力，它仅包含\
    \ `clone()` 函数。任何需要实现复制功能的类都可以重写 `clone()` 函数并提供自己的 `clone()` 实现。`Door` 和 `Window`\
    \ 类实现了 `IClonable` 接口，从而提供了克隆能力。客户端可以调用 `door` 和 `window` 对象上的 `clone` 函数，为 `home`\
    \ 创建所需的任意数量的门和窗户。当门或窗户被克隆时，我们只需创建现有对象的副本，然后根据需要进行更新。这种克隆能力避免了昂贵的数据库往返操作。\n\n下图所示。\n\
    \n![Image](img/image00049.jpeg)\n\n以下是实现上述类的 Java 代码。\n\n文件：`DBContext.java`\n\
    \n```java\npublic class DBContext {\n    public static double getDefaultDoorHeight()\
    \ {\n        //模拟数据库连接值* System.out.println(\"Connecting to database...\");\n\
    \        System.out.println(\"Fetching default door height...\");\n        //模拟从数据库获取的值*\
    \ return 20.0;\n    }\n\n    public static double getDefaultDoorWidtht() {\n \
    \       //模拟数据库连接值* System.out.println(\"Connecting to database...\");\n     \
    \   System.out.println(\"Fetching default door width...\");\n        //模拟从数据库获取的值*\
    \ return 10.0;\n    }\n\n    public static double getDefaultWindowHeight() {\n\
    \        //模拟数据库连接值* System.out.println(\"Connecting to database...\");\n    \
    \    System.out.println(\"Fetching default window height...\");\n        //模拟从数据库获取的值*\
    \ return 5.0;\n    }\n\n    public static double getDefaultWindowWidth() {\n \
    \       //模拟数据库连接值* System.out.println(\"Connecting to database...\");\n     \
    \   System.out.println(\"Fetching default window width...\");\n        //模拟从数据库获取的值*\
    \ return 6.0;\n    }\n}\n```\n\n文件：`IClonable.java`\n\n```java\npublic interface\
    \ IClonable {\n    Object clone();\n}\n```\n\n文件：`Door.java`\n\n```java\npublic\
    \ class Door implements IClonable {\n    public double hingSize = 4.0;\n    public\
    \ double width = 0.0;\n    public double height = 0.0;\n\n    public Door() {\n\
    \        this.height = DBContext.getDefaultDoorHeight();\n        this.width =\
    \ DBContext.getDefaultDoorWidtht();\n    }\n\n    @Override\n    public Object\
    \ clone() {\n        Door theDoor = new Door();\n        theDoor.hingSize = this.hingSize;\n\
    \        theDoor.width = this.width;\n        theDoor.height = this.height;\n\
    \        return theDoor;\n    }\n\n    public void fixHinge() {\n        System.out.println(\"\
    Fixing hinge to the door\");\n        this.hingSize = 20.0;\n    }\n}\n```\n\n\
    文件：`Window.java`\n\n```java\npublic class Window implements IClonable {\n    public\
    \ double glassSize = 10.0;\n    public double width = 0.0;\n    public double\
    \ height = 0.0;\n\n    public Window() {\n        this.height = DBContext.getDefaultWindowHeight();\n\
    \        this.width = DBContext.getDefaultWindowWidth();\n    }\n\n    @Override\n\
    \    public Object clone() {\n        Window theWindow = new Window();\n     \
    \   theWindow.glassSize = this.glassSize;\n        theWindow.width = this.width;\n\
    \        theWindow.height = this.height;\n        return theWindow;\n    }\n\n\
    \    public void fixGlass() {\n        this.glassSize = 5.0;\n        System.out.println(\"\
    Fixing glass to the window\");\n    }\n}\n```\n\n文件：`Client.java`\n\n```java\n\
    public class Client {\n    public static void main(String[] args) {\n        //构建一栋有\
    \ 2 扇门和 4 扇窗户的房屋\n        //从零创建第一扇门* Door door1 = new Door();\n        //通过克隆第一扇门构建第二扇门*\
    \ Door door2 = (Door)door1.clone();\n        door1.fixHinge();\n        door2.fixHinge();\n\
    \        //从零创建第一扇窗户* Window window1 = new Window();\n        //通过克隆第一扇窗户构建另外\
    \ 3 扇窗户* Window window2 = (Window)window1.clone();\n        Window window3 = (Window)window1.clone();\n\
    \        Window window4 = (Window)window1.clone();\n        window2.fixGlass();\n\
    \        window3.fixGlass();\n        window4.fixGlass();\n    }\n}\n```\n\n输出：\n\
    \n```\nConnecting to database...\nFetching default door height...\nConnecting\
    \ to database...\nFetching default door width...\nConnecting to database...\n\
    Fetching default door height...\nConnecting to database...\nFetching default door\
    \ width...\nFixing hinge to the door\nFixing hinge to the door\nConnecting to\
    \ database...\nFetching default window height...\nConnecting to database...\n\
    Fetching default window width...\nConnecting to database...\nFetching default\
    \ window height...\nConnecting to database...\nFetching default window width...\n\
    Connecting to database...\nFetching default window height...\nConnecting to database...\n\
    Fetching default window width...\nConnecting to database...\nFetching default\
    \ window height...\nConnecting to database...\nFetching default window width...\n\
    Fixing glass to the window\nFixing glass to the window\nFixing glass to the window\n\
    Fixing glass to the window\n```\n"
- fmt: "\nSince same configuration information is needed in read only fashion everywhere,\
    \ we just one instance of configuration reader. `ConfigReader` is a singleton\
    \ class. Its constructor is made private so that client can not directly instantiate\
    \ it. It has `getInstance()` method that `Client` can use to access the only instance\
    \ it has. `loadConfig()` information is used for reading the information from\
    \ text file during initialization part and keeps it in internal hash table. Once\
    \ client contains instance of `ConfigReader`, it can get value of a configuration\
    \ key by calling `getValue()` method by passing in value of key in question. `getValue()`\
    \ function looks up hash table to get the value for specified key and returns\
    \ it. The class diagram is depicted below.\n\n![Image](Images/image0005.jpeg)\n\
    \nHere is java code that implements above classes.\n\nFile: `ConfigReader.java`\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.FileNotFoundException;\n\
    import java.io.FileReader;\nimport java.io.IOException;\nimport java.util.Hashtable;\n\
    \npublic class ConfigReader {\n    private static ConfigReader _configReader =\
    \ null;\n    private Hashtable configTable = null;\n\n    private ConfigReader()\
    \ {\n    }\n\n    public static ConfigReader getInstance(String filePath) {\n\
    \        if(_configReader == null) {\n            _configReader = new ConfigReader();\n\
    \            loadConfig(filePath);\n        }\n        return _configReader;\n\
    \    }\n\n    public static void loadConfig(String filePath) {\n        System.out.println(\"\
    loading config from file\");\n        try {\n            FileReader ex = new FileReader(filePath);\n\
    \            String line = null;\n            BufferedReader bufferedReader =\
    \ new BufferedReader(ex);\n            _configReader.configTable = new Hashtable();\n\
    \            while((line = bufferedReader.readLine()) != null) {\n           \
    \     String key = line.split(\"#\")[0];\n                String value = line.split(\"\
    #\")[1];\n                _configReader.configTable.put(key, value);\n       \
    \     }\n            bufferedReader.close();\n        } catch (FileNotFoundException\
    \ var6) {\n            System.out.println(\"Unable to open file '\" + filePath\
    \ + \"'\");\n        } catch (IOException var7) {\n            System.out.println(\"\
    Error reading file '\" + filePath + \"'\");\n        }\n    }\n\n    public String\
    \ getValue(String key) {\n        System.out.println(\"getting config for key\
    \ \" + key);\n        return (String)_configReader.configTable.get(key);\n   \
    \ }\n}\n```\n\nFile: `Client.java`\n\n```java\nimport Singleton.ConfigReader;\n\
    \npublic class Client {\n    public Client() {\n    }\n\n    public static void\
    \ main(String[] args) {\n        ConfigReader configReader = ConfigReader.getInstance(\"\
    /Users/ravindrasadaphule/config.txt\");\n        String dbConnectionString = configReader.getValue(\"\
    DbConectionString\");\n        System.out.println(dbConnectionString);\n    }\n\
    }\n```\n\nFile: `config.txt`\n```text\nDbConectionString#provider=oracle11;trusted_connection=yes\n\
    username#admin\n```\n\nOutput:\n```\nloading config from file\ngetting config\
    \ for key DbConectionString\nprovider=oracle11;trusted_connection=yes\n```\n\n\
    ### Benefits\n\n**Low memory footprint:** Singleton pattern restricts intense\
    \ of a class to one. It prevents user from creating more than one instance and\
    \ thus saves on memory.\n\n**Simplicity:** Singleton pattern is deceptively simple.\
    \ It is the pattern which completely contained in the same class and do not need\
    \ any other auxiliary class.\n\n## CHAPTER SIX\n\n### Summary\n\nThank you very\
    \ much for going through the entire book on creation design patterns. Here is\
    \ brief summary of all creation al design patterns.\n\n* **The Factory Pattern**\
    \ is used to select and obtain an instance of a class from a number of similar\
    \ classes based on data you provide to the factory.\n* **The Abstract Factory\
    \ Pattern** is used to obtain one of several related groups of classes. In some\
    \ cases it returns a Factory for that group of classes.\n* **The Builder Pattern**\
    \ builds a number of objects to make a new object, based on the data with which\
    \ it is presented.\n* **The Prototype Pattern** clones an existing class rather\
    \ than creating a new instance when creating new instances is more expensive.\n\
    * **The Singleton Pattern** is a pattern that ensures that there is one and only\
    \ one instance of an object, and that it is possible to obtain global access to\
    \ that one instance.\n"
  raw: "Since same configuration information is needed in read only fashion everywhere,\
    \ we just one instance of configuration reader. ConfigReader is a singleton class.\
    \ Its constructor is made private so that client can not directly instantiate\
    \ it. It has getInstance() method that Client can use to access the only instance\
    \ it has. loadConfig() information is used for reading the information from text\
    \ file during initialization part and keeps it in internal hash table. Once client\
    \ contains instance of ConfigReader, it can get value of a configuration key by\
    \ calling getValue() method by passing in value of key in question. getValue()\
    \ function looks up hash table to get the value for specified key and returns\
    \ it. The class diagram is depicted below.\n\n![Image](Images/image00050.jpeg)\n\
    \nHere is java code that implements above classes.\n\nFile: ConfigReader.java\n\
    \n**import** java.io.BufferedReader;\n\n**import** java.io.FileNotFoundException;\n\
    \n**import** java.io.FileReader;\n\n**import** java.io.IOException;\n\n**import**\
    \ java.util.Hashtable;\n\n**public class** ConfigReader {\n\n **private static**\
    \ ConfigReader _configReader = **null**;\n\n **private** Hashtable configTable\
    \ = **null**;\n\n **private** ConfigReader() {\n\n }\n\n **public static** ConfigReader\
    \ getInstance(String filePath) {\n\n **if**(_configReader == **null**) {\n\n _configReader\
    \ = **new** ConfigReader();\n\n loadConfig(filePath);\n\n }\n\n **return** _configReader;\n\
    \n }\n\n **public static void** loadConfig(String filePath) {\n\n System.out.println(**\"\
    loading config from file\"**);\n\n **try** {\n\n FileReader ex = **new** FileReader(filePath);\n\
    \n String line = **null**;\n\n BufferedReader bufferedReader = **new** BufferedReader(ex);\n\
    \n _configReader.configTable = **new** Hashtable();\n\n **while**((line = bufferedReader.readLine())\
    \ != **null**) {\n\n String key = line.split(**\"#\"**)[0];\n\n String value =\
    \ line.split(**\"#\"**)[1];\n\n _configReader.configTable.put(key, value);\n\n\
    \ }\n\n bufferedReader.close();\n\n } **catch** (FileNotFoundException var6) {\n\
    \n System.out.println(**\"Unable to open file** **\\'****\"** + filePath + **\"\
    ****\\'****\"**);\n\n } **catch** (IOException var7) {\n\n System.out.println(**\"\
    Error reading file** **\\'****\"** + filePath + **\"****\\'****\"**);\n\n }\n\n\
    \ }\n\n **public** String getValue(String key) {\n\n System.out.println(**\"getting\
    \ config for key \"** + key);\n\n **return** (String)_configReader.configTable.get(key);\n\
    \n }\n\n}\n\nFile: Client.java\n\n**import** Singleton.ConfigReader;\n\n**public\
    \ class** Client {\n\n **public** Client() {\n\n }\n\n **public static void**\
    \ main(String[] args) {\n\n ConfigReader configReader = ConfigReader.getInstance(**\"\
    /Users/ravindrasadaphule/config.txt\"**);\n\n String dbConnectionString = configReader.getValue(**\"\
    DbConectionString\"**);\n\n System.out.println(dbConnectionString);\n\n }\n\n\
    }\n\nFile: config.txt\n\nDbConectionString#provider=oracle11;trusted_connection=yes\n\
    \nusername#admin\n\nOutput:\n\nloading config from file\n\ngetting config for\
    \ key DbConectionString\n\nprovider=oracle11;trusted_connection=yes\n\n**Benefits**\n\
    \n**Low memory footprint:** Singleton pattern restricts intense of a class to\
    \ one. It prevents user from creating more than one instance and thus saves on\
    \ memory. \n\n**Simplicity :** Singleton pattern is deceptively simple. It is\
    \ the pattern which completely contained in the same class and do not need any\
    \ other auxiliary class. \n\n## **CHAPTER SIX**\n\n### ***Summary***\n\nThank\
    \ you very much for going through the entire book on creation design patterns.\
    \ Here is brief summary of all creation al design patterns.\n\n*   **The Factory\
    \ Pattern** is used to select and obtain an instance of a class from a number\
    \ of similar classes based on data you provide to the factory. \n\n*   **The Abstract\
    \ Factory Pattern** is used to obtain one of several related groups of classes.\
    \ In some cases it returns a Factory for that group of classes. \n\n*   **The\
    \ Builder Pattern** builds a number of objects to make a new object, based on\
    \ the data with which it is presented. \n\n*   **The Prototype Pattern** clones\
    \ an existing class rather than creating a new instance when creating new instances\
    \ is more expensive. \n\n*   **The Singleton Pattern** is a pattern that ensures\
    \ that there is one and only one instance of an object, and that it is possible\
    \ to obtain global access to that one instance."
