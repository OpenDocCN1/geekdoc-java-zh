    \ class Client {\n\npublic static void main(String[] args)\n\n{\n\n    System.out.println(\"\
    ******* Ordering Pepperoni Pizza *************\");\n\n    Director.CreatePizza(PizzaType.Pepperoni,\
    \ \"408-231-1234\");\n\n    System.out.println(\"******* Ordering Veggie Pizza\
    \ *************\");\n\n    Director.CreatePizza(PizzaType.Veggie, \"408-231-1244\"\
    );\n\n}\n\n}\n```\n\n输出:\n\n******* 订购意大利腊肠披萨 *************\n\n正在为 408-231-1234\
    \ 创建披萨\n获取披萨饼底\n添加番茄酱\n添加奶酪\n添加意大利腊肠\n烘烤披萨。闻气很香\n正在向客户 408-231-1234 送披萨\n\n*******\
    \ 订购素食披萨 *************\n\n正在为 408-231-1244 创建披萨\n获取披萨饼底\n添加番茄酱\n添加奶酪\n添加洋葱、西柿和菠菜\n\
    烘烤披萨。闻气很香\n正在向客户 408-231-1244 送披萨\n\n**第四章**\n\n### **原型 (Prototype)**\n\n**背景**\n\
    \n原型设计模式用于类的实例化非常耗时或复杂的情况。在这种情况下，与其每次从头创建新实例，不如创建一个实例并进行复制，根据需要进行更新。例如，如果需要多次查询以获取员工的更多信息，更好的方法是只在内存中获取一次员工信息的结果集，为每个查询创建其副本，然后进行处理。这将防止多次访问数据库，从而减少网络开销。数据库连接往往是\
    \ SaaS 应用中有限且昂贵的资源之一。原型模式通过减少对象构建时间和数据库往返来帮助减少开销。\n\n"
- fmt: "\nPrototype is unique among creational design pattern in that it does not\
    \ require a class. It just needs an object. The key idea here is that an object\
    \ can spawn other objects similar to itself. If you have one tree in computer\
    \ game, you could create many trees just by cloning fret tree. All modern languages\
    \ like `Java`, `C#` offers built in `clone` function at `System.Object` level\
    \ that can be overridden by custom classes to achieve prototype functionality.\n\
    \n### Implementation\n\nThe use case here is that client would like a construct\
    \ a home. `Home` needs parts like doors and windows. Doors and windows of one\
    \ home are similar in nature. They may vary by size.\n\n`DBContext` is helper\
    \ class that fetches default width and height from database. When `home` needs\
    \ first door, we can create a basic door from scratch and keep it ready. First\
    \ door is created using a constructor and it would call `DbContext.getDefaultDoorHeight()`\
    \ and `DbContext.getDefaultDoorWidth()` to get default width and height for door.\
    \ It is time consuming call and requires 2 roundtrips to database. \n\nWhen `home`\
    \ needs another door, instead of creating from scratch, we can copy the data from\
    \ first door and modify its properties as necessary. `IClonable` interface represents\
    \ ability to copy an object. It just has `clone()` function. Any class that needs\
    \ to implement copy functionality, they can override `clone()` function and provide\
    \ their implementation of `clone()`. `Door` and `Window` class implement `IClonable`\
    \ interface, thus provide ability to clone them. Client can call `clone` function\
    \ on `door` and `window` object to create as any doors and windows as necessary\
    \ for the `home`. When a door or window is cloned, we just make copy of existing\
    \ object and then update as necessary. This cloning ability prevents expensive\
