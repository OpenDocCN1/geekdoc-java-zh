- fmt: "\nHere `IElectronicToy` is an interface with two functions namely `play` and\
    \ `stop`. It represents a contract that each electronic toy should implement.\
    \ The contract is dictate by two methods `play()` and `stop()`. `TeddyBear` and\
    \ `Lion` are two classes that implements `IElectronicToy` interface. By overriding\
    \ `play()` and `stop()` methods. `TeddyBear` and `Lion` each have different implementation\
    \ of `play()` and `stop()` methods. `ToyFactory` is a class with just one static\
    \ method `CreateToy(..)`. This method accepts `ToyType` enum and returns either\
    \ `TeddyBear` or `lion` depending upon `ToyType` value casted as `IElectronicToy`.\
    \ `Client` represents a external class that calls `ToyFactory` class’s static\
    \ method `createToy` and passes appropriate value of `ToyType`. It in turn gets\
    \ a object of type `IElectronicToy` which internally could be reprinting `TeddyBear`\
    \ or `Lion`.\n\nHere is java code that implements above classes.\n\nFile : `IElectronic.java`\n\
    \n```java\ninterface IElectronicToy {\n    void play();\n    void stop();\n}\n\
    ```\n\nFile: `TeddyBear.java`\n\n```java\npublic class TeddyBear implements IElectronicToy\
    \ {\n    @Override\n    public void play() {\n        System.out.println(\"Grrrrrrrrrr\"\
    );\n    }\n\n    @Override\n    public void stop() {\n        System.out.println(\"\
    stopped grrrr....\");\n    }\n}\n```\n\nFile: `Lion.java`\n\n```java\npublic class\
    \ Lion implements IElectronicToy {\n    @Override\n    public void play() {\n\
    \        System.out.println(\"Roar\");\n    }\n\n    @Override\n    public void\
    \ stop() {\n        System.out.println(\"stopped roaring\");\n    }\n}\n```\n\n\
    File: `ToyFactory.java`\n\n```java\npublic class ToyFactory {\n    public static\
    \ IElectronicToy CreateToy(ToyType toyType) throws Exception {\n        IElectronicToy\
    \ toy = null;\n        switch(toyType) {\n            case TeddyBear:\n      \
    \          toy = new TeddyBear();\n                break;\n            case Lion:\n\
    \                toy = new Lion();\n                break;\n            default:\n\
    \                throw new Exception(\"Unknown toyType \" + toyType);\n      \
    \  }\n        return toy;\n    }\n}\n```\n\nFile: `ToyType.java`\n\n```java\n\
    public enum ToyType {\n    TeddyBear,\n    Lion\n}\n```\n\nFile: `Client.java`\n\
    \n```java\npublic class Client {\n    public static void main(String args[]) {\n\
    \        try {\n            IElectronicToy toy = ToyFactory.CreateToy(ToyType.TeddyBear);\n\
    \            toy.play();\n            toy.stop();\n            toy = ToyFactory.CreateToy(ToyType.Lion);\n\
    \            toy.play();\n            toy.stop();\n        } catch (Exception\
    \ ex) {\n            System.out.println(ex.getMessage());\n        }\n    }\n\
    }\n```\n\nOutput:\n```\nGrrrr…….\nstopped grrrr....\nRoar\nstopped roaring\nProcess\
    \ finished with exit code 0\n```\n\n### Benefits\n\n**Reuse.** If I want to instantiate\
    \ one class from a family of related classed in many places, factory class can\
    \ be used everywhere I need, without having to instantiate individual classes.\n\
    \n**Unit-Testability.** I can write 2 tests for the factory, to make sure it returns\
    \ the correct types on the correct conditions, then calling class only needs to\
    \ be tested to see if it calls the factory and then the required methods on the\
    \ returned class. It needs to know nothing about the implementation of the factory\
    \ itself or the concrete classes.\n\n**Extensibility.** When someone decides we\
    \ need to add a new class say `Tiger` to this factory, none of the calling code,\
    \ neither unit tests or implementation, ever needs to be told. We simply create\
    \ a new class `Tiger` and extend our factory method. This follows principles [Open-Closed\
    \ Principle](http://www.oodesign.com/open-close-principle.html).\n\nYou can even\
    \ create a new factory class and make them hot-swappable, if the situation requires\
    \ it for example, if you want to be able to switch class `Lion` on and off, while\
    \ testing. I have run into this situation rarely, but it was extremely useful.\n\
    \n# CHAPTER TWO\n\n### Abstract Factory\n\n#### Background\n\nAbstract Factory\
    \ design pattern is one level of abstraction higher than factory pattern. You\
    \ can use this pattern when you need to return one object from several related\
    \ families.\n\nNote that unlike factory patten, it says several families here\
    \ not just one family. Therein lies key to understand abstract factory pattern.\
    \ So abstract factory returns one factory from one of several factories.\n\nOne\
    \ classic example of abstract factory pattern is in drawing animation objects\
    \ like monkey, mountains on a screen. There could be several type of drawing systems\
    \ like 2D, 3D and 4D. Each of these drawing system is capable of drawing animation\
    \ objects. You could be creating a movie scene with a monkey jumping on from one\
    \ tree to another tree on a muir wood mountain. You could play this scene by getting\
    \ a factory for 2D and then play entire scene in 2D. Or you could ask for for\
