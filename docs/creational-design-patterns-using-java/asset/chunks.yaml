    \n    theTree = drawingPlatform.getTree(DrawingType.ThreeD);\n\n    //Draw 3D\
    \ Scene\n    drawScene(theMonkey, theTree);\n\n}\n\nprivate static void drawScene(IMonkey\
    \ theMonkey, ITree theTree)\n\n{\n\n    theMonkey.jump();\n\n    theTree.sway();\n\
    \n}\n\n}\n```\n\nOutput:\n\nThis is 2d monkey jumping\n\nThis is 2d tree swaying\n\
    \nThis is 3d monky jumping\n\nThis is 3d tree swaying\n\n**Benefits**\n\n**Encapsulation:**\
    \ Abstract factory pattern isolates concrete classes completely from client. This\
    \ allows interchange of product families freely.\n\n**Extensibility:** Abstract\
    \ Factory pattern is “factory of factories” and can be easily extended to accommodate\
    \ more products, for example we can add another sub-class `FourDDrawingFactory`,\
    \ `FourDMonkey` and `FourDTree`. Client code would require minimal changes.\n\n\
    ## **CHAPTER THREE**\n\n### **Builder**\n\n**Background**\n\nBuilder design pattern\
    \ is used to separate the construction of object from its representation. The\
    \ same construction mechanism can be used to construct several different representations.\
    \ Builder factor focuses on constructing object step by step. Consider an example\
    \ of pizza shop. Customer can order for various types of pizzas like pepperoni\
    \ pizza, supreme chicken pizza or veggie pizza. The steps for creating each pizza\
    \ are same. The final outcome varies depending on what is done inside that step.\
    \ \n\n*   Order pizza (Telephone/website/Go to the shop))\n*   Get a Pizza Base\n\
    *   Add tomato sauce\n*   Add Cheese\n*   Add Toppings (Pepperoni/Veggie/Chicken)\n\
    *   Bake The pizza\n*   Send the pizza to customer (Takeout or delivery)\n\n**Implementation**\n\
    \nThe use case here is to build a pizza based on customer specification. `PizzaBuilder`\
    \ is an abstract class that dictates the steps to build pizza and also orchestrates\
    \ the pizza making steps. `VeggiePizzaBuilder`, `PizzaPepperoniBizzaBuilder` and\
    \ `ChickenPizzaBuildera` extends `PizzaBuilderClass`. The only method they override\
    \ is `addToppings()` method. `VeggiePizzaBuilder` adds topics like tomato, green\
    \ pepper and onions. `PeopporoniPizzaBuilder` adds pepperoni slices. `ChickenPizzaBuilder`\
    \ adds grilled checkin toppings. Rest of the methods remain same for all three\
    \ types of pizzas. `Director` class determines which `PizzaBuilder` class it should\
    \ invoke based on `PizzaType` specification from customer. `Client` class represents\
