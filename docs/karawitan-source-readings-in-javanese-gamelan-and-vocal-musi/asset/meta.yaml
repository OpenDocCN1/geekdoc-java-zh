- - '##'
  - Karawitan 的名称与功能
- - '###'
  - a. `Cèngkok`。在 gendhing 中，词汇“cèngkok”有两个完全不同的含义：(1) “演奏风格”或“处理方式”（`garap`）；或(2)
    一个 gendhing 中 `gongan`（拍）的数量。作为演奏风格的意义，`Cèngkok` 是一种永恒的、不变的旋律，无论是声乐还是器乐都是。例如，`cèngkok`
    “ayu kuning”（“美丽的黄姑娘”）始终具有以下旋律：
- - '###'
  - b. `Pamurba`。理解“主管”这个词很容易，但它与 karawitan 有什么联系？主管是拥有决策权的人；他也可以被称为领导。因此，`irama`
    的主管（`pamurba irama`）是有权设定 `irama` 的演奏者。`lagu` 的主管也是如此。`rebab`——即 `rebab` 演奏者——拥有决策权，也可以被称为领导。`rebab`
    演奏者决定了旋律的走向。
- - '###'
  - c. `Pamangku`。维持乐器是那些执行任务以使主管的想法得以实现的乐器。例如，`irama` 的主管可能希望从一种 `irama` 级别变为另一种，而维持
    `irama` 的乐器——就像士兵一样——不能偏离。它们不应该设定自己的速度，因为不仅它们的努力将化诸东流，而且还会破坏 `gendhing` 的流动。`lagu`
    的支持者也是如此。如果 `lagu` 主管决定在例如 Ladrang *Moncèr* 的 `buka`（开头）确定 `gendhing`，但在击锣之后 `gendèr`
    演奏者继续演奏 Ladrang *Wilujeng*——从而违背了 `lagu` 主管——结果将是 `gendhing` 的崩溃。这里也有必要注意，如果没有
    `rebab`，`bonang gedhé` 或 `gendèr barung` 将取代 `rebab` 担任 `lagu` 主管。
