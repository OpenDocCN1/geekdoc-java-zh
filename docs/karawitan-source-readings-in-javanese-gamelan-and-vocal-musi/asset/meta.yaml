- - '##'
  - 结构类型示例
- - '###'
  - 1. Gendhing `Jalaga`，kethuk 8 次，minggah kethuk 16，ketawang gendhing, laras pélog
    pathet lima (gendhing bonang)。`Gendhing` `Jalaga` 中的结构类型有：buka, mérong, umpak,
    inggah, umpak-umpakan, `sesegan` 和 `suwukan`。
- - '###'
  - 2. Gendhing `Gobed`，kethuk 4 次，minggah 8，laras pélog pathet nem (gendhing rebab)。`Gendhing`
    `Gobed` 中的结构类型有：buka, mérong, umpak, inggah 和 umpak-umpakan。
- - '###'
  - 3. Gendhing `Asri Katon`，kethuk 2 次，minggah 4，laras pélog pathet。`Gendhing` `Asri
    Katon` 中的结构类型有：buka, basic mérong, mérong, ngelik, umpak, inggah。
- - '###'
  - 4. Gendhing `Méga Mendhung`，kethuk 2 次，minggah `Èsk-èsèk`，kethuk 4，laras pélog
    pathet nem。此-gendhing 结构有：buka, mérong 和 inggah。
- - '###'
  - 5. Ladrang `Wilajeng`，ketawang `Puspa`，laras pélog pathet nem。
