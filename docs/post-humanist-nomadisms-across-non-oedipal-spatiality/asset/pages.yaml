  md: 'In the last half-century or so, the multifaceted notion of nomadism, thanks
    to a certain primitivist, exotic aura, has often been transferred from anthropology
    and ethnography where it initially belonged and from the Romantic vision of the
    natural law and egalitarianism of the good savage that established it in the literature
    and lives of many, to the realm of cultural theory and critique. There, on the
    edge of Philosophy and Psychoanalysis, on the margins of Sociology, Ecology, Border
    Studies and Gender Studies, in the no man’s land between Narrative Theory, Fiction
    and Translation Theory, conceptual nomadism has prospered to encompass almost
    form of mobility, whether intellectual or physical, globalized or localized, commuting
    or with no return, tribal or anarchistic, traditional or revolutionary, technological
    or tooless.


    It would be fastidious to retrace in great detail how a simply descriptive characterization
    of the way of life of certain human communities in relation to geographical space
