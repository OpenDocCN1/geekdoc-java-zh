    Any account of the social history of adda mentioned above would be incomplete
    without bringing the role played in the twentieth century by the Indian Coffee
    House, formerly called Albert Hall, at College Street in Kolkata. Coffee House
    is not just another landmark like the Victoria Memorial that maps Kolkata''s colonial
    history. It is an institution in itself, similar to the Parisian cafe. It has
    the favorite hangout of famous writers, artists, filmmakers, and left-leaning
    radicals. It has often borne witness to the start of major political and cultural
    movements within trends in Bengal''s history. Built-in in 1944, this cafeteria
    is located within a stone''s throw from the University of Calcutta in conversations
    In the past, some significant projects originated within the walls of the College
    Street Coffee House. Two important literary journals—Ekshan and Kritibas—were
    conceived here. In the late 1940s and 1950s, Sign Press, an innovative Bengali
    publisher, used to bring its authors to this place for signing deals over coffee
    and adda. Soumitra Chatterjee, the stage and film actor, best known for his work
    with Satyajit Ray, used to hold court in the Coffee House in the early 1960s before
    he became a sought-after star. The same time, Kamal Kumar Majumdar (1914-79),
    a major fiction writer and a superb raconteur, would pull a crowd around his table
    with jokes and anecdotes in three languages—Bengali, English, and French. Indeed,
    the Coffee House as the most popular site of adda is venerated as an immutable
