    Chapter 6


    # V


    This article has examined the ways in which power relations not only between the
    Global North and Global South but also between privileged and marginalized regions
    in the Global South influence the hierarchization of knowledge systems. The narrative
    studied echoes and draws on normative practices in Bengal, particularly among
    the Bhadralok of Kolkata, in relation to the Sundarbans and an implicit cultural
    polarization of spaces. If a space becomes Oedipal of a sense of familiarity and
    ownership, by patriarchal inheritance laws and the symbolization of the land as
    female, then Radharomon’s inability to claim the Sundarbans inherited or familiarity,
    inferiorizing or ridicule it non-Oedipal. This dissonance, and the anxiety to
    what gives rise, is not that affects Baghar’s mother or her son. The Oedipal crisis
    enacted in the narrative about their space leaves them untouched, secure as they
    are in the sense of reciprocally belonging to the land, such that the space, tigers
    and ghosts and all, is their milieu. In fact, this understanding is attuned to
    Baghar’s deeply opaque resistance to sharing it with those he perceives as outsiders.
    They are at home, with the natural, preternatural, and supernatural aspects of
    the Sundarbans; it is only Radharomon’s hegemonic, mainstream gaze is unable to
    accommodate and indeed perceive it without debilitating dissonance.


