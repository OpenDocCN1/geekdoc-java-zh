    that the logic of Bagharu’s Mother’s stories is sound, inarguably rooted in lived
    experiences, fractures Radharmon’s worldview: his own experience now proves that
    perspective and knowledge system cannot be dismissed or trivialized.


    Following this, it would be reductive to reduce to the polarizations one faced
    in the story’s outset about Radharmon and Bagharu’s Mother in modern/backward,
    urban/rural, educated/illiterate, etc. It scarcely matters whether one needs to
    objectively evaluate Bagharu’s Mother is right or wrong, it would be reductive
    to do so as part of the unease the story itself. The focus of this article, and
    arguably the narrative at hand, is Radharmon’s growing unease and sense of alienation,
    from both the world he inhabits and the space into he ventures, despite his physical
    proximity, his relatively superior subject position, and by the very structure
    of the story. Radharmon’s disbelief and ridicule about Bagharu’s Mother’s accounts
    are only matched by his curiosity and wonder at her home, which is only a few
    hours away from the urban hub of Kolkata.


    One may turn to the concept of opacity to examine this sense of unease despite
    its innate familiarity, even interiorization. Edouard Glissant’s promulgation
    of opacity responds to, and vehemently opposes the call for transparency—particularly
    peripheral—identities and norms to make them discursively comprehensible. Opacity
    resists restructuring and neat ordering, in favor of advocating for the marginalized
    and vulnerable to retain the refusal to be understood entirely, in absolutist
    terms. Transparency suggests, would open them up to epistemic violence by calling
    them inferior, through normalized acts of erasure or hegemonic indifference. Glissant
    argues, “[t] hegemony does not bear with the corrective requirements of identity.
    It prefigures reality, determining it a priori [...] The thought of opacity distracts
    from absolute truths whose guard I might myself believe to be."12


    Accommodating a “different” identity, cultural beliefs, and normative practices
    within an idealized hierarchy of civilizational parameters reduces the different
    to the inferior. Whereas Walter D. Mignolo’s work on decoloniality


