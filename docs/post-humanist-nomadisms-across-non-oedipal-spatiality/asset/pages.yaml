  md: '# 60


    # Chapter 4


    literature, and music. Also notable is the urban setting of adda situated in padas

    phonetically /pa:a/) or localities. As a word, it means both a form of talk and

    a place associated with it. In Kolkata, for instance, young men cluster on

    “rawks” (narrow platforms outside a dwelling house), parks, bus-terminals, and\canteens.
    Adda became very popular in Bengal in the nineteenth and

    twentieth centuries, when the British ruled India. Its popularity was both

    enabled by westernization and a reaction to it because the cultural horizons of

    Europe, England, and world politics always provided the intellectual lens for

    articulation in adda. Today in the popular imagination, adda has become

    sonymous with Bengalness, a cultural marker as prominent as the Bengali’s

    craze for rosogallas and football.


    My paper investigates the role adda played in the formation of Bengali

    identity, giving it a singular attribute that I call provincial cosmopolitanism.

    Dipesh Chakraborty, in his seminal book Provincializing Europe: Postcolonial

    Thought and Historical Difference, terms this peculiar speech act of the Bengali

    community as “national,” but I extend it to signify a worldliness that was

    rooted simultaneously at home–not just as a country to which

    belong or a “national imagination,” but also home as localized as one’s

    street, road and path (locality).¹ This worldliness indicated a Welttanschauung,

    cultural intellectual orientation that made the Bengali’s love of adda a lifestyle
    and a

    cultural mode often reflecting the contestatory pulls of cosmopolitanism and

    nationalism. In my paper I have also termed this unique cultural and social

    hhenomen as bhadral cosmopolitanism to signify a form of cosmopolitanism

    that was prevalent among a particular class in the Bengali community–the

    middle-class. My paper aims to show that in its normative, privileged, and

    exclusionary traits, this was a cosmopolitanism from above and not below, and
    was

    part responsible for the failure of Bengal’s modernity project.


