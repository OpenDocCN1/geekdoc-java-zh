    # Chapter 14


    The current, turbulent sociopolitical climate among the U.S.-Mexico borderland
    contributes to attacks on Chicanax language and identity. In response, Chicana
    artists and activists harness the power of the Internet to form digital communities
    of resistance. Activism through these communities allows Chicanas to spread awareness
    about injustices and to materialize political change in the form of rearticulating
    their identity and place in society. Chicana poet Odilia Galván Rodríguez’s poem,
    “Poem 25 – Giving Voice,” demonstrates how Chicanas extend Gloria Anzaldúa’s conception
    of the politically conscious into the twenty-first century of the Internet. As
    moderator and contributor to the “Poets Responding to SB 1070” Facebook page,
    Galván Rodríguez mobilizes the political power of social networking to disseminate
    the poetry of resistance. Her poem expresses gratitude for those poet-activists
    in this digital community who gives voice to traditionally marginalized groups,
    mainly immigrants.


    In April 2010, Francisco X. Alarcón, Professor at the University of California,
    created the “Poets Responding to SB 1070” Facebook page in response to the enactment
    of Arizona Senate Bill 1070 (SB 1070). He published the first poem on the page,
    in both Spanish and English, titled “Para Los Nue del Capitol / This poem recognizes
    nine Latino Arizona State students who championed themselves to the Arizona State
    Capitol building in protest of the proposed bill. SB 1070 legitimized discrimination
    against Mexican-Americans and immigrants living in the borderlands. This bill
    encouraged law enforcement to stop, detain, arrest, and demand proper identification
    of any individual suspected to be an illegal immigrant. Even U.S. citizens who
    looked “suspicious” or spoke Spanish were subjected to these search procedures.
    The poets of this Facebook


