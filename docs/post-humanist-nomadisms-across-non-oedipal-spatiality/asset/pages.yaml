    # Nomad Space


    A nomadic space is characterized by its subversive and disruptive potential to

    unsettle power and the authority, in a relationality of becoming. Deleuze and

    Guattari describe the nomad space as constituting the War Machine.2 This idea

    is based on an insight of nomad intrusions into affairs of the State, where the

    conceptual pairing of States and War-Machines enables an understanding

    which is primarily relational and processual, as the State is under constant

    threat of disruption by the nomads, who are considered as outsiders. In this

    essay, we propose to explore some geo-political-socio-ecological spatiality,

    occupancy of the Chambal valley by an assemblage of women dacoits and their

    nonhuman allies of an inhospitable topography - the transitory

    topography - the scrublands, intractable

    ravines, predatory nomads, and increment weather.


    We Deleuze and Guattari''s theorization of nomad space and Walter

    Mignolo''s agency of location of enunciation as potential lines of flight to\explore
    the Chambal as nomad space comprising the War Machine which

    contests and any submission to grammatical performatives of any

    State. It is wild, violent, and vastly inhuman in its dimensions and dispositions.

    Its bodily ravines demonstrate Mignolo''s notion of a “brewed spatiality,” which

    is a performative learning to another way of thinking, which he calls “border

    thinking.”3 Mignolo argues that local histories and global designs have

    brewed in a location of power.4 However, one may recognize the nature of

    power may be nomadic and unstable, given its enabling potential ofnanother thinking.
    It is as much epistemological as it is ethical. Borrowing from

    Khatibi, he explains: “it is not inspired in its own limitations and is not intended

    to dominate and humiliate: a way of thinking that is universally marginal,

    fragmentary and unachieved; and, as such, a way of thinking that is not

    ethnical.”5


    > 2. Gilles Deleuze and Félix Guattari, “Treatise on Nomadology-The War Machine,”
    in A

    thousand Plateaus: Capitalism and Schizophenrenia, trans. Brian Massumi (Minneapolis

    and London: University of Minnesota Press, 2014), 351-423.


    > 3. Walter Mignolo. Local Histories, Global Designs Coloniality, Subaltern Knowledge
    and

    Border Thinking. (New Jersey: Princeton University Press, 2000), 68-69.


    > 4. Id., 68-69


    > 5. Id., 68-69.'
