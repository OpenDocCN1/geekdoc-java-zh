    Flor). What we get instead of transcendence is a bone-deep fatigue that no competing
    affect can neutralize. We could say we are stupefied, a word that has the double
    meaning of astonishing or shocking, and having the capacity to make someone unable
    to think or feel properly. The offscreen violence is overwhelming and barely creeps
    into the domestic space, where it is ignored.


    Both these main characters inhabit the affective ruins of the goal economy that
    declares their work is not very interesting, a tedium reflected in the slowed
    downtime of the lingering camera, reminding us how they are in place, hostage
    to predictable, inescapable, confines jobs. We are educated to their plight by
    duration, by repetition. And just like the velador, who waters the river every
    day, so the negro widows come to wash the floors and replace the flowers of their
    husbands'' mausoleums as children play outside, or so Flor crosses with the janitor,
    who cleans up after the clerks like her in a darkening office.


    Unlike people''s existential boredom, reflected in high toned art cinema, this
    is the form of filmmaking that comes to deep and deafened vision encoded in the
    stigmatized position of people marked and indefinitely defined by gender and class,
    doing tasks that many of us see as valuable, visible only when impatient clients
    find themselves down obstructionist. Everyday life in capitalism is a very different
    orientation, as we are told, through the mechanisms that we should be enjoying
    a rich filmic experience. At the same time, the working-class characters, the
    long takes, the impoverished dialogue, and almost complete refusal of extra-deep
    sound tell us something different. Eventually, viewers are overwhelmed by banality
    and by the trailing fragments of what might once have been sublime metaphors.
    Interestingly, we mean the opposite because the structure of the film disallows
    it. The stories of invisible working-class men and women should be told, we say
    to each other. They are important and interesting. Besides, Almada has told us.


    In this article, I will focus on her most recent, and fiction film, a project
    she started from a concept, without a script, working in close collaboration with
    Adriana Barraza, the veteran actor who plays Flor in the film. She says, About
