    # II


    Identity projects, in practice and theorization, are and have been preoccupied
    with the act of mystifying and demystifying the Other of their preoccupation with
    the Self. In practice, however, this watertight binary is disrupted; praxis itself
    is necessarily contingent and disruptive, even as it is iterative. The praxis
    and location of liminality emerge instead as a fecund and accessible site of locating
    selfhood and alienation in their complex interactions. In the mainstream Bengali
    social imaginary, the Sundarbans serves as an appropriate site to trace out this
    oscillation between liminality and binaries, because of both its geographical
    hemming the state (and country) and the cultural associations attributed to the
    space and its inhabitants. The identity and social location of the speaking subject,
    therefore, becomes especially important in trying to read these tensions in discourse


    > 8. Though modern identities are treated as hybrid, fractured cultural constructs
    in Cultural Studies, in the works of Stuart Raymond Williams et al., identities
    are imagined in terms of neat, coherent grand narratives, with a distinct beginning,
    middle and end. Whether mainstream or marginal, these narratives or identity projects
    anchor discussions around how an identity is conformed and represented.'
