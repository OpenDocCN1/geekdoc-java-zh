  md: '# Introduction


    We grew up in Bengali middle-class households in the 1980s, hearing stories of
    the dreaded Chambal Valley being heavily populated by dacoits who proudly called
    themselves as baghis, literally meaning the rebel. Indian literature and mainstream
    Hindi and Bengali cinema, and other forms of popular culture are replete with
    stories of Chambal—while some of them are Robin-like figures on the side of the
    disenfranchised, others are ruthless plunderers creating havoc in adjacent villages.
    There are innumerable recountings of myths based on our epics, especially the
    Mahabharata. Such myth of the Chambal is surrounded by its unhealthy origin from
    the blood of thousands of cows sacrificed to the gods. On her way to heaven, Draupadi,
    the female protagonist of the Mahabharata,¹ cursed the Chambal valley because
    it was the site where Yudhishthira, the eldest of five Pandavas waged for the
    stake in a game of dice played against their rival cousins, the Kauravas in which
    she lost. This loss led to her public humiliation and molestation in court. This
    land was assigned with such ill omen as it belonged to the kingdom of Shakuni—the
    unscrupulous uncle of the Kauravas and the arch-enemy of the Pandavas—who enticed
    the royal cousins to the game of dice to strip the Pandavas of their kingdom and
    to win it for his nephews.


    The Chambal remained a space beyond the State or nation. No civilian forces have
    been able to overcome the real or imagined fear associated with this geophysical
    spatiality. Neither the powerful Mughal Empire nor the British rule could claim
    this space. As a left unknown by the regular human habitation and control, it
    became a safe space for wild animals and birds, which thrived. The river, after
    which the valley is named, remained clean and unpolluted for this reason. The
    isolation created a sanctuary of crocodiles, gharials, jackals, river dolphins,
    birds, and wolves. Besides serving as a sanctuary for nonhuman life, the Chambal
    has also served as a refuge for the most deprived castes, for victims of social
    injustices, and fugitives from the law. Such people found an alternative home
    outside the society in the valley. However, the understanding of home in the context
    of this valley is contentious, given its liminality within the nature-society-savage-civilization
    paradigms of multiplicity. The Chambal valley and its occupants have been mutually
    comprised as an assemblage in a random possibility of the givenness of its spatiality,
    which is constantly being


    > ¹ Our knowledge of the epic Mahabharata comes from oral rituals of story-telling,
    folklore such as jatra (an open air theatre), folk arts and craft, and some other
    popular culture such as comics, television and movies.'
