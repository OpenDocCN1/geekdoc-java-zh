    reached to the edges of their Imperial gardens?


    The advice, language, and tone presented by Steel and Gardiner is evidence that
    the authors understood would have an intimate view of the socializing mission,
    its successes (and failures), and most significantly, could circulate to those
    at home in Britain: Letters and diaries of their travels through the Subcontinent,
    which were later published into travelogues, contributed to this shared version
    of the British Empire. Rendall points out that the nineteenth century in Britain
    saw the growth of print culture and that women were both consumers and creators
    of it.⁶⁹ Gardiner wrote, “We do not wish to advocate an unholy haughtness, but
    an Indian household can no more be governed peacefully, without dignity and prestige,
    as an Indian Empire.”⁷⁰ This well-repeated quote of Steel’s and Gardiner’s illustrates
    their cognition of not just the authority of the Anglo-Indian domestic environment
    within India, the British and European external environment who would be peering
    from the outside. The crucial attention needed for “keeping up appearances” within
    the colonial context was predicated upon British women’s role and gender being
    malleable in order to serve what Zlotnick described as, “the always fragile, always
    fictional imperial state.”⁷¹


    So, in order to excite an image of authority and control, Steel and Gardiner emphasize
    that it is vital that no one sees the mistress undertaking household tasks: her
