  md: '# Cosmopolitanism in the face of im/migration


    But, for all that, our celebrations of the poor ring hollow. Calling them “heroes”
    those who, unlike them, are privileged enough to remain home to imagine that these
    workers agreed to serve as human sacrifices, that there is an inherent nobility
    in the risks they take. It gives the civil society a chance to ignore the rotten,
    hazardous conditions that have been allowed to foster capitalist cruelty and governmental
    malfeasance, and absolve themselves of any complicity. Most of these workers didn’t
    sign up to be first responders, and are now overwhelmed by the magnitude of what
    is asked of them. They keep saying that they do not want compliments, they want
    help, but cosmopolitan ‘sympathy’ has continued to fail them.³


    There is a deep fault line in the way the global middle-class comprehend cosmopolitanism
    and uses it to justify any and all upheavals as long as it not knock at their
    own door. Countries like India pride in having brethren settle abroad in affluent
    countries as then it becomes almost a statement of caste and prosperity. When
    migrant workers in India face difficulties due to job losses because of the pandemic,
    they justify the migrant’s job losses as inevitable and then indifferent to any
    difficulties faced by him or her. The corporate hub of Gurgaon has built many
    high-rise establishment using the labor of licensed refugees from Bangladesh and
    Myanmar, Rohingya and Bangladeshi Muslims. However, in the midst of the Delhi
    riots²⁴ when stereotypes and xenophobia gripped the state of Delhi and the country,
