  md: '# Chapter 10


    # Towards a self-critical subjectivity: Tibet:

    Tsewang Vishey Pemba’s White Crane,

    Lend Me Your Wings


    Sushmita Sihwag


    Independent scholar


    # Abstract


    Tsewang Vishey Pemba’s novel, White Crane, Lend Me Your Wings, published posthumously
    in 2017, is a work of historical fiction that follows the lives of people of the
    Nyarang valley in Kham province of Eastern Tibet. The novel delineates Tibetan
    history, culture, as well as the tragedy that forced thousands of Tibetans to
    flee from their homeland in search of refuge. Pemba’s experiences of exile lend
    to the breadth of his perception of the Tibetan issue and the notions of ‘Tibness’.
    The experience of exile, and to some extent of diaspora, is a process that marks
    an unsettling of one’s ideas of a fixed self. It is accompanied by an epistemological
    shift in the understanding of the self, along with the transit of the body through
    space. Throughout the novel, the question regarding Tibetan and Nyarang-Khampa
    identities in the face of a real or imaginary ‘foreign’ remains a bone of contention.
    The narrative deliberately complicates conventional markers that determine identities,
    such as race and religion. This article analyzes the self-critical nature of diasporic
    subjectivity in Dr. Pemba’s novel, in conversation with the theoretical frameworks
    of Gilles Deleuze, Edward Said, and Dibyesha Anand on modern epistemologies, exile,
    and identity, to reflect on its implications for not only the politics of exile
    but also the questions of self and subjectivity at large, where both the self
    and subjectivity are layered and complex. The argument does not restrict itself
    to a discussion of diasporic subjectivity in the context of the immediate cultural
    and political realms; it dwells additionally on the ramifications of the psychological,
    societal, and ideological rhizomes in their horizontal territorializations


    **Keywords:** Diaspora, historical novel, self-critical subjectivity, metaphysical
    exile'
