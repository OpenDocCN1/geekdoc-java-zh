  md: '# Conclusion


    As it draws to a close, the article points to the vital force that fuels the nomadic
    incursions of the Mesoamerican and Andean amaranth, ensuring its survival despite
    centuries of sustained efforts towards its destruction, first by colonizers then
    by colonial modernity. The amaranth has acted as “zoe-centered embodied itself
    [...] shot through relational linkages of the symbiotic, contaminating/viral kind
    that interconnects to a variety of others, starting from the environmental or
    eco-others,” wherein the human society is one of the eco-others to the amaranth.74The
    seed-grain possesses the immanent force of zone, that is life in its non-human
    aspects,” it has stayed in a vital relationship with its growers, due to its nutritional
    content, drought resistance, and abundant yield as well as its ability to recreate
    forms in the form of tzoalli.75It possesses zoe or teot because it has escaped
    “control of the supervisory agency of the Self—on the twin pillars of narcissism
    and paranoia.”76 If “zoe stands for the mindless vitality of Life being independently
    of and regardless of rational control” and “is the dubious privilege attributed
