  md: '# Flowing between two worlds


    Three of the respondents, Laila, Naaz, and Hina, came to Barcelona as children
    when their family was reunited and therefore received at least a part of their
    school education in Catalonia. They represent the second generation of South Asian
    women in Spain. They have some knowledge of their home languages or mother tongues,
    be it Hindi/Urdu, Hindko, or Punjabi, but Spanish and/or Catalan are their first
    languages—the languages that they use the most, and in which they are most fluent.
    Compared to their mothers, they seem more empowered, independent, and well-integrated
    in the host society. They are ambitious; they have already joined or plan to enter
    the labor market. They seek additional educational qualifications to expand their
    work opportunities. They have only faint memories of the initial challenges with
    the language they had, and unlike their mothers, language skills are not an issue
    for them at all.


    The language(e)scapes for these three subjects are more complex than the ones
    discussed so far because these subjects are continually flowing between at least
    three languages and cultures, their origin or home language/s, and the two local
    languages: Spanish and Catalan. Apart the language and culture of their parents,
    these younger subjects are impacted by the dynamics between the two local languages.⁴⁴
    The presence of a strong nationalist movement escalated to a major constitutional
    crisis in October 2017.⁵ The Spanish State and the Government of Catalonia have
    remained in conflict ever since. It is a fact that most of the immigrants are
    the parents of our respondents—primarily speak Spanish and either have Spanish
    citizenship or aspire to. As children of immigrants in a superdiverse city, they
    have also interacted and grown up with children from various nationalities who
