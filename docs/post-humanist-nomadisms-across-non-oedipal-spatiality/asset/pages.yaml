  md: '# Preface by Walter Mignolo xiii


    Western vocabulary (Man1 in Wynter''s argument),² separated itself from all the
    living which, in turn, reduced to a single noun: *Nature*, as it was. Western
    civilisation is one populated with objects, not with relations and flows. Andean
    cosmology was destit (I am using as a verb, to enact destitution in the same movement
    of self-constitution). The intrusion and self-constitution of Western cosmology,
    and the concept of the ''human'' did not constitute the concept of *Runa*. Both
    concepts co-exist in conflict and power differential. The same applies with the
    Chinese Ren. Ren cannot be translated as ''human'' since Ren is integrated into
    *Tianxia* (All under heaven), while ''human'' is localized in the frame of Western
    cosmology (theological and secular (e.g. the Big-Bang story replacing the Biblical
    narrative).


    The thousand years Andean civilizations was not only dismantled in its current
    stage (e.g. the Inca Civilization) but was conceptually devised, ignored and denied:
    to the European missionaries who honored their ancestry. Andean people need to
    forget their own past and to be saved from the kingdom of the Devil, which was,
    of course, unknown in the Andes. The Devil was a Christian invention. The Renaissance
    Man1''s storytelling conceived itself as Human and relegated the Andean people
    to lesser, deficient humans, ignoring the Andean''s self-conception based on their
    own cosmological storytelling. The rhetoric of the Human persisted and was the
    foundation of racism, sexism, and the objectification and commodification of Nature.
    Man2 appeared with secularization that ''de-goded'' God and replaced it with Reason.
    Man3 emerged after World War Two with cybernetics and two of its consequences:
    the modelling of the life and deeds of the consumer by the invading of advertising
    and, more recently, by the use of artificial intelligence to program our lives.
    The separation, not only of the ''human'' with living energies in the planet and
    the cosmos, but of the flow of life energies, replacing it with the sacralization
    of the *Instrumentality* of life. Man3, following Wynter''s chronology, would
    be the Posthuman. Man1 and Man2 were tantamount to the invention of the Individual,
    a distinctive feature of Western civilization with its splendors and misery. Man3
    is tantamount to the sanctification of the *Individual* and its elevation to the
    Ego as the game of *man* a model that was developed by economists and the military
    which consisted in an egotistical being interested only in his own benefit and
    in dupying his opponents to achieve


    > ² Sylvia Wynter, "Unsettling the Coloniality of Being/Power/Truth/Freedom: Towards
    the Human, After Man, Its Overrepresentation—An Argument." CR: The Ew Centennial
    Review: 3/3, 2003, 257-337. Katherine McKittrick, editor. "Sylvia Wynter: On Being
    Human as a Praxis. Durham: Duke University Press, 2015.'
