    what will remain of the impact of a certain “nomadism”? And what can it tell us
    about its relation to a possible liberation from colonial, capitalist and patriarchal
    domination? Let us examine one of her best-known short stories, “Yasmina.”44 Yasmina
    is a teenage shepherdess who lives in a douar of Timgad, in the district of Batna,
    not far from the Aurès. She is supposed to get married to a much older, one-eyed
    grocer in the city, Batna. But never for the day, Sunday, Jacques, a young French
    officer riding his horse to hunt near the Roman ruins, in the scorching heat,
    is looking for some slightly cooler place to rest and finds Yasmina with her sheep
    in a ravin, the riverbed of a wadi. What follows is entirely expected: the rumi
    is attracted to the wild girl, goes as far as learning dialectal Arabic to communicate
    with her, seduces her, makes promises to him, pretends to convert to Islam, and
    is desperate when he is notified a prompt transfer to a post many miles away,
    south of Oran. The girl feels betrayed, but accepts her destiny. Jacques sends
    news once, forgets her. She is married to a spouse, an indigenous soldier of the
    French army who beats her and is sentenced to ten years forced labour for a fight
    with a higher-ranking officer. Yasmin becomes a prostitute in the “Black Village,”
    the sinister hostel on the outskirts of Batna and contracts tuberculosis. Five
    years after their short-lived love story, Jacques now married to an elegant French
    girl, returns to Batna. Yasmina calls him on the street, blames and curses for
    his lies. She throws him some money. Jacques calls her “another man.” The same
    night, she dies on the bench near the door of the hotel.


    There are many ways of reading this short story. First of all, it is obvious that
    its sentimental line belongs to a popular European genre, the melodrama, that
    emerged on stage and in novelistic form in the late 19th century and, or without
    music, remained highly successful all along the 19th century and even later. Melodramas
    combine in varying proportions Romantic exaltation and Realist mimesis. You need
    to have burning passion, a recognizable social, cultural, historical and geographic
    setting. Willie Collins, Eugene Sue, Luis de Vall fulfill these criteria in major,
    complex or complicated novels. Yet strains or more delicate traces of melodrama
    can be found in historical novels, in Naturalist narratives, or even in so-called
    Symbolist and Decadent Works. In the case of “Yasmina” as well as several other
    stories by Isabelle, we have a little of all this in spite of the simplification
    of the plot demanded by the format. How does it differ from a simple transition
    to an exotic setting of a rather standard European melodrama? One part of the
    answer lies in the apparent empathetic optopt, at times, of the point of view
    of supposedly


