  md: '# Adda as a cultural discourse


    qualification to be a member of an adda group was to be literary. Debates in adds
    required a certain level of sophisticated reading, cultivation of superior aesthetic
    tastes, a gift for rhetoric, and the demonstration of a certain style—all in a
    manner that gave the local performance an international breadth and its provincial
    participants a cosmopolitan city. To be an addaj, or better still, to be conferred
    the title of “adda raja” (king of adda) or “adda chakravarty” (Emperor of adds)
    as of the illustrious Bengali writers, artists and thinkers were, to cast oneself
    in the role of a citizen of a literary metropolis and to enact a “performative
    cosmopolitanism.”²⁰ extract given below, from jibendra Singh Ray’s Kallor Kal
    (The Age of Kallol), reports a snatch of an adda conversation between two friends:


    Gokul asked me one day, “What’s on your mind? I feel as though I am also thinking
    the same thought as you are but cannot tell what the thought is.” I said, “I imagine
    a kind of] resting-house [an inn]—where people tired by the burden of their lives
    can come and rest, where nationality, sex, and position will not be any barriers;
    [where]men will make their work joyful and by freely mixing with others find themselves
    fulfilled in the easy working out of their desires.” Gokul put his hand over mine,
    clamped, and cried out joy, “That is the dream of my life too, but I could not
    figure out its exact shape now!”²¹


    This anecdote shows the kind of world view to which the educated Bengali youth
    of the early twentieth century was attracted—a sense of universal humanity transcending
    national identity. With his head full of radical notions inspired by the reading
    of Tom Paine and European thinkers, the addabaj infused the nationalist project
    with a cosmopolitan, secular culture.


    What I hope to have demonstrated is that the utopian idea of a cosmopolitan community
    that met stepping out of his home to meet at a common resting-house (adda in a
    pada) often conflicted with his search for a habitus where local and national
    identities could be forged. The Bengali’s adda was a place of enunciation where
    the cosmopolitanism of modernity’s discourse and the provincialism of nation and
    national identity intersected.—its locations, beliefs, and practices—became a
    site where the different forms of cosmopolitanism, nationalism, and provincialism
    could be contested, negotiated, but not always, resolved.


