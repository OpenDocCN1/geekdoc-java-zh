  md: '# Concluding Remarks


    Galván Rodríguez''s online activism and mestiza poetry serve as testaments to
    Chicanas'' unwavering ability to assemble and develop communities of resistance.
    By spreading awareness about injustice and actualizing political change, the artists
    and activists involved in these digital communities meet Anzaldía''s vision for
    Chicanas to challenge the oppressions of society and establish a new culture where
    Chicana voices are honored and respected. However, future implications for the
    survival of activist digital communities, such as “Poets Responding.\ First, in
    the era of fake news, the moderators of this Facebook page must ensure the community
    remains a reliable source of information. Spreading false news may threaten the
    survival of this community, as members may decide to “unfollow” the page. Second,
    scholars and politicians need to recognize these digital communities as valid,
    fertile grounds of resistance demonstrations that accompany offline activism.
    Likewise, the community-published poems should be viewed as legitimate academic
    texts of study. Still, although this poetry engages in decolonial healing and
    deifies the limitations of capitalistic publishing companies that often exclude
    minority voices, the potential deletion of “Poets Responding” may lead to the
    erasure of this poetry. Last, future researchers should continue to investigate
    the powerful role of social media in broadening resistance agendas—whether through
    national or global organizing or by establishing public platforms for dissent
    that lead to real, actionable changes in society.


