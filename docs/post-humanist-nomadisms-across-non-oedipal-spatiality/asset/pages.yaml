    Chapter 10


    Tsewang Vishey Pemba''s novel, White Crane, Lend Me My Wings, is a work of historical
    fiction that follows the lives of people of the Nyarang valley in Kham province
    of Eastern Tibet. The timespan covered in the novel extends from the arrival of
    Christian missionaries in the remote Tibetan valley in 1924 till its annexation
    by the Chinese PLA forces starting in the early 1950s, and the subsequent rebellion
    by the Khampa warriors and escape of other Tibetans into exile. While delineating
    the consequences of these fateful encounters for the Tibetan people, the story
    paints a panorama of the Tibetan society spanning different generations and socio-political
    changes which it underwent as a result: from living by the Khampa warrior code
    and Tibetan Buddhism negotiating with foreign ideologies, and finally being forced
    to choose resistance, exile, and servitude of Communism. The internal tensions
    in the Nyarang society, such as the setting up of the Christian Lutheran Mission
    society (BLM) station in the valley, the result bloody feud between the Dragotsang
    and Rithangsang clans, and Tashi Rithangsang''s return as a PLA officer make the
    Nyarang valley a part of the Great Chinese Motherland, render the larger historical
    changes taking place in Tibet at once personal, poignant, and communitarian. The
    geographies of Tibetan, ''foreign'' and Chinese landscapes intertwined with thoughts
    of Buddhism, foreign ideologies, Communism, and Christianity become the nomadic
    space with which Tibetan people have to contain.


    The novel traces the journey of Pastor John Martin Stevens and his wife, from
    San Francisco to Nyarang Valley in the Kham Province of Eastern Tibet, and the
    tragic events that unfold thereafter. The reader is invited to deconstruct various
    stereotypical about Tibet along the Stevens on their maiden journey to the Tibetan
    hinterland. The remote Nyarang valley, symbolic of Tibet''s isolation, is described
    in myriad ways before the missionaries'' arrival. From a ''virgin territory''
    waiting to be conquered to the dangerous abode of savage and blood-thirsty ''Khampa
    bands,'' the it of Nyarang takes on an enigmatic quality built by foreign fantasies
    which transform along the journey. Only when the Stevens finally reach Nyarang
    and start interacting with the accommodating Dragotsang''s family does the mysterious,
    out-of-bounds valley change. The arrival of the Christian missionary couple marks
    the beginning of a series of life-changing events for the Nyarang people. The
    final attack and takeover by the PLA forces, the revered high mountains that had
    protected the people of the valley for centuries are transformed into an open-air
    prison as the Tibetans pay the price for their isolation.


    > 1. Tsewang Vishey Pemba, White Crane, Lend Me My Wings: A Tibetan Tale of Love
    and War (New Delhi: Niyogi Books, 2017), 25-31.'
