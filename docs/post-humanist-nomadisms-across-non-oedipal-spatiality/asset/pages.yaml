    Mexico, surrounded by threats of violence, condemned to misogynist dictatorship
    and age discrimination").9


    Doña Flor gets up in the morning and dresses in one of her almost identical outfits.
    She takes the subway to work, where she quietly makes life miserable for the sequence
    of people trying to get their voter IDs. She feeds her cat, washes her dishes.
    After her meager dinner, she writes the names of all the people she sees in a
    ledger, with a red dot next to a few of them. She goes to bed and stares at the
    ceiling. We know her cat is Manuelito, but not even her name until half through
    the film. One day her cat dies. Another day in the pool, a woman washes her head.


