  md: '# Transcultural survival under colonial assault


    At the time of the colonial conquest of Mexico, Mesoamerica, and the Andean regions
    had been home to amaranth for five millennia, since 3400 BCE.¹ Called huauhtli
    by the Mesoamerican people and kiwich in the Andean regions, was part of the staple
    diet, along maize, beans, squash and chia. Instead of using its existing name,
    Friar Bernardino de Sahagun calls it pejoratively, as blendo and cenzado, words
