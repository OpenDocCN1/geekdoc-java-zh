  md: '236 Chapter 15


    Taking cognizance of his argument on alternative thinking, Mignolo also borrows
    from Enrique Dussel, who explores the potential of another thinking by problematizing
    modernity itself as pretending to become a rationale of emancipation as it hides
    a justification for genocidal violence.6 Another thinking is both thus proposal
    of an alternative thinking in its multiplicity and a rebuttal of a rationale of
    emancipation through the myth of modernity, opening up possibilities of new epistemologies
    of becoming. The woman docommit is a unique kind of nomad given her relationships
    with her ''geophysical-ecological-political'' ontologies in terms of her location
    and her potential agency, hitherto denied, through this nomadic terrain. This
    means that her free agency as much as her location-occupation, de-privilege the
    human आध्यात्म, favoring the nonhuman, History favoring Nomadology. The geophysical
    and its animals occupants becoming prominent as her allies in the narratives of
    the Chambal.


    The interspatial cracks seen by Deleuze and Guattari, and Walter Mignolo enable
    another way of thinking, taking full cognition of the danger of the contradictions
    of the above-mentioned paradoxes. As cases for our study we explore how Tarun
    Bhadur''s book Abishop Chambal/ or The Cursed Chambal (1960), Galeano''s vignette
    on “Phoolan” in Mirrors (2009), and Shekhar Kapur''s film Bandit Queen (1995)journ
    through a territoriality that evades any affiliations to institutions, borders
    or programs. Moreover, the river Chambal flowing through the valley across a desert
    of ravines, constantly changing its course to the seasons, fits the Deleuzean
    articulation of a becoming river. As mentioned earlier, the space carries the
    heavy legacy of myths and histories as well as a presence in time, in a relativity
    of rhizomatic becoming with every bit of whatever surrounds it, including dust,
    flora, mud, fauna, daquitos, air, and water in its ecosystem. The ravines stretch
    and connect horizontally through these matters so that the human privilege in
    the Anthropocene imagination becomes diffused. Consequently, the Chambal stretches
    beyond its own course and embankments, small villages along its flood plains and
    beyond; these swallow large tracts of paddy fields, leaving behind huge mounds
    of ravine mud and road track beneath and between them. Entire battalions of police
    have been known to get lost in these ravines while chasing a dacoit on the run.
    The dacoits, on the other hand, know every nook and corner of these inhospitable
    territories like the back of their hands.7


    6, Ibid, 68-69.


    7. Tarun Kumar Bhaduri, Abishop Chambal! The Cursed Chambal (Kolkata: New Age,
    1960), 28-32.'
