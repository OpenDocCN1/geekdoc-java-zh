    Eberhardt and various responses to her personality, in life and words.


    # Imitation of nomadism, and gender mobility


    Isabelle Eberhardt (1877-1904) was an illegitimate child of Russian

    parents in Geneva. Her mother had been married to a much older dignitary,

    widow with whom she had several children. The mother had moved to

    Geneva with the tutor of poor origin, married, but separated, and all the

    children but the two eldest girls. When her noble husband died, her liaison

    the tutor resulted in Isabelle''s birth, bearing everyone in the Swiss household

    from being accepted "good society" in Russia if they ever returned.

    Isabelle was a born exile whose passport was that of a nation that

    rejected her and whose country of birth and residence was reluctant to accept

    her and also placed her under surveillance. This fact, combined with the

    original education provided at home by Trophimovich, her father/tutor who

    knew or studied many languages, is certainly not enough to explain her cross-dressing,
    her attraction to the Maghreb, her incipient career as a journalist and writer,
    and the rest of her tragic and passionate

    destiny. The influence of her father in anarchist movements, whose role in

    Isabelle''s upbringing is decided as Annette Kobak''s sensational

    biography, is probably less important than the contradictions of a former pope

    and jack-of-trades who became a passionate botanist and tried to make

    living out of his tropical greenhouse Geneva. These influences may

    contribute to understanding why the word "nomad" has stuck to her from one

    of the earliest literary articles to the latest academic research on her, and
