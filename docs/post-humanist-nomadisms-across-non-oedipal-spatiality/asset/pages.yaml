  md: '# Language (E)escapes 77


    The FGD was with a group of 12 women of different ages from South Asian backgrounds
    who together attended a Spanish language class for adults. The participant observation
    method was used whenever possible during the course of four months in a variety
    of contexts.¹16


    Appurai''s theory ofscapes inspired the term Language (E)escapes used in this
    paper.¹17 In his well-known theory, he argues that in the global world, cultures
    are in constant flow and influence each other. My term also resonates with Steven
    Vertovec''s concept of superconductivity to talk about the contemporary social
    reality of Europe, which is “distinguished by a dynamic interplay of values among
    an increased number of new, small and scattered, multiple-origin, translationally
    connected, socio-economically differentiated and legally stratified immigrants.¹18
    Sociolinguists have observed a linguistic superconductivity in the various European
    cities like Barcelona, where people with over hundred nationalities or ethnic
    origins live together, as migrants, tourists, refugees, and member state workers.¹19


    Appadai''s ethnoscope the result of the unprecedented global flow and movement
    of people. In the same way, a language (e)scape would be the result of the diversity
    of languages spoken by such people, who are in continuous flow. Further, in this
    study I argue that we observe the use of what Jan Blommaert calls ‘repertoire’
    rather than ‘languages’ by the migrant subjects in their day to day life.20 He
    argues that while languages are ideologically constructed as a unified, homogeneous
