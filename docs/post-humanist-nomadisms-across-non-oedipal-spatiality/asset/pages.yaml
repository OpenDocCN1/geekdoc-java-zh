  md: '# Chapter 15


    # Chambal as nomadic in global and local

    narratives on Putli and Phoolan


    Sanghita Sen


    University of St. Andrews


    Indrani Mukherjee


    Jawaharlal Nehru University, India


    # Abstract


    The myth of the Chambal is surrounded by its unholy origin from the blood of thousands
    of cows sacrificed to appease the gods. It is also a land cursed by Draupadi,
    the female protagonist of the ancient Indian epic, the Mahabharata. No civilizational
    forces have been able to overcome the real or imagined fear associated with this
    wild geographical spatiality. Yet the Chambal Valley (henceforth Chambal) has
    been a site of refuge for the most deprived castes, for victims of social injustices
    and fugitives of the law. It hence becomes an alternative home to such people
    that the nation-State does not accommodate. Tarun Bhadhuri’s Abhishapto The Cursed
    Chambal (1960), Galeano’s “Phoolan” in Mirrors (2009), and Shekhar Kapur’s Bandit
    Queen (1995) retell the Chambal valley as a nomadic space traversed by women dacoits.
    In this essay, we propose to explore the geo-political and eco-sociological spatiality
    of the Chambal, through Deleuze and Guattari’s theorization of a nomadic space,
    Walter Mignolo’s agenda of “location” of enunciation, thus de-privileging the
    human, using the three texts above as case studies. The Chambal thereafter becomes
    an enabling space of border thinking and beyond coloniality of power, as the women-dacoits
    perform embodied counter-narratives here. This counter-narrative decolates a process
    cultural of a competitive patriarchal assemblage of sympathetic inclusion by the
    media, the condescending government institutions, and popular culture. The Chambal
    valley and its nomad occupants become a perfect example of a Deleuzean War Machine.


    **Keywords:** Caste, Chambal, women dacoits, cursed, border thinking'
