  md: 'While the Serengeti-Mara ecosystem has been extensively studied by ecologists,
    there remains a dearth of study on the agency of pastoralist Indigenous communities.¹¹
    This area of African savanna is geographically situated within the internationally
    recognized national borders of Tanzania and Kenya. The physical space encapsulates
    a diverse socio-ecological structure. The region is a receptacle for incalculable
    interaction between human and non-human species. The ecosystem carries two names—the
    “Serengeti” in Tanzania and the “Mara” in Kenya. Restructuring the Serengeti-Mara
    ecosystem of environmental management from a bottom-up approach would be beneficial
    for the preservation of the region. While the has lost one-fourth of all grazers
    in the last couple of centuries, the Serengeti-Mara ecological landscape has been
    similarly threatened. Preservation projects for animals like wildebeest, zebras,
    gazelles, are urgently required as tourism, government, and efforts towards sustainable
    development, and hunting, directly and indirectly, diminish their populations.²
    Pastoralism is one vital example of savanna wildlife-human interaction. Pastoralists
    are often the subject of Western romanticization. Bruce Chatwin’s is a Nomad Nomad,
    and Raymond Williams’ The Country and City illuminate a simplistic and romantic
    view of nomadism and pastoralism.³³ However, pastoralists’ relationship with the
    region’s ecology is complicated. The objective of this current study is to imagine
    pastoralists who positively impact their environment and support diverse ecosystems
    while dispelling the discriminatory and harmful notions of primitiveness and simplicity.
    Rather, the relationship between humans and wildlife in the savanna landscape
    is, in the absence of disruptive interventions, symbiotic, mutually beneficial,
    and complex. Champions of the environmental conservatism movement with indigenous
    activists and local pastoralists.⁴


