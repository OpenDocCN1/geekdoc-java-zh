  md: '# Chapter 5


    # Language (E)scapes: Linguistic diversity and integration of South Asian migrant
    women in Barcelona, Spain


    Swagata Basu

    Doon University, India


    # Abstract


    To physically live in a space but to remain invisible and inaudible to its surrounding
    is a peculiar reality for many South Asian women in Spain who usually join their
    working migrant spouse or other family members after a reunification process as
    they get transplanted from their socio-cultural and linguistic environment to
    a completely new one. This paper is an attempt to closely understand the complex
    spaces they inhabit after their migration. We call those spaces language(e)scapes:
    spaces of flow, hybridity, and interaction of languages and cultures drawing on
    Arjun Appadou’s theory of spaces. The paper is based on eight in-depth interviews,
    one focused group discussion and participant observation carried out as part of
    the doctoral research in Barcelona in 2018 by the author, a Spanish-speaking South
    Asian woman herself. The study shows that there is a broad spectrum that the subjects
    experience, which is shaped by various factors. It finds that the inability to
    communicate in (and thus interact with) the already diverse, host society languages
    along the traditionally limiting role inside the subjects into alienating bubbles
    where they can remain for days, months or years. However, the pre-existing language
    repertoire and their ability to learn new languages or to translate, i.e., using
    the repertoire in new ways to communicate, determine their migration experience
    to a large extent. While previous research establishes that the knowledge of local
    languages helps in the social integration of adult migrants, this paper fills
