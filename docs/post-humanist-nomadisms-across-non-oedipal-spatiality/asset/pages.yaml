    Scholars have examined historical documents to study what adda looked like in
    the Kolkata of the nineteenth and twentieth century.6 In the nineteenth century,
    the adda in the baithakharnas (visiting parlor) was the epicenter of ideas about
    reformation, revolution, and nationalism. The birth of a modern Bengali intelligensia
    or the Bengali bhadralok happened with the production and presentation of political
    and cultural ideas on freedom, nation, and national culture among members who
    belonged to the same socioeconomic status. Many addas were started by Bengali
    zamindars, who often acted as patrons by providing their living rooms (baithakhana)
    as the venue for gatherings. By the late nineteenth century, adda got dissociated
    from the wealthy patron and his baith. It moved out to public spaces of gathering,
    becoming more egalitarian. The change has happened on the growth of the Bengali
    educated middle-class (sikkhito madhyabitto sreni).


    Adda in the twentieth century took on a hybrid form, combining elements of gatherings
    in baithakhana with that of coffee conversation. The venues ranged from tea stalls,
    office cafeterias, bus stops, or at the rawk where young men of the membership
    assembled to have their daily chitchat over a cup of tea or coffee. The difference
    between the older adda in the baithakhana of a rich patron and the newer form
    held in public places was the latter''s affiliation to a democratic membership
    and its performative speech register. Adda was at a juncture where three movements
    characterized it: moving out of domestic spaces to public venues, moving away
    from an exclusively male domain to allow (a few) women to participate, and finally,
    from upper-class patrons to membership from different socioeconomic classes.


    The changes mentioned earlier in the constituency of adda blurred the boundaries
    between ghare and baire, reconfiguring Kolkata''s urban space. Whereas the adda
    in the living room disrupted the domestity of ghare, turning the private into
    a public space, baire, the adda on the rawk or in the kinda clubhouse relocated
    these places neither completely inside the home nor exactly on the street. The
    rawk, usually a sit-out outside a house or by the lane, and the kinda clubhouse
