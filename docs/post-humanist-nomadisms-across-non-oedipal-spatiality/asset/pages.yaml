  md: '# The remnant of the journey''s anguish


    Ghazal is the most prominent lyrical genre of classical Persian and Urdu poetics.
    The poem''s form is as such that it has couplets or two-line verses. The particular
    order of the couples within the whole poem does not matter; that is, any verse
    could be read before or after. Similarly, neither does it matter if the speaker
    or reader, while reciting a ghazal leaves out a couple or entirely. Classically,
    a ghazal would have an odd number of couplets in it (say, five or seven), but
    again there are no rules that cannot be compromised, at least not in the contemporary
    tradition.²⁵ The pattern of the ghazal is as that as the first couple (also called
    the matla) will have a fixed word or radif in both lines of the couplet. In the
    subsequent couplets, the radif remains constant in the second line of the couplet,
    so the pattern just comes to be of bA, cA, dA and so on and so forth.


    Moreover, even just one couple could be considered a ghazal or a poem unto itself,
    and arguably, the order of that could bechanged without giving rise to any whatsoever.
    The poem has a beginning and an end, but no middle, and this precept is most fully
    and beautifully conspicuous in the genre of the ghazal.²⁶ As a case in point,
    we can go back to Nasir''s shi that we encountered, albeit in reverse order:


    Aur khi dhiro udās udās

    Mil hi jiē gaftagan kā śārah


    Keep up this melancholy wandering for a few more days

    You are bound to find a trace of the departed²⁷


    > ²⁵ The genre of the ghazal and its related poetic experience has transformed
    (perhaps it is more apt to say it has declined) over past centuries but what changed
    even dramatically—at least in a certain historical moment—was its reception. In
    the colonial era, the ghazal came to be seen, for the first time in its history,
    as a feminine, decadent and unnatural form of poetry first by the colonizers,
    and under their influence then many thinkers and critics (often of a more conservative
    bent) within the Urdu milieu itself. Their reasoning—or lack of reasoning—was
    that the classical ghazal is courtly (or finest hinge of the poem), abstract,
    optical, and charged with homosexual innuendos and hence is decadent and banned.
    This was a time of Victorian morality and the so-called trends of realism and
    naturalism in poetry and cannot help wonder if there is a correlation between
    these seemingly distinct phenomena. And as it may, for a splendid defense of the
    ghazal genre against such myopic (in case of homosexual suggestiveness) or ill-founded
    (such as ghazal alleged apoliticity) see Naqvi, 2008.


    > ²⁶ I am grateful to Roger Reeves for this idea about what a poem is during our
    in-person conversation.


    > ²⁷ Naqvi, Mourning Indo-Muslim Modernity, 189.'
