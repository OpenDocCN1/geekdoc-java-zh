    The narrative or poem captures not only the mapping of difference between alternative
    spaces but the formations of identity within difference and displacement. For
    example, Robertson et al. relate several of their contributors in Travellers’
    Tales argue that identity is founded on imaginary trajectories of here and there,
    I and not-I.⁴⁴ And, if we begin to layer this palimpsest of movement within the
    travel, between language and the physical movement of the body, here and I and
    not-I, and we connect to these traces as they follow real geographical, with their
    own temporalities, histories, cultures, and socio-political networks then this
    literary analysis of Sri Lankan poetry also provides “a map” to the larger systems
    at work colonialism and globalization. Subsequently, this kind of map also provides
    a methodological approach for understanding the relationships of identity in global
    politics. Furthermore, Doreen Massey writes:


    > [geographers have long been by the principle of defining regions, and this question
    of ‘definition’ has almost been reduced to the issue of drawing lines around a
    place [...] But that kind of boundary around an area precisely distinguishes between
    an inside and an outside. It can so easily yet another way of constructing a counterpoint
    between ‘us’ and ‘them’.⁴⁵


    If we apply Massey''s analysis to these poets and their movements and out of Sri
    Lanka, then the body becomes a borderland, and as the poet moves, so the lines
    that previously defined the geosacial formations of Sri Lanka.


    As language invokes displacement, and as the writer continually performs the self
    in writing, we begin to complica and problematize what it means to travel, extending
    not only the historically developed boundary lines of Sri Lanka but the honed
    body. And what can this imaginary tell us about, not only how we understand the
    process of knowledge production, but also the fluidity of identities, bodies,
    and geographies. The power of the Sri Lankan body is not in its singularity but
    its excess. A body that is always, already finding alternative boundary lines,
    re-creating the maps of the region through myth and memory.


