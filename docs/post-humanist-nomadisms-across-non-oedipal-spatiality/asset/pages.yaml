  md: '# Chapter 1


    # Ambiguous mobilities:

    Nomadism, interpretation and action


    Didier Coste


    Université Bordeaux-Montaigne, France


    # Abstract


    The article attempts to clarify the notion of nomadism, which is often taken as
    synonymous with wandering (even with a loss of bearings and bonds, or aimlessness
    while, anthropologically, many actual nomadic groups always follow the same regular
    routes determined by local resources, the cycle of seasons, and/or trade activities);
    in traditional societies, roles are strictly distributed and practices highly
    ritualized. There is a rather obvious difference between “errant” and “itinerant.”
    Hence, the conceptual ambiguity of “nomadism.” Before we decide whether “nomadism”
    can still be used as an enlightening simile or metaphor to explore contemporary
    modes of occupation of transience (physical, social, emotional, epistemological)
    spacetime and whether it betray opportunism or dissent, community construction
    or tribalism, tradition, rupture or regression, it is necessary to examine some
    influential and representative samples of the very abundant contemporary literature
    on or rather around nomadism.


    I will focus critically on a generation of senior writers/thinkers who operate
    in France: Kenneth White, Michel Maffesoli, and Jacques Attali. Secondly, I discuss
    the practice of fiction and essay-fiction by J.M.G. Le Cléo. Thirdly, I will concentrate
    on one particular case study: the Russian expatriate to North Africa and Francophone
    writer Isabelle Eberhardt whose transgress have been hotly debated by many biographers
    and critics. This way, rather than dealing with present issues of forced migrations
    and identity trouble, I aim to contribute a historical/theoretical background
    to contemporary revivals of the nomadic concept.


    **Keywords:** Transvestism, essay-fiction, Algeria, infra-nomad, hyper-nomad'
