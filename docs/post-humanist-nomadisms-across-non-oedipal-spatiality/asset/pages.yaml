    also a number of practising Christians, as a result of the historical interactions
    of colonialism. As a Sri Lankan Christian, Arasanayagam sets her own introduction
    of geography and travel paradoxically against, and parallel to, that of the creation
    of Genesis.


    She begins by linking geography and God: “Maps were alien to me, I had no knowledge
    / of a greater world, all I had in my mind were the words of the Great Creator,
    God and the / Word that made flesh embodied in mankind, everything stemmed from
    the Biblical Genesis.”24 Juxtaposing ignorance and knowledge, the poem opens a
    comparison of, on one hand, the Word of God, the Bible, and on the other, the
    spatial texts of “Maps.” While Arasanayagam situates the poem in Biblical Genesis,
    she does not introduce the concept of knowledge with the tree of the knowledge
    of good and evil.25 Instead, knowledge is aligned with maps, as the keys are to
    a “greater world.” Placing the concept of production in this way, also allows
    her to claim and position herself as the producer of knowledge, as she continues,
    “so how was I to how I knew, so was I to name/islands and continents I was still
    to step on, / oceans that I would traverse in voyages of my own discovery.”26
    The world, including islands and continents, emerge in the moment of her own discovery.
    More precisely, she claims the position of both the cartographer and creation.
    The world emerges in front of her as she names it; it does not appear initially
    to exist before the ability to name it and write it. In these moments, she works
    not only as a writer but also as a cartographer, implying the direct meaning of
    cartography: earth writing.


