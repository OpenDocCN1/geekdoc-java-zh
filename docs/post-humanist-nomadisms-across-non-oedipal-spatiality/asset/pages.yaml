  md: 'Nomads ceaselessly redefined when the world moves about/around them. If they
    are real, positive cosmopolitans, dwellers of a human world, they will reinvent
    the world of living in any place for any length of time as if it were one’s abode,
    where one belongs. Which does not involve developing a nomadic identity (I was
    wondering [...] if one has to claim for bear an identity, for that could imprison
    a mind and a soul to be made, to be reshaped, in a changing age and environment).28
    Nomadism, reworked from an experimental and ephemeral shifting position, being
    a dynamic situation, will never make itself pass for an origin (emanating from
    a mouth that was before it spoke), could thus become a proper figure for the kind
    of cosmopolitanism that listens to and dialogues with the “whole earth” in each
    of its manifestations, lasting or ephemeral; in this sense, it would not be very
    different from an interactive humanism that requires at the same time participation
    in the general otherwise of the defamilized real, and speculative secularction.


