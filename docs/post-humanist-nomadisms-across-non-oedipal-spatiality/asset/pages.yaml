    My second thought is that in the practice of adda, the Bengali bhadrasamaj negotiated
    alternative modernity that I call bhadralok cosmopolitanism. The idea of modernity
    as a plural condition has led several bhadralok theorists to establish more explicit
    links between cosmopolitanism and modernity.¹¹⁴ Many cosmopolitan movements cannot
    be subsum subsumed in an overarching notion of modernity. Furthermore, theorists
    like Gaonkar and Chakraborty have suggested that the pluralization of cosmopolitanism
    can be linked to modernity as a dialogic process, as opposed to a strictly universal
    one. Cosmopolitanism is now seen as plural and post-universal notion by scholars
    like Gaonkar and Chakraborty. Thus, in contrast to the dominant Enlightenment
    notion of cosmopolitanism as a transnational republican order, I suggest that
    the bhadralok in his adda constructed a post-universal cosmopolitanism that, as
    its point of departure, constructed different kinds of modernity and processes
    of societal transformation. The passa adda did not presuppose the separation of
    the social and the cultural from the political or postulate a single world culture.
    It thrived in its provincial singularity as well as the many rhizomatic connections
    it established with the world outside (gare-baire).


    During the period of colonial modernity, for bhadralok society, English education,
    a cosmopolitan outlook, and the ability to access the civil service became markers
    of culture and power. It was out of his desire to enter into modernity''s narrative
    that the bhadralok reinvented the peculiar content and discrete style of adda.
    However, notwithstanding the somewhat cultivated posture of an colonial servant,
    the bhadralok with his penchant for adda unwittingly lent credence to the colonial
    stereotype of Bengalis as a lazy, evenate community. Nirad Chaudhari, the last
    true Englishman, has this to say about the “gregariousness" of Bengali:


    What the nature of city [Calcutta] lacked in sociability was made up in gregariousness.
    No better connoisseur of company was to be found anywhere in the world, and no
    one else was more dependent on the contiguity of his fellows with the same incomprehension
    of his obligation towards them. The man of Calcutta found the company he needed
    so badly and continually reassembled, without any effort on his part, in his office,
    or in his bar-library, or in his college, which were no less places for endless
    gossip for work.


    ¹¹ Chaudhari, Clearing a Space, 24.


    ¹¹⁴ Dilip Parameshwar Gaonkar, Alternative Modernities (Durham: Duke University
