  md: '# Carving out their Own Space


    Despite the contradictory forces at work, there are enterprising South Asian women
    who have divided and carved out unique space for themselves in the diaspora. Sunita
    is an example of an enterprising woman. She speaks Spanish fluently. She is the
    sole proprietor of a beauty and aesthetic center in the city of Sabadell, 20 kilometers
    from Barcelona. She is also a mother and wife. She reported that her clients were
    from all nationalities, including Spain, Catalonia, Bolivia, and India. She has
    acquired not just language skills, but the gestures and behaviors typical of a
    beauty salon in an economically developed country. She speaks Spanish with a local
    accent.40 The name of the aesthetic center reflects her Indian ethnicity, but
    she asserts that her skills are based on rigorous training in Catalonia. She handles
    her client''s communication, receives calls to give appointments, checking her
    diary, taking a pause from her ongoing sessions, multitasking through the structured
    interview.


    Manu, 26-years-old from Punjab, India, has not yet picked up the language thoroughly.
    She expressed that she did not find the language very appealing. Therefore, she
    does not enjoy learning. But she runs a grocery shop with her husband in Poblenou.
    She has picked up the words and phrases required to interact with clients when
    her husband is not at the shop. She has also devised mechanisms to manage difficult
    situations. She does not let it show when she does not understand clients. She
    is full of confidence, and although her Spanish is accented, gestures are like
    that of the local people. There are many women like Manu who interact with their
    clients from the home society. In Spain, these small supermarkets, de alimentación,
    colloquially called Paquis, because Pakistani nationals run many of them. However,
    a few of these shops are managed by migrants from India and Bangladesh, where
