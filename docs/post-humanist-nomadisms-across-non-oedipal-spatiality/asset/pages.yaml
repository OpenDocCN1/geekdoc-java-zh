    In my next visits, I found out that the priest, whom I later interviewed, worked
    as a waiter in a restaurant. He parallelly studying religion and training to be
    a priest or a preacher.


    The group dynamics in the temple show that the rules and norms of a society, its
    customs and habits, and especially the patriarchal aspects remain intact even
    in a new geographical space. The situation of these migrants and especially women
    can be described as bubbles as a metaphor. There is an invisible border that every
    woman carries around her in the new geographical space. Unless she breaks out
    of this bubble, her migration is partial. She has physically moved from a location
    in India or Pakistan, or Bangladesh. Still, she continues to inhabit the same
    psychological and social spaces that she belonged to her origin country. I am
    using the term language)escapes to denote this bubbled reality of South Asian
    migrant women in Barcelona.


    # Breaking out of the bubble or stepping out


    Most South Asian women migrants in Barcelona come from rural societies where the
    woman’ primary role is taking care of a household. They mostly stay within the
    domestic space, spending their days cooking, cleaning, feeding the children, and
    on other household chores. They continue with the role after migrating. They do
    step out, for example, to pick and drop the children from school, but it is an
    extension of their domestic caregiving responsibility. Within the research sample,
    Tripti, Jhumoor, and Saadeira represent this typical profile. They hardly know
