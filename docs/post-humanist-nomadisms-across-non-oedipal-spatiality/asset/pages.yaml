    are Phoolan''s partners in crime. The politics of this becoming rests in a critique
    of the salvation paradigm of coloniality/modernity dualism, which occupies the
    genocidal side of humanist rationalism as observed by Mignolo.¹¹⁸ The notion of
    a bodily encounter fits perfectly with the bodily performatives of Galeano''s
    text on Phoolan Devi''s rape by her husband, the police, and upper caste men as
    an accident or chance at intersectionality, an event potential. Representation
    can be a laid-back comfort zone of thought. Still, an accident or an encounter
    is something which can be a violent outside, pushes us out of a situation of habits
    towards an exiled and orphaned spatial discomfort of thought. This could be a
    becoming of our thinking as nomad readers, from a passive consumer of texts and
    images to that of reading itself as a bodily performative in/from another nomad
    space. The ox and the thief in Galeano''s text encounter the striated space of
    the State to confront an epistemic package of modernity, rationalism, secularism,
    democracy, rendering them also as nomadic.


    # Nomad space as the local de enunciation


    Borard''s issue with representationism as explained above, our attempt at a posthumanist
