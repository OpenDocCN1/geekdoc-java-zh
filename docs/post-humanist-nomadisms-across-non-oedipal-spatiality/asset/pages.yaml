  md: '# I


    ''Human'' is a regional word to name one species of living organism that, among

    other features, walks on the two lower extremities and that that, in so doing,

    liberates their hands to provide themselves with food and shelter. Once the

    mouth was liberated from the necessary task of providing nutrition, the organ

    began to be used to expand its capacity to emit sound and expand the

    ordination of activities with other organisms of the same species co-existing

    t the same space. Like any other living organisms (what we call animals

    (including insects) and aquatic vertebrates, etc.) they group with members of

    t the same species living in the same surroundings. Over time, millions of years,

    our ancestors expanded their ability to coordinate their activities through

    sounds and scratching symbols on flat surfaces (what is generally called

    writing).


    To make the short story, languaging became a distinctive feature of one

    species of organisms that allowed the members of said species to tell

    stories about the origination of the cosmos (to use a common word), of planet

    earth, of all living organisms, and about the conditions that makes living

    organisms on earth possible. The particular genus of the species telling the

    story of the origination of the universe (of planet earth, of all living organisms)

    are and the genus of the particular species of living organisms walking on

    onlinear the lower extremities from walking meaning the task of food

    provision and allowing them to engage in languaging. Furthermore, liberating

    the upper extremities from meaning that they could be used to provide

    themmselves with food, shelter, and to build instruments to extend the uses of

    the hands. Languaging and storytelling emerged to coordinate and reflect on

    the meaning of their actions, their memories, and, briefly, the constitution of

    the communal organization.


    The point here is that, in modern vernacular European languages, the term

    ''human'' and the messages attached to that, is neither the word nor the

    common meaning to the speaker of non-European languages. That is until

    colonial invaders came with their own image of themselves, their own

    storytelling that ignored, disturbed and silenced the invaded people''s ways

    thinking of themselves as well as their own judgements of the invaders. For

