    Deleuze and Guattari refer to as the "nomad line" does not seek to avoid anxiety
    or contradiction, but, "traces" between these points of smooth space.That is,


    the nomad line is abstract in an entirely different sense, precisely because it
    is a multiple orientation and passes between points, figures and contours: it
    finds a positive motivation in the smooth space it traces, not in any striation
    performed in order to ward off anxiety and subordinate the smooth. The abstract
    line is an affect of smooth space, not a feeling of anxiety that calls for striation.10


    In contrast to traditional travel writing affects a consequence of the anxieties
    and contradictions that play between colonialism and globalization, the tracings
    that are made by these Sri Lankan poets do not seek striated or anxious spaces;
    instead they emphasize the connections between systems like colonialism, nationalism,
    and globalization. As Deleuze and Guattari suggest, "traces" should always be
    up on the map.11 Deleuze and Guattari''s distinction between tracing and mapping
