  md: '# Chapter 4


    # Adda as a cultural discourse of the Bengali


    # Bhadralok provincial cosmopolitanism


    Prantik Banerjee


    Hislop College, Nagpur, India


    # Abstract


    Adda became very popular in nineteenth-century Bengal when the British ruled India.
    Its popularity was both enabled by westernization and a reaction to it. Europe,
    world politics, and especially England were always tied to adda. Historically,
    adda has been a cultural marker that has defined Bengali urban, middle-class,
    male identity. It is a kind of informal social talk in Bengal, among friends and
    colleagues, but its content is always of intellectual significance, addressing
    issues such as local/global politics, art, literature, and music. The article
    will analyze the manner in which adda as a verbal performative act created two
    seemingly contradictory narratives: one, which helped instill among Bengali men
    from the urban, educated middle-class, a provinciality that gave their subjugated
    status as a colonial subject a certain degree of pride bordering on subversion;
    second, a contradictory narrative of the a cosmopolitan citizen of the world;
    one who, with others, generate a collective and participatory discourse where
    Baudelaire and Bankim, communism and communism, football and cricket, Che Guevara
    and Chairman Mao, and jatra and opera were all mingled in a celebratory mode.
    The article argues that the oppositional attributes of adda are held in fine balance
    as it tracks the ways in which the provenance of adda in Bengali cultural identity
    moved from nineteenth-century rural meeting spaces to today''s worldwide web chat
    rooms.


    **Keywords:** Male identity, colonial subject, provincial cosmopolitanism, performative,
    collective identity


    Adda is a part of Bengali modernity and has historically been a cultural marker
    that has defined the identity of the Bengali urban middle-class male identity.
