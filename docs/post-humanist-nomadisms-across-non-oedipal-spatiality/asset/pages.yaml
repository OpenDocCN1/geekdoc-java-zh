  md: '# Towards a self-critical subjectivity 167


    with all their geophysical and sociopolitical memories remains a bone of contention.
    The narrative deliberately complicates conventional markers that determine identity.
    At one point, the reverted Buddhist Lama Tharsel Rinpoche jokingly notes that
    the American Pastor John Martin Martin Stevens spouses Tibetan Buddhist wives
    of compassion and tolerate being a Christian missionary in the Nyarang valley:
    "[Y]ou are most tolerant. You remember how you used to be when you first came
    here? Now, do not preach your religion, even to your own son!*18


    The next question follows is, how can one possibly move beyond the notion of a
    stable self? Self-critical subjectivity doesn''t consist of different layers of
    the self, or a sort of structured hierarchy or centrality, wherein a wiser critic
    selects a less wise and more fundamental self. In this case, it is helpful to
    think with the concept of the rhizome, as proposed by Deleuze and Guattari, who
    advocates a-centered, non-hierarchical multiplicities over unity and harmony in
    a structure: "There is no unity to serve as a pivot in the object or to divide
    in the subject. [...] A multiplicity has neither subject, nor object, only determinations,
    and dimensions that cannot increase in number without the multiplicity changing
    in nature."19 Hence, such subjectivity would consist of criticality towards the
    rest. The dangers of singular identity or self taking over are apparent. It pushes
    one into oblivion towards others positions that contradict the chosen stance or
    challenge rigid socio-political affiliations. The tragedy that unfolds in the
    Nyarang valley when innocent people like Tsongpon are tortured to achieve rigid
    ideological aims of the communists betrays ''one-size-fits-all'' kind of policies
    devised at the top of a hierarchical structure and their consequences at the ground
    level.20


    On the other hand, openness towards the multiple positions and identities available
    at any given time engenders the possibility to operate from a holistic perspective,
    which takes numerous, at times contradictory, positions into consideration. In
    a similar vein, discussing Adorno''s view of the meaning of exile for the intellectual,
    Said writes: "For him, life was its most false in the aggregate—the whole is always
