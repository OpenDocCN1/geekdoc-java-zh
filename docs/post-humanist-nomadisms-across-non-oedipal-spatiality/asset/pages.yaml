  md: '# South Asian Women Migrants in a superdiverse and complex space: Barcelona


    The present article deals with female migrants from India, Pakistan, and Bangladesh14
    (henceforth referred to as South Asian Women) in Barcelona, Spain, focusing on
    their experience with the locals languages of their receiving society in order
    to understand the relationship between language and integration of immigrants.
    The paper is based on the ethnographic fieldwork I did in Barcelona as part of
    my doctoral research in 2018. Through this article, I would attempt to highlight
    the ability to learn new languages and transllaging plays in the social integration
    of migrant women from South Asia in Barcelona. 15 This article is based on eight
    semi-structured in-depth interviews that included open-ended and closed-ended
    questions, Focus Group Discussion (FGD), and participant observation. Below is
    the table of the eight residents that form the primary sample.


