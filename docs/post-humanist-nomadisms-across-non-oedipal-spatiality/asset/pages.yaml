    Chapter 12


    in history.\¹The Trek franchise has garnered considerable attention from audiences
    and scholars in its fifty-plus years on television and the big screen. It is often
    praised for highlighting a “progressive, liberal vision” of the future.² Voyager
    takes the Star Trek to the other end of the galaxy in a story that models the
    directives of adventure and exploration that have been popular Western storytelling
    tropes for centuries—and served a significant role in normalizing Euro-American
    imperial expansion for Western audiences. In this paper, I argue that the adventure-casual
    traditions present in Voyager are modeled on Euro-American adventures steeped
    in ideologies of empire. These narratives perpetuate imperial modes of thinking
    about exploration and discovery, and in Voyager, enable the continuation of American
    ideals throughout the Delta Quadrant. Specifically, I examine the adventure narrative
    of Voyager, framed through principles of ‘manifest destiny,’ to demonstrate the
    superiority of Western civilizations, including the belief that Westerners will
    never be refugees.³


    Voyager’s focus on exploration and discovery as a method of getting home and laying
    claim to new territories reflects American practices of ‘manifest destiny.’ Deployed
    initially by John O’Sullivan, the term encompasses the belief in a “Providence
    grant” of expansion across the North American continent.⁴O’Sullivan’s use of the
    term, and the Democratic Review, in which he was an editor from its inception
