    Spanish as a form of resistance. Galván Rodríguez also aspires to educate her
    readers to learn Spanish by including English translations. In the final stanza,
    the poet translates the Spanish “poder” to the English “power” (22). These translations
    emphasize the poet’s belief that education and solidarity are necessary tools
    for society to heal from social injustices and to bring forward “peace” (19).


    In the theme of healing, Galván Rodríguez acknowledges the continued efforts of
    the poet-activists who “dedicate [...] poems for ‘peace’ (19) to those “muted
    voices” (17) who experience discrimination based on their spoken language. The
    poet indicates the writers in these online communities turn pain into art, “sweet
    medicine to heal” (23), with the hope of letting those victimized immigrants in
    their border communities know they are not alone. Researcher Nancy Naples asserts
    that woman activists are “especially skilled in building bridges across different
    issues, diverse communities, and varied political perspectives.”⁶⁸ Contemporary
    Chicana poet-activists align with this assertion that use art to build bridges
    between groups of individuals who join these online communities. This aspect of
    bridge-building correlates with Anzalúa’s explanation that Chicanas’ role is “to
    link people with others [...] It is to transfer ideas and information from one
    culture to another.”⁶⁹ Galván’s poetry and activism validates how Chicanas are
    extending the consciousness of political action into the twenty-first-century
    context by creating digital communities of resistance.


    To build bridges despite lack of unanimity, Galván Rodríguez challenges those
    in the dominant culture to join Chican “in solidarity” (14) against social injustices.
    Galván Rodríguez writes, “who then / will speak for us / when others turn away
    / who joins solidarity / speaks up” (11—15). The rhetorical questions in this
    stanza force readers, particularly in the dominant culture, to reflect on their
    own conscious or unbiased biases that led many to “turn away” (13) from helping
    others. This direct confrontation of those who turn a blind eye parallels the
    corruption of those who “speaks lies” (8) referenced in the second stanza. Alarcón
    and Galván Rodríguez further enumerate the importance of solidarity, declaring
    “Poets Responding” are united by a community “to express solidarity” and to “advocate
    civil and human rights for all.”⁷⁰ Galván Rodríguez’s poem, therefore, aligns
    with the “Poets Responding” mission as she urges readers to help stop the lies,
