    tasks, repeated mechanically, leading to minor exhaustion (an exhaustion shared
    by the viewer, as the student asked, “is she trying to kill us with boredom?”).


    I would like to argue that Almada''s leisurely exploration of these real and fictional
    lives have a different rhythm than watching a Norwegian woman knit—in this, I
    agree with Fornoff that Almada''s characters slowly embody, equally empty out
    stereotypes: about men in dead-end jobs, about cats and bureaucrats, about women
    in general. This slow accumulation of meaning around characters is for me precisely
    what differentiates Almada''s work from the Norwegian kroner, or the migrating
    reindeer for that, where we would find any minor deviation from impenetrable placidity
    terribly shocking. The unfolding of character is one of the qualities that distinguishes
    Almada''s cinematic work.


    I also want to argue that my student''s perception—dying of boredom—is a stronger
    and more accurate response to Almada''s work than the aesthetic / philosophical
    affect associated with contemplation that is the typical goal of cinema. In both
    of the recent films I''ve alluded to, Almada specifically addresses the violence
    in contemporary Mexico by pushing the tedium of the ordinary to the foreground,
    where inescapability does not lead to transcendence for her focal characters and
    for us, the viewing public, but rather to something akin to what Sian Ngai calls
    “stuplidity”, an affect holding in tension the astonishing and the boring. For
    Ngai, it is the tension between two incompatible aesthetic responses: the sublime
    and the stupid (or banal) that characterizes this affect, and makes it particularly
    modern. I love this quote from Ngai since practically every word begs for closer
    attention:


    The becoming ordinary of the experience of feeling overwhelmed condensed in the
    paradoxical structure of feeling I call stupidity, in which we find the sublime
    feeling of awe almost coupled to the feeling of boredom or exhaustion. Stupidity
    thus offers an exaggerated version of the affective incongruity at the heart of
    capitalist sublime, while at the same time gesturing at its normalization or banality.
    It is somehow an intensification and domestication of it at once.


