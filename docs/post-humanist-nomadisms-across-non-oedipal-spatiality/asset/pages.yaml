  md: 'Because the interplay between art and activism within digital spaces increases
    the accessibility and the reach of their message, the work of these poet-activists
    has a tangible impact on promoting public policy changes. Specifically, the artist-activists
    of these communities showcase Castells believes is the powerful contribution of
    online social movements—to propagate “purpose collective actions aimed at changing
    the values and ethics institutionalized in society.”71 An example of this collective
    action appears in the comments of the “Poem 25 – Giving Voice” post. Many commenters
    of the poem acclaim Galván Rodríguez for her truthful and inspirational rhetoric.
    Her poem has spurred others to join the conversation about political injustices,
    particularly within the U.S. government. One commenter wrote,


    I believe your poem has a great message that most people in this country must
    listen to and consider. There is a great justice when our leaders, our civil,
    elected representatives lie to. Yet, there is a great injustice being done if
    people who have the power to “vote” don’t do anything to hold these representatives
    accountable for their lies. Thanks for sharing this inspiring and well-crafted
    poem.72


    This comment reveals how members of “Poets Responding” engage with the poetry,
    have a voice in the community, and take an active role furthering political change.
    Kavada explains social media community building among members are active contributors
    to the conversations and posts, as opposed to more consumers of content.73Through
    these “spaces of interaction,”74 the “Poets Responding” community of moderators,
    writers, and commenters publicly demonstrate their collective actions toward change
    through political conversation.


    By speaking up and challenging the dominant culture to join “in solidarity” (14),
    Galván Rodríguez writes to reiterate a new reality in which Chicanas “demand”
    (24) that “justice” (25) is heard. The first step in this demand, according to
    the poem, is to “unearth/muted voices” (16—17). The word choice of “unearth” depicts
