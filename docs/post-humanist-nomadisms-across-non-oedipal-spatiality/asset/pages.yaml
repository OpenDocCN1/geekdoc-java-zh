  md: '# Chicana Poetry and activism via digital communities


    Chicanas have experienced the constant threat of their language and history being
    erased. To overcome this silencing, Galván Rodríguez urges all who care about
    human rights take a stand and "speak out - / loud about injustice" (2—3). The
    embayment between lines 2 and 3 strengthens the poet’s message. The inserted pause
    between "out -" and "loud" emphasizes the need for all to just speak out, but
    to speak loudly and publicly so that their voices are heard. Compounding Galván
    Rodríguez’s encouragement for public protest, the lack of punctuation throughout
    the poem evokes a sense of urgency that the time to act is now.


    As of this urgency to speak out, Galván Rodríguez underscores the importance of
    education to increase awareness about the harsh reality of life at the border.
    Galván Rodríguez writes, "teach them new songs to sing" (18), with "them" broadly
    encompassing Chicanas, those in the U.S. culture, and all minorities who felt
    oppressed. The poem reflects Galván Rodríguez’s view that education is a tool
    for social justice. Specifically, the poet educates readers about injustices by
    calling attention to "muted voices" (17) and inspires activism by creating solidarity.
    Galván Rodríguez’s mestiza consciousness poetry thus strives to dismantle the
    larger social structures that strip Chicanas of their voices. For example, Galván
    Rodríguez’s question, "when others away / who joins in solidarity," challenges
    the reader to determine what kind of person they want to be—who ignores or who
    takes action?


    The theme of education in the final stanzas also encompasses the role of art to
    liberate "muted voices" for those who "live silently in fear" (9). From the creation
    of "new songs" (18), Galván Rodríguez informs that "peace - / flowers" (19—20)
    will follow. Because flowers are a symbol of growth and vitality and are forms
    of cultural expression, these concepts—flower y canto—have what the poet sees
    as the "poder - [power]" (22) to inspire the construction of a new, inclusive
    world for Chicanas.


    The Aztec aegories of flor y canto represents both a rejection of colonial ideologies
    that question Chicanxs’ belonging and how art can call the broader history of
    oppression against the U.S.-Mexico border. Galván Rodríguez concludes that education
    through art provides the means to heal the wounds of injury, both for Chicanas
    and for U.S. society as a whole. Galván Rodríguez’s “Poem 25 – Giving Voice” exhibits
    how Chicanas are healing Anzaldúa’s original conception of the borderland as an
