    Like Weissberg, numerous other reviewers have complained that this film is overintellectualized.
    “How do we make films about violence?” Almada asks. “This is a question at the
    root of all the films that I have made and one that I have grappled with not only
    formally, but morally and ethically.”¹⁸ In practically every interview she has
    given, as well as in the press kit for the film, Almada cites major film precursors
    like Susan Sortang, Hannah Ararat, and Simone de Beauvoir being presences in the
    film, helping her to think about how to understand the slow violence of bureaucracy,
    how to think and understand violence in a country so wounded and marked by violent
    death, how to responsibly evoke violence in a filmic context. In Almada’s, the
    choice has always been made to films about violence without overt violence, to
    turn away from the sublime and focus her lens on the secondary consequences of
    violence made banal, stupepeifying.


