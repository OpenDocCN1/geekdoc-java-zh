    Researchers of social networking sites confirm the unique potential of online
    communities to advance local, on-the-ground resistance efforts.³32 According to
    Manuel Castells, a researcher in the field of digital communication, the Internet
    provides the essential platform for debate [...] and ultimately serves as their
    most potent weapon.³33 Referring to new social movements, Castells argues digital
    communication through online platforms builds networks of social actors and increases
    the frequency of interaction compared to traditional forms of social organizing.34
    Still, such efforts are rooted in the local. “Poets Responding” provides a prime
    example of how local efforts have traversed to digital spaces. Initially formed
    in reaction to the nine Latino university students who protested SB 170, the Facebook
    page was an extension of ground-level political demonstrations.³35 The following
    year, the “Poets Responding” community organized a symbolic Floricanto rally that
    included a poetry reading and a press conference at the U.S. Capitol.³36 This
    event gathered writers attending the 2011 AWP Conference & Bookfair in Washington,
    DC.³37 The assembly brought attention to immigration and civil rights review by
    Congress and state governments. These demonstrations evidence an online-street
    connection between virtual and material forms of protest. The momentum generated
    by these acts of organized civil protest, coupled with the online activism of
    the “Poets Responding” community, did lead to significant changes to the initial
    bill.


