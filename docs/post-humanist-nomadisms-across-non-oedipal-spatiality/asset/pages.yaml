    # II


    When I arrived in Paris (in 1969) to work on my doctorat d''état, I had a better
    grasp of what it might have meant to my grandparents to move to Argentina in adverse
    conditions, belonging to generations at the end of the nineteenth century when
    thousands of Italian migrants from Buenos Aires to New York. Now I was moving
    in the reverse direction, from the West (Indian Occidentales) to the East (Europe),
    but with the support of a fellowship granted by the University of Córdoba, Argentina.


    When I migrated to the US in 1973, the feeling of being a foreigner had already
    settled. No complaints, no nostalgia. It was what I was. I accepted and lived
    it. That lived experience took me where I am today, thinking the way I do and
    saying the things I say. Disciplines are. They are just tools. I do not follow
    disciplinary regulations, although I have an academic title. I first studied philosophy
    and literature and I then got a PhD in semiology. In another day of the journey
    (metaphorically, it has not been in one particular day and month year), salvation
    from an encounter with the LatinX population in the US (at time referred generally
    as Hispanics, Chicanos and Latinos, no ''a'' or ''X'' was used at that time).
    A ''eureka'' feeling and salvation came when I read Gloria Andalusia''s Borderland/La
    Frontera: The New Mestiza (1987). I understood what being Italo/Argentian meant,
    although the particular meaning of being a heterosexual Italo/Argentine meant
    quite different from that of being a homosexual Mexican/American female. Experience
    border (a key concept in Local Histories/Global Designs. Literacy, Territoriality
    and Border Thinking, 2000). Nevertheless, I understood that there was something
    deeper, deeper logic to come differences that are culturally perceived at the
    surface. Superficial differences, hide the deeper logic: the colonial difference.


    But let''s go back to Andalucía. The Dark Side of the Renaissance: Literacy, Territoriality
    and Colonization (1995) came from the gift that Andalucía''s book was offered.
    The book is an autobiographical journey to account for the immigrant consciousness
    that was growing in me, and myself with it. It making sense of the Italian Renaissance,
    the Italian migrants moving to Argentina, and the history of Spanish colonization
    of the Americas. Andalucía''s local history (personal and geo-political) had to
    do with the history of Mexico in colonial history, first in the hands of Spaniards,
    and later in the hands of the US. The Mexican-American war of 1848 allowed us
    to move the ''border'' south'
