  md: '# Chapter 8


    # The remnant of the journey’s anguish:

    homelessness and errantry

    in in the poetry of Nasir Kazmi


    Hamza Iqbal


    University of Texas at Austin


    Abstract


    Nasir Kazmi (1925-1972) remains one of the most celebrated Urdu poets of the ghazal
    genre from the previous century. In his brief life of forty-six years, he wrote
    enough poetry. He produced a formidable kuliyāt (collection), which sufficed to
    situate his place in the Urdu poetic tradition and allowed him to be amongst the
    most canonical of the ghazal poets of Urdu. The present article shall locate and
    then analyze “homelessness”—as “errantry”—as Harney and Motenn have discussed
    it in The Undercoms—and Glissant articulates it in Poetics of Relation—in ghazals
    of Nasir Kazmi. The related concept of hijrat (exile) will also be touched upon
    as these themes feature rather prominently in Nasir’s works (as we shall see).
    To achieve the aforementioned aims, however, this article, for methodological
    purposes, shall take the Fanonian approach of being “derelict” from “its methodological
    point of view.” As Fanon in Black Skin White Masks says of such formal requirements,
    “I leave methods to the botanists and the mathematicians. There is a point at
    which methods devour themselves.”¹ Therefore, for us not to be devoured by them,
    we leave methods aside—if only momentarily—and instead begin with introducing
    here the ideas or mazāmin (topoi) of homelessness and errantry before we turn
    to our poet.


    **Keywords:** Exile, errantry, homelessness, Urdu poetry, topics


    > ¹. Frantz Fanon, Black Skin White Masks (New York: Grove Press, 2008), 5.'
