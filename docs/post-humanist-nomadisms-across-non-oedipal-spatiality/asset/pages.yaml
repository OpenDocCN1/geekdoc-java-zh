    Unless one addresses this normalization, one cannot adequately account for how
    caste, class, regional or linguistic discrimination within mainstream Bengal.
    Thus, Bengali migrants from neighboring Bangladesh, who live in small towns and
    villages within Bengal, and itinerant communities from other Indian states are
    either treated as static stereotypes or occluded within mainstream Bengali representations
    and representations of Bengal within India.


    The Sundban area, because of its proximity to Kolkata and location in Bengal,
    is presumed to be a familiar, accessible space for the bhadrolok. The communities
    living in the Sundarbans speak various dialects of Bengali, prepare and consume
    similar food, worship gods who are familiar to not worshipped by the bhadrolok.
    There are certainly points of cultural difference: the label of being folk, the
    lack of civic amenities and infrastructure, and the economic, cultural, and social
    capital normalized by the bhadrolok, the presence of migrant and refugee communities.
    However, these distinctions are usually read in the mainstream imaginary as points
    of inferiority, as the difficult terrain and the necessary habitation with the
    wilderness hierarchical differences make the Sundarbans a liminal space from the
    perspective of the bhadrolok, insofar as it is Bengal but not so quite. the story
    at hand takes matters further, progressing from a liminal to a non-Oedipal space.


    Non-Oedipal spatialities create in their wake an anxiety of ownership that may
    be articulated in terms of territorial boundaries, access to resources, right
    to call a place home, or inferior or superior to one''s milieu, but mostly, overwhelmingly,
    in terms of the overarching sense of belonging, identity and identifying practices.
    The systems of knowledge that legitimize grand narratives around identity projects
    extend themselves to these anxieties around space. For instance, Kolkata''s prestige
    as the commonly lauded cultural capital of India is deeply intertwined with how
    the Bengali Bhadrolok identity project assumes high cultural associations and
    identifies Kolkata as their ideal “habitus,” a set of embodied predispositions
    that influence an individual or community’s ways of perceiving their lived environment
    and responding to it.


