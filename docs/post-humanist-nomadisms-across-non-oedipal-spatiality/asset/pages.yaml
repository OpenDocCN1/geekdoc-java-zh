    this struggle over language, stating “language, then, is the necessary terrain
    on which Latino value and attempt to reshape the institutions through which it
    is distributed.”⁶⁴ Galván Rodríguez’s image of “slashed tongues” bears a graphic
    wake-up-call for that Chicanas—and by extension all traditionally marginalized
    groups—need to take back their voices and assert their right to appear in the
    public sphere. Through a bilingual affiliation, Latinx and Chicanx communities
    continue to create a space of appearance. Butler confirms these collective actions,
    which occur in both private and public spheres, represent “a bodily demand” for
    equality.⁶⁵ The Internet represents an advantageous medium for public dissent
    because of its ease of use, low cost, instant communication, and accessibility
    from the private sphere.⁶⁶This increased opportunity for political action, however,
    remains open to similar threats of violence that occur at the material geopolitical
