    Chapter 6


    How space can be Oedipal or its opposite? There are two ways of imagining a response:
    First, space, especially land or territory, has been frequently anthropomorphized
    like nature, most commonly as a goddess and/or a mother figure.1 So, one way in
    which space can be Oedipal in terms of the patriarchal trope that imagines men
    as agents of civilization we harvest and land (and other natural elements) fecund
    and reproductive: men across generations may harvest—or otherwise use—the same
    tract of land, and call it by the name of a mother, thus making the relationship
    Oedipal.2 The other way of trying to explore this notion links space to the notion
    of anxiety. The word Oedipal is overwhelmingly coined as a crisis, after all.
    It refers to either the anxiety of being taboo unknownly, or perhaps more devastatingly,
    the awareness of something familiar being also a taboo, and being incapable of
    resisting it, nevertheless. Either way, the common denominator of both explanations
    is the figure of an agent man (whether as an act of omission or generalization)
    Spaces are cultural concepts, and not purely physical, literal ones. They are
    imagined and represented within the cultural frameworks of meaning-making. Symbolic
    values can alter the way they are perceived. They can affect cultural constructs
    as any other entity. Postmodern geographer and urban theorist Edward Soja argues
    that an understanding of space is essential to the understanding of society spaces
    are socially constructed and intertwined with social relations over time.3


    As one sees, therefore the word bhadhalok is bonded within Indian postcolonial
    academia. Across the extraordinary moments of mainstream history writing, the
    Bengali bhadhalok has been discussed at length because Kolkata, then Calcutta,
    was the center of colonial trade and administration. The peculiarity of the bhadhalok
    identity lies in its overwhelming emphasis on the code of conduct that is as ambiguous
    as it is invasive, blurring and overshadowing all other quantifiable parameters
    like class, caste, religion, language, and gender.


    The word bhadhalok is gender-inflected, and by default, masculine. It relates
    to fluency in a certain dialect of (Calcutta) Bengali, and to habitation and education
    in or around, or oriented towards Kolkata. It is common enough to say, “Speak
    or act like a bhadhalok!” the moment a conversation turns heated, assuming that
    it is the only’proper’ way to behave.


    > 1. David Leeming and Christopher Fee, The Goddess: Myths of the Great Mother
    (Islington: Reaktion Books, 2016), 48.


    > 2. Knut A. Jacobsen, Encyclopedia of Religion and Nature (New York: Bloomsbury
    Academic, 2008), 1299-1300.


    > 3. Edward W Soja, Thirdspace (Malden: Blackwell, 1996), 57.'
