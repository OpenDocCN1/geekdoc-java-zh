    exhorts us to explore this “an ethical position.”It is crucial to look for alternatives
    to our obsolete and fixed notions of Self and the Other, which would counter not
    only dangerous, exclusionary forms of nationalism but also present new ways of
    relating to ourselves and around us.


    The experience of exile, and to some extent that of diaspora, is a process that
    marks an unsettling of one’s ideas of a fixed self. It is accompanied by an epistemological
    shift in the understanding of the self, along with the transit of the body in
    space. One finds himself having in an unfamiliar place, with the mind still clinging
    to one that has been left behind. Personal or collective memory, or “Postmemory,”
    replaces the physical markers of one’s identity in space and time. Marianne Hirsch
    uses this term to describe the memories passed down to second-generation exiled
    by their elders, as the cultural realm becomes the foundation of identity formation
    in a foreign space.The faculty of memory exhibits volatility, uncertainty, and
    loss. Thus, the exiled self remains in the process of becoming, and never entirely
    ‘becomes,’ inhabiting what Edward said “a median state,”instead of one or the
    other identity. This process can be unsettling, devastating yet empowering. While
    one constantly feels torn between different time-spaces and a multiplicity of
    fluid identities, it provides one with the vantage point of looking at situations
    from the perspective of “politics of identification (that sees identity as always
    already a political process) [...] and thus foregrounds agency.”¹11


    As one starts to continually feel a sense of being ill at ease vis-à-vis one’s
    surroundings, this difference between a complex imagined self and the unknown
    foreign reveals many layers of a diasporic identity so that one consciously aware
