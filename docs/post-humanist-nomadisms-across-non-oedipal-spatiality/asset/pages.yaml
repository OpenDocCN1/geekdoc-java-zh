    Chapter 6


    “Atapurer Bagh,” while published in a children’s anthology of ghost stories, and
    certainly qualifying for inclusion, does not devote much narrative space to either
    the ghost or the jump-scare—the two usual ways in which stories of this sort operate.
    Instead, this story devotes only a fifth of its narrative length to what is supposed
    to be the climactic curve: the encounter with not just a spirit, but also a tiger,
    two elements of preternatural and supernatural terror that might be expected to
    interest young readers. One may speculate that what makes it a scary and uneasy
    experience for Radharamon, and therefore a scary and uneasy horror story for the
    intended reader is its play with the uncanny. Freud speaks of the uncanny as the
    psychological experience, not of the absolutely mysterious, but instead of the
    strangely familiar.22The Sundarbans, while a part of Bengal has to emerge as a
    site of exception, irrefutably contradicting the bhadralok Identity Project, even
    as a bhadralok ventures into and finds familiar enough to reinforce the assumptions
    of the identity project. In this way, for Radharamon, and in this case, only Radharamon,
    the Sundarbans becomes a non-opedal scale.


    # IV


    Precarious spaces like the Sundarbans make for a curious site of inquiry because
    they are neither entirely outside the imagined habit of the Bengali bhadralok
    nor can be entirely reconciled to them. If one locates identities in terms of
    their identity projects—an imagined grand narrative of the past, present, and
    hoped for future—examining the way the Sundarbans continues to be a liminal presence
    within the bhadralok identity project itself can act as an act of intervention.
    Located on the fringes of India and Bangladesh, the deltaic Sundarbans have survived
    as an endangered ecosystem with its rich flora, fauna amidst the natural disasters
    besetting it, most recently the super-cycle Amphan in May 2020. The space has
    provided refuge to innumerable disenfranchised migrant communities seeking political
    asylum and escaping natural disasters after the borders. Civic, state-sanctioned
    neglect and acts of police brutality are normalized within a larger framework
    of alienation and occlusion of the people of Sundarbans as not quite citizen-subjects,
    but not entirely out of the domain of the imagined community of the state and
    its mainstream stakeholders.


