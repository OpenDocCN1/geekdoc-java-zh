  md: 'Chicana Poetry and activism via digital communities


    In the late 1980s, Chicana leader and theorist Gloria Anzaldúa further this emerging
    identity by conceptualizing the mestiza consciousness in her foundational text,
    Borderlands/La Frontera: The New Mestiza. Specifically, Anzaldúa voice to the
    gendered realities of mixed-race and queer women living in the borderland.^19
    According to Anzaldúa, borders extend beyond the geographic to encompass the inner,
    borders or restrictions that repress Chicana into feeling split between two, or
    more, cultures and value systems.^20 For Chicanas, overcoming this struggle results
    in a identity that is malleable, and therefore, resistant to oppositions that
    attempt to restrict their ethnicity or gender. Confirming the mestiza consciousness
    as a consciousness of political action, Anzaldúa proposed a vision for Chicanas
    not to react, but to act against the social injustices that continue to plague
    the communities.^21 What remains less-known in the literature, however, is how
    Chicanas utilize the mestiza consciousness and take action now, in the twenty-first
    century.


    # The dedication to digital communities


    Galván Rodríguez’s “Poem 25 – Giving Voice” evidences a clear response to this
    poem on Anzaldúa’s call for action. In 2011, Galván Rodríguez published this poem
    on the “Poets Responding” community Facebook page to recognize the powerful contributions
    of the poet-activists protesting an anti-immigration law SB 1070. Galván Rodríguez
    begins the poem with an epigraph. The poem purposefully dedicates her poem to
    the poets and activists involved with two specific digital languages: Latin and
    Chicano literary blog, La Bloga, and the “Poets Responding” Facebook page. These
    communities endorse and publicize poetry and news updates in response to human
    rights violations that occur domestically (the United States) and throughout the
    world.^22 Considered the world’s oldest Chicanx and Latin literary blog.^23 La
    Bloga partners by “Poets Responding” by publishing selected poems from “Poets
    Responding” in a monthly “Online Floricanto”^24 on La Bloga. Because of La Bloga’s
    prominence as a literary blog, this partnership strengthens the “Poets Responding.”^25


