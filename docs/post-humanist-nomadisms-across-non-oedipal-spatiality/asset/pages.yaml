  md: '# # Chapter 11


    # # Killing time: Boredom and violence in Natalia Almada’s cinema¹


    Debra A. Castillo


    Cornell University


    # Abstract


    A signature element of slow cinema is time-stretched through uneventful and trivial
    longshots—beautiful shots, excruciating long takes of nothing much happening during
    long train or boat trips, or people doing repetitive tasks like knitting or peeling
    potatoes. The article contends with the view that slow cinema allows the contemplation
    of beautiful shots to enable viewers to indulge some aesthetic pleasure. It argues,
    instead, the slow cinema of Natalia Almada purposefully takes us back to the violence
    of a killing time for boredom. It deals with two texts of the Mexican-American
    filmmaker: a documentary *El velador* (2011) and a film *Todo lo demás* (2017).
    Agreeing with the critical position that Almada’s characters slowly embody, then
    equally empty out stereotypes: about men in dead-end jobs, about cat ladies and
    bureaucrats, about women in general, the paper argues that this slow accumulation
    of meaning around characters is what differentiates Almada’s work from other works
    in the slow cinema genre, where we would find any minor deviation from impenetrable
    placidity terribly shocking.


    **Keywords:** Mexican-American, feminist cinema, slow cinema, affect


    > It’s so boring!” complained one of the spectators at the screening.—Why did
    she make the film so boring? Is she trying to kill us with boredom?” I had been
    invited by the organizers of the Spring 2018 Fingerflakes Environmental Film Festival
    to facilitate a discussion on Natalia Almada’s recent feature film, *Todo lo demás*.
    The complaint was received with some nodding heads among other


    ¹ This short study was conceived as a talk and was presented at the Mexican Literature
    and Film across Borders conference in Boston, Massachusetts, USA, October 2018.'
