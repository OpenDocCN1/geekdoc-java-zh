    # Always explorers, never refugees:

    Adventure and manifest destiny

    amongst the stars


    Leigh E. McKagen

    Virginia Tech; Virginia Military Institute


    # Abstract


    This article explores the adventure narrative of Star Trek: Voyager (1995-2001)
    alongside historical practices of the Euro-American empire to argue that the adventure
    narrative of Voyager enables the continuation of Federation/Starfleet imperial
    directives and practices throughout the Delta Quadrant. I begin this analysis
    by exploring how Voyager functions as an adventure narrative in ways that normalizes
    and legitimizes Euro-American imperial ideologies. In particular, I highlight
    the threads of manifest destiny easily retained in the Voyager narrative, following
    the American imperial ideology that enabled expansion throughout the continent''
    right to explore and expand—in the nineteenth century. Manifest destiny—a belief
    in the ''Providence granted''—functions in Voyager to create and maintain a binary
    between the Federation explorer/castaway/adventurers and ''everyone else'' in
    the Delta Quadrant. This binary presumes the superiority of Western civilizations,
    including the belief that Westerners will never be refugees. These practices of
    storytelling matter, since through this presentation of the crew as always travelers
    and never migrants or refugees, Voyager ultimately projects American post-Cold
    War Empire and imperial politics and culture into the far reaches of outer space
    as a possible future.


    **Keywords:** Adventure narratives, manifest destiny, Star Trek: Voyager, imperial
    binaries, mapping


