  md: '# Chapter 7


    # Postcolonial “Geography Lessons"

    from Sri Lanka: Travel, globalization,

    and diaspora


    Shelby E. Ward

    Virginia Tech; Tusculum University


    # Abstract


    Following the work of scholars like Debbie Lisle that is critical of the sustained
    coloniality of travel narratives and the resulting implications on global politics,
    this article offers a close reading of selected verses of two Sri Lanka poets:
    Jean Arasanayagam and Ramya Chamalie Jirasinghe. Both women are conscious of the
    interconnections between globalization, colonialism, and international travel.
    Therefore, their work provides the transformative potential of travel writing.1
    This transformative potential is revealed by reading these poems through Gilles
    Deleuze and Félix Guattari’s conceptualization of “mapping” versus “tracing.”
    While traditional narratives can be described as “traces,” or reproductions of
    Empire and post colonial legacies, Arasanayagam and Jirasinghe provide a map that
    connects nomadically through systems such as colonialism and globalization as
    they travel and write back to geographies of the West in processes of becoming.
    The article suggests that such a map provides post geography lessons eliminate
    that primary elements: the relationship between self/identity and home/displacement.
    These geography lessons offer a way to explore rather than mask the anxieties
    of globalization and colonialism. The article further argues these writers provide
    a methodology for addressing the heonic power relations that have historically
    constituted the political practice of both writing and mapping as a western discursive
    project that continues to manage the world.


    > 1 Debbie Lisle, The Global Politics of Contemporary Travel Writing (Cambridge
    University Press, 2006).


    > Jean Arasanayagam, The Almsgiving (Colombo: Social Scientists’ Association,
    2014).

    Ramya Chamalie Jirasinghe, There’s an Island in the Bone (Battaramulla: Yara Press,
    2010).'
