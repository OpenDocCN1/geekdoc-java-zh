    the dilution of British culture. They contributed to a domesticated India through
    "Anglocentric virtues..." [and] the manual didactic regimes, in order to raise
    up the peoples of the Empire through domestic reform.23 "Dirt, disorder, and different
    cultural practices" are the opposite of Victorian principles of domestication
    that Steel and Gardiner outline for memsahibs to follow.24 The repetitive, if
