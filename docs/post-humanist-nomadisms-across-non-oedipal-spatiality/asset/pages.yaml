    Chapter 14


    The concept of floricante—a term laden with historical significance—also reinforces
    the collaborative political and literary efforts between these two communities.
    Denotatively, the Spanish combination of flor y canto translates to flower and
    song. Etymologically, flor y canto refers to the Nahuatl, or Aztec, word xochicuatl,
    which is the phrase for poetry.^26 La Bloga’s “On-Line Floricante” was inspired
    by a three-day, in-person reunion floricante organized by Michael Sedano at the
    University of Southern California in Fall 2010.^27 This meeting reunited artists
    from the original 1973 Festival de Flor y Canto at the same university. The original
    Flor y Canto celebrated emerging Chicanx artists and writers, including Alarcón.^28
    Because the in-person Canto of 1973 and 2010 relied on a material space, attendees
    were limited to those in geographic proximity to Southern California or with the
    means to travel. Sedano adds that because both were live events, only “a tiny
    representation of artists were invited to read.” In contrast, the online Floricantes
    occupy a digital space that is accessible to anyone, anywhere, with Internet access.
    The updated one-word spelling of floricante, with “i” replacing the “y,” reflects
    the increased inclusivity of access afforded by digital spaces. Regardless of
    physical or virtual location, these floricantes reveal Chicanxs’ collective actions
    to create a space of appearance. In 2016, Alarcón and Galván Rodríguez acknowledged
    the need to anthologize the collection of these poems as a poetic historical record
    and published the edited volume, Poetry of Resistance: Voices for Social Justice.^29


    Similar to Alarust adopting the myth of Aztlan for unifying Chicanxs, Galván Rodríguez
    interprets the importance of an Aztec aesthetic to fuel resistance efforts and
    to reclaim an identity of belonging in the United States. Reviving the concept
    of flor y canto, the poet-activists in these online communities are practicing
    with Walter Mignolo and Rolando Vazquez as “decolonial aesthetics.^30 This term
    encompasses healing colonial wounds by unveiling nonwestern aesthetic practices,
    such as flor y canto, to “that have been written out of the canon of modern aesthetics.”31
    In “Poem 25 – Giving Voice,” Galván Rodríguez connotatively defines flor y canto
    as “poems for


