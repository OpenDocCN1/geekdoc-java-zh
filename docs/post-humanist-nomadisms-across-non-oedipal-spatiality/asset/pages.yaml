  md: '# Chicana Poetry and activism via digital communities


    community work to fight against this form of racial profiling, founded on

    questioning one''s belonging.


    When initially creating the page, Alarcón appointed a team of poets and

    activists, including Galván Rodríguez, to help moderate posts.7 In June 2020,

    the administrative team changed the moderator information to anonymous.8

    The page is a public community, and any Facebook user can “like” the page to

    follow and comment on its posts; however, only moderators can create content,

    remove threatening comments, or block users from the page.9 Because of the

    public nature of this virtual space, members face the risk of hate trolls

    responding with the language of violence or reporting suspected noncitizens

    to U.S. Immigration and Customs Enforcement. The updated anonymity of the

    moderators reduces the potential threats associated with responding to hate

    trolls. These threats indicate the community’s overlap with the material

    geopolitical borderland.


    Despite these risks, the poet-activists continue to fight, like responders to

    crisis, by sharing their poetry of resistance. As a co-moderator and poet of “Poets

    Responding.” Galván Rodríguez’s actions with Anzalúa defines the definition of

    mestiza consciousness.10 Galván Rodríguez argues for solidarity and education

    through art as solutions to combat human rights violations. Her mestiza

    consciousness poetry advocates building an online community of individuals

    united in confronting offline injustices. These online communities, then,

    ncome a new and inclusive digital Main Street for those living across the border

    to recover their voices and exert their political will.


    # Community building as resistance


    Borders, as an ideological and a geographic concept, represent sites of

    collision and conflict between two or more terrains, identities, and languages.11

    The U.S.-Mexico border proves no exception, as this man-made division

    remains one of the foremost locations of political violence and resistance


