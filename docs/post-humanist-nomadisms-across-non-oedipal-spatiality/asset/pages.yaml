  md: '# Chapter 2


    # The little grain that could:


    # Nomadic incursions of amaranth


    # in hegemonic territories


    Java Singh


    Doon University, India


    # Abstract


    Amaranth is a protagonist in major religious rituals of the Nahua people of central
    Mexico, and miniature figurines of deities made from amaranth paste were sacred
    offerings during festivals. As a part of the ceremonies, worshipers broke and
    ate the statuettes. The colonizers banned amaranth cultivation because Christian
    priests thought that the act of symbolic theology mimicked the Nahua tradition
    of communion. They burnt amaranth fields and punished cultivators. Maize did not
    suffer the same fate despite the divine source of all human life in myths of creation
    in Mesoamerican mythology, because it was already a staple of the colonial diet
    by the time the empire expandedであった towards amaranth growing regions. Maize flourished
    under colonial rule and continues to carry the banner of decoloniality in present-day
    Mexico, where chefs, farmers, activists, and government agencies are pushing for
    an expansion of amaranth cultivation. In parallel, the nutrition industry, agricultural
    research establishments, philanthropists, and multilateral development apparatus
    in the Global North project amaranth as a miracle fruit. This article visualizes
    elements of nomadic transgression in amaranth''s survival in the face of both
    destructive violence of colonization and mercantile violence/modernity. It reads
    the nomadic incursions of amaranth from several perspectives, including Walter
    Mignolo’s “reconstruction,” Rosi Braidotti’s “bio-centered egalitarianism,” Nahua
    philosophy’s “teot” and “netilitilli” and some semiotic mutations in literary
    representations. Through these, this article presents how amaranth has crossed
    many borders of sacred-profane, ideological-commercial, cultural-scientific, and
    personal-political.


    **Keywords:** Reconstitution, Mesoamerican philosophy, modernity, bioethics, bio-centered
    egalitarianism'
