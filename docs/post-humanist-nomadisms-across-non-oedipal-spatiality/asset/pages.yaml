    The first is Jean Arasanayagam, who is best known for her poetry investigating
    politics within Sri Lanka, which often includes personal reflections on her own
    identity or the relationship with her husband''s family, who is Tamil. Arguably
    her most well-known collection of poems is Apocalypse83, which follows the story
    of the ethnic civil war in Sri Lanka and her family''s forced displacement in
