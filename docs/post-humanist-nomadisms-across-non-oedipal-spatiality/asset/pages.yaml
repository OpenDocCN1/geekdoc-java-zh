  md: '# # Chapter 3

    # The Serengeti-Mara ecosystem:

    # Interactions between human

    # and non-human species


    Olivia A. Kurajian

    Michigan State University


    # ## Abstract


    Lions, wildebeest, hyenas, and giraffes dominate the imagination when one thinks
    of African savannas. The Serengeti-Mara is an ecosystem that is poorly understood
    by many despite being one of the most studied ecosystems in the world. The region
    comprising today''s artificially constructed bordered countries of Tanzania and
    Kenya is home to millions of animals and humans. Although this ecosystem is referred
    to as the Serengeti in Tanzania and the Mara in Kenya, the Serengeti-Mara is an
    interconnected system. Its health and sustainability rely on the interactions
    between human and non-human species of animals and fauna. Since the world has
    lost one-fourth of all large grazers in the last couple of centuries, preservation
    of the migration of wildebeest, zebras, gazelles, and other species is absolutely
    essential to maintaining the rich diversity of this vast ecosystem. One method
    of preservation, pastoralism, is a vital example of savanna wildlife-human interaction.
    While as a backward, uncivilized, or primitive when seen from the Western, colonial
    lens, pastoralism has served human and non-human species in a variety of ways.
    The complexity and history of the Serengeti-Mara are laced with environmental
    narratives, numerous conservation efforts, and Indigenous resistance and agency
    facing colonial land displacement and climatic changes. This paper discusses how
    the survival and sustainability of pastoralism in the Serengeti-Mara are challenged
    by competing colonial powers, inequalities in power, environmental destruction,
    and both human actions and inaction.


    **Keywords:** Pastoralism, Serengeti-Mara, ecosystem, sustainability, Indigenous
    studies, colonialism.'
