  md: '# Becoming a phantom people


    Despite a thriving print industry in Kolkata, there are more publications about
    the ecology of the Sundarbans in English rather than Bengali commentaries on the
    social ecologies of its people and their lived environments. Bengali mainstream
    representations of the Sundarbans in fiction, whether in English or Bengali, tend
    to be penned about the Sundarbans rather than emerging from it. While Bengali
    is a shared language, and cultural ethics have distinct overlaps, own-voices local
    narratives are rarely published and even more rarely publicized. The Sundarbans
    presents itself as something of an anomaly in the narratives of the Bengali bhadralok
    identity project with caste, class, and city-centric affiliations, because of
    its perceived violence, suspension of religion-caste sanctions, or deep impoverishment.
    Atin Bandopadhyay’s account of this everyday marginalization escapes the established
    mainstream discourses and exoticizing the Sundarbans, by virtue of its inclusion
    in a ghost story aimed at “children”. Supernatural fiction and fiction for children,
    while policed for “immoral” elements, also allowed a certain disruption of the
    status quo, even without a subsequent substantial, a return to normalcy. It is
    not intended to be an adult, formal treatise, or an account, or conclusion can
    be sidestepped, bringing to the fore only the opacity that Radharamon experiences.
    This is what Bandopadhyay makes the most of making the Sundarbans a setting for
    a ghost story for children and adolescents. It escapes mainstream expectations
    of a distinct resolution or conclusion expected from an adult, formal treatise,
    or auto/biographical account. It shifts the focus to the bigger cultural institution
    of otherization-occlusion that plays out in everyday polyramatics by foregrounding
    the different subject positions occupied by Radharamon, his family, and Bagharu’s
    Mother and her, without polarising them to the point of incomprehension.


    In doing this, this story becomes pivotal in its treatment of knowledge systems,
    and a niggling awareness of how reality would reduce to call Radharamon Modern.
    At the same time, Bagharu’s Mother is dubbed superstitious and backward, and how
    easily it would deprive her of its agency. It is also fascinating to note the
    treatment of truth and truth-effects, information, and facticity in the story.
    It brings the question of how one may engage with the notions of knowledge systems
    and power relations vis-a-vis Radharamon’s overwhelming experience of dissonance.
    This story draws attention to how one knowledge system cannot be entirely subsumed
    or written off by another, without forcing the reader to choose unequivocally
    in favor of the other: while theuring with Radharamon as the story’s protagonist-narrator
    and mainstream spokesperson holds throughout the story, the disruptions, contradictions,
    and dissonances experienced by Radharamon don’t allow for any easy discrediting
    of him, nor of Bagharu’s Mother.'
