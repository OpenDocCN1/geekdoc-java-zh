    Steel and Gardiner wrote for a niche group, Anglo-Indian women living in India,
    whose were inevitably informed and managed in small and significant ways by imperialism.
    The housekeeping manual''s indirect audience also included women travelers whose
    reflections and descriptions about their journey through British homes in India
    were to transmit a premeditated message that British residents were effectively
    contributing to the imperial mission. By seeking to create identical snapshots
    of Anglo-Indian lifestyles in every colonial home, Steel''s domestic/acting manual
    functioned as an impediment for becoming acquainted with India during their travels,
    in the same way, that the servants in the colonial household acted as guards against
    the intrusion of India into home. However, the pervasive and constant presence
    of Indian servants, mandated by the manual, led the travelers to comment upon
    the incompleteness of the complete housekeeper, whose sedentary lounging about
    received more notice than her rigid compliance with the dictats of the. The British
    woman striving to reproduce a stabilized, normalized miniature of colonial control
    over the indigenous population instead of a fragile, disconnected, and fractured
    assemblage revealed the inherent contradictions of the project empire. The woman
    traveler and the mensahib, both participated in the civilizing mission of the
    British Raj. Still, their performances were unable to share a refined image of
    colonial India in the script untimely.


