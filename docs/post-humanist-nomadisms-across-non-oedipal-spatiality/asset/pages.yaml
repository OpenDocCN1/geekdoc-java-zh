    # One’s way or out of it


    Moving from essays that purport to recapitulate past thoughts and manners and
    provide predictions and guidance to factions, travelogues and partly autobiographical
    narrative sketches, we generally find a fascinated attitude towards nomadism,
    mainly in hot desert settings, associated with various forms of mastery and transcendence.
    It seems that, in western literatures, a biblical background prevails when the
    Jude-Christian tradition is superficially displaced by Islam or other religious
    beliefs. Fictional nomadism is hardly ever secular. However, the viewpoints from
