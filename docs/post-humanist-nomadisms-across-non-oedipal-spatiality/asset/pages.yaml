    are forced to leave. The tables seem to have turned to some extent.


    # Conclusion


    If we are to identify the groups of people that were displaced in and by the violence
    of the Partition of the sub-continent as a newly created community of refugees
    and exiles within both Indian and Pakistani borders, Nasir Kazmi''s kuliyat of
    poetry could be their founding book for his poetry is unquestionably about "exile
    and often about errantry."⁴⁶ Moreover, Nasir''s book of poetry also goes "beyond
    the pursuits and triumphs of rootedness required by the evolution of history."⁴⁷
    It, as a matter of fact, is indicative of an unrootedness which is demanded by
    the devolution of the painful collective history.


