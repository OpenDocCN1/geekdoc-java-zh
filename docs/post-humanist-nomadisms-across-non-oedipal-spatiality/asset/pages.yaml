    # The poem


    Transitioning from a meta-analysis of the groups to which Galván Rodríguez dedicates
    her poem, the body of the poem speaks to the harsh reality of life in the borderland.
    Contextualizing what these poems are responding to allows Galván Rodríguez to
    both inform readers and inspire them to act against these injustices. Researcher
    Chatterjee explains, “Poetry can always act as a vehicle for protest and change
    in two ways: to highlight social injustices and produce attentive alternatives,
    to highlight and challenge prevailing modes of representation.55 “Poem 25 – Giving
    Voice” with Chatterjee’s two avenues of poetic protest by identifying three groups
    linked to the issue of immigration among the U.S.-Mexico border: the voiceless
    immigrants, Chicana artists and those, in the U.S. dominant culture who establish
    the prevailing modes of representation (e.g., Euro-American white males, the media,
    and political decision-makers.


    Galván Rodríguez draws attention to the violence and oppression upon the border
    by referencing immigrants who “must hide” (4), who “have no voice,” (4) and who
    “live silently in fear” (9). As SB 1070 exemplifies,56 U.S. lawmakers and law
    enforcement to hold power over Ch and immigrants by continuing to question their
    identity and belonging in the country. The demand for papers propagates the restrictive
    ideology that those who align with specific racial designations are ‘free’ from
