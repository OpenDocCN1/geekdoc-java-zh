    such as “Poets Responding,” harness the community-building potential of social
    media by new “entry points for activism.”—48 Such entry points, according to Kavada,
    become ideal avenues of political participation for individuals with “limited
    political experience.”49 These individuals include immigrants who fight for their
    freedom to appear. According to Butler, this freedom is “central to any democratic
    struggle,”50 such as even political actions that occur “from the shadows to the
    margins,” are still effective. “Poets Responding” and La Bloga, therefore, establish
    more inclusive ties of solidarity among all individuals, regardless of citizenship
    status, who are united in confronting social injustices.


    Both digital communities, La Bloga and “Poets Responding,” are also highly active.
    La Bloga, with a growing list of associated authors including Norma E. Cantú and
    Ana Castillo, has attained a page view of more than 4.5 million since its inception
    in 2004, indicating a steady volume of traffic to the blog.51 Likewise, although
    “Poets Responding” began in response to SB 1070, its community continues to grow,
    ten years later. The Facebook page has more than 12,000 followers following the
