  md: '# Afterword


    recognition of chance, of the share of randomness that makes us we become and
    determines where we are heading. The Ronin is a nomad-dissident, in the most positive,
    politically, and ethically effective sense of the last word. And the most elegant
    expression of insubordination is, according to Mizubayashi, "silent and inflexible.\^25


    Ying Chen is a Chinese Francophone writer who now lives mainly in British Columbia.
    His fiction and his essays have always been, but have become more and more things
    and images (of) in-between. Seeing how she and her Canadian-born children are
    classified among racial stereotypes, moreover, mix up all the different cultures
    of Asia, returning to Shanghai after many years and noticing that the "cultural
    difference" in everyday life, tastes, attitudes with regards to the family and
    family values, etc., between Shanghai and Canada, has shrunk to the point of being
    hardly perceptible, she is now trying to find meaning in the sense of place than
    in personal mobility itself. Time, than movement, is the great operator of change,
    outside and consequently in us. "Change is an absolute law in a world without
    absolute," she writes. Consequently, she has decided that [she] cannot limit herself
    to anything local, that [she] will drink the water of all seas, breathe the air
    of the world universe, receive the teachings of the masters of all without being
    a disciple of any of them.\^26 A "nomadic" wandering across continents, languages,
    philosophies, and aesthetics (in her case, across East Asia, North America, and
    Western Europe) turns inevitably into an cosmopolitanism across time as much as
    physical, geographical space. The ever-migrant is today the closest kin of the
    historical and mythical nomad. In an interview that takes the form of a correspondence
    with a friend and critic, Ying Chen writes:


    Your letter to me started in Umbria and was sent from Normandy, it received a
    few days ago, almost instantly, on Pender Island, and by the time your letter
    reaches you, I might already have left the island. Feelings and perceptions might
    have been altered during this jetlag, at least from my side, because many things
    are happening every day, every moment, in the world, at home, in the natural environment,
    within my own body and mind.\^27


    ^25, Akira Mizubayashi, Petit éloge de l''errance (Paris: "Folio" Gallimard, 2017),
    location 393, Kindle edition.


    ^26, Ying Chen, La Lenteur des montagnes (Montreal: Boréal, 2014), 12, 14.


    ^27, Chen, Le Leenteur, np.'
