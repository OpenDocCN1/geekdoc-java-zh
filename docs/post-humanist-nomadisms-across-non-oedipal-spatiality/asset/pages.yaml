    As a supplementary to my main argument, I will also show that with reference to
    the Bengali''s adda, the cultural and social tropes of ghaire-baire (home and
    the world), local/global, provincial/cosmopolitan, may not be seen as limiting
    binaries signifying only geographical and cultural distinctions. Instead, I will
    demonstrate that the adda for the “permanently interstellar Bengali middleclass”
    got traction because, in its practice, both were held in fine balance. My essay
    uses the theoretical framework of the revisionist writing of Bengal''s social
    history that Dipesh Chakrabarty, Partha Chatterjee, and Ashish Nancy have constructed
    in the last thirty years.


    The word is translated, by the Bengali linguist Suniti Kumar Chattopadhyay, as
    a place for conversation. According to the online edition of the Oxford Dictionary,
    adda (pronounced, ud-dah) is “a place where people gather for conversation” or
    an act of informal conversations among a group of like-minded people. The word
    adda denotes both a place and the action itself. To add, or add deya in Bengali,
    actually means the situated activity and the participation in the activity itself.
    Adda is both a mediated speech genre and a discursive practice through, and in
    which (histories) are told and contested. Satyajit Ray, the famous Indian film-maker,
    showed the adda as originating in ancient Greece where rhetoric was practised
    in the pursuit of truth. The central character in the film is a globe-trotting
    uncle who, on a visit to India, strikes a friendship with a young boy, the son
    of his only relative. In one of his tales of traveling abroad, the uncle regales
    his listener about about the origin of adda and its unique place in Bengali culture.


