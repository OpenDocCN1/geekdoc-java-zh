  md: '# Preface by Walter Mignolo xvii


    and emotions, rather than floating in disciplinary clouds. That is why I (and
    others working on these assumptions) do not follow disciplinary regulations, even
    any top-down orientation. Decoloniality is not deconstruction, it is alien to
    the postmodern and is undisciplined.


    We (the same as above) do not start from the enunciated enunciation which presupposes
    lived experience rather than disciplinary regulations; the life-world if you wish
    (Hserl''s life-world in Freiburg, Quijano''s life-world in the South American
    Andes or Andalzúa''s, which I explained in countless occasions between the First
    and the Third Worlds), in public talks and writing. In regard, Deleuze and Guattari''s
    experience (like that of Husserl, there is no personalization here) alien to us
    (the same as above and many others as well). Their thinking, rooted in their implicit
    geo-body-political grounding in Western modernity, is not the experiential grounding
    of people dwelling in the borderland, borderline of modernity/coloniality. I am
    not saying that they are wrong or that we are superseding them, or critiquing
    them. I am just saying that they are irrelevant to our living and thinking and
    that they have the right to their own opinion and their ethical responsibility.


    Migrations in the past two hundred years (since the creation of the nation-state,
    the territorial border of the state and the regulation of citizenship), disturb
    the homogeneity of one state/ one nation (e.g. the nation state) and reveal the
    power border differential. They reveal the colonial ''difference'' (which is the
    concept that links to my entire argument in Local Histories/Global Designs and
    essays and speeches I delivered before the publication), the irreducible difference
    that divides the point I made in a paragraph that summarizes the point I in Local
    History addressing the similarities perceived by readers or listener. I made the
    point by building my argument on that Moroccan philosopher, writer, and thinker
    Abdelekibir Khatibi and Martinican writer, poet, and thinker Eduard Glissant (and
    Gloria Andalucía in the previous pages)


    Glissant and Khatibi arrive, in fact at a similar, but not from the local history
    of knowledge built from the perspective of modernity, as is the case of Deleuze
    and Guattari, but from local histories of knowledge built from the perspective
    of coloniality. It is the coloniality of power and knowledge as articulated in
    languages that lead Khatibi and Glissant to a critique of Western epistemology
    and the articulation of the irreducible difference with their "alias." European
    thinkers practicing


