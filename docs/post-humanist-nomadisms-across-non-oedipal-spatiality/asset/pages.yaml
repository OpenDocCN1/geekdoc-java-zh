    # Nomadology after Deleuze and Guattari


    If the figure of the nomad is to help breaks or to prevent their erection, impeding
    foreclosure, relaxing the rigidity of dessicated concepts and categories, serving
    creative differentiation, (re-)inventing a non-possessive, non-destructive jouissance,
    a few questions should become answerable (or reformulatable) that have been kept
    at so far, below the horizon of the metaphor. At least these two questions:


    +   - How can we “mobilize” the other’s mobility, or produce “one’s own” mobility
    through otherness(es ) without appropriating, enslaving, essentializing mobility?

    - How can we live and enjoy differentiation, or even not-sameness, non-repetition
    happen, if we posit that difference is always already there?


    Luce Irigaray, philosopher, linguist, psychoanalyst, feminist, and, finally, adept
    at the practice and theory of yoga, is one thinker of the same generation as Deleuze
    and Guattari, but still alive and whose writings have both co-existed with theirs
    and developed later in somewhat unexpected directions. Turning to her any moment
    of her work can disconcerting in our perspective. On the one hand, gender difference
    (not differentiation, or becoming) is the foundation of all relatedness, a woman
    is always already a woman, and a woman should not be seduced, diverted outside
    herself, from her womanhood, a normative view that has often been criticized as
    essentialist:


    Exiled from yourself, you fuse with everything you meet. You imitate whatever
    comes close. You become whatever touches you. In your eagerness to find yourself
    again, you move indefinitely far from yourself. From me. Taking one model after
    another, passing from master to master, changing face, form, and language with
    each new power that dominates you.¹¹


    Without naming it, in the guise of autonomy and self-protection, there is an underlying
    implication of authenticity, an inherent identity (both as sameness to the same
    and as ipseity) to be preserved from the risk of an outside: “There is no need
    for an outside; the other already affects you. It is


    ¹ Luce Irigaray, An Ethics of Sexual Difference, trans. Carolyn Burke and Gillian
    C. Gill. Ithaca (NY): Cornell U. P., 1993), 210.'
