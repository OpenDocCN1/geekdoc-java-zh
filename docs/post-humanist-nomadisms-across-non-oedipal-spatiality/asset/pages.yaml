  md: 'xiv


    Preface by Walter Mignolo


    his ends: a modern homo oeconomicus. 3 I am talking about two trajectories; the
    trajectory that leads to the post-human and the trajectory that lead to Man3,
    the consolidation of a game of life that prevents asking what it mean to be human.


    This is also, in my understanding, the territory of the posthuman, but as the
    dictum goes, and as Jorge Luis Borges argued, the map is not the territory. There
    are other territories. One of them is “After Man” irreducible to the genealogy
    of Man1 to Man3. “After Man” is the humanities reclaimed by the descendant of
    the history racialized and sexualized people, since sixteenth century. Classified
    as territorialized and ontologically (less humans) inferior and epistemologically
    deficient (irrationals or not quite rationals) who precisely because of their
    inferiority and their deficiencies were not supposed to think. They/we are now
    thinking and reducing the posthuman and Eurocentrism (Eurocentrism is an epistemological
    and aesthetic phenomenon located in Western Europe whose tentacles traverse planes
    of its own size. “After Man” emerge from the majority of non-European population
    who have been left out from the trajectories Human to post-Human and from Man1
    to Man3. The post-Human is not universal. The eurocentric critique of Eurocentrism
    while Winter’s Man1 to Man3 outlines a decolonial critique of eurocentrism. The
    decolonial option illuminate the paths towards the humanization of the After Human,
    co-existing with the post-Human.


    I am aware that promoters of the ‘post-human’ are driving towards escaping the
    trends of anthropocentrism. I do not have a problem with that. It is not way to
    go. I am describing a different path to delink from anthropocentrism. I am not
    trying to supersede what, in a different frame, is conceived as ‘posthuman’; I
    am not interested in disqualifying it. I am just saying that I do not fully accept
    it. And I am saying that there is one path and that is to add a prefix ‘post-’
    to whatever you would like to supersede. I am talking about co-existences in diversity
    (that is pluriversity). In a plurural ecumene, ‘post’ means one temporal and conceptual
    line and the assumption that there is one, universal, time. It is generally assumed
    that ‘after’ has to be ‘post-’, and that all dissension and attempts to supersede
    something in the prison of North Atlantic Universals (in the apt description offered
    by Michel Rolph-Trouillillot) has to be referred to with ‘post’. There is no way
    out of


