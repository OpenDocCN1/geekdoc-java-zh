    Sinhala-Buddhist government and the armed insurgency mounted by the Liberation
    Tigers of Tamil Eelam (LTTE). The Sri Lankan diasporic population numbers approximately
    3 million worldwide, and most members of this group migrated directly or indirectly
    as a result of the civil war. While travel often invokes a sense of ‘privileged’
    displacement, diaspora includes a continuum of travel from forcibly displaced
