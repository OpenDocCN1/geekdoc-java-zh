  md: 'The adda is now perceived to be a dying practice. Modernity''s development
    project and the transformation of Kolkata''s urban scape fickmarked by huge apartment
    buildings and shopping malls, has left the city and its citizens less space, time,
    and lesser inclination to indulge in it. Today, the adda survives only in a few
    pockets in North Kolkata, while for the diasporic Bengali community, it exists
    in different guises like the internet adda.


    # The Death of the Bhadralok and the Decline of the Adda


    In the paper''s final section, I engage with one of the central questions of cosmopolitanism''s
    discourse: whether cosmopolitanism is the exclusive domain of high culture, or
    is it embodied in acts of everyday life? My contention, is my third thesis, that
    in the case of adda, it appropriated and subsumed both. From the nineteenth to
    the first half of the twentieth century, the bhadralok''s adda was synonymous
    with the nature of high culture, alienating the upper and middle-class participants
    from the popular masses. While its operating principle was ostensibly one of democratic
    inclusion, in reality, it produced a privileged, exclusive community. Entry to
    this space, as mentioned earlier, required a certain degree of cultural capital
    that only the upper/middle-class, which educated Bengali had access to. For example,
    to be well versed in Bengali, European, and British literatures and/or in western/Indian
    classical philosophy was considered a sine qua non for realizing the adda''s purpose
    of engaging in discourse, well-informed and ranging in scope. Something that claimed
    to be quintessentially Bengali, an indispensable part of the Bengali identity.
    The adda was an integral source of living since it provided “life” and “vitality”
    to the colonial babus and the bhadraloks of Kolkata. This allowed this exclusive
    class to transcend the provinciality of a local habit of socialization with the
    help of a shared exchange of modern and global concerns.


    I designate adda then as the singular marker of bhadralok cosmopolitanism, a cosmopolitanism
    from above, than from below. Acquiring a degree of influence in excess of their
    strength, the bhadralok constructed “new forms of public discourse, laid new criteria
    of social respectability, set new aesthetic and moral standards of judgment and
    [...] fashioned the new forms of political mobilization.”They became the principal
    agents of nationalism in colonial bengal and, along with the middle-classes elsewhere
    in India, constituted colonial India''s nationalist elite. One may conclude that
