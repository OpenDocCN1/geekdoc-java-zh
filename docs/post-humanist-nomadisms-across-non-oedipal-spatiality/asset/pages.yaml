  md: '# Chambal as nomadic in global and local narratives


    The cursed Chambal.


    The erstwhile Charmavati has today become the Chambal. It has been flowing away
    at its own pace since time immemorial, not from north to south, rather from the
    south to the north. On the western side of MP is Mhow, where the river regenerates.
    After that, it gushes down 300 miles, meandering through Uttar Pradesh and Rajasthan.
    This sojourn ends at Aiwa, Uttar Pradesh, just a few miles further down. She disappears
    thereafter into the blue waters of the Yamuna.


    The wrathful Chambal.


    Her thirst never quenched. Allegedly, her waters used to be red. Many battles
    were fought on her banks. Chambal''s blue waters had become red with blood. Bloods
    of sharp-edged swords cut off many human heads which had rolled into the river,
    reddening the waters even more. Yet the Chambal hadn''t attained any placidity.¹¹
    (Our translation)


    Taking a cue from Deleuze and Guattari''s distinctions of smooth-striated and
    nomad-space, the State seeks to reclaim terrains by building walls, enclosures,
    and roads between enclaves. The nomads, on the other hand, do not try to tame
    the earth; instead, they try to populate its expanse, inserting themselves into
    the continuously shifting nature of the desert, tundra, etc.¹² Nomads, therefore,
    with their deterioritorial—a result of their destructive and disorganizing effect—undermine
    and stabilize any domestication by means of the oppressive organizational power
    of the States. Women dacoits in their entagements with the Chambal valley thus
    additionally refuse to submit to the laws and mapped orderliness of dominant narratives.
    In his book, Bhadari stretches this occupancy further, through people, animals,
    objects, and spaces.


    She wants more and more blood. In her rage and in her thirst for blood, the Chambal
    keeps racing for miles in fire and fury, devouring everything that comes her way.
    She has dragged, destroyed, drowned, and completely devastated villages and paddy
    fields on her banks, year after year.¹³


    Galeano moves in the reverse gear: locating Phool Devi on the tumultuous fringes
    of the State walls and enclosures, he writes, "Phool Devi had the terrible idea
    to be poor female and female a member of the poorest


