- pgno: 11
  md: '# Preface by Walter Mignolo

    What does it mean to be human?

    Border thinking on racism and migrations


    It is a rare occasion, and a welcome one, when the person receiving thankful appreciation
    from the authors is invited to preface their book, giving him the opportunity
    to express his dissenting opinion. I am pleased to return the appreciation and
    continue the conversations initiated in Hyderabad in December of 2019 and followed
    up via email since. The friendly conversations started and unfolded on a divergent
    understanding of what is meant and understood when the word ''human'' is articulated
    in a modern European vernacular and imperial language (Spanish: *humaine* in French;
    *Mensch* in Germany; *umano* in Italian; *humano* in Portuguese). The following
    reflections are neither intended to correct the summary of my words for that Professors
    Indrani Mukherjee and Java Singh offer in the introduction, nor to comment on
    subsequent chapters. My reflections provide a background of what I thought and
    said during the conversations summarized in the introduction.


    Since the volume underscores the posthuman and nomadism, I divided this preface
    into two sections, one in conversation with the posthuman and the second with
    nomadism. Section three is a conclusion connecting the threads of parts and two.
    My reflections on the posthuman are based on Sylvia Wynster''s distinctive approach
    to the question. As a Black woman, scholar, scholar, and activist from the Caribbean,
    she pursued a basic question: what does it mean to be human? The question is engraved
    in the lived African diaspora in the Caribbean. She cast her argument in the expression
    ''after man'', a radical starting away from the ''post-'' and from the ''human''.
    The second part is based on my immigrant experience. All my grandparents migrated
    from Italy to Argentina. I then migrated from Argentina to France and later to
    the US. ''Nomadism'' is a very alien word in my experience and the decolonial
    articulation of that experience. ''Imigrant consciousness'' is a concept that
    I sense in my body, and immigration consciousness presupposes border dwelling
    and border thinking.


    Walter D Mignolo, "Introduction. Immigrant Consciousness." In Rodolfo Kusch, *Indigenous
    and Popular Thinking in America* [1970]. Translated by María Lugones and Joshua
    M. Price. Durham: Duke University Press, 2010, xiii-xl.'
