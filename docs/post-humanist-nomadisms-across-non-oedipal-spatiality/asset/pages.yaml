  md: '# Chapter 6

    Becoming a phantom people:

    Non-Oedipal spatialities, the Sunderbans and the bhadralok gaze


    Tonisha Guin


    Forum on Contemporary Theory, India


    # Abstract


    The Bengali mainstream is closely associated with the demographic category of
    the bhadralok (loosely translated as Bengali gentleman). It is a loaded word and
    a heterogeneous category. Simply put, it stands for the part of Bengal’s population
    that is middle-class in its sensibility, literate (largely) Hindu, urban-oriented
    (if not always urban-located), caste-Kashya or Brahmin, mostly service-sector,
    mostly identifying as modern, secular or humanist. Within the Bengali mainstream
    social imagination, the Sunderbans have persistently occupied a liminal space.
    A sustained practice of confronting others in mainstream representations of its
    peoples, lived practices, and mutable geographies both within juridico-political
    institutions and, more crucially, in the domain of what may be loosely termed
    culture. The Sunderbans can be discursively accessed predominantly through only
    texts that locate themselves within the Bengali Bhadralok identity project. When
    one is confronted with the epistemic violence of all Sunderbans representation
    implicit in them, instead of countering it with an as yet unavailable or inaccessible
    counter-hegemonic stancu, unavailable or inaccessible counter-hegemonic stance,
    it is more productive to look at the liminal spaces where these neat polarizations
    are destabilized. The paper argues that Atin Bandopadhyay’s short story for children,
    “Atapur Bagh’s Tiger”, provides one such instance so insofar as it is located
    in the Sunderbans but is simultaneously evocative of the Bhadralok. It creates
    a space that manages to take the Bhadralok identity project vis-a-vis the Sunderbans
    and turns it into fluid indeterminacies.


    **Keywords:** Opacity, oedipal, liminal, epistemic violence, counter-hegemonic'
