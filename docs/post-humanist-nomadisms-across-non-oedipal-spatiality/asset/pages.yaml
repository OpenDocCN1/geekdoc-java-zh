    and fin-de-sicle journalist; a Mohammedan, christian agnostic."41


    Clichés about femininity—inevitably lead into a male pen, one would say, in 1911.
    A woman, to gain insight into “a race like the Arabs, has the advantage of being
    “less disposed to theorize, to read wrong meanings into what she sees, less prone
    to err in interpreting primordial tracts of feeling," a man can rarely immerse
    himself in the strange life of a savage race with the naif abandonment of a woman."42
    There is something childlike in women, they are “arrested” at an early “emotional
    stage” when the lure of imaginary adventure lets us identify with raw, primitive
    barbarian how profitably combine with much learning, training and “a refined intelligence?"43
    Douglas does not solve the riddle himself, but for various reasons, including
    his own lifestyle, he exile in Capri and his bisexuality, plus the prevalent sexism
    and myths in turn-of-the-century British and continental literature and artistry,
    we can safely assume that Isabelle is seen and presented by Douglas as an exemplary
    and exotic androgynous figure, nostalgic and representative of a primordial completeness,
    unity and purity. “Nomadism” across cultures, “races,” genders and languages was,
    for Isabelle as for—a provider of “jouissances fortunes.” Douglas could have subscribed
    to Flaubert’s exclamation: "Madame Bovary, c’est moi"


