    not polite, white not rational, and surely not exploitative. It re-routes entanglements
    of the human and non-human into a non-European perspective on the human. This
    is another humanism, as one imagined by an Andean Indian, a Caribbean creole,
    and a Dalit Indian that highlights a nomadic ontology of spatiality, which is
    problematically hybrid, interstitial, or intersection.


    Mignolo''s solution on vinculidad entails a relationship between all living beings
    with the land and the cosmos. He draws this concept from the Andean vision of
    the integral nature of all life forms and their material surroundings. Edouard
    Glissant''s relation language is made of rocks; in which words, verb, noun, subject,
    object, are not fixed in their places, and “in Every relation object is subject,
