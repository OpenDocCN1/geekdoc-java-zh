    237


    The Chambal and its dacoits always escape any scope of control by the landlords,
    tehsildars (revenue officers), or any other forces of the State who seek to domesticate
    its savage wilderness. The nomads (women dacoits) who occupy this space also perform
    such evasion, comprising the spatiality of the landscape in its relationality
    of becoming.⁸ While upper case male dacoits indulge in caste wars—by giving a
    share of the loot to their handlers from the same caste in the village that they
    protect the dacoits from the police”—A band headed by a woman or by a Muslim man
    are truly nomadic as ethnicity, identity, caste, and gender are overlooked for
    them shown vividly in Kapoor’s Bandit Queen. As a result, they remain fiercely
    on their own. The Muslim elite becomes an important part of Phoolan, as portrayed
    in Kapoor’s film. Putlibai or Gaurharvano was also a Muslim courtesan whose name
    of Putri. She was a very beautiful, slim, and almost petite woman who used to
    dance at weddings and other social events of the rich and affluent as a notch
    girl. On one occasion, the dacoit Sultana kidnapped her she could perform in his
    den. Soon after, Gaurharvano fell in love with him and married her. She became
    a dacoit and the leader of his group Sultana fell to police. She reigned for six
    years, from 1950 to 1956, and was the first woman dacoit of independent India.
    Stories of her inhuman violence and terror continue even today. Yet she was also
    known for her kindness to the poor and the deprived whom she helped in every way
    she could.⁹


    The rhizomatic links of the Chambal with its landscape and its occupants has been
    extensively explored here. Bhaduri traces the historical origins of the caste
    wars, especially between different sub-casts of the Rajput, result of their loss
    of power due to their defeat by Sher Shah.


    Karen Barad, Posthuman Performativity: Toward an Understanding of How Matter Comes
    to Matter,” in Signs: Journal of Woman and Society, no. 3 (2003): 814.


