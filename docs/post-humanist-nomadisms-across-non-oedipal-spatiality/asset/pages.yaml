  md: 'In Almada''s work, this tension encodes a kind of creeping, insidious violence.
    (Isn''t potential for violence inherent in all tension?) Killing time is almost
    unbearable. It is the opposite of contemplation. And it is a phenomenon of modernity,
    since in earlier times the very rich had the means to afford a claim to either
    the sublime, or to bored, or indeed, to feel they had the right to complain about
    the violence exercised against them by the insufficiently overwhelming chunks
    of life.


    But before I go any further, who is Natalia Almada? Born in Mexico City she is,
    the 100% Mexican, 100% American daughter of a Mexican father and a US mother.
    On her father''s side, she is the great-granddaughter of Plutarco Elías Calles
    (the subject of one of her films). In total, to date, she has filmed four feature-length
    films since her 2001 MA thesis film, "All water has a perfect memory" (focusing
    on the family trauma resulting from the drowning of her sister). These films are:
    Al otro (The Other Side, a 2005 documentary about a fishing village in the marco
    corridor), El general (The General, a 2009 film about Calles, grounded in audio
    recordings of her grandmother speaking about her infamous father), El velador
    (The Night Watchman, a 2011 documentary about a drug lord mausoleum), and Todo
    lo demás (Everything Else, from 2017, an intellectually fought fiction film about
    a cog in the machine of Mexican bureaucracy).


    A graduate of the Rhode Island School of Design, where she focused on photography,
    Almada is known for her impeccable eye. She is a true cinematographer: producing,
    directing, writing, editing all her films, which have been described as minimalist,
    lyrical, intimate. She lingers on her images and is not afraid of silence; says
    in an interview that she learned very rely more on images than words; images are
    concrete, and as a bilingual, bicultural person, she always finds language to
    be unreliable and incomplete. She is also aware of her privilege as a dual citizen
    of two nations—her films connect to her Mexican heritage, and US citizenship allows
    her to be an independent filmmaker through her eligibility for grants. It was
    her MacArthur genius award, for example, that allowed her to finance Todo lo demás.


