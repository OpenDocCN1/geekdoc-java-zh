    briefly portrayed as a courageous, warrior-like character when she leads the contangle
    of Nyarong women to the Khampa men in their struggle against Communist occupation,
    she is ultimately as helpless and in exile of Paul''s protection in exile. Her
    desire to fight for Nyarong''s freedom is disappointingly reduced to becoming
    pregnant with Paul''s child before he goes to fight alongside the Khampa guerilla
    warriors towards the end. 3


    The narrator''s role as the devil''s advocate in numerous exchanges is reminiscent
    of Gilles Deleuze and Félix Guattari''s concept of the nomad. In this book, he
    occupies an outside and an a-centered position of multiplicity.4 In this he demonstrates
    that one can hold and stand up for their political beliefs, but at the same time
    be critical of their other side''s faults and appreciative of the other side''s
    achievements. The narrative is not restricted to highlighting Tibetan political
    concerns and displays the moral courage to look beyond such limits. At times,
    however, the narrator''s rhizomatic moves are confusing, they illuminate the various
    particularities of a situation. The reader may think he favors the practicality
    and effectiveness of Chinese Communists'' ideology over the make-believe of Tibetan
    Buddhist religious practice. In other instances, he communicates a sense of championing
    the spiritual emphasis of Buddhist philosophy over the Communists'' mundane. In
    these endlessly changing voices and perspectives, the narrator manages to tease
    out the complexity of the ideological forces in conflict at the time and the brutal
    outcome of their clash.


    The article argues that the novel weaves a self-critical subjectivity into the
    exchanges between the characters as well as the function of a nomadic narrator.
