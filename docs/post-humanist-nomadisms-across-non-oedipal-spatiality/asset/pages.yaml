    It is possible to read this talking as articulations of border thinking,'' which
    reinstates the scope of retelling and theorizing from the outside of coloniality
    of power.^34 Such recounting highlights colonial-patriarchal blindness of privileging
    either writing or history as measures of civilization, a kind of phallocentrism.
    This is so because both writing and history, have been known to be the Weberian
    flourish of writing history as a justification for colonization.^35


    # The warring machine


    Before inhabiting the Chambal valley, both Putlibai and Phoolan Devi were subject
    to repeated cultural, demographic, and sexual violence. The Chambal river becomes
    a potentially enabling space as it became occupied by the nomadic baghis, who
    also redeem the river of its accursed territoriality. When the security forces
    poison the water of the river to force her to surrender, she hopes that the womb
    of the Chambal would protect her. This is a classic example of the nomadic subjectivity,
    which is ontologically non-humanist, and “a subjectless individuation that constitute
    collective assemblies.^36


    Bahaduri''s Putri and Kapoor Galeano''s Phoolan translate their bodies in the
    Chambal valley as event potentials of violence. Phoolan''s surrender was a result
    of a staging by competing patriarchal units like political parties, the police,
    and the media. That she surrendered before forfeing thousands of onlookers and
    television spectators as well as before the image of Durga and Gandhi is emblematic
    of the nationalist salvation as she moved from one kind of patriarchy—feudalism—to
    another, the nation-State, packaged as modern, democratic and inclusive. Putri,
    who was dead and mostly forgotten, though the myths of terror built around her
    survived. Women daco are never remembered as Phoolan has been, precisely because
