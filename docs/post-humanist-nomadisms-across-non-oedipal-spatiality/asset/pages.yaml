  md: '# xii Preface by Walter Mignolo


    and leave inside the territorial States a significant number of Mexicans who lost
    their original nationality.


    They did not move; they were not nomads. The frontier moved beyond them. The second
    connection with Anzaldúa was her sign sentence: “The U.S.-Mexican border es una
    herida abierta where the Third World grates against the first and bleeds. And
    to form a scab it hemorrhages, the lifeblood of two worlds merging to form a third
    country — border culture.\^5 Despite different generations, different sexual preferences,
    and different geopolitical local histories (Mexico on the hand, Argentina on the
    other), Anzaldúa and myself lived the Third World experience. Paraphrasing Anzaldúa
    I would have said at that time “The modern/colonial borderline are heridas abiertas
    where the Third World grates against the first and bleeds” and these borders and
    wounds are today planetary. These are the territories where “border cultures”
    emerge, from border and persist. Border thinking sprouts from experiences in the
    borderland and borderlines (racial, nacional, civilational!) That nonetheless
    is everywhere, even when settler colonialism ended, coloniality persisted. ‘Border
    cultures’ are entangled in power differentials (they are not equal on both sides),
    and that power differentials are dictated by one of the border worlds. Dictation
    consisted in the invention of the ‘colonial difference’: cultural differences
    are never of equal weight, they are always entangled in power differentials.


    I am telling you this story to make more explicit my thoughts on nomadism, migrations,
    immigrant consciousness, and border thinking. After I finished the manuscript
    of The Darker Side of the Renaissance, I continued what I had started in writing
    that book but brought my reflections to the end of the twentieth century. Out
    of this research, teaching and workshops and published articles called Local Histories/Global
    Designs. During that process I was asked many times in graduate seminars, workshops
    and lectures, why I was not referring or quoting Deleuze and Guattari’s concept
    of ‘nomadism’ since, in the understanding of the person asking the question, there
    were obvious similarities. I addressed the tone of these questions in several
    pages of Local Histories/Global Designs (66–77). I explained why Deleuze and Guattari’s
    nomadism was irrelevant to my own experience and thinking. Decolonially, we (those
    of us follow the path opened by Anibal Quijano and Gloria Anzaldúa, followed up
    by Maria Lugones at the crossroads of Quijano’s coloniality and Anzaldúa geopolitical
    (Mexico / US) and body-political borderlands (women / lesbians of color), do not
    begin from ethereal concepts but from the grounding from where and such concepts
    emerge. Concepts are connected to feelings


