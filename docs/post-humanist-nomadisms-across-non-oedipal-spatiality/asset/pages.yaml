  md: '# Afterword


    # 257


    One wonders why the nomads themselves, women-as-nomads, or their nomadic thought
    always in the movement do not take up; in reality, the role of angels in myth.


    In of the general essays, fictions, travelogues, and philosophical speculations
    I have examined or mentioned, it seems that memory, in the sense of an archive
    of words and images from which straightforward or less obviously relevant items
    are retrieved in certain states and situations, is not a feature of the nomads.
    They are not amnesiac or even oblivious, not “having a history,” they are presented
    as activating past emotions, sensations, bodily experiences in an instinctive
    manner rather than consciously separating the present from the past and the future
    to compare data belonging to each of these temporal categories. Tamsin Lorraine
    quotes Ros Braidotti on this topic: “Nomadic memory connects to the virtual totality
    of a continuously reconstructing block of past and present moments,” and comments:
    “The pure past of the virtual whole that is past being affected by the passing
    of time.”¹


    A good summary of Braidotti''s intervention on the questions of nomadism and feminist
    thought, that she has made ‘intersectional’, with the postcolonial question, can
    be found in her article “Les sujets féministes comme figure des multitudes” published
    in the journal Multitudes 2003.¹¹⁹ She immediately situates herself in the framework
    of what she calls “late postmodernity”; this, marked by the “crisis of the modern
    subject” requires to respond to the insufficiency of “dialectic oppositions and
    structuring dualisms,” “rethinking the relationship to otherness in a nomadic
    sense” because “nomadic otherness is not one, it is multiple.”²⁰ Multiplicity
    becomes a feature of nomadism, almost synonymous with it, and links tightly to
    the deconstructed postmodern subject, to the female subject as not-One, and to
    the diversity and hybridity of postmodern globalization merchandise around, the
    locus of (deteritorialized) mobility is no longer a free or temporarily autonomous
    zone outside; it is the subject’s bodily existence where categories are displaced:
    “Our roots move, and our subjectivity becomes nomadic. [...] our bodily matter
    is caught in a system of circulation and exchange, at the local level well as
    at the planetary level.”²²


    +   ¹⁸, Rosi Braidotti, “Les sujets féministes comme figure des multitudes,” Multitudes,
    2003/2, nº 12, (2003): 28, https://www.cairn.info/revue-multitudes-2003-2-page-27.htm


    +   ¹⁹. Ibid.


    +   ²⁰. Ibid., 29.


    +   ²¹. Ibid., 34.


    +   ²².. Ibid., 31.'
