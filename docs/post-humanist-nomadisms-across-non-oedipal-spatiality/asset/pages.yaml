    # Reconstitution and the techno-managerial gaze of globalization


    Nomadic routes are fraught with danger, and the nomad frequently encounters inhospitable
    terrain. The nomadism of amaranth is under threat from the discourses of the "Miracle
    Foods Narrative (MFN)."²⁷ The MFN traces alleviation and malnutrition reduction
    programs of multilateral, bureaucratic behemoths like the FAO, IFAP, and WFP to
    unveil the underlying colonial imperiousness in in the claims of "benign humanitarianism"
    for these projects.²⁸ Since the beginning, their common tactical element has the
    identification, projection, and eventual deification of a single crop as a panacea
    for nutritional challenges. Their efforts are bolstered by the participation of
    profit-seeking corporations and non-profit organizations, usually from the Global
    North. In the 1960s, the miracle food was O2 corn, a protein-enriched variety
    that, despite extensive promotional measures by the agencies, failed to become
