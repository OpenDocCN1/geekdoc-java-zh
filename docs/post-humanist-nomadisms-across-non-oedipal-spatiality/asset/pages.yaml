  md: '# Chapter 13


    # Cosmopolitarianism in the face

    of im/migration


    Antara Mukherjee


    Independent scholar


    Abstract¹


    In ancient Greece, cosmopolitarianism was a call for all humanity to belong to
    one world, irrespective of citizenship or social divisions. In ancient India the
    traditional definition of this concept—Vasudheiba Kutumbakam, translates as: ‘we
    are all members of the family of earth.’ However, today this is open to different
    interpretations depending upon how cosmopolitarianism is conceived, theorized,
    and practiced.³ This article attempts to explore how cosmopolitarianism becomes
    a hegemonic narrative when it is appropriated by the affluent to couch a dismissive
    attitude of indifference towards the racial and social order. It concentrates
    on three texts for this purpose: a cover page of the travel magazine *Conde Nast*;
    the second is an episode of the Trevor Noah comedy show; and the third is a satirical
    cartoon, by Pikaso. Through its readings of these texts, the present article aims
    to show that elite cosmopolitan’s ‘engagement’ with poverty as a social problem
    is limited to advertised philanthropy or charity, thus exposing its complicity
    with racism, intolerance, and xenophobia.


    **Keywords:** Cosmopolitarianism, nomadic, displacement, im-migrant, discrimination


    In ancient Greece, cosmopolitarianism was a call for all humanity to belong to
    one world, irrespective of actual citizenship or social division. It is also significant


    > 1. A shorter version of this paper was presented in an International Conference
    entitled “Revisiting Cosmopolitarianism” organized at the 21st Forum on Contemporary
    Theory, held in Puri, Odisha during 18-21 December, 2018.


    > 2. Jennie Germann Molz, “Cosmopolitarianism and Consumption,” in The Ashgate
    Research Companion to Cosmopolitarianism, ed. Maria Rovisco et al. (New York,
    Routledge: 2016), 33-34.'
