  md: '# # Afterword:

    # Nomadic theory, again?


    Didier Coste


    Université Bordeaux-Montaigne, France


    I return to a critique of Deleuze and Guattari in my provisional conclusions,
    and investigating the positions of Luce Irigaray and other post-Deleuzian feminist
    thinkers, such as Rosi Braidotti, I try to outline how a more rigorous, anthropologically,
    and historically informed approach to senti/mental and spatial human mobilities,
    whether individual or collective, could be methodologically fruitful and to circumvent
    the traps of various postisms as well as the paradoxes of a universal anti-universalism.


    It would be a daunting and an unfair task try to summarize Deleuze and Guattari’s
    massive *A Thousand Plateau* (hereafter ThP). But, although it was published after
    the revival of multiple notions of mobility, *dérive*, terminable interpretation,
    infinite semiosis, and questioning of identities between the realm of existentialism
    and the aftermath of the 1968 insurrection this book and its "nomadology" a marking
    point in postmodern western thought remains influential in certain feminist and
    postcolonial circles as well as in experimental, late avant-garde aesthetic creation
    and theory. I will therefore limit myself to collecting some significant occurrences
    of the [nomad] signifier in this work and clarifying to what strains of thought
    it is associated, thus trying to sketch the dynamics of its uses in context. After
    I will briefly compare this process with some later manifests of mobility.


