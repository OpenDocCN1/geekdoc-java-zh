  md: 'throughout North America.12 The political and cultural violence enacted against
    those perceived as the “foreign other,” however, reinforce dominant Euro-American
    cultural ideology that indicators of suspicious behavior one’s skin color (i.e.,
    not white) and one language (i.e., not U.S English).13 To combat the barrage of
    political and social acts of discrimination that made the border an inhospitable
    zone, Chicanas have developed an identity of resistance through community building.
    This identity relies on a plural assemblage of individuals asserting their right
    to be recognized, Hannah Arendt refers to as the “space of appearance.\14 Whereas
    Arendt believes this space can only exist in the material public sphere, Judith
    Butler argues in her theory of assembly when bodies assemble, whether in a physical
    public space or a virtual one, “when collective actions collect the space itself,
    the pavement, and animate the architecture.”—15 The development of this identity
    tied to assembly of contemporary Chicanas'' migration to digital spaces, such
    as Facebook, to establish online activist communities.


    The community-building aspect of Chicano identity developed prior to the Internet,
    during the Chicano Movement in the 1960s and 1970s.16 The activists of this movement
    strove to establish a sense of community by reclaiming their practice in the United
    States. Sharing their writing at conferences and national meetings, social spaces
    that operate internet platforms, these early activists bolstered grounded-level
    demonstrations. In the political manifesto, “El Plan Espiritual de Aztlán,” Chicano
    poet and activist Alurista evoked the myth of Azteclan, the mythical homeland
    of the north that many believe is located in the Southwest United States.17 Calling
    upon this cultural heritage, Chicanxs built a sense of community by confirming
    their ancestral origins in this land. The emerging Chicano identity thus became
    what Alurista termed a “force of resistance,”18 which continues to inform the
    activist ambitions of contemporary Chicano writers, such as Galván Rodríguez.


