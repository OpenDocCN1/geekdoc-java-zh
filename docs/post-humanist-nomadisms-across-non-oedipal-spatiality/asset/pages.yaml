    # Bubbles in the language (e)scapes


    Tripti, a mid-aged Bengali woman, has living in Barcelona for 11 years. Tripti
    is the only member of her family who is not yet a Spanish national. When she asked
    if to get citizenship, she expresses that due to her lack of Spanish skills, she
    has no hope of getting it.30 Every Sunday, she comes to a small space that has
    the structure of a small shop but acts as the temple for a small community of
    Bengali Vaishnavs31 in the Raval neighborhood, to the maximum number of South
    Asian immigrants in Barcelona. It would be challenging for anyone outside the
    community to reach the temple on unless they know an insider. The temple was being
    run without the necessary official permission. The women who come one by one to
    the temple started contributing to the kitchen work. They peeled and chopped fruits
    and vegetables. An older woman was cooking in a small makeshift kitchen. All the
    women were wearing South Asian traditional clothes, sarees or salwar kamez.


    At about 6 pm, a South Asian man but 30-years-old arrived, who acted as the priest.
    Jhoom, one of the women present there, started to arrange the things required
    for the ceremony. A little later, she was encouraged by other women of the group
    to have a more significant role in the rituals as they joked about being the priest,
