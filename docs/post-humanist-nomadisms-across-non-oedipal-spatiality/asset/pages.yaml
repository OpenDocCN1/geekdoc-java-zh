    # Reclaiming a lost (bio)ethics towards decoloniality


    This article visualizes an inviolable relationship of safekeeping between habitat
    and ethical habit. The indigenous Mesoamerican and Andean cultivation of amaranth,
    and numerous other crops was carried out in a habitat of safekeeping sustained
    by ethical habits of minimum ambient damage, judicious use of natural resources,
    and sufficient healing. These ecological practices represented the praxis of a
    complex Nahua cosmovision. A glimpse of this cosmision is visible in the conversations
    between Nahua tlamatinines, or philosophers, and Spanish friars that took place
    in 1524 after the Aztec empire had been annihilated. According to Miguel León
    Portilla, these conversations were the "last and most dramatic performance" of
    protest against the cultural violence of colonization.^14 In extremely "respectful
    and cautious words," the Nahua philosophers of thinking about divinity can be
    and should be respected," because it is on a "rich and elevated concept of the
    Giver of Life.\^15 They explain that the gods make sacrifices to everything that
    "conserves" human life; therefore, human beings must honor the gods by "bleeding"
    and sacrificial offerings.^16 It is this cyclical order which made agriculture
    and consumption patterns sustainable; therefore, there is a need to nurture the
    nurturing soil, and protect the sustaining biodiversity. The cosmovision of the
    Aztecs was non-oedipal, self-sustaining in their everyday banality. The world
    view where all objects, animals, plants, and humans were moving and rooted at
    the same time was both lair-laden and also morally marked. There was a discernible
    entanglement of nature, gods, and human beings. Sacrifice was a necessary expression
    of reciprocal responsibility and a reinforcement of the "habit" to give back to
    the habitat some of what it had.


