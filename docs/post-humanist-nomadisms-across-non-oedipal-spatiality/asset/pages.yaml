    recuperación* strategy should find a way out of hegemonically dictated conversations.
    A decolonial vocabulary creates “differentiated spaces of enunciation anchored
    in the land and the bodies that inhabit and enunciate/ areated in the border.”51
    Thinking of the human-nature relationship to Pachamama, an Ayymara and Quechua
    word, illustrates the reconstituting capacity of a dissenting vocabulary. When
    Bolivia and Ecuador constitutionalized the environment as a legal personality
    in 2008 and 2010, respectively, the enacted laws granted to “Madre Tierra,” or
    Mother Earth.52 By not thinking of the rights in terms of *nature*, which evokes
    a nature-culture binary, and by making it clear that the constitutions understand
    that the stipulated beneficiary of nature is Madre Tierra or Pacha Mama, the terms
    of the conversation change. The vocabulary moves away from the idea of nature
    as a “destructive and dominating masculine entity which ‘separates herself from
    those she supports [...],” nor does it project Mother Earth as a “weak and subjugated
    female”; instead, she is celebrated as a sacred and powerful maternal entity


