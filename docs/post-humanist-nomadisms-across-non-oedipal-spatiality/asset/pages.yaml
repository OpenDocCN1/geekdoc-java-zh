    The adda may be considered as a social practice of the bhadralok that developed
    out of a specific encounter of the colonial, the global, the cosmopolitan with
    the national, and the provincial in Bengal’s history. It was an attempt made by
    the Bengali bhadralok from colonial times to situate and move in a kind of "liquid
    modernity" characterized by transience, ambiguity, and uncertainty.\^31 A small
    minority of Hindu male reformers, and writers pioneered political and cultural
    modernity in Bengal, steeped in paa cosmopolitanism, was articulation defined
    by an indigenous communicative model of world openness, even though the openness
