    It''s an overtly feminist project, the kind of story we ironically call "fascinating"
    when we mean the opposite; when you yawn and the film was stunning, sublime.


    Nothing happens in this film, which straddles an increasingly familiar line in
    independent cinema between documentary and fiction (I have suspicions about this
    increasingly banal celebration of the use of non-actors in independent cinema,
    which also aligns with a kind of sublime analysis: our mainstream actors work
