  md: '# Ambiguous mobilities


    Instead of documenting directly the literal or implicit presence and possible
    meanings of “nomadism” in Isabelle’s writings, I shall begin with a critical examination
    of a 1911 review article by Norman Douglas. It contains all the symptoms that
    can let us diagnose the and the lasting impact of the “nomadic” metaphor, noting
    that a displacement occurs from the ideal of the “noble savage” or “nature’s gentleman,”
    primarily a social being, to a dominant figure of solitude—from Las Casas and
    Montaigne to Chaubandrift Dryden. Douglas’s article, titled “Intellectual Nomadism,”
    begins with evoking Isabelle’s death, crashed in a flash flood by the fall of
    the dilapidated house she shared in a semi-desert region of Algeria with her Arab
    husband, and how her manuscript notes, although much damaged, buried in the mud,
    were miraculously saved, reconstructed, edited and published by a journalist friend.
    The value of these writings is announced: they were well worth savings as fragments
    and because “a critic has called Isabelle the most vile and sincere writer of
    the Algerian country,”34 In other words, Isabelle is authentic (she proves a “fundamental
    simplicity”) and shows strength in her portrayal of a rough and exotic culture
    or of life, combining three elements: “her impressions of scenery interspersed
    with tales of native life and her reflections.”35 Douglas, without taking into
    account that Isabelle wrote in French and was brought up in French-speaking Switzerland,
    defines her affinity with the Algerian South ethnically: “her nature being essentially
    Russian, she can sympathize to an exceptional degree with the nomadic Arabs,”36
    Curiously, the “freedom” that naturally nomadic Russians seek abroad in the middle
    of other nomads, is de-ficted by the assertion that the Russian “autocratic system
    [...] merely represents the nomadic family principle of which every household
    in the land is a replica.”37 Moreover, “nomadism” is redefined as a disposition
    of the mind and the senses rather than physical mobility: “Isabelle Eberhardt
    [was not] gaddling across country all day with a portmanteau song over her shoulders.
    But [...] the nomad’s definite but indefinable states of yearning and exaltation,
    the nostalgic note, is prominent in these volumes.”38 Although Russians must have
    a measurable horizon, and as their bodies roam, so do their minds,” Isabelle’s
    writing remains, like herself, simple, efficient, to the point, while being more
    evocative, impressionistic, photographic. She is an artist, “like all artists,”
