    The combination of state and behavior is one of the cornerstones of object-oriented
    programming. Classes containing only behavior but lacking state indicate OO-design
    problems.


    In the code snippet here, the Hull class captures state and tracks the amount
    of its holes. The HullRepairUnit can fix those holes, and it captures behavior.


    The code above separates state and behavior into two distinct classes. This separation
    is something you’ll find quite often in a beginner’s code. Generic examples are
    a User and a UserController, or an Order and an OrderManager.


    The problem is that this separation prohibits information hiding, and it makes
    the code more verbose. The Hull class has to provide read and (much worse) write
    access of its state to the HullRepairUnit. It isn’t easy to prevent other objects
    from accessing and modifying the number of holes this way. On top of that, there’s
