    \ FizzBuzz to Find Developers who Grok Coding`. Some employers use this test in\
    \ job interviews to determine if an applicant can program at all. The task goes\
    \ like this:\n\n```\nWrite a Java program that prints the numbers from 1 to 100\
    \ to the console. But for multiples of three, print Fizz instead of the number\
    \ and for multiples of five, print Buzz. For numbers that are multiples of both\
    \ three and five, print FizzBuzz.\n```\n\nTo make the test more interesting, we’ll\
    \ extend it a bit here by making sure that you can apply object orientation and\
