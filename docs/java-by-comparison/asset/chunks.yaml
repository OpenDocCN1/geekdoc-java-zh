  trans: "\n\n在上面的代码中可以看到很多缩写：`DIR`、`CSV`、`GLOB`、`dirStr`、`bufW`、`lFile` 和 `csvLn`。你能立刻看出它们指的是什么吗？对于某些你可能知道，但可能并不是所有的。\n\
    \n脱离上下文，很难确定 `bufW` 或 `dirStr` 的含义。结合变量类型 `BufferedWriter` 和 `DirectoryStream`，它们就变得显而易见了，但这仍然是不必要的困难。\n\
    \n而且 `GLOB` 到底代表什么意思？它实际上是指代 Unix 环境中常见的通路径集，这正是上面代码的用途——例如，通过 `*.java` 所有的 Java\
    \ 文件。但你必须先知道这一点。\n\n有时候人们只缩写变量的一部分：`lFile` 或 `csvLn`。我们不得不发挥内心的夏洛克·福尔摩斯精神来找出 `l`\
    \ 或 `Ln` 代表什么。\n\n那么，我们该如何处理缩写呢？\n\n```java\nclass Logbook {\n    static final\
    \ Path LOG_FOLDER = Paths.get(\"/var/log\");\n    static final Path STATISTICS_CSV\
    \ = LOG_FOLDER.resolve(\"stats.csv\");\n    static final String FILE_FILTER =\
    \ \"*.log\";\n\n    void createStatistics() throws IOException {\n        try\
    \ (DirectoryStream<Path> logs = Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER);\n\
    \            BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV))\
    \ {\n            for (Path log : logs) {\n                String csvLine = String.format(\"\
    %s,%d,%s\",\n                    log,\n                    Files.size(log),\n\
    \                    Files.getLastModifiedTime(log));\n                writer.write(csvLine);\n\
    \                writer.newLine();\n            }\n        }\n    }\n}\n```\n\n\
    规则非常显而易见：只使用非常常见的缩写，对其他部分使用长名称。\n\n看看上面的代码。它变得更容易理解了，而且我们再也不会遇到奇怪的变量名了。\n\n首先，我们将\
    \ `DIR`、`CSV` 和 `GLOB` 这三个字段重命名为 `LOG_FOLDER`、`STATISTICS_CSV` 和 `FILE_FILTER`。在我们看来，`CSV`（逗号分隔值）是代码中唯一一个足够为人知的缩写。我们保留了它，并为其增加了一点背景信息。接下来，我们将缩写\
    \ `DIR` 和 `GLOB` 替换为简洁的非缩写名称。`FILE_FILTER` 比 `GLOB` 更好地表达了变量的意图。\n\n你不总是总是写出缩写的全称。对于\
    \ `bufW`，全称应该是 `bufferedWriter`。我们只使用第二个单词 `writer`，因为那是它在这里的用途。它带有缓冲区这一事实并不重要。作为\
    \ `dirStr` 的替代品，短名称 `logs` 似乎比全称 `directoryStream` 包含更多信息。\n\n最后，我们将变量 `csvLn`\
    \ 重命名为 `csvLine`。它的目的是表示它包含一行（CSV 文件的一行），那么为什么我们不能也直接叫它 `line` 呢？\n\n总结一下，你应该尽量避免缩写，只有在它们非常常见时才使用。如果有疑问，就写全！\n\
    \n## 避免无意义的术语\n\n```java\nclass MainSpaceShipManager {\n    AbstractRocketPropulsionEngine\
    \ abstractRocketPropulsionEngine;\n    INavigationController navigationController;\n\
    \    boolean turboEnabledFlag;\n\n    void navigateSpaceShipTo(PlanetInfo planetInfo)\
    \ {\n        RouteData data = navigationController.calculateRouteData(planetInfo);\n\
    \        LogHelper.logRouteData(data);\n        abstractRocketPropulsionEngine.invokeTask(data,\
    \ turboEnabledFlag);\n    }\n}\n```\n\n良好的命名不仅仅是写出短名称并让名称变长。有时，长名称可能同样是一种负担。而且程序员经常使用的某些术语已经失去了所有意义。\n\
    \n看看上面的代码。它不包含像*避免缩写* 章节那样的缩写，而且所有的名称都写全了，但这并不意味着命名是好的。里面有各种无意义的词，你可以直接删除它们。我们已经在真实的生产代码中见过很多这样的名称。\n\
    \n你能看出哪些词是没有任何意义、仅仅增加文本的吗？哪些部分可以在不影响理解力的情况下删掉？\n\n这里有一些“触手可得”的果实——人们经常使用的无意义术语，如“main”、“manager”、“data”、“info”或“flag”。它们很容易发现。但术语“abstract”、一个名为“invoke”的方法，或者一个方法名中的参数类型呢？这些有意义吗？其实并不真的。\n\
    \n### 简洁与命名：永恒的斗争\n\n命名的简洁并不一定是一种美德。大多数情况下，拥有一个冗长但描述性的名称优于一个晦涩的缩写，后者的唯一好处是容易输入。通常，你也不会输入全称。你\
    \ IDE 的自动补全会为你完成这一切。\n\n那么，哪些部分可以在不影响理解的情况下删掉？\n\n```java\nclass SpaceShip {\n\
    \    Engine engine;\n    Navigator navigator;\n    boolean turboEnabled;\n\n \
    \   void navigateTo(PlanetInfo destination) {\n        RouteData route = navigator.calculateRouteData(destination);\n\
    \        Logger.log(route);\n        engine.follow(route, turboEnabled);\n   \
    \ }\n}\n```\n\n实际上，我们可以删掉很多。比较一下这两个片段：我们删除了 100 个字符（约占代码的四分之一）。阅读和思考的内容少了很多。不错！让我们来过一遍。\n\
    \n首先，我们简单地删除了“data”、“info”或“flag”等无意义的术语。\n\n接下来，当阅读类型时，我们并不关心它是枚举、类、接口还是抽象类。毕竟，类型本身已经说明了这些。这就是为什么在类名为\
    \ `SpaceShip` 的类中可以去掉像 `rocket` 这样的领域限定符。接口名称的前缀 `I` 也是如此。不要这样做！\n\n类的名称为它的成员提供了上下文并传达了大量信息。这就是为什么你可以在方法名中去掉重复的类型，例如\
    \ `logRouteData()`，我们将其重命名为 `log()`。\n\n像 `invoke`、`call`或`do`这样的动词在方法名中传达的意义也很。与其使用这些词，你应该尝试寻找更精确、更有意义的动词。最后，我们经常在包名中看到无意义的术语。注意\
    \ `misc`、`other`或`util`等词。\n\n我们的建议是注意这里提到的术语，每当你想写它们时，都仔细考虑一下。一个术语是否有实际意义取决于具体的上下文。许多框架在决定方面也存在困难。Spring\
    \ 框架中的一个类名很有名：玫瑰是红的，叶子是绿的，但只有 Java 有 AbstractSingletonFactoryBean。\n\n## 使用领域术语\n\
    \n```java\nclass Person {\n    String lastName;\n    String role;\n    int travels;\n\
    \    LocalDate employedSince;\n\n    String serializeAsLine() {\n        return\
    \ String.join(\",\",\n            Arrays.asList(lastName,\n            role,\n\
    \            String.valueOf(travels),\n            String.valueOf(employedSince))\n\
    \        );\n    }\n}\n```\n\n你工作的代码通常属于一个特定的领域，而领域有自己的词汇。想想运动；不同的运动对于投掷、抛出、踢、弯曲或篮入不同的球有自己的领域特定术语。你将程序领域的术语插入代码得越多，就越好。\n"
- fmt: "\nIn the code above, you see a class for representing a person with a last\
    \ name, a role, the number of travels, and the date of employment. The class is\
    \ quite generic, and you can probably find something similar in most systems that\
    \ store employee data. You might still wonder why the code uses exactly these\
    \ attributes. Why does it only consider the last name and not also the first name?\
    \ And why does it track the number of travels?\n\nThe name of the method, `serializeAsLine()`,\
    \ is quite generic, too. From that name, we only know that this person’s fields\
    \ are serialized to a string without line breaks. But we don’t know if there’s\
    \ something specific about the format.\n\n## Are All Names Equally Important?\n\
    \nGood names matter, but the short answer is still no. As a rule of thumb, the\
    \ larger the scope of name, the higher its importance. The reason for that is\
    \ simple: a name with a large scope, such as a `class` or a `package`, is much\
    \ more likely to be read in comparison to a name with a small scope, such as a\
    \ `variable` within a `method`. That’s why you should put more effort into more\
    \ important names.\n\nTake a look at how domain-specific naming improves the readability\
    \ of the code:\n\n```java\nclass Astronaut {\n  String tagName;\n  String rank;\n\
    \  int missions;\n  LocalDate activeDutySince;\n\n  String toCSV() {\n    return\
    \ String.join(\",\",\n      Arrays.asList(\n        tagName,\n        rank,\n\
    \        String.valueOf(missions),\n        String.valueOf(activeDutySince))\n\
    \    );\n  }\n}\n```\n\nIn this book, we put the code examples in a domain inspired\
    \ by a Mars mission, and we fit all the names into this particular domain. This\
    \ automatically makes the code much clearer.\n\nWhen it’s put into context, the\
    \ meaning of the different attributes is much easier to understand. First of all,\
    \ we want to store data about an `Astronaut` and not just a `Person`, and that\
    \ should be obvious from the class name. Of course, an astronaut is also a person\
    \ in real life, but we’re only interested in astronaut-related aspects. In this\
    \ setting, the `lastname` is meant to be the writing on the tag an astronaut is\
    \ wearing, the `role` actually refers to the `rank` she’s in, and now `travels`\
    \ is also much clearer since it’s supposed to refer to the number of missions\
    \ in space. In the same fashion, `employedSince` actually refers to the `activeDutySince`.\n\
    \nBut the Mars mission isn’t the only domain in the class. Code deals with technical\
    \ concepts, which means that you’re always implicitly in a technical domain with\
    \ its own terminology. Because of this, we renamed the method `serializeAsLine()`\
    \ as `toCSV()`. After all, the resulting format of the serialized representation\
    \ of an astronaut is a line of comma-separated values. This makes the meaning\
    \ of the method more obvious to most programmers, simply because the term `CSV`\
    \ is very common in the programming domain, as we’ve seen in [Avoid Abbreviations](#f_0048.xhtml_sec.avoid_abbreviations).\n\
    \nTo sum up: You should align names in your code to the domain it belongs to as\
    \ far as possible and avoid generic names.\n\n## What Have You Learned?\n\nNaming\
    \ is one of the hardest tasks that you face in your day-to-day developer life.\
    \ Bad naming usually doesn’t stop your code from compiling (so no compiler will\
    \ help you to find really bad names), but it’ll make the code much harder to read\
    \ and understand. And that can turn the maintenance of your code into a nightmare.\n\
    \nThat’s why we’ve added this chapter on naming to the book. Good naming is less\
    \ clear-cut and well defined than the problems you’ve seen in some of the other\
    \ comparisons here. In our experience, you’re never done with proper naming. When\
    \ you look at a piece of code that you’ve written some time ago, chances are you’ll\
    \ find something to improve in naming, if only because you’ve had more time to\
    \ get acquainted with the terms of the domain. Our advice is to always refactor\
    \ when a better name comes to your mind.\n\nWhen it comes to naming, conventions\
    \ are half the rent. Even if you come up with a good name, it’s going to look\
    \ bad if it violates the Java conventions. Conventions are especially important\
    \ for naming getters and setters, which are about the only part of Java where\
    \ terrible naming can result in compile or runtime errors when you use certain\
    \ frameworks. But conventions aside, good names shouldn’t be too short (be careful\
    \ with single letters and abbreviations) or too long (packed with meaningless\
    \ terms), and hitting the right level is really hard. Your best bet is to always\
    \ align names to the domain you’re writing the code for.\n\nIn the next chapter,\
    \ we’ll move back to a topic that doesn’t just influence the understandability\
    \ of your code, but also its functional correctness: exception handling. No matter\
    \ what type of program you write, unforeseen things can happen, and it’s your\
    \ job to prepare for that. But as exception handling breaks the regular control\
    \ flow, it comes with big potential for introducing subtle bugs or implementing\
    \ it in a way that’s hard to understand. We’re going to show you some tips and\
    \ tricks to avoid that.\n\n#### Footnotes\n\n- [29](#f_0045.xhtml_FNPTR-29) :\
    \ [http://www.oracle.com/technetwork/java/codeconventions-150003.pdf](http://www.oracle.com/technetwork/java/codeconventions-150003.pdf)\n\
    - [30](#f_0046.xhtml_FNPTR-30) : [http://download.oracle.com/otndocs/jcp/7224-javabeans-1.01-fr-spec-oth-JSpec/](http://download.oracle.com/otndocs/jcp/7224-javabeans-1.01-fr-spec-oth-JSpec/)\n\
    - [31](#f_0046.xhtml_FNPTR-31) : We’re avoiding modifiers in other parts of the\
    \ book, but here they really matter.\n- [32](#f_0048.xhtml_FNPTR-32) : [http://www.osnews.com/story/19266/WTFs_m](http://www.osnews.com/story/19266/WTFs_m)\n\
    - [33](#f_0049.xhtml_FNPTR-33) : [http://www.bash.org/?962108](http://www.bash.org/?962108)\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\nThere are two ways to write error-free\
    \ programs; only the third works.\n\nAlan J. Perlis\n\n# Chapter 5\n\n## Prepare\
    \ for Things Going Wrong\n\nDo you own a car? Do you have insurance for it? If\
    \ not, you’d better get a policy now. It can cost you a lot of money, and chances\
    \ are, you’ll drive your car for thousands of miles without any trouble. But it\
    \ just takes a moment of bad luck to leave you with life-changing consequences.\
    \ That’s why you need insurance to act as a safety net for your really expensive\
    \ things (cars, houses) and your really important things (your health!).\n\nIt’s\
    \ similar with code. Most of the time, your program will execute just fine and\
    \ take the happy path (the default control-flow path without any exceptional or\
    \ erroneous conditions). But things can and will go wrong. When they do, you’ll\
    \ need a safety net. If you don’t have one, your program could suffer the consequences—it\
    \ can crash or produce faulty data. Or worst of all, it can continue to run as\
    \ if nothing happened—you won’t see the damage until much later, and by then,\
    \ you’ll have a hard time figuring out what’s wrong (not to mention all the data\
    \ that might have been corrupted by then).\n\nYou have to ensure your program\
    \ against errors even if it’s completely bug-free (and it never is). That’s because\
    \ there are things that you just can’t control. For example, a user might try\
    \ to read a file from a broken filesystem. Or the machine where your program is\
    \ running might be disconnected from the network. Or it might receive malicious\
    \ messages from a remote host.\n"
