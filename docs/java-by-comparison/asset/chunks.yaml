    Decisions are what make life hard. They do the same to code.


    Sometimes you have to make a hard decision in your code—one where there’s no objective
    right or wrong, one that has advantages and disadvantages. This is when you need
    comments!


    Consider the code above. Are you wondering why the programmer decided to use a
    binarySearch? Well, at least he left us a (helpful) comment: it has to be fast.


    The programmer made the decision to use binarySearch, but by saying yes to this
    option, you’re saying no to a lot of other options. Is the comment really a good
    justification for this? Think about what you would like to know here. And think
    about what answers the comment gives you.


    Here’s what we’d like to know: Why is it fast? Why does the code have to be fast?
    Is the binarySearch method really fast? What costs or trade-offs does this fast
    solution cause?


    And what does the comment state? Well, obviously there are no answers to these
    questions. So how could we improve this?


    Take a look at the new and extended comment:


    |   | **class** Inventory { |


