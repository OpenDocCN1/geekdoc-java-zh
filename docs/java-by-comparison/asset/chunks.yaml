    Any problem in computer science can be solved with another layer of indirection.
    But that usually will create another problem.


    David Wheeler


    # Chapter 7


    Design Your Objects


    Design is something that’s important in many disciplines. An architect, for example,
    can build a house that’s fully functional and ready to move into. Roof, windows,
    electricity, clean water, heating—everything can be in place and working.


    Still, you might not want to live there. Maybe it’s ugly; neon-painted walls and
    ceilings shelter you from the rain, but you don’t want to stare at those bright
    colors all the time. Maybe it’s inconvenient; a pillar in the center of your living
    room holds the roof up, but it also keeps you from watching TV from your sofa.


    These are exaggerations (hopefully!), but there could be smaller glitches that
    would annoy you in your new home.


    This is where design comes in. Our house shouldn’t just be functional. We want
    the architect to make it beautiful and convenient, too. The same applies to our
    classes and objects in Java. They shouldn’t just be functionally correct. They
    should be beautiful to look at, and they should be convenient to use.


    There are many little tricks that an architect can apply while designing a house.
    They might be so small that you don’t even notice that there’s a design rationale
    behind them. It’s the same with object-oriented design in Java. There are many
    little tricks you can apply to design your program.


    These tricks (read: best practices) are what this chapter is about. We’ll highlight
    some of Java’s most common design principles that help you to produce code that’s
    more object-oriented (beautiful) and robust (convenient).


    The best practices you’ll learn in this chapter aren’t just relevant when you
    write the code the first time. They’ll help you to improve existing code—for example,
    when you have to put a system under test.


    ## Split Method with Boolean Parameters


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path CAPTAIN_LOG = Paths.get(*"/var/log/captain.log"*);
    |


    |   | **static** **final** Path CREW_LOG = Paths.get(*"/var/log/crew.log"*); |


    |   |  |


    | » | **void** log(String message, **boolean** classified) **throws** IOException
    { |


    |   | **if** (classified) { |


    |   | writeMessage(message, CAPTAIN_LOG); |


    |   | } **else** { |


    |   | writeMessage(message, CREW_LOG); |


    |   | } |


    |   | } |


    |   |  |


    |   | **void** writeMessage(String message, Path location) **throws** IOException
    { |


    |   | String entry = LocalDate.now() + *" "* + message; |


    |   | Files.write(location, Collections.singleton(entry), |


    |   | StandardCharsets.UTF_8, StandardOpenOption.APPEND); |


    |   | } |


    |   | } |


    In general, a method should specialize on a single task only. Boolean method parameters
    show that a method does at least two things.


    In this example, we’re revisiting a refined version of the Logbook class. We separate
    messages into classified and non-classified messages via a boolean parameter of
    the log() method. Here’s a usage example:


    |   | logbook.log(*"Aliens sighted!"*, **true**); |


    |   | logbook.log(*"Toilet broken."*, **false**); |


    This code doesn’t contain a bug, but it’s less readable and structured than it
    should be. Everybody who reads it will have to figure out what purpose that boolean
    parameter serves. If people can figure out the purpose, there’s still a risk that
    they’ll interpret it the wrong way and write a classified message in the crew
    log.


    Using a boolean value as a method parameter helps you loudly to proclaim that
    the method does more than one thing. This is sometimes okay, but it generally
    makes your code less understandable because it’s hard to see on the calling side
    what the boolean parameter actually achieves. Furthermore, the two logs are coupled.
    If you want to make a change in the logic of the captain’s log, you risk that
    the changes affect the crew log, since they are handled in the same method. That’s
    nothing you want to have, right?'
