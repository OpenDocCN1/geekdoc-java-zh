    }\n}\n```\n\nDecisions are what make life hard. They do the same to code.\n\n\
    Sometimes you have to make a hard decision in your code—one where there’s no objective\
    \ right or wrong, one that has advantages and disadvantages. This is when you\
    \ need comments!\n\nConsider the code above. Are you wondering why the programmer\
    \ decided to use `binarySearch`? Well, at least he left us a (helpful) comment:\
    \ it has to be fast.\n\nThe programmer made the decision to use `binarySearch`,\
    \ but by saying yes to this option, you’re saying no to a lot of other options.\
    \ Is the comment really a good justification for this? Think about what you would\
    \ like to know here. And think about what answers the comment gives you.\n\nHere’s\
    \ what we’d like to know: Why is it fast? Why does the code have to be fast? Is\
    \ the `binarySearch` method really fast? What costs or trade-offs does this fast\
    \ solution cause?\n\nAnd what does the comment state? Well, obviously there are\
    \ no answers to these questions. So how could we improve this?\n\nTake a look\
    \ at the new and extended comment:\n\n```java\nclass Inventory {\n    /** Keep\
    \ this list sorted. See isInStock().*/\n    private List<Supply> list = new ArrayList<>();\n\
    \n    void add(Supply supply) {\n        list.add(supply);\n        Collections.sort(list);\n\
    \    }\n\n    boolean isInStock(String name) {\n        /**\n         * In the\
    \ context of checking availability of supplies by name,\n         * facing severe\
    \ performance issues with >1000 supplies\n         * we decided to use the binary\
    \ search algorithm\n         * to achieve item retrieval within 1 second,\n  \
    \       * accepting that we must keep the supplies sorted.\n         */\n    \
    \    return Collections.binarySearch(list, new Supply(name)) != -1;\n    }\n}\n\
    ```\n\nNow that comment is a lot more informative. It states the use case, concerns,\
    \ the solution, and also any trade-offs or costs we have to pay.\n\nThe comment\
    \ isn’t just more helpful now. It’s also easy to write. We simply used a template\
    \ and filled in the necessary bits. Take a look at it:\n\n```text\nIn the context\
    \ of [USE CASE],\nfacing [CONCERN]\nwe decided for [OPTION]\nto achieve [QUALITY],\n\
