  trans: "\n上方，你可以看到代码与上一次比较相比略有不同。这段代码不再仅仅计算 `supplies` 列表中所有元素的数量，而是计算按名称分组的可用物品数量，并以\
    \ `Map<String, Long>` 的形式呈现出来。如果你是 SQL 粉丝，你会觉得很高兴，因为这实际上与针对 `supplies` 表的 SQL\
    \ 查询 `SELECT name, count(*) FROM supplies GROUP BY name` 非常相似。\n\n这段代码包含了与上一次比较相同的问题：我们依赖副作用来计算\
    \ `Map<String, Long> nameToCount` 的内容。此外，`addToNames` 的实现也比避免副作用 中的实现稍微复杂一点。在实践中，这种代码几乎保证会更加复杂。而越复杂，就越难以理解。\n\
    \n那么，我们如何让这个复杂的流终止操作从副作用中解脱，并让它变得更易理解呢？\n\n```java\nclass Inventory {\n    List<Supply>\
    \ supplies = new ArrayList<>();\n\n    Map<String, Long> countDifferentKinds()\
    \ {\n        return supplies.stream()\n            .filter(Supply::isUncontaminated)\n\
    \            .collect(Collectors.groupingBy(Supply::getName,\n               \
    \ Collectors.counting())\n            );\n    }\n}\n```\n\n如果你想让流的结果是一个 `Collection`，Java\
    \ 为你提供了 `collect()` 操作符（我们在我们在避免副作用`、`toSet()` 或 `toMap()`。但还有其他几个，它们非常强大。\n\n\
    考虑上面的代码。首先，我们在 `Supply` 实例的流上使用了 `Collectors.groupingBy()` 操作符。该操作符将始终为你返回一个 `Map`\
    \ 数据结构。\n\n在这里，我们希望按名称对 `Supply` 对象分组。为了实现这一点，我们传递了方法引用 `Supply::getName`。这也指定了结果\
    \ `Map` 的键类型，在我们的例子中是 `String`。如果我们只使用它，那么表达式将返回类似 `Map<String, Collection<Supply>>`\
    \ 的内容。你可能已经发现了：得益于 `groupingBy()`，我们在这里不再需要 map 操作符了。\n\n但我们并未于此。`groupingBy()`\
    \ 的第二个参数是 `Collectors.counting()`。它统计了每个组内 `Supply` 实例的数量。结果，我们得到了一个每个名称物品数量的\
    \ `Map<String, Long>`，正符合所需。\n\n花一点时间比较一下两种解决方案的表达能力。这里使用 `collect()` 的方案比上一页的精确且直接得多，不是吗？而且读起来几乎就像描述性很强的\
    \ SQL 查询。\n\n你知道什么很棒的吗？还有许多额外的辅助收集器可用，如 `partitioningBy()`、`maxBy()`、`joining()`、`mapping()`、`summingInt()`、`averagingLong()`，当然还有\
    \ `reducing()`。在 Java 9 中，你甚至可以使用 `filtering()` 和 `flatMapping()`！\n\n## 在流中避免异常\n\
    \n```java\nclass LogBooks {\n    static List<LogBook> getAll() throws IOException\
    \ {\n        return Files.walk(Paths.get(\"/var/log\"))\n            .filter(Files::isRegularFile)\n\
    \            .filter(LogBook::isLogbook)\n            .map(path -> {\n       \
    \         try {\n                    return new LogBook(path);\n             \
    \   } catch (IOException e) {\n                    throw new UncheckedIOException(e);\n\
    \                }\n            })\n            .collect(Collectors.toList());\n\
    \    }\n}\n```\n\n正如你在第 5 章中所看到的，为错误做好准备，你应该准备好处理异常。不幸的是，这对于 lambda 表达式可能很困难。\n\
    \n在上面的代码中，我们使用 Java NIO API 通过流来遍历文件系统。`Files.walk()` 打开了一个从给定 `Path` 开始的 `Stream<Path>`，包含了该路径下的所有文件和目录。\n\
    \n但当你处理文件系统时，总有可能触发 `IOException`。例如，文件可能在已断的外部驱动器上，或者目录在运行时被另一个进程删除。\n\n从设计上来说，流与检查异常并不兼容。你必须在流内部处理它们。这就是为什么我们在\
    \ `map()` 操作中捕获了 `IOException` 并将其转换为自 `RuntimeException` 的 `UncheckedIOException`。\n\
    \n这是让整个表达式通过编译的一种方法，但并不美观。在 Java 的函数式风格中，没有任何恰机制来处理异常（即使是未检查异常）。本质上，这源于范式的不匹配。函数处理输入并产生输出。函数不抛出（或捕获）异常。\n\
    \n### 关闭 I/O 流\n\n文件系统是一种资源，你需要照顾它。始终关闭资源 出现在你脑海中。这里是这种情况吗？嗯，你看到任何关闭它的操作了吗？我们显然没有。\n\
    \n```java\nclass LogBooks {\n    static List<LogBook> getAll() throws IOException\
    \ {\n        try (Stream<Path> stream = Files.walk(Paths.get(\"/var/log\"))) {\n\
    \            return stream\n                .filter(Files::isRegularFile)\n  \
    \              .filter(LogBook::isLogbook)\n                .flatMap(path -> {\n\
    \                    try {\n                        return Stream.of(new LogBook(path));\n\
    \                    } catch (IOException e) {\n                        return\
    \ Stream.empty();\n                    }\n                })\n               \
    \ .collect(Collectors.toList());\n        }\n    }\n}\n```\n\n你可以看到，在上面的代码中我们仍然有一个\
    \ `try-catch` 块。这是无法避免的，但我们不再将检查异常转换为未检查异常。相反，我们简单地从流中移除异常元素。\n\n为了实现这一点，我们使用了\
    \ `flatMap()` 操作符。它与 `map()` 类似，但不是将一个类型映射到另一个类型，而是将一个类型映射到另一个类型的 `Stream`。如果一切顺利，我们只需通过\
    \ `Stream.of(element)` 为单个元素创建一个新流。如果出现问题，我们只需返回 `Stream.empty()`。\n\n这更符合函数式风格的范式。无论如何，异常都不会导致整个计算崩溃，流根据其输入产生输出。这使得对代码的推理和文档记录更加直观。当然，你也可以通过日志处理异常，但请记住这很容易导致副作用，从而违反纯函数范式。\n\
    \n简而言之：如果你能避免异常，在函数式风格中会更好。\n\n关闭 I/O 流\n\n我们在上面的代码中对 `Stream` 使用了 `try-with-resources`\
    \ 以确保资源被关闭。诚然，它看起来没有以前那么整洁，但它能完成工作。不要忘记这一点！\n\n## 优先使用 Optional 代替 null\n\n```java\n\
    class Communicator {\n    Connection connectionToEarth;\n\n    void establishConnection()\
    \ {\n        // 用于设置 connectionToEarth，但可能不可靠\n    }\n\n    Connection getConnectionToEarth()\
    \ {\n        return connectionToEarth;\n    }\n}\n```\n\n不指向对象的引用则指向空引用。如果你尝试在空引用上调用方法，就会导致\
    \ `NullPointerException`。这可能是 Java 中最为人知的异常。\n"
- fmt: "\nUsing null references is fine for internal state where you have full control\
    \ over how the reference is accessed. But exposing it makes the program fragile\
    \ because every caller needs to check for null, which is something that people\
    \ easily forget. This is what we’ve discussed in [Avoid Returning Null](#f_0081.xhtml_sec.avoid_returning_null).\
    \ But since Java 8 and lambda expressions, we have an alternative to the null\
    \ object solution.\n\nIn the code above, the `Connection` might not always be\
    \ available and `connectionToEarth` can be `null`. This can be a problem if the\
    \ calling code doesn’t check for null. Consider the following:\n\n```java\ncommunicator.getConnectionToEarth()\n\
    \  .send(\"Houston, we got a problem!\");\n```\n\nThis code can trigger the dreaded\
    \ `NullPointerException` if there’s no connection available.\n\nBut it’s easy\
    \ to fix. We just need to add an `if` statement to check whether the connection\
    \ we get from calling the getter isn’t `null`. \n\nStill, writing the fix isn’t\
    \ the hard part. That’s detecting the issue before that code goes into production.\
    \ Because you use references everywhere in Java, there’s simply too much potential\
    \ for null references to creep in. Every Java program runs into `NullPointerException`\
    \ at some point during development.\n\nWhat’s more, you can’t really combine the\
    \ fix with the `if` statement with lambda expressions in an elegant way. You’d\
    \ have to separate the expression into several lines instead. But there’s a better\
    \ solution.\n\nHow can we make it explicit that a `connectionToEarth` might be\
    \ absent?\n\n```java\nclass Communicator {\n\n    Connection connectionToEarth;\n\
    \n    void establishConnection() {\n        // used to set connectionToEarth,\
    \ but may be unreliable\n    }\n\n    Optional<Connection> getConnectionToEarth()\
    \ {\n        return Optional.ofNullable(connectionToEarth);\n    }\n}\n```\n\n\
    With the `Optional`. An `Optional` is a placeholder for an object that may or\
    \ may not be present. You create it by calling `Optional.ofNullable()` with a\
    \ reference that may point to an object or to `null`. Here, `connectionToEarth`\
    \ is either there or it isn’t.\n\nThe big difference is that you can now spot\
    \ the potential unavailability in the method signature. Consider the following\
    \ usage:\n\n```java\nConnection connection = communicator.getConnectionToEarth()\n\
    \  .orElse(null);\nconnection.send(\"Houston, we got a problem!\");\n```\n\nThis\
    \ reproduces the same behavior as the usage before, including the `NullPointerException`.\
    \ But it shows that either we get a `Connection` object orElse we get `null`.\n\
    \nInstead of hiding a `null` value in the `Communicator`, the `Optional` reveals\
    \ it in the caller’s code where the access would happen. That way, the `Optional`\
    \ forces the caller to think about how to handle an absent value. If you do this\
    \ as above (`orElse(null)`), you’ll still cause exceptions. So let’s fix this\
    \ here and now:\n\n```java\ncommunicationSystem.getConnectionToEarth()\n  .ifPresent(connection\
    \ ->\n    connection.send(\"Houston, we got a problem!\")\n  );\n```\n\nWithout\
    \ an `Optional` at hand, we would fix this with an `if` statement. But the `Optional`\
    \ provides a handy method: `ifPresent()`. This method executes a `Consumer` you\
    \ pass in, but only if the value within the `Optional` isn’t `null`. Here, we\
    \ simply pass in a `Consumer` that sends messages. `NullPointerException` prevented!\n\
    \nA `null` object for `Connection` could’ve solved this, too. But here we resort\
    \ to a generic null object: `Optional.empty()`. This saves us development effort,\
    \ but it’s at the expense of having to handle the `null` object explicitly every\
    \ time. With lambdas, the `Optional` class is usually the way to go.\n\n## Avoid\
    \ Optional Fields or Parameters\n\n```java\nclass Communicator {\n\n    Optional<Connection>\
    \ connectionToEarth;\n\n    void setConnectionToEarth(Optional<Connection> connectionToEarth)\
    \ {\n        this.connectionToEarth = connectionToEarth;\n    }\n\n    Optional<Connection>\
    \ getConnectionToEarth() {\n        return connectionToEarth;\n    }\n}\n```\n\
    \nIn [Favor Optional Over Null](#f_0090.xhtml_sec.favor_optional_over_null), you’ve\
    \ seen that you should rather return `Optional` values instead of `null` references.\
    \ When people learn about `Optional`, they start to apply it everywhere and for\
    \ everything. Don’t make this mistake! There are situations where `Optional` can\
    \ make your code more complicated and inconvenient to use. So let’s go over where\
    \ you should avoid it.\n\nIn the code above, we have an `Optional` field with\
    \ a setter and getter. From the outside, the code looks nearly identical to the\
    \ solution in [Favor Optional Over Null](#f_0090.xhtml_sec.favor_optional_over_null).\
    \ The getter returns an `Optional<Connection>`. This makes it explicit that the\
    \ `Connection` can be absent.\n\nThe problem is that the field, `connectionToEarth`,\
    \ itself is typed as optional. And there’s also a setter that accepts an `Optional<Connection>`.\
    \ This introduces more problems than it solves. Can you think why? We know `Optional`\
    \ has two states: absent (`Optional.empty()`) or present. But if you have optional\
    \ field or method, then variable can be `null`. So suddenly you have three states:\
    \ present, absent, or null. What’s it supposed to mean if `Optional` is null?\
    \ This isn’t clear from the code.\n\nUsing optional for fields or parameters just\
    \ makes everything more complicated. We can set fields to `null` and pass `null`\
    \ to methods. So what should you do if you encounter Optional fields or parameters?\n\
    \n```java\nclass Communicator {\n\n    Connection connectionToEarth;\n\n    void\
    \ setConnectionToEarth(Connection connectionToEarth) {\n        this.connectionToEarth\
    \ = Objects.requireNonNull(connectionToEarth);\n    }\n\n    Optional<Connection>\
    \ getConnectionToEarth() {\n        return Optional.ofNullable(connectionToEarth);\n\
    \    }\n\n    void reset() {\n        connectionToEarth = null;\n    }\n}\n```\n\
    \nIt’s relatively straightforward: you should remove the `Optional` part in the\
    \ types of fields and method parameters. You should keep the `Optional` types\
    \ only as return values. This removes the semantic overload between `Optional.empty()`\
    \ and `null` values.\n\nBut if you look at the code above, you can see that it’s\
    \ not as simple as changing types only. When we remove the `Optional` type of\
    \ the setter’s method parameter, we need to deal with the fact that you can insert\
    \ `null`. That was conveniently ignored in the code before. In this case, we check\
    \ for null values through the useful API method `Objects.requireNonNull()`.\n\n\
    We’ve also added an additional method, `reset()`, which gives meaning to anull\
    \ as prior input parameter. All usages of `null` references are completely internal\
    \ to the class, where we have full control on how the field is accessed.\n"
  raw: 'Using null references is fine for internal state where you have full control
    over how the reference is accessed. But exposing it makes the program fragile
    because every caller needs to check for null, which is something that people easily
    forget. This is what we’ve discussed in [*Avoid Returning Null*](#f_0081.xhtml_sec.avoid_returning_null).
    But since Java 8 and lambda expressions, we have an alternative to the null object
    solution.


    In the code above, the Connection might not always be available and connectionToEarth
    can be null. This can be a problem if the calling code doesn’t check for null.
    Consider the following:


    | » | communicator.getConnectionToEarth() |


    |   | .send(*"Houston, we got a problem!"*); |


    This code can trigger the dreaded NullPointerException if there’s no connection
    available.


    But it’s easy to fix. We just need to add an if statement to check whether the
    connection we get from calling the getter isn’t null.


    Still, writing the fix isn’t the hard part. That’s detecting the issue before
    that code goes into production. Because you use references everywhere in Java,
    there’s simply too much potential for null references to creep in. Every Java
    program runs into NullPointerException at some point during development.


    What’s more, you can’t really combine the fix with the if statement with lambda
    expressions in an elegant way. You’d have to separate the expression into several
    lines instead. But there’s a better solution.


    How can we make it explicit that a connectionToEarth might be absent?


    |   | **class** Communicator { |


    |   |  |


    |   | Connection connectionToEarth; |


    |   |  |


    |   | **void** establishConnection() { |


    |   | *// used to set connectionToEarth, but may be unreliable* |


    |   | } |


    |   |  |


    |   | Optional<Connection> getConnectionToEarth() { |


    | » | **return** Optional.ofNullable(connectionToEarth); |


    |   | } |


    |   | } |


    With the Optional. An Optional is a placeholder for an object that may or may
    not be present. You create it by calling Optional.ofNullable() with a reference
    that may point to an object or to null. Here, a connectionToEarth is either there
    or it isn’t.


    The big difference is that you can now spot the potential unavailability in the
    method signature. Consider the following usage:


    |   | Connection connection = communicator.getConnectionToEarth() |


    | » | .orElse(**null**); |


    |   | connection.send(*"Houston, we got a problem!"*); |


    This reproduces the same behavior as the usage before, including the NullPointerException.
    But it shows that either we get a Connection object orElse we get null.


    Instead of hiding a null value in the Communicator, the Optional reveals it in
    the caller’s code where the access would happen. That way, the Optional forces
    the caller to think about how to handle an absent value. If you do this as above
    (orElse(null)), you’ll still cause exceptions. So let’s fix this here and now:


    |   | communicationSystem.getConnectionToEarth() |


    | » | .ifPresent(connection -> |


    |   | connection.send(*"Houston, we got a problem!"*) |


    |   | ); |


    Without an Optional at hand, we would fix this with an if statement. But the Optional
    provides a handy method: ifPresent(). This method executes a Consumer you pass
    in, but only if the value within the Optional isn’t null. Here, we simply pass
    in a Consumer that sends messages. NullPointerException prevented!


    A null object for Connection could’ve solved this, too. But here we resort to
    a generic null object: Optional.empty(). This saves us development effort, but
    it’s at the expense of having to handle the null object explicitly every time.
    With lambdas, the Optional class is usually the way to go.


    ## Avoid Optional Fields or Parameters


    |   | **class** Communicator { |


    |   |  |


    | » | Optional<Connection> connectionToEarth; |


    |   |  |


    | » | **void** setConnectionToEarth(Optional<Connection> connectionToEarth) {
    |


    |   | **this**.connectionToEarth = connectionToEarth; |


    |   | } |


    | » | Optional<Connection> getConnectionToEarth() { |


    |   | **return** connectionToEarth; |


    |   | } |


    |   | } |


    In [*Favor Optional Over Null*](#f_0090.xhtml_sec.favor_optional_over_null), you’ve
    seen that you should rather return Optional values instead of null references.
    When people learn about Optional, they start to apply it everywhere and for everything.
    Don’t make this mistake! There are situations where Optional can make your code
    more complicated and inconvenient to use. So let’s go over where you should avoid
    it.


    In the code above, we have an Optional field with a setter and getter. From the
    outside, the code looks nearly identical to the solution in [*Favor Optional Over
    Null*](#f_0090.xhtml_sec.favor_optional_over_null). The getter returns an Optional<Connection>.
    This makes it explicit that the Connection can be absent.


    The problem is that the field, connectionToEarth, itself is typed as optional.
    And there’s also a setter that accepts an Optional<Connection>. This introduces
    more problems than it solves. Can you think why?


    We know that an Optional has two states: it’s absent (or Optional.empty()) or
    present. Those states make sense. But if you have an optional field or method
    parameter, then this variable can be null as well. So suddenly you have three
    states: present, absent, or null. What’s it supposed to mean if an Optional is
    null from a semantic point of view? Is it even more absent? That doesn’t really
    make sense. Maybe null in this case means that the current connection should be
    reset? This isn’t clear from the code.


    Using optional for typing fields or parameters just makes everything more complicated.
    We can set fields to null and pass null to methods even with Optional fields or
    parameters. If you use them, you’ll have to check not only for null values, but
    also whether a value is present.


    So what should you do if you encounter Optional fields or parameters?


    |   | **class** Communicator { |


    |   |  |


    | » | Connection connectionToEarth; |


    |   |  |


    |   | **void** setConnectionToEarth(Connection connectionToEarth) { |


    |   | **this**.connectionToEarth = Objects.requireNonNull(connectionToEarth);
    |


    |   | } |


    | » | Optional<Connection> getConnectionToEarth() { |


    | » | **return** Optional.ofNullable(connectionToEarth); |


    |   | } |


    |   |  |


    |   | **void** reset() { |


    | » | connectionToEarth = **null**; |


    |   | } |


    |   | } |


    It’s relatively straightforward: you should remove the Optional part in the types
    of fields and method parameters. You should keep the Optional types only as return
    values. This removes the semantic overload between Optional.empty() and null values.


    But if you look at the code above, you can see that it’s not as simple as changing
    types only. When we remove the Optional type of the setter’s method parameter,
    we need to deal with the fact that you can insert null. That was conveniently
    ignored in the code before. In this case, we check for null values through the
    useful API method Objects.requireNonNull().


    We’ve also added an additional method, reset(), which gives meaning to a null
    as prior input parameter. With the reset() method, it’s now possible to break
    the current connection without having to insert an explicit null into the setter.
    This is more robust and, as you may already have noticed, an application of [*Split
    Method with Optional Parameters*](#f_0076.xhtml_sec.split_method_with_optional_parameters).
    All usages of null references are completely internal to the class, where we have
    full control on how the field is accessed.


    The getter is still the same as in [*Favor Optional Over Null*](#f_0090.xhtml_sec.favor_optional_over_null).
    We convert the field into an Optional by calling Optional.ofNullable(). This goes
    hand in hand with the reset() method, which sets the field to null, because Optional.ofNullable(null)
    equals Optional.empty().'
  toc: []
  trans: "\n对于内部状态，由于你完全控制了引用的访问方式，使用 `null` 引用是可以接受的。但将其暴露出来会使程序变得脆弱，因为每个调用者都需要检查\
    \ `null`，而这正是人们容易忘记的。这就是我们在避免返回 null 中讨论过的内容。但自 Java 8 和 lambda 表达式出现以来，我们有了空空对象方案的替代方案。\n\
    \n在上面的代码中，`Connection` 可能并不总是可用的，且 `connectionToEarth` 可能为 `null`。如果调用代码没有检查 `null`，就会导致问题。考虑以下情况：\n\
    \n```java\ncommunicator.getConnectionToEarth()\n  .send(\"Houston, we got a problem!\"\
    );\n```\n\n如果没有可用的连接，这段代码可能会触发令人可怕的 `NullPointerException`。\n\n但这很容易修复。我们只需要添加一个\
    \ `if` 语句来检查从调用 getter 获取的连接是否不为 `null`。\n\n尽管如此，编写修复并不是难点。难点在于代码进入生产环境之前检测这些问题。因为在\
    \ Java 中你处处使用引用，所以 `null` 引用渗透进来的可能性太大了。每个 Java 程序在开发过程中某个时刻都会遇到 `NullPointerException`。\n\
    \n此外，你无法以优雅的方式将 `if` 语句修复方案与 lambda 表达式结合起来。你不得不将表达式拆分成几行。但有一个更好的解决方案。\n\n我们如何才能显式地表示\
    \ `connectionToEarth` 可能缺失？\n\n```java\nclass Communicator {\n\n    Connection\
    \ connectionToEarth;\n\n    void establishConnection() {\n        // 用于设置 connectionToEarth，但可能不可靠\n\
    \    }\n\n    Optional<Connection> getConnectionToEarth() {\n        return Optional.ofNullable(connectionToEarth);\n\
    \    }\n}\n```\n\n使用 `Optional`。`Optional` 是一个可能存在也可能不存在的对象的占位符。你通过调用 `Optional.ofNullable()`\
    \ 并传入一个可能指向对象或 `null` 的引用来创建它。在这里，`connectionToEarth` 要么存在，要么不存在。\n\n巨大的区别在于，你现在可以在方法签名中发现潜在的不可用性。考虑以下用法：\n\
    \n```java\nConnection connection = communicator.getConnectionToEarth()\n  .orElse(null);\n\
    connection.send(\"Houston, we got a problem!\");\n```\n\n这重现了之前用法相同的行为，包括 `NullPointerException`。但它显示了我们要么得到\
    \ `Connection` 对象，要么得到 `null`。\n\n`Optional` 并没有在 `Communicator` 中隐藏 `null` 值，而是在调用者代码中发生访问的地方揭示了它。这样，`Optional`\
    \ 强制要求调用者思考如何处理缺失的值。如果你像上面那样这样做（`orElse(null)`），你仍然会引发异常。所以让我们现在就修复它：\n\n```java\n\
    communicationSystem.getConnectionToEarth()\n  .ifPresent(connection ->\n    connection.send(\"\
    Houston, we got a problem!\")\n  );\n```\n\n如果没有 `Optional` 可用，我们将用 `if` 语句修复此问题。但\
    \ `Optional` 提供了一个方便的方法：`ifPresent()`。该方法会执行你传入的 `Consumer`，但只有当 `Optional` 内部的值不为\
    \ `null` 时才会执行。在这里，我们只需传入一个发送消息的 `Consumer`。`NullPointerException` 被防止了！\n\n`Connection`\
    \ 的 `null` 对象也可以解决这个问题。但在这里我们求助于通用的空对象：`Optional.empty()`。这节省了我们的开发精力，但代价是每次都必须显式处理\
    \ `null` 对象。配合 lambda，`Optional` 类通常是更好的选择。\n\n## 避免使用 Optional 字段或参数\n\n```java\n\
    class Communicator {\n\n    Optional<Connection> connectionToEarth;\n\n    void\
    \ setConnectionToEarth(Optional<Connection> connectionToEarth) {\n        this.connectionToEarth\
    \ = connectionToEarth;\n    }\n\n    Optional<Connection> getConnectionToEarth()\
    \ {\n        return connectionToEarth;\n    }\n}\n```\n\n在优先使用 Optional 而不是 Null\
    \ 中，你已经看到应该返回 `Optional` 值而不是 `null` 引用。当人们学习 `Optional` 时，他们开始到处对任何事情应用它。不要犯这个错误！在某些情况下，`Optional`\
    \ 会让你的代码变得复杂且不便于使用。所以让我们来看看你应该避免使用它的地方。\n\n在上面的代码中，我们有一个带有 setter 和 getter 的 `Optional`\
    \ 字段。从外部看，代码看起来与优先使用 Optional 而不是 Null 中的解决方案几乎相同。getter 返回一个 `Optional<Connection>`。这显式地表示了\
    \ `Connection` 可能缺失。\n\n问题是字段 `connectionToEarth` 本身被类型化为可选。而且还有一个接受 `Optional<Connection>`\
    \ 的 setter。这引入的问题比解决的要多。你想出为什么吗？我们知道 `Optional` 有两个状态：缺失（`Optional.empty()`）或存在。但如果你有可选字段或方法，那么变量可以是\
    \ `null`。所以你突然有了三种状态：存在、缺失或 `null`。如果 `Optional` 是 `null` 意味着什么？从代码中这并不清楚。\n\n\
    在字段或参数上使用 `Optional` 只会让一切变得更复杂。我们可以将字段设置为 `null` 并向方法传递 `null`。所以，如果你遇到可选的字段或参数，你该怎么办？\n\
    \n```java\nclass Communicator {\n\n    Connection connectionToEarth;\n\n    void\
    \ setConnectionToEarth(Connection connectionToEarth) {\n        this.connectionToEarth\
    \ = Objects.requireNonNull(connectionToEarth);\n    }\n\n    Optional<Connection>\
    \ getConnectionToEarth() {\n        return Optional.ofNullable(connectionToEarth);\n\
    \    }\n\n    void reset() {\n        connectionToEarth = null;\n    }\n}\n```\n\
    \n这非常直接：你应该移除字段和方法参数类型中的 `Optional` 部分。你应该只在返回值上保留 `Optional` 类型。这消除了 `Optional.empty()`\
    \ 和 `null` 值之间的语义重载。\n"
- fmt: "\nYou might point out now that the getter and setter no longer match the JavaBeans\
    \ conventions because their types differ. This can be a problem if you have to\
    \ integrate with frameworks that rely on this convention. In this case, you’re\
    \ forced to make do without `Optional` return types. Otherwise, `Optional` can\
    \ still make your program more robust by avoiding null values.\n\n## Use Optionals\
    \ as Streams\n\n```java\nclass BackupJob {\n    Communicator communicator;\n \
    \   Storage storage;\n\n    void backupToEarth() {\n        Optional<Connection>\
    \ connectionOptional = communicator.getConnectionToEarth();\n        if (!connectionOptional.isPresent())\
    \ {\n            throw new IllegalStateException();\n        }\n\n        Connection\
    \ connection = connectionOptional.get();\n        if (!connection.isFree()) {\n\
    \            throw new IllegalStateException();\n        }\n\n        connection.send(storage.getBackup());\n\
    \    }\n}\n```\n\nIn the previous comparisons, we’ve shown that `Optional` can\
    \ be a good replacement for null. But it’s not just that, and there’s a good reason\
    \ why the class was added to lambda expressions in Java. An `Optional` is also\
    \ a special kind of stream, one with either zero or exactly one element.\n\nThat\
    \ means that you can directly apply all regular stream operations, such as `filter()`\
    \ or `map()`, to an `Optional`. This makes for a good opportunity to write more\
    \ concise code.\n\nTake a look at the code above. It stores a (possibly absent)\
    \ value in the variable named `connectionOptional`. That’s necessary, because\
    \ we need to a) check if there’s an actual value by calling `isPresent()`, and\
    \ b) retrieve that value by calling `get()`. But it doesn’t really make for a\
    \ good or descriptive variable name.\n\nThe reason for storing the `Optional`\
    \ in a variable and its awkward name lies in an impedance mismatch. Although this\
    \ is barely visible in the code, the `Optional` class is made for the functional\
    \ programming style, where the rest of the method follows an imperative style.\
    \ When you switch between these styles, you have to use methods like `get()` to\
    \ perform the switch. You can make the code much more readable just by avoiding\
    \ this context switch.\n\nYou’ll find such switches very often in code in practice.\
    \ The functional programming style is still very new for Java. Many developers\
    \ aren’t yet familiar with it, or they have problems applying it fully. That’s\
    \ why they often switch back to an imperative style, even when they started differently.\n\
    \nCheck out how much you can improve the code by implementing everything functionally:\n\
    \n```java\nclass BackupJob {\n    Communicator communicator;\n    Storage storage;\n\
    \n    void backupToEarth() {\n        Connection connection = communicator.getConnectionToEarth()\n\
    \            .filter(Connection::isFree)\n            .orElseThrow(IllegalStateException::new);\n\
    \        connection.send(storage.getBackup());\n    }\n}\n```\n\nIt’s actually\
    \ quite simple. Just use the arsenal of methods available in the `Optional` class:\
    \ the intermediate operations `filter()`, `map()`, and `flatMap()`, and the terminal\
    \ operations `orElse()`, `orElseThrow()`, `orElseGet()`, and `ifPresent()`.\n\n\
    In the code above, we used `filter()` to check if the code is available and free\
    \ and `orElseThrow()` to trigger the exception if it’s not. That makes for a drastic\
    \ reduction of the amount of code. Just compare the code listings. In this case,\
    \ less is more!\n\nThe code is way more concise now. And that’s not just because\
    \ we got rid of the strange `connectionOptional` variable. The code also signals\
    \ clearly what happens if the connection is absent or not free through the `orElseThrow()`\
    \ operation. Before, this was distributed into two separate if conditions.\n\n\
    Other methods of `Optional` might be more appropriate in a different situation.\
    \ For example, if you don’t really care about an absent value, you can just call\
    \ `ifPresent()` instead. And if you’re only interested in reading from the `Optional`,\
    \ you can transform it and provide a default value with `.map().orElse(defaultValue)`.\n\
    \nThe latter usage is quite common. Take a look at an example in the code below:\n\
    \n```java\nString state = communicator.getConnectionToEarth()\n    .map(Connection::isFree)\n\
    \    .map(isFree -> isFree ? \"free\" : \"busy\")\n    .orElse(\"absent\");\n\
    ```\n\n## What Have You Learned?\n\nAs you’ve seen in this chapter, the functional\
    \ style really makes for a different way to program Java. You can be so much more\
    \ concise if you just describe what you want to achieve instead of instructing\
    \ the computer step-by-step.\n\nIf coding the imperative way still feels more\
    \ natural, remember that you just might be more familiar with this style. After\
    \ all, this was the way you learned first. Keep in mind that the unfamiliar is\
    \ not necessarily the more complex—you just need to get used to it. But you already\
    \ know the basics.\n\nYou’re able to iterate over data structures more efficiently\
    \ by converting them into streams, and you know how to get back into the imperative\
    \ style even in complex situations. You also learned how to interleave the functional\
    \ and the imperative style neatly with the help of method references when that’s\
    \ most appropriate—for example, to improve the testability of your methods. Anonymous\
    \ classes will no longer clutter up your code with irrelevant syntax because you\
    \ can just replace them with lambda expressions. You’ve learned how you can make\
    \ your program less fragile by using `Optional` return types instead of null values,\
    \ and how you can integrate `Optionals` with streams.\n\nBut it’s not just about\
    \ applying functional programming. You’ve also seen what can go wrong and where\
    \ you should be extra careful. You’re aware that side effects can damage the correctness\
    \ of your code, and the functional style doesn’t make for more readable code if\
    \ there’s a lot of exception handling involved. And although `Optional` values\
    \ are helpful, you know that they’re no good if you overuse them.\n\nBelieve it\
    \ or not, this is the end of the core part of this book. We’re really happy that\
    \ you’ve stuck with us this far. By now, you’ve certainly increased your knowledge\
    \ about clean and readable Java code.\n\nOf course, when you go into professional\
    \ software development, there are many more aspects to consider. So far, we’ve\
    \ hardly touched on concurrency, and there are important things you should know\
    \ about how you get from just code to a shippable product, like continuous integration\
    \ and delivery. We could continue with comparisons about those topics. But if\
    \ we did, the book would be 500 pages long and no one would want to read it. Instead,\
    \ we’ll give you a short outlook on several important aspects that we couldn’t\
    \ cover adequately here. In addition to a concise summary of those concepts, the\
    \ last chapter will provide you with references and links to reading material\
    \ that will take you into more depth for these topics. Then you’ll know exactly\
    \ how to continue after you’ve finished this book. Never stop learning!\n\n###\
    \ Footnotes\n\n- [44](#f_0085.xhtml_FNPTR-44): [https://martinfowler.com/articles/collection-pipeline/](https://martinfowler.com/articles/collection-pipeline/)\n\
    - [45](#f_0085.xhtml_FNPTR-45): [https://docs.oracle.com/javase/9/docs/api/java/util/stream/package-summary.html#StreamOps](https://docs.oracle.com/javase/9/docs/api/java/util/stream/package-summary.html#StreamOps)\n\
    - [46](#f_0087.xhtml_FNPTR-46): [https://docs.oracle.com/javase/9/docs/api/java/util/stream/Stream.html](https://docs.oracle.com/javase/9/docs/api/java/util/stream/Stream.html)\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\nThe first 90% of the code accounts\
