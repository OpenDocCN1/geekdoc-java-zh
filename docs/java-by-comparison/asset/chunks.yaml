    |   | } |


    |   | } |


    By default, the state of objects is mutable. Whenever possible, you should make
    the state immutable because this makes objects harder to misuse.


    The code here computes and converts distances for route planning. There’s no immediate
    bug in the code, but the problem is that the Distance class doesn’t defend itself
    from misuse. Consider the following code:


    |   | Distance toMars = **new** Distance(DistanceUnit.KILOMETERS, 56_000_000);
    |


    |   | Distance marsToVenus = **new** Distance(DistanceUnit.LIGHTYEARS, 0.000012656528);
    |


