    \ Map<Double, Double> values = new HashMap<>();\n\n    Double square(Double x)\
    \ {\n        Function<Double, Double> squareFunction = new Function<Double, Double>()\
    \ {\n            @Override\n            public Double apply(Double value) {\n\
    \                return value * value;\n            }\n        };\n        return\
    \ values.computeIfAbsent(x, squareFunction);\n    }\n}\n```\n\nIn Java 8, several\
