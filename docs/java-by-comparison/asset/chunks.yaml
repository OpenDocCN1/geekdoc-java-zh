    ## You May Be Interested In…


    *Select a cover for more information*


    ### Software Design X-Rays


    [![](OEBPS/Images/atevol.jpg)](http://pragmaticprogrammer.com/titles/atevol)


    Are you working on a codebase where cost overruns, death marches, and heroic fights
    with legacy code monsters are the norm? Battle these adversaries with novel ways
    to identify and prioritize technical debt, based on behavioral data from how developers
    work with code. And that’s just for starters. Because good code involves social
    design, as well as technical design, you can find surprising dependencies between
    people and code to resolve coordination bottlenecks among teams. Best of all,
    the techniques build on behavioral data that you already have: your version-control
    system. Join the fight for better code!


    Adam Tornhill


    (274 pages) ISBN: 9781680502725 $45.95


    ### Release It! Second Edition


    [![](OEBPS/Images/mnee2.jpg)](http://pragmaticprogrammer.com/titles/mnee2)


    A single dramatic software failure can cost a company millions of dollars—but
    can be avoided with simple changes to design and architecture. This new edition
    of the best-selling industry standard shows you how to create systems that run
    longer, with fewer failures, and recover better when bad things happen. New coverage
    includes DevOps, microservices, and cloud-native architecture. Stability antipatterns
    have grown to include systemic problems in large-scale systems. This is a must-have
    pragmatic guide to engineering for production systems.


    Michael Nygard


    (376 pages) ISBN: 9781680502398 $47.95


    ### A Common-Sense Guide to Data Structures and Algorithms


    [![](OEBPS/Images/jwdsal.jpg)](http://pragmaticprogrammer.com/titles/jwdsal)


    If you last saw algorithms in a university course or a job, you’re missing out
    on what they can do. Learn different structures and use them for specialized applications,
    such as trees and graphs.


    Jay Wengrow


    (218 pages) ISBN: 9781680502442 $45.95


    ### Design It!


    [![](OEBPS/Images/mksa.jpg)](http://pragmaticprogrammer.com/titles/mksa)


    Don’t engineer by coincidence—design it like you mean it! Grounded by fundamentals
    and filled with practical design, this is the perfect introduction for programmers
    who are ready to grow. Ask the right questions, explore design options, and lead
    your team in implementing new capabilities.


    Michael Keeling


    (358 pages) ISBN: 9781680502091 $41.95


    ### tmux 2


    [![](OEBPS/Images/bhtm2.jpg)](http://pragmaticprogrammer.com/titles/bhtm2)


    Your mouse is slowing you down. The time you spend context switching between your
    editor and your consoles eats away at your productivity. Take control of your
    environment with `tmux`, a terminal multiplexer you can tailor to your workflow.
    With this updated second edition for `tmux 2.3`, you’ll customize, script, and
    leverage `tmux`’s unique abilities.


    Brian P. Hogan


    (102 pages) ISBN: 9781680502213 $21.95


    ### Modern Vim


    [![](OEBPS/Images/modvim.jpg)](http://pragmaticprogrammer.com/titles/modvim)


    Turn Vim into a full-blown development environment using Vim 8’s new features
    and this sequel to the beloved Practical Vim. Integrate your editor with tools
    for building, testing, linting, and searching your codebase. Discover the future
    of Vim with Neovim: a fork of Vim that includes a built-in terminal emulator that
    will transform your workflow. Whether you choose to switch to Neovim or stick
    with Vim 8, you’ll be a better developer.


    Drew Neil


    (190 pages) ISBN: 9781680502626 $39.95


    ### Functional Programming in Java


    [![](OEBPS/Images/vsjava8.jpg)](http://pragmaticprogrammer.com/titles/vsjava8)


    Get ready to program in a whole new way. Functional Programming in Java will help
    you quickly get on top of the new, essential Java 8 language features and the
    functional style that will change and improve your code. This short, targeted
    book will help you make the paradigm shift from the old imperative way to a less
    error-prone, more elegant, and concise coding style that’s also a breeze to parallelize.
    You’ll explore the syntax and semantics of lambda expressions, method and constructor
    references, and functional interfaces. You’ll design and write applications better
    using the new standards in Java 8 and the JDK.


    Venkat Subramaniam


    (196 pages) ISBN: 9781937785468 $33

