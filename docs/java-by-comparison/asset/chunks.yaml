  raw: 'So is this comment enough? Do you know what happens when you pass null instead
    of a Queue instance? Can a runtime exception occur for certain inputs?


    No. No. And no idea. We have no clue how the method will behave, even though there’s
    a JavaDoc comment. So if we use this method, we’re no longer certain how our code
    will behave. That would be especially problematic if you’re building an API.


    Let’s see what we can do about it:


    |   | **interface** CargoShip { |


    |   |  |


    |   | Stack<Supply> unload(); |


    |   |  |


    |   | */*** |


    | » | ** Loads supplies onto the cargo ship.* |


    |   | *** |


    |   | ** <p>* |


    |   | ** Only lets you load as many supplies as there is remaining capacity.*
    |


    |   | *** |


    |   | ** Example:* |


    |   | ** <pre>* |


    |   | ** int capacity = cargoShip.getRemainingCapacity(); // 1* |


    |   | ** Queue&lt;Supply> supplies = Arrays.asList(new Supply("Apple"));* |


    |   | ** Queue&lt;Supply> spareSupplies = cargoShip.load(supplies);* |


    |   | ** spareSupplies.isEmpty(); // true;* |


    |   | ** cargoShip.getRemainingCapacity() == 0; // true* |


    |   | ** </pre>* |


    |   | *** |


    |   | ** @param supplies to be loaded; must not be null* |


    |   | ** @return supplies that could not be loaded because of too little* |


    |   | ** capacity; is empty if everything has been loaded* |


    |   | ** @throws NullPointerException if supplies is null* |


    |   | ** @see CargoShip#getRemainingCapacity() check capacity* |


    |   | ** @see CargoShip#unload() unload the supplies* |


    |   | **/* |


    |   | Queue<Supply> load(Queue<Supply> supplies); |


    |   |  |


    |   | **int** getRemainingCapacity(); |


    |   | } |


    This is much better now. The JavaDoc comment reads like a contract. It states
    how the input and its internal state must be to guarantee a certain output and
    state change.


    The contract covers a good case with a description and a code example. Note that
    the < characters must be escaped with &lt; because <pre> is an XML environment.


    Even invalid input, such as null, is specified in the @param description, along
    with the consequences of a violation: @throws a NullPointerException.


    What’s more, the comment refers to other methods via the @see annotation. It describes
    how you can undo the effects of the method or observe state changes caused by
    calling the method.


    Just keep this in mind: the contract metaphor doesn’t fully apply—you can’t usually
    sue someone if the implementation differs from its specification.


    ## Structure JavaDoc of Constructors


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies; |


    |   |  |


    |   | */*** |


    | » | ** Constructor for a new Inventory.* |


    |   | **/* |


    |   | Inventory() { |


    |   | **this**(**new** ArrayList<>()); |


    |   | } |


    |   |  |


    |   | */*** |


    | » | ** Another Constructor for a new Inventory.* |


    |   | *** |


    |   | ** It is possible to add some supplies to the Inventory.* |


    |   | **/* |


    |   | Inventory(Collection<Supply> initialSupplies) { |


    |   | **this**.supplies = **new** ArrayList<>(initialSupplies); |


    |   | } |


    |   | } |


    There’s one special type of method in Java that you can’t assign a good and meaningful
    name to: constructors. They always have the same name as the class. They may have
    a clearer purpose than other methods (they always construct an object), but if
    you misuse them, those objects will be flawed. That’s why you have to explain
    constructors with good and informative JavaDoc comments.


    In the example above, the JavaDoc is poorly done. Neither of the summary sentences
    really carry new information, and they are rather obsolete. The second sentence
    in the lower constructor also misses the point. How are the supplies added exactly?
    Does the addition refer to the parameter initialSupplies or is there another method
    for that?


    Also, there’s no hint on how the two constructors are related to each other. Normally
    when you use a third-party class, you don’t read the sources—only the JavaDoc.
    That’s why the JavaDoc comment of a constructor^([[28]](#f_0043.xhtml_FOOTNOTE-28))
    must explain everything necessary for a programmer to use it.


    So what do you have to know to use this class correctly?


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies; |


    |   |  |


    |   | */*** |


    | » | ** Creates an empty inventory.* |


    |   | *** |


    |   | ** @see Inventory#Inventory(Collection) instantiate with initial supplies*
    |


    |   | **/* |


    |   | Inventory() { |


    |   | **this**(**new** ArrayList<>()); |


    |   | } |


    |   |  |


    |   | */*** |


    | » | ** Creates an inventory with an initial shipment of supplies.* |


    |   | *** |


    |   | ** @param initialSupplies Initial supplies.* |


    |   | ** Must not be null, can be empty.* |


    |   | ** @throws NullPointerException if initialSupplies is null* |


    |   | ** @see Inventory#Inventory() instantiate with no supplies* |


    |   | **/* |


    |   | Inventory(Collection<Supply> initialSupplies) { |


    |   | **this**.supplies = **new** ArrayList<>(initialSupplies); |


    |   | } |


    |   | } |


    The first and most important thing you need to know is how to call a constructor
    correctly. You especially need to know what preconditions you have to fulfill
    so that everything works out as desired. The default constructor doesn’t really
    have preconditions and no input parameter, but the second one does: a Collection
    of Supply objects called initialSupplies. We have to document this one like we
    do with other method parameters. Here, you’re not allowed to enter null, and if
    you do, then you get a NullPointerException back. The comment states this in the
    @throws part.


    Second, you need information about the state of the object when the constructor
    finishes, because its state determines which other methods you can call at this
    point. That’s called a postcondition. In the code above, the inventory’s either
    going to be in an “empty” state or filled with “initial supplies.” The summary
    sentences of both constructors describe that.


    But there’s even more in the comments: two @see annotations. These annotations
    provide hints to the developer. They outline alternatives that she may not have
    seen otherwise. Here, we use these annotations to explain the relationship between
    the two constructors.


    Because constructors lack a name, their JavaDoc is just so important!


    ## What Have You Learned?


    In this chapter, you learned when and how to write helpful comments. This might
    seem so unimportant. After all, who cares about something that the compiler deletes?


    In fact, it’s quite the opposite! Good comments can help you make your code base
    more readable and easier to understand. They can be a superb way of helping the
    future maintainer—that is, as long as you apply them only when they’re really
    needed and in a way that actually helps.


    That’s why we started this chapter by going over when you should use comments
    and when you should get rid of them. You’ve learned that it’s always good to remove
    superfluous comments and even commented-out code. After all, the version control
    system won’t forget it. Now you can also transform comments into code by extracting
    constants or utility methods. This gives you more support from the compiler.


    But it is not just about removing comments, of course! You also learned to structure
    your documentation in a way that helps others, whether you are explaining the
    design decisions for your implementation or a regular expression.


    Since documentation is also about conventions, we showed you how you can leverage
    JavaDoc to build well-documented packages, interfaces, and methods.


    We’re still far from done! As you’ve seen here, conventions help you to write
    understandable documentation. But you can still confuse everybody if your variables
    are all named x, y, and z. Surely you remember your math lessons in school? In
    the next chapter, we’ll show you how to assign good names to code structures so
    that other Java developers have an easy time understanding.


