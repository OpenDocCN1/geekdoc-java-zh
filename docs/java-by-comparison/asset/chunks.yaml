    First, the supplies field uses the interface type List instead of LinkedList.
    This tells us that the supplies are stored in an order but not how they’re stored
    (in an array for the ArrayList or through linked wrapper objects for the LinkedList).


    Second, the method stockUp() accepts any Collection now. This is Java’s most general
    interface for storing objects in a data structure. It means that you can pass
    any subtype of Collection, any complex data structure in Java, into the method.


    Third, the method getContaminatedSupplies() returns a List instead of a more specific
    type. We guarantee only that the supplies are ordered, but not how the list is
    implemented internally. This makes the code more flexible.


