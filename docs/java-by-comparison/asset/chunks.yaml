  trans: "\n\n此模板实际上源自 *Sustainable Architectural Design Decisions* ZCTZ13 的科学建议。更多模板可以在\
    \ [`adr.github.io`](http://adr.github.io) 获取。\n\n26\n\n[`www.oracle.com/technetwork/articles/java/index-137868.html`](http://www.oracle.com/technetwork/articles/java/index-137868.html)\n\
    \n27\n\n你需要将包的 JavaDoc 放入 `package-info.java` 文件中。同样，对于 Java 9 中的模块，有一个专门的 `module-info.java`\
    \ 文件。\n\n28\n\n然而，有时完全隐藏构造函数并暴露一个具有意义的静态方法会更好，该方法在内部调用隐藏的构造函数——这就是所谓的“工厂方法”。\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\n计算机科学只有两个棘手的问题：缓存失效和命名。\n\nPhil\
    \ Karlton\n\n# 第 4 章：正确命名\n\n## 命名的词源\n\n在挪威语中，“驼鹿（moose）”一词是“elg”。当第一批来自欧洲的北方定居者来到北美，在森林里看到这种巨大的像\
    \ elg 的动物时，他们决定：“好吧，那这里就叫它 elg 吧”（或者英语拼写为 elk）。结果证明，他们完全错了。定居者恰好先遇到的是一种马鹿（wapiti）——一种完全不同的鹿。北美确实有一种与欧洲“elg”亲缘很近的动物，但那是驼鹿。直到今天，这个小命名错误导致了北美和欧洲荒野爱好者之间巨大的困惑，并导致在斯堪堪纳维亚的每次“elg\
    \ 之游”开始时引发关于词源的讨论。\n\n起一个好名字非常困难。即使是专家也很难第一次就出一个好名字。欧洲定居者对驼鹿有一个概念，但他们仍然不小心把它分配给了错误的动物。\n\
    \n对于代码来说，命名更加困难。代码没有角或其他大多数人能识别的属性。它是抽象的，而且在大多数时候，它也是完全全新的且具有高度领域性的。\n\n这就是为什么良好的命名在编程中更重要。我们需要为很多东西命名：包、类、方法、字段、参数和局部变量。这些元素通常代表了某些未知或难以理解的东西。这使得寻找一个好名字变得非常困难，尤其是在开始阶段。之后在大量使用某个元素后，你可能会发现更容易起一个更好的名字，因为你能够轻松地联系到该概念。\n\
    \n本节中的对比将帮助你为代码元素找到更好的名字。我们将向你展示为什么在命名时 Java 规范很重要，为什么在命名方法时应该保持简洁，以及如何避免无意义或单字母的命名。\n\
    \n## 使用 Java 命名规范\n\n```java\nclass Rover {\n    static final double WalkingSpeed\
    \ = 3;\n    final String SerialNumber;\n    double MilesPerHour;\n\n    Rover(String\
    \ NewSerialNumber) {\n        SerialNumber = NewSerialNumber;\n    }\n\n    void\
    \ Drive() {\n        MilesPerHour = WalkingSpeed;\n    }\n\n    void Stop() {\n\
    \        MilesPerHour = 0;\n    }\n}\n```\n\n在 Java 中我们需要命名很多东西：包、类、接口、枚举、方法、变量、字段、参数和常量。看看上面的代码——它包含了许多名字。你发现什么奇怪的地方了吗？你看出规律来了吗？\n\
    \n我们一致地使用驼峰命名法（CamelCase）命名了一切：没有空格，且所有单词的首字母都大写。只要我们保持一致，我们就可以选择任何命名方式，不是吗？\n\
    \n嗯，理论上可以，但实践中不行！市面上那些被认为是专业的 Java 代码遵循不同的风格。对我们来说，上面的代码不仅难以阅读——甚至感觉非常糟糕。为了清楚起见：这没有功能性上的错误。但对于一个\
    \ Java 程序员来说，这读起来不像 Java 代码。\n\n### 包名又是怎样的？\n\n是的，你被我们抓了。我们没有在代码段中介绍包名。实际上，我们在书中也从未涉及过。但它们也很重要。包的作用类似于全局命名空间，你不应该在在两个包具有相同标识符的情况下发生命名冲突。在互联网上，域名系统（DNS）是我们已知的最大的全局命名空间。因为我们程序员不想重复造轮子，所以通常简单地将域名转换为包名。例如，我们书的\
    \ URL `pragprog.com/book/javacomp` 对应的包名为 `com.pragprog.book.javacomp`。就像域名中一样，我们在\
    \ Java 包名中也不使用大写字母。\n\n### 如何修改代码\n\n```java\nclass Rover {\n    static final\
    \ double WALKING_SPEED = 3;\n    final String serialNumber;\n    double milesPerHour;\n\
    \n    Rover(String serialNumber) {\n        this.serialNumber = serialNumber;\n\
    \    }\n\n    void drive() {\n        milesPerHour = WALKING_SPEED;\n    }\n\n\
    \    void stop() {\n        milesPerHour = 0;\n    }\n}\n```\n\n自 1997 年以来，我们有了格式的\
    \ Java 规范。上面我们修改了代码以符合 Java 规范：类和接口使用驼峰命名。为了让常量（final 和 static 变量）脱颖而出，你应该使用大写下划线（CAPITAL_SNAKE_CASE）编写它们的名称。这意味着名称中的所有字母都是大写的，并用下划线分隔。\n\
    \n方法、字段、参数和变量使用驼峰命名法（camelCase）的变体，首字母小写。这种方法的缺点是会导致方法（行为）和变量（状态）名称的混淆，因为它们的命名方案相同。这就是为什么名称应该告诉读者它是方法还是变量。你应该用动词命名方法，如上面代码中的\
    \ `drive()`，或者让它们以 `is`、`has`、`save`、`get` 或 `set` 开。对于变量，使用名词，例如 `serialNumber`\
    \ 或 `milesPerHour`。\n\nJava 规范只是良好的第一步。关键在于如果不符合规范，你永远不会好名字（相反，符合规范的好名字是完全可能的且随处可见）。\n\
    \n## 为框架遵循 Getter/Setter 规范\n\n```java\nclass Astronaut {\n    String name;\n\
    \    boolean retired;\n\n    Astronaut(String name) {\n        this.name = name;\n\
    \    }\n\n    String getFullName() {\n        return name;\n    }\n\n    void\
    \ setFullName(String name) {\n        this.name = name;\n    }\n\n    boolean\
    \ getRetired() {\n        return retired;\n    }\n\n    void setRetiredState(boolean\
    \ retired) {\n        this.retired = retired;\n    }\n}\n```\n\n在面向对象的编程语言中，你通常会避免从外部直接访问类的字段。这就是你编写\
    \ getter 和 setter 方法来控制这种访问的原因。\n\n"
- fmt: "\nThe structure and naming of getters and setters is so standardized that\
    \ many frameworks heavily rely on it. Hibernate uses it to convert Java instances\
    \ and rows in a SQL database, Jackson uses it for JSON messages, and even the\
    \ Play Framework uses it for building HTML forms. That’s why getters and setters\
    \ have a specification of their own, the JavaBeans specification. We call classes\
    \ that follow that convention `JavaBeans` and yes, it somehow stretches that coffee\
    \ metaphor of Java.\n\nTake a look at the code above. Does every field have a\
    \ correctly named getter and setter? Is there a constructor without any parameters?\
    \ Are the visibility levels correct?\n\nNo, they’re not. Strange things can happen\
    \ when you use instances of that class within frameworks. Most frameworks won’t\
    \ throw exceptions but will fail silently—or simply work in ways you didn’t expect.\n\
    \nSo what do we need to change to turn this class into a JavaBean?\n\n```java\n\
    class Astronaut {\n    private String name;\n    private boolean retired;\n\n\
    \    public Astronaut() {\n    }\n\n    public Astronaut(String name) {\n    \
    \    this.name = name;\n    }\n\n    public String getName() {\n        return\
    \ name;\n    }\n\n    public void setName(String name) {\n        this.name =\
    \ name;\n    }\n\n    public boolean isRetired() {\n        return retired;\n\
    \    }\n\n    public void setRetired(boolean retired) {\n        this.retired\
    \ = retired;\n    }\n}\n```\n\nWe’ve reworked the code in a number of ways. Now\
    \ the class above is a valid JavaBean. First, we changed the modifiers of the\
    \ fields to `private` and the getters and setters to `public`. This ensures that\
    \ frameworks will use the getters and setters and won’t circumvent them by accessing\
    \ fields directly.\n\nNext, we added a default constructor. Most frameworks need\
    \ this to create a blank instance of a class, which they configure by calling\
    \ setters to assign values to fields. You can easily overlook this part because\
    \ the default constructor isn’t available anymore if you add another one with\
    \ parameters.\n\nAnd last, we renamed the setters and getters to reflect the name\
    \ of the field. If the field has the name `foo` then the getter and setter should\
    \ be named `getFoo()` and `setFoo()`. Be aware that this changes slightly for\
    \ a boolean field. The name of the setter stays the same, but the getter turns\
    \ to `isFoo()` instead—it reads like a question. Too bad Java doesn’t allow us\
    \ to put a question mark there.\n\nOne last note: We’re not saying that JavaBeans\
    \ are a great way of writing code, but you’ll have to use them for some frameworks\
    \ in Java.\n\n## Avoid Single-Letter Names\n\n```java\nclass Inventory {\n   \
    \ List<Supply> sl = new ArrayList<>();\n\n    boolean isInStock(String n) {\n\
    \        Supply s = new Supply(n);\n        int l = 0;\n        int h = sl.size()\
    \ - 1;\n\n        while (l <= h) {\n            int m = l + (h - l) / 2;\n   \
    \         int c = sl.get(m).compareTo(s);\n            if (c < 0) {\n        \
    \        l = m + 1;\n            } else if (c > 0) {\n                h = m -\
    \ 1;\n            } else {\n                return true;\n            }\n    \
    \    }\n        return false;\n    }\n}\n```\n\nIn most code bases, you’ll often\
    \ find a variable whose name is just a single letter. They’re common because they’re\
    \ quicker to type and because some IDEs still generate names in this way. But\
    \ they make the code much harder to read. After all, how much meaning can you\
    \ convey in a single letter?\n\nLet’s look at the code above. It shows an `Inventory`\
    \ class with the method `isInStock`. All variables inside this method have single\
    \ letter names: `n`, `l`, `h`, `m`, `c`, `s`.\n\nCan you understand what’s going\
    \ on inside the method? Actually, it’s just an ordinary binary search. But we’re\
    \ having a hard time reading that from the code because of the variable names.\n\
    \nThere’s no excuse for using single-letter names. Although some theorists would\
    \ like it to be so, code is much more than pure math. An average programmer reads\
    \ thousands of lines of code per day. This task doesn’t get easier if everywhere\
    \ she looks, variables have the same names, which aren’t connected to the context\
    \ of a piece of code. That’s why we should put meaning in variable names, and\
    \ we can’t do that with just one letter.\n\nOn a side note: the code uses the\
    \ lowercase letter `l` and the number `1`. They’re very hard to distinguish in\
    \ most fonts. Our advice: Simply avoid the single letter `l` as a variable name.\
    \ Same for the uppercase `O` and the number `0`.\n\nSo let’s see what difference\
    \ longer variable names can make.\n\n```java\nclass Inventory {\n    List<Supply>\
    \ sortedList = new ArrayList<>();\n\n    boolean isInStock(String name) {\n  \
    \      Supply supply = new Supply(name);\n        int low = 0;\n        int high\
    \ = sortedList.size() - 1;\n\n        while (low <= high) {\n            int middle\
    \ = low + (high - low) / 2;\n            int comparison = sortedList.get(middle).compareTo(supply);\n\
    \            if (comparison < 0) {\n                low = middle + 1;\n      \
    \      } else if (comparison > 0) {\n                high = middle - 1;\n    \
    \        } else {\n                return true;\n            }\n        }\n  \
    \      return false;\n    }\n}\n```\n\nAstonishing, isn’t it? Without full names,\
    \ every reader would have to build and remember the following table in her mind:\n\
    \n| n | name | m | middle | sl | sortedList |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| l | low | c | comparison | | |\n| h | high | s | supply | | |\n\n\
    We can just cut out the table by using full names directly in code. And there’s\
    \ no downside to this solution. Some people are afraid that longer names make\
    \ the code less efficient, but this just isn’t true. The compiler replaces the\
    \ names anyway on compilation, and in bytecode, full names and single-letter names\
    \ look the same. The difference is that bytecode’s only read by machines, not\
    \ by humans.\n\nAs we mentioned above, the code uses binary search. This makes\
    \ it a perfect candidate for more improvements, for example, to *Document Implementation\
    \ Decisions* or *Favor Java API Over DIY*. We could also *Replace Magic Numbers\
    \ with Constants*.\n\n## Avoid Abbreviations\n\n```java\nclass Logbook {\n   \
    \ static final Path DIR = Paths.get(\"/var/log\");\n    static final Path CSV\
    \ = DIR.resolve(\"stats.csv\");\n    static final String GLOB = \".log\";\n\n\
    \    void createStats() throws IOException {\n        try (DirectoryStream<Path>\
    \ dirStr = Files.newDirectoryStream(DIR, GLOB);\n             BufferedWriter bufW\
    \ = Files.newBufferedWriter(CSV)) {\n            for (Path lFile : dirStr) {\n\
    \                String csvLn = String.format(\"%s,%d,%s\",\n                \
    \    lFile,\n                    Files.size(lFile),\n                    Files.getLastModifiedTime(lFile));\n\
    \                bufW.write(csvLn);\n                bufW.newLine();\n       \
    \     }\n        }\n    }\n}\n```\n\nAbbreviations are one step up from single-letter\
    \ names, and our world is full of them: ASAP, FYI, TGIF, AFK, NASA, FBI, CYA,\
    \ NYPD, and so on. Many programmers like to create their own abbreviations in\
    \ their code. The obvious problem is that they’re the only ones who know those\
    \ abbreviations—everyone else has to learn them first. And learning takes time.\
    \ That’s why it’s better to avoid abbreviations altogether so that others can\
    \ grasp the code more quickly (and have fewer WTF moments).\n"
