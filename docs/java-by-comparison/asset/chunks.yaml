    # 对《对比 Java》的早期评价


    这就是我从开始中级 Java 编程课程以来一直期待的书。在没有在基础上浪费过多时间的情况下，“对比 Java` 引导你一步步对良好的编码实践获得新见解。富有启发性的示例对比了“做什么”和“不做什么”，让初学者轻松掌握要点。书中大放异彩，展示了它是基于长期的课堂经验。幸运的是，这本书可以作为教科书阅读，也可以作为参考书。我期待在我的课堂中使用它。你确定你的风格是完美的吗？买它吧！


    | → | Guido Wirtz 博士 |


    | | 班贝大学计算机科学教授/分布式系统组负责人 |


    我希望 `对比 Java` 在我开始编程时就在那里，它就像一个导师，在你肩后，耐心地帮助你将你的编程技能提升到下一个水平。


    | → | Achim Weimert |


    | | wOndary LTD 首席官 |


    `对比 Java` 对所有想要提升 Java 技能的人来说都是的一本极佳的读物。它包含了 `Effective Java` 和 `Clean Code` 的精髓，并更新了
    `JUnit 5` 和 `Java 8`。


    | → | Johannes Schwalb |


    | | uniVersa 架构师 |


    缩小新手与中间水平差距的权威指南。


    | → | Oliver Kopp |

    | | 斯图加特大学博士后 |


    `对比 Java` 对那些工作几年的 Java 开发者来说是一本制作精良的读物，更新了最新的 Java 8。相比 `Effective Java`，它更容易读且更具实用性。


    | → | Ashish Bhatia |


    | | 软件工程师 |


    我认为 `对比 Java` 恰好落在一个平衡点，既提供了实用的内容，又没有试图过于复杂。经验丰富的开发者会对此表示认同，并在阅读过程中可能会学到一些东西。这是开发者的必读之。


    | → | Sebastian Larsson |


    | | Cybercom 技术主管 |


    要成为软件工匠，你需要练习、练习、练习。`对比 Java` 可以伴随你的这些练习。通过从坏代码到好代码的对比方法，它可以作为练习期间的参考。


    | → | Zulfikar Dharmawan |


    | | 软件工程师 |


    `对比 Java` 展示了许多改进编码技能的示例，并为初学者或中间级程序员成为经验程序员提供了捷径。这本书在某种程度上提供了关注代码结构而非高级结构的低级设计模式。


    | → | Martin Blom |


    | 卡尔斯塔德大学教授 |


    `对比 Java` 对于想要将 Java 知识提升一个台阶的人来说是一本很棒的读物。我希望当我开始学习 Java 时能读到这本书类似的书；它轻松地解释了我许多通过摸索学会的主题。如果你想从一名优秀的程序员变成伟大的程序员，它是必读的。


    | → | Ramaninder Singh Jhajj |


    | | Betsson Group 大数据工程师 |


    组织良好且充满示例，`对比 Java` 无论你是一个学生还是多年经验的开发者都能帮助到你。


    | → | Emanuele Origgi |


    | | Funambol Inc. Android 软件工程师 |


    对于任何语言，一旦你掌握了它的语法，下一步就是学习如何惯用地使用它。无论你是刚开始 Java 的初学者，还是从使用其许多早期版本开始的资深 Java 开发者，我都认为
    `对比 Java` 是精通使用 Java 的良好一步。


    | → | Stefan Tilkov |


    | | INNOQ 首席执行官 |


    # 前言


    '
- fmt: '

    We can learn a great deal from observing others. Suppose you and a woman are walking
    toward the same building, with you several steps behind. As the woman enters the
    building, she momentarily holds the door open for you. That’s her expression of
    empathy and humanity. While she is focused on moving forward, she also cares about
    the person behind her and wants to make your journey at least a bit pleasant.
    You are total strangers and may never meet again, and yet she showed benevolence.


    Programming is a passion for many, but it also deeply involves empathy and humanity.


    When we write code, there is always someone behind us. Sometimes it’s ourselves
    after a few hours, days, weeks, or months. But it’s often a colleague who comes
    around to make changes to the code, fix a bug, add a feature, extend the software.
    To make the code easier for that person to maintain is far beyond an act of benevolence.
    It’s part of being a professional. It’s part of practicing the craft.


    Writing code is easy. Writing good-quality code takes effort, discipline, and
    a lot of practice. There are many different definitions for code quality. Here’s
    mine:


    ## Code Quality


    The quality of code is inversely proportional to the amount of effort to understand
    it.


    Good code is transparent. It makes the logic obvious to readers so they can get
    on with their work. Poor code is opaque and hides the logic. The reader has to
    spend time and effort to figure out the details from badly written code.


    When we sit down to program a feature or a particular logic, we’re focused deeply
    on getting it to work. Programming is a series of mini experiments and discoveries.
    We often have to devise solutions and approaches to implement the problem at hand.
    Creating code is but only the first step. Code is written once, but it is read
    and evolved many times. If the code we create is of poor quality, even if it appears
    to function flawlessly, we have increased the cost of ownership of that code over
    time.


    Most of the programmers hired to write code will deliver working software. The
    difference between average programmers and amazing ones is how easy it is for
    others to follow their work.


    Writing good-quality code is a skill. As with any skill, in order to acquire and
    improve, we have to make a conscious effort, get critiqued, and take the time
    to learn. With continuous effort, writing good-quality code becomes second nature
    and will begin to seem effortless. The journey is hard, but at the same time,
    it’s a wonderful learning experience. Part of that learning can come from reading
    great books, like the one you’re about to begin.


    In the three-plus decades I have been programming, I have made most of the mistakes
    mentioned in this book. I spend a lot of time these days reviewing code written
    by students and also by professionals in the industry. I see both students and
    professionals making many of the same mistakes. As you read this book, you will
    quickly relate to mistakes that you may have already made. The first step in solving
    a problem is realizing it. The authors of this book have done a wonderful job
    of guiding us through the smells, the issues, and the consequences of each bad
    piece of code. Then they show us ways to avoid the mess, how to write quality
    code, and the benefits we derive from the better quality.


    I urge you not to rush through this book. Sometimes we have to slow down to gain
    speed. As you move through the book, take time to read each piece of bad code
    and spend some time identifying things that are wrong. Jot them down. Then read
    through the authors’ explanations. This will help with better absorption and also
    help you to develop a sense for quality and style. Then, think through possible
    solutions, again, before jumping in to read the presented solution and the reasoning.


    Writing code is fun. Writing code that is easier to understand and evolve is pure
    bliss. It is truly a pleasure to see a book written to help aspiring programmers
    become respectable professionals. Let Simon, Jörg, and Linus be your guides—you’re
    in good hands.


    Let’s turn programming into a wonderful craft.


    Dr. Venkat Subramaniam


    President, Agile Developer, Inc. March 2018


    Copyright © 2018, The Pragmatic Bookshelf.


    # Acknowledgments


    Books can take a long time from the initial idea to the printing. This one started
    during the 2016 UEFA European Championship, the European championship in soccer.
    At that time, Simon and Linus were teaching a programming course called “Advanced
    Java Programming” at the University of Bamberg—a course that Simon and Jörg had
    developed together and taught for five years.


    With student enrollment numbers rising, it became quite arduous to provide detailed
    written feedback on the code quality of the students’ programming assignments.
    Since code quality can turn into an obsession, Simon and Linus were discussing
    this problem while watching soccer matches. It was obvious that despite their
    talent, students were making the same mistakes over and over. Eventually, the
    guys came up with the solution: a collection of common issues. Instead of explaining
    the problem over and over, they gave each mistake a name, provided one condensed
    code solution, and explained everything the students needed to know about it.
    Now they could just refer students to these items, saving much time and even improving
    the feedback quality!


    The idea of `Java by Comparison` was born, and relaxed evenings watching soccer
    on TV quickly turned into hacking and drafting code comparisons. Eventually, Simon
    and Linus realized that this might actually make a helpful programming book, and
    they got Jörg on board. A draft proposal for Pragmatic Bookshelf was prepared,
    submitted, accepted, and then the real work started…


    This book wouldn’t be in its current shape without contributions by many people.
    First and foremost, we are grateful to Professor Dr. Guido Wirtz for bringing
    us together at his Distributed Systems Group and providing the supportive environment
    in which we could grow (and do our PhDs) and such a book could come into being.
    We’d like to thank Venkat Subramaniam, whose excellent books we used in our courses,
    for writing the foreword to this book.


    We’re also grateful to all the people who gave us the permission to add their
    quotes to our chapter openings. In particular, thanks go to David Heinier Hanson,
    Martin Fowler, Sean Parent, Steve McConnell, Phil Karlton, Alan J. Perlis, Dave
    Thomas, Andy Hunt, David Wheeler, Michael Feathers, and Tom Cargill.


    On top of that, numerous people volunteered to read the book and supply us with
    excellent reviews before and during the beta phase of the book. They pointed out
    errors, suggested improvements, and made this book much better overall. Thank
    you, Cedric Röck, Oliver Kopp, Michael Träger, Jan Boockmann, Venkat Subramaniam
    (again), Matthias Geiger, Johannes Schwalb, Hendrick Cech, Klaus Stein, Ivo Balbaert,
    Al Scherer, Philipp Neugebauer, Emanuele Origgi, Ashish Bhatia, Zulfikar Dharmawan,
    Achim Weimert, Sebastian Larsson, Ramaninder Singh Jhajj, Martin Blom, and Marcus
    Biel.


    Last but not least, we want to express our gratitude to the folks at Pragmatic
    Bookshelf. Special thanks go to our editor, Andrea Stewart. Thanks for your patience,
    for endlessly rephrasing passive sentences into active voice, and for helping
    us get used to the pragmatic style of writing. But there are more people in the
    background that have made this book a reality. Many thanks to Susannah Pfalzer,
    Jackie Carter, Katie Dvorak, Brian MacDonald, and Andy Hunt!


    # If you can’t provide a convincing before/after code for your pattern, you’re
    selling snake oil.


    David Heinemeier Hanson


    # Welcome!


    We agree with David Heinier Hanson.

