  trans: "\n\n网络上有许多优秀的资源可以用来练习你的编程技能并获取代码反馈。你可以去看看 `codewars.com` 或 `cyber-dojo`。这些页面让你能够在不同难度级别上训练你的编程技能。如果你有数学背景，你会发现解决\
    \ `Project Euler` 的问题非常有吸引力。\n\n另一方面，如果你觉得 FizzBuzz 测试简单得离谱，而且你的解决方案可以在几秒钟内编译并运行，那么请注意，你可能已经掌握了我们在书中概述的一些实践方法。当然，你仍然可以从中获益。我们将所有的对比都设计成了自包含模式。所以，请尽管自由翻阅并跳过你已经熟悉的部分。\n\
    \n## 为什么要读这本书？\n\n每位开发者心中都有若干要求，他们认为这些要求是编写良好或整洁代码的前提条件。只要代码没有违反这些任何一项要求，从开发者的角度来看，它就是良好或整洁的。不同人的要求不同。而且，编程语言自然也不同。但尽管如此，对于一种特定的语言，通常会有一套“核心”要求和最佳实践。这些是开发者社区认可并接受的方面，即使它们没有被显式地写下来。在本书书中，我们正试图为你——一个可能还没有意识到\
    \ Java 社区中许多实践方法的人——提供一套 Java 整洁代码的最佳实践。\n\n作为一个初学者，你对良好 Java 代码的要求列表可能短到只有这些：\n\
    \n*   代码必须能够编译。\n*   输出必须是正确的。\n\n这些项目涉及你程序的逻辑正确性，但它们并没有说明太多关于代码质量的内容。一位丰富的程序员关注的远比这多得多，她的清单也要长得多。她只需要扫一眼代码就能检测出缺陷、糟糕的命名、难以测试的方法、不一致之处、糟糕的实践等许多问题。\n\
    \n本书的目标是训练你的大脑，使其内化更多的清单项目，帮助你通往成为丰富且专业的程序员的道路。书中的每一项都代表了这样一个清单项目。\n\n### 本书使用的惯例\n\
    \n在整书中，我们使用一种特定的结构来解释每个清单项目。我们称之为“对比（comparison）”，并严格遵守这一习惯。\n\n每个对比都有一个朗朗上口的名称。这有助于将其记住并放入你的心理清单中。看看目录——它充当了本书的清单。对比的名称让你更容易与他人讨论你读过的内容。我们命名的方式鼓励你将它们视为一种建议。你也可以在对比名称前加上“你应该”——例如：你应该避免不必要的对比。对于接下来的示例，我们选择了朗朗上口的名称“永远不要信任你的输入（Never\
    \ Trust Your Input）”。\n\n在名称之后，我们将展示一段代码并突出其中的问题。这可能是一个几行的块，也只有一行，如下：\n\n```java\n\
    class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello \" + args[0]);\n    }\n}\n```\n\n在这些代码片段中，我们希望尽可能减少你的干扰。因此，我们必须精简代码以获取核心：\n\
    \n1.  我们省略了 import 语句和包声明。当然，可下载的代码包含了这些声明——否则它将无法编译。\n2.  我们避免使用可见性修符（如 public\
    \ 或 private），除非它们被明确要求。\n\n在代码片段之后，我们会向你解释问题所在。途中，我们会提供进一步阅读的引用，例如 JavaDoc、相关项目或网页。\n\
    \n然后，我们将向你展示解决方案的代码，并突出解决方案特定的部分。\n\n```java\nclass HelloWorld {\n    public static\
    \ void main(String[] arguments) {\n        if (isEmpty(arguments)) {\n       \
    \     return;\n        }\n        System.out.println(\"Hello \" + arguments[0]);\n\
    \    }\n\n    private static boolean isEmpty(String[] array) {\n        return\
    \ (array == null || (array.length == 0);\n    }\n}\n```\n\n有时，问题代码和解决方案之间的区别非常小。有时，区别又很大。无论如何，片段本身就应该已经教你一些东西——一种帮助你产出更好代码的风格。我们刻意将每个对比保持在两页。左侧（或第一页）显示问题，右侧（或第二页）显示解决方案。这样，你一直对比两个代码片段，而不需要来回翻页。这让学习某项内容变得容易得多。如果你使用\
    \ Adobe Reader 阅读 PDF 版书籍，请确保你已开启双页视图并显示了封面——这就像在读纸质书一样。\n\n### 我为什么要学习这个？已经静态代码分析工具了……\n\
    \n你可能认为自己已经有了静态代码分析工具，例如 `Checkstyle`、`FindBugs`、`SpotBugs`、`Error Prone` 和 `PMD`，它们可以检测你代码中的缺陷。那么为什么要继续读下去呢？\n\
    \n对某些人来说确实如此，但对于书中所有的问题并非如此。我们希望看到一种工具能够自动且正确地评估你代码中存在的问题。现有的工具很好，但它们并不完美。把它们想象成严谨、不容忍、吹毛求会的机器人，它们被教授了一\
    \ set 规则并寻找任何违反行为。它们无法理解，有时你必须违反规则来改进代码。要成功使用它们，需要进行微调，这需要对代码质量和项目的深度理解。但即便如此，它们也永远比不上丰富的程序员，尽管它们可以帮助不遗漏某些问题。\n\
    \n这是一个好消息，因为这意味着作为丰富的程序员，你的技能将非常。。工具可以检查很多，但它们往往缺乏对检测到某事的详细解释。而且它们很少展示如何解决特定问题。通常情况下，解决方案对于检测工具的警告并不显而易见，也很少可以自动修复。你必须手动完成，而这个过程很容易出错——特别是当你仍在学习\
    \ Java 时。作为一个新程序员，工具不会引导你给出合理的修正。这正是本书可以帮助你的地方。\n\n## 如何阅读本书\n\n如果你是 Java 第一年级，我们建议你从头到尾阅读。它从相当基础的对比开始，然后我们将进入更具挑战性的主题，如测试、面向对象设计和\
    \ Java 函数式编程。如果你更有经验，可能可以跳过前两章直接进入更专业的主题。\n\n以下是简单的大纲：\n\n*   在第一章*开始清理（Start\
    \ Cleaning Up）*中，我们将提供关于如何编写正确、易读且易理解的通用建议。我们将涉及许多与基础 Java 语法相关的内容，例如条件和和大括号。\n\
    \n"
