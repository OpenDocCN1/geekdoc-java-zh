  trans: "\n\n今天，几乎每个专业项目都托管在版本控制系统上。该系统跟踪代码的每一次更改，包括代码删除。如果你在寻找某些特定的代码，可以轻松检查更改并追溯到过去。在我们的项目中，我们从未遇到过开发者想要取消注释被注释掉代码的情况；相反，他们都倾向于将其删除。\n\
    \n总而言之，删除被注释掉的代码是一件显而易见的事——它只会损害代码的可读性，而且在使用版本控制系统时，你实际上不会真的丢失它（尽管你可能也不会再尝试寻找那些被注释掉的代码了）。\n\
    \n# 版本控制系统\n\n虽然有很多版本控制系统，但现在你可能只需要一个：`Git`。它的运行极快，你可以从许多供应商处获取免费的公共仓库，有时甚至是免费的私有仓库，例如\
    \ [`github.com`](http://github.com)、[`gitlab.com`](http://gitlab.com) 或 [`bitbucket.org`](http://bitbucket.org)。\n\
    \n# 用常量替换注释\n\n```java\nenum SmallDistanceUnit {\n    CENTIMETER,\n    INCH;\n\
    \n    double getConversionRate(SmallDistanceUnit unit) {\n        if (this ==\
    \ unit) {\n            return 1; // 单位转换率\n        }\n        if (this == CENTIMETER\
    \ && unit == INCH) {\n            return 0.393701; // 厘米转换为英寸\n        } else\
    \ {\n            return 2.54; // 英寸转换为厘米\n        }\n    }\n}\n```\n\n注释是为了解释代码。但如果代码本身就能自说明，效果会更好！\n\
    \n在这个示例中，你看到了一个单位转换。这与你在 *带换行的分组* 中看到的非常相似，只是针对短距离而非长距离。`getConversionRate()`\
    \ 方法返回一个转换率数字。对于每个数字，都有一个注释解释该数字的含义。第一个是恒等转换，另外两个是从厘米到英寸以及反之的转换。\n\n如果没有注释，这些数字将变成“魔法数字”，你已经在\
    \ *用常量替换魔法数字 中见过它们了。在这里，注释消除了“魔法性”，并赋予了数字意义。\n\n这是一个良好的开始。毕竟，有注释的存在显然是有益的。但我们有一种方法可以让代码本身更具意义。\n\
    \n考虑这里的解决方案：\n\n```java\nenum SmallDistanceUnit {\n    CENTIMETER,\n    INCH;\n\
    \n    static final double INCH_IN_CENTIMETERS = 2.54;\n    static final double\
    \ CENTIMETER_IN_INCHES = 1 / INCH_IN_CENTIMETERS;\n    static final int IDENTITY\
    \ = 1;\n\n    double getConversionRate(SmallDistanceUnit unit) {\n        if (this\
    \ == unit) {\n            return IDENTITY;\n        }\n        if (this == CENTIMETER\
    \ && unit == INCH) {\n            return CENTIMETER_IN_INCHES;\n        } else\
    \ {\n            return INCH_IN_CENTIMETERS;\n        }\n    }\n}\n```\n\n我们在这里应用了\
    \ *用常量替换魔法数字。在这样做的同时，我们删除了注释并将它们合并到了常量的名称中。因此，从某种意义上说，我们将注释“嵌入”到了代码中。\n\n代码变得更具自解释性了。由于我们添加了几个常量，代码量变大了。这些常量的用处是它们在名称中解释了自身的含义。这就是为什么不再需要额外的注释来解释的原因：注释已经变成了实际的代码。\n\
    \n注释始终有变得过时的风险。程序员对注释的严谨程度很少能像代码那样严格。有人可能会更改代码但忽略注释，或者可能在添加了新的转换率而不做记录。\n\n如果你通过命名等方式捕获了代码的说明，那么人们在更改代码时忽略它的概率就会更小。根据经验，每当你可以将注释合并到常量或变量的名称中时，尽管去做吧。\n\
    \n# 用方法替换注释\n\n```java\nclass FuelSystem {\n    List<Double> tanks = new ArrayList<>();\n\
    \n    int getAverageFilling() {\n        double sum = 0;\n        for (double\
    \ tankFilling : tanks) {\n            sum += tankFilling;\n        }\n       \
    \ double averageFuel = sum / tanks.size();\n        return roundToPercent(averageFuel);\n\
    \    }\n\n    static int roundToPercent(double value) {\n        return Math.round(value\
    \ * 100);\n    }\n}\n```\n\n与注释或额外的变量相比，使用工具方法可以获得几个优势。\n\n首先，方法消除了注释，因为它在名称中就说明了代码的功能。这你通过变量也能获得。但还有更多优势。\n\
    \n其次，你不需要在第一个方法中增加行。相反，你现在有两个方法。每个方法都短了一些，更容易独立理解。\n\n第三，新方法可以被其他方法复用。即使现在并非如此，你也通过这种方式让代码变得稍微模块化了。\n\
    \n第四，你获得了一个方法层次：顶层方法 `getAverageFilling()` 调用低层方法 `roundToPercent()`。这提高了高层方法的可理解性。\n\
    \n理想情况下，每个方法都由一组处于相似抽象层级的命名语句组成。为了实现这一点，我们还可以将计算平均值的代码提取到另一个工具方法中。这样我们就有了三个在同一层级工作的方法。\n\
    \n# 记录实现决策\n\n```java\nclass Inventory {\n    private List<Supply> list = new\
    \ ArrayList<>();\n\n    void add(Supply supply) {\n        list.add(supply);\n\
    \        Collections.sort(list);\n    }\n\n    boolean isInStock(String name)\
    \ {\n        //快速实现\n    }\n}\n```\n"
