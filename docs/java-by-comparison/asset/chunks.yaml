    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path CAPTAIN_LOG = Paths.get(*"/var/log/captain.log"*);
    |


    |   | **static** **final** Path CREW_LOG = Paths.get(*"/var/log/crew.log"*); |


    |   |  |


    | » | **void** writeToCaptainLog(String message) **throws** IOException { |


    |   | writeMessage(message, CAPTAIN_LOG); |


    |   | } |


    |   |  |


    | » | **void** writeToCrewLog(String message) **throws** IOException { |


    |   | writeMessage(message, CREW_LOG); |


    |   | } |


    |   |  |


    |   | **void** writeMessage(String message, Path location) **throws** IOException
    { |


    |   | String entry = LocalDate.now() + *" "* + message; |


    |   | Files.write(location, Collections.singleton(entry), |


    |   | StandardCharsets.UTF_8, StandardOpenOption.APPEND); |


    |   | } |


    |   | } |


    Whenever you see a method that uses a boolean input parameter, chances are that
    you can improve the code by separating it into multiple methods.


    To do so, you remove the boolean method parameter and add a new method for each
    control-flow path that the parameter was distinguishing between. You can even
    give the new methods expressive and meaningful names and further enhance the readability
    of the code!


    This is also what we’ve done in the code above: we’ve added the two new methods
    writeToCaptianLog() and writeToCrewLog(). Consider the new usage now:


    |   | logbook.writeToCaptainLog(*"Aliens sighted!"*); |


    |   | logbook.writeToCrewLog(*"Toilet broken. Again..."*); |


    As you can see, this is much more readable than the previous version. The method
    names make it clear which log a message belongs to, and you can tell from the
    calling code what the method is intended to achieve.


    Remember: Good Design Is Difficult


    Hardly anybody gets it right on their first try. In the end, this is good news
    because it means that your skills will be in high demand when you master object-oriented
    design. But be aware that it’s harder to tell good from bad design than it is
    to spot a botched line of code. Good design is less clear-cut, and it requires
    you to have an intuition and a “feeling” for it. The only real way to get this
    intuition is to do a lot of coding, to try out different designs, and to see what
    fails and what feels just right.


    ## Split Method with Optional Parameters


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path CREW_LOG = Paths.get(*"/var/log/crew.log"*); |


    |   |  |


    | » | List<String> readEntries(LocalDate date) **throws** IOException { |


    |   | **final** List<String> entries = Files.readAllLines(CREW_LOG, |


    |   | StandardCharsets.UTF_8); |


    |   | **if** (date == **null**) { |


    |   | **return** entries; |


    |   | } |


    |   |  |


    |   | List<String> result = **new** LinkedList<>(); |


    |   | **for** (String entry : entries) { |


    |   | **if** (entry.startsWith(date.toString())) { |


    |   | result.add(entry); |


    |   | } |


    |   | } |


    |   | **return** result; |


    |   | } |


    |   | } |


    Booleans as you’ve seen them in [*Split Method with Boolean Parameters*](#f_0075.xhtml_sec.split_method_with_boolean_parameters)
    aren’t the only indicators of methods that do too much. Optional parameters have
    the same problem, but they’re harder to spot.


    This time, we’re looking at how data can be read from the log via the method readEntries().
    Log entries have a date, and we can select entries marked by the input parameter
    date. If you insert null instead of a concrete date value, then readEntries()
    returns all log entries. Consider the following usage:


    |   | List<String> completeLog = logbook.readEntries(**null**); |


    |   |  |


    |   | **final** LocalDate moonLanding = LocalDate.of(1969, Month.JULY, 20); |


    |   | List<String> moonLandingLog = logbook.readEntries(moonLanding); |


    The semantics of null here essentially mean that the date parameter is optional.
    This is really just a different version of a boolean method parameter.


    As before, a method with optional parameters is a method that does more than one
    thing. Even worse, it’s hard to see what to expect from a method call with a null
    parameter.


    Here’s how we can refactor this:


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path CREW_LOG = Paths.get(*"/var/log/crew.log"*); |


    |   |  |


    | » | List<String> readEntries(LocalDate date) **throws** IOException { |


    |   | Objects.requireNonNull(date); |


    |   |  |


    |   | List<String> result = **new** LinkedList<>(); |


    |   | **for** (String entry : readAllEntries()) { |


    |   | **if** (entry.startsWith(date.toString())) { |


    |   | result.add(entry); |


    |   | } |


    |   | } |


    |   | **return** result; |


    |   | } |


    |   |  |


    | » | List<String> readAllEntries() **throws** IOException { |


    |   | **return** Files.readAllLines(CREW_LOG, StandardCharsets.UTF_8); |


    |   | } |


    |   | } |


    The solution to the problem here is essentially the same as in [*Split Method
    with Boolean Parameters*](#f_0075.xhtml_sec.split_method_with_boolean_parameters):
    we split the method into two methods. Each of them captures one of the control-flow
    branches.


    In the code above, the readEntries() method no longer permits an optional date
    parameter and throws a NullPointerException in this case instead. The semantics
    of the former optional parameter are now captured in the readAllEntries() method,
    which requires no parameters. This even makes it easier to use. Now the usage
    looks like this:


    |   | List<String> completeLog = logbook.readAllEntries(); |


    |   |  |


    |   | **final** LocalDate moonLanding = LocalDate.of(1969, Month.JULY, 20); |


    |   | List<String> moonLandingLog = logbook.readEntries(moonLanding); |


    As you can see, this is much more understandable, since the method name clearly
    communicates that all entries will be read. Apart from getting rid of the null
    input value, other usages of readEntries() are unchanged.


    On top of the improved readability, we’re now even avoiding explicit usages of
    null in our code. The more we get rid of null values, the less likely it is that
    we’ll trigger NullPointerExceptions unintentionally.


    ## Favor Abstract Over Concrete Types


    |   | **class** Inventory { |


    | » | LinkedList<Supply> supplies = **new** LinkedList(); |


    |   |  |


    | » | **void** stockUp(ArrayList<Supply> delivery) { |


    |   | supplies.addAll(delivery); |


    |   | } |


    |   |  |


    | » | LinkedList<Supply> getContaminatedSupplies() { |


    |   | LinkedList<Supply> contaminatedSupplies = **new** LinkedList<>(); |


    |   | **for** (Supply supply : supplies) { |


    |   | **if** (supply.isContaminated()) { |


    |   | contaminatedSupplies.add(supply); |


    |   | } |


    |   | } |


    |   | **return** contaminatedSupplies; |


    |   | } |


    |   | } |


    Interfaces and classes often form large type hierarchies—just look at the Java
    API. If you use more abstract types for variables, your code will be more flexible.


    Above, you can see a part of the Inventory system. The method getContaminatedSupplies()
    loops through a LinkedList of Supply objects, which you can populate via the stockUp()
    method. Here’s how you might use the class:


    |   | Stack<Supply> delivery = cargoShip.unload(); |


    | » | ArrayList<Supply> loadableDelivery = **new** ArrayList<>(delivery); |


    |   | inventory.stockUp(loadableDelivery); |


    In the example, supplies are delivered in a last-in-first-out (LIFO) order through
    a Stack. Unfortunately, the Inventory requires an ArrayList for stocking up. So
    you have to move the supplies into an ArrayList.


    Once in the Inventory, the stockUp() method moves the supplies from the ArrayList
    into an internal LinkedList. From this LinkedList, you can finally extract contaminated
    supplies via getContaminatedSupplies().


    As you can see, there’s a lot of conversion between different types of data structures
    going on, and most of it is actually unnecessary. Plus, changes in Inventory easily
    propagate elsewhere.


    We can get rid of these problems by using more abstract types.


