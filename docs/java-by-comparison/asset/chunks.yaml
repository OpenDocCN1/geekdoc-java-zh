    [![](OEBPS/Images/vspcon.jpg)](http://pragmaticprogrammer.com/titles/vspcon)


    Stop dreading concurrency hassles and start reaping the pure power of modern multicore
    hardware. Learn how to avoid shared mutable state and how to write safe, elegant,
    explicit synchronization-free programs in Java or other JVM languages including
    Clojure, JRuby, Groovy, or Scala.


    Venkat Subramaniam

    (280 pages) ISBN: 9781934356760 $35


    ## Adopting Elixir


    [![](OEBPS/Images/tvmelixir.jpg)](http://pragmaticprogrammer.com/titles/tvmelixir)


    Adoption is more than programming. Elixir an exciting new language, but to successfully
    get your application from start to finish, you’re going to need to know more than
    just the language. You need the case studies and strategies in this book. Learn
    the best practices for the whole life of your application, from design and team-building,
    to managing stakeholders, to deployment and monitoring. Go beyond the syntax and
    the tools to learn the techniques you need to develop your Elixir application
    from concept to production.


    Ben Marx, José Valim, Bruce Tate

    (242 pages) ISBN: 9781680502527 $42.95


    ## Programming Elixir ≥ 1.6


    [![](OEBPS/Images/elixir16.jpg)](http://pragmaticprogrammer.com/titles/elixir16)


    This book is the introduction to Elixir for experienced programmers, completely
    updated for Elixir 1.6 and beyond. Explore functional programming without the
    academic overtones (tell me about monads just one more time). Create concurrent
    applications, but get them right without all the locking and consistency headaches.
    Meet Elixir, a modern, functional, concurrent language built on the rock-solid
    Erlang VM. Elixir’s pragmatic syntax and built-in support for metaprogramming
    will make you productive and keep you interested for the long haul. Maybe the
    time is right for the Next Big Thing. Maybe it’s Elixir.


    Dave Thomas

    (398 pages) ISBN: 9781680502992 $47.95


    ## Good Math


    [![](OEBPS/Images/mcmath.jpg)](http://pragmaticprogrammer.com/titles/mcmath)


    Mathematics is beautiful—and it can be fun and exciting as well as practical.
    Good Math is your guide to some of the most intriguing topics from two thousand
    years of mathematics: from Egyptian fractions to Turing machines; from the real
    meaning of numbers to proof trees, group symmetry, and mechanical computation.
    If you’ve ever wondered what lay beyond the proofs you struggled to complete in
    high school geometry, or what limits the capabilities of the computer on your
    desk, this is the book for you.


    Mark C. Chu-Carroll

    (282 pages) ISBN: 9781937785338 $34


    ## The Healthy Programmer


    [![](OEBPS/Images/jkthp.jpg)](http://pragmaticprogrammer.com/titles/jkthp)


    To keep doing what you love, you need to maintain your own systems, not just the
    ones you write code for. Regular exercise and proper nutrition help you learn,
    remember, concentrate, and be creative—skills critical to doing your job well.
    Learn how to change your work habits, master exercises that make working at a
    computer more comfortable, and develop a plan to keep fit, healthy, and sharp
    for years to come. This book is intended only as an informative guide for those
    wishing to know more about health issues. In no way is this book intended to replace,
    countermand, or conflict with the advice given to you by your own healthcare provider
    including Physician, Nurse Practitioner, Physician Assistant, Registered Dietician,
    and other licensed professionals.


    Joe Kutner

    (254 pages) ISBN: 9781937785314 $36


