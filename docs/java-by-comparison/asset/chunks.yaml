  trans: "\n当然，我们可以添加许多额外的测试——例如，测试一个与预期格式略有偏差的消息，或者消息中各个部分的顺序被调换了的情况。你的想象力在这里没有边界。但在测试时，你必须节约。这些额外的测试相比上述的边界情况，不太可能发现\
    \ bug。当你遇到测试未覆盖的 bug 时，你仍然可以添加更多测试来确保该 bug 被修复。\n\n边界情况并不一定得是无效的，尽管它们通常是无效的。有时你可能希望允许特殊的输入组合。在这种情况下，你仍然应该测试它们，以确保它们确实可以工作。\n\
    \n## 你学到了什么？\n\n如果没有代码测试，你就无法编写出复杂的软件。有时（读作：非常频繁），你为测试而编写的代码甚至多于你实现实际功能而编写的代码。你甚至可以尝试测试驱动开发——在编写要测试的实际源代码之前先编写测试，并让测试来驱动程序的设计。我们都知道：测试至关重要！这就是为什么你必须确保你的测试套件设计良好，并符合最高标准。\n\
    \n保持测试简洁且切中至关重要。每当其中一个测试失败时，代码应该给你一个非常清晰的指示，去哪里寻找错误。本章中的大多数比较都关注这一方面。我们向你展示了一个构建测试的模板，它由\
    \ `given-when-then` 组成，使它们更易于理解。你知道测试应该是独立的，并且你学习了如何通过注解描述测试并选择正确的断言来进一步提高它们的可理解性。你已经意识到人们在进行\
    \ JUnit 测试时会犯的一些常见错误——例如，混淆了预期值和实际值，或者选择了不恰的精度级别。最后但同样重要的是，你现在掌握了一些技术，它们可以帮助你在减少测试代码量的同时测试大量的代码库。你可以通过测试最关键的设置、边界情况或对测试进行参数化来实现这一点。\n\
    \n本章让你初步了解了 `JUnit` 框架的能力。这确实是非常多的了。事实上，它的能力远超我们在这里合理的涵盖范围——我们不想写一整本关于使用 `JUnit`\
    \ 进行单元测试的书。目标仅仅是通过一些最佳实践让你在 `JUnit` 上有一个良好的开端。幸运的是，那本书已经写好了：*Pragmatic Unit Testing\
    \ in Java 8 with JUnit* LHT15。\n\n现在你已经学会了如何设计测试代码，准备好进入下一章了——是时候回到实际源代码并更仔细地观察它的设计了。接下来，我们将向你展示一些可以应用于程序的设计原则，使你的程序更加面向对象且更健壮。\n\
    \n### 脚注\n\n[[36]](#f_0063_split_001.xhtml_FNPTR-36)\n\n[`junit.org/`](http://junit.org/)\n\
    \n[[37]](#f_0064.xhtml_FNPTR-37)\n\n[`jgiven.org/`](http://jgiven.org/)\n\n[[38]](#f_0067.xhtml_FNPTR-38)\n\
    \n如果你对全面的解释感兴趣，我们建议你阅读 *What Every Computer Scientist Should Know About Floating-Point\
    \ Arithmetic* Gol91。\n\n[[39]](#f_0069.xhtml_FNPTR-39)\n\n从 Java 7 开始，你可以使用任何通过\
    \ `Character.isJavaIdentifierPart(int)` 的 unicode 字符。尽管如此，我们的建议是在方法名中使用数字和字母。\n\
    \n[[40]](#f_0071.xhtml_FNPTR-40)\n\n[`github.com/pholser/junit-quickcheck`](https://github.com/pholser/junit-quickcheck)\n\
    \n[[41]](#f_0072.xhtml_FNPTR-41)\n\n实际上，“Klingon”这个词本身就是克林贡语。你通常不需要在程序中支持那种语言，但中文或土耳其语之类的语言呢？你的程序也能处理这些语言吗？\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\n计算机科学中的任何问题都可以通过增加间层来解决。但通常会产生另一个问题。\n\
    \nDavid Wheeler\n\n# 第 7 章：设计你的对象\n\n设计在许多学科中都是重要的。例如，建筑师可以建造一个功能完备且准备好入住的房子。屋顶、窗户、电力、清洁水、暖气——一切都可以就位并正常工作。\n\
    \n尽管如此，你可能不想住在那里。也许它很丑；霓虹色的墙壁和天花板保护你免受雨淋，但你不想一直盯着那些鲜艳的颜色。也许它很不方便；客厅中心的一根柱子支撑着屋顶，但它也让你无法从沙发上上看电视。\n\
    \n这些都是夸张（希望如此！），但可能有一些小瑕疵让你在新家里感到苦恼。\n\n这就是设计大显身场的地方。我们的房子不应该仅仅是功能性的。我们希望建筑师让它既美又方便。对于我们在\
    \ `Java` 中的类和对象也是如此。它们不应该仅仅是功能上正确的。它们应该是美且方便的。\n\n你在本章中中学到的最佳实践正是本章的核心。它们将帮助你产出面向对象且健壮的代码。`Java`\
    \ 不应该仅仅是功能上正确的。\n\n## 使用布尔参数拆分方法\n\n```java\nclass Logbook {\n  static final Path\
    \ CAPTAIN_LOG = Paths.get(\"/log/captain.log\");\n  static final Path CREW_LOG\
    \ = Paths.get(\"/log/crew.log\");\n\n  void log(String message, boolean classified)\
    \ throws IOException {\n    if (classified) {\n      writeMessage(message, CAPTAIN_LOG);\n\
    \    } else {\n      writeMessage(message, CREW_LOG);\n    }\n  }\n\n  void writeMessage(String\
    \ message, Path location) throws IOException {\n    String entry = LocalDate.now()\
    \ + \" \" + message;\n    Files.write(location, Collections.singleton(entry),\
    \ StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n  }\n}\n```\n\n通常情况下，方法应该只专注于单一任务。布尔方法参数表明一个方法做了了不止一件事。\n\
    \n在这个例子中，我们重新回顾了 `Logbook` 类的改进版本。我们通过 `log()` 方法的布尔参数将消息分为机密和非机密消息。这里是一个用法示例：\n\
    \n```java\nlogbook.log(\"Aliens sighted!\", true);\nlogbook.log(\"Toilet broken.\"\
    , false);\n```\n\n这段代码并没有 bug，但它的可读性和结构并不如本该那样好。每个阅读它的人都必须弄清楚这个布尔参数的作用。即使人们弄清楚了作用，仍然存在误读的风险，从而在船员日志中写入机密消息。使用布尔值作为方法参数可以帮助你大声宣告该方法执行了不止一件事。这有时是可以接受的，但通常会使你的代码更难理解，因为在调用端很难看出该布尔参数实际上实现了什么。此外，这两个日志是耦合的。\n\
    \n"
- fmt: "\nCheck out how we can improve this:\n\n```java\nclass Logbook {\n    static\
    \ final Path CAPTAIN_LOG = Paths.get(\"/var/log/captain.log\");\n    static final\
    \ Path CREW_LOG = Paths.get(\"/var/log/crew.log\");\n\n    void writeToCaptainLog(String\
    \ message) throws IOException {\n        writeMessage(message, CAPTAIN_LOG);\n\
    \    }\n\n    void writeToCrewLog(String message) throws IOException {\n     \
    \   writeMessage(message, CREW_LOG);\n    }\n\n    void writeMessage(String message,\
    \ Path location) throws IOException {\n        String entry = LocalDate.now()\
    \ + \" \" + message;\n        Files.write(location, Collections.singleton(entry),\n\
    \            StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n    }\n}\n```\n\
    \nWhenever you see a method that uses a boolean input parameter, chances are that\
    \ you can improve the code by separating it into multiple methods.\n\nTo do so,\
    \ you remove the boolean method parameter and add a new method for each control-flow\
    \ path that the parameter was distinguishing between. You can even give the new\
    \ methods expressive and meaningful names and further enhance the readability\
    \ of the code!\n\nThis is also what we’ve done in the code above: we’ve added\
    \ the two new methods `writeToCaptianLog()` and `writeToCrewLog()`. Consider the\
    \ new usage now:\n\n```java\nlogbook.writeToCaptainLog(\"Aliens sighted!\");\n\
    logbook.writeToCrewLog(\"Toilet broken. Again...\");\n```\n\nAs you can see, this\
    \ is much more readable than the previous version. The method names make it clear\
    \ which log a message belongs to, and you can tell from the calling code what\
    \ the method is intended to achieve.\n\nRemember: Good Design Is Difficult\n\n\
    Hardly anybody gets it right on their first try. In the end, this is good news\
    \ because it means that your skills will be in high demand when you master object-oriented\
    \ design. But be aware that it’s harder to tell good from bad design than it is\
    \ to spot a botched line of code. Good design is less clear-cut, and it requires\
    \ you to have an intuition and a “feeling” for it. The only real way to get this\
    \ intuition is to do a lot of coding, to try out different designs, and to see\
    \ what fails and what feels just right.\n\n## Split Method with Optional Parameters\n\
    \n```java\nclass Logbook {\n    static final Path CREW_LOG = Paths.get(\"/var/log/crew.log\"\
    );\n\n    List<String> readEntries(LocalDate date) throws IOException {\n    \
    \    final List<String> entries = Files.readAllLines(CREW_LOG,\n            StandardCharsets.UTF_8);\n\
    \        if (date == null) {\n            return entries;\n        }\n\n     \
    \   List<String> result = new LinkedList<>();\n        for (String entry : entries)\
    \ {\n            if (entry.startsWith(date.toString())) {\n                result.add(entry);\n\
    \            }\n        }\n        return result;\n    }\n}\n```\n\nBooleans as\
    \ you’ve seen them in *Split Method with Boolean Parameters* aren’t the only indicators\
    \ of methods that do too much. Optional parameters have the same problem, but\
    \ they’re harder to spot.\n\nThis time, we’re looking at how data can be read\
    \ from the log via the method `readEntries()`. Log entries have a date, and we\
    \ can select entries marked by the input parameter `date`. If you insert null\
    \ instead of a concrete date value, then `readEntries()` returns all log entries.\
    \ Consider the following usage:\n\n```java\nList<String> completeLog = logbook.readEntries(null);\n\
    \nfinal LocalDate moonLanding = LocalDate.of(1969, Month.JULY, 20);\nList<String>\
    \ moonLandingLog = logbook.readEntries(moonLanding);\n```\n\nThe semantics of\
    \ null here essentially mean that the `date` parameter is optional. This is really\
    \ just a different version of a boolean method parameter.\n\nAs before, a method\
    \ with optional parameters is a method that does more than one thing. Even worse,\
    \ it’s hard to see what to expect from a method call with a null parameter.\n\n\
    Here’s how we can refactor this:\n\n```java\nclass Logbook {\n    static final\
    \ Path CREW_LOG = Paths.get(\"/var/log/crew.log\");\n\n    List<String> readEntries(LocalDate\
    \ date) throws IOException {\n        Objects.requireNonNull(date);\n\n      \
    \  List<String> result = new LinkedList<>();\n        for (String entry : readAllEntries())\
    \ {\n            if (entry.startsWith(date.toString())) {\n                result.add(entry);\n\
    \            }\n        }\n        return result;\n    }\n\n    List<String> readAllEntries()\
    \ throws IOException {\n        return Files.readAllLines(CREW_LOG, StandardCharsets.UTF_8);\n\
    \    }\n}\n```\n\nThe solution here is essentially the same as in *Split Method\
    \ with Boolean Parameters*: we split the method into two methods. Each of them\
    \ captures one of control-flow branches. In the code above, `readEntries()` no\
    \ longer permits an optional parameter. This even makes it easier to use. Now\
    \ usage looks like:\n\n```java\nList<String> completeLog = logbook.readAllEntries();\n\
    \nfinal LocalDate moonLanding = LocalDate.of(1969, Month.JULY, 20);\nList<String>\
    \ moonLandingLog = logbook.readEntries(moonLanding);\n```\n\nAs you can see, this\
    \ is much more understandable, since the method name clearly communicates that\
    \ all entries will be read. Apart from getting rid of null, we’re now avoiding\
    \ null values.\n\n## Favor Abstract Over Concrete Types\n\n```java\nclass Inventory\
    \ {\n    List<Supply> supplies = new LinkedList<>();\n\n    void stockUp(ArrayList<Supply>\
    \ delivery) {\n        supplies.addAll(delivery);\n    }\n\n    LinkedList<Supply>\
    \ getContaminatedlies() {\n        LinkedList<Supply> contaminatedSupplies = new\
    \ LinkedList<>();\n        for (Supply supply : supplies) {\n            if (supply.isContaminated())\
    \ {\n                contaminatedSupplies.add(supply);\n            }\n      \
    \  }\n        return contaminatedSupplies;\n    }\n}\n```\n\nInterfaces and classes\
    \ often form large hierarchies—just look at the Java API. If you use more abstract\
    \ types for variables, your code will be more flexible.\n\nAbove, you can see\
    \ a part of the Inventory system. The method `getContaminatedlies()` loops through\
