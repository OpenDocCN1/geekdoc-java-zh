  trans: "\n然而，匿名类往往会导致代码膨肿。它们让代码变得庞大得多，并增加了额外的缩进层级。这是因为你需要重复编写接口类型和方法。实际的计算——在我们的示例中，就是单行代码的返回值\
    \ `value * value`——隐藏在所有这些冗长的代码中。\n\n通过 Java 8，我们有了编写匿名类的绝佳替代方案。\n\nLambda 表达式可以极大地改进代码：\n\
    \n```java\nclass Calculator {\n    Map<Double, Double> values = new HashMap<>();\n\
    \n    Double square(Double value) {\n        Function<Double, Double> squareFunction\
    \ = factor -> factor * factor;\n        return values.computeIfAbsent(value, squareFunction);\n\
    \    }\n}\n```\n\n现在这要短得多且更具可读性。你可以直接看出计算逻辑，所有的冗余代码都彻底消失了。确实更加简洁。\n\nLambdas 为函数式接口提供了实现——即带有一个抽象方法的接口。在这里，lambdas\
    \ 是完美匹配的，因为 `Function` 接口只有一个抽象方法：`apply()`。我们可以以多种方式编写 lambda：作为单行代码或多行代码。\n\n\
    ```java\n// 单行代码\nFunction<Double, Double> squareFunction = factor -> factor *\
    \ factor;\n\n// 多行代码\nFunction<Double, Double> squareFunction = factor -> {\n\
    \    return factor * factor;\n};\n```\n\n在这里，你可以直接比较单行和多行代码。单行代码没有 `return` 关键字，也没有大括号。它是编写简短简洁的胶水代码的最佳选择。尽可能避免多行代码，转而使用方法引用代替\
    \ Lambdas。此外，你可以拥有隐式或显式的类型声明。\n\n```java\n// 没有类型定义和大括号\nFunction<Double, Double>\
    \ squareFunction = factor -> factor * factor;\n\n// 有类型定义和大括号\nFunction<Double,\
    \ Double> squareFunction = (Double factor) -> factor * factor;\n```\n\n在 Java\
    \ 中，你通常需要显式指定类型。但对于 lambda 表达式的参数，编译器在几乎所有情况下都能自动推导出类型。我们可以在这里提供类型，但有必要显而易见吗？\n\
    \n注意，对于单个参数，大括号是可选的，但如果有多个参数或显式指定类型，则必须使用它们。\n\n## 优先使用函数式而非命令式\n\n```java\nclass\
    \ Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\n    long countDifferentKinds()\
    \ {\n        List<String> names = new ArrayList<>();\n        for (Supply supply\
    \ : supplies) {\n            if (supply.isUncontaminated()) {\n              \
    \  String name = supply.getName();\n                if (!names.contains(name))\
    \ {\n                    names.add(name);\n                }\n            }\n\
    \        }\n        return names.size();\n    }\n}\n```\n\n在处理集合时，函数式编程风格比其命令式兄弟更易读。上面你可以看到一个短但相对复杂的方法，它执行了一些常见操作：遍历集合并进行条件计算。尽管代码很短且命名正确，你仍需要花时间理解它在做什么。\n\
    \n这段代码是命令式的。它通过循环、条件、赋值和方法调用告诉计算机做什么以及怎么做。机器逐行执行该配方。你可以通过调试器观察它。\n\n但通常，我们更感兴趣代码做了什么，而不是如何实现目标。这就是为什么我们在编写良好的注释和选择良好的名称上投入了这么多精力。\n\
    \n在这里，代码的大小和我们需要逐行阅读的文本模糊了方法的意图。通过 lambda 表达式，我们可以只指定想要完成的任务，而不关心如何实现。这使得代码更加简洁、易读。\n\
    \n那么，我们如何通过 lambdas 来阐明代码呢？\n\n```java\nclass Inventory {\n    List<Supply> supplies\
    \ = new ArrayList<>();\n\n    long countDifferentKinds() {\n        return supplies.stream()\n\
    \            .filter(supply -> supply.isUncontaminated())\n            .map(supply\
    \ -> supply.getName())\n            .distinct()\n            .count();\n    }\n\
    }\n```\n\n令人惊讶，不是吗？我们没有编写如何做，只是陈述了做什么，这让变得非常短。让我们逐行分析代码。\n\n首先，我们进入 `stream()`。这是起始运算符，将集合转换为流并为我们开启了函数式编程的世界！\n\
    \n其次，我们 `filter()` 过滤掉任何污染的物品。过滤器就像一个大门，只允许符合条件的物品通过。从类型上来说，过滤器是一个评估结果为真或假的 `Predicate`。\n\
    \n第三，我们在河流上转换（或 `map`）我们的“小船”。在这种情况下，我们提取 `Supply` 的部分——其名称，并将其余。在 Java 术中，`Function`\
    \ 将一个类型映射到另一个类型。\n\n第四，我们 `count()` 流中剩余的元素。这是一个终止运算符，结束流并将我们带回命令式风格。\n\n这仅仅是集合和\
    \ lambda 表达式可以做到的表面内容。`java.util.stream` 包的 JavaDoc 已经包含了一个编写良好的指南。对于更全面的介绍，Java\
    \ 函数式编程 Sub14;\n\n    long countDifferentKinds() {\n        return supplies.stream()\n\
    \            .filter(supply -> !supply.isContaminated())\n            .map(supply\
    \ -> supply.getName())\n            .distinct()\n            .count();\n    }\n\
    }\n```\n\n你在之前的比较中看到的 Lambda 表达式可以让你的代码更易读。但这些好处是有代价的：你不能部分执行 lambda 表达式——你只能运行整个流。这意味着很难像在单元测试中想要的那样测试\
    \ lambda 表达式的部分。\n\n在上面，你可以看到从之前的比较中稍作修改的方案：优先使用函数式而非命令式，它使用了逻辑否定。它包含两个 lambda\
    \ 表达式，一个用于过滤的 `Predicate` 和一个用于映射的 `Function`。我们内联定义它们是为了使代码更简洁——它们没有被变量引用，因此我们无法在其他地方使用它们。它们仅是所属方法的一部分。\n"
- fmt: "\nYou may be wondering: why is this a problem? In very simple cases, it isn’t.\
    \ But if the lambda expressions contains more logic—for example, if the `Predicate`\
    \ is a complex condition or the `Function` a multi-line conversion—then there’s\
    \ potential for errors. And because we can’t reference those lambda expressions,\
    \ we can’t test them in isolation with unit tests to ensure that they work as\
    \ expected. That’s not good.\n\nCode that builds on method calls, on the other\
    \ hand, is easier to test, because you can call the methods separately from their\
    \ integration. Luckily, functional programming in `Java` also provides a mechanism\
    \ to take care of this: method references. Using method references, you can embed\
    \ method calls directly as a lambda expression, and that makes quality assurance\
    \ easier.\n\nSo let’s see how can we improve the code with method references:\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    long countDifferentKinds() {\n        return supplies.stream()\n       \
    \     .filter(Supply::isUncontaminated)\n            .map(Supply::getName)\n \
    \           .distinct()\n            .count();\n    }\n}\n```\n\nThe syntax is\
    \ fairly simple. Instead of defining a normal lambda expression, we can reference\
    \ existing methods directly in the stream.\n\nTake a look at the code. We’ve replaced\
    \ the lambda expressions in the code snippet before, with references to methods.\
    \ That way, we could even [Avoid Negations](#f_0014.xhtml_sec.avoid_negations)!\
    \ Now, the stream only orchestrates existing (and, of course, tested) methods.\
    \ This combines the best of both worlds.\n\nAnd it doesn’t stop there: with method\
    \ references, the code gets shorter and more readable, even if you might have\
    \ to get used to the syntax at first.\n\nMethod references require a special (and\
    \ new) syntax of the form `ClassName::methodName`. For instance, `Supply::getName`\
    \ references the `getName()` method of the class `Supply`.\n\nOf course, the methods\
    \ you reference must fit into the place where you use them. The `filter` operation\
    \ requires a method reference that fits the `Predicate` interface (a method that\
    \ takes an object and returns a `Boolean`) and the `map` operation one that fits\
    \ the `Function` interface (a method that takes an object and returns an object).\n\
    \nAt this point, you might think about converting your lambda expressions into\
    \ methods. You should do that when the expression is rather complex or when you\
    \ need it multiple times to avoid “lambda duplication.”\n\nAs a side note, method\
    \ references are very flexible: you can even reference a constructor in the form\
    \ `ClassName::new`. This may come in handy when turning your stream into a collection\
    \ with `collect(Collectors.toCollection(TreeSet::new))`.\n\n## Avoid Side Effects\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    long countDifferentKinds() {\n        List<String> names = new ArrayList<>();\n\
    \n        Consumer<String> addToNames = name -> names.add(name);\n\n        supplies.stream()\n\
    \            .filter(Supply::isUncontaminated)\n            .map(Supply::getName)\n\
    \            .distinct()\n            .forEach(addToNames);\n        return names.size();\n\
    \    }\n}\n```\n\nIn theory, there are no side effects with functional programming.\
    \ Everything’s just a function that takes data as input and produces new data\
    \ as output. The data you pass along is immutable.\n\nBut in imperative and object-oriented\
    \ programming, we rely on side effects (we change data and state through procedures\
    \ or methods) all the time. In `Java`, we can now mix all these styles. This is\
    \ very powerful, but it’s also quite error prone. That’s why you should try to\
    \ minimize side effects in your code.\n\nTake a look at the code above. It even\
    \ makes heavy use of side effects to achieve its goal.\n\nThe problem is with\
    \ the `Consumer` addToNames` that’s called in the `forEach()` part of the stream.\
    \ This `Consumer` adds an element to a list outside of the lambda expression.\
    \ That’s the side effect.\n\nThere’s no functional error in the code above, but\
    \ it’s prone to break once you add concurrency. `Java` makes no guarantees regarding\
    \ the visibility of side effects among different threads. And already if you parallelize\
    \ the lambda expression here, it will (occasionally) produce wrong results because\
    \ the `ArrayList` is not thread-safe.\n\nNewcomers to functional programming in\
    \ `Java` have a tendency to write such code. Whereas the `filter()` and `map()`\
    \ operators only act on the stream elements themselves and don’t cause any side\
    \ effects, beginners often fall back to the imperative style to terminate the\
    \ stream—and this can only be done through side effects.\n\nSo how can we avoid\
    \ side effects and terminate the lambda expression in a better way?\n\n```java\n\
    class Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\n    long\
    \ countDifferentKinds() {\n        List<String> names = supplies.stream()\n  \
    \          .filter(Supply::isUncontaminated)\n            .map(Supply::getName)\n\
    \            .distinct()\n            .collect(Collectors.toList());\n       \
    \ return names.size();\n    }\n}\n```\n\nThe crucial part is the list that results\
    \ from the lambda expression. Instead of populating this list ourselves, we `collect()`\
    \ every remaining element in the stream in a collection. For a list, you’ll need\
    \ to end the stream with `collect(Collectors.toList())`. Of course, you can get\
    \ a `Set` or other data structures with the `Collectors.toSet()` as well.\n\n\
    In the example above, we still need to get the size of the resulting list for\
    \ our job at hand. Let’s see if we can do better:\n\n```java\nreturn supplies.stream()\n\
    \    .filter(Supply::isUncontaminated)\n    .map(Supply::getName)\n    .distinct()\n\
    \    .count();\n```\n\nYes, we can. The terminating operator `count()` returns\
    \ the number of remaining elements in the stream—exactly what we need. It’s a\
    \ shorthand for the `reduce` operator of the `Stream` class^[[46](#FOOTNOTE-46):\
    \ `reduce(0, (currentResult, streamElement) -> currentResult + 1)`. This reduces\
    \ the list to a single value. The zero here is the initial value, and we add 1\
    \ to the result for every element in the stream.\n\nTo sum up, you should try\
    \ to avoid `forEach()` for terminating a stream, because it can easily cause side\
    \ effects. Try to use `collect()` and `reduce()` instead, which we’ll explain\
    \ more closely in [Use Collect for Terminating Streams](#f_0088.xhtml_sec.really_avoid_side_effects).\
    \ These operators terminate a stream and produce the data structure you need,\
    \ be it `List`, `Set`, or even a `long`.\n\n## Use Collect for Terminating Streams\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    Map<String, Long> countDifferentKinds() {\n        Map<String, Long> nameToCount\
    \ = new HashMap<>();\n\n        Consumer<String> addToNames = name -> {\n    \
    \        if (!nameToCount.containsKey(name)) {\n                nameToCount.put(name,\
    \ 0L);\n            }\n            nameToCount.put(name, nameToCount.get(name)\
    \ + 1);\n        };\n\n        supplies.stream()\n            .filter(Supply::isUncontaminated)\n\
    \            .map(Supply::getName)\n            .forEach(addToNames);\n      \
    \  return nameToCount;\n    }\n}\n```\n\nIn the previous comparison [Avoid Side\
    \ Effects](#f_0087.xhtml_sec.avoid_side_effects), we showed you how to turn a\
    \ stream into a single long value with the `reduce()` operator and its special\
    \ case, the `count()` operator. We’ve also hinted at the `collect()` operator.\
    \ This one’s best for terminating streams that result in something that’s more\
    \ complex than a primitive value.\n"
