    add concurrency. Java makes no guarantees regarding the visibility of side effects
    among different threads. And already if you parallelize the lambda expression
    here, it will (occasionally) produce wrong results because the ArrayList is not
    thread-safe.


    Newcomers to functional programming in Java have a tendency to write such code.
    Whereas the filter() and map() operators only act on the stream elements themselves
    and don’t cause any side effects, beginners often fall back to the imperative
    style to terminate the stream—and this can only be done through side effects.


    So how can we avoid side effects and terminate the lambda expression in a better
    way?


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | **long** countDifferentKinds() { |


    |   | List<String> names = supplies.stream() |


    |   | .filter(Supply::isUncontaminated) |


    |   | .map(Supply::getName) |


    |   | .distinct() |


    | » | .collect(Collectors.toList()); |


    |   | **return** names.size(); |


    |   | } |


    |   | } |


    The crucial part is the list that results from the lambda expression. Instead
    of populating this list ourselves, we collect() every remaining element in the
    stream in a collection. For a list, you’ll need to end the stream with collect(Collectors.toList()).
    Of course, you can get a Set or other data structures with the Collectors.toSet()
    as well.


    In the example above, we still need to get the size of the resulting list for
    our job at hand. Let’s see if we can do better:


    |   | **return** supplies.stream() |


    |   | .filter(Supply::isUncontaminated) |


    |   | .map(Supply::getName) |


    |   | .distinct() |


    | » | .count(); |


    Yes, we can. The terminating operator count() returns the number of remaining
    elements in the stream—exactly what we need. It’s a shorthand for the reduce operator
    of the Stream class^([[46]](#f_0093.xhtml_FOOTNOTE-46)): reduce(0, (currentResult,
    streamElement) -> currentResult + 1). This reduces the list to a single integer
    value. The zero here is the initial value, and we add 1 to the result for every
    element in the stream.


    To sum up, you should try to avoid forEach() for terminating a stream, because
    it can easily cause side effects. Try to use collect() and reduce() instead, which
    we’ll explain more closely in [*Use Collect for Terminating Complex Streams*](#f_0088.xhtml_sec.really_avoid_side_effects).
    These operators terminate a stream directly and produce the data structure you
    need, be it a List, Set, or even a long. This makes your lambda expressions less
    error prone.


    ## Use Collect for Terminating Complex Streams


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | Map<String, Long> countDifferentKinds() { |


    |   | Map<String, Long> nameToCount = **new** HashMap<>(); |


    |   |  |


    | » | Consumer<String> addToNames = name -> { |


    |   | **if** (!nameToCount.containsKey(name)) { |


    |   | nameToCount.put(name, 0L); |


    |   | } |


    |   | nameToCount.put(name, nameToCount.get(name) + 1); |


    |   | }; |


    |   |  |


    |   | supplies.stream() |


    |   | .filter(Supply::isUncontaminated) |


    |   | .map(Supply::getName) |


    | » | .forEach(addToNames); |


    |   | **return** nameToCount; |


    |   | } |


    |   | } |


    In the previous comparison [*Avoid Side Effects*](#f_0087.xhtml_sec.avoid_side_effects),
    we showed you how to turn a stream into a single long value with the reduce()
    operator and its special case, the count() operator. We’ve also hinted at the
    collect() operator. This one’s best for terminating streams that result in something
    that’s more complex than a primitive value.'
