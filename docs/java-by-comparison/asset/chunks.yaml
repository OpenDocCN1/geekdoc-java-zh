- fmt: "\nIf you propose a programming technique, you should be able to demonstrate\
    \ as concisely as possible how your proposal is better than what was there before.\
    \ The before/after approach puts all the facts on the table: you can directly\
    \ compare the new code to the old code. Only then can you make an informed decision\
    \ about which one’s better.\n\nThe same holds true when you’re learning how to\
    \ program. Comparing good code to bad code is really helpful when you’re trying\
    \ to figure out how to code in `Java`.\n\nWe used to teach programming at a university\
    \ for over six years. After a few lectures, there were always a few students asking\
    \ us, “How can I improve my coding skills further?” These students excelled in\
    \ their programming assignments, anyway, so we gave them the default advice: “Read\
    \ code from professionals.”\n\nHonestly, our advice wasn’t very helpful. There’s\
    \ plenty of code out in the open source software world, but it’s hard to tell\
    \ where to start. Beginners get quickly overwhelmed with the complexity of professional\
    \ code in real-life projects. And how do you know if a piece of source code is\
    \ actually of high quality? Even if it is, how can someone with only a few months\
    \ of programming experience distinguish it from a flawed hack?\n\nThat’s where\
    \ this book comes into play. It’s a companion that guides your reading in the\
    \ right direction. We’ll help you learn how to write good `Java` code by comparing\
    \ pieces of bad code with good code. And be assured: we’ve seen our fair share\
    \ of bad and good code over the years, reviewing code written by students in academia,\
    \ professionals in industry, and contributors in open source projects.\n\nThis\
    \ brings us back to the before/after approach. In this book, we’ll provide you\
    \ with 70 before/after code snippets. These snippets will help any beginner in\
    \ `Java` programming to improve. We identified these snippets during our time\
    \ of teaching `Java` to undergraduates at the university. They’re all based on\
    \ code we faced when correcting our students’ programming assignments.\n\nOur\
    \ approach in this book is simple: Given a code snippet, we’ll first explain what’s\
    \ wrong and why. Then, we’ll show you how you can transform the code into a better\
    \ solution.\n\n## Who Should Read This Book\n\nThis book is for people who are\
    \ learning to program in `Java` at a beginner or intermediate level. It’s also\
    \ a classroom resource for teachers who coach new developers in their journey\
    \ to become programmers. Here, we’re giving you tips and tricks based on more\
    \ recent `Java 8` syntax for resource handling, functional programming, or testing.\n\
    \nYou should read this book after you’ve learned the basic `Java` syntax—after\
    \ you’re able to write small programs with conditions and loops and you know the\
    \ basics of object-oriented programming. You should be able to write code that\
    \ compiles, runs, and solves small tasks like `FizzBuzz` (see the *Are You Ready?\
    \ Try the Self-Assessment*). You should be able to implement simple algorithms,\
    \ and you should know how to use basic data structures like a `list`, `queue`,\
    \ `stack`, or `map`. And obviously, you should be having fun while doing all that!\n\
    \nIf you feel a deep satisfaction when you solve a complicated problem, then that’s\
    \ an excellent start. But of course, you also know that there’s still a lot to\
    \ learn. When you reflect on your skills and you have to confess that you don’t\
    \ have a lot of experience in programming in `Java` (or even programming in general),\
    \ then you can get the maximum benefit out of this book. This means that you probably\
    \ haven’t yet developed a sense for clean code and the best practices an experienced\
    \ developer applies.\n\nIt’s about time to change this!\n\nOf course, if you already\
    \ know more advanced books on code quality, readability, maintainability, and\
    \ clean code in `Java`, such as *Effective Java* and *Clean Code*, then you’ve\
    \ already come a long way. Nevertheless, you can still find something new here\
    \ and there.\n\n### Teaching Clean Code Using This Book\n\nIf you teach programming\
    \ to newcomers as a senior developer at a company, you’re certainly aware of the\
    \ best practices we’ll go over in this book. You might even disagree with some,\
    \ depending on what you are working on. Still, this book can make your life easier\
    \ when training a junior developer—just use it as a reference. When you spot problems\
    \ in your apprentice’s code, point her to the corresponding item in this book.\
    \ Your student can read a concise and simple example for the problem you’re hinting\
    \ at, as well as how to get to the solution of the problem. At the very least,\
