  trans: "\n那么这段注释足够吗？你知道当你传递 `null` 而不是 `Queue` 实例时会发生什么吗？对于某些输入会发生运行时异常吗？\n\n不。不。而且一无所知。我们完全不知道该方法如何表现，尽管它有一段\
    \ JavaDoc 注释。所以，如果我们使用这个方法，就不再确定我们的代码将如何运行。如果你正在构建一个 API，这将会成问题。\n\n让我们看看能做些什么：\n\
    \n```\ninterface CargoShip {\n\n    Stack<Supply> unload();\n\n    /**\n     *\
    \ 将货物装载到货船上。\n     *\n     * 仅允许加载等于剩余容量的货物。\n     * 示例：\n     * int capacity\
    \ = cargoShip.getRemainingCapacity(); // 1*\n     * Queue<Supply> supplies = Arrays.asList(new\
    \ Supply(\"Apple\"));\n     * Queue<Supply> spareSupplies = cargoShip.load(supplies);\n\
    \     * spareSupplies.isEmpty(); // true;\n     * cargoShip.getRemainingCapacity()\
    \ == 0; // true\n     *\n     * @param supplies 要加载的货物；不能为 null\n     * @return\
    \ 因为容量不足而未能加载的货物；如果所有货物已加载，则为空\n     * @throws NullPointerException 如果 supplies\
    \ 为 null\n     * @see CargoShip#getRemainingCapacity() 检查容量\n     * @see CargoShip#unload()\
    \ 卸载货物\n     */\n    Queue<Supply> load(Queue<Supply> supplies);\n\n}\n```\n\n\
    现在好得多了。JavaDoc 注释读起来像是一份合同。它规定了输入及其内部状态必须处于什么状态，以保证特定的输出和状态变化。\n\n该合同涵盖了一个带有描述和代码示例的用例。注意，`<`\
    \ 字符必须使用 `&lt;` 转义，因为 `<pre>` 是 XML 环境。\n\n即使是无效输入（如 `null`），在 `@param` 描述中也有说明，并指出了违反的后果：`@throws`\
    \ `NullPointerException`。\n\n此外，注释通过 `@see` 注解引用了其他方法。它描述了你如何撤销该方法的影响，或者观察调用该方法引起的状态变化。\n\
    \n只需记住：这种“合同”的比喻并不完全适用——如果实现与与其规范不符，你通常无法起诉某人。\n\n##构造函数的 JavaDoc 结构\n\n```\n\
    class Inventory {\n\n    List<Supply> supplies;\n\n    /**\n     * 创建新 Inventory\
    \ 的构造函数。\n     */\n    Inventory() {\n        this(new ArrayList<>());\n    }\n\
    \n    /**\n     * 创建新 Inventory 的另一个构造函数。\n     * 可以向 Inventory 中添加一些货物。\n   \
    \  */\n    Inventory(Collection<Supply> initialSupplies) {\n        this.supplies\
    \ = new ArrayList<>(initialSupplies);\n    }\n}\n```\n\n在 Java 中有一种特殊类型的方法，你无法给它起良好且有意义的名字：构造函数。它们的名称与类名相同。它们的目的可能比其他方法更明确（它们总是用于构建对象），但如果你误用了它们，这些对象将是有缺陷的。这就是为什么你必须用良好且信息丰富的\
    \ JavaDoc 注释来解释构造函数。\n\n在上面的示例中，JavaDoc 写得很糟糕。总结句都没有传载任何新信息，而且它们相当过时了。下方构造函数中的第二个句子也错掉了重点。货物究竟是如何添加的？这种添加是指参数\
    \ `initialSupplies`，还是有另一个方法来执行此操作？\n\n此外，没有关于这两个构造函数之间相互关系的提示。通常当你使用第三方类时，你不会阅读源码——只看\
    \ JavaDoc。这就是为什么构造函数的 JavaDoc 注释必须解释程序员使用它所需的所有信息。\n\n那么，要正确使用这个类你需要知道什么呢？\n\n\
    ```\nclass Inventory {\n\n    List<Supply> supplies;\n\n    /**\n     * 创建一个空的库存。\n\
    \     * @see Inventory#Inventory(Collection<Supply>)\n     */\n    Inventory()\
    \ {\n        this(new ArrayList<>());\n    }\n\n    /**\n     * 创建一个带有货物的库存。\n\
    \     * @param initialSupplies 不能为 null，可以为空\n     * @throws NullPointerException\
    \ 如果 initialSupplies 为 null\n     */\n    Inventory(Collection<Supply> initialSupplies)\
    \ {\n        this.supplies = new ArrayList<>(initialSupplies);\n    }\n}\n```\n"
- fmt: "\nThis template is actually a scientific recommendation from *Sustainable\
    \ Architectural Design Decisions* [ZCTZ13](#f_0106.xhtml_d2831e532). More templates\
    \ are available on [http://adr.github.io](http://adr.github.io).\n\n[26](#f_0039.xhtml_FNPTR-26)\n\
    \n[http://www.oracle.com/technetwork/articles/java/index-137868.html](http://www.oracle.com/technetwork/articles/java/index-137868.html)\n\
    \n[27](#f_0039.xhtml_FNPTR-27)\n\nYou need to put the JavaDoc for packages into\
    \ a `package-info.java` file. Similarly, for modules in Java 9, there’s the dedicated\
    \ `module-info.java` file.\n\n[28](#f_0042.xhtml_FNPTR-28)\n\nSometimes, however,\
    \ it’s easier to hide the constructor alltogether and expose a meaningfully named\
    \ static method that invokes the hidden constructor internally—a so-called factory\
    \ method.\n\nCopyright © 2018, The Pragmatic Bookshelf.\n\nThere are only two\
    \ hard problems in Computer Science: cache invalidation and naming things.\n\n\
    Phil Karlton\n\n# Chapter 4: Name Things Right\n\n## The Etymology of Naming\n\
    \nIn Norwegian, the term for “moose” is “elg.” When the first northern settlers\
    \ from Europe came to North America and saw this huge elg-like animal in the forest,\
    \ they decided: “Okay, that’s gonna be the elg here” (or elk, as it’s spelled\
    \ in English). Turns out, they were completely wrong. The settlers happened to\
    \ meet a wapiti first—a totally different kind of deer. There is a close relative\
    \ to the European “elg” in North America, but it’s the moose. Up to the present\
    \ day, this little naming error leads to profound confusion between North American\
    \ and European friends of the wilderness, and it leads to a discussion on etymology\
    \ at the start of every “elg tour” in Scandinavia.\n\nAssigning good names can\
    \ be very hard. Even experts have a difficult time coming up with a good name\
    \ on the first try. The European settlers had a concept for moose, but they still\
    \ managed to assign it to the wrong animal.\n\nNaming’s even harder for your code.\
    \ Code doesn’t have horns or other properties that most people would recognize.\
    \ It’s abstract, and most of the time, it’s also completely new and very domain-specific.\n\
    \nThat’s why good naming is more important in programming. We have to name a whole\
    \ lot of stuff: packages, classes, methods, fields, parameters, and local variables.\
    \ And these elements often represent something unknown or hard to grasp. This\
    \ makes it very difficult to find a good name, especially in the beginning. Later,\
    \ after using an element a lot, you may find it easier to come up with a better\
    \ name because you’ll be able to relate to the concept easily.\n\nThe comparisons\
    \ in this section help you find better names for your code elements. We’ll show\
    \ you why the Java conventions matter when it comes to naming, why you should\
    \ be concise when naming methods, and how to avoid meaningless or single letter\
    \ names.\n\n## Use Java Naming Conventions\n\n```java\nclass Rover {\n    static\
    \ final double WalkingSpeed = 3;\n    final String SerialNumber;\n    double MilesPerHour;\n\
    \n    Rover(String NewSerialNumber) {\n        SerialNumber = NewSerialNumber;\n\
    \    }\n\n    void Drive() {\n        MilesPerHour = WalkingSpeed;\n    }\n\n\
    \    void Stop() {\n        MilesPerHour = 0;\n    }\n}\n```\n\nWe have to name\
    \ a lot of stuff in Java: packages, classes, interfaces, enums, methods, variables,\
    \ fields, parameters, and constants. Take a look at the code above—it contains\
    \ a lot of names. Do you notice anything strange? Can you see the pattern?\n\n\
    We consistently named everything in CamelCase: no spaces, and all words start\
    \ with a capital letter. As long as we’re consistent, we can choose any way of\
    \ naming, can’t we?\n\nWell, in theory yes, but not in practice! The Java code\
    \ out there that counts as professional follows a different style. To us, the\
    \ code above isn’t just hard to read—it even feels horribly wrong. Just to be\
    \ clear: There’s no functional error. But to a Java programmer, this doesn’t read\
    \ like Java code.\n\n### What About Package Names?\n\nYes, you caught us. We didn’t\
    \ cover package names in the code snippets. We never do in this book, actually.\
    \ But they’re important, too. Packages act like global namespaces, and you shouldn’t\
    \ have name clashes where a package has the same identifier as another package.\
    \ On the Internet, the Domain Name System (DNS) is the largest global namespace\
    \ we know. Because we programmers don’t want to reinvent the wheel over and over\
    \ again, we usually simply convert domain names into package names. For example,\
    \ the URL of our book `pragprog.com/book/javacomp` results in the package name\
    \ `com.pragprog.book.javacomp`. Just like in domain names, we don’t use capital\
    \ letters in Java package names either.\n\n### How can we change the code\n\n\
    ```java\nclass Rover {\n    static final double WALKING_SPEED = 3;\n    final\
    \ String serialNumber;\n    double milesPerHour;\n\n    Rover(String serialNumber)\
    \ {\n        this.serialNumber = serialNumber;\n    }\n\n    void drive() {\n\
    \        milesPerHour = WALKING_SPEED;\n    }\n\n    void stop() {\n        milesPerHour\
    \ = 0;\n    }\n}\n```\n\nSince 1997, we have the [Java conventions](#f_0039.xhtml_FNPTR-29)\
    \ for formatting. Above, we changed the code to conform to the Java conventions:\
    \ it’s written in CamelCase for classes and interfaces. To let constants (variables\
    \ that are final and static) stand out, you should write their names in `CAPITAL_SNAKE_CASE`.\
    \ This means that all letters in the name are uppercase, and you separate terms\
    \ with an underscore.\n\nMethods, fields, parameters, and variables use a variant\
    \ of `camelCase` where the first letter starts in lowercase. This has the downside\
    \ of a possible confusion of method (behavior) and variable (state) names since\
    \ they’re named in the same scheme. That’s why their name should tell the reader\
    \ if it’s a method or a variable. You should name your methods as verbs, as you\
    \ see in `drive()` in the code above, or let them start with verbs `is`, `has`,\
    \ `save`, `get`, or `set`. For variables, use nouns, such as `serialNumber` or\
    \ `milesPerHour`.\n\nThe Java conventions are only the very first step in good\
    \ naming. The point is that you’ll never have a good name if it doesn’t follow\
    \ the conventions (the reverse, a bad name that follows the conventions, is entirely\
    \ possible and all too common).\n\n## Follow Getter/Setter Conventions for Frameworks\n\
    \n```java\nclass Astronaut {\n    String name;\n    boolean retired;\n\n    Astronaut(String\
    \ name) {\n        this.name = name;\n    }\n\n    String getFullName() {\n  \
    \      return name;\n    }\n\n    void setFullName(String name) {\n        this.name\
    \ = name;\n    }\n\n    boolean getRetired() {\n        return retired;\n    }\n\
    \n    void setRetiredState(boolean retired) {\n        this.retired = retired;\n\
    \    }\n}\n```\n\nIn object-oriented programming languages, you usually try to\
    \ avoid direct access to the fields of a class from the outside. That’s why you\
    \ write getter and setter methods that control this access.\n"
