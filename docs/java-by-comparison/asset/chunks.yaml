  trans: "\n\n生产环境中的错误和异常值得我们特别关注。它们是代码中 Bug 和测试漏洞的霓虹灯，这使得它们的堆栈跟踪（stack traces）和上下文信息非常有价值。因此，自动收集并跟踪任何发生的异常至关重要。如果你正在构建桌面、移动端或单页应用程序，不要忘记前端——那里会发生大量的异常。我们建议后端使用\
    \ Airbrake，前端使用 Sentry。\n\n但即使你已经为生产环境做好了准备，还有另一个问题：将单行代码更改部署到生产环境需要多久？你能为你当前的项目回答这个问题吗？到生产环境的时间越长，修复问题、回滚更改或发布已就绪的新功能就越困难。持续集成系统是你的朋友。大多数系统都可以配置为不仅能构建一个完整的集成系统，还能将其部署到生产环境中。\n\
    \n当然，我们无法在这一节中涵盖整个发布策略，但如果你想了解更多，有一本专门介绍该主题的好书籍：*Release It!*\n\n## 优先使用日志而非控制台输出\n\
    \n```java\nclass LaunchChecklist {\n    List<String> checks = Arrays.asList(\"\
    Cabin Pressure\", \"Communication\", \"Engine\");\n\n    Status prepareAscend(Commander\
    \ commander) {\n        System.out.println(\"Prepare ascend\");\n        for (String\
    \ check : checks) {\n            if (commander.isFailing(check)) {\n         \
    \       System.out.println(check + \" ... FAILURE\");\n                System.err.println(\"\
    Abort take off\");\n                return Status.ABORT_TAKE_OFF;\n          \
    \  }\n            System.out.println(check + \" ... OK\");\n        }\n      \
    \  System.out.println(\"Read for take off\");\n        return Status.READY_FOR_TAKE_OFF;\n\
    \    }\n}\n```\n\n运气好的话，你只需通过代码就能发现错误。但通常情况下，这是不够的，你必须运行代码并调查内存才能发现 Bug。在开发环境中，你通常有一个调试模式可以停止执行并查看内存。但当你把程序交付到生产环境时，这不再有效。在这种情况下，你需要有意义的输出。\n\
    \n在上面的代码中，我们通过调用 `System.out.println()` 和 `System.err.println()` 来了解程序的状态。错误进入\
    \ `System.err`，所有其他信息进入 `System.out`。通过这种分离，代码已经提供了我们可能需要的所有信息，不是吗？\n\n嗯，显然不是。我们实际上遗漏了很多信息。我们不知道：\n\
    \n* 语句在什么时间打印的\n* 执行打印操作的代码行号\n* 方法参数的值\n* 是否所有打印的语句同等重要\n\n而且不仅如此。所有语句都去控制台，所以我们无法将语句子集写入文件，并通过电子邮件将重要信息发送给需要的人。最后但同样重要的一是，字符串拼接是有开销的，而我们在上面的代码中一直在这样做，即使我们并不对它们真的感兴趣。\n\
    \n解决问题的办法是使用适当的日志框架：\n\n```java\nclass LaunchChecklist {\n    private static final\
    \ Logger LOGGER = LogManager.getLogger(LaunchChecklist.class);\n\n    List<String>\
    \ checks = Arrays.asList(\"Cabin Pressure\", \"Communication\", \"Engine\");\n\
    \n    Status prepareAscend(Commander commander) {\n        LOGGER.info(\"{}: Prepare\
    \ ascend\", commander);\n        LOGGER.debug(\"{} Checks: {}\",\", checks.size(),\
    \ checks);\n        for (String check : checks) {\n            if (commander.isFailing(check))\
    \ {\n                LOGGER.warn(\"{}: {} ... FAILURE\", commander, check);\n\
    \                LOGGER.error(\"{}: Abort take off!\", commander);\n         \
    \       return Status.ABORT_TAKE_OFF;\n            }\n            LOGGER.info(\"\
    {}: {} ... OK\", commander, check);\n        }\n        LOGGER.info(\"{}: Read\
    \ for take off!\", commander);\n        return Status.READY_FOR_TAKE_OFF;\n  \
    \  }\n}\n```\n\nJava 有许多日志框架，关于它们有很多带有观点性的讨论。据我们所知，Log4j 是最广泛使用的框架之一，这也是我们在这里使用它的原因。通过\
    \ Log4j，你可以使用内部的 `Logger`，根据全局配置写入特定特定类的消息。\n\n日志记录器会自动写入更多信息，这使得追踪 Bug 变得更容易。它会记录执行语句的时间以及代码行。通过参数为语句写入所有上下文信息也相当容易。\n\
    \n我们可以配置日志框架，使得某些日志语句存储在文件中，某些发送到网络，另一些甚至打印到控制台。此外，我们还可以使用日志级别来标记消息的严重程度——例如 debug、info、warn、error\
    \ 或 fatal——通过调用正确的方法来实现。在运行时，我们可以配置日志只记录重要消息并跳过其余。不写所有调试消息可以大幅提升性能。总而言之，除了在构建中增加另一个库外，使用日志框架没有真正的缺点。这就是为什么在任何生产应用中都会使用它们。\n\
    \n## 最小化并隔离线程代码\n\n到本章为止，我们已经提供了关于如何优化开发以面向生产环境的提示。但，你还必须确保程序在生产环境中运行良好。关键在于并发，利用当今机器的多核能力。这是我们到目前几乎没有触及的内容，基本上是因为这会让书籍增加一倍。尽管如此，我们将在后面的页面中提供一些基础提示和参考来源。\n\
    \n并发并不容易，编写起来更难。根据《An Investigation of the Therac-25 Accidents》，并发软件中的 Bug 可能导致巨大的问题甚至死亡。坏消息还有：测试和静态分析在确保并发代码正确性方面异常糟糕。尽管很高，人工代码审查通常是更好的选择。\n\
    \n在这种情况下你能做什么？嗯，首先避免过度优化和线程代码，除非你有充分的理由，例如基准测试的结果糟糕。你的直觉应该是顺序方案是足够的。只有当你衡量代码并发现它太慢时，才考虑多线程。\n\
    \n但如果你编写并发代码，你应该注意良好的组织程序结构。我们建议将线程代码尽可能隔离——例如限制在代码库的少数包中——并对其进行彻底的记录。\n\n此外，你应该尽可能*使用不可变性优于可变状态*。可变数据容易产生并发\
    \ Bug，例如竞态条件或丢失更新。可变数据越少，这些 Bug 的概率就越小。\n\n这就是为什么你应该在代码中对可变数据的并发访问进行记录，特别是如何保护这些数据免受并发\
    \ Bug 的影响。\n\n"
- fmt: "\nSometimes (most of the time, actually), you just need to make your program\
    \ multithreaded. For example, you might have to handle multiple users at the same\
    \ time in a web application. Or maybe you’ve got a desktop or Android application\
    \ that interacts with the user and the screen in a UI thread and executes compute-intense\
    \ tasks in background threads.\n\nIn those cases, you’ll typically let your threads\
    \ communicate via shared memory: one thread writes a variable that another one\
    \ reads, and vice versa. Java has supported such a built-in threading model and\
    \ synchronization primitives since its inception. That’s been one of its major\
    \ advantages in comparison to other high-level languages at the time.\n\nThese\
    \ primitives are keywords like `volatile` and `synchronized`, which you can use\
    \ to mark critical sections in your code. You can also work with threads through\
    \ the `start()` and `join()` methods of the `Thread` class and use `wait()` and\
    \ `notify()` on any `Object` to let threads sleep and wake up. These primitives\
    \ work, and you can build correct multithreaded programs using only them. But\
    \ they’re also easy to misuse, and they’re tricky if you have special multithreaded\
    \ requirements, such as fairness.\n\nConcurrency primitives in Java belong to\
    \ the past. The language has evolved a lot and has undergone many improvements\
    \ in terms of higher-level classes for writing concurrent code. We recommend that\
    \ you rely exclusively on these higher-level classes. There’s more of them than\
    \ we can reasonably cover here, but examples are synchronization classes such\
    \ as `Semaphore`, `CountDownLatch`, or `CyclingBarrier` and data structures such\
    \ as `AtomicInteger`, `LongAdder`, `ConcurrentHashMap`, `CopyOnWriteArrayList`,\
    \ or `BlockingQueue`.\n\nTo use those classes correctly, you need to have a solid\
    \ understanding of how the Java Memory Model and the happens-before relations\
    \ between state changes in that model work. Maybe we’ll write a second book about\
    \ all of this one day, but if we don’t get around to it, there are several excellent\
    \ books on the subject out there waiting for you: *Java Concurrency in Practice*\
    \ [Goe06](#f_0106.xhtml_d2831e199), which we’ve mentioned before, and also *Programming\
    \ Concurrency on the JVM* [Sub11](#f_0106.xhtml_d2831e464).\n\n## Speed Up Your\
    \ Program\n\n```java\nclass Inventory {\n    List<Supply> supplies;\n\n    long\
    \ countDifferentKinds() {\n        return supplies.stream()\n            .sequential()\
    \ // this can be omitted\n            .filter(Supply::isUncontaminated)\n    \
    \        .map(Supply::getName)\n            .distinct()\n            .count();\n\
    \    }\n}\n```\n\nAlthough we’re not focused on concurrency in this book, we don’t\
    \ want to leave you without giving you one concrete hint—one comparison—that shows\
    \ how you can speed up your code using concurrency. You probably recognize the\
    \ code above from *Favor Functional Over Imperative Style*(#f_0085.xhtml_sec.favor_functional_over_imperative_style).\n\
    \nIf you look closely, you can see the call to the method `sequential()` in the\
    \ code. This call makes sure that the whole stream processes the elements sequentially.\
    \ It operates on a single element at a time. Actually, that’s the default for\
    \ streams created with `stream()`—you don’t have to call the method explicitly,\
    \ and we’ve done it here just to make the point. If the elements in the list are\
    \ processed sequentially, then obviously the code will take longer to process\
    \ a list with millions of supplies than a list with hundreds of them. Let’s assume\
    \ we’ve done a benchmark and found that this code is too slow for our application\
    \ scenario. But what can we do to make it faster?\n\nIf we do the whole computation\
    \ sequentially, then at most, one core of the CPU computes the result. However,\
    \ today’s computers (including mobile phones) have several cores, usually around\
    \ 4–8. That means we can speed up the program by using all cores concurrently.\n\
    \nWhen you have a sequential stream without side effects like in the code above,\
    \ there’s potential to run the work in parallel by distributing the work onto\
    \ several cores. We can apply the `filter()` operations for millions of supplies\
    \ concurrently, because the operation depends on a supply only. As soon as an\
    \ item has passed the filter, it can be immediately transformed using `map()`,\
    \ again because this operation doesn’t depend on other items. Even the `distinct()`\
    \ and `count()` operators can be parallelized to some degree, although not in\
    \ such a straightforward manner as the `filter()` and `map()` operators.\n\nSo\
    \ how can we distribute the work onto several cores and speed up the program?\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies;\n\n    long countDifferentKinds()\
    \ {\n        return supplies.stream()\n            .parallel()\n            .filter(Supply::isUncontaminated)\n\
    \            .map(Supply::getName)\n            .distinct()\n            .count();\n\
    \    }\n}\n```\n\nNormally, it takes a highly paid expert to convert sequential\
    \ to parallel code. But one of the many advantages of streams is that they make\
    \ parallelization a lot easier. We don’t even need to write any multithreaded\
    \ code. Remember, streams define what should be computed, instead of listing every\
    \ detail how happens. Now we bring this paradigm to its pinnacle by just switching\
    \ `sequential()` to `parallel()`.\n\nVoilà! This will parallelize the complete\
    \ computation under the hood. Alternatively, you can directly create a parallel\
    \ stream from any `Collection` with `parallelStream()`. But it is the more versatile\
    \ one. Sometimes it’s as easy as this to get n-times better performance, where\
    \ n is equal to the number of cores. Internally, the JVM provides a thread pool\
    \ that’s shared for all parallel streams.\n\nBut be aware that this solution works\
    \ only when you have a stream without side effects and where single processing\
    \ steps are independent. There’s a considerable overhead if you use operations\
    \ that force the stream to synchronize again, such as `sort()` or `forEachOrdered()`.\
    \ In that case, the `sequential()` option might actually be faster. So, when you\
    \ try to improve performance in this way, you should always benchmark your code\
    \ and make sure that your improvements have the intended effect. Note that you\
    \ can’t parallelize parts of a stream. If you include multiple calls to `sequential()`\
    \ or `parallel()` in the stream, then the last call wins.\n\n## Know Your Falsehoods\n\
    \n```java\nclass NameTag {\n    final String name;\n\n    NameTag(String fullName)\
    \ {\n        this.name = parse(fullName).toUpperCase();\n    }\n\n    String parse(String\
    \ fullName) {\n        String[] components = fullName.split(\"[, ]\");\n     \
    \   if (components == null || components.length < 2) {\n            return fullName;\n\
    \        }\n        if (fullName.contains(\",\")) {\n            return components[0];\n\
    \        } else {\n            return components[components.length - 1];\n   \
    \     }\n    }\n}\n```\n\nWe’d like to end the book with a peculiar comparison.\
    \ No matter what domain you’re in, your code’s just as good as your understanding\
    \ of the real world and no better. And the real world is complex. That’s why you\
    \ shouldn’t assume too much and make your code flexible to cope with being proven\
    \ wrong.\n"
