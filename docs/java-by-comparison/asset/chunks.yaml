  raw: 'Always closing multiple resources is prone to mistakes, because each resource
    might fail in some way. That’s hard when you close resources manually without
    a try-with-resources construct.


    Let’s look at the code above. It uses two resources: a DirectoryStream and a BufferedWriter.
    That’s something you see often: reading from one resource and writing to another.


    The resources are opened before the try and closed in the finally block afterward.
    It looks almost like the manual solution in [*Always Close Resources*](#f_0059.xhtml_sec.always_close_resources).
    But exceptions can throw you a spanner here, too:


    *   If the creation of writer fails, the method will exit with an exception and
    directoryStream won’t be closed.


    *   If closing directoryStream causes an exception, then writer won’t be closed.


    We can use try-with-resources again.


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** Path STATISTICS_CSV = LOG_FOLDER.resolve(*"stats.csv"*);
    |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | **void** createStatistics() **throws** IOException { |


    | » | **try** (DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER); |


    |   | BufferedWriter writer = |


    |   | Files.newBufferedWriter(STATISTICS_CSV)) { |


    |   | **for** (Path logFile : directoryStream) { |


    |   | String csvLine = String.format(*"%s,%d,%s"*, |


    |   | logFile, |


    |   | Files.size(logFile), |


    |   | Files.getLastModifiedTime(logFile)); |


    |   | writer.write(csvLine); |


    |   | writer.newLine(); |


    |   | } |


    |   | } |


    |   | } |


    |   | } |


    A try-with-resources block isn’t limited to one resource—it can handle multiple
    resources at the same time. Even when something goes wrong, it ensures that all
    of the resources are always closed. To use multiple resources in a try-with-resources,
    you just need to separate them by a semicolon:


    |   | **try** (open resource1; open resource2) { |


    |   | *// use resources* |


    |   | } |


    Internally, the compiler expands each resource in the try-with-resources block
    and creates a nesting of multiple blocks. The innermost try-finally block uses
    the opened resources.


    |   | *// open resource1* |


    |   | **try** { |


    |   | *// open resource2* |


    |   | **try** { |


    |   | *// use resource1 and resource2* |


    |   | } **finally** { resource2.close(); } |


    |   | } **finally** { resource1.close(); } |


    Heed our advice: don’t manage resources manually—you’ll only shoot yourself in
    the foot. Open resources in a try-with-resources block—and your feet stay unharmed.


    ## Explain Empty Catch


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | List<Path> getLogs() **throws** IOException { |


    |   | List<Path> result = **new** ArrayList<>(); |


    |   |  |


    |   | **try** (DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) { |


    |   | **for** (Path logFile : directoryStream) { |


    |   | result.add(logFile); |


    |   | } |


    | » | } **catch** (NotDirectoryException e) { |


    |   |  |


    |   | } |


    |   |  |


    |   | **return** result; |


    |   | } |


    |   | } |


    In the last comparison of this chapter, we’re going back to catching exceptions.
    Above, you can see a different version of the LogBook example from the previous
    pages. It closes resources properly, but something else is strange: the catch
    block.


    You should catch exceptions if and only if you can handle them in a meaningful
    way. The catch block contains the code that handles the exception. You can handle
    exceptions in many ways. For example, you can retry something else or just log
    that the exception occurred.


    Sometimes, swallowing an exception and doing nothing is actually the right thing
    to do. Nevertheless, when we stumble upon an empty catch block, we always get
    a weird feeling: Is this a bug? Was the catch added unintentionally, for example
    by the IDE, and does it hide the exception? Or is it a feature? Did the programmer
    leave the catch block empty on intention?


    In the end, we don’t know. An empty catch without any hint of why it’s empty always
    looks like a bug. We can’t know for sure that it’s been intended. That means we’ll
    have to waste precious programming time to double-check.


    After all, better to be safe than sorry.


    So how can we explain the intentions here?


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | List<Path> getLogs() **throws** IOException { |


    |   | List<Path> result = **new** ArrayList<>(); |


    |   |  |


    |   | **try** (DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) { |


    |   | **for** (Path logFile : directoryStream) { |


    |   | result.add(logFile); |


    |   | } |


    | » | } **catch** (NotDirectoryException ignored) { |


    |   | *// No directory -> no logs!* |


    |   | } |


    |   |  |


    |   | **return** result; |


    |   | } |


    |   | } |


    This looks much better. The catch block no longer signals to us that something
    might be wrong.


    We achieved this with two changes.


    First, we renamed the exception variable e to ignored. It’s more self-explanatory
    and states explicitly that we want to ignore the exception. This name is almost
    a convention. Modern IDEs understand it, too, and no longer warn that there’s
    an empty catch block.


    And second, we add a comment why we ignore the exception. This is important, because
    others programmers will have it easier to comprehend this decision. Since it’s
    a sort of design decision, we suggest that you use a template here, similar to
    [*Document Implementation Decisions*](#f_0037.xhtml_sec.document_implementation_decisions).
    The template we propose is CONDITION -> EFFECT. The condition captures the reason
    why the exception has been thrown and the effect states why we can swallow and
    ignore it.


    You might say that the comment alone should be enough. But we recommend that you
    do the renaming and add the comment. Ultimately, the exception variable always
    needs a name and we should give it a better one than the generic e.


    ## What Have You Learned?


    Handling exceptions is inevitable in any program you write. As you’ve seen in
    this chapter, it’s easy to get a subtle detail wrong with exceptions, such as
    forgetting to link exceptions into a cause chain or failing to close resources
    properly.


    When you make such mistakes, your program will still compile. Java doesn’t force
    you to provide good messages for exceptions or to link them with each other. That’s
    a problem, because you might realize these issues only at a late stage, typically
    when your program has been deployed to production with real-world data. Then,
    you get bug reports with broken stack traces or meaningless error messages, which
    makes it very hard to track down their cause. So make your future working life
    easier by writing proper exception handling code right from the start! It will
    make a bad impression when you’re trying to deploy software at a customer and
    you can’t figure out what’s causing the troubles.


    That’s why we’ve shown you how to write informative messages for exceptions that
    help with debugging and how you can expose this information in your program. You’re
    also aware of the things that can go wrong when you deal with exceptions in the
    wrong way—so you won’t accidentally swallow exceptions by catching a type that’s
    too general, forget to check types before casting with the instanceof operator,
    or create memory leaks by failing to close resources properly. Lastly, we’ve shown
    you how to structure your exception handling code in a way that’s easier to read
    and understand: by failing fast and explaining empty catch blocks.'
