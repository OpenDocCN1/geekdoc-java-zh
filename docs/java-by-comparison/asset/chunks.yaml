    If blocks of code are pressed next to each other, you get the impression that
    they belong together. You can improve the readability of your code a lot if you
    separate distinct blocks with new lines.


    The code here shows an enum that returns the conversion rate between miles and
    kilometers. Actually, the semantics of that code are fine^([[22]](#f_0031.xhtml_FOOTNOTE-22))
    and the problem is quite concealed. We’ve already applied [*Replace Magic Numbers
    with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant), so what
    could be wrong?


    Simple: What’s missing is space! In particular, getConversionRate() glues all
    lines of code together. But is this really a single block or does it consist of
    different parts? We can improve the readability of the code by adding empty lines
    that act as a separator. It’s similar to this book, which captures single thoughts
    or arguments within paragraphs separated by new lines.


    We’ve already separated the enum values from the constants through an empty line.
    But take a look at the two highlighted lines of code. Does this seem right to
    you?


    That leads to the question: where would an empty line make sense? Which parts
    should be separated? Which parts should be kept together?


    |   | **enum** DistanceUnit { |


    |   |  |


    |   | MILES, KILOMETERS; |


    |   |  |


    | » | **static** **final** **int** IDENTITY = 1; |


    |   |  |


    |   | **static** **final** **double** MILE_IN_KILOMETERS = 1.60934; |


    |   | **static** **final** **double** KILOMETER_IN_MILES = 1 / MILE_IN_KILOMETERS;
    |


    |   |  |


    |   | **double** getConversionRate(DistanceUnit unit) { |


    |   | **if** (**this** == unit) { |


    |   | **return** IDENTITY; |


    |   | } |


    |   |  |


    | » | **if** (**this** == MILES && unit == KILOMETERS) { |


    |   | **return** MILE_IN_KILOMETERS; |


    |   | } **else** { |


    |   | **return** KILOMETER_IN_MILES; |


    |   | } |


    |   | } |


    |   | } |


    In our solution, we’ve separated some parts of the code by new lines.


    First, we’ve separated the IDENTITY field from the other constants. This field
    should stand alone, because it’s independent of a particular unit and more abstract
    than the two conversion rates between miles and kilometers.


    In getConversionRate(), we’ve separated the two if statements from each other.
    We’ve done this because they check for different things: the first one performs
    an identity check, the second one a conversion. An empty line makes that more
    obvious to the reader through a vertical separation.


    As a rule of thumb, you should try to group related code and concepts together
    and separate different groups from each other through empty lines.


    The concept of vertical space goes even further. Robert C. Martin uses the metaphor
    of a newspaper in his book [*Clean Code* [Mar08]](#f_0106.xhtml_d2831e398) for
    describing vertical formatting. A good article starts with the title (class name),
    goes over section headings (public members, constructors, and methods), down to
    its very details (private methods). If you structure your code this way, you’ll
    find it much easier to make sense of a class already if you only scroll over the
    code. Chances are, it’s easier to locate features in the class as well.


    ## Favor Format Over Concatenation


    |   | **class** Mission { |


    |   |  |


    |   | Logbook logbook; |


    |   | LocalDate start; |


    |   |  |


    |   | **void** update(String author, String message) { |


    |   | LocalDate today = LocalDate.now(); |


    |   | String month = String.valueOf(today.getMonthValue()); |


    |   | String formattedMonth = month.length() < 2 ? *"0"* + month : month; |


    | » | String entry = author.toUpperCase() + *": ["* + formattedMonth + *"-"* +
    |


    |   | today.getDayOfMonth() + *"-"* + today.getYear() + *"](Day "* + |


    |   | (ChronoUnit.DAYS.between(start, today) + 1) + *")> "* + |


    |   | message + System.lineSeparator(); |


    |   | logbook.write(entry); |


    |   | } |


    |   | } |


    Understandability and readability don’t just matter in your code—they’re also
    important for the output your code produces.


    If you have to build large strings, you can use format strings to make them more
    readable.


    Here, we’re revisiting the log book we already mentioned in [*Avoid NullPointerException
    in Conditionals*](#f_0017.xhtml_sec.avoid_nullpointerexception_in_conditionals).
    The problem is that it’s quite hard to see what the output will actually look
    like. There are multiple String variables, some of them using Java’s in-line notation.


    The code isn’t really complex. There’s no deep nesting, no conditional branching,
    and even the names of variables and methods are meaningful. Despite all this,
    it’s comparably hard to read. The number of plusses, quotes, and spaces obfuscates
    the actual processing going on (humans are generally better at understanding words
    in a natural language than combinations of symbols). This makes the code harder
    to read and increases the chance of making mistakes when writing it.


    Additionally, performing in-line computations like summing int values adds to
    the confusion, as the + operator has different semantics when it comes to Strings
    and ints. Using it with different semantics in the very same line makes it even
    harder to maintain an overview of what’s happening. Don’t do this!


    We can trim this down a lot. Take a look at the following code:


    |   | **class** Mission { |


    |   |  |


    |   | Logbook logbook; |


    |   | LocalDate start; |


    |   |  |


    |   | **void** update(String author, String message) { |


    | » | **final** LocalDate today = LocalDate.now(); |


    | » | String entry = String.format(*"%S: [%tm-%<te-%<tY](Day %d)> %s%n"*, |


    |   | author, today, |


    |   | ChronoUnit.DAYS.between(start, today) + 1, message); |


    |   | logbook.write(entry); |


    |   | } |


    |   | } |


    Format strings help to overcome this issue, and they’re available in practically
    any contemporary programming language—not just in Java. The key lies in separating
    the layout of a String (how it is printed) from the data (what is being printed).
    Format strings define a coherent String in a single block using special placeholder
    characters, marked by %.


    Format methods, such as String.format(), or System.out.printf(), accept data using
    placeholder characters in the order in which they’re listed after the String.


    In our example here, %S converts an object into an upper case String using its
    toString() method. The parameter author will be processed this way. The date variable
    today serves as data for %tm, the month, %te the day of the month, and %tY, the
    year. The additional character < makes sure that all three placeholders read the
    same input data. %d processes a decimal value and %s accepts a String. Finally,
    %n is the symbol for a line break.


    The actual data is listed in a nicely formatted fashion after the String layout.
    This makes it a little more acceptable to perform in-line computations, as we
    can use one line for each parameter. Point taken that it’s not so easy to see
    what "%S: [%tm-%<te-%<tY](Day %d)> %s%n" will print in the end. But it’s a well-documented
    standard^([[23]](#f_0031.xhtml_FOOTNOTE-23)) and actually a good alternative to
    the cluttered code from the problem—for large strings we recommend StringTemplate,^([[24]](#f_0031.xhtml_FOOTNOTE-24))
    a powerful template engine.


    Consider documenting the formatted string with a few examples similar to [*Document
    Using Examples*](#f_0038.xhtml_sec.document_regex_using_examples) so that the
    next developer reading your code doesn’t have to look up how %S or any other special
    formatting syntax behaves to know what the resulting string will be.


    ## Favor Java API Over DIY'
