  trans: "\n但当流返回了错误的类型时，派对就结束了！该方法无法控制哪些类型实际上被写入流中。如果流的另一端有人插入了不同的消息类型怎么办——例如，`ClassifiedMessage`？无论原因如何，你可以确定，在某个点，会出现一个不是\
    \ `CrewMessage` 的对象。这时，该方法（甚至可能是整个程序）将会抛出 `ClassCastException` 并导致崩溃。\n\n你可以捕获这个异常吗？你可以捕获，但不应该这样做，因为这通常意味着代码中存在一个你可以修复的\
    \ bug。因此，你应该修复代码。\n\n幸运的是，你只需要在转换之前进行适当的类型检查：\n\n```java\nclass Network {\n  \
    \  ObjectInputStream inputStream;\n    InterCom interCom;\n\n    void listen()\
    \ throws IOException, ClassNotFoundException {\n        while (true) {\n     \
    \       Object signal = inputStream.readObject();\n            if (signal instanceof\
    \ CrewMessage) {\n                CrewMessage crewMessage = (CrewMessage) signal;\n\
    \                interCom.broadcast(crewMessage);\n            }\n        }\n\
    \    }\n}\n```\n\n上面的代码首先将从流读取的结果存储在一个名为 `signal` 的本地变量中。变量的类型是 `Object`，因此这行代码不会因为类型问题而失败。毕竟，所有非原生\
    \ Java 类型都继承自 `Object`。\n\n接下来，我们通过使用 `instanceof` 运算符进行类型检查，确保我们可以读取该信号。如果 `signal`\
    \ 可以转换为 `CrewMessage` 类型，该运算符返回 `true`，否则返回 `false`。只有在检查通过时，我们才允许进行显式转换。这确保了这里不会发生\
    \ `ClassCastException`。我们安全了！\n\n这需要额外的代码行，但在 Java 中没有其他方法可以避免 `ClassCastException`。当你预期一组不同的类型（在我们的示例中是不同类型的消息）时，你必须对\
    \ `instanceof` 进行一系列检查。\n\n方法签名中还有另外一种异常类型，你不应该将其与 `ClassCastException` 混淆。当 `ObjectInputStream`\
    \ 尝试读取一个类型不在程序类路径（classpath）中的对象时，会触发 `ClassNotFoundException` 异常。显然，你无法通过类型检查避免这一点。通常，此异常意味着你的执行环境出了问题，但它并不一定源于代码中的\
    \ bug。在生产环境中，你也应该捕获并记录它。在开发期间，最好让程序崩溃并在继续之前更新环境。\n\n所以请记住，每当你的程序与外部交互（例如使用流）时，你都需要确保它能够处理意外的输入。\n\
    \n## 始终关闭资源\n\n```java\nclass Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"\
    /var/log\");\n    static final String FILE_FILTER = \"*.log\";\n\n    List<Path>\
    \ getLogs() throws IOException {\n        List<Path> result = new ArrayList<>();\n\
    \n        DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n        for (Path logFile : directoryStream) {\n            result.add(logFile);\n\
    \        }\n        directoryStream.close();\n\n        return result;\n    }\n\
    }\n```\n\n程序需要系统资源，例如磁盘空间、数据库或网络连接、CPU 线程和内存。这些资源是有限的，程序必须在它们之间共享。如果某个程序获取了资源而不释放，它可能会导致整个环境崩溃。关于关于该问题的更深入的解释，请参阅这篇文章。\n\
    \n我们程序员需要防止这一点！这个计划听起来很直接：在不再需要资源时立即释放。但一如既往，魔鬼隐藏在细节中（或者代码中）。\n\n看看上面的方法。它使用了\
    \ `DirectoryStream`，这是一种系统资源。它通过调用 `close()` 方法来释放资源。一切看起来都正确，不是吗？\n\n遗憾并非如此。当一切顺利时，程序打开资源、使用它，然后通过\
    \ `close()` 方法将其关闭。但如果程序打开了资源，在在使用过程中发生了异常，导致还没来得及调用 `close()` 释放资源了呢？异常将阻止 `close()`\
    \ 的执行。那么，资源在程序终止之前就不会被释放。\n\n这被称为“资源泄漏”。如果程序稍后尝试再次获取相同的资源，可能会损害程序本身。这绝对不是构建长期运行应用程序的方法。\n\
    \n那么，我们如何确保代码始终关闭其已使用的资源呢？\n\n```java\nclass Logbook {\n    static final Path\
    \ LOG_FOLDER = Paths.get(\"/var/log\");\n    static final String FILE_FILTER =\
    \ \"*.log\";\n\n    List<Path> getLogs() throws IOException {\n        List<Path>\
    \ result = new ArrayList<>();\n\n        try (DirectoryStream<Path> directoryStream\
    \ = Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) {\n            for (Path\
    \ logFile : directoryStream) {\n                result.add(logFile);\n       \
    \     }\n        }\n        return result;\n    }\n}\n```\n\n自 Java 7 以来，我们可以安全且优雅地使用\
    \ `try-with-resources` 关闭资源。这适用于任何实现了 `AutoCloseable` 接口的类，而资源类基本上如此。我们需要在 `try`\
    \ 后括号中打开资源。然后，资源在 `try` 的作用范围内可用，并且无论块结束后，Java 都会处理 `close()`。\n\n实际上， `try-with-resources`\
    \ 只是语法糖。编译器将其展开为类似的内容：\n\n```java\nDirectoryStream<Path> resource = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\ntry {\n    // usage of resource\n} finally {\n    if (resource\
    \ != null) {\n        resource.close();\n    }\n}\n```\n\n这段代码在 `try` 之前打开资源，并使用\
    \ `finally` 块确保资源被关闭，但只有在它不为空时才关闭，以避免下一行出现 `NullPointerException`。这显然没有 `try-with-resources`\
    \ 那样优雅和简单。\n\n你并不真的需要编译器——你可以自己实现资源的关闭。事实上，在 Java 7 之前，你正是必须这样做。但我们的建议是：让你的代码保持优雅，让编译器去工作。\n\
    \n## 始终关闭多个资源\n\n```java\nclass Logbook {\n    static final Path LOG_FOLDER =\
    \ Paths.get(\"/var/log\");\n    static final Path STATISTICS_CSV = LOG_FOLDER.resolve(\"\
    stats.csv\");\n    static final String FILE_FILTER = \"*.log\";\n\n    void createStatistics()\
    \ throws IOException {\n        DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n        BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV);\n\
    \n        try {\n            for (Path logFile : directoryStream) {\n        \
    \        final String csvLine = String.format(\"%s,%d,%s\",\n                \
    \    logFile,\n                    Files.size(logFile),\n                    Files.getLastModifiedTime(logFile));\n\
    \                writer.write(csvLine);\n                writer.newLine();\n \
    \           }\n        } finally {\n            directoryStream.close();\n   \
    \         writer.close();\n        }\n    }\n}\n```\n\n正如你之前看到的那样，正确关闭资源对程序的稳定性至关重要。如果你同时使用多个资源，关闭操作就会变得格外困难。\n"
- fmt: "\nAlways closing multiple resources is prone to mistakes, because each resource\
    \ might fail in some way. That’s hard when you close resources manually without\
    \ a try-with-resources construct.\n\nLet’s look at the code above. It uses two\
    \ resources: a `DirectoryStream` and a `BufferedWriter`. That’s something you\
    \ see often: reading from one resource and writing to another.\n\nThe resources\
    \ are opened before the try and closed in the finally block afterward. It looks\
    \ almost like the manual solution in [*Always Close Resources](#f_0059.xhtml_sec.always_close_resources).\
    \ But exceptions can throw you a spanner here, too:\n\n* If the creation of writer\
    \ fails, the method will exit with an exception and `directoryStream` won’t be\
    \ closed.\n* If closing `directoryStream` causes an exception, then `writer` won’t\
    \ be closed.\n\nWe can use try-with-resources again.\n\n```java\nclass Logbook\
    \ {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\");\n    static final\
    \ Path STATISTICS_CSV = LOG_FOLDER.resolve(\"stats.csv\");\n    static final String\
    \ FILE_FILTER = \"*.log\";\n\n    void createStatistics() throws IOException {\n\
    \        try (DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n             BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV))\
    \ {\n            for (Path logFile : directoryStream) {\n                String\
    \ csvLine = String.format(\"%s,%d,%s\",\n                    logFile,\n      \
    \              Files.size(logFile),\n                    Files.getLastModifiedTime(logFile));\n\
    \                writer.write(csvLine);\n                writer.newLine();\n \
    \           }\n        }\n    }\n}\n```\n\nA try-with-resources block isn’t limited\
    \ to one resource—it can handle multiple resources at the same time. Even when\
    \ something goes wrong, it ensures that all of the resources are always closed.\
    \ To use multiple resources in a try-with-resources, you just need to separate\
    \ them by a semicolon:\n\n```java\ntry (open resource1; open resource2) {\n  \
    \  // use resources\n}\n```\n\nInternally, the compiler expands each resource\
    \ in the try-with-resources block and creates a nesting of multiple blocks. The\
    \ innermost try-finally block uses the opened resources.\n\n```java\n// open resource1\n\
    try {\n    // open resource2\n    try {\n        // use resource1 and resource2\n\
    \    } finally { resource2.close(); }\n} finally { resource1.close(); }\n```\n\
    \nHeed our advice: don’t manage resources manually—you’ll only shoot yourself\
    \ in the foot. Open resources in a try-with-resources block—and your feet stay\
    \ unharmed.\n\n## Explain Empty Catch\n\n```java\nclass Logbook {\n    static\
    \ final Path LOG_FOLDER = Paths.get(\"/var/log\");\n    static final String FILE_FILTER\
    \ = \"*.log\";\n\n    List<Path> getLogs() throws IOException {\n        List<Path>\
    \ result = new ArrayList<>();\n\n        try (DirectoryStream<Path> directoryStream\
    \ = Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) {\n            for (Path\
    \ logFile : directoryStream) {\n                result.add(logFile);\n       \
    \     }\n        } catch (NotDirectoryException e) {\n\n        }\n\n        return\
    \ result;\n    }\n}\n```\n\nIn the last comparison of this chapter, we’re going\
    \ back to catching exceptions. Above, you can see a different version of the LogBook\
    \ example from the previous pages. It closes resources properly, but something\
    \ else is strange: the catch block.\n\nYou should catch exceptions if and only\
    \ if you can handle them in a meaningful way. The catch block contains the code\
    \ that handles the exception. You can handle exceptions in many ways. For example,\
    \ you can retry something else or just log that the exception occurred.\n\nSometimes,\
    \ swallowing an exception and doing nothing is actually the right thing to do.\
    \ Nevertheless, when we stumble upon an empty catch block, we always get a weird\
    \ feeling: Is this a bug? Was the catch added unintentionally, for example by\
    \ the IDE, and does it hide the exception? Or is it a feature?\n\n```java\nclass\
    \ Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\");\n   \
    \ static final String FILE_FILTER = \"*.log\";\n\n    List<Path> getLogs() throws\
    \ IOException {\n        List<Path> result = new ArrayList<>();\n\n        try\
    \ (DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER)) {\n            for (Path logFile : directoryStream) {\n      \
    \          result.add(logFile);\n            }\n        } catch (NotDirectoryException\
    \ e) {\n\n        }\n\n        return result;\n    }\n}\n```\nIn the last comparison\
    \ of this chapter, we’re going back to catching exceptions. Above, you can see\
    \ a different version of the LogBook example from the previous pages. It closes\
    \ resources properly, but something else is strange: the catch block.\n\nYou should\
    \ catch exceptions if and only if you can handle them in a meaningful way. The\
    \ catch block contains the code that handles the exception. You can handle exceptions\
    \ in many ways. For example, you can retry something else or just log that the\
    \ exception occurred.\n\nSometimes, swallowing an exception and doing nothing\
    \ is actually the right thing to do. Nevertheless, when we stumble upon an empty\
