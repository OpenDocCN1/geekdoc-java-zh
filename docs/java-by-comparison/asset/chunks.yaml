    \ have a team meeting and decide on your project template! And be sure to mark\
    \ affected places in your code as well, just as we did with the comment for the\
    \ list field.\n\n## Document Using Examples\n\n```java\nclass Supply {\n    /**\n\
    \     * The code universally identifies a supply.\n     * It follows a strict\
