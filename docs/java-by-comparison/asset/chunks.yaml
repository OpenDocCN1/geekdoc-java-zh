  trans: "\n\n```java\nclass Example {\n    private double targetSpeedKmh;\n\n   \
    \ void setPreset(int speedPreset) {\n        if (speedPreset == CRUISE_SPEED_PRESET)\
    \ {\n            setTargetSpeedKmh(CRUISE_SPEED_KMH);\n        } else if (speedPreset\
    \ == PLANETARY_SPEED_PRESET) {\n            setTargetSpeedKmh(PLANETARY_SPEED_KMH);\n\
    \        } else if (speedPreset == STOP_PRESET) {\n            setTargetSpeedKmh(STOP_SPEED_KMH);\n\
    \        }\n    }\n\n    void setTargetSpeedKmh(double speedKmh) {\n        targetSpeedKmh\
    \ = speedKmh;\n    }\n}\n```\n\n正如你在之前的比较中看到的，常量（用常量替换魔数）相比于魔数是一个巨大的改进。但如果你可以列出所有选项，Java\
    \ 的类型系统提供了一个更好的解决方案。\n\n在这段代码中，输入参数 `speedPreset` 仍然是一个整数。这意味着仍然可以向 `setPreset()`\
    \ 传入任何整数值，甚至是负数。毕竟，没有人强迫你真正使用如 `STOP_PRESET` 之类的常量。\n\n如果你向 `setPreset()` 传入一个无效的整数值，该方法什么都没做。它检查了条件，然后返回，而不改变状态或抛出错误。这比崩溃要好，但它仍然会导致你的程序中出现各种\
    \ Bug。\n\n在 Java 等静态类型语言中，你应该利用某些特性来尽早地发现此类错误，甚至在程序第一次运行之前。你发现错误越早，修复它的成本就越低！\n\
    \n那么，我们如何转换这段代码以确保编译器拒绝非法值呢？\n\n```java\nclass CruiseControl {\n    private double\
    \ targetSpeedKmh;\n\n    void setPreset(SpeedPreset speedPreset) {\n        Objects.requireNonNull(speedPreset);\n\
    \        setTargetSpeedKmh(speedPreset.speedKmh);\n    }\n\n    void setTargetSpeedKmh(double\
    \ speedKmh) {\n        targetSpeedKmh = speedKmh;\n    }\n}\n\nenum SpeedPreset\
    \ {\n    STOP(0), PLANETARY_SPEED(7667), CRUISE_SPEED(16944);\n\n    final double\
    \ speedKmh;\n\n    SpeedPreset(double speedKmh) {\n        this.speedKmh = speedKmh;\n\
    \    }\n}\n```\n\nJava 的类型系统在在这种情况下对防止非法输入值非常有帮助。如果你能像这个示例一样列出所有可用选项，那么使用枚举（enum）类型始终比整数更好。\n\
    \n在解决方案中，我们创建了一个名为 `SpeedPreset` 的新枚举，它包含一个变量，用于捕获给定实例的 `speedKmh`。这个枚举列出了所有可用选项：`STOP`、`PLANETARY_SPEED`\
    \ 和 `CRUISE_SPEED`。\n\n这里的关键优势是，你无法再向 `setPreset()` 方法传入一个不存在的 `SpeedPreset`。即使你尝试这样做，Java\
    \ 编译器也会阻止你。\n\n我们仍然在使用具有描述性的名称而不是裸数字，就像在 用常量替换魔数 中一样。此外，我们去掉了实际 `targetSpeedKmh`\
    \ 的常量，因为它们已经是枚举的一部分。\n\n最后，我们甚至可以移除 `setPreset()` 中的 `if-elseif` 块。现在，代码变得不那么复杂，看起来更加简洁。\n\
    \n## 优先使用 For-Each 循环代替 For Loop\n\n```java\nclass LaunchChecklist {\n    List<String>\
    \ checks = Arrays.asList(\"Cabin Pressure\", \"Communication\", \"Engine\");\n\
    \n    Status prepareForTakeoff(Commander commander) {\n        for (int i = 0;\
    \ i < checks.size(); i++) {\n            boolean shouldAbortTakeoff = commander.isFailing(checks.get(i));\n\
    \            if (shouldAbortTakeoff) {\n                return Status.ABORT_TAKE_OFF;\n\
    \            }\n        }\n        return Status.READY_FOR_TAKE_OFF;\n    }\n\
    }\n```\n\n遍历数据结构有很多方法。初学者通常学到的方法并不最好。\n\n这里的代码展示了对名为 `checks` 的 List 数据结构进行迭代。它使用\
    \ `for` 循环并使用索引变量 `i` 遍历 `checks`。\n\n这是一种非常传统的迭代方式，适用于所有 C 风格的编程语言。它通常与数组相关，但在\
    \ Java 中，它适用于所有索引集合（但不支持 Set 或 Map）。它的优点是你可以随地获取当前的迭代索引 `i`。\n\n但在代码片段中，除了访问列表的下一个元素外，我们没有使用该索引。那么我们为什么要跟踪它呢？\n\
    \n此外，索引变量为错误打开了大门。它是不保护的，你可以随时覆盖它。正确设置终止条件是初学者们臭名昭著困难的问题。这可能导致尴尬的 `IndexOutOfBoundsException`。\n\
    \n```java\nclass LaunchChecklist {\n    List<String> checks = Arrays.asList(\"\
    Cabin Pressure\", \"Communication\", \"Engine\");\n\n    Status prepareForTakeoff(Commander\
    \ commander) {\n        for (String check : checks) {\n            boolean shouldAbortTakeoff\
    \ = commander.isFailing(check);\n            if (shouldAbortTakeoff) {\n     \
    \           return Status.ABORT_TAKE_OFF;\n            }\n        }\n        return\
    \ Status.READY_FOR_TAKE_OFF;\n    }\n}\n```\n\n这种语法初看起来看起来很奇怪，但证明非常方便。它可以读作“对于\
    \ checks 中的每一个 check，执行以下操作……” 它定义了一个局部变量，可以通过它访问集合中的项——在我们的示例中是 `check`，后面跟着冒号和被迭代操作的数据结构——`checks`。\n\
    \n在每次迭代中，Java 确保将数据结构中的新对象赋值给 `check`。不再需要处理迭代索引了！它甚至适用于数组和 Set 等无索引集合。\n\n在大多数情况下，这是你应该采用的语法。显而易见，集合中的每个元素都被处理了，这种语法保护了迭代状态（问题中的索引\
    \ `i`）免受篡改。注意有一个命名约定使用 `(类型 : 复数)` 作为变量名。\n\n另一种循环机制是使用迭代器，如 在迭代期间修改集合 中。\n\n\
    你可能会问自己什么时候使用传统的索引迭代方式更合适。答案是：几乎没有。大多数时候，你只是想处理数据结构的每一个元素。\n\n如果是这样，那么处理索引就是一个你不必担心的实现细节。\n\
    \n## 在迭代期间修改集合\n\n```java\nclass Inventory {\n    private List<Supply> supplies\
    \ = new ArrayList();\n\n    void disposeContaminatedSupplies() {\n        for\
    \ (Supply supply : supplies) {\n            if (supply.isContaminated()) {\n \
    \               supplies.remove(supply);\n            }\n        }\n    }\n}\n\
    ```\n\n"
- fmt: "\nWe iterate over arrays, lists, or other data structures all the time. Most\
    \ of the time, we only read from those data structures—for instance, when creating\
    \ an invoice from a list of ordered items or searching for an item in a list by\
    \ name. But you need to be careful when you modify the structure. Otherwise, you\
    \ risk crashing your program.\n\nThis code describes a fairly simple iteration\
    \ over a data structure: a `List` of supplies. If a `Supply` is `isContaminated()`,\
    \ the inventory system removes it from the `List`.\n\nThis code looks completely\
    \ innocent, doesn’t it?\n\nAlthough the code looks okay, it’ll crash reliably\
    \ when at least one `Supply` in the inventory list is contaminated. Even worse,\
    \ it’ll work fine until this happens the first time. And worse yet, it’ll work\
    \ fine if all supplies are clean, making the bug hard to detect.\n\nThe problem\
    \ is that we call `supplies.remove(supply)` while we’re inside a `for` loop that\
    \ iterates over the `supplies`. In this situation, a standard implementation of\
    \ the `List` interface, or indeed of other `Collection` interfaces such as `Set`\
    \ or `Queue`, will throw a `ConcurrentModificationException`. We can’t simply\
    \ modify a `List` while we iterate over it.\n\nThe name `ConcurrentModificationException`\
    \ makes many people wonder about concurrency in their single-threaded application.\
    \ That’s quite misleading, since no actual concurrency takes place here! Instead,\
    \ we iterate over the `Collection`, and while we’re doing that, we modify that\
    \ collection. Unfortunately, no compile-time check in Java saves us from this\
    \ error.\n\nSo how can you do this properly without raising the `ConcurrentModificationException`?\n\
    \n```java\nclass Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\
    \n    void disposeContaminatedSupplies() {\n        Iterator<Supply> iterator\
    \ = supplies.iterator();\n        while (iterator.hasNext()) {\n            if\
    \ (iterator.next().isContaminated()) {\n                iterator.remove();\n \
    \           }\n        }\n    }\n}\n```\n\nIn the straightforward solution to\
    \ this problem, we would iterate the list in search of any contaminated supplies,\
    \ and afterward, we would remove any previously found supplies. Think of a two-step\
    \ approach: first iterate and then modify.\n\nThis would work, but it would require\
    \ quite a few lines of code. And we would need to save the contaminated supplies\
    \ in a temporary data structure during iteration. This would consume extra time\
    \ and memory.\n\nThe solution we’ve depicted here uses another way of iteration:\
    \ a `while` loop that relies on the `Iterator` of our supplies collection. The\
    \ `Iterator` is our rescue. It acts like a pointer to an element in the list,\
    \ starting with the first one. We can ask if any elements are left via `hasNext()`,\
    \ get the `next()` element, and safely `remove()` the last element returned.\n\
    \nAlthough we can’t modify a `List` directly, the iterator is perfectly capable\
    \ of doing this. Its job is to make sure that everything works during the iteration.\n\
    \nTechnically, the `for-each` loop in the previous example also builds on such\
    \ an iterator, but it hides this fact from the programmer. That’s nice, since\
    \ it reduces the complexity of the code. But it also prevents us from using the\
    \ `remove()` method of the iterator.\n\nSome special `List` implementations like\
    \ `CopyOnWriteArrayList` can deal with modification during iteration. But such\
    \ characteristics come at a price. Do you really want to copy the whole list each\
    \ time you add or remove an element? Since Java 8, you can also use the new `Collection.remove()`\
    \ method that makes use of lambdas. But be sure to read Chapter 8 before you use\
    \ that method!\n\n## Avoid Compute-Intense Operations During Iteration\n\n```java\n\
    class Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\n\
    \    List<Supply> find(String regex) {\n        List<Supply> result = new LinkedList<>();\n\
    \        for (Supply supply : supplies) {\n            if (Pattern.matches(regex,\
    \ supply.toString())) {\n                result.add(supply);\n            }\n\
    \        }\n        return result;\n    }\n}\n```\n\nWhen you iterate over a data\
    \ structure, you need to be careful with what kind of operations you perform.\
    \ If you do something that is compute-intense, it can easily turn into a performance\
    \ pitfall. The code above shows a typical example for this with the `find()` method\
    \ that locates `Supply` objects with a regular expression.\n\nIn Java, or in any\
    \ other programming language, you’ll build queries using a regular expression—regex\
    \ for short. A regex enables efficient queries on large sets of textual data.\
    \ To get familiar with regexes, we recommend you look at `java.util.regex.Pattern`\
    \ in the Java API. This class is Java’s representation of regular expressions,\
    \ and it offers a variety of methods for building and executing them. The most\
    \ straightforward way is probably the one you see in the code above: you just\
    \ call the static method `matches()` and provide it with a regex `String` and\
    \ a `String` to search in. This is handy, but it’s a performance pitfall. During\
    \ execution, Java takes the expression String, regex, and constructs a special-purpose\
    \ automaton from it. This automaton will accept Strings that follow the pattern,\
    \ rejecting all others.\n\nIn `Pattern.matches(regex, supply.toString())` we both\
    \ compile an automaton and try to match `supply.toString()` to it. Compiling a\
    \ regex automaton consumes time and processing power, just as the compilation\
    \ of a class takes time. Usually, it’s a one-time effort, but here the regex is\
    \ compiled on every iteration. Be aware that some other very popular methods in\
    \ the Java API, such as `String.replaceAll()`, behave the same way!\n\nSo how\
    \ can you prevent the compilation of a single regular expression over over?\n\n\
    ```java\nclass Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\
    \n    List<Supply> find(String regex) {\n        List<Supply> result = new LinkedList<>();\n\
    \        Pattern pattern = Pattern.compile(regex);\n        for (Supply supply\
    \ : supplies) {\n            if (pattern.matcher(supply.toString()).matches())\
    \ {\n                result.add(supply);\n            }\n        }\n        return\
    \ result;\n    }\n}\n```\n\nThe solution to the potential performance pitfall\
    \ is very simple: make sure that the computation-intense operation takes place\
    \ as rarely as possible. Here, you should only compile the regex once for every\
    \ method call. After all, the expression string doesn’t change between each iteration\
    \ of the loop.\n\nLuckily, we can get a single compilation easily with the `Pattern`\
    \ API. To do so, we need to separate the two operations that are bundled in the\
    \ call of `Pattern.matches()`. First, this is the compilation of the expression\
    \ and, second, its execution on the search string.\n\nWe can extract the first\
    \ step through a call to `Pattern.compile()`, which creates a compiled regular\
    \ expression, an instance of `Pattern`. This is the computation-intense step,\
    \ and we can store its result in a local variable.\n\nThe second step, the execution\
    \ of the compiled expression, is the easy and quick one. It’s also the one that\
    \ we need to execute for every instance of `Supply`, so it needs to go into the\
    \ body of the loop.\n\nHere, we first create a `Matcher` for the `String` we want\
    \ to search. This is a handle for searching in different fashions, even iteratively.\
    \ In this case, we need to check only if a supply matches the regular expression\
    \ at all, which we can do by calling `matches()`.\n\nTo sum up, with regexes,\
    \ a little modification can mean a big difference in performance!\n\n## Group\
    \ with New Lines\n\n```java\nenum DistanceUnit {\n    MILES, KILOMETERS;\n\n \
    \   static final double MILE_IN_KILOMETERS = 1.60934;\n    static final int IDENTITY\
    \ = 1;\n}\n```\n"
  raw: 'We iterate over arrays, lists, or other data structures all the time. Most
    of the time, we only read from those data structures—for instance, when creating
    an invoice from a list of ordered items or searching for an item in a list by
    name. But you need to be careful when you modify the structure. Otherwise, you
    risk crashing your program.


    This code describes a fairly simple iteration over a data structure: a List of
    supplies. If a Supply isContaminated(), the inventory system removes it from the
    List.


    This code looks completely innocent, doesn’t it?


    Although the code looks okay, it’ll crash reliably when at least one Supply in
    the inventory list is contaminated. Even worse, it’ll work fine until this happens
    the first time. And worse yet, it’ll work fine if all supplies are clean, making
    the bug hard to detect.


    The problem is that we call supplies.remove(supply) while we’re inside a for loop
    that iterates over the supplies. In this situation, a standard implementation
    of the List interface, or indeed of other Collection interfaces such as Set or
    Queue, will throw a ConcurrentModificationException. We can’t simply modify a
    List while we iterate over it.


    The name ConcurrentModificationException makes many people wonder about concurrency
    in their single-threaded application. That’s quite misleading, since no actual
    concurrency takes place here! Instead, we iterate over the Collection, and while
    we’re doing that, we modify that collection. Unfortunately, no compile-time check
    in Java saves us from this error.


    So how can you do this properly without raising the ConcurrentModificationException?


    |   | **class** Inventory { |


    |   |  |


    |   | **private** List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | **void** disposeContaminatedSupplies() { |


    |   | Iterator<Supply> iterator = supplies.iterator(); |


    |   | **while** (iterator.hasNext()) { |


    |   | **if** (iterator.next().isContaminated()) { |


    | » | iterator.remove(); |


    |   | } |


    |   | } |


    |   | } |


    |   | } |


    In the straightforward solution to this problem, we would iterate the list in
    search of any contaminated supplies, and afterward, we would remove any previously
    found supplies. Think of a two-step approach: first iterate and then modify.


    This would work, but it would require quite a few lines of code. And we would
    need to save the contaminated supplies in a temporary data structure during iteration.
    This would consume extra time and memory.


    The solution we’ve depicted here uses another way of iteration: a while loop that
    relies on the Iterator of our supplies collection. The Iterator is our rescue.
    It acts like a pointer to an element in the list, starting with the first one.
    We can ask if any elements are left via hasNext(), get the next() element, and
    safely remove() the last element returned.


    Although we can’t modify a List directly, the iterator is perfectly capable of
    doing this. Its job is to make sure that everything works during the iteration.


    Technically, the for-each loop in the previous example also builds on such an
    iterator, but it hides this fact from the programmer. That’s nice, since it reduces
    the complexity of the code. But it also prevents us from using the remove() method
    of the iterator itself.


    Some special List implementations like the CopyOnWriteArrayList can deal with
    modification during iteration. But such characteristics come at a price. Do you
    really want to copy the whole list each time you add or remove an element of it?
    Since Java 8, you can also use the new Collection.removeIf() method that makes
    use of lambdas. But be sure to read Chapter 8, [*Let Your Data Flow*](#f_0083_split_001.xhtml_chp.lambdas)
    before you use that method!


    ## Avoid Compute-Intense Operations During Iteration


    |   | **class** Inventory { |


    |   |  |


    |   | **private** List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | List<Supply> find(String regex) { |


    |   | List<Supply> result = **new** LinkedList<>(); |


    |   | **for** (Supply supply : supplies) { |


    | » | **if** (Pattern.matches(regex, supply.toString())) { |


    |   | result.add(supply); |


    |   | } |


    |   | } |


    |   | **return** result; |


    |   | } |


    |   | } |


    When you iterate over a data structure, you need to be careful with what kind
    of operations you perform. If you do something that is compute-intense, it can
    easily turn into a performance pitfall. The code above shows a typical example
    for this with the method find() that locates Supply objects with a regular expression.


    In Java, or in any other programming language, you’ll build query strings using
    a regular expression—regex for short. A regex enables efficient queries on large
    sets of textual data.


    To get familiar with regexes, we recommend you look at java.util.regex.Pattern^([[21]](#f_0031.xhtml_FOOTNOTE-21))
    in the Java API. This class is Java’s representation of regular expressions, and
    it offers a variety of methods for building and executing them. The most straightforward
    way is probably the one you see in the code snippet above: you just call the static
    method matches() and provide it with a regex String and a String to search in.
    This is handy, but it’s a performance pitfall. During execution, Java takes the
    expression String, regex, and constructs a special-purpose automaton from it.
    This automaton will accept Strings that follow the pattern, rejecting all others.


    In Pattern.matches(regex, supply.toString()) we both compile such an automaton
    and try to match supply.toString() to it. Compiling a regex automaton consumes
    time and processing power, just as the compilation of a class takes time. Usually,
    it’s a one-time effort, but here the regex is compiled on every iteration.


    Be aware that some other very popular methods in the Java API, such as String.replaceAll(),
    behave the same way!


    So how can you prevent the compilation of a single regular expression over and
    over?


    |   | **class** Inventory { |


    |   |  |


    |   | **private** List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | List<Supply> find(String regex) { |


    |   | List<Supply> result = **new** LinkedList<>(); |


    | » | Pattern pattern = Pattern.compile(regex); |


    |   | **for** (Supply supply : supplies) { |


    | » | **if** (pattern.matcher(supply.toString()).matches()) { |


    |   | result.add(supply); |


    |   | } |


    |   | } |


    |   | **return** result; |


    |   | } |


    |   | } |


    The solution to the potential performance pitfall is very simple: make sure that
    the computation-intense operation takes place as rarely as possible.


    Here, you should only compile the regex once for every method call. After all,
    the expression string doesn’t change between each iteration of the loop.


    Luckily, we can get a single compilation easily with the Pattern API. To do so,
    we need to separate the two operations that are bundled in the call of Pattern.matches().
    First, this is the compilation of the expression and, second, its execution on
    the search string.


    We can extract the first step through a call to Pattern.compile(), which creates
    a compiled regular expression, an instance of Pattern. This is the computation-intense
    step, and we can store its result in a local variable.


    The second step, the execution of the compiled expression, is the easy and quick
    one. It’s also the one that we need to execute for every instance of Supply, so
    it needs to go into the body of the loop.


    Here, we first create a Matcher for the String we want to search. This is a handle
    for searching in different fashions, even iteratively. In this case, we need to
    check only if a supply matches the regular expression at all, which we can do
    by calling matches().


    To sum up, with regexes, a little modification can mean a big difference in performance!


    ## Group with New Lines


    |   | **enum** DistanceUnit { |


    |   |  |


    |   | MILES, KILOMETERS; |


    |   |  |


    |   | **static** **final** **double** MILE_IN_KILOMETERS = 1.60934; |


    | » | **static** **final** **int** IDENTITY = 1; |'
