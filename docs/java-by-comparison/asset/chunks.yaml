    There are only two hard problems in Computer Science: cache invalidation and naming
    things.


    Phil Karlton


    # Chapter 4


    Name Things Right


    In Norwegian, the term for “moose” is “elg.” When the first northern settlers
    from Europe came to North America and saw this huge elg-like animal in the forest,
    they decided: “Okay, that’s gonna be the elg here” (or elk, as it’s spelled in
    English). Turns out, they were completely wrong. The settlers happened to meet
    a wapiti first—a totally different kind of deer. There is a close relative to
    the European “elg” in North America, but it’s the moose. Up to the present day,
    this little naming error leads to profound confusion between North American and
    European friends of the wilderness, and it leads to a discussion on etymology
    at the start of every “elg tour” in Scandinavia.


    Assigning good names can be very hard. Even experts have a difficult time coming
    up with a good name on the first try. The European settlers had a concept for
    moose, but they still managed to assign it to the wrong animal.


    Naming’s even harder for your code. Code doesn’t have horns or other properties
    that most people would recognize. It’s abstract, and most of the time, it’s also
    completely new and very domain-specific.


    That’s why good naming is more important in programming. We have to name a whole
    lot of stuff: packages, classes, methods, fields, parameters, and local variables.
    And these elements often represent something unknown or hard to grasp. This makes
    it very difficult to find a good name, especially in the beginning. Later, after
    using an element a lot, you may find it easier to come up with a better name because
    you’ll be able to relate to the concept easily.


    The comparisons in this section help you find better names for your code elements.
    We’ll show you why the Java conventions matter when it comes to naming, why you
    should be concise when naming methods, and how to avoid meaningless or single
    letter names.


    ## Use Java Naming Conventions


    |   | **class** Rover { |


    | » | **static** **final** **double** WalkingSpeed = 3; |


    |   |  |


    | » | **final** String SerialNumber; |


    | » | **double** MilesPerHour; |


    |   |  |


    | » | Rover(String NewSerialNumber) { |


    |   | SerialNumber = NewSerialNumber; |


    |   | } |


    |   |  |


    | » | **void** Drive() { |


    |   | MilesPerHour = WalkingSpeed; |


    |   | } |


    | » | **void** Stop() { |


    |   | MilesPerHour = 0; |


    |   | } |


    |   | } |


    We have to name a lot of stuff in Java: packages, classes, interfaces, enums,
    methods, variables, fields, parameters, and constants. Take a look at the code
    above—it contains a lot of names. Do you notice anything strange? Can you see
    the pattern?


    We consistently named everything in CamelCase: no spaces, and all words start
    with a capital letter. As long as we’re consistent, we can choose any way of naming,
    can’t we?


    Well, in theory yes, but not in practice! The Java code out there that counts
    as professional follows a different style. To us, the code above isn’t just hard
    to read—it even feels horribly wrong. Just to be clear: There’s no functional
    error. But to a Java programmer, this doesn’t read like Java code.


    But What About Package Names?


    Yes, you caught us. We didn’t cover package names in the code snippets. We never
    do in this book, actually. But they’re important, too. Packages act like global
    namespaces, and you shouldn’t have name clashes where a package has the same identifier
    as another package. On the Internet, the Domain Name System (DNS) is the largest
    global namespace we know. Because we programmers don’t want to reinvent the wheel
    over and over again, we usually simply convert domain names into package names.
    For example, the URL of our book pragprog.com/book/javacomp results in the package
    name com.pragprog.book.javacomp. Just like in domain names, we don’t use capital
    letters in Java package names either.


    How can we change the code so that it also looks like Java?


    |   | **class** Rover { |


    | » | **static** **final** **double** WALKING_SPEED = 3; |


    |   |  |


    | » | **final** String serialNumber; |


    | » | **double** milesPerHour; |


    |   |  |


    | » | Rover(String serialNumber) { |


    |   | **this**.serialNumber = serialNumber; |


    |   | } |


    |   |  |


    | » | **void** drive() { |


    |   | milesPerHour = WALKING_SPEED; |


    |   | } |


    |   |  |


    | » | **void** stop() { |


    |   | milesPerHour = 0; |


    |   | } |


    |   | } |


    Since 1997, we have the Java code conventions.^([[29]](#f_0051.xhtml_FOOTNOTE-29))
    These conventions are the de facto standard for formatting Java code, including
    names.


    Above, we changed the code to conform to the Java code conventions. We kept the
    name of the class because it already follows the conventions: it’s written in
    CamelCase, beginning with a capital letter and starting every term in the name
    with a capital letter. Interfaces and enums work likewise.


    To let the constants (variables that are final and static) stand out, you should
    write their names in CAPITAL_SNAKE_CASE. This means that all letters in the name
    are uppercase, and you separate terms with an underscore. That way, the name of
    the constant already scream out “I won’t change.”


    Methods, fields, parameters, and variables use a variant of camelCase where the
    first letter starts in lowercase. This has the downside of a possible confusion
    of method (behavior) and variable (state) names since they’re named in the same
    scheme. That’s why their name itself should tell the reader if it’s a method or
    a variable. You should name your methods as verbs, as you see in drive() in the
    code above, or let them start with verbs like is, has, save, get, or set, etc.
    For variables, use nouns, such as serialNumber or milesPerHour.


    The Java code conventions are only the very first step in good naming. The point
    is that you’ll never have a good name if it doesn’t follow the conventions (the
    reverse, a bad name that follows the conventions, is entirely possible and all
    too common). Conventions are a basic requirement.


    ## Follow Getter/Setter Conventions for Frameworks


    |   | **class** Astronaut { |


    |   |  |


    | » | String name; |


    |   | **boolean** retired; |


    |   |  |


    | » | Astronaut(String name) { |


    |   | **this**.name = name; |


    |   | } |


    |   |  |


    |   | String getFullName() { |


    |   | **return** name; |


    |   | } |


    |   |  |


    |   | **void** setFullName(String name) { |


    |   | **this**.name = name; |


    |   | } |


    |   |  |


    | » | **boolean** getRetired() { |


    |   | **return** retired; |


    |   | } |


    |   |  |


    | » | **void** setRetiredState(**boolean** retired) { |


    |   | **this**.retired = retired; |


    |   | } |


    |   | } |


    In object-oriented programming languages, you usually try to avoid direct access
    to the fields of a class from the outside. That’s why you write getter and setter
    methods that control this access.'
