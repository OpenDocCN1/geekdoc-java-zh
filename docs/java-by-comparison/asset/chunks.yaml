  trans: "\n\n你能想到为什么吗？这里有一个提示：在我们的机器上，第二次测试失败了，信息为 `expected: <0.114> but was <0.11399999999999999>`。显然，小数位数并不是我们预期的。\n\
    \n这里的问题在于浮点数算术，即用 64 位或 32 位表示小数的方式。Java 根据 IEEE 浮点算术标准（IEEE 754）来执行此操作。我们在这里不讨论细节，但简而言之，无法用有限的位数来表示每一个浮点数。这就是为什么包括\
    \ Java 在内的几乎所有编程语言只对浮点数进行近似处理。例如，小数 `0.1` 很容易变成内存中一个接近的近似值，如 `0.100000000000000005551115123126`。如果你只进行近似处理，就会产生舍入误差。\n\
    \n在上面的测试中，所有的小数 `5.6`、`5.8` 和 `0.114` 只是用 `double` 进行近似表示的。当然，我们可以在代码中直接指定这些数字，但由于它们在运行时通过算术运算组合，结果将只是与预期数值非常接近的近似值。这就是为什么上面的断言失败了。\n\
    \n当你测试浮点计算时，你需要指定一个精度：\n\n```java\nclass OxygenTankTest {\n    static final double\
    \ TOLERANCE = 0.00001;\n\n    @Test\n    void testNewTankIsEmpty() {\n       \
    \ OxygenTank tank = OxygenTank.withCapacity(100);\n        Assertions.assertEquals(0,\
    \ tank.getStatus(), TOLERANCE);\n    }\n\n    @Test\n    void testFilling() {\n\
    \        OxygenTank tank = OxygenTank.withCapacity(100);\n        tank.fill(5.8);\n\
    \        tank.fill(5.6);\n        Assertions.assertEquals(0.114, tank.getStatus(),\
    \ TOLERANCE);\n    }\n}\n```\n\n在浮点数算术中，精确匹配是不可靠的。与其死板地坚持精确匹配，我们需要容忍预期值和实际值之间的微小差异。\n\
    \n使用 JUnit 这一点非常简单。断言 `assertEquals(double expected, double actual, double delta)`\
    \ 支持一个名为 `delta` 的容差值。如果你需要精确到两位小数，请使用 `0.1*10^-2=0.001` 的容差值。在这里，我们需要四位小数的精度，产生的容差值至少为\
    \ `0.00001`。\n\n总结来说，当你对 `float` 或 `double` 使用 `assertEquals()` 时，应该意识到精度问题并指定一个可以的容差水平。\n\
    \n## 永远不要对货币使用浮点算术！\n\n当你需要在代码中表示货币值时，使用 `float` 或 `double` 似乎很有吸引力，而这正是初学者通常会做的。毕竟，我们在日常生活中浮点形式使用货币的——例如支付\
    \ 1.99 美元购买巧克力。浮点值似乎是这种数值的自然表示方式。千万不要这样做！\n\n早晚，你的程序都会因为舍入误差产生错误的计算。当涉及到钱时，即使是微小的差异也会被。幸运的是，解决方案很简单：不要在\
    \ `double` 值中存储美元；而是在 `long` 变量中存储分，或者像大多数银行和保险公司在他们的 Java 系统中那样使用 `BigDecimal`。\n\
    \n## 让 JUnit 处理异常\n\n```java\nclass LogbookTest {\n    @Test\n    void readLogbook()\
    \ {\n        Logbook logbook = new Logbook();\n        try {\n            List<String>\
    \ entries = logbook.readAllEntries();\n            Assertions.assertEquals(13,\
    \ entries.size());\n        } catch (IOException e) {\n            Assertions.fail(e.getMessage());\n\
    \        }\n    }\n\n    @Test\n    void readLogbookFail() {\n        Logbook\
    \ logbook = new Logbook();\n        try {\n            logbook.readAllEntries();\n\
    \            Assertions.fail(\"read should fail\");\n        } catch (IOException\
    \ ignored) {}\n    }\n}\n```\n\n测试和异常通常是密不可分的。我们确保没有抛出异常，或者抛出了特定的异常。让我们来看代码。测试异常有两种方法。第一种使用\
    \ `try-catch` 块和 `fail()`，但它看起来并没有好在哪里。第二种使用 `assertThrows()`。这个断言标记了我们预期抛出特定类型的异常。看代码可以发现没有\
    \ `try-catch` 块，也没有 `fail()`。相反，一切都由 `assertThrows()` 处理。我们只需要将预期触发异常的方法传递到断言中。\n\
    \n"
- fmt: "\nEventually, tests will fail. That’s what they’re there for—telling you when\
    \ you break something. When tests fail, the first thing you’ll see is their name.\
    \ Good names are valuable—they help you find the cause for failure faster.\n\n\
    In the code above, we’ve already done a lot of good things: we’ve applied `Structure\
    \ Tests Into Given-When-Then` #f_0064.xhtml_sec.item.structure_tests_into_given_when_then\
    \ and the previous comparisons. We even use the `assertThrows()` assertion that\
    \ expects a specific exception to be thrown within an `Executable`. But the code\
    \ still lacks something crucial: good names and documentation. What do the tests\
    \ actually check for?\n\nA failing test initially only shows us the class name\
    \ and the name of its methods. We know that this class contains tests for the\
    \ `OxygenTank` class because it follows the `[ProductionClass]Test` name convention.\
    \ This is helpful, but the method names aren’t; they only list which method is\
    \ being tested (the method `fill()`) and a test number. From this name, it’s still\
    \ unclear what they actually test for (except that they test the method `fill()`).\
    \ Sadly, you’ll find test names like these frequently in real code, because most\
    \ IDEs automatically generate them using the `test[MethodName]` convention.\n\n\
    Adding comments might be one option here. But with `JUnit5`, there are much better\
    \ solutions.\n\nSo how can we improve the test description here?\n\n```java\n\
    class OxygenTankTest {\n    static final double PERMILLE = 0.001;\n\n    @Test\n\
    \    @DisplayName(\"Expect 44% after filling 22l in an empty 50l tank\")\n   \
    \ @Disabled(\"We don't have small tanks anymore! TODO: Adapt for big tanks\")\n\
    \    void fillTank() {\n        OxygenTank smallTank = OxygenTank.withCapacity(50);\n\
    \        smallTank.fill(22);\n        Assertions.assertEquals(0.44, smallTank.getStatus(),\
    \ PERMILLE);\n    }\n\n    @Test\n    @DisplayName(\"Fail if fill level > tank\
    \ capacity\")\n    void failOverfillTank() {\n        OxygenTank bigTank = OxygenTank.withCapacity(10_000);\n\
    \        bigTank.fill(5344.0);\n        Executable when = () -> bigTank.fill(6000);\n\
    \        Assertions.assertThrows(IllegalArgumentException.class, when);\n    }\n\
    }\n```\n\nThe first thing we’ve done is to get rid of superfluous terms in the\
    \ method names. They no longer start with words like `test`. Instead, they describe\
    \ the context, the method under test, and the assertion we check. The intention\
    \ in a test named `failOverfillTank()` is so much clearer than `testFill2()`!\
    \ Still, those names have limits: no spaces, and only letters and numbers are\
    \ allowed.\n\nWith `JUnit5`, there’s a solution for adding good test descriptions\
    \ without tweaking method names: `@DisplayName(\"description with spaces and symbols\"\
    )`. With this annotation, you can use spaces and symbols, such as `%` or `>` to\
    \ write really expressive and compact test descriptions. Spaces make them readable\
    \ as sentences, and signs allow short and concise descriptions of units.\n\nDescribing\
    \ why a test is disabled is important, because it is your motivation for not just\
    \ deleting the code. We suggest that you use the format of `@Disabled(\"[why it’s\
    \ disabled] TODO: [what’s the plan to enable again]\")`. This a) forces you to\
    \ think about the future of this test when you disable it, and b) provides a future\
    \ developer with the necessary information to enable it again (instead of leaving\
    \ her high and dry without a clue).\n\n## Favor Standalone Tests\n\n```java\n\
    class OxygenTankTest {\n    OxygenTank tank;\n\n    @BeforeEach\n    void setUp()\
    \ {\n        tank = OxygenTank.withCapacity(10_000);\n        tank.fill(5_000);\n\
    \    }\n\n    @Test\n    void depressurizingEmptiesTank() {\n        tank.depressurize();\n\
    \        Assertions.assertTrue(tank.isEmpty());\n    }\n\n    @Test\n    void\
    \ completelyFillTankMustBeFull() {\n        tank.fillUp();\n        Assertions.assertTrue(tank.isFull());\n\
    \    }\n}\n```\n\nWhen we are teaching, we often see beginners who love to use\
    \ `@BeforeEach` and `@BeforeAll`. They create implicit dependencies that the framework\
    \ can easily deal with, but they’re making the code less readable for you as a\
    \ programmer. \n\nEssentially, we’ve made the tests stand alone. A test stands\
    \ alone when you link the given, when, and then bits directly within the test\
    \ method. Instead of separating the given part of the test to the `@BeforeEach`\
    \ setup method, we put that part back in each test. Of course, we’re not saying\
    \ you should duplicate code. That’s why we extracted the setup part into a static\
    \ method that we gave a meaningful name: `createFilledTank()`.\n\nNow you can\
    \ understand each test independently and you don’t have to look for setup logic\
    \ that’s implicitly linked elsewhere. It’s also easier to move a test from one\
    \ test class into another, because you no longer have implicit dependencies. The\
    \ compiler will tell you if you forgot something. That’s possible because the\
    \ test stands alone—all dependencies are explicit.\n\n```java\nclass OxygenTankTest\
    \ {\n    static OxygenTank createFilledTank() {\n        OxygenTank tank = OxygenTank.withCapacity(10_000);\n\
    \        tank.fill(5_000);\n        return tank;\n    }\n\n    @Test\n    void\
    \ depressurizingEmptiesTank() {\n        OxygenTank tank = createFilledTank();\n\
    \        tank.depressurize();\n        Assertions.assertTrue(tank.isEmpty());\n\
    \    }\n\n    @Test\n    void completelyFillTankMustBeFull() {\n        OxygenTank\
    \ tank = createFilledTank();\n        tank.fillUp();\n        Assertions.assertTrue(tank.isFull());\n\
    \    }\n}\n```\n\nSo in summary: we suggest you avoid the `@BeforeEach` and `@BeforeAll`\
    \ annotations, even though their usage is common. They create implicit dependencies\
    \ that the framework can easily deal with, but they’re making the code less readable\
    \ for you. Tests are better if they stand alone and you can understand the complete\
    \ test just by looking at the test method and without having to scroll around\
    \ in the code. If your test setup consists of more than two variables, refrain\
    \ from falling back to `@BeforeEach` and create a class for the whole test setup\
    \ instead.\n\n## Parametrize Your Tests\n\n```java\nclass DistanceConversionTest\
    \ {\n    @Test\n    void testConversionRoundTrip() {\n        assertRoundTrip(1);\n\
    \        assertRoundTrip(1_000);\n        assertRoundTrip(9_999_999);\n    }\n\
    \n    private void assertRoundTrip(int kilometers) {\n    }\n}\n```\n"
  raw: 'Eventually, tests will fail. That’s what they’re there for—telling you when
    you break something. When tests fail, the first thing you’ll see is their name.
    Good names are valuable—they help you find the cause for failure faster.


    In the code above, we’ve already done a lot of good things: we’ve applied [*Structure
    Tests Into Given-When-Then*](#f_0064.xhtml_sec.item.structure_tests_into_given_when_then)
    and the previous comparisons. We even use the assertThrows() assertion that expects
    a specific exception to be thrown within an Executable. But the code still lacks
    something crucial: good names and documentation. What do the tests actually check
    for?


    A failing test initially only shows us the class name and the name of its methods.
    We know that this class contains tests for the OxygenTank class because it follows
    the [ProductionClass]Test name convention. This is helpful, but the method names
    aren’t; they only list which method is being tested (the method fill()) and a
    test number. From this name, it’s still unclear what they actually test for (except
    that they test the method fill()). Sadly, you’ll find test names like these frequently
    in real code, because most IDEs automatically generate them using the test[MethodName]
    convention.


    Adding comments might be one option here. But with JUnit5, there are much better
    solutions.


    So how can we improve the test description here?


    |   | **class** OxygenTankTest { |


    |   | **static** **final** **double** PERMILLE = 0.001; |


    |   |  |


    |   | @Test |


    | » | @DisplayName(*"Expect 44% after filling 22l in an empty 50l tank"*) |


    |   | @Disabled(*"We don''t have small tanks anymore! TODO: Adapt for big tanks"*)
    |


    |   | **void** fillTank() { |


    |   | OxygenTank smallTank = OxygenTank.withCapacity(50); |


    |   |  |


    |   | smallTank.fill(22); |


    |   |  |


    |   | Assertions.assertEquals(0.44, smallTank.getStatus(), PERMILLE); |


    |   | } |


    |   |  |


    |   | @Test |


    | » | @DisplayName(*"Fail if fill level > tank capacity"*) |


    |   | **void** failOverfillTank() { |


    |   | OxygenTank bigTank = OxygenTank.withCapacity(10_000); |


    |   | bigTank.fill(5344.0); |


    |   |  |


    |   | Executable when = () -> bigTank.fill(6000); |


    |   |  |


    |   | Assertions.assertThrows(IllegalArgumentException.class, when); |


    |   | } |


    |   | } |


    The first thing we’ve done is to get rid of superfluous terms in the method names.
    They no longer start with words like test. Instead, they describe the context,
    the method under test, and the assertion we check. The intention in a test named
    failOverfillTank() is so much clearer than testFill2()! Still, those names have
    limits: no spaces, and only letters and numbers are allowed.^([[39]](#f_0073.xhtml_FOOTNOTE-39))


    With JUnit5, there’s a solution for adding good test descriptions without tweaking
    method names: @DisplayName("description with spaces and symbols"). With this annotation,
    you can use spaces and symbols, such as % or >, to write really expressive and
    compact test descriptions. Spaces make them readable as sentences, and signs allow
    short and concise descriptions of units.


    Describing why a test is disabled is important, because it is your motivation for
    not just deleting the code. We suggest that you use the format of @Disabled("[why
    it’s disabled] TODO: [what’s the plan to enable again]"). This a) forces you to
    think about the future of this test when you disable it, and b) provides a future
    developer with the necessary information to enable it again (instead of leaving
    her high and dry without a clue).


    ## Favor Standalone Tests


    |   | **class** OxygenTankTest { |


    | » | OxygenTank tank; |


    |   |  |


    | » | @BeforeEach |


    |   | **void** setUp() { |


    |   | tank = OxygenTank.withCapacity(10_000); |


    |   | tank.fill(5_000); |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** depressurizingEmptiesTank() { |


    |   | tank.depressurize(); |


    |   |  |


    |   | Assertions.assertTrue(tank.isEmpty()); |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** completelyFillTankMustBeFull() { |


    |   | tank.fillUp(); |


    |   |  |


    |   | Assertions.assertTrue(tank.isFull()); |


    |   | } |


    |   | } |


    When we are teaching Java, we often see beginners who love to use the @BeforeEach
    and @BeforeAll annotations. After all, they allow you to extract common setup
    code that you need in the given part of a test and write it only once. That’s
    a good thing, because it avoids code duplication. But it comes at a price: setup
    methods make tests harder to comprehend. Here’s why:


    In the code above, you can see a setup method (annotated with @BeforeEach) that
    prepares a half-filled tank and two tests (annotated with @Test) that use that
    tank. The setup method is at the top of the class, so it’s the first thing you
    read. That placement is fine, but when you read the whole class from top to bottom,
    you need to recall what it does for each single test method. The tests are no
    longer self-contained.


    So what if there are a lot of tests? It’s easy to forget in which state the tank
    is at the beginning. Or what if you’re not reading the entire class? Maybe a test
    just fails at some point. Then you jump directly into the test method and don’t
    find any given part there. Instead, you need to scroll around for the setup method.
    Sometimes, you even have to look up the inheritance hierarchy.


    In our code example, it’s simple of course. But think about tests in real-world
    projects with several setup methods spread along the class hierarchy and hundreds
    of tests. That’s a tough one.


    The key lies in making the connection of the tests to the setup code clearer:


    |   | **class** OxygenTankTest { |


    | » | **static** OxygenTank createHalfFilledTank() { |


    |   | OxygenTank tank = OxygenTank.withCapacity(10_000); |


    |   | tank.fill(5_000); |


    |   | **return** tank; |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** depressurizingEmptiesTank() { |


    | » | OxygenTank tank = createHalfFilledTank(); |


    |   |  |


    |   | tank.depressurize(); |


    |   |  |


    |   | Assertions.assertTrue(tank.isEmpty()); |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** completelyFillTankMustBeFull() { |


    | » | OxygenTank tank = createHalfFilledTank(); |


    |   |  |


    |   | tank.fillUp(); |


    |   |  |


    |   | Assertions.assertTrue(tank.isFull()); |


    |   | } |


    |   | } |


    Essentially, we’ve made the tests stand alone. A test stands alone when you link
    the given, when, and then bits directly within the test method.


    Instead of separating the given part of the test to the @BeforeEach setup method,
    we put that part back in each test. Of course, we’re not saying you should duplicate
    code. That’s why we extracted the setup part into a static method that we gave
    a meaningful name: createHalfFilledTank().


    Now you can understand each test independently and you don’t have to look for
    setup logic that’s implicitly linked elsewhere. It’s also easier to move a test
    from one test class into another, because you no longer have implicit dependencies.
    The compiler will tell you if you forgot something. That’s possible because the
    test stands alone—all dependencies are explicit.


    So in summary: we suggest you avoid the @BeforeEach and @BeforeAll annotations,
    even though their usage is common. They create implicit dependencies that the
    framework can easily deal with, but they’re making the code less readable for
    you as a programmer. Tests are better if they stand alone and you can understand
    the complete test just by looking at the test method and without having to scroll
    around in the code. If your test setup consists of more than two variables, refrain
    from falling back to @BeforeEach and create a class for the whole test setup instead.


    ## Parametrize Your Tests


    |   | **class** DistanceConversionTest { |


    |   |  |


    | » | @Test |


    |   | **void** testConversionRoundTrip() { |


    |   | assertRoundTrip(1); |


    |   | assertRoundTrip(1_000); |


    |   | assertRoundTrip(9_999_999); |


    |   | } |


    |   |  |


    | » | **private** **void** assertRoundTrip(**int** kilometers) { |'
