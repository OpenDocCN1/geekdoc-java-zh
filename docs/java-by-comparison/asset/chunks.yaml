    \ we’ll discuss a few more advanced coding concepts and problems, such as iteration,\
    \ formatting, and using the Java API.\n\n*   Chapter 3, [Use Comments Wisely](#f_0032_split_001.xhtml_chp.comments)\
    \ is about documenting code well. We’ll give you some advice on how to write comments\
    \ and when you should get rid of them.\n\n*   In Chapter 4, [Name Things Right](#f_0044_split_001.xhtml_chp.naming)\
    \ we’ll explain how you assign proper and concise names to code elements in Java\
    \ that other programmers will easily understand.\n\n*   Chapter 5, [Prepare for\
    \ Things Going Wrong](#f_0052_split_001.xhtml_chp.error-handling) will make you\
