    |   | .filter(Supply::isUncontaminated) |


    |   | .map(Supply::getName) |


    |   | .distinct() |


    |   | .count(); |


    |   | } |


    |   | } |


    Although we’re not focused on concurrency in this book, we don’t want to leave
    you without giving you one concrete hint—one comparison—that shows how you can
    speed up your code using concurrency. You probably recognize the code above from
    [*Favor Functional Over Imperative Style*](#f_0085.xhtml_sec.favor_functional_over_imperative_style).


    If you look closely, you can see the call to the method sequential() in the code.
    This call makes sure that the whole stream processes the elements sequentially.
    It operates on a single element at a time. Actually, that’s the default for streams
    created with stream()—you don’t have to call the method explicitly, and we’ve
    done it here just to make the point. If the elements in the list are processed
    sequentially, then obviously the code will take longer to process a list with
    millions of supplies than a list with hundreds of them. Let’s assume we’ve done
    a benchmark and found that this code is too slow for our application scenario.
    But what can we do to make it faster?


    If we do the whole computation sequentially, then at most, one core of the CPU
    computes the result. However, today’s computers (including mobile phones) have
    several cores, usually around 4–8\. That means we can speed up the program by
    using all cores concurrently.


    When you have a sequential stream without side effects like in the code above,
    there’s potential to run the work in parallel by distributing the work onto several
    cores. We can apply the filter() operations for millions of supplies concurrently,
    because the operation depends on a supply only. As soon as an item has passed
    the filter, it can be immediately transformed using map(), again because this
    operation doesn’t depend on other items. Even the distinct() and count() operators
    can be parallelized to some degree, although not in such a straightforward manner
    as the filter() and map() operators.


    So how can we distribute the work onto several cores and speed up the program?


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies; |


    |   |  |


    |   | **long** countDifferentKinds() { |


    |   | **return** supplies.stream() |


    | » | .parallel() |


    |   | .filter(Supply::isUncontaminated) |


    |   | .map(Supply::getName) |


    |   | .distinct() |


    |   | .count(); |


    |   | } |


    |   | } |


    Normally, it takes a highly paid expert to convert sequential to parallel code.
    But one of the many advantages of streams is that they make parallelization a
    lot easier. We don’t even need to write any explicitly multithreaded code.


    Remember, streams define what should be computed, instead of listing every detail
    how the computation happens. Now we bring this paradigm to its pinnacle by just
    telling the stream that it should execute in parallel—without actually describing
    how it should do that. That’s as easy as switching our stream from sequential()
    to parallel().


    Voilà! This will parallelize the complete computation under the hood. Alternatively,
    you can directly create a parallel stream from any Collection with streamParallel().
    But a lot of other methods don’t provide such a convenient method when creating
    a parallel stream, so parallel() is the more versatile one.


    Sometimes it’s as easy as this to get an n-times better performance, where n is
    equal to the number of cores available on the system. Internally, the JVM provides
    a thread pool that’s shared for all parallel streams.


    But be aware that this solution works only when you have a stream without side
    effects and where single processing steps are independent. There’s a considerable
    overhead if you use operations that force the stream to synchronize again, such
    as sort() or forEachOrdered(). In that case, the sequential() option might actually
    be faster. So, when you try to improve performance in this way, you should always
    benchmark your code and make sure that your improvements have the intended effect.


    Note that you can’t parallelize parts of a stream. If you include multiple calls
    to sequential() or parallel() in the stream, then the last call wins.


    ## Know Your Falsehoods


    |   | **class** NameTag { |


    |   |  |


    |   | **final** String name; |


    |   |  |


    |   | NameTag(String fullName) { |


    | » | **this**.name = parse(fullName).toUpperCase(); |


    |   | } |


    |   |  |


    |   | String parse(String fullName) { |


    |   | String[] components = fullName.split(*"[,&#124; ]"*); |


    |   | **if** (components == **null** &#124;&#124; components.length < 2) { |


    |   | **return** fullName; |


    |   | } |


    |   | **if** (fullName.contains(*","*)) { |


    |   | **return** components[0]; |


    |   | } **else** { |


    |   | **return** components[components.length - 1]; |


    |   | } |


    |   | } |


    |   | } |


    We’d like to end the book with a peculiar comparison. No matter what domain you’re
    in, your code’s just as good as your understanding of the real world and no better.
    And the real world is complex. That’s why you shouldn’t assume too much and make
    your code flexible to cope with being proven wrong.'
