  raw: 'If you propose a programming technique, you should be able to demonstrate
    as concisely as possible how your proposal is better than what was there before.
    The before/after approach puts all the facts on the table: you can directly compare
    the new code to the old code. Only then can you make an informed decision about
    which one’s better.


    The same holds true when you’re learning how to program. Comparing good code to
    bad code is really helpful when you’re trying to figure out how to code in Java.


    We used to teach programming at a university for over six years. After a few lectures,
    there were always a few students asking us, “How can I improve my coding skills
    further?” These students excelled in their programming assignments, anyway, so
    we gave them the default advice: “Read code from professionals.”


    Honestly, our advice wasn’t very helpful. There’s plenty of code out in the open
    source software world, but it’s hard to tell where to start. Beginners get quickly
    overwhelmed with the complexity of professional code in real-life projects. And
    how do you know if a piece of source code is actually of high quality? Even if
    it is, how can someone with only a few months of programming experience distinguish
    it from a flawed hack?


    That’s where this book comes into play. It’s a companion that guides your reading
    in the right direction. We’ll help you learn how to write good Java code by comparing
    pieces of bad code with good code. And be assured: we’ve seen our fair share of
    bad and good code over the years, reviewing code written by students in academia,
    professionals in industry, and contributors in open source projects.


    This brings us back to the before/after approach. In this book, we’ll provide
    you with 70 before/after code snippets. These snippets will help any beginner
    in Java programming to improve. We identified these snippets during our time of
    teaching Java to undergraduates at the university. They’re all based on code we
    faced when correcting our students’ programming assignments.


    Our approach in this book is simple: Given a code snippet, we’ll first explain
    what’s wrong and why. Then, we’ll show you how you can transform the code into
    a better solution.


    ## Who Should Read This Book


    This book is for people who are learning to program in Java at a beginner or intermediate
    level. It’s also a classroom resource for teachers who coach new developers in
    their journey to become programmers. Here, we’re giving you tips and tricks based
    on more recent Java 8^([[1]](#f_0011.xhtml_FOOTNOTE-1)) syntax for resource handling,
    functional programming, or testing.


    You should read this book after you’ve learned the basic Java syntax—after you’re
    able to write small programs with conditions and loops and you know the basics
    of object-oriented programming. You should be able to write code that compiles,
    runs, and solves small tasks like FizzBuzz (see [*Are You Ready? Try the Self-Assessment*](#f_0007.xhtml_fizzbuzz-test)).
    You should be able to implement simple algorithms, and you should know how to
    use basic data structures like a list, queue, stack, or map. And obviously, you
    should be having fun while doing all that!


    If you feel a deep satisfaction when you solve a complicated problem, then that’s
    an excellent start. But of course, you also know that there’s still a lot to learn.
    When you reflect on your skills and you have to confess that you don’t have a
    lot of experience in programming in Java (or even programming in general), then
    you can get the maximum benefit out of this book. This means that you probably
    haven’t yet developed a sense for clean code and the best practices an experienced
    developer applies.


    It’s about time to change this!


    Of course, if you already know more advanced books on code quality, readability,
    maintainability, and clean code in Java, such as [*Effective Java* [Blo18]](#f_0106.xhtml_d2831e2)
    and [*Clean Code* [Mar08]](#f_0106.xhtml_d2831e398), then you’ve already come
    a long way. Nevertheless, you can still find something new here and there.


    ### Teaching Clean Code Using This Book


    If you teach programming to newcomers as a senior developer at a company, you’re
    certainly aware of the best practices we’ll go over in this book. You might even
    disagree with some, depending on what you are working on. Still, this book can
    make your life easier when training a junior developer—just use it as a reference.
    When you spot problems in your apprentice’s code, point her to the corresponding
    item in this book. Your student can read a concise and simple example for the
    problem you’re hinting at, as well as how to get to the solution of the problem.
    At the very least, this saves you time because you won’t have to write an explanation
    yourself.


    Our experience in developing teaching concepts for Java learners in their second
    to third year can also be useful for teaching in academia. This book is the product
    of our combined knowledge of over fifteen years of teaching Java to undergraduate
    college students in an advanced course with focus on code quality. It might not
    teach Java from the ground up, but it can accompany basically any course that
    involves programming tasks. In particular, you can use the book as a reference
    when you asses student code, as we’ve described in a workshop paper: [*Teaching
    Clean Code* [DMHL18]](#f_0106.xhtml_d2831e82).


    ### Are You Ready? Try the Self-Assessment


    If you’re a new programmer, we suggest that you do a short self-assessment to
    see if you’re ready for the material in this book: the FizzBuzz Test (see the
    Fizz Buzz Test^([[2]](#f_0011.xhtml_FOOTNOTE-2)) or Using FizzBuzz to Find Developers
    who Grok Coding^([[3]](#f_0011.xhtml_FOOTNOTE-3))). Some employers use this test
    in job interviews to determine if an applicant can program at all. The task goes
    like this:


    > Write a Java program that prints the numbers from 1 to 100 to the console. But
    for multiples of three, print Fizz instead of the number and for multiples of
    five, print Buzz. For numbers that are multiples of both three and five, print
    FizzBuzz.


    To make the test more interesting, we’ll extend it a bit here by making sure that
    you can apply object orientation and use classes and interfaces as well. You should
    implement the FizzBuzz algorithm in a class called ConsoleBasedFizzBuzz, which
    implements a FizzBuzz interface. This interface provides a method that takes the
    first and last numbers to print as arguments. In the main method of a separate
    Main class, you should use the FizzBuzz interface with its ConsoleBasedFizzBuzz
    implementation to count from 1 up to the value passed from the console. Here,
    you’ll see the outlined structure in a short template.


    |   | **interface** FizzBuzz { |


    |   | **void** print(**int** from, **int** to); |


    |   | } |


    |   |  |


    |   |  |


    |   | **class** ConsoleBasedFizzBuzz **implements** FizzBuzz { |


    |   | *// TODO implement FizzBuzz interface* |


    |   | } |


    |   |  |


    |   |  |


    |   | **class** Main { |


    |   | *// TODO use a main method* |


    |   | *// TODO print fizz buzz from 1 to max* |


    |   | *// TODO max is passed from the console* |


    |   | } |


    You should be able to finish this exercise in about 15 minutes. One of the links
    we listed also contains solutions to the FizzBuzz challenge that you can compare
    to your own. If you can do it, then you’re ready to get the most out of this book.
    If not, don’t worry! Keep reading anyway. It might take you a little longer, and
    you might have a harder time understanding a comparison here and there. But if
    you practice programming by solving small exercises like the ones in this book,
    you’ll get on track quickly.'
