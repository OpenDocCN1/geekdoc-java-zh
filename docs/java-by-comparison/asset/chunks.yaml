    and comparison operators, and a beginner might use that same way of implementing
    conditions with boolean values. But those comparisons are completely unnecessary—they’re
    like noise in your code.


    Here you can see code for a Laboratory component, which analyzes a Sample through
    conditions in two nested if-else blocks.


    The code explicitly compares boolean return values to boolean primitive types
    (true and false). This is an anti-pattern that you can often find in code written
    by beginners.


    If you build logical conditions with data types other than boolean, for example
    with integers, you need to compare them to actual values (e.g., myNumber == 25,
    input > 0). But you don’t need to do that for boolean variables or return types.


    Instead, you already have boolean expressions to work with. There’s no need to
    compare them to boolean primitives. The comparisons clutter up the code and make
    it just a little harder to read.


    Most of the time, you’ll find that it’s straightforward to get rid of such unnecessary
    comparisons. Not only will you have less code, but it will also be easier to read.


    Now check out how straightforward this code is without those comparisons.


    |   | **class** Laboratory { |


    |   |  |


    |   | Microscope microscope; |


    |   |  |


    |   | Result analyze(Sample sample) { |


    | » | **if** (microscope.isInorganic(sample)) { |


    |   | **return** Result.INORGANIC; |


    |   | } **else** { |


    |   | **return** analyzeOrganic(sample); |


    |   | } |


    |   | } |


    |   |  |


    |   | **private** Result analyzeOrganic(Sample sample) { |


    | » | **if** (!microscope.isHumanoid(sample)) { |


    |   | **return** Result.ALIEN; |


    |   | } **else** { |


    |   | **return** Result.HUMANOID; |


    |   | } |


    |   | } |


    |   | } |


    Here, we removed the comparisons to boolean primitives. In the case of laboratory.isHumanoid(sample),
    we had to negate the expression to retain the semantics. But otherwise, the code
    is unchanged. You can now read the condition expressions a little more easily.


    Any compiler would perform such a removal out-of-the-box. There’s probably no
    difference between the two snippets in terms of the actual execution. The benefit
    here lies entirely in the readability of the code. It’s a small fix in some simple
    code, but imagine you’re working with a large code base—every little improvement
    in readability helps!


    Thinking about [*Avoid Negations*](#f_0014.xhtml_sec.avoid_negations), you could
    improve the conditions even further. So read on!


    Multiple Returns vs. Single Return per Method


    Countless developer hours have been invested (read: wasted) to discuss, if it’s
    better to have a single return statement or multiple ones within a method. There’s
    no ultimate right or wrong. Every return statement marks a point of exit from
    a method. A single point of exit makes for a more structured flow of control;
    you always know where it’ll end. But sometimes you want to exit a method early—for
    example, when the input parameters are invalid. Here, we use multiple returns
    because it requires fewer lines of code—and space is always limited in a book.
    In your code, try to see if you need an early exit, and if you do, use multiple
    returns.


    ## Avoid Negations


    |   | **class** Laboratory { |


    |   |  |


    |   | Microscope microscope; |


    |   |  |


    |   | Result analyze(Sample sample) { |


    | » | **if** (microscope.isInorganic(sample)) { |


    |   | **return** Result.INORGANIC; |


    |   | } **else** { |


    |   | **return** analyzeOrganic(sample); |


    |   | } |


    |   | } |


    |   |  |


    |   | **private** Result analyzeOrganic(Sample sample) { |


    | » | **if** (!microscope.isHumanoid(sample)) { |


    |   | **return** Result.ALIEN; |


    |   | } **else** { |


    |   | **return** Result.HUMANOID; |


    |   | } |


    |   | } |


    |   | } |


    Has anyone ever told you to “think positively”? Turns out, positive expressions
    are better in your code than negative ones because they’re often easier to grasp
    and they take up slightly less space.


    The problem code shown here is another variant of the Laboratory component. It
    provides two methods that take a Sample and return a Result. There’s nothing obviously
    wrong with the code. It’ll fulfill its purpose, but it’s more complex than necessary.


    Consider the conditions of the if statements: Both express a negating condition.
    The first one tests if a sample isInorganic(). The second one even uses the Boolean
    operator for negation: the exclamation mark ’!’.


    In most cases, you’ll find it easier to understand positive expressions when you
    read code. A negated expression adds one extra layer of indirection. Instead of
    a simple “X does apply,” you have to grasp an additional token: “X does not apply.”


    This extra token is often unnecessary. Although it seems like a minor change,
    every tiny bit of simplification helps for more complex expressions (those that
    you’ll find in real code).


    Remember: Everybody likes no negations.


    Now, take a look at the simplified version:


    |   | **class** Laboratory { |


    |   |  |


    |   | Microscope microscope; |


    |   |  |


    |   | Result analyze(Sample sample) { |


    | » | **if** (microscope.isOrganic(sample)) { |


    |   | **return** analyzeOrganic(sample); |


    |   | } **else** { |


    |   | **return** Result.INORGANIC; |


    |   | } |


    |   | } |


    |   |  |


    |   | **private** Result analyzeOrganic(Sample sample) { |


    | » | **if** (microscope.isHumanoid(sample)) { |


    |   | **return** Result.HUMANOID; |


    |   | } **else** { |


    |   | **return** Result.ALIEN; |


    |   | } |


    |   | } |


    |   | } |


    We changed the code only slightly, but that already has an effect. Instead of
    isInorganic(), we’re calling isOrganic(), which has a positive wording instead
    of a negative one. That is, we have to switch the bodies of the if and else blocks.


    When it comes to the second part, we’re calling the same method, isHumanoid(),
    but we eliminated the negation. This is a real simplification of the code. Again,
    it means that we have to switch the bodies of the if and else blocks.


    All in all, these changes are quite simple and you might wonder: why should I
    bother? You should bother because it improves the understandability of the code
    and comes at virtually no cost. You don’t usually have to add further lines of
    code. All you have to do is re-sort existing parts of the code and you’ll see
    an improvement. It’s an opportunity that’s too good to let go!


    Sometimes, however, you need the appropriate methods, like the isOrganic() instead
    of isInorganic() here. If the code you’re calling comes from a third-party library,
    you might not have the option to invoke different methods. But when you control
    it, don’t shy away from adding that method to the appropriate class—the few lines
    of code are worth their characters, because they make your code clearer in other
    places. In the long run you’ll end up with less code, since such methods reduce
    code duplication and can be reused in other parts of the program. From our experience,
    it’s best to get rid of the negative method completely—no need to maintain two
    similar methods.


    ## Return Boolean Expressions Directly


    |   | **class** Astronaut { |


    |   |  |


    |   | String name; |


    |   | **int** missions; |


    |   |  |


    |   | **boolean** isValid() { |


    | » | **if** (missions < 0 &#124;&#124; name == **null** &#124;&#124; name.trim().isEmpty())
    { |


    |   | **return** **false**; |


    |   | } **else** { |


    |   | **return** **true**; |


    |   | } |


    |   | } |


    |   | } |


    Next, let’s look at another way you can cut clutter in your code. In this case,
    we don’t need the if statement to pursue our goals. Let’s find out why.


    You can see a typical validation method in the snippet. The method checks a couple
    of attributes of an object, an integer and a String.


    The integer attribute refers to a number of missions. This number shouldn’t be
    negative.


    The String attribute shouldn’t be null; otherwise we risk that a NullPointerException
    crashes the execution at some point.'
