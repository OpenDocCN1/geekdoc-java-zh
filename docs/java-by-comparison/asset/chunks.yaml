    Constants, as you’ve seen them in the previous comparison, [*Replace Magic Numbers
    with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant), are a
    big improvement over magic numbers. But in case you can enumerate all options,
    Java’s type system offers an even better solution.


    In this code, the input parameter speedPreset is still an integer. That means
    it’s still possible to put any integer value, even a negative one, into setPreset().
    No one forces you to actually use the constants, such as STOP_PRESET, after all.


    If you put an invalid integer value into setPreset(), the method does more or
    less nothing. It checks the conditions, and then returns without altering the
    state or throwing an error. That’s better than crashing, but it can still lead
    to all kinds of bugs in your program.


    In statically typed languages like Java, there are features that you should use
    to spot such errors as early as possible, even before the program is executed
    the first time. The earlier you spot an error, the cheaper it is to fix it!


    So how can we transform this to ensure that the compiler rejects illegal values?


    |   | **class** CruiseControl { |


    |   |  |


    |   | **private** **double** targetSpeedKmh; |


    |   |  |


