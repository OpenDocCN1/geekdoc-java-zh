    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\"Bad message received!\"\
    );\n        }\n    }\n}\n```\n\n异常处理不仅关乎捕获异常，还关乎抛出异常。在抛出异常时，你应该遵循类型规范，以便于异常的异常。\n\
    \n异常的类型已经描述了哪里错了：方法的非法参数会导致 `IllegalArgumentException`；读取不存在的文件会导致 `FileNotFoundException`。但仅有类型是不够的，因为它缺乏上下文：哪个参数错了？为什么错？哪个文件在文件系统中不可用？\n\
    \n我们只能修复可以复现的 Bug。否则，我们不知道自己是否真的修复了它们。通常，我们从异常的堆栈跟踪开始，在代码中回溯，直到找到根源。如果异常本身提供了详细的上下文，这将简单得多。\n\
    \n然而，上述代码抛出的异常缺乏上下文。第一个 `IllegalArgumentException` 是使用默认构造函数创建的，没有提供任何上下文。第二个虽然带有一个消息作为构造函数的输入，但它并没有真正的帮助。遗憾的是，这类消息非常常见。\n\
    \n我们建议对它们多花些心思。\n\n那么，我们如何在异常的消息中包含上下文呢？\n\n```java\nclass TransmissionParser\
    \ {\n    static Transmission parse(String rawMessage) {\n        if (rawMessage\
    \ != null && rawMessage.length() != Transmission.MESSAGE_LENGTH) {\n         \
    \   throw new IllegalArgumentException(\n                String.format(\"Expected\
    \ %d, but got %d characters in '%s'\",\n                    Transmission.MESSAGE_LENGTH,\
    \ rawMessage.length(),\n                    rawMessage));\n        }\n\n     \
    \   String rawId = rawMessage.substring(0, Transmission.ID_LENGTH);\n        String\
    \ rawContent = rawMessage.substring(Transmission.ID_LENGTH);\n        try {\n\
    \            int id = Integer.parseInt(rawId);\n            String content = rawContent.trim();\n\
    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\n                String.format(\"\
    Expected number, but got '%s' in '%s'\",\n                    rawId, rawMessage));\n\
    \        }\n    }\n}\n```\n\n我们提供的不是缺失或无用的信息，而是一个三元组：我们预期的、我们得到的以及整体上下文。追溯异常到源头的开发者会发现这些详细信息让他们更快地找到源头。\n\
    \n此外，我们可以更容易地复现导致异常的情况。更好，我们可以将这些三元组重用为测试用例——我们只需要将它们转换为 JUnit 测试来驱动 Bug 的修复，并在以后作为回归测试。我们将在下一章讨论测试。\n\
    \n你可能已经注意到：我们在异常消息中使用模板，格式为 `Expected [EXPECTED], but got [ACTUAL] in [CONTEXT]`。它强迫我们包含关于预期内容（例如\
    \ 140 个字符）和实际得到内容（例如 3 个字符）的信息，并提供上下文（例如消息“abc”）。例如：`Expected 140, but got 3 characters\
    \ in message 'abc'`。当然，你可以使用任何你喜欢的格式。对我们来说，这种格式非常有回报——当（不是如果）生产环境中发生异常时。\n\n但我们还没有结束。有时，异常无法直接处理。相反，你必须重新抛出它们将其转换为更通用的异常类型。当你这样做时，请避开我们在下一个比较中解释的陷阱。\n\
    \n## 避免破坏原因链\n\n```java\nclass TransmissionParser {\n    static Transmission parse(String\
    \ rawMessage) {\n        if (rawMessage != null && rawMessage.length() != Transmission.MESSAGE_LENGTH)\
    \ {\n            throw new IllegalArgumentException(\n                String.format(\"\
    Expected %d, but got %d characters in '%s'\",\n                    Transmission.MESSAGE_LENGTH,\
    \ rawMessage.length(),\n                    rawMessage));\n        }\n\n     \
    \   String rawId = rawMessage.substring(0, Transmission.ID_LENGTH);\n        String\
    \ rawContent = rawMessage.substring(Transmission.ID_LENGTH);\n        try {\n\
    \            int id = Integer.parseInt(rawId);\n            String content = rawContent.trim();\n\
    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\n                String.format(\"\
    Expected number, but got '%s' in '%s'\",\n                    rawId, rawMessage));\n\
    \        }\n    }\n}\n```\n\n异常会引发更多异常。当异常被捕获但无法处理时，必须重新抛出它。如果涉及 Bug，这种异常会一直传播直到程序崩溃。如果错误处理得当，你将看到一个代表原因链的堆栈跟踪——一个列表，每个异常都链接到导致它的那个异常。在追踪\
    \ Bug 时，详细的原因链价值价值连城。\n\n这就是为什么你必须确保永远不要破坏这条链。例如，看上面的代码。它捕获了 `NumberFormatException`，并转而抛出一个带有信息消息的新\
    \ `IllegalArgumentException`。这本身并不是错误的异常处理——但它破坏了原因链！\n\n你能看出问题所在吗？问题在于 `IllegalArgumentException`\
    \ 没有获取其原因 `NumberFormatException` 的引用。没有这个链接，就没有原因链。当你查看这个 `IllegalArgumentException`\
    \ 的堆栈跟踪时，你找不到任何关于它源自 `NumberFormatException` 或源自代码哪一行的提示。我们丢失了大量有用信息——`NumberFormatException`\
    \ 拥有自己的消息提供了另一个抽象层面的更多信息和上下文，以及它带有行号的独立堆栈跟踪。\n"
