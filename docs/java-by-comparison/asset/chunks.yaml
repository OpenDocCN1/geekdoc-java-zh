    A separation of state and behavior is sometimes hard to detect. As a rule of thumb,
    you can look out for classes that are simply too large or that operate only on
    their method parameters. Try to simplify such classes by grouping variables and
    methods that perform similar tasks into one class each. After that, make sure
    to do a before-and-after comparison to see if you’ve actually improved the design.


    Let’s see how we can build a more convincing combination of state and behavior!


