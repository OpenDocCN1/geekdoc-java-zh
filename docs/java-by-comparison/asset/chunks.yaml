    你已经学习了许多关于编写清洁且可维护的 Java 代码知识，但专业的软件开发远不止于此。生产环境中的软件有百万个崩溃的原因。只要它还在使用，就有人必须维护它。用户的预期会不断增长，他们对“想用你的软件做什么”的感知通常在使用过程中会发生变化。在生产环境中运行一段时间后，一切可能都必须发生改变：


    * 你的软件应该容纳大量新功能，即使在积压了大量 Bug 的情况下。

    * 用户不再是几百个，而是每天有数百万在使用。

    * 你的软件不再运行在本地数据中心的一台机器上，而是运行在全球几个数据中心的机架级服务器上。


    应对这种节奏的关键是接受变化——这是敏捷哲学的一部分。不要将需求的变化和环境的变化视为烦恼，而要将其视为你的软件很有用的信号，并准备好随时调整。这就是为什么你必须确保调整代码不会以不可预见的方式破坏它。让代码具有可读性和可维护性（这也是本书的内容之一），是实现这一点的决决。


    在最后一章中，我们将涉及有关构建和运行软件的一般方面，例如应用静态分析工具、自动化构建以实现持续集成和交付、在生产环境中监控你的软件，以及通过并发提高其速度。这些内容以及整个章节的内容，都是作为一种展望，而且并非所有内容都能在两页的代码对比中很好地解释。这就是为什么我们在最后一章中将偏离本书的代码片段风格。但我们仍然会将一些对比与针对某些技术的、良好的（且刻意简短的）文本大纲相结合，让你了解它们是怎样的，以及可以去哪里学习更多信息。


    ## 使用静态代码分析工具


    在跳高这项奥林匹克项目中，运动员必须跳过一根横杆，在比赛过程中，横杆会越放越高，直到只有一名运动员能跳过去。世界纪录是 2.45 米。静态分析工具就为你的代码质量提供了这样的一根横杆。它们会检查你的代码并寻找潜在的
    Bug 或代码味（code smells）。这不仅仅是编译和运行测试；因此这是你必须跨越的一道更高的障碍。它让你离真实的开发和生产环境更近一步。这些工具通常高效且易于使用。即使它们并不完美并可能报告误报，它们也能帮助你发现那些不会破坏代码但会降低质量的错误。


    书中的大多数对比描述了无意错误和代码味，这些错误在某种意义上与静态分析工具寻找的内容相似。如果你是初学者，这些内容可能需要一些时间来消化，你需要通过练习才能在实际项目中发现它们。当没有足够的时间停下来思考代码质量时，情况也是如此——例如，当在大型代码库中快速移动时。当然，经验丰富的开发者会在代码审查期间发现此类问题，但他们的时间是昂贵的。此外，如果你淹没在静态分析工具可以发现的众多小问题海中，你很可能会忽略那些它无法发现的大问题。


    静态代码分析工具可以自动检测代码中除编译和功能错误之外的某些类型问题，有些甚至可以帮助你修复它们。分析大型代码库对它们不是问题。最棒的一点是：许多工具都是开源且免费的。没有人说你应该应用市面上所有的工具，但使用至少其中一个也有充分的理由——它也能提高你代码的质量。本节的重点是为你提供
    Java 最重要的工具概述。


    `SpotBugs` 或其前身 `FindBugs` 是 Java 最古老的静态代码分析工具之一。它能检测出 400 多种类型的潜在 Bug。是的，这非常多。`SpotBugs`
    只提供文本帮助——它在报告文件或你的 IDE 中指向一段有问题的代码，但它不会提供可以复制粘贴即可的修复方案。它发现的某些 Bug 可能是误报，所以每当你收到警告时，都应该检查它是否是真实问题。`SpotBugs`
    很有帮助，因为有一个庞大的开发者社区致力于构建良好的 Bug 检测策略。


    `Checkstyle` 和 `PMD` 是另外两个与 `SpotBugs` 非常类似的流行工具。它们的主要区别在于它们具有高度的可配置性，如果你想确保某种代码风格，这会是很有有力的帮助。缺点是它们非常啰嗦，你通常需要针对你的项目对其进行特定配置，这可能是很棘手的。在带有全规则集的默认配置下，它们报告的问题数量会比
    `SpotBugs` 高出一个数量级——其中某些问题可能带有主观性或相互矛盾。这就是为什么我们通常会根据对项目重要的规则构建自定义配置，特别是那些强制执行
    Java 代码规范并检查本书涵盖的问题的规则。


    `Error Prone` 是另一个流行的静态分析工具，它更多是 Java 编译器的增强。它执行更高级的类型检查，幸运的是，它为能发现的众多问题提供了修复建议。它由
    Google 为其自有的 Java 代码库构建，但该工具是开源的。`Error Prone` 在检测到 `ConcurrentHashMap` 中的一个 Bug
    时声名大起，这是一个已经在生产环境中运行了一段时间且被广泛认为没有 Bug 的 API 类。我们喜欢在项目中使用 `Error Prone`，因为它产生的误报非常少，而且如果它发现了什么，还会提供修复建议。


    最后，一些 Java IDE 内置了对静态分析的支持。例如，`IntelliJ IDEA` 有一个名为 `Code Inspection` 的功能，可以自动检测代码中的问题，与我们讨论的工具非常相似。最棒的部分是它还会提出修复，你可以通过点击来重构代码。即使你不使用
    `IntelliJ`，也应该检查你的 IDE 开箱能为你提供什么。


    总结来说，静态分析工具对于发现代码中编译器或测试无法发现的问题非常有用且高效。Java 生态系统中有很多工具，你至少应该应用其中一个来帮助维护质量。它们还有助于在团队中统一
    Java 代码格式。


    ## 在团队中约定 Java 格式


    当你专业地构建软件时，你是在团队中进行的。诚然，有些程序员是独立自由职业者，但绝大多数人都在团队中工作。这是好事，因为团队编程更有趣，而且你有机会从同事那里学习。


    当然，这也带来了许多挑战：你们需要进行协调、计划和沟通，敏捷流程（如 Scrum 或 XP）告诉你们如何做。这本书不是关于团队合作的——它是关于代码质量的，我们不会在这个方向上继续深入。我们提到这一点是因为有一个对代码有影响的团队挑战：格式。


    '
- fmt: '

    Code formatting is a topic that easily leads to heated debates, even when you
    talk about the same language. Already the length of a line of code can be discussed.
    Should a line of code be set to 80 characters as it has been traditionally or
    120 characters because we have widescreen displays today? Maybe 100 characters
    is a good compromise? Probably the most famous discussion point is whether you
    should indent code with tabs or spaces. Few things are more controversial among
    developers. Ultimately, there’s no right or wrong here. The problem is that all
    team members need to agree on a consistent formatting style to avoid constant
    reformatting and even bugs.


    Usually, as long as you find a format everybody can agree upon, it’s fine—at least
    as long as you don’t waste countless hours trying to reach an agreement and creating
    corresponding configurations in your `IDEs`.


    A better way is to avoid all discussion and use an industry standard. The Java
    code conventions that we’ve mentioned a few times are a good start, but they’re
    comparably brief and they haven’t been updated in a while. That’s why we recommend
    you resort to the `Google Java Style Guide`, the Java formatting guidelines by
    Google. Essentially, they’re an updated version of the Java Code Conventions with
    more sensible defaults. If that works for formatting all Java Code at Google,
    chances are it’ll also work for your team. The kicker is that there’s `Google
    Java Format`, a tool that checks and enforces this formatting. It’s best if you
    make that a part of your build process. Every time you make a change, simply run
    the tool and you’re done.


    ## Automate Your Build


    Some say that before you can run (write Java code in an `IDE`) you need to learn
    to walk (use the Java command-line tools). We think this is true for the complete
    build process of your software.


    You might’ve written your first Java program in a simple text editor and used
    the command-line tool `javac` to compile your code and run it with the `java`
    command. This works as long things stay (very) simple. From our teaching experience,
    it also really helps beginners to get a grasp of the difference between source
    code and byte code.


    But in any halfway realistic project, you’ll be using external libraries in the
    form of `JARs` (Java Archives), executing `JUnit` tests, and building `JavaDoc`-based
    documentation. If you want to do this only on the command line, you’ll end up
    with a lot of different and very long calls.


    That’s why almost every Java developer writes Java with an `IDE` such as `IntelliJ
    IDEA`, `Eclipse`, or `NetBeans`. `IDEs` can handle all the necessary tasks we
    need to perform, such as executing a Java class with a `main` method or debugging
    a single `JUnit` test. It’s nice if you can standardize that across the team,
    but usually people want to work on different operating systems and/or `IDEs`.
    In that case, you can’t really rely on a single `IDE` anymore.


    The way to go is to automate your build using a dedicated build tool or language
    that works in the same way on all systems and independent of a developer’s machine.
    `Gradle` is such a tool. It’s the rising star for Java and the default build system
    for Android, but you’ll also use `Apache Maven`,`, the established enterprise
    standard, or `Apache Ant` often.


    To automate your build, you’ll need to write a build file and put it into your
    project. This file uses a special syntax depending on the build tool, and in it
    you describe where your source code is located, what your dependencies and external
    libraries are, and what else you need to do for a successful build. Then, the
    build tool interprets the files, downloads any external libraries, runs all tests,
    and if successful, builds an executable. Modern `IDEs` can interpret those build
    files as well, and they integrate with the build tools so you can run anything
    from within your `IDE`. When you’ve automated all that, you’ve taken the first
    steps toward a true delivery pipeline.


    ## Use Continuous Integration


    Automating your build locally with a build tool is really a good start. You can
    run your tests and build executables whenever you want locally on your developer
    machine. But in a real development environment, you’ll want more. That’s where
    `Continuous Integration` comes in.


    When you make a code change locally, of course you should run unit tests to make
    sure you didn’t break anything before you commit it to version control. But in
    an enterprise project, the complete set of tests can be huge, and building a fully
    integrated executable can take a long time. We’re talking about several minutes
    here, even hours, and that’s not a process you want to trigger for every small
    code change on your machine.


    On top of that, we’ve told you to `Use Static Code Analysis Tools`. Those tools
    all operate on a code base and show you potential issues in it. You might fix
    some issues directly and just ignore false positives. What you’re most interested
    in is how your last changes affect code quality. Did you introduce new issues
    that weren’t there before?


    All of these things—extensive testing, integration, and code quality checks—can
    be outsourced to dedicated machines: continuous integration servers. The idea
    behind it all is very simple: for every commit to the version control, a dedicated
    server pulls all code, executes all tests, and builds a fully integrated executable.
    It runs quality checks and compares the results to the commits, thereby building
    a timeline for the quality. There are many different tools you can use here. On
    your own server, you can install `Jenkins`, one of the most popular continuous
    integration systems in the Java world. It can run your tests, and there are many
    plugins for quality checks. But you can also use a dedicated quality analysis
    server. Here, the market leader is `Sonarube`, which you can host yourself or
    use their cloud solution. That last point is interesting. Many cloud services
    that you can use for testing and quality analysis, such as `Travis CI` or `Codacy`,
    are available. They’re handy if your code is open source.


    ## Prepare for and Deliver Into Production


    Production changes everything. Your customers will use your software in so many
    untested ways that you’ll get lots of slow requests, errors, and unexpected behavior
    in your software. To fix those, you need insights about what causes all these
    problems. So it’s vital to prepare for that.


    One part of that preparation is to implement monitoring in the form of logs, metrics,
    dashboards, and alerts. First, you should `Favor Logging Over Console Output`,
    which we’ll explain to you in a moment. Next, you should set up a central place
    where all your logs go. If the logs are also searchable and you can analyze them,
    compute metrics, and visualize them in a dashboard, that’s perfect. Then, you
    might be able to derive key insights and thresholds, like how many orders were
    placed within the last 24 hours. And if such a metric is below a target threshold,
    you’ll probably want to alert the person who can bring that metric up again. For
    things like this, we can recommend the `Open Source Elastic Stack` and `Graylog`.

