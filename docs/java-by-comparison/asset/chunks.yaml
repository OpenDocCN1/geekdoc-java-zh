    \ Things Going Right](#f_0063_split_001.xhtml_chp.testing) gives you advice on\
    \ how to write good unit tests with JUnit5.\n\n*   Chapter 7, [Design Your Objects](#f_0074_split_001.xhtml_chp.design)\
    \ outlines object-oriented design principles.\n\n*   Chapter 8, [Let Your Data\
    \ Flow](#f_0083_split_001.xhtml_chp.lambdas) focuses on functional programming\
    \ in Java using lambda expressions.\n\n*   Finally, Chapter 9, [Prepare for the\
    \ Real World](#f_0094_split_001.xhtml_chp.realworld) directs you to tons of material\
    \ on building, releasing, and maintaining your software in the real world.\n\n\
    So let’s move on and have fun!\n\n## Online Resources\n\nThis book has its own\
    \ web page at www.pragprog.com.^([[14]](#f_0011.xhtml_FOOTNOTE-14)) There, you\
    \ can get in touch with us in the discussion forum,^([[15]](#f_0011.xhtml_FOOTNOTE-15))\
    \ post errata,^([[16]](#f_0011.xhtml_FOOTNOTE-16)) or download the source code^([[17]](#f_0011.xhtml_FOOTNOTE-17))\
    \ of this book.\n\n## Get Ready for Your Mission to Mars\n\nAs a beginner or intermediate\
    \ programmer, getting a sense for good and clean code that others will recognize\
    \ as such might appear to you as something far, far away, a goal almost unreachable—a\
    \ long journey, full of unexpected problems and unknown experiences. It’s a bit\
    \ like traveling through space to a destination that humanity hasn’t reached yet:\
    \ a journey to Mars! That was sort of how we felt when we started to learn programming\
    \ many years ago.\n\nWe’ve written the code in this book with the theme of a Mars\
    \ mission, so all the code examples have something spacey about them. But the\
    \ real reason is that we don’t want to distract you from the problem in a code\
    \ snippet with the setting that the code is in. We used the astronaut theme to\
    \ give you a better read, avoid meaningless variable names like `x` and `y`, or\
    \ the umpteenth inheritance hierarchy from animals to mammals to cats. (We have\
    \ nothing against cats—we just think they’re overused in teaching material.)\n\
    \nOur comparisons are based on code and coding problems that we’ve found that\
    \ a beginner or intermediate programmer often runs into when she’s learning to\
    \ program. We’ve extracted the underlying problems and put them into the domain\
    \ of space travel so it’s easier to imagine the context around them.\n\nWe can’t\
    \ guarantee that you’ll become an astronaut after reading this book, but we’re\
    \ very confident that you’ll be a better programmer. So fasten your seatbelt,\
    \ and onward into (programmer) space!\n\n### Footnotes\n\n[[1]](#f_0007.xhtml_FNPTR-1)\n\
    We know that Oracle already released Java 9. Rest assured that everything in this\
    \ book is still valid in Java 9.\n\n[[2]](#f_0007.xhtml_FNPTR-2)\n[http://c2.com/cgi/wiki?FizzBuzzTest](http://c2.com/cgi/wiki?FizzBuzzTest)\n\
    \n[[3]](#f_0007.xhtml_FNPTR-3)\n[https://imranontech.com/2007/01/24/using-fizzbuzz-to-find-developers-who-grok-coding/](https://imranontech.com/2007/01/24/using-fizzbuzz-to-find-developers-who-grok-coding/)\n\
