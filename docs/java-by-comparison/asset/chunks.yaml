    \nFirst of all, we’ve deleted all comments that just state what you can read straight-out\
    \ from a line of code. All comments that mark the end of code block (`End IF`,\
    \ `End FOR`, etc.) are gone. The indentation tells us that already, but you’ll\
    \ be surprised how often you find these comments not only in legacy code, but\
    \ also in well-known libraries.\n\nWe’ve done the same with all comments that\
    \ highlight the class structure (`Fields`, `Methods`, `Returns`). If you follow\
    \ the class structure that the Java code set out, then there’s no need for this\
    \ sort of signposting.\n\nNext, we’ve deleted all comments that just rephrase\
    \ the code, such as `contaminatedCounter++; // increment counter`. If a comment\
