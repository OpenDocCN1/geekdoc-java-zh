  trans: "\n\n本章的大部分内容都在于确保即使出现问题，你的程序也能正常运行。毕竟，诸如文件处理或网络等某些方面是你无法控制的，你无法阻止此类错误的发生。但有很多问题是你完全可以且应该避免的。你的程序不应该包含编程错误，也不应该包含那些你本可以在自己这边修复的\
    \ bug。\n\n这说起来容易做起来难，但在确保编程在功能上正确时，有一种技术是你首要且最核心的工具：单元测试。这是下一章的主题。我们将向你展示如何编写高质量的测试代码，这些代码不仅能发现\
    \ bug，而且质量与你的业务代码一样高。不要错过这一部分！\n\n### 脚注\n\n[[34]](#f_0054.xhtml_FNPTR-34)\n\n\
    当然，在某些情况下，最具体的异常实际上就是 `Exception`，那么直接捕获它是可以的。\n\n[[35]](#f_0059.xhtml_FNPTR-35)\n\
    \n[`www.oracle.com/technetwork/articles/java/trywithresources-401775.html`](http://www.oracle.com/technetwork/articles/java/trywithresources-401775.html)\n\
    \n版权 © 2018, The Pragmatic Bookshelf.\n\n测试你的代码，否则你的用户会来。\n\nDave Thomas 和 Andrew\
    \ Hunt\n\n# 第 6 章：确保一切正常\n\n人非无错。或者换句话说，我们都会犯错。无论你多么优秀、受过良好教育或富有经验，你偶尔都会写出带有错误的代码。NASA\
    \ 自己的 bug 导致其火星机器人着陆时过猛，其火箭在起飞时加速过快。吃豆人游戏在 256 层结束在了死亡屏幕。一些极其糟糕的软件错误甚至伤害或夺了人的生命——例如，一台辐射过量的\
    \ X 射线机。\n\n当然，你会尝试让你的软件尽可能没有 bug。测试就是你用来发现缺陷的技术之一。它并不完美——再多的测试也永远无法保证没有任何错误。但这并不是完全不写测试的理由。通过我们在本章中向你展示的几个非常简单的技巧，你可以取得很大的进展。\n\
    \n幸运的是，我们现在对编写测试有了非常好的支持——你可以为每次代码更改（无论多小）运行自动化测试，以确保曾经运行正常的功能没有损坏。Java 没有内置的测试支持，但它有某种非常接近的东西：`JUnit`^([[36]](#f_0073.xhtml_FOOTNOTE-36))\
    \ 框架。这是 Java 自动化测试执行的实事实标准。因为它如此重要，在后续的比较中，我们假设你对 `JUnit` 有了基础了解。你至少应该能够运行 `JUnit`\
    \ 测试。\n\n即使你知道如何使用 `JUnit`，第一次编写良好的测试套件也是具有挑战性的。你需要适当设计测试用例、为它们命名，并使用 `JUnit`\
    \ API 及其所有的类、方法和注解。本章将向你展示如何检测用例中的常见问题以及如何改进它们。我们将介绍如何构建测试、描述测试并使其独立存在，以便下一位开发者能够在孤立的情况下更快地理解它。\n\
    \n## 将测试结构为 Given-When-Then\n\n```java\nclass CruiseControlTest {\n    @Test\n\
    \    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl = new\
    \ CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\n上面，你可以看到一个用 `JUnit5` 编写简单测试。虽然它不是 Java 类库的一部分，但 `JUnit` 是 Java\
    \ 编写单元测试的实事实标准，而 `JUnit5` 是最新的版本。定义一个测试非常简单，你可能已经熟悉它了：你只需要在方法上添加 `@Test` 注解，`JUnit`\
    \ 就可以将其作为测试执行。\n\n上面的测试物物有所值——它运行正确，并且能够检测出代码中的 bug。而且由于它是断言的一部分，我们不需要对 `7667`\
    \ 应用将魔术数字替换为常量。问题是，正如我们以前多次看到的，它的结构并没有预想的那么良好，也不易读。可读性对于测试代码来说和源代码一样重要。毕竟，测试代码也是代码。但这里的测试看起来像是匆忙写出来的，而且没有经过尽职调查。\n\
    \n通常，一个测试由三个核心部分组成：given（前提）、when（当...时）和 then（那么）。考虑以下示例性的测试规范：\n\n*   given\
    \ 一台计算器显示数字 2\n*   when 加上数字 3 时\n*   then 它应该显示数字 5。\n\n`given` 部分为实际测试搭建舞台，并捕获执行我们想要测试的功能的所有先决条件。`when`\
    \ 部分触发我们实际上想要测试的操作。在 `then` 部分，我们断言结果符合我们的预期。\n\n你可以通过对其进行结构化来让测试变得清晰得多：\n\n```java\n\
    class CruiseControlTest {\n    @Test\n    void setPlanetarySpeedIs7667() {\n \
    \       // given\n        CruiseControl cruiseControl = new CruiseControl();\n\
    \n        // when\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \n        // then\n        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n\
    \    }\n}\n```\n\n在教学时，我们有时建议添加这些注释，让学生习惯于正确构建测试。但当你习惯了这种结构后，垂直空行就足够了。像 `JGiven`^([[37]](#f_0073.xhtml_FOOTNOTE-37))\
    \ 这样的框架会让这种结构更加显式。\n\n## 使用有意义的断言\n\n```java\nclass CruiseControlTest {\n    @Test\n\
    \    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl = new\
    \ CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\n在 `JUnit` 中能找到的最基础断言是 `assertTrue()`。归结底，一切都归为一个布尔值，取决于条件是否成立。Java\
    \ 解释布尔表达式完全没有问题，但通过以更易于理解的方式编写断言，你可以让你同事的生活变得轻松很多。而你通常不会通过 `assertTrue()` 做到。\n\
    \n"
- fmt: "\nTake a look at the code above. The assertion checks that the value of `targetSpeedKmh`\
    \ is identical to `7667`. Checking for identity with the `==` operator is fine\
    \ here because we compare only primitive types: two `ints`. With objects, you’d\
    \ use `equals()` instead.\n\nThe test is functionally correct, but there’s a problem\
    \ that surfaces when the test fails. If that happens, we’ll get a stack trace\
    \ with a `java.lang.AssertionError` that contains the class and line number of\
    \ the failed assertion, but without any message. So we only know which assertion\
    \ failed, not why it failed.\n\nThat message (or rather the lack of one) isn’t\
    \ helpful when you’re trying to make sense of what’s broken. You’re not directed\
    \ toward the location of a bug. That’s because the assertion simply doesn’t care\
    \ that two values are compared with each other—it only cares that some `Boolean`\
    \ value should be true but is false. So it’s simply not possible to describe the\
    \ failed assertion in more detail.\n\nSo how can we provide more information with\
    \ the assertion so that we get better error messages?\n\n```java\nclass CruiseControlTest\
    \ {\n    @Test\n    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl\
    \ = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(7667, cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\nThe solution is actually quite simple. We use a different assertion,\
    \ one that’s made for checking if two values are the same: `assertEquals()`. With\
    \ this assertion, JUnit can provide a much better error message when the test\
    \ fails. It’ll look like this:\n\nexpected: <7667> but was <1337>\n\nThat’s much\
    \ more informative. Before, we only knew that the test failed. Now, we also know\
    \ why the test fails: we expected the value to be equal to `7667`, but actually\
    \ it was `1337`.\n\nWe’ve got to admit that it’s also possible to provide a more\
    \ detailed message with `assertTrue()`. The big difference is that you have to\
    \ build this message yourself and feed it into `assertTrue()`, which will display\
    \ it in case of failure. That means that you’d have to build a message for every\
    \ `assertTrue()` in our code base. It’s much better to just use an assertion that\
    \ does this out of the box, such as `assertEquals()`.\n\nYou might have recognized\
    \ the message format. We used it in a comparison not so long ago: [*Explain Cause\
    \ in Message](#f_0055.xhtml_sec.explain_cause_in_message). Exceptions can be very\
    \ similar to failing tests in a sense, and the message format is very helpful\
    \ for a developer to determine why something isn’t working as expected.\n\nThere’s\
    \ much more in JUnit than `assertEquals()` and `assertTrue()`. Of course, you\
    \ can also `assertFalse()`, `assertNotEquals()`, and `assertSame()`. You can check\
    \ that arrays or data structures are equal (read: hold equal contents) with `assertArrayEquals()`,\
    \ `assertLinesMatch()`, and `assertIterableEquals()`; that’re able to group multiple\
    \ assertions together with `assertAll()`; and that execution time is short enough\
    \ with `assertTimeout()`. In any case, you should select the assertion that is\
    \ the best fit for your test, because this will make for better messages.\n\n\
    ## Expected Before Actual Value\n\n```java\nclass CruiseControlTest {\n    @Test\n\
    \    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl = new\
    \ CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(cruiseControl.getTargetSpeedKmh(), 7667);\n \
    \   }\n}\n```\n\nThe test above looks correct, doesn’t it? You can see its structuring\
    \ into different parts, it uses `assertEquals()` to compare the results, and it\
    \ has a meaningful name. You need to look closely to find a problem in the code.\n\
    \nIt gets more obvious when you run the test and the assertion fails. If that\
    \ happens, you’ll get a message like this one:\n\nexpected: <1337> but was <7667>\n\
    \nThe message tells you that the two values in the `assertEquals()` method are\
    \ different. That’s why the test fails as it should. So far so good, but the semantics\
    \ of the message are wrong. In the test, we expect the number `7667` as the correct\
    \ result and `1337` is the incorrect result that the `cruiseControl` returns.\
    \ But the message tells you that it’s the other way around.\n\nThe error comes\
    \ from a mix-up in the arguments to `assertEquals()`—they’re in the wrong order.\
    \ Unfortunately, Java or JUnit can’t provide us with type checking support here.\
    \ After all, the types of expected and actual values need to be the same. The\
    \ ordering is a purely semantical problem, and it’s easy to get it wrong by accident.\n\
    \nIn this simple test, we can quickly determine how the message should be. No\
    \ real problem here. But think about a more complex invocation of `assertEquals()`\
    \ that compares large objects that don’t give you such an easy view as the. You’ll\
    \ have a time understanding the error, and you might go down the wrong road for\
    \ debugging, simply because you’ll assume the message is correct. It’s important\
    \ to take care of the order of arguments for `assertEquals()` here:\n\n```java\n\
    class CruiseControlTest {\n    @Test\n    void setPlanetarySpeedIs7667() {\n \
    \       CruiseControl cruiseControl = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(7667, cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\nAs you’ve probably guessed, the solution is very simple in this\
    \ case. We just need to switch the two arguments of `assertEquals()` method. The\
    \ error message then turns into:\n\nexpected: <7667> but was <1337>\n\nThat’s\
    \ much better! Now, the message provides the right information and doesn’t mislead\
    \ you longer. Our rule of thumb is: think first about what you expect. The hard\
    \ part isn’t fixing the bug; it’s avoiding it to begin with. Clear and descriptive\
    \ assertion messages are tremendously helpful in times of need (failing tests);\
    \ you’re going to be very thankful for meaningful messages that lead you toward\
    \ a fix and not in the opposite direction. We’ve been very thankful for those\
    \ many times.\n\nThis chapter is also a reminder to expect the unexpected. When\
    \ something breaks in the code, make sure that you have all the information at\
    \ hand to get a fast understanding of what the correct behavior should be and\
    \ what part of the code causes the trouble. Having the right order of arguments\
    \ is one aspect. Others are using fitting assertions (as in the preceding comparison)\
    \ and configuring them properly, as you’ll learn next: [*Use Reasonable Tolerance\
    \ Values](#f_067.xhtml_sec.item.use-sensible-tolerance-values).\n\n## Use Reasonable\
    \ Tolerance Values\n\n```java\nclass OxygenTankTest {\n    @Test\n    void testNewTankIsEmpty()\
    \ {\n        OxygenTank tank = OxygenTank.withCapacity(100);\n        Assertions.assertEquals(0,\
    \ tank.getStatus());\n    }\n\n    @Test\n    void testFilling() {\n        OxygenTank\
    \ tank = OxygenTank.withCapacity(100);\n        tank.fill(5.8);\n        tank.fill(5.6);\n\
    \        Assertions.assertEquals(0.114, tank.getStatus());\n    }\n}\n```\n\n\
    Here you can see tests that use floating-point numbers instead of integer values.\
    \ From the source code alone, the tests seem good. The problem is that they’re\
    \ going to fail, even if the code that’s tested is functionally correct.\n"
