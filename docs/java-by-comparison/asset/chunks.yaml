    \ the preceding inventory number. This\n     * country code must be exactly two\
    \ capital letters standing for one of\n     * the participating nations (US, EU,\
    \ RU, CN). After that follows a dot\n     * and the actual name of the supply\
    \ in lowercase letters.\n     */\n    static final Pattern CODE = Pattern.compile(\"\
    ^S\\\\d{5}\\\\(US|EU|RU|CN)\\\\.[a-z]+$\");\n}\n```\n\nSome programming constructs\
    \ are very powerful, but also very complex. Regular expressions fall into this\
    \ category. You should document complex constructs in a way that makes them easier\
    \ to understand.\n\nAbove, you see a lengthy regular expression. Its name, `CODE`,\
    \ doesn’t help you to understand what it’s good for, but there’s also a lengthy\
    \ comment.\n\nThis might seem like a good solution. After all, at least there’s\
    \ a comment and not just the code. The comment describes the sort of strings that\
    \ the regex will match, and the code even-\n\nThe problem isn’t that the comment\
    \ is wrong. The problem is it’s less precise than it should be.\n\nComment\n\n\
    You can add comments to regular expressions like this:\n\n```java\nclass Supply\
    \ {\n    /**\n     * The code universally identifies a supply.\n     * Format:\
    \ S<inventory-number>.<name>\n     *\n     * Valid examples:\n     * \"S12345.US\"\
    , \"S08342.CN\", \"S8888.EU\", \"S12233.RU\"\n     *\n     * Invalid examples:\n\
    \     * \"R12345.RU\" (Wrong prefix)\n     * \"S01234.AI\" (Wrong code)\n    \
    \ * \"S8888.EU \" (Trailing whitespaces)\n     */\n    static final Pattern CODE\
    \ = Pattern.compile(\"^S\\\\d{5}\\\\(US|EU|RU|CN)\\\\.[a-z]+$\");\n}\n```\n\n\
    The comment above is a little longer, but it’s more structured, and provides a\
