    as toCSV(). After all, the resulting format of the serialized representation of
    an astronaut is a line of comma-separated values. This makes the meaning of the
    method more obvious to most programmers, simply because the term CSV is very common
    in the programming domain, as we’ve seen in [*Avoid Abbreviations*](#f_0048.xhtml_sec.avoid_abbreviations).


    To sum up: You should align names in your code to the domain it belongs to as
    far as possible and avoid generic names.


    ## What Have You Learned?


    Naming is one of the hardest tasks that you face in your day-to-day developer
    life. Bad naming usually doesn’t stop your code from compiling (so no compiler
    will help you to find really bad names), but it’ll make the code much harder to
    read and understand. And that can turn the maintenance of your code into a nightmare.


    That’s why we’ve added this chapter on naming to the book. Good naming is less
    clear-cut and well defined than the problems you’ve seen in some of the other
    comparisons here. In our experience, you’re never done with proper naming. When
    you look at a piece of code that you’ve written some time ago, chances are you’ll
    find something to improve in naming, if only because you’ve had more time to get
    acquainted with the terms of the domain. Our advice is to always refactor when
    a better name comes to your mind.


    When it comes to naming, conventions are half the rent. Even if you come up with
    a good name, it’s going to look bad if it violates the Java conventions. Conventions
    are especially important for naming getters and setters, which are about the only
    part of Java where terrible naming can result in compile or runtime errors when
    you use certain frameworks. But conventions aside, good names shouldn’t be too
    short (be careful with single letters and abbreviations) or too long (packed with
    meaningless terms), and hitting the right level is really hard. Your best bet
    is to always align names to the domain you’re writing the code for.


    In the next chapter, we’ll move back to a topic that doesn’t just influence the
    understandability of your code, but also its functional correctness: exception
    handling. No matter what type of program you write, unforeseen things can happen,
    and it’s your job to prepare for that. But as exception handling breaks the regular
    control flow, it comes with big potential for introducing subtle bugs or implementing
    it in a way that’s hard to understand. We’re going to show you some tips and tricks
    to avoid that.


    #### Footnotes


    [[29]](#f_0045.xhtml_FNPTR-29)


    [http://www.oracle.com/technetwork/java/codeconventions-150003.pdf](http://www.oracle.com/technetwork/java/codeconventions-150003.pdf)


    [[30]](#f_0046.xhtml_FNPTR-30)


    [http://download.oracle.com/otndocs/jcp/7224-javabeans-1.01-fr-spec-oth-JSpec/](http://download.oracle.com/otndocs/jcp/7224-javabeans-1.01-fr-spec-oth-JSpec/)


    [[31]](#f_0046.xhtml_FNPTR-31)


    We’re avoiding modifiers in other parts of the book, but here they really matter.


    [[32]](#f_0048.xhtml_FNPTR-32)


    [http://www.osnews.com/story/19266/WTFs_m](http://www.osnews.com/story/19266/WTFs_m)


