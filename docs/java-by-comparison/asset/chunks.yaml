    \ CRUISE_SPEED(16944);\n\n    final double speedKmh;\n\n    SpeedPreset(double\
    \ speedKmh) {\n        this.speedKmh = speedKmh;\n    }\n}\n```\n\nJava’s type\
    \ system can be a big help in preventing illegal input values on occasions like\
    \ this. If you can enumerate all available options, such as in this example, it’s\
    \ always preferable to use an enum type instead of an integer.\n\nIn the solution,\
    \ we created a new enum named `SpeedPreset` with a single variable that captures\
