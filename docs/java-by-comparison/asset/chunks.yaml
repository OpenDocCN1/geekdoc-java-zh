  trans: "\n\n你现在可能会指出，getter 和 setter 不再符合 JavaBeans 规范，因为它们的类型不同。如果你必须与依赖此规范的框架集成，这可能会成为一个问题。在这种情况下，你被迫无法使用\
    \ `Optional` 返回类型。否则，`Optional` 仍然可以通过避免空值来让你的程序更加健壮。\n\n## 将 Optional 用作流使用\n\
    \n```java\nclass BackupJob {\n    Communicator communicator;\n    Storage storage;\n\
    \n    void backupToEarth() {\n        Optional<Connection> connectionOptional\
    \ = communicator.getConnectionToEarth();\n        if (!connectionOptional.isPresent())\
    \ {\n            throw new IllegalStateException();\n        }\n\n        Connection\
    \ connection = connectionOptional.get();\n        if (!connection.isFree()) {\n\
    \            throw new IllegalStateException();\n        }\n\n        connection.send(storage.getBackup());\n\
    \    }\n}\n```\n\n在之前的比较中，我们已经展示了 `Optional` 可以作为 `null` 的良好替代方案。但不仅如此，Java 将该类添加到\
    \ lambda 表达式中是有充分理由。`Optional` 也是一种特殊的流（stream），它包含零个或恰好有一个元素。\n\n这意味着你可以直接对 `Optional`\
    \ 应用所有常规流操作，例如 `filter()` 或 `map()`。这为编写更简洁的代码提供了极好的机会。\n\n看看上面的代码。它将一个（可能不存在的）值存储在名为\
    \ `connectionOptional` 的变量中。这是必要的，因为我们需要 a) 通过调用 `isPresent()` 检查是否存在实际值，以及 b)\
    \ 通过调用 `get()` 获取该值。但这个变量名并不理想，也不具有描述性。\n\n将 `Optional` 存储在变量中以及使用这个别扭名称的原因在于阻抗不匹配（impedance\
    \ mismatch）。虽然这在代码中几乎不可见，但 `Optional` 类是为了为函数式编程风格设计的，而方法的其余部分遵循命令式风格。当你这些风格之间切换时，你必须使用\
    \ `get()` 等方法来进行切换。只需避免这种上下文切换，你就能让代码变得易读得多。\n\n在实际实践的代码中，你会经常发现这样的切换。函数式编程风格对\
    \ Java 来说仍然非常新。许多开发者还不熟悉它，或者在完全应用它方面存在问题。这就是为什么他们经常切回命令式风格，即使他们开始时是不同的。\n\n看看通过函数式地实现一切，你可以改进多少代码：\n\
    \n```java\nclass BackupJob {\n    Communicator communicator;\n    Storage storage;\n\
    \n    void backupToEarth() {\n        Connection connection = communicator.getConnectionToEarth()\n\
    \            .filter(Connection::isFree)\n            .orElseThrow(IllegalStateException::new);\n\
    \        connection.send(storage.getBackup());\n    }\n}\n```\n\n其实非常简单。只需使用 `Optional`\
    \ 类提供的各种方法库：中间操作 `filter()`、`map()` 和 `flatMap()`，以及终端操作 `orElse()`、`orElseThrow()`、`orElseGet()`\
    \ 和 `ifPresent()`。\n\n在上面的代码中，我们使用 `filter()` 来检查连接是否可用且空闲，使用 `orElseThrow()`\
    \ 在其不存在时触发异常。这大幅减少了代码量。对比一下代码列表即可。在这种情况下，少即是多！\n\n代码现在简洁得多。这不仅仅是因为我们去掉了奇怪的 `connectionOptional`\
    \ 变量。代码还通过 `orElseThrow()` 操作清晰地信号了当连接不存在或空闲时会发生什么。之前，这分布在两个独立的 `if` 条件中。\n\n\
    在不同的情况下，`Optional` 的其他方法可能更合适。例如，如果你真的不在乎缺失的值，可以只调用 `ifPresent()`。如果你只对从 `Optional`\
    \ 中读取感兴趣，你可以对它进行转换并使用 `.map().orElse(defaultValue)` 提供一个默认值。\n\n后者的用法非常常见。看看下面代码中的示例：\n\
    \n```java\nString state = communicator.getConnectionToEarth()\n    .map(Connection::isFree)\n\
    \    .map(isFree -> isFree ? \"free\" : \"busy\")\n    .orElse(\"absent\");\n\
    ```\n\n## 你学到了什么？\n\n正如你在这一章看到的，函数式风格确实为 Java 编程提供了一种不同的方式。如果你只需描述你想实现什么，而不是一步一步地指示计算机，你就可以变得简洁得多。\n\
    \n如果用命令式编写代码仍然感觉更自然，请记住你可能只是更熟悉这种风格。毕竟，这是你先学习的方式。记住，不熟悉并不意味着更复杂——你只需要习惯它就好。但你已经掌握了基础知识。\n\
    \n通过将数据结构转换为流，你可以更高效地遍历数据结构，并且知道即使在复杂情况下也如何回到命令式风格。你还学习了如何在最合适的情况下通过方法引用的帮助，整齐地交织函数式和命令式风格——例如为了提高方法的可测试性。匿名类将不再用无关的语法干扰你的代码，因为你可以直接将它们替换为\
    \ lambda 表达式。你学习了如何通过 `Optional` 返回类型而不是 `null` 值来让你的程序不那么脆弱，以及如何将 `Optionals`\
    \ 与流集成。\n\n但这不仅仅关乎应用函数式编程。你还看到了哪里可能会出错以及你应该何处格外小心。你意识到副作用会破坏代码的正确性，而且如果存在大量异常，函数式风格并不会让代码更易读。尽管\
    \ `Optional` 值很有帮助，但你也知道如果过度使用它们，它们就不那么好。\n\n"
- fmt: '

    You’ve already learned a lot about writing clean and maintainable Java code, but
    there’s more to professional software development. Production software has a million
    reasons to break. And as long as it’s in use, somebody will have to maintain it.
    User expectations grow and their perception of what they want to do with your
    software usually changes during usage. After some time in production, everything
    might have to be changed:


    * Your software should accommodate plenty of new features, even when there’s a
    large backlog of bugs.

    * There are no longer hundreds of users, but millions using it every day.

    * Your software no longer runs on one machine in a local data center, but on rack-sized
    servers in several data centers around the world.


    The key to coping with this pace is to embrace change—that’s a part of the agile
    philosophy. Don’t view changing requirements and circumstances as annoying, but
    as a sign that your software is useful, and be ready to adapt on the fly. That’s
    why you must make sure that adapting the code won’t break it in unforeseeable
    ways. Making the code readable and maintainable, part of what this book is about,
    is a prerequisite for that.


    In the last chapter, we’ll touch on general aspects regarding building and running
    your software, like applying static analysis tools, automating your build so you
    can do continuous integration and delivery, monitoring your software in production,
    and speeding it up with concurrency. These things, as well as the whole chapter,
    are meant as an outlook and not all of them can be nicely explained in two-page
    code comparisons. That’s why we’ll deviate from the code-snippet style of the
    book for the final chapter. But we’ll still mix a few comparisons with good (and
    deliberately short) textual outlines for certain techniques so you know what they’re
    about and where you can turn for learning more.


    ## Use Static Code Analysis Tools


    In the Olympic discipline of the high jump, the athlete has to jump over a bar,
    and during a competition, the bar is raised higher and higher until only a single
    athlete can jump over it. The world record is 2.45 m. Static analysis tools provide
    such a bar for the quality of your code. They investigate your code and look for
    potential bugs or code smells. That’s more than just compiling and running the
    tests; hence it’s a higher bar you have to jump over. It’s also one step closer
    to a realistic development and production environment. These tools are usually
    efficient and quick to use. Even if they’re not perfect and might report false
    positives, they can help you catch mistakes that don’t break your code but that
    reduce its quality.


    Most of the comparisons in this book describe accidental mistakes and code smells
    that are in some sense similar to what static analysis tools are looking for.
    If you’re a beginner, it can take some time for them to sink in, and you’ll need
    practice to spot them in real projects. That’s also the case when there’s not
    enough time to take a step back and think about code quality—for example, when
    moving fast in large code bases. Of course, experienced developers will find such
    problems during code review, but their time is costly. Also, if you’re drowning
    in a sea of smaller problems that a static analysis tool could have found, chances
    are you’ll overlook the big issues that it doesn’t find.


    Static code analysis tools can automatically detect certain types of problems
    in your code beyond compile and functional errors, and some even help you to fix
    them. Large code bases are no problem to analyze. And the best part: many of them
    are open source and free to use. No one’s saying you should apply every tool out
    there, but there’s also a good reason to use at least one of them—it can also
    improve the quality of your code. The point of this section is to give you an
    overview of the most important tools for Java.


    `SpotBugs`, or its predecessor `FindBugs`, is one of the oldest static code analysis
    tools for Java. It detects over 400 types of potential bugs. Yep, that’s a lot.
    `SpotBugs` provides textual help only—it points you to a problematic piece of
    code in a report file or your IDE, but it doesn’t suggest a copy and paste–ready
    fix. Some of the bugs it spots might be false positives, so every time you get
    a warning, you should check whether it’s a real problem. `SpotBugs` is helpful
    because a large community of developers worked to build good bug detection strategies.


    `Checkstyle` and `PMD` are two other popular tools that are quite similar to `SpotBugs`.
    Their main difference is that they’re highly configurable, which makes them a
    powerful help if you want to ensure a certain code style. The downside is they’re
    quite verbose, and you’ll usually want to configure them specifically for your
    project, which can be tricky. In their default configuration with a full rule
    set, they’ll report issues in numbers that are an order of magnitude higher than
    for `SpotBugs`—some of which might even be opinionated or contradict each other.
    That’s why we usually build a custom configuration with the rules that are important
    for our project, especially the ones that enforce the Java code conventions and
    check for the problems that are covered in this book.


    `Error Prone` is yet another popular static analysis tool that’s more of an enhancement
    to the Java compiler. It performs more advanced type checks and, thankfully, provides
    suggestions for fixes to the numerous issues it can find. It’s built by Google
    for their own Java codebase, but the tool is open source. `Error Prone` became
    famous when it detected a bug in `ConcurrentHashMap`, an API class that was in
    production for some time and widely believed to be bug-free. We like to use `Error
    Prone` in our projects because it produces a very low number of false positives,
    and if it finds something, it also provides a suggestion for a fix.


    Lastly, some Java IDEs come with built-in support for static analysis. For example,
    the `IntelliJ IDEA` has a feature named `Code Inspection` that can automatically
    detect issues in your code, very much like the tools we discussed above. The best
    part is that it also proposes fixes, and you can refactor the code with a click.
    Even if you’re not using `IntelliJ`, you should check what your IDE can do for
    you out-of-the-box.


    To sum up, static analysis tools are very useful and efficient for finding problems
    in your code that the compiler or tests won’t find. There are plenty of tools
    available in the Java ecosystem, and you should apply at least one of them to
    help you maintain a high quality. They also help to enforce a common Java code
    format in your team.


    ## Agree On the Java Format in Your Team


    When you’re building software professionally, you’re doing it in a team. Admittedly,
    some programmers work as independent freelancers, but the vast majority work in
    teams. That’s good, because programming in teams is more fun and you have a chance
    to learn from your colleagues.


    Of course, there are also many challenges: you need to coordinate, plan, and communicate
    with each other, and agile processes such as Scrum or XP tell you how to do this.
    This book isn’t about teamwork—it’s about code quality, and we won’t go any further
    in this direction. We’re bringing this up because there’s a team challenge that
    has an impact on your code: formatting.

    '
