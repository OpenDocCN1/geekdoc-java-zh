  trans: "\n最终，测试将会失败。这正是它们存在的意义——在你弄坏某些东西时提醒你。当测试失败时，你首先看到的是它们的名称。良好的名称非常有价值——它们能帮助你更快地找到失败原因。\n\
    \n在上面的代码中，我们已经做了很多很好的事情：我们应用了`将测试结构化为 Given-When-Then` #f_0064.xhtml_sec.item.structure_tests_into_given_when_then\
    \ 以及之前的比较方法。我们甚至使用了 `assertThrows()` 断言，它期望在 `Executable` 内部抛出一个特定的异常。但代码仍然仍然缺少了一些关键点：良好的名称和文档。这些测试实际上在检查什么？\n\
    \n失败的测试起初只向我们显示类名和方法名。我们知道这个类包含了对 `OxygenTank` 类的测试，因为它遵循了 `[ProductionClass]Test`\
    \ 的命名规范。这很有帮助，但方法名却没那么用；它们只列出了正在测试哪个方法（`fill()` 方法）以及一个测试编号。从这个名称中，仍然不清楚它们实际上在测试什么（除了它们测试了\
    \ `fill()` 方法之外）。遗憾的是，你会在真实代码中经常看到这样的测试名称，因为大多数 IDE 会使用 `test[MethodName]` 规范自动生成它们。\n\
    \n添加注释可能是一种选择。但使用 `JUnit5`，有更好的解决方案。\n\n那么，我们该如何改进这里的测试描述呢？\n\n```java\nclass\
    \ OxygenTankTest {\n    static final double PERMILLE = 0.001;\n\n    @Test\n \
    \   @DisplayName(\"期望在 50l 空水箱中填充 22l 后比例为 44%\")\n    @Disabled(\"我们不再使用小水箱了！待办:\
    \ 适配大水箱\")\n    void fillTank() {\n        OxygenTank smallTank = OxygenTank.withCapacity(50);\n\
    \        smallTank.fill(22);\n        Assertions.assertEquals(0.44, smallTank.getStatus(),\
    \ PERMILLE);\n    }\n\n    @Test\n    @DisplayName(\"如果填充水位 > 水箱容量则失败\")\n   \
    \ void failOverfillTank() {\n        OxygenTank bigTank = OxygenTank.withCapacity(10_000);\n\
    \        bigTank.fill(5344.0);\n        Executable when = () -> bigTank.fill(6000);\n\
    \        Assertions.assertThrows(IllegalArgumentException.class, when);\n    }\n\
    }\n```\n\n我们做的第一件事是去掉方法名中多余的术语。它们不再以 `test` 等单词开头。相反，它们描述了上下文、被测试的方法以及我们检查的断言。`failOverfillTank()`\
    \ 名称的意图比 `testFill2()` 清晰得多！尽管如此，这些名称仍有局限：不能有空格，且只允许字母和数字。\n\n使用 `JUnit5`，有一种可以在不修改方法名的情况下添加良好测试描述的解决方案：`@DisplayName(\"\
    带有空格和符号的描述\")`。通过这个注解你可以你可以空格和符号（例如 `%` 或 `>`）来编写非常具表现力且简洁的测试描述。空格让它们看起来像句子一样易读，而符号则允许对单位进行简短的描述。\n\
    \n描述为什么要禁用测试是很重要的，因为这是你没有直接删除代码的动力。我们建议使用这种格式：`@Disabled(\"[为什么禁用] TODO: [再次启用的计划]\"\
    )`。这 a) 强迫你在禁用测试时思考该测试的未来，b) 为未来的开发者提供再次启用的必要信息（而不是让他们无所措地陷入困境）。\n\n## 偏好独立测试\n\
    \n```java\nclass OxygenTankTest {\n    OxygenTank tank;\n\n    @BeforeEach\n \
    \   void setUp() {\n        tank = OxygenTank.withCapacity(10_000);\n        tank.fill(5_000);\n\
    \    }\n\n    @Test\n    void depressurizingEmptiesTank() {\n        tank.depressurize();\n\
    \        Assertions.assertTrue(tank.isEmpty());\n    }\n\n    @Test\n    void\
    \ completelyFillTankMustBeFull() {\n        tank.fillUp();\n        Assertions.assertTrue(tank.isFull());\n\
    \    }\n}\n```\n\n当我们教学时，经常会看到初学者喜欢使用 `@BeforeEach` 和 `@BeforeAll`。他们创建了框架可以轻松处理的隐式依赖，但对于程序员程序员来说，这降低了代码的可读性。\n\
    \n本质上，我们让测试变得独立了。当你直接在测试方法内部链接 `given`、`when` 和 `then` 部分时，测试就是独立的。与其将测试的 `given`\
    \ 部分分离到 `@BeforeEach` 设置方法中，我们将该部分放回每个测试中。当然，我们并不是说你应该重复代码。这就是为什么我们将设置部分提取到一个静态方法，并给它一个有意义的名字：`createFilledTank()`。\n\
    \n现在你可以独立理解每个测试，而不需要寻找在其他地方隐式链接设置逻辑。将测试从一个测试类移动到另一个测试类也更容易，因为你不再有隐式依赖。编译器会告诉你你是否忘记了什么。这是可能的因为测试是独立的——所有依赖都是显式的。\n\
    \n```java\nclass OxygenTankTest {\n    static OxygenTank createFilledTank() {\n\
    \        OxygenTank tank = OxygenTank.withCapacity(10_000);\n        tank.fill(5_000);\n\
    \        return tank;\n    }\n\n    @Test\n    void depressurizingEmptiesTank()\
    \ {\n        OxygenTank tank = createFilledTank();\n        tank.depressurize();\n\
    \        Assertions.assertTrue(tank.isEmpty());\n    }\n\n    @Test\n    void\
    \ completelyFillTankMustBeFull() {\n        OxygenTank tank = createFilledTank();\n\
    \        tank.fillUp();\n        Assertions.assertTrue(tank.isFull());\n    }\n\
    }\n```\n\n总结一下：我们建议你避免 `@BeforeEach` 和 `@BeforeAll` 注解，尽管它们的使用很常见。它们创建了框架可以轻松处理的隐式依赖，但它们降低了你代码的可读性。如果测试是独立的，它们会更好，你只需要通过查看测试方法就能理解整个测试，而不需要在代码中来回滚动。如果你的测试设置包含两个以上的变量，请不要回退到\
    \ `@BeforeEach`，而是为整个测试设置创建一个类。\n\n## 参数化你的测试\n\n```java\nclass DistanceConversionTest\
    \ {\n    @Test\n    void testConversionRoundTrip() {\n        assertRoundTrip(1);\n\
    \        assertRoundTrip(1_000);\n        assertRoundTrip(9_999_999);\n    }\n\
    \n    private void assertRoundTrip(int kilometers) {\n    }\n}\n```\n"
- fmt: "\n```java\nDistance expectedDistance = new Distance(DistanceUnit.KILOMETERS,\
    \ kilometers);\nDistance actualDistance = expectedDistance\n    .convertTo(DistanceUnit.MILES)\n\
    \    .convertTo(DistanceUnit.KILOMETERS);\nAssertions.assertEquals(expectedDistance,\
    \ actualDistance);\n```\n\nSometimes, you need to test a method or chain of methods\
    \ in the same way, but with many different input parameters. That’s when you want\
    \ to make sure that the method works for a large range of values. It’s easy to\
    \ enumerate the parameters in a test method, like in the code above, but this\
    \ can complicate testing.\n\nThe method above tests that you can convert distance\
    \ values back and forth and get the same result. Can you spot an issue with this\
    \ method? At a glance, it looks clean and readable. The private method `assertRoundTrip()`\
    \ also conforms to our structure of given-when-then.\n\nThink about test execution.\
    \ What happens if the first assertion, the call to `assertRoundTrip(1)`, already\
    \ fails? In that case, JUnit marks the complete test as failed and skips the other\
    \ two assertions with the integers 1000 and 9999999. You’d have to fix the bug\
    \ that caused `assertRoundTrip(1)` to fail, run the test again, only to find that\
    \ now the second assertion, `assertRoundTrip(1000)`, fails as well. Put differently,\
    \ the assertions hide the ones that follow in the code above.\n\nYou can’t fix\
    \ this with a for loop in the test method that iterates over a set of parameters.\
    \ The only solution is to execute a different test for every parameter and have\
    \ one assertion per test. Adding new test methods is easy, but what if you need\
    \ tests for thirty different integers here? This would be a lot of code repetition.\n\
    \nLuckily, JUnit has special assertions for exactly this situation:\n\n```java\n\
    class DistanceConversionTest {\n\n    @ParameterizedTest(name = \"#{index}: {0}km\
    \ == {0}km->mi->km\")\n    @ValueSource(ints = {1, 1_000, 9_999_999})\n    void\
    \ testConversionRoundTrip(int kilometers) {\n        Distance expectedDistance\
    \ = new Distance(DistanceUnit.KILOMETERS, kilometers);\n        Distance actualDistance\
    \ = expectedDistance\n            .convertTo(DistanceUnit.MILES)\n           \
    \ .convertTo(DistanceUnit.KILOMETERS);\n        Assertions.assertEquals(expectedDistance,\
    \ actualDistance);\n    }\n}\n```\n\nThe solution here consists of parameterized\
    \ tests with the `@ParameterizedTest` and `@ValueSource` annotations. They allow\
    \ us to separate the parameters (i.e., the input and expected output) from the\
    \ actual test code. Upon execution, JUnit runs a separate test for every parameter.\n\
    \nWe declared the parameters in the `@ValueSource(ints = { ... })` annotation\
    \ as an array of integers. Here, we’re lucky to have the input match the expected\
    \ output, due to the roundtrip nature of the test. Sometimes, you just expect\
    \ that no exception is thrown (see [Let JUnit Handle Exceptions](#f_0068.xhtml_sec.item.junit-handle-exceptions)).\n\
    \nWe also apply [Describe Your Tests](#f_0069.xhtml_sec.item.describe-tests) here,\
    \ with the `name` variable inside `@ParameterizedTest(name = \"\")`. The variable\
    \ `{index}` refers to the index of the test and we can also reference the arguments\
    \ of the test method with curly braces. `{0}` stands for the first one and, in\
    \ this case, the only one. That way, our test description reads like a compressed\
    \ form of the whole test.\n\nYou can inject parameters from different sources\
    \ such as CSV files, return values of methods, or explicitly in code, as we’ve\
    \ done. As a rule of thumb, if you have only a few parameters, it’s better to\
    \ declare them explicitly. CSV files or method return values are better if their\
    \ amount is very large.\n\nParameterized tests are only the beginning. Property-based\
    \ testing libraries such as `junit-quickcheck`^[40](#f_0073.xhtml_FOOTNOTE-40)\
    \ that automatically generate inputs and expected outputs are the next step. With\
    \ such a technique, it’s easy to cover a large range of parameters without having\
    \ to maintain a large list of parameters in code.\n\n## Cover the Edge Cases\n\
    \n```java\nclass TransmissionParserTest {\n\n    @Test\n    void testValidTransmission()\
    \ {\n        TransmissionParser parser = new TransmissionParser();\n        Transmission\
    \ transmission = parser.parse(\"032Houston, UFO sighted!\");\n        Assertions.assertEquals(32,\
    \ transmission.getId());\n        Assertions.assertEquals(\"Houston, UFO sighted!\"\
    , transmission.getContent());\n    }\n}\n```\n\nIn a perfect world, you’d test\
    \ your code for every possible input parameter. But most of the time, you simply\
    \ can’t. Already, a simple 32-bit integer would require 2^32 tests. That’s over\
    \ 4 billion! Instead of testing every possibility, you should cover the normal\
    \ execution path and the settings that are most likely to go wrong. Put differently,\
    \ you should cover edge cases.\n\nThe code above contains a single test. It’s\
    \ a test for the normal path—the scenario when a valid input (a String message)\
    \ produces a typical output (a non-empty Transmission). But what if the input\
    \ String isn’t regular?\n\n- `null` (null reference)\n- `\"\"` (the empty String)\n\
    - `\" \"` (a String with only whitespace characters)\n- or `\"a\\nt͡ ɬɪŋɑn\\nb\"\
    ` (a String with special non-English characters)\n\nYou can test for many different\
    \ versions of a regular input, but the ones above are usually far more likely\
    \ to uncover a bug in your system. Edge cases are highly specific for a piece\
    \ of code, but usually you should at least try the boundaries of a parameter.\
    \ You’ve seen String above, and here are some examples:\n\n- `int`: `0`, `1`,\
    \ `-1`, `Integer.MAX_VALUE`, `Integer.MIN_VALUE`\n- `double`: `0`, `1.0`, `-1.0`,\
    \ `Double.MAX_VALUE`, `Double.MIN_VALUE`\n- `Object[]`: `null`, `{}`, `{null}`\n\
    - `List<Object>`: `null`, `Collections.emptyList()`, `Collections.singletonList(null)`,\
    \ `Arrays.asList(new Object(), null)`\n\nThat’s a lot, but not all. For example,\
    \ what are edge cases for email addresses, or uploaded photos? In our example\
    \ above, which strings are edge cases? Let’s take a look at which edge cases we\
    \ should cover here:\n\n```java\nclass TransmissionParserTest {\n\n    @Test\n\
    \    void testValidTransmission() {\n        TransmissionParser parser = new TransmissionParser();\n\
    \        Transmission transmission = parser.parse(\"032Houston, UFO sighted!\"\
    );\n        Assertions.assertEquals(32, transmission.getId());\n        Assertions.assertEquals(\"\
    Houston, UFO sighted!\", transmission.getContent());\n    }\n\n    @Test\n   \
    \ void nullShouldThrowIllegalArgumentException() {\n        Executable when =\
    \ () -> new TransmissionParser().parse(null);\n        Assertions.assertEquals(IllegalArgumentException.class,\
    \ when);\n    }\n\n    @Test\n    void malformedTransmissionShouldThrowIllegalArgumentException()\
    \ {\n        Executable when = () -> new TransmissionParser().parse(\"t͡ɬɪŋɑn\"\
    );\n        Assertions.assertEquals(IllegalArgumentException.class, when);\n \
    \   }\n}\n```\n\nWe added two new tests: one for `null` and one for `t͡ ɬɪŋɑn`.\
    \ In both cases, the parser should respond with an `IllegalArgumentException`\
    \ to indicate that the input is invalid. Checking for null is the standard edge\
    \ case with the worst consequences. The other test covers input with a lot of\
    \ different unicode symbols indicating a malformed string with arbitrary input^[41](#f_0073.xhtml_FOOTNOTE-41)\n"
  raw: '|   | Distance expectedDistance = **new** Distance( |


    |   | DistanceUnit.KILOMETERS, |


    |   | kilometers |


    |   | ); |


    |   |  |


    |   | Distance actualDistance = expectedDistance |


    |   | .convertTo(DistanceUnit.MILES) |


    |   | .convertTo(DistanceUnit.KILOMETERS); |


    |   |  |


    |   | Assertions.assertEquals(expectedDistance, actualDistance); |


    |   | } |


    |   | } |


    Sometimes, you need to test a method or chain of methods in the same way, but
    with many different input parameters. That’s when you want to make sure that the
    method works for a large range of values. It’s easy to enumerate the parameters
    in a test method, like in the code above, but this can complicate testing.


    The method above tests that you can convert distance values back and forth and
    get the same result. Can you spot an issue with this method? At a glance, it looks
    clean and readable. The private method assertRoundTrip() also conforms to our
    structure of given-when-then.


    Think about test execution. What happens if the first assertion, the call to assertRoundTrip(1),
    already fails? In that case, JUnit marks the complete test as failed and skips
    the other two assertions with the integers 1000 and 9999999. You’d have to fix
    the bug that caused assertRoundTrip(1) to fail, run the test again, only to find
    that now the second assertion, assertRoundTrip(1000), fails as well. Put differently,
    the assertions hide the ones that follow in the code above.


    You can’t fix this with a for loop in the test method that iterates over a set
    of parameters. The only solution is to execute a different test for every parameter
    and have one assertion per test. Adding new test methods is easy, but what if
    you need tests for thirty different integers here? This would be a lot of code
    repetition.


    Luckily, JUnit has special assertions for exactly this situation:


    |   | **class** DistanceConversionTest { |


    |   |  |


    | » | @ParameterizedTest(name = *"#{index}: {0}km == {0}km->mi->km"*) |


    |   | @ValueSource(ints = {1, 1_000, 9_999_999}) |


    |   | **void** testConversionRoundTrip(**int** kilometers) { |


    |   | Distance expectedDistance = **new** Distance( |


    |   | DistanceUnit.KILOMETERS, |


    |   | kilometers |


    |   | ); |


    |   |  |


    |   | Distance actualDistance = expectedDistance |


    |   | .convertTo(DistanceUnit.MILES) |


    |   | .convertTo(DistanceUnit.KILOMETERS); |


    |   |  |


    |   | Assertions.assertEquals(expectedDistance, actualDistance); |


    |   | } |


    |   | } |


    The solution here consists of parameterized tests with the @ParameterizedTest
    and @ValueSource annotations. They allow us to separate the parameters (i.e.,
    the input and expected output) from the actual test code. Upon execution, JUnit
    runs a separate test for every parameter.


    We declared the parameters in the @ValueSource(ints = { ... }) annotation as an
    array of integers. Here, we’re lucky to have the input match the expected output,
    due to the roundtrip nature of the test. Sometimes, you just expect that no exception
    is thrown (see [*Let JUnit Handle Exceptions*](#f_0068.xhtml_sec.item.junit-handle-exceptions)).


    We also apply [*Describe Your Tests*](#f_0069.xhtml_sec.item.describe-tests) here,
    with the name variable inside @ParameterizedTest(name = ""). The variable {index}
    refers to the index of the test and we can also reference the arguments of the
    test method with curly braces. {0} stands for the first one and, in this case,
    the only one. That way, our test description reads like a compressed form of the
    whole test.


    You can inject parameters from different sources such as CSV files, return values
    of methods, or explicitly in code, as we’ve done. As a rule of thumb, if you have
    only a few parameters, it’s better to declare them explicitly. CSV files or method
    return values are better if their amount is very large.


    Parameterized tests are only the beginning. Property-based testing libraries such
    as junit-quickcheck^([[40]](#f_0073.xhtml_FOOTNOTE-40)) that automatically generate
    inputs and expected outputs are the next step. With such a technique, it’s easy
    to cover a large range of parameters without having to maintain a large list of
    parameters in code.


    ## Cover the Edge Cases


    |   | **class** TransmissionParserTest { |


    |   |  |


    | » | @Test |


    |   | **void** testValidTransmission() { |


    |   | TransmissionParser parser = **new** TransmissionParser(); |


    |   |  |


    |   | Transmission transmission = parser.parse(*"032Houston, UFO sighted!"*);
    |


    |   |  |


    |   | Assertions.assertEquals(32, transmission.getId()); |


    |   | Assertions.assertEquals(*"Houston, UFO sighted!"*, |


    |   | transmission.getContent()); |


    |   | } |


    |   | } |


    In a perfect world, you’d test your code for every possible input parameter. But
    most of the time, you simply can’t. Already, a simple 32-bit integer would require
    2^32 tests. That’s over 4 billion! Instead of testing every possibility, you should
    cover the normal execution path and the settings that are most likely to go wrong.
    Put differently, you should cover edge cases.


    The code above contains a single test. It’s a test for the normal path—the scenario
    when a valid input (a String message) produces a typical output (a non-empty Transmission).
    But what if the input String isn’t regular?


    *   null (null reference)


    *   "" (the empty String)


    *   " " (a String with only whitespace characters)


    *   or "a\nt͡ ɬɪŋɑn\nb" (a String with special non-English characters)


    You can test for many different versions of a regular input, but the ones above
    are usually far more likely to uncover a bug in your system.


    Edge cases are highly specific for a piece of code, but usually you should at
    least try the boundaries of a parameter’s data type. You’ve seen String above,
    and here are some more examples:


    *   int: 0, 1, -1, Integer.MAX_VALUE, Integer.MIN_VALUE


    *   double: 0, 1.0, -1.0, Double.MAX_VALUE, Double.MIN_VALUE


    *   Object[]: null, {}, {null}, {new Object(), null}


    *   List<Object>: null, Collections.emptyList(), Collections.singletonList(null),
    Arrays.asList(new Object(), null)


    That’s a lot, but not all. For example, what are edge cases for email addresses,
    or uploaded photos? In our example above, which transmission strings are edge
    cases? Edge cases are the perfect candidate for further tests.


    Let’s take a look at which edge cases we should cover here:


    |   | **class** TransmissionParserTest { |


    |   |  |


    | » | @Test |


    |   | **void** testValidTransmission() { |


    |   | TransmissionParser parser = **new** TransmissionParser(); |


    |   |  |


    |   | Transmission transmission = parser.parse(*"032Houston, UFO sighted!"*);
    |


    |   |  |


    |   | Assertions.assertEquals(32, transmission.getId()); |


    |   | Assertions.assertEquals(*"Houston, UFO sighted!"*, |


    |   | transmission.getContent()); |


    |   | } |


    |   |  |


    | » | @Test |


    |   | **void** nullShouldThrowIllegalArgumentException() { |


    |   | Executable when = () -> **new** TransmissionParser().parse(**null**); |


    |   | Assertions.assertThrows(IllegalArgumentException.class, when); |


    |   | } |


    |   |  |


    | » | @Test |


    |   | **void** malformedTransmissionShouldThrowIllegalArgumentException() { |


    |   | Executable when = () -> **new** TransmissionParser().parse(*"t͡ɬɪŋɑn"*);
    |


    |   | Assertions.assertThrows(IllegalArgumentException.class, when); |


    |   | } |


    |   | } |


    We added two new tests: one for null and one for "t͡ ɬɪŋɑn". In both cases, the
    parser should respond with an IllegalArgumentException to indicate that the input
    is invalid. Checking for null is the standard edge case with the worst consequences.
    The other test covers input with a lot of different unicode symbols indicating
    a malformed string with arbitrary input.^([[41]](#f_0073.xhtml_FOOTNOTE-41))'
