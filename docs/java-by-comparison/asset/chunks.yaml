    So what should we do with abbreviations?


    |   | **class** Logbook { |


    | » | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** Path STATISTICS_CSV = LOG_FOLDER.resolve(*"stats.csv"*);
    |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    | » | **void** createStatistics() **throws** IOException { |


    |   | **try** (DirectoryStream<Path> logs = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER); |


    |   | BufferedWriter writer = |


    |   | Files.newBufferedWriter(STATISTICS_CSV)) { |


    |   | **for** (Path log : logs) { |


    |   | String csvLine = String.format(*"%s,%d,%s"*, |


    |   | log, |


    |   | Files.size(log), |


    |   | Files.getLastModifiedTime(log)); |


    |   | writer.write(csvLine); |


    |   | writer.newLine(); |


    |   | } |


    |   | } |


    |   | } |


    |   | } |


    The rule is quite obvious: only use abbreviations that are very common, and use
    long names for the rest.


    Just look at the code above. It’s much easier to comprehend, and we don’t stumble
    upon strange variable names anymore.


    First, we renamed the three fields from DIR, CSV, and GLOB to LOG_FOLDER, STATISTICS_CSV,
    and FILE_FILTER. In our view, CSV (comma-separated values) is the only abbreviation
    in the code that’s sufficiently well-known. We kept it and added a little bit
    more context to it. Next, we replaced the abbreviations DIR and GLOB with concise
    unabbreviated names. FILE_FILTER conveys the variable’s intent much better than
    GLOB.


    You don’t always have to spell out abbreviations in full. For bufW, the full name
    would be bufferedWriter. We just use the second word writer because that’s its
    purpose here. The fact that it has a buffer is less important. And as the replacement
    for dirStr, the short name logs seems much more informative than the full name
    directoryStream.


    Lastly, we renamed the variable csvLn to csvLine. Its purpose is to indicate that
    it contains a line (of a CSV file), so why shouldn’t we just call it line, too?


    To sum up, you should try to avoid abbreviations and use them only if they’re
    very common. If in doubt, spell it out!


    ## Avoid Meaningless Terms


    | » | **class** MainSpaceShipManager { |


    |   | AbstractRocketPropulsionEngine abstractRocketPropulsionEngine; |


    |   | INavigationController navigationController; |


    |   | **boolean** turboEnabledFlag; |


    |   |  |


    |   | **void** navigateSpaceShipTo(PlanetInfo planetInfo) { |


    |   | RouteData data = navigationController.calculateRouteData(planetInfo); |


    |   | LogHelper.logRouteData(data); |


    |   | abstractRocketPropulsionEngine.invokeTask(data, turboEnabledFlag); |


    |   | } |


    |   | } |


    Good naming isn’t just about spelling out short names and making names longer.
    Sometimes, long names can be just as burdensome. And there are some terms programmers
    use often that have lost all meaning.


    Look at the code above. It doesn’t contain abbreviations like in [*Avoid Abbreviations*](#f_0048.xhtml_sec.avoid_abbreviations),
    and all names are spelled out, but that doesn’t mean the naming is good. There
    are various meaningless words in there that you can just remove. And we’ve seen
    names like this many times in real production code.


    Can you spot which words convey no meaning and just add text? What parts could
    you leave out without impacting understandability?


    There are some low-hanging fruits—meaningless terms that people use very often,
    like “main,” “manager,” “data,” “info,” or “flag.” They’re easy to spot. But what
    about the terms “abstract,” a method named “invoke,” or a parameter’s type within
    a method name? Are those meaningful? Not really.


    Brevity and Naming: The Eternal Struggle


    Brevity in naming isn’t necessarily a virtue. Most often, it’s better to have
    a verbose but descriptive name instead of a cryptic abbreviation whose only benefit
    is that it’s easy to type. Normally, you won’t type a full name anyway. Your IDE’s
    auto-completion will do this for you. And we have to emphasize: names are read
    much more often than they’re written. If a name is confusing, misleading, wrong,
    hard to understand, or missing the right information, a new developer will have
    a hard time working with the code.


    So what parts can we leave out without losing the intended meaning?


    | » | **class** SpaceShip { |


    |   | Engine engine; |


    |   | Navigator navigator; |


    |   | **boolean** turboEnabled; |


    |   |  |


    | » | **void** navigateTo(Planet destination) { |


    |   | Route route = navigator.calculateRouteTo(destination); |


    |   | Logger.log(route); |


    |   | engine.follow(route, turboEnabled); |


    |   | } |


    |   | } |


    Actually, we can leave out a lot. Just compare the two code snippets: we removed
    over 100 characters (about a quarter of the whole code). That’s a lot less to
    read and think about. Not bad! Let’s go through it.


    To start with, we simply removed typical meaningless terms like “data,” “info,”
    or “flag.” It’s rare that such terms add any meaning to the code.


    Next, when reading a type name, we don’t care if it’s an enum, a class, an interface,
    or an abstract class. After all, the type itself is already stating this. That’s
    why the term “abstract” or “impl” doesn’t help in class names, and neither the
    prefix “I” for names of interfaces. Don’t do this!


    A class’s name provides context to its members and already conveys a lot of meaning.
    That’s why you can remove domain specifiers like “rocket” in a class named “SpaceShip.”
    You can do the same with repeated parameter types in method names, as in logRouteData(),
    which we renamed to log(). The parameter route itself already states what’s being
    logged—no need to repeat it in the method name.


    Verbs like “invoke,” “call,” or “do” also convey little meaning in method names.
    Instead of using these, you should try to find a more precise and meaningful verb
    instead. Lastly, we often see meaningless terms in package names as well. Watch
    out for words like misc, other, or util.


    Our advice is to watch out for the terms mentioned here and to think twice whenever
    you feel tempted to write them. Whether a term is actually meaningful or not depends
    on the concrete context. Many frameworks have a hard time deciding this as well.
    One class name in the Spring framework is famous: Roses are red, leaves are green,
    but only Java has AbstractSingletonProxyFactoryBean.^([[33]](#f_0051.xhtml_FOOTNOTE-33))


    ## Use Domain Terminology


    | » | **class** Person { |


    | » | String lastName; |


    | » | String role; |


    | » | **int** travels; |


    | » | LocalDate employedSince; |


    |   |  |


    | » | String serializeAsLine() { |


    |   | **return** String.join(*","*, |


    |   | Arrays.asList(lastName, |


    |   | role, |


    |   | String.valueOf(travels), |


    |   | String.valueOf(employedSince)) |


    |   | ); |


    |   | } |


    |   | } |


    The code you work on usually belongs to a specific domain, and a domain has its
    own vocabulary. Think of sports; different sports have their own domain-specific
    names for hurling, throwing, kicking, bending, or dunking a different kind of
    ball. The more you insert the terms of your program’s domain into your code, the
    better.'
