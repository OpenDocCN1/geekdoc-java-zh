    代码格式是一个很容易引发激烈辩论的话题，即使当你讨论的是同一种语言时也是如此。单行代码的长度就可以被讨论。代码行应该像传统那样设置为 80 个字符，还是因为我们现在有了宽屏显示器而设置为
    120 个字符？也许 100 个字符是一个很好的折中方案？最著名的讨论点可能过于你应该使用制表符（tabs）还是空格（spaces）来缩进代码。开发者之间没有什么能比这更有争议了。最终，这里没有对错之分。问题在于，所有团队成员都需要同意一致的格式风格，以避免频繁的重新格式化甚至
    Bug 的产生。


    通常情况下，只要你能找到大家都能同意的格式就可以了——至少只要你没有浪费无数小时去尝试达成共识并在你的 `IDEs` 中创建相应的配置。


    更好的方法是避开所有讨论并使用行业标准。我们提到过的几次 Java 代码规范是一个很好的开始，但它们相对简短，而且已经很久没有更新了。这就是为什么我们建议你求助于
    `Google Java Style Guide`，即 Google 提供的 Java 格式化指南。本质上，它们是 Java 代码规范的更新版本，具有更合理的默认设置。如果这适用于
    Google 的所有 Java 代码格式，那么它可能也适用于你的团队。关键在于有一个名为 `Google Java Format` 的工具，它可以检查并强制执行这种格式。最好的做法是将其成为你构建过程的一部分。每当你进行更改更改时，只需运行该工具即可完成。


    ## 自动化你的构建


    有些人说，在你运行（在 `IDE` 中编写 Java 代码）之前，你得先学会走路（使用 Java 命令行工具）。我们认为，对于你软件的完整构建过程来说，这句话是真理。


    你可能在一个简单的文本编辑器中写了你的第一个 Java 程序，并使用命令行工具 `javac` 编译代码，然后使用 `java` 命令运行它。只要事情保持（非常）简单，这种方法就行得通。根据我们的教学经验，这对于初学者掌握源代码和字节码之间的区别也非常有帮助。


    但在任何半个现实的项目中，你将会以 `JARs`（Java 归文件）的形式使用外部库，执行 `JUnit` 测试，并构建基于 `JavaDoc` 的文档。如果你只想在命令行上执行这些操作，你最终会导致许多不同且非常长的调用。


    这就是为什么几乎每个 Java 开发者都会使用如 `IntelliJ IDEA`、`Eclipse` 或 `NetBeans` 等 `IDE` 来编写 Java。`IDEs`
    可以处理我们需要执行的所有必要任务，例如执行带有 `main` 方法的 Java 类或调试单个 `JUnit` 测试。如果你能在团队范围内对这些进行标准化，那就很好，但通常人们希望在不同的操作系统和/或
    `IDEs` 上工作。在这种情况下，你不能再依赖单一的 `IDE` 了。


    正确的做法是使用专用的构建工具或语言来自动化你的构建，这种工具在所有系统上的工作方式相同，并且独立于开发者的机器。`Gradle` 就是这样的工具。它是 Java
    领域的新星，也是 Android 的默认构建系统，但你也会经常使用成熟的企业级标准 `Apache Maven` 或 `Apache Ant`。


    为了自动化你的构建，你需要编写一个构建文件并将其项目中。该文件使用取决于构建工具的特殊语法，你在其中描述你的源代码位置、你的依赖项和外部库是什么，以及为了成功构建你还需要做什么。然后，构建工具会解释这些文件，下载任何外部库，运行所有测试，如果成功，则构建一个可执行文件。现代
    `IDEs` 也可以解释这些构建文件，并且它们与构建工具集成，因此你可以在 `IDE` 内部运行任何内容。当你自动化了这一切时，你就迈出了通向真正的交付流水线的第一步。


    ## 使用持续集成


    使用构建工具在本地自动化你的构建是一个非常好的开始。你可以随时在本地的开发者机器上运行测试并构建可执行文件。但在真实的开发环境中，你想要更多。这就是 `Continuous
    Integration`（持续集成）大用场。


    当你在本地进行代码更改时，你当然应该在提交到版本控制之前运行单元测试，以确保你没有破坏任何内容。但在企业项目中，全套测试可能是巨大的，构建一个完全集成的可执行文件可能需要很长时间。我们说的是几分钟，甚至是几小时，这不是你希望为机器上的每个微小代码更改都触发的过程。


    此外，我们告诉过你要`使用静态代码分析工具`。这些工具都可以在代码库上运行并向你展示其中的潜在问题。你可以直接修复某些问题并忽略误报。你最感兴趣的是你最后的更改是如何影响代码质量的。你是否引入了以前不存在的新问题？


    所有这些事情——广泛的测试、集成和代码质量检查——都可以外包给专用机器：持续集成服务器。其后的原理非常简单：对于提交到版本控制的每一次提交，专用服务器都会取所有代码，执行所有测试并构建一个完全集成的可执行文件。它运行质量检查并将结果与提交进行比较，从而为质量建立一条时间线。这里有很多不同的工具可以可以使用。在你自己的服务器上，你可以安装
    `Jenkins`，它是 Java 世界最流行的持续集成系统之一。它可以运行你的测试，并且有很多用于质量检查的插件。但你也可以使用专用的质量分析服务器。在这里，市场领导者是
    `Sonarube`，你可以自行托管，或使用他们的云解决方案。最后一点很有趣。许多你可以用于测试和质量分析的云服务，例如 `Travis CI` 或 `Codacy`。如果你的代码是开源的，它们非常方便。


    ## 准备并发布到生产环境


    生产环境改变一切。你的客户将以许多未经测试的方式使用你的软件，导致你会遇到慢请求、错误和意外行为。为了修复这些问题，你需要关于产生这些问题的洞察。因此，为这些做准备至关重要。


    这种准备的一部分是实施日志、指标、仪表板和告警形式的监控。首先，你应该`优先使用日志而非控制输出`，我们稍后会详细解释。接下来，你应该设置一个所有日志都去往的中心位置。如果日志是可以搜索的，并且你可以对其进行分析、计算指标并在仪表板中可视化，那就完美了。然后，你可能推导出关键的洞察和阈值，例如过去
    24 小时内放置的订单数量。如果此类指标低于目标阈值，你可能希望告警能够使该指标恢复的人。对于这类事情，我们可以推荐 `Open Source Elastic
    Stack` 和 `Graylog`。

    '
- fmt: "\nErrors and exceptions in production deserve our special attention. They’re\
    \ neon signs for bugs in the code and holes in the tests, which makes their stack\
    \ traces and context information really valuable. That’s why it’s important to\
    \ collect and track any exceptions that have occurred automatically. And don’t\
    \ forget the front end if you’re building desktop, mobile, or single-page applications—a\
    \ lot of exceptions happen there. We recommend Airbrake for the back end and Sentry\
    \ for the front end.\n\nBut even if you’re prepared for production, there’s another\
    \ issue: How long does it take you to put a change of a single line of code into\
    \ production? Can you answer that question for your current project? The longer\
    \ the time to production is, the harder it is to fix something quickly, roll back\
    \ a change, or ship a new feature that’s ready. Continuous-integration systems\
    \ are your friend here. Most of them can be configured to not only build a fully\
    \ integrated system, but also to deploy it into a production environment.\n\n\
    Of course, we can’t cover a full release strategy in this section, but if you\
    \ want to know more, there’s an excellent book dedicated to the topic: *Release\
    \ It!*\n\n## Favor Logging Over Console Output\n\n```java\nclass LaunchChecklist\
    \ {\n    List<String> checks = Arrays.asList(\"Cabin Pressure\", \"Communication\"\
    , \"Engine\");\n\n    Status prepareAscend(Commander commander) {\n        System.out.println(\"\
    Prepare ascend\");\n        for (String check : checks) {\n            if (commander.isFailing(check))\
    \ {\n                System.out.println(check + \" ... FAILURE\");\n         \
    \       System.err.println(\"Abort take off\");\n                return Status.ABORT_TAKE_OFF;\n\
    \            }\n            System.out.println(check + \" ... OK\");\n       \
    \ }\n        System.out.println(\"Read for take off\");\n        return Status.READY_FOR_TAKE_OFF;\n\
    \    }\n}\n```\n\nWhen you’re lucky, you can find errors in your code just by\
    \ looking at it. But oftentimes, this isn’t enough and you have to run the code\
    \ and investigate the memory to spot a bug. Within the development environment,\
    \ you’ll usually have a debugging mode you can use to halt the execution and look\
    \ at the memory. But this doesn’t work anymore when you’ve delivered the program\
    \ to the production environment. In that case, you need meaningful output.\n\n\
    In the code above, we get an insight into the state of the program through calls\
    \ to `System.out.println()` and `System.err.println()`. Errors go to `System.err`\
    \ and all other information to `System.out`. With that separation, the code already\
    \ provides all information we could possibly need, doesn’t it?\n\nWell, certainly\
    \ not. We actually miss out on a lot. We don’t know:\n\n* at what time a statement\
    \ is printed\n* the number of the line of code that does the printing\n* the value\
    \ of the method parameter\n* if all printed statements are equally important\n\
    \nAnd there’s more. All statements go to the console, so we can’t write a subset\
    \ of the statements to a file and send the important ones via email to the people\
    \ who need to know. Last but not least, string concatenation is expensive, and\
    \ we do it all the time in the code above, even if we are not really interested\
    \ in them.\n\nThe solution to this problem is to use a proper logging framework:\n\
    \n```java\nclass LaunchChecklist {\n    private static final Logger LOGGER = LogManager.getLogger(LaunchChecklist.class);\n\
    \n    List<String> checks = Arrays.asList(\"Cabin Pressure\", \"Communication\"\
    , \"Engine\");\n\n    Status prepareAscend(Commander commander) {\n        LOGGER.info(\"\
    {}: Prepare ascend\", commander);\n        LOGGER.debug(\"{} Checks: {}\",\",\
    \ checks.size(), checks);\n        for (String check : checks) {\n           \
    \ if (commander.isFailing(check)) {\n                LOGGER.warn(\"{}: {} ...\
    \ FAILURE\", commander, check);\n                LOGGER.error(\"{}: Abort take\
    \ off!\", commander);\n                return Status.ABORT_TAKE_OFF;\n       \
    \     }\n            LOGGER.info(\"{}: {} ... OK\", commander, check);\n     \
    \   }\n        LOGGER.info(\"{}: Read for take off!\", commander);\n        return\
    \ Status.READY_FOR_TAKE_OFF;\n    }\n}\n```\n\nThere are many logging frameworks\
    \ for Java and a lot of opinionated discussion about them. From what we know,\
    \ Log4j is one of the most widely used, and that’s why we use it here. With Log4j,\
    \ you can use an internal `Logger` that writes class-specific messages based on\
    \ a program-wide configuration.\n\nA logger automatically writes a lot more information,\
    \ which makes it easier to trace down bugs. It will log the time when it executes\
    \ a statement and also the line of code. It’s also fairly easy to write all context\
    \ information through parameters for the statement.\n\nWe can configure the logging\
    \ framework so that some log statements are stored in files, some are sent over\
    \ the network, and some are even printed to the console. What’s more, we can use\
    \ log levels to mark the severity of a message—for example, debug, info, warn,\
    \ error, or fatal—by calling the right method. At runtime, we can configure the\
    \ logger to log only important messages and skip the rest. Not writing out all\
    \ debug messages can make for a huge performance improvement. To sum up, there’s\
    \ no real downside to using a logging framework apart from adding another library\
    \ to the build. That’s why you’re guaranteed to use them in any productive application.\n\
    \n## Minimize and Isolate Multithreaded Code\n\nSo far in this chapter, we’ve\
    \ given you hints on how to streamline your development toward a production environment.\
    \ But of course, you’ll also have to make sure that your program performs in production.\
    \ The key to that is concurrency, leveraging the multicore capabilities of today’s\
    \ machines. That’s something we’ve hardly touched upon so far, essentially because\
    \ it would double the size of the book. Nevertheless, we’ll give you a few basic\
    \ hints and pointers to further sources in the following pages.\n\nConcurrency\
    \ isn’t easy to grasp, and it’s even harder to code correctly. Bugs in concurrent\
    \ software can result in huge problems and even loss of life, according to *An\
    \ Investigation of the Therac-25 Accidents*. And the bad news continue: tests\
    \ and static analysis are notoriously bad at ensuring the correctness of concurrent\
    \ code. Although costly, manual code reviews are usually a better choice.\n\n\
    So what can you do in this situation? Well, first of all, avoid premature optimization\
    \ and multithreaded code until you have a good reason for it, like terrible results\
    \ from a performance benchmark. Your first guess should be that a sequential solution\
    \ is fast enough. Only after you measure your code and it’s too slow should you\
    \ go for multithreading.\n\nBut if you write concurrent code, you should take\
    \ care to structure your program well. We recommend that you keep multithreaded\
    \ code as isolated as possible—limited to few packages in your code base, for\
    \ example—and to document it thoroughly.\n\nOn top of that, you should *Favor\
    \ Immutable Over Mutable State* as far as this is possible. Mutable data is prone\
    \ to concurrency bugs, such as race conditions or lost updates. The less mutable\
    \ data you use, the smaller the chance for these bugs.\n\nThat’s why you should\
    \ document concurrent access to mutable data in your code, especially how this\
    \ data is protected from concurrency bugs. We recommend that you use the JCIP\
    \ Annotations stemming from the famous book *Java Concurrency in Practice*, which\
    \ also explains all the nitty-gritty details of concurrency in Java.\n\n## Use\
    \ High-Level Concurrency Abstractions\n"
  raw: 'Errors and exceptions in production deserve our special attention. They’re
    neon signs for bugs in the code and holes in the tests, which makes their stack
    traces and context information really valuable. That’s why it’s important to collect
    and track any exceptions that have occurred automatically. And don’t forget the
    front end if you’re building desktop, mobile, or single-page applications—a lot
    of exceptions happen there. We recommend Airbrake^([[66]](#f_0105.xhtml_FOOTNOTE-66))
    for the back end and Sentry^([[67]](#f_0105.xhtml_FOOTNOTE-67)) for the front
    end.


    But even if you’re prepared for production, there’s another issue: How long does
    it take you to put a change of a single line of code into production? Can you
    answer that question for your current project? The longer the time to production
    is, the harder it is to fix something quickly, roll back a change, or ship a new
    feature that’s ready. Continuous integration systems are your friend here. Most
    of them can be configured to not only build a fully integrated system, but also
    to deploy it into a production environment.


    Of course, we can’t cover a full release strategy in this section, but if you
    want to know more, there’s an excellent book dedicated to the topic: [*Release
    It!* [Nyg18]](#f_0106.xhtml_d2831e429).


    ## Favor Logging Over Console Output


    |   | **class** LaunchChecklist { |


    |   |  |


    |   | List<String> checks = Arrays.asList(*"Cabin Pressure"*, |


    |   | *"Communication"*, |


    |   | *"Engine"*); |


    |   |  |


    |   | Status prepareAscend(Commander commander) { |


    | » | System.out.println(*"Prepare ascend"*); |


    |   | **for** (String check : checks) { |


    |   | **if** (commander.isFailing(check)) { |


    | » | System.out.println(check + *" ... FAILURE"*); |


    | » | System.err.println(*"Abort take off"*); |


    |   | **return** Status.ABORT_TAKE_OFF; |


    |   | } |


    | » | System.out.println(check + *" ... OK"*); |


    |   | } |


    | » | System.out.println(*"Read for take off"*); |


    |   | **return** Status.READY_FOR_TAKE_OFF; |


    |   | } |


    |   | } |


    When you’re lucky, you can find errors in your code just by looking at it. But
    oftentimes, this isn’t enough and you have to run the code and investigate the
    memory to spot a bug. Within the development environment, you’ll usually have
    a debugging mode you can use to halt the execution and look at the memory. But
    this doesn’t work anymore when you’ve delivered the program to the production
    environment. In that case, you need meaningful output.


    In the code above, we get an insight into the state of the program through calls
    to System.out.println() and System.err.println(). Errors go to System.err and
    all other information to System.out. With that separation, the code already provides
    all information we could possibly need, doesn’t it?


    Well, certainly not. We actually miss out on a lot. We don’t know:


    *   at what time a statement is printed


    *   the number of the line of code that does the printing


    *   the value of the method parameter


    *   if all printed statements are equally important


    And there’s more. All statements go to the console, so we can’t write a subset
    of the statements to a file and send the important ones via email to the people
    who need to know. Last but not least, string concatenation is expensive, and we
    do it all the time in the code above, even if we are not really interested in them.


    The solution to this problem is to use a proper logging framework:


    |   | **class** LaunchChecklist { |


    |   |  |


    | » | **private** **static** **final** Logger LOGGER = |


    | » | LogManager.getLogger(LaunchChecklist.class); |


    |   |  |


    |   | List<String> checks = Arrays.asList(*"Cabin Pressure"*, |


    |   | *"Communication"*, |


    |   | *"Engine"*); |


    |   |  |


    |   | Status prepareAscend(Commander commander) { |


    | » | LOGGER.info(*"{}: Prepare ascend"*, commander); |


    | » | LOGGER.debug(*"{} Checks: {}"*, checks.size(), checks); |


    |   | **for** (String check : checks) { |


    |   | **if** (commander.isFailing(check)) { |


    | » | LOGGER.warn(*"{}: {} ... FAILURE"*, commander, check); |


    | » | LOGGER.error(*"{}: Abort take off!"*, commander); |


    |   | **return** Status.ABORT_TAKE_OFF; |


    |   | } |


    | » | LOGGER.info(*"{}: {} ... OK"*, commander, check); |


    |   | } |


    | » | LOGGER.info(*"{}: Read for take off!"*, commander); |


    |   | **return** Status.READY_FOR_TAKE_OFF; |


    |   | } |


    |   | } |


    There are many logging frameworks for Java and a lot of opinionated discussion
    about them. From what we know, Log4j^([[68]](#f_0105.xhtml_FOOTNOTE-68)) is one
    of the most widely used, and that’s why we use it here. With Log4j, you can use
    an internal Logger that writes class-specific messages based on a program-wide
    configuration.


    A logger automatically writes a lot more information, which makes it easier to
    trace down bugs. It will log the time when it executes a statement and also the
    line of code. It’s also fairly easy to write all context information through parameters
    for the statement.


    We can configure the logging framework so that some log statements are stored
    in files, some are sent over the network, and some are even printed to the console.
    What’s more, we can use log levels to mark the severity of a message—for example,
    debug, info, warn, error, or fatal—by calling the right method. At runtime, we
    can configure the logger to log only important messages and skip the rest. Not
    writing out all debug messages can make for a huge performance improvement. To
    sum up, there’s no real downside to using a logging framework apart from adding
    another library to the build. That’s why you’re guaranteed to use them in any
    productive application.


    ## Minimize and Isolate Multithreaded Code


    So far in this chapter, we’ve given you hints on how to streamline your development
    toward a production environment. But of course, you’ll also have to make sure
    that your program performs in production. The key to that is concurrency, leveraging
    the multicore capabilities of today’s machines. That’s something we’ve hardly
    touched upon so far, essentially because it would double the size of the book.
    Nevertheless, we’ll give you a few basic hints and pointers to further sources
    in the following pages.


    Concurrency isn’t easy to grasp, and it’s even harder to code correctly. Bugs
    in concurrent software can result in huge problems and even loss of life, according
    to [*An Investigation of the Therac-25 Accidents* [LT93]](#f_0106.xhtml_d2831e320).
    And the bad news continue: tests and static analysis are notoriously bad at ensuring
    the correctness of concurrent code. Although costly, manual code reviews are usually
    a better choice.


    So what can you do in this situation? Well, first of all, avoid premature optimization
    and multithreaded code until you have a good reason for it, like terrible results
    from a performance benchmark. Your first guess should be that a sequential solution
    is fast enough. Only after you measure your code and it’s too slow should you
    go for multithreading.


    But if you write concurrent code, you should take care to structure your program
    well. We recommend that you keep multithreaded code as isolated as possible—limited
    to few packages in your code base, for example—and to document it thoroughly.


    On top of that, you should [*Favor Immutable Over Mutable State*](#f_0078.xhtml_sec.favor_immutable_over_mutable_state)
    as far as this is possible. Mutable data is prone to concurrency bugs, such as
    race conditions or lost updates. The less mutable data you use, the smaller the
    chance for these bugs.


    That’s why you should document concurrent access to mutable data in your code,
    especially how this data is protected from concurrency bugs. We recommend that
    you use the JCIP Annotations^([[69]](#f_0105.xhtml_FOOTNOTE-69)) stemming from
    the famous book [*Java Concurrency in Practice* [Goe06]](#f_0106.xhtml_d2831e199),
    which also explains all the nitty-gritty details of concurrency in Java.


    ## Use High-Level Concurrency Abstractions'
