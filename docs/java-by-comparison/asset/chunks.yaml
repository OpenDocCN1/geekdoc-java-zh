  trans: "\n\n```java\nDistance expectedDistance = new Distance(DistanceUnit.KILOMETERS,\
    \ kilometers);\nDistance actualDistance = expectedDistance\n    .convertTo(DistanceUnit.MILES)\n\
    \    .convertTo(DistanceUnit.KILOMETERS);\nAssertions.assertEquals(expectedDistance,\
    \ actualDistance);\n```\n\n有时，你需要以相同的方式测试一个方法或方法链，但使用许多不同的输入参数。这时，你想确保该方法在很大的范围内范围内工作。在测试方法中列举参数很容易的（如上面的代码所示），但这会使测试变得复杂。\n\
    \n上面的方法测试了你可以在距离值之间回转换并获得相同的结果。你能发现这个方法中的问题吗？乍一看，它看起来整洁且易读。私有方法 `assertRoundTrip()`\
    \ 也符合我们的“给定-当-那么”（given-when-then）结构。\n\n考虑一下测试执行。如果第一个断言（调用 `assertRoundTrip(1)`）已经失败了会怎样？在这种情况下，JUnit\
    \ 会将整个测试标记为失败，并跳过整数 1000 和 9999999 的另外两个断言。你必须修复导致 `assertRoundTrip(1)` 失败的错误，重新运行测试，结果发现现在第二个断言\
    \ `assertRoundTrip(1000)` 也失败了。换句话说，断言隐藏了上面代码后续的断言。\n\n你无法通过测试方法中使用遍历参数集的 `for`\
    \ 循环来解决这个问题。唯一的解决方案是为每个参数执行不同的测试，并在每个测试中使用一个断言。添加新的测试方法很容易，但如果你在这里需要对三十个不同的整数进行测试呢？这将导致大量的重复。\n\
    \n幸运的是，JUnit 恰好为这种情况提供了特殊的断言：\n\n```java\nclass DistanceConversionTest {\n\n \
    \   @ParameterizedTest(name = \"#{index}: {0}km == {0}km->mi->km\")\n    @ValueSource(ints\
    \ = {1, 1_000, 9_999_999})\n    void testConversionRoundTrip(int kilometers) {\n\
    \        Distance expectedDistance = new Distance(DistanceUnit.KILOMETERS, kilometers);\n\
    \        Distance actualDistance = expectedDistance\n            .convertTo(DistanceUnit.MILES)\n\
    \            .convertTo(DistanceUnit.KILOMETERS);\n        Assertions.assertEquals(expectedDistance,\
    \ actualDistance);\n    }\n}\n```\n\n这里的解决方案是由带有 `@ParameterizedTest` 和 `@ValueSource`\
    \ 注解的参数化测试组成的。它们允许我们将参数（即输入和预期输出）与实际测试代码分离。执行时，JUnit 会为每个参数运行单独的测试。\n\n我们在 `@ValueSource(ints\
    \ = { ... })` 注解中将参数声明为整数数组。在这里，由于测试的往返性质，我们很幸运输入匹配了预期输出。有时，你只期望不抛出异常（参见 让 JUnit\
    \ 处理异常）。\n\n我们在这里还应用了描述你的测试，在 `@ParameterizedTest(name = \"\")` 内部使用了 `name` 变量。变量\
    \ `{index}` 指测试的索引，我们也可以用大括号引用测试方法的参数。`{0}` 代表第一个，在这种情况下也是唯一的。这样，我们的测试描述就像是整个测试的压缩形式。\n\
    \n你可以从不同的源注入参数，例如 CSV 文件、方法的返回值，或像我们做的那样显式地在代码中指定。根据经验，如果你只有几个参数，最好显式地声明它们。如果数量非常大，CSV\
    \ 文件或方法返回值更好。\n\n参数化测试只是开始。自动生成输入和预期输出的基于属性的测试库（如 `junit-quickcheck`^40）是下一步。通过这种技术，很容易覆盖很大范围的参数，而无需在代码中维护大量的参数列表。\n\
    \n## 覆盖边界情况\n\n```java\nclass TransmissionParserTest {\n\n    @Test\n    void\
    \ testValidTransmission() {\n        TransmissionParser parser = new TransmissionParser();\n\
    \        Transmission transmission = parser.parse(\"032Houston, UFO sighted!\"\
    );\n        Assertions.assertEquals(32, transmission.getId());\n        Assertions.assertEquals(\"\
    Houston, UFO sighted!\", transmission.getContent());\n    }\n}\n```\n\n在完美的世界里，你应该为每个可能的输入参数测试你的代码。但大多数时候，你根本做不到。仅仅一个简单的\
    \ 32 位整数就需要 2³² 次测试。那超过了 40 亿次！与其测试每一种可能性，不如覆盖正常执行路径和最可能出错的设置。换句话说，你应该覆盖边界情况。\n\
    \n上面的代码包含一个测试。它是对正常路径的测试——即有效输入（String 消息）产生典型输出（非空 Transmission）的场景。但如果输入的 String\
    \ 不是正规的呢？\n\n- `null`（空引用）\n- `\"\"`（空字符串）\n- `\" \"`（仅包含空白字符的字符串）\n- 或 `\"a\\\
    nt͡ ɬɪŋɑn\\nb\"`（包含特殊非英语字符的字符串）\n\n你可以测试许多不同版本的正规输入，但上述情况通常更容易发现你系统中的错误。边界情况对于特定的代码具有高度的特殊性，但通常你至少应该尝试参数的边界。你上面已经看了\
    \ String，这里是一些例子：\n\n- `int`: `0`, `1`, `-1`, `Integer.MAX_VALUE`, `Integer.MIN_VALUE`\n\
    - `double`: `0`, `1.0`, `-1.0`, `Double.MAX_VALUE`, `Double.MIN_VALUE`\n- `Object[]`:\
    \ `null`, `{}`, `{null}`\n- `List<Object>`: `null`, `Collections.emptyList()`,\
    \ `Collections.singletonList(null)`, `Arrays.asList(new Object(), null)`\n\n这很多，但不是全部。例如，电子邮件地址或上传的照片的边界情况是什么？在我们上面的例子中，哪些字符串是边界情况？让我们来看看这里应该覆盖哪些边界情况：\n\
    \n```java\nclass TransmissionParserTest {\n\n    @Test\n    void testValidTransmission()\
    \ {\n        TransmissionParser parser = new TransmissionParser();\n        Transmission\
    \ transmission = parser.parse(\"032Houston, UFO sighted!\");\n        Assertions.assertEquals(32,\
    \ transmission.getId());\n        Assertions.assertEquals(\"Houston, UFO sighted!\"\
    , transmission.getContent());\n    }\n\n    @Test\n    void nullShouldThrowIllegalArgumentException()\
    \ {\n        Executable when = () -> new TransmissionParser().parse(null);\n \
    \       Assertions.assertEquals(IllegalArgumentException.class, when);\n    }\n\
    \n    @Test\n    void malformedTransmissionShouldThrowIllegalArgumentException()\
    \ {\n        Executable when = () -> new TransmissionParser().parse(\"t͡ɬɪŋɑn\"\
    );\n        Assertions.assertEquals(IllegalArgumentException.class, when);\n \
    \   }\n}\n```\n\n我们添加了两个新测试：一个 `null`，一个 `t͡ ɬɪŋɑn`。在这两种情况下，解析器都应该响应 `IllegalArgumentException`\
    \ 以表示输入无效。检查 `null` 是标准的边界情况，后果最严重。另一个测试涵盖了包含许多不同 Unicode 符号的输入，表示具有任意输入的错误字符串^41。\n\
    \n"
