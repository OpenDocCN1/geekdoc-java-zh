  trans: "\n\n用户手册旨在告诉您某物是如何工作的。代码中的注释也是同样的：它们的目的是告诉您某段代码是如何工作的。遗憾的是，代码注释往往像我们智能电视的说明书一样——毫无用处。例如，它们可能只是在重复代码中已经存在的内容。或者更糟——它们描述的内容与实际代码完全不符。\n\
    \n在本章中，你将学习如何让你的注释更有帮助性。在接下来的页面中，我们将帮助你更敏锐地判断何时该使用注释，何时该避免使用。我们将向你展示哪些是完全多余的注释类型，告诉你如何处理被注释掉的代码，并向你介绍一些可以用代码来替代注释的小技巧。最后，我们将探索\
    \ Java 的注释规范，这样你就能编写出高质量的 JavaDoc 注释。让我们开始吧。\n\n## 删除多余的注释\n\n```java\nclass Inventory\
    \ {\n    // Fields（我们只有一个）\n    List<Supply> supplies = new ArrayList<>(); //\
    \ 物资列表。\n\n    // Methods\n    int countContaminatedSupplies() {\n        // TODO:\
    \ 检查字段是否已初始化（非空）\n        int contaminatedCounter = 0; // 计数器\n        // 没有物资\
    \ => 没有污染\n        for (Supply supply : supplies) { // 开始 FOR\n            if\
    \ (supply.isContaminated()) {\n                contaminatedCounter++; // 计数器加\
    \ 1！\n            } // 结束 IF 已污染\n        } // 结束 FOR\n\n        // 返回污染物资的数量。\n\
    \        return contaminatedCounter; // 小心处理！\n    }\n} // Inventory 类结束\n```\n\
    \n你可能听过注释非常重要的说法。它们确实很重要，但仅限于当它们添加了重要信息（“为什么”）时如此。如果没有，那么它们就只是在碍事。\n\n上面的代码展示了你之前见过的\
    \ `Inventory` 类。正如你从绿色文本的数量中所看到的，它包含了大量的注释。如果你只是扫一眼代码，可能会认为它的文档写得很好。代码质量工具也会在注释方面将这段代码标记为“良好”。但这仅仅是表面。\n\
    \n这些注释大部分都是多余的，因为它们只是在重复代码所表达的内容。两个注释标明了 `Fields`（字段）或 `Methods`（方法），但这从 Java\
    \ 的语法中已经显而易见。其他几个注释是为了标记代码的结束，例如 `End IF`、`End FOR` 或 `End Inventory class`。这从缩进中已经很清楚了。\n\
    \n最关键的注释可能是这一个：`TODO: check if field is already initialized (not null)`。在这里，注释确实偏离了代码，这表明存在实际的问题。\n\
    \n我们可以让它变得简洁得多！考虑一下这个：\n\n```java\nclass Inventory {\n    List<Supply> supplies\
    \ = new ArrayList<>();\n\n    int countContaminatedSupplies() {\n        if (supplies\
    \ == null || supplies.isEmpty()) {\n            // 没有物资 => 没有污染\n            return\
    \ 0;\n        }\n\n        int contaminatedCounter = 0;\n        for (Supply supply\
    \ : supplies) {\n            if (supply.isContaminated()) {\n                contaminatedCounter++;\n\
    \            }\n        }\n\n        return contaminatedCounter;\n    }\n}\n```\n\
    \n我们对代码的很少，但几乎没有剩下绿色文本了。\n\n首先，我们删除了所有直接从某行代码就能读出来的注释。所有标记代码块结束的注释（`End IF`、`End\
    \ FOR` 等）都消失了。缩进已经告诉了我们这一点，但你会惊讶地发现，这些注释不仅出现在遗留代码中，也出现在著名的库中。\n\n我们对所有凸显类结构的注释（`Fields`、`Methods`、`Returns`）也做了同样的处理。如果你遵循\
    \ Java 代码设定的类结构，那么就不需要这种指示标记。\n\n接下来，我们删除了所有只是转述代码的注释，例如 `contaminatedCounter++;\
    \ // increment counter`。如果一个注释没有在代码的基础上增加任何内容，那么留它就没有意义。\n\n我们还修复了 `TODO` 注释，并代之增加了\
    \ `null` 和 `isEmpty()` 检查。如果你无法修复 `TODO`，请在你的问题跟踪器中创建一个 issue（事项），在那里你可以讨论并跟踪该问题，直到它被修复。\n\
    \n我们唯一保留的注释是添加了代码中显而易见的信息。在 `supplies` 为 `null` 或空的情况下，我们选择通过返回零来优雅地继续。我们本可以抛出异常，所以包含这条注释是有理由的。你可以说记录了一个设计决策。\n\
    \n## 删除被注释的代码\n\n```java\nclass LaunchChecklist {\n    List<String> checks = Arrays.asList(\n\
    \        \"Cabin Leak\",\n        // Communication, 我们真的想和休斯顿通话吗？\n        \"\
    Engine\",\n        \"Hull\",\n        // Rover, 我觉得我们不需要它...\n        \"OxygenTank\"\
    \n        // Supplies\n    );\n\n    Status prepareLaunch(Commander commander)\
    \ {\n        for (String check : checks) {\n            boolean shouldAbortTakeoff\
    \ = commander.failing(check);\n            if (shouldAbortTakeoff) {\n       \
    \         //System.out.println(\"REASON FOR ABORT: \" + item);\n             \
    \   return Status.ABORT_TAKE_OFF;\n            }\n        }\n        return Status.READY_FOR_OFF;\n\
    \    }\n}\n```\n\n在任何大型代码中，你都能发现被注释掉的代码段。这些类型的注释完全是杂质。\n\n在例子中，你看到了 `LaunchChecklist`。多个列表项被注释掉了。甚至附加在这些项上的注释也被注释掉了。这对于我们来说有点太过了。\n\
    \n除了列表项之外，`prepareLaunch()` 方法包含一个被注释掉的打印语句。如果你仔细观察，你会发现打印语句访问了未声明的变量 `item`——这阻止了你简单地取消注释。\n\
    \n被注释的代码是一个巨大的问题。与普通注释不同，它们并不是为了澄清任何事情。相反，它们增加了代码负担，只会增加困惑。程序员注释掉代码是因为这阻止了功能的实现。他们专注于其他方面，而注释给他们提供了一个方便的退路。有些人还担心丢失可能需要的代码，因此倾向于将它们注释掉。\n\
    \n你可能对这种解决方案感到意外：\n\n```java\nclass LaunchChecklist {\n    List<String> checks\
    \ = Arrays.asList(\n        \"Cabin Leak\",\n        \"Engine\",\n        \"Hull\"\
    ,\n        \"OxygenTank\"\n    );\n\n    Status prepareLaunch(Commander commander)\
    \ {\n        for (String check : checks) {\n            boolean shouldAbortTakeoff\
    \ = commander.failing(check);\n            if (shouldAbortTakeoff) {\n       \
    \         return Status.ABORT_TAKE_OFF;\n            }\n        }\n        return\
    \ Status.READY_FOR_OFF;\n    }\n}\n```\n\n幸运的是，被注释的代码很容易处理：直接删掉即可。\n\n"
- fmt: "\nToday, virtually every professional project is hosted on a version control\
    \ system. This system tracks every change in the code, including code removal.\
    \ You can easily inspect changes and go back in time if you’re looking for certain\
    \ parts of code. In our projects, we literally never experienced a situation where\
    \ a developer wanted to uncomment commented-out code. Instead, they all tried\
    \ to remove it.\n\nTo sum up, it’s really a no-brainer to remove commented-out\
    \ code—it’s only harmful to understandability, and you can’t actually lose it\
    \ when you use a version control system (although you probably won’t try to find\
    \ that commented-out code again).\n\n# Version Control Systems\n\nAlthough there\
    \ are many version control systems, nowadays you will probably need only one:\
    \ `Git`. It’s blazing fast and you can get free public and sometimes even free\
    \ private repositories from many providers such as [http://github.com](http://github.com),\
    \ [http://gitlab.com](http://gitlab.com), or [http://bitbucket.org](http://bitbucket.org).\n\
    \n# Replace Comments with Constants\n\n```java\nenum SmallDistanceUnit {\n   \
    \ CENTIMETER,\n    INCH;\n\n    double getConversionRate(SmallDistanceUnit unit)\
    \ {\n        if (this == unit) {\n            return 1; // identity conversion\
    \ rate\n        }\n        if (this == CENTIMETER && unit == INCH) {\n       \
    \     return 0.393701; // one centimeter in inch\n        } else {\n         \
    \   return 2.54; // one inch in centimeters\n        }\n    }\n}\n```\n\nComments\
    \ are there to explain the code. But it’s even better if the code speaks for itself!\n\
    \nIn this example, you see a unit conversion. It’s very similar to what you’ve\
    \ seen in [*Group with New Lines*](#f_0028.xhtml_sec.group_with_new_lines), just\
    \ for small instead of large distances. The method `getConversionRate()` returns\
    \ a conversion rate number. For each number, there’s a comment that explains what\
    \ the number is supposed to mean. The first one’s the identity conversion, and\
    \ the other two convert from centimeters to inches and the other way around.\n\
    \nWithout the comments, the numbers would be magic numbers, which you’ve seen\
    \ in [*Replace Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant).\
    \ Here, the comments take out the “magic” and give a meaning to the numbers.\n\
    \nThat’s a good start. After all, it’s clearly beneficial that the comments are\
    \ there. But there’s a way we can make the code more meaningful on its own.\n\n\
    Consider the solution here:\n\n```java\nenum SmallDistanceUnit {\n    CENTIMETER,\n\
    \    INCH;\n\n    static final double INCH_IN_CENTIMETERS = 2.54;\n    static\
    \ final double CENTIMETER_IN_INCHES = 1 / INCH_IN_CENTIMETERS;\n    static final\
    \ int IDENTITY = 1;\n\n    double getConversionRate(SmallDistanceUnit unit) {\n\
    \        if (this == unit) {\n            return IDENTITY;\n        }\n      \
    \  if (this == CENTIMETER && unit == INCH) {\n            return CENTIMETER_IN_INCHES;\n\
    \        } else {\n            return INCH_IN_CENTIMETERS;\n        }\n    }\n\
    }\n```\n\nWe’ve own applied [*Replace Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant)\
    \ here. While we did so, we removed the comments and merged them into the names\
    \ of the constants. So in a way, we’ve “embedded” the comments into the code.\n\
    \nThe code is much more self-explanatory. There’s more of it now since we’ve added\
    \ several constants. The benefit of these constants is that they explain their\
    \ meaning in their names. That’s why there’s no longer any need for additional\
    \ explanation with comments: the comments have turned into actual code.\n\nComments\
    \ always have a risk of becoming stale. Programmers rarely apply the same rigor\
    \ to comments as they do to code. Someone might change the code but ignore the\
    \ comment, or they might add a new conversion rate without documenting it.\n\n\
    If you capture the explanation of the code in things like naming, then it’s less\
    \ likely that people will ignore it when they change code. As a rule of thumb,\
    \ whenever you can merge a comment into the name of a constant, variable, go for\
    \ it.\n\n# Replace Comments with Methods\n\n```java\nclass FuelSystem {\n    List<Double>\
    \ tanks = new ArrayList<>();\n\n    int getAverageFilling() {\n        double\
    \ sum = 0;\n        for (double tankFilling : tanks) {\n            sum += tankFilling;\n\
    \        }\n        double averageFuel = sum / tanks.size();\n        return roundToPercent(averageFuel);\n\
    \    }\n\n    static int roundToPercent(double value) {\n        return Math.round(value\
    \ * 100);\n    }\n}\n```\n\nYou get several advantages from a utility method compared\
    \ to a comment or an additional variable.\n\nFirst, the method gets rid of the\
    \ comment because it says in its name what the code does. That’s also what you\
    \ would get from a variable. But there are even more advantages.\n\nSecond, you\
    \ don’t need additional lines in the first method. Instead, you now have two methods.\
    \ Each of them is a little shorter, which makes them easier to understand on own.\n\
    \nThird, the new method can be reused by other methods. Even if that’s not the\
    \ case now, you’ve made the code a little modular this way.\n\nFourth, you get\
    \ a hierarchy of methods: the top-level method `getAverageFilling()` calls the\
    \ lower-level method `roundToPercent()`. This improves the understandability of\
    \ the higher-level method.\n\nIdeally, each method consists of a series of named\
    \ statements on a similar level of abstraction. To make this work, we could also\
    \ extract the code that calculates the average into another utility method. Then\
    \ we’d have three methods that all work on the same level.\n\n# Document Implementation\
    \ Decisions\n\n```java\nclass Inventory {\n    private List<Supply> list = new\
    \ ArrayList<>();\n\n    void add(Supply supply) {\n        list.add(supply);\n\
    \        Collections.sort(list);\n    }\n\n    boolean isInStock(String name)\
    \ {\n        // fast implementation\n    }\n}\n```\n"
  raw: 'Today, virtually every professional project is hosted on a version control
    system. This system tracks every change in the code, including code removal. You
    can easily inspect changes and go back in time if you’re looking for certain parts
    of code. In our projects, we literally never experienced a situation where a developer
    wanted to uncomment commented-out code. Instead, they all tried to remove it.


    To sum up, it’s really a no-brainer to remove commented-out code—it’s only harmful
    to understandability, and you can’t actually lose it when you use a version control
    system (although you probably won’t try to find that commented-out code again).


    Version Control Systems


    Although there are many version control systems, nowadays you will probably need
    only one: Git. It’s blazing fast and you can get free public and sometimes even
    free private repositories from many providers such as [http://github.com](http://github.com),
    [http://gitlab.com](http://gitlab.com), or [http://bitbucket.org](http://bitbucket.org).


    ## Replace Comments with Constants


    |   | **enum** SmallDistanceUnit { |


    |   |  |


    |   | CENTIMETER, |


    |   | INCH; |


    |   |  |


    |   | **double** getConversionRate(SmallDistanceUnit unit) { |


    |   | **if** (**this** == unit) { |


    | » | **return** 1; *// identity conversion rate* |


    |   | } |


    |   |  |


    |   | **if** (**this** == CENTIMETER && unit == INCH) { |


    | » | **return** 0.393701; *// one centimeter in inch* |


    |   | } **else** { |


    | » | **return** 2.54; *// one inch in centimeters* |


    |   | } |


    |   | } |


    |   | } |


    Comments are there to explain the code. But it’s even better if the code speaks
    for itself!


    In this example, you see a unit conversion. It’s very similar to what you’ve seen
    in [*Group with New Lines*](#f_0028.xhtml_sec.group_with_new_lines), just for
    small instead of large distances. The method getConversionRate() returns a conversion
    rate number. For each number, there’s a comment that explains what the number
    is supposed to mean. The first one’s the identity conversion, and the other two
    convert from centimeters to inches and the other way around.


    Without the comments, the numbers would be magic numbers, which you’ve seen in
    [*Replace Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant).
    Here, the comments take out the “magic” and give a meaning to the numbers.


    That’s a good start. After all, it’s clearly beneficial that the comments are
    there. But there’s a way we can make the code more meaningful on its own.


    Consider the solution here:


    |   | **enum** SmallDistanceUnit { |


    |   |  |


    |   | CENTIMETER, |


    |   | INCH; |


    |   |  |


    | » | **static** **final** **double** INCH_IN_CENTIMETERS = 2.54; |


    | » | **static** **final** **double** CENTIMETER_IN_INCHES = 1 / INCH_IN_CENTIMETERS;
    |


    | » | **static** **final** **int** IDENTITY = 1; |


    |   |  |


    |   |  |


    |   | **double** getConversionRate(SmallDistanceUnit unit) { |


    |   | **if** (**this** == unit) { |


    |   | **return** IDENTITY; |


    |   | } |


    |   |  |


    |   | **if** (**this** == CENTIMETER && unit == INCH) { |


    |   | **return** CENTIMETER_IN_INCHES; |


    |   | } **else** { |


    |   | **return** INCH_IN_CENTIMETERS; |


    |   | } |


    |   | } |


    |   | } |


    We’ve basically applied [*Replace Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant)
    here. While we did so, we removed the comments and merged them into the names
    of the constants. So in a way, we’ve “embedded” the comments into the code.


    The code is much more self-explanatory. There’s more of it now since we’ve added
    several constants. The benefit of these constants is that they explain their meaning
    in their names. That’s why there’s no longer any need for additional explanation
    with comments: the comments have turned into actual code.


    Comments always have a risk of becoming stale. Programmers rarely apply the same
    rigor to comments as they do to code. Someone might change the code but ignore
    the comment, or they might add a new conversion rate without documenting it.


    If you capture the explanation of the code in things like naming, then it’s less
    likely that people will ignore it when they change code. As a rule of thumb, whenever
    you can merge a comment into the name of a constant, variable, field, or method,
    go for it!


    ## Replace Comments with Utility Methods


    |   | **class** FuelSystem { |


    |   |  |


    |   | List<Double> tanks = **new** ArrayList<>(); |


    |   |  |


    |   | **int** getAverageTankFillingPercent() { |


    |   | **double** sum = 0; |


    |   | **for** (**double** tankFilling : tanks) { |


    |   | sum += tankFilling; |


    |   | } |


    |   | **double** averageFuel = sum / tanks.size(); |


    | » | *// round to integer percent* |


    |   | **return** Math.toIntExact(Math.round(averageFuel * 100)); |


    |   | } |


    |   | } |


    Converting comments into constants is one tool that’s available to you. But what
    if things are more complicated? After all, not everything’s a fixed value.


    Here you can see code that calculates an average and manipulates its value before
    returning it. Can you immediately spot what the last statement is supposed to
    do? We’d say that the author was absolutely right to clarify the final line with
    a comment.


    From the previous pages, you can probably already guess that we don’t like the
    comment. But what to do about it?


    One alternative would be to create a named variable like this:


    | » | **int** roundedToPercent = Math.toIntExact(Math.round(averageFuel * 100));
    |


    |   | **return** roundedToPercent; |


    This clarifies the code and gets rid of the comment. But it adds another variable
    to the method, and that one is pretty redundant. After all, it’s returned right
    away.


    Let’s see if we can do better!


    The right way to go here is to introduce a utility method. Take a look:


    |   | **class** FuelSystem { |


    |   |  |


    |   | List<Double> tanks = **new** ArrayList<>(); |


    |   |  |


    |   | **int** getAverageTankFillingPercent() { |


    |   | **double** sum = 0; |


    |   | **for** (**double** tankFilling : tanks) { |


    |   | sum += tankFilling; |


    |   | } |


    |   | **double** averageFuel = sum / tanks.size(); |


    | » | **return** roundToIntegerPercent(averageFuel); |


    |   | } |


    |   |  |


    |   | **static** **int** roundToIntegerPercent(**double** value) { |


    |   | **return** Math.toIntExact(Math.round(value * 100)); |


    |   | } |


    |   | } |


    You get several advantages from a utility method compared to a comment or an additional
    variable.


    First, the method gets rid of the comment because it says in its name what the
    code does. That’s also what you would get from a variable. But there are even
    more advantages.


    Second, you don’t need additional lines in the first method. Instead, you now
    have two methods. Each of them is a little shorter, which makes them easier to
    understand on their own.


    Third, the new method can be reused by other methods. Even if that’s not the case
    right now, you’ve made the code a little more modular this way.


    Fourth, you get a hierarchy of methods: the top-level method getAverageTankFillingPercent()
    calls the lower-level method roundToIntegerPercent(). This improves the understandability
    of the higher-level method.


    Ideally, each method consists of a series of named statements on a similar level
    of abstraction. To make this work, we could also extract the code that calculates
    the average into another utility method. Then we’d have three methods that all
    work on the same level of indentation.


    To sum up, when you replace comments with utility methods, you don’t just get
    rid of a line of text—you can make your code more modular and balance abstraction
    levels.


    ## Document Implementation Decisions


    |   | **class** Inventory { |


    |   |  |


    |   | **private** List<Supply> list = **new** ArrayList<>(); |


    |   |  |


    |   | **void** add(Supply supply) { |


    |   | list.add(supply); |


    |   | Collections.sort(list); |


    |   | } |


    |   |  |


    |   | **boolean** isInStock(String name) { |


    | » | *// fast implementation* |'
