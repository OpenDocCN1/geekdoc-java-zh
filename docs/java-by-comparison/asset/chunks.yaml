  trans: "\n你学习编写的首批逻辑条件可能由整数和比较运算符组成，初学者可能会用同样的方式使用布尔值来实现条件。但这些比较是完全没有必要的——它们就像是你代码中的噪声。\n\
    \n在这里，你可以看到一个 `Laboratory` 组件的代码，它通过两个嵌套的 `if-else` 块中的条件来对 `Sample` 进行分析。\n\n\
    这段代码显式地将布尔值返回值与布尔原始类型类型（`true` 和 `false`）进行比较。这在初学者编写的代码中经常能发现的一种反模式。\n\n如果你使用布尔类型以外的数据类型构建逻辑条件（例如使用整数），你需要将它们与实际值进行比较（例如\
    \ `myNumber == 25`、`input > 0`）。但对于布尔变量或返回类型，你不需要这样做。\n\n相反，你已经有了布尔表达式可以操作了。没有必要将它们与布尔原始值类型进行比较。这些比较会让代码变得杂乱，并使阅读变得稍微困难。\n\
    \n大多数情况下，你会发现去掉这些不必要的比较是非常简单的。这不仅能减少代码量，还能让代码更易读。\n\n现在来看看去掉了这些比较后，这段代码有多么简单。\n\
    \n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result analyze(Sample\
    \ sample) {\n    if (microscope.isInorganic(sample)) {\n      return Result.INORGANIC;\n\
    \    } else {\n      return analyzeOrganic(sample);\n    }\n  }\n\n  private Result\
    \ analyzeOrganic(Sample sample) {\n    if (!microscope.isHumanoid(sample)) {\n\
    \      return Result.ALIEN;\n    } else {\n      return Result.HUMANOID;\n   \
    \ }\n  }\n}\n```\n\n在这里，我们删除了对布尔原始值的比较。在 `laboratory.isHumanoid(sample)` 的情况下，我们必须对表达式取反以保留语义。但除此之外，代码保持不变。你现在可以更轻松地阅读条件表达式了。\n\
    \n任何编译器都会自动执行这种删除。在实际执行方面，这两个代码片段之间可能没有区别。这里的收益完全在于代码的可读性。这只是某些简单代码中一个微小的修复，但想象一下你正在处理一个大型代码库——可读性的每一次小改进都有帮助！\n\
    \n考虑到避免否定，你可以进一步改进条件。请继续读下去！\n\n### 方法多次返回 vs 单次返回\n\n开发者投入了无数小时（读：浪费了小时）来讨论在方法内部使用单个\
    \ `return` 语句还是多个返回语句更好。这没有绝对的对错分。每个 `return` 语句都标记了方法的出口点。单一出口使得控制流更具结构化；你总是知道它会在哪里结束。但有时你想提前退出方法——例如，当输入参数无效时。在这里，我们使用多次返回是因为它需要的代码行更少——而且书的空间总是有限的。在你的代码中，尝试看看是否需要提前退出，如果需要，请使用多次返回。\n\
    \n## 避免否定\n\n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result\
    \ analyze(Sample sample) {\n    if (microscope.isInorganic(sample)) {\n      return\
    \ Result.INORGANIC;\n    } else {\n      return analyzeOrganic(sample);\n    }\n\
    \  }\n\n  private Result analyzeOrganic(Sample sample) {\n    if (!microscope.isHumanoid(sample))\
    \ {\n      return Result.ALIEN;\n    } else {\n      return Result.HUMANOID;\n\
    \    }\n  }\n}\n```\n\n有没有人告诉过你要“积极思考”？事实证明，代码中的正向表达式比否定表达式更好，因为它们通常更容易理解，且占据的空间略小。\n\
    \n这里显示的问题代码是 `Laboratory` 组件的另一个变体。它提供了两个接收 `Sample` 并返回 `Result` 的方法。这段代码没有明显的错误。它能实现其目的，但它比必要的要复杂。\n\
    \n考虑一下 `if` 语句的条件：两者都表达了一个否定条件。第一个测试样本是否 `isInorganic()`（是无机的）。第二个甚至使用了用于否定的布尔运算符：感叹号\
    \ `!`。\n\n在大多数情况下，当你阅读代码时，会发现正向表达式更容易理解。否定表达式增加了一层额外的间接层。与其说简单的“X 适用”，你必须理解一个额外的标记：“X\
    \ 不适用”。\n\n这个额外的标记通常是不必要的的。尽管这看起来像是一个微小的改动，但每一点微小的改进都有帮助。记住：每个人都喜欢没有否定。现在，看看这个简化后的版本：\n\
    \n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result analyze(Sample\
    \ sample) {\n    if (microscope.isOrganic(sample)) {\n      return analyzeOrganic(sample);\n\
    \    } else {\n      return Result.INORGANIC;\n    }\n  }\n\n  private Result\
    \ analyzeOrganic(Sample sample) {\n    if (microscope.isHumanoid(sample)) {\n\
    \      return Result.HUMANOID;\n    } else {\n      return Result.ALIEN;\n   \
    \ }\n  }\n}\n```\n\n我们只更改了代码，但这已经产生了影响。我们没有调用 `isInorganic()`，而是调用了 `isOrganic()`，它使用的是正向措辞而不是否定措辞。\n\
    \n然而，有时你需要适当的方法，比如在此处用 `isOrganic()` 而不是 `isInorganic()`。如果你调用的代码来自第三方库，你可能没有调用不同方法的选择。但如果你控制它，不要犹豫向相应的类中添加该方法——这几行代码是值得的，因为它们会让你的代码其他地方更加清晰。总而言之，这些变化非常简单，你可能会问：为什么要这么麻烦？根据我们的经验，最好的办法是去掉否定方法——没有必要维护两个相似的方法。\n\
    \n## 直接返回表达式\n\n```java\nclass Astronaut {\n  String name;\n  int missions;\n\n\
    \  boolean isValid() {\n    if (missions < 0 || name == null || name.trim().isEmpty())\
    \ {\n      return false;\n    } else {\n      return true;\n    }\n  }\n}\n```\n\
    \n接下来，让我们看看另一种减少代码中杂杂的方法。在这种情况下，我们不需要 `if` 语句来实现我们的目标。让我们找出原因。\n\n你在片段中看到了一个典型的验证方法。该方法检查对象的几个属性，一个整数和一个字符串。该整数属性指的是任务数量。这个数字不应该是负数。该字符串属性不应为空；否则我们可能会担心\
    \ `NullPointerException` 在某处导致执行崩溃。\n"
- fmt: "\nAdditionally, it should not be empty, because every Astronaut should have\
    \ an actual name. The call to `name.trim()` removes all kinds of preceding or\
    \ trailing space characters, such as white spaces or tabs. If there’s something\
    \ left after the call to `trim()`, it’ll be an actual sequence of characters.\n\
    \nThere’s no functional error in the code. The problem, as is so often the case,\
    \ is that the code is more complex and less readable than it could be. More precisely,\
    \ the `if` statement is entirely unnecessary. It’s clutter code that only distracts\
    \ from the actual semantics.\n\nLet’s see what we can do about it! The key is\
    \ the return type of our method: `boolean`. Because of this, we don’t have to\
    \ wrap everything in an `if` statement—we can return the value right away, like\
    \ this:\n\n```java\nclass Astronaut {\n  String name;\n  int missions;\n\n  boolean\
    \ isValid() {\n    return missions >= 0 && name != null && !name.trim().isEmpty();\n\
    \  }\n}\n```\n\nThis change removes a level of indentation and branching. The\
    \ method is now very concise and much easier to read!\n\nWe condensed the five\
    \ lines of the `if` statement into a single line of code. To retain the same semantics,\
    \ we had to apply Boolean arithmetic to the condition. Essentially, we applied\
    \ De Morgan’s laws and negated the condition. Here’s a quick definition of these\
    \ famous laws, which you’ll need often:\n\n| `!A && !B == !(A || B)` // true |\n\
    | `!A || !B == !(A && B)` // true |\n\nThere are times when the condition is more\
    \ complex than this one. If this is the case, you should think about breaking\
    \ it into smaller chunks. Our advice is to capture parts of a condition with variables\
    \ that have meaningful names. Consider the following example:\n\n```java\nboolean\
    \ isValid() {\n  boolean isValidMissions = missions >= 0;\n  boolean isValidName\
    \ = name != null && !name.trim().isEmpty();\n  return isValidMissions && isValidName;\n\
    }\n```\n\nAs a rule of thumb, you should consider such a simplification if you\
    \ combine more than two different conditions. If you need parts of the condition\
    \ elsewhere, consider putting them into separate methods, as explained in *Simplify\
    \ Boolean Expressions*.\n\nNote that the solution depicted here only works with\
    \ boolean return types.\n\n## Simplify Boolean Expressions\n\n```java\nclass SpaceShip\
    \ {\n  Crew crew;\n  FuelTank fuelTank;\n  Hull hull;\n  Navigator navigator;\n\
    \  OxygenTank oxygenTank;\n\n  boolean willCrewSurvive() {\n    return hull.holes\
    \ == 0 &&\n           fuelTank.fuel >= navigator.requiredFuelToEarth() &&\n  \
    \         oxygenTank.lastsFor(crew.size) > navigator.timeToEarth();\n  }\n}\n\
    ```\n\nBoolean expressions that combine multiple conditions are often hard to\
    \ understand and easy to get wrong. But you can make them easier with a few simple\
    \ tricks.\n\nAs in the previous comparison, you can see an example of a validation\
    \ method. The condition is more complex than the previous one, but it’s already\
    \ condensed in a single return statement according to *Return Boolean Expressions\
    \ Directly*.\n\nThe sheer size of the condition makes it hard to understand. It\
    \ spans over several lines of code and combines checks from five different objects.\
    \ Due to its size, it’s easy to introduce a fault when you have to change a part\
    \ of it. But even before changing it, you’ll probably spend valuable programming\
    \ time to grasp its meaning.\n\nWhen you have to combine several conditions into\
    \ a single check, it’s better to group them in some way. A good grouping depends\
    \ on the semantics of the condition, and you can try to group by topics or level\
    \ of abstractions.\n\nWithin a method, you should combine statements that are\
    \ on a similar level of abstraction. Ideally, a higher-level method should call\
    \ methods of the next lower level.\n\n### Brackets Can Help, Too\n\nBoolean conditions\
    \ can get tricky, especially when they lack brackets. Many developers, and we\
    \ count ourselves in this group, don’t internalize the precedence of Boolean operators\
    \ and have to think for a moment to determine if `x && y || z` means `(x && y)\
    \ || z` or `x && (x || z)`. Or did you know that `&&` is always evaluated before\
    \ `||`?\n\nHere, the method `willCrewSurvive()` verifies each low-level detail\
    \ in the same condition. Can you think of a level of abstraction in between? How\
    \ about this:\n\n```java\nclass SpaceShip {\n  Crew crew;\n  FuelTank fuelTank;\n\
    \  Hull hull;\n  Navigator navigator;\n  OxygenTank oxygenTank;\n\n  boolean willCrewSurvive()\
    \ {\n    boolean hasEnoughResources = hasFuel() && hasOxygen();\n    return hull.isIntact()\
    \ && hasEnoughResources;\n  }\n\n  private boolean hasOxygen() {\n    return oxygenTank.lastsFor(crew.size)\
    \ > navigator.timeToEarth();\n  }\n\n  private boolean hasFuel() {\n    return\
    \ fuelTank.fuel >= navigator.requiredFuelToEarth();\n  }\n}\n```\n\nWow, a lot\
    \ has changed! The `willCrewSurvive()` method is still present, but now it calls\
    \ other methods and aggregates their return values.\n\nFirst, we added a `boolean`\
    \ variable that bundles similar aspects together by their topic: resources. We\
    \ also gave it a meaningful name, `hasEnoughResources`. The variable combines\
    \ the results of method calls, `hasOxygen()` and `hasFuel()`. You’ll find the\
    \ actual details of the conditions inside these two methods.\n\nNext, we’ve combined\
    \ the variable `hasEnoughResources` with the last missing piece of the original\
    \ condition, `hull.holes == 0`. We, however, use the method `isIntact()` from\
    \ the `Hull` class instead. It already has a meaningful name so there’s no real\
    \ reason to store it in another boolean variable.\n\nAlthough there are more lines\
    \ of code now, we’ve improved the understandability of the code a lot. You no\
    \ longer need to grasp one condition at once. Thanks to the grouping, you can\
    \ do it step by step. Plus, the names of variables and methods communicate the\
    \ intended result. Each method on its own is simple and comprehensible at one\
    \ glance.\n\n## Avoid NullPointerException in Conditionals\n\n```java\nclass Logbook\
    \ {\n  void writeMessage(String message, Path location) throws IOException {\n\
    \    if (Files.isDirectory(location)) {\n      throw new IllegalArgumentException(\"\
    The path is invalid!\");\n    }\n    if (message.trim().equals(\"\") || message\
    \ == null) {\n      throw new IllegalArgumentException(\"The message is invalid!\"\
    );\n    }\n    String entry = LocalDate.now() + \": \" + message;\n    Files.write(location,\
    \ Collections.singletonList(entry),\n               StandardCharsets.UTF_8, StandardOpenOption.CREATE,\n\
    \               StandardOpenOption.APPEND);\n  }\n}\n```\n\nThe first exception\
    \ that beginners in Java typically see is the `NullPointerException`. It’s triggered\
    \ if you call a method or access an attribute on a reference that is null. To\
    \ prevent such problems, you should validate method arguments. But be sure to\
    \ do so in the right order!\n\nThe `Logbook` in this code snippet writes messages\
    \ into a file. We organize log messages into specific files on the filesystem,\
    \ which we indicate by the `location` argument. It’s important that messages are\
    \ correct, so we need to perform parameter validation.\n"
