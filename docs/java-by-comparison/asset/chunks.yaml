- fmt: "\nThe first logical conditions you learned to write probably consisted of\
    \ integers and comparison operators, and a beginner might use that same way of\
    \ implementing conditions with boolean values. But those comparisons are completely\
    \ unnecessary—they’re like noise in your code.\n\nHere you can see code for a\
    \ `Laboratory` component, which analyzes a `Sample` through conditions in two\
    \ nested if-else blocks.\n\nThe code explicitly compares boolean return values\
    \ to boolean primitive types (`true` and `false`). This is an anti-pattern that\
    \ you can often find in code written by beginners.\n\nIf you build logical conditions\
    \ with data types other than boolean, for example with integers, you need to compare\
    \ them to actual values (e.g., `myNumber == 25`, `input > 0`). But you don’t need\
    \ to do that for boolean variables or return types.\n\nInstead, you already have\
    \ boolean expressions to work with. There’s no need to compare them to boolean\
    \ primitives. The comparisons clutter up the code and make it just a little harder\
    \ to read.\n\nMost of the time, you’ll find that it’s straightforward to get rid\
    \ of such unnecessary comparisons. Not only will you have less code, but it will\
    \ also be easier to read.\n\nNow check out how straightforward this code is without\
    \ those comparisons.\n\n```java\nclass Laboratory {\n  Microscope microscope;\n\
    \n  Result analyze(Sample sample) {\n    if (microscope.isInorganic(sample)) {\n\
    \      return Result.INORGANIC;\n    } else {\n      return analyzeOrganic(sample);\n\
    \    }\n  }\n\n  private Result analyzeOrganic(Sample sample) {\n    if (!microscope.isHumanoid(sample))\
    \ {\n      return Result.ALIEN;\n    } else {\n      return Result.HUMANOID;\n\
    \    }\n  }\n}\n```\n\nHere, we removed the comparisons to boolean primitives.\
    \ In the case of `laboratory.isHumanoid(sample)`, we had to negate the expression\
    \ to retain the semantics. But otherwise, the code is unchanged. You can now read\
    \ the condition expressions a little more easily.\n\nAny compiler would perform\
    \ such a removal out-of-the-box. There’s probably no difference between the two\
    \ snippets in terms of the actual execution. The benefit here lies entirely in\
    \ the readability of the code. It’s a small fix in some simple code, but imagine\
    \ you’re working with a large code base—every little improvement in readability\
    \ helps!\n\nThinking about [Avoid Negations](#f_0014.xhtml_sec.avoid_negations),\
    \ you could improve the conditions even further. So read on!\n\n### Multiple Returns\
    \ vs. Single Return per Method\n\nCountless developer hours have been invested\
    \ (read: wasted) to discuss, if it’s better to have a single return statement\
    \ or multiple ones within a method. There’s no ultimate right or wrong. Every\
    \ return statement marks a point of exit from a method. A single point of exit\
    \ makes for a more structured flow of control; you always know where it’ll end.\
    \ But sometimes you want to exit a method early—for example, when the input parameters\
    \ are invalid. Here, we use multiple returns because it requires fewer lines of\
    \ code—and space is always limited in a book. In your code, try to see if you\
    \ need an early exit, and if you do, use multiple returns.\n\n## Avoid Negations\n\
    \n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result analyze(Sample\
    \ sample) {\n    if (microscope.isInorganic(sample)) {\n      return Result.INORGANIC;\n\
    \    } else {\n      return analyzeOrganic(sample);\n    }\n  }\n\n  private Result\
    \ analyzeOrganic(Sample sample) {\n    if (!microscope.isHumanoid(sample)) {\n\
    \      return Result.ALIEN;\n    } else {\n      return Result.HUMANOID;\n   \
    \ }\n  }\n}\n```\n\nHas anyone ever told you to “think positively”? Turns out,\
    \ positive expressions are better in your code than negative ones because they’re\
    \ often easier to grasp and they take up slightly less space.\n\nThe problem code\
    \ shown here is another variant of the `Laboratory` component. It provides two\
    \ methods that take a `Sample` and return a `Result`. There’s nothing obviously\
    \ wrong with the code. It’ll fulfill its purpose, but it’s more complex than necessary.\n\
    \nConsider the conditions of the if statements: Both express a negating condition.\
    \ The first one tests if a sample `isInorganic()`. The second one even uses the\
    \ Boolean operator for negation: the exclamation mark `!`.\n\nIn most cases, you’ll\
    \ find it easier to understand positive expressions when you read code. A negated\
    \ expression adds one extra layer of indirection. Instead of a simple “X does\
    \ apply,” you have to grasp an additional token: “X does not apply.”\n\nThis extra\
    \ token is often unnecessary. Although it seems like a minor change, every tiny\
    \ bit helps. Remember: Everybody likes no negations. Now, take a look at the simplified:\n\
    \n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result analyze(Sample\
    \ sample) {\n    if (microscope.isOrganic(sample)) {\n      return analyzeOrganic(sample);\n\
    \    } else {\n      return Result.INORGANIC;\n    }\n  }\n\n  private Result\
    \ analyzeOrganic(Sample sample) {\n    if (microscope.isHumanoid(sample)) {\n\
    \      return Result.HUMANOID;\n    } else {\n      return Result.ALIEN;\n   \
    \ }\n  }\n}\n```\n\nWe changed the code only, but that already has an effect.\
    \ Instead of `isInorganic()`, we’re calling `isOrganic()`, which has a positive\
    \ wording instead of a negative one. \n\nSometimes, however, you need the appropriate\
    \ methods, like `isOrganic()` instead of `isInorganic()` here. If the code you’re\
    \ calling comes from a third-party library, you might not have the option to invoke\
    \ different methods. But when you control it, don’t shy away from adding that\
    \ method to the appropriate class—the few lines of code are worth their characters,\
    \ because they make your code clearer in other places. In all, these changes are\
    \ quite simple and you might wonder: why should I bother? You should bother because\
    \ it improves the understandability of the code and comes at virtually no cost.\
    \ From our experience, it’s best to get rid of the negative method—no need to\
    \ maintain two similar methods.\n\n## Return Expressions Directly\n\n```java\n\
    class Astronaut {\n  String name;\n  int missions;\n\n  boolean isValid() {\n\
    \    if (missions < 0 || name == null || name.trim().isEmpty()) {\n      return\
    \ false;\n    } else {\n      return true;\n    }\n  }\n}\n```\n\nNext, let’s\
    \ look at another way you can cut clutter in your code. In this case, we don’t\
    \ need the if statement to pursue our goals. Let’s find out why.\n\nYou can see\
    \ a typical validation method in the snippet. The method checks a couple of attributes\
    \ of an object, an integer and a String. The integer attribute refers to a number\
    \ of missions. This number shouldn’t be negative. The String attribute shouldn’t\
    \ be null; otherwise we risk that a `NullPointerException` crashes the execution\
    \ at some point.\n"
