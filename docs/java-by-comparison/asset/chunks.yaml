    \ instead of a `Queue` instance? Can a runtime exception occur for certain inputs?\n\
    \nNo. No. And no idea. We have no clue how the method will behave, even though\
    \ there’s a JavaDoc comment. So if we use this method, we’re no longer certain\
    \ how our code will behave. That would be especially problematic if you’re building\
    \ an API.\n\nLet’s see what we can do about it:\n\n```\ninterface CargoShip {\n\
    \n    Stack<Supply> unload();\n\n    /**\n     * Loads supplies onto the cargo\
    \ ship.\n     *\n     * Only lets you load as many supplies as there is remaining\
    \ capacity.\n     * Example:\n     * int capacity = cargoShip.getRemainingCapacity();\
    \ // 1*\n     * Queue<Supply> supplies = Arrays.asList(new Supply(\"Apple\"));\n\
    \     * Queue<Supply> spareSupplies = cargoShip.load(supplies);\n     * spareSupplies.isEmpty();\
    \ // true;\n     * cargoShip.getRemainingCapacity() == 0; // true\n     *\n  \
    \   * @param supplies to be loaded; must not be null\n     * @return supplies\
    \ that could not be loaded because of too little capacity; is empty if everything\
    \ has been loaded\n     * @throws NullPointerException if supplies is null\n \
    \    * @see CargoShip#getRemainingCapacity() check capacity\n     * @see CargoShip#unload()\
    \ unload the supplies\n     */\n    Queue<Supply> load(Queue<Supply> supplies);\n\
    \n    int getRemainingCapacity();\n}\n```\n\nThis is much better now. The JavaDoc\
    \ comment reads like a contract. It states how the input and its internal state\
