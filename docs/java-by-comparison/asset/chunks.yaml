    \ include increased knowledge and skill, increased marketability, and deep satisfaction.\
    \ Increase dosage regularly.\n\nAnd thank you for your continued support,\n\n\
    Andy Hunt, Publisher\n\n![images/Coupon.png](OEBPS/Images/Coupon.png)\n\n## You\
    \ May Be Interested In…\n\n*Select a cover for more information*\n\n### Software\
    \ Design X-Rays\n\n[![](OEBPS/Images/atevol.jpg)](http://pragmaticprogrammer.com/titles/atevol)\n\
    \nAre you working on a codebase where cost overruns, death marches, and heroic\
    \ fights with legacy code monsters are the norm? Battle these adversaries with\
    \ novel ways to identify and prioritize technical debt, based on behavioral data\
    \ from how developers work with code. And that’s just for starters. Because good\
    \ code involves social design, as well as technical design, you can find surprising\
    \ dependencies between people and code to resolve coordination bottlenecks among\
    \ teams. Best of all, the techniques build on behavioral data that you already\
    \ have: your version-control system. Join the fight for better code!\n\nAdam Tornhill\n\
    \n(274 pages) ISBN: 9781680502725 $45.95\n\n### Release It! Second Edition\n\n\
    [![](OEBPS/Images/mnee2.jpg)](http://pragmaticprogrammer.com/titles/mnee2)\n\n\
    A single dramatic software failure can cost a company millions of dollars—but\
    \ can be avoided with simple changes to design and architecture. This new edition\
    \ of the best-selling industry standard shows you how to create systems that run\
    \ longer, with fewer failures, and recover better when bad things happen. New\
    \ coverage includes DevOps, microservices, and cloud-native architecture. Stability\
    \ antipatterns have grown to include systemic problems in large-scale systems.\
    \ This is a must-have pragmatic guide to engineering for production systems.\n\
    \nMichael Nygard\n\n(376 pages) ISBN: 9781680502398 $47.95\n\n### A Common-Sense\
    \ Guide to Data Structures and Algorithms\n\n[![](OEBPS/Images/jwdsal.jpg)](http://pragmaticprogrammer.com/titles/jwdsal)\n\
    \nIf you last saw algorithms in a university course or at a job interview, you’re\
    \ missing out on what they can do for your code. Learn different sorting and searching\
    \ techniques, and when to use each. Find out how to use recursion effectively.\
    \ Discover structures for specialized applications, such as trees and graphs.\
    \ Use Big O notation to decide which algorithms are best for your production environment.\
    \ Beginners will learn how to use these techniques from the start, and experienced\
    \ developers will rediscover approaches they may have forgotten.\n\nJay Wengrow\n\
    \n(218 pages) ISBN: 9781680502442 $45.95\n\n### Design It!\n\n[![](OEBPS/Images/mkdsa.jpg)](http://pragmaticprogrammer.com/titles/mkdsa)\n\
    \nDon’t engineer by coincidence—design it like you mean it! Grounded by fundamentals\
    \ and filled with practical design methods, this is the perfect introduction to\
    \ software architecture for programmers who are ready to grow their design skills.\
    \ Ask the right stakeholders the right questions, explore design options, share\
    \ your design decisions, and facilitate collaborative workshops that are fast,\
    \ effective, and fun. Become a better programmer, leader, and designer. Use your\
    \ new skills to lead your team in implementing software with the right capabilities—and\
    \ develop awesome software!\n\nMichael Keeling\n\n(358 pages) ISBN: 9781680502091\
    \ $41.95\n\n### tmux 2\n\n[![](OEBPS/Images/bhtmux2.jpg)](http://pragmaticprogrammer.com/titles/bhtmux2)\n\
    \nYour mouse is slowing you down. The time you spend context switching between\
    \ your editor and your consoles eats away at your productivity. Take control of\
    \ your environment with tmux, a terminal multiplexer that you can tailor to your\
    \ workflow. With this updated second edition for tmux 2.3, you’ll customize, script,\
    \ and leverage tmux’s unique abilities to craft a productive terminal environment\
    \ that lets you keep your fingers on your keyboard’s home row.\n\nBrian P. Hogan\n\
    \n(102 pages) ISBN: 9781680502213 $21.95\n\n### Modern Vim\n\n[![](OEBPS/Images/modvim.jpg)](http://pragmaticprogrammer.com/titles/modvim)\n\
    \nTurn Vim into a full-blown development environment using Vim 8’s new features\
    \ and this sequel to the beloved bestseller Practical Vim. Integrate your editor\
    \ with tools for building, testing, linting, indexing, and searching your codebase.\
    \ Discover the future of Vim with Neovim: a fork of Vim that includes a built-in\
    \ terminal emulator that will transform your workflow. Whether you choose to switch\
    \ to Neovim or stick with Vim 8, you’ll be a better developer.\n\nDrew Neil\n\n\
    (190 pages) ISBN: 9781680502626 $39.95\n\n### Functional Programming in Java\n\
    \n[![](OEBPS/Images/vsjava8.jpg)](http://pragmaticprogrammer.com/titles/vsjava8)\n\
    \nGet ready to program in a whole new way. Functional Programming in Java will\
    \ help you quickly get on top of the new, essential Java 8 language features and\
    \ the functional style that will change and improve your code. This short, targeted\
    \ book will help you make the paradigm shift from the old imperative way to a\
    \ less error-prone, more elegant, and concise coding style that’s also a breeze\
    \ to parallelize. You’ll explore the syntax and semantics of lambda expressions,\
    \ method and constructor references, and functional interfaces. You’ll design\
    \ and write applications better using the new standards in Java 8 and the JDK.\n\
    \nVenkat Subramaniam\n\n(196 pages) ISBN: 9781937785468 $33\n\n### Programming\
    \ Concurrency on the JVM"
