  trans: "\n查看上面的代码。断言检查了 `targetSpeedKmh` 的值是否等于 `7667`。在这里使用 `==` 运算符进行标识性检查是可以的，因为我们只比较了基本类型：两个\
    \ `ints`。但对于对象，你应该使用 `equals()` 而不是它。\n\n这个测试在功能上是正确的，但当测试失败时，会产生一个显现出来的问题。如果发生这种情况，我们将得到一个带有\
    \ `java.lang.AssertionError` 的堆栈跟踪，其中包含了失败断言的类名和行号，但没有任何错误消息。因此，我们只知道哪个断言失败了，却不知道它失败的原因。\n\
    \n当你试图理解哪里出了问题时，那条消息（或者说，缺失的消息）并没有什么帮助。它没有引导你找到 Bug 的位置。这是因为断言本身并不关心两个值是否在相互比较——它只关心某个\
    \ `Boolean` 值是否应该是 true 但现在是 false。因此，根本无法对失败的断言进行更具体的描述。\n\n那么，我们该如何通过断言提供更多信息，以便获得更好的错误信息呢？\n\
    \n```java\nclass CruiseControlTest {\n    @Test\n    void setPlanetarySpeedIs7667()\
    \ {\n        CruiseControl cruiseControl = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(7667, cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\n解决方案实际上非常简单。我们使用另一个断言，一个专门用于检查两个值是否相同的：`assertEquals()`。使用这个断言，JUnit\
    \ 在测试失败时可以提供更好的错误信息。它看起来像这样：\n\nexpected: <7667> but was <1337>\n\n这包含的信息多得多。之前，我们只知道测试失败了。现在，我们知道了测试失败的原因：我们期望值等于\
    \ `7667`，但实际上它是 `1337`。\n\n我们必须承认，使用 `assertTrue()` 也可以提供更详细的消息。主要的区别在于，你必须自己构建这条消息并将其传递给\
    \ `assertTrue()`，以便在失败时显示它。这意味着你必须为代码库中的每一个 `assertTrue()` 构建消息。直接使用这种开箱即用此类功能的断言（如\
    \ `assertEquals()`）要好得多。\n\n你可能认出了这种消息格式。我们在不久前的某次比较中使用过它：在消息中解释原因。在某种意义上，异常与失败的测试非常相似，消息格式对于开发者判断为什么功能没有按预期工作非常有帮助。\n\
    \nJUnit 中提供的远不止于 `assertEquals()` 和 `assertTrue()`。当然，你还可以使用 `assertFalse()`、`assertNotEquals()`\
    \ 和 `assertSame()`。你可以使用 `assertArrayEquals()`、`assertLinesMatch()` 和 `assertIterableEquals()`\
    \ 来检查数组或数据结构是否相等（即：是否包含相等的内容）；可以使用 `assertAll()` 将多个断言组合在一起；还可以使用 `assertTimeout()`\
    \ 确保执行时间足够短。无论如何，你都应该选择最适合你测试的断言，因为这会产生更好的消息。\n\n## 预期值先于实际值 \n\n```java\nclass\
    \ CruiseControlTest {\n    @Test\n    void setPlanetarySpeedIs7667() {\n     \
    \   CruiseControl cruiseControl = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(cruiseControl.getTargetSpeedKmh(), 7667);\n \
    \   }\n}\n```\n\n上面的测试看起来是正确的，对吧？你可以看到它被分成了不同的部分，使用了 `assertEquals()` 来比较结果，并且有一个有意义的名字。你需要仔细观察才能发现代码中的问题。\n\
    \n当你运行测试且断言失败时，问题就变得更加明显了。如果发生这种情况，你会得到像这样的消息：\n\nexpected: <1337> but was <7667>\n\
    \n这条消息告诉你 `assertEquals()` 方法中的两个值是不等的。这就是测试如预期所失败的原因。到目前为止都很好，但消息的语义是错误的。在测试中，我们期望数字\
    \ `7667` 是正确的结果，而 `1337` 是 `cruiseControl` 返回的错误结果。但消息告诉你的情况恰恰相反。\n\n错误源于 `assertEquals()`\
    \ 参数的混淆——它们的顺序错了。不幸的是，Java 或 JUnit 在此处无法无法提供类型检查支持。毕竟，预期值和实际值的类型必须相同。顺序是一个纯粹的语义问题，很容易在无意间出错。\n\
    \n在这个简单的测试中，我们可以快速确定消息应该是什么样的。这里没有真正的问题。但想象一个更复杂的 `assertEquals()` 调用，它比较的是大型对象，无法给你提供那样直观的视图。你将花费时间来理解错误，并且可能在调试时走入错误的道路，仅仅是因为你假设消息是正确的。在这里，注意\
    \ `assertEquals()` 参数的顺序非常重要：\n\n```java\nclass CruiseControlTest {\n    @Test\n\
    \    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl = new\
    \ CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertEquals(7667, cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\n你可能猜到了，在这种情况下解决方案非常简单。我们只需要交换 `assertEquals()` 方法的两个参数。错误消息就会变为：\n\
    \nexpected: <7667> but was <1337>\n\n好多了！现在，消息提供了正确的信息，不再会误导你。我们的经验之则是：先思考你期望什么。困难的部分不是修复\
    \ Bug，而是避免它的出现。清晰且描述性的断言消息在需要时（测试失败）非常有帮助；你会非常感激那些引导你走向修复而非反方向的消息。我们曾多次感激这些消息。\n\
    \n本章还提醒我们要预料意外。当代码出现问题时，确保你手头有所有信息，以便快速理解正确的行为应该是怎样的以及哪部分导致了问题。参数顺序只是其中方面。其他方面包括使用合适的断言（如前面的比较）并对其进行正确配置，你将在接下来学到：*使用合理的容差。\n\
    \n```java\nclass OxygenTankTest {\n    @Test\n    void testNewTankIsEmpty() {\n\
    \        OxygenTank tank = OxygenTank.withCapacity(100);\n        Assertions.assertEquals(0,\
    \ tank.getStatus());\n    }\n\n    @Test\n    void testFilling() {\n        OxygenTank\
    \ tank = OxygenTank.withCapacity(100);\n        tank.fill(5.8);\n        tank.fill(5.6);\n\
    \        Assertions.assertEquals(0.114, tank.getStatus());\n    }\n}\n```\n"
- fmt: "\nCan you think of why? Here’s a tip: On our machine, the second test fails\
    \ with the message expected: <0.114> but was <0.11399999999999999>`. Obviously,\
    \ the decimal places aren’t what we expected.\n\nThe problem here boils down to\
    \ floating-point arithmetic, the way how decimal numbers are represented with\
    \ 64 or 32 bits. Java does this according to the IEEE Standard for Floating-Point\
    \ Arithmetic (IEEE 754). We won’t go into the details here, but in a nutshell,\
    \ it’s not possible to represent every floating-point number in a finite number\
    \ of bits. That’s why basically all programming languages, Java included, only\
    \ approximate floating-point numbers. For example, the decimal number `0.1` easily\
    \ turns into a close approximation in memory, such as `0.100000000000000005551115123126`.\
    \ And if you only approximate something, there can be rounding errors.\n\nIn the\
    \ test above, all decimals `5.6`, `5.8`, and `0.114` are only approximated with\
    \ a `double`. Of course, we can specify these numbers directly in code, but as\
    \ they they’re combined at runtime with arithmetic operations, the result will\
    \ only be a very close approximation to the expected number. And that’s why the\
    \ assertion above fails.\n\nWhen you test floating-point computations, you need\
    \ to specify a precision:\n\n```java\nclass OxygenTankTest {\n    static final\
    \ double TOLERANCE = 0.00001;\n\n    @Test\n    void testNewTankIsEmpty() {\n\
    \        OxygenTank tank = OxygenTank.withCapacity(100);\n        Assertions.assertEquals(0,\
    \ tank.getStatus(), TOLERANCE);\n    }\n\n    @Test\n    void testFilling() {\n\
    \        OxygenTank tank = OxygenTank.withCapacity(100);\n        tank.fill(5.8);\n\
    \        tank.fill(5.6);\n        Assertions.assertEquals(0.114, tank.getStatus(),\
    \ TOLERANCE);\n    }\n}\n```\n\nExact matches aren’t reliable with floating-point\
    \ arithmetic. Instead of pedantically insisting on an exact match, we need to\
    \ tolerate a little bit of difference between the expected and actual values.\n\
    \nThis is easy enough with JUnit. The assertion `assertEquals(double expected,\
    \ double actual, double delta)` supports a tolerance value called `delta`. If\
    \ you need to be exact up to two decimal places, use a tolerance value of `0.1*10^-2=0.001`.\
    \ Here, we want a precision of four decimal places, resulting in a tolerance value\
    \ of at least `0.00001`.\n\nTo sum up, you should be aware of precision and specify\
    \ an acceptable tolerance level whenever you use `assertEquals()` with either\
    \ `float` or `double`.\n\n## Never Use Floating-Point Arithmetic for Money, Ever!\n\
    \nIt seems tempting to use `float` or `double` when you have to represent monetary\
    \ values in your code and that’s exactly what beginners usually do. After all,\
    \ we use money in a floating-point form in our everyday life—for example, by paying\
    \ $1.99 for a chocolate bar. Floating-point values just seem to be the natural\
    \ representation for that. Don’t ever do this!\n\nSooner or later, your program\
    \ will produce wrong calculations because of rounding errors. When it comes to\
    \ money, even small differences will be noticed. Luckily, the solution is simple:\
    \ don’t store dollars in `double` values; instead, store cents in `long` variables\
    \ or use `BigDecimal` as most banks and insurance companies do in their Java-based\
    \ systems.\n\n## Let JUnit Handle Exceptions\n\n```java\nclass LogbookTest {\n\
    \    @Test\n    void readLogbook() {\n        Logbook logbook = new Logbook();\n\
    \        try {\n            List<String> entries = logbook.readAllEntries();\n\
    \            Assertions.assertEquals(13, entries.size());\n        } catch (IOException\
    \ e) {\n            Assertions.fail(e.getMessage());\n        }\n    }\n\n   \
    \ @Test\n    void readLogbookFail() {\n        Logbook logbook = new Logbook();\n\
    \        try {\n            logbook.readAllEntries();\n            Assertions.fail(\"\
    read should fail\");\n        } catch (IOException ignored) {}\n    }\n}\n```\n\
    \nTests and exceptions often go hand-hand. We ensure that no exceptions are thrown\
    \ or that a particular exception is thrown. Let’s look at the code. There are\
    \ two ways of testing exceptions. The first one uses the `try-catch` block and\
    \ `fail()`, but it doesn’t seem much better. The second one uses `assertThrows()`.\
    \ This assertion marks that we expect a specific kind of exception to be thrown.\
    \ Looking at the code, you can see that there is no `try-catch` block and no `fail()`.\
    \ Instead, everything’s handled by `assertThrows()`. All we need to do is pass\
    \ the method that we expect to trigger the exception into the assertion.\n"
  raw: 'Can you think of why? Here’s a tip: On our machine, the second test fails
    with the message expected: <0.114> but was <0.11399999999999999>. Obviously, the
    decimal places aren’t what we expected.


    The problem here boils down to floating-point arithmetic,^([[38]](#f_0073.xhtml_FOOTNOTE-38))
    the way how decimal numbers are represented with 64 or 32 bits. Java does this
    according to the IEEE Standard for Floating-Point Arithmetic (IEEE 754). We won’t
    go into the details here, but in a nutshell, it’s not possible to represent every
    floating-point number in a finite number of bits. That’s why basically all programming
    languages, Java included, only approximate floating-point numbers. For example,
    the decimal number 0.1 easily turns into a close approximation in memory, such
    as 0.100000000000000005551115123126\. And if you only approximate something, there
    can be rounding errors.


    In the test above, all decimals 5.6, 5.8, and 0.114 are only approximated with
    a double. Of course, we can specify these numbers directly in code, but as soon
    they’re combined at runtime with arithmetic operations, the result will only be
    a very close approximation to the expected number. And that’s why the assertion
    above fails.


    When you test floating-point computations, you need to specify a precision:


    |   | **class** OxygenTankTest { |


    |   | **static** **final** **double** TOLERANCE = 0.00001; |


    |   |  |


    |   |  |


    |   | @Test |


    |   | **void** testNewTankIsEmpty() { |


    |   | OxygenTank tank = OxygenTank.withCapacity(100); |


    |   |  |


    |   | Assertions.assertEquals(0, tank.getStatus(), TOLERANCE); |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** testFilling() { |


    |   | OxygenTank tank = OxygenTank.withCapacity(100); |


    |   |  |


    |   | tank.fill(5.8); |


    |   | tank.fill(5.6); |


    |   |  |


    | » | Assertions.assertEquals(0.114, tank.getStatus(), TOLERANCE); |


    |   | } |


    |   | } |


    Exact matches aren’t reliable with floating-point arithmetic. Instead of pedantically
    insisting on an exact match, we need to tolerate a little bit of difference between
    the expected and actual values.


    This is easy enough with JUnit. The assertion assertEquals(double expected, double
    actual, double delta) supports a tolerance value called delta. If you need to
    be exact up to two decimal places, use a tolerance value of 0.1*10^-2=0.001. Here,
    we want a precision of four decimal places, resulting in a tolerance value of
    at least 0.00001.


    To sum up, you should be aware of precision and specify an acceptable tolerance
    level whenever you use assertEquals() with either float or double.


    Never Use Floating-Point Arithmetic for Money, Ever!


    It seems tempting to use float or double when you have to represent monetary values
    in your code and that’s exactly what beginners usually do. After all, we use money
    in a floating-point form in our everyday life—for example, by paying $1.99 for
    a chocolate bar. Floating-point values just seem to be the natural representation
    for that. Don’t ever do this!


    Sooner or later, your program will produce wrong calculations because of rounding
    errors. When it comes to money, even small differences will be noticed. Luckily,
    the solution is simple: don’t store dollars in double values; instead, store cents
    in long variables or use BigDecimal as most banks and insurance companies do in
    their Java-based systems.


    ## Let JUnit Handle Exceptions


    |   | **class** LogbookTest { |


    |   |  |


    |   | @Test |


    |   | **void** readLogbook() { |


    |   | Logbook logbook = **new** Logbook(); |


    |   |  |


    |   | **try** { |


    |   | List<String> entries = logbook.readAllEntries(); |


    |   | Assertions.assertEquals(13, entries.size()); |


    |   | } **catch** (IOException e) { |


    | » | Assertions.fail(e.getMessage()); |


    |   | } |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** readLogbookFail() { |


    |   | Logbook logbook = **new** Logbook(); |


    |   |  |


    |   | **try** { |


    |   | logbook.readAllEntries(); |


    | » | Assertions.fail(*"read should fail"*); |


    |   | } **catch** (IOException ignored) {} |


    |   | } |


    |   | } |


    Tests and exceptions often go hand-in-hand. Tests ensure that no exceptions are
    thrown, or that a particular exception must be thrown.


    Let’s look at the code. There’s two examples of tests that depend on exceptions
    in different ways. The first one fails if an IOException occurs and the second
    one succeeds in that case. Here we make the tests fail by executing the fail()
    assertion. The first test catches the IOException and fails, but it hands over
    the message of the exception for a better traceability of the failed test. The
    second test succeeds when the exception occurs. This will take the control flow
    into the catch block and avoid the call to fail().


    These two ways of testing for exceptions work, but they come with some downsides.
    In the first test, we break the cause chain (and we know we should [*Avoid Breaking
    the Cause Chain*](#f_0056.xhtml_sec.avoid_breaking_cause_chain), of course). We
    provide only the message, not the full exception with its stack trace. In the
    second test, we actually expect the exception to occur, but the code doesn’t really
    tell that story. It’s quite clouded because the test depends on avoiding the execution
    of parts of the code. We could add an assertion like Assertions.assertTrue(true,
    "expected exception occurred") in the catch block, but that doesn’t seem much
    better.


    JUnit has a built-in mechanism to handle exceptions:


    |   | **class** LogbookTest { |


    |   |  |


    |   | @Test |


    | » | **void** readLogbook() **throws** IOException { |


    |   | Logbook logbook = **new** Logbook(); |


    |   |  |


    |   | List<String> entries = logbook.readAllEntries(); |


    |   |  |


    |   | Assertions.assertEquals(13, entries.size()); |


    |   | } |


    |   |  |


    |   | @Test |


    |   | **void** readLogbookFail() { |


    |   | Logbook logbook = **new** Logbook(); |


    |   |  |


    |   | Executable when = () -> logbook.readAllEntries(); |


    |   |  |


    | » | Assertions.assertThrows(IOException.class, when); |


    |   | } |


    |   | } |


    The first test looks very much like the basic test that it is. Each JUnit test
    contains the implicit assertion that no exception occurs. We don’t have to add
    that assertion explicitly—just let JUnit do its job. This really simplifies the
    test code, since we can remove the try–catch block and the call to fail() completely.
    The code reads nicer now, and we don’t break the cause chain anymore. Whenever
    an exception occurs, JUnit will display the complete stack trace on failure.


    In the second test, we use assertThrows(). This assertion explicitly marks that
    we expect a specific kind of exception to be thrown in the test. Looking at the
    code, you can see that there’s no try–catch block anymore and no call to fail().


    Instead, everything’s handled by assertThrows(). All we need to do is to pass
    the method that we expect to trigger the exception into the assertion. That’s
    something of type Executable for JUnit5. The traditional way of doing this would
    be to create an anonymous class (new Executable(){...}). Instead, we’d like to
    point ahead a little because we already applied [*Favor Lambdas Over Anonymous
    Classes*](#f_0084.xhtml_sec.favor_lambdas_over_anonymous_classes) above as it
    makes for a much more readable alternative to anonymous classes.


    ## Describe Your Tests


    |   | **class** OxygenTankTest { |


    |   | **static** **final** **double** PERMILLE = 0.001; |


    |   |  |


    |   | @Test |


    | » | @Disabled |


    |   | **void** testFill() { |


    |   | OxygenTank smallTank = OxygenTank.withCapacity(50); |


    |   |  |


    |   | smallTank.fill(22); |


    |   |  |


    |   | Assertions.assertEquals(0.44, smallTank.getStatus(), PERMILLE); |


