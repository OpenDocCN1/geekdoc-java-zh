    an actual name. The call to name.trim() removes all kinds of preceding or trailing
    space characters, such as white spaces or tabs. If there’s something left after
    the call to trim(), it’ll be an actual sequence of characters.


    There’s no functional error in the code. The problem, as is so often the case,
    is that the code is more complex and less readable than it could be. More precisely,
    the if statement is entirely unnecessary. It’s clutter code that only distracts
    from the actual semantics.


    Let’s see what we can do about it! The key is the return type of our method: boolean.
    Because of this, we don’t have to wrap everything in an if statement—we can return
    the value right away, like this:


    |   | **class** Astronaut { |


    |   |  |


    |   | String name; |


    |   | **int** missions; |


    |   |  |


    |   | **boolean** isValid() { |


    | » | **return** missions >= 0 && name != **null** && !name.trim().isEmpty();
    |


    |   | } |


    |   | } |


    This change removes a level of indentation and branching. The method is now very
    concise and much easier to read!


    We condensed the five lines of the if statement into a single line of code. To
    retain the same semantics, we had to apply Boolean arithmetic to the condition.
    Essentially, we applied De Morgan’s laws^([[18]](#f_0021.xhtml_FOOTNOTE-18)) and
    negated the condition. Here’s a quick definition of these famous laws, which you’ll
    need often:


    |   | !A && !B == !(A &#124;&#124; B) *// true* |


    |   | !A &#124;&#124; !B == !(A && B) *// true* |


    There are times when the condition is more complex than this one. If this is the
    case, you should think about breaking it into smaller chunks. Our advice is to
    capture parts of a condition with variables that have meaningful names. Consider
    the following example:


    |   | **boolean** isValid() { |


    |   | **boolean** isValidMissions = missions >= 0; |


    |   | **boolean** isValidName = name != **null** && !name.trim().isEmpty(); |


    |   | **return** isValidMissions && isValidName; |


    |   | } |


    As a rule of thumb, you should consider such a simplification if you combine more
    than two different conditions. If you need parts of the condition elsewhere, consider
    putting them into separate methods, as explained in [*Simplify Boolean Expressions*](#f_0016.xhtml_sec.simplify_boolean_expressions).


    Note that the solution depicted here only works with boolean return types.


    ## Simplify Boolean Expressions


    |   | **class** SpaceShip { |


    |   |  |


    |   | Crew crew; |


    |   | FuelTank fuelTank; |


    |   | Hull hull; |


    |   | Navigator navigator; |


    |   | OxygenTank oxygenTank; |


    |   |  |


    |   | **boolean** willCrewSurvive() { |


    | » | **return** hull.holes == 0 && |


    |   | fuelTank.fuel >= navigator.requiredFuelToEarth() && |


    |   | oxygenTank.lastsFor(crew.size) > navigator.timeToEarth(); |


    |   | } |


    |   | } |


    Boolean expressions that combine multiple conditions are often hard to understand
    and easy to get wrong. But you can make them easier with a few simple tricks.


    As in the previous comparison, you can see an example of a validation method.
    The condition is more complex than the previous one, but it’s already condensed
    in a single return statement according to [*Return Boolean Expressions Directly*](#f_0015.xhtml_sec.return_boolean_expression_directly).


    The sheer size of the condition makes it hard to understand. It spans over several
    lines of code and combines checks from five different objects. Due to its size,
    it’s easy to introduce a fault when you have to change a part of it. But even
    before changing it, you’ll probably spend valuable programming time to grasp its
    meaning.


    When you have to combine several conditions into a single check, it’s better to
    group them in some way. A good grouping depends on the semantics of the condition,
    and you can try to group by topics or level of abstractions.


    Within a method, you should combine statements that are on a similar level of
    abstraction. Ideally, a higher-level method should call methods of the next lower
    level.


    Brackets Can Help, Too


    Boolean conditions can get tricky, especially when they lack brackets. Many developers,
    and we count ourselves in this group, don’t internalize the precedence of Boolean
    operators and have to think for a moment to determine if x && y || z means (x
    && y) || z or x && (x || z). Or did you know that && is always evaluated before
    || ?


    Here, the method willCrewSurvive() verifies each low-level detail in the same
    condition. Can you think of a level of abstraction in between? How about this:


    |   | **class** SpaceShip { |


    |   |  |


    |   | Crew crew; |


    |   | FuelTank fuelTank; |


    |   | Hull hull; |


    |   | Navigator navigator; |


    |   | OxygenTank oxygenTank; |


    |   |  |


    |   | **boolean** willCrewSurvive() { |


    |   | **boolean** hasEnoughResources = hasEnoughFuel() && hasEnoughOxygen(); |


    | » | **return** hull.isIntact() && hasEnoughResources; |


    |   | } |


    |   |  |


    | » | **private** **boolean** hasEnoughOxygen() { |


    |   | **return** oxygenTank.lastsFor(crew.size) > navigator.timeToEarth(); |


    |   | } |


    |   |  |


    | » | **private** **boolean** hasEnoughFuel() { |


    |   | **return** fuelTank.fuel >= navigator.requiredFuelToEarth(); |


    |   | } |


    |   | } |


    Wow, a lot has changed here! The willCrewSurvive() method is still present, but
    now it calls other methods and aggregates their return values.


    First, we have added a boolean variable that bundles similar aspects together
    by their topic: depletable resources. We also gave it a meaningful name, hasEnoughResources.
    The variable combines the results of two method calls, hasEnoughOxygen() and hasEnoughFuel().
    You’ll find the actual details of the conditions inside these two methods.


    Next, we’ve combined the variable hasEnoughResources with the last missing piece
    of the original condition, hull.holes == 0. We, however, use the method hull.isIntact()
    from the Hull class instead. It already has a meaningful name so there’s no real
    reason to store it in another boolean variable.


    Although there are more lines of code now, we’ve improved the understandability
    of the code a lot. You no longer need to grasp one large condition at once. Thanks
    to the grouping, you can do it step by step. Plus, the names of variables and
    methods communicate the intended result. Each method on its own is simple and
    comprehensible at one glance.


    ## Avoid NullPointerException in Conditionals


    |   | **class** Logbook { |


    |   |  |


    |   | **void** writeMessage(String message, Path location) **throws** IOException
    { |


    | » | **if** (Files.isDirectory(location)) { |


    |   | **throw** **new** IllegalArgumentException(*"The path is invalid!"*); |


    |   | } |


    | » | **if** (message.trim().equals(*""*) &#124;&#124; message == **null**) {
    |


    |   | **throw** **new** IllegalArgumentException(*"The message is invalid!"*);
    |


    |   | } |


    |   | String entry = LocalDate.now() + *": "* + message; |


    |   | Files.write(location, Collections.singletonList(entry), |


    |   | StandardCharsets.UTF_8, StandardOpenOption.CREATE, |


    |   | StandardOpenOption.APPEND); |


    |   | } |


    |   | } |


    The first exception that beginners in Java typically see is the NullPointerException.
    It’s triggered if you call a method or access an attribute on a reference that
    is null. To prevent such problems, you should validate method arguments. But be
    sure to do so in the right order!


    The Logbook in this code snippet writes messages into a file. We organize log
    messages into specific files on the filesystem, which we indicate by the location
    argument. It’s important that messages are correct, so we need to perform parameter
    validation.'
