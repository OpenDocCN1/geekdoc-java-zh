  trans: "\n\n```java\nreturn Collections.binarySearch(list, new Supply(name)) !=\
    \ -1;\n}\n}\n```\n\n决策让生活变得艰难。代码也是如此。\n\n有时候，你必须在代码中做出一个艰难的决定——这种决定没有绝对的对错之分，而是有优有劣的。这时，你就需要注释了！\n\
    \n考虑上面的代码。你是否在疑惑程序员为什么要决定使用 `binarySearch`？嗯，至少他为我们留下了一个（有帮助的）注释：它必须很快。\n\n程序员做出了使用\
    \ `binarySearch` 的决定，但通过选择这个选项，你也就拒绝了许多其他选项。这个注释真的是这种做法的良好理由吗？想想你在这里想知道什么。再想想注释给了你什么答案。\n\
    \n以下是我们想知道的：为什么它快？为什么代码必须快？`binarySearch` 方法真的快吗？这种快速解决方案导致了什么成本或权衡？\n\n而注释又说明了什么呢？显然，这些问题并没有答案。那么，我们该如何改进它呢？\n\
    \n看看这个新的且扩展的注释：\n\n```java\nclass Inventory {\n    /** 保持此列表排序。参见 isInStock()。*/\n\
    \    private List<Supply> list = new ArrayList<>();\n\n    void add(Supply supply)\
    \ {\n        list.add(supply);\n        Collections.sort(list);\n    }\n\n   \
    \ boolean isInStock(String name) {\n        /**\n         * 在按名称检查物资可用性的背景下，\n\
    \         * 考虑到超过 1000 物资时面临严重的性能问题，\n         * 我们决定使用二分查找算法\n         * 以在 1\
    \ 秒内获取物品，\n         * 同时接受我们必须保持物资排序。\n         */\n        return Collections.binarySearch(list,\
    \ new Supply(name)) != -1;\n    }\n}\n```\n\n现在的注释信息量大得多。它说明了用例、关注点、解决方案，以及我们必须支付的任何权衡或成本。\n\
    \n这个注释现在不仅更有帮助，而且也更容易编写。我们只是使用了一个模板并填充了必要的部分。来看看它：\n\n```text\n在 [用例] 的背景下，\n\
    面对 [关注点]\n我们决定采用 [选项]\n为了实现 [质量属性]，\n接受 [缺点]。\n```\n\n你可以轻松地识别出这种结构并在代码中找到它。有了这样的模板，你就不可能忘记重要的方面。更重要的是，对于你的同事来说，理解遵循清晰且预定义结构的注释会变得更容易。这就是团队规范发挥作用的地方。\n\
    \n我们的建议：使用这个模板来记录代码中重要的决策或棘手部分。它不需要与你看到的完全一样，但规范是有帮助的。所以，当你第一次在项目中遇到这种情况时，开个团队会议并决定你们的项目模板！并务要标记代码中受影响的地方，就像我们对\
    \ list 字段的注释做的那样。\n\n## 使用示例编写文档\n\n```java\nclass Supply {\n    /**\n     * 代码通用地标识一种物资。\n\
    \     * 它遵循严格的格式，以 S（代表 supply）开头，后面跟着\n     * 五位数字库存编号。接下来是一个反斜杠，\n     * 将国家代码与之前的编号隔开。这个国家代码\n\
    \     * 必须恰好是两个大写字母，代表参与的国家之一（US, EU, RU, CN）。\n     * 之后是一个点以及物资的实际小写名称。\n  \
    \   */\n    static final Pattern CODE = Pattern.compile(\"^S\\\\d{5}\\\\(US|EU|RU|CN)\\\
    \\.[a-z]+$\");\n}\n```\n\n某些编程结构非常强大，但也非常复杂。正则表达式就属于这一类。你应该以易于理解的方式来记录复杂的结构。\n\
    \n在上面，你看到一个很长的正则表达式。它的名字 `CODE` 并不能帮助你理解它是做什么的，但这里还有一段很长的注释。\n\n这看起来似乎是一个不错的解决方案。毕竟，至少有注释，而不仅仅是代码。注释描述了正则表达式将匹配的字符串类型，代码甚至——\n\
    \n问题不在于注释是错误的。问题在于它没有它所应该的那么精确。\n\n注释\n\n你可以像这样给正则表达式添加注释：\n\n```java\nclass Supply\
    \ {\n    /**\n     * 代码通用地标识一种物资。\n     * 格式：S<库存编号>.<名称>\n     *\n     * 有效示例：\n\
    \     * \"S12345.US\", \"S08342.CN\", \"S8888.EU\", \"S12233.RU\"\n     *\n  \
    \   * 无效示例：\n     * \"R12345.RU\" (前缀错误)\n     * \"S01234.AI\" (代码错误)\n     *\
    \ \"S8888.EU \" (末尾空格)\n     */\n    static final Pattern CODE = Pattern.compile(\"\
    ^S\\\\d{5}\\\\(US|EU|RU|CN)\\\\.[a-z]+$\");\n}\n```\n\n上面的注释稍长一点，但它更有结构，并且提供了更多信息。简而言之，它用半自然语言描述了格式。`<inventory-number>`\
    \ 比 `\\d{5}` 要易理解得多。那些仅仅是语法的部分（如 `\\` 或 `.`）不需要进一步解释。\n\n接下来，是具体的示例。通常，一个有效的示例能让你在一秒内理解该表达式。这是代码或长篇解释无法做到的。无效示例在出错时是一个很好的快速参考。\n\
    \n当然，示例通常不能涵盖所有情况。但在 90% 的情况下它们足够了，而且你会发现它们容易理解得多。此外，我们认为你应该把这些示例作为单元测试！\n\n最后，我们还借机会给变量起了一个更有意义的名字，`SUPPLY_CODE`。\n\
    \n## 包的 JavaDoc 结构\n\n```java\n/**\n * 此名为 logistics 的包包含了用于类的类\n * 该包中的 inventory\
    \ 类可以从货船上补充\n * 并处理任何受污染的物资。\n *\n * 该包的类：\n * - Inventory\n * - Supply\n * -\
    \ Hull\n * - CargoShip\n * - SupplyCrate\n *\n * @author A. Lien, H. Uman\n *\
    \ @version 1.8\n * @since 1.7\n */\npackage logistics;\n```\n\nJavaDoc 是 Java\
    \ API 的文档工具。你用它来记录代码中任何公共内容，包括包。\n\n"
- fmt: '

    Here we have the JavaDoc of the `logistics` package. At first glance, the JavaDoc
    comment above looks good, doesn’t it? It starts with a nice short summary sentence
    followed by more details and a list of all the classes in the package. It even
    uses special annotations to mark the `@author`, the `@version` of the current
    release, and the version `@since` when this package was added. But at second and
    third glance, we can spot a lot of issues here!


    The summary sentence is basically superfluous. We might write that if we got paid
    for the number of words, and not for their quality.


    The rest of the description is really too abstract. How would we actually use
    the classes in the package? And is a list of all the classes really needed? No,
    it’s not! JavaDoc generates this automatically anyway.


    Last, the annotations aren’t really useful either. They duplicate information
    that’s in the version control system anyway. Who will keep this in sync with the
    code? Hands up, anyone?


    In summary, most of the information here is superfluous and unnecessary. Instead,
    you can get it from the source directly.


    But what should a package JavaDoc documentation contain? Here’s what we recommend:


    | | */*** |

    | » | Classes for managing an inventory of supplies. |

    | | *** |

    | » | <p> |

    | | The core class is the `{@link logistics.Inventory}` that lets you |

    | | <ul> |

    | | <li> stock it up from a `{@link logistics.CargoShip}`, |

    | | <li> dispose of any contaminated `{@link logistics.Supply}`, |

    | | <li> and search for any `{@link logistics.Supply}` by name. |

    | | </ul> |

    | | *** |

    | » | <p> |

    | | The classes let you unload supplies and immediately dispose of any supply
    |

    | | that was contaminated. |

    | | <pre> |

    ```java

    Inventory inventory = new Inventory();

    inventory.stockUp(cargoShip.unload());

    inventory.disposeContaminatedSupplies();

    inventory.getContaminatedSupplies().isEmpty(); // true

    ```

    </pre> |

    | /* |

    package logistics; |


    There are three parts here, separated by vertical space, and no more superfluous
    information.


    The introductory sentence provides a (very) short summary of what you can achieve
    with the classes in this package.


    The second part describes what you can get done with the most important classes
    in this package. This gives you the starting point for looking deeper into the
    package and also a pretty good idea whether you need it. And by using the `@link`
    annotation, you can simply click on the class and jump directly to it—the JavaDoc
    tool even checks that linked classes exist when it generates the documentation.


    Instead of annotations like `@author`, which capture information that is in the
    version control system anyway, we provide a concrete example of how to implement
    the most important use case in the third part. That’s something a developer can
    use instantaneously.


    A good package documentation can really make a difference in understandability.
    It lowers the entry barrier to all classes in the package. Make sure your API’s
    well documented, and chances are you’ll get more stars on Github!


    ## Structure JavaDoc of Classes and Interfaces


    | | */*** |

    | » | This class represents a cargo ship. |

    | | It can unload a `{@link Stack}` of supplies, load a `{@link Queue}` of supplies,
    and it can show the `remainingCapacity` as a long. |

    | | /* |

    ```java

    interface CargoShip {

    Stack<Supply> unload();

    Queue<Supply> load(Queue<Supply> supplies);

    int getRemainingCapacity();

    }

    ``` |


    Chances are you already know this, but you should document every public class
    or interface with JavaDoc. This is a rule in practically all Java projects.


    The problem is that developers usually write JavaDoc last when their deadline
    is looming. If that happens, it might look like the comment above. And on the
    surface, it looks okay.


    The JavaDoc comment contains both—a short summary and a more detailed description
    of the capabilities of the class. It even uses the `@link` annotation to connect
    to the data structure classes used.


    But similar to the *Structure JavaDoc of Packages*, it’s lacking structure. The
    summary and the details are located right next to each other without vertical
    separation. This makes it harder to identify them as separate. But not only that,
    there are even errors in the comment.


    The summary sentence simply repeats the name of the interface, and that doesn’t
    add much value. Even worse, it’s wrong, because `CargoShip` is an interface and
    not a class as the comment says.


    The detailed description simply restates the method signatures of the interface.
    This can quickly get out of sync with the actual code: `getRemainingCapacity()`
    no longer returns a long value.


    So how can we write a helpful comment that doesn’t just repeat the interface with?


    | | */*** |

    | » | A cargo ship can load and unload supplies. |

    | | *** |

    | » | <p> |

    | | Supplies are loaded sequentially (last-in-out) order. The cargo ship can only
    store supplies up to its capacity. Its capacity is never negative. |

    | | /* |

    ```java

    interface CargoShip {

    Stack<Supply> unload();

    Queue<Supply> load(inventory);

    int getRemainingCapacity();

    }

    ``` |


    Now the summary sentence is clearly standing out at the top of the JavaDoc. And
    it conveys helpful information without just reiterating the name of the interface.


    The following description provides more details about its behavior: using last-in-out,
    for instance.


    So here’s our recommendation for good JavaDoc comments for interfaces and classes:
    First, start with a short and concise summary. Separate this vertically from invariants.
    Don’t just duplicate method signatures.


    And examples always help! So sit down and have a go at an example for how to use
    the interface.


    ## Structure JavaDoc of Methods


    | | interface CargoShip { |

    | | |

    | Stack<Supply> unload(); |

    | | */*** |

    | » | Loads `{@link Supply}`. |

    | | *** |

    | » | @param supplies the supplies of type `{@link Queue}` |

    | » | @return not loaded supplies of type `{@link Queue}` |

    | | /* |

    ```java

    Queue<Supply> load(Queue<Supply> supplies);

    ```

    ```

    } |


    From classes and interfaces (*Structure JavaDoc of Classes and Interfaces*), we
    are now moving one level deeper to JavaDoc comments for methods.


    Methods represent the behavior of objects. By calling methods, you trigger state
    changes and side effects. That’s why documenting methods with JavaDoc is more
    important than any other kind of JavaDoc comments. You can even see that in most
    modern IDEs. They guide the programmer when selecting a method to call with a
    quick extract from the method’s JavaDoc comment. They’ll usually also support
    a quick lookup function for JavaDoc.


    Do you notice the summary sentence and the `@link` annotations used here? As so
    many times before, they don’t add much helpful information in the comment.


    And what about the other two lines in the comment—the input parameter marked with
    `@param` and the return value marked with `@return`? Here the comment describes
    nothing new—it just repeats the method signature.

