    \ other comments are meant to mark the ending of code, such as `End IF`, `End\
    \ FOR`, or `End Inventory class`. This is already clear from the indentation.\n\
    \nThe most critical comment is probably this one: `TODO: check if field is already\
    \ initialized (not null)`. Here, the comment really deviates from the code, so\
    \ this indicates actual problem.\n\nWe can make this a lot more concise! Consider\
    \ this:\n\n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    int countContaminatedSupplies() {\n        if (supplies == null || supplies.isEmpty())\
    \ {\n            // No supplies => no contamination\n            return 0;\n \
    \       }\n\n        int contaminatedCounter = 0;\n        for (Supply supply\
