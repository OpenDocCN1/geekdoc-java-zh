  trans: "\n[content]\n上面的代码显示了一个 `NameTag` 类，它接收人的全名并将其转换为特定标签的格式。例如，“Neil Alden\
    \ Armstrong”会获得标签“ARMSTRONG.”。我们假设全名是以常规格式提供的，由空格或逗号分隔。这要么是在姓之前有名和中间名，要么是反反过来，即姓在名之前并用逗号隔开。\n\
    \n这种格式中的许多假设很容易出错。月球上第二个人的名字是“Edwin Eugene Aldrin, Jr.”。在这里，我们的算法返回了“EDWIN”，这是他的名字。名字是复杂的，还有许多其他可能出现的问题。请看这张表：\n\
    \n| 姓名 | 计算出的标签 | 预期标签 | 是否正确 |\n| --- | --- | --- | --- |\n| Neil Alden Armstrong\
    \ | ARMSTRONG | ARMSTRONG | ✓ |\n| Edwin Eugene Aldrin, Jr. | EDWIN | ALDRIN |\
    \ ✗ |\n| 費俊龍 | 費俊龍 | 費 | ✗ |\n\n那么，当我们的假设被证明是错误的时，我们该怎么办呢？\n\n```java\nclass NameTag\
    \ {\n  final String name;\n\n  NameTag(String name) {\n    Objects.requireNonNull(name);\n\
    \    this.name = name;\n  }\n}\n```\n\n从表格开始，我们可以为这些名称构建单元测试并编写解决方案。但这只是姓名拼写或格式化的少数方式中的一小部分样本，而且它可能是不完全的。在现实场景中，你将遇到更多的组合，以及许多尚未被列出的拼法。\n\
    \n对于所有这一切，有一个更简单、更好的解决方案。你不应该在代码中假设太多，而应该将该任务交给类的使用者。让她直接设置名名标签，并接受任何有效的非空 `String`\
    \ 作为标签名。毕竟，如果你对某种格式不是太了解，最好的办法就是尽可能少地做假设。\n\n这看起来可能很奇怪。但请看看 W3C 对全球个人姓名的概览。名字确实可以非常复杂。每种文化都有自己的命名方式（是的，是多种！）。在没有任何上下文的情况下，无法确定名字的哪个部分是姓。\n\
    \n有些名字，即使是简单的名字，在其他方面也是特殊的，这可能会导致问题。看看 Christopher Null 的案例，他的姓是，嗯，“Null”——这导致他无法在网页上提交许多表单。某些框架和程序将他的名字解释为空引用——并阻止这个可怜的人在表单中输入他的名字。\n\
    \n但错误的列表并不止于此。电子邮件地址、邮政编码、CSV 文件以及我们最喜欢的：时区。正确计算两个本地化时间之间的分钟差是一项极具挑战性的任务。\n\n\
    重点是让你意识到，在编程时应对假设要谨慎。在理论上，它们可能看起来没问题。但在实践中它们往往会失效。在让你的代码受纯假设引导之前，务必想两次，让你的代码准备好面对世界！\n\
    \n## 你学到了什么？\n\n你做到了！本书到此结束了。我们很高兴你与我们共同度了这段旅程，我们希望你记住：旅程本身就是奖励。在这一路上你学了这么多。\n\
    \n我们涵盖了 70 个示例，包括代码风格、注释、命名、异常、测试、面向对象设计和函数式编程，以深化你对高质量代码的理解。\n\n现在，你能够：\n\n*\
    \   快速发现问题的 Java 代码并知道如何改进它。\n*   识别常见类型的 Bug 并知道如何避免它们。\n*   解释为什么某些代码是整洁的，而另一些不是。\n\
    \n不仅如此……在最后一章中，你学习了实际软件开发中许多最佳实践的基本思想。这关乎从静态代码分析、约定的代码格式、自动化构建到最终交付的整个过程。你意识到了并发是让你的程序在现实世界中运行的工具，但同时也意识到在应用它时必须小心。毕竟，能力越大，风险越大，而在这种情况下，还意味着新类型的\
    \ Bug。最后，你学到了在编程时，始终要对你对世界的假设提出挑战。\n\n我们在对比中引用了许多好书，所以如果你渴望了解更多，你知道去何处继续。如果你还没有读过它们，有两本我们想要反复推荐的经典之作：\n\
    \n*   `Effective Java`\n*   `Clean Code`\n\n我们书的副标题承诺帮助你“通过 70 个示例成为 Java 工匠”。显然，这不仅仅是关于读这本书，而是关于将原则应用到实践中。所以请务必练习。当你这样做时，使用书中的对比来帮助你编写更好的代码。注意问题，并在你编写和审查的代码中应用解决方案，因为成为工匠也需要经验！\n\
