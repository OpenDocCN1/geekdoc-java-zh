  trans: "\n\n```java\nfor (SpaceNation nation : nations) {\n    if (nation.getCode().equals(code))\
    \ {\n        return nation;\n    }\n}\nreturn UNKNOWN_NATION;\n```\n\n一种解决方案是抛出异常——例如，`IllegalArgumentException`\
    \ 或 `NoSuchElementException`。这是出现问题的强烈信号。你需要在调用端显式地处理它。\n\n但在这种情况下，我们建议你使用空对象模式（null\
    \ object pattern）。与其返回 `null`，不如返回一个空对象，一个显式表示它没有真实值的对象。在这里，这是一个 `UNKNOWN_NATION`。这样，你就不会干扰程序流并避免了异常：\n\
    \n```java\nString us = SpaceNations.getByCode(\"US\").getName(); // -> \"United\
    \ States\"\nString anguilla = SpaceNations.getByCode(\"AI\").getName(); // ->\
    \ \"\"\n```````\n\n当遇到 `UNKNOWN_NATION` 时该做什么，仍然取决于调用方的决定。区别在于，如果我们想忽略该值或抛出异常，我们现在有了选择。\n\
    \n空对象有不同的形式：空字符串、空集合或类的特殊实例化，你可以在这里找到它们。但无论形式如何，它们都帮助克服了“十亿美元错误”：托尼·霍尔（Tony Hoare）对\
    \ `null` 引用的引入！\n\n在优先使用 Optional 而 Null 中，我们将向你展示如何强制开发者处理值的存在与缺失。\n\n## 你学到了什么？\n\
    \n良好的设计是可行的，不是吗？是细节改善了整体局面，而艺术在于发现手头类中的缺陷。\n\n在大多数时间里，你可能并没有编写屏幕上看到的大部分代码。因此，你可能需要花精力去理解编码人员在其设计决策背后的逻辑。而且在设计代码时，你有很多选择可以做。你的工作是权衡每个解决方案带来的收益和顾虑。你必须通过权衡做出明智的决策，这些权衡会影响代码的属性，如可读性、可测试性、维护性和性能。\n\
    \n后者通常是最少关心的，至少在开始时如此。在编写 Java 时，你通常在编写冗长但易懂的代码——这与在 C 和汇编中经常处理指针算术和位向量形成对比。这并不意味着\
    \ Java 程序很慢。只是在开始阶段，代码的可读性比性能更重要。当你对代码进行基准测试并发现瓶颈时，随时回去优化代码。如果你的代码易于理解，这会容易得多。\n\
    \n这就是本章的核心：通过以更直观且减少误用方式的方式来提高类和方法的可理解性。如果团队中的每个人都遵循这些规则，开发就会变得更容易。\n\n有时你必须将方法和类分成几个部分，而在其他情况下，你必须结合状态和行为。还有如何处理引用。你不应该泄露内部对象的引用，如果你的对象是完全不可变的会更好。这使得它们易于理解，因为每个对象只能有一个状态。最后，一个设计良好的类是灵活的，并引导用户正确使用。你可以通过不返回\
    \ `null` 引用以及使用抽象类型而非非常具体的类型作为输入参数来实现这一点。\n\n大型软件系统的设计极其困难，但已经有了很多探索。如果你想阅读更多相关内容，我们推荐阅读经典书籍[设计模式\
    \ [GHJV95]](#f_0106.xhtml_d2831e141)。\n\n在下一章中，我们将探索 Java 8 引入的一项新特性：使用 Java 流和\
    \ lambda 表达式进行函数式编程。流为更简单的数据处理、更快的计算、并行性和更高的稳定性提供了巨大的潜力。所以，请继续阅读吧！\n\n#### 注脚\n\
    \n[42\n[`martinfowler.com/bliki/ValueObject.html`](https://martinfowler.com/bliki/ValueObject.html)\n\
    \n43\n[`en.wikipedia.org/wiki/Tony_Hoare`](https://en.wikipedia.org/wiki/Tony_Hoare)\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\n面向对象的编程通过封装移动部分使代码变得易于理解。函数式编程通过减少移动部分使代码变得易于理解。\n\
    \nMichael Feathers\n\n# 第 8 章：让你的数据流动起来\n\n优先使用 Lambda 替匿名类\n\n```java\nclass\
    \ Calculator {\n    Map<Double, Double> values = new HashMap<>();\n\n    Double\
    \ square(Double x) {\n        Function<Double, Double> squareFunction = new Function<Double,\
    \ Double>() {\n            @Override\n            public Double apply(Double value)\
    \ {\n                return value * value;\n            }\n        };\n      \
    \  return values.computeIfAbsent(x, squareFunction);\n    }\n}\n```\n\n在 Java\
    \ 8 中，许多现有类（如 `Map`）通过更有实用的方法得到了增强。在上面的代码中，你可以看到其中一个名为 `computeIfAbsent()` 的方法。\n\
    \n从类型来说，`computeIfAbsent()` 需要一个实现了 `Function<Double, Double>` 接口的类实例，这里的方法是 `Double\
    \ apply(Double value)`。Double 类型来自 values 映射内部的类型。程序员实例化了一个匿名类来实现该接口。它被称为匿名类是因为它没有类名，且该类只有一个实例。\n\
    \n第 8 章：让你的数据流动起来\n\n在 16 世纪上半叶，天文学家尼古拉拉斯·哥白尼（Nicolaus Copernicus）发表了他关于日心说的观点——这是一种地球绕太阳运行而非反之的天文学模型。在当时，这是一场基础性的思想革命，改变了我们人类看待宇宙以及我们在宇宙中地位的方式。\n\
    \nJava 8 的发布对 Java 世界来说是一场类似的革命。从那时起，可以在常规 Java 程序中直接使用 lambda 表达式和流的函数式编程范式。在此之前，你只能在\
    \ JVM 上通过 Scala 等不同语言使用函数式编程。现在，你可以在 Java 中轻松地结合所有主要的编程风格。\n\n与天文模型不同，这里没有对错之分。没有单一的编程风格能描述真理。没有一种风格在所有应用场景下都优于其他风格。每种风格都有其优缺点，由开发者发现哪种最适合特定情况。\n\
    \n本章将向你介绍 Java 函数式编程的核心概念。我们将回顾许多对比，向你展示何时函数式风格真正优于命令式风格。你将学习匿名类的优雅替代方案、更高效的数据结构迭代方法，以及如何使用\
    \ Optional 让你的程序变得不那么脆弱。\n\n但函数式编程并非易事，而且存在许多陷阱。这就是为什么我们将解释为什么你对副作用要非常小心，以及你如何在函数式编程中处理异常。你会看到为什么尽管\
    \ Optional 有许多好处，但不应过度使用，以及你如何以最小的摩擦从函数式风格切换回命令式风格。让我们开始吧！\n\n"
- fmt: "\nHowever, anonymous classes have a tendency to bloat up the code. They make\
    \ it considerably larger and add additional levels of indentation. That’s because\
    \ you need to reiterate the interface type and method. The actual computation—in\
    \ our example the single line of code return value `value * value`—is hidden in\
    \ all that verbosity.\n\nWith Java 8, we’ve got an excellent alternative to writing\
    \ anonymous classes.\n\nLambda expressions can improve the code a lot here:\n\n\
    ```java\nclass Calculator {\n    Map<Double, Double> values = new HashMap<>();\n\
    \n    Double square(Double value) {\n        Function<Double, Double> squareFunction\
    \ = factor -> factor * factor;\n        return values.computeIfAbsent(value, squareFunction);\n\
    \    }\n}\n```\n\nNow that’s way shorter and more readable. You can directly spot\
    \ the computation logic, and all the verbosity is gone for good. Much more concise,\
    \ indeed.\n\nLambdas provide implementations for functional interfaces—that is,\
    \ interfaces with a single abstract method. Here, lambdas are a perfect fit, because\
    \ the `Function` interface has only a single abstract method: `apply()`. We can\
    \ write a lambdas in various ways: as one-liners or in multiple lines. Let’s take\
    \ a look.\n\n```java\n// one-liner\nFunction<Double, Double> squareFunction =\
    \ factor -> factor * factor;\n\n// multi-liner\nFunction<Double, Double> squareFunction\
    \ = factor -> {\n    return factor * factor;\n};\n```\n\nHere, you can compare\
    \ the one-liner and the multi-liner directly. The one-liner has no `return` keyword,\
    \ and no curly braces. It’s best for very short and concise glue code. You should\
    \ avoid the multi-liner whenever possible and [Favor Method References Over Lambdas](#f_0086.xhtml_sec.favor_method_references_over_lambdas)\
    \ instead. And there’s more: you can have implicit or explicit type declaration.\n\
    \n```java\n// without type definition and braces\nFunction<Double, Double> squareFunction\
    \ = factor -> factor * factor;\n\n// with type definition and braces\nFunction<Double,\
    \ Double> squareFunction = (Double factor) -> factor * factor;\n```\n\nIn Java,\
    \ you usually have to specify types everywhere explicitly. But for parameters\
    \ of lambda expressions the compiler can figure out the types on its own in (almost)\
    \ all cases: it searches for the single abstract method that the lambda expression\
    \ implements and uses that method signature with its type specifications. This\
    \ is called type inference. We could provide the types here, but why state the\
    \ obvious?\n\nNote that the braces are only optional for a single parameter and\
    \ you have to use them for more than one parameter or if the type is stated explicitly.\n\
    \n## Favor Functional Over Imperative Style\n\n```java\nclass Inventory {\n  \
    \  List<Supply> supplies = new ArrayList<>();\n\n    long countDifferentKinds()\
    \ {\n        List<String> names = new ArrayList<>();\n        for (Supply supply\
    \ : supplies) {\n            if (supply.isUncontaminated()) {\n              \
    \  String name = supply.getName();\n                if (!names.contains(name))\
    \ {\n                    names.add(name);\n                }\n            }\n\
    \        }\n        return names.size();\n    }\n}\n```\n\nWhen it comes to working\
    \ with collections, a functional programming style can be much more readable than\
    \ its imperative sibling.\n\nAbove, you can see a short but relatively complex\
    \ method that does some very common things: it iterates over a collection and\
    \ does a few conditional computations. Even though the code’s short and named\
    \ properly, you need a moment to understand what it’s doing.\n\nThe code is imperative\
    \ in style. It tells the computer what to do and how to do it through loops, conditionals,\
    \ assignments of variables, and method calls. And the machine will simply follow\
    \ that recipe line by line. You can look over its shoulder with a debugger.\n\n\
    But usually, we’re most interested in what the code does and not so much in how\
    \ it reaches its goal. That’s why we invest so much effort in writing good comments\
    \ and choosing good names.\n\nHere, the code clouds the intent of the method through\
    \ its size and the amount of text that we have to read line by line. With lambda\
    \ expressions, we have the option to specify only what we want to get done, without\
    \ caring about the how. That makes for more concise and readable code.\n\nSo how\
    \ can we clarify the code with lambdas?\n\n```java\nclass Inventory {\n    List<Supply>\
    \ supplies = new ArrayList<>();\n\n    long countDifferentKinds() {\n        return\
    \ supplies.stream()\n            .filter(supply -> supply.isUncontaminated())\n\
    \            .map(supply -> supply.getName())\n            .distinct()\n     \
    \       .count();\n    }\n}\n```\n\nAstonishing, isn’t it? Instead of coding the\
    \ how, we just stated the what, and this makes it so shorter. But let’s dissect\
    \ the code line by line.\n\nFirst, we enter `stream()`. That’s the starting operator,\
    \ which converts the collection into a stream and opens up the world of functional\
    \ programming to us!\n\nSecond, we `filter()` out any supplies that are contaminated.\
    \ A filter is like a gate that allows through only supplies that fulfill a condition.\
    \ Type-wise, a filter is a `Predicate` that evaluates something to true or false.\n\
    \nThird, we transform (or `map`) our “boats” on the river. In this case, we take\
    \ out a part of the `Supply`, its name, and throw the rest overboard. In Java\
    \ terms, a `Function` maps a type to another.\n\nFourth, we `count()` the remaining\
    \ elements in the stream. This is a termination operator that ends the stream\
    \ and brings us back into the imperative style.\n\nThat’s still just the surface\
    \ of what you can do with collections and lambda expressions. The JavaDoc of `java.util.stream`\
    \ package already contains a nicely written guide. For a more comprehensive introduction,\
    \ [Functional Programming in Java [Sub14](#f_0106.xhtml_d2831e49) is an excellent\
    \ reference.\n\n## Favor Method References Over Lambdas\n\n```java\nclass Inventory\
    \ {\n    List<Supply> supplies = new ArrayList<>();\n\n    long countDifferentKinds()\
    \ {\n        return supplies.stream()\n            .filter(supply -> !supply.isContaminated())\n\
    \            .map(supply -> supply.getName())\n            .distinct()\n     \
    \       .count();\n    }\n}\n```\n\nLambda expressions like you’ve seen in the\
    \ previous comparison can make your code more readable. But these benefits come\
    \ at a price: you can’t execute lambda expressions partway—you can only run the\
    \ whole stream. That means it’s hard to test parts of lambda expressions as you’d\
    \ want to do in a unit test.\n\nAbove, you can see a slightly modified solution\
    \ from the previous comparison: [Favor Functional Over Imperative Style](#f_0085.xhtml_sec.favor_functional_over_imperative_style)\
    \ that uses a logical negation. It contains two lambda expressions, one `Predicate`\
    \ to filter and one `Function` to map. We defined them inline to make the code\
    \ more concise—they’re not referenced by a variable, so we can’t use them anywhere\
    \ else. They’re only part of their encompassing method.\n"
