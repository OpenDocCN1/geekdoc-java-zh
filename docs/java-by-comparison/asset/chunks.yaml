    Now, the Inventory accepts the Stack directly without any conversion, because
    a Stack is a Collection. The Inventory could now handle loading from Sets, Lists,
    or if need be, even from Vectors and other special-purpose data structures.


    ## Favor Immutable Over Mutable State


