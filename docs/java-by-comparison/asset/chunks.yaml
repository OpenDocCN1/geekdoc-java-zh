  trans: "\n我们经常需要遍历数组、列表或其他数据结构。大多数时候，我们只是从这些数据结构中读取数据——例如，从订单项目列表中创建发票，或者通过名称在列表中搜索项目。但在修改结构时，必须小心。否则，你可能会面临程序崩溃的风险。\n\
    \n这段代码描述了对数据结构的一次非常简单的遍历：一个包含物资的 `List`。如果某个 `Supply` 满足 `isContaminated()`（已污染），库存系统就会将其从\
    \ `List` 中移除。\n\n这段代码看起来完全无害的，不是吗？\n\n尽管代码看起来没问题，但当库存列表中至少有一个 `Supply` 被污染时，它会可靠地崩溃。更糟糕的是，在第一次发生这种情况之前，它运行良好。更过的是，如果所有物资都是干净的，它也能正常工作，这使得\
    \ bug 很难检测。\n\n问题在于，我们在遍历 `supplies` 的 `for` 循环内部调用了 `supplies.remove(supply)`。在这种情况下，`List`\
    \ 接口的标准实现，或者说其他 `Collection` 接口（如 `Set` 或 `Queue`），都会抛出 `ConcurrentModificationException`。我们不能在遍历列表的同时对它进行修改。\n\
    \n`ConcurrentModificationException` 这个名字让很多人怀疑他们的单线程应用程序中是否存在并发问题。这非常具有误导性，因为这里并没有发生实际的并发！相反，我们正在遍历\
    \ `Collection`，而在在此过程中我们又修改了该集合。遗憾的是，Java 中没有编译时检查可以让我们避免这个错误。\n\n那么，你如何在不抛出 `ConcurrentModificationException`\
    \ 的情况下正确这样做呢？\n\n```java\nclass Inventory {\n    private List<Supply> supplies\
    \ = new ArrayList<>();\n\n    void disposeContaminatedSupplies() {\n        Iterator<Supply>\
    \ iterator = supplies.iterator();\n        while (iterator.hasNext()) {\n    \
    \        if (iterator.next().isContaminated()) {\n                iterator.remove();\n\
    \            }\n        }\n    }\n}\n```\n\n针对这个问题的直观解决方案是：我们遍历列表寻找任何污染的物资，然后移除之前发现的物资。将其设为两步法：先遍历，后修改。\n\
    \n这种方法行得通，但需要很多行代码。而且我们需要在遍历期间将污染的物资保存在临时数据结构中。这将消耗额外的时间和内存。\n\n我们这里描述的解决方案使用了另一种遍历方式：一个依赖于物资集合\
    \ `Iterator` 的 `while` 循环。`Iterator` 是我们的救星。它像一个指向列表元素的指针，从第一个元素开始。我们可以通过 `hasNext()`\
    \ 检查是否还有元素，获取 `next()` 元素，并安全地 `remove()` 返回的最后一个元素。\n\n虽然我们不能直接修改 `List`，但迭代器完全能够做到这一点。它的工作是确保遍历期间一切运行正常。\n\
    \n从技术上讲，上一个示例中的 `for-each` 循环基于这种迭代器，但它向程序员隐藏了这一事实。这很不错，因为它降低了代码的复杂性。但也阻止了我们使用迭代器的\
    \ `remove()` 方法。\n\n某些特殊的 `List` 实现如 `CopyOnWriteArrayList` 可以处理遍历期间的修改。但这种特性是有代价的。你真的想在每次添加或删除元素时都复制整个列表吗？从\
    \ Java 8 开始，你还可以使用利用 lambda 的新 `Collection.remove()` 方法。但在使用该方法之前，请务必阅读第 8 章！\n\
    \n## 在遍历期间避免计算密集型操作\n\n```java\nclass Inventory {\n    private List<Supply> supplies\
    \ = new ArrayList<>();\n\n    List<Supply> find(String regex) {\n        List<Supply>\
    \ result = new LinkedList<>();\n        for (Supply supply : supplies) {\n   \
    \         if (Pattern.matches(regex, supply.toString())) {\n                result.add(supply);\n\
    \            }\n        }\n        return result;\n    }\n}\n```\n\n当你遍历数据结构时，需要对你执行的操作类型保持小心。如果你执行了计算密集型操作，它很容易变成性能陷阱。上面的代码展示了这方面的典型例子，通过\
    \ `find()` 方法使用正则表达式定位 `Supply` 对象。\n\n在 Java 或任何其他编程语言中，你都会使用正则表达式（简称为 regex）来构建查询。正则表达式能够对大型文本数据集进行高效查询。为了熟悉正则表达式，我们建议你查查看\
    \ Java API 中的 `java.util.regex.Pattern`。该类是 Java 对正则表达式的表示，并提供了多种构建和执行它们的方法。最直接的方法可能是你在上面代码中看到的：你只需要调用静态方法\
    \ `matches()`，并为其提供一个正则表达式 `String` 和一个要搜索的 `String`。这很方便，但它是一个性能陷阱。在执行期间，Java\
    \ 会获取表达式字符串、正则表达式，并据此构建一个特殊的自动机。该自动机将接受符合模式的字符串，拒绝所有其他字符串。\n\n在 `Pattern.matches(regex,\
    \ supply.toString())` 中，我们既编译了自动机，又尝试将 `supply.toString()` 与其匹配。编译正则表达式自动机会消耗时间和处理能力，就像编译类需要时间一样。通常这是一一次性的工作，但在这里正则表达式每次迭代时都会被编译。注意，Java\
    \ API 中的一些其他非常流行的方法（如 `String.replaceAll()`）行为也是类似的！\n\n那么，你如何防止重复编译同一个正则表达式？\n\
    \n```java\nclass Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\
    \n    List<Supply> find(String regex) {\n        List<Supply> result = new LinkedList<>();\n\
    \        Pattern pattern = Pattern.compile(regex);\n        for (Supply supply\
    \ : supplies) {\n            if (pattern.matcher(supply.toString()).matches())\
    \ {\n                result.add(supply);\n            }\n        }\n        return\
    \ result;\n    }\n}\n```\n\n解决潜在性能陷阱的方案非常简单：确保计算密集型操作发生的频率尽可能低。在这里，你应该对每次方法调用只编译一次正则表达式。毕竟，在循环的每次迭代之间，表达式字符串并没有改变。\n\
    \n幸运的是，我们可以通过 `Pattern` API 轻松实现单次编译。为了做到，我们需要将 `Pattern.matches()` 调用中捆的两个操作分开。首先是表达式的编译，其次是针对搜索字符串的执行。\n\
    \n我们可以通过调用 `Pattern.compile()` 来提取第一步，它会创建一个编译后的正则表达式，即 `Pattern` 实例。这是计算密集型步骤，我们可以将其结果存储在局部变量中。\n\
    \n第二步是执行编译后的表达式，它是简单且快速的。这也是我们对每个 `Supply` 实例都需要执行的操作，因此它需要放入循环体中。\n\n在这里，我们首先为要搜索的\
    \ `String` 创建一个 `Matcher`。这是一个用于不同方式（甚至是迭代方式）搜索的句柄。在这种情况下，我们只需要检查物资是否匹配正则表达式，这可以通过调用\
    \ `matches()` 实现。\n\n总而言之，对于正则表达式来说，微小的修改可能意味着性能上的巨大差异！\n\n## 使用换行分组\n\n```java\n\
    enum DistanceUnit {\n    MILES, KILOMETERS;\n\n    static final double MILE_IN_KILOMETERS\
    \ = 1.60934;\n    static final int IDENTITY = 1;\n}\n```\n"
- fmt: "\n```java\nstatic final double KILOMETER_IN_MILES = 1 / MILE_IN_KILOMETERS;\n\
    \ndouble getConversionRate(DistanceUnit unit) {\n    if (this == unit) {\n   \
    \     return IDENTITY;\n    }\n    if (this == MILES && unit == KILOMETERS) {\n\
    \        return MILE_IN_KILOMETERS;\n    } else {\n        return KILOMETER_IN_MILES;\n\
    \    }\n}\n```\n\n`if` blocks of code are pressed next to each other, you get\
    \ the impression that they belong together. You can improve the readability of\
    \ your code a lot if you separate distinct blocks with new lines.\n\nThe code\
    \ here shows an enum that returns the conversion rate between miles and kilometers.\
    \ Actually, the semantics of that code are fine^([[22](#f_0031.xhtml_FOOTNOTE-22))\
    \ and the problem is quite concealed. We’ve already applied [Replace Magic Numbers\
    \ with Constants](#f_0023.xhtml_sec.replace_magic_numbers_with_constant), so what\
    \ could be wrong?\n\nSimple: What’s missing is space! In particular, `getConversionRate()`\
    \ glues all lines of code together. But is this really a single block or does\
    \ it consist of different parts? We can improve the readability of the code by\
    \ adding empty lines that act as a separator. It’s similar to this book, which\
    \ captures single thoughts or arguments within paragraphs separated by new lines.\n\
    \nWe’ve already separated the enum values from the constants through an empty\
    \ line. But take a look at the two highlighted lines of code. Does this seem right\
    \ to you?\n\nThat leads to the question: where would an empty line make sense?\
    \ Which parts should be separated? Which parts should be kept together?\n\n```java\n\
    enum DistanceUnit {\n\n    MILES, KILOMETERS;\n\n    static final int IDENTITY\
