    |   | **return** nation; |


    |   | } |


    |   | } |


    | » | **return** **null**; |


    |   | } |


    |   | } |


    When there’s no proper value to return in a method call, some programmers just
    return null. This can harm the stability of your program!


    In the code here, we’ve modeled the relationship between country codes and country
    names in the class SpaceNations. The usage is straightforward: you pass a String
    into the method, and it returns the corresponding SpaceNation instance—or null
    if the country code is unknown.


    |   | String us = SpaceNations.getByCode(*"US"*).getName(); |


    |   | *// -> "United States"* |


    | » | String anguilla = SpaceNations.getByCode(*"AI"*).getName(); |


    |   | *// -> NullPointerException* |


    This is error-prone. As you can see, it’s easy to trigger a NullPointerException
