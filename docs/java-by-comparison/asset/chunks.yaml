  trans: "\n\n在这里，我们将之前比较中的 `switch` 语句转换成了独立的 `if` 语句。然而，这里存在一个问题：代码段中的缩进极具误导性。由于\
    \ `if` 后面没有大括号，该条件仅适用于随后的那行。这导致整个方法的行为变得非常“恶意”——`cruiseControl.grantAdminAccess(user);`\
    \ 这一行始终会被执行，并向任何用户授予管理员权限！真是一团糟。\n\n这个问题的根源不在于缩进，而是缺少定义作用域的大括号。本质上，这是我们在避免 switch\
    \ 贯穿中看到过的 `switch` 贯穿（fallthrough）的一种变体。\n\n如果你已经意识到 `switch` 存在这个问题，在面对 `if`\
    \ 时你仍然可能忽视它。即使你缩进正确，也无法保证在截止日期前总是忙碌的冲刺阶段，有人能发现这个 bug。这就是为什么我们建议大家始终使用大括号。\n\n\
    ### 右侧的内容并不总是完美的\n\n实现整洁的代码是很的。正如你可能已经注意到的，我们有时会在两次或多次比较的过程中迭代地改进代码。我们的目标是一次改进一个点，有时为了保持对当前主题的关注而忽略其他的代码质量标准。在阅读右页的解决方案时，请记住这一点。通常，你还有更多可以改进的地方。\n\
    \n看看这个修正后的版本。\n\n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\
    \n    void authorize(User user) {\n        Objects.requireNonNull(user);\n   \
    \     if (user.isUnknown()) {\n            cruiseControl.logUnauthorizedAccessAttempt();\n\
    \        }\n        if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        cruiseControl.grantAdminAccess(user); // SECURITY THREAT\n\
    \    }\n}\n```\n\n在这里，我们按照编译器处理代码的方式添加了大括号。你可以很容易地发现错误：没有条件保护对 `grantAdminAccess()`\
    \ 的调用。得益于大括号，代码现在更具可读性。即使时间紧迫，别人也可能发现这个关键 bug。\n\n现在添加新行代码也更安全了。之前，你可能会忽视没有大括号的事实，并在其中一个块中添加一行代码。\n\
    \n误导性的缩进导致了我们示例中的 bug。这是危险的，特别是因为它结合了“字符越少代码越好”的错误思维。记住：代码越少并不总是更好——可读性高的代码才是！\n\
    \n你可能会认为这种错误是不切实际的，对于安全关键代码来说几乎不会发生。历史事实并非如此；2014 年，Apple 工程师在实现适用于 iOS 的 SSL/TLS\
    \ 协议时遇到过非常类似的 bug。利用该 bug 的攻击者可以监听 Apple 设备的任何安全连接。可怕，不是吗？\n\n习惯性地始终使用大括号是对防止贯穿\
    \ bug 的良好防御，始终使用 IDE 的自动缩进也是如此。但目前这个问题的解决方案还不完美，因为它违反了快速失败和确保代码对称性。请继续读下去！\n\n\
    ### 确保代码对称性\n\n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\
    \n    void authorize(User user) {\n        Objects.requireNonNull(user);\n   \
    \     if (user.isUnknown()) {\n            cruiseControl.logUnauthorizedAccessAttempt();\n\
    \        } else if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        } else if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n\
    \n我们已经强调过几次，可读性对于你的代码来说至关重要。通过对称的方式构建你的条件分支，你将使代码更容易理解、更容易掌握。未来任何维护此类代码的人（很有可能是你）将能够更快地定位功能，并且更容易发现\
    \ bug。\n\n这是对你在避免 switch 贯穿和始终使用大括号中看到的代码的另一种修改。\n\n问题在于缺乏对称性。思考一下。是否所有的分支都表达了类似的内容吗？换句话说，所有的分支都是对称的吗？答案是：不是。\n\
    \n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\n    void\
    \ authorize(User user) {\n        Objects.requireNonNull(user);\n        if (user.isUnknown())\
    \ {\n            cruiseControl.logUnauthorizedAccessAttempt();\n            return;\n\
    \        }\n        if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        } else if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n\
    \n代码中的非对称性源于我们将授权代码与非授权代码混合在了一起。如果我们将它们分成不同的代码块，就可以提高代码的对称性。\n\n每个部分将不同类型的访问封装在单独\
    \ `if` 语句中。首先，我们处理未经授权的访问，记录它并退出方法。然后，我们在一个 `if` 和连接的 `else if` 块中处理另外两种情况。\n\n\
    第二部分现在是对称的，因为它包含了两种类型的授权访问。新的结构让读者更清晰地理解该条件的意图。它再也不可能意外引入我们在避免 switch 贯穿中看到的贯穿\
    \ bug。\n\n这里还有优化空间。例如，`grantAccess()` 在第二个条件的两个分支中以相同的参数被调用。此外，我们可以将这两个条件提取到独立的私有方法中。这将为我们的代码提供更好的指引。\n\
    \n注意，这引申了后面的快速失败，因为我们将未经授权访问的代码移动到了顶部。\n\n### 你学到了什么？\n\n所以你已经读完了第一组比较并来到了这一页。首先，感谢！我们很高兴你能坚持走到这里。你已经学习了关于一个重要主题的很多知识：编写可读的代码。如今我们的大部分精力都花在维护现有代码上，你很少从零开始一个项目。\n\
    \n"
