    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    |   | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected %d, but got %d characters in ''%s''"*, |


    |   | Transmission.MESSAGE_LENGTH, rawMessage.length(), |


    |   | rawMessage)); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected number, but got ''%s'' in ''%s''"*, |


    |   | rawId, rawMessage), e); |


    |   | } |


    |   | } |


    |   | } |


    Exceptions have various constructors and some of them allow us to pass in a Throwable
    as a cause. By passing in a Throwable, we link an exception to its cause, thereby
    building the cause chain. We recommend that you use the constructor Exception(String
    message, Throwable cause) and provide a message as well.


    We’ve seen many kinds of broken cause chains in actual code. Take a look at the
    worst of all:


    |   | } **catch** (NumberFormatException e) { |


    |   | *// BAD! Cause chain interrupted!* |


    |   | **throw** **new** IllegalArgumentException(e.getCause()); |


    |   | } |


    It seems okay. The throw provides e.getCause() as an input parameter and creates
    a cause chain, but it removes one exception from it, namely the NumberFormatException
    because it only links its cause, but not the exception itself. That’s worse than
    no cause chain, because leaving out selected parts can mislead you.


    So if you need to throw an exception within a catch block, just pass in a message
    and the caught exception as a cause directly:


    |   | **throw** **new** IllegalArgumentException(*"Message"*, e); |


    ## Expose Cause in Variable


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected %d, but got %d characters in ''%s''"*, |


    |   | Transmission.MESSAGE_LENGTH, rawMessage.length(), |


    |   | rawMessage)); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected number, but got ''%s'' in ''%s''"*, |


    |   | rawId, rawMessage), e); |


    |   | } |


    |   | } |


    |   | } |


    We sometimes forget that exceptions are also simply classes that can have their
    own fields, methods, and constructors—not just the standard ones. And we can use
    them to expose the cause of an exception in a machine-readable way.


    In the code above, you can spot two issues: there’s duplicate code and concealed
    information.


    The code duplication is where we add rawMessage to the message of the IllegalArgumentException
    twice in the same way: " in ’%s’". This can quickly get inconsistent the larger
    the software grows.


    Concealed information is even more problematic. We encode the rawMessage within
    the message of the exception. This element can’t be extracted easily later on
    when, for instance, we want to inform the end user of our software what kind of
    message caused an error. It’s concealed from any further processing. And we can
    also easily forget to add it to the exception message.


    So how can we make the context of the exception easier to inspect?


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    | » | **throw** **new** MalformedMessageException( |


    |   | String.format(*"Expected %d, but got %d characters"*, |


    |   | Transmission.MESSAGE_LENGTH, rawMessage.length()), |


    |   | rawMessage); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** MalformedMessageException( |


    |   | String.format(*"Expected number, but got ''%s''"*, rawId), |


    |   | rawMessage, e); |


    |   | } |


    |   | } |


    |   | } |


    |   | **final** **class** MalformedMessageException **extends** IllegalArgumentException
    { |


    | » | **final** String raw; |


    |   |  |


    |   | MalformedMessageException(String message, String raw) { |


    |   | **super**(String.format(*"%s in ''%s''"*, message, raw)); |


    |   | **this**.raw = raw; |


    |   | } |


    |   | MalformedMessageException(String message, String raw, Throwable cause) {
    |


    |   | **super**(String.format(*"%s in ''%s''"*, message, raw), cause); |


    |   | **this**.raw = raw; |


    |   | } |


    |   | } |


    We suggest that you define and use a custom exception: the MalformedMessageException
    with its own raw message field. We can obtain that field later on for more detailed
    end-user information or for a more thorough handling of that exception.


    The message still adheres to the template introduced in [*Explain Cause in Message*](#f_0055.xhtml_sec.explain_cause_in_message)—the
    constructor simply appends the raw message. That makes it easier to have a consistent
    exception message. If we extract the message construction into a separate method,
    we also get rid of code duplication.


    You just need to make sure that your custom exceptions stay immutable, which we
    do by declaring the class and its fields final.


    ## Always Check Type Before Cast


    |   | **class** Network { |


    |   |  |


    |   | ObjectInputStream inputStream; |


    |   | InterCom interCom; |


    |   |  |


    |   | **void** listen() **throws** IOException, ClassNotFoundException { |


    |   | **while** (**true**) { |


    |   | Object signal = inputStream.readObject(); |


    | » | CrewMessage crewMessage = (CrewMessage) signal; |


    |   | interCom.broadcast(crewMessage); |


    |   | } |


    |   | } |


    |   | } |


    Sometimes, you have to deal with dynamic object types at runtime. Dynamic objects
    can come from various sources, typically when serialized Java objects are exchanged
    through a channel. Before being able to use them in your program, you’ll need
    to explicitly cast them to a type. If you don’t do this properly, your program
    could crash with some kind of a RuntimeException.


    In the code above, you can see a class that reads messages from an InputStream
    by calling its readObject() method. Such streams in Java are very flexible. For
    example, you can read input from a file or the network. But to make them so flexible,
    they aren’t typed and just provide you with a plain Object. It’s your responsibility
    to turn that into something your program can work with.


    You do this with a cast to the type you expect. In the example above, that’s (CrewMessage).
    This will compile just fine and run smoothly as long as the objects in the stream
    are indeed of that type.'
