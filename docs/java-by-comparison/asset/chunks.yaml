    No, they’re not. Strange things can happen when you use instances of that class
    within frameworks. Most frameworks won’t throw exceptions but will fail silently—or
    simply work in ways you didn’t expect.


    So what do we need to change to turn this class into a JavaBean?


    |   | **class** Astronaut { |


    | » | **private** String name; |


    |   | **private** **boolean** retired; |


    |   |  |


    | » | **public** Astronaut() { |


    |   | } |


    |   |  |


    |   | **public** Astronaut(String name) { |


    |   | **this**.name = name; |


    |   | } |


    |   |  |


    |   | **public** String getName() { |


    |   | **return** name; |


    |   | } |


    |   |  |


    |   | **public** **void** setName(String name) { |


    |   | **this**.name = name; |


    |   | } |


    |   |  |


    | » | **public** **boolean** isRetired() { |


    |   | **return** retired; |


    |   | } |


    |   |  |


    | » | **public** **void** setRetired(**boolean** retired) { |


    |   | **this**.retired = retired; |


    |   | } |


    |   |  |


    |   | } |


    We’ve reworked the code in a number of ways. Now the class above is a valid JavaBean.
    First, we changed the modifiers of the fields to private and the getters and setters
    to public.^([[31]](#f_0051.xhtml_FOOTNOTE-31)) This ensures that frameworks will
    use the getters and setters and won’t circumvent them by accessing fields directly.


    Next, we added a default constructor. Most frameworks need this to create a blank
    instance of a class, which they configure by calling setters to assign values
    to fields. You can easily overlook this part because the default constructor isn’t
    available anymore if you add another one with parameters.


    And last, we renamed the setters and getters to reflect the name of the field.
    If the field has the name foo then the getter and setter should be named getFoo()
    and setFoo(). Be aware that this changes slightly for a boolean field. The name
    of the setter stays the same, but the getter turns to isFoo() instead—it reads
    like a question. Too bad Java doesn’t allow us to put a question mark there.


    One last note: We’re not saying that JavaBeans are a great way of writing code,
    but you’ll have to use them for some frameworks in Java.


    ## Avoid Single-Letter Names


    |   | **class** Inventory { |


    | » | List<Supply> sl = **new** ArrayList<>(); |


    |   |  |


    |   | **boolean** isInStock(String n) { |


    | » | Supply s = **new** Supply(n); |


    |   | **int** l = 0; |


    |   | **int** h = sl.size() - 1; |


    |   |  |


    |   | **while** (l <= h) { |


    | » | **int** m = l + (h - l) / 2; |


    |   | **int** c = sl.get(m).compareTo(s); |


    |   |  |


    |   | **if** (c < 0) { |


    |   | l = m + 1; |


    |   | } **else** **if** (c > 0) { |


    |   | h = m - 1; |


    |   | } **else** { |


    |   | **return** **true**; |


    |   | } |


    |   | } |


    |   |  |


    |   | **return** **false**; |


    |   | } |


    |   | } |


    In most code bases, you’ll often find a variable whose name is just a single letter.
    They’re common because they’re quicker to type and because some IDEs still generate
    names in this way. But they make the code much harder to read. After all, how
    much meaning can you convey in a single letter?


    Let’s look at the code above. It shows an Inventory class with the method isInStock.
    All variables inside this method have single letter names: n, l, h, m, c, s.


    Can you understand what’s going on inside the method? Actually, it’s just an ordinary
    binary search. But we’re having a hard time reading that from the code because
    of the variable names.


    There’s no excuse for using single-letter names. Although some theorists would
    like it to be so, code is much more than pure math. An average programmer reads
    thousands of lines of code per day. This task doesn’t get easier if everywhere
    she looks, variables have the same names, which aren’t connected to the context
    of a piece of code. That’s why we should put meaning in variable names, and we
    can’t do that with just one letter.


    On a side note: The code uses the lowercase letter l and the number 1. They’re
    very hard to distinguish in most fonts. Our advice: Simply avoid the single letter
    l as a variable name. Same for the uppercase O and the number 0.


    So let’s see what difference longer variable names can make.


    |   | **class** Inventory { |


    | » | List<Supply> sortedList = **new** ArrayList<>(); |


    |   |  |


    |   | **boolean** isInStock(String name) { |


    | » | Supply supply = **new** Supply(name); |


    |   | **int** low = 0; |


    |   | **int** high = sortedList.size() - 1; |


    |   |  |


    |   | **while** (low <= high) { |


    | » | **int** middle = low + (high - low) / 2; |


    |   | **int** comparison = sortedList.get(middle).compareTo(supply); |


    |   |  |


    |   | **if** (comparison < 0) { |


    |   | low = middle + 1; |


    |   | } **else** **if** (comparison > 0) { |


    |   | high = middle - 1; |


    |   | } **else** { |


    |   | **return** **true**; |


    |   | } |


    |   | } |


    |   |  |


    |   | **return** **false**; |


    |   | } |


    |   | } |


    Astonishing, isn’t it? Without full names, every reader would have to build and
    remember the following table in her mind:


    | n | name    | m | middle | sl | sortedList |


    | l | low | c | comparison    |  |  |


    | h | high | s | supply |  |  |


    We can just cut out the table by using full names directly in code. And there’s
    no downside to this solution. Some people are afraid that longer names make the
    code less efficient, but this just isn’t true. The compiler replaces the names
    anyway on compilation, and in bytecode, full names and single-letter names look
    the same. The difference is that bytecode’s only read by machines, not by humans.


    As we mentioned above, the code uses binary search. This makes it a perfect candidate
    for more improvements, for example, to [*Document Implementation Decisions*](#f_0037.xhtml_sec.document_implementation_decisions)
    or [*Favor Java API Over DIY*](#f_0030.xhtml_sec.favor_java_api_over_diy). We
    could also [*Replace Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant).


    ## Avoid Abbreviations


    |   | **class** Logbook { |


    | » | **static** **final** Path DIR = Paths.get(*"/var/log"*); |


    |   | **static** **final** Path CSV = DIR.resolve(*"stats.csv"*); |


    |   | **static** **final** String GLOB = *"*.log"*; |


    |   |  |


    | » | **void** createStats() **throws** IOException { |


    |   | **try** (DirectoryStream<Path> dirStr = |


    |   | Files.newDirectoryStream(DIR, GLOB); |


    |   | BufferedWriter bufW = Files.newBufferedWriter(CSV)) { |


    |   | **for** (Path lFile : dirStr) { |


    |   | String csvLn = String.format(*"%s,%d,%s"*, |


    |   | lFile, |


    |   | Files.size(lFile), |


    |   | Files.getLastModifiedTime(lFile)); |


    |   | bufW.write(csvLn); |


    |   | bufW.newLine(); |


    |   | } |


    |   | } |


    |   | } |


    |   | } |


    Abbreviations are one step up from single-letter names, and our world is full
    of them: ASAP, FYI, TGIF, AFK, NASA, FBI, CYA, NYPD, and so on. Many programmers
    like to create their own abbreviations in their code. The obvious problem is that
    they’re the only ones who know those abbreviations—everyone else has to learn
    them first. And learning takes time. That’s why it’s better to avoid abbreviations
    altogether so that others can grasp the code more quickly (and have fewer WTF
    moments^([[32]](#f_0051.xhtml_FOOTNOTE-32))).'
