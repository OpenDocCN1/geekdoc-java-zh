  trans: "\n\n如果你提出了一种编程技术，你应该能够尽可能简洁地证明你的提案比之前的方案好在哪里。“之前/之后”（before/after）的方法能将所有事实摆在台面上：你可以直接将新代码与旧代码进行比较。只有这样，你才能对哪一个更好做出明智的决策。\n\
    \n在学习编程时情况也是如此。当你试图弄如何在 `Java` 中编写代码时，将良好的代码与坏代码进行比较非常有帮助。\n\n我们曾在大学教了六多年的编程。在几次课程后，总会有几个学生问我们：“我该如何进一步提高我的编码能力？”无论如何，这些学生在编程作业中表现都很优异，所以我们给他们一个标准的建议：“读人士的代码。”\n\
    \n老实说，我们的建议并没有什么帮助。开源软件世界有大量的代码，但很难判断从何处开始。初学者很快会被现实项目中专业代码的复杂性所击垮。而且，你如何知道一段源代码是否真的是高水平的呢？即使确实如此，一个只有几个月编程经验的人又该如何将其与一个拙劣的凑合方案（hack）区分来呢？\n\
    \n这这本书派上用场了。它是一本引导你向正确方向阅读的伴读读。我们将通过对比坏代码和好代码，帮助你学习如何编写良好的 `Java` 代码。请放心：多年来，我们见过大量的坏代码和好代码，评审过学术界学生、工业界专业人士以及开源项目贡献者编写的代码。\n\
    \n这让我们回到了“之前/之后”的方法。在书中，我们将为你提供 70 组“之前/之后”的代码片段。这些片段将帮助任何 `Java` 编程初学者提高水平。我们是在大学教本科生\
    \ `Java` 的期间识别出这些片段的。它们都基于我们在批改学生编程作业时遇到的代码。\n\n我们在书中的方法很简单：给出一个代码片段，我们首先解释哪里错了以及为什么。然后，我们将向你展示如何将代码转换为更好的解决方案。\n\
    \n## 谁应该读这本书\n\n这本书是为那些处于初级或中级水平学习 `Java` 编程的人准备的。它也可以作为指导新开发者成为程序员之路程的教师的课堂资源。在这里，我们将为你提供基于较新的\
    \ `Java 8` 语法的资源处理、函数式编程或测试的技巧窍门。\n\n你应该在学习了基础的 `Java` 语法后读这本书——在你能够编写带有条件和循环的小型程序，并掌握了面向对象编程基础知识之后。你应该能够编写出可以编译、运行并解决如\
    \ `FizzBuzz` 这类小任务的代码（参见*你准备好了吗？尝试自我评估*）。你应该能够实现简单的算法，并且应该知道如何使用基础数据结构，如 `list`、`queue`、`stack`\
    \ 或 `map`。显然，在做所有这一切时你应该乐在其中！\n\n如果你在解决一个复杂问题时感到深层的满足感，那么这是一个极佳的开始。但当然，你也知道还有很多东西要学。当你反思自己的技能并不得不承认自己在\
    \ `Java` 编程（甚至是通用的编程）方面缺乏经验时，你就能从这本书中获得最大的收益。这意味着你可能还没有对对整洁代码以及经验丰富的开发者所采用的最佳实践的直觉。\n\
    \n是时候改变这一点了！\n\n当然，如果你已经了解了更多关于 `Java` 代码质量、可读性、可维护性和整洁代码的高级书籍，例如《Effective Java》（Effective\
    \ Java）和《整洁代码》（Clean Code），那么你已经走得很远了。尽管如此，你仍然可以在这里那儿发现一些新东西。\n\n### 使用本书教授整洁代码\n\
    \n如果你作为公司里的资深开发人员向新手教授编程，你肯定意识到我们在书中将过的最佳实践。取决于你正在工作的内容，你甚至对其中某些观点持不同意见。尽管如此，在培训初级开发人员时，这本书可以让你的生活变得更轻松——只需将其作为参考。当你发现徒弟的代码中存在问题时，指引他们看书中对应的条目。你的学生可以针对你暗示的问题阅读一个简洁简单的示例，以及如何获得该问题的解决方案。至少，这为你节省了时间，因为你不需要自己手写解释说明了。\n\
    \n我们为二、三年级 `Java` 学习者开发教学理念的经验，对于学术界的教学也有帮助。这本书是我们结合十五多年在侧重代码质量的高级课程中向本科生教授 `Java`\
    \ 的知识的结晶。它可能不会从零开始教 `Java`，但它可以伴随几乎任何涉及编程任务的课程。特别是，你在评估学生代码时可以使用这本书作为参考，正如我们在研讨会论文中所描述的：*教学整洁代码》（Teaching\
    \ Clean Code）。\n\n### 你准备好了吗？尝试自我评估\n\n如果你是一个新程序员，我们建议你进行简短的自我评估，看看你是否准备好学习书中的内容：`FizzBuzz\
    \ 测试` 或 `使用 FizzBuzz 寻找懂编程的开发者》（Using FizzBuzz to Find Developers who Grok Coding）。有些雇主在面试中使用此测试来确定申请人是否会编程。任务如下：\n\
    \n```\n编写一个 Java 程序，在控制台打印从 1 到 100 的数字。但对于三的倍数，打印 Fizz 而不是数字，对于五的倍数，打印 Buzz。对于既是三又是五的倍数，打印\
    \ FizzBuzz。\n```\n\n为了让测试更有趣，我们在这里稍微扩展一下，确保你能够应用面向对象并使用类和接口。你应该在一个名为 `ConsoleBasedFizzBuzz`\
    \ 的类中实现 `FizzBuzz` 算法，该类实现了 `FizzBuzz` 接口。该接口提供了一个接收两个数字作为参数的方法。在独立的 `Main` 类的\
    \ `main` 方法中，你应该使用 `FizzBuzz` 接口及其 `ConsoleBasedFizzBuzz` 实现从 1 计数到控制台传递的值。在这里，你会在简短模板中看到大结构。\n\
    \n```\ninterface FizzBuzz {\n    void print(int from, int to);\n}\n\nclass ConsoleBasedFizzBuzz\
    \ implements FizzBuzz {\n    // TODO implement FizzBuzz interface\n}\n\nclass\
    \ Main {\n    // TODO use a main method\n    // TODO print fizz buzz from 1 to\
    \ max\n    // TODO max is passed from the console\n}\n```\n\n你应该能在大约 15 分钟内完成这个练习。我们列出的链接之一也包含了挑战的解决方案，你可以与自己的答案进行对比。如果你能做到，你就准备好从书中获得最大收益了。如果不能，别担心！继续读下去。这可能需要你花更长时间，你可能理解某处的比较会比较困难。但如果你通过解决书中的这类小练习来练习编程，你很快就能进入正轨。\n\
    \n"
- fmt: "\nMany good resources are available online for practicing your programming\
    \ skills and getting feedback on your code. Have a look at `codewars.com` or `cyber-dojo`.\
    \ These pages let you train your programming skills in various levels of difficulty.\
    \ If you have a mathematical background, you’ll find solving the problems of `Project\
    \ Euler` quite appealing.\n\nIf, on the other hand, you find the FizzBuzz test\
    \ terribly easy, and your solution compiles and runs within seconds, be aware\
    \ that you might already know some of the practices that we outline in this book.\
    \ You can still get something out of it, of course. We’ve made all the comparisons\
    \ self-contained. So feel free to jump around and skip the parts that you already\
    \ know.\n\n## Why Read This Book?\n\nEvery developer has a number of requirements\
    \ in mind that she considers prerequisites for good or clean code. As long as\
    \ a piece of code doesn’t violate any of these requirements, it qualifies as good\
    \ or clean from the viewpoint of the developer. Different people have different\
    \ requirements. And programming languages differ, of course. But still, for a\
    \ given language, there’s typically a set of “core” requirements and best practices.\
    \ These are aspects that the community of developers recognizes and accepts, even\
    \ if they aren’t written down explicitly. In this book, we’re trying to provide\
    \ you—someone who might not yet be aware of many of the practices in the Java\
    \ community—with a set of best practices for clean code in Java.\n\nAs a beginner,\
    \ your list of requirements for good Java code might be as short as this one:\n\
    \n*   The code must compile.\n*   The output must be correct.\n\nThese items are\
    \ about the functional correctness of your program, but they don’t tell much about\
    \ the quality of your code. An experienced programmer cares about a lot more than\
    \ that, and her checklist is much longer. She just needs a quick glance at a piece\
    \ of code to detect flaws, bad naming, hard-to-test methods, inconsistencies,\
    \ bad practices, and much more.\n\nThe aim of this book is to train your brain\
    \ to internalize more checklist items, helping you on your way to becoming an\
    \ experienced and professional programmer. Each of the items in this book represents\
    \ such a checklist item.\n\n### Conventions Used in This Book\n\nThroughout the\
    \ book, we use a specific structure for explaining each checklist item. We call\
    \ it “comparison,” and we zealously stick to it.\n\nEach comparison has a catchy\
    \ name. This helps you to memorize it for your mental checklist. Take a look at\
    \ the table of contents—it acts as the checklist of this book. The name of a comparison\
    \ makes it easier to talk to other people about what you’ve read. We’ve named\
    \ the comparisons in a way that encourages you to consider them as a recommendation.\
    \ You can also put “You should” in front of a comparison name—for example: You\
    \ should avoid unnecessary comparisons. For the upcoming example, we selected\
    \ the catchy name “Never Trust Your Input.”\n\nDirectly after the name, we’ll\
    \ present a snippet of code and highlight a problem in it. This can be a block\
    \ of several lines or just a single one, like this:\n\n```java\nclass HelloWorld\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello \" + args[0]);\n    }\n}\n```\n\nIn these code snippets, we want to distract\
    \ you as little as possible. That’s why we have to shorten the code a little bit\
    \ to get to the essentials:\n\n1.  We leave out import statements and package\
    \ declarations. The downloadable code contains those declarations, of course—it\
    \ would not compile otherwise.\n2.  We avoid visibility modifiers, such as public\
    \ or private, unless they’re explicitly required.\n\nFollowing the code snippet,\
    \ we explain to you what the problem is. On the way, we provide references to\
    \ further reading, such as JavaDoc, related items, or web pages.\n\nThen, we show\
    \ you the code of a solution and highlight the solution-specific parts.\n\n```java\n\
    class HelloWorld {\n    public static void main(String[] arguments) {\n      \
    \  if (isEmpty(arguments)) {\n            return;\n        }\n        System.out.println(\"\
    Hello \" + arguments[0]);\n    }\n\n    private static boolean isEmpty(String[]\
    \ array) {\n        return (array == null || (array.length == 0);\n    }\n}\n\
    ```\n\nSometimes, there’s very little difference between the problem code and\
    \ the solution. Sometimes, there’s a lot of difference. Either way, the snippets\
    \ themselves should already teach you something—a certain style that helps you\
    \ to produce better code. We deliberately keep each comparison on two pages. The\
    \ left-hand side (or first page) shows the problem, and the right-hand side (or\
    \ second page) shows the solution. This way, you can always compare both code\
    \ snippets without having to flip pages back and forth. This makes it a lot easier\
    \ to learn what an item is about. If you’re reading this book as a PDF with Adobe\
    \ Reader, make sure you’ve enabled two-page view and that the cover page is shown—it’s\
    \ almost like reading from the printed book.\n\n### Why Should I Learn This? There\
    \ Are Static Code Analysis Tools…\n\nYou might be thinking that you already have\
    \ static code analysis tools, such as `Checkstyle`, `FindBugs`, `SpotBugs`, `Error\
    \ Prone`, and `PMD` that detect flaws in your code. So why should you keep reading\
    \ this?\n\nThat’s true for some, but it’s not true for all the problems in this\
    \ book. We’d love to see a tool that can automatically and correctly assess the\
    \ concerns in your code. The existing tools are good, but they’re not perfect.\
    \ Think of them as rigorous, intolerant, nitpicky robots that were taught a set\
    \ of rules and seek any violation. They can’t understand that sometimes there\
    \ are circumstances where you must violate a rule to improve the code. To use\
    \ them successfully, they need to be fine-tuned, and that requires in-depth knowledge\
    \ about code quality and the project. But even then, they can never beat an experienced\
    \ programmer, although they can help so that some issues aren’t missed.\n\nThat’s\
    \ good news, because it means that as an experienced programmer, your skills will\
    \ be in high demand. Tools can check for a lot of things, but they often lack\
    \ a detailed explanation for why something was detected. And they rarely show\
    \ you how to solve a specific issue. Oftentimes, the solution to an issue isn’t\
    \ apparent from the warning of a detection tool, and it’s rare that you can correct\
    \ the code automatically. You have to do this manually, and that process is error\
    \ prone—especially if you’re still learning Java. As a new programmer, the tools\
    \ won’t guide you to a sensible correction. That’s where this book can help you.\n\
    \n## How to Read This Book\n\nIf you’re in your first year of Java, we suggest\
    \ you read the book from start to finish. It starts with rather basic comparisons\
    \ first, but then we’ll advance to more challenging topics, like testing, object-oriented\
    \ design, and functional programming in Java. If you’re more experienced, you\
    \ can probably skip the first two chapters and dig right into the more specialized\
    \ topics.\n\nHere’s a brief outline:\n\n*   In Chapter 1, *Start Cleaning Up*\
    \ we’ll give you general advice on how to write correct code that’s readable and\
    \ understandable. We’ll touch on a lot of things related to the basic Java syntax,\
    \ such as conditions and braces.\n"
  raw: 'Many good resources are available online for practicing your programming skills
    and getting feedback on your code. Have a look at codewars.com^([[4]](#f_0011.xhtml_FOOTNOTE-4))
    or cyber-dojo.^([[5]](#f_0011.xhtml_FOOTNOTE-5)) These pages let you train your
    programming skills in various levels of difficulty. If you have a mathematical
    background, you’ll find solving the problems of Project Euler^([[6]](#f_0011.xhtml_FOOTNOTE-6))
    quite appealing.


    If, on the other hand, you find the FizzBuzz test terribly easy, and your solution
    compiles and runs within seconds, be aware that you might already know some of
    the practices that we outline in this book. You can still get something out of
    it, of course. We’ve made all the comparisons self-contained. So feel free to
    jump around and skip the parts that you already know.


    ## Why Read This Book?


    Every developer has a number of requirements in mind that she considers prerequisites
    for good or clean code. As long as a piece of code doesn’t violate any of these
    requirements, it qualifies as good or clean from the viewpoint of the developer.
    Different people have different requirements. And programming languages differ,
    of course. But still, for a given language, there’s typically a set of “core”
    requirements and best practices. These are aspects that the community of developers
    recognizes and accepts, even if they aren’t written down explicitly. In this book,
    we’re trying to provide you—someone who might not yet be aware of many of the
    practices in the Java community—with a set of best practices for clean code in
    Java.


    As a beginner, your list of requirements for good Java code might be as short
    as this one:


    *   The code must compile.


    *   The output must be correct.


    These items are about the functional correctness of your program, but they don’t
    tell much about the quality of your code. An experienced programmer cares about
    a lot more than that, and her checklist is much longer. She just needs a quick
    glance at a piece of code to detect flaws, bad naming, hard-to-test methods, inconsistencies,
    bad practices, and much more.


    The aim of this book is to train your brain to internalize more checklist items,
    helping you on your way to becoming an experienced and professional programmer.
    Each of the items in this book represents such a checklist item.


    ### Conventions Used in This Book


    Throughout the book, we use a specific structure for explaining each checklist
    item. We call it “comparison,” and we zealously stick to it.


    Each comparison has a catchy name. This helps you to memorize it for your mental
    checklist. Take a look at the table of contents—it acts as the checklist of this
    book. The name of a comparison makes it easier to talk to other people about what
    you’ve read. We’ve named the comparisons in a way that encourages you to consider
    them as a recommendation. You can also put “You should” in front of a comparison
    name—for example: You should avoid unnecessary comparisons. For the upcoming example,
    we selected the catchy name “Never Trust Your Input.”


    Directly after the name, we’ll present a snippet of code and highlight a problem
    in it. This can be a block of several lines or just a single one, like this:


    |   | **class** HelloWorld { |


    |   |  |


    |   | **public** **static** **void** main(String[] args) { |


    | » | System.out.println(*"Hello "* + args[0]); |


    |   | } |


    |   | } |


    In these code snippets, we want to distract you as little as possible. That’s
    why we have to shorten the code a little bit to get to the essentials:


    1.  We leave out import statements and package declarations. The downloadable
    code^([[7]](#f_0011.xhtml_FOOTNOTE-7)) contains those declarations, of course—it
    would not compile otherwise.


    2.  We avoid visibility modifiers, such as public or private, unless they’re explicitly
    required.


    Following the code snippet, we explain to you what the problem is. On the way,
    we provide references to further reading, such as JavaDoc, related items, or web
    pages.


    Then, we show you the code of a solution and highlight the solution-specific parts.


    |   | **class** HelloWorld { |


    |   |  |


    |   | **public** **static** **void** main(String[] arguments) { |


    | » | **if** (isEmpty(arguments)) { |


    |   | **return**; |


    |   | } |


    |   |  |


    | » | System.out.println(*"Hello "* + arguments[0]); |


    |   | } |


    |   |  |


    | » | **private** **static** **boolean** isEmpty(String[] array) { |


    |   | **return** (array == **null**) &#124;&#124; (array.length == 0); |


    |   | } |


    |   | } |


    Sometimes, there’s very little difference between the problem code and the solution.
    Sometimes, there’s a lot of difference. Either way, the snippets themselves should
    already teach you something—a certain style that helps you to produce better code.
    We deliberately keep each comparison on two pages. The left-hand side (or first
    page) shows the problem, and the right-hand side (or second page) shows the solution.
    This way, you can always compare both code snippets without having to flip pages
    back and forth. This makes it a lot easier to learn what an item is about. If
    you’re reading this book as a PDF with Adobe Reader, make sure you’ve enabled
    two-page view and that the cover page is shown—it’s almost like reading from the
    printed book.


    ### Why Should I Learn This? There Are Static Code Analysis Tools…


    You might be thinking that you already have static code analysis tools, such as
    Checkstyle,^([[8]](#f_0011.xhtml_FOOTNOTE-8)) FindBugs,^([[9]](#f_0011.xhtml_FOOTNOTE-9))
    SpotBugs,^([[10]](#f_0011.xhtml_FOOTNOTE-10)) Error Prone,^([[11]](#f_0011.xhtml_FOOTNOTE-11))
    and PMD,^([[12]](#f_0011.xhtml_FOOTNOTE-12)) that detect flaws in your code. So
    why should you keep reading this?


    That’s true for some, but it’s not true for all the problems in this book. We’d
    love to see a tool that can automatically and correctly assess the concerns in
    your code. The existing tools are good, but they’re not perfect. Think of them
    as rigorous, intolerant, nitpicky robots that were taught a set of rules and seek
    any violation. They can’t understand that sometimes there are circumstances where
    you must violate a rule to improve the code. To use them successfully, they need
    to be fine-tuned, and that requires in-depth knowledge about code quality and
    the project at hand.^([[13]](#f_0011.xhtml_FOOTNOTE-13)) But even then, they can
    never beat an experienced programmer, although they can help so that some issues
    aren’t missed.


    That’s good news, because it means that as an experienced programmer, your skills
    will be in high demand. Tools can check for a lot of things, but they often lack
    a detailed explanation for why something was detected. And they rarely show you
    how to solve a specific issue. Oftentimes, the solution to an issue isn’t apparent
    from the warning of a detection tool, and it’s rare that you can correct the code
    automatically. You have to do this manually, and that process is error prone—especially
    if you’re still learning Java. As a new programmer, the tools won’t guide you
    to a sensible correction. That’s where this book can help you. We’ll raise your
    awareness for common programming errors that many people make when learning Java.


    ## How to Read This Book


    If you’re in your first year of Java, we suggest you read the book from start
    to finish. It starts with rather basic comparisons first, but then we’ll advance
    to more challenging topics, like testing, object-oriented design, and functional
    programming in Java. If you’re more experienced, you can probably skip the first
    two chapters and dig right into the more specialized topics.


    Here’s a brief outline:


    *   In Chapter 1, [*Start Cleaning Up*](#f_0012_split_001.xhtml_chp.boolean-condition)
    we’ll give you general advice on how to write correct code that’s readable and
    understandable. We’ll touch on a lot of things related to the basic Java syntax,
    such as conditions and braces.'
