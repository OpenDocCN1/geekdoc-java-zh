  trans: "\n\n```java\nstatic final double KILOMETER_IN_MILES = 1 / MILE_IN_KILOMETERS;\n\
    \ndouble getConversionRate(DistanceUnit unit) {\n    if (this == unit) {\n   \
    \     return IDENTITY;\n    }\n    if (this == MILES && unit == KILOMETERS) {\n\
    \        return MILE_IN_KILOMETERS;\n    } else {\n        return KILOMETER_IN_MILES;\n\
    \    }\n}\n```\n\n`if` 代码块紧挨在一起，会让你产生它们属于同一个整体的印象。如果你能通过换行将不同的块隔离开，可以大大提高代码的可读性。\n\
    \n这里的代码显示了一个返回英里和公里之间转换率的枚举。实际上，这段代码的语义是没问题的^([22)，而且问题非常隐藏。我们已经应用了用常量替换魔术数字，那么哪里可能出问题呢？\n\
    \n很简单：缺失的是空间！特别是 `getConversionRate()` 将所有代码行粘在了一起。但这真的是一个单一块吗？还是它由不同的部分组成？我们可以通过添加空行作为分隔符来提高代码的可读性。这与本书类似，它在通过换行分隔的段落中捕捉单一的想法或论点。\n\
    \n我们已经通过空行将枚举值与常量分离开来。但请看那两行高亮的代码。你觉得这对的吗？\n\n这引出了一个问题：在哪里添加空行是有意义的？哪些部分应该被隔开？哪些部分应该保持在一起？\n\
    \n```java\nenum DistanceUnit {\n\n    MILES, KILOMETERS;\n\n    static final int\
    \ IDENTITY = 1;\n\n    static final double MILE_IN_KILOMETERS = 1.60934;\n   \
    \ static final double KILOMETER_IN_MILES = 1 / MILE_IN_KILOMETERS;\n\n    double\
    \ getConversionRate(DistanceUnit unit) {\n        if (this == unit) {\n      \
    \      return IDENTITY;\n        }\n\n        if (this == MILES && unit == KILOMETERS)\
    \ {\n            return MILE_IN_KILOMETERS;\n        } else {\n            return\
    \ KILOMETER_IN_MILES;\n        }\n    }\n}\n```\n\n在我们的解决方案中，我们通过换行将代码的部分部分隔离开。\n\
    \n首先，我们把 `IDENTITY` 字段与其他常量隔离开。这个字段应该是独立的，因为律不依赖于特定的单位，并且比英里和公里之间的两个转换率更抽象。\n\n\
    在 `getConversionRate()` 中，我们将两个 `if` 语句相互隔离开。我们这样做是因为它们检查的是不同的内容：第一个执行等性检查，第二个执行转换。空行通过垂直方向的分隔，让这一点对读者来说更加明显。\n\
    \n根据经验法则，你应该尝试将相关的代码和概念组合在一起，并通过空行将不同的组相互隔开。\n\n垂直空间的概念更进一步。Robert C. Martin 在他的书[整洁代码\
    \ [Mar08]](#f_0106.xhtml_d2831e398)中使用报纸的比喻来描述垂直格式化。良好的文章从标题（类名）开始，经过章节标题（公共成员、构造函数和方法），一直深入到具体的细节（私有方法）。如果你这样构建你的代码，你会发现即使只是滚动查看代码，也更容易理解一个类。很有可能，在类中定位功能也会更容易。\n\
    \n## 优先使用格式而非拼接\n\n```java\nclass Mission {\n\n    Logbook logbook;\n    LocalDate\
    \ start;\n\n    void update(String author, String message) {\n        LocalDate\
    \ today = LocalDate.now();\n        String month = String.valueOf(today.getMonthValue());\n\
    \        String formattedMonth = month.length() < 2 ? \"0\" + month : month;\n\
    \        String entry = author.toUpperCase() + \": [\" + formattedMonth + \"-\"\
    \ +\n        today.getDayOfMonth() + \"-\" + ChronoUnit.DAYS.between(start, today)\
    \ + 1 + \"] \" +\n        message + System.lineSeparator();\n        logbook.write(entry);\n\
    \    }\n}\n```\n\n`if` 代码块紧挨在一起，会让你产生它们属于同一个整体的印象。如果你能通过换行将不同的块隔离开，可以大大提高代码的可读性。\n\
    \n这里的代码显示了一个返回英里和公里之间转换率的枚举。实际上，这段代码的语义是没问题的^([22)，而且问题非常隐藏。我们已经应用了用常量替换魔术数字，那么哪里可能出问题呢？\n\
    \n很简单：缺失的是空间！特别是 `getConversionRate()` 将所有代码行粘在了一起。但这真的是一个单一块吗？还是它由不同的部分组成？我们可以通过添加空行作为分隔符来提高代码的可读性。这与本书类似，它在通过换行分隔的段落中捕捉单一的想法或论点。\n\
    \n我们已经通过空行将枚举值与常量分离开来。但请看那两行高亮的代码。你觉得这对的吗？\n\n这引出了一个问题：在哪里添加空行是有意义的？哪些部分应该被隔开？哪些部分应该保持在一起？\n\
    \n格式化字符串有助于解决这个问题，而且它们在几乎任何编程语言中可用——而不仅仅是 Java。关键在于将字符串的布局（如何打印）与数据（打印什么）隔离开。\n\
    \n"
- fmt: "\n```java\nclass Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\
    \n    int getQuantity(Supply supply) {\n        if (supply == null) {\n      \
    \      throw new NullPointerException(\"supply must not be null\");\n        }\n\
    \n        int quantity = 0;\n        for (Supply supplyInStock : supplies) {\n\
    \            if (supply.equals(supplyInStock)) {\n                quantity++;\n\
    \            }\n        }\n\n        return quantity;\n    }\n}\n```\n\nIn the\
    \ early days of programming, you had to do everything by yourself. In `C`, for\
    \ instance, you still need to create a `String` using a `char[]` or implement\
    \ your own `list`. You had to do this for all kinds of data structures and algorithms.\
    \ Although this is a nice exercise, it’s also time-consuming and error-prone.\n\
    \nTimes have changed. The `Java API` is huge, and it comes with many classes that\
    \ can help you get the job done, such as `String` or `List`. Instead of reimplementing\
    \ functionality from the `API`, you should reuse it whenever possible. Experts\
    \ have written and optimized the `Java API` over time, resulting in a fast and\
    \ practically bug-free standard library.\n\nYou already know the inventory system\
    \ from [*Avoid Collection Modification During Iteration](#f_0026.xhtml_sec.avoid_collection_modification_during_iteration)\
    \ and other comparisons. Above, you can see the `getQuantity()` method, which\
    \ informs us about the quantity of a `Supply` in stock.\n\nAt a first glance,\
    \ the code looks good. The method validates its input parameter to avoid null\
    \ values. It uses an abstract type for its internal data structure, as we recommend\
    \ in [*Favor Abstract Over Concrete Types](#f_0077.xhtml_sec.favor_abstract_over_concrete_types).\
    \ It also iterates over the data structure with a `for-each` loop instead of a\
    \ regular `for` loop, as we recommend in [*Favor For-Each Over For Loops](#f_0025.xhtml_sec.favor_foreach_over_for).\n\
    \nWe can vastly improve this code—it’s much more verbose than it needs to be.\n\
    \n```java\nclass Inventory {\n    private List<Supply> supplies = new ArrayList<>();\n\
    \n    int getQuantity(Supply supply) {\n        Objects.requireNonNull(supply,\
    \ \"supply must not be null\");\n\n        return Collections.frequency(supplies,\
    \ supply);\n    }\n}\n```\n\nNow that’s much shorter! This version yields the\
    \ same result, but it uses the functionality of the `Java API` instead of custom\
    \ code. Now that it’s shorter, it’s much more readable and easier to understand.\n\
    \nThe utility class `Collections` provides a `frequency()` method that counts\
    \ the number of occurrences of objects in a `Collection`. Plus, we have used the\
    \ method `requireNonNull()` from the utility class `Objects` you’ve seen before,\
    \ for example in [*Avoid Switch Fallthrough](#f_0018.xhtml_sec_avoid_switch_fall_through).\
    \ This method throws a `NullPointerException` with a message if an object is `null`.\
    \ With these methods, we’re able to condense twelve lines of code into a single\
    \ return statement!\n\nThe `Java class library`, the `Java API` for short, is\
    \ huge. It contains thousands of classes with all sorts of useful functionality\
    \ that’s available to you at any given point in your code. It also offers several\
    \ utility classes, which you can usually spot by an appended `s`, such as the\
    \ `Collections` class for `Collection`-related helper methods or `Objects` for\
    \ general-purpose operations on `Objects`.\n\nYou can often solve problems in\
    \ your code much more concisely if you know the `API`. And just as important,\
    \ the `API` received and receives extensive testing worldwide, which is probably\
    \ more than you can do. Chances are that your code is more prone to bugs than\
    \ the `API`.\n\nKnowing the `API` well is what makes a true `Java professional`.\
    \ You save time if you don’t reimplement (and test) functionality that’s already\
    \ there.\n\nThere is a lot more functionality beyond what we have shown here—such\
    \ as the conversion of time values with `TimeUnit`. We encourage you to explore\
    \ the `Java API`!\n\n## What Have You Learned?\n\nYou’ve already finished one\
    \ more chapter. Welcome to the next level!\n\nNow you know how to deal with magic\
    \ numbers, and you can replace them with constants or enums as the situation requires.\
    \ You’re able to implement iteration in the way that best fits your needs, and\
    \ you’ll stay clear of exceptions or performance pitfalls while you’re at it.\
    \ You know how to format your code in a readable way, and you’ve seen how the\
    \ `Java API` can help you to make it more concise and efficient.\n\nThat last\
    \ part’s important, and the learning doesn’t stop here. The `Java API` is huge—really\
