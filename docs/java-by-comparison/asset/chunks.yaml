    |   | } |


    |   | } |


    |   |  |


    | » | **return** quantity; |


    |   |  |


    |   | } |


    |   | } |


    In the early days of programming, you had to do everything by yourself. In C,
    for instance, you still need to create a String using a char[] or implement your
    own list. You had to do this for all kinds of data structures and algorithms.
    Although this is a nice exercise, it’s also time-consuming and error-prone.


    Times have changed. The Java API is huge, and it comes with many classes that
    can help you get the job done, such as String or List. Instead of reimplementing
    functionality from the API, you should reuse it whenever possible. Experts have
    written and optimized the Java API over time, resulting in a fast and practically
    bug-free standard library.


    You already know the inventory system from [*Avoid Collection Modification During
    Iteration*](#f_0026.xhtml_sec.avoid_collection_modification_during_iteration)
    and other comparisons. Above, you can see the getQuantity() method, which informs
    us about the quantity of a Supply in stock.


    At a first glance, the code looks good. The method validates its input parameter
    to avoid null values. It uses an abstract type for its internal data structure,
    as we recommend in [*Favor Abstract Over Concrete Types*](#f_0077.xhtml_sec.favor_abstract_over_concrete_types).
    It also iterates over the data structure with a for-each loop instead of a regular
    for loop, as we recommend in [*Favor For-Each Over For Loops*](#f_0025.xhtml_sec.favor_foreach_over_for).


    We can vastly improve this code—it’s much more verbose than it needs to be.


    |   | **class** Inventory { |


    |   |  |


    |   | **private** List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | **int** getQuantity(Supply supply) { |


    | » | Objects.requireNonNull(supply, *"supply must not be null"*); |


    |   |  |


    | » | **return** Collections.frequency(supplies, supply); |


    |   | } |


    |   | } |


    Now that’s much shorter! This version yields the same result, but it uses the
    functionality of the Java API instead of custom code. Now that it’s shorter, it’s
    much more readable and easier to understand.


    The utility class Collections provides a frequency() method that counts the number
    of occurrences of objects in a Collection. Plus, we have used the method requireNonNull()
    from the utility class Objects you’ve seen before, for example in [*Avoid Switch
    Fallthrough*](#f_0018.xhtml_sec.avoid_switch_fall_through). This method throws
    a NullPointerException with a message if an object is null. With these methods,
    we’re able to condense twelve lines of code into a single return statement!


    The Java class library, the Java API for short, is huge. It contains thousands
    of classes with all sorts of useful functionality that’s available to you at any
    given point in your code. It also offers several utility classes, which you can
    usually spot by an appended s, such as the Collections class for Collection-related
    helper methods or Objects for general-purpose operations on Objects.


    You can often solve problems in your code much more concisely if you know the
    API. And just as important, the API received and receives extensive testing worldwide,
    which is probably more than you can do. Chances are that your code is more prone
    to bugs than the API.


    Knowing the API well is what makes a true Java professional. You save time if
    you don’t reimplement (and test) functionality that’s already there.


    There is a lot more functionality beyond what we have shown here—such as the conversion
    of time values with TimeUnit. We encourage you to explore the Java API!


    ## What Have You Learned?


    You’ve already finished one more chapter. Welcome to the next level!


    Now you know how to deal with magic numbers, and you can replace them with constants
    or enums as the situation requires. You’re able to implement iteration in the
    way that best fits your needs, and you’ll stay clear of exceptions or performance
    pitfalls while you’re at it. You know how to format your code in a readable way,
    and you’ve seen how the Java API can help you to make it more concise and efficient.


    That last part’s important, and the learning doesn’t stop here. The Java API is
    huge—really huge. In Java 9, there are more than 4,000 public API classes alone.
    Each one of these has a purpose that can help you. We don’t recommend that you
    go through all of them right now. But when you’re programming, ask yourself now
    and then, “Could this piece of code be useful in a different context as well?”
    If the answer is yes, then there’s a chance that you can find a helpful class
    in the Java API. So you should try searching the API at least briefly.


    Eventually, you’ll learn about other helpful classes, similar to Collections or
    Objects. And you’ll get more and more proficient in using them over time. In the
    end, knowing your API is what makes a true professional.


    In the next chapter, we’ll get more specific and zoom in on one particular aspect
    of programming: code comments. They don’t influence the execution of your code,
    which is why many programmers don’t pay them much respect. But good comments can
    mean a huge difference to the readability of your code. As we’ve mentioned now
    and then (read: all of the time), that’s really important. So make sure that you
    can apply comments in the right way!


