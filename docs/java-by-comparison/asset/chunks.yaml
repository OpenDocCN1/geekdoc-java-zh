    }\n```\n\n我们在新版本中解决了所有问题：首先，我们检查所有参数是否为空值。之后，我们检查特定域的限制。\n\n此外，我们更改了检查顺序，以反映方法签名中参数的顺序。这是一个良好的做法，因为参数验证的合理排序可以提高阅读的流畅性。你也不可能忘记验证其中一个参数。最后，我们使用了内置方法来检查\
    \ `String` 是否为空。\n\n你可能会问自己：这种程度的参数验证总是必要的吗？并不是。\n\n根据经验法则，对于 `public`、`protected`\
    \ 和 `default` 方法需要进行参数验证。这是因为代码的任何部分都可以访问它们，而你可能无法控制这种访问是如何发生的。\n\n相反，当你构建 `private`\
    \ 方法时，你能够确保永远不会向它们传递 `null`。因此在这种情况下，你不需要进行过多的验证。\n\n### 文件打开选项\n\n你可能好奇这些 `StandardOpenOptions`\
    \ 意味着什么。它们指定了 `Files.write()` 方法的行为。这些名称直观易懂，但你应该意识到你可以组合使用它们。\n\n这是很有用的，因为如果也设置了\
    \ `CREATE` 标志，那么我们就不需要担心想要 `APPEND` 的文件在文件系统中是否已经存在。\n\n## 避免 switch 穿透（Switch\
    \ Fallthrough）\n\n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\
    \n    void authorize(User user) {\n        Objects.requireNonNull(user);\n   \
    \     switch (user.getRank()) {\n            case UNKNOWN:\n                cruiseControl.logUnauthorizedAccessAttempt();\n\
    \            case ASTRONAUT:\n                cruiseControl.grantAccess(user);\n\
    \                break;\n            case COMMANDER:\n                cruiseControl.grantAccess(user);\n\
    \                cruiseControl.grantAdminAccess(user);\n                break;\n\
    \        }\n    }\n}\n```\n\n某些编程语言构造因为多年来引起的许多 Bug 而臭名昭著。其中之一就是 `switch`，在使用它时你应该小心。\n\
    \n你在这里看到的 `authorizeUser()` 方法验证了它的参数并检查了空引用。它使用了 `Objects.requireNonNull()`，这是\
    \ Java API 中一个方便的参数验证方法，它会在输入为 null 时触发异常。但 `authorizeUser()` 仍然包含一个经典的 Bug：switch\
    \ 穿透。\n\n这个 Bug 出现在 `switch` 语句的第一个 `case` 中。在 `case` 结束没有 `break` 语句。这意味着 `switch`\
    \ 将继续执行下一个 `case`——它会向下穿透并始终执行 `cruiseControl.grantAccess()`。\n\n`switch` 语句因这种行为而臭名昭著。它一直继续执行直到遇到\
    \ `break` 语句或块结束。你在任何 C 风格语言中都能找到 `switch` 的这种执行语义。此外，Java 是从 C 继承而来的。\n\n`switch`\
    \ 之所以这样是因为这允许你编写更紧凑、字符更少的代码，通过这种方式避免评估几个条件表达式。而且从 Java 7 开始，`switch` 语句除了整数和枚举外，还支持字符串。\n\
    \n但多年来，它弊大于利，相当多的 Bug 是由于忘记写 `break` 导致的。看看这个无 Bug 的代码。\n\n```java\nclass BoardComputer\
    \ {\n    CruiseControl cruiseControl;\n\n    void authorize(User user) {\n   \
    \     Objects.requireNonNull(user);\n        switch (user.getRank()) {\n     \
    \       case UNKNOWN:\n                cruiseControl.logUnauthorizedAccessAttempt();\n\
    \                break;\n            case ASTRONAUT:\n                cruiseControl.grantAccess(user);\n\
    \                break;\n            case COMMANDER:\n                cruiseControl.grantAccess(user);\n\
    \                cruiseControl.grantAdminAccess(user);\n                break;\n\
    \        }\n    }\n}\n```\n\n修复无意的 switch 穿透很容易：确保每个 `case` 结束处都有 `break` 语句。我们在代码示例中已经这样做。现在代码没有\
    \ Bug 了——但 `switch` 在这里真的是完美的选择吗？并不是！\n\n在示例中，`switch` 混合了本该分离的两个关注点：它将未经授权的授权访问合并到一个代码块中。\n\
    \n根据经验法则，你应该将不同的关注点放在不同的代码块中。首先，这样做会让代码更具可读性。其次，发生 switch 穿透等意外 Bug 的概率更小。\n\n\
    你会发现很难用 `switch` 实现这种关注点的分离。这就是为什么我们更倾向于使用 `if` 语句。但即使在那里，switch 穿透也可能困扰我们，正如你将在后面看到的。\n\
    \n如果增加了一个等级怎么办？你必须调整这个条件判断，但这很容易被忘记。代码仍会运行，而你甚至不会察觉漏掉了什么！这就是为什么你应该始终有一个捕获未显式编码值的回退分支。`switch`\
    \ 语句通过 `default` 情况内置了这一功能。或者，你也可以抛出一个 `AssertionError` 以防万无。\n\n### 始终使用大括号\n\
    \n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\n    void\
    \ authorize(User user) {\n        Objects.requireNonNull(user);\n        if (user.isUnknown())\
    \ {\n            cruiseControl.logUnauthorizedAccessAttempt();\n        }\n  \
    \      if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n\
    \n"
- fmt: "\nHere we’ve translated the `switch` statement from the previous comparison\
    \ into separate `if` statements. There’s one problem, though. The indentation\
    \ in the snippet is perilously misleading. There are no curly braces after the\
    \ `if`, so the condition applies only to the subsequent line. That makes the whole\
    \ method behave maliciously—the line `cruiseControl.grantAdminAccess(user);` is\
    \ always executed and grants admin access to any user! What a mess.\n\nThe root\
    \ of this problem isn’t the indentation. It’s the missing curly braces that define\
    \ the scoping. Essentially, this is a variant of the `switch` fallthrough that\
    \ we’ve seen in [Avoid Switch Fallthrough](#f_0018.xhtml_sec.avoid_switch_fall_through).\n\
    \nIf you’re aware of this problem for a `switch`, you might still overlook it\
    \ with an `if`. Even if you indent correctly, there’s no guarantee that anyone\
    \ would spot the bug during the always hectic crunch times before deadlines. This\
    \ is why we advise everybody to always use braces.\n\n### The Right-Hand Side\
    \ Is Not Always Meant to Be Perfect\n\nClean code is hard to achieve. As you might\
    \ have already noticed, we sometimes iteratively improve the code in the course\
    \ of two or more comparisons. We aim to improve one thing at a time, sometimes\
    \ ignoring other code quality criteria to keep the focus on the current topic.\
    \ Keep this in mind when reading the solutions on the right-hand page. Oftentimes,\
    \ there’s still something more that you can improve.\n\nTake a look at the corrected\
    \ version.\n\n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\
    \n    void authorize(User user) {\n        Objects.requireNonNull(user);\n   \
    \     if (user.isUnknown()) {\n            cruiseControl.logUnauthorizedAccessAttempt();\n\
    \        }\n        if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        cruiseControl.grantAdminAccess(user); // SECURITY THREAT\n\
    \    }\n}\n```\n\nHere we’ve added the curly braces in the way that the compiler\
    \ treats the code. You can spot the error easily: no condition guards the call\
    \ of `grantAdminAccess()`. Thanks to the curly braces, the code is much more readable\
    \ now. Even if time is short, it’s much more likely that someone will spot this\
    \ critical bug.\n\nIt’s also safer to add new lines of code now. Before, you might\
    \ have overlooked the fact that there are no curly braces and added a line into\
    \ one of the blocks.\n\nMisleading indentation caused the bug in our example.\
    \ That’s dangerous, especially because it was combined with the misplaced thinking\
    \ that fewer characters mean better code. Remember: Less code is not always better—more\
    \ readable code is!\n\nYou might argue that such an error is unrealistic and would\
    \ hardly ever happen in practice for security-critical code. History tells otherwise;\
    \ in 2014, Apple engineers had a very similar bug in the implementation of Apple’s\
    \ SSL/TLS protocol for iOS. Attackers exploiting that bug could eavesdrop to any\
    \ secure connection of an Apple device. Scary, isn’t it?\n\nAlways using curly\
    \ braces out of routine is a good defense against fallthrough bugs, as is always\
    \ the using auto-indentation of your IDE. But the solution to this problem isn’t\
    \ perfect yet, because it violates [Fail Fast](#f_0053.xhtml_sec.fail_fast) and\
    \ [Ensure Code Symmetry](#f_0020.xhtml_sec.ensure_code_symmetry). Be sure to read\
    \ on!\n\n### Ensure Code Symmetry\n\n```java\nclass BoardComputer {\n    CruiseControl\
    \ cruiseControl;\n\n    void authorize(User user) {\n        Objects.requireNonNull(user);\n\
    \        if (user.isUnknown()) {\n            cruiseControl.logUnauthorizedAccessAttempt();\n\
    \        } else if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        } else if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n\
    \nWe’ve emphasized a few times already that understandability is absolutely critical\
    \ for your code. By structuring your conditional branches in a symmetrical way,\
    \ you’ll make the code easier to understand and easier to grasp. Whoever maintains\
    \ such code in the future (chances are it’ll be you) will be able to locate features\
    \ more quickly, and it’ll be easier to spot bugs.\n\nHere is another modification\
    \ of the code you have seen in [Avoid Switch Fallthrough](#f_0018.xhtml_sec.avoid_switch_fall_through)\
    \ and [Always Use Braces](#f_0019.xhtml_sec.always_use_braces).\n\nThe issue is\
    \ a lack of symmetry. Think about it. Do all branches express a similar? Or in\
    \ other words, are all branches symmetrical? The answer is: not.\n\n```java\n\
    class BoardComputer {\n    CruiseControl cruiseControl;\n\n    void authorize(User\
    \ user) {\n        Objects.requireNonNull(user);\n        if (user.isUnknown())\
    \ {\n            cruiseControl.logUnauthorizedAccessAttempt();\n            return;\n\
    \        }\n        if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        } else if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n\
    \nThe asymmetry in the code came from the fact that we were mixing authorizing\
    \ code with non-authorizing code. We can improve code symmetry if we separate\
    \ the two into different blocks of code.\n\nEach part bundles a different type\
    \ of access with a separate `if` statement. First, we handle the unauthorized\
    \ access, log it, and exit the method. Then, we handle the other two cases in\
    \ an `if` and connected `else if` block.\n\nThe second part is symmetrical now,\
    \ because it contains two types of authorized access. The new structure makes\
    \ the intent of the condition clearer to the reader. It’s also no longer possible\
    \ to accidentally introduce the fallthrough bug that we’ve seen in [Avoid Switch\
    \ Fallthrough](#f_0018.xhtml_sec.avoid_switch_fall_through).\n\nThere’s still\
    \ room for optimization here. For instance, `grantAccess()` is called in both\
    \ branches of the second condition with identical arguments. Plus, we could extract\
    \ the two conditions into separate private methods. This would give us even better\
    \ signposting in the code.\n\nNote that this points forward to [Fail Fast](#f_0053.xhtml_sec.fail_fast),\
    \ as we moved the code for unauthorized access to the top.\n\n### What Have You\
    \ Learned?\n\nSo you’ve read through the first set of comparisons and arrived\
    \ at this page. First of all, thanks! We’re happy that you stuck with us this\
    \ far. You’ve already learned a lot about a important topic: writing readable\
    \ code. Maintaining existing code is what we spend most of our effort on these\
    \ days, and you’ll seldom start a project from the green field. Most of the time,\
    \ your boss will hurl a gigantic heap of code at you that you’re supposed to fix\
    \ and extend.\n"
  raw: 'Here we’ve translated the switch statement from the previous comparison into
    separate if statements. There’s one problem, though. The indentation in the snippet
    is perilously misleading. There are no curly braces after the if, so the condition
    applies only to the subsequent line. That makes the whole method behave maliciously—the
    line cruiseControl.grantAdminAccess(user); is always executed and grants admin
    access to any user! What a mess.


    The root of this problem isn’t the indentation. It’s the missing curly braces
    that define the scoping. Essentially, this is a variant of the switch fallthrough
    that we’ve seen in [*Avoid Switch Fallthrough*](#f_0018.xhtml_sec.avoid_switch_fall_through).


    If you’re aware of this problem for a switch, you might still overlook it with
    an if. Even if you indent correctly, there’s no guarantee that anyone would spot
    the bug during the always hectic crunch times before deadlines. This is why we
    advise everybody to always use braces.


    The Right-Hand Side Is Not Always Meant to Be Perfect


    Clean code is hard to achieve. As you might have already noticed, we sometimes
    iteratively improve the code in the course of two or more comparisons. We aim
    to improve one thing at a time, sometimes ignoring other code quality criteria
    to keep the focus on the current topic. Keep this in mind when reading the solutions
    on the right-hand page. Oftentimes, there’s still something more that you can
    improve.


    Take a look at the corrected version.


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    |   | **if** (user.isUnknown()) { |


    |   | cruiseControl.logUnauthorizedAccessAttempt(); |


    |   | } |


    |   | **if** (user.isAstronaut()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | } |


    |   | **if** (user.isCommander()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | } |


    | » | cruiseControl.grantAdminAccess(user); *// SECURITY THREAT* |


    |   | } |


    |   | } |


    Here we’ve added the curly braces in the way that the compiler treats the code.
    You can spot the error easily: no condition guards the call of grantAdminAccess().
    Thanks to the curly braces, the code is much more readable now. Even if time is
    short, it’s much more likely that someone will spot this critical bug.


    It’s also safer to add new lines of code now. Before, you might have overlooked
    the fact that there are no curly braces and added a line into one of the blocks.


    Misleading indentation caused the bug in our example. That’s dangerous, especially
    because it was combined with the misplaced thinking that fewer characters mean
    better code. Remember: Less code is not always better—more readable code is!


    You might argue that such an error is unrealistic and would hardly ever happen
    in practice for security-critical code. History tells otherwise; in 2014, Apple
    engineers had a very similar bug in the implementation of Apple’s SSL/TLS protocol
    for iOS.^([[19]](#f_0021.xhtml_FOOTNOTE-19)) Attackers exploiting that bug could
    eavesdrop to any secure connection of an Apple device. Scary, isn’t it?


    Always using curly braces out of routine is a good defense against fallthrough
    bugs, as is always the using auto-indentation of your IDE. But the solution to
    this problem isn’t perfect yet, because it violates [*Fail Fast*](#f_0053.xhtml_sec.fail_fast)
    and [*Ensure Code Symmetry*](#f_0020.xhtml_sec.ensure_code_symmetry). Be sure
    to read on!


    ## Ensure Code Symmetry


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    | » | **if** (user.isUnknown()) { |


    |   | cruiseControl.logUnauthorizedAccessAttempt(); |


    |   | } **else** **if** (user.isAstronaut()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | } **else** **if** (user.isCommander()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | cruiseControl.grantAdminAccess(user); |


    |   | } |


    |   | } |


    |   | } |


    We’ve emphasized a few times already that understandability is absolutely critical
    for your code. By structuring your conditional branches in a symmetrical way,
    you’ll make the code easier to understand and easier to grasp. Whoever maintains
    such code in the future (chances are it’ll be you) will be able to locate features
    more quickly, and it’ll be easier to spot bugs.


    Here is another modification of the code you have seen in [*Avoid Switch Fallthrough*](#f_0018.xhtml_sec.avoid_switch_fall_through)
    and [*Always Use Braces*](#f_0019.xhtml_sec.always_use_braces). We’ve combined
    the different conditions into a single one with two else if blocks.


    There’s no outright bug in the code. The problem is that all conditions and statements
    follow each other subsequently. This requires you to read and understand all of
    them at once. It might not be too difficult here because it’s just a small example
    without much nesting. But in real life, such structures can grow and become a
    real puzzle.


    In essence, the issue is a lack of code symmetry. Check out this definition by
    Kent Beck^([[20]](#f_0021.xhtml_FOOTNOTE-20)): “Things that are almost the same
    can be divided into parts that are identical and parts that are clearly different.”


    Think about it. Do all branches express a similar concern? Do they show a parallel
    structure? Or in other words, are all three branches really symmetrical?


    The answer is: not really. In the first branch, access is denied. In the second
    and third branches, access is granted. This isn’t symmetrical.


    So how would a symmetrical version of this code look?


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    | » | **if** (user.isUnknown()) { |


    |   | cruiseControl.logUnauthorizedAccessAttempt(); |


    |   | **return**; |


    |   | } |


    |   |  |


    | » | **if** (user.isAstronaut()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | } **else** **if** (user.isCommander()) { |


    |   | cruiseControl.grantAccess(user); |


    |   | cruiseControl.grantAdminAccess(user); |


    |   | } |


    |   | } |


    |   | } |


    The asymmetry in the code came from the fact that we were mixing authorizing code
    with non-authorizing code. We can improve code symmetry if we separate the two
    into different blocks of code.


    Each part bundles a different type of access with a separate if statement. First,
    we handle the unauthorized access, log it, and exit the method. Then, we handle
    the other two cases in an if and a connected else if block.


    The second part is symmetrical now, because it contains two types of authorized
    access. The new structure makes the intent of the condition clearer to the reader.
    It’s also no longer possible to accidentally introduce the fallthrough bug that
    we’ve seen in [*Avoid Switch Fallthrough*](#f_0018.xhtml_sec.avoid_switch_fall_through).


    There’s still room for optimization here. For instance, grantAccess() is called
    in both branches of the second condition with identical arguments. Plus, we could
    extract the two conditions into separate private methods. This would give us even
    better signposting in the code.


    Note that this points forward to [*Fail Fast*](#f_0053.xhtml_sec.fail_fast), as
    we moved the code for unauthorized access to the top.


    ## What Have You Learned?


    So you’ve read through the first set of comparisons and arrived at this page.
    First of all, thanks! We’re happy that you stuck with us this far. You’ve already
    learned a lot about a important topic: writing readable code. Maintaining existing
    code is what we spend most of our effort on these days, and you’ll seldom start
    a project from the green field. Most of the time, your boss will hurl a gigantic
    heap of code at you that you’re supposed to fix and extend.'
