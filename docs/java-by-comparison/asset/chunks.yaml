  trans: "\n上述解决方案需要的代码要少得多。`HullRepairUnit` 完全消失了。相反，`Hull` 自身进行修复。起初看起来可能很奇怪，因为在现实中可能有一个机器人在修复\
    \ `Hull`。但只要这个单元在我们的程序中没有状态和行为，就不应该有一个类来表示它。\n\n`Hull` 类可以可以自己提供这些功能。同样，不同类型系统中的\
    \ `Order` 或 `User` 也可以独立提供功能，而不需要管理器、控制器、服务或其他任何无状态类。\n\n总的来说，我们在解决方案中将状态和行为结合在了一起。在问题描述中，它们被分成两个类。而在解决方案中，它们靠得很近，位于同一个类内部。类的方法可以直接处理内部状态。我们还减少了方法参数的数量，使方法更易于理解。之前，必须对参数进行校验，但现在不再需要了。而且不再需要通过\
    \ getter 或 setter 向外部暴露 `holes` 属性了。\n\n总而言之，注意那些只与其输入参数工作，而不与其所属类的实例变量相互作用的方法。这些方法指示了状态与行为的分离，并防止了信息隐藏。如果公开的信息过多，很容易发生\
    \ bug。\n\n有时，框架要求你违背这条规则。例如，Web 框架中的控制器通常是无状态的——也就是说，它们没有字段，只有方法参数。这种设计是为了能够创建许多此类控制器来处理大量的并行请求——状态仅储存在数据库中。\n\
    \n## 避免引用泄漏\n\n```java\nclass Inventory {\n    private final List<Supply> supplies;\n\
    \n    Inventory(List<Supply> supplies) {\n        this.supplies = supplies;\n\
    \    }\n\n    List<Supply> getSupplies() {\n        return supplies;\n    }\n\
    }\n```\n\n实际上，任何非平凡的对象都具有可以从外部访问的内部状态。你需要小心处理如何提供这些状态。否则，你将面临出现严重 bug 的风险。\n\n\
    这里的 `Inventory` 展示了一个维护数据结构的相当常见的示例。该数据结构是在外部初始化并插入到 `Inventory` 构造函数的。类本身没有明显的错误，但让我们来看看它的用法：\n\
    \n```java\nList<Supply> externalSupplies = new ArrayList<>();\nInventory inventory\
    \ = new Inventory(externalSupplies);\n\ninventory.getSupplies().size(); // ==\
    \ 0\nexternalSupplies.add(new Supply(\"Apple\"));\ninventory.getSupplies().size();\
    \ // == 1\ninventory.getSupplies().add(new Supply(\"Banana\"));\ninventory.getSupplies().size();\
    \ // == 2\n```\n\n首先，我们将空的 `externalSupplies` 传递给新的 `Inventory`，`getSupplies()`\
    \ 返回一个空列表。但库存并没有保护其内部的供应列表。相反，我们可以通过向 `externalSupplies` 列表添加供应，或者通过对 `getSupplies()`\
    \ 返回的列表进行其他更改操作来改变库存的状态。注意，`supplies` 字段的 `final` 关键字并阻止这种行为！而且现在我们还可以向构造函数传递\
    \ `null`，这在以后很容易触发异常。\n\n问题在于内存中只有一个列表——即由 `new ArrayList<>()` 创建的那个。库存只是在它的 `supplies`\
    \ 字段中存储了该列表的引用，并通过 `getSupplies()` 返回该引用。本质上，`Inventory` 通过 getter 向外部泄漏了其内部结构的引用。这是糟糕的！但有方法避免这一点。\n\
    \n如何保护类的内部结构在实例化后被操纵呢？\n\n```java\nclass Inventory {\n    private final List<Supply>\
    \ supplies;\n\n    Inventory(List<Supply> supplies) {\n        this.supplies =\
    \ new ArrayList<>(supplies);\n    }\n\n    List<Supply> getSupplies() {\n    \
    \    return Collections.unmodifiableList(supplies);\n    }\n}\n```\n\n现在 `Inventory`\
    \ 更好地保护了它的内部结构。它不再仅仅使用我们传递的列表的引用，而是只使用其中的 `Supply` 对象来填充一个内部的 `ArrayList`。如果你尝试输入\
    \ `null`，它也会立即触发异常。\n\n更重要的是，它没有通过 `getSupplies()` 直接暴露内部列表，而是在将其封装为 `unmodifiableList()`\
    \ 之后才暴露。这确保了只读访问。如果某个调用想要向列表添加元素，我们需要为之编写一个显式的方法。\n\n内部 `ArrayList` 的实例保持在 `Inventory`\
    \ 私有范围内。它的引用从未离开该类。它被隐藏了。被保护了。`Inventory` 的新用法展示了这一点：\n\n```java\nList<Supply>\
    \ externalSupplies = new ArrayList<>();\nInventory inventory = new Inventory(externalSupplies);\n\
    \ninventory.getSupplies().size(); // == 0\nexternalSupplies.add(new Supply(\"\
    Apple\"));\ninventory.getSupplies().size(); // == 0\ninventory.getSupplies().add(new\
    \ Supply(\"Banana\"));\ninventory.getSupplies().size(); // UnsupportedException\n\
    ```\n\n更改 `externalSupplies` 列表或 `getSupplies()` 返回的列表对库存的内部状态没有影响。更好的是，任何修改 `getSupplies()`\
    \ 返回列表的尝试都会导致 `UnsupportedOperationException`。这种技术也称为防御拷贝（defensive copying）。你不是复用数据结构，而是创建一个副本来保护\
    \ setter 和 getter。\n\n## 避免返回 Null\n\n```java\nclass SpaceNations {\n    static\
    \ List<SpaceNation> nations = Arrays.asList(\n        new SpaceNation(\"US\",\
    \ \"United States\"),\n        new SpaceNation(\"RU\", \"Russia\")\n    );\n\n\
    \    static SpaceNation getByCode(String code) {\n        for (SpaceNation nation\
    \ : nations) {\n            if (nation.getCode().equals(code)) {\n           \
    \     return nation;\n            }\n        }\n        return null;\n    }\n\
    }\n```\n\n当方法调用没有适当的值返回时，一些程序员直接返回 `null`。这会损害你程序的稳定性！\n\n在此代码中，我们在 `SpaceNations`\
    \ 类中建模了国家代码和国家名称之间的关系。用法非常直观：你向方法传递一个 `String`，它返回对应的 `SpaceNation` 实例——如果国家代码未知则返回\
    \ `null`。\n\n```java\nString us = SpaceNations.getByCode(\"US\").getName(); //\
    \ \"United States\"\nString anguilla = SpaceNations.getByCode(\"AI\").getName();\
    \ // NullPointerException\n```\n\n这是容易出错的。如你所见，如果你使用未国家代码，很容易触发 `NullPointerException`。因为方法可能返回\
    \ `null`，你必须每次都显式地检查返回值。否则，你将面临触发 `NullPointerException` 的风险。\n\n这个方法是一个设计不良的示例。即使你说明了检查\
    \ `null` 的必要性，最终也会有人忘记并触发异常。\n\n如果 `null` 是坏的，那么应该返回什么呢？\n\n```java\nclass SpaceNations\
    \ {\n    /** Null object. */\n    static final SpaceNation UNKNOWN_NATION = new\
    \ SpaceNation(\"\", \"\");\n\n    static List<SpaceNation> nations = Arrays.asList(\n\
    \        new SpaceNation(\"US\", \"United States\"),\n        new SpaceNation(\"\
    RU\", \"Russia\")\n    );\n```\n"
- fmt: "\n```java\nfor (SpaceNation nation : nations) {\n    if (nation.getCode().equals(code))\
    \ {\n        return nation;\n    }\n}\nreturn UNKNOWN_NATION;\n```\n\nOne solution\
    \ would be to throw an exception—for example, an `IllegalArgumentException` or\
    \ a `NoSuchElementException`. This is a strong indication for a problem. You’d\
    \ have to explicitly deal with it on the calling side.\n\nBut in this case, we\
    \ propose you use the null object pattern. Instead of returning `null`, you return\
    \ a null object, an object that explicitly indicates that it has no real value.\
    \ Here, this is an `UNKNOWN_NATION`. That way, you don’t disturb the program flow\
    \ and avoid exceptions:\n\n```java\nString us = SpaceNations.getByCode(\"US\"\
    ).getName(); // -> \"United States\"\nString anguilla = SpaceNations.getByCode(\"\
    AI\").getName(); // -> \"\"\n``````\n\nIt’s still up to the calling side to decide\
    \ what to do when encountering an `UNKNOWN_NATION`. The difference is that we\
    \ now have a choice if we want to ignore the value or throw an exception.\n\n\
    Null objects come in different forms: empty strings, empty collections, or special\
    \ instantiations of a class, as you can find here. But regardless of their form,\
    \ they all help to overcome the “billion-dollar mistake”: the introduction of\
    \ the `null` reference by Tony Hoare!\n\nIn [Favor Optional Over Null](#f_0090.xhtml_sec.favor_optional_over_null),\
    \ we’ll show you how to force the developer to handle the presence and the absence\
    \ of that value.\n\n## What Have You Learned?\n\nGood design is doable, isn’t\
    \ it? It’s the little details that improve the overall picture, and the art is\
    \ to spot the flaws in the class at hand.\n\nYou probably didn’t write a lot of\
    \ the code you see on your screen most of the time. So you’ll probably have to\
    \ put some effort into understanding a coder’s reasoning behind her design decisions.\
    \ And you always have a lot of choices to make when you design your code. It’s\
    \ your job to weigh the benefits and concerns that each solution imposes. You\
    \ have to make an informed decision with trade-offs that affect properties of\
    \ your code, like readability, testability, maintainability, and performance.\n\
    \nThe latter is usually the least concerning, at least at the start. When programming\
    \ Java, you’re usually writing verbose but understandable code—that’s in contrast\
    \ to fiddling around with pointer arithmetic and bit vectors as you’ll often see\
    \ in C and Assembly. This doesn’t mean that Java programs are slow. It’s just\
    \ that code understandability matters more than performance at the start. You\
    \ can always go back and optimize the code later when you’ve benchmarked it and\
    \ found a bottleneck. And this is much easier if your code is understandable.\n\
    \nThat’s what this chapter was all about: improving the understandability of your\
    \ classes and methods by writing them in a way that makes them intuitive with\
    \ fewer avenues for misuse. If everybody on the team follows these rules, then\
    \ development gets easier.\n\nSometimes you have to split methods and classes\
    \ into several parts, whereas in other cases you must combine state and behavior.\
    \ Then there’s how you handle references. You shouldn’t leak references to internal\
    \ objects, and it’s even better if your objects are fully immutable. This makes\
    \ them easy to understand, because there can only be one state per object. Finally,\
    \ a well-designed class is flexible and guides the user to the correct usage.\
    \ You can achieve this by not returning `null` references and by using abstract\
    \ instead of very specific types as input parameters.\n\nThe design of large software\
    \ systems is tremendously hard but it has been explored a lot already. If you\
    \ want to read more on this, we recommend the classic book on [Design Patterns\
    \ [GHJV95]](#f_0106.xhtml_d2831e141).\n\nIn the next chapter, we’ll explore a\
    \ new feature that came with Java 8: functional programming using Java streams\
    \ and lambda expressions. Streams give you enormous potential for easier data\
    \ manipulation, faster computations, parallelism, and more stability. So read\
    \ on!\n\n#### Footnotes\n\n[[42](#f_0078.xhtml_FNPTR-42)\n[https://martinfowler.com/bliki/ValueObject.html](https://martinfowler.com/bliki/ValueObject.html)\n\
    \n[43](#f_0081.xhtml_FNPTR-43)\n[https://en.wikipedia.org/wiki/Tony_Hoare](https://en.wikipedia.org/wiki/Tony_Hoare)\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\nObject-oriented programming makes\
    \ code understandable by encapsulating moving parts. Functional programming makes\
    \ code understandable by minimizing moving parts.\n\nMichael Feathers\n\n# Chapter\
    \ 8: Let Your Data Flow\n\nIn the first half of the sixteenth century, the astronomer\
    \ Nicolaus Copernicus published his ideas on heliocentrism—the astronomical model\
    \ in which the Earth revolves around the sun and not the other way around. At\
    \ the time, this was a fundamental revolution of thought and the way that we humans\
    \ view the universe and our place in it.\n\nThe release of Java 8 was a similar\
    \ revolution to the Java world. Since then, it’s become possible to use the functional\
    \ programming paradigm with lambda expressions and streams in regular Java programs\
    \ out of the box. Before that, you could only use functional programming on the\
    \ JVM with different languages like Scala. Now you can combine all major programming\
    \ styles easily in Java.\n\nUnlike with the astronomic models, there’s no right\
    \ or wrong here. No single programming style describes a fundamental truth. No\
    \ style is always better than the others in all application scenarios. Each has\
    \ its pros and cons, and it’s up to the developer to find out which suits a particular\
    \ situation best.\n\nThis chapter introduces you to the core concepts of functional\
    \ programming in Java. We’ll go over a number of comparisons that show you when\
    \ the functional style really tops the imperative one. You’ll learn about elegant\
