  trans: "\n\n当这种情况发生时，如果写代码的人关注过可读性，你会心存感激的。所以，请对你的同事友好，并努力代码的可读性！而且，你永远无法；即使你认为自己完成了一个项目，老板也可能会重新分配任务，然后你的代码就会会回来困扰你。\n\
    \n这就是为什么我们向你展示如何避免不必要的代码。你学习了如何简化布尔表达式，并将避开许多由于代码可读性差导致的 Bug，例如 `switch` 穿透（fallthrough）。\n\
    \n你现在能做的最好的事情就是尝试你读过的内容。拿一段你以前写的代码来看，审视一下它。你能应用这里读到的某些建议吗？经过这些重构后，你的代码看起来是什么样？务必保留原始版本的副本，以便与改进后的版本进行比较。毕竟，这就是本书的主题！\n\
    \n当你准备好后，翻到下一章。我们将深入探讨代码可读性和可理解性的话题，并针对代码风格和 Java API 的提供更多高级的建议。所以请务必继续读下去！\n\
