  trans: "\n始终关闭多个资源很容易出错，因为每个资源都可能以某种方式失败。在没有 `try-with-resources` 结构的情况下，手动关闭资源是非常困难的。\n\
    \n让我们看看上面的代码。它使用了两个资源：一个 `DirectoryStream` 和一个 `BufferedWriter`。这是你常见的场景：从一个资源读取并写入另一个资源。\n\
    \n资源在 `try` 之前打开，并在随后的 `finally` 块中关闭。这看起来几乎像 *始终关闭资源 中的手动解决方案。但异常也可能在这里给你出麻烦：\n\
    \n*   如果创建 writer 失败，方法将抛出异常并退出，`directoryStream` 将不会被关闭。\n*   如果关闭 `directoryStream`\
    \ 导致异常，那么 `writer` 将不会被关闭。\n\n我们可以再次使用 `try-with-resources`。\n\n```java\nclass\
    \ Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\");\n   \
    \ static final Path STATISTICS_CSV = LOG_FOLDER.resolve(\"stats.csv\");\n    static\
    \ final String FILE_FILTER = \"*.log\";\n\n    void createStatistics() throws\
    \ IOException {\n        try (DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n             BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV))\
    \ {\n            for (Path logFile : directoryStream) {\n                String\
    \ csvLine = String.format(\"%s,%d,%s\",\n                    logFile,\n      \
    \              Files.size(logFile),\n                    Files.getLastModifiedTime(logFile));\n\
    \                writer.write(csvLine);\n                writer.newLine();\n \
    \           }\n        }\n    }\n}\n```\n\n`try-with-resources` 块并不局限于一个资源——它可以同时处理多个资源。即使发生问题，它也能确保所有资源始终始终被关闭。要在\
    \ `try-with-resources` 中使用多个资源，你只需要用分号将它们分隔开：\n\n```java\ntry (open resource1;\
    \ open resource2) {\n    // use resources\n}\n```\n\n在内部，编译器会展开 `try-with-resources`\
    \ 块中的每个资源，并创建多个块的嵌套。最内层的 `try-finally` 块使用已打开的资源。\n\n```java\n// open resource1\n\
    try {\n    // open resource2\n    try {\n        // use resource1 and resource2\n\
    \    } finally { resource2.close(); }\n} finally { resource1.close(); }\n```\n\
    \n听从我们的建议：不要手动管理资源——你只会自讨苦吃。在 `try-with-resources` 块中打开资源——这样你的脚就会安然无恙。\n\n##\
    \ 解释空 catch\n\n```java\nclass Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"\
    /var/log\");\n    static final String FILE_FILTER = \"*.log\";\n\n    List<Path>\
    \ getLogs() throws IOException {\n        List<Path> result = new ArrayList<>();\n\
    \n        try (DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER)) {\n            for (Path logFile : directoryStream) {\n      \
    \          result.add(logFile);\n            }\n        } catch (NotDirectoryException\
    \ e) {\n\n        }\n\n        return result;\n    }\n}\n```\n\n在本章的最后一个比较中，我们回到了捕获异常。上面，你可以看到前面页面中\
    \ LogBook 示例的不同版本。它正确地关闭了资源，但另有地方很奇怪：catch 块。\n\n只有当你以有意义的方式处理异常时，才应该捕获异常。`catch`\
    \ 块包含处理异常的代码。你可以通过许多方式处理异常。例如，你可以重试其他操作，或者仅仅记录异常的发生。\n\n有时，吞掉异常并什么都不做实际上是正确的做法。尽管如此，当我们遇到空\
    \ catch 块时，总会有一种奇怪的感觉：这是一个 bug 吗？catch 是不是无意中添加的（例如通过 IDE），并隐藏了异常？还是这是一种功能？\n\n\
    ```java\nclass Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\"\
    );\n    static final String FILE_FILTER = \"*.log\";\n\n    List<Path> getLogs()\
    \ throws IOException {\n        List<Path> result = new ArrayList<>();\n\n   \
    \     try (DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER)) {\n            for (Path logFile : directoryStream) {\n      \
    \          result.add(logFile);\n            }\n        } catch (NotDirectoryException\
    \ e) {\n\n        }\n\n        return result;\n    }\n}\n```\n在本章的最后一个比较中，我们回到了捕获异常。上面，你可以看到前面页面中\
    \ LogBook 示例的不同版本。它正确地关闭了资源，但另有地方很奇怪：catch 块。\n\n只有当你以有意义的方式处理异常时，才应该捕获异常。`catch`\
    \ 块包含处理异常的代码。你可以通过许多方式处理异常。例如，你可以重试其他操作，或者仅仅记录异常的发生。\n\n有时，吞掉异常并什么都不做实际上是正确的做法。尽管如此，当我们遇到空\
    \ catch 块时，总会有一种奇怪的感觉：这是一个 bug 吗？catch 是不是无意中添加的（例如通过 IDE），并隐藏了异常？还是这是一种功能？\n"
- fmt: "\nMuch of this chapter has been about making sure that your program works\
    \ even if something goes wrong. After all, some aspects such as file handling\
    \ or networking are out of your control and you can’t prevent such errors from\
    \ happening. But there are plenty of problems that you can and should avoid. Your\
    \ program shouldn’t contain programming errors, and it shouldn’t contain bugs\
    \ that you could’ve fixed on your side.\n\nThat’s easier said than done, but there’s\
    \ one technique that is your first and foremost tool when it comes to making sure\
    \ that your programming is functionally correct: unit testing. This is the topic\
    \ of the next chapter. We’ll show you how to write high-quality testing code that\
    \ doesn’t just spot bugs, but that lives up to the same quality as your regular\
    \ code. Don’t miss that!\n\n### Footnotes\n\n[[34]](#f_0054.xhtml_FNPTR-34)\n\n\
    Of course, there can be cases where the most specific exception is actually `Exception`\
    \ and then catching it is fine. But those cases are very rare.\n\n[[35]](#f_0059.xhtml_FNPTR-35)\n\
    \n[http://www.oracle.com/technetwork/articles/java/trywithresources-401775.html](http://www.oracle.com/technetwork/articles/java/trywithresources-401775.html)\n\
    \nCopyright © 2018, The Pragmatic Bookshelf.\n\nTest your code, or your users\
    \ will.\n\nDave Thomas and Andrew Hunt\n\n# Chapter 6: Assert Things Going Right\n\
    \nTo err is human. Or to put it differently, we all make mistakes. No matter how\
    \ brilliant, how well educated, or how experienced you are, you’re still going\
    \ to write buggy code now and then. NASA’s own bugs made its Mars robots land\
    \ too hard, and its rockets accelerated too fast during takeoff. Pac-Man ended\
    \ at a kill screen at level 256\\. And some really terrible software errors have\
    \ hurt or even killed people—for example, an X-ray machine that emitted too much\
    \ radiation.\n\nOf course you’re going to try to make your software as bug-free\
    \ as possible. And testing is one technique you’ll use for finding flaws. It’s\
    \ not perfect—no amount of testing will ever guarantee you no errors. But that’s\
    \ no excuse for not writing tests at all. You can come a long way with a few very\
    \ simple techniques that we’re going to show you in this chapter.\n\nLuckily,\
    \ we have decent support for writing tests today—automated tests that you can\
    \ run for every code change, no matter small, to make sure that a feature that\
    \ once worked doesn’t break. Java doesn’t have built-in testing support, but it\
    \ has something that comes very close: the `JUnit`^([[36]](#f_0073.xhtml_FOOTNOTE-36))\
    \ framework. This is the de facto Java standard for automating test execution.\
    \ Because it’s so important, we’ll assume that you’re familiar with `JUnit` on\
    \ a basic level for the following comparisons. You should at least be able to\
    \ run a `JUnit` test.\n\nEven if you know how to use `JUnit`, writing a good test\
    \ suite for the first time is challenging. You need to design test cases appropriately,\
    \ name them, and use the `JUnit` API with all its classes, methods, and annotations.\
    \ This chapter will show you how to detect common issues in test cases, and how\
    \ to improve them. We’ll go over how to structure a test, describe it, and make\
    \ it stand alone so the next developer can understand it more quickly in isolation.\n\
    \n## Structure Tests Into Given-When-Then\n\n```java\nclass CruiseControlTest\
    \ {\n    @Test\n    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl\
    \ = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\nAbove, you can see a simple test written with `JUnit5`. Although\
    \ it’s not part of the Java class library, `JUnit`’s the de facto standard for\
    \ writing unit tests in Java and `JUnit5` is the newest revision. Defining a test\
    \ is simple enough, and chances are you’re already familiar with it: you just\
    \ add the `@Test` annotation to a method and `JUnit` can execute it as a test.\n\
    \nThat test above is worth its money—it runs correctly, and it will detect bugs\
    \ in the code. And because it’s part of an assertion, we don’t need to apply `Replace\
    \ Magic Numbers with Constants`](#f_0023.xhtml_sec.replace_magic_numbers_with_constant)\
    \ for `7667`. The problem is, as we’ve seen so many times before, it’s not as\
    \ well structured and readable as it could be. Readability is just as important\
    \ for testing code as it is for source code. After all, test code is code. But\
    \ the test here looks like it was written in a hurry and without due diligence.\n\
    \nUsually, a test consists of three core parts: given, when, and then. Consider\
    \ the following exemplary test specification:\n\n*   given a calculator showing\
    \ the number 2\n*   when adding the number 3\n*   then it should show the number\
    \ 5.\n\nThe `given` part sets the stage for the actual test and captures all prerequisites\
    \ for executing the functionality we want to test. The `when` part triggers the\
    \ operation that we actually want to test. And in the `then` part, we assert that\
    \ the result is what we expect.\n\nYou can make your test much clearer by structuring\
    \ it:\n\n```java\nclass CruiseControlTest {\n    @Test\n    void setPlanetarySpeedIs7667()\
    \ {\n        // given\n        CruiseControl cruiseControl = new CruiseControl();\n\
    \n        // when\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \n        // then\n        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n\
    \    }\n}\n```\n\nWhen teaching, we sometimes recommend adding these comments\
    \ as a way for students to get used to structuring tests properly. But when you’re\
    \ used to that structure, the vertical empty lines are more than enough. Frameworks\
    \ like `JGiven`^([[37]](#f_0073.xhtml_FOOTNOTE-37)) make this structure even more\
    \ explicit.\n\n## Use Meaningful Assertions\n\n```java\nclass CruiseControlTest\
    \ {\n    @Test\n    void setPlanetarySpeedIs7667() {\n        CruiseControl cruiseControl\
    \ = new CruiseControl();\n        cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED);\n\
    \        Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh());\n \
    \   }\n}\n```\n\nThe most basic assertion you can find in `JUnit` is `assertTrue()`.\
    \ In the end, everything boils down to a Boolean value, whether a condition holds\
    \ or doesn’t. Interpreting Boolean expressions is no problem at all for Java,\
    \ but you can make the life of your fellow developer a lot easier by writing assertions\
    \ in a way that’s more accessible. And you won’t usually do this with `assertTrue()`.\n"
  raw: 'Much of this chapter has been about making sure that your program works even
    if something goes wrong. After all, some aspects such as file handling or networking
    are out of your control and you can’t prevent such errors from happening. But
    there are plenty of problems that you can and should avoid. Your program shouldn’t
    contain programming errors, and it shouldn’t contain bugs that you could’ve fixed
    on your side.


    That’s easier said than done, but there’s one technique that is your first and
    foremost tool when it comes to making sure that your programming is functionally
    correct: unit testing. This is the topic of the next chapter. We’ll show you how
    to write high-quality testing code that doesn’t just spot bugs, but that lives
    up to the same quality as your regular code. Don’t miss that!


    #### Footnotes


    [[34]](#f_0054.xhtml_FNPTR-34)


    Of course, there can be cases where the most specific exception is actually Exception
    and then catching it is fine. But those cases are very rare.


    [[35]](#f_0059.xhtml_FNPTR-35)


    [http://www.oracle.com/technetwork/articles/java/trywithresources-401775.html](http://www.oracle.com/technetwork/articles/java/trywithresources-401775.html)


    Copyright © 2018, The Pragmatic Bookshelf.


    Test your code, or your users will.


    Dave Thomas and Andrew Hunt


    # Chapter 6


    Assert Things Going Right


    To err is human. Or to put it differently, we all make mistakes. No matter how
    brilliant, how well educated, or how experienced you are, you’re still going to
    write buggy code now and then. NASA’s own bugs made its Mars robots land too hard,
    and its rockets accelerated too fast during takeoff. Pac-Man ended at a kill screen
    at level 256\. And some really terrible software errors have hurt or even killed
    people—for example, an X-ray machine that emitted too much radiation.


    Of course you’re going to try to make your software as bug-free as possible. And
    testing is one technique you’ll use for finding flaws. It’s not perfect—no amount
    of testing will ever guarantee you no errors. But that’s no excuse for not writing
    tests at all. You can come a long way with a few very simple techniques that we’re
    going to show you in this chapter.


    Luckily, we have decent support for writing tests today—automated tests that you
    can run for every code change, no matter how small, to make sure that a feature
    that once worked doesn’t break. Java doesn’t have built-in testing support, but
    it has something that comes very close: the JUnit^([[36]](#f_0073.xhtml_FOOTNOTE-36))
    framework. This is the de facto Java standard for automating test execution. Because
    it’s so important, we’ll assume that you’re familiar with JUnit on a basic level
    for the following comparisons. You should at least be able to run a JUnit test.


    Even if you know how to use JUnit, writing a good test suite for the first time
    is challenging. You need to design test cases appropriately, name them, and use
    the JUnit API with all its classes, methods, and annotations. This chapter will
    show you how to detect common issues in test cases, and how to improve them. We’ll
    go over how to structure a test, describe it, and make it stand alone so the next
    developer can understand it more quickly in isolation.


    ## Structure Tests Into Given-When-Then


    |   | **class** CruiseControlTest { |


    |   |  |


    |   | @Test |


    |   | **void** setPlanetarySpeedIs7667() { |


    | » | CruiseControl cruiseControl = **new** CruiseControl(); |


    | » | cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED); |


    | » | Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh()); |


    |   | } |


    |   | } |


    Above, you can see a simple test written with JUnit5\. Although it’s not part
    of the Java class library, JUnit’s the de facto standard for writing unit tests
    in Java and JUnit5 is the newest revision. Defining a test is simple enough, and
    chances are you’re already familiar with it: you just add the @Test annotation
    to a method and JUnit can execute it as a test.


    That test above is worth its money—it runs correctly, and it will detect bugs
    in the code. And because it’s part of an assertion, we don’t need to apply [*Replace
    Magic Numbers with Constants*](#f_0023.xhtml_sec.replace_magic_numbers_with_constant)
    for 7667. The problem is, as we’ve seen so many times before, it’s not as well
    structured and readable as it could be. Readability is just as important for testing
    code as it is for source code. After all, test code is code. But the test here
    looks like it was written in a hurry and without due diligence.


    Usually, a test consists of three core parts: given, when, and then. Consider
    the following exemplary test specification:


    *   given a calculator showing the number 2


    *   when adding the number 3


    *   then it should show the number 5.


    The given part sets the stage for the actual test and captures all prerequisites
    for executing the functionality we want to test. The when part triggers the operation
    that we actually want to test. And in the then part, we assert that the result
    that the when trigger produced is actually what we expect.


    You can make your test code much more readable if you make this structure stand
    out in your code. Can you spot which statement of the test above belongs to which
    of those three parts? There are three lines and three concepts (given, when, then)
    to match, so you would think it’s straightforward. In that case, you’re in for
    a little surprise.


    Here’s how you can structure the test to communicate its parts more clearly:


    |   | **class** CruiseControlTest { |


    |   |  |


    |   | @Test |


    |   | **void** setPlanetarySpeedIs7667() { |


    | » | CruiseControl cruiseControl = **new** CruiseControl(); |


    |   |  |


    | » | cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED); |


    |   |  |


    | » | Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh()); |


    |   | } |


    |   | } |


    There’s a lot you can do in terms of readability with only little changes. Formatting
    with new lines to separate the given-when-then parts is already a big improvement.
    In a sense, we’ve just applied [*Group with New Lines*](#f_0028.xhtml_sec.group_with_new_lines)
    to highlight the specific structure of the test.


    Thanks to the extra vertical empty lines that split the statements, given, when,
    and then now directly shine in our faces. This makes it so much clearer. For practice,
    you can add comments into the test code to make the structure even more obvious.
    Consider the following:


    | » | *// given* |


    |   | CruiseControl cruiseControl = **new** CruiseControl(); |


    |   |  |


    | » | *// when* |


    |   | cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED); |


    |   |  |


    | » | *// then* |


    |   | Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh()); |


    When teaching, we sometimes recommend adding these comments as a way for students
    to get used to structuring tests properly. But when you’re used to that structure,
    the vertical empty lines are more than enough. Frameworks like JGiven^([[37]](#f_0073.xhtml_FOOTNOTE-37))
    make this structure even more explicit.


    But there’s another problem in the code, as you’ll see in the next comparison.


    ## Use Meaningful Assertions


    |   | **class** CruiseControlTest { |


    |   |  |


    |   | @Test |


    |   | **void** setPlanetarySpeedIs7667() { |


    |   | CruiseControl cruiseControl = **new** CruiseControl(); |


    |   |  |


    |   | cruiseControl.setPreset(SpeedPreset.PLANETARY_SPEED); |


    |   |  |


    | » | Assertions.assertTrue(7667 == cruiseControl.getTargetSpeedKmh()); |


    |   | } |


    |   | } |


    The most basic assertion you can find in JUnit is assertTrue(). In the end, everything
    boils down to a Boolean value, whether a condition holds or doesn’t. Interpreting
    Boolean expressions is no problem at all for Java, but you can make the life of
    your fellow developer a lot easier by writing assertions in a way that’s more
    accessible. And you won’t usually do this with assertTrue().'
