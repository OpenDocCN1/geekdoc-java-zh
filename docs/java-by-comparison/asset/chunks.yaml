  trans: "\n此外，它不应该为空，因为每个宇航员都应该有一个真实的名字。`name.trim()` 调用会移除各种前导或尾空格字符，例如空格或制表符。如果在调用\
    \ `trim()` 之后还有剩余内容，它将是一个真实的字符序列。\n\n代码中没有功能性错误。问题正如常见的情况那样，代码比本需要的复杂，可读性也差。更准确地说，`if`\
    \ 语句完全没有必要。它是冗余代码，只会分散对实际语义的注意力。\n\n让我们看看能做什么吧！关键在于我们方法的返回类型：`boolean`。正因如此，我们不需要将一切封装在\
    \ `if` 语句中——我们可以直接返回值，如下：\n\n```java\nclass Astronaut {\n  String name;\n  int\
    \ missions;\n\n  boolean isValid() {\n    return missions >= 0 && name != null\
    \ && !name.trim().isEmpty();\n  }\n}\n```\n\n这一更改消除了了一层缩进和分支。现在方法变得非常简洁且更容易阅读！\n\
    \n我们将五行 `if` 语句压缩了一行代码。为了保持相同的语义，我们必须对条件应用布尔运算。本质上，我们应用了德摩根定律并对条件进行了否定。这里是这些著名定律的快速定义，你将经常用到：\n\
    \n| `!A && !B == !(A || B)` // true |\n| `!A || !B == !(A && B)` // true |\n\n\
    有时条件会比这个更复杂。如果是这样，你应该考虑将其拆分为更小的部分。我们的建议是使用具有意义名称变量来捕捉条件的部分。考虑以下示例：\n\n```java\n\
    boolean isValid() {\n  boolean isValidMissions = missions >= 0;\n  boolean isValidName\
    \ = name != null && !name.trim().isEmpty();\n  return isValidMissions && isValidName;\n\
    }\n```\n\n根据经验法则，如果你组合了两个以上不同的条件，就应该考虑进行这种简化。如果你在其他地方需要条件的部分，请考虑将它们放入单独的方法中，正如*简化布尔表达式*中所解释。\n\
    \n注意，这里描述的解决方案仅适用于布尔返回类型。\n\n## 简化布尔表达式\n\n```java\nclass SpaceShip {\n  Crew\
    \ crew;\n  FuelTank fuelTank;\n  Hull hull;\n  Navigator navigator;\n  OxygenTank\
    \ oxygenTank;\n\n  boolean willCrewSurvive() {\n    return hull.holes == 0 &&\n\
    \           fuelTank.fuel >= navigator.requiredFuelToEarth() &&\n           oxygenTank.lastsFor(crew.size)\
    \ > navigator.timeToEarth();\n  }\n}\n```\n\n组合了多个条件的布尔表达式通常难以理解且容易出错。但你可以通过一些简单的技巧让它们变得更容易理解。\n\
    \n与之前的比较一样，你可以看到一个验证方法的示例。这个条件比上一个更复杂，但根据*直接返回布尔表达式*，它已经被压缩在单个返回语句中。\n\n条件的极其庞大使得它难以理解。它跨越了好行代码，并结合了来自五个不同对象的检查。由于其规模很大，当你必须更改其中一部分时，很容易引入故障。但即使在更改它之前，你可能也会花费宝贵的编程时间来理解它的含义。\n\
    \n当你必须将几个条件组合进单个检查中时，最好以某种方式对它们进行分组。良好的分组取决于条件的语义，你可以尝试按主题或抽象级别进行分组。\n\n在方法内部，你应该组合处于相似抽象层级的语句。理想情况下，较高层的方法应该调用下一层的方法。\n\
    \n### 括号也有帮助\n\n布尔条件可能会变得棘手，尤其是当它们缺少括号时。许多开发者（我们也是这一员）没有内化布尔运算符的优先级，必须思考一下才能确定\
    \ `x && y || z` 是指 `(x && y) || z` 还是 `x && (x || z)`。或者你不知道 `&&` 始终在 `||` 之前被评估吗？\n\
    \n在这里，`willCrewSurvive()` 方法在同一个条件中验证了每个低级细节。你想出一个中间的抽象层吗？比如这样：\n\n```java\nclass\
    \ SpaceShip {\n  Crew crew;\n  FuelTank fuelTank;\n  Hull hull;\n  Navigator navigator;\n\
    \  OxygenTank oxygenTank;\n\n  boolean willCrewSurvive() {\n    boolean hasEnoughResources\
    \ = hasFuel() && hasOxygen();\n    return hull.isIntact() && hasEnoughResources;\n\
    \  }\n\n  private boolean hasOxygen() {\n    return oxygenTank.lastsFor(crew.size)\
    \ > navigator.timeToEarth();\n  }\n\n  private boolean hasFuel() {\n    return\
    \ fuelTank.fuel >= navigator.requiredFuelToEarth();\n  }\n}\n```\n\n哇，发生了很多变化！`willCrewSurvive()`\
    \ 方法仍然存在，但现在它调用了其他方法并聚合它们的返回值。\n\n首先，我们添加了一个 `boolean` 变量，通过主题（资源）将相似方面组合在一起。我们还给它了一个有意义的名字\
    \ `hasEnoughResources`。该变量结合了方法调用的结果 `hasOxygen()` 和 `hasFuel()`。你会在这两个方法内部找到条件的实际细节。\n\
    \n接下来，我们将变量 `hasEnoughResources` 与原始条件中最后一个缺失的部分 `hull.holes == 0` 结合起来。然而，我们使用了\
    \ `Hull` 类中的 `isIntact()` 方法。由于它已经有了意义的名字，我们没有理由将其存储另一个布尔变量中。\n\n虽然代码行变多了，但我们大大提高了代码的可理解性。你不再需要一次理解整个条件。得于分组，你可以一步步进行。\n\
    \n## 在条件判断中避免空指针异常\n\n```java\nclass Logbook {\n  void writeMessage(String message,\
    \ Path location) throws IOException {\n    if (Files.isDirectory(location)) {\n\
    \      throw new IllegalArgumentException(\"路径无效！\");\n    }\n    if (message.trim().equals(\"\
    \") || message == null) {\n      throw new IllegalArgumentException(\"消息无效！\"\
    );\n    }\n    String entry = LocalDate.now() + \": \" + message;\n    Files.write(location,\
    \ Collections.singletonList(entry),\n               StandardCharsets.UTF_8, StandardOpenOption.CREATE,\n\
    \               StandardOpenOption.APPEND);\n  }\n}\n```\n"
- fmt: "\nThe current version of the method already performs some validation. Unfortunately,\
    \ it has two serious problems. First of all, the method doesn’t check for null\
    \ references properly. If `location` is null, the call to `Files.isDirectory()`\
    \ will fail with an undocumented `NullPointerException`. The same happens for\
    \ the second condition if `message` is null, because we check for `message.equals(\"\
    \")` first.\n\nWhen you validate arguments, you have to mind the order: first\
    \ check for null and only then for domain-specific “illegal” values. We recommend\
    \ that you check for common default values like empty strings or empty lists first,\
    \ and only then conduct more specific checks.\n\nPassing `null` into a method\
    \ as an argument is really bad style—it means that this method can also function\
    \ without this parameter. If this is indeed the case, refactor the method into\
    \ two: one with the parameter and one without. Be aware that a parameter being\
    \ null usually indicates a programming error on the calling side.\n\nHere’s what\
    \ a proper validation would look like.\n\n```java\nclass Logbook {\n    void writeMessage(String\
    \ message, Path location) throws IOException {\n        if (message == null ||\
    \ message.trim().isEmpty()) {\n            throw new IllegalArgumentException(\"\
    The message is invalid!\");\n        }\n        if (location == null || Files.isDirectory(location))\
    \ {\n            throw new IllegalArgumentException(\"The path is invalid!\");\n\
    \        }\n        String entry = LocalDate.now() + \": \" + message;\n     \
    \   Files.write(location, Collections.singletonList(entry),\n            StandardCharsets.UTF_8,\
    \ StandardOpenOption.CREATE,\n            StandardOpenOption.APPEND);\n    }\n\
    }\n```\n\nWe’ve resolved all issues in the new version: First, we check all arguments\
    \ for null values. After that, we check for domain-specific restrictions.\n\n\
    Also, we’ve changed the order of the checks to reflect the order of the arguments\
    \ in the method signature. This is a good practice, since a proper ordering of\
    \ parameter validations improves the flow of reading. You’re also less likely\
    \ to forget to validate one of the parameters. Finally, we’ve used a built-in\
    \ method to check if a `String` is empty.\n\nYou might ask yourself: Is this level\
    \ of parameter validation always necessary? It’s not.\n\nAs a rule of thumb, you\
    \ need parameter validation for public, protected, and default methods. That’s\
    \ because any part of the code can access them, and you might not control how\
    \ this happens.\n\nIn contrast, when you build private methods, you’re able to\
    \ ensure that you never pass `null` into them. So in this case, you don’t need\
    \ to perform as much validation.\n\n### File Open Options\n\nYou might wonder\
    \ what these `StandardOpenOptions` mean. They specify the behavior of the `Files.write()`\
    \ method. The names are pretty self-explanatory, but you should be aware that\
    \ you can combine them.\n\nThis is useful, because we don’t have to bother if\
    \ the file we want to `APPEND` to already exists on the filesystem if the `CREATE`\
    \ flag is set, too.\n\n## Avoid Switch Fallthrough\n\n```java\nclass BoardComputer\
    \ {\n    CruiseControl cruiseControl;\n\n    void authorize(User user) {\n   \
    \     Objects.requireNonNull(user);\n        switch (user.getRank()) {\n     \
    \       case UNKNOWN:\n                cruiseControl.logUnauthorizedAccessAttempt();\n\
    \            case ASTRONAUT:\n                cruiseControl.grantAccess(user);\n\
    \                break;\n            case COMMANDER:\n                cruiseControl.grantAccess(user);\n\
    \                cruiseControl.grantAdminAccess(user);\n                break;\n\
    \        }\n    }\n}\n```\n\nSome programming language constructs are infamous\
    \ because of all the bugs they’ve caused over the years. One of them is the `switch`,\
    \ and you should be careful when you use it.\n\nThe method `authorizeUser()` you\
    \ see here validates its parameters and checks for a null reference. It uses `Objects.requireNonNull()`,\
    \ a handy parameter validation method from the Java API, which triggers an exception\
    \ for null input. But `authorizeUser()` still contains a classic bug: the switch\
    \ fallthrough.\n\nThe bug is in the first case of the `switch` statement. There’s\
    \ no `break` statement at the end of the case. This means that the `switch` just\
    \ continues to the next case—it falls through and will always execute `cruiseControl.grantAccess()`.\n\
    \nThe `switch` statement is infamous for this behavior. It always continues execution\
    \ until it reaches a `break` statement or the end of the block. You’re going to\
    \ find these execution semantics for the `switch` in any C-style language. Also,\
    \ Java inherited it from C.\n\nThe `switch` behaves the way it does because this\
    \ allows you to write code that’s a little more compact and requires fewer characters,\
    \ you can avoid evaluating a few condition expressions this way. And since Java\
    \ 7, the `switch` statement supports strings in addition to integers, and enums.\n\
    \nBut over the years, it has done more harm than good, and quite a few bugs resulted\
    \ from forgotten `break`. Take a look at a bug-free version of the code.\n\n```java\n\
    class BoardComputer {\n    CruiseControl cruiseControl;\n\n    void authorize(User\
    \ user) {\n        Objects.requireNonNull(user);\n        switch (user.getRank())\
    \ {\n            case UNKNOWN:\n                cruiseControl.logUnauthorizedAccessAttempt();\n\
    \                break;\n            case ASTRONAUT:\n                cruiseControl.grantAccess(user);\n\
    \                break;\n            case COMMANDER:\n                cruiseControl.grantAccess(user);\n\
    \                cruiseControl.grantAdminAccess(user);\n                break;\n\
    \        }\n    }\n}\n```\n\nIt’s easy to fix the unintentional switch fallthrough:\
    \ make sure that there’s a `break` statement at the end of every case. We’ve done\
    \ this in our code example. Now the code is bug free—but is the `switch` really\
    \ the perfect choice here? Nope!\n\nIn the example, the `switch` mixes two concerns\
    \ that should be separate: It combines unauthorized access and authorized access\
    \ into one block of code.\n\nAs a rule of thumb, you should put different concerns\
    \ into different blocks of code. First of all, you’ll make the code more readable\
    \ that way. And second, there’s a smaller chance of accidental bugs like the switch\
    \ fallthrough.\n\nYou’ll find it hard to achieve this separation of concerns with\
    \ the `switch`. That’s why we prefer using `if` statements instead. But even there,\
    \ the switch fallthrough can haunt us, as you’ll see in.\n\nWhat if one adds another\
    \ rank? You would have to adapt this conditional, but that’s easy to forget. The\
    \ code would still run through, and you wouldn’t even notice that there’s something\
    \ missing! That’s why you should always have a fallback branch that captures values\
    \ that were not explicitly coded. `switch` statements have this built in with\
    \ the `default` case. Alternatively, you can throw an `AssertionError` to be sure.\n\
    \n### Always Use Braces\n\n```java\nclass BoardComputer {\n    CruiseControl cruiseControl;\n\
    \n    void authorize(User user) {\n        Objects.requireNonNull(user);\n   \
    \     if (user.isUnknown()) {\n            cruiseControl.logUnauthorizedAccessAttempt();\n\
    \        }\n        if (user.isAstronaut()) {\n            cruiseControl.grantAccess(user);\n\
    \        }\n        if (user.isCommander()) {\n            cruiseControl.grantAccess(user);\n\
    \            cruiseControl.grantAdminAccess(user);\n        }\n    }\n}\n```\n"
  raw: 'The current version of the method already performs some validation. Unfortunately,
    it has two serious problems. First of all, the method doesn’t check for null references
    properly. If location is null, the call to Files.isDirectory() will fail with
    an undocumented NullPointerException. The same happens for the second condition
    if message is null, because we check for message.equals("") first.


    When you validate arguments, you have to mind the order: first check for null
    and only then for domain-specific “illegal” values. We recommend that you check
    for common default values like empty strings or empty lists first, and only then
    conduct more specific checks.


    Passing null into a method as an argument is really bad style—it means that this
    method can also function without this parameter. If this is indeed the case, refactor
    the method into two: one with the parameter and one without. Be aware that a parameter
    being null usually indicates a programming error on the calling side.


    Here’s what a proper validation would look like.


    |   | **class** Logbook { |


    |   |  |


    |   | **void** writeMessage(String message, Path location) **throws** IOException
    { |


    | » | **if** (message == **null** &#124;&#124; message.trim().isEmpty()) { |


    |   | **throw** **new** IllegalArgumentException(*"The message is invalid!"*);
    |


    |   | } |


    | » | **if** (location == **null** &#124;&#124; Files.isDirectory(location)) {
    |


    |   | **throw** **new** IllegalArgumentException(*"The path is invalid!"*); |


    |   | } |


    |   |  |


    |   | String entry = LocalDate.now() + *": "* + message; |


    |   | Files.write(location, Collections.singletonList(entry), |


    |   | StandardCharsets.UTF_8, StandardOpenOption.CREATE, |


    |   | StandardOpenOption.APPEND); |


    |   | } |


    |   | } |


    We’ve resolved all issues in the new version: First, we check all arguments for
    null values. After that, we check for domain-specific restrictions.


    Also, we’ve changed the order of the checks to reflect the order of the arguments
    in the method signature. This is a good practice, since a proper ordering of parameter
    validations improves the flow of reading. You’re also less likely to forget to
    validate one of the parameters. Finally, we’ve used a built-in method to check
    if a String is empty.


    You might ask yourself: Is this level of parameter validation always necessary?
    It’s not.


    As a rule of thumb, you need parameter validation for public, protected, and default
    methods. That’s because any part of the code can access them, and you might not
    control how this happens.


    In contrast, when you build private methods, you’re able to ensure that you never
    pass null into them. So in this case, you don’t need to perform as much validation.


    File Open Options


    You might wonder what these StandardOpenOptions mean. They specify the behavior
    of the Files.write() method. The names are pretty self-explanatory, but you should
    be aware that you can combine them.


    This is useful, because we don’t have to bother if the file we want to APPEND
    to already exists on the filesystem if the CREATE flag is set, too.


    ## Avoid Switch Fallthrough


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    |   | **switch** (user.getRank()) { |


    |   | **case** UNKNOWN: |


    | » | cruiseControl.logUnauthorizedAccessAttempt(); |


    |   | **case** ASTRONAUT: |


    |   | cruiseControl.grantAccess(user); |


    |   | **break**; |


    |   | **case** COMMANDER: |


    |   | cruiseControl.grantAccess(user); |


    |   | cruiseControl.grantAdminAccess(user); |


    |   | **break**; |


    |   | } |


    |   | } |


    |   | } |


    Some programming language constructs are infamous because of all the bugs they’ve
    caused over the years. One of them is the switch, and you should be careful when
    you use it.


    The method authorizeUser() you see here validates its parameters and checks for
    a null reference. It uses Objects.requireNonNull(), a handy parameter validation
    method from the Java API, which triggers an exception for null input. But authorizeUser()
    still contains a classic bug: the switch fallthrough.


    The bug is in the first case of the switch statement. There’s no break statement
    at the end of the case. This means that the switch just continues to the next
    case—it falls through and will always execute cruiseControl.grantAccess().


    The switch statement is infamous for this behavior. It always continues execution
    until it reaches a break statement or the end of the block. You’re going to find
    these execution semantics for the switch in any C-style language. Also, Java inherited
    it from C.


    The switch behaves the way it does because this allows you to write code that’s
    a little more compact and requires fewer characters, you can avoid evaluating
    a few condition expressions this way. And since Java 7, the switch statement even
    supports strings in addition to integers, characters, and enums.


    But over the years, it has done more harm than good, and quite a few bugs resulted
    from forgotten break statements. In the rare case where a missing break is intentional,
    you should leave a comment!


    Take a look at a bug-free version of the code.


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    |   | **switch** (user.getRank()) { |


    |   | **case** UNKNOWN: |


    |   | cruiseControl.logUnauthorizedAccessAttempt(); |


    | » | **break**; |


    |   | **case** ASTRONAUT: |


    |   | cruiseControl.grantAccess(user); |


    |   | **break**; |


    |   | **case** COMMANDER: |


    |   | cruiseControl.grantAccess(user); |


    |   | cruiseControl.grantAdminAccess(user); |


    |   | **break**; |


    |   | } |


    |   | } |


    |   | } |


    It’s easy to fix the unintentional switch fallthrough: make sure that there’s
    a break statement at the end of every case. We’ve done this in our code example.


    Now the code is bug free—but is the switch really the perfect choice here? Nope!


    In the example, the switch mixes two different concerns that should be separate:
    It combines unauthorized access and authorized access into one block of code.


    As a rule of thumb, you should put different concerns into different blocks of
    code (we’ll look at that more closely in [*Ensure Code Symmetry*](#f_0020.xhtml_sec.ensure_code_symmetry)).
    First of all, you’ll make the code more readable that way. And second, there’s
    a smaller chance of accidental bugs like the switch fallthrough.


    You’ll find it hard to achieve this separation of concerns with the switch. That’s
    why we prefer using if statements instead. But even there, the switch fallthrough
    can haunt us, as you’ll see in [*Always Use Braces*](#f_0019.xhtml_sec.always_use_braces).


    What if one adds another rank? You would have to adapt this conditional, but that’s
    easy to forget. The code would still run through, and you wouldn’t even notice
    that there’s something missing! That’s why you should always have a fallback branch
    that captures values that were not explicitly coded. switch statements have this
    built in with the default case. Alternatively, you can throw an AssertionError
    to be sure.


    ## Always Use Braces


    |   | **class** BoardComputer { |


    |   |  |


    |   | CruiseControl cruiseControl; |


    |   |  |


    |   | **void** authorize(User user) { |


    |   | Objects.requireNonNull(user); |


    | » | **if** (user.isUnknown()) |


    |   | cruiseControl.logUnauthorizedAccessAttempt(); |


    | » | **if** (user.isAstronaut()) |


    |   | cruiseControl.grantAccess(user); |


    | » | **if** (user.isCommander()) |


    |   | cruiseControl.grantAccess(user); |


    |   | cruiseControl.grantAdminAccess(user); |


    |   | } |


    |   | } |'
