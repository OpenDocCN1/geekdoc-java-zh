  trans: "\ngetter 和 setter 的结构和命名非常标准化，以至于许多框架深度依赖它们。Hibernate 使用它们来将 Java 实例转换为\
    \ SQL 数据库中的行，Jackson 使用它们处理 JSON 消息，甚至 Play Framework 也使用它们来构建 HTML 表单。这就是为什么\
    \ getter 和 setter 有它们自己的规范，即 JavaBeans 规范。我们将遵循该惯的类称为 `JavaBeans`，是的，这在某种程度上延伸了\
    \ Java 那个关于咖啡的隐喻。\n\n看看上面的代码。每个字段都有一个命名正确的 getter 和 setter 吗？是否存在一个没有任何参数的构造函数？可见性级别是否正确？\n\
    \n不，它们并不是。在框架中使用该类的实例时，可能会发生奇怪的事情。大多数框架不会抛出异常，而是会静默失败——或者仅仅以你无法预料的方式运行。\n\n那么，我们需要修改什么才能这个类转换为\
    \ JavaBean 呢？\n\n```java\nclass Astronaut {\n    private String name;\n    private\
    \ boolean retired;\n\n    public Astronaut() {\n    }\n\n    public Astronaut(String\
    \ name) {\n        this.name = name;\n    }\n\n    public String getName() {\n\
    \        return name;\n    }\n\n    public void setName(String name) {\n     \
    \   this.name = name;\n    }\n\n    public boolean isRetired() {\n        return\
    \ retired;\n    }\n\n    public void setRetired(boolean retired) {\n        this.retired\
    \ = retired;\n    }\n}\n```\n\n我们以多种方式重构了代码。现在，上面的类是一个有效的 JavaBean。首先，我们将字段的修饰符改为\
    \ `private`，并将 getter 和 setter 改为 `public`。这确保了框架将使用 getter 和 setter，而不会通过直接访问字段来绕过它们。\n\
    \n接下来，我们添加了一个默认构造函数。大多数框架需要它来创建类的空实例，它们通过调用 setter 来为字段赋值。你可以很容易忽略这部分，因为如果你添加另一个带参数的构造函数，默认构造函数就不再可用。\n\
    \n最后，我们重命名了 setter 和 getter 以反映字段名。如果字段名为 `foo`，那么 getter 和 setter 应该命名为 `getFoo()`\
    \ 和 `setFoo()`。请注意，这对于布尔字段来说略有不同。setter 的名称保持不变，但 getter 变为 `isFoo()`——它读起来像一个问题。遗憾的是，Java\
    \ 不允许我们在那里加问号。\n\n最后一点说明：我们并不是说 JavaBeans 是编写代码的好方法，但在 Java 的某些框架中，你必须使用它们。\n\n\
    ## 避免单字母命名\n\n```java\nclass Inventory {\n    List<Supply> sl = new ArrayList<>();\n\
    \n    boolean isInStock(String n) {\n        Supply s = new Supply(n);\n     \
    \   int l = 0;\n        int h = sl.size() - 1;\n\n        while (l <= h) {\n \
    \           int m = l + (h - l) / 2;\n            int c = sl.get(m).compareTo(s);\n\
    \            if (c < 0) {\n                l = m + 1;\n            } else if (c\
    \ > 0) {\n                h = m - 1;\n            } else {\n                return\
    \ true;\n            }\n        }\n        return false;\n    }\n}\n```\n\n在大多数代码库中，你经常会发现变量名只有一个字母的变量。它们很常见，因为输入起来更快，而且某些\
    \ IDE 仍然以这种方式生成名称。但它们让代码变得难以阅读得多。毕竟，一个字母能能达多少意义呢？\n\n看看上面的代码。它展示了一个带有 `isInStock`\
    \ 方法的 `Inventory` 类。此方法内部的所有变量都是单字母命名的：`n`、`l`、`h`、`m`、`c`、`s`。\n\n你能理解方法内部发生了什么吗？实际上，它只是一个普通的二分查找。但由于变量名的原因，很难从代码中读出来。\n\
    \n使用单字母命名没有任何理由。尽管某些理论者希望如此，但代码远不仅仅是纯数学。一个普通的程序员每天要阅读数千行代码。如果她每看一眼，变量的都是相同的名字，且与代码的上下文无关，那么这项任务并不会变得更容易。这就是为什么我们应该给变量名赋予意义，而仅仅靠一个字母是做不到的。\n\
    \n顺便提一下：代码使用了小写字母 `l` 和数字 `1`。在大多数字体中它们非常难以区分。我们的建议是：简单避免使用单字母 `l` 作为变量名。大写的 `O`\
    \ 和数字 `0` 也是如此。\n\n让我们看看更长的变量名能带来什么区别。\n\n```java\nclass Inventory {\n    List<Supply>\
    \ sortedList = new ArrayList<>();\n\n    boolean isInStock(String name) {\n  \
    \      Supply supply = new Supply(name);\n        int low = 0;\n        int high\
    \ = sortedList.size() - 1;\n\n        while (low <= high) {\n            int middle\
    \ = low + (high - low) / 2;\n            int comparison = sortedList.get(middle).compareTo(supply);\n\
    \            if (comparison < 0) {\n                low = middle + 1;\n      \
    \      } else if (comparison > 0) {\n                high = middle - 1;\n    \
    \        } else {\n                return true;\n            }\n        }\n  \
    \      return false;\n    }\n}\n```\n\n令人惊讶，不是吗？如果没有全称，每个读者都必须在脑海中构建并记住下面这幅表：\n\
    \n| n | name | m | middle | sl | sortedList |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| l | low | c | comparison | | |\n| h | high | s | supply | | |\n\n\
    我们可以直接在代码中使用全称来省去这张表。这种解决方案没有任何坏处。有些人担心较长的名称会降低代码效率，但事实并非如此。编译器在编译时仍然会替换这些名称，而且在字节码中，全称和单字母名称看起来是一样的。区别在于字节码只由机器读取，而不是人类人类。\n\
    \n正如我们上面提到的，代码使用了二分查找。这使其成为进一步改进的绝佳候选对象，例如，*记录实现决策*或*优先使用 Java API 而非自造轮*。我们还可以*用常量替换魔法数字*。\n\
    \n## 避免缩写\n\n```java\nclass Logbook {\n    static final Path DIR = Paths.get(\"\
    /var/log\");\n    static final Path CSV = DIR.resolve(\"stats.csv\");\n    static\
    \ final String GLOB = \".log\";\n\n    void createStats() throws IOException {\n\
    \        try (DirectoryStream<Path> dirStr = Files.newDirectoryStream(DIR, GLOB);\n\
    \             BufferedWriter bufW = Files.newBufferedWriter(CSV)) {\n        \
    \    for (Path lFile : dirStr) {\n                String csvLn = String.format(\"\
    %s,%d,%s\",\n                    lFile,\n                    Files.size(lFile),\n\
    \                    Files.getLastModifiedTime(lFile));\n                bufW.write(csvLn);\n\
    \                bufW.newLine();\n            }\n        }\n    }\n}\n```\n\n\
    缩写是单字母命名的进阶，我们的世界充满了这类缩写：ASAP、FYI、TGIF、AFK、NASA、FBI、CYA、NYPD 等。许多程序员喜欢在代码中创建自己的缩写。显而易见的问题是，只有他们知道这些缩写——其他人都必须先学习。而学习需要时间。这就是为什么完全避免缩写更好，这样其他人就能更快地理解代码（并且有更少的\
    \ WTF 瞬间）。\n\n"
- fmt: "\nYou can read a lot of abbreviations in the code above: `DIR`, `CSV`, `GLOB`,\
    \ `dirStr`, `bufW`, `lFile`, and `csvLn`. Do you know immediately what they refer\
    \ to? For some you might, but probably not for all.\n\nOut of context, it’s hard\
    \ to determine what `bufW` or `dirStr` means. Together with the variable types\
    \ `BufferedWriter` and `DirectoryStream` it becomes more obvious, but it’s still\
    \ unnecessarily hard.\n\nAnd what the heck does `GLOB` stand for? It’s actually\
    \ a way to refer to sets of file paths common in Unix environments, which is what\
    \ the code above is for—for example, all Java files via `*.java`. But you have\
    \ to know that first.\n\nSometimes people abbreviate only parts of a variable:\
    \ `lFile` or `csvLn`. We have to channel our inner Sherlock Holmes to figure out\
    \ what the `l` or `Ln` mean.\n\nSo what should we do with abbreviations?\n\n```java\n\
    class Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\");\n\
    \    static final Path STATISTICS_CSV = LOG_FOLDER.resolve(\"stats.csv\");\n \
    \   static final String FILE_FILTER = \"*.log\";\n\n    void createStatistics()\
    \ throws IOException {\n        try (DirectoryStream<Path> logs = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n            BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV))\
    \ {\n            for (Path log : logs) {\n                String csvLine = String.format(\"\
    %s,%d,%s\",\n                    log,\n                    Files.size(log),\n\
    \                    Files.getLastModifiedTime(log));\n                writer.write(csvLine);\n\
    \                writer.newLine();\n            }\n        }\n    }\n}\n```\n\n\
    The rule is quite obvious: only use abbreviations that are very common, and use\
    \ long names for the rest.\n\nJust look at the code above. It’s much easier to\
    \ comprehend, and we don’t stumble upon strange variable names anymore.\n\nFirst,\
    \ we renamed the three fields from `DIR`, `CSV`, and `GLOB` to `LOG_FOLDER`, `STATISTICS_CSV`,\
    \ and `FILE_FILTER`. In our view, `CSV` (comma-separated values) is the only abbreviation\
    \ in the code that’s sufficiently well-known. We kept it and added a little bit\
    \ more context to it. Next, we replaced the abbreviations `DIR` and `GLOB` with\
    \ concise unabbreviated names. `FILE_FILTER` conveys the variable’s intent much\
    \ better than `GLOB`.\n\nYou don’t always have to spell out abbreviations in full.\
    \ For `bufW`, the full name would be `bufferedWriter`. We just use the second\
    \ word `writer` because that’s its purpose here. The fact that it has a buffer\
    \ is less important. And as the replacement for `dirStr`, the short name `logs`\
    \ seems much more informative than the full name `directoryStream`.\n\nLastly,\
    \ we renamed the variable `csvLn` to `csvLine`. Its purpose is to indicate that\
    \ it contains a line (of a CSV file), so why shouldn’t we just call it `line`,\
    \ too?\n\nTo sum up, you should try to avoid abbreviations and use them only if\
    \ they’re very common. If in doubt, spell it out!\n\n## Avoid Meaningless Terms\n\
    \n```java\nclass MainSpaceShipManager {\n    AbstractRocketPropulsionEngine abstractRocketPropulsionEngine;\n\
    \    INavigationController navigationController;\n    boolean turboEnabledFlag;\n\
    \n    void navigateSpaceShipTo(PlanetInfo planetInfo) {\n        RouteData data\
    \ = navigationController.calculateRouteData(planetInfo);\n        LogHelper.logRouteData(data);\n\
    \        abstractRocketPropulsionEngine.invokeTask(data, turboEnabledFlag);\n\
    \    }\n}\n```\n\nGood naming isn’t just about spelling out short names and making\
    \ names longer. Sometimes, long names can be just as burdensome. And there are\
    \ some terms programmers use often that have lost all meaning.\n\nLook at the\
    \ code above. It doesn’t contain abbreviations like in *Avoid Abbreviations*,\
    \ and all names are spelled out, but that doesn’t mean the naming is good. There\
    \ are various meaningless words in there that you can just remove. And we’ve seen\
    \ names like this many times in real production code.\n\nCan you spot which words\
    \ convey no meaning and just add text? What parts could you leave out without\
    \ impacting understandability?\n\nThere are some low-hanging fruits—meaningless\
    \ terms that people use very often, like “main,” “manager,” “data,” “info,” or\
    \ “flag.” They’re easy to spot. But what about the terms “abstract,” a method\
    \ named “invoke,” or a parameter’s type within a method name? Are those meaningful?\
    \ Not really.\n\n### Brevity and Naming: The Eternal Struggle\n\nBrevity in naming\
    \ isn’t necessarily a virtue. Most often, it’s better to have a verbose but descriptive\
    \ name instead of a cryptic abbreviation whose only benefit is that it’s easy\
    \ to type. Normally, you won’t type a full name anyway. Your IDE’s auto-completion\
    \ will do this for you.\n\nSo what parts could you leave out without understandability?\n\
    \n```java\nclass SpaceShip {\n    Engine engine;\n    Navigator navigator;\n \
    \   boolean turboEnabled;\n\n    void navigateTo(PlanetInfo destination) {\n \
    \       RouteData route = navigator.calculateRouteData(destination);\n       \
    \ Logger.log(route);\n        engine.follow(route, turboEnabled);\n    }\n}\n\
    ```\n\nActually, we can leave out a lot. Just compare the two snippets: we removed\
    \ 100 characters (about a quarter of the code). That’s a lot less to read and\
    \ think. Not bad! Let’s go through it.\n\nTo start with, we simply removed meaningless\
    \ terms like “data,” “info,” or “flag.” It’s rare that such terms add any meaning.\n\
    \nNext, when reading a type, we don’t care if it’s an enum, a class, an interface,\
    \ or an abstract class. After all, the type itself is already stating this. That’s\
    \ why the term `abstract` or `impl` doesn’t help in class names, and neither the\
    \ prefix `I` for names of interfaces. Don’t do this!\n\nA class’s name provides\
    \ context to its members and already conveys a lot of meaning. That’s why you\
    \ can remove domain specifiers like `rocket` in a class named `SpaceShip`. You\
    \ can do the same with repeated types in method names, as in `logRouteData()`,\
    \ which we renamed to `log()`. The parameter route itself already states what’s\
    \ being logged.\n\nVerbs like `invoke`, `call`, or `do` also convey little meaning\
    \ in method names. Instead of using these, you should try to find a more precise\
    \ and meaningful verb instead. Lastly, we often see meaningless terms in package\
    \ names as well. Watch out for words like `misc`, `other`, or `util`.\n\nOur advice\
    \ is to watch out for the terms mentioned here and to think twice whenever you\
    \ feel tempted to write them. Whether a term is actually meaningful or not depends\
    \ on the concrete context. Many frameworks have a hard time deciding as well.\
    \ One class name in the Spring framework is famous: Roses are red, leaves are\
    \ green, but only Java has AbstractSingletonFactoryBean.\n\n## Use Domain Terminology\n\
    \n```java\nclass Person {\n    String lastName;\n    String role;\n    int travels;\n\
    \    LocalDate employedSince;\n\n    String serializeAsLine() {\n        return\
    \ String.join(\",\",\n            Arrays.asList(lastName,\n            role,\n\
    \            String.valueOf(travels),\n            String.valueOf(employedSince))\n\
    \        );\n    }\n}\n```\n\nThe code you work on usually belongs to a specific\
    \ domain, and a domain has its own vocabulary. Think of sports; different sports\
    \ have their own domain-specific names for hurling, throwing, kicking, bending,\
    \ or dunking a different kind of ball. The more you insert the terms of your program’s\
    \ domain into your code, the better.\n"
