  trans: "\n\n在 Java 中，我们通过捕获和抛出异常来确保程序处理错误。在本章中探讨的比较将向你展示几个与处理异常相关的重要的“要做”和“不要做”。你将学习如何在尽可能收集错误信息的同时实现快速失败（fail\
    \ fast）（且不破坏异常原因链），以及如何显式地处理吞吞错误。在处理异常时，你的程序会离开正常的执行路径。这就是为什么你必须确保始终关闭你的稀缺资源。记住：未患于胜于于医！让我们开始吧。\n\
    \n## 快速失败 (Fail Fast)\n\n```java\nclass CruiseControl {\n    static final double\
    \ SPEED_OF_LIGHT_KMH = 1079252850;\n    static final double SPEED_LIMIT = SPEED_OF_LIGHT_KMH;\n\
    \n    private double targetSpeedKmh;\n\n    void setTargetSpeedKmh(double speedKmh)\
    \ {\n        if (speedKmh < 0) {\n            throw new IllegalArgumentException();\n\
    \        } else if (speedKmh <= SPEED_LIMIT) {\n            targetSpeedKmh = speedKmh;\n\
    \        } else {\n            throw new IllegalArgumentException();\n       \
    \ }\n    }\n}\n```\n\n让我们来看 `setTargetSpeedKmh()` 方法。这个带有三个分支的 `if` 条件确实进行了一些异常处理。但你能立即理解为什么要设计成那个结构吗？可能不能。\n\
    \n这个方法中的正常路径有点隐晦。它是三个分支中的第二个，被两个错误处理分支包围（或隐藏在之间）。我们主要感兴趣的是这条正常路径，因为那里存在实际的功能，而且它会在大多数时候执行。上面的代码浪费了开发者宝贵的时间，仅仅是为了在参数验证之间找到这条路径。\n\
    \n当你顺序读取这些分支时，最后一个是有麻烦的。第一个分支是验证，第二个是正常路径。此时，你可能认为你已经知道该方法是如何工作的以及它接受什么参数。但随后最后一个分支带着另一个验证条件出现了。你必须进行心理上的回滚，并更新你对参数验证的理解。这是一种完全没有必要的精力浪费。\n\
    \n代码中还有另一个不必要的复杂性。条件的所有分支都是连接的，因此你必须一起理解所有条件。对于条件 `speedKmh <= 0` 的第一个分支来说这很容易，但对于另外两个分支就变得复杂了。究竟哪个条件适用于第二个和第三个分支？是\
    \ `!(speedKmh <= 0) && speedKmh <= SPEED_LIMIT` 和 `!(!(speedKmh <= 0) && speedKmh\
    \ <= SPEED_LIMIT)`。这对 JVM 来说没问题，但对我们人类来说并不容易。\n\n那么，我们如何让这段代码更易读呢？通过快速失败：\n\n\
    ```java\nclass CruiseControl {\n    static final double SPEED_OF_LIGHT_KMH = 1079252850;\n\
    \    static final double SPEED_LIMIT = SPEED_OF_LIGHT_KMH;\n\n    private double\
    \ targetSpeedKmh;\n\n    void setTargetSpeedKmh(double speedKmh) {\n        if\
    \ (speedKmh < 0 || speedKmh > SPEED_LIMIT) {\n            throw new IllegalArgumentException();\n\
    \        }\n\n        targetSpeedKmh = speedKmh;\n    }\n}\n```\n\n我们将正常路径与参数验证分离开，并将两个组合条件放在了方法的顶部。如果其中一个成立，方法将立即返回并抛出\
    \ `IllegalArgumentException`。换句话说，方法是快速失败。\n\n快速失败使得整个方法更具可读且易于理解！不仅如此，我们甚至为正常路径减少了一层缩进。\n\
    \n将验证块想象成你俱乐部的保镖，将正常路径块想象成舞池区域。保镖确保没有未成年人可以进入你的俱乐部。我们信任保镖她正在工作，所以我们知道不需要在舞池上再次检查。这意味着我们可以专注于正常路径，而无需回想所有的验证条件。\n\
    \n有了这个解决方案，你可以立即一眼看出由空行隔开的两个部分结构。首先是参数验证，然后是方法的正常路径。这意味着你可以直接进入方法最重要的部分——正常路径，而不需要预先读取整个验证逻辑。\n\
    \n方法的结构现在很不错，但我们还可以进一步改进这个解决方案：我们应该应用 [在消息中解释原因]。\n\n## 始终捕获特定异常\n\n```java\n\
    class Transmission {\n    static Transmission parse(String rawMessage) {\n   \
    \     if (rawMessage != null && rawMessage.length() != MESSAGE_LENGTH) {\n   \
    \         throw new IllegalArgumentException(\"Bad message!\");\n        }\n\n\
    \        String rawId = rawMessage.substring(0, ID_LENGTH);\n        String rawContent\
    \ = rawMessage.substring(ID_LENGTH);\n        try {\n            int id = Integer.parseInt(rawId);\n\
    \            String content = rawContent.trim();\n            return new Transmission(id,\
    \ content);\n        } catch (Exception e) {\n            throw new IllegalArgumentException(\"\
    Bad message!\");\n        }\n    }\n}\n```\n\nJava 异常是一个相对复杂的层次结构的一部分。当你捕获异常时，你应该始终捕获最具体的类型。如果你捕获更通用的类型，就有可能吞掉你不该吞掉的错误。\n\
    \n上面的代码解析了一个 `String` 类型的消息，并将其分解为 `id` 和 `content` 部分。问题在于 `catch` 语句。任何类型的 `Exception`\
    \ 在这里都被捕获了。\n\n`Exception` 是 Java 中最通用的异常类型。唯一更通用的是 `Exception` 的超类：`Throwable`。如果你捕获\
    \ `Throwable`，你甚至会捕获虚拟机中的错误，例如 `OutOfError`。不要这样做！\n\n许多初学者发现捕获非常通用的类型很有吸引力。毕竟，你只需要一条语句就能消耗任何类型的错误。\n\
    \n但这只是表面上好。这意味着你捕获了在这里不想处理的异常类型，例如 `NullPointerException`。在大多数情况下，这种异常指示你的代码中存在需要你修复的\
    \ bug。当它发生时，你希望程序崩溃，以便你能够意识到这个问题。\n\n仅仅通过捕获异常来隐藏 bug 并不意味着它被修复了。它只是会在另一个时间点搞掉你的程序。\n\
    \n那么，你应该在这里捕获什么类型的异常呢？\n\n```java\nclass Transmission {\n    static Transmission\
    \ parse(String rawMessage) {\n        if (rawMessage != null && rawMessage.length()\
    \ != MESSAGE_LENGTH) {\n            throw new IllegalArgumentException(\"Bad message!\"\
    );\n        }\n\n        String rawId = rawMessage.substring(0, ID_LENGTH);\n\
    \        String rawContent = rawMessage.substring(ID_LENGTH);\n        try {\n\
    \            int id = Integer.parseInt(rawId);\n            String content = rawContent.trim();\n\
    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\"Bad message!\");\n  \
    \      }\n    }\n}\n```\n\n解决问题的办法非常简单。你只需要捕获 `try` 块中代码可能抛出的最具体的异常，而不是 `Exception`。\n\
    \n"
- fmt: "\nThere’s one specific type of exception that we need to take care of here:\
    \ `NumberFormatException`. This one will be thrown by `Integer.parseInt(rawId)`\
    \ if `rawId` contains something that the `Integer` class can’t turn into an integer\
    \ value. Basically, any nondigit character will cause it.\n\nSo all you need to\
    \ do is replace `Exception` with `NumberFormatException`. Then, the code will\
    \ no longer swallow errors that it shouldn’t, such as a `NullPointerException`.\n\
    \nSometimes, catching the most specific exception means that you need to catch\
    \ many exceptions. This might mean that you have to write many catch blocks instead\
    \ of just a single one. Don’t let the fact that more code is needed fool you into\
    \ believing that catching a general exception type is better! After all, more\
    \ code with less bugs is better than less code with more bugs.\n\nIf you do the\
    \ same handling for all exceptions, there’s also a convenient way to get around\
    \ multiple catch blocks. Since Java 7, there’s the multi-catch block. Say you\
    \ want to handle a `NumberFormatException` and an `IOException` in the same way.\
    \ Just write `catch(NumberFormatException | IOException e)` and combine two catch\
    \ blocks into one. Whichever method you use to structure your catch blocks, be\
    \ sure to catch the most specific exceptions only.\n\n## Explain Cause in Message\n\
    \n```java\nclass TransmissionParser {\n    static Transmission parse(String rawMessage)\
    \ {\n        if (rawMessage != null && rawMessage.length() != Transmission.MESSAGE_LENGTH)\
    \ {\n            throw new IllegalArgumentException();\n        }\n\n        String\
    \ rawId = rawMessage.substring(0, Transmission.ID_LENGTH);\n        String rawContent\
    \ = rawMessage.substring(Transmission.ID_LENGTH);\n        try {\n           \
    \ int id = Integer.parseInt(rawId);\n            String content = rawContent.trim();\n\
    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\"Bad message received!\"\
    );\n        }\n    }\n}\n```\n\nException handling is not only about catching\
    \ exceptions, but also about throwing them. When throwing an exception, you should\
    \ follow type conventions to make handling of the exception easier.\n\nThe type\
    \ of an exception already describes what is wrong: bad parameters of a method\
    \ cause an `IllegalArgumentException`; reading a nonexistent file causes a `FileNotFoundException`.\
    \ But the type alone isn’t enough because it lacks the context: which parameter\
    \ is wrong and why? Which file isn’t available on the filesystem?\n\nWe can only\
    \ fix bugs that we can reproduce. Otherwise, we don’t know whether we really fixed\
    \ them. Typically, we start with the stack trace of an exception and trace our\
    \ way back in the code until we find the root cause. If the exception itself provides\
    \ a detailed context, this is much easier.\n\nThe exceptions thrown in the code\
    \ above, however, lack context. The first `IllegalArgumentException` is created\
    \ with the default constructor and provides no context at all. The second one\
    \ comes with a message as input for the constructor, but it’s not really helpful.\
    \ Sadly, messages of this type are very common.\n\nWe suggest giving them a bit\
    \ more thought.\n\nSo how can we include the context within the message of the\
    \ exceptions?\n\n```java\nclass TransmissionParser {\n    static Transmission\
    \ parse(String rawMessage) {\n        if (rawMessage != null && rawMessage.length()\
    \ != Transmission.MESSAGE_LENGTH) {\n            throw new IllegalArgumentException(\n\
    \                String.format(\"Expected %d, but got %d characters in '%s'\"\
    ,\n                    Transmission.MESSAGE_LENGTH, rawMessage.length(),\n   \
    \                 rawMessage));\n        }\n\n        String rawId = rawMessage.substring(0,\
    \ Transmission.ID_LENGTH);\n        String rawContent = rawMessage.substring(Transmission.ID_LENGTH);\n\
    \        try {\n            int id = Integer.parseInt(rawId);\n            String\
    \ content = rawContent.trim();\n            return new Transmission(id, content);\n\
    \        } catch (NumberFormatException e) {\n            throw new IllegalArgumentException(\n\
    \                String.format(\"Expected number, but got '%s' in '%s'\",\n  \
    \                  rawId, rawMessage));\n        }\n    }\n}\n```\n\nInstead of\
    \ missing or useless information, we provide a triplet: what we expect, what we\
    \ got, and the overall context. A developer who traces an exception to its origin\
    \ will find the source much faster with such detailed information.\n\nWhat’s more,\
    \ we can reproduce the situation that causes the exception more easily. Even better,\
    \ we can reuse such triples as test cases—we just need to convert them into JUnit\
    \ tests to drive a bug fix and act as regression tests later on. We’ll get to\
    \ testing in the next chapter.\n\nYou probably already noticed: we use a template\
    \ for the message of an exception in the form of Expected [EXPECTED], but got\
    \ [ACTUAL] in [CONTEXT]. It forces us to include information about what was expected\
    \ (e.g., 140 characters) and what we got (e.g., 3 characters) and provides the\
    \ context (e.g., message “abc”). For instance: Expected 140, but got 3 characters\
    \ in message ’abc’. You can use any format you like, of course. For us, this one\
    \ really pays off—when (not if) exceptions occur in production.\n\nBut we’re not\
    \ done yet. Sometimes, exceptions can’t be handled directly. Instead, you have\
    \ to rethrow or convert them into a more general exception type. When you do,\
    \ stay clear of the pitfalls we’ll explain in the next comparison.\n\n## Avoid\
    \ Breaking the Cause Chain\n\n```java\nclass TransmissionParser {\n    static\
    \ Transmission parse(String rawMessage) {\n        if (rawMessage != null && rawMessage.length()\
    \ != Transmission.MESSAGE_LENGTH) {\n            throw new IllegalArgumentException(\n\
    \                String.format(\"Expected %d, but got %d characters in '%s'\"\
    ,\n                    Transmission.MESSAGE_LENGTH, rawMessage.length(),\n   \
    \                 rawMessage));\n        }\n\n        String rawId = rawMessage.substring(0,\
    \ Transmission.ID_LENGTH);\n        String rawContent = rawMessage.substring(Transmission.ID_LENGTH);\n\
    \        try {\n            int id = Integer.parseInt(rawId);\n            String\
    \ content = rawContent.trim();\n            return new Transmission(id, content);\n\
    \        } catch (NumberFormatException e) {\n            throw new IllegalArgumentException(\n\
    \                String.format(\"Expected number, but got '%s' in '%s'\",\n  \
    \                  rawId, rawMessage));\n        }\n    }\n}\n```\n\nExceptions\
    \ can cause more exceptions. When an exception is caught but cannot be handled,\
    \ it must be rethrown. If a bug is involved, this can propagate until the program\
    \ crashes. If the error handling was done right, you will be presented with a\
    \ stack trace that represents the cause chain—a list where each exception is linked\
    \ to the one that caused it. When tracking down a bug, a detailed cause chain\
    \ is worth a pile of gold.\n\nThat’s why you need to make sure that you never\
    \ break this chain. For instance, look at the code above. It catches the `NumberFormatException`\
    \ and throws a new `IllegalArgumentException` with an informative message instead.\
    \ No bad exception handling as such—but it breaks the cause chain!\n\nCan you\
    \ spot the problem? It’s the `IllegalArgumentException` not getting the reference\
    \ to its cause, the `NumberFormatException`. Without this link there’s no cause\
    \ chain. When you look at the stack trace of this `IllegalArgumentException`,\
    \ you won’t find a hint that it stems from a `NumberFormatException` or from what\
    \ line in the code. We lost a lot of useful information—the `NumberFormatException`\
    \ has its own message that provides more information and context on another level\
    \ of abstraction and its own stack trace with line numbers.\n"
  raw: 'There’s one specific type of exception that we need to take care of here:
    NumberFormatException. This one will be thrown by Integer.parseInt(rawId) if rawId
    contains something that the Integer class can’t turn into an integer value. Basically,
    any nondigit character will cause it.


    So all you need to do is replace Exception with NumberFormatException. Then, the
    code will no longer swallow errors that it shouldn’t, such as a NullPointerException.


    Sometimes, catching the most specific exception means that you need to catch many
    exceptions. This might mean that you have to write many catch blocks instead of
    just a single one. Don’t let the fact that more code is needed fool you into believing
    that catching a general exception type is better! After all, more code with less
    bugs is better than less code with more bugs.


    If you do the same handling for all exceptions, there’s also a convenient way
    to get around multiple catch blocks. Since Java 7, there’s the multi-catch block.
    Say you want to handle a NumberFormatException and an IOException in the same
    way. Just write catch(NumberFormatException | IOException e) and combine two catch
    blocks into one. Whichever method you use to structure your catch blocks, be sure
    to catch the most specific exceptions only.


    ## Explain Cause in Message


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    | » | **throw** **new** IllegalArgumentException(); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** IllegalArgumentException(*"Bad message received!"*); |


    |   | } |


    |   | } |


    |   | } |


    Exception handling is not only about catching exceptions, but also about throwing
    them. When throwing an exception, you should follow type conventions to make handling
    of the exception easier.


    The type of an exception already describes what is wrong: bad parameters of a
    method cause an IllegalArgumentException; reading a nonexistent file causes a
    FileNotFoundException. But the type alone isn’t enough because it lacks the context:
    which parameter is wrong and why? Which file isn’t available on the filesystem?


    We can only fix bugs that we can reproduce. Otherwise, we don’t know whether we
    really fixed them. Typically, we start with the stack trace of an exception and
    trace our way back in the code until we find the root cause. If the exception
    itself provides a detailed context, this is much easier.


    The exceptions thrown in the code above, however, lack context. The first IllegalArgumentException
    is created with the default constructor and provides no context at all. The second
    one comes with a message as input for the constructor, but it’s not really helpful.
    Sadly, messages of this type are very common.


    We suggest giving them a bit more thought.


    So how can we include the context within the message of the exceptions?


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected %d, but got %d characters in ''%s''"*, |


    |   | Transmission.MESSAGE_LENGTH, rawMessage.length(), |


    |   | rawMessage)); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected number, but got ''%s'' in ''%s''"*, |


    |   | rawId, rawMessage)); |


    |   | } |


    |   | } |


    |   | } |


    Instead of missing or useless information, we provide a triplet: what we expect,
    what we got, and the overall context. A developer who traces an exception to its
    origin will find the source much faster with such detailed information.


    What’s more, we can reproduce the situation that causes the exception more easily.
    Even better, we can reuse such triples as test cases—we just need to convert them
    into JUnit tests to drive a bug fix and act as regression tests later on. We’ll
    get to testing in the next chapter.


    You probably already noticed: we use a template for the message of an exception
    with [*Favor Format Over Concatenation*](#f_0029.xhtml_sec.favor-format-over-concat)
    in the form of Expected [EXPECTED], but got [ACTUAL] in [CONTEXT]. It forces us
    to include information about what was expected (e.g., 140 characters) and what
    we got (e.g., 3 characters) and provides the context (e.g., message “abc”). For
    instance: Expected 140, but got 3 characters in message ’abc’. You can use any
    format you like, of course. For us, this one really pays off—when (not if) exceptions
    occur in production.


    But we’re not done yet. Sometimes, exceptions can’t be handled directly. Instead,
    you have to rethrow or convert them into a more general exception type. When you
    do, stay clear of the pitfalls we’ll explain in the next comparison: [*Avoid Breaking
    the Cause Chain*](#f_0056.xhtml_sec.avoid_breaking_cause_chain).


    ## Avoid Breaking the Cause Chain


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    |   | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected %d, but got %d characters in ''%s''"*, |


    |   | Transmission.MESSAGE_LENGTH, rawMessage.length(), |


    |   | rawMessage)); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    |   | } **catch** (NumberFormatException e) { |


    | » | **throw** **new** IllegalArgumentException( |


    |   | String.format(*"Expected number, but got ''%s'' in ''%s''"*, |


    |   | rawId, rawMessage)); |


    |   | } |


    |   | } |


    |   | } |


    Exceptions can cause more exceptions. When an exception is caught but cannot be
    handled, it must be rethrown. If a bug is involved, this can propagate until the
    program crashes. If the error handling was done right, you will be presented with
    a stack trace that represents the cause chain—a list where each exception is linked
    to the one that caused it. When tracking down a bug, a detailed cause chain is
    worth a pile of gold.


    That’s why you need to make sure that you never break this chain. For instance,
    look at the code above. It catches the NumberFormatException and throws a new
    IllegalArgumentException with an informative message instead. No bad exception
    handling as such—but it breaks the cause chain!


    Can you spot the problem? It’s the IllegalArgumentException not getting the reference
    to its cause, the NumberFormatException. Without this link there’s no cause chain.
    When you look at the stack trace of this IllegalArgumentException, you won’t find
    a hint that it stems from a NumberFormatException or from what line in the code.
    We lost a lot of useful information—the NumberFormatException has its own message
    that provides more information and context on another level of abstraction and
    its own stack trace with line numbers.'
