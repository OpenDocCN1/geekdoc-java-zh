    # Chapter 2


    Level Up Your Code Style


    In role-playing games, no matter whether they’re digital or tabletop, you usually
    play a character with a unique set of skills. As the game progresses, your character
    moves through the game world, interacts with its inhabitants, and gathers experience
    through quests. Eventually, your character will gain new skills and “level up”
    her skills to a new a stage of mastery, becoming faster, stronger, smarter, or
    whatever it was you were practicing.


    Programming is similar to playing games, and it can be just as addictive. It’s
    real life, so you don’t control a character—you are in the game. You move through
    the digital world and gather experience. You discover distant places of programming
    languages with very different language paradigms. You meet fellow programmers
    who have different viewpoints on the most intricate aspects of style, such as
    whether to put a curly bracket in a new line. You practice your skills by programming,
    learning new frameworks or language concepts that you were unaware of, and sharpening
    your understanding of the ones you already know. Eventually, you rise to a new
    level of proficiency in programming.


    This chapter is a level up from the more basic items we discussed in the previous
    chapter. We’ll go through a number of more advanced concepts of the Java language,
    as well as aspects of code style.


    You’ll learn how to deal with magic numbers—either by replacing them with constants
    or, even better, with enums—and you’ll see why it makes sense to use newlines
    for grouping code. On top of that, we’ll show you why you should rely on the Java
    API as often as possible, and we’ll go over several typical pitfalls you should
    avoid when you do so. You’ll see how to best iterate over data structures without
    triggering unwanted exceptions or causing performance problems. Lastly, we’ll
    provide you with a handy method for formatting strings in your code. So let’s
    get to the next level!


    ## Replace Magic Numbers with Constants


    |   | **class** CruiseControl { |


    |   |  |


    |   | **private** **double** targetSpeedKmh; |


    |   |  |


    |   | **void** setPreset(**int** speedPreset) { |


    | » | **if** (speedPreset == 2) { |


    | » | setTargetSpeedKmh(16944); |


    | » | } **else** **if** (speedPreset == 1) { |


    | » | setTargetSpeedKmh(7667); |


    | » | } **else** **if** (speedPreset == 0) { |


    | » | setTargetSpeedKmh(0); |


    |   | } |


    |   | } |


    |   |  |


    |   | **void** setTargetSpeedKmh(**double** speed) { |


    |   | targetSpeedKmh = speed; |


    |   | } |


    |   | } |


    Oftentimes when programmers need to represent a set of options in code, they use
    a set of numbers. Without additional context, we call those numbers “magic numbers”:
    numbers without an apparent meaning that steer the program. They make your code
    harder to understand and more error-prone.


    This code snippet depicts a cruise control. It lets you set a targetSpeedKmh by
    calling setPreset() with an integer that the CruiseControl translates into a concrete
    value.


    The current solution is very prone to errors and easy to misuse. If you call setPreset(),
    you need to have in-depth knowledge of the internals of the method. Otherwise,
    you can’t select a proper speedPreset as input.


    Also, the actual targetSpeedKmh that a speedPreset corresponds to is arbitrary.
    Since the CruiseControl communicates no information of available speed presets,
    you have to know the options by heart.


    Obviously, code that uses magic numbers is harder to understand. It’s also easy
    to misuse. The compiler won’t prevent you from entering a number that the code
    doesn’t know.


    Let’s see how we can improve the code and dispel the magic in these numbers.


    |   | **class** CruiseControl { |


    |   |  |


    |   | **static** **final** **int** STOP_PRESET = 0; |


    |   | **static** **final** **int** PLANETARY_SPEED_PRESET = 1; |


    | » | **static** **final** **int** CRUISE_SPEED_PRESET = 2; |


    |   |  |


    | » | **static** **final** **double** CRUISE_SPEED_KMH = 16944; |


    |   | **static** **final** **double** PLANETARY_SPEED_KMH = 7667; |


    |   | **static** **final** **double** STOP_SPEED_KMH = 0; |


    |   |  |


    |   | **private** **double** targetSpeedKmh; |


    |   |  |


    |   | **void** setPreset(**int** speedPreset) { |


    | » | **if** (speedPreset == CRUISE_SPEED_PRESET) { |


    |   | setTargetSpeedKmh(CRUISE_SPEED_KMH); |


    |   | } **else** **if** (speedPreset == PLANETARY_SPEED_PRESET) { |


    |   | setTargetSpeedKmh(PLANETARY_SPEED_KMH); |


    |   | } **else** **if** (speedPreset == STOP_PRESET) { |


    |   | setTargetSpeedKmh(STOP_SPEED_KMH); |


    |   | } |


    |   | } |


    |   |  |


    |   | **void** setTargetSpeedKmh(**double** speed) { |


    |   | targetSpeedKmh = speed; |


    |   | } |


    |   | } |


    This time, we got rid of the magic part. We’ve done this by assigning each number
    a meaningful and accessible name.


    In this code, we’ve added variables for all available preset options and target
    speeds. These variables are static and final—that is, they’re constants. The modifiers
    make sure that the variables exist once and only once (static) and that they can’t
    be changed (final). We’ve written the names of the constants in all caps, which
    is a Java code convention.


    Arguably, the static modifier is an optimization. We might have valid reasons
    to tie the variables to instances of CruiseControl after all. In any case, you
    should make the variables final. Otherwise they’d be mutable and could be changed
    at any point in time.


    Based on the variable names, it’s now much clearer which speed presets and target
    speeds exist. But we can do even better! Take a look at [*Favor Enums Over Integer
    Constants*](#f_0024.xhtml_sec.favor_enums_over_integer_constants).


    ## Favor Enums Over Integer Constants


    |   | **class** CruiseControl { |


    | » | **static** **final** **int** STOP_PRESET = 0; |


    |   | **static** **final** **int** PLANETARY_SPEED_PRESET = 1; |


    |   | **static** **final** **int** CRUISE_SPEED_PRESET = 2; |


    |   |  |


    | » | **static** **final** **double** STOP_SPEED_KMH = 0; |


    |   | **static** **final** **double** PLANETARY_SPEED_KMH = 7667; |


    |   | **static** **final** **double** CRUISE_SPEED_KMH = 16944; |'
