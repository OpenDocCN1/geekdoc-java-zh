    conventions because their types differ. This can be a problem if you have to integrate
    with frameworks that rely on this convention. In this case, you’re forced to make
    do without Optional return types. Otherwise, Optional can still make your program
    more robust by avoiding null values.


    ## Use Optionals as Streams


    |   | **class** BackupJob { |


    |   |  |


    |   | Communicator communicator; |


    |   | Storage storage; |


    |   |  |


    |   | **void** backupToEarth() { |


    |   | Optional<Connection> connectionOptional = |


    |   | communicator.getConnectionToEarth(); |


    | » | **if** (!connectionOptional.isPresent()) { |


    |   | **throw** **new** IllegalStateException(); |


    |   | } |


    |   |  |


    | » | Connection connection = connectionOptional.get(); |


    |   | **if** (!connection.isFree()) { |


    |   | **throw** **new** IllegalStateException(); |


    |   | } |


    |   |  |


    |   | connection.send(storage.getBackup()); |


    |   | } |


    |   | } |


    In the previous comparisons, we’ve shown that Optional can be a good replacement
    for null. But it’s not just that, and there’s a good reason why the class was
    added to lambda expressions in Java. An Optional is also a special kind of stream,
    one with either zero or exactly one element.


    That means that you can directly apply all regular stream operations, such as
    filter() or map(), to an Optional. This makes for a good opportunity to write
    more concise code.


    Take a look at the code above. It stores a (possibly absent) value in the variable
    named connectionOptional. That’s necessary, because we need to a) check if there’s
    an actual value by calling isPresent(), and b) retrieve that value by calling
    get(). But it doesn’t really make for a good or descriptive variable name.


    The reason for storing the Optional in a variable and its awkward name lies in
    an impedance mismatch. Although this is barely visible in the code, the Optional
    class is made for the functional programming style, where the rest of the method
    follows an imperative style. When you switch between these styles, you have to
    use methods like get() to perform the switch. You can make the code much more
    readable just by avoiding this context switch.


    You’ll find such switches very often in code in practice. The functional programming
    style is still very new for Java. Many developers aren’t yet familiar with it,
    or they have problems applying it fully. That’s why they often switch back to
    an imperative style, even when they started differently.


    Check out how much you can improve the code by implementing everything functionally:


    |   | **class** BackupJob { |


    |   |  |


    |   | Communicator communicator; |


    |   | Storage storage; |


    |   |  |


    |   | **void** backupToEarth() { |


    |   | Connection connection = communicator.getConnectionToEarth() |


    | » | .filter(Connection::isFree) |


    | » | .orElseThrow(IllegalStateException::**new**); |


    |   | connection.send(storage.getBackup()); |


    |   | } |


    |   | } |


    It’s actually quite simple. Just use the arsenal of methods available in the Optional
    class: the intermediate operations filter(), map(), and flatMap(), and the terminal
    operations orElse(), orElseThrow(), orElseGet(), and ifPresent().


    In the code above, we used filter() to check if the code is available and free
    and orElseThrow() to trigger the exception if it’s not. That makes for a drastic
    reduction of the amount of code. Just compare the code listings. In this case,
    less is more!


    The code is way more concise now. And that’s not just because we got rid of the
    strange connectionOptional variable. The code also signals clearly what happens
    if the connection is absent or not free through the orElseThrow() operation. Before,
    this was distributed into two separate if conditions.


    Other methods of Optional might be more appropriate in a different situation.
    For example, if you don’t really care about an absent value, you can just call
    ifPresent() instead. And if you’re only interested in reading from the Optional,
    you can transform it and provide a default value with .map().orElse(defaultValue).


    The latter usage is quite common. Take a look at an example in the code below:


    |   | String state = communicator.getConnectionToEarth() |


    |   | .map(Connection::isFree) |


    |   | .map(isFree -> isFree ? *"free"* : *"busy"*) |


    |   | .orElse(*"absent"*); |


    ## What Have You Learned?


    As you’ve seen in this chapter, the functional style really makes for a different
    way to program Java. You can be so much more concise if you just describe what
    you want to achieve instead of instructing the computer step-by-step.


    If coding the imperative way still feels more natural, remember that you just
    might be more familiar with this style. After all, this was the way you learned
    first. Keep in mind that the unfamiliar is not necessarily the more complex—you
    just need to get used to it. But you already know the basics.


    You’re able to iterate over data structures more efficiently by converting them
    into streams, and you know how to get back into the imperative style even in complex
    situations. You also learned how to interleave the functional and the imperative
    style neatly with the help of method references when that’s most appropriate—for
    example, to improve the testability of your methods. Anonymous classes will no
    longer clutter up your code with irrelevant syntax because you can just replace
    them with lambda expressions. You’ve learned how you can make your program less
    fragile by using Optional return types instead of null values, and how you can
    integrate Optionals with streams.


    But it’s not just about applying functional programming. You’ve also seen what
    can go wrong and where you should be extra careful. You’re aware that side effects
    can damage the correctness of your code, and the functional style doesn’t make
    for more readable code if there’s a lot of exception handling involved. And although
    Optional values are helpful, you know that they’re no good if you overuse them.


    Believe it or not, this is the end of the core part of this book. We’re really
    happy that you’ve stuck with us this far. By now, you’ve certainly increased your
    knowledge about clean and readable Java code.


    Of course, when you go into professional software development, there are many
    more aspects to consider. So far, we’ve hardly touched on concurrency, and there
    are important things you should know about how you get from just code to a shippable
    product, like continuous integration and delivery. We could continue with comparisons
    about those topics. But if we did, the book would be 500 pages long and no one
    would want to read it. Instead, we’ll give you a short outlook on several important
    aspects that we couldn’t cover adequately here. In addition to a concise summary
    of those concepts, the last chapter will provide you with references and links
    to reading material that will take you into more depth for these topics. Then
    you’ll know exactly how to continue after you’ve finished this book. Never stop
    learning!


