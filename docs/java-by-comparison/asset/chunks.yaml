  trans: "\n在上面的代码中，你看到一个表示事人的类，它包含姓氏、角色、旅行次数和入职日期。这个类非常通用，你可能在大多数存储员工数据的系统中都能找到类似的内容。你可能仍然会疑惑，为什么代码恰好使用了这些属性。为什么它只考虑了姓氏而没有考虑名字？为什么它要记录旅行次数呢？\n\
    \n方法名 `serializeAsLine()` 也相当相当通用。从这个名字中，我们只知道这个人的字段被序列化成了一个不带换行符的字符串。但我们不知道这种格式是否有什么特殊之处。\n\
    \n## 所有的名字都同等重要吗？\n\n好的命名很重要，但简单来说的回答是否定的。根据经验法则，名称的作用范围（scope）越大，它的重要性就越高。原因很简单：大范围名称（如\
    \ `class` 或 `package`）与小范围名称（如 `method` 内部的 `variable`）相比，更有可能被读取。这就是为什么你应该在更重要的名称上花费更多精力。\n\
    \n来看领域特定的命名是如何提高代码可读性的：\n\n```java\nclass Astronaut {\n  String tagName;\n  String\
    \ rank;\n  int missions;\n  LocalDate activeDutySince;\n\n  String toCSV() {\n\
    \    return String.join(\",\",\n      Arrays.asList(\n        tagName,\n     \
    \   rank,\n        String.valueOf(missions),\n        String.valueOf(activeDutySince))\n\
    \    );\n  }\n}\n```\n\n在本书中，我们将代码示例放在一个受火星任务启发的领域中，并将所有的名称都融入到这个特定的领域中。这自动让代码变得清晰得多。\n\
    \n当置于语文中时，不同属性的含义就更容易理解了。首先，我们想要存储关于 `Astronaut`（航员）的数据，而不仅仅是 `Person`（人），这从类名应该是显而易见的。当然，在现实生活中航员也是人，但我们只感兴趣于与航员相关的方面。在这个设定下，`lastname`\
    \ 指的是航员佩戴的标签上的文字，`role` 实际上指的是她所处的 `rank`（军衔），而现在 `travels` 也变得清晰清晰了，因为它指的是太空任务的次数。同样，`employedSince`\
    \ 实际上指的是 `activeDutySince`（现役起始日期）。\n\n但火星任务并不是类中唯一的领域。代码处理的是技术概念，这意味着你总是隐含地处于一个拥有自己一套术语的技术领域中。正因如此，我们将方法\
    \ `serializeAsLine()` 重命名为 `toCSV()`。毕竟，航员的序列化表示的结果格式是一行用逗号分隔的值。这使得方法的含义对大多数程序员来说更加显而易见，仅仅因为\
    \ `CSV` 这个术语在编程领域非常常见，正如我们在避免缩写中看到的。\n\n总结一下：你应该尽可能让代码中的名称与其所属的领域保持一致，并避免通用的名称。\n\
    \n## 你学到了什么？\n\n命名是你日常开发工作中面临的最困难的任务之一。糟糕的命名通常不会阻止你的代码编译（所以没有哪个编译器能帮助你发现真正糟糕的名字），但它会使代码变得更难阅读和理解。这可能会让你的代码维护变成一场噩梦。\n\
    \n这就是为什么我们在书中增加了命名这一章。良好的命名并不像你在这里看到的其他对比中看到的某些问题那样界限明确和定义良好。根据我们的经验，适当的命名永远没有完结的时候。当你看到一段自己以前写的代码时，很有可能你会发现命名上可以改进的地方，仅仅是因为你现在有更多的时间来熟悉领域的术语。我们的建议是，当脑子里出现更好的名字时，始终要重构。\n\
    \n说到命名，惯例占了一半功。即使你想了一个好名字，如果它违反了 Java 惯例，它看起来也会糟糕。惯例在命名 getter 和 setter 时尤为重要，这是\
    \ Java 中唯一当你在使用某些框架时，糟糕的命名可能导致编译或运行时错误的部分。但除了惯例不谈，好的名字不应该太短（注意单字母字母和缩写），也不应该太长（充满了无意义的术语），要达到正确的平衡点真的非常困难。最好的办法是始终让名称与你编写代码所属的领域保持一致。\n\
    \n在下一章中，我们将回到一个不仅影响你代码的可理解性，而且影响其功能正确性的主题：异常处理。无论你写的是什么种程序，意外都是可能发生的，准备应对意外是你的工作。但由于异常处理打破了常规控制流，它带来了引入微妙\
    \ bug 或以难以理解的方式实现它的巨大风险。我们将向你展示一些避免这种情况的技巧和窍门。\n\n#### 注脚\n\n- 29 : [`www.oracle.com/technetwork/java/codeconventions-150003.pdf`](http://www.oracle.com/technetwork/java/codeconventions-150003.pdf)\n\
    - 30 : [`download.oracle.com/otndocs/`](http://download.oracle.com/otndocs/)\n\
    - 31 \n- 32 \n- 33 \n"
- fmt: "\nIn Java, we ensure our program handle errors by catching and throwing exceptions.\
    \ The comparisons we’ll explore in this chapter will show you several important\
    \ do’s and don’ts related to handling exceptions. You will learn how to fail fast\
    \ while collecting as much information about the error as possible (without breaking\
    \ the exception cause chain) and be explicit about swallowing errors. When handling\
    \ exceptions, your program will leave the normal path of executions. That’s why\
    \ you need to be sure you always close your scarce resources. Remember: It’s better\
    \ to be safe than sorry! Let’s begin.\n\n## Fail Fast\n\n```java\nclass CruiseControl\
    \ {\n    static final double SPEED_OF_LIGHT_KMH = 1079252850;\n    static final\
    \ double SPEED_LIMIT = SPEED_OF_LIGHT_KMH;\n\n    private double targetSpeedKmh;\n\
    \n    void setTargetSpeedKmh(double speedKmh) {\n        if (speedKmh < 0) {\n\
    \            throw new IllegalArgumentException();\n        } else if (speedKmh\
    \ <= SPEED_LIMIT) {\n            targetSpeedKmh = speedKmh;\n        } else {\n\
    \            throw new IllegalArgumentException();\n        }\n    }\n}\n```\n\
    \nLet’s take a look at the method `setTargetSpeedKmh()`. The `if` conditional\
    \ with its three branches surely does some exception handling. But do you immediately\
    \ understand why it’s structured that way? Probably not.\n\nThe normal path in\
    \ this method is a little bit concealed. It’s the second of the three branches\
    \ surrounded by (or hidden in between) two branches of error handling. We’re primarily\
    \ interested in this normal path, because there lies the actual functionality,\
    \ and this one will be executed most of the time. The code above wastes precious\
    \ developer time just for spotting that path between the parameter validation.\n\
    \nWhen you read those branches sequentially, the last one is troublesome. The\
    \ first branch is a validation, and the second the normal path. At that point,\
    \ you might think you know how the method works and what parameters it accepts.\
    \ But then the last branch comes along with another validation condition. You\
    \ have to do a mental rollback and update your understanding of the parameter\
    \ validation. This is a waste of mental energy that’s just not necessary.\n\n\
    There’s another unnecessary complication in the code. All branches of the conditional\
    \ are connected so you have to understand all conditions together. This is easy\
    \ for the first branch with the condition `speedKmh <= 0`, but it becomes more\
    \ complicated for the other two. Which condition applies exactly for the second\
    \ and third branches? It’s `!(speedKmh <= 0) && speedKmh <= SPEED_LIMIT` and `!(!(speedKmh\
    \ <= 0) && speedKmh <= SPEED_LIMIT)`. No problem for the JVM, but it’s not that\
    \ easy for us humans.\n\nSo, how can we make this code more understandable? By\
    \ failing fast:\n\n```java\nclass CruiseControl {\n    static final double SPEED_OF_LIGHT_KMH\
    \ = 1079252850;\n    static final double SPEED_LIMIT = SPEED_OF_LIGHT_KMH;\n\n\
    \    private double targetSpeedKmh;\n\n    void setTargetSpeedKmh(double speedKmh)\
    \ {\n        if (speedKmh < 0 || speedKmh > SPEED_LIMIT) {\n            throw\
    \ new IllegalArgumentException();\n        }\n\n        targetSpeedKmh = speedKmh;\n\
    \    }\n}\n```\n\nWe separated the normal path from parameter validations and\
    \ placed the two combined conditions at the top of the method. If one of them\
    \ holds, the method returns immediately and throws an `IllegalArgumentException`.\
    \ In other words, the method fails fast.\n\nFailing fast makes the whole method\
    \ more readable and understandable! But not only that, we even got rid of one\
    \ level of indentation for the normal path.\n\nThink of the validation block as\
    \ the bouncer of your club and the normal path block as the dance area. The bouncer\
    \ ensures that no underaged party people can enter your club. We trust the bouncer\
    \ that she’s doing her job, so we know we don’t need to check again on the dance\
    \ floor. That means we can concentrate on the normal path without having to recall\
    \ all validation conditions.\n\nAnd with that solution, you can immediately spot\
    \ the two-part structure separated by an empty line. First comes the parameter\
    \ validation, then the normal path of the method. This means that you can jump\
    \ right into the most important part of the method—the normal path—and you don’t\
    \ need to read the whole validation logic upfront.\n\nThe structure of the method\
    \ is quite good now, but we can improve this solution even more: we should apply\
    \ [Explain Cause in Message].\n\n## Always Catch Specific Exception\n\n```java\n\
    class Transmission {\n    static Transmission parse(String rawMessage) {\n   \
    \     if (rawMessage != null && rawMessage.length() != MESSAGE_LENGTH) {\n   \
    \         throw new IllegalArgumentException(\"Bad message!\");\n        }\n\n\
    \        String rawId = rawMessage.substring(0, ID_LENGTH);\n        String rawContent\
    \ = rawMessage.substring(ID_LENGTH);\n        try {\n            int id = Integer.parseInt(rawId);\n\
    \            String content = rawContent.trim();\n            return new Transmission(id,\
    \ content);\n        } catch (Exception e) {\n            throw new IllegalArgumentException(\"\
    Bad message!\");\n        }\n    }\n}\n```\n\nExceptions in Java are part of a\
    \ relatively complex hierarchy. When you catch an exception, you should always\
    \ catch the most specific type. If you catch a more general type, you risk swallowing\
    \ errors you shouldn’t.\n\nThe code above parses a message of type `String` and\
    \ dissects it into an `id` and `content` part. The problem lies in the `catch`\
    \ statement. Any type of `Exception` is caught here.\n\n`Exception` is the most\
    \ general exception type in Java. The only thing that’s even more general is the\
    \ super type of `Exception`: `Throwable`. If you catch `Throwable`, you’ll even\
    \ catch errors in the virtual machine, such as `OutOfError`. Don’t do this!\n\n\
    Many beginners find it tempting to catch a very general type. After all, you consume\
    \ practically any type of error with a single statement.\n\nBut this is only good\
    \ on the surface. It means that you catch exception types you don’t want to handle\
    \ here, such as `NullPointerException`. In most cases, this exception indicates\
    \ a bug in your code that you need to fix. When it occurs, you want the program\
    \ to crash so that you become aware of the problem.\n\nJust because you hide a\
    \ bug by catching an exception doesn’t mean it’s fixed. It will just bring down\
    \ your program at a more point in time.\n\nSo what type of exception should you\
    \ catch here?\n\n```java\nclass Transmission {\n    static Transmission parse(String\
    \ rawMessage) {\n        if (rawMessage != null && rawMessage.length() != MESSAGE_LENGTH)\
    \ {\n            throw new IllegalArgumentException(\"Bad message!\");\n     \
    \   }\n\n        String rawId = rawMessage.substring(0, ID_LENGTH);\n        String\
    \ rawContent = rawMessage.substring(ID_LENGTH);\n        try {\n            int\
    \ id = Integer.parseInt(rawId);\n            String content = rawContent.trim();\n\
    \            return new Transmission(id, content);\n        } catch (NumberFormatException\
    \ e) {\n            throw new IllegalArgumentException(\"Bad message!\");\n  \
    \      }\n    }\n}\n```\n\nThe fix to this problem is very simple. You just need\
    \ to catch the most specific exception that might be thrown by the code in the\
    \ `try` instead of `Exception`.\n"
  raw: 'In Java, we ensure our program handle errors by catching and throwing exceptions.
    The comparisons we’ll explore in this chapter will show you several important
    do’s and don’ts related to handling exceptions. You will learn how to fail fast
    while collecting as much information about the error as possible (without breaking
    the exception cause chain) and be explicit about swallowing errors. When handling
    exceptions, your program will leave the normal path of executions. That’s why
    you need to be sure you always close your scarce resources. Remember: It’s better
    to be safe than sorry! Let’s begin.


    ## Fail Fast


    |   | **class** CruiseControl { |


    |   | **static** **final** **double** SPEED_OF_LIGHT_KMH = 1079252850; |


    |   | **static** **final** **double** SPEED_LIMIT = SPEED_OF_LIGHT_KMH; |


    |   |  |


    |   | **private** **double** targetSpeedKmh; |


    |   |  |


    |   | **void** setTargetSpeedKmh(**double** speedKmh) { |


    | » | **if** (speedKmh < 0) { |


    |   | **throw** **new** IllegalArgumentException(); |


    |   | } **else** **if** (speedKmh <= SPEED_LIMIT) { |


    |   | targetSpeedKmh = speedKmh; |


    | » | } **else** { |


    |   | **throw** **new** IllegalArgumentException(); |


    |   | } |


    |   | } |


    |   | } |


    Let’s take a look at the method setTargetSpeedKmh(). The if conditional with its
    three branches surely does some exception handling. But do you immediately understand
    why it’s structured that way? Probably not.


    The normal path in this method is a little bit concealed. It’s the second of the
    three branches surrounded by (or hidden in between) two branches of error handling.
    We’re primarily interested in this normal path, because there lies the actual
    functionality, and this one will be executed most of the time. The code above
    wastes precious developer time just for spotting that path between the parameter
    validation.


    When you read those branches sequentially, the last one is troublesome. The first
    branch is a validation, and the second the normal path. At that point, you might
    think you know how the method works and what parameters it accepts. But then the
    last branch comes along with another validation condition. You have to do a mental
    rollback and update your understanding of the parameter validation. This is a
    waste of mental energy that’s just not necessary.


    There’s another unnecessary complication in the code. All branches of the conditional
    are connected so you have to understand all conditions together. This is easy
    for the first branch with the condition speedKmh <= 0, but it becomes more complicated
    for the other two. Which condition applies exactly for the second and third branches?
    It’s !(speedKmh <= 0) && speedKmh <= SPEED_LIMIT and !(!(speedKmh <= 0) && speedKmh
    <= SPEED_LIMIT). No problem for the JVM, but it’s not that easy for us humans.


    So, how can we make this code more understandable? By failing fast:


    |   | **class** CruiseControl { |


    |   | **static** **final** **double** SPEED_OF_LIGHT_KMH = 1079252850; |


    |   | **static** **final** **double** SPEED_LIMIT = SPEED_OF_LIGHT_KMH; |


    |   |  |


    |   | **private** **double** targetSpeedKmh; |


    |   |  |


    |   | **void** setTargetSpeedKmh(**double** speedKmh) { |


    | » | **if** (speedKmh < 0 &#124;&#124; speedKmh > SPEED_LIMIT) { |


    |   | **throw** **new** IllegalArgumentException(); |


    |   | } |


    |   |  |


    |   | targetSpeedKmh = speedKmh; |


    |   | } |


    |   | } |


    We separated the normal path from parameter validations and placed the two combined
    conditions at the top of the method. If one of them holds, the method returns
    immediately and throws an IllegalArgumentException. In other words, the method
    fails fast.


    Failing fast makes the whole method more readable and understandable! But not
    only that, we even got rid of one level of indentation for the normal path.


    Think of the validation block as the bouncer of your club and the normal path block
    as the dance area. The bouncer ensures that no underaged party people can enter
    your club. We trust the bouncer that she’s doing her job, so we know we don’t
    need to check again on the dance floor. That means we can concentrate on the normal
    path without having to recall all validation conditions.


    And with that solution, you can immediately spot the two-part structure separated
    by an empty line. First comes the parameter validation, then the normal path of
    the method. This means that you can jump right into the most important part of
    the method—the normal path—and you don’t need to read the whole validation logic
    upfront.


    The structure of the method is quite good now, but we can improve this solution
    even more: we should apply [*Explain Cause in Message*](#f_0055.xhtml_sec.explain_cause_in_message)
    and [*Simplify Boolean Expressions*](#f_0016.xhtml_sec.simplify_boolean_expressions).
    Go ahead and try it for yourself!


    ## Always Catch Most Specific Exception


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** |


    |   | && rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    |   | **throw** **new** IllegalArgumentException(*"Bad message received!"*); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    | » | } **catch** (Exception e) { |


    |   | **throw** **new** IllegalArgumentException(*"Bad message received!"*); |


    |   | } |


    |   | } |


    |   | } |


    Exceptions in Java are part of a relatively complex type hierarchy. When you catch
    an exception, you should always catch the most specific exception type. If you
    catch a more general type, you risk swallowing errors that you shouldn’t.


    The code above parses a message of type String and dissects it into an id and
    a content part. The problem lies in the catch statement. Any type of Exception
    is caught here.


    Exception is the most general exception type in Java. The only thing that’s even
    more general is the super type of Exception: Throwable (this comes from the catch
    and throw metaphor). If you catch a Throwable, you’ll even catch errors in the
    virtual machine, such as OutOfMemoryError. Don’t do this!


    Many beginners find it tempting to catch a very general type. After all, you consume
    practically any type of error with a single statement.


    But this is only good on the surface. It means that you catch exception types
    that you don’t want to handle here, such as a NullPointerException. In most cases,
    this exception indicates a bug in your code that you need to fix. When it occurs,
    you want the program to crash so that you become aware of the problem.


    Just because you hide a bug by catching an exception doesn’t mean it’s fixed.
    It will just bring down your program at a more inconvenient point in time.


    So what type of exception should you catch here?


    |   | **class** TransmissionParser { |


    |   | **static** Transmission parse(String rawMessage) { |


    |   | **if** (rawMessage != **null** && |


    |   | rawMessage.length() != Transmission.MESSAGE_LENGTH) { |


    |   | **throw** **new** IllegalArgumentException(*"Bad message received!"*); |


    |   | } |


    |   |  |


    |   | String rawId = rawMessage.substring(0, Transmission.ID_LENGTH); |


    |   | String rawContent = rawMessage.substring(Transmission.ID_LENGTH); |


    |   | **try** { |


    |   | **int** id = Integer.parseInt(rawId); |


    |   | String content = rawContent.trim(); |


    |   | **return** **new** Transmission(id, content); |


    | » | } **catch** (NumberFormatException e) { |


    |   | **throw** **new** IllegalArgumentException(*"Bad message received!"*); |


    |   | } |


    |   | } |


    |   | } |


    The fix to this problem is very simple. You just need to catch the most specific
    exception that might be thrown by the code in the try instead of Exception.^([[34]](#f_0062.xhtml_FOOTNOTE-34))'
