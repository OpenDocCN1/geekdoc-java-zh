    \       if (supply.isContaminated()) {\n                contaminatedCounter++;\
    \ // increment counter!\n            } // End IF supply is contaminated\n    \
    \    } // End FOR\n\n        // Returns the number of contaminated supplies.\n\
    \        return contaminatedCounter; // Handle with care!\n    }\n} // End of\
    \ Inventory class\n```\n\nYou’ve probably heard that comments are very important.\
