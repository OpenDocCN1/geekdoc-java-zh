  trans: "\n看看我们如何改进代码：\n\n```java\nclass Logbook {\n    static final Path CAPTAIN_LOG\
    \ = Paths.get(\"/var/log/captain.log\");\n    static final Path CREW_LOG = Paths.get(\"\
    /var/log/crew.log\");\n\n    void writeToCaptainLog(String message) throws IOException\
    \ {\n        writeMessage(message, CAPTAIN_LOG);\n    }\n\n    void writeToCrewLog(String\
    \ message) throws IOException {\n        writeMessage(message, CREW_LOG);\n  \
    \  }\n\n    void writeMessage(String message, Path location) throws IOException\
    \ {\n        String entry = LocalDate.now() + \" \" + message;\n        Files.write(location,\
    \ Collections.singleton(entry),\n            StandardCharsets.UTF_8, StandardOpenOption.APPEND);\n\
    \    }\n}\n```\n\n每当你看到使用布尔输入参数的方法时，很可能你可以通过将其拆分为多个方法来改进代码。\n\n这样做时，你需要移除布尔方法参数，并为该参数所区分的每种控制流路径添加新方法。你甚至可以给新方法赋予富有表现力且意义明确的名字，从而增强代码的可读性！\n\
    \n这正是我们在上面的代码中所做的：我们添加了两个新方法 `writeToCaptianLog()` 和 `writeToCrewLog()`。现在考虑一下新的用法：\n\
    \n```java\nlogbook.writeToCaptainLog(\"Aliens sighted!\");\nlogbook.writeToCrewLog(\"\
    Toilet broken. Again...\");\n```\n\n如你所见，这比之前的版本易读得多。方法名清楚地表明消息属于哪条日志，你可以从调用代码看出该方法的意图实现什么。\n\
    \n记住：良好的设计是困难的\n\n几乎没有人能第一次就做对。归结底，这是一个好消息，因为当你掌握了面向对象的设计时，你的技能将非常受欢迎。但请注意，区分好设计和坏设计比发现一行写烂的代码要困难。良好的设计并不那么一而易见，它需要你对其有直觉和“感觉”。获得这种直觉的唯一真实方法就是大量的编码，尝试不同的设计，并观察哪些是失败的，哪些恰恰合适。\n\
    \n## 带可选参数的拆分方法\n\n```java\nclass Logbook {\n    static final Path CREW_LOG =\
    \ Paths.get(\"/var/log/crew.log\");\n\n    List<String> readEntries(LocalDate\
    \ date) throws IOException {\n        final List<String> entries = Files.readAllLines(CREW_LOG,\n\
    \            StandardCharsets.UTF_8);\n        if (date == null) {\n         \
    \   return entries;\n        }\n\n        List<String> result = new LinkedList<>();\n\
    \        for (String entry : entries) {\n            if (entry.startsWith(date.toString()))\
    \ {\n                result.add(entry);\n            }\n        }\n        return\
    \ result;\n    }\n}\n```\n\n正如你在*带布尔参数的拆分方法*中看到的，布尔值并不是方法承担过多的唯一指标。可选参数具有相同的问题，但它们更难发现。\n\
    \n这次，我们查看如何通过 `readEntries()` 方法从日志中读取数据。日志项包含日期，我们可以根据输入参数 `date` 选择标记的项。如果你插入\
    \ `null` 而不是具体的日期值，`readEntries()` 将返回所有日志项。考虑以下用法：\n\n```java\nList<String> completeLog\
    \ = logbook.readEntries(null);\n\nfinal LocalDate moonLanding = LocalDate.of(1969,\
    \ Month.JULY, 20);\nList<String> moonLandingLog = logbook.readEntries(moonLanding);\n\
    ```\n\n这里 `null` 的语义本质上意味着 `date` 参数是可选的。这实际上是布尔方法参数的不同版本。\n\n和之前一样，带可选参数的方法是一个执行了多一件事的方法。更糟糕的是，很难看出带有\
    \ `null` 参数的方法调用期望得到什么。\n\n以下是我们可以如何重构它：\n\n```java\nclass Logbook {\n    static\
    \ final Path CREW_LOG = Paths.get(\"/var/log/crew.log\");\n\n    List<String>\
    \ readEntries(LocalDate date) throws IOException {\n        Objects.requireNonNull(date);\n\
    \n        List<String> result = new LinkedList<>();\n        for (String entry\
    \ : readAllEntries()) {\n            if (entry.startsWith(date.toString())) {\n\
    \                result.add(entry);\n            }\n        }\n        return\
    \ result;\n    }\n\n    List<String> readAllEntries() throws IOException {\n \
    \       return Files.readAllLines(CREW_LOG, StandardCharsets.UTF_8);\n    }\n\
    }\n```\n\n这里的解决方案本质上与*带布尔参数的拆分方法*中相同：我们将方法拆分为两个方法。每个方法都捕获了一个控制流分支。在上面的代码中，`readEntries()`\
    \ 不再允许可选参数。这使得使用变得更加容易。现在的用法看起来如下：\n\n```java\nList<String> completeLog = logbook.readAllEntries();\n\
    \nfinal LocalDate moonLanding = LocalDate.of(1969, Month.JULY, 20);\nList<String>\
    \ moonLandingLog = logbook.readEntries(moonLanding);\n```\n\n如你所见，这更容易理解得多，因为方法名清楚地传达了将读取所有项的信息。除了消灭\
    \ `null`，我们现在还避免了 `null` 值。\n\n## 优先使用抽象而非具体类型\n\n```java\nclass Inventory {\n\
    \    List<Supply> supplies = new LinkedList<>();\n\n    void stockUp(ArrayList<Supply>\
    \ delivery) {\n        supplies.addAll(delivery);\n    }\n\n    LinkedList<Supply>\
    \ getContaminatedlies() {\n        LinkedList<Supply> contaminatedSupplies = new\
    \ LinkedList<>();\n        for (Supply supply : supplies) {\n            if (supply.isContaminated())\
    \ {\n                contaminatedSupplies.add(supply);\n            }\n      \
    \  }\n        return contaminatedSupplies;\n    }\n}\n```\n\n接口和类通常形成巨大的层次结构——只需查看\
    \ Java API。如果你对变量使用更抽象的类型，你的代码将更加灵活。\n\n上面，你可以看到库存系统的一部分。`getContaminatedlies()`\
    \ 方法遍历 `Supply` 对象列表，你可以通过 `stockUp()` 方法填充它。你可以这样使用该类：\n\n```java\nStack<Supply>\
    \ delivery = cargoShip.unload();\nArrayList<Supply> loadableDelivery = new ArrayList<>(delivery);\n\
    inventory.stockUp(loadableDelivery);\n```\n\n在示例中，数据在不同数据结构之间转换，大部分实际上是不必要的。此外，`Inventory`\
    \ 的变化很容易传播到其他地方。\n\n我们可以通过使用更抽象的类型来消除这些问题。\n\n```java\nclass Inventory {\n   \
    \ List<Supply> supplies = new LinkedList();\n}\n```\n"
- fmt: "\n```java\nvoid stockUp(Collection<Supply> delivery) {\n    supplies.addAll(delivery);\n\
    }\n\nList<Supply> getContaminatedSupplies() {\n    List<Supply> contaminatedSupplies\
    \ = new LinkedList<>();\n    for (Supply supply : supplies) {\n        if (supply.isContaminated())\
    \ {\n            contaminatedSupplies.add(supply);\n        }\n    }\n    return\
    \ contaminatedSupplies;\n}\n```\n\nThe solution above differs in three ways.\n\
    \nFirst, the `supplies` field uses the interface type `List` instead of `LinkedList`.\
    \ This tells us that the `supplies` are stored in an order but not how they’re\
    \ stored (in an array for the `ArrayList` or through linked wrapper objects for\
    \ the `LinkedList`).\n\nSecond, the method `stockUp()` accepts any `Collection`\
    \ now. This is `Java`’s most general interface for storing objects in a data structure.\
    \ It means that you can pass any subtype of `Collection`, any complex data structure\
    \ in Java, into the method.\n\nThird, the method `getContaminatedSupplies()` returns\
    \ a `List` instead of a more specific type. We guarantee only that the `supplies`\
    \ are ordered, but not how the list is implemented internally. This makes the\
    \ code more flexible.\n\n```java\nStack<Supply> delivery = cargoShip.unload();\n\
    inventory.stockUp(delivery);\n```\n\nNow, the `Inventory` accepts the `Stack`\
    \ directly without any conversion, because a `Stack` is a `Collection`. The `Inventory`\
    \ could now handle loading from `Sets`, `Lists`, or if need be, even from `Vectors`\
    \ and other special-purpose data structures.\n\n## Favor Immutable Over Mutable\
    \ State\n\n```java\nclass Distance {\n    DistanceUnit unit;\n    double value;\n\
    \n    Distance(DistanceUnit unit, double value) {\n        this.unit = unit;\n\
    \        this.value = value;\n    }\n\n    static Distance km(double value) {\n\
    \        return new Distance(DistanceUnit.KILOMETERS, value);\n    }\n\n    void\
    \ add(Distance distance) {\n        distance.convertTo(unit);\n        value +=\
    \ distance.value;\n    }\n\n    void convertTo(DistanceUnit otherUnit) {\n   \
    \     double conversionRate = unit.getConversionRate(otherUnit);\n        unit\
    \ = otherUnit;\n        value = conversionRate * value;\n    }\n}\n```\n\nBy default,\
    \ the state of objects is mutable. Whenever possible, you should make the state\
    \ immutable because this makes objects harder to misuse.\n\nThe code here computes\
    \ and converts distances for route planning. There’s no immediate bug in the code,\
    \ but the problem is that the `Distance` class doesn’t defend itself from misuse.\
    \ Consider the following code:\n\n```java\nDistance toMars = new Distance(DistanceUnit.KILOMETERS,\
    \ 56_000_000);\nDistance marsToVenus = new Distance(DistanceUnit.LIGHTYEARS, 0.000012656528);\n\
    Distance toVenusViaMars = toMars;\ntoVenusViaMars.add(marsToVenus);\n```\n\nWe\
    \ first create the distances from Earth to Mars in the variable `toMars` and from\
    \ Mars to Venus in the variable `marsToVenus`. Then we compute the distance from\
    \ Earth to Venus with a stopover at Mars in the variable `toVenusViaMars`.\n\n\
    The problem is that `toVenus` and `toMars` point to the same object. When we call\
    \ `toVenusViaMars.add(marsToVenus)`, we’re changing the value of `toMars` indirectly.\
    \ If we reuse `toMars` later, we’re going to get a false distance value—especially\
    \ if we pass the `toMars` instance around in a larger application where any code\
    \ could alter it.\n\nLet’s have the compiler make sure that this can’t happen.\n\
    \n```java\nfinal class Distance {\n    final DistanceUnit unit;\n    final double\
    \ value;\n\n    Distance(DistanceUnit unit, double value) {\n        this.unit\
    \ = unit;\n        this.value = value;\n    }\n\n    Distance add(Distance distance)\
    \ {\n        return new Distance(unit, value + distance.convertTo(unit).value);\n\
    \    }\n\n    Distance convertTo(DistanceUnit otherUnit) {\n        double conversionRate\
    \ = unit.getConversionRate(otherUnit);\n        return new Distance(otherUnit,\
    \ conversionRate * value);\n    }\n}\n```\n\nObjects should defend themselves\
    \ from invalid changes, and you can achieve this by limiting their mutability.\n\
    \nNote the usage of the `final` keyword in the code above. Now you need to set\
    \ the `value` and `unit` fields in the constructor, and you can’t change them\
    \ afterward. If you compute a distance, you need a new instance every time:\n\n\
    ```java\nDistance toMars = new Distance(DistanceUnit.KILOMETERS, 56_000_000);\n\
    Distance marsToVenus = new Distance(DistanceUnit.LIGHTYEARS, 0.000012656528);\n\
    Distance toVenusViaMars = toMars.add(marsToVenus).convertTo(DistanceUnit.MILES);\n\
    ```\n\nAs you can see, we can no longer make the mistake we made before. The immutable\
    \ state of a `Distance` prevents us from doing so. The downside of this solution\
    \ is that we create more objects, but in `Java` small objects are cheap.\n\nIn\
    \ software design, this solution is the way to go for so-called value objects:\
    \ percentages, money, currency, times, dates, coordinates and, of course, distances.\
    \ These objects are indistinguishable if their values are equal: $10 is $10, even\
    \ if there’s a different object representing each of those dollars. So watch out\
    \ for value objects and make them immutable!\n\nOne more note on the `final` keyword\
    \ before the class definition: this is required to ensure that this class can’t\
    \ be extended anymore. Doing so would potentially allow us to add mutable state\
    \ again.\n\n## Combine State and Behavior\n\n```java\nclass Hull {\n    int holes;\n\
    }\n\nclass HullRepairUnit {\n    void repairHole(Hull hull) {\n        if (isIntact(hull))\
    \ {\n            return;\n        }\n        hull.holes--;\n    }\n\n    boolean\
    \ isIntact(Hull hull) {\n        return hull.holes == 0;\n    }\n}\n```\n\nThe\
    \ combination of state and behavior is one of the cornerstones of object-oriented\
    \ programming. Classes containing only behavior but lacking state indicate OO-design\
    \ problems.\n\nIn the code snippet here, the `Hull` class captures state and tracks\
    \ the amount of its holes. The `HullRepairUnit` can fix those holes, and it captures\
    \ behavior.\n\nThe code above separates state and behavior into two distinct classes.\
    \ This separation is something you’ll find quite often in a beginner’s code. Generic\
    \ examples are a `User` and a `UserController`, or an `Order` and an `OrderManager`.\n\
    \nThe problem is that this separation prohibits information hiding, and it makes\
    \ the code more verbose. The `Hull` class has to provide read and (much worse)\
    \ write access of its state to the `HullRepairUnit`. It isn’t easy to prevent\
    \ other objects from accessing and modifying the number of holes this way. On\
    \ top of that, there’s also no validation for the `hull` parameter.\n\nA separation\
    \ of state and behavior is sometimes hard to detect. As a rule of thumb, you can\
    \ look out for classes that are simply too large or that operate only on their\
    \ parameters. Try to simplify such classes by grouping variables and methods that\
    \ perform similar tasks into one class each. After that, make sure to do a before-and-after\
    \ comparison to see if you’ve improved the design.\n\nLet’s see how we can build\
    \ a more convincing combination of state and behavior!\n\n```java\nclass Hull\
    \ {\n    int holes;\n\n    void repairHole() {\n        if (isIntact()) {\n  \
    \          return;\n        }\n        holes--;\n    }\n\n    boolean isIntact()\
    \ {\n        return holes == 0;\n    }\n}\n```\n"
