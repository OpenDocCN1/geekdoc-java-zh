  trans: "\n\n```java\nvoid stockUp(Collection<Supply> delivery) {\n    supplies.addAll(delivery);\n\
    }\n\nList<Supply> getContaminatedSupplies() {\n    List<Supply> contaminatedSupplies\
    \ = new LinkedList<>();\n    for (Supply supply : supplies) {\n        if (supply.isContaminated())\
    \ {\n            contaminatedSupplies.add(supply);\n        }\n    }\n    return\
    \ contaminatedSupplies;\n}\n```\n\n上面的解决方案在三个方面有所不同。\n\n首先，`supplies` 字段使用了接口类型\
    \ `List` 而不是 `LinkedList`。这告诉我们 `supplies` 是按顺序存储的，但并没有说明它们是如何存储的（在 `ArrayList`\
    \ 中通过数组，或在 `LinkedList` 中通过链接对象）。\n\n其次，`stockUp()` 方法现在接受任何 `Collection`。这是 `Java`\
    \ 中用于数据结构中存储对象的最通用的接口。这意味着你可以将任何 `Collection` 的子类型或 `Java` 中的任何复杂数据结构传递给该方法。\n\
    \n第三，`getContaminatedSupplies()` 方法返回一个 `List` 而不是更具体的类型。我们只保证 `supplies` 是有序的，但并不保证列表的内部实现方式。这使得代码更具活性。\n\
    \n```java\nStack<Supply> delivery = cargoShip.unload();\ninventory.stockUp(delivery);\n\
    ```\n\n现在，`Inventory` 直接接受 `Stack` 而无需任何转换，因为 `Stack` 是一个 `Collection`。`Inventory`\
    \ 现在可以处理来自 `Sets`、`Lists`，或者如果需要，甚至可以来自 `Vectors` 以及其他特殊用途的数据结构的加载。\n\n## 优先使用不可变状态而非可变状态\n\
    \n```java\nclass Distance {\n    DistanceUnit unit;\n    double value;\n\n   \
    \ Distance(DistanceUnit unit, double value) {\n        this.unit = unit;\n   \
    \     this.value = value;\n    }\n\n    static Distance km(double value) {\n \
    \       return new Distance(DistanceUnit.KILOMETERS, value);\n    }\n\n    void\
    \ add(Distance distance) {\n        distance.convertTo(unit);\n        value +=\
    \ distance.value;\n    }\n\n    void convertTo(DistanceUnit otherUnit) {\n   \
    \     double conversionRate = unit.getConversionRate(otherUnit);\n        unit\
    \ = otherUnit;\n        value = conversionRate * value;\n    }\n}\n```\n\n默认情况下，对象的状态是可变的。只要可能，你应该让状态变为不可变，因为这会让对象更难被误用。\n\
    \n这里的代码为路线规划计算并转换距离。代码中没有明显的错误，但问题在于 `Distance` 类没有防御被误用。考虑以下代码：\n\n```java\n\
    Distance toMars = new Distance(DistanceUnit.KILOMETERS, 56_000_000);\nDistance\
    \ marsToVenus = new Distance(DistanceUnit.LIGHTYEARS, 0.000012656528);\nDistance\
    \ toVenusViaMars = toMars;\ntoVenusViaMars.add(marsToVenus);\n```\n\n我们首先在变量 `toMars`\
    \ 中创建从地球到火星的距离，在变量 `marsToVenus` 中创建从火星到金星的距离。然后我们在变量 `toVenusViaMars` 中计算从地球经火星到金星的距离。\n\
    \n问题是 `toVenusViaMars` 和 `toMars` 指向同一个对象。当我们调用 `toVenusViaMars.add(marsToVenus)`\
    \ 时，我们间接地改变了 `toMars` 的值。如果稍后重用 `toMars`，我们将得到一个错误的距离值——特别是当我们在较大的应用程序中传递 `toMars`\
    \ 实例时，任何代码都可能修改它。\n\n让编译器来确保这种情况不会发生。\n\n```java\nfinal class Distance {\n   \
    \ final DistanceUnit unit;\n    final double value;\n\n    Distance(DistanceUnit\
    \ unit, double value) {\n        this.unit = unit;\n        this.value = value;\n\
    \    }\n\n    Distance add(Distance distance) {\n        return new Distance(unit,\
    \ value + distance.convertTo(unit).value);\n    }\n\n    Distance convertTo(DistanceUnit\
    \ otherUnit) {\n        double conversionRate = unit.getConversionRate(otherUnit);\n\
    \        return new Distance(otherUnit, conversionRate * value);\n    }\n}\n```\n\
    \n对象应该防御无效的更改，你可以通过限制它们的可变性来实现这一点。\n\n注意上述代码中 `final` 关键字的使用。现在你需要在构造函数中设置 `value`\
    \ 和 `unit` 字段，并且之后无法更改它们。如果你计算一个距离，每次都需要创建一个新实例：\n\n```java\nDistance toMars =\
    \ new Distance(DistanceUnit.KILOMETERS, 56_000_000);\nDistance marsToVenus = new\
    \ Distance(DistanceUnit.LIGHTYEARS, 0.000012656528);\nDistance toVenusViaMars\
    \ = toMars.add(marsToVenus).convertTo(DistanceUnit.MILES);\n```\n\n如你所见，我们无法再犯之前的那个错误了。`Distance`\
    \ 的不可变状态阻止了这种行为。这种解决方案的缺点是我们创建了更多对象，但在 `Java` 中小对象是廉价的。\n\n在软件设计中，这种解决方案是所谓的“值对象”的趋势：百分比、金额、货币、时间、日期、坐标，当然还有距离。如果值相等，它们是无法区分的：10\
    \ 美元就是 10 美元，即使有不同的对象来代表每一个美元。所以，要留意值对象并让它们变为不可变！\n\n关于类定义之前的 `final` 关键字另另一点：这是为了确保该类不再被扩展。这样做可能会允许我们再次添加可变状态。\n\
    \n## 结合状态与行为\n\n```java\nclass Hull {\n    int holes;\n}\n\nclass HullRepairUnit\
    \ {\n    void repairHole(Hull hull) {\n        if (isIntact(hull)) {\n       \
    \     return;\n        }\n        hull.holes--;\n    }\n\n    boolean isIntact(Hull\
    \ hull) {\n        return hull.holes == 0;\n    }\n}\n```\n\n状态与行为的结合是面向对象编程的基石之一。包含行为但缺乏状态的类表明存在面向对象的设计问题。\n\
    \n在此代码段中，`Hull` 类捕捉状态并跟踪漏洞的数量。`HullRepairUnit` 可以修复这些漏洞，它捕捉了行为。\n\n入门代码中常见的例子是\
    \ `User` 和 `UserController`，或者 `Order` 和 `OrderManager`。\n\n问题是这种分离禁止了信息隐藏，并使得代码更加冗肿。`Hull`\
    \ 类必须向 `HullRepairUnit` 提供其状态的读取和（糟糕糟糕）写入访问。很难防止其他对象以此方式访问并修改漏洞的数量。此外，对 `hull`\
    \ 参数也没有验证。\n\n状态与行为的分离有时很难检测。根据经验，你可以留意那些过于庞大或仅对其参数进行操作的类。尝试通过将执行相似任务的变量和方法分组到一个类中来简化此类类。之后，确保进行改进后的对比，以看看你是否改进了设计。\n\
    \n让我们看看如何构建一个更有说服力的状态与行为结合！\n\n```java\nclass Hull {\n    int holes;\n\n    void\
    \ repairHole() {\n        if (isIntact()) {\n            return;\n        }\n\
    \        holes--;\n    }\n\n    boolean isIntact() {\n        return holes ==\
    \ 0;\n    }\n}\n```\n\n"
- fmt: "\nThe solution above requires substantially less code. The `HullRepairUnit`\
    \ is completely gone. Instead, the `Hull` repairs itself. This may look strange\
    \ at first, because in reality, there’s probably a robot that repairs the `Hull`.\
    \ But as long as this unit has no state and behavior in our program, there shouldn’t\
    \ be a class that represents it.\n\nThe `Hull` class can provide the functionality\
    \ itself instead. Similarly, an `Order` or `User` in a different type of system\
    \ can provide functionality on its own without a manager, controller, service,\
    \ or any other stateless class.\n\nGenerally speaking, we combined state and behavior\
    \ in this solution. In the problem, they were separated into two classes. In the\
    \ solution, they’re very close to each other, inside the same class. The classes’\
    \ methods can simply work with the internal state directly. We also reduced the\
    \ number of method parameters and made the methods easier to understand. Before,\
    \ parameters had to be validated, but that’s no longer necessary. And there’s\
    \ no longer a need to expose the `holes` attribute to the outside via getters\
    \ or setters.\n\nTo sum up, watch out for methods that only work with their input\
    \ parameters but not with the instance variables of the class they live in. Those\
    \ methods indicate a separation of state and behavior and prevent information\
    \ hiding. With too much information in the open, bugs can easily occur.\n\nSometimes,\
    \ frameworks require you to go against this rule. For example, controllers in\
    \ web frameworks are typically stateless—that is, they have no fields, only method\
    \ parameters. That’s by design to make it possible to create lots of such controllers\
    \ to handle a large amount of parallel requests—with the state residing in the\
    \ database only.\n\n## Avoid Leaking References\n\n```java\nclass Inventory {\n\
    \    private final List<Supply> supplies;\n\n    Inventory(List<Supply> supplies)\
    \ {\n        this.supplies = supplies;\n    }\n\n    List<Supply> getSupplies()\
    \ {\n        return supplies;\n    }\n}\n```\n\nPractically any nontrivial object\
    \ has some inner state that’s accessible from the outside. You need to be careful\
    \ how you make this state available. Otherwise, you risk serious bugs.\n\nThe\
    \ `Inventory` here shows a fairly common example of a class that maintains a data\
    \ structure. That data structure is initialized externally and inserted into the\
    \ constructor of the `Inventory`. Nothing’s obviously wrong with the class itself,\
    \ but let’s look at the usage:\n\n```java\nList<Supply> externalSupplies = new\
    \ ArrayList<>();\nInventory inventory = new Inventory(externalSupplies);\n\ninventory.getSupplies().size();\
    \ // == 0\nexternalSupplies.add(new Supply(\"Apple\"));\ninventory.getSupplies().size();\
    \ // == 1\ninventory.getSupplies().add(new Supply(\"Banana\"));\ninventory.getSupplies().size();\
    \ // == 2\n```\n\nFirst, we pass the empty `externalSupplies` to the new `Inventory`,\
    \ and `getSupplies()` returns an empty list. But the inventory doesn’t protect\
    \ its internal list of supplies. Instead, we can change the state of the inventory\
    \ by adding a supply to the `externalSupplies` list or by other change operations\
    \ on the list returned by `getSupplies()`. Note that the `final` keyword for the\
    \ `supplies` field doesn’t prevent this behavior! And right now, we could also\
    \ pass `null` into the constructor, which can easily trigger exceptions later.\n\
    \nThe problem is that there’s only one list in memory—the one created by `new\
    \ ArrayList<>()`. The inventory just stores a reference to that list in its `supplies`\
    \ field and returns that reference through `getSupplies()`. Essentially, the `Inventory`\
    \ leaks the reference to its inner structure to the outside through the getter.\
    \ This is bad! But there’s a way to avoid this.\n\nHow can we protect the internals\
    \ of a class from being manipulated after the instantiation?\n\n```java\nclass\
    \ Inventory {\n    private final List<Supply> supplies;\n\n    Inventory(List<Supply>\
