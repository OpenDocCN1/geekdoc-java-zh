    \                String.format(\"Expected number, but got '%s' in '%s'\",\n  \
    \              rawId, rawMessage), e);\n        }\n    }\n}\n\nfinal class MalformedException\
    \ extends IllegalArgumentException {\n    final String raw;\n\n    MalformedException(String\
    \ message, String raw) {\n        super(String.format(\"%s in '%s'\", message,\
    \ raw));\n        this.raw = raw;\n    }\n\n    MalformedException(String message,\
    \ String raw, Throwable cause) {\n        super(String.format(\"%s in '%s'\",\
    \ message, raw), cause);\n        this.raw = raw;\n    }\n\n    public String\
    \ getRaw() {\n        return raw;\n    }\n}\n```\n\n## 在转换前始终检查类型\n\n```java\n\
    class Network {\n    ObjectInputStream inputStream;\n    InterCom interCom;\n\n\
    \    void listen() throws IOException, ClassNotFoundException {\n        while\
    \ (true) {\n            Object signal = inputStream.readObject();\n          \
    \  CrewMessage crewMessage = (CrewMessage) signal;\n            interCom.broadcast(crewMessage);\n\
    \        }\n    }\n}\n```\n"
- fmt: "\nBut the party is over when the stream returns a wrong type! The method has\
    \ no control over which types are actually written into the stream. What if somebody\
    \ on the other end of the stream inserts a different message type—for example,\
    \ a `ClassifiedMessage`? Whatever the reason, you can be sure that at some point,\
    \ there will be an object that’s not a `CrewMessage`. Then the method, and probably\
    \ the complete program, will crash with a `ClassCastException`.\n\nCan you catch\
    \ this exception? You can, but you shouldn’t, as it typically indicates a bug\
    \ in the code that you can fix. So instead you should repair the code.\n\nFortunately,\
    \ all you have to do is a proper type check before the cast:\n\n```java\nclass\
    \ Network {\n    ObjectInputStream inputStream;\n    InterCom interCom;\n\n  \
    \  void listen() throws IOException, ClassNotFoundException {\n        while (true)\
    \ {\n            Object signal = inputStream.readObject();\n            if (signal\
    \ instanceof CrewMessage) {\n                CrewMessage crewMessage = (CrewMessage)\
    \ signal;\n                interCom.broadcast(crewMessage);\n            }\n \
    \       }\n    }\n}\n```\n\nThe code above first stores the result of reading\
    \ from the stream in a local variable called `signal`. The variable’s type is\
    \ `Object`, so this line can’t fail because of typing. After all, every non-primitive\
    \ Java type inherits from `Object`.\n\nNext, we make sure that we can read the\
    \ signal by performing a type check using the `instanceof` operator. This operator\
    \ returns true if `signal` can be cast to the type `CrewMessage` and false otherwise.\
    \ We’re allowed to do the explicit cast only if the check was positive. It gives\
    \ us certainty that a `ClassCastException` won’t happen here. We’re safe!\n\n\
    This requires additional lines of code, but there’s no other way to avoid a `ClassCastException`\
    \ in Java. When you expect a set of different types—different types of messages\
    \ in our example—you’ll have to do a sequence of checks with `instanceof`.\n\n\
    There’s another exception type in the method signature that you shouldn’t confuse\
    \ with the `ClassCastException`. An `ObjectInputStream` triggers a `ClassNotFoundException`\
    \ exception when it tries to read an object whose type isn’t in your program’s\
    \ classpath. You can’t avoid that with a type check, obviously. Usually, this\
    \ exception means that there’s something wrong in your execution setup, but it\
    \ shouldn’t necessarily stem from a bug in your code. In production, you should\
    \ also catch and log it. During development, it’s better to let the program crash\
    \ and update the environment before continuing.\n\nSo keep in mind that whenever\
    \ your program interacts with the outside (for example, using a stream), you need\
    \ to make sure that it can handle unexpected input.\n\n## Always Close Resources\n\
    \n```java\nclass Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"/var/log\"\
    );\n    static final String FILE_FILTER = \"*.log\";\n\n    List<Path> getLogs()\
    \ throws IOException {\n        List<Path> result = new ArrayList<>();\n\n   \
    \     DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n        for (Path logFile : directoryStream) {\n            result.add(logFile);\n\
    \        }\n        directoryStream.close();\n\n        return result;\n    }\n\
    }\n```\n\nPrograms need system resources, such as disk space, database or network\
    \ connections, CPU threads, and RAM. These resources are limited, and programs\
    \ have to share them among each other. If a single program acquires resources\
    \ without releasing them, it can bring down the whole environment. For a more\
    \ in-depth explanation of this problem, take a look at this article.\n\nWe the\
    \ programmers need to prevent this! The plan sounds straightforward: free resources\
    \ immediately when they’re no longer needed. But as always, the devil is in the\
    \ details (or rather in the code).\n\nTake a look at the method above. It uses\
    \ a `DirectoryStream`, which is a system resource. It frees the resource by calling\
    \ its `close()` method. Everything looks correct, doesn’t it?\n\nUnfortunately\
    \ not. When everything goes fine, the program opens the resource, uses it, and\
    \ then closes it via the `close()` method. But what if the program opens the resource\
    \ and an exception occurs while it’s using it, before it can free the resource\
    \ by calling `close()`? An exception would prevent the execution of `close()`.\
    \ Then, the resource wouldn’t be freed before the program terminates.\n\nThis\
    \ is called a “resource leak.” It can harm the program itself if it tries to acquire\
    \ the same resource again at a later time. And it’s definitely not the way to\
    \ build a long-running application.\n\nSo how can we make sure that our code always\
    \ closes its used resources?\n\n```java\nclass Logbook {\n    static final Path\
    \ LOG_FOLDER = Paths.get(\"/var/log\");\n    static final String FILE_FILTER =\
    \ \"*.log\";\n\n    List<Path> getLogs() throws IOException {\n        List<Path>\
    \ result = new ArrayList<>();\n\n        try (DirectoryStream<Path> directoryStream\
    \ = Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) {\n            for (Path\
    \ logFile : directoryStream) {\n                result.add(logFile);\n       \
    \     }\n        }\n        return result;\n    }\n}\n```\n\nSince Java 7, we\
    \ can safely and elegantly close resources with `try-with-resources`. This works\
    \ for any class that implements `AutoCloseable`, which practically resource classes\
    \ do. We need to open the resource within the brackets following `try`. Then,\
    \ the resource is available in the scope of the `try` and Java takes care of `close()`\
    \ when the block is finished, no matter what.\n\nActually, the try-with-resources\
    \ is just syntactic sugar. The compiler expands it into something like:\n\n```java\n\
    DirectoryStream<Path> resource = Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER);\n\
    try {\n    // usage of resource\n} finally {\n    if (resource != null) {\n  \
    \      resource.close();\n    }\n}\n```\n\nThat code opens the resource before\
    \ the `try` and uses the `finally` block to ensure that the resource gets closed,\
    \ but only when it’s not null to avoid a `NullPointerException` in the next line.\
    \ This is clearly not as elegant and simple as try-with-resources.\n\nYou don’t\
    \ really need the compiler here—you can implement resource closing on your own.\
    \ In fact, before Java 7, that’s exactly what you had to. But our advice is: let\
    \ your code be elegant and let the compiler do the work.\n\n## Always Close Multiple\
    \ Resources\n\n```java\nclass Logbook {\n    static final Path LOG_FOLDER = Paths.get(\"\
    /var/log\");\n    static final Path STATISTICS_CSV = LOG_FOLDER.resolve(\"stats.csv\"\
    );\n    static final String FILE_FILTER = \"*.log\";\n\n    void createStatistics()\
    \ throws IOException {\n        DirectoryStream<Path> directoryStream = Files.newDirectoryStream(LOG_FOLDER,\
    \ FILE_FILTER);\n        BufferedWriter writer = Files.newBufferedWriter(STATISTICS_CSV);\n\
    \n        try {\n            for (Path logFile : directoryStream) {\n        \
    \        final String csvLine = String.format(\"%s,%d,%s\",\n                \
    \    logFile,\n                    Files.size(logFile),\n                    Files.getLastModifiedTime(logFile));\n\
    \                writer.write(csvLine);\n                writer.newLine();\n \
    \           }\n        } finally {\n            directoryStream.close();\n   \
    \         writer.close();\n        }\n    }\n}\n```\n\nAs you’ve seen before,\
    \ properly closing resources is important to the stability of your program. If\
    \ you use many resources at the same time, closing becomes extra difficult.\n"
  raw: 'But the party is over when the stream returns a wrong type! The method has
    no control over which types are actually written into the stream. What if somebody
    on the other end of the stream inserts a different message type—for example, a
    ClassifiedMessage? Whatever the reason, you can be sure that at some point, there
    will be an object that’s not a CrewMessage. Then the method, and probably the
    complete program, will crash with a ClassCastException.


    Can you catch this exception? You can, but you shouldn’t, as it typically indicates
    a bug in the code that you can fix. So instead you should repair the code.


    Fortunately, all you have to do is a proper type check before the cast:


    |   | **class** Network { |


    |   |  |


    |   | ObjectInputStream inputStream; |


    |   | InterCom interCom; |


    |   |  |


    |   | **void** listen() **throws** IOException, ClassNotFoundException { |


    |   | **while** (**true**) { |


    |   | Object signal = inputStream.readObject(); |


    | » | **if** (signal **instanceof** CrewMessage) { |


    |   | CrewMessage crewMessage = (CrewMessage) signal; |


    |   | interCom.broadcast(crewMessage); |


    |   | } |


    |   | } |


    |   | } |


    |   | } |


    The code above first stores the result of reading from the stream in a local variable
    called signal. The variable’s type is Object, so this line can’t fail because
    of typing. After all, every non-primitive Java type inherits from Object.


    Next, we make sure that we can read the signal by performing a type check using
    the instanceof operator. This operator returns true if signal can be cast to the
    type CrewMessage and false otherwise. We’re allowed to do the explicit cast only
    if the check was positive. It gives us certainty that a ClassCastException won’t
    happen here. We’re safe!


    This requires additional lines of code, but there’s no other way to avoid a ClassCastException
    in Java. When you expect a set of different types—different types of messages
    in our example—you’ll have to do a sequence of checks with instanceof.


    There’s another exception type in the method signature that you shouldn’t confuse
    with the ClassCastException. An ObjectInputStream triggers a ClassNotFoundException
    exception when it tries to read an object whose type isn’t in your program’s classpath.
    You can’t avoid that with a type check, obviously. Usually, this exception means
    that there’s something wrong in your execution setup, but it shouldn’t necessarily
    stem from a bug in your code. In production, you should also catch and log it.
    During development, it’s better to let the program crash and update the environment
    before continuing.


    So keep in mind that whenever your program interacts with the outside (for example,
    using a stream), you need to make sure that it can handle unexpected input.


    ## Always Close Resources


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | List<Path> getLogs() **throws** IOException { |


    |   | List<Path> result = **new** ArrayList<>(); |


    |   |  |


    |   | DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER); |


    |   | **for** (Path logFile : directoryStream) { |


    |   | result.add(logFile); |


    |   | } |


    | » | directoryStream.close(); |


    |   |  |


    |   | **return** result; |


    |   | } |


    |   | } |


    Programs need system resources, such as disk space, database or network connections,
    CPU threads, and RAM. These resources are limited, and programs have to share
    them among each other. If a single program acquires resources without releasing
    them, it can bring down the whole environment. For a more in-depth explanation
    of this problem, take a look at this article.^([[35]](#f_0062.xhtml_FOOTNOTE-35))


    We the programmers need to prevent this! The plan sounds straightforward: free
    resources immediately when they’re no longer needed. But as always, the devil
    is in the details (or rather in the code).


    Take a look at the method above. It uses a DirectoryStream, which is a system
    resource. It frees the resource by calling its close() method. Everything looks
    correct, doesn’t it?


    Unfortunately not. When everything goes fine, the program opens the resource,
    uses it, and then closes it via the close() method. But what if the program opens
    the resource and an exception occurs while it’s using it, before it can free the
    resource by calling close()? An exception would prevent the execution of close().
    Then, the resource wouldn’t be freed before the program terminates.


    This is called a “resource leak.” It can harm the program itself if it tries to
    acquire the same resource again at a later time. And it’s definitely not the way
    to build a long-running application.


    So how can we make sure that our code always closes its used resources?


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | List<Path> getLogs() **throws** IOException { |


    |   | List<Path> result = **new** ArrayList<>(); |


    |   |  |


    | » | **try** (DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER)) { |


    |   | **for** (Path logFile : directoryStream) { |


    |   | result.add(logFile); |


    |   | } |


    |   | } |


    |   |  |


    |   | **return** result; |


    |   | } |


    |   | } |


    Since Java 7, we can safely and elegantly close resources with the try-with-resources
    construct. This works for any class that implements the AutoCloseable interface,
    which practically all resource classes of the Java API do. We need to open only
    the resource within the round brackets following the try. Then, the resource is
    available in the scope of the try and Java takes care of calling close() when
    the block is finished, no matter what.


    Actually, the try-with-resources is just syntactic sugar. The compiler expands
    it into something like this:


    |   | DirectoryStream<Path> resource = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER); |


    |   | **try** { |


    |   | *// usage of resource* |


    |   | } **finally** { |


    |   | **if** (resource != **null**) { |


    |   | resource.close(); |


    |   | } |


    |   | } |


    That code opens the resource before the try and uses the finally block to ensure
    that the resource gets closed for normal and erroneous execution, but only when
    it’s not null to avoid a NullPointerException in the next line. This is clearly
    not as elegant and simple as try-with-resources.


    You don’t really need the compiler here—you can implement resource closing on
    your own. In fact, before Java 7, that’s exactly what you had to do. But our advice
    is: let your code be elegant and let the compiler do the dirty work.


    ## Always Close Multiple Resources


    |   | **class** Logbook { |


    |   |  |


    |   | **static** **final** Path LOG_FOLDER = Paths.get(*"/var/log"*); |


    |   | **static** **final** Path STATISTICS_CSV = LOG_FOLDER.resolve(*"stats.csv"*);
    |


    |   | **static** **final** String FILE_FILTER = *"*.log"*; |


    |   |  |


    |   | **void** createStatistics() **throws** IOException { |


    |   | DirectoryStream<Path> directoryStream = |


    |   | Files.newDirectoryStream(LOG_FOLDER, FILE_FILTER); |


    | » | BufferedWriter writer = |


    |   | Files.newBufferedWriter(STATISTICS_CSV); |


    |   |  |


    |   | **try** { |


    |   | **for** (Path logFile : directoryStream) { |


    |   | **final** String csvLine = String.format(*"%s,%d,%s"*, |


    |   | logFile, |


    |   | Files.size(logFile), |


    |   | Files.getLastModifiedTime(logFile)); |


    |   | writer.write(csvLine); |


    |   | writer.newLine(); |


    |   | } |


    |   | } **finally** { |


    | » | directoryStream.close(); |


    |   | writer.close(); |


    |   | } |


    |   | } |


    |   | } |


    As you’ve seen before, properly closing resources is important to the stability
    of your program. If you use many resources at the same time, closing becomes extra
    difficult.'
