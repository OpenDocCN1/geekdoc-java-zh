    |   | *"OxygenTank"* |


    | » | *//"Supplies"* |


    |   | ); |


    |   |  |


    |   | Status prepareLaunch(Commander commander) { |


    |   | **for** (String check : checks) { |


    |   | **boolean** shouldAbortTakeoff = commander.isFailing(check); |


    |   | **if** (shouldAbortTakeoff) { |


    | » | *//System.out.println("REASON FOR ABORT: " + item);* |


    |   | **return** Status.ABORT_TAKE_OFF; |


    |   | } |


    |   | } |


    |   | **return** Status.READY_FOR_TAKE_OFF; |


    |   | } |


    |   | } |


    In any bigger code base, you’re guaranteed to find sections of commented-out code.
    These types of comments are just clutter.


    In this example, you see the LaunchChecklist we’ve visited in [*Favor For-Each
    Over For Loops*](#f_0025.xhtml_sec.favor_foreach_over_for). Several list items
    are commented out. Even the comments attached to these items are commented. That’s
    a little too much for our taste.


    Apart from the list items, the method prepareLaunch() includes a commented-out
    print statement. If you look closely, you’ll notice that the print statement accesses
    the undeclared variable item—preventing you from simply uncommenting it.


    Commented-out code is a huge problem. Unlike normal comments, they aren’t meant
    to clarify anything. Instead, they add clutter to the code that can only increase
    confusion.


    Programmers usually comment out code because it prevents them from getting a feature
    to work. They’re focused on other aspects, and commenting gives them an easy way
    out. Some are also afraid of losing code they might need again in the future and
    prefer to comment it instead.


    You might not be surprised by the solution:


    |   | **class** LaunchChecklist { |


    |   |  |


    |   | List<String> checks = Arrays.asList( |


    |   | *"Cabin Leak"*, |


    |   | *"Engine"*, |


    |   | *"Hull"*, |


    |   | *"OxygenTank"* |


    |   | ); |


    |   |  |


    |   | Status prepareLaunch(Commander commander) { |


    |   | **for** (String check : checks) { |


    |   | **boolean** shouldAbortTakeoff = commander.isFailing(check); |


    |   | **if** (shouldAbortTakeoff) { |


    |   | **return** Status.ABORT_TAKE_OFF; |


    |   | } |


    |   | } |


    |   | **return** Status.READY_FOR_TAKE_OFF; |


    |   | } |


    |   | } |


    Fortunately, commented-out code is very easy to deal with: just remove it.


    Commented-out code always decreases the understandability. It doesn’t add any
    new information. It just adds lines of text—lines that are never executed. Some
    programmers are also afraid of changing classes that contain commented-out code
    because they don’t know if their changes break the relation between the actual
    code and the comments.'
