    \nCopyright © 2018, The Pragmatic Bookshelf.\n\n好代码是简洁、简单且对称的——挑战在于如何实现这一点。\n\n\
    Sean Parent\n\n# 第 2 章\n\n## 提升你的代码风格\n\n在角色扮演游戏中，无论是数字游戏还是桌面游戏，你通常都扮演一个拥有一套独特技能的角色。随着游戏的进行，你的角色在游戏世界中移动，与居民互动，并通过任务收集经验。最终，你的角色将获得新技能，并将技能“升级”到新的精通阶段，变得更快、更强、更聪明，或者无论你练习的是什么。\n\
    \n编程与玩游戏相似，而且同样令人上瘾。这是现实生活，所以你不是控制一个角色——你就在游戏中。你穿梭于数字世界并收集经验。你发现了具有非常不同语言范式的编程语言遥远领域。你遇到了对风格最复杂方面有不同观点的程序员同行们，例如是否要将大括号另起一行。你通过编程来练习技能，学习你之前未察觉的新框架或语言概念，并深化对已熟悉知识的理解。最终，你在编程能力上达到了新的水平。\n\
    \n本章是对上一章中讨论的更基础条目的升级。我们将介绍 Java 语言的一些更高级的概念，以及代码风格的方面。\n\n你将学习如何处理“魔法数字”——要么用常量替换它们，要么更好，用枚举（enums）——你将看到为什么使用换行对代码分组是有意义的。此外，我们将向你展示为什么应该尽可能依赖\
    \ Java API，并回顾在这样做时你应该避免的几个典型陷阱。你将看到如何最好地遍历数据结构，而不会触发意外的异常或引起性能问题。最后，我们将为你提供一种在代码中格式化字符串的方便方法。所以，让我们进入下一个水平吧！\n\
    \n## 用常量替换魔法数字\n\n```java\nclass CruiseControl {\n    private double targetSpeedKmh;\n\
    \n    void setPreset(int speedPreset) {\n        if (speedPreset == 2) {\n   \
    \         setTargetSpeedKmh(16944);\n        } else if (speedPreset == 1) {\n\
    \            setTargetSpeedKmh(7667);\n        } else if (speedPreset == 0) {\n\
    \            setTargetSpeedKmh(0);\n        }\n    }\n\n    void setTargetSpeedKmh(double\
    \ speed) {\n        targetSpeedKmh = speed;\n    }\n}\n```\n\n通常，当程序员需要在代码中表示一组选项时，他们会使用一组数字。在没有额外上下文的情况下，我们称这些为“魔法数字”：没有意义数字。它们让代码难以理解且容易出错。\n\
    \n这段代码片段描述了巡航控制。它很容易出错，因为你必须知道预设的内部细节。否则，你需要背记于心。它也很容易误用。\n\n让我们看看如何改进代码并消除魔法数字。\n\
    \n```java\nclass CruiseControl {\n    static final int STOP_PRESET = 0;\n    static\
    \ final int PLANETARY_SPEED_PRESET = 1;\n    static final int CRUISE_SPEED_PRESET\
    \ = 2;\n\n    static final double STOP_SPEED_KMH = 0;\n    static final double\
    \ PLANETARY_SPEED_KMH = 7667;\n    static final double CRUISE_SPEED_KMH = 16944;\n\
    \n    private double targetSpeedKmh;\n\n    void setPreset(int speedPreset) {\n\
    \        if (speedPreset == CRUISE_SPEED_PRESET) {\n            setTargetSpeedKmh(CRUISE_SPEED_KMH);\n\
    \        } else if (speedPreset == PLANETARY_SPEED_PRESET) {\n            setTargetSpeedKmh(PLANETARY_SPEED_KMH);\n\
    \        } else if (speedPreset == STOP_PRESET) {\n            setTargetSpeedKmh(STOP_SPEED_KMH);\n\
    \        }\n    }\n\n    void setTargetSpeedKmh(double speed) {\n        targetSpeedKmh\
    \ = speed;\n    }\n}\n```\n\n这一次，我们消除了魔法。我们通过为每个数字分配一个有意义且可访问的名字来实现。\n\n在这段代码中，我们为所有预设和目标速度添加了变量。这些变量是\
