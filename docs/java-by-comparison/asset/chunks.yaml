    # Early praise for Java by Comparison


    This is the book I’ve been waiting for since starting with intermediate Java programming
    courses. Without dwelling for too long on the basics, `Java by Comparison` leads
    you step by step to new insights on good coding practice. Instructive examples
    compare the do’s and dont’s and make it easy for beginners to get the key points.
    Here, the book shines and shows it’s based on long-term classroom experience.
    Luckily, the book can be read as a textbook but is also useful as a reference.
    I’m looking forward to using it in my classrooms. Are you sure your style is perfect?
    Get it!


    | → | Dr. Guido Wirtz |


    | | Professor for CS/Head of Distributed Systems Group, University of Bamberg
    |


    I wish `Java by Comparison` had been there when I was getting started with programming,
    It’s like a mentor, looking over your shoulder, and patiently helping you get
    your programming skills up to the next level.


    | → | Achim Weimert |


    | | CTO, wOndary LTD |


    `Java by Comparison` is a wonderful read for all those who want to level up their
    Java skills. It contains the essence of `Effective Java` and `Clean Code`, updated
    with `JUnit 5` and `Java 8`.


    | → | Johannes Schwalb |


    | | Java Architect, uniVersa Versicherungen |


    The definitive guide for students to bridge the gap between the novice and the
    intermediate level.


    | → | Dr. Oliver Kopp |

    | | Postdoc, University of Stuttgart |


    `Java by Comparison` is a well-crafted quick read with good, succinct examples
    updated with the latest Java 8 styling. Highly recommended for Java developers
    a few years into their career.


    | → | Ashish Bhatia |


    | | Software Engineer |


    I think `Java by Comparison` hits a sweet spot between providing useful content
    and not trying to be too much. It is an easier and more directly applicable read
    for junior developers than `Effective Java` (the best Java book). Experienced
    developers will be seen nodding in agreement and likely learn a couple things
    along the ride. This will be required reading for developers.


    | → | Sebastian Larsson |


    | | Competence Team Lead, Cybercom Sweden |


    To become a software craftsman, you need to practice, practice, practice. `Java
    by Comparison` can accompany you during those practices. With the comparison approach,
    bad code to better code, it can serve as a reference during your practice hours.


    | → | Zulfikar Dharmawan |


    | | Software Engineer |


    `Java by Comparison` presents a number of examples on how to improve your coding
    skills and serves as a shortcut for beginners or intermediate programmers to become
    experienced programmers. The book in a sense provides a lower-level version of
    design patterns focusing on code structure rather than on higher-level constructs.


    | → | Dr. Martin Blom |


    | | Associate Professor, Karlstad University |


    `Java by Comparison` is a great read if you are looking to take your Java knowledge
    up another notch. I wish I could have read this book or something similar when
    I first started with Java; it explains a lot of topics easily that I had to learn
    the way. It is a must-read if you want to go from a good programmer to a great
    one.


    | → | Ramaninder Singh Jhajj |


    | | Big Data Engineer, Betsson Group |


    Well organized and full of examples, `Java by Comparison` can help you whether
    you are a student or a developer with years of experience.


    | → | Emanuele Origgi |


    | | Android Software Engineer, Funambol Inc. |


    With any language, once you’ve mastered its syntax, the next step is to learn
    how to use it idiomatically. Whether you’re a beginner who has just started with
    Java or a seasoned Java developer who started out using one of its many earlier
    versions, I consider `Java by Comparison` a great step to become proficient in
    using Java well.


    | → | Stefan Tilkov |


    | | CEO, INNOQ |


