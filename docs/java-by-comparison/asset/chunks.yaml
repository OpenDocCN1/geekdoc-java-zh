    Object-oriented programming makes code understandable by encapsulating moving
    parts. Functional programming makes code understandable by minimizing moving parts.


    Michael Feathers


    # Chapter 8


    Let Your Data Flow


    In the first half of the sixteenth century, the astronomer Nicolaus Copernicus
    published his ideas on heliocentrism—the astronomical model in which the Earth
    revolves around the sun and not the other way around. At the time, this was a
    fundamental revolution of thought and the way that we humans view the universe
    and our place in it.


    The release of Java 8 was a similar revolution to the Java world. Since then,
    it’s become possible to use the functional programming paradigm with lambda expressions
    and streams in regular Java programs out of the box. Before that, you could only
    use functional programming on the JVM with different languages like Scala. Now
    you can combine all major programming styles easily in Java.


    Unlike with the astronomic models, there’s no right or wrong here. No single programming
    style describes a fundamental truth. No style is always better than the others
    in all application scenarios. Each has its pros and cons, and it’s up to the developer
    to find out which suits a particular situation best.


    This chapter introduces you to the core concepts of functional programming in
    Java. We’ll go over a number of comparisons that show you when the functional
    style really tops the imperative one. You’ll learn about elegant replacements
    for anonymous classes, more efficient ways to iterate over data structures, and
    how to make your program less fragile with Optionals.


    But functional programming isn’t trivial, and there are a number of pitfalls.
    That’s why we’ll explain why you should be very careful with side effects and
    how you can cope with exceptions in functional programming. You’ll see why you
    shouldn’t overuse Optionals, despite their benefits, and how you can switch from
    the functional style back to the imperative one with the least amount of friction.
    Let’s go!


    ## Favor Lambdas Over Anonymous Classes


    |   | **class** Calculator { |


    |   |  |


    |   | Map<Double, Double> values = **new** HashMap<>(); |


    |   |  |


    |   | Double square(Double x) { |


    |   | Function<Double, Double> squareFunction = |


    | » | **new** Function<Double, Double>() { |


    |   | @Override |


    |   | **public** Double apply(Double value) { |


    |   | **return** value * value; |


    |   | } |


    |   | }; |


    |   | **return** values.computeIfAbsent(x, squareFunction); |


    |   | } |


    |   | } |


    In Java 8, several existing classes (such as Map) got a boost with more useful
    methods. In the code above, you can see one of them named computeIfAbsent(). This
    method gets a value from the map using its key, and if the key isn’t already present
    in the map, it computes the value first. Pretty neat. We’ve written similar code
    many times by hand before.


    But to use that new method, you need to provide the logic,how the map should compute
    the value for an absent key, as an input parameter. Otherwise, it can’t do its
    job.


    Type-wise, computeIfAbsent() requires an instance of a class that implements the
    interface Function<Double, Double> with its method Double apply(Double value)
    here. The Double types come from the types inside the values map, and you’ll have
    different types for a different map.


    In the code above, the programmer instantiated an anonymous class to implement
    that interface. It’s called anonymous because there’s no class name and the class
    has only a single instance.'
