    \ and prefer to comment it instead.\n\nYou might not be surprised by the solution:\n\
    \n```java\nclass LaunchChecklist {\n    List<String> checks = Arrays.asList(\n\
    \        \"Cabin Leak\",\n        \"Engine\",\n        \"Hull\",\n        \"OxygenTank\"\
