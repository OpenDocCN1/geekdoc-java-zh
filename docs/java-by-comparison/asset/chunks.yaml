    \ computer can understand. Good programmers write code that humans understand.\n\
    Martin Fowler\n\n# Chapter 1\n\n## Start Up\n\nHave you ever looked back at a\
    \ piece of code you wrote months ago and wondered what you were thinking? Could\
    \ any of your colleagues understand it within a reasonable amount of time? Writing\
    \ readable code is an essential skill for a programmer. In fact, it’s one of your\
    \ most important skills—it says everything people need to know about your skills,\
    \ and it reveals whether you’re a novice or an expert.\n\nThe truth is in the\
    \ code. Forget the developer’s intentions and the promises in the documentation.\
    \ All a computer can do what’s instructed in code. The compiler takes the Java\
    \ code and produces byte code—a machine representation based on a variety of strictly\
    \ enforced rules. If the code obeys those rules, it compiles. If not, your screen\
    \ fills with error messages.\n\nCompilers can process any valid piece of Java\
    \ code, but you can’t say the same for humans. Writing code that’s easy for humans\
    \ to read and understand is much harder than writing code that compiles. So that’s\
    \ what we’re starting with in this chapter: writing expert code that’s easy to\
    \ understand. We’ll show you some tricks that make your code more readable, such\
    \ as why you should avoid unnecessary comparisons and negations and how to simplify\
    \ Boolean expressions.\n\nConveniently, code that’s easy to understand also contains\
    \ fewer bugs. By the time you finish this chapter, you’ll be able to write better\
    \ code that contains fewer bugs. You’ll stay clear of NullPointerExceptions in\
    \ conditional expressions and you’ll be aware of some infamous bug types, such\
    \ as the switch fallthrough or the GOTO FAIL bug. You’ll also learn about general\
    \ design principles, such as code symmetry. Let’s get started!\n\n## Avoid Unnecessary\
    \ Comparisons\n\n```java\nclass Laboratory {\n  Microscope microscope;\n\n  Result\
    \ analyze(Sample sample) {\n    if (microscope.isInorganic(sample) == true) {\n\
    \      return Result.INORGANIC;\n    } else {\n      return analyzeOrganic(sample);\n\
    \    }\n  }\n\n  private Result analyzeOrganic(Sample sample) {\n    if (microscope.isHumanoid(sample)\
    \ == false) {\n      return Result.ALIEN;\n    } else {\n      return Result.HUMANOID;\n\
    \    }\n  }\n}\n```\n"
