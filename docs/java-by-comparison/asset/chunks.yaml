    \ that you can no longer put a nonexistent `SpeedPreset` into the `setPreset()`\
    \ method. Even if you try, the Java compiler will stop you.\n\nWe’re also still\
    \ referencing speaking names instead of bare numbers, as in [Replace Magic Numbers\
