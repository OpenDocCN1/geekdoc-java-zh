  trans: "\n\n你可能在想：为什么这是一个问题呢？在非常简单的情况下，并不是。但如果 lambda 表达式包含了更多的逻辑——例如，如果 `Predicate`\
    \ 是一个复杂的条件，或者 `Function` 是多行转换——那么就存在出错的可能。而且由于我们无法引用这些 lambda 表达式，因此无法通过单元测试对它们进行隔离测试，以确保它们的运行符合预期。这并不好。\n\
    \n另一方面，基于方法调用的代码更容易测试，因为你可以独立于集成之外单独调用这些方法。幸运的是，`Java` 中的函数式编程也提供了一种处理这种问题的机制：方法引用。使用方法引用，你可以直接将方法调用作为\
    \ lambda 表达式嵌入，这使得质量保证变得更容易。\n\n让我们看看如何通过方法引用来改进代码：\n\n```java\nclass Inventory\
    \ {\n    List<Supply> supplies = new ArrayList<>();\n\n    long countDifferentKinds()\
    \ {\n        return supplies.stream()\n            .filter(Supply::isUncontaminated)\n\
    \            .map(Supply::getName)\n            .distinct()\n            .count();\n\
    \    }\n}\n```\n\n语法非常简单。我们不再定义普通的 lambda 表达式，而是可以直接在流中引用现有方法。\n\n看看这段代码。我们把之前代码段中的\
    \ lambda 表达式替换成了方法引用。这样一来，我们甚至可以避免否定！现在，流只负责调度现有的（当然是经过测试的）方法。这结合了良者的优势。\n\n而且不仅于此：通过方法引用，代码变得更短更具可读性，即使起初可能需要习惯这种语法。\n\
    \n方法引用需要形式为 `ClassName::methodName` 的特殊（新的）语法。例如，`Supply::getName` 引用了 `Supply`\
    \ 类的 `getName()` 方法。\n\n当然，你引用的方法必须符合使用它的地方。`filter` 操作需要一个符合 `Predicate` 接口的方法引用（一个接受对象并返回\
    \ `Boolean` 的方法），而 `map` 操作需要一个符合 `Function` 接口的方法引用（一个接受对象并返回对象的方法）。\n\n在此时，你可能会考虑将你的\
    \ lambda 表达式转换为方法。当表达式相当复杂，或者当你需要多次使用它以避免“lambda 重复”时，你应该这样做。\n\n顺便提一下，方法引用非常灵活：你甚至可以以\
    \ `ClassName::new` 的形式引用构造函数。这在将流转换为集合时 `collect(Collectors.toCollection(TreeSet::new))`\
    \ 可能会大有用场。\n\n## 避免副作用\n\n```java\nclass Inventory {\n    List<Supply> supplies\
    \ = new ArrayList<>();\n\n    long countDifferentKinds() {\n        List<String>\
    \ names = new ArrayList<>();\n\n        Consumer<String> addToNames = name ->\
    \ names.add(name);\n\n        supplies.stream()\n            .filter(Supply::isUncontaminated)\n\
    \            .map(Supply::getName)\n            .distinct()\n            .forEach(addToNames);\n\
    \        return names.size();\n    }\n}\n```\n\n理论上，函数式编程没有副作用。一切都只是接收数据作为输入并产生新数据作为输出的函数。你传递的数据是不可变的。\n\
    \n但在命令式和面向对象的编程中，我们一直依赖副作用（我们通过过程或方法改变数据和状态）。在 `Java` 中，我们现在可以混合所有这些风格。这非常强大，但也很容易出错。这就是为什么你应该尝试尽量减少代码中的副作用。\n\
    \n看看上面的代码。它为了实现目标甚至大量使用了副作用。\n\n问题出在流的 `forEach()` 部分中调用的 `Consumer addToNames`。这个\
    \ `Consumer` 在 lambda 表达式之外的列表中添加了一个元素。这就是副作用。\n\n上面的代码没有逻辑上的错误，但一旦你添加并发处理，它就很容易崩溃。`Java`\
    \ 对于不同线程之间副作用的可见性不做任何保证。即使在这里对 lambda 表达式进行并行化，它也会（偶尔）产生错误的结果，因为 `ArrayList` 不是线程安全的。\n\
    \n`Java` 函数式编程的新手倾向于编写这样的代码。虽然 `filter()` 和 `map()` 操作符只作用于流元素本身且不会引起任何副作用，但初学者往往退回到命令式样式来结束流——而这只能通过副作用来实现。\n\
    \n那么，我们如何避免副作用并以更好的方式结束 lambda 表达式呢？\n\n```java\nclass Inventory {\n    List<Supply>\
    \ supplies = new ArrayList<>();\n\n    long countDifferentKinds() {\n        List<String>\
    \ names = supplies.stream()\n            .filter(Supply::isUncontaminated)\n \
    \           .map(Supply::getName)\n            .distinct()\n            .collect(Collectors.toList());\n\
    \        return names.size();\n    }\n}\n```\n\n关键部分是 lambda 表达式产生的列表。我们不是自己填充这个列表，而是通过\
    \ `collect()` 将流中的每个剩余元素收集到集合中。对于列表，你需要用 `collect(Collectors.toList())` 结束流。当然，你也可以通过\
    \ `Collectors.toSet()` 获取 `Set` 或其他数据结构。\n\n在上面的示例中，我们仍然需要获取列表的大小来完成任务。让我们看看是否可以做得更好：\n\
    \n```java\nreturn supplies.stream()\n    .filter(Supply::isUncontaminated)\n \
    \   .map(Supply::getName)\n    .distinct()\n    .count();\n```\n\n是的，我们可以。终止操作符\
    \ `count()` 返回流中剩余元素的数量——这正是我们需要的。它是 `Stream` 类中 `reduce` 操作的简写^[46: `reduce(0,\
    \ streamElement -> streamResult + 1)`。11 列表还原为单个值。这里的零是初始值，我们为流中的每个元素加 1。\n\n\
    总结来说，你应该尽量避免使用 `forEach()` 来结束流，因为它很容易引起副作用。尝试改用 `collect()` 和 `reduce()`，我们将在真正避免副作用\
    \ 中详细解释。这些操作符会结束流并产生你需要的数据结构，无论是 `List`、`Set` 甚至是 `long`。\n\n## 使用 Collect 结束流\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    Map<String, Long> countDifferentKinds() {\n        Map<String, Long> nameToCount\
    \ = new HashMap<>();\n\n        Consumer<String> addToNames = name -> {\n    \
    \        if (!nameToCount.containsKey(name)) {\n                nameToCount.put(name,\
    \ 0L);\n            }\n            nameToCount.put(name, nameToCount.get(name)\
    \ + 1);\n        };\n\n        supplies.stream()\n            .filter(Supply::isUncontaminated)\n\
    \            .map(Supply::getName)\n            .forEach(addToNames);\n      \
    \  return nameToCount;\n    }\n}\n```\n\n在之前的避免副作用 对中，我们向你展示了如何通过 `reduce()` 操作符及其特殊情况\
    \ `count()` 操作符将流转换为单个 long 值。我们还提到了 `collect()` 操作符。这一个最适合结束产生结果比原始值更复杂的流。\n\n"
- fmt: "\nAbove, you can see slight variation of the code from the previous comparison.\
    \ Instead of just counting all distinct elements in the `supplies` list, this\
    \ code computes how many supplies are available grouped by their name in the form\
    \ of a `Map<String, Long>`. If you’re a SQL fan, you’ll be happy because it’s\
    \ actually quite similar to a SQL query in the form of `SELECT name, count(*)\
    \ FROM supplies GROUP BY name` for a table of `supplies`.\n\nThe code contains\
    \ the same problem as in the previous comparison: we rely on side effects to compute\
    \ the contents of `Map<String, Long> nameToCount`. On top of that, the implementation\
    \ of `addToNames` is a bit more complicated than the one in [Avoid Side Effects](#f_0087.xhtml_sec.avoid_side_effects).\
    \ In practice, such code is almost guaranteed to be even more complex. And the\
    \ more complex, the harder it is to comprehend.\n\nSo how can we rid this complex\
    \ termination of the stream from side effects and make it easier to comprehend?\n\
    \n```java\nclass Inventory {\n    List<Supply> supplies = new ArrayList<>();\n\
    \n    Map<String, Long> countDifferentKinds() {\n        return supplies.stream()\n\
    \            .filter(Supply::isUncontaminated)\n            .collect(Collectors.groupingBy(Supply::getName,\n\
    \                Collectors.counting())\n            );\n    }\n}\n```\n\nIf you\
    \ want to get a `Collection` as the result of a stream, Java provides you with\
    \ the `collect()` operator that we’ve mentioned in [Avoid Side Effects](#f_0087.xhtml_sec.avoid_side_effects)\
    \ and many predefined `Collectors` that you can use out of the box.\n\nYou already\
    \ know a few of these, like `toList()`, `toSet()`, or `toMap()`. But there are\
    \ several others, and they’re quite powerful.\n\nConsider the code above. First,\
    \ we use the `Collectors.groupingBy()` operator on the stream of `Supply` instances.\
    \ This operator will always return you a `Map` data structure.\n\nHere, we want\
    \ to group the `Supply` objects by their name. To achieve this, we pass in the\
    \ method reference `Supply::getName`. This also specifies the key type of the\
    \ resulting `Map`, in our case `String`. If we used only that, then the expression\
    \ would return something like a `Map<String, Collection<Supply>>`. You may have\
    \ spotted it: we no longer need the map operator here, thanks to `groupingBy()`.\n\
    \nBut we don’t stop there. The second parameter in our call to `groupingBy()`\
    \ is `Collectors.counting()`. This counts the number of `Supply` instances within\
    \ a group. As a result, we get a `Map<String, Long>` with the number of items\
    \ per name, as desired.\n\nTake a moment to compare the expressiveness of both\
    \ solutions. The one using `collect()` here is much more precise and to the point\
    \ than the one on the previous page, isn’t it? And it reads almost like the highly\
    \ descriptive SQL query.\n\nAnd you know what is awesome? There are a lot of additional\
    \ helpful collectors available, like `partitioningBy()`, `maxBy()`, `joining()`,\
    \ `mapping()`, `summingInt()`, `averagingLong()`, and, of course, `reducing()`.\
    \ In Java 9, you can even use `filtering()` and `flatMapping()`, too!\n\n## Avoid\
    \ Exceptions in Streams\n\n```java\nclass LogBooks {\n    static List<LogBook>\
    \ getAll() throws IOException {\n        return Files.walk(Paths.get(\"/var/log\"\
    ))\n            .filter(Files::isRegularFile)\n            .filter(LogBook::isLogbook)\n\
    \            .map(path -> {\n                try {\n                    return\
    \ new LogBook(path);\n                } catch (IOException e) {\n            \
    \        throw new UncheckedIOException(e);\n                }\n            })\n\
    \            .collect(Collectors.toList());\n    }\n}\n```\n\nAs you’ve seen in\
    \ Chapter 5, [Prepare for Things Going Wrong](#f_0052_split_001.xhtml_chp.error-handling),\
    \ you should be prepared for dealing with exceptions. Unfortunately, this can\
    \ be hard with lambda expressions.\n\nIn the code above, we use the Java NIO API\
    \ to iterate over the filesystem with a stream. `Files.walk()` opens a `Stream<Path>`\
    \ that starts from a given `Path` and contains all files and directories below\
    \ that `Path`.\n\nBut when you work with the filesystem, there’s always a chance\
    \ of triggering an `IOException`. For example, files could be on an external drive\
    \ that got disconnected, or directories could be deleted by a different process\
    \ at runtime.\n\nBy design streams don’t go well with checked exceptions. You\
    \ have to handle them inside the stream. That’s why we catch the `IOException`\
    \ in the `map()` operation and convert it to an `UncheckedIOException`, which\
    \ extends `RuntimeException`.\n\nThat’s a way to get the whole expression to compile,\
    \ but it’s not beautiful. There’s just no proper mechanism to handle exceptions,\
    \ even unchecked ones, within the functional style in Java. Essentially, this\
    \ comes from a mismatch of paradigms. Functions work on inputs and produce outputs.\
    \ Functions don’t throw (or catch) exceptions.\n\n### Closing I/O Streams\n\n\
    The filesystem is a resource, and you need to take care of it. [Always Close Resources](#f_0059.xhtml_sec.always_close_resources)\
    \ springs to your mind. Is that the case here? Well, do you see anything that\
    \ closes it? We definitely don’t.\n\n```java\nclass LogBooks {\n    static List<LogBook>\
    \ getAll() throws IOException {\n        try (Stream<Path> stream = Files.walk(Paths.get(\"\
    /var/log\"))) {\n            return stream\n                .filter(Files::isRegularFile)\n\
    \                .filter(LogBook::isLogbook)\n                .flatMap(path ->\
    \ {\n                    try {\n                        return Stream.of(new LogBook(path));\n\
    \                    } catch (IOException e) {\n                        return\
    \ Stream.empty();\n                    }\n                })\n               \
    \ .collect(Collectors.toList());\n        }\n    }\n}\n```\n\nAs you can see,\
    \ we still have a `try-catch` block in the code above. There’s no way around this,\
    \ but we no longer convert the checked exception to an unchecked one. Instead,\
    \ we simply remove the exceptional element from the stream.\n\nTo do so, we used\
    \ the `flatMap()` operator. This one’s similar to `map()`, but instead of mapping\
    \ a type to another, it maps a type to a `Stream` of another type. If everything\
    \ goes right, we simply create a new stream for a single element with `Stream.of(element)`.\
    \ If there are problems, we just return `Stream.empty()`.\n\nThis matches the\
    \ paradigm of the functional style much better. No matter what, an exception won’t\
    \ take down the entire computation, and the stream produces an output based on\
    \ its inputs. This also makes reasoning about (and documenting) that code more\
    \ straightforward. Of course, you can also handle exceptions by logging, but keep\
    \ in mind that this easily causes side effects, violating the pure functional\
    \ paradigm.\n\nIn a nutshell: You’re better off in the functional style if you\
    \ avoid exceptions.\n\nClosing I/O Streams\n\nWe used `try-with-resources` for\
    \ the `Stream` in the code above to make sure that the resource is closed. Admittedly,\
    \ it does not look as clean as before, but it will do its job. Don’t forget this!\n\
    \n## Favor Optional Over Null\n\n```java\nclass Communicator {\n    Connection\
    \ connectionToEarth;\n\n    void establishConnection() {\n        // used to set\
    \ connectionToEarth, but may be unreliable\n    }\n\n    Connection getConnectionToEarth()\
    \ {\n        return connectionToEarth;\n    }\n}\n```\n\nReferences that don’t\
    \ point to an object point to the null reference instead. If you try to call a\
    \ method on a null reference, you cause a `NullPointerException`. This is probably\
    \ the most well-known exception in Java.\n"
  raw: 'Above, you can see slight variation of the code from the previous comparison.
    Instead of just counting all distinct elements in the supplies list, this code
    computes how many supplies are available grouped by their name in the form of
    a Map<String, Long>. If you’re a SQL fan, you’ll be happy because it’s actually
    quite similar to a SQL query in the form of SELECT name, count(*) FROM supplies
    GROUP BY name for a table of supplies.


    The code contains the same problem as in the previous comparison: we rely on side
    effects to compute the contents of Map<String, Long> nameToCount. On top of that,
    the implementation of addToNames is a bit more complicated than the one in [*Avoid
    Side Effects*](#f_0087.xhtml_sec.avoid_side_effects). In practice, such code is
    almost guaranteed to be even more complex. And the more complex, the harder it
    is to comprehend.


    So how can we rid this complex termination of the stream from side effects and
    make it easier to comprehend?


    |   | **class** Inventory { |


    |   |  |


    |   | List<Supply> supplies = **new** ArrayList<>(); |


    |   |  |


    |   | Map<String, Long> countDifferentKinds() { |


    |   | **return** supplies.stream() |


    |   | .filter(Supply::isUncontaminated) |


    | » | .collect(Collectors.groupingBy(Supply::getName, |


    | » | Collectors.counting()) |


    |   | ); |


    |   | } |


    |   | } |


    If you want to get a Collection as the result of a stream, Java provides you with
    the collect() operator that we’ve mentioned in [*Avoid Side Effects*](#f_0087.xhtml_sec.avoid_side_effects)
    and many predefined Collectors that you can use out of the box.


    You already know a few of these, like toList(), toSet(), or toMap(). But there
    are several others, and they’re quite powerful.


    Consider the code above. First, we use the Collectors.groupingBy() operator on
    the stream of Supply instances. This operator will always return you a Map data
    structure.


    Here, we want to group the Supply objects by their name. To achieve this, we pass
    in the method reference Supply::getName. This also specifies the key type of the
    resulting Map, in our case String. If we used only that, then the expression would
    return something like a Map<String, Collection<Supply>>. You may have spotted
    it: we no longer need the map operator here, thanks to groupingBy().


    But we don’t stop there. The second parameter in our call to groupingBy() is Collectors.counting().
    This counts the number of Supply instances within a group. As a result, we get
    a Map<String, Long> with the number of items per name, as desired.


    Take a moment to compare the expressiveness of both solutions. The one using collect()
    here is much more precise and to the point than the one on the previous page,
    isn’t it? And it reads almost like the highly descriptive SQL query.


    And you know what is awesome? There are a lot of additional helpful collectors available,
    like partitioningBy(), maxBy(), joining(), mapping(), summingInt(), averagingLong(),
    and, of course, reducing(). In Java 9, you can even use filtering() and flatMapping(),
    too!


    ## Avoid Exceptions in Streams


    |   | **class** LogBooks { |


    |   |  |


    |   | **static** List<LogBook> getAll() **throws** IOException { |


    | » | **return** Files.walk(Paths.get(*"/var/log"*)) |


    |   | .filter(Files::isRegularFile) |


    |   | .filter(LogBook::isLogbook) |


    |   | .map(path -> { |


    |   | **try** { |


    |   | **return** **new** LogBook(path); |


    |   | } **catch** (IOException e) { |


    | » | **throw** **new** UncheckedIOException(e); |


    |   | } |


    |   | }) |


    |   | .collect(Collectors.toList()); |


    |   | } |


    |   | } |


    As you’ve seen in Chapter 5, [*Prepare for Things Going Wrong*](#f_0052_split_001.xhtml_chp.error-handling),
    you should be prepared for dealing with exceptions. Unfortunately, this can be
    hard with lambda expressions.


    In the code above, we use the Java NIO API to iterate over the filesystem with
    a stream. Files.walk() opens a Stream<Path> that starts from a given Path and
    contains all files and directories below that Path.


    But when you work with the filesystem, there’s always a chance of triggering an
    IOException. For example, files could be on an external drive that got disconnected,
    or directories could be deleted by a different process at runtime.


    By design streams don’t go well with checked exceptions. You have to handle them
    inside the stream. That’s why we catch the IOException in the map() operation
    and convert it to an UncheckedIOException, which extends RuntimeException.


    That’s a way to get the whole expression to compile, but it’s not beautiful. There’s
    just no proper mechanism to handle exceptions, even unchecked ones, within the
    functional style in Java. Essentially, this comes from a mismatch of paradigms.
    Functions work on inputs and produce outputs. Functions don’t throw (or catch)
    exceptions.


    Closing I/O Streams


    The filesystem is a scarce resource, and you need to take care of closing it properly
    in your code. [*Always Close Resources*](#f_0059.xhtml_sec.always_close_resources)
    springs to your mind. Is that the case here? Well, do you see anything that closes
    it? We definitely don’t.


    So how can we deal with exceptions without breaking out of the functional programming
    style here?


    |   | **class** LogBooks { |


    |   |  |


    |   | **static** List<LogBook> getAll() **throws** IOException { |


    | » | **try** (Stream<Path> stream = Files.walk(Paths.get(*"/var/log"*))) { |


    |   | **return** stream.filter(Files::isRegularFile) |


    |   | .filter(LogBook::isLogbook) |


    |   | .flatMap(path -> { |


    |   | **try** { |


    |   | **return** Stream.of(**new** LogBook(path)); |


    |   | } **catch** (IOException e) { |


    | » | **return** Stream.empty(); |


    |   | } |


    |   | }) |


    |   | .collect(Collectors.toList()); |


    |   | } |


    |   | } |


    |   | } |


    As you can see, we still have a try-catch block in the code above. There’s no
    way around this, but we no longer convert the checked exception to an unchecked
    one. Instead, we simply remove the exceptional element from the stream.


    To do so, we used the flatMap() operator. This one’s similar to map(), but instead
    of mapping a type to another one, it maps a type to a Stream of another type.
    If everything goes right, we simply create a new stream for a single element with
    Stream.of(element). If there are problems, we just return Stream.empty().


    This matches the paradigm of the functional style much better. No matter what,
    an exception won’t take down the entire computation, and the stream produces an
    output based on its inputs. This also makes reasoning about (and documenting)
    that code more straightforward. Of course, you can also handle exceptions by logging,
    but keep in mind that this easily causes side effects, violating the pure functional
    paradigm.


    In a nutshell: You’re better off in the functional style if you avoid exceptions.


    Closing I/O Streams


    We used try-with-resources for the Stream in the code above to make sure that
    the resource is closed. Admittedly, it does not look as clean as before, but it
    will do its job. Don’t forget this!


    ## Favor Optional Over Null


    |   | **class** Communicator { |


    |   |  |


    |   | Connection connectionToEarth; |


    |   |  |


    |   | **void** establishConnection() { |


    |   | *// used to set connectionToEarth, but may be unreliable* |


    |   | } |


    |   |  |


    |   | Connection getConnectionToEarth() { |


    | » | **return** connectionToEarth; |


    |   | } |


    |   | } |


    References that don’t point to an object point to the null reference instead.
    If you try to call a method on a null reference, you cause a NullPointerException.
    This is probably the most well-known exception in Java.'
