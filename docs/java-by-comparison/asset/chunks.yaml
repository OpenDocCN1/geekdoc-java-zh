  raw: 'Code formatting is a topic that easily leads to heated debates, even when
    you talk about the same language. Already the length of a line of code can be
    discussed. Should a line of code be set to 80 characters as it has been traditionally
    or 120 characters because we have widescreen displays today? Maybe 100 characters
    is a good compromise? Probably the most famous discussion point is whether you
    should indent code with tabs or spaces. Few things are more controversial among
    developers. Ultimately, there’s no right or wrong here. The problem is that all
    team members need to agree on a consistent formatting style to avoid constant
    reformatting and even bugs.


    Usually, as long as you find a format everybody can agree upon, it’s fine—at least
    as long as you don’t waste countless hours trying to reach an agreement and creating
    corresponding configurations in your IDEs.


    A better way is to avoid all discussion and use an industry standard. The Java
    code conventions that we’ve mentioned a few times are a good start, but they’re
    comparably brief and they haven’t been updated in a while. That’s why we recommend
    you resort to the Google Java Style Guide,^([[55]](#f_0105.xhtml_FOOTNOTE-55))
    the Java formatting guidelines by Google. Essentially, they’re an updated version
    of the Java Code Conventions with more sensible defaults. If that works for formatting
    all Java Code at Google, chances are it’ll also work for your team. The kicker
    is that there’s Google Java Format,^([[56]](#f_0105.xhtml_FOOTNOTE-56)) a tool
    that checks and enforces this formatting. It’s best if you make that a part of
    your build process. Every time you make a change, simply run the tool and you’re
    done.


    ## Automate Your Build


    Some say that before you can run (write Java code in an IDE) you need to learn
    to walk (use the Java command-line tools). We think this is true for the complete
    build process of your software.


    You might’ve written your first Java program in a simple text editor and used
    the command-line tool javac to compile your code and run it with the java command.
    This works as long things stay (very) simple. From our teaching experience, it
    also really helps beginners to get a grasp of the difference between source code
    and byte code.


    But in any halfway realistic project, you’ll be using external libraries in the
    form of JARs (Java Archives), executing JUnit tests, and building JavaDoc-based
    documentation. If you want to do this only on the command line, you’ll end up
    with a lot of different and very long calls.


    That’s why almost every Java developer writes Java with an IDE such as IntelliJ
    IDEA, Eclipse, or NetBeans. IDEs can handle all the necessary tasks we need to
    perform, such as executing a Java class with a main method or debugging a single
    JUnit test. It’s nice if you can standardize that across the team, but usually
    people want to work on different operating systems and/or IDEs. In that case,
    you can’t really rely on a single IDE anymore.


    The way to go is to automate your build using a dedicated build tool or language
    that works in the same way on all systems and independent of a developer’s machine.
    Gradle^([[57]](#f_0105.xhtml_FOOTNOTE-57)) is such a tool. It’s the rising star
    for Java and the default build system for Android, but you’ll also use Apache
    Maven,^([[58]](#f_0105.xhtml_FOOTNOTE-58)) the established enterprise standard,
    or Apache Ant^([[59]](#f_0105.xhtml_FOOTNOTE-59)) often.


    To automate your build, you’ll need to write a build file and put it into your
    project. This file uses a special syntax depending on the build tool, and in it,
    you describe where your source code is located, what your dependencies and external
    libraries are, and what else you need to do for a successful build. Then, the
    build tool interprets the files, downloads any external libraries, runs all tests,
    and if successful, builds an executable. Modern IDEs can interpret those build
    files as well, and they integrate with the build tools so you can run anything
    from within your IDE. When you’ve automated all that, you’ve taken the first steps
    toward a true delivery pipeline.


    ## Use Continuous Integration


    Automating your build locally with a build tool is really a good start. You can
    run your tests and build executables whenever you want locally on your developer
    machine. But in a real development environment, you’ll want more. That’s where
    [*Continuous Integration* [DMG07]](#f_0106.xhtml_d2831e33) comes in.


    When you make a code change locally, of course you should run unit tests to make
    sure you didn’t break anything before you commit it to version control. But in
    an enterprise project, the complete set of tests can be huge, and building a fully
    integrated executable can take a long time. We’re talking about several minutes
    here, even hours, and that’s not a process you want to trigger for every small
    code change on your machine.


    On top of that, we’ve told you to [*Use Static Code Analysis Tools*](#f_0095.xhtml_sec.use.static.analysis).
    Those tools all operate on a code base and show you potential issues in it. You
    might fix some issues directly and just ignore false positives. What you’re most
    interested in is how your last changes affect code quality. Did you introduce
    new issues that weren’t there before?


    All of these things—extensive testing, integration, and code quality checks—can
    be outsourced to dedicated machines: continuous integration servers. The idea
    behind it all is very simple: for every commit to the version control system,
    a dedicated server pulls all code, executes all tests, and builds a fully integrated
    executable. It runs code quality checks and compares the results to the data from
    the commits before, thereby building a timeline for the quality of your code.
    That way, it’s easy to make sure that your project is always buildable and quality
    doesn’t go down.


    There are many different tools you can use here. On your own server, you can install
    Jenkins,^([[60]](#f_0105.xhtml_FOOTNOTE-60)) one of the most popular continuous
    integration systems in the Java world. It can run your tests, and there are many
    plugins for quality checks. But you can also use a dedicated quality analysis
    server. Here, the market leader is SonarQube,^([[61]](#f_0105.xhtml_FOOTNOTE-61))
    which you can host yourself or use their cloud solution. That last point is interesting.
    Many cloud services that you can use for testing and quality analysis, such as
    Travis CI^([[62]](#f_0105.xhtml_FOOTNOTE-62)) or Codacy,^([[63]](#f_0105.xhtml_FOOTNOTE-63))
    are available. They’re handy if your code is open source.


    But just building and testing your software isn’t all. You also have to deliver.


    ## Prepare for and Deliver Into Production


    Production changes everything. Your customers will use your software in so many
    untested ways that you’ll get lots of slow requests, errors, and unexpected behavior
    in your software. To fix those, you need insights about what causes all these
    problems. So it’s vital to prepare for that.


    One part of that preparation is to implement monitoring in the form of logs, metrics,
    dashboards, and alerts. First, you should [*Favor Logging Over Console Output*](#f_0100.xhtml_sec.favor_logging_over_console_output),
    which we’ll explain to you in a moment. Next, you should set up a central place
    where all your logs go. If the logs are also searchable and you can analyze them,
    compute metrics, and visualize them in a dashboard, that’s perfect. Then, you
    might be able to derive key insights and thresholds, like how many orders were
    placed within the last 24 hours. And if such a metric is below a target threshold,
    you’ll probably want to alert the person who can bring that metric up again. For
    things like this, we can recommend the Open Source Elastic Stack^([[64]](#f_0105.xhtml_FOOTNOTE-64))
    and Graylog.^([[65]](#f_0105.xhtml_FOOTNOTE-65))'
