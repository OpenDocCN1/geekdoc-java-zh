    \ 等，并提供了如 getX()、getY() 等方法，用于获取事件发生时鼠标光标的位置。\n\n（参见 使用方便方法注册事件处理器来处理鼠标事件 Use\
    \ Convenience Methods to Register... 章节）\n\nNode 类中提供了一些方便方法，用于注册 EventHandler\
    \ 来处理鼠标事件。\n\n- public final void setOnMouseClicked(EventHandler<? super MouseEvent>\
    \ value)\n- public final void setOnMouseEntered(EventHandler<? super MouseEvent>\
    \ value)\n- public final void setOnMouseExited(EventHandler<? super MouseEvent>\
    \ value)\n\n（参见 使用方便方法注册事件处理器来处理鼠标事件 Use Convenience Methods to Register... 章节）\n\
    \nstatic void install(Node node, Tooltip t) 方法由 Tooltip 类提供，该类位于 javafx.scene.control\
    \ 包并继承自 javafx.scene.control.PopupControl 类，当鼠标悬停在指定的 Node 上时显示帮助信息。\n\n（参见为 Node\
    \ 安装工具提示 Install Tooltip for Node 章节）\n\nStackPane 提供了静态方法，用于自定义指定子节点的布局约束：\n\n\
    - static void setAlignment(Node child, Pos value)\n- static void setMargin(Node\
    \ child, Insets value)\n\n（参见章节：在 StackPane 中调整下一个按钮的默认位置 Adjust Next... 以及在 StackPane\
    \ 中添加上一个按钮并调整其位置 Add Previous...）\n\nPos 位于 javafx.geometry 包，是一个枚举类型，定义了位置和对齐的常量，如\
    \ CENTER、CENTER_RIGHT、TOP_RIGHT 等。\n\n（参见章节：在 StackPane 中调整下一个按钮的默认位置 Adjust Next...\
    \ 以及在 StackPane 中添加上一个按钮并调整其位置 Add Previous...）\n\nInsets 类位于 javafx.geometry\
    \ 包，通常在 setMargin 方法或 setPadding 方法中使用，用于指定矩形区域四边（上、右、下、左）的偏移量。\n\n（参见在 StackPane\
    \ 中调整下一个按钮的默认位置 Adjust Next... 以及此处 here）\n\nFileChooser.ExtensionFilter 是在 FileChooser\
    \ 类中定义的嵌套类，用于定义过滤器，以仅显示扩展名与给定过滤器匹配的文件。\n\n（参见配置 FileChooser Configure FileChooser\
    \ 章节）\n\n位于 javafx.beans.property 包中的某些类：\n\n- ObjectProperty<T> 是一个抽象类，派自 javafx.beans.binding.ObjectExpression<T>\
    \ 类，实现了 Property<T> 和 WritableObjectValue<T>。\n- SimpleObjectProperty<T> 派自 ObjectProperty<T>\
    \ 类。\n- StringProperty 是一个抽象类，派自 javafx.beans.binding.StringExpression 类，实现了 Property<java.lang.String>\
    \ 和 WritableStringValue。\n- WritableStringValue 派自 WritableObjectValue<java.lang.String>。\n\
    - SimpleStringProperty 派自 StringProperty 类。\n\n（参见在 ImageViewer 类中定义属性 Define\
    \ Properties... 章节）\n\nProperty<T> 接口位于 javafx.beans.property 包，定义了所有属性共同的方法，如下：\n\
    \n- void bind(ObservableValue<? extends T> observable)\n将此属性单向绑定到给定的 ObservableValue。\n\
    - void unbind()\n取消此属性的绑定。\n\n（参见在 ImageViewer 类中定义属性 Define Properties... 章节）\n\
    \nWritableObjectValue<T> 接口位于 javafx.beans.value 包并继承自 WritableValue<T>，它定义了以下方法：\n\
    \n- T get()\n获取封装的值。\n- void set(T value)\n设置封装的值。\n\n（参见此处 here）\n\n***第 3 章***\n\
    ## 带有幻灯片功能的增强型图片查看器\n\n## 容量\n### —开发图片查看器 V1.2\n\n### 前言\n\n在此阶段，ImageViewer\
    \ 已经具备了作为有效图片查看工具所需的足够能力。基于目前构建的基础结构，可以轻松地分阶段开发更多功能。\n\n本章重点介绍幻灯片功能的实现，以及对 GUI\
    \ 整体外观和感受的微调。我们将演示如何使用位于 javafx.concurrent 包中的并发类来开发多线程 JavaFX 应用程序。\n\nImageViewer\
    \ 的版本号升级到了 1.2。通过从 ImageViewer V1.2 中摘取的详细描述和文档良好的示例代码，你将熟悉在总结（Summary）章节中所述的\
    \ JavaFX 库的基本功能。\n\nImageViewer V1.2 的完整开发过程具有以下步骤特征：\n\n- 3.1 在 BorderPane 底部添加状态栏\n\
    \    - 3.1.1 创建 HBox  作为状态栏和 Text 节点显示图片名称\n    - 3.1.2 设置 imageName 属性的值\n- 3.2\
    \ 改进按钮的响应特性\n    - 3.2.1 禁用按钮以表示没有更多图片可以打开\n    - 3.2.2 在鼠标按下时更改按钮外观\n- 3.3 添加幻灯片功能\n\
    \    - 3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n        - 3.3.1.1 绑定菜单项的禁用属性\n    - 3.3.2 在另一个线程上执行幻灯片\n\
    \        - 3.3.2.1 创建继承 Service 的 SlideshowService 类\n        - 3.3.2.2 配置幻灯片\
    \ Service\n        - 3.3.2.3 实现开始幻灯片和停止幻灯片菜单项的事件处理器\n    - 3.3.3 ImageViewer 应用程序的完整\
    \ start 方法\n    - 3.3.4 加载菜单项和上一个按钮的事件\n- 3.4 添加幻灯片之间的淡入过渡\n    - 3.4.1 SlideshowService\
    \ 的完整源码\n    - 3.5 Image Viewer V1.2 的完整源码\n    - 3.6 总结\n\n## 3.1 在 BorderPane\
    \ 底部添加状态栏\n\n在实现幻灯片功能之前，我们将在根节点 BorderPane 的底部添加一个状态栏。状态栏用于显示图片名称，即当前图片的名称。\n\n\
    ### 3.1.1 创建 HBox 作为状态栏和 Text 节点显示图片名称\n\n**名称**\n创建一个 HBox（一种内置布局面板，水平排列其子节点）作为状态栏。并创建一个\
    \ Text 节点来显示图片名称。以下是实现这些操作的代码片段：\n\n BorderPane rootPane = new BorderPane();\n\
    \ HBox statusBar = new HBox();\n Text statusText = new Text(\"\"); statusBar.getChildren().add(statusText);\n\
    \ rootPane.setBottom(statusBar);\n\n请注意，Text 类派自 Node 类，是 Shape 类的直接子类之一，负责渲染几何图形的需求。\n\
    \n Text 作为 Node 和 Shape 具有巨大的优势。所有 JavaFX 节点的特性都适用于 Text 对象。它们可以利用自动放置功能放在布局面板中，应用变换和过渡，使用\
    \ CSS 自定义演示样式等。它们还拥有 Shape 类定义的常用属性，如填充、描边、描边类型、线宽等。\n\n我们希望为作为状态栏的 HBox 设置如下的属性值：\n\
    \npadding\npadding 属性继承自 Region 类，定义区域上、右、下、左的内边距。调用 setPadding(Insets value)\
    \ 方法设置该属性的值。\n\nspacing\nspacing 属性定义在 HBox 类中，指定 HBox 面板孩子之间的水平间距。调用 setSpacing(double\
    \ value) 方法设置该属性的值。\n\nstyle\nstyle 属性定义在 Node 类中，指定该节点的 CSS 样式。该属性的值是一个符合样式表格式的字符串。\n\
    \n"
