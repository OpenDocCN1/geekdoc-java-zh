- md: "\npackage imageviewer;\n\nimport java.nio.file.Path;\nimport java.util.ListIterator;\n\
    import javafx.animation.FadeTransition;\nimport javafx.animation.ParallelTransition;\n\
    import javafx.animation.Transition;\nimport javafx.beans.property.ObjectProperty;\n\
    import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.property.SimpleStringProperty;\n\
    import javafx.beans.property.StringProperty;\nimport javafx.beans.value.ChangeListener;\n\
    import javafx.beans.value.ObservableValue;\nimport javafx.concurrent.Service;\n\
    import javafx.concurrent.Task;\nimport javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\n\
    import javafx.util.Duration;\n\n/**\n * File Name: SlideshowService.java\n * (in\
    \ directory: ImageViewer1.2/src/example5/imageviewer/)\n *\n * Add fade transition\
    \ between slides\n *\n * @author Shufen Kuo\n */\npublic class SlideshowService\
    \ extends Service<Void> {\n\n    private ObjectProperty<ImageView> imageView =\
    \ new SimpleObjectProperty();\n    private ObjectProperty<ImageView> fadeOutIV\
    \ = new SimpleObjectProperty();\n    private ObjectProperty<Image> image;\n  \
    \  private ObjectProperty<ListIterator<Path>> iterator;\n    private StringProperty\
    \ imageName;\n    private ListIterator<Path> it;\n\n    public SlideshowService()\
    \ {\n        this(new SimpleObjectProperty<ListIterator<Path>>(),\n          \
    \   new SimpleObjectProperty<Image>(),\n             new SimpleStringProperty());\n\
    \    }\n\n    public SlideshowService(ObjectProperty<ListIterator<Path>> iterator,\n\
    \                             ObjectProperty<Image> image, StringProperty imageName)\
    \ {\n        this.image = image;\n        this.imageName = imageName;\n      \
    \  this.iterator = iterator;\n        iterator.addListener(new ChangeListener<ListIterator<Path>>()\
    \ {\n            @Override\n            public void changed(ObservableValue<?\
    \ extends ListIterator<Path>>\n                    ListIterator<Path> oldVal,\
    \ ListIterator<Path> newVal) {\n                it = newVal;\n            }\n\
    \        });\n    }\n\n    public ImageView getImageView() {\n        return imageView.get();\n\
    \    }\n\n    public void setImageView(ImageView value) {\n        imageView.set(value);\n\
    \    }\n\n    public ObjectProperty<ImageView> imageViewProperty() {\n       \
    \ return imageView;\n    }\n\n    public ImageView getFadeOutImageView() {\n \
    \       return fadeOutIV.get();\n    }\n\n    public void setFadeOutImageView(ImageView\
    \ value) {\n        fadeOutIV.set(value);\n    }\n\n    public ObjectProperty<ImageView>\
    \ fadeOutImageViewProperty() {\n        return fadeOutIV;\n    }\n\n    public\
    \ Image getImage() {\n        return image.get();\n    }\n\n    public void setImage(Image\
    \ value) {\n        image.set(value);\n    }\n\n    public ObjectProperty<Image>\
    \ imageProperty() {\n        return image;\n    }\n\n    public ListIterator<Path>\
    \ getIterator() {\n        return iterator.get();\n    }\n\n    public void setListIterator(ListIterator<Path>\
    \ value) {\n        iterator.set(value);\n    }\n\n    public ObjectProperty<ListIterator<Path>>\
    \ iteratorProperty() {\n        return iterator;\n    }\n\n    public String getImageName()\
    \ {\n        return imageName.get();\n    }\n\n    public void setImageName(String\
    \ value) {\n        imageName.set(value);\n    }\n\n    public StringProperty\
    \ imageNameProperty() {\n        return imageName;\n    }\n\n    @Override\n \
    \   protected Task<Void> createTask() {\n        return new Task<Void>() {\n \
    \           @Override\n            protected Void call() {\n                if\
    \ (it == null) return null;\n                Transition animate = null;\n    \
    \            ImageView inView = imageView.get();\n                ImageView outView\
    \ = fadeOutIV.get();\n                if (inView != null && outView != null) {\n\
    \                    FadeTransition fadein = new FadeTransition(Duration.millis(200));\n\
    \                    fadein.setFromValue(0.0);\n                    fadein.setToValue(1.0);\n\
    \                    FadeTransition fadeout = new FadeTransition(Duration.millis(200));\n\
    \                    fadeout.setFromValue(1.0);\n                    fadeout.setToValue(0.0);\n\
    \                    animate = new ParallelTransition(fadein, fadeout);\n    \
    \            }\n                while (it.hasNext()) {\n                    if\
    \ (isCancelled()) {\n                        updateMessage(\"Cancelled\");\n \
    \                       break;\n                    }\n                    if\
    \ (inView != null && outView != null) {\n                        Image prevImage\
    \ = getImage();\n                        outView.setImage(prevImage);\n      \
    \                  // Must reset opacity's from value for outView\n          \
    \              outView.setOpacity(1);\n                        // Must reset opacity's\
    \ from value for inView\n                        inView.setOpacity(0);\n     \
    \               }\n                    String url = it.next().toUri().toString();\n\
    \                    setImage(new Image(url));\n                    setImageName(url.substring(\n\
    \                            url.lastIndexOf(\"/\") + 1).replaceAll(\"%20\", \"\
    \ \"));\n                    // Start fadein fadeout animation before pause\n\
    \                    if (animate != null)\n                        animate.playFromStart();\n\
    \                    // Pause for 3000 ms\n                    try {\n       \
    \                 Thread.sleep(3000);\n                    } catch (InterruptedException\
    \ ex) {\n                        if (isCancelled()) {\n                      \
    \      updateMessage(\"Cancelled\");\n                            break;\n   \
    \                     }\n                    }\n                }\n          \
    \      // reset outView before return\n                if (outView != null) {\n\
    \                    outView.setImage(null);\n                }\n            \
