    \ Draw Tool with Draw Writer Capacity\n\nIntroduce DrawWriter class, resides in\
    \ drawtool.io package, to save sketches that are interactively drawn on a drawing\
    \ board, a Pane object, to files in JavaFXML format. A sketch can be either a\
    \ Shape object or an ImageView object. Besides JavaFXML format, it also provides\
    \ API to save the image of an ImageView object to an image file.\n\n## Chapter\
    \ 2: Enhanced Draw Tool with Draw Loader Capacity\n\nIntroduce DrawLoader class,\
    \ which resides in drawtool.io package, to load FXML files as well as image files\
    \ to a drawing board.\n\n## Chapter 3: Enhanced JFXDrawTools with Draw Writer\
    \ and Draw Loader Capacities\n\nIntegrate sketch saving and loading capabilities\
    \ into JFXDrawTools application.\n\n 5. AND THE OTHERS…\n\nA useful **Summary**\
    \ section is available at the end of each chapter; it lists all the key aspects\
    \ of JavaFX library featured in the chapter. It helps you to look up fundamental\
    \ capabilities of JavaFX engaged in this book series. Here are some of essentials\
    \ among others:\n\n- Shape class in javafx.scene.shape package for 2D geometric\
    \ primitives.\n- FXML, a markup language which complies with the XML (Extensible\
    \ Markup Language) format, to build GUIs.\n- Properties and binding mechanism.\n\
    - Image class and ImageView class to load and display images.\n- Concurrency capacity\
    \ in javafx.concurrent package.\n- FadeTransition and ParallelTransition applied\
    \ onto image objects in a slide show function.\n- Build-in layout panes in javafx.scene.layout\
    \ package.\n- And more…\n\n## Reusable Classes with Applications and Complete\
    \ Source Codes\n\nComplete source codes of a set of packages with reusable classes\
    \ as well as embeddable JavaFX applications are included in the book series.\n\
    \nThe following tables list all the source codes offered in the prior four volumes\
    \ of the book series:\n\n### Drawing Tools\n\n| Package Name | Source Code File\
    \ Name |\n| :--- | :--- |\n| drawtool | ShapeDrawer.java |\n| | DrawPane.java\
    \ |\n| drawtool.drawer | BezierCurveDrawer.java |\n| | CircleDrawer.java |\n|\
    \ | EllipseDrawer.java |\n| | LineDrawer.java |\n| | PathDrawer.java |\n| | PolygonDrawer.java\
    \ |\n| | PolylineDrawer.java |\n| | RectangleDrawer.java |\n| | RegularPolygonDrawer.java\
    \ |\n| | RubberBander.java |\n| | ShapeMover.java |\n| drawtool.shape | RegularPolygon.java\
    \ |\n| drawtool.io | DrawClipper.java |\n| | DrawLoader.java |\n| | DrawWriter.java\
    \ |\n\n### Graphics Applications\n\n| Package Name | Source Code File Name |\n\
    | :--- | :--- |\n| imageviewer | FileUtils.java |\n| | ImageViewer.java |\n| |\
    \ SlideshowService.java |\n| jfxdrawtools | JFXDrawTools.java |\n\n## Contents\
    \ of VOLUME Ⅰ\n\nLet’s glance at the contents of VOLUME Ⅰ:\n\n## Chapter 1: Basic\
    \ Image Viewer\n\n1.1 Create ImageViewer Class as Subclass of Application\n1.2\
    \ Create Menu Bar\n1.3 Create Option Menu and View Submenu\n1.4 Implement Fit\
    \ Width, Fit Height and Original Size Viewing Options\n1.5 Summary\n\n## Chapter\
    \ 2: Enhanced Image Viewer with Browsing Buttons\n\n2.1 Add Next Button\n2.2 Adjust\
    \ Next Button’s Default Position in StackPane\n2.3 Add Previous Button and Adjust\
    \ Its Position in StackPane\n2.4 Implement On Mouse Clicked Event Handlers\n2.5\
    \ Complete Source Codes of Image Viewer V1.1\n2.6 Summary\n\n## Chapter 3: Enhanced\
    \ Image Viewer with Slide Show Capacity\n\n3.1 Add Status Bar at the Bottom of\
    \ BorderPane\n3.2 Improve Button’s Reaction Aspect\n3.3 Add Slide Show Capabilities\n\
    3.4 Add Fade Transition between Slides\n3.5 Complete Source Codes of Image Viewer\
    \ V1.2\n3.6 Summary\n\n***Figure 1.*** Snapshot of The Image Viewer in JavaFX\
    \ 8.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_15_0.png)\n\n## Why Choose This\
    \ Book\n\nThis book is for software developers who are interested in developing\
    \ GUIs using JavaFX library for rich client applications.\n\nImportant features\
    \ in JavaFX are illustrated by step-by-step development of real world Java applications.\n\
    \nInstructive diagrams are used to help readers capture abstract concepts instantly.\
    \ And all diagrams used in each chapter are created using the graphics tools developed\
    \ in this book series.\n\nThis book is for you if you are:\n\n- A Java GUI programmer,\
    \ novice or professional, who is new to JavaFX.\n- A Java programmer who has preliminary\
    \ knowledge of JavaFX and would like to learn how to develop interactive sketch\
    \ drawing tools.\n- A professional software engineer who is interested in the\
    \ development of object oriented JavaFX graphics tools and practical applications,\
    \ along with complete and well-documented source codes.\n\n## What You Need for\
    \ This Book\n\nIf you want to compile and run applications included in this book,\
    \ you need to download and install JDK. Here’s the website to download JDK 8,\
    \ http://www.oracle.com/technetwork/java/javase/downloads/index.html.\n\nTo copy\
    \ the complete source codes from this kindle e-Book, Here’s a suggestion:\n\n\
    1. Install Calibre, a free and open source E book Management software, to your\
    \ PC.\n2. Use Add books function in Calibre to add the .mobi file of the e-Book\
    \ to Calibre library.\n3. Open the book from Calibre and copy the source codes\
    \ to Java files.\n\n## INTRODUCTION\n\nThis book series is a tutorial for software\
    \ developers to build GUIs of Java applications using JavaFX 8 which has become\
    \ a part of Java™ SE Development Kit 8 (JDK 8).\n\nThe primary objective of this\
    \ book series is to provide a comprehensive handbook, which brings forward the\
    \ frequently used features and the essence of JavaFX. The usages of APIs provided\
    \ in JavaFX packages are illustrated through the step-by-step development of a\
    \ sophisticated graphics toolkit.\n\nComplete source codes of the graphics toolkit,\
    \ a set of packages with reusable classes as well as embeddable JavaFX applications,\
    \ are included in the book series. Download and install JDK 8 before you compile\
    \ and run these applications. Here’s the website to download the latest version\
    \ of JDK, http://www.oracle.com/technetwork/java/javase/downloads/index.html.\n\
    \n## JavaFX History\n\nNow let us glance through the timeline of JavaFX evolving\
    \ history and obtain glimpses of the predecessor of JavaFX:\n\n- Chris Oliver\
    \ of SeeBeyond Technology Corporation developed a script language called F3, the\
    \ acronym for Form Follows Function; it allows developers accessing Swing classes\
    \ and creating graphics user interfaces (GUIs) for rapid development of rich internet\
    \ applications.\n- Sun Microsystems acquired SeeBeyond in September 2005, F3 renamed\
    \ to JavaFX Script in May 2007.\n- In December 2008, JavaFX 1.0 released, developers\
    \ had relied on JavaFX Script to develop JavaFX applications until three years\
    \ later when JavaFX 2.0 released.\n- In January 2010, Oracle completed the acquisition\
    \ of Sun Microsystems, and continued maintaining JavaFX.\n- In September 2010\
    \ JavaOne conference, Oracle announced JavaFX Script would be discontinued.\n\
    - In October 2011, JavaFX 2.0 released, developers began to engage in standard\
    \ Java language, instead of JavaFX Script, to access APIs of JavaFX library. However,\
    \ JavaFX SDK and JavaFX Runtime, in addition to Java SE JDK and JRE, must be installed\
    \ for developing and executing applications compiled with JavaFX 2.0.\n- In February\
    \ 2013, JavaFX 2.2.7 released, JavaFX SDK and JavaFX Runtime are included within\
    \ JDK/JRE 7. The integration of JavaFX and JDK results in great conveniency for\
    \ JavaFX developers. No additional installations are needed for JavaFX applications\
    \ compiled with JDK 7 and later releases.\n- On March 18, 2014, JavaFX 8 released\
    \ as part of Java™ SE Development Kit 8 (JDK 8), a major feature release.\n\n\
    As of the publishing of this book on March, 2016, the latest JDK releases are:\n\
    \nJDK 8u66 on October 20, 2015, and JDK 8u72 on January 2016.\n\nThe schedule\
    \ of general availability (GA) for JDK 9 is March 23rd, 2017.\n"
  mdcn: "\n\ndrawtool.shape 包。\n\n## 第 2 章：具有正边形绘制能力的增强绘图工具\n\n实现 `RegularPolygonDrawer`，它是\
