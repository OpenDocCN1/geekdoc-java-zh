    \n## 3.4 Add Fade Transition between Slides\n\nTo accent the movement of a slide\
    \ show, we’ll add fade transition between slides. Here are classes from javafx.animation\
    \ package for animations of fade transitions:\n\n**Animation**\nAn abstract class\
    \ extends java.lang.Object, provides common properties and methods required among\
    \ animations.\n\n**Transition**\nAn abstract class extends Animation, provides\
    \ common properties and methods required among transition animations. Here are\
    \ available transitions: FadeTransition, FillTransition, ParallelTransition, PathTransition,\
    \ PauseTransition, RotateTransition, ScaleTransition, SequentialTransition, StrokeTransition,\
    \ TranslateTransition.\n\n**FadeTransition**\nA direct subclass of Transition,\
    \ changes the opacity of a node over the given duration.\n\n**ParallelTransition**\n\
    A direct subclass of Transition, conducts transitions over a list of Animation\
    \ objects, type of ObservableList<Animation>, in a parallel manner.\n\nThis is\
    \ the constructor we’ll use to create FadeTransition objects:\n```java\npublic\
    \ FadeTransition(Duration duration, Node node)\n```\n\n**Duration** class, resides\
    \ in javafx.util package, provides several factory methods for creating duration\
    \ objects. Here’s the one employed:\n```java\npublic static Duration millis(double\
    \ ms)\n```\n\nThe above method creates a Duration of given milliseconds for a\
    \ FadeTransition. A FadeTransition looks into the following properties:\n\n- **duration**:\
    \ Type of ObjectProperty<Duration>, holds the duration of transiting the opacity\
    \ from fromValue to toValue. The value of this property is specified as the first\
    \ argument of the constructor.\n- **node**: Type of ObjectProperty<Node>, holds\
    \ the target node conducted for this fade transition. The value of this property\
    \ is specified as the second argument of the constructor.\n- **fromValue**: Type\
    \ of DoubleProperty, holds the starting value of opacity for this fade transition.\n\
    - **toValue**: Type of DoubleProperty, holds the end value of opacity for this\
    \ fade transition.\n\nHere’s the snippet of codes to create a FadeTransition for\
    \ an image to fade in, the value of opacity for this image is changing from 0\
    \ to 1 through the duration of 2000 milliseconds:\n```java\nFadeTransition fadein\
    \ = new FadeTransition(Duration.millis(2000));\nfadein.setFromValue(0.0);\nfadein.setToValue(1.0);\n\
    ```\n\nSimilarly, here’s the snippet of codes to create a FadeTransition for an\
    \ image to fade out, the value of opacity for this image is changing from 1 to\
    \ 0 through the duration of 2000 milliseconds:\n```java\nFadeTransition fadeout\
    \ = new FadeTransition(Duration.millis(2000));\nfadeout.setFromValue(1.0);\nfadeout.setToValue(0.0);\n\
    ```\n\nNow, we have two FadeTransition objects, one for performing fade in transition,\
    \ another for performing fade out transition, we prefer both transitions to process\
    \ in parallel. Since each transition has its own target node, the following constructor\
    \ of ParallelTransition is employed:\n```java\npublic ParallelTransition(Animation…\
    \ children)\n```\n\nHere’s the snippet of codes to create a ParallelTransition\
    \ and start the animation using the playFromStart() method provided in Animation\
    \ class:\n```java\nTransition animate = new ParallelTransition(fadein, fadeout);\n\
    animate.playFromStart();\n```\n\nThe requester of a SlideshowService need provide\
    \ two ImageView objects, one for fade in transition, and another for fade out\
    \ transition. The snippets of codes below demonstrate how the requester of a SlideshowService\
    \ provides two ImageView objects using the setImageView method and the setFadeOutImageView\
    \ method.\n\n***Listing 3-21.*** Provide two ImageView objects for fade transitions\
