    \ loadFile(File file) {\n  // Create list iterator\n  try {\n    ListIterator<java.nio.file.Path>\
    \ it = FileUtils.listIterator(file.toPath());\n    // Update value of listIterator\
    \ property\n    listIterator.set(it);\n\n    // Disable prevButton if there's\
