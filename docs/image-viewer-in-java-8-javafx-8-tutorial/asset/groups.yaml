- md: "\n***Listing 2-5.*** Create a Next button, install a Tooltip and add the node\
    \ to image rendering area:\n\nfinal Node nextButton = createNextButton();\n\n\
    ...\n\n// Install tooltip\n\nTooltip t = new Tooltip(\"Next Image\");\n\nTooltip.install(nextButton,\
    \ t);\n\n// Add next button to stack pane\n\nimageArea.getChildren().add(nextButton);\n\
    \nThe following snapshots show a Next button laid out in its default location,\
    \ the center of a StackPane.\n\n***Figure 2-4.*** Snapshot of a Next button placed\
    \ in the default position.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_87_0.png)\n\
    \n***Figure 2-5.*** Snapshot of a Next button placed in the default position,\
    \ it is taken as mouse entered the button, the filled color gradient of a rectangle\
    \ is changed and the installed tooltip is popped up.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_88_0.png)\n\
    \n(Figures 2-1 to 2-5 are snapshots of applications using jdk1.7.0_25 in Windows\
    \ XP; the rest are using jdk1.8.0_66 in Windows 8.1)\n\n## 2.2 Adjust Next Button’s\
    \ Default Position in StackPane\n\nIn this section, we will demonstrate how to\
    \ place a child node of a StackPane in the desired location.\n\nA StackPane places\
    \ all its children in a stack with the center as default alignment. That is, by\
    \ default StackPane’s children overlap each other in the center of the pane. Placing\
    \ a Next button in the center of a StackPane is not feasible in our application.\
    \ Fortunately, StackPane provides two static methods:\n\n`public static void setAlignment(Node\
    \ child, Pos value)`\n\n`public static void setMargin(Node child, Insets value)`\n\
    \nallowing us to adjust individual child node’s position. The preferred position\
    \ of a Next button is on the right side of the window, within the visible boundary\
    \ of a scene. The following snippets of codes adjust the default location of a\
    \ next button.\n\n***Import Statement:***\n\n```java\nimport javafx.geometry.Insets;\n\
    import javafx.geometry.Pos;\n```\n\n***Listing 2-6.*** Use StackPane’s static\
    \ Methods setAlignment and setMargin to adjust the default position of a Next\
    \ button:\n\n```java\nStackPane.setAlignment(nextButton, Pos.CENTER_RIGHT);\n\
    StackPane.setMargin(nextButton, new Insets(8));\n```\n\nThe following snapshot\
    \ shows a Next button positioned on the right side of application window.\n\n\
    ***Figure 2-6.*** Snapshot of a Next button on the right side of window, within\
    \ the visible boundary of a scene.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_90_0.png)\n\
    \nRemember that, we set minimum size of StackPane to (0, 0) to avoid the automatic\
    \ changing of its size, by its child node ImageView. Failure to do so may lead\
