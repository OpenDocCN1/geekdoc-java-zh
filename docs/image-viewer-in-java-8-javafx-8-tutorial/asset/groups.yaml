    _STATE\\_FAILED,\n\nWORKER\\_STATE\\_READY, WORKER\\_STATE\\_RUNNING,\n\nWORKER\\\
    _STATE\\_SUCCEEDED, etc. A WorkerStateEvent occurs when\n\nthe state of a Worker\
    \ is changed.\n\nConsider our situation: a file list is created when a file is\
    \ first loaded, suppose the file list\n\ncontains one or more next file(s) to\
    \ view, then the Start Slideshow menu item is\n\nenabled, a user can start a slide\
    \ show, cancel it while the slide show is on, and later restart\n\nit again. To\
    \ fulfill this scenario, we prefer a reusable Service object to a one-time Task\n\
    \nobject.\n\n3.3.2.1 Create SlideshowService Class that Extends Service Class\n\
    \nWe need to create a class that extends Service<V> class. When a Service is started,\
    \ it\n\nexecutes a Task. The createTask method below need be overridden:\n\n protected\
    \ abstract Task<V> createTask()\n\n \n\nIn the createTask() method, the call()\
    \ method is overridden while a Task object is\n\ncreated to be returned to the\
    \ caller.\n\nThe call() method in a Task, undertakes the task of a slide show,\
    \ basically contains a\n\nwhile loop that loads images one by one until either\
    \ one of the following conditions\n\nbecomes true: there’s no more next image\
    \ in the file list, or the slide show is canceled by a\n\nuser.\n\nThe following\
    \ listing demonstrates how to create a reusable SlideshowService, a\n\nsubclass\
    \ of Service class, to carry on a slide show task."
- md: "\n***Listing 3-15. Create SlideshowService class:**\n\npackage imageviewer;\n\
    \nimport java.nio.file.Path;\n\nimport java.util.ListIterator;\n\nimport javafx.beans.property.ObjectProperty;\n\
    import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.property.SimpleStringProperty;\n\
    import javafx.beans.property.StringProperty;\n\nimport javafx.beans.value.ChangeListener;\n\
    import javafx.beans.value.ObservableValue;\n\nimport javafx.concurrent.Service;\n\
    import javafx.concurrent.Task;\nimport javafx.scene.image.Image;\n\n/**\n * File\
    \ Name: SlideshowService.java\n * (in directory: ImageViewer1.2/src/example4/imageviewer/)\n\
    \ *\n * @author Shufen Kuo\n */\npublic class SlideshowService extends Service<Void>\
    \ {\n  private ObjectProperty<Image> image;\n  private ObjectProperty<ListIterator<Path>>\
    \ iterator;\n  private StringProperty imageName;\n  private ListIterator<Path>\
    \ it;\n\n  public SlideshowService() {\n    this(new SimpleObjectProperty<ListIterator<Path>>(),\n\
    \         new SimpleObjectProperty<Image>(),\n         new SimpleStringProperty());\n\
    \  }\n\n  public SlideshowService(ObjectProperty<ListIterator<Path>> iterator,\n\
    \                          ObjectProperty<Image> image, StringProperty imageName)\
    \ {\n    this.image = image;\n    this.imageName = imageName;\n    this.iterator\
    \ = iterator;\n    iterator.addListener(new ChangeListener<ListIterator<Path>>()\
    \ {\n      @Override\n      public void changed(ObservableValue<? extends ListIterator<Path>>\
    \ o,\n                          ListIterator<Path> oldVal, ListIterator<Path>\
    \ newVal) {\n        it = newVal;\n      }\n    });\n  }\n\n  public Image getImage()\
    \ {\n    return image.get();\n  }\n\n  public void setImage(Image value) {\n \
    \   image.set(value);\n  }\n\n  public ObjectProperty<Image> imageProperty() {\n\
    \    return image;\n  }\n\n  public ListIterator<Path> getIterator() {\n    return\
    \ iterator.get();\n  }\n\n  public void setListIterator(ListIterator<Path> value)\
    \ {\n    iterator.set(value);\n  }\n\n  public ObjectProperty<ListIterator<Path>>\
    \ iteratorProperty() {\n    return iterator;\n  }\n\n  public String getImageName()\
    \ {\n    return imageName.get();\n  }\n\n  public void setImageName(String value)\
    \ {\n    imageName.set(value);\n  }\n\n  public StringProperty imageNameProperty()\
    \ {\n    return imageName;\n  }\n\n  @Override\n  protected Task<Void> createTask()\
    \ {\n    return new Task<Void>() {\n      @Override\n      protected Void call()\
    \ {\n        if (it == null) return null;\n        while (it.hasNext()) {\n  \
    \        if (isCancelled()) {\n            updateMessage(\"Cancelled\");\n   \
    \         break;\n          }\n          String url = it.next().toUri().toString();\n\
    \          setImage(new Image(url));\n          setImageName(url.substring(\n\
    \              url.lastIndexOf(\"/\") + 1).replaceAll(\"%20\", \" \"));\n    \
    \      // Pause for 3000 ms\n          try {\n            Thread.sleep(3000);\n\
    \          } catch (InterruptedException ex) {\n            if (isCancelled())\
    \ {\n              updateMessage(\"Cancelled\");\n              break;\n     \
    \       }\n          }\n        }\n        return null;\n      }\n    };\n  }\n\
    }\n\nThe following statement creates a SlideshowService object.\n\n// Create a\
    \ reusable Worker object\nfinal SlideshowService service = new SlideshowService(listIterator,\n\
    \    curImage, imageName);\n\nThree arguments are passed to the constructor of\
    \ SlideshowService class:\n\n- listIterator: Type of ObjectProperty<ListIterator<Path>>,\
    \ specifies a ListIterator that iterates the file list created when an image file\
    \ is opened from a File Chooser’s File Open Dialog.\n- curImage: Type of ObjectProperty<Image>,\
    \ binds with the image property of an ImageView object.\n- imageName: Type of\
    \ StringProperty, binds with the text property of a Text object, statusText, for\
    \ displaying image name in a status bar.\n\n## 3.3.2.2 Configure Slide Show Service\
    \ Object\n\nWe define a configureSlideshow method to do configurations. Once a\
    \ service object is created, the method is called to perform these works:\n\n\
    1. Bind the isSlideshowOn property defined in ImageViewer class with the running\
    \ property of a service. The value of isSlideshowOn property is true if and only\
    \ if the service is running.\n```java\nBooleanProperty isSlideshowOn = new SimpleBooleanProperty(false);\n\
    SlideshowService service = new SlideshowService(listIterator,\n    curImage, imageName);\n\
    isSlideshowOn.bind(service.runningProperty());\n```\n2. Register event handlers\
    \ to handle WorkerStateEvents of the following event types: WORKER_STATE_RUNNING,\
    \ WORKER_STATE_SUCCEEDED, WORKER_STATE_FAILED and WORKER_STATE_CANCELLED.\n\n\
    Here are convenience methods, defined in Service class, to register event handlers\
    \ for the mentioned event types:\n\n```java\npublic final void setOnRunning(EventHandler<WorkerStateEvent>\
    \ value)\nSet value of onRunning property, providing the implementation of handle\
    \ method which is called when Worker’s state is transited to RUNNING.\n\npublic\
    \ final void setOnSucceeded(EventHandler<WorkerStateEvent> value)\nSet value of\
    \ onSucceeded property, providing the implementation of handle method which is\
    \ called when Worker’s state is transited to SUCCEEDED.\n\npublic final void setOnFailed(EventHandler<WorkerStateEvent>\
    \ value)\nSet value of onFailed property, providing the implementation of handle\
    \ method which is called when Worker’s state is transited to FAILED.\n\npublic\
    \ final void setOnCancelled(EventHandler<WorkerStateEvent> value)\nSet value of\
    \ onCancelled property, providing the implementation of handle method which is\
    \ called when Worker’s state is transited to CANCELLED.\n```\n\n(Note: The OCR\
    \ text for the latter half became highly fragmented and repetitive in the source.\
    \ I have reconstructed the logical flow based on standard JavaFX Service patterns\
    \ and the provided snippets.)\n\n***Listing 3-16. configureSlideshow:**\n```java\n\
    /**\n * Implementation of configureSlideshow method\n */\nvoid configureSlideshow()\
    \ {\n    // If service is running, then isSlideshowOn is true\n    // otherwise,\
    \ it's false\n    \n    setOnRunning(new EventHandler<WorkerStateEvent>() {\n\
    \        @Override\n        public void handle(WorkerStateEvent event) {\n   \
    \         System.out.println(\"Service is transited to running\");\n         \
    \   lastClicked.set(NEXT);\n            prevButton.setDisable(false);\n      \
    \  }\n    });\n\n    EventHandler<WorkerStateEvent> taskDone = new EventHandler<WorkerStateEvent>()\
    \ {\n        @Override\n        public void handle(WorkerStateEvent event) {\n\
    \            if (listIterator.get().hasNext()) {\n                nextButton.setDisable(false);\n\
    \            }\n            prevButton.setDisable(true);\n        }\n    };\n\n\
    \    setOnSucceeded(taskDone);\n    setOnFailed(taskDone);\n    setOnCancelled(taskDone);\n\
    }\n```\n\n## 3.3.2.3 Implement Event Handlers of Action Events for Start Slideshow\
    \ and Stop Slideshow Items\n\nThe scenario follows the action of Start Slideshow\
    \ like this: when a user clicks the Slideshow menu item, the service is started,\
    \ its state transits from READY to SCHEDULED to RUNNING, the value of isSlideshowOn\
    \ is changed to true as soon as the state is transited to RUNNING (see here),\
    \ and Stop Slideshow item’s disable status is changed to false as a result.\n\n\
    We are using the start() method provided in Service class to start a service.\
    \ It is called from the event handler that handles action event of Slideshow menu\
    \ item. It is important to check the state of a service before invoking the start()\
    \ method, this is to assure a service is in READY state. if it is not ready, reset\
    \ it first, then start the service.\n\nHere’s the snippet of codes to do these:\n\
    \n```java\nstartSlide.setOnAction(new EventHandler<ActionEvent>() {\n    @Override\n\
    \    public void handle(ActionEvent ae) {\n        System.out.println(\"Start\
    \ Slideshow...\");\n        if (service.getState() != Worker.State.READY)\n  \
    \          service.reset(); // transit to READY\n        service.start();\n  \
    \  }\n});\n```\n\n***Listing 3-17. Implement event handlers of action events for\
    \ Start Slideshow and Stop Slideshow menu items:**\n(OCR text ends here)\n"
