    \ thus inherits all applicable features from javafx.scene.Node class.\n\nReference\
    \ to Oracle Online Documentation “JavaFX: Working with JavaFX UI Components —\
    \ Working with JavaFX Charts”:\nhttp://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm\n\
    \n## MediaView Class for Playing Media\n\nThe MediaView class which extends javafx.scene.Node\
    \ is used along with MediaPlayer and Media classes to play media in your JavaFX\
    \ applications. All media related classes are resides in javafx.scene.media package.\n\
    \nReference to Oracle Online Documentation “JavaFX: Incorporating Media Assets\
    \ Into JavaFX Applications”:\nhttp://docs.oracle.com/javase/8/javafx/media-tutorial/\n\
    \n## JavaFX Fundamental UI Components\n\nIn addition to the Essence of JavaFx\
    \ described above, JavaFX provides fundamental UI components, reside in javafx.scene.control\
    \ package, and are derived from javafx.scene.control.Control class; they are called\
    \ UI controls often.\n\nHere are available UI controls, the ones that are not\
    \ marked with asterisk (\\*) have their resemblant counterparts in Swing:\n\n\
    - Label, Button, RadioButton, ToggleButton\n- CheckBox, ChoiceBox\n- ComboBox,\
    \ ListView, TableView\n- TextField, TextArea, PasswordField, HTMLEditor(*)\n-\
    \ ScrollBar, ScrollPane, Slider, ProgressBar, ProgressIndicator(*)\n- ToolBar\n\
    - MenuBar, MenuButton, SplitMenuButton(*)\n- ColorPicker, DatePicker(*), Separator,\
    \ Pagination(*), SplitPane\n- TabPane, TitledPane(*), Accordion(*), TreeView,\
    \ TreeTableView(*)\n- Hyperlink(*)\n\nThe following UI components are usually\
    \ described in the same category with the above UI controls.\n\nTooltip resides\
    \ in javafx.scene.control package, but is derived from javafx.scene.control.PopupControl\
    \ class.\n\nMenuItem, Menu, CheckMenuItem, RadioMenuItem resides in javafx.scene.control\
    \ package. The MenuItem which extends java.lang.Object is the base class of the\
    \ rest three.\n\nFileChooser resides in javafx.stage package and extends java.lang.Object.\n\
    \nReference to Oracle Online Documentation “JavaFX: Working with JavaFX UI Components”:\n\
    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/ui_controls.htm\n\
    \n***Chapter 1***\n\n## Basic Image Viewer\n\n### —Developing Image Viewer V1.0\n\
    \n### Preface\n\nIn this chapter, we’ll illustrate usages of JavaFX APIs by means\
    \ of step-by-step development of an image viewing application, ImageViewer V1.0.\
    \ From detailed descriptions and well-documented example codes excerpted from\
    \ ImageViewer V1.0x, you will become familiar with fundamental capabilities of\
    \ JavaFX library recounted in the Summary section.\n\nThe complete development\
    \ process of ImageViewer V1.0 is characterized by the following steps:\n\n1.1\
    \ Create ImageViewer Class as Subclass of Application\n1.1.1 JavaFX Application\
    \ Thread vs. Java Launcher Thread\n1.1.2 Catch Resize Event of Image Rendering\
    \ Area\n1.2 Create Menu Bar\n1.2.1 Add File Menu to Menu Bar\n1.2.2 Select Image\
    \ File from File Open Dialog and Display Image on StackPane\n1.3 Create Option\
    \ Menu and View Submenu\n1.3.1 Create Toggle Group, Radio Menu Items and Add Listener\
    \ for selectedToggle Property\n1.4 Implement Fit Width, Fit Height and Original\
    \ Size Viewing Options\n1.4.1 Approach One: Bind ImageView‘s fitWidth/fitHeight\
    \ Properties to Scene‘s width/height Properties Respectively\n1.4.1.1 Implement\
    \ Fit Width Viewing Option\n1.4.1.2 Implement Fit Height Viewing Option\n1.4.1.3\
    \ Implement Original Size Viewing Option\n1.4.1.4 Complete Source Codes of ImageViewer\
    \ Class\n1.4.2 Approach Two: Change Values for fitWidth Property and fitHeight\
    \ property\n1.4.2.1 Catch Resize Event of Scene to Adjust Viewing Size of Image\n\
    1.4.2.2 Complete Source Codes of ImageViewer Class\n1.5 Summary\n\n## **1.1 Create\
    \ ImageViewer Class as Subclass of Application**\n\nThe graphical user interfaces\
    \ of a JavaFX application are managed in hierarchical tree structure, called a\
    \ scene graph. In ImageViewer application, we employ a BorderPane as the root\
    \ node of a scene graph, and place a StackPane in the center of BorderPane as\
    \ image rendering area. Both BorderPane and StackPane are among build-in layout\
    \ panes, reside in javafx.scene.layout package and are direct subclasses of javafx.scene.layout.Pane\
    \ class.\n\nBorderPane class allows you to create graphical user interfaces featuring\
    \ classic look-and-feel of main windows. In the next section you’ll see a menu\
    \ bar added at the top of BorderPane, and in the later chapter a status bar added\
    \ at the bottom.\n\nStackPane class lays out its children in a stack, placing\
    \ the later created child at the top of previous one. In ImageViewer application,\
    \ since only one image is viewed at one time, the StackPane has only one child.\
    \ If the size of an image is smaller than the size of StackPane, the image is\
    \ placed in the center of StackPane. If the size of an image is larger than that\
    \ of StackPane, StackPane is expanded automatically to accommodate the whole image,\
    \ and if the viewing space in the application window is not larger enough, only\
    \ center portion of the image is visible by default. In later section, we’ll demonstrate\
    \ how to avoid a StackPane being resized by its content, see here.\n\nA Scene\
    \ object is created as the container of a scene graph, given a root node as parameter.\
    \ In ImageViewer application, the root node is a BorderPane, and initial width\
    \ and height of the Scene object is set to 600 pixels and 400 pixels. Both BorderPane\
    \ and StackPane are resizable layout panes; therefore, if the application window\
    \ is dynamically resized by a user, the scene is resized and a resize event is\
    \ passed on to its root node, resulting in re-calculation of the size of image\
    \ rendering area accordingly.\n\nYou place a scene on a Stage to make it alive,\
    \ using the setScene method defined in Stage class. Stage is a direct subclass\
    \ of javafx.stage.Window; it is the top-level window of a JavaFX application.\n\
    \nJavaFX system creates a Stage object, referred as primary stage, and passed\
    \ to the start method, an abstract method defined in Application class. Developers\
    \ can construct additional Stage objects as needed.\n\nThe following codes demonstrate\
    \ how to create ImageViewer class as a direct subclass of Application, and override\
    \ the start method. Here are codes:\n\n***Listing 1-1. Create ImageViewer class\
    \ which extends Application, override start method, create BorderPane as the root\
    \ node of a scene, and place StackPane in the center of BorderPane as image rendering\
    \ area:**\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * This\
    \ application creates a BorderPane as root node of a scene, and\n * add a StackPane\
    \ in the center of BorderPane\n * The initial size of the scene is set to 600\
    \ by 400\n * The size of StackPane will be automatically set to fit the size of\
    \ scene\n * StackPane will be resized when window size is adjusted by a user\n\
    \ */\npublic class ImageViewer extends Application {\n\n    @Override\n    public\
    \ void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.setCenter(imageArea);\n\
    \        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageViewer V1.0\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n**1.1.1 JavaFX Application Thread vs. Java Launcher Thread**\n\
    \nApplication class is the entry point of a JavaFX application. It defines the\
    \ following significant methods:\n\npublic void init() throws Exception\n\npublic\
    \ abstract void start(Stage primaryStage) throws Exception\n\npublic void stop()\
    \ throws Exception\n\nThe init method, which does nothing, is called from Java\
    \ launcher thread. While the start method, an abstract and must be overridden,\
    \ is called from JavaFX Application Thread after init method has returned. If\
    \ you need do some initial works before start method, you can do that by overriding\
    \ init method; however it is crucial to notice that nodes that are members of\
    \ a live scene must be accessed from JavaFX Application Thread.\n"
