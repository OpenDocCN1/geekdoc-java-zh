    \nLinearGradient and Color, reside in javafx.scene.paint package, are two of\n\
    \ndirect subclasses of Paint class. \n\n(See section Paint Background and Border\
    \ of Shape)\n\nCycleMethod and Stop, reside in javafx.scene.paint package, are\
