    import javafx.scene.paint.Stop;\nimport javafx.scene.shape.Polygon;\nimport javafx.scene.shape.Rectangle;\n\
    import javafx.scene.Node;\nimport javafx.event;\n```\n    Group buttonGroup =\
    \ new Group();\n    buttonGroup.setCursor(Cursor.OPEN_HAND);\n\n    // 注册鼠标点击事件处理器\n\
