    import javafx.application.Platform;\n\nimport javafx.beans.value.ChangeListener;\n\
    import javafx.beans.value.ObservableValue;\nimport javafx.event.ActionEvent;\n\
    import javafx.event.EventHandler;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Menu;\n\
    import javafx.scene.control.MenuBar;\nimport javafx.scene.control.MenuItem;\n\
    import javafx.scene.control.RadioMenuItem;\nimport javafx.scene.control.Toggle;\n\
    import javafx.scene.control.ToggleGroup;\nimport javafx.scene.image.Image;\nimport\
    \ javafx.scene.image.ImageView;\nimport javafx.scene.layout.BorderPane;\nimport\
    \ javafx.scene.layout.StackPane;\nimport javafx.stage.FileChooser;\nimport javafx.stage.Stage;\n\
    \n/**\n * File Name: ImageViewer.java\n * (in directory: ImageViewer1.0/src/example3/imageviewer/)\n\
    \ * This application creates a BorderPane as root node of a scene, and\n * add\
    \ a StackPane in the center of BorderPane\n * The initial size of the scene is\
    \ set to 600 by 400\n * The size of StackPane will be automatically set to fit\
    \ the size of scene\n * StackPane will be resized when window size is adjusted\
    \ by a user\n *\n * Add a menu bar in the top of BorderPane\n * Create File Menu,\
    \ and using FileChooser's Open Dialog to\n * select an image file, load and display\
    \ the image in image rendering area\n *\n * Create Option menu contains View submenu,\
    \ let a user chooses image viewing\n * criteria: Fit Width, Fit Height, or the\
    \ default option Original Size.\n *\n * @author Shufen Kuo\n */\npublic class\
    \ ImageViewer extends Application {\n    @Override\n    public void start(final\
    \ Stage stage) {\n        BorderPane rootPane = new BorderPane();\n        StackPane\
    \ imageArea = new StackPane();\n        // Set min size for StackPane to avoid\
    \ resizing\n        // when loading large size image\n        imageArea.setMinSize(0,\
    \ 0);\n        rootPane.setCenter(imageArea);\n        Scene scene = new Scene(rootPane,\
    \ 600, 400);\n        imageArea.widthProperty().addListener(new ChangeListener<Object>()\
    \ {\n            public void changed(ObservableValue o, Object oldVal, Object\
    \ newVal) {\n                System.out.format(\"imageArea width changed from\
    \ %.1f to %.1f%n\",\n                        oldVal, newVal);\n            }\n\
    \        });\n        imageArea.heightProperty().addListener(new ChangeListener<Object>()\
    \ {\n            public void changed(ObservableValue o, Object oldVal, Object\
    \ newVal) {\n                System.out.format(\"imageArea height changed from\
    \ %.1f to %.1f%n\",\n                        oldVal, newVal);\n            }\n\
    \        });\n\n        // Add menu bar\n        MenuBar menuBar = new MenuBar();\n\
    \        Menu menuFile = new Menu(\"File\");\n        MenuItem load = new MenuItem(\"\
    Load\");\n        MenuItem exit = new MenuItem(\"Exit\");\n        menuFile.getItems().addAll(load,\
    \ exit);\n        menuBar.getMenus().add(menuFile);\n        rootPane.setTop(menuBar);\n\
    \        // Add action for exit menu item\n        exit.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n            @Override\n            public void handle(ActionEvent e) {\n\
    \                Platform.exit();\n            }\n        });\n        // Create\
    \ a file chooser\n        final FileChooser fileChooser = new FileChooser();\n\
    \        fileChooser.setTitle(\"Open an Image File\");\n        // Create image\
    \ view, add to image area\n        final ImageView imageView = new ImageView();\n\
    \        imageArea.getChildren().add(imageView);\n        // Add action for menu\
    \ item Load\n        load.setOnAction(new EventHandler<ActionEvent>() {\n    \
    \        @Override\n            public void handle(ActionEvent e) {\n        \
    \        // Open FileChooser dialog\n                File file = fileChooser.showOpenDialog(stage);\n\
    \                if (file != null) {\n                    String url = file.toURI().toString();\n\
    \                    Image image = new Image(url);\n                    imageView.setImage(image);\n\
    \                }\n            }\n        });\n\n        // Create Option menu\n\
    \        Menu menuOption = new Menu(\"Option\");\n        // Create toggle group\n\
    \        final ToggleGroup groupOption = new ToggleGroup();\n        // Create\
    \ radio menu items\n        final RadioMenuItem fitWidth = new RadioMenuItem(\"\
    Fit Width\");\n        fitWidth.setToggleGroup(groupOption);\n        final RadioMenuItem\
    \ fitHeight = new RadioMenuItem(\"Fit Height\");\n        fitHeight.setToggleGroup(groupOption);\n\
    \        final RadioMenuItem original = new RadioMenuItem(\"Original Size\");\n\
    \        original.setToggleGroup(groupOption);\n        // Add listener for toggle\
    \ group\n        groupOption.selectedToggleProperty().addListener(new ChangeListener<Toggle>\n\
    \            public void changed(ObservableValue<? extends Toggle> ov,\n     \
    \               Toggle old_toggle, Toggle new_toggle) {\n                if (groupOption.getSelectedToggle()\
    \ != null) {\n                    RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\n\
    \                    if (choiceItem == fitWidth) {\n                        System.out.println(\"\
    fitwidth\");\n                    } else if (choiceItem == fitHeight) {\n    \
    \                    System.out.println(\"fitheight\");\n                    }\
    \ else {\n                        System.out.println(\"original size\");\n   \
    \                 }\n                }\n            }\n        );\n        //\
    \ Create View submenu for Option menu\n        Menu menuView = new Menu(\"View\"\
    );\n        menuView.getItems().addAll(fitWidth, fitHeight, original);\n\n   \
    \     // Set Original Size as default choice\n        original.setSelected(true);\n\
    \        // Add option menu to menu bar\n        menuOption.getItems().add(menuView);\n\
    \        menuBar.getMenus().add(menuOption);\n        stage.setTitle(\"ImageViewer\
    \ V1.0\");\n        stage.setScene(scene);\n        stage.show();\n    }\n\n \
    \   public static void main(String[] args) {\n        launch(args);\n    }\n}\n\
