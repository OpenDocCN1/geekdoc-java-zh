    2.1.10 为 Node 安装工具提示（Tooltip）


    2.2 在 StackPane 中调整“下一页”按钮的默认位置


    2.3 添加“上一页”按钮并调整其在 StackPane 中的位置


    2.4 实现鼠标点击事件处理程序


