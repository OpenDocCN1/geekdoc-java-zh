    参考 Oracle 在线文档“使用 CSS 为 JavaFX 应用程序皮肤”：


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm


    ## 使用 FXML 创建用户界面


    FXML 是一种符合 XML（可扩展标记语言）格式的标记语言，它带有额外的规则，用于创建 JavaFX 应用程序的用户界面。考虑到手动编写 FXML 容易出错，一种可行的方法是通过
    GUI 构建器生成 FXML 代码。


    在系列丛书中，我们介绍了一个实用的应用程序 JFXDrawTools，它是一种专门用于创建派自 `Shape` 的子类实例的 GUI 构建器。用户可以交互式地创建一个草图（无论是
    `Shape` 还是 `ImageView`），操纵其属性，并将编辑结果保存为 FXML 格式的文件。这些文件以后可以重新加载回来以继续编辑过程，或者被其他
    JavaFX 应用程序动态加载。


    将应用程序的 GUI（视图 View）与其业务逻辑（模型 Model）分离被认为是一种良好的编程实践。FXML 文件表示视图，而控制器（controller）是一个在视图和模型之间传递信息的
    Java 类。使用 FXML 构建 GUI 能够让应用程序开发者有效地采用 MVC（模型-视图-控制器）架构。


    参考 Oracle 在线文档“JavaFX: 精通 FXML”：


    http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html


    ## 属性与绑定的吸引力能力


    JavaFX 中属性（Properties）的概念遵循在 JavaBeans 组件中引入的设计规范，它通常与绑定（Binding）机制配合工作，整体为各种编程需求提供了强大且优雅简洁的解决方案。


    在系列丛书中介绍的 JFXDrawTools 应用程序中，我们充分演示了属性和绑定的用法。在属性窗口的实现中，使用了合适的 UI 控件（如文本字段 text
    field、选择框 choice box、组合框 combo box 等）查看相关对象的属性。绑定机制被用于将 UI 控件与其对象的相应属性进行双向链接，这种关系在属性窗口即将显示时被建立好。当用户更改
    UI 控件中显示的数据时，更改会立即反映到相关对象的相应属性上。


    参考 Oracle 在线文档“JavaFX 属性与绑定教程”：


    http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html


    ## 变换与过渡的复杂机制


    JavaFX 内置的节点变换（transformations）能力对于开发图形包，如图形编辑器、绘图工具、图像查看器、GUI 构建器等非常方便。


    这里是处理变换的类：Translate（移动）、Rotate（旋转）、Scale（缩放）和 Shear（变形）。它们都派自 `Transform` 类并位于
    `javafx.scene.transform` 包中。


    JavaFX 过渡（transitions）为创建动画提供了简洁的方法。许多应用程序都需要动画功能，这里是一些案例：在警报情况下引起注意、在删除操作期间将对象放入回收箱、在数据加载期间指示中间状态……


    在系列丛书中介绍的 ImageViewer 应用程序中，我们将 `FadeTransition` 和 `ParallelTransition` 应用到幻灯片功能的图像对象上，同时淡入新图像并淡出旧图像。


    这里是处理变换的类：FadeTransition、ParallelTransition、ScaleTransition、TranslateTransition、FillTransition、RotateTransition、SequentialTransition、PauseTransition。它们都派自
    `Transition` 类并位于 `javafx.animation` 包中。


    参考 Oracle 在线文档“JavaFX 变换、动画与视觉效果”：


    http://docs.oracle.com/javase/8/javafx/animation.html


    ## 2D 原始图形与文本是 JavaFX


    JavaFX 提供了一个扩展自 `Node` 的 `Shape` 类，用于绘制 2D 原始图形。以下是派自 `Shape` 的类：

    - Arc（弧）

    - Circle（圆）

    - CubicCurve（三次塞尔曲线）

    - Ellipse（椭圆）

    - Line（直线）

    - Polygon（多边形）

    - Polyline（折线）

    - QuadCurve（二次曲线）

    - Rectangle（矩形）

    - Text（文本）


    所有其他类都位于 `javafx.scene.shape`。请注意，位于 scene 包中的 `Text` 类为文本开发提供了支持。可以将对象放置在布局面板中利用这些功能，并使用
    CSS 自定义呈现样式。


    参考 Oracle 在线文档“在 JavaFX 中使用文本”：


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text.html


    ## 其他缩短开发时间的显著能力


    ### 用于加载和显示图片的 ImageView


    扩展自 `javafx.scene.Node` 的 `ImageView` 类与 `Image` 类配合使用，用于加载和显示图像。JavaFX 还提供了对位图图像进行操作的
    API，`PixelReader` 是从 `Image` 对象读取像素的接口，而 `PixelWriter` 定义了向 `Image` 对象写入像素。所有这些都位于
    `javafx.scene.image` 包中。


    参考 Oracle 在线文档“使用图像操作”：


    http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.html


    ### 用于管理网页的 WebView


    JavaFX 架构中嵌入了一个网络引擎，并提供了一组位于 `javafx.scene.web` 包中的 API，用于开发带有浏览器的应用程序。要查看网页，首先你需要创建一个扩展自
    `javafx.scene.Parent` 并继承所有节点特性的 `WebView` 对象，然后获取与它关联的 `WebEngine`。`WebEngine`
    提供了与操作网页相关的方法，例如：通过给定的 URL 或页面内容加载/显示网页、访问 WebEngine 为加载的网页创建的文档对象模型 (DOM)、处理从
    JavaScript 发起的各种事件……


    参考 Oracle 在线文档“向 JavaFX 应用程序中添加 HTML 内容”：


    http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html


    ### 用于编辑 HTML 页面的 HTMLEditor


    完整的 HTML 编辑能力来自 `HTMLEditor` 类，它扩展自 `javafx.scene.control.Control`，位于 `javafx.scene.web`
    包。要将 HTML 编辑器嵌入你的 JavaFX 应用程序中，你只需要创建一个 `HTMLEditor` 实例，将其添加到场景图中，就可以与用户交互了。以下两个方法对于获取和设置编辑器的
    HTML 内容非常有用：

    - getHtmlText()

    - setHtmlText(java.lang.String htmlText)


    与处理多行纯文本的类似 TextArea 不同，HTMLEditor 格式化符合 HTML 语法的文本。HTML 编辑器在软件各个领域被广泛需要，例如：博客作者写文章发布（内容管理系统）、电子邮件用户编写邮件（消息系统）、在线卖家为列表准备产品描述（电子商务管理系统）……等。


    参考 Oracle 在线文档“使用 JavaFX UI 组件——HTML 编辑器”：


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.html


    ## 用于渲染数据的图表组件


    以下类位于 `javafx.scene.chart` 包中，用于绘制


    '
