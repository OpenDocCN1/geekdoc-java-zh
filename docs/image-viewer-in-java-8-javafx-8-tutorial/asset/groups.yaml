    On March 18, 2014, JavaFX 8 released as part of Java™ SE Development Kit 8 (JDK
    8),


    a major feature release.


    As of the publishing of this book on March, 2016, the latest JDK releases are:


    JDK 8u66 on October 20, 2015, and JDK 8u72 on January 2016.


    The schedule of general availability (GA) for JDK 9 is March 23rd, 2017.'
- md: "\n## Prerequisite\n\nJavaFX applications presented in this book using APIs\
    \ provided in JavaFX packages to build GUIs. Knowledge of Swing packages is not\
    \ a must, however, readers must be familiar with the basics of Java programming\
    \ language. If you are new to Java, visit this website, http://docs.oracle.com/javase/tutorial/index.html,\
    \ to obtain preliminary knowledge of Java technologies. Read Oracle Java online\
    \ documentation in this order:\n\n1. Getting Started with Simple Java Application\
    \ “Hello World!” and Installations:\nVisit http://docs.oracle.com/javase/tutorial/getStarted/index.html\n\
    \n2. Concepts and features of the Java Programming Language:\nVisit http://docs.oracle.com/javase/tutorial/java/index.html\n\
    \n3. Java Collections Framework:\nVisit http://docs.oracle.com/javase/tutorial/collections/index.html\n\
    \n4. Essential Java Classes:\nVisit http://docs.oracle.com/javase/tutorial/essential/index.html\n\
    \n## A Glimpse of JavaFX Applications\n\nThe following example is for readers\
    \ who are new to JavaFX to have a quick preview of how to create a JavaFX application.\n\
    \nTo get started, you create a class that extends javafx.application.Application,\
    \ the entry point of JavaFX applications, and override the start method that is\
    \ abstract must be overridden. Here’s what a typical start method looks like:\n\
    \n```java\npackage imageviewer;\n\nimport javafx.application.Application;\nimport\
    \ javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
    \ Shufen Kuo\n */\npublic class ImageViewer extends Application {\n    @Override\n\
    \    public void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.getChildren().add(imageArea);\n\
    \        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageViewer V1.0\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n## Scene and Stage\n\nThere are two important classes, Scene\
    \ and Stage, appears within the start method. In general, the main task is to\
    \ create graphical user interfaces (GUIs) managed in hierarchical tree structure\
    \ called a scene graph, associate the root node of the scene graph to a Scene\
    \ object, then place the scene on a Stage object which stands for the top-level\
    \ container of the JavaFX application, acting as the window of the scene graph\
    \ to interact with application users.\n\nFollowing snapshot gives you an initial\
    \ idea of how the GUIs of a JavaFX application we are going to build looks like:\n\
    \n***Figure 1.*** Snapshot of a JavaFX application.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_23_0.png)\n\
    \n## Nodes\n\nJavaFX introduces a basic class, javafx.scene.Node which extends\
    \ java.lang.Object and provides common properties and methods useful to all available\
    \ user interfaces. Very often we are using the term nodes to reference GUIs.\n\
    \nA scene graph may contain nodes of sorts. A node is either a parent (a node\
    \ with children) or a leaf (a node without children); each node can have only\
    \ one parent, and the root node has no parent. All nodes in a scene graph are\
    \ derived from javafx.scene.Node class. For quickly catch the essential about\
    \ the types of nodes in a scene graph, we’ll differentiate them by the ability\
    \ to add children or not.\n\nYou may add children to these nodes:\n\nThe following\
    \ classes are frequently employed as parent nodes: Group, Pane, and build-in layout\
    \ panes (they are direct subclasses of Pane). Typically, you call the getChildren()\
    \ method to obtain a list of type ObservableList<Node> (it is a subinterface of\
    \ java.util.List), then you use the basic utilities, defined in Collection interface,\
    \ which java developers are familiar with, to manipulate the content of the list.\n\
    \nYou may not add children to these nodes:\n\nThe following classes are always\
    \ employed as leaf nodes: Canvas, ImageView, MediaView, and all direct subclasses\
    \ of Shape such as Rectangle, Circle, Ellipse, etc.\n\n## JavaFX and Swing\n\n\
    Now, here is an intriguing issue. For years Java developers have been building\
    \ GUIs of Java applications using Swing APIs, the GUI Components of Java Foundation\
    \ Classes (JFC), why do we need JavaFX in addition to Swing?\n\nIf you possess\
    \ multitudes of legacy codes written in Swing and would like to incorporate JavaFX\
    \ features into Swing codes, JDK 8 provides mechanism to do so, and vice versa,\
    \ you can include Swing components in JavaFX applications.\n\nThe topic of JavaFX-Swing\
    \ Interoperability is not covered in this book. If you are interested in this\
    \ topic, visit Oracle Online Documentation “JavaFX: Interoperability — JavaFX-Swing\
    \ Interoperability” at here: http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm\n\
    \nJavaFX is the next generation of Java GUIs. To account for the benefits of employing\
    \ JavaFX capabilities, besides the Interoperability between JavaFX and Swing,\
    \ we present the significant features of JavaFX in the section below.\n\n## Essence\
    \ of JavaFX\n\nJavaFX not only allows you to create applications rapidly, but\
    \ also contains distinctive abilities.\n\n## Build-in Layout Panes\n\nJavaFX’s\
    \ layout panes are containers that automatically manage the size and position.\
    \ There are 8 types:\n\n- BorderPane: Places nodes in five regions: top, bottom,\
    \ left, right, and center.\n- HBox: Places nodes in one row (horizontally).\n\
    - VBox: Places nodes in one column (vertically).\n- GridPane: Places nodes in\
    \ a grid with multiple rows and columns.\n- StackPane: Places all nodes each other\
    \ with center as default.\n- FlowPane: Places nodes in rows (horizontal) at the\
    \ boundary of container’s width, or in columns (vertical) at the boundary of container’s\
    \ height.\n- TilePane: Similar to FlowPane except each cell in the grid has the\
    \ same size.\n- AnchorPane: Places nodes relative to specified anchor points:\
    \ top, right, bottom, and left.\n\nReference to Oracle Online Documentation “Working\
    \ with Layouts in JavaFX”: http://docs.oracle.com/javase/8/javafx/layout-tutorial.html\n\
    \n## Customization using CSS\n\nJavaFX allows the usage of CSS (Cascading Style\
    \ Sheet) to describe the presentation styles of application’s interfaces. Defining\
    \ the presentation attributes—such as color, font, margins, padding, width, height,\
    \ lines, background images, etc., using CSS, separated from application codes,\
    \ reveals significant conveni in many ways:\n\n- Customization from software provider’s\
    \ side: Applications compiled from the same set of codes can bear a variety of\
    \ presentation styles, each of them complying with different customer’s requirements.\n\
    - Customization from application user’s side: Even after the software has been\
    \ released, in case application users have preferences for the look of UIs, it\
    \ is also applicable to modify the presentation attributes, defined in CSS files,\
    \ at customer site.\n- Benefits for designers of presentation styles: The separation\
    \ of application codes from definitions of presentation styles improves readability\
    \ of codes and simplifies the tasks for graphics designers by focusing on dealing\
    \ with CSS only.\n- Benefits for software developers: During the course of testing,\
    \ developers may frequently change style attributes defined in CSS file in order\
    \ to evaluate the variety looks of GUIs. If the application has to quit and restart\
    \ again for each change, it is a very tiresome task. To facilitate this evaluation\
    \ process, the best strategy is to design a makeshift Load button, and whenever\
    \ any style attribute is changed, simply click on the button to re-load the CSS,\
    \ there is no need to quit the application and restart it, thus saving tremendous\
    \ time spending on testing.\n\nSimilarity between CSS in JavaFX and CSS in HTML:\
    \ The syntax of CSS in JavaFX is same as that of CSS in HTML, thus any designer\
    \ has experience on CSS for browsers can do the styling for JavaFX application’s\
    \ UIs with little learning effort.\n"
  mdcn: "\n\n## 前提条件\n\n本书介绍的 JavaFX 应用使用 JavaFX 包提供的 API 来构建图形用户界面（GUI）。虽然不需要熟悉 Swing\
    \ 包，但读者必须熟悉 Java 编程语言的基础知识。如果你是 Java 初学者，请访问此网站 http://docs.oracle.com/javase/tutorial/index.html\
    \ 获取 Java 技术的初步知识。请按照以下顺序阅读 Oracle Java 在线文档：\n\n1.  从简单的 Java 应用程序“Hello World!”和安装开始：\n\
    \    访问 http://docs.oracle.com/javase/tutorial/getStarted/index.html\n\n2.  Java\
    \ 编程语言的各种概念和特性：\n    访问 http://docs.oracle.com/javase/tutorial/java/index.html\n\
    \n3.  Java 集合框架：\n    访问 http://docs.oracle.com/javase/tutorial/collections/index.html\n\
    \n4.  Java 核心类：\n    访问 http://docs.oracle.com/javase/tutorial/essential/index.html\n\
    \n## JavaFX 应用概览\n\n以下示例是为 JavaFX 初学者准备的，让他们快速预览如何创建一个 JavaFX 应用程序。\n\n要开始学习，你需要创建一个扩展\
    \ `javafx.application.Application` 的类，这是 JavaFX 应用程序的入口点，并重写抽象的 `start` 方法。以下是一个典型的\
    \ `start` 方法示例：\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
    \ Shufen Kuo\n */\npublic class ImageViewer extends Application {\n    @Override\n\
    \    public void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.getChildren().add(imageArea);\n\
    \        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageViewer V1.0\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n## Scene（场景）与 Stage（舞台）\n\n在 `start` 方法中有两个重要的类：`Scene` 和 `Stage`。通常，主要任务是在名为“场景图”（scene\
    \ graph）的分层树形结构中创建的图形用户界面（GUI），将场景图的根节点关联到 `Scene` 对象，然后将场景放置在 `Stage` 对象上。`Stage`\
    \ 代表 JavaFX 应用程序的顶层容器，充当场景图的窗口，与应用程序用户交互。\n\n接下来的快照让你对我们将构建的 JavaFX 应用的 GUI 外观有一个初步了解：\n\
    \n***图 1.*** JavaFX 应用的快照。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_23_0.png)\n\
    \n## Nodes（节点）\n\nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object`，并为所有可用用户界面提供了通用的属性和方法。我们经常使用“节点”一词来指代\
    \ GUI。\n\n场景图可能包含各种节点。节点要么是父节点（拥有子节点的节点），要么是叶子节点（没有子节点的节点）；每个节点只能有一个父节点，而根节点没有父节点。场景图中的所有节点都派自\
    \ `javafx.scene.Node` 类。为了快速掌握场景图中节点类型的本质，我们将根据其是否具有添加子节点的能力来区分它们。\n\n你可以向这些节点添加子节点：\n\
    \n以下类被频繁用作父节点：`Group`、`Pane` 以及内置布局面板（它们是 `Pane` 的直接子类）。通常，你调用 `getChildren()`\
    \ 方法来获取类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用 Java 开发者所熟悉的\
    \ `Collection` 接口中定义的各种工具类来操作列表内容。\n\n你不能向这些节点添加子节点：\n\n以下类始终被用作叶子节点：`Canvas`、`ImageView`、`MediaView`\
    \ 以及 `Shape` 的所有直接子类，如 `Rectangle`、`Circle`、`Ellipse` 等。\n\n## JavaFX 与 Swing\n\
    \n现在，这里有一个有趣的问题。多年来，Java 开发者一直使用 Swing API（Java 基础类 JFC 的 GUI 组件）来构建 Java 应用程序的\
    \ GUI，为什么我们在 Swing 之外还需要 JavaFX 呢？\n\n如果你拥有大量使用 Swing 编写的遗留代码并希望将 JavaFX 特性整合到\
    \ Swing 代码中，JDK 8 提供了机制；相反，你也可以将 Swing 组件包含在 JavaFX 应用中。\n\n本书未涵盖 JavaFX-Swing\
    \ 互操作性（Interoperability）主题。如果你对此主题感兴趣，请访问 Oracle 在线文档“JavaFX: Interoperability\
    \ — JavaFX-Swing Interoperability”：http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm\n\
    \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节介绍了\
    \ JavaFX 的重要特性。\n\n## JavaFX 的本质\n\nJavaFX 不仅允许你快速创建应用程序，还包含独特的能力。\n\n## 内置布局面板\n\
    \nJavaFX 的布局面板是自动管理尺寸和位置的容器。共有 8  类型：\n\n- BorderPane: 将节点放在五个区域：顶部、底部、左侧、右侧和中心。\n\
    - HBox: 将节点放置在一行中（水平方向）。\n- VBox: 将节点放置在一列中（垂直方向）。\n- GridPane: 将节点放置在多行多列的网格中。\n\
    - StackPane: 将节点堆叠在一起，默认居中对齐。\n- FlowPane: 在容器宽度边界内行排列（水平），或在高度边界内列排列（垂直）。\n-\
    \ TilePane: 类似于 FlowPane，但网格中的每个单元大小相同。\n- AnchorPane: 相对于指定的锚点（顶、右、底、左）放置节点。\n\
    \n参考 Oracle 在线文档“Working with Layouts in JavaFX”：http://docs.oracle.com/javase/8/javafx/layout-tutorial.html\n\
    \n## 使用 CSS 自\n\nJavaFX 允许使用 CSS（层叠样式表）描述界面的形式。使用 CSS 定义表现属性（如颜色、字体、外边距、内边距、宽度、高度、线条、背景图像等）在许多方面提供了巨大的便利：\n\
    \n- 软件提供端的自定义：从同一组代码编译的应用程序可以采用各种样式，以满足不同的客户需求。\n- 应用程序用户端的自定义：即使在软件发布后，如果应用程序用户对外观有偏好，也可以在客户现场修改在\
    \ CSS 文件中定义的表现属性。\n- 样式设计者的利益：应用程序代码与样式定义的分离提高了代码的可读性，并让图形设计师专注于处理 CSS，简化了任务。\n\
    - 软件开发者的利益：在测试过程中，开发者可能会频繁更改 CSS 文件中定义的样式属性以评估各种 GUI 外观。如果每次更改都要退出并重启应用程序，将是一项非常痛苦的任务。为了方便这一评估过程，最佳策略是设计一个临时的加载按钮，每当任何样式属性更改时，只需点击按钮重新加载\
    \ CSS，无需退出并重启应用程序，从而节省大量的测试时间。\n\nJavaFX CSS 与 HTML CSS 的相似性：JavaFX 中的 CSS 语法与\
    \ HTML 中的 CSS 相同，因此任何具有浏览器 CSS 经验的设计师都能通过极少的学习成本为 JavaFX 应用的 UI 进行样式设计。\n\n"
