    \ then use the basic utilities, defined in\n\nCollection interface, to add a series\
    \ of x and y coordinates, stored in an array of\n\nDouble value, to the list,\
    \ representing points of a Polygon. \n\n(See sections: Use Shape Class for Rendering\
