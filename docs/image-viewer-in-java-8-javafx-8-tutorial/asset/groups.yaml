    \nTooltip class, resides in javafx.scene.control package and extends\njavafx.scene.control.PopupControl\
    \ class, is one of fundamental UI components for\nshowing help information about\
    \ a node when mouse hovers on it.\n\nIf a node is one of UI controls such as a\
    \ Button, then you can set value of tooltip\nproperty, defined in javafx.scene.control.Control\
    \ class, for the node. Here’s the\nsetTooltip method:\n\n```java\npublic final\
    \ void setTooltip(Tooltip value)\n```\n\nSince the Next button is a custom-made\
    \ node acting like a button, not derived from\njavafx.scene.control.Control class,\
    \ we’ll use install method, provided in Tooltip\nclass, to associate a Tooltip\
    \ with the Next button. Here’s the install method:\n\n```java\npublic static void\
    \ install(Node node, Tooltip t)\n```\n"
  mdcn: "\n矩形形状四个角圆弧的高度和宽度直径。它们的默认值为 0.0。\n\n下图展示了如何设置 `arcHeight` 和 `arcWidth` 属性的数值来渲染圆矩形。圆和椭圆与圆矩形角的圆弧重叠，是为了方便比较。\n\
    \n***图 2-2.*** 在矩形角放置圆和椭圆的圆矩形插图快照。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_81_0.png)\n\
    \n## 2.1.6 使用 **Polygon**（多边形）形状作为 **Next** 图标的视觉标识\n\n不再使用图像作为下一个按钮的视觉标识，而是实例化了一个箭头形状的\
    \ Polygon。使用 `getPoints()` 方法获取一个类型为 `ObservableList<Double>` 的列表，然后使用 `Collection`\
    \ 接口中定义的set工具类来操作列表内容。一组存储在 `Double` 类型值数组中的 x 和 y 坐标被添加到列表中，代表多边形的顶点。\n\n`Color.WHITE`\
    \ 是 `Color` 类中定义的许多静态字段之一，类型为 `Color`，我们选择它作为填充 Polygon 背景的颜色，并使用静态方法 `Color.web`\
    \ 创建深蓝色来绘制 Polygon 的边框。\n\n以下是完成这些任务的代码片段：\n\n***列表 2-2.*** 创建 Polygon 并设置 `fill`\
    \ 和 `stroke` 属性的值：\n\n```java\nPolygon polygon = new Polygon();\nDouble[] dArray\
