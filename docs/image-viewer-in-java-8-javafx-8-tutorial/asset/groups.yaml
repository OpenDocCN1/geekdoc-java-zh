  - "[PAGE 74]\n\n**1.5 Summary**\n\nThis chapter features the following key aspects\
    \ of JavaFX library, listing in the order of\n\ntheir appearance in the chapter:\n\
    \nBuilt-in JavaFX layout panes, reside in javafx.scene.layout package:\n\nBorderPane\n\
    \nStackPane\n\n(See section Create ImageViewer Class as Subclass of Application)\n\
    \nScene class, resides in javafx.scene package﹐is the container of a scene graph.\
    \ \n\n(See here, section Approach One: Bind ImageView‘s fitWidth/fitHeight\n\n\
    properties to scene’s width/height properties Respectively, and section Catch\
    \ Resize\n\nEvent of Scene to Adjust Viewing Size of Image)\n\nStage class, resides\
    \ in javafx.stage package﹐is the top-level container of a\n\nJavaFX application.\
    \ \n\n(See here)\n\nApplication class, resides in javafx.application package,\
    \ is the entry point of a\n\nJavaFX applications. \n\n(See section Create ImageViewer\
    \ Class as Subclass of Application)\n\nvoid start(Stage stage) method, an abstract\
    \ method in Application class,\n\nmust be overridden. \n\n(See Listing 1-1., and\
    \ section JavaFX Application Thread vs. Java Launcher Thread)\n\nvoid addListener(ChangeListener<?\
    \ super T> listener) method, defined in\n\njavafx.beans.value.ObservableValue\
    \ interface, adds a ChangeListener by\n\nproviding changed(ObservableValue<? extends\
    \ T> observable, T\n\noldValue, T newValue) method, to be invoked when this property’s\
    \ value is changed.\n\n(See sections: Catch Resize Event of Image Rendering Area,\
    \ and Catch Resize Event\n\nof Scene to Adjust Viewing Size of Image)\n\nMenuBar,\
    \ Menu, and MenuItem are among fundamental JavaFX UI\n\ncomponents, reside in\
    \ javafx.scene.control package, for designing compact\n\nlook-and-feel graphical\
    \ user interfaces using less space. \n\n(See section Create Menu Bar)\n\njava.io.File\
    \ showOpenDialog(Window ownerWindow) method, a convenient\n\nmethod provided in\
    \ javafx.stage.FileChooser class, shows a file open dialog for\n\nnavigating a\
    \ local file system. \n\n(See section Select Image File from File Open Dialog\
    \ and Display Image on\n\nStackPane)\n\nvoid setOnAction(EventHandler<ActionEvent>\
    \ value) method, provided\n\nin MenuItem class, registers an EventHandler to be\
    \ notified when an\n\nActionEvent occurs."
- md: "(See section Select Image File from File Open Dialog and Display Image on\n\
    StackPane)\n\nImageView and Image are classes, reside in javafx.scene.image package,\
    \ for\nloading and viewing images.\n\n(See here and section Implement Fit Width,\
    \ Fit Height and Original Size Viewing\nOptions)\n\nRadioMenuItem and ToggleGroup,\
    \ reside in javafx.scene.control package,\nfor creating mutually exclusive choices\
    \ in a menu.\n\n(See section Create Toggle Group, Radio Menu Items and Add Listener\
    \ for\nselectedToggle Property)\n\nvoid bind(ObservableValue<? extends T> observable)\
    \ and void\nunbind() are methods defined in Property interface, reside in\njavafx.beans.property\
    \ package, to create/remove a unidirectional binding for\nthis property.\n\n(See\
    \ section Approach One: Bind ImageView‘s fitWidth/fitHeight properties to\nscene’s\
    \ width/height properties Respectively)\n\nDoubleBinding subtract(double other)\
    \ method, defined in\njavafx.beans.binding.DoubleExpression class, calculates\
    \ the difference of\nthis NumberExpression and the given constant value.\n\n(See\
    \ here)\n\nfitWidth and fitHeight are properties defined in ImageView class, resides\
    \ in\njavafx.scene.image package, for adjusting the image viewing size.\n\n(See\
    \ sections: Approach One: Bind ImageView‘s fitWidth/fitHeight properties\nto scene’s\
    \ width/height properties Respectively and Approach Two: Change Values\nfor fitWidth\
    \ Property and fitHeight Property)\n\n***Chapter 2***\n\n## Enhanced Image Viewer\
    \ with Browsing Buttons\n**—Developing Image Viewer V1.1**\n\n### Preface\n\n\
    In previous chapter, we have demonstrated the incremental development of a JavaFX\n\
    application, ImageViewer V1.0. So far it contains minimum capabilities, nevertheless\n\
    is a ready-to-use and convenient accessory, easily be bundled with a variety of\
    \ software.\nAdditional functions will be added gradually throughout this chapter\
    \ and the next chapter.\n\nThis chapter features the implementation of actions\
    \ as well as proper placement for two\nbuttons, Next and Previous, two custom-made\
    \ buttons to open and view the next or\nprevious available image.\n\nThe version\
    \ number is upgraded to 1.1. From detailed descriptions and well-documented\n\
    example codes excerpted from ImageViewer V1.1, you will become familiar with\n\
    fundamental capabilities of JavaFX library recounted in the Summary section.\n\
    \nThe complete development process of ImageViewer V1.1 is characterized by the\n\
    following steps:\n\n## 2.1 Add Next Button\n- 2.1.1 Use Group as Parent Container\n\
    - 2.1.2 Use Shape Class for Rendering 2D Geometric Primitives\n- 2.1.3 Use Rectangle\
    \ Shape as Bounding Box of Custom-Made Button\n- 2.1.4 Paint Background and Border\
    \ of Shape\n- 2.1.5 Set Value of arcHeight and arcWidth Properties to Render Rounded\
    \ Rectangle\n- 2.1.6 Use Polygon Shape as Visual Sign of Next Icon\n- 2.1.7 Set\
    \ Value of Cursor Property for Node\n- 2.1.8 Use Convenience Methods to Register\
    \ Event Handlers to Handle Mouse Events\n- 2.1.9 Complete Source Codes of createNextButton()\
    \ Method\n- 2.1.10 Install Tooltip for Node\n## 2.2 Adjust Next Button’s Default\
    \ Position in StackPane\n## 2.3 Add Previous Button and Adjust Its Position in\
    \ StackPane\n## 2.4 Implement On Mouse Clicked Event Handlers\n- 2.4.1 Configure\
    \ FileChooser\n- 2.4.2 Create List Iterator to Iterate Existing Files in the Current\
    \ Directory\n- 2.4.3 Define Properties in ImageViewer Class\n## 2.5 Complete Source\
    \ Codes of Image Viewer V1.1\n- 2.5.1 Complete Source Codes of FileUtils Class\n\
    - 2.5.2 Complete Source Codes of ImageViewer Class\n## 2.6 Summary\n\n## 2.1 Add\
    \ Next Button\n\nInstead of using Button class from built-in JavaFX UI controls,\
    \ we implement our own\nutilities to design a custom-made button by employing\
    \ the below classes:\n\n- Group: Served as the parent container.\n- Shape (Rectangle):\
    \ Served as the bounding box.\n- Polygon: Served as the visual sign of Next icon.\n\
    - LinearGradient and Color: Paints to fill background and to stroke border.\n\
    - EventHandler and MouseEvent: Used for handling mouse entering, clicking, and\
    \ exiting events.\n\n### 2.1.1 Use Group as Parent Container\n\nGroup class, resides\
    \ in javafx.scene package, is a subclass of\njavafx.scene.Parent. The capability\
    \ of Group is straightforward. It allows you to\ngroup various nodes together\
    \ without imposing automatic layout. The following snippet of\ncodes shows how\
    \ to add nodes to a Group:\n\n```java\nGroup buttonGroup = new Group();\nRectangle\
    \ rect = new Rectangle(0, 0, 25, 35);\nPolygon polygon = new Polygon();\nbuttonGroup.getChildren().addAll(rect,\
    \ polygon);\n```\n\nLearn more about the characteristics of Group in Volume Ⅱ:\
    \ DEVELOPING INTERACTIVE SHAPE DRAWING TOOLS Chapter 1 Line Drawer Section 1.1.1\
    \ Add Pane as Drawing Board in the Center of BorderPane.\n\n### 2.1.2 Use Shape\
    \ Class for Rendering 2D Geometric Primitives\n\nJavaFX provides a very enticing\
    \ class, Shape, for rendering 2D geometric primitives. It\nis an abstract class\
    \ which extends javafx.scene.Node class and serves as the base class\nof some\
    \ of basic forms of 2D geometry. Here are its direct subclasses: Arc, Circle,\n\
    CubicCurve, Ellipse, Line, Path, Polygon, Polyline, QuadCurve, Rectangle,\nSVGPath,\
    \ Text. The Shape class defines common properties of 2D geometric\nprimitives,\
    \ such as fill, stroke, strokeType, strokeWidth, etc.\n\nIt is very common to\
    \ set value of fill and stroke properties respectively for a shape. The\nsetFill\
    \ method is used to specify a color to render the background of a shape, and\n\
    setStroke method is used to specify a color to render the border of a shape. Please\n\
    notice that the default value of fill property is null for Line, Polyline, and\
    \ Path, while\nColor.BLACK for the others; and default value of stroke property\
    \ is Color.BLACK for\nLine, Polyline, and Path, while null for the others.\n\n\
    Now we’ll show you how to exploit capacities of Shape to implement our custom-made\n\
    Next button.\n\n### 2.1.3 Use Rectangle Shape as Bounding Box of Custom-Made Button\n\
    \nHere are codes to accomplish these: a Rectangle is created using the constructor\
    \ with\nparameters: x, y, width and height, and proper value is set for each desired\
    \ property.\n***Listing 2-1.*** Create a Rectangle and set value of these properties:\
    \ fill, stroke,\narcHeight, arcWidth:\n\n```java\nRectangle rect = new Rectangle(0,\
    \ 0, 25, 35);\nLinearGradient lg = new LinearGradient(0, 0, 1, 0, true, new Stop[]{\n\
    \    new Stop(0, Color.web(\"#51738\")),\n    new Stop(0.6, Color.web(\"#B9D4\"\
    )),\n    new Stop(1, Color.web(\"#A7C6\"))\n});\nrect.setFill(lg);\nrect.setStroke(Color.web(\"\
    #AC7FF\"));\nrect.setArcHeight(6.5);\nrect.setArcWidth(6.5);\n```\n\nThe following\
    \ snapshot shows the rendering of a Rectangle:\n***Figure 2-1.*** Snapshot of\
    \ rounded rectangle filled with LinearGradient.\n![](img/ee1680d9adf51c9ff719_79.png)\n\
    \n### 2.1.4 Paint Background and Border of Shape\n\nLinearGradient and Color,\
    \ reside in javafx.scene.paint package, are two of\nsubclasses of Paint, the base\
    \ class of colors and gradients, for painting background\nand border of a Shape"
