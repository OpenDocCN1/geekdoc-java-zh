    **1.4 Implement Fit Width, Fit Height and Original Size**


    **Viewing Options**


    In this section, we demonstrate how to adjust viewing size of an image to fit
    the


    application window. The ImageView is created as a child of a StackPane, and


    according to StackPane default layout strategy, an image is positioned in the
    center of


    StackPane; therefore, if the size of an image is larger than the current available
    viewing


    space, which is subject to the size of a scene, outer portion of the image will
    be blocked,


    thus a user won’t be able to view the whole image.


    In last section, we created an Option menu containing three viewing choices: Fit
    Width,


    Fit Height, and Original Size. An image is rendered based on the viewing option


    currently selected, initially it is set to Original Size. By default, we’d like
    to preserve


    the original width to height ratio of an image when scaling is in action. To do
    so, we set


    value of preserveRatio property to true as follows:


    ***Listing 1-11.*** Set value of preserveRatio property to true:


    **final** ImageView imageView = new ImageView();


    **imageView.setPreserveRatio(true);**


    Now, let’s explore two approaches to render image according to the viewing option


    currently selected.


    **1.4.1 Approach One: Bind ****ImageView****‘s ****fitWidth****/****fitHeight**


    **Properties to Scene’s ****width****/****height**** Properties Respectively**


    We use bind and unbind methods defined in Property interface to implement Fit


    Width, Fit Height, and Original Size viewing options.


    What enticing here is that, once the binding becomes effective, an image’s viewing
    width


    and/or height will be changed accordingly whenever width and/or height of Scene
    is


    changed dynamically.


