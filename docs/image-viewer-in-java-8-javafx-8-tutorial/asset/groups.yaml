- md: "\nThread. And the construction of a Scene object or a Stage object must be\
    \ accessed\nfrom JavaFX Application Thread as well.\n\n## 1.1.2 Catch Resize Event\
    \ of Image Rendering Area\n\nFor debugging and testing purpose at this point,\
    \ we register a ChangeListener\nproviding a changed method to be notified whenever\
    \ width or height of image rendering\narea is changed. Width or height of image\
    \ rendering area is changed when a user resizes\nthe application window.\n\nTo\
    \ register a ChangeListener to observe change of value for a property, we use\
    \ this\nmethod:\n\n`void addListener(ChangeListener<? super T> listener)`\n\n\
    defined in javafx.beans.value.ObservableValue interface, providing\nimplementation\
    \ of changed(ObservableValue<? extends T> observable, T\noldValue, T newValue)\
    \ method, to be invoked when this property’s value is changed.\n\nThe same ChangeListener\
    \ is allowed to be registered to multiple\nObservableValues. To avoid memory leak\
    \ problem, it is a good programming practice\nto un-register a listener whenever\
    \ the value no longer need be observed, using\nremoveListener(ChangeListener<?\
    \ super T> listener) method, which removes\nthe link between an observable value\
    \ and a listener.\n\nStackPane class inherits width and height properties from\n\
    javafx.scene.layout.Region class. Both properties are type of\nReadOnlyDoubleProperty,\
    \ an abstract class that implements ObservableValue\ninterface. As the name reveals,\
    \ an ObservableValue holds a value that are observable,\nyou can listen to the\
    \ change of value and take actions as necessary.\n\nThe following codes demonstrate\
    \ how to watch the resize event of image rendering area, a\nStackPane placed in\
    \ the center of a BorderPane.\n\n***Import Statements:***\n\n`import javafx.beans.value.ChangeListener;`\n\
    \n`import javafx.beans.value.ObservableValue;`\n\n***Listing 1-2.*** Add listeners\
    \ to width property and height property of image rendering area:\n\n```java\n\
    imageArea.widthProperty().addListener(new ChangeListener<Object>() {\n    public\
    \ void changed(ObservableValue o, Object oldVal,\n    Object newVal) {\n     \
    \   System.out.format(\"imageArea width changed from %.1f to %.1f%n\",\n     \
    \   oldVal, newVal);\n    }\n});\n\nimageArea.heightProperty().addListener(new\
    \ ChangeListener<Object>() {\n    public void changed(ObservableValue o, Object\
    \ oldVal,\n    Object newVal) {\n        System.out.format(\"imageArea height\
