    \n### 3.2.1 Disable Button to Indicate No More Image to Open\n\nFirst, we’ll set\
    \ button’s disable status to true when there is no next or previous image to open.\
    \ Once a button is disabled, it will not receive any mouse or keyboard event.\
    \ A button’s disable status is initialized to false immediately after it is created.\n\
    \n***Listing 3-5.*** Initialize buttons’ disable status:\n\n```java\npublic class\
    \ ImageViewer extends Application {\n\n  final Node nextButton = createNextButton();\n\
    \n  final Node prevButton = createPrevButton();\n\n  {\n    disableButton(nextButton,\
    \ true);\n    disableButton(prevButton, true);\n  }\n\n  ...\n\n}\n```\n\nThe\
    \ disable property defined in Node class is type of BooleanProperty, it specifies\
    \ the disable status of this node. Setting this node’s disable property to true\
    \ also results in the value of disabled property of this node as well as that\
    \ of its entire descendant become true. Please notice that it is possible that\
    \ a node’s disabled property is true while its disable property is not true.\n\
    \nThe opacity property defined in Node class is type of DoubleProperty, specifying\
    \ the extent of transparency of this node. Its value is ≧ 0 and ≦ 1. A node with\
    \ opacity value of 0 means it is totally transparent.\n\nThe following codes demonstrate\
    \ how to render a button in disabled status by leveraging the opacity property\
    \ of a node.\n\n***Listing 3-6.*** Define disableButton method:\n\n```java\n/**\n\
    \ * This method takes advantage of node's opacity property to\n * distinguish\
    \ disable status, \n * set opacity value to 0.4 if it is disabled.\n * \n * @param\
    \ button\n * @param isDisable \n */\nvoid disableButton(Node button, boolean isDisable)\
    \ {\n  // Change the opacity value to 0.4 if no more image to open\n  double opacity\
    \ = (isDisable) ? 0.4 : 1;\n  button.setOpacity(opacity);\n  button.setDisable(isDisable);\n\
    }\n```\n\nNow, the initial screen looks like this.\n\n***Figure 3-2.*** Snapshot\
    \ of the initial application window, buttons are disabled.\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_134_0.png)\n\
    \nTo determine whether next image or previous image is available or not, hasNext()\
    \ and hasPrevious() methods defined in ListIterator interface are called to do\
    \ the verification during the following occasions:\n\n- When a list of files that\
    \ exist in the current directory is first created from the action event handler\
    \ of Load menu item.\n- When an image is loaded as a mouse clicked event occurred\
    \ on Next or Previous button.\n\nWe’ll define a loadFile(File file) method to\
    \ modularize the tasks that deal with the action event of Load menu item:\n\n\
    ***Listing 3-7.*** Define loadFile method to create a list iterator, load the\
    \ specified file and update button status:\n\n```java\n/**\n * Static method FileUtils.listIterator(Path)\
    \ is called to \n * get a list iterator to iterate over files in the directory,\n\
