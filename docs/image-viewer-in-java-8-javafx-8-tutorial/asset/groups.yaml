    \n## 3.3 添加幻灯片功能\n\n一旦从文件选择器的打开对话框打开了图像文件，应用程序将获取当前目录中存在的图片文件列表。一个方便的功能是允许用户逐个浏览这些图片，而无需手动点击“下一个”按钮。实现幻灯片机制的步骤所示。\n\
    \n### 3.3.1 添加“开始幻灯片”和“停止幻灯片”菜单项\n\n这里使用的简单 GUI 是 MenuItem。在菜单栏的选项菜单中添加了两个菜单项：“开始幻灯片”和“停止幻灯片”，它们最初都是禁用的。为了区分是否正在运行幻灯片，在\
    \ ImageViewer 类中定义了一个类型为 `BooleanProperty` 的变量 `isSlideshowOn`，并初始化为 false。以下代码段显示了如何实现这些功能：\n\
    \n***导入语句：***\n\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
    \n***列表 3-14. 添加“开始幻灯片”和“停止幻灯片”菜单项：***\n\n```java\npublic class ImageViewer extends\
    \ Application {\n    ...\n    final BooleanProperty isSlideshowOn = new SimpleBooleanProperty(false);\n\
    \    ...\n\n    @Override\n    public void start(final Stage stage) {\n      \
    \  ...\n        // 创建开始/停止幻灯片的菜单项\n        final MenuItem startSlide = new MenuItem(\"\
    Start Slideshow\");\n        final MenuItem stopSlide = new MenuItem(\"Stop Slideshow\"\
    );\n        startSlide.disableProperty().bind(isSlideshowOn.or(nextButton.disableProperty()));\n\
    \        stopSlide.disableProperty().bind(isSlideshowOn.not().or(nextButton.disableProperty()));\n\
    \n        //为“开始幻灯片”菜单项添加动作处理器\n        startSlide.setOnAction(new EventHandler<ActionEvent>()\
    \ {\n            @Override\n            public void handle(ActionEvent ae) {\n\
    \                System.out.println(\"Start Slideshow…\");\n            }\n  \
    \      });\n\n        //为“停止幻灯片”菜单项添加动作处理器\n        stopSlide.setOnAction(new\
    \ EventHandler<ActionEvent>() {\n            @Override\n            public void\
    \ handle(ActionEvent ae) {\n                System.out.println(\"Stop Slideshow…\"\
    );\n            }\n        });\n\n        //将选项菜单添加到菜单栏\n        menuOption.getItems().addAll(menuView,\
    \ startSlide, stopSlide);\n        ...\n    }\n}\n```\n\n#### 3.3.1.1 绑定菜单项的禁用属性\n\
    \n由于以下绑定语句，startSlide 和 stopSlide 菜单项初始时是禁用的。\n\n```java\nstartSlide.disableProperty().bind(isSlideshowOn.or(nextButton.disableProperty()));\n\
    stopSlide.disableProperty().bind(isSlideshowOn.not().or(nextButton.disableProperty()));\n\
    ```\n\n在上面的绑定语句中，使用了两个逻辑操作——or（或）和 not（非）来计算禁用属性的值。`javafx.beans.binding.BooleanExpression`\
    \ 类是一个实现 `ObservableBooleanValue` 的抽象类，它提供了这些方法：\n\n- `public BooleanBinding not()`\
    \ 方法对此 BooleanExpression 执行逻辑非操作，并返回一个类型为 BooleanBinding 的对象，它是 BooleanExpression\
    \ 的直接子类。\n- `public BooleanBinding or(ObservableBooleanValue other)` 方法对此 BooleanExpression\
    \ 和给定的 ObservableBooleanValue 执行逻辑或操作，并返回一个类型为 BooleanBinding 的对象，它是 BooleanExpression\
    \ 的直接子类。\n\n如果当前正在运行幻灯片或“下一个”按钮被禁用，则“开始幻灯片”菜单项被禁用。同样，如果没有在运行幻灯片或“下一个”按钮被禁用，则“停止幻灯片”菜单项被禁用。记住，当没有后续图片可以查看时，“下一个”按钮是禁用的。\n\
    \n***图 3-9.*** 选项菜单外观的快照，“开始幻灯片”和“停止幻灯片”菜单项都是禁用的。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_149_0.png)\n\
    \n***图 3-10.*** 加载图像文件后选项菜单外观的快照，“开始幻灯片”菜单项是启用的。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_150_0.png)\n\
    \n## 3.3.2 在另一个线程上执行幻灯片\n\n将长时间运行的任务交给另一个线程是一种良好的做法，这样 UI 线程始终保持响应。javafx.concurrent\
    \ 提供了 Task 和 Service 类，它们：\n\n- **Task**: 继承 `java.util.concurrent.FutureTask`\
    \ 并实现 `Runnable` 接口的抽象类，是一次性的，不可重用。要执行 Task，可以使用 `java.lang.Thread` 类并调用 `start()`\
    \ 方法启动线程。或者使用 ExecutorService 中定义的 `submit(Runnable)` 方法。\n- **Service**: 继承 `java.lang.Object`\
    \ 并实现 `Worker<V>` 接口的抽象类，是可重用的。Service 类提供了 `start()`、`cancel()`、`reset()` 和 `restart()`\
    \ 方法来操作此服务。\n- **ScheduledService**: Service 的直接子类，允许指定启动和重启服务的延迟时间。\n- **WorkerStateEvent**:\
    \ `javafx.event.Event` 的子类，定义了事件类型的静态字段，如 `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
