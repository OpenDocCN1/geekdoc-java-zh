    ```\n\n以下语句创建了一个 SlideshowService 对象。\n\n```java\n// 创建一个可重用的 Worker 对象\nfinal\
    \ SlideshowService service = new SlideshowService(listIterator,\n    curImage,\
    \ imageName);\n```\n\n有三个参数传递给 SlideshowService 类的构造函数：\n\n- listIterator：类型为\
    \ `ObjectProperty<ListIterator<Path>>`，指定一个用于遍历从文件选择器文件打开对话框中打开图像文件时创建的文件列表的 ListIterator。\n\
    - curImage：类型为 `ObjectProperty<Image>`，与 ImageView 对象的 image 属性绑定。\n- imageName：类型为\
    \ `StringProperty`，与 Text 对象（状态文本 statusText）的 text 属性绑定，用于在状态栏中显示图像名称。\n\n##\
    \ 3.3.2.2 配置幻灯片服务对象\n\n我们定义了一个 `configureSlideshow` 方法来执行配置。一旦创建了服务对象，就会调用该方法来完成这些工作：\n\
    \n1. 将 ImageViewer 类中定义的 `isSlideshowOn` 属性与服务的运行属性（running property）绑定。当且仅当服务正在运行时，`isSlideshowOn`\
    \ 属性的值才为 true。\n```java\nBooleanProperty isSlideshowOn = new SimpleBooleanProperty(false);\n\
    SlideshowService service = new SlideshowService(listIterator,\n    curImage, imageName);\n\
    isSlideshowOn.bind(service.runningProperty());\n```\n2. 注册事件处理器来处理以下事件类型的 `WorkerStateEvents`：`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`、`WORKER_STATE_FAILED`\
    \ 和 `WORKER_STATE_CANCELLED`。\n\n以下是 Service 类定义的便利方法，用于为上述事件类型注册事件处理器：\n\n```java\n\
    public final void setOnRunning(EventHandler<WorkerStateEvent> value)\n设置 onRunning\
    \ 属性的值，提供当 Worker 状态转换到 RUNNING 时调用的 handle 方法的实现。\n\npublic final void setOnSucceeded(EventHandler<WorkerStateEvent>\
    \ value)\n设置 onSucceeded 属性的值，提供当 Worker 状态转换到 SUCCEEDED 时调用的 handle 方法的实现。\n\n\
    public final void setOnFailed(EventHandler<WorkerStateEvent> value)\n设置 onFailed\
    \ 属性的值，提供当 Worker 状态转换到 FAILED 时调用的 handle 方法的实现。\n\npublic final void setOnCancelled(EventHandler<WorkerStateEvent>\
    \ value)\n设置 onCancelled 属性的值，提供当 Worker 状态转换到 CANCELLED 时调用的 handle 方法的实现。\n\
    ```\n\n（注：原文中后半部分的 OCR 文本变得碎片化且重复。我根据标准的 JavaFX Service 模式和提供的代码片段重构了逻辑流。）\n\n\
    ***Listing 3-16. configureSlideshow：**\n```java\n/**\n * configureSlideshow 方法实现\n\
    \ */\nvoid configureSlideshow() {\n    // 如果服务正在运行，则 isSlideshowOn 为 true\n  \
    \  // 否则，它为 false\n    \n    setOnRunning(new EventHandler<WorkerStateEvent>()\
    \ {\n        @Override\n        public void handle(WorkerStateEvent event) {\n\
    \            System.out.println(\"Service is transited to running\");\n      \
    \      lastClicked.set(NEXT);\n            prevButton.setDisable(false);\n   \
    \     }\n    });\n\n    EventHandler<WorkerStateEvent> taskDone = new EventHandler<WorkerStateEvent>()\
    \ {\n        @Override\n        public void handle(WorkerStateEvent event) {\n\
    \            if (listIterator.get().hasNext()) {\n                nextButton.setDisable(false);\n\
    \            }\n            prevButton.setDisable(true);\n        }\n    };\n\n\
    \    setOnSucceeded(taskDone);\n    setOnFailed(taskDone);\n    setOnCancelled(taskDone);\n\
    }\n```\n\n## 3.3.2.3 为“开始幻灯片”和“停止幻灯片”项目实现动作事件事件处理器\n\n场景遵循“开始幻灯片”的操作如下：当用户点击幻灯片菜单项时，服务启动，其状态从\
    \ READY 变为 SCHEDULED 再变为 RUNNING；一旦状态转换到 RUNNING，`isSlideshowOn` 的值立即更改为 true（参见此处），结果“停止幻灯片”项目的禁用状态变为\
    \ false。\n\n我们正在使用 Service 类提供的 `start()` 方法来启动服务。该方法是从处理幻灯片菜单项动作事件的事件处理器中调用的。在调用\
    \ `start()` 方法之前检查服务状态是非常重要的，这可以确保服务处于 READY 状态。如果未就绪，则先重置它，然后启动服务。\n\n以下是执行这些操作的代码片段：\n\
    \n```java\nstartSlide.setOnAction(new EventHandler<ActionEvent>() {\n    @Override\n\
    \    public void handle(ActionEvent ae) {\n        System.out.println(\"Start\
    \ Slideshow...\");\n        if (service.getState() != Worker.State.READY)\n  \
    \          service.reset(); // 到 READY\n        service.start();\n    }\n});\n\
    ```\n\n***Listing 3-17. 为“开始幻灯片”和“停止幻灯片”菜单项实现动作事件事件处理器：**\n（OCR 文本在此结束）\n\n"
