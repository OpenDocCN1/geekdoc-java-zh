    \nAn enumerated type which defines constants: CycleMethod.NO\\_CYCLE,\n\nCycleMethod.REFLECT,\
    \ and CycleMethod.REPEAT.\n\nStop\n\nDefine an offset and a color to be applied\
    \ to color gradient.\n\n(See sections: Use Rectangle Shape as Bounding Box of\
    \ Custom-Made Button, and\n\nPaint Background and Border of Shape)\n\narcHeight\
    \ and arcWidth are properties defined in Rectangle class, for rendering\n\nrounded\
    \ rectangles. \n\n(See section Set Value of arcHeight and arcWidth Properties\
    \ to Render Rounded"
- md: "\nRectangle)\n\nCursor class, resides in javafx.scene package and extends java.lang.Object,\
    \ defines some useful mouse cursors as static fields of Cursor type such as CLOSED_HAND,\
    \ CROSSHAIR, HAND, OPEN_HAND, TEXT, WAIT, etc.\n\n(See section Set Value of Cursor\
    \ Property for Node)\n\nEventHandler<T extends Event>, an interface which extends\
    \ java.util.EventListener, defines a handle(T event) method to be invoked when\
    \ the specified event happens.\n\n(See section Use Convenience Methods to Register\
    \ Event Handlers to Handle Mouse Events)\n\nMouseEvent, resides in javafx.scene.input\
    \ package, is a subclass of javafx.scene.input.InputEvent. It defines event types\
    \ such as MOUSE_CLICKED, MOUSE_DRAGGED, MOUSE_ENTERED, MOUSE_EXITED, MOUSE_MOVED,\
    \ MOUSE_PRESSED, MOUSE_RELEASED, etc., and provides methods such as getX(), getY(),\
    \ etc., to get position of mouse cursor while event occurs.\n\n(See section Use\
    \ Convenience Methods to Register Event Handlers to Handle Mouse Events)\n\nSome\
    \ of convenience methods provided in Node class to register EventHandlers to handle\
    \ mouse events.\n\n- public final void setOnMouseClicked(EventHandler<? super\
    \ MouseEvent> value)\n- public final void setOnMouseEntered(EventHandler<? super\
    \ MouseEvent> value)\n- public final void setOnMouseExited(EventHandler<? super\
    \ MouseEvent> value)\n\n(See section Use Convenience Methods to Register Event\
    \ Handlers to Handle Mouse Events)\n\nstatic void install(Node node, Tooltip t)\
    \ method, provided in Tooltip class which resides in javafx.scene.control package\
    \ and extends javafx.scene.control.PopupControl class, shows help information\
    \ when mouse hovers on the given Node.\n\n(See section Install Tooltip for Node)\n\
    \nStatic methods, provided in StackPane, for customizing layout constraints on\
    \ the specified child node:\n\n- static void setAlignment(Node child, Pos value)\n\
    - static void setMargin(Node child, Insets value)\n\n(See sections: Adjust Next\
    \ Button’s Default Position in StackPane, and Add Previous Button and Adjust Its\
    \ Position in StackPane)\n\nPos, resides in javafx.geometry package, is an enumerated\
    \ type defines constants for position and alignment such as CENTER, CENTER_RIGHT,\
    \ TOP_RIGHT, etc.\n\n(See sections: Adjust Next Button’s Default Position in StackPane,\
    \ and Add Previous Button and Adjust Its Position in StackPane)\n\nInsets class,\
    \ resides in javafx.geometry package, is often used in the setMargin method or\
    \ in the setPadding method for specifying offset of 4 sides: top, right, bottom\
    \ and left of a rectangle area.\n\n(See section Adjust Next Button’s Default Position\
    \ in StackPane, and here)\n\nFileChooser.ExtensionFilter is the nested class defined\
    \ in the FileChooser class, for defining filters to show only files whose extensions\
    \ matching the given filters.\n\n(See section Configure FileChooser)\n\nSome of\
    \ Classes reside in javafx.beans.property package:\n\n- ObjectProperty<T> is an\
    \ abstract class, derived from javafx.beans.binding.ObjectExpression<T> class,\
    \ implements Property<T> and WritableObjectValue<T>.\n- SimpleObjectProperty<T>\
    \ derived from ObjectProperty<T> class.\n- StringProperty is an abstract class,\
    \ derived from javafx.beans.binding.StringExpression class, implements Property<java.lang.String>\
    \ and WritableStringValue.\n- WritableStringValue extends WritableObjectValue<java.lang.String>.\n\
    - SimpleStringProperty derived from StringProperty class.\n\n(See section Define\
    \ Properties in ImageViewer Class)\n\nProperty<T> interface, resides in javafx.beans.property\
    \ package, defines methods which are common to all properties such as the followings:\n\
    \n- void bind(ObservableValue<? extends T> observable)\nBind this property unidirectional\
    \ to the given ObservableValue.\n- void unbind()\nUnbind for this property.\n\n\
    (See section Define Properties in ImageViewer Class)\n\nWritableObjectValue<T>\
    \ interface, resides in javafx.beans.value package and extends WritableValue<T>,\
    \ defines the following methods:\n\n- T get()\nGet the wrapped value.\n- void\
    \ set(T value)\nSet the wrapped value.\n\n(See here)\n\n***Chapter 3***\n## Enhanced\
    \ Image Viewer with Slide Show\n\n## Capacity\n### —Developing Image Viewer V1.2\n\
    \n### Preface\n\nAt this stage, the ImageViewer application has contained adequate\
    \ abilities as an effective image viewing tool. Based on the fundamental structure\
    \ built so far, more functionality may be incrementally developed with ease.\n\
    \nThis chapter features the implementation of slide show capabilities as well\
    \ as fine-tuning overall look and feel of GUIs. We’ll demonstrate how to develop\
    \ a multi-threaded JavaFX application using classes for concurrency, reside in\
    \ javafx.concurrent package.\n\nThe version number of ImageViewer is upgraded\
    \ to 1.2. From detailed descriptions and well-documented example codes excerpted\
    \ from ImageViewer V1.2, you will become familiar with fundamental capabilities\
    \ of JavaFX library recounted in the Summary section.\n\nThe complete development\
    \ process of ImageViewer V1.2 is characterized by the following steps:\n\n- 3.1\
    \ Add Status Bar at the Bottom of BorderPane\n    - 3.1.1 Create HBox Pane as\
    \ Status Bar and Text Node to Show Image Name\n    - 3.1.2 Set Value of imageName\
    \ Property\n- 3.2 Improve Button’s Reaction Aspect\n    - 3.2.1 Disable Button\
    \ to Indicate No More Image to Open\n    - 3.2.2 Change Button Appearance When\
    \ Mouse Is Pressed\n- 3.3 Add Slide Show Capabilities\n    - 3.3.1 Add Start Slideshow\
    \ and Stop Slideshow Menu Items\n        - 3.3.1.1 Bind Disable Property of Menu\
    \ Item\n    - 3.3.2 Execute Slide Show on Another Thread\n        - 3.3.2.1 Create\
    \ SlideshowService Class that Extends Service Class\n        - 3.3.2.2 Configure\
    \ Slide Show Service Object\n        - 3.3.2.3 Implement Event Handlers of Action\
    \ Events for Start Slideshow and Stop Slideshow Menu Items\n    - 3.3.3 The Complete\
    \ start(Stage stage) Method of ImageViewer Application\n    - 3.3.4 Coordinate\
    \ with Event Handlers of Load Menu Item and Previous Button\n- 3.4 Add Fade Transition\
    \ between Slides\n    - 3.4.1 Complete Source Codes of SlideshowService Class\n\
    - 3.5 Complete Source Codes of Image Viewer V1.2\n- 3.6 Summary\n\n## 3.1 Add\
    \ Status Bar at the Bottom of BorderPane\n\nPrior to the implementation of slide\
    \ show feature, we’ll add a status bar at the bottom of the root pane which is\
    \ a BorderPane. The status bar is for displaying image name, the file name of\
    \ the current image.\n\n### 3.1.1 Create HBox Pane as Status Bar and Text Node\
    \ to Show Image Name\n\n**Name**\nAn HBox, one of build-in layout panes, placing\
    \ its children in one row horizontally, is created as status bar. And a Text node\
    \ is created to display image name. Here’s the snippet of codes to do these:\n\
    \n BorderPane rootPane = new BorderPane();\n HBox statusBar = new HBox();\n Text\
    \ statusText = new Text(\"\"); even statusBar.getChildren().add(statusText);\n\
    \ rootPane.setBottom(statusBar);\n\nPlease notice that Text class derives from\
    \ Node class, and is one of direct subclasses of Shape class that carries out\
    \ common needs for rendering geometric primitives.\n\nA Text being considered\
    \ a Node as well as a Shape comes with significant benefits. All features common\
    \ to JavaFX nodes can be applied to Text objects. They can be placed in a layout\
    \ pane utilizing the automatic placement capabilities, applying transformations\
    \ and transitions, customizing the presentation style using CSS, etc. Also they\
    \ possess common properties defined in Shape class such as fill, stroke, strokeType,\
    \ strokeWidth, etc.\n\nWe’d like to set preferred value of properties as below\
    \ for the HBox created as a status bar:\n\npadding\nThe padding property, inherited\
    \ from Region class, defines padding of top, right, bottom and left for a region.\
    \ The void setPadding(Insets value) method is called to set value for this property.\n\
    \nspacing\nThe spacing property, defined in HBox class, specifies the horizontal\
    \ space between children in an HBox pane. The void setSpacing(double value) method\
    \ is called to set value for this property.\n\nstyle\nThe style property, defined\
    \ in Node class, specifies CSS style for this node. The value of this property\
    \ is a string complying with the format used in the style.\n"
  mdcn: "\n\nRectangle)\n\nCursor 类，位于 javafx.scene 包并继承自 java.lang.Object，它通过 `Cursor`\
    \ 类型的静态字段定义了一些实用的鼠标光标，例如 CLOSED_HAND、CROSSHAIR、HAND、OPEN_HAND、TEXT、WAIT 等。\n\n\
    （参见 Node 的 Cursor 属性设置 Set Value of Cursor Property 章节）\n\nEventHandler<T extends\
