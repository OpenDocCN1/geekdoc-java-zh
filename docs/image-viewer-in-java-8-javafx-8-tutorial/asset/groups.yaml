  mdcn: "\nMenuItem 类用于添加事件处理器，以处理 Load（加载）菜单项的 ActionEvent。\n\n为了加载和显示图像，我们结合使用 ImageView\
    \ 类和 Image 类。`Image` 类根据给定的 String 类型的 URL 加载图像，而 `ImageView` 类则在图像渲染区域中显示该图像。\n\
    \n首先，我们创建一个作为 `StackPane` 子元素的 `ImageView`。稍后，当获取图像文件时，我们将创建一个 `Image` 对象来加载图像文件，并调用\
    \ `ImageView` 类提供的 `setImage(Image value)` 方法来查看图像。\n\n详细情况如下：当执行 `FileChooser`\
    \ 的 `showOpenDialog` 方法时，会弹出一个文件打开对话框。当用户选择一个文件并点击对话框中的“打开”按钮时，`showOpenDialog`\
    \ 方法会将选中的文件（File 类型）返回给调用者，它被转换为 String 表现形式的 URL，并以该 URL 为参数创建一个 `Image` 对象；此时，图像已加载到内存中但尚未显示在屏幕上，一旦执行\
    \ `ImageView` 的 `setImage` 方法，选中的图像就会显示出来。为了效率考虑，我们只创建一次 `ImageView` 对象，并在每次选择并打开新图像文件时更新其\
    \ `Image` 属性。\n\n以下代码片段完成了这些任务：\n\n***导入语句：***\n\n```java\nimport java.io.File;\n\
    \nimport javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\nimport\
    \ javafx.stage.FileChooser;\n```\n\n***Listing 1-7.*** 创建 FileChooser 对象、ImageView\
    \ 对象并为 Load 菜单项添加 EventHandler 以加载图像：\n\n```java\n// 创建文件选择器\nfinal FileChooser\
    \ fileChooser = new FileChooser();\nfileChooser.setTitle(\"Open an Image File\"\
    );\n\n// 创建图像视图，添加到图像区域\nfinal ImageView imageView = new ImageView();\nimageArea.getChildren().add(imageView);\n\
    \n// 为菜单项 Load 添加动作\nload.setOnAction(new EventHandler<ActionEvent>() {\n @Override\n\
    \ public void handle(ActionEvent e) {\n // 打开 FileChooser 对话框\n File file = fileChooser.showOpenDialog(stage);\n\
    \ if (file != null) {\n String url = file.toURI().toString();\n Image image =\
    \ new Image(url);\nimageView.setImage(image);\n }\n }\n});\n```\n\n请记住将变量 `stage`\
    \ 声明为 `final`，因为它在内部类（即 Load 菜单项的匿名 EventHandler 类）中被访问。\n\n现在，我们需要处理一个关于图像渲染区域（`StackPane`）可调整大小的重要事项。为了避免在显示较大的图像时缩放\
    \ `StackPane`，我们需要为 `StackPane` 设置最小尺寸。以下是实现此操作的代码：\n\n```java\nimageArea.setMinSize(0,\
    \ 0);\n```\n\n如果不添加上述行代码，当加载大于当前 `StackPane` 大小的图像时，`StackPane` 的大小会发生变化。这里是一个例子：\n\
    \n假设 `StackPane` 的当前大小为 600x375；在显示大小为 1280x960 的图像后，`StackPane` 的大小将扩大为 1280x960；然而，可见部分仍然是\
    \ 600x375。\n\n为 `StackPane` 设置最小大小可以确保每当打开新图像时，都不会发生大小变化事件，同时也简化了后续章节要开发的代码。\n\
    \n***Listing 1-8.*** ImageViewer 类的完整源代码所示：\n\n```java\npackage imageviewer;\n\
    \nimport java.io.File;\nimport javafx.application.Application;\nimport javafx.application.Platform;\n\
    import javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
