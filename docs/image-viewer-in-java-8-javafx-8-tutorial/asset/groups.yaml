    \    buttonGroup.setOnMouseEntered(new EventHandler<MouseEvent>() {\n        @Override\n\
    \        public void handle(MouseEvent me) {\n            System.out.println(\"\
    Mouse entered\");\n            rect.setFill(lgEntered);\n            polygon.setFill(Color.web(\"\
