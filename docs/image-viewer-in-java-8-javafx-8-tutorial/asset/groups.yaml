  mdcn: "\n\n***图 3-1.*** 场景窗口底部状态栏显示的当前图像文件名的照。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_132_0.png)\n\
    \n## 3.2 改进按钮的响应方面\n\n在本节中，我们将花一点精力来微调按钮的外观和感受，同时也增强用户友好性。\n\n### 3.2.1 禁用按钮以指示没有更多图像可以打开\n\
    \n首先，当没有下一个或上一个图像可以打开时，我们将按钮的禁用状态设置为 true。一旦按钮被禁用，它将不会接收任何鼠标或键盘事件。按钮的禁用状态在创建后会立即初始化为\
    \ false。\n\n***代码列表 3-5.*** 初始化按钮的禁用状态：\n\n```java\npublic class ImageViewer extends\
    \ Application {\n\n  维持final Node nextButton = createNextButton();\n\n  final\
    \ Node prevButton = createPrevButton();\n\n  {\n    disableButton(nextButton,\
    \ true);\n    disableButton(prevButton, true);\n  }\n\n  ...\n\n}\n```\n\n在 `Node`\
    \ 类中定义的 `disable` 属性类型为 `BooleanProperty`，它指定了该节点的禁用状态。将此节点的 `disable` 属性设置为 true\
    \ 也会导致该节点及其所有后代节点的禁用属性值变为 true。请注意，可能一个节点的 `disabled` 属性为 true，但其 `disable` 属性并不为\
    \ true。\n\n在 `Node` 类中定义的 `opacity` 属性类型为 `DoubleProperty`，指定了该节点的透明程度。其值 ≧ 0\
    \ 且 ≦ 1。`opacity` 值为 0 的节点意味着它是完全透明的。\n\n以下代码演示了如何利用节点的 `opacity` 属性来渲染处于禁用状态的按钮。\n\
    \n***代码列表 3-6.*** 定义 `disableButton` 方法：\n\n```java\n/**\n * 此方法利用节点的 opacity\
    \ 属性来\n * 区分禁用状态， \n * 如果被禁用，则将不透明度值设置为 0.4。\n * \n * @param button\n * @param\
    \ isDisable \n */\nvoid disableButton(Node button, boolean isDisable) {\n  //\
    \ 如果没有更多图像可以打开，则将不透明度值更改 0.4\n  double opacity = (isDisable) ? 0.4 : 1;\n  button.setOpacity(opacity);\n\
    \  button.setDisable(isDisable);\n}\n```\n\n现在，初始界面看起来如下所示。\n\n***图 3-2.*** 初始应用程序窗口的照，按钮处于禁用状态。\n\
    \n![](img/ee16860d9fadf51c9ffb7191acdb087c_134_0.png)\n\n为了确定是否有下一个图像或上一个图像，在以下情况下会调用\
    \ `ListIterator` 接口中定义的 `hasNext()` 和 `hasPrevious()` 方法进行验证：\n\n- 当从“Load”菜单项的动作事件处理器中首次创建当前目录存在的文件列表时。\n\
