    \n如果选择了 Fit Width（适应宽度）查看选项，查看宽度将根据场景当前的宽度设置。以下是代码片段：\n\n***列表 1-17.*** 调用 setFitWidth\
    \ 方法将图像查看宽度设置为与场景相同：\n\n```java\nimageView.setFitWidth(scene.getWidth());\n\n\
    // 除了 setFitWidth，还必须将适应高度设置为 0\n\nimageView.setFitHeight(0);\n```\n\n如果选择了 Fit\
    \ Height（适应高度）查看选项，查看高度将根据场景当前的高度设置，减去菜单栏的高度。以下是代码片段：\n\n***列表 1-18.*** 调用 setFitHeight\
    \ 方法将图像查看高度设置为与场景高度减去菜单栏的高度相同：\n\n```java\nimageView.setFitHeight(scene.getHeight()\
    \ - menuBar.getHeight());\n\n// 除了 setFitHeight，还必须将适应宽度设置为 0 \n\nimageView.setFitWidth(0);\
    \ \n```\n\n如果选择了 Original Size（原始尺寸）选项，我们需要通过向 fitWidth 属性和 fitHeight 属性赋值 0 来清除之前设置的值。以下是代码片段：\n\
    \n***列表 1-19.*** 调用 setFitWidth 和 setFitHeight，并给定 0 作为值：\n\n```java\n// 清除之前的值\n\
    imageView.setFitWidth(0);\n\nimageView.setFitHeight(0);\n```\n\n以下代码显示了方法二的实现情况。\n\
    \n***列表 1-20.*** 监听切换组中单选框项目选择的变化，调整图像 fitWidth 属性和 fitHeight 属性的值：\n\n```java\n\
    // 监听切换组中选择的变化\ngroupOption.selectedToggleProperty().addListener(new ChangeListener<Toggle>\
    \ {\n\npublic void changed(ObservableValue<? extends Toggle> ov, Toggle old_toggle,\
    \ Toggle new_toggle) {\n\nif (groupOption.getSelectedToggle() != null) {\nRadioMenuItem\
    \ choiceItem = (RadioMenuItem) groupOption.getSelectedToggle();\nif (choiceItem\
    \ == fitWidth) {\nimageView.setFitWidth(scene.getWidth());\n// 除了 setFitWidth，还必须将适应高度设置为\
    \ 0\nimageView.setFitHeight(0);\n} else if (choiceItem == fitHeight) {\nimageView.setFitHeight(scene.getHeight()\
    \ - menuBar.getHeight());\n// 除了 setFitHeight，还必须将适应宽度设置为 0\nimageView.setFitWidth(0);\n\
    } else {\n// 清除之前的值\nimageView.setFitWidth(0);\nimageView.setFitHeight(0);\n}\n\
    });\n```\n\n### 1.4.2.1 捕捉场景调整大小事件以调整图像尺寸\n\n完成方法二还有一个问题需要解决：图像的查看尺寸取决于场景的大小（初始设置为\
    \ 600x400 像素），该尺寸会在用户拖动窗口边缘或角部时发生变化。我们需要捕获此调整大小事件来调整查看尺寸。如果当前查看选项设置为 Fit Width，则场景的新宽度将作为图像\
    \ fitWidth 属性的值；如果选择了 Fit Height，场景的高度减去菜单栏的高度将作为 fitHeight 属性的值。\n\n为了响应场景尺寸的变化，我们分别为宽度属性和高度属性添加了监听器。以下代码片段完成了这些任务：\n\
    \n***列表 1-21.*** 监听场景宽度和高度的变化，调整视图的 fitWidth 和 fitHeight：\n\n```java\n// 监听场景宽度的变化以调整视图的\
