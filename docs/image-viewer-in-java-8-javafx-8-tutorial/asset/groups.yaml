    \nduration.\n\nParallelTransition\n\nA direct subclass of Transition, conducts\
    \ transitions over a list of Animation\n\nobjects, type of ObservableList<Animation>,\
    \ in a parallel manner.\n\nThis is the constructor we’ll use to create FadeTransition\
    \ objects:\n\n public FadeTransition(Duration duration, Node node)\n\n \n\nDuration\
