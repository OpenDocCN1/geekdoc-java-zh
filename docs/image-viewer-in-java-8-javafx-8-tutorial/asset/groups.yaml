    Some of convenience methods provided in Service class to register EventHandlers
    to handle Worker State Events:


    public final void setOnRunning(EventHandler<WorkerStateEvent> value)


    public final void setOnSucceeded(EventHandler<WorkerStateEvent> value)


    public final void setOnFailed(EventHandler<WorkerStateEvent> value)


    public final void setOnCancelled(EventHandler<WorkerStateEvent> value)


    (See section Configure Slide Show Service Object)


    Worker.State, nested class from javafx.concurrent.Worker interface, is an enumerated
    type defines constants for states of a Worker, they are: CANCELLED, FAILED, READY,
    RUNNING, SCHEDULED, and SUCCEEDED. (See here and here)


    Some of methods provided in Service class, reside in javafx.concurrent package:


    public void start()

    Start this service; a service can only be started successfully if it is in READY
    state.


    public void reset()

    Reset this service; the state of service is transited to READY state as a result.


    Worker.State getState()

    Defined in Worker interface, get the value of state property which represents
    the current state of the Worker.


    public boolean cancel()

    Defined in Worker interface, cancel this service, return true if the service is
    canceled successfully.


    (See section Implement Event Handlers of Action Events for Start Slideshow and
    Stop Slideshow Menu Items)


    Some of classes from javafx.animation package for conducting transition animations
    of fade in and fade out effects between slides in parallel:


    | Animation | Transition |

    | :--- | :--- |

    | FadeTransition | FadeTransition |

    | ParallelTransition | |


    (See section Add Fade Transition between Slides)


    javafx.util.Duration class, implements java.lang.Comparable<Duration>, holds the
    duration of time. (See here)


    public void playFromStart() method, provided in Animation class, plays an animation
    from the starting position. (See here)


