    \n## 第 2 章：具有加载能力的增强绘图工具\n\n引入 `DrawLoader` 类，该类位于 `drawtool.io` 包，用于将 FXML 文件以及图像文件加载到绘板。\n\
    \n## 第 3 章：具有写入与加载能力的增强型 JFXDrawTools\n\n将草图保存和加载功能集成到 JFXDrawTools 应用中。\n\n 5.\
    \ 其他……\n\n每个章节末尾都有一个实用的**总结**部分；它列出了该章节中介绍的 JavaFX 库的所有关键方面方面。它可以帮助你查找本书中涉及的 JavaFX\
    \ 基础功能。以下是其中的核心内容：\n\n- `javafx.scene.shape` 包中的 Shape 类，用于 2D 几何基元。\n- FXML，一种符合\
    \ XML（可扩展标记语言）格式的标记语言，用于构建 GUI。\n- 属性和绑定机制。\n- `Image` 类和 `ImageView` 类用于加载和显示图像。\n\
    - `javafx.concurrent` 包中的并发能力。\n- 应用于幻灯片功能中图像对象的 `FadeTransition` 和 `ParallelTransition`。\n\
    - `javafx.scene.layout` 包中的内置布局面板。\n- 以及更多……\n\n## 带有应用和完整源代码的复用类\n\n本系列书籍包含了一组具有复用类的包的完整源代码，以及可嵌入的\
    \ JavaFX 应用。\n\n下表列出了本系列书籍前四卷中提供的所有源代码：\n\n### 绘图工具\n\n| 包名 | 源代码文件名 |\n| :---\
    \ | :--- |\n| drawtool | ShapeDrawer.java |\n| | DrawPane.java |\n| drawtool.drawer\
    \ | BezierCurveDrawer.java |\n| | CircleDrawer.java |\n| | EllipseDrawer.java\
    \ |\n| | LineDrawer.java |\n| | PathDrawer.java |\n| | PolygonDrawer.java |\n\
    | | PolylineDrawer.java |\n| | RectangleDrawer.java |\n| | RegularPolygonDrawer.java\
    \ |\n| | RubberBander.java |\n| | ShapeMover.java |\n| drawtool.shape | RegularPolygon.java\
    \ |\n| drawtool.io | DrawClipper.java |\n| | DrawLoader.java |\n| | DrawWriter.java\
    \ |\n\n### 图形应用\n\n| 包名 | 源代码文件名 |\n| :--- | :--- |\n| imageviewer | FileUtils.java\
    \ |\n| | ImageViewer.java |\n| | SlideshowService.java |\n| jfxdrawtools | JFXDrawTools.java\
    \ |\n\n## 第 Ⅰ 卷内容\n\n让我们浏览一下第 Ⅰ 卷的内容：\n\n## 第 1 章：基础图像查看器\n\n1.1 创建 `Application`\
    \ 的子类 `ImageViewer`\n1.2 创建菜单栏\n1.3 创建选项菜单和视图子菜单\n1.4 实现适应宽度、适应高度和原始尺寸查看选项\n1.5\
    \ 总结\n\n## 第 2 章：具有浏览按钮的增强图像查看器\n\n2.1 添加下一页按钮\n2.2 调整下一页按钮在 `StackPane` 中的默认位置\n\
    2.3 添加上页按钮并调整其在 `StackPane` 中的位置\n2.4 实现鼠标点击事件处理程序\n2.5 图像查看器 V1.1 的完整源代码\n2.6\
    \ 总结\n\n## 第 3 章：具有幻灯片功能的增强图像查看器\n\n3.1 在 `BorderPane` 底部添加状态栏\n3.2 改进按钮的响应特性\n\
    3.3 添加幻灯片功能\n3.4 在幻灯片之间添加淡入淡出过渡\n3.5 图像查看器 V1.2 的完整源代码\n3.6 总结\n\n***图 1.*** JavaFX\
    \ 8 中图像查看器的截图。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_15_0.png)\n\n## 为什么选择这本书\n\
    \n本书面向倾向于使用 JavaFX 库开发丰富客户端应用程序的软件开发者。\n\nJavaFX 中的重要特性将通过真实世界 Java 应用的逐步开发进行说明。\n\
    \n书中使用了说明性图表帮助读者立即掌握抽象概念。每个章节使用的所有图表都是使用本系列书籍开发的图形工具创建的。\n\n如果你是以下人员，这本书将适合你：\n\
    \n- 刚接触 JavaFX 的 Java GUI 程序员（初学者或专业人士）。\n- 拥有 JavaFX 基础知识并想学习如何开发交互式草图绘制工具的 Java\
    \ 程序员。\n- 一个对面向对象的 JavaFX 图形工具开发和实际应用开发感兴趣，并寻求完整且文档良好的源代码的专业软件工程师。\n\n## 本书所需的准备\n\
    \n如果你想编译并运行书中的应用程序，需要下载并安装 JDK。这里是 JDK 8 的下载网站：http://www.oracle.com/technetwork/java/javase/downloads.html\n\
    \n为了编译并运行应用程序，建议：\n\n1. 安装 JDK。\n2. 在 PC 上安装 JavaFX。\n3. 从 JDK 8 中获取 JavaFX。\n\
    \n## 引言\n\n本系列书籍是关于使用 Java SE Development Kit 8 (JDK 8) 开发 GUI 的开发者教程。\n\nJavaFX\
    \ 中的重要特性将通过真实 Java 应用的逐步开发进行说明。\n\n本书的主要目标是通过逐步开发来介绍 JavaFX 的常用特性。\n\n书中包含了一组具有复用类的包的完整源代码，以及可嵌入的\
    \ JavaFX 应用。在运行这些应用程序之前，需要下载 JDK。这里是最新版本 JDK 的下载网站：http://www.oracle.com/technetwork/java/javase/downloads.html\n\
    \n## JavaFX 历史\n\n现在让我们回顾 JavaFX 的演进时间线并了解其前身：\n\n- SeeBeyond Technology 的 Chris\
    \ Oliver 在 2005 年开发了一种名为 F3 的语言，它是“形式随功能”的缩写；它允许开发者访问 Swing 类并创建用于快速开发富互联网应用程序的图形界面（GUI）。\n\
    - Sun Microsystems 在 2005 年 9 月收购了 SeeBeyond，F3 在 2007 年 5 月更名为 JavaFX Script。\n\
    - 2008 年 12 月发布 JavaFX 1.0，开发者一直依赖 JavaFX Script 开发应用程序，直到三年后 JavaFX 2.0 发布。\n\
    - 2010 年 1 月，Oracle 完成了对 Microsystems 的收购并继续维护 JavaFX。\n- 2010 年 9 月 JavaOne 大会上，Oracle\
    \ 宣布停止 JavaFX Script。\n- 2011 年 10 月发布 JavaFX 2.0，开发者开始使用标准  而不是 JavaFX Script\
    \ 来访问 JavaFX 库的 API。然而，编译和执行 JavaFX 2.0 除了 Java SE JDK 和 JRE 之外，还需要安装 JavaFX SDK\
    \ 和 JavaFX Runtime。\n- 2013 年 2 月发布 JavaFX 2.2.7，JavaFX SDK 和 JavaFX Runtime 已包含在\
    \ JDK/JRE 7 中。JavaFX 与 JDK 的集成为 JavaFX 开发者带来了极大的便利。使用 JDK 7 及后续版本编译的 JavaFX 应用程序不需要额外的安装。\n\
    - 2014 年 3 月 18 日，JavaFX 8 作为 Java™ SE Development Kit 8 (JDK 8) 的一部分发布，这是一个重大特性更新。\n\
    \n"
