  - "[PAGE 120]\n\n**2.6 Summary**\n\nThis chapter features the following key aspects\
    \ of JavaFX library, listing in the order of\n\ntheir appearance in the chapter:\n\
    \nGroup class, resides in javafx.scene.Group package, is a subclass of\n\njavafx.scene.Parent.\
    \ \n\n(See section Use Group as Parent Container)\n\nShape class, resides in javafx.scene.shape\
    \ package, provides functionality for\n\nrendering 2D geometric primitives such\
    \ as rectangle, polygon, etc. \n\n(See section Use Shape Class for Rendering 2D\
    \ Geometric Primitives)\n\nRectangle class, resides in javafx.scene.shape package,\
    \ is a direct subclass of\n\njavafx.scene.shape.Shape. It provides functionality\
    \ to draw rectangle shapes\n\nwith specified properties, such as x, y, width,\
    \ height, etc. \n\n(See sections: Use Shape Class for Rendering 2D Geometric Primitives,\
    \ and Use\n\nRectangle Shape as Bounding Box of Custom-Made Button)\n\nPolygon,\
    \ resides in javafx.scene.shape package, is a direct subclass of\n\njavafx.scene.shape.Shape.\
