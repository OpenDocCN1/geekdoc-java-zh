    \   14.0, 17.0,\n     5.0, 9.0};\npolygon.getPoints().addAll(dArray);\npolygon.setFill(Color.WHITE);\n\
    polygon.setStroke(Color.web(\"#436B8B\"));\n```\n\n下面的快照显示了通过上述代码渲染的 Polygon：\n\
    \n***图 2-3.*** 作为 Next 图标的多边形快照。\n\n![](img/ee16860d9fadf51c9ffb7191acdb087c_82_0.png)\n\
    \n## 2.1.7 为 **Node** 设置 **Cursor** 属性的值\n\n`cursor` 属性定义在 `Node` 类中，允许你更改此节点及其所有后代节点的鼠标光标。`Cursor`\
    \ 类位于 `javafx.scene` 包中并继承自 `java.lang.Object`，定义了一些可用的鼠标光标作为 `Cursor` 类型的静态字段，例如\
    \ `CLOSED_HAND`、`CROSSHAIR`、`DEFAULT`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT` 等。如果没有显式设置\
    \ `cursor` 属性的值，则使用默认箭头鼠标光标。\n\n我们使用 `Cursor.OPEN_HAND` 作为 Next 的鼠标光标。以下是代码片段：\n\
    \n```java\nGroup buttonGroup = new Group();\nbuttonGroup.setCursor(Cursor.OPEN_HAND);\n\
    ```\n\n## 2.1.8 使用便捷方法注册事件处理器来处理\n\n### 鼠标事件\n\n`EventHandler<T extends Event>`\
    \ 是一个继承自 `java.util.EventListener` 的接口，它定义了一个 `handle(T event)` 方法，当指定事件发生时会被调用。\n\
    \n我们将使用 `Node` 类提供的便捷方法来注册事件处理器，以处理鼠标事件类型，如 `MOUSE_CLICKED`、`MOUSE_ENTERED` 和\
