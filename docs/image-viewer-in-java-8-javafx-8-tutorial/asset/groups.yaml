    Reference to Oracle Online Documentation “Skinning JavaFX Applications with CSS”:


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm


    ## Creating User Interfaces using FXML


    FXML is a markup language which complies with the XML (Extensible Markup

    Language) format, with additional rules, for creating user interfaces of JavaFX

    applications. Considering hand coding FXML is error prone, a feasible approach
    is to

    generate FXML codes by means of GUI builders.


    In this book series, we present a useful application JFXDrawTools, it’s sort of
    a GUI

    builder specifically for creating instances of subclasses derived from Shape.
    Users can

    interactively create a sketch, either a Shape or an ImageView, manipulate its

    properties and save the editing results to files in FXML format, the files can
    later be

    loaded back to continue the editing process, or be loaded by other JavaFX applications

    dynamically.


    It is considered a good programming practice to separate application’s GUIs (the
    View)

    from its business logic (the Model). The FXML file represents the view, while
    controller is

    a java class which passes information between view and model. Constructing GUIs
    using

    FXML enables application developers to adopt the MVC (Model-View-Controller)

    architecture effectively.


    Reference to Oracle Online Documentation “JavaFX: Mastering FXML”:


    http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html


    ## Appealing Capacities of Properties and Binding


    The concept of Properties featured in JavaFX follows the design conventions introduced

    in the JavaBeans component, it usually works in connection with Binding mechanism,
    as a

    whole providing powerful yet sleek and succinct solutions to a variety of programming

    needs.


    In the JFXDrawTools application presented in this book series, we demonstrate
    the

    usage of Properties and Binding considerably. In the implementation of Properties

    Window, suitable UI controls, such as text field, choice box, combo box, etc.,
    are used for

    viewing the properties of a concerned object. Binding mechanism is employed to
    bi-

    directionally link the UI controls to their respective properties of the object,
    the

    relationship is set up as the Properties Window is about to show. When users changed
    data

    displayed in UI controls, the changes instantly reflect to the corresponding properties
    of

    the related object.


    Reference to Oracle Online Documentation “JavaFX: Properties and Binding Tutorial”:


    http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html


    ## Sophisticated Mechanism of Transformations and Transitions


    The JavaFX build-in capacity of transformations for nodes are so convenient for

    developing graphics packages such as graphics editors, drawing tools, image viewing

    applications, GUI builders, etc.


    Here are the classes that have dealings with transformations: Translate, Rotate,
    Scale

    and Shear. They are all derived from Transform class and located in

    javafx.scene.transform package.


    The JavaFX transitions provide concise approaches for creating animations. There
    are a

    host of applications in need of animation features, here are some cases: to draw
    attention

    in an alert situation, to throw objects into recycle bin during the removing operation,
    to

    indicate intermediate state during a data loading,…


    In the ImageViewer application presented in this book series, we apply

    FadeTransition and ParallelTransition onto image objects in a slideshow function
    to

    fade in the new image and fade out the old image simultaneously.


    Here are the classes that have dealings with transformations: FadeTransition,
    ParallelTransition,

    ScaleTransition, TranslateTransition, FillTransition, RotateTransition, Sequential

    Transition, PauseTransition. They are all derived from Transition class and located
    in

    javafx.animation package.


    Reference to Oracle Online Documentation “JavaFX: Transformations, Animations,
    and

    Visual Effects”:


    http://docs.oracle.com/javase/8/javafx/animation.html


    ## 2D Primitives and Text Are JavaFX


    JavaFX provides a Shape class which extends Node for drawing 2D primitives. Here
    are

    classes derived from Shape:

    - Arc

    - Circle

    - CubicCurve

    - Ellipse

    - Line

    - Polygon

    - Polyline

    - QuadCurve

    - Rectangle

    - Text


    All the others are located in javafx.scene.shape. Please note that Text class,
    located in

    scene, powers the development of text. Objects can be placed in layout pane to
    utilize

    the abilities, as well as customizing the presentation style using CSS.


    Reference to Oracle Online Documentation “Using Text in JavaFX”:


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text.html


    ## Other Prominent Capabilities That Carry Out Shorten Development Time


    ### ImageView for Loading and Displaying Images


    The ImageView class which extends javafx.scene.Node is used along with Image class
    to

    load and display images. JavaFX also provides APIs for performing operations over

    bitmap images, PixelReader is the interface defines read pixels from Image object,
    while

    PixelWriter defines write pixels to Image object. All of these are located in

    javafx.scene.image package.


    Reference to Oracle Online Documentation “Using Image Ops”:


    http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.html


    ### WebView for Managing Web Pages


    There is a web engine embedded in JavaFX architecture and providing

    a set of APIs, located in javafx.scene.web package, for developing applications

    with a web browser. To view a web page, first you create a WebView object which
    extends

    javafx.scene.Parent and inherits all the features of node, then obtain the WebEngine

    that associates with it. The WebEngine provides methods relevant to manipulating
    a web page, such as: loading/displaying the web page, either by given url or content
    of the page,

    accessing the Document Object Model (DOM) created by WebEngine for the

    loaded web page, handling a variety of events initiated from JavaScript,…


    Reference to Oracle Online Documentation “Adding HTML Content to JavaFX Applications”:


    http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html


    ### HTMLEditor for Editing HTML Pages


    The full support of HTML editing ability comes from HTMLEditor class, extends

    javafx.scene.control.Control, resides in javafx.scene.web package. To

    embed a HTML editor into your JavaFX application, you simply create an instance

    of HTMLEditor, add it to a scene graph, then it is ready to interact with users.
    The

    following two methods are useful to get and set the HTML content of the editor:

    - getHtmlText()

    - setHtmlText(java.lang.String htmlText)


    Unlike the similar control TextArea that handles multiple lines of plain text,
    the

    HTMLEditor formats text that complies with HTML syntax. The usage of the HTML
    editor are widely required in various fields of software,

    For example, bloggers writing articles to post (content management system), users

    of an Email System composing messages (messaging system), online sellers

    preparing product descriptions for listing (e-commerce management system),…etc.


    Reference to Oracle Online Documentation “Working with JavaFX UI Components —
    HTML

    Editor”:


    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.html


