    \ setHtmlText(java.lang.String htmlText).\n\nUnlike the similar control TextArea\
    \ that handles multiple lines of plain text, the\n\nHTMLEditor formats text that\
    \ complies with HTML syntax.\n\nThe usage of the HTML editor are widely required\
    \ in various fields of software,\n\nFor example, bloggers writing articles to\
    \ post (content management system), users\n\nof an Email System composing messages\
