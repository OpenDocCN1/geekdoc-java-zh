  md: "Thread. And the construction of a Scene object or a Stage object must be accessed\n\
    \nfrom JavaFX Application Thread as well.\n\n**1.1.2 Catch Resize Event of Image\
    \ Rendering Area**\n\nFor debugging and testing purpose at this point, we register\
    \ a ChangeListener\n\nproviding a changed method to be notified whenever width\
    \ or height of image rendering\n\narea is changed. Width or height of image rendering\
    \ area is changed when a user resizes\n\nthe application window.\n\nTo register\
    \ a ChangeListener to observe change of value for a property, we use this\n\n\
    method:\n\n void addListener(ChangeListener<? super T> listener)\n\n \n\ndefined\
    \ in javafx.beans.value.ObservableValue interface, providing\n\nimplementation\
    \ of changed(ObservableValue<? extends T> observable, T\n\noldValue, T newValue)\
    \ method, to be invoked when this property’s value is changed.\n\nThe same ChangeListener\
    \ is allowed to be registered to multiple\n\nObservableValues. To avoid memory\
    \ leak problem, it is a good programming practice\n\nto un-register a listener\
    \ whenever the value no longer need be observed, using\n\nremoveListener(ChangeListener<?\
    \ super T> listener) method, which removes\n\nthe link between an observable value\
    \ and a listener.\n\nStackPane class inherits width and height properties from\n\
    \njavafx.scene.layout.Region class. Both properties are type of\n\nReadOnlyDoubleProperty,\
    \ an abstract class that implements ObservableValue\n\ninterface. As the name\
    \ reveals, an ObservableValue holds a value that are observable,\n\nyou can listen\
    \ to the change of value and take actions as necessary.\n\nThe following codes\
    \ demonstrate how to watch the resize event of image rendering area, a\n\nStackPane\
    \ placed in the center of a BorderPane.\n\n***Import Statements:***\n\nimport\
    \ javafx.beans.value.ChangeListener;\n\nimport javafx.beans.value.ObservableValue;\n\
    \n***Listing 1-2.*** Add listeners to width property and height property of image\
    \ rendering area:\n\nimageArea.widthProperty().addListener(new ChangeListener<Object>()\
    \ {\n\n public void changed(ObservableValue o, Object oldVal,\n\n Object newVal)\
    \ {\n\n System.out.format(\"imageArea width changed from %.1f to %.1f%n\",\n\n\
    \ oldVal, newVal);\n\n }\n\n});"
