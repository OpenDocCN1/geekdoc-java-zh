  md: "import javafx.scene.control.RadioMenuItem;\n\nimport javafx.scene.control.Toggle;\n\
    \nimport javafx.scene.control.ToggleGroup;\n\n***Listing 1-9.*** Create Option\
    \ menu, ToggleGroup, RadioMenuItems, View submenu\n\nand add a listener for selectedToggle\
    \ property of the ToggleGroup:\n\n// Create Option menu\n\nMenu menuOption = new\
    \ Menu(\"Option\");\n\n// Create toggle group\n\nfinal ToggleGroup groupOption\
    \ = new ToggleGroup();\n\n// Create radio menu items\n\nfinal RadioMenuItem fitWidth\
    \ = new RadioMenuItem(\"Fit Width\");\n\nfitWidth.setToggleGroup(groupOption);\n\
    \nfinal RadioMenuItem fitHeight = new RadioMenuItem(\"Fit Height\");\n\nfitHeight.setToggleGroup(groupOption);\n\
    \nfinal RadioMenuItem original = new RadioMenuItem(\"Original Size\");\n\noriginal.setToggleGroup(groupOption);\n\
    \n// Add listener for toggle group\n\ngroupOption.selectedToggleProperty().addListener(new\
    \ ChangeListener<Toggle>\n\n public void changed(ObservableValue<? extends Toggle>\
    \ ov,\n\n Toggle old\\_toggle, Toggle new\\_toggle) {\n\n if (groupOption.getSelectedToggle()\
    \ != null) {\n\n RadioMenuItem choiceItem = (RadioMenuItem) groupOption.getSelectedTogg\n\
    \n if (choiceItem == fitWidth) {\n\n System.out.println(\"fitwidth\");\n\n } else\
    \ if (choiceItem == fitHeight) {\n\n System.out.println(\"fitheight\");\n\n }\
    \ else {\n\n System.out.println(\"original size\");\n\n }\n\n } \n\n }\n\n});\n\
    \n// Create View submenu for Option menu\n\nMenu menuView = new Menu(\"View\"\
    );\n\nmenuView.getItems().addAll(fitWidth, fitHeight, original);\n\n \n\n// Set\
    \ Original Size as default choice\n\noriginal.setSelected(true);\n\n// Add option\
    \ menu to menu bar\n\nmenuOption.getItems().add(menuView);\n\nmenuBar.getMenus().add(menuOption);\n\
    \n***Listing 1-10.*** Complete source codes of ImageViewer class become like this:\n\
    \npackage imageviewer;"
