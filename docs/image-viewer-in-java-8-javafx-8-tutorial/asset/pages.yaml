  md: "**2.4 Implement On Mouse Clicked Event Handlers**\n\nIn section Use Convenience\
    \ Methods to Register Event Handlers to Handle Mouse Events,\n\nwe have demonstrated\
    \ how to register an event handler for mouse clicked events. In this\n\nsection,\
    \ we’ll register the event handlers and implement the handle methods which are\n\
    \ninvoked when mouse clicked on the buttons. If Next button is clicked, the image\
    \ file next\n\nto the current loaded file will be loaded, and if Previous button\
    \ is clicked, the image file\n\nbefore the current loaded file will be loaded.\n\
    \nBefore we proceed these tasks properly, we’ll configure a FileChooser to show\
    \ only\n\nfiles whose extensions matching the specified filters, and establish\
    \ a list of files existing in\n\nthe current directory, the list is created whenever\
    \ an image file is opened from the File\n\nOpen Dialog of a FileChooser.\n\n**2.4.1\
    \ Configure ****FileChooser**\n\nTo configure a FileChooser, we use FileChooser.ExtensionFilter\
    \ class to define\n\nfile extension filters to show files with the following extensions:\
    \ “\\*.bmp”, “\\*.gif”,\n\n“\\*.jpeg”, “\\*.jpg”, “\\*.png”.\n\nThe getExtensionFilters\
    \ method provided in FileChooser class is called to obtain a\n\nlist of type ObservableList<FileChooser.ExtensionFilter>,\
    \ then using the\n\naddAll method to add as many filters as needed. We define\
    \ a FileUtils class to tackle the\n\nproblem. Codes are as follows:\n\n***Listing\
    \ 2-9.*** Define FileUtils class, providing a static method configure to add file\n\
    \nextension filters for a given FileChooser:\n\npackage imageviewer;\n\nimport\
    \ javafx.stage.FileChooser;\n\n/\\*\\*\n\n \\* File Name: FileUtils.java\n\n \\\
    * (in directory: ImageViewer1.1/src/example4/imageviewer/)\n\n \\*\n\n \\* @author\
    \ Shufen Kuo\n\n \\*/\n\npublic class FileUtils {\n\n /\\*\\*\n\n \\* Define file\
    \ extension filters to filtering supported image files,\n\n \\* matching files\
    \ whose extensions are:\n\n \\* .bmp, .gif, .jpeg, .jpg and .png\n\n \\* @param\
    \ fileChooser \n\n \\*/\n\n static void configure(FileChooser fileChooser) {\n\
    \n fileChooser.getExtensionFilters().addAll("
