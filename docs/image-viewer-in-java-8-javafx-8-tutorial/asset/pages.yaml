  md: "**2.4.2 Create List Iterator to Iterate Existing Files in the Current Directory**\n\
    \nTo establish a list of files exists in the current directory whenever an image\
    \ file is opened\n\nfrom a File Open Dialog, we’ll use API’s provided in java.nio.file\
    \ package which is\n\nintroduced in the JDK 7 release.\n\nThe following static\
    \ method provided in java.nio.file.Files class,\n\nstatic DirectoryStream<Path>\
    \ newDirectoryStream(Path dir, String glob\n\nopens a given directory, returning\
    \ a DirectoryStream<Path>. The type\n\nDirectoryStream is an interface which extends\
    \ iterable, thus can be applied with the\n\nfor-each syntax to iterate files in\
    \ a directory.\n\nHere’s the snippet of codes to read a directory and add file\
    \ one by one to a list:\n\n List<Path> list = new ArrayList<>();\n\n try (DirectoryStream<Path>\
    \ stream = Files.newDirectoryStream(dir,\n\n \"\\*.{bmp,gif,jpeg,jpg,png}\"))\
