    \ dealings with transformations: Translate, Rotate, Scale\n\nand Shear. They are\
    \ all derived from Transform class and located in\n\njavafx.scene.transform package.\n\
    \nThe JavaFX transitions provide concise approaches for creating animations. There\
    \ are a\n\nhost of applications in need of animation features, here are some cases:\
    \ to draw attention\n\nin an alert situation, to throw objects into recycle bin\
    \ during the removing operation, to\n\nindicate intermediate state during a data\
    \ loading,…\n\nIn the ImageViewer application presented in this book series, we\
    \ apply\n\nFadeTransition and ParallelTransition onto image objects in a slideshow\
    \ function to\n\nfade in the new image and fade out the old image simultaneously.\n\
    \nHere are the classes that have dealings with transitions: FadeTransition,\n\n\
    RotateTransition, ScaleTransition, TranslateTransition, FillTransition,\n\nStrokeTransition,\
    \ PathTransition, ParallelTransition, SequentialTransition,\n\nPauseTransition.\
    \ They are all derived from Transition class, an abstract class defines\n\nbasic\
    \ functionality of animations, and located in javafx.animation package.\n\nReference\
    \ to Oracle Online Documentation “JavaFX: Transformations, Animations, and Visual\
    \ Effects”: \n\nhttp://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html\n\
    \n**2D Geometric Primitives and Text Are JavaFX Nodes**\n\nJavaFX provides a Shape\
    \ class which extends javafx.scene.Node class and is the\n\nsuperclass of basic\
    \ forms of 2D geometry. The object-oriented concept imposed on the\n\ngeometric\
    \ primitives facilitates the development of graphics applications.\n\nHere are\
    \ classes derived from Shape class: Arc, Circle, CubicCurve, Ellipse, Line,\n\n\
    Path, Polygon, Polyline, QuadCurve, Rectangle, SVGPath, Text. Except the\n\nText\
    \ class, all the others are located in javafx.scene.shape package.\n\nPlease note\
    \ that Text class, located in javafx.scene.text package, considered a shape\n\n\
    as well, powers the development of text drawing tools. All features common to\
    \ JavaFX\n\nnodes can be applied to text objects. You handle it just like any\
    \ geometric form. Text\n\nobjects can be placed in a layout pane to utilize the\
    \ automatic placement abilities, applying\n\ntransformations and transitions,\
    \ as well as customizing the presentation style using CSS,\n\netc.\n\nReference\
    \ to Oracle Online Documentation “Using Text in JavaFX”: \n\nhttp://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm\n\
