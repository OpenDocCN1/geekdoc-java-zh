  md: "package imageviewer;\n\nimport javafx.application.Application;\n\nimport javafx.scene.Scene;\n\
    \nimport javafx.scene.layout.BorderPane;\n\nimport javafx.scene.layout.StackPane;\n\
    \nimport javafx.stage.Stage;\n\n/\\*\\*\n\n \\* File Name: ImageViewer.java\n\n\
    \ \\*\n\n \\* This application creates a BorderPane as root node of a scene, and\n\
    \n \\* add a StackPane in the center of BorderPane\n\n \\* The initial size of\
    \ the scene is set to 600 by 400\n\n \\* The size of StackPane will be automatically\
    \ set to fit the size of scene\n\n \\* StackPane will be resized when window size\
    \ is adjusted by a user\n\n \\*/\n\npublic class ImageViewer extends Application\
    \ {\n\n @Override\n\n public void start(Stage stage) {\n\n BorderPane rootPane\
    \ = new BorderPane();\n\n StackPane imageArea = new StackPane();\n\n rootPane.setCenter(imageArea);\n\
    \n Scene scene = new Scene(rootPane, 600, 400); \n\n stage.setTitle(\"ImageViewer\
    \ V1.0\");\n\n stage.setScene(scene);\n\n stage.show();\n\n }\n\n public static\
    \ void main(String\\[\\] args) {\n\n launch(args);\n\n }\n\n}\n\n**1.1.1 JavaFX\
    \ Application Thread vs. Java Launcher Thread**\n\nApplication class is the entry\
    \ point of a JavaFX application. It defines the following\n\nsignificant methods:\n\
    \npublic void init() throws Exception\n\npublic abstract void start(Stage primaryStage)\
    \ throws Exception\n\npublic void stop() throws Exception\n\nThe init method,\
    \ which does nothing, is called from Java launcher thread. While the\n\nstart\
    \ method, an abstract and must be overridden, is called from JavaFX Application\n\
    \nThread after init method has returned. If you need do some initial works before\
    \ start\n\nmethod, you can do that by overriding init method; however it is crucial\
    \ to notice that\n\nnodes that are members of a live scene must be accessed from\
    \ JavaFX Application"
