  md: "**3.3 Add Slide Show Capabilities**\n\nOnce an image file is opened from a\
    \ FileChooser‘s File Open Dialog, the application\n\nobtains a list of image files\
    \ that exist in the current directory. One favorable feature is to\n\nallow users\
    \ to browse over these images one by one without manually clicking the Next\n\n\
    button. The steps to implement slide show mechanism are illustrated as follows.\n\
    \n**3.3.1 Add ****Start Slideshow**** and ****Stop Slideshow**** Menu Items**\n\
    \nThe simplest GUI employed here is MenuItem. Two menu items, Start Slideshow\n\
    \nand Stop Slideshow, are added to Option menu of a menu bar, initially they are\
    \ both\n\ndisabled. To distinguish if there is a slide show running or not, a\
    \ variable\n\nisSlideshowOn of type BooleanProperty is defined as class field\
    \ of ImageViewer\n\nclass and is initialized to false. The following snippets\
    \ of codes show how to accomplish\n\nthese:\n\n***Import Statements:***\n\nimport\
    \ javafx.beans.property.BooleanProperty;\n\nimport javafx.beans.property.SimpleBooleanProperty;\n\
    \n***Listing 3-14.*** Add Start Slideshow and Stop Slideshow menu items:\n\npublic\
    \ class ImageViewer extends Application {\n\n ...\n\n final BooleanProperty isSlideshowOn\
    \ = new SimpleBooleanProperty(false);\n\n ...\n\n @Override\n\n public void start(final\
    \ Stage stage) {\n\n ...\n\n // Create start/stop slideshow menu items\n\n final\
    \ MenuItem startSlide = new MenuItem(\"Start Slideshow\");\n\n final MenuItem\
    \ stopSlide = new MenuItem(\"Stop Slideshow\");\n\n startSlide.disableProperty().bind(isSlideshowOn.or(\n\
    \n nextButton.disableProperty()));\n\n stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\
    \n nextButton.disableProperty()));\n\n \n\n // Add action handler for Start Slideshow\
    \ menu item\n\n startSlide.setOnAction(new EventHandler<ActionEvent>() {\n\n @Override\n\
    \n public void handle(ActionEvent ae) {\n\n System.out.println(\"Start Slideshow…\"\
    );"
