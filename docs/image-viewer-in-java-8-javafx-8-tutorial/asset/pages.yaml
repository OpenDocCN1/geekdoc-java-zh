    \ coding FXML is error prone, a feasible approach is to\n\ngenerate FXML codes\
    \ by means of GUI builders.\n\nIn this book series, we present a useful application\
    \ JFXDrawTools, it’s sort of a GUI\n\nbuilder specifically for creating instances\
    \ of subclasses derived from Shape. Users can\n\ninteractively create a sketch,\
    \ either a Shape or an ImageView, manipulate its\n\nproperties and save the editing\
    \ results to files in FXML format, the files can later be\n\nloaded back to continue\
    \ the editing process, or be loaded by other JavaFX applications\n\ndynamically.\n\
    \nIt is considered a good programming practice to separate application’s GUIs\
    \ (the View)\n\nfrom its business logic (the Model). The FXML file represents\
    \ the view, while controller is\n\na java class which passes information between\
    \ view and model. Constructing GUIs using\n\nFXML enables application developers\
    \ to adopt the MVC (Model-View-Controller)\n\narchitecture effectively.\n\nReference\
    \ to Oracle Online Documentation “JavaFX: Mastering FXML”:\n\nhttp://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html\n\
    \n**Appealing Capacities of Properties and Binding**\n\nThe concept of Properties\
    \ featured in JavaFX follows the design conventions introduced\n\nin the JavaBeans\
    \ component, it usually works in connection with Binding mechanism, as a\n\nwhole\
    \ providing powerful yet sleek and succinct solutions to a variety of programming\n\
    \nneeds.\n\nIn the JFXDrawTools application presented in this book series, we\
    \ demonstrate the\n\nusage of Properties and Binding considerably. In the implementation\
    \ of Properties\n\nWindow, suitable UI controls, such as text field, choice box,\
    \ combo box, etc., are used for\n\nviewing the properties of a concerned object.\
    \ Binding mechanism is employed to bi-\n\ndirectionally link the UI controls to\
    \ their respective properties of the object, the\n\nrelationship is set up as\
    \ the Properties Window is about to show. When users changed data\n\ndisplayed\
    \ in UI controls, the changes instantly reflect to the corresponding properties\
    \ of\n\nthe related object.\n\nReference to Oracle Online Documentation “JavaFX:\
    \ Properties and Binding Tutorial”: \n\nhttp://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html\n\
    \n**Sophisticated Mechanism of Transformations and Transitions**\n\nThe JavaFX\
    \ build-in capacity of transformations for nodes are so convenient for"
