    \ PixelReader is the interface defines\n\nmethods to read pixels from an Image\
    \ object, while PixelWriter defines\n\nmethods to write pixels to an Image object.\
    \ All of these are located in\n\njavafx.scene.image package.\n\nReference to Oracle\
    \ Online Documentation “Using the Image Ops API”: \n\nhttp://docs.oracle.com/javase/8/javafx/graphics-tutorial/image\\\
    _ops.htm\n\nWebView Class for Managing Web Pages\n\nThere is a web engine component\
