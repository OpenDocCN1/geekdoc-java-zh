    \ To view a web page, first you create a\n\nWebView object which extends javafx.scene.Parent\
    \ and inherits all the\n\nfeatures of a node, then obtain the WebEngine that associates\
    \ with it. The\n\nWebEngine provides methods relevant to manipulating a web page,\
    \ such as:\n\nloading/displaying the web page, either by given a url or content\
    \ of the page,\n\naccessing the Document Object Model (DOM) created by WebEngine\
    \ for the\n\nloaded web page, handling a variety of events initiated from JavaScript,…etc.\n\
    \nReference to Oracle Online Documentation “JavaFX: Adding HTML Content to JavaFX\
