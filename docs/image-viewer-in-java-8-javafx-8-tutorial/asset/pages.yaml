    \nHTMLEditor Class for Editing HTML Pages\n\nThe full support of HTML editing\
    \ ability comes from HTMLEditor class, extends\n\njavafx.scene.control.Control,\
    \ resides in javafx.scene.web package. To\n\nembed a HTML editor into your JavaFX\
    \ application, you simply create an instance\n\nof HTMLEditor, add it to a scene\
    \ graph, then it is ready to interact with users. The\n\nfollowing two methods\
