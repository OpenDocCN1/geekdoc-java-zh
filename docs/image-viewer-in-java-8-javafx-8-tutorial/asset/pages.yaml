  md: "which. The call() method is invoked when a task is started.\n\nService\n\n\
    An abstract class that extends java.lang.Object and implements Worker<V\\>\n\n\
    interface, is a reusable Worker object. The Service class provides methods such\n\
    \nas start(), cancel(), reset(), and restart() to manipulate this service when\n\
    \nneeded.\n\nOverride the createTask() method while creating a Service object,\
    \ or creating a\n\nsubclass of which. The createTask() method is invoked when\
    \ a service is started.\n\nScheduledService\n\nA direct subclass of Service class,\
    \ allows specifying the duration of delay to start\n\nand restart a service automatically.\n\
    \nWorkerStateEvent\n\nA subclass of javafx.event.Event, defines static fields\
    \ of EventTypes such as\n\nWORKER\\_STATE\\_CANCELLED, WORKER\\_STATE\\_FAILED,\n\
    \nWORKER\\_STATE\\_READY, WORKER\\_STATE\\_RUNNING,\n\nWORKER\\_STATE\\_SUCCEEDED,\
    \ etc. A WorkerStateEvent occurs when\n\nthe state of a Worker is changed.\n\n\
    Consider our situation: a file list is created when a file is first loaded, suppose\
    \ the file list\n\ncontains one or more next file(s) to view, then the Start Slideshow\
    \ menu item is\n\nenabled, a user can start a slide show, cancel it while the\
    \ slide show is on, and later restart\n\nit again. To fulfill this scenario, we\
    \ prefer a reusable Service object to a one-time Task\n\nobject.\n\n3.3.2.1 Create\
    \ SlideshowService Class that Extends Service Class\n\nWe need to create a class\
    \ that extends Service<V> class. When a Service is started, it\n\nexecutes a Task.\
    \ The createTask method below need be overridden:\n\n protected abstract Task<V>\
    \ createTask()\n\n \n\nIn the createTask() method, the call() method is overridden\
    \ while a Task object is\n\ncreated to be returned to the caller.\n\nThe call()\
    \ method in a Task, undertakes the task of a slide show, basically contains a\n\
    \nwhile loop that loads images one by one until either one of the following conditions\n\
    \nbecomes true: there’s no more next image in the file list, or the slide show\
    \ is canceled by a\n\nuser.\n\nThe following listing demonstrates how to create\
    \ a reusable SlideshowService, a\n\nsubclass of Service class, to carry on a slide\
    \ show task."
