  md: "**A Glimpse of JavaFX Applications**\n\nThe following example is for readers\
    \ who are new to JavaFX to have a quick preview of\n\nhow to create a JavaFX application.\n\
    \nTo get started, you create a class that extends javafx.application.Application,\
    \ the\n\nentry point of JavaFX applications, and override the start method that\
    \ is abstract must be\n\noverridden. Here’s what a typical start method looks\
    \ like:\n\npackage imageviewer;\n\nimport javafx.application.Application;\n\n\
    import javafx.scene.Scene;\n\nimport javafx.scene.layout.BorderPane;\n\nimport\
    \ javafx.scene.layout.StackPane;\n\nimport javafx.stage.Stage;\n\n/\\*\\*\n\n\
    \ \\* File Name: ImageViewer.java\n\n \\*\n\n \\* @author Shufen Kuo\n\n \\*/\n\
    \npublic class ImageViewer extends **Application** {\n\n @Override\n\n public\
    \ void start(**Stage stage**) {\n\n BorderPane rootPane = new BorderPane();\n\n\
    \ StackPane imageArea = new StackPane();\n\n rootPane.getChildren().add(imageArea);\n\
    \n** Scene scene = new Scene(rootPane, 600, 400);** \n\n stage.setTitle(\"ImageViewer\
    \ V1.0\");\n\n stage.setScene(scene);\n\n stage.show();\n\n }\n\n public static\
    \ void main(String\\[\\] args) {\n\n launch(args);\n\n }\n\n}\n\n**Scene and Stage**\n\
    \nThere are two important classes, Scene and Stage, appears within the start method.\
    \ In\n\ngeneral, the main task is to create graphical user interfaces (GUIs) managed\
    \ in hierarchical\n\ntree structure called a scene graph, associate the root node\
    \ of the scene graph to a Scene\n\nobject, then place the scene on a Stage object\
    \ which stands for the top-level container of\n\nthe FavaFX application, acting\
    \ as the window of the scene graph to interact with\n\napplication users."
  merge: -1
