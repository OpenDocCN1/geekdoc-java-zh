  md: "**3.4 Add Fade Transition between Slides**\n\nTo accent the movement of a slide\
    \ show, we’ll add fade transition between slides. Here are\n\nclasses from javafx.animation\
    \ package for animations of fade transitions:\n\nAnimation\n\nAn abstract class\
    \ extends java.lang.Object, provides common properties and\n\nmethods required\
    \ among animations.\n\nTransition\n\nAn abstract class extends Animation, provides\
    \ common properties and methods\n\nrequired among transition animations. Here\
    \ are available transitions:\n\nFadeTransition, FillTransition, ParallelTransition,\
    \ PathTransition,\n\nPauseTransition, RotateTransition, ScaleTransition,\n\nSequentialTransition,\
    \ StrokeTransition, TranslateTransition.\n\nFadeTransition\n\nA direct subclass\
    \ of Transition﹐changes the opacity of a node over the given\n\nduration.\n\n\
    ParallelTransition\n\nA direct subclass of Transition, conducts transitions over\
    \ a list of Animation\n\nobjects, type of ObservableList<Animation>, in a parallel\
    \ manner.\n\nThis is the constructor we’ll use to create FadeTransition objects:\n\
    \n public FadeTransition(Duration duration, Node node)\n\n \n\nDuration class,\
    \ resides in javafx.util package, provides several factory methods\n\nfor creating\
    \ duration objects. Here’s the one employed:\n\n public static Duration millis(double\
    \ ms) \n\n \n\nThe above method creates a Duration of given milliseconds for a\
    \ FadeTransition.\n\nA FadeTransition looks into the following properties:\n\n\
    duration\n\nType of ObjectProperty<Duration>, holds the duration of transiting\
    \ the\n\nopacity from fromValue to toValue. The value of this property is specified\n\
    \nas the first argument of the constructor.\n\nnode\n\nType of ObjectProperty<Node>,\
    \ holds the target node conducted for this\n\nfade transition. The value of this\
    \ property is specified as the second argument\n\nof the constructor."
