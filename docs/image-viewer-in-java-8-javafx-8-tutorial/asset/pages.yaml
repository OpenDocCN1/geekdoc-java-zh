  md: "**1.3 Create Option Menu and View Submenu**\n\nWe need an Option menu allowing\
    \ a user to choose preferred viewing criteria. The\n\nOption Menu contains a View\
    \ submenu which contains three mutually exclusive\n\nchoices, they are as follows:\n\
    \nFit Width\n\nRender an image on an area by scaling fitWidth property of an ImageView,\n\
    \nwhile preserving original width/height ratio, to fit the width of current available\n\
    \nimage viewing space.\n\nFit Height\n\nRender an image on an area by scaling\
    \ fitHeight property of an ImageView,\n\nwhile preserving original width/height\
    \ ratio, to fit the height of current available\n\nimage viewing space.\n\nOriginal\
    \ Size\n\nRender an image in its original size, the outer portion of image that\
    \ exceeds the\n\nboundary of current available viewing space will be blocked.\
    \ This is set as the\n\ninitial viewing option.\n\nPlease note that the available\
    \ image viewing space is determined by current width and\n\nheight of the application\
    \ window, called a Stage, which subsequently is subject to the\n\ncurrent size\
    \ of a Scene, the container of a scene graph. Initially the scene is set to 600\n\
    \npixels by 400 pixels, thus, the size of available image rendering space will\
    \ be same as the\n\nsize of the scene. After we added a menu bar at the top of\
    \ BorderPane, which is the root\n\nnode of the scene, the height of available\
    \ image rendering space becomes height of scene\n\nminus height of menu bar, while\
    \ the width remains the same.\n\n**1.3.1 Create Toggle Group, Radio Menu Items\
    \ and Add Listener for**\n\n**selectedToggle**** Property**\n\nTo implement mutually\
    \ exclusive choices in a menu, we create RadioMenuItem objects\n\nand a single\
    \ ToggleGroup object, then associate each RadioMenuItem to the same\n\nToggleGroup.\n\
    \nTo watch the change of selected radio menu item, we use:\n\n void addListener(ChangeListener<?\
    \ super T> listener)\n\n \n\nto register a ChangeListener for selectedToggle property\
    \ of ToggleGroup object.\n\nThe following snippets of codes show how to accomplish\
    \ these tasks.\n\n***Import Statements:***"
