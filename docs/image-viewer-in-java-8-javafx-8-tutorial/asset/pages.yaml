  md: "**2.2 Adjust ****Next**** Button’s Default Position in ****StackPane**\n\n\
    In this section, we will demonstrate how to place a child node of a StackPane\
    \ in the\n\ndesired location.\n\nA StackPane places all its children in a stack\
    \ with the center as default alignment. That\n\nis, by default StackPane’s children\
    \ overlap each other in the center of the pane.\n\nPlacing a Next button in the\
    \ center of a StackPane is not feasible in our application.\n\nFortunately, StackPane\
    \ provides two static methods:\n\npublic static void setAlignment(Node child,\
    \ Pos value)\n\npublic static void setMargin(Node child, Insets value)\n\nallowing\
    \ us to adjust individual child node’s position. The preferred position of a Next\n\
    \nbutton is on the right side of the window, within the visible boundary of a\
    \ scene. The\n\nfollowing snippets of codes adjust the default location of a next\
    \ button.\n\n***Import Statement:***\n\nimport javafx.geometry.Insets;\n\nimport\
    \ javafx.geometry.Pos;\n\n***Listing 2-6.*** Use StackPane‘s static Methods setAlignment\
    \ and setMargin to adjust\n\nthe default position of a Next button:\n\n StackPane.setAlignment(nextButton,\
    \ Pos.CENTER\\_RIGHT);\n\n StackPane.setMargin(nextButton, new Insets(8));\n\n\
    The following snapshot shows a Next button positioned on the right side of application\n\
    \nwindow.\n\n***Figure 2-6.*** Snapshot of a Next button on the right side of\
    \ window, within the visible\n\nboundary of a scene."
