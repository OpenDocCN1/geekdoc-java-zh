    _swing.htm\n\nJavaFX is the next generation of Java GUIs. To account for the benefits\
    \ of employing\n\nJavaFX capabilities, besides the Interoperability between JavaFX\
    \ and Swing, we present\n\nthe significant features of JavaFX in the section below."
