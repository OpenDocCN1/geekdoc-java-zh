    \ stopSlide);\n\n ...\n\n3.3.1.1 Bind Disable Property of Menu Item\n\nInitially\
    \ startSlide and stopSlide menu items are disabled because of the following\n\n\
    bind statements.\n\n startSlide.disableProperty().bind(isSlideshowOn.or(\n\n nextButton.disableProperty()));\n\
    \n stopSlide.disableProperty().bind(isSlideshowOn.not().or(\n\n nextButton.disableProperty()));\n\
    \n \n\nIn above binding statements, two logical operations—or and not—are used\
    \ to compute\n\nvalue for disable property. The javafx.beans.binding.BooleanExpression\
    \ class,\n\nan abstract class that implements ObservableBooleanValue, provides\
    \ these methods:\n\npublic BooleanBinding not() method\n\nperforms a logical NOT\
    \ operation on this BooleanExpression, and returns an\n\nobject of type BooleanBinding\
    \ which is a direct subclass of\n\nBooleanExpression.\n\npublic BooleanBinding\
    \ or(ObservableBooleanValue other) method\n\nperforms a logical OR operation on\
    \ this BooleanExpression and a given\n\nObservableBooleanValue, and returns an\
    \ object of type BooleanBinding\n\nwhich is a direct subclass of BooleanExpression.\n\
    \nThe Start Slideshow menu item is disabled if either a slide show is currently\
    \ running\n\nor the Next button is disabled. Similarly, the Stop Slideshow menu\
    \ item is disabled if\n\neither a slide show is not running or the Next button\
    \ is disabled. Remember that the\n\nNext button is disabled when there is no next\
    \ image to view."
