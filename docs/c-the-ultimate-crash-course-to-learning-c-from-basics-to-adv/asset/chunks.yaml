    \    a) 指针\n    b) 条件\n    c) 循环\n\n# 第 5 章 – 指针\n\n指针使某些任务变得简单，而且相当易用。指针被定义为存储另一个变量地址的变量。与变量类似，在使用之前必须对其进行定义。`type\
    \ *var-name;`\n\n当使用指针时，类型取决于指向的类型。例如，如果我的指针指向一个 `double`，那么我的指针必须是 `double`。`var-name`\
    \ 是你指针的名称。必须使用星号来表示指针。\n\n`int *int_point;` // 指向整数的指针\n`double *dou_point;` //\
