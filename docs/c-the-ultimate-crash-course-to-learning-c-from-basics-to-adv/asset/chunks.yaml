    # Chapter 2 – Basic Input & Output


    One of the most common functions of programming is input and output.  Within C++
    input and output occur in streams.  Streams are also known as sequences of bytes. 


    If the given bytes originate from a keyboard or a disk drive and flow to the main
    memory, this is categorized as an input operation. Output is categorized as the
    flow of bytes from the main memory to a screen or monitor. 


