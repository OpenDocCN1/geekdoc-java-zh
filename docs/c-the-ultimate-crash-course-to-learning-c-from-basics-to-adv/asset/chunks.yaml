    \ 解释为 `-15,536`。C++ 中有三种限定符。这些包括 `const`、`volatile` 和 `restrict`。`const` 用于程序运行时不能更改的对象。`volatile`\
    \ 则相反，该类型的值在整个程序过程中即使以未指定的方式可能会发生变化。`restrict` 作为其限定符只能通过指针检索。\n\n## 关键字\n\nC++\
    \ 与许多编程语言一样，也使用一组关键字。关键字是语言中具有特殊含义的单词，不能以任何其他方式使用。它们由于其特殊含义而被保留。\n\n![images/00013.jpeg](img/00013.jpeg)\n\
    \n## 注释\n\n注释是任何程序的重要组成部分，它们允许读者或开发者理解你程序的意图以及每行代码的作用。在代码中创建注释有两种方法。\n\n`/* 这是一个多行注释，因为它可以跨越超过\
    \ 1 行 */ //这是一个单行注释。`\n\n## C++ 基础练习\n\n1. 什么 `<iostream>` 被称为什么？\n   a) 指令 (directive)\n\
    \   b) 预处理指令 (pre-processor directive)\n   c) 文件 (file)\n\n2. `namespace` 在编码时有任何意义吗？如果不使用它，我们还能使用\
    \ `cout` 和 `cin` 吗？\n   a) 是\n   b) 否 \n"
- fmt: "\nThe `cout` object is an instance of the `ostream` class, which is connected\
    \ to the output device or monitor. This is a fairly simply command and is most\
    \ times used in conjunction with `cin` although it can be used without it.\n\n\
    ![](images/00016.jpeg)Run the program below in order to accurately see the `cout`\
    \ statement at work.\n\nThe output for the above program should be the correct\
    \ value of `c`, with the given statement.\n\nTwo important things to note in this\
    \ program include the insert operator, `<<` and the `endl`. The `endl` is used\
    \ to add a new line to the end of the given string line. The `<<` can be used\
    \ multiple times, as we can see above.\n\n## Using cin\n\nThe use of `cin` allows\
    \ the user to input information into a given variable. This object belongs to\
    \ the `istream` family, which is attached to the input device which is generally\
    \ a device similar to a keyboard. The extraction operator is the opposite of the\
    \ insertion operator. It is simply `>>`, which will be seen in the program example\
    \ below.\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main( )\
    \ {\n    char petname[40];\n    char yourname[60];\n    cout << \"Please enter\
    \ the name of your pet: \";\n    cin >> petname;\n    cout << \"Your name is:\
    \ \" << petname << endl;\n    cout << \"Please enter your full name: \";\n   \
    \ cin >> yourname;\n    cout << \"Your name is: \" << yourname << endl;\n}\n```\n\
    \nUpon running the program, you will be prompted to enter in your pet’s name.\
    \ It will then be printed. You will then be prompted to enter your name and it\
    \ will be printed as well.\n\nTry this exercise on your own for more input and\
    \ output practice.\n\n1. ![](images/00017.jpeg)Answer the prompt below so that\
    \ the input amounts are 23, 55.7 and 12.\n\n# Chapter 3 – Conditionals\n\nAnother\
    \ major component in C++ programming is the use of conditionals. Conditionals\
    \ are statements that cause a program to alter its intended path based on a program’s\
    \ current value. One of the first and most basic conditional statements to be\
    \ discussed is an `if` statement.\n\nBefore going into various types of conditional\
    \ statements we must first know which relational operands to use within our statements\
    \ and what they mean.\n\n![361854_b364_4](images/00018.jpeg)\n\n- Greater Than\
    \ `8 > 6` TRUE\n- Less Than `1 < 9` TRUE\n- `>=` Greater Than or Equal `3 >= 0`\
    \ TRUE\n- `<=` less than or equal `6 <= 10` TRUE\n- `==` equal to `6 == 6` TRUE\n\
    - `!=` not equal to `7 != 3` TRUE\n- `&&` AND\n- `||` OR\n- `!` NOT\n\n## Using\
    \ If Statements\n\nIn order to fully understand if if statements within C++ you\
    \ must first understand how they function\n\nThe structure of an `if` statement\
    \ is as follows:\n\n```cpp\nif (TRUE)\n{\n    Perform the next statement\n}\n\n\
    if (TRUE)\n{\n    Perform this block of statements if True\n}\nelse\n{\n    Perform\
    \ this block of statement if False\n}\n```\n\nIn the first example, if the given\
    \ expression is true, the statement will implement. However, in the second statement,\
    \ if the statement is true, the statement will execute but if the statement is\
    \ false, the `else` statement will execute.\n\n![633832_b4e7_2](images/00019.jpeg)\n\
    \n![](images/00020.jpeg)The following program will demonstrate how if statements\
    \ operate and execute.\n\nAs you may have guessed, there will also be times when\
    \ more than one `if` statement is needed. Therefore, multiple `if` statements\
    \ can be used.\n\nThe example program below shows how multiple `if` statements\
    \ execute. In order to successfully execute multiple `if` statements we can use\
    \ a block.\n\n![](images/00021.jpeg)\n\nBlocks are essentially the use of the\
    \ brackets `{}`. Using these brackets allows the user to tell program where to\
    \ start and end an `if` statement. In the event that the blocks are not specified\
    \ the program is smart enough to implicitly define blocks.\n\n`if` statements\
    \ can also be chained together by using `else if` as shown in the program below.\n\
    \nAside from the ability to input `if` statements, nesting `if` statements are\
    \ also possible to do in C++. The following is an example of nesting.\n\n![](images/00022.jpeg)The\
    \ above code is confusing because of missing brackets. Adding blocks around the\
    \ `else` would make the code clearer. This ambiguity is known as a dangling else.\n\
    \n![](images/00023.jpeg)Still confused on how to implement an `if` or `if-else`\
    \ statement. Use the questions below as practice.\n\n1. Which of the following\
    \ provide the correct structure for an `if` statement?\nA. `if this then that`\n\
    B. `if {expression}`\nC. `if (expression )`\nD. `else if`\n\n2. Write a program\
    \ that allows the user to input a number into the system. The program should then\
    \ tell the user 2 separate `if` statements if the number is greater or less than\
    \ 50. This will be done using input and condition statements. If the number is\
    \ greater than 50 the program should print, “Wow, this number is big”. If the\
    \ number is less than 50 the program should print, “Yikes, this number is too”.\n\
    \n3. If `x` is equal to 10 and `y` is equal to 30 will this condition execute?\
    \ `if(x > y)`\na) yes\nb) no\n\n4. What do conditions do for programs?\na) improves\
    \ processing\nb) adds flexibility to a program while lessening its length\nc)\
    \ breaks them\n\n5. What does an `else` statement do?\na) gives an alternative\
    \ route to the given conditions\nb) never executes\nc) it looks good in the program\n\
    \n6. What do the following condition mean within the context of a conditional?\
    \ `if (a!=b)`\na) a is equal to b\nb) checks if a does not equal b\nc) None of\
    \ the above are true\n\n7. In an `if` statement when do you need the curly braces?\n\
    a) always\nb) generally they should be used where there are 2 more lines in the\
    \ condition statement.\nc) never\n\n8. What does the following condition mean\
    \ in plain English? `if (y!=x)`\na) if y doesn't equal x\nb) if x doesn't equal\
    \ y\nc) if x is less than\n\n9. If `a` is equivalent to 20 and `b` is equivalent\
    \ to 20 will this condition execute? `if (a!=b)`\na) yes\nb) no\n\n10. What does\
    \ the following statement mean? `if (a==b)`\na) if a is greater than b\nb) if\
    \ a is equal to b\nc) if b is greater or equal to a\n\n11. If `x` is equivalent\
    \ to 20 and `y` is equals to 8 is the following condition abled to be executed?\
    \ `if(x<=y)`\na) yes\nb) no\n\n### Solutions\n\n1. C.\n2.```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    cout << \"Enter your number \" << endl;\n\
    \    int number;\n    cin >> number;\n    if(number < 50)\n    {\n        cout\
    \ << \"Yikes, this number is too small\";\n    }\n    else\n    {\n        cout\
    \ << \"Wow, this number is big.\";\n    }\n    return 0;\n}\n```\n3. b) no\n4.\
    \ b) adds flexibility to a program while lessening its length\n5. a) gives an\
    \ alternative route to the given conditions\n6. b) checks if a does not equal\
    \ b\n7. b) generally they should be used where there are 2 or more lines in the\
    \ condition statement.\n8. a) if y doesn't equal x\n9. b) no\n10. b) if a is equal\
    \ to b\n11. b) no\n\n## Loops\n\nAside from conditional statements, loops are\
    \ utilized when parts of code need to be repeated. Instead of rewriting or copying\
    \ sections of code, loops are used. Loops allow a user to repeat certain portions\
    \ of code over and over until its completion.\n\nThe simplest loop which exists\
    \ in a C++ program is the `for` loop. The syntax for a `for` loop is as follows:\n\
    \n```cpp\nfor ( variable initialization; condition; variable update ) {\n    Statements\
    \ to be executed as long as condition, in parentheses is true.\n}\n```\n\nLoops\
    \ utilize 2 operands you must be familiar with in order to progress any further.\
    \ These are the increment and decrement symbols (`++` and `--`).\n\nIn order to\
    \ further break down the structure of a `for` loop, see the example below.\n\n\
    ![](images/00024.jpeg)\n\nThe code in the `for` loop above will execute until\
    \ the counter variable reaches 4. Once the variable reaches 5, it will no longer\
    \ execute since it will not meet the `for` loop condition.\n"
