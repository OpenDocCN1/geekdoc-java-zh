    ```cpp

    int d = 33;

    ```


    在上面的示例中，`c` 和 `d` 都是左值（l-values）：


    ```cpp

    c = d;

    d = c;

    c = c * d;

    ```


    在上述项中，`c * d` 是右值（rvalue）。


    ```cpp

    int e = c * d;

    ```


    这条语句是可以的，因为右值位于赋值的右侧。


    ```cpp

    c * d = 47;

    ```


    这条语句是不允许的，因为右值位于赋值的左侧。


    ![codeish-v1-0-lightblue](img/00060.jpeg)


    这些右值引用（rvalue references）的原因是移动语义（move semantics）。移动不能直接与对象的拷贝相比较。在移动过程中，目标对象从源内部获取资源。这本质上使得源对象失去了任何资源或处于“空”状态。在不需要或可能发生昂贵拷贝时，通常会使用移动操作。


    为了充分发挥移动语义的潜力（包括利用性能提升），应该考虑字符串交换。


    一个非常基础的实现看起来类似于下面的示例：


    ```cpp

    void basicswap(string &b, string & c){

    string temporary = b;

    b=c;

    c= temporary;

    }

    ```


    上面的示例可以被归类为基础或浅素的，因为这种实现被认为是昂贵的。字符串的拷贝意味着必须分配原始内存。这意味着字符需要从源移动到目标。而，当字符串被移动时，数据成员仅被简单的交换。这在不分配内存、不删除内存且不拷贝字符的情况下即可完成。


    ![Top-10-IDE’s-For-C_C-Copy](img/00061.jpeg)


    右值引用的行为与普通引用相似。然而，右值引用有几个例外。


    除了解决移动语义问题外，它还试图解决完美转发（perfect forwarding）。完美转发允许开发者编写构造函数或函数，并将参数作为右值或左值进行转发。


    以下代码展示了字符串的移动，它仅仅交换了两个数据成员。这样做不需要分配或删除内存，也不需要拷贝字符数组。


    ```cpp

    void moveswap(string& blank, string & full){

    //伪代码

    size_t sz=blank.size();

    const char *p= blank.data();

    //将 full 的资源移动到 blank

    empty.setsize(full.size());

    empty.setdata(full.data());

    //full 变为 blank

    full.setsize(sz);

    full.setdata(p);

    }

    ```


    在实现支持移动的类时，可以声明移动构造函数和赋值运算符。这类似于下所示的内容。


    ```cpp

    class Ablemove

    {

    Ablemove (Ablemove &&); //移动构造函数

    Ablemove && operator=( Ablemove &&); //移动赋值运算符

    };

    ```


    需要注意的是，C++11 标准库极地利用了移动语义。因此，大量的算法和容器现在都经过了移动优化。


    ## C++11 标准库


    ![terminal](img/00062.jpeg)


    技术报告 1（Library Technical report 1）首次引入于 C++03。随着该库的实现，C++ 经历了重大的重构。它包含了各种新的容器类，以及用于正则表达式、函数包装器等组件的新库。随着
    C++11 的到来，技术报告 1 正式并入标准。这带来了许多新库。


    C++11 在 C++ 语言中引入了大量新库，包括：


    * 正则表达式库

    * 线程库

    * 原子操作库

    * 容器库中的各种特性


    ## 线程库


    C++11 的一个显著新增是增加了并发（concurrency），也称为同时执行多条指令。C++11 现在为开发者提供了一个 `thread` 类，代表一个执行线程。这被称为承诺（promises）和未来（futures）。这些是主要用于在并发环境中进行同步的对象。


    使用新的线程功能非常简单，将在下面的示例中进行演示。这只需简单地添加线程头文件：


    ```cpp

    #include <thread>

    ```


    接下来的示例仅利用了“Hello World”，这是编程教程中最基础的示例。


    ![](img/00063.jpeg)


    在你的机器上运行上述代码。C++11 还允许在线程中使用参数。我们能够添加任意数量的参数。以下代码已修改为使用参数并展示了给定的输出。


    ![](img/00064.jpeg)


    ![](img/00065.jpeg)


    你可能会注意到某些结果是困惑或混乱的。这是因为所有线程恰好在竞争同一个资源。该资源是 `stdout`。


    通过互斥锁（mutexes）或屏障（barriers）可以避免这些混乱的结果。这些屏障允许开发者组织线程如何共享特定资源。


    ## 新的智能指针类


    ![c-2-min1](img/00066.jpeg)


    如果你不知道，智能指针目前定义在内存头文件的 `std` 命名空间中。它们是 RAII 的关键因素。RAII 全称为“资源获取初始化”（Resource Acquisition
    Initialization），确保资源获取在对象初始化的同时发生。C++ 之前的版本（C++98）中有一个智能指针类。该类是 `auto_ptr`，它现在已被废弃。C++11
    引入了两个新的智能指针类：`shared_ptr` 和 `unique_ptr`。这两个新组件与标准库的其他组件兼容。因此，指针可以存储在标准容器中并在标准算法处理。


    ![prog_langs](img/00067.jpeg)


    以下定义取自 MDSN.com，并准确地解释了这些新库组件。


    ### unique_ptr


    `unique_ptr` 的底层指针仅允许一个所有者。除非你确定需要 `shared_ptr`，否则应作为默认选择。它可以移动到新的所有者，但不能拷贝。对比
    `boost::scoped_ptr`。`unique_ptr` 体小且高效；其大小为一个指针，并支持右值引用以便从 STL 集合中插入和检索。头文件：`<memory>`。


    下面的图说明了所有权如何在两个 `unique_ptr` 之间转移。


    ![Moving the ownership of a unique_ptr](img/00068.jpeg)


    示例演示了如何在代码中传递和创建 `unique_ptr` 实例。


    ![](img/00069.jpeg)


    ### shared_ptr


    这种指针类型是引用计数智能指针。当多个指针需要分配同一个原始指针的所有权时（例如，从容器返回指针副本但想保留原始指针时）。一旦所有 `shared_ptr`
    所有者离开作用域或放弃所有权，原始指针就可以被删除。其大小为两个指针；对象使用其中一个指针，共享控制块中的引用计数使用另一个。头文件：`<memory>`。


    下面的图显示了多个 `shared_ptr` 指向同一个内存位置。


    ![Shared pointer](img/00070.jpeg)


    以下代码示例说明了 `shared_ptr` 实例声明和初始化。一旦分配了对象，这些实例将获得该对象的所有权。


    ![](img/00071.jpeg)


    共享指针也可以传递给其他函数。这可以通过以下方式实现：


    * 按值传递

    * 按引用传递


