    在 `C++14` 出现之前，不支持像 `11111101` 这样的二进制字面量。为了使用它们，需要将它们转换为支持的类型。下面的代码段展示了它们在编程中的用法。


    ![](img/00097.jpeg)


    二进制字面量以 `0b` 或 `0B` 开头。前缀之后是一系列 0 和 1。在许多其他编程语言中也可以找到类似的语法。这些编程语言包括 `Java`、`Perl`
    和 `Python`，它们都已经提供了对二进制字面量的支持。


    二进制字面量的类型为 `int`。它在所有接受常量字面量的地方都可以被接受。


    ## 变量模板


    变量模板的设计意目的是让编码更简单，并简化常量的定义和使用。变量模板本质上是一组变量的定义。变量是通过在声明变量的地方使用模板声明创建的。


    ![C-4-562x309-OPx](img/00098.jpeg)


    这些仅仅是 `C++14` 引入的一些特性。还引入了许多其他特性，但它们并不是重大的进展。包含在 `C++14` 中的一些次要特性包括尺寸初始化和一些语法清理。虽然
    `C++14` 的版本更新不像 `C++11` 那样如此重大，但它是必要的。


    ## 结论


    恭喜你，通过学习和应用每一章列出的内容，你已经读完了这本书！记住，这只是一个开始。为了真正精通 `C++`，你必须不断地学习并应用你所学的知识。既然你已经开启了
    `C++` 之之旅，保持警惕是十分重要的。


    `C++` 是一种通用语言，可以适用于各种大型系统，也可以适用于较小的系统。在创建商业应用时，它是一种突出的语言。有大量使用 `C++` 编写的项目，包括：


    * 如 `Linux` 和 `Mac OS X` 等操作系统

    * 如《魔兽世界》和《暗黑破坏》系列等游戏

    * 流行的 `Wii`、`PlayStation` & `XBOX` 游戏

    * 编程语言的虚拟机（这些语言包括 `Python`、`Java`、`Rudy`、`PFP`、`Perl`）

    * 热门软件如 `MS Office`、`Adobe Photoshop`、`Inventor` 和 `AutoCAD`

    * 浏览器（`Chrome`、`Internet Explorer` 和 `Firefox`）

    * 许多 `Apple iOS` 应用


    这个列表证明了 `C++` 是一种能够胜任几乎工作的通用语言。


    如果你在想 `C++` 在明天或未来 10 年是否仍然适用，那么答案是肯定的！


    `C++` 结合其前身 `C` 提供了对硬件的访问和高层次的抽象。它是仅次于 `C` 的第三常用语言（在 `Java` 之后位居第二）。目前还没有竞争对手可以取代
    `C++`。


    `C++` 速度快，并且能够有效高效地利用资源。大多数高质量的嵌入式应用程序都是使用 `C` 和 `C++` 创建的。


    `C++` 于 1985 年 10 月首次实现商业化。`C++` 在其整个生命周期内持续演进，并遵循一套独特的规则。这些规则包括以下内容。这些规则源自 `Bjarne
    Stroustrup` 编写的《在现实世界中为了演进语言：C++ 1991-2006》。


    ### 通用规则


    * `C++` 的演进必须由真实的问题驱动。

    * 不要陷入毫无意义的完美追求中。

    * `C++` 现在必须是实用的。

    * 每个特性都必须有合理易见的实现方式。

    * 始终提供过渡路径。

    * `C++` 是一门语言，而不是一个完整的系统。

    * 为每种支持风格提供全面的支持。

    * 不要试图强制人们使用特定的编程风格。


    ### 设计支持规则：


    * 支持合理的设计理念。

    * 提供程序组织所需的设施。

    * 有话直说。

    * 所有特性都应该是可负担得起的。

    * 允许实用的特性比防止所有的误用更重要。

    * 支持从单独开发的部分组合成软件。


    ### 语言技术规则：


    * 不得隐式违反静态类型系统。

    * 为用户定义类型提供与内置类型同等良好的支持。

    * 局部性是好的。

    * 避免顺序依赖。

    * 如果不确定，选择最容易教学的特性变体。

    * 语法很重要（通常以扭曲的方式）。

    * 应该消除预处理器的使用。


    ### 低级编程支持规则：


    * 使用传统的（笨的）链接器。

    * 不要与 `C` 产生无故的不兼容。

    * 在 `C++` 之下不留给更底层语言的空间（汇编除外）。

    * 你不使用的就不需要付费（零开销原则）。

    * 如果不确定，提供手动控制的手段。


    总来说，人们使用 `C++` 有许多原因。简单来说，`C++` 是：


    * 灵活 – `C++` 是灵活的，因为它没有强制使用某种编程语言的限制。它可以几乎毫不费力地用于各种应用领域。

    * 高效 – 支配 `C++` 的基本概念反映了日常计算机的原理。

    * 可用 – 在所有计算机上通常都有可用的 `C` 编译器。还有其他工具和资源可用，使得开发者不需要从零开始编写项目。

    * 可移植 – 移植使用 `C++` 的项目非常简单可行。


    你已经学习了 `C++11` 和 `C++14` 的区别，以及它们提供的功能。然而，你的知识并不止于此。


    为了有效高效地在使用 `C++11` 和 `C++14` 时获得动力，你必须坚持这样做。这涉及到不断地学习、阅读和应用这些内容。很快你就能精通 `C++17`。尽管它尚未发布，但展望未来并做好准备是重要的。


    ![Без названия](img/00099.jpeg)


    非常感谢你购买这本书！


    希望你会喜欢阅读。如果你想帮助我制作更多此类材料，请在 Amazon 上留下好评。


    这真的很有帮助！


    我认为这些书也会对你感兴趣：


    [Windows 10](https://www.amazon.com/dp/B06XJ57Y5H)


