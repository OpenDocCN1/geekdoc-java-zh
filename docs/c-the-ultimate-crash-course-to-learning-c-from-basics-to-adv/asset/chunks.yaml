    ## Using Modifiers & Qualifiers


    Modifiers can also be used on various types.  Modifiers can indicate the sign
    of a number or provide more detailed information about a variable.  Modifiers
    can be used on characters, integers and anything of the type double.   Modifiers
    are used to manipulate variables into fitting into precise scenarios.


    Data type modifier types include:


    *   Unsigned


    *   Signed


    *   Short


    *   Long


    ![](images/00010.jpeg)![](images/00011.jpeg)


    ![](images/00012.jpeg)Run the following program in order to get a better understanding
    modifiers.


    The output of the program is: -15536 <-- Variable 1 and Variable 2 --> 50000. 
    The output found above is due to bit pattern that represents 50,000 as a short
    unsigned integer is interpreted as -15,536 by a short.


    There are 3 types of qualifiers in C++.  These include const (constant), volatile
    and restrict.


    Const is used for objects that cannot be changed when your program running. Volatile
    is the opposite, the value in a variable of this type may be changed throughout
    the program even in ways not explicitly specified.  A pointer with restrict as
    its qualifier can only be retrieved through said pointer.


    ## Keywords


    C++, like many programming languages, also uses a set of keywords.  Keywords are
    words in a language with a special meaning that may not be used in any other way. 
    They are reserved due to their special meaning.


