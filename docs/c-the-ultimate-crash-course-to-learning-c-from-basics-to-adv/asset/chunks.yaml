    \ the type is whatever the type is. For example, if my pointer is pointing to\
    \ a `double`, my pointer must be a `double`. The `var-name` is the name of your\
    \ pointer. The asterisk must be used in order to denote a pointer.\n\n`int *int_point;`\
    \ // pointer to integer\n`double *dou_point;` // pointer to double\n`float *flo_point;`\
    \ // pointer to float\n`char *ch_point;` // pointer to character\n\nThe following\
