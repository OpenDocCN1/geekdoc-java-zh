    \ code to get a better understanding of pointers.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main () {\n  int variable = 10; // actual declaration.\n\
    \  int *ipointer; // pointer variable\n  cout << \"Value of variable: \";\n  cout\
    \ << variable << endl; // access the value available in pointer\n  cout << \"\
    Value of ipointer: \";\n  cout << *ipointer << endl;\n  return 0;\n}\n```\n\n\
    ## Null Pointers\n\nA pointer that is assigned to `NULL` is referred to as a null\
    \ pointer. A null pointer is assigned at the time of declaration. The null pointer\
    \ is generally constant and holds a value of zero.\n\n## Pointer Math\n\nBeing\
    \ that pointers hold values for numbers, they also have the ability to perform\
    \ arithmetic. In some programs the developer may choose to use a pointer instead\
    \ of an array. This is because pointers can be incremented and arrays can’t without\
    \ the help of a loop. The following program shows how to successfully increment\
    \ the variable pointer to access each element of an array:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main () {\n  int var[MAX]\
    \ = {10,100,200,300};\n  int *ptr; // let us have array address in pointer.\n\
    \  ptr = var;\n  for (int j = 0; j < MAX; j++) {\n    cout << \"Value of var[\"\
    \ << j << \"] = \";\n    cout << *ptr << endl; // point to the next location\n\
    \    ptr++;\n  }\n  return 0;\n}\n```\n\nBeing that pointers can be incremented,\
    \ they can also be decremented. Run the following code to show how a pointer is\
    \ decremented:\n\n```cpp\n#include <iostream>\nusing namespace std;\nconst int\
    \ MAX = 4;\nint main () {\n  int var[MAX] = {10,100,200,300};\n  int *ptr;\n \
    \ ptr = &var[MAX-1];\n  for (int j = MAX; j > 0; j--) {\n    cout << \"Value of\
    \ var[\" << j << \"] = \";\n    cout << *ptr << endl; // point to the previous\
    \ location\n    ptr--;\n  }\n  return 0;\n}\n```\n\nAside from incrementing and\
