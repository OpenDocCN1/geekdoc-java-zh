    Up until the advent of `C++14` binary literals like `11111101` were not supported.
    IN order to use them they needed to be converted to a supported type. The following
    code snippet shows how they are used in programming.


    ![](images/00097.jpeg)


    Binary laterals begin with `0b` or `0B`. This prefix is then followed by a series
    of zeros and ones. A similar syntax can be found in a variety of other programming
    languages. The programming languages include `Java`, `Perl` and `Python`, all
    of which already provide support for binary literals.


    The binary literal has a type of `int`. It is accepted in all places that a constant
    literal is accepted.


    ## Variable Template


    The intended purpose of a variable template is to make coding easier and simplify
    definitions and the use of constants. A variable template essentially is the definition
    for a group of variables. A variable template is created by using a template declaration
    at the place at which a variable is declared.


    ![C-4-562x309-OPx](images/00098.jpeg)


    These are simply a few of the features which were introduced with `C++14`. A number
    of other features were introduced but are not strong advancements. Some of the
    minor features which were included with `C++14` include sized deal locations and
    some syntax tidying. Although the `C++14` versioning does not compare to the major
    updates in `C++11` it is necessary.


    ## Conclusion


    Congratulations, you have reached the end of this book by learning and applying
    the things listed in each chapter! Remember that this is only the beginning. In
    order to truly master `C++` you must continuously learn and apply the things you
    are learning. Now that you have begun your journey with `C++` it is pertinent
    that you stay vigilant.


    `C++` is a general language that can work with a variety of huge systems, as well
    as smaller ones. It is a prominent language when creating commercial apps. There
    are large variety of items written in `C++`, these include:


    * Operating systems like `Linux` and `Mac OS X`

    * Games like `World of Warcraft` and the `Diablo series`

    * Popular `Wii`, `PlayStation` & `XBOX` games

    * Virtual Machines for programming languages (These languages include `Python`,
    `Java`, `Rudy`, `PFP`, `Perl`)

    * Popular software like `MS Office`, `Adobe Photoshop`, `Inventor` and `AutoCAD`)

    * Web Browsers (`Chrome`, `Internet Explorer` and `Firefox`)

    * Many `Apple iOS` applications


    This list proves that `C++` is a general language that has the power to do almost
    anything.


    If you’re wondering if `C++` will still be relevant tomorrow or in the next 10
    years, the answer is YES!


    `C++` in conjunction with its predecessor `C` provide access to hardware and a
    high level of abstraction. It is the third most used language after `C`, which
    falls behind `Java` as the number one. As of now there is no rival in place to
    replace `C++`.


    `C++` is fast and able to effectively and efficiently use resources. Most fair
    quality applications are created within `C` and `C++` for embedded systems.


    `C++` was first commercially implemented in October of 1985. `C++` has had continued
    evolution throughout its life cycle and it follows a distinct set rules. These
    rules include the following. These rules have been taken from `Evolving a language
    in and for the real world: C++ 1991-2006` by `Bjarne Stroustrup`.


    ### General rules


    * `C++`’s evolution must be driven by real problems.

    * Don’t get involved in a sterile quest for perfection.

    * `C++` must be useful now.

    * Every feature must have a reasonably obvious implementation.

    * Always provide a transition path.

    * `C++` is a language, not a complete system.

    * Provide comprehensive support for each supported style.

    * Don’t try to force people to use a specific programming style.


    ### Design support rules:


    * Support sound design notions.

    * Provide facilities for program organization.

    * Say what you mean.

    * All features must be affordable.

    * It is more important to allow a useful feature than to prevent every misuse.

    * Support composition of software from separately developed parts.


    ### Language-technical rules:


    * No implicit violations of the static type system.

    * Provide as good support for user-defined types as for built-in types.

    * Locality is good.

    * Avoid order dependencies.

    * If in doubt, pick the variant of a feature that is easiest to teach.

    * Syntax matters (often in perverse ways).

    * Preprocessor usage should be eliminated.


    ### Low-level programming support rules:


    * Use traditional (dumb) linkers.

    * No gratuitous incompatibilities with `C`.

    * Leave no room for a lower-level language below `C++` (except assembler).

    * What you don’t use, you don’t pay for (zero-overhead rule).

    * If in doubt, provide means for manual control.


    Overall there are a multitude of reasons why people use `C++`. Simply put, `C++`
    is:


    * Flexible – `C++` is flexible because it has no limitations that would mandate
    a certain programming language be used. It can be used in a variety of application
    areas almost effortlessly.

    * Efficient – The fundamental concepts governing `C++` mirror that of an everyday
    computer.

    * Available – On all computers there is generally an available `C` compiler. There
    are also tools and other resources available so that developers do not need to
    write items from scratch.

    * Portable – Porting items used with `C++` is fairly simple and feasible.


    You have learned the differences between `C++11` and `C++14`, as well as what
    they have to offer. However, your knowledge doesn’t stop there.


    To fully gain momentum in programming effectively and efficiently using `C++11`
    and `C++14`, you must continue to do so. That involves learning, reading and applying
    these things on a constant and consistent basis. Soon you’ll be mastering `C++17`.
    Although not yet released, it is important to look ahead and be prepared for what
    is coming.


    ![Без названия](images/00099.jpeg)


    Thank you very much for getting this book!


    I hope, that you will really enjoy reading it. If you want to help me to produce
    more materials like this, then please leave a positive review on Amazon.


    It really does make a difference!


