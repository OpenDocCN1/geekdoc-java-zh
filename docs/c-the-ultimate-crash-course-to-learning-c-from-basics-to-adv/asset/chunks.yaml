    # 引言


    如果你正在阅读这本书，意味着你正在主动学习 `C++`。`C++` 最初由 Bjarne Stroustrup 于 1979 年开发。它是一种通用且高效的编程语言，具有不可替代性。


    `C++` 是 `C` 编程语言的扩展。Bjarne 对 `SIMULA` 语言及其面向对象模型的理解帮助他为 `C` 创建了类扩展。它最初被名为 C withClasses，后来更命名为
    `C++`。


    `C++` 具有多种特性。这些特性包括：


    - `C++` 是高效率的。

    - `C++` 是一种静态编程语言。

    - `C++` 是一种面向对象的语言：对象的使用允许通过 `classes` 和 `objects` 将较大的程序分解为较小的集合。

    - `C++` 是多范式的：这让开发者能够自由选择他们使用的编程风格。共有 7 种不同的风格供选择。

    - `C++` 利用标准库：这意味着 `C++` 能够通过利用库项来扩展其语言的功能。


    学习 `C++` 可以让你的简历提升到一个新水平。它仍然用于许多主流应用程序、游戏、浏览器等领域。人们不断地开发和扩展 `C++` 的功能。像 `Github`
    这样的开源平台拥有成千上万个 `C++` 仓库。


    随着 `C++` 的增长，`C++` 开发者的机会也在增加。在这些职位中平均薪资可达 100,000 美元，每月有数千职位招聘。


    尽管这本书是一个完美的起点，但不要期望一夜就能学会 `C++`。这门语言需要实践、坚持和毅力。如果你在疑惑，不，在掌握 `C++` 之前并不需要知道 `C`。


    请将以下章节和练习作为你 `C++` 编程之旅的路线图，知识在等待着。


    # 第 1 章 – 入门 C++


    ![toptal-blog-image-1485966944883-7529aa202bf60d8bb7895e863c508d96](img/00001.jpeg)


    在开始使用 `C++` 开发之前，你必须首先搭建一个允许你高效工作的环境。话虽如此，你需要一种运行和编译你的 `C++` 程序的方法。这可以通过许多方式实现。这些方法包括：


    1. **在线**：在线运行和编译程序是避免过度下载或安装新软件的简单方法。在快速运行程序时这也是一个很好的选择。有很多网站可以实现。由于易于使用，本书将采用此选项。`Ideone.com`
    是完成此事的极选择。

    2. **Mac OS X**：可以使用名为 `XCode` 的程序在 MAC 操作系统上运行程序。可以从 Apple 开发者页面下载。建议使用最新版本。

    3. **Linux**：为了在 `Linux` 机器上高效运行程序，你需要安装一个编译器。`GNU GCC` 是针对初学者或在该操作系统上新编程的用户的推荐编译器。你还需要下载一个文本编辑器，`Gedit`
    就是一个例子。

    4. **Windows**：由于 Windows 是一个标准且广泛的平台，有 `Blocks` 或 `Eclipse` 可用。


    为了更好地理解 `C++`，我们将观察它的结构。


    ![](img/00002.jpeg)

    `C++` 的第一行指的是 `std`。


    ![](img/00003.jpeg)

    `C++` 的主体指的是 `main function`。


    ![](img/00004.jpeg)

    `C++` 的示例指的是 `std`。


    ![](img/00005.jpeg)

    `C++` 的最后一行指的是 `main function`。


    ![](img/00006.jpeg)

    `C++` 的最小单元指的是 `main function`。


    ![](img/00007.jpeg)

    上面的示例输出将为。


    ![](img/00008.jpeg)

