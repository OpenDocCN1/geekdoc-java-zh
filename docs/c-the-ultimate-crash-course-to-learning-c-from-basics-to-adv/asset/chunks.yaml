    \n以下示例显示了存储在指针中的信息，运行以下代码可以更好地理解指针。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nint main () {\n  int variable = 10; // 实际声明\n  int *ipointer; // 指针变量\n\
    \  cout << \"Value of variable: \";\n  cout << variable << endl; // 访问指针可用可用\n\
    \  cout << \"Value of ipointer: \";\n  cout << *ipointer << endl;\n  return 0;\n\
    }\n```\n\n## 空指针\n\n赋值 `NULL` 的指针称为空指针。空指针在声明时赋值。空指针通常是常量且其值为零。\n\n## 指针运算\n\n\
    由于指针存储的是数值，它们也具有算术运算的能力。在某些程序中，开发者可能会选择使用指针而不是数组。这是因为指针可以增加而数组在没有循环帮助的情况下不能。以下程序显示了如何成功增加变量指针以访问数组的每个元素：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main\
    \ () {\n  int var[MAX] = {10,100,200,300};\n  int *ptr; // 让指针持有数组地址\n  ptr =\
    \ var;\n  for (int j = 0; j < MAX; j++) {\n    cout << *ptr << endl;\n    ptr++;\n\
    \  }\n  return 0;\n}\n```\n\n由于指针存储的是数值，它们也具有算术运算的能力。在某些程序中，开发者可能会选择使用指针而不是数组。以下代码显示了指针可以递增：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main\
    \ () {\n  int var[MAX] = {10,100,200,300};\n  int *ptr; // 让指针持有数组地址\n  ptr =\
    \ var;\n  for (int j = 0; j < MAX; j++) {\n    cout << *ptr << endl;\n    ptr++;\n\
    \  }\n  return 0;\n}\n```\n\n由于指针可以递增，它们也可以递减。运行以下代码显示指针如何递减：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nconst int MAX = 4;\nint main () {\n  int var[MAX]\
    \ = {10,100,200,300};\n  int *ptr; // 让指针持有数组地址\n  ptr = var + MAX-1;\n  for (int\
    \ j = MAX-1; j >= 0; j--) {\n    cout << *ptr << endl;\n    ptr--;\n  }\n  return\
    \ 0;\n}\n```\n\n除了递增递减，指针还可以使用关系运算符进行比较。这包括 `==`、`<` 和 `>`。\n\n# 第 6 章 – 函数\n\n\
    函数是极其用的代码段，为了完成特定任务而编写。当它们结合使用时，可以创建更复杂、简洁的程序。函数的结构如下所示。请注意，原型是函数声明的另一种分类方式。\n\
    \n`返回值 名称 (数据类型变量, 数据类型变量...)`\n\n- **返回值**：返回值指的是函数在完成后返回的内容。例如，如果我创建一个计算学生平均年龄的程序，我会使用\
    \ `int`，因为我不需要小数。因此，截断是可以的。我的返回类型将是 `int`。\n- **名称**：这是函数的名称。在相同的示例中，我可以此函数命名为\
    \ `average_age`。\n- **数据类型**：数据类型指的是变量。这些是函数可以接收并使用的项。可以是一个，也可以是多个。\n\n函数的开头看起来如下所示：\n\
    `int average_age(int x, int y)`\n\n原型的位置在示例所示：\n\n```cpp\n#include <iostream>\n\
    int average_age (int x, int y);\nint main() {\n  //主程序\n  return 0;\n}\nint average_age\
    \ (int x, int y) // 注意这里没有分号\n{\n  //函数将写在这里\n}\n```\n\n运行以下程序作为示例，以查看函数如何运作。以下程序中的函数用于相加两个变量并返回它们的和。\n\
    \n// 完整的工作程序\n```cpp\n#include <iostream>\ndouble summation (int a, int b); //\
    \ 原型\nint main() {\n  int x,y;\n  double c;\n  cin>>x; // 用户输入 x 的值\n  cin>>y;\
    \ // 用户输入 y 的值\n  c = summation(x,y); // 调用函数 summation 并传递读入的变量\n  cout << \"\
    The sum of the 2 numbers is \" << c << endl;\n  return 0;\n}\ndouble summation\
    \ (int a, int b)\n{\n  return a + b;\n}\n```\n\n"
