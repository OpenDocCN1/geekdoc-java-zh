    * 传递给底层对象


    ## 新 C++ 算法


    C++11 还引入了多种新算法。确切来说有 8 种算法。这些新算法包括：


    * `all_of()`

    * `any_of()`

    * `none_of()`

    * `is_sorted()`

    * `is_sorted_until()`

    * `is_partitioned()`

    * `is_permutation()`

    * `minmax_element()`


    ### All_of, any_of, none_of 算法


    这三个算法非常相似。它们本质是检查一元谓词是否对无、全部或部分元素返回 true。


    ![](img/00072.jpeg)


    ### is_sorted()


    该算法本质上是检查特定范围内的元素是否按升序排列。该范围内的元素使用 `operator<` 进行比较。它们也会使用 `comp`（二元比较函数）进行比较。


    下面是它的用法示例以及给定的输出。


    ![](img/00073.jpeg)

    ![](img/00074.jpeg)


    ### Is_sorted_until()


    该算法与 `is_sorted()` 算法类似。它通过检查一组元素是否按升序排列来执行相同的功能，但该算法返回一个迭代器。该迭代器指向最大子范围的边界（upper
    bound）。该范围显然是有序的。下面是一个使用 `is_sorted_until()` 的程序示例及其给定的输出。


    ![](img/00075.jpeg)

    ![](img/00076.jpeg)


    ### Is_partitioned()


    该算法的作用完全如其名称所描述。它检查一个范围是否被划分（partitioned）。这意味着它检查一个范围是否根据给定的一元谓词进行了排序。所有不满足给定谓词的元素必须返回在满足条件的元素之后。


    下面的程序展示了如何使用 `is_partitioned()` 算法的示例。


    ![](img/00077.jpeg)


    ### Minmax_element()


    `minmax_element()` 算法在给定范围内寻找最小值和最大值。一旦成功运行，它会返回对应元素的迭代器对。关于该算法必须记住的三点包括：


    * 当给定的范围没有值或为空时，算法将简单地返回 `std::make_pair(first, first)`。

    * 如果在定的值集中存在多个最小值，它将仅返回第一个。

    * 如果在给定的值集中存在多个最大值，它将仅返回最后一个。


    在下面的代码中可以看到该函数的用法，以及其给定的输出：


    ![](img/00078.jpeg)

    ![](img/00079.jpeg)


    ### Is_permutation()


    该算法用于确定一个元素范围是否是另一个元素范围的排列（permutation）。下面是 `is_permutation` 的用法示例。


    ![](img/00080.jpeg)


    总的来说，C++11 整合了许多变化。变化之多以至于某些人认为它几乎是一门不同的语言。你需要时间来适应这些变化。不要指望一夜就能理解所有它们。C++14 对
    C++11 引入的许多内容进行了重大修订。下一章将重点提供这些组件以及相应的示例。


    # 第 10 章 – 新版本：C++ 14


    C++14 于 2014 年 12 月发布。在发布之前，它经常被称为“C++1y”。C++14 为核心语言增加了大量的更新。在许多情况下，C++14 是在
    C++11 添加的功能的基础上的。总的来说，这是一个更精细的版本，对用户的影响更小。


    ![grade-28199_960_720](img/00081.jpeg)


    ## 返回类型推导


    C++11 引入了 lambda 表达式并允许它们根据表达式确定返回类型。这个新版本赋予了所有函数这种能力。需要使用 `auto` 来确定返回类型。


    ![](img/00082.jpeg)


    ## 放宽 constexpr constexpr


    ![cpp_lesson1](img/00083.jpeg)


    C++11 还引入了 `constexpr` 函数的概念。这本质上可以在编译时执行的函数。在 C++11 中，`constexpr` 函数只能有一个表达式。


    C++14 减少了版本 11 中存在的限制。这些函数现在可以包含：


    * 除了 `thread_local` 或 `static` 变量类型或任何未初始化的声明外的所有声明

    * 包括 `if` 语句和 `switch` 在内的条件

    * 任何循环语句，包括 `for` 或 `while`


    在该版本的 C++ 中已禁止使用 `goto` 语句。


    ## 数字分隔符


    C++14 现在为用户提供了使用数字分隔符的选项。这只是用于数值字面量中的单引号。这包括整数和浮点整数。


    该功能并不是什么惊天动地的，但对于读取数字很有用。分隔符不会改变数字的求值，除了可读性外，没有特殊的编码优势。


    下面的示例标识了如何使用它。


    ![](img/00084.jpeg)


    ## 关键字：auto


    `auto` 关键字是 C++14 中的新特性。它的意图是让编码更简单、更整洁且更不容易出错。使用 `auto` 对速度没有任何负面影响，因为 `auto`是在编译时推导的。


    下面是 `auto` 的用法示例：


    ![](img/00085.jpeg)


    上面的示例等价于：


    images/00086.jpeg)


    以下是 C++11 和 C++14 中 `auto` 的示例。


    1) 这是 C++11 的版本。


    images/00087.jpeg)


    C++14 的版本如下：


    images/00088.jpeg)


    ## 通用 lambda


    ![img-wallpapers-c_pc_for_me-15138](img/00090.jpeg)


    Lambda 函数引入于 C++11，当时需要声明为具体类型。C++14 在这一要求上更加宽松。它允许 lambda 参数声明为 `auto` 类型。


    ```cpp

    auto f = [](auto x){ return normalize(x); };

    ```


    上面的定义等同于伪代码：


    images/00091.jpeg)


    在上面的示例中，lambda 将 `x` 转发给 `normalize`。闭包的调用运算符如所示。为了实现这一点，`x` 必须是通用引用。它还通过 `std::forward`
    传递给 `normalize`。


    找到一个通用 lambda 用法的完整程序示例。


    ![](img/00093.jpeg)


    运行上述代码的结果如下：


    images/00094.jpeg)


    ## 新标准库特性


    随着 C++14 的出现，带来了新的标准库特性。这些特性包括：


    * 锁和共享互斥锁

    * 关联容器中的异构查找

    * 用户定义的标准字面量

    * 元组索引


    这是 C++14 提供的主要库特性列表，还有大量较小的库添加。


    ## 用户定义字面量


    C++14 增加了一些后缀，用于指定定义字面量的类型。这些后缀的一些示例包括 `s` 或 `st`。这用于字符和字符串类型。


    ![](img/images00095.jpeg)


    给定示例的最后一行将报错。这是因为 `str` 将被确定为 `const char*` 类型，而 `str1` 将被确定为 `string`。


    以下后缀 – `h`、`min`、`s`、`ms`、`us`、`ns` 用于表示各种时间间隔类型。


    ![](img/00096.jpeg)


