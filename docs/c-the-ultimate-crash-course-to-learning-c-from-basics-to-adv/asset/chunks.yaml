    \ (double a, double b)`，从主程序调用该函数的正确方式是什么？\n    a) `summation (a)`\n    b) `summation\
    \ (a,b)`\n    c) `summation (b)`\n\n8. 如果你在函数内部声明了一个变量，这是什么样的变量？\n    a) 全局变量\n\
    \    b) 局部变量\n    c) 扩展变量\n\n9. 如果我们有一个函数 `double go (double b)`，我们可以在主程序中向它发送一个不同的变量吗，还是必须是\
    \ `b`？例如，`go (x)`\n    a) 是\n    b) 否\n\n# 第 7 章 – 类与对象\n\nC++ 的主要功能之一是在 C 语言的基础上增加了面向对象特性。由于这一点，类是\
    \ C++ 程序涉及的特性之一。这些有时被称为用户定义类型。\n\n## 为什么使用类？\n\n使用类是为了详细描述对象的结构。它还包含了操作对象及其任何特征所需的方法。类中的函数和数据被称为其成员。\n\
    \n## C++ 类定义\n\n实际上，类并不定义任何形式的正式数据。它仅仅是一个大纲或蓝图。类定义了类名的含义以及它代表的对象的组件。它还定义了对象可以执行哪些操作。\n\
    \n在定义类时，必须始终以关键字 `class` 开始。后面应该紧跟类的名称。然后是类体，所有内容都必须包含在大括号中。类定义之后必须紧跟一个分号或声明列表，取决于用户的需求。以下是类声明的示例。\n\
    \n```cpp\nclass Person {\n public:\n  double weight; // 人的体重\n  double height;\
    \ // 人的身高\n  int age; // 人的年龄\n};\n```\n\n在上方，你会看到 `public` 关键字的使用。这用于确定成员的访问级别。任何标记为\
    \ `public` 的内容都可以从类外部访问。还可能是 `private` 或 `protected`，这些将在稍后讨论。\n\n## 定义 C++ 对象\n\
    \n由于类被认为是对象的蓝图，因此从类中创建对象是合理的。对象的声明方式与变量一样。\n\n```cpp\nPerson Person1;\nPerson\
    \ Person2;\n```\n\n对象 `Person1` 和 `Person2` 将拥有它们自己的数据拷贝。\n\n## 访问数据成员\n\n![images/0035.jpeg)\n\
    \n任何公共类型的成员都可以通过使用 `.` 使用。这就是访问运算符。运行上面的程序查看如何使用访问运算符。请记住，私有保护的项目无法使用访问运算符。\n\n\
    ## 类成员函数\n\n成员函数操作对象。它是类内部定义的函数。在类定义之外，成员函数也可以通过作用域运算符 `::` 分别定义。这将内联定义。下方示例所示。\n\
    \n![images/0036.jpeg)\n\n![images/0037.jpeg)\n\n## 类成员修饰符\n\n`public`、`private`\
    \ 和 `protected` 为类体内部成员提供了访问限制。这些关键字可以称为指定符。类能够拥有多个访问级别的块。成员和类默认访问类型为 `private`。\n\
    \n![images/0038.jpeg)\n\n## 构造函数与析构函数\n\n构造函数是在创建新对象时实现的类函数。它们与类同名，但没有返回类型。下面的示例显示了如何使用构造函数。\n\
    \n![images/0039.jpeg)\n\n虽然构造函数通常没有参数，但它仍然具有这种能力。这有助于你在对象创建时赋值。下方是带参数构造函数的示例。\n\
    \n![images/0040.jpeg)\n\n析构函数在对象超出作用域时执行。它在 `delete` 表达式应用于对象指针时也会执行。析构函数与类同名，但以波浪\
    \ `~` 前缀。它不能返回或接受参数。它在释放资源时有用。以下是析构函数的示例。\n\n![images/0041.jpeg)\n\n## 友元函数\n\n"
- fmt: "\nA friend function is defined outside of the scope of the class, however,\
    \ it is able to access all private and protected members. Member functions cannot\
    \ be friend functions. In order to declare a function as a friend, the function\
    \ must be preceded by the keyword `friend`. The example below shows how friend\
    \ functions are used.\n\n![](images/00042.jpeg)\n\n## Static Class Members\n\n\
    Static class members are defined using the keyword `static`. This means that no\
    \ matter how many objects may exist there is only one copy of the static class\
    \ member.\n\nThe following example shows how static class members are used.\n\n\
    A static member function may be called even when no objects of the class exist.\
    \ It is important to remember that static functions are accessed by simply using\
    \ the class name and the scope resolution operator `::`. A static member function\
    \ is only able to access a static data member, static member functions and any\
    \ other functions from outside the class.\n\nStatic data members, static member\
    \ functions and any other functions from outside the class can be accessed by\
    \ a static member function. It can also be used to determine if objects have not\
    \ been created or if they have. \n\nThe following is an example of using static\
    \ function members.\n\n![AAEAAQAAAAAAAAkKAAAAJDZlZDJhYzJiLWJiYzAtNDIwZS05OTE2LTE5YWZlOGQxMjY3Nw](images/00043.jpeg)\n\
    \n![](images/00044.jpeg)\n\n![](images/00045.jpeg)\n\n## Basic Practice Problems\n\
    \n1. Write a program using classes that takes in a name and age from a user and\
    \ prints that information on screen to the user. Your class should contain the\
    \ name and age of the person.\n\n2. Assuming that a class is inherited publicly,\
    \ which of the listed statements is correct?\n    A) Public members of the base\
    \ class would stay as protected members of derived class.\n    B) Private members\
    \ of the derived class become private members of derived class.\n    C) Private\
    \ members of the base class become protected members of derived class.\n    D)\
    \ Public members of the base class become public members of derived class.\n\n\
    3. Which of the following is the default access type for classes in C++?\n   \
    \ A) Private\n    B) Public\n    C) Static\n    D) Binding\n\n4. An instance of\
    \ a class is also known as _____?\n    A) Function\n    B) class\n    C) object\n\
    \n## Practice Problem Solutions\n\n```cpp\n/*  Creating Basic Classes in C++\n\
