    \ an event, you are going to have to listen for it so that you can supply a function.\
    \ The function is goign to be called by the browser whenever the event has occured\
    \ and it is known as a callback.\n\n### Code\n\n```javascript\nVar handleClick\
    \ function (event) {\n  // choose a different action !\n};\n\nVar button = document.querySelector('#\
    \ big-button');\nButton.addEventListener('click', handleClick);\n```\n\n`addEventListener`\
