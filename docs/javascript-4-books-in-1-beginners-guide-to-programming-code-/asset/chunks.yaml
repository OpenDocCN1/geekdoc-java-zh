    # Chapter 18: jQuery and AJAX


    There are some AJAX helper methods when it comes to `jQuery` that are going to
    allow you to save time and make your code painless to look at. They are going
    to be methods of the `$` variable: `.get`, `.post`, and `.AJAX`.


    The `.AJAX` strategies will be the primary technique that is going to be the main
    method you will use in order to construct the AJAX request. The other methods
    are going to be used as shortcuts for configurations such as getting data or posting
    it.


    ### Code


    ```javascript

    $ . AJAX ( {

    url : ‘ / data . json ‘ ,

    method: ‘ GET ‘ ,

    success: function (data) {

    console . log (data) ;

    }

    } ) ;

    ```


    The configuration of an object is going to be used whenever jQuery needs to retrieve
    data. The basics are going to be supplied such as the URL. This method is going
    to default to the `get` method and the function is going to be called whenever
    the data has been retrieved as it is going to be named `success` callback.


    ### $.get


    The code for this method is going to get a series of information and being that
    this is the basis of the function; the `jQuery` is going to provide a helper.


    ### Code


    ```javascript

    $ . get ( ‘ / data . json ‘ , function ( data ) {

    Console . log ( data ) ;

    } ) ;

    ```


    A callback error is also going to be provide to let you know if that is not right
    and thus making it to where the server cannot be found.


    ### Code


    ```javascript

    $ . get ( ‘ / data . json ‘ , function ( data ) {

    Console . log ( data ) ;

    } ) .fail ( function () {

    // Oh no, that is not right

    } ) ;

    ```


    ### $.post


    When you are directing input to the system, you will use the `.post` method. The
    argument that is second will cause the data to be sent to anywhere but the function.
    `jQuery` is going to figure out a way for the data to be sent.


    ### Code


    ```javascript

    $ . post ( ‘ / save ‘ , { username: ‘burt’ } , function (data) {

    Console . log(data) ;

    } ) .fail(function () {

    // wrong action

    } ) ;

    ```


    ### $.AJAX


    To have a margin of authority of how information is directed, you will use the
    `.AJAX` method.


    ### Code


    ```javascript

    $ . AJAX ( {

    url: ‘ / save ‘ ,

    method: ‘POST’ ,

    data: { username: ‘burt’ } ,

    success: function (data) {

    console . log (data) ;

    } ) ,

    Error: function () {

    //wrong action

    }

    } ) ;

    ```


    # Chapter 19: jQuery and Other Tricks


    The `jQuery` is going to aid you in doing other tasks that are common, especially
    when things are inconsistent across a series of browsers.


    ### DOM Content Loaded


    There are going to be times that `JavaScript` is going to run whenever the `DOM`
    has been loaded, for code, when you are trying to maneuver the objects to various
    sections on the site, or design a new site. This is going to purely `JavaScript`.
    But, it is not going to work with every browser.


    ### Code


    ```javascript

    Var doSomething = function (event) { . . . } ;

    Window.addEventListener ( ‘ DOMContentLoaded ‘ , doSomething) ;

    ```


    However, it is easier to do this when you are using `jQuery` and it is going to
    be carried across multiple browsers.


    ### Code


    ```javascript

    $ ( window ) . read ( doSomething) ;

    ```


    You can also shorten this even more:


    ### Code


    ```javascript

    $( doSomething) ;

    ```


    ### Load


    When it comes to certain situations, you are going to need to wait for the page
    to load fully before you try and do anything with it. When you are using `jQuery`,
    you are going to listen for the event to load into its `window`.


    ### Code


    ```javascript

    Window . addEventListener ( ‘ load ‘ , doSomething) ;

    ```


    With `jQuery`, it is going to be simpler:


    ### Code


    ```javascript

    $(window) . load (doSomething) ;

    ```


    ### Type Checking


    To find out the data that has been stored in a variable, `JavaScript` is going
    to be a tad awkward, but `jQuery` is going able to show you how to do it without
    the awkwardness.


    ### Code


    ```javascript

    $. isArray ( | 1, 2, 3 | ) ; // True

    $.isFunction (function () { } ) ; // True

    $. isNumeric (10) ; // True

    $. isPlainObject ( { name: ‘Burt’ } ) ; // True

    ```


    # Chapter 20: JavaScript Control Flow Statements


    Source files are going to have narratives that will be executed in the exact order
    that they have been written out. A control flow statement will deal with the way
    that the operators will flow based on the looping, decision making, branching,
    and how programs are enabled to operate due to specific chunks of code that have
    conditions attached to them.


    ### If-then


    An `if then` statement is going to be the simplest control statement that you
    are going to use. This statement will execute your code only should the code be
    found as true.


    ### Code


    ```javascript

    Void applyBrakes() {

    // the “if” clause: car is moving

    If (isMoving) {

    // the “then” clause: lower car’s acceleration

    acceleration—;

    }

    }

    ```


    Should the condition be found false then the control statement is going to move
    on to the next statement that is between them. The curly brackets are strictly
    optional:


    ```javascript

    Void applyBreaks() {

    // same as above code, only the curly brackets are not going to be here.

    If (isMoving)

    CurrentSpeed—;

    }

    ```


    Whenever curly brackets omitted, if another expression is placed in the code,
    then a requirement will be added which is going to mean that you have to use curly
    brackets, but sometimes they are forgotten by the coder. The `JavaScript` complier
    is not going to catch this mistake; it is only going to give you improper results.


    ### If-then else


    `If then else` clauses are going to create a secondary path for the code to follow
    if the clause ends up failing.


    ### Code


    ```javascript

    Void applyBakes() {

    If (isMoving) {

    CurrentSpeed—;

    } else {

    System.err.printin (“The car is not moving!”)

    }

    }

    ```


    ### Switches


    A `switch` statement offers different paths for code to be executed. The `switch`
    statements will work with `int`, `short`, `char`, and `byte` data along with enumerated
    data types.


    ### Code


    ```javascript

    Public class SwitchDemo {

    Publicstatic void main (String[] args) {

    Int month = 8 ;

    String monthString ;

    Switch (month) {

    Case 1: month = “January” ;

    Break ;

    Case 2: monthString = “February” ;

    Break ;

    Case 3: monthString = “March” ;

    Break ;

    Case 4: monthString = “April” ;

    Break ;

    Case 5: monthString = “May” ;

    Break ;

    Case 6: monthString = “June” ;

    Break ;

    Case 7: monthString = “July” ;

    Break ;

    Case 8: monthString = “August” ;

    Break ;

    Case 9: monthString = “September” ;

    Break ;

    Case 10: monthString = “October” ;

    Break ;

    Case 11: monthString = “November” ;

    Break ;

    Case 12: monthString = “December” ;

    Break ;

    Default: monthString = “Invalid month” ;

    Break ;

    }

    System.out.println(monthString) ;

    }

    }

    ```

