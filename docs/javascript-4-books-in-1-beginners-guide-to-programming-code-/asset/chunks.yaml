    Chapter 11:


    DOM


    DOM stands for Document Object Model and it will manipulate how an HTML page is
    structured and styled. It is going to be represented by the internal pages that
    the browser is going to see so that the developer is able to alter the JavaScript
    code.


    In order to look at the DOM for a page, you are going to open the developer tool
    inside of the browser that you are using and locate the “elements” pane. This
    will give you a good insight as to how the browser is thinking. In most browsers,
    you are going to have the ability to modify and remove elements directly without
    asking for permission.


    Trees and Branches


    HTML is similar to the structure of an XML in that the elements are going to contain
    parent nodes from the structure that it creates along with children nodes. It
    is much like tree branches. HTML is going to have a single root element that contains
    branches much like a head and body and the limbs that are going to be attached
    to it. Because of this, DOM is also known as a DOM tree.


    When altering a DOM, you are going to pick an element and change whatever you
    want about it. This process is normally done with JavaScript. In order to access
    DOM from JavaScript, you are going to need the document for the object that is
    being used. It will be provided by the browser so that the code is allowed to
    interact with the code that is on the page’s content.


    Getting Elements


    When you are getting an element, you are going to have several ways that you can
    do it depending on the browser that you are using.


    ID


    Document. getElementById will be the method that you use when you are trying to
    retrieve an item with its ID.


    Code


    Var pageHeader = document. getElementByID ( ‘ page header ‘ ) ;


    The pageHeader has the ability to be changed which will then change the size and
    color. When other code is declared, it is going to handle the element by a mouse
    hovering over it or clicking on it. Most browsers are this way.


    You are going to notice that getElementById is going to be the method that is
    used with an object of a document. Some of the other methods are going to have
    admission the page that has been located on the file for the element.


    Tag name


    Document. getElementsByTagName is going to work the same way that the getElementById
    does but it is going to need a tag name such as a, li, or ul instead of having
    an ID. It will then be returned to the NodeList which is basically an list or
    array of elements from DOM.'
