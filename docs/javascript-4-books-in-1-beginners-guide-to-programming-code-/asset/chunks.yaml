    ### Code


    ```javascript

    $ . post ( ‘ / save ‘ , { username: ‘burt’ } , function (data) {

    Console . log(data) ;

    } ) .fail(function () {

    // 错误操作

    } ) ;

    ```


    ### $.AJAX


    为了控制信息方向的权限，将使用 `.AJAX` 方法。


    ### Code


    ```javascript

    $ . AJAX ( {

    url: ‘ / save ‘ ,

    method: ‘POST’ ,

    data: { username: ‘burt’ } ,

    success: function (data) {

    console . log (data) ;

