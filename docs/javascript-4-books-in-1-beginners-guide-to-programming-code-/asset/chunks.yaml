    \n# Chapter 15:\n\n![image](d2d_images/chapter_title_below.png)\n\n## Scopes with\
    \ JavaScript\n\nA scope is going to be the term that will determine what the variable\
    \ visibility is. The variables scope is going to be the part of the code that\
    \ is going to access as well as modify the variable. There is a function scope\
    \ that is going to be used with JavaScript.\n\nScope going to be dictated by the\
    \ block of code where the variable has been declared. The block will be anything\
    \ that is contained inside of two curly brackets or is indented.\n\n### Code\n\
    ```\nVar a = 10 ;\nIf ( a > 5) {\nVar b = 5\n}\nVar c = a + b ; //this is not\
    \ going to work!\n```\nGlobal variables are going to be read and modified wherever\
    \ you put them in your application, but they are not going to be the best to use\
    \ because they are going to expose the security issues in the code which is ultimately\
    \ going to make the code harder to maintain.\n\nIt is important to remember that\
    \ your code needs to read more than it is written. Whenever code is read by a\
    \ human but is unable to be determined as to where the variable has come from\
    \ or what potential values there are, you are going to have a problem.\n\nYou\
    \ are going to get your best results when you limit the scope of the variable\
    \ as much as you possibly can which will make it visible to as few parts of the\
    \ code as possible.\n\n### Function scope\n\nSince JavaScript does things differently,\
    \ it is going to use a function scope. A function scope is going to mean that\
    \ the variables will not be visible when they are outside of the function where\
    \ they were declared. If they have not been declared in a function, then they\
    \ are going to be visible globally.\n\n### Code\n```\nVar doSomething = function\
    \ () {\nVar a = 10 ;\n} ;\ndoSomething () ;\nconsole .log (a) ; // this shows\
    \ that a has been undefined.\n```\nWhen you compare this block scope to the code\
    \ that you just saw, you are going to notice that `b` is going to be available.\n\
    \n### Code\n```\nVar a = 10 ;\nIf(a > 5 ) {\nVar b = 5\n}\nVar c = a + b ; //\
    \ c will be 15\n```\n\n### Child scopes\n\nVariables are going to also come in\
    \ child scopes that will have their own scopes. For code if the `doSomethingElse`\
    \ is a child of the `doSomething` function then `a` will be visible when it is\
    \ placed inside of `doSomethingElse`.\n\n### Code\n```\nVar doSomething = function\
    \ () {\nVar a = 10 ;\nVar doSomethingElse = function () {\nConsole .log (a) ;\
    \ //a will be 10\n} ;\ndoSomethingElse ();\n} ;\ndoSomething() ;\n```\nFunctional\
    \ scopes are going to be very powerful tools when it comes to creating elegant\
    \ codes, but it takes a while to actually get the hang of it.\n\n![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)\n\n![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)\n\
