    # 第一章：JavaScript...它是什么？它将如何带给我好处？

    ![image](img/chapter_title_below.png)


    JavaScript 是一门脚本语言。通过 JavaScript，你将与不同的网页进行交互，从而创建一个 Web 应用。Netscape Communications
    公司于 1995 年首次实现了 JavaScript。


    JavaScript 很容易与 Java 混淆，因为两者的名字非常相似，但它们并不是同一个东西。不过好处是，它们可以在客户端共同交互，因为它们可以直接嵌入网页中。取决于你的意图，脚本可以在网页打开或调用时被运行。


    JavaScript 还是是一门面向对象的语言，具有原型继承（prototypal inheritance）。这意味着 JavaScript 与你在其他编程语言（如
    C++）中发现的类是不一样的。相反，JavaScript 对象会从其他对象获取属性，从而形成原型链。


    当 JavaScript 作为解释型语言时，JIT 编译是可选的。当你查看 JavaScript 的旧实现版本时，它严格是一门必须经过解释的语言。在不进行预编译（如将脚本转换为系统代码）的情况下，浏览器将解释数据以便立即分析并执行。


    当你查看现代实现版本时，代码要么被编译，要么通过 `JIT`（即时）编译器进行解释。当浏览器运行时，它会识别哪些代码需要 JIT 编译，从而允许对复杂性能要求的
    Web 应用获得更好的性能。所有较新的浏览器 JavaScript 版本都将拥有 JIT 编译器。


    每当你查看 JavaScript 支持的地方时，你会惊讶地发现它几乎在处处支持。在 `Firefox`、`Google Chrome` 和 `Safari`
    等浏览器中，如果你不确定浏览器是否支持 JavaScript，可以进入设置查看是否可以启用或禁用它。如果可以，说明你的浏览器支持 JavaScript。


    ## 好处


    了解 JavaScript 将对你职业的晋升或寻找新职业产生好处。如果你想进入 `IT` 领域甚至是网页设计领域，JavaScript 是必不可少的。如果你已经在这些领域中工作，你将能够在职业生涯中获得进步，因为你加深了对你有益的知识。


