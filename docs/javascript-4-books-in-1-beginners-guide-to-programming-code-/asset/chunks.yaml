  trans: "\n\n# 类名\n\n`document.getElementsByClassName` 返回的列表与标签名方法返回相同。最大的区别在于，你需要传递一个匹配的类名（class\
    \ name），而不是标签名。\n\n## CSS\n\n在现代浏览器中，有几种新方法供你使用，通过使用 CSS 选择器让选择元素变得更容易。CSS 的语法为：`document.querySelector`\
    \ 和 `document.querySelectorAll`。\n\n### 代码\n\n```javascript\nVar pageHeader =\
    \ document.querySelector('#header');\nVar buttons = document.querySelectorAll('.btn');\n\
    ```\n\n`querySelector` 就像你通过 `ID` 搜索元素一样，它只会返回一个元素。但是，`querySelectorAll` 会返回一个\
    \ `NodeList`。因此，如果有多个元素符合你的搜索标准，你就需要使用 `querySelector`，以便只获取返回的第一个元素，而不是所有元素。\n\
    \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
    \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
    \n# 第 12 章：JavaScript 回调与事件\n\n位于浏览器内部的代码是事件驱动的，当你编写交互式应用程序时，你必须等待并响应那些最终会改变浏览器行为的事件。当页面加载或用户与页面上的某些内容进行交互时，就会发生事件。还有其他时刻也会触发事件，但这些必须手动完成。\n\
    \n当你需要对事件做出响应时，你必须监听它以便提供一个函数。每当事件发生时，浏览器都会调用该函数，它被称为回调函数（callback）。\n\n### 代码\n\
    \n```javascript\nVar handleClick function (event) {\n  // 选择不同的动作！\n};\n\nVar\
    \ button = document.querySelector('# big-button');\nButton.addEventListener('click',\
    \ handleClick);\n```\n\n`addEventListener` 是一个可以在所有 DOM 元素上找到的方法。当它被调用时，该元素将保存在变量\
    \ `button` 中。字符串列表中第一个列出的参数是你应该监听的事件名称。这段代码中的事件是鼠标点击或手指的轻点。回调函数是 `handleClick`。\n\
    \n如果你使用的是 Internet Explorer，且运行的版本低于 9，则 `addEventListener` 将不被支持。在这种情况下，你应该使用\
    \ `attachEvent`。\n\n### 代码\n\n```javascript\nButton.attachEvent('onclick', handleClick);\n\
    ```\n\n如果你观察的话，会发现需要使用 `onclick` 而不是 `click`。这种情况会在你遇到的大多数事件中发生。正是这样的对象创建了如 `jQuery`\
    \ 这样的库来帮助你，使得即使两个浏览器之间的监听方式不同，得益于作为回调传递的事件，这也不再重要了。\n\n传递的任何特定事件的数据都是回调。当你查看上面声明的\
    \ `handleClick` 时，你会发现事件的参数是描述对象属性的地方。\n\n### 代码\n\n```json\n{\n  OffsetX: 74,\n\
    \  offsetY: 10,\n  pageX: 154,\n  pageY: 698,\n  target: h2,\n  timestamp: 215897564812,\n\
    \  type: “click”,\n  x: 154,\n  y: 395\n}\n```\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
    \n# 第 13 章：JavaScript 与 AJAX\n\n当 Web 刚出现时，情况比现在简单。现在的页面有文本和样式，同时可能带有引导你进入不同网页的链接。要在页面上放置新内容，你必须从一个页面移动到另一个页面。网页开发者变得更有野心，尝试让网页具有交互性。但显然，新内容需要一种新的方式加载到页面，而不是每次都完全重新加载页面。\n\
    \n在获取新内容时，有一种名为 `XHR` 或 `XML HTTP Request`（XML HTTP 请求）的软件提供帮助。互联网应用程序使用 `AJAX`。`AJAX`\
    \ 的字母代表异步 JavaScript 和 XML。\n\n通过这种技术，大多数网页都可以在不重新加载页面的获取新内容。微软实际上是在创建 `Outlook`\
    \ 时决定使用 `XML Http Request` 的。\n\n## XML HTTP 请求\n\n你知道 `XML HTTP Request` 是什么，但它是如何显示的呢？\n\
    \n### 代码\n\n```javascript\nVar req = new XMLHttpRequest();\nReq.onload = function\
    \ (event) { ... };\nReq.open(' get', 'some- file . txt ', true);\nReq.send();\n\
    ```\n\n当创建一个 `XMLHttpRequest` 时，你需要一个类似于调用函数的关键字来使用 `XMLHttpRequest`。在 `req.open`\
    \ 处，`href` 这种方式是用来提取提取的。\n\n下一个参数是一个 `Boolean`（布尔值），用于指定是否为异步 `true`。\n\n异步的参数默认为\
    \ `false`，这会导致在请求完成之前执行代码。\n\n同步 `XMLHttpRequest` 很少使用，它会导致代码执行暂停，直到请求完成。\n\n\
    使用 `XMLHttpRequest`，你可以加载 `JSON`、`XML`、`HTML` 以及一系列通过 HTTP 和 HTTPS 服务器的文本，同时也支持\
    \ `FTP` 等规则。最终，它们在 JavaScript 应用程序的各种任务中非常有用。\n\n## AJAX 与库\n\n用于 `AJAX` 的技术被创建，使得现在有了单页应用程序，通过请求引入\
    \ JavaScript 脚本，使其能够异步从服务器加载。有许多整个库和框架为此而构建。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n# 第 14 章：\n\
    \n![image](img/chapter_title_above.png)\n\n## JSON\n\n`JSON` 代表 JavaScript 对象表示法（JavaScript\
    \ Object Notation）。这是一套文本格式规则，用于在机器中存储和移动数据，以便人类阅读。它看起来与 JavaScript 中使用的对象字面量语法相似，但这是\
    \ `JSON` 的起源。\n\n`JSON` 可能不是 JavaScript 官方代码的一部分，但它是 JavaScript 的重要组成，所以尽管它是一门不同的语言，理解它如何与\
    \ JavaScript 工作对你仍然很重要。\n\n### 代码\n\n```json\n{ “name” : “Luke”, age: 894, “lightsaber”\
    \ : { “color” : “green” } }\n```\n\n就像普通的 JavaScript 代码一样，括号被用于标记代码特定部分。\n\n"
