    # Chapter 6:


    ![image](d2d_images/chapter_title_below.png)


    JavaScript Conditions


    Using JavaScript logic will make the decision for the code based on what sort
    of comparison has been made. Before the comparison can be made, there has to be
    a condition set. There are several conditions that are used in JavaScript, but
    the most common one is the If statement.


    If statement


    When the condition is found to be true, the code set is going to be run the way
    that it is supposed to. Thanks to the if statement, you are going to be able to
    add in extra code that has to be run should the condition turn out to not be true.
    When the condition is returned as false, then there will have to be extra conditions
    and blocks of code that are going to be run optionally. This option is going to
    be the if-else statement.


    Code


    If (10 > 5) {


    // Run the code here


    }


    Any code that has been placed between the curly brackets is going to be considered
    a block and will be connected to the If statement. However, it is only going to
    be run if the condition that falls between the parentheses turns out to be true.


    Note: the double slashes are going to indicate a comment that has been placed
    in the code and it is not going to be run as code. The comments are placed so
    that the code can be easily understood by others.


    If-else


    The if-else statement is a different form of the If statement that will use a
    piece of code and run it instead of the original code if the condition comes back
    as false. The code that falls in the If code block is going to be ignored so that
    the else block can be run.


    Code


    If ( 43 < 2) {


    // Run the code here


    } else {


    //A different code is run


    }


