    JSON stands for JavaScript Object Notation. This is a set of text formatting rules
    that are used for storing and moving data around in a machine so that a human
    can read it. It is going to look similar to the object literal syntax that is
    used with JavaScript but this is where JSON is going to orginate.


    JSON may not be part of JavaScript’s official code, it is a big part of JavaScript
    so while it is a different language, it is still important for you to understand
    how it works when it works with JavaScript.


    Code


    { “name” : “Luke” , age: 894, “lightsaber” : { “color” : “green” } }


    Just like with normal JavaScript code, the brackets are used to notate specific
    parts of the code.'
