    # 第 6 章：


    ![image](img/chapter_title_below.png)


    ## JavaScript 条件


    使用 JavaScript 逻辑将根据所做的比较类型为代码做出决策。在进行比较之前，必须设置一个条件。JavaScript 中使用了几种条件，但最常用的是
    `If` 语句。


    ### If 语句


    当发现条件为 `true` 时，代码集将按照预期运行。得益于 `if` 语句，当条件被证明不成立时，你可以添加必须运行的额外代码。当条件返回 `false`
    时，将会有额外的条件和代码块可以选择运行。这种选项就是 `if-else` 语句。


    ```

    If (10 > 5) {

    // 在此处运行代码

    }

    ```


    放置在花括号之间的任何代码将被视为一个块，并与 `If` 语句连接。然而，它只有在括号内的条件被证明为 `true` 时才会运行。


    注意：双斜杠 `//` 表示放置在代码中的注释，它不会作为代码运行。放置注释是为了让其他人能够更容易理解代码。


    ### If-else


    `if-else` 语句是 `If` 语句的另一种形式，当条件返回 `false` 时，它将使用一段代码并运行它而不是原始代码。


    ```

    If (10 > 5) {

    // 在此处运行代码

    } else {

    // 运行代码

    ```


