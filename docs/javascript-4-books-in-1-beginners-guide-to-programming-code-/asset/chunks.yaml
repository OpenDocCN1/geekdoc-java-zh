    ## JavaScript 中的 jQuery


    在修改和控制 DOM 时将有一组工具被使用。不过这有点混乱，因为不同浏览器类型之间有不同的 DOM。为了让编码体验更简单，已经设置了大量资源来隐藏大的错误，并使其更加统一。这是大多数现代浏览器都可用的对象，大多数情况下它将提供
    AJAX 功能，减轻复杂编码的压力。jQuery 是一个在各种页面上为人知的 DOM 库。但是，你与 DOM 交互的过程被称为应用程序接口或 `API`。


    jQuery 拥有的语法非常独特，因为它基于美元符号。


    ### Code

    ```

    $ ( ‘btn’ ) . click ( function () {

    //选择不同的操作

    }

    ```

    字符串语法是 jQuery 的核心。你可以从 `jquery.com` 获取文件，也可以从 CDN 添加。


    ### Code

    ```html

    <script

    Src = “https://cdn.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js” >

    </script>

    ```

    你不应该总是使用库，但你应该根据是否需要结构来选择。例如，如果 jQuery 需要引入大量的文档，那么下载速度将会变慢，特别是对于连接较弱的移动浏览器。


