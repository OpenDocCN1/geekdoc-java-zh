    作为 switch 语句的一部分，其主要功能是允许注释进入 switch 块，以便执行多个 case（case）或默认标签（default）。所有的 switch
    语句在被 JavaScript 执行之前都会进行评估。当一个语句与另一个语句具有相同的标签时，它将成功执行。


    ### Code

    ```java

    Int month = 8

    If (month == 1) {

    System.out.println (“January”) ;

    }else if (month ==2) {

    System.out.println (“February”) ;

    }

    ... 以此类推。

    ```


    当使用 if then else 语句时，必须检查表达式的清晰度。if then else 语句将测试任何表达式，以检查条件以及为了根据所使用的枚举值、字符串值和整数值进行测试而必须使用的任何值。switch
    语句将结束任何 break 语句。


    控制流将继续执行放置在 switch 块之后的任何注释。break 语句仅在 switch 块发生“穿透”（fall through）时才会被使用，但所有其他语句都需要具有相同的标签，以便按照它们放置的顺序执行。case
    标签的位置在哪里并不重要，直到遇到 break 语句为止。


    ### Code

    ```java

    Public class SwitchDemoFallThrough {

    Public static void main (String[] args) {

    Java.util.ArrayList<String> futureMonths =

    New java.util.ArrayList<String> () ;

    Int month = 8 ;

    Switch (month) {

    Case 1: futureMonths.add (“January”) ;

    Case 2: futureMonths.add (“February”) ;

    Case 3: futureMonth.add (“March”) ;

    Case 4: futureMonth.add (“April) ;

    Case 5: futureMonths.add (“May”) ;

    Case 6: futureMonths.add (“June”) ;

    Case 7: futureMonths.add (“July”) ;

    Case 8: futureMonths.add (“August”) ;

    Case 9: futureMonths.add (“September”) ;

    Case 10: futureMonths.add (“October”) ;

    Case 11: futureMonths.add (“November”) ;

    Case 12: futureMonths.add (“December”) ;

    Break ;

    Break ;

    Default: break ;

    }

    If (futureMonths.isEmpty()) {

    System.out.println (“Invalid month number”) ;

    } else {

    For (String monthName : futureMonths) {

    System.out.println (monthName) ;

    }

    }

    }

    }

    ```


    该代码的输出将是 8 月到 12 月的字符串。


    当 break 结束时，你不需要任何代码，因为代码已经从 switch 语句中消失了。强烈建议使用此 break，因为它让修改代码变得更容易，从而减少你可能收到的任何错误。default
    部分的代码将处理未放置在 case 部分的值。代码可以包含多个 case。


    ### Code

    ```java

    Class SwitchDemo2 {

    Public static void main (String[] args) {

    Int month = 2;

    Int year = 2016;

    Int numDays = 0

    Switch (month) {

    Case 1: case 3: case 5:

    Case 7: case 8: case 10:

    Case 12

    numDays = 28

    break ;

    case 4: case 6:

    case 9: case 11:

    numDays = 31;

    break;

    case 2:

    if ((year % 4 == 0) &&

    !(year % 100 == 0))

    || (year % 400 == 0))

    NumDays = 31;

    Else

    numDays= 30;

    break;

    default:

    system.out.println (“Invalid month.") ;

    break ;

    }

    System.out.println (“Number of Days = “ + numDays) ;

    }

    }

    ```


    结果将是 29，因为在 2 月发现了 29 天。


    ### Switch statement strings

    字符串对象将被放入 switch 语句中。在某个时刻，将放置一个 switch，根据其 case 标签将表达式与其他表达式进行比较。只有当 case 是小写且
    case 标签也是小写时，这些字符串才能被 switch 语句接受。


    ### Code

    ```java

    Public class StringSwitchDemo {

    Public static int getMonthNumber(String month) {

    Int monthNumber = 0

    If (month == null) {

    Return monthNumber ;

    }

    Switch (month.toLowerCase()) {

    Case “January”:

    monthNumber = 1

    break ;

    ```


    该语句将继续执行，直到所有十二月份都以小写形式写出并带有与月份相关的数字为止。


    ### While and do while statements

    while 语句只有在条件为真时才会对语句块连续工作。


    #### Syntax

    ```

    While (expression) {

    Statement(s)

    }

    ```


    while 语句在返回布尔语句之前将评估任何和所有表达式。当发现条件为真时，它将执行 while 块中的任何语句。但当测试语句时，它将一直执行到语句被证明为假为止。


    ### Code

    ```java

    Class WhileDemo {

    Public static void main(String[] args) {

    Int count = 5 ;

    While (count < 19) {

    System.out.println(“ Count is: “ + count) ;

    Count++;

    }

    }

    ```


    无限循环通过以下语法实现：

    ```

    While (true){```


    do while 和无限循环的区别在于每个表达式至少会被评估一次。


    ### Code

    ```java

    Class DoWhile {

    Public static void main(String[] args) {

    Int count = 5

    Do {

    System.out.println (“Count is: “ + count) ;

    Count++;

    } while (count < 8) ;

    }

    }

    ```


    ### For statement

    for 语句提供了一种迭代值的方法。for 循环将持续到条件满足为止。


    #### Syntax

    ```

    For (initialization; termination; Increment) {

    Statement(s)

    }

    ```


    当你处理 for 语句时，必须记住当条件被发现为假时将终止。increment 表达式将在迭代后调用，但它可以增加或减少。最后，表达式的初始化将初始化循环并在循环启动后执行它。


    ### Code

    ```java

    Class ForDemo {

    Public static void main(String[] args) {

    For (int i=0 ; i<10; i++){

    System.out.println (“Count is: “ + i);

    }

    }

    ```


    输出将是从到十的数字。当编写语句时，变量将在表达式中初始化。变量的作用范围将从声明处延伸到代码块结束。for 语句将在表达式终止时使用。


    如果变量在 for 语句中声明，则它不能在循环外部使用，因为它是在初始化过程中声明的。`j`、`k` 和 `i` 等变量用于循环控制。一旦变量被声明，该变量的寿命就会缩短，从而减少发生错误的几率。在
    for 循环中将使用三个表达式。


    ### Code

    ```java

    Class ForDemo {

    Public static void main(String[] args) {

    For (int i=0 ; i<10; i++){

    System.out.println (“Count is: “ + i);

    }

    }

    ```


    for 语句可以包含一种在迭代过程中使用的不同变体。这种变体以增强语句而闻名，并会让循环更小且易于阅读。


    ### Code

    ```java

    Int[] numbers = {11, 12, 13, 14, 15, 16, 17, 18, 19};


    Class EnhancedForDemo {

    Public static void main (String[] args){

    Int[] numbers =

    {11, 12, 13, 14, 15, 16, 17, 18, 19};


    For (int item : numbers) {

    System.out.print;n (“ Count is : “ + item) ;

    }

    }

    }

    ```

