    `.css` 并带有一个简单的 CSS 属性来检索属性值。


    ### Code

    ```

    Var currenHeight = $ ( ‘ . note ‘ ) . height () ,

    currentColor = $ ( ‘ . note ‘ ) .css ( ‘ color ‘ ) ;

