  trans: "\n任何持有值的变量（如上面所示的代码）都将再次给你从一到十的输出。这种变体的用法将按照 `for` 语句通常编写的形式写出语句。\n\n##\
    \ break 语句\n\nJavaScript 中有两种 `break` 语句，即带标签的语句和无标签的语句。无标签语句通常用于 `switch` 语句中。这些\
    \ `break` 也会终止大多数循环。\n\n### Code\n\n```java\nClass BreakDemo {\n    Public static\
    \ void main(String[] args) {\n        Int[] arrayofInts = {72, 57, 5, 579, 14,\
    \ 1179, 2120, 9, 655, 145};\n        Int searchfor = 14;\n        Int I;\n   \
    \     Boolean fountIt = false;\n        For (I = 0; I < arrayOfInts . length;\
    \ i++) {\n            If (arrayOfInts [i] == searchfor) {\n                fountIt\
    \ = true;\n                break;\n            }\n        }\n        If (foundIt)\
    \ {\n            System.out.println(“found “ + searchfor + “ at index “ + i);\n\
    \        } else {\n            System.out.println (search for + “ not in the array”);\n\
    \        }\n    }\n}\n```\n\n如果在循环在到达你想要提取的值之前就已经终止，则必须在相应位置放置 break 语句。大多数控制流语句都可以转换到循环中。\n\
    \n在上面的代码中，输出将是数字十二，并且它在第四索引处找到。\n\nBreak 是无标签的，因此它们将终止 `switch`、`do while` 和 `for`\
    \ 语句的任何内部部分。当 `break` 带有标签时，它将停止任何位于外部的语句。\n\n### Code\n\n```java\nClass BreakWithLabelDemo\
    \ {\n    Public static void main(String[] args) {\n        Int[] []arrayOfInts\
    \ = {\n            { 32, 87, 3, 589 },\n            { 12, 1076, 2000, 8 },\n \
    \           { 622, 127, 77, 955}\n        };\n        Int searchfor = 12;\n  \
    \      Int I;\n        Int j = 0;\n        Boolean foundIt = false;\n        Search:\n\
    \        For (I =0; I < arrayOfInts.length; i++) {\n            For (j = 0; j\
    \ < arrayOfInts[i].length; J++) {\n                If (arrayOfInts[i][j] == searchfor)\
    \ {\n                    foundIt = true;\n                    breack search;\n\
    \                }\n            }\n        }\n        If (foundIt) {\n       \
    \     System.out.println(“Found “ + searchfor + “ at “ + I + “, “ +j);\n     \
    \   } else {\n            System.outprintln(searchfor + “ not in the array”);\n\
    \        }\n    }\n}\n```\n\n输出将是可以在第一个索引处找到了十二。\n\n## continue 语句\n\n`Continue`\
    \ 语句将跳过你放置在 `for`、`do while` 或 `while` 循环内部的任何迭代。无标签的形式将被跳过，以便在控制你循环的布尔表达式之前评估内部的代码。\n\
    \n### Code\n\n```java\nClass ContinueDemo {\n    Public static void main(String[]\
    \ args) {\n        String searchMe = “Peter Piper picked a “ + “peck of pickled\
    \ peppers”;\n        Int max = searchMe.length();\n        Int numPs=0;\n    \
    \    For (int I = 0; I < max; I++) {\n            // interested only in p’s\n\
    \            If (searchMe.charAt(i) ! = ‘p’)\n                Continue;\n    \
    \        // process p’s\n            numPs++;\n        }\n        System.out.println(found”\
    \ + numPs + “ p’s in the string. “ );\n    }\n}\n```\n\n在上面的代码中找到了两个 `p`。\n\n\
    每当 `continue` 语句被移除时，实际上会找到 35 个 `p`。如果发现外层循环的当前迭代有标签，则该语句将被跳过。\n\n在代码中，你将看到两个嵌套在一起的循环，以便搜索子字符串。当两个循环嵌套时，需要其中一个遍历子字符串，而另一个字符串进行搜索。\n\
    \n### Code\n\n```java\nClass ContinueWithLabelDemo {\n    Public static void main(String[]\
    \ args) {\n        String searchMe = “Look for a substring in me” ;\n        String\
    \ substring = “sub”;\n        Boolean foundIt = false;\n        Int max = searchMe.length()\
    \ – Substring.length();\n        Test:\n        For (int I = 0; I <= max; i++)\
    \ {\n            Int n = substring.length();\n            Int j = I;\n       \
    \     Int k =0;\n            While (n—!= 0) {\n                If (searchMe.charAt(j++)\
    \ != substring.charAt((k++)) {\n                    Continue test;\n         \
    \       }\n            }\n            foundIt = true;\n            break test;\n\
    \        }\n        System.out.println(foundIt ? “Found it” : “Didn’t find it”);\n\
    \    }\n}\n```\n\n## return 语句\n\n`return` 语句位于分支语句的结尾。`return` 语句用作当前控制流语句的退出方法，以便它们返回到方法首次调用的点。与其他表达式一样，对于返回的语句，可以使用两种不同的表达式。\n\
    \n当在一个语句中找到值时，它将被返回，而另一个值则不会。要获取返回的值，你需要在想要返回的关键字之后列出该值。语法为 `return ++ count ;`。\n\
    \n返回的数据类型需要与方法声明的类型匹配。一旦声明了方法，值将是有效的且不会返回值。\n\n# 结论\n\n感谢你阅读《JavaScript：初学者 编程代码指南》，希望它能为你提供启发，并能够为你提供实现无论目标为何，所需的所有工具。\n\
    \n下一步是使用你学到的编码技能并创建你自己的代码。\n"
