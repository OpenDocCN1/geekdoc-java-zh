    # Chapter 1: JavaScript...What is it and How will it Benefit me?

    ![image](d2d_images/chapter_title_below.png)


    JavaScript is a scripting language. With JavaScript you are going to be interacting
    with different web pages so that you are able to create a web application. Netscape
    Communications first implemented JavaScript in 1995.


    JavaScript is easily confused with Java because the two of them have very similar
    names, however, they are not the same thing. The good thing though is that it
    can interact together on the client side because they can be embedded directly
    into the web source. Depending on what your intent is as the web developer. The
    script is going to be run whenever the web page has been opened or invoked another
    action from the web page.


    JavaScript is also a language that is object oriented that contains a prototypal
    inheritance. So, whenever an object has been built into the program, things can
    be created or deleted by the programmer. The prototypal allows JavaScript to be
    different from any other programming languages that you may run across. JavaScript
    as a language does not have any classes that can be found with the C++ language
    or the sense that you are going to find with Java. Instead, the objects are going
    to get their properties from each other so that it creates a chain.


    There is also a JIT compilation that is optional when it comes to JavaScript being
    an interpreted language. When you look at the older implementations for JavaScript,
    it is strictly a language that has to be interpreted. Whenever a script is executed
    without a preliminary compilation such as a conversion for the script into the
    system’s machine code, then the browser will interpret the data so that it becomes
    analyzed and executed instantly.


    When you look at modern implementations, the code either will be compiled or interpreted
    with a `JIT` (just in time) compiler. As the browser runs, it is going to decipher
    what parts of code need to be JIT compiled so that it allows for better performance
    of the code. In doing this, JavaScript becomes faster and better to be used for
    web applications that have a complex performance demand. All of the more recent
    versions of JavaScript for the browsers that are used more are going to have a
    JIT compiler.


    Whenever you are looking at where JavaScript is supported, you are going to be
    surprised to find that it is supported almost everywhere. In browsers such as
    `Firefox`, `Google Chrome`, and `Safari`, if you are unsure if your browser is
    a vendor that has been licensed by JavaScript, you can go to your settings and
    see if you can enable or disable JavaScript. If you can, then your browser was
    licensed by JavaScript.


    ## Benefits


    Knowing JavaScript is going to benefit you in being able to either advance in
    your career or find a different career. If you want to go into `I.T.` or even
    web design, JavaScript is a must. Should you already have a job in one of these
    areas, you are going to be able to advance in your career because you have furthered
    your knowledge in something that is going to be beneficial to you.


    JavaScript is not only good if you are in `I.T.` or web design. JavaScript can
    be used in any job, if you are unsure if it can be used in your job, ask your
    boss. Showing an initiative to learn beyond what your job calls for is going to
    impress your boss and earn you favor.


