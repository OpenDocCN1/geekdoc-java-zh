    \n# 第 10 章：\n\n![image](img/chapter_title_below.png)\n\n## JavaScript 数组\n\n数组是任何类型的数据列表，它不限于包含其他数组。数组中列出的每个项目都有一个索引，该索引将用于从数组中检索元素。\n\
    \n索引始终从零开始，所有按顺序排列的元素增加一，因此最后一个元素将比数组总长度少 1。\n\n在 JavaScript 中创建数组意味着使用数组字面量语法。\n\
    \n```javascript\nVar emptyArray = [ ] ;\nVar shoppingList [ ‘ Rice ‘ , ‘Soda’,\
    \ ‘Buns’] ;\n```\n\n你可以使用方括号语法获取特定的元素。\n\n```javascript\nshoppingList [ 0 ] ;\n\
    Rice\n```\n\n你也可以使用方括号语法为特定索引设置值。\n\n```javascript\nshoppingList [ 1 ] = ‘Chips’\
    \ ;\n// 你的 shoppingList 现在将是 [ ‘Soda’, ‘Chips’, ‘Rice’ ]\n```\n\n数组中存在的项目数量将 `length`\
    \ 属性来告诉你有多少个元素。\n\n```javascript\nshoppingList . length ;\n3\n```\n\n可以使用 `push`\
    \ 和 `pop` 方法从数组末尾添加和删除元素。\n\n```javascript\nshoppingList . push (‘A new car ‘\
    \ ) ;\n// shoppingList [ ‘Soda ‘ , ‘Buns’, ‘Rice’, ‘A new car’]\n\nshoppingList\
    \ . pop() ;\n// shoppingList 现在是 [‘Soda’, ‘Buns’, ‘Rice’]\n```\n\n`push` 和 `pop`\
    \ 方法可以用于从数组末尾添加和删除元素。下面的代码将创建 `push`、`pop` 并遍历数组，将其传递给标记为 `helloFrom` 的函数。\n\n\
    ```javascript\nfunction helloFrom(personName) {\n    return “Hello from “ + personName;\n\
    }\n\nvar people = ['Burt’, ‘Ron’];\npeople.push (‘Tim’);\npeople.pop() ;\n\nfor\
    \ (var I = 0 ; I < people.length ; I++) {\n    var greeting = helloFrom(people[I]);\n\
    \    alert(greeting)\n}\n```\n\n![image](img/chapter_title_corner_decoration_left.png)\
    \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
    \n# 第 11 章：\n\n## DOM\n\nDOM 代表文档对象模型，它将操纵 HTML 页面的结构和样式。\n\n为了查看页面的 DOM，你需要打开正在使用的浏览器开发者工具，并定位到“元素”面板。在大多数浏览器中，你可以在不请求许可的情况下修改元素。\n\
    \n### 树与分支\n\nHTML 的结构类似于 XML，元素包含父节点和子节点。HTML 将具有单个根元素，包含头部、主体以及附加在其上的分支。\n\n\
    在修改 DOM 时，你会选择一个元素并更改它的任何内容。这个过程通常通过 JavaScript 完成。为了从 JavaScript 访问 DOM，你需要 `document`\
    \ 对象。\n\n### 获取元素\n\n当你获取元素时，根据你使用的浏览器，你有几种方法可以使用。\n\n#### ID\n\n`document.getElementById()`\
    \ 是你尝试通过 ID 项目时使用的方法。\n\n```javascript\nVar pageHeader = document.getElementById\
    \ ( ‘ page header ‘);\n```\n\n`pageHeader` 可以被更改，这将改变大小和颜色。当声明其他代码时，它将在鼠标悬停或点击元素时处理该元素。\n\
    \n#### 标签名\n\n`document.getElementsByTagName()` 的工作方式与 `getElementById` 相同，但它需要标签名（如\
    \ `a`、`li` 或 `ul`）而不是 ID。\n\n"
