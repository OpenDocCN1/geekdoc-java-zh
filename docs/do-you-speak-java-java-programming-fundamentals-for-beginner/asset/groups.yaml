    \nThe registration of event filters is similar to the registration of event handlers\
    \ with the exception that there are no convenience methods provided.\n\nWith the\
    \ next example we will conclude this brief overview of the JavaFX API features.\
    \ The example illustrates everything we have learned so far about the JavaFX event\
