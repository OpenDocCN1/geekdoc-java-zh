    \ | 短路运算符 |\n| && | 短路与 | |\n\n与位运算符相同，布尔逻辑运算符（单一取非运算符除外）可以与赋值运算符结合，形成如下简写：\n\n\
    ```\na &= b;   // 这相当于 a = a & b;\na |= b;   // 这相当于 a = a | b;\na ^= b;   //\
