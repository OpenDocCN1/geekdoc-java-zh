- md: "\n## Restricting the Usage of @Annotations\n\nThe pre-defined annotation @Target\
    \ can be used to specify the types of items to which another annotation can be\
    \ applied. Valid values are defined by the enumeration ElementType:\n\n```java\n\
    @Target(ElementType.ANNOTATION_CONSTRUCTOR)\n@Target(ElementType.FIELD)\n@Target(ElementType.LOCAL_VARIABLE)\n\
    @Target(ElementType.METHOD)\n@Target(ElementType.PACKAGE)\n@Target(ElementType.PARAMETER)\n\
    @Target(ElementType.TYPE_PARAMETER)\n@Target(ElementType.TYPE_USE)\n```\n\nExample:\n\
    \n```java\n// @Author can only be used to annotate constructors and methods.\n\
    \n@Target({ElementType.CONSTRUCTOR, ElementType.METHOD})\n@interface Author {\n\
    \  String name()\n}\n\n@Author(name = \"Joe\")\nclass myClass{...}\n\n@Author(name\
    \ = \"Bob\")\nmyClass () {...}\n\n@Author(name = \"Mike\")\npublic void myMethod\
    \ () {... }\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_169_0.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_169_1.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_169_2.png)\n\n## JavaFX API\n\nJavaFX\
    \ is a set of graphics and media packages that enables developers to create rich\
    \ client applications with high-performance modern graphical user interfaces featuring\
    \ audio, video, graphics, and animation.\n\nEach JavaFX application consists of\
    \ two major parts: application and stage. The application (represented by the\
    \ Application class) is responsible for building the stage and its elements, and\
    \ for defining the processing logic. The stage (represented by the Stage class\
    \ and other classes) is a hierarchical collection of objects defining the visual\
    \ appearance of the application.\n\nThis diagram presents the structure of JavaFX\
    \ applications:\n\n![](img/7ffd006441be7e70bb67929dee89a427_170_0.png)\n\nThe\
    \ Stage defines the environment for the JavaFX application. A default Stage instance\
    \ is provided by the JavaFX run-time environment. However, you can create multiple\
    \ Stage instances (objects).\n\nThe Scene is a container (window) that holds the\
    \ contents (i.e. elements) of the Stage. The contents of a Scene create what is\
    \ referred to as a scene graph.\n\nThe Root Node determines the layout of the\
    \ elements of the Scene.\n\nThe Node represents an element of the Scene. It could\
    \ be a button, a text box, a geometrical shape, an animation, etc.\n\nThe Application\
    \ class launches the JavaFX applications. The launch() method executes the init()\
    \ method, then start(), and after the Stage is finished (e.g. the window is closed)\
    \ – the stop() method.\n\nThe following example uses JavaFX to create a window\
    \ displaying a circle and a rectangle:\n\n![](img/7ffd006441be7e70bb67929dee89a427_171_0.png)\n\
    \n```java\nimport javafx.application.*;\nimport javafx.stage.*;\nimport javafx.scene.*;\n\
    import javafx.scene.shape.*;\npublic class testJavaFX extends Application {\n\
    \    Circle circle;\n    Rectangle rectan;\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"JavaFX: launch\");\n        launch(new\
    \ String[1]);\n    }\n    public void init() {\n        System.out.println(\"\
    JavaFX: init\");\n        System.out.println(Thread.currentThread().getName());\n\
    \        circle = new Circle(100, 40, 30);\n        rectan = new Rectangle(80,\
    \ 80, 40, 40);\n    }\n    public void start(Stage stage) {\n        System.out.println(\"\
    JavaFX: start\");\n        System.out.println(Thread.currentThread().getName());\n\
    \        Group rootNode = new Group();\n        rootNode.getChildren().add(circle);\n\
    \        rootNode.getChildren().add(rectan);\n        Scene scene = new Scene(rootNode,\
    \ 200, 200);\n        stage.setTitle(\"My JavaFX Application\");\n        stage.setScene(scene);\n\
    \        stage.show();\n    }\n```\n\nCreates an instance of class testJavaFX\
    \ and executes the init(), start(), and stop() methods. The String[] parameter\
    \ must be provided but empty.\n\nThe init() method is optional; all declarations\
    \ can be made in start(Stage).\n\nWe can create the nodes in the init() method.\n\
    \n- Build the stage and start the execution of the JavaFX application\n- Declare\
    \ a group of nodes\n- Add two nodes to the group\n- Place the nodes into a 200x200\
    \ pixel window\n- Place the scene on the stage\n- Open the window.\n\nStarting\
    \ JavaFX application.\n\nThe stop() method is optional:\n\n```java\npublic void\
    \ stop() {\n    System.out.println(\"JavaFX: stop\");\n    System.out.println(Thread.currentThread().getName());\n\
    }\n```\n\nIn addition to the new window displayed, this program performs the following\
    \ to the console:\n\nJavaFX: launch\nJavaFX: init\n\n```\nJavaFX: - Launcher\n\
    JavaFX: start\nJavaFX: Application Thread\nJavaFX: stop\nJavaFX: Application Thread\n\
    ```\n\nNote 1: The main(), init(), and stop() methods are optional. The String[]\
    \ parameter must be provided but empty.\n\nNote 2: The main(), init(), and stop()\
