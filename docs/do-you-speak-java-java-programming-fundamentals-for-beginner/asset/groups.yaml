    \        public static String getState(Airport a) { return a.state; }\n    }\n\
    \n    public static void main(String args[]) {\n        Airport a;\n        a\
    \ = Airport.MIA;\n        System.out.println(getCity(a) + \", \" + getState(a)\
    \ + \" temp=\" + getTemp(a));\n    }\n}\n```\n\nThis program produces the output:\
    \ **Miami, FL temp=80.0**\n"
