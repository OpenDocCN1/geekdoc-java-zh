    在捕获或泡泡阶段的任何时候，都可以通过执行 `Event` 类 `consume()` 方法将事件标记为“已消费”。这将停止进一步的传播。\n\n呈现（即交付）事件给对象进行处理并不意味着该事件将被或会被该对象处理。为了能够接受"
