  - '[PAGE 175]


    and process an event, every object must register itself as an event handler and
    implement some kind of event handling logic. Since events are delivered to each
    object twice – during the capturing (or filtering) phase, and during the bubbling
    (or handling) phase, the object can set up an event filter, or event handler,
    or both.


    All nodes (i.e. subclasses of the Node class), as well as the Stage and Scene
    classes define methods for registering and implementing event filters and event
    handlers:


    ```

    <T extends Event> void addEventListener(EventType<T> eventType,

    EventHandler<? super T> eventHandler);

    ```


    ```

    <T extends Event> void addEventHandler(EventType<T> eventType,

    EventHandler<? super T> eventHandler);

    ```


    There are also so-called convenience methods for registering the event handlers
    for different types of events. They are basically shorthand for the addEventHandlerMethods
    method. For example, this method registers an event handler for the "mouse clicked":


    ```

    void setMouseClicked(EventHandler<? super MouseEvent> value);

    ```


    Let’s practice and create a couple of event handlers using the addEventHandler()
    and setMouseClicked() methods.


    The setMouseClicked method declares one argument – an object of generic functional
    interface EventHandler, whose generic class parameter can be the MouseEvent or
    any superclass of MouseEvent (e.g. EventHandler<MouseEvent>, EventHandler<Event>,
    etc.).


    The EventHandler functional interface declares the following method:

    void handle(T event);


    Next, we need to create an object of type EventHandler<MouseEvent>, implement
    its handle() method, and pass this object as an argument to the setMouseClicked()
    method. This can be accomplished in several different ways, three of which are
    presented below.'
  - "[PAGE 176]\n\nThe first way of registering an event handler with the setMouseClicked()\
    \ method is by using an anonymous class:\n\n```\nnode.setMouseClicked(\n  new\
    \ EventHandler<MouseEvent>() {\\n    public void handle(MouseEvent e) {\n    \
    \  ... event handling logic ...\n    }\n});\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_176_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_176_1.png)\n\nThe second way of using\
    \ the setMouseClicked() method is by using a lambda expression:\n\n```\nnode.setMouseClicked(\n\
    \  e -> { ... event handling logic }\n});\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_176_2.png)\n\
    \nThe third way of using the setMouseClicked() method is by using a method reference:\n\
    \n```\nclass myClass {\n  public void clickHandler(MouseEvent e) {\n    ... event\
    \ handling logic ...\n  }\n  public static void main(String[] args) {\n    ...\n\
    \    node.setMouseClicked(\n      myClass::clickHandler\n    );\n  }\n}\n```\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_176_3.png)\n\nNote that the clickHandler\
    \ method must have same signature as the handle method of the EventHandler interface,\
    \ which is declared as follows:\n\n```\nvoid handle (T event)\n```\n\nThe T is\
    \ the event type we want to handle; in our case it is the MouseEvent."
  - "[PAGE 177]\n\nNow let's create an event handler using the addEventHandler() method.\
    \ The format of the addEventHandler is this:\n\n```\n<T extends Event> void addEventHandler(EventType<T>\
    \ eventType, EventHandler<?super T> eventHandler)\n```\n\nThe first difference\
    \ of this method from the previously reviewed setOnMouseClicked is that the EventHandler\
    \ object can be of any event type, not just MouseEvent. In fact, the EventHandler\
    \ can be created for the Event class and any subclass of the Event class. The\
    \ second difference - we need to tell the method which event type we will be processing\
    \ by passing it an object of typeType<T>, where T can specify the Event class\
    \ and any of its subclasses.\n\nUsing a lambda expression, we can build an event\
    \ handler for the “mouse click” event as follows:\n\n```\nnode.addEventHandler(\n\
    \  MouseEvent.MOUSE_CLICKED,\n  e -> {... event handling logic ...}\n);\n```\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_177_0.png)\n\nNote: The MouseEvent.MOUSE_CLICKED\
    \ in this example is a static variable of EventType<MouseEvent> defined in the\
    \ MouseEvent class, representing the “mouse clicked” type. Its definition is:\n\
    \n```\npublic static final EventType<MouseEvent> MouseEvent MOUSE_CLICKED\n```\n\
    \nThe registration of event filters is similar to the registration of event handlers\
    \ with the exception that there are no convenience methods provided."
  - '[PAGE 178]


    With the next example we will conclude this brief overview of the JavaFX API features.
    The example illustrates everything we have learned so far about the JavaFX event
    handling mechanism. When executed on a Windows system, it will display the following
    window:


    ![](img/7ffd006441be7e70bb67929dee89a427_178_0.png)


    After you click anywhere within the black rectangle, the following messages will
    be printed on the console:


    +   Capturing phase: Stage clicked

    Capturing phase: Scene clicked

    Capturing phase: Group clicked

    Capturing phase: Rectangle clicked


    +   Bubbling phase: Rectangle clicked

    Bubbling phase: Group clicked

    Bubbling phase: scene clicked

    Bubbling phase: stage clicked


    To stop the JavaFX application, close the displayed window.'
  - "[PAGE 179]\n\n# The JavaFX event handling example:\n\n```\nimport javafx.application.*;\n\
    import javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.shape.*;\n\
    import javafx.event.*;\nimport javafx.scene.input.MouseEvent;\n\npublic class\
    \ testJavaFX_events extends Application {\n    public void start(Stage stage)\
    \ {\n\n        stage.addFilter(MouseEvent.MOUSE_CLICKED,\n            e -> System.out.println(\"\
    Capturing phase: Stage clicked\"));\n\n        stage.addEventHandler(MouseEvent.MOUSE_CLICKED,\n\
    \            e -> System.out.println(\"Bubbling phase: Stage clicked\"));\n\n\
    \        Rectangle rect = new Rectangle(80, 30, 40, 40);\n        rect.addFilter(MouseEvent.MOUSE_CLICKED,\n\
    \            e -> System.out.println(\"Capturing phase: Rectangle clicked\"));\n\
    \n        rect.setOnMouseClicked(\n            e -> System.out.println(\"Bubbling\
    \ phase: Rectangle clicked\"));\n\n        Group rootNode = new Group();\n\n \
    \       rootNode.addFilter(MouseEvent.MOUSE_CLICKED,\n            e -> System.out.println(\"\
    Capturing phase: Group clicked\"));\n\n        rootNode.setOnMouseClicked(\n \
    \           e -> System.out.println(\"Bubbling phase: Group clicked\"));\n   \
    \     rootNode.getChildren().add(rect);\n\n        Scene scene = new Scene(rootNode,\
    \ 200, 100);\n        scene.addFilter(MouseEvent.MOUSE_CLICKED,\n            e\
    \ -> System.out.println(\"Capturing phase: Scene clicked\"));\n\n        scene.setOnMouseClicked(new\
    \ EventHandler<MouseEvent>() {\n            public void handle(MouseEvent e) {\n\
    \                System.out.println(\"Bubbling phase: Scene clicked\"); \n   \
    \         }\n        });\n\n        stage.setTitle(\"JavaFX Events\");\n     \
    \   stage.setScene(scene);\n        stage.show();\n    }\n}\n```"
