    # Program Flow Control


    Most computer languages, including Java, support the following fundamental program
    flow constructs:


    +   - Sequential Statement

    - Block of Statements

    - Two-Choice (IF structure)

    - Multiple-Choice (CASE structure)

    - Iteration

    - Jump (GOTO statement)


    Java’s implementation of these constructs is presented in this paragraph.


    # The Sequential Statement


    The Sequential Statement does not change the program flow.


    ![](img/7ffd006441be7e70bb67929dee89a427_33_0.png)


    The assignment statement like x = b; is an example of a sequential statement.
    Java also has an empty statement, which is just a semicolon (;) without any expression
    in front of it.


    # The Statement Block


    The Statement Block is a group of statements and optional declarations enclosed
    within the curly brackets:


    {declarations and statements}


    The program flow outside of the Statement Block is not affected:


    ![](img/7ffd006441be7e70bb67929dee89a427_33_1.png)'
