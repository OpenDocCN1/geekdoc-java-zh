  - "[PAGE 141]\n\n# Try-With-Resources\n\nThere is one nice enhancement added to\
    \ the stream handling process in JDK7. It allows to automatically release the\
    \ resources held by a stream (e.g. close the file) once we are done using the\
    \ stream. This feature can be used with the classes implementing the AutoClosable\
    \ interface, which declares only one method - close(). The close method will be\
    \ called when the try block ends.\n\nThe new format of the try block:\n\n```\n\
    try ( resource declaration and initialization )\n{ usage of the resource }\ncatch\
    \ ( . . .) { . . . }\n```\n\nExample:\n\n```\nclass mystream extends OutputStream{\n\
    \    public void writeInt(int i) {}\n    public void write(byte[] b, int offset,\
    \ int lng) {\n        System.out.println(\"Received bytes: \" + lng);\n    }\n\
    }\nclass teststreams {\n    public static void main(String args[]) {\n    try\
    \ (\n        DataOutputStream dataout =\n            new DataOutputStream(\n \
    \           new BufferedOutputStream(\n                new myStream()))\n    )\n\
    \    dataout.writeInt(123);\n    // dataout.flush();\n    } catch (IOException\
    \ e) {\n        System.out.println(\"I/o error\");\n    }\n}\n```\n\n> Start of\
    \ the resource (stream) declaration\n\n> the flush() or close() would be required\
    \ in a \"traditional\" try block.\n\n> the dataout.close() will be automatically\
    \ called at the end of the try block"
  - "[PAGE 142]\n\n# Serialization\n\nByte output streams have the capability of writing\
    \ Java objects from computer memory into output devices or data streams, and byte\
    \ input streams can read them back into the computer memory. The process of writing\
    \ an object into a stream is called serialization, and the process of reading\
    \ an object from a stream is called deserialization.\n\nEvery Java object is a\
    \ complex structure that may include methods, variables, and even other objects.\
    \ That structure is referred to as an \"object graph\". Java encodes all data\
    \ into a special internal format before writing it out into a stream.\n\nThe implementation\
    \ of serialization/deserialization is done by the ObjectOutputStream and ObjectInputStream\
    \ classes. Their main methods are writeObject() and readObject(), respectively.\n\
    \nThe writeObject method can serialize any object, as long as its class implements\
    \ the Serializable interface. The Serializable interface does not declare any\
    \ constants or methods; it is an indication of objects of this class are allowed\
    \ to be serialized.\n\nExample:\n\n```\n// write one object of myClass into file\
    \ object.txt\nimport java.io.*;\nclass myClass implements Serializable {\n   \
    \ private String name;\n}\nclass myClass(String s) { this.name = s; }\npublic\
    \ String getName() { return name; }\npublic static void main(String args[]) {\n\
    \    // write one object of class objout to file object.txt\n    try {\n     \
    \   ObjectOutputStream objout = new ObjectOutputStream(\n            new FileOutputStream(new\
    \ File(\"object.txt\")));\n);\n        objout.writeObject(new myClass(\"First\
    \ object\"));\n\n        // Create a new myClass\n        object and write it\
    \ to a file\n```"
