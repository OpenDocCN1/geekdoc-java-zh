    \n# “main” 方法\n\n**main** 方法是一个特殊的方法，用于启动所有 Java 程序的执行。Java 在所有用于执行的类中查找此方法，并期望它的定义完全如下：\n\
    \n```java\npublic static void main (String args[]) { body }\n```\n\n# 类和对象\n\n\
    Java 是一种面向对象的语言，这意味着它的首要目的是操作对象。对象（Object）是一个由数据和代码组成的逻辑实体。所有对象都是由称为类（class）的模板构建的，这使得类成为\
