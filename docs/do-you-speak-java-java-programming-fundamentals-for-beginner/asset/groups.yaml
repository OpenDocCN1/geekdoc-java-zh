  - '[PAGE 83]


    # Passing Generic Classes as Parameters


    Objects of generic classes can be passed as parameters to methods, in the same
    way as other Java objects:


    ```

    class GenericClass <T> { ... }

    public void myMethod(GenericClass g) { ... }

    GenericClass<A> a = new GenericClass<A> ();

    GenericClass<B> b = new GenericClass<B> ();

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_83_0.png)


    ![](img/7ffd006441be7e70bb67929dee89a427_83_1.png)


    ```

    myMethod(a);

    myMethod(b);

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_83_2.png)


    As you see, myMethod() can accept any object of type GenericClass T used in creating
    objects. We can add some type safety checking to the process by specifying restrictions
    on the input parameter of myMethod(). This is accomplished with the help of the
    wildcard parameter <?. The example below demonstrates the usage of the ?> parameter
    in method declaration:


    ```

    abstract class AB { ... }

    class A extends AB { ... }

    class B extends AB { ... }

    ...

    class G <T extends AB> { ... }

    public void myMethod(G<?> g) { ... }

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_83_3.png)


    ![](img/7ffd006441be7e70bb67929dee89a427_83_4.png)


    ![](img/7ffd006441be7e70bb67929dee89a427_83_5.png)


    ```

    public void myMethod(G<?> extends AB> g) { ... }

    public void myMethod(G<?> super B> g) { ... }

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_83_6.png)


    In this example <? extends B> sets the upper boundary for passing object references,
    and <? super B> sets the lower boundary.'
  - "[PAGE 84]\n\n# Generic Interfaces\n\nGeneric interfaces are declared in a way\
    \ similar to the declaration of generic classes, for example:\n\n```\ninterface\
    \ GenericInterface <T> {\n    public void myID(T id);\n}\n```\n\nThe type-variable(s)\
    \ in the interface declaration are passed to the interface from the class implementing\
    \ that interface:\n\n```\nclass myClass <T> implements myInterface <T> {...}\n\
    interface myInterface <T> { ... }\n```\n\nThis is why generic interfaces can only\
    \ be implemented by generic classes.\n\nIt is possible to restrict the scope of\
    \ type-variables in the class declaration, in the interface declaration, or in\
    \ both:\n\n```\nclass myClass <T extends AB> implements myInterface <T> {...}\n\
    interface myInterface <T extends ABC> { ... }\n```\n\nThe Java compiler performs\
    \ type safety checking by comparing the bounds set for the type arguments in the\
    \ class to the bounds set in the interface. The class type arguments must be within\
    \ bounds of the interface class arguments.\n\nNote: Whether the type-variable\
    \ T is used (or how it is used) in the bodies of the class or interface, is irrelevant\
    \ to the type safety checking process – the type safety checking will be performed\
    \ anyway."
