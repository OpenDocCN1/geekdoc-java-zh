  - "[PAGE 149]\n\n# The Stream API\n\nStream API is a new application programming\
    \ interface added in JDK 8. It is not an extension to or a replacement of the\
    \ previously discussed I/O streams (byte and character streams). The stream API\
    \ introduced a new stream concept. It sees any stream as a sequence of objects\
    \ on which various manipulations are performed. Using the stream API classes,\
    \ we can apply different transformations to the stream (sorting, filtering, etc.)\
    \ and produce either another stream (i.e. sequence of objects) or a final result.\
    \ There are no ultimate “destination points” like files or network sockets. For\
    \ example, we might want to find the array element with the highest value. In\
    \ this case the result is not a destination, but rather some value derived from\
    \ the source data. Note that the data source remains unchanged in stream processing.\n\
    \nLet’s with a very small and simple example.\n\n```\n// Find the lowest value\
    \ stored in an array of integers\n```\n\n```\nimport java.util.*;\nimport java.util.stream.*;\n\
    \nclass testStreamAPI {\n    public static void main(String args[]) {\n      \
    \  int[] integers = {8, 5, 7, 2, 3, 4};\n\n        IntStream same = Arrays.stream(integers);\n\
    \        OptionalInt val = same.min();\n        System.out.println(val.getAs());\n\
    \    }\n```\n\nWhat should be noted about this example is that the min() method\
    \ applied to the stream produces a final result, i.e. the result is not a stream.\
    \ Methods that produce final results are known as terminal operations, which consume\
    \ the stream. Other methods that return the result as another stream are called\
    \ intermediate operations. The next example presents two-stage stream processing\
    \ involving intermediate and terminal methods."
  - '[PAGE 150]


    Let’s say that we have an array of double numbers and we want to calculate the
    sum of all elements, but first round them up to the next larger integer. This
    can be accomplished with a single line of code, but we will present and explain
    each step of the process.


    The first step is to convert the array of doubles into a stream. We can use the
    static method stream of the class Arrays that returns a sequential stream of type
    DoubleStream.


    ```

    double[] doubles = {1.5, 2.6, 3.3};

    DoubleStream dblstream = Arrays.stream(doubles);

    ```


    The next step is to transform the stream of doubles into a stream of integers
    while rounding each double to the next larger integer. We can utilize the mapToInt
    method of the interface DoubleStream for this. The mapToInt method is declared
    as follows:


    ```

    IntStream mapToInt(DoubleToIntFunction mapper);

    ```


    It accepts an object of the functional interface DoubleToIntFunction, applies
    its method applyAsInt each element of the stream, and returns the new IntStream,
    so we need to create an object of type DoubleToIntFunction, implementing the method
    applyAsInt according to our needs. The easiest way to do this is by using lambda
    expression:


    ```

    DoubleToIntFunction mapper = n -> (n + 0.5);

    ```


    This statement will create the mapper of type DoubleToIntFunction with the applyAsInt
    method defined as:


    ```

    int applyAsInt(double n) { return (int)(n+0.5); }

    ```


    Now we’re ready to transform a DoubleStream into an IntStream:


    ```

    IntStream intstream = dblstream.mapToInt(mapper);

    ```


    The final step is to calculate the sum of all elements of the integer stream using
    the sum() method of IntStream:


    ```

    int sum = intstream.sum();

    ```


    When put together, the code will look as follows:


    ```

    double[] doubles = {1.5, 2.6, 3.3};

    DoubleStream dblstream = Arrays.stream(doubles);

    DoubleToIntFunction mapper = n -> (n + 0.5);

    IntStream intstream = dblstream.mapToInt(mapper);

    int sum = intstream.sum();

    ```'
