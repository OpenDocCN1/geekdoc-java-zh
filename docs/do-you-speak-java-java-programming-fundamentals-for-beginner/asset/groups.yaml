    \ the Observer interface offers a simple mechanism of establishing communication\
    \ between objects. One object (observable object) can be watched (observed) by\
    \ one or more other objects (observers). When needed, the object being observed\
    \ can notify observers, and they can perform some actions.\n\n| M extends Observable\
    \ | W1 implements Observer |\n|---|---|\n| m = new M() | w1 = new W1() |\n| m.addObserver(w1)\
    \ | w1.update() |\n| m.addObserver(w2) | W2 implements Observer |\n| | w2 = new\
    \ W2() |\n| m.notifyObservers() | w2.update() |\n\nExample:\n\n```\nimport java.util.*;\n\
    public class superClass extends observable implements Observer {\nString methodName;\n\
    public superClass(String s) { methodName = s };\n```\n\n```\npublic void update(Observable\
    \ m, Object arg) {\n    System.out.println(methodName + \" \" + arg + \n     \
    \   \" from \" + methodName);\n}\n```\n\n```\npublic static void main(String args[])\
    \ {\n    MyClass m = new MyClass(\"manager\");\n\nm.addObserver(new MyClass(\"\
    Bob\"));\nnm.addObserver(new MyClass(\"Joe\"));\n\nm.setChanged();\n\n    m.notifyObservers(\"\
    message\");\n}}\n```\n\nCreate two new objects and register them as observers\
    \ of object m.\n\nThe setChanged() must be called before each notification\n\n\
    The update() method of each observer will be called;\nNote: m will be passed to\
    \ update() automatically.\n\nThe output of this program:\n\n\"Bob received a message\
    \ from manager\"\n\"Joe received a message from manager\""
