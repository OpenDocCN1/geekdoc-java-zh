    \ the event type we want to handle; in our case it is the MouseEvent.\n\nNow let's\
    \ create an event handler using the addEventHandler() method. The format of the\
    \ addEventHandler is this:\n\n```\n<T extends Event> void addEventHandler(EventType<T>\
    \ eventType, EventHandler<?super T> eventHandler)\n```\n\nThe first difference\
