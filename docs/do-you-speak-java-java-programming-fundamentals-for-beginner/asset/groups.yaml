  - "[PAGE 110]\n\n# Handling Checked Exceptions\n\nChecked exceptions are exceptions\
    \ explicitly declared and thrown by some Java classes or by user programs. If\
    \ your program uses a Java class or calls a method that could throw a checked\
    \ exception, you must catch that exception or explicitly propagate it up to the\
    \ calling method.\n\nThis diagram illustrates how the checked exceptions should\
    \ be processed:\n\n![](img/7ffd006441be7e70bb67929dee89a427_110_0.png)\n\nNote\
    \ that this method must be declared with the throws someException clause if it\
    \ can create and throw its own exception or if it catches a checked exception\
    \ and re-throws it with the throw someException statement.\n\nExample:\n\n```\n\
    // Explicit propagation of checked exceptions\nimport java.io.*;\nclass MyClass\
    \ {\n    public static void main(String[] args) {\n        String file = \"not_existing_file\"\
    ;\n        try {\n            checkFile(file);\n        } catch (IOException e)\
    \ {\n            system.out.println(\"main: checkFile failed!\");\n        }\n\
    \    }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_110_1.png)"
- md: "\n```java\npublic static void checkFile (string file) throws IOException {\n\
    \    FileReader f;\n    try {\n        f = new FileReader(file);\n    } catch\
    \ (IOException e) {\n        System.out.println(\"checkFile: IOException!\");\n\
    \        throw e;\n    }\n}\n```\n\n> Method can throw an IOException\n> Catches\
    \ all I/O exceptions\n> Propagates IOException up to the main method\n\nThe above\
    \ code produces the output:\n\ncheckFile: IOException!\nmain: checkFile failed!\n\
    \nIn addition to the pre-defined set of checked and unchecked exceptions provided\
    \ by Java, you can build your own exceptions, similar to **checked exceptions**.\
    \ To understand how it's done, we will first review the exceptions classes.\n\n\
    ## Exceptions Class Hierarchy\n\nFor every exception, Java creates an object containing\
    \ some useful information about the exception. Each type of exception is represented\
    \ by its own class - FileNotFoundException, IndexOfBoundsException, etc. All these\
    \ classes are sub-classes of the top class **Throwable**. The diagram below shows\
    \ the hierarchy of the exceptions classes:\n\n![](img/7ffd006441be7e70bb67929dee89a427_112_0.png)\n\
    \n**Error** and **RuntimeExceptions** are **unchecked** exceptions and are not\
    \ required to be caught and handled. The rest are **checked** exceptions that\
    \ must be handled by application logic if they can be thrown during execution.\n\
    \nClass Throwable provides several useful methods that can be used in the exception\
    \ handling logic of your program. Here are some of them:\n\n| String getMessage()\
    \ | Returns the detailed message string for this exception |\n| :--- | :--- |\n\
    | void printStackTrace() | Sends the above message and the trace information to\
    \ the standard error stream |\n| String toString() | Returns a short description\
    \ of this exception |\n\nNow, that we know how the exceptions classes are organized,\
    \ let’s take a look at how to create a custom one.\n\n## Creating Custom Exceptions\n\
    \nA custom, user-defined exception can be built as a sub-class of the Exception\
    \ class as follows:\n\n```java\nclass CustomException extends Exception {\n  \
    \  public CustomException(String msg) {\n        super(msg);\n    }\n    void\
    \ runMyTest() {\n}\n\npublic static void main(String args[]) {\n    try {\n  \
    \      testMyException();\n    } catch (CustomException e) {\n        System.out.println(\
    \ e.getMessage() );\n    }\n}\n\n// Method that throws CustomException\npublic\
    \ static void testMyException( ) throws CustomException {\n    CustomException\
    \ e;\n    e = new CustomException(\"My exception\");\n    throw e;\n}\n}\n```\n\
    \n## Threads\n\nWhen two or more parts of a program are running concurrently,\
    \ such program is called a multithreaded program. Each path of execution is called\
    \ a thread. Every Java program has at least one thread that starts with the main\
    \ thread.\n\n## Starting Threads\n\nAn application program can create as many\
    \ threads as needed. To be able to create a thread, a class needs either to extend\
    \ the Thread class, or implement the Runnable interface. In both cases, the class\
    \ creating a thread must implement the run() method. The below diagram illustrates\
    \ the two ways of creating threads. Note that in both cases an object of type\
    \ Thread must be present and have access to the run() method of your class:\n\n\
    | Object of type Thread | Object of type Thread |\n| :--- | :--- |\n| class Thread\
    \ | class Thread |\n| start {...} | start {...} |\n| class A extends Thread run()\
    \ {...} | class B implements Runnable run() {...} |\n\nAs the diagram shows, a\
    \ thread is started by the start() method of class Thread that calls the run()\
    \ method defined in the class starting the thread.\n\nIn this example new thread\
    \ is started by an object of class myClass extends the Thread class:\n\n```java\n\
    class myClass extends Thread {\n  public void run() {}\n  public static void main(String\
    \ args[]) {\n    myClass th1 = new myClass();\n    th1.start();\n  }\n}\n```\n\
    \nWhen your class extends the Thread class, the only method that you have to implement\
    \ is the run() method. This method should define the processing that will be done\
    \ by the new thread. Note, that the run() method defined by the class Thread is\
    \ empty and does nothing.\n\nYou can also implement (i.e. override) other methods\
    \ of class Thread, but with one exception – the start() method. If you implement\
    \ the start() method, and even if it calls the run() method, no threads will be\
    \ started, run() will be executed as a regular method of your class, within the\
    \ current thread.\n\nThis method of creating threads is completely acceptable,\
    \ but if you are not intending to override other methods of class Thread besides\
    \ the run() method, a better approach would be to implement the Runnable interface.\n\
    \nIn this example a new thread is created by an object of class myClass implementing\
    \ the Runnable interface:\n\n```java\nclass myClass implements Runnable {\n  \
    \  public void run() {\n}public static void main (String args[]) {\n    Thread\
    \ th2 = new Thread(new myClass() );\n    th2.start();\n}\n}\n```\n\nThe Runnable\
    \ interface declares only one method – run(), so your class needs to implement\
    \ just that method. To start a new thread, the program has to create an object\
    \ of class Thread using the following constructor:\n\nThread (Runnable target)\n\
    \nHere, target is an instance of your class.\n\nIt's important to reiterate that\
    \ a thread can be started only by the start() method of a Thread object. In the\
    \ first example, when a sub-class of Thread was instantiated, an object of class\
    \ Thread was created automatically by calling the super() constructor. In the\
    \ second example, we created a Thread object explicitly, and at the same time\
    \ passed an object of the class myClass to it.\n\nHere is a sample program that\
    \ starts one thread.\n\n```java\nimport java.io.IOException;\nclass testThread\
    \ implements Runnable {\n    public static void main(String args[]) {\n      \
    \  Thread th = new Thread(new testThread());\n        th.setName(\"Thread 1\"\
    );\n        th.start();\n\ntry {\n            System.out.println(\"main: hit enter...\"\
    );\n            System.in.read();\n        } catch (Exception e) {\n         \
    \   System.out.println(\"main exception: \" + e);\n        }\n        System.out.println(\"\
    main ended\");\n    }\n```\n\n```java\npublic void run() {\n    String name =\
    \ Thread.currentThread().getName();\n    try {\n        System.out.println(\"\
    thread: hit enter...\");\n        System.in.read();\n    } catch (Exception e)\
    \ {\n        System.out.println(\"thread exception: \" + e);\n    }\n    System.out.println(name\
    \ + \" \" thread ended\");\n}\n```\n\nThe above program will prompt you to hit\
    \ Enter twice. The first request will come from the thread, the second – from\
    \ the main method. You should hit Enter twice to first stop the execution of the\
    \ main method, then the thread execution.\n\n## Daemon Threads\n\nWhen you execute\
    \ the previous program, you will notice that the main thread ends once you hit\
    \ Enter, but the thread will continue running until you hit again. Threads that\
    \ continue execution after the parent thread die are called user threads. Another\
    \ type of threads is called daemon threads. A daemon thread dies once its parent\
    \ thread dies. By default, a newly created thread is a daemon; to make it so,\
    \ you need to mark it as such by calling setDaemon(true). Make sure it is done\
    \ before you start the thread:\n\n```java\nThread th = new Thread(new myClass()\
    \ );\nth.setDaemon(true);\nth.start();\n```\n\n## Interrupting Thread Execution\n\
    \nA thread can be interrupted by another thread via the instance method interrupt():\n\
    \n```java\nThread th = new Thread(new myClass() );\nth.start();\n```\n\nThe interrupt\
    \ method sets a flag in the thread object, which has to be checked in the run()\
    \ method to have any effect.\n\n```java\npublic void run() {\n    if (Thread.interrupted())\
    \ {\n        System.out.println(\"I was interrupted\");\n    }\n}\n```\n\nNeither\
    \ of these methods stop thread execution. They merely allow to \"send a signal\"\
    \ to the thread, but how to process this \"signal\" is up to the thread being\
    \ interrupted.\n"
