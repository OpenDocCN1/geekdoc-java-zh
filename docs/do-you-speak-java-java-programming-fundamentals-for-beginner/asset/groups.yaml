    The final modifier can be applied to variables, methods, and classes to \"finalize\"\
    \ their declaration.\n\nA final variable cannot be modified after it is assigned\
    \ an initial value. That effectively makes a final variable constant:\n\n```\n\
    final double pi = 3.1415926;\n```\n\nA final method cannot be overridden. If a\
    \ class declares some method as final, the sub-classes of that class cannot create\
    \ a method with the same signature as the final method.\n\nA final class cannot\
    \ have sub-classes, i.e. it cannot be inherited.\n"
  mdcn: '

    由于独立的字符串字面量表示一个 String 对象，因此你可以像操作对象一样操作它，而无需创建引用。例如，你可以调用 String 类的实例方法 `length()`
    来获取字面量的长度，如下所示：


    ```

    int n = "text".length(); // n = 4

    ```


    关于 String 对象的另一个重要事实：


    > 一旦创建并初始化，String 对象就不能被修改。它的值不能被追加、截断或替换。如果你需要一个可修改的字符串——请使用 `StringBuffer` 类（本书未涵盖内容）。


    ## 比较字符串


    理解比较两个实际字符串值与比较两个 String 对象的引用之间的区别是非常重要的：


    ```

    String s1 = "text";

    String s2 = "text";

    boolean b = (s1 == s2); // b=true

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_69_0.png)


    ```

    String s3 = new String("text")

    String s4 = new String("text")

    boolean b = (s3 == s4); // b=false

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_69_1.png)


    要比较两个字符串的实际值（这些值实际上封装在 String 对象中），我们需要使用 String 类的实例方法 `equals()`：


    ```

    String s1 = new String("text")

    String s2 = new String("text")

    boolean b = ( s1.equals(s2) ); // b = true

    ```


    ## 字符串拼接运算符


    字符串拼接运算符 (`+`) 将两个操作数合并为一个字符串。基本数据类型操作数（`boolean`、`char`、`int`、`double` 等）会被转换为它们的字符串表示，对象操作数则通过调用实例方法
    `toString()` 转换为字符串。这种类型转换是以操作为基础从左到右进行的，如下例所示：


    示例 1：


    ```

    String s = "I have " + 5 + 4 + " dollars";

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_70_0.png)


    示例 2：


    ```

    String s = "I have " + 5 * 4 + " dollars";

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_70_1.png)


    ## String 方法


    在本节中，我们将介绍 String 类的一些常用方法。


    ### 确定字符串长度


    ```

    String s = "text";

    int lng = s.length(); // lng = 4

    lng = "my string".length(); // lng = 9

    ```


    ### 比较字符串


    `compareTo()` 方法按字典顺序比较两个字符串。比较是基于字符串中每个字符的 Unicode 值进行的，通过从左到右逐个比较字符完成，直到找到不相等的字符或到达其中一个字符串的结尾。`compareTo()`
    方法返回的值计算方式为不相等字符的值之差（''a'' - ''b'' = -1）。如果其中一个字符串到达末尾，该方法返回两个字符串长度的差。


    ```

    String s = "ab";

    int n = s.compareTo("ab"); // n = 0

    ```


    ### 访问字符串字符


    ```

    String s = "abcdef";

    char c1 = s.charAt(0); // c1 = ''a''

    char c2 = s.charAt(5); // c2 = ''f''

    ```


    ### 查找字符


    ```java

    String s = "abcd";

    int pos;

    pos = s.indexOf(''g''); // pos=-1 (未找到字符 ''g'')

    pos = s.indexOf(''b'',2); // pos=+3 (位置 2 之后的第一个 ''b'' 在位置 3)

    pos = s.lastIndexOf(''c''); // pos=+4 (最后一个符号 ''b'' 在位置 4)

    ```


    ### 查找子字符串


    ```java

    String s = "abcd";

    int pos;

    pos = s.indexOf("abd"); // pos = -1 (未找到子字符串 ''abd'')

    pos = s.indexOf("bc"); // pos = 1 (子字符串 ''bc'' 在位置 1)

    ```


    ### 提取子字符串


    ```java

    String s = "abcdef";

    String s1 = s.substring(1,3); // s1 = "bc"

    String s2 = s.substring(1); // s2 = "bcdef"

    ```


    ### 从现有字符串创建新字符串


    ```

    String s = " abc";

    String s1 = s.trim(); // s1 = "abc"

    String s2 = s.replace('' '', ''+''); // s2 = "+abc"

    ```


    ### 从字符串创建字符数组


    ```

    String s = "abcd";

    char[] c = s.toCharArray();

    s.getChars(0, 2, c, 2);


    c[0]=''a''

    c[1]=''b''

    c[2]=''c''

    c[3]=''d''

    ```


    > 将字符串中位置 0, 1 的字符复制到数组 c 中，从位置 2 开始。


    ```

    c[0]=''a''

    c[1]=''b''

    c[2]=''a''

    c[3]=''b''

    ```


    ### 从字符串创建字节数组


    此方法将字符串的每个字符从 Unicode（16 位）转换为本地 8 位编码（通常是 ASCII）并创建一个字节数组。


    ```java

    String s = "abcd";

    byte[] b = s.getBytes();


    b[0]=97 (''a'' 的 ASCII)

    b[1]=98 (''b'' 的 ASCII)

    b[2]=99 (''c'' 的 ASCII)

    b[3]=100 (''d'' 的 ASCII)

    ```


    ### 从字符数组创建字符串


    String 类的静态方法 `copyValueOf` 用于从字符数组创建一个 String 对象。它有以下两种格式：


    ```

    static copyValueOf(char[] charArray);

    ```


    ```

    static copyValueOf(char[] charArray, int startPos, int numberOfElements);

    ```


    示例：


    ```

    char[] c = {''a'', ''b'', ''c'', ''d''};

    String s1 = String.copyValueOf(c); // s1 = "abcd";

    String s2 = String.copyValueOf(c,1,2); // s2 = "bc";

    ```


    ## 包


    包是类的容器。所有的 Java 类都分布在 200 多个包中。基础类位于 `java.lang` 包中。其他包的示例包括 `java.io`、`java.util`、`java.net`、`java.math`
    等。


    包按树形结构排列：


    ![](img/7ffd006441be7e70bb67929dee89a427_74_0.png)


    `java.lang` 包对 Java 编译器始终可用。当你的程序需要使用位于不同包的类时，该类或包含该类的整个包必须导入到程序中：


    ```java

    import java.math.*;

    import java.io.FileReader;

    class myClass { ... }

    ```


    | 包中的所有类 |

    | :--- |

    | java.math 将可用 |

    | 来自包 java.io 的 FileReader 将可用 |


    用户定义的类也放置在包中。例如，上述示例中的 `myClass` 将被放置在默认的“无名”包中。要将其放入特定包中，程序的第一个条语句（不计算注释行）必须是
    `package` 语句：


    ```java

    package mypackage;

    import java.math.*;

    import java.io.FileReader;

    class myClass { ... }

    ```


    （注：原文中后半部分存在大量重复的 OCR 错误文本，已根据要求进行过滤，仅保留核心逻辑结构）

