    ));\n    );\n\n    Object obj = objin.readObject();\n\n    myClass myObj = (myClass)\
    \ obj;\n\n    System.out.println(myObj.myName());\n}\ncatch (IOException e) {\n\
    \    System.out.println(\"I/o error\");\n}\n\ncatch (ClassNotFoundException e)\
    \ {\n    System.out.println(\"Class not found error\");\n}\n```\n\nWhen you serialize\
    \ an object, you can choose not to serialize some of its members - primitive types\
    \ or other objects. For this, you declare a variable as transient. In the above\
    \ example, prevent the name variable from being written out to the file, declare\
    \ it as follows:\n\nprivate transient string name;\n\nDuring deserialization the\
    \ transient variables are set to their default values - zero for numbers, true/false\
    \ for Boolean, and null for objects.\n\nIn the above example, if the name variable\
    \ was declared as transient, the output of the program would be “null” because\
    \ strings are objects in Java.\n\nA special situation will occur if your serializable\
    \ class extends a non-serializable class. During the deserialization process,\
    \ an instance of the non-serializable class (your superclass) will be created\
    \ automatically using the no-argument constructor. You have to make sure that\
    \ such a no-argument constructor of the superclass exists."
  - '[PAGE 144]


    # New Input/Output System - NIO


    Since the inception of the language, Java''s approach to the input/output operations
    was stream-oriented. The transmission of data between the application and an external
    entity (e.g. a disk file) was seen as a stream of single bytes or characters.


    Based on the direction of the stream and the type of data transmitted, streams
    are divided into four categories: byte input stream, byte output stream, character
    input stream, and character output stream. Each of these streams is represented
    by a group of Java classes, each extending, respectively, InputStream class (byte
    input stream), OutputStream class (byte output stream), and Writer class (character
    output stream).


    The common characteristic of all the above streams is that they are blocking data
    streams. It means that the current execution thread of your application is put
    on hold until the I/O request is completed.


    In version 1.4 Java first introduced an alternative input/output system named
    New Input Output, or just NIO, which the I/O concept changed from the stream-oriented
    to buffer/channel-oriented.


    ![](img/7ffd006441be7e70bb67929dee89a427_144_0.png)


    Here are the highlights of NIO features:


    +   - All data is transmitted via a channel into out of a buffer. The application
    manipulates data directly in the buffer.

    - Unlike standard streams, a channel can transmit data in both directions.

    - Channels are capable of operating in blocking mode, same as streams, and in
    non-blocking mode. In the non-blocking mode, the thread that issues an I/O request
    is not put on hold until the I/O operation completes, but continues its execution.

    - NIO also added the capability of handling multiple channels within a single
    thread.'
- md: "\nIn addition to the above features, over time NIO was enhanced to work together\
    \ with standard I/O streams and to perform file system operations (i.e. manipulation\
    \ of files and directories).\n\nHere are the main NIO classes and interfaces:\n\
    \n## Buffer\n\nThe **Buffer** class is used to create buffers and manipulate the\
    \ buffer’s contents. There are sub-classes of the Buffer class to hold different\
    \ types of primitive data — **ByteBuffer**, **CharBuffer**, **IntBuffer**, etc.\n\
    \n## Channel\n\nThe **Channel** is actually an **interface** implemented by various\
    \ channel classes: **SocketChannel**, **DatagramChannel**, **SeekableByteChannel**,\
    \ **FileChannel**, etc. It represents a connection to an entity capable of performing\
    \ I/O operations (file, network socket, etc.).\n\n## Selector\n\nThe **Selector**\
    \ class allows a single application thread to handle multiple channels.\n\n(The\
    \ usage of the **Selector** class is beyond the scope of this book.)\n\n## Files\n\
    \nThe **Files** class provides methods to operate on files and directories. It\
    \ also can open standard byte streams (i.e. **InputStream** and **OutputStream**)\
    \ for reading from or writing to a file.\n\nThe first example illustrates the\
    \ usage of **Buffer**, **Channel**, and **Files** for passing unformatted data\
    \ (bytes) between the application program and a disk file via a blocking channel.\n\
    \n## // Example of using NIO for writing to reading from files\n\n```\nimport\
    \ java.io.*;\nimport java.nio.*;\nimport java.nio.file.*;\nimport java.nio.channels.*;\n\
    ```\n\n```\nclass testNIO {\n    public static void main (String[] args) {\n \
    \       byte[] bytes = {97, 98, 99};\n\n        ByteBuffer buffer = ByteBuffer.allocate(16);\n\
    \n        try {\n            Path path = Paths.get(\"testNIO.txt\");\n\n     \
    \       SeekableByteChannel channel = Files.newByteChannel(path,\n           \
    \     StandardOpenOption.CREATE,\n                StandardOpenOption.WRITE,\n\
    \                StandardOpenOption.READ);\n\n            buffer.put(bytes);\n\
    \            buffer.rewind();\n            channel.write(buffer);\n\n        \
    \    channel.position(1);\n            buffer.rewind();\n            channel.write(buffer);\n\
    \n            channel.truncate(3);\n            channel.position(0);\n       \
    \     buffer.rewind();\n            int i = channel.read(buffer);\n          \
    \  System.out.println(\"file length = \" + i); // prints: 3\n\n            channel.close();\n\
    \        } catch (InvalidPathException e) {\n            System.out.println(\"\
    invalid path\");\n        } catch (IOException e) {\n            System.out.println(\"\
    I/o error\");\n        }\n    }\n}\n```\n\nAfter the execution of the code, the\
    \ file testNIO.txt will contain \"aab\".\n\nThe next example demonstrates how\
    \ NIO and standard stream I/O can work together to read the contents of a file.\n\
    \n// Print the testNIO.txt file created in previous example\n\n```\nimport java.io.*;\n\
    import java.nio.file.*;\n```\n\n```\nclass testNIOStream {\n    public static\
    \ void main(String args[]) {\n        int i;\n\n        try {\n            Path\
    \ path = Paths.get(\"testNIO.txt\");\n            InputStream stream = Files.newInputStream(path);\n\
    \            do {\n                i = stream.read();\n                if (i !=\
    \ -1) {\n                    System.out.println((char) i);\n                }\n\
    \            } while (i != -1);\n            stream.close();\n        } catch\
    \ (InvalidPathException e) {\n            System.out.println(\"Invalid path\"\
    );\n        } catch (IOException e) {\n            System.out.println(\"I/o error\"\
    );\n        }\n    }\n}\n```\n\nThe last example in this chapter demonstrates\
    \ some of NIO capabilities when working with the file system.\n\n```\n// Print\
    \ all the directories on the C: drive\n```\n\n```\nimport java.io.*;\nimport java.nio.file.*;\n\
    import java.nio.file.attribute.*;\n```\n\n```\nclass testNIOFileTree {\n    public\
    \ static void main(String args[]) {\n        try {\n            Path path = Paths.get(\"\
    c:/\");\n            Files.walkFileTree(path, new CustomFileVisitor());\n    \
    \    } catch (IOException e) {\n            System.out.println(e);\n        }\n\
    \    }\n}\n```\n\n```\nclass CustomFileVisitor extends SimpleFileVisitor<Path>\
    \ {\n\n    public FileVisitResult visitFile(Path path, BasicFileAttributes attr)\n\
    \        throws IOException {\n            return FileVisitResult.CONTINUE;\n\
    \        }\n```\n\n> For each file, one of four defined methods will be called.\
    \ These methods are defined in the SimpleFileVisitor. We need to override them\
    \ if we want non-default behavior.\n\n> This method is called when a file is visited;\
    \ we do nothing and continue the scan.\n\n```java\n    public FileVisitResult\
    \ previsitDirectory(Path path, BasicFileAttributes attr)\n        throws IOException\
    \ {\n            System.out.println(path.getFileName());\n            return FileVisitResult.CONTINUE;\n\
    \        }\n```\n\n> This method is called before a directory is visited; we print\
    \ the directory name and continue.\n\n```java\n    public FileVisitResult visitFileFailed(Path\
    \ path, IOException e)\n        throws IOException {\n            return FileVisitResult.CONTINUE;\n\
    \        }\n```\n\n> This method is called when an error occurs while reading\
    \ a file; we do nothing and continue.\n\nNote: The VisitResult enumeration defines\
    \ other constants besides CONTINUE, controlling the execution of the method walkFileTree.\
    \ The SKIP_SUBTREE constant, for example, will force walkFileTree to skip visiting\
    \ the entries of the current directory.\n\n## The Stream API\n\nStream API is\
    \ a new application programming interface added in JDK 8. It is not an extension\
    \ to or a replacement of the previously discussed I/O streams (byte and character\
    \ streams). The stream API introduced a new stream concept. It sees any stream\
    \ as a sequence of objects on which various manipulations are performed. Using\
    \ the stream API classes, we can apply different transformations to the stream\
    \ (sorting, filtering, etc.) and produce a result.\n\nLet’s say we have an array\
    \ of doubles and we want to calculate the sum of all elements, but first round\
    \ them up to the next integer. This can be accomplished with a single line of\
    \ code, but we will present and explain each step of the process.\n\nThe first\
    \ step is to convert the array of doubles into a stream. We can use the static\
    \ method stream of Arrays that returns a DoubleStream.\n\n```\ndouble[] doubles\
    \ = {1.5, 2.6, 3.3};\nDoubleStream dblstream = Arrays.stream(doubles);\n```\n\n\
    The next step is to transform the stream of doubles into a stream of integers\
    \ while rounding each double to the next integer. We can utilize the mapToInt\
    \ method of the interface DoubleStream for this. The mapToInt method is declared\
    \ as follows:\n\n```\nIntStream mapToInt(DoubleToIntFunction mapper);\n```\n\n\
    It accepts an object of the functional interface DoubleToIntFunction, applies\
    \ its method applyAsInt each element of the stream, and returns the new IntStream,\
    \ so we need to create an object of type DoubleToIntFunction, implementing the\
    \ method applyAsInt according to our needs. The easiest way to do this is by using\
    \ lambda expression:\n\n```\nDoubleToIntFunction mapper = n -> (n + 0.5);\n```\n\
    \nThis statement will create the mapper of type DoubleToIntFunction with the applyAsInt\
    \ method defined as:\n\n```\nint applyAsInt(double n) { return (int)(n+0.5); }\n\
    ```\n\nNow we’re ready to transform a DoubleStream into an IntStream:\n\n```\n\
    IntStream intstream = dblstream.mapToInt(mapper);\n```\n\nThe final step is to\
    \ calculate the sum of all elements of the integer stream using the sum() method\
    \ of IntStream:\n\n```\nint sum = intstream.sum();\n```\n\nWhen put together,\
    \ the code will look as follows:\n\n```\ndouble[] doubles = {1.5, 2.6, 3.3};\n\
    DoubleStream dblstream = Arrays.stream(doubles);\nDoubleToIntFunction mapper =\
    \ n -> (n + 0.5);\nIntStream intstream = dblstream.mapToInt(mapper);\nint sum\
    \ = intstream.sum();\n```\n"
