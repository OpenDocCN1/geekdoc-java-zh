    you very far from the “Hello world!” program. The books of the second category
    are simply too big – usually over 1,000 pages. They are very good as reference
    sources, but a bit overloaded with details and lengthy examples. They are also
    trying to cover as many topics as possible, which makes the learning curve steeper.


    The size of this book is less than two hundred pages so it is definitely not a
    reference guide. Nor is it a “Java basics” book.


    Not concentrating too much on details, and illustrating everything with small
    comprehensive examples, this book focuses on Java’s fundamental features, essential
    for building real-life applications. The goal is to create an overall understanding
    of how Java works. The details can be picked up later either from Java original
    specifications and tutorials, or from those comprehensive guides and complete
    references.


    Starting from the ground up, the book builds a solid foundation of your Java knowledge.


    If you want to become a Java expert – this book is a good start. Good luck!'
- md: "\n# Installing the Software\n\nIf you want to experiment with the sample programs\
    \ provided in this book, you need to have the JDK 8 software installed on your\
    \ machine. You can download it for free from the Oracle website:\n\nhttp://www.oracle.com/technetwork/java/javase/downloads/\n\
    \nThere are different versions of the software available, suitable for different\
    \ types of operating systems – Linux, Mac OSX, Solaris, or Windows.\n\nThe instructions\
    \ of how to install and configure the Java 8 platform for different operating\
    \ systems can be found on this page:\n\nhttps://docs.oracle.com/javase/8/docs/technotes/guides/install/\n\
    \nNote: all URLs referenced in this book might change in the future.\n\n# Working\
    \ with Examples\n\nThroughout this book numerous examples are used to illustrate\
    \ the usage of particular features of Java language. The basic structure of an\
    \ examples is this:\n\n```\n// Comments . . .\nclass className {\n    statements\
    \ . . \n    public static void main (String[] args[]) {\n        statements .\
    \ . \n        System.out.println(results);\n    }\n}\n```\n\nTo fully understand\
    \ the above syntax, several topics of this book must be read first. At this point,\
    \ the following explanations would be sufficient for working with examples.\n\n\
    Java is case-sensitive:\n\nthisVariable and ThisVariable are two different variables.\n\
    \nComments:\n\n```\n// This is a non-executable comment line\n```\n\n```\n/*\n\
    \    This is a block of commented lines\n    . . .\n*/\n```\n\nA single variable\
    \ ends with semicolon:\n\n```\nthisvariable = 5;\n```\n\nA block of statements\
    \ is included within curly brackets:\n\n```\n{ a=5; b=\"text\"; }\n```\n\nThe\
    \ DOT (.) notation:\n\n```\nobjectA.variable1; // returns the value of variable1\
    \ of objectA\nobjectA.method1(); // executes the method1 of objectA\n```\n\nThe\
    \ code to the left of the (.) must be an object, and the code to the right of\
    \ it must be the object’s property – a variable or a method. An expression with\
    \ multiple dot operators is executed from left to right.\n\n```\nSystem.out.println(\"\
    Total = \" + 5); // output: Total = 5\n```\n\n```\nSystem.out.print(\" x = \"\
    \ + 1); // output: x=1\nSystem.out.print(\" y = \" + 2); // output: x=1 y=2\n\
    ```\n\nThese are commonly used methods of printing the results. Both statements\
    \ use the \"+\" operator to concatenate all items (arguments) listed within the\
    \ brackets into a single text line and output it to the console. The print method\
    \ outputs the arguments onto the current line, appending them to the existing\
    \ contents. The println method outputs the results and switches to a new line.\n\
    \n# The main method:\n\nEvery Java application starts execution with the main\
    \ method (program):\n\n```\npublic static void main(String args[]) { code }\n\
    ```\n\n# The class:\n\nThe class className {..} is a definition of a class. Each\
    \ class definition is stored in a file with corresponding name - className.java.\n\
    \n# Object-Oriented Programming\n\nThe purpose of any computer program is to perform\
    \ some manipulations on data. This is also true for the object-oriented programs.\
    \ The difference, however, between a “traditional”, data-oriented program, and\
    \ an object-oriented program is in the way they view the data.\n\nTraditional\
    \ programs “see” and can perform some operations on individual or grouped together\
    \ elementary data elements of primitive data types – numbers, characters, text\
    \ strings, etc. Sometimes more complex data structures like tables, stacks, or\
    \ lists, along with specialized manipulation commands, could be built into the\
    \ language, but that’s about it. The highest level of abstraction stops at the\
    \ above mentioned data structures. If, for example, we want to create a representation\
    \ of some logical entity, like “Customer”, we would need to construct a new group\
    \ of data elements and build the code to access it.\n\nObject-oriented programs\
    \ bring abstraction to another level. They can still manipulate the primitive\
    \ data types – numbers, characters, etc., but the primary focus is on so-called\
    \ objects. An object is an entity that contains data along with code to access\
    \ that data. Object-oriented languages provide additional tool sets (commands,\
    \ operators, other language constructs) allowing for creation and manipulation\
    \ of objects. In the Java language, for example, we have a construct to define\
    \ **classes**, which are templates for building objects, and a special operator\
    \ **new** for creating instances of objects:\n\n```\n// Define the class “Apple\"\
    \nclass Apple {\n    data and code ...\n}\n```\n\n```\n// Create a new object\
    \ of class Apple\nobj = new Apple();\n```\n\n# Object-Oriented Design\n\nAs we\
    \ already mentioned, the main difference between traditional languages and object-oriented\
    \ programming languages is the level of abstraction in viewing the data. Traditional\
    \ languages provide means of manipulating primarily primitive data elements, while\
    \ object-oriented languages are focused on manipulating logical objects. The way\
    \ manipulation of objects is implemented in the language is based on Object-Oriented\
    \ Design (OOD) principles. The OOD consists of three main concepts – Encapsulation,\
    \ Inheritance, and Polymorphism. In general, they set up rules on how objects\
    \ and their contents should be built, and the valid relationships between objects.\
    \ In order to understand these concepts, we have to get familiar with terminology\
    \ around objects.\n\nLet’s look at the picture below:\n\n![](img/7ffd006441be7e70bb67929dee89a427_13_0.png)\n\
    \nClass A is a template (definition) for building objects. It consists of definitions\
    \ called properties and programs (executable code) called methods.\nObject 1 and\
    \ Object 2 are the instances of class A. They hold concrete values of all properties\
    \ declared in Class A.\n\nThere can be multiple classes (templates) and multiple\
    \ objects (instances) of those classes in a program. Now, let’s describe the three\
    \ OOD concepts.\n\n# Encapsulation\n\nEncapsulation principle requires that the\
    \ internals (data and code) of an object should be protected from being arbitrarily\
    \ accessed by code outside of the object. The only way to “communicate” with an\
    \ object and access its properties is through the public methods and public properties.\
    \ Below is an example of how the principle of encapsulation is implemented in\
    \ Java.\n\n```\n// Declare the class \"Apple\"\nclass Apple {\n    private String\
    \ color;\n    public void setColor(String c) {\n        color = c;\n    }\n}\n\
    ```\n\n![](img/7ffd006441be7e70bb67929dee89a427_14_0.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_14_1.png)\n\
    \n```\n// Create the \"apple1\" object of class Apple\nApple apple1 = new Apple();\n\
    ```\n\n```\n// Invoke the public method \"setcolor\" of object \"apple1\"\n//\
    \ and set the color property to \"red\"\n```\n\n```\napple1.setColor(\"red\");\n\
    ```\n\n![](img/7ffd006441be7e70bb67929dee89a427_14_2.png)\n\n# Inheritance\n\n\
    Inheritance principle applies to the relationship between classes. It states that\
    \ two classes can have a parent-child connection, in which the child class (a\
    \ subclass) inherits all the features of the parent class (a superclass).\n\n\
    ![](img/7ffd006441be7e70bb67929dee89a427_15_0.png)\n\nBelow is an example of the\
    \ inheritance mechanism.\n\n```\n// Declare the class \"Fruit\"\nclass Fruit {\n\
    \    private String color;\n    public void setColor(String c) {\n        color\
    \ = c;\n    }\n}\n```\n\n```\n// Declare the class \"Apple\" as a child of class\
    \ Fruit\nclass Apple extends Fruit {\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_15_1.png)\n\
    \n```\n// Create the \"apple1\" object of class Apple\nApple apple1 = new Apple();\n\
    ```\n\n```\n// Execute the method \"setColor\" of object \"apple1\"\n// and set\
    \ the value of color property to \"red\"\napple1.setColor(\"red\");\n```\n\nEven\
    \ though the color property and the setColor methods are not defined in the Apple\
    \ class, they are accessible in the Apple objects due to inheritance.\n\n# Polymorphism\n\
    \nPolymorphism principle dictates that it is allowed to have multiple methods\
    \ with the same name but different implementations within one or more classes,\
    \ and the language must be able to determine which variation of the method to\
    \ execute at run time.\n\nBelow are examples of how the Java language implements\
    \ polymorphism. Let's say, we need to calculate the square footage of different\
    \ shapes - rectangle, triangle, circle, etc. Each shape is represented by its\
    \ own class, and each class is a sub-class of the superclass Shape:\n\n![](img/7ffd006441be7e70bb67929dee89a427_16_0.png)\n\
    \n```\n// Declare the class Shape\nclass Shape {\n    public double footage;\n\
    \    public void showSquareFootage() {\n        System.out.println(footage);\n\
    \    }\n}\n```\n\n```\n// Declare the class Rectangle\nclass Rectangle extends\
    \ Shape {\n    double width;\n    double height;\n    Rectangle(double w, double\
    \ h) {\n        width = w;\n        height = h;\n    }\n\n    public void showSquareFootage()\
    \ {\n        footage = width * height;\n        System.out.println(footage);\n\
    \    }\n}\n```\n\n> This method is executed when an object of class Rectangle\
    \ is created.\n\n> This method calculates and displays the square footage of the\
    \ Rectangle object.\n"
  mdcn: "\n\n# 安装软件\n\n如果你想尝试运行书中提供的示例程序，你需要在机器上安装 JDK 8 软件。你可以从 Oracle 网站免费下载：\n\n\
    http://www.oracle.com/technetwork/java/javase/downloads/\n\n该软件有不同的版本可供，适用于不同的操作系统\
    \ – Linux、Mac OSX、Solaris 或 Windows。\n\n关于如何在不同操作系统上安装和配置 Java 8 平台的说明，可以在此页面找到：\n\
    \nhttps://docs.oracle.com/javase/8/docs/technotes/guides/install/\n\n注意：本书中引用的所有\
    \ URL 以后可能会发生变化。\n\n# 使用示例\n\n在本书中，使用了大量的示例来说明 Java 语言特定功能的用法。一个示例的基本结构如下：\n\n\
    ```\n// 注释 . . .\nclass className {\n    statements . . \n    public static void\
    \ main (String[] args[]) {\n        statements . . \n        System.out.println(results);\n\
    \    }\n}\n```\n\n为了完全理解上述语法，必须先阅读书中的几个主题。在目前，以下解释已足够用于处理示例了。\n\nJava 是区分大小写的：\n\
    \nthisVariable 和 ThisVariable 是两个不同的变量。\n\n注释：\n\n```\n// 这是一个不可执行的注释行\n```\n\n\
    ```\n/*\n    这是一块被注释的行\n    . . .\n*/\n```\n\n单个变量以分号结束：\n\n```\nthisvariable\
    \ = 5;\n```\n\n一个语句块包含在花括号内：\n\n```\n{ a=5; b=\"text\"; }\n```\n\nDOT (.) 符号法：\n\
    \n```\nobjectA.variable1; // 返回 objectA 变量1 的值\nobjectA.method1(); // 执行 objectA\
    \ 的方法1\n```\n\n`.` 左侧的代码必须是一个对象，而右侧的代码必须是该对象的属性 – 变量或方法。具有多个点操作符的表达式将从左到右执行。\n\
    \n```\nSystem.out.println(\"Total = \" + 5); // 输出: Total = 5\n```\n\n```\nSystem.out.print(\"\
    \ x = \" + 1); // 输出: x=1\nSystem.out.print(\" y = \" + 2); // 输出: x=1 y=2\n```\n\
    \n这些是常用的打印结果的方法。这两条语句都使用 \"+\" 运算符将括号内列出的所有项（参数）连接成单行文本并将其输出到控制台。`print` 方法将参数输出到当前行，附加在现有内容之后。`println`\
    \ 方法输出结果并切换到新行。\n\n# main 方法：\n\n每个 Java 都通过 main 方法（程序）开始执行：\n\n```\npublic static\
    \ void main(String args[]) { code }\n```\n\n# 类：\n\n类 `class className {..}` 是一个类的定义。每个类定义都存储在名称对应的文件中\
    \ – `className.java`。\n\n# 面向对象编程\n\n任何计算机程序的目的都是对数据进行某些操作。面向对象的程序也是如此。然而，“传统的”面向数据程序与面向对象的程序之间的区别在于它们看待数据的方式。\n\
    \n传统程序能够“看到”并能够对单个或分组的原始数据类型的基本数据元素（如数字、字符、文本字符串等）执行某些操作。有时，更复杂的数据结构（如表格、栈或列表）以及特殊的处理命令可以被构建到语言中，但仅此而已了。最高层次的抽象止于上述提到的数据结构。例如，如果我们想创建一个某个逻辑实体的表示（如“客户”），我们需要构建一组新的数据元素并编写访问它的代码。\n\
    \n面向对象的程序将抽象提升到了另一个层次。它们仍然可以处理原始数据类型 – 数字、字符等，但主要重点是所谓的“对象”。对象是一个包含数据以及访问这些数据代码的实体。面向对象的语言提供了额外的工具集（命令、运算符、其他语言结构），允许创建和操作对象。在\
    \ Java 语言中，例如，我们有一个用于定义**类（classes）**的结构，它们是构建对象的模板，以及一个用于创建对象实例的特殊运算符 **new**：\n\
    \n```\n// 定义类“Apple”\nclass Apple {\n    data and code ...\n}\n```\n\n```\n//\
    \ 创建一个 Apple 类的新对象\nobj = new Apple();\n```\n\n# 面向对象设计\n\n正如我们已经提到的，传统语言与面向对象编程语言之间的主要区别在于看待数据的抽象层次。传统语言提供了主要处理原始数据元素的手段，而面向对象的语言专注于处理逻辑对象。在语言中实现对象操作的方法是基于面向对象设计（OOD）原则。OOD\
    \ 由三个主要概念组成：封装、继承和多态。通常，它们规定了对象及其内容应该如何构建，以及对象之间的有效关系。为了理解这些概念，我们必须熟悉围绕对象的术语。\n\
    \n让我们看看下面的图：\n\n![](img/7ffd006441be7e70bb67929dee89a427_13_0.png)\n\n类 A 是构建对象的模板（定义）。它由被称为属性（properties）的定义和被称为方法（methods，可执行代码）程序组成。\n\
    对象 1 和对象 2 是类 A 的实例。它们持有类 A 中声明的所有属性的具体值。\n\n程序中可以有多个类（模板）和这些类的多个对象（实例）。现在，让我们来描述一下这三个\
    \ OOD 概念。\n\n# 封装\n\n封装原则要求对象的内部（数据和代码）应该受到保护，防止外部代码任意访问。与对象“通信”并访问其属性的唯一方法是通过公共方法和公共属性。下面是\
    \ Java 中实现封装原则的示例。\n\n```\n// 声明类 \"Apple\"\nclass Apple {\n    private String\
    \ color;\n    public void setColor(String c) {\n        color = c;\n    }\n  \
    \  public String getColor() {\n        return color;\n    }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_14_0.png)\n\
    \n```\n// 实例化 Apple 类\nApple apple1 = new Apple();\n// 调用公共方法 setColor 将颜色设为 \"\
    red\"\napple1.setColor(\"red\");\n// 输出颜色\nSystem.out.println(apple1.getColor());\n\
    ```\n\n![](img/7ffd006441be7e70bb67929dee89a427_14_1.png)\n\n# 继承\n\n继承原则适用于类之间的关系。它规定两个类之间可以存在父子关系，其中子类（子类）继承父类（超类）的所有特征。\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_15_0.png)\n\n下面是继承机制的示例。\n\n```\n//\
    \ 声明类 \"Fruit\"\nclass Fruit {\n    private String color;\n    public void setColor(String\
    \ c) {\n        color = c;\n    }\n    public String getColor() {\n        return\
    \ color;\n    }\n}\n```\n\n```\n// 声明 Apple 是 Fruit 的子类\nclass Apple extends Fruit\
    \ {\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_15_1.png)\n\n```\n// 创建\
    \ Apple 类的对象 apple1\nApple apple1 = new Apple();\n// 执行继承的方法 setColor 将颜色设为 \"\
    red\"\napple1.setColor(\"red\");\n```\n\n# 多态\n\n多态原则规定，在一个类或多个类中允许具有同名但实现不同的方法，并且语言能够在运行时确定执行哪种变体。\n\
    \n下面是 Java 语言实现多态的示例。假设我们需要计算不同形状的面积——矩形、三角形、圆形等。每个形状都由自己的类表示，每个类都是超类 Shape 的子类：\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_16_0.png)\n\n```\n// 声明类 Shape\nclass\
    \ Shape {\n    public double footage;\n    public void showSquareFootage() {\n\
    \        System.out.println(footage);\n    }\n}\n```\n\n```\n// 声明类 Rectangle\n\
    class Rectangle extends Shape {\n    double width;\n    double height;\n    Rectangle(double\
    \ w, double h) {\n        width = w;\n        height = h;\n    }\n\n    public\
    \ void showSquareFootage() {\n        footage = width * height;\n        System.out.println(footage);\n\
    \    }\n}\n```\n\n> 该方法在创建 Rectangle 类对象时执行。\n\n> 该方法计算并显示矩形对象的面积。\n\n"
