- md: "\n# The “for” Statement\n\nThe for statement is used for implementing the so-called\
    \ “controlled” loops. Controlled loops are basically while loops, but with explicitly\
    \ specified code that initializes and iterates the value of the variable(s) used\
    \ in the loop controlling condition:\n\n![](img/7ffd006441be7e70bb67929dee89a427_38_0.png)\n\
    \nLet's look at the previous example of the while statement:\n\n```\nint n;\n\
    n = 2;\nwhile ( n > 0 )\n{\n    system.out.println(\"n=\" + n);\n    n--;\n}\n\
    ```\n\nSame logic can be coded with the for statement as follows:\n\n```\nint\
    \ n;\n\nfor ( n = 2; n > 0; n--)\n{\n    system.out.println(\"n=\" + n);\n}\n\
    ```\n\nThis is a “classical” form of the for statement, and its format:\n\nfor\
    \ (initialization; condition; iteration) { body }\n\nAnother form of the for statement\
    \ is dealing with collections (arrays, for example) and is called the “for-each”\
    \ loop. We will present it in a few pages.\n\nThe n in the above example is called\
    \ a loop control variable. There can be more than one loop control variables,\
    \ as in this example:\n\n```\nint x, y, z;\n// Find the sum of x, y, and z drops\
    \ to zero\nfor (x=3, y=5, z=7); x+y > 0; x--, y--, z--)\n{}; // Empty block; could\
    \ be specified without curly brackets\nSystem.out.println(\"x/y/z=\" + x + \"\
    /\" + y + \"/\" + z);\n```\n\nThe output of this code will be:\n\n```\nx/y/z=-2/0\n\
    ```\n\nNote that the initialization (x=3, y=5, z=7) and the iteration (x--, y--,\
    \ z--) statements are comma separated.\n\n# Internal Loop Control Variables\n\n\
    Another important note about the for statement must be made. When the loop variable\
    \ is defined within the for statement, it is “visible” outside of the for statement:\n\
    \n```\nfor ( int n = 2; n > 0; n-- )\n{\nSystem.out.println(\"n=\" + n);\n}\n\
    // the value of n is known\n```\n\n// the n variable is not “visible” beyond the\
    \ for statement\nSystem.out.println(\"final n=\" + n); // Error: the n is unknown\n\
    \n# The “for” statement without Loop Control Variables\n\nIt's worth mentioning\
    \ that the for statement could be coded without the initialization or the iteration\
    \ expressions, or both:\n\n```\nint n, max;\nn = 0;\nmax = 100;\nboolean reachedMax\
    \ = true;\nfor ( !reachedMax; ) // while NOT reachedMax\n{\n// double the value\
    \ of n until it exceeds the max\nn++;\nif (n > max) reachedMax = true;\n}\nSystem.out.println(\"\
    n=\" + n); // prints: n=128\n```\n\n# The “for-each” Statement\n\nConsider an\
    \ example when we need to calculate the average value for a set of numbers, stored\
    \ in an array. Here is how we can accomplish that with the “classical” for statement:\n\
    \n```\nint nArray[] = {1, 2, 3, 4, 5}; // array of five numeric values\ndouble\
    \ avg = 0;\n\n// loop through nArray elements (first element is numbered 0)\n\
    // and calculate the sum of all elements\n\nfor ( int i = 0; i < nArray.length;\
    \ i++ )\n  avg += nArray[i];\n\n// divide the sum by the number of elements\n\
    avg /= nArray.length;\nSystem.out.println(\"avg=\" + avg); // prints: avg=3.0\n\
    ```\n\nThe same result can be accomplished with the “for-each” version of the\
    \ statement, which has the following format:\n\n```\n(type iterativeVariable:\
    \ collection) { body }\n```\n\nThe above example would look like this:\n\n```\n\
    int nArray[] = {1, 2, 3, 4, 5}; // array of five numeric values\ndouble avg =\
    \ 0;\n\n// The val must be assigned the value of each array element,\n// one by\
    \ one, in sequential order.\n\nfor ( int val: nArray)\n  avg += val;\n\navg /=\
    \ nArray.length;\nSystem.out.println(\"avg=\" + avg); // prints: avg=3.0\n```\n\
    \nPlease note, that the iteration variable val must be of the same or compatible\
    \ data type as the elements of the collection (array). The compatible data types\
    \ are those that the original data type can be implicitly promoted to. In this\
    \ example, the original data type is int, which can be promoted to long, float,\
    \ or double.\n\n# The “break” Statement\n\nJava provide two statements – break\
    \ and continue, that can break the “natural” execution flow of a loop or any block\
    \ of statements. The break statement causes the termination of a loop or any named\
    \ block of code before it reaches its end. The continue statement immediately\
    \ starts the next iteration of a loop.\n\nLet’s start with the break statement.\
    \ We have already seen it in the switch construct where it was used in the case\
    \ expressions to jump out of the switch statement.\n\n# Breaking Out from Labeled\
    \ Blocks\n\nThe break statement has the following format:\n\nbreak [label];\n\n\
    The label parameter is optional and is used to jump out of any named (labeled)\
    \ block of code. That block of code does not have to be a loop or a switch statement.\
    \ Consider this example:\n\n```\nint var;\nvar = 2;\n\nblock1:\n{\n    if (var\
    \ != 1) break block1;\n    System.out.println(\"Block 1 executed\");\n}\n\nblock2:\n\
    {\n    if (var != 2) break block2;\n    System.out.println(\"Block 2 executed\"\
    );\n}\n```\n\nThe output of this code will be “Block 2 executed.” Since the variable\
    \ var is not equal to 1, break block1 will jump out of block1 to the next statement.\n\
    \nNote that this technique will also work when the named blocks are nested within\
    \ each other. The break can jump from an inner block out of any outer block:\n\
    \n```\nint var = 2;\n\nblock1:\n{\n  block2:\n{\n    block3:\n{\n      if (var\
    \ == 1) break block1;\n      if (var == 2) break block2;\n      if (var == 3)\
    \ break block3;\n      System.out.println(\"Last statement of block3\");\n   \
    \ }\n    System.out.println(\"Last statement of block2\");\n  }\n  System.out.println(\"\
    Last statement of block1\");\n}\n```\n\nThe output of this code will be \"Last\
    \ statement of block1\". The (var==2) condition will be true, and break block2\
    \ will jump out of blocks block3 and block2 to the next statement of block1.\n\
    \n# Breaking Out from Loops\n\nWhen the break statement is used without its label\
    \ parameter, it interrupts execution of loop containing that break statement.\
    \ In case of nested loops, labels can be used to identify each loop, and the label\
    \ parameter will tell which loop to terminate.\n\nExamples:\n\n```\nint i;\n//\
    \ The for loop\nfor (i=9; i>0; i--)\n{\n  System.out.println(\"i=\" + i);\n  if\
    \ (i==7) break;\n}\n// The while loop\ni = 9;\nwhile (i>0)\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n}\n// The do-while loop\ni = 9;\ndo\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n} while (i>0);\n```\n\n# The “continue” Statement\n\
    \nThe continue statement works similar to the break statement, but instead of\
    \ terminating the loop, it forces the next iteration. The format of the continue\
    \ statement is:\n\n```\ncontinue [label]\n```\n\nThe label parameter is optional\
    \ and specifies which loop to continue with.\n\nExample:\n\n```\nint i;\n// simple\
    \ for loop\nfor (i=4; i>1; i--)\n{\n  if (i==3) continue;\n  System.out.println(\"\
    i=\" + i); // will print i=4 and i=2\n}\n// nested loops\nint x,y = 0;\nloopA:\
    \ for (x=0; x<=1; x++) {\n  loopB: for (y=0; y<=1; y++) {\n    if (x == y ) continue\
    \ loopA;\n    System.out.println(x + \"/\" + y); // will print 1/0\n  }\n}\n```\n"
  mdcn: "\n\n# “for” 语句\n\n`for` 语句用于实现所谓的“控制”循环。控制循环基本上是 `while` 循环，但它通过显式指定的代码来初始化和迭代循环控制条件中使用的变量值：\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_38_0.png)\n\n让我们看看之前 `while` 语句的示例：\n\
    \n```\nint n;\nn = 2;\nwhile ( n > 0 )\n{\n    system.out.println(\"n=\" + n);\n\
    \    n--;\n}\n```\n\n相同的逻辑可以用 `for` 语句如下实现：\n\n```\nint n;\n\nfor ( n = 2; n >\
    \ 0; n--)\n{\n    system.out.println(\"n=\" + n);\n}\n```\n\n这是 `for` 语句的“经典”形式，其格式为：\n\
    \nfor (初始化; 条件; 迭代) { 体 }\n\n`for` 语句的另一种形式是处理集合（例如数组），被称为“for-each”循环。我们将在几页后介绍它。\n\
    \n上述示例中的 `n` 被称为循环控制变量。可以有多个循环控制变量，如例所示：\n\n```\nint x, y, z;\n// 寻找 x, y, z 之和直到降为零\n\
    for (x=3, y=5, z=7); x+y > 0; x--, y--, z--)\n{}; // 空块；可以不指定大括号\nSystem.out.println(\"\
    x/y/z=\" + x + \"/\" + y + \"/\" + z);\n```\n\n这段代码的输出将是：\n\n```\nx/y/z=-2/0\n\
    ```\n\n注意初始化 (x=3, y=5, z=7) 和迭代 (x--, y--, z--) 语句是用逗号分隔的。\n\n# 内部循环控制变量\n\n\
    关于 `for` 语句还有另一个重要的注意事项。当循环变量定义在 `for` 语句内部时，它在 `for` 语句之外是“可见”的：\n\n```\nfor\
    \ ( int n = 2; n > 0; n-- )\n{\nSystem.out.println(\"n=\" + n);\n}\n// n 的值是知的\n\
    ```\n\n// n 变量在 for 语句之外是“不可见的”\nSystem.out.println(\"final n=\" + n); // 错误：n\
    \ 未定义\n\n# 不带循环控制变量的“for”语句\n\n值得注意的是，`for` 语句可以不包含初始化或迭代表达式，或者两者都不包含：\n\n```\n\
    int n, max;\nn = 0;\nmax = 100;\nboolean reachedMax = true;\nfor ( !reachedMax;\
    \ ) // 当未达到Max 时\n{\n// 增加 n 的值直到其超过 max\nn++;\nif (n > max) reachedMax = true;\n\
    }\nSystem.out.println(\"n=\" + n); // 输出：n=128\n```\n\n# “for-each” 语句\n\n考虑这样一个示例：我们需要计算存储在数组中的一组数字的平均值。以下是使用“经典”\
    \ `for` 语句实现的方法：\n\n```\nint nArray[] = {1, 2, 3, 4, 5}; // 包含五个数值的数组\ndouble\
    \ avg = 0;\n\n// 遍历 nArray 元素（第一个元素索引为 0）\n// 并计算所有元素的和\n\nfor ( int i = 0; i\
    \ < nArray.length; i++ )\n  avg += nArray[i];\n\n// 将和除以元素个数\navg /= nArray.length;\n\
    System.out.println(\"avg=\" + avg); // 输出：avg=3.0\n```\n\n使用语句的“for-each”版本也可以实现相同的结果，其格式如下：\n\
    \n```\n(类型 迭代变量: 集合) { 体 }\n```\n\n上述示例如下：\n\n```\nint nArray[] = {1, 2, 3, 4,\
    \ 5}; // 包含五个数值的数组\ndouble avg = 0;\n\n// val 必须按照顺序逐个地\n// 赋值每个数组元素的值。\n\nfor\
    \ ( int val: nArray)\n  avg += val;\n\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // 输出：avg=3.0\n```\n\n请注意，迭代变量 `val` 的类型必须与集合（数组）元素的类型相同或兼容。兼容的数据类型是指原始数据类型可以隐式提升的类型。在这个示例中，原始数据类型是\
    \ `int`，它可以提升为 `long`、`float` 或 `double`。\n\n# “break” 语句\n\nJava 提供了两个语句——`break`\
    \ 和 `continue`，它们可以中断循环或任何语句块的“自然”执行流。`break` 语句会导致循环或任何具名的代码块在到达末尾之前终止。`continue`\
    \ 语句会立即开始循环的下一次迭代。\n\n让我们从 `break` 语句开始。我们已经在 `switch` 结构中见过它，它被用于 `case` 表达式中跳出\
    \ `switch` 语句。\n\n# 跳出标签块\n\n`break` 语句的格式如下：\n\nbreak [标签];\n\n标签参数是可选的，用于跳出任何具名的（标记的）代码块。该代码块不需要是循环或\
    \ `switch` 语句。考虑这个示例：\n\n```\nint var;\nvar = 2;\n\nblock1:\n{\n    if (var !=\
    \ 1) break block1;\n    System.out.println(\"Block 1\");\n}\n\nblock2:\n{\n  \
    \  if (var != 2) break block2;\n    System.out.println(\"Block 2\");\n}\n```\n\
    \n这段代码的输出将是：“Block 2”。由于 `var` 不等于1，`break block1` 将跳出 `block1` 到后续语句。\n\n注意，当具名块相互嵌套时，这种技术也有效。`break`\
    \ 可以从内部块跳出任何外部块：\n\n```\nint var = 2;\n\nblock1:\n{\n  block2:\n  {\n    block3:\n\
    \    {\n      if (var == 1) break block1;\n      if (var == 2) break block2;\n\
    \      if (var == 3) break block3;\n      System.out.println(\"Last statement\
    \ of block3\");\n    }\n    System.out.println(\"Last statement of block2\");\n\
    \  }\n  System.out.println(\"Last statement of block1\");\n}\n```\n\n这段代码的输出将是：“Last\
    \ statement of block1”。var==2` 条件真，`break block2` 将跳出 `block3` 和 `block2` 到 `block1`\
    \ 的后续语句。\n\n# 跳出循环\n\n当 `break` 语句不带标签参数使用时，它会中断包含该语句的循环。在嵌套循环的情况下，可以使用标签来标识每个循环，标签参数将指定终止哪个循环。\n\
    \n示例：\n\n```\nint i;\n// for 循环\nfor (i=9; i>0; i--)\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n}\n// while 循环\ni = 9;\nwhile (i>0)\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n}\n// do-while 循环\ni = 9;\ndo\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n} while (i>0);\n```\n\n# “continue” 语句\n\n`continue`\
    \ 语句的作用与 `break` 语句类似，但它不是终止循环，而是强制执行下次迭代。`continue` 语句的格式为：\n\n```\ncontinue\
    \ [标签]\n```\n\n标签参数是可选的，并指定要继续哪个循环。\n\n示例：\n\n```\nint i;\n// 简单的 for 循环\nfor\
    \ (i=4; i>1; i--)\n{\n  if (i==3) continue;\n  System.out.println(\"i=\" + i);\
    \ // 将输出 i=4 和 i=2\n}\n// 嵌套循环\nint x,y = 0;\nloopA: for (x=0; x<=1; x++) {\n\
    \  loopB: for (y=0; y<=1; y++) {\n    if (x == y ) continue loopA;\n    System.out.println(x\
    \ + \"/\" + y); // 将输出 1/0\n  }\n}\n```\n\n"
