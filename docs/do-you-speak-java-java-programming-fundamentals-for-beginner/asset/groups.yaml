    # Arrays


    An array is a multi-dimensional collection of data elements of the same type and
    referenced by a common name and a numeric index, e.g. - myArray[3].


    Java provides a special syntax for handling arrays.


    # Declaring Arrays


    There are two equivalent formats of the array declaration:


    +   - type arrayName [];

    - type [] arrayName;


    For example, int myArray [] declares the variable as the name of a one-dimensional
    array of integer elements. While each data element of the array is of type int,
    the myArray variable is said to be of type int[].


    Note: No physical array is actually created at the time of declaration.


    # Creating Arrays


    After the array is declared, it can be created in one of two ways. The first way
    is to use an array initializer when the array is declared:


    ```

    int myArray [] = {1, 2, 3, 4, 5}; // the array of five integers

    ```


    Another way of creating arrays is using the new statement:


    ```

    int myArray[]; // declares myArray as an array variable

    myArray = new int[5]; // creates the array {0, 0, 0, 0, 0}

    myArray[0] = 1; // assigns 1 to the first element of the array

    myArray[2] = 3; // assigns 3 to the third element of the array

    ```


    Note, that the new statement creates an array and assigns the default values to
    all of its elements. The default value depends on the array elements’ type; for
    numbers - 0, for Boolean - false, and for classes - null.'
- md: "\n# Multi-Dimensional Arrays\n\nThe easiest way to explain how the multi-dimensional\
    \ arrays are created by reviewing an example. Let's say we want to create the\
    \ following two-dimensional array:\n\n| Column 1 | Column 2 | Column 3 |\n|---|---|---|\n\
    | Row 1 | 1 | 2 |\n| Row 2 | 10 | 11 | 12 |\n\nUsing an array initializer, the\
    \ above array can be created with this statement:\n```java\nint [][] N = { {1,\
    \ 2}, {10, 11, 12} };\n```\n\nThe array will consist of five elements and the\
    \ values to the array elements will be assigned as:\n\n```\nN [][0] = 1;\nN [][1]\
    \ = 2;\nN [][2] // element does not exist\nN [1][0] = 10;\nN [1][1] = 11;\nN [1][2]\
    \ = 12;\n```\n\nWe can also create this multi-dimensional array using the new\
    \ statement:\n\n```java\nint [][] N;\nN = new int[2][3]; // the 2x3 array created\
    \ is 2 by 3 table with 6 elements.\n```\n\nHowever, the result of the above code\
    \ is 2 by 6 elements. To get rid of the N[0][2] element, we need to rewrite the\
    \ code:\n\n```java\nint [][] N;\nN = new int[2][]; // two columns with undefined\
    \ number of rows\nN [0] = new int[2]; // first row will contain 2 columns\nN [1]\
    \ = new int[3]; // second row will contain 3 columns\n```\n\nTo avoid confusion\
    \ with how arrays (or tables) are implemented in other languages, you should envision\
    \ Java arrays as hierarchical structures of objects. The N array we just reviewed\
    \ can be viewed as follows:\n\n![](img/7ffd006441be7e70bb67929dee89a427_47_0.png)\n\
    \nAs objects, N, N[0], and N[1], have the length property, which is very useful\
    \ when we want to iterate through the array:\n\n```java\n // This code prints\
    \ all elements of the two-dimensional array N\nfor (int x=0; x<N.length; x++)\n\
    {\n    for (int y = 0; y < N[x].length; y++)\n{\n        System.out.println(N[x][y]);\n\
    \    }\n}\n```\n\n# Methods\n\nA **method** is a block of code that can be referenced\
    \ and called for execution by its name. It is constructed as follows:\n\n```\n\
    accessAttributes returnType methodName(parameters) { body }\n```\n\nExample:\n\
    \n```java\npublic int myMethod(int x, int y) {\n  return x + y;\n}\n```\n\nThis\
    \ method accepts two integer numbers and returns its sum to the calling program\
    \ (i.e. to another method).\n\nThe **access attributes** are optional. They will\
    \ be discussed in detail in a separate chapter.\n\nThe **return type** can be\
    \ of any primitive type, an array, a class, or **void**, which indicates that\
    \ no data is returned by the method.\n\nThe **method name** can be any name of\
    \ your choice.\n\nThe **parameters** are optional.\n\nThe **body** is a set of\
    \ variables declarations and executable statements.\n\n# The “main” Method\n\n\
    The **main** method is a special method that starts execution of all Java applications.\
    \ Java looks for this method in all classes presented for execution, and expects\
    \ it to be defined exactly like this:\n\n```java\npublic static void main (String\
    \ args[]) { body }\n```\n\n# Classes and Objects\n\nJava is an Object-Oriented\
    \ language, meaning that its primary purpose is to manipulate objects. An Object\
    \ is a logical entity consisting of data and code. All objects are built from\
    \ templates called classes, which makes them central to the Java language. Any\
    \ functionality you wish to implement in Java, must be constructed as a class.\n\
    \nThe following diagram illustrates the relationship between classes and objects:\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_49_0.png)\n\n# Declaring Classes\n\n\
    Classes are declared using the class statement:\n\n```\nclass className {\n  type\
    \ variable1;\n  \n  type variable;\n  \n  type method1(parameters);\n  \n  type\
    \ methodN(parameters);\n}\n```\n\nExample:\n\n```java\n// Class Temperature provides\
    \ functionality to convert\n// temperatures from Celsius to Fahrenheit and vice\
    \ versa\nclass Temperature {\n  // Class variables and methods:\n  static double\
    \ t;          // temperature value\n  static double FtoC ()      // method for\
    \ converting 'F to C'\n    return (temp - 32 ) / 1.8;\n  static double Ctof ()\
    \      // method for converting 'C to F'\n    return temp * 1.8 + 32;\n\n  //\
    \ Instance variables and methods:\n  double temp;               // temperature\
    \ value\n  double toCelsius()        // method for converting 'F to C'\n    return\
    \ (temp - 32 ) / 1.8;\n  double toFahrenheit()      // method for converting 'C\
    \ to F'\n    return temp * 1.8 + 32;\n}\n\n# Class Variables and Methods\n\nThe\
    \ code in previous example declares a new class Temperature with two sets of variables\
    \ and methods. The main difference between those sets is in the usage of the static\
    \ scope modifier. All variables and methods declared as static are called class\
