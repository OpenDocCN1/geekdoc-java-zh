    The following table shows how access variables and methods of one class from its
    sub-classes and also from other classes residing in the same or different packages.


    | | Package One | | Package Two | |

    | class A | subclass of A | class B | subclass of A | class C |

    | public | visible | visible | visible | visible |

    | protected | visible | visible | visible | - |

    | no modifier | visible | visible | | - |

    | private | visible | | | - |


    # The "static" Modifier


    The static modifier indicates that the variable or method can be accessed before
    any object of the class is created. A good example is the main method that starts
    execution of an application. It must be declared static because it is called before
    any object exists.


    # The "final" Modifier


    The final modifier can be applied to variables, methods, and classes to "finalize"
    their declaration.


    A final variable cannot be modified after it is assigned an initial value. That
    effectively makes a final variable constant:


    ```

    final double pi = 3.1415926;

    ```


    A final method cannot be overridden. If a class declares some method as final,
    the sub-classes of that class cannot create a method with the same signature as
    the final method.


    A final class cannot have sub-classes, i.e. it cannot be inherited.'
- md: "\n# Generics\n\nGenerics is a feature of Java allowing the use of generic names\
    \ when specifying the class type of object parameters in the declarations of classes,\
    \ interfaces, methods, or constructors. For example, if two methods have same\
    \ functionality but one receives an integer parameter, and another receives a\
    \ double parameter, we can declare just one method and supply that method with\
    \ a 'generic' type of the parameter, which will be substituted with the proper\
    \ type during compilation.\n\nThe best way to understand all the advantages and\
    \ restrictions of generics is by going through examples, which are illustrated\
    \ below.\n\n# Generic Methods\n\nLet's say that we want to create a method that\
    \ acts on an object without knowing what its type is. One way of accomplishing\
    \ that is by using the Object class – the superclass of all objects. We could\
    \ accept an Object instance and then cast it to the desired type.\n\nFor example,\
    \ method sumArea summarizes the total area occupied by objects of type A and B\
    \ by processing one object at a time. All we know about objects A and B is that\
    \ they are unrelated (i.e. belong to separate class hierarchies) and both have\
    \ the getArea method returning their area value. The sumArea method can be implemented\
    \ as:\n\n```\nclass A { public double getArea() { return 10.0; }\nclass B { public\
    \ double getArea(Object obj) { return 20.0; }\n```\n\n```\nclass myClass {\n \
    \ double totalArea;\n  public void sumArea(Object obj) {\n    if (obj instanceof\
    \ A) { totalArea += ((A)obj).getArea(); }\n    if (obj instanceof B) { totalArea\
    \ += ((B)obj).getArea(); }\n  }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_78_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_78_1.png)\n\nNow, can we use generics\
    \ to get rid of instanceof and object casting? The short answer is – Yes and No.\
    \ At this point we come to a very important fact about the generics:\n\n# Generics\
    \ is a compiler feature, not a run-time feature. All class type references are\
    \ resolved at compile time.\n\nFor example, the sumArea method can be re-written\
    \ in generic notation as follows:\n\n```\npublic <T> void sumArea(T obj) {\n \
    \   totalArea += obj.getArea();\n}\n```\n\n> The T parameter is not a real class\
    \ name, but a generic name. It must be placed before the return type.\n\nIn the\
    \ object-casting example, when the method sumArea receives an object of class\
    \ A, the reference obj is treated as if it was created by the statement Object\
    \ obj = new A(); By explicitly casting obj to the original class A acquire access\
    \ to all its variables and methods.\n\nThe generics mechanism works somewhat differently.\
    \ At compile, the type-variable T must be resolved to a real class name. Since\
    \ we did not provide any hints to what it might be, the T will be substituted\
    \ with Object – the superclass for all classes – and that will be the only change\
    \ to the source. Without casting, object reference obj declared as “Object obj\
    \ = new A()” will only have access to the instance variables and methods of class\
    \ Object and also to the methods of Object overridden by class A. This diagram\
    \ shows which properties of object A would be accessible in cases:\n\n| \"Object-casting\"\
    \ approach | \"Generic\" approach |\n| :--- | :--- |\n| Parameter obj is treated\
    \ as being created like this: Object obj = new A() | T is substituted with Object.\
    \ Parameter obj is treated as being like this: Object obj = new A() |\n| | class\
    \ Object |\n| | variable v1 |\n| | method m1 |\n| | variable v2 |\n| | method\
    \ m2 |\n| ((A) obj). | class A |\n| | variable v2 |\n| | method m2 |\n| | variable\
    \ v3 |\n| | method m3 |\n\nAs we see, without explicit casting, the “generics”\
    \ code does not have access to the class A instances and methods of object obj.\
    \ This problem can be solved by making a few changes to the class structure and\
    \ also providing more information to the generic method.\n\nFirst, we can tell\
    \ the generic method what class (or classes) can substitute the type-variable\
    \ T:\n\n```\npublic <T extends AB> void sumArea(T obj) { ... }\n```\n\nThe <T\
    \ extends class> is called a bounded type, which sets the upper bound for classes\
    \ that can be referenced by the type-variable T.\n\nSecond, the new class (AB)\
    \ should be made a superclass of classes A and B and should define all instance\
    \ methods we can use within the generic method sumArea:\n\n```\nabstract class\
    \ AB { public double getArea(); }\nclass A extends AB { public double getArea()\
    \ {return 10.0; }\nclass B extends AB { public double getArea() {return 20.0;\
    \ }\n```\n\nNow our obj will be viewed as being declared with \"AB obj = new AB()\"\
    , and the getArea method of classes A and B will be reachable via the method overriding\
    \ mechanism. Simply put, the declaration of the generic method was transformed\
    \ from this:\n\n```\npublic <T> void sumArea(T obj) {\ntotalArea += obj.getArea();\n\
    }\n```\n\nto this:\n\n```\npublic void sumArea(AB obj) {\ntotalArea += obj.getArea();\n\
    }\n```\n\nThat if we need access to the variables of classes A and B we can do\
    \ only through methods declared in the superclass AB and overridden in A and B.\n\
    \n# Generic Classes\n\nFirst of all, it is very important to understand that a\
    \ generic class is not much different from any regular Java class. What makes\
    \ “generic” is a small addition to the class declaration syntax. Here is an example\
    \ of a generic class declaration:\n\n```\nclass G <T> { ... }\n```\n\nThe <T>\
    \ notation is a class type parameter in which T is a type-variable, i.e. parameter\
    \ representing a class name. It indicates that an (any) class name can be used\
    \ in the declarations of variables and methods of the class:\n\n```java\nclass\
    \ Class <T> {\n    public T myvalue;\n    public void setValue(T obj) {\n    \
    \    myvalue = obj;\n    }\n\n    public static void main (String[] args[]) {\n\
    \        Class<String> c = new Class<String>();\n        c.setValue(\"test\");\n\
    \        System.out.println(c.myvalue); // print: \"test\"\n\n        Class<Integer>\
    \ n = new Class<Integer>();\n        n.setValue(123);\n        System.out.println(n.myvalue);\
    \ // print: 123\n    }\n}\n```\n\nNote that we have to specify the class parameter\
    \ explicitly when creating objects of generic classes. This information is used\
    \ by Java for type checking, making sure, for example, an object reference of\
    \ type Class<String> does not point to an object of Class<Integer>.\n\nThe declaration\
    \ shown in the previous example (Class <T>) allows substitution of the type-variable\
    \ T with any class name. In most cases, it is not desirable. Usually, we want\
    \ to restrict the range of classes for which generic objects can be built. We\
    \ can achieve this by using another form of generic declaration:\n\n```\nclass\
    \ G <T extends className> { ... }\n```\n\nThe classname parameter sets the upper\
    \ boundary for class names that are allowed to be specified by the type-variable\
    \ T and enforces that only the classname class any class extending the classname\
    \ can be specified by the T parameter. This is a part of the type safety mechanism\
    \ provided by generics.\n\nThe example below shows the type safety mechanism in\
    \ action:\n\n```\nabstract class AB { public String className() { return \"A\"\
    ; }\nclass A extends AB { public String className() { return \"B\"; }\nclass B\
    \ extends AB { public String className() { return \"B\"; }\n\nclass G <T extends\
    \ AB> {\n  String name;\n\n  G (T obj) { name = obj.className(); } // G constructor\n\
    }\n```\n\n```java\npublic static void main (String[] args[]) {\n  A a = new A();\n\
    \  G g;\n  g = new G( a );\n  g = new G<AB>( a );\n\n  G<B> b;\n  b = new G<B>(\
    \ new B() );\n\n  g = b; // OK. The g and b are both of type\n}\n```\n\n> Error!\
    \ You have to explicitly specify the object type you are passing to the constructor\
    \ of class G\n\n> Compiler will check if the reference a is of type AB or its\
    \ subclasses\n\n> Ensures that b can reference only G objects created with the\
    \ input parameter of type B\n\n> Compiler will check that the input parameter\
    \ new B() is of type B (and it is), and that b can reference a G object created\
    \ with the input parameter of this type.\n\n> \"Unsafe conversion\" error: b can\
    \ only reference G objects created with input parameter of type B, but g could\
    \ point to the G object created with input parameter of type AB, A, or B\n"
  mdcn: "\n\n# 泛型 (Generics)\n\n泛型是 Java 的一项特性，允许在类、接口、方法或构造函数的声明指定对象参数类类型时使用泛型名称。例如，如果两个方法的功能相同，但一个接收整数参数，另一个接收双精度数字参数，我们可以只声明一个方法，并为该方法提供一个“泛型”参数类型，该类型将在编译期间被替换为相应的类型。\n\
    \n理解泛型所有优势和限制的最佳方法是通过示例，下面给出了说明。\n\n# 泛型方法 (Generic Methods)\n\n假设我们想要创建一个在不知道对象类型的情况下对对象进行操作的方法。实现这一点的方法之一是通过\
    \ `Object` 类——它是所有对象的父类。我们可以接受一个 `Object` 实例，然后将其转换为所需的类型。\n\n例如，`sumArea` 方法通过每次处理一个对象来总结\
    \ A 和 B 类型对象所占据的总面积。我们对 A 和 B 对象所了解的是它们互不相关（即属于不同的类层次结构），并且都具有返回面积值的 `getArea`\
    \ 方法。`sumArea` 方法可以实现为：\n\n```\nclass A { public double getArea() { return 10.0;\
    \ }\nclass B { public double getArea(Object obj) { return 20.0; }\n```\n\n```\n\
    class myClass {\n  double totalArea;\n  public void sumArea(Object obj) {\n  \
    \  if (obj instanceof A) { totalArea += ((A)obj).getArea(); }\n    if (obj instanceof\
    \ B) { totalArea += ((B)obj).getArea(); }\n  }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_78_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_78_1.png)\n\n现在，我们是否可以使用泛型来消除 `instanceof`\
    \ 和对象强制转换？简短的回答是——可以也可以不可以。在这里我们提到了关于泛型的一个非常重要的事实：\n\n# 泛型是一个编译时特性，而不是运行时特性。所有的类类型引用都在编译时解析。\n\
    \n例如，`sumArea` 方法可以用泛型符号重写如下：\n\n```\npublic <T> void sumArea(T obj) {\n    totalArea\
    \ += obj.getArea();\n}\n```\n\n> `T` 参数不是一个真实的类名，而是一个泛型名称。它必须放在返回类型之前。\n\n在对象强制转换示例中，当\
    \ `sumArea` 方法接收到类 A 的对象时，引用 `obj` 被处理得就像是由语句 `Object obj = new A();` 创建的一样。通过显式将\
    \ `obj` 转换为原始类 A，可以访问其所有的变量和方法。\n\n泛型机制的工作方式有些不同。在编译时，类型变量 `T` 必须解析为真实的类名。由于我们没有提供任何关于它可能是什么的提示，`T`\
    \ 将替换为 `Object`——所有类的父类——这将是源代码唯一的更改。如果没有强制转换，声明为“Object obj = new A()”的对象引用 `obj`\
    \ 将只能访问类 `Object` 的实例变量和方法，以及被类 A 重写的 `Object` 方法。此图显示了在这些情况下对象 A 的哪些属性是可以访问的：\n\
    \n| “对象强制转换”方法 | “泛型”方法 |\n| :--- | :--- |\n| 参数 `obj` 被视为像这样创建的：`Object obj =\
    \ new A()` | `T` 被替换为 `Object`。参数 `obj` 被视为像这样：`Object obj = new A()` |\n| | class\
    \ Object |\n| | variable v1 |\n| | method m1 |\n| | variable v2 |\n| | method\
    \ m2 |\n| ((A) obj). | class A |\n| | variable v2 |\n| | method m2 |\n| | variable\
    \ v3 |\n| | method m3 |\n\n正如我们所看到的，如果没有显式的强制转换，“泛型”代码无法访问对象 `obj` 的类 A 实例和方法。这个问题可以通过对类结构进行一些更改并向泛型方法提供更多信息来解决。\n\
    \n首先，我们可以告诉泛型方法哪些类（或哪些类）可以替换类型变量 `T`：\n\n```\npublic <T extends AB> void sumArea(T\
    \ obj) { ... }\n```\n\n`<T extends class>` 被称为边界类型，它为类型变量 `T` 可以引用的类设置了上限。\n\n\
    其次，新类 (`AB`) 应该是类 A 和 B 的父类，并且应该定义我们在泛型方法 `sumArea` 中可以使用的所有实例方法：\n\n```\nabstract\
    \ class AB { public double getArea(); }\nclass A extends AB { public double getArea()\
    \ {return 10.0; }\nclass B extends AB { public double getArea() {return 20.0;\
    \ }\n```\n\n现在，我们的 `obj` 将被视为声明为 \"AB obj = new AB()\"，类 A 和类 B 的 `getArea` 方法将通过方法重写机制访问。简单来说，泛型方法的声明从这个：\n\
    \n```\npublic <T> void sumArea(T obj) {\ntotalArea += obj.getArea();\n}\n```\n\
    \n变为这个：\n\n```\npublic void sumArea(AB obj) {\ntotalArea += obj.getArea();\n}\n\
    ```\n\n这意味着如果我们需要访问类 A 和类 B 的变量，只能通过在父类 AB 中声明并在 A 和 B 中重写的方法来实现。\n\n# 泛型类 (Generic\
    \ Classes)\n\n首先，非常重要的是理解，泛型类与任何普通的 Java 类没有太大区别。被称为“泛型”的是对类声明语法的一处小补充。\n\n这是一个泛型类声明的示例：\n\
    \n```\nclass G <T> { ... }\n```\n\n`<T>` 符号是一个类类型参数，其中 `T` 是一个类型变量，即代表类名的参数。它表示在类的变量和方法声明中使用可以使用（任何）类名：\n\
    \n```java\nclass Class <T> {\n    public T myvalue;\n    public void setValue(T\
    \ obj) {\n        myvalue = obj;\n    }\n\n    public static void main (String[]\
    \ args[]) {\n        Class<String> c = new Class<String>();\n        c.setValue(\"\
    test\");\n        System.out.println(c.myvalue); // 输出: \"test\"\n\n        Class<Integer>\
    \ n = new Class<Integer>();\n        n.setValue(123);\n        System.out.println(n.myvalue);\
    \ // 输出: 123\n    }\n}\n```\n\n注意，在创建泛类对象时，我们必须指定类参数。此信息被 Java 用于类型检查，以确保例如 `Class<String>`\
    \ 引用不会指向 `Class<Integer>` 对象。\n\n上一个示例中的声明 (`Class <T>`) 允许用任何类名替换类型变量 `T`。在大多数情况下，这是不理想的。通常，我们希望限制可以构建泛型类的范围。我们可以通过使用另一种泛型声明来实现这一点：\n\
    \n```\nclass G <T extends className> { ... }\n```\n\n`className` 参数为允许由类型变量 `T`\
    \ 指定的类设置了上限，并强制只有扩展 `className` 的类才能被 `T` 参数指定。这是泛型提供的类型安全机制的一部分。\n\n下面的示例展示了类型安全机制的作用：\n\
    \n```\nabstract class AB { public String className() { return \"A\"; }\nclass\
    \ A extends AB { public String className() { return \"B\"; }\nclass B extends\
    \ AB { public String className() { return \"B\"; }\n\nclass G <T extends AB> {\n\
    \  String name;\n\n  G (T obj) { name = obj.className(); } // G 构造函数\n}\n```\n\
    \n```java\npublic static void main (String[] args[]) {\n  A a = new A();\n  G\
    \ g;\n  g = new G( a );\n  g = new G<AB>( a );\n\n  G<B> b;\n  b = new G<B>( new\
    \ B() );\n\n  g = b; // OK。g 和 b 的类型相同\n}\n```\n\n> 错误！你必须显式指定传递给类 G 构造函数的对象类型\n\
    \n> 编译器将检查引用 a 是否定义为类型 AB 或其子类\n\n> 确保 `b` 只能引用通过输入参数类型 B 创建的泛型对象\n\n> 编译器将检查输入参数\
    \ `new B()` 是否为类型 B（确实是），并且 `b` 是否可以引用以此类型创建的泛型对象\n\n> “不安全的转换”错误：`b` 只能引用通过输入参数类型\
    \ B 创建的泛型对象，但 `g` 可能指向通过输入参数类型 AB、A 或 B 创建的泛型对象\n\n"
