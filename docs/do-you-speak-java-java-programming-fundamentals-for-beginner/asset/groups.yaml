    \n# 类的声明\n\n使用 `class` 语句声明类：\n\n```\nclass className {\n  type variable1;\n \
    \ \n  type variable;\n  \n  type method1(parameters);\n  \n  type methodN(parameters);\n\
    }\n```\n\n示例：\n\n```java\n// 温度 类提供了将温度\n// 从摄氏度转换为华氏度以及反之的功能\nclass Temperature\
    \ {\n  // 类变量和方法：\n  static double t;          // 温度值\n  static double FtoC ()\
    \      // 转换“F 到 C”的方法\n    return (temp - 32 ) / 1.8;\n  static double Ctof ()\
    \      // 转换“C 到 F”的方法\n    return temp * 1.8 + 32;\n\n  // 实例变量和方法：\n  double\
    \ temp;               // 温度值\n  double toCelsius()        // 转换“F 到 C”的方法\n  \
    \  return (temp - 32 ) / 1.8;\n  double toFahrenheit()      // 转换“C 到 F”的方法\n\
    \    return temp * 1.8 + 32;\n}\n```\n\n# 类变量和方法\n\n上一个示例代码声明了一个带有两组变量和方法的新类 Temperature。这两组之间的主要区别在于\
    \ `static` 作用域修饰符的使用。所有声明为 `static` 的变量和方法都称为类变量和类方法，可以在不创建对象的情况下使用。其他变量和方法称为实例变量和实例方法，只能通过对象实例使用。\n\
    \n下面的代码说明了上面声明的 Temperature 类类变量 `t` 以及类方法 `FtoC()` 和 `CtoF()` 的用法：\n\n```java\n\
    double temp;\n```\n\n```java\n// 类变量和方法可以通过类名引用\nTemperature.t = 77.0;\ntemp =\
    \ Temperature.FtoC();\nSystem.out.println(Temperature.t + \" == \" + temp + \"\
    C\");\n```\n\n```java\n// 类变量和方法可以直接通过它们的\n// 名称引用（如果名称在程序中是唯一的）\ntemp = 25.0;\n\
    System.out.println(t + \"C=\" + temp + \"F\");\n```\n\n此代码将打印：\n77.0F=25.0C\n\
    25.0C=77.0F\n\n# 初始化类变量\n\n在程序执行期间，当类第一次被使用时（即它被加载到 Java 虚拟机 (JVM) 时），它的类变量将被分配默认值。对于数值变量，默认值是零。如果需要将类变量初始化为非默认值，可以在声明语句中，或在声明为\
    \ `static` 的语句块中完成。\n\n下面的示例声明了带有两个变量 `tf` 和 `tc` 的 Temperature 类。`tf` 在声明期间获得初始值，而\
    \ `tc` 在 `static` 语句块中初始化。注意，`tc` 的声明必须在 `static` 语句块之外，否则它的作用范围将仅限于该块内部。\n\n\
    示例：\n\n```java\n// 当 Temperature 类加载到 JVM 时\n// 类变量 tf 将赋值为 77.0\n// 并且将运行 tc-FtoC();\
    \ 代码来计算 tc 值\n```\n\n```java\nclass Temperature {\n    static double tf = 77.0;\
    \ // 类变量 tf = 77.0\n    static double tc; // 类变量 tc = 0.0\n    static { tc = FtoC();\
    \ } // 语句块将转换\n    // tf 转换为 \"C\" 并放入 tc 中\n    // 方法 FtoC 将 \"F\" 转换为 \"C\"\n\
    \    static double FtoC () {return (tf - 32 ) / 1.8;}\n}\n```\n\n关于类变量和方法的所有内容可以总结为三个规则：\n\
    \n声明规则：\n> 类变量、方法必须使用 `static` 修饰符\n\n访问规则：\n> 如果名称是唯一的，可以直接通过名称引用类变量和方法；或者通过类名引用\n\
    \n执行规则：\n> 类的静态声明和语句块仅在类第一次被使用时处理（执行）\n\n# 实例变量和方法\n\n类中没有 `static` 修饰符的变量、方法和语句块被称为实例变量、实例方法和实例语句块。它们的用法遵循以下规则：\n\
    \n声明规则：\n> 实例变量、方法和语句块不能使用 `static` 修饰符\n\n访问规则：\n> 实例变量和方法只能在创建对象（实例）后使用，并且必须通过对象名引用\n\
