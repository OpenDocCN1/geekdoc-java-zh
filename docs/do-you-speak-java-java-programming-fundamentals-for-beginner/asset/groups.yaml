    \ The for loop\nfor (i=9; i>0; i--)\n{\n  System.out.println(\"i=\" + i);\n  if\
    \ (i==7) break;\n}\n// The while loop\ni = 9;\nwhile (i>0)\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n  --;\n}\n// The do...while loop\ni = 9;\ndo\n\
    {\n  System.out.println(\"i=\" + i);\n  if (i==7) break;\n  --;\n} while (i>0);\n\
    ```\n\nAll three loops iterate the variable i from 9 down to 0, but all will stop\
    \ when i reaches 7, producing same output:\n\n```\ni=9\ni=8\ni=7\n```\n\nHere\
    \ is an example of breaking out from nested loops:\n\n```\nint x, y = 0;\nloopA:\
    \ for (x=9; x>0; x--) {\n  loopB: for (y=7; y>0; y--) {\n    if (x==7 && y==7)\
    \ break loopA;\n  }\n}\nSystem.out.println(\"x/y=\" + x + \"/\" + y); // prints:\
    \ x/y=7/7\n```"
  - "[PAGE 44]\n\n# The “continue” Statement\n\nThe continue statement can be used\
    \ only within the body of a loop to stop the current iteration and start the next\
    \ iteration. In case of labeled nested loops, the continue statement can specify\
    \ which loop to resume.\n\nThe format of the continue statement is:\n\n```\ncontinue\
    \ [label]\n```\n\nThe label parameter specifies the name (label) assigned to a\
    \ loop and is optional.\n\nThe continue statement works similar to the break statement,\
    \ but instead of terminating the loop, it forces the next iteration of the specified\
    \ loop.\n\nExample:\n\n```\n// simple for loop\nint i;\nfor (i=4; i>1; i--) {\n\
    \  if (i==3) continue;      // go to next iteration when i = 3\n  System.out.println(\"\
    i=\" + i); // will print i=4 and i=2\n}\n// nested loops\nint x,y = 0;\nloopA:\
    \ for (x=0; x<=1; x++) {\n  loopB: for (y=0; y<=1; y++) {\n    if (x == y ) continue\
    \ loopA;\n    System.out.println(x + \"/\" + y); // will print only 1/0\n  }\n\
    }\n```"
