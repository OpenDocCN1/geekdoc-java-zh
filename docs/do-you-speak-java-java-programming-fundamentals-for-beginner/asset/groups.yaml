    \ failed!\n\n除了 Java 提供的预定义检查异常（checked exceptions）和未检查异常（unchecked exceptions）外，你还可以构建自己的异常，类似于**检查异常**。为了理解如何实现，我们首先回顾异常类。\n\
    \n## 异常类层级结构\n\n对于每个异常，Java 都会创建一个包含有关该异常有用信息的对象。每种类型的异常都由其自己的类表示 - FileNotFoundException、IndexOfBoundsException\
    \ 等。所有这些类都是顶层类 **Throwable** 的子类。下图显示了异常类的层级结构：\n\n![](img/7ffd006441be7e70bb67929dee89a427_112_0.png)\n\
    \n**Error** 和 **RuntimeExceptions** 是**未检查**异常，不需要被捕获和处理。其余的是**检查**异常，如果它们在执行期间可能抛出，则必须由应用程序逻辑进行处理。\n\
    \nThrowable 类提供了几个实用的方法，可以用于程序的异常处理逻辑中。以下是其中一些：\n\n| String getMessage() | 返回此异常的详细消息字符串\
    \ |\n| :--- | :--- |\n| void printStackTrace() | 将上述消息和轨迹追踪信息发送到标准错误流 |\n| String\
    \ toString() | 返回此异常的简短描述 |\n\n现在，我们已经知道了异常类是如何组织的，让我们来看看如何创建一个自定义异常。\n\n## 创建自定义异常\n\
    \n自定义的、定义的异常可以如下构建为 Exception 类的子类：\n\n```java\nclass CustomException extends\
    \ Exception {\n    public CustomException(String msg) {\n        super(msg);\n\
    \    }\n    void runMyTest() {\n}\n\npublic static void main(String args[]) {\n\
    \    try {\n        testMyException();\n    } catch (CustomException e) {\n  \
    \      System.out.println( e.getMessage() );\n    }\n}\n\n// 方法抛出 CustomException\n\
    public static void testMyException( ) throws CustomException {\n    CustomException\
    \ e;\n    e = new CustomException(\"My exception\");\n    throw e;\n}\n}\n```\n\
    \n## 线程\n\n当程序的两个或多个部分并发运行时，这种程序被称为多线程程序。每条执行路径被称为一个线程。每个 Java 程序至少有一个线程，它从主线程开始。\n\
    \n## 启动线程\n\n应用程序可以根据需要创建任意数量的线程。要创建一个线程，类需要扩展 Thread 类，或者实现 Runnable 接口。在这两种情况下，创建线程的类都必须实现\
    \ `run()` 方法。下图说明了创建线程的两种方式。注意，在两种情况下，必须存在 Thread 类型的对象，并且能够访问你类中的 `run()` 方法：\n\
    \n| Thread 类型的对象 | Thread 类型的对象 |\n| :--- | :--- |\n| class Thread | class Thread\
    \ |\n| start {...} | start {...} |\n| class A extends Thread run() {...} | class\
    \ B implements Runnable run() {...} |\n\n如图所示，线程是通过 Thread 类的 `start()` 方法启动的，该方法调用了启动线程的类中定义的\
    \ `run()` 方法。\n\n在这个示例中，新线程通过扩展 Thread 类的 myClass 类对象启动：\n\n```java\nclass myClass\
    \ extends Thread {\n  public void run() {}\n  public static void main(String args[])\
    \ {\n    myClass th1 = new myClass();\n    th1.start();\n  }\n}\n```\n\n当你的类扩展\
    \ Thread 类时，你必须实现的方法是 `run()` 方法。该方法应该定义由新线程将执行的操作。注意，由 Thread 类定义的 `run()` 方法是空的，什么都不做。\n\
    \n你也可以实现（即重写）Thread 类的其他方法，但 `start()` 方法除外。如果你实现了 `start()` 方法，即使它调用了 `run()`\
    \ 方法，也不会启动任何线程，`run()` 将作为你类的一个普通方法在当前线程中执行。\n\n这种创建线程的方法是完全接受的，但如果你不打算重写 `run()`\
    \ 方法之外的 Thread 类的其他方法，那么更好的方法是实现 Runnable 接口。\n\n在这个示例中，新线程通过实现 Runnable 接口的 myClass\
    \ 类对象创建：\n\n```java\nclass myClass implements Runnable {\n    public void run()\
    \ {\n}public static void main (String args[]) {\n    Thread th2 = new Thread(new\
    \ myClass() );\n    th2.start();\n}\n}\n```\n\nRunnable 接口只声明了一个方法 – `run()`，所以你的类只需要实现该方法。要启动新线程，程序必须使用以下构造函数创建\
    \ Thread 对象：\n\nThread (Runnable target)\n\n在这里，target 是你的类的实例。\n\n需要重申的是，线程只能通过通过\
    \ Thread 对象的 `start()` 方法启动。在第一个示例中，当实例化 Thread 的子类时，通过调用 `super()` 构造函数自动创建了一个\
    \ Thread 对象。在第二个示例中，我们显式地创建了一个 Thread 对象，并同时传递了 myClass 对象给它。\n\n这是一个启动线程的示例程序：\n\
    \n```java\nimport java.io.IOException;\nclass testThread implements Runnable {\n\
    \    public static void main(String args[]) {\n        Thread th = new Thread(testThread());\n\
    \        th.setName(\"Thread 1\");\n        th.start();\n\ntry {\n           \
    \ System.out.println(\"main: hit enter...\");\n            System.in.read();\n\
    \        } catch (Exception e) {\n            System.out.println(\"main exception:\
    \ \" + e);\n        }\n        System.out.println(\"main ended\");\n    }\n\n\
    \    public void run() {\n        String name = Thread.currentThread().getName();\n\
    \        try {\n            System.out.println(\"thread: hit enter...\");\n  \
    \          System.in.read();\n        } catch (Exception e) {\n            System.out.println(\"\
    thread exception: \" + e);\n        }\n        System.out.println(name + \" thread\
    \ ended\");\n    }\n}\n```\n\n上面的程序会提示你按两次回车。第一个请求来自线程，第二个——来自主方法。你应该按两次回车，首先停止主方法的执行，然后是线程的执行。\n\
    \n## 守护线程\n\n当你执行之前的程序时，你会注意到主线程在你按下回车后结束了，但线程将继续运行直到你再次按下。在父线程死亡后继续执行的线程被称为用户线程。另一种类型的线程被称为守护线程。守护线程一旦父线程死亡就会死亡。默认情况下，新创建的线程是守护线程；要通过调用\
    \ `setDaemon(true)` 将其标记为守护线程。确保在启动线程之前完成此操作：\n\n```java\nThread th = new Thread(new\
    \ myClass() );\nth.setDaemon(true);\nth.start();\n```\n\n## 中断线程执行\n\n线程可以通过另一个线程通过实例方法\
    \ `interrupt()` 来中断：\n\n```java\nThread th = new Thread(new myClass() );\nth.start();\n\
    ```\n\n中断方法在线程对象中设置一个标志，该标志必须在 `run()` 方法中被检查才能产生效果。\n\n```java\npublic void run()\
    \ {\n    if (Thread.interrupted()) {\n        System.out.println(\"I was interrupted\"\
    );\n    }\n}\n```\n\n这两种方法都不会停止线程执行。它们仅仅允许向线程发送一个“信号”，但如何处理这个“信号”取决于被中断的线程。\n\n"
