    \n## 数据类型、变量和字面量\n\n面向对象设计的讨论让我们了解了 Java 语言与其他“传统”语言的区别。现在让我们来看看使 Java 与非面向对象语言相似的特征。\n\
    \n大多数语言（包括 Java）都具有以下共同点：\n\n- 操作原始数据类型的能力\n- 变量和字面量\n- 一定的运算符集\n- 控制程序执行流的语言结构和语句\n\
    \n在本章中，我们将回顾原始数据类型、变量和字面量。其余内容将在后续章节介绍。\n\n## 原始数据类型\n\n原始数据类型（也可以称为简单类型或原子类型）不是由其他数据类型组合而成的数据类型。例如，字符串（string）不是原始数据类型，因为它被定义为字符数据类型元素的集合。\n\
    \nJava 定义了八种原始数据类型：\n\n| 数据类型 | 说明 | 长度（位） | 范围（近似值） |\n|---|---|---|---|\n| byte\
    \ | 有符号整数 | 8 | -128 到 +127 |\n| short | 有符号整数 | 16 | -32,768 到 +32,767 |\n| int\
    \ | 有符号整数 | 32 | -2.1*10^9 到 +2.1*10^9 |\n| long | 有符号整数 | 64 | -9.2*10^18 到 +9.2*10^18\
    \ |\n| float | 浮点数 | 32 | ± (1.4e-45 到 3.4e+38) |\n| double | 浮点数 | 64 | ± (4.9e-32\
    \ 到 1.8e+308) |\n| char | Unicode 字符 | 16 | 0 到 65,536 |\n| boolean | | N/A |\
    \ true 或 false |\n\n注意：Java 没有暴露 boolean 数据类型的长度，因为它的实现是特定平台的。\n\n## 变量\n\n在 Java\
    \ 中，原始类型的数据元素可以声明为字面量也可以声明为变量。\n\n变量是对内存中位置的命名引用，该位置存储着指定类型的数据元素。声明变量的格式如下：\n\n\
    ```java\ntype identifier; // 声明变量标识符\n// 类型为 type\n```\n\n```java\ntype identifier\
    \ = value; // 为类型为 type 的\n// 标识符声明并赋值\n```\n\n以下是声明原始数据类型的示例。\n\n```java\nint\
    \ k; // \"k\" 是内存中 32 位区域的引用\n// 将存储一个整数值\n```\n\n```java\nk = 100; // 上述内存填充了一个\
    \ 32 位\n// 有符号二进制数 (100)\n```\n\n```java\nchar c = 'A'; // \"c\" 是双字节 Unicode\n\
    // 字符 'A' 的引用\n```\n\n注意，变量不仅可以引用原始数据类型，还可以引用对象。\n\n## 访问变量\n\n在高级层级，你可以将每个 Java\
    \ 程序视为代码块。每个块都用大括号包围：{ 语句 }。块可以是独立的，也可以相互嵌套：\n\n```java\n{ block 1 }\n{ block\
    \ 2 { block 3 } }\n```\n\n这种结构决定了变量的可访问性，也称为作用域（scope）。在块中声明的变量在该块内部以及所有包含它的块内都是可的。一旦程序流到达块的末尾，该块内声明的所有变量都会被销毁。\n\
    \n## 字面量\n\n字面量指定数据元素的实际值。例如，123 会被 Java 视为 32 位有符号整数（即类型 int），而 123.4 被视为 64\
    \ 位浮点数（类型 double）。事实上，任何整数值（即没有小数点的值）都会被视为整数，而任何分数值（即带有小数点的值）都会被视为双精度浮点数。\n\n\
    Java 中有四种字面量：数值、字符、布尔和字符串。下面将分别讨论每种。\n\n## 数值字面量\n\n数值字面量可以用十进制、十六进制、八进制或二进制表示法。以下是数字\
    \ 10 的不同表示法：\n\n- 10 - 十进制表示法（十进制数字 0-9）\n- 0x0A - 十六进制表示法（0x 在十六进制数字 0-F 前）\n\
    - 012 - 八进制表示法\n- 0b1010 - 二进制表示法（0b 在二进制数字 0-1 前）\n\n数值字面量可以包含下划线，下划线会被忽略但会让数值更易读。以下是有效的数值示例：\n\
    \n```\n123_456_789\n123_.456_789\n123456789\n```\n\n字面量的类型可以是隐式定义的（默认类型分配）或显式定义的。下表显示了如何确定类型的示例。\n\
    \n| 字面量 | 数据类型 |\n|---|---|\n| 不可用 | byte |\n| 不可用 | short |\n| 123 | int |\n\
    | 123L or 123l | long |\n| 123.0 | double |\n| 123.0D or 123.0d | double |\n|\
    \ 1.23E+2 | double |\n| 123.0F or 123.0f | float |\n\n## 字符字面量\n\n字符字面量用单引号内的值表示。键盘上存在的数字、字母和特殊字符可以直接指定，如下：'a'、'1'、'%'\
    \ 等其他符号应使用转义序列输入。转义序列是反斜杠 '\\' 后跟一个或多个符号。许多预定义的转义序列表示换行、制表符、退格键等。此外，任何 Unicode\
    \ 字符都可以使用八进制或十六进制表示法的转义序列直接输入。以下是小写字母 'b' 字面量的不同格式：\n\n- 'b', '\\u142', '\\u0062'\n\
    \n下表显示了转义序列。\n\n| 转义序列 | 说明 |\n|---|---|\n| \\nnn | 八进制字符 (nnn – 八进制数字 0-7) |\n\
    | \\nnnn | Unicode 字符 (nnnn – 十六进制数字 0-F) |\n| \\b | 退格 |\n| \\n | 换行 |\n| \\\
    r | 回车 |\n| \\t | 制表符 |\n| \\f | 分页符 |\n\n"
