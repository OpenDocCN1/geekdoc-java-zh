    | Literal | Data Type |

    |---|---|

    | Not available | byte |

    | Not available | short |

    | 123 | int |

    | 123L or 123l | long |

    | 123.0 | double |

    | 123.0D or 123.0d | double |

    | 1.23E+2 | double |

    | 123.0F or 123.0f | float |


    # Character Literals


    A character literal is represented with a value within a pair of single quotes.
    The digits, letters, and special characters that are present on the keyboard,
    can be specified directly, as follows: ''a'', ''1'', ''%'', etc. Other symbols
    should be entered using escape sequences. The escape sequence is the backslash
    ''\'' followed by one or more symbols. There are several predefined escape sequences
    that represent new line, tab, backspace, etc. Besides that, any Unicode character
    can be entered directly using escape sequences in octal or hexadecimal notations.
    Octal character notation has ''\nnn'' – Hexadecimal character notation has format
    ''\nnnn'' – backslash, followed by ''u'', followed by four hexadecimal digits.
    Here is the lower-case letter ''b'' literal in different formats:


    +   - ''b'', ''\u142'', ''\u0062''


    The table below shows escape sequences.


    | Escape Sequence | Description |

    |---|---|

    | \nnn | Octal character (nnn – octal digits 0-7) |

    | \nnnn | Unicode character (nnnn – hexadecimal digits 0-F) |

    | \b | Backspace |

    | \n | New line |

    | \r | Carriage return |

    | \t | Tab |

    | \f | Form feed |'
