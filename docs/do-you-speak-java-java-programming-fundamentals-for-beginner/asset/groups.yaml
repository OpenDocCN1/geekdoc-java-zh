- md: "\nThe class variable **totalCount** will be initialized to zero when the class\
    \ is first referenced in the **main** program. The instance statement block will\
    \ run when object **obj1** and **obj2** are created, incrementing the **totalCount**\
    \ by 1 and assigning its new value to the instance variable **myNumber**. Note\
    \ that objects **obj1** and **obj2** will have their own copies of the **myNumber**\
    \ variable.\n\nThe previous example contains one thing that was not covered yet\
    \ - the **new** statement, which creates objects. Let's take a closer look at\
    \ it and the whole process of creating new objects.\n\n## Working with Objects\n\
    \nObjects are the core of Java language, making it is very important to have a\
    \ good understanding of how to create objects and how to use their contents.\n\
    \n## Creating Objects\n\nThe process of creating a new object is called instantiation,\
    \ and is performed using the new statement. The format of the new statement is\
    \ this\n\n```\nclassName objectReferenceVariable = new className(parameters);\n\
    ```\n\nExample:\n\n```\nmyClass object1 = new myClass();\n```\n\nThis is what\
    \ happens during execution of the above statement:\n\n- 1) \"myClass object1\"\
    \ declares the variable object1 of type myClass. This variable can be used to\
    \ reference any object of class myClass, that's why such variables are also called\
    \ object references.\n- 2) The new operator creates a new object; all instance\
    \ declarations of variables, statement blocks, and methods are processed.\n- 3)\
    \ The myClass() method is invoked to optionally initialize the instance variables\
    \ of the newly created object.\n- 4) The reference between the variable object1\
    \ and the new object is established.\n\n## Constructors\n\nThe myClass() method\
    \ mentioned above is called a constructor, which is a method with the same name\
    \ as the class name and without the return type specified. It is invoked by the\
    \ JVM when an object of the class is being created. The purpose of a constructor\
    \ is to initialize the instant variables of the class. If you do not declare any\
    \ constructors, the JVM will create an empty one: className() {}, which will do\
    \ nothing. However, once at least one constructor is declared by the programmer,\
    \ the default constructor is gone and cannot be used. Please remember that a constructor\
    \ is invoked right after the instances declaration and statement blocks are processed.\
    \ Below is an example of a class that keeps track of its objects:\n\n```\nclass\
    \ testclass {\n    static int count; // Total objects counter; defaults to zero\n\
    \    int myNumber; // Object's sequential number\n\n    // Instance block executes\
    \ every time an object is created\n    {myNumber = ++count;} // instance block\
    \ increments the count\n // and assigns it to object's myNumber\n\n    testClass()\
    \ {} // constructor without parameters\n    testClass(int n) {\n        myNumber\
    \ = n; // Second constructor; assigns specified\n // sequence number to new object\n\
    \    }\n\n    // -----Execution-\n    public static void main(String args[]) {\n\
    \        testClass obj1 = new testClass();\n        testClass obj2 = new testClass();\n\
    \        testClass obj3 = new testClass(10);\n        System.out.println(obj1.myNumber);\
    \ // prints 1\n        System.out.println(obj2.myNumber); // prints 2\n      \
    \  System.out.println(obj3.myNumber); // prints 10\n    }\n}\n```\n\nNote, that\
    \ we defined two different constructors with the same name. This is called “method\
    \ overloading”.\n\n## Method Overloading\n\n**Method overloading** is a mechanism\
    \ used by Java to distinguish methods having the same names but different parameter\
    \ lists. Each method in Java is distinguished by its **signature** – the name\
    \ of the method along with the list of parameter types. The signature of the testClass()\
    \ method could be expressed as “**testClass**”, and the signature of the testClass(int\
    \ n) would be “**testClass,int**”.\n\n## The \"this\" Keyword\n\nIn previous examples,\
    \ instance variables were referenced in constructors directly by their names.\
    \ But what will happen when a variable with the same name as the instance variable\
    \ is declared in the **main** method? This situation is perfectly legal because\
    \ all variables declared within the **main** method are not “**visible** outside\
    \ of that method.\n\nAnother confusion would be when the name of an instance variable\
    \ is also used in the constructor’s parameter list. This problem can be solved\
    \ with the use of the keyword **this**, which represents the current object. See\
    \ this example:\n\n```\nclass testclass {\n  int x;\n  testclass(int x) {\n  \
    \  x = x;\n    this.x = x;\n  }\n  public static void main(String args[]) {\n\
    \    int x;\n    testclass obj = new testclass(100);\n    x = obj.x;\n  }\n}\n\
    ```\n\nThe **this** keyword can be used not only to refer instance variables,\
    \ but also to invoke one constructor from another, or to pass the current object\
    \ as an argument between methods.\n\nImportant note: the **this** keyword can\
    \ be used only in constructors.\n\nAnother example of using the this keyword:\n\
    \n```\nclass Position {\n    int x, y, z;\n    Position (int x, int y, int z)\
    \ {\n        this.x = x;\n        this.y = y;\n        this.z = z;\n    }\n  \
    \  Position (int x) {\n        this(x, 0, 0);\n        showPosition(this);\n \
    \   }\n    void showPosition(Position p) {\n        System.out.println(\"My position:\
    \ \"+p.x+\",\"+p.y+\",\"+p.z);\n    }\n\n    public static void main(String args[])\
    \ {\n        Position obj = new Position(5);\n    }\n}\n```\n\n> Calls another\
    \ constructor (must be the first statement)\n\n- Passes current object to the\
    \ showPosition method\n\nThe above code prints: My position: 5,0,0\n\n## The \"\
    super\" Keyword\n\nOne of the Object-Oriented Design principles is inheritance.\
    \ Inheritance represents the parent-child relationship between classes, when a\
    \ child class (subclass) inherits all the features of the parent class (superclass).\
    \ Java uses the \"extends\" keyword in class declaration to establish inheritance:\n\
    \n```\nclass superClass { body }\nclass subclass extends superClass { body }\n\
    ```\n\nExample of creating an object of a subclass:\n\n```\nclass superClass {\n\
    \  int x;\n  superClass(int x) {\n    this.x = x;\n  }\n  // Execution logic\n\
    \  public static void main(String[] args) {\n    subClass o = new subclass(1);\n\
    \    System.out.println(o.x); // prints: 2\n    System.out.println((super)o.x);\
    \ // prints: 1\n  }\n\n```\n\n```\nclass subclass extends superClass {\n  int\
    \ x;\n  subClass(int x) {\n    this.x = super.x + 1;\n  }\n}\n```\n\n- 3. Initializes\
    \ the instance variable x of the superClass (x=1)\n- 1. Creates an instance of\
    \ the subclass\n- 5. Object is needed to access the superclass instance variable\
    \ x\n- 2. Creates an instance of the superclass\n- 4. Initializes the instance\
    \ variable x of the subclass (x=1+2)\n\nWhen an object of a subclass is created,\
    \ a superclass object is created as well, implicit or explicitly. It means any\
    \ subclass object consists of the subclass instance and its parent class (superclass)\
    \ instance.\n\nIn the above example, the user-supplied subclass constructor subclassClass()\
    \ creates the superclass instance by calling the superclass constructor superClass()\
    \ via the super(x) statement. The keyword super, when used in the subclass constructor,\
    \ represents the current object of the parent class. In the example, it is also\
    \ used to access the instance variable x of the superclass.\n\n## Object Casting\n\
    \nNote, the super keyword can be used only in constructors. So how do we access\
    \ the instance variables or instance methods of a superclass from a subclass object?\
    \ In the above example the variable x is defined in both the subclass and the\
    \ superclass. The subclass' x can be referenced via the subclass object as follows:\
    \ subclassObject.x, but the superclass' x is hidden. The solution to this problem\
    \ is object casting. We can cast a subclass object to any of its subclass objects.\
    \ Consider an example with two classes Parent and Child, both declaring an instance\
    \ variable. Class Parent is superclass of class Child. An instance (object) of\
    \ class Child would contain two instances of variable x. The code below shows\
    \ how to access all of the different instance variables by utilizing the object\
    \ casting mechanism:\n\n```\nclass Parent { int x; }\nclass child extends Parent\
    \ { int x; }\nclass Test {\n    public static void main(String[] args[]) {\n \
    \       int y;\n        // A Child object referenced by a variable of type Child:\n\
    \        Child c = new Child(); // reference to the x of class Child\n       \
    \ y = c.x; // reference to the x of class Parent\n        y = ((Parent) c).x;\
    \ // reference to the x of class Parent\n\n        // A Child object referenced\
    \ by a variable of type Parent:\n        Parent p = new Child();\n        y =\
    \ p.x; // reference to the x of class Parent\n        y = ((Child) p).x; // reference\
    \ to the x of class Child\n    }\n}\n```\n"
  mdcn: "\n当类在 **main** 程序中首次被引用时，类变量 **totalCount** 将被初始化为零。当创建对象 **obj1** 和 **obj2**\
    \ 时，将执行实例语句块，将 **totalCount** 加 1，并将其新值赋值给实例变量 **myNumber**。请注意，对象 **obj1** 和\
    \ **obj2** 将拥有它们自己的 **myNumber** 变量副本。\n\n上一个示例中包含一个尚未涵盖的内容——**new** 语句，它用于创建对象。让我们仔细观察一下它以及创建新对象的整个过程。\n\
    \n## 操作对象\n\n对象是 Java 语言的核心，因此深入理解如何创建对象以及如何使用它们的内容非常重要。\n\n## 创建对象\n\n创建新对象的过程称为实例化，通过\
    \ `new` 语句执行。`new` 语句的格式如下：\n\n```\nclassName objectReferenceVariable = new className(parameters);\n\
    ```\n\n示例：\n\n```\nmyClass object1 = new myClass();\n```\n\n在执行上述语句期间会发生以下情况：\n\
    \n- 1) \"myClass object1\" 声明了类型为 myClass 的变量 object1。该变量可以引用任何 myClass 类的对象，这就是为什么此类变量被称为对象引用。\n\
    - 2) `new` 运算符创建一个新对象；并处理所有的变量实例声明、语句块和方法。\n- 3) 调用 `myClass()` 方法来可选地初始化新创建对象的实例变量。\n\
    - 4) 建立变量 object1 与新对象之间的引用。\n\n## 构造函数\n\n上述的 `myClass()` 方法被称为构造函数，它是一个与类名相同且没有指定返回类型的方法。它在创建该类的对象时由\
    \ JVM 调用。构造函数的作用初始化类的实例变量。如果你不声明任何构造函数，JVM 将创建一个空的构造函数：`className() {}`，它将不会执行任何操作。然而，一旦程序员声明了至少一个构造函数，默认构造函数就会消失且无法使用。请记住，构造函数会在实例声明和语句块处理之后立即调用。以下是一个跟踪其对象的类示例：\n\
    \n```\nclass testclass {\n    static int count; // 对象总计数器；默认为零\n    int myNumber;\
    \ // 对象的序号\n\n    // 实例块在每次创建对象时执行\n    {myNumber = ++count;} // 实例块增加计数\n //\
    \ 并将其赋值给对象的 myNumber\n\n    testClass() {} // 无参数的构造函数\n    testClass(int n) {\n\
    \        myNumber = n; // 第二个构造函数；将指定的\n // 序号赋值给新对象\n    }\n\n    // -----执行-\n\
    \    public static void main(String args[]) {\n        testClass obj1 = new testClass();\n\
    \        testClass obj2 = new testClass();\n        testClass obj3 = new testClass(10);\n\
    \        System.out.println(obj1.myNumber); // 输出 1\n        System.out.println(obj2.myNumber);\
    \ // 输出 2\n        System.out.println(obj3.myNumber); // 输出 10\n    }\n}\n```\n\
    \n注意，我们定义了两个同名的构造函数。这被称为“方法重载”。\n\n## 方法重载\n\n**方法重载**是 Java 使用的一种机制，用于区分具有相同名称但参数列表不同的方法。Java\
    \ 中的每个方法通过其**签名**来区分——即方法名加上参数类型列表。`testClass()` 方法的签名可以表示为“**testClass**”，而 `testClass(int\
    \ n)` 的签名将是“**testClass,int**”。\n\n## \"this\" 关键字\n\n在之前的示例中，实例变量在构造函数中通过它们的名称直接引用。但当在\
    \ **main** 方法中声明一个与实例变量同名的变量时，会发生什么？这种情况是完全合，因为在 **main** 方法内部声明的所有变量在该方法外部都是**不可见的**。\n\
    \n另一个混淆点是实例变量名也被用在构造函数的参数列表中。这个问题可以通过使用 **this** 关键字来解决，它代表当前对象。参见此示例：\n\n```\n\
    class testclass {\n  int x;\n  testclass(int x) {\n    x = x;\n    this.x = x;\n\
    \  }\n  public static void main(String args[]) {\n    int x;\n    testclass obj\
    \ = new testclass(100);\n    x = obj.x;\n  }\n}\n```\n\n**this** 关键字不仅可以用于引用实例变量，还可以从一个构造函数调用另一个构造函数，或者在方法之间传递当前对象作为参数。\n\
    \n重要说明：**this** 关键字只能在构造函数中使用。\n\n使用 **this** 关键字的另一个示例：\n\n```\nclass Position\
    \ {\n    int x, y, z;\n    Position (int x, int y, int z) {\n        this.x =\
    \ x;\n        this.y = y;\n        this.z = z;\n    }\n    Position (int x) {\n\
    \        this(x, 0, 0);\n        showPosition(this);\n    }\n    void showPosition(Position\
    \ p) {\n        System.out.println(\"My position: \"+p.x+\",\"+p.y+\",\"+p.z);\n\
    \    }\n\n    public static void main(String args[]) {\n        Position obj =\
    \ new Position(5);\n    }\n}\n```\n\n> 调用另一个构造函数（必须是第一个语句）\n\n- 将当前对象传递给 showPosition\
    \ 方法\n\n上述代码输出：My position: 5,0,0\n\n## \"super\" 关键字\n\n面向对象的设计原则之一是继承。继承表示了类之间的父子关系，当子类（子类）继承父类（超类）的所有特征时，Java\
    \ 在类声明中使用 \"extends\" 关键字来建立继承：\n\n```\nclass superClass { body }\nclass subclass\
    \ extends superClass { body }\n```\n\n创建子类对象的示例：\n\n```\nclass superClass {\n\
    \  int x;\n  superClass(int x) {\n    this.x = x;\n  }\n  // 执行逻辑\n  public static\
    \ void main(String[] args) {\n    subClass o = new subclass(1);\n    System.out.println(o.x);\
    \ // 输出: 2\n    System.out.println((super)o.x); // 输出: 1\n  }\n\n```\n\n```\n\
    class subclass extends superClass {\n  int x;\n  subClass(int x) {\n    this.x\
    \ = super.x + 1;\n  }\n}\n```\n\n- 3. 初始化超类的变量 x (x=1)\n- 1. 创建子类的实例\n- 5. 需要访问超类的变量\
    \ x\n- 2. 创建超类的实例\n- 4. 初始化子类的变量 x (x=2)\n\n创建一个子类对象时，也会隐式或显式地创建一个超类对象。这意味着任何子类对象都由子类实例和父类（超类）实例组成。\n\
    \n在上面的示例中，用户提供的子类构造函数通过 `super()` 语句调用超类构造函数来创建超类实例。`super` 关键字在子类构造函数中使用时代表父类的当前对象。它还用于访问超类的变量\
    \ x。\n\n## 类型转换\n\n注意，`super` 关键字只能在构造函数中使用。那么我们如何从子类对象访问超类的实例变量或实例方法呢？在上面的示例中，变量\
    \ x 在子类和超类中都有定义。子类的 x 可以如下通过子类对象引用：subclassObject.x，但超类的 x 被隐藏了。解决这个问题的方法是类型转换。我们可以将子类对象转换为子类对象。考虑一个两个类\
    \ Parent 和 Child，它们都声明了实例变量。Parent 是 Child 的超类。Child 类的实例包含两个 x 的实例。以下代码显示了如何利用类型转换机制访问所有不同的实例变量：\n\
    \n```\nclass Parent { int x; }\nclass child extends Parent { int x; }\nclass Test\
    \ {\n    public static void main(String[] args[]) {\n        int y;\n        //\
    \ 由类型为 Child 的变量引用的 Child 对象:\n        Child c = new Child(); // 引用 Child 的 x\n\
    \        y = c.x; // 引用 Parent 的 x\n        y = ((Parent) c).x; // 引用 Parent 的\
    \ x\n\n        // 由类型为 Parent 的变量引用的 Child 对象:\n        Parent p = new Child();\n\
    \        y = p.x; // 引用 Parent 的 x\n        y = ((Child) p).x; // 引用 Child 的 x\n\
    \    }\n}\n```\n"
