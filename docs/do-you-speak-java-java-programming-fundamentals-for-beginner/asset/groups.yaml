    \n*\n\n## Event Handling\n\nWhen you interact with a GUI application, each action\
    \ triggers an event. Mouse move, mouse click, keyboard input, scroll, screen touch,\
    \ swipe, etc. – all are examples of events that can be captured by the JavaFX\
    \ application and processed.\n\nThe event handling mechanism employed by JavaFX\
    \ is easier explained through an example. Let's say that we clicked on a button\
    \ on the screen. This action triggers a \"mouse click\" event. In JavaFX, an event\
    \ is an instance of the javafx.event.Event class or any subclass of Event, so\
    \ JavaFX creates a corresponding Event object for the event. The event object\
    \ “travels” through the object hierarchy, from the Stage object to the target\
    \ node that was clicked, and backwards. By “travel” we mean “presented for processing”.\
    \ The first path is called “capturing phase:\n\nStage -> Root Node -> branch nodes\
    \ (if any) -> Target Node\n\nThe second path is called \"bubbling phase\":\n\n\
    Target Node -> branch nodes -> Root Node -> Stage\n\nAny time during the capturing\
    \ or bubbling phase the event can be flagged as “consumed” by executing the consume()\
    \ instance method of class Event. This stops further propagation.\n\nPresenting\
    \ (i.e. delivering) an event to an object for processing does not imply that the\
    \ event will be or be processed by that object. To be able to accept\n"
