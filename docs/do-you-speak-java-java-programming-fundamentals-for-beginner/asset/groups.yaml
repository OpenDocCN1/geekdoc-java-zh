    \n| 逻辑运算符： | AND | OR | XOR | NOT |\n| 操作数 A | 操作数 B | A & B | A | B | A ^ B |\
    \ !A |\n| --- | --- | --- | --- | --- | --- | --- |\n| True | True | True | True\
    \ | False | False | |\n| True | False | False | True | True | False | |\n| False\
    \ | True | False | True | True | False | |\n| False | False | False | False |\
    \ False | True | |\n\n短路运算符 (&&) 和 (||) 在左侧操作数的值足以决定结果（无论另一个操作数的值如何）时，不会求值逻辑表达式的右侧操作数。例如，如果\
    \ A=true，无论 B 的值是什么，A | B 的结果始终为 true。\n\n示例：\n\n```\nboolean a, b, c;\na = true;\n\
    b = true;\n\na = !b; // a=false\na &= b; // a=false (same as: a = a & b)\na |=\
    \ b; // a=true (same as: a = a | b)\na ^= b; // a=false (same as: a = a ^ b)\n\
    a = a ^ b; // a=false\n```\n\n```\n// 短路运算符\na = false;\nb = true;\nc = a || b;\
    \ // c=true (a 和 b 都会被求值)\nc = b || a; // c=true (a 不会被求值)\nc = a && b; // c=false\
    \ (b 不会被求值)\n```\n\n# 条件运算符\n\nJava 提供了一个特殊的三元（三路）条件运算符 `?:...`，它允许对某些 IF-THEN-ELSE\
    \ 语句进行紧凑实现。`?:...` 运算符的格式如下：\n\n```\nvariable = logical_expression ? expression1\
    \ : expression2\n```\n\nlogical_expression 是任何求值为布尔值的表达式。如果它求值为为 true，则求值 expression1\
    \ 并赋值给 variable；否则，求值 expression2 并赋值给 variable。这可以用伪代码表示：\n\n```\nIF logical_expression\
    \ = true\n\nTHEN variable = value of expression1\nELSE variable = value of expression2\n\
    ```\n\n示例 1：\n\n```\nint x = -1;\nint y = -1;\ny = x > 0 ? x : -x; // x = -1;\
    \ y = +1\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_32_0.png)\n\n示例 2：\n\
    \n```\nint x = -1;\nint y = -1;\ny = x > 0 ? x : -(x = x + y); // x = -2; y =\
    \ +2\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_32_1.png)\n\n在第二个示例中，首先执行\
    \ x = x + y 表达式，导致 x=-2。然后，表达式 -(-2) 求值为 +2，并将该值赋值给 y。\n\n# 程序流程控制\n\n大多数计算机语言（包括\
    \ Java）都支持以下基础程序流结构：\n\n- 顺序语句\n- 语句块\n- 二选（IF 结构）\n- 多选（CASE 结构）\n- 迭代\n- 跳跳转（GOTO\
    \ 语句）\n\n本段落将介绍 Java 对这些结构的实现。\n\n# 顺序语句\n\n顺序语句不改变程序流。\n\n![](img/7ffd006441be7e70bb67929dee89a427_33_0.png)\n\
    \n赋值语句如 `x = b;` 是顺序语句的一个示例。Java 还有一个空语句，只是一个分号 (`;`)，前面没有任何表达式。\n\n# 语句块\n\n\
    语句块是包含在花括号内的一组语句和可选声明：\n\n{declarations and statements}\n\n语句块之外的程序流不受影响：\n\n\
    ![](img/7ffd006441be7e70bb67929dee89a427_33_1.png)\n\n# \"if\" 语句\n\n“if\" 语句实现了二选结构：\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_34_0.png)\n\nif 语句的格式如下：\n\n```\nif\
    \ ( boolean expression )\n  { statements, 当条件为真时执行语句 }\nelse\n  { statements,\
    \ 当条件为假时执行语句 }\n```\n\n示例：\n\n```\nint x;\nx = 0;\n\nif (x < 0)\n  x++;\nelse\n\
    \  ;\n\nSystem.out.println(\"x=\" + x); // 打印 \"x=0\"\n\nif (x == 0)\n  { x++;\
    \ }\nelse\n  { x--; }\nSystem.out.println(\"x=\" + x); // 打印 \"x=1\"\n```\n\n\
    # \"switch\" 语句\n\nswitch 语句实现了多选结构：\n\n![](img/7ffd006441be7e70bb67929dee89a427_35_0.png)\n\
    \n这里是 switch 语句的格式：\n\n```\nswitch ( expression )\n{\n  case value1: statement;\n\
    \  break;\n  case value2: statement;\n  break;\n  default: statement;\n}\n```\n\
    \n表达式必须求值为 char、byte、short、int 等数值类型。表达式的结果将与 value1 到 valueN 进行比较。当匹配到某个 case\
    \ 时，将执行其对应的语句。我们可以使用 break 语句跳出 switch 结构。default 语句是可选的，当没有匹配项时执行。\n\n示例：\n\n\
    ```\nint x, y, z;\nx = y = z = 1;\nswitch (x)\n{\n    case 1: z = 2; break;\n\
    \    default: z = 999;\n}\nSystem.out.println(\"z=\" + z); // 打印 z=2\n```\n\n\
    # 迭代语句\n\nJava 支持三种迭代语句——while、do...while 和 for。它们都实现了直到某些条件满足时执行代码块的迭代结构。\n\n\
    ![](img/7ffd006441be7e70bb67929dee89a427_36_0.png)\n\n## “while” 语句\n\nwhile 语句在指定的条件为真时执行代码块（体）：\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_36_1.png)\n\n这里的一个重要点是先求值条件，然后执行体。如果初始条件为假，则循环体将完全不执行。while\
    \ 语句的格式如下：\n\nwhile ( condition ) { body }\n\n示例：\n\n```\nint n;\nn = 2;\nwhile\
    \ (n > 0)\n{\n  System.out.print(\"n=\" + n); // 打印 \"n=2 n=1\"\n  n--;\n}\n```\n\
    \n如果 n 的初始值为 0，上述代码不会产生任何输出，即循环体不会执行。\n\n## \"do...while\" 语句\n\ndo...while 语句与上述\
    \ while 语句相似，但有一个例外——它先执行循环体，然后求值指定的条件：\n\n![](img/7ffd006441be7e70bb67929dee89a427_37_0.png)\n\
    \ndo...while 语句的格式如下：\n\n```\ndo { body } while ( condition ) ;\n```\n\n示例：\n\n\
    ```\nint n;\nn = 2;\ndo\n{\n    System.out.print(\"\" + n); // 打印: \"n=2 n=1\"\
    \n    n--;\n}\nwhile (n > 0);\n```\n\n正如我们所见，结果与之前的 while 语句示例完全相同。然而，如果 n 的初始值为\
    \ 0，循环体会执行一次，上述代码将产生如下输出：\n\nn=0\n\n"
