- md: "\nSince a stand-alone string literal represent a String object, you can work\
    \ with it as an object, without creating a reference. For example, you can invoke\
    \ the length() instance method of the String class to get the length of a literal,\
    \ as follows: \n\n```\nint n = \"text\".length(); // n = 4\n```\n\nAnother important\
    \ fact about the String object:\n\n> Once created and initialized, a String object\
    \ cannot be modified. Its value cannot be appended, truncated, or replaced. If\
    \ you need a modifiable string – use the StringBuffer class (not covered in this\
    \ book).\n\n## Comparing Strings\n\nIt is important to understand that there is\
    \ a difference between comparing two actual string values and comparing two references\
    \ to String objects:\n\n```\nString s1 = \"text\";\nString s2 = \"text\";\nboolean\
    \ b = (s1 == s2); // b=true\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_69_0.png)\n\
    \n```\nString s3 = new String(\"text\")\nString s4 = new String(\"text\")\nboolean\
    \ b = (s3 == s4); // b=false\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_69_1.png)\n\
    \nTo compare the actual values of two strings (which in fact are encapsulated\
    \ within String objects), we need to use the instance method equals() of class\
    \ String:\n\n```\nString s1 = new String(\"text\")\nString s2 = new String(\"\
    text\")\nboolean b = ( s1.equals(s2) ); // b = true\n```\n\n## String Concatenation\
    \ Operator\n\nThe string concatenation operator (+) combines two operands into\
    \ one string. The primitive data type operands (boolean, char, int, double, etc.)\
    \ are converted into their string representation, and object operands are converted\
    \ into a string by calling the instance method toString(). This type conversion\
    \ is performed on an operational basis, from left to right, as shown in the following\
    \ examples:\n\nExample 1:\n\n```\nString s = \"I have \" + 5 + 4 + \" dollars\"\
    ;\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_70_0.png)\n\nExample 2:\n\n\
    ```\nString s = \"I have \" + 5 * 4 + \" dollars\";\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_70_1.png)\n\
    \n## String Methods\n\nIn this paragraph we will present some commonly used methods\
    \ of class String.\n\n### Determining String Length\n\n```\nString s = \"text\"\
    ;\nint lng = s.length(); // lng = 4\nlng = \"my string\".length(); // lng = 9\n\
    ```\n\n### Comparing Strings\n\nThe compareTo() method compares two strings lexicographically.\
    \ The comparison is based on the Unicode value of each character in the strings\
    \ and is performed by comparing one character at a time, from left to right, until\
    \ unequal characters are found or until the end of one of the strings is reached.\
    \ The value returned by the compareTo() method is calculated as difference between\
    \ the numeric values of unequal characters ('a' - 'b' = -1). If one of the strings\
    \ reaches its end, the method returns the difference of the length of the strings.\n\
    \n```\nString s = \"ab\";\nint n = s.compareTo(\"ab\"); // n = 0\n```\n\n### Accessing\
    \ String Characters\n\n```\nString s = \"abcdef\";\nchar c1 = s.charAt(0); //\
    \ c1 = 'a'\nchar c2 = s.charAt(5); // c2 = 'f'\n```\n\n### Searching for a Character\n\
    \n```java\nString s = \"abcd\";\nint pos;\npos = s.indexOf('g'); // pos=-1 (character\
    \ 'g' not found)\npos = s.indexOf('b',2); // pos=+3 (first 'b' after position\
    \ 2 is in position 3)\npos = s.lastIndexOf('c'); // pos=+4 (last symbol 'b' is\
    \ in position 4)\n```\n\n### Searching for a Substring\n\n```\nString s = \"abcd\"\
    ;\nint pos;\npos = s.indexOf(\"abd\"); // pos = -1 (sub-string 'abd' not found)\n\
    pos = s.indexOf(\"bc\"); // pos = 1 (sub-string 'bc' is in position 1)\n```\n\n\
    ### Extracting a Substring\n\n```\nString s = \"abcdef\";\nString s1 = s.substring(1,3);\
    \ // s1 = \"bc\"\nString s2 = s.substring(1); // s2 = \"bcdef\"\n```\n\n### Creating\
    \ a new String from existing String\n\n```\nString s = \" abc\";\nString s1 =\
    \ s.trim(); // s1 = \"abc\"\nString s2 = s.replace(' ', '+'); // s2 = \"+abc\"\
    \n```\n\n### Creating a Character Array from a String\n\n```java\nString s = \"\
    abcd\";\nchar[] c = s.toCharArray();\ns.getChars(0, 2, c, 2);\n\nc[0]='a'\nc[1]='b'\n\
    c[2]='c'\nc[3]='d'\n```\n\n> Copy characters in positions 0, 1 of string into\
    \ array c starting from position 2.\n\n```\nc[0]='a'\nc[1]='b'\nc[2]='a'\nc[3]='b'\n\
    ```\n\n### Creating an Array of Bytes from a String\n\nThis method converts each\
    \ character of a string from Unicode (16-bit) into the local 8-bit encoding (usually\
    \ ASCII) and creates an array of bytes.\n\n```java\nString s = \"abcd\";\nbyte[]\
    \ b = s.getBytes();\n\nb[0]=97 ('a' in ASCII)\nb[1]=98 ('b' in ASCII)\nb[2]=99\
    \ ('c' in ASCII)\nb[3]=100 ('d' in ASCII)\n```\n\n### Creating a String from an\
    \ Array of Characters\n\nThe static copyValueOf method of class String create\
    \ a String object from an array of characters. It has the following two formats:\n\
    \n```\nstatic copyValueOf(char[] charArray);\n```\n\n```\nstatic copyValueOf(char[]\
    \ charArray, int startPos, int numberOfElements);\n```\n\nExample:\n\n```\nchar[]\
    \ c = {'a', 'b', 'c', 'd'};\nString s1 = String.copyValueOf(c); // s1 = \"abcd\"\
    ;\nString s2 = String.copyValueOf(c,1,2); // s2 = \"bc\";\n```\n\n## Packages\n\
    \nA package is a container for classes. All Java classes are spread across more\
