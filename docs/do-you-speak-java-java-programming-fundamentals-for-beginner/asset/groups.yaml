  mdcn: "\n为了处理事件，每个对象都必须将自己注册为事件处理器，并实现某种事件处理逻辑。由于事件会传递给每个对象两次——一次在捕获（或过滤）阶段，另一次在冒泡（或处理）阶段，因此对象可以设置事件过滤器、事件处理器，或两者兼备。\n\
    \n所有节点（即 `Node` 类的子类）以及 `Stage` 和 `Scene` 类都定义了注册和实现事件过滤器与事件处理器的方法：\n\n```\n<T\
    \ extends Event> void addEventListener(EventType<T> eventType,\nEventHandler<?\
    \ super T> eventHandler);\n```\n\n```\n<T extends Event> void addEventHandler(EventType<T>\
    \ eventType,\nEventHandler<? super T> eventHandler);\n```\n\n还有所谓的用于注册不同类型事件的处理器的便利方法。它们基本上是\
    \ `addEventHandlerMethods` 方法的简写。例如，此方法为“鼠标点击”注册了一个事件处理器：\n\n```\nvoid setMouseClicked(EventHandler<?\
    \ super MouseEvent> value);\n```\n\n让我们练习一下，使用 `addEventHandler()` 和 `setMouseClicked()`\
    \ 方法创建几个事件处理器。\n\n`setMouseClicked` 方法声明了一个参数——一个泛型函数接口 `EventHandler` 对象，其泛型类参数可以是\
    \ `MouseEvent` 或 `MouseEvent` 的任何父类（例如 `EventHandler<MouseEvent>`、`EventHandler<Event>`\
    \ 等）。\n\n`EventHandler` 泛型接口声明了以下方法：\nvoid handle(T event);\n\n接下来，我们需要创建一个类型为\
    \ `EventHandler<MouseEvent>` 的对象，实现它的 `handle()` 方法，并将此对象作为参数传递给 `setMouseClicked()`\
    \ 方法。这可以通过几种不同的方式实现，下面列了三种。\n\n使用 `setMouseClicked()` 方法注册事件处理器的第一种方法是使用匿名类：\n\
    \n```\nnode.setMouseClicked(\n  new EventHandler<MouseEvent>() {\n    public void\
    \ handle(MouseEvent e) {\n      ... 事件处理逻辑 ...\n    }\n});\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_176_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_176_1.png)\n\n使用 `setMouseClicked()`\
