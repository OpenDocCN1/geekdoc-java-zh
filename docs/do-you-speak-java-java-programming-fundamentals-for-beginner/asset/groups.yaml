- md: "\n# Annotations\n\nAnnotations provide a standard way of documenting Java programming\
    \ code. The following characteristics make the annotations distinct from other\
    \ documenting means:\n\n- Annotations are closely associated with the program\
    \ constructs they annotate; this reduces the possibility of misrepresentation.\n\
    - Annotations can be used as instructions to the Java compiler to perform certain\
    \ actions, e.g. to suppress some warning messages.\n- Annotations are objects\
    \ that can be accessed at run time by the application program containing annotations\
    \ or by third-party tools.\n\nImportant note: annotations have no effect at run\
    \ time.\n\n# How do we create an annotation?\n\nIn a nutshell, annotations are\
    \ regular Java classes, only declared and handled differently. All annotation\
    \ classes (referred to as annotation types) are created by implementing the Annotation\
    \ interface. However, instead of using the implements keyword in the class declaration,\
    \ we specify the annotation class as @interface:\n\n```java\n@interface myAnnotation\
    \ {\n  Type method();\n  Type method() default value;\n  ....\n}\n```\n\n| Only\
    \ methods without bodies are allowed in the annotation declarations |\n\nExample:\n\
    \n```java\n@interface Author {\n  string name();\n  string version() default \"\
    1.0\";\n}\n```\n\n| A default value returned by the method can be declared. |\n\
    \nAny declaration in the program source, should precede the annotation itself,\
    \ can be annotated. Annotation precedes the declaration being annotated:\n\n```java\n\
    @Author(name=\"John Doe\", version=\"1.2\")\nclass myClass { .. }\n..\n\n@Author(name=\"\
    Bob\")\npublic void methodName(int n) { ... }\n```\n\n| classMyLocation is annotated\
    \ with the Author information |\n\n| Method methodName is annotated. it's OK to\
    \ skip the version because it was defined with default return value |\n\n# What\
    \ can we do with annotations?\n\nBefore answering this question, we need to review\
    \ the lifecycle of the Java program, which can be broken into four stages:\n\n\
    - Source code\n- Compilation\n- Byte code\n- Execution (run time)\n\nThe initial\
    \ question needs to be broken down for each stage: “What can we do with annotations\
    \ in the source code, during compilation, while in byte code, and at the run time?\n\
    \nAs we have already seen, the source code contains the annotation declarations.\
    \ From the programmer’s standpoint, not much can be discussed here except the\
    \ specifics of the declaration syntax, which will be covered later.\n\nThe next\
    \ stage is compilation. The compiler interprets the annotation declarations and\
    \ creates proper Java objects, but does the compiler do anything else with annotations?\
    \ The answer is yes - there is a set of predefined (i.e. built-in) annotations,\
    \ which serve as instructions to the compiler. They are all defined in the java.lang.annotation\
    \ package:\n\n```java\n@Retention\n@Target\n@Inherited\n@Override\n@SuppressWarnings\n\
    @Deprecated\n@SafeVarargs\n@Repeatable\n@FunctionalInterface\n```\n\nAs all the\
    \ annotations, the pre-defined annotations should precede the annotated declaration\
    \ (or another annotation). For example, the following code will instruct the compiler\
    \ to check if the someMethod() is indeed an override of the same method of the\
    \ superclass. If the superclass of the current class does not declare the someMethod(),\
    \ a compile-time error will occur.\n\n```java\n@Override\npublic void myMethod()\
    \ {...}\n```\n\nOther, not pre-defined annotations (user-defined, or declared\
    \ in other Java packages), are controlled by the @Retention pre-defined annotation.\
    \ The @Retention annotation can specify three values defined by the RetentionPolicy\
    \ enumeration:\n\n```java\n@Retention (RetentionPolicy.SOURCE)\n@Retention (RetentionPolicy.CLASS)\
    \    <- default\n@Retention (RetentionPolicy.RUNTIME)\n```\n\nNote: @Retention\
    \ can only annotate another annotation declaration.\n\nHere is the effect of the\
    \ above constants:\n\n- SOURCE– annotation stays only in the source (.java file)\
    \ and is discarded after compilation.\n- CLASS – annotation will be stored in\
    \ the bytecode (.class file) but will be discarded before the execution; this\
    \ is the default value.\n- RUNTIME – annotation will be available at run time.\n\
    \nThe SOURCE-level annotations are not processed by the Java compiler (with the\
    \ exception of the pre-defined annotations). However, as of Java SE 6, you can\
    \ add annotation processors to the Java compiler, which are stand-alone, custom\
    \ tools for processing annotations. They are out of the scope of this book.\n\n\
    The CLASS-level annotations are too specialized and therefore are also beyond\
    \ the scope of our discussion, so let's talk about run-time processing.\n\n# Processing\
    \ Runtime Annotations\n\nWhen the @Retention(RetentionPolicy.RUNTIME) annotation\
    \ is specified for another annotation (custom defined, or declared in one of the\
    \ Java packages), it makes that annotation available at the run time. Since Java\
    \ does not provide any special run-time mechanisms of handling the annotations,\
    \ it's up to us what to do with them.\n\nAs we already mentioned, annotations\
    \ are objects of Java classes implementing the Annotation interface. What it means\
    \ is that if we can obtain a reference to the object of some annotation, we can\
    \ invoke method(s) to retrieve the declared values:\n\n```java\n@interface Author\
    \ {\n  String name();\n}\n\n@Author(name=\"Bob\")\nclass myClass {\n  public static\
    \ void main(String args[]) {\n    Author a = (myClass.class).getAnnotation(Author.class);\n\
    \    System.out.println(a.name()); // would print: Bob\n  }\n}\n```\n\nTo understand\
    \ how to access an instance of an annotation, we need to recall the purpose of\
    \ annotations, which is to provide supplemental information about other declarations.\
    \ The @Author(name=\"Bob\") above creates an object of type Author, associated\
    \ with the class myClass, and whose method name() returns the value \"Bob\".\n\
    \nAs we explained previously in the Reflection chapter, at run, each class is\
    \ represented by a Class object. The association between the annotation and the\
    \ annotated class can be presented with this diagram:\n\n![](img/7ffd006441be7e70bb67929dee89a427_166_0.png)\n\
    \nmyClass.class is the instance of the Class object representing myClass. We could\
    \ use the getClass() method on myClass instance, but such an instance might not\
    \ be created. Then, we can use the instance method getAnnotation() to obtain the\
    \ instance of the Author annotation. The final step is to execute the name() method\
    \ of the annotation to retrieve the value \"Bob\".\n\nHere is the statement obtaining\
    \ the Author object annotating myClass:\nAuthor a = (myClass.class).getAnnotation(Author.class);\n\
    \nNote that we provided Author.class to the getAnnotation() method. This was necessary\
    \ because myClass could have more than one annotation, and the getAnnotation method\
    \ would need to know which one to retrieve.\n\nHere is a sample code accessing\
    \ annotation at run time:\n\n```java\nimport java.lang.reflect.*;\n```\n\n```java\n\
    @interface Author {\n  string name();\n}\n@Author(name=\"Bob\")\nclass myClass\
    \ {\n  public static void main(String args[]) {\n    Author a = (myClass.class).getAnnotation(Author.class);\n\
    \    System.out.println(a.name()); // would print: Bob\n  }\n}\n```\n\nThe same\
    \ technique can be used for annotated methods, fields, etc. For example, if the\
    \ above annotation was used to annotate the myMethod(String s) method, the access\
    \ to the annotation object would be as follows:\n\n```java\nAuthor a = (myClass.class)\n\
    \  .getMethod(\"myMethod\", String.class)\n  .getAnnotation(Author.class);\n```\n\
    \n# Annotation Types\n\nAnnotation coding semantics allows dropping some parts\
    \ of the annotation constructs when the corresponding information can be derived\
    \ from context. For example, if the annotation does not have any parameters, the\
    \ following two declarations are equal:\n\n```java\n@interface MyAnnotation {}\n\
    @interface MyAnnotation\n```\n\nThis is driven by the number of elements an annotation\
    \ has. Based on this, Java recognizes the following types of annotations:\n\n\
    - Normal Annotation\n- Single Element Annotation\n- Marker Annotation\n\nA Normal\
    \ Annotation is an annotation explicitly declaring all components of the annotation\
    \ constructs, for example:\n\n```java\n@interface Book {\n  String name();\n \
    \ int edition() default 1;\n}\n```\n\n```java\n@Book ( { name=\"My Book\",edition=2;\
    \ } )\nclass myClass {...\n```\n\nA Single-Element Annotation is a shorthand designed\
    \ for use with annotations declaring a single element. If the element name is\
    \ value, it can be omitted from the annotation:\n\n```java\n@interface Name {\n\
    \  String value();\n}\n```\n\n```java\n@Name ( value=\"Bob\" )\n@Name ( \"Bob\"\
    \ )\n```\n\nIt is also valid to use single-element annotations for annotations\
    \ with multiple elements, so long as one element is named value and all other\
    \ elements have default values. All below constructs are valid:\n\n```java\n@interface\
    \ BookName {\n  String value();\n  int edition() default 1;\n}\n```\n\n```java\n\
    @BookName ( { name=\"My Book\",edition=2; }\n@BookName (name=\"My Book\")\n@BookName(\"\
    My Book\")\n```\n\nA Marker Annotation is shorthand for annotations without elements.\
    \ All below constructs are valid:\n\n```java\n@interface Book { }\n@interface\
    \ Book\n```\n\n```java\n@Book ()\n@Book\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_168_0.png)\n"
  mdcn: "\n\n# 注释 (Annotations)\n\n注解为 Java 编程代码提供了一种标准的记录方式。以下特征使得注解与其他记录手段有所不同：\n\
    \n- 注释与它们所标记的程序结构紧密相关；这减少了误表述的可能性。\n- 注释可以用作 Java 编译器的指令，以执行某些操作，例如抑制某些警告信息。\n\
    - 注释是对象，可以由包含注解的应用程序或第三方工具在运行时进行访问。\n\n重要提示：注解在运行时不会产生任何影响。\n\n# 我们如何创建注解？\n\n\
    简而言之，注解是普通的 Java 类，只是声明和处理方式有所不同。所有的注解类（称为注解类型）都是通过实现 `Annotation` 接口来创建的。然而，我们不再在类声明中使用\
    \ `implements` 关键字，而是而是使用 `@interface` 来指定注解类：\n\n```java\n@interface myAnnotation\
    \ {\n  Type method();\n  Type method() default value;\n  ....\n}\n```\n\n| 注释声明中只允许没有方法体的方法\
    \ |\n\n示例：\n\n```java\n@interface Author {\n  string name();\n  string version()\
    \ default \"1.0\";\n}\n```\n\n| 可以声明方法返回的默认值。 |\n\n程序源中的任何声明，只要位于注解本身之前，都可以被注解。注解位于被标记的声明之前：\n\
    \n```java\n@Author(name=\"John Doe\", version=\"1.2\")\nclass myClass { .. }\n\
    ..\n\n@Author(name=\"Bob\")\npublic void methodName(int n) { ... }\n```\n\n| classMyLocation\
    \ 被 Author 信息标记了 |\n\n| 方法 methodName 被标记了。跳过 version 是可以的，因为它在定义时指定了默认返回值 |\n\
    \n# 我们可以用注解做些什么？\n\n在回答这个问题之前，我们需要回顾 Java 程序的生命周期，该生命周期可以分为四个阶段：\n\n- 源代码\n- 编译\n\
    - 字节码\n- 执行（运行时间）\n\n初始问题需要针对每个阶段进行拆解：“在源代码中、编译期间、在字节码中以及在运行时，我们可以使用注解做什么？”\n\n\
    正如我们已经看到的，源代码包含了注解声明。从程序员的角度来看，这里没有什么可以讨论的，除了声明语法的具体细节，这些将在稍后介绍。\n\n下一个阶段是编译。编译器解释注解声明并创建适当的\
    \ Java 对象，但编译器对注解还做了其他事情吗？答案是肯定的——存在一组预定义的（即内置的）注解，它们作为编译器的指令。它们都定义在 `java.lang.annotation`\
    \ 包中：\n\n```java\n@Retention\n@Target\n@Inherited\n@Override\n@SuppressWarnings\n\
    @Deprecated\n@SafeVarargs\n@Repeatable\n@FunctionalInterface\n```\n\n正如所有的注解一样，预定义注解应该位于被标记的声明（或另一个注解）之前。例如，以下代码将指示编译器检查\
    \ `someMethod()` 是否确实是父类相同方法的覆盖。如果当前类的父类没有声明 `someMethod()`，则会发生编译错误。\n\n```java\n\
    @Override\npublic void myMethod() {...}\n```\n\n其他非预定义的注解（用户定义的或在其他 Java 包中声明的）由预定义的\
    \ `@Retention` 注解控制。`@Retention` 注解可以指定 `RetentionPolicy` 枚举定义的三个值：\n\n```java\n\
    @Retention (RetentionPolicy.SOURCE)\n@Retention (RetentionPolicy.CLASS)    <-\
    \ 默认值\n@Retention (RetentionPolicy.RUNTIME)\n```\n\n注意：`@Retention` 只能标记另一个注解声明。以下是上述常量的效果：\n\
    \n- SOURCE – 注释仅留在源文件（.java 文件）中并在编译后丢弃。\n- CLASS – 注释将存储在字节码（.class 文件）中，但在执行之前会被丢弃；这是默认值。\n\
    - RUNTIME – 注释将在运行时可用。\n\nSOURCE级别的注解不会被 Java 编译器处理（预定义注解除外）。但是，从 Java SE 6 开始，你可以为\
    \ Java 编译器添加注解处理器，这些是处理注解的独立自定义工具。它们不在本书的讨论范围内。\n\nCLASS 级别的注解太特殊，因此也超出了我们的讨论范围，所以让我们来讨论运行时处理。\n\
    \n# 处理运行时注解\n\n当为另一个注解（自定义定义或声明在某个 Java 包中的注解）指定 `@Retention(RetentionPolicy.RUNTIME)`\
    \ 时，它会使该注解在运行时可用。由于 Java 不提供任何处理注解的特殊运行时机制，因此如何处理它们完全取决于我们。\n\n正如我们已经提到的，注解是实现\
    \ `Annotation` 接口的 Java 类对象。这意味着，如果我们能获取某个注解对象的引用，就可以调用方法来检索声明的值：\n\n```java\n\
    @interface Author {\n  String name();\n}\n\n@Author(name=\"Bob\")\nclass myClass\
    \ {\n  public static void main(String args[]) {\n    Author a = (myClass.class).getAnnotation(Author.class);\n\
    \    System.out.println(a.name()); // 将打印: Bob\n  }\n}\n```\n\n为了理解如何访问注解的实例，我们需要回想注解的用途，即为其他声明提供补充信息。上面的\
    \ `@Author(name=\"Bob\")` 创建了一个 `Author` 类型的对象，它与类 `myClass` 相关，其 `name()` 方法返回值\
    \ \"Bob\"。\n\n正如我们之前在反射章节中所解释的，在运行时，每个类都由一个 `Class` 对象表示。注解与被标记类之间的关联可以用此图表示\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_166_0.png)\n\n`myClass.class` 是表示 `myClass`\
    \ 的 `Class` 对象实例。我们可以在 `myClass` 实例上使用 `getClass()` 方法，但此类实例可能并未创建。那么，我们可以使用实例方法\
    \ `getAnnotation()` 来获取 `Author` 注解的实例。最后一步是执行注解的 `name()` 方法来检索值 \"Bob\"。\n\n\
    以下是获取标记 `myClass` 的 `Author` 对象的语句：\n`Author a = (myClass.class).getAnnotation(Author.class);`\n\
    \n注意为 `getAnnotation()` 方法提供了 `Author.class`。这是必要的，因为 `myClass` 可能有多个注解，`getAnnotation`\
    \ 方法需要知道检索哪一个。\n\n以下是一个在运行时访问注解的示例代码：\n\n```java\nimport java.lang.reflect.*;\n\
    ```\n\n```java\n@interface Author {\n  string name();\n}\n@Author(name=\"Bob\"\
    )\nclass myClass {\n  public static void main(String args[]) {\n    Author a =\
    \ (myClass.class).getAnnotation(Author.class);\n    System.out.println(a.name());\
    \ // 将打印: Bob\n  }\n}\n```\n\n相同的技术也可用于标记方法、字段等。例如，如果上述注解用于标记 `myMethod(String\
    \ s)` 方法，则访问注解的方式如下：\n\n```java\nAuthor a = (myClass.class)\n  .getMethod(\"myMethod\"\
    , String.class)\n  .getAnnotation(Author.class);\n```\n\n# 注解类型 (Annotation Types)\n\
    \n注解语义允许在可以从上下文推导时省略注解结构的部分。例如，如果注解没有任何参数，以下两种声明是等等的：\n\n```java\n@interface MyAnnotation\
    \ {}\n@interface MyAnnotation\n```\n\n这取决于注解拥有的元素数量。基于此，Java 识别以下类型的注解：\n\n- 普通注解\
    \ (Normal Annotation)\n- 单元素注解 (Single Element Annotation)\n- 标记注解 (Marker Annotation)\n\
    \n普通注解是显式声明注解结构所有部分的注解，例如：\n\n```java\n@interface Book {\n  String name();\n \
    \ int edition() default 1;\n}\n```\n\n```java\n@Book ( { name=\"My Book\",edition=2;\
    \ } )\nclass myClass {...\n```\n\n单元素注解是用于单个元素的快捷。如果元素名为 `value`，则可以在注解中省略它：\n\
    \n```java\n@interface Name {\n  String value();\n}\n```\n\n```java\n@Name ( value=\"\
    Bob\" )\n@Name ( \"Bob\" )\n```\n\n对于具有多个元素的注解，使用单元素注解也是有效的，只要其中一个元素名为 `value`\
    \ 且所有其他元素都有默认值。以下所有构造都是有效的：\n\n```java\n@interface BookName {\n  String value();\n\
    \  int edition() default 1;\n}\n```\n\n```java\n@BookName ( { name=\"My Book\"\
    ,edition=2; }\n@BookName (name=\"My Book\")\n@BookName(\"My Book\")\n```\n\n标记注解是无元素注解快捷方式。以下所有构造都是有效的：\n\
    \n```java\n@interface Book { }\n@interface Book\n```\n\n```java\n@Book ()\n@Book\n\
    ```\n\n"
