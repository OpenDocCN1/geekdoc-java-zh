    \ shape1.showSquareFootage(); // prints “6”\n\n- // Change the rectangle dimensions\
    \ to 3x4\nshape1.showSquareFootage(3.0, 4.0); // prints “12”\n\n## Data Types,\
    \ Variables, and Literals\n\nThe Object-Oriented Design discussion gave us an\
    \ idea of how the Java language is different from other, “traditional” languages.\
    \ Now let's look at the features making Java similar to non-object-oriented languages.\n\
    \nMost languages, including Java, have the following in common:\n\n- ability to\
    \ manipulate primitive data types\n- variables and literals\n- a fixed set of\
    \ operators\n- language constructs and statements for controlling the program\
    \ flow\n\nIn this chapter we will review the primitive data types, variables,\
    \ and literals. The rest will be covered in later chapters.\n\n## Primitive Data\
    \ Types\n\nA primitive data type (could be also referred to as simple or atomic\
    \ type) is a data type that is not formed by combining other data types. For example,\
    \ a string is not a primitive data type because it is defined as a set of elements\
    \ of the character data type.\n\nJava defines eight primitive data types:\n\n\
    | Date Type | Description | Length in bits | Range (approximate) |\n|---|---|---|---|\n\
    | byte | Signed Integer Number | 8 | -128 to +127 |\n| short | Signed Integer\
    \ Number | 16 | -32,768 to +32,767 |\n| int | Signed Integer Number | 32 | -2.1*10^9\
    \ to +2.1*10^9 |\n| long | Signed Integer Number | 64 | -9.2*10^18 to +9.2*10^18\
    \ |\n| float | Floating Point Number | 32 | ± (1.4e-45 to 3.4e+38) |\n| double\
    \ | Floating Point Number | 64 | ± (4.9e-32 to 1.8e+308) |\n| char | Unicode Character\
    \ | 16 | 0 to 65,536 |\n| boolean | | N/A | true or false |\n\nNote: Java does\
    \ not reveal the length of boolean data type because its implementation is platform-specific.\n\
    \n## Variables\n\nIn Java, data elements of primitive types can be declared either\
    \ as literals or variables.\n\nA variable is a named reference to a location in\
    \ memory where the data element of specified type resides. The format for declaring\
    \ a variable is this:\n\n```java\ntype identifier; // declares the variable identifier\n\
    // of type type\n```\n\n```java\ntype identifier = value; // declares and assigns\
    \ value\n// to variable identifier of type type\n```\n\nHere are some examples\
    \ of declaring primitive data types.\n\n```java\nint k; // \"k\" is a reference\
    \ to a 32-bit area in memory\n// will hold an integer value\n```\n\n```java\n\
    k = 100; // The above memory is populated with a 32-bit\n// signed binary number\
    \ (100)\n```\n\n```java\nchar c = 'A'; // \"c\" is a reference to the two-byte\
    \ Unicode\n// character 'A'\n```\n\nNote, that variables can reference not only\
    \ the primitive data types, objects as well.\n\n## Accessing the Variables\n\n\
    At high level, you can view every Java program as blocks of code. Each block is\
    \ surrounded by curly brackets: { statements }. Blocks can be separate or in each\
    \ other:\n\n```java\n{ block 1 }\n{ block 2 { block 3 } }\n```\n\nThis structure\
    \ determines the accessibility, also referred to as scope, of variables. A variable\
    \ declared in a block is accessible within that block and within all included\
    \ blocks. Once program flow reaches the end of a block all variables declared\
    \ within that block are destroyed.\n\n## Literals\n\nA literal specifies an actual\
    \ value of a data element. For example, 123 will be treated by Java as a 32-bit\
    \ signed integer number (i.e. type int), and 123.4 – 64-bit floating point number\
    \ (type double). In fact, any whole number value (i.e. without the decimal point)\
    \ is treated as an integer, and any fractional value (i.e. with the decimal point)\
    \ is treated as a double precision floating point number.\n\nThere are four types\
    \ of literals in Java: numeric, character, boolean, and string. Each of them is\
    \ discussed below.\n\n## Numeric Literals\n\nNumeric literals can be specified\
    \ in decimal, hexadecimal, octal, or binary notations. Here is the number 10 in\
    \ different notations:\n\n- 10 - decimal notation (decimal digits 0-9)\n- 0x0A\
    \ - hexadecimal notation (0x is in front of hexadecimal digits 0-F)\n- 012 - octal\
    \ notation\n- 0b1010 - binary notation (0b is in front of binary digits 0-1)\n\
    \nNumeric literals can contain underscores, which are ignored but make the values\
    \ easier to read. Here are examples of valid numeric:\n\n```\n123_456_789\n123_.456_789\n\
    123456789\n```\n\nThe data type of a literal is defined either implicitly (default\
    \ type assignment) or explicitly. The table below shows some examples of how the\
    \ data type is determined.\n\n| Literal | Data Type |\n|---|---|\n| Not available\
    \ | byte |\n| Not available | short |\n| 123 | int |\n| 123L or 123l | long |\n\
    | 123.0 | double |\n| 123.0D or 123.0d | double |\n| 1.23E+2 | double |\n| 123.0F\
    \ or 123.0f | float |\n\n## Character Literals\n\nA character literal is represented\
    \ with a value within a pair of single quotes. The digits, letters, and special\
    \ characters that are present on the keyboard, can be specified directly, as follows:\
    \ 'a', '1', '%', etc. Other symbols should be entered using escape sequences.\
    \ The escape sequence is the backslash '\\' followed by one or more symbols. There\
    \ are several predefined escape sequences that represent new line, tab, backspace,\
    \ etc. Besides that, any Unicode character can be entered directly using escape\
    \ sequences in octal or hexadecimal notations. Octal character notation has '\\\
    nnn' – Hexadecimal character notation has format '\\nnnn' – backslash, followed\
    \ by 'u', followed by four hexadecimal digits. Here is the lower-case letter 'b'\
    \ literal in different formats:\n\n- 'b', '\\u142', '\\u0062'\n\nThe table below\
    \ shows escape sequences.\n\n| Escape Sequence | Description |\n|---|---|\n| \\\
    nnn | Octal character (nnn – octal digits 0-7) |\n| \\nnnn | Unicode character\
    \ (nnnn – hexadecimal digits 0-F) |\n| \\b | Backspace |\n| \\n | New line |\n\
    | \\r | Carriage return |\n| \\t | Tab |\n| \\f | Form feed |\n"
