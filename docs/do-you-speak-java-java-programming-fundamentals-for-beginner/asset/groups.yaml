- md: "\n# Passing Generic Classes as Parameters\n\nObjects of generic classes can\
    \ be passed as parameters to methods, in the same way as other Java objects:\n\
    \n```\nclass GenericClass <T> { ... }\npublic void myMethod(GenericClass g) {\
    \ ... }\nGenericClass<A> a = new GenericClass<A> ();\nGenericClass<B> b = new\
    \ GenericClass<B> ();\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_83_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_83_1.png)\n\n```\nmyMethod(a);\nmyMethod(b);\n\
    ```\n\n![](img/7ffd006441be7e70bb67929dee89a427_83_2.png)\n\nAs you see, myMethod()\
    \ can accept any object of type GenericClass T used in creating objects. We can\
    \ add some type safety checking to the process by specifying restrictions on the\
    \ input parameter of myMethod(). This is accomplished with the help of the wildcard\
    \ parameter <?. The example below demonstrates the usage of the ?> parameter in\
    \ method declaration:\n\n```\nabstract class AB { ... }\nclass A extends AB {\
    \ ... }\nclass B extends AB { ... }\n...\nclass G <T extends AB> { ... }\npublic\
    \ void myMethod(G<?> g) { ... }\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_83_3.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_83_4.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_83_5.png)\n\
    \n```\npublic void myMethod(G<? extends AB> g) { ... }\npublic void myMethod(G<?\
    \ super B> g) { ... }\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_83_6.png)\n\
    \nIn this example, <? extends B> sets the upper boundary for passing object references,\
    \ and <? super B> sets the lower boundary.\n\n# Generic Interfaces\n\nGeneric\
    \ interfaces are declared in a way similar to the declaration of generic classes,\
    \ for example:\n\n```\ninterface GenericInterface <T> {\n    public void myID(T\
    \ id);\n}\n```\n\nThe type-variable(s) in the interface declaration are passed\
    \ to the interface from the class implementing that interface:\n\n```\nclass myClass\
    \ <T> implements myInterface <T> {...}\ninterface myInterface <T> { ... }\n```\n\
    \nThis is why generic interfaces can only be implemented by generic classes.\n\
    \nIt is possible to restrict the scope of type-variables in the class declaration,\
    \ in the interface declaration, or in both:\n\n```\nclass myClass <T extends AB>\
    \ implements myInterface <T> {...}\ninterface myInterface <T extends ABC> { ...\
    \ }\n```\n\nThe Java compiler performs type safety checking by comparing the bounds\
    \ set for the type arguments in the class to the bounds set in the interface.\
    \ The class type arguments must be within bounds of the interface class arguments.\n\
    \nNote: Whether the type-variable T is used (or how it is used) in the bodies\
    \ of the class or interface, is irrelevant to the type safety checking process\
    \ – the type safety checking will be performed anyway.\n\nBelow are examples of\
    \ valid as well as incorrect declarations.\n\n```\nclass AB {\nclass A extends\
    \ AB {}\nclass B extends AB {}\n}\n```\n\n```\ninterface myInterface <T extends\
    \ AB> {...}\n```\n\nonly by the class AB or its sub-classes\nclass myClass <T>\
    \ implements myInterface <T> {...}\n\nValid declaration\n\nValid; class A is subclass\
    \ of AB\nclass myClass <T extends A> implements myInterface <T> {...}\n\n```\n\
    class myClass <T extends String> implements myInterface <T> {...}\n```\n\nclassClass\
    \ implements myInterface <T> {...}\n\nError! Class String is not a subclass of\
    \ AB\n\nError! Class myClass must be generic\n\n```\nclass myClass <X> implements\
    \ myInterface <T> {...}\n```\n\nError! The generic type variables in myClass and\
    \ myInterface must have same name\n\n# Generic Constructors\n\nIt is important\
    \ to remember that constructors are methods whose function is to create instances\
    \ (objects) of classes. As methods, they can be declared as generic. The class\
    \ itself can be either generic or non-generic.\n\nWe have already seen constructors\
    \ of generic classes in previous examples. Here is another example:\n\n```\nclass\
    \ GenericClass <T> {\n  public T key;\n  GenericClass(T k) {\n    this.key = k;\n\
    \  }\n}\n```\n\nGenericClass<Integer> g = new GenericClass<Integer>(123);\n\n\
    The above constructor is not generic. To be generic it should be accept generic\
    \ parameters different from those specified in the class declaration, like this:\n\
    \n```\nclass GenericClass <T> {\n  public T key;\n  public Object value;\n  GenericClass(T\
    \ k, X v) {\n    this.key = k;\n    this.value = v;\n  }\n}\n```\n\nGenericClass<String>\
    \ g = new GenericClass<String>(123, \"test\");\n\nThe <X> in front of the constructor\
