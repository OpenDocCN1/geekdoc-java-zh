    \ can access | - | - | can access |\n\n## Determining the Type of an Object\n\n\
    When working with objects, sometimes it might not be clear what class an object\
    \ belongs to. For example, if class A is extended by classes B and C, an object\
    \ reference of type A can reference objects of classes A, B, and C:\n\n```\nA\
    \ obj;\nobj = new A(); // obj is a reference to an object of class A\nobj = new\
    \ B(); // obj is a reference to an object of class B\nobj = new C(); // obj is\
    \ now references an object of class C\n```\n\nAn object reference of type obj\
    \ can refer any object, of any class:\n\n```\nObject obj;\nobj = new String(\"\
    text\");\nobj = new Integer(123);\nobj = new MyClass();\n```\n\nSo, how can we\
    \ determine the real type of an object referred by a variable?\nThe answer is\
    \ – with the help of the instanceof operator.\n\nThe format of the instanceof\
    \ operator is:\n\n```\nobjectReference instanceof classType\n```\n\nExample:\n\
    \n```\nObject obj;\nobj = new String(\"text\");\nobj = new Date();\nif (obj instanceof\
    \ String) {\n    System.out.println(\"Object of type String\");\n}\nif (obj instanceof\
    \ Date) {\n    System.out.println(\"Object of type Date\");\n}\n```\n\n## Summary\n\
    \nHere is the summary of what we have learned thus far about the objects:\n\n\
    - Objects are instantiated (i.e. created) using the **new** statement, which has\
    \ the following format: `classNameNew constructor;`\n- A **constructor** is a\
    \ special method with the **same name as the class name** that is invoked automatically\
    \ by the JVM when an object of the class is being created.\n- The format of the\
    \ constructor is: **className(parameters) {body}** The **parameters** and **body**\
    \ are optional, the return type is omitted.\n- The constructor is invoked after\
    \ all instance declarations are processed and instance blocks (if present) are\
    \ executed.\n- A class can have several constructors with different **signatures**\
    \ (i.e. with different sequences of argument types)\n- An empty constructor (\
    \ **className()** ) is automatically created by Java when no constructors are\
    \ declared explicitly.\n- The default constructor ( **className()** ) will not\
    \ be created by the JVM if at least one explicitly declared constructor is present.\n\
    - A constructor can invoke another constructor of the same class by executing\
    \ the **this(parameters)**; as the **first statement** of the constructor’s body.\n\
    - Instance variables can be referenced in a constructor via **“this”** keyword\
    \ as follows: **this.variableName**\n- The keyword **“super”** represents a class\
    \ (parent) of a subclass (child) and can be used in the constructor of a subclass\
    \ to invoke the superclass constructors - **super(parameters)**; to access the\
    \ superclass instance variables - **super.variable;**, and to call the superclass\
    \ methods **super.method()**.\n- A class and its subclass can declare instance\
    \ variables with the same names. The **object casting** mechanism should be used\
    \ if we want to access non-unique instance variables of a superclass from a subclass:\n\
    \n```\n((superclass) subclassObject).x\n// points to variable x of superclass\n\
    ```\n\nA superclass and its subclasses can declare instant methods with same signatures\
    \ (names and parameter list). The method overriding mechanism makes sure that\
    \ proper method is instantiated when an object is created.\n\nThe instanceof operator\
    \ checks if an object belongs to specified class.\n\n## Type Wrappers\n\nThe usage\
    \ of primitive data types has its limitations. Many of the data structures operate\
    \ on objects. For example, you cannot construct a set of integers (a set is a\
    \ collection of objects with distinct values which will be discussed later in\
    \ the book). That's why Java provides type wrappers – classes that encapsulate\
    \ a primitive type within an object. There is one wrapper for each primitive type:\n\
    \nDouble, Float, Long, Integer, Short, Byte, Character, and Boolean.\n\nEach of\
    \ the above classes offers a wide range of methods (most of them static) allowing\
    \ various manipulations over the underlying primitive type including the conversions\
    \ between different primitive types.\n\nExample:\n\n```\nInteger N = Integer.valueOf(10);\
    \ // N is an Integer object\nint n = N.intValue();\ndouble d = N.doubleBinaryString(n);\n\
    String s = Integer.toString(n);\nSystem.out.println(\"n=\" + n + \" d=\" + d +\
    \ \" s=\" + s);\n```\n\nThe output of this program is \"n=10 d=10.0 s=1010\".\n\
    \n## Autoboxing\n\nIn JDK5, Java introduced the autoboxing/auto-unboxing feature.\
    \ Autoboxing automatically creates a type wrapper object and encapsulates a primitive\
    \ type into it when an object of that type is needed. Auto-unboxing is the reverse\
    \ process; it retrieves a primitive type from a type wrapper object when it is\
    \ needed.\n\nExample:\n\n```java\nclass testwrapper {\n    public static double\
    \ test(Integer N) {return N;}\n    public static void main(String args[]) {\n\
    \        int n = 123;\n        double d = test(n);\n        System.out.println(\"\
    d=\" + d); // prints: d=123.0\n    }\n}\n```\n\n## Strings\n\nIn Java, a sequence\
    \ of characters is represented by the class String. The String class is a regular\
    \ class, and can be handled as such. However, due to its extensive usage, Java\
    \ added some convenient features that make handling of strings more intuitive.\
    \ In this chapter, we will review all the special features of the String class.\n\
    \n## String Literals, Creating Strings\n\nThe string literal is a sequence of\
    \ characters enclosed within double quotes:\n\"First line of a string literal.\
    \ \\n second line.\"\n\nString literals can be used to create String objects directly:\n\
    \n```java\nString s1 = new String();\ns1 = \"text\";\nString s2 = new String(\"\
    text\");\nString s3 = \"text\";\n```\n\nAs you can see in this example, a String\
    \ object can be created without using the new operator - just direct assignment\
    \ of a string literal to a String variable. This might look strange at first,\
    \ but there is a simple explanation:\n\n> A stand-alone string literal in Java\
    \ is an object of class String.\n\nEach unique string literal Java creates one\
    \ object that can be referenced by different object variables. The new operator,\
    \ on the other hand, always creates a new object regardless of the literal value\
    \ passed to the constructor:\n\n```\nString s1 = new String(\"text\"); -> String\
    \ object \"text\"\nString s2 = new String(\"text\"); -> String object \"text\"\
    \nString s3 = \"text\";             -> String object \"text\"\nString s4 = \"\
    text\";             ->\n```\n"
  mdcn: "\n\n此表总结了父类和子类实例变量的可访问性：\n\n| 对象引用 | 类 Parent | 类 Child extends Parent |\n\
    | --- | --- | --- |\n| | 实例变量 | 实例变量 |\n| | 独有的 | 与 Child 中的相同 | 独有的 | 与 Parent\
    \ 中的相同 |\n| | Parent p1 = new Parent() | | |\n| p1. | 可以访问 | 可以访问 | - | - |\n\
    | | Parent p2 = new Child() | | |\n| ((Child) p2). | 可以访问 | 可以访问 | 可以访问 | 可以访问\
    \ |\n| | Child c = new Child() | | |\n| c. | 可以访问 | 可以访问 | 可以访问 |\n| ((Parent)\
    \ c). | 可以访问 | 可以访问 | - | - |\n| super. | 可以访问 | 可以访问 | - | - |\n\n## 方法重写 (Method\
    \ Overriding)\n\n方法重写是一种特殊机制，允许在父类及其任何子类中声明具有具有相同签名（名称和参数类型）的实例方法。\n此表展示了访问父类和子类实例方法的不同方式。请注意，对象强制转换并不会让你从子类访问父类的被重写方法。一旦创建了子类对象，每个重写方法只有子类的实例是可访问的。\n\
    \n| 对象引用 | 类 Parent 实例方法（独有 | 重写） | 类 Child extends Parent 实例方法（独有 | 重写） |\n|---|---|---|---|---|---|\n\
    | p1. | 可以访问 | - | - | - |\n| p2. ((Child) p2). | 可以访问 | 可以访问 | 可以访问 | 可以访问 |\n\
    | Child c = new Child() | 可以访问 | - | 可以访问 | 可以访问 |\n| c. super. | 可以访问 | 可以访问\
    \ | - | - |\n| ((Parent) c). | 可以访问 | - | - | 可以访问 |\n\n## 确定对象的类型\n\n在处理对象时，有时可能不清楚对象属于哪个类。例如，如果类\
    \ A 被类 B 和 C 继承，类型为 A 的对象引用可以引用 A、B 和 C 类的对象：\n\n```\nA obj;\nobj = new A(); //\
    \ obj 是指向 A 类对象的引用\nobj = new B(); // obj 是指向 B 类对象的引用\nobj = new C(); // obj\
    \ 现在指向 C 类对象的引用\n```\n\n类型为 obj 的对象引用可以引用任何类的任何对象：\n\n```\nObject obj;\nobj =\
    \ new String(\"text\");\nobj = new Integer(123);\nobj = new MyClass();\n```\n\n\
    那么，我们如何确定变量所指对象的真实类型呢？\n答案是——借助 `instanceof` 运算符。\n\n`instanceof` 运算符的格式为：\n\n\
    ```\nobjectReference instanceof classType\n```\n\n示例：\n\n```\nObject obj;\nobj\
    \ = new String(\"text\");\nobj = new Date();\nif (obj instanceof String) {\n \
    \   System.out.println(\"Object of type String\");\n}\nif (obj instanceof Date)\
    \ {\n    System.out.println(\"Object of type Date\");\n}\n```\n\n## 总结\n\n以下是我们目前为止学到的对象的总结：\n\
    \n- 使用 **new** 语句实例化（即创建）对象，其格式为：`classNameNew constructor;`\n- **构造函数** 是一种特殊方法，其**名称与类名相同**，在创建该类的对象时，JVM\
    \ 会自动调用它。\n- 构造函数的格式为：**className(parameters) {body}**。**parameters**和**body**是可选的，返回类型被省略。\n\
    - 构造函数在所有实例声明处理完毕且实例块（如果有）执行后被调用。\n- 一个类可以有多个不同**签名**（即具有不同参数类型序列）的构造函数。\n- 当没有显式声明构造函数时，Java\
    \ 会自动创建一个空构造函数（**className()**）。\n- 如果存在至少一个显式声明的构造函数，JVM 将不会创建默认构造函数（**className()**）。\n\
    - 构造函数可以通过在体体的**第一条语句**执行 **this(parameters)** 来调用同一类的另一个构造函数。\n- 在构造函数中可以通过 **“this”**\
    \ 关键字引用实例变量，如下：**this.variableName**\n- 关键字 **“super”** 代表子类（子）的类（父），可以在子类的构造函数中使用它来调用父类构造函数——**super(parameters)**；访问父类实例变量——**super.variable;**；以及调用父类方法\
    \ **super.method()**。\n- 类及其子类可以声明具有相同的实例变量名称（具有相同名称的实例变量）。如果我们想从子类访问父类的非独有实例变量，应使用**对象强制转换**机制：\n\
    \n```\n((superclass) subclassObject).x\n// 指向父类的变量 x\n```\n\n父类及其子类可以声明具有相同签名（名称和参数列表）的实例方法。方法重写机制确保了在创建对象时实例化了正确的方法。\n\
    \n`instanceof` 运算符检查对象是否属于指定的类。\n\n## 类型包装类 (Type Wrappers)\n\n基本数据类型的使用有其局限性。许多数据结构是对对象的操作。例如，你不能构建一个整数集合（集合是具有不同值的对象的集合，将在书后部分讨论）。这就是为什么\
    \ Java 提供了类型包装类——将基本类型封装在对象中的类。每个基本类型都有一个对应的包装类：\n\nDouble, Float, Long, Integer,\
    \ Short, Byte, Character 和 Boolean。\n\n上述每个类都提供了一系列方法（大部分是静态的），允许对底层基本数据类型进行各种操作，包括不同基本数据类型之间的转换。\n\
    \n示例：\n\n```\nInteger N = Integer.valueOf(10); // N 是一个 Integer 对象\nint n = N.intValue();\n\
    double d = N.doubleBinaryString(n);\nString s = Integer.toString(n);\nSystem.out.println(\"\
    n=\" + n + \" d=\" + d + \" s=\" + s);\n```\n\n该程序的输出是 \"n=10 d=10.0 s=1010\"\
    。\n\n## 自动装箱 (Autoboxing)\n\n在 JDK5 中，Java 引入了自动装箱/自动拆箱功能。自动装箱在需要该类型的对象时，自动创建一个类型包装对象并将基本类型封装其中。自动拆箱是相反的过程；当需要时从类型包装对象中获取基本类型。\n\
    \n示例：\n\n```java\nclass testwrapper {\n    public static double test(Integer N)\
    \ {return N;}\n    public static void main(String args[]) {\n        int n = 123;\n\
    \        double d = test(n);\n        System.out.println(\"d=\" + d); // 打印: d=123.0\n\
    \    }\n}\n```\n\n## 字符串 (Strings)\n\n在 Java 中，字符序列由 `String` 类表示。`String` 类是一个普通类，可以像普通类一样处理。然而，由于其广泛的使用，Java\
    \ 增加了一些方便的特性，使字符串处理更加直观。在本章中，我们将回顾 `String` 类的所有特殊特性。\n\n## 字符串字面量，创建字符串\n\n字符串字面量是包含在双引号内的字符序列：\n\
    \"First line of a string literal. \\n second line.\"\n\n字符串字面量可以直接用于创建 `String`\
    \ 对象：\n\n```java\nString s1 = new String();\ns1 = \"text\";\nString s2 = new String(\"\
    text\");\nString s3 = \"text\";\n```\n\n如此示例所示，无需使用 `new` 运算符即可创建 `String` 对象——只需将字符串字面量赋值给\
    \ `String` 变量。这初看起来可能很奇怪，但有一个简单的解释：\n\n> Java 中独立的字符串字面量是 `String` 类的对象。\n\nJava\
    \ 为每个唯一的字符串字面量创建一个对象，该对象可以被不同的对象变量引用。另一方面，无论传递给构造函数的字面值是什么，`new` 运算符总是创建一个新对象：\n\
    \n```\nString s1 = new String(\"text\"); -> String 对象 \"text\"\nString s2 = new\
    \ String(\"text\"); -> String 对象 \"text\"\nString s3 = \"text\";             ->\
    \ String 对象 \"text\"\nString s4 = \"text\";             ->\n```\n\n"
