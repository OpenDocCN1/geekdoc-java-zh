    ```\n\n# Synchronization\n\nIn multithreaded programming, it is often critical\
    \ to restrict the access to shared resources to only one thread at a time. Java\
    \ offers a resource locking mechanism that can be employed in two ways – synchronized\
    \ methods or synchronized blocks. Both approaches will be discussed in a few moments.\n\
    \nFirst, to understand Java's synchronization and locking mechanism we need to\
    \ know two key terms: the monitor and the lock. When a thread acquires the lock,\
    \ it is said to have entered the monitor. This does not add much to the understanding\
    \ of the topic itself, but is important because these terms are used in all Java\
    \ manuals.\n\n## Synchronized Methods\n\nYou can declare any method of your class\
    \ as synchronized:\n`synchronized static public void method1() {...}`\n`synchronized\
    \ public void method2() {...}`\n\nBy doing so, you activate the locking mechanism\
    \ either on the class level, or on the object level, or both.\n\nThe object-level\
    \ synchronization works as follows:\n\n| All synchronized instance methods of\
    \ an object are controlled by the same lock. Only one synchronized instance method\
    \ of that object can be executed at any point in time. |\n\nThe class-level synchronization\
    \ works as follows:\n\n| All synchronized static methods of a class are controlled\
    \ by the same lock. Only one synchronized static method of the class can be executed\
    \ at any point in time. |\n\nNote that object-level synchronization and class-level\
    \ synchronization work independently of each other.\n\n## Synchronized Statement\
    \ Blocks\n\nThere might be situations when you cannot use the synchronized methods\
    \ such as when you're not allowed to modify the class. In such circumstances you\
    \ can use a synchronized statement block. Here is how a synchronized statement\
    \ block is defined:\n\n```\nsynchronized ( object ) { statement block }\n```\n\
    \nThis statement can be used anywhere in the thread execution path (i.e. in the\
    \ run() methods or any other methods called by it). The statement block will be\
    \ locked on the object and will be accessible only by one thread at a time.\n\n\
    An important note must be made regarding the object used in the above construct.\
    \ The object could be an object of any class, even a dummy object created just\
    \ for the purpose of being a lock. As long as all threads have access to the same\
    \ object – synchronization on the statement block will work.\n\nThe example below\
    \ demonstrates the usage of statement block synchronization.\n\nExample: only\
    \ one thread at a time execute the synchronized block\n\n```java\nimport java.io.IOException;\n\
    class testSyncBlock implements Runnable {\n    Object lock;\n    public static\
    \ void main(String[] args[]) {\n        testSyncBlock mainThread = new testSyncBlock();\n\
    \        mainThread.lock = new Object();\n\n        Thread th1 = new Thread(mainThread,\
    \ \"thread1\");\n        Thread th2 = new Thread(mainThread, \"thread2\");\n \
    \       th1.start();\n        th2.start();\n\n        try {\n            th1.join();\n\
    \            th2.join();\n        } catch (InterruptedException e) { System.out.println(e);\n\
    \    }\n\n    public void run() {\n        String name = Thread.currentThread().getName();\n\
    \        System.out.println(name + \" started\");\n\n        synchronized (lock)\
    \ {\n            try {\n                System.out.println(\"hit enter...\");\n\
    \                System.in.read();\n            } catch (Exception e) { System.out.println(e);\
    \ }\n        }\n    }\n}\n```\n\n## Advanced Inter-Thread Communication\n\nIn\
    \ most cases synchronized methods and synchronized statement blocks are sufficient\
    \ for establishing safe access to shared resources. However, there might be a\
    \ need for more granular control over the synchronization process. The following\
    \ three methods defined by the Object class allow two or more threads to communicate\
    \ with each other:\n\n```\nwait(), notify(), notifyAll()\n```\n\nThe wait() method\
    \ releases the lock held by the current thread and puts the thread in a waiting\
    \ state.\n\nThe notify() method wakes up the waiting threads (if any). The choice\
    \ of which thread to wake up is arbitrary. The notifyAll() method wakes up all\
    \ threads waiting on the lock. The above methods must be used within synchronized\
    \ methods or synchronized blocks. The example below illustrates how communication\
    \ is established. The program creates two threads, one at a time.\n\n```java\n\
    import java.io.IOException;\nclass testnotify implements Runnable {\n    Object\
    \ lock = new Object();\n    String[] s = {\"one\", \"two\", \"three\", \"four\"\
    };\n    int count = 0;\n\n    public static void main(String args[]) {\n     \
    \   testnotify me = new testnotify();\n\n        Thread th1 = new Thread(me, \"\
    thread1\");\n        Thread th2 = new Thread(me, \"thread2\");\n        th1.start();\n\
    \        th2.start();\n    }\n\n    public void run() {\n        String name =\
    \ Thread.currentThread().getName();\n        synchronized (lock) {\n         \
    \   try {\n                while (count < s.length) {\n                    System.out.println(name\
    \ + \": \" + s[count++]);\n                    lock.notify();\n              \
    \      lock.wait();\n                }\n            } catch (Exception e) { System.out.println(e);\
    \ }\n            lock.notifyAll();\n        }\n    }\n}\n```\n\nNote that the\
    \ wait(), notify(), and notifyAll() methods must be invoked by the object on which\
    \ the current thread is locked. Otherwise, the IllegalMonitorStateException would\
    \ be thrown.\n\nThe output of the above program is this:\nthread1: one\nthread2:\
    \ two\nthread1: three\nthread2: four\n\n# Collections Framework\n\nThe Collections\
    \ Framework is a set of interfaces and classes that provide a standardized approach\
    \ for managing groups of objects. The cornerstone of the whole concept is the\
    \ collection, a generic term for a set of objects grouped together by some means.\
    \ Based on the way collections are built and accessed, all collections can be\
    \ divided into three major categories:\n\n- LIST - a sequence of objects; examples:\
    \ arrays, sorted lists, queues, stacks.\n- SET - a group of unique objects; no\
    \ duplicates allowed.\n- MAP - a group of key/value pairs of objects.\n\nEach\
    \ group can be divided further into sub-groups. For example, a list could be sorted,\
    \ linked, organized as a stack, etc. However, regardless of the differences between\
    \ collections, most of the operations upon them are performed in a similar manner,\
    \ through standardized interfaces. This chapter provides an overview of such operations.\n\
    \n## Creating Collections\n\nMost of the collections use the add() method of the\
    \ corresponding class for putting new elements into collections:\n\n```java\n\
    // Create a LinkedList collection\nLinkedList<String> list = new LinkedList<String>();\n\
    list.add(\"A\");\nlist.add(\"B\");\nlist.add(1,\"C\");\nSystem.out.println(list);\
    \ // prints: [A, C, B]\n```\n"
  mdcn: "\n\n# 等待线程死亡\n\n如果主线程依赖于子线程的执行，它可以使用 `Thread` 类的 `join()` 方法来“连接”子线程并等待其执行完成。\n\
    \n```\nThread th = new Thread(new myClass());\nth.start();\n\ntry {\n    th.join(1000);\n\
    \    th.join();\n} catch (InterruptedException e) {\n    System.out.println(\"\
    Exception: \" + e);\n}\n```\n\n# 同步\n\n在多线程编程中，限制对共享资源的访问一次只能有一个线程通常是至关重要的。Java\
    \ 提供了一种资源锁定机制，可以通过两种方式使用——同步方法（synchronized methods）或同步块（synchronized blocks）。我们将在稍后分别讨论这两种方法。\n\
    \n首先，为了理解 Java 的同步和锁定机制，我们需要了解两个关键术语：监视器（monitor）和锁（lock）。当一个线程获取锁时，被称为进入了监视器。这对于理解主题本身帮助并不太大，但非常重要，因为这些术语出现在所有的\
    \ Java 手册中。\n\n## 同步方法\n\n你可以将类中的任何方法声明为同步：\n`synchronized static public void\
    \ method1() {...}`\n`synchronized public void method2() {...}`\n\n通过这种方式，你可以在类级别、对象级别或两者级别上激活锁定机制。\n\
    \n对象级别的同步工作方式如下：\n\n| 一个对象的所有同步实例方法都由同一把锁控制。在任何时刻，该对象只能执行一个同步实例方法。 |\n\n类级别的同步工作方式如下：\n\
    \n| 一个类中的所有同步静态方法都由同一把锁控制。在任何时刻，该类只能执行一个同步静态方法。 |\n\n请注意，对象级别的同步和类级别的同步是互不影响的。\n\
    \n## 同步语句块\n\n在某些情况下，你可能无法使用同步方法，例如当你不允许修改类时。在这种情况下，你可以使用同步语句块。同步语句块的定义如下：\n\n\
    ```\nsynchronized ( object ) { statement block }\n```\n\n该语句可以用于线程执行路径中的任何地方（即在\
    \ `run()` 方法或其调用的任何其他方法中）。语句块将在对象上锁定，并且一次只能被一个线程访问。\n\n关于上述结构中使用的对象，必须说明一点：该对象可以是任何类的对象，即使是仅仅为了作为锁而创建的虚拟对象。只要所有线程都能访问同一个对象——语句块的同步就能正常工作。\n\
    \n下面的示例演示了语句块同步的使用。\n\n示例：一次仅有一个线程执行同步块\n\n```java\nimport java.io.IOException;\n\
    class testSyncBlock implements Runnable {\n    Object lock;\n    public static\
    \ void main(String[] args[]) {\n        testSyncBlock mainThread = new testSyncBlock();\n\
    \        mainThread.lock = new Object();\n\n        Thread th1 = new Thread(mainThread,\
    \ \"thread1\");\n        Thread th2 = new Thread(mainThread, \"thread2\");\n \
    \       th1.start();\n        th2.start();\n\n        try {\n            th1.join();\n\
    \            th2.join();\n        } catch (InterruptedException e) { System.out.println(e);\n\
    \    }\n\n    public void run() {\n        String name = Thread.currentThread().getName();\n\
    \        System.out.println(name + \" started\");\n\n        synchronized (lock)\
    \ {\n            try {\n                System.out.println(\"hit enter...\");\n\
    \                System.in.read();\n            } catch (Exception e) { System.out.println(e);\
    \ }\n        }\n    }\n}\n```\n\n## 高级线程间通信\n\n在大多数情况下，同步方法和同步语句块已经足够建立对共享资源的安全访问。然而，可能需要对同步过程进行更细粒度的控制。`Object`\
    \ 类定义的以下三个方法允许两个或多个线程之间进行通信：\n\n```\nwait(), notify(), notifyAll()\n```\n\n`wait()`\
    \ 方法会释放当前线程持有的锁并将线程置于等待状态。\n\n`notify()` 方法会唤醒等待的线程（如果有的话）。唤醒哪个线程是随机的。`notifyAll()`\
    \ 方法会唤醒所有等待锁的线程。上述方法必须在同步方法或同步块内部。下面的示例说明了如何建立通信。该程序创建了两个线程，一个接一个。\n\n```java\n\
    import java.io.IOException;\nclass testnotify implements Runnable {\n    Object\
    \ lock = new Object();\n    String[] s = {\"one\", \"two\", \"three\", \"four\"\
    };\n    int count = 0;\n\n    public static void main(String args[]) {\n     \
    \   testnotify me = new testnotify();\n\n        Thread th1 = new Thread(me, \"\
    thread1\");\n        Thread th2 = new Thread(me, \"thread2\");\n        th1.start();\n\
    \        th2.start();\n    }\n\n    public void run() {\n        String name =\
    \ Thread.currentThread().getName();\n        synchronized (lock) {\n         \
    \   try {\n                while (count < s.length) {\n                    System.out.println(name\
    \ + \": \" + s[count++]);\n                    lock.notify();\n              \
    \      lock.wait();\n                }\n            } catch (Exception e) { System.out.println(e);\
    \ }\n            lock.notifyAll();\n        }\n    }\n}\n```\n\n注意，`wait()`、`notify()`\
    \ 和 `notifyAll()` 方法必须由当前线程锁定的对象进行调用。否则将抛出 `IllegalMonitorStateException`。\n\n\
    上述程序的输出如下：\nthread1: one\nthread2: two\nthread1: three\nthread2: four\n\n# 集合框架\
    \ (Collections Framework)\n\n集合框架是一组为管理对象组提供标准方法的接口和类。概念的核心是集合（collection），它是通过某种方式组合在一起的对象的通用术语。根据构建和访问集合的方式，所有集合可以分为三大类：\n\
    \n- LIST（列表）：对象的序列；例如：数组、排序列表、队列、栈。\n- SET（集合）：唯一对象组；不允许重复。\n- MAP（映射）：对象的键值对组。\n\
    \n每个组都可以可以进一步细分为子组。例如，列表可以是排序的、链式的、组织成栈等的。然而，无论集合之间的差异如何，对它们的大多数操作都是通过标准接口以相似的方式执行。本章提供了这些操作的概述。\n\
    \n## 创建集合\n\n大多数集合都使用相应类的 `add()` 方法将新元素放入集合中：\n\n```java\n// 创建 LinkedList 集合\n\
    LinkedList<String> list = new LinkedList<String>();\nlist.add(\"A\");\nlist.add(\"\
    B\");\nlist.add(1,\"C\");\nSystem.out.println(list); // 输出: [A, C, B]\n```\n"
