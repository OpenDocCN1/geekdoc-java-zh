    # Multi-Dimensional Arrays


    The easiest way to explain how the multi-dimensional arrays are created by reviewing
    an example. Let''s say we want to create the following two-dimensional array:


    | Column 1 | Column 2 | Column 3 |

    |---|---|---|

    | Row 1 | 1 | 2 |

    | Row 2 | 10 | 11 | 12 |


    Using an array initializer, the above array can be created with this statement:

    ```

    int [][] N = { {1, 2}, {10, 11, 12} };

    ```


    The array will consist of five elements and the values to the array elements will
    be assigned as:


    ```

    N [][0] = 1;

    N [][1] = 2;

    N [][2] // element does not exist

    N [1][0] = 10;

    N [1][1] = 11;

    N [1][2] = 10;

    ```


    We can also create this multi-dimensional array using the new statement:


    ```

    int [][] N;

    N = new int[2][3]; // the 2x3 array created is 2 by 3 table with 6 elements.

    ```


    However, the result of the above code is 2 by 6 elements. To get rid of the N[0][2]
    element, we need to rewrite the code:


    ```

    int [][] N;

    N = new int[2][]; // two columns with undefined number of rows

    N [0] = new int[2]; // first row will contain 2 columns

    N [1] = new int[3]; // second row will contain 3 columns

    ```'
