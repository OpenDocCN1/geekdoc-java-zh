    # Data Types, Variables, and Literals


    The Object-Oriented Design discussion gave us an idea of how the Java language
    is different from other, “traditional” languages. Now let''s look at the features
    making Java similar to non-object-oriented languages.


    Most languages, including Java, have the following in common:


    +   - ability to manipulate primitive data types

    - variables and literals

    - a fixed set of operators

    - language constructs and statements for controlling the program flow


    In this chapter we will review the primitive data types, variables, and literals.
    The rest will be covered in later chapters.


    # Primitive Data Types


    A primitive data type (could be also referred to as simple or atomic type) is
    a data type that is not formed by combining other data types. For example, a string
    is not a primitive data type because it is defined as a set of elements of the
    character data type.


    Java defines eight primitive data types:


    | Date Type | Description | Length in bits | Range (approximate) |

    |---|---|---|--|

    | byte | Signed Integer Number | 8 | -128 to +127 |

    | short | Signed Integer Number | 16 | -32,768 to +32,767 |

    | int | Signed Integer Number | 32 | -2.1*10^9 to +2.1*10^9 |

    | long | Signed Integer Number | 64 | -9.2*10^18 to +9.2*10^18 |

    | float | Floating Point Number | 32 | ± (1.4e-45 to 3.4e+38) |

    | double | Floating Point Number | 64 | ± (4.9e-32 to 1.8e+308) |

    | char | Unicode Character | 16 | 0 to 65,536 |

    | boolean | | N/A | true or false |


    Note: Java does not reveal the length of boolean data type because its implementation
    is platform-specific.'
  - '[PAGE 20]


    # Variables


    In Java, data elements of primitive types can be declared either as literals or
    variables.


    A variable is a named reference to a location in memory where the data element
    of specified type resides. The format for declaring a variable is this:


    ```

    type identifier; // declares the variable identifier

    // of type type

    ```


    ```

    type identifier = value; // declares and assigns value

    // to variable identifier of type type

    ```


    Here are some examples of declaring primitive data types.


    ```

    int k; // "k" is a reference to a 32-bit area in memory

    // will hold an integer value

    ```


    ```

    k = 100; // The above memory is populated with a 32-bit

    // signed binary number (100)

    ```


    ```

    char c = ''A''; // "c" is a reference to the two-byte Unicode

    // character ''A''

    ```


    Note, that variables can reference not only the primitive data types, objects
    as well.


    # Accessing the Variables


    At high level, you can view every Java program as blocks of code. Each block is
    surrounded by curly brackets: { statements }. Blocks can be separate or in each
    other:


    ```

    { block 1 }

    { block 2 { block 3 } }

    ```


    This structure determines the accessibility, also referred to as scope, of variables.
    A variable declared in a block is accessible within that block and within all
    included blocks. Once program flow reaches the end of a block all variables declared
    within that block are destroyed.'
