    # What can we do with annotations?


    Before answering this question, we need to review the lifecycle of the Java program,
    which can be broken into four stages:


    +   - Source code

    - Compilation

    - Byte code

    - Execution (run time)


    The initial question needs to be broken down for each stage: “What can we do with
    annotations in the source code, during compilation, while in byte code, and at
    the run time?


    As we have already seen, the source code contains the annotation declarations.
    From the programmer’s standpoint, not much can be discussed here except the specifics
    of the declaration syntax, which will be covered later.


    The next stage is compilation. The compiler interprets the annotation declarations
    and creates proper Java objects, but does the compiler do anything else with annotations?
    The answer is yes - there is a set of predefined (i.e. built-in) annotations,
    which serve as instructions to the compiler. They are all defined in the java.lang.annotation
    package:


    ```

    @Retention

    @Target

    @Inherited

    @Override

    @SuppressWarnings

    @Deprecated

    @SafeVarargs

    @Repeatable

    @FunctionalInterface

    ```


    As all the annotations, the pre-defined annotations should precede the annotated
    declaration (or another annotation). For example, the following code will instruct
    the compiler to check if the someMethod() is indeed an override of the same method
    of the superclass. If the superclass of the current class does not declare the
    someMethod(), a compile-time error will occur.


    ```

    @Override

    public void myMethod() {...}

    ```'
