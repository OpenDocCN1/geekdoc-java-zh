    # Boolean Logical Operators


    The Boolean logical operators are similar to the bitwise logical operators. Both
    apply the logical AND, OR, XOR, and XOR to two operands to produce Boolean results,
    but the bitwise logical operators act on bits, while the Boolean logical operators
    act on Boolean values.


    In addition to "regular" four logical operators (AND, OR, XOR, NOT), Java provides
    two "improved" Boolean operators – **short-circuit OR** and **short-circuit AND**.
    They will be explained later in this section.


    The following table lists the Boolean logical operators:


    | Operator | Performed Function | Type of operator |

    | --- | --- | --- |

    | ! | Logical unary NOT | Regular logical operator |

    | & | Logical AND | |

    | | | Logical OR | |

    | ^ | Logical exclusive OR (XOR) | |

    | || | Short circuit OR | Short-Circuit operator |

    | && | Short circuit AND | |


    As same with the bitwise operators, the Boolean logical operators (with the exception
    of the unary NOT operator and can be combined with the assignment operator to
    form the shorthand as follows:


    ```

    a &= b;   // This is equivalent to a = a & b;

    a |= b;   // This is equivalent to a = a | b;

    a ^= b;   // This is equivalent to a = a ^ b;

    ```


    The Boolean logical operators (&), (|), (^), and (!) apply the logical AND, OR,
    XOR, and NOT to two Boolean operands of an expression. The table below shows the
    results of Boolean logical operators for all possible combinations of two Boolean
    operators:


    | Logical operators: | AND | OR | XOR | NOT |

    | Operand A | Operand B | A & B | A | B | A ^ B | !A |

    | --- | --- | --- | --- | --- | --- | --- |

    | True | True | True | True | False | False |

    | True | False | False | True | True | False |

    | False | True | False | True | True | False |

    | False | False | False | False | False | True |'
  - '[PAGE 31]


    The short-circuit operators (&&) and (||) do not evaluate the right-hand operand
    of a logical expression when the value of the left-hand operand determines the
    result regardless of the value of another operand. For example, if A=true, the
    result of A | B is always true, no matter what B value is.


    Examples:


    ```

    boolean a, b, c;

    a = true;

    b = true;


    a = !b; // a=false

    a &= b; // a=false (same as: a = a & b)

    a |= b; // a=true (same as: a = a | b)

    a ^= b; // a=false (same as: a = a ^ b)

    a = a ^ b; // a=false

    ```


    ```

    // short-circuit operators

    a = false;

    b = true;

    c = a || b; // c=true (a and b both will be evaluated)

    c = b || a; // c=true (a will not be evaluated)

    c = a && b; // c=false (b will not be evaluated)

    ```'
  - '[PAGE 32]


    # Conditional Operator


    Java provides a special ternary (three-way) conditional operator "?::...", that
    allows for compact implementation of some IF-THEN-ELSE statements. The format
    of the "?::..." operator is this:


    ```

    variable = logical_expression ? expression1 : expression2

    ```


    The logical_expression is any expression that evaluates to a Boolean value. If
    it evaluates to true, expression1 is evaluated and assigned to variable; otherwise,
    expression2 is evaluated and assigned to variable. This can be shown in pseudo-code
    as:


    ```

    IF logical_expression = true


    THEN variable = value of expression1

    ELSE variable = value of expression2

    ```


    Example 1:


    ```

    int x = -1;

    int y = -1;

    y = x > 0 ? x : -x; // x = -1; y = +1

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_32_0.png)


    Example 2:


    ```

    int x = -1;

    int y = -1;

    y = x > 0 ? x : -(x = x + y); // x = -2; y = +2

    ```


    ![](img/7ffd006441be7e70bb67929dee89a427_32_1.png)


    In the second example, the x = x + y expression is executed first resulting in
    x=-2. Then, expression -(-2) evaluates to +2 and this value is assigned to y.'
