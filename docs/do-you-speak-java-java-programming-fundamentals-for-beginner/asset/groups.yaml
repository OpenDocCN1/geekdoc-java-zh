  - "[PAGE 132]\n\n# Spliterator\n\nThe newest type of iterator added in JDK 8 is\
    \ the Spliterator interface. It was designed for traversing collections or other\
    \ sources of data elements and optionally partitioning them for parallel processing.\
    \ We said \"collections or other sources elements of data elements\" because the\
    \ Spliterator can be created not only for collections, but also for arrays, I/O\
    \ channels, or generator functions.\n\nNote that Spliterator consumes the source.\
    \ A new Spliterator must be created once all the elements of the source are processed.\n\
    \nIn the below example we create a spliterator for an array of integers, split\
    \ it in two, and calculate the sum of all values stored in the array.\n\n```\n\
    import java.util.*;\nclass testSpliterator {\n    static int total = 0;\n\n  \
    \  public static void sum(Integer i) { total += i; }\n\n    public static void\
    \ main(String[] args) {\n        Integer[] integers = {1, 2, 3, 4};\n        Spliterator<Integer>\
    \ sp1 = Arrays.spliterator(integers);\n        Spliterator<Integer> sp2 = sp1.trySplit();\n\
    \        while (sp1.tryAdvance(i -> total += i));\n        if (sp2 != null) {\n\
    \            while (sp2.tryAdvance(i -> sum(i)));\n        }\n        System.out.println(\"\
    Total=\" + total); // prints: Total=10\n    }\n}\n```\n\nPay attention to the\
    \ tryAdvance() method. It checks if the next element of the source is present,\
    \ and if not - returns the boolean false. Otherwise it executes the accept() method\
    \ of the functional interface Consumer and returns the true. We substitute the\
    \ accept() method via two different lambda expressions: \"i -> total += i\" and\
    \ \"i -> sum(i)\".\n\nNote that the while statements have no body (however, they\
    \ could) because all the processing is done though the lambda expressions."
- md: "\n# Comparator\n\nAny ordered collection (e.g. TreeSet) needs to have some\
    \ kind of compare algorithm to determine which element of the collection is “greater”\
    \ than the other. In fact, there are default algorithms for each type of objects\
    \ that can be stored in ordered collections. These algorithms are implemented\
    \ via the Comparator functional interface that defines the compare() method. In\
    \ case we want to alter the default sequence of objects in a collection, we can\
    \ build a collection that points to a custom comparator.\n\nNote that the Comparator\
    \ can be used to provide an ordering for collections of objects that do not have\
    \ a natural ordering.\n\nThe example below shows how to create a custom comparator\
    \ to sort an array of integers descending.\n\n```java\nimport java.util.*;\nclass\
    \ testComparator {\n    public static int reverse(Integer n1, Integer n2) {\n\
    \        return n1;\n    }\n    public static void main(String args[]) {\n   \
    \     Integer[] nn = { 1, 2, 3 };\n        Arrays.sort(nn, (n1, n2) -> reverse(n1,\
    \ n2));\n        System.out.println(nn[0] + \" , \" + nn[1] + \" , \" + nn[2]);\n\
    \    }\n}\n```\n\n> The reverse(n1,n2) substitutes the compare() method of the\
    \ interface Comparator.\n\nThe output of this program will be “3,2,1”.\n\nNote:\
    \ The Arrays class define several sort methods; we’ve used one:\n\n```java\nstatic\
    \ void sort(T[] a, comparator<? super T> c)\n```\n\nHere is how it is executed:\n\
    \n- T becomes the first operand T\n- The integers array substitutes the first\
    \ (n1, n2) -> reverse (n1, n2) is transformed into an object of the Comparator<Integer>\
    \ functional interface, whose compare() method is implemented as { reverse (n1,\
    \ n2); }\n- During the sorting, reverse() is used in determining which one of\
    \ two integers is greater, as follows:\n\n```\nn1>n2 : result>0; n1<n2 : result<0;\
    \ n1=n2 : result=0\n```\n\n# I/O Streams\n\nA stream is an abstract representation\
    \ of an input, where source data is retrieved from, or an output, where destination\
    \ data is sent to. Java recognizes two types of streams – byte streams and character\
    \ streams. The byte streams should be used for sending or receiving binary objects,\
    \ and the character streams should be used when working with characters and the\
    \ “character” representation of data is needed.\n\nNote that the transmission\
    \ of data via byte or character streams is done one or one character at a time.\
    \ There are buffered streams that group the data into buffers, but those streams\
    \ are still based on the underlying byte or character streams.\n\nThis chapter\
    \ provides an overview of the concept behind streams and illustrates the usage\
    \ of some input and output streams.\n\n# Byte Output Streams\n\nImagine that an\
    \ application generates the following types of data and wants to write them out\
    \ into a file:\n\nOne way to accomplish this would be by creating different classes\
    \ for each type of input data, but Java’s approach to this task is by building\
    \ a “chain” of streams, each performing necessary data transformation and passing\
    \ the result to the next stream:\n\nThe FileOutputStream class provides several\
    \ methods for writing data out into files. For example, it defines the method\
    \ `write(byte[] b)` that writes the specified array of bytes to a file. If we\
    \ had a ready array, we could use this method as follows:\n\n```java\nbyte[] b\
    \ = {97, 98, 99};\nFileOutputStream fileout;\nfileout = new FileOutputStream(\"\
    myfile.txt\");\nfileout.write(b);\n```\n\nHowever, class FileOutputStream does\
    \ not deal with primitive data types (double, float, int, etc.). So in order to\
    \ write a double number, we need to engage the DataOutputStream class, which implements\
    \ the writeDouble method. DataOutputStream converts the received argument to an\
    \ array of bytes and passes each byte, one by one, to the underlying stream by\
    \ calling the **write** method of the underlying stream:\n\n```java\nDataOutputStream\
    \ dataout;\ndataout = new DataOutputStream(fileout);\n```\n\n| dataout will be\
    \ calling the fileout.write() method for each output byte. |\n| --- |\n\nNow,\
    \ we can call the writeDouble method of **DataOutputStream** that will convert\
    \ the double number to bytes and pass them to FileOutputStream via the **write**\
    \ method:\n\n```java\ndataout.writeDouble(123.4);\n```\n\nIn general, the chain\
    \ of streams is constructed from the bottom up:\n\n```java\nC c = new C();\nB\
    \ b = new B(c);\nA a = new A(b);\n// or just:\nA a = A(new B(c));\n```\n\nThe\
    \ data is passed between output streams as follows:\n\n| Object a: | Object b:\
    \ | Object c: |\n| --- | --- | --- |\n| a.write(...) | write(...) | write(...)\
    \ |\n| conversion | conversion | conversion |\n| b.write(...) | c.write(...) |\
    \ |\n\nIn order of this mechanism to work, the following requirements must be\
    \ met:\n\n- Each output stream must be a subclass of the class OutputStream and\
    \ has the constructor streamName (OutputStream)\n- Each output stream has to implement\
    \ the following methods defined in the OutputStream class:\n    - write(int i)\
    \ - mandatory\n    - write(byte[] b) - optional\n    - write(byte[] b, int offset,\
    \ int length) - for buffered outputs\n\nClasses in the output stream chain should\
    \ not extend each other; otherwise it would be not possible to call the write\
    \ method of the top class due to polymorphism.\n\nThere are quite a few byte output\
    \ streams, but reviewing all of them would not add much to the general understanding\
    \ of the concept of input/output streams, so we give you a single example of creating\
    \ a custom byte output stream.\n\n```java\n// Example of sending a double number\
    \ to custom myOutputStream\n// though DataOutputStream and BufferedOutputStream\n\
    ```\n\nimport java.io.*;\n\nclass myOutputStream extends OutputOutputStream {\n\
    \    public void write(int i) { }\n    public void write(byte[] b, int offset,\
    \ int len) {\n        System.out.println(\"Received \" + len + \" bytes\");\n\
    \    }\n}\n\nclass testOutputStream {\n    public static void main(String args[])\
    \ {\n        myOutputStream myout;\n        BufferedOutputStream bufout;\n   \
    \     DataOutputStream dataout;\n\n        try {\n            myout = new myOutputStream();\n\
    \            bufout = new BufferedOutputStream(myout);\n            dataout =\
    \ new DataOutputStream(bufout);\n            dataout.writeDouble(123.4);\n   \
    \         dataout.flush();\n        } catch (IOException e) {\n            System.out.println(\"\
    i/o error\");\n        }\n    }\n}\n```\n\nThe above program produces this output:\n\
    \n“Received bytes: 8”\n\n# Character Output Streams\n\nAll character data in Java\
    \ is represented in the Unicode format. The character output stream classes convert\
    \ Unicode characters into their local representation (e.g. ASCII format) before\
    \ sending them to output devices or other streams. Another function of the character\
    \ output streams is to generate a character representation of any primitive type,\
    \ as well as objects. This is implemented via the print and println methods of\
    \ the class PrintWriter. These methods are overloaded (i.e. there are multiple\
    \ versions of them) and can accept primitive data types, Strings, character arrays,\
    \ or objects.\n\nSimilar to the byte stream classes that extend the OutputStream\
    \ class, the character stream classes extend the Writer abstract class and its\
    \ write methods.\n\nThe following program uses two different character output\
    \ streams to write an array of characters into a file:\n\n```java\nimport java.io.*;\n\
    class testCharStreams {\n    public static void main(String args[]) {\n      \
    \  char[] c = {'a', 'b', 'c'};\n\n        FileWriter filewriter;\n        PrintWriter\
    \ printout;\n\n        try {\n            FileWriter fileout = new FileWriter(\"\
    write.txt\");\n            fileout.write(c, 0, 3);\n            fileout.flush();\n\
    \n            printout = new PrintWriter(\"print.txt\");\n            printout.println(123.4);\n\
    \            printout.flush();\n        } catch (IOException e) {\n          \
    \  System.out.println(\"I/o error\");\n        }\n    }\n}\n```\n"
  mdcn: "\n\n# 比较器 (Comparator)\n\n任何有序集合（例如 TreeSet）都需要某种比较算法来确定集合中的哪一个元素比另一个元素“大”。事实上，对于可以存储在有序集合中的每种类型的对象，都有默认的算法。这些算法通过\
    \ `Comparator` 泛式接口实现，该接口定义了 `compare()` 方法。如果我们想更改集合中对象的默认顺序，可以构建一个指向自定义比较器的集合。\n\
    \n请注意，`Comparator` 可以为没有自然排序的对象集合提供排序。\n\n下面的示例展示了如何创建一个自定义比较器来对整数数组进行降序排序。\n\n\
    ```java\nimport java.util.*;\nclass testComparator {\n    public static int reverse(Integer\
    \ n1, Integer n2) {\n        return n1;\n    }\n    public static void main(String\
    \ args[]) {\n        Integer[] nn = { 1, 2, 3 };\n        Arrays.sort(nn, (n1,\
    \ n2) -> reverse(n1, n2));\n        System.out.println(nn[0] + \" , \" + nn[1]\
    \ + \" , \" + nn[2]);\n    }\n}\n```\n\n> `reverse(n1,n2)` 替代了 `Comparator` 接口的\
    \ `compare()` 方法。\n\n该程序的输出将是“3,2,1”。\n\n注意：`Arrays` 类定义了几个排序方法；我们使用了其中一种：\n\n\
    ```java\nstatic void sort(T[] a, comparator<? super T> c)\n```\n\n以下是它的执行方式：\n\
    \n- T 变为第一个操作数 T\n- 整数数组替换了第一个；`(n1, n2) -> reverse (n1, n2)` 被转换为 `Comparator<Integer>`\
    \ 泛型接口的一个对象，其 `compare()` 方法实现为 `{ reverse (n1, n2); }`\n- 在排序过程中，使用 `reverse()`\
    \ 来确定两个整数中哪一个更大，如下：\n\n```\nn1>n2 : result>0; n1<n2 : result<0; n1=n2 : result=0\n\
    ```\n\n# 输入/输出流 (I/O Streams)\n\n流是输入的抽象表示，从那里检索源数据；或者是输出，向那里发送目标数据。Java 识别了两种类型的流——字节流（byte\
    \ streams）和字符流（character streams）。字节流应用于发送或接收二进制对象，而字符流应在处理字符且需要数据的“字符”表示时使用。\n\
    \n请注意，通过字节流或字符流传输数据是一次一个或多个字符完成的。存在缓冲流（buffered streams）可以将数据分组到缓冲区，但这些流仍然基于底层的字节流或字符流。\n\
    \n本章提供了流背后的概念概述，并说明了一些输入和输出流的使用。\n\n# 字节输出流 (Byte Output Streams)\n\n假设一个应用程序生成了以下类型的数据并希望将它们写入文件：\n\
    \n实现此目标的方法可以是为每种输入数据创建不同的类，但 Java 处理此任务的方法是构建一个流的“链”，每个流执行必要的数据转换并将结果传递给下一个流：\n\
    \n`FileOutputStream` 类提供了若干种将数据写入文件的方法。例如，它定义了 `write(byte[] b)` 方法，将指定的字节字节数组写入文件。如果我们已经有一个数组，可以如下所示使用该方法：\n\
    \n```java\nbyte[] b = {97, 98, 99};\nFileOutputStream fileout;\nfileout = new\
    \ FileOutputStream(\"myfile.txt\");\nfileout.write(b);\n```\n\n然而，`FileOutputStream`\
    \ 类不处理原始数据类型（double, float, int 等）。因此，为了写入一个 double 类型数字，我们需要引入 `DataOutputStream`\
    \ 类，它实现了 `writeDouble` 方法。`DataOutputStream` 将接收到的参数转换为字节数组，并通过调用底层流的 **write**\
    \ 方法将每个字节逐个地传递给底层流：\n\n```java\nDataOutputStream dataout;\ndataout = new DataOutputStream(fileout);\n\
    ```\n\n| dataout 将为每个输出字节调用 fileout.write() 方法。 |\n| --- |\n\n现在，我们可以调用 **DataOutputStream**\
    \ 的 `writeDouble` 方法，它将 double 类型数字转换为字节并通过 **write** 方法将它们传递给 `FileOutputStream`：\n\
    \n```java\ndataout.writeDouble(123.4);\n```\n\n通常情况下，流的链是从底向上构建的：\n\n```java\n\
    C c = new C();\nB b = new B(c);\nA a = new A(b);\n// 或者直接：\nA a = A(new B(c));\n\
    ```\n\n数据在输出流之间的传递方式如下：\n\n| 对象 a: | 对象 b: | 对象 c: |\n| --- | --- | --- |\n| a.write(...)\
    \ | write(...) | write(...) |\n| 转换 | 转换 | 转换 |\n| b.write(...) | c.write(...)\
    \ | |\n\n为了使这种机制运行，必须满足以下要求：\n\n- 每个输出流必须是 `OutputStream` 类的子类，并具有 `streamName\
    \ (OutputStream)` 构造函数\n- 每个输出流必须实现 `OutputStream` 类定义的以下方法：\n    - write(int\
    \ i) - 强制性\n    - write(byte[] b) - 可选\n    - write(byte[] b, int offset, int\
    \ length) - 用于缓冲输出\n\n输出流链中的类不应互相继承；否则，由于多态性将无法调用顶层类的 `write` 方法。\n\n字节输出流有很多，但查看所有流对理解整体概念没有太大帮助，因此我们给出一个自定义字节输出流的示例。\n\
    \n```java\n// 发送 double 数字到自定义 myOutputStream\n// 使用 DataOutputStream 和 BufferedOutputStream\n\
    ```\n\nimport java.io.*;\n\nclass myOutputStream extends OutputOutputStream {\n\
    \    public void write(int i) { }\n    public void write(byte[] b, int offset,\
    \ int len) {\n        System.out.println(\"Received \" + len + \" bytes\");\n\
    \    }\n}\n\nclass testOutputStream {\n    public static void main(String args[])\
    \ {\n        myOutputStream myout;\n        BufferedOutputStream bufout;\n   \
    \     DataOutputStream dataout;\n\n        try {\n            myout = new myOutputStream();\n\
    \            bufout = new BufferedOutputStream(myout);\n            dataout =\
    \ new DataOutputStream(bufout);\n            dataout.writeDouble(123.4);\n   \
    \         dataout.flush();\n        } catch (IOException e) {\n            System.out.println(\"\
    i/o error\");\n        }\n    }\n}\n```\n\n上述程序产生输出：\n\n“Received bytes: 8”\n\n\
    # 字符输出流 (Character Output Streams)\n\nJava 中所有的字符数据都以 Unicode 格式表示。字符输出流类在将 Unicode\
    \ 字符发送到输出设备或其他流之前，将其转换为本地表示（例如 ASCII 格式）。字符输出流的另一个功能是生成任何原始类型的字符表示以及对象。这通过 `PrintWriter`\
    \ 类的 `print` 和 `println` 方法实现。这些方法是重载的（即有多个版本），并接受原始数据类型、字符串、字符数组或对象。\n\n类似于继承\
    \ `OutputStream` 类的字节流类，字符流类继承 `Writer` 抽象类及其 `write` 方法。\n\n下面的程序使用两种不同的字符输出流将字符数组写入文件：\n\
    \n```java\nimport java.io.*;\nclass testCharStreams {\n    public static void\
    \ main(String args[]) {\n        char[] c = {'a', 'b', 'c'};\n\n        FileWriter\
    \ filewriter;\n        PrintWriter printout;\n\n        try {\n            FileWriter\
    \ fileout = new FileWriter(\"write.txt\");\n            fileout.write(c, 0, 3);\n\
    \            fileout.flush();\n\n            printout = new PrintWriter(\"print.txt\"\
    );\n            printout.println(123.4);\n            printout.flush();\n    \
    \    } catch (IOException e) {\n            System.out.println(\"I/o error\");\n\
    \        }\n    }\n}\n```\n\n"
