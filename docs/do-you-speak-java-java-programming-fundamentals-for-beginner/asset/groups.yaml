    ```\n\n# Observable and Observers\n\nThe Observable class, together with the Observer\
    \ interface offers a simple mechanism of establishing communication between objects.\
    \ One object (observable object) can be watched (observed) by one or more other\
    \ objects (observers). When needed, the object being observed can notify observers,\
    \ and they can perform some actions.\n\n| M extends Observable | W1 implements\
    \ Observer |\n|---|---|\n| m = new M() | w1 = new W1() |\n| m.addObserver(w1)\
    \ | w1.update() |\n| m.addObserver(w2) | W2 implements Observer |\n| | w2 = new\
    \ W2() |\n| m.notifyObservers() | w2.update() |\n\nExample:\n\n```java\nimport\
    \ java.util.*;\npublic class superClass extends observable implements Observer\
    \ {\n    String methodName;\n    public superClass(String s) { methodName = s;\
    \ }\n```\n\n```java\npublic void update(Observable m, Object arg) {\n    System.out.println(methodName\
    \ + \" \" + arg + \n        \" from \" + methodName);\n}\n```\n\n```java\npublic\
    \ static void main(String args[]) {\n    MyClass m = new MyClass(\"manager\");\n\
    \n    m.addObserver(new MyClass(\"Bob\"));\n    m.addObserver(new MyClass(\"Joe\"\
    ));\n\n    m.setChanged();\n\n    m.notifyObservers(\"message\");\n}\n```\n\n\
    Create two new objects and register them as observers of object m.\n\nThe setChanged()\
    \ must be called before each notification.\n\nThe update() method of each observer\
    \ will be called;\nNote: m will be passed to update() automatically.\n\nThe output\
    \ of this program:\n\n\"Bob received a message from manager\"\n\"Joe received\
    \ a message from manager\"\n\n# Enumerations\n\nThe idea behind **enumerations**\
    \ is to provide an easy way of defining sets of constants not bound to any primitive\
    \ or object types, which usually restricts the scope of their usage. Java’s solution\
    \ to this problem was a new type of classes, whose instances are treated as constants.\
    \ Here is a sample declaration of an enumeration class:\n\n```java\nenum myEnum\
    \ { MIN, MAX }\n```\n\nNotice the usage of **enum** instead of **class**. The\
    \ MIN and MAX are the instances (objects) of the class **myEnum** and are called\
    \ **enumeration constants**. They are implicitly declared as **public, static,\
    \ final**. The enumeration constants are created (instantiated) automatically,\
    \ when the enumeration class is first referenced in the program. Therefore, you\
    \ do not need to use the **new operator** (in fact, you cannot) to create an object\
    \ of the enumeration class. Besides these differences, the enumeration classes\
    \ are still Java classes, and as such, they can have static and instance variables,\
    \ methods.\n\nExample:\n\n| Enumeration constants |\n|---|\n| enum myEnum { MIN,\
    \ MAX } | Static statement; executes when the enumeration class is first referenced\
    \ in the program. |\n| Instance variables | Initializing the instance |\n| myEnum\
    \ | Define types of the enumeration class |\n\n```java\nenum myEnum { MIN, MAX\
    \ }\n```\n\nNow, let's see what we can do with enumerations. The best way to illustrate\
    \ enumerations is to provide some examples. By employing enumeration, we can ensure\
    \ the state and city names of major airports:\n\n```java\nclass testenum {\n \
    \   enum Airport {\n        JFK(\"NY\", \"New York\"),\n        PHL(\"Philadelphia\"\
