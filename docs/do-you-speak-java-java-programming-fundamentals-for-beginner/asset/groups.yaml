  - "[PAGE 86]\n\n# Generic Constructors\n\nIt is important to remember that constructors\
    \ are methods whose function is to create instances (objects) of classes. As methods,\
    \ they can be declared as generic. The class itself can be either generic or non-generic.\n\
    \nWe have already seen constructors of generic classes in previous examples.\n\
    Here is another example:\n\n```\nclass GenericClass <T> {\n  public T key;\n \
    \ GenericClass(T k) {\n    this.key = k;\n  }\n}\n```\n\nGenericClass<Integer>\
    \ g = GenericClass<Integer>(123);\n\nThe above constructor is not generic. To\
    \ be generic it should be accept generic parameters different from those specified\
    \ in the class declaration,\nlike this:\n\n```\nclass GenericClass <T> {\n  public\
    \ T key;\n  public Object value;\n  GenericClass(T k, X v) {\n    this.key = k;\n\
    \    this.value = v;\n  }\n}\n```\n\nGenericClass<string> g = GenericClass<string>(123,\
    \ \"test\");\n\nThe <X> in front of the constructor indicates that this constructor\
    \ can accept the type-variable X, which is not related to any type parameters\
    \ in the class declaration.\n\nVery important note: all generic type-variables\
    \ of a constructor (in this case - X) are local to the constructor. Therefore,\
    \ you should not use the names of type variables declared by the class:\n\n```\n\
    class GenericClass <T> {\n  public T key;\n  <T> GenericClass(T k) {\n    this.key\
    \ = k;\n  }\n}\n```"
  - "[PAGE 87]\n\nBy default, type-variables can specify any class type or interface\
    \ type. To set boundaries to the allowed values of a type-variable, use the **extends**\
    \ keyword along with this format:\n\n```\n<T extends class> constructorName (...)\
    \ { }\n```\n\nThe **T** type-variable is restricted to the type **class** or any\
    \ of its sub-classes.\n\nExample:\n\n```\nclass GenericClass <T> { }\n<V extends\
    \ ABC> GenericClass(T obj1, V obj2) { }\n```\n\nThe above type-variable **V**\
    \ can be of any type ABC or any of its sub-classes.\n\n# Generic constructors\
    \ can also be used in non-generic classes.\n\nExample:\n\n```\nclass nonGeneric\
    \ {\n    String name;\n    <T extends myInterface> nonGeneric(T o) {\n       \
    \ this.name = o.getName();\n    }\n\n    public static void main(String[] args[])\
    \ {\n        nonGeneric g = new nonGeneric(new A());\n        System.out.println(g.name);\
    \ // prints: \"Class A\"\n    }\n}\n\ninterface myInterface { String getName();\
    \ }\n\nclass A implements myInterface {\n    public String getName() { return\
    \ \"Class A\"; }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_87_0.png)\n\
    \nNotice the use of the interface name in the constructor declaration:\n\n```\n\
    <T extends myInterface>\n```\n\nThis is valid, because when a class implements\
    \ an interface, objects of that class can be referenced by variables of the interface\
    \ type."
  - "[PAGE 88]\n\n# Lambda Expressions\n\nA lambda expression is a special construct\
    \ of the Java language used for defining custom methods outside of any class.\
    \ In reality, the lambda expression automatically declares a “hidden” class, creates\
    \ an instance of that class, and attaches the specified method to it.\n\nLet’s\
    \ illustrate this process with an example. We will implement the functionality\
    \ using the “traditional” approach and also using the lambda expressions. The\
    \ task is to create a method converting any text to uppercase.\n\nHere is the\
    \ “traditional” way:\n\n```\nclass myClass {\n    string transform(string s) {\
    \ return s.toUpperCase(); }\n}\n.\nmyClass c = new myClass();\nSystem.out.println(\
    \ c.transform(\"text\") ); // prints: \"TEXT\"\n```\n\nThe same transform method\
    \ declared using lambda expression:\n\n```\ninterface myInterface {\n    String\
    \ transform(String s);\n}\nmyInterface upper = (txt) -> {return txt.toUpperCase()};\n\
    System.out.println( upper.transform(\"text\") ); // prints: \"TEXT\"\n```\n\n\
    ![](img/7ffd006441be7e70bb67929dee89a427_88_0.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_88_1.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_88_2.png)\n\nIt seems that the “lambda”\
    \ approach does not save us much effort – instead of declaring a class, and instead\
    \ of creating an object of the class we use the lambda expression that defines\
    \ the body of the method and also creates an object of a “hidden” class. Even\
    \ worse – the lambda expression approach looks like an “un-object-oriented” way\
    \ to achieve the same thing that could be done the “object-oriented” way."
  - "[PAGE 89]\n\nAll of the above is true, but sometimes it is not practical to create\
    \ a new class for just one or or for a rarely used method. Also, the same interface\
    \ can be used for creating many different methods. For example, here is another\
    \ method that uses the same interface myInterface presented earlier:\n\n```\n\
    myInterface lower = txt -> txt.toLowerCase();\nSystem.out.println(lower.transform(\"\
    TEXT\")); // prints: \"text\"\n```\n\nTo fully explore this capability, the package\
    \ java.util.function provides several predefined functional interfaces to be used\
    \ in lambda expressions. One of these functional interfaces - Function<T,R>, applies\
    \ its method apply() to object of type T and returns the result as an object of\
    \ type R. The [partial] declaration of the Function interface looks as follows:\n\
    \n```\npublic interface Function <T, R> {\n  R apply(T t);\n  }\n```\n\nLet's\
    \ use this interface and a lambda expression to create a method that transforms\
    \ digits into words:\n\n```\nimport java.util.function.*;\nFunction<Integer, String>\
    \ spell = N ->\n```\n\n```\n{\n  string digits [] = {\n    \"zero\", \"one\",\
    \ \"two\", \"three\", \"four\",\n    \"five\", \"six\", \"seven\", \"eight\",\
    \ \"nine\"\n  };\n  return digits[N.intValue()];\n}\nInteger N = Integer.valueOf(4);\n\
    System.out.println(spell.apply(N)); // prints: \"four\"\n```\n\n> spell is an\
    \ object of a \"hidden\" class that implements the Function interface\n\n> N will\
    \ be the input parameter to apply()\n\n> This block will become the body of the\
    \ apply() method\n\n> Returns N'th element of array digits\n\n> Creates object\
    \ of type Integer with the value of 4\n\n> Calls the apply() method of the object\
    \ spell."
- md: "In previous examples we were explicitly declaring the object references of\
    \ functional interface types:\n\nFunction<Integer, String> spell myInterface =\
    \ lower;\n\nThen, lambda expressions were assigned to these object references.\
    \ This method of creating lambda expressions clearly shows what we're trying to\
    \ achieve, but is not mandatory. In general, it is not necessary to declare functional\
    \ interface object references. A lambda expression itself can be viewed (and used)\
    \ as an object of the corresponding functional interface. For example, we can\
    \ pass a lambda expression as a parameter to a method if that parameter is declared\
    \ as a functional interface.\n\nHere is an example; the IntPredicate is a factory-supplied\
    \ functional interface declaring the following test method:\n\nboolean test(int\
    \ value)\n\nWe are going to utilize it for selecting numbers within a specified\
    \ value range (n > min) & (n < max). Here is what needs to be:\n\n- Create an\
    \ object of type IntPredicate\n- Substitute its test method with the desired conditional\
    \ expression\n- Use the method to check if a number is within the range\n\nimport\
    \ java.util.function.*;\n\n```java\nclass testLambda {\n  static int min = 0;\n\
    \  static int max = 100;\n}\n```\n\n> the filter() method accepts object of type\
    \ IntPredicate (functional interface) and returns same object\n\npublic static\
    \ IntPredicate filter(IntPredicate p) { return p; }\n\n```java\npublic static\
    \ void main(String args[]) {\n  int i = 100;\n  if (filter(n -> (n > min && n\
    \ < max)).test(i)) {\n    System.out.println(\"within range\");\n  } else {\n\
    \    System.out.println(\"out of range\");\n  }\n}\n```\n\n> The \"n -> (n > min\
    \ && n < max)\" is an object of type IntPredicate\n\nExplanation: the filter method\
    \ accepts an object of type IntPredicate and returns it back. The goal here is\
    \ to pass a lambda expression to this method and get it back as an object. A lambda\
    \ expression itself does not tell us the functional interface it is used for,\
    \ so we need to provide this information to the Java compiler either by directly\
    \ assigning the lambda expression to a functional interface variable, or by passing\
    \ the lambda expression as a parameter of a functional interface type. So, in\
    \ this example, the lambda expression n -> (n>min && n < max) creates an object\
    \ of the IntPredicate type, substitutes its test method with the (n>min && n <\
    \ max), and passed this object expression filter(n->(n>min&&n<max)) is in fact\
    \ an object reference of type filter. The filter method returns this object back,\
    \ so the expression Int. Finally, we use this object reference to call the instance\
    \ method test (which, at this moment, reflects the lambda expression): filter(n\
    \ -> (n > min && n < max)).test(i)\n\nThe outcome of the above program: “out of\
    \ range”.\n\n## Method Reference\n\nThe **method reference** feature allows you\
    \ to create a reference to a method without executing the method. That reference\
    \ then can be passed to another method for execution using the double colon \"\
    ::\" operator. The following diagram and corresponding program code illustrates\
    \ the process:\n\n![](img/7ffd006441be7e70bb67929dee89a427_92_0.png)\n\n```java\n\
    interface F {\n    void execute();\n}\n\nclass myClass {\n    static void common(F\
    \ obj) { obj.execute(); }\n    void myMethod() {...}\n    public static void main(String[]\
    \ args) {\n        common(myClass::myMethod);\n    }\n}\n```\n\nThe **common()**\
    \ method is defined to accept an object of the functional interface **F** and\
    \ run its **execute()** method. At runtime, the method reference operator (\"\
    ::\") creates an instance of the functional interface **F** (because the **common()**\
    \ method expects it) whose **execute()** method points to **method1()**. Then,\
    \ the instance of **F** is passed to the **common()** method, and **method1()**\
    \ is executed. Note that method passing as reference must have the same signature\
    \ (return type and the types of parameters) as the method defined by the functional\
    \ interface.\n\nBelow are some examples converting the string \"Test Text\" to\
    \ upper or lower-case.\n\n```java\ninterface Transform {\n  String doit(String\
    \ s);\n}\n```\n\n> The signature of method doit() is <String>(String>\nAll methods\
    \ passing as references must have this signature.\n\n```java\nclass myClass {\n\
    \  static void printAS(Transform obj) {\n    System.out.println(obj.doit(\"Test\
    \ Text\"));\n  }\n```\n\n> printAS() method accepts an object of type Transform\n\
    and executes its doit() method\n\n```java\n  static String upper (String s) {return\
    \ s.toUpperCase();}\n  String lower (String s) {return s.toLowerCase();}\n```\n\
    \n```java\n  public static void main (String args[]) {\n    Transform lowercase,\
    \ uppercase;\n    printAS (myClass :: upper);\n    myClass mc = new myClass();\n\
    \    printAS (mc :: lower);\n    lowercase = mc :: lower;\n    printAS (lowercase);\n\
    \  }\n```\n\n> \"::\" operator creates a new\nTransform object with\nthe method\
    \ static\nreferencing the method upper\n\n> \"::\" operator creates a new\nTransform\
    \ object with the doit\nmethod referencing the instance method lower\n\n## Constructor\
    \ reference\n\nConstructor reference is similar to method reference.\n\nLet’s\
    \ say, the Location class holds two coordinates, x and y:\n\n```java\nclass Location\
    \ {\n    int x, y;\n    Location() { x = 0; }\n    Location(int x, int y) {\n\
    \        this.x = x;\n        this.y = y;\n    }\n}\n```\n\nWe want to be able\
    \ to build the Location objects not only “traditional way”, with the new keyword,\
    \ but also by calling a create method accepting coordinates.\n\nFirst, we declare\
    \ a functional interface with the create method accepting integers and returning\
    \ an object of class Location:\n\n```java\ninterface myConstructor {\n    Location\
    \ create(int x, int y);\n}\n```\n\nThen, during execution, we create an instance\
    \ (i.e. object) of the functional interface with the reference to one of the Location\
    \ constructors:\n\n```java\nmyConstructor mc = Location :: new;\n```\n\n> Will\
    \ try to find a constructor of class Location with same argument list as in the\
    \ create() method declared by myConstructor interface. If found, the create()\
    \ method will be referencing the found constructor.\n\nFinally, we use the method\
    \ create() to invoke a proper constructor of the class Location:\n\n```java\n\
    Location a = mc.create(7, 8);\n```\n\nThis example demonstrates the basics of\
    \ creating and using constructor references. However, having two different ways\
    \ of invoking the same constructor seems to be more confusing than beneficial.\n\
    \nSo here is a more practical example - we will be passing default constructor\
    \ references of two different classes (A and B) to the printName() method. This\
    \ method will use the received constructor reference to create an object and invoke\
    \ my methodName method.\n\n```java\ninterface AB {\n  String methodName();\n}\n\
    class A implements AB {\n  String name;\n  A () {name = \"A class\";}\n  public\
    \ String methodName() {return name;}\n}\nclass B implements AB {\n  String name;\n\
    \  B () {name = \"B class\";}\n  public String methodName() {return name;}\n}\n\
    ```\n\n> AB is the type to which the instances of A and B will be casted in the\
    \ printName() method. The methodName() method must be declared here so that the\
