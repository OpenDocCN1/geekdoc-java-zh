    \ // prints: 82.0\n    System.out.println(obj.toCelsius(77)); // prints: 22.5\n\
    \n    obj = new myClass2();\n    System.out.println(obj.toFahrenheit(25)); //\
    \ prints: 77.0\n    System.out.println(obj.toCelsius(77)); // prints: 25.0\n}\n\
    ```\n\nNote that same variable \"obj\" of type Conversion2 can be used to reference\
    \ objects of myClass1 and myClass2. This technique employs the polymorphism mechanism\
    \ and instructs Java to find correct instance methods dynamically, at run time,\
    \ based on the actual type of the object.\n\n# Interfaces vs. Abstract Classes\n\
    \nYou might have noticed already that an interface and abstract classes are similar.\
    \ Both can declare constants and provide method templates for further implementation\
    \ by other classes. So the question is what can we do with interfaces that cannot\
    \ be done with classes?\n\nLet's take a look at an example:\n\n```java\nabstract\
    \ class Fruit\ngetVolume()\n```\n\n```java\nabstract class Package\ngetVolume()\n\
    ```\n\n```java\nclass Orange extends Fruit\ngetVolume() {..}\n```\n\n```java\n\
    class Box extends Package\ngetVolume() {..}\n```\n\nThe getVolume() method of\
    \ the Orange and Box objects can be accessed as follows:\n\n```java\nOrange orange\
    \ = new Orange(); orange.getVolume();\nFruit fruit = new Orange(); fruit.getVolume();\n\
    ```\n\n```java\nBox box = new Box(); box.getVolume();\nPackage pack = new Box();\
    \ pack.getVolume();\n```\n\nSince the Orange and Box classes belong to different\
    \ class hierarchies, it's not possible to create an object reference that can\
    \ be used for referencing both objects.\n\nInterfaces allow us to do that the\
    \ class hierarchy and the interface hierarchy are unrelated. Interfaces break\
    \ the class hierarchy boundaries. Otherwise unrelated classes can implement the\
    \ same interface, and a variable of that interface type can reference the objects\
    \ of classes.\n\n```java\nclass Shape\ngetVolume()\n```\n\n```java\nclass Orange\
    \ implements Shape\ngetVolume() {..}\n```\n\n```java\nclass Box implements Shape\n\
    getVolume() {..}\n```\n\nExample: using a single interface variable to reference\
    \ class objects in different class hierarchies.\n"
