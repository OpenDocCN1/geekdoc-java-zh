- md: "\n## Byte Input Streams\n\nByte input streams are used to receive (read) a\
    \ sequence of bytes. All classes of this group have to extend the InputStream\
    \ abstract class and implement its read methods:\n\n```\nabstract int read();\n\
    int read(byte[] b); // optional\nint read(byte[] b, int offset, int len); // optional\n\
    ```\n\nNote: the read methods return the integer value -1 when the end of the\
    \ stream is reached.\n\nIn addition to the read methods, the InputStream class\
    \ provides several other methods for supporting the so-called markable streams.\
    \ With markable streams, you can mark a current position within the stream and\
    \ later return to that position. The markSupported method can be used to check\
    \ if a stream is markable.\n\nBelow is an example of reading integers from a file:\n\
    \n```\n// Assumption: a set of integer values were written into the\n// \"test.txt\"\
    \ file via DataOutputStream.\nimport java.io.*;\nclass testInputStream {\n   \
    \ public static void main(String[] args[]) {\n        boolean EOF = false;\n \
    \       int i;\n        try {\n            File myfile = new File(\"test.txt\"\
    );\n            FileInputStream filein = new FileInputStream(myfile);\n      \
    \      DataInputStream datain = new DataInputStream(filein);\n\n            while\
    \ (!EOF) {\n                try {\n                    i = datain.readInt();\n\
    \                    System.out.println(\"i=\" + i);\n                } catch\
    \ (EOFException e) {\n                    EOF = true;\n                }\n   \
    \         }\n        } catch (IOException e) {\n            System.out.println(\"\
    I/O Error\");\n        }\n    }\n}\n```\n\n## Character Input Streams\n\nCharacter\
    \ input streams are represented by a group of classes extending the abstract class\
    \ Reader. Their purpose is to read characters from different sources in their\
    \ native (local) encoding format and convert them into the Unicode format. Each\
    \ input stream class has to implement the read methods:\n\n```\nint read(); //\
    \ read a single character\nint read(char[] c); // read characters into an array\n\
    // reads into a portion of an array:\nabstract int read(char[] c, int off, int\
    \ len);\n```\n\nNote: the read methods return the integer value -1 when the end\
    \ of the stream is reached.\n\nIn addition to the read methods, the Reader class\
    \ provides several other methods for supporting the markable streams. With markable\
    \ streams, you can mark a current position within the stream and later return\
    \ to that position. The markSupported method can be used to check if a stream\
    \ is markable.\n\nExample:\n\n```\n// Print every other character of the alphabet\n\
    import java.io.*;\nclass testStringReader {\n    public static void main(String[]\
    \ args[]) {\n        String s = \"abcdefghijklmnopqrstuvwxyz\";\n        int i\
    \ = 0;\n        try {\n            Reader sReader = new StringReader(s);\n   \
    \         do {\n                sReader.skip(1);\n                i = sReader.read();\n\
    \                if (i > 0)\n                    System.out.print((char) i);\n\
    \            } while (i != -1);\n        } catch (IOException e) {\n         \
    \   System.out.println(\"Error reading file\");\n        }\n    }\n}\n```\n\n\
    This program creates the output: \"dfhjlnprtvxz\"\n\n## Try-With-Resources\n\n\
    There is one nice enhancement added to the stream handling process in JDK7. It\
    \ allows to automatically release the resources held by a stream (e.g. close the\
    \ file) once we are done using the stream. This feature can be used with the classes\
    \ implementing the AutoClosable interface, which declares only one method - close().\
    \ The close method will be called when the try block ends.\n\nThe new format of\
    \ the try block:\n\n```\ntry ( resource declaration and initialization )\n{ usage\
    \ of the resource }\ncatch ( . . .) { . . . }\n```\n\nExample:\n\n```\nclass mystream\
    \ extends OutputStream{\n    public void writeInt(int i) {}\n    public void write(byte[]\
    \ b, int offset, int len) {\n        System.out.println(\"Received bytes: \" +\
    \ len);\n    }\n}\nclass teststreams {\n    public static void main(String args[])\
    \ {\n    try (\n        DataOutputStream dataout =\n            new DataOutputStream(\n\
    \            new BufferedOutputStream(\n                new myStream()))\n   \
    \ )\n    dataout.writeInt(123);\n    // dataout.flush();\n    } catch (IOException\
    \ e) {\n        System.out.println(\"I/o error\");\n    }\n}\n```\n\n> Start of\
    \ the resource (stream) declaration\n> the flush() or close() would be required\
    \ in a \"traditional\" try block.\n> the dataout.close() will be automatically\
    \ called at the end of the try block\n\n## Serialization\n\nByte output streams\
    \ have the capability of writing Java objects from computer memory into output\
    \ devices or data streams, and byte input streams can read them back into the\
    \ computer memory. The process of writing an object into a stream is called serialization,\
    \ and the process of reading an object from a stream is called deserialization.\n\
    \nEvery Java object is a complex structure that may include methods, variables,\
    \ and even other objects. That structure is referred to as an \"object graph\"\
    . Java encodes all data into a special internal format before writing it out into\
    \ a stream.\n\nThe implementation of serialization/deserialization is done by\
    \ the ObjectOutputStream and ObjectInputStream classes. Their main methods are\
    \ writeObject() and readObject(), respectively.\n\nThe implementation of serialization/deserialization\
    \ is done by the ObjectOutputStream and ObjectInputStream classes. \n\n```java\n\
    // write one object of class\nimport java.io.*;\nclass myClass implements Serializable\
    \ {\n    private String name;\n    public myClass(String name) {\n        this.name\
    \ = name;\n    }\n    public String getName() {\n        return name;\n    }\n\
    }\nclass teststreams {\n    public static void main(String args[]) {\n       \
    \ // write one object of class\n        try {\n            ObjectOutputStream\
    \ dataout =\n                new ObjectOutputStream(\n                new BufferedOutputStream(\n\
    \                    new FileOutputStream(\"object.txt\")));\n\n            dataout.writeObject(new\
    \ myClass(\"Java\"));\n        } catch (IOException e) {\n            System.out.println(\"\
    I/o error\");\n        }\n    }\n}\n```\n\n```java\n// Read one object from file\n\
    try {\n    ObjectInputStream objin =\n        new ObjectInputStream(\n       \
    \ new BufferedInputStream(\n            new FileInputStream(\"object.txt\")));\n\
    \n    myClass obj = (myClass) objin.readObject();\n\n    System.out.println(obj.getName());\n\
    } catch (IOException e) {\n    System.out.println(\"I/o error\");\n} catch (ClassNotFoundException\
    \ e) {\n    System.out.println(\"Class not found\");\n}\n```\n\nWhen you serialize\
    \ an object, you can choose not to serialize some of its members. For this, declare\
    \ a variable as transient. In the above example, if the name variable was declared\
    \ as transient, the output would be “null” because strings are objects.\n\nprivate\
    \ transient name;\n\nDuring deserialization the transient variables are set to\
    \ their default values - zero for numbers, true/false for Boolean, and null for\
    \ objects.\n\nA special situation will occur if your serializable class extends\
    \ a non-serializable class. During the deserialization process, an instance of\
    \ the non-serializable class (your superclass) will be created using the no-argument\
    \ constructor. You have to make sure that such no-argument constructor exists.\n\
    \n## New Input/Output System - NIO\n\nSince the inception of the language, Java's\
    \ approach to the input/output operations was stream-oriented. The transmission\
    \ of data between the application and an external entity (e.g. disk file) was\
    \ seen as a stream of single bytes or characters.\n\nBased on the direction of\
    \ the stream and the type of data, streams are divided into four categories: byte\
    \ input stream, byte output stream, character input stream, and character output\
    \ stream. Each of these streams is represented by a group of Java classes, each\
    \ extending, respectively, InputStream class (byte input stream), OutputStream\
    \ class (byte output stream), and Writer class (character output stream).\n\n\
    The common characteristic of all the above streams is that they are blocking data\
    \ streams. It means that the current execution thread of your application is put\
    \ on hold until the I/O request completes.\n\nIn version 1.4 Java first introduced\
    \ an alternative input/output system named New Input Output, or just NIO, which\
    \ the I/O concept changed from the stream-oriented to buffer/channel-oriented.\n\
    \nHere are the highlights of NIO features:\n\n- All data is transmitted via a\
    \ channel into out of a buffer. The application manipulates data directly in the\
    \ buffer.\n- Unlike standard streams, a channel can transmit data in both directions.\n\
    - Channels are capable of operating in blocking mode, same as streams, and in\
    \ non-blocking mode. In the non-blocking mode, the thread that issues an I/O request\
    \ is not put on hold until the I/O operation completes, but continues its execution.\n\
    - NIO also added the capability of handling multiple channels within a single\
    \ thread.\n"
  mdcn: "\n\n## 字节输入流\n\n字节输入流用于接收（读取）字节序列。此组中的所有类都必须继承 `InputStream` 抽象类并实现它的 `read`\
    \ 方法：\n\n```\nabstract int read();\nint read(byte[] b); // 可选\nint read(byte[]\
    \ b, int offset, int len); // 可选\n```\n\n注意：当到达流的末时，`read` 方法返回整数值 -1。\n\n除了 `read`\
    \ 方法外，`InputStream` 类还提供了其他方法来支持所谓的可标记流（markable streams）。通过可标记流，你可以标记流中的当前位置，并在稍后返回该位置。可以使用\
    \ `markSupported` 方法来检查流是否是可标记的。\n\n下面是从文件中读取整数的示例：\n\n```\n// 假设：一组整数值已通过 DataOutputStream\n\
    // 写入了 \"test.txt\" 文件。\nimport java.io.*;\nclass testInputStream {\n    public\
    \ static void main(String[] args[]) {\n        boolean EOF = false;\n        int\
    \ i;\n        try {\n            File myfile = new File(\"test.txt\");\n     \
    \       FileInputStream filein = new FileInputStream(myfile);\n            DataInputStream\
    \ datain = new DataInputStream(filein);\n\n            while (!EOF) {\n      \
    \          try {\n                    i = datain.readInt();\n                \
    \    System.out.println(\"i=\" + i);\n                } catch (EOFException e)\
    \ {\n                    EOF = true;\n                }\n            }\n     \
    \   } catch (IOException e) {\n            System.out.println(\"I/O Error\");\n\
    \        }\n    }\n}\n```\n\n## 字符输入流\n\n字符输入流由一组继承 `Reader` 抽象类的类表示。其目的是从不同的源按原生（本地）编码格式读取字符，并将它们转换为\
    \ Unicode 格式。每个输入流类都必须实现 `read` 方法：\n\n```\nint read(); // 读取单个字符\nint read(char[]\
    \ c); // 读取字符到数组中\n// 读取到数组的一部分：\nabstract int read(char[] c, int off, int len);\n\
    ```\n\n注意：当到达流的末时，`read` 方法返回整数值 -1。\n\n除了 `read` 方法外，`Reader` 类还提供了其他方法来支持可标记流。通过可标记流，你可以标记流中的当前位置，并在稍后返回该位置。可以使用\
    \ `markSupported` 方法来检查流是否是可标记的。\n\n示例：\n\n```\n// 打印字母表中每隔一个字符\nimport java.io.*;\n\
    class testStringReader {\n    public static void main(String[] args[]) {\n   \
    \     String s = \"abcdefghijklmnopqrstuvwxyz\";\n        int i = 0;\n       \
    \ try {\n            Reader sReader = new StringReader(s);\n            do {\n\
    \                sReader.skip(1);\n                i = sReader.read();\n     \
    \           if (i > 0)\n                    System.out.print((char) i);\n    \
    \        } while (i != -1);\n        } catch (IOException e) {\n            System.out.println(\"\
    Error reading file\");\n        }\n    }\n}\n```\n\n该程序产生输出：\"dfhjlnprtvxz”\n\n\
    ## Try资源管理器 (Try-With-Resources)\n\nJDK7 在流处理过程中增加了一个非常好的改进。它允许我们在完成流的使用后自动释放流持有的资源（例如关闭文件）。此功能可以与实现\
    \ `AutoClosable` 接口的类一起使用，该接口仅声明了一个方法——`close()`。当 `try` 块结束时将调用 `close` 方法。\n\
    \n`try` 块的新格式：\n\n```\ntry ( 资源声明和初始化 )\n{ 资源的使用 }\ncatch ( . . .) { . . . }\n\
    ```\n\n示例：\n\n```\nclass mystream extends OutputStream{\n    public void writeInt(int\
    \ i) {}\n    public void write(byte[] b, int offset, int len) {\n        System.out.println(\"\
    Received bytes: \" + len);\n    }\n}\nclass teststreams {\n    public static void\
    \ main(String args[]) {\n    try (\n        DataOutputStream dataout =\n     \
    \       new DataOutputStream(\n            new BufferedOutputStream(\n       \
    \         new myStream()))\n    )\n    dataout.writeInt(123);\n    // dataout.flush();\n\
    \    } catch (IOException e) {\n        System.out.println(\"I/o error\");\n \
    \   }\n}\n```\n\n> 资源（流）声明的开始\n> 在“传统的”try 块中需要调用 flush() 或 close()\n> dataout.close()\
    \ 将会在 try 块结束时自动调用\n\n## 序列化\n\n字节输出流具有将 Java 对象从计算机内存写入输出设备或数据流的能力，而字节输入流可以将它们重新读回计算机内存。将对象写入流的过程被称为序列化，而从流中读取对象的过程被称为反序列化。\n\
    \n每个 Java 对象都是一个复杂的结构，可能包含方法、变量甚至其他对象。该结构被称为“对象图”。Java 在将数据写入流之前会将所有数据编码为一种特殊的内部格式。\n\
    \n序列化/反序列化的实现由 `ObjectOutputStream` 和 `ObjectInputStream` 类完成。它们的主要方法分别是 `writeObject()`\
    \ 和 `readObject()`。\n\n序列化/反序列化的实现由 `ObjectOutputStream` 和 `ObjectInputStream`\
    \ 类完成。\n\n```java\n// 写入一个类的类的对象\nimport java.io.*;\nclass myClass implements\
    \ Serializable {\n    private String name;\n    public myClass(String name) {\n\
    \        this.name = name;\n    }\n    public String getName() {\n        return\
    \ name;\n    }\n}\nclass teststreams {\n    public static void main(String args[])\
