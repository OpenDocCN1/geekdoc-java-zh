    \ operator (+) combines two operands into one string. (Wait, the OCR is repeating\
    \ the text).\n\n## String Methods\n\nIn this paragraph we will present some commonly\
    \ used methods of class String.\n\n### Determining String Length\n\n```\nString\
    \ s = \"text\";\nint lng = s.length(); // lng = 4\nlng = \"my string\".length();\
    \ // lng = 9\n```\n\n### Comparing Strings\n\nThe compareTo() method compares\
    \ two strings lexicographically. The comparison is based on the Unicode value\
    \ of each character in the strings and is performed by comparing one character\
    \ at a time, from left to right, until unequal characters are found or until the\
    \ end of one of the strings is reached. The value returned by the compareTo()\
    \ method is calculated as difference between the numeric values of unequal characters\
    \ ('a' - 'b' = -1). If one of the strings reaches its end, the method returns\
    \ the difference of the length of the strings.\n\n```\nString s = \"ab\";\nint\
    \ n = s.compareTo(\"ab\"); // n = 0\n```\n\n### Accessing String Characters\n\n\
    ```\nString s = \"abcdef\";\nchar c1 = s.charAt(0); // c1 = 'a'\nchar c2 = s.charAt(5);\
    \ // c2 = 'f'\n```\n\n### Searching for a Character\n\n```java\nString s = \"\
    abcd\";\nint pos;\npos = s.indexOf('g'); // pos=-1 (character 'g' not found)\n\
    pos = s.indexOf('b',2); // pos=+3 (first 'b' after position 2 is in position 3)\n\
    pos = s.lastIndexOf('c'); // pos=+4 (last symbol 'b' is in position 4)\n```\n\n\
    ### Searching for a Substring\n\n```java\nString s = \"abcd\";\nint pos;\npos\
    \ = s.indexOf(\"abd\"); // pos = -1 (sub-string 'abd' not found)\npos = s.indexOf(\"\
    bc\"); // pos = 1 (sub-string 'bc' is in position 1)\n```\n\n### Extracting a\
    \ Substring\n\n```java\nString s = \"abcdef\";\nString s1 = s.substring(1,3);\
    \ // s1 = \"bc\"\nString s2 = s.substring(1); // s2 = \"bcdef\"\n```\n\n### Creating\
    \ a new String from existing String\n\n```\nString s = \" abc\";\nString s1 =\
    \ s.trim(); // s1 = \"abc\"\nString s2 = s.replace(' ', '+'); // s2 = \"+abc\"\
    \n```\n\n### Creating a Character Array from a String\n\n```java\nString s = \"\
    abcd\";\nchar[] c = s.toCharArray();\ns.getChars(0, 2, c, 2);\n\nc[0]='a'\nc[1]='b'\n\
    c[2]='c'\nc[3]='d'\n```\n\n> Copy characters in positions 0, 1 of string into\
    \ array c starting from position 2.\n\n```\nc[0]='a'\nc[1]='b'\nc[2]='a'\nc[3]='b'\n\
    ```\n\n### Creating an Array of Bytes from a String\n\nThis method converts each\
    \ character of a string from Unicode (16-bit) into the local 8-bit encoding (usually\
    \ ASCII) and creates an array of bytes.\n\n```java\nString s = \"abcd\";\nbyte[]\
    \ b = s.getBytes();\n\nb[0]=97 ('a' in ASCII)\nb[1]=98 ('b' in ASCII)\nb[2]=99\
    \ ('c' in ASCII)\nb[3]=100 ('d' in ASCII)\n```\n\n### Creating a String from an\
    \ Array of Characters\n\nThe static copyValueOf method of class String create\
    \ a String object from an array of characters. It has the following two formats:\n\
    \n```\nstatic copyValueOf(char[] charArray);\n```\n\n```\nstatic copyValueOf(char[]\
    \ charArray, int startPos, int numberOfElements);\n```\n\nExample:\n\n```\nchar[]\
    \ c = {'a', 'b', 'c', 'd'};\nString s1 = String.copyValueOf(c); // s1 = \"abcd\"\
    ;\nString s2 = String.copyValueOf(c,1,2); // s2 = \"bc\";\n```\n\n## Packages\n\
    \nA package is a container for classes. All Java classes are spread across more\
    \ than 200 packages. The fundamental classes reside in the java.lang package.\
    \ Examples of other packages are java.io, java.util, java.net, java.math, etc.\n\
    \nPackages are arranged in a tree-like structure:\n\n![](img/7ffd006441be7e70bb67929dee89a427_74_0.png)\n\
    \nThe java.lang package is always available to the Java compiler. When your program\
    \ needs to use a class residing in a different package, that class or the whole\
    \ package containing that class must be imported into the program:\n\n```java\n\
    import java.math.*;\nimport java.io.FileReader;\nclass myClass { ... }\n```\n\n\
    | All classes from package |\n| :--- |\n| java.math will be available |\n| FileReader\
    \ from the package java.io will be available |\n\nUser-defined classes are also\
    \ placed in packages. For example, the myClass from the above example will be\
    \ placed in a default, \"no-name\" package. To place it into a particular package,\
    \ the first statement of the program (not counting comment lines) must be the\
    \ package statement:\n\n```java\npackage mypackage;\nimport java.math.*;\nimport\
    \ java.io.FileReader;\nclass myClass { ... }\n```\n\n| All classes from package\
    \ |\n| :--- |\n| java.math will be available |\n| FileReader from the package\
