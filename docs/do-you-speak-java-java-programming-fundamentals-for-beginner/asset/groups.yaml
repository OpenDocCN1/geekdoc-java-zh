    # Boolean Literals


    Boolean literals can have only two values – true and false. These values are not
    converted to any numeric values.


    ```

    boolean b = true; // "b" is declared and set to true

    b = false; // "b" is set to false

    ```


    # String Literals


    String literals are formed by enclosing a sequence of characters by double quotes.
    Here are few examples of valid string literals.


    "String Literal"

    \"String in double quotes\"

    \"String on \n two lines"


    # Casting in arithmetic expressions


    In general, the operands (variables and literals) of an arithmetic expression
    could be of different data types. The purpose of the casting mechanism is to deal
    with such situations by promoting the precision of operands from lower to higher
    level. Precision is increased from byte to double as follows:


    ```

    byte→ int→ long→ float→ double

    ```


    There are two types of casting: implicit and explicit. Implicit casting is done
    by the language automatically, based on the actual data types of the operands.
    Explicit casting is requested by the programmer by placing the desired data type
    in front of a variable or literal.


    Below are the rules of how the type of operands is determined or set in arithmetic
    expressions:


    +   - all integer literals by default are of type int

    - all non-integer literals by default are of type double

    - before calculating any arithmetic expression, all byte and short variables are
    promoted to type int'
  - '[PAGE 25]


    +   - for each arithmetic operation (+, -, /, etc.), with mixed operand data types,
    a lower precision operand is promoted to the type of the higher precision operand

    - a literal or variable is promoted or demoted to the data type explicitly specified
    by the type modifier placed in front of it in parenthesis


    # Example 1


    ```

    double result = 1.5 + 3 / 2; // result = 1.5 + 1 = 2.5

    ```


    The data type determination and calculation are performed as follows:

    (double) result =

    (double) 1.5 + (int) 2 =

    (double) 1.5 + (int) 1 =

    (double) 1.5 + (double) 1.0 = (double) 2.5


    # Example 2


    ```

    double result = 1.5 + (double) 3 / 2; // result = 1.5 + 1.5 = 3.0

    ```


    The data type determination and calculation are performed as follows:

    (double) result =

    (double) 1.5 + (double) 3 / (int) 2 =

    (double) 1.5 + (double) 3 / (double) 2.0 =

    (double) 1.5 + (double) 1.5 = (double) 3.0


    # Example 3


    ```

    int result = (int) (3.0 / 2.0); // result = 1

    ```


    The data type determination and calculation are performed as follows:

    (int) result =

    (int) ( (double) 3.0 / (double) 2.0 ) =

    (int) ( (double) 1.5 ) =

    (int) 1'
