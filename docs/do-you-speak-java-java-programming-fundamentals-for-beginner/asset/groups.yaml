    # 引言


    关于 Java 的书籍非常多——从入门指南到完整参考应有尽有。第一类书籍倾向于集中在基础概念上，这不会让你离开“Hello world!”程序太远。第二类书籍实在太庞大了——通常超过
    1000 页。它们作为参考来源非常棒，但细节过于冗赘，示例也冗长。它们还试图涵盖尽可能多的主题，这导致学习曲线变得更加陡峭。


    本书的长度不到两百页，因此它绝对不是一本参考指南。它也不是一本“Java 基础”书。


    本书没有过度关注细节，而是通过小型综合示例来说插一切，它专注于 Java 的核心特性，这些特性对于构建现实应用至关重要。目标是建立对 Java 如何运作的整体理解。细节以后可以从
    Java 原始规范和教程，或者从那些综合指南和完整参考书中查找到。


    从零开始，本书将为你的 Java 知识打下坚实的基础。


    如果你想成为 Java 专家——这本书是一个很好的开始。祝你好运！


