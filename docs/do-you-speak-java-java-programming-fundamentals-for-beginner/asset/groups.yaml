  - "[PAGE 133]\n\n# Comparator\n\nAny ordered collection (e.g. TreeSet) needs to\
    \ have some kind of compare algorithm to determine which element of the collection\
    \ is “greater” than the other. In fact, there are default algorithms for each\
    \ type of objects that can be stored in ordered collections. These algorithms\
    \ are implemented via the Comparator functional interface that defines the compare()\
    \ method. In case we want to alter the default sequence of objects in a collection,\
    \ we can build a collection that points to a custom comparator.\n\nNote that the\
    \ Comparator can be used to provide an ordering for collections of objects that\
    \ do not have a natural ordering.\n\nThe example below shows how to create a custom\
    \ comparator to sort an array of integers descending.\n\n```\nimport java.util.*;\n\
    class testComparator {\n    public static int reverse(Integer n1, Integer n2)\
    \ {\n        return n1;\n    }\n    public static void main(String args[]) {\n\
    \        Integer[] nn = { 1, 2, 3 };\n        Arrays.sort(nn, (n1, n2) -> reverse(n1,\
    \ n2));\n        System.out.println(nn[0] + \" , \" + nn[1] + \" , \" + nn[2]);\n\
    \    }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_133_0.png)\n\n> The\
    \ reverse(n1,n2) substitutes the compare() method of the interface Comparator.\n\
    \nThe output of this program will be “3,2,1”.\n\nNote: The Arrays class define\
    \ several sort methods; we’ve used one:\n\n```\nstatic void sort(T[] a, comparator<?\
    \ super T> c)\n```\n\nHere is how it is executed:\n\n+   - T becomes the first\
    \ operand T\n- The integers array substitutes the first (n1, n2) -> reverse (n1,\
    \ n2) is transformed into an object of the Comparator<Integer> functional interface,\
    \ whose compare() method is implemented as { reverse (n1, n2); }\n- During the\
    \ sorting, reverse() is used in determining which one of two integers is greater,\
    \ as follows:\n\n```\nn1>n2 : result>0; n1<n2 : result<0; n1=n2 : result=0\n```"
  - '[PAGE 134]


    # I/O Streams


    A stream is an abstract representation of an input, where source data is retrieved
    from, or an output, where destination data is sent to. Java recognizes two types
    of streams – byte streams and character streams. The byte streams should be used
    for sending or receiving binary objects, and the character streams should be used
    when working with characters and the “character” representation of data is needed.


    ![](img/7ffd006441be7e70bb67929dee89a427_134_0.png)


    Note that the transmission of data via byte or character streams is done one or
    one character at a time. There are buffered streams that group the data into buffers,
    but those streams are still based on the underlying byte or character streams.


    This chapter provides an overview of the concept behind streams and illustrates
    the usage of some input and output streams.


    # Byte Output Streams


    Imagine that an application generates the following types of data and wants to
    write them out into a file:


    ![](img/7ffd006441be7e70bb67929dee89a427_134_1.png)'
  - "[PAGE 135]\n\nOne way to accomplish this would be by creating different classes\
    \ for each type of input data, but Java’s approach to this task is by building\
    \ a “chain” of streams, each performing necessary data transformation and passing\
    \ the result to the next stream:\n\n![](img/7ffd006441be7e70bb67929dee89a427_135_0.png)\n\
    \nThe FileOutputStream class provides several methods for writing data out into\
    \ files. For example, it defines the method `write(byte[] b)` that writes the\
    \ specified array of bytes to a file. If we had an ready array, we could use this\
    \ method as follows:\n\n```\nbyte[] b = {97, 98, 99};\nFileOutputStream fileout;\n\
    fileout = new FileOutputStream(\"myfile.txt\");\nfileout.write(b);\n```\n\nHowever,\
    \ class FileOutputStream does not deal with primitive data types (double, float,\
    \ int, etc.). So in order to write a double number, we need to engage the DataOutputStream\
    \ class, which implements the writeDouble method. DataOutputStream converts the\
    \ received argument to an array of bytes and passes each byte, one by one, to\
    \ the underlying stream by calling the **write** method of the underlying stream:\n\
    \n```\nDataOutputStream dataout;\ndataout = DataOutputStream(fileout);\n```\n\n\
    | dataout will be calling the \n fileout.write() method for each \n output byte.\
    \ |\n\nNow, we can call the writeDouble method of **DataOutputStream** that will\
    \ convert the double number to bytes and pass them to FileOutputStream via the\
    \ **write** method:\n\n```\ndataout.writeDouble(123.4);\n```"
  - '[PAGE 136]


    In general, the chain of streams is constructed from the bottom up:


    ```

    C c = new C();

    B b = new B(c);

    A a = new A(b);

    // or just:

    A a = A(new B(c));

    ```


    The data is passed between output streams as follows:


    | Object a: | Object b: | Object c: |

    | --- | --- | --- |

    | a.write(...) | write(...) | write(...) |

    | conversion | conversion | conversion |

    | b.write(...) | c.write(...) | |

    | | | |


    In order of this mechanism to work, the following requirements must be met:


    Each output stream must be a subclass of the class OutputStream and has the constructor
    streamName (OutputStream)


    Each output stream has to implement the following methods defined in the OutputStream
    class:

    - write(int i) - mandatory

    - write(byte[] b) - optional

    - write(byte[] b, int offset, int length) - for buffered outputs


    Classes in the output stream chain should not extend each other; otherwise it
    would be not possible to call the write method of the top class due to polymorphism.


    There are quite a few byte output streams, but reviewing all of them would not
    add much to the general understanding of the concept of input/output streams,
    so we give you a single example of creating a custom byte output stream.'
