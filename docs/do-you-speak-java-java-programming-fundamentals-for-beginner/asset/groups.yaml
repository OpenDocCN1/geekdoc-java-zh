    # Event Handling


    When you interact with a GUI application, each action triggers an event. Mouse
    move, mouse click, keyboard input, scroll, screen touch, swipe, etc. – all are
    examples of events that can be captured by the JavaFX application and processed.


    The event handling mechanism employed by JavaFX is easier explained through an
    example. Let''s say that we clicked on a button on the screen. This action triggers
    a "mouse click" event. In JavaFX, an event is an instance of the javafx.event.Event
    class or any subclass of Event, so JavaFX creates a corresponding Event object
    for the event. The event object “travels” through the object hierarchy of the
    JavaFX application, from the Stage object to the target node that was clicked
    (a Button), and backwards. By “travel” we mean “presented for processing”. The
    first path is called “capturing phase:


    Stage -> Root Node -> branch nodes (if any) -> Target Node


    The second path is called "bubbling phase":


    Target Node -> branch nodes -> Root Node -> Stage


    The following diagram illustrates the event handling mechanism:


    ![](img/7ffd006441be7e70bb67929dee89a427_174_0.png)


    Any time during the capturing or bubbling phase the event can be flagged as “consumed”
    by executing the consume() instance method of class Event. This stops further
    propagation.


    Presenting (i.e. delivering) an event to an object for processing does not imply
    that the event will be or be processed by that object. To be able to accept'
- md: "\nand process an event, every object must register itself as an event handler\
    \ and implement some kind of event handling logic. Since events are delivered\
    \ to each object twice – during the capturing (or filtering) phase, and during\
    \ the bubbling (or handling) phase, the object can set up an event filter, or\
    \ event handler, or both.\n\nAll nodes (i.e. subclasses of the Node class), as\
    \ well as the Stage and Scene classes define methods for registering and implementing\
    \ event filters and event handlers:\n\n```\n<T extends Event> void addEventListener(EventType<T>\
    \ eventType,\nEventHandler<? super T> eventHandler);\n```\n\n```\n<T extends Event>\
    \ void addEventHandler(EventType<T> eventType,\nEventHandler<? super T> eventHandler);\n\
    ```\n\nThere are also so-called convenience methods for registering the event\
    \ handlers for different types of events. They are basically shorthand for the\
    \ addEventHandlerMethods method. For example, this method registers an event handler\
    \ for the \"mouse clicked\":\n\n```\nvoid setMouseClicked(EventHandler<? super\
    \ MouseEvent> value);\n```\n\nLet’s practice and create a couple of event handlers\
    \ using the addEventHandler() and setMouseClicked() methods.\n\nThe setMouseClicked\
    \ method declares one argument – an object of generic functional interface EventHandler,\
    \ whose generic class parameter can be the MouseEvent or any superclass of MouseEvent\
    \ (e.g. EventHandler<MouseEvent>, EventHandler<Event>, etc.).\n\nThe EventHandler\
    \ functional interface declares the following method:\nvoid handle(T event);\n\
    \nNext, we need to create an object of type EventHandler<MouseEvent>, implement\
    \ its handle() method, and pass this object as an argument to the setMouseClicked()\
    \ method. This can be accomplished in several different ways, three of which are\
    \ presented below.\n\nThe first way of registering an event handler with the setMouseClicked()\
    \ method is by using an anonymous class:\n\n```\nnode.setMouseClicked(\n  new\
    \ EventHandler<MouseEvent>() {\n    public void handle(MouseEvent e) {\n     \
    \ ... event handling logic ...\n    }\n});\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_176_0.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_176_1.png)\n\nThe second way of using\
    \ the setMouseClicked() method is by using a lambda expression:\n\n```\nnode.setMouseClicked(\n\
    \  e -> { ... event handling logic }\n);\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_176_2.png)\n\
    \nThe third way of using the setMouseClicked() method is by using a method reference:\n\
    \n```\nclass myClass {\n  public void clickHandler(MouseEvent e) {\n    ... event\
    \ handling logic ...\n  }\n  public static void main(String[] args) {\n    ...\n\
    \    node.setMouseClicked(\n      myClass::clickHandler\n    );\n  }\n}\n```\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_176_3.png)\n\nNote that the clickHandler\
    \ method must have same signature as the handle method of the EventHandler interface,\
