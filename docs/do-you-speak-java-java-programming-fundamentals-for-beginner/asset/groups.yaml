- md: "\n# Regular Expressions\n\nThe validation and manipulation of the contents\
    \ of text strings can be found in many applications. For example, we might need\
    \ to check if an email address entered has valid format. The Regular Expressions\
    \ API is a powerful tool that a Java programmer can utilize to perform text validation,\
    \ parsing, tokenization, or other type of manipulations.\n\nThe Regular Expression\
    \ API consists of two utility classes: Pattern and Matcher. The Pattern class\
    \ is used to build regular expressions, which are referred to as patterns. The\
    \ Matcher class is used to apply the pattern to a text string. The usage of these\
    \ two classes is quite simple but the challenge is in mastering regular expression\
    \ skills, which, unfortunately, is beyond the scope of this book. Nevertheless,\
    \ we will go through several examples to make you familiar with the operations\
    \ that can be performed on text strings, and also to cover the basics of regular\
    \ expressions.\n\n# Regular Expressions Basics\n\nA regular expression is a sequence\
    \ of characters defining a pattern that can be matched against a text string.\
    \ For example, the regular expression “abc” can be used to check if a text contains\
    \ the “abc” sequence.\n\nThere are several categories of regular expressions.\
    \ We will present three of them.\n\nThe first category of regular expressions\
    \ is called “characters” and includes most of the characters and also the escape\
    \ sequences, like \\t (tab character), or \\n (newline character). “abc” is an\
    \ example of the character regular expression.\n\nThe second category of regular\
    \ expressions is called “character classes” and represents a range of valid characters.\
    \ For example, the [a-zA-Z] pattern will match any lower-case or upper-case letter.\n\
    \nFor some of the character classes constructs Java provides a shorthand form:\n\
    \n- . matches any character\n- \\s matches the white space character\n- \\d matches\
    \ any digit\n- \\w matches any word character\n\nThe third category of regular\
    \ expression constructs is called \"quantifiers\". Quantifier can be appended\
    \ to any character or character class construct to specify the allowed number\
    \ of occurrences for the construct:\n\n- ? occurs once or not at all\n- * occurs\
    \ zero or more times\n- + occurs one or more times\n- {n} occurs exactly n times\n\
    - {n,} occurs at least n times\n- {n,m} occurs from n to m times\n\nThere are\
    \ other regular expression groups, but their review is beyond the scope of this\
    \ book.\n\n# Regular Expressions Examples\n\nBefore we start with examples, we\
    \ need to mention that the Pattern and Matcher classes have no constructors. Pattern\
    \ objects are created by the static method compile() of class Pattern, and Matcher\
    \ objects are created by the instance method matcher() of class Pattern.\n\nExample:\
    \ Validate if the whole text matches the pattern.\n\n```\nString regex;\nPattern\
    \ p;\nMatcher m;\n\n```\np = Pattern.compile(\"[a-z]+\");\nm = p.matcher(\"test\"\
    );\nSystem.out.println(m.matches()); // prints: true\n```\n\n| Description |\n\
    | :--- |\n| [a-z]+ matches one or more lower case letters |\n\nExample: Validate\
    \ the email format.\n\n| Description |\n| :--- |\n| Matches any number of letters\
    \ or digits |\n\n```\nregex = \"[a-zA-Z0-9]+]+\" + \"@\"\n+ \"\\\\W+\",\n+ \"\\\
    \\.\",\n+ \"com\";\n```\n\n| Description |\n| :--- |\n| Matches the character\
    \ '@' |\n\n| Description |\n| :--- |\n| Matches any number of word characters\
    \ |\n\n| Description |\n| :--- |\n| Matches the character '.' |\n\n```java\np\
    \ = Pattern.compile(regex);\nm = p.matcher(\"John123@site.com\");\nSystem.out.println(m.matches());\
    \ // prints: true\n```\n\n| Description |\n| :--- |\n| Matches the string \"com\"\
    \ |\n\nExample: Extract the user name and website address from email.\n\n```java\n\
    p = Pattern.compile(\"@\");\nString[] ss = p.split(\"John@site.com\");\n```\n\n\
    ```java\nSystem.out.println(ss[0]); prints: John\nSystem.out.println(ss[1]); prints:\
    \ site.com\n```\n\nThe next example is more complicated. It uses the splitAsStream()\
    \ method of the Pattern class to obtain the distinct (unique) words from the input\
    \ text. It also uses a lambda expression to print the results from within the\
    \ forEach() method of the Stream class.\n\n# Example: Extract the distinct (unique)\
    \ words from string.\n\n```java\nimport java.io.*;\nimport java.util.stream.*;\n\
    import java.util.regex.*;\n```\n\n```java\nclass testregex {\n    public static\
    \ void main(String args) {\n        String text = \"a b c a b c def b b b g\"\
    ;\n        Pattern p = Pattern.compile(\" \");\n        Stream<String> stream\
    \ = p.splitAsStream(text);\n        Stream<String> unique = stream.distinct();\n\
    \        unique.forEach(w -> System.out.print(w + \" \"));\n\n        // same\
    \ result can be achieved in one statement:\n        Pattern.compile(\" \")\n \
    \           .splitAsStream(text)\n            .distinct()\n            .forEach(w->System.out.print(w\
    \ + \" \"));\n    }\n}\n```\n\nThe output of the above program is: “a b c def\
    \ g\".\n\n# Example: Replace all blank sequences with semicolons.\n\n```java\n\
    String text = \"One Two Three Four\";\n```\n\n```java\nSystem.out.println(\nPattern.compile(\"\
    \\\\s+\").matcher(text).replaceAll(\";\")\n);\n```\n\n```java\n// prints: One;Two;Four\n\
    ```\n\n# Reflection API\n\nEvery Java program performs some manipulations on objects\
    \ of various types - classes, enumerations, arrays, primitive types, etc. At run\
    \ time, for each type of objects used by the program, the Java Virtual Machine\
    \ (JVM) creates an instance of class Class, which provides methods to examine\
    \ the properties of the object's type. For example, when you declare a class A,\
    \ the JVM builds a corresponding Class object, providing all information about\
    \ class A – its methods, interfaces, annotations, fields, etc.\n\nThe Reflection\
    \ API is a very important component of the Java language. It is used extensively\
    \ by Java Beans (not covered by this book), by various test tools, when working\
    \ with annotations, etc. You can also use it for debugging purposes.\n\n# Obtaining\
    \ the Class object\n\nThere are three primary methods of obtaining the Class object\
    \ for a particular class.\n\nWhen you have an instance of the class you want to\
    \ explore, you can call the instance method getClass() defined by class Object\
    \ and available to all Java objects:\n\n```java\nclass myClass { ... }\n...\n\
    myClass obj = new myClass();\n```\n\n```java\nClass c = obj.getClass();\n```\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_160_0.png)\n\nIn the case when no instances\
    \ of a class are available you can employ the so-called class literal to obtain\
    \ the Class object. A class literal is formed by the class name appended with\
    \ .class:\n\n```java\ninterface myInterface {\n    void methodName();\n}\n\nclass\
    \ myClass { ... }\n\nClass c = myClass.class;\n\nClass i = myInterface.class;\n\
    ```\n\n![](img/7ffd006441be7e70bb67929dee89a427_161_0.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_161_1.png)\n\
    \nFinally, you can use the static method forName() of the class Class. This method\
    \ accepts a fully-qualified name of a class and returns its Class object. Note,\
    \ that the forName() method can throw the ClassNotFoundException.\n\n```java\n\
    class myClass { ... }\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_161_2.png)\n\
    \n```java\nClass c = Class.forName(\"myClass\");\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_161_3.png)\n\
    \n```java\nClass s = Class.forName(\"java.lang.String\");\n```\n\n# Discovering\
    \ Class Members\n\nOnce you get the Class object for the class being examined,\
    \ you can use various methods of Class to obtain more information about the class.\
    \ We will give you one example of obtaining the names of all methods and fields\
    \ declared by a class. Please check the java.lang.reflect package for other reflection\
    \ classes and methods.\n\n```java\nimport java.lang.reflect.*;\n```\n\n```java\n\
    class myClass {\n    private String name;\n    void setName(String s) {this.name\
    \ = s; }\n    String getName() { return name; }\n}\n\npublic static void main(String\
    \ args[]) {\n    Class c = myClass.class;\n\n    try {\n        Method[] methods\
    \ = c.getDeclaredMethods();\n        for (Method m : methods) {\n            System.out.print(\"\
    Method: \" + m.getName());\n        }\n\n        Field[] fields = c.getDeclaredFields();\n\
    \        for (Field f : fields) {\n            System.out.print(\"Field: \" +\
    \ f.getName());\n        }\n    } catch (Exception e) {\n        System.out.println(e);\n\
    \    }\n}\n```\n\n![](img/7ffd006441be7e70bb67929dee89a427_162_0.png)\n\n![](img/7ffd006441be7e70bb67929dee89a427_162_1.png)\n\
    \n![](img/7ffd006441be7e70bb67929dee89a427_162_2.png)\n\nThe above code produces\
    \ the output:\n\nMethod:main Method:getName Method:setName Field:name\n"
  mdcn: "\n\n# 正则表达式\n\n文本字符串内容的验证和操作在许多应用程序中都可以找到。例如，我们可能需要检查输入的电子邮箱地址格式是否有效。正则表达式\
    \ API 是一项强大的工具，Java 程序员可以利用它执行文本验证、解析、分词或其他类型的操作。\n\n正则表达式 API 由两个实用类组成：`Pattern`\
    \ 和 `Matcher`。`Pattern` 类用于构建正则表达式，这些正则表达式被称为模式（patterns）。`Matcher` 类用于将模式应用到文本字符串上。这两个类的用法非常简单，但挑战在于掌握正则表达式技巧，不幸的是，这超出了本书的讨论范围。尽管如此，我们将通过几个示例来让你熟悉可以在文本字符串上执行的操作，并涵盖正则表达式的基础知识。\n\
    \n# 正则表达式基础\n\n正则表达式是字符的序列，用于定义一个可以与文本字符串进行匹配的模式。例如，正则表达式“abc”可以用来检查文本中是否包含“abc”序列。\n\
    \n正则表达式有几种大类。我们将介绍其中三种。\n\n第一类正则表达式被称为“字符”（characters），包含了大多数字符以及转义序列，如 `\\t`（制表符）或\
    \ `\\n`（换行符）。“abc”就是字符正则表达式的一个示例。\n\n第二类正则表达式被称为“字符类”（character classes），代表有效字符范围。例如，`[a-zA-Z]`\
    \ 模式将匹配任何小写或大写字母。\n\n对于某些字符类构造结构，Java 提供了简写形式：\n\n- `.` 匹配任意字符\n- `\\s` 匹配空白字符\n\
    - `\\d` 匹配任意数字\n- `\\w` 匹配任意单词字符\n\n第三类正则表达式构造结构被称为“量词”（quantifiers）。量词可以附加到任何字符或字符类构造上，以指定该构造允许出现的次数：\n\
    \n- `?` 出现一次或不出现\n- `*` 出现零次或多次\n- `+` 出现一次或多次\n- `{n}` 恰好出现 n 次\n- `{n,}` 至少出现\
    \ n 次\n- `{n,m}` 出现 n 到 m 次\n\n还有其他的正则表达式组，但对它们的复习超出了本书的范围。\n\n# 正则表达式示例\n\n在开始示例之前，我们需要提到\
    \ `Pattern` 和 `Matcher` 类没有构造函数。`Pattern` 对象是通过 `Pattern` 类的静态方法 `compile()` 创建的，而\
    \ `Matcher` 对象是通过 `Pattern` 类的实例方法 `matcher()` 创建的。\n\n示例：验证整个文本是否匹配模式。\n\n```java\n\
    String regex;\nPattern p;\nMatcher m;\n\n```\n\np = Pattern.compile(\"[a-z]+\"\
    );\nm = p.matcher(\"test\");\nSystem.out.println(m.matches()); // 输出: true\n```\n\
    \n| 描述 |\n| :--- |\n| [a-z]+ 匹配一个或多个小写字母 |\n\n示例：验证电子邮箱格式。\n\n| 描述 |\n| :--- |\n\
    | 匹配任意数量的字母或数字 |\n\n```\nregex = \"[a-zA-Z0-9]+]+\" + \"@\"\n+ \"\\\\W+\",\n+\
    \ \"\\\\.\",\n+ \"com\";\n```\n\n| 描述 |\n| :--- |\n| 匹配字符 '@' |\n\n| 描述 |\n| :---\
    \ |\n| 匹配任意数量的单词字符 |\n\n| 描述 |\n| :--- |\n| 匹配字符 '.' |\n\n```java\np = Pattern.compile(regex);\n\
    m = p.matcher(\"John123@site.com\");\nSystem.out.println(m.matches()); // 输出:\
    \ true\n```\n\n| 描述 |\n| :--- |\n| 匹配字符串 \"com\" |\n\n示例：从邮箱中提取用户名和网站地址。\n\n```java\n\
    p = Pattern.compile(\"@\");\nString[] ss = p.split(\"John@site.com\");\n```\n\n\
    ```java\nSystem.out.println(ss[0]); 输出: John\nSystem.out.println(ss[1]); 输出: site.com\n\
    ```\n\n下一个示例更为复杂。它使用 `Pattern` 类的 `splitAsStream()` 方法来从输入文本中获取不同的（唯一的）单词。它还使用\
    \ lambda 表达式在 `Stream` 类的 `forEach()` 方法内部打印结果。\n\n# 示例：从字符串提取不同的（唯一的）单词。\n\n\
    ```java\nimport java.io.*;\nimport java.util.stream.*;\nimport java.util.regex.*;\n\
    ```\n\n```java\nclass testregex {\n    public static void main(String args) {\n\
