    \n# Abstract Classes\n\nAbstract class is a class in which one or more methods\
    \ are declared, but not defined (i.e. without a body). To understand why we need\
    \ abstract classes, consider this class hierarchy:\n\n![](img/7ffd006441be7e70bb67929dee89a427_99_0.png)\n\
    \nClass Shape declares the getArea method for calculating the area of a particular\
    \ shape. This method is overridden with actual implementation in each of the subclasses\
    \ – Square and Circle. If we create an object of class Shape, its getArea() would\
    \ have no meaning. Of course, we could make it to return a false value, like zero,\
    \ to indicate that this is not a true shape. A better approach, however, would\
    \ be to altogether disallow the creation of class Shape objects. That's abstract\
    \ classes and abstract methods come in hand.\n\nExample:\n\n```java\nabstract\
    \ class Shape {\n  String methodName;\n  public abstract double getArea(double\
    \ arg);\n  public String getName() { return methodName; }\n\n  public static void\
    \ main(String args[]) {\n    shape a = new Circle();\n    Double area = a.getArea(1);\n\
    \    System.out.println(\"area=\" + area); // prints: \"area=3.1415\"\n  }\n}\n\
    \nclass Circle extends Shape {\n  public double getArea(double arg) {\n    return\
    \ (arg * 3.1415);\n  }\n}\n```\n\n# Anonymous Classes\n\nAn **anonymous class**\
    \ is a class declared within an expression. The definition of the anonymous class\
    \ begins with the keyword **new** and is enclosed within round brackets:\n\n```java\n\
    ( new className() {body of the class} )\n```\n\nThis is equivalent to creating\
    \ an instance of some unnamed class extending the **className**. Being an instance\
    \ of a class, the anonymous class definition can be used in various expressions:\n\
    \n```java\nsomevariable = (anonymous class definition).method();\nsomeMethod(anonymous\
    \ class definition);\n```\n\nConsider a situation when we have Circle calculating\
    \ the area of a circle with this formula: **area = 3.14 * radius * radius**. We\
    \ want to keep the existing class Circle, but increase the precision of this calculation\
    \ by using a new formula: **area = 3.1415926 * radius * radius**.\n\nHere is how\
    \ we can accomplish this with an anonymous class:\n\n```java\nclass circle {\n\
    \    public double getArea(double r) {return 3.14 * r * r;}\n}\n```\n\n```java\n\
    class testClass {\n    public static void main(String args[]) {\n        Circle\
    \ a = new circle();\n        System.out.println(a.getArea(2)); //prints: 12.56\n\
    \n        a = ( new circle() {\n            public double getArea(double r)\n\
    \            {return 3.1415926 * r * r;}\n        };\n\n        System.out.println(a.getArea(2));\
    \ // prints: 12.5663704\n    }\n}\n```\n\n# Interfaces\n\nAn interface is a collection\
    \ of constants, abstract methods, and default methods. The main purpose of interfaces\
    \ is to supply useful constants and methods to classes, and also to expand the\
    \ polymorphism mechanism beyond the class hierarchies.\n\nAn interface can extend\
    \ one or more other interfaces. Interfaces cannot be instantiated (you cannot\
    \ create an object of an interface), but they can be implemented by a class. The\
    \ class implementing an interface must override all abstract methods of the interface,\
    \ otherwise the class will be abstract.\n\nThe example below demonstrates the\
    \ common technique of working with interfaces.\n\nFirst, we declare two interfaces:\
    \ Conversion1 and Conversion2. The Conversion2 interface extends Conversion1 and\
    \ adds one constant and one method.\n\n```java\ninterface Conversion1 {\n    double\
    \ F2C = 5.0 / 9.0;\n    double toCelsius(double t);\n}\n```\n\n```java\ninterface\
    \ Conversion2 extends Conversion1 {\n    double C2F = 9.0 / 5.0;\n    double toFahrenheit(double\
    \ t);\n}\n```\n\nNext, we declare two classes implementing the Conversion2 interface.\
    \ Both classes will have access to the constants declared in Conversion1 and Conversion2\
    \ interfaces, and they must also implement all methods declared in those interfaces.\n\
    \n```java\n// Approximate temperature conversions\nclass myClass1 implement Conversion2\
    \ {\n    public double toFahrenheit(double t) {return t * 2 + 32};\n    public\
    \ double toCelsius(double t) {return (t - 32) / 2};\n}\n```\n\n```java\n// Precise\
    \ temperature conversions\nclass myClass2 implements Conversion2 {\n    public\
    \ double toFahrenheit(double t) {return t * C2F + 32;}\n    public double toCelsius(double\
    \ t) {return (t - 32) * F2C;}\n}\n```\n\nFinally, we create two objects of classes\
    \ myClass1 and myClass2 and execute their instance methods toFahrenheit() and\
    \ toCelsius().\n\n```java\npublic static void main(String args[]) {\n    conversion2\
