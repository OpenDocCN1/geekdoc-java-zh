  md: '# 212


    # Defining Shugendō


    In a stele dedicated to Mount Yudono that was erected in Akenomachi village (Hitachi
    province), there are two anthropomorphic figurines in the space immediately below
    the sacred triad. These dancers are called Shudaeten 須陀会 in reference to the highest
    level of Brahma’s world (Skt. Śuddhāvā), their actual residence. They pay homage
    to the sacred triad while shaking an ornamental crown. Shudaen also appears in
    the illustration of the Sonshō mandara reported in the Kakuzensho (1213), but
    in this stele the head of the heaven god is replaced with a crown in one case
    and a rabbit in the other. To the visual mixture between Shudaeten, the solar
    crow (Yatarasu), and the lunar rabbit (Tsuki usagi), these celestial deities were
    all summoned to pay homage to Dainichi Nyorai of Mount Yudono (Tokamura 2004:
    188–9).


    At this point, it may be worth to ask why the Kanei era saw such a proliferation
    of stelae dedicated to Mount Yudono among communities in the Kantō region. A possible
    answer could be that the early decades of the seventeenth century registered changes
    in the social structures of the rural classes. The cadastral survey ordered by
    Tokugawa Ieyasu (1542–1616) in 1612 led to the promulgation of a new fiscal legislation
    according to peasants who were registered as landowners to pay regular taxes to
    the lord of their domain. Social tensions skyrocketed, because the political offices
    within the village were monopolized by the titled peasants (honyakunin 本役人), who
    constituted an order of class aristocracy that had inherited their ruling privileges
    from pre-century political consoles. The result was that in the seventeenth century
    small peasants (kobyaku 小百姓) shared with titled peasants the majority of the internal
    revenue, differently from the latter, could not participate in the political life
    of the village (Ooms 1996: 76–8). At the same time, titled peasants legitimized
    their dominant position for themselves the exclusive right to sit on the “shrine
    council” (miyaza 宮首) as residents of the village since old times (zakata 屋), whose
    ancestors were venerated as protective gods of the entire rural community (ujigami).
    It goes without saying that the political ostracism of small peasants was strongly
    reverberated in their exclusion from the organization of the religious festivals
    for the kami of the village (Smith 1959: 58–9, 194–6).


    Being completely cut off from this religio-political circulation of power, small
    peasants tried to connect their fiscal contribution to the right to hold administrative
    offices among the bureaucratic circles of the village. At the same time, small
    peasants attempted to make up their status of non-seat holders (hirakata 平方) in
    the shrine council (due to the fact that their ancestors did not belong to the
    ujigami community), by performing alternative practices. It was precisely in this
    turbulent socioeconomic panorama that the construction of mounds and stele dedicated
    to the cult of Mount Yudono reached its apogee. These micro-practices, the devotional
    practices which did not require devotees to be members of the shrine council or
    have their ancestors recognized as ujigami, allowed small peasants to carry out
    their claims and legitimize them through alternative discourses. Toward the end
    of the seventeenth century, most of the legal disputes ended with the actual inclusion
    of small peasants among the political echelon of the village; the sociopolitical
    associated with the cult of Mount Yudono in the Kanei era, took then different
    directions.'
