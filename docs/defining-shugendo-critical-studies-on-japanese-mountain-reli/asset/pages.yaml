    # Images of the Shugenja in Edo Popular Fiction


    William D. Fleming


    This chapter examines Shugendô not through the lens of history or religious practice,
    but as seen in the popular literature of the Edo period. The focus is on Shugendô
    practitioners, known as *shugja* or *yamabushi*. Like the historical *shugenja*
    is a figure on the margins of early modern Japanese literature, particularly from
    the perspective of popular authors and writers ensconced in the urban centers
    of Edo, Kyoto, and Osaka. Nevertheless, *shugenja* make regular cameos across
    wide swaths of early modern Japanese literature. leaping through mountains, emerging
    from rocky shadows, dispelling demons and performing exorcisms, and coming to
    the aid of those in need with powerful magic. Reflecting the prevalence of the
    satirical strain in Edo fiction, there is also a significant body of jokes and
    comic anecdotes in which *shugenja* are held up as objects of ridicule, whether
    hapless charlatans overestimate their own abilities or lust hypocrites satisfying
    their carnal desires at bothers.


    Literary depictions of the *shugenja* are diverse, and widely varied according
    to the context in which they are found. Individual depictions are themselves layered,
    multilayer constructions. This chapter devote its attention to one specific context,
    collections of short-form historical narratives known as the early *yomimon 読本*.
    The stories in these collections typically feature an element of the supernatural
    or “strange,” thereby opening the door for a range of mysterious figures, including
    the *shugenja*. This chapter examines the sorts of characters in Chinese fiction
    them cross-cultural adaptations that drew on Chinese source texts, which were
    mapped onto the *shugenja*, and how the process of adaptation, which was by its
    very nature an act of straightforward conversion, transformed the image of the
    *shugenja*. Certain aspects of historical Shugendô were emphasized and brought
    to the fore, while a layer of residue remained from the source texts, reflecting
    the distinct historical, religious, and literary contexts in which they were produced.
    The result is something new, a hybrid fantasy combining elements of the historical
    *shugenja* and earlier Japanese imaginings thereof with new elements of continental
    origin.'
