    and “Kongo Zao.” In 1078, a fire burnt Ishiyamadera, and the following years were
    characterized by a continuous series of calamities and restorations (Tanabe 1989:
    217–22). In the Shō Kongo Zao, dated, 1078, there is an illustration of the appearance
    of the statues before this period. The statue of Zao Gongen was quickly repaired
    after the fire, and the wooden axe of the original could be maintained. Comparing
    the illustration with the axe, it is possible to establish that Zao Gongen was
    represented with the right foot in the kicking position and the right hand with
    the gripping fist already in the original (Iwata 2002: 10–13). In the basis of
    our discussion so far, we can argue that Zao Gongen Bosatsu enshrined by Shōbob
    on Mount Kinpu was probably based on the Ishiyamadera triptych. There is also
    the possibility that Shōbob himself or someone from his entourage influenced the
    creation of Buddhist tales in which Zao Gongen and the main deity of Ishiyamadera
    appear together, as in the case of the stories about the miraculous finding of
    a vein of gold to coat the exterior part of Vaicro Buddha’s statue at Tōdaiji.


    # On the Statues of Zao Gongen of Mount Kinpu: Ritual Offerings and Manufacturing
    Techniques¹⁰


    The extant statues of Zao Gongen can be divided into two groups. The first group
    includes bronze or copper statues discovered on Mount Kinpu, that is close to
    the main hall of Ōminesanj on the summit of Shōjokate. The second group includes
    those statues of Zao Gongen mostly made of wood that are located on sacred mountains
    in various geographical areas with connections to Mount Kinpu. The statues of
    the first group were created as offerings to be donated to the divine spirit of
    Zao Gongen, which inhabited Mount Kinpu, and were not considered objects of worship.
    The statues of the second group were thought to be alternative deities of Zao
    Gongen’s spirit from Mount Kinpu and were separately enshrined as cult objects.
    For example, statues of this type can also be found in the Nagiredo 像受三仏寺 in Tottori
    prefecture, like those on Mount Kinpu. Some aspects of the devotional practices
    connected with the statues of Zao Gongen are still to be fully understood.


