  md: '# Offering Small Statues of the Buddhas Made with Gilt Bronze in the Late Heian
    Period


    Diaries of aristocrats from the later Heian period include many passages on the
    production of gilt bronze statues of buddha. According to these texts, casters
    were invited to private residences to make these statues in one day. In case of
    funerary ceremonies for the forty-ninth day after death or other urgent situations,
    such statues were also used as main icons for the rituals. In general, these small
    statues were not permanently enshrined in temples; rather, they were intended
    as worship objects for individual people, as main icons in special Buddhist ceremonies
    (法會) or carried to different locations during travels to their portability (Mitushashi
    2000: 52–38).


    Considering the simple finishing that characterizes the statues of Zao Gongen
    on Mount Kinpu, it is possible to argue that they were similar to these small
    gilt statues of buddha. However, it is important to take into account the fact
    that the Zao Gongen statues of Kinpusenji began the preparation of a wooden matrix
    before beginning the actual casting process. It is, therefore, impossible that
    such statues were created in one day. For example, the Taiki (1155) has an entry
    on the process for making a gilt bronze statue of Nyorin commissioned by Fujiwara
    no Yorinaga (1120–56) in 1134.


    According to this text, in the morning of the twenty-ninth day of the third month
    a “matrix” was prepared to create a statue of [Kanon]. During the night of the
    same day Dakunin 寛仁 began making offerings for the deity and prayers were offered
    at the Buddhist ceremony. On the twenty-third day of the fourth month, a “Statue
    of Nyorin [Kanon] of about twenty centimeters was created,” and on the tenth day
    of the sixth month the Midō jushikan [or Jichian] 実歓 (d. 1144) was summoned to
    venerate and present offerings in front of the bronze statue of Nyorin [Kanon].
    Because the prayers were fulfilled, the cast of the statue was completed and it
    was used as the main icon [for rituals]. It is likely that the first matrix was
    made of wood. It is interesting to notice that the completion of the statue took
    place only after the realization of Yorinata’s prayers.


    According to the Midō kanpaku ki (1021), in 1007 on the second day of the eighth
    day, Fujiwara no Michinaga began his pilgrimage to Mount Kinpu in preparation
    for which he had been performing purificatory rituals for one hundred days until
    the seventeenth of the seventh month (Feoman 2005). These practices were considered
    to be essential preliminary activities before the pilgrimage. For the Zao Gongen
    statues of Mount Kinpu, which were probably created during this pilgrimage period,
    it seems that they had to be completed in a short amount of time in order to be
    ready for the beginning of the pilgrimage; this would also explain the rough finishing
    of many of them. It is also possible to argue that extremely crude finishing was
    a prerogative not only of those statues, which were used for a one-time offering
    ritual, but also of other statues, which were worshipped in a series of itinerant
    ceremonies such as those performed during the pilgrimage to Mount Kinpu.'
