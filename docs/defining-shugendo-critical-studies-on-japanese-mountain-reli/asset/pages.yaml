    was undertaken by a lay practitioner once a month, corresponded to an imaginary
    offering of precious gifts, such as 65,000 statues of Buddha, nine tiered stupas,
    or twenty-one Buddhist monasteries. The fujiki kyō allowed lay devotees who would
    never have been able to make such donations with their limited economic means
    to accumulate merit by transforming their ritual fasting into precious gifts.
    It is relevant to underline that the ritual fasting and offering ceremony was
    not a practice without risks. For instance, a different Fujiki no mikki dated
    1681 reports that an incorrect or irregular performance of the fujiki kyō caused
    the practitioner and all her relatives to be reborn at the bottom of hell (mugen
