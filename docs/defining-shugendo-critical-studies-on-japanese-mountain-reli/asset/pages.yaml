    Many aspects of Daoist practice read readily onto Shugendō, making the shugenja
    a convenient counterpart to the Daoist priest in adaptation. The priest''s wooden
    sword, to one of the most straightforward examples, is transformed into the shugenja''s
    staff. Yet the result of this conversion process may be overemphasis those elements
    of Shugendō practice with origins in Daoism, for example, the ninecharacter incantation—ultimately
