    # Yudonosan and the Otake Narrative


    The various etoki and eng suggest a contestation of ownership and throw light
    on geographical, political, economic, and religious relationships between center
    and periphery during the Edo period. There are two aspects to this: the relationship
    between Hagurosan and Yudonos, and the relationship of the religious institutions
    of the Three Mountains to the central government.


    Haguros and Yudonos belonged to two different religious and institutional traditions.
    The shrine-temple complex of Jakkoji joined Haguros. Essentially a medieval entity,
    it was a loose network of various lineages and sects with its Shugendo tradition.
    At the end of the civil war in the sixteenth century, however, it was in disarray
    because of internal conflicts, when different factions supported regional power
    holders, and these laid waste the mountain physically and administratively and
    loosened alliances. Yudonos, by contrast, was centered on four temples, established
    relatively later in comparison with Jakkoji. Like Jakkoji they were affiliated
    with various Shinto schools (see Chapter Eleven by Andrea Castiglioni) the Yudonos
    shrine, where they were allowed to bring pilgrims and perform rituals. These temples
    were associated not so much with Shugendo so as with practitioners called gyonin,
    who committed themselves to lifelong service to the kami and buddhas of Yudonos.


    To keep the danger of uncontrolled religion in check, the newly emergent Tokugawa
    shogunate issued a series of sect-specific regulations had, delineating a hierarchical
    structure. The 1613 Shugendohatto placed all Shugendo groups under the authority
    of either the Tozan or the Honzan. This meant that nominally Haguro Shugendo had
    under the umbrella of one or the other, with which had no traditional links but
    a great deal of antiquity. After such maneuvering, in 1641 Jakkoji, in its person
    of Bett, Tenyu (c.1594–1674), placed itself under the protection of the Tendai
    temple complex Kaneji in Edo, the dominant religious power of the time, thereby
    removing it from either Tozan or Honzan authority. All temples in the Haguros
    complex, whatever their previous affiliation, were required to become Tendai.
    The Yudonosan temples, however, refused to change affiliation, despite Jakkoji''s
    attempts to make them direct branch temples.'
