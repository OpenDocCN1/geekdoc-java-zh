    # Shugendo Romanticism and the Quest for the Original Japanese Spirit


    Shugendo is not only the subject of academic discourses. For decades, it has also
    been the topic of popular, nonacademic courses that see it as one of the sources
    (if not the source excellence) of Japanese religion and spirituality, as directly
    related to some past—very often, the yok prehistoric civilization. It goes without
    saying that the average Japanese understanding of Shugendo (it is surprising that
    many Japanese know nothing about it) is informed by nonacademic courses than by
    scholarly research. A typical example among is religious scholar Kubota Nobuhiro
    Kubo 久田広弘 (1941–2016). As the subtitle of the book makes clear, Shugendo is a
    “universe of primordial life-force.” According to Kubota, Shugendo is at the core
    of the totality of Japanese religion, as it has at its foundation the principle
    of “coexistence of life (seimei 生命生命; Kubota 2005: 12), a formula that suggests
    a not-better defined harmony between humans and nature. This is possible because
    the core of Shugendo is an attitude of awe, and veneration, of nature—which is
    also at the very basis of Japanese religion as a whole (Kubota 2005). In practice,
    this fundamental attribute results in the principle ikashai 生しあい, a term that
    is difficult to render in English but suggests promoting and sustain each other
    life’s possibilities (Kubota says that Shugendo has always been considered heretical
    in Japanese Buddhism and religion in general (Kubota 2005: 10)—without giving
    any explanation as to why such fundamental movement ended up being marginalized.
    In any case, because of its stance toward nature, Shugendo is a necessary force
    against the supremacy of science in today’s society: “science sees nature as the
