  md: '# The Arrival of Shugendō to Togakushi


    The introduction of Shugendō to Togakushi happened relatively late when compared
    with its emergence in the Kii peninsula. Material evidence of ascetic practices
    on the slopes of Togakushi date back to the Heian period, a self-conscious soul
    of Shugendō only emerged in the sixteenth century, thanks to a pivotal transmission
    from Mount Hiko. In the mid-1520s—the Hiko ascetic Akyūbō 阿笈部传 (1509–1583) reportedly
    populated Togakushi''s chief administrator and his successor into the Hiko-style
    entry (mineiri or nyūbu) and shared two collections of kirigami of Shugendō ritual
    protocols.


    The first evidence that the lineage of Shugendō had root at Togakushi appears
    in a text as the *Shugen mondō (Inquiries in Shugen[-dō]). According to its colophon,
    it was composed in 1561 and belonged to Togakushi''s central temple of Chūn. Its
    tone and vocabulary reflect the emergence at Togakushi as a self-conscious system
    at this time. For example, the authors claim to distinguish Shugendō from the
    traditional schools of Buddhism while simultaneously placing it on par with them.
    Another sign of the recent appearance, the text is abundant in *yamushi, sendatsu
    先达, nyūbu, and shugen* that was absent from Shugen lexicon in the fifteenth century
    and earlier.


    Much of the content of Shugendō recalls its origins in northern Kyushu. This includes
    a lineage of Shugendō passed down from En no Gyō to a Hiko practitioner named
    Chikhō before its eventual transmission to Togakushi (*Shugen mondō 391*). It
    also provides detailed explanations of peak entry rituals based on the three seasonal
    entries in the Hiko region. Advancing the logic, calendar, and institutional parameters
    of the Hiko entry, the Shugen mondō reveals the extent to which Togakushi had
    incorporated the Shugendō of northern Kyushu.


    To begin with, the spring entry is referred to as the Spring Peak. It signifies
    the progression from seed to fruit and constitutes the practice of the Womb Realm.
    It is called the peak of forward movement, because one moves upward in pursuit
    of awakening. The autumn entry is referred to as the Autumn Peak. It signifies
    a turn from fruit back to the seed and constitutes the practice of the Diamond
    Realm. It is called the peak of reverse movement, because one moves downward in
    order to transform living beings. Together they make up the two practices of the
    twofold (*mandalas*). The beginning and end of the flowering ritual concerns neither
    the fruit but the seed and fruit as well as the nonduality of the Womb and Diamond.
    One fully obtains the realization of one''s own body as a buddha (*sokoshin sokubutsu*)
    in this way. Upon the fourth completion of the Three Peaks Practice (*sanbu shugyō*),
    one achieves the rank of sendatsu. He is then able to guide novices (*shinkyaku*),
    enabling them to attain perfect and complete buddhahood.


    > (Shugen mondō, 388)


    Given the parallels in the ritual calendar and symbolism in this passage with
    the writings of Akyūbō, the link between the two sites is unmistakable.'
