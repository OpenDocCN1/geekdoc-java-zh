  md: '# Shape of Devotion


    The Dainichi Nyorai of the Diamond Realm in the Sonshō mandara, a passage in the
    Henkushō 口縁 (thirteenth century) explains that: “The cosmic buddha Dainichi of
    the Diamond Realm [of the Sonshō mandara] corresponds to the Dainichi of the non-duality
    between the Womb and the Diamond (Ryōbu funi Dainichi); the two attendants, Fudō
    and Gōzō, correspond to the alternation of the teachings [of the Womb and Diamond
    mandala]” (Park 2000: 55). In other words, the Sonshō mandara the Dainichi Nyorai
    of the Diamond Realm symbolizes the non-duality, or the stable stability, between
    the Womb and Diamond mandala while Fudō, and the Taizokai mandala, the Kongōkai
    mandara, represent the perpetual motion and circulation of these two teachings.
    Because specifically defined as Dainichi of the Two Realms of the Womb and Diamond,
    it is evident that the issei gōyin relies on the iconographical and doctrinal
    characteristics of the Sonshō mandara to materially display the ultimate nature
    of the cosmic buddha of Yudono.


    It is important to note that the approximation of the basic pattern of the Sonshō
    mandara was no mere duplication of the original, but included innovative elements.
    For instance, the sacred triad is always located in the lower part of the stele.
    Dainichi Nyorai of the Diamond Realm sits on a bipartite throne placed on top
    of an incense burner and makes the hand gesture of the knowledge fist. Fudō and
    Gōzō stand on gem that reproduce the bases of two platforms for the fire ritual.
    The entire body of Dainichi Nyorai of the Diamond Realm is enveloped in the extremely
    long pendants of an enormous jewel crown that resembles a celestial membrane surrounding
    an embryo. In the middle of the jewel there is a small cross that symbolizes the
    stars and, in particular, Ursa Major, which regulates the life and death of sentient
    beings. Over the jewel crown is a heavenly canopy that ensures untold protection
    for Dainichi Nyorai’s body. The entire space of the triad is filled with stylized
    triangles that represent fulfilling jewels, and. On the upper part of the stele
    is a representation of celestial bodies and meteorological phenomena: the sun,
    the moon, and a big cross that represents the stars. This big cross is placed
    over the fire halo of Gōzeni, while a swastika rotated in the clockwise direction
    appears over the head of Fudō. The shape of the clouds is extremely interesting
    because it creates an inter-visual effect of the body of a dragon (ryū) that is
    intent on devouring the sun while a half-moon rests on its tail. From the perspective
    of this dragon disk is not only the sun but also the magic of the Daoist tradition
    that breathes immortality.


    Moreover, the Sadaishi kō rokuza nenbutsu 定音译称六座念仏 (eighteenth century) of Shida
    in Hitachi province (present-day Ibaraki prefecture) reports that one of the names
    of Yududo Gongen was Dainichi Dairyū [great dragon] Gongen, another part of the
    dragon-like aspect of this deity. The clouds, were fundamental elements for the
    fertility of the crops, became at the same time, the body of a celestial dragon
    and of Yududo Gongen. Thanks to this visual conflation, the provincial trace kami
    (sujakushin) of Dainichi Nyorai of the Two Realms of Diamond and Womb—namely,
    Yududo Gongen—could be represented disguised as a dragon extending its claws over
