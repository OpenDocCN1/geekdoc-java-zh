    # # The Cult and Statuary of Zaō Gōen


    Fujioka Yutaka


    *Translation by Andrea Castiglione*


    Buddhism has always considered mountains as cultic sites. Starting with the Kusharon
    (Skt. *Abhidharmakośāstra*), in numerous Buddhist scriptures the structure of
    the cosmos is centered around Mount Sumeru where the divine protectors of Buddhism
    reside. The highest level of the heavenly realm, above this mountain, represents
    the land of perfect enlightenment. For example, this cosmology is visually displayed
    in the engravings on the lotus petals of the gilt bronze statue for the Vairocana
    Buddha at Tōdōji.


    Besides Mount Sumeru, which is a mountain existing only in the scriptures, there
    are also real sacred mountains such as the Vulture Peak (Skt. *Gṛdhrakūta*) in
    the present-state of Bihar in India. This mountain is located to the northeast
    of Rajāghar, the capital of the ancient state of Magadha, and here Sākyamuni preached
    important scriptures such as the *Lotus Sutra* (Skt. *Saddharma puṇdarkarika sūtra*)
    and the *Sutra of the Meditation on the Buddha of Immeasurable Life* (Skt. *Amitāyar
    dhyāna sūtra*) during his last rebirth. According to legends, the abode of the
    Bodhisattva Kannon is located on a floating mountain called Putaka, which is located
    somewhere in the sea of India. The idea of sacred mountains as abodes of buddhas
    and bodhisvas is not peculiar to India but is common to every region of Asia.
    For example, in China, Mount Wutai was considered to be the sacred place of the
    Bodhisattva Mañūrī; Mount Emei of the Bodhisattva Samanthadhara; Mount Put was
    the site where the Bodhisattva experienced his last rebirth; and Mount Tiantai
    was a numinous location of which ancient times.


    Mountains were taken in great consideration not only as places where buddhas manifest
    themselves but also as ascetic spots for purificatory practices. Mountains became
    sites for building Buddhist halls, consecrating Buddhist statues, meditating,
    and reciting scriptures. These circumstances explain why, in Chinese and Korean
    mountains, there are numerous stone caves and buddha figures carved in natural
    rocks (magai butsu). Because mountains were perceived as sacred sites in Southeast
    Asia, they were also considered ideal places to perform rituals. These mountains,
    before being conceived as abodes for buddhas or bodhisvas, were almost invariably
    sacred territories prior to the arrival of Buddhism and had functioned as *trait
    d''union* between this religion and preexisting local cults. As Buddhism developed'
