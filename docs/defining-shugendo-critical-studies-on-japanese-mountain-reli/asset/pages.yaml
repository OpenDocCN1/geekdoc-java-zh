    Shinkei yuzurijō saw the "way of shugen" as separate from the exo-esoteric system;
    one step further and Shugendō became its additional component.

    It is not easy to explain the power of Shugendō. At Onōji, for example, Jitokushū
    徳集 (1345) describes Midera (i.e., Onōji) and its schools as "the sole entity that
    serves the country by cumulating the "three matters" of exoterism, esoterism,
    and shugen." The same argument is used at Myōtsūji;[we, the clergy pray for peace
    upon the country by way of the three matters of exoterism, esoterism, and shugen."]
    Prayers for "protection of the country" served as a unifying factor. In sense
    too, Shugendō must be considered as part of the framework of exo-esoteric Buddhism
    and its institutions.


    # Conclusion


    In this chapter, I began by examining the meaning and evolution of the expression
    shugen, of mountain practice, and of yamabushi and ended with a discussion of
    the formation of Shugendō as a concept. Many obscure points remain as Shugendō
    is not a clear-cut phenomenon, but I think we have at least ascertained the historical
    process through which it came into.

    Even Shugendō was established as one of the constitutive elements of exo-esoteric
    Buddhism and its institutions, it took a long time until a concrete organization
    emerged. It is a well-known fact that the system centering on the Honzan branch
    (linked to Tendai Buddhism) and on the Tozan branch took shape in the early modern
    period. Moreover, the formation processes of these two branches were not parallel
    (Sekiguchi 2009, 2015, 2017). The end of the fourteenth and seventeenth centuries
    indeed represented a transitional period for the history of Shugendō.


    Further research on the development of the organization of Shugendō is needed.
    It is important to note that the study of Shugendō history, including my own work,
    has been overly restricted to the Honzan and Tozan branches. As a result, a variety
    of issues has been overlooked (Hasegawa 2015, 2016). It would be worthwhile to
    look at the type of Shugendō that developed at the Katsuragawa Myōin in relation
    to Ōme and yamabushi at Toōji. With regard to Toōji in particular, Tōji jiissō
    shūgaku kotogaki suikaan 東京寺修學事抄追加録 (Mamakura ibun no. 2728; 1321.2) includes
