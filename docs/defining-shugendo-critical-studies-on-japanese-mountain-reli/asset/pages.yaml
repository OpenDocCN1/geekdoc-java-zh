    # The Idea of the “Founder” and the Present


    Traditions associated with those who “opened” mountains all over Japan have come
    down to us through legendary history (engi 縁紀) and oral lore. Since, however,
    the year of the foundation (the “opening of the mountain,” kaizen開山) is regarded
    as a later fabrication and even the very veracity of the history is open to question,
    the dates of the foundation and the identity of the founder have remained outside
    the concerns of historiography and have not been considered from the standpoint
