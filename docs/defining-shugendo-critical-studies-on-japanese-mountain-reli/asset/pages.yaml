  md: '# # Introduction: Shugendō and Its Metamorphoses


    Andrea Castiglioni, Carina Roth, and Fabio Rambelli


    Shugendō 修験道 is the name given to a Japanese religious tradition centering on
    ascetic practice in the mountains. Taken literally, Shugendō means “the Way to
    achieve miraculous powers through practice.” Unfortunately (or fortunately), there
    exists no convenient or standard translation for this expression, and which you
    will find in this book a variety of different interpretations for it, depending
    on what aspect of the tradition is emphasized. Beyond its enigmatic denomination,
    Shugendō may, however, be described quite readily. On the one hand, it places
    natural environment at the core of its practices, with ritualized “mountain environments”
    (nyūbu 入峰) as its most defining feature. On the other hand, Shugendō focuses on
    the acquisition of special powers (results) aimed at both spiritual advancement
    and ensuring a livelihood through healing and exorcisms, as well as more standard
    religious services. Shugen practices may be traced back to the end of the Heian
    period (twelfth century), and austerities and religious activities in the mountains
    could be identified in the broad sense of Shugendō, perhaps even defined as a
    kind of “proto-Shugendō.” However, as a discrete and independent religious movement,
    Shugendō emerged towards the end of the thirteenth century. From its inception
    to today, it bears doctrinal links to Shinto and Tendai Buddhism, the two main
    traditions of Esoteric Buddhism in Japan. Another defining characteristic of Shugendō
    is the fact that it incorporates practices, rites, and deities from the whole
    spectrum of Japanese religions.


    Hence, Zen or Pure Land schools, Shugendō is best considered a sectarian movement
    that developed within the broad panorama of medieval Buddhism towards the end
    of the thirteenth century. Compared to Zen and Pure Land counterparts, Shugendō
    practitioners (shugenja 修験), institutions, and religious activities tended to
    have a more symbiotic relationship with similar elements in the exo-esoteric Buddhist
    system (Kenmitsu 密教体系) that was pervasive in medieval Japan. For example, Shugendō
    institutions and shugen often created collaborative and synergetic networks with
    Buddhist monks, other groups of ascetics, and religious fraternities of lay devotees
    (講). This porous and flexible structure, which came to be judicially regulated
    only at the beginning of the seventeenth century, has been the cause of its near-total
    erasure from most of the academic narratives over mainstream Japanese religious
    traditions—narratives that privileged'
