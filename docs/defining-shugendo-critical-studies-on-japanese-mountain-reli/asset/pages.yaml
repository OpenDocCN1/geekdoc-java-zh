    Murayama Shichi’s general outline of Shugendō history, and Suzuki Shōei and Shinjō
    Mieko’s empirical research constitute exceptions to the rule (Murayama 1970; Shinjō
    1999 [1980]; Suzuki 2003 [1964, 1965]).


    Eventially, it was in the field of medieval Japanese religions that a shift occurred
    toward an interest for historical studies of Shugendō. The trigger to shift this
    was the questions raised by Kuroda Toshio on the exo-oteric system (kenmitsu taisisen
    密密制) and the distribution of power among medieval temples and shrines (Kuroda
