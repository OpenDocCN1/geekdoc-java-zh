    focused on redefining exo-oteric Buddhism, which had been considered a remnant
    of classical Japanese Buddhism as the dominant ideology running through the medieval
    state and society. On the other, he saw the power residing in exo-oteric temples
    and shrines as constituting a tremendous political and social source of influence
    that spread its roots widely in Japanese society. Kuroda led by emphasizing the
    need to take these themes concretely through the history of temples and shrines.
    His initiative was immediately followed by a large number of studies on exo-oteric
    Buddhism and religious institutions by a wide group of scholars.'
