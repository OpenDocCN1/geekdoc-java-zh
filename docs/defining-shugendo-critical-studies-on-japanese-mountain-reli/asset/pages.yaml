    "Folk religion” is a central theme for Miyake Hitoshi, which understands within
    the framework of the opposite concepts of “founder religion” and “natural religion.”
    The former tends towards world religions, while the latter tends ethnic religion.
    “Ethnic religion” and “world religion” are used here as contrasting concepts from
    the field of religious studies (Miyake 1994: 28–9). Here, “folk religion” is that
    domain where folk beliefs and contemporary mix in complex ways. Of central importance
    is who is involved with them: common people (jōmin 普通) in the case of folk beliefs
    and popular religious figures in the case of combinatory religion. Miyake’s main
    focus is folk religion as the site of a complex interplay between these two types
