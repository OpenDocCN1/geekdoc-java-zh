  md: '# A Critical History of the Study of Shugendo


    2,600 years of imperial rule in 1940. Japanese nationalism strengthened in stages
    and became more radical. The political use of Shugendo occurred in the last stage,
    the high point of Japanese fascism, when attempts were made to employ it to unify
    the spirit of the masses. At its basis was state control and discipline of body
