  md: '# Introduction


    heap of anti-modern and obscurantist superstitions. Initially, Shugendo institutions
    and practitioners were deeply impacted and shugenja apparently disappeared from
    the religious panorama of the Meiji period (1868–1911). Nevertheless, Suzuki Masataka
    鈴木正宗 and Hayashi Makoto 林峰 both point out in the first and fifth chapters of this,
    the suppression of Shugendo was never carried out systematically. Even during
    the Meiji period, shugenja and other groups of ascetic kept providing lay devotees
    with their religious services. They merely used religious texts and institutional
    affiliations that were different from the outlawed Shugendo ones and continuing
    pilgrimages toward numerous mountains. At the same time, the Meiji period marked
    the beginning of a newly coined identity for Shugendo. At the time which Shugendo
    was formally destroyed as an actively practiced religious tradition, it was resuscated
    and reinvented through academic writings and Buddhist editor projects. These endeavors
    contributed to keeping alive its textual and doctrinal heritage until Shugendo
    was eventually rehabilitated after the Second World War. Nevertheless, when Shugendo
    was reinstated, by the promulgation of the New Constitution in 1946, it was a
    shadow of its former self. It remains a living tradition to this day. It is currently
    gaining new momentum, thanks to the growing interest, both in Japan and internationally,
    for eco-spiritual concerns, a fertile crossroads for Shugendo.

    The following introductory pages are an attempt at providing a critical analysis
    of the most relevant formative processes of Shugendo studies, by taking into consideration
    the agendas of the hermeneutic discourses produced by generations of Shugendo
    scholars in Japan and abroad.


    # The Second Wave of Shugendo Studies in Japan


    If every can be considered a new beginning, the 1872 legislative banishment of
    Shugendo and the following crisis, which shook the entirety of its institutions
    and practitioners, became the trigger for a radical metamorphosis of religious
    tradition. Shugendo as an assemblage of ritual practices, doctrinal transmissions,
    and performers in flesh and bone withdrew into the recesses of society while a
    new form of Shugendo came to light, first as a canonized collection of texts and
