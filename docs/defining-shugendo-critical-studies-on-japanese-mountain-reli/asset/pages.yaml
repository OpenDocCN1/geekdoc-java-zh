    The title of Gongen, which follows the name of Zaō, indicates a provisional manifestation
    of a buddha or a bodhisattva as a different entity and is a typical Buddhist title
    usually granted to Japanese local deities, based on the combinatorial system associating
    original grounds and providences (honji sujakya). The first appearance of the
    name of Zaō Gongen is in the inscription of a bronze sutra box, Fujiwara no Michinaga
    (966–1027) buried in a moat (kyōuka 経域) on Mount Kinpu in 1007 (Table 10.1, point
    7). The sentence “Praise to the Dharma-preacher Shaka Zaō Gongen (Namu kyōsha
    Shaka Zaō Gongen) identifies Zaō as a provisional manifestation or an apparitional
    body (結身一体) of the Buddha Sakyamuni. The colophon of the Lotus Sutra, transcribed
