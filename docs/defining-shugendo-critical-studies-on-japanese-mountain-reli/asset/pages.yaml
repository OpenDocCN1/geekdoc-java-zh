    along the way. Renward Cysat (1545–1614), for example, a Swiss pharmacist, town
    clerk of Lucerne, and eclectic autodidact, ensued a compilation of Jesuit accounts
    so successful that it was reread twice in a row shortly after its first publication
    in 1586 (Rotterdam 1965: 46). Drawing on the correspondence and yearly reports
    of Italian priests, he took over their association of the Yamambush with the devil
    (Wahrhaiger Bericht von den unerfunden japanischen Inseln und Königreich 1586).


    One century later, the German physician Engelbert Kaemfer (1651–1716) rendered
    a more nuanced image of the yamambush, with particular attention to their attire
    and rites. Kaemfer’s account paved the way for a less stigmatized image of the
    yamabushi. In his heutigen Japan (Today’s Japan), mentions of yamabushi are frequent
    and common enough to indicate that Shugendô was part of the general religious
    landscape, even though its specifics in details and practices set it apart from
    other traditions. Kaemfer sometimes assimilates yamabushi with “Shinto hermits,”
    and draws a clear distinction between Shugendo and Buddhist. In a survey of the
    religious population in Japan, he classifies yamabushi as an entirely independent
    character. Currently remarkable is Kaemfer’s detailed account of the various elements
    of the yamabushi’s attire, which evinces both the consistency through time (most
    accessories are still in use) and Kaemfer’s talents as a keen observer (Kaemfer
    1999; Aceval 2011).


    Closer to our times, nineteenth-century Western travelers to Japan, as with Basil
    Chamberlain (1850–1935), Émile Gumeit (1836–1918), and Lafacio Hern (1850–1904),
    made encounters with yamabushi, often reflecting the mix of scorn and caution
    registered toward Shugendo practitioners in Japanese literature of the Edo period
    (see William Fleming’s contribution to this book). In the classical and medieval
    periods, mountain practitioners tended to be depicted respectfully, if not with
    downright fear and awe. Although there are some critical assessments, overall,
    yamabushi were considered to have acquired special powers through the severity
    of ascetic practices. With their gradual sedentarization in the Edo period, however,
    and a growing entanglement with “ordinary” society, Shugendo practitioners increasingly
    became subjects of derision, as their portrayal in kyōgen shows quite plainly
    (see Morley 1993).


