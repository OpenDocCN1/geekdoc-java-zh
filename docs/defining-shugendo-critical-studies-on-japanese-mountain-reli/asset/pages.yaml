  md: '# Defining Shugendō


    clear-cut and easily definable institutions and teachings. In other cases, Shugendō
    was simply relegated to the indefiniteness of interpretive labels such as "folklore
    studies" or "popular religions."


    This book presents a collection of Shugendō studies written by a pool of Japanese
    and Euro-American scholars who share new interpretive visions about Shugendō history,
    culture, and religious heritage. Because this text is not an introduction to Shugendō
    per se, it seems appropriate to provide the reader with some key concepts about
    Shugendō terms, logic, and practices to better interact with the contents of the
    following pages. By the thirteenth century, the term *yamabushi* 山伏—those who
    lie in mountains—denoted a vast range of religious professionals who may or not
    have had specific institutional affiliations and mastered a variety of rituals
    such as healing ceremonies, purification procedures, and exorcisms. Pre-thirteenth-century
    *yamabushi* did not specifically conceive of mountains as elective sites for their
    practices and, on the contrary, extremely active among members of the lesser aristocracy
    of the imperial capital. From the second half of the thirteenth century, the performance
    of ascetic practices in the mountains and the importance of religious specialists
    such as *shugja*—those whose [supernatural] results through [ascetic]—who increasingly
    linked their socioreligious charisma became a predominant trend. Then, the general
    term yamabushi became conflated with mountain asceticism in particular (Hasegawa
    1991: 23–4, as well as his chapter in this book).


    It is impossible to provide an exhaustive description of the ritual procedures
    and doctrinal constructs that characterized the mountain-entry rituals performed
    by *shugja* during the seasonal self-selection periods on a mountain before the
    fifteenth century. In general, during the mountain-entry rituals, the geophysical
    body of the mountain was conceived as a mandala, while the act of ascending or
    descending to equal proportions or regressions in the ten realms (*jikkai* 界)
    of the Buddhist cosmology. The foot of the mountain hosted elites, whereas the
    top was visualized as the entrance into the realm of buddhhood. The sotological
    target of Shugendō, which was reified through the mountain-entry rituals, was
    to allow *shugja* to realize perfect buddhahood and non-duality with the cosmic
    Buddha Dainichi Nyorai 大日如来 while penetrating the inner space of the mountain.
    From an institutional point of view, the participation in mountain-entry rituals
    guaranteed *shugja* career promotions within the Shugendō ranking system and,
    at the same time, an individual process of empowerment (*genriki* 验), produced
    social capital for legitimizing the religious status and efficacy of Shugendō
    among lay devotees and practitioners.


    The arrival of "modernity" caused a disastrous event for Shugendō, which was officially
    banned by the Meiji government in 1872 within the context of religious reforms
    at the separation of *kami* and buddhas (*shinbutsu bunri* 神分分離). Because the
    doctrinal logic and worship practices of Shugendō tradition were based on combinatory
    paradigms between (foreign) Buddhist deities and local gods (*kami* 神), Meiji
    oligarchs perceived it as a threat to the new national policy, the authority of
    which was entirely centered on *kami*-related discourses. The result was a legalized
    ostracism and a forced eradication of Shugendō, which was consequently stigmatized
    as a deleterious'
