    a close relationship with mountains in India, so, too, the phenomenon occur in
    Japan. A short time after the transmission of Buddhism, the temple Hisodera 比寺
    was built on Mount Yoshino, which immediately became a renowned center for meditation
    and ascetic practices. From that moment, in each region of Japan, mountain-temples
    (yamadera 山) were founded on mountainous sites, which were already venerated in
    local religious systems and distinguished themselves for peculiar natural features
    or location in the territory.


    Mount Kinpu 金峯山, situated in the southern part of Nara prefecture, can be considered
    the most paradigmatic sacred mountain of Japan (Blair 2015). A broad definition
    of Mount Kinpu includes the mountainous range, which goes from Mount Ōmi to a
    place called 大阪座 immediately after Sanjogatake 山上岳 on Mount Ōmine 大峰. Ancient
    and medieval sources provide a narrow definition of Mount Kinpu, which basically
    overlaps with Sanjogatake. Toward the end of the seventh century, no Gōja climbed
    Mount Kinpu. From that moment forward, numerous Buddhist ascetics arrived on the
    mountain to perform their practices. This chapter is dedicated to the cult of
    Zaō Gongen 蔵王権, which is worshipped as the tutelage deity of this site.


    According to legends, Zaō Gongen manifested his exterior form as a deity when
    humans were performing ascetic practices on Mount Kinpu. In this chapter, I first
    take into account discourses Zaō Gongen, and then discuss status of Zaō Gongen
    as concrete elements of the cult to this deity, as a way to explain developments
    in the relationship between images and doctrines dedicated to Zaō Gongen. I also
    analyze the techniques and manufacturing processes used to build the numerous
    gilt bronze statues that were offered to Zaō Gongen on Mount Kinpu, referring
    to other Buddhist statues of the same period and by showing the connections between
    these objects and the ritual pilgrages to Mount Kinpu.


    # Discourses on Zaō Gongen 4


    Although Mount Kinpu is said to have been opened by En Gōja, it is not clear in
    fact since shugenja started to consider it a sacred land. According to the Nihon
    ryoki (824), Kōtsatsu 広遍 (Shimotsuke Ason 下毛野野) who had performed ascetic practices
    on Mount Kinpu during the reign of Emperor Shōmu received the title of meditation
    *zenji* in 772 together with nine monks. In the Sango shiki (797), Kūkai (774–835)
    wrote that he had practised asceticism on the same mountain. In the Shōyoshi 性集,
    Kūkai explains that he had caught the sight of the numerous site of Mount Kinpu
    after walking for one day from Mount Yoshino and then for two more days. It is
    likely that the place reached by Kūkai on the first day of walking was precisely
    already in the late Nara period (710–84) Mount Kinpu was considered as a suitable
    site for performing mountain ascetic practices (sangaku tesō 山岳添撮) and worship
    activities. However, it is impossible to ascertain the presence of a cult specifically
    dedicated to Zaō Gongen at this early stage.'
