  md: '# Cult and Statuary of Zao Gongen 177


    image of me and chant my name. If you respectfully pray in front of it, I will
    certainly respond to your supplications.” In this passage, Daijōitokuten orders
    Nichizō to make a statue with his features and promises to bestow benefits for
    those who recite his name. It is possible shugenja kept producing statues of Zao
    Gongen, basing their devotional behavior on the logic of this episode.


    Most of the statues of Zao Gongen discovered on Mon Kinpu date from the end of
    the Heian (794–1185) to the Kamakura periods and show a peculiar color due to
    the fact that they were made of bronze. Unlike the sutra boxes used during the
    rituals of Buddhist scriptures, the materiality of Zao Gongen’s statues indicates
    they were supposed to last until Miroku’s descent on earth.


    In spite of this attempt to reach a high degree of durability, every metal statue
    of Zao Gongen presents a different level of completeness. Some of them seem at
    incomplete due to the numerous copper busts, which formed in correspondence to
    the matrix joints during the casting process. Nevertheless, when examined with
    fluorescent X-rays, even rough statues show that the artists took time to do the
    external coating with wax.


    Table 10.2 shows the analysis of the chemical components and casting techniques
    of the twenty-six statues of Zao Gongen that were excavated on the top of Sanjōgate
    and have been indicated as important cultural properties (see Figure 10.3). Some
    of these statues are made combining two cases, one for the front and the other
    for the back; others were constituted of a single case, which was probably following
    the lost wax technique.¹ The joints of the mold should not be clearly visible,
    but in numerous statues there are residual bumps. Some parts of the arms, hair,
    and garments were separately molded and subsequently added to the statue, even
    this seems an unnecessary operation in the case of a standard casting with the
    wax technique. In the majority of cases the small bumps on the garments are due
    to fractures in the molds rather than created for aesthetic reasons.


    The bronze coating of these statues is usually very thin and the iron core is
    replaced by a sort of internal scaffolding of iron nails, which holds the torso,
    legs, and arms. In numerous statues, the part of the body under the shoulders
    was created following a process resembling the one used to make wooden statues
    towards the end of the Heian period. This casting procedure can be summarized
    as follows:


    +   (1) A wooden statue is smeared with earth in order to create the shape for
    the external mold.

    (2) The wooden matrix is removed and a sprue is created before firing the external
    mold.

    (3) The external mold is filled with earth in order to create another internal
    mold to which an iron core and nails are added as structural supports for the
    statue’s body.

    (4) The surface of the internal mold is lightly shaved off in order to be placed
    in the inner part of the statue.

    (5) The external and internal molds are joined together to the iron core and nails.

    (6) After firing the molds, metal is eliminated and cast into it.

    (7) The sprue and accessories are added to the statue’s body, which is also polished,
    gilded, and colored.'
