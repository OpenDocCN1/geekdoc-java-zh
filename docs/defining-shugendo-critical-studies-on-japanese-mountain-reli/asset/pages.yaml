    The World Heritage program has three components, namely, cultural, natural, and
    mixed (both cultural and natural), and is dependent on “outstanding universal
    value,” predicated on the idea of “cultural value.” What is considered “world
    heritage” is, however, gradually changing. Since a large number of items on the
    original list were properties associated with Christianity, there was a certain
    bias towards the north-south hemisphere. In an effort to overcome this north-south
    cultural divide, the idea of “cultural landscape” was introduced in 1992 (Suzuki
    2015a). As a result, the number of Japanese people on the list increased rapidly.
    In 2013, “Mt. Fuji, sacred place and source of artistic inspiration” was listed
