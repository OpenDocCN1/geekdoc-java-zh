  md: '# Religious Culture in Transition


    The intended uses and socioeconomic context in each case. However, their relative
    prominence during divergent historical moments is nonetheless a valuable indicator
    of how and why the mountain was being re-imagined during the seventeenth-century
    transition. The block-printed *mandara* represent another phase in the shifting
    visual imaginaries of the mountain generated over time by diverse socioreligious
    interests. They overlapped in aim with the more ostentatious sank mandala—after
    all, both genres were designed to inspire and inform. But they also document a
    general trend toward convenient encapsulation of religious meaning. The *Kuson*
    prints in particular preview the cost-effective images that Fujikō members would
    later disseminate on a wide scale.


    The production of visual relics of Japan’s great mountain has been a characteristic
    feature of Fujii devotionalism throughout its history, and the graphic materials
    produced by the incipient Fujii *kō* in the seventeenth century are among the
    most distinct and intriguing in this corpus. The earlier sankei mandala, these
    works were religiously inspired depictions of the mountain, but they were not
    used as visionary itineraries targeted toward hallowed topography that one might
    traverse in order to attain religious salvation or enlightenment; the new Fujii
    devotees were no longer being invited to contemplate a ritual that would culminate
    in Amida’s Pure Land, or to conceptualize the mountain as embodiment of the essential-ground
    Buddha, Dainichi. The emerging Fujii “mandara” for the most part omit or portray
    images of Buddhas and bodhisatvas, as they continue to echo the idea of an all-powerful
    deity who manifests through multiple auxiliary forms.


    # Ritual Refigurations


    The new genre of Mt. Fuji images originated with the founding figure, Kakuyō Tobetsu.
    He is believed to have been active in the Mt. Fuji area during the late medieval
    and early Edo periods, as we have seen, shrine priests and mountain guides affiliated
    with the well-established Senji-Murayama complex activities along the frontal
    approach to Mt. Fuji. It is possible, as Endō Hideo has suggested, that by the
    sixteenth century Kakuyō acknowledged the *omoteguchi* and practiced on the northern
    side of the mountain because Murayama shugenja, who enjoyed the protection of
    the domain lord of Suruga, tightly controlled Mt. Fuji’s southern trails (Endō
    2000: 55). Even after the Tokugawa shunate was in place, Kakuyō’s followers continued
    to have little to do with the Honzan-line *yamabushi* at Murayama and (Miyaji
    and Hirano 1929: 826–7). Given the paucity of historical documentation of Kakuyō’s
    activities, his precise relationship (or lack of it) with other religious specialists
    in the Mt. Fuji area remain unclear for the time being.³⁷ However, considering
    the well-regulated nature of the *omoteguchi* enterprise during his lifetime,
    Endō’s insinuation that Kakuyō’s own peregrinations were tacitly anti-establishmentarian
    in this regard is persuasive.'
