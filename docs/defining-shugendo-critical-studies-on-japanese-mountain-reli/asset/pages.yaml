  md: '# Introduction


    The different hermeneutical discourses aimed at superimposing a female gender
    to the natural landscape of the mountain need to be historicized and properly
    detached from a bipolar (male/female) gender analysis in order to be embedded
    in multipolar or unicolar formative discourses (Laqueur 1990).


    Although this short overview does not exhaust the possibilities for studying Shugendo
    from a gender perspective, this is certainly not the only avenue with unanswered
    questions. One recurrent topic, often illustrated and referred to in theater and
    literature, is the fact that modern shugenja were frequently employed as spies
    during conflicts with local feudal lords, of the territory, in general, and mountains
    specifically.¹ It would be relevant for future Shugendo studies to take into account
    historical records dealing with activities of Shugendo practitioners, to understand
    the impact of geopolitical conflicts on the expansions or contractions of shugenja''s
    ritual activities and institutional organizations.


    Another overlooked or neglected avenue of research is that of confidences andences
    between Shugendo and Shinto, on the one hand, and Shugendo and Onmyodo, on the
    other. Because Shugendo borrows heavily from (Esoteric) Buddhist texts and doctrines,
    most studies tend to underscore this proximity, while just mentioning other influences
    on the side. Equally, so much effort and energy have been put into soating Shugendo
    as Japanese phenomenon (standing for Shinto after the Second World War), it has
    been more important to look at differences rather than similarities. Miyake Hitoshi
    did publish a study comparing Shugendo with other Japanese religions (Miyake 1996),
    and Murayama Shūichi wrote another seminal on Shugendo and Onmyodo in the context
    of temple-related materials (Murayama 1997). While these studies did not have
    an immediate echo, it seems that the current trend toward a more “holistic” approach
    to religious traditions that could naturally lead to research looking at parallel
    or conflating evolutions, as exemplified by Sawada''s chapter in this book.


    Finally, one more area in Shugendo studies that would benefit from more sustained
    attention is text-centered research, which still lags behind other aspects of
    Japanese religious history, perhaps also being described as a folk religion with
    little emphasis on written documents. Kawasaki Tsuyoshi has done remarkable work
    in this respect, but in-depth studies of single documents remain scarce, both
    in Japanese and in Western languages, with translations being even rarer.¹⁷


    # The Structure of This Book


    With a focus on thematic rather than disciplinary points of convergence, we aim
    at a critical reevaluation of the interpretative perspectives and research topics
    that have characterized Shugendo studies until recent times. Our goal is disentangle
    discourses from the yoke of folklore studies and relocate them within the broader
    track of religious and historical studies.'
