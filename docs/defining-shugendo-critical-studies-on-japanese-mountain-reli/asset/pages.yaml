    # Fujiki kyuyō: Empowering Ritual Fasting


    The erection of a stele always constituted the final step of a complex devotional
    and ascetic endeavor that began much earlier and served to empower or ritually
    "switch" on the natural stone. In other works, mounds and stelae of Yudono, far
    from being neutral objects, were connected to specific ritual procedures and doctrinal
    constructs that could not be replaced with others at all. For instance, Miura
    Jōshin (1565–1644) reports in the *Daidō kenmonshū* (1614) in 1613 a monk of the
    Pure Land school, a certain Kikurenji (謙宰), installed a stupa on the monument
    for Mount Yudono in the Mito domain (Hitachi province). An enraged crowd of about
    3,000 Yudono devotees, who Miura said "Shingon practitioners," gathered in place,
    threw down Kikurenji’s stupa, and proclaimed that the ritual procedures for making
    offerings to the Yudono mound must follow the ritual protocol of congregation.
    According to the legend, those procedures had been transmitted by Daichi Nyorai
    to Kūkai (774–835) during his pilgrimage to Yudono in the Daidō (806–810). Crestfallen
    Kikurenji commented: "This Yudono represents the perfection of the three bodies
    [of Buddha]. So why does it hate the Pure Land school ceremony for offerings?”
    (*Keichō kenmonshū*: 64).


    Following up this clash on ritual matters between lay members of a Yudono fraternity
    and a Pure Land monk of the Mito domain, it is interesting to identify the social
    and religious networks that allowed Yudono devotees to empower these sacred steles
    and the ritual practices they adopted. The creation of a votive stele, which was
    often called "*tō* (ō) or stupa, usually required a synergistic interaction of
    three groups of social actors. First, lay devotees of Mount Yudono who generally—necessarily—belonged
    to Yudono fraternities (*Yudonos kō*) formed a devotional assembly (*一切*) to accumulate
    financial resources and legal permits for purchasing the stone, paying the specialized
    works, and selecting the donors (*施主*) of the land on which the stele could be
    created. These persons took themselves not only the economic and legal tasks for
    the material construction of the sacred object but also the ascetic practices
    that were necessary to change the inner matter with religious merit. Donors made
    a *gyō* (願行) to keep performing specific types of ascetic practices to empower
    their stole, without interruption, for a specified amount of time, which usually
    lasted for three years and three months (*sennichigyō* 千日行). From the point of
    view of the temporal duration, the austerities made by the lay devotees of Mount
    Yudono within the ordinaries of their lives as peasants or small artisans perfectly
    mirrored those made by the elite within the extraordinaryness of ascetic ascclusions
    in the Valley of the Immortals (Senninzawa 仙沢) on Mount Yudono. The last date
    of practice marked the time as the accomplishment of the ascetic endeavor (*mangyō*
    萬請), the inauguration of the stole, and the consequent realization of the vows
    (*gan jūjō* 願成就).


    An *isei gyōnin* or a Haguro shugenja played the role of religious sponsor (*hongan*
    願順) and served as guardian of the devotional authenticity and ascetic commitment
    of the donors. If the religious sponsor did not participate in the financial operations
    to materially produce the stele, he followed the lay devotees'
