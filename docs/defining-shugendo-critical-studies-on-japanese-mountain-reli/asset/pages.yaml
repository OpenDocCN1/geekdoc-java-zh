  md: '# Acknowledgments


    On the surface of things, Shugendo appears to be an almost forgotten strand of
    Japanese religious tradition, led to near extinction by the religious policies
    of the Meiji Restoration. However, when paying closer attention, Shugendo or Shugendōrelated
    practices and traditions appear at many unexpected corners. The primary goal of
    this book is to present an up-to-date collection of studies on Shugendo from both
    Japanese and non-Japanese scholars. This explicit aim is to show how Shugendo,
    similarly to Shinto, spans over a wide and complicated array of religious and
    cultural modes and activities. This book joins the ranks of two past edited collections
    of studies on Shugendo, one in the Japanese Journal of Religious Studies (Tyler
    and Swanson, eds., 1989) and the other in Les Cahiers d’Extrême-Asie (Faire, Moorman
    and Sekimori eds., 2011). Like these previous collections, our book does not provide
    a single synthetic view or offer an overall grasp on Shugendo. To readers familiar
    with Shugendo studies, this will be nothing: the subject is so intricate, complex,
    and diversified that it would be preposterous to pretend to cover every aspect
    of it in one single volume. The very eliveness of Shugendo makes much of its allure,
    the flip side of this being the slipperiness.


    It is true that there are few scholars, in Japan and elsewhere, who focus their
    research on Shugendo. However, since Shugendo can be approached from a wide array
    of angles and perspectives, it features as a more or less prominent "sidekick"
    in a great number of studies. Moreover, in the past few decades, research on Japanese
    religions has changed in character, resulting in more inclusive, and less sectarian,
    or unilateral, approaches. Shugendo being, as it is, a movement at the crossroads
    of many other religious traditions, it has gained much more positive image and
    a benevolent scholarly treatment.


    Our greatest hope for this collection is to inspire future research in a subject
    all three of us have found, and fascinated by, for many years.

    Like projects, this book has its origin in happens (or maybe not?). What are the
    odds for three scholars interested in Shugendo studies to be simultaneously present
    at the same university for a prolonged period of time, especially outside Japan?
    As would have, all three editors of this book were at the University of California,
    Santa Barbara in 2016 and 2018, when Kawasaki Tsuyoshi floated the idea of co-organizing
    an international workshop on recent developments in Shugendo studies. The initial
    idea evolved into an intense two-day conference at the University of California,
    Santa Barbara in June 2017, the results of which constitute the starting point
    of the present volume. Of course, the conference papers have thoroughly revised
    and reshaped in order to give this volume structure and a certain degree of coherence.'
