    to the lint), an offense against Anemiowatake 天石门 the god of the gate. Later,
    shortly before he sees Ayase in search of the seeker, the shugenja cocks his head
    and listens to the wind, then explains that a bodhisattva has spoken to him and
    given hope for Kotoyata''s revival. There is, accordingly, a hint of Buddhist
    salvation in the final pages of the tale, building on the image of the shugenja
    as an advocate and of the downtrodden.


    Given the sheer quantity and diversity of early modern Japanese literary production,
    there is no single image of the shugenja that emerges in Edo fiction. Authors
    were free to represent the shugenja as they chose, and clearly did so in the comic
    literature explored above. There were, moreover, domestic precedents available
    in setuwa, emaki, and other forms, as Akinari is seen to have employed in Harusam
    monogatari. Nevertheless, genre and convention were powerful forces, and an understanding
    of these factors yields valuable insights. Nowhere is this more the case than
    in the early yolimori, where many narrative elements are shaped by Chinese fiction.
    The prevalence of the figure of the Daoist priest in Chinese fiction, which vernacular
    narratives or classical tales of the strange, translates into regular became by
    shugenja, who were seen as the most natural Japanese counterpart. Adaptation,
    however, is never a process of one-to-one conversion. Daoist elements inherent
    in Shugendō are brought to the fore, so are the peculiar emphases of the source
    texts, particularly those that are critical to the plot. To these are added other
    elements, so that through the process of adaptation and the intertextual relationship
    with source text and other antecedents, a sort of hybrid emerges, one rooted in
    the flesh-and-blood shugenja, at least as popularly conceived, but onto which
    are layered new associations and meanings.'
