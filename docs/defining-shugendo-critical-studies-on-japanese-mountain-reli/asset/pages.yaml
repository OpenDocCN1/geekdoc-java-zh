  md: '# Imagining an Ancient Tradition


    This activity was not unique to Shugendō but also widespread across Buddhist sects,
    as clerics devised figures like Hönen, Shinran, Renny, Nichiren, and Dogen to
    their local temples (Tsutsumi 2008). These legends were often written into engi
    that revenue could be supplemented by expanded versions, the objectives and writing
    styles of the two eras differed significantly. Medieval engi, of which were produced
    in the twelfth and thirteenth centuries, were intended to cement the authority
    of patrilineal lineages with particular temples, territory, and ritual programs.
    The growing political and economic instability of the Kamakura period rippled
    out into the provinces, prompting shrine-temple complexes to show up their claims
    over landholdings as stewards (jito) and military governors (shugo) out their
    own.


    In contrast, the political circumstances of the Edo period were far more stable.
    While Buddhist temples received a fixed income through the enforced patronage
    system (danka seido) or revenue from government-allotted agricultural states (as
    was the case of Togakushi), they supplemented by a range of activities: public
    displays (“curtain unveilings,” kaicho) of deities, the distribution of talismans,
    private rituals, popular festivals, mountain guiding, and so forth. These endeavors
    relied on interest among the people, and it was often local legends adapted this
    effort. By describing the merits of a site''s deity, inventing connections to
    famous founders, and fabricating historical ties with a school like Shugendō,
    religious specialists boosted enthusiasm for their services and affiliation. Unlike
    the medieval precedents, these engi were composed of vernacular style and often
    translated into woodblock print, ensuring diffusion to an expanded readership.


    Beyond shrine and temple narratives, a search for origins captured the interests
    of intellectuals of Ito Jinsai (1627–1705) and Ōgyū Sorai (1666–1728) investigated
