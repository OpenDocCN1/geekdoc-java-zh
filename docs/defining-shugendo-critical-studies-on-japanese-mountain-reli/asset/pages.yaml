  md: '# Cult and Statuary of Zaō Gongen 185


    # Conclusion


    In the first part of the chapter we saw the cult for Zaō Gongen spread, thanks
    to the diffusion of devotional attentions and material objects. Based on this,
    it is possible to identify two crucial developments.


    First, by the time of Michinaga''s pilgrimage to Mount Kinpu, the name of Zaō
    Gongen was clearly used to refer to a combinatory deity. This is also tested by
    the oldest extant mirror icon of Zaō Gongen, which displays the deity''s body
    as a provisional manifestation of the buddha (Tanishuchi 2007: 13–15). The inscription
    of the mirror icon of Sōji indicated that the object was produced in an atelier
    sponsored by the court (kanrei kōb宮工房), which was probably involved in Michinaga''s
    pilgrimage to Mount Kinpu. From this time on, the statues of Zaō Gongen kept displaying
    a diversity of external features, which were probably due to the fact that new
    visual renderings were triggered by the aura of secrecy always associated with
    this deity.


    Second, with the Buddhist tale of Zaō Gongen on Mount Kinpu, included in the Konjaku
    monogatarisū, Zaō Gongen came to be gradually associated with En Gyō. Most of
    the artifacts deified to Zaō Gongen are concentrated in the late Heian and Kamakura
    periods. Afterward, the statue at Kunpenji, which was restored twice in the Nanbokuchō
    (1336–92) and Muromachi (1392–1573) periods, the production of new statues followed.
    Moreover, from the medieval to the early modern period there was a proliferation
    of statues exclusively dedicated to En Gyō, who was conceived as the patriarch
    of Shugendō (see Chapter Six by Carina Roth). This was due to the continuous adaptations
    and demonstrations of the famous episode in which En Gyō prays in front of Zaō
