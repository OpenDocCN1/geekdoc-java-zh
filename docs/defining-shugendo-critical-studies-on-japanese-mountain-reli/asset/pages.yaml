    # Establishing Shugendo Studies: Hor Ichichi, Gorai Shigeru, Miyake Hitoshi


    The Institute for National Spiritual Culture was disbanded after the end of the
    war, but it was from among people connected with it that research into mountain
    beliefs and practices subsequently began. The Sangaku shinkō kenkyū was formed
    and published a number of monographs through the publisher Jinja shininpsha, Nihon
    ni okeru sangaku shinkō no kōkogaku katsushi (Archaeological study of Japanese
    mountain cults) by Ō Iwa in 1958, Nihon ni okeru sangaku shinkō no gensho keitai
    (Primordial forms of mountain cult in Japan) by Hor Ichiro, Shugendo to shinto
    jinja (Mountain cult and shrines) by Miyake Naokazu, and Nihon ni okeru sangaku
    shinkō no reishi (History of mountain cults in Japan) by Hago Kazuo, in 1951.
    Hor Ichiro became a central figure in the group and published two compilations
    of his work, Minkin shinkō (Popular beliefs) in 1951 and Waga kuni manner. He
    preferred the term minkin shinkō (popular beliefs) to minzoku shūkyō (folk religion);
    he veered towards religious studies, incorporating ideas of Mircea Eliade and
    Robert N Hell (2027–2013) (The English translation of his work used the term “folk
    religion”).⁷⁰


    Research on mountain beliefs and practices had begun before the war with the theory
    of ascetic training by Kishimoto Hideo (1903–64), then based on the Religious
    Studies Research Centre at others at the Imperial University of Tokyo, and was
    further enriched by the studies of others, Hor Ichiro on folk beliefs, Yanagawa
    Keiichi (1926–90) on religious fraternities (kami), Miyake Hitoshi 官學隼 (1933–)
    on Shugendo rituals and the theory of folk Shugendo, Sakurar Tokutarō (1917–2007)
    on kō groups and female shamans, and Miyake Noboru 官宮逢 (1936–) on forces of belief.
    Miyake Hitoshi published Shugendo gire no kenkyū (Studies in Shugendo ritual)
    in 1971, followed by comprehensive studies of Shugendo ritual, thought, organization,
    and regional development. Shugendo by then had become an academic field of its
    own. The formation of an academic network with the establishment of the Sangaku
    Gakkai 山岳経験学会 in 1980 (it became a nationwide association in 1984) and the collection
    of documentary sources through the publication of the eighteen-volume Sangaku
    shūkyōshi kenkyū sōho 山岳宗教研究叢書 (Meicho shopp, 1975–84) resulted in a thriving
    research environment that cast the legacy of Japanese fascism into oblivion.


    Gorai Shigeru was interested in the combinatorial relations between Buddhism and
