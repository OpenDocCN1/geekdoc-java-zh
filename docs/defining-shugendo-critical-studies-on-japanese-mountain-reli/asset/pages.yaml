  md: '# A Critical History of the Study of Shugendō


    # The Creation of a Different History


    The study of Shugendō and mountain beliefs and practices is now at an important
    turning point in Japan. Scholars address many topics related to them in fields
    such as history, archaeology, literature, performing arts, and religious history,
    but, in fact, the general study of mountain beliefs per se is in rapid decline
    and is becoming a thing of the past. People are even forgetting that many mountains
    all over Japan were the focus of belief. Mountain confraternity (kō) members are
    aging and they are not being replaced by a new generation due to failing birth
    numbers. Confraternities without a leader or a sendatsu are in danger of extinction.
    Shugendō and mountain cults have changed radically in the modern period, due first
    of all the collapse of a broad spectrum of political, economic, social, and cultural
    connections as a consequence of shinbutsu bunri. A second factor was the introduction
    of modern values, and particularly changes in people’s religious consciousness
    that resulted from an emphasis on economic growth. Maintaining ritual purity as
    a prerequisite for climbing a sacred mountain and observance of taboo associated
    places have declined. A third element is the decline of alpinism and mountain
    climbing, with a consequent loss of interest in the history of mountain cults.
    Finally, the development of motorization brought about a decline in pilgrimage
    to sacred mountains. In fact, a crucial development. Railways contributed to the
    reinvention of mountain-based cults by connecting populated areas with the mountains,
    but the construction of motor roads, ropeways, and cable cars in the mountains⁷⁴
    led to the destruction of old pilgrim paths, and ways that provided lodgings and
    guides (oshi) fell into decay. Customs related to mountain pilgrimage, such as
    staying in lodgings (shukubo) run by religious specialists associated with the
    mountain, undertaking purification, wearing special attire, participating in rituals,
    chanting texts, and ascending the mountain under the guidance of the sendatsu
    and infrastructure have steadily fallen into abeyance. Climbing mountains as a
    religious practice continued until around the mid-1960s, by the rapid economic
    growth that time altered people’s thinking and behavior; their values changed
    completely.


    The tragic eruption of Mt. Onake on September 27, 2014, was a crucial event. Kiso
    Onake, with M. Ishizuchi in Shikoku, a center of living mountain, but it is possible
    that the eruption would cause its rapid decline. Now, restrictions remain in place
