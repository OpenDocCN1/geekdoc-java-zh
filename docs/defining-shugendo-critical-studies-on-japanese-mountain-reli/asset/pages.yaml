    and Shinto elements are layered on top of this Daoist foundation. The shugenja
    does not merely yield to the sword; his assault is preceded by a substantial monologue
    in which he enumerates U''s offenses, in the process drawing heavily on the Kojiki,
    norito, and other elements of Shinto tradition and ritual. Among the most egregious
