  md: '# Shugendō as Social Practice: Kumano Talismans and Inscribed Oaths in Premodern
    Japan


    D. Max Moerman


    As the title of this book suggests, we are at a very different place in the study
    of Shugendō than we were only a few decades ago. No longer marginalized recognized
    as mere “folk religion,” Shugendō has become recognized as a religious tradition
    central to Japanese culture, during all historical periods, in all geographic
    regions, and for people of all social classes. Our task is no longer simply to
    recognize Shugendō; it is to define andosition it. My contribution to this task
    is to examine the position of Shugendō within Japan’s social order across time,
    place, and, in particular, with the Three Kumano shrines associated with Shugendō,
    and headquarters of the Honzan-ha, which of the earliest centers... supplied the
    documentary infrastructure for the most public and private protocols of Japan’s
    social institutions. My argument is that the materials and methods of Japanese
    religion, and of Shugendō, in particular, defined and sustained, from the thirteenth
    through the nineteenth centuries, are methods of trust and truth observed and
    enacted within juridical, political, and sexual relations. I understand these
    relations not as separate domains but overlapping fields of practice, which relied
    on a common corpus of documentary and ritual forms. Because these documents have
    been treated in piecemeal fashion, and in terms of narrow disciplinary interests,
    we have failed to understand their shared networks of meaning and agency.


    Such documentation and implementation operated throughout the most ephemeral of
    objects: religious oaths inscribed on paper talismans, signed in blood, enforced
    by the gods, and tested by physical ordeals. Such talismans were, and continue
    to be produced, at major Shugendō centers throughout Japan, as Omine, Kinpusen,
    Yoshino, Kurama, Dorogawa, Atagasan, Shingū, Hakusan, Kubotesan, and Togakushi.
    The longest and most extensive history of production and use, however, belongs
    to those of the three Kumano shrines of Hongū, Shingi, and Nachi. Oaths inscribed
    on Kumano talismans were used by farmers to complain of mistreatment by local
    authorities, to resolve disputes, and to justify rebellions; they were used by
    shogunal courts to adjudicate land claims, designate administrative authority,
    and resolve inheritance disputes; they were used by military clans to guarantee
    fealty to vassals, swear allegiance to superiors, and cement'
