    as it occurred between the classical and the medieval period. To order to do so,
    I will examine the evolution of the meaning of the expression *shugen* and juxtapose
    it with what we know about contemporary practice and yamabushi.


    # Mountain Practice in Classical Japanese Buddhism Prior to the Formation of Shugendo


    Already before the formation of Shugendo, Buddhism and mountains were closely
    interrelated: mountain practice was an integral part of Buddhism in the classical
    period and temples were built within it. Let me briefly sketch the situation.


    In the Nara period, there was a type of mountain practice in which privately ordained
    monks engaged. However, official monks also learned the *Kozoku Gūonji Ritsu*
    (Kozoku 虚空蔵求持持法) Sonoda 1981. At that time, mountain practice may actually be
    considered as an integral part of the basic monastic curriculum. For the creation
    of the system of Ten Court Meditation Masters (*Naibu Jōzen* 内院供十禅師), whose task
    was to protect the environment by way of incantations (*juryoku* 呪呪力) acquired
    in the depths of the mountains, is another proof of the important role granted
    to mountain practice. There are numerous examples of temples built on mountains,
    such as Koya and Mt. Hiei, founded by Kukai and Saichō, respectively, to cite
    the most famous examples from the Heian period. Before long, these institutions
    yield enormous power of influence and promote the diffusion of Esoteric Buddhism
    while maintaining as their basis.


