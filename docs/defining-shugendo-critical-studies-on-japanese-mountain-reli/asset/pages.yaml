    Defining Shugendo


    Shugendö, the representative example of kami–buddha fusion before the shinbutsu
    bunri legislation of the late 1860s, developed systematically in a way peculiar
    to Japan, characterized by the fusion of KAMI, buddhas, kami, and hotoke. It Intricately
    combined the six dimensions (Figure 1.1 described in points (1) to (6)) above.
    In the course of its individual development in various locations, it centered
    its practices there, as embodying the power of nature. Practitioners acquired
    powers through mountain practice, and upon returning to their villages they provided
    magic-religious rituals (kaji kitō 加祈祈) for practical benefits on behalf of local
    people. These practitioners were generally called yamabushi 山行 or 法師. In terms
    of doctrine, the purpose of their practice was to attain buddhhood in body (soshin
    jobbutsu 即身成就), an ideal strategy influenced by Esoteric Buddhism, but ultimately
    it was to become one with nature—to be a “living kami” in order to bring peace
    to salvation. It laying the basis of this was the ideas that mountains were mandalas
    and that the buddha-nature (bussō 仏性, Buddha-dhatu) was inherent within mountains,
    rivers, and seas. In the long trough, it went beyond Shugendo to say that all
    natural phenomena, sentient or not, were one. Shugendo exerted a great influence
    through mountain beliefs and practices all over Japan, it disappeared after being
    banned in 1872; efforts to restore it have been ongoing since 1946. Recognizing
    the existence of spirits, it overrode the doctrinal contradictions of Shugendo,
