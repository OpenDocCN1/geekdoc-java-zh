    # Conclusion


    The preceding pages showed that Minoodera engi, a document compiled at the end
    of the Heian period, did more than simply a rewriting of the historical evolution
    within the spatial sphere of Minoo. It was also considered a legitimate biography
    of En no Gyōja, not only beyond the precincts of the temple but also in Buddhist
    sects. Towards the end of the Kamakura period, some institutions asserted the
    merit of practicing all three disciplines, namely, Exoteric Buddhism, Esoteric
