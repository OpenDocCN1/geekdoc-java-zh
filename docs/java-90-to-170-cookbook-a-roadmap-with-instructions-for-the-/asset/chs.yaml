  \n1. `public record Demo_explicit_constructor6(int empId, String empname, long salary)\
  \ {`\n2. `public Demo_explicit_constructor6(int empId, String empname, long salary)\
  \ {`\n3. `  if (Objects.nonNull(empname)) {`\n4. `  this.empname = empname;`\n5.\
  \ `  }`\n6. `  this.salary = 0;`\n7. `  this.empId = empId;`\n8. `}`\n9. `}`\n\n\
  当我们添加这样的构造函数时，我们会得到一个名为 `\"The blank final field empname may not have been initialized\"\
  ` 的错误，因为 `empname` 尚未初始化。我们正试图在初始化之前的验证过程中使用它。\n\n这意味着在规范构造函数中执行直接的验证是一个大问题。这个问题可以使用紧凑构造函数（compact\
  \ constructor）解决，如前面的代码所示。\n\n![](img/72.jpg)\n\n## 问题\n\n我们可以在 record 类中定义访问方法（accessor\
