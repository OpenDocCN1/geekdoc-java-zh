  \ 6 行所示。该方法只是头部或字段名，后面跟着括号。\n\n有时，默认访问方法可能无法满足实际需求。在这种情况下，我们可以添加自定义的访问方法，尽管通过编写显式方法来自定义预定义访问方法的行为是完全可能的。但不应忘记确保自定义访问方法的签名必须与预定义的方法相同。也可以考虑编写一个完全新的方法来访问字段，而不是对定义的方法进行自定义。然而，我们将尽量避免这样做，因为没有必要。\n\
