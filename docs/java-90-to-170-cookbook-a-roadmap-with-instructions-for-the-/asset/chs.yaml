  \ 10.0 并没有达到这一预期。但这种预期是软件开发者的，而不是 API 开发者的。Oracle 从未承诺每个发布的版本都会包含大量的更改。它承诺的是每六个月发布一个版本并进行一些更改。这些更改将以添加功能、更新现有功能，甚至是移除某些功能的形式存在。\n\
