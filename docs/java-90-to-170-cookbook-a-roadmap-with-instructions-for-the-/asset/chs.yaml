  ## 第一部分：Java 13 有什么新特性？ #toc.xhtml_s58a\n\n在本章的第一部分，我们将讨论 Java 13 中添加的一些 API 改进。该版本中的许多变化都是预览特性的一部分。由于我们将在接下来的章节中讨论更多版本，我们将在它们发布的对应章节中进行涵盖。因此，在\
  \ Java 13 中没有太多需要学习的概念。一些变化引入了 `java.nio.file` 包中，我们将对其进行讨论。\n\n## 安装 #toc.xhtml_s59a\n\
  \n在开始本章的这部分之前，请从以下资源下载 Java SE Development Kit 版本 13：\n\n`https://www.oracle.com/java/technologies/javase/jdk13-archive-downloads.html`\n\
  \n## java.nio.file.FileSystems 的更新 #toc.xhtml_s60a\n\n`FileSystems` 类位于 `java.nio.file`\
  \ 包中。该类并非在 Java 13 中发布，而是从 Java 7 版本开始可用。该类现在从 Java 13 开始提供了一些返回 `FileSystem` 对象的静态方法。\n\
  \n## 问题\n\n在 Java 中提供了不同的提供者可以方便与文件系统通信？Java API 是否提供使用这些提供者的方法？\n\n## 解决方案\n\n\
  `Listing 5-1, FilesystemOperations.java` 显示了我们如何列出 Java 中提供的不同的内置文件系统提供者。代码还展示了\
  \ `java.nio.file.FileSystem` 类中新静态方法的使用，它使用了这些提供者之一：\n\n1. `//Listing 5-1`\n2. `package\
  \ com.java13.nio;`\n4. `import java.io.IOException;`\n5. `import java.nio.file.FileSystem;`\n\
  6. `import java.nio.file.FileSystems;`\n7. `import java.nio.file.Paths;`\n8. `import\
  \ java.nio.file.spi.FileSystemProvider;`\n9. `import java.util.Map;`\n11. `public\
  \ class FileSystemOperations {`\n\n```java\npackage com.java13.nio;\nimport java.io.IOException;\n\
  import java.nio.file.FileSystem;\nimport java.nio.file.FileSystems;\nimport java.nio.file.Paths;\n\
  import java.nio.file.spi.FileSystemProvider;\nimport java.util.Map;\n\npublic class\
  \ FileSystemOperations {\n    public static void main(String[] args) throws IOException\
  \ {\n        System.out.println(\"Available providers=>\");\n        for (FileSystemProvider\
  \ builtin : FileSystemProvider.installedProviders()) {\n            System.out.println(builtin);\n\
  \        }\n        Map<String, String> attr = Map.of(\"create\", \"true\");\n \
  \       FileSystem testfile = FileSystems.newFileSystem(Paths.get(\"first\"), attr);\n\
  \        System.out.println(\"Provider :- \"+testfile.provider());\n        System.out.println(\"\
  Root directory:\"+testfile.getRootDirectories());\n        System.out.println(\"\
  Read attribute:\"+testfile.isReadOnly());\n    }\n}\n```\n\n## 输出\n\n执行 `FileSystemOperations.java`\
  \ 后，我们得到的输出所示图 5.1：\n\nimages/Figure-1.jpg\n\n**图 5.1：** File 类的更新\n\n## 解释\n\n\
  `FileSystem` 类作为 JDK 7 中 `java.nio.file` 包的一部分引入，本质上是生成文件系统的静态方法的集合。根据传入的 URI，它识别所需的该文件类型的提供者。这些提供者是系统预装的。最初，只添加了一些与\
  \ URI 以及可能的 Path 通信的方法。从 13 版本开始，该类提供了更多方法以提高生成文件系统的灵活性。\n\nAPI 添加了以下新方法：\n\n**newFileSystem(Path)**\n\
  \n此静态方法返回一个映射到 `Path` 的 `FileSystem` 对象。使用该对象，你可以访问文件内容。\n\n方法的语法如下：\n\n```java\n\
  public static FileSystem newFileSystem(Path path) throws IOException\n```\n\n该方法内部连接到另一个重载方法，该方法与文件系统提供者以及定义属性或特征的\
  \ map 通信。如果找到了提供者，则将空 map 推入此方法并返回文件系统。\n\n方法的参数为：\n\n*   `path`: 文件的路径。\n\n方法返回一个新的文件系统。\n\
  \n方法抛出：\n\n*   `ProviderNotFoundException`: 如果没有支持指定文件类型的提供者。\n*   `ServiceConfigurationError`:\
  \ 如果负责加载所需提供的服务未正确加载。\n*   `IOException`: 如果文件不可。\n*   `SecurityException`: 如果安全管理器未允许处理文件。\n\
  \n**newFileSystem(Path, Map<String,?>)**\n\n与之前的方法类似，此方法也返回文件系统。但你可以以 map 的形式作为该方法的第二个参数提供特殊属性。\n\
  \n\n\n\n该方法的工作原理与之前的方法类似，但额外在 map 中指定了文件系统的属性。如如你所知，`Map` 是一个键值对，其中键提供属性的名称，而值则提供属性的值。\n\
  \n该方法的参数为：\n\n*   `path`: 文件的路径。\n*   `envmap`: 一个提供配置文件系统 `system.` 属性的 map。\n\n\
  该方法返回一个新的 `FileSystem`。\n\n该方法抛出异常：\n\n*   `ProviderNotFoundException`: 如果没有支持指定文件类型的提供者。\n\
  *   `ServiceConfigurationError`: 如果负责加载所需提供者的服务提供者未正确加载。\n*   `IOException`: 如果文件不可用。\n\
  *   `SecurityException`: 如果安全管理器未授予处理文件的权限。\n\n在我们的解决方案（即 `Listing 5-1`）中，我们在第 18\
  \ 行初始化了 map，如下：\n\n```\nMap<String, String> attr = Map.of(\"create\", \"true\");\n\
  ```\n\n该属性 `create` 指定如果文件不存在，则将自动创建。此外，我们在解决方案的第 19 行所示，将此 map 传递给了 `FileSystems.newFileSystem()`\
  \ 方法：\n\n```\nFileSystem testfile = FileSystems.newFileSystem(\n    Paths.get(\"\
  first.docx\"), attr);\n```\n\n由于属性 `create` 被设置为 `true`，当你第一次运行该程序时，你会观察到文件 `first.docx`\
  \ 被自动创建。如所述，取决于文件类型，服务提供者将从已安装的提供者加载提供者。在我们的情况下，你将在输出中观察到 `jdk.nio.zipfs.ZipFileSystemProvider`\
  \ 提供者来生成文件系统。\n\n`newFilesystem(Path, Map<String,?>, ClassLoader)`\n\n此方法被称为完全自定义的方法，因为你可以提供\
  \ `Path`、`Map` 以及用于加载文件系统的 `Classloader`。\n\n该方法的语法如下：\n\n```\npublic static FileSystem\
  \ newFileSystem(Path path, Map<String,?> envmap,\n                             \
  \ ClassLoader loader) throws IOException\n```\n\n当我们调用此方法时，将根据文件类型搜索已安装的提供者。但如果没有找到匹配的提供者，作为第三个参数提供的类加载器将定位所需的提供者。一旦加载了提供者，就会返回文件系统以便后续的文件处理。\n\
  \n该方法的参数为：\n\n*   `path`: 文件的路径。\n*   `envmap`: 一个提供配置文件系统的属性的 map。\n*   `loader`:\
  \ 用于定位所需提供者的类加载器。也可以为 null 以定位已安装的提供者。\n\n该方法返回一个新的 `FileSystem`。\n\n该方法抛出异常：\n\n\
  *   `ProviderNotFoundException`: 如果没有支持指定文件类型的提供者。\n*   `ServiceConfigurationError`:\
  \ 如果负责加载所需提供者的服务提供者未正确加载。\n*   `IOException`: 如果文件不可用。\n*   `SecurityException`:\
  \ 如果安全管理器未授予处理文件的权限。\n\n# XML 解析器的更新\n\n通常情况下，我们需要在应用程序中处理 XML 文件。此类 XML 文件使用 `SAXParser`\
  \ 和 `DOMParser` API 进行解析。Java 13 引入了一些新方法来实例化 `DOM` 和 `SAX` 工厂。这些方法提供了对 XML 元信息标签中提供的命名空间的感知能力。这些方法的名称与传统方法相似，但现在都带有\
  \ `NS` 前缀。前缀 `NS` 表示它是“命名空间感知型”（NamespaceAware）的。\n\n以下是新引入的方法：\n\n*   `newDefaultNSInstance()`\n\
  *   `newNSInstance()`\n*   `newNSInstance(String factoryClassName, ClassLoader classLoader)`\n\
  \n这些方法用于创建默认具有命名空间感知能力的解析器。\n\n考虑以下代码片段：\n\n```\nDocumentBuilder documentBuilder\
  \ =\n    DocumentBuilderFactory.newDefaultNSInstance().newDocumentBuilder();\n```\n\
  \n这是对以下代码片段的替换：\n\n```\nDocumentBuilderFactory documentBuilderFactory = DocumentBuilderFactory.newDefaultInstance();\n\
  documentBuilderFactory.setNamespaceAware(true);\nDocumentBuilder db = documentBuilderFactory.newDocumentBuilder();\n\
  ```\n\n如你所见，`DocumentBuilderFactory` 的修改方法比之前的方法更加简洁。\n\n让我们详细讨论这些新方法。\n\n### newDefaultNSInstance()\n\
  \n该方法返回 `DocumentBuilderFactory` 的 `NamespaceAware` 实例，采用系统默认实现。\n\n该方法的语法如下：\n\n\
  ```\npublic static DocumentBuilderFactory newDefaultNSInstance()\n```\n\n一旦获取工厂，你就可以从这里创建解析器。该解析器默认支持命名空间。\n\
  \n### newNSInstance()\n\n该方法返回 `DocumentBuilderFactory` 的新实例，采用系统默认实现。\n\n该方法的语法如下：\n\
  \n```\npublic static DocumentBuilderFactory newNSInstance()\n```\n\n该方法返回 `FileSystemFactory`\
  \ 的新实例。\n\n如果实现不可用或无法实例化，该方法将抛出 `ServiceConfigurationError`。\n\n对于生成 `SAXParser`\
  \ 的工厂也有类似的方法。\n\n### newNSInstance(String,ClassLoader)\n\n该方法通过两个参数，方便了提供工厂类名和类加载器，以帮助加载工厂类。\n\
  \n该方法的语法如下：\n\n```\npublic static DocumentBuilderFactory newNSInstance(String factoryClass,\n\
  \                              ClassLoader loader)\n```\n\n该方法的参数为：\n\n*   `factoryClass`:\
  \ 提供 `javax.xml.parsers.DocumentBuilderFactory` 实现的工厂类名。\n*   `loader`: 用于加载工厂类的\
  \ `ClassLoader`。\n\n该方法返回 `FileSystem` 的新实例。\n\n如果 `factoryClass` 为空，或者由于某些原因未加载或无法实例化工厂类，则该方法将抛出\
  \ `ServiceConfigurationError`。\n\n\n\n\n\n使用控制语句始终是任何业务解决方案不可或缺的一部分。`if..else` 和\
  \ `switch-case` 等这些概念对我们所有人来说并不陌生。但传统的 switch case 语句不够灵活，无法处理不同形式的 case。这就是为什么你可能观察到开发者不愿使用\
  \ switch case 的原因。它始终是他们的备选方案。Java 14 修改了 switch case 的整体声明方式，使其更加灵活。\n\n修改后的 switch\
  \ case 现在可以使用：\n* case 中的多个标签（labels）\n* 箭头操作符（Arrow operator）\n* case 中的表达式\n*\
  \ Yield 语句\n\n让我们在不同场景下讨论所有这些特性。\n\n## 问题\n传统的 switch-case 不允许多个 case 标签，但现在可以了。如何编写具有多个标签的\
  \ cases 呢？\n\n## 解决方案\n我们将通过两个场景来讨论此解决方案：\n\n### 场景 1：不使用 break 语句：\n`Listing 5-2,\
  \ TestJava14SwitchMultipleCase_Label1_WithoutBreak.java` 展示了我们如何在不使用 break 语句的情况下使用多个\
  \ case 标签：\n\n```java\n//Listing 5-2\npackage com.java14;\npublic class TestJava14SwitchMultipleCase_Label_WithoutBreak\
  \ {\n    public static void main(String[] args) {\n        checkFruit(\"apple\"\
  );\n        checkFruit(\"watermelon\");\n    }\n    private static void checkFruit(String\
  \ fruitName){\n        switch (fruitName) {\n        case \"apricot\", \"apple\"\
  , \"banana\":\n            System.out.println(fruitName + \" is full of Vitamin\
  \ A,B١,B٢,B٦, C and folic acid\");\n        case \"Orange\":\n            System.out.println(\"\
  Orange is full of Vitamin C,potassium, folate and thiamine\");\n        default:\n\
  \            System.out.println(\"We don't have fruit on the list\");\n        }\n\
  \    }\n}\n```\n\n## 输出\n如果我们执行 `TestJava14SwitchMultipleCase_Label1_WithoutBreak.java`，我们将得到如下输出，如图\
  \ Figure 5.2 所示：\n\n![](img/Figure-5.2.jpg)\n\n**图 5.2:** 不带 break 的多标签修改后的 Switch\n\
  \n### 场景 2：使用 break 语句：\n`Listing 5-3, TestJava14SwitchMultipleCase_Label_Break.java`\
  \ 展示了我们如何在使用 break 语句的情况下使用多个 case 标签：\n\n```java\n//Listing 5-3\npackage com.java14;\n\
  public class TestJava14SwitchMultipleCase_Label_Break {\n    public static void\
  \ main(String[] args) {\n        checkFruit(\"banana\");\n        checkFruit(\"\
  watermelon\");\n    }\n    private static void checkFruit(String fruitName) {\n\
  \        switch (fruitName) {\n        case \"apricot\", \"apple\", \"banana\":\n\
  \            System.out.println(fruitName + \" is full of Vitamin A,B١,B٢,B٦, C\
  \ and folic acid\");\n            break;\n        case \"Orange\":\n           \
  \ System.out.println(\"Orange is full of Vitamin C,potassium, folate and thiamine\"\
  );\n            break;\n        default:\n            System.out.println(\"We don't\
  \ have fruit on the list\");\n        }\n    }\n}\n```\n\n## 输出\n如果我们执行 `TestJava14SwitchMultipleCase_Label_Break.java`，我们将得到如图\
  \ Figure 5.3 所示的输出：\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3:** 带 break 的多标签修改后的 Switch\n\
  \n## 解析\n在传统的 switch-case 中，我们只能使用单个 case。这导致了编写多个 cases，而且我们无法在同一个 case 下组合相似的操作。这始终会产生冗余代码。但现在，通过增强特性，我们可以通过提供逗号分隔的标签在同一个\
  \ case 下组合相似的操作。我们创建了两个场景来解释这个概念。\n\n在场景 1 `Listing 5-2, TestJava14SwitchMultipleCase_Label_WithoutBreak.java`\
  \ 中，我们在同一个 case 中声明了逗号分隔的 cases，而不是为相同的逻辑编写不同的 cases。但在这种场景下，我们没有在 case 后使用 break\
  \ 语句。由于这种贯穿（fall-through），会产生这种现象，即匹配 case 之后的所有逻辑都将执行，而不再检查其他 case。你可以从 Figure\
  \ 5.2 所示的输出中观察到，尽管 `fruitName` \"apple\" 的 case 匹配，我们仍然得到了 \"orange\" 和 \"default\"\
  \ 的输出。当我们传递 \"watermelon\" 时，没有任何 case 通过，因此执行了 \"default\" case。\n\n在场景 2 `Listing\
  \ 5-3, TestJava14SwitchMultipleCase_Label_Break.java` 中，我们使用了相同的代码（在同一个 case 中声明了多个\
  \ cases，它们应该执行相同的逻辑），但这次我们在每个 case 后都使用了 break 语句。由于 break 语句的存在，只有匹配的 case 会执行，然后\
  \ switch 块将终止。在 Figure 5.3 所示的输出中，你将观察到传递 \"banana\" 时，只有与 \"banana\" 匹配的 case 逻辑会执行。其他\
  \ case 都不会执行。传递 \"watermelon\" 时，由于没有匹配 \"watermelon\" 的 case，执行了 default case。\n\
  \n![](img/43.jpg)\n\n## 问题\n与传统的 switch-case 相比，如何使用新形式的 switch 标签 `case ->`？如何在\
  \ switch case 中使用箭头操作符？\n\n## 解决方案\n`Listing 5-4, TestJava14SwitchWithoutBreak.java`\
  \ 展示了如何在 switch case 中使用箭头操作符：\n\n```java\n//Listing 5-4\npackage com.java14;\n\
  public class TestJava14SwitchWithoutBreak {\n    public static void main(String[]\
  \ args) {\n        checkFruit(\"apple\");\n        checkFruit(\"watermelon\");\n\
  \    }\n    private static void checkFruit(String fruitName) {\n        switch (fruitName)\
  \ {\n        case \"apricot\" ->\n            System.out.println(\"Apricot is full\
  \ of Vitamin A,B1,B2,B6, C and folic acid\");\n        case \"apple\" ->\n     \
  \       System.out.println(\"Apple is full of Vitamin A,B1,B2,B6,C and folic acid\"\
  );\n        case \"banana\" ->\n            System.out.println(\"Banana is full\
  \ of Vitamin A,B1,B2,B6,C and folic acid\");\n        case \"Orange\" ->\n     \
  \       System.out.println(\"Orange is full of Vitamin C,potassium, folate and thiamine\"\
  );\n        default ->\n            System.out.println(\"We don't have fruit on\
  \ the list\");\n        }\n    }\n}\n```\n\n## 输出\n当我们执行 `TestJava14SwitchWithoutBreak.java`\
  \ 时，将得到如图 Figure 5.4 所示的输出：\n\n![](img/Figure-5.4.jpg)\n\n**图 5.4:** switch case\
  \ 使用箭头操作符 (->)\n\n\n\n\n\n在使用箭头运算符编写 `switch` 块时，我们可以在同一个用例中使用多个标签吗？\n\n## 解决方案\n\
  \n`Listing 5-5, TestJava14SwitchMultipleCase_Labels.java` 展示了我们如何在 `switch` 语句中结合使用多个标签和箭头的操作：\n\
  \n1. `//Listing 5-5`\n\n```java\npackage com.java14;\n\npublic class TestJava14SwitchMultipleCase_Labels{\n\
  \  public static void main(String[]args){\n     checkFruit(\"apricot\");\n     checkFruit(\"\
  Orange\");\n     checkFruit(\"Watermelon\");\n  }\n  private static void checkFruit(String\
  \ fruitName){\n      switch(fruitName){\n        case \"apricot\", \"apple\",\"\
  banana\" ->\n              System.out.println(fruitName +\" is full of Vitamin A,B1,\
  \ B2,B6, C and folic acid\");\n        case \"Orange\" ->\n              System.out.println(\"\
  Orange is full of Vitamin C,potassium, folate and thiamine\");\n        default\
  \ ->                System.out.println(\"We don't have fruit on the list\");\n \
  \ }\n  }\n}\n```\n\n## 输出\n\n当执行 `TestJava14SwitchMultipleCase_Labels.java` 时，可以看到\
  \ 图 5.5 所示的输出：\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5:** 使用箭头运算符的多个 case\n\n## 解释\n\
  \n开发者现在可以在 `case L ->` 的右侧编写表达式、代码块或 `throw` 语句。此外，根据新的提案，现在允许每个 case 包含多个常量，这些常量用逗号隔开。\n\
  \n在 `Listing 5.5` 显示的解决方案中，你会发现我们在单个 case 语句中使用了多个 case，它们在第 12 行用逗号隔开。\n\n在 图 5.5\
  \ 所示的输出中，我们可以看到，如果任何 case 匹配逗号分隔的值，就会执行该代码块。如果没有任何 case 匹配，则执行 `default` case。\n\
  \n![](img/45.jpg)\n\n## 问题\n\n在 `switch` 块的 `case` 中声明的局部变量的作用范围是什么？\n\n## 解决方案\n\
  \n为了理解 `switch-case` 中变量作用范围的概念，我们将通过 `Listing 5-6, TestJava14ScopeOfLocalVariable`\
  \ 所示的不同场景。\n\n## 场景 1：传统的 switch case 和局部变量\n\n以下代码片段展示了声明和使用局部变量传统方法：\n\n```java\n\
  private static void traditionalSwitch(String choice, int no1, int no2) {\n  switch\
  \ (choice) {\n  case \"addition\":\n    int value = no١ + no٢;\n    System.out.println(\"\
  Addition:-\" + value);\n    break;\n  case \"substraction\":\n    value = no١ -\
  \ no٢;\n    System.out.println(\"Substraction:-\" + value);\n    break;\n  default:\n\
  \    value = 0;\n    System.out.println(\"Wrong Option:-\" + value);\n  }\n}\n```\n\
  \n### 场景 2：修改后的 switch 中的局部变量\n\n以下代码片段展示了在修改后的 switch 中声明和使用局部变量的第一种方法：\n\n```java\n\
  private static void modifiedSwitchType1(String choice, int no1, int no2) {\n  switch\
  \ (choice) {\n  case \"addition\" -> {\n    int value = no١ + no٢;\n    System.out.println(\"\
  Addition:-\" + value);\n  }\n  case \"substraction\" -> {\n    int value = no١ -\
  \ no٢;\n    System.out.println(\"Substraction:-\" + value);\n  }\n  default -> {\n\
  \    int value = 0;\n    System.out.println(value);\n  }\n}\n}\n```\n\n## 场景 3：修改后的\
  \ switch 中在 switch 块之外的局部变量\n\n以下代码片段展示了在 cases 外部声明并使用局部变量的第二种方法：\n\n```java\n\
  private static void modifiedSwitchType2(String choice, int no1, int no2) {\n  int\
  \ value = 0;\n  switch (choice) {\n  case \"addition\" -> {\n    System.out.print(\"\
  Addition:-\");\n    value = no١ + no٢;\n  }\n  case \"substraction\" -> {\n    System.out.print(\"\
  Substraction:-\");\n    value = no١ - no٢;\n  }\n  default -> {\n    value = 0;\n\
  \  }\n  }\n  System.out.println(value);\n}\n}\n```\n\n## 输出\n\n当执行 `TestJava14ScopeOfLocalVariable.java`\
  \ 时，可以看到 图 5.6 所示的输出：\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6:** switch case 中的局部变量\n\
  \n## 解释\n\n传统上，我们通常在 `switch` 块之外声明局部变量并在 cases 内部使用，或者声明局部变量并在先前的 cases 中使用。这正是我们在\
  \ `Listing 5-6` 的 `traditionalSwitch()` 方法（场景 1）遵循遵循。\n\n场景 2 的目标是使用新的 `case L->`\
  \ 格式编写 cases。`case L ->` 的右侧限制为仅包含表达式、代码块或 `throw` 语句。这意味着如果我们需要表达式，可以在不使用赋值运算符的情况下编写它们。然而，当我们需要表达式时，局部变量需要声明并包含在大括号内。我们都意识到在块内部声明的变量作用范围局限于该块本身。根据场景\
  \ 2 中的规则，变量 `value` 的作用范围局限于块，而在后续所属的块中，我们可以声明另一个名为 `value` 的变量。你可以在 `Listing 5-6`\
  \ 的 `modifiedSwitchType1()` 方法中观察到这一点。场景 3 更有趣。现在的问题是如果在 switch 之外有一个变量会怎样？在这种情况下，作用范围是整个方法。任何尝试重新声明的都会报错。\n\
  \n46.jpg)\n\n## 问题\n\n如何在 switch 中使用表达式？\n\n## 解决方案\n\n你可以在 `Listing 5-7, TestSwitchExpression.java`\
  \ 中观察在修改后的 switch 中处理表达式的不同方法。在该类中定义了不同的场景，讨论如下：\n\n### 场景 1：不使用 switch 表达式\n\n\
  ```java\nprivate static void switchWithExpression1(int dayOfWeek) {\n  // TODO Auto-generated\
  \ method stub\n  switch (dayOfWeek) {\n    case 1 -> System.out.println(\"It›s Monday\"\
  );\n    case 2 -> System.out.println(\"It›s Tuesday\");\n    case 3 -> System.out.println(\"\
  It›s Wednesday\");\n    default -> System.out.println(\"Incorrect value for Day\"\
  );\n  }\n}\n```\n\n或者，我们我们也可以将上述代码编写如下：\n\n```java\nprivate static void switchWithExpression1(int\
  \ dayOfWeek) {\n  // TODO Auto-generated method stub\n  String value;\n  switch\
  \ (dayOfWeek) {\n    case 1 -> value=\"It›s Monday\";\n    case 2 -> value=\"It›s\
  \ Tuesday\";\n    case 3 -> value=\"It›s Wednesday\";\n    default -> value=\"Incorrect\
  \ value for Day\";\n  }\n}\n```\n\n### 场景 2：使用 switch 表达式\n\n```java\nprivate static\
  \ void switchWithExpression2(int dayOfWeek) {\n  // TODO Auto-generated method stub\n\
  }\n```\n\n\n\n\n\n### 3. // 场景 2：使用 switch 表达式\n\n```java\n  String result = switch\
  \ (dayOfWeek) {\n    case ١ -> \"这是周一\";\n    case ٢ -> \"It›s Tuesday\";\n    case\
  \ ٣ -> \"It›s Wednesday\";\n    default -> \"Incorrect value for Day\";\n  };\n\
  \  System.out.println(\"Result:-\" + result);\n}\n```\n\n### 场景 3：Switch 表达式和 System.out.println()\n\
  \n```java\nprivate static void switchWithExpressionForm3(int dayOfWeek) {\n  //\
  \ TODO Auto-generated method stub\n  // scenario 3 : switch expression and System.out.println\n\
  \  System.out.println(\"Result :\"+switch (dayOfWeek) {\n    case ١ -> \"It›s Monday\"\
  ;\n    case ٢ -> \"It›s Tuesday\";\n    case ٣ -> \"It›s Wednesday\";\n    default\
  \ -> \"Incorrect value for Day\";\n  });\n}\n```\n\n## 输出\n\n如果执行 `TestSwitchExpression.java`，将生成以下\
  \ 图 5.7：\n\n![](img/Figure-5.7.jpg)\n\n**图 5.7：** 使用表达式的 switch case\n\n## 解释\n\n\
  Java 14 提供了不同的方法来处理我们作为 case 块一部分的表达式。在场景 1 中（写在 Listing 的 `switchWithExpressionForm1()`\
  \ 方法中），我们使用了 `System.out.println(expression)`。不仅仅是一个打印语句，它可以是任何其他表达式、逻辑或操作。我们可以将表达式的值存储在某个局部变量中，并作为另一种方式进行打印。但这种风格是重复的、迂的，而且容易出错。\n\
  \n相反，我们可以像场景 2 所示用更清晰、更安全的方式来编写。在 Listing 5-7 `TestSwitchExpression.java` 的 `switchWithExpressionForm2()`\
  \ 方法中，我们将从每个 case 表达式的值收集到一个单个变量中。因此，无论匹配到哪个 case，该 case 的表达式都会被求值，并将结果存储在与整个 switch\
  \ 块映射的变量中。\n\nswitch 表达式的格式如下：\n\n```java\nT result = switch (argument) {\n    case\
  \ Label1 -> expression1;\n    case Label2 -> expression2;\n    default -> expression3;\n\
  };\n```\n\n在 switch 中使用表达式的另一种有趣方法是将整个 switch 块封装在 `System.out.println()` 语句中。这个场景\
  \ 3 在我们 Listing 5-7 `TestSwitchExpression.java` 的解决方案 `switchWithExpressionForm3()`\
  \ 中实现。这看起来像匿名内部类，但它其实不是！\n\nswitch 表达式的格式如下：\n\n```java\nSystem.out.println(switch\
  \ (argument) {\n    case Label1 -> expression1;\n    case Label2 -> expression2;\n\
  \    default -> expression3;\n});\n```\n\n![](img/47.jpg)\n\n## 问题\n\n我们可以在 case\
  \ 中执行某些操作并使用 switch 中的表达式将结果传递给某些变量吗？\n\n## 解决方案\n\n让我们通过以下不同的场景理解这个概念：\n\n### 场景\
  \ 1：Switch 表达式并在不使用代码块的情况下操作：\n\n```java\nint result = switch (choice) {\ncase \"\
  addition\" -> no1 +no2;\ndefault ->\n  0;\n};\n```\n\n### 场景 2：switch 表达式和带有代码块的\
  \ cases：\n\n```java\nint result = switch (choice) {\ncase \"subtraction\" -> {\n\
  \  no1 - no2;\n}\ndefault ->\n  0;\n};\n```\n\n### 场景 3：Switch 表达式和带有 return 语句的代码块的\
  \ cases：\n\n```java\nint result = switch (choice) {\ncase \"multiplication\"-> {\n\
  \  return no1 * no2;\n}\ndefault ->\n  0;\n};\n```\n\n## 解释\n\nswitch 语句被扩展用于作为\
  \ switch 表达式。通常情况下，switch 表达式在 `case L->` 的右侧有一个单一表达式。执行该表达式后求得的值将被返回。正如在场景 1 中讨论的，case\
  \ `\"addition\"` 将加法运算符提供两个数字的值，然后它返回并初始化变量 `result`。\n\n第二个场景将失败，因为我们使用的是代码块而不是单个语句或表达式。同样，第三个场景将导致错误。为什么呢？因为我们有复杂的逻辑，所以使用了大括号来包围逻辑，在此基础上，我们还使用了\
  \ return 语句来返回值。但我们正在使用 switch 表达式，它不允许使用 `return` 语句。每当我们遇到带有复杂逻辑的 case 时，我们需要记住两点：\n\
  \n*   用大括号包围逻辑并将 case 放在大括号中。\n*   不要返回值，而是使用 `Yield` 标识符。\n\n![](img/48.jpg)\n\n\
  ## 问题\n\n`Yield` 在 switch 表达式中的作用是什么？如何在 switch 的 case 块中返回计算出的值？\n\n## 解决方案\n\n\
  我们可以在传统的 case `(:)` 运算符以及增强 `(->)` 运算符中利用 `yield`。在我们的解决方案中，即 `Listing 5-8`，如下所示：\n\
  \n### 场景 1：传统的 case 使用 yield：\n\n```java\nprivate static void switchCase1(String\
  \ choice, int no1, int no2) {\n  System.out.println(\"Using Yield in traditional\
  \ case:\");\n  int result = switch (choice) {\n    case \"addition\":\n      yield\
  \ no1 + no2;\n    case \"subtraction\":\n      int sub = no1 - no2;\n      yield\
  \ sub;\n    case \"multiplication\":\n      yield no1 * no2;\n    default:\n   \
  \   yield 0;\n  };\n  System.out.println(\"Result:-\" + result);\n}\n```\n\n###\
  \ 场景 2：修改后的 case 使用 yield：\n\n```java\nprivate static void switchCase2(String choice,\
  \ int no1, int no2) {\n  System.out.println(\"Using Yield in modified case:\");\n\
  \  int result = switch (choice) {\n    case \"addition\" -> no1 + no2;\n    case\
  \ \"subtraction\" -> {\n      int sub = no1 - no2;\n      yield sub;\n    }\n  \
  \  case \"multiplication\" -> {\n      yield no1 * no2;\n    }\n    default -> 0;\n\
  \  };\n  System.out.println(\"Result:-\" + result);\n}\n```\n\n\n\n\n\n在我们的解决方案中，即\
  \ `Listing 5-8`，我们定义了方法 `swithCaseYieldForm1()`，在其中我们使用了带有表达式的传统 switch case。请注意，这里既没有\
  \ `break` 语句，也没有 `return` 语句。但 `Yield` 返回了表达式的值，理想情况下该值就是 switch 块的值。在同一个程序中，我们还定义了\
  \ `swithCaseYieldForm2()`。在这个方法中，我们使用了带有箭头操作符的 case，后面跟着表达式。表达式的值是由 `Yield` 语句返回的，而不是通过\
  \ `return` 语句。\n\n![](img/49.jpg)\n\n## NullPointerException 更好的描述方式\n\nJava 中最严重的异常之一是\
  \ `NullPointerException`。虽然我们可以处理此异常，但早期版本的 Java 没有提供关于该异常的清晰信息。在 Java 14 中，关于此异常的信息更具解释性。\n\
  \n## 问题\n\n`NullPointerException` 是如何增强的？\n\n## 解决方案\n\n`Listing 5-9, DemoEnhancedNullpointerException.java`\
  \ 显示了 Java 14 中 `NullPointerException` 的增强方法：\n\n```java\n//Listing 5-9\npackage\
  \ com.java14;\npublic class DemoEnhancedNullpointerException {\n  public static\
  \ void main(String[] args) {\n   String name=null;\n   System.out.println(\"length\
  \ of the name:-\"+ name.length());\n  }\n}\n```\n\n## 输出\n\n我们必须使用 Java 14 之前的编译器和\
  \ Java 14 编译器来编译并执行此程序，以理解 Java 14 如何提供此异常提供更多信息。\n\n## 使用 Java 14 之前的编译器\n\n当你使用\
  \ Java 14 之前的任何 Java 版本执行程序时，将得到如图 5.9 所示的输出：\n\n![](img/Figure-5.9.jpg)\n\n**图\
  \ 5.9:** NullPointerException PreJava14 编译\n\n## 使用 Java 14 编译器\n\n如果你使用 Java 14\
  \ 编译器执行相同的程序，将得到如图 5.10 所示的输出：\n\n![](img/Figure-5.10.jpg)\n\n**图 5.10:** NullPointerException\
  \ Java14 编译\n\n## 解释\n\n当我们使用面向对象的编程语言开发任何应用程序时，我们都在与对象交互。我们创建对象、获取对象并修改对象。虽然创建对象时并不复杂，但当我们从其他资源获取对象时，情况可能不符合预期。由于某些原因，我们尝试处理的对象可能没有初始化。问题在于这在编译应用程序时不会被追踪，但它会在运行时产生\
  \ `NullPointerException`。在这种情况下，JVM 生成的异常消息非常通用，很难从该消息中获取关于此异常来源和原因的准确信息。\n\n在我们在图\
  \ 5.9 所示的输出中，你可以看到只显示了异常类型和行号。此时，你可能会说：“这没问题！我处理它还需要些什么呢？”\n\n嗯，从某种程度上来说你是正确的，因为代码并不复杂。但如果代码非常复杂，单行包含多个一个对象引用，而你对是哪个引用或对象生成了此\
  \ `NullPointerException` 感到困惑呢？这就是 Java 14 中修改 `NullPointerException` 消息背后的想法。\n\
  \n根据从 Java 14 起提议并接受的更新，采用了更描述性的方式来指定空指针异常的原因。现在，当 JVM 在程序中尝试引用空值的任何点抛出 `NullPointerException`\
  \ 时，程序的字节码指令会精确确定是哪个变量引用了空。然后，它将通过消息描述该变量以及为什么该变量为空。此详细消息将显示在堆栈跟踪消息中，包含方法名、文件名和行号。你可以在之前的图\
  \ 5.10 所示的输出中观察到此描述。\n\n控制台上描述的消息包含两个部分：\n\n*   第一部分指定了哪项操作无法执行，因为某个字节码指令从操作数栈中弹出了空引用。\n\
  *   第二部分更复杂，并提供了 `NullPointerException` 的详细原因。这部分重现了将空引用推入操作数栈的源代码部分。\n\n![](img/50.jpg)\n\
  \n## 紧凑数字格式中的复数支持\n\n从 Java 14 开始，我们在紧凑数字格式（compact number format）中获得了德语的复数支持。\n\
  \n## 问题\n\nJava 14 的紧凑数字格式引入了什么新功能？\n\n## 解决方案\n\n`Listing 5-10, PluralCompactNumberFormat.java`\
  \ 显示了紧凑数字格式中引入的功能实际调用：\n\n```java\n//Listing 5-10\npackage com.java14;\nimport java.text.NumberFormat;\n\
  import java.util.List;\nimport java.util.Locale;\n\npublic class PluralCompactNumberFormat\
  \ {\n  public static void main(String[] args) {\n    compactFormat(Locale.CANADA);\n\
  \    compactFormat(Locale.GERMANY);\n  }\n  private static void compactFormat(Locale\
  \ locale) {\n    List<Integer> numList = List.of(1000, 5000000, 1000000);\n    System.out.println(\"\
  Numbers in \"+ locale);\n    numList.forEach((num) -> {\n      NumberFormat nf =\
  \ NumberFormat.getCompactInstance(locale, NumberFormat.Style.LONG);\n      System.out.println(nf.format(num));\n\
  \    });\n  }\n}\n```\n\n\n\n\n\n1. 在 Java 14 中创建 `SAXParser` 的不同方法有哪些？\n2. 如何在修改后的\
  \ switch-case 语句中从表达式返回值？\n3. `return` 语句和 `yield` 语句之间有什么区别？\n4. 有哪些可用的提供者可以生成文件系统？\n\
  5. Java 14 的 switch-case 引入了哪些新特性？\n\n# 第 6 章\n\n# Java 15 – 我 25 岁了\n\n## 引言\n\n\
  是时候庆祝了。Java 在 2020 年迎来了 25 周年。在这个竞争激烈的世界里，不仅要坚持 25 年，还要保持全球开发者领先编程语言的地位，并非易事。在这\
  \ 25 年中，Java 在不同版本中了一些显著特性。如果我们想回顾一些著名的概念，可以提到 Java 5 的 `Generics`、Java 8 的 `Lambda`\
  \ 表达式，当然还有 Java 9 的 `modules`。此外，Java 10 引入的新操作概念是基于时间的版本发布，即每六个月发布一个新版本。遵循这一路径，Oracle\
  \ 于 2020 年 9 月 15 日发布了 Java 15。\n\nJava 15 包含了一些功能，如 `Hidden class`（隐藏类）和 `Edwards-Curve\
  \ Digital Signature Algorithm` (`EdDSA`），后者用于更好的安全性。此外，早期版本中的某些预览特性（如文本块和 `ZGC`）在此版本中作为正式特性发布。尽管此版本没有包含许多更改或更新，但作为开发者，这些仍然是非常值得关注的改变。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下概念：\n\n* 使用文本块（text blocks）\n* 隐藏类（Hidden classes）\n* `CharSequence`\
  \ 接口的改进\n\n## 目标\n\n本章的目标是学习 Java 15 中发布的新特性。我们将讨论一些有趣的特性，例如文本块和隐藏类，它们被认为是 Java\
  \ 15 的主要特性。我们还将讨论该版本中的一些细变化，例如 `CharSequence` 接口的更新。\n\n## 安装\n\n在开始阅读本章这部分之前，请从以下资源下载\
  \ Java SE Development Kit 版本 15：\n\n[`www.oracle.com/java/technologies/javase/jdk15-archive-downloads.html`](https://www.oracle.com/java/technologies/javase/jdk15-archive-downloads.html)\n\
  \n## 使用文本块\n\n向 Java 中添加文本块的预览特性在 JDK 13 中添加，并在 JDK 15 中接受为正式特性。文本块被认为是一种多行字符串字面量，它避免了对大多数转义序列的需求，并以可预测的方式自动格式化字符串。它还可以在需要时对格式进行控制。文本块可以替换以前我们使用字符串字面量的地方，因为它更具表现力，且出现意外复杂性的概率较低。在实现文本块之前，我们首先需要理解在代码中使用多行字符串时，之前面临了什么样的复杂性。\n\
  \n在 Java 中，当我们需要在双引号 (\" \") 包围的字符串字面量中嵌入 HTML、XML、SQL 或 JSON 时，需要大量的编辑，并带有大量的转义序列和拼接。这种嵌入使得代码片段通常难以阅读和维护。\n\
  \n让我们通过后续章节讨论的多个场景来理解这一点。\n\n### 场景 1：使用 + 运算符处理嵌入字符串的 JSON\n\n以下代码 `Listing 6.1,\
  \ TestStringWithConcatationOperator.java` 展示了我们如何声明并初始化嵌入到字符串格式中的 JSON：\n\n```java\n\
  //Listing 6.1\npackage com.java15;\npublic class TestStringWithConcatationOperator{\n\
  \    public static void main(String[] args) {\n        String stringJSON = \"{\\\
  r\\n\"\n            + \"\\\"Name\\\" : \\\"Java\\\",\"\n            + \"\\n\\\"\
  ``RollNO\\\" : \\\"20\\\"\\r\\n\"\n            + \"}\";  System.out.println(stringJSON);\n\
  \    }\n}\n```\n\n## 解释\n\nJava 语言可以通过接受此类可能跨越源文件多行的巨大字符串来实现规范化。此外，通过想象内容中的转义，这些字符串可以代表格式化和布局操作，以及单个字符。\n\
  \n在上述代码中，我们使用 `'+'` 作为拼接运算符。可以观察到阅读一个简单的 JSON 对象是多么困难。\n\n我们必须提高程序中大型字符串的可读性和可写性。这些字符串可能跨越多行，因此在没有转义视觉干扰的情况下，人们能够阅读它们。这意味着我们需要一个二维块，而不是一维的字符序列。我们在这里需要的文本块。\n\
  \n### 场景 2：处理嵌入字符串运算符\n\n我们也可以将 XML 声明为字符串的一部分。通常，由于 XML 标签的复杂性，此类 XML 声明需要在多行中声明。在这种情况下，我们经常需要在多行之间使用\
  \ `\"+\"` 拼接运算符，如下代码 `Listing 6.2, TestStringWithConcatationOperator.java` 所示：\n\
  \n```java\n//Listing 6.2\npackage com.java15;\npublic class TestStringWithConcatationOperator{\n\
  \    public static void main(String[] args) {\n        String xml = \"<XML>\\n\"\
  \n            + \"  <language>\\n\"\n            + \"  <name>Java</name>\\n\"\n\
  \            + \"  <version>١٥</version>\\n\"\n            + \"  </language>\\n\"\
  \n            + \"</XML>\";System.out.println(xml);\n    }\n}\n```\n\n正如你所观察，上述代码由于大量的拼接运算符而看起来很复杂。\n\
  \n### 场景 3：处理嵌入 + 运算符\n\n我们可以使用 HTML 初始化字符串，如下代码 `Listing 6.3, TestStringWithConcatationHTML.java`\
  \ 所示：\n\n```java\n//Listing 6.3\npackage com.java15;\npublic class TestStringWithConcatationHTML{\n\
  \    public static void main(String[] args) {\n        String stringhtml = \"<<html>>\\\
  n\"\n            + \"  <body>\\n\"\n            + \"    <p>Welcome to Java ١٥</p>\\\
  n\"\n            + \"  </body>\\n\"\n            + \"</html>\";System.out.println(stringhtml);\n\
  \    }\n}\n```\n\n与之前的场景类似，你可以看到你需要使用 `+` 运算符来连接多行以生成单个字符串。\n\n### 场景 4：使用 StringBuilder\
  \ 处理嵌入 HTML\n\n与其使用 String，我们可以使用 `StringBuilder` 来初始化 HTML。以下代码 `Listing 6.4, TestStringWithStringBuilderHTML.java`\
  \ 展示了 `StringBuilder` 的用法：\n\n```java\n//Listing 6.4\npackage com.java15;\npublic\
  \ class TestStringWithStringBuilderHTML{\n    public static void main(String[] args)\
  \ {\n        String stringhtml = new StringBuilder()\n            .append(\"<html>\\\
  n\")\n            .append(\"  <body>\\n\")\n            .append(\"    <p>Welcome\
  \ to Java ١٥</p>\\n\")\n            .append(\"  </body>\\n\")\n            .append(\"\
  </html>\")\n            .toString();System.out.println(stringhtml);\n    }\n}\n\
  ```\n\n这段代码显然比使用 String 更具可读性。你可以看到，不再使用 `\"+\"` 运算符，可以使用链式 `append()` 方法并继续修改现有的\
  \ `StringBuilder` 对象。\n\n\n\n\n\n## 场景 5：使用 `String.format(string)` 函数处理嵌入 HTML\
  \ 的字符串\n\n声明多行字符串另一种方法是使用 `String` 对象的 `format()` 方法。观察以下代码 `Listing 6.5, TestStringWithStringFormatHTMl.java`：\n\
  \n```java\n//Listing 6.5\npackage com.java15;\npublic class TestStringWithStringFormatHTML{\n\
  \    public static void main(String[] args) {\n        String stringhtml = String.format(\"\
  %s\\n%s\\n%s\\n%s\\n%s\"\n            , \"<html>\"\n            , \"     <body>\"\
  \n            , \"          <p>Welcome to Java ١٥</p>\"\n            , \"     </body>\"\
  \n            , \"</html>\");\nSystem.out.println(stringhtml);\n    }\n}\n```\n\n\
  `format()` 方法将格式占位符作为第一个参数，然后你可以继续添加逗号分隔的值，这些值与第一个参数中声明的占位符相匹配。当你想要在单个字符串中使用多个格式时，这种方法非常有用。但阅读和维护起来有点复杂。\n\
  \n## 场景 6：使用 StringWriter 处理嵌入 HTML 的字符串\n\n我们也可以使用 `StringWriter` 对象来封装其中的 HTML\
  \ 内容。以下代码 `Listing 6.6, TestStringWithStringWriterHTML.java` 展示了相同的用法：\n\n```java\n\
  //Listing 6.6\npackage com.java15;\nimport java.io.*;\npublic class TestStringWithStringWriterHTML{\n\
  \  public static void main(String[] args) {\n  StringWriter sw = new StringWriter();\n\
  \  PrintWriter pw = new PrintWriter(sw);\npw.println(\"<html>\");\npw.println(\"\
  \     <body>\");\npw.println(\"          <p>Hello, World</p>\");\npw.println(\"\
  \     </body>\");\npw.println(\"</html>\");\n    String stringhtml = sw.toString();\n\
  System.out.println(stringhtml);\n  }\n}\n```\n\n### 场景 7：使用 String.join() 处理嵌入 HTML\
  \ 的字符串\n\n声明多行的另一种方法是使用 `String` 对象的 `join()` 方法。以下代码 `Listing 6.7, TestStringWithJoin.java`\
  \ 展示了如何使用此方法多行地声明 HTML 文本：\n\n```java\n//Listing 6.7\npackage com.java15;\npublic\
  \ class TestStringWithJoin{\n    public static void main(String[] args) {\n    \
  \    String stringhtml = String.join(\"\\n\"\n            , \"<html>\"\n       \
  \     , \"     <body>\"\n            , \"          <p>Welcome to Java ١٥</p>\"\n\
  \            , \"     </body>\"\n            , \"</html>\");\nSystem.out.println(stringhtml);\n\
  \    }\n}\n```\n![](img/52.jpg)\n\n## 问题\n如何处理包含 JSON、XML 或 HTML 的多行字符串？\n\n## 解决方案\n\
  我们将带你通过不同的场景，了解如何使用 Java 15 中的文本块（text block）。\n\n### 场景 1：处理 JSON\n以下代码展示了我们如何使用文本块而不是\
  \ `+` 运算符来声明 JSON。代码 `Listing 6.8` 展示了上述方法与文本块修改方法之间的区别：\n\n```java\n//Listing 6.8\n\
  package com.java15;\npublic class TestStringWithTextBlock{\n  public static void\
  \ main(String[] args) {\n  //传统方式\n  /* String JSON = \"{\"\n    + \"\\\"Name\\\"\
  \ : \\\"Java\\\",\"\n    + \"\\\"RollNO\\\" : \\\"20\\\"\"\n    + \"}\"; */\n  //\
  \ 使用文本块\n   String JSON = \"\"\"\n{\"name\" : \"Java\",\"name\" : \"20\"}\"\"\"\
  ;\n  System.out.println(JSON);\n  }\n}\n``` 解释\n如之前所述，在 Java 中，当我们想要在双引号（`\"`）括的字符串字面量中嵌入\
  \ HTML、SQL 或 JSON 代码段时，需要大量的编辑和许多的转义字符。这种嵌入使得代码段难以阅读和维护。\n\nJava 语言可以通过接受字符串足够大到跨越源文件的多行，并设想内容中的转义字符代表格式和布局以及单个字符，从而变得规范化。这使得大型代码变得复杂。这意味着需要提高大类的可读性和可写性，以便编码拥有一种语言机制，使得表示字符串比作为字符串字面量更具可行性。这些字符串可以跨越多行，因此在没有转义字符视觉干扰的情况下，可以轻松地阅读。这意味着我们需要一个二维文本块，而不是一维的字符序列。我们在这里需要的是文本块。\n\
  \n### 场景 2：处理 HTML 字符串\n以下代码 `Listing 6.9, TestStringWithTextBlockHTML.java` 展示了使用文本块声明多行\
  \ HTML：\n\n```java\n//Listing 6.9\npackage com.java15;\npublic class TestStringWithTextBlockHTML{\n\
  \    public static void main(String[] args) {\n//传统方式\n    /*String stringhtml =\
  \ \"<html>\\n\"\n        + \"     <body>\\n\"\n        + \"          <p>Welcome\
  \ to Java ١٥</p>\\n\"\n        + \"     </body>\\n\"\n        + \"</html>\"; */\n\
  \  // 使用文本块\n   String texthtml = \"\"\"\n        <html>\n          <body>\n   \
  \         <p>Welcome to Java ١٥</p>\n          </body>\n        </html>\"\"\";\n\
  \  System.out.println(texthtml);\n  }\n}\n```\n\n### 场景 3：处理 XML 字符串\n文本块也简化了 XML\
  \ 声明，如下代码 `Listing 6.10, TestStringWithTextBlock.java` 所示：\n\n```java\n//Listing\
  \ 6.10\npackage com.java15;\npublic class TestStringWithTextBlock{\n  public static\
  \ void main(String[] args) {\n//传统方式\n  /*String xml = \"<XML>\\n\"\n    + \"  <language>\\\
  n\"\n    + \"    <name>Java</name>\\n\"\n    + \"    <version>١٥</version>\\n\"\n\
  \    + \"  </language>\\n\"\n    + \"</XML>\"; */\n// 使用文本块\n    String stringxml=\
  \ \"\"\"\n<XML>\n  <language>\n    <name>Java</name>\n    <version> ١ १५</version>\n\
  \  </language>\n</XML>\"\"\" ;\nSystem.out.println(stringxml);\n  }\n}\n```\n![](img/53.jpg)\n\
  \n## 问题\n当我们使用文本块初始化包含 JSON 或 HTML 的字符串时，它会支持 `length()` 或 `indexOf()` 等字符串函数吗？\n\
  \n## 解决方案\n代码片段 `Listing 6.11,` 展示了对于使用文本块功能声明的字符串可以使用不同的字符串函数：\n\n```java\n//Listing\
  \ 6.11\npackage com.java15;\npublic class TestTextBlockStringFunctions {\n  public\
  \ static void main(String[] args) {\n  String textJSON = \"\"\"\n     {\"name\"\
  \ : \"Java\", \"RollNO\" : \"20\"}\"\"\";\n  System.out.println(\"Original text\
  \ :-\"+textJSON);\n  System.out.println(\"Contains java: \" + textJSON.contains(\"\
  java\"));\n  System.out.println(\"indexOf Java: \" + textJSON.indexOf(\"Java\"));\n\
  \  System.out.println(\"Length of text: \" + textJSON.length());\n  }\n}\n```\n\n\
  \n\n\n\n如果你执行上述代码，将显示如图 6.1 所示的：\n\n![](img/Figure-6.1.jpg)\n\n**图 6.1:** 带有文本块的\
  \ JSON\n\n## 解释\n\n文本块（text block）本质上 `java.lang.String` 类型的常量表达式，与字符串字面量相同。文本块的内容由\
  \ Java 编译器通过以下三个不同的步骤进行处理：\n\n1. 内容中的行终止符被翻译为 LF，即 `\\u000A`。\n2. 内容周围的偶然空白（incidental\
  \ white space，这些可能是为了匹配 Java 源代码的缩进而添加的）会被移除。\n3. 内容中的转义序列会被解释。\n\n这些处理后的内容现在被记录在类文件中，作为常量池中的\
  \ `CONSTANT_String_info` 条目，与字符串字面量类似。该类文件不包含该条目是源自文本块还是普通字符串字面量的信息。\n\n在执行时，文本块会被求值为一个\
  \ `String` 实例。如果我们有两个具有相同处理内容的文本块，那么它们将引用同一个 `String` 实例。这意味着字符串字面量和字符串文本块在视觉上不同，但在内部，它是一个字符串字面量并支持所有的\
  \ `String` 功能。\n\n![](img/54.jpg)\n\n## 问题\n\n`stripIndent()`、`translateEscapes()`\
  \ 和 `formatted(Object… args)` 方法提供了哪些功能？\n\n## 解决方案\n\n文本块提供了不同的辅助工具类或方法，讨论如下：\n\
  \n### `public String formatted()`\n\n让我们从 `formatted()` 函数开始，如下代码 `Listing 6.12,\
  \ TestForattedJSON.java` 所示：\n\n```java\n//Listing 6.12\npackage com.java15;\npublic\
  \ class TestFormattedJSON {\n    public static void main(String[] args) {\n    \
  \  String textJSON = \"\"\"\n        {\"name\" : \"٪s\",\n         \"age\" : \"\
  ٪d\",\n         \"contact\": \"٪s\"\n        \"\"\";\n      System.out.println(\"\
  String value before formatted()\\n \" +\n                          textJSON);\n\
  \      System.out.println(\"Applying formatted()function :-  \"\n\"\\n\" + textJSON.formatted(\"\
  Java15\", 20, \"12345\"));\n    }\n}\n```\n\n## 输出\n\n如果你执行上述代码，将显示如图 6.2 所示的：\n\
  \n![](img/Figure-6.2.jpg)\n\n**图 6.2:** 使用 formatted() 函数\n\n## 解释\n\nJDK 1.5 提供了\
  \ `String` 的 `format` 方法，以便如下代码所示格式化 JSON：\n\n```java\nString textJSON1 = \"\"\"\
  \n             {\"name\" : \"%s\",\n              \"age\" : \"%d\",\n          \
  \    \"contact\": \"%s\"\n             \"\"\";  \nSystem.out.println(String.format(textJSON1,\
  \ \"Java 1.5\", 20, \"909090\"));\n```\n\n在 JDK 15 中引入了 `formatted(Object… args)`\
  \ 方法。该方法在 Java 13 中被添加到 `String` 类中。该方法帮助格式化提供的参数：\n\n`public String formatted(Object…\
  \ args)`\n\n上述函数使用此字符串作为格式化字符串来格式化提供的参数。此方法等同于 `String` 的 `format(this, args)`。\n\
  \n方法参数如下：\n\n* `args`: 此字符串中格式占位符引用的参数。\n\n该方法返回格式化后的字符串。\n\n`formatted()` 方法的使用非常灵活，因为它可以用于在单行执行时设置不同的值。\n\
  \n### `public String stripIndent()`\n\n此方法返回字符串，其值是移除了每行开头和末尾偶然空白的字符串。\n\n*现在，什么是偶然空白？它是在哪里添加的？又是是谁添加的？*\n\
  \n偶然空白通常存在于文本块中，用于使内容与起始分隔符对齐。让我们考虑以下字符串：\n\n```java\nString html = \"\"\"\n<html>\n\
  \  <body>\n    <p>Welcome to Java 15</p>\n  </body>\n</html>\"\"\";\n```\n\n现在，`stripIndent()`\
  \ 方法将偶然空白视为缩进。此方法将产生一个保留字符串相对缩进的字符串。让我们使用 `|` 来对字符串进行缩进，它看起来如下：\n\n```\n|<html>\n\
  |  <body>\n    <p>Welcome to Java 15</p>\n  </body>\n|</html>\n```\n\n### `translateEscapes()`\n\
  \n此方法顾其名称所示翻译转义序列。以下代码 `Listing 6.13, TestEscapes.java` 显示了 `translateEscapes()`\
  \ 的用法：\n\n```java\n//Listing 6.13\npackage com.java15;\npublic class TestEscapes\
  \ {\n    public static void main(String[] args) {\n      String text = \"\"\"\n\
  \        df\\nThis is the new line having a tab\\t\n        \"\"\";\n      System.out.println(\"\
  The original text is follow:\\n\" + text);\n      text = text.translateEscapes();\n\
  \      System.out.println(\"Text after applying the method is follow:-\"\nn + text);\n\
  \    }\n}\n```\n\n## 输出\n\n如果你执行上述代码，将显示如图 6.3 所示的：\n\n![](img/Figure-6.3.jpg)\n\
  \n**图 6.3:** 使用 translateEscapes()\n\n## 解释\n\n`translateEscapes()` 方法用于翻译转义序列。该方法的语法如下：\n\
  \n`public String translateEscapes()`\n\n该方法通过翻译字符串中的转义序列来返回字符串。Unicode 转义在 Java\
  \ 编译器读取输入字符时会被翻译。转义序列的翻译如表 6.1 所示：\n\n| 转义符 | 名称 | 翻译 |\n| :--- | :--- | :--- |\n\
  | \\b | Backspace | U+008 |\n| \\t | horizontal tab | U+009 |\n| \\f | form feed\
  \ | U+00C |\n| \\r | carriage return | U+00D |\n| \\n | line feed | U+00A |\n| \\\
  s | Space | U+020 |\n| \\\" | double quote | U+0022 |\n| \\' | single quote | U+0027\
  \ |\n| \\\\ | Backslash | U+005C |\n| \\0 - \\377 | octal escape | 代码点等效值 |\n| \\\
  <line-terminator> | Continuation | discard |\n\n**表 6.1:** 转义序列\n\n![](img/55.jpg)\n\
  \n## 隐藏类\n\nJava 15 提供了使用隐藏类的功能。当我们不想在类路径中暴露源代码或类时，可以将类文件存储在其他位置。然后我们可以编码该类并使用 `MethodHandle`\
  \ 对象来使用该类的服务。\n\n## 问题\n\n如何使用隐藏类？\n\n## 解决方案\n\n为了理解这个概念，我们将两个类。`GreetMe.java`\
  \ 是我们想要作为隐藏类的类。这是一个简单的类，如下：\n\n```java\n//Listing 6.14\npackage com.java15;\npublic\
  \ class GreetMe {\n    public static String greet() {\n      return \"Welcome from\
  \ hidden method from hidden class\";\n    }\n    public String doTask(String task)\
  \ {\n      return \"I am done with \"+task;\n    }\n}\n```\n\n\n\n\n```java\npublic\
  \ static void main(String[] args) throws Throwable {\n  String hiddenfilePath =\
  \ \"D:/Java9+Recipes/Java15Demos/com/java15/GreetMe.class\";\n  byte[] bytes = Files.readAllBytes(Paths.get(hiddenfilePath));\n\
  \  //Generated byte data for the class file\n  byte[] classByteData = Base64.getDecoder()\n\
  \      .decode(Base64.getEncoder().encodeToString(bytes));\n  //Defining lookup()\
  \ for hidden class and methods\n  Class<?> proxyClass = MethodHandles.lookup()\n\
  \      .defineHiddenClass(classByteData, true,\n          MethodHandles.Lookup.ClassOption.NESTMATE).lookupClass();\n\
  \  System.out.println(\"Class Name:= \"+proxyClass.getName());\n  System.out.println(\"\
  Methods in class:->\");\n  for (Method method : proxyClass.getDeclaredMethods())\
  \ {\n    System.out.println(\"Method Name:= \"+method.getName());\n  }\n  //Invoking\
  \ static method without creating instance\n  MethodHandle handler = MethodHandles.lookup()\n\
  \              .findStatic(proxyClass, \"greet\",\n                  MethodType.methodType(String.class));\n\
  \  System.out.println((String) handler.invokeExact());\n  //creating instance of\
  \ hidden class\n  Object object=proxyClass.getConstructor().newInstance();\n  //invoking\
  \ the method with argument\n  Method method=object.getClass()\n              .getDeclaredMethod(\"\
  doTask\",String.class);\n  System.out.println(method.invoke(object, \"Learning Hidden\
  \ Class\"));\n}\n```\n\n## 输出\n\n如果你执行 `GreetMeTest.java`，将显示图 6.4 所示的输出：\n\n![](img/Figure-6.4.jpg)\n\
  \n**图 6.4:** 使用隐藏类（Hidden class）\n\n## 解析\n\nJava 15 引入了一个名为“隐藏类”（Hidden Class）的特性特性。它是通过类加载器限制特定类访问的方法。此类类不能被其他类的字节码直接使用。你也可以将其视为不可发现的。这与你从\
  \ JDK 8.0 开始一直使用的 lambda 表达式相似。当运行时使用 lambda 表达式时，该类会在背后为你实例化。\n\n在 JDK 15 中，通过调用\
  \ `defineHiddenClass()` 方法创建隐藏类。在`Listing 6.15` 下提到的代码中，你可以看到从第 22 行开始的代码片段：\n\n\
  ```java\nClass<?> proxyClass = MethodHandles.lookup()\n    .defineHiddenClass(classByteData,\
  \ true,\n        MethodHandles.Lookup.ClassOption.NESTMATE).lookupClass();\n```\n\
  \n`defineHiddenClass()` 方法根据传递给它的参数中的字节检索隐藏类。\n\n该方法的参数如下：\n\n* `bytes`: 这些是组成类数据的字节，格式为\
  \ Java 虚拟机规范定义的有效类文件格式。\n* `initialize`: 如果传递的值为 `true`，则该类将被初始化。\n* `options`:\
  \ 这些是类选项。它可以具有以下值之一：\n\n    * `NESTMATE`: 指定隐藏类可以作为嵌套伙伴（nestmate）添加到查找类（lookup class）的嵌套结构中。\n\
  \    * `STRONG`: 指定隐藏类与类加载器之间存在强引用。\n\n该方法返回具有原始且完全权限访问的该隐藏类的查找对象。\n\n一旦获取了类，你就可以通过反射过程获取该类的类名和方法。一旦导出类，你就可以调用该类的静态或非静态方法。\n\
  \n## 调用静态方法\n\n要调用静态方法，你需要创建 `MethodHandle` 引用。你可以在下面的代码中观察到这一点：\n\n```java\nMethodHandle\
  \ handler = MethodHandles.lookup()\n    .findStatic(proxyClass, \"greet\",\n   \
  \     MethodType.methodType(String.class));\n```\n\n`findStatic` 方法用于定位方法。参数如下：\n\
  \n* `proxyClass`: 静态方法的类。\n* `greet`: 静态方法的名称。\n* `MethodType.methodType(String.class)`:\
  \ 方法的签名。\n\n一旦获取了 `MethodHandle`，你可以使用 `invokeExact()` 调用它：\n\n```java\nSystem.out.println((String)\
  \ handler.invokeExact());\n```\n\n要调用非静态方法，你需要如下创建隐藏类的实例：\n\n```java\nObject object=proxyClass.getConstructor().newInstance();\n\
  ```\n\n一旦获取了对象，你可以使用以下方法：\n\n```java\nMethod method=object.getClass()\n    .getDeclaredMethod(\"\
  doTask\",String.class);\nSystem.out.println(method.invoke(object, \"Learning Hidden\
  \ Class\"));\n```\n\n\n\n\n在内部，该方法使用了 `length()` 方法。如果 `length()` 返回 0，则该方法返回 true，否则返回\
  \ false。\n\n在我们的解决方案中，即 `Listing 6.16` 第 23 行，我们使用了该方法来检查数组是否包含空字符串，如下：\n\n```java\n\
  if(student!=null && !student.isEmpty()){\n    students.add(student);\n}\n```\n\n\
  ![](img/56.jpg)\n\n## 结论\n\n在本章中，我们讨论了作为 Java 15 部分引入的特性。我们讨论了文本块（text block），从开发角度来看，这是该版本中的主要更新之一。我们深入讨论了如何使用文本块以更灵活的方式声明多行字符串、Html\
  \ 和 JSON。我们还讨论了如何实现隐藏类（hidden class）概念，以及调用隐藏类的静态方法和非静态方法的不同方法。\n\n在下一章中，我们将学习如何实现\
  \ Java 16 中发布的新功能。\n\n## 关键术语\n\n*   `format()`\n*   `stripIndent()`\n*   `translateEscapes()`\n\
  *   `formatted()`\n*   `MethodHandles`\n*   `findStatic()`\n*   `invoke()`\n*  \
  \ `invokeExact()`\n*   `isEmpty()`\n\n## 问题\n\n1. 文本块的意义是什么？\n2. 什么是隐藏类？你该如何加载它？\n\
  3. 调用隐藏类方法的不同方法有哪些？\n4. 解释 `translateEscape()` 方法的用法。\n5. Java 15 中的 `CharSequence`\
  \ 进行了哪些新的修改？\n\n# 第 7 章：Java 16 – 扬帆起\n\n## 引言\n\n当你们都在工作和理解 Java 15 时，Oracle 团队一直在不断投入他们的新发布周期工作。遵循每六个月一次的时间版本发布周期，Java\
  \ 16 于 2021 年 3 月 16 日发布。这被认为是长期支持（LTS）版本 17 之前的最后一个次要版本。\n\n该版本中建议的改进背后的主要思想之一是性能优化和洁洁代码方法。诸如\
  \ `Record` 类等概念（在该版本中作为生产就绪的特性发布）减少了样板代码，有助于创建更简洁整洁的代码。同样，引入了带有模式匹配的 `instanceof`\
  \ 运算符，减少了在方法内部声明局部变量的需求。除了这些，密封类（Sealed classes）也进行了大量的更新，它是它是 Java 15 中的一个预览特性。在该版本中，该特性仍保持为预览特性。本章主要关注生产就绪的特性，而不是预览特性。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下概念：\n\n*   来自代理的默认方法调用\n*   改进的日期-时间 API\n*   修改后的 Stream\
  \ API\n*   `instanceof` 运算符的模式匹配\n*   Record 类\n*   `JPackage` 工具\n\n## 目标\n\n本章的目标是实现并学习\
  \ Java 16 中引入的新功能。在本章中，我们将讨论不同的概念，例如从代理对象调用接口的默认方法、record 类以及改进的日期-时间 API。我们还将讨论如何使用该版本引入的\
  \ `jpackage` 工具创建安装程序/打包器的有趣概念。\n\n## 安装\n\n在开始阅读本章之前，请访问以下 URL 下载 Java 16：\n\n\
  [`www.oracle.com/java/technologies/javase/jdk16-archive-downloads.html`](https://www.oracle.com/java/technologies/javase/jdk16-archive-downloads.html)\n\
  \n## 来自代理的默认方法调用\n\n正如我们从 Java 8 所了解的，我们可以在接口中拥有默认方法。在 Java 16 中，可以使用代理对象调用此类默认方法。\n\
  \n## 问题\n\n如何使用代理对象调用接口中声明的默认方法？\n\n## 解决方案\n\n观察以下代码片段。`Listing 7-1` 是一个接口，`InvokeDefaultMethodsFromPxyInstances.java`，它包含一个默认方法：\n\
  \n```java\n//Listing 7-1\npackage com.java16.proxymethod;\ninterface InvokeDefaultMethodsFromProxyInstances\
  \ {\n    default String defaultFunction() {\n        return \"Default Function invoked\"\
  ;\n    }\n}\n```\n\n`Listing 7-2, ProxyinstanceDemo.java` 展示了我们如何为 `Listing 7.1`\
  \ 中声明的接口创建代理实例，以及如何调用它的默认方法：\n\n```java\n//Listing 7-2\npackage com.java16.proxymethod;\n\
  import java.lang.reflect.InvocationHandler;\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Proxy;\n\npublic class ProxyinstanceDemo {\n    public\
  \ static void main(String[] args) {\n        Object proxy = Proxy.newProxyInstance(\n\
  \            ClassLoader.getSystemClassLoader(),\n            new Class<?> { InvokeDefaultMethodsFromProxyInstances.class\
  \ },\n            (proxy, method, arg) -> {\n                if (method.isDefault())\
  \ {\n                    return InvocationHandler.invokeDefault(proxy, method, arg);\n\
  \                }\n                return proxy;\n            }\n        );\n \
  \       try {\n            Method method = proxy.getClass().getMethod(\"defaultFunction\"\
  );\n            Object value = method.invoke(proxy);\n            System.out.println(value.toString());\n\
  \        } catch (NoSuchMethodException | SecurityException e) {\n            e.printStackTrace();\n\
  \        } catch (IllegalAccessException e) {\n            e.printStackTrace();\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \    }\n}\n```\n\n## 输出\n\n如果你执行 `ProxyinstanceDemo.java`，你会观察到 `InvokeDefaultMethodsFromProxy.java`\
  \ 接口的默认方法是通过代理调用的。\n\n## 解释\n\n正如我们从 Java 8 所了解的，我们可以在接口中拥有默认方法。在 Java 16 中，可以使用代理对象调用此类默认方法。\n\
  \n可以使用 `InvocationHandler` 来执行代理调用。代理实例的处理器实现了 `InvocationHandler` 接口。每个代理实例都有一个关联的处理器。当在该代理实例上调用方法时，该方法调用会被编码。之后，它会被分发到其处理器的\
  \ `invoke` 方法。在 Java 16 之前，开发者使用 `invoke()` 方法来处理代理实例上的方法调用。现在在 Java 16 中，我们有了 `invokeDefault()`\
  \ 方法：\n\n```java\nstatic Object invokeDefault(Object proxy, Method method, Object...\
  \ args) throws Throwable\n```\n\n方法参数如下：\n\n*   **`proxy`**：需要调用默认方法的代理实例。\n*  \
  \ **`method`**：对应于代理类接口中声明的默认方法的实例，或直接或间接从其父接口继承的方法。\n*   **`args`**：用于方法调用的参数。如果方法所需的形式参数数量为零，则参数可以为\
  \ null。\n\n该方法返回方法调用的返回值。\n\n\n\n该方法根据指定的参数在给定的代理实例上调用指定的默认方法。我们需要记住一点：指定的方法必须是代理类的代理接口中声明的默认方法，或者它可以直接或间接地继承自其父类接口。\n\
  \n![](img/57.jpg)\n\n## 改进的日期-时间 API\n\n人们一直在努力让日期-时间 API 更有意义。Java 16 对此 API 进行了一些重大更改，以确保开发者能够生成更符合用户定义的日期和时间实例。\n\
  \n## 问题\n\n我如何使用日期-时间 API 来指定一天中段的值，例如“上午”（in the morning）或“晚上”（at night），而不仅仅是指定\
  \ AM/PM？\n\n## 解决方案\n\n我们可以使用字母 `‘B’` 来实现，它可以用于 `ofPattern()` 方法中。\n\n让我们带您了解不同的场景，以获取“一天中”的概念。\n\
  \n### 场景 1：以一天中的格式查找当前时间\n\n`Listing 7-3`，`PeriodDateDemo.java` 展示了如何使用 `ofPattern()`\
  \ 提供的属性‘B’来在给定日期上显示一天中：\n\n```java\n//Listing 7-3\npackage com.java16.dateformat;\n\
  import java.time.Instant;\nimport java.time.OffsetDateTime;\nimport java.time.ZoneOffset;\n\
  import java.time.format.DateTimeFormatter;\n\npublic class PeriodDateDemo {\n  public\
  \ static void main(String[] args) {\n    // TODO Auto-generated method stub\n  \
  \  DateTimeFormatter dateTimeFormat = DateTimeFormatter\n                      \
  \        .ofPattern(\"hh B\");\n    for (int hour = ٠; hour < ٢٤; hour+=٤) {\n \
  \     final OffsetDateTime dateTime = Instant.now()\n                          .atOffset(ZoneOffset.UTC).withHour(hour);\n\
  \      System.out.println(\"Hour \" + hour + \": \\\"\" +\n                    \
  \      dateTimeFormat.format(dateTime)+\"\\\"\");\n    }\n  }\n}\n```\n\n## 输出\n\
  \n当我们执行 `PeriodDateDemo.java` 时，将显示[图 7.1]所示的输出：\n\n![](img/Figure-7.1.jpg)\n\n\
  **图 7.1：**带有时时间的修改时间\n\n## 解释\n\n在大多数与日期相关的情况下，我们使用或倾向于使用 **上午** (**AM**) 和 **下午**\
  \ (**PM**) 标识符来描述时间。然而，Unicode 文档描述了定义一天中段的“时段规则集”。可以使用“昨晚”（last night）或“晚上”（at\
  \ night）来指定晚上 10:00。这允许人们以适当的格式追踪诸如接收邮件、快递、代码交付等情况，例如“您的快递已在上午送达”，而不是说 AM 或 PM。\n\
  \n新的格式化模式字母 `‘B’` 及其支持的方法已添加到 `java.time.format.DateTimeFormatter` 和 `java.time.format.DateTimeFormatterBuilder`\
  \ 类中。该模式及其方法翻译了 `Unicode Consortium's CLDR` 中定义的一天段。现在使用更新后的方法，应用程序可以表示一天中的时段，例如“上午”、“晚上”等。\n\
  \n### 场景 2：使用提供的字符串根据一天中的段查找本地时间\n\n`Listing 7-4`，`ParsingTimeDemo.java` 提供了使用 `parse()`\
  \ 方法生成 `LocalTime` 然后将其传递给 `ofPattern()` 方法以显示一天中的段解决方案：\n\n```java\n//Listing 7-4\n\
  package com.java16.dateformat;\nimport java.time.LocalTime;\nimport java.time.format.DateTimeFormatter;\n\
  \npublic class ParsingTimeDemo {\n  public static void main(String[] args) {\n \
  \   // TODO Auto-generated method stub\n    LocalTime date = LocalTime.parse(\"\
  ١٥:٢٥:٠٨.٩٧١\");\n    DateTimeFormatter formatter = DateTimeFormatter.ofPattern(\"\
  h B\");\n    String format=date.format(formatter);\n    System.out.println(\"Time\
  \ with only Hour =>\");\n    System.out.println(\"Fatted Date String \"+format);\n\
  \    formatter = DateTimeFormatter.ofPattern(\"hh mm B\");\n    format=date.format(formatter);\n\
  \    System.out.println(\"Time with Hour and Minute =>\");\n    System.out.println(\"\
  Formatted Date String\"+format);\n  }\n}\n```\n\n## 输出\n\n当我们执行 `ParsingTimeDemo.java`\
  \ 时，显示[图 7.2]中的输出：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：**使用 `parse()` 方法带有一天中的段的修改时间\n\
  \n## 解释\n\n在这里，我们使用 `LocalTime.parse(CharSequence)` 方法查找本地时间。一旦获取了本地时间，我们就使用 `DateTimeFormatter.ofPattern()`\
  \ 方法来获取一天中的段。\n\n方法的语法如下：\n```\npublic static LocalTime parse(CharSequence text,\
  \ DateTimeFormatter formatter)\n```\n方法的参数如下：\n- `text`：要解析的文本，不为空。\n- `formatter`：要使用的格式化器，不为空。\n\
  该方法从字符序列返回 `LocalTime` 实例，该实例使用格式化器进行解析。\n\n### 场景 3：带有时区详情生成小时、一天段\n\n`Listing\
  \ 7-5`，`PeriodZonedTimeDemo.java` 展示了为给定日期生成带有一天段的小的过程：\n\n```java\n//Listing 7-5\n\
  package com.java16.dateformat;\nimport java.time.Instant;\nimport java.time.ZoneId;\n\
  import java.time.ZonedDateTime;\nimport java.time.format.DateTimeFormatter;\n\n\
  public class PeriodZonedTimeDemo {\n  public static void main(String[] args) {\n\
  \    // TODO Auto-generated method stub\n    ZonedDateTime zonedDateTime = Instant.now()\n\
  \                              .atZone(ZoneId.systemDefault());\n    String dateTimeStr\
  \ = DateTimeFormatter.ofPattern(\"hh B, zzzz\")\n                              .format(zonedDateTime);\n\
  \    System.out.println(\"Hour, Day Period, Zone: \" + dateTimeStr);\n  }\n}\n```\n\
  \n## 输出\n\n当我们执行 `PeriodZonedTimeDemo.java` 时，将得到输出：\n\n`Hour, Day Period, Zone:\
  \ 10 in the morning`\n\n## 解释\n\n在前两个场景中，我们为本地日期使用了 `ofPattern()` 方法。除此之外，我们还可以向此方法传递时区详情。这将格式化对应于给定时区的时间。\n\
  \n在我们的解决方案第 14 行，通过在当前实例调用 `atZone()` 方法创建了 `ZonedDateTime` 实例。`ZoneId.systemDefault()`\
  \ 生成系统时区。\n\n该时区时间随后传递给 `format()` 方法，该方法链接到 `ofPattern()`，如第 15 行所示。\n\n要在 `ofPattern()`\
  \ 打印时区，我们需要在字符串中提供 `\"zzzz\"` 标识符，如解决方案所示。\n\n### 场景 4：获取带有时区详情的精确时间和一天段\n\n我们可以使用\
  \ `DateTimeFormatter` 的 `ofPattern()` 方法，该方法接受小时、分钟、一天段和时区详情，如下代码 `Listing 7-6`\
  \ 所示：\n\n```java\n//Listing 7-6\npackage com.java16.dateformat;\nimport java.time.Instant;\n\
  import java.time.ZoneId;\nimport java.time.ZonedDateTime;\nimport java.time.format.DateTimeFormatter;\n\
  \npublic class PeriodZonedTimeInHourMinuteDemo {\n  public static void main(String[]\
  \ args) {\n    // TODO Auto-generated method stub\n    ZonedDateTime zonedDateTime\
  \ = Instant.now()\n                              .atZone(ZoneId.systemDefault());\n\
  \    String dateTimeStr = DateTimeFormatter.ofPattern(\"K:mm B z\")\n          \
  \                    .format(zonedDateTime);\n  }\n}\n```\n\n\n\n```java\n15.  System.out.println(\"\
  Hour, Day Period, Zone: \" + dateTimeStr);\n16.  }\n17. }\n```\n\n## 输出\n\n当你执行\
  \ `PeriodWithZonedTimeInHourMinuteDemo.java` 时，将得到输出：`Hour, Day Period, Zone: 10:26\
  \ in the morning IST`。\n\n## 解释\n\n在第二个场景中，我们看到了如何显示小时、分钟以及一天的时段。然后，在第三个场景中，我们学习了如何显示给定时间的区域信息。此外，我们还可以通过修改传递它的字符串来自定义\
  \ `ofPattern()` 方法的输出。\n\n如果我们想以小时和分钟的格式显示时间以及区域和一天的时段，我们可以向 `ofPattern()` 方法提供指定符\
  \ `K:mm B z`，如第 14 行所示。\n\n### 场景 5：获取不同的小时以对应不同的时段\n\n我们可以使用 `DateTimeFormatter`\
  \ 的 `ofPattern()` 方法，它接受小时、分钟、一天的时段和区域详情，从而产生所需的输出。我们需要从第 0 小时到第 24 小时进行迭代，如 `Listing\
  \ 7-7`、`PeriodThroughDayDemo.java` 所示：\n\n```java\n//Listing 7-7\npackage com.java16.dateformat;\n\
  import java.time.Instant;\nimport java.time.OffsetDateTime;\nimport java.time.ZoneOffset;\n\
  import java.time.format.DateTimeFormatter;\n\npublic class PeriodThroughDayDemo\
  \ {\n    public static void main(String[] args) {\n        DateTimeFormatter dateTimeFormat\
  \ = DateTimeFormatter\n            .ofPattern(\"hh B\");\n        for (int hour\
  \ = ٠; hour < ٢٤; hour++) {\n            final OffsetDateTime dateTime = Instant.now()\n\
  \                .atOffset(ZoneOffset.UTC).withHour(hour);\n            System.out.println(\"\
  Hour \" + hour + \": \\\"\" + dateTimeFormat\n                .format(dateTime)\
  \ + \"\\\"\");\n        }\n    }\n}\n```\n\n## 输出\n\n如果你执行 `PeriodThroughDay.java`，你将获得一天中所有不同时段的小时。以下图\
  \ 7.3 显示了部分输出：\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：**一天中修改后的时间\n\n![](img/58.jpg)\n\
  \n## 修改后的 Stream API\n\nJava 16 在 Stream API 中提供了一个额外功能，通过它你可以将现有流转换为不可修改的列表。\n\n\
  ## 问题\n\n如何使用 Stream API 收集列表中过滤后的元素，使得无法向该列表添加任何后续元素？\n\n## 解决方案\n\n我们可以使用流的 `toList()`\
  \ 方法从现有流创建 `List`。此列表是不可修改的，如 `Listing 7-8`、`StreamtoListDemo.java` 所示：\n\n```java\n\
  //Listing 7-8\npackage com.java16.stream;\nimport java.util.Arrays;\nimport java.util.Comparator;\n\
  import java.util.List;\nimport java.util.stream.Collectors;\n\npublic class StreamtoListDemo\
  \ {\n    public static void main(String[] args) {\n        // TODO 自动生成的方法存根\n \
  \       List<String> fruits = Arrays.asList(\"Banana\", \"Mango\", \"Apple\", \"\
  Papaya\");\n        List<Integer> fruitlengthList = fruits.stream().map((fruit)\
  \ -> {\n            return fruit.length();\n        }).collect(Collectors.toList());\n\
  \        System.out.println(\"生成的原始列表 (Java٥) :\");\n        System.out.println(fruitlengthList);\n\
  \        fruitlengthList.add(٠);\n        System.out.println(\"修改后的列表: \" + fruitlengthList);\n\
  \n        List<Integer> intsEquivalentFruits = fruits.stream().map((fruit)-> return\
  \ fruit.length();}).toList();\n        System.out.println(\"生成的原始列表 (Java٦) :\"\
  );\n        System.out.println(intsEquivalentFruits);\n        intsEquivalentFruits.add(٠);\n\
  \        System.out.println(\"修改后的列表: \" + intsEquivalentFruits);\n    }\n}\n```\n\
  \n## 输出\n\n如果你执行上述代码，将观察到以下输出。请注意图 7.4 输出所示的异常：\n\n![](img/Figure-7.4.jpg)\n\n**图\
  \ 7.4：**来自流的不可修改列表\n\n## 解释\n\n在 Java 16 之前，我们使用 Stream 的 `collect(Collectors.toList())`\
  \ 方法以有序的方式收集元素。现在，Java 16 为所有操作收集列表中的数据提供了更简洁的语法。虽然代码更简洁了，但我们需要记住一点：流的 `toList()`\
  \ 方法返回的列表是不可变的，因此既无法修改也无法进行排序。方法的签名如下：\n\n`default List<T> toList()`\n\n这是可以在流上执行的终端操作，将其元素累积到列表中。方法返回的列表不能进一步修改，且元素将与流中的顺序相同。对任何类型变器方法的调用将始终导致抛出\
  \ `UnsupportedOperationException`。我们可以拥有基于值的元素的返回值。在这些实例上进行标识敏感的操作是不可靠的。\n\n![](img/59.jpg)\n\
  \n## instanceof 运算符中的模式匹配\n\n作为开发者，理解 `instanceof` 运算符对我们重要的作用是必要的。我们使用该运算符来检查实例类型。传统\
  \ `instanceof` 运算符的一个主要缺点（除非你在学习 Java 16 的 `instanceof` 运算符时注意到）是需要进行局部变量类型转换。Java\
  \ 16 修改后的 `instanceof` 运算符帮助你编写更具可读性且紧凑的类型转换样板代码。\n\n## 问题\n\n如何使用模式匹配使用 `instanceOf`\
  \ 运算符？\n\n## 解决方案\n\n`Listing 7-9` 是不同类的集合；`Employee`、`Manager` 和 `DemoInstanceOf`，是修改后的\
  \ `instanceof` 运算符的说明：\n\n```java\n//Listing 7-9\npackage com.java16.instanceOf\n\
  class Employee {\n    private int empId;\n    // 默认构造函数和参数化构造函数\n    // getter,\
  \ setter 方法\n    public double calculateSalary() {\n        return 1000;\n    }\n\
  }\nclass Manager extends Employee {\n    double experience;\n    // 默认构造函数和参数化构造函数\n\
  \    // getter, setter 方法\n    @Override\n    public double calculateSalary() {\n\
  \        double base_sal = super.calculateSalary();\n        if (experience >= 5)\
  \ {\n            return base_sal + 5000;\n        } else\n            return base_sal\
  \ + 2000;\n        }\n    }\n}\npublic class DemoInstanceOf {\n    public static\
  \ void main(String[] args) {\n        Manager m = new Manager(12, 120);\n      \
  \  checkInstance1(m);\n    }\n    public static void checkInstance1(Employee e)\
  \ {\n        if (e instanceof Manager m) {\n            System.out.println(\"I am\
  \ manager:\"+m.getExperience() + m.getEmpId()+\":\"+m.calculateSalary());\n    \
  \    }\n    }\n}\n```\n\n\n\n模式是一个执行测试的谓词和一组局部变量的组合，这些变量被称为模式变量。当谓词匹配成功时，该模式变量将获得从谓词得到的值。现在，`instanceof`\
  \ 运算符采用的是类型模式，而不仅仅是类型。\n\n在 JDK 16 中，`instanceof` 运算符的模式匹配允许 Java 程序中的通用逻辑以更简洁、安全的方式表达`instanceof`\
  \ 运算符将指定的对象与提供的类型进行匹配。当指定对象的类型匹配时，它会被强制转换为该类型。之后，它的值会被赋值给声明的变量。\n\n在我们的解决方案中，你将看到第\
  \ 33 行：\n```java\nif (e instanceof Manager m)\n```\n\n在这种情况下，如果 `e` 是 `Manager`\
  \ 的实例，那么我们不需要任何进一步的强制转换。局部变量 `m` 被赋值为 `Manager` 类型，用于从提供的实例中提取数据。\n\n![](img/60.jpg)\n\
  \n## 问题\n\n我们如何在继承层次结构（包括其父类）中使用模式匹配使用 `instanceof` 运算符？\n\n## 解决方案\n\n让我们修改早期代码片段中的\
  \ `checkInstance1()` 定义，以检查实例是否为 `Employee` 类型类型：\n\n```java\npublic static void\
  \ checkInstance1(Employee e) {\n  if (e instanceof Employee e1) {\n    System.out.println(\"\
  i am employee\"+e1.getEmpId() +\":\"+\n                        e1.calculateSalary());\n\
  \  } else if (e instanceof Manager m) {\n    System.out.println(\"i am manager:\"\
  +m.getExperience() +\n                       m.getEmpId() +\":\"+ m.calculateSalary());\n\
  \  }\n}\n```\n\n这段代码会导致“表达式类型不能为模式类型的子类型”的编译错误。因此，让我们添加如下另一个定义：\n\n```java\npublic\
  \ static void checkInstance(Object e) {\n  if (e instanceof Employee e1) {\n   \
  \ System.out.println(\"I am an employee\"+e1.getEmpId() +\":\"+\n              \
  \          e1.calculateSalary());\n  } else if (e instanceof Manager m) {\n    System.out.println(\"\
  I am a manager:\"+m.getExperience() +\n                       m.getEmpId() +\":\"\
  + m.calculateSalary());\n  }\n}\n```\n\n这段代码现在可以在没有任何编译错误的情况下运行。\n\n## 解释\n\n我们无法直接使用\
  \ `instanceof` 运算符来与父类类型进行比较，这就是我们在第一次修改中遇到错误的原因。但在第二次修改中，方法的参数更改为了 `Object` 而不是\
  \ `Employee`。现在，考虑到 Java 基础，我们都知道 `Employee` 是 `Object` 的子类。\n\n因此，编译器可以轻松地检查接收到的实例是\
  \ `Employee` 类型还是 `Manager` 类型等。\n\n![](img/61.jpg)\n\n## Record 类 (Record classes)\n\
  \n面向对象编程的基本构建模块是类。在软件开发过程中，我们可能需要编写数百个类。虽然每个类在不同场景下都被视为不同的模型，但我们经常需要编写类的一部分作为模板代码。构造函数、访问器/修改器方法，以及如\
  \ `toString()`、`equals()` 等方法在几乎每个类中都会用到。Record 类是 Java 16 推新功能之一，它会自动创建所有此类方法。\n\
  \n## 问题\n\n如何声明 record 类？\n\n## 解决方案\n\n下面一行显示了 record 类声明的基本结构：\n\n```java\npublic\
  \ record SimpleRecordClass(data_type argument1, ..) { }\n```\n\n## 解释\n\n现在，Java\
  \ 有了 record 类作为一种新类。record 类用于支持纯数据聚合。record 类是一种声明，它作为类的一部分创建了模板代码。构造函数、访问器/修改器方法，以及如\
  \ `toString()`、`equals()` 等方法在几乎每个类中都会用到。record 类是 Java 16 推新功能之一，它会自动创建所有此类方法。\n\
  \n\n\n\n以下代码片段展示了 record 类中静态字段、静态块和静态方法的声明与使用：\n\n```java\npublic record Record_static(String\
  \ name, int value) {\n    private static int COUNT;\n    static {\n        COUNT\
  \ = 0;\n    }\n    public static void displayCount() {\n        System.out.println(\"\
  counter:-\" + COUNT++);\n    }\n}\n```\n\n## 解析\n\n提到静态（static）时，它与我们的普通类非常相似。我们可以声明静态字段、用于初始化字段的静态块、用于初始化静态字段的静态块，以及属于该类的额外功能的静态函数。\n\
  \n![](img/67.jpg)\n\n## 问题\n\n我们如何在 record 类中进行实例化？\n\n## 解决方案\n\n让我们考虑一个具有单个整数类型头部的\
  \ record 类 `SimpleRecordClass.java`。以下代码片段展示了如何实例化它：\n\n```java\nclass TestSimpleRecordClass\
  \ {\n    public static void main(String[] args) {\n        SimpleRecordClass object=new\
  \ SimpleRecordClass(10);\n    }\n}\n```\n\n## 解析\n\nrecord 类的实例化过程与普通类非常相似。然而，我们需要记住一点。没有定义任何显式构造函数的普通类总是获得默认构造函数的定义。但是，record\
  \ 类将获得一个规范构造函数（canonical constructor），它会将所有私有字段赋值给对应的参数。这就是为什么第 3 语句使用参数化构造函数而不是默认构造的原因。\n\
  \n![](img/68.jpg)\n\n## 问题\n\n我们如何在 record 类中定义参数化构造函数？它们有哪些限制？\n\n## 解决方案\n\n我们将通过几个场景来讨论这个问题。\n\
  \n### 场景 1：定义显式的规范构造函数\n\n以下片段展示了如何使用构造函数来初始化 record 中声明的所有头部/字段：\n\n```java\nrecord\
  \ Demo_explicit_constructor(int empId, String empname,\n                       \
  \         long salary) {\n    public Demo_explicit_constructor(int empId, String\
  \ empname,\n                                long salary) {\n        this.empId =\
  \ empId;\n        this.empname = empname.toUpperCase();\n        this.salary = salary;\n\
  \    }\n}\n```\n\n## 解析\n\n我们都知道，在没有任何构造函数的普通类中，我们会自动获得一个默认构造函数。但在 record 类中，当没有声明显式构造函数时，它会自动获得一个规范构造函数，该构造会将所有私有字段赋值给实例化该\
  \ record 的新表达式的对应参数。\n\n根据 Java 16 的规定，当开发者显式声明规范构造函数时，其访问修饰符提供的权限至少要与 record 类的权限相同。因此，在这个示例中，我们使用\
  \ `public` 声明了一个显式的规范构造函数。我们也可以使用默认访问标识符代替 `public`。\n\n![](img/69.jpg)\n\n### 场景\
  \ 2：带有部分/无字段初始化的显式规范构造函数\n\n让我们添加以下构造函数定义代替之前的：\n\n```java\npublic Demo_explicit_constructor(int\
  \ empId, String empname,\nlong salary) {   } // 这会导致错误\n```\n\n## 解析\n\n显式的规范构造函数应该初始化类的所有字段。如果失败，我们将得到\
  \ `\"The blank final field value may not have been initialized\"` 错误。因此，前一个片段的代码将无法工作。\n\
  \n## 问题\n\n在 record 类中声明显式规范构造函数时，哪些访问修饰符是合法的？\n\n## 解决方案\n\n让我们通过不同的场景来讨论。我们将使用默认访问修饰符声明\
  \ record 类。让我们看看相同的规范构造函数有效的或合法的访问修饰符：\n\n```java\nrecord Demo_explicit_constructor1(int\
  \ empId, String empname,\n                             long salary) {\n    // 场景\
  \ 1\n    protected Demo_explicit_constructor1(int empId, String empname,\n     \
  \                           long salary) {\n        this.empId = empId;\n      \
  \  this.empname = empname;\n        this.salary = salary;\n    }\n}\n// 场景 2\nrecord\
  \ Demo_explicit_constructor2(int empId, String empname,\n                      \
  \       long salary) {\n    Demo_explicit_constructor2(int empId, String empname,\
  \ long salary) {\n        this.empId = empId;\n        this.empname = empname;\n\
  \        this.salary = salary;\n    }\n}\n// 场景 3\nrecord Demo_explicit_constructor3(int\
  \ empId, String empname,\n                             long salary) {\n    private\
  \ Demo_explicit_constructor3(int empId, String empname,\n                      \
  \          long salary) {\n        this.empId = empId;\n        this.empname = empname;\n\
  \        this.salary = salary;\n    }\n}\n```\n\n## 解析\n\n我们可以定义规范构造函数的访问规范与类相同，或者具有更高级权限的访问标识符。然而，使用受限制的访问标识符来定义规范构造函数是非法的。因此，场景\
  \ 3 的代码将报错。\n\n![](img/70.jpg)\n\n## 问题\n\n我们如何在 record 类中定义重载构造函数或非规范构造函数？\n\n\
  ## 解决方案\n\n你可以如下所示为 record 的规范构造函数提供重载构造函数：\n\n```java\nrecord Demo_explicit_constructor4(int\
  \ empId, String empname,\n                             long salary) {\n    public\
  \ Demo_explicit_constructor4(int empId) {\n        this(empId, \"empname\", 1234l);\n\
  \    }\n    protected Demo_explicit_constructor4(int empId,String empname) {\n \
  \       this(empId, empname, 1234l);\n    }\n    protected Demo_explicit_constructor4(String\
  \ empname) {\n        this(0, empname, 1234l);\n    }\n    protected Demo_explicit_constructor4(long\
  \ salary) {\n        this(0, \"empname\", salary);\n    }\n}\n```\n\n## 解析\n\n普通类通常会有多个重载构造函数以支持不同的实例化方式。同样，record\
  \ 类也可以有多个非规范构造函数。但我们不能忽略 record 类的字段是 `final` 的事实，因此不存在重新初始化它们的问题。因此，与其直接使用 `this`\
  \ 操作符进行初始化，我们需要在非规范构造函数中调用规范构造函数来执行初始化任务。这意味着我们可以如下代码所示编写非规范构造函数：\n\n```java\npublic\
  \ Demo_explicit_constructor4(int empId) {\n    this(empId, \"empname\", 1234l);\n\
  \    this.empId=empId;\n}\npublic Demo_explicit_constructor4(int empId) {\n    this.empId=empId;\n\
  }\n```\n\n![](img/71.jpg)\n\n## 问题\n\n如何利用紧凑构造函数（compact constructors）对 record 类的字段进行验证？\n\
