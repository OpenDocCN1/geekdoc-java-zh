  48.  }\n49.}\n```\n\n\n\n\n该方法用于将流元素转换为不可修改的列表。\n\n方法的语法如下：\n\n```java\npublic static\
  \ <T> Collector<T,?,List<T>> toUnmodifiableList()\n```\n\n方法参数：\n\n- `T`: 流中元素的类型。\n\
  \n该方法返回 `Collector`，它将流中的元素累加并一个不可修改的 `List` 中。\n\n![](img/24.jpg)\n\n在 `Listing\
  \ 2-11` 提供的解决方案中，第 47 行我们按如下方式调用了该方法：\n\n```java\nList<Employee> empList = getStream()\n\
  \      .collect(Collectors.toUnmodifiableList());\n```\n\n这创建了一个不可修改的列表 `empList`，它本质上是收集器所收集的所有元素的集合。由于这是一个不可修改的列表，如果你尝试向此列表添加元素，它将抛出异常。\n\
  \n### `Collectors.toUnModifiableSet()`\n\n该方法用于将流元素转换为不可修改的集合。\n\n方法的语法如下：\n\n```java\n\
  public static <T> Collector<T,?,Set<T>> toUnmodifiableSet()\n```\n\n方法参数：\n\n- `T`:\
  \ 流中元素的类型。\n\n该方法返回 `Collector`，它将流中的元素累加到一个不可修改的 `Set` 中。该集合是无序的。\n\n![](img/25.jpg)\n\
  \n尝试取消 `Listing 2-11` 中第 42 行的 `empSet.add(new Employee(13,\"Smith\"))` 并再次运行程序。你将观察到异常\
  \ `java.lang.UnSupportedOperationException`。\n\n### `Collectors.toUnmodifiableMap()`\n\
  \n该方法用于将流元素收集到 `Map` 中。该方法有 2 形式。\n\n### 形式 1：\n\n这是该方法的简单形式，它提供了 2 个映射函数来定义相应生成的\
  \ map 的键和值。\n\n方法的语法如下：\n\n```java\npublic static <T,K,U> Collector<T,?,Map<K,U>>\
  \ toUnmodifiableMap(\n    Function<? super T,? extends keyFunction> key,\n    Function<?\
  \ super T,? extends U> valueFnction\n)\n```\n\n该方法返回 `Collector`，它将输入元素累加到不可修改的\
  \ map 中。键和值通过应用于输入元素的映射函数来应用。\n\n方法参数为：\n\n- `keyFunction`: 生成键的映射函数。\n- `valueFunction`:\
  \ 生成值的映射函数。\n\n类型参数为：：\n\n- `T`: 输入元素的类型\n- `K`: 由 `keyFunction` 生成的键的类型\n- `U`:\
  \ 由 `valueFunction` 生成的值的类型\n\n![](img/26.jpg)\n\n在 `Listing 2-11` 提供的解决方案中，第 24\
  \ 行我们按如下方式调用了该方法：\n\n```java\nMap<Object, Object> empMap=Stream.of(e1,e2)\n    \
  \  .collect(Collectors.toUnmodifiableMap(e)->e.getEmpId(),e->e));\n```\n\n这从由收集器收集的流元素创建了一个不可修改的\
  \ map。但 map 包含键值对，而流只包含没有键的元素。因此，为了生成键和值的组合，我们必须提供代表 `Function` 接口的 lambda 表达式。第一个\
  \ lambda 接收元素 `e` 作为参数，并通过调用 `e.getEmpId()` 生成键，因此每个员工的键将是 `empId`。值由第二个 lambda\
  \ 表达式生成，它接收员工对象 `e` 作为参数，即实际的 `Employee` 对象。\n\n### 形式 2：\n\n在此形式的方法中，提供了另一个函数作为参数，并称为合并函数。该函数用于合并给定收集器中可能存在的重复键的结果。\n\
  \n方法的语法如下：\n\n```java\npublic static <T,K,U> Collector<T,?,Map<K,U>> toUnmodifiableMap(\n\
  \    Function<? super T,? extends K> keyFunction,\n    Function<? super T,? extends\
  \ U> valueFunction,\n    BinaryOperator<U> mergeFunction\n)\n```\n\n该方法返回 `Collector`，它将输入元素累加到不可修改的\
  \ map 中。键和值通过应用于输入元素的映射函数来应用。\n\n方法参数为：\n\n- `keyFunction`: 生成键的映射函数。\n- `valueFunction`:\
  \ 生成值的映射函数。\n- `mergeFunction`: 针对重复键的值的合并函数。\n\n类型参数为：\n\n- `T`: 输入元素的类型\n- `K`:\
  \ 由 `keyFunction` 生成的键的类型\n- `U`: 由 `valueFunction` 和 `mergeFunction` 生成的值的类型\n\n\
  ![](img/26.jpg)\n\n在 `Listing 2-11` 提供的解决方案中，第 24 行我们按如下方式调用了该方法：\n\n```java\nMap<Object,\
  \ Object> empMap=Stream.of(e1,e2)\n      .collect(Collectors.toUnmodifiableMap(e)->e.getEmpId(),e->e));\n\
  ```\n\n这从由收集器收集的流元素创建了一个不可修改的 map。但 map 包含键值对，而流只包含没有键的元素。因此，为了生成键和值的组合，我们必须提供代表\
  \ `Function` 接口的 lambda 表达式。第一个 lambda 接收元素 `e` 作为参数，并通过调用 `e.getEmpId()` 生成键，因此每个员工的键将是\
  \ `empId`。值由第二个 lambda 表达式生成，它接收员工对象 `e` 作为参数，即实际的 `Employee` 对象。\n\n\n\n方法的语法如下：\n\
  \n`public T` `orElseThrow()`\n\n该方法在值存在时返回该值，否则它会抛出 `NoSuchElementException`。\n\n\
  类型参数：\n\n`T`: 值或对象的类型。\n\n在我们的解决方案 `Listing 2-12` 中，第 23 行我们使用了以下代码：\n\n```\ntry\
  \ {\n  System.out.println(findEmpById.orElseThrow());\n}catch(NoSuchElementException\
  \ elementException) {\n  System.out.println(\"Employee with Id:\"+id+\" not found!!\"\
  );\n}\n```\n\n`findEmpById` 的类型为 `Optional`，它由 `Employees` 流上的终端函数 `findFirst()`\
  \ 生成。因此，`orElseThrow()` 方法将打印由 `findFirst()` 找到的值或对象，否则抛出 `NoSuchElementException`，该异常会在\
  \ `try..catch` 块中被处理。\n\n![](img/29.jpg)\n\n## 应用程序类数据共享\n\n应用程序类数据共享是 Java 10 中引入的一个新概念。通过这一概念，所需的系统类和应用程序类可以通过开发者创建自定义转储文件（dump\
