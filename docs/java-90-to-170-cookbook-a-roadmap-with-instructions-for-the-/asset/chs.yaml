  \ Map (un-modifiable Map)**\n\n## 解析\n\nJava 的 Collection API 是 Java 提供的最有趣的 API\
  \ 之一。从 Java 的早期版本开始，`Collections` 就是 Java API 中不可或缺的一部分。多年来，许多功能得到了改进。\n\n在 Java\
  \ 中，`Map` 的工作方式略有不同。由于 `Map` 包含键值对，它将由两个参数形成一个元素。因此，你可以创建一个包含一个元素的 `Map`；它需要两个参数。第一个参数是键，第二个参数是元素。这段代码在\
  \ `Listing 1-11` 中所示：\n\n（此处代码块已按注意事项要求不翻译）\n\n（注：由于提供的原文中“Explanation”部分似乎存在逻辑重复或文本错乱，译文已根据原文结构进行了对应翻译，确保了格式的完整性。）\n\
  \n\n\n\n`Arrays` 是 Java 提供的一个工具类。它提供了许多方法来对数组执行某些操作，例如将它们转换为列表、排序等。Java 9 提供了一些额外的方法，如重载的\
  \ `equals()` 方法和 `compareTo()` 方法等。\n\n## 问题\n我们想要使用 Java 9 中引入的更灵活的 Arrays API\
  \ 来检查数组的相等性。\n\n## 解决方案\n我们可以使用 `Arrays` 的不同静态方法，如 `equals()`、`compare()` 和 `mismatch()`。创建一个如\
  \ `Listing 1-12` 所示的新类 `ArraysDemo.java`：\n\n```java\n//Listing 1-12\npublic class\
  \ ArraysDemo {\n    public static void main(String[] args) {\n        int[] data1\
  \ = {10,20,30,40,50};\n        int[] data2 = {10,20,30,40,50};\n        int[] data3\
  \ = {8,20,30,40};\n        checkArray(data1,data2,data3);\n    }\n    public static\
  \ void checkArray(int[] data1, int[] data2, int[] data3) {\n        // equals()\
  \ \n        System.out.println(\"\\nArrays.equals(data1, 0, 3, data3, 3): \" + Arrays.equals(data1,\
  \ 0, 3, data3, 3));\n        System.out.println(\"Arrays.equals(data1, 0, 3, data2,\
  \ 3): \" + Arrays.equals(data1, 0, 3, data2, 3));\n        // compare() \n     \
  \   System.out.println(\"data1 and data2 comparison := \" + Arrays.compare(data1,\
  \ data2));\n        System.out.println(\"data1 and data3 comparison := \" + Arrays.compare(data1,\
  \ data3));\n        // mismatch() \n        System.out.println(\"data1 and data2\
  \ comparison by mismatch:= \" + Arrays.mismatch(data1, data2));\n        System.out.println(\"\
  data1 and data3 comparison by mismatch:= \" + Arrays.mismatch(data1, data3));\n\
  \    }\n}\n```\n\n## 输出\n执行 `ArrayDemo.java`，我们将得到如[图 1.8]所示的输出：\n\n![](img/Figure-1.8)\n\
  \n**图 1.8:** 数组中的更新\n\n## 解析\n检查数组元素的相等性是应用程序的主要需求之一。可以通过检查单个数组元素或使用预定义的 `equals(array1,\
  \ array2)` 方法来检查相等性。该方法的局限性是无法检查数组的部分元素（切片）。\n\nJava 9 提供了 `equals()` 方法的特殊重载形式，它是\
  \ `Arrays` 类的一个静态方法。该方法便于检查数组切片。\n\n方法的语法如下：\n`public static boolean equals(int[]\
  \ a, int index1, int index2, int[] b, int index3, int index4)`\n\n该方法返回：\n*   如果数组\
  \ `a` 从 `index1` 到 `index2` 的切片等于数组 `b` 从 `index3` 到 `index4` 的切片，则返回 `True`。\n\
  *   当且仅当满足以下条件时，数组被认为相等：\n    *   两个数组切片的元素数量相等。\n    *   每个元素及其顺序相同。\n\n该方法还包含接收不同类型数组（如\
  \ `double`、`boolean`、`float` 等）的重载形式。在 `Listing 1-12` 给出的解决方案中，对数组调用了 `equals` 方法。对于\
  \ `data1` 和 `data2`，由于两个数组切片相同，`equals` 方法返回 true。但对于 `data1` 和 `data3`，切片不同，因此\
  \ `equals()` 方法返回 false。\n\n另一种比较数组元素的方法是 `compare()` 方法。该方法每个元素的字典序比较。方法的语法如下：\n\
  `public static int compare(int[] a, int[] b)`\n\n如果两个数组长度相同，则通过检查单个元素执行字典序比较。如果两个数组长度不同，则通过比较长度生成结果。该方法返回：\n\
  *   如果两个数组长度相等且按顺序包含相同元素，则返回 0。\n*   如果第一个数组的字典序小于第二个数组，返回 `<0`。\n*   如果第一个数组的字典序大于第二个数组，返回\
  \ `>0`。\n\n![](img/7.jpg)\n\n在我们的解决方案中，`compare(data1, data2)` 返回 0。但 `compare(data1,\
  \ data3)` 返回 1，因为 `data1` 大于 `data3`。\n\n我们在解决方案中使用的第三种方法是 `mismatch()`。方法的语法如下：\n\
  `public static int mismatch(int[] a, int[] b)`\n\n该方法以 `equals()` 和 `compare()`\
  \ 相反的方法工作。正如名称所示，它寻找数组中不匹配的元素。该方法返回：\n*   如果没有不匹配，返回 -1。\n*   两个数组之间第一个不匹配的索引，这表示元素相同到该长度。\n\
  *   如果两个数组长度不等，返回较短数组的长度。\n*   如果任一数组为 null，则抛出 `NullPointerException`。\n\nAPI 还提供了\
  \ `mismatch()` 的另一种重载形式，用于检查数组切片的不匹配。语法为：\n`public static int mismatch(int[] a,\
  \ int index1, int index2, int[] b, int index3, int index4)`\n\n它的工作原理与之前的方法类似，但以索引的形式提供了额外的参数。参数\
  \ `index1` 和 `index2` 声明第一个数组的起始和结束元素编号（不包含结束索引编号），而 `index3` 和 `index4` 代表第二个数组的相同含义。它不是检查整个数组，而是检查由这些索引构建的数组切片。返回类型与之前的方法完全相同。在\
  \ `Listing 1-12` 解决方案中，`mismatch(data1, data2)` 返回 -1，因为两个数组之间没有不匹配。但 `mismatch(data1,\
  \ data3)` 返回 0，这是两个数组中第一个不匹配元素的索引。\n\n\n\n\n```java\npublic void setTransactionAmount(double\
  \ transactionAmount) {\n    this.transactionAmount = transactionAmount;\n}\n```\n\
  \n2. 我们还需要用于比较事务的业务逻辑。这种比较在 `TransactionComparator.java` 中显示，如 `Listing 1-14`所示：\n\
  \n```java\n//Listing 1-14\npublic class TransactionComparator implements Comparator<Transaction>\
  \ {\n    @Override\n    public int compare(Transaction o1, Transaction o2) {\n \
  \       // TODO Auto-generated method stub\n        return o1.getTransactionId().compareTo(o2.getTransactionId());\n\
  \    }\n}\n```\n\n3. 最后，我们需要应用程序类来创建数组并使用 `mismatch` 检查相等性。这通过 `TransactionProcess.java`\
  \ 实现，如 `Listing 1-15` 所示：\n\n```java\n//Listing 1-15\npackage com.java9.arrays;\n\
  \npublic class TransactionProcess {\n    public static void main(String[] args)\
  \ {\n        Transaction transaction١ = new Transaction(\"txn١\", 10000);\n    \
  \    Transaction transaction٢ = new Transaction(\"txn٢\", 20000);\n        Transaction\
  \ transaction٣ = new Transaction(\"txn٣\", 30000);\n        Transaction transaction٤\
  \ = new Transaction(\"txn٤\", 40000);\n        Transaction transaction٥ = new Transaction(\"\
  txn١\", 10000);\n        Transaction transaction٦ = new Transaction(\"txn٢\", 20000);\n\
  \        Transaction transaction٧ = new Transaction(\"txn٥\", 30000);\n        Transaction\
  \ transaction٨ = new Transaction(\"txn٤\", 40000);\n        checkTransaction(new\
  \ Transaction[] {transaction1, transaction2, transaction3, transaction4}, new Transaction[]\
  \ {transaction5, transaction6, transaction7, transaction8});\n    }\n    private\
  \ static void checkTransaction(Transaction[] transactions1, Transaction[] transactions2)\
  \ {\n        // TODO Auto-generated method stub\n        int x = Arrays.mismatch(transactions1,\
  \ transactions2, new TransactionComparator());\n        if (x == -1) {\n       \
  \     System.out.println(\"Arrays are matched\");\n        }\n        System.out.println(\"\
  First \" + x + \" elements are matched\");\n    }\n}\n```\n\n## 输出\n\n如果我们执行 `TransactionProcess.java`，将显示*图\
  \ 1.9* 所示的内容。\n\n图 1.9：数组更新 – 使用 `mismatch()`\n\n## 解释\n\n为了解决这个问题，我们使用了 `mismatch()`\
  \ 方法的重载形式。如我们所知，对象比较是通过 `Comparable` 或 `Comparator` 接口实现的。默认的 `mismatch()` 方法接收另一个类型为\
  \ `Comparator` 参数，它提供了数组中对象比较的业务逻辑。\n\n方法的语法如下：\n`public static <T> int mismatch(T[]\
  \ a, T[] b, Comparator<? super T> cmp)`\n\n该方法返回：\n- -1，如果没有不匹配。\n- 两个数组之间元素相同的第一个不匹配处的索引。\n\
  - 如果两个数组长度不等，则返回较短数组的长度。\n- 如果任一个数组为 null，则抛出 `NullPointerException`。\n\n## 改进的\
  \ Optional\n\n`Optional<T>` 类已经被用于绕过 `NullPointerException` 几年。但它仍然缺乏开发者预期的一些功能。Java\
  \ 9 提供了三个额外的方法来改进该类的工作。以下是为该接口引入的不同方法：\n- `ifPresentOrElse()`\n- `or()`\n- `stream()`\n\
  \n## 问题\n\n尽管我们经常处理 Java 8 中的 `Optional<T>` 类，但它没有提供在未找到对象时如何继续的功能。虽然没有了 `NullPointerException`，但除了使用\
  \ `if...else` 等控制结构在未检索到对象时执行某些操作外，没有其他方法。Java 9 是否为此提供了任何 API？\n\n## 解决方案\n\n当然！Java\
  \ 9 提供了 `ifPresentOrElse()`、`or()` 和 `stream()` 等方法，为类提供了额外的功能。按照以下步骤操作：\n\n1. 创建\
  \ `Employee.java` 来创建 POJO，如 `Listing 1-16` 所示：\n\n```java\n//Listing 1-16\npackage\
  \ com.java9.optional;\n\npublic class Employee {\n    private String name;\n   \
  \ private Integer age;\n    private Double salary;\n}\n```\n\n2. 在 `Optional` 接口演示中使用此\
  \ `Employee` 类，如 `Listing 1-17` 所示：\n\n```java\n//Listing 1-17\nimport java.util.Arrays;\n\
  import java.util.List;\nimport java.util.Optional;\nimport java.util.function.Supplier;\n\
  import java.util.stream.Collectors;\n\npublic class Java9OptionalFeatures {\n  \
  \  static List<Employee> employeeList = Arrays.asList(\n        new Employee(\"\
  Bob Wiliams\", 45, 15000.00),\n        new Employee(\"Johny Hiscus\", 45, 7000.00),\n\
  \        new Employee(\"Alan Marsh\", 65, 8000.00),\n        new Employee(\"Jack\
  \ Tavolta\", 22, 10000.00),\n        new Employee(\"Brayan\", 29, 9000.00)\n   \
  \ );\n    public static void main(String[] args) {\n        Optional<Employee> maxSalary\
  \ = employeeList.stream()\n            .filter(e -> e.getSalary() > 20000)\n   \
  \         .findFirst();\n        /* Java 8 条件查找对象的方法\n        if (maxSalary.isPresent())\
  \ {\n            System.out.println(maxSalary.toString());\n            System.out.println(\"\
  Condition is matched\");\n        } */\n        // 在 Optional 中使用 ifPresentOrElse\n\
  \        System.out.print(\"Using ifPresentOrElse() 检查对象的可用性: \");\n        maxSalary.ifPresentOrElse(\n\
  \            e -> System.out.println(e.toString()),\n            () -> System.out.println(\"\
  Employee found\")\n        );\n        // 创建提供默认对象的 Supplier\n        Supplier<Optional<Employee>>\
  \ supplierEmployee = () -> Optional.of(new Employee(\"Tom Jones\", 45, 7000.00));\n\
  \        // 在 Optional 中使用 or()\n        System.out.println(\"未找到对象时提供默认对象\");\n\
  \        maxSalary = maxSalary.or(supplierEmployee);\n        Employee e = maxSalary.get();\n\
  \        System.out.println(e);\n        // 创建包含空和空对象的列表\n        List<Optional<Employee>>\
  \ list = Arrays.asList(\n            Optional.empty(),\n            Optional.of(new\
  \ Employee(\"Mark Root\", 25, 7000.00)),\n            Optional.of(new Employee(\"\
  Daniel Martin\", 35, 17000.00))\n        );\n        /* Java 8 使用 isPresent() 创建非空对象列表\n\
  \        List<Employee> filteredListJava8 = list.stream()\n            .flatMap(o\
  \ -> o.isPresent() ? Stream.of(o.get()) : Stream.empty())\n            .collect(Collectors.toList());\n\
  */\n        // Java 9 使用 Optional::stream 创建非空对象列表。\n        List<Employee> filteredListJava9\
  \ = list.stream()\n    }\n}\n```\n\n\n\n\n\n```java\n62.             .flatMap(Optional::stream)\n\
  63.             .collect(Collectors.toList());\n65.       System.out.print(\"List\
  \ of non-null Employees --->\");\n66.       System.out.println(filteredListJava9);\n\
  67.   }\n68. }\n```\n\n## 输出\n\n如果我们执行 `Java9OptionalFeatures.java`，我们将得到如图 1.10\
  \ 所示的输出：\n\n![](img/Figure-1.10.jpg)\n\n**图 1.10:** Optional 接口\n\n## 解析\n\n上述解决方案使用了\
  \ Java 9 中引入的 `ifPresentOrElse()`、`or()` 和 `stream()` 方法。`Optional` 类控制了在未返回对象时可能抛出的\
  \ `NullPointerException`。因此，要从 `Optional` 中检索对象，我们需要调用如`代码列表 1-17` 第 24 行所示的 `ifPresent()`\
  \ 方法。\n\n这种条件 `if … else` 块总是一个额外的负担，我们可以通过使用 `ifPresentOrElse()` 方法来避免它。\n\n该方法的语法如下：\n\
  \n```java\npublic void ifPresentOrElse(Consumer<? super T> action1,\n    Runnable\
  \ action2)\n```\n\n它在内部的工作原理类似于 `if … else` 块。如果对象或值存在，它会执行 `action1`（它与 `Consumer`\
  \ 连接）。如果对象或值不存在，它会执行类型为 `Runnable` 的 `action2`。\n\n如果值存在，它会对该值执行给定的操作，否则它将执行给定的基于空的操作。\n\
  \n在第 32 行，我们使用了：\n\n```java\nmaxSalaryEmp.ifPresentOrElse((e)->System.out.println(e.toString()),\
  \ ()->System.out.println(\" Employee not found\"));\n```\n\n在这种情况下，我们正尝试寻找一个工资大于\
  \ 20000 的 `Employee`。由于不匹配该条件，`Optional` 返回了 null。但由于我们使用了 `ifPresentOrElse()`，程序将生成输出\
  \ \"Employee not found\"。\n\n`Optional` 中引入的另一个方法是 `or()`，它用于在 `Optional` 不包含任何对象时提供一个默认对象。\n\
  \n该方法的语法如下：\n\n```java\npublic Optional<T> or(Supplier<? extends Optional<? extends\
  \ T>> supplier)\n```\n\n它接受一个 `Supplier`，该提供者提供一个 `Optional` 类型的对象。\n\n该方法返回：\n\n\
  *   一个 `Optional`，如果值存在，则描述该值。\n*   或者，通过提供函数创建的 `Optional`。\n\n如果值存在，它返回一个描述该值的\
  \ `Optional`，否则它返回一个由提供函数产生的 `Optional`。\n\n在我们第 37 行的解决方案中，我们首先按照如下创建了 `Supplier`：\n\
  \n```java\nSupplier<Optional<Employee>> supplierEmployee = () -> Optional.of(new\
  \ Employee(\"Tom Jones\", 45, 7000.00));\n```\n\n我们应该记住，`Supplier` 的类型应当是 `Optional<T>`。这里，T\
  \ 是将由 `Optional` 产生的类型。\n\n随后在第 43 行，我们将此提供者作为参数传递给 `or()` 方法：\n\n```java\nmaxSalaryEmp=maxSalaryEmp.or(supplierEmployee);\n\
  ```\n\n在这里，由于寻找 `Employee` 的条件不匹配，`Optional<Employee>` 返回了 null。因此，我们可以通过在生成的 `Optional`\
  \ 上调用 `or()` 来控制这一点。在 `Optional` 没有关联任何对象的情景下，它起到了默认对象的作用。\n\n`Optional` 中的第三种方法是\
  \ `stream()` 方法。如名所示，它从 `Optional` 生成流（stream），我们可以对之进行迭代。\n\n该方法的语法如下：\n\n```java\n\
  public Stream<T> stream()\n```\n\n该方法返回：\n\n*   如果值存在，则返回包含值的顺序流（Sequential Stream）。\n\
  *   或者，空流（empty Streams）。\n\n该方法具有特殊行为，因为它会忽略空的 `Optional` 元素，仅对可用值生成列表。在我们的解决方案中，我们如下创建了\
  \ `Optional<Employee>` 列表：\n\n```java\nList<Optional<Employee>> list = Arrays.asList(\n\
  \    Optional.empty(),\n    Optional.of(new Employee(\"Mark Root\", 25, 7000.00)),\n\
  \    Optional.of(new Employee(\"Daniel Martin\", 25, 7000.00))\n);\n```\n\n\n\n\n\
  \n## ObjectInputFilter 接口\n\n序列化是开发者在需要在网络中共享对象时可能需要执行的任务之一。但在此过程中，始终存在对象受到某些外部入侵者攻击的威胁。Java\
  \ 9 引入了 `ObjectInputFilter` 接口，以便在对象反序列化并用于应用程序之前对其进行过滤。\n\n## 问题\n\n反序列化便于从本地系统/网络中检索序列化对象。但有时，检索的对象可能存在某些漏洞或是不安全的。我如何确保所检索的反序列化对象是安全且无漏洞的？\n\
  \n## 解决方案\n\n可以通过使用 Java 9 中引入的 `ObjectInputFilter` 接口对反序列化对象进行过滤来实现这一点。以下是在反序列化之前过滤序列化对象的步骤：\n\
  \n1. 创建 `Employee.java`，如 `Listing 1-18`所示的 POJO 类。\n2. 使用 `Serializable` 接口对 `Employee`\
  \ 对象进行序列化。该过程如 `Listing 1-19, SerializeEmployee.java` 所示。\n3. 创建 `FilterEmployee.java`，如\
  \ `Listing 1-20` 所示。该类实现了 `ObjectInputFilter` 并重写了 `checkInput()` 方法，如下：\n\n```java\n\
  //Listing 1-20\npackage com.java9.serialization;\nimport java.io.ObjectInputFilter;\n\
  class FilterEmployee implements ObjectInputFilter{\n    public Status checkInput(FilterInfo\
  \ filterInfo) {\n        //获取正在序列化的对象的类类型\n        Class<?> serialClass = filterInfo.serialClass();\n\
  \        if (serialClass != null) {\n            return (Employee.class.isAssignableFrom(serialClass))\
  \ ?\n                Status.ALLOWED : Status.REJECTED;\n        }\n        else\
  \ {\n            System.out.println(\"NULL\");\n            return Status.UNDECIDED;\n\
  \        }\n    }\n}\n```\n\n4. 创建如 `Listing 1-21` 所示的 `FilterEmployeeByPackage.java`。它提供了一个根据业务逻辑返回\
  \ `ObjectInputFilter.Status` 的方法。在以下代码中，我们正在检查序列化对象是否来自特定的包：\n\n```java\n//Listing\
  \ 1-21\npackage com.java9.serialization;\nimport java.io.ObjectInputFilter;\npublic\
  \ class FilterEmployeeByPackage {\n    static ObjectInputFilter.Status empFilter(ObjectInputFilter.FilterInfo\
  \ filterInfo) {\n        //获取正在序列化的对象的类类型\n        Class<?> serialClass = filterInfo.serialClass();\n\
  \        if (serialClass != null) {\n            //检查反序列化对象是否属于特定 //包\n        \
  \    return serialClass.getPackageName().equals(\"java.util\")\n            ? ObjectInputFilter.Status.ALLOWED\n\
  \            : ObjectInputFilter.Status.REJECTED;\n        }\n        return ObjectInputFilter.Status.UNDECIDED;\n\
  \    }\n}\n```\n\n5. 最后创建应用程序类 `FilteringDeserialization.java`，如 `Listing 1-22`\
  \ 所示：\n\n```java\n//Listing 1-22\npackage com.java9.serialization;\nimport java.io.FileInputStream;\n\
  import java.io.IOException;\nimport java.io.ObjectInputStream;\npublic class FilteringDeserialization\
  \ {\n    public static void main(String[] args) throws IOException {\n        filteringByClass();\n\
  \        filteringByMethod();\n    }\n    // 通过调用过滤器类来过滤反序列化\n    private static\
  \ void filteringByClass() throws IOException {\n        // TODO Auto-generated method\
  \ stub\n        FileInputStream fis = new FileInputStream(\"data.ser\");\n     \
  \   try (ObjectInputStream ois = new ObjectInputStream(fis)) {\n            ois.setInputFilter(new\
  \ FilterEmployee());\n            Employee emp = (Employee) ois.readObject();\n\
  \        } catch (ClassNotFoundException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n    private static void filteringByMethod() throws IOException\
  \ {\n        // TODO Auto-generated method stub\n        FileInputStream fis = new\
  \ FileInputStream(\"data.ser\");\n        try (ObjectInputStream ois = new ObjectInputStream(fis))\
  \ {\n            ois.setInputFilter(FilterEmployeeByPackage::empFilter);\n     \
  \       Employee emp = (Employee) ois.readObject();\n        } catch (ClassNotFoundException\
  \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n\n\n\nFlow\
  \ API 是 Java 9 发布的一个全新的 API。这是 Java 实现响应式编程的方式。Java 9 引入了不同的类，如 `Subscriber`、`Publisher`、`Submission`、`SubmissionPublisher`\
  \ 等，以实现这种发布-订阅模型。\n\n## 问题\n\n如何使用 Java9 中引入的 Flow API？\n\n## 解决方案\n\n为了理解这一点，我们将解决一个现实问题。有一家图书机构负责出版书籍。该公司有自己的成员，我们可以称之为订阅者（subscribers）。但订阅者并不知道新书何时出版。这种局限性可以通过以下步骤借助\
  \ Flow API 来解决：\n\n1. 创建一个 Java Bean 来存储 `bookId` 和 `bookName` 等书籍详情，如 `Listing\
  \ 1-23 Book.java:` 所示：\n\n```java\n//Listing 1-23\npublic class Book {\n   private\
  \ int bookId;\n  private String bookName;\n   public int getBookId() {\n    return\
  \ bookId;\n   }\n   public void setBookId(int bookId) {\n      this.bookId = bookId;\n\
  \   }\n   public String getBookName() {\n    return bookName;\n   }\n   public void\
  \ setBookName(String bookName) {\n      this.bookName = bookName;\n   }\n   public\
  \ Book(int bookId, String bookName) {\n    super();\n    this.bookId = bookId;\n\
  \    this.bookName = bookName;\n   }\n   @Override\n   public String toString()\
  \ {\n    return \"Book [bookId=\" + bookId + \", bookName=\" + bookName + \"]\"\
  ;\n   }\n}\n```\n\n2. 创建一个 `Subscriber`，它会在书籍被发布 发布时获取。这实现在 `Listing 1-24` 的 `BookSubsriber.java`\
  \ 中：\n\n```java\n//Listing 1-24\nimport java.util.concurrent.Flow;\nimport java.util.concurrent.Flow.Subscription;\n\
  \npublic class BookSubscriber implements Flow.Subscriber<Book>{\n   private String\
  \ subscriberName;\n  private Flow.Subscription subscription;\n\n   public BookSubscriber(String\
  \ subscriberName) {\n      this.subscriberName=subscriberName;\n   }\n\n   @Override\n\
  \  public void onSubscribe(Subscription subscription) {\n     // TODO Auto-generated\
  \ method stub\n      this.subscription=subscription;\n      subscription.request(1);\n\
  \   }\n\n   @Override\n  public void onNext(Book book) {\n     // TODO Auto-generated\
  \ method stub\n      subscription.request(1);\n      System.out.println(book+\"\
  ,Received by:\"+this.subscriberName);\n   }\n\n   @Override\n  public void onError(Throwable\
  \ throwable) {\n     // TODO Auto-generated method stub\n      System.out.println(throwable.getMessage());\n\
  \   }\n\n   @Override\n  public void onComplete() {\n     // TODO Auto-generated\
  \ method stub\n      System.out.println(subscriberName +\" got all the books\");\n\
  \   }\n}\n```\n\n3. 创建一个 `BookPublisher.java` 来订阅书籍订阅者，如 `Listing 1-25` 所示：\n\n\
  ```java\n//Listing 1-25\nimport java.util.Arrays;\nimport java.util.List;\nimport\
  \ java.util.concurrent.SubmissionPublisher;\nimport java.util.concurrent.TimeUnit;\n\
  \npublic class BookPublisher {\n  public void main(String[] args) {\n    List<Book>\
  \ bookList = Arrays.asList(\n      new Book(101, \"Java 93\"),\n      new Book(102,\
  \ \"Java 11\")\n    );\n    SubmissionPublisher<Book> bookPublisher =\n      new\
  \ SubmissionPublisher<Book>();\n    BookSubscriber subscriber = new BookSubscriber(\"\
  Dave\");\n    BookSubscriber subscriber2 = new BookSubscriber(\"Richardson\");\n\
  \    bookPublisher.subscribe(subscriber);\n    bookPublisher.subscribe(subscriber2);\n\
  \    // submit method:\n    System.out.println(\"Using submit() method :\");\n \
  \   bookList.stream().forEach(i -> {\n      bookPublisher.submit(i);\n      try\
  \ {\n        sleep(3000);\n      } catch (InterruptedException e) {\n        //\
  \ TODO Auto-generated catch block\n        e.printStackTrace();\n      }\n    });\n\
  \    // offer() method : simple form\n    System.out.println(\"Using offer() :\"\
  );\n    bookList.stream().forEach(book -> {\n      bookPublisher.offer(book, null);\n\
  \      try {\n        sleep(3000);\n      } catch (InterruptedException e) {\n \
  \       // TODO Auto-generated catch block\n        e.printStackTrace();\n     \
  \ }\n    });\n    // offer() method : timeout implementation\n    System.out.println(\"\
  Using offer() with timeout :\");\n    bookList.stream().forEach((book) -> {\n  \
  \    System.out.println(book + \" being offered\");\n      final int result =\n\
  \        bookPublisher.offer(book, 2, TimeUnit.SECONDS,\n          (subscriber,\
  \ value) -> {\n            try {\n              sleep(3000);\n            } catch\
  \ (InterruptedException e) {\n              // TODO Auto-generated catch block\n\
  \              e.printStackTrace();\n            }\n            return true;\n \
  \         });\n      if (result < 2)\n        System.out.println(\"Dropping \" +\
  \ result + \" book.\");\n    });\n  }\n}\n```\n\n## 输出\n\n如果我们执行 `BookPublisher.java`，我们将得到如\
  \ 图 14 所示的输出：\n\n![](img/Figure-14.jpg)\n\n图 14：实现 Flow API\n\n## 解释\n\nJava 9 提供了一个名为\
  \ Flow 的新 API，它是 Java 对响应流规范的实现。该 API 内部依赖于迭代器观察者模式。迭代器通常从源获取项并将其推送到订阅者。这种推送会被观察者观察。\n\
  \n这种实现是通过 Flow API 完成的。该 API 的顶层类是 `java.util.concurrent.Flow` 类。该类提供了静态接口的组合，提供了发布-订阅行为的基本功能。\n\
  \n以下是类中声明的不同接口：\n\n`public static interface Flow.Subscriber<T>`\n\n此接口便于订阅发布者进行回调。这种数据的推送只有在请求后才是可能的。订阅者需要请求，以获取从发布者处推送的数据。此类调用总是有顺序的。\n\
  \n接口声明了以下方法：\n\n*   onSubscribe(Subscription subscription)\n\n    在对给定的订阅调用任何其他方法之前，会调用此方法。该方法可能会抛出异常。如果发生这种情况，结果是不确定的。但订阅可能会被取消。\n\
  \n    在我们的解决方案中，我们在 `BookSubscriber` 类第 14 行实现了此方法。`BookSubscriber` 实现了 `Subscriber`，因此它实现了\
  \ `Subscriber` 的方法。观察以下代码片段，`BookSubscriber.java` 实现了 `onSubscribe()`：\n\n```java\n\
  @Override\npublic void onSubscribe(Subscription subscription) {\n  // TODO Auto-generated\
  \ method stub\n  this.subscription=subscription;\n  subscription.request(1);\n}\n\
  ```\n\n\n\n\n\n在该方法中，当 `BookSubscriber` 被 `Publisher` 订阅时，它会初始化 `Subscription` 对象。此外，会调用\
  \ `request()` 方法来获取由 `Publisher` 发布的项。\n\n### onNext(T item)\n\n该方法在处理 `Subscription`\
  \ 的下一个项时被调用。你需要使用 `request()` 方法来请求由 `Publisher` 推送的项。\n\n在我们的解决方案中，我们已经在 `BookSubscriber.java`\
  \ 中实现了该方法，如下所示：\n\n```java\n@Override\npublic void onNext(Book book) {\n  // TODO\
  \ Auto-generated method stub\n  subscription.request(1);\n  System.out.println(book\
  \ +\", Received by : \"+this.subscriberName);\n}\n```\n\n该方法从 `Publisher` 获取 Book\
  \ 项。同样，这里的 `request()` 方法被用于请求下一个项。`request()` 中提供的整数必须大于 0。\n\n### onError(Throwable\
  \ throwable)\n\n如果 `Publisher` 或 `Subscriber` 发生任何错误，该方法会被隐式调用。在调用此方法后，整个订阅将取消，不再进行后续处理。\n\
  \n在我们的代码中，目前还没有这项功能。但如果我们调用：\n\n```java\nsubscription.request(0);\n```\n\n在 `onNext()`\
  \ 方法中，它将抛出 `IllegalArgumentException`。这会在内部调用 `onError()` 方法。\n\n### onComplete()\n\
  \n当所有数据都由 `Publisher` 推送并由 `Subscriber` 在无错误的情况下处理完毕后，将调用此方法。这是 `Publisher-Subscriber`\
  \ 架构的自然结束。\n\n### public static interface Publisher<T>\n\n这是一个函数接口，用于生成项，这些项可以被\
  \ `Subscriber` 利用或订阅。`Publisher` 产生的项由 `Subscriber` 通过调用 `onNext()` 方法来利用。如果在产生项或消息时\
  \ Publisher 抛出任何异常，`Subscriber` 将接收 `onError()`，然后进程终止。\n\n该接口提供的唯一方法如下：\n\n*  \
  \ subscribe(Subscriber<? super T> subscriber)\n    此方法为 `Publisher` 添加 Subscriber。由于违反策略，你不能再次订阅同一个\
  \ Subscriber。\n\n### public static interface Subscription\n\n此接口提供了在 `Publisher`\
  \ 和 `Subscriber` 之间建立连接的服务。它仅提供了 `Subscriber` 可以请求项并断开与 `Publisher` 连接的方法。\n\n它声明了以下方法：\n\
  \n*   request(long n)\n    此方法从 `Publisher` 将指定数量的项添加到 `Subscriber` 中消费。此数字必须大于\
  \ 0，否则将产生带有 `IllegalArgumentException` 的 `onError()`。\n\n*   cancel()\n    此方法取消\
  \ `Subscriber` 与 `Publisher` 建立的订阅。此调用后不会触发 `onError()` 或 `onComplete()` 方法。\n\n\
  \    例如，如果我们想取消订阅，可以在现有的 `onNext()` 方法中添加以下代码：\n\n```java\n@Override\npublic void\
  \ onNext(Book book) {\n  // TODO Auto-generated method stub\n  …..\n  …..\n  if(book.getBookName().equals(\"\
  Java 17\"))  {\n    System.out.println(subscriberName+\" cancelling subscription\"\
  );\n    subscription.cancel();\n  }\n}\n```\n\n除了所有这些接口外，我们还需要讨论一下 `SubmissionPublisher`\
  \ 类，它是 `Publisher<T>` 接口的一个新具体实现，声明如下：\n\n```java\npublic class SubmissionPublisher<T>\
  \ extends Object\n             implements Flow.Publisher<T>, AutoCloseable\n```\n\
  \n该对象使用构造函数之一提供的 `Executor` 来交付给订阅者。提供的 `Executor` 类型（`newFixedThreadPool`、`CachedThreadPool`、`ScheduledExecutor`）取决于\
  \ `Publisher` 的用途。\n\n它具有以下重载构造函数：\n\n*   SubmissionPublisher()\n    这创建了一个默认的 `SubmissionPublisher`。由于参数中未提供\
  \ `Executor`，它使用默认的 `Executor` `ForkJoinPool.commonPool()` 来管理到订阅者的异步交付。`onNext()`\
  \ 中的异常未被处理。它使用默认缓冲区容量执行发布。\n\n*   SubmissionPublisher(Executor executor, int maxBufferCapacity)\n\
  \    使用第一个参数中给定的 `Executor` 创建 `SubmissionPublisher`。第二个参数表示每个订阅者的最大缓冲区容量。`onNext()`\
  \ 中的异常未被处理。\n\n*   SubmissionPublisher(Executor executor, int maxBufferCapacity,\
  \ BiConsumer<?super Flow.Subscriber<? super T>, ?super Throwable> handler)\n   \
  \ 使用第一个参数中给定的 `Executor` 创建 `SubmissionPublisher`。第二个参数表示每个订阅者的最大缓冲区容量。第三个参数提供处理器。在我们的解决方案中，我们在\
  \ `Publisher.java` 中如下初始化了 `Subscriber` 对象：\n\n`SubmissionPublisher` 类提供了以下方法：\n\
  \n*   submit(T item)\n    此方法用于将项发布给订阅者。当资源不可用时，它异步调用 `onNext()`。在 `Publisher.java`\
  \ 中，我们调用了这个方法：\n\n```java\nbookList.stream().forEach(i -> {\n  submit(i);\n  try\
  \ {\n    Thread.sleep(3000);\n  } catch (InterruptedException e) {\n    // TODO\
  \ Auto-generated catch block\n    e.printStackTrace();\n  }\n});\n```\n\n观察到 `submit()`\
  \ 方法通过 `forEach()` 提交了每个项。\n\n*   offer(T item, BiPredicate<? super T>, ?super T)\n\
  \    此方法用于将项发布给当前订阅者。它异步调用 `onNext()`。`offer()` 方法有两种形式。简单形式的 `offer()` 方法仅提供项而不包含任何\
  \ `BiPredicate`，在我们的解决方案中实现如下：\n\n```java\n// offer method : simple form\nSystem.out.println(\"\
  Using offer() :==>\");\nbookList.stream().forEach(book -> {\n  offer(book, null);\n\
  \  try {\n    Thread.sleep(3000);\n  } catch (InterruptedException e) {\n    //\
  \ TODO Auto-generated catch block\n    e.printStackTrace();\n  }\n});\n```\n\n在这里，`offer()`\
  \ 方法只提供项。没有根据某种条件或逻辑来丢弃订阅者的项。`offer()` 的另一种形式接受额外的 `BiPredicate` 参数，它本质上是订阅者和项类型的组合。在我们的解决方案中，我们通过以下代码段实现了这一点：\n\
  \n```java\n// offer method : timeout implementation\nSystem.out.println(\"Using\
  \ offer() with timeout :==>\");\nbookList.stream().forEach((book) -> {\n  System.out.println(book\
  \ + \" being offered\");\n  final int result1 = bookPublisher.offer(book, 2, TimeUnit.SECONDS,\
  \ (subscriber, value) -> {\n    try {\n      Thread.sleep(3000);\n    } catch (InterruptedException\
  \ e) {\n      // TODO Auto-generated catch block\n      e.printStackTrace();\n \
  \   }\n  });\n});\n```\n\n\n\n\n\n```java\n    }\n      return true;\n  });\n```\n\
  \n在前面的代码段中，我们正在指示 `SubmissionPublisher` 如果项目在 2 秒内无法被提交，则丢弃它们。这是通过 `offer` 方法的第二个和第三参数实现的。它返回一个\
  \ `true`，表示我们不希望在项目丢弃后抛出任何异常，但如果项目被丢弃，我们将实现一些业务逻辑。\n\n在我们的解决方案中，我们将睡眠时间设置了 3 秒。由于这超过了\
  \ 2 秒，项目将被丢弃，且 `result1` 将包含返回给订阅者的项目数量。\n\n![](img/15.jpg)\n\n*   `consume(Consumer\
  \ <? super T> consumer)`\n    此方法处理所有已发布的项目。该处理是通过参数提供的 `Consumer` 完成的。\n\n## CompletableFuture\
  \ 的更新\n\n`CompletetableFuture` 引入于 JDK 8.0。该 API 在 Java 9 中进行了更新，增加了一些新功能。\n\n##\
  \ 问题\n\n我们如何利用 `CompletableFuture` API 中引入的新功能呢？\n\n## 解决方案\n\n版本 9 在 `CompletableFuture`\
  \ API 中包含了许多更新。在接下来的解决方案中，我们将实现其中几个，例如：\n\n*   `completedOnTime()`\n*   `orTimeOut()`\n\
  *   `delayedExecutor()`\n\n创建如 `Listing 1-26` 所示的 `CompletableFutureDemos.java`\
