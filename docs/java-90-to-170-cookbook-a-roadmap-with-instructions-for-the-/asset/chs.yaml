  \n## 解析\n\n`CompletableFuture<T>` 引入于 Java 8。该 API 在发布后立即变得流行。但开发者发现它在某些功能上有所缺失，例如如何处理任务在规定时间内未完成的情况。为了实现这一点以及其他一些功能，Java\
  \ 9 为 `CompletableFuture` 添了几个方法。\n\n添加了以下方法：\n\n*   `public <U> CompletableFuture<U>\
  \ newIncompleteFuture()`\n    此方法返回一个新的未完成的 `CompletableFuture`。这也被称为 `CompletableFuture`\
  \ 的“虚拟构造函数”。该方法通常在 `CompletableFuture` 的子类中被重写。\n    该方法返回新的 `CompletableFuture`。\n\
  \n*   `public Executor defaultExecutor()`\n    此方法用于返回用于异步方法的默认 `Executor`。当开发者不想指定\
  \ `Executor` 时，使用此方法获取默认 `Executor`。内部，它使用 `ForkJoinPool.commonPool()` 或每个异步任务使用一个线程的简单\
  \ `Executor`。\n    该方法返回一个 `Executor`。\n\n*   `public CompletableFuture<T> copy()`\n\
  \    顾如名，此方法用于创建 `CompletableFuture` 的副本。如果当前 `CompletableFuture` 在无异常的情况下完成，则返回具有相同值的\
  \ `CompletableFuture` 副本。如果当前 `CompletableFuture` 在完成时产生异常，则新的 `CompletableFuture`\
  \ 也会带有 `CompletionException` 完成。\n    该方法返回 `CompletableFuture` 的副本。\n\n*   `public\
  \ CompletionStage<T> minimalCompletionStage()`\n    此方法用于返回正常完成的 `CompletionStage`。它与\
  \ `CompletableFuture` 正常完成时的值相同。如果 `CompletableFuture` 异常完成，则此方法返回带有 `CompletionException`\
  \ 的完成 `CompletionStage`。\n    该方法返回新的 `CompletionStage`。\n\n*   `public CompletableFuture<T>\
  \ completeAsync(Supplier<? extends T> supplier)`\n    此方法用于通过 `Supplier` 提供的值或结果异步完成\
  \ `CompletableFuture`。它使用默认执行器执行此任务。\n    该方法返回 `CompletableFuture`。\n\n*   `public\
  \ CompletableFuture<T> completeAsync(Supplier<? extends T> supplier, Executor executor)`\n\
  \    此方法用于通过 `Supplier` 提供的值或结果异步完成 `CompletableFuture`。它使用作为第二个参数提供的执行器执行任务。\n\
  \    该方法返回 `CompletableFuture`。\n\n*   `public CompletableFuture<T> orTimeout(long\
  \ timeout, TimeUnit unit)`\n    此方法异常地完成 `CompletableFuture`。如果它在一个参数提供的时间内未完成，则将带有\
  \ `TimeoutException` 完成。\n    该方法返回 `CompletableFuture`。\n\n\n\n\n请观察下面的代码片段，我们在\
  \ `Listing 1-26` 的第 53 行中使用了它：\n\n```java\norTimeout(1, TimeUnit.SECONDS).whenComplete((result,\n\
  \             exception) -> {\n  //处理结果或处理异常的业务逻辑\n})\n```\n\n在这里，我们将超时时间段设置为 1\
  \ 秒。`orTimeout()` 中的第二个参数定义了你为第一个参数所使用的单位。我们正在调用 `whenComplete()` 方法，它接受一个 `BiConsumer`\
  \ 来消费这些值。如果任务在 1 秒内完成，则将生成结果，否则将抛出异常。在第 62 行，由于我们应用了 `TimeUnit.SECONDS.sleep(10)`，任务没有在\
  \ 1 秒内完成。因此，我们得到的结果为 `null`，并且会抛出一个异常，我们可以处理该异常：\n\n*   `public CompletableFuture<T>\
  \ completeOnTimeout(T value,long timeout, TimeUnit unit)`\n\n    此方法接受三个参数。如果 `CompletableFuture`\
  \ 没有在第二个参数提供的指定的超时时间内内完成，则它将使用第一个参数提供的值完成。\n\n    该方法返回 `CompletableFuture`。\n\n\
  \    观察下面来自我们解决方案的片段，我们在 `Listing 1-26` 的第 28 行如下使用了 `completeOnTimeout()`：\n\n\
  ```java\ncompleteOnTimeout(10, 2, TimeUnit.SECONDS).thenAccept(result ->\n    System.out.println(\"\
  Result from completeOnTime()==> \"+result));\n```\n\n    在这里，我们带入三个参数调用了 `completeOnTimeout()`。第一个参数提供了默认结果，如果任务没有按照第二个参数提供的秒数时间线完成，则将生成该结果。在第\
  \ 31 行，我们调用了 `TimeUnit.SECONDS.sleep(10)`，这导致任务延迟了 10 秒。这不符合 `completeOnTimeout()`\
  \ 方法中提到的超时条件，因此它产生了默认结果 10。\n\n*   `public static Executor delayedExecutor(long\
  \ delay, TimeUnit unit)`\n\n    此方法用于返回一个 `Executor`。该 `Executor` 的职责是在参数提供的延迟后将任务提交给默认的\
  \ `Executor`。\n\n    该方法返回一个新的延迟 `Executor`。\n\n*   `public static Executor delayedExecutor(long\
  \ delay, TimeUnit unit, Executor executor)`\n\n    此方法用于返回一个 `Executor`，它用于将任务提交给基础\
  \ `Executor` 而不是默认的 `Executor`。该基础 `Executor` 在方法声明中作为第三参数提供。\n\n    该方法返回一个新的延迟\
  \ `Executor`。\n\n    观察我们解决方案中的片段。在第 76 行，我们调用了 `delayedExecutor()`。该方法的第一个参数是 2，单位由第二个参数中的\
  \ Unit 类型表示。紧随其后的是 `thenAccept()` Lambda 表达式：\n\n```java\nCompletableFuture.supplyAsync(()\
  \ -> value1 + value2,\n    CompletableFuture.delayedExecutor(2, TimeUnit.SECONDS))\n\
  \    .thenAccept(result ->\n    System.out.println(\"Result from delayedExecutor()==>\
  \ \"+result));\n```\n\n    因此，该方法将在 2 秒后通过默认的 `Executor`产生结果，并如所示生成输出 300。\n\n*\
  \   `public static <U> CompletionStage<U> completedStage(U value)`\n\n    此方法用于返回带有参数提供的给定值的新\
  \ `CompletionStage`。\n\n    该方法返回已完成的 `CompletionStage`\n\n*   `public static <U>\
  \ CompletableFuture<U> failedFuture(Throwable ex)`\n\n    此方法便于返回一个以参数提供的异常已完成的\
  \ `CompletableFuture`。\n\n    该方法返回异常异常完成的 `CompletableFuture`\n\n*   `public static\
  \ <U> CompletionStage<U> failedStage(Throwable ex)`\n\n    此方法便于返回一个以参数提供的异常已完成的\
  \ `CompletionStage`。\n\n    该方法返回异常异常完成的 `CompletionStage`\n\n![](img/16.jpg)\n\n\
  ## Java 平台模块系统 (Java Platform Module System)\n\n这可能是 Java 9 中讨论得充分的更新之一。JPMS 建议使用模块而不是直接使用包（packages）。现在包将成为模块的组件，而不是独立的组件。\n\
  \n## 问题\n\n我们如何实现 Java 9 启动的新模块系统？它在整个开发或部署过程中对我有什么帮助？\n\n## 解决方案\n\n为了解决这个问题，我们将使用两个用例：\n\
  \n1.  与单个模块工作，以理解什么是模块以及它内部是如何工作的。\n2.  与多个模块工作，学习如何处理它们。\n\n### 案例 1：与简单模块工作\n\n\
  为了理解这一点，请在你的 IDE 中执行以下步骤（某些步骤可能会根据 IDE 不同而有所变化）：\n\n1.  创建一个名为 `MathModule` 的新项目。（确保你的编译器版本设置为\
  \ Java 9）。\n2.  观察到 `module-info.java` 已启用。（你现在甚至可以禁用它）。\n3.  `module-info.java`\
  \ 文件与项目名称匹配：\n\n```java\nmodule MathModule {\n}\n```\n\n4.  创建一个包 `com.mathmodule`。\n\
  5.  如 `Listing 1-26` 所示创建 `MathService.java`：\n\n```java\npackage com.mathmodule;\n\
  \nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class MathService\
  \ {\n    public static List<Integer> checkNumbers(List<Integer> numbers, int value){\n\
  \        List<Integer> numberList=new ArrayList<>();\n        numbers.forEach((x)->{\n\
  \            if(x % value==0)\n                numberList.add(x);\n        });\n\
  \        return numberList;\n    }\n}\n```\n\n6.  如 `Listing 1-27` 所示创建一个应用类 `MathMain.java`：\n\
  \n```java\npackage com.mathmodule;\n\nimport java.util.Arrays;\nimport java.util.List;\n\
  \npublic class MathMain {\n    public static void main(String[] args) {\n      \
  \  // TODO 自动生成的存根\n        List<Integer> generatedList=MathService.checkNumbers(Arrays.asList(10,20,35,40),\
  \ 2);\n        generatedList.forEach(System.out::println);\n    }\n}\n```\n\n7.\
  \  执行 `MathMain.java`。这将打印列表中所有被 2 整除的元素。\n\n### 案例 2：使用多个模块\n\n在这种情况下，我们将修改相同的问题，但这次我们将两个不同的模块并让它们通信。\n\
  \n按照给定步骤操作：\n\n1.  创建一个名为 `MathServiceModule` 的新项目。\n2.  创建包 `com.mathmoduleservice`。\n\
  3.  将之前的项目 `MathModule` 中的 `MathService.java` 文件复制到此包中。\n4.  如 `Listing 1-31` 所示修改\
  \ `module-info.java` 文件：\n\n```java\nmodule MathServiceModule {\n    exports com.mathmoduleservice;\n\
  }\n```\n\n5.  创建另一个名为 `MathProject` 的项目。\n6.  创建一个包 `com.mathproject`。\n7.  将之前的项目\
  \ `MathModule` 中的 `MathMain.java` 文件复制到此包中。\n\n8.  观察到 `MathMain.java` 编译失败，因为它无法引用位于另一个模块中的\
  \ `MathService` 类。\n\n\n\n\n### 9. 步骤\n要在你的项目中添加模块引用，请按照以下步骤操作：\n\n1. 右键点击项目 `MathProject`\
  \ 并选择 `Java Build Path`。\n2. 转到 `Project` 选项卡并选择 `Modulepath`。\n3. 点击 `Add` 按钮并选择\
  \ `MathServiceModule` 将其添加到你自己的项目中。\n\n10. 修改 `MathProject` 中的 `module-info.java`\
  \ 文件：\n\n```\nmodule MathProject {\nrequires MathServiceModule;\n}\n```\n\n11. 在你的\
  \ `MathMain.java` 中导入 `com.mathmoduleservice.MathService` 以解决依赖错误。\n\n12. 执行 `MathMain.java`，它将打印所有能被\
  \ 2 整除的数字。\n\n![](img/17.jpg)\n\n## 解释\n\n现在，我们将逐一讨论这两种情况。\n\n## 案例 1：与简单模块一起：\n\
  \nJava 从诞生初就以以包为中心的架构而闻名。不同的类根据其功能被封装在单个单元中，这个单元被称为包（package）。当我们构建和部署应用程序时，总是需要引用作为\
  \ Java API 一部分的预定义类。\n\n所有这些类都被打包在一个名为 `rt.jar` 的单个文件中，该文件提供给你的应用程序，因此你可以根据需要使用\
  \ `import` 语句并引用这些类。但这种单体应用程序消耗大量的内存，因为 Java 的所有类都封装在这个 `rt.jar` 文件中。到 Java 8 为止，rt.jar\
  \ 文件的大小为 64 MB。对于由像 Java 这样轻量级语言构建的应用程序来说，这确实是一个负担。\n\nJava 9 的模块系统是针对这种单体方法的一种解决方案。在这个系统中，java\
  \ 包被分成若干不同的集合，这些集合被称为模块（modules）。因此，现在不再通过 `rt.jar` 使用整个 API，而是你只需要添加你想在应用程序中使用的那些模块及其包即可。\n\
  \n要列出 Java 中不同的模块，你可以输入 `java --list-modules` 命令，如图图 1.16\n\n**图 1.16：** Java 9\
  \ 中的模块\n\n考虑到输出的大小，这只是一个简短的示例。目前，Java 9 中共有可用 98 个模块，而且这个数字仍在增加。提供给所有应用程序的默认模块是\
  \ `java.base` 模块，它包含了许多你可以开发 Java 应用程序的包。\n\n基于模块创建应用程序与使用普通的面向包的应用程序创建并没有太大区别。唯一的变化是你需要添加一个模块，包将位于其中。模块信息写在\
  \ `module-info.java` 文件中，该文件保存在 `src` 文件夹中。\n\n在我们的解决方案中，创建了 `MathModule` 项目。该项目也包含一个包，我们在其中包含了\
  \ `MathService.java` 和 `MathMain` `.java` 文件。`MathService.java` 文件利用了 `ArrayList`，它是\
  \ `java.util` 包的一部分，而该包在该类中被导入了。由于 `MathMain` 和 `MathServices` 位于同一个包中，它们不需要任何额外的\
  \ `import` 语句即可相互通信。目前为止，使用模块概念构建项目的方法没有变化。但如果你观察的话，会发现 `src` 中添加了 `module-info.java`\
  \ 文件，它目前是空的。\n\n此模块描述符文件定义了模块的以下属性：\n\n* 模块名称。\n* 它可以导出的包，这些包可以被其他模块利用。\n* 它为了使用依赖所需的模块。\n\
  \n在案例 1 中，`module-info.java` 仅包含模块名称，尽管模块使用了 `ArrayList`。这是因为每个模块默认都使用 `java.base`，而这个\
  \ `java.base` 也包含了 `java.util` 包。\n\n因此，以下代码片段如下：\n\n```\nmodule MathModule {\n\
  }\n```\n\n等同于：\n\n```\nmodule MathModule {\nrequires java.base;\n}\n```\n\n### 案例\
  \ 2：与多个模块一起工作\n\n当我们与多个模块工作时，我们需要建立不同模块之间的关系。这可以通过在 `module-info.java` 中不同的属性或指令来实现，如下：\n\
  \n* `requires`\n\n    此指令指定当前模块依赖于另一个模块。如果模块正在使用另一个模块的服务，则你必须提供此指令。\n\n    使用 `requires`\
  \ 的语法如下：\n\n    ```\n    requires modulename;\n    ```\n\n    在我们的解决方案中，我们创建了两个不同的模块：`MathServiceModule`\
  \ 和 `MathModule`。`MathModule` 依赖于 `MathServiceModule`，因为它正在使用其中定义的 `checkNumbers()`\
  \ 服务。\n\n    所以，`MathModule` 的 `module-info.java` 指定了它需要来自另一个模块（即 `MathServiceModule`）的服务，如下：\n\
  \n    ```\n    module MathProject {\n    requires MathServiceModule;\n    }\n  \
  \  ```\n\n* `requires transitive`\n\n    这也是隐含可读性（implied readability）。通常，如果你在模块中使用分层方法，就会使用这种方法。假设模块\
  \ B 指定了它对模块 A 的依赖，但模块 C 指定了它对模块 B 的依赖。在这种情况下，如果你想让 B 指定的任何依赖也提供给模块 C，那么你可以使用 `requires\
  \ transitive`。\n\n    使用 `transitive` 的语法如下：\n\n    ```\n    requires transitive\
  \ modulename;\n    ```\n\n* `exports`\n\n    此模块指令指定当前模块中的哪些包对其他模块是可读的。这是 Java 9\
  \ 一个非常重要且有趣的更新，因为除非该类所在的模块允许，否则模块将无法导入任何其他类的服务。\n\n    `exports` 的语法如下：\n\n    ```\n\
  \    exports packagename;\n    ```\n\n    在我们的解决方案中，如所知，`MathModule` 指定了它需要 `MathServiceModule`的服务。但除非\
  \ `MathServiceModule` 导出该包，否则其他模块无法使用其中的资源。这通过修改 `MathServiceModule` 模块的 `module-info.java`\
  \ 实现：\n\n    ```\n    module MathServiceModule {\n    exports com.mathmoduleservice;\n\
  \    }\n    ```\n\n* `exports to`\n\n    此指令是 `exports` 指令的修改或高级版本。`exports` 将包暴露给所有模块。但\
  \ `exports to` 指定了哪些特定模块可以使用这些包及其资源。\n\n    `exports to` 的语法如下：\n\n    ```\n   \
  \ exports packagename to module1,module2…;\n    ```\n\n* `uses`\n\n    此模块修饰符表示模块需要某些服务。与\
  \ `requires` 不同，这总是指的是它需要其实现的接口或抽象类。\n\n    `uses` 的语法如下：\n\n    ```\n    uses servicerequired\n\
  \    ```\n\n* `provides with`\n\n    此模块修饰符表示当前模块正在提供可以被其他模块使用的服务。本质上，它是当前模块提供的抽象类或接口的实现。\n\
  \n    `provides with` 的语法如下：\n\n    ```\n    provides servicename with serviceimplementation\n\
  \    ```\n\n![](img/18.jpg)\n\n\n\n\n在本章中，我们讨论了 Java 9 中发布的许多新特性。我们解决了许多问题陈述，以理解如何在真实场景中利用这些新特性。Java\
