  \n\n\n\n\n\n# 献给\n我们可爱的儿子\n***OJAS***\n&\n***Neko**（我们的宠物）**\n\n# 关于作者\n\n**Tejaswini\
  \ Jog** 目前担任 Java 顾问培训师。她的专业领域是 Spring 和微服务。她从大约 15 年前开始 Java 培训师的职业。她在为企业客户提供培训方面经验丰富。她的客户包括\
  \ Wipro、Accenture、花银行等。除了培训之外，她还编写了《Learning Spring 5.0》、《Reactive Programming with\
  \ Java 9》等书籍。\n\n**Mandar Jog** 是一位充满激情的 Java 培训师。Mandar 拥有超过 20 年的培训经验，非常擅长培训新人以及有经验的候选人。他总是致力于建立新人的技能树，使他们准备好就业。他还是《Java\
  \ 9.0 to 13.0》和《Professional Java Interview Guide》等书籍的作者。他还担任 Zensar、Accenture、eClerx\
  \ 等公司的企业培训师。\n\n# 关于评审员\n\n**Paulo Lopes** 是一位首席软件工程师，也是事件驱动平台的资深倡导者，在金融、电信、视频游戏和地理空间业务的\
  \ Java 高性能分布式系统方面拥有卓越记录。他是 Eclipse Vert.x 的开源维护者，在 Web 和安全标准（如 FIDO2/webauthn、Oauth2\
  \ 和 OpenID Connect）方面拥有丰富经验。他还是 W3C WebAuthn 工作组的成员、安全软件开发的坚定支持者、Redis 兼容数据库反应式驱动程序作者，以及精通\
  \ PostgreSQL 和 MySQL 的关系型数据库开发者。\n\n**Prashant Kumar** 在软件行业已工作 11 年。目前，他在 IBM 担任数据工程师，参与有趣的大数据应用。他从\
  \ Java 开发人员起步，现在根据工作性质同时使用 Java 和 Python。他还曾担任企业内容管理系统的顾问。在不工作时，Prashant 喜欢看书，并且是一个巨大的足球粉丝。\n\
  \n# 致谢\n\n写一本书绝对不是一项容易的任务。它需要大量的团队合作和协调才能实现。在选择书名和出版的整个过程中，BPB Publications 整个团队提供了巨大的支持。我们对**整个团队**表示感谢。\n\
  \n我们要感谢我们的父母和朋友，他们不断鼓励我们通过这本书向他人分享知识。\n\n# 前言\n\n本书是为所有想要了解 Java 不同版本中引入的特性的人编写的。早以前，Java\
  \ 版本的迭代并不那么关键，因为版本通常每隔几年发布一次。因此，一旦你学习了一个版本，就可以在很长一段时间内使用该版本而无需升级到新概念。然而，Oracle 启动了基于时间的版本发布模型，因此现在每隔六个月就会发布一个新版本。因此，如果我们是\
  \ Java 开发者，理解新特性并保持自我更新已成为最重要的方面之一。\n\n本书完全是以实战为导向的。在本书中，你将发现与特定版本的不同特性相关的各种问题描述。虽然讨论了概念，但都是通过问题描述来讨论的。每个问题描述都与解决方案及其解释相结合，以帮助读者更实际地掌握概念，而不是仅仅留在概念层面。\n\
  \n本书分为 8 个不同的章节。每一章都针对从 Java 9 到 Java 17 的特定版本。本书涵盖了对 Java 开发者重要的所有特性。每个特性都通过问题描述及其使用该特性的解决方案进行了解释。各章节的详情列如下：\n\
  \n**第一章** 将涵盖从 Java 9.0 开始的更新。在本章中，读者将了解不同的特性，例如接口中的私有方法、流和集合 API 的更新。同时，它还涵盖了 `JShell`\
  \ 的用法。\n\n**第二章** 将涵盖 Java 10 的重要特性。在本章中，读者将学习如何使用局部变量推断以及为什么要使用。Java 10 还为集合 API\
  \ 增加了额外功能，如 `copyOf()` 方法。\n\n**第三章** 将涵盖作为 Java 11 部分引入的特性。Java 11 带有修改反射 API。此外，String\
  \ API 引入了一些方法，通过这些方法，我们可以更精确地处理字符串。Lambda 表达式的局部变量语法以及启动单文件源程序（`single-file source-code`）的概念在软件行业也变得流行。\n\
  \n**第四章** 将涵盖 Java 12 的特性。Java 12 为 Stream API 提供了一些重要特性，如 `Teeing Collectors`。此外，还引入了一些处理字符串的额外功能。\n\
  \n**第五章** 将涵盖 Java 13 以及 Java 14 的更新。由于每个版本单独的变化并不多，在本章中涵盖了这两个版本。Java13 在文件系统（FileSystem）和\
  \ XML 解析器中引入了一些额外功能。此外，Java 14 对 `switch-case` 提供了一些改进。\n\n**第六章** 将涵盖作为 Java 15\
  \ 版本引入的所有特性。该版本的主要变化是引入了文本块（`text blocks`）、隐藏类（`hidden classes`）以及为 `CharSequence`\
  \ 接口增加了功能。\n\n**第七章** 将涵盖 Java 16 版本的特性。在 Java 16 中，有很多特性，如从代理调用默认方法、`Record` 类等。此外，从该版本开始，我们可以对\
  \ `instanceof` 运算符进行模式匹配。\n\n\n\n\n\n第 8 章 将涵盖 Java 17 的主要特性。在这个版本中，Java 在随机数生成器中引入了一些新算法。此外，现在有一项功能，可以使用它来过滤反序列化过程。除此之外，还有诸如密封类（Sealed\
  \ classes）的 Vector 和反射 API 等其他概念。\n\n# 代码包与彩色图片\n\n请点击链接下载本书的`Code Bundle`（代码包）和彩色图片`：\n\
