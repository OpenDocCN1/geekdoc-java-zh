  ### Java 10 – 黎明时刻\n\n## 引言\n\n对于任何编程语言来说，发布带有新 API 的更新版本总是具有挑战性的。提议和创建此类新 API 的过程非常耗时。此外，还需要对其进行测试，以便行业能够接受。Java\
  \ 这一过程也不例外。这可能就是 Oracle 在 2017 年 9 月发布 Java 9.0 时，距离 Java 8.0 发布已经过了近三年的原因。一方面，我们可以说这种延迟是有好处的，因为你可以更地依赖这种经过充分测试的\
  \ API。但另一方面，来自开发者和竞争者的压力总是存在。而且，没有人希望失去客户。此外，开发者始终需要对发布事件保持警惕。在深思熟虑后，Oracle 提出了发布新版本的新策略。引入了“基于时间的版本发布”概念。在该概念下，决定每六个月发布一个新版本。现在，不再要求每个版本都包含\
  \ API 的重大更新。有时，版本可能只包含一些细小的更新或删除，而不完整的 JEP 可能会移到下一个周期。根据此策略，Java 10.0 在正好 6 个月后发布，即\
  \ 2010 年 3 月。尽管 Java 10.0 不像 Java 8.0 和 Java 9.0 那样在 Java API 上提供任何重大变化，但它引入了一些我们将在本章学习的方法。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下概念：\n\n*   局部变量类型推断\n*   集合 API 增强\n*   Stream API 增强\n*\
  \   Optional 接口增强\n*   应用类数据共享\n\n## 目标\n\n学习此单元后，你应该能够使用 Java 10 引入的新特性。你应该能够在应用程序中使用像\
  \ `copyOf()` 和 `orElseThrow()` 等功能，以便更有效地与集合和 Optional 接口协作工作。\n\n## 安装\n\n访问以下\
  \ URL 下载 Java 10 以遵循本章中的所有代码片段：[`www.oracle.com/java/technologies/java-archive-javase10-downloads.html`](https://www.oracle.com/java/technologies/java-archive-javase10-downloads.html)\n\
  \n## 局部变量类型推断\n\n从 Java 10 开始，在声明变量时，开发者不需要指定数据类型。数据类型将声明为 `var`，标识符的数据类型将根据传递给该变量的值动态生成。这一概念被称为局部变量类型推断。\n\
  \n## 问题\n\n讨论我们如何使用 Java 10 的局部变量类型推断。\n\n## 解决方案\n\n我们将通过不同的场景来讨论这个问题：\n\n### 场景\
  \ 1：使用 `var` 关键字的基础\n\n让我们观察可以使用 `var` 关键字的基本情况。如下所示 `Listing 2-1, TypeInferenceDemo_Basic.java`\
  \ 描述了在正常场景下 `var` 关键字的使用：\n\n```java\n//Listing 2-1\npackage com.java10.typeinference;\n\
  import java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\
  import java.util.function.BiFunction;\nimport java.util.function.Function;\n\npublic\
  \ class TypeInferenceDemo_Basic {\n    public static void main(String[] args) {\n\
  \        var x = 10;\n        var message = \"Java is simple to learn\";\n     \
  \   var person = new Person();\n        var myList = getList();\n        Function<Integer,\
  \ Integer> process = value -> value + 10;\n        var data = process.apply(10);\n\
  \    }\n\n    private static List<Integer> getList() {\n        return Arrays.asList(43,\
  \ 54, 12, 54);\n    }\n}\nclass Person {}\n```\n\n### 场景 2：在多态中使用 `var` 关键字\n\n\
  `var` 关键字也可以用于多态。假设我们有一个 `SalesPerson`，它是 `Person` 的一种类型。那么，我们可以使用 `var` 关键字通过超类来引用子类。\n\
  \n```java\n//Listing 2-4\npackage com.java10.typeinference;\n\npublic class TypeInferenceymorphism\
  \ {\n    public static void main(String[] args) {\n        var p1 = new Person();\n\
  \        var p2 = new SalesPerson();\n        p1 = p2;\n        // p2 = p1; // 失败，因为子类不能指向父类\n\
  \    }\n}\n```\n\n### 场景 3：在循环中使用 `var` 关键字\n\n我们也可以在循环语句中使用 `var` 关键字，如 `Listing\
  \ 2-5, TypeInferenceLoops.java` 所示：\n\n```java\n//Listing 2-5\npackage com.java10.typeinference;\n\
  \npublic class TypeInferenceLoops {\n    public static void main(String[] args)\
  \ {\n        traditionalLoop();\n        enhancedLoop();\n    }\n\n    private static\
  \ void enhancedLoop() {\n        // TODO-generated method stub\n        for (var\
  \ x = 1; x <= 10; x++) {\n            System.out.println(x);\n        }\n    }\n\
  \n    private static void traditionalLoop() {\n        // TODO-generated method\
  \ stub\n        var intArray = new int[] {34, 54, 12, 54};\n        for (var x :\
  \ intArray) {\n            System.out.println(x);\n        }\n    }\n}\n```\n\n\
  ### 场景 4：在匿名类中使用 `var` 关键字\n\n为了理解这一点，让我们创建一个所示的 `SampleInterface` 接口：\n\n```java\n\
  //Listing 2-6\n```\n\n\n\n\n\n```java\npackage com.java10.typeinference;\n\npublic\
  \ interface SampleInterface {\n    public void processData();\n}\n```\n\n现在，使用 `var`\
  \ 关键字，我们可以生成此接口的匿名实现，如 `Listing 2-7, TypeInferenceAnonymous.java:` 所示：\n\n```java\n\
  //Listing 2-7\npackage com.java10.typeinference;\n\npublic class TypeInferenceAnonymous\
  \ {\n    public static void main(String[] args) {\n        // TODO Auto-generated\
  \ method stub\n        var sampleref=new SampleInterface() {\n            @Override\n\
  \            public void processData() {\n                // TODO Auto-generated\
  \ method stub\n                System.out.println(\"Method Implemented\");\n   \
  \         }\n        };\n        sampleref.processData();\n    }\n}\n```\n\n## 解析\n\
  \n声明和初始化变量对开发者来说并不新鲜。无论你是 Java 开发者还是非 Java 开发者，你都是无所不知的。像 `int x=10,` 这样这样声明变量的做法并不是错误的。没有人会认为这种模式有任何改进的空间。但当你考虑用这种模式声明不同类型的变量时，它会使代码变得臃肿。这看起来也更加仪式化。因此，为了让声明更具读性并减少编写代码的仪式感，Java\
  \ 10 引入了 `var` 关键字。`var` 关键字使得变量变为动态类型。\n\n使用 `var` 关键字，我们可以推断出声明变量时数据类型必须始终连接。\n\
  \n以下是使用 `var` 关键字声明变量的一些示例：\n\n**语句 1:**\n`var x=10;`\n\n**语句 2:**\n`var mylist=new\
  \ ArrayList<Integer>();`\n\n语句 1 推断出 `int` 类型。\n\n语句 2 推断出 `ArrayList<Integer>`。\n\
  \n可以将 `var` 关键字用于本地变量、循环、匿名内类实现等。然而，在使用 `var` 关键字时，你需要遵循一些规则，具体如下：\n\n- 使用 `var`\
  \ 声明的变量或成员必须在声明时进行初始化。\n  例如：\n  `var data; // 错误`\n  `var data=10;//正确`\n\n- 初始化不能为\
  \ `null`，因为无法通过 `null` 识别类型推断。\n  例如：\n  `var data=null;// 错误`\n  `var data=10;//正确`\n\
  \n- `var` 关键字后面不能跟多个变量。\n  例如：\n  `var data=10, count=1; // 错误`\n\n- 用于初始化的初始化器不能包含另一个初始化的变量。\n\
  \  例如：\n  `var data=(value=10); // 错误`\n\n- 如果 `var` 用于引用数组，我们不能在没有数据类型的情况下初始化。\n\
  \  例如：\n  `var data={10,20,30}; // 错误`\n\n- `var` 关键字后面不能跟定义数组维度的 []\n  例如：\n  `var[]\
  \ data=new int[3]; // 错误`\n\n- `var` 关键字不能直接指向 Lambda 表达式，因为 Lambda 表达式需要目标类型来推断其类型。\n\
  \  例如：\n  `var data=value->value+20; // 错误`\n  `Function<Integer, Integer> data=value->value+20;\
  \ //正确`\n\n- `var` 关键字不能与 `static` 关键字和实例变量一起使用。\n\n- 我们不能在 Lambda 表达式的正式参数中使用 `var`\
  \ 关键字。\n  例如：\n  `Function<Integer,Integer> process = (var value) -> value + 10;\
  \  // 错误`\n\n![](img/19.jpg)\n\n## Collection API 增强\n\nJava 10 在集合中提供了一个额外的方法 `copyOf()`，用于从现有集合创建\
  \ `List`、`Set` 和 `Map` 等集合。\n\n现在我们将通过一个不同的方案，以理解如何在不同的集合中使用此方法。\n\n## 问题\n\n我们如何使用\
  \ Java 10 Collection API 中引入的不同方法？\n\n## 解决方案\n\n`Listing 2-8, CopyOfDemoList.java`\
  \ 展示了 `List.copyOf()` 方法的使用：\n\n```java\n//Listing 2-8\npackage com.java10.collection;\n\
  import java.util.Arrays;\nimport java.util.Collections;\nimport java.util.List;\n\
  import java.util.stream.Collectors;\n\npublic class CopyOfDemoList {\n    public\
  \ void main(String[] args) {\n        useCopyOfNotNull();\n        useCopyOfWithNull();\n\
  \    }\n    private static void useCopyNotNull() {\n        // TODO Auto-generated\
