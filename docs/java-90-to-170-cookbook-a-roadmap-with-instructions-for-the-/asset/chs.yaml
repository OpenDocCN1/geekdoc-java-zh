  \ Java 开发人员的工作变得更加简单且易于维护。人们可能会认为，在 API 开发方面，内容已经足够了。但等一下！Oracle 从未说过他们会发布一个最终版本。记住基于时间的版本发布系统概念，它承诺我们每六个月就能获得一次更新的版本。Java\
  \ 13 是同一基于时间版本发布系统的下一个版本，它于 2019 年 9 月发布。由于六个月的期限限制，无法保证每个发布的版本在 API 上都会有重大变化。变化可能是微小的，或者有时变化处于预览阶段，但该版本会在给定的时间线内发布。Java\
  \ 13 就是这样的一个版本，其中更多特性在预览阶段发布，而这些特性在下一个版本中被定稿。当然，在 API 方面也有一些变化，我们将在本章中学习。Java 13\
  \ 的一些预览特性作为最终特性在于 2020 年 3 月发布的 Java 14 中发布了。Java 14 发布了一些针对 switch-case、紧凑数字格式化等特性。此外，此特性主要侧重于性能和健壮性。本章分为两部分：第一部分介绍\
  \ Java 13 的更新，第二部分涵盖 Java 14 的更新。\n\n## 结构 #toc.xhtml_s56a\n\n在本章中，我们将涵盖以下概念：\n\n\
