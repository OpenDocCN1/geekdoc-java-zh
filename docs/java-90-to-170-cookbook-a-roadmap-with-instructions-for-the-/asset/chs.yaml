  \n    {\n        Objects.requireNonNull(empname, \"Needs employee name!\");\n  \
  \      if (empId <= 0) {\n            throw new IllegalArgumentException(\"The empid\
  \ must be a non-zero!!\");\n        }\n    }\n    public static void main(String[]\
  \ args) {\n        Demo_explicit_constructor6 demo =\n            new Demo_explicit_constructor6(1,\
  \ \"name 1\", 1234l);\n        System.out.println(\"Instance value is:-\" + demo);\n\
  \        try {\n```\n\n\n\n\n\n```java\n  demo = new Demo_explicit_constructor٦(-١,\
  \ \"name ١\", ١٢٣٤l);\n  System.out.println(\"Instance value is:-\" + demo);\n}\
  \ catch (Exception e) {\n  // TODO: handle exception\n  e.printStackTrace();\n}\n\
  \  demo = new Demo_explicit_constructor٦(١, null, ١٢٣٤l);\n  System.out.println(\"\
  Instance value is:-\" + demo);\n}\n}\n```\n\n## 输出\n\n当我们执行前面的代码时，将显示 图 7.7 所示的输出：\n\
  \n![](img/Figure-7.7.jpg)\n\n**图 7.7:** Record 类中的紧凑结构\n\n## 解释\n\n我们之前已经讨论过规范构造函数（canonical\
