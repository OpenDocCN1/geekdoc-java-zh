  \n## Packager 工具\n\n从诞生以来，Java 一直缺乏提供创建应用程序打包设置的适当实用工具。传统上，我们必须使用 Java 提供的 `jar`\
  \ 工具在原生操作系统上执行 Java 文件。Java 16 发布了 `Packager` 工具，用于编译、打包、签名和部署 Java 以及 JavaFX 应用程序。\n\
  \n## 问题\n\n如果我们的应用程序已准备好绪，我们能否将其作为一个适用于原生平台的安装程序包进行交付呢？\n\n## 解决方案\n\n让我们先开发一个 Java\
  \ 应用程序，我们将使用 Java 工具对其进行进一步打包：\n\n11. `public class MyFrame {`\n3. `public static\
  \ void main(String[] args) {`\n5. `JFrame frame = new JFrame(\"Packaging\");`\n\
  6. `frame.setMinimumSize(new Dimension(400, 400));`\n7. `frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);`\n\
  9. `JLabel lblText = new JLabel(\"Hello !!!!Welcome to Java exe packaging!\", SwingConstants.CENTER);`\n\
  10. `frame.getContentPane().add(lblText);`\n12. `frame.pack();`\n13. `frame.setVisible(true);`\n\
  15. `}`\n17. `}`\n\n现在，让我们在成功编译后使用以下命令将其一起打包为 JAR 包：\n\n`jar cvf FrameApp.jar MyFrame.class`\n\
  \n一旦我们得到了 jar 包，让我们使用该工具创建一个命名如下的特定于平台可执行文件：\n\n`jpackage -i . -n MyFrame --main-jar\
  \ FrameApp.jar --main-class MyFrame.`\n\n在执行该命令后，我们将得到一个名为 `MyFrame-1.0.exe` 的可执行文件。\n\
  \n该文件现在可以通过双击直接进行安装。你可以在 `C:/Program Files` 找到安装目录。\n\n## 解析\n\n`jpackage` 工具在 JDK\
  \ 14 中通过 JEP 343 作为孵化工具引入。在 JDK 16 中，它已准备好提升为正式特性。为了支持这一过渡，`jpackage` 模块名称将从 `jdk.incubator.jpackage`\
  \ 变为 `jdk.jpackage`。\n\n旧的 `JavaFX` javapackager 工具支持以下内容：\n\n- 原生打包格式，为终端用户提供自然的安装体验。包括\
  \ Windows 上的 msi、exe，macOS 上的 pkg、dmg 以及 Linux 上的 deb、rpm。\n- 在打包时指定启动参数。\n- 支持直接从命令行、编程或通过\
  \ `ToolProvider` API 调用。\n\n在为了分发而进行开发后，创建 JAR 是许多 Java 应用程序的常见做法。然而，用户更愿意在原生平台上安装它，而不是简单地将其放在类路径或模块路径上。这意味着对于应用程序开发者来说，交付一个简单的\
  \ JAR 文件已经不够了；开发者必须以可安装包的形式交付，而且是适用于原生平台的包。通过这种方式，Java 应用程序将以用户熟悉的方式进行发布、安装和卸载。\n\
  \n## 基于值的类 (Value based classes)\n\nJava API 现在包含一种名为“基于值的类”的新类型。除了包装类，`java.util.Optional`、`java.time.LocalDateTime`\
  \ 等类也被设计为基于值的类。\n\n## 问题\n\n什么是基于值的类？由于这种修改，包装类的行为发生了什么变化？\n\n## 解决方案\n\n下面的代码段解释了包装类的修改：\n\
  \n1. `//Listing 7-13`\n2. `package com.java16.wrapper;`\n4. `public class DemoWrapper\
  \ {`\n5. `public static void main(String[] args) {`\n6. `// TODO Auto-generated\
  \ method stub`\n8. `Integer i=٢٠;`\n9. `Integer i١=new Integer(٢٠); //warning`\n\
  11. `synchronized (i) { //warning`\n12. `}`\n13. `}`\n14. `}`\n\n## 解析\n\n基本类型包装类现在被指定为基于值。从\
  \ 9 开始，包装类的构造发生了变化。现在，每当我们使用构造函数时，可以预期：\n\n```\nInteger i=٢٠;\nInteger i١=new Integer(٢٠);\
  \ //warning\nsynchronized (i) { //warning }\n```\n\n我们可以使用 `jdepscan` 工具如下所示识别已用\
  \ API 的用法：\n\n```\njdepscan DemoWrapper.class\n```\n\n我们将得到如下输出：\n```\nclass DemoWrapper\
  \ uses deprecated method java/lang/Integer::<init>(I)V(forRemoval=true)\n```\n\n\
  在处理同步操作时，我们也会收到警告。`javac` 会识别对基于值的类型的同步：\n\n```java\nsynchronized (i) { }\n```\n\
  \nInteger 是一个基于值的类型，不建议作为 synchronized 语句的参数。\n\n![](img/77.jpg)\n\n## 总结\n\n在本章中，我们讨论了\
  \ Java 16 发布的一些特性。我们通过场景学习了许多特性。我们讨论了改进时间 API 如何帮助我们获取更具描述性和意义的时间。除了修改后的 `instanceof`\
  \ 运算符外，我们还讨论了记录类（record class）。\n\n在下一章中，我们将介绍 Java 17 的特性。\n\n\n\n\n最后，Java 开发者对另一个`长期支持`（`LTS`）版本的等待终于结束了。上一个\
  \ LTS 版本是 `Java 11`，它于 2018 年 9 月发布。在 `Java 11` 之后，引入了许多新功能以使 Java 更加可靠和健壮。 2021\
  \ 年 9 月发布的 `Java 17` 包含了数千项与性能和安全相关的更新。除了十四项增强外，该版本还发布了三个孵化模块和一个预览特性。此版本提供了一种更有意义的生成随机数的方法。新随机数生成器算法的重要更新之一是能够从内部为并行计算生成随机数，这提高了应用程序的性能。此外，该版本还为反序列化过程提供了额外的安全特性，而这在\
  \ `Java 9` 中是缺失的。此外，你现在可以用更灵活的方式使用 `switch-case` 语句。在本章中，我们将学习所有这些特用法。除了这些正式版本发布的特性外，我们还将学习\
  \ `Vector API`，它仍然是一个孵化模块。但在不久的将来，由于其在分布式计算方面的服务，它将肯定作为正式版本发布。因此，学习这一特性始终是一个明智的决定。\n\
