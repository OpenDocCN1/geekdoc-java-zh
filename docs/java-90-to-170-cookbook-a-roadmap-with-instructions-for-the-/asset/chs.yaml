  \ API\n* Vector API\n\n## 目标\n\n本章的目的是熟练掌握 `Java 17` 特性。在本章中，我们将涵盖新随机数生成器算法的重要特性、使用\
  \ `allowFilter()` 和 `rejectFilter()` 方法限制反序列化过程等。我们还将学习在密封类和接口上集成反射 API，以及该版本的新的\
  \ switch case 特性。最后，我们将讨论 `Vector API`，它在 `Java 17` 中仍然是孵化模块的一部分。\n\n## 安装\n\n在开始阅读本章之前，请访问以下\
