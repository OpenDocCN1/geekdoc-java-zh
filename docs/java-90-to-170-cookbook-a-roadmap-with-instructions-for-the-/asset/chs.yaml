  \n## 基于嵌套的访问控制\n\n内部类概念在 Java 中已经使用了多年。在这个版本中，内部类与外部类私有成员之间的通信方式发生了变化。让我们通过一些示例来讨论这个问题。\n\
  \n## 问题\n\n解释 Java 11 中基于嵌套的访问控制的概念。\n\n## 解决方案\n\n考虑以下代码：\n\n```java\n//Listing\
  \ 3-1\npackage com.nestbasedaccess;\npublic class Car {\n  private String carType;\n\
  \  public Car(String type) {\n   this.carType = type;\n  }\n  class Engine {\n \
  \   String engineType;\n    void setEngine() {\n      if(carType.equals(\"disel\"\
  ))\n        this.engineType=\"customized\";\n      else\n        this.engineType=\"\
  standard\";\n    }\n    String getEngineType() {\n      return this.engineType;\n\
  \    }\n  }\n}\n```\n\n## 输出\n\n为了理解基于嵌套的访问控制如何工作，我们需要使用 `javap` 命令。该命令用于反汇编类。它会打印类的公共成员和方法。\n\
  \n我们将在 Java 11 之前的编译器版本和 Java 11 编译器中使用 `javap` 命令，并观察输出结果。\n\n### 场景 1：使用 Java\
  \ 9 编译器\n\n如果我们使用 Java 9 编译器执行 `javap` 命令，我们将得到如图 3.1 所示的输出：\n\n![](img/Figure-3.1.jpg)\n\
  \n**图 3.1：** 使用桥接方法的嵌套访问\n\n### 场景 2：使用 Java 11 编译器\n\n如果我们使用 Java 11 编译器执行 `javap`\
  \ 命令，我们将得到如图 3.2 所示的输出：\n\n![](img/Figure-3.2.jpg)\n\n**图 3.2：** 不使用桥接方法的嵌套访问\n\n\
  ## 解释\n\n在内部类的实现中观察到了基于嵌套的访问控制。正如我们所知，内部类是在另一个类中编写类的方法。这种概念也被称为嵌套类。由于两个类都封装在同一个文件中，内部类具有访问外部类所有成员的权限。这包括外部类的私有成员。\n\
  \n（注：原文包含高度重复的片段和混乱的去重内容，如“an inner class is an approach where we write the class\
  \ in another class”。我清理了这些重复内容以保持专业文档的流畅性，同时确保核心逻辑完整。）\n\n在内部类的实现中观察到了基于嵌套的访问控制。正如我们所知，内部类是在另一个类中编写类的方法。这种概念也被称为嵌套类。由于两个类都封装在同一个文件中，内部类具有访问外部类所有成员的权限。这包括外部类的私有成员。\n\
  \n## 反射 API 的更新\n\nJava 的反射 API 围绕 `java.lang.Class` 展开。该类现在提供了额外的方法：\n\n* `getNestHost()`\n\
  * `getNestMembers()`\n* `isNestmate()`\n\n我们将详细讨论这些方法。\n\n## 问题\n\n我们如何识别嵌套主机或成员？新的\
  \ API 如何实现相同的功能？\n\n## 解决方案\n\n```java\n//Listing 3-2\npackage com.nestbasedaccess;\n\
  \nimport java.util.Arrays;\nimport java.util.Set;\nimport java.util.stream.Collectors;\n\
  import com.nestbasedaccess.Car;\n\npublic class ReflectionIDemo {\n  public static\
  \ void main(String[] args) {\n    // 自动生成的 stub\n    Car car=new Car(\"Disel\");\n\
  \    Engine engine=car.new Engine();\n    System.out.println(\"Host name for Engine\
  \ class:\"+hostName(engine));\n    if(checkNestMate(engine)==true) {\n      System.out.println(\"\
  Engine is nestmate of Car\");\n    } else {\n      System.out.println(\"Engine is\
  \ not nestmate of Car\");\n    }\n    Set<String> nestMembers=findNestMembers(engine);\n\
  \    System.out.println(\"Nestmembers of Engine are: ==>\");\n    int counter=0;\n\
  \    for(String member:nestMembers) {\n      System.out.println(++counter+\". \"\
  ++member+\" \");\n    }\n  }\n\n  public static String hostName(Object o){\n   \
  \ return o.getClass().getNestHost().getName();\n  }\n\n  public static boolean checkNestMate(Object\
  \ o) {\n    return o.getClass().isNestmateOf(Car.class);\n  }\n\n  public static\
  \ Set<String> findNestMembers(Object o){\n    return Arrays.stream(o.getClass().getNestMembers())\n\
  \                 .map(Class::getName)\n                 .collect(Collectors.toSet());\n\
  \  }\n}\n```\n\n\n\n\n\n```java\n                .collect(Collectors.toSet());\n\
  38.  }\n39. }\n```\n\n## 输出\n\n如果我们执行 `ReflectionAPIDemo.java:`，将显示如图 3.3 所示的内容：\n\
  \n![](img/Figure-3.3.jpg)\n\n**图 3.3:** 更新后的反射 API\n\n## 解释\n\n现在让我们详细讨论我们在解决方案中实现或调的所有方法。\n\
  \n### getNHost()\n\n`getNestHost()` 方法用于获取嵌套类内部宿主类的详细信息。即使你的类包含在一个接口内部，该方法也会获取接口的细节。\n\
  \n该方法的语法如下：\n\n```java\npublic Class<?> getNestHost()\n```\n\n该方法返回：\n\n*   如果嵌套类声明在另一个类内部，则返回该嵌套宿主类或接口。\n\
  *   如果在非嵌套类上调用此方法，则该类本身被视为宿主。在这种情况下，方法返回与嵌套宿主相同的宿类类。\n\n在我们的 `Listing 3-2` 中，`Engine`\
  \ 类嵌套在 `Car` 中。我们可以像方法所示所示，在 `Engine` 对象上调用 `getNestHost()`：\n\n```java\npublic\
  \ static String hostName(Object o){\n  return o.getClass().getNestHost().getName();\n\
  }\n```\n\n因此，在这种情况下，由于 `o` 是 `instanceof Engine`，`getNestHost().getName()` 返回 `com.nestbasedaccess.Car`（Car\
  \ 的全限定名），如输出所示。如果我们将对象类型更改为 `Car`，输出仍然相同，因为 `Car` 没有嵌套在任何其他类内部。\n\n### isNestmateOf()\n\
  \n反射 API 中添加的另一个方法是 `isNestmateOf()`。\n\n该方法的语法如下：\n\n```java\npublic boolean isNestmateOf(Class<?>\
  \ c)\n```\n\n方法参数：\n\n`Type Class<?> c，要检查的类`\n\n该方法返回：\n\n*   如果当前类和 `Class<?>\
  \ c` 属于同一个外部类的成员，或者属于同一个嵌套宿主的成员，则返回 `True`。\n*   如果当前类和 `Class<?> c` 不是同一个外部类的成员，或者不是同一个嵌套宿主的成员，则返回\
  \ `False`。\n\n在我们的解决方案 `Listing 3-2` 中，我们在第 32 行调用了此方法，如下：\n\n```java\npublic static\
  \ boolean checkNestMate(Object o) {\n  return o.getClass().isNestmateOf(Car.class);\n\
  }\n```\n\n在此方法中，我们传递 `Engine` 对象作为参数。正如我们所知，`Car` 是外部类，它不包含另一个嵌套宿主。在这种情况下，`Car`\
  \ 的嵌套宿主是 `Car` 本身。因此，当使用 `isNestmateOf()` 方法比较 `Car` 和 `Engine` 对象时，它返回 true。\n\n\
  ### getNestMembers()\n\n此方法用于查找给定嵌套宿主的其他嵌套成员。\n\n该方法的语法为：\n\n```java\npublic Class<?>[]\
  \ getNestMembers()\n```\n\n该方法返回：\n\n*   一个 `Class` 对象的数组，它是所有作为当前类嵌套成员的类和接口的组。\n\
  *   除了嵌套成员外，该数组还包含给定类的嵌套宿主。因为它被标记为自身的嵌套宿主。该类始终位于数组的第一个元素，随后是存在于其内部的其他类或接口。\n*  \
  \ 如果该类不包含任何嵌套成员，则方法仅返回 `this`。\n\n为了清楚地理解这个概念，我们在 `Car` 类中添加了另一个嵌套类 `SteeringWheel`，如下：\n\
  \n```java\npublic class Car {\n  …\n  class Engine {\n  …}  \n  class SteeringWheel\
  \ {  \n}\n}\n```\n\n在我们的解决方案 `Listing 3-2` 中，我们在第 35 行对 `Engine` 类调用了 `getNestmembers()`\
  \ 方法，如下：\n\n```java\npublic static Set<String> findNestMembers(Object o){\n  return\
  \ Arrays.stream(o.getClass().getNestMembers())\n               .map(Class::getName)\n\
  \               .collect(Collectors.toSet());\n}\n```\n\n我们在第 22 行传递了 `Engine`，如下：\n\
  \n```java\nSet<String> nestMembers=findNestMembers(engine);\n```\n\n现在，由于方法是在 `Engine`\
  \ 类上调用的，该调用的输出从 `Car` 开始。`Engine` 是数组中的第一个元素，随后是 `SteeringWheel`，而作为 `Car` 嵌套宿主的\
  \ `Car` 是其自身。\n\n![](img/2.jpg)\n\n## String API 更新\n\nString API 已经非常丰富。虽然此 API\
  \ 没有发生重大变化，但 Java 11 引入了一些额外方法来增强对空白的处理。除此之外，它还提供了更多处理字符串的方法。以下是不同的方法：\n\n*   `strip()`\n\
  *   `stripLeading()`\n*   `stripTrailing()`\n*   `isBlank()`\n*   `repeat()`\n\n\
  ## 问题\n\n讨论这些方法的行为与现有方法有何不同。\n\n## 解决方案\n\n`Listing 3-3, StringIDemo.java` 显示了 String\
  \ API 中引入的方法：\n\n```java\n// Listing 3-3\npackage com.strings;\n\npublic class StringIDemo\
  \ {\n  public static void main(String[] args) {\n    // 生成的存根\n    System.out.println(\"\
  Stripping the String>\");\n    String originalString=\" \\t   \\t \";\n    System.out.println(\"\
  Stripped String=\"+originalString.strip());\n    System.out.println(\"Trimmed String=\"\
  +(originalString.trim()));\n\n    System.out.println(\"Stripping leading and trailing\
  \ spaces =>\");\n    System.out.println(\"Leading Strip=\"+originalString.stripLeading());\n\
  \    System.out.println(\"Trailing Strip=\"+originalString.stripTrailing());\n\n\
  \    System.out.println(\"Checking the blank String=>\");\n    String blankString=\"\
  \   \";\n    System.out.println(\"Is String blank=\"+blankString.isBlank());\n\n\
  \    System.out.println(\"Generating lines from the String using lines() ==>\");\n\
  \    String text=\"This book contains recipes for Java.\\nIt covers the concept\
  \ from Java 9 to 18\";\n    text.lines().forEach((line)->System.out.println(line));\n\
  \n    System.out.println(\"\\n\");\n\n    System.out.println(\"Repeating the String\
  \ using repeat()==>\");\n    String bookName=\"Java 9+ Recipes!\";\n    System.out.println(bookName.repeat(5));\n\
  \  }\n}\n```\n\n\n\n\n\n| 它使用代码点 (ASCII) 值来识别空白。 | 它使用 Unicode 值来识别空白。 |\n| 它删除了\
  \ ASCII 值小于或等于 ‘U+0020' 或 ‘32' 的字符。 | 它根据 Unicode 移除所有空白。 |\n\n**表 3.1:** `trim()`\
  \ 方法与 `strip()` 方法的区别\n\n`strip()` 方法内部使用 `isWhiteSpace(int codePoint)` 来检查给定的字符是否为空白。该方法是在\
  \ Java 5.0 中引入的。\n\n根据 Java 文档，当且仅当字符满足以下标准之一时，该字符为 Java 空白字符：\n\n* 它是一个 Unicode\
  \ 空格字符（`SPACE_SEPARATOR`、`LINE_SEPARATOR` 或 `PARAGRAPH_SEPARATOR`），但不是不换行空格（`\\\
  u00A0`、`\\u2007`、`\\u202F`）。\n* 它是 `\\t`，`U+0009 HORIZONTAL TABULATION`（水平制符）。\n\
  * 它是 `\\n`，`U+000A LINE FEED`（换行符）。\n* 它是 `\\u000B`，`U+000B VERTICAL TABULATION`（垂直制符）。\n\
  * 它是 `\\f`，`U+000C FORM FEED`（分页符）。\n* 它是 `\\r`，`U+000D CARRIAGE RETURN`（回车符）。\n\
  * 它是 `\\u001C`，`U+001C FILE SEPARATOR`（文件分隔符）。\n* 它是 `\\u001D`，`U+001D GROUP SEPARATOR`（分组分隔符）。\n\
  * 它是 `\\u001E`，`U+001E RECORD SEPARATOR`（记录分隔符）。\n* 它是 `\\u001F`，`U+001F UNIT SEPARATOR`（单元分隔符）。\n\
  \n在我们的解决方案中，即 `Listing 3-3` 中，我们在同一个 String 上同时使用了 `strip()` 方法和 `trim()` 方法，以识别这两个方法的行为。\n\
  \n观察以下代码：\n\n```java\nString originalString=\"\\u2001 \\t BPB Publications \\t \\\
  u2002 \";\nSystem.out.println(\"Stripped String=\"+originalString.strip());\nSystem.out.println(\"\
  Trimmed String =\"+(originalString.trim())+\"\\n\");\n```\n\n在这里，我们的原始 String 在开头和结尾包含如\
  \ `\\u2001` 和 `\\t` 等特殊字符。在输出中，你会观察到我们使用了 `strip()` 方法；根据文档，这两个特殊字符都被视为空白字符，因此它们被删除了。但\
  \ `trim()` 方法并非如此。你会观察到 `trim()` 方法将它们视为特殊字符而非空白字符，并原样保留。\n\n### stripLeading()\n\
  \n如方法名所示，该方法移除字符串开头的空白。\n\n该方法的语法如下：\n\n```java\npublic String stripLeading()\n\
  ```\n\n该方法返回：\n\n* 移除所有开头的空白后返回当前的 `String`。\n* 如果字符串只包含空白字符，则返回空 `String`。\n\n\
  在我们的解决方案中，即 `Listing 3-3` 第 15 行，显示了该方法的调用结果。\n\n```java\nSystem.out.println(\"\
  Leading Strip  =\"+originalString.stripLeading());\n```\n\n与 `strip()` 方法类似，它将 `\\\
  u2001` 和 `\\t` 视为空白并将其移除。\n\n### stripTrailing()\n\n该方法与之前的方法（即 `stripLeading()`）完全相同。唯一的区别是它用于移除结尾的空白。\n\
  \n该方法的语法如下：\n\n```java\npublic String stripTrailing()\n```\n\n该方法返回：\n\n* 移除所有结尾的空白后返回当前的\
  \ `String`。\n* 如果字符串只包含空白字符，则返回空 `String`。\n\n在我们的解决方案中，即 `Listing 3-3` 第 10 行，显示了该方法的调用结果：\n\
  \n```java\nSystem.out.println(\"Leading Strip  =\"+originalString.stripTrailing());\n\
  ```\n\n与 `strip()` 方法类似，它将 `\\u2001` 和 `\\t` 视为空白并将其移除。\n\n### isBlank()\n\n该方法用于检查\
  \ `String` 是否为空。\n\n该方法的语法如下：\n\n```java\npublic boolean isBlank()\n```\n\n该方法返回：\n\
  \n* 如果字符串为空或仅包含空白字符，则返回 `True`。\n* 如果字符串包含除空白字符以外的任何字符，则返回 `False`。\n\n在我们提供的解决方案\
  \ `Listing 3-3` 第 20 行中，所示调用了该方法：\n\n```java\nString blankString=\"\\u2001\";\n\
  System.out.println(\"Is blank =\"+blankString.isBlank());\n```\n\n在这里，我们的原始 String\
  \ 在开头和结尾包含如 `\\u2001` 和 `\\t` 等特殊字符。在输出中，你会观察到我们使用了 `strip()` 方法；根据文档，这两个特殊字符都被视为空白字符，因此它们被删除了。但\
  \ `trim()` 方法并非如此。你会观察到 `trim()` 方法将它们视为特殊字符而非空白字符，并原样保留。\n\n### lines()\n\n该方法返回行流（Stream）。\n\
  \n该方法的语法如下：\n\n```java\npublic Stream<String> lines()\n```\n\n该方法返回行流。\n\n在我们的解决方案\
  \ `Listing 3-3` 第 23 行中，显示了该方法的调用结果：\n\n```java\nString text=\"This contains\\nrecipes.\"\
  ;\ntext.lines().forEach((line)->System.out.println(line));\n```\n\n\n\n\n如果你使用 Java\
  \ 11 编译器重新编译并执行同一个程序，你将得到如图 3.6*所示的输出：\n\n![](img/Figure-3.6.jpg)\n\n**图 3.6：**\
  \ Java 11.0 反射访问。\n\n## 解析\n\n我们现在都知道 Java 11 中基于嵌套的访问是如何修改的。这种修改还导致了另一个与私有成员反射访问相关的特性。在\
  \ Java 11 之前，如果我们在外部类中有任何私有成员，我们无法通过反射过程访问它。如果你尝试这样做，编译器会产生 `IllegalAccessException`。\n\
  \n在我们的解决方案 `Listing 3-4` 中，我们在外部类中有一个私有静态成员变量值。在第 11 行，我们尝试进行相同的操作：`field.setInt(field,\
  \ 20)`。\n\n如果我们使用 Java 11 之前的编译器编译此程序，它会抛出 `IllegalAccessException`。图 3.5 显示了当我们使用\
  \ Java 9 编译器编译并执行该程序时的相同输出。情况下，如果我们仍然想通过反射访问此类私有变量，我们需要在私有字段上显式调用 `setAccessible(true)`，例如\
  \ `field.setAccessible(true)`。\n\n这种显式调用通常是是因为编译器为私有成员创建了访问桥接（access bridge）。\n\n\
  在 Java 11 中，不再为私有数据成员创建这种访问桥接。因此，使用反射 API 访问外部类的私有成员变得更加简单和直接。图 3.6 显示了使用 Java 11\
  \ 编译器执行相同程序的输出。观察代码发现，我们在代码中没有使用任何 `setAccessible(true)` 方法，但仍然可以使用反射 API 访问私有成员值。\n\
  \n![](img/35.jpg)\n\n# Lambda 参数的局部变量语法 (#toc.xhtml_s37a)\n\n此更新方便了将 `var` 关键字作为\
  \ Lambda 表达式中使用的形式参数的类型。\n\n## 问题\n\n演示如何在 Java 11 中使用 `var` 关键字来声明 Lambda 表达式中使用的变量。\n\
  \n## 解决方案\n\n这个问题可以通过 `Listing 3-5` 中提供的解决方案来解决，如下：\n\n```java\n//Listing 3-5\n\
  package com.var;\nimport java.util.Arrays;\nimport java.util.List;\n@FunctionalInterface\n\
  interface Calculation{\n  public abstract double calculateSum(List<Integer> numList);\n\
  }\npublic class UseofVar{\n  public static void main(String[] args) {\n    // TODO\
  \ 自动生成的方法存根\n    // 在 consumer 接口中使用 var 关键字\n    List<Integer> intList=Arrays.asList(١٠,٣,٥٤,١٢,٥٤,١٢);\n\
  \    System.out.println(\"Elements in the list ==>\");\n    intList.forEach((var\
  \ value)->System.out.print(value+\" \"));\n    // 在自定义函数接口中使用 var 关键字\n    Calculation\
  \ calculation=(var list)->\n        list.stream()\n        .mapToInt(Integer::intValue)\n\
  \        .sum();\n    System.out.println(\"\\nAddition of elements in list     \
  \      ==>\"+calculation.calculateSum(intList));\n  }\n}\n```\n\n## 输出\n\n输出如图 3.7*所示：\n\
  \n![](img/Figure-3.7.jpg)\n\n**图 3.7：** Lambda 参数中的 `var` 关键字\n\n## 解析\n\n`var`\
  \ 关键字是在 Java 10 中引入的，可以作为局部变量类型而非实际类型。然而，在 Java 10 中，无法在 Lambda 表达式中使用此关键字。尽管我们可以完全跳过\
  \ Lambda 的数据类型，但并不允许用 `var` 关键字替换它。\n\n例如，以下是一个简单的 Lambda 表达式：\n\n`(int value1,\
  \ int value2) -> value1*value2;`\n\n我们知道可以如下替换它：\n\n`(value1, value2) -> value1*value2;`\n\
  \n这从 Java 8 开始显而易见是。现在让我们尝试在之前声明的 Lambda 表达式中使用 `var` 关键字。语句变为：\n\n`(var value1,\
  \ var value2) -> value1*value2;`\n\n如果你用 Java 10 编译它，编译器会报错。但如果你用 Java 11 编译相同内容，它就能通过。\n\
  \n显而易的问题是，这种方法对开发者有什么好处？主要原因是统一性。当你将 `var` 应用于 Lambda 时，它在 Lambda 变量和局部变量之间建立了统一性。此外，如果我们不使用任何数据类型，无法应用任何修饰符。以下声明显示了如何对\
  \ Lambda 应用修饰符：\n\n`(@Nonnull var1, @Nonnull var2) -> value1*value2;`\n\n然而，必须遵循某些规则：\n\
  \n- 如果我们在 Lambda 表达式中使用 `var` 关键字且表达式包含多个变量，则必须对所有变量使用 `var`。例如，以下无效的：`(var value1,\
  \ value2) -> value1*value2;`\n- 不允许将 `var` 关键字与普通类型混合。例如，以下无效的：`(var value1, int\
  \ value2) -> value1*value2;`\n- 在单条 Lambda 表达式中使用 `var` 关键字时，我们不像普通表达式那样省略括号。例如，以下无效的：`var\
  \ value1 -> System.out.println(value1);`\n\n在我们的解决方案 `Listing` 第 18 行，我们使用了 `var`\
  \ 关键字来声明 Consumer 接口的 Lambda 表达式：\n\n`intList.forEach((var value)->System.out.print(value+\"\
  \ \"));`\n\n这里，Lambda 中的 `value` 数据类型声明为 `var` 而非 `Integer`。\n\n此外，我们定义了函数接口 `Calculator`，它包含抽象方法\
  \ `calculateSum()`。该方法的参数是 `List<Integer>`。在第 20 行，我们为该方法创建了 Lambda 表达式：\n\n`Calculation\
  \ calculation=(var list)->list.stream().mapToInt(Integer::intValue).sum();`\n\n\
  这里，list 的类型声明为 `var` 而非 `List<Integer>`。\n\n![](img/36.jpg)\n\n# HttpClient (标准)\
  \ (#toc.xhtml_s38)\n\nJava 11 提供了支持 HTTP/2 和 WebSocket 的 `HttpClient`。这是 `HttpURLConnection`\
  \ API 的替代。\n\n## 问题\n\n如何使用新的 HTTP 客户端与资源通信？\n\n## 解决方案\n\n`Listing 3-6`, `HttpClientDemo.java`\
  \ 显示了如何向 `http://www.google.com` 发起 GET 请求并打印响应头、状态和正文内容：\n\n```java\n//Listing\
  \ 3-6\npackage com.httpclient;\nimport java.io.IOException;\nimport java.net.URI;\n\
  import java.net.http.HttpClient;\nimport java.net.http.HttpHeaders;\nimport java.net.http.HttpRequest;\n\
  import java.net.http.HttpResponse;\npublic class HttpClientDemo {\n  public static\
  \ void main(String[] args) throws IOException, InterruptedException {\n    HttpClient\
  \ client = HttpClient.newHttpClient();\n    HttpRequest request = HttpRequest.newBuilder()\n\
  \      .uri(URI.create(\"http://www.google.com\"))\n      .GET()\n      .build();\n\
  \    printHeader(client);\n    printStatus(client, request);\n    printBodyContent(client,\
  \ request);\n  }\n  public static void printStatus(HttpClient client, HttpRequest\
  \ request) throws IOException, InterruptedException {\n    HttpResponse<Void> response\
  \ = client.send(request, HttpResponse.BodyHandlers.discarding());\n    System.out.println(\"\
  \\n\\nHTTP Status code ==> \"+response.statusCode());\n  }\n}\n```\n*(注：由于原文提供的代码块\
  \ Listing 3-6 不完整，此处根据原文结构进行了保留，仅翻译注释)*\n\n\n\n```java\n                    response.statusCode());\n\
  \     }\n   public static void printHeader(HttpClient client)\n                \
  \               throws IOException, InterruptedException {\n        var request\
  \ = HttpRequest.newBuilder()\n                    .uri(URI.create(\"http://www.google.com\"\
  ))\n                    .method(\"HEAD\", HttpRequest.BodyPublishers.noBody())\n\
  \                    .build();\n     HttpResponse<Void> response = client.send(request,\n\
  \                             HttpResponse.BodyHandlers.discarding());\n       \
  \ HttpHeaders headers = response.headers();\n        System.out.println(\"Header\
  \ Information ==>\");\n        headers.map().forEach((headerKey, headerValue) ->\
  \ {\n                    System.out.printf(\"%s: %s%n\", headerKey, headerValue);\n\
  \        });\n    }\n    public static void printBodyContent(HttpClient client,\n\
  \                                        HttpRequest request)\n             throws\
  \ IOException, InterruptedException {\n        HttpResponse<String> response = client.send(request,\n\
  \                             HttpResponse.BodyHandlers.ofString());\n        System.out.println(\"\
  \\n\\nBody Content ==>\");\n        System.out.println(response.body());\n    }\n\
  }\n```\n\n## 输出\n\n下面的图 3.8 显示了当我们向 `http://www.google.com` 发送 GET 请求时生成的输出：\n\n\
  ![](img/Figure-3.8.jpg)\n\n**图 3.8：** HttpClient 的用法\n\n## 解析\n\n在 Java 9 中，该模块作为\
  \ JEP 11 的一部分引入。该模块最初被视为一个孵器模块。该模块的主要目标是取代旧的 `HttpURLConnection` API。\n\n`HttpURLConnection`\
  \ API 存在一些问题，列举如下：\n\n*   该 API 基于 `URLConnection`，而设计者是为 FTP、Gopher 等不同协议设计的，这些协议现在并没有多大用。\n\
  *   它基于 HTTP/1.1，这是市场上一个较旧的版本。\n*   难以使用且文档记录不全。\n*   单线程模型。\n\n因此，为了克服 `HttpURLConnection`\
  \ 的所有缺点或问题，line API 在 Java 11 中作为功能完整的 API 被开发并发布。\n\n以下是 `HttpClient` API 的主要优势：\n\
  \n*   易于使用。\n*   通过处理请求和响应的过程，暴露了 HTTP 协议的相关方面。\n*   通过实现基本身份验证提供了标准的身份验证方法。\n*\
  \   支持 HTTP/2。\n*   性能优于 `HttpURLConnection`。\n\n现在让我们更多地讨论这个类：\n\n该类的声明如下：\n\n\
  `public abstract class HttpClient extends Object`\n\n此类用于向指定的 URL 发送请求并检索响应。由于这是一个抽象类，引用通过工厂方法\
  \ `newHttpClient()` 提供的构建器来创建。这为所有发送的请求提供了有关配置和共享资源的信息。\n\n要发送请求，我们需要与 `HttpRequest`\
  \ 通信，它是一个抽象类。工厂方法 `newBuilder()` 返回 `HttpRequest.Builder`，在与 URL 通信时，我们可以利用 HTTP\
  \ 的不同方法。此 `HttpRequest.Builder` 类提供了不同的方法：\n\n*   `uri(URI)`\n*   `GET()`\n*   `POST()`\n\
  *   `DELETE()`\n*   `version()`\n*   `build()`\n\n这些仅仅是这些类中的一些重要方法。但正如之前讨论的，它为所有\
  \ HTTP 协议提供了支持。解决方案中使用的以下代码片段展示了我们如何连接到 `http://www.google.com` 并为该地址生成 `HttpRequest`：\n\
  \n```java\nHttpClient client = HttpClient.newHttpClient();\nHttpRequest request\
  \ = HttpRequest.newBuilder()\n                    .uri(URI.create(\"http://www.google.com\"\
  ))\n                    .GET()\n                    .build();\n```\n\n记住，我们需要显式地发送请求以生成任何响应，这是通过\
  \ `HttpClient` 的 `send()` 方法实现的。我们必须为发送的每个请求提供 `BodyHandler` 对象。此 `BodyHandler`\
  \ 决定了如何处理响应。有不同的方法用于发送请求：\n\n1.  `send(HttpRequest, BodyHandler)`：这是一种阻塞方法。在客户端接收到当前请求之前阻塞下一个请求。\n\
  2.  `sendAsync(HttpRequest, BodyHandler)`：将请求发送到资源并异步接收响应。它返回 `CompletableFuture<HttpResponse>`。当响应准备就绪并可用时完成。在我们的解决方案\
  \ `Listing 3-6` 中，我们使用了 `HttpResponse` 的不同方法来利用响应。\n3.  要接收状态码：\n    ```java\n \
  \   HttpResponse<Void> response = client.send(request,\n                       \
  \      HttpResponse.BodyHandlers.discarding());\n    System.out.println(\"\\n\\\
  nHTTP code ==> \" + response.statusCode());\n    ```\n4.  要接收头信息：\n    ```java\n\
  \    HttpResponse<Void> response = client.send(request,\n                      \
  \       HttpResponse.BodyHandlers.discarding());\n    HttpHeaders headers = response.headers();\n\
  \    ```\n5.  要接收主体内容：\n    ```java\n    HttpResponse<String> response = client.send(request,\n\
  \                             HttpResponse.BodyHandlers.ofString());\n    System.out.println(\"\
  \\n\\nBody Content ==>\");\n    System.out.println(response.body());\n    ```\n\n\
  ![](img/37.jpg)\n\n# 运行单文件源码程序 (toc.xhtml_s39a)\n\n许多编程语言都提供了一步编译并执行程序的功能。尽管作为开发者，你可能在运行\
  \ IDE 时使用过类似的功能。在像 Eclipse 这样的 IDE 中，你可以在不编译的情况下执行程序；至少这种感觉是这样的。但内部编译总是存在的。所以这是\
  \ IDE 引入的功能。从 Java 11 开始，类似的概念作为 Java 特性的一部分发布。\n\n## 问题\n\nJava 11 的单文件源码概念是如何工作的？\n\
  \n## 解决方案\n\n我们将通过一个简单的打印 Hello World 的程序来讨论这一点。不要使用你的 IDE，而是在 Notepad 或 VSCode\
  \ 等编辑器编写以下代码：\n\n```java\n//Listing 3-7\npublic class HelloWorld{\n  public static\
  \ void main(String[] args){\n    System.out.println(\"Hello World\");\n  }\n}\n\
  ```\n\n## 输出\n\n我们将不再遵循传统的编译后执行类的做法。相反，我们将直接使用 `java` 命令执行文件来获取输出。\n\n输出输出如下图 3.9\
  \ 所示：\n\n![](img/Figure-3.9.jpg)\n\n**图 3.9：** 单文件源码\n\n## 解析\n\n单文件源码是 Java 11\
  \ 引入的一个有趣功能。以前，在 Java 中执行任何文件之前，我们需要编译它。但如果我们想学习一些新特性或测试一小段代码，这个过程看起来有点繁琐。现在使用此新功能，我们可以跳过编译过程并直接执行文件。\n\
  \n要使用此功能，我们只需要编写一个带有 `main()` 函数的类的 Java 文件。传统上（直到 Java 10），Java 程序的执行模式有：\n\n1.\
  \  运行提供给 JRE 的类。（该类必须包含 `main()` 函数。）\n2.  运行在 JAR 文件中声明的主类。\n3.  运行模块的主类（如果使用 Java\
  \ 9 模块系统）。\n4.  现在从 Java 11 开始，增加了第四种模式。\n5.  运行提供给 JRE 的源文件中声明的类。\n\n\n\n\n\n在此模式下，源文件在内部被编译为类文件并临时存储在内存中。执行时，会扫描带有\
  \ `main` 方法的第一个类。例如，请考虑以下 `sample.Java` 代码段：\n\n```java\nclass First{\n  public\
  \ static void main(String[] args){\n     System.out.println(\"In first\");\n  }\n\
  }\nclass Second{\n  public static void main(String[] args){\n    System.out.println(\"\
  In Second\");\n  }\n}\n```\n\n如果你执行该文件，将输出 `In first`。文件包含两个类，但根据顺序执行。现在更改顺序如下：\n\
  \n```java\nclass Second{\n  public static void main(String[] args){\n      System.out.println(\"\
  In Second\");\n  }\n}\nclass First{\n  public static void main(String[] args){\n\
  \      System.out.println(\"In first\");\n  }\n}\n```\n\n现在，如果再次执行文件，将输出 `In second`，顺序发生了变化。你可以将命令行参数传递\
  \ `main()` 函数。\n\n![](img/jpg)\n\n## 结论\n在本章中，我们讨论了基于 Java 11 概念的不同解决方案。讨论了如何使用更新的\
  \ API 来检索主机或其他成员。我们还学习了 `String` API 中引入的新方法以更有效地处理空格。此外，我们讨论了如何通过反射访问嵌套类的私有成员、在\
  \ lambda 参数中使用 `var` 关键字以及 `HttpClient` 类。最后，我们讨论了如何直接执行 Java 文件。\n\n在下一章中，我们将讨论并实现\
  \ Java 12 引入的不同特性。我们将理解 `CompletableFuture`、`TeeCollectors` 等复杂的 API。\n\n## 问题\n\
  1. 哪种方法用于获取当前类的主机名？\n2. 获取当前类成员的方法是什么？\n3. 如何从现有字符串生成多行？\n4. 在 lambda 参数中使用 `var`\
  \ 关键字规则。\n5. 如何使用 `HttpClient` 发送异步请求？\n\n## 关键字\n* `getNest()`\n* `getNestMembers()`\n\
  * `isNestmateOf()`\n* `strip()`\n* `stripLeading()`\n* `stripTrailing()`\n* `isBlank()`\n\
  * `lines()`\n* `repeat()`\n* `HttpClient`\n\n# 第 4 章\n# Java 12 – 性能是关键\n\n## 引言\n\
  在上章中，我们讨论了 Java 11 引入的不同特性。我们已经知道 Java 11 版本于 2018 年 9 月发布。根据 Oracle 的政策，每六个月发布一个新版本。在这种基于时间的方案下，Java\
  \ 12 于 2019 年 3 月发布，正好在 Java 11 发布六个月后。该版本主要关注某些性能特性。当然，此版本还引入了其他 API 开发。垃圾回收器现在可以返回未使用的内存，因为缩短了暂停时间。同时，Java\
  \ 12 还提供了微基准来监控应用程序的速度或单元。\n\n`String` API 也有一些修改，Java 开发者知道 `String` API 是应用程序开发者最重要的\
  \ API 。Java 12 被称为快速版本。这意味着与 Java 11 不同，该版本没有长期支持（LTS）。这意味着在下一个版本出现之前，Java 12 提供商业支持。\n\
  \n## 结构\n在本章中，我们将涵盖以下概念：\n* Stream API 中的 Teeing Collectors\n* String API 的更新\n\
  * NIO 的更新\n* CompletableFuture 的更新\n* 紧凑数字格式\n\n## 目标\n在本章中，我们将带你了解 Java 12 引入的不同特性。我们将讨论这些新的\
  \ API 如何帮助开发者增强编码实践。我们将通过不同的示例学习这些 API 变化。\n\n## 安装\n访问以下 URL 下载 Java 12 以遵循本章中的代码段：\n\
  [`www.oracle.com/java/technologies/javase/jdk12-archive-downloads.html`](https://www.oracle.com/java/technologies/javase/jdk12-archive-downloads.html)\n\
  \n## Collectors.teeing()\nJava 12 在 `Collectors` 中引入了一个静态方法 `Collectors.teeing()`。`Collectors`\
  \ 是 stream API 提供的接口之一。`Collectors.teeing()` 用于从独立的收集器收集生成的结果。\n\n## 问题\n利用 `Collectors.teeing()`\
  \ 概念存储员工列表的最高和最低工资。\n\n## 解决方案\n让我们考虑如 `Listing 4-1` 所示的 `Employee.java`：\n\n```java\n\
  package com.streams;\nclass Employee {\n  private int empId;\n  private String empName;\n\
  \  private double empSalary;\n  public Employee(int empId, String empName, double\
  \ empSalary) {\n    this.empId = empId;\n    this.empName = empName;\n    this.empSalary\
  \ = empSalary;\n  }\n  public int getEmpId() { return empId; }\n  public void setEmpId(int\
  \ empId) { this.empId = empId; }\n  public String getEmpName() { return empName;\
  \ }\n  public void setEmpName(String empName) { this.empName = empName; }\n  public\
  \ double getEmpSalary() { return empSalary; }\n  public void setEmpSalary(double\
  \ empSalary) { this.empSalary = empSalary; }\n}\n```\n\n我们将创建员工列表并传递给 。随后，我们将调用\
  \ `Collectors.teeing()` 来生成并分组平均工资和计数，如 `Listing 4-2, CollectorTeeDemo.java` 所示：\n\
  \n```java\npackage com.streams;\nimport java.util.Arrays;\nimport java.util.HashMap;\n\
  import java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\
  class CollectorTeeDemo {\n  public static void main(String[] args) {\n    List<Employee>\
  \ empList=Arrays.asList(\n      new Employee(101,\"John\",5049),\n      new Employee(102,\"\
  Smith\",7000),\n      new Employee(103,\"William\",9000),\n      new Employee(104,\"\
  Derek\",2000),\n      new Employee(105,\"Steve\",5000)\n    );\n    Map<String,\
  \ Double> empSummary = empList.stream().collect(\n      Collectors.teeing(\n   \
  \     Collectors.averagingDouble(Employee::getEmpSalary),\n        Collectors.counting(),(e1,\
  \ e2) -> {\n          HashMap<String,Double> map = new HashMap<String,Double>();\n\
  \          map.put(\"Total Number of Employees,\", e2.doubleValue());\n        \
  \  map.put(\"Average Salary of Employees,\", e1.doubleValue());\n          return\
  \ map;\n        }\n      )\n    );\n    for (Map.Entry<String, Double> entry : empSummary.entrySet())\
  \ {\n      System.out.println(\"Key : \" + entry.getKey() + \" Value : \" + entry.getValue().intValue());\n\
  \    }\n  }\n}\n```\n\n\n\n如果我们执行 `CollectorTeeingDemo.java`，我们将得到如*图 4.1*所示的输出：\n\
  \n![](img/Figure-4.1.jpg)\n\n**图 4.1:** Collector 分流（Teeing）\n\n## 解析\n\n为了从流中生成结果值，通常我们使用流的终端操作。我们也可以使用\
  \ `collect()` 方法将所有处理过的流收集到一个集合中。更进一步，Java 12 方便了对结果的集合和分组执行不同的操作。\n\n该方法的语法如下：\n\
  \n```java\npublic static <T,R1,R2,R> Collector<T,?,R> teeing(\nCollector<? super\
  \ T,?,R1> result1,\nCollector<? super T,?,R2> result2,\nBiFunction<? super R1,?\
  \ super R2,R> resultmerger)\n```\n\n方法中的类型参数为：\n\n* `T`: 输入元素的类型。\n* `R1`: 第一个收集器的结果类型。\n\
  * `R2`: 第二个收集器的结果类型。\n* `R`: 最终结果类型。\n\n方法参数为：\n\n* `result1`: 对集合执行的第一次操作生成的结果。\n\
  * `result2`: 对集合执行的第二次操作生成的结果。\n* `resultmerger`: 一个双叉函数，用于将两个操作生成的两个结果合并为单个单元。\n\
  \n该方法返回 `Collector`，它结合了两个提供的收集器的结果。\n\n在我们的解决方案 `Listing 4-2` 中，我们使用了这一功能，如下：\n\
  \n```java\nHashMap <String, Double> empSummary = empList.stream().collect(\n   \
  \         Collectors.teeing(\n                Collectors.averagingDouble(Employee::getEmpSalary),\n\
  \                Collectors.counting(),\n                    (e١, e٢) -> {\n   \
  \                     HashMap <String, Double> map = new HashMap <String, Double\
  \ ();\n```\n\n我们使用 `collect()` 方法将员工流收集到一个集合中。然后，我们应用了 `Collectors.teeing()` 执行了两个操作。首先，它通过调用\
  \ `Collectors.averagingDouble()` 计算员工的平均值，然后，它也通过调用 `Collectors.counting()` 计算给定收集器中的元素数量。这两个结果通过传递给方法中\
  \ lambda 表达式提供的第三个参数（双叉函数）存储在 `HashMap` 中。由于我们将结果存储在 `Map` 中，因此结果被传递给 `HashMap`。\n\
  \n![](img/39.jpg)\n\n# String API 更新](#toc.xhtml_s48a)\n\nJava 中的 String API 已经非常丰富。尽管该\
  \ API 没有发生重大变化，但 Java 11 引入了一些额外方法来增强对字符串中空白字符的处理。同时，它还提供了一些更多处理字符串的方法。\n\n以下是 String\
  \ 中引入的不同方法：\n\n* `transform()`\n* `indent()`\n* `describeConstable()`\n* `resolveConstantDesc()`\n\
  \n## 问题\n\nJava 12 中引入了哪些新特性或功能来改进字符串处理？\n\n## 解决方案\n\n`Listing 4-3, StringDemos.Java`\
  \ 展示了属于 Java 12 的 String API 的不同方法：\n\n```java\n//Listing 4-3\npackage com.strings;\n\
  import java.lang.invoke.MethodHandles;\nimport java.util.Arrays;\nimport java.util.List;\n\
  import java.util.Optional;\n\npublic class StringDemos {\n  public static void main(String[]\
  \ args) {\n    // TODO Auto-generated method stub\n    indentDemo();\n    transformDemo();\n\
  \    describeConstableDemo();\n    resolveConstantDescDemo();\n  }\n  private static\
  \ void describeConstableDemo() {\n    // TODO Auto-generated method stub\n    String\
  \ course=\"Java٢\";\n    Optional<String> data=course.describeConstable();\n   \
  \ System.out.println();\n    System.out.println(\"describeConstable()== \"+data.get());\n\
  \  }\n  private static void resolveConstantDescDemo() {\n    // TODO Auto-generated\
  \ method stub\n    String course=\"java٢\";\n    String result=course.resolveConstantDesc(MethodHandles.lookup());\n\
  \    System.out.println(\"resolveConstantDesc()== \"+result);\n  }\n  private static\
  \ void transformDemo() {\n    // TODO Auto-generated method stub\n    System.out.println(\"\
  transform() ==>\");\n    String str=\"Java9,Java10\";\n    List<String> strList=str.transform(str1->\n\
  \        return Arrays.asList(str1.split(\",\")));\n    System.out.println(\"Original\
  \ String==> \"+str);\n    System.out.println(\"Transformed Content==> \");\n   \
  \ strList.forEach(str2->System.out.println(str2));\n    String str١ = \"Life is\
  \ beautiful,\";\n    var strresult = str١.transform(input -> input.concat(\" have\
  \ fun\"))\n        .transform(String::toUpperCase);\n    System.out.print(\"Chaining\
  \ of transform()==> \");\n    System.out.print(strresult);\n  }\n  private static\
  \ void indentDemo() {\n    // TODO Auto-generated method stub\n    System.out.println(\"\
  Using indent() ==>\");\n    System.out.println(\"-------------------\");\n    String\
  \ str=\"  Welcome to Java\\nIt's simple\\nIt's robust\";\n    System.out.println(\"\
  using indent(0):\");\n    String str١=str.indent(0);\n    System.out.println(str1);\n\
  \    System.out.println(\"using indent(2):\");\n    String str١=str.indent(2);\n\
  \    System.out.println(str1);\n    System.out.println(\"using indent(-2):\");\n\
  \    String str١=str.indent(-2);\n    System.out.println(str1);\n  }\n}\n```\n\n\
  ## 输出\n\n如果我们执行 `StringDemos.java`，将得到如*图 4.2*所示的输出：\n\n![](img/Figure-4.2.jpg)\n\
  \n**图 4.2:** String 更新\n\n## 解析\n\n如解决方案所示，Java 12 在 String API 中增加了一些方法。让我们分别讨论这些方法：\n\
  \n### indent()\n\n`String` 的此项方法用于调整字符串的缩进。\n\n该方法的语法如下：\n\n```java\npublic String\
  \ indent(int i)\n```\n\n方法参数为：\n\n* `i`: 要添加或删除的领先空白字符数\n\n方法返回 `String`，其缩进已调整且换行符已标准化\n\
  \n当我们以字符串形式呈现任何输出时，缩进变得非常重要。然而，处理缩进是棘手的。因为如果你尝试手动处理，它可能不会按照预期的方式工作。为了实现这一点，`String`\
  \ 现在有了 `indent()` 方法。该方法根据参数中提供的值调整字符串的缩进。\n\n缩进根据以下标准应用：\n\n* `i>0`：在字符串开头插入 i\
  \ 个空格。\n* `i=0`：该方法对字符串没有影响。\n* `i<0`：从字符串开头移除 i 个空白字符。\n\n在我们的解决方案 `Listing 4-3`\
  \ 中，第 56 行，我们声明了这样一个字符串：\n\n`String str=\"  Welcome to Java\\nIt's simple\\nIt's\
  \ robust\";`\n\n正如你所观察到的，整个字符串的开头都有空白字符。由于我们还使用了特殊字符 \\n，`indent` 方法内部使用了 `lines()`\
  \ 方法。因此，当我们使用 `str.indent(0)` 时，输出不会移除字符串前的空白字符，尽管它会因为换行符而在三行中打印输出。\n\n\n\n但当使用\
  \ `str.indent(2)` 时，生成的输出显示第一行开头的两个空格被删除，而接下来的两行没有空格，因此没有产生影响。同样，当我们使用 `str.indent(-2)`\
  \ 时，你会观察到在每行的开头都增加了两个空格。\n\n### `transform()`\n\n如方法名所示，此方法用于将给定的字符串转换为其他格式。\n\n\
  方法的语法如下：\n\n```java\npublic <R> R transform(Function<?super String,?extends R> fn)\n\
  ```\n\n方法的类型参数为：\n\n*   `R`: 结果的类型。\n\n方法的参数为：\n\n*   `fn`: 要应用的函数式接口。\n\n该方法返回应用该函数于此\
  \ `String` 的结果。\n\n此方法用于对给定的字符串应用某些函数。提供的函数接受单个字符串，并根据应用在它上面的逻辑产生某些结果。如果在此过程中产生任何异常，则该异常将返回给调用者。\n\
  \n在我们 `Listing 4-3` 解决方案的第 39 行，我们使用了该函数的最简单的形式：\n\n```java\nList<String> strList=str.transform(\n\
  \  str1->{return Arrays.asList(str1.split(\",\"));})\n```\n\n`transform()` 方法接收\
  \ `String str` 并如之前所示，通过应用 `split()` 方法将其转换为 `List`。这将生成 `List` 为 `[\"Java9\", \"\
  Java10\"]`。\n\n我们也可以链用 `transform()` 函数，如我们解决方案的第 44 行所示：\n\n```java\nString str1\
  \ = \"Life is beautiful,\";\nvar strresult = str1.transform(input -> input.concat(\"\
  \ have fun\"))\n                   .transform(String::toUpperCase);\n```\n\n在这里，我们将原始的\
  \ `String str` 传递给第一个 `transform()` 函数并对其拼接了 \"have fun\"。然后，将修改后的字符串 \"Life is\
  \ beautiful, have fun\" 传递给另一个 `transform()` 函数，该函数与现有函数链联并将字符串转换为大写，得到结果为 \"LIFE\
  \ IS BEAUTIFUL, HAVE FUN\"。\n\n### `describeConstable()`\n\n`String` 类在 Java 12\
  \ 中被修改了。现在，它也实现了 `Constable` 和 `ConstantDesc` 接口，如下：\n\n```java\npublic final class\
  \ String extends Object implements Serializable,\n    Comparable<String>, CharSequence,\
  \ Constable, ConstantDesc\n```\n\n由于它实现了 `Constable` 接口，它作为其 API 的一部分重写了 `describeConstable()`\
  \ 方法。\n\n方法的语法如下：\n\n```java\npublic Optional<String> describeConstable()\n```\n\
  \n该方法返回一个 `Optional`，描述 `String` 实例。\n\n为了理解该方法如何工作，我们需要了解 `Constable` 接口。任何 `Constable`\
  \ 类型都是其值被视为常量（final）的。这些值可以存储在常量池中。由于 `String` 是不可变的，`String` 从 Java 12 开始被转换为 `Constable`\
  \ 类型。当 `Constables` 存储在常量池中时，`Constable` 的名描述会附加到上面，可以通过 `describeConstable()` 方法检索。`String`\
  \ 充当它自身的名描述符。\n\n在我们的解决方案 `Listing 4-3` 中，我们在第 23 行调用了该方法：\n\n```java\nOptional<String>\
  \ data=course.describeConstable();\n```\n\n这返回相同的 `String` 值，即 `course`，作为 `Constable`\
  \ 的名描述。\n\n### `resolveConstantDesc()`\n\n我们已经知道 Java 12 中的 `String` 实现了 `ConstantDesc`\
  \ 以及其他一些接口。`resolveConstantDesc()` 方法来自此接口并由 `String` 实现。\n\n方法的语法如下：\n\n```java\n\
  public String resolveConstantDesc(MethodHandles.Lookup lookup)\n```\n\n该方法返回 `String`\
  \ 实例。\n\n此方法将实例解析为 `ConstableDesc`。此调用的结果是应用该方法的同名实例。\n\n在我们的解决方案 `Listing 4-3`\
  \ 中，我们在第 31 行调用了该方法：\n\n```java\nString result=course.resolveConstantDesc(MethodHandles.lookup());\n\
  ```\n\n这返回了如前面的解决方案所示的 `String` 实例。\n\n![](img/40.jpg)\n\n## [NIO 中的更新]\n\nJava\
  \ 12 在文件 API 中引入了一个新特性来检查文件的等等性。现在，你可以调用 `Files.mismatch()` 方法来检查文件是否相等。\n\n## 问题\n\
  \n我们有两个文件 `first.txt` 和 `second.txt`。我们如何使用 Java 12 引入的新 API 检查文件是否相等？\n\n## 解决方案\n\
  \n我们有两个文件 `first.txt` 和 `second.txt`。我们如何使用 Java 12 引入的新 API 检查文件是否相等？\n\n`Listing\
  \ 4-4`, `MismatchDemo.java` 为给定问题提供了如下解决方案：\n\n```java\npackage com.files;\n\nimport\
  \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
  import java.nio.file.Paths;\nimport java.util.stream.Collectors;\n\npublic class\
  \ MismatchDemo {\n  public static void main(String[] args) throws IOException {\n\
  \    // 自动生成的存根\n    System.out.println(\"Working with mismatch()\");\n    Path\
  \ path1 = Paths.get(\"first.txt\");\n    Path path2 = Paths.get(\"second.txt\");\n\
  \    Path path3 = Paths.get(\"third.txt\");\n\n    System.out.println(\"Comparing\
  \ identical:\");\n    long result1 = Files.mismatch(path1, path2);\n    System.out.println(\"\
  Result 1==> \"+result1);\n    if(result1==-1L) {\n      System.out.println(\"first.txt\
  \ and second.txt are matching\");\n    } else {\n      System.out.println(\"first.txt\
  \ and second.txt are not matching\");\n      String content = Files.lines(path3).collect(Collectors.joining());\n\
  \      System.out.println(\"The mismatched character at index \"+result1+\" :==\"\
  +content.charAt((int)result1));\n    }\n  }\n}\n```\n\n输出\n\n如果我们执行 `MismatchDemo.java`，会观察到如图\
  \ 4.3 所示的输出：\n\n![](img/Figure-4.3.jpg)\n\n**图 4.3:** mismatch()\n\n## 解析\n\n在传统的\
  \ Java 中，检查文件相等相当复杂的。你可能需要编写迭代来检查文件的每个字符以识别等性。\n\n这种文件比较通过 Java 12 中的新方法 `mismatch()`\
  \ 变得相对简单。\n\n方法的语法如下：\n\n```java\npublic static long mismatch(Path path1, Path path2)\
  \ throws IOException\n```\n\n方法的参数为：\n\n*   `path1`: 第一个文件的路径。\n*   `path2`: 第二个文件的路径。\n\
  \n该方法返回：\n\n*   文件之间的第一个不匹配位置。\n*   -1L，未发现不匹配。\n\n如果满足以下任何条件，则认为文件是匹配：\n\n*   两个文件提供的路径相同，即使文件不存在。\n\
  *   两个文件的大小相同，且每个文件的每个字节都相互相同。\n\n如果任何条件都不匹配，则文件被认为是不匹配的，该方法将返回以下值之一：\n\n*   文件之间第一个不匹配字节的位置。\n\
  *   如果文件大小不同，则较小文件的字节数。当然，较文件的字节必须与另一个文件中相同位置的字节进行匹配。\n\n\n\n\n在我们 `Listing 4-4`\
  \ 提供的解决方案中，有三个文件 `first.txt`、`second.txt` 和 `third.txt`。`first.txt` 和 `second.txt`\
  \ 文件彼此相同，而 `first.txt` 和 `third.txt` 是不相同的文件。\n\n因此，如果我们调用 `Files.mismatch(first.txt,\
  \ second.txt)`，它将返回 `-1`，如输出所示，因为这两个文件是相同的。\n\n但如果我们调用 `Files.mismatch(first.txt,\
  \ third.txt)`，它将返回 `11`，这是第一个不匹配字节的出现索引号。\n\n![](img/41.jpg)\n\n## CompletableFuture\
  \ 接口的更新\n\n从 Java 9 开始，改进最广泛的接口是 `CompletableFuture`。为了让该接口更加灵活，改进仍在持续。即使在 Java\
  \ 12 中，也额外添加了一些方法，如 `exceptionallyAsync()` 和 `exceptionallyComposeAsync()`。\n\n\
  ## 问题\n\n在处理 `CompletableFuture` 时，处理产生的异常有哪些不同的方法？\n\n## 解决方案\n\n我们将通过不同的解决方案学习处理异常的不同方法。\n\
  \n### 使用没有执行器的 exceptionallyAsyc()\n\n`Listing 4-6, ExceptionallyAsync.java` 展示了在处理\
  \ `CompletableFuture` 时如何使用新方法 `exceptionallyAsyc()`：\n\n```java\n//Listing 4-6\n\
  package com.completablefuture;\n\nimport java.util.concurrent.CompletableFuture;\n\
  public class ExceptionallyAsync {\n    public void doSomeTask(int value) {\n   \
  \     System.out.println(\"Working with exceptionallyAsync without Executor=>\"\
  );\n        int data=١٠٠;\n        CompletableFuture.supplyAsync(() -> {\n     \
  \       System.out.println(\"supplyAsync() executed by:\" +\n                Thread.currentThread().getName());\n\
  \            int ans = data / value;\n            return ans;\n        }).thenAcceptAsync(s\
  \ -> {\n            System.out.println(\"acceptAsync() executed by:\" +\n      \
  \          Thread.currentThread().getName());\n            System.out.println(\"\
  Answer from AcceptAsync()=>\" + s);\n        }).exceptionallyAsync(e -> {\n    \
  \        System.out.println(\"exceptionallyAsync executed by::\" +\n           \
  \     Thread.currentThread().getName());\n            System.out.println(\"Exception\
  \ occured :\" + e.getMessage());\n            return null;\n        });\n    }\n\
  }\n```\n\n在我们的仓库中，`Listing 4-5`, `CompletableFutureDemo.java` 是一个带有 `main()` 函数的应用程序文件。通过传递这样的值调用\
  \ `ExceptionallyAsync.java` 中的 `doSometask()` 方法，如所示，不会发生异常：\n\n```java\nSystem.out.println(\"\
  With Exception ==>\");\nSystem.out.println(\"main() executed by:\" + Thread.currentThread().getName());\n\
  ExceptionallyAsync async=new ExceptionallyAsync();\nasync.doSomeTask(10);\n```\n\
  \n## 输出\n\n当你执行此代码时，将得到如[图 4.4]所示的输出：\n\n![](img/Figure-4.4.jpg)\n\n**图 4.4:** 无执行器的\
  \ exceptionallyAsync 无异常\n\n现在，向同一个方法传递一个产生异常的值如下：\n\n```java\nExceptionallyAsync\
  \ async=new ExceptionallyAsync();\nasync.doSomeTask(0);\n```\n\n当你执行此代码时，将得到如[图\
  \ 4.5]所示的输出：\n\n![](img/Figure-4.5.jpg)\n\n**图 4.5:** 无执行器的 exceptionallyAsync 有异常\n\
  \n## 解释\n\nJava 12 增加了几个方法来处理在异步处理 `CompletableFuture` 时产生的异常。其中一个方法就是 `exceptionallyAsync()`。该方法的语法为：\n\
  \n```java\ndefault CompletionStage<T> exceptionallyAsync(Function<Throwable,? extends\
  \ T> function1)\n```\n\n该方法的参数为：\n* `function1`: 该函数用于计算返回的 `CompletionStage` 的值，前提是该\
  \ `CompletionStage` 已完成。\n\n该方法返回一个新的 `CompletionStage`。\n\n在所提供的解决方案中，你可以观察到当产生异常时，会调用\
  \ `exceptionallyAsync()` 方法。你还可以观察到，它使用了与 `CompletableFuture` 的同一个工作线程。\n\n### 使用带有执行器的\
  \ exceptionallyyc()\n\n`Listing 4-7, ExceptionallyWithExceut.java` 展示了如何向 `exceptionallyAsync()`\
  \ 方法添加执行器：\n\n```java\n//Listing 4-7\npackage com.completablefuture;\n\nimport java.util.concurrent.CompletableFuture;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  public class ExceptionallyWithExecutor {\n    public void doSomeTask(int value)\
  \ {\n        System.out.println(\"Working with exceptionallyAsync with Executor=>\"\
  );\n        ExecutorService executor = Executors.FixedThreadPool(10);\n        int\
  \ data=١٠٠;\n        CompletableFuture.supplyAsync(() -> {\n            System.out.println(\"\
  supplyAsync() executed by:\" +\n                Thread.currentThread().getName());\n\
  \            int ans = data / value;\n            return ans;\n        }).thenAcceptAsync(s\
  \ -> {\n            System.out.println(\"acceptAsync() executed by:\" +\n      \
  \          Thread.currentThread().getName());\n            System.out.println(\"\
  Answer from AcceptAsync()=>\" + s);\n        }).exceptionallyAsync(e -> {\n    \
  \        System.out.println(\"exceptionallyAsync executed by::\" +\n           \
  \     Thread.currentThread().getName());\n            System.out.println(\"Exception\
  \ occured :\" + e.getMessage());\n            return null; }, executor).thenApply(s\
  \ -> {\n            System.out.println(\"thenApply() executed by:\" +\n        \
  \        Thread.currentThread().getName());\n            return 0;\n        }).thenAccept(s\
  \ -> {\n            System.out.println(\"thenAccept() executed by:\" +\n       \
  \         Thread.currentThread().getName());\n            System.out.println(\"\
  Generated answer:\" + s);\n        });\n    }\n}\n```\n\n我们将带有异常测试此代码，因为执行器只有在发生异常时才会工作。因此，我们需要在应用程序类中添加以下行：\n\
  \n```java\nExceptionallyWithExecutor async=new ExceptionallyWithExecutor();\nasync.doSomeTask(0);\n\
  ```\n\n## 输出\n\n如果你执行此代码块，将得到如[图 4.6]所示的输出：\n\n![](img/Figure-4.6.jpg)\n\n**图 4.6:**\
  \ 带有执行器的 exceptionallyAsync 有异常\n\n## 解释\n\n我们已经在早前的演示中见过了 `exceptionallyAsync()`\
  \ 方法。但该方法在发生异常时并不利用任何执行器。我们在列表中的解决方案演示了带有执行器作为参数的 `exceptionallyAsync()` 方法。\n\n\
  该方法的语法如下：\n\n```java\ndefault CompletionStage<T> exceptionallyAsync(Function<Throwable,?\
  \ extends T> fn1, Executor executor1)\n```\n\n该方法的参数为：\n* `fn1`: 该函数用于计算返回的 `CompletionStage`\
  \ 的值，前提是该 `CompletionStage` 异常完成。\n* `executor1`: 该执行器用于异步执行。\n\n该方法返回一个新的 `CompletionStage`。\n\
  \n在我们的解决方案 `Listing 4-7` 中，你可以观察到一旦发生异常，任务将由另一个执行器执行，该执行器在不同的线程中运行。如果没有发生任何异常，方法将正常返回。\n\
  \n最后，我们将使用 `exceptionallyComposeAsync()` 方法，该方法在 `Listing 4-8`, `ExceptionallyComposeAsync.java`\
  \ 中所示：\n\n\n\n\n\n```java\npublic void doSomeTask(int value) {\n  System.out.println(\"\
  Working with exceptionallyComposeAsync()==>\");\n  int data=١٠٠;\n  CompletableFuture<Void>\
  \ task3 =\n      CompletableFuture.supplyAsync(() -> {\n        System.out.println(\"\
  supplyAsync() executed by:\" +\n            Thread.currentThread().getName());\n\
  \      int ans = data / value;\n      return ans;\n  }).exceptionallyComposeAsync(\n\
  \      e -> CompletableFuture.supplyAsync(() -> {\n        System.out.println(\"\
  Exception occured Propagating to\n              supplier with default value!!\"\
  );\n        return data;\n      })).thenAcceptAsync(s -> {\n        System.out.println(\"\
  Generated value:\"+s);\n        return;\n      });\n}\n```\n\n将以下行添加到你的应用程序类中：\n\
  \n```java\nExceptionallyComposeAsync async=new ExceptionallyComposeAsync();\nasync.doSomeTask(0);\n\
  ```\n\n## 输出\n\n执行后，你将得到如图 4.7 所示的输出：\n\n![](img/Figure-4.7.jpg)\n\n**图 4.7：** 带有异常的\
  \ `exceptionallyComposeAsync()`\n\n## 解析\n\nJava 12 中引入的另一种处理 `CompletableFuture`\
  \ 异常的方法是 `exceptionallyComposeAsync()`。该方法有两种重载形式：不带执行器带执行器。\n\n### 形式 1：不带执行器\n\
  \n该方法的语法如下：\n\n```java\ndefault CompletionStage<T> exceptionallyComposeAsync(\n\
  Function<Throwable,? extends CompletionStage<T>> fn)\n```\n\n方法参数：\n\n* `fn`: 当此\
  \ `CompletionStage` 异常地完成时，该函数用于计算返回的 `CompletionStage`。\n\n该方法返回一个新的 `CompletionStage`。\n\
  \n### 形式 2：带执行器\n\n该方法的语法如下：\n\n```java\ndefault CompletionStage<T> exceptionallyComposeAsync(Function<Throwable,\n\
  ? extends CompletionStage<T>> fn, Executor executor)\n```\n\n方法参数：\n\n* `fn`: 当此\
  \ `CompletionStage` 异常地完成时，该函数用于计算返回的 `CompletionStage`。\n* `executor`: 该执行器用于异步执行。\n\
  \n该方法返回一个新的 `CompletionStage`。\n\n在 `Listing 4-8` 提供的解决方案中，我们使用了 `form1`，即不带 `executor`\
  \ 的 `exceptionallyComposeAsync()`。一旦发生异常，它将执行作为 `exceptionallyComposeAsync()` 方法参数提供的提供者函数。如果没有发生异常，该方法将正常执行。\n\
  \n## 紧凑数字格式\n\n为了处理百分比和货币等数据，Java 12 引入了一个新类 `CompactNumberFormat`，它是 `NumberFormat`\
  \ 类的子类。该类用于对数字应用不同的格式。\n\n## 问题\n\n解释如何使用 Java 12 的新类 `CompatNumberFormat`。\n\n\
  ## 解决方案\n\n`Listing 4-9`、`CompactNfDemo.java` 展示了你可以使用的 `CompactNumberFormat` 的不同功能：\n\
  \n```java\n//Listing 4-9\npackage com.numberformat;\nimport java.text.NumberFormat;\n\
  import java.text.ParseException;\nimport java.util.Locale;\npublic class CompactNFDemo\
  \ {\n    public static void main(String args[]) throws ParseException {\n      \
  \  NumberFormat nf = NumberFormat.getCompactNumberInstance(\n            Locale.US,\
  \ NumberFormat.Style.SHORT);\n        nf.setMaximumFractionDigits(2);\n        System.out.println(\"\
  NumberFormat.Style.SHORT:\");\n        System.out.println(\"Result: \" + nf.format(10000));\n\
  \        System.out.println(\"Result: \" + nf.format(20300));\n        nf = NumberFormat.getCompactNumberInstance(\n\
  \            Locale.US, NumberFormat.Style.LONG);\n        System.out.println(\"\
  \\nFormat.Style.LONG:\");\n        System.out.println(\"Result: \" + nf.format(10000));\n\
  \        System.out.println(\"Result: \" + nf.format(20300));\n        nf = NumberFormat.getCompactNumberInstance(\n\
  \            Locale.US, NumberFormat.Style.SHORT);\n        System.out.println(\"\
  \\nConverting the string to SHORT\");\n        System.out.println(nf.parse(\"1K\"\
  ));\n        System.out.println(nf.parse(\"1M\"));\n    }\n}\n```\n\n## 输出\n\n如果你执行上述代码，你将得到如图\
  \ 4.8 所示的输出：\n\n![](img/Figure-4.8.jpg)\n\n**图 4.8：** 紧凑数字格式\n\n## 解析\n\n`CompactNumberFormat`\
  \ 是 `NumberFormat` 类的具体子类。该类用于格式化货币或百分比数字。要使用 `CompactNumberFormat`，你需要使用 `NumberFormat`\
  \ 类的静态方法 `getCompactNumberInstance()`。\n\n该方法的语法如下：\n\n```java\npublic static NumberFormat\
  \ getCompactNumberInstance(Locale, NumberFormat.Style numberformatStyle)\n```\n\n\
  方法参数为：\n\n* `locale`: 生成值的特定特定区域。\n* `numberformatStyle`: 数字的格式化样式。\n\n该方法返回一个用于紧凑数字格式化的\
  \ `NumberFormat` 实例。\n\n如果 `locale` 或 `numberformatStyle` 为空，该方法将抛出 `NullPointerException`。\n\
  \n一旦获取了 `NumberFormat`，你可以使用以下方法格式化数字：\n\n* `format(double)`: 根据提供的格式格式化数字。\n* `parse(String)`:\
  \ 根据提供的格式解析字符串。\n\n在我们的解决方案 `Listing-9` 中，第 12 行设置了如下紧凑格式：\n\n```java\nNumberFormat\
  \ nf = NumberFormat.getCompactNumberInstance(Locale.US, NumberFormat.Style.SHORT);\n\
  ```\n\n这返回一个 Locale.US 的 `NumberFormat`，它以 `NumberFormat.Style.SHORT` 格式格式化。10000\
  \ 将变为 `10K`。\n\n如果你将样式更改为 `NumberFormat.Style.Long`，那么 10000 将格式化为 `10 thousands`。\n\
  \n你也可以观察 `parse()` 方法的使用。我们调用了 `nf.parse('1k')`，它返回 `1000`。\n\n结论\n\n在本章中，我们讨论了\
  \ Java 12 引入的许多新功能。我们从 `Collectors.teeing()` 开始讨论，它将对集合的不同操作合并到一个组。随后，我们探索了 `indent()`、`transform()`\
  \ 等新方法，这些是引入到 `String` API 的。我们还讨论了比较两个文件的新方法 `mismatch()`，它是引入到 `NIO` 的。此外，我们还学习了处理\
  \ `CompletableFuture` 异常的新方法以及如何使用 `CompactNumberFormat` 类格式化数字。\n\n在下一章中，你将学习 Java\
  \ 13 和 Java 14 发布的一些新功能。这两个版本在开发方面没有提供太多的改进，因此我们将合并在一个章节中进行介绍。\n\n\n\n\n\n2. 我们能通过链式调用对已经转换过的\
