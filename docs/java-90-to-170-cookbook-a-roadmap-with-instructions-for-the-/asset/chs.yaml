  \n# Java 9 – 转动轮轮\n\n# 引言](#toc.xhtml_s1a)\n\n当您探索新路径时，旅程总是令人兴奋的，有时充满惊喜。多年来，当我们行走在设计良好且所谓结构化的\
  \ Java 之岸边时，我们很少考虑重构 Java 语言本身。我们对 Java 如何不断更新 API 以创建灵活、可维护和模块化的应用程序感到惊讶。像你我这样的开发者非常乐于使用传统的\
  \ Java 方法编写代码。但随后一切都必须变得更好，需要改进。希腊哲学家赫拉克利特曾说：“*变化是生命中唯一的永恒*。”编程语言也是如此。每种编程语言都在通过一些新功能不断更新自己，以更简单的编程来满足业务需求。以此为目标，你们很多人已经知道\
  \ Java 8 如何通过引入函数式接口、Lambda 等完全改变了你们的编码方式。Java 8 被认为是 JDK 5.0 之后 API 主要变化之一。API\
  \ 也有许多改进，并受到了软件行业的赞誉。但同时，Java API 开发者知道在可靠性、维护性以及提高性能方面还有大量工作要做。记住这一重点，Java 9 于\
  \ 2017 年 9 月 22 日发布。\n\n与 Java 8 类似，Java 9 也认为是 API 更新方面的重大进展之一。它包含超过 150 个新功能，其中也模块系统。模块系统是\
  \ Java 的范式转变，因为它将传统的以包为中心的编程方法转变为模块。此外，还有如 stream、Optional 等更新。\n\n# 结构](#toc.xhtml_s2a)\n\
  \n在本章中，我们将涵盖：\n\n*   私有方法\n*   Stream API\n*   集合更新\n*   Optional 接口\n*   Java REPL\n\
  *   ObjectFilter\n*   Flow API\n\n# 目标](#toc.xhtml_s3a)\n\n学习本单元后，您将学习 Java 9 的不同功能。我们将通过解决问题来学习不同的概念。\n\
  \n# 安装](#toc.xhtml_s4a)\n\n在开始阅读本章之前，请从以下资源下载 Java 开发工具包 9：[`https://www.oracle.com/technologies/javase-downloads.html`](https://www.oracle.com/technologies/javase-downloads.html)。\n\
  \n# 私有方法接口](#toc.xhtml_s5a)\n\nJava 9 引入了一个有趣的特性，您可以在接口中添加私有方法。这使得接口的行为更加健壮且可维护。\n\
  \n## 问题\n\n我们在应用程序中使用接口。我们在接口中使用多个默认方法。所有这些方法都连接到我们想要利用资源。是否有其他方法可以减少跨默认方法出现的重复代码？\n\
  \n## 解决方案\n\n要实现这一点，请按照以下步骤操作：\n\n1.  创建一个名为 `PrivateMethodInterface` 的接口。\n2. \
  \ 添加至少两个默认方法。\n3.  添加一个私有方法，包含两个默认方法共享的公共代码。\n4.  创建一个带有 `static void main` 的应用程序类来调用这些方法。\n\
  \n`Listing 1-1` 显示 `PrivateMethodInterface.java:` 的定义：\n\n```java\n//Listing 1-1\n\
  package com.java9.defaultmethod;\n\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
  \npublic interface PrivateMethodInterface {\n    default void method1() {\n    \
  \    System.out.println(\"In method 1\");\n        try {\n            utilResource();\n\
  \        } catch (IOException e) {\n            // TODO Auto-generated catch block\n\
  \            e.printStackTrace();\n        }\n    }\n\n    default void method2()\
  \ {\n        System.out.println(\"In method 2\");\n        try {\n            utilResource();\n\
  \        } catch (IOException e) {\n            // TODO Auto-generated catch block\n\
  \            e.printStackTrace();\n        }\n    }\n\n    private void utilResource()\
  \ {\n        // common code\n    }\n}\n```\n\n\n\n\n```java\n  } catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n  }\n\
  }\n\n// private method for sharing common resource across\n// default methods\n\
  private void utilResource() throws IOException {\n  System.out.println(\"==Reading\
  \ common resources== \");\n  FileInputStream fis = new FileInputStream(\"data.dat\"\
  );\n  while (fis.read() != -1) {\n    // Some business logic\n  }\n}\n}\n```\n\n\
  `Listing 1-2` 是 `PrivateMethodInterfaceDemo.java`，它是用于调用接口方法的应用类：\n\n```java\n//Listing\
  \ 1-2\npackage com.java9.defaultmethod;\n\npublic class PrivateMethodInterfaceDemo\
  \ implements PrivateMethodInterface {\n  public static void main(String[] args)\
  \ {\n    // TODO Auto-generated method stub\n    PrivateMethodInterfaceDemo demo=\
  \ new PrivateMethodInterfaceDemo();\n    demo.method1();\n    demo.method2();\n\
  \  }\n}\n```\n\n## Output\n\n如果我们执行 `PrivatemethodInterfaceDemo.java`，我们将得到如 图 1.1\
  \ 所示所示输出：\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1：** 私有接口\n\n## Explanation\n\nJava\
  \ 9 引入了可以添加到接口中的私方法。在此之前我们在接口中使用默认方法。但使用默认方法处理公共代码的局限性在于这些方法可以被子类重写，从而更改应用于接口的公共行为。因此，私方法兼顾了这两个目的。它减少了冗余，并使你的公共代码更加安全。\n\
  \n在 `Listing 1-1` 中第 29 行，我们实现了一个私方法 `utilResource()`。这个私方法被两个默认方法 `method1()` 和\
  \ `method2()` 在内部调用。因此，这减少了代码中的数据冗余，同时也增加了可维护性。\n\n我们也可以如下将私方法声明为静态的：\n\n```java\n\
  private static void utilResource(){\n////implementation code\n}\n```\n\n这种方法的优点是它可以被静态默认方法和非静态默认方法调用。\n\
  \n![](img/1.jpg)\n\n## Stream API 更新\n\nStream 是 Java 8 的一项强大功能。它为迭代器提供了一种高效的方式，并通过函数式编程的概念操作集合。Java\
  \ 9 在 Stream 中提供了更多更新，允许你有条件地选择流元素迭代的开始和结束。\n\nStream API 添加了以下新方法：\n\n*   `takeWhile()`\n\
  *   `dropWhile()`\n*   `iterate()`\n\n## Problem\n\n我们有一个产品列表，其类别本质上是“服装（Garments）”。我们希望通过流处理它，并将所有服装产品的价值增加一定百分比。但不确定获取的列表是否只包含服装类产品。是否有其他更高效的方法来检查这一点？\n\
  \n## Solution\n\n可以通过使用 `takeWhile()` 实现。按照列出的步骤操作：\n\n1. 在我们的仓库中创建一个 POJO 类 `Product.java`，如\
  \ `Listing 1-3` 所示。该类包含 `productName`、`productCategory` 和 `productPrice`。代码段如下：\n\
  \n    ```java\n    //Listing 1-3\n    package com.java9.stream;\n\n    public class\
  \ Product{\n      private String productName;\n      private String productCategory;\n\
  \      private double productPrice;\n      …\n    }\n    ```\n\n2. 创建一个类 `TakeWhileDemo.java`，如\
  \ `Listing 1-4` 所示。该类实例化了产品列表。在由列表生成的流上调用 `takeWhile()` 方法，以确保我们只获取“服装”产品：\n\n \
  \   ```java\n    //Listing 1-4\n    package com.java9.stream;\n    import java.util.Arrays;\n\
  \    import java.util.List;\n    public class TakeWhiledemo {\n      public static\
  \ void main(String[] args) {\n        List<Product> productList=Arrays.asList(\n\
  \          new Product(\"Denim Jeans\",\"Garment\",1500),\n          new Product(\"\
  T-Shirt\",\"Garment\",500),\n          new Product(\"Jacket\",\"Garment\",2000),\n\
  \          new Product(\"Shoes\",\"Electronics\",3000)\n        );\n        productList.stream()\n\
  \          .takeWhile(e -> e.productCategory.equals(\"Garment\"))\n          .forEach(System.out.println);\n\
  \      }\n    }\n    ```\n\n\n\n\n2. 如 `Listing 1-6` 所示创建 `DropWhileDemo.java`。该类创建一个客户列表，并在流中丢弃直到\
  \ `customerBalance < 500` 为止的：\n\n```java\n//Listing 1-6\npackage com.java9.stream;\n\
  import java.util.Arrays;\nimport java.util.Iterator;\nimport java.util.List;\nimport\
  \ java.util.function.Predicate;\nimport java.util.stream.Collectors;\npublic class\
  \ DropWhileDemo {\n  public static void main(String[] args) {\n    List<Customer>\
  \ customerList=Arrays.asList(\n      new Customer(101,\"Alex Kerry\",440),\n   \
  \   new Customer(102,\"John Smith\",55),\n      new Customer(103,\"Alan Willis\"\
  ,770),\n      new Customer(104,\"Mark Flex\",667));\n    List<Customer> eligibleCustomers=\n\
  \      customerList.stream()\n      .sorted()\n        .dropWhile(e->e.getCustomerBalance()<500)\n\
  \        .collect(Collectors.toList());\n    Iterator<Customer> itr=eligibleCustomers.iterator();\n\
  \    while(itr.hasNext()) {\n      System.out.println(itr.next());\n    }\n  }\n\
  }\n```\n\n## 输出\n\n如果我们执行 `DropWhileDemo.java`，我们将得到如图 1.3 所示的输出：\n\n![](img/Figure-1.3.jpg)\n\
  \n**图 1.3:** 实现 dropWhile()\n\n## 解析\n\n在这种场景中，你提供了一个未排序的列表。预期是你先对流进行排序，然后应用 `dropWhile()`。否则，`dropWhile()`\
  \ 的结果是不可预测的。\n\n`dropWhile()` 方法被引入是为了某些条件跳过流中的元素。Java 8 在流 API 中提供了一个 `skip()`\
  \ 方法，但该方法不是条件性的。你可以通过 `skip()` 方法中提供的参数来跳过流中的前 ‘n’ 个元素。\n\n该方法的语法如下：\n\n`default\
  \ Stream<T> dropWhile(Predicate<? super T> predicate)`\n\n该方法接受一个 `Predicate` 作为参数，根据该条件跳过元素。\n\
  \n该方法返回元素流，在跳过第一个与参数提供的谓词匹配的元素之后。\n\n在我们的解决方案中，我们在第 19 行对客户列表的流上调用了 `dropWhile()`\
  \ 方法，如 `Listing 1-6` 所示。这将仅生成当前余额等于或大于 500 美元的客户列表。在 `dropWhile()` 中实现的 `Predicate`\
  \ 匹配的元素流操作中被丢弃。\n\n![](img/4.jpg)\n\n## 问题\n\n如何使用 Stream API 中引入的 `iterate()` 方法？\n\
  \n## 解决方案\n\n要实现 `iterate()` 方法，请按照下面的 `Listing 1-7` 所示创建 `IterateDemo.java`：\n\n\
  ```java\n//Listing 1-7\npackage com.java9.stream;\nimport java.util.stream.Stream;\n\
  public class IterateDemo {\n  public static void main(String[] args) {\n    // iterate()\
  \ without Predicate : Java 8\n    System.out.println(\"Java 8 style : iterate()\
  \ without Predicate: ==>\");\n    Stream.iterate(101, i -> i + ١).limit(10)\n  \
  \    .forEach(number->System.out.print(number+\" \"));\n    // iterate() with Predicate\
  \ : Java 9\n    System.out.println(\"\\nJava ٩ style : iterate() with Predicate:\
  \ ==>\");\n    Stream.iterate(101, i -> i <= ١１٠, i -> i + ١)\n      .forEach(number->System.out.print(number+\"\
  \ \"));\n  }\n}\n```\n\n## 输出\n\n如果我们执行 `IterateDemo.java`，我们将得到如 1.4 所示的输出：\n\n\
  ![](img/Figure-1.4.jpg)\n\n**图 1.4:** 实现 iterate()\n\n## 解析\n\n创建序列流有时是应用程序的需求。在之前的版本（Java\
  \ 8 之前），我们使用传统的 for 循环来生成序列，这需要传递到集合中。但从 Java 8 开始，你可以使用 `iterate()` 方法创建序列流。Java\
  \ 8 中的此方法是无限的，我们必须对生成的序列应用 `limit`。Java 9 提供了一个额外的方法，你可以在参数中添加 `Predicate` 来控制序列的生成。\n\
  \n`iterate()` 方法语法如下：\n\n`static <T> Stream<T> iterate(T start, Predicate<? super\
  \ T> hasNext, UnaryOperator<T> step)`\n\n该方法返回：\n- 以 `start` 为起始元素的流，直到第二个参数提供的\
  \ `Predicate` 返回 false 为止。\n- 从 `start` 到结束的迭代由作为第三个参数提供的 `step` 控制。\n- 该方法还包含一个重载形式，你可以跳过第二个参数中的\
  \ `Predicate`。但这将按顺序返回无限流。这种形式的方法在 Java 8 中可用。\n\n在我们的解决方案中，我们在第 10 行使用了 `iterate()`\
  \ 方法：\n\n`Stream.iterate(101, i <= ١１٠, i -> i + ١)`\n`.forEach(number->System.out.print(number+\"\
  \ \"))`\n\n这创建了一个从 101 开始的 Stream。它的值增加 1，直到达到 110。一旦值达到 111，第二个参数中实现的 `Predicate`\
  \ `i<=110` 返回 false，序列终止。\n\n![](img/5.jpg)\n\n## Collection API 更新\n\n从 Java 诞生之初，集合一直是任何版本中不可或缺的一部分。多年来，Collection\
  \ API 中引入了不同的类，它们被用于不同的场景并非常有名。在 Java 9 中，对 Collection API 进行了微调，添加了一些方法，这使得初始化过程变得更简单且易读。\n\
  \n## 问题\n\n我们使用集合 API 已经很长时间了。当涉及到初始化集合时，过程看起来非常冗长。如何利用 Java 9 的特性来简化此创建不可修改集合的流程？\n\
