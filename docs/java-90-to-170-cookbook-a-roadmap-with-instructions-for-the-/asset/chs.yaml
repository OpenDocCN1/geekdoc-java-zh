  \n## 随机数生成器算法的改进\n\n随机数用于许多业务算法中。早期，我们使用旧的`伪随机数生成器`（`PRNG`）类来生成随机数。虽然该 API 功能丰富，但在该\
  \ API 中观察到一些局限性。主要的关注之一是不同类提供的算法不易相互替换。此外，对于配合这些算法使用流的支持不多。为了实现这一点，`Java 17` 为此\
  \ API 了一些额外的接口和类。此外，算法现在经过了修改，使得非常容易相互替换。\n\n## 问题\n\n除了旧的`伪随机数生成器 (PRNG)` 类如 `Random`、`ThreadLocalRandom`\
  \ 和 `SplittableRandom`，还有哪些新方法可以获取随机数？\n\n## 解决方案\n\n`Listing 8.1, DemoRandomGenerator.java`\
  \ 显示了 `RandomGenerator` 接口生成随机数的工作：\n\n```java\n//Listing 8.1\npackage com.java17.random;\n\
  import java.util.random.RandomGenerator ;\n\npublic class DemoRandomGenerator{\n\
  \    public static void main(String[]args){\n        System.out.println(\"Use of\
  \ RandomGenerator interface =>\");\n        RandomGenerator generator = RandomGenerator.of(\"\
  Random\");\n        int randomNumber=generator.nextInt();\n        System.out.println(\"\
  The generated random number :\" +randomNumber);\n    }\n}\n```\n\n## 输出\n\n由于这是一个随机数生成器，对于不同的执行将获得不同的输出。在这种情况下，你可能会得到如图\
  \ 8.1 所示的输出：\n\n![](img/Figure-8.1.jpg)\n\n**图 8.1:** 使用 RandomGenerator 接口\n\n\
  ## 解释\n\nJava 已经有了旧的 PRNG 类，如 `Random`、`ThreadLocalRandom` 和 `SplittableRandom`。然而，我们目前面临着以下困难：\n\
  \n* 很难将 `Random`、`ThreadLocalRandom` 和 `SplittableRandom` 等类相互替换。尽管它们都支持非常相似的方法集，但在实践中即使相互替换也是困难的。\n\
  * `Random`、`ThreadLocalRandom` 和 `SplittableRandom` 类具有如 `nextInt()`、`nextDouble()`\
  \ 和 `ints()` 等方法。\n\n`RandomGenerator` 接口的设计旨在提供一种通用协议。该接口有趣的方法之一是 `of()`。语法为：\n\
  \n`static RandomGenerator of(String)`\n\n该方法返回一个取决于 `name` 的 `RandomGenerator` 实例。支持的算法名称有\
  \ `L1281024`、`L128128`、`L128256`、`L3264`、`L641024`、`L64128`、`L64128`、`L64256`、`Random`、`SplittableRandom`、`ThreadLocalRandom`、`Xoshiro128PlusPlus`\
  \ 和 `Xoshiro256PlusPlus`。\n\n![](img/78.jpg)\n\n## 问题\n\n我们如何从 `RandomGeneratorFactory`\
  \ 获取有关所有可用随机生成器的信息？\n\n## 解决方案\n\n`Listing 8.2` 显示了列出并显示所有 `RandomGeneratorFactory`\
  \ 类型随机生成器的方法：\n\n```java\n//Listing 8.2\npackage com.java17.random;\nimport java.util.random.RandomGenerator;\n\
  import java.util.random.RandomGeneratorFactory ;\nimport java.util.stream.Stream;\n\
  \npublic class DemoRandomGenerator{\n    public static void main(String[]args){\n\
  \        System.out.println(\"List of available generators ==>\");\n        Stream<RandomGeneratorFactory<RandomGenerator>>\
  \ stream= RandomGeneratorFactory.all();\n        stream.forEach(value->System.out.println(value.name()));\n\
  \    }\n}\n```\n\n\n\n\n```java\n+factory.name()).sorted().forEach(System.out::println);\n\
  ```\n\n我们将得到如图 8.2.2 所示的输出：\n\n![](img/Figure-8.2.2.jpg)\n\n**图 8.2.2：** RandomFactoryGenerator\
  \ 工分组\n\n这里 `LXM`、`Legacy`、`Xoroshiro,` 和 `Xoshiro` 是存储生成器的工厂组名称。\n\n## 解析\n\n`RandomGeneratorFactory`\
  \ 是一个用于生成特定算法的多个随机数生成器的工厂类。它提供了通过 `of(String)` 方法来选择随机数生成器算法，该方法接受算法名称作为参数。它还提供了\
  \ `all()` 方法，用于产生包含所有可用 `RandomGeneratorFactory` 的非空 `Stream`。\n\n该方法的语法如下：\n\n\
  ```java\npublic static Stream<RandomGeneratorFactory<RandomGenerator>> all()\n```\n\
  \n该方法返回包含所有可用 `RandomGenerator Factory` 的非空流。\n\n我们在`Listing 8.2` 的第 12 行调用了此方法。通过调用\
  \ `name()` 方法可以获取 `RandomGenerator` 生成器的名称，如第 13 行的代码所示。\n\n![](img/79.jpg)\n\n\
  ## 问题\n\n`RandomGeneratorFactory` 哪些获取 `RandomGenerator` 实例的方法？\n\n## 解决方案\n\n`Listing\
  \ 8-3, DemoRandomGeneratorFromFactory.java` 展示了如何使用 `of()` 方法通过 `SplittableRandom`\
  \ 算法创建随机数：\n\n```java\n//Listing 8-3\npackage com.java17.random;\nimport java.util.random.RandomGenerator\
  \ ;\nimport java.util.random.RandomGeneratorFactory ;\npublic class DemoRandomGeneratorFromFactory{\n\
  \    public static void main(String[]args){\n        System.out.println(\"Generating\
  \ the SplittableRandom Algorithm ==>\");\n        RandomGenerator generator=RandomGeneratorFactory\n\
  \            .of(\"SplittableRandom\").create();\n        System.out.println(\"\
  RandomGenerator Class:\"+generator.getClass());\n        int number = generator.nextInt();\n\
  \        System.out.println(\"Generated Random Number:\"+number);\n    }\n}\n```\n\
  \n## 输出\n\n执行上述程序后，将显示如图 8.3 所示的输出：\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3：** 使用\
  \ of() 进行拆分\n\n![](img/80.jpg)\n\n## 解析\n\n众所周知，`RandomGeneratorFactory` 是一个用于生成特定算法的多个随机数生成器的工厂类。它提供了三种构造\
  \ `RandomGenerator` 实例的方法，取决于后续讨论所需的初始种子类型：\n\n```java\npublic T create(long seed)\n\
  ```\n\n该方法根据所选算法创建 `RandomGenerator` 实例，并提供一个起始的 long 型种子。如果指定的算法不支持 long 种子，则使用无参数形式的\
  \ create，即 `create()`。\n\n方法参数：\n\n* `seed`: long 类型的随机种子值。\n\n该方法返回一个新的 `RandomGenerator`\
  \ 实例。\n\n```java\npublic T create(byte[] seed)\n```\n\n该方法根据所选算法创建 `RandomGenerator`\
  \ 实例，并提供一个起始的 byte[] 种子。如果指定的算法不支持 byte[] 种子，则使用无参数形式的 create，即 `create()`。\n\n\
  方法参数：\n\n* `seed`: `byte[]` 数组随机种子值。\n\n该方法返回一个新的 `RandomGenerator` 实例。\n\n如果 `seed`\
  \ 为空，该方法将抛出 `NullPointerException`。\n\n```java\npublic T create()\n```\n\n该方法根据算法创建\
  \ `RandomGenerator` 实例。\n\n该方法返回一个新的 `RandomGenerator` 实例。\n\n![](img/81.jpg)\n\n\
  ## 问题\n\n如何使用 `RandomGenerator` 在特定范围内选择 PRNG 算法来生成随机整数？\n\n## 解决方案\n\n代码`Listing\
  \ 8-4, DemoGeneratorRange.java` 展示了如何使用随机 PRNG 算法生成 0-15 之间的数字：\n\n```java\n//Listing\
  \ 8-4\npackage com.java17.random;\nimport java.util.random.RandomGenerator;\npublic\
  \ class DemoGeneratorRange {\n    public static void main(String[]args){\n     \
  \   System.out.println(\"Generating random numbers for the given range:\");\n  \
  \      generateNumberWithinRange(15);\n    }\n    private static void generateNumberWithinRange(int\
  \ i) {\n        // TODO Auto-generated stub\n        RandomGenerator generator =\
  \ RandomGenerator.of(\"Random\");\n        int counter = 0;\n        System.out.println(\"\
  Random numbers in the range 0-\"+i);\n        while(counter<=10){\n            int\
  \ number = generator.nextInt(i);\n            System.out.println(\"Generated number:\"\
  +number);\n            counter++;\n        }\n    }\n}\n```\n\n## 输出\n\n由于我们向函数传递了值\
  \ 15，你会观察到生成了 0-15 的随机数，如图 8.4 所示：\n\n![](img/Figure-8.4.jpg)\n\n**图 8.4：** 范围内的随机数\n\
  \n## 解析\n\n`RandomGenerator` 接口拥有 `nextXXX()` 方法，它返回特定类型的伪随机选择值。这里，我们使用了 `nextInt()`\
  \ 方法，它返回 int 值。该方法也有重载形式，如下所示：\n\n```java\ndefault int nextInt(int bound)\n```\n\
  \n该方法返回 0 到指定边界（不包含边界）之间的伪随机选择值。\n\n方法参数：\n\n* `bound`: 边界，必须是正数。\n\n该方法返回 0 到指定边界（不包含边界）之间的伪随机整数。\n\
  \n如果边界不是正数，该方法将抛出 `IllegalArgumentException`。\n\n```java\ndefault int nextInt(int\
  \ origin, int bound)\n```\n\n该方法返回指定起点（包含）到指定边界（不包含）之间的伪随机选择整数值。\n\n方法参数：\n\n* `origin`:\
  \ 可以返回的最小值。\n* `bound`: 要返回的上限边界（不包含）。\n\n如果 `origin` 大于或等于 `bound`，该方法将抛出 `IllegalArgumentException`。\n\
  \n```java\ndefault int nextInt()\n```\n\n该方法返回伪随机选择的整数。它不考虑前面方法声明中的任何起点或边界。\n\n\
  现在让我们讨论如何使用不同的算法生成随机数。请记住，唯一的区别在于选择算法的方式。其余代码与`Listing 8-4` 相同。\n\n情况 1：使用 SplittableRandom\
  \ 算法\n\n```java\nRandomGenerator generator=RandomGeneratorFactory\n    .of(\"SplittableRandom\"\
  ).create();\n```\n\n情况 2：带有种子值的 SplittableRandom 算法\n\n```java\nRandomGenerator\
  \ generator=RandomGeneratorFactory\n    .of(\"SplittableRandom\").create(100);\n\
  ```\n\n![](img/82.jpg)\n\n## 问题\n\n如何使用 `SplittableGenerator` 的 `split()` 方法？\n\n\
  ## 解决方案\n\n`Listing 8-5, DemoRandomGeneratorThreads.java` 展示了 `SplittableGenerator`\
  \ 中 `split()` 方法的工作：\n\n```java\n//Listing 8-5\npackage com.java17.random;\nimport\
  \ java.util.random.RandomGenerator ;\nimport java.util.random.RandomGenerator.SplittableGenerator\
  \ ;\n```\n\n\n\n\n\n```java\nimport java.util.random.RandomGeneratorFactory;\nimport\
  \ java.util.stream.IntStream;\n\npublic class DemoRandomGeneratorThreads {\n   \
  \ public static void main(String[]args) {\n        System.out.println(\"Generating\
  \ the random numbers using\"\n                SplittableGenerator ==>\");\n    \
  \    generateAndSplit(5);\n    }\n\n    private static void generateAndSplit(int\
  \ NUM_PROCESSES) {\n        // TODO Auto-generated method stub\n        RandomGeneratorFactory<SplittableGenerator>\
  \ factory =\n                RandomGeneratorFactory.of(\"L128X1024MixRandom\");\n\
  \        SplittableGenerator splittableGenerator = factory.create();\n        IntStream\
  \ intStream = IntStream.rangeClosed(1, NUM_PROCESSES);\n        intStream.parallel().forEach(p\
  \ -> {\n            RandomGenerator generator = splittableGenerator.split();\n \
  \           System.out.println(p + \"-> Random Number: \" +\n                  \
  \  generator.nextInt(15) + \", \"\n                    + \"Thread name:-\" + Thread.currentThread().getName());\n\
  \        });\n    }\n}\n```\n\n## 输出\n\n当我们执行程序时，会在图 8.5 中显示如下输出：\n\n![](img/Figure-8.5.jpg)\n\
  \n**图 8.5:** 使用 `split()` 方法\n\n## 解释\n\n`SplittableGenerator` 接口旨在为生成伪随机序列的对象提供一种通用协议。该序列可以被拆分为两个对象，其中两个对象都具有相同的协议。这两个对象在统计学上是相互独立的，各自是均匀分布的，并且具有相同的统计特性。实现\
  \ `RandomGenerator.SplittableGenerator` 的对象不是加密学安全的。因此，当应用程序对安全敏感时，应该使用 `SecureRandom`\
  \ 来获取加密学安全的伪随机数生成器。\n\n`SplittableGenerator` 接口提供了 `split()` 方法，用于拆分生成的数字：\n\n该方法的语法如下：\n\
  \n`RandomGenerator.SplittableGenerator split()`\n\n该方法返回一个新的伪随机数生成器，该对象从当前对象拆分出来，并实现了\
  \ `RandomGenerator` 和 `RandomGenerator.SplittableGenerator` 接口。\n\n在我们的程序中，我们使用了：\n\
  \n```java\nIntStream intStream= IntStream.rangeClosed(1, NUM_PROCESSES);\nintStream.parallel().forEach(p\
  \ -> {\n    RandomGenerator generator = splittableGenerator.split();\n    System.out.println(p\
  \ + \"-> Random Number: \" +\n            generator.nextInt(15) + \", \"\n     \
  \       + \"Thread name:-\" + Thread.currentThread().getName());\n});\n```\n\n我们解决方案中的\
  \ `NUM_PROCESS` 参数的值为 5，这意味着我们将生成 5 个随机数。这 5 个数字将来自 0 到 15 之间的范围，因为 `nextInt()`\
  \ 方法接收的参数为 15。\n\n然而，由于我们调用了 `split()` 方法，这 5 个数字将被拆分到不同的子任务中，输出所示。\n\n![](img/83.jpg)\n\
  \n## 问题\n\n`RandomGeneratorFactory` 的特征是什么？如何找到它们？\n\n## 解决方案\n\n可以通过在 `RandomGeneratorFactory`\
  \ 上调用不同的方法找到其特征，如下代码所示，`Listing 8-6, DemoRandomGeneratorFromFactoryCharacteristics.java`：\n\
  \n```java\n//Listing 8-6\npackage com.java17.random;\nimport java.util.random.RandomGenerator;\n\
  import java.util.random.RandomGeneratorFactory;\npublic class DemoRandomGeneratorFactoryCharacteristics\
  \ {\n    public static void main(String[]args) {\n        System.out.println(\"\
  Characteristics of\"\n                RandomGeneratorFactory ==>\");\n        RandomGeneratorFactory<RandomGenerator>\
  \ greatest =\n                RandomGeneratorFactory\n                .all()\n \
  \               .sorted((f, g) -> g.period().compareTo(f.period()))\n          \
  \      .findFirst()\n                .orElse(RandomGeneratorFactory.of(\"Random\"\
  ));\n        System.out.println(\"Name :\"greatest.name());\n        System.out.println(\"\
  Period :\"greatest.period());\n        System.out.println(\"Group :\"greatest.group());\n\
  \        System.out.println(\"Random Number :\"greatest.create().nextInt(15));\n\
  \    }\n}\n```\n\n## 输出\n\n如果你执行上述程序，你将获得 `RandomGeneratorFactory` 不同特征的状态，如图 8.6\
  \ 所示：\n\n![](img/Figure-8.6.jpg)\n\n**图 8.6:** RandomGeneratorFactory 的特征\n\n##\
  \ 解释\n\n`RandomGeneratorFactory` 提供了不同的方法，返回特定实现者的特征。这将有助于在运行时收集有关 `RandomGeneratorFactory`\
  \ 的信息。以下是某些重要方法的列表：\n\n`public String name()`\n该方法返回随机数生成器使用的算法名称。\n\n`public int\
  \ stateBits()`\n该方法返回算法用于维护种子状态的比特数。\n\n`public BigInteger period()`\n该方法返回随机数生成器算法使用的周期。如果周期无法确定，则返回\
  \ `BigInteger.ZERO`。\n\n`public String group()`\n该方法返回一个字符串，指示随机数生成器使用的算法的组名。\n\n\
  # 反序列化过滤\n\n我们知道 Java 9 已经提供了序列化类的安全实现。但当时对反序列化没有限制。Java 17 中的 JEP 415 现在提供了通过对\
  \ `ObjectInputFilter` 应用不同方法来控制反序列化漏洞的机制。\n\n## 问题\n\n如何使用模式为对象编写自定义过滤器？\n\n## 解决方案\n\
  \n让我们编写自定义过滤器，将输入流中的最大字节数设置为 1024，并允许来自 `com.java17.filter` 以及 `java.base` 模块的类，但拒绝所有其他类。\n\
  \n`Listing 8-8` 中的以下代码片段显示了如何应用反序列化过滤器：\n\n```java\nObjectInputStream objectInputStream\
  \ =\n    new ObjectInputStream(inputStream);\nObjectInputFilter filter = ObjectInputFilter.Config.\n\
  \    createFilter(\"maxbytes=1024;com.java17.filter.*;java.base/*;!*\");\nobjectInputStream.setObjectInputFilter(filter);\n\
  try {\n    Object object = objectInputStream.readObject();\n    System.out.println(\"\
  Deserialized Object : + object);\n} catch (ClassNotFoundException e) {\n    e.printStackTrace();\n\
  } catch (IOException e) {\n    e.printStackTrace();\n}\n```\n\n## 输出\n\n此代码块为反序列化过程应用了过滤器。正如代码库所示，我们在\
  \ `com.java17.filter` 中拥有反序列化对象。\n\n但如果我们将过滤器更改为仅反序列化来自 `com.java.17.filter1` 的对象，如下所示：\n\
  \n`ObjectInputFilter filter = ObjectInputFilter.Config.\n    createFilter(\"maxbytes=1024;com.java17.filter1.*;java.base/*;!*\"\
  );`\n\n我们将得到一个异常，如图 8.7 所示：\n\n![](img/Figure-8.7.jpg)\n\n**图 8.7:** 在反序列化中使用过滤器\n\
  \n\n\n\n首先，让我们复习一下什么是序列化。根据 Oracle 给出的定义，“*序列化是将对象状态转换为字节流的过程。这样，字节流就可以还原为对象的副本。*”在\
  \ Java 中，每当我们想要序列化一个对象时，该类本身或其任何一个父类必须实现 `java.io.Serializable` 接口或其子接口，即 `java.io.Externalizable`。Java\
  \ 序列化使用反射来提取我们想要序列化的对象字段的所有数据。如果对象具有私有字段（private）或最终字段（final），它们也会被包含在序列化过程中。当对象拥有一个对象类型的字段时，该对象将进行递归序列化。\n\
  \n另一方面，反序列化是序列化的相反过程。它是将对象的序列化形式转换回对象副本的过程。当反序列化发生时，它创建一个空对象，然后使用反射将数据写入字段中。\n\n\
  反序列化过程存在安全漏洞。当恶意用户试图向系统注入修改过的序列化对象时，就会发生安全漏洞。这最终会导致系统或系统数据的破坏。问题是，我们如何防止这一点呢？防止\
  \ Java 反序列化漏洞的方法是整体防止 Java 序列化。这意味着如果我们的应用程序完全不接受序列化对象，它就无法伤害我们的系统。然而，这不是实用的解决方案。根据\
  \ `JEP2901`，可以决定对允许进入的对象序列化流进行过滤，以提高安全健壮性。\n\n`ObjectInputFilter` 是 JDK 9 中添加的一个功能接口。`Filter`、`CompositeFilter`\
  \ 和 `FilterFactory` 是反序列化过滤的一部分。每个过滤器都会对类和资源进行检查，以确定将状态设置为 `REJECTED`（拒绝）、`ALLOWED`（允许）或\
  \ `UNDECIDED`（未决定）。我们可以拥有多个过滤器，并合并或组合它们的结果。为每个 `ObjectInputStream` 建立和更新过滤器的责任由\
  \ `FilterFactory` 处理。`ObjectInputFilter.Config` 是用于设置和获取 JVM 范围的反序列化过滤器工厂以及静态 JVM\
  \ 范围过滤器的工具类。它允许使用 `createFilter()` 方法从模式字符串创建过滤器。\n\n该方法的语法如下：\n\n```\npublic static\
  \ ObjectInputFilter createFilter(String pattern)\n```\n\n该方法从模式字符串返回一个 `ObjectInputFilter`。这是一个用于对被序列化的对象进行检查的过滤器。如果没有提供模式，则返回\
  \ `null`。\n\n方法参数为：\n\n* `pattern`：要解析的模式字符串；不为 null。\n\n当模式字符串非法、格式错误或无法解析时，方法抛出\
  \ `IllegalArgumentException`。\n\n在应用过滤器模式时，我们必须考虑以下几点：\n\n* 我们可以组合由 `\";\"` 分隔的模式。\n\
  * 我们可以将空格视为模式的一部分。\n* 可以使用 `=` 来设置限制，当限制出现多次时，仅使用最后一个值。\n*   当模式以 `\"!\"` 开头时，如果剩余模式被匹配，则该类被拒绝；否则，如果模式匹配成功，则该类被允许。\n\
  *   当模式包含 `\"/\"` 时，`\"/\"` 之前的非空前缀是模块名。\n*   当模块名与类的模块名匹配时，剩余模式将与类名匹配。如果没有 `\"\
  /\"`，则不比较模块名。\n*   当模式以 `\".*\"` 结尾时，它匹配该包及所有子包中的任何类。\n*   当模式以 `\".*\"` 结尾时，它匹配该包中的任何类（注：原文此处逻辑描述重复，此处按原意翻译）。\n\
  *   当模式以 `*` 结尾时，它匹配任何以该模式为前缀的类。\n*   当模式等于类名时，则匹配。否则，模式不匹配。\n\n生成的过滤器会执行限制检查，然后尝试匹配类（如果有的话）。如果超过了任何限制，过滤器将返回\
  \ `Status.REJECTED`。当类是数组类型时，要匹配的类是元素类型。任意维数的数组都被视为相同的元素类型。\n\n当从左到右处理模式时，如果第一个模式匹配成功，则返回\
  \ `Status.ALLOWED` 或 `Status.REJECTED`。\n\n当未超过限制且没有模式匹配时，类结果被认为是 `Status.UNDECIDED`。\n\
  \n![](img/84.jpg)\n\n## 问题\n\n如何设置过滤器以允许从某些特定包进行反序列化，并拒绝来自其他包的类？\n\n## 解决方案\n\n\
  `Listing 8-9, DemoAllowFilter.java` 展示了如何使用 `allowFilter()` 方法在序列化过程中允许来自特定包的类：\n\
  \n```java\n//Listing 8-9\npackage com.java17.filter;\n\nimport java.io.FileInputStream;\n\
  import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.io.ObjectInputFilter;\n\
  import java.io.ObjectInputStream;\nimport java.io.ObjectOutputStream;\n\npublic\
  \ class DemoAllowFilter {\n    public static void main(String[] args) throws IOException\
  \ {\n        ObjectInputFilter filter = ObjectInputFilter.allowFilter(cl ->\n  \
  \          cl.getPackageName().equals(\"com.java17\"),\n            ObjectInputFilter.Status.REJECTED);\n\
  \n        ObjectInputFilter.Config.setFilterFactory((f1) ->\n            ObjectInputFilter.merge(f1,\
  \ filter));\n\n        serialize(new DemoPojo(), \"demo.txt\");\n        deserialize(\"\
  demo.txt\");\n    }\n\n    public static void serialize(Object value, String filename)\
  \ throws IOException {\n        System.out.println(\"Serialization Initiated\");\n\
  \        FileOutputStream fileOut = new FileOutputStream(filename);\n        ObjectOutputStream\
  \ out = new ObjectOutputStream(fileOut);\n        out.writeObject(value);\n    \
  \    out.close();\n        fileOut.close();\n        System.out.println(\"Serialized!\"\
  );\n    }\n\n    public static void deserialize(String filename) throws IOException,\
  \ ClassNotFoundException {\n        System.out.println(\"Deserialization Initiated\"\
  );\n        FileInputStream fileIn = new FileInputStream(filename);\n        ObjectInputStream\
  \ in = new ObjectInputStream(fileIn);\n        try {\n            Object o = in.readObject();\n\
  \            System.out.println(\"Deserialized!\");\n            if (o instanceof\
  \ DemoPojo) {\n                DemoPojo demo = (DemoPojo) o;\n                System.out.println(demo);\n\
  \            }\n        } catch (java.io.InvalidClassException e) {\n          \
  \  // TODO: handle exception\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\n\n## 输出\n\n当我们执行上述程序时，会显示如图 8.8 所示的输出：\n\n![](img/Figure-8.8.jpg)\n\n**图\
  \ 8.8:** 控制反序列化\n\n观察到对象被序列化并成功反序列化。\n\n## 解释\n\n序列化和反序列化过程是经典的过程，我们已经讨论过了。我们在这里引入的改变是设置过滤器。过滤器将根据某些条件，通过\
  \ `allowFilter()` 方法允许或拒绝反序列化。\n\n\n\n\n```java\nstatic ObjectInputFilter allowFilter(Predicate<Class<?>>\
  \ predicate, ObjectInputFilter.Status otherStatus)\n```\n\n该方法返回一个过滤器，当对类的谓词为真时，该过滤器会返回\
  \ `Status.ALLOWED`。\n\n过滤器可以返回以下任何一种状态：\n\n* `ALLOWED,`，当谓词条件匹配时。\n* `UNDECIDED,`，如果类为\
  \ `null` 且根据非空类的谓词返回了 `otherStatus,`。\n\n该方法的参数为：\n\n* **Predicate**：一个用于测试类是否非空的谓词。\n\
  * `otherStatus`：当谓词返回 `false` 时使用的状态。\n\n在接下来的代码中，我们使用了：\n\n```java\nvar filter1\
  \ = ObjectInputFilter.allowFilter(cl -> cl.getPackageName().contentEquals(\"com.java17.filter\"\
  ))\n```\n\n我们正在设置反序列化以允许所有属于 `com.java17.filter` 包的类。由于此操作，对象被成功地反序列化，如*图 8.8* 所示。\n\
  \n但当我们尝试从属于 `com.java17.filter1` 的 `DemoPojo.class` 执行反序列化时，我们将得到一个异常，如*图 8.9* 所示：\n\
  \n![](img/Figure-8.9.jpg)\n\n**图 8.9：** 被拒绝的过滤器\n\n你可以观察到，对象被序列化了，但在我们尝试反序列化时抛出了异常。\n\
  \n![](img/85.jpg)\n\n## 问题\n\n如何设置标准以停止包中的特定类？如何使用 `rejectFilter()` 方法在反序列化中设置标准？\n\
  \n## 解决方案\n\n在之前的代码中，我们使用了 `allowFilter()` 方法来指定可以反序列化的包（在我们的案例中为 `com.pojo`）。现在，在此基础上，我们可以设置来自同一包的标准，使得\
  \ `Employee` 类不会被反序列化，如下所示：\n\n```java\npublic static void deserialize(String filename)\
  \ throws IOException, ClassNotFoundException {\n    System.out.println(\"---deserialize\"\
  );\n    FileInputStream fileIn = new FileInputStream(filename);\n    ObjectInputStream\
  \ in = new ObjectInputStream(fileIn);\n    ObjectInputFilter empFilter = ObjectInputFilter.rejectFilter(cl\
  \ -> cl.equals(Employee.class), ObjectInputFilter.Status.UNDECIDED);\n    in.setObjectInputFilter(empFilter);\n\
  \    try {\n        Employee employee = (Employee) in.readObject();\n        System.out.println(employee);\n\
  \    } catch (java.io.InvalidClassException e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n## 解释\n\n在这里，我们使用了 `rejectFilter()` 方法来指定我们想要停止反序列化的类。\n\n该方法的签名如下：\n\
  \n```java\nstatic ObjectInputFilter rejectFilter(Predicate<Class<?>> predicate,\
  \ ObjectInputFilter.Status otherStatus)\n```\n\n该方法返回：\n\n* 一个过滤器，当指定的谓词返回真时返回 `Status.REJECTED`。该过滤器可以返回以下列出的任何一种状态：\n\
  \    * 当 `serialClass` 为 `null` 时返回 `UNDECIDED`。\n    * 当对类的谓词为真时返回 `REJECTED`。\n\
  \n否则，该方法返回 `otherStatus`。\n\n该方法的参数为：\n\n* `predicate`：测试类是否非空的谓词。\n* `otherStatus`：当指定的谓词为\
  \ `false` 时使用的状态。\n\n![](img/86.jpg)\n\n## 问题\n\n我们可以防止某些类的反序列化。是否也可以防止 record 类（记录类）的反序列化？如何防止某些\
  \ record 类的反序列化？\n\n## 解决方案\n\nRecord 在连接过滤器时并不是例外。下面的代码片段了如何使用 record 类来过滤反序列化。\n\
  \n在片段中，`com.pojo.records` 包中创建两个 record 类，分别为 `Employee.java` 和 `Student.java`。\n\
  \n创建 `Employee` record 如下：\n\n```java\npackage com.pojo.records;\nimport java.io.Serializable;\n\
  public record Employee(int empId, String empName) implements Serializable { // 此处代码\
  \ }\n```\n\n创建 `Student` record 如下：\n\n```java\npublic record Student(int rollNo,\
  \ String name) implements Serializable { // 此处代码 }\n```\n\n现在，让我们设置过滤器允许来自 `com.pojo.records`\
  \ 包的反序列化，如下：\n\n```java\nvar filter1 = ObjectInputFilter.allowFilter(cl -> cl.getPackageName().contentEquals(\"\
  com.pojo.records\"), ObjectInputFilter.Status.REJECTED);\nObjectInputFilter.Config.setSerialFilter(filter1);\n\
  ObjectInputFilter.Config.setSerialFactory((f1, f2) -> ObjectInputFilter.merge(f2,\
  \ f1));\n```\n\n我们也可以如下所示防止 `Employee` record 类的反序列化：\n\n```java\nFileInputStream\
  \ fileIn = new FileInputStream(filename);\nObjectInputStream in = new ObjectInputStream(fileIn);\n\
  ObjectInputFilter filter = ObjectInputFilter.rejectFilter(cl -> cl.equals(Employee.class),\
  \ ObjectInputFilter.Status.UNDECIDED);\nin.setObjectInputFilter(filter);\n```\n\n\
  ## 解释\n\n我们可以使用与 `allowFilter()` 和 `rejectFilter()` 方法相同的方法来允许或拒绝普通版本的类，只是我们可以以同样方便的方式将这些方法用于\
  \ record 类。\n\n我们已经编写了使用 `rejectFilter()` 方法的代码来防止 `Employee` record 类的反序列化。因此，当我们尝试按照如下\
  \ own 对 `Employee` 类执行反序列化时：\n\n```java\nvar filename1 = \"file1.ser\";\nEmployee\
  \ employee = new Employee(1, \"emp name\");\nserialize(employee, filename1);\ndeserialize(filename1);\n\
  ```\n\n我们将得到 `InvalidClassException` 作为输出。\n\n![](img/87.jpg)\n\n# 修改后的 switch case\n\
  \nJava 17 为 switch case 块提供了额外功能，我们将在接后的章节中通过不同的场景进行讨论。\n\n## 问题\n\n我们可以使用 `if...else`\
  \ 条件来测试多种可能性，并在条件匹配时执行逻辑。如何使用 switch-case 执行相似的条件？\n\n## 解决方案\n\n下面的代码显示了作为 `if..else`\
  \ 块替代的 switch case 方法：\n\n```java\n// 8-10\npackage com.java17.switchcase;\npublic\
  \ class DemoSwitchCase{\n    public static void main(String[]args){\n        System.out.println(testSwitchCase(\"\
  testing if else\"));\n        System.out.println(testSwitchCase(100l));\n    }\n\
  \    public static String testSwitchCase(Object object){\n        String result\
  \ = \"\";\n        switch(object){\n            case Integer i :\n             \
  \   result = result.concat(\"You have passed an integer\");\n                break;\n\
  \            case Long l :\n                result = result.concat(\"You have passed\
  \ a long\");\n                break;\n            case Double d :\n            \
  \    result = result.concat(\"You have passed a double\");\n                break;\n\
  \            case String string:\n                result = result.concat(\"You have\
  \ passed a string\");\n                result=result.toUpperCase();\n          \
  \      break;\n            default :\n                result =\" no match\";\n \
  \       }\n        return result;\n    }\n}\n```\n\n\n\n\n执行前面的代码后，将显示如 *图 8.10*\
  \ 所示的：\n\n![](img/Figure-8.10.jpg)\n\n**图 8.10:** 修改后的 switch\n\n## 解释\n\n我们知道，当使用\
  \ `switch` 块时，选择器表达式的值与 `case` 标签进行比较。当标签与该标签关联的代码匹配时，该代码将被执行。那么，变化在哪里？现在，我们不再有普通的\
  \ `case`，而是有了带有模式的 `case` 标签。执行哪个 `case` 块是由模式匹配而不是相等性检查决定的。在案例中，`object` 的值匹配模式\
  \ `Integer I`、`Long l` 或 `String string`。当我们传递 `object` 的值为 `\"testing if else\"\
  `（即为 `String` 类型）时，与 `String` 类型的 `case` 关联的代码将被执行。\n\n通过在 `switch case` 中使用箭头 `(->)`\
  \ 运算符可以生成类似的解决方案。相同的代码片段如下：\n\n```java\npublic static String testSwitchCase(Object\
  \ object){\n    switch(object){\n      case Integer i -> { return \"You have passed\
  \ an integer:-\"+i; }\n      case Long l ->{ return \"You have passed a long:-\"\
  +l;}\n      case Double d ->{ return \"You have passed a double:-\"+d; }  \n   \
  \   case String string-> { return \"You have passed a string:-\"+string;}}\n   \
  \   default -> { return\" no match\";}\n    }\n}\n```\n\n![](img/88.jpg)\n\n## 问题\n\
  \n在传统编程中，当选择器表达式求值为 `null` 时，`switch` 语句和表达式都会抛出 `NullPointerException`。可以将空测试集成到\
  \ `switch` 中吗？\n\n## 解决方案\n\n`Listing 8-11, DemoSwitchCaseWithNull.java` 显示了从 Java\
  \ 17 开始，我们如何在 `switch case` 中处理 `null` 情况：\n\n```java\n//Listing 8-11\npackage com.java17.switchcase;\n\
  public class DemoSwitchCaseWithNull {\n  public static void main(String[] args)\
  \ {\n    System.out.println(testSwitchCase(null));\n    System.out.println(testSwitchCase(100l));\n\
  \  }\n  public static String testSwitchCase(Object object){\n    switch(object){\n\
  \      case null -> { return \"You didn›t pass anything\"; }\n      case Long l\
  \ ->{ return \"You have passed a long:-\"+l;}\n      case String string-> { return\
  \ \"You have passed a string:-\"+string;}}\n      default -> { return\" no match\"\
  ;}\n    }\n  }\n}\n```\n\n## 输出\n\n在以下输出中，观察到即使我们传递了 `null`，`switch case 也没有抛出 `NullPointerException`。事实上，它被视为一个空情况并被求值。参考\
  \ *图 8.11*：\n\n![](img/Figure-8.11.jpg)\n\n**图 8.11:** 在 switch case 中检查 null\n\n\
  ## 解释\n\n传统上，当选择器表达式求值为 `null` 时，它会抛出 `NullPointerException`，并且必须在 `switch` 外部进行测试：\n\
  \n```java\nif (s == null) {\n    // 在处编写某些代码\n    return;\n}\n```\n\n当 switch 仅支持少数引用类型时，这是非常合理的。但现在，`switch`\
  \ 允许任何类型的选择器表达式。它允许 `case` 标签拥有模式。在这种情况下，你可能会想，为什么仍然需要执行独立的空测试并添加导致错误的模板代码呢？考虑到这一点，`switch`\
  \ 启用了空测试，如前面的片段所示。`switch case` 始终由其标签决定。现在，我们可以将 `null` 作为一个 `case` 标签并执行与其关联的代码。当我们没有标记为\
  \ `null` 的 `case` 时，由于传递给 switch 表达式的是 `null`，switch 将倾向于抛出 `NullPointerException`。我们可能希望同时处理\
  \ `null` 值和所有的 `String` 值，可以如下更新条件：\n\n```java\npublic static String testCase(Object\
  \ object){\n    switch(object){\n      case null, String string -> return \"You\
  \ have passed a string:-\"+string;\n      case Long l -> return \"You have passed\
  \ a long:-\"+l;\n      default -> return \" no match\";\n    }\n}\n```\n\n![](img/89.jpg)\n\
  \n## 问题\n\n可以使用 `switch case` 对继承类进行模式匹配吗？\n\n## 解决方案\n\n我们也可以在继承体系中使用 `switch case`。观察下面的代码片段，它包含了\
  \ `Manager` 实例和 `WageEmployee` 实例的标签。你可以在 `Listing 8-12, DemoSwitchInheritance.java`\
  \ 中查看完整代码：\n\n```java\nprivate static void calculateSalary(Employee e) {\n    //\
  \ TODO 自动生成的存根\n    switch(e){\n      case Manager m :\n        double sal=m.calculateSalary();\n\
  \        if(sal<=3000) {\n          System.out.println(\"Your salary is \"+sal+\"\
  \ chance of revision in salary\");\n        }\n        else{\n          System.out.println(\"\
  Well paid, salary:-\"+sal);\n        }\n        break;\n      case WageEmployee\
  \ wage :\n        sal=wage.calculateSalary();\n        System.out.println(\"Salary\
  \ on hourly basis:-\"+sal);\n        break;\n      case null :\n        System.out.println(\"\
  Can't perform provided\");\n        break;\n      default :\n        System.out.println(\"\
  No Match\");\n    }\n}\n```\n\n\n\n\n在这里，我们为 `Manager` 实例编写了 case。当我们获取其中一个实例时，检查薪水是否大于\
  \ 3000。根据结果，我们执行某些逻辑。\n\n这可以用一种更令人深刻的方式来表达。与其选择 `case` 标签的功能扩展，不如选择扩展模式的语言。在这里，我们可以使用带守的模式（guarded\
  \ pattern），它可以写为 `p && condition`，这允许我们通过条件所表示的任意表达式来细化模式 `p`。这将产生一个 `boolean` 值。\n\
  \n因此，修改后的 case 如下所示：\n\n```java\ncase Manager m && (m.calculateSalary()<=3000)->\
  \ {\n    //一些业务逻辑\n}\n```\n\n在代码中，`e` 的值与模式 `Manager m && (m.calculateSalary() <=\
  \ 3000)` 进行匹配。首先，它匹配类型模式 `Manager m`，当匹配成功时，会求值表达式 `m.calculateSalary() <= 3000`。\n\
  \n同时，细化的模式匹配（即守卫模式）和非细化的模式可以作为同一个 switch 表达式的一部分。在前面的代码段中，我们为 `Manager` 使用了守卫模式，而为\
  \ `WageEmployee` 对象使用了非细化的模式。\n\n![](img/91.jpg)\n\n## 问题\n\n如何在 Java 17 中结合修改后的\
  \ switch 表达式使用密封类（sealed class）？\n\n## 解决方案\n\n让我们从如下声明密封类开始：\n\n```java\nsealed\
  \ class Employee permits WageEmployee, Manager,Developer{ }\n```\n\n现在，让我们如下声明允许类\
  \ `WageEmployee`、`Manager` 和 `Developer` 的定义：\n\n```java\nfinal class WageEmployee\
  \ extends Employee{ }\nnon-sealed class Manager extends Employee { }\nfinal class\
  \ Developer extends Employee{ }\n```\n\n下面的片段显示了如何编写 switch 表达式，该表达式包含了从密封类生成的允许类的\
  \ case 标签：\n\n```java\npublic static void test(Employee e){\n    switch(e){\n  \
  \      case Manager m -> {\n            System.out.println(\"I am manager\");\n\
  \        }\n        case WageEmployee wage ->{\n            System.out.println(\"\
  I am wage employee\");\n        }\n        case Developer develpoer->{\n       \
  \     System.out.println(\"I am a developer\");\n        }\n        case Employee\
  \ employee->{\n            System.out.println(\"I am an employee\");\n        }\n\
  \    }\n}\n```\n\n## 解释\n\n如前面的代码段所示，我们也可以在 switch case 中使用密封类。我们已经知道密封类是什么。在我们的解决方案中，我们声明了一个密封类\
  \ `Employee`。`Employee` 类允许 `WageEmployee`、`Manager` 和 `Developer` 作为它的类型。因此，如解决方案所示，这三个类都是\
  \ Employee 的类型。\n\n当我们想在 switch 中检查类型为 `WageEmployee`、`Manager` 和 `Developer` 的对象时，可以使用密封类类型\
  \ `Employee` 的 switch 表达式。一旦声明了这一点，switch case 的其余部分与我们在早期演示中看到的模式匹配方法类似。\n\n![](img/92.jpg)\n\
  \n## 问题\n\n我们也可以对实现密封接口（sealed interfaces）的类使用 switch case 模式匹配吗？\n\n## 解决方案\n\n\
  我们可以如下所述在 switch case 模式匹配中使用密封接口：\n\n首先，我们如下声明密封接口：\n\n```java\nsealed interface\
  \ MyInterface permits Employee { }\n```\n\n然后，如下编写实现密封接口的密封类：\n\n```java\nsealed\
  \ class Employee implements MyInterface permits WageEmployee, Manager, Developer{\
  \ }\n```\n\n允许类的定义如下所示：\n\n```java\nfinal class WageEmployee extends Employee{ }\n\
  non-sealed class Manager extends Employee { }\nfinal class Developer extends Employee{\
  \ }\n```\n\n一旦所有定义就绪，我们就可以如下所示使用 `switch` 块进行模式匹配：\n\n```java\npublic static void\
  \ test(MyInterface e){\n    switch(e){\n        case Manager m -> {\n          \
  \  System.out.println(\"I am manager\");\n        }\n        case WageEmployee wage\
  \ ->{\n            System.out.println(\"I am wage employee\");\n        }\n    \
  \    case Developer develpoer->{\n            System.out.println(\"I am a developer\"\
  );\n        }\n        case Employee employee->{\n            System.out.println(\"\
  I am an employee\");\n        }\n    }\n}\n```\n\n## 解释\n\n在 `switch` 中使用密封接口类型的方法与\
  \ switch case 使用密封类没有区别。唯一的区别是如前面的解决方案所示，使用了密封接口而不是密封类。\n\n![](img/93.jpg)\n\n#\
  \ 针对密封类的反射 API\n\nJava 17 为反射过程添加了一些功能，可以与密封类配合使用。通过这些，你能够获取密封类的运行时信息。\n\n## 问题\n\
  \n在早期的 Java 版本中，可以通过反射找到有关特定类的元数据。同样，是否可以找到密封类的特征？请演示使用反射 API 查找密封类的特征。\n\n## 解决方案\n\
  \n让我们首先定义反射 API 使用的几个密封类，如下：\n\n```java\nsealed interface MyInterface permits Employee\
  \ { }\nsealed class Employee implements MyInterface permits WageEmployee, Manager,Developer{\
  \ }\nfinal class WageEmployee extends Employee{ }\nsealed class Manager extends\
  \ Employee permits SalesManager{ }\nfinal class Developer extends Employee{ }\n\
  final class SalesManager extends Manager { }\n```\n\n现在，是时候如下代码使用反射 API 查找密封类的特征了：\n\
  \n```java\npublic class TestSealedClassWithReflection{\n    public static void main(String\
  \ []args) throws Exception {\n        Class cls=Class.forName(\"Employee\");\n \
  \       System.out.println(cls.getName());\n        Class [] classes=cls.getPermittedSubclasses()\
  \ ;\n        List<Class>sealedclasses=new ArrayList();\n        for(Class c: classes){\n\
  \            System.out.println(c.getName());\n            if(c.isSealed())\n  \
  \              sealedclasses.add(c);\n        }\n        System.out.println(\"list\
  \ of sealed classes:-\");\n        if(sealedclasses.size()>0){\n            for(Class\
  \ c: sealedclasses){\n                System.out.println(c.getName());\n       \
  \     }\n        }\n    }\n}\n```\n\n## 输出\n\n如果你执行前面的程序，将获得如*图 8.12*所示的所有密封类的特征：\n\
  \n![](img/Figure-8.12.jpg)\n\n**图 8.12:** 使用反射获取密封类的特征\n\n## 解释\n\nJava 17 添加了两个方法来支持密封类的特征描述：\n\
  \n`getPermittedSubclasses()`\n\n该方法的语法如下：\n\n`public Class<?>[] getPermittedSubclasses()`\n\
  \n该方法返回：\n\n*   一个包含 `Class` 对象的数组，这些对象是被允许扩展或实现该类或接口的直接子类或子接口。\n*   如果接口或类不是密封的，它将返回\
  \ null。数组中的元素顺序是不指定的。当此密封类或接口没有允许的子类时，数组的大小为 零。\n\n\n\n\n对于每个指定为此类或接口的“允许的直接子接口”或“子类”的类或接口，`getPermittedSubclasses()`\
  \ 方法会尝试获取 `Class` 对象。所有可以获取且是此类或接口的直接子接口或子类的 `Class` 对象将作为返回数组的元素被添加。当无法获取 `Class`\
  \ 对象时，它们将被静默忽略且不包含在结果数组中。\n\n该方法抛出 `SecurityException`。\n\n### `isSealed()`\n\n\
  方法的语法如下：\n\n```java\npublic boolean isSealed()\n```\n\n该方法返回：\n\n*   当 `Class` 对象表示一个密封类或接口时，返回\
  \ `True`。然而，当此 `Class` 对象类型为基本类型、void 或数组时，方法返回值为 `false`。\n*   当 `Class` 对象类型为基本类型、void\
  \ 或数组时，返回 `False`。\n\n![](img/94.jpg)\n\n# Vector API\n\n`Vector` API 对开发者来说可能是新的，但它对\
  \ Java 来说并不新。事实上，`Vector` API 从 Java 16 版本就已经存在了。然而，它仍然处于孵化器（incubator）模块中。`Vector`\
  \ API 促进了 Java 中的并行编程，从而提高了性能。\n\n## 问题\n\n`Vector` API 是做什么的？它是如何用于提高应用程序性能的？\n\
  \n## 解决方案\n\n为了理解 `Vector` API 如何工作，我们将采用一个经典场景。假设我们有两个包含整数的数组，代表 5 名员工的工资。此外，我们还有另一个存储\
  \ 5 名员工奖金的数组。现在，我们希望在第三个数组中加上每个员工的工资和奖金，以便计算每个员工的总工资。\n\n传统上，我们可以通过简单的数组元素相加来实现：\n\
  \n```java\npublic static int[] calculateSalary(int[] salary, int[] incentives) {\n\
  \    int[] totalSalary = new int[salary.length];\n    for (int i = 0; i < salary.length;\
  \ i++) {\n        totalSalary[i] = salary[i] + incentives[i];\n    }\n    return\
  \ totalSalary;\n}\n```\n\n这段代码段没有任何问题。我们正在将各个数组元素相加存储到第三个数组中。然而，你可以使用 `Vector` API\
  \ 实现相同的效果，如下面的代码段所示：\n\n```java\npublic static int[] calculateSalary(int[] salary,\
  \ int[] incentives,\n                                    VectorSpecies<Integer>\
  \ species) {\n    int[] totalSalary = new int[salary.length];\n    int limit = species.loopBound(salary.length);\n\
  \    var i = 0;\n    for (; i < limit; i += species.length()) {\n        IntVector\
  \ vectorSalary = IntVector.fromArray(species, a, i);\n        IntVector vectorIncentive\
  \ = IntVector.fromArray(species, b, i);\n        IntVector vectorTotalSalary = vectorSalary.add(vectorIncentive);\n\
  \        vectorTotalSalary.intoArray(totalSalary, i);\n    }\n    for (; i < salary.length;\
  \ i++) {\n        totalSalary[i] = salary[i] + incentives[i];\n    }\n    return\
  \ totalSalary;\n}\n```\n\n## 解析\n\n如前，`Vector` API 是在 Java 16 中引入的。尽管它仍然处于孵化模式，但\
  \ Java 正在不断改进算法的性能。`Vector` 是 Java API 开发者这些努力之一的成果。\n\n`Vector` 是为了实现数据并行计算提供的抽象类。在许多情况下，我们需要对多个数据执行同一个操作。此类操作传统上通过**单指令单数据**（`SISD`）方法执行。但向量为多个数据组合提供了通道（lanes），在每个通道中执行的操作会产生标量结果。最后，生成向量结果。这种方法被称为**单指令多数据**（`SIMD`）。\n\
  \n# Vector API 中的术语\n\n*   **向量形状 (Shape of Vector)**：向量的形状定义了容量。它也被称为 `SHAPE`。\n\
  *   **向量物种 (Species of Vector)**：向量的唯一类型。\n\n## Vector 的子类\n\n`Vector` 有六个子类：`ByteVector`、`ShortVector`、`IntVector`、`LongVector`、`FloatVector`\
  \ 和 `DoubleVector`。这些类存在于 `Vector` 类中也存在于 `IntVector` 类中。让我们讨论我们在解决方案中使用的方法：\n\n\
  \n\n\n在本章中，我们讨论了 `Java 17` 中引入的特性。我们学习了如何使用不同的预定义算法来生成随机数。具体来说，我们讨论了 `SplittableRandom`\
  \ 生成器算法，并观察了如何使用 `split()` 方法来拆生成的随机数。我们还学习了通过检查序列化对象的包以及相同类型来控制反序列化过程。我们还对密封类（sealed\
  \ classes）和密封接口（sealed interfaces）调用了反射 API 以获取其运行时信息。最后，我们讨论了 `Vector` API 这一有趣概念，它通过将标量值转换为向量来促进更快的标量处理。\n\
