  md: 'It is no badge of honor or measure of sanity to adapt to a world gone mad.
    Instead of trying to adapt to the world’s insanity, a person who is awakening
    remains open to the world—and open to their wounds—such that a regenerative and
    curative power arises within their own dark depths in response. This healing power
    is the creative spirit. The creative impulse is simultaneously an individual and
    collective phenomenon, which is to say that when any of us becomes a channel for
    this phenomenon, it serves all of us.


    A person''s healing power lies in their willingness to not cling to fixed ideas—of
    who they are or of the world at large—but allow themselves to be shaped and informed
    by new experiences of the world. Then, in turn, they are able to translate and
    craft these experiences into novel “art”—iculations. This involves a receptivity
    to authentically and imaginatively respond to the reciprocal interactions and
    continual collisions—with the inevitable wounding—between ourselves and the world.
    The litmus test for our creativity is our inspired response—or lack thereof—to
    these experiences.


    The hidden treasure, the great revelation that is hidden within our unconscious—also
    referred mythically as “The Treasure Had to Attain”—is the creative spirit itself.
    When that spirit enters, it is a seeminglyhaustible source of inspiration within
    us that issues a stream of revelations like a spring bubbling upward from the
    depths of our unconscious. This living current—our greatest resource—helps us
    to connect with our source. Whenever it manifests, this vital spirit appears as
    a revelation in which we are participating as the instrument through which it
    incarnates in time and space. Our creativity transforms the world so as to find
    our place in it. To quote philosopher Martin Heidegger,"A work of art is something
    new in the world that changes the world to allow itself to exist."


    Our species is desperately in need of the guidance and aid of the boundless creative
    forces latent within the depths of our unconscious to help us find new ways to
    resolve the interwoven aspects of our multiple world crises. Creative expression
    is the zero point at which consciousness and the unconscious momentarily become
    a generative unity. Only at the point in which the stream of unbridled inspiration
    emerges from the darkness of the unconscious and enters the light of consciousness,
    is thus both at once—darkness and light—is the creative spirit made real in'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'time. As Resourceful individuals, it is our job to harness the raw impulses
    arising from the depths of the unconscious into a form that serves our world.
    This “creative point,” to again quote Neumann, is “the buried treasure which is
    the water of life, immortality, fertility, and the after-life all rolled into
    one.”⁵


    It is not the conscious ego that will change the world, but rather, sufficient
    numbers of people who develop a relationship within themselves between their conscious
    and unconscious parts who then connect with one another—deepening each other''s
    inspiration in the process. As long as we remain unaware of the contents of our
    unconscious—therefore not being able to be the conscious architects of our inner
    landscape—our ability to transform the outer world will be limited.


    Given that our widespread crises are the result of a deficiency in human consciousness,
    it becomes obvious that it is only through an expansion of consciousness that
    we will be able to navigate the tight passage before us. Consciousness can evolve
    and develop, however, only where it preserves and cultivates a living connection
    with the creative powers of the unconscious. Just as our view of the world is
    a decisive factor in shaping the unconscious, reciprocally transform our conscious
    perspectives. In its collective archetypal dimension the unconscious contains
    the wisdom and experience of untold ages and could serve as a guide par excellence
    for us during these troubled times.


    Certain individuals gifted with particularly strong intuition the moving currents
    taking place in the collective unconscious and are able to translate these changes
    into communicable language (verbal and/or nonverbal). These original expressions
    can potentially spread rapidly—going viral—and have such powerful transformative
    power because parallel changes have been taking place in the unconscious of other
    people. Contagious in its effects, genuine creative expression emerging at the
    right moment can “virally” spread via the unconscious of our species in ways that
    can ignite latent, creative energy lying dormant in the collective unconscious
    of humanity. This can bring forth hidden possibilities (both within us and in
    the world) into the light of conscious awareness, which is a process that has
    the power to effect real change in the world.'
