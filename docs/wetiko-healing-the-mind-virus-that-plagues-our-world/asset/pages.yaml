  md: '# INTRODUCTION


    # Wetiko in a Nutshell


    A contagious psycho-spiritual disease of the soul


    > Wetiko,” to quote author and environmental activist Derrick Jensen, is “spread
    till it now covers the earth and to a greater or lesser degree infect us all.
    There are no hospitals for this sickness. If we cannot acknowledge it, how can
    we attempt to cure it?”¹


    Before able to treat this sickness that has infected us, we have to snap out of
    our denial, see the disease, acknowledge it, name it, and try to understand how
    it operates so as to ascertain how to deal with it—this is what this book is all
    about.


    Called by many different names throughout history, the spirit of wetiko renders
    every other issue secondary. Wetiko is the overarching umbrella that contains,
    subsumes, informs, and underlies every form of destruction,'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'of ourselves and others, that our species is acting out in our world on every
    scale. If we don’t come to terms with what wetiko is revealing to us, nothing
    else will matter, as there will be no more human species.


    Humanity is facing the most important question in our history—whether human life
    will survive in anything that resembles what we now know it to be. We are answering
    this question with governmental policies and collective behavior that, for the
    most part, only increase our acceleration toward multiple disasters—as we mad
    compete with each other to race off the nearest cliff as quickly as possible.
    We have fallen blind—as if in a hypnotic trance—while a seemingly demonic force
    compels us toward its own self-destruction. To quote eminent theologian David
    Ray Griffin, “Our battle seems to be against ‘flesh and blood’ less than against
    some demonic power to which human civilization is in bondage.”²


    Wetiko follows on my earlier book on the same topic, Dispelling Wetiko. In this
    new book I am attempting to elucidate how wetiko has been creatively represented
    and symbolized, not only in various spiritual wisdom traditions from time memorial,
    but by artists and philosophers throughout the ages. In addition, I am contemplating
    the current goes-on in our world made through a lens that hopefully will help
    the reader see and get a better handle on wetiko.


    In essence I am attempting to translate deep primordial wisdom into a modern-day
    psychological idiom that can be more easily understood and taken “online” in our
    present state of awareness. We are truly at the beginning stages of understanding
    this elusive and heretofore invisible virus of the mind. My books on wetiko are
    in the service of helping us to open our eyes and see this deadly virus of the
    mind before it’s too late.


    # My Personal Experience of Wetiko


    When I first directly encountered wetiko, the experience literally drove me “out
    of my mind” (some people think I haven’t returned, that’s another story) and destroyed
    my entire family. I have written a book about this, Awakened by Darkness: When
    Evil Becomes Your Father. One of the gifts of this nightmarish experience is that
    it has given me an authority to'
