  md: '# About the Author


    ![](img/71c7d39459bfc9f0005cfacf79121251_289_0.png)


    A creative artist, Paul Levy was born in 1956 and grew up in Yonkers, New York.
    In the mid-seventies he attended the State University of New York at Binghamton
    (now called Binghamton University), receiving degrees in both economics and studio
    art. While an undergraduate, he was hired by Princeton University to do research
    in economics.


    In 1981, catalyzed by an intense trauma, Paul had a life-changing awakening in
    which he began to recognize the dreamlike nature of reality. During the first
    year of his spiritual emergence, he was hospitalized a number of times and was
    told he was having a severe psychotic break from reality and (mis)diagnosed as
    having a chemical imbalance. He was informed that he had what was then called
    manic depression (now called bipolar disorder) and that he would have to live
    with his illness for the rest of his life and would need to take medication until
    his dying breath. Little did the doctors realize, however, that he was taking
    part in a spiritual'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'awakening/ shamanic-initiation process, which at times mimicked psychosis but
    in actuality was a spiritual experience of a far different order that was completely
    off the map of the psychiatric system. Fortunately, over time he was able to extricate
    himself from the psychiatric establishment so that he could continue to unfold
    his inner process of awakening.


    After the trauma of his shamanic breakdown/breakthrough, Paul became a certified
    art teacher and taught both painting and drawing for a handful of years to people
    of all ages. Intensely interested in the work of C. G. Jung, in 1988 he became
    the manager of the C. G. Jung Foundation Book Service in New York, as well as
    the advertising manager for the Jungian journal Quadrant.


    In 1990 Paul moved to Portland


    Paul is the author of The Quantum Revelation: A Radical Synthesis of Science and
    Spirituality, Dispelling Wetiko: Breaking the Curse of Evil, Awakened by Darkness:
    When Evil Becomes Your Father, and The Madness of George W. Bush: A Reflection
    of Our Collective Psychosis. A Tibetan Buddhist practitioner for more than thirty
    years, Paul has intimately studied with some of the greatest spiritual masters
    of Tibet and Burma. He was the coordinator of the Portland chapter of the Padmasambhava
    Buddhist Center for over twenty years.


    His website is www.awakeninthedream.com;


    his email is paul@awakeninthedream.com.


    # A Statement from the Front Cover Artist


    For thirty years, I have been drawn to the sacred art I have encountered while
    living throughout Asia. Whether it is the underlying geometry of a'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'Tibetan thangka or the complex iconography of a Taoist temple painting, I have
    often found myself transfixed by images that are meant to be unpacked and decoded.
    So it’s no surprise that I leapt at the chance to work with Paul Levy on the cover
    of Wetiko because it represented a chance to create just such an image with an
    author whose work and wisdom I greatly admire.


    What I could not have anticipated was that our collaboration would evolve into
    a profound dance. There were epiphabies for both of us as we dreamed our way together
    through the journey of bringing this cover into being. Each of its elements describes
    the alchemical process through which the energy of wetiko is transformed into
    creativity and new beginnings.


    For me, the process of “co-dreaming” this cover with Paul was a model of the transformative
    energy of openness and generosity that is not only a hallmark of all the best
    collaborative work, but also an essential part of the approach we all must take
    to effect the collective awakening our world so desperately needs. I am grateful
    to have had this opportunity to contribute to this profound project.


    SETH TAYLOR,


    WWW.SETHTAYLOR.ORSTUDIO.COM'
