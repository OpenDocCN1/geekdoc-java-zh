  md: '# # Foreword


    Larry Dossey, M.D.


    Wouldn’t it be chilling to learn that a “mind-virus” was rapidly spreading throughout
    the world, infecting our own society and manifesting in people close to us—even
    in ourselves? It is a madness that has always plagued humanity, but today we are
    increasingly aware of it and seeing it for what it is. Some call it “evil.” Paul
    Levy calls it “wetiko.”


    Wetiko is a successor to Dispelling Wetiko: Breaking the Curse of Evil, in which
    Paul Levy amplified the Native American concept of a seemingly malignant spirit
    responsible for a fearsome disease of the soul. Paul Levy expands on this indigenous
    understanding with his deep study of Jungian psychology and his knowledge of mythology,
    shamanism, and quantum physics, combined with his original insights and experiences.
    Whether you are new to Paul Levy or have read his other writings, we are now in
    for a reading experience that is both fascinating and unsettling.


    Wetiko, says Levy, is a psychological force within the unconscious mind predisposes
    us toward unwholesome impulses such as the thirst for power and control, and jealousy.
    People who are possessed by wetiko are deeply selfish; they seldom have any interest
    in the well-being of others. Wetiko is a stealth factor. We rarely suspect its
    presence, even when it affects our own behavior.


    Wetiko, as Levy shows, is prefigured in psychiatrist C. G. Jung’s concept of the
    shadow, the unsavory part of our unconscious psyche that we reject in our consciousness.
    Many people recall from the idea that nice, well-behaved citizens could secretly
    harbor “evil” thoughts and impulses, but these forces are present to some degree
    in everyone. Under certain provocations they surface readily. As I write, wetiko
    is having a field day across the globe, visible in headlines and the rapidly'
  merge: -1
  pgno: 11
