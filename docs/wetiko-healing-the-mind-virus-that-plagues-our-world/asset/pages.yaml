  md: 'A new idea is itself an expression of a creative act. Certain ideas can assist
    us in remembering that we had forgotten. A new idea—such as wetiko—can set up
    a chain reaction in people''s minds that can potentially unleash previously imagined
    insight and creativity. As part of their design, mind-expanding ideas are meant
    to be shared with others so to fully activate their nonlocal benefit and blessing.
    These ideas endlessly increase in potency the more they are shared among us. Like
    a key unlocking a door or a charm that breaks a spell, a new symbolic idea can
    unleash the dormant creative spirit imprisoned within us. A revolutionary idea
    has the potential to catalyze revolutions in thinking; a shift in a single idea
    can precipitate a shift into a new epoch.


    The creativity of the unconscious psyche—which is an agency in a state of never-ending
    re-creation and re-formation—continually transforms our experience of reality
    as well as itself. As an artist of life, we are what Neumann refers to as a “bearer
    of the divine miracle,” and endlessly participating in re-creating ourselves,
    revealing ourselves—to ourselves—through the bringing forth of our gifts to the
    world. Only in these acts do we utilize our wholeness. Acting out of wholeness
    is like kryptonite to the seeming superpowers of wetiko. In being creative we
    not only find refuge from the dangers of wetiko, but we discover the true revelation
    that is none other than ourselves. Each new act of creativity brings with it an
    element of self-discovery. We must create in order to know ourselves.


    When human beings are deprived of their freedom and power of expression, however,
    they will unconsciously express themselves in the drive for power. This only feeds
    the will to power of the demonic and destructive shadow, which we see in the world
    today. Being oppressed in our expression, instead of stopping us cold, however,
    can potentially—if we choose—fuel our creative fire, forging in us an “inner necessity”
    to connect with the living primal generative spirit that lives within us. The
    authentic creative spirit—if it’s the real thing—can’t be discouraged or kept
    down for long, then it wouldn''t be creative.


    # Artists as Molders of the Collective Unconscious


    To quote poet Allen Ginsberg, “The warfare of the psychic now. Whoever controls
    the language, the images, controls the race.” Instruments of war in'
