- img_proc: true
  md: 'A few years ago I ran into a friend whom I hadn''t seen for a while. He asked
    me what I had been up to. I answered that I was writing about the collective psychosis
    (wetiko is a collective psychosis) that our species had fallen into. His response
    was telling. He asked me what made me think there was a collective psychosis going
    on. His question left me speechless; I literally didn''t know how to respond.
    What made him think there wasn''t a collective psychosis going on, I wondered.
    Could he give me one piece of evidence? Our collective madness had become so normalized
    that most people—my friend was extremely bright, by the way—didn''t even notice.


    Many of us have become conditioned to thinking that if we were in the middle of
    a collective psychosis it would mean that people were doing all sorts of “crazy”
    things such as running around and screaming, for instance. This ingrained idea,
    however, gets in the way of recognizing the very real collective insanity in which
    all of us—both passively and actively—participating. If we want to emphasize what
    a collective psychosis could look exactly like, it might be a real eye opener
    to realize what exactly is happening right now in our world.


    Where is the voice of the psychiatric establishment in pointing out that our species
    has fallen to a psychic epidemic of massive proportions? In a personal conversation
    I had with the late Harvard psychiatrist John Mack about exactly this point, he
    was of the opinion that the psychiatric community doesn''t see it as their job
    to deal with collective psychoses such as we are today. Such collective psychopathologies
    are simply not on their radar. They focus and specialize exclusively on psychopathologies
    of the (seemingly) separate, discrete, individual human being.¹


    By not recognizing this worldwide, systemic psychological disease that has infected
