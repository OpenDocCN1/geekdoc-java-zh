    of the wetiko virus into the veins of my soul, which, besides making me sick and
    almost driving me permanently crazy, changed the trajectory of my entire life.
    This destined me to commit to healing myself from this ill-fated happenstance
    and to try and understand this seemingly otherworldly force with which I had come
    into contact (or which had contacted me).


    Fortunately, "close encounters of the wetiko-kind" helped me find my voice and
    discover my work—this book being just one example. If I hadn''t connected with
    my creative nature, I would have been in deep trouble and undoubtedly would become
