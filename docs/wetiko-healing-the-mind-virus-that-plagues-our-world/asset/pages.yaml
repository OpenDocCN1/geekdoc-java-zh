  md: 'changing current events that are evoking fear, anger, chaos, and disruption
    to individual and collective life.


    How does this mind-virus spread among us? We are learning the details about how
    we wetiko functions, and what inhibits it. A growing body of evidence from leaders
    in modern science suggests that our conscious and unconscious thoughts and intentions
    are not confined to our individual brains and bodies.¹1 They can operate in the
    world “out there,” distant from our individual selves, beyond the limitations
    and constraints of the here and now. This is the domain of nonlocal mind—mind
    that is boundless, infinite in space and time, and therefore connected and unified
    with all other minds in the past, present, and future. Levy’s account of how wetiko
    operates through the nonlocal field outside the constraints of space and time
    represents a continuation of an articulation of a genuine nonlocal psychology
    of mind.


    Moreover, experiments in distant healing appear to be crucially influenced by
    love, compassion, and deep caring, just as healers throughout history have maintained².
    This is one of the greatest lessons of recent experiments: love and compassion,
    operating through nonlocal mind, can remotely change the state of physical bodies
    in positive, healthful ways.


    But just love. There is a dark side of consciousness—the domain of Jung’s concept
    of the shadow. It is where wetiko lives and operates in our lives, as Paul Levy
    shows.


    Studies in remote influence show also that harm can be extended to living things:
    microbes can be inhibited, cellular function and the activity of biochemical reactions
    can be reduced⁴ Negative, nonlocal intentions resemble the curses, hexes, and
    spells in which all modern cultures (and many modern ones) have believed. In Acknowledging
    this tenebrous of nonlocal mind, these cultures demonstrate a more complex, sophisticated
    understanding of consciousness than we do. We accept a dark side of consciousness
    as simply the ways things are, and they gracefully devise methods of protecting
    themselves. It is cultures such as our own, which deny a negative, nonlocal factor
    of consciousness, that often get blinded by it, as Paul Levy reveals. In any case,
    the capacity of humans to extend harm mentally and nonlocally to living things
    should not be rejected. Instead, this ability can'
