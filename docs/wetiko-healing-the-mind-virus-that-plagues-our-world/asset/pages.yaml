    # ## Creating and Maintaining a Metaperspective


    What I notice in myself is an ever-growing capacity to simultaneously hold a metaperspective
    from which both seemingly opposing points of view are seen as potentially true.
    I am not turning a blind eye or marginalizing either of the two extremes, nor
