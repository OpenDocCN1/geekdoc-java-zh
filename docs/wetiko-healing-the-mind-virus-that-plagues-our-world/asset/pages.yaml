    twovalued, binary logic—which sees things as either true or false—into the more
    expanded four-valued quantum dream logic, which is able to see things as both
    true and false at the same time. I see both the potential nightmare as well as
    the potential lucid dream, to speak. And though it can be painful to hold the
    tension of these opposites, I continually cultivate the ability—like going to
    the gym to build up my psycho-spiritual muscles—to hold both possibilities in
    my mind’s eye and see what spontaneously emerges out of the creative tension this
    elicits in my psyche.


    Consciously holding the tension of the opposites within our own awareness without
    splitting off and identifying with either of the opposites (either optimistic
    or pessimistic) is an intrinsic superhero power that we all possess, knowingly
    or unknowingly. Intensely, holding the tension of the opposites is experienced
    as—and symbolized by—a veritable crucifixion of our limited egoicity. This is
    to be genuinely imitating Christ, and as heled his followers to do, carry our
    own cross?


    Humanity has been hobbled by our narrative biases. Instead of locking down on
    one narrative, the ability to have a comprehensive, omniperspectral view of the
    world—where instead of seeing only a partial view of what might be happening,
    we are more able to see the big picture—is a critically important evolutionary
    capacity that we are each being called to develop.


    If, due to our narrative bias, we identify with one of the opposites as being
    true and the other as being false, however, we dissociate within'
