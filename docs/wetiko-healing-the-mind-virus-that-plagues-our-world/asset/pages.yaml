  md: '# APPENDIX


    # The Four Ignoble Blindnesses of Wetiko


    # A Play on the Four Noble Truths of Buddhism


    +   1. You are blind to your own blindness, or doubly blind. You’re blind and
    you do not know you are blind and in fact imagine that you can see clearly and
    come to believe that you can see more clearly than those who are clear-sighted.
    You then become unaware of what it is to be sighted, as you have no reference
    point for comparison.


    +   2. You are blind to the very existence of wetiko and its malign effects within
    your mind. You do not see how you are unwittingly colluding with wetiko’s pernicious
    effects and thereby you are unaware of how you are having negative or ill effects
    upon others and the world.


    +   3. You are blind to your own light, which is to say that wetiko blocks you
    from seeing both your own darkness as well as your own light. You are blinded
    and incapable of seeing your true nature and identify instead with a false imposter
    of who you truly are.


    +   4. You are blind to the fact that wetiko is a revelation. Being blind to your
    blindness, being blind to the existence of wetiko, and being blind to your own
    light necessarily results in being blind to wetiko’s revelatory function. Wetiko
    is potentially revealing your own creative genius, power, and agency. Recognizing
    that wetiko is a revelation is to realize that wetiko contains encoded within
    it not just its own medicine and cure, but a blessing, for it is helping you to
    wake up to the dreamlike nature of the universe and to remember who you actually
    are.'
