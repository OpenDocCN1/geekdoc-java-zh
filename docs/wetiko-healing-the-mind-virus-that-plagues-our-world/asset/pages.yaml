  md: '# René Girard’s Take on Scapegoating and the Shadow


    French-American philosopher and cultural anthropologist René Girard, author of
    the classic book The Scapegoat, is of the opinion that the origin of human culture
    is to be discovered in what he calls “the founding murder."1 This is no other
    than the psychological process of scapegoating/shadow projecting. Interestingly,
    Christ—who is the prototypical innocent scapegoat (“the lamb of God”) who bears
    the sins of the world)—refers to the devil as a “murderer from the beginning.”
    This founding murder, what Girard calls “the secret of Satan,” must be concealed
    at all costs, which is to say it must remain unconscious.² This founding murder
    is wetoko. This murder is ahistorical and atemporal that it regenerates itself
    always and everywhere—informing human culture (or lack thereof)—seen through.


    This founding murder and the lie that it covers imprisons humanity in a never-ending,
    self-replicating feedback loop which humanity must kill, and continue to kill,
    to not know that we are killing. To quote Girard, “This lie is a double homicide,
    since its consequence is always another homicide to cover up the old one.\³ The
    result is a heart anesthethetized and numb to feeling, which enables us to be
    party to atrocities that we would normally never or even be able to imagine. Speaking
    about the founding murder, Girard says, “It is an inexhaustible fund of falsehood
    that infiltrates every domain and structures everything in its own image, with
    such success that the truth cannot get in.\⁴ To the extent we are asleep to this
    deeper process, we'
  merge: -1
