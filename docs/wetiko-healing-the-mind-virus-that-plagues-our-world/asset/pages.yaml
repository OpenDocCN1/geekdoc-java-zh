    Consider: If mind is genuinely nonlocal, this implies that individual minds cannot
    be completely separated and isolated from one another, and are joined in some
    sense even as they simultaneously experience themselves individually. In dimension,
    minds that are nonlocal come together to form a single unitary mind. This recognition
