- img_proc: true
  md: 'become, in Jung’s words, “an unconscious instrument of the wholesale murderer
    in man.”⁵ When we are unconscious of the evil within us, it will insinuate itself
    into the surroundings, where it will work its black magic via the outside world.


    Scapegoating/shadowing projecting is itself a violent act of self-mutilation.
    The origin of scapegoating involves a severing and disowning of a darker part
    of ourselves, which we then—in a second act of (energetic) violence—project out
    of ourselves onto another “other.” We react violently when we encounter an embodied
    reflection of our shadow in the outer world, wanting to destroy it, for it reminds
    us of something dark within ourselves we want to terminate. This act of external
    violence is a dramatization of the original inner act of “splitting” (a violent
    affair in and of itself) off from our own darkness. In other words, our inner
    process of violence towards our own darkness (that is itself inspired by the very
    darkness we are dissociating from) is being dreamed up and acted out on the canvas
    of the external world with real-world consequences.


    The price pay for believing in “otherness” is that, in order to justify this belief,
    we mutilate the universe, rendering the seamless wholeness of reality into two
    seemingly separate domains (the false dichotomy of self and other). Reciprocally
    co-arising with otherness is fear. If there is an other, there is fear. A question
    naturally arises: Is otherness more threatening in its difference (in its alien
    quality) or is it more menacing in its sameness (that it’s reflecting something
    back within ourselves)?


    # The Shadow’s Appetite for Violence


    Girard felt that humanity was in slavery to violence. He was of the opinion that
    the scapegoat mechanism has a hold on humanity and is society’s best collective
    defense against coming to terms with its own violence. To quote Girard, “The old
    pattern of against another gives way to the unified antagonism of all against
    one.”⁶ Girard felt that human culture is based on the deeper archetypal process
    of conjuring away the pent-up psychological violence intrinsic to humanity’s shadow
    by endlessly projecting it onto new victims. This is to say that human culture
    is organized around a violent—and thus disengenuous—disavowal of human violence.'
