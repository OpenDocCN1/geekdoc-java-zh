    # A Native American Idea


    The way I have interpreted the concept of wetiko is my own, insofar as I have
    taken a First Nations idea and developed it in and for a Western mind and cultural
    context. I feel that I am merely a translator, trying to create a bridge so that
    their profound insights might benefit the neurotic Western psyche. I''ve never
    lived in the environments where the Native American conception of wetiko arose:
    pre-Columbian woodlands and plains, wild waters full of creatures and their spirit
    forms, vast herds of game galloping across windblown grasses. I am a child of
    cities, machines, and Western civilization. As such, I experienced wetiko in a
    typical dysfunctional American family and a practically insane capitalist society.
    This Western symbolic logic and intellectual formulations bring new paradigm,
    to construct from another culture.


    I do so with humility, respect, and the recognition from one point of view I could
    be seen to appropriating a concept without knowing its existential basis and phenomenology.
