    Neumann writes, is typically venerated “as the hidden treasure that in humble
    conceals [and, I might add, simultaneously reveals] a fragment of the godhead.”¹


    # Listening to the Voice Inside


    Wetiko is a “daemonic” energy, which is to say it is a transpersonal energy—beyond
    the mere personality—that can take over a person (or a group of people). The “daemon”
    can be envisioned as an indwelling force that can’t be nailed down because of
    its nomadic nature, taking up residence in those who are receptive to its call.
    Etymologically speaking, the inner meaning of the word daemon is our guiding spirit,
    inner voice, internal teacher, muse, spiritual ally, wish-ful genius, genius.
    The daemon connects us with our calling, and helps us find our vocation, our mission
    in life, why we are here on the planet.


    The original meaning of the word *vocation* is to do with being addressed by a
    voice. Listening to our inner voice—that Jung calls the voice of the inner man”—we
    are at the same time given the sacred responsibility to outwardly speak in the
    world the voice that is uniquely ours to speak—our true authentic voice. The paradox
    is that speaking the voice that is our own, this voice does not belong to us.
    Rather it is the voice of all humanity that resonates in us. The truly creative
    person, be they poet, writer, dancer, or painter, for instance, is courageous
    Jung, “voicing aloud what others only dream.”² In other words, a creative person
    gives living form to something that exists in the formlessly and seemingly substantial.


    The demonic is the creative in *statu nascendi*, “not yet realized,” or “made
    real” by a conscious ego. This is to say that hidden encoded within the darkness
    of wetiko is our unexplored creativity. When the creativity that naturally bubbles
    forth within us is suppressed, however, it feeds the poisonous aspect of wetiko.
    The malady that our species is collectively'
