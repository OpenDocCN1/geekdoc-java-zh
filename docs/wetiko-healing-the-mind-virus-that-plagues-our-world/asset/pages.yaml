  md: 'the hands of generals are extremely dangerous. In the same way, nothing is
    more dangerous and potentially world-transforming than implements of creative
    expression in the hands of artists. They are the molders of the unconscious psychic
    life of humanity, the mythmakers of their age. The artists—and we are all artists—who
    are the healers of the world.


    Rather than letting our perceptions be managed and manipulated by the powers that
    be and their propaganda organs, as sovereign beings connect with our own perceptions
    and create our own unique and authentic experience of the world and a refreshed
    experience of ourselves. What a radical—and truly liberating—idea!


    Healing wetiko entails each of us becoming an empiricist—there is no getting around
