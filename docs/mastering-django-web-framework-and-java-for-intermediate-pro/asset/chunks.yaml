    # **Chapter 4: Control Flow and Decision Making**


    Control flow and decision-making structures are essential elements of any programming
    language that enable the execution of code in a controlled and conditional manner.
    In this chapter, we will explore control flow statements like conditionals and
    loops in both Java and Python, along with practical examples to demonstrate their
    usage.


    ## Section 1: Conditional Statements


    ### If-Else Statement in Java


    The if-else statement is used to make decisions in Java based on the evaluation
    of a condition. If the condition is true, the code block inside the if statement
    is executed; otherwise, the code block inside the else statement is executed.


    **Java Example:**


    ```java


    int age = 25;


    if (age >= 18) {


    System.out.println("You are an adult.");


    } else {


    System.out.println("You are a minor.");


    }


    ```


    ### If-Else Statement in Python


    Python also uses the if-else statement for decision-making, but it does not use
    curly braces. Instead, it relies on indentation to define code blocks.


    **Python Example:**


    ```python


    age = 25


    if age >= 18:


    print("You are an adult.")


    else:


    print("You are a minor.")


    ```


    ### Nested If-Else Statements


    Both Java and Python allow the nesting of if-else statements, enabling more complex
    decision-making based on multiple conditions.


    **Java Example:**


    ```java


    int score = 85;


    char grade;


    if (score >= 90) {


    grade = ''A'';


    } else if (score >= 80) {


    grade = ''B'';


    } else if (score >= 70) {


    grade = ''C'';


    } else {


    grade = ''D'';


    }


    System.out.println("Grade: " + grade);


    ```


    **Python Example:**


    ```python


    score = 85


    grade = None


    if score >= 90:


    grade = ''A''


    elif score >= 80:


    grade = ''B''


    elif score >= 70:


    grade = ''C''


    else:


    grade = ''D''


    print("Grade:", grade)


    ```


    ## Section 2: Switch Statements (Java Only)


    Java includes a switch statement that allows multiple branches of code based on
    the value of an expression. Each case represents a specific value that is compared
    to the expression, and the corresponding block of code is executed if there is
    a match. However, Python does not have a built-in switch statement.


    **Java Example:**


    ```java


    int dayOfWeek = 3;


    String dayName;


    switch (dayOfWeek) {


    case 1:


    dayName = "Sunday";


    break;


    case 2:


    dayName = "Monday";


    break;


    case 3:


    dayName = "Tuesday";


    break;


    // and so on...


    default:


    dayName = "Invalid day";


