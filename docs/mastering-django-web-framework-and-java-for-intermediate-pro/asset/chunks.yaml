    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Register</button>


    </form>


    ```


    In this example, the `register` view uses the `UserCreationForm` to handle user
    registration. If the form is valid, the user is logged in and redirected to the
    homepage.


    ### User Login


    User login is another critical aspect of user authentication. Django simplifies
    this process with the built-in `LoginView`:


    ```python


    # accounts/urls.py


    from django.contrib.auth.views import LoginView


    urlpatterns = [


    path(''login/'', LoginView.as_view(), name=''login''),


    # ...


    ]


    ```


    In your template, you can use the `{% url %}` template tag to create a login link:


    ```html


    <!-- base.html -->


    {% if user.is_authenticated %}


    <a href="{% url ''logout'' %}">Logout</a>


    {% else %}


    <a href="{% url ''login'' %}">Login</a>


    {% endif %}


    ```


    ### User Logout


    To log users out of your application, Django provides the `LogoutView`:


    ```python


    # accounts/urls.py


    from django.contrib.auth.views import LogoutView


    urlpatterns = [


    # ...


    path(''logout/'', LogoutView.as_view(), name=''logout''),


    ]


    ```


    Similarly, you can use the `{% url %}` template tag to create a logout link:


    ```html


    <!-- base.html -->


    {% if user.is_authenticated %}


    <a href="{% url ''logout'' %}">Logout</a>


    {% else %}


    <a href="{% url ''login'' %}">Login</a>


    {% endif %}


    ```


    ### Securing Views


    To restrict access to certain views based on whether a user is authenticated,
    you can use the `@login_required` decorator:


    ```python


    # accounts/views.py


    from django.contrib.auth.decorators import login_required


    @login_required


    def profile(request):


    # ... view logic ...


    ```


    With this decorator, only authenticated users will be able to access the `profile`
    view.


    ### User Profile


    User profiles often contain additional information about users. To achieve this,
    you can create a `Profile` model that has a one-to-one relationship with the built-in
    `User` model:


    ```python


    # accounts/models.py


    from django.db import models


    from django.contrib.auth.models import User


    class Profile(models.Model):


    user = models.OneToOneField(User, on_delete=models.CASCADE)


    # ... additional fields ...


    def __str__(self):


    return self.user.username


    ```


    ### Customizing Authentication


    Django''s authentication system is highly customizable. You can extend the built-in
    `User` model or create your own authentication backend for unique requirements.
    Additionally, you can use third-party packages like `django-allauth` or `django-registration`
    to streamline user authentication workflows.


    ### Conclusion


    In this chapter, we''ve explored the world of user authentication in Django. We''ve
    covered user registration, login, logout, securing views, and creating user profiles.
    You now have the knowledge to implement secure user authentication in your Django
    applications, ensuring that user data is protected and user experiences are personalized.


    With a solid understanding of user authentication, you''re well-equipped to create
    user-centric web applications. In Chapter 7, we''ll delve into another crucial
    aspect of web development: handling forms and user input. Stay tuned to learn
    how to create and process forms effectively in your Django applications.


    # ## Chapter 7: Handling Forms and User Input


    As we continue our journey through the world of Django, we arrive at a critical
    aspect of web development: handling forms and user input. Forms play a central
    role in collecting data from users, such as user registrations, search queries,
    feedback submissions, and more. In this chapter, we''ll explore how to create,
    validate, and process forms effectively in your Django applications. By the end
    of this chapter, you''ll be equipped with the knowledge to build interactive and
    user-friendly forms that enhance the user experience.


    ### Understanding Django Forms


    Django provides a powerful form handling framework that simplifies the process
    of creating and processing forms. A form in Django is represented by a Python
    class that defines the fields and validation rules for the form. This class can
    generate HTML forms for display in templates and handle data validation and submission.


    To get started with forms, you need to import the `forms` module from `django`:


    ```python


    from django import forms


    ```


    ### Creating a Simple Form


    Let''s begin by creating a simple form for user feedback. Assume we want users
    to provide their name, email, and a feedback message. Here''s how you can define
    the form using the `forms` module:


    ```python


    class FeedbackForm(forms.Form):


    name = forms.CharField(label=''Your Name'', max_length=100)


    email = forms.EmailField(label=''Your Email'')


    message = forms.CharField(label=''Feedback'', widget=forms.Textarea)


    ```


    In this example, the `FeedbackForm` class defines three fields: `name`, `email`,
    and `message`. Each field is represented by a specific form field type, such as
    `CharField` for text input and `EmailField` for email input. The `widget=forms.Textarea`
    argument is used to specify that the `message` field should be displayed as a
    text area in the HTML form.


    ### Displaying the Form in a Template


    To display the form in a template, you can use the `{% csrf_token %}` template
    tag to include the Cross-Site Request Forgery (CSRF) token and the `{{ form }}`
    template variable to render the form fields:


    ```html


    <!-- feedback.html -->


    <h2>Provide Feedback</h2>


    <form method="post">


    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Submit</button>


    </form>


    ```


    In this example, the `{{ form.as_p }}` template tag renders the form fields as
    paragraphs.


    ### Validating Form Data


    Django forms handle data validation automatically. When a user submits a form,
    Django''s form handling system validates the data based on the defined fields
    and their validation rules.


    In your view, you can create an instance of the form and pass the request data
    to it for validation:


    ```python


    def feedback(request):


    if request.method == ''POST'':


    form = FeedbackForm(request.POST)


    if form.is_valid():


    # Process the valid data


    else:


    form = FeedbackForm()


    return render(request, ''feedback.html'', {''form'': form})


    ```


    If the form data is valid, the `form.is_valid()` method returns `True`, and you
    can proceed to process the data.


    ### Customizing Form Validation


    You can add custom validation methods to your form class by defining methods with
    names starting with `clean_`. These methods can perform field-specific validation
    or cross-field validation:


    ```python


    class FeedbackForm(forms.Form):


    # ...


    def clean_email(self):


    email = self.cleaned_data.get(''email'')


    if not email.endswith(''@example.com''):


    raise forms.ValidationError(''Only example.com email addresses are allowed.'')


    return email


    def clean(self):


    cleaned_data = super().clean()


    name = cleaned_data.get(''name'')


    message = cleaned_data.get(''message'')


    if name and message and name.lower() in message.lower():


    raise forms.ValidationError("Name should not appear in the feedback message.")


    ```


