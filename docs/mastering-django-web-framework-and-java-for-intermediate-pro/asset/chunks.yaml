- fmt: "\nTo allow users to register for your application, you can create a registration\
    \ form that collects their desired username, email, and password. Django provides\
    \ the `UserCreationForm` that handles user registration out of the box.\n\nLet's\
    \ create a registration view and template:\n\n```python\n# accounts/views.py\n\
    \nfrom django.contrib.auth.forms import UserCreationForm\nfrom django.contrib.auth\
    \ import login\nfrom django.shortcuts import render, redirect\n\ndef register(request):\n\
    \    if request.method == 'POST':\n        form = UserCreationForm(request.POST)\n\
    \        if form.is_valid():\n            user = form.save()\n            login(request,\
    \ user)\n            return redirect('home')  # Redirect to the homepage\n   \
    \ else:\n        form = UserCreationForm()\n    return render(request, 'registration/register.html',\
    \ {'form': form})\n```\n\n```html\n<!-- registration/register.html -->\n<h2>Register</h2>\n\
    <form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <button\
    \ type=\"submit\">Register</button>\n</form>\n```\n\n```In this example, the `register`\
    \ view uses the `UserCreationForm` to handle user registration. If the form is\
    \ valid, the user is logged in and redirected to the homepage.\n\n### User Login\n\
    \nUser login is another critical aspect of user authentication. Django simplifies\
    \ this process with the built-in `LoginView`:\n\n```python\n# accounts/urls.py\n\
    from django.contrib.auth.views import LoginView\nurlpatterns = [\n    path('login/',\
    \ LoginView.as_view(), name='login'),\n    # ...\n]\n```\n\nIn your template,\
    \ you can use the `{% url %}` template tag to create a login link:\n\n```html\n\
    <!-- base.html -->\n{% if user.is_authenticated %}\n    <a href=\"{% url 'logout'\
    \ %}\">Logout</a>\n{% else %}\n    <a href=\"{% url 'login' %}\">Login</a>\n{%\
    \ endif %}\n```\n\n### User Logout\n\nTo log users out of your application, Django\
    \ provides the `LogoutView`:\n\n```python\n# accounts/urls.py\nfrom django.contrib.auth.views\
    \ import LogoutView\nurlpatterns = [\n    # ...\n    path('logout/', LogoutView.as_view(),\
    \ name='logout'),\n]\n```\n\nSimilarly, you can use the `{% url %}` template tag\
    \ to create a logout link:\n\n```html\n<!-- base.html -->\n{% if user.is_authenticated\
    \ %}\n    <a href=\"{% url 'logout' %}\">Logout</a>\n{% else %}\n    <a href=\"\
    {% url 'login' %}\">Login</a>\n{% endif %}\n```\n\n### Securing Views\n\nTo restrict\
    \ access to certain views based on whether a user is authenticated, you can use\
    \ the `@login_required` decorator:\n\n```python\n# accounts/views.py\nfrom django.contrib.auth.decorators\
    \ import login_required\n\n@login_required\ndef profile(request):\n    # ... view\
    \ logic ...\n```\n\nWith this decorator, only authenticated users will be able\
    \ to access the `profile` view.\n\n### User Profile\n\nUser profiles often contain\
    \ additional information about users. To achieve this, you can create a `Profile`\
    \ model that has a one-to-one relationship with the built-in `User` model:\n\n\
    ```python\n# accounts/models.py\nfrom django.db import models\nfrom django.contrib.auth.models\
    \ import User\n\nclass Profile(models.Model):\n    user = models.OneToOneField(User,\
    \ on_delete=models.CASCADE)\n    # ... additional fields ...\n    def __str__(self):\n\
    \        return self.user.username\n```\n\n### Customizing Authentication\n\n\
    Django's authentication system is highly customizable. You can extend the built-in\
    \ `User` model or create your own authentication backend for unique requirements.\
    \ Additionally, you can use third-party packages like `django-allauth` or `django-registration`\
    \ to streamline user authentication workflows.\n\n### Conclusion\n\nIn this chapter,\
    \ we've explored the world of user authentication in Django. We've covered user\
    \ registration, login, logout, securing views, and creating user profiles. You\
    \ now have the knowledge to implement secure user authentication in your Django\
    \ applications, ensuring that user data is protected and user experiences are\
    \ personalized.\n\nWith a solid understanding of user authentication, you're well-equipped\
    \ to create user-centric web applications. In Chapter 7, we'll delve into another\
    \ crucial aspect of web development: handling forms and user input. Stay tuned\
    \ to learn how to create and process forms effectively in your Django applications.\n\
    \n# Chapter 7: Handling Forms and User Input\n\nAs we continue our journey through\
    \ the world of Django, we arrive at a critical aspect of web development: handling\
    \ forms and user input. Forms play a central role in collecting data from users,\
    \ such as user registrations, search queries, feedback submissions, and more.\
    \ In this chapter, we'll explore how to create, validate, and process forms effectively\
    \ in your Django applications. By the end of this chapter, you'll be equipped\
    \ with the knowledge to build interactive and user-friendly forms that enhance\
    \ the user experience.\n\n### Understanding Django Forms\n\nDjango provides a\
    \ powerful form handling framework that simplifies the process of creating and\
    \ processing forms. A form in Django is represented by a Python class that defines\
    \ the fields and validation rules for the form. This class can generate HTML forms\
    \ for display in templates and handle data validation and submission.\n\nTo get\
    \ started with forms, you need to import the `forms` module from `django`:\n\n\
    ```python\nfrom django import forms\n```\n\n### Creating a Simple Form\n\nLet's\
    \ begin by creating a simple form for user feedback. Assume we want users to provide\
    \ their name, email, and a feedback message. Here's how you can define the form\
    \ using the `forms` module:\n\n```python\nclass FeedbackForm(forms.Form):\n  \
    \  name = forms.CharField(label='Your Name', max_length=100)\n    email = forms.EmailField(label='Your\
    \ Email')\n    message = forms.CharField(label='Feedback', widget=forms.Textarea)\n\
    ```\n\nIn this example, the `FeedbackForm` class defines three fields: `name`,\
    \ `email`, and `message`. Each field is represented by a specific form type, such\
    \ as `CharField` and `EmailField`. The `widget=forms.Textarea` argument is used\
    \ to specify that the `message` field should be displayed as a text area in the\
    \ HTML form.\n\n### Displaying the Form in a Template\n\nTo display the form in\
    \ a template, you can use the `{% csrf_token %}` template tag to include the Cross-Site\
    \ Request Forgery (CSRF) token and the `{{ form }}` template variable to render\
    \ the fields:\n\n```html\n<!-- feedback.html -->\n<h2>Provide Feedback</h2>\n\
    <form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <button\
    \ type=\"submit\">Submit</button>\n</form>\n```\n\nIn this example, the `{{ form.as_p\
    \ }}` template tag renders the form fields as paragraphs.\n\n### Validating Form\
    \ Data\n\nDjango forms handle data automatically. When a user submits a form,\
    \ Django's form handling system validates the data based on the defined fields\
    \ and validation rules.\n\nIn your view, you can create an instance of the form\
    \ and pass the request data to it for validation:\n\n```python\ndef feedback(request):\n\
    \    if request.method == 'POST':\n        form = FeedbackForm(request.POST)\n\
    \        if form.is_valid():\n            # Process the valid data\n    else:\n\
    \        form = FeedbackForm()\n    return render(request, 'feedback.html', {'form':\
    \ form})\n```\n\nIf the form data is valid, the `form.is_valid()` method returns\
    \ `True`, and you can proceed to process the data.\n\n### Customizing Form Validation\n\
    \nYou can add custom validation methods to your form class by defining methods\
    \ with names starting with `clean_`. These methods can perform field-specific\
    \ validation or cross-field validation:\n\n```python\nclass FeedbackForm(forms.Form):\n\
    \    # ...\n    def clean_email(self):\n        email = self.cleaned_data.get('email')\n\
    \        if not email.endswith('@example.com'):\n            raise forms.ValidationError('Only\
    \ example.com email addresses are allowed.')\n        return email\n\n    def\
    \ clean(self):\n        cleaned_data = super().clean()\n        name = cleaned_data.get('name')\n\
    \        message = cleaned_data.get('message')\n        if name and message and\
    \ name.lower() in message.lower():\n            raise forms.ValidationError(\"\
    Name should not appear in the feedback message.\")\n```\n\n### Working with Model\
    \ Forms\n"
