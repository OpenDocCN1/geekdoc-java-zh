    # **Chapter 9: Java Streams API**


    The Java Streams API is a powerful addition to the Java Standard Library introduced
    in Java 8\. It provides a functional approach to process collections of data efficiently
    and concisely. Streams allow developers to perform operations on data in a declarative
    manner, making the code more expressive and readable. In this chapter, we will
    explore the Java Streams API, its key features, and demonstrate how to use it
    effectively with practical examples.


    ## Section 1: Introduction to Java Streams


    ### What are Streams?


    Streams in Java are a sequence of elements that can be processed in a functional
    and declarative way. They provide a way to perform operations on collections of
    data such as lists, arrays, and maps. Streams allow for parallel processing, which
    can lead to improved performance in multi-core environments.


    ### Stream Characteristics


    Streams in Java have the following characteristics:


    1\. **Functional Approach:** Streams use a functional approach for data processing,
    allowing operations to be expressed in a more concise and readable manner.


    2\. **Laziness:** Streams are lazy, meaning that intermediate operations are not
    executed until a terminal operation is called. This allows for more efficient
    processing, as only the required data is processed.


    3\. **Parallel Processing:** Streams can be processed in parallel, taking advantage
    of multi-core processors and potentially speeding up operations on large datasets.


    ## Section 2: Creating Streams


    ### Creating Streams from Collections


    Streams can be created from various data sources, including collections like lists
    and sets.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Creating a stream from a list


    Stream<String> namesStream = names.stream();


    namesStream.forEach(System.out::println);


    }


    }


    ```


    ### Generating Streams


    Streams can be generated using static methods like `Stream.of()` or `Stream.iterate()`.


    **Example:**


    ```java


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    // Creating a stream using Stream.of()


    Stream<Integer> numbersStream = Stream.of(1, 2, 3, 4, 5);


    numbersStream.forEach(System.out::println);


    // Creating a stream using Stream.iterate()


    Stream<Integer> evenNumbersStream = Stream.iterate(0, n -> n + 2).limit(5);


    evenNumbersStream.forEach(System.out::println);


    }


    }


    ```


    ## Section 3: Intermediate Operations


    ### Filtering Elements


    Streams support filtering elements based on a specified condition using the `filter()`
    method.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Filtering names starting with ''A''


    Stream<String> filteredNames = names.stream().filter(name -> name.startsWith("A"));


    filteredNames.forEach(System.out::println);


    }


    }


    ```


    ### Mapping Elements


    Mapping transforms each element in a stream to another object using the `map()`
    method.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Mapping names to their lengths


    Stream<Integer> nameLengths = names.stream().map(String::length);


    nameLengths.forEach(System.out::println);


    }


    }


    ```


    ### Sorting Elements


    Streams can be sorted using the `sorted()` method.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Sorting names alphabetically


    Stream<String> sortedNames = names.stream().sorted();


    sortedNames.forEach(System.out::println);


    }


    }


    ```


    ## Section 4: Terminal Operations


    ### Collecting Elements


    Terminal operations collect the elements of a stream into a collection using the
    `collect()` method.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Collectors;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Collecting names starting with ''A'' into a new list


    List<String> filteredNames = names.stream()


    .filter(name -> name.startsWith("A"))


    .collect(Collectors.toList());


    System.out.println(filteredNames);


    }


    }


    ```


    ### Reducing Elements


    The `reduce()` method performs a reduction on the elements of a stream.


    **Example:**


    ```java


    import java.util.List;


    import java.util.Optional;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<Integer> numbers = List.of(1, 2, 3, 4, 5);


    // Reducing numbers to their sum


    Optional<Integer> sum = numbers.stream().reduce(Integer::sum);


    sum.ifPresent(System.out::println);


    }


    }


    ```


    ### Counting Elements


    The `count()` method returns the number of elements in the stream.


    **Example:**


    ```java


    import java.util.List;


    import java.util.stream.Stream;


    public class StreamExample {


    public static void main(String[] args) {


    List<String> names = List.of("Alice", "Bob", "Charlie", "David");


    // Counting the number of names


    long count = names.stream().count();


    System.out.println("Number of names: " + count);


    }


    }


    ```


