    # ## Chapter 15: Building a Real-World Django Web Application


    In this final chapter, we''ll put everything we''ve learned into practice by building
    a real-world Django web application from start to finish. We''ll create a simplified
    version of a blog platform that allows users to write, publish, and manage their
    own blog posts. Throughout this chapter, we''ll demonstrate how to apply the concepts
    we''ve covered in previous chapters to create a fully functional web application.


    ### Project Setup


    #### Creating a Django Project


    Start by creating a new Django project and a new app within the project:


    ```bash


    django-admin startproject blog_platform


    cd blog_platform


    python manage.py startapp blog


    ```


    #### Defining Models


    Define the models for our blog application to represent blog posts and their authors:


    ```python


    # blog/models.py


    from django.db import models


    class Author(models.Model):


    name = models.CharField(max_length=100)


    bio = models.TextField()


    class Post(models.Model):


    title = models.CharField(max_length=200)


    content = models.TextField()


    pub_date = models.DateTimeField(auto_now_add=True)


    author = models.ForeignKey(Author, on_delete=models.CASCADE)


    ```


    #### Setting Up the Database


    Create and apply migrations to set up the database schema:


    ```bash


    python manage.py makemigrations


    python manage.py migrate


    ```


    ### Creating Views and Templates


    #### Writing Views


    Define views to display a list of blog posts and individual post details:


    ```python


    # blog/views.py


    from django.shortcuts import render, get_object_or_404


    from .models import Post


    def post_list(request):


    posts = Post.objects.all()


    return render(request, ''blog/post_list.html'', {''posts'': posts})


    def post_detail(request, post_id):


    post = get_object_or_404(Post, pk=post_id)


    return render(request, ''blog/post_detail.html'', {''post'': post})


    ```


    #### Creating Templates


    Create HTML templates to render the list of posts and individual post details:


    ```html


    <!-- blog/templates/blog/post_list.html -->


    {% extends ''base.html'' %}


    {% block content %}


    <h1>Blog Posts</h1>


    <ul>


    {% for post in posts %}


    <li><a href="{% url ''post_detail'' post.id %}">{{ post.title }}</a></li>


    {% endfor %}


    </ul>


    {% endblock %}


    ```


    ```html


    <!-- blog/templates/blog/post_detail.html -->


    {% extends ''base.html'' %}


    {% block content %}


    <h1>{{ post.title }}</h1>


    <p>{{ post.content }}</p>


    <p>Published on: {{ post.pub_date }}</p>


    <p>Author: {{ post.author.name }}</p>


    {% endblock %}


    ```


    ### Implementing User Authentication


    #### User Registration and Login


    Integrate Django''s built-in authentication system for user registration and login
    functionality:


    ```python


    # blog/views.py


    from django.contrib.auth.forms import UserCreationForm


    from django.contrib.auth import login, authenticate


    from django.shortcuts import render, redirect


    def register(request):


    if request.method == ''POST'':


    form = UserCreationForm(request.POST)


    if form.is_valid():


    user = form.save()


    login(request, user)


    return redirect(''post_list'')


    else:


    form = UserCreationForm()


    return render(request, ''registration/register.html'', {''form'': form})


    ```


    #### Creating Registration Template


    Create a registration template to display the registration form:


    ```html


    <!-- registration/register.html -->


    {% extends ''base.html'' %}


    {% block content %}


    <h1>Register</h1>


    <form method="post">


    {% csrf_token %}


    {{ form.as_p }}


    <button type="submit">Register</button>


    </form>


    {% endblock %}


    ```


    ### Final Touches


    #### Creating URLs


    Define URL patterns for the views in the `urls.py` file:


    ```python


    # blog/urls.py


    from django.urls import path


    from . import views


    urlpatterns = [


    path('''', views.post_list, name=''post_list''),


    path(''post/<int:post_id>/'', views.post_detail, name=''post_detail''),


    path(''register/'', views.register, name=''register''),


    ]


    ```


    #### Adding URLs to Project


    Include the app''s URLs in the project''s `urls.py`:


    ```python


    # blog_platform/urls.py


    from django.contrib import admin


    from django.urls import include, path


    urlpatterns = [


    path(''admin/'', admin.site.urls),


    path('''', include(''blog.urls'')),


    ]


    ```


    #### Running the Development Server


    Start the development server:


    ```bash


    python manage.py runserver


    ```


    Visit `http://127.0.0.1:8000/` in your web browser to see the list of blog posts.
    You can register a new user by visiting `http://127.0.0.1:8000/register/` and
    then log in to create, view, and manage your blog posts.


