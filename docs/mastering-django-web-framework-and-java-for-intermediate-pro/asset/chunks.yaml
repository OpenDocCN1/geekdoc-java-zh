- fmt: "\nDatabase connectivity is a crucial aspect of modern software applications,\
    \ allowing programs to interact with relational databases to store, retrieve,\
    \ and manipulate data. Java Database Connectivity (JDBC) is a standard Java API\
    \ that enables Java applications to connect to and interact with various relational\
    \ databases. In this chapter, we will explore the fundamentals of JDBC, including\
    \ establishing database connections, executing queries, and performing database\
    \ operations, with practical examples to demonstrate how to work with databases\
    \ in Java applications.\n\n## Section 1: Introduction to JDBC\n\n### What is JDBC?\n\
    \nJDBC stands for `Java Database Connectivity`, and it is a standard Java API\
    \ that provides a set of classes and interfaces for connecting to relational databases\
    \ and executing SQL queries.\n\n### JDBC Architecture\n\nJDBC follows a layered\
    \ architecture, including the following components:\n\n1. `JDBC API`: Contains\
    \ interfaces and classes to interact with databases.\n2. `JDBC Driver Manager`:\
    \ Manages database drivers and handles connections.\n3. `JDBC Driver`: Implements\
    \ the low-level communication with specific databases.\n\n## Section 2: Connecting\
    \ to the Database\n\n### Loading JDBC Driver\n\nBefore connecting to a database,\
    \ you need to load the appropriate JDBC driver using `Class.forName()`.\n\n**Example:**\n\
    \n```java\nimport java.sql.*;\n\npublic class DBConnectionExample {\n    public\
    \ static void main(String[] args) {\n        try {\n            Class.forName(\"\
    com.mysql.jdbc.Driver\");\n            System.out.println(\"JDBC Driver loaded\
    \ successfully!\");\n        } catch (ClassNotFoundException e) {\n          \
    \  System.out.println(\"Failed to load JDBC Driver: \" + e.getMessage());\n  \
    \      }\n    }\n}\n```\n\n### Establishing Database Connection\n\nAfter loading\
    \ the JDBC driver, you can establish a connection to the database using `DriverManager.getConnection()`.\n\
    \n**Example:**\n\n```java\nimport java.sql.*;\n\npublic class DBConnectionExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            System.out.println(\"Database connection established\
    \ successfully!\");\n        } catch (SQLException e) {\n            System.out.println(\"\
    Failed to establish database connection: \" + e.getMessage());\n        }\n  \
    \  }\n}\n```\n\n## Section 3: Executing SQL Queries\n\n### Executing Statements\n\
    \nOnce the database connection is established, you can create a `Statement` object\
    \ to execute SQL queries.\n\n**Example:**\n\n```java\nimport java.sql.*;\n\npublic\
    \ class SQLQueryExample {\n    public static void main(String[] args) {\n    \
    \    String url = \"jdbc:mysql://localhost:3306/mydatabase\";\n        String\
    \ username = \"myusername\";\n        String password = \"mypassword\";\n    \
    \    try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"SELECT * FROM employees\";\n            ResultSet\
    \ resultSet = statement.executeQuery(sql);\n            while (resultSet.next())\
    \ {\n                String name = resultSet.getString(\"name\");\n          \
    \      int age = resultSet.getInt(\"age\");\n                System.out.println(\"\
    Name: \" + name + \", Age: \" + age);\n            }\n            statement.close();\n\
    \            connection.close();\n        } catch (SQLException e) {\n       \
    \     System.out.println(\"Error executing SQL query: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n### Prepared Statements\n\nPrepared statements are\
    \ a more efficient way to execute SQL queries, especially for parameterized queries.\n\
    \n**Example:**\n\n```java\nimport java.sql.*;\n\npublic class PreparedStatementExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            String sql = \"INSERT INTO employees (name,\
    \ age) VALUES (?, ?)\";\n            PreparedStatement statement = connection.prepareStatement(sql);\n\
    \            statement.setString(1, \"John\");\n            statement.setInt(2,\
    \ 30);\n            statement.executeUpdate();\n            statement.setString(1,\
    \ \"Alice\");\n            statement.setInt(2, 28);\n            statement.executeUpdate();\n\
    \            statement.close();\n            connection.close();\n        } catch\
    \ (SQLException e) {\n            System.out.println(\"Error executing prepared\
    \ statement: \" + e.getMessage());\n        }\n    }\n}\n```\n\n## Section 4:\
    \ Database Operations\n\n### Inserting Data\n\nTo insert data into a database,\
    \ you can use an SQL `INSERT` statement.\n\n**Example:**\n\n```java\nimport java.sql.*;\n\
    \npublic class InsertDataExample {\n    public static void main(String[] args)\
    \ {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\";\n      \
    \  String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"INSERT INTO employees (name, age) VALUES ('John',\
    \ 30)\";\n            int rowsAffected = statement.executeUpdate(sql);\n     \
    \       System.out.println(rowsAffected + \" row(s) inserted.\");\n          \
    \  statement.close();\n            connection.close();\n        } catch (SQLException\
    \ e) {\n            System.out.println(\"Error inserting data: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n### Updating Data\n\nTo update existing data in a\
    \ database, you can use an SQL `UPDATE` statement.\n\n**Example:**\n\n```java\n\
    import java.sql.*;\n\npublic class UpdateDataExample {\n    public static void\
