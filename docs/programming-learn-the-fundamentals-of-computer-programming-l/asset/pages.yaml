  md: '# Chapter 1: An Introduction To Programming


    Before you start learning a particular language, you should have a proper understanding
    of programming. The absolute basics of programming are a must. It will help you
    in understanding the fundamentals of any language better.


    # Binary Numbers


    Computers and nearly all computer based devices use the binary system in their
    functioning. This system comprises of only two numbers, 1 and 0. Each of them
    is referred to as a bit. All computer programs can be simplified down to this
    system. In fact, the binary system has a key role in how computers store information
    and data of all kinds.


    At the fundamental level, computers simply switch from 1 to 0 for all of their
    functions, no matter how simple or complex. Any data, including text and images,
    are stored in the computer in the form of a series of 1s and 0s. You see, computers
    are electrical circuits. In a circuit, an electrical current either flows in a
    specific line or it does. Therefore, the state can be defined as either a 1 or
    a 0. In other words, it is a binary situation.


    Once you understand this concept, you will realize why the binary system is such
    basic computers. In all computer programs and situations, a problem can always
    be simplified down to a binary choice. As such, all computers process information
    using the binary system.


    # What is a Program?


    Let us first analyze the function of a computer. Its primary function is to solve
    a problem. Now, how does it solve it? It does so with the help of a program. Computer
    programs are sequences of instructions which perform a specific task when they
    are executed by the computer.


    No matter what the computer is, it will remain completely useless it has the right
    set of programs. If you are reading this book on a computer-based device, it is
    only because the device has a program that allows it to do so.


    # What is a Programming Language?


    As the name suggests, a programming language is a specialized language that is
    used for programming.'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'referred to a native programming language that all computers have and understand.
    Unfortunately, machine code can be extremely difficult for people to understand.
    Among other things, machine code is nearly always expressed in the binary system.
    Moreover, the machine code is unique to specific computer architecture. As a result,
    it is possible for two computers to use two variants of machine code.


    Therefore, you need some way to communicate with the computers. This is why programming
    languages exist. They act as an interface between people and the computer. With
    them, programs can be expressed in languages which can be understood by people
    easily. At the same time, the language will be the common to different computer
    architectures. More importantly, the programs can be translated to machine code
    easily.


    To make sure that this happens, a computer has to interpret or compile the program
    written in a programming language so that the program is executed. You need to
    understand compilation and interpretation with respect to computer programming.


    For a compiled program, a compiler has to be used so that the program can be translated
    into machine code for the computer to use. However, the source code will not be
    run by the computer in the case of an interpreted program. Instead, an interpreter
    reads each line of the program as it is running and modifies it into the machine
    code. Once modified, the computer executes that line of the program.


    Programming languages can use either one of these approaches or both. Each of
    them has its own advantages when it comes to programming and software development.
    Generally, compiled programs can take longer to develop, but they can run faster.
    After all, the computer will execute a program that has already been translated.
    Interpreted programs take longer to run as they need to be translated every time
    they are executed. However, they can be written faster as the languages are generally
    simpler. At the same time, the entire program will not be compiled after every
    modification or bug test.


    # Tips for Programming


    When you are programming, you will be learning a lot of new things. As such, things
    can get confusing very quickly unless you can keep a track. In many cases, learners
    even forget a few basic principles of programming. Remember these details to ensure
    that you don''t feel that you are getting in way over your head.


    +   * When you are trying to develop a program, you should ensure that it can
    fulfill the need for which it is being created in the first place.

    * You should also make sure that your program can be easily used by other people.'
  merge: -1
