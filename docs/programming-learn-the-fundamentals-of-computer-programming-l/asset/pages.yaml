  md: '# Data Types


    There are kinds of data types in Java, primitive and non-primitive. Primitive
    data types are predefined and provided by Java. Some examples of these in Java
    include Boolean, char, int, long, short and float. On the other hand, non-primitive
    data types are not defined by Java. Instead, they will be created by you, the
    programmer. They refer to a memory location which is why they are sometimes known
    as reference variables. String and array are some of the non-primitive data types.


    # Variables


    In Java, there are three kinds of variables that you can use for your programs.
    The type depends on how you declare the variable. Local variables are those which
    are declared inside a method. On the other hand, instance variables are defined
    outside the method but inside the class. Static variables are simply those variables
    that are declared with the static keyword, and they cannot be local variables.
    You will learn about these uses when you start programming in Java in earnest.


    As other programming languages, you need to declare a variable before it can be
    used. The basic syntax for declaring a variable in Java is given below.


    ```

    Data type variable [= value];

    ```


    You can declare multiple variables of the same datatype in a single statement.
    You just need to use a comma to separate them.


    In Java, you need to take care when you are declaring variables as there are rules
    in place for it. The names for variables are case-sensitive. Therefore, ‘Hi’ and
    ‘hi’ will be considered as two separate variables. In fact, it is a good practice
    to avoid starting variable names with capitals as this format is usually applied
    to class names. You can use the ‘$’ and ‘’ signs but use them intelligently. Whitespace
    is not allowed in variable names, and you cannot start a name with a number. Finally,
    you cannot use a reserved word or keyword as a variable name.


    # Loops and Conditional Statements


    In a program, statements and lines of codes are executed in a sequential manner.
    However, it is possible to create complex execution paths to make certain programs
    and functions possible. This is achieved by means of different control structures
    such as conditional statements and loops.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'A loop statement is used when block of code needs to be executed multiple times.
    There are different kinds of loop statements available in Java for specific situations.
    They are listed as follows.


    +   - **While loop**: This will cause a group of statements to be repeated as
    long as a given condition remains true. Once the condition becomes false, the
    loop will no longer be executed. The condition will be tested before the loop
    is executed.

    - **Do-While loop**: This works in a similar manner to the while loop. However,
    it will check the condition after the code in the loop has been executed.

    - **For loop**: Here, a block of code will be executed a set number of times.
    It allows the code which manages the variable for the loop to be shortened.


    Conditional Statements

    These are actually structures that are accompanied by one or multiple conditions.
    These conditions are evaluated by the program and the statements executed according
    to the result of the evaluation. If the condition is true, a specific statement
    or set of statements will be executed. If false, another set of statements will
    be executed. In other words, these structures allow the program to make decisions.
    Java offers a few kinds of conditional structures to be used.


    +   - **If statement**: This contains a Boolean expression along with the statements
    that are to be executed when the condition is true.

    - **If else statement**: This is a regular if statement used alongside an else
    statement. If the condition is false, the statements listed under the else statement
    will be executed. The code under the if statement is executed when it returns
    true.

    - **Nested if statements**: This is a special use of the if statement. It is possible
    to nest if statements inside one another. It is also applicable for if statements.

    - **Switch statement**: This statement used to test a variable for equality against
    a specified list of values. Each value will have a statement or block of code
    that will be executed when the value of the variable matches.


    These are some of the basics that you should be familiar with when you are learning
    to develop programs using the Java language. As mentioned earlier, Java is an
    excellent stepping stone to the world of programming. Once learned, you will find
    it easier to learn other languages.'
  merge: -1
  pgno: 16
