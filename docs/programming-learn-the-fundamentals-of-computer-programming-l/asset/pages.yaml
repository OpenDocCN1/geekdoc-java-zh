    the world even two decades after its initial release.


    On the other hand, Java can be difficult to understand at times and hard to program
    efficiently and effectively. However, its popularity means that you will not lack
    for resources to help you understand or avenues to explore as a programmer. Another
    benefit of learning Java is that it forces you to think analytically and logically.
    In other words, you will start thinking like a programmer. You can get a better
    understanding of how computers process information as well. The core concepts
    and fundamentals that you learn in Java will prove to be useful when you start
    learning other programming languages.


    # The Features of Java


    Java was originally developed in 1991 by Sun Microsystems Inc. Now, it is maintained
    by Oracle Corporation who acquired Sun Microsystems in 2009. Its popularity hinges
    on its excellent features.


    +   **Platform Independence**: Unlike some other programming languages, Java is
    platform independent. As a result, you can run Java programs on all platforms
    no matter what you compiled them on.

    * **Object Oriented**: While Java is an object oriented programming language,
    it lacks some complex features as multiple inheritances, operator overloading,
    and explicit memory allocation. As a result, it is a simple language to learn.

    * **Strong Language**: Mishandled runtime errors and memory management are two
    of the main issues that cause program failures. In Java, these issues can be efficiently
    taken of. Exception handling procedures can resolve mishandled runtime errors
    while garbage collection can take care of memory management mistakes.

    * **Security**: When writing Java, all codes will remain confined inside the Java
    Runtime Environment. As a result, unauthorized access to the system resources
    is not granted.

    * **Multithreading**: Due to its support for multithreading, Java allows your
    program to perform different tasks at the same time.


