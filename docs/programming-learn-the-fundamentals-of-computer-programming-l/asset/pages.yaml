  md: 'The constant qualifier is used to declare that the value of an identifier will
    remain unchanged in the program. In other words, the keyword for this qualifier
    is ''const''. If you want the value of a variable to be changed by external sources,
    you can declare it to be ''volatile''. This is another variable that you should
    become familiar with.


    # Variables


    As you know, variables are a specific location in the memory where data is stored
    by a program. The size of the memory block depends on the type of the variable.
    For identifying the memory block, you need to assign a unique name to each variable.
    Before variables can be used, they need to be declared with their data type and
    name. The syntax for variable declaration in C is given below.


    ```

    [Storage-class] type data variable name [= initial value];

    ```


    You do not have to define the initial value or the storage class for the variable
    if they are not required. It is possible to declare multiple variables at the
    same time as long as you want them to have the same storage class and data type.
    The syntax to do so is given below.


    ```

    [Storage-class] type data variable name [= initial value] variable [= initial
    value];

    ```


    # Statements


    In C, statements allow you to control the flow of the execution of your program.
    The programming language offers you a variety of statements. Some of the most
    commonly used statements are given below.


    +   - If statement

    - go to statement

    - switch statement

    - while statement

    - do-while statement

    - For statement


    As you proceed with programming in C, you will come across many other concepts
    such as input and output functions, arrays, structure, pointers and so on. Once
    you know about them, you can easily jump into other programming languages such
    as C++ and Java.'
