  md: 'Based on this example, there are a few things you should know about programming
    in this language.


    +   * All programs written should have a single main function.

    * The execution of the program will always start from the main function.

    * The execution of the program will always start at the opening brace of the function
    and stop at the closing brace. Braces can be used to group together statements.

    * Typically, all statements are written in lowercase letters in C.

    * Uppercase letters are reserved for messages, output strings, and symbolic names

    * You must declare a variable with the right data type before using it.

    * All statements in C must end with a semicolon.


    # Data Types in C


    In C, you will find a standard set of fundamental data types. Due to their simplicity,
    they are often referred as primitive data types. However, it is possible to develop
    a range of complex data structures from them. There are a total of four basic
    data types:


    +   * Character - char

    * Integer - int

    * Floating-point - float

    * double floating-point - double


    The actual range and size of the data types may vary among compiles and processor
    types. It is possible to modify the behavior of the variable type to which they
    are applied with the help of data type qualifiers. There are a few qualifiers
    in C.


    Size qualifiers can change the size of the data type. Two size qualifiers are
    present in C. They are ‘short’ and ‘long’. They simply change the size of the
    declared variable.


    Sign qualifiers determine what kind of numbers that the variable can hold. The
    ‘signed’ denotes that the variable can contain positive as well as negative numbers.
    However, an ‘unsigned’ variable can only contain positive numbers. It is not necessary
    to declare a variable assigned as variables are signed by default. These qualifiers
    can be applied to the char and int data types.'
