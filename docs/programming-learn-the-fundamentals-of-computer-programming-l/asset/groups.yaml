    \n# C 中的数据类型\n\n在 C 中，你会发现一组标准的基础数据类型。由于它们的简单性，它们通常被称为原始数据类型。然而，可以从它们开发出一系列复杂的数据结构。总共有四种基本数据类型：\n\
    \n- 字符 - char\n- 整数 - int\n- 浮点型 - float\n- 双精度浮点型 - double\n\n数据类型的实际范围和大小随编译器和处理器类型而异。通过数据类型修饰符，可以修改所应用变量的行为。C\
