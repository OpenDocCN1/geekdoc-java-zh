    # Chapter 4: Build The Web With JavaScript


    First of all, you should not confuse JavaScript with Java. They are completely
    separate programming languages with no links to each other. It was originally
    developed in the 90s. JavaScript is one of the necessary technologies in the development
    of the web as it is used today. However, this programming language is also used
    in places other than a web browser such as connected services and applications.


    As a programming language, JavaScript is dynamic. As a result, you have the flexibility
    to utilize an object-oriented programming approach or imperative and functional
    ones although the language is mainly object oriented. If you are already familiar
    with C, you will find JavaScript easier as of the syntax is derived from the earlier
    programming language. In fact, it is quite easy to pick up this language. At the
    same time, knowledge of JavaScript can make it easier to learn Java and C.


    Moreover, it is becoming very popular these days. If you are planning to become
    a professional coder or build things for the internet, JavaScript is one of the
    best languages to start with. You will be able to start building web programs
    quickly on learning this language.


    ## The Features of JavaScript


    JavaScript is capable of adding a variety of beautiful effects to a web page among
    other things. When you are learning this programming language, it helps to understand
    what its features are. Here are some of the most important ones.


    ## Browser Support


    JavaScript has been accepted by all browsers as a standard scripting language.
    As a result, there is no need to install any plug-in to start using JavaScript
    in your browser, unlike Flash. More importantly, browsers provide integrated support
    to this language.


    ## Client Side and Server Side Together


    JavaScript can access the Document object model of a browser. As a result, it
    is possible to modify the structure of the WebPages at runtime. As a result, you
    can use this language for the addition of a variety of effects to the WebPages.
    At the same time, it is possible to use it on the server side. One such is the
    creation of web scripts.


    ## Scripting vs. Programming with JavaScript


    JavaScript is often referred to as a scripting language because that is exactly
    what it is. It is not exactly a programming language per se. After all, the web
    browser does a lot of the work in the program. Since the browser does the actual
    work, it is possible to make changes by writing a few lines of code, which is
    relatively easier. This is why JavaScript is considered to be an easy language
    for beginners.


    Nonetheless, there are some complicated aspects of this language. Even though
    it is employed as a scripting language, JavaScript is a thorough programming language.
    You can create complex programs with it. Of course, this is rarely required when
    you are creating WebPages.


    ## Writing a Simple Program in JavaScript


    To get a better idea of JavaScript as a language, you should start writing your
    very first program in. The staple ‘Hello World’ example will be used in this case
    as well. The good thing is that it is very easy to write this program in JavaScript.


    Before you can start, you will need to fulfill some basic requirements. One advantage
    of JavaScript is that it can be easily interpreted by the browser itself. As a
    result, you do not require any additional software or compilers for writing programs
    in this language. The only things you need are given below.


    - **Text Editor:** You can use Notepad for writing the program. However, you should
    consider getting Notepad++ which is an invaluable text editor for programmers.
    You can get this application for free.

    - **Web Browser:** You can choose any browser that you are comfortable with; all
    of them support JavaScript.


    There is one more thing you need to do before you write the actual program and
    that is to create the HTML Framework. Generally, JavaScript programs will be embedded
    in the web page. In other words, they are written alongside the HTML. However,
    it is possible to include the programs externally. As such, a simply HTML file
    will have to be created for including the JavaScript.


    To do so, open the text editor of your choice and type the following lines in
    the file.


    ```html

    <!DOCTYPE HTML>

    <html>

    <Head>

    <Title>JavaScript Hello World</title>

    ```


    ## JavaScript Hello Example


    Once done, you can save this file with a name of your choice but make sure that
    the file type has been designated as an HTML file. That means the file’s extension
    should be .html and nothing else. You now have the basic template ready.


    As such, you can insert the JavaScript code into the file now. Open it up and
    add the following lines to it. Make sure that they have been mentioned after the
    \<h1>1 tag.


    ```html

    <script>

    alert("Hello World!")

    </script>

    ```


    Save the file and your JavaScript program is finally ready. You can now use your
    web browser to run the program. Open the file in the web browser and you will
    see the message, ‘Hello World!’ being displayed.


    ## Understanding the Syntax in JavaScript


    Like all programming languages, JavaScript has its own syntax that you need to
    follow when writing code with it. Here are some of the most important parts of
    the JavaScript syntax.


    When you want to implement statements in JavaScript, you need to apply the above
    tag. All statements have to be placed between <script> and </script> in a web
    page for them to be executed. It is possible to place the <script> tags with the
    JavaScript code anywhere in a web page. However, it is a good practice to place
    them inside the <head> tags. The function of the <script> tag is to alert the
    browser to ensure that all the text between tags is interpreted as a script. There
    are two important attributes to the <script> tag.


    - Language: The language attribute will specify which scripting language is being
    used. On the other hand, the latest versions of HTML and XHTML have made it unnecessary
    to use this attribute.

    - Type: Nowadays, the type attribute is recommended when you wish to mention which
    scripting is being used. You should set its value to ''text/JavaScript''.


    ## Line Breaks and Whitespace


    Unlike other programming languages, JavaScript does not pay attention to spaces,
    newlines, and tabs in its programs. Since they are ignored, you can use these
    breaks and white spaces as many times as you want without breaking the program.
    You can freely use them to format the programs to make the code look neat so that
    it can be read and understood in an easy manner.


    ## Semicolons are Discretionary


    In most programming languages such as Java and C, simple statements end with a
    semicolon. This is also the case in JavaScript with a major difference. They are
    optional in JavaScript as long as the statements are placed on separate lines.
    You must use semicolons when you are placing two statements in one line. Be that
    as it may, using semicolons is a good practice for beginners.


    ## Case Sensitivity in JavaScript


    JavaScript is sensitive to the cases of the words. In other words, ‘Hi’ and ‘hi’
    will be treated differently by the language.


    ## Data types and Variables


    Like with other programming languages, it is important to understand data types
    and variables in JavaScript.


    ### Data Types


    JavaScript offers three primitive data types. They are Numbers, Strings and Boolean.
    The Numbers data type represents both integers and floating-point. The programming
    language does not define them as separate data types; instead, all numbers will
    be represented as floating-point.


    There are also two other data types in JavaScript. They are undefined and null.
    Each of these trivial data types defines a single value only. There is a composite
    data type in JavaScript as well, and it is called object.


    ### Variables


    As is the case with other programming languages, there are variables in JavaScript.
    They have to be declared before they can be used in the program. In JavaScript,
    the variables have to be declared with the help of the ‘var’ keyword. It is possible
    to declare multiple variables in a single statement with this keyword. The syntax
    for declaring a variable is given below.


    var money;


    Variable initialization is quite easy in JavaScript. You can store a value in
    a variable as soon as it has been declared or you can do it in the program when
    required. You should remember that the ‘var’ keyword can be used only once for
    a specific variable in a program.


    Another thing about JavaScript is that it is an untyped language. Therefore, a
    variable can contain any value irrespective of its data type in JavaScript. In
    other words, you do not have to inform the program what kind of data the variable
    can hold during declaration. Moreover, it is possible to change the value type
    of any variable later. JavaScript will automatically handle the changes during
    the execution of the program.


    In JavaScript, a variable can have two scopes. The scope defines the region of
    the program in which the variable is defined.


    - **Local Variables:** A local variable will remain visible only inside the function
    where the variable has been defined. Function parameters are always kept local
    to that specific function.

    - **Global Variables:** These variables have a global scope. In other words, it
    can be defined anywhere you want in the code of the program.

