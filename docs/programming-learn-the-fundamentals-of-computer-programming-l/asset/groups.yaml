    - **Python 列表 (List)：** 如其名所示，列表是项的有序序列。它是使用最广泛的数据类型之一，而且相当灵活。在 Python 中，列表的项可以属于不同的类型。列表中的项的值可以根据需要更改。列表是可变的。

    - **Python 元组 (Tuple)：** 元组与列表类似，它也拥有一系列有序的项。然而，元组是不可变的。因此，一旦创建元组，元组中的值就无法被修改。它们主要用于数据写保护。


    ## 变量


