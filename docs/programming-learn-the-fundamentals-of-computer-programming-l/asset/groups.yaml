    \n# C 的设计\n\nC 是一种过程化编程语言，它的设计目的是可以使用相对简单的编译器进行编译。它的设计还提供了可以高效映射到机器指令的语言结构。它所需的运行时支持也是最小的。这些特性使得\
    \ C 能够应用于许多以前必须用汇编语言编写的应用程序。\n\n尽管 C 具有低级能力，但这种编程语言旨在鼓励跨平台层面的编程。只要 C 程序的编写是可移植的且符合标准的，就可以为一系列操作系统和计算机平台编译\
    \ C 程序。\n\n# C 语言中的简单程序\n\n为了说明 C 这种编程语言，有一个示例可以查看会有帮助。这里有一个用该语言编写的简单“Hello World!”程序。\n\
