    are quite simple and easy to understand. Here is some of the syntax concepts that
    you need to know when programming in this language.


    ## Whitespace


    In Ruby, whitespace characters such as tabs and spaces are typically ignored by
    the program. However, they will be taken into account when they are present in
    strings. That be as it may, there are certain cases in which white spaces are
    used for interpreting ambiguous statements. These interpretations can produce
    warnings if the -w option has been enabled.


    ## Line Endings


    In Ruby, newline characters and semicolons are treated as the ending of statements.
    However, if operators like backslash and + are placed at the end of a line, Ruby
    will treat them as an indicator that the statement is going to be continued.


    ## Identifiers


    Identifiers are the names given to methods, constants and variables. In Ruby,
    identifiers are always case sensitive. Therefore, ''Hi'', ''HI'' and ''hi'' will
    be treated as different identifiers in Ruby. On the other hand, you can make use
    of alphanumeric characters as well as the underscore character in making your
    identifiers.


    ## BEGIN AND END Statements in Ruby


    These are two important statements in Ruby. You are certain to come across situations
    where you need to use these statements as you program in this language.


    ## The BEGIN Statement


    This statement allows the code under it to be declared before the actual program
    is executed. Therefore, the code in the BEGIN statement will be the first to be
    executed. You can use multiple BEGIN statements, and they will be executed in
    the order they appear in the program. The basic syntax of this statement is given
    below.


    ```ruby

    BEGIN {

    #code

    }

    ```


    ## The END Statement


    This is the opposite of the BEGIN statement as the code it declares will be executed
    at the end of the program. The syntax for this statement is given below.


    ```ruby

    END {

    #code

    }

    ```


