    - **If 语句：** 在此条件语句中，如果表达式返回 TRUE，将执行语句下的代码块。如果为 FALSE，将跳过该代码的执行，并执行其其后的语句。

    - **If else 语句：** 这些语句在 if 语句之后包含一个 else 语句。如果 if 表达式被判定为 FALSE，将执行 else 语句下的代码块。

    - **If elif 语句：** elif 语句用于检查多个条件和表达式。当给定的条件之一被判定为 TRUE 时，将执行与该 elif 语句关联的代码块。因此，在一个
    if 语句后面可以有多个 elif 语句。执行的代码块对应于评估为 TRUE 的那个 elif 语句。


    ## 循环


    Python 中的循环与其他编程语言相似。


    - **While 循环：** 这种循环允许只要指定的条件为 TRUE，就重复执行代码块。在每次执行循环体之前，都会测试该条件。

    - **For 循环：** for 循环也允许你执行代码块。然而，它保持了管理循环变量的代码非常简短。


    与其他编程语言一样，在 Python 中也可以创建嵌套循环。


