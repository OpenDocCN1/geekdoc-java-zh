    # 第 4 章：使用 JavaScript 构建 Web


    首先，你不应该将 JavaScript 与 Java 混淆。它们是完全独立的编程语言，彼此没有任何联系。它最初开发于 20 世纪 90 代。JavaScript
    是如今 Web 开发的基础技术之一。然而，这种编程语言也用于网络浏览器以外的地方，例如连接服务和应用程序。


    作为一种编程语言，JavaScript 是动态的。因此，你可以灵活地利用面向对象的编程方法或命令式和函数式方法，尽管该语言主要是面向对象的。如果你已经熟悉
    C 语言，你会发现 JavaScript 更容易上手，因为它的语法源自早期的编程语言。事实上，学习这种语言非常容易。同时，掌握 JavaScript 知识可以让学习
    Java 和 C 变得更容易。


    此外，它现在变得非常流行。如果你计划成为一名专业的程序员或为互联网构建内容，JavaScript 是最理想的入门语言。通过学习这种语言，你能够快速开始构建
    Web 程序。


    ## JavaScript 的特性


    JavaScript 能够为网页添加各种美观的效果等。当你学习这门编程语言时，了解它的特性是有帮助的。以下是一些最重要的特性。


    ## 浏览器支持


    JavaScript 已经被所有浏览器接受为标准脚本语言。因此，与 Flash 不同，你不需要安装任何插件即可在浏览器中使用开始 JavaScript。更重要的是，浏览器对该语言提供了集成支持。


    ## 客户端与服务器端的结合


    JavaScript 可以访问浏览器的文档对象模型（DOM）。因此，可以在运行时修改网页的结构。结果是你可以使用这种语言为网页添加各种效果。同时，也可以在服务器端使用它，其中之一就是创建
    Web 脚本。


    ## 脚本与使用 JavaScript 编程


    JavaScript 经常被称为脚本语言，因为它确实是如此。它本身并不完全等同于一种编程语言。毕竟，网络浏览器承担了程序中的大部分工作。由于浏览器执行了实际工作，通过编写几行代码来实现更改是相对容易的。这就是为什么
    JavaScript 被认为是一门适合初者的简单语言。


    尽管如此，这种语言也有一些复杂的方面。尽管被用作脚本语言，但 JavaScript 是一门严谨的编程语言。你可以用它创建复杂的程序。当然，在创建网页时很少需要这样做。


    ## 在 JavaScript 中编写一个简单的程序


    为了更好地了解 JavaScript 这门语言，你应该开始编写你的第一个程序。在这种情况下，也将使用经典的“Hello World”示例。好处是，用 JavaScript
    编写这个程序非常简单。


    在开始之前，你需要满足一些基本要求。JavaScript 的优势之一是它可以被浏览器本身轻松地解释。因此，你不需要为编写这种语言的程序任何额外的软件或编译器。你只需要以下内容。


    - **文本编辑器：** 你可以使用记事本编写程序。但是，你应该考虑使用 Notepad++，它对程序员来说是一个无价的文本编辑器。你可以免费获取此应用程序。

    - **网络浏览器：** 你可以选择任何你熟悉的浏览器；它们都支持 JavaScript。


    在编写实际程序之前，你还需要做一件事就是创建 HTML 框架。通常，JavaScript 程序会被嵌入网页中。换句话说，它们与 HTML 一同编写。然而，也可以从外部包含程序。因此，必须创建一个简单的
    HTML 文件来包含 JavaScript。


    要这样做，打开你选择的文本编辑器并在文件中输入以下行。


    ```html

    <!DOCTYPE HTML>

    <html>

    <Head>

    <Title>JavaScript Hello World</title>

    ```


    ## JavaScript Hello 示例


    完成后，你可以以你喜欢的名称保存此文件，但要确保文件类型被指定为 HTML 文件。这意味着文件的扩展名应该是 .html 而不再是其他的。你现在已经准备好了基础模板。


    因此，你现在可以将 JavaScript 代码插入到文件中。打开它并向其中添加以下行。确保它们位于提到的 `<h1>` 标签之后。


    ```html

    <script>

    alert("Hello World!")

    </script>

    ```


    保存文件，你的 JavaScript 程序终于准备就绪了。你现在可以使用网络浏览器运行该程序。在网络浏览器中打开文件，你将看到显示“Hello World!”的消息。


    ## 理解 JavaScript 语法


    与所有编程语言一样，JavaScript 有它自己的语法，在使用它编写代码时需要遵循这些规则。这里是 JavaScript 语法的一些最重要的部分。


    当你想要在 JavaScript 中实现语句时，你需要应用上述标签。所有的语句必须放在网页的 `<script>` 和 `</script>` 之间才能被执行。可以在网页的任何位置放置带有
    JavaScript 代码的 `<script>` 标签。但是，将它们放在 `<head>` 标签内部是一个良好的习惯。`<script>` 标签的功能是通知浏览器以确保标签之间的所有文本都被解释为脚本。`<script>`
    标签有两个重要的属性。


    - Language（语言）：language 属性将指定正在使用哪种脚本语言。另一方面，HTML 和 XHTML 的最新版本已使得使用此属性变得不再必要。

    - Type（类型）：现在，当你想要说明在使用哪种脚本时，建议使用 type 属性。你应该将其值设置为 ''text/JavaScript''。


    ## 换行与空格


    与其他编程语言不同，JavaScript 在程序中不注意空格、换行和制表符。由于它们被忽略了，你可以随心所欲使用这些换行和空格而不会破坏程序。你可以自由地使用它们来格式化程序，使代码看起来整洁，从而易于阅读和理解。


    ## 分号是可选的


    在 Java 和 C 等大多数编程语言中，简单语句以分号结束。JavaScript 的情况也是如此，但有一个主要区别：只要语句放在单独行，分号在 JavaScript
    中就是可选的。当你将两个语句放在同一行时，必须使用分号。尽管如此，对于初学者来说，使用分号是一个良好的习惯。


    ## JavaScript 的大小写敏感


    JavaScript 对单词的大小写敏感。换句话说，语言会对‘Hi’和‘hi’区别对待。


    ## 数据类型与变量


    与其他编程语言一样，理解 JavaScript 中的数据类型和变量是非常重要的。


    ### 数据类型


    JavaScript 提供了三种原始数据类型：数字（Numbers）、字符串（Strings）和布尔（Boolean）。数字数据类型代表整数和浮点数。该编程语言没有将它们定义为独立的数据类型；相反，所有数字都表示为浮点数。


    JavaScript 中还有两种数据类型：未定义（undefined）和空（null）。这些简单的数据类型每个只定义了一个值。JavaScript 中还有一种复合数据类型，被称为对象（object）。


    ### 变量


    与其他编程语言一样，JavaScript 中也有变量。它们在程序中使用之前必须声明。在 JavaScript 中，变量必须借助 `var` 关键字来声明。使用此关键字可以在单条语句中声明多个变量。声明变量的语法如下：


    var money;


    在 JavaScript 中，变量初始化非常简单。一旦声明变量，你就可以在变量中存储一个值，或者在程序需要时进行操作。你应该记住，`var` 关键字在程序中的某个特定变量只能使用一次。


    关于 JavaScript 的另一点是，它是一种无类型语言。因此，变量可以包含任何值，无论其在 JavaScript 中的数据类型是什么。换句话说，在声明期间不需要程序变量可以持有什么类型的数据。此外，稍后更改任何变量的值类型也是可能的。JavaScript会在程序执行期间自动处理更改。


    在 JavaScript 中，变量可以有两个作用域。作用域定义了变量定义的程序区域。


    - **局部变量（Local Variables）：** 变量仅在定义它的函数内部可见。函数参数始终保持为该特定函数的局部变量。

    - **全局变量（Global Variables）：** 这些变量具有全局作用域。换句话说，可以在程序代码的任何地方定义它们。


    '
