    在 Python 中，正确地命名变量是至关重要的。名称可以是大写字母、小写字母以及数字和下划线的组合。然而，名称不能与数字开头。特殊符号不能用于变量命名。你不能使用关键字作为名称。这些规则在编写标识符时同样适用。


