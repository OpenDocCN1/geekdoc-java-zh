    # 第 3 章：享受 Java 的多功能


    Java 是世界上最有影响力的编程语言之一。它在计算领域依然保持着流行和无不在。你可以发现 Java 被应用于各种平台，从 Web 到操作系统，甚至是设备。你会发现
    Java 充满了各种特性。作为一种编程语言，它是基于类且面向对象的。它的设计使其具有良好的可移植性，因此你可以在各种平台上对其进行开发。这就是为什么在自最初发布二十多年后，它在全球范围内仍然非常受欢迎。


    另一方面，Java 有时可能难以理解，并且难以高效、有效地进行编程。然而，它的流行意味着作为程序员，你不缺资源来帮助你理解，也不缺探索的途径。学习 Java
    的另一个好处是，它迫使你进行分析性和逻辑思维。换句话说，你将开始像程序员一样思考。你也可以更好地理解计算机如何处理信息。你在 Java 中中学的核心概念和基础知识在你开始学习其他编程语言时将会被证明是有用的。


    ## Java 的特性


    Java 最初由 Sun Microsystems 公司于 1991 年开发。现在，它由在 2009 年收购 Sun Microsystems 的 Oracle
    公司维护。它的流行取决于其卓越的特性。


    - **平台无关性**：与其他某些编程语言不同，Java 是平台无关的。因此，无论你在什么平台上编译它们，都可以在所有平台上运行 Java 程序。

    - **面向对象**：虽然 Java 是一种面向对象的编程语言，但它缺乏多重继承、运算符重载和显式内存分配等复杂特性。因此，它是一门易学习的语言。

    - **强语言**：运行时错误和内存管理是导致程序失败的两个主要问题。在 Java 中，这些问题可以被高效地处理。异常处理程序可以解决处理错误的运行时错误，而垃圾回收可以处理内存管理错误。

    - **安全性**：在编写 Java 时，所有代码都将限制在 Java 运行环境（JRE）内部。因此，不会授予对系统资源的授权访问。

    - **多线程**：由于支持多线程，Java 允许你的程序同时执行不同的任务。


    ## Java 简单程序


    为了更好地理解 Java 是什么样的，下面的示例将会有帮助。


    a 是一个 "Hello World" 程序，这是一个经常用于说明编程语言基础的简单程序。你在 C 和 C++ 章节中已经遇到过此类示例了。


    ## Public class Main


    这是程序的第一行，它定义了一个名为 Main 的类。如果你想让一行代码在 Java 程序中运行，你必须将其放在其他类内部。在这里声明了 Main 类。它被定义为
    `public`（公有的）。因此，其他类可以访问它。你还应该记住，公有类必须在具有同名的文件中声明。在这种情况下，文件名应该是 Main.java。如果你不这样做，你将在编译期间得到错误。


    ## Public static void main (String [] args) {


    这是 Java 程序的起始点。main 方法必须具有精确的签名，以便程序可以运行。这里有你需要查看的几个关键字。你已经熟悉 `public` 了，其他的很快就会讨论。‘Main’
    显然是方法的方法名。


    ## System.out.println("Hello, World!");


    `System` 是 Java 中的一个预定义类，它包含了一些编程时非常有用的变量和方法。下一个关键字是 `out`，它是 `System` 的一个静态变量，代表程序的输出。`println`
    是在 `out` 内部找到的方法，用于打印一行内容。


    ## Java 中的数据类型和变量


    在 Java 中，有三种变量和几种数据类型。当你想要用这种语言编写程序时，理解它们至关重要。


    ## 数据类型


    Java 中有几种数据类型：基本类型和非基本类型。基本数据类型是由 Java 预定义并提供的。Java 中这些类型的示例包括 `Boolean`、`char`、`int`、`long`、`short`
    和 `float`。另一方面，非基本数据类型不是由 Java 定义的。相反，它们由你——程序员来创建。它们引用内存位置，因此它们有时被称为引用变量。`String`
    和数组就是一些非基本数据类型。


    ## 变量


    在 Java 中，有三种变量可以用于你的程序。类型取决于你如何声明变量。局部变量是在方法内部声明的变量。另一方面，实例变量定义在方法之外、类之内。静态变量简单来说就是用
    `static` 关键字声明的变量，它们不能是局部变量。当你开始认真地学习 Java 编程时，你将学到这些用法。


    和其他编程语言一样，你需要在使用变量之前对其进行声明。在 Java 中声明变量的基本语法如下所示。


    ```

    Data type variable [= value];

    ```


    你可以在一个语句中声明多个相同数据类型的变量。你只需要使用逗号来分隔它们。


    在 Java 中，声明变量时需要小心，因为那里有相应的规则。变量名是区分大小大小的。因此，‘Hi’和‘hi’被视为两个不同的变量。事实上，避免以大写字母开头变量名是一个好习惯，因为这种格式通常用于类名。你可以使用
    `$` 和 `_` 符号，但要明智地使用。变量名中不允许有空格，你不能用数字开头。最后，你不能使用保留字或关键字作为变量名。


    ## 循环和条件语句


    在程序中，语句和代码行是按顺序执行的。然而，可以创建复杂的执行路径以使某些程序和函数成为。这是通过不同的控制结构（如条件语句和循环）实现的。


    当代码块需要执行多次时，就会使用循环语句。Java 中提供了适用于特定情况的不同类型循环语句。它们列举如下：


    - **While 循环**：只要给定条件保持为真，一组语句就会重复。一旦条件变为假，循环将不再执行。在执行循环之前会进行条件测试。

    - **Do-While 循环**：它的工作方式与 while 循环类似。然而，它会在循环中的代码执行后检查条件。

    - **For 循环**：在这里，代码块将执行固定次数。它允许缩短管理循环变量的代码。


    ### 条件语句

    这些结构实际上是伴随着一个或多个运行的。这些条件由程序进行评估，并根据求值结果执行语句。如果条件为真，则将执行某个特定的语句或一组语句。如果为假，则将执行另一组语句。换句话说，这些结构允许程序做出决策。Java
    提供了几类供使用的条件结构。


    - **If 语句**：它包含一个布尔表达式以及当条件为真时要执行的语句。

    - **If else 语句**：这是一个与 `else` 语句一起使用的普通 if 语句。如果条件为假，将执行 `else` 语句下的语句。当 `if`
    语句返回真时，执行其下的代码。

    - **嵌套 if 语句**：这是 `if` 语句的特殊用法。可以将 `if` 语句嵌套彼此内部。它也适用于其他语句。

    - **Switch 语句**：该语句用于测试变量与指定值列表的等等性。当变量的值匹配时，每个值都将有一个要执行的语句或代码块。


    这些是在学习使用 Java 语言开发程序时应该熟悉的一些基础知识。正如前面提到的，Java 是通往编程世界的一个极佳跳板。一旦学会，你会发现学习其他语言变得更容易了。


    '
