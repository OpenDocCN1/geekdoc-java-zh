    # Chapter 2: Go Old School With C And C++


    Both C and C++ have a rich history as programming languages. C was developed in
    the early 1970s, and it has gone from strength to strength while C++ came about
    later in the 1980s.


    You need to remember that both of these languages have been present in the early
    days of computer programming. As such, they are considered among the most foundational
    programming languages in the world. Therefore, you are sure to benefit greatly
    by learning them even if you do not use them later. In fact, learning them is
    like gaining an invaluable insight into the very beginnings of computer programming.


    There are advantages and disadvantages to each language certainly. Nonetheless,
    you will gain a better understanding of programming in general. In fact, you may
    find it easier to start learning other programming languages such as Java. After
    all, the features of C and C++ have served as an inspiration for a few languages.


    Of course, there is a question of choice between C and C++. Now, C is the older
    of the two and C++ is considered to be a subset of the earlier language. C++ is
    also considered to be the easier of the two by many programmers. On the other
    hand, knowledge of C can prove to be helpful if you are hoping to become a professional
    programmer. Nonetheless, it is quite possible to learn C after C++ and vice versa.


    # The Design of C


    C is a procedural programming language, and it was designed so as to be compiled
    with a relatively straightforward compiler. Its design also provides language
    constructs that can be mapped efficiently to machine instructions. The runtime
    support required is also minimal. These features enabled C to become useful for
    a variety of applications which had to be coded with assembly language previously.


    In spite of the low-level capabilities of C, this programming language was meant
    to encourage programming on a cross-platform level. It is possible to compile
    a C program for a range of operating systems and computer platforms along as it
    is portably written and is standards-compliant.


    # A Simple Program in C


