  mdcn: "\n\n学习编程时，你必须准备好投入大量的时间。\n\n另一方面，你需要确保你的程序可以在短时间内被理解、改进和修复。\n\n- 在开始编写程序之前，检查一下与你想创建的内容类似的其他程序。理解这些程序并找出它们的优缺点。你应该思考改进程序的方法。\n\
