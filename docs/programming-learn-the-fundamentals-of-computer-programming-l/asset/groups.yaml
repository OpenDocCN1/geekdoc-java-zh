    **Local Variables:** The scope of these variables range from the start of a block
    of code to its end. In other words, it exists between the braces. They are not
    available outside the method. If you reference an uninitialized local variable,
    Ruby will consider it to be a call to a method which has no arguments. It is possible
    to declare local variables by assigning to uninitialized local variables. All
    local variables have to start with either an underscore or a lowercase letter.


    **Global Variables:** These are used when you need to have a variable that can
    exist for all classes. By assigning to global variables, you can change the global
    status. As such, their usage is not recommended unless absolutely necessary. They
    can complicate the program. Uninitialized global variables will have the value
    of nil. With the -w option, they can cause warnings. All global variables need
    to start with the ''$'' character.


    ## Conditional Structures in Ruby


    There are quite a few conditional structures available in Ruby, most of which
    are common to other programming languages. Therefore, you should not have a problem
    if you are familiar with other languages. Even if you do not, it will not be difficult
    for you to learn.


    - **If statement**: This statement is used to execute a block of code when a condition
    is determined to be true. The execution of the code will be skipped when the condition
    returns false.

    - **Else statement**: the else statement is used with the if statement. It provides
    an alternate block of code to be executed when the condition is evaluated false.

    - **Elsif statement**: the elsif statement is used with the if and else statements
    and is between the two. It is possible to add as many elsif statements as required.
    This statement is used when you need multiple conditions to be checked. The elsif
    statement returns true for the condition will have its block of code executed.

    - **Unless statement**: the unless statement is the opposite of the if statement.
    It when you want a block of code to be executed when the condition returns false.

    - **Case when statement**: Using the if-els-else conditional structure can get
    complicated when you need to evaluate a lot of options. In these situations, you
    can use the case statement when the condition returns the right value. Multiple
    code under the when will be executed when multiple statements are applied to a
    case statement. It is also possible to use the else statement with this conditional
    structure. The else statement will give a block of code to be executed when the
    condition does not return any value acceptable to the when statements.


    ## Loop Statements in Ruby


    Loops are also available in Ruby. As you already know, loops allow you to execute
    a certain block of code several times. Here is a short introduction to the loops
    available in Ruby.


    - **While loop:** the while loop allows the code to be executed as long as the
    condition is true. Once it turns false, the execution is stopped, and the program
    heads over to the next statement.

    - **Until loop:** this is the reverse of the while loop. The until loop will keep
    being executed as long as the condition is false. It will stop when the condition
    becomes true.

    - **For loop:** While Ruby offers a for loop, it is not similar to the for loops
    available in other programming languages. Instead, the for loop in Ruby functions
    more like the for loop in other programming languages. As a result, it will execute
    the code as long as there are elements to consider in a given expression.


    You should now be familiar with the basics of programming in Ruby. Of course,
    there are still a lot left to go, but these details should help you prepare for
    the difficult parts.


    ## Conclusion


    With the end of this book on programming languages, I hope that it has proven
    to be useful for you. You should now know about the easiest programming languages
    for beginners to start with.


    Of course, the introduction to programming should have familiarized you with the
    fundamentals of the activity in general. After all, there are quite a few things
    that are similar to all languages. One of them is that all languages require you
    to adopt the mentality of a programmer. Once you do so, you will find programming
    relatively easier.


