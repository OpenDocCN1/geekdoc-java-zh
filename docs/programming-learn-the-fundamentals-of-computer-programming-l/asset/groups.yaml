    ## Chapter 5: Learn The Incredible Language Of Python


    Python is often mentioned as one of the best programming languages for a beginner
    to start with. If you are an absolute newcomer to programming, this can be an
    excellent choice for you. Python is quite an old language having been developed
    in the 80s. Guido van Rossum who developed it later gave away the language as
    open source. It is currently taken care by the Python Software Foundation. Python
    can be used freely even for commercial applications.


    This is generally used as a scripting language with which programmers can compose
    large amounts of code in a very short period of time. Of course, the code will
    still remain functional and easily readable. Due to its flexibility, this language
    is one of the most popular of all the high-level languages in use today.


    However, there is one thing you must know about Python. You are not going to be
    starting at the basic level when you are a beginner. On the other hand, you will
    be learning a number of useful things such as modularity, naming conventions and
    indentation, all of which can make it easier for you when you learn other programming
    languages. Another advantage of this language is that the community is thriving
    allowing you to get a range of resources to help you learn Python.


    ## Features of Python


    Python is quite a powerful object-oriented programming language. It has some excellent
    features to offer to the programmer.


    - Ease: The ease of using Python showcases itself in multiple ways. There are
    fewer keywords in this language along with a clear syntax and simple structure.
    As a result, it is easy to learn it. The code can be read easily as it is clearly
    defined.

    - Portability: It is possible to run this language on a range of hardware platforms.
    At the same time, it will have the same interface on all of them.

    - Extensibility: It is possible to add low-level modules to the interpreter in
    Python. With it, you can customize your tools or add new functions so that the
    tools become more efficient.

    - GUI Programming: One of the best things about Python is that it can support
    GUI applications. These can be created and ported to many windows systems and
    system calls including Macintosh and UNIX''s X window system.

    - Scalability: With Python, you can get a better support and structure for larger
    programs.

    - Interactive Mode: In Python, you can get an interactive mode. It enables interactive
    debugging and testing of your code snippets easily.

    - Multiple Approaches: While Python is mainly an object oriented programming language,
    it is possible to use other programming approaches as structured and functional.

    - Other Features: Python offers very high-level data types. Apart from supporting
    dynamic type checking, it also offers automatic garbage collection. Moreover,
    you can integrate Python with other programming languages such as Java, C++ and
    C easily.


    ## A Simple Program in Python


    Before you can write a Python program, you need to install it on your computer.
    You will also get a Python program called IDLE. This is short for Integrated Development
    Environment. This is known as IDE for short in other programming languages. IDLE
    looks a lot similar to a basic text editor. On opening IDLE, you need to put in
    the following command at the prompt.


    ```

    print("Hello, World!")

    ```


    As you can see, the code for a Hello World program in Python is much shorter than
    the other programming languages that you have seen so far. This is one of the
    reasons for the popularity of this language. You can even easily understand what
    is happening in the code.


    ## Data Types and Variables


    Understanding the variables and data types will certainly help you out when you
    are learning Python.


    ### Data Types


    In Python, all values have a data type. Moreover, everything is considered to
    be an object in this programming language. Therefore, data types are actually
    considered to be classes while variables are considered to be instances of the
    respective classes. Here are some of the most important data types in Python.


    - **Python Numbers:** In this category, you will find floating point numbers,
    numbers and integers. In Python, they are defined as a float, complex, and int.
    It is possible to discover the class of the variable with the type () function.
    The *instance()* function can be used to check whether an object belongs to a
    specified class.

    - **Python List:** As the name suggests, a list is an ordered series of items.
    It is one of the most widely used data types and is rather flexible. In Python,
    the items of a list can belong to different types. The value of the items in a
    list can be changed as per requirements. The list is mutable.

    - **Python Tuple:** Tuple is similar to a list it also has an ordered series of
    items. However, a tuple is immutable. Therefore, the values in a tuple cannot
    be modified once it has been created. They are mainly used for writing-protecting
    data.


    ## Variables


    While the function of variables in Python is the same as the other programming
    languages, there is a difference in their declaration. In Python, you do not have
    to declare a variable before using it. You simply need to assign a value to the
    variable, and it will exist. You do not have to define the data type of the variable
    as well. Python will define the data type automatically based on the value assigned
    to the variable.


    Naming the variables properly is essential in Python. The names can be a combination
    of letters in uppercase and smaller case along with digits and underscore. However,
    a name cannot start with a number. Special symbols cannot be used for naming variables.
    You cannot use keywords for the names as well. These rules are also applicable
    when you are writing identifiers.


    ## Conditional Statements and Loops


    Like other programming languages, Python also offers a range of conditional statements
    to help your program make decisions and loops for executing a code multiple times.


    ## Conditional Statements


    There are a few conditional statements available in Python. In this programming
    language, a null or zero value is considered to be TRUE while any non-null or
    non-zero value is taken to be False.


    - **If statements:** In this conditional statement, the block of code under the
    statement will be executed if the expression returns TRUE. If FALSE, the execution
    of that code will be skipped and the statement after it will be executed.

    - **If else statements:** These statements contain an else statement after the
    if statement. The block of code under the else statement will be executed if the
    if expression is determined to be FALSE.

    - **If elif statements:** The elif statement is used to check multiple conditions
    and expressions. When one of the given conditions is determined to TRUE, a block
    of code associated with that elif statement will be executed. As such, there can
    be multiple elif statements following an if statement. The block of code executed
    corresponds to the elif statement which was evaluated to TRUE.


    ## Loops


    Loops in Python are similar to other programming languages.


    - **While loop:** This loop allows you to repeat the execution of a block of code
    as long as the specified condition is TRUE. The condition will be tested every
    time before the body of the loop is executed.

    - **For loop:** The for loop also allows you to execute a block of code. However,
    it keeps the code required for managing the loop variable short.


    Like other programming languages, it is also possible to create nested loops in
    Python.


    Learning Python can certainly open up a plethora of opportunities. More importantly,
    once you become adept in Python, you will find programming easier in general.


    ## Chapter 6: Enjoy the Ease of Ruby


    Developed in the 90s, Ruby is one of the most recent programming languages in
    the world. Even so, it is remarkably popular thanks to its dynamic and open-source
    nature. It is an object-oriented programming language which was designed to possess
    an easily readable syntax that could be written by a beginner. There is no need
    to learn and memorize a huge list of commands to get started with Ruby.


    Ruby is known to be a programming language that is quite easy to learn. In fact,
    it is possible to pick up the basics in less than an hour. You can find a quick
    start guide that will take around 20 minutes to complete by the end of which you
    will be acquainted with the fundamentals of this programming language. If you
    are already familiar with Python, Ruby will become less of a challenge.


    Another thing you need to keep in mind is the difference between Ruby on Rails
    and Ruby. You see, Ruby is a programming language. On the other hand, Ruby on
    Rails is a framework that has been built with Ruby. While Ruby is a general purpose
    scripting language, Ruby on Rails allows the development of web applications.


    ## The Features of Ruby


    There are some excellent features in Ruby that make it a useful programming language
