    # CHESTNUT WEEVILS


    Chestnut weevils can be disgusting if you bring in fresh chestnuts and put them
    in your refrigerator crisper. We made that mistake the first year we had weevils.
    After the nuts were in the refrigerator for a week or so, we had maggots crawling
    around the veggie drawer. Something that you do not want your customers to experience!
    How to avoid this is where understanding, scouting and mitigation is a must.


    There are two species of weevils that are commonly called “chestnut weevil” and
    they are the small chestnut weevil (Curculio sayi Gyllenhal) or the large chestnut
    weevil The lesser weevil is ¼ to ¾″ in length while the larger weevil is ¾″ to
    58mm long. Year to year, weevils always seem to be at different levels from 1
    to 10 percent of the nuts in our trees. We do not do any spraying, so we have
    a diverse biological interaction we hope is controlling the population. We are
    unaware of how to scout for weevils other than sample how many nuts have weevil
    holes in them. It is said that you can see the lesser species of weevils eating
    pollen, so that means we may be able to find them during pollen'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'season. We employ a cultural practice of harvesting the nuts every day to break
    their life cycle. There appears to be biological controls for weevils, and one
    study used entomopathogenic fungi and entomopathogenic nematodes[76]. The study
    found the efficacy of the Metarhizium brunneum strains ARSEF 4556 and V275 to
    be effective in controlling the chestnut larvae. This same study also found the
    nematode Steinerema feltiae had a 80 percent mortality and when co-applied with
    the fungus Metarhizium brunneum had 100 percent efficacy. Oh, entomopathogenic
    just means death to insects, in case you wanted to know that 50-cent word means.
    You can use Steinerema nematodes[72] from many places and one stop shop for many
    organic solutions is Arbonico Organ.


    Beaverria bassiana is a mycoinincidence and has been found[78] to be an effective
    soil treatment, and it is commercially available by the name Botanogar. Botanig
    is reasonable in cost and if it is co-applied with nematodes should be a very
    effective control. Mycoinsecticide just means, as you probably guessed, it is
    a fungal based insect killer.


    When chestnut is near ripe and the husk is about to split when eggs are placed
    in the nut. Weevils pierce the spiny husk and nut to lay one egg per hole. The
    long snout is for drilling into the husk and there are supposedly tiny teeth at
    the end of the snout. The larva hatches after a few days, burrows into the nut
    for a couple weeks of feeding, and crawls just before or after the nut has fallen
    to the ground. The exit hole is much larger and, of course, there will be larvae
    frass inside the nut. Weevil is the main reason why we should endeavor to harvest
    every day and no more than every three days to break the life cycle of the weevil.
    If all nuts are harvested, the weevil will have a less of chance to exit the nut
    and finish growing in the soil to reproduce the following year.'
