    # MICE AND VOLES


    Mice and voles are usually lumped together, as the small glimpses we get of them;
    they appear to be the same. The only real difference one can see is the tail of
    a vole is much shorter than a typical mouse. We are unaware of any significant
    nut thefts that occur from mice and voles. However, mice and voles will eat roots
    year-round and strip the bark in the wintertime. There are a few methods used
    to control the population.


    The first and foremost method is to put hardware cloth around your young trees
    in the fall before the snow flies. The cages are made of hardware cloth. You can
    use either a 1/8” square or 1/4” square cloth. We may use 12 inches high or 18
    inches high cloth. You may buy 2 feet or 3 feet wide rolls and cut the roll in
    half. We also cut a length of approximately 18 to 20 inches long. We form a circle
