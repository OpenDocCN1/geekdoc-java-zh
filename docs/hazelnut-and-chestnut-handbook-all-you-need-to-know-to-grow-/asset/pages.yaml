    you literally have to completely blend Chinese DNA and draw lucky numbers to get
    blight resistance and not lose the yet unknown DNA. It will be like winning the
    Powerball lottery many days in a row.


    The chestnut blight produces oxalic acid that it uses to dissolve tissue and it
    then absorb the nutrients. This oxalic acid production by chestnut blight was
    a key that Dr. Powell and Dr. Maynard of the State University of New York of Environmental
    Science and Forestry (SUNY ESF), in conjunction with the New York chapter of the
    TACF, would use to slow the blights ability to kill the tree. Oxalic acid neutralization
    is a common defense found in many fruits and grains we eat every day. A blight
    resistant plant will manufacture an enzyme called Oxalate Oxidase, or OxO. The
    enzyme breaks down oxalic acid into carbon dioxide and hydrogen peroxide.


    The American Chestnut Research & Restoration Project[112] at ESF is utilizing
    a plant gene taken from wheat that will generate the OxO enzyme and have inserted
    it into the American chestnut using naturally occurring bacteria (Agrobacterium)
    that transforms plant genes naturally. The gene'
