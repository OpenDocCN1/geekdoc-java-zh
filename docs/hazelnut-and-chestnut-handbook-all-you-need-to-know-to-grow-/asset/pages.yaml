  md: 'When the fear of frost is past, get the seedlings planted out as soon as possible.
    You do not want the seedlings to become root bound. If you started the seeds too
    early and you see roots starting to circle the pot, you will need to repot to
    a larger pot. This often happens if spring is so late don''t fight it, just repot
    the seedlings. A couple weeks near the end of frost you will want to acclimatize
    your seedlings to the outside world. Bring the seedlings outside for increasing
    periods every day for a minimum of two weeks before planting, during the day.
    This is called "hardening off", by making your seedlings accustomed to being exposed
    the sun''s ultra violet rays and the air flow of nature. This is where having
    a fan on your seedlings goes a long way to make your seedlings tough for the outside
    world. Start out having your seedlings outside for about an hour and increase
    every day. If it is brutal with high winds and cold or exceptionally sunny windy
    and hot, skip that day. You are getting your trees ready for that type of day,
    so don''t expose the seedlings before they are ready.


    For upstate New York you will want to start your seedlings towards the end of
    the second week in April. Okay, so did we figure this out? In the Finger Lakes
    region of New York the last day of frost is usually the last week of May. To be
    safe that is when you start your acclimation to harden the trees and that takes
    two weeks. Therefore you should be able to plant about the middle of June. If
    you grow the seedlings for one month and it takes three weeks for most of the
    seeds to sprout you need to start seven weeks prior to the end of May. Therefore
    you will need to pot the seeds at the end of the second week in April. Adjust
    your seed starting based on your area''s last day of frost. Of course starting
    your seeds a few weeks earlier is fine just let them get root bound.


    After having explained all of what is important to successfully start seeds you
    still have the option of planting directly in the field. If you want to plant
    directly in the field with seed, we would let the seeds sprout as described above
    and then plant out. Put hardware cages over the seed, stake the cages and pinch
    the top of the cage closed.


    Your knowledge is now on par with many professional growers. We could go into
    greater detail of how many accumulated moles of PAR is needed for ideal growth;
    but then we are entering the detailed scientific mumble rumble that we get on
    too often. To get to this level of discussion'
