  pgno: 68
- img_proc: true
  md: 'staples, tensioning hardware, brace pins and spring-loaded fence door handles.
    The fence perimeter was about 2200 feet in total and out of pocket costs of about
    $1100 or only 50-cents per linear foot. We strung the first wire starting at about
    10 inches off the ground to keep out raccoons and skunks. The next two runs were
    a similar distance and then spaced the remaining wires a bit more. The distance
    between the 6th and 7th wire had the largest spacing. One charger operated the
    bottom three runs of wire, and the second operated the top four runs.


    The reason we were skeptical about the electric fence was that the electrified
    barbed wire we had as a kid didn''t stop the deer very well. The same fence that
    would keep steers and cows in had no effect on the deer that would step through
    and between the wire strands like they weren''t even there.


    A note about solar powered 120V AC fence chargers. The solar fence chargers are
    fine as long as you mow underneath the fence to keep the wires free from weeds.
    The weeds will happily discharge your fence without you knowing it, making the
    shock to critters weak. If you are able to use a 120V AC fence charger, we recommend
    it, as a powerful one will burn the weeds with small arcs and keep your fence
    strong. Search for “electric fence charger weed burner” and you will find chargers
    and where to buy them.


    The new seven wire, seven tall fence did at first keep the deer out. After about
    a year, you would see some walk along the fence while some would walk through
    the runs as we witnessed as a kid. The deer did realize the protective benefits
    as we started fawns pop up when we mowed the orchard in the spring. It is as if
    the doe knew the fence was a predator deterrent and provided safety for their
    fns. We could easily imagine when a deer was being chased by a coyote, the deer
    realized that the coyote would break off going through the fence. After four years
    and five, too many of the fence posts were snapping and pulling on the seven wires.
    We needed a real deer fence that would last 10-plus years and ideally 25-plus
    years for our efforts.


    Having what others professed to be a good deer fence, we decided to experiment
    with the remaining options for fence. The options are either'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'plastic or wire fence that is 7.5/8 feet tall. We know we need long-lasting
    posts, and the posts need to be at least 10 feet long and should be 12 feet long.
    They need to be in the ground at least 2.5 feet and should be ideally up to four
    feet to withstand any winds and animal intrusion without being loosened or lifted
    and not affected by the frost line. We found that our hillsides can be tough to
    drill holes for fence posts as our hillsides have numerous rocks.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_70_0.png)


    Figure #4-2, A 12’ tall locust post being positioned for backfilling.


    Note, the natural Black Locust post reportedly is more rot resistant than pressure
    treated. Also note, only the heartwood is rot resistant, so make sure the post
    is wide enough with mostly heartwood for longevity.


    # A LONG(ER) LASTING DEER FENCE OVERVIEW


    There are three levels of cost and three levels of sweat equity for building eight
    foot high deer fences. Now that we have put up enough eight foot high'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'fences with varying materials and tools, we are able to save a ton of time
    and frustration from our experience.


    +   1. Honestly, the easiest method, if money is in the budget, hire a fence installer
    to put up the eight wire deer fence for a fixed cost and let them worry about
    the posts that won''t go in. Current costs range from $7 to $12 dollars per linear
    foot for steel fence, depending on options, location and the size of the orchard.

    2. A second method to save a ton of physical work and money is to mark where you
    want the holes drilled and hire a truck-mounted or skid post hole driller with
    down pressure. Except for the large boulders or hard bedrock, they will be able
    to drill your holes for any fence post you choose. When we had holes drilled on
    average it was about $16 per hole from a truck-mounted post hole drill.

    3. To save the most money, if you know you have soft soil you can just pound down
    cast iron “T” posts yourself and a simple-point hitch hole auger will drill your
    holes for the wood corners and gate posts.


    Once the posts are in you then need to decide if you can rent or make the equipment
    to put up the steel fence. The steel fence needs to be your first choice and plastic
    fence should only be if you cannot rent or make the needed equipment in conjunction
    with getting the equipment around your field with a tractor or pickup truck. You
    will see that a plastic fence is slightly cheaper than a steel wire fence, but
    the plastic fence takes much labor to install and will probably last less than
    seven years and take much more maintenance to keep it.


    We just listed in descending order of cost, the basic breakdown of putting in
    your fence for deer exclusion. Conceptually, the three methods accurately describe
    the basic cost structure based on your level of involvement. In reality, of course,
    it isn’t quite this simple as we will explain next.'
