    Yes, you really need to dig the soil from 6 to 10 inches below the soil and in
    multiple locations per acre, blending the samples together and have the soil tested
    to see the quality of your topsoil. The GIS soil survey will give you pH down
    deep that you can expect but won''t tell you the actual organic matter or minerals
    that currently exist in the topsoil. If you dig down approximately five places
    per acre and take a handful of soil per hole and mix the samples together for
    one average soil sample per acre. Altogether, the testing lab only needs about
    half pound of soil to test. We have to yet see an ideal range of nutrients for
    chestnuts. When we submit soil samples to Dairy One they do not have the recommended
    range of elements for chestnuts, so we tell them blueberries. They also want to
    know your soil. The soil type just found out from the GIS soil survey that we
