    You can find your location at the interactive map located at: http://planthardiness.ars.usda.gov/,
    for all states, not just New York. When we located our position in detail on the
    interactive USDA zone map, we found our fields are in zones 4b and 5a. Zones 4
    and 5 occupy the majority of the state except for zones 6 and 7 along the Great
    Lakes or near and on Long Island. Trees that will grow in USDA zone 4 will most
    likely grow in zones 7; however, they may not grow in zone 3 without effort. This
    leaves us with looking at what trees are hardy to our location of zone 4b and
    ideally they would be native to the region as they have evolved to withstand the
    rigors that nature throws at them.


    Once you find your USDA growing zone on the interactive map, burn this in your
    memory. We will reinforce the importance of buying the correct tree for your zone.'
