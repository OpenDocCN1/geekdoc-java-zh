    Tree form of hazelnut production is the main form currently done in Europe and
    Western USA. The hazelnut crop is mechanically harvested by harvesters that sweep
    up the nut from the orchard floor, much like a common sweeper used to clean our
    roads, or the nuts are vacuumed up with a combination of the two. Often the nuts
    are first swept into a row and the row is now vacuumed. Good examples can be seen
    in the Flory equipment video[39]. Much of the harvest in Turkey, the largest hazelnut
    producer, is still done by hand and will change over time to mechanical harvesting.
    Figure #6-3 shows how hazelnuts being harvested from Chianchia of Italy. This
    same vacuum harvester is also used for chestnuts and is by BDI Machinery[40] new
    for around $7K.


    The orchard is swept and vacuumed every few days until the harvest is over. To
    speed harvest, there are tree shakers that grab the trunk and vibrate the trees.
    A common one is a three-point hitch-style that is made by Savage[41]. This is
    an excellent method for mature trees with healthy bank that is thick enough not
    to be damaged and if you know all of your nuts are ripe waiting to get knocked
    off. Shaker is also good for any nut tree full of ripe nuts not just hazelnuts.


