    # Figure #6-2, Aronia berry harvester made by and equipped Weremczuk of Poland


    The aronia berry harvester made by Weremczuk of Poland[36] harvests by bending
    half of the bush to the side and then beats on the branches to capture nuts as
    they fall below. The inexpensive tow behind model, called Johanna-4, starts at
    $32,000- but only harvests half of the bush in one pass. Another tow behind model
    called Victor Z splits the bush in two and harvests both halves in the same pass
    goes for $130,000 well-equipped. This system is being tested by the Upper Mid
    West Hazelnut Development Initiative[37] (UMHDI) and we will follow along to see
    how well this works compared to blueberry harvesters. Another machine that is
    similar in nature to a blueberry picker but larger is an olive harvester. Again,
    UMHDI is testing an olive harvester this year, and we will watch to see how it
    performs. Aronia berry harvesters are sold in the USA by Aronia Berry Services
    of NE Iowa[38].


    Here is what we understand about aronia berry harvesters so far. Harvesting bush
    form of hazel requires that the stems remain flexible enough to be bent over without
    breaking the stem or the equipment. Aronia berry harvesters are capable of bending
    and harvesting 12'' tall stems that are an inch and a quarter (1.25") at the base
    and can damage the tree during harvest if they become too stiff. Any stem that
    is 1.25" at the base or larger must be copped out. American hazel bushes are much
    shorter and'
