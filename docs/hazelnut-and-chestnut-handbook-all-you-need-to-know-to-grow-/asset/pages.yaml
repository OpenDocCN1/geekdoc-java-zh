    as either bush or tree form. Bush form will require you to coppice the bigger
    stems and any bush may require you to keep the width of the base within the confines
    of your harvester. In tree form, the suckers must be removed while shaping the
    tree to maximize production.


    When using equipment that is stated for use on other fruit or nuts that some adjustments
    will need to be made either how you form your hazelnut bushes or adjustments and
    modifications to the harvester. We will endeavor to update future editions with
    the latest information.


    # HARVESTING TREE HAZZELS


    Single-stem tree hazelnuts must also have the characteristic of readily dropping
    nuts out of the husk when ripe. As single stem trees are too stiff to bend in
    any form. The single stem trees would require a ladder to pick by hand so ideally
    the nuts must fall from the tree to be vacuumed up. Hence, you want a well-mowed
    orchard floor prior to harvest as you have done to keep the rodents at bay all
    summer long.


    As nuts ripen and turn brown, the husk will also turn from green to brown. As
    it turns brown, the husk will curl away from the nut. As the husk peels itself,
    the nut separates and drops to the ground. Husks are very uniform in size on any
    given tree. Clones give you another advantage where all the husks are uniform,
    and all the clones will ripen at the same time speeding harvest. Seedling trees
    will have varied husk length, varied ripening times, and variability when the
    nut will fall from the tree. A hazelnut husker/cleaner as shown in Figure #6-5
    is used to clean debris and husks from the nut. Most air aspirated debris separators
    won’t separate the husks from the nuts.'
