    # WHY NUT TREES TO REBUILD SOIL


    Driving through the roads of New York and throughout the eastern half of North
    America, everywhere you look on the hillsides you will either see pastures or
    where trees are reclaiming the hillsides. The hillsides tend to be smaller fields
    that are troublesome for the very large modern equipment that needs to navigate
    the hilly terrain. The hilly terrain issue is added to the fact the hillsides
    have grown poor overtime due to annual tillage and harvesting, leaving exposed
    soil to erode with rain. As a result of the ever-increasing size of equipment,
    the smaller fields with hilly terrain, combined with low fertility, farmers have
    been abandoning them for some time.


    Annual grains grown on hillsides have depleted the soil, and the hillsides are
    now only used for pastures or abandon them to fallow and return to trees. Annual
    grain production leaves the soil exposed for months at a time. For example, if
    we use corn as a reference, the soil is exposed from'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'time the corn is chopped for silage (cow feed) in October until the field is
    planted again in April or May the following year. That means for five and up six
    months a year, the soil is exposed to erosion. Exposed soil also leaves all the
    microbes in the soil without the natural symbiotic relationship that develops
    with the plants. By plants we mean any all chlorophyll-based plants that derive
    energy from the sun. The plants generate sugars and other carbohydrates that are
    sent to the roots and in, directly or indirectly feed countless microscopic life
    such as fungi and bacteria that assist the roots with the uptake of nutrients.
    In this symbiotic relationship that helps build nutrient-rich topsoil, which annual
    grain production has eliminated up to six months a year. Trees provide permanent
    agriculture or “permaculture.”


    When the European settlers first migrated to the East Coast and spread westward,
    they found much of the land forested through the Northeast and to the Midwest.
    The topsoil was rich and deep, and was ideal for farming. The only issue was that
    the trees needed to be removed. Removing the trees solved another problem. Removing
    the trees generated the material to build the homes and farms needed in the form
    the European settlers understood.


    The European settlers’ desire to own land cannot be underestimated. Most of Europe
    was a caste society. The nobles controlled the land and serfs lived on and farmed
    the land for which they were taxed 25 percent of their crop. You were either born
    a landed gentry aristocrat or you were born a serf to toil the nobles land with
    no chance to own land. Hence, to brave the ocean in a wooden boat for your land
    and become a “self-made noble” had to be an overwhelming emotional draw to.


    Understanding how the European settlers literally cleared the hillsides of trees
    to make room for open fields by looking back at the census of 1890 for the county
    of Cortland, New York. According to the census of 1890, there were 200 sawmills
    in the county and they did a terrific job of clearing the land and generating
    the needed wood for homes and barns. According to the census of 1890, 96 percent
    of all land was cleared of trees for farming.


    Below in Figure 1-5, is a rendition of the City of Cortland, in the county by
    the same name that was drawn in 1873. You can see, except for a few'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'scattered trees and trees along property borders and roads, the land is mainly

    stripped of trees.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_25_0.png)


    Figure #1 - 5 Depiction of the City of Cortland circa 1873 with most trees

    removed[16]


    According to the 2012 census, 37 percent of the land is used for farming.

    That means 59 percent of the land is now residential or land that has gone

    fallow. Literally half of the land in the county, that has about 320,000 acres,

    isn''t being used and this is an underutilized resource of size and scope that
    is

    hard to phantom. This example is repeated in most counties throughout the

    Northeast to the Midwest.


    Trees are a permanent crop and continuously bring minerals and nutrients up

    from the soil and return sugars and carbohydrates back to the soil along with

    the annual precipitation of leaves, husks, and nuts. No annual tillage needed,

    no exposed dirt for erosion and no disruption of the soil ecosystem, allowing'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'the soil to rebuild. This and long term carbon sequestration is before we even
    eat or sell the nuts and shells.


    # WHY NUT TREES NOW


    If you were going to plant trees and give it serious thought, what might you conclude?
    Do you expect the trees will pay back in short order or are you happy leaving
    a legacy? Is there support to help you through your efforts so your time isn''t
    wasted? If we plant trees with the thought of having an orchard, what type of
    tree to plant? Follow us along as you will see how we went down this path and
    planted thousands of different trees to find out what the answers are. The purpose
    of this book is to eliminate parallel efforts that will take many years to conclude
    what we have learned and allow you to build upon our efforts.


    From the purview of the last paragraph, whatever you pay to have in your hands,
    you paid little and should owe us money before you continue ��. Let that sink
    in, as my wife and I have toiled thousands of hours and a not-so-small fortune
    invested to understand what trees species and genetics are needed for our fallow
    fields. However, our effort is nothing compared to what it is to clear the land
    in the first place.


    In the early 1990s, we moved to a hilltop in Cortland County with an elevation
    of 1600 to 1800 feet on a west-facing slope. The west-facing slope means we really
    feel the winds that come from the northwest that flow over traveling our hilltop.
    From this perch, we can see for miles overlooking one of the larger valleys that
    cuts through New York State. The beauty of the hills and valley are stunning,
    but one thing that stood out was how many fields on the hillsides were returning
    to trees. Knowing a bit of history just described, where a newly-arrived immigrant
    cut the trees to clear the field, used hand saws, horses, axes and dynamite, with
    great risk to life and limb was abandoned. The amount of effort to clear one large
    tree and remove enough of the roots by hand almost anyone today would seem nearly
    impossible, let alone many acres. The drive of our forebears to move acquire land,
    then they had to clear before they could farm, is far removed from ourselves.
    To contrast to our'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'forebears desire to own farm land in comparison to most of us today, it seems
    keeping our waistline in check is too much effort. Also, watching the evening
    news most of the issues being reported are trivial in comparison to our forefathers
    issuers burdens. Hence, why we would rather spend time working on what we can
    do to improve the human condition, like planting, developing, and caring for perennial
    food producing trees.


    Looking out at our valley view, it appeared there was an enormous resource that
    our forefather''s risked life and limb was going to waste. An embattled environmentalist
    might think letting the land back to nature is just, and no one should get in
    the way. We have had many debates on this subject and knowing the tax bill twice
    a year and seems to get larger every year, there has to be a good answer that
    is good for our wallets and the environment. Of course, I do have fun when I ask
    the fanatical environmentalist to write me check, and they can then they can let
    nature take its course. The conversation quickly turns to an emotional rant that
    the government needs to do more, and all logic is lost. A close answer to the
    fanatical environmentalist desire good stewardship that allows nature to take
    its course with some steering by humans. This is letting the fallow land go back
    to trees as nature desires is, with a modification. The modification is to let
    the trees benefit not just the climate, flora and fauna of the wild, but these
    means selecting native trees that want to grow naturally and provide food or other
    necessities for our wellbeing. In other words, we should follow nature''s lead.
    We don''t need laws to force us to do what is right, as is typically handed and
    a one size fits all manner, if we have the knowledge to lead the way.


    This means growing pine trees only as ancillary assistance for the orchards, such
    as windbreaks and maybe pine nuts too. Other trees that produce for the most part
    only wood shouldn''t be considered. Granted trees such as birch, maple, ash, beech,
    black cherry, etc. do have some ability to provide us with food. These trees can
    provide some sap for syrup and some fruit for wine and limited nuts from beech;
    however, the relatively little sustenance and the required 15 to 20 years of growth
    isn''t worth the effort. If you already own land with these or similar trees that
    are mature, it may be worth utilizing for your needs. However, our purpose is
    what to do with 50 percent of the land that is fallow, where we want to repurpose
    to produce food in an'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'environmentally friendly manner. This leaves fruit trees, nut trees, and other
    fruit bearing caneberries that would fit the bill as being environmentally friendly.


    We have now narrowed the list down of what to plant to fruit or nut trees. Caneberries,
    such as raspberries, blackberries, etc., and other understory plants or vines,
    can be grown in conjunction with fruit or nut trees as understory plantings. So
    this still leaves us with selecting fruit or nut trees to plant. There is much
    written on growing fruit trees and us writing about fruit trees is just going
    down a road well-traveled. However we do need to illuminate a few items about
    fruit-bearing trees. When selecting trees in the early 1990s, very few native
    fruit trees were good to grow in New York State. Keep in mind that a large part
    of the state is located in USDA Plant hardness zones 3 through 6 with a large
    percentage of land in zones 4 and 5 as shown in Figure #2-1.


    # We realized, on the whole in the mid-1990s, our American tree and vine crops
    are just importations with some grafting to native/hardy rootstock!


    Our search for trees to plant began in earnest back in 1993. We are located on
    the edge of the Finger Lakes region of upstate NY. There are numerous apple and
    grape vineyards that are located or on the Finger Lakes. Cornell, located in Ithaca,
    is just a hop skip and jump away, and the Cooperative Extension agents are all
    well informed on growing grapes and apples. Their logic is to grow grafted apples
    on hardy rootstock, and the prescribed maintenance is to spray every week to ten
    days prior to any outbreak of disease. It seemed the apple varieties being propagated
    were and still are to this mainly selected for taste and not for our ability to
    grow them in an environmentally friendly manner. Also, the varieties being top
    worked on root stock were most often on the very edge of growing well in zone
    5b and not our windy, relatively high elevation of the apple farmers we talked
    too weren''t very encouraging as many varieties suffered winter damage and were
    being replaced with newer rootstock that was supposed to be hardier. Okay, we
    decided to put the hybrid apple trees on the'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'backburner and only plant a few “test” trees to see what happens. Everything
    just stated for apples was also true for grapes.


    The whole reason we as a civilization make most of our food through annual grain
    and vegetable crops is because it is very easy to develop compared to growing
    our food from trees. You can take grain or vegetable seeds with you or save them
    for multiple years’ worth of crops. You can do controlled hybridization and see
    your results the very next year and this very effort has been going on for probably
    upwards of 10,000 years. Modern science with controlled environments allows multiple
    hybridizations of a crop per the most crops require less than 100 days sprouting
    and bearing their seed. In this same time period, for the most part, only seed
    from trees that produced nuts was replanted. Trees often take a minimum of four
    years and 20 years before they bear nuts and you need to watch the tree for multiple
    years to see if it is hardy and disease resistant. Therefore tree improvement
    is a multi-generational experience and most likely (like money) doesn’t last for
    multiple generations and the efforts are lost. I make reference to money as millionaires
    are 85 percent self-made, which means on its face that it doesn’t last the second
    generation. We hope as we are now in the information age, and efforts can be documented,
    with locations of improved tree strain available interested parties will always
    be able to propel hybridization efforts ever forward.


    Two nut trees that take four or even less to bear nuts are also the most tasty
    and productive. The previous paragraph teaches us why. The short reproductive
    cycle of hazelnut and chestnut trees allow for selective improvement. This improvement
    has been going on for thousands of years throughout Europe, the Middle East, and
    Asia.


    Our native hazel trees are much smaller than the hazel trees grown in Europe.
    Our native trees are small; generally less than 10 feet and often only four feet
    tall and left to their natural state appear as a bush. We know that they are native
    to the eastern half of the United States and Canada, but will hazelnuts grow on
    the property where you plan to plant them?'
