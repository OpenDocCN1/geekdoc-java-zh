    # COMMERCIAL SINGLE STEM ORCHARD


    Commercial single stem orchard – This is where you are relying on your tree supplier
    to give you trees that are hybrids of American and European or European that is
    very hardy for our USDA zones 4 and 5 regions. USDA Zones 6b and 7 hardness is
    less of an issue. Single stem trees tend to have very rigid stems and upright
    growth and after year ten, resist upright stems from being bent for harvesting
    nuts. The trees tend to be well above 10 feet at maturity as a bush and if grown
    as a single-stem tree would be much taller. Hazelnuts of this stature are best
    if they have short husks and drop their nuts when ripe for harvesting. Harvesting
    is usually done with windrowers, sweep the nuts into a row, and then a vacuum
    to harvest the nuts.


    There are harvesters that only use vacuum to harvest the nuts very similar to
    a vacuum cleaner. In either case, the orchard floor must be mowed very short and
    cleaned just before nut drop to minimize debris in the harvest. The orchard floor
    is cleaned no differently than a mowed lawn has the grass swept up or using the
    harvester prior to harvest only to vacuum the'
