    We use metal fence nails (a.k.a. fence staples) pounded into the wood to hold
    the high tensile wire with enough room to allow the fence wire to slip through
    so you can tension it after it is strung. Tension the wire using the “wire tensioners”
    described above. The wire will stretch some initially and over time this gives
    you a method to re-tension the wire. High tensile wire from Tractor Supply or
    similar farm store comes in a 4000 foot roll for around $120. Where we used formed
    metal "Z" posts, we simply slide the high tensile wire through the pre-punched
    holes that can be seen in Figure #4-18. If you use “T” posts that do not have
    any holes, you will need to bend low tensile fence wire tightly around the top
    of the post with an extra loop of wire to slide the wire through. There are T
    post fence clips that are inexpensive and easy to apply. However we haven''t found
