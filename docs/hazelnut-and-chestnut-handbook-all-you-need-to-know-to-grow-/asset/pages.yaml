  md: 'Assuming you don’t have bugs eating your trees or blight cankers and you have
    noticeable issues with your trees, you will need a diagnosis. Odds are your local
    Extension Agent will not be able to tell you what your problem is. Your trees
    may have yellow leaves or leaves with brown spots or leaves that are short and
    stunted. Rather than guess what the problem is, do a leaf analysis and compare
    your results to Table 8-2.


    Like we have stated the ideal chart doesn''t exist yet and may only get tuned
    over time. You may ask why and the answer is our soils are different and the needs
    of our hybrid trees may vary and the combinations of the variables will probably
    not have one result but a range for good productive trees. In time, we may have
    clonal varieties growing on their own roots. At Z''s Nutty Ridge are doing this
    and we will be expanding our clonal stock. Once we have readily available clonal
    stock, we may be able to narrow down the parameters.


    However, we believe for good sustainability you want genetic diversity to have
    the best chance at always finding trees that can overcome any weather extremes
    or diseases we do not yet know about. We see a time where you will clonal clonal
    trees you know are great producers of ideal nuts, planted in a row with ideal
    spacing for easy harvesting at the same time. These ideal nuts will help with
    sales and marketing like apples, but at the same time, you will have seedlings
    for genetic diversity. This genetic diversity will allow us to find the next superstar
    tree and ensure pollination.


    Trees that are well managed nutritionally can have up to 7000 pounds of chestnuts
    per acre in a good year. An unmanaged orchard can expect only 20 pounds of chestnuts
    per tree and that is only 560 pounds to 2160 pounds, depending on the density
    and age of the orchard per acre. You can expect much less in a bad pollination
    or drought year.'
