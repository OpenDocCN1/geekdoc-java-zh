    # WHY HYBRID HAZELS?


    Tasty, heart-healthy hazelnuts are used used in many food products desired by
    consumers and are chronically in short supply. People are surprised to learn that
    hazelnuts are a native tree that grows locally in the wild. Yet, most hazelnuts
    are sourced from either Oregon or Turkey. We will review why hazelnuts have not
    been grown locally and why hazelnuts will now usher in this new, highly-desired
    crop to the Northeast. Hazelnuts will become a perennial staple crop alongside
    apple and grapes.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Unlike other tree crops, hazelnuts don’t need refrigeration or a controlled
    atmosphere for storage. Nuts are a nonperishable crop that can be sold throughout
    the year and processed into many sought-after products, such as confections, oil,
    flavorings, and spreads. Hazelnuts are 50 to 75 percent oil, with over 90 percent
    monounsaturated fats and contain high levels of vitamins with antioxidant qualities[11].
    The USDA considers nuts heart-healthy and can carry that label without reprisal.
    Hazel oil is nearly identical to olive oil[2] in composition and health benefits.
    After the oil has been squeezed out, the nut is a tasty, highly nutrient-rich
    protein meal for humans or animals. The meal can be ground into healthy lectin-free
    flour, replacing wheat or other grain-based flour.


    Most importantly, hazels and chestnuts represent an innovative solution to sustainably
    utilize the soft rolling hillsides that are prone to erosion. Much of the soft
    rolling hillsides have gone fallow. The dairy industry has become big business,
    where family farms have consolidated into larger farms that utilize the best and
    easiest land to farm, leaving many marginal hillsides fallow. J. Russel Smith
    documented this very aspect of soil erosion occurring throughout the world in
    his seminal book titled，“Tree Crops, A permanent agriculture[3] that is free to
    download.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_17_0.png)'
