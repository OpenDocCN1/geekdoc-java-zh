  md: 'chlorine solution to wash the nuts, to clean the dust and any clinging particles.
    You do need to make sure the nuts are properly air-dried to not have any chlorine
    residue. Once you have soaked your nuts briefly in a sanitizer, the nuts need
    to be dried down. Drying the nuts down is needed to eliminate the possibility
    of molding the kernel. The current standard is to dry the nuts down to six percent
    moisture to stop any molding. There are moisture meters that can be bought for
    under $300 and one example is Dickey-John M3 G[49], to verify that you have properly
    dried the nuts.


