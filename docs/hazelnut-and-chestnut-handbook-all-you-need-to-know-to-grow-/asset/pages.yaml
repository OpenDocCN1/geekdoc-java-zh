    We do have what we believe are good ranges from leaf analysis tested by Toprak[64]
    et al, and listed a few example test samples that were tested in Figure #8-2.
    Keep in mind that these are from Europe on European trees in European soil, so
    well it translates to hybrids on American soil only time will tell. All of the
    secondary issues aside, the ranges provided are an initial target for us to compare.


    The late Jeff Olsen from Oregon State University used what he believes is a good
    reference for hazelnuts being a good starting point for chestnuts[65] and can
    be found in Oregon State Nutrient Management Guide EM8090[66]. We included his
    findings in Figure #8-2 and as you will see his are not different than Toprak''s
    findings.


    Also, in discussions with growers is as important as chestnuts, just as much hazelnuts
    and not stated by Toprak but boron should be 50 ppm or above. Leaf samples are
    taken when the nuts are being filled usually around mid-July to mid-August when
    the trees are being stressed. If your field is fairly uniform, then take roughly
    100 leaves from multiple trees throughout your field. If you see that trees grow
    differently in a section of your field, then take a separate sample for that section
    with another 100 leaves.'
