- img_proc: true
  md: 'We really don’t recommend direct seeding as you won’t be eliminating the weak
    trees that nurseries normally cull and weather issues. If you have a late frost
    it will kill the seedling tops. We remember we had a hard frost at the beginning
    of June 2010'' and the hill tops looked like fall until the trees grew new buds.
    Newly sprouting seedlings can be very tender. If you have a small caged area,
    you can cover with plastic and add thermal mass with a five gallon buckets of
    water. However, if you are willing to replant less than 10 percent of cull trees
    and are willing to use hardware cloth cages to protect them, go for it. Prepare
    the soil at least 8" deep and work in some compost for about 30 percent of the
    volume of the hole and mix it with the native soil eliminating any roots from
    grass or weeds. Follow the directions for composting and protection discussed
    thoroughly for hazelnuts in Chapters 4 and 5.


    As discussed in Chapter 4 on mice and voles, you should have hardware cloth around
    your seedlings to protect them during the winter time from having the bark stripped.
    For direct seeding, you will have to put cages down as you plant. The cages need
    to be at least two feet tall and pinch the top of the hardware cloth so squirrel
    or chipmunk cannot readily get in. A hungry squirrel will still dig underneath
    if it is desperate, but doesn’t happen too much if the cage is buried an inch
    into the topsoil and well-stated with two or three stakes per cage.


    # GRAFTING


    Grafting is a way to make seedlings superstars if you know the parent is a superstar.
    You need to keep in mind that graft incompatibility can occur. A seedling and
    scion from the same tree have the best chance of a lasting graft. Some trees are
    said to graft well like Szego; however, long term graft compatibility of Szego
    is still unknown.


    We will start out with a very simple graft known as the "splice" graft as it is
    simple to do and understand. We will then add an extra cut to the spice graft
    that allows for easier grafting and a splice graft with an extra cut is known
    as a "whip and tongue".'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'Collecting scion wood in very early spring is best. After 48 hours of nonfreezing
    temperatures is to collect your scion wood. Scion wood is the wood that you will
    be grafting onto your root stock. Cut the dormant wood from last year''s growth.
    Last year''s growth is the last 12 inches to 24 inches of the branch that is still
    green and smooth. Wrap the scion wood tightly with plastic wrap and put into a
    water tight sealable bag and store in your refrigerator


    When the temperatures are consistently above 60 degrees Fahrenheit you can graft
    to trees planted outside. Otherwise you can graft to trees in a protected environment
    any time after collecting your scion wood.


    You can graft using a new utility knife or a specialized grafting knife. A utility
    knife is ultra-sharp but the blade that a grafting knife has a longer blade to
    aid slicing the graft wood. You will also need Parafilm or similar wax tape and
    a brush on "grafting sealer" or similar to make your job much easier. You can
    use letding rubbers or one inch plastic tape; we find Parafilm and a brush on
    grafting sealer to be the easiest and a time saver and readily found in big box
    home stores, farm stores and internet sellers. By time saver once you start cutting
    your scion wood and root stock, you want the edges of the scion and root stock
    to be placed together as quickly as possible and sealed before they can start
    to discolor and oxidize. A tidbit of information that seems to be lost on all
    the videos and papers we see about the subject. Further study on this aspect of
    grafting is needed and as we have time to experiment. Once you join the scion
    wood to the root stock you need to seal the graft, to prevent the wood from drying
    out so the graft can callus and become one.


    A splice graft is simply matching up the diameter of the scion wood to the same
    diameter wood on the root stock. Having both pieces of wood match the cambium
    will have the best chance of allowing for the normal flow of vascular tissue,
    proper callusing and growth. Cut the wood at a steep angle and as straight as
    possible on the scion wood as shown in Figure #8-10. Then cut the root stock at
    the same angle. You simple match up the two cuts and tape with Parafilm. Stretch
    the film a good 30% or more as you wrap the graft to seal and give strength to
    the wrap.'
