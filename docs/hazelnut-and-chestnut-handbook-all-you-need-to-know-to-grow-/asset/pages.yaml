- img_proc: true
  md: 'soil pH is often above 6.5 pH as the site has most likely had lime applied.
    This is the case that we often run into and have to apply Sulphur. A rule of thumb
    on applying Sulphur is 250 pounds per acer per application. Wait three months
    and test the soil. Ideally, you are able to incorporate the Sulphur into the soil
    by rototiller or disking to activate the Sulphur to be utilized by microbes to
    lower the pH. You will have an idea of how much Sulphur you need to add by testing
    your soil and is the next topic of discussion.


