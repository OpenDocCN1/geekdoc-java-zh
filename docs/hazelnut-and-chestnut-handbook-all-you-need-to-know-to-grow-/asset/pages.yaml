    the bangers, as we knew they only worked for a short while and the birds grew
    accustomed to the loud bangs below and irritate the whole neighborhood. A loudly
    played bird in distress call from different birds made sense to us. An example
    of one manufacturer is “Bird Speller Pro” by Bird-X. BirdSpeller Pro has prerecorded
    calls from birds in distress and birds of prey, from multiple different birds.
    The recorded bird sounds are on a programmable timer and can be played in order
    or random. You can turn off some birds for a period and turn them back after a
    couple of days. We have found that the electronic programmable bird in distress
    call works wonders. We highly recommend them to be used when the nuts are beginning
