  md: 'Gates can be formed using plastic fence and hung much like a shower curtain
    or using a prefabricated metal gate with hinges screwed into the side posts. Before
    the gate is put in place, each side of the gate must have two posts with cross
    brace(s) just like a corner to handle the fence tension and stress of the gate.
    The tension wires for the gate start at the top of the gate post opening and are
    wrapped around the side post base and then tensioned.


    If you want to use the plastic fence just a wire at the desired height of the
    fence and hang the fence with multiple carabiners and repeat for the bottom perimeter
    wire. Both types of gates are shown in Figures #4-7a and #4-7b respectively. Stiffen
    the opening of the fence gate with two strips of wood placed on both sides of
    the gate edge and use wood screws to sandwich the plastic fence. The wood strips
    (two 8 ft. long, 1" x 3" furring strips) will allow you to pull the gate closed
    and strap the gate tight to a side post. This is a very low cost gate that works
    well and will still allow you to drive your truck, ATV or tractor through the
    gate.


    # TYPES OF FENCE


    Plastic versus wire fence is your preference (you know your preference already!)
    and your preference may well depend on the equipment you have available. An eight
    foot tall, 330 foot long metal fence weighs up to 400 pounds and is very difficult
    for two healthy strong people to move in the fence and lift on and off a truck.rollingrolling
    and lifting the fence to tension requires three or more people and it is best
    if you can run a fence installer/stretcher that mounts to a tractor 3pt hit as
    shown in Figure #4-9. Plastic fence, on the other hand, is fairly light and a
    330 foot fence my 100-pound wife can handle by herself as shown in Figure #4-10.
    Actual fence attachment should be done following the fence manufacturers recommendations.
    If you don''t have access to equipment that will allow you to handle the heavy
    metal rolls of wire you may want to consider plastic fence. Plastic fence may
    cost less than wire fence, but you have extra cost and labor with the wire at
    the top and bottom of the fence and in the end the cost is pretty similar per
    linear foot. Our assumption is the deer fences made of plastic will last 5 to
    7 years. Sun degrades plastic'
