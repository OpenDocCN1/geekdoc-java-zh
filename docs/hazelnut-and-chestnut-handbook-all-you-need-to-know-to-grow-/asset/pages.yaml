  md: 'Apply with a brush at the base of the stem where you wounded the stem and completely
    around the stem. Some hazel bushes only grow roots where you wounded the stem
    and others grow roots all around where you put the IBA hormone.


    Buy Indoleric Acid salt (K-IBA or IBA-K) at your local hydroponics shop, nursery
    center or on line at eBay or Amazon. Use two grams per liter of distilled water
    for 2000 parts per million stock solution. Store in tight jar and out of the sun
    and heat.


    Next you need to wrap the tap paper or plastic around the hazelnut suckers and
    staple them together and stake the wrap to the ground as shown in Figures 5-7
    and the ends 5-8. Fill the wrapped hazelnut suckers with the compost you pulled
    away and add more compost or potting soil, six inches deep or three inches above
    the hormone application as shown in figure 5-9.


    In the following spring just as the ground thaws, pull the tap paper or plastic
    away and save if in good condition for reuse. We have some plastic wrapping material
    that is over 7 years old. With your fingers gently pull the compost and potting
    soil away where there are no roots. Next gently dig your fingers underneath the
    potting soil and between the native ground level. Work your way to a stem and
    use your prun to cut the base from the mother tree. Often some roots will be entangled
    with the neighboring sucker and you will have to work your way to the adjacent
