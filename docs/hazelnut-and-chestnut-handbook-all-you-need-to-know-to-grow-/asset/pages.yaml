- img_proc: true
  md: 'and twist the stick around the wire until the loop is twisted tight as shown
    in Figure #4-5. The stick used to tension the wire is called a “twitch stick.”
    Leave most of the stick on one side of the wire as you go to tighten the wire,
    as you will then screw or tie the stick onto the cross brace to hold the tension.
    If you used the high-tensile wire for the loop you can use what is called a “Grapple”
    to join the ends of the loop. A grapple allows the wires to pass through in only
    one direction and cannot be pulled out. A special tool for grapples to tension
    the wire is aptly called the Grapple Torq Tensioning tool, and the cost for the
    tensioning tool ranges from $50 to $100.


    A fourth method to join wires, is a “wire strainer” or a “wire tensioner” that
    you tie one end to and wind the other end on a small spool using a “in strainer
    tool.” The tensioner and the strainer tool cost less than $5 and $8 respectively.
    The wire will stretch some initially and over time this gives you a method to
    re-tension the wire. Both items are readily available at most any farm store and
    is the most common method used after crimps. We have found “crimps” don’t work
    as well as “wire strainers” or grapples, as crimps will tend to slip over time.


    To review the four methods to join wire is: simply twist the wires, use crimps,
    use grapples or use wire strainers as shown in Figure #4-8. We have found the
