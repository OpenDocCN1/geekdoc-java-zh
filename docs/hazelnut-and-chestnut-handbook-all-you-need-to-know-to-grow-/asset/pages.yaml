    # CHESTNUT BLIGHT


    Chestnut blight completely wiped out the American chestnut and is now considered
    “functionally extinct,” and this is why we are growing imported trees and hybridizing
    them from Europe, China, Japan and Korea. Chestnut blight is caused by the fungus,
    Cryptonectria parasitica. Although all the information contained in this chapter
    works well for American chestnuts, our energies are aimed at “orchard trees” with
    large sweet nuts and blight resistant trees. Your blight resistant Chinese trees
    will get blight. Those trees should heal from it unless the hybrid offspring you
    have didn’t inherit enough genes to give protection, hence the double planting


    In Europe, they were a bit luckier than here in North America as their trees did
    a better job coping with the blight and had a bit of luck where they had weakened
    forms of blight fungus that infected the more virulent forms of chestnut blight
    fungus. The weakened form of blight is known as hypovirulence and slowed the chestnut
    blight progress allowing the trees to'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'live with the weakened blight. Many European trees still died but ever so slowly.
    Some trees where healthy enough to keep producing nuts. Hypovirulence is also
    found here in the states, and we hope it becomes established wherever chestnut
    is planted.


    And when your trees get blight and if it has good blight resistance, it will wall
    off the canker and heal where the blight has killed the bark. The blight isn''t
    healing in Figure #8-6 and Figure #8-7. If you see a blight canker getting to
    where a third of the circumference of the trunk is getting consumed you have a
    choice to make. Cut the tree down as part of the thinning process or combat the
    blight with “mud packing,” also known as “SoilCompress[87].” Once the canker gets
    halfway around, the tree will start to get weak from not able to send nutrients
    up and down the trunk. A telltale sign the tree is struggling is an increase in
    the number of suckers that growing at the base of the tree is a sign you need
    to take the time to figure out what the problem is, and it will usually be blight.


    Your tendency will be the cure; however, if the canker grows halfway around the
    tree and the tree is 4” or larger in diameter, we would thin the tree out. Sometimes,
    one-or-two-year-old trees will get blight and had the stem is so small it only
    takes a small canker to kill the tree. If it is a seedling, we would let it sprout
    and it could just be random luck had a canker. If it is a grafted tree, you will
    have no choice but to dig it up and replace it with a new grafted tree or replace
    the graft with new scion wood. Hence, you want to learn how to graft.


    The concept of mud packing works is as simple as we know that chestnut blight
    doesn’t survive in the soil because the roots stay healthy as they are able to
