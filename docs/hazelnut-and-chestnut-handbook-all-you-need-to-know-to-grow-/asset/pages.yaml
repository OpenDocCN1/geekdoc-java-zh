    # Figure #4-31, Diagram of a drip irrigation system.


    Luckily, in the Northeast and through to the Midwest we are blessed with plenty
    of rain throughout the year. We generally don’t suffer long duration droughts
    or no rain for many months a year much like the Northwest. However, by putting
