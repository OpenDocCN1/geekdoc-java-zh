    you to encounter.


    # JAPANESE BEETLES


    The Japanese beetles (Popilla japonica) are easily identified by their shiny copper
    and green-shelled bodies. They appear as adults in June and July and congregate
    together on a few leaves. It is understood that pheromones from the first adults
    to appear on a tree causes other emerging adults to fly to the same spot. Where
    they congregate, they skeletonize the leaves and ultimately whole sections of
    the tree. Trees that have whole sections stripped of leaves have to be slowing
    the growth and nut production. The life cycle of the beetle starts out as eggs
    deposited 2 to 3 inches in the ground by the female mid-summer laying less than
    six eggs at a time. The female may repeat the process and lay anywhere from 40
    to 60 eggs over the summer. The white eggs hatch and the grub feeds on the roots
    over summer and fall and then the grubs winters over. In the spring, they again'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'feed on the roots for a few weeks and pupate. A couple weeks later, they emerge
    as adults to begin the cycle again.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_109_0.png)


    Figure #4-26, Photo of adult Japanese beetle courtesy of Wikipedia[18]


    We have been able to keep damage to hazelnut trees to date to a tolerable level
    by the use of pheromone traps. The traps are readily available at most home stores.
    There are two major items to remember when using traps. You need to put them out
    before you see the beetles. We told you the first beetles to attract more beetles
    as they emerge, and you need to have the traps be the attraction they seek. The
    second item is to put most of the traps upwind and outside of your orchard. When
    you buy the traps, you will notice they give you multiple bags. The traps work
    by luring the beetles to the trap opening where they hit or land on the slippery
    plastic and drop into a bag below. If you find that the trap fills up in a couple
    days you need to buy more traps. Remember to keep the traps outside your orchard
    as you do not want to bring beetles to your orchard.'
