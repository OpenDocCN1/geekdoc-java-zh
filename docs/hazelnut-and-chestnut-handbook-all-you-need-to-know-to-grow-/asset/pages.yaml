  md: '# CHAPTER 7- ORCHARD ESTABLISHMENT COSTS


    We look at the costs involved in establishing a 2.5 acre and 10 acre orchard following
    what was prescribed in the previous chapters, we will illustrate establishment
    costs. We will use the U-Pick orchard style of hazelnut orchard as it can also
    be mechanically harvested with a blueberry harvester once the yields economically
    justify it. Seedling tree spacing will be six foot in row by 16 foot spacing between
    rows for about 455 trees per acre. We will also show the same orchard costs for
    a known cultivar on an eight foot by 16 foot spacing for about 303 trees per acre
    using 80% cultivars and 20% seedlings. The seedlings in the cultivar will be on
    a six foot spacing for pollination insurance and to find the next superstar tree.


    The hazel establishment costs will be a comparison of three seedling and cultivar
    arrangements:


    +   1. A seedling only orchard - Seedling tree spacing will be six foot in row
    by 16 foot spacing between rows for about 455 trees per acre.

    2. An orchard of 80% cultivars and 20% seedlings - The cost for the known cultivar
    orchard will be on an eight foot by 16 foot spacing for about 303 trees per acre
    using 80% cultivars and 20% seedlings on a six foot spacing for 333 trees per
    acre.

    3. A double planted orchard just using seeds. The double planted seedlings will
    be on three foot spacing.


    We chose an eight foot by 16 foot spacing for cultivars based on the bush being
    larger than native hazel bushes. Final row spacing should be discussed with your
    supplier of the cultivars. From the establishment cost tables it is easy to recalculate
    per acre costs based on the number of trees per acre.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The reason we give the seedling and double planted seed orchard is due to many
    people plant in this manner despite everything we discussed in this book. Part
    of the problem was lack of available cultivars to buy. New cultivars are now being
    released at a rapid pace.


    We developed a ten-plus page spreadsheet for a full-fledged business plan using
    fully loaded costs as if your business was fully developed using external labor
    and all possible equipment expenses along with the routine orchard maintenance
    and depreciation. In reality, we know that this is a long-range development plan
    in a new industry where banks will be hesitant to loan money for a hazelnut or
    chestnut orchard. In time, this will change, but for now we assume you will be
    using your own labor and have the land for orchard establishment. We only have
    to come up with the costs for the fence, trees, soil amendments, and fertilizer.
    There are also mulch and basic hand tool costs and they can be all over the map
    so we will take a mid-range pricing for costs.


    We have found if you procure what you need a year ahead of time as far as goes
    the cost is minimal as you procure it when someone wants it gone, as in wood chips.
    For example, if you let your town Department of Public Works (DPW) know that you
    want wood chips that don''t contain oak or black walnut and provide an easy access
    dump place, you may be pleasantly surprised by how many loads of wood chips you
    get delivered for free. A mantra we try to live by when appropriate is, “If you
    don''t ask you won''t get.”


    Land costs have a wide range and can run from $1000 per acre to $100,000 per acre.
    We are pushing that we use the fallow hillside land throughout the Northeast and
    can readily be purchased for under $2000 per acre. For reference, hazelnut land
    in Oregon and British Columbia runs from $15,000 to $100,000 per acre. The land
