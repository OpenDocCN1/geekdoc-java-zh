    over time the roots grow the field will need to be adjusted. By now, these steps
    would seem very familiar except we substituted Sulphur for chestnuts where we
    talked about lime previously that hazelnuts may need.


    +   4. **Orchard plan and planting** Chestnut trees are much larger than hazelnuts
    and will need a facil spacing of 20 x 20 at a minimum and over 25 years may need
    to be thinned to 40 x 40 foot spacing. Initially, the current efforts are to plant
    seedling trees 10 foot spacing in a row and rows 20 foot apart. Then thin to a
    20 foot by 20 foot spacing after 10/12 years. Others urge planting grafted trees
    of known cultivars, if you are armed with knowledge about their issues, which
    we will describe in further detail.


    +   1. When it comes to harvesting chestnuts the orchard layout is the same for
    a U-Pick or a commercial orchard planting.


    +   2. In the Eastern half of North America, the most common method is to plant
    hybrid seedlings from named varieties at double density (10 x 20) and trim out
    half of the least productive ones as the orchard gets crowded. You need to select
