    Breeders have built up the early work of Mr. Weschchke, with follow on and new
    efforts by Mr. Grinnell, Mr. Farris, Mr. Gellatly, Cornell University, Mr. Rutter,
    Mr. Grimo and Z’s Nutty Ridge. Recently a surge of research to find EFB resistant
