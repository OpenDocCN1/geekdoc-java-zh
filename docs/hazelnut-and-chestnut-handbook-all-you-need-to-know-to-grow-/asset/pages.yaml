    A couple of years ago, we witnessed numerous blue jays flying around the orchard.
    We took the time to stand frozen so we could watch their habits. It started out
    with a blue jay picking a nut from the husk and flying to the tree on the edge
    of the field. We quickly noticed that they were flying in pairs synchronously
    landing on a hazelnut, grabbing a nut and the pair would fly back to the higher
    native tree line. Just as the first pair returned to the tree line, another pair
    of blue jays flew down to repeat the process. The repetition was so fast that
    there was no way they had to crack the nut and eat it. We watched the same pairs
    repeat the process about 15 times. There is no way they ate nuts so fast; they
    had to be storing of them or just wasting them. We could be wrong, but we doubt
    it. We discovered this blue jay process just before we went on a day and half
    trip. We were eager to get back out in the field to see if they were still at.
    We went back to the six trees where they were stealing the nuts, and the trees
    were completely stripped of nuts. Literally, there wasn''t one left on the six
    trees. The war was on. We didn''t pick the fight, the fight came to us.


