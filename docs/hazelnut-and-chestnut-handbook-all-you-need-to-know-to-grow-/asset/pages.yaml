    Many of us aren''t cut out dealing with customers in a retail environment and
    all the associated headaches that occur. Some of us relish the thought of having
    a family come and enjoy a healthy day out with nature. If the latter attitude
    describes your vision of a hazel orchard then a U-pick operation may be for you.
    After all, in a U-pick operation pay you to pick nuts and then you are without
    follow on sanitation, drying, packaging and delivery if you are selling wholesale
    or to stores directly. although that sounds good there are more items to consider
    that we will discuss in Harvesting U-Pick in Chapter 6.


    # U-PICK ORCHARDS


    U-pick orchards using bush form is very similar to a Hedgerow orchard, but you
    need to have the customers be able to easily walk between rows or sections that
    you want picked. In bush form, the hazel branches remain flexible to allow for
    easy picking without the customers needing a ladder or climbing the trees with
    the associated liability or tree damage as shown in Figure #3-3.'
