    # BROWN MARMORATED STINK BUGS (BMSB)


    When it comes to Brown Marmorated Stink Bugs (Halyomorpha halys), the first few
    years we noticed them, the population grew every year and we felt we were seeing
    too many of them. However, we didn''t notice any major outside damage to the nuts.
    It appeared they wanted to eat through the shell and into the nut, but no significant
    damage could be seen on the outside of the shell. BMSB tries to drill through
    the shell and suck the forming nut dry. If the BMSB is successful in reaching
    the nut, it causes a shriveled, or a partially shriveled and/or an infected rotting
    nut. Assuming the population would continue to grow, we searched for control methods
    and again traps came up as a method to only monitor the BMSB not as a control
    method. The succeeding years, were less BMSB and now they seem to be at a lower
    level much like any other insect in the orchard and do not bother enough to worry
    about this time. We have Earwigs throughout our hazel canopy, and believe they
    pray on BMSB eggs and Earwigs maybe the beneficial insect keeping the population
    down. It appears that BMSB have one or two brood per year and the second brood
    is where the population dramatically increases [19] and so too can the damage
    to our nuts.'
