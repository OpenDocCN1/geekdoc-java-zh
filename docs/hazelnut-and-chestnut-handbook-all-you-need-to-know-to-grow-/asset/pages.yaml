    # LAYERING


    Layering is the process of creating a genetic copy (a.k.a. clone) of the mother
    tree. Orchards full of clones where a row is full of the same tree makes harvesting
    much easier. Clonal trees all ripen at the same time.


    You layer trees when you find that you have a superior tree growing from one of
    your seedlings. You should not copy varieties as you will most likely be breaking
    the law. Once, you realize you have a superior tree you want to duplicate it as
    much as possible and the easiest way to clone is to layer the tree. Besides some
    of your labor and some material, the cost is less than the shipping from a nursery.


    We have experimented to find this combination for our hybrid hazel trees that
    works well for most of our trees. We will explain the concept before going into
    details as we have done throughout this handbook. If you follow our process, you
    will pay for this book with every tree you create. We have watched videos and
    read extension bulletins that miss a couple of important details, our hybrid hazel
    needs, that will have much lower success than what we teach below. You will not
    get 100% success rooting every sucker that grows. However, you should get greater
    than 50% and can often get over 80% success using our method.


    Mound layering your superior hazel bush starts in late fall or early winter, long
    after harvesting your exceptional tree. You will cut off no less than 50% of the
    stems at the native soil line. Cutting off the stems stimulates the bush to produce
    suckers. Early in the following spring, just'
