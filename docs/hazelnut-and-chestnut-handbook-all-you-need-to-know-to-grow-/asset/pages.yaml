  md: '# CHAPTER 4 - HOW TO PROTECT YOUR ORCHARD


    You need to protect your trees from deer and rodents when young and deer at all
    ages using a fence. You may run into bird predation of your nuts as they near
    ripening and they can take a fair portion of your nuts too. Last on this list,
    and so to date is not a substantial problem in the Northeast insect protection.
    For a few trees deer protection is simple. Deer protection for an orchard is of
    a seven-plus-foot fence that can either be plastic or metal. We have learned this
    is a must for anyone who wants any nut orchard to maximize yearly growth and production
    in the Northeast.


    Getting started with a nut orchard is a heavy investment up front knowing you
    have to wait five to seven years for a good harvest. Therefore, we tackle the
    big ticket items like a fence with ways to maximize results for the least cost
    and effort.


    # FENCE PROTECTION


    We will start out by explaining what we have learned about deer protection. We''ve
    been told repeatedly from growers in the Midwestern United States that deer protection
    isn''t needed as they only curiosity browse and don''t do enough damage. That
    may be true when a deer has unlimited soybeans and corn to eat.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Here in the Northeast, that just isn’t true when we have over 50 percent of
    the land being fallow and returning to trees as we have explained earlier. We
    have watched many of the hazel trees unable to grow over four feet tall, and they
    would look like someone took hedge shears. They would stay this height for many
    years until the bush was wide enough for a few of the center branches to become
    taller than the deer could reach. We also planted a few trees in our yard and
    they would start out every year about 10 to 15 inches tall. After about ten years,
    the bushes were about four feet across and in the spring they would try to grow.
    The bushes would get about two feet tall and they would then be bunched back.
    It is necessary to understand what didn’t work well as what works so you don’t
    repeat at wasted efforts.


    # THE EARLY YEARS OF DEER PROTECTION


    We started just protecting trees with a four foot tall stiff wire fence surrounding
    the tree in a circular fashion. We put the fence about two feet away from the
    outer leaves of the trees that were held in place by 4’ or 5’ tall bamboo shoots.
    The five or six foot diameter circular fence would be free standing, but the fence
    needed stakes to hold up against the deer and wind. Deer would leave most of the
    leaves alone and the tree could out the deer browsing. This allowed us to move
    the fence for maintenance and put it back by pushing in the bamboo stakes and
    tying the fence with baling twine to the bamboo. The circular fence method of
    deer protection works well when you only have a few trees. When our tree grew,
    it became too labor intensive to move these small protective fences. We needed
    a better fence for all the trees. We asked around about deer fences, and one low
    cost option is to use a 7/8 foot tall seven-strand electric deer fence.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_68_0.png)


    Figure #4-1, Circular fence on a hazelnut tree and the tree is protected from
    deer and grew tall.


    The electric deer fence we built from 12 foot tall posts we cut ourselves, as
    we have areas in our field that were regenerating with numerous young straight
    20 to 30 foot tall trees that we wanted to grow hazelnuts on anyway. We cut down
    the trees and then cut the tops off so the newly made posts were 12 feet long,
    and then cut off the limbs. The usable trees were popular, ash, and maple. We
    knew they wouldn’t last long, but we were being as frugal as possible we questioned
    electric fence capabilities. We bought two solar-powered electric fence chargers
    for about $100 each. We bought four of the 4000 foot rolls of high tensile electric
    fence wire for around $100 each as well. We spent another $500 for insulating
    plastic pipe,'
