    # GALL WASPS


    The gall wasp is a particular type of bug that will make you rethink life. Seriously,
    the chestnut gall wasp does not as far as we know have a male as part of the species,
    as it has only females. The gall wasp of chestnuts is known as Dryocosmus kuriphillus
    and was first identified in Japan in 1941. The wasp in length is 2.5 to 3.0 millimeters.
    It produces galls in the buds of chestnuts and can significantly reduce yields
    and kill numerous branches by it infests. Gall wasp control can be had through
    biological controls by another wasp!


    The predatory wasp of the chestnut gall wasp larvae is commonly called a parasitic
    wasp^23 The wasp is called Torymus sinensis, is the natural predator in China
    where gall wasp originated. It was introduced to the US for Asian chestnut gall
    wasp control in Georgia in the 1970s, and its current range is being researched
    by Michigan State University^24 as it is understood to be well established in
    the Eastern half of North America.


    For some yet unknown reason, Bouche de Béitac, a European X hybrid, variety has
    shown a very level of resistance to gall wasp and is now a highly regarded variety
    planted in the Midwest US. Gall wasps may allow us to have another variety selection
    criteria going forward.'
