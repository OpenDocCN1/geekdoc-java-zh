    We determine success based on the percentage of suckers that produce a good clump
    of healthy roots when we dig them up in the spring thaw. Some stems swell and
    try grow around the nylon tie rather than grow roots. The stems that don''t grow
    roots often just break off at the nylon tie with a little sideways tug of the
