- img_proc: true
  md: 'after the snow melts, you will put down a four inch layer of potting soil or
    similarly loose, light weight, moisture holding compost. Extend the soil/compost
    a good six inches past where you cut the stems. If you use compost you need to
    know that it isn''t acidic and pH test it to be sure and keep in mind as compost
    decays it usually turns more acidic. By late May early June you will see suckers
    growing.


    By late June you will need to pull the potting soil or mulch away from the base
    of the tree and immediately prepare the suckers to root by wounding, putting hormone
    on the wound and tying off the stem from the base of the native soil and re-mounding
    the potting soil or mulch. This time you will need to keep the mulch in place
    by surrounding the potting soil with tar paper or plastic. Of course this is the
    summary as shown in Figure #6-1 and the details with many pictures will follow
    to allow a clear understanding of how to layer without worry.


    # Tree propagation - Layering


    +   * Most hazels produce suckers at base

    1. Trim stems late fall, potting soil at base Feb/March

    2. Let suckers grow, pull dirt away - June/July

    3. Scrape bark, + hormone, tie off

    4. Mound soil, wait till following spring, cut base at native soil


