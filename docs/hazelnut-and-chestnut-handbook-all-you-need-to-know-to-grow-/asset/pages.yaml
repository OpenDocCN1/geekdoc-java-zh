    # POSTS FOR CORNERS AND GATES


    Every corner will need three posts and a minimum of two cross braces. The cross
    braces can be wood or metal. The braces are used to reinforce the corner post.
    The cross brace is then held in place by wire that is tensioned from the top of
    the side post the bottom of the corner post at a minimum. Also, if you want extra
    stiffness place another wire loop from the top of the corner post to the bottom
    of the side post. The two wires form an X cross brace is mounted about two-thirds
    of the height of the posts. If you are concerned the posts aren''t stiff enough,
    you can use two cross braces on each side of the corner. Place the braces about
    halfway and 90 percent from the top of the corner posts. A hollow metal post can
    be used as a cross brace as well. A hollow post is hung by drilling a hole for
    a brace pin on the side or corner post and is hung the same as a wood post.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_80_0.png)


    Figure #4-7a, A hinged metal gate with one cross brace using 6” by 6” pressure
    treated posts.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'You can use a metal “T” post instead of a wood post as a cross brace, the length
    of the cross brace is used to measure where the side posts are placed. For example,
    if you use a 12 foot metal post as a brace, the two side posts are placed 12 feet
    apart from the center of the corner post to the center of the side post. A hole
    is drilled the diameter of the metal post one third of the way into the corner
    and side post. The metal cross brace is inserted into the holes.


    If a wood cross brace is used the side post is placed just so the wood cross brace
    just fits the space between the corner post and side post. This means if you are
    using six-inch diameter posts, the spacing will be 12’ 6” between the corner post
    and the side post. Should the posts not be the ideal spacing, you will just cut
    the cross brace to fit. The cross brace is held in position using a metal “brace”
    pin. You can buy 8 or 10 inch metal brace pins that are 5/16 inch in diameter
    or similar diameter. You can also make your own from any sized diameter metal
    rod like a 4 ft. post or reinforcing rod you will need to drill a hole the same
    diameter as the pin. To hang the cross brace with the pin you will screw in a
    short piece of 2” x 4” as a cleat or have someone hold the cross-brace in place
    while drilling a hole through the post and a couple inches into the cross-brace
    as shown in Figure #4-6. We then pound in the metal pin through the post into
    the cross-brace, leaving about an inch of the pin sticking out to wrap the tension
    wire on. The cross-brace is actually able to spin on the pin. The tension wire
    is wrapped onto the side top brace pin and the corner post near the bottom using
    a fence staple and are wrapped into a loop and tightened to hold the cross-brace
    in place. You have options on how to tighten the tension wire.'
