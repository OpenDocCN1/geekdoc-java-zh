  md: '# CHAPTER 3 -HOW TO MAKE THE ORCHARD WORK FOR YOUR NEEDS


    # ORCHARD TYPE – COMMERCIAL, U-PICK, PERMACULTURE, SILVOPASTURE, ETC.


    Depending on the type of orchard you want and the type(varieties) of hazels you
    plant will determine the spacing. Keep in mind that native hazels will typically
    be six to eight feet tall and not more than ten feet tall. Hybrids hazels crosses
    of American and European can be up to 20 feet tall. Therefore spacing will be
    a bit more for the hybrids then pure American hazels and have your tree supplier
    let you know the expected mature height of the tree.


    Different plantings include:


    +   - **Hedgerow type** for windbreaks, riparian buffers and conservation plantings,
    while generating food.

    - **Hedgerow orchard** using bush form of hazels.

    - **U-pick orchards** using bush form for easy picking of nuts without ladders.

    - **Single stem commercial orchards** for tree form varieties of hazels.


    # HEDGEROW


    Hedgerow plantings are for windbreaks where typically the trees have little protection
    themselves; but, the trees provide windbreaks for crops and'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'shelter for animals. Hedgerrows can be used to divide large fields along the
    edge of woods as an understory planting. Also, as riparian buffers they are planted
    between your annual crops and where the water drains to wetlands to absorb any
    nutrient runoff from the fields. We know many hunters plant hazelnut, chestnut
    and oak to provide mast for wildlife.


    To form a dense hedge of trees requires that you let the trees produce suckers
    to allow a bush to form. Meaning you don''t have to do anything extra when the
    trees are growing, but make sure they have enough water to get established. We
    will cover irrigation in detail in Chapter 4 Irrigation. If you want the trees
    to reach their full potential, the plants only six or seven feet apart. If you
    want a hedgerow quickly, you can plant the trees three feet apart. You want to
    plant either American or hybrid American and European (Coryrus avellana X americana).
    American hazels will typically be six to eight feet tall and as wide. Hybrids
    will be from six feet in height to 20 feet when fully mature. To create a dense
    nearly impenetrable fence plant two rows to five feet apart, alternating the spacing
    within the row as shown below.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_52_0.png)


    Figure #3 -1, Top down view of a year old hedgerow and after eight years.


    # HEDGEROW ORCHARD


    Hedgerow orchard is the style being promoted by the Upper Midwest Hazelnut Development
    Initiative (UMHDI) [14] program. The tree plant spacing is from three to six feet
    in Row with a 15'' row spacing. When growing a hedgerow orchard for commercial
    production the trees are planted in a perfect line to enable mechanical harvesting.
    There are 484 plants per acre at 6'' spacing, and 968 plants per acre at 3'' spacing
    in row. Again, the trees are allowed to grow in bush form using American or European
    hybrids. Please check with your tree supplier as larger bushes need more spacing
    than three feet. Keep in mind that an acre of land is 208.7 feet by 208.7 feet
    squared or 43,560 square feet.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'An alternate layout is to have row spacing alternating between 10 feet and
    18 feet. So you end up with two rows only 10 feet apart and then a row that is
    18 feet apart. This spacing really only works if you plan to use a mechanical
    harvester. The two rows that are 10 feet apart will fill in and be very difficult
    for you to walk between them when the trees are fully mature. The 18 foot spacing
