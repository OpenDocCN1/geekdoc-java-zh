    # POST INSTALLATION


    Putting in metal posts in relatively soft ground can be done manually without
    renting or hiring anyone to do it for you. Metal posts can simply be pounded in
    with a “manual post punder” you can buy for less than $50 at your local farm store.
    A manual post punder is much safer and the only real way to safely pound posts.
    A post punder is just a thick tube about 20 inches long with a welded end-cap
    and two handles on the side. You simply slide the post punder on the post, lift,
    and drop it down on the post until it is in the desired depth. There are now “gas-powered
    post pounders” that range in price from $300 at Amazon or EBay to $1100 for a
    Skidril® brand.'
