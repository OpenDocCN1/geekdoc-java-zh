    Sanitize your tools with standard drug store 70 percent alcohol to kill microbes
    between trees. Just spray the alcohol on your tools and let it stand for 30 seconds
    and the microbes will die. Alcohol of 70 percent is just the right ratio of alcohol
    to water so it doesn’t dry too fast and not kill the microbes but strong enough
    to do the job. This procedure should be done on'
