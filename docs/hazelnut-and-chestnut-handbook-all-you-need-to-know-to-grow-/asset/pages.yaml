  md: 'Hazelnuts tend to be very upright bushes. Meaning, they typically will push
    a stem up six feet straight if they are well taken care of and have strong roots.
    Some transplants will be bushy at first, meaning they put up a few stems with
    side branches below three feet. The first year if there are multiple stems cut
    back to the strongest stem during dormant time of winter. If there is only one
    stem but many branches, cut the side branches off. We need to get the central
    leader tall enough before any side branches occur, otherwise it will make harvesting
    difficult. Make sure your stock is of tree form to allow the height needed for
    a single stem tree. The proper height before side branches is about three feet.
    Again, make sure you know your genetics from the nursery you bought your trees
    from.


    In second or third year during the dormant time of winter if the tree has reached
    about five feet tall you will prune to form a scaffold with an open center. This
    means leave the first side branch at three feet and another every six inches or
    more up the main stem if you have four or five lateral branches and cut the top
    stem out. If you find the tree isn''t tall enough, leave the center stem to grow
    another year and form the remaining side branches before pruning the center stem.


    This brings us to the next level of tree planting knowledge. What type of trees
    do we plant? Local native trees or locally selected hybrid seedling, or locally
    derived clonal stock or hazel nut grown on the West Coast grows well there and
    hope for the best here? What is the difference between seedlings and clonal stock?


    # WHAT TYPE OF TREES DO WE PLANT?


    If you are going to be a passive grower and only want a windbreak and some food
    for you and wildlife, these seedlings are all you need. If you intend to have
    a professional operation and expect a return on your money and effort, you will
    need clonal stock tested for your region. Many of our plans will initially fall
    fall between a simple wind break and the heavily mechanized commercial orchard,
    like a U-Pick operation with a bush form of tree. Well, the difference between
    a nut of a seedling tree and the nut from clonal stock is most often night and
    day.'
