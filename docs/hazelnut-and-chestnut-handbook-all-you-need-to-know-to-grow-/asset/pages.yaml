    # # HARVESTING U-PICK


    A U-Pick operation doesn’t need any equipment to harvest nuts, only the consumer
    to come to your fields at the correct time. For a U-Pick operation, the equipment
    is the marketing needed to get the customer to arrive when needed. The customer
    will get the full-farm experience from your U-Pick operation. Your customer will
    have an outdoor unplugged experience, harvesting their own food, in the middle
    of a picturesque orchard. Of course, there is more needed for a U-Pick operation,
    like parking and roping the region to be picked as discussed in Chapter 3. For
    the customer to have a full experience, you will need to add more items as we
    discuss below.


    We have found that customers do not want to crack and separate the nuts themselves,
    except to have the experience for about five minutes. After five minutes of cracking
    nuts by hand, the appreciation for the bag of nuts that are ready to eat becomes
    obvious to the most ardent foodie gardener. To make sure they can “enjoy” the
    experience, have hand nut-cracking stations. After a few minutes of enjoying the
    experience, they will gladly let you take care of the cracking. Then to further
    aid the customer and revenue,'
  merge: -1
