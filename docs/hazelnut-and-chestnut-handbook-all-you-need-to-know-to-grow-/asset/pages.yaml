  md: '# ORGANIC SPRAYS


    Organic sprays are listed by Organic Materials Review Institute (OMRI) and are
    ever changing with better understanding of microbes that make up our soil and
    plant extracts. Advances are accelerating, and we will make the prediction that
    the industry will equal chemical based pesticides within 15 to 20 years. Currently
    bio-based pesticide controls are approaching five billion dollars and chemical-based
    pesticides are around 80-plus billion dollars. To date, we do not spray for any
    pests, except for the time we had a massive outbreak of tent caterpillars migrated
    from the woods and literally coated our trees and our house. Also, a healthy microbiome
    in our soil reduces the need for fertilizers. The constant blooms in our lakes
    will require stricter controls on fertilizer runoff. Luckily, hazel roots are
    dense and are very efficient at holding the soil in place and minimizing runoff
    and is why they are used for riparian buffers.


    # IRRIGATION


    Young trees will need water after transplanting until they send their roots deep
    into the soil for the first two or three years. We highly recommend using drip
    irrigation. Drip irrigation is very economical and will save you an immense amount
    of time once you install the feeder lines. Irrigation is simply a 5/8" semi-flexible
    plastic line that you can buy in rolls up to 4000'' with slip on connectors and
    water emitters you punch in where needed. Connect the pipe to a filter, a pressure
    regulator, a check valve and to your water source. Once you see how easy it is
    to install the irrigation you won’t regret doing it.


    A nice thing about irrigation systems besides the low cost, the irrigation supply
    companies will design the system and give you a complete quote for the parts for
    free. So this section will educate you on drip irrigation to make sure the quote
    you get is what you need. In other words, you will have enough education to so
    you feel comfortable giving the irrigation supply the proper information. We will
    walk you through as if you just received all of your parts and you are installing
    the system.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'You need to provide your orchard layout of how many trees per row and how many
    rows and spacing between the trees. Also, tell them if you have any water restrictions
    and the water source we will discuss below.


    Unroll the irrigation pipe along a tree row and cut the pipe with a pair of heavy-duty
    scissors at the end of a row leaving a few feet extra beyond the last tree. Use
    ground staples to hold the pipe straight and tight to the ground. The unrolling
    of the pipe can be a bit frustrating and the pipe having been in a roll doesn''t
    want to straighten out. It is best if it is a hot day with sun to unroll plastic
    pipe. The plastic pipe will be much more pliable than a cold cloudy day, so plan
    for proper weather. Again, we wish someone told us this. Repeat for all tree rows
    and the pipe along all in your orchard.


    On one end of the orchard, on the end of every row, insert a plastic “tee” at
    the end of all pipes. Join all the pipes together with more pipe between the tees.
    Depending on how many trees in a row and how many rows, this pipe feeding all
    the rows may be larger in diameter and let the irrigation supply determine this
    for you. If possible, the end of the orchard with the feeder pipe you just installed
    is at the higher elevation end to help with draining the system in the fall. You
    do not want water sitting in the pipe as it is possible the pipe will split if
    the water freezes. Stake the “feeder” pipe, sometimes call the “head” pipe, to
    hold the plastic in place. Optionally, if you are not in a rush to get water to
    your newly planted trees, you can sleeve the feeder pipe with a somewhat larger
    PVC pipe or bury the pipe in a shallow trench so you can drive and mow without
    having to disconnect the feeder pipe. Otherwise, you will have to avoid mowing
    near the feeder pipe as shown in Figure #4-30.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_118_0.png)


    Figure #4-30, Slipping on Schedule 40 PVC pipe over the feeder pipe to-bury. Notice
    copious mulch in the rows.


    You then need to connect the head pipe to a water source with a check valve, a
    pressure regulator and a filter as shown on Figure #4-31 and #4-32. Adding a filter
    may be optional if you know your water source is clean like from a municipality
    or is pre-filtered elsewhere. For insurance, install a filter anyway. If the water
    is from a pond or stream you must filter the water emitters or will plug, and
    you will have wasted your time. You will need to buy a pressure regulator as municipality
    water pressure is too high and typical water pump pressure is too high as well.
    If pressure is too high, it will burst the flexible irrigation pipe at a connection
    and waste water long before you notice it with damage to your orchard. Purchase
    the regulator from the pipe manufacturer to make sure you are using the correct
    pressure that the water emitters need. The pressure regulators are inexpensive
    at'
