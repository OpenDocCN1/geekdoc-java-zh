- img_proc: true
  md: 'So a fundamental decision is whether to plant seedlings of named cultivars
    or grafts is up to you. Rt. 9 cooperative is composed of growers that mainly grow
    seedlings and they are successful. Seedlings are vigorous, and about half will
    carry the production and nut quality of the mother tree. Chestnut orchard trees
    have been propagated for hundreds and even thousands of years. Seedling trees
    take longer to produce nuts than grafts generally, and start producing a couple
    years three or four with decent production by year seven or eight. Grafted trees
    have the maturity of the mother tree and want to produce nuts right away. Don''t
    allow too many the first few years, other than to satisfy your curiosity, as you
    want the tree to put on good first fruit. Graphs also cost much more ($15-$35
    ea.) than seedlings ($10), gives you the knowledge that grafts will provide higher
    yields early on and will carry the quality of the original mother trees'' name.
    So whether you plant seedlings, grafts or plant, learning to graft is a useful
    skill. Grafting is easy to learn but takes a few years to get good and feel comfortable
    with it. You will have years to learn how to graft well so don''t fret.


    # THINNING


    Seven to ten years after a double planting a seedling orchard, the tree branches
    start to shade or touch adjacent trees. Also within this time period, you will
    learn what trees are productive, blight resistant and have adapted to your fields
    climate and conditions. The trees that are not doing you will need to remove via
    tree saw or chainsaw even to the soil surface. The tree will try to resprut but
    just mow the sprouts and the roots will run out of energy and their decomposition
    will aid the neighboring trees. You feel bad for removing trees, but think of
    it as you are removing the weaker unproductive trees that will probably be shaded
    out as the trees get large and it will die a slow death anyway. Remove half of
    the trees over a two to five year period once they start to crowd each other.
    As you remove some of the trees the canopy opens and you really start to put on
    size. Chestnut trees are really fast growers. We have seen chestnut trees be 12
    foot tall at the end of their third year (third leaf) of growth.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Thinning out the weaker or unproductive trees the perfect grid pattern they
    were on disappears. Some trees will be ten feet apart while some others may be
    30 or 40 feet apart. Don’t let that bother you. If you feel there is wasted space,
    you can replant large open areas with a tree or two. After half of the trees have
    been removed, you will average 108 trees per acre. In honesty, over time this
    spacing will be too tight.


    After twenty years, the 20'' x 20'' spacing will become crowded, and you will
    have to thin further. Final spacing for a mature chestnut orchard can be up to
    40'' x 40'' for only 28 trees per acre. People are reporting that a 30'' x 30''
    foot is manageable. However, it will depend on your tree size as they are hybrids
    and the form and height may vary. Also, pruning may be needed to keep the tree
    crowns crowding each other.


    You will know when it is time to thin further as tree branches will intertwine.
    If trees are very productive and you do not want to thin, then pruning is an option.
    We have seen severe pruning to keep trees small and productive. Keep in mind this
    year’s growth is next year’s flower buds. Pruning is especially important in the
    first few years to shape the trees to enable you and your equipment to navigate
    the field and start the tree with a good shape for proper growth.


    Planting your tree is the same as described in Chapter 5 Planting Hazelnuts. The
    only difference is to ignore anything about lime and tree spacing as we have substituted
    Sulphur for lime and tree spacing is only 10’ in row and 20’ between rows.


    # PRUNING


    You need to prune for the first two or three years to get proper tree shape as
    shown in Figure #8-1.'
