  md: 'zone. We provide a potential list as a start for you to select.


    +   3. Chestnut trees are grown as a single stem tree. Chestnuts produce some
    suckers that will need to be trimmed. Chestnut trees will also need to have the
    lower branches pruned off the first few years to promote an upright growth and
    allow the needed clearance for you and your orchard equipment.


    +   5. Maintenance and pests require that you diligently make sure the young trees
    have enough water for the first two years at a minimum and keep all weeds away
    from the base of the tree. Since you made the soil was adjusted you won''t need
    to do any fertilization the first year. You should only have to watch for leaf
    eating bugs like Japanese beetles, caterpillars, or army worms. Japanese beetles
    can be greatly reduced by putting a couple of Japanese beetle traps outside of
    your orchard and monitor. Generally, you won''t have worry about any pests until
    the tree produces nuts, we have chestnut weevils, some regions have gal wasps
    followed by blossom rot that can reduce the quality and yield of the crop. There
    is also phytophthora root that will kill your tree in the southern portion of
    the US if your tree isn''t planted in well-drained soil.


    +   6. Rodents during establishment are a controllable problem. We watch for birds
