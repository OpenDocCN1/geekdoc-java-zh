    # WHAT SHOULD I EXPECT PER ACRE ?


    From a financial standpoint, hazelnuts are an ideal specialty crop as they are
    in continuous short supply and have high profit margins. Retail pricing for shell
    hazelnuts averages $6 a pound, and shelled raw bulk hazelnuts are currently selling
    for $12.99 a pound in local grocery stores. The cost per pound of hazelnuts currently
    limits consumption. The future for increased hazelnut consumption is excellent,
    as Europeans consume up to eight times what an American consumes.


    Hazelnuts provide a very profitable income well above any annual grain crop, after
    the necessary six-year wait before the trees produce a significant amount of nuts.
    Assuming only 2000 pounds of nuts (up to 3800 lbs. which should be attainable)
    at direct wholesale pricing of only $2.50 per pound (we currently sell for $3.50
    per pound) amounts from $5000 to $13,300.00 per acre. In contrast, the average
    corn crop yields 160 bushels per acre in New York at a current price under $4
    per bushel, is only $640 per acre. Hazels require similar annual input costs as
    corn and organic'
