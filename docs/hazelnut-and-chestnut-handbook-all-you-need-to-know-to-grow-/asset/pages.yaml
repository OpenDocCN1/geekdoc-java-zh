    # INTERNAL KERNEL BREAKDOWN (IKB)


    Internal Kernel Breakdown (IKB) isn''t caused by a bacteria or fungus that we
    know of. According to the late Dr. Fulbright, they could not isolate what was
    causing the chestnut kernel to turn brown as if it had some fungal infection.
    What Dr. Fulbright[90] was able to determine that is due to hybridization of Chinese
    and European varieties there was a very negative outcome when a hybrid variety
    named Colossal was pollinated by a Chinese or hybrid tree. We have yet to prove
    otherwise, and it could be isolated to the Colossal variety being pollinated by
    hybrid Chinese hybrids. Colossal variety is the most widely planted chestnut tree
    on the West Coast'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'and was chosen to be widely planted in Michigan. Colossal in Michigan was a
    great success until they discovered orchards with mixed plantings were having
    problems with IKB. The current recommendation is to have Chinese and hybrids 1000
    feet from Colossal.


    What other combinations of hybrids between European and Chinese could cause the
    same outcome we do not know. This is the very outcome that Genetically Modified
    Organisms (GMO) antagonists would outcry upon hearing and demand that GMO be halted.
    We know that hybridization between chestnut species can cause male sterility in
    these and male sterile trees often are selected as high production trees, like
    Schlarbaum and Boucher de Betic. It is believed that the energy that would normally
    be spent on growing catkins is available to grow nuts.


    # HARVESTING


    Harvesting chestnuts is a very straightforward effort. When the ripe chestnut
    falls to the ground, you pick them up. That is really all there is to a nutshell,
    if you appreciate the pun. We all know simple concepts need details to be consistently
    successful. The details are as follows, chestnuts open when ripe and the nuts
    fall from the most of the time with a little wind. Most of the times sometimes
    the nuts may stick in the bur and when the bur drops you will see the nut and
    need to pop it out wearing very thick leather gloves or by stepping on the bur
    and rolling the bur under your feet. It is important to pick up the nuts every
    day that you can for two reasons. One reason chestnuts are starchy not only and
    can spoil from mold quickly, and you want them off the ground as fast as possible.
    The second reason is to break the life cycle of chestnut weevil as just discussed.
    The equipment you need depends on how many trees you have and we walk you through
    what you will need to do.


    Harvesting can be by hand or with some assistance with a smaller Bag O Nut®[91]
    as shown in Chapter 3 U-Pick Orchard. There are other similar nut pickers like
    Nut Wizard®[92] or Garden Weasel®[93] that work well so you don''t have to be
    bent over and work great for a few trees or young'
