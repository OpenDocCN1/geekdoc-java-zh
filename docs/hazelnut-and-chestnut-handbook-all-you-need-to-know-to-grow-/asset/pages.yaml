    If you don’t have many nuts to dehusk you can use a “bucket husker.” A bucket
    husker is simply made from a five-gallon bucket and a hole is drilled in the center
    of the top and the bottom of the bucket. A rod (a.k.a. “all rod” or “all thread”)
    is placed through the center with pieces of rubber bungies tied or bolted to the
    rod. The rod is attached to a power drill on the outside of the bucket as shown
    in Figure #6-4 that we use. UMHDI has a design by Don Price[42] you can download
    and read. Simply fill the'
