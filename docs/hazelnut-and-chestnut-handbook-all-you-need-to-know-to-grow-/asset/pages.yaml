    # HARVESTING AND PROCESSING EQUIPMENT


    Most growers out West belong to a cooperative that accepts their nuts and processes
    them according to the required sanitary, quality and size requirements and markets
    them using the cooperatives name. A cooperative is a nonprofit that redistributes
    the money back to the growers of the nuts. A cooperative by accumulating many
    farmers orchards, they can justify buying commercial high-volume equipment that
    a single farmer cannot justify buying.


    Out on the Westcoast as the cooperatives are very large they tend to sell in the
    international commodity markets. As nut cooperatives in the eastern half of North
    American are just getting started it will be a long time before we can saturate
    our local market and need to sell on the international commodity market. We bet
    a couple generations before we get to that point.


    Out West, a hazel farmer will bring nuts to the cooperative that are relatively
    free of field debris and husks. The cooperative will inspect, measure the moisture
    content, sanitize, dry, size and possibly crack and sort the nuts.


    A cooperative that processes chestnuts will receive the chestnuts free of field
    debris and husks. The nuts will go through a heat treatment, sizing, inspection,
    sanitization and cold storage for a few weeks prior to shipping fresh nuts.


    Cooperatives can do further processing of the nuts by pressing hazelnuts for oil,
    and hazelnut flour and also drying the the less than perfect chestnuts and'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'grinding into flour. Anything other than selling in shell nuts requires further
    equipment, extra sanitary conditions, and licensing.


    A nut cooperative in Oregon recently built a new processing plant that cost over
    $20 million dollars last year. The new plant was to accommodate the increased
    volumes expected to be forthcoming. Our cooperatives in the eastern half of North
    America will start out very small with appropriately-sized equipment and often
    used or repurposing other equipment to accomplish our needs.


    # SOURCES OF EQUIPMENT INFORMATION


    Sources of equipment we have listed throughout this handbook for harvesting, but
    the processing side can be found by reading trade journals. If you are an equipment
    manufacturer you advertise in magazines that your customers read. The two main
    journals we read are Pacific Nut Producer[57] and West Coast Nut[58]. They are
    loaded with equipment manufacturers-selling, dryers, mechanical sorters, optical
    sorters, sanitizers, elevators, and a lot of the supply chain for growers as well.
    These trade journals have farm interviews, latest information on bugs and diseases
    and how well this year’s crop is doing along with commodity pricing of nuts.'
