  md: '# WHY HYBRID CHESTNUTS?


    Chestnuts, like hazelnuts, are native to our region and were a very important
    economic industry.[5] unto itself prior to 1940. The nuts provided food and cash
    for rural Americans, as nuts were loaded by the train car load and shipped to
    cities for sale. American chestnut (Castanea dentata) trees were also prized for
    the straight-grained rot-resistant wood and were used for construction, furniture,
    fence posts, and railroad ties. It was a tall tree that could exceed over 100
    feet tall. In its native range, they occupied up to 25 percent of the trees and
    numbered as many as four billion trees. However, chestnut blight (Cryphonectria
    parasitica) killed all of our American chestnut trees to the ground. The blight
    was discovered in 1904 at the Bronx Zoo. It was too late to halt the spread, as
    there were many trees imported from Japan from nurseries all around the East Coast.


    Luckily, we adopted orchard trees from Japan, China, Korea and Europe, with their
    hybrid prodigy producing some of the best chestnuts ever produced with named cultivars
    now available to everyone.


    It is possible to harvest up to 7000 lbs. per acre of chestnuts in a banner year.
    You can expect 2000 to 5000 pounds as a normal range for well-managed known cultivars
    in your orchard. The relative sizes for each species is shown in Figure #1-3.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_21_0.png)


    Figure #1-3, Four different species of chestnut.


    For all of the above reasons, we grow hybridized trees regionally adapted for
    our orchards. The orchard type trees are very productive and disease resistant.
    Cooperatives to date are able to sell all of their nuts for $5 to $6 per pound
    for direct-to-consumer online sales in three weeks.


    There are actually two main species of chestnut in North America. The second species
    is the Allegheny chinkapin (Castanea pumila) known as the dwarf chestnut due to
    its smaller stature, typically less than 30 feet, compared to American chestnut
    along with its tiny burs and very sweet nuts. Many also consider Ozark chinkapin
    (Castanea ozarkensis) to be a sub-species of Allegheny chinkapin with similar
    nut size but taller trees up to 65 feet.


    Many call the chestnut “bread” tree as the nuts are mainly starch with very low
    oil content. The nut, when dried and turned into flour, is smooth and sweet. The
    flour is a gluten-free (lectin-free) wheat flour substitute. As discussed, chestnut
    trees were imported from Japan or Korea as their chestnut (Castanea crenata) produce
    very large disease-resistant nuts. However, their nuts are often very difficult
    to peel. European chestnut (Castanea sativa) also suffers from chestnut blight
    but has been much slower to spread in Europe. Chinese chestnut (Castanea mollissima)
    is'
