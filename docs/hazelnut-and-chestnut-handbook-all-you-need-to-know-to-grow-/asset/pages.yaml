- img_proc: true
  md: 'without dying back. None have been found to date. There are some isolated specimens
    that have attained mature height and have been able to survive. Those same trees
    when tested were subject to suffering and dying the same fate as all other American
    chestnuts.


    The American Chestnut Foundation (TACF[1110]) has been working on blight resistance
    since 1983 and was founded by Philip Rutter, Dr. David French, and the late Dr.
    Charles Burnham. They began a hybridization program crossing the orchard Chinese
    chestnut tree with blight resistance to the American chestnut. The plan was to
    have a 50 percent American and backcross to American until they have 15/16 American
    with the resistant genes needed for blight protection. It turns out after 35 years
    that there must be many genes needed from the Chinese chestnut for blight protection.
    Recent discoveries[1111] indicate that nine or more genes are needed to infer
    blight resistance and this brings into question the ability to backcross the American
    chestnut to have blight resistance and still be American chestnut. Keep in mind
    our native chestnut tree has many protections built into its DNA that we are unaware
    of and if we lose too many traits when cross-breeding to the orchard tree trees
    we may not know for hundreds of years of what protections were lost and may cause
    long-term damage.


    The American Chestnut Foundation has taken an all method approach, knowing it
    was going to take a lifetime to reestablish the American chestnut, as all attempts
    since its discovery to date have failed. Current 7th generation backcross trees
    still do not have enough blight resistance, as we understand it, to survive on
    its own in the woods.


    Being called the “American chestnut” means that it can still have the vigorous
    growth and have all the native genes needed to survive and thrive in our native
    soil with our regional pestulence and diseases we do not understand as our chestnuts
    have been functionally extinct for over 80 years. We need to keep in mind that
    China and in Japan chestnuts orchard trees bred to produce nuts in quantity and
    survive their native diseases. The problem is their native diseases came to North
    America and'
