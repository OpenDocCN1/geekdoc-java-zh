    Plants and animals that have only genes transferred among their own species is
    known as cisgenic and species that have genes cut may no longer be regulated in
    the US. Cutting genes has allowed bulls to be born without horns[117] for example.
    Cisgenic plants are genes that allow specific traits to be transferred between
