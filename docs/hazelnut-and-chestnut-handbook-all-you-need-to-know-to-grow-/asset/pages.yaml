- img_proc: true
  md: 'you may want to add a powered husker, nut cracker and a shell separator and
    screen to provide mostly clean nuts for the customer to take home. A better answer
    is to do a prorated swap with the customer of nut meats for freshly picked nuts.
    Of course, you will want to have processed nuts and value added products and third
    quenchers to round out the experience.


    Reminder, the need to have appropriate warnings the final product may contain
    shell fragments like any bag of nuts and for proper labeling check your county
    weights and measures department along with your state’s Ag and Markets department
    for labeling requirements. Also, for U-Pick operations you have washing stations,
    sanitary facilities, and posted safety rules. Of course, you need insurance and
    agro-tourism niche in this time. We do not do U-Pick, but we are told insurance
    companies assist with the safety requirements typically employed and U-Pick operations
    also add other activities to help draw and keep customers.


    # HARVESTING BUSH HAZELS


    Reaping the fruits of your labor is rewarding. Getting started, you will gladly
    hand harvest nuts from the bushes as the bushes are relatively short, the stems
    bend readily and it is a good healthy experience harvesting nuts. Over the thirty
    years we have been planting nuts, We still thoroughly enjoy hand-harvesting nuts.
    Even when you have too many to hand-harvest, you need to check and see if the
    nuts are ready.


    How do you know when the nuts are ready to harvest? Does the color of the nuts
    or the color of the husk tell when to harvest? The answer is yes, sometimes. Some
    husks will start turning a crimson brown and the nuts are not yet filled. Some
    nuts will turn brown in a green husk and they are not yet filled. Every so often,
    you will find a bush with green husk and whitish shells and they are ripe? How
    do we know? The hilum is where the nut attaches to the husk, where you cannot
    see. The hilum will tell you the nut is 90 percent of the time. If the nut when
    pushed sideways, without effort, comes out of the husk then the nut is most likely
    ready.'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'When the nuts are still moist and just picked, we like to carry a PVC pipe
    cutter and cut the nut in half. If the nut separates from the husk easily and
    the shell when cut in half has a plump white solid nut then it is ripe. We will
    taste to see if it has that texture of oil, some sweetness and uncooked hazel
    flavor. We have some bushes where the nuts will be brown, with husks that are
    brown and dry, and the nut still doesn''t want to be removed! Hopefully, you do
    not get any bushes where the nuts won''t be separated from the.


    Once you exceed your ability to have all the nuts picked by hand, you will look
    for mechanized methods to harvest. A bush form of orchard will need to purchase
    harvesting equipment normally used for blueberries or aronia berries. A productive
    bush will fill up two five-gallon buckets and take 20 plus minutes by hand to
    pick. If you have three hundred bushes to pick and it takes 10 hours to pick thirty
    bushes it is 10 days of picking. If you have 3000 bushes you now have 100 days
    of 10 hours a day of picking. If you have to pay multiple people $15 or more per
    hour with all added payroll costs it can be up to $20,000 worth of labor for harvesting
    per year. That is for the harvest, now you need to de, clean, sanitize, size,
    sort, bag market, sell, and ship. That was to prep you in case you decide to procure
    equipment for harvesting. You won''t need equipment until you reach the economic
    threshold, and looking at the previous math lets you pay for itself in a few years.


    Blueberry harvesters can be very expensive as many are very large self-propelled
    machines. Some are P.T.O. tractor-driven and can be bought, fairly inexp. The
    blueberry picker envelop the whole bush and gently beats the branches to make
    the nuts in the husk fall. The base of the tree is surrounded by metal or plastic
    plates that allow the nuts to slide onto a conveyor into a bin. Older bushes can
    have a diameter of four feet and can become too wide to enter some of the blueberry
    pickers and will require coppicing of the outer and stems. When mature bushes
    are wide at the base, some of the nuts drop into the center and not get onto the
    conveyor. If the bushes are kept narrow along the row, most of the nuts will be
    captured and not lost to the center of the bush. We have talked to growers who
