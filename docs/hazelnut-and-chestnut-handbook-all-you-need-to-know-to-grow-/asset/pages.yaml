    # ORCHARD PLAN AND PLANTING


    Orchard planning for chestnuts is straightforward as stated in the summary above.
    The design is the same for U-Pick, manual harvest, or mechanical harvesting. Tree
    spacing is ten foot in row and twenty foot between rows for a total of about 216
    trees per acre. This tree spacing is considered double density planting, Double
    density planting allows for higher nut yields in early years due to the fact you
    have twice as many trees as you space for them. Also, there is much more pollen
    available to fertilize the flowers and that is critical when the trees are small
    and produce little pollen.


    # SEEDLINGS OR GRAFTS?'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Whether you plant seedlings from known cultivars or purchase grafted trees
    to plant is your choice. Most new orchards are Chinese hybrid seedlings of known
    cultivars. Some orchards are grafted trees of named cultivars and some orchards
    plan to graft scions onto the same seedlings. For example, if you plant seedlings
    of Szego and buy a Szego grafted tree, you can cut scions from the grafted Szego
    and graft onto the Szego seedlings.


    You may ask why better to graft Szego on to the Szego seedling? Chestnuts suffer
    from delayed graft failure, and the delay may be two years or 20 years. To reduce
    the number of graft failures, it has been found that if the scion is from the
    mother tree of the seedling there is less graft failures. This intuitively makes
    sense, the seedling having approximately 50 percent of the mother tree genetics
    it should have the best chance of being compatible with the scion wood. Just to
    make sure you appreciate graft failure, Dr. Fulbright of MSU, discussed how he
    visited an orchard of grafted trees about five years of age and couldn''t find
    a surviving graft on the seedling trees. So by default this grower was growing
    seedling trees. Along with graft failures, many grafts grow quite slow as if the
    graft isn''t allowing the nutrients to flow freely and are shy producers. Some
    trees graft well like Szego and Boucher de Betizac.


    Some named trees make great mother trees as their offspring are often good or
    better than the parent. One such tree is Luvalls Monster, which is male pollen
    sterile and they usually produce more nuts as if the energy that would have gone
    to producing pollen is available to grow nuts. Also, when Luvalls is pollinated
    by Chinese trees all the offspring are male sterile as well. An orchard of male
    sterile trees with 20 percent pollen producers should be able to have very high
    production.


    The list of preferred cultivars has been changing over the years and if you are
    on the fence of way to go, a paper from Cornell is good reading. In summary when
    Dr. Ian Merwin [GB8] et compared seedlings to grafts for commercial production,
    seedlings may be the best option. They noticed high graft failures and slower
    growth compared to seedlings. They did more nuts earlier with grafted trees, but
    the vigor of seedlings and longer term production of seedlings is more economical.
    Also as a bonus size was similar with seedling trees.'
