    # INSECT PESTS


    Your trees may at some time need protection from insects. To date, we do not spray
    any insecticides on our trees. We do not suffer many of the problems that the
    Oregon growers have to deal with at this time. We do have Japanese beetle and
    Brown Marmorated Stink Bugs (BMSB) in the Northeast and we do have to deal with
    or at least watch for them. As previously stated, we have been breeding hazelnuts
    to withstand the rigors of nature and that is why we have been breeding with native
    stock genetics. We have not sprayed for insects except when we had massive invasion
    of tent caterpillars. We will review the current list of bugs that want to bother
    your trees and how to deal with them.'
