- img_proc: true
  md: 'lesions on a "blight resistant" Oregon layered cultivar in Cultland, New York.


    At Z''s Nutty Ridge we procured trees from most available sources from around
    the country and Canada. We bought the hazel trees for two purposes. The two reasons
    are to see how the hazel trees perform in our USDA zone 4/5 climate and to accumulate
    more strains of EFB to test our fields this will get expensive. We generally won''t
    buy less than 10 trees and as many as 1000 trees. We do not use fungal sprays
    or cut out infected branches to stop the spread of the disease. We want for breeding
    purposes to have present and abundant sources of EFB. We want our trees to get
    infected and either thrive or succumb to EFB. Along with letting trees die from
    being too tender or EFB is also finding out which trees aren''t desired by insect
    pests, further enhancing our breeding.


    In studying hazelnuts for many years, we have found that there must be multiple
    genes that are effective in keeping EFB in check. While some trees never show
    blight others will. We saw EFB and stopped monitoring them. A couple years went
    by and we noticed a vigorous tree with nice nuts, and upon examining the tree
    tag and our notes found it had blight. After further examination of the tree,
    we cannot find any blight? From what we understand, there must be a gene that
    is only activated after there is a wound on the tree. The gene generates the needed
    antidote to control the blight and gives us more breeding material to stack EFB
    resistant genes.


    We do controlled cross-pollination of trees that show cold tolerance and disease
    resistance first and then with high production, and with high quality nuts. The
    main effort is to find cold-hardy trees resistant to multiple strains of EFB.
    By cross-breeding resistant strains, we believe we are stacking multiple genes
    in the fight against EFB.'
