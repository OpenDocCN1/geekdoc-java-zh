  pgno: 225
- img_proc: true
  md: 'There are currently two main methods of propagating chestnut. The first is
    by seed and the second is by grafting. A third method is coming into maturation
    and that is tissue culture.


    At Z''s Nutty Ridge working in conjunction with SUNY Environmental Science and
    Forestry are working to bring in cultivars of known chestnuts. The practicality
    of planting trees on their own roots, avoiding grafting issues that can occur
    a year or twenty years now is a very worthwhile effort. Also, should a storm come
    about and heavily damage your trees you will have sprouts to encourage growth.
    Growing trees on their own roots will bring about a fourth method of propagation
    by layering suckers that can be encouraged to grow.


    # PLANTING TREES, SEEDS, AND PROPAGATION


    Planting chestnuts is the same as hazelnuts without the lime. Keep track of the
    soil line and do not plant deeper or shallower than that will. If you lay a long
    stick across the hole as you plant it will eliminate the guesswork. Some people
    consistently plant too deep or too high relative to the soil level. Keep in mind
    our warning about soeless potting mix some nurseries use in their pots as we discussed
    in Chapter 5-Planting Hazelnuts. It will literally dissolve over time and the
    tree may settle deeper. Knock off the loose potting mix and mix in the native
    soil with the roots. Over the years we have been told to dig irregular holes to
    stop the roots from circling around the holes and there has been a renewed surge
    to remind us to do that. Water very well to eliminate any air pockets to make
    sure the root is in good contact with the soil. If planting caging now is best
    as the soil is moist and loose and can easily be twisted in an easily before staking.


    Follow mulching and fencing directions for hazelnut. The only difference for chestnuts
    is to keep the mulch in place and not remove it. As mulch decays it turns the
    soil acidic so do not remove the mulch and do not add lime. Only add more as needed
    to keep the weed pressure down.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'If you are planting seeds, you most likely will buy or collect them in the
    fall and stored them in your refrigerator for spring planting. Put the seeds in
    a large sealable bag with 50 percent peat moss that is damp and not wet. Do not
    let your seeds freeze or you will kill them. Chestnut seeds can handle a few degrees
    below freezing without damage, but your refrigerator freezer will kill them in
    short order. Seeds need to stratify between 32 to 40 °F degrees are needed to
    accumulate stratification hours. Your refrigerator works perfectly for this. Around
    February time frame, you will see the roots to peak out of the nuts and that is
    okay. Leave them in the sealed bag until you are about to see frost weather for
    your region.


    You can either put them in fairly deep pots of 8" or more using potting soil for
    woody plants or plant them directly if you prepare the soil and protect them with
    hardware wire cages as you plant.


    If you decide to put the seeds, use a potting mix for woody plants. Potting mix
    for woody plants can have upwards of 50 percent bark for good drainage and somewhat
    acidic pH. Grow them in full sun outside in a protected area, not a south window
    or they will be spindly and not adjusted for the wind or direct sun they will
    be accustomed to. We say protected the chipmunks, squirrels, blue jacks, crows
    and other hungry rodents find them to eat. At least protecting a group of trees
    is less effort than protecting each tree individually in the field as you plant.
    You can buy a roll of 4'' wide plastic or chicken wire fence at any home improvement
    or farm store. A fenced area 4'' wide using sturdy five foot stakes you make or
    buy, and stake in an area as long as you need to enclose your seedlings, keeping
    the space to 4'' wide is so that you can cover the seedlings with the 4'' wide
    fence to create a cage over your seedlings. The stakes will need to be strong
    to hold the fence roof on as long as you need it.


    When it is time to plant your potted trees, you will need to remove the nut by
    twisting it off. After about six weeks, the nut isn''t needed and if a crow pulls
    on the nut the whole seedling may come out. We found a row of trees ripped out
    of the ground and you will too you if you don''t remove the nut first or put a
    hardware cloth cage around the tree that is well-staked.'
