    # ANIMAL PESTS – RODENTS AND BIRDS


    Along with the deer that eats anything green, there are skunks that dig at the
    mulched roots looking for grubs and raccoons that steal your nuts and you also
    have smaller rodents. Wooducks we could include but they only do incidental damage
    if they dig a hole close to a tree, they see to scratch and bite at the tree,
    but mainly irritate the tree.


    Rodents taken we include: squirrels, chipmunks, mice, and voles. There are two
    more pests not generally considered rodents but are birds. The two main and very
    bothersome birds are crows and blue jays. Let’s go through how to deal with them
    and protect your orchard.


    Wooducks although not a direct pest, do pose risks with the holes and dirt mounds
    they build. Wooducks are easily dealt with smoke bombs from the hardware store
    or farm store. Most farmers just use a small caliber rifle to deal with wooducks.
    If you only want to catch and release you go a live catch trap that is baited
    with a potato. The fence keeps out the bigger pests, but you still need to control
    the smaller pests we generally call rodents.


    # SQUIRRELS AND CHIPMUNKS


    Squirrels are curious, shy, and crafty. They store your nuts away, consuming them
    for a much longer period than they are available in your orchard. Chipmunks are
    similar, but they live in holes that go unnoticed next to your trees. Your nuts
    start to fill, they begin stealing and feeding on them. You know the telltale
    of squirrels and chipmunks as there will be numerous empty shells at the base
    of the tree. You will often see a squirrel or chipmunk scurrying away with a pair
    of fat cheeks. They are actively running away with their booty to eat in a safer
    location or literally “squirrelrelling away” for later.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'It is very frustrating to see more nuts at the base of a tree than on the tree
    getting ripe. Your feelings about the cute chipmunk or squirrel will turn adversarial
    in a hurry. When explaining your frustration to friends they will tell you to
    leave the chipmunk alone or similarly unwise advice for the sake of the cute chipmunk.
    Your tolerance will grow thin, and you will trap and remove them one way or another.


    Squirrels will often take their booty to a location near their nest and eat the
    nuts in the same location. If you scout hedgerows or nearby woods, you will find
    piles of empty shells on a fallen log or rock. That location is the best location
    to trap the squirrel in the springtime.


    The best time to catch squirrels or chipmunks is spring or summer before the nuts
    begin to fall. You can easily catch them with a live-catch trap using their favorite
    food, your nuts. The live-catch trap needs to be sized for the animal you are
    catching. We used an 8" x 8" x 16" live-trap and never caught a chipmunk, despite
    an invasion of chipmunks. The food would have gone; the trap may have been tripped,
    but no chipmunk. We purchased a much smaller trap noted to be good for rats, and
    they worked amazingly well. We bought five traps delivered from Amazon for under
    $40.


    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_102_0.png)


    Figure #4-22, Koro brand squirrel spring traps with wire cloth cage tied to trip
    plate.


    For the effort, we have caught relatively few squirrels in live traps as squirrels
    are relatively few in our area. However, the best traps for killing squirrels
    are the spring traps you strap to a tree. One example is made by'
