- img_proc: true
  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_55_0.png)


    Figure #3-3, Hedgerrow orchard of mature hazelnut bushes at Z’s Nutty Ridge LLC.


    Often, in any field you will have certain areas produce better or worse than others
    due to moisture, shading, wind, protection, or animal predation. Customers tend
    to go into the best area of your U-pick operation and leave the less-than-perfect
    areas alone, and by necessity you need to direct customers to a specific region
    of the orchard. If you have tight rows of bushes and have a driveway every 50-200
    feet orthogonal to the rows you can easily direct traffic by blocking rows with
    rope. Using a soft, thick rope tied to trees, you can direct customers to the
    proper location. As in Figure 3-4, the area shaded is available for picking. Keep
    in mind, road access to the field and the need for ample parking areas along with
    the necessary signage. You will need to post the rules for your U-pick operation
    and by law may need to have sanitation facilities. Sanitation facilities if needed
    can be a rental “porta-john” and a foot pump washing station. Another consideration
    is to trade shelled nuts for the whole nuts picked so they won’t have to crack
    them by hand. We found other than snacking on a few nuts during the yearend holidays,
    nobody will crack enough nuts for cooking, and you may lose a repeat customer.
    Alternatively, you can have the equipment on hand to crack and glean the nuts
