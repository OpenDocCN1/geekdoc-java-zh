  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_230_0.png)


    Figure #8-10, Splice graft matching up the similar size wood stocks so the cambium
    can align.


    It is important that the graft union doesn''t dry out. If in a controlled environment
    you may want to mist or place the graft union in a ventilated plastic bag. If
    outside we we have seen everything used from soft plastic foam used for packaging
    to simply running masking tape up and down six inches past the graft union to
    semi-seal and protect the graft union from strong sun.'
