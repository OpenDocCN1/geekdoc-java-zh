    # # RESTORING THE AMERICAN CHESTNUT - EFFORTS


    Although chestnut blight will kill the top of the American chestnut, the root
    remained alive and send up shoots that would in a few years get blight and dieback
    to the ground. The native tree is functionally extinct as the number of trees
    with roots still sending up new shoots is decreasing every year.


    Many people think the tree is growing, so it must have some resistance and believe
    that if it lives long enough to produce seeds after four or five years, will claim
    they found blight resistant American chestnuts. They would be mistaken and may
    pass the mistake forward. If there were blight resistant American chestnuts the
    stumps would re-sprout and keep growing'
  merge: -1
