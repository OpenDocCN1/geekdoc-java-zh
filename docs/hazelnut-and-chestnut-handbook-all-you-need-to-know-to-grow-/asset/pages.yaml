- img_proc: true
  md: 'bucket 2/3rd of the way with the nuts and husks. Snap on the lid and turn the
    drill on for about two minutes. Use the high speed setting on the drill if you
    have two speeds. At first, the nuts make somewhat of a muffled noise and a bit
    later you hear and more nuts smacking the sides. The sound gets louder and louder
    as nuts separate from the husks. After about two minutes curiosity gets to you
    so you look and see most of the husks have been separated and the bucket is now
    only about ½ full. The volume is reduced as the husks are somewhat broken apart
    and have settled. This makes separating the nuts from the hus much easier. Also,
    the bucket husker does a better job if the husks are dry and not juicy or green.
    We like to dump the bucket on a ½ inch hardware cloth screen and rub the mixture
    around; the husk pieces fall through the screen and you can see the nuts much
    quicker to separate them. You can make an air aspirator that will suck up the
    light husks and leave nuts behind. UMHDI has good instructions on how to make
    an aspirator[43] out of PVC piping, a wood shop vacuum, optionally a dust separator
    and a valve to control air flow with a total cost of about $300.


    Once you have too many bins of nuts in their clusters for a bucket husker, you
    will need to remove the husks using larger equipment when economically justified.
    One separator from Chianchia Model S120 will separate the husks from the nuts
    and is shown in Figure #6-5. The regional seller for Chianchia is BDI Machinery[44]
    in Macungie, PA. Other designs you can make on the farm that are in between the
    bucket husker and the Model S120 are shown at the UMHDJ[45].website.'
