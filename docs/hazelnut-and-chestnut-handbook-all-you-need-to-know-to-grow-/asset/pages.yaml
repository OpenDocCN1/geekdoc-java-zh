  md: '# FERTILIZATION


    Fertilization can be a complex topic. Most people think of fertilization as buying
    a bag of fertilizer and tossing some around the tree. That method may work for
    a while. You may just be wasting money and worse you could be hurting the tree
    and polluting the groundwater. Keep in mind when fertilizing the tree you are
    feeding it and for next year. This is why your tree is loaded with nuts and it
    looks like you are going to have a good year, you Hazel trees may have a bad year
    unless next year''s flower buds at the same time as it is filling out this year''s
    nuts. This is why leaf analysis is used to take a snapshot of the trees health
    as it starts to put on the nuts and produce next year''s flowers. Hazelnuts have
    dense shallow root system, which has been reported to be very good scouring nitrogen
    from the soil[251]. This hazel trees are considered ideal for stream bank control
    and riparian buffers, as they will mitigate nitrogen runoff from fields. Hazel
    bushes may be ideal to mitigate nitrogen runoff that is causing algae blooms in
    the lakes.


    Fertilization of trees begins in the second year after planting. This assumes
    you have done a soil analysis prior to planting and have adjusted the deficient
    nutrients and pH. Fertilization of first year trees increases mortality rate,
    meaning they have a better chance of dying the first year if you fertilize them.
    Keeping them watered should be considered fertilization as you are enabling the
    root system to grow. Trees in pots or bare root trees have their roots compromised
    and need to put on more roots to grow stems and leaves. Fertilizer application
    in the spring time pushes out growth and is the best time for young trees not
    yet producing nuts. Do not feed young trees late in the summer or fall as it may
    push growth into frost season and new growth will be die back with frost.


    A common rule of thumb we have heard for many years is no fertilizer after the
    fourth of July for young trees. The first year you fertilize you will spread fertilizer
    around the drip line. The drip line is where the farthest point from the trunk
    of the tree will drip water if it was.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'In other words, the drip line is the outer perimeter of the tree’s foliage
    and you project that perimeter onto the ground to know where to fertilize. The
    assumption is the drip line is where the feeder roots are for the tree, and this
    will maximize the absorption of the nutrients. Ideally the fertilizer used on
    young trees is a slow release fertilizer; otherwise, the young roots may burn
    and set your trees back rather promote growth. Ideally, you will use organic fertilizer
    or well composted manure that releases nutrients in a slow manner.


    Young trees will need more fertilizer as they get bigger as the drip line increases
    in diameter. According to the late Jeff Olsen of OSU Extension Service Nutrient
    Management Guide EM9080[126]the first year you fertilize your trees give 0.25
    pounds of nitrogen, the second year give 0.33 pounds of nitrogen and incrementally
    increase to 0.75 pounds of nitrogen by ten. please download EM9080 it is very
    helpful.


    Understand that 0.25 pounds of nitrogen will require 0.5 of 50-0-0 fertilizer
    or 1.0 pound of 25-0-0 fertilizer. The numbers represent, in order, Nitrogen (N),
    Phosphorus (P) and Potassium(K) by percent in weight. So a 10-10-10 or commonly
    called triple fertilizer will need 2.5 pounds of fertilizer to get 0.25 pounds
    of nitrogen. The 10-10-10 means the bag contains 10 percent of N, P, and K. So
    for every pound of fertilizer from the bag it will contain 1.6 ounces of each
    N, P, and K.


    The previous paragraph can be restated in another way. Add two ounces of Nitrogen
    per inch diameter of trunk for a tree that is growing normally. So if a tree has
    a three inch diameter trunk and you are using triple twelve (12-12-12) fertilizer
    the following math applies:


    2/16*3*100/12 = 3.125 pounds of fertilizer for a 3” diameter tree using 12-12-12
    fertilizer.


    We discuss commercial fertilizer as if that is what you plan on. Commercial fertilizer
    is generally the most readily available. Organic fertilizer has much lower N,
    P, and K content so more pounds of fertilizer are needed. The equation above will
    aid in determining how much to apply. It usually takes time to locate and procure
    organic sources of fertilizer. You will quickly learn if you talk to growers at
    your local farm stands that sell organic vegetables. The local Community Sponsored
    Agriculture (CSA)'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'that sells shares of their vegetable crops will be buying fertilizer in bulk
    and they are great to talk too. Just let them know you are not planning to compete,
    that hopefully you will be synergistic with them, so they will generally be glad
    to help you out. Always keep in mind ways to combine orders for volume discounts
    as mentioned in fence purchases previously.


    If you read the OSU Extension Service Nutrient Management Guide, keep in mind
    hazelnuts in Oregon state blooming in December, 10 to 12 weeks earlier than we
    do in the Northeast. However our nuts ripen at the same time on the calendar as
    the Northwest nuts do. This shortened growth season along with flower and catkin
    winter survival is why hybrid blends were developed for the Northeast using native
    genetics. This is why you shouldn''t plant Northwest genetics in the Northeast.


    How well the trees are doing during the summer is known by leaf tissue analysis
    and is often referred to as “plant tissue analysis.” Leaf analysis is done from
    July to early August. Many universities with an Extension service for farmers
    can do the analysis and a simple web search in your state will locate yours. A
    company called Dairy One[2] that operates from Ohio and West Virginia to Vermont
    and Maryland will give you your leaf analysis at a very reasonable cost. The plant
    tissue analysis will give you parts per million of dry weight for Nitrogen, Phosphorus,
    Potassium, Sulfur, Calcium, Magnesium, Manganese, Iron, Boron and Zinc. Once you
    have your results, you need to know the proper ranges for each nutrient for your
    crop. For hazelnuts, the range for each nutrient is located in the Oregon State
    Nutrient Management Guide EM8090. This guide will tell you how much of a given
    amount you will need to add per acre and when it is best applied with the month
    exceptions noted by Lois Braun for east coast hazel hybrids. This guide takes
    the guesswork out of what to feed your trees and most farmers use tissue analysis
    along with soil analysis to maximize their yield. Keep in mind, the leaf analysis
    is for European hazel genetics and in time we may learn to adjust your ranges
    somewhat differently for our native hybrid genetics.


    It is important to know when to fertilize nut-producing trees. Again, leaf analysis
    in July or early August will tell you if you need to fertilize your trees. When
    trees are in full leaf, filling nuts and putting on next year’s flowers, the trees
    cannot be starved of nutrients or next year’s production'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'will be reduced. Louis Braun of Department of Agronomy at the University of
    Minnesota[28] found that fertilization during nut filling and up to September
    is good for mature trees. Again, let your leaf analysis based on Oregon State
    Nutrient Management Guide tell you if you need to add fertilizer.


    An example of optimal timing to apply nutrients is for nitrogen. Nitrogen may
    be applied multiple times in a year. Remember we discussed you fertilized a tree
    for this year and next. When nitrogen is applied will determine how the tree will
    use. Hazelnut trees are efficient in recycling nitrogen. The leaves before falling
    off the tree in preparation for winter will have much of its nutrients pulled
    back into the tree to be recycled next spring. Another important micronutrient
    for hazelnuts is boron. Foliar application of boron has been known to increase
    nut size by as much as 30 percent, and it only costs a few dollars an acre to
    apply with a sprayer. One brand of agricultural boron made by Borax®[29]. Timing
    of sprays for boron is shown in The Northeast Hazelnut Yearly Maintenance Schedule
    Table 5-1.


    # PLANTING HAZELNUTS


    All of the previous chapters have prepared us to plant out our tree selections.
    However, in case some of us have jumped to this spot to plant trees and may have
    missed the preparations, some are mentioned again here. Knowing the soil will
    enable the tree to grow healthy and strong allows for a rewarding experience.
    Planting the tree and hoping it grows is risky, and when results aren''t what
    we expect we will assume we don''t have a green thumb or want to blame the nursery
    for lousy plants. Properly preparing the site and soil gives the best chance of
    success that will literally reward us with the fruit of our orchard.


    Hazelnuts and chestnuts require two trees for proper pollination to produce nuts.
    They must be able to receive pollen from a different tree; therefore, the trees
    should be relatively close to each other. Please not layered trees that have the
    same name are actually the same tree and will not pollinate each other. You need
    a seedling or a layered tree with a different name for'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'proper pollination. If you plan to grow as a tree they should be 8 to 12 feet
    apart within the row and the row spacing is 16 to 18 feet apart, you can review
    Chapter 3 Planning an Orchard, for more detailed information on spacing. If you
    are planning to grow as a bush in hedgerrow form they can be as close as three
    feet if you are using proper American stock.


    Remove grass and vegetation from the planting area with a garden fork. As a reminder,
    the soil needs to be between 6.0 and 7.0 pH for good health of the tree. You may
    need to add lime in the soil and sprinkle lime in an area around the hole to make
    sure the soil is of proper pH. Ideally, this is the year prior and at least some
    weeks or months prior to planting to allow the lime to neutralize the soil. Make
    sure the potted tree has well watered prior to digging the hole. Lime is caustic
    and will harm the roots if applied directly with the roots at the same time. We
    all want to cut corners, but properly amended soil, cleared of weeds, is important
    to the health and survival of the tree.


    Dig a planting hole twice as wide and the same depth as the pot. Dig an irregular
    hole, not a perfect circle, to stop roots from circling in the hole. Roots will
    take the path of least resistance when growing and may just circle around the
    hole you dug as the native soil will be more compact than the soil you loosened
    planting the tree. So dig the hole very irregular with "nooks and crannies". Remove
    any rocks from the soil to not damage the roots when backfilling. Fill the planting
    hole with water. Wait until the water soaks into the soil. If planting potted
    trees and the pot won''t slip off, then cut the pot along the side with a utility
    knife. After cutting the pot pull it open so you can remove the tree without damaging
    the trunk or roots. Slide the roots into the planting hole. Arrange any loose
    roots so they spread evenly. Be careful to avoid the moist, tender roots. If cut
    any broken roots. You want the tree to be even with the natural soil surface and
    you want the soil to be in the same position on the tree as it was in the pot.


    If the tree you are planting is potted, it usually has what is called a soill
    potting mix. In the end, what this means is it is most organic and will decompose
    causing the potting soil to literally dissolve and evaporate. The result is a
    depression in the hole you planted your tree in and your roots will either get
    exposed or compressed and neither is good for the tree.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Please do not just stick the tree in the hole and backfill. We like to spread
    the roots out that are compressed in the confines of the pot. While doing this,
    much of the potting soil falls off and that is when we spread the roots out in
    the hole and hold the tree to the proper depth and slowly fill in with the native
    soil while adjusting the roots to be in multiple layers within the soil. When
    backfilling the hole with native soil, mix in some of the potting soil. In this
    manner, we have some soiled potting mix to keep the soil aerated while enough
    native soil to protect and hold the tree in place.


    If the tree you are planting is bare root, now is the time to add some compost
    mixed in with the native soil. Mixing some compost is good to help with aeration
    and enable the tender roots to find pathways. Ideally, the mulch is homemade and
    has lots of local fungi to create a healthy microbiome around the roots. Otherwise,
    planting is the same as for potted trees above.


    When finished backfilling the soil over the roots gently and thoroughly now to
    eliminate air pockets. Air pockets will kill the roots and possibly the tree.
    If the tree you are planting is one year old and has multiple shoots you need
    to cut back to the strongest by pruning off the other shoots at the base. If the
    one year tree is taller than three feet, cut back to three feet and trim off any
    side branches. We need to be mindful that the tree has been pampered in a pot
    and its root system is small or has had much of its roots pruned when it was dug
    from the ground if it is bare root. By pruning back the excessive stems, we are
    matching the top to the roots for better survival.


    # MICROBE ADDITIONS


    Planting the tree is also a good time to inoculate the tree and soil with some
    good microbes. By adding good microbes you are essentially giving your trees “probiotic.”
    In human terms, we think of probiotics as healthy microbes for our intestines.
    Roots are essentially our intestines as they transfer external nutrients and bring
    them internal for use while protecting from harmful pathogens.'
