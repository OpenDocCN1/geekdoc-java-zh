  md: 'When it comes to equipment, we have found over and over, when we tell someone
    of an effort to accomplish a task we are told,"Oh, you should have told me I have
    a "blank" and you could have borrowed it." So save yourself a ton of money and
    start telling everyone you know about the fence-building task and list the things
    you are going to need. The time it takes for them to tell you all about the tool
    and using it is worth it. So have have patience and listen for the little gold
    nuggets that come out. Often, you don''t realize when someone is telling you valuable
    advice because we don''t know enough about the subject to fully understand. Then
    we go to use the tool and something goes wrong or takes more effort than we thought,
    then memory kicks in and we say,"Oh, that is what they meant when they said...
    blank, blank and blank." Keep in mind, rural neighbors have to tend to be self-sufficient
    and neighbors to your property are a great resource for tools and knowledge. With
    the neighborly knowledge goes the normal caveat, that they will gladly tell you
    what they did and didn''t work, but they often won''t tell you (or didn''t know)
    what they did that helped the endeavor to fail. So take any negative inputs with
    a grain of salt.


    Also, always bring the tool back in better shape than we gave it to you. This
    may mean cleaning it, some oil or tightening bolts. Let them know you care and
    appreciate their assistance. Also, return it as soon as possible. If the task
    is taking longer than you think, let them know you need to borrow it for a longer
    period than you thought.


