    # INTEGRATED PEST MANAGEMENT (IPM)


    Much of what we just described about pests is approaching Integrated Pest Management
    (IPM) and is IPM if we knowingly tackle pest problems in a systematic way. We
    described what bugs to look for and that is known as identification and scouting.
    Decide what management practices to use to abate or control the population before
    they damage the crop to the point of losing any significant yield and in our case
    using exclusion fence, baits and traps. If doing the scouting and abatement management
    isn’t enough, then we break out biological controls, if available, once our threshold
    limit has been exceeded. If that doesn’t control the pest then biological or chemical'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'pesticides may have to be employed and then we need to choose the least toxic
    possible.


    What that economic threshold is, is often determined what the quality standards
    are for your nuts. Most nut orchards out west belong to a cooperative that sets
    the standards for nut quality. If too many "bad" nuts, based on a percentage,
    are exceeded during sampling, the lot of nuts just brought to the cooperative
    will be rejected. This will force you to go through your nuts and sort them before
    the cooperative will accept them. For example if one percent of the nuts you bring
    to the cooperative have bug bites on the shell, indicating possible damaged nut,
    the lot will be rejected. It is the purpose of the cooperative to have uniform
    high quality to maintain their customer''s expectations. If the lot is rejected,
    you will be doing what you were hoping the cooperative would do, forcing you to
    sort through your nuts extending money and time. Sorting raises the cost of producing
    your nuts. In the end, the cooperative (your customer) is demanding what the economic
    threshold is for you to take increasing efforts to control pests. Meaning the
    money and time for you to sort through the nuts gives you the economic threshold,
    otherwise known as the cost to abate the problem in the first place. What we just
    related to us by a nut cooperative in Oregon.


    Knowing when the pest is vulnerable is another important method to control pests
    with the least cost and highest sustainability for the environment. Consulting
    the local cooperative extension on and when to best control pests for your area
    will most likely depend on what USDA zone you are in. Insects grow and mature
    at each instar (growth stages), and mate on a schedule and are vulnerable at different
    times. You should be pre-armed with knowledge for your, long before you scout
    for pests in your orchard. You will have plenty of time to learn once you have
    planted your trees, it is either two or twenty thousand.


    A good overview of when to scout is included in our yearly schedule of orchard
    tasks for the Northeast in Chapter 5. Also, reading up on the latest IPM_strategies[22]
    is available at: the Northeast IPM web site and Oregon Extension has a brochure
    on IPM[23] as well.'
