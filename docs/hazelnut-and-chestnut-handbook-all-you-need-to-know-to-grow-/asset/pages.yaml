    Notice at the base where we cut off another smaller sucker that was too close
    to the one we kept in Figure #5-4. We use 75 pound holding power nylon ties as
    weaker ones can be popped loose by the growing sucker. We pull the nylon tie very
    snug without crushing the stem. We realized this winter after staring at the above
    picture we didn''t do a good job of pulling our mulch away from the base as the
    stem. The nylon tie should be below the compost line where the stem is smooth
    and more yellow than green. This is a key point as we have found our success rate
