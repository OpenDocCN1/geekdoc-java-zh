    In Oregon, the orchard floor must have a maritime climate where it rains during
    spring and is dry during summer and early fall. During harvest time for hazelnuts,
    the orchard floor is dry and brown and the only thing on it is hazelnuts and their
    husks. Later in the fall, it becomes wet and muddy every year they hope harvest
    season is over before the rains come and turn the dropping nuts muddy and costly.


    In the Northeast, we are prescribing that single hybrid trees are planted at 10/12
