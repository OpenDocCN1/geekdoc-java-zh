    # CHAPTER 8 - GROWING

    CHESTNUTS IN EASTERN NORTH AMERICA


    Growing chestnuts is much like growing hazelnuts except the soil requirements
    are a bit stricter. We will review the needs of chestnuts in the same order as
    we did for hazelnuts. Chestnuts are easier to harvest than hazelnuts but more
    fragile to handle when harvested. We explain these and other differences to ease
    any fears you may have and give you the confidence to plant knowing you have given
    your trees the best chance of thriving. You will see that chestnuts are a near
    ideal crop for all of our acidic fallow well-drained hillside lands. It is also
    possible to have chestnuts and hazelnuts in coexistence the same fields. Below
    is a “cheat sheet” overview on which we expound thereafter.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# CHESTNUT OVERVIEW FOLLOWED BY DETAILS BELOW.


    +   1. USDA zone map will tell you what hardness zone you are in to aid in your
    tree selections. Locate your field on the USDA interactive zone map[59]. Are you
    in zone 4b or higher? Compare the USDA hardness zone of your land with the USDA
    hardness of the tree selections available. There are fewer selections of chestnuts
    that will do well in USDA 4b then there is for USDA zones 5/6/7/8. It is important
    not to buy the wrong tree for your zone.


    +   2. GIS soil survey needs to be reviewed as to the type of soil you have. Look
    up your field on the GIS soil survey web site[60]. We did a detailed review of
    how to navigate the Web Soil website in Chapter 2. Chestnuts will do well in well-drained
    soils above a pH equal to or higher than 6.5 and should be 5.4 to 5.8 pH. However,
    if the soil is alkaline through and you will need to find a different field. Soils
    with some clay are okay. However, heavy clay soils will not drain and chestnuts
    like most trees will not do well without extraordinary effort on your part, and
    it is best to find another field to grow chestnuts. However, we will tell you
    how to handle clay soils if your pH is below 6.5.


    +   3. Soil test is needed to see what it will take to grow healthy chestnut trees.
    A soil test from Dairy One[61] or your local Cooperative Extension Service will
    tell you if you need to add Sulphur and how much. The surface of the soil is often
    low pH, if it hasn’t been farmed in a few years and can be good so long as the
    subsoil is below 6.5pH. The soil test will tell you if the soil is deficient in
    any of the macronutrients and how much to add. Making adjustments is important,
    as a tree can only grow as well as the most deficient nutrient allows. These previous
    three steps should be taken before any planting endeavor, not just chestnuts.'
  merge: -1
  pgno: 183
