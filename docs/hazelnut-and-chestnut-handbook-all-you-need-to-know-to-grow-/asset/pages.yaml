  md: 'We purchased seedling trees from selections that other growers felt were exceptional
    trees. Many trees were multigenerational controlled or semicontrol crosses. At
    Z''s Nutty Ridge, in the first years, we planted over 6000 of those selected seedling
    trees. We have grown over 4000 of those trees well into maturity and many have
    died from blight or were too tender for our windy cold winters. The hazel trees
    that survive and are not severely hindered by blight, a wide range of nut quality.
    Some trees grow well and do not produce nuts. Some trees are aggressive growers
    and produce only a few nuts every year. Some produce a bumper crop where the branches
    are bent to the ground most years, and the nuts are tiny with very thick shells.
    Some nuts just don''t taste good and have an earthy taste like what we use. Some
    are sensitive to spring frosts and only produce some years. Out of the 6000 trees
    that were supposed to be from parents with hardy, EFB resistant, large-quality
    nuts, only eight selections we feel are very good and two are exceptionally superior.
    We are propagating the two superior trees, and we are actively watching and testing
    the remaining six. We are continuously gathering new genetics and controlled cross-breeding
    to bring an ever improving quality, hardness, and yield.


    Knowing that you have a 3000:1 odds of getting a superior tree even when starting
    out with knowing at least one of the parents were supposed to be exceptional,
    you realize you shouldn''t repeat this experiment unless you have lots of money
    and time to waste. We believe we will have more exceptional trees from controlled
    crosses of our best trees. However, those trees will need to prove themselves
    over time and are not ready for release.


    Having proved that you may clone stock tested for your area, you should still
    plant seedling trees. As stated earlier, hazelnut cannot pollinate themselves.
    Hazel trees need compatible pollen from another tree. Hazels and chestnuts are
    wind pollinated, so we need lots of pollen. If two trees are clones they cannot
    pollinate each other as they are really the same tree and essentially identical.
    Therefore, a clonal orchard with superior trees still need a cross pollinator.
    Ideally the cross pollinator will be clonal as well the two different clones will
    pollinate each other. Please check with your nursery and verify if you only need
    two different'
