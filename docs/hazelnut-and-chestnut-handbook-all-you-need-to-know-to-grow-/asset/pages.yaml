  md: 'bring about the hazelnut industry. This list literally could not exist a few
    years ago as only layers from Grimo and Z’s Nutty Ridge were available for the
    Northeast. Cultivar is just a clonally propagated variety.


    # SEED SAVING AND STRATIFICATION


    Nut trees are easy to propagate from seed. Before the seeds will sprout, the seeds
    must sprout hundreds of hours of stratification temperatures between 32 and 40
    degrees Fahrenheit. Your refrigerator is ideal for stratifying nuts. You just
    take the seeds you want to grow in a sealable bag and store in your refrigerator
    for two months. The seeds stored must be moist without being wet. The best way
    to keep the seeds moist is to blend in moistened moss with the seeds in a 50%
    mix with the seeds. It is important that isn''t water visible inside the bag or
    the seeds will mold. If you see water gathering on the bottom of the bag, take
    a rag to soak up the excess water and reseal the bag.


    After two months in the refrigerator most seeds will sprout when potted after
    three weeks. There seems a small percentage that will wait two seasons or two
    stratification periods, before they will sprout. If you see 70% of the seeds sprout
    and the remaining seeds don''t worry about it. Some will bring the seeds to a
    warmer room and put into a potting mix keeping the seeds moist and wait for the
    roots to appear and then pot the seeds. The latter method is a bit more work but
    you know that the pot will have a tree and not wait hoping the seed will sprout.


    We use soeless potting mix and any potting mix will except potting soil that is
    for acid loving plants. You can use any container from a paper milk carton or
    plastic soda/energy drink bottle. Just cut the top off the container and put a
    few holes in the bottom to allow water to drain. Your homemade pot should hold
    a minimum of six inches of soil to allow the roots to grow without becoming root.
    Root bound is when the roots have overgrown the space they were and the roots
    have intertwined on itself before you could plant the tree. Root bound trees when
    planted can stanie the tree growth with roots that choke each other denying proper
    growth, stunting the tree. It can take years for this issue to show! Keep the
    soil moist not wet. If the soil is over watered it will mold. If'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'too dry your seedling may go into shock and stop growing. Once in shock it
    may not grow for a month or even shut down for the season, stunting its growth.
    Hazel shutting down in this manner is another reason hazelnuts nearly indestructible.
    If there is a severe drought they just shut down for the season and come back
    next year.


    Everyone thinks that all they need to do is put the pots near a window under a
    generic fluorescent light and the seedlings will be fine. The light in spring
    is sparse to begin with and if they only get light from a window it will only
    be a fraction of sparse. Your trees will be spindly and weak. A standard fluorescent
    shop light that a couple years old will not generate enough light for your trees
    to sprout with. Think of the light source as energy for the tree and air is needed
    for the sap to flow through evaporation from the leaves. Good light and air flow
    will allow your trees to grow happily.


    You can now buy 5000 lumen LED shop lights for around $20.00 dollars. Buy two
    shop lights and the bulbs two feet from the top of the pots and have a timer run
    for the lights 16 hours a day. A second timer to run an oscillating desk top fan
    for 15 minutes at a time, 6 times a day during the time the lights are on for
    the first couple weeks after the trees have sprouted. Gradually, increase the
    fan to 30 minutes 6 times a day after a couple weeks. Most cheap timers have 15
    increments, so increase one of the six to 30 minutes each day for 6 days. The
    combination of a good light source and air flow will grow healthy trees. Keep
    the lights within two feet of the pots. If you have too many pots and the lights
    are farther than two feet buy more lights.


    Another important aspect of having seeds sprout is temperature fluctuation that
    follows the normal rhythm of the day and night. We initially had the temperature
    of the room in my house, where we wanted to sprout some seeds to a solid 70 degrees
    Fahrenheit and hardly any seeds sprouted. Meanwhile in parallel the seeds that
    were in the greenhouse without heat sprouted like crazy. Lights on 16 hours a
    day will warm the soil and pots if the area isn''t too cold to begin with. If
    you have a heating mat with temperature control, the same time as the light, set
    the heat to 72 degrees Fahrenheit. The room or cellar will be cooler at night
    allowing your seeds to see a similar temperature cycling in the field would see.'
