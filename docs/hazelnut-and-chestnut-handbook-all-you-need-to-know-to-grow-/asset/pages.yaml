    for USDA zone 4 and 5, disease productive trees. We are now constantly propagating
    our selected varieties, with one selected variety we named NITKA as shown in Figure
    #2-10 and Figure #1-1.


    # OUR NATIVE DISEASE - EASTERN FILBERT BLIGHT (EFB)


    The disease known as Eastern Filbert Blight (EFB) caused by the fungus Anisogramma
    anomalala is wind driven during the early to mid-spring periods. It causes a string
    of black pustules, as shown in Figure #2-11, along a branch and unless there is
    some resistance to the fungus that branch will die. The fungus will travel slowly
    through the whole tree and eventually kill it. In Figure #2-11, you can see rows
    of EFB pustules over a foot long on one bush that will surely kill each branch
    and ultimately kill the tree.


    > Our native hazelnuts have the opposite problem of our native chestnuts. Our
    native chestnuts die from an imported disease while the imported hazelnuts die
    from our native disease.


    To date, there have been seven strains of EFB identified at Rutgers University.
    There are probably more strains yet to be documented. EFB'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'resistant trees respond differently to each strain.


    An early indicator of how resistant a hazel tree is to the fungus, is how long
    the row of pustules is and do you see the tree recovering and scaring over the
    lesions after they form. Generally, the row of pustules will need to be less than
    six inches (15cm) long, and you will see the branch wall off the lesions with
    sap and within the year begin to heal over. Lesions longer than six inches indicate
    that the hazel tree isn''t resistant enough and over time may succumb to the Eastern
