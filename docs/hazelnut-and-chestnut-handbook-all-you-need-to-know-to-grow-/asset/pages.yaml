- img_proc: true
  md: 'Sunscald isn’t a disease but a condition that occurs in the middle of winter
    on a calm, cold and very sunny day. It doesn’t happen in the Northeast too often
    but when it does, you are very upset because you could have easily prevented it.
    You know if you suffered sunscald when the spring warms and the sap is flowing,
    you will see the south or southwest side (a.k.a. “Southwest disease](1861)) of
    the tree oozing out of cracks in the bark, generally near the base of the tree.
    Trees with a thin smooth bark have the highest risk. My trees that are over 25
    years old we don''t paint. The area where the bark cracked will die, and you now
    have an open wound to readily accept blight that can further weaken and possibly
    kill the tree.


    To avoid sunscald, simply mix a cheap interior latex paint with water in a 50/50
    ratio. We use a hand-pump sprayer to apply the trunk of the trees on the south
    and west sides of the trees. The south and west sides suffer during the shorter
    hours and low angle of the winter sun. We walk down the west side along the row
    and lower the trunk with a spray downward and quickly upward the south side as
    we walk by. We’ll define the trunk as the part of the tree that is most vertical
    and prior to where branches split off. White paint helps to stop the trunk from
    heating up by reflecting light. Figure #8-4 shows a trunk painted white with the
    bark missing from the previous year’s sunscald, and you can see how the bark is
    trying to heal over. If it doesn’t heal over a couple of years, the heart wood
    may start to hollow out and in 25 or 30 years could be hollow enough for the tree
    to fall over. Trees are long-range planning.


    As a reminder, sunscald may be directly related to how much fertilizer is applied
    mid or late season. An old adage is, "Never fertilize trees past the forth of
    July." For young chestnuts with a smooth bark that are susceptible to sunscald
    to begin with, you shouldn''t fertilize once you have receptive flowers. Flowers
    can open sometime in June.'
