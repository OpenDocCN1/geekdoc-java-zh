    # USE ALL THE SAME POSTS OR MIX AND MATCH AS NEEDED?


    We have found the biggest bang for the buck to use wood posts for corners and
    gate openings you need the stiffness to withstand the tension of the fence. You
    can use metal or cast iron along straight runs of fence. You will need to use
    wood on uneven ground or benches to handle the fence tension. We have also found
    some recommendations of fence manufacturers that the post spacing should not be
    more than 25 feet apart, and we suggest 16 to 20'' is a good range. Where there
    are slight bends in the fence, space the posts closer and where the runs are straight
    you can space them out farther. When there is a sudden bend in the fence, treat
    the bend as a corner and use wood posts. We have not seen a good method to use
    cast iron posts in the corner. If you do see a good method we describe in the
    fence section can be seen at an orchard supply website called Finger Lakes Trellis
    Supply at: http://www.fltsupply.com/equipment-sales.html. We do not make any endorsement
    for their operation, only that we and another orchard went into fence building
    together and rent their equipment along buying fence supplies for most of our
    deer exclusion fence. We had a very good experience there as were very helpful.
    There are fence suppliers everywhere and where there are fence suppliers there
    is equipment available too. Most local fence suppliers also rent All equipment
    discussed in this chapter is referenced at the end of this chapter of where to
    source it and at our website: Znutty.com for further additions and updates.'
