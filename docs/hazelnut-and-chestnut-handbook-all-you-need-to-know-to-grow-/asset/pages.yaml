  md: 'Cortland, NY.


    Our native hazelnut trees range is shown in Figure #2-8 in green. For the native
    hazelnuts to grow from Southern US to Northern Canada there has to be a varied
    set of genetics that allows for this adaptability. However, our native hazelnuts
    haven''t been selected to the degree that the European hazelnuts have. Our native
    hazelnuts produce nuts that are much smaller than the European nuts and tend to
    have thicker shells. Also, most importantly, the nuts are not as tasty and can
    have an earthy taste much different than the coffee flavoring that we use too.
    The main flavor that we associate with hazelnut is known as filbertone.


    Additionally, another way to look at our native nuts being smaller and having
    a thicker shell, is for every pound of nut meat (a.k.a. kernel) we will have much
    more shell weight than we would with the European hazelnuts. The ratio of nutmeat
    to shell is called percentage kernel. When we want our efforts and the trees''
    energy to grow nut meat (kernels) not shells! The larger the nut and the thinner
    shell the more efficient it is for food production as we show in Figure #2-9.


    Again, if we plant our native hazelnuts will we have a willing market? Do we need
    to have hybrids to have the hardness of the native hazelnuts or should we just
    graft the European trees onto our/hardy rootstock like grapes or apples?


    As most European and native hazelnuts produce suckers to form a bush. Grafting
    will be a perennial effort to cut off suckers multiple a year and then we have
    to worry about graft union failures. We have learned that hazelnuts when grafted
    seem to put up extra suckers as if it knows it has been grafted. European hazelnuts
    are usually killed by a fungus, known as Eastern Filbert Blight (EFB) by the fungus
    Anisogram anomala, which is native to our region, and neither bother our native
    trees. Also, European hazelnuts are too tender for our USDA zone 4 and 5 climate.
    It appears that we use hybrids of European hazelnuts, and our native cold hardy
    EFB resistant strains growing on their roots.


    This is why almost all hazelnuts grown in North America are grown in Oregon. In
    Oregon, they have been growing European hazelnuts for about 100 years where EFB
    was far away and shouldn''t infect their trees. However, EFB started showing up
    in the mid-1980s killing their trees. The hunt on'
