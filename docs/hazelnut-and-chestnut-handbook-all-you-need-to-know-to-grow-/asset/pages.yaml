  pgno: 118
- img_proc: true
  md: 'around $30 to $80, depending on volume of water needed through the regulator.


    Purchase drip emitters for each tree. We recommend 1.0 or 1.5 gallon per hour
    emitters. You will also need a punch tool that is less than $10. Simply push a
    hole in the irrigation line near each tree and push in the emitter. The emitters
    are 3 or 4 per dollar. There are different flow rates you can buy, and your water
    source and volume of water you can pump may determine the flow rate of each emitter.
    You can have one emitter fed or two trees by connecting tubes to distribute the
    water to each tree. We suggest you will only need one emitter per hazel tree,
    and if you are comfortable you have plenty of water volume available you can put
    two emitters per tree. Just put one emitter on either side of the tree. Also,
    if the tree is a larger nut tree such as a walnut or chestnut you should plan
    on two emitters per tree.


    At the other end of the orchard, we will need to close off the pipes after we
    have flushed out the system. We simply bend the ends of the pipe and tie tightly
    so the pipe can''t unfold. A plastic clip made in the figure “8”, aptly called
    a “Figure 8” is available for less than a dollar each that will do the same thing
    and does a good job without fear the string or wire will not be tight enough once
    water pressure is applied. Before you add the emitters or the figure 8''s to close
    the irrigation pipe, it is very important that you hook up the lines to the water
    and flush out the system. This gets rid of any dust or bits of plastic that will
    clog your emitters. Flushing your irrigation lines is a very important step to
    not clog your emitters. Replacing an emitter is easy and cheap. The problem is,
    you may not see the emitter not working until you see the tree wilting.'
