  md: 'Koro[16]_as shown in Figure #4-22 and Kania[17]_traps is another name brand
    of spring trap. Also, we realized that you only need to show the food and not
    actually make it available to the rodent. The nuts need to be well-fixed to the
    spring-trap. We put the nuts in a 1/2” or 1/4” square hardware cloth. The mini-cage
    formed around the nuts can be strapped to the trap-plate and is reused multiple
    times. The squirrels try to get at the food and the trap springs closed. The food
    remains ready for the next squirrel.


    Depending on your intention with your plantings, as it may be your intention to
    feed the wildlife with food that will last them through the winter; otherwise,
    you need to remove the rodents. It is best not to wait until the rodent population
    gets to the point of costing you yield loss. As soon as your trees start producing
