    # SIZING NUTS


    Most people only like the larger nuts for eating out of hand. To sort out the
    larger nuts, you will need to size them. The USDA standard we discussed below,
    also lists the names based on size.


    | Standard Name | Max. Size - inches | Min. Size - inches |

    |---|---|---|n| Jumbo | No maximum | 56/64 |

    | Large | 56/64 inch | 49/64 |

    | Medium | 49/64 | 45/64 |

    | Small | 45/64 | No minimum |


    Table #6-1, Size limits according to the USDA standards.


    If you want to size your nuts prior to sale the table above translates into hole
    size needed to have your nuts sorted. We made a farm based/sizer for less than
    $120 as shown in Figure #6-9 using 6" PVC drainage/vent pipe with a used geared
    motor driving a belt around the pipe. The pipe only needs to rotate about 30 revolutions
    per minute. The 6" pipe had increasing hole sizes every 18 inches and the largest
    nuts just fall out the end of the pipe. We purchased 45/64", 49/64" and 56/64
    inch drill bits. The pipe is held in place using urethane wheels from in-line
    skates roller blades. We have a smaller 2" inch pipe that rides on top of the
    6" pipe to push back in any nuts that want to get stuck in the holes. This design
    is easy to make in an afternoon. We just put under under the size under each size
    hole and again at the end of the pipe to catch the falling nuts.


    Of course, you can just purchase a sizer from Chianchia or another manufacturer.'
