  md: '# HAZELNUT AND CHESTNUT INTRODUCTION


    This book takes a practical approach to explain the nuts and bolts of how to grow
    hazelnuts and chestnuts. We know almost anyone starting out with hazelnut and
    chestnut trees may not know a lot about them, only that they are tasty and they
    like to grow them. We start from the idea of wanting to grow nuts and illustrate
    you through all steps, assuming you know little about nut trees. This handbook
    makes it easy whether you are planting two or 20,000 trees. We start with a brief
    history to explain how we have arrived to planting these amazing tasty permanent
    crops that are excellent for you and the environment.


    You will learn how hazelnuts are small native trees that are amazing to utilize
    for either your yard or a large commercial orchard. Hazelnuts are perfect for
    all the fallow fields throughout the eastern half of North America. You will come
    to understand the environmental benefits of hazelnut trees, and the nuts they
    produce are healthy, tasty and very profitable. We show what items you need, how
    to use them, and where. We also list where to get the items throughout the Northeast
    and Midwest. We have done our best to teach you how to grow hazelnuts with confidence,
    minimizing risk and cost, while maximizing success. This handbook, or we say “owner’s
    manual,” is your silent partner, giving you support and answers to questions as
    you take on this rewarding journey. After we show how to grow hazelnuts, we show
    you how to grow chestnuts by pointing out the differences from hazelnuts. Hazelnut
    and Chestnut orchards have a lot in common. It is even possible to grow them in
    the same fields.


    You’ll understand why hazelnuts have not been grown locally and why hybridized
    hazelnut trees are now a “new” highly sought-after crop for its native region
    that is the eastern half of the United States. We took 28+ years of our efforts
    that have yielded successes that often followed numerous'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'failures and condensed it into the practical knowledge needed to grow hazelnuts
    successfully. We avoid the boring technical details of every item and tell you
    what you need to worry about without all the scientific mumbo while giving you
    hyperlinks in the text you should decide to delve deeper on a given topic.


    There is extensive evidence from the scientific community about the health benefits
    of nuts as hazelnuts and chestnuts. The reported health benefits range from lower
    blood pressure, reduction in heart disease, cancers, diabetes, and nutritional
    deficiencies. Scientific research shows that regular daily nut consumption allows
    for overall improved health, quality of life, and life extension.


    Much of the hillsides are slowly returning to trees after being abandoned by farmers.
    Farms have consolidated over the years, and the hillsides that grew poor over
    time through erosion have been abandoned for the more profitable flat valley bottomlands.
    We will review how and why they were abandoned and why these fallow fields should
    be planted with hazelnuts, chestnuts, and other native nut-producing trees to
    rebuild the soil fertility. We teach sustainability throughout this handbook,
    without preaching against alternate existing chemical based methods as we have
    answers for the most common issues you face.


    When you decide to plant hazelnut trees, we take you through the planning and
    explain what is necessary when and how to be frugal with sweat equity where possible
    for small plantations. For mid-sized plantings like U-pick operations, we suggest
    the best methods for planting unique to hazelnuts. Your efforts may be to leave
    a legacy for the next generation or as a business that also benefits the environment.'
