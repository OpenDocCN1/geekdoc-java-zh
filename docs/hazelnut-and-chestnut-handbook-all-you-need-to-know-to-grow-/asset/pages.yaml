    Figure #4-32, Self-contained solar irrigation system external view


    There are a few other items to be mindful of when operating your irrigation

    system. Keep in mind that water from a pond must must be filtered before using

    itit for irrigation. In-line filters can be bought at any home store or from a
    farm supply store. Most filters from home stores are media-based and most likely
    cannot be reused and must be replaced adding cost in the long-run. Many filters
    from irrigation manufacturers are metal screen-based or plastic disc-based and
    are simply rinsed to clean. Larger irrigation systems use sand filters that you
    flush clean much like some pool filters. If your water has visible cloudiness
    to it, you may need two or more filters to successively filter finer and finer
