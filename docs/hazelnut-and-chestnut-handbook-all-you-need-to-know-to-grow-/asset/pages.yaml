- img_proc: true
  md: 'In either the bare root or potted tree, adding some probiotics in the form
    of bacteria and mycorrhiza to the soil when planting is a good idea. Some brands
    of probiotics treatment suggest dipping the roots in a solution or mixing a solution
    and watering the tree with it. A healthy microbiome will exist in the soil and
    have a symbiotic relationship with your tree. Mycorrhiza fungi and bacteria will
    feed from the tree roots, and in turn they will make minerals such as phosphorus
    that is normally bound, available to the tree. One probiotic example is available
    from Lallemand® Plant Care called Rhizocell®[30]_that does offer this relationship
    using Bacillus amyloliquefacens IT45. Rhizocellus establishes itself in the root
    zone and feeds from the root. In return, it stimulates root growth by secreting
    compounds and frees up the phosphorus allowing the plant to absorb it.


    Another product considered a biological fungicide provides another symbiotic relationship.
    The roots will feed the fungi that lives off the roots and provides anti-fungal
    properties protecting the roots from harmful fungi that may cause rot. A company
    located in New York BioWorks® offers RootShield® and RootShield@ PLUS[31] products
    for this purpose. BioWorks has harnessed the beneficial fungi Trichoderma harzianum,
    strain T-22 and Trichoderma virens, G-41. The actual strains rarely matter much
    to us, only that actively virening fungus forms a “shield” by growing and around
    the roots.


    These biologic products being natural are usually considered organic, but check
    with the supplier, like Arbico Organ[32], if concerned. Also, if you are going
    to use one microbe supplement make sure they are compatible with each other by
    talking or telling the manufacturers.


    We mention only three types of microbes that are present in the soil that have
    been selected to be beneficial to tree roots. There are untold, meaning we really
    don’t know how many different strains of beneficial fungi and bacteria already
    present in a healthy organic soil. We know most of the hillsides we are reclaiming
    gone through many years of depletion and are far from healthy the soil can be
    very thin and low in organic matter. If you add known good microbes will help
    restore the microbiome and'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'offer some help to your trees. Trees need a healthy microbiome just as much
    as we do.


    Once you have planted and watered your tree, add two to four inch of mulch around
    the tree, pulling the mulch back four inches from the trunk. Mulch helps conserve
    water and maintain a consistent soil moisture level. Mulch can turn acidic as
    it decomposes so lime may not be added to the mulch. Since mulch can turn acidic
    over time, so we do not recommend you add mulch if you are unwilling to replace
    it once a year. Once a year, the mulch can be pulled away from the base and drip
    line and new mulch placed back down after a light dusting of lime on the surface.
    Leave the old mulch in the field between rows to enrich the soil. Mulch as a soil
    amendment is always good and helpful to rebuild your soils.


    > In the past they said..


    > "Better living through modern chemistry"


    > Now we know..


    > "Better living through a healthy microbiome". JZ


    Water your young trees once or twice a week. Pay special attention to the soil
    during dry periods, adding enough water to soak the tree roots and surrounding
    ground. Apply 2.0 ounces or 5.0 tablespoons of slow-release nitrogen fertilizer
    in early spring the second year after planting the tree. We call this the third
    leaf. To explain, the first year a seedling planted is the first year it has leaves.
    The following year is the second leaf, most likely when you planted it, and the
    third year is the third leaf. Scatter the fertilizer under the tree, out to the
    drip line and do not allow fertilizer to fall against and is far enough away from
    the trunk that the fertilizer cannot wash up against the tree trunk. The same
    goes for large-established layered trees that are two years old when they arrive,
    you can add fertilizer the next year after planting.'
