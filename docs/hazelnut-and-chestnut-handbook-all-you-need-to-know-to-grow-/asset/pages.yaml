    # CRACKING NUTS


    There are numerous nut crackers you can buy with a quick search on the web. We
    cannot make a judgement on what cracker to buy. You need to review and decide
    what volume of nuts you need to crack and buy the right sized cracker. You will
    want a powered nut-cracker and the drill-powered crackers are a serious saver
    when starting out, so don''t buy a cracker that you cannot power by a motor. Granted,
    large processors have numerous crackers running in parallel adjusted for a specific
    size. We will have to adjust a cracker every time we run a different size to maximize
    the whole and half nuts that come out of the cracker. You now see your goal. You
    want to have as much whole and half nuts to bag as that is what people buy.


    # SHELL SEPARATION


    Once you crack the nuts, then you have the same issue you had with the nuts and
    husks. You need to separate the two. Again, an aired separator will work and be
    well illustrated by Don Price[52] on how to make one.


