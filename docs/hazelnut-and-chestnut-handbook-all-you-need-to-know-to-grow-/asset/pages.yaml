    # EASTERN FILBERT BLIGHT


    Eastern Filbert Blight (EFB) is a fungus that slowly kills the tree, branch by
    branch, over a few years for trees not tolerant of EFB. European hazelnuts are
    usually killed by the fungus, known as Eastern Filbert Blight (EFB) caused by
    the fungus Anogramma, which is native to our region and doesn''t bother our native
    trees. If you have trees that are suffering from EFB, you can choose to fight
    it or let the tree die and plant EFB tolerant varieties. If you choose to fight
    it as many growers do in Oregon, there are some methods to solve the progression
    of the blight. During the winter when the leaves are off the trees, the orchard
    is scouted for EFB lesions. Those branches are trimmed off a good 12” to 18” below
    the lesions where possible. The branches are gathered up and burned. The winter
    time is the easiest to see the blight and burning is safer with snow on the ground
    and a sure way to eliminate the fungus.


    As stated earlier, the fungus spreads during spring time, so removal of blight
    during the winter is best when the tree and fungus are dormant. Keep in mind if
    the lesions are long, say over 15 inches, you are fighting a losing battle. In
    Oregon, they do this to keep mature trees producing, while younger trees that
    are more resistant are being planted. There are antifungal sprays you can use
    and the most common one that is organic Bordeaux mix as is readily available at
    most farm supply stores. However, cutting out infected branches during the winter
    and follow up spraying during wet spring periods is the best combination to reduce
    the spread of EFB.'
