  md: '# FACMA


    # PROCESSING - SANITIZE, SIZE AND STORAGE


    Chestnuts being starchy will decay during storage and can have the storage life
    lengthened by sanitizing after the hot water heat treatment we discussed in the
    chestnut weevil that is performed as soon as possible after collecting them. After
    the heat treatment to sanitize the nuts is normally soaking the nuts in a solution
    of peroxide and peracetic acid that go by the names of StorOx[8][100] or SaniDate[8][101]
    made by BioSafe Systems LLC and all are OMRI[8][102]. The working solution using
    SaniDate 5.0 as recommended from BioSafe Systems is 13-17 ounces per 100 gallons
    and StorOx 2.0 is 35-47 ounces per 100 gallons. You must refer to labeling instructions
    on the actual product you buy and contact the manufacturer for any help or questions
    as they respond quickly. BioSafe Systems'' website[103] has good literature on
    usage rates and safety data sheets. OMRI is the listing agency for organic products
    that are suitable for use with certified organic production.


    At the State University of Michigan a study by Gonzalez, Fulbright, et al. [104]
    was performed to sanitize fresh chestnuts to enhance food safety and duration
    of storage. They found that Storox and a 0.92-ppm ozone solution was recommended
    for postharvest sanitizing. They also found out the nuts picked up from the ground
    versus nuts picked from the tree have 100 times the microbe contamination as you
    would expect from ground contact. So you really need to sanitize your nuts.


    USDA has upgraded the requirements of producers and now you must take a safety
    course once your sales reaches a certain threshold per year. That threshold under
    the Food Safety Modernization Act (FSMA) has updated requirements for any producer
    that has sales of $25,000 or more per year. Contact your local Cooperative Extension
    Agent for classes near you on the proper handling and documentation needed to
    comply with the safety regulations. The course is easy and the documentation requirements
    are not'
