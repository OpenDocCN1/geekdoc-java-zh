    # TYPES OF FENCE POSTS


    There are two basic types of fence posts, and variants of each, worth considering
    when putting up a deer exclusion fence. The basic types are wood and steel. The
    wood posts can be black locust, or cedar. The steel posts can be a formed steel
    or cast iron “T” posts. There are other posts for sale that we cannot recommend,
    such as tubular steel posts, fiberglass and plastic, as they will rust too fast
    or are too flexible for an eight foot fence. If all else fails and you cannot
    find any posts listed above you can always find pressure treated posts; but, keep
    in mind you will not be able to certify as organic using pressure treated posts.


    Information on each post type is as follows and which you choose will likely be
    determined by what is available and at what cost. Cedar posts are naturally rot
    resistant, but not as resistant as pressure treated and nowhere'
