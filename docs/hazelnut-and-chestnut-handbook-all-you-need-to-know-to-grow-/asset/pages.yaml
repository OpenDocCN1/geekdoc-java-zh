  md: 'current practice is to purchase seedlings and plant double density of 10 foot
    spacing in row and 20 foot spacing between rows. Seedlings have genetic variability
    and some hardy parent trees may not always give you hardy productive offspring.
    Hence, the double density will allow for you to remove the poor performers without
    losing years of growth. Please see tree varieties for selecting trees for your
    zone.


    # SOIL SURVEY


    GIS survey website will tell you what you can expect for pH, soil depth, and if
    it is considered well-drained. Well-drained is an important aspect for long term
    chestnut tree health. If your chestnut experiences waterlogged soil for a prolonged
    period, its roots will suffer and the tree will decline. We have been told by
    a grower that their tree was going great for nine or ten years and then a wet
    spring occurred and the tree died. Even if your site is considered well-drained,
    you must consider the spot where you plan to plant. Is there a swale where water
    may be contained until it is drained via subsoil, and in a wet year it may hold
    too often or for too long and damage your tree. Avoid low spots when you are planting
    the field.


    Soil is important for chestnuts as the pH cannot be 6.5pH or higher your chestnut
    will die. What disease resistant genetics are good for your location? We will
    list named tree varieties at the end of this chapter. Often you will test your
    soil at a depth of six or eight inches and the pH may measure 6.0. Idle land will
    often have surface soil with a low pH compared to the soil a foot or two deep.
    However, the soil down deep where the roots will grow may have a 7.0 pH. The GIS
    survey will tell you the pH down. As shown in Chapter 2, the GIS website you can
    set the depth for pH. For example, all along Interstate 190, that winds its way
    through the Northeast, the soils tend to be alkaline, which mean above 7.0 pH.
    If the soil down deep is equal to 6.5 or higher, do not attempt to plant chestnuts
    as your trees will most likely be weak and die. Again, we tell what doesn''t work
    so you don''t waste your time.


    If the soil pH is at or below 6.5 and is well-drained, then you may have a good
    site to plant chestnuts. Often, if the land has been farmed, the surface'
  merge: -1
