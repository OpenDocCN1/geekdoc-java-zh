    ![](img/b0cdf324a84eca7368c85fc1f3daf91b_53_0.png)


    Figure #3-2 Hedgerow orchard layouts for even spaced and alternate spaced rows.


    Harvesting in bush form is either through manual labor and for larger plantings
    is using a blueberry-type picker. When you need to switch to equipment over manual
    labor depends on what you can buy or rent a used blueberry picker for the size
    of your plantings. When trees are young and the yield is small per tree, it only
    takes a couple minutes per tree to pick by hand. When the tree is mature and with
    a heavy yield it can take 20-plus minutes per tree to manually pick the nuts.
    Ideally, you will join a nut cooperative in your area where they may be able to
    let you rent a harvester and then they can take your nuts process them and hand
    you a check. Alternatively, you can pay groups as a fundraiser for them to pick
    nuts. A chestnut grower in Ohio, schedules different groups to fill five-gallon
    buckets every day during the harvest season. The grower pays $11 for a bucket
    of clean nuts free of husks. Different groups from various churches to sports
    and youth groups are scheduled to harvest nuts in a'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'community-building effort and you can watch this video[15]. Although this example
    is for chestnuts, it should work for hazelnuts as well.


    Alternatively, you can hire a temporary crew to pick nuts from one of your local
    temporary day-labor services. Although not a U-pick operation per se, but as you
    are using labor to pick your nuts and then you process them for sale. For this
    day labor option to work you must know you have your crop solid and at a price
