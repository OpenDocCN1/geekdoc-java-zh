  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_48_0.png)


    Figure #2-13, EFB dead hazelnuts on the left and healthy hazelnuts of the same
    age on the right.


    Cloned hazels are trees that have been asually propagated. Asexually just means
    not through the normal process of pollen and egg from two different trees. Hazels
    are cloned mainly two ways and sometimes a third. The traditional way is to cut
    off the suckers that grow at the base of a tree and replant them on proper spacing
    in a process called sterile bed layering. The more modern method is through tissue
    culture sometimes called microcuttings. Tissue culture is taking a tree cutting,
    sanitizing it to kill all microbes and then place it into a sterile environment
    in a lab. The cuttings not have any roots but are placed into a medium that is
    gelled, contains sugar, vitamins, minerals, and hormones that would normally provide.
    When the shoots grow about three inches tall, they are recut at every leaf node
    and placed back into the medium. The shoots are multiplied until there are enough
    shoots to begin the process of rooting. Once rooted, the young trees are grown
    in controlled conditions further to put on a good size, and they are not ready
    for shipping until acclimated to the outdoors. Tissue culture can continue throughout
    the year and produce millions of trees per year. The third method is rooted cuttings.
    Hazelnut trees have proven difficult to get consistent rooting from cuttings and
    more experimentation is needed to be a viable method of asexual propagation.'
