    We have found that there are two main periods that hazel trees will develop EFB.
    The young tree within two or three years will show EFB or the tree won''t show
    any lesions of EFB until year 7 through 12 after they''ve had a few good years
    of heavy cropping. It is very concerning growing and nurturing a tree for over
    10 years, with good success, only to see it decline and die from EFB as shown
