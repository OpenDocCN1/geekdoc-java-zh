  md: 'sustainability should be readily achievable as the hazel tree is native unlike
    most annual crops grown.


    This assumes that you will sell nuts in shell directly to stores or online to
    the consumer directly. The majority of the hazelnuts are cracked; the nut meat
    is separated and is known as shelled hazelnuts. Hazelnuts can be pressed for oil
    and then the residual cake ground into gluten free, high-protein flour. The nuts
    can be roasted, candied, and flavored like any nut. You can extract the hazelnut
    flavor and sell it or make syrups, beer, or any number of alcoholic concoctions.
    To do any of the above yourself, you will need to become a certified/licensed
