  md: '# CHAPTER 5 - ORCHARD MAINTENANCE


    Orchard maintenance involves simple items you can do at any time, like walking
    the fence looking for repairs to more complex tasks like taking a leaf analysis
    and adjusting your fertilizer inputs to match. As we stated earlier, the orchard
    floor is the most important task and relatively easy as mowing the lawn. Knowing
    what to do and when will maximize results with the least amount of effort.


    The orchard floor is where most issues originate and where the most time is spent.
    For example, maintaining the orchard floor will minimize problems and maximize
    yield as well. Young trees shouldn''t give any grass underneath their leaves to
    ever. Once a tree is established, the weeds and grass have a hard time growing
    due to the shade. How to best maintain the orchard floor with the least amount
    of effort is the goal.


    Once trees start producing, you will appreciate a clean mowed orchard floor. We
    already know from Chapter 4 that a well-managed orchard floor keeps the rodent
    population to a minimum. When we go to harvest the nuts that drop, a clean orchard
    floor will help, if you are picking by hand or vacuuming the nuts up by equipment.
    Any mower will do, but for larger areas we strongly recommend using a flail mower.
    Either a rough duty or fine flail mower will work. First and foremost, you will
    be able to harvest all the nuts that fall onto the ground as you can see them,
    no matter what orchard type you have. For a single stem orchard, mowing is as
    much as you will be sweeping or vacuuming them up. Just before harvesting, using
    a lawn sweeper to pick up the sticks and stones just prior to harvesting will
    make the harvest faster and less debris in the harvested nuts. In bush form, you
    will either be picking by hand or using a blueberry/olive type harvester to beat
    the nuts and husks off.


    We use a rough-duty flail mower to beat apart any small rocks that get pushed
    up from winter frosts. A flail mower will chop sticks and grass'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'into fine bits unlike most mowers for quick decomposition while smoothing out
    the orchard floor. We always leave the grass (or legume) in place to provide green
    compost. We bought a 6 foot wide flail mower for under $2000 delivered from EBay.
    It is a rough duty mower, meaning the blades give a coarser cut and we will chop
    up sticks and stones. Our flail mower mechanically is light duty without reinforcing
    to take any abuse without damage. You can spend upwards of $10,000 for a very
    heavy duty mower that would be nearly impossible to damage and what you decide
    depend on terrain or budget.


    A well-mowed orchard as you go into winter is important as well, since a well-owed
    orchard floor will keep the rodents at bay. The rodents will eat young tree bark
    and roots in the winter. In the spring and summer if they do not have grass and
    weeds to hide, they are easy for birds of prey to harvest and do the work of protecting
    your trees for. We always have a sinister satisfaction seeing hawks hanging out
    in the orchard after mowing. It is as if we invited the hawks for snacking.


    # WEED CONTROL


    When the trees are young and you have irrigation lines running the length of the
    tree row, you can only mow in one direction. The grass and weeds must be removed
    from around the base of the tree. You have two methods to control weeds and grass
    around trees. The methods are weed killer and mulch.


    Mulches provide many benefits for the trees. Mulches suppress weeds (including
    grass), and the weeds that grow are easily pulled. Mulch insulates the soil helping
    to provide a buffer from the heat and the cold temperature swings. Mulch retains
    water helping to keep the roots moist and prevents the soil from getting compacted.


    Mulches come in many forms. Mulches can be oldsoil potting mix, compost, leaves,
    wood sawdust, newspapers, plastic sheeting, premade water permeable plastic discs,
    or hazel shells and husks from mature trees. We don''t like any solid forms of
    mulch as that just gives rodents an easy place to live and hide. Any form of mulch
    will decompose, and'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'generally when it does, turns acidic and if allowed to stay at the base of
    the tree unlimited, may turn your trees chlorotic, slow growth and even kill the
    young trees. Sawdust or wood chip mulch is especially good at turning acidic and
    should be a component of mulch and not be the mulch.


    Another often overlooked issue with wood chips or sawdust mulch is it uses nitrogen
    in the decomposition process. Anywhere in the Northeast, mulch can remain wet
    year-round and decompose quickly. As sawdust mulch decomposes and settles, it
    uses nitrogen near the top of the soil and is competing with the tree. A safe
    method is to add a pound worth of nitrogen for every fifty or so pounds of sawdust
    dust. You may see the problem with just using sawdust or wood chips as mulch.
    Wood mulch is the most readily available form of mulch because it is so readily
    available and inexpensive, you will have a tendency to use it. It is best if wood
    chips or sawdust has aged for a year in a compost pile that has been mixed with
    manure and grass clippings to generate your own compost. Composted manure in combination
    with wood is a much better answer for mulch.


    Compost is a subject matter for a book by itself. Healthy compost will have a
    proper Carbon to Nitrogen ratio (C/N) of 25-30 to 1 ratio. Saw dust is around
    300–400 to 1 C/N ratio[24]. Composted manure has about 15-20 to 1 C/N ratio. By
    mixing sawdust in manure compost, you would want about 50 pounds of sawdust to
    100 pounds of cow manure.


    Mulch needs to be at least two inches thick and shouldn''t touch the bark. Mulch
    is only good for one season on hazelnuts after which it needs to be pulled away
    from the tree. The old mulch is good if spread evenly between the rows to feed
    the soil. Raking the mulch toward the row middle and then mowing does a good job
    of spreading the old mulch around. Put down a quick dusting of lime where the
    mulch was and putting down more mulch in its place is a good organic method to
    control weeds. This effort if you are liming underneath the mulch, much can be
    saved, but you will see really isn''t much mulch left if it was only two inches
    thick when you put it down. You will still have to come through your orchard once
    a month to pull weeds from the base of the tree and those that pop through the
    mulch. You don''t have to make the'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'orchard picture perfect, but knowing that the weeds are controlled and aren''t
    competing with the tree is important.


    We discussed killing the weeds within the row as a way to get control of weed
    pressure where you plant your trees so mulch can do the best to control the weeds.
    The best method is planning some months ahead and rototilling the row numerous
    times a couple weeks apart. The first time you rototill you are just planting
    a tarp of seeds that will sprout over the next couple months. Rototilling every
    couple weeks will kill those sprouts and keep disturbing the roots of the weeds
    that need to resprout. Rototilling will also aid you if you have to amend the
    soil after having it tested. If you planned correctly you will not need to use
    weed killer. Another method to kill the weeds is to “solarize” the rows with black
    plastic or thick dark mulch like cardboard that you have stapled or otherwise
    fixed to the ground. The dark tarp or cardboard will heat and smother any chlorophyll
    based plant that was growing or sprouts. In either case you have planned a few
    months or a growing season ahead.


    Killing the grass and weeds is the easiest method over all. Weed killers are a
    toxic concoction of chemicals that will desicc or render biologic processes to
    cease, causing death to plants that have the chemicals applied. The chemical weed
    killers range in price from the generic Glyphosate salt at about $25 a gallon
    to organic horticultural vinegar at $50 a gallon. Other organic weed killers use
    citric acid and oils. Glyphosate is used at four to six ounces a gallon, while
    horticultural vinegar is a quart to a gallon, meaning the generic glyphosate is
    16 times cheaper per gallon than organic weed killer. This example is why organic
    food is more expensive than food produced from the government-supported industrial
    farming. Overall, all weed killers are very acidic and will need you to adjust
    the surface back to closer to neutral after a dozen or so sprays of any weed killer.
    If you monitor (and you will) the pH of your soil and especially where you spray
    for weeds you will know when to add lime. Keep mind when adding lime the ability
    to adjust the pH in a meaningful way takes time. Lime moves only a ½ inch per
    year if not worked into the soil.


    Another method to kill weeds is with flame based weed killers. The obvious need
    to keep away from the trees will still have weeds growing at the base of the trees
    and flame weed killers do kill the top of the trees but not'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'the roots and the weeds that have energy stored in their roots quickly re-sprout.
    Between the irrigation pipe and the need to stay away from the tree, flame-based
    weed killers aren’t recommended. Again, we tell you what doesn’t really work so
    you won’t be tempted to expend energy and money trying it out.


    Overall, the least effort to control weeds underneath your young trees is a combination
    of mulch with additional assistance from weed killer. You replace the mulch yearly,
    dust with lime, and repeat for three years. Whether you use organic or chemical
    means to further control weeds is to you. We have been told more than once a grower
    was going to do the easiest and cheapest method to get the trees established for
    three years and then spend the next three years getting organic certified just
    in time for good crops of nuts.


    The weed killing methods discussed so far are considered emergent weed control.
    This means you are controlling weeds once you see them growing. There is now an
    organic pre-emergent or weed prevention control method other than compost mulch
    you can use. Corn gluten is used to prevent weeds from growing. A common readily
    available product called Preen is made by Lebanon Seaboard Corporation is available
    at most home stores. Also, as it decomposes it provides food for your tree. Directions
    to reapply to the soil surface every four to six weeks. We do not have direct
    experience using corn gluten around the base of the tree and will be experimenting
    presently. Corn Gluten is readily available on Amazon and check your local feed
    store as corn gluten is a main ingredient in many animal feeds.'
