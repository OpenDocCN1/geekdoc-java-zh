    In the beginning of our endeavor, we purchased rolls of four foot tall metal fence
    when we first started out to protect individual trees, and after 25 years the
    fence is pretty rusted and breaking apart. The posts we purchased 25 years ago
    were either cedar or pressure-treated, and we have replaced most of those as well.
    So longevity of the fence is a concern along with initial costs and equipment
    investment. Keep in mind, since hazelnut trees or any nut tree will last for a
    few lifetimes, any fence will need replacing eventually.


