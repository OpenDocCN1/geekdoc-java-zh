  md: 'We know everyone that we have witnessed just starting out growing trees have
    a resistance to pruning trees. We know we were there too. We have found it best
    to not think of pruning as amputation of branches, but think of pruning more over
    the lines of a haircut. A trim here and there and you have a new haircut to show
    off. When cutting branches over 3/8 in diameter, please use a larger pruner a
    lopper and cut cleanly without twisting the pruner while cutting or you will tear
    the bark and allow entry for diseases like chestnut blight the bark not dry out
    over the winter. Not twisting the pruner when cutting branches will save some
    of your trees and save you from replacing your prun from getting bent. Clean cuts
    dry and seal the quickest. A young tree will grow over the cuts as the diameter
    increases over a couple of years.


    When pruning branches, do not cut flush to the trunk; cut the branch just above
    the branch is thicker before it attaches to the trunk and at the same angle as
    the branch grows out of the trunk. A good source of orchard hand tools is A.M.
    Leonard.


    # FERTILIZATION


    The amount of fertilizer used for chestnuts is literally the same as fertilization
    for hazelnuts. Young trees will need more fertilizer as they get bigger, as the
    drip line increases in diameter. According to the late Jeff Olsen of OSU Extension
    Service Nutrient Management Guide EM9080^{69}the first year you fertilize your
    trees give 0.25 pounds of nitrogen, the second year give 0.33 pounds of nitrogen
    and incrementally increase to 0.75 pounds of nitrogen by year. Jeff Olsen recommended
    using suggestions for hazelnuts and chestnuts. If in doubt, take a leaf analysis
    no less than every year as it may take a couple of years to recover for deficiencies
    like boron.


    Understand that 0.25 pounds of nitrogen will require 0.5 pounds of 50-0-0 fertilizer
    or 1.0 pound of 25-0-0 fertilizer. The numbers represent, in order, Nitrogen(N),
    Phosphorus(P) and Potassium(K) by percent in weight. So a standard 10-10-10 or
    commonly called triple ten fertilizer will need 2.5 pounds of fertilizer to get
    0.25 pounds of nitrogen. The 10-10-10 means the'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'bag contains 10 percent each of N, P, and K. So for every pound of fertilizer
    from the bag it will contain 1.6 ounces of each N, P, and K.


    The previous paragraph can be restated in another way. Add two ounces of Nitrogen
    per inch diameter of tree trunk for a tree that is growing normally. So if a tree
    has a three inch diameter tree trunk and you are using triple twelve (12-12-12)
    fertilizer the following patterns applies:


    2/16*3*100/12 = 3.125 pounds of fertilizer for a 3” diameter tree.


    Michigan State University published[20] a similar recommendation as stated above.


    Timing of fertilization for chestnuts is different than hazelnuts on young trees.
    A reminder on fertilizing young trees, do not fertilize the fourth of July and
    in the case of chestnuts we need to modify this old adage. Chestnuts with their
    aggressive growth it is best not to fertilizer flowers open or an increased chance
    of sunscald (Southwest disease) will occur. This can be in the middle of June
    some years. Chestnuts with their fast growing bark will not harden properly for
    winter increasing your chances for sunscald.


    When your trees are older and have a bumper crop, you will need to do a leaf analysis
    when the nuts are half filled in August. If the leaf analysis shows a deficiency
    which you will need to fertilize or your nut production may suffer next. Keep
    in mind leaves of the chestnut trees often start falling as the nuts ripen or
    just after.


