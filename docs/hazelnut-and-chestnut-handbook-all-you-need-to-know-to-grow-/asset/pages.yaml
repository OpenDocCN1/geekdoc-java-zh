    # CROWS AND BLUE JAYS


    Crows and blue jays are two birds that once they find their hazelnuts, they bring
    friends. Yep, you read that right, they actually bring friends. We have planted
    our seedlings and came back to water them to find them partially yanked out of
    the ground minus their attached nut. By the way, if planting seedlings and the
    nut is still attached, break off the nut and toss. The seedling no longer needs
    the nut, so don''t give an excuse to a crow or squirrel. Also, once your nuts
    ripen, you will start seeing blue jays in pairs flying around your orchard. Blue
    jays operate in an intelligent and synchronous method to strip the trees of nuts.
    Birds are long-lived and'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'crows often live to be 35 years and blue jays have been known to live 20 years
    in captivity but most likely live seven or eight years in the wild. Birds live
