  md: '![](img/b0cdf324a84eca7368c85fc1f3daf91b_62_0.png)


    Figure #3-6, Hazelnut catkins (male flowers) at Z''s Nutty Ridge LLC.


    Catkins will elongate only after enough winter chilling hours and after enough
    warm days and evenings. We use warm as a relative term as we do not think of February
    as warm. For example, during the last two weeks of February 2017, we had 11 days
    of >40 degrees Fahrenheit or higher during the day and eight nights of above freezing
    temperatures. This warm spell was enough to get most of the catkins elongating,
    and some were beginning to release pollen by March 2. On the evening of March
    4 and 5, we had two consecutive nights when the nighttime temperatures dropped
    to 1 and -4 degrees Fahrenheit with strong winds. The catkins once elongated are
    susceptible to desiccation and will fail to release viable pollen. Our pollination
    season was essentially over after two days, and not three or four weeks as it
    normally is. So only the earliest of female flowers that were open for those two
    days were pollinated and only the hardy flowers that can handle the cold desiccating
    winds were able to produce nuts. Very few had viable catkins afterward, and they
    are a source of future breeding. As a grower this sounds like a bad year. However,
    as a nursery, 2017 was ideal'
