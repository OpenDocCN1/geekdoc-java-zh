    # Figure #8-1, Pruning shape by year


    Chestnuts tend to be spreading and when mature are a wonderful shade tree. Therefore
    we don''t allow branches to form below six feet, or you won''t be able to maintain
    your orchard with any equipment. At the end of the first growing season during
    the coldest winter months when the leaves are off the trees, it is the best time
    to prune. any side branches off to encourage tall straight growth, and you will
    have what appears to be a single stem. Often you will only have a single stem
    so no pruning will be needed. In the second year, assuming that the tree has exceeded
    six feet, trim off any branches below six feet and encourage just four branches
    with a good angle to remain. Branches that are almost parallel to the main central
    leader are no good and need to be cut off over time they will split. In the third
    dormant season, trim back the secondary branches that are forming to one or two
    per each of the four main branches you left in the previous year. These branches
    will give the tree proper form with a strong scaffold to support what will become
    a very large and long lived tree for many generations. If your trees do not have
    the height described the second or third years, pruning may be delayed a year.
    This is the basic understanding needed to form your chestnut tree, and there are
    numerous sources on YouTube to watch as well.'
