    the way in as you need the wire to be able to slide for tensioning. The ends are
    pulled tight by hand and twisted together so they cannot be pulled apart. Twisting
    high tensile wire is difficult to do well enough so it doesn''t come apart with
    tension and you will probably to join ends with another method.


    Alternatively you can buy “crimps” to join the ends. Once the ends of the loop
