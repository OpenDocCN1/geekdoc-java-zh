  md: '# CHAPTER 6 - HARVESTING


    # HARVESTING BASED ON ORCHARD TYPE


    The basic steps of harvesting hazelnuts are the following: ripe nuts ready for
    picking, orchard floor is well maintained, pick the nuts by hand or machine, separate
    the husk from the nuts and field debris. To sell your nuts, you will need to sanitize
    and dry the nuts, probably size the nuts, then bag and label the nuts for the
    market you intend to sell too. You can further process the nuts by cracking, separate
    the kernel from the shell and then sell or continue processing by pressing for
    oil and have hazel flour as a secondary product. Once you have enough volume,
    you may want the capabilities to do all in parallel. However, all operations needed
    to sell the nuts after harvest are usually done by a cooperative that the grower
    belongs [33].


    Once you process the nuts beyond the shell, safety regulations kick in and licenses
    must be obtained with the necessary procedures in place for safety. As discussed
    earlier in Chapter 3, the orchard type planted will determine what is needed for
    harvesting preparations needed. The three types discussed are the U-Pick, Hedge
