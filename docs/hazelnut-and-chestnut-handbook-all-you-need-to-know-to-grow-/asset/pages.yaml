    strips for planting trees in a new orchard.


    The tension wire is just low tensile or high tensile electric fence wire. The
    wire is wrapped around the top of the side post and down to the bottom of the
    corner post in a loop as described above. The position of the wire is held by
    using two fence staples on the corner post near the ground. Where possible, we
    leave an inch or so of the brace pin exposed on the side post cross brace and
