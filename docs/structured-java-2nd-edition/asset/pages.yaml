    # String Data


    Character Data (char). The basic type of String Data is Character. Characters
    are a single Alphanumeric (A, B, C, ..., 1, 2, 3...) and a number of non-character
    symbols (#, @, !, %...). Most computers use one of two codes for Character data.
    ASCII (American Standard Code for Information Interchange) or Unicode. Java uses
    Unicode which is a superset of ASCII. ASCII uses one byte to represent each number
    or character. Unicode uses two. While ASCII is pretty much limited to the English
    characters and some symbols, Unicode also gives you most of the international
    characters. To give you a rough idea of the encoding scheme:


    | Byte Value | Characters |

    | 48-57 | 0-9 |

    | 65-90 | A-Z |

    | 97-122 | a-z |


    Unicode uses the same codes for these characters.'
