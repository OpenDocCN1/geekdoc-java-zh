- pgno: 161
  md: '![](img/0f17be71ede4ad1bd58cde868620a678_161_0.png)


    Analysis means collecting and understanding requirements. Requirements are everything
    that the software needs to accomplish. They include everything from:


    +   1. Inputs

    2. Outputs: Reports, Files

    3. Databases

    4. GUIs

    5. Business Logic

    6. System Requirements

    7. Performance Requirements

    8. User lists

    9. Security Requirements


    You usually end this phase with an analysis review to get changes and a sign off
    on the requirements document from the customer. This should be treated as a contract
    between you and the customer.'
