  md: '# Expressions


    Expressions can be looked at as the left hand side or part of the left hand side
    of the assignment statement. They generally come in two types:


    +   1. Arithmetic expressions

    2. Logical expressions


    Personally, I would make liberal use of parentheses to make certain that my meaning
    is clear. I would also break up large expressions, by assigning them to intermediate
    variables, to be certain that others understand what I am saying. Breaking up
    equations also helps in debugging, by allowing you to see intermediate values.


    # Arithmetic Expressions


    An Arithmetic expression is an expression that returns a numeric value. The arithmetic
    operators that we will use are:


    +   + Additive operator (also used for String concatenation)

    - Subtraction operator

    * Multiplication operator

    / Division operator

    % Remainder operator


    The order of precedence is the same as in basic mathematics:


    +   parentheses (),

    negation (-),

    multiplication (*,/,%), and addition (+, -).


    You can logically put an arithmetic expression in any place that you would place
    a hard coded primitive variable of the same type. They never stand alone. Examples:'
