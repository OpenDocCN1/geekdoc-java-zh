  md: '# Chapter 4 Methods


    Note: Methods cannot be defined inside other methods. They must be defined within
    the class definition, but outside other method definitions.


    # Designing Methods


    Methods have been around for a long time and ways to build good methods have been
    discussed many times as well. Methods have had almost as many names as there are
    programming languages. You will also hear those called functions, modules, or
    procedures.


    Methods serve several purposes in structured programming:


    +   1. They allow you to break up code into smaller coherent chunks.

    2. They allow you to reuse code.

    3. They allow you to share code easily.

    4. They allow you to test code separately.

    5. They make code easier to read and understand.


    The main design goal of a method is to build a black box. A black box is an idea
    that has an almost identical relationship in physical design. It is an object
    where the inputs and output are known, but the internal workings are a mystery.
    The object can be swapped in and out as needed without adversely affecting the
    workings of the rest of the system.


    In order to meet this goal, we introduce the terms, cohesion and coupling.


    **Cohesion** is the concept that a method has one purpose and its independence
    from other methods. A method with one purpose is thought to be one with high cohesion,
    one with more than one purpose is thought to be of low cohesion. How can we tell
    if we have a'
  merge: -1
  img_proc: true
- pgno: 61
  md: "method with high cohesion? A simple rule of thumb is to define the purpose\
    \ of a method with one sentence. If that sentence cannot be stated without using\
    \ the terms “and” or “or” (or any related conjunctives) you do not have a highly\
    \ cohesive method.\n\n**Coupling** is the concept of how any two modules communicate\
    \ with each other. Coupling ranges from loosely coupled to tightly coupled. The\
    \ goal here is to be loosely coupled (again think of the black box). A loosely\
    \ coupled pair of modules do not have to know anything about each other to work\
    \ together. It is much easier to trace the data flow between modules. To test\
    \ this module all you have to do is build a driver program that fakes inputs and\
    \ prints out the outputs. The different levels of coupling are:\n\n+   - Loose\
    \ Coupling\n  - Calling parameters (Primitive and Reference data types)\n  - Function\
    \ Returns (Primitive and Reference data types)\n  - Messaging (Message Coupling)\n\
    \  - Files (External Coupling)\n- Tight Coupling\n  - Global variables (static)\n\
    \  - Content Coupling (Accessing the local data of another module)\n\n**I would\
    \ never use global variables or access the local data of another method.** Global\
    \ constants are fine, since they cannot change. As I mention below I would restrict\
    \ messaging and files to specialized methods.\n\nMethods can usually be grouped\
    \ into one of several types:\n\n**Control methods** – These methods select from\
    \ one or more options of program flow. Your main method is usually a control method.\
    \ Unless it is your main, the option should be passed as a parameter or be based\
    \ on the input (type of record in a file) and clearly defined."
  merge: -1
  img_proc: true
- pgno: 62
  md: '**Input/Output Methods** – It is recommended that you build one method for
    each file/report/message queues you are reading/writing from to isolate any changes
    in format to that method.


    **Processing methods** – These are known as business logic methods; and will be
    your major methods.


    During development you will probably produce two other specialty methods.


    **Driver methods** – These are small, usually main, methods built to test methods
    that cannot be tested otherwise. They usually consist of little more than the
    minimum number of type definitions, print statements, and method calls needed
    to test your code.


    **Stubs** – these are the first version I write of a new sub method. A stub consists
    of little more than the method header, a set of print statements to validate the
    input arguments, and a valid return statement. I then fill these in as I write
    and validate the rest of my methods.


    Methods should usually:


    +   1. Have one entrance and one exit.

    2. Be short and clear.

    3. Have a single purpose.'
