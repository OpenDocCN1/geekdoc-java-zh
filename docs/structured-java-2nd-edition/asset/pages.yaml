  md: '# # Chapter 3 Data Types


    # ## Bits and Bytes


    The computer processor and memory works in binary, or zero and in-binary, zero
    and one. These are referred to as bits. These bits are usually grouped in sets
    of eight bits or a byte. Most computers work in some number of bytes. The oldest
    microcomputers used 1 byte or 8 bits, later they graduated to 2 Bytes or 16 bits.
    Most computer processors and operating systems today can handle at least 32 or
    64 bits. Windows comes in either of these two flavors. 64 bit Windows will support
    most programs built for the 32 bit Platform.


    The memory in a computer has an address. This is usually denoted as a Hexadecimal
    (base 16) number with a range based on the number of bits that the operating System
    has. For instance, theoretically, a 32 bit Windows System can access $2^{32}$
    addresses or 4 billion addresses (4 GB addresses). If each memory held 32 bits,
    then this system could theoretically hold 128 GB of memory. Since a 64 bit processor
    could theoretically hold $2^{64}$ addresses at 64 bits per address, you see how
    far this goes. Of course, this is only theoretical, they don’t really access that
    much memory and besides you couldn’t afford it.


    Larger processors do allow you to access larger numbers for mathematical operations,
    which used to be a real issue.


    Even given the binary system, computers by themselves could only understand unsigned
    integers.


    Mathematicians, Computer Scientists, and Language developers have developed a
    systems of codes that map the unsigned integers to different data types. This
    allows these memory locations to be used as data. These are known as the basic
    data types.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'types are usually grouped into numeric, String, and Boolean. In Java code,
    these are called the Primitive data types.


    # Primitive Data Types


    | Primitive Type | Value |

    | --- | --- |


    The name of a Primitive data type is its memory location and denotes the actual
    value. For instance, one of the basic types, is int (or 32 bit signed integer).
    To define a primitive type you give its type and name, for instance:


    ```

    int Counter;

    ```


    You can define more the one variable, as long as they are of the same type (I
    believe this can be less readable):


    ```

    int Counter, Distance, GeoStationaryAngle;

    ```


    Alternatively, you can set an initial value for the variable:


    ```

    int Counter = 0;

    ```


    The primitive data types are always passed by value. This means that when they
    are passed into a method, the value is copied into a new memory location. This
    second memory location is then used by the method. Any changes do not affect the
    calling routines variable. Therefore, when you return from the method, your original
    value is unchanged. We will discuss this in more detail later.


    Java numeric values have two types signed integer (-x to x) and floating point.
    There are no unsigned integers in the primitive types.


    # Signed integers'
