  md: '# Using the Java compiler


    To use the Java compiler go to the search window in Windows and type in "cmd",
    which will bring up the command window.


    Note the drive that Windows assigned your flash drive,


    Assume F is the drive that Windows assigned to your flash drive. Assume that that
    > is the cursor.


    In the Command Window type


    ```

    F: (or whatever drive the flash is on)

    cd user

    ```


    type


    ```

    cd user

    ```


    now open javasetup.txt and copy and paste the contents into your command window.


    javasetup.txt consists of two lines:


    ```

    set CLSPATH=.;\java\bin\..\Notepad\Notepad++

    set PATH=Path;..\java\bin\..\Notepad\Notepad++

    ```


    Note: CLSPATH is a variable that tells the Java compiler where to look for any
    packages, such as CSCI. If you are working in user CSCI it is in user/CSCI. If
    you are not in user you must move CSCI to be a subdirectory under your directory
    or change the subdirectory.


    Likewise, if you move the level of directory that you are working on, you will
    have to change the path.'
