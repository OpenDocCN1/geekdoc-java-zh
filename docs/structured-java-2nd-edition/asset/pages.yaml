  md: 'The allows float to use 1 bit for the sign, 8 bits for exponent, and 23 bits
    for the mantissa and gives you about 6 to 7 decimal point precision.


    The formula for double is similar except that there are more bits available for
    the mantissa and exponent.


    Which one should use normally? I would suggest float, except that all of the Math
    library classes expect double. So I would recommend sticking to double, since
    you will need the math libraries at some point.


    ```

