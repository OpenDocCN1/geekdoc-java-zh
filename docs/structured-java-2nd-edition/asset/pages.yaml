    \ quest for perfection. Ever since computer software started, people have been\
    \ trying to improve the software development process. In my experience, I have\
    \ probably been exposed to five or six different methodologies. In my opinion,\
    \ at their heart, they all are varieties of the waterfall process, so this is\
    \ what I will expose you to with one slight variance.\n\nThe waterfall process\
    \ recognizes that like building a skyscraper it is more expensive to fix problems\
    \ or make changes the more of the building is built. For instance, it is significantly\
    \ more expensive to"
