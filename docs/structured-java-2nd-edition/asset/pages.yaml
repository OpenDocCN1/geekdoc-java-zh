  md: "# Case or switch Statements\n\nCase Statements are a way of simplifying embedded\
    \ if else if statements. Unlike sequential if statements, they cannot be mutually\
    \ exclusive. In Java they are only useful for an int, char, or String variable.\
    \ They are actually less useful than they first seem. You have to know at compile\
    \ time, exactly what cases you are going to need. The formats are:\n\n```\nswitch\
    \ (SwitchVariable) {\n  case value1:\n    step1;\n    step2;\n    break;\n  case\
    \ value2:\n    step1;\n    step2;\n    break;\n  default:\n    step1;\n    step2;\n\
    \    break;\n} //end switch\n```\n\nWhere\n\n+   - switch is the switch keyword.\n\
    - SwitchVariable is a variable of type int, char, or String on which the cases\
    \ depend.\n- case is the case keyword.\n- value1, value2, etc. are the individual\
    \ case values of the same type as the SwitchVariable. (These are almost certainly\
    \ hard or Constants).\n- step1, step2 designate any valid java statement.\n- break\
    \ is the keyword that skips to the end of the switch statement, without it the\
    \ next case is automatically executed whether it is valid or not. Do not forget\
    \ the break statement.\n- default is the keyword for any value that is not included\
    \ in the cases."
