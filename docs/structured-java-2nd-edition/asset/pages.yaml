- pgno: 16
  md: '# Chapter 1 Compilers


    We have come a long way since the first days of teaching computers how to be useful.
    But languages and compilers are still complicated and need to be understood. The
    basic parts connect to the error messages that you get when you compile a program.



    When I first started programming, you would submit your entire program as a card
    deck to the computer operator who would then load it into the computer, and spit
    out a printout with your errors. You would then painstakingly go through this
    printout to try to uncover every error and fix your cards. Then, resubmit your
    fixed cards and hope for no errors. Repeat until finished. Sometimes, it would
    be hours between the long lines of submitting your deck and receiving your printout
    due to other students doing the same thing, so you spent a lot of time on each
    iteration.


    Now you can code in an editor, run the file through the compiler, get your errors,
    and fix them, and try it again immediately. This is the real progress. This is
    why I advise writing part of your code, try compiling it, fix your errors, and
    test it. Then when you are happy with it, write some more. I call this process
    Write a Little, Test a Little.


    This is as good a time as any for a brief discussion of compilers.


    As we discussed in the introduction. Computers are stupid. They only understand
    zero and one.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Machine Language


    The Computer Engineers that create a computer processor build in a set of instructions
    that are called **Machine Language**. Machine language consists of sets of numbers
    that directly reference registers, memory locations, instructions, etc. There
    are no letters involved. This is unique for each processor. Machine Language is
    executable code. In the simplest terms, processing looks like:


    ![](img/0f17be71ede4ad1bd58cde868620a678_17_0.png)


    The processor gets instructions from the Machine Language Source, it interacts
    with its registers (very fast memory) and takes action based on those instructions
    and goes back for more instructions.


    # Assembly Language


    It was felt that writing machine code was too hard for humans to understand, so
    the next generation was called **Assembly Language**. Assembly was a little better.
    Assembly instructions consisted of three or four letter mnemonics for the instructions
    and registers. Usually, memory locations still had to be addressed as numbers
    in hexadecimal. There was usually a one-to-one correspondence between assembler
    instructions and the Machine language'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'instructions. So the Assembly language was still highly tied to the processor.
    You ran the assembly code through an Assembler to build the machine language (aka
    executable) code. This code then ran in the same fashion as described before.
    You still had one assembly language for each manufacturer (IBM, UNIVAC, etc.).


    ![](img/0f17be71ede4ad1bd58cde868620a678_18_0.png)


    They finally got the idea that we could build languages that were almost human
    readable. I say almost because you still have to understand the vocabulary, grammar,
    and syntax of the language. These languages are termed third-generation. Some
    claim to be fourth generation, but I don''t believe that any have broken out that
    far. Each of these languages have some form of Instructions, Variables, and Methods.
    They all allow you to combine many Machine language instructions into one simple
    statement. They all shield you from worrying about registers and the inner workings
    of the processors. Although some will let you get involved at that depth (for
    performance). This has the following Benefits.


    +   1. Languages tend to be transport (to some degree) amongst systems. Unfortunately,
    some vendors built many additions to languages (termed extensions) that even the
    source code was not transportable from one generation to the next for the same
    system.

    2. Languages are much easier to learn.

    3. Languages are much easier to maintain and modify. This does depend on the previous
    programmer. People can write unreadable (or as I like to call it write-once) code.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'These languages generally fall into two types Compiled and Interpreted.


    # Compiled Languages


    Compiled languages, such as C, FORTRAN, Cobol, and C++ Take the source code and
    run it through a compiler. The compiler takes several passes and finally (assuming
    that there are no compile errors) generates executable code. You have to build
    one compiler for each processor.


    ![](img/0f17be71ede4ad1bd58cde868620a678_19_0.png)


    # Interpreted Languages


    Interpreted languages, such as Basic, take the source code and at run time generate
    the executable code. Compile errors and run-time errors are both detected at run.
    This is almost (not quite) as though each line of code is turned into machine
    code immediately. What are the benefits? Interpreters give immediate feedback
    and really came into use when the first micro-computers came into vogue. The systems
    were very small and interpreters did not take very many resources. Most of your
    Operating System command languages are interpreted. Compilers are far better for
    batch processing (which is what the original computers were designed to do), and
    give you an idea of more of your errors at one time. Far better, they gave you
    a clean bill of health (as far as compile errors) before you tried to run it'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'and they allowed the system to maintain the executable code separate from the
    source code.


    ![](img/0f17be71ede4ad1bd58cde868620a678_20_0.png)


    As you can see the interpreted process is very complicated and while not quite
    executing line by line, you can consider it to be that for simplicity.


    +   - The interpreter takes a line of source code.

    - Turns it into machine language.

    - Machine language is then fed to the processor for action.

    - Interpreter goes back for more source code.


    # Java


    What is Java. Java has a compiler (javac), but that compiler does not generate
    executable code. Instead it generates java binary code that you have to run though
    the Java Interpreter (java). I would call this a Hybrid language. This gives it
    the following benefits:


    +   1. Like a compiled language – most compile errors can be detected at compile
    time.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '2. The Binary File can be maintained separately from the Source code.

    3. The Binary File is “guaranteed” to be machine independent. So you can compile
    on a Windows machine and execute on a Mac.

    4. It should run much faster than an interpreted language.


    ![](img/0f17be71ede4ad1bd58cde868620a678_21_0.png)


    # Steps to compile and run a Java program


    Assuming that you have loaded the compiler into your machine or are using the
    class Windows flashdrive, and have setup up the PATH (to reach javac) and CLSPATH
    (to reach the directory and import files) system variables correctly, you can
    run the compiler on your program file: ProgramName.java as


    +   - javac ProgramName.java


    The compiler statement either generates errors, or if error free, the file ProgramName.class.
    If there are no errors, then you can run the program


    +   - java ProgramName


    and it will display any output generated or generate run time errors.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Parts of a Compiler


    Now let''s have a brief discussion on how a Compiler turns your Source code into
    executable Machine Language, or in the case of javac, into Java Binary Code. This
    discussion will help you in your future efforts to debug programs. Understanding
    the parts of the compiler will help you see why:


    +   1. One minor error generates many compiler errors.

    2. Fixing one error seems to generate other errors.

    3. Compilers will not find all of your logic errors.


    The compiler consists of many parts. Each part has a function. And if the errors
    cause the portion of the compiler to lose track of where it is, it will quit reporting
    on errors or start generating bogus errors.'
  merge: -1
  img_proc: true
