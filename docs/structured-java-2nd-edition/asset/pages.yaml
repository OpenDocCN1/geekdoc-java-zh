    double

    boolean.

    String (not exactly a Primitive data type),

    ```


    Reference data types are the bulk of the data types. In Java they are all classes.
    Reference data types all pass by reference (hence the name) into methods. So if
    you change the value in the method, you change the value in the calling variable.


    You can define your own reference data types. You can also use the built in System
    libraries. The system library classes include variables and methods.'
