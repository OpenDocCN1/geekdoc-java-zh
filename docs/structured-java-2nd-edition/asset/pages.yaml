- pgno: 47
  md: 'Signed Integers only differ in the number of bits they use, which controls
    the range that they allow. If x represents the number of bits they use, then the
    formula for the range is: $-2^{x-1}$ to $2^{x-1}-1$. The integer types are:


    | Bits | Name | Range |

    | 8 | byte | $-2^7$ to $2^7-1$ |

    | 16 | short | $-2^{15}$ to $2^{15}-1$ |

    | 32 | int | $-2^{31}$ to $2^{31}-1$ |

    | 64 | long | $-2^{63}$ to $2^{63}-1 |


    So in Review, I would use most of the time. Most computers are at least 32 bit
    and int gives you a large range of data. The Java Math libraries expect type int,
    and most of the time, your space requirements will not be tight enough to require
    you to use the smaller types.


    I do want to caution you about integer division. Integer division only occurs
    when all elements in a division equation are integers. This is true of most programming
    languages. In this case the remainder or fractional portion is lost. It is not
    rounded, it is lost. So 99/100 = 0. There are programmatic uses for this, but
    only a few.


    # Floating Point Numbers.


    There are no real numbers in the computer. These are 32 and 64-bit IEEE 754 standard
    floating point point notation. You can think of them as scientific notation, but
    in binary. These numbers are not precise and you cannot directly control the number
    of decimals in our calculations.


    How are they represented?


    The numbers are separated into a sign bit(s), a Mantissa (m) and an exponent (e).
    For informational purposes, the formula for float is:


    ```

    (-1)^s m x 2^{e-127}

    ```'
