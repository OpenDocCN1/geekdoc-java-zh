    # Variable Security


    You may see the words private or public proceed a variable name this is is to
    define who can access that variable. Usually in class definitions variables are
    private and methods are public for information hiding. We will not worry about
    security in this class.


    # Static Variables


    The keyword static makes a single copy of that variable for all objects created
    when you instantiate that class. This variable is a global variable for all objects
    of that class. If in the main, this makes it global for the entire program. This
    means that it can be changed anywhere at any time. This is bad news.


    Except when you add the keyword final. Then this becomes a constant, as in:


    ```

    final static int ERROR = 0;

    ```'
