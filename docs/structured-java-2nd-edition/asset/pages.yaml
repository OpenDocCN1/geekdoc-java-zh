- pgno: 128
  md: '# Review


    Strings are a special datatype. They are a reference data type that acts like
    a primitive type. They are passed by value. They can be used in arrays. Unlike
    every other data type that I know of, they share a data space that holds every
    unique string. When a new String is added the String variable is pointed to that
    unique string. When an existing String is changed, a new string is added to that
    data space. If two String variables are identical, then they point to that same
    memory location (most of the time – no guarantee). However, a String Literal may
    not.


    Strings have a lot of built in functionality (methods) that will handle most of
    the manipulation that you will need to do them.


    It is recommended that you use equals() and compareTo() for comparisons. Because
    of case sensitivity and the lack of care that most people have when entering data
    it is actually recommended that you usually use equalsIgnoreCase() and compareToIgnoreCase()
    unless case is necessary.


    The split(), IndexOf(), and substring() methods are extremely useful for breaking
    up strings on known symbols. This is a very common exercise when manipulating
    data.


    When nothing else will work it is always possible to break up the String into
    a char array and manipulate it that way. This is not recommended, but mentioned
    as a last resort.'
  merge: -1
  img_proc: true
