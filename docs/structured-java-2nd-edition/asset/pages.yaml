- pgno: 102
  md: '# Chapter 7. Looping


    Looping is the last type of computing logic that we will look at. It uses decision
    logic and sequential logic, but adds the ability of code to repeat itself. Without
    this ability code, would be much longer, harder to understand, and take much longer
    to write and debug. Loops have three things in common and one major risk. The
    three commonalities are:


    +   1. Start condition. Whatever condition they check must be initialized.

    2. End condition. What breaks the loop.

    3. Looping step.


    The major risk in any loop is an infinite loop or a loop that never ends. You
    must ensure, when designing, coding, and testing a loop, that has a valid end
    condition.


    There are 4 basic Loop formations:


    +   1. do while aka repeat until in-other languages.

    2. while loop

    3. for aka do (not the same as a do while) aka counting loop.

    4. recursion


    While almost any loop can be simulated with any other loop they each serve a specific
    purpose or benefit.


    # Do While Loop.


    do while loops have two basic characteristics.


    +   1. The condition is always tested last.

    2. The code is always executed at least once.'
  merge: -1
  img_proc: true
