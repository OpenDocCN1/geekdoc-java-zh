- pgno: 24
  md: "# Lexical Analyzer (some discussions call this the Tokenizer; others combine\
    \ this with the Syntactic Analyzer to call it the Parser).\n\nBasically the Lexical\
    \ Analyzer reads the code:\n\n+   1. Removes comments\n2. Takes every Variable,\
    \ Constant, and Method name, etc and converts it into a token.\n3. Converts numbers\
    \ to internal form.\n4. Identifies keywords.\n\nProbable errors are anything that\
    \ can cause it to lose track of what it is doing. For instance:\n\n+   1. Paired\
    \ symbols \"\", {}, ()\n   a. If you are missing the beginning symbol, then the\
    \ lexical analyzer will try to scan all of the code as though it wasn't affected\
    \ by the missing symbol, e.g., a missing double quote would be treated as though\
    \ it wasn't a string with the expected hilarious results. Note: It usually knows\
    \ when to expect a brace or parentheses, so it may actually give you a useless\
    \ error. With code blocks (braces) it will give you unintelligent error messages.\n\
    \   b. If you are missing the ending symbol, the lexical analyzer will keep searching\
    \ until it finds any matching end symbol, e.g., anything after the beginning double\
    \ quote will be treated as a string after the second double quote, will not be,\
    \ so then see (a). With Code blocks, it may tell you that it runs out of code\
    \ to parse. With parentheses it may give you an understandable error message.\n\
    2. A messed up comment (// /*)\n   a. Who knows what it will find in a missing\
    \ comment symbol.\n   b. In the case of a non-line comment how does it know when\
    \ the comment ends?\n3. Some bad syntax on expressions or assignment statements.\n\
    4. Missing semicolons."
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Syntactic Analyzer. The next step would be to make sure to check your statements
    against the rules of the language, e.g., the Grammar. This step would make sure
    that: if statements, for loops, etc., make sense. I''m not sure, what exact errors
    would be generated, but I believe that these would be errors like:


    +   1. Having an equivalence (==) instead of equals (=) in an assignment statement.

    2. Missing semicolons.

    3. Missing where clauses in loops.

    4. Miss-matching if /else groups.

    5. Incorrect formats for Class or method headers.


    Semantic Analyzer. The Lexical and Syntactic Analyzers only verify that the program
    consists of tokens arranged in a syntactically valid combination. Now we''ll move
    forward to semantic analysis, where we delve deeper to check whether they form
    a sensible set of instructions in the programming language. Note: This does not
    check into whether a reference may be defined elsewhere. Types of errors:


    +   1. You do not define a variable correctly, e.g., you changed case on a variable
    name, or you forgot to define a variable.

    2. You misused a variable type. You should have used String, when you used int.

    3. You have code that can never be reached.


    Intermediate code generator. This generates as much code as it can without external
    code libraries. It leaves place holders for external code. There are probably
    aren’t too many errors in this step, since theoretically most of the internal
    code errors have already been found.


    Optimizer really depends on the system and language. Some can be quite sophisticated.
    Some can be very basic. They may go so far to modify loops to make them more efficient
    or they may do nothing.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Linker. The linkage process goes out to the external libraries and fills in
    the place holders. There are several kinds of libraries:


    +   1. Language Libraries

    2. Company Libraries

    3. Personal libraries

    4. Operating System Libraries


    Errors: Basically the only error is when it cannot find something. In java the
    error is:


    +   Can''t find Symbol - You are probably not importing the library or calling
    a method incorrectly.


    Writer then writes out the final Executable File.


    Java only differs from a standard compiler in a couple of ways. Since it does
    not generate an executable, and since it is machine independent, the biggest differences
    are in the Optimizer, the Linker, and the Writer.


    > The Optimizer does essentially nothing. All optimizations are in the system
    specific libraries.


    > The linker links everything except the Operating System Libraries. These are
    left for the Java Virtual Machine.


    > The Writer writes the Java Binary code or the .class files.


    The Java Virtual machine (JVM) or java is much more efficient than a normal interpreter
    since the code is not source code. The code is already parsed, organized, and
    set up for the interpreter. All structures are set up so that it is not just read
    in line by line and turned into machine code. I do not pretend to understand the
    inner processing, but it is quite efficient.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Review


    From the compiler standpoint, there are only a few types of languages:


    +   - Machine

    - Assembler

    - Compiled

    - Interpreted

    - Hybrid


    The parts of a compiler can be described as:


    +   1. Lexical Analyzer

    2. Syntactic Analyzer

    3. Semantic Analyzer

    4. Intermediate Code Generator

    5. Optimizer

    6. Linker

    7. Writer


    Most of your coding errors are going to crop up in the Lexical, Syntactic, and
    Semantic Analyzers. The Linker will show errors when it cannot find a reference.
    With Java, this will most likely occur because you do not have your personal libraries
    in your CLASPATH or you have misspelled a method or class or you have forgotten
    to import a package.


    Remember, the compiler can only detect errors in the language. It cannot detect
    errors in your thinking. These are also referred to as logic errors.'
  merge: -1
  img_proc: true
