- pgno: 79
  md: 'The order of Operations is parentheses, NOT, and then left to right.


    # Equality Expressions


    Equality expressions use the relative values of alphabetic, numeric values, or
    reference values to get a boolean value from them.


    Note: primitive values are more straight forward than reference values. If you
    try using the operators on reference values (including Strings), you will be comparing
    the memory location and not the value, so don''t do it. I will show you the right
    way to do it.


    # Non-boolean primitive Values


    The operators are:


    +   - == Equal to

    - != Not equal to

    - Greater than

    - >= Greater than or equal to

    - < Less than

    - <= Less than or equal to


    Assuming that A and B are of the same type (no guarantees if they aren''t), the
    Basic format is:


    ```

    (A == B)

    (A != B)

    (A <= B)

    (A > B)

    (A <= B)

    ```


    These are just expressions and not complete statements. Be careful and do not
    confuse equality (==) with assignment (=). Hopefully, the compiler will catch
    the issue, but I will not guarantee it.'
