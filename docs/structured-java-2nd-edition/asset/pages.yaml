  md: 'Alpha + Beta * 3.5 / Width

    3 + 4

    PI * R * R


    # Logic Expressions


    Logic expressions are formed by a pair of parentheses "()" which return a true
    or false. They never stand alone. They may be on one side of an assignment statement
    or they may be in an if statement (see chapter 6). Inside the parentheses is a
    boolean expression or equality expressions or any combination of the two.


    You can put a logic expression in any place that you would place a boolean value.


    There are three ways to express a logic expression (these can be combined).


    # Boolean Expressions


    Boolean expressions consist of one or more boolean values, true, or false, or
    variables (type boolean) connected by the boolean operators. Unlike arithmetical
    expressions, boolean expressions must be surrounded by parentheses (). The main
    operators are:


    +   &&& for AND

    "||" for OR

    ! for NOT


    (A && B) is true if A is true and B is true, otherwise it is false.


    (A || B) is true if either A is true or B is true.


    !(A) is true if A is false and false if A is true.'
