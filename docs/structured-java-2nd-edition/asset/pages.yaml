  md: '# Chapter 8. String Manipulation


    We mentioned Strings earlier, but we really did not talk about how to manipulate
    them. Why? Well, we needed to know a few things first.


    As we discussed in the chapter on data types, Strings are an array of char. They
    contain text. They are case sensitive. This section is on manipulating them, but
    before we try to manipulate them, we might want to decide what we want to do to
    them. For example, consider:


    # String Problems


    +   - Concatenation – putting two strings together.

    - Separate strings at a certain character, maybe a comma.

    - Find a given character within a string.

    - Compare two strings – ignoring case differences.

    - Compare two strings – but not ignoring case differences.

    - Get a substring from a string.


    Actually, there are as many different string manipulation tasks as there are programming
    problems, but many of them boil down to combinations of the ones above.


    Not only are they array of type char, Strings are also a Java Class. They actually
    contain a set of built in methods, that allow you to to do things to them without
    writing code to actually accomplish those tasks. You can find these by typing:


    ```

    javap java.lang.String

    ```


    # String Methods


    Some of these are:'
