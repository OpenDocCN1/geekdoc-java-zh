- pgno: 153
  md: '# Review


    We have gone from one dimension arrays to multidimensional arrays. We saw that
    it wasn’t much of a stretch. They are still limited to the following characteristics:


    +   1. Using data type per array.

    2. Using either primitive data types or strings

    3. Unable to add or remove data from the middle.

    4. Must set the maximum size of the array at compile time.

    5. Must keep track of the actual size of the array manually.


    While your outermost row can be ragged, you should remember that the size of your
    array grows multiplicatively. When you define a 10 x 10 x 10 array, you end up
    with 1,000 elements. If it is of type double, 64 bits or 8 bytes each, that is
    about 8K for the Array. If you multiply each dimension by 10, 100 x 100 x 100,
    you end up with 8G. So you see that these can grow very fast.


    Rarely are you dealing with one data type, you may encounter, configuration data,
    statistics, bills of sale, etc. We discussed four ways of handling this issue.


    +   1. Convert all data to String.

    2. Use multiple synchronized arrays.

    3. Use multiple arrays with integer pointers.

    4. Use multiple arrays with actual pointers.

    5. Use stamp data aka java classes.


    I personally feel that stamp data or the java class gives you the cleanest method
    for handling the data most of the time. Note: No one solution is the right answer
    all of the time.'
