    # Separate strings at a certain character


    For example, separate at a comma, backslash, period or any other symbol.


    The method here depends on whether you want to find all of the substrings in a
    string that are separated by that symbol. Say you have a comma separated value
    (.csv) file. This is a common file type where fields are separated by a comma.
    The simplest way to do this is to use the split function to break your String
    into a String array.


    ```

    String SYMBOL = ",";

    String SplitArray[] = InputString.split(SYMBOL);

    Splitarray = =[0];

    ```


    Now SplitArray[0] has the first field up to the comma, SplitArray[1] has the second
    and so on.


