    \n# 第 3 章 数据类型\n\n## 位与字节\n\n计算机处理器和内存以二进制工作，即零和一。这些被称为位（bits）。这些位通常以八位或一个字节（byte）为一组进行。大多数计算机以一定数量的字节运行。最旧的微型计算机使用1\
