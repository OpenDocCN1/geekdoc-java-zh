    ArrayList has three major benefits over arrays:


    +   1. You do not define a maximum size at compile time. ArrayList

    grows as you expand it.

    2. You can add to or delete from the middle of ArrayList without

    penalty.

    3. ArrayList has a built-in method called size() to tell you the

    current used size of the ArrayList.


    The biggest difference in ArrayList is that instead of directly using

    braces to address the individual members, e.g., [i], you have to use

    methods, such as:


    ```

    add(e) adds an element to the next position in the ArrayList.

    get(int) gets the element from the position on the Arraylist as

    spec on the index.

    set(int,e) sets the element from the position on the Arraylist

    as specified on the index.

    ```


    One hint. When you add a reference type to an ArrayList. Make sure

    that you create a new element. Otherwise you may end up with an

    ArrayList with n copies of the same data.


