    If they belong to a different class then we use the dot notation like:\n\n```\n\
    System.out.println(AnyString);\n```\n\nSo before we write any additional code,\
    \ our first program looks like:\n\n```java\npublic class DisplayName{\npublic\
    \ static void main(String[] args ) {\n```\n\n```\n} //end main\n//end DisplayName\n\
    ```\n\nThis will compile, but will do nothing.\n\nSo let us add some simple code\
