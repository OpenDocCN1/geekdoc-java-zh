    import CSCI.*;\n```\n\nWith the other imports. And this will have to be in your\
    \ CLASSPATH. Right now there are methods for getting a formatted current time,\
    \ reading and writing a Unicode string from/to a data file, checking for an integer\
    \ or a double, changing a String to an integer or a double and other activities\
    \ as needed.\n\n# Variable Security\n\nYou may see the words private or public\
    \ precede a variable name; this is to define who can access that variable. Usually\
    \ in class definitions variables are private and methods are public for information\
    \ hiding. We will not worry about security in this class.\n\n# Static Variables\n\
    \nThe keyword static makes a single copy of that variable for all objects created\
    \ when you instantiate that class. This variable is a global variable for all\
    \ objects of that class. If in the main, this makes it global for the entire program.\
    \ This means that it can be changed anywhere at any time. This is bad news.\n\n\
    Except when you add the keyword final. Then this becomes a constant, as in:\n\n\
    ```java\nfinal static int ERROR = 0;\n```\n\nSince this cannot be changed at runtime,\
    \ this is useful and does not suffer from the risks of causing untraceable errors.\n\
    \n# Review\n\nThere are two basic types in Java, primitive and reference. Primitive\
    \ types point to the memory location that holds the data. Primitive types are\
    \ all predefined data types that are divided into Integer, Floating Point, Char,\
    \ and Boolean. Integer and floating point are further divided into several types\
    \ based on the number of bytes that hold the data. I recommend that you normally\
    \ use:\n\n```java\nint\ndouble\nboolean.\nString (not exactly a Primitive data\
    \ type),\n```\n\nReference data types are the bulk of the data types. In Java\
    \ they are all classes. Reference data types all pass by reference (hence the\
    \ name) into methods. So if you change the value in the method, you change the\
    \ value in the calling variable.\n\nYou can define your own reference data types.\
    \ You can also use the built-in System libraries. The system library classes include\
    \ variables and methods.\n\n# Questions\n\n- 1. We will be using the following\
    \ recommended java datatypes in this course\n  a. Alphanumeric, real, and Boolean\n\
    \  b. String, int, double, and boolean\n  c. Char, byte, float, and Long\n  d.\
    \ Numeric, String, and Boolean\n  e. None of the above\n\n- 2. The two normal\
    \ ways that computers use to encode characters and\n\n- 3. Java primitive types\
    \ are reference Types.\n\n- 4. Most of java types are reference Types. This means\
    \ that when you pass them into a method and change them without meaning to you\
    \ you can cause a\n\n- 5. String variables are the only reference type that is\
    \ passed by\n\n- 6. Which of the following is not a valid integer type definition:\n\
    \  a. int Apple;\n  b. int Apple = 1;\n  c. int Apple, Orange;\n  d. int Apple\
    \ = 'a';\n  e. int Apple = INTCONSTANT; // INCONSTANT is an int constant.\n\n\
    - 7. Which answer is incorrect about boolean data types?\n  a. They help clarify\
    \ code;\n  b. The small size of the data type is efficient.\n  c. They are a simple\
    \ way to set an intermediate boolean expression value.\n  d. They complete the\
    \ data type set.\n\n- 8. Stamp data is useful to:\n  a. Group related data together\n\
    \  b. Group random stuff together for convenience.\n  c. Not useful at all.\n\n\
    - 9. Computer Real Numbers are:\n  a. Imprecise floating point representations\
    \ of real numbers.\n  b. Precise representations.\n  c. Valid decimal representations.\n\
    \n- 10. Integer Division type is defined by:\n  a. Using the Integer Division\
    \ symbol.\n  b. Only using Integer variables or values in the division equation.\n\
    \n# Problems\n\nCompile, debug, and run these problems\n\n- 1. Build a DisplayNumber\
    \ program to display either an integer or floating point number.\n2. Modify your\
    \ DisplayNumber program to display PI from the java Math library.\n\n# Chapter\
    \ 4 Methods\n\nNote: Methods cannot be defined inside other methods. They must\
    \ be defined within the class definition, but outside other method definitions.\n\
    \n# Designing Methods\n\nMethods have been around for a long time and ways to\
    \ build good methods have been discussed many times as well. Methods have had\
    \ almost as many names as there are programming languages. You will also hear\
    \ those called functions, modules, or procedures.\n\nMethods serve several purposes\
    \ in structured programming:\n\n- 1. They allow you to break up code into smaller\
    \ coherent chunks.\n2. They allow you to reuse code.\n3. They allow you to share\
    \ code easily.\n4. They allow you to test code separately.\n5. They make code\
    \ easier to read and understand.\n\nThe main design goal of a method is to build\
    \ a black box. A black box is an idea that has an almost identical relationship\
    \ in physical design. It is an object where the inputs and output are known, but\
    \ the internal workings are a mystery. The object can be swapped in and out as\
    \ needed without adversely affecting the workings of the rest of the system.\n\
    \nIn order to meet this goal, we introduce the terms, cohesion and coupling.\n\
    \n**Cohesion** is the concept that a method has one purpose and its independence\
    \ from other methods. A method with one purpose is thought to be one with high\
    \ cohesion, one with more than one purpose is thought to be of low cohesion. How\
    \ can we tell if we have a highly method? A simple rule of thumb is to define\
    \ the purpose of a method with one sentence.\n\n**Coupling** is the concept of\
    \ how two modules communicate with each other. Coupling ranges from loosely coupled\
    \ to tightly coupled. The goal here is to be loosely coupled (again think of the\
    \ black box). A loosely coupled pair of modules do not have to know anything about\
    \ each other to work together. To test this module all you have to do is build\
    \ a driver that fakes inputs and prints out the outputs. The different levels\
    \ of coupling are:\n\n- Loose Coupling\n  - Calling parameters (Primitive and\
    \ Reference data types)\n  - Function Returns (Primitive and Reference data types)\n\
    \  - Messaging (Message Coupling)\n  - Files (External Coupling)\n- Tight Coupling\n\
    \  - Global variables (static)\n  - Content Coupling (Accessing the local data\
    \ of another)\n\nI would never use global variables or access the local data of\
    \ another method. Global constants are fine, since they cannot change. As I mention\
    \ below I would restrict messaging and files to specialized methods.\n\nMethods\
    \ can usually be grouped into one of several types:\n\n**Control methods** – These\
    \ methods select from one or more options of program flow. Your main method is\
    \ usually a control method. Unless it is your main, the option should be passed\
    \ as a parameter or be based on the input (type of record in a file) and clearly\
    \ defined.\n\n**Input/Output Methods** – It is recommended that you build one\
    \ method for each file/report/message queue you are reading/writing from to isolate\
    \ any changes in format to that method.\n\n**Processing methods** – These are\
    \ known as business logic methods; and will be your major methods.\n\nDuring development\
    \ you will probably produce two specialty methods.\n\n**Driver methods** – These\
    \ are small, usually main, methods built to test methods that cannot be tested\
    \ otherwise. They usually consist of little more than the minimum number of type\
    \ definitions, print statements, and method calls needed to test your code.\n\n\
    **Stubs** – these are the first version I write of a new sub method. A stub consists\
    \ of little more than the method header, a set of print statements to validate\
    \ the input arguments, and a valid return statement. I then fill these in as I\
    \ write and validate the rest of my methods.\n\nMethods should usually:\n\n- 1.\
    \ Have one entrance and one exit.\n2. Be short and clear.\n3. Have a single purpose.\n"
  mdcn: "\n\n# 课程定义数据类型\n\n(CSCI 文件夹必须位于你的 CLASSPATH 中)\n\n在教授这些课程时，我在一个名为 CSCI 的包中构建了一系列静态和非静态工具类，这些工具保存在\
    \ U 盘中。请参考附录 A 关于 U 盘的使用说明。你需要将：\n\n```java\nimport CSCI.*;\n```\n\n与其他导入语句一起使用。这必须位于你的\
    \ CLASSPATH 中。目前，这些方法用于获取格式化的当前时间、从数据文件读取/写入 Unicode 字符串、检查整数或双精度浮点数、将字符串转换为整数或双以及其他所需的活动。\n\
    \n# 变量安全\n\n你可能会看到变量名前前面有 private（私有）或 public（公共）；这是为了定义谁可以访问该变量。通常在类定义中，变量是私有的而方法是公有的，以实现信息隐藏。在本课程中我们不需要考虑安全问题。\n\
    \n# 静态变量\n\n`static` 关键字会在实例化该类时为所有对象创建该变量的一个副本。该变量是该类所有对象的全局变量。如果在 main 方法中，它将成为整个程序的全局变量。这意味着它可以随时随地被更改。这是一个坏消息。\n\
    \n除非你添加了 `final` 关键字。这时它就会变成一个常量，例如：\n\n```java\nfinal static int ERROR = 0;\n\
    ```\n\n由于这在运行时无法更改，因此它是很有用的，并且不会受到导致无法追踪的错误的风险。\n\n# 复习\n\nJava 中有两种基本类型：原始类型（primitive）和引用类型（reference）。原始类型指向存储数据的内存位置。原始类型都是预定义的数据类型，分为整数（Integer）、浮点数（Floating\
    \ Point）、字符（Char）和布尔（Boolean）。整数和浮点数根据存储数据的字节数进一步分为若干类型。我建议你通常使用：\n\n```java\n\
    int\ndouble\nboolean\nString (不完全是原始数据类型),\n```\n\n引用数据类型占数据类型的大体。在 Java 中，它们都是类。引用数据类型通过通过引用（因此得名）传递方法。因此，如果你在方法中更改了值，你就更改了调用变量中的值。\n\
    \n你可以定义自己的引用数据类型。也可以使用内置的 System 库。系统库类包括变量和方法。\n\n# 问题\n\n- 1. 我们在课程中使用以下推荐的\
    \ java 数据类型\n  a. 字母数字、实数和布尔\n  b. String, int, double 和 boolean\n  c. Char, byte,\
    \ float 和 Long\n  d. 数值、String 和布尔\n  e. 以上都不是\n\n- 2. 计算机用于编码字符的两种正常方式是和\n\n\
    - 3. Java 原始类型是引用类型。\n\n- 4. 大多数 java 类型都是引用类型。这意味着当你将它们传递到方法并在无意中更改它们时，可能会导致一个\n\
    \n- 5. String 变量是唯一通过引用传递的引用类型\n\n- 6. 下列哪不是有效的整数类型定义：\n  a. int Apple;\n  b.\
    \ int Apple = 1;\n  c. int Apple, Orange;\n  d. int Apple = 'a';\n  e. int Apple\
    \ = INTCONSTANT; // INCONSTANT 是一个整常量。\n\n- 7. 关于布尔数据类型，哪个答案是错误的？\n  a. 它们有助于理清代码；\n\
    \  b. 数据类型较小，效率高。\n  c. 它们是设置中间布尔表达式值的简单方法。\n  d. 它们完善了数据类型集。\n\n- 8. 标记数据用于：\n\
    \  a. 将相关数据分组在一起\n  b. 为了方便将随机事物分在一起。\n  c. 完全没用。\n\n- 9. 计算机实数是：\n  a. 实数的不精确浮点表示。\n\
    \  b. 精确的表示。\n  c. 有效的十进制表示。\n\n- 10. 整数除法类型由：\n  a. 使用整数除法符号。\n  b. 在除法方程中仅使用整数变量或值。\n\
    \n# 练习\n\n编译、调试并运行这些题目\n\n- 1. 构建一个 DisplayNumber 程序来显示整数或浮点数。\n2. 修改你的 DisplayNumber\
    \ 程序以显示来自 java Math 库的 PI。\n\n# 第 4 章 方法\n\n注意：方法不能定义在其他方法内部。它们必须定义在类内部，但在其他方法定义之外。\n\
    \n# 设计方法\n\n方法已经存在很长时间，构建良好方法的方法也被讨论过多次。方法的名称几乎和编程语言一样多。你还会听到人们称之为函数（functions）、模块（modules）或过程（procedures）。\n\
    \n方法在结构化编程中起到几个作用：\n\n- 1. 它们允许你将代码分解成更小的连贯代码块。\n2. 它们允许你重用代码。\n3. 它们允许你轻松共享代码。\n\
    4. 它们允许你单独测试代码。\n5. 它们让代码更容易阅读和理解。\n\n方法的主要设计目标是构建一个黑盒。黑盒是一个物理设计中具有几乎相同关系的概念。它是一个对象，输入和输出是知的，但内部运作是一个谜。可以根据需要交换该对象，而不会不利影响系统其他部分的运行。\n\
    \n为了实现这一目标，我们引入了内聚（cohesion）和耦合（coupling）这两个术语。\n\n**内聚**是指方法只有一个目的且与其他方法相互独立的概念。具有一个目的的方法被认为具有高内聚，具有多个目的的方法被认为内聚低。我们如何判断一个方法是高内聚的？一个简单的规则是用一句话定义方法的用途。\n\
    \n**耦合**是两个模块之间如何通信的概念。耦合从松耦合到紧耦合不等。这里的目标是松耦合（再次考虑黑盒）。一对松耦合的模块在工作时不需要了解对方的任何信息。要测试这个模块，你只需要构建一个驱动程序来伪造输入并打印输出。不同级别的耦合是：\n\
    \n- 松耦合\n  - 调用参数（原始和引用数据类型）\n  - 函数返回值（原始和引用数据类型）\n  - 消息（消息耦合）\n  - 文件（外部耦合）\n\
    - 紧耦合\n  - 全局变量（静态）\n  - 内容耦合（访问另一个方法的局部数据）\n\n我绝不会使用全局变量或访问另一个方法的局部数据。全局常量是可以的，因为它们不会更改。正如下面提到的，我会将消息和文件限制在专门的方法中。\n\
    \n方法通常分为几类：\n\n**控制方法**——这些方法从一个或多个选项中选择。你的 main 方法通常是一个控制方法。除非是 main，否则选项应该作为参数传递或基于输入（文件类型）并清晰定义。\n\
    \n**输入/输出方法**——建议你为每个要读取/写入的文件/报告/消息队列构建一个方法，以便将格式的变化隔离在该方法中。\n\n**处理方法**——这些被称为业务逻辑方法；它们将是你的主要方法。\n\
    \n在开发期间，你可能会产生两种特殊方法。\n\n**驱动方法**——这些是小的、通常是 main 方法，用于测试无法进行测试的方法。它们通常仅由测试代码所需的最少类型定义、打印语句和方法调用组成。\n\
    \n**存根（Stubs）**——这些是我为新子方法编写的第一个版本。存根通常仅由方法头、一组验证输入参数的打印语句和一个有效的返回语句组成。当我编写和验证我的其他方法时，我会填充这些内容。\n\
    \n方法通常应该：\n\n- 1. 只有一个入口和一个出口。\n2. 短小且清晰。\n3. 具有单一目的。\n\n"
