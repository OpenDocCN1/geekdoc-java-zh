  - '[PAGE 40]


    # Review


    There are four basic components in Java


    Packages - combine class files into groups for security, functionality, and distribution.

    Classes and Objects – top level holders of other components.

    Variables aka attributes. These hold values

    Methods – these hold code that do things.


    Java has a consistent set of rules for naming components. They basically boil
    down to:


    +   Start all names with a letter, dollar sign ($), or underscore (_). I would
    always use a letter.

    All subsequent characters can be any combination of letters, numbers, dollar sign,
    or underscore.

    All words are case sensitive. OneWord is not the same as onward.

    You may not use reserved words as your name, such as class, int, extends, etc.

    You should follow your organizations rules.

    Make names meaningful. recognized by the compiler. Some are paired symbols


    +   “{}” – used for code blocks

    “[]” – Used for arrays

    “<>” – used for type casting in collections.

    “()” – used for expressions, and method parameter lists


    Some are specialized symbols such as mathematical symbols, * - /, and logical,
    && ||.


    The comment Symbols "//" "/* */" are special.


    Remember that the backslash "\" in a char or string is an escape character and
    has to be handled specially.'
  - '[PAGE 41]


    Variables have four characteristics


    +   1. They have a name.

    2. They have a Data Type.

    3. They have a memory Location.

    4. They can be changed in your program at runtime.


    Constants (keyword final) have every characteristic that variables do except for
    #4, they cannot be changed.


    We also gave some rules for writing good clean readable code. These included:


    +   1. Comments

    2. Spaces and indentation

    3. Using good conventions and standards

    4. Avoiding tricks.

    5. Being Consistent.'
