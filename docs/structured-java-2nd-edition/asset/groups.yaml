  md: "\nWe learned that\n\n- 1. Analysis was all about gathering and understanding\
    \ requirements.\n- 2. Design was building a design to satisfy requirements.\n\
    - 3. Code is building code to the design and building the inputs for the test\
    \ phase.\n- 4. Test is both ensuring your code is error free and that it meets\
