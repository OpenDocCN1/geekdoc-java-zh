    ```\n\nClasses consist of:\n\n- 1. Header\n- 2. Constructor\n    - a. Method to\
    \ initialize Object\n    - b. Same name as Class\n    - c. May or may not have\
    \ attributes\n- 3. Variables\n- 4. Methods\n\n## Example\n\n```\npublic class\
    \ DisplayName{\n}//end DisplayName\n```\n\nThis program must be stored in a file\
    \ by the name DisplayName.java we will get into more details as we go.\n\nOther\
    \ Classes can be of two types, either static or non-static.\n\nA non-static class\
