    Syntactic Analyzer. The next step would be to make sure to check your statements
    against the rules of the language, e.g., the Grammar. This step would make sure
    that: if statements, for loops, etc., make sense. I''m not sure, what exact errors
    would be generated, but I believe that these would be errors like:


    +   1. Having an equivalence (==) instead of equals (=) in an assignment statement.

    2. Missing semicolons.

    3. Missing where clauses in loops.

    4. Miss-matching if /else groups.

    5. Incorrect formats for Class or method headers.


    Semantic Analyzer. The Lexical and Syntactic Analyzers only verify that the program
    consists of tokens arranged in a syntactically valid combination. Now we''ll move
    forward to semantic analysis, where we delve deeper to check whether they form
    a sensible set of instructions in the programming language. Note: This does not
    check into whether a reference may be defined elsewhere. Types of errors:


    +   1. You do not define a variable correctly, e.g., you changed case on a variable
    name, or you forgot to define a variable.

    2. You misused a variable type. You should have used String, when you used int.

    3. You have code that can never be reached.


    Intermediate code generator. This generates as much code as it can without external
    code libraries. It leaves place holders for external code. There are probably
    aren’t too many errors in this step, since theoretically most of the internal
    code errors have already been found.


    Optimizer really depends on the system and language. Some can be quite sophisticated.
    Some can be very basic. They may go so far to modify loops to make them more efficient
    or they may do nothing.'
  - '[PAGE 26]


    Linker. The linkage process goes out to the external libraries and fills in the
    place holders. There are several kinds of libraries:


    +   1. Language Libraries

    2. Company Libraries

    3. Personal libraries

    4. Operating System Libraries


    Errors: Basically the only error is when it cannot find something. In java the
    error is:


    +   Can''t find Symbol - You are probably not importing the library or calling
    a method incorrectly.


    Writer then writes out the final Executable File.


    Java only differs from a standard compiler in a couple of ways. Since it does
    not generate an executable, and since it is machine independent, the biggest differences
    are in the Optimizer, the Linker, and the Writer.


    > The Optimizer does essentially nothing. All optimizations are in the system
    specific libraries.


    > The linker links everything except the Operating System Libraries. These are
    left for the Java Virtual Machine.


    > The Writer writes the Java Binary code or the .class files.


