    # Chapter 5 Sequential Logic Structure


    # Basic Logic Structures


    Now that we know about data and methods, we need to learn how to use them.


    There are three basic logic structures in most programming languages they are
    sequential, decision, and loops.


    We are going to go through the basic types of each in the next three chapters.


    # Sequential Logic Structure


    The sequential logic Structure is the simplest logic structure and it is the one
    that is used in every other logic structure. It has three characteristics:


    +   1. Beginning

    2. End

    3. Instructions that directly follow one another


    Remember: Each java statement must end in a semicolon.


    So what kind of instructions fit within this logic?


    Type Declarations:


    ```

    int anInt;

    String Message;

    String AString = "George Washington";

    int anInt = 34;

    ```'
