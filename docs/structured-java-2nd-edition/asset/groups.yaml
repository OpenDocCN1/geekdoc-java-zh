    Compare two strings – ignoring case differences.

    Compare two strings – but not ignoring case differences.


    There are actually several approaches to compare Strings. The normal equivalence
    operator "==" sometimes works, but it actually compares the address of the memory
    location and not the string, so I would not recommend this approach.


    If all you want to do is see if String A and String B are Equivalent, The method
    A.equals(B) works fine.


    ```java

    if (A.equals(B)) doSomething();

    ```


    Which is equivalent to:


    ```java

    if (B.equals(A)) doSomething();

    ```


    equals() returns true if they are equal.

