    Data Structures are a term for a way to store data. We are going to look at several
    different data structures that can be used to solve this problem. We will look
    at three code snippets from each to see some of the differences in complexities.
    These code snippets are loading the data, using the data (calculating BMI and
    printing it) and performing an insertion sort.


