  mdcn: "\n语法分析器（Syntactic Analyzer）。下一步是确保你的语句符合语言的规则，例如语法法。这一步将确保：`if` 语句、`for`\
    \ 循环等是有意义的。我不确定会产生哪些错误，但我认为这些将会是类似以下的错误：\n\n- 1. 在赋值语句get等价运算符 (==) 而不是赋值运算符 (=)。\n\
    - 2. 缺少分号。\n- 3. 循环中缺少 `where` 子句。\n- 4. `if/else` 组不匹配。\n- 5. 类或方法头部的格式错误。\n\n\
    语义分析器（Semantic Analyzer）。词法分析器和语法分析器只验证程序是否由语法上有效的标记（tokens）组成。现在我们将进入语义分析，深入检查它们在编程语言中是否形成了一组合理的指令。注意：这不会检查引用是否可能在其他地方定义。错误类型有：\n\
    \n- 1. 你没有正确定义变量，例如，你更改了变量名的大小写，或者忘记定义变量。\n- 2. 你误用了变量类型。你本应该使用 `String`，却使用了\
    \ `int`。\n- 3. 你的代码中有无法到达的代码。\n\n中间代码生成器（Intermediate code generator）。它在不使用外部代码库的情况下生成尽可能多的代码。它为外部代码留下了占位符。这一步可能错误不多，因为从理论上讲，大多数内部代码错误已经被发现。\n\
    \n优化器（Optimizer）实际上取决于系统和语言。有些优化器非常复杂，有些则非常基础。它们可能会大到去修改循环以使其更高效，也可能什么都不做。\n\n\
    链接器（Linker）。链接过程会到外部库并填充占位符。库有几种类型：\n\n- 1. 语言库\n- 2. 公司库\n- 3. 个人库\n- 4. 操作系统库\n\
    \n错误：基本上唯一的错误就是它找不到某些东西。在 Java 中，错误信息为：\n\n- 找不到符号 (Can't find Symbol) - 你可能没有导入库，或者调用方法的方式不对。\n\
    \n写入器（Writer）随后写出最终的可执行文件。\n\nJava 与标准编译器的区别仅在于几个方面。由于它不生成可执行文件，而且它是与机器无关的，最大的区别在于优化器、链接器和写入器。\n\
    \n> 优化器基本上什么都没做。所有的优化都在系统特定的库中完成。\n\n> 链接器链接除操作系统库以外的所有内容。这些留给了 Java 虚拟机（JVM）。\n\
    \n> 写入器写入 Java 二进制代码或 `.class` 文件。\n\nJava 虚拟机（JVM）或 java 比普通的解释器要高效得多，因为代码不是源代码。代码已经过解析、组织并为解释器做好了准备。所有的结构都已设置，使得它不仅仅是逐行读取并转换为机器码。我不自称理解内部处理过程，但它确实非常高效。\n\
    \n# 复习\n\n从编译器的角度来看，语言只有几种类型：\n\n- 机器级 (Machine)\n- 汇编 (Assembler)\n- 编译型 (Compiled)\n\
    - 解释型 (Interpreted)\n- 混合型 (Hybrid)\n\n编译器的部分可以描述为：\n\n- 1. 词法分析器\n- 2. 语法分析器\n\
    - 3. 语义分析器\n- 4. 中间代码生成器\n- 5. 优化器\n- 6. 链接器\n- 7. 写入器\n\n你大多数的代码错误将出现在词法分析器、语法分析器和语义分析器中。链接器在找不到引用时会显示错误。在\
    \ Java 中，这可能是因为你没有将个人库放入 `CLASPATH`，或者你拼错了方法名或类名，或者你忘记导入包了。\n\n记住，编译器只能检测语言层面的错误。它无法检测你思维中的错误。这些也被称为逻辑错误。\n\
    \n# 问答\n\n1. 编译器将 ________ 代码转换为 ________。\n\n2. 汇编器用于将汇编语言转换为 ________\n\n3.\
    \ 词法分析器将变量名转换为 ________\n\n4. ________ 从库中获取方法并将其添加到你的代码中。\n\n5. Java 是一种 ________\
    \ 语言\n   - a. 机器级\n   - b. 编译型\n   - c. 汇编级\n   - d. 解释型\n   - e. 混合型\n\n6. 大多数操作系统命令语言是\
    \ ________ 语言。\n   - a. 机器级\n   - b. 编译型\n   - c. 汇编级\n   - d. 解释型\n   - e. 混合型\n\
    \n7. 没有人类，计算机理解的是\n   - a. 英语\n   - b. 机器语言\n   - c. 解释型\n   - d. 混合型\n\n8. 大多数代码错误出现在\n\
    \   - a. 词法分析器\n   - b. 语法分析器\n   - c. 语义分析器\n   - d. 以上所有\n\n9. 编译器是 ________。\n\
    \n10. Java 虚拟机 (JVM) 是 ________。\n\n# 第 2 章 Java 组件\n\n# 命名\n\nJava 在其库中提供了许多包含有用语句的包。我们会在需要时介绍它们。\n\
    \n有一个包会被自动添加且不需要导入。这个包是 `java.lang`。例如，`String` 和 `System.out` 是 `java.lang` 中的两个类。\n"
