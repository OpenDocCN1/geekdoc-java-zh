    ```\n\n## Method\n\nThe main method is the initial starting point for a program.\
    \ Every program must have one and exactly one main method.\n\nThe main methods\
    \ format is basically mandated. You don’t need to change it.\n\n```\npublic static\
    \ void main(String[] args ) {\n} //end main\n```\n\nIn fact the only thing that\
    \ you can change is the term args. The variable args[] is a short for arguments\
