    # Chapter 2. Java Naming Conventions and Components


    Java has a number of components. Each component has a name. Unlike some languages
    the Java rules for naming are almost identical for all components.


    # Java Components


    The components include (but are not limited to):


    +   - Packages - combine class files into groups for security, functionality,
    and distribution.


    +   - Classes and Objects – top level holders of other components.


    +   - Variables aka attributes. These hold values.


    +   - Methods – these hold code that do things.'
  - '[PAGE 30]


    # Naming Rules


    The naming rules are:


    +   1. Start all names with a letter, dollar sign ($), or underscore (_). I would
    always use a letter to make code readable.

    2. All subsequent characters can be any combination of Letters, numbers, dollar
    sign, or underscore.

    3. All words are case sensitive. OneWord is not the same as oneword.

    4. You may not use reserved words as your name, such as class, int, extends. See
    Appendix B for a list of Java reserved words.

    5. You should follow your organizations rules.

    6. Make names meaningful.


    I like to use nouns to name Variables, Classes, and Objects and verbs to name
    Methods.


    There are two prevailing Naming conventions in most languages:


    +   1. One called CamelCase, uses mashed words with the subsequent words capitalized.
    Sometimes the first word is capitalized sometimes not. This looks like:

    gearBox

    GearBox

    ChangeGears

    2. The other called snake case, uses lower case letters and underscores to separate
    the letters.


    ```

    gear_box

    change_gears

    ```


    Since snake case is mostly a holdover from c, and CamelCase is mostly used in
    Java, I will use the latter Naming convention.'
  - '[PAGE 31]


    # Symbols


    Your most common symbol is the semicolon "; Every java statement must end with
    a semicolon. This is extremely important and ends up being the most common error.
    Another common error is adding a semicolon before you want one and ending up with
    a null or incomplete statement.


    The basic paired code Symbols used in Java are parentheses (), braces {}, brackets
    [], and greater/less than symbols <>. This is a brief definition of each, we will
    go into more definition later as we use them.


    Parentheses () are used in several ways, besides in their normal math and logical
    methods, they are used to denote logical expressions and methods. For methods
    they are used to hold parameter lists.


    Braces {} are used at the beginning and end of all code blocks. Including, but
    not limited to class templates, methods, if statements, and loops. I recommend
    placing a comment on the end brace tying the brace to the beginning brace. When
    we start debugging code, it is easy to quickly lose track of which brace belongs
    to which and the compiler can quickly lose track when you are missing a brace.


    Brackets [] are used for arrays.


    Greater/Less than Symbols <> are used to allow the compiler to know which types
    to limit certain classes to use. For instance, if the term <Integer> is used for
    a container definition then the compiler will only allow types Integer to fill
    the container. These are only used by the compiler.'
