  md: "\n# Course Defined Data Types\n\n(The folder CSCI will have to be in your CLASSPATH)\n\
    \nWhile teaching these courses, I have built a series of static and non-static\
    \ utilities in a package called CSCI which has been kept on the flashdrive. See\
