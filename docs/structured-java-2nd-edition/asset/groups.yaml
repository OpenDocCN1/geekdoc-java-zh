    \ Java has two basic forms of decision making statements (if else and switch).\n\
    \n# If Else Logic\n\nThe basic form of the if statement is:\n\n```\nif (LogicalExpression)\
    \ {\n    code set a\n} // end if\nelse {\n    code set b\n} // end else\n```"
