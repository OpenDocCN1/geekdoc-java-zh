    \n- 7. User Testing. This is testing the user interfaces with a small set of actual\
    \ users from each business unit.\n\n- 8. Acceptance Testing. This set of tests\
    \ proves to your system meets requirements.\n\nImplementation. The completed code,\
    \ related data, and hardware are sent to and made operational in the field. This\
