    # Embedded If Then Logic


    You can embed additional if statements entirely within either code block. They
    cannot overlap. The else goes with the If statement within that code block.


    # Sequential Logic with if Logic.


    One method of using If logic with unrelated conditions is to use sequential logic.
    These statements must be mutually exclusive. This can be identified in two ways:


    +   1. The else is not present.

    2. The logical expressions are not related.


    For example, let us say that you sell hamburgers with three topping, ketchup,
    mustard and pickles. People can order them with any combination of the three (or
    none). Then your logic may look like:


    ```

    if (Ketchup) AddKetchup();

    if (Mustard) AddMustard();

    if (Pickles) AddPickles();

    ```'
  - "[PAGE 94]\n\n# Case or switch Statements\n\nCase Statements are a way of simplifying\
    \ embedded if else if statements. Unlike sequential if statements, they cannot\
    \ be mutually exclusive. In Java they are only useful for an int, char, or String\
    \ variable. They are actually less useful than they first seem. You have to know\
    \ at compile time, exactly what cases you are going to need. The formats are:\n\
    \n```\nswitch (SwitchVariable) {\n  case value1:\n    step1;\n    step2;\n   \
    \ break;\n  case value2:\n    step1;\n    step2;\n    break;\n  default:\n   \
    \ step1;\n    step2;\n    break;\n} //end switch\n```\n\nWhere\n\n+   - switch\
    \ is the switch keyword.\n- SwitchVariable is a variable of type int, char, or\
    \ String on which the cases depend.\n- case is the case keyword.\n- value1, value2,\
    \ etc. are the individual case values of the same type as the SwitchVariable.\
    \ (These are almost certainly hard or Constants).\n- step1, step2 designate any\
    \ valid java statement.\n- break is the keyword that skips to the end of the switch\
    \ statement, without it the next case is automatically executed whether it is\
    \ valid or not. Do not forget the break statement.\n- default is the keyword for\
    \ any value that is not included in the cases."
