  md: "\nHowever, in order for the Linker to find most of the packages, you need to\
    \ include the import statement before the class statement in your code. For instance,\
    \ if you wanted to use any class from the util package you would need to:\n\n\
    ``` evenimport java.util.*;\n```\n\nNotice that I use the * to enable the compiler\
    \ to include any class from the util package. While you can specify specific classes\
    \ from util, there is no benefit in specifying a specific one. The Linker will\
    \ only include the ones it needs. It is not more efficient to specify the classes\
    \ that you need. Therefore my recommendation is to always use the “*”.\n\nI have\
    \ included a package called CSCI for this set of courses to use. To use these\
    \ classes, you need to:\n\n```\nimport CSCI.*;\n```\n\nIf you get the “Can’t find\
