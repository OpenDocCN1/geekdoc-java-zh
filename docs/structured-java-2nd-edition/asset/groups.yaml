    \ 如果 A 为 false 则为 true，如果 A 为 true 则为 false。\n\n### 等等表达式 (Equality Expressions)\n\
    \n相等表达式使用基本类型、数字或引用值的相对值来获取布尔值。\n\n注意：基本值比引用值更直接。如果你在引用值（包括 String）上使用这些运算符，比较的是内存位置而不是值，所以不要这样做。我会向你展示正确的做法。\n\
