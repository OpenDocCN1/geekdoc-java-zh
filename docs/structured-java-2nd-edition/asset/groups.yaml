    # Concatenation


    Which means, putting two strings together.


    There are actually two methods:


    ```java

    String OutputString = First + " " + Last;

    ```


    And


    ```java

    String OutputString = First.concat(" ");

    OutputString = OutputString.concat(Last);

    ```


    # Example


    ```java

    String First = "Greg";

    String Last = "Almond";

    String wholeName = First + " " + Last;

    ```


    Now wholeName contains "Greg Almond"


    # Separate strings at a certain character


    For example, separate at a comma, backslash, period or any other symbol.


    The method here depends on whether you want to find all of the substrings in a
    string that are separated by that symbol. Say you have a comma separated value
    (.csv) file. This is a common file type where fields are separated by a comma.
    The simplest way to do this is to use the split function to break your String
    into a String array.


    ```java

    String SYMBOL = ",";

    String SplitArray[] = InputString.split(SYMBOL);

    String Splitarray = SplitArray[0];

    ```


    Now SplitArray[0] has the first field up to the comma, SplitArray[1] has the second
    and so on.


    If you had a file with a record structure consisting of name, height, and weight
    that looked like:


    ```

    Kaden Diaz, 65,242

    Indigo Chaney, 65,183

    Harlan Hooper, 71,200

    Kato McKinney, 62,233

    Rinah Norton, 63,164

    Eleanor Padilla, 73,201

    Quamar Ramos, 66,177

    ```


    You might write your record method of splitting code to look like:


    ```java

    String Name;

    String HeightString;

    String WeightString;

    String SplitArray[];

    String Splitarray = InputString.split (SYMBOL);

    Name = SplitArray[0];

    HeightString = SplitArray[1];

    WeightString = SplitArray[2];

    ```


    The more common method of splitting Strings is using a combination of indexOf(some
    language call this position) and substring. The method indexOf finds a character
    or set of characters within a String. Substring, extracts a substring from a String.


    Another common problem is finding the file names or suffixes of a file. You have
    a couple of issues here.


    - 1. Does your current filename have directory path included?

    - 2. Does your filename have more than one period (.) in it?


    Unfortunately, split does not like using the System.getProperty("file.separator")
    in Windows, since it is also the escape symbol. So we are going to take care of
    both issues in a very similar way.


    Note: You want to use System.getProperty("file.separator") instead of hard coding
    "\" or "//", since this makes your code portable to Windows, Unix, or Apple machines.


    Now to get from the complete filename to the full filename or the suffix, you
    need to use a combination of two methods.


    ```java

    int lastIndexOf(String);

    String substring(int);

    ```


    and


    or


    ```java

    String substring(int, int);

    ```


    Let us set SYMBOL to the full System.getProperty("file.separator") for we are
    trying to get the full filename and PERIOD to "." for when we need to get the
    partial filename or Suffix.


    FileName.lastIndexOf(SYMBOL) gives you the integer position of the last file separator.


    FileName.lastIndexOf(PERIOD) gives you the integer position of the last period.


    First we want to break off the Full Filename, if PathFileName holds the complete
    filename including path:


    ```java

    FullFileName = PathFilename.substring(Position+1, length);

    ```


    Then the File name


    ```java

    FileName = FullFilename.substring(0, Position-1);

    ```


    Suffix would be:


    ```java

    Suffix = FullFilename.substring(Position+1);

    ```


    One of these two processes would work anytime you need to break a string into
    component parts or into into a single part.


    # Find a given character within a string.


    As you saw earlier, depending on what you want to do after you find it, indexOf()
    gives you the position, contains() lets you know that it exists.


