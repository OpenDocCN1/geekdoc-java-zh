    Alpha.compareTo(Charlie) returns a number < 0

    Charlie.compareTo(Alpha) returns a Number > 0


    To use these functions, you would build an expression like:


    ```

    (Alpha.equals(Beta)) == 0

    (Alpha.compareTo(Beta)) < 0

    (Alpha.compareTo(Beta)) > 0

    ```


