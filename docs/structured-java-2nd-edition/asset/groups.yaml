  md: "\nOne way to ensure that the compiler will catch your error is to reverse the\
    \ normal way of writing an equality statement when you are using a single variable\
    \ in an equivalence statement.\n\nIf you are trying to check whether the variable\
    \ Counter equals 23, instead of writing it:\n\n```\nCounter == 23\n```\n\nWrite\
    \ it as:\n\n```\n23 == Counter\n```\n\nSince the compiler cannot put the value\
    \ of counter into the literal constant 23, it will throw an error for (23 = Counter)\
    \ at compile time. Thus avoiding countless hours of confusion and headache.\n\n\
    Note: Comparisons will work with char variables and there are times this is very\
    \ useful. However, you are comparing the codes and not the letters and it is case\
    \ sensitive, since ‘A’ does not equal ‘a’. So make sure that your characters are\
    \ the same case or check both cases:\n\n```java\nif ((('M' == inChar) || ('m'\
    \ == inChar)) {\n    system.out.println(\"male\");\n}\n```\n\n## Reference Values\n\
    \nStrings and most reference values have built-in comparison methods that should\
    \ be used instead of the operators. These methods are:\n\n```\n.equals(a);\n.compareTo(a);\n\
    ```\n\nWhere you call the method from your object and a is another object of the\
    \ same type.\n\n.equals returns true if the values they hold are equivalent and\
    \ false otherwise.\ncompareTo returns an int denoting the relative value.\n\n\
    For instance, say you have three Strings:\n\n```java\nString Alpha = \"George\"\
    ;\nString Beta = \"George\";\nString Charlie = \"Sam\";\n```\n\nAlpha.equals(Beta)\
    \ would return true\nBeta.equals(Alpha) would return true\nCharlie.equals(Alpha)\
    \ would return false\nAlpha.equals(Charlie) would return false\n\nAlpha.compareTo(Beta)\
    \ returns 0\nAlpha.compareTo(Charlie) returns a number < 0\nCharlie.compareTo(Alpha)\
    \ returns a Number > 0\n\nTo use these functions, you would build an expression\
    \ like:\n\n```\n(Alpha.equals(Beta)) == 0\n(Alpha.compareTo(Beta)) < 0\n(Alpha.compareTo(Beta))\
    \ > 0\n```\n\n## Combining Expressions\n\nSince logical expressions become boolean\
    \ values, you can combine them using the boolean operators &&, ||, and.\n\nFor\
    \ instance; you could build an assignment:\n\n```java\nboolean Nonsense;\nString\
    \ Alpha;\nString Beta;\nint Height;\nint Width;\nboolean IsItTrue;\nIsItTrue =\
    \ (Alpha.compareTo(Beta) > 0) && (Height > Width) || Nonsense;\n```\n\nOr it may\
    \ be clearer to write the sequence as:\n\n```java\nAlphaBeta = (Alpha.compareTo(Beta)\
    \ > 0);\nHeightvsWidth = (Height > Width);\nCombined = (AlphaBeta && HeightvsWidth);\n\
    IsItTrue = Combined || Nonsense;\n```\n\nWhich would let you check all of the\
    \ intermediate values, if you run into problems.\n\n## Calls to Methods\n\nCall\
    \ a method simply use the method name followed by parentheses with variables in\
    \ the same type and order as the method definition. The variable names in the\
    \ calling sequence can differ from the method declaration. In the case of primitive\
    \ strings, and you can substitute hard-coded values for variable names. Let us\
    \ look at a few examples:\n\n```java\npublic static boolean IsNotInt(String test_string)\n\
    ```\n\nThis method returns a boolean and is called with a String. It checks the\
    \ String to see if it is an integer (a whole number), and returns true, if the\
    \ input string is an integer, or false, if it is not.\n\nSince there is only one\
    \ String variable, you can call this in a couple of ways (assuming that isTrue\
    \ and InputVar have been predefined and that we have set InputVar):\n\n```java\n\
    isTrue = CSCIConvert.IsNotInt(InputVar);\nisTrue = CSCIConvert.IsNotInt(\"5\"\
    );\n```\n\nLet us build a more complex method. One to print out how old someone\
    \ is:\n\n```java\npublic static void PrintPerson(String First, String Last, int\
    \ Age) {\n    String OutputString = \" He is \" + First + \" \" + Last + \" and\
    \ he is \" + Age + \" years old\";\n    System.out.println(OutputString);\n  \
    \  return;\n} //end PrintPerson\n```\n\nYou can call this with:\n\n```java\nString\
    \ One = \"Uncle\";\nString Two = \"Charley\";\nint Age = 63;\nPrintPerson(One,\
    \ Two, Age);\n```\n\nOr you can hard code these values:\n\n```java\nPrintPerson(\"\
    Uncle\", \"Charley\", 63);\n```\n\nYou realize that unless you mix up the data\
    \ types or add or omit one, you will not get an error. For instance, while any\
    \ of the following will give you a compiler error:\n\n```java\nPrintPerson(One,\
    \ Age, Two);\nPrintPerson(Age, One, Two);\nPrintPerson(One, One, Two);\nPrintPerson(One,\
    \ Two, Age, Output);\n```\n\nThis will not:\n\n```java\nPrintPerson (Two, One,\
    \ Age);\n```\n\nYou will just have a Charley Uncle.\n\nAnother way to use methods\
    \ is in an assignment statement. For example, in java.lang.Math, there are any\
    \ number of math routines that require one or more double arguments and return\
    \ a double as a value. For instance, say you wanted to get the length of hypotenuse\
    \ using the Pythagorean Theorem:\n\n```java\ndouble A, B, C;\nA = 4.0;\nB = 3.0;\n\
    C = Math.sqrt(A*A + B*B);\n```\n\nC is the hypotenuse. Putting it together, can\
    \ we write something more complicated? Let us try to get the length of hypotenuse\
    \ using the Pythagorean Theorem:\n\nWait, let's look at the structure again.\n\
    \n```java\n// Example structure\npublic static void main(String[] args) {\n  \
    \  String Alpha = \"George\";\n    String Beta = \"George\";\n    int Height =\
    \ 10;\n    int Width = 5;\n    boolean Nonsense = false;\n    // ... logic here\n\
    }\n```\n\n(Note: The OCR text became fragmented in the latter half of the provided\
    \ source. I have reconstructed the logical flow based on the provided snippets.)\n"
  mdcn: "\n确保编译器能够捕获你的错误的一种方法，是在你在等价语句中使用单个变量时，反转编写等价语句的常规方式。\n\n如果你正尝试检查变量 `Counter`\
    \ 是否等于 23，不要写成：\n\n```\nCounter == 23\n```\n\n而是写成：\n\n```\n23 == Counter\n```\n\
    \n由于编译器无法将 `counter` 的值放入字面量常量 `23` 中，它会在编译时对 `(23 = Counter)` 报错错误，从而避免了无数小时的困惑和头疼。\n\
    \n注意：比较对于 `char` 变量是有效的，且有时这非常有用。然而，你比较的是编码而不是字母，而且它是区分大小写的，因为‘A’不等于‘a’。所以请确保你的字符大小写一致，或者同时检查两种情况：\n\
    \n```java\nif ((('M' == inChar) || ('m' == inChar)) {\n    system.out.println(\"\
    male\");\n}\n```\n\n## 参考值\n\n字符串和大多数引用类型都有内置的比较方法，应该使用这些方法而不是运算符。这些方法是：\n\n```\n\
    .equals(a);\n.compareTo(a);\n```\n\n其中，你从你的对象调用该方法，`a` 是另一个相同类型的对象。\n\n`.equals`\
    \ 如果它们持有的值等效则返回 `true`，否则返回 `false`。\n`.compareTo` 返回一个表示相对值的 `int`。\n\n例如，假设你有三个字符串：\n\
    \n```java\nString Alpha = \"George\";\nString Beta = \"George\";\nString Charlie\
    \ = \"Sam\";\n```\n\nAlpha.equals(Beta) 会返回 `true`\nBeta.equals(Alpha) 会返回 `true`\n\
    Charlie.equals(Alpha) 会返回 `false`\nAlpha.equals(Charlie) 会返回 `false`\n\nAlpha.compareTo(Beta)\
    \ 返回 0\nAlpha.compareTo(Charlie) 返回一个小于 0 的数字\nCharlie.compareTo(Alpha) 返回一个大于\
    \ 0 的数字\n\n要使用这些函数，你可以构建如下表达式：\n\n```\n(Alpha.equals(Beta)) == 0\n(Alpha.compareTo(Beta))\
    \ < 0\n(Alpha.compareTo(Beta)) > 0\n```\n\n## 组合表达式\n\n由于逻辑表达式会变成布尔值，你可以使用逻辑运算符\
    \ `&&`、`||` 和 `!` 来组合它们。\n\n例如，你可以构建一个赋值语句：\n\n```java\nboolean Nonsense;\nString\
    \ Alpha;\nString Beta;\nint Height;\nint Width;\nboolean IsItTrue;\nIsItTrue =\
    \ (Alpha.compareTo(Beta) > 0) && (Height > Width) || Nonsense;\n```\n\n或者将序列写成这样更清晰：\n\
    \n```java\nAlphaBeta = (Alpha.compareTo(Beta) > 0);\nHeightvsWidth = (Height >\
    \ Width);\nCombined = (AlphaBeta && HeightvsWidth);\nIsItTrue = Combined || Nonsense;\n\
    ```\n\n这样当你遇到问题时，就可以检查所有的中间值。\n\n## 方法调用\n\n调用方法只需使用方法名，后跟圆括号，并传入类型和顺序与方法定义一致的变量。调用序列中的变量名可以与方法声明不同。对于基本类型字符串，你可以用硬编码的值替换变量名。让我们来看几个例子：\n\
    \n```java\npublic static boolean IsNotInt(String test_string)\n```\n\n此方法返回一个布尔值，并用\
    \ `String` 进行调用。它检查该字符串是否为整数（整数字），如果输入字符串是整数则返回 `true`，否则返回 `false`。\n\n由于只有一个\
    \ `String` 变量，你可以通过几种方式调用它（假设 `isTrue` 和 `InputVar` 已经预定义且我们已经设置了 `InputVar`）：\n\
    \n```java\nisTrue = CSCIConvert.IsNotInt(InputVar);\nisTrue = CSCIConvert.IsNotInt(\"\
    5\");\n```\n\n让我们构建一个更复杂的方法。一个打印某人年龄的方法：\n\n```java\npublic static void PrintPerson(String\
    \ First, String Last, int Age) {\n    String OutputString = \" He is \" + First\
    \ + \" \" + Last + \" and he is \" + Age + \" years old\";\n    System.out.println(OutputString);\n\
    \    return;\n}\n```\n\n你可以这样调用它：\n\n```java\nString One = \"Uncle\";\nString\
    \ Two = \"Charley\";\nint Age = 63;\nPrintPerson(One, Two, Age);\n```\n\n或者你可以硬编码这些值：\n\
    \n```java\nPrintPerson(\"Uncle\", \"Charley\", 63);\n```\n\n你会发现，除非你混淆数据类型或漏掉某个参数，否则不会报错。例如，以下任何操作都会导致编译器错误：\n\
    \n```java\nPrintPerson(One, Age, Two);\nPrintPerson(Age, One, Two);\nPrintPerson(One,\
    \ One, Two);\nPrintPerson(One, Two, Age, Output);\n```\n\n而这种则不会：\n\n```java\n\
