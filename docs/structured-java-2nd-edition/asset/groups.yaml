    # 引言


    欢迎本书是在佐治亚海岸学院（Coastal College of Georgia）教授几个学期的计算机科学编程课程后开发的。使用 Java 作为入门语言是一项挑战。我意识到，当学生还没有掌握语言的基本逻辑结构和方法调用时，直接从类和对象开始会导致他们困惑。


    计算机是愚笨的。它们只理解两件事：零和一。然而，它们理解这两件事的速度极快。这需要数学家、工程师和程序员来教计算机如何做事。


    多年来，开发了许多计算机语言。要么是为了特定目的（例如控制飞机），要么是为了让软件开发变得更容易（即著名的“银弹”）。Java 就是其中一种语言。我不会进入历史课程、政治或宗教讨论。如果你是该领域的新手，我们的许多产品讨论都带有宗教狂热。如果你不相信我，试着加入一场苹果与微软的辩论。


    大多数现代语言可以分为两个阵营：过程化（又称函数式）语言或面向对象语言。还有其他语言，如 Lisp（递归）、SQL（基于集合）等，但那是以后的话题。


    过程化语言基于将你的问题分解为小的、紧密且易理解的过程（根据语言称为模块、方法、过程或函数），并使用这些过程来解决你的问题。这种范式是基于过程。通过结构图可以最好地看到这些：


    ![](img/0f17be71ede4ad1bd58cde866220a678_13_0.png)


    Java 是一种面向对象的语言。这意味着它基于这样观点：软件中的一切事物都可以从一个名为“类”的模板开始，类具有属性（即变量）并可以采取行动（即方法）。这些类中的大部分在被赋予生命或实例化为“对象”之前才能使用。一个类可以是汽车，它有颜色、门数、长度、宽度等属性。它可能具有如加速、刹车、左转等方法。一个对象可能是我的
    `myCar`。类图看起来如下：


    | Car |

    | :--- |

    | Color: String |

    | NumberDoors: integer |

    | Length: float |

    | Accelerate() |

    | Brake() |

    | TurnLeft() |


    我认为面向对象的范式非常有用，但对初学者来说非常困难。我也认为，在进入面向对象范式的额外复杂性之前，理解如何开发和调试稳实的方法会有很多益处。


    因此我们面临一个选择：要么教学生多种语言，要么找到一种方法，以过程化的方式教他们面向对象语言的基础，例如 Java。


    我在本书中强调的几点是：


    - 1. 良好的编码习惯。编写他人易读的代码。

    - 2. 良好的设计习惯。

    - 3. 在构建代码时进行测试。我将其称为“写一点，测一点”。

    - 4. 项目生命周期。


    我希望这本书有助于你理解 Java 以及通用的编程。


    # 作者简介


    Glen K. Blood 拥有伊利诺伊理工学院的数学学士学位、犹他大学的气象学学士学位，以及西切斯特大学的计算机科学硕士学位。他曾任美国空军（USAF）上尉，在那里他爱上了计算机以及开发计算机软件的科学与艺术。他在软件开发中担任过几乎所有角色，包括程序员、系统分析师、项目经理、团队负责人和数据库管理员。他的经验包括多维全球数据库、轨道力学、图像处理、产品质量控制和营销。从可口可乐公司退休后，他一直在佐治亚州布鲁恩维克的佐治亚海岸学院担任计算机科学兼职教授。

