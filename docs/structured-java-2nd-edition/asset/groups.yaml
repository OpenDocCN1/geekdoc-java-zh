    # Chapter 9. Advanced Data Types


    # Multidimensional Arrays


    Two dimensional Arrays.


    When you look at a spreadsheet, you see rows and columns. You sometimes want to
    do the same thing in code. You can build an array with two dimensions. The format
    for an array with two dimensions is similar to a one-dimensional array, using
    two sets of brackets:


    ```

    type[][][] myArray = new type[Columns][Rows];

    ```


    Where: Rows and Columns are constants of type int and type is any Primitive type
    or String.


