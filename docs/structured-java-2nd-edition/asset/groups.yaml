    # Expressions


    Expressions can be looked at as the left hand side or part of the left hand side
    of the assignment statement. They generally come in two types:


    +   1. Arithmetic expressions

    2. Logical expressions


    Personally, I would make liberal use of parentheses to make certain that my meaning
    is clear. I would also break up large expressions, by assigning them to intermediate
    variables, to be certain that others understand what I am saying. Breaking up
    equations also helps in debugging, by allowing you to see intermediate values.


    # Arithmetic Expressions


    An Arithmetic expression is an expression that returns a numeric value. The arithmetic
    operators that we will use are:


    +   + Additive operator (also used for String concatenation)

    - Subtraction operator

    * Multiplication operator

    / Division operator

    % Remainder operator


    The order of precedence is the same as in basic mathematics:


    +   parentheses (),

    negation (-),

    multiplication (*,/,%), and addition (+, -).


    You can logically put an arithmetic expression in any place that you would place
    a hard coded primitive variable of the same type. They never stand alone. Examples:'
  - '[PAGE 78]


    Alpha + Beta * 3.5 / Width

    3 + 4

    PI * R * R


    # Logic Expressions


    Logic expressions are formed by a pair of parentheses "()" which return a true
    or false. They never stand alone. They may be on one side of an assignment statement
    or they may be in an if statement (see chapter 6). Inside the parentheses is a
    boolean expression or equality expressions or any combination of the two.


    You can put a logic expression in any place that you would place a boolean value.


    There are three ways to express a logic expression (these can be combined).


    # Boolean Expressions


    Boolean expressions consist of one or more boolean values, true, or false, or
    variables (type boolean) connected by the boolean operators. Unlike arithmetical
    expressions, boolean expressions must be surrounded by parentheses (). The main
    operators are:


    +   &&& for AND

    "||" for OR

    ! for NOT


    (A && B) is true if A is true and B is true, otherwise it is false.


    (A || B) is true if either A is true or B is true.


    !(A) is true if A is false and false if A is true.'
