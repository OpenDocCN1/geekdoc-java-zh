    \ run your first program.\n\nWe will get more into methods in a later chapter.\n\
    \n## Variable\n\nVariables have the following characteristics:\n\n- 1. They have\
    \ a name.\n- 2. They have a Data Type (to be discussed in a later chapter).\n\
    - 3. They have a memory Location.\n- 4. They can be changed in your program at\
    \ runtime.\n\nThere are some basic types of class variables\n\nStatic variables\
    \ – have a single copy of the variables for all objects instantiated from that\
    \ class. You can think of these as Global variables. I would not use these for\
    \ reasons that we will see later.\n\nNon-static variables – not allowed in your\
    \ program class. These are used in your class as variables. You will see how to\
    \ define them in the Data Types Chapter. These are very useful in Stamp Data.\n\
    \nConstants – These use the keyword final. Usually the keywords final and static\
    \ are used together. The only difference between constants and variables is that\
    \ the value can only change when you modify and recompile the code. You cannot\
    \ change constants at runtime. This is the only time that I would recommend (or\
    \ condone) the regular use of static variables in your program. Constants are\
    \ usually designated by using all capitals.\n\n## Writing Clean Readable Code\n\
    \nThe basic Rules for writing clean readable code are very simple:\n\n- 1. Comment\
    \ well.\n    - a. Provide Headers to every class that explains what class does\
