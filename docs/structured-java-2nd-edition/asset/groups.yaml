    # Review


    This chapter concludes our discussion of the three forms of computer logic: sequential,
    decision, and looping. As you have seen, loop logic depends on both decision and
    sequential logic. Decision logic depends on sequential logic. Without all three
    we have long, cumbersome, unreadable code.


    I introduced the four looping types and one new data type. The four looping types
    are:


    +   - 1. do while

    - 2. while

    - 3. for

    - 4. recursion


    Most people probably would not include recursion as a type of looping and it does
    not have a code instruction in Java, but it is an important logic structure. If
    you become used to it, it has all of the attributes of a loop.


    All loops have the following characteristics:


    +   - 1. Start condition. Whatever condition they check must be initialized.

    - 2. End condition. This breaks the loop.

    - 3. Looping step.


    The do and while loops are extremely useful when you are faced with any situation
    where you need to loop through something until a situation changes. What they
    refer to a state change. You do not know how many times you will loop, it could
    be zero, it could be once, it could be 10,000 times. Obviously, if you might never
    loop through it, don''t choose the do while loop. In this class, you will usually
    use one of these two when loading data, since you have no how much data you have.'
