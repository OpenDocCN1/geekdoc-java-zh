    # Introduction


    Welcome. This book was developed after a few semesters teaching the Computer Science
    programming courses at the Coastal College of Georgia. Using Java as an introductory
    language has been a challenge. I have come to the realization that starting with
    classes and objects leads to confusion with my students when they haven''t mastered
    the basic logic structures and method calls of the language.


    Computers are stupid. They understand two things, zero and one. However, they
    understand these two things, extremely fast. It was up to mathematicians, engineers,
    and programmers to teach computers how to do things.


    Over the years, many computer languages have been developed. Either for a specific
    purpose, such as controlling a plane, or to make software development easier (the
    infamous Silver Bullet). One of those languages is Java. I will not get into a
    History lesson, or political or religious discussion. In case you are new to the
    field, many of our product discussions take on a religious fervor. If you do not
    believe me, try getting into an Apple versus Microsoft debate.


    Most modern languages can be placed in one of two camps. Procedural (aka Functional)
    or Object Oriented Languages. There are others, such as Lisp (Recursive), SQL
    (Set-based), etc., but they are for another day.


    Procedural languages are based on breaking your problem into small tight understandable
    processes (called Modules, Methods, Procedures, or Functions depending on the
    Language) and using those processes to solve your problem. The paradigm is based
    on the process. These can best be seen by the Structure Chart:


    ![](img/0f17be71ede4ad1bd58cde868620a678_13_0.png)


    Java is an Object-Oriented Language. This means that it is based on the idea that
    everything in software can be started with a Template called a Class which has
    attributes (aka variables) and can take actions (aka methods). Most of these classes
    must be brought to life or instantiated as Objects before they can be used. A
    Class can be a Car, which has attributes like color, number of doors, length,
    width, etc. It may have methods like accelerate, brake, turn left, etc. An Object
    might be myCar. There are Class Diagrams that look like:


    | Car |

    | :--- |

    | Color: String |

    | NumberDoors: integer |

    | Length: float |

    | Accelerate() |

    | Brake() |

    | TurnLeft() |


    I believe the Object-Oriented paradigm is extremely useful, but is very difficult
    to teach to beginning students. I also believe that there is a lot of benefit
    in understanding how to develop and debug good solid methods before we get into
    the additional complexities of the Object-Oriented paradigm.


    So there is a choice, we either teach our students multiple languages, or we find
    a way to teach them the basics of an object-oriented language, such as Java in
    a procedural fashion.


    A few things that I will stress in this book are:


    - 1. Good Coding habits. Writing code so that others can read it.

    - 2. Good Design habits.

    - 3. Testing your code while building it. I call this Write a little, Test a little.

    - 4. Project life cycle.


    I trust that this book will help in your understanding of Java and coding in general.


    # About the Author


    Glen K. Blood has a B.A. in Mathematics from The Illinois Institute of Technology,
    a B.S. in Meteorology from the University of Utah, and an M.S. in Computer Science
    from West Chester University. He was a Captain in the USAF, where he fell in love
    with computers and the science and art of developing Computer software. He has
    held almost every role in software development including programmer, Systems Analyst,
    Project Manager, Team Lead, and Database Administrator. His experience has included
    multidimensional worldwide databases, orbital mechanics, image processing, product
    Quality Control, and marketing. Since his retirement from The Coca-Cola Company,
    he has been a part-time professor in Computer Science at the Coastal College of
    Georgia in Brunswick, GA.

