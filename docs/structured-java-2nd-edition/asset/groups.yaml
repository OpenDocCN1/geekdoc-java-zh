  - '[PAGE 160]


    move bathrooms from one side to the other after the skyscraper finished than while
    you are developing the blueprints.


    There is an additional psychological factor in that people spend more effort working
    when a deadline is looming. So instead of only having one deadline, the finish
    date, it is helpful to add reviews to make sure that measurable amounts of work
    are completed along the way.


    There are some major issues with the waterfall method that methodologies have
    attempted to fix:


    +   1. Customers find it hard to visualize and sign off on requirements early.

    2. Customers and management fail to understand that any changes to requirements
    will cost time and money.

    3. Customers and management perceive that for a long period of time nothing useful,
    e.g., software, is produced.

    4. Everyone wants to get to the solution early.


    # Waterfall Process


    The Waterfall Process consists of five phases:


    +   1. Analysis

    2. Design

    3. Code

    4. Test

    5. Implementation'
  - '[PAGE 161]


    ![](img/0f17be71ede4ad1bd58cde868620a678_161_0.png)


    Analysis means collecting and understanding requirements. Requirements are everything
    that the software needs to accomplish. They include everything from:


    +   1. Inputs

    2. Outputs: Reports, Files

    3. Databases

    4. GUIs

    5. Business Logic

    6. System Requirements

    7. Performance Requirements

    8. User lists

    9. Security Requirements


    You usually end this phase with an analysis review to get changes and a sign off
    on the requirements document from the customer. This should be treated as a contract
    between you and the customer.'
  - '[PAGE 162]


    I quite often combine some of the preliminary design with analysis to accomplish
    three three things:


    +   1. Give the customer ideas for requirement definition.

    2. Check requirement viability.

    3. Quantify requirements.


    You also sometimes build mock-ups of the GUI designs during this phase to get
    customer input on requirement and design options. Beware, some customers believe
    that the mock-ups are not throwaway code and believe that they are closer to the
    final product than you really are. Don’t make these dog and pony shows look too
    good.


    Design means determining the best way to accomplish all of the requirements. Usually
    you start by breaking up the requirements into manageable sets of functionality
    and designing each one separately. You might have a separate design team for each
    function. You then have to have an interface defined so that the functionality
    will be able to talk to each other. The things you need to worry about are:


    +   1. Addressing as many design ideas as you can, so that you don’t miss a good
    idea.

    2. Selecting a design idea that maps back to all of your requirements.

    3. Identifying any missing requirements. (You either have to address them in your
    design, get sign off on missing new functionality.)

    4. Completing the design idea to the level that it can be coded.

    5. Testing the design idea to ensure that it meets the requirements.'
  - '[PAGE 163]


    Some of the outputs from design are:


    +   1. High level design documentation (code Ready).

    2. Low level design Documentation

    3. Test cases – mapped to requirements. All testable requirements should be tested.

    4. Draft test plan


    You probably have two design reviews during the design phase, a high level design
    review and a final design review.


    You usually have a code review with either your peers or your quality assurance
    (QA) section as you complete your code.


    Output from this phase is usually completed code and test plans and test data.


    My variation of the process combines code, unit testing, and integration testing
    into the same phase. Systems testing and user testing are kept as a separate phase.
    This is because I believe in performing code and test as I write each method as
    a much more effective coding methodology than just coding a large block. This
    has the following advantages:


    +   1. It is easier to detect, debug and fix code in smaller chunks of code.

    2. It is easier (faster) to fix issues in the last 10% of your code if you are
    confident that the first 90% is working.

    3. Even in a single module, if you code to a point, compile and test it, fix any
    problems, add more code, it is faster than writing the whole thing and then trying
    to fix all of the problems.

    4. You can validate your test data early by seeing problems at a much lower level.
    Which is better than trying to run tests later.'
  - "[PAGE 164]\n\nThere are two tools used to build/test code:\n\n+   1. Stubs. Stubs\
    \ are methods that use your designed method, parameters, and return type as but\
    \ have no body. Usually, they consist of something to tell you what parameters\
    \ are sent into them and return a reasonable return type. Sometimes, you can get\
    \ fancy and have an internal flag variable (usually a temporary global variable)\
    \ that changes the return variable to an error value. For example:\n\n```\npublic\
    \ static int myMethod(String ChangeMe) {\n    System.out.println(\n    \" inside\
    \ MyMethod - ChangeMe = \" + ChangeMe );\n    return 0;\n} //myMethod\n```\n\n\
    +   2. Test Program. A test Program is just a small test Program that calls your\
    \ method with various inputs to check it out. I usually use this method of testing\
    \ when I am trying to out a new coding concept and not sure how it works.\n\n\
    Test. This means testing against requirements. You or the test group follow the\
    \ test plan written earlier and report any bugs which are repaired and retested\
    \ until a certain quality point (or an arbitrary date) is reached. A quality point\
    \ is usually defined as a maximum percentage of bugs reported in a period of time.\
    \ The output of this phase is the completed test report. It is usually broken\
    \ out into four types of testing:\n\n+   1. Unit Testing. Testing each piece of\
    \ code independently.\n\n+   2. Integration Testing. Joining pieces of code together\
    \ and testing them together. This is usually joining individual programs together.\n\
    \n+   3. Systems Testing. Testing the entire system as a whole. This usually includes\
    \ hardware, software, and possibly different groups prior to user testing."
  - '[PAGE 165]


    +   4. Performance testing. Testing normal and expected workload any performance
    requirements. Examples include response time, batch processing time, wait times
    on database queries or page loads, etc.


    +   5. Stress Testing – Testing your system to find out when or if it will break.
    Increasing the number of users, or the amount of data that you input until the
    system breaks or until the number is so high that you would “never” exceed this
    limit. is the one time that you are not really unhappy to break your system as
    long as it doesn’t break too early.


    +   6. Load Testing. This is related to performance and stress testing, except
    that it normally happens in a shared environment. You are usually start the test
    system with a normal background load of other processes and then ramp up your
    users to test performance degradation. You usually also look at low and peak system
    usage trends. These usage estimates are determined by monitoring the live system,
    before you add your new or modified system.


    +   7. User Testing. This is testing the user interfaces with a small set of actual
    users from each business unit.


    +   8. Acceptance Testing. This set of tests proves to your your system meets
    his requirements. It is usually monitored by him or his representatives.


    Implementation. The completed code, related data, and hardware are sent to and
    made operational in the field. This can be a simple or extremely complex task.


    This methodology can be a complex process. However, depending on the project you
    can follow the process and still produce quality code in a timely manner.


    Conclusion. In my experience, after you gain experience with a process, you can
    build quality software faster, with fewer errors than not following a process,
    thus meeting your requirements. And that is the goal.'
  - '[PAGE 166]


    # Review


    Meeting your customer’s requirements is the actual goal of computer science. Without
    customers, we wouldn’t have computers to play with, or any real reason to write
    code. You, yourselves, are customers and have almost certainly suffered at the
    hands of poorly developed software.


    I became an early advocate for quality software development. I saw the effects
    of not having a good process, and was taught several excellent processes. I have
    seen how a good process creates quality software, on time, and under budget. I
    have seen it, in the right hands, be flexible, and produce quality code that meets
    the customer’s requirements in record time. On the other hand, I have also seen
    projects flounder and fail without a good process. Every project has three often-competing
    factors:


    +   Quality

    Time

    Budget


    We attempt to meet them using a methodology. One of the oldest, that we learned
    about is the Waterfall, which has five phases:


    +   1. Analysis

    2. Design

    3. Code

    4. Test

    5. Implementation'
  md: "\nmove bathrooms from one side to the other after the skyscraper finished than\
    \ while you are developing the blueprints.\n\nThere is an additional psychological\
    \ factor in that people spend more effort working when a deadline is looming.\
    \ So instead of only having one deadline, the finish date, it is helpful to add\
    \ reviews to make sure that measurable amounts of work are completed along the\
    \ way.\n\nThere are some major issues with the waterfall method that methodologies\
    \ have attempted to fix:\n\n- 1. Customers find it hard to visualize and sign\
    \ off on requirements early.\n- 2. Customers and management fail to understand\
    \ that any changes to requirements will cost time and money.\n- 3. Customers and\
    \ management perceive that for a long period of time nothing useful, e.g., software,\
    \ is produced.\n- 4. Everyone wants to get to the solution early.\n\n## Waterfall\
    \ Process\n\nThe Waterfall Process consists of five phases:\n\n- 1. Analysis\n\
    2. Design\n3. Code\n4. Test\n5. Implementation\n\n![](img/0f17be71ede4ad1bd58cde868620a678_161_0.png)\n\
    \nAnalysis means collecting and understanding requirements. Requirements are everything\
    \ that the software needs to accomplish. They include everything from:\n\n- 1.\
    \ Inputs\n- 2. Outputs: Reports, Files\n- 3. Databases\n- 4. GUIs\n- 5. Business\
    \ Logic\n- 6. System Requirements\n- 7. Performance Requirements\n- 8. User lists\n\
    - 9. Security Requirements\n\nYou usually end this phase with an analysis review\
    \ to get changes and a sign off on the requirements document from the customer.\
    \ This should be treated as a contract between you and the customer.\n\nI quite\
    \ often combine some of the preliminary design with analysis to accomplish three\
    \ things:\n\n- 1. Give the customer ideas for requirement definition.\n- 2. Check\
    \ requirement viability.\n- 3. Quantify requirements.\n\nYou also sometimes build\
    \ mock-ups of the GUI designs during this phase to get customer input on requirement\
    \ and design options. Beware, some customers believe that the mock-ups are not\
    \ throwaway code and believe that they are closer to the final product than you\
    \ really are. Don’t make these dog and pony shows look too good.\n\nDesign means\
    \ determining the best way to accomplish all of the requirements. Usually you\
    \ start by breaking up the requirements into manageable sets of functionality\
    \ and designing each one separately. You might have a separate design team for\
    \ each function. You then have to have an interface defined so that the functionality\
    \ will be able to talk to each other. The things you need to worry about are:\n\
    \n- 1. Addressing as many design ideas as you can, so that you don’t miss a good\
    \ idea.\n- 2. Selecting a design idea that maps back to all of your requirements.\n\
    - 3. Identifying any missing requirements. (You either have to address them in\
    \ your design, get sign off on missing new functionality.)\n- 4. Completing the\
    \ design idea to the level that it can be coded.\n- 5. Testing the design idea\
    \ to ensure that it meets the requirements.\n\nSome of the outputs from design\
    \ are:\n\n- 1. High level design documentation (code Ready).\n- 2. Low level design\
    \ Documentation\n- 3. Test cases – mapped to requirements. All testable requirements\
    \ should be tested.\n- 4. Draft test plan\n\nYou probably have two design reviews\
    \ during the design phase, a high level design review and a final design review.\n\
    \nYou usually have a code review with either your peers or your quality assurance\
    \ (QA) section as you complete your code.\n\nOutput from this phase is usually\
    \ completed code and test plans and test data.\n\nMy variation of the process\
    \ combines code, unit testing, and integration testing into the same phase. Systems\
    \ testing and user testing are kept as a separate phase. This is because I believe\
    \ in performing code and test as I write each method as a much more effective\
    \ coding methodology than just coding a large block. This has the following advantages:\n\
    \n- 1. It is easier to detect, debug and fix code in smaller chunks of code.\n\
    - 2. It is easier (faster) to fix issues in the last 10% of your code if you are\
    \ confident that the first 90% is working.\n- 3. Even in a single module, if you\
    \ code to a point, compile and test it, fix any problems, add more code, it is\
    \ faster than writing the whole thing and then trying to fix all of the problems.\n\
    - 4. You can validate your test data early by seeing problems at a much lower\
    \ level. Which is better than trying to run tests later.\n\nThere are two tools\
    \ used to build/test code:\n\n- 1. Stubs. Stubs are methods that use your designed\
    \ method, parameters, and return type as but have no body. Usually, they consist\
    \ of something to tell you what parameters are sent into them and return a reasonable\
    \ return type. Sometimes, you can get fancy and have an internal flag variable\
    \ (usually a temporary global variable) that changes the return variable to an\
    \ error value. For example:\n\n```\npublic static int myMethod(String ChangeMe)\
    \ {\n    System.out.println(\n    \" inside MyMethod - ChangeMe = \" + ChangeMe\
    \ );\n    return 0;\n} //myMethod\n```\n\n- 2. Test Program. A test Program is\
    \ just a small test Program that calls your method with various inputs to check\
    \ it out. I usually use this method of testing when I am trying to out a new coding\
    \ concept and not sure how it works.\n\nTest. This means testing against requirements.\
    \ You or the test group follow the test plan written earlier and report any bugs\
    \ which are repaired and retested until a certain quality point (or an arbitrary\
    \ date) is reached. A quality point is usually defined as a maximum percentage\
    \ of bugs reported in a period of time. The output of this phase is the completed\
    \ test report. It is usually broken out into four types of testing:\n\n- 1. Unit\
    \ Testing. Testing each piece of code independently.\n\n- 2. Integration Testing.\
    \ Joining pieces of code together and testing them together. This is usually joining\
    \ individual programs together.\n\n- 3. Systems Testing. Testing the entire system\
    \ as a whole. This usually includes hardware, software, and possibly different\
    \ groups prior to user testing.\n\n- 4. Performance testing. Testing normal and\
    \ expected workload any performance requirements. Examples include response time,\
    \ batch processing time, wait times on database queries or page loads, etc.\n\n\
    - 5. Stress Testing – Testing your system to find out when or if it will break.\
    \ Increasing the number of users, or the amount of data that you input until the\
