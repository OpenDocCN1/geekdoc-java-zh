    # Chapter 7. Looping


    Looping is the last type of computing logic that we will look at. It uses decision
    logic and sequential logic, but adds the ability of code to repeat itself. Without
    this ability code, would be much longer, harder to understand, and take much longer
    to write and debug. Loops have three things in common and one major risk. The
    three commonalities are:


    +   1. Start condition. Whatever condition they check must be initialized.

    2. End condition. What breaks the loop.

    3. Looping step.


    The major risk in any loop is an infinite loop or a loop that never ends. You
    must ensure, when designing, coding, and testing a loop, that has a valid end
    condition.


    There are 4 basic Loop formations:


    +   1. do while aka repeat until in-other languages.

    2. while loop

    3. for aka do (not the same as a do while) aka counting loop.

    4. recursion


    While almost any loop can be simulated with any other loop they each serve a specific
    purpose or benefit.


    # Do While Loop.


    do while loops have two basic characteristics.


    +   1. The condition is always tested last.

    2. The code is always executed at least once.'
  - "[PAGE 103]\n\nThe format of a while statement is:\n\n```\ndo{\n  code\n} while(Logical\
    \ Expression);\n```\n\nWhere code consists of the statements that you want to\
    \ accomplish. Let us examine a code fragment that reads a set of integers from\
    \ a file and sums them. The end condition is denoted by the String constant END.\
    \ You have a method that reads a line of data and guarantees you either an integer\
    \ or the string \"END\" in order to denote the end of file.\nYou might write the\
    \ do/while loop as:\n\n```\ndo {\n  InputString = ReadInput();\n  if (!InputString.equalsIgnoreCase(END))\
    \ {\n    NextInt = Integer.parseInt(InputString);\n    Sum = Sum + NextInt;\n\
    \  } // end if\n} while (!InputString.equalsIgnoreCase(END));\n```\n\nNote: Integer.parseInt()\
    \ is a system method that will take a String and turn it into an integer if it\
    \ is a String representation of an integer. It will throw an error if it is not.\
    \ In Readlnput(), we have guaranteed, that InputString is a \"good\" String.\n\
    \n# WHILE Loop\n\nThe while Loop is similar to the do while loop. In fact, the\
    \ two can be switched back and forth with a minor fix to the logical expression.\
    \ The choice between the two is usually a matter of personal preference: The while\
    \ loop has three basic characteristics:\n\n+   1. The condition is tested first.\n\
    2. The code may not be executed at all.\n3. You may need a primer read to redefine\
    \ the condition."
  - "[PAGE 104]\n\na primer read is an initial read of the data that allows you to\
    \ set up the initial condition for the loop. This lets you place the next read\
    \ at the end of the loop. So the while Loop looks like:\n\n```\nwhile (Logical\
    \ Expression) {\n  code\n} //end while\n```\n\nAnd using a primer read, the same\
    \ problem we discussed in the do while looks like:\n\n```\nInputStream = ReadInput();\n\
    while (!InputStream.equalsIgnoreCase(END)) {\n  NextInt = Integer.parseInt(InputString);\n\
    \  Sum = Sum + NextInt;\n  InputStream = ReadInput();\n} // end while\n```\n\n\
    As you can see there really isn’t much difference between the two types of loops.\
    \ They are both readable, they both accomplish the same thing, and the differences\
    \ are very minor. In my opinion, it is a largely matter of taste, comfort, style,\
