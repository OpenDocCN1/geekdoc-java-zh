    \nWhen do you need to instantiate a class?\n\n- 1. You should never instantiate\
    \ your program or main class.\n- 2. If a class has non-static variables or methods,\
    \ it must be instantiated.\n\nHow do you need to instantiate a class? By using\
    \ the keyword new. For instance, the CSCI class FileIn has non-static methods\
    \ to read data from a File. It has two Constructors, one of which expects the\
    \ Filename that it will read. Assuming that FileName is a String variable holding\
    \ the filename, to instantiate a FileIn object Input, the code looks like:\n\n\
    ```\nFileIn Input = new FileIn(FileName);\n```\n\nFileIn does not have any available\
    \ variables. (This is called information Hiding). It does two methods. To read\
    \ a line of data all you need to do:\n\n```\nString dataLine;\ndataLine = Input.Read();\n\
    ```\n\nThen when finished\n\n```\nInput.close();\n```\n\nIf you have Static Variables\
    \ or Methods, then you simply use them, without instantiating the object by addressing\
