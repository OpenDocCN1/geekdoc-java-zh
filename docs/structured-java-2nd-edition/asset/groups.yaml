    );\n    } //end main\n}//end DisplayName\n```\n\nSystem.out.println() is a library\
    \ method to print a String variable to the screen. It automatically adds a return\
    \ at the end. You will use this method all of the time.\n\n\"Glen K. Blood\" is\
