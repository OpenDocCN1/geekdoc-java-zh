  mdcn: "\n在摩天大楼完工后再将浴室从一侧移动到另一侧，远比在开发蓝图时移动要好。\n\n这里还有一个额外的心理因素：当截止日期临近时，人们会投入更多精力工作。因此，与其只有一个截止日期（即完成日期），不如增加评审环节，以确保在整个过程中完成了定量的可衡量工作。\n\
    \n瀑布模型存在一些主要问题，各种方法一直试图解决这些问题：\n\n- 1. 客户很难在早期实现需求的视觉化并签字。\n- 2. 客户和管理层未能理解任何对需求的更改都会花费成本和时间。\n\
    - 3. 客户和管理层认为在很长一段时间内，没有产生任何有用的东西（例如软件）。\n- 4. 每个人都想尽早获得解决方案。\n\n## 瀑布流程\n\n瀑布流程由由五个阶段组成：\n\
    \n- 1. 分析\n2. 设计\n3. 编码\n4. 测试\n5. 实施\n\n![](img/0f17be71ede4ad1bd58cde868620a678_161_0.png)\n\
    \n分析意味着收集和理解需求。需求是软件需要完成的所有内容。它们包括但不限于：\n\n- 1. 输入\n- 2. 输出：报告、文件\n- 3. 数据库\n\
    - 4. 图形用户界面 (GUI)\n- 5. 业务逻辑\n- 6. 系统需求\n- 7. 性能需求\n- 8. 用户列表\n- 9. 安全需求\n\n你通常通过分析评审结束此阶段，获取变更并让客户对需求文档签字。这应该被视为你与客户之间的合同。\n\
    \n我经常会将初步设计与分析结合以实现三个目标：\n\n- 1. 为客户定义需求提供思路。\n- 2. 检查需求的可性。\n- 3. 量化需求。\n\n你有时也会在此阶段构建\
    \ GUI 设计的原型（mock-ups），以获取客户对需求和设计方案的意见。注意，有些客户认为原型不是丢弃代码，并认为它们比你实际上更接近最终产品。不要让这些面子工程（dog\
    \ and pony shows）看起来太完美。\n\n设计意味着确定完成所有需求的最佳方法。通常你首先将需求拆分为可管理的功能集，并单独设计每一个。你可能为每个功能配备专门的设计团队。然后你必须定义接口，以便这些功能能够相互通信。你需要担心的事情是：\n\
    \n- 1. 尽可能处理许多设计想法，以免遗漏好点子。\n- 2. 选择一个映射回所有需求的设计方案。\n- 3. 识别任何缺失的需求。（你要么在设计中处理它们，要么对缺失的新功能签字。）\n\
    - 4. 完成设计想法使其达到可以编码的水平。\n- 5. 测试设计想法以确保其符合需求。\n\n设计的某些输出是：\n\n- 1. 高级设计文档（代码就绪）。\n\
    - 2. 低级设计文档\n- 3. 测试用例——对应需求。所有可测试的需求都应该经过测试。\n- 4. 测试计划草案\n\n你在设计阶段可能会进行两次设计评审：高级设计评审和最终设计评审。\n\
    \n在你完成代码时，通常会与同事或质量保证（QA）部门进行代码评审。\n\n此阶段的输出通常是完成的代码、测试计划和测试数据。\n\n我流程的变体将编码、单元测试和集成测试合并到同一个阶段中。系统测试和用户测试保留作为一个独立的阶段。这是因为我相信，在编写每个方法时进行编码和测试，比只写一个大块代码更有效的编码方法论。这具有以下优势：\n\
    \n- 1. 在较小的代码块中更容易检测、调试和修复代码。\n- 2. 在编写每个方法时进行编码和测试，比只写一个大块代码更有效的。\n- 3. 编写每个方法时编写编码和测试，更容易发现问题。\n\
    - 4. 在编写每个方法时进行编码和测试，比只写一个大块代码更有效的。\n\n- 1. 存根（Stubs）。存根是某些没有实际功能的工具。例如：\n\n```java\n\
    public static int myMethod(String ChangeMe) {\n    System.out.println(\"ChangeMe\
    \ = \" + ChangeMe);\n    return 0;\n}\n```\n\n- 2. 测试程序（Test Program）。这是为了测试系统是否会崩溃。\n\
    - 5. 压力测试（Stress Testing）。测试系统何时崩溃。\n\n- 6. 负载测试（Load Testing）。这与压力测试有关，只是它通常发生在共享环境中。\n\
    \n- 7. 用户测试（User Testing）。这是让每个业务部门的一小部分真实用户测试界面。\n- 8. 验收测试（Acceptance Testing）。这组测试证明了系统符合需求。\n"
