    # Calling Other Methods


    Methods can call other methods. In fact when we called System.out.println() we
    were calling the println() method from our Add methods and our main. We called
    passByValue, passByReturn and passByRef from the main.


    ![](img/0f17be71ede4ad1bd58cde868620a678_70_0.png)


    # Method Body


    The Method Body consists of java statements and method calls. It is everything
    between the two braces {}. It usually ends with the return statement. We will
    get into this in subsequent chapters.


    # Review


    Methods serve several purposes in structured programming:


    +   1. They allow you to break up code into smaller coherent chunks.

    2. They allow you to reuse code.

    3. They allow you to share code easily.

    4. They allow you to test code separately.

    5. They make code easier to read and understand.


    Methods should have high cohesion and be loosely coupled.


    Methods should


    +   1. Have one entrance and one exit.

    2. Be short and clear

    3. Have a single purpose


    Methods should pass information through calling parameters or function returns
    and not global variables.'
