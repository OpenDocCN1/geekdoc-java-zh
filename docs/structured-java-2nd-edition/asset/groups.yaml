  mdcn: "\n\n# 第1章 编译器\n\n从教计算机如何变得有用的第一天起，我们已经走了很远。但语言和编译器仍然非常复杂，需要被理解。基础部分与你编译程序时收到的错误信息相连。\n\
    \n当我刚开始编程时，你会将整个程序作为一叠卡片提交给计算机操作员，由他们将其加载到计算机中，并吐出带有错误的打印件。然后，你必须费力地检查这封打印件，试图找出每一个错误并修复你的卡片。接着，重新提交修复后的卡片，并希望没有错误。重复此过程直到完成。有时，由于其他学生在做同样的事情，从提交卡片到接收打印件之间会有好几个小时的间隔，因此你在每次迭代上花费了大量时间。\n\
    \n现在，你可以在编辑器中编写代码，通过编译器运行文件，获取错误并修复它们，然后立即再次尝试。这才是真正的进步。这就是为什么我建议编写部分代码，尝试编译它，修复错误并进行测试。当你对它满意时，再多写一些。我将这个过程称为“写一点，测一点”。\n\
    \n现在是简要讨论编译器的任何时机。\n\n正如我们在引言中所讨论，计算机是愚蠢的。它们只理解零和一。\n\n# 机器语言\n\n创建计算机处理器的工程师内置了一组被称为**机器语言**的指令。机器语言由直接引用寄存器、内存位置、指令等的数字集组成。不涉及任何字母。这对于每个处理器都是唯一的。机器语言是可执行代码。简单来说，处理过程看起来如下：\n\
    \n![](img/0f17be71ede4ad1bd58cde868620a678_17_0.png)\n\n处理器从机器语言源获取指令，与其寄存器（极速内存）交互，并根据指令采取行动，然后返回获取指令。\n\
    \n# 汇编语言\n\n人们认为编写机器码对人类来说太难理解，因此下一代被称为**汇编语言**。汇编稍微好一点。汇编指令由指令和寄存器的三四个字母助记符组成。通常，内存位置仍然需要以十六进制数字进行编号。汇编器指令与机器语言指令之间通常有一一对应的关系。因此，汇编语言仍然紧系处理器。你通过汇编器运行汇编代码来构建机器语言（又称可执行）代码。这些代码按照之前描述的方式运行。你仍然每个制造商（IBM、UNIVAC等）都有一种汇编语言。\n\
    \n![](img/0f17be71ede4ad1bd58cde868620a678_18_0.png)\n\n他们终于意识到我们可以构建出几乎人类可读的语言。我说“几乎”是因为你仍然需要理解语言的词汇、语法和语法。这些语言被称为第三代语言。有些声称是第四代，但我认为还没有任何语言突破到那种程度。这些语言都具有某种形式的指令、变量和方法。它们都允许你将许多机器语言指令组合成一个简单的语句。它们让你免于担心寄存器和处理器的内部工作。尽管某些语言会让你参与到那个深度（为了性能）。这具有以下优点：\n\
    \n- 1. 语言在系统之间具有（某种程度上）可移植性。遗憾的是，某些供应商为语言添加了许多附加（称为扩展），导致即使源代码在同一系统的不同代之间也无法迁移。\n\
    - 2. 语言更容易学习。\n- 3. 语言更容易维护和修改。这取决于上一个程序员。人们可以写出不可读的（或用我喜欢的说法，“写一次”）代码。\n\n这些语言通常分为两类：编译型和解释型。\n\
    \n# 编译型语言\n\n编译型语言（如 C、FORTRAN、Cobol 和 C++）获取源代码并通过编译器运行。编译器经过多次处理，最后（假设没有编译错误）生成可执行代码。你必须为每个处理器构建一个编译器。\n\
    \n![](img/0f17be71ede4ad1bd58cde868620a678_19_0.png)\n\n# 解释型语言\n\n解释型语言（如 Basic）获取源代码并在运行时生成可执行代码。编译错误和运行时错误都在运行时被检测到。这几乎（不完全）等于每行代码都立即转换为机器代码。它的好处是什么？解释器提供了即时反馈，并在第一批微型流行时开始投入使用。系统非常小，解释器不占用太多资源。你的大多数操作系统命令语言都是解释型的。编译器对于批处理（这是原始计算机的设计初衷）要好得多，并能让你一次性发现更多错误。好得多的是，在你尝试运行之前，它们就给了你一份“健康证明”（就编译错误而言），并且允许系统将可执行代码与源代码分离。\n\
    \n![](img/0f17be71ede4ad1bd58cde868620a678_20_0.png)\n\n如你所示，解释过程非常复杂，虽然不是完全逐行执行，但为了简单起见，你可以认为它是那样的。\n\
    \n- 解释器获取一行代码。\n- 将其转换为机器代码。\n- 返回获取更多指令。\n\n# Java\n\n什么是 Java？Java 是一种高级、面向对象的编程语言。它的设计旨在易编写、使用和调试。“编写一次，到处运行”（WORA）哲学是\
    \ Java 的核心。代码被编译成字节码，然后由 Java 虚拟机（JVM）执行。\n\nJava 的优点包括：\n\n- 1. Java 是可移植的。字节码可以在任何带有\
    \ JVM 的设备上运行。\n- 2. Java 是安全的。它具有内置的内存管理和访问控制功能。\n- 3. Java 是健壮的。它通过异常处理具有强大的错误处理能力。\n\
    - 4. Java 是多线程的。它允许程序同时执行多个任务。\n\n# 编译和运行 Java 的步骤\n\n运行 Java 程序请遵循以下步骤：\n\n1.\
    \ 在扩展名为 `.java` 的文件中编写你的代码。\n2. 使用 `javac` 编译器编译代码，创建一个包含字节码的 `.class` 文件。\n3.\
    \ 使用 `java` 命令运行编译后的程序。\n\n一个简单的 Java 程序示例：\n\n```java\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n"
