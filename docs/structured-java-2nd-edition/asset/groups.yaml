    \ to their beginning brace. Why? It is easy to lose track of which end belongs\
    \ to which beginning brace. Example:\n\n```java\npublic static double nRecursiveFibonacci(int\
    \ n) {\n    if (n < 2 ) return 1;\n    return RecursiveFibonacci(n - 1) +\n  \
    \  RecursiveFibonacci(n - 2);\n} // end RecursiveFibonacci\n```\n\nThis ties the\
    \ end brace to the method\n\n- 2. Use Good naming conventions for all Objects,\
    \ Variables, and Methods.\n\n- 3. Use spacing and indentation.\n\n- 4. Avoid programming\
    \ tricks that produce really tight code unless you need them for performance.\
    \ You (or your replacement) may not recognize when revision is required. Remember,\
    \ time constraints and pressure are always factors. I think of code written this\
    \ way as write-once code. I have avoided mentioning such tricks in this text.\n\
    \n- 5. Be consistent. If you develop a set of techniques in your coding style,\
    \ unless there is a good reason to change them, stick with them. There are several\
