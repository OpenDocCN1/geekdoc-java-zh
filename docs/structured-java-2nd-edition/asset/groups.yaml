  mdcn: "\n然而，为了让链接器（Linker）找到大多数包，你需要在代码中的类语句之前包含一个导入语句（import statement）。例如，如果你想使用\
    \ `util` 包中的任何类，你需要：\n\n``` evenimport java.util.*;\n```\n\n注意，我使用了 `*` 符号来允许编译器包含\
    \ `util` 包中的任何类。虽然你可以指定 `util` 中的特定类，但指定某个特定类并没有用处。链接器只会包含它需要的类。手动指定你需要的类并不会提高效率。因此，我的建议是始终使用“**”。\n\
    \n我为这组课程包含了一个名为 `CSCI` 的包供使用。要使用这些类，你需要：\n\n```\nimport CSCI.*;\n```\n\n如果你遇到“找不到符号”（Can’t\
    \ find Symbol）错误，且该错误与某个包中的方法有关，可能意味着你执行了以下操作：\n\n- 1. 没有导入正确的包。\n- 2. 方法名拼写错误（注意大小写）。\n\
    - 3. 参数列表中的类型错误。\n- 4. 对于 `CSCI` 包，你没有将目录放在正确的位置，例如，放在你编译代码的目录的子目录下。\n\n关于 `CSCI`\
    \ 包的更多信息请参见附录 C。\n\n那么，如何发现你需要哪些包呢？我喜欢使用互联网。另一种检查类的方法是使用 `javap` 命令：\n\n```\n\
    javap java.lang.String\n```\n\n这将为你提供 `String` 类中所有变量和方法的头信息。\n\n遗憾的是，如果你使用了错误的包，将会得到错误，所以如果你不知道包名，互联网会更好用。\n\
    \n关于包的最后一个提示：`java.util` 格式指的是一种目录结构。点号代替了目录符号，因此在你的某个 `CLSPATH` 目录或标准 `java`\
    \ 目录中，这应该是 `java/util`。\n\n## 类 (Class)\n\nJava 中除基本类型之外的一切都是类（Class）或对象（Object）。类是一个模板。类持有变量（即属性）和方法，包括\
    \ `main` 方法。对象是类的实例化。实例化一个类就是让它运行起来。你分配内存并允许它被使用。\n\n你的程序类格式 `public class ClassName`\
    \ 为：\n\n```\npublic class ClassName{\n} //end ClassName\n```\n\n类由以下部分组成：\n\n\
    - 1. 类头 (Header)\n- 2. 构造函数 (Constructor)\n    - a. 初始化对象的方法\n    - b. 与类同名\n\
    \    - c. 可能有属性，也可能没有\n- 3. 变量\n- 4. 方法\n\n## 示例 (Example)\n\n```\npublic class\
    \ DisplayName{\n}//end DisplayName\n```\n\n此程序必须存储在名为 `DisplayName.java` 的文件中，我们将进入更多细节。\n\
    \n其他类有两种类型：静态（static）或非静态（non-static）。\n\n非静态类必须存储在与类同名的文件中。在本课程中，我们不会构建程序类以外的非静态类。\n\
    \n静态类包含在类中。我们将在课程中将它们作为数据类型（Stamp Data types）。\n\n你什么时候需要实例化类？\n\n- 1. 你永远不应该实例化你的程序或主类。\n\
    - 2. 如果一个类具有非静态变量或方法，则它必须被实例化。\n\n如何实例化类？通过使用 `new` 关键字。例如，`CSCI` 类 `FileIn` 具有从文件中读取数据的非静态方法。它有两个构造函数，其中一个期望它将读取的文件名。假设\
    \ `FileName` 是一个持有文件名的字符串变量，要实例化 `FileIn` 对象 `Input`，代码如下：\n\n```\nFileIn Input\
    \ = new FileIn(FileName);\n```\n\n`FileIn` 没有任何可用的变量（这被称为信息隐藏）。它有两个方法。要读取一行数据，你只需要：\n\
    \n```\nString dataLine;\ndataLine = Input.Read();\n```\n\n然后完成后：\n\n```\nInput.close();\n\
    ```\n\n如果你有静态变量或方法，你只需要通过直接类类来使用它们，而无需实例化对象。如果你想将一个字符串转换为整数（Integer），可以使用 `CSCIConvert.Parse()`\
    \ 而无需实例化该类。\n\n```\nmyInt = CSCIConvert.Parse(dataLine,0);\n```\n\n## 方法 (Method)\n\
    \n`main` 方法是程序的初始起点。每个程序都必须有且仅有一个 `main` 方法。\n\n`main` 方法的格式基本上是强制性的。你不需要更改它。\n\
    \n```\npublic static void main(String[] args ) {\n} //end main\n```\n\n事实上，你唯一可以更改的是术语\
    \ `args`。变量 `args[]` 是 `arguments`（参数）的缩写，是在调用程序时提交的命令行参数的字符串数组。名称 `args` 可以更改，但它是传统做法。\n\
    \n你 `main` 方法其余的代码位于大括号之间。\n\n如果方法属于我们当前的类，我们通过声明名称以及它们需要的任何参数或变量来运行它们，例如：\n\n\
    ```\nMethodName(VariableName);\n```\n\n如果它们属于不同的类，我们使用点符号法，如：\n\n```\nSystem.out.println(AnyString);\n\
    ```\n\n因此在编写任何额外代码之前，我们的第一个程序看起来像：\n\n```java\npublic class DisplayName{\npublic\
    \ static void main(String[] args ) {\n```\n\n```\n} //end main\n//end DisplayName\n\
    ```\n\n这可以通过编译，但什么也不做。\n\n那么，让我们给它添加一些简单的代码并编译运行它。\n\n```java\npublic class DisplayName{\n\
    \    public static void main(String[] args ) {\n        System.out.println(\"\
    Hello World\");\n    } //end main\n}//end DisplayName\n```\n\n如果你想将一个字符串转换为整数，可以使用\
    \ `CSCIConvert.Parse()` 而无需实例化该类。\n\n```\nmyInt = CSCIConvert.Parse(dataLine,0);\n\
    ```\n\n## 变量 (Variable)\n\n变量具有以下特性：\n\n- 1. 它们有名称。\n- 2. 它们具有类型（稍后讨论）。\n- 3.\
    \ 它们拥有内存。\n- 4. 它们可以在运行时被更改。\n\n有几种类型的变量：\n\n- 静态变量 (Static variables) —— 在所有对象中只有一个副本。我们将在课程中将它们作为数据类型。\n\
    - 非静态变量 (Non-static variables) —— 不允许在程序中使用（这些我们稍后会看到）。\n- 常量 (Constants) —— 使用\
    \ `final` 关键字。通常 `static` 和 `final` 配合使用。常量与变量的区别在于你无法在运行时更改。常量通常用大写字母表示。\n\n\
    ## 编写整洁的代码 (Writing Clean Code)\n\n编写整洁代码的基本规则非常简单：\n\n- 1. 良好的注释。\n    - a. 为每个类提供解释其功能的头。解释输入和输出。如果存在算法技巧，解释这些算法。如果算法有来源，你可以引用你的来源。\n\
    \    - b. 在代码中解释你的逻辑。特别是当代码不是自说明的时候。\n    - c. 避免过度注释，以至于注释难以维护。\n    - d. 避免注释掉未使用的代码。有些公司鼓励这样做以维护版本。最终，注释掉的代码比实际代码还长。如果这很重要，使用版本软件维护旧代码。或者保留足够长的时间测试然后清理。\n\
    \    - e. 在大括号末尾放置注释以与起始大括号连接。为什么？因为容易忘记哪个大括号属于哪个起始大括号。例如：\n\n```java\npublic\
    \ static double nRecursiveFibonacci(int n) {\n    if (n < 2 ) return 1;\n    return\
    \ RecursiveFibonacci(n - 1) +\n    RecursiveFibonacci(n - 2);\n} // end RecursiveFibonacci\n\
    ```\n\n这会将大括号与方法连接起来。\n\n- 2. 为所有对象、变量和方法使用良好的命名。\n\n- 3. 使用间距和缩进。\n\n- 4. 除非性能需要，否则避免产生紧凑代码的编程技巧。你（或你的接任者）可能无法识别何时需要修订。记住，时间限制和压力总是因素。我认为这样编写的代码是一次性代码。我在文中没有提到此类技巧。\n\
    \n- 5. 保持一致性。如果你在编码风格中开发了一套技术方案，除非有充分理由更改它们，否则请坚持下去。这种做法有几个很好的理由。你可能会犯更少的错误，你可以开发自己的库、代码和测试，而且你的速度会提高。然而，不要害怕学习新知识。\n"
