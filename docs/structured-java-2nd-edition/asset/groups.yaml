    There are some interesting facts about the letter code values:


    The Capital letters are exactly 32 less than their lower case equivalents.


    They are numerically in order but case dependent (''a'' < ''b'', but ''a'' > ''B'').


    # The char datatype


    ```

    char mychar;

    char Sex = ''M'';

    ```


    Character constants are denoted by a pair of single quotes, ''a''.


    As a single variable char is not generally useful, unless you are playing individual
    parts of Strings.


    # Strings


    Strings in any language are a collection of characters. There are several ways
    that these are implemented. Some languages, such as FORTRAN, do not define a separate
    String data Type.


    There are three basic ways that languages define Strings.


    +   1. As a character array with a pre-defined end character such as linefeed.
    The only issue with this method is that you have to use a special method to include
    this character within your array.

    2. As a Character Array with Fixed Length. You define the length in your code.
    The extra length is then filled with blanks.

