  mdcn: "\n我们学习到：\n\n- 1. 分析主要是关于收集和理解需求。\n- 2. 设计是构建一个能够满足需求的设计。\n- 3. 编码是根据设计编写代码，并为测试阶段构建输入数据。\n\
    - 4. 测试既要确保你的代码没有错误，又要确保它符合需求。\n- 5. 实现是让你的客户可以使用这些程序。\n\n通过将代码编写与单元测试和集成测试结合到我所称的“写一点、测一点”的流程中，我们发现可以显著减少代码错误并加快编码速度。\n\
    \n测试有几种形式，包括：\n\n- 1. 单元测试。\n- 2. 集成测试。\n- 3. 系统测试。\n- 4. 性能测试。\n- 5. 负载测试。\n\
    - 6. 压力测试。\n- 7. 用户测试。\n- 8. 验收测试。\n\n## 结语。\n\n现在你可能明白为什么我说编码只占项目预算的 25% 了。这虽然很大，但并不是投入最多汗水的地方。不要误会我，我热爱编程。我喜欢看到我的想法变为现实，但我个人最喜欢的软件开发部分是设计。\n\
    \n我实际上见过一个价值数百万的项目被废弃，只因为一位高级客户在验收测试期间不喜欢某个 GUI 设计。他是否参与了需求或设计？我并不知道，但这就是给出的理由。这就是为什么我喜欢将设计模块化，并将用户界面与业务逻辑完全分离。\n\
    \n我还喜欢在需求分析阶段对 GUI 和报告的外观进行原型设计，并尽快获得签署确认。我之后可能需要批准更改，但这是客户最感兴趣的部分。\n\n## 问题\n\
    \n- 1. 分析是以下哪种阶段：\n  a. 你设计你的流程。\n  b. 你开发你的代码。\n  c. 你定义你的需求。\n  d. 你测试你的代码以确保它符合需求。\n\
    \n- 2. 内聚性意味着：\n  a. 模块之间如何通信。\n  b. 一个模块可以做多少事情。\n  c. 模块是如何编译的。\n  d. 你是如何设置注释的。\n\
    \n- 3. 设计是以下哪种阶段：\n  a. 你设计你的流程。\n  b. 你开发你的代码。\n  c. 你定义你的需求。\n  d. 你测试你的代码以确保它符合需求。\n\
    \n- 4. 编写代码时，更有效的方法是：\n  a. 全部写完，然后编译测试并调试。\n  b. 边写、边编译、边测试、边调试。\n  c. 写好代码，发给朋友调试。\n\
    \  d. 放弃并找份新工作。\n\n- 5. 测试是以下哪种阶段：\n  a. 你设计你的流程。\n  b. 你开发你的代码。\n  c. 你定义你的需求。\n\
    \  d. 你测试你的代码以确保它符合需求。\n\n- 6. 所有项目共同拥有的三个因素是：\n  a. 质量、时间、预算。\n  b. 管理、代码和进度。\n\
    \  c. 质量、时间和代码。\n  d. 质量、进度和时间\n  e. 时间、预算和代码。\n\n- 7. 编码是以下哪种阶段：\n  a. 你设计你的流程。\n\
    \  b. 你开发你的代码。\n  c. 你定义你的需求。\n  d. 你测试你的代码以确保它符合需求。\n\n- 8. 在设计中，观察想法时：\n  a.\
    \ 始终专注于你产生的第一个想法。\n  b. 始终采纳资深人员的思想。\n  c. 寻找尽可能多的想法并平等地评估它们。\n  d. 跳过这一步直接代码。\n\
    \n- 9. 在设计测试用例时，哪条陈述是错误的：\n  a. 避免可能导致你的代码失败的测试用例。\n  b. 寻找异常测试用例。\n  c. 使用真实测试数据。\n\
    \  d. 使用极大量的测试数据。\n\n- 10. 当你构建设计时，你应该：\n  a. 对你的客户隐藏它。\n  c. 展示给竞争对手的朋友看。\n \
    \ d. 展示给街角的家伙。\n\n## 附录 A. 使用 CCGA U 盘。\n\n对于 CCGA CSCI 类，我们创建了一个包含 Notepad++、Java\
