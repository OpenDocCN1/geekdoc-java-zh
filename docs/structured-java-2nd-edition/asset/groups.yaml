    } //end main

    ```


    In fact the only thing that you can change is the term args. The variable args[]
    is a short for arguments and is the string array of command line arguments that
    you submit when you call the program. The name args can be changed, but is traditional.


    The rest of the code for your main method goes between the braces.


    If methods belong to our current class then we run them by stating the name and
