    \ and making coding faster.\n\nTest has several flavors including:\n\n- 1. Unit\
    \ Testing.\n- 2. Integration Testing.\n- 3. Systems Testing.\n- 4. Performance\
    \ testing.\n- 5. Load Testing.\n- 6. Stress Testing.\n- 7. User Testing.\n- 8.\
    \ Acceptance Testing.\n\n## Final thoughts.\n\nNow you may see why I said that\
    \ coding is only about 25% of a projects budget. It is significant, but it is\
    \ not where most of the sweat comes in. Don't get me wrong, I love to program.\
    \ I love to see my ideas come to life, but my personal favorite part of software\
    \ development is design.\n\nI have actually seen a multi-million-dollar project\
    \ scrapped because a high-level customer did not like a GUI design during acceptance\
    \ testing. Was he involved in the requirements or design? I do not know, but that\
    \ was the reason given. This is why I like to modularize my design and make the\
    \ user interfaces completely separate from the business logic.\n\nI also like\
    \ to mock up the GUI and report look and feel during requirements analysis and\
    \ get them signed off on as soon as possible. I may need to get changes approved\
    \ later, but this is the part of the system that your customer has the most interest\
    \ in.\n\n## Questions\n\n- 1. Analysis is the phase in which:\n  a. You design\
    \ your process.\n  b. You develop your code.\n  c. You define your requirements.\n\
    \  d. You test your code to ensure that it meets the requirements.\n\n- 2. Cohesion\
    \ means:\n  a. How modules communicate between each other.\n  b. How many things\
    \ a module can do.\n  c. How modules are compiled.\n  d. How you set your comments.\n\
    \n- 3. Design is the phase in which:\n  a. You design your process.\n  b. You\
    \ develop your code.\n  c. You define your requirements.\n  d. You test your code\
    \ to ensure that it meets the requirements.\n\n- 4. When writing code, it is more\
    \ efficient to:\n  a. Write it all, then compile and test and debug it.\n  b.\
    \ Write, compile, test, and debug as you go.\n  c. Write the code, then send it\
    \ to a friend to debug.\n  d. Give up and get a new job.\n\n- 5. Test is the phase\
    \ in which:\n  a. You design your process.\n  b. You develop your code.\n  c.\
    \ You define your requirements.\n  d. You test your code to ensure that it meets\
    \ the requirements.\n\n- 6. The three factors that all projects have in common\
    \ are:\n  a. Quality, time, and budget.\n  b. Management, code, and schedule.\n\
    \  c. Quality, time, and code.\n  d. Quality, schedule, and time\n  e. Time, budget,\
    \ and code.\n\n- 7. Code is the phase in which:\n  a. You design your process.\n\
    \  b. You develop your code.\n  c. You define your requirements.\n  d. You test\
    \ your code to ensure that it meets the requirements.\n\n- 8. In design, when\
    \ looking at ideas:\n  a. Always hone on the first idea that you come up with.\n\
    \  b. Always take the senior person's idea.\n  c. Look for as many ideas as you\
    \ can and evaluate them equally.\n  d. Skip this step and code.\n\n- 9. When designing\
    \ test cases, which statement is false:\n  a. Avoid test cases that might make\
    \ your code fail.\n  b. Look for outlier test cases.\n  c. Use live test data.\n\
    \  d. Use extreme amounts of test data.\n\n- 10. When you are building your design,\
    \ you should:\n  a. Hide it from your customer.\n  c. Show it to your buddies\
    \ from the competition.\n  d. Show it to the guy down at the corner.\n\n## Appendix\
    \ A. Using the CCGA Flashdrive.\n\nFor the CCGA CSCI classes, we created a Flashdrive\
    \ with Notepad++, the Java Developer Kit, the CSCI package and some example programs\
    \ started. You should be able to use this Flashdrive on your home computer or\
    \ on any Windows Computer.\n\n## Notepad++\n\nNotepad++ is a context driven Text\
    \ editor that will help you write your Java source code. While you can use any\
    \ text editor to write source code, you cannot use Word to do.\n\nTo bring up\
    \ Notepad++ bring up the Flashdrive in a FileExplorer Window and click on the\
    \ notepad++.exe -Shortcut. Alternatively, go to the NotepadPP subdirectory and\
    \ click on notepad++.exe. You can also left copy this and and paste this shortcut\
    \ in the main flashdrive directory. Notepad++ is fairly easy to use. For further\
    \ explanation, go to https://notepad-plus-plus.org/\n\n| data | date | type |\
