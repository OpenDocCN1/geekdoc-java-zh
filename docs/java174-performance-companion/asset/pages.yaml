- pgno: 29
  md: '# Concurrent Cycle


    goals without requiring a full GC and can usually be tuned such that a full GC
    is not needed.


    A G1 concurrent cycle includes the activity of several phases: initial marking,
    concurrent root scanning, concurrent marking, remark, and cleanup. The beginning
    of a concurrent cycle is the initial mark, and the ending phase is cleanup. All
    these phases are considered part of "marking the live object graph" with the exception
    of the cleanup phase.


    The purpose of the initial-mark phase is to gather all GC roots. Roots are the
    starting points of the object graphs. To collect root references from application
    threads, the application threads must be stopped; the initial-mark phase is stop-the-world.
    In G1, the initial marking is done as part of a young GC pause since a young GC
    must gather all roots.


    The marking operation must also scan and follow all references from objects in
    the survivor regions. This is what the concurrent root scanning phase does. During
    this phase all Java threads are allowed to execute, so no application pauses occur.
    The only limitation is that the scanning must be completed before the next GC
    is allowed to start. The reason for that is that a new GC will generate a set
    of objects that are different from the initial mark''s survivors.


    Most marking work is done during the concurrent marking phase. Multiple threads
    coordinate to mark the live object graph. All Java threads are allowed to execute
    at the same time as the concurrent marking threads, so there is no pause in the
    application, though an application may experience some throughput reduction.


    After concurrent marking is done, another stop-the-world phase is needed to finalize
    all marking. This phase is called the "remark phase" and is usually a very stop-the-world
    pause.


    The final phase of concurrent marking is the cleanup phase. In this phase, regions
    that were found to contain any live objects are reclaimed. These regions are not
    included in a young or mixed GC since they contain no live objects. They are added
    to the list of available regions.


    The marking phases must be completed in order to find out what regions to include
    in the mixed GCs. Since it is the mixed GCs that are the primary mechanism for
    freeing memory in G1, it is important that the marking phase finishes before G1
    runs out of available regions. If the marking phase does not finish prior to running
    out of available regions, G1 will fall back to a full GC to free up memory. This
    is reliable but slow. Ensuring that the marking phases complete in time to avoid
    a full GC may require, which is covered in detail in Chapter 3.'
