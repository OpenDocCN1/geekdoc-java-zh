    # JSDB


    JavaScript Debugger provides a JavaScript interface to the SA. It is a command-line
    JavaScript Debugger based on Mozilla''s Rhino JavaScript Engine.


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar

    sun.jvm.hotspot.sql1.JSDB 5684

