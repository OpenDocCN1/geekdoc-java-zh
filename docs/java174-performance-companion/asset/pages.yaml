- pgno: 26
  md: '# Chapter 1 Garbage First Overview


    address space. There is no fragmented empty space between objects. Effectively,
    G1 does partial compaction of the old generation. Remember that CMS, Parallel,
    and Serial GC all require a full GC to compact the old generation and compaction
    scans the entire old generation.


    Since G1 performs GC on a per-region basis, it is suitable for large Java heaps.
    The amount of GC can be limited to a small set of regions though the Java heap
    size may be rather large.


    The largest collectors to pause times in G1 are going and mixed collections, so
    one of the design goals of G1 is to allow the user to set a GC pause time goal.
    G1 attempts to meet the specified pause time through adaptive sizing of the Java
    heap. It will automatically adjust the size of the young generation and the total
    Java heap size. The lower the pause time goal, the smaller the young generation
    and the larger the total size, making the old generation relatively large.


    A G1 design goal is to limit required to setting a maximum Java heap size and
    specifying a GC pause. Otherwise, G1 is designed to dynamically tune itself using
    internal heuristics. At the time of writing, the heuristics G1 are where most
    active HotSpot GC development takes place. Also as in writing, G1 may require
    additional tuning in some cases, but the prerequisites to building good heuristics
    are present and looking promising. For advice on how to tune G1, see Chapter 3.


    To summarize, G1 scales better than the other collectors for large Java heaps
    by splitting the Java heap into regions. G1 deals with heap fragmentation with
    the help of partial compactions, and it does all its work in a multithreaded fashion.


    As of writing, G1 primarily uses the case case of large Java heaps with reasonably
    low pauses, and also those applications that are using CMS GC. There are plans
    to use G1 to also target the throughput case, but for applications looking for
    high throughput that can tolerate longer GC pauses, Parallel GC is currently the
    better choice.


    # G1 Design


    As mentioned earlier, G1 divides the Java heap into regions. The region size can
    vary depending on the size of the heap but must be a power of 2 and at least 1MB
    and at 32MB. Possible region sizes are therefore 1, 2, 4, 8, 16, and 32MB. All
    regions are the same size, and their size does not change during execution of
    the JVM. The region size calculation is based on the average of the initial and
    maximum Java heap sizes such that there are about 2000 regions for average heap
    size. As example, for a 16GB Java heap with -Xmx16g -Xms16g command-line options,
    G1 will choose a region size of 16GB/2000 = 8MB.'
