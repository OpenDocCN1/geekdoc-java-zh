- pgno: 80
  md: '# Using Soft References


    It is unfortunate that the soft references JavaDoc (http://docs.oracle.com/java/8/docs/api/index.html?java/lang/SoftReference.html)
    recommends their for implementing memory-sensitive object caches. This often misleads
    users into thinking that the JVM can manage the size of the object cache and remove
    entries—that is, free space—as the garbage collector desires. Plus, the existence
    of -XX:SoftLRUPolicyMSMB suggests that the use of soft references for an object
    cache leads to high occupancy, which in turn causes GC events, and in some cases
    leads to full GC events, or worse, out-of-memory errors.


    To illustrate why soft references for object cache tends to result in unexpected
    and undesirable behavior, let''s begin looking at -XX:SoftLRUPolicyMSPerMB, how
    many recently accessed references are kept alive by the garbage collector. For
    every megabyte of estimated memory found in the heap before getting rid of the
    soft references, and potentially figuring out how no longer reachable (or dead),
    the -XX:SoftLRUPolicyMSPerMB in milliseconds adds a window of how long it has
    been since the application accessed a given reference''s soft yes/no for keeping
    it strongly alive in a currently executing garbage collection.


    If you step back and think about what this means, the faster an application runs,
    the more you can expect soft references to be accessed. For example, say an application
    is executing 10,000 transactions per second. That application is executing 100
    times more soft references per second than it were executing 100 transactions
    per second. The object allocation and promotion rates are also 100 times greater.
    The faster the application executes, the harder it makes the garbage collector.


    Keep in mind the amount of free megabytes to estimate the "soft references to
    keep" time window is computed on how much space will be if all soft references
    were to be cleared and reclaimed. The garbage collector has no way of knowing
    how much additional memory will be kept alive by a soft reference. It can only
    speculate or make an estimate of how many soft references to keep alive without
    knowing how much memory will actually retain.


    Also, the larger the number of soft references that are kept alive, say in an
    object cache, the less free memory will remain at the end of a garbage collection.
    The amount of space available for a GC, the more frequently the garbage collector
    will run for a given allocation or promotion rate. For example, at ten less free
    memory, the garbage collector will run times more frequently and do approximately
    ten times more work per unit of application work.


    What this is that soft references are useful when an application is doing little
    or no work, because the overhead of soft reference use grows to the square of
    the rate of application work. You can control the constant multiplier ahead of
    square, but that is the only control you have. Which GC tuning guides suggests
    setting this constant multiplier to zero -XX:SoftLRUPolicyMSPerMB=0.


    Keep in mind there is no Java or JVM specification that specifies a default value
    for the constant multiplier just described. A garbage collector implementation
    can clear and reclaim a differing number of soft references for the same Java
    application executing with the same'
  merge: -1
  img_proc: true
