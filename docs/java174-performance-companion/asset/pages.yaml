    # Monitor Cache Dump


    This utility dumps the cache of object monitors as shown in Figure 4.29. This
    is useful in troubleshooting synchronization-related issues.


    # Code Viewer


    Code Viewer (see the example in Figure 4.30) can show us the bytecodes of a method
    and the JIT compiler-generated machine code of the method it has been compiled.
    This tool is very useful in troubleshooting JIT compiler issues. Many times we
    encounter problems where a certain method compiled by the server/client compiler
    is either producing unexpected results or is causing a JVM crash. By looking at
    the disassembled generated compiled code (see Figure 4.31), we can get to the
    root of such issues.'
