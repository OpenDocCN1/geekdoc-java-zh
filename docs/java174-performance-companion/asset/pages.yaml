    The remainder of the Other time is spent in fixing JNI handlers and similar work.
    The collective time in Other should be very small, and most time should have a
    reasonable explanation. For an example, you could see higher times in Free Cset
    if your Cset per pause is very large. Ref Proc and Ref Enq could show higher depending
    on how many references are used in your application. Similar reasoning can be
    applied to Humongous Reclaim times, if you have many short-lived humongous objects.


    # Young Generation Tunables


    As covered in Java™ Performance [1], Chapter 7, "Tuning the JVM, Step by Step,"
    there are some tunables that can help with tuning the young generation itself.
    G1 has great tuning potential. There are initial and default values that help
    G1 heuristics, and in order to be able to tune G1 understand these defaults and
    their effect on the heuristics. Options as -XX:MaxGauseMillis (pause goal; defaults
    to 200 ms), -XX:G1NewPercent (initial generation size expressed as a percentage
    of the total heap; defaults to 5 percent), -XX:G1NewSizePercent (maximum generation
    growth limit expressed as a percentage of the total heap; to 60 percent) help
    grow or shrink the young generation based on the initial and upper bounds, the
    pause goal, and the weighted average of previous copy times. If the workload and
    if there is a perceived benefit from circumventing the adaptive resizing (for
    example, you see that the predicted time varies drastically from the actual observed),
    you can adjust the defaults. The side effect is that you are forgetting adaptive
    resizing for more predictable limits. Another thing to keep in mind is that the
    new limits are applicable only to the one application that you are tuning and
    will not carry forward to any other/different applications that may have similar
    pause requirements since most applications exhibit different behaviors based on
    their allocation rates, promotion rates, and transient live data sets, sizes and
    life spans.


    Let''s look at some examples. These are once again using JDK 8u45 with different
    values for -XX:MaxGCPauseMillis (as be seen in the time noted as the target pause
    time). The benchmark suite was DaCap, and -XX:+PrintAdaptiveSizePolicy was enabled
    at the JVM command line.'
