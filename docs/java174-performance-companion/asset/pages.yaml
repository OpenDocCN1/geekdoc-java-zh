    sequences can get very expensive, and the throughput of the application will fall
    proportionally with the complexity of the barrier code; hence G1 GC does the minimum
    amount of work that is needed to figure out if the reference update is a cross-region
    update since cross-region reference update needs to be captured in the RSet of
