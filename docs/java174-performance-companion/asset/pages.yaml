  img_proc: true
- pgno: 60
  md: 'In earlier versions of HotSpot, the entire code cache was treated as a single
    root and was claimed and processed by a single worker thread. A large and full
    or nearly full code cache would hold up that worker thread and lead to an increase
    in the total pause time. With the introduction of code root scanning as a separate
    parallel activity, the work of scanning nmethods is reduced to just scanning RSets
    for references from the compiled code. Hence for a particular region in the CSet,
    only if the RSet for that region has strong code roots is the corresponding nmethod
    scanned.


    > Tip

    Developers often refer to the dynamically compiled code for a Java method by the
    HotSpot term of nmethod. An nmethod is not to be confused with a native method,
    which refers to a JNI method. Nmethods include auxiliary information such as constant
    pools in addition to generated code.


    > Tip

    To reduce nmethod scanning times, only the RSets of the regions in the CSet are
    scanned for references introduced by the compiler, rather than the “usual” references
    that are introduced by the Java application mutator threads.


    # Summarizing Remembered Sets


    The option -XX:+GSummarizeRSetStats can be provide a window into the total number
    of RSet coarsening (fine-grained or coarsened bitmap) to help determine if refinement
    changes are able to handle the updated buffers and to gather more information
    on nmethods. This option summarizes RSet statistics every GC pause, where n is
    set by -XX:+GSummarizeRSetStatsPeriod=n.


    > Tip

    -XX:+GSummarizeRSetStats is a diagnostic option and must be enabled by adding
    -XX:+UnlockDiagnosticVMOptions to the command line, for example,

    JAVA_OPTS="-XX:+UseG1 -XX:+UnlockDiagnosticVMOptions -XX:+PrintGCDetails -XX:+GSummarizeRSetStats
    -XX:+GSummarizeRSetStatsPeriod=1 -Xloggc:jdk845_h.log".'
  merge: -1
  img_proc: true
