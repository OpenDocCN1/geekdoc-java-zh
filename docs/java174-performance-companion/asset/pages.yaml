  md: "# Heap Sizing\n\nThe Java heap size in G1 is always a multiple of the region\
    \ size. Except for that limitation, G1 can grow and shrink the heap size dynamically\
    \ between -Xms and -Xmx just as the other HotSpot GCs.\n\nG1 may increase the\
    \ Java heap size for several reasons:\n\n+   1. An increase in size can occur\
    \ based on heap size calculations during a full GC.\n2. When a young or minor\
    \ GC occurs, G1 calculates the time spent to perform the GC compared to the time\
    \ spent executing the Java application. If too much time is spent in GC according\
    \ to the command-line -XX:GCTimeRatio, the Java heap size is increased. The idea\
    \ behind growing the Java heap size in this situation is to allow GCs to happen\
    \ less frequently so that the time in GC compared to the time spent executing\
    \ the application is reduced.\n The default value for -XX:GCTimeRatio in G1 is\
    \ 9. All HotSpot garbage collectors default to a value of 99. The larger the value\
    \ for GCTimeRatio, the more aggressive the increase in Java heap size. The other\
    \ HotSpot collectors are thus more aggressive in their decision to increase Java\
    \ heap size and by default are targeted to spend less time in GC relative to the\
    \ time spent executing the application.\n3. If an object allocation fails, even\
