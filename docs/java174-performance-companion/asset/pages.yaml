- pgno: 25
  md: 'Similar to CMS GC, there is a fail-safe to collect and compact the entire old
    generation in directions such as when old generation space is exhausted.


    A G1 old generation collection, ignoring the fail-safe type of collection, is
    a set of phases, some of which are parallel stop-the-world and of which are parallel
    concurrent. That is, some phases are multithreaded and stop application threads,
    and others are multithreaded and execute at the same time as the application threads.

    Chapters 2 and 3 provide more detail on each of these phases.


    G1 initiates an old generation collection when a Java heap occupancy threshold
    is exceeded. It is important to note that the heap occupancy threshold in G1 measures
    the old generation occupancy compared to the entire Java heap. Readers who are
    familiar with CMS remember that CMS initiates an old generation collection using
    an occupancy threshold applied against the old generation only. In G1, once the
    heap occupancy threshold is reached or exceeded, a parallel stop-the-world initial-mark
    phase is scheduled to execute.


    The initial-mark phase executes at the same time as the next GC. Once the initial-mark
    phase completes, a concurrent multithreaded marking phase is initiated to mark
    all live objects in the old generation. When the marking phase is completed, a
    parallel stop-the-world remark phase is scheduled to mark any objects that may
    have been missed due to application threads executing concurrently with the marking
    phase. At the end of the remark phase, G1 has full marking information on the
    old generation regions. If there happen to be old generation regions that do not
    have live objects in them, they can be reclaimed without any additional work during
    the next phase of the concurrent cycle, the cleanup phase.


    Also at the end of the remark phase, G1 can identify an optimal set of old generations
    to collect.


    # Tip


    The set of regions to collect during a garbage collection is referred to as a
    collection set (CSet).


    The regions selected for inclusion in a CSet are based on how much space can be
    freed and the G1 pause time. After the CSet has been identified, G1 schedules
    a GC to collect regions in the CSet during the next several young generation GCs.
    That is, over the next several young GCs, a portion of the old generation will
    be collected in addition to the young generation. This is the mixed GC type of
    garbage collection mentioned earlier.


    With G1, every region regardless of whether it is young or old generation, has
    its live objects evacuated to an available region. Once the live objects have
    been evacuated, the young and/or old regions that have been collected become available
    regions.


    An attractive outcome of evacuating live objects from old generation regions into
    available regions is that the evacuated objects end up next to each other in the
    virtual'
