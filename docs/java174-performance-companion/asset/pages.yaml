- pgno: 52
  md: '# 36 Chapter 2 · Garbage First Collector in Depth


    the corresponding bit in the marking bitmap (and pushing the object onto a local
    marking stack if the object lies below the finger). Marking iterates over the
    set bits in a section of the marking bitmap, tracing the field references of the
    marked objects, setting more bits in the marking bitmap, and pushing objects as
    necessary.

    Live data accounting is piggybacked on the marking operation. Hence, every time
    an object is marked, it is also counted (i.e., its bytes are added to the region''s
    total). Only objects below NTAMS are marked and counted. At the end of this stage,
    the next marking bitmap is cleared so that it is ready when the next marking cycle
    starts. This is done concurrently with the mutator threads.


    > Tip

    JDK 8u40 introduces a new command-line option -XX:+ClassUnloadingWithConcurrentMarking
    which, by default, enables unloading with concurrent marking. Hence, concurrent
    marking can track classes and calculate their liveness. During the remark stage,
    the unreachable classes can be unloaded.


    Remark

    The remark stage is the final stage. During this stop-the-world stage, G1 GC completely
    drains any remaining SATB log buffers and processes any updates. G1 GC traverses
    any unvisited live objects. As of JDK 8u40, the remark stage is stop-the-world,
    since mutator threads are responsible for updating the SATB log buffers and as
    such "own" theirs. Hence, a final stop-the-world pause is necessary to cover all
    the live data and safely complete live data accounting. In order to reduce time
    spent in this pause, multiple GC threads are used to parallel the log buffers.
    The -XX:ParallelGCThreads help set the number of GC threads available during any
    GC pause. Reference processing is also a part of the remark stage.


    > Tip

    Any application that heavily uses reference objects (weak references, soft references,
    phantom references, or final references) may see high remark times as a result
    of the reference-processing overhead. We will learn more about this in Chapter
    3.


    Cleanup

    During the cleanup pause, the two marking bitmaps swap roles: the next marking
    bitmap becomes the previous one (given that the current marking cycle has been
    finalized and the next marking bitmap now has consistent marking information),
    and'
