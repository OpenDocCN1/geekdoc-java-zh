- pgno: 41
  md: '# Remembered Sets and Their Importance


    In order to facilitate the independence of collections, many garbage collectors
    maintain RSets for their regions. An RSet is a data structure that helps maintain
    and track references into its own unit of collection (which in G1 GC''s case is
    a region), eliminating the need to scan the entire heap for information. When
    G1 GC executes a stop-the-world collection (young or mixed), it scans the RSets
    of regions contained in its CSet. Once the live objects in the region are moved,
    their incoming references are updated.


    With G1 GC, during any young or mixed collection, the young generation is always
    collected in its entirety, eliminating the need to track references whose object
    resides in the young generation. This reduces the RSet overhead. Thus, G1 GC just
    needs to maintain the RSets in the following scenarios:


    +   - Old-to-young references—G1 maintains pointers from regions in the old generation
    into the young generation region. The young generation is said to “own” the RSet
    and hence the region is said to be an RSet “owning"

    - Old-to-old references—Here pointers from different regions in the old generation
    will be maintained in the RSet of the “owning” old generation region.


    In Figure 2.3, we can see one young region (Region x) and two old regions (Region
    y and z). This reference is noted in the RSet for Region x. We also observe that
    Region z has two incoming references, one from Region x and another from Region
    y. The RSet for Region z needs to note only the incoming reference from Region
    y and doesn''t have to remember the reference from Region x, as explained earlier,
    young generation is always collected in its entirety. Finally, for Region y, we
    see an incoming reference from Region x, which is not noted in the RSet for y
    since Region x is a young region.


    As shown in Figure 2.3, there is only one RSet per region. Depending on the application,
    it could be that a particular region (and thus its RS) could be “popular” such
    that there could be many updates in the same region or even to the same location.
    This is not uncommon in Java applications.


    G1 GC has its way of handling such demands of popularity; it is by changing the
    density of RSets. The density of RSets follows three levels of granularity, sparse,
    fine, and coarse. For a popular region, the RSet would probably get coarsened
    to accommodate the pointers from various regions. This will be reflected in the
    RSet scanning times. (Refer Chapter 3 for more details on RSet scanning times.)
    Each of the granular levels has a per-region-table (PRT) abstract housing for
    any particular RSet.


    Since G1 GC regions are internally further divided into chunks, at the G1 GC region
    level the granularity achievable is a 512-byte chunk called a “card” (refer to
    Figure 2.4). A global card table maintains all the cards.'
