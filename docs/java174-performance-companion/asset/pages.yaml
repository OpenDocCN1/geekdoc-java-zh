  md: '# A Mixed Collection Pause


    As more and more objects get promoted into the old regions or when humongous objects
    get allocated into the homogeneous regions the occupancy of the old generation
    and hence the total occupied Java heap increases. In order to avoid running out
    of heap space, the JVM process needs to initiate a garbage collection that not
    only covers the regions in the young generation but also adds some old regions
    to the mix. Refer to the previous section on humongous regions to read about the
    special handling (allocation and reclamation) of humongous objects.


    In order to identify old regions with the most garbage, G1 GC initiates a concurrent
    marking cycle, which helps with marking regions and eventually identifying all
    live objects and also calculating the liveness factor per region. There needs
    to be a delicate balance between the rate of allocations and the triggering of
    this marking cycle such that the JVM process doesn''t run out of Java heap space.
    Hence, an occupancy threshold is set at the start of the JVM process. As of this
    writing and through least JDK 8u45 this threshold is not adaptive and can be set
    by the command-line option -XX: InitiatingHeapOccupancyPercent (which I very fondly
    call IHOP).


    # Tip


    In G1, the IHOP threshold defaults to 45 percent of the total Java heap. It is
    important to note that this heap occupancy percentage applies to the entire java
    heap, unlike the heap occupancy command-line option used with CMS GC where it
    applies only to the old generation. In G1 GC, there is no physically separate
    old generation—there is a single pool of free regions that can be allocated as
    eden, survivor, or humongous. Also, the number of regions that are allocated,
    for say the eden, can vary over time. Hence having an old generation percentage
    didn''t really make sense.


    # Trivia


    I used to write e-mails to G1 GC devs and also to G1 GC users about the marking
    threshold and would always have to refer to it in full as InitiatingHeapOccupancyPercent
    since there is another difference (other than the one mentioned in the preceding
    tip) between CMS and G1''s marking threshold—it''s the option name! CMS''s threshold
    is called CMSInitiatingOccupancyFraction'
