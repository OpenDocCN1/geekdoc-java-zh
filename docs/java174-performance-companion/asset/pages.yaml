    # Concurrent Marking Phase Tunables


    For G1, the tunable -XX:InitiatingHeapOccupancyPercent=n (here n defaults to 45
    percent of the total Java heap size takes into account the old generation occupancy,
    which include old and humongous regions) helps with deciding when to initiate
    the concurrent marking cycle.


    Unlike CMS GC''s initiation of a marking cycle, which is with respect to its old
    generation size, G1''s InitiatingHeapOccupancyPercent is with respect to the entire
    Java heap size.


    The concurrent marking cycle starts with an initial marking pause which happens
    at the same time as (aka, is "piggybacked onto") a young collection. This pause
    marks the beginning of the collection cycle and is followed by other concurrent
    and parallel tasks for root region scanning, concurrent marking and liveness accounting,
    final mark, and cleanup. Figure 3.1 shows all the pauses in a concurrent marking
    cycle: initial mark, remark, and cleanup. To learn more about the concurrent marking
    cycle refer to Chapter 2.


    ```

    277.559: [GC pause (G1 Evacuation Pause) (young) (initial-mark), 0.0960289 secs]

    ```


    The concurrent marking tasks can take a long time if the application''s live object
    graph is large and often interrupted by young collection pauses. The concurrent
    marking cycle must be completed before a mixed collection pause can start and
    is immediately followed by a young collection that calculates the thresholds required
    to trigger the next pause, as shown in Figure 3.1. The figure shows an initial-mark
    pause (which, as mentioned, piggybacks on a young collection). There could be
    more than one young collection when the concurrent phase is under (only one pause
    is shown in the figure). The final mark (also known as remark) completes the marking,
    and a small cleanup pause helps with the cleanup tasks as described in Chapter
    2. There is a young generation evacuation pause right after the cleanup pause
    which helps prepare for the mixed collection cycle. The four pauses after this
    young collection are the mixed collection evacuation pauses that successfully
    collect all the garbage out of the target CSet regions.'
  merge: -1
  img_proc: true
