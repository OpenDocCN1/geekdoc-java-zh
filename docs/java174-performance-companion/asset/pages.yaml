    # Object Aging and the Old Generation


    As covered briefly in the previous section, “A Young Collection Pause,” during
    every young collection, G1 GC maintains the age field per object. The current
    total number of young collections that any particular object survives is the “age”
    of that object. The GC maintains the age information, along with the total size
    of the objects that have been promoted into it, in a table called “age table.”
    Based on the age, the survivor size, the survivor fill capacity (determined by
    the -XX:TargetSurvivorRatio(default = 50)), and the -XX:MaxTenuringThreshold(default
    = 15), the JVM adaptively sets a threshold for all surviving objects. Once the
    objects cross this threshold, they get promoted/tenured into the old generation
    regions. When these tenured objects die in the old generation, their space can
    be freed by a mixed collection, or during clean (but only if the entire region
    is reclaimed), or as a last resort, during a full garbage collection.


