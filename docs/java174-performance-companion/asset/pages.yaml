    When you see these messages in your log, you can try the following to avoid the
    problem:


    +   - It is imperative to set the marking threshold to fit your application''s
    static plus transient data needs. If you set the marking threshold too high, you
    risk running into evacuation failures. If you set the marking threshold too low,
    you may prematurely trigger concurrent cycles and may reclaim to no space during
    your collections. It is generally better to err on the side of starting the marking
    cycle too early rather than too late, the negative consequences of an evacuation
    failure tend to be greater than those of the marking cycle running fully.

    - If you think that the marking threshold is correct, the concurrent cycle is
    still taking too long and your mixed collections end up "losing the race" to reclaim
    regions and triggering evacuation failures, try increasing your total concurrent
    thread count. -XX:ConcGCThreads defaults to one-fourth of -XX:ParallelThreads.
    You can increase the concurrent thread count directly or increase the parallel
    GC thread count, which effectively increases the concurrent thread count.


    > **Tip** Increasing the concurrent thread count will taking time away from mutator
    (java application) threads since the GC threads work at the same time as your
    application threads.


