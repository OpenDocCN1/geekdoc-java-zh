  md: '# The Serviceability Agent Debugging Tools


    Here is how we can attach the ClassDump utility to a running process and dump
    the loaded classes in a folder specified using the -Dsun.jvm.hotspot.tools.jcore.outputDir
    property:


    ```

    java -classpath $JAVA_HOME/lib/sa-jdi.jar

    -Dsun.jvm.hotspot.tools.outputDir=

    classes sun.jvm.hotspot.tools.jcore.ClassDump 2402

    Attaching to PID 2402, please wait...

    Debugger attached successfully.

    Server compiler detected.

    JVM version 24.0-b56

    ```


    As we see, the ClassDump utility has dumped the classes loaded in the classes/
    folder. Similarly, this tool can attach to a remote debug server and dump the
    classes loaded in the target VM.


    # DumpJFR


    DumpJFR is an SA-based tool that can be used to extract Java Flight Recorder (JFR)
    information from the core files and HotSpot processes.


    Java Flight Recorder and Mission Control tools are shipped with the JDK since
    JDK 7u40. As we know, Java Flight Recorder is a tool for collecting diagnostic
    and profiling data about a running Java application. It is integrated into the
    JVM, and its usage causes almost no performance overhead. Java Mission Control
    can be used to analyze the data collected by the Java Flight Recorder.


    DumpJFR provides the capability to extract the JFR data from the core files of
    crashes, or hung JVM processes, which otherwise is not possible to access. This
    tool is shipped with the JDK since JDK 8u60.


    DumpJFR tool sources are under hotspot/src/closed/agent/ in the repository. During
    the build process of HotSpot sources, DumpJFR class files get into sa-jdi.jar
    when the closed part of the HotSpot repository gets built.


    Please note that Java Flight Recorder and Mission Control, and hence this tool,
    require a commercial license for use in production.


    This is how we can attach to DumpJFR and dump the JFR data into a recording file:


    ```

    java -cp $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.tools.DumpJFR <pid>

    ```'
  merge: -1
  img_proc: true
