    +   - There are times when evacuation failures are caused by not having enough
    space in the survivor regions for newly promoted objects. When you observe this
    happening, try increasing -XX:G1ReservePercent. The reserve percent creates a
    false ceiling for the reserved space to accommodate any variation in promotion
    patterns. The default value is 10 percent of the total Java heap and is limited
    by G1 to 50 percent of the total Java heap since more would amount to a very large
    amount of wasted space.


    # Reference Processing


    Garbage collection must treat Java reference objects—phantom references, soft
    references, and weak references—differently from other Java objects. Reference
    objects require more work to collect than non-reference objects.


    In this section, you will learn how to identify if the time required for reference
    processing during a G1 garbage collection pause is an issue for your application
    and how to tune G1 to reduce this overhead, with tips for isolating which reference
    object type is inducing the overhead. Depending on the application and time requirements,
    refactoring the application’s source code may be required to reduce reference
    processing overhead.


    > Java Platform, Standard Edition (Java SE) API documentation for each of the
    reference object types (http://docs.oracle.com/java/8/docs/api) and the java.lang.ref
    package APIs for phantom reference, soft reference, and weak reference are good
    sources for understanding how each reference object type behaves and how and when
    they are garbage collected.


    # Observing Reference Processing


    There are several major activities associated with garbage collecting reference
    objects: discovering the reference objects, pushing them onto the JVM’s reference
    queue, and processing them. When using G1 with -XX:+PrintGCDetails, the time spent
    queuing reference objects is reported'
