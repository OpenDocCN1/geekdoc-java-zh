  md: '# System Properties for the Serviceability Agent


    There are some system properties that can be used to define the runtime behavior
    of the SA tools. These are shown in Table 4.2.


    Table 4.2 Serviceability Agent System Properties


    | System Property | Remarks | Applicable Platforms |

    | --- | --- | --- |

    | sun.jvm.runtime.disableVersionCheck | Disable the version check of the SA tools
    against the HotSpot version being analyzed. | All |

    | sun.jvm.hotspot.debugger.useProcDebugger (Applicable only in JDK 6 and its updates)
    | Tell SA to use the /proc interface for reading bits from core/process. The other
    interface uses dbx as back end to attach to process/core and read data. This property
    is applicable only to SA in JDK 6 and is not present in JDK 7. | Solaris |

    | sun.jvm.hotspot.debugger.useWindDebugger (Applicable only in JDK 6 and its updates)
    | Tell SA to use the Windows Debugger Engine (dbg.dll) interface for reading bits
    from processes and crash dumps. The interface works only for live processes and
    talks to the Windows Debugger Server (FwDbgSvr) over a socket to implement attach/detach
    and read bits from process memory. This property is applicable only to SA in JDK
    6 and is not present in JDK 7. WinDbg is the default native interface in JDK 7.
    | Windows |

    | sun.jvm.hotspot.debugger.imagePath | Set the path where SA on Windows should
    look for .exe and .dll files. | Windows |

    | sun.jvm.hotspot.debugger.windbg.symbolPath | Set the path where SA on Windows
    should look for .pdb and .dbg symbol files. | Windows |

    | sun.jvm.hotspot.debugger.windbg.disableNativeLookup | Specify if SA on Windows
    should parse the DLL symbol table in the Java code or use WinDbg''s lookup facility.
    By default, SA uses native lookup so that it can take advantage of .pdb files,
    if available. | Windows |


    Continued'
