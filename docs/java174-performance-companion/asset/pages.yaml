- pgno: 129
  md: '# JDI Implementation


    The SA binary sa-jdi.jar also has an implementation of the Java Debug Interface
    (JDI) that makes it possible for any JDI client (e.g., JDB) to attach to the core
    files and also Java processes using the JDI Connectors provided by this implementation.


    The VM object returned by the attach() method of these connectors is read-only.
    This means that the VM object cannot be modified. So, JDI clients using these
    connectors should not call any JDI methods that are defined to throw a VMCannotBeModifiedException.


    # SA Core Attaching Connector


    This connector can be used by a debugger application to debug a core file. It
    allows multiple debugging sessions on the same core file. It is uniquely identified
    by the name sum.jvm.hotspot.jdi.SACoreAttachingConnector and can be used as in
    the following:


    ```

    $JAVA_HOME/bin/jdb

    -JXbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar

    -connect sum.jvm.hotspot.jdi.SACoreAttachingConnector:core=

    ($CORE_FILE),javaExecutable=$EXEC_FILE

    ```


    # SAPID Attaching Connector


    This connector can be used by a debugger application to debug a process. The process
    to be debug need not have been started in the debug mode (i.e., with -agentlib:jdw
    -Xrunjdw), and it is permissible for the process to be hung. Using this connector,
    the debugger gets a read-only view of the process, and the VM object obtained
    after attaching to the process cannot be modified.


    The process is suspended when this connector attaches and is resumed when the
    connector detaches. More than one SAPID Attaching Connector cannot attach to a
    single process simultaneously. This connector is uniquely identified by the name
    sum.jvm.hotspot.jdi.SAPIDAttachingConnector.


    Debuggers can use this connector as in the following to connect and debug a process:


    ```

    $JAVA_HOME/bin/jdb

    -JXbootclasspath/a:$JAVA_HOME/lib/sa-jdi.jar:$JAVA_HOME/lib/tools.jar

    -connect sum.jvm.hotspot.jdi.SAPIDAttachingConnector:pid=2402

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# SA Debug Server Attaching Connector


    This connector can be used by a debugger application to debug a process or core
    file on a machine other than the machine where the debugger is running. This connector
    uses Remote Method Invocation (RMI) to communicate with a debug server running
    on the remote machine. Before the attach ( ) method on this connector is called,
    the debug server must be started on the remote machine and tell what process or
    core file is to be debugged. The following needs to be done on the remote machine:


    +   Start the RMI registry with sa-jdi.jar in the classpath


    ```

    ${JAVA_HOME}/bin/rmiregistry

    -Xbootclasspath:${JAVA_HOME}/lib/sa-jdi.jar

    ```


    This command creates and starts a remote object registry. An optional port number
    may be specified as the port number at which the registry should be started. If
    no optional port number is specified, the registry is started on port 1099.


    +   Start the debug server on the remote machine, specifying the process or core
    file to be debugged:


    ```

    ${{JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar

    sun.jvm.hotspot.jdi.SDebugServer <pid> [uniqueID]

    ```


    or


    ```

    ${{JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar

    sun.jvm.hotspot.jdi.SDebugServer

    <pathname to the java executable that produced the core file>

    <pathname of the core file to debug> [uniqueID]

    ```


    SA Debug Server starts the RMI registry at port 1099 if the registry is not already
    running.

    An alternative to these two steps is to use the jsadebug utility that is shipped
    with the JDK to start the RMI registry and the debug server on the remote machine.
    uniqueID is an optional string. More than one debug server is to run at the same
    time on the same machine, each must have a different uniqueID string.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "# Extending Serviceability Agent Tools\n\nThe Serviceability Agent APIs provide\
    \ a class sun.jvm.hotspot.tools.Tool which can be extended to write our own troubleshooting\
    \ tools.\n\nHere is a simple tool extending the sun.jvm.hotspot.tools.Tool class\
    \ that prints the system properties of the target VM. This tool is part of the\
    \ sa-jdi.jar file:\n\n```\npackage sun.jvm.hotspot.tools;\n\nimport java.io.PrintStream;\n\
    import java.util.*;\nimport sun.jvm.hotspot.runtime.*;\n\npublic class SysPropsDumper\
    \ extends Tool {\n\n    public void run() {\n        Properties sysProps = VM.get().SystemProperties();\n\
    \        PrintStream out = System.out;\n        if (sysProps == null) {\n    \
    \        Enumeration keys = sysProps.keys();\n            while (keys.hasMoreElements())\
    \ {\n                Object key = keys.nextElement();\n                out.print(key\
    \ + \" = \");\n                out.println(sysProps.get(key));\n            }\n\
    \        } else {\n            out.println(\"System Properties not available!\"\
    );\n        }\n    }\n\n    public static void main(String[] args) {\n       \
    \ SysPropsDumper pd = new SysPropsDumper();\n        pd.start(args);\n       \
    \ pd.stop();\n    }\n}\n```\n\nTo write our own tool, we need to extend it from\
    \ the Tool class and implement the run() method where we add the main functionality\
    \ of the tool. In the preceding example, using the VM class we obtain the system\
    \ properties and then print those properties to the standard output.\n\nLet's\
    \ compile and run this tool against a running process and see what the output\
    \ looks like:\n\n```\nD:\\>javac -classpath %JAVA_HOME%\\lib\\sa-jdi.jar\nsun/jvm/hotspot/tools/SysPropsDumper.java\n\
    D:\\>java -classpath %JAVA_HOME%\\lib\\sa-jdi.jar\n```"
  merge: -1
  img_proc: true
