  md: '# Chapter 1 Garbage First Overview


    application threads. To achieve this, the CMS old generation collector does most
    of its work concurrently with application execution, except for a few relatively
    short GC synchronization pauses. CMS is often referred to as mostly concurrent,
    since there are phases of old generation collection that pause application threads.
    Examples are the initial-mark and remark phases. In CMS''s initial implementation,
    both the initial-mark and remark phases were single-threaded, but they have since
    been enhanced to be multithreaded. HotSpot command-line options to support multithreaded
    initial-mark and remark phases are -XX:+CMSParallelInitialMarkEnabled and -XX:+CMSParallelRemarkEnabled.
    These are automatically enabled by default when CMS is enabled by the -XX:+UseConcurrentSweepGC
    command-line option.


    It is possible, quite likely, for a young generation collection to occur while
    an old generation collection is taking place. When this happens, the old generation
    collection is interrupted by the young generation collection and immediately resumes
    upon the latter''s completion. The default young generation collector for CMS
    GC is commonly referred to as ParNew.


    Figure 1.3 shows how Java application threads (gray arrows) are stopped by the
    young GC (black arrows) and the CMS initial-mark and remark phases, and old generation
    GC stop-the-world phases (also black arrows). An old generation collection in
    CMS begins with a stop-the-world initial-mark phase. Once initial mark completes,
    the concurrent marking phase begins where the Java application threads are allowed
    to execute concurrently with the CMS marking threads. In Figure 1.3, the concurrent
    marking threads are the two longer black arrows, one on top of the other below
    the "Marking/Pre-cleaning" label. Once concurrent marking completes, concurrent
    pre-cleaning is executed by the CMS threads, as shown by the two shorter arrows
    under the "Marking/Pre-cleaning" label. Note that if there are enough available
    hardware threads, CMS thread overhead will not have effect on the performance
    of Java application threads. If, however, the hardware threads are saturated or
    highly utilized, CMS will compete for CPU cycles with Java application threads.
    Once concurrent pre-cleaning completes, the stop-the-world phase begins. The remark
    phase marks objects that have been missed after the initial mark and concurrent
    marking and concurrent pre-cleaning execute. After the remark phase completes,
    concurrent sweeping begins, which frees all dead object space.


    One of the challenges with CMS GC is tuning to ensure that the concurrent work
    can complete before the application runs out of available Java heap space. Hence,
    one tricky part about CMS is to find the right time to start the concurrent work.
    A common consequence of the concurrent approach is that CMS normally requires
    on the order of 10 to 20 percent more Java heap space than Parallel GC to handle
    the same application. That is part of the price paid for shorter GC pauses.'
