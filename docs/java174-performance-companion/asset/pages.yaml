    # Reference Processing Tuning


    The first thing to do is enable multithreaded reference processing using -XX:+ParallelRefProcEnabled,
    because HotSpot defaults to single-threaded reference processing. This default
    exists to minimize memory footprint and make CPU cycles available to other applications.
    Enabling this option will burn more CPU during reference processing, but if the
    elapsed, or wall clock, time to complete reference processing will go down.


    If reference processing time remains larger than 10 percent of young or mixed
    GC times after adding -XX:+ParallelRefProcEnabled, or G1''s remark phase is spending
    too much time in reference processing, the next step is to determine which reference
