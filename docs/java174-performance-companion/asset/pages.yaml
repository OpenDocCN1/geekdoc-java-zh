  md: 'Thus the number of mixed collections per mixed collection cycle can be controlled
    by the minimum generation CSet per mixed collection pause count and the heap percentage.


    # Collection Sets and Their Importance


    During any garbage collection pause all the regions in the CSet are freed. A CSet
    is a set of regions that are targeted for reclamation during a garbage collection
    pause. All live objects in these candidate regions will be evacuated during a
    collection, and the regions will be returned to a list of free regions. During
    a collection, the CSet can contain only young regions for collection. A mixed
    collection, on the other hand, will not add all the young regions but also some
    old candidate regions (based on their GC efficiency) to its CSet.


    +   There are two important parameters that help with the selection of candidate
    old regions for the mixed collection: -XX:G1MixedGCLiveThreshold - XX:G1CSetRegionThreshold

    - XX:G1MixedGCLiveThreshold, which defaults to 85 percent (JDK 8u5) of a G1 GC
    region, is a liveness threshold and a set limit to exclude the most expensive
    of old regions from the CSet of mixed collections. G1 GC sets a limit such that
    any old region that falls below this liveness threshold is included in the CSet

    - XX:G1CSetRegionThreshold, which defaults to 10 percent (JDK 8u5) of the total
    Java heap, sets the maximum limit on the number of old regions that can be collected
    per mixed collection pause. The threshold is dependent on the total Java heap
    available to the JVM process and is expressed as a percentage of the total Java
    heap. Chapter 3 covers a few examples to highlight the functioning of these thresholds.


    # Remembered Sets and Their Importance


    A generational collector segregates different areas in the heap according to the
    age of those objects. These different areas in the heap are referred to as generations.
    The generational collector can then concentrate most of its collection effort
    on the most recently allocated objects because it expects to find most of them
    sooner rather than later. These generations in the heap can be collected independently.
    The independent collection helps lower the response times since the GC doesn''t
    have to scan the entire heap (e.g., in the case of copying generational collectors)
    older long-lived objects don''t have to be copied back and forth, thus reducing
    the copying and reference updating overhead.'
