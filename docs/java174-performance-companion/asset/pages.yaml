    The following pseudo-code illustrates G1 GC''s write barrier:


    ```

    (&object.field XOR &some_other_object) >> RegionSize

    ```


    Anytime a cross-region update happens, G1 GC will enqueue the corresponding card
    in a buffer called the "update log buffer" or "dirty card queue". In our update
    example, the card containing object is logged in the update log buffer.


    > Tip

    The concurrent refinements are threads dedicated to the sole purpose of maintaining
    the remembered sets by scanning the logged cards in the filled log buffers and
    updating the remembered set for those regions. The maximum number of refinement
    threads is determined by -XX:G1ConcRefinementThreads. As of JDK 8u45, -XX:G1ConcRefinementThreads
    is not set on the command line, it is ergonomically set to be the same as -XX:ParallelGCThreads.


    Once the log buffer reaches its capacity, it is retired and a new log buffer is
    allocated. The card enqueuing then hits this new buffer. The retired buffer is
    placed in a global list. Once the refinement finds entries in the global list,
    they start concurrently processing the retired buffers. The refinement threads
    are always active, initially only a few of them are available. G1 GC handles the
    deployment of the concurrent refinement threads in a tiered fashion, adding threads
    to keep up with the number of filled log buffers. Activation thresholds are set
    by the following flags: -XX:G1RefinementGreenZone, -XX:G1ConcRefinementYellowZone,
    and -XX:G1ConcRefinementRedZone. If the concurrent refinement threads can''t keep
    up with the number of filled buffers, mutator threads are enlisted for help. At
    such a time, the mutator threads will stop their work and help the concurrent
    refinement threads to finish processing the filled log buffers. Mutator threads
    in GC terminology are the Java application threads. Hence, when the concurrent
    refinement threads can''t keep up with the number of filled buffers, the Java
    application will be halted until the filled log buffers are processed. Thus, measures
    should be taken to avoid such a scenario.'
