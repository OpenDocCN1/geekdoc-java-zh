    # Serviceability Agent Plugin for VisualVM


    Before we delve into the details on the Serviceability Agent Plugin for Java Virtual
    Machine (VisualVM), let''s talk briefly about VisualVM.


    VisualVM is a tool for troubleshooting, monitoring, and observing Java applications.
    It is positioned as an all-in-one monitoring and troubleshooting tool for Java
    applications. Many of the standalone tools equipped with the JDK such as jstack,
    jmap, and so on are also available in VisualVM. Starting with JDK 6u7, VisualVM
    is also shipped with the JDK and can be launched with the command jvisualvm. Figure
    4.36 shows an example of what VisualVM looks like when it has been launched.


    One great thing about VisualVM is that it is possible to extend it using plugins.
    One can write plugins for VisualVM using its APIs and develop plugins for others
    to use. These plugins can then be made available in the VisualVM Plugins Center.


    Serviceability Agent Plugin for VisualVM is a VisualVM plugin that brings key
    features of SA to SAVM. This plugin provides the ability to look at the VM representation
    of Java objects in the heap, Java threads in the application, and compiled/interpreted
    code of methods and to find references for a given address in the Java heap, all
    from within the VisualVM GUI.'
