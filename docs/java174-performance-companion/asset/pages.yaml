- pgno: 31
  md: '# Garbage First Garbage Collector in Depth


    This chapter aims at providing in-depth knowledge on the principles supporting
    HotSpot''s latest garbage collector: the Garbage First garbage collector (referred
    to as G1 GC for short). These principles were highlighted in Chapter 1


    # Background


    G1 GC is the latest addition to the Java HotSpot Virtual Machine. It is a compact
    collector based on the principle of collecting the most garbage first, hence the
    name “Garbage First” GC. G1 GC has incremental, parallel, stop-the-world pauses
    that'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'achieve compaction via copying and also has parallel, multistaged concurrent
    marking that helps in reducing the mark, remark, cleanup pauses to a bare minimum.


    With the introduction of G1 GC, HotSpot JVM moved from the conventional layout
    where generations are continuous to generations that are now composed of noncontiguous
    heap regions. Thus, for an active Java heap, a particular region could be a part
    of either eden or survivor or old generation, or it could be a humongous region
    or even just a free region. Multiples of these regions form a “logical” generation
    to match conventional wisdom formed by previous HotSpot garbage collectors’ generational
    spaces.


    # Garbage Collection in G1


    G1 GC reclaims most of its heap regions during collection pauses. The only exception
    to this is the cleanup stage of the multistaged concurrent marking cycle. During
    the cleanup stage, if G1 GC encounters purely garbage-filled regions, it can immediately
    reclaim those regions and return them to a list of free regions; thus, freeing
    those regions does not have to wait for the next garbage collection pause.


    G1 GC has three main types of collection cycles: a young collection cycle, a multistage
    concurrent marking cycle, and a mixed collection cycle. There is also a single-threaded
    (as of this writing) fallback pause called a “full” garbage collection pause,
    which is the fail-safe mechanism for G1 GC in case the GC experiences evacuation
    failures.


    An evacuation failure is also known as a promotion failure or to-space exhaustion
    or to-overflow. The usually happens when there is no free space to promote objects.
    When faced with such a scenario, all Java HotSpot VCs try to expand their heaps.
    But if the heap is already at its maximum, the GC tries to tenure the regions
    where objects were successfully copied and update their references. For G1 GC,
    the objects that could not be copied in place. All GCs will then have their references
    self-forwarded. These self-forwarded references are removed at the end of the
    garbage collection cycle.


    During a young collection, G1 GC pauses the application threads to move objects
    from the young regions into survivor regions or promote them into old regions
    or both. For a mixed collection, G1 GC additionally moves live objects from the
    most (for lack of a better term) “efficient” old regions into free region(s),
    which become part of the old generation.'
