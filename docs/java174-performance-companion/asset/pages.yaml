- pgno: 87
  md: '# SA Version Matching


    Note that VMStructs is declared as a friend class. Most of the classes in HotSpot
    declare VMStructs to be a friend so that the private fields of that class can
    be accessed in VMStructs.


    During the HotSpot build, VMStructs is compiled into vmStructs.o, which is included
    in the shared libjvm.so or jvm.dll. VMStructs contains all the data that the SA
    needs to read the HotSpot data internal representations. At runtime, the SA can
    read this data from the target VM.


    The structure and field names declared in VMStructs.cpp are used by the corresponding
    Java code in the SA. Thus, if a field name in VMStructs.cpp is deleted or renamed,
    the corresponding Java code that accesses that field also needs to be modified.
    If declarations in VMStructs and the Java code in SA are not in sync, SA will
    fail when it tries to examine a process/core file.


    # SA Version Matching


    As we saw in the previous section, the Java code in SA is a mirror of the C++
    code in HotSpot. If some data structures or algorithms are changed, added, or
    removed in HotSpot, the same changes have to be made in the SA Java code. Due
    to this tight coupling between the SA Java code and the HotSpot implementation,
    an SA instance can reliably debug only the VM that was built from the same repository
    as that of the SA instance. In order to detect the version mismatch between the
    SA and the HotSpot, we place a file name sa.properties into sa-jdi.jar during
    the HotSpot build process. This file contains an SA version property, for example:


    ```

    sun.jvm.hotspot.runtime.VM.saBuildVersion=24.0-b56

    ```


    At runtime, SA reads this property, compares it with the version of the target
    HotSpot VM being analyzed, and throws a VersionMismatchException if the versions
    do not match. This check can be disabled by running the SA tools with the following
    system property:


    ```

    -Dsun.jvm.hotspot.runtime.VM.disableVersionCheck

    ```


    With this option, SA does not complain if its version does not match the version
    of the target VM and attempts to attach to it. This option is useful if you want
    to attach the SA to a non-matching version of the target HotSpot VM.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# The Serviceability Agent debugging Debugging Tools


    There are two main SA Debugger tools that are implemented using the Serviceability
    Agent APIs: HotSpot Debugger (HSDB) and Command-Line HotSpot Debugger (CLHSDB).
    HSDB is the top-level GUI program offering many visual utilities that help in
    debugging the HotSpot VM. CLHSDB is the command-line variant of HSDB. When debugging
    remote core dumps, it is much easier to work with the command-line HSDB than with
    the GUI HSDB tool.


    # HSDB


    HotSpot Debugger is the main GUI tool. It facilitates examining a Java process,
    core file, and also a remote Java process. Let''s see how we can launch and use
    it on a Windows machine.


    First, let''s set the JAVA_HOME environment variable to the folder the JDK that
    we want to use is installed so that we can use this variable wherever we need
    to access files/folders in that JDK:


    ```

    set JAVA_HOME=d:\Java\tu40

    ```


    On Windows, the PATH environment variable should contain the location of the JVM
    binary used by the process/core and also the folder where Microsoft Debugging
    Tools for Windows is installed on the machine, for example:


    ```

    set PATH=%JAVA_HOME%\bin;server:d:\windbg;PATH%

    ```


    Now we can launch HSDB using the following command:


    ```

    %JAVA_HOME%\bin\java -classpath%JAVA_HOME%\lib\sa-jdi.jar

    sun.jvm.hotspot.HSDB

    ```


    On Solaris and Linux, we just need to set JAVA_HOME to point to the installed
    JDK and then launch the tool in the following:


    ```

    JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.

    HSDB

    ```


    These launch commands bring up the HSDB GUI tool as shown in Figure 4.1.'
