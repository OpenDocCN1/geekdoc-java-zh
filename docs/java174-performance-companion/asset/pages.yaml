    > Tip

    During a mixed collection pause, Code Root Fixup will include the time spent in
    updating non-evacuated regions.


    # Other Serial Activities


    The final part of the sequential phase is tagged Other. The bigger contributors
    to Other involving the CSet for the collection, reference processing and enqueuing,
    card redirtying, reclaiming free humongous regions, and freeing the CSet after
    the collection. These major contributors are shown PrintGCDDetails output:


    ```

    [Other: 2.0 ms]

    [Choose CSet: 0.0 ms]

    [Ref Proc: 0.1 ms]

    [Ref Enq: 0.0 ms]

    [Redirty Cards: 0.2 ms]

    [Humongous Reclaim: 0.0 ms]

    [Free CSet: 1.2 ms]

    ```


    > Tip

    For a young collection all the young regions are collected, hence there is no
    “choosing” as since all the young regions automatically become a part of the young
    CSet. The “choosing” occurs for a mixed collection pause and becomes an important
    factor in understanding how to “tame” your mixed collections. We will discuss
    choosing the CSet in detail later in this chapter.


    Reference processing and enqueuing are for soft, weak, phantom, and JNI references.
    We discuss this and more in the section titled “Reference Processing Tuning.\nThe
    act of reference enqueuing may require updating the RSets. Hence, the updates
    need to be logged and their associated cards need to be marked as dirty.'
