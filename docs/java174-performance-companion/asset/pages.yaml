    Debugger attached successfully.

    Client compiler detected.

    JVM version is 24.0-JSDB

    jsdb>

    ```


    More details on this can be found in the open-source HotSpot repository in the
    file hotspot/agent/doc/jsdb.html.


    # Core Dump or Crash Dump Files


    We have been talking about the core files on Unix systems and the crash dump files
    on Windows systems. Here is a quick briefing on what these dump files are.


    A core or crash dump file is a binary file that consists of the state of the running
    program at a specific time. A core file is generally created when a program terminates
    unexpectedly, due to a violation of the operating system''s or hardware''s protection
    mechanisms. The operating system kills the program and creates a core file that
    programmers can later use to figure out what went wrong. It contains a detailed
    description of the state that the program was when it died.


    It is also possible to create a core/crash dump file at will from a running (non-crashing)
    program. On Solaris/Linux, there is a tool called gcore that can dump the state
    of a running or hung process into a file. On Windows, WinDbg, userdump, or ADPlus
    to collect the crash dump files.


    Core dump files are very useful for diagnosing and debugging problems in Java
    programs whenever it is difficult to debug the live processes.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Debugging Transported Core Files


    Sometimes a core file is created on one system (core host) and we need to debug
    it on some other system (debugger host). Native debuggers (dbx, gdb) as well as
    the SA are not always able to open the transported core files successfully, the
    reason being a mismatch in the kernel and shared libraries from the system where
    the core was produced and the one where we are trying to debug it. Debuggers may
    face problems due to the mismatch of the following two types of libraries:


    +   * The shared libraries used by the program on the core host may not be the
    same as those on the debugger host. So we need to make the original libraries
    from the core host available on the debugger system.

    * Debuggers use the system libraries (e.g., libraries in /usr/lib,/lib64, etc.)
    to understand the implementation details of the runtime linker and the threads
    library on the system. To load the core files successfully we also need to get
    the system libraries from the core host and make them available on the debugger
    host.


    If the core file was produced with a crash and a crash hs_err file was also generated,
    we can get the list of the shared libraries (system and program) loaded by the
    process from the hs_err log file.


    # Shared Library Problems with the SA


    When using SA with transported core files, we may get fighters related to rtld_db
    or libthread_db mismatch, or SA may throw errors that HotSpot symbol is missing
    in the target process. For example, in the following we are trying to open a core
    file on a Linux/x64 machine transported from another Linux/x64 system:


    ```

    bash-$3.2 $JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-di.jar

    sun.jvm.hotspot.CLHSDB $JAVA_HOME/bin/java/core.16963

    Opening core file, please wait...

    Unable to open core file

    core.16963:

    Doesn''t appear to be a HotSpot VM (could not find symbol "gHotSpotVMTypes"

    in remote process)

    sun.jvm.hotspot.Debugger.DebuggerException: Doesn''t appear to be a HotSpot

    VM (could not find symbol "gHotSpotVMTypes in remote process)

    at sun.jvm.hotspot.HotSpotAgent.setupVM(HotSpotAgent.java:405)

    at sun.jvm.hotspot.HotSpotAgent.go(HotSpotAgent.java:314)

    at sun.jvm.hotspot.HotSpotAgent.attach(HotSpotAgent.java:173)

    at sun.jvm.hotspot.CLHSDB.attachDebugger(CLHSDB.java:188)

    at sun.jvm.hotspot.CLHSDB.run(CLHSDB.java:55)

    at sun.jvm.hotspot.CLHSDB.main(CLHSDB.java:35)

    hsdb> Input stream closed.

    ```


    SA is not able to open this transported core file.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# Eliminate Shared Library Problems\n\nSo, how do we fix shared library problems\
    \ encountered when transported core files with the SA? Here is what we can do\
    \ to eliminate these problems:\n\n+   1. Copy all the libraries used by the program\
    \ from the core host to the debugger host, say, to a /space/corelibs/. Note that\
    \ the libraries can be copied either directly under /space/corelibs/ or to a full\
    \ directory path under /space/corelibs/. For example, /local/java/jre/bin/bin/server/libjvm.\
    \ So from the core host it can be copied directly under /space/corelibs/ and under\
    \ /space/corelibs/local/java/jre/bin/lib/server/. Similarly, /usr/lib/libthread.db\
    \ so from the core host can be copied either to /space/corelibs/ or to /space/corelibs/usr/lib/\
    \ on the debugger host.\n The list of required library files can be obtained from\
    \ the hs_err log file under the section \"Dynamic Libraries\" or by using the\
    \ native debuggers as gdb, dbx, and WinDlg.\n2. Then set the SA environment variable\
    \ SA_ALTROOT to the folder containing the shared libraries on the debugger host,\
    \ setenv SA_ALTROOT=/space/corelibs/.\n\nNow, for the core file.16963 we tried\
    \ to open in the previous section, copied all the required libraries from the\
    \ core host to the system where we want to open the core with SA and then set\
    \ the environment variable SA_ALTROOT:\n\n```\nbash-3.2$ export SA_ALTROOT=/space/corelibs/\n\
    bash-3.2$ JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar\nsun.jvm.hotspot.CLHSDB\
    \ $JAVA_HOME/bin/java.core.16963\nOpening core file, please wait...\nhsdb\nuniverse\n\
    Heap Parameters:\nParallel10aveHeap [ PSYoungGen [ eden =\n[0000000000ea0000,0000000000ea0000,00000000faa80000],],\
    \ from =\n[00000000faa80000,00000000fb64975], to =\n[00000000fd540000,00000000fd540000,0000000010000000]\
    \ ]] PS1OlddGen [\n[00000000fe6a0000,00000000be12010,00000000\n00deea00000]] ]]PSermGen\
    \ [\n[00000000bac00000,00000000bc0942c0,00000000bc200000] ]] ]\nhsdb\n```\n\n\
    With SA_ALTROOT, SA picks up the required libraries from /space/corelibs/ and\
    \ thus can open the core file successfully."
  merge: -1
  img_proc: true
