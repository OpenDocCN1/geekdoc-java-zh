- pgno: 33
  md: 'The Young Generation


    # Tip


    “GC efficiency” actually refers to the ratio of the space to be reclaimed versus
    the estimated GC cost to collect the region. Due to the lack of a better term,
    in this book we refer to the sorting of the heap regions in order to identify
    candidate regions as calculating the “GC efficiency.” The reason for using the
    same terminology is that GC evaluates the benefit of collecting a region with
    respect to the cost of collecting it. And the “efficiency” that we are referring
    to is solely dependent on liveness accounting and hence is just the cost of collecting
    a region. For example, an old region whose collection is less time-consuming than
    other more expensive old regions is considered to be an “efficient” region. The
    most efficient regions would be the first ones in the sorted array of regions.


    At the end of a collection cycle, the regions that were a part of the collection
    set CSet (refer to the section “Collection Sets and Their Importance” later in
    this chapter for more information) are guaranteed to be free and returned to the
    free list. Let’s talk about these concepts in more detail.


    # The Young Generation


    G1 GC is a generational GC comprising the young generation and the old generation.
    Most allocations, with a few exceptions such as objects too large to fit in the
    allocating thread’s allocation buffer (also known as TLAB) but smaller than what
    would be considered “humongous”, and of course the “humongous” objects themselves
    (see the section “Humongous Regions” for more information), by any particular
    thread will land in thread’s TLAB. A TLAB enables faster allocations since the
    owning thread is able to allocate in a lock-free manner. These TLABs are from
    G1 regions that become a part of the young generation. Unless explicitly specified
    on the command line, the current generation size is calculated based on the initial
    and maximum generation size bounds (as of JDK 8u45 the defaults are 5 percent
    of the total Java heap for initial generation size (-XX:G1NewSizePercent) and
    60 percent of the total Java heap for maximum generation size (-XX:G1MaxSizePolicy)
    and the pause time goal of (-XX:MaxGCPauseMillis).


    # Tip


    G1 GC will select the default of 200ms if -XX:MaxGCPauseMillis is not set on the
    command line. If the user sets -Xmn or related young generation sizing G1 GC may
    not be able to adjust the young generation size based on the pause time goal,
    and the pause time target could become a moot option.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Based on the Java application''s object allocation rate, new regions are added
    to the young generation as needed until the desired generation size is met. The
    heap region size is determined at the launch of the JVM. The heap region size
    has to be a power of 2 and can range anywhere from 1MB to 32MB. The JVM shoots
    for approximately 2048 regions and sets the heap region size accordingly (Heap
    region size = Heap size/2048). The heap region size is aligned and adjusted to
    fail within the 1MB to 32MB and power of 2 bounds. The adaptive selection of heap
    region can be overwritten on the command line by setting it with -XX:GHeapRegionSize=n.
    Chapter 3, "Garbage First Garbage Collector Performance Tuning," includes more
    information on when to override the JVM’s adaptive sizing.


    # A Young Collection Pause


    The young generation consists of G1 GC regions designated as eden regions and
    G1 GC regions designated as survivor regions. A young collection is triggered
    when the JVM fails to allocate out of the eden region, that is, the eden is completely
    filled. The GC then steps in to free space. The first young collection will move
    all the objects from the eden regions into the survivor regions. This is known
    as "copy to survivor." From on, any young collection will promote the objects
    from the entire young generation (i.e., eden and survivor regions) into new regions
    that are now the survivor regions. The young collections will also occasionally
    promote a few objects into the old generation when they survive a predetermined
    promotion threshold. This is called "aging" the live objects. The promotion of
    the live objects from the young generation to the old generation is called "tenuring"
    the objects, and consequently the age threshold is called the "tenuring threshold."
    Promotion of objects into the survivor regions or into the old generation happens
    in the promoting GC thread''s local allocation buffer (also known as Promotion
    Lab, or PLAB for short). There is a per-GC-thread PLAB for the survivor regions
    and for the old generation.


