- pgno: 108
  md: '# Find Pointer


    This tool can help find where a particular address lies in the Java process address
    space. This is particularly useful when we are dealing with JVM crashes and to
    know the details of the memory address being accessed when the JVM crashed. For
    instance, where in the JVM does the address reside? Is the address at a location
    in the Java heap, in the eden space, in the old generation space? Figure 4.25
    shows an example of an address that has been entered and the resulting information
    about the address that is displayed.


    # Find Address in Heap


    This tool reports all the locations where a particular value is located in the
    Java heap. This is very useful when we want to find all the addresses from where
    an object is referenced in the Java heap.

    This utility greatly helps in nailing garbage-collector-related issues, such as
    in the case of a GC crash where an object was collected prematurely and the JVM
    crashes while accessing the memory location of that object. By transitivity tracking
    the references pointing to that object, we can get clues to why the object did
    not get marked as live by the garbage collector and was collected prematurely.


    # Find Value in Code Cache


    This tool shows all the locations from where a given address is being accessed
    in the cache of compiled methods. This helps in troubleshooting just-in-time (JIT)
    compiler-related problems. An example is shown in Figure 4.27.


    ![](img/0889c737c4674ce01ea95712362abd45_108_0.png)'
  merge: -1
  img_proc: true
