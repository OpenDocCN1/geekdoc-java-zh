    # Chapter 1 ■ Garbage First Overview


    ![](img/0889c737c4674ce01ea95712362abd45_20_0.png)


    **Figure 1.1** Ja application threads are interrupted by GC threads when Parallel
    GC is used


    Parallel GC works well for applications that meet these requirements. For applications
    that do not meet these requirements, pause times can become excessively long,
    since a full GC must mark through the entire Java heap and also compact the old
    generation space. As a result, pause times tend to increase with increased Java
    heap sizes.


    Figure 1.1 illustrates how the Java application threads (gray arrows) are stopped
    and the GC threads (black arrows) take over to do the garbage collection work.
    In this diagram there are eight GC threads and eight Java application threads,
    although in most applications the number of application threads usually exceeds
    the number of GC threads, especially in cases where some application threads may
    be idle. When a GC occurs, all application threads are stopped, and multiple GC
    threads execute.


    # Serial GC


    Serial GC is very similar to Parallel GC except that it does all its work in a
    single thread. The single-threaded approach allows for a less complex GC implementation
    and requires few few runtime data structures. The memory footprint is lowest of
    all HotSpot collectors. The challenges with Serial GC are similar to those for
    Parallel GC. Pause times can be long, and they grow more or less linearly with
    the heap size and amount of live data. In addition, with Serial GC the long pauses
    are more pronounced, since the GC work is done in a single thread.'
