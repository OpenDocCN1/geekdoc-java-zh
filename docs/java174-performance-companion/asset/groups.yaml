    # G1 GC 中的并发标记


    随着 G1 GC 区域和每个区域的存活度计数的引入，很显然需要一种一种量且完全的并发标记算法。Taiichi Yuasa 提出了一种用于增量标记和清除的 G1
    GC 算法，他在其中使用了“初始时快照”（SATB）标记算法[5]。Yuasa 在标记-清除 GC 的并发标记阶段使用了 SATB 标记优化。SATB 标记算法非常适合
    G1 的区域化堆结构，并解决了 HotSpot JVM GC 的一个主要关注问题——潜在的长停顿。


    G1 GC 建立了一个标记阈值，它是总 Java 堆的百分比，默认值为 45%。可以通过命令行选项 -XX:InitiatingHeapOccupancyPercent
    (IHOP) 进行设置，当超过该值时，将启动并发标记周期。标记任务被分分成多个块，大部分工作在变器线程活跃时并发完成。目标是在 Java 堆达到满容量之前对其进行标记。


    SATB 算法简单地创建一个对象图，作为堆的逻辑“快照”。


    （注：此处之后为后续章节翻译）


    # 并发标记的阶段


    标记任务块大部分是并发执行的。少数任务在短暂的停止世界停顿期间完成。现在让我们谈谈这些任务的重要性。


    # 初始标记


    在初始标记期间，变器线程被停止，以便标记 Java 堆中所有直接通过根可访问的对象。


    > 根对象是从 Java 堆外部可访问的对象；原生栈对象和 JNI（Java Native Interface）本地或全局对象就是例子。


    由于变器线程是停止的，初始标记阶段是一个停止世界阶段。此外，由于年轻回收也会追踪根且是停止世界的，因此在年轻回收的同时进行初始标记是方便且高效的。这被称为“附加”。在初始标记停顿期间，每个区域的
    NTAMS 值被设置为当前区域的顶部（见图 2.5）。这种迭代持续直到堆的所有区域都被处理。


    # 根区域扫描


    根区域扫描阶段必须在下次垃圾回收停顿之前完成，因为在扫描整个堆的活跃对象之前，必须识别并标记从生存区引用的所有对象。


    # 并发标记


    并发标记阶段是并发且多线程的。设置并发线程数的命令行选项是 -XX:ConcGCThreads。默认情况下，G1 GC 将总线程设置为并行线程的四分之一。


