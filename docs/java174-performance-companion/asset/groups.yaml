    G1 uses multiple concurrent marking threads. In an attempt to avoid stealing too
    much CPU from application threads, marking threads do their work in bursts. They
    do as much as they can fit into a given time slot and then pause for a while,
    allowing the Java threads to execute instead.


    ## Humongous Objects


    G1 deals specially with large object allocations, or what G1 calls “humongous
    objects.” As mentioned earlier, a humongous object is an object that is 50 percent
    or more of a region size. That size includes the Java object header. Header sizes
    vary between 32- and 64-bit HotSpot VMs. The header size for a given object within
    a given HotSpot VM can be obtained using the Java Layout tool, also known as JOL.
    As of this, the Java Object Layout tool can be found on the Internet [2].


    When a humongous object allocation occurs, G1 locates a set of consecutive regions
    that add up to enough memory to contain the humongous object. The first region
    is tagged as a “humongous start” region and the other regions are marked as “humongous
    continues” regions. If there are not enough consecutive regions, G1 will do a
    full GC to collect the Java heap.


    Humongous regions are considered part of the old generation, but they contain
    only one object. This property allows G1 to eagerly collect a humongous region
    when the concurrent marking phase detects that it is no longer live. When this
    happens, all the regions containing the humongous object can be reclaimed at once.


    A potential challenge for G1 is that short-lived humongous objects may not be
    reclaimed until well past the point at which they become unused. JDK 8u40 implemented
    a method to, in cases, reclaim a humongous region during a young collection. Avoiding
    frequent humongous object allocations can be crucial to achieving application
    performance goals when using G1. The enhancements available in JDK 8u40 help but
    may not be a solution for all applications having many short-lived humongous objects.


    ## Full Garbage Collections


    Full GCs in G1 are implemented using the same algorithm as the Serial GC collector.
    When a full GC occurs, a full compaction of the entire Java heap is performed.
    This ensures that the maximum amount of free memory is available to the system.
    It is important to note that full GCs in G1 are single-threaded and as a result
    may introduce exceptionally long pause times. Also, G1 is designed such that full
    GCs are not expected to be necessary. G1 is expected to satisfy application performance
    goals without requiring a full GC and can usually be tuned such that a full GC
    is not needed.


    ## Concurrent Cycle


    A G1 concurrent cycle includes the activity of several phases: initial marking,
    concurrent root scanning, concurrent marking, remark, and cleanup. The beginning
    of a concurrent cycle is the initial mark, and the ending phase is cleanup. All
    these phases are considered part of "marking the live object graph" with the exception
    of the cleanup phase.


    The purpose of the initial-mark phase is to gather all GC roots. Roots are the
    starting points of the object graphs. To collect root references from application
    threads, the application threads must be stopped; the initial-mark phase is stop-the-world.
    In G1, the initial marking is done as part of a young GC pause since a young GC
    must gather all roots.


    The marking operation must also scan and follow all references from objects in
    the survivor regions. This is what the concurrent root scanning phase does. During
    this phase all Java threads are allowed to execute, so no application pauses occur.
    The only limitation is that the scanning must be completed before the next GC
    is allowed to start. The reason for that is that a new GC will generate a set
    of objects that are different from the initial mark''s survivors.


    Most marking work is done during the concurrent marking phase. Multiple threads
    coordinate to mark the live object graph. All Java threads are allowed to execute
    at the same time as the concurrent marking threads, so there is no pause in the
    application, though an application may experience some throughput reduction.


    After concurrent marking is done, another stop-the-world phase is needed to finalize
    all marking. This phase is called the "remark phase" and is usually a very stop-the-world
    pause.


    The final phase of concurrent marking is the cleanup phase. In this phase, regions
    that were found to contain any live objects are reclaimed. These regions are not
    included in a young or mixed GC since they contain no live objects. They are added
    to the list of available regions.


    The marking phases must be completed in order to find out what regions to include
    in the mixed GCs. Since it is the mixed GCs that are the primary mechanism for
    freeing memory in G1, it is important that the marking phase finishes before G1
    runs out of available regions. If the marking phase does not finish prior to running
    out of available regions, G1 will fall back to a full GC to free up memory. This
    is reliable but slow. Ensuring that the marking phases complete in time to avoid
    a full GC may require, which is covered in detail in Chapter 3.


    ## Heap Sizing


    The Java heap size in G1 is always a multiple of the region size. Except for that
    limitation, G1 can grow and shrink the heap size dynamically between -Xms and
    -Xmx just as the other HotSpot GCs.


    G1 may increase the Java heap size for several reasons:


    - 1. An increase in size can occur based on heap size calculations during a full
    GC.

    - 2. When a young or minor GC occurs, G1 calculates the time spent to perform
    the GC compared to the time spent executing the Java application. If too much
    time is spent in GC according to the command-line -XX:GCTimeRatio, the Java heap
    size is increased. The idea behind growing the Java heap size in this situation
    is to allow GCs to happen less frequently.

    - 3. If the marking phase does not finish prior to running out of available regions,
    G1 will fall back to a full GC to free up memory. This is reliable but slow. Ensuring
    that the marking phases complete in time to avoid a full GC may require, which
    is covered in detail in Chapter 3.

