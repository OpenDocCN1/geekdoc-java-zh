    is 45. In other words, a G1 measures the occupancy of the old generation space
    and compares to the current Java heap size. If the occupancy of the old generation
    space reaches or exceeds the InitiatingHeapOccupancyPercent, then a G1 concurrent
    cycle is initiated by scheduling an initial-mark operation to begin on the next
