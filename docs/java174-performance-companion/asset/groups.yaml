    ## External Regions


    The major parallel work carried out by the worker threads:


    - GC Worker Scanning: time spent scanning roots by each worker.

    - Ext Root Scanning: time spent scanning external roots by each worker.

    - Processed Buffers: time spent processing buffers by each worker.

    - Scan RS: time spent scanning remembered sets by each worker.

    - Code Root Scanning: time spent scanning code roots by each worker.

