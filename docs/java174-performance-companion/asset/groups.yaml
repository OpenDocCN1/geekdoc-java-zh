    on the order of 10 to 20 percent more Java heap space than Parallel GC to handle
    the same application. That is part of the price paid for shorter GC pauses.


    ## Concurrent Mark Sweep (CMS) GC


    | Marking/Pre-cleaning | Concurrent Sweeping |

    |---|---|

    | → | → |

    | → | → |

    | → | → |

    | → | → |

    | → | → |


    **Figure 1.3** How Java application threads are impacted by the GC threads when
    CMS is used


    Another challenge with CMS GC is how it deals with fragmentation in the old generation.
    Fragmentation occurs when the free space between objects in the old generation
    becomes so small or nonexistent that an object being promoted from the young generation
    cannot fit into an available hole. The CMS collection cycle does not perform compaction,
    not even incremental or partial compaction. A failure to find available hole causes
    CMS to fall back to a full collection using Serial GC, typically resulting in
    a lengthy pause. Another unfortunate challenge associated with fragmentation in
    CMS is that it is unpredictable. Some applications may never experience a full
    GC resulting from old generation fragmentation while others experience it regularly.


    Tuning CMS GC can help postpone fragmentation, as application modifications such
    as avoiding large object allocations. Tuning can be a nontrivial task and requires
    expertise. Making changes to the application to avoid fragmentation may also be
    challenging.


    ## Summary of the Collectors


    All of the collectors described thus far have some common issues. One is that
    the old generation collectors must scan the entire old generation for most of
    their operations such as marking, sweeping, and compacting. This means the time
    to perform the work scales more or linearly with Java heap size. Another is that
    it must be decided up front where the young and old generations should be placed,
    since the young and old generations are separate chunks.


    ## Garbage First (G1) GC


    The G1 garbage collector addresses many of the shortcomings of Parallel, Serial,
    and CMS GC by taking a somewhat different approach. G1 divides the heap into a
    set of regions. Most GC operations can be performed a region at a time rather
    than on the entire heap.


    In G1, the young generation is just a set of regions, which means it is not required
    to be a consecutive chunk. Similarly, the old generation is also just a set of
    regions. There is no need to decide at JVM launch which regions should be part
    of the old or young generation. In fact, the normal operational state for G1 is
    that over time memory moves back and forth between the generations. A region may
    be designated as young and later, after a young generation collection, become
    available for use elsewhere since young generation regions are completely evacuated.


    In the remainder of this chapter, the available region is used to identify regions
    that are unused and unavailable for use by G1. An available region can be used
    or designated as a young or old generation region. It is possible that after a
    young generation collection, a young generation region can at some future be used
    as an old generation region. Likewise, after collection of an old generation region,
    it becomes an available region that can at some future be used as a young generation
    region.


    G1 young collections are parallel stop-the-world collectors. As mentioned, parallel
    stop-the-world pauses collect all Java application threads while the garbage collector
    threads, and the GC is spread across multiple threads. With the other HotSpot
    collectors, when a young generation collection occurs, the young generation is
    collected.


    Old generation G1 collections are quite different from the other HotSpot collectors.
    G1 old generation do not require the entire old generation to be collected in
    order to free space in the old generation. Instead, only a subset of the old generation
    regions may be collected at any one time. In addition, this subset of old generation
    regions is collected in conjunction with a young collection.


    > Tip

    > The term to describe the collection of a subset of old generation regions in
    conjunction with a young collection is mixed GC. Hence, a mixed GC is an GC event
    in which all young generation regions are collected in addition to a subset of
    old generation regions. In other words, a mixed GC is a mix of young and old generation
    regions that are being collected.

