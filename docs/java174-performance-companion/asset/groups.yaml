    Figure 4.1 HSDB GUI


    Beginning with JDK 9, there are two different ways to launch HSDB. For instance,
    there is an example of how to launch the SA with JDK 9:


    ```

    set PATH=d:\Java\jdk9-b102;bin;%PATH%

    java sun.jvm.hotspot.HSDB

    ```


    This brings up HSDB.

    JDK 9 also contains a jhsdb executable in JDK 9''s bin directory that can be used
    to launch various SA tools. For example:


    ```

    set PATH=d:\Java\jdk9-b102;bin;%PATH%

    jhsdb.exe

    chsdb                    command line debugger

    hsdb                      ui debugger

    jstack --help          to get more information

    jmap --help             to get more information

    jinfo --help             to get more information

    ```


    jhsdb.exe with no arguments offers help by showing additional arguments that can
    be passed to jhsdb to launch various SA tools. For example:


    ```

    jhsdb hsdb

    ```


    This brings up the HSDB GUI debugger.'
