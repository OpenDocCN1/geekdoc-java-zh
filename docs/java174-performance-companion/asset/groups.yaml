    ```


    GC Worker Start and GC Worker End tagging the start and ending timestamps respectively
    of the parallel phase. The timestamp for GC Worker Start is the time at which
    the first worker thread started; similarly, the max timestamp for GC Worker is
    the time at which the last worker completed all its tasks. The lines also contain
    Avg and Diff values in milliseconds. The things to look out for in those lines
    are:


    +   - How away the Diff value is from 0, 0 being the ideal.

    - Any major variance in Max, Min, or Avg. This indicates that the worker threads
    could not start or finish the parallel work around the same time. That could mean
    that some of queue-handling issue exists that requires further analysis by looking
    at the parallel work during the phase.'
  - '[PAGE 58]


    # External Root Regions


    External root region scanning (Ext Root Scanning) is one of the first parallel
    tasks. During this phase the external (off-heap) roots such as the JVM''s system
    dictionary, VM data structures, JNI thread handles, hardware registers, global
    variables, and thread stack roots are scanned to find out any point into the current
    pause''s collection set (CSet).


    ```

    [Ext Root Scanning (ms): Min: 0.1, Avg: 0.2, Max: 0.2, Diff: 0.1, Sum: 1.2]

    ```


    Here again, we look for Diff >> 0 and major variance in Max, Min, or Avg.


    # Tip


    The variance (Diff) is shown for all the timed activities that make up the parallel
    phase. A high variance usually means that the work is not balanced across the
    parallel threads for that particular activity. This knowledge is an analysis starting
    point, and ideally a deeper dive will identify the potential cause, which may
    require refactoring the Java application.


    Another thing to watch out for is whether a worker thread is caught in dealing
    with a single root. We have seen issues where the system dictionary, which is
    treated as a single root, ends up holding up worker thread when there is a large
    number of loaded classes. When a worker thread is late for “termination” (explained
    later in this section), it is also considered held up.


    # Remembered Sets and Processed Buffers


    ```

    [Update RS (ms): Min: 12.8, Avg: 13.0, Max: 13.2, Diff: 0.4, Sum: 103.6]

    [Processed Buffers: Min: 15, Avg: 16.0, Max: 17, Diff: 2, Sum: 128]

    ```


    As explained in Chapter 2, “Garbage Collection in Depth,” G1 GC uses remembered
    sets (RSets) to help maintain and track references into G1 regions that “own”
    those RSets. The concurrent refinement threads, also discussed in Chapter 2, are
    tasked with scanning the update log buffers and updating RSets for the regions
    with dirty cards. In order to supplement the work carried out by the concurrent
    refinement threads, any remainder buffers that were logged but not yet processed
    by the refinement threads are handled during the parallel phase of the collection
    pause and processed by the worker threads. These buffers are what are referred
    to as Processed Buffers in the log snippet.'
  - '[PAGE 59]


    # The Stages of a Young Collection


    In order to limit the time spent updating RSets, G1 sets a target time as a percentage
    of the pause time goal (-XX:MaxGCPauseMillis) defaults to 10 percent of the pause
    time goal. Any evacuation pause should spend most of its time copying objects,
    and 10 percent of the pause time goal is considered a reasonable amount of time
    spend updating RSets. After looking at the logs you realize that spending 10 percent
    of your time goal in updating RSets is undesirable, you can change the percentage
    by updating the -XX:G1SetUpdatingTimePercent command-line option to reflect your
    desired value. It is important to remember, however, that if the number of log
    buffers does not change, a decrease in RSet update time during the collection
    phase will result in fewer buffers being processed during that pause. This will
    push the log buffer work off onto the concurrent refinement threads and will result
    in increased work and sharing of resources with the Java application mutator threads.
    Also worst case, if the concurrent refinement threads cannot keep up with the
    log update rate, the Java application mutators must step in and help with the
    processing—scenario best avoided!


    > Tip

    As discussed in Chapter 2, there is a command-line option called -XX:G1ConcRefinementThreads.
    By default it is set to the same value as -XX:ParallelGCThreads, which means that
    any change in XX:ParallelGCThreads will change the -XX:G1ConcRefinementThreads
    value as well.


    As collecting regions in the current CSet, the RSets for the regions in the CSet
    must be scanned for references in the CSet regions. As discussed in Chapter 2,
