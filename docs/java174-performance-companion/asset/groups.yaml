  mdcn: "\n\n# 附录：值得关注的其他 HotSpot VM 命令行选项\n\n诊断选项通常会给正常执行引入额外的开销，通常用于调查或诊断 Java HotSpot\
    \ VM 或其正在执行的选项的异常行为。\n\n- -XX:+UnlockExperimentalVMOptions\n设置是否允许标记为实验性选项的标志。默认值为\
    \ false。\n\n与 -XX:+UnlockDiagnosticVMOptions 类似，有些命令行选项被标记为“实验性（experimental）”。通过结合使用\
    \ `-XX:+PrintFlagsFinal` 和 `-XX:+UnlockExperimentalVMOptions`，可以在 Java HotSpot\
    \ VM 命令行选项列表中看到这些选项。“实验性”选项在 `-XX:+PrintFlagsFinal` 的输出中列有一个字段 (experimental)\
    \ 命令行类型。\n\n需要注意的是，实验性命令行选项并不是支持的 Java SE 产品的一部分——但可以用于实验——它们具有某些对于某些用户用例来说可能值得探索的其他功能。\n\
    \n某些实验性命令行选项可能是与性能相关的特性，但可能没有经过全面的审查或严谨的保证测试。尽管如此，它们在某些用例中仍可能提供性能收益。\n\n实验性命令行选项的一个示例是\
    \ -XX:G1NewSizePercent，它控制 G1 缩减到 Java 堆大小的年轻代的最小大小。默认值为 5。在其他情况下，G1 自适应年轻代的最小大小是\
    \ Java 堆大小的 5%。对于某些需要极低 GC 停时间的情况，可以在非生产环境中将 -XX:G1NewSizePercent 设置为 1 或 2 进行实验，并确认如果超过一个一个值则没有官方支持。\n\
    \n要使用实验性选项，必须在使用命令行选项的同时指定 -XX:+UnlockExperimentalVMOptions。例如，如果你使用 `-XX:G1NewSizePercent=2`\
    \ 命令行，则需要同时指定 `-XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=2`。只有当需要多个实验性命令行选项时，才需要指定\
    \ `-XX:+UnlockExperimentalVMOptions`。\n\n# -XX:+UnlockCommercialFeatures\n\n设置启用\
    \ Oracle 特有功能是否需要许可。默认值为 false。\n\n某些由 Oracle 开发的 la或特性仅通过 Oracle 运行时可用，而不包含在\
    \ OpenJDK 中。Oracle 商业特性的一个示例是 Java Flight Recorder（Java 记录器），它是 Oracle 监控和管理工具\
    \ Java Mission Control（Java 任务控制）的一部分。Java Flight Recorder 是一个分析和事件收集框架，可以在 Java\
    \ Mission Control 中收集并显示应用程序和 JVM 行为的低级信息。\n\n# 索引\n\n## A\n- 地址，查找, 92\n- 年龄表,\
