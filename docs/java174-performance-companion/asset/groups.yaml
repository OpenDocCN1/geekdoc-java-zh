    ## 年轻代


    ### 提示

    “GC效率”实际上是指待回收空间与收集该区域的预估 GC 成本之间的比例。由于缺乏更恰当的术语，在书中我们将通过对堆区域进行排序以识别候选区域的过程称为计算“GC效率”。之所以使用相同术语的原因是，GC
    会评估回收一个区域的收益相对于其收集成本的效益。而我们所指的“效率”完全取决于存活对象统计（liveness accounting），因此它只是收集一个区域的成本。例如，一个回收耗时比其他更昂贵的老年代区域短的老年代区域被认为是一个“高效”区域。效率最高的区域将是排序后区域数组中的前几个。


    在一个回收周期结束时，属于集合集（CSet）的区域（更多信息请参阅本章稍后的“集合集及其重要性”部分）被保证会被释放并返回空闲列表。让我们详细地讨论这些概念。


    ## 年轻代


    G1 GC 是一种分代 GC，由年轻代和老年代组成。大多数分配（除少数例外，例如大到无法放入分配线程分配缓冲区（也称为 TLAB）但又小于所谓的“巨型”的对象，当然还包括“巨型”对象本身，更多信息请参阅“巨型区域”部分）由任何特定线程落在该线程的
    TLAB 中。TLAB 能够实现更快的分配，因为所有线程能够无锁地进行分配。这些 TLAB 来自成为年轻代一部分的 G1 区域。除非在命令行上显式指定，否则当前的代大小是基于初始和最大代大小边界计算的（从
    JDK 8u45 开始，初始年轻代大小的默认值为总 Java 堆的 5% (-XX:G1NewSizePercent)，最大代大小的值为总 Java 堆的
    60% (-XX:G1MaxSizePolicy)，以及停顿时间目标 (-XX:MaxGCPauseMillis)）。


    ### 提示 提示

    如果在命令行上没有设置 -XX:MaxGCPauseMillis，G1 GC 将默认选择 200ms。如果用户设置了 -Xmn 或相关的年轻代大小，G1 GC
    可能无法根据停顿时间目标调整年轻代大小，停顿时间目标可能会变成一个无效选项。


    根据 Java 应用程序的对象分配速率，新区域将根据需要添加到年轻代中，直到达到所需的代大小。堆区域的大小在 JVM 时确定。堆区域的大小必须是 2 的幂，范围从
    1MB 到 32MB 不等。JVM 的目标是大约 2048 个区域并据此设置堆区域大小（堆区域大小 = 堆大小/2048）。堆区域大小经过对齐和调整，以符合
    1MB 到 32MB 以及 2 的幂的边界。堆区域的自适应选择可以通过命令行设置 -XX:GHeapRegionSize=n 来覆盖。第 3 章“垃圾优先垃圾收集器性能调优”包含了关于何时覆盖
    JVM 自适应调整的更多信息。


    ## 年轻回收停顿


    年轻代由被标记为 Eden 区的 G1 区域和标记为幸存区的 G1 区域组成。当 JVM 无法从 Eden 区分配内存时（即 Eden 区完全满），就会触发年轻回收。随后
    GC 介入释放空间。第一次年轻回收将把所有对象从 Eden 区移动到幸存区。这被称为“复制到幸存区”。从那时开始，任何年轻回收都会将对象从整个年轻代（即 Eden
    区和幸存区）提升到现在作为幸存区的新区域中。当存活对象超过预设的晋升阈值时，年轻回收偶尔会将少数对象提升到老年代。这被称为存活对象的“老化”。存活对象从年轻代到老年代的提升被称为对象的“年代化”，因此年龄阈值被称为“晋升阈值”。对象到幸存区或老年代的提升发生在提升
    GC 线程的本地分配缓冲区（也称为 Promotion Lab，简称 PLAB）中。幸存区和老年代各都有一个每个 GC 线程私有的 PLAB。


    在每次年轻回收停顿期间，G1 会计算当前年轻代大小的扩展或收缩量。


    ## 年轻代


    ### 巨型区域

    属于集合集（CSet）的区域（更多信息请参阅本章稍后的“集合集及其重要性”部分）被保证会被释放并返回空闲列表。让我们详细地讨论这些概念。


    ### 对象老化与老年代

    年轻代由被标记为 Eden 区的 G1 区域和标记为幸存区的 G1 区域组成。当 JVM 无法从 Eden 区分配内存时（即 Eden 区完全满），就会触发年轻回收。随后
    GC 介入释放空间。第一次年轻回收将把所有对象从 Eden 区移动到幸存区。这被称为“复制到幸存区”。从那时开始，任何年轻回收都会将对象从整个年轻代（即 Eden
    区和幸存区）提升到现在作为幸存区的新区域中。当存活对象超过预设的晋升阈值时，年轻回收偶尔会将少数对象提升到老年代。这被称为存活对象的“老化”。存活对象从年轻代到老年代的提升被称为对象的“年代化”，因此年龄阈值被称为“晋升阈值”。对象到幸存区或老年代的提升发生在提升
    GC 线程的本地分配缓冲区（也称为 Promotion Lab，简称 PLAB）中。幸存区和老年代各都有一个每个 GC 线程私有的 PLAB。


    在每次年轻回收停顿期间，G1 会计算当前年轻代大小的扩展或收缩量。


    ### 巨型区域

    对于 G1 来说，收集单位是区域。因此，堆区域大小 (-XX:HeapRegionSize) 是一个重要参数，因为它决定了什么尺寸的对象放入区域。巨型对象是跨越
    G1 区域 50% 或更多的大型对象。此类对象不遵循常规分配路径，而是直接从老年代中分配。


    '
