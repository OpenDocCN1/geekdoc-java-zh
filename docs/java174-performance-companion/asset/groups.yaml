    # 记忆集（Remembered Sets）及其重要性


    为了实现集合的独立，许多垃圾回收器会为其区域维护 RSet（记忆集）。RSet 是一种数据结构，用于帮助维护和跟踪指向其收集单元（在 G1 GC 中为区域）内部的引用，从而避免了扫描整个堆来获取信息的需要。当
    G1 GC 执行停顿世界（stop-the-world）收集（年轻代或混合回收）时，它会扫描其包含集（CSet）中所含区域的 RSet。当区域内的存活对象移动后，它们的入站引用将得到更新。


    在 G1 GC 中，在任何年轻代或混合回收期间，年轻代总是被整体收集，因此不需要追踪对象位于年轻代中的引用。这减少了 RSet 的开销。因此，G1 GC 只需要在以下场景中维护
    RSet：


    - 从老年代到年轻代的引用（Old-to-young references）——G1 维护从老年代区域指向年轻代区域的指针。年轻代被认为“拥有”该 RSet，因此该区域被认为是
    RSet 的“所有者”。

    - 从老年代到老年代的引用（Old-to-old references）——在这里，老年代不同区域之间的指针将维护在“所有者”老年代区域的 RSet 中。


    在图 2.3 中，我们可以看到一个年轻代区域（Region x）和两个老区域（Region y 和 z）。该引用记录在 Region x 的 RSet 中。我们还观察到
    Region z 有两个入站引用，一个来自 Region x，另一个来自 Region y。Region z 的 RSet 只需要记录来自 Region y
    的入站引用，而不需要记住来自 Region x 的引用，正如前面提到的，年轻代总是被整体收集的。最后，对于 Region y，我们看到一个来自 Region
    x 的入站引用，它并没有在 y 的 RSet 中记录，因为 Region x 是一个年轻代区域。


    如图 2.3 所示，每个区域只有一个 RSet。根据应用程序的不同，某个特定区域（以及其 RS）可能是“热点”的，导致在同一区域内甚至对同一位置上可能发生次次频繁的更新。这在
    Java 应用程序中并不罕见。


    G1 GC 有其处理此类热点需求的方法；即通过改变 RSet 的密度。RSet 的密度遵循三个粒度的级别：稀疏（sparse）、精细（fine）和粗粒（coarse）。对于热点区域，RSet
    可能会粗化以容纳来自各个区域的指针。这将反映在 RSet 的扫描时间上。（有关 RSet 扫描时间的更多细节请参考第 3 章。）每个粒度级别都有一个每个区域表（PRT）抽象结构来存放任何特定的
    RSet。


    由于 G1 GC 区域内部被进一步划分为块（chunks），在 G1 GC 区域级别，可实现的粒度是一个 512 字节的块，称为“卡”（card）(参见图
    2.4)。一个全局卡表（global card table）维护着所有的卡。


    # 第 2 章 · 解析 Garbage First 垃圾回收器


    ![](img/0889c737c4674ce01ea95712362abd45_42_0.png)


    ![](img/0889c737c4674ce01ea95712362abd45_42_1.png)


    图 2.3 带有入站对象引用的记忆集


    ![](img/0889c737c4674ce01ea95712362abd45_42_2.png)


    图 2.4 带有 512 字节卡的全局卡表


    当指针引用一个 RSet 的所有者区域时，包含该指针的卡会被记录在 PRT 中。稀疏的 PRT 基本上是这些卡索引的哈希表。这种简单的实现使得垃圾回收器的扫描速度更快。另一方面，精粒度的
    PRT 和粗粒度的位图是以不同的方式处理的。对于精粒度 PRT，其开放哈希表中的每个条目对应一个区域（带有一个指向所有者区域的引用），该区域内部的卡索引存储在位图中。精粒度
    PRT 有一个最大限制，当超过该限制时，会在粗粒度位图中设置一个位（称为“粗粒度位”）。一旦设置了粗粒度位，精粒度 PRT 中对应的条目就会被删除。粗粒度位图只是一个每个区域一个位的位图，意味着该区域可能包含指向所有者区域的引用。因此，必须扫描与集合相关的整个区域以找到引用。在这里，粗化为粗粒度位图的记忆集是垃圾回收器扫描最慢的。关于此更多细节可以在第
    3 章找到。在任何收集期间，扫描记忆集和 PRT 中的卡时，G1 GC 会标记全局表中的对应条目以避免重复扫描。在收集结束时，此卡表会被清除；这在 GC 输出中（使用
    -XX:+PrintGC 打印）显示，紧接在 GC 线程执行的并行工作之后（即根节点扫描、更新和扫描）。


