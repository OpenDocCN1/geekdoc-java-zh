    ## Garbage First 垃圾回收器性能调优


    性能工程处理系统或其软件的非功能性性能需求，并确保产品实现满足了设计需求。因此，它与系统工程或软件工程紧密相连。


    在本章中，我们将详细讨论性能调优，重点关注 Java HotSpot VM 中最新的垃圾回收器：Garbage First，或称 G1。我们将跳过 Java™
    Performance [1] 中已经提供的年轻代收集调优建议，特别是第 7 章“逐步调优 JVM”。鼓励读者阅读该章节以及本补充书籍中的之前的章节。


    ## 年轻代收集的阶段


    G1 的年轻代收集包含串行阶段和并行阶段。暂停（Pause）在意义上是串行的，因为在给定的停顿（stop-the-world）暂停期间，只有在其他任务完成后才能执行若干项任务。并行阶段采用多个
    GC 线程，这些线程有自己的工作队列，并且当自己的队列任务完成完成时，可以从其他线程的工作队列中“偷取”任务。


    > 提示

    > 年轻代收集暂停的阶段可以是多线程的，并使用 -XX:ParallelGCThreads 的值来确定 GC 工作线程的数量。


