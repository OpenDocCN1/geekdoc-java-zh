    \ through each buffer and marking each recorded object by setting the corresponding\
    \ bit in the marking bitmap (and pushing the object onto a local marking stack\
    \ if the object lies below the finger). Marking iterates over the set bits in\
    \ a section of the marking bitmap, tracing the field references of the marked\
    \ objects, setting more bits in the marking bitmap, and pushing objects as necessary.\n\
    \nLive data accounting is piggybacked on the marking operation. Hence, every time\
    \ an object is marked, it is also counted (i.e., its bytes are added to the region's\
    \ total). Only objects below NTAMS are marked and counted. At the end of this\
    \ stage, the next marking bitmap is cleared so that it is ready when the next\
    \ marking cycle starts. This is done concurrently with the mutator threads.\n\n\
    > Tip\nJDK 8u40 introduces a new command-line option -XX:+ClassUnloadingWithConcurrentMarking\
    \ which, by default, enables unloading with concurrent marking. Hence, concurrent\
    \ marking can track classes and calculate their liveness. During the remark stage,\
    \ the unreachable classes can be unloaded.\n\n### Remark\nThe remark stage is\
    \ the final stage. During this stop-the-world stage, G1 GC completely drains any\
    \ remaining SATB log buffers and processes any updates. G1 GC traverses any unvisited\
    \ live objects. As of JDK 8u40, the remark stage is stop-the-world, since mutator\
    \ threads are responsible for updating the SATB log buffers and as such \"own\"\
    \ theirs. Hence, a final stop-the-world pause is necessary to cover all the live\
    \ data and safely complete live data accounting. In order to reduce time spent\
    \ in this pause, multiple GC threads are used to parallel the log buffers. The\
    \ -XX:ParallelGCThreads help set the number of GC threads available during any\
    \ GC pause. Reference processing is also a part of the remark stage.\n\n> Tip\n\
    Any application that heavily uses reference objects (weak references, soft references,\
    \ phantom references, or final references) may see high remark times as a result\
    \ of the reference-processing overhead. We will learn more about this in Chapter\
    \ 3.\n\n### Cleanup\nDuring the cleanup pause, the two marking bitmaps swap roles:\
    \ the next marking bitmap becomes the previous one (given that the current marking\
    \ cycle has been finalized and the next marking bitmap now has consistent marking\
    \ information), and the previous marking bitmap becomes the next one (which will\
    \ be used as the current marking bitmap during the next cycle). Similarly, PTAMS\
    \ and NTAMS swap roles as well. Three major contributions of the cleanup pause\
    \ are identifying completely free regions, sorting the heap regions to identify\
    \ efficient old regions for mixed garbage collection, and RSet scrubbing. Current\
    \ heuristics rank the regions according to live (the regions that have a lot of\
    \ live objects are expensive to collect, since copying is an expensive operation)\
    \ and remembered set size (again, large remembered sets are expensive to collect\
    \ due to the regions' popularity—the concept of popularity was discussed in the\
    \ “RSets and Importance section”). The goal is to collect/evacuate the candidate\
    \ regions that are deemed less expensive (fewer live objects and less popular)\
    \ first.\n\nAn advantage of identifying the live objects in each region is that\
    \ encountering a completely free region, its remembered set can be cleared and\
    \ returned to the list. RSet scrubbing helps detect stale references. So, for\
    \ example, marking finds that all the particular card are dead.\n\n## Evacuation\
    \ Failures and Full Collection\nSometimes G1 GC is unable to find a free region\
    \ when trying to copy live objects from an old region. Such a failure is reported\
    \ in the GC logs as the following:\n\n```\n111.912: [GC Evacuation Pause (young)\
    \ to-space exhausted),\n0.67316 secs]\n<S0>\nEvacuation Failure: 331.5 ms\n```\n\
    \nThere are other times when a humongous allocation may not be able to find contiguous\
    \ regions in the old generation for allocating humongous objects. At such times,\
    \ G1 GC will attempt to increase its usage of the Java heap. If the expansion\
    \ of the Java heap is unsuccessful, G1 GC triggers its fail-safe mechanism and\
    \ falls back to a serial (single-threaded) full collection.\n\nDuring a full collection,\
    \ a single thread operates over the entire heap and does mark, sweep, and compaction\
    \ of all the regions (expensive or otherwise) constituting the generations. After\
    \ completion of the collection, the resultant heap now consists of purely live\
    \ objects, and all the generations have been compacted.\n\n> Tip\nPrior to JDK\
    \ 8u40, unloading of classes was possible only at a full collection.\n\nThe single-threaded\
    \ nature of the serial full collection and the fact that the collection spans\
    \ the entire heap can make this a very expensive collection, especially if the\
    \ heap size is large. Hence, it is highly recommended that nontrivial tuning exercise\
    \ be done in such cases where full collections are frequent.\n\n> Tip\nFor more\
    \ information on how to get rid of evacuation failures, please refer to Chapter\
    \ 3.\n\n## References\n- [1] Charlie Hunt and Binu John. *Java™ Performance*.\
    \ Addison-Wesley, Upper Saddle River, NJ, 2012. ISBN 978-0-13-714252-1.\n- [2]\
    \ Tony Printezis and David Detlets. “A Generational Mostly-Concurrent Garbage\
    \ Collector.” *Proceedings of the 2nd International Symposium on Memory Management*.\
    \ ACM, New York, 2000, pp. 143–54. ISBN 1-58113-263-8.\n- [3] Urs Hölze. “A Fast\
    \ Write Barrier for Garbage Collectors.” Presented at the OOPSLA93 Garbage Collection\
    \ Workshop, Washington, DC, October 1993.\n- [4] Darko Stefanovic, Matthew Hertz,\
    \ Stephen M. Blackburn, Kathryn S McKinley, and J. Eliot B. Moss, “Older-First\
    \ Garbage Collector in Practice: Evaluation in a Java Virtual Machine.” *Proceedings\
    \ of the 2002 Workshop on Memory System Performance*. ACM, New York, 2002, pp.\
    \ 25–36.\n- [5] Taiichi Yuasa. “Real-Time Garbage Collection on General Purpose\
    \ Machines.” *Journal of Systems and Software*, Volume 11, Issue 3, March 1990,\
    \ pp. 181–98. Elsevier Science, Inc., New York.\n"
  mdcn: "\n\n## 并发标记阶段\n\nGC 线程 (-XX:ParallelGCThreads)。并行 GC 线程由 JVM 在虚拟机启动时计算。并发线程会扫描一个区域并使用“指纹”（finger）指针优化来标记该区域。这种“指纹”指针优化与\
    \ CMS GC 的优化类似，可以在 [2] 中进行研究。\n\n正如《RSets 及其重要性》中所提到的，G1 GC 也采用了预写屏障（pre-write\
    \ barrier）来执行 SATB 并发标记算法所需的动作。当应用程序变异其对象图时，那些在标记开始时可达且属于标记快照的对象，可能会在被标记线程发现和追踪之前被覆盖。SATB\
    \ 标记保证了执行修改的变异器线程（mutator thread）会将需要修改的指针的旧值记录在 SATB 队列/缓冲区中。这被称为“并发标记/SATB 预写屏障”，因为该屏障是在更新之前执行的。预写屏障允许记录对象引用的旧值，以便并发标记可以标记通过值被覆盖的对象。\n\
    \n对象赋值 `x.f = y` 预写屏障的伪代码如下：\n\n```\nif (marking_is_active) {\n  pre_val := x.f;\n\
    \  if (pre_val != NULL) {\n    satb_enqueue(pre_val);\n  }\n}\n```\n\n`marking_is_active`\
    \ 条件是对线程本地标志的简单检查，该标志在标记开始的初始标记停顿（initial-mark pause）期间被设置为 true。通过此标记保护预屏障的其他代码，可以减少在标记未激活时执行剩余屏障代码的开销。由于该标志是线程本地的且其值可能被多次加载，个人很可能会命中缓存，进一步减少了屏障的开销。\n\
    \n`satb_enqueue()` 首先尝试将旧值放入线程本地缓冲区（称为 SATB 缓冲区）。SATB 缓冲区的初始大小为 256 个条目，每个应用程序线程都有一个\
    \ SATB 缓冲区。如果缓冲区没有空间放置 `pre_val`，则会调用 JVM 运行时；线程当前的 SATB 缓冲区会被弃用并放入全局 SATB 缓冲区列表，为该线程分配一个新的\
    \ SATB 缓冲区并记录 `pre_val`。并发标记线程的任务是定期检查并处理缓冲区，以确保已记录对象的被标记。\n\n填充的 SATB 缓冲区（在标记阶段）通过遍历全局列表进行处理，遍历每个缓冲区，并通过设置标记位图（marking\
    \ bitmap）中相应的位来标记每个记录的对象（如果对象位于指纹下方，则将其推入本地标记栈）。标记会遍历标记位图中某个区域的设置位，追踪已标记对象的字段引用，在标记位图中设置更多位，并根据需要推入对象。\n\
    \n存活数据计数是寄载在标记操作之上的。因此，每当一个对象被标记时，也会被计数（即其字节数被加到区域的总数中）。只有位于 NTAMS 以下的对象会被标记和计数。在该阶段结束时，会清除下一个标记位图，以便在下一次标记周期开始时准备就绪。这是与变异器线程并发完成的。\n\
    \n> 提示\nJDK 8u40 引入了一个新的命令行选项 -XX:+ClassUnloadingWithConcurrentMarking，它默认开启并发标记时的卸载。因此，并发标记可以跟踪类并计算它们的活跃性。在重标记（remark）阶段，不可达的类可以被卸载。\n\
    \n### 重标记 (Remark)\n重标记阶段是最后一个阶段。在这个停顿世界（stop-the-world）阶段，G1 GC 会完全排空任何剩余的 SATB\
    \ 日志缓冲区并处理任何更新。G1 GC 会遍历任何未访问过的存活对象。截至 JDK 8u40，重标记阶段是停顿世界的，因为变异器线程负责更新 SATB 日志缓冲区，因此“拥有”这些缓冲区。因此，需要一次最终的停顿世界停顿来覆盖所有存活数据并安全地完成存活数据计数。为了减少在此停顿中花费的时间，使用了多个\
    \ GC 线程来并行处理日志缓冲区.-XX:ParallelGCThreads 有助于设置任何 GC 停顿期间可用的 GC 线程数。引用处理也是重标记阶段的一部分。\n\
    \n> 提示\n任何大量使用引用对象（弱引用、软引用、虚引用或终引用）的应用程序可能会因为引用处理的开销导致重标记时间较长。我们将在第 3 章学习更多。\n\
    \n### 清理 (Cleanup)\n在清理停顿期间，两个标记位图交换角色：下一个标记位图变成上一个（假设当前标记周期已完成，且下一个标记位图现在具有一致的标记信息），而上一个标记位图变成下一个（将在下次循环中作为当前标记位图使用）。同样，PTAMS\
    \ 和 NTAMS 也交换角色。清理停顿的三大贡献是识别完全空闲的区域、排序堆区域以识别混合垃圾收集的高效老年代以及 RSet 清理（scrubbing）。当前的启发式算法根据活跃程度（存有很多活跃对象的区域收集成本很高，因为复制是一个昂贵的操作）和记忆集大小（再次，由于区域的人气，大型记忆集的收集成本很高——人气概念在“RSets\
    \ 和重要性部分”中讨论过）对区域进行排序。目标是首先收集认为成本较低（存活对象少且人气低）的候选区域。\n\n识别每个区域中存活对象的优点是，遇到完全空闲的区域，可以清除它的记忆集并返回列表。RSet清理有助于检测过时引用。例如，标记发现所有特定的卡都是死的。\n\
    \n## 复制失败与全收集 (Evacuation Failures and Full Collection)\n有时，G1 GC 在尝试从老年代复制存活对象时无法找到空闲区域。此类失败会在\
    \ GC 日志中报告如下：\n\n```\n111.912: [GC Evacuation Pause (young) to-space exhausted),\n\
    0.67316 secs]\n<S0>\nEvacuation Failure: 331.5 ms\n```\n\n在其他时候，大对象分配可能在老年代中找不到连续区域来分配大对象。在这种情况下，G1\
    \ GC 将尝试增加 Java 堆的使用量。如果 Java 堆扩展失败，G1 GC 将触发其安全机制并回退到单线程全收集。\n\n在全收集期间，单线程操作整个堆，并对构成代的区域（无论成本如何）进行标记、清除和压缩。全收集完成后，堆现在仅包含存活对象，且所有代都已压缩。\n\
    \n> 提示\n在 JDK 8u40 之前，类的卸载只能在全收集时进行。\n\n单线程全收集的性质以及跨越整个堆的事实可能导致收集非常昂贵，因此在频繁发生全收集的情况下，强烈建议进行复杂的调优。\n\
    \n> 提示\n有关如何消除复制失败的更多信息，请参阅第 3 章。\n\n## 参考文献\n- [1] Charlie Hunt 和 Binu John.\
    \ *Java™ Performance*. Addison-Wesley, Upper Saddle River, NJ, 2012. ISBN 978-0-13-714252-1.\n\
    - [2] Tony Printezis 和 David Detlets. “A Generational Mostly-Concurrent Garbage\
    \ Collector.” *Proceedings of the 2nd International Symposium on Memory Management*.\
    \ ACM, New York, 2000, pp. 143–54. ISBN 1-58113-263-8.\n- [3] Urs Hölze. “A Fast\
    \ Write Barrier for Garbage Collectors.” Presented at the OOPSLA93 Garbage Collection\
    \ Workshop, Washington, DC, October 1993.\n- [4] Darko Stefanovic, Matthew Hertz,\
    \ Stephen M. Blackburn, Kathryn S McKinley 和 J. Eliot B. Moss，“Older-First Garbage\
    \ Collector in Practice: Evaluation in a Java Virtual Machine.” *Proceedings of\
