    \ used\nro [0x37f50000,0x383dee40,0x38950000) space capacity = 10485760,521539625\
    \ used\n```\n\n## List of Commands\n\nHere is the complete list of commands available\
    \ with the CLHSDB tool:\n\n```\nhsdb help\nAvailable commands:\nassert true |\
    \ false\nattach pid | exec core\ndetach\ndumpcfg {a | id }\ndumpcode {a | id }\n\
    dumpideal {a | id }\ndumpilt {a | id }\necho [address/count ]\namine [address/address\
    \ ]\nfield type isStatic offset address\nfindc address\nflags [name | -nd ]\n\
    history\nispect expression\nintConstant [name value ]\nhisto [-v]\nlivenmethods\n\
    longConstant [name value ]\npmap\nprint expression\nprintdo [a | expression ]\n\
    printstatics [type ]\npstack [-v ]\nquit\nreattach\nrevptrs address\nscanoops\
    \ start end [type ]\nsearch [heap | perm | rawheap | codecage | threads ] value\n\
    source filename\nsymbol address\nsymboltump symboltable name\nthread {a | id }\n\
    tokenize type\nverbose true | false\nvmstructump\nwhere {a | id }\n```\n\n## Some\
    \ Other Tools\n\nSome very handy, small utilities are bundled with the SA. These\
    \ tools can be attached to a process, to a core file, or a remote debugger. Let's\
    \ take a look how we can use them and what useful information they provide.\n\n\
    ## FinalizerInfo\n\nThis tool prints details on finalizable objects in the target\
    \ VM:\n\n```\njava -classpath %JAVA_HOME%\\lib\\sa-jdi.jar sun.jvm.hotspot.tools.FinalizerInfo\
    \ 5684\naching to process ID 5684, please wait...\nDebugger attached successfully.\n\
    Client compiler detected.\nJVM version is 24.0-b56\nNumber of objects pending\
    \ for finalization: 0\n```\n\n## HeapDumper\n\nThis tool can dump the Java heap\
