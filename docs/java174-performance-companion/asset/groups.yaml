    coordinate to mark the live object graph. All Java threads are allowed to execute
    at the same time as the concurrent marking threads, so there is no pause in the
    application, though an application may experience some throughput reduction.


    After concurrent marking is done, another stop-the-world phase is needed to finalize
    all marking. This phase is called the "remark phase" and is usually a very stop-the-world
    pause.


