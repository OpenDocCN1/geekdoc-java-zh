    ## 迁移与回收


    G1 知道了当前收集的 CSet 后，就可以处理暂停中最耗时的部分：从 CSet 迁移活跃对象以及回收新释放的空间。理想情况下，对象复制时间是暂停的主要原因。需要迁移的活跃对象被复制到目标区域分配的线程本地缓冲区（GLABs）中。工作线程在新分配的对象上安装转发指针。在工作窃取的帮助下，单个“胜利者”线程协助复制和扫描对象。工作选取在工作线程之间提供了负载均衡。


    ```

    对象复制 (ms): 最小 25.1, 平均 25.2, 最大 25.2, 差异 0.1, 总计 201.5]

    ```


    > 提示

    > G1 使用复制时间作为加权平均值来预测复制单个区域所需的时间。如果预测逻辑跟不上，用户可以调整年轻代的大小。


    ## 终止（Termination）


    完成描述的任务后，如果工作队列为空，每个工作线程都会请求终止。请求终止的线程会检查其他线程的工作队列以尝试工作窃取。如果没有可用工作，则终止。终止标记了每个工作线程在该协议中花费的时间。陷入单个根扫描的
    GC 工作线程可能会延迟完成队列中的所有任务，并最终延迟终止。


    ```

