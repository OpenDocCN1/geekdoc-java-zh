  - '[PAGE 38]


    # A Mixed Collection Pause


    As more and more objects get promoted into the old regions or when humongous objects
    get allocated into the homogeneous regions the occupancy of the old generation
    and hence the total occupied Java heap increases. In order to avoid running out
    of heap space, the JVM process needs to initiate a garbage collection that not
    only covers the regions in the young generation but also adds some old regions
    to the mix. Refer to the previous section on humongous regions to read about the
    special handling (allocation and reclamation) of humongous objects.


    In order to identify old regions with the most garbage, G1 GC initiates a concurrent
    marking cycle, which helps with marking regions and eventually identifying all
    live objects and also calculating the liveness factor per region. There needs
    to be a delicate balance between the rate of allocations and the triggering of
    this marking cycle such that the JVM process doesn''t run out of Java heap space.
    Hence, an occupancy threshold is set at the start of the JVM process. As of this
    writing and through least JDK 8u45 this threshold is not adaptive and can be set
    by the command-line option -XX: InitiatingHeapOccupancyPercent (which I very fondly
    call IHOP).


    # Tip


    In G1, the IHOP threshold defaults to 45 percent of the total Java heap. It is
    important to note that this heap occupancy percentage applies to the entire java
    heap, unlike the heap occupancy command-line option used with CMS GC where it
    applies only to the old generation. In G1 GC, there is no physically separate
    old generation—there is a single pool of free regions that can be allocated as
    eden, survivor, or humongous. Also, the number of regions that are allocated,
    for say the eden, can vary over time. Hence having an old generation percentage
    didn''t really make sense.


    # Trivia


    I used to write e-mails to G1 GC devs and also to G1 GC users about the marking
    threshold and would always have to refer to it in full as InitiatingHeapOccupancyPercent
    since there is another difference (other than the one mentioned in the preceding
    tip) between CMS and G1''s marking threshold—it''s the option name! CMS''s threshold
    is called CMSInitiatingOccupancyFraction'
  - '[PAGE 39]


    # A Mixed Collection Pause


    When the old generation occupancy reaches (exceeds) the IHOP threshold, a concurrent
    marking cycle is initiated. Toward the end of marking, G1 GC calculates the amount
    of live objects per old region. Also, during the cleanup stage, G1 GC counts the
    old regions based on “GC efficiency.” Now a mixed collection can happen! During
    a mixed collection pause, G1 GC not only collects all of the regions in the young
    generation but also collects a few candidate old regions that the most garbage
    are reclaimed.


    # ### Tip


    An important point to keep in mind when comparing CMS and G1 logs is the multistaged
    concurrent cycle in G1 has fewer stages than the multistaged concurrent cycle
    in CMS.


    A mixed collection is similar to a young collection pause and achieves compaction
    of the live objects by copying. The only difference is during a mixed collection,
    the collection set also incorporates a few efficient old regions. Depending on
    a few parameters (as discussed later in this chapter), there could be more than
    one mixed collection pause. This is called a “mixed collection cycle.” A mixed
    collection cycle can happen only after the marking/IHOP threshold is crossed and
    after the collection of a marking cycle.


    There are two important parameters that determine the total number of mixed collections
    in a mixed collection cycle: -XX:G1MixedGCCountTarget -XX:G1HeapWastePercent.

    -XX:G1MixedGCCountTarget, which defaults to 8 (JDK 8u45), is the mixed GC count
    target option whose intent is to set a physical limit on the number of mixed collections
    that will happen after the marking cycle is complete. G1 GC divides the total
    number of candidate old regions available for collection by the count target number
    and sets that as the minimum number of old regions to be collected per collection
    pause. This can be represented as an equation:


    Old CSet per mixed collection pause = Total number of candidate regions identified
    for mixed collection cycle/G1MixedGCCountTarget

    -XX:G1HeapWastePercent, which defaults to 5 percent (JDK 8u45) of the total Java
    heap, is an important parameter that controls the number of old regions to be
    collected during a mixed collection cycle. For every mixed collection pause, G1
    GC identifies the amount of reclaimable heap based on the dead object space that
    can be reclaimed. As soon as G1 GC reaches this heap waste percentage, G1 GC stops
    the initiation of a mixed collection pause, thus culminating the mixed collection
    cycle. Setting the heap waste percentage basically helps with limiting the amount
    of heap that you are willing to waste to speed up the mixed cycle.'
  - '[PAGE 40]


    Thus the number of mixed collections per mixed collection cycle can be controlled
    by the minimum generation CSet per mixed collection pause count and the heap percentage.


    # Collection Sets and Their Importance


    During any garbage collection pause all the regions in the CSet are freed. A CSet
    is a set of regions that are targeted for reclamation during a garbage collection
    pause. All live objects in these candidate regions will be evacuated during a
    collection, and the regions will be returned to a list of free regions. During
    a collection, the CSet can contain only young regions for collection. A mixed
    collection, on the other hand, will not add all the young regions but also some
    old candidate regions (based on their GC efficiency) to its CSet.


    +   There are two important parameters that help with the selection of candidate
    old regions for the mixed collection: -XX:G1MixedGCLiveThreshold - XX:G1CSetRegionThreshold

    - XX:G1MixedGCLiveThreshold, which defaults to 85 percent (JDK 8u5) of a G1 GC
    region, is a liveness threshold and a set limit to exclude the most expensive
    of old regions from the CSet of mixed collections. G1 GC sets a limit such that
    any old region that falls below this liveness threshold is included in the CSet

    - XX:G1CSetRegionThreshold, which defaults to 10 percent (JDK 8u5) of the total
    Java heap, sets the maximum limit on the number of old regions that can be collected
    per mixed collection pause. The threshold is dependent on the total Java heap
    available to the JVM process and is expressed as a percentage of the total Java
    heap. Chapter 3 covers a few examples to highlight the functioning of these thresholds.


    # Remembered Sets and Their Importance


    A generational collector segregates different areas in the heap according to the
    age of those objects. These different areas in the heap are referred to as generations.
    The generational collector can then concentrate most of its collection effort
    on the most recently allocated objects because it expects to find most of them
    sooner rather than later. These generations in the heap can be collected independently.
    The independent collection helps lower the response times since the GC doesn''t
    have to scan the entire heap (e.g., in the case of copying generational collectors)
    older long-lived objects don''t have to be copied back and forth, thus reducing
    the copying and reference updating overhead.'
