    # Garbage First Overview


    This chapter is an introduction to the Garbage First (or G1) garbage collector
    (GC) along with a historical perspective on the garbage collectors in the Java
    HotSpot Virtual Machine (VM), hereafter called just HotSpot, and the reasoning
    behind G1''s inclusion in HotSpot. The reader is assumed to be familiar with basic
    garbage collection concepts such as young generation, old generation, and compaction.
    Chapter 3, “JVM Overview,” of the book Java™ Performance [1] is a good source
    for learning more about these concepts.


    Serial GC was the first collector introduced in HotSpot in 1999 as part of Java
    Development Kit (JDK) 1.3.1. The Parallel and Concurrent Mark Sweep collectors
    were introduced in 2002 as part of JDK 1.4.2. These three roughly correspond to
    the three most important use cases: “minimize memory footprint and maximize application
    throughput,” and “minimize GC-related pause times.” One might ask, “Why do we
    need a such collector as G1?” Before answering, let''s clarify some terminology
    that is often used when comparing and contrasting garbage collectors. We''ll move
    on to a brief overview of the four HotSpot garbage collectors, including G1, and
    identify how G1 differs from the others.


    # Terminology


    In this section, we define the terms parallel, stop-the-world, and concurrent.
    The term parallel means a multithreaded garbage collection operation. When a GC
    event activity is described as parallel, multiple threads are used to perform
    it. When a garbage collector is described as parallel, it uses multiple threads
    to perform garbage collection.


    In the case of the HotSpot garbage collectors, almost all multithreaded GC operations
    are handled by internal Java VM (JVM) threads. One exception to this is the G1
    garbage collector, in which some background GC work can be taken on by the application
    threads. For more detail see Chapter 2, "Garbage First Garbage Collector Depth,"
    and Chapter 3, "Garbage First Garbage Collector Performance Tuning."


    The term stop-the-world means that all Java application threads are stopped during
    a GC event. A stop-the-world garbage collector is one that stops all Java application
    threads when it performs a garbage collection. A GC phase or event may be described
    as stop-the-world, meaning during that particular GC phase or event all Java threads
    are stopped.


    The concurrent means that garbage collection activity is occurring at the same
    time as the Java application is executing. A concurrent GC phase or event means
    that the GC phase or event executes at the same time as the application. A garbage
    collector may be described by any one or a combination of these three terms. For
    example, a parallel concurrent collector is multithreaded (the parallel part)
    and also executes at the same time as the application (the concurrent part).


    # Parallel GC


    Parallel GC is a parallel stop-the-world collector, which means that when a GC
    occurs, it stops all application threads and performs the GC work using multiple
    threads. The GC work can be done very efficiently without any interruptions. This
    is normally the best way to minimize the total time spent doing GC relative to
    application work. However, individual pauses of the Java application induced by
    GC can be fairly long.


    Both the young and old generation collections in Parallel GC are parallel and
    stop-the-world. Old generation collections also perform compaction. Compaction
    moves objects closer together to eliminate wasted space between them, leading
    to an optimal layout. However, compaction may take a considerable amount of time,
    which is generally a function of the size of the Java heap and the number and
    size of live objects in the old generation.


    At the time when Parallel GC was introduced in HotSpot, only the young generation
    used a parallel stop-the-world collector. Old generation collections used a single-threaded
    stop-the-world collector. Back when Parallel GC was introduced, the HotSpot command-line
    option enabled Parallel GC in this configuration was -XX:+UseParallelGC.


    At the time when Parallel GC was introduced, the most common use case for servers
    required throughput optimization, and Parallel GC became the default collector
    for the HotSpot Server VM. Additionally, the size of most Java heaps tended to
    be between 512MB and 2GB, which keeps Parallel GC pause times relatively low,
    even for single-threaded stop-the-world collections. Also at the time, latency
    requirements tended to be more relaxed than they are today. It was common for
    Web applications to tolerate GC-induced latencies in excess of one second, and
    as much as three to five seconds.


    As Java heap sizes and the number and size of live objects in old generation grew,
    the time to collect the old generation became longer and longer. At the same time,
    hardware advances made more hardware threads available. As a result, Parallel
    GC was enhanced by adding a multithreaded old generation collector to be used
    by multithreaded young generation collector. This enhanced Parallel GC reduced
    the time required to collect and compact the heap.


    The enhanced Parallel GC was delivered in a Java 6 update release. It was enabled
    by a new command-line option called -XX:+UseParallelOldGC. When -XX:+UseParallelOldGC
    is enabled, parallel young generation collection is also enabled. This is what
    we think of today as Parallel GC in HotSpot, multithreaded stop-the-world young
    generation collector combined with a multithreaded stop-the-world old generation
    collector.


    > Tip

    > In Java 7 update release 4 (also referred to as 7u4, or JDK 7u4), -XX:+UseParallelOldGC
    was the default GC and the normal mode of operation for Parallel GC. As of Java
    7u4, specifying -XX:+UseParallelOldGC also enables -XX:+UseParallelOldGC.


    Parallel GC is a good choice in the following cases:


    - throughput requirements are much more important than latency requirements. A
    processing application is a good example since it is noninteractive. When you
    start a batch execution, you expect it to run as fast as possible.

    - If worst-case latency requirements can be met, Parallel GC will offer the best
    throughput. Worst-case latency requirements include both worst-case pause times
    and also how frequently they occur. For example, an application may have a latency
    requirement of “pauses” that exceed 500ms shall not occur more than once two hours,
    and all pauses shall not exceed three seconds.

    - interactive application with a sufficiently small data size that Parallel GC’s
    full GC event is able to meet worst-case latency requirements. An application
    is a good example that fits this. However, the amount of live data tends to be
    highly correlated with the size of the heap, the types of applications falling
    into this category are limited.


    Serial GC is very similar to Parallel GC except that it does all its work in a
    single thread. The single-threaded approach allows for a less complex GC implementation
    and requires fewer runtime data structures. The memory footprint is lowest of
    all HotSpot collectors. The challenges with Serial GC are similar to those for
    Parallel GC. Pause times can be long, and they grow more or less linearly with
    the heap size and amount of live data. In addition, with Serial GC the long pauses
    are more pronounced, since the GC work is done in a single thread.

    '
