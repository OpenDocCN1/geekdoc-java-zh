    such that if the humongous regions are determined to have no incoming references,
    they can be reclaimed and returned to the list of free regions during a young
    collection. A full garbage pause will also collect completely free humongous regions.


    > Tip An important potential issue or confusion needs to be highlighted here.
    Say the current G1 region size is 2MB. And say that the length of a byte array
