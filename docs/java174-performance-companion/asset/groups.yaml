  - "[PAGE 51]\n\n# Stages of Concurrent Marking\n\nGC threads (-XX:ParallelGCThreads).\
    \ The parallel GC threads are calculated by the JVM at the start of the VM. The\
    \ concurrent threads scan a region and use the \"finger\" pointer optimization\
    \ to claim that region. This \"finger\" pointer optimization is similar to CMS\
    \ GC's optimization and can be studied in [2].\n\nAs mentioned in the RSets and\
    \ Their Importance, G1 GC also employs a pre-write barrier to perform actions\
    \ required by the SATB concurrent marking algorithm. As an application mutates\
    \ its object graph, objects that were reachable at the start of marking and were\
    \ a snapshot of marking may be overwritten before they are discovered and traced\
    \ by a marking thread. The SATB marking guarantees that the modifying mutator\
    \ thread logs the previous value of the pointer that needs to be modified, in\
    \ an SATB queue/buffer. This is called the \"concurrent marking/SATB pre-write\
    \ barrier\" since the barrier is executed before the update. The pre-write barrier\
    \ enables the recording of the previous value of the object reference so that\
    \ concurrent marking can mark through the object whose value is overwritten.\n\
    \nThe pseudo-code of the pre-write barrier for an assignment of the object x.f\
    \ = y is follows:\n\n```\nif (marking_is_active) {\n  pre_val := x.f;\n  if (pre_val\
    \ != NULL) {\n    satb_enqueue(pre_val);\n  }\n}\n```\n\nThe marking_is_active\
    \ condition is a simple check of a thread-local flag that is set to true at the\
    \ start of marking, during the initial-mark pause. Guarding the rest of the pre-barrier\
    \ code with this reduces the overhead of executing the remainder of the barrier\
    \ when marking is not active. Since the flag is thread-local and its value may\
    \ be loaded multiple times, it is likely that any individual will hit in cache,\
    \ further reducing the overhead of the barrier.\n\nThe satb_enqueue() first tries\
    \ to enqueue the previous value in a thread-local buffer, referred to as an SATB\
    \ buffer. The initial size of an SATB buffer is 256 entries, and each application\
    \ thread has an SATB buffer. If there is no room to place the pre_val in buffer\
    \ the JVM runtime is called; the thread's current SATB buffer is retired and placed\
    \ on a global list of SATB buffers, a new SATB buffer is allocated for the thread,\
    \ and the pre_val is recorded. It is the job of the concurrent marking threads\
    \ to check and process the buffers at intervals to ensure the marking of the logged\
    \ objects.\n\nThe filled SATB buffers are processed (during the marking stage)\
    \ from the global list by iterating through each buffer and marking each recorded\
    \ object by setting"
  - '[PAGE 52]


    # 36 Chapter 2 · Garbage First Collector in Depth


    the corresponding bit in the marking bitmap (and pushing the object onto a local
    marking stack if the object lies below the finger). Marking iterates over the
    set bits in a section of the marking bitmap, tracing the field references of the
    marked objects, setting more bits in the marking bitmap, and pushing objects as
    necessary.

    Live data accounting is piggybacked on the marking operation. Hence, every time
    an object is marked, it is also counted (i.e., its bytes are added to the region''s
    total). Only objects below NTAMS are marked and counted. At the end of this stage,
    the next marking bitmap is cleared so that it is ready when the next marking cycle
    starts. This is done concurrently with the mutator threads.


    > Tip

    JDK 8u40 introduces a new command-line option -XX:+ClassUnloadingWithConcurrentMarking
    which, by default, enables unloading with concurrent marking. Hence, concurrent
    marking can track classes and calculate their liveness. During the remark stage,
    the unreachable classes can be unloaded.


    Remark

    The remark stage is the final stage. During this stop-the-world stage, G1 GC completely
    drains any remaining SATB log buffers and processes any updates. G1 GC traverses
    any unvisited live objects. As of JDK 8u40, the remark stage is stop-the-world,
    since mutator threads are responsible for updating the SATB log buffers and as
    such "own" theirs. Hence, a final stop-the-world pause is necessary to cover all
    the live data and safely complete live data accounting. In order to reduce time
    spent in this pause, multiple GC threads are used to parallel the log buffers.
    The -XX:ParallelGCThreads help set the number of GC threads available during any
    GC pause. Reference processing is also a part of the remark stage.


    > Tip

    Any application that heavily uses reference objects (weak references, soft references,
    phantom references, or final references) may see high remark times as a result
    of the reference-processing overhead. We will learn more about this in Chapter
    3.


    Cleanup

    During the cleanup pause, the two marking bitmaps swap roles: the next marking
    bitmap becomes the previous one (given that the current marking cycle has been
    finalized and the next marking bitmap now has consistent marking information),
    and'
  - '[PAGE 53]


    # Evacuation Failures and Full Collection


    the previous marking bitmap becomes the next one (which will be used as the current
    marking bitmap during the next cycle). Similarly, PTAMS and NTAMS swap roles as
    well. Three major contributions of the cleanup pause are identifying completely
    free regions, sorting the heap regions to identify efficient old regions for mixed
    garbage collection, and RSet scrubbing. Current heuristics rank the regions according
    to live (the regions that have a lot of live objects are expensive to collect,
    since copying is an expensive operation) and remembered set size (again, large
    remembered sets are expensive to collect due to the regions'' popularity—the concept
    of popularity was discussed in the “RSets and Importance section”). The goal is
    to collect/evacuate the candidate regions that are deemed less expensive (fewer
    live objects and less popular) first.


    An advantage of identifying the live objects in each region is that encountering
    a completely free region (that, with no live objects), its remembered set can
    be cleared and the region can be immediately reclaimed and returned to the list
    of free regions instead of being placed in the GC-efficient (the concept of GC
    efficiency was discussed in “Garbage Collection in G1”) sorted array and having
    to wait for a reclamation (mixed) garbage collection pause. RSet scrubbing also
    helps detect stale references. So, for example, marking finds that all the objects
    on a particular card are dead, the entry for that particular card is purged from
    the “owning” RSet.


    # Evacuation Failures and Full Collection


    Sometimes G1 GC is unable to find a free region from a young region or when trying
    to copy live objects during evacuation from an old region. Such a failure is reported
    as a to-space exhausted failure in the GC logs, and the duration of the failure
    is shown further down in the log as the Evacuation Failure time (331.5ms) in the
    following example:


    ```

    111.912: [GC Evacuation Pause (young) to-space exhausted),

    0.6773162 secs]

    <S0>

    [Evacuation Failure: 331.5 ms]

    ```


    There are other times when a humongous allocation may not be able to find contiguous
    regions in the old generation for allocating humongous objects.


    At such times, the G1 GC will attempt to increase its usage of the Java heap.
    If the expansion of the Java heap space is unsuccessful, G1 GC triggers its fail-safe
    mechanism and falls back to a serial (single-threaded) full collection.'
  - '[PAGE 54]


    During a full collection, a single thread operates over the entire heap and does
    mark, sweep, and compaction of all the regions (expensive or otherwise) constituting
    the generations. After completion of the collection, the resultant heap now consists
    of purely live objects, and all the generations have been fully compacted.


    > **Tip**

    Prior to JDK 8u40, unloading of classes was possible only at a full collection.


    The single-threaded nature of the serial full collection and the fact that the
    collection spans the entire heap can make this a very expensive collection, especially
    if the heap size is fairly large. Hence, it is highly recommended that a nontrivial
    tuning exercise be done in such cases where full collections are a frequent occurrence.


    > **Tip**

    For more information on how to get rid of evacuation failures, please refer to
    Chapter 3.


    # # References


    +   [1] Charlie Hunt and Binu John. *Java™ Performance*. Addison-Wesley, Upper
    Saddle River, NJ, 2012. ISBN 978-0-13-714252-1.


    +   [2] Tony Printezis and David Detlets. “A Generational Mostly-Concurrent Garbage
    Collector.” *Proceedings of the 2nd International Symposium on Memory Management*.
    ACM, New York, 2000, pp. 143–54. ISBN 1-58113-263-8.


    +   [3] Urs Hölze. “A Fast Write Barrier for Garbage Collectors.” Presented at
    the OOPSLA93 Garbage Collection Workshop, Washington, DC, October 1993.


    +   [4] Darko Stefanovic, Matthew Hertz, Stephen M. Blackburn, Kathryn S McKinley,
    and J. Eliot B. Moss, “Older-First Garbage Collector in Practice: Evaluation in
    a Java Virtual Machine.” *Proceedings of the 2002 Workshop on Memory System Performance*.
    ACM, New York, 2002, pp. 25–36.


    +   [5] Taiichi Yuasa. “Real-Time Garbage Collection on General Purpose Machines.”
    *Journal of Systems and Software*, Volume 11, Issue 3, March 1990, pp. 181–98.
    Elsevier Science, Inc., New York.'
