    # Appendix Additional HotSpot VM Command-Line Options of Interest


    Diagnostic options tend to introduce additional overhead to normal execution and
    are generally used to investigate or diagnose unexpected behavior of the Java
    HotSpot VM or the option it is executing.


    -XX:+UnlockExperimentalVMOptions

    Sets whether flags tagged as experimental options should be allowed or not. The
    default is false.


    Similar to -XX:+UnlockDiagnosticVMOptions, there are some command-line options
    that are tagged as "experimental". These can be seen in a list of Java HotSpot
    VM command-line options using the -XX:+PrintFlagsFinal in conjunction with -XX:+UnlockExperimentalVMOptions.
    "Experimental" options have a field (experimental) command-line type listed in
    the -XX:+PrintFlagsFinal output.


    It is important to note that experimental command-line options are not part of
    the supported Java SE product—but are available for experimenting—with other capabilities
    that may be worth exploring for some user cases.


    Some experimental command-line options may be performance related features but
    may not have undergone full scrutiny or rigorous assurance testing. Yet, they
    may offer performance benefits in some use cases.


    An example of an experimental command-line option is -XX:G1NewSizePercent, which
    controls the minimum size of G1 can reduce the young generation to the Java heap
    size. It defaults to 5. In other cases, the minimum size G1 can adaptively size
    young generation is 5% of the Java heap size. For some cases where very low GC
    pause times are desired, one could experiment in a non-production environment
    setting a lower -XX:G1NewSizePercent to 1 or 2, realizing if more than one there
    is no official support.


    To use an experimental option, the -XX:+UnlockExperimentalVMOptions must be specified
    in conjunction with the command-line option. For example, if you use the -XX:G1NewSizePercent=2
    command-line, you would specify both -XX:+UnlockExperimentalVMOptions -XX:G1NewSizePercent=2.
    The -XX:+UnlockExperimentalVMOptions only needs to be specified if more than one
    experimental command-line option is desired.


    # -XX:+UnlockCommercialFeatures


    Sets whether Oracle-specific features require a license to be enabled. The default
    is false.


    There are some capabilities or features developed by Oracle that are available
    only via the Oracle runtime and are not included in OpenJDK. An example of an
    Oracle commercial feature is Java Flight Recorder, which is part of Oracle’s monitoring
    and management tool called Java Mission Control. Java Flight Recorder is a profiling
    and event collection framework that can collect and show within Java Mission Control
    low-level information about how the application and JVM are behaving.'
