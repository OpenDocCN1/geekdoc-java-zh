    # 什么是服务性代理（Serviceability Agent）？


    HotSpot 服务性代理（Serviceability Agent，简称 SA）是 JDK 中一个很少为人知的隐藏宝库。它是一组 Java API 和工具，用于调试
    Java 进程和核心文件（在 Windows 上称为崩溃转储/crash dumps）。SA 可以检查 Java 进程或核心文件，因此它适用于调试 Java
    程序以及 HotSpot VM。它是一个快照调试器，允许我们查看冻结的进程或核心文件的状态。当 SA 挂载到 Java 进程上时，它会在该点停止进程运行，以便我们探索
    Java 堆、查看在该时间点运行的线程、检查 HotSpot VM 的内部数据结构，并查看加载的类、方法的编译代码等。在从 SA 卸载后，进程将恢复运行。


    如前所述，SA 是一个快照调试器，这意味着它通过进程的快照进行工作，与通常提供单步执行运行程序程序功能的调试器不同。


    请注意，SA 运行在与目标进程独立的进程中，并且不在目标进程中执行任何代码。然而，当 SA 观察它时，目标进程会被停止。


    # 为什么我们需要 SA？


    在所有平台都已可用 dbx、gdb、WinDbg 等许多原生调试工具的情况下，为什么还要使用 SA 呢？


    首先，SA 是一个基于 Java 的平台无关工具，因此它可以在所有支持 Java 的平台上调试 Java 进程/核心文件。此外，使用原生调试器调试 Java
    进程或 Java HotSpot 虚拟机具有很大的局限性，因为它们可以检查原生操作系统的进程状态，但无法检查进程的 Java 或 JVM 状态。例如，如果我们需要查看
    Java 堆中的对象，原生调试器将向我们显示原始十六进制，而 SA 能够解释这些十六进制并呈现对象视图。SA 拥有关于 Java 堆、其边界、Java 堆中的对象、加载的类、线程对象以及
    Java HotSpot 虚拟机的内部数据结构的知识。凭借这些知识，SA 使我们能够非常容易地检查 Java/JVM 级别的进程或核心文件。


    # SA 组件


    SA 主要由 Java 类组成，但也包含少量的原生代码，用于从进程和核心文件中读取原始位信息：


    - 在 Solaris 上，SA 使用 `libproc` 从进程或核心文件中读取位信息。

    - 在 Linux 上，SA 使用 `/proc` 和 `trace`（主要是后者）从进程中读取位信息。对于核心文件，SA 直接解析可执行和可链接格式（ELF）文件。

    - 在 Windows 上，SA 使用 Windows 调试引擎接口（`dbgeng.dll` 库）从进程和核心文件中读取原始位信息。


    # JDK 中的 SA 二进制文件


    JDK 中存在两个组成 SA 的二进制文件。这些文件随 JDI 一起发布：


    - sa-jdi.jar

    - Windows上的 `sawindbg.dll`，Solaris/Linux  `libsproc.so`


    SA 组件作为 HotSpot 仓库标准构建的一部分进行构建。SA 的原生代码组件放置在 `libsproc.so` 或 `sawindbg.dll` 中，Java
    类放置在 `sa-jdi.jar` 中。


    二进制文件 `sa-jdi.jar` 提供了 SA Java API，还包含了使用这些 API 实现的实用调试工具。它包含了 Java 调试接口（JDI）的实现，允许
    JDI 客户端对核心文件和挂起的进程进行只读调试。


    # 带有 SA 二进制文件的 JDK 版本


    SA 二进制文件随以下 JDK 版本发布：


    - 所有平台上的 JDK 7 及后续版本

    - Solaris 和 Linux 上的 JDK 6u17+

    - Windows 上的 JDK 6u31+


    在这些版本之前，SA 未随 Windows 上的 JDK 发布，在 Solaris 和 Linux 的 JDK 上仅发布了部分 SA 类。列出的 JDK 版本在所有这些平台上都提供了完整的
    SA 类。


    （注：由于提供的原文后部分存在大量重复内容，译文已根据要求对核心信息进行了整合并确保不重复输出。）

    '
