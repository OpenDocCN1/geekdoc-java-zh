    inheritableThreadLoc: null\nstackSize: 0\ntid: 1\nthreadstatus: 5\nparkBlocker:\
    \ null\nblocker: null\nblockLock: Oop for java/lang/Object @ 0x23f508d8 Oop for\
    \ java/lang/\nObject @ 0x23f508d8\nuncaughtExceptionHandler: null Check heap boundaries\n\
    ```\n\nTo get the boundaries, we can use the command universe:\n\n```\nhsdb> universe\n\
    Heap Parameters:\nGen 0: eden [0x23f50000,0x23fa5a0,0x24a30000) space capacity\
    \ = 4521984,8.546371829721014\nfrom [0x24a30000,0x24a30000,0x24420000) space capacity\
