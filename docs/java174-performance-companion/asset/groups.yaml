    - Termination: time spent on termination by each worker.

    - GC Worker Other: time spent on other tasks by each worker.


    The GC Worker Total is the sum of the individual tasks. The GC Worker Start is
    the time when the first worker started, and the GC Worker End is the time when
    the last worker finished. The difference between them is the total time spent
    in the parallel phase.


    ## Remembered Sets


    The major parallel work carried out by the worker threads:


    - GC Worker Scanning: time spent scanning roots by each worker.

    - Ext Root Scanning: time spent scanning external roots by each worker.

    - Processed Buffers: time spent processing buffers by each worker.

    - Scan RS: time spent scanning remembered sets by each worker.

    - Code Root Scanning: time spent scanning code roots by each worker.

    - Object Copy: time spent copying objects by each worker.

    - Termination: time spent on termination by each worker.

    - GC Worker Other: time spent on other tasks by each worker.


    ## The Stages of a Young Collection


    In order to limit the time spent updating RSets, G1 sets a target time (-XX:MaxCPauseMillis)
    defaults to 10 percent of the time goal. After looking at the logs you realize
    that spending 10 percent of your time goal in updating RSets is undesirable, you
    can change the percentage by updating the -XX:G1UpdatingPercent command-line option.
    It is important to remember, however, that if the number of log buffers does not
    change, a decrease in RS update time will push the work onto the concurrent refinement
    threads. Also worst case, if the concurrent refinement threads cannot keep up
    with the log update rate, the Java application mutators must step in and help
    with the processing—scenario best avoided!


    The Remembered sets (RSets) track references between regions. The major parallel
    work carried out by the worker threads:


    - GC Worker Scanning: time spent scanning roots by each worker.

    - Ext Root Scanning: time spent scanning external roots by each worker.

    - Processed Buffers: time spent processing buffers by each worker.

