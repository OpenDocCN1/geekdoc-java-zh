    ## 附录


    ### 其他感兴趣的 HotSpot VM 命令行选项


    本附录列出了可能对 G1 GC 的使用或调优感兴趣的 Java HotSpot VM 命令行选项。它还包含了一些 Java™ 性能选项命令行选项中未包含或记录的命令行选项。


    对于列出的每个 VM 命令行选项，都有关于该选项作用的描述，以及何时考虑它是合适的说明。使用 HotSpot VM 命令行选项的通用建议是首先为使用该命令行选项提供合理的理由。你应该抵制仅仅因为其他人可能在其他应用程序中使用过它，或者你在博客文章中读到有人使用它就使用该命令行选项的冲动。你应该在使用该命令行选项运行
    Java 应用程序时收集性能数据，以此作为使用该命令行选项的依据。


    Hot VM 命令行选项有两种形式。首先，某些命令行选项是布尔性质的，也就是说它们通过在命令行选项名称前加上“+”或“-”字符来开启或关闭，例如 -XX:+PrintAdaptiveSizePolicy，它使用“+”字符开启并启用命令行选项
    PrintAdaptiveSizePolicy。同样，-XX:-PrintAdaptiveSizePolicy 命令行选项关闭或禁用命令行选项 PrintAdaptiveSizePolicy。


    第二种形式的 Hot VM 命令行选项接受数值值或特定关键字列表。本附录不包含后一种类型的任何命令行选项。接受数值值的前一种形式不使用


