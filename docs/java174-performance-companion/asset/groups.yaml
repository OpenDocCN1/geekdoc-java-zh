    在本章的剩余部分中，可用区域被用于识别 G1 未使用的区域。可用区域可以被使用或标记为年轻代或老年代区域。在年轻代收集后，年轻代区域未来可能被作为老年代使用。同样，在老年代区域收集后，它变为可用区域，未来可能被作为年轻代使用。


    G1 年代收集是并行“停世界”收集器。如前所述，并行“停世界”暂停会收集所有 Java 应用线程，而垃圾回收线程，且 GC 分布在多个线程中。对于其他 HotSpot
    收集器，当年轻代收集发生时，收集的是年轻代。


    > 提示

    > 描述与年轻代收集结合收集老年代子区域的术语是混合回收（mixed GC）。因此，混合回收 是一次在收集所有年轻代区域之外额外收集部分老年代区域的 GC
    事件。句话说，混合回收是正在被收集的年轻代和老年代区域的混合。


