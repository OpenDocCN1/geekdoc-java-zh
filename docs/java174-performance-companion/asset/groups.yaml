    \n## 诊断 OutOfMemoryError\n\n当 Java 堆或永久代元空间（metaspace）没有足够的空间分配新对象时，会抛出 java.lang.OutOfMemoryError。（请注意，在\
    \ JDK 8 中，永久代已被移除，取而代之的是元空间）。此时，垃圾收集器无法提供更多空间，且堆无法进一步扩展。\n\n124 第 4 章 ■ Serviceability\
