    to execute concurrently with the CMS marking threads. In Figure 1.3, the concurrent
    marking threads are the two longer black arrows, one on top of the other below
    the "Marking/Pre-cleaning" label. Once concurrent marking completes, concurrent
    pre-cleaning is executed by the CMS threads, as shown by the two shorter arrows
    under the "Marking/Pre-cleaning" label. Note that if there are enough available
    hardware threads, CMS thread overhead will not have effect on the performance
    of Java application threads. If, however, the hardware threads are saturated or
    highly utilized, CMS will compete for CPU cycles with Java application threads.
    Once concurrent pre-cleaning completes, the stop-the-world phase begins. The remark
    phase marks objects that have been missed after the initial mark and concurrent
    marking and concurrent pre-cleaning execute. After the remark phase completes,
    concurrent sweeping begins, which frees all dead object space.


