    Opening and diagnosing core files is similar to exploring processes with SA-Plugin.

    First we need to open the core file in VisualVM and then to attach that to the
    SA

    SA Plugin view. In the case of a process, we can explore objects in the Java heap,

    look at thread objects, search for values in the Java heap, and look at the compiled

    code of methods from the core file. SA-Plugin''s capability of exploring the core
