    \ A mixed collection cycle can happen only after the marking/IHOP threshold is\
    \ crossed and after the collection of a marking cycle.\n\nThere are two important\
    \ parameters that determine the total number of mixed collections in a mixed collection\
    \ cycle: -XX:G1MixedGCCountTarget and -XX:G1HeapWastePercent.\n\n- -XX:G1MixedGCCountTarget,\
    \ which defaults to 8 (JDK 8u45), is the mixed GC count target option whose intent\
    \ is to set a physical limit on the number of mixed collections that will happen\
    \ after the marking cycle is complete. G1 GC divides the total number of candidate\
    \ regions available for collection by the count and sets that as the minimum per\
    \ collection:\n  Old CSet per mixed collection = Total candidate regions / G1MixedGCCountTarget\n\
    - -XX:G1HeapWastePercent, which defaults to 5 percent (JDK 8u45) of the total\
    \ Java heap, is an important parameter that controls the amount of heap you are\
    \ willing to waste. For every mixed collection, as soon as G1 GC reaches this\
    \ waste percentage, it stops the initiation of further mixed collections. Setting\
    \ the waste percentage basically helps with limiting the waste.\n\n## Collection\
    \ Sets and Their Importance\n\nDuring any garbage collection pause all the regions\
    \ in the CSet are freed. A CSet is a set of regions that are targeted for reclamation\
    \ during a garbage collection pause. All live objects in these candidate regions\
    \ will be evacuated and the regions returned to free regions. During a collection,\
    \ the CSet can contain only young regions. A mixed collection, on the other hand,\
    \ will add all the young regions but also some old regions (based on their GC\
    \ efficiency) to its CSet.\n\n- There are two important parameters that help with\
    \ the selection of candidate old regions for the mixed collection: -XX:G1MixedGCLiveThreshold\
    \ and -XX:G1CSetRegionThreshold.\n- -XX:G1MixedGCLiveThreshold, which defaults\
    \ to 85 percent (JDK 8u45) of a G1 region, is a liveness threshold and a set limit\
    \ to exclude the most expensive of old regions from the CSet of mixed collections.\
    \ G1 GC sets a limit such that any old region that falls below this liveness threshold\
    \ is included in the CSet.\n- -XX:G1CSetRegionThreshold, which defaults to 10\
    \ percent (JDK 8u45) of the total Java heap, sets the maximum limit on the number\
    \ of old regions that can be collected per mixed collection pause. The threshold\
    \ is dependent on the total Java heap available to the JVM process and is expressed\
    \ as a percentage of that heap.\n\n## Remembered Sets and Their Importance\n\n\
    A generational collector segregates different areas in the heap according to the\
    \ age of those objects. These different areas in the heap are referred to as generations.\
    \ The generational collector can then concentrate most of its collection effort\
    \ on the most recently allocated objects because it expects to find most of them\
    \ sooner rather than later. These generations in the heap can be collected independently.\
    \ The independent collection helps lower the response times since the GC doesn't\
    \ have to scan the entire heap (e.g., in the case of copying generational collectors);\
    \ older long-lived objects don't have to be copied back and forth, thus reducing\
    \ the copying and reference updating overhead.\n"
