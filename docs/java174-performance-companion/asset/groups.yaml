    # Oop Inspector


    We can inspect the Java objects as well as the VM internal C++ structures using
    this panel. All the Java objects in the HotSpot VM are represented as oops—ordinary
    object pointers. The Oop Inspector shows details of oops. To see all the internal
    fields of any Java object provides great debugging help. This panel also provides
    the ability to compute the liveness of any oop in the Java heap. An example of
    the Oop Inspector panel is shown in Figure 4.39.


    # Code Viewer


    This panel shows the bytecodes of a method and the JIT compiler-generated machine
    code of the method if has been compiled. See Figure 4.40 and 4.41 for examples
    of the Code Viewer panel. Figure 4.40 shows the bytecodes of a method, and Figure
    4.41 shows the JIT compiler-generated machine code for the compiled method.'
