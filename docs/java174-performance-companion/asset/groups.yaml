    # Concurrent Marking in G1 GC


    With the introduction of G1 GC regions and liveness accounting per region, it
    became clear that an incremental and complete concurrent marking algorithm was
    required. Taiichi Yuasa presented an algorithm for incremental marking and sweep
    G1 GC in which he employed a "snapshot-at-the-beginning" (SATB) marking algorithm
    [5]. Yuasa''s SATB marking optimization on the concurrent marking phase of the
    mark-sweep GC. The SATB marking algorithm was well suited for G1''s regional heap
    structure and addressed a major concern about the HotSpot JVM GC—the potential
    for lengthy pauses


    G1 GC establishes a marking threshold which is as a percentage of the total Java
    heap and defaults to 45 percent. This can be set at the command line -XX:InitiatingHeapOccupancyPercent
    (IHOP) option, when crossed, will initiate the concurrent marking cycle. The marking
    task is divided into chunks that most of the work is done concurrently while the
    mutator threads are active. The goal is to have the Java heap marked before it
    reaches its full capacity.


    The SATB algorithm simply creates an object graph that is a logical "snapshot"
    of the heap. Marking guarantees that all garbage objects that are present at the
    start of the concurrent marking phase will be identified by snapshot. Objects
    allocated during the concurrent marking phase will be considered live, but they
    are not traced, reducing the marking overhead. The technique guarantees that all
    live objects that were alive at the start of the marking phase are marked and
    traced, and any new allocations made by the mutator threads during the marking
    cycle are live and consequently not collected.


    The marking data structures contains two bitmaps: previous and next. The previous
    bitmap holds the last complete marking information. The current marking cycle
    creates and updates the next bitmap. As time passes, the previous marking information
    becomes more and more stale. Eventually, the next bitmap will replace the previous
    bitmap at the completion of the marking cycle.


    Corresponding to the previous mark-start and the next bitmap, each G1 GC region
    has two top-at-mark (TAMS) fields respectively previous TAMS (or PTAMS) and next
    TAMS (or NTAMS). The TAMS fields are useful in identifying objects allocated during
    a marking cycle.'
