    java -cp $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.tools.DumpJFR <pid>

    ```


    将 DumpJFR 附加到核心文件以提取 Java Flight Recorder 信息：


    ```

    java -cp $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.tools.DumpJFR <java> <core>

    ```


    DumpJFR 工具将 JFR 数据转储到当前工作文件夹下的 recording.jfr 文件。该记录文件可以使用 Mission Control 进行分析。


    ## JSDB


    JavaScript 调试器（JavaScript Debugger）为 SA 提供了一个接口。它是基于 Mozilla Rhino 引擎的命令行调试器。


    ```

    java -classpath %JAVA_HOME%\lib\sa-jdi.jar

    sun.jvm.hotspot.tools.soql.JSDB 5684

    Attaching to process ID 5684, please wait...

    Debugger successfully.

    Client compiler detected.

    JVM version is 24.0-JSDB

    jsdb>

    ```


    关于此更多细节可以在 Hot HotSpot 中的 hotspot/agent/doc/jsdb.html 文件中找到。


    ## 核心转储 (Core Dump) 或崩溃转储文件


    我们已经讨论了 Unix 系统上的 core 文件和 Windows 系统上的 crash dump 文件。以下是对这些转储文件的简要介绍。


    核心转储文件或 crash dump 文件是二进制文件，由运行程序在特定时间的状态组成。当程序由于违反操作系统或硬件的保护机制而意外终止时，通常会创建一个
    core 文件。操作系统会杀死程序并创建一个 core 文件，程序员后来可以使用它来查明问题所在。它包含了程序死亡时的状态详细描述。


    也可以从运行中的（非崩溃的）程序随时创建 core/crash dump 文件。在 Solaris/Linux 上，有一个名为 gcore 的工具，可以将运行中或挂起的进程状态转储到文件中。在
    Windows 上，使用 WinDbg、userdump 或 ADPlus 来收集 crash dump 文件。


    每当难以调试活动进程时，core dump 文件对于诊断和调试 Java 程序中的问题非常有用。


    ## 调试传输的核心文件


    有时 core 文件是在一个系统（核心主机）上创建的，而我们需要在另一个系统（调试器主机）上对其进行调试。原生调试器（dbx, gdb）以及 SA 并不总是能成功打开传输的核心文件，原因是产生核心文件的系统与我们尝试调试的系统之间的内核和共享库不匹配。


    '
