    # Connect to Debug Server


    This feature is very useful for the remote debugging of processes or core files
    when it is not possible to do so on the same machine as the SA. With this feature,
    we can run the debug server on the remote machine where the process/core is present
    and then connect the SA tools to remotely running debug server. We need to perform
    the following steps on the remote machine to start the debug server:


    +   Start the RMI registry with sa-jdi.jar in the classpath:


    ```

    $JAVA_HOME/bin/rmregistry -jXbootclasspath:p:${JAVA_HOME}/lib/sa-jdi.jar

    ```


    This command creates and starts a remote object registry. One can specify a port
    number at which this registry should be started. If no port number is specified,
    the registry is started on port 1099.


    +   Start the debug server on the remote machine, specifying the process or core
    file to be debugged:


    ```

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.DebugServer
    <pid> [uniqueID]


    or

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.DebugServer
    -pathname to the core executable that produced the core file><pathname to debug>
    [uniqueID]

    ```


    uniqueID is an optional string. If we want to run more than one debug server at
    the same time on the same machine, we must specify a different uniqueID for each
    debug server. The debug server starts the RMI registry at the default port 1099
    if the RMI registry was not already started.


    Now, let''s start a Java process on a Solaris SPARC machine, attach a debug server
    to it, and then connect to that debug server from a Windows machine.


    +   Start the Java process:


    ```

    myserver% ja TestClass &\n27813

    ```'
