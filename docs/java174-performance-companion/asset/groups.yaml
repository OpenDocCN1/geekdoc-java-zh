    # The Serviceability Agent debugging Debugging Tools


    There are two main SA Debugger tools that are implemented using the Serviceability
    Agent APIs: HotSpot Debugger (HSDB) and Command-Line HotSpot Debugger (CLHSDB).
    HSDB is the top-level GUI program offering many visual utilities that help in
    debugging the HotSpot VM. CLHSDB is the command-line variant of HSDB. When debugging
    remote core dumps, it is much easier to work with the command-line HSDB than with
    the GUI HSDB tool.


    # HSDB


    HotSpot Debugger is the main GUI tool. It facilitates examining a Java process,
    core file, and also a remote Java process. Let''s see how we can launch and use
    it on a Windows machine.


    First, let''s set the JAVA_HOME environment variable to the folder the JDK that
    we want to use is installed so that we can use this variable wherever we need
    to access files/folders in that JDK:


    ```

    set JAVA_HOME=d:\Java\tu40

    ```


    On Windows, the PATH environment variable should contain the location of the JVM
    binary used by the process/core and also the folder where Microsoft Debugging
    Tools for Windows is installed on the machine, for example:


    ```

    set PATH=%JAVA_HOME%\bin;server:d:\windbg;PATH%

    ```


    Now we can launch HSDB using the following command:


    ```

    %JAVA_HOME%\bin\java -classpath%JAVA_HOME%\lib\sa-jdi.jar

    sun.jvm.hotspot.HSDB

    ```


    On Solaris and Linux, we just need to set JAVA_HOME to point to the installed
    JDK and then launch the tool in the following:


    ```

    JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.

    HSDB

    ```


    These launch commands bring up the HSDB GUI tool as shown in Figure 4.1.'
  md: "\n# What Is the Serviceability Agent?\n\nThe HotSpot Serviceability Agent is\
    \ a hidden treasure present in the JDK that very few people know about. It is\
    \ a set of Java APIs and tools that can be used to debug Java processes and core\
    \ files (aka crash dumps on Windows). The SA can examine Java processes or core\
    \ files, which makes it suitable for debugging Java programs as well as the HotSpot\
    \ VM. It is a snapshot debugger that lets us look at the state of a frozen process\
    \ or a core file. When the SA is attached to a Java process, it stops the process\
    \ at that point so we can explore the Java heap, look at the threads that are\
    \ running at that point, examine internal data structures of the HotSpot VM, and\
    \ look at the loaded classes, compiled code of methods, and so on. The process\
    \ resumes after the SA is detached from it.\n\nAs mentioned before, the SA is\
    \ a snapshot debugger, which means that it works with the snapshot of a process,\
    \ unlike the usual debuggers that provide the facility to step through a running\
    \ program.\n\nNote that the SA runs in a separate process from the target process\
    \ and executes no code in the target process. However, the target process is halted\
    \ while the SA observes it.\n\n# Why Do We Need the SA?\n\nWhy use the SA when\
    \ we have native debugging tools like dbx, gdb, WinDbg, and many others available\
    \ on all the platforms?\n\nFirst, the SA is a Java-based platform-independent\
    \ tool, so it can be used to debug Java processes/cores on all the platforms where\
    \ Java is supported. Additionally, debugging a Java process or the Java HotSpot\
    \ Virtual Machine with native debuggers is very limiting as they can examine the\
    \ native OS process state but not the Java or the JVM state of the process. For\
    \ example, if we need to view the objects in the Java heap, native debuggers would\
    \ show us the raw hex numbers, whereas the SA has the ability to interpret these\
    \ hex numbers and present the object view. The SA has the knowledge about the\
    \ Java heap, its boundaries, objects in the Java heap, loaded classes, thread\
    \ objects, and internal data structures of the Java HotSpot Virtual Machine. Empowered\
    \ with this knowledge, the SA makes it very easy for us to examine the Java/JVM-level\
    \ process or core.\n\n# SA Components\n\nThe SA consists mostly of Java classes,\
    \ but it also contains a small amount of native code to read raw bits from the\
    \ processes and the core files:\n\n- On Solaris, SA uses libproc to read bits\
    \ from a process or a core file.\n- On Linux, SA uses a /proc and trace (mostly\
    \ the latter) to read bits from a process. For core files, SA parses Executable\
    \ and Linkable Format (ELF) files directly.\n- On Windows, SA uses the Windows\
    \ Debugger Engine interface (dbgeng.dll library) to read the raw bits from the\
    \ processes and core files.\n\n# SA Binaries in the JDK\n\nThere are two binaries\
    \ present in the JDK that make up the SA. These binaries are shipped with the\
    \ JDI:\n\n- sa-jdi.jar\n- sawindbg.dll on Windows, libsaproc.so on Solaris/Linux\n\
    \nSA components are built as part of the standard build of the HotSpot repository.\
    \ The native code component of SA is placed in libsaproc.so or sawindbg.dll, and\
    \ the Java classes are placed in sa-jdi.jar.\n\nThe binary sa-jdi.jar provides\
    \ the SA Java APIs and also includes useful debugging tools implemented using\
    \ these APIs. It also includes an implementation of the Java Debugger Interface\
    \ (JDI), which allows JDI clients to read-only debugging on core files and hung\
    \ processes.\n\n# JDK Versions with Complete SA Binaries\n\nSA binaries are shipped\
    \ with the following JDK releases:\n\n- JDK 7, and later releases on all platforms\n\
    - JDK 6u17+ on Solaris and Linux\n- JDK 6u31+ on Windows\n\nPrior to these versions,\
    \ the SA was not shipped with the JDK on Windows, and only a subset of SA classes\
    \ was shipped with JDKs on Solaris and Linux. The JDK versions listed make the\
    \ complete set of SA classes available on all of these platforms.\n\n# How the\
    \ SA Understands HotSpot VM Data Structures\n\nThere is a file src/vm/runtime/vmStructs.cpp\
    \ in the HotSpot source base that defines a VMStructs class that contains declarations\
    \ of each HotSpot class and its fields, as well as the declarations of the processor-dependent\
    \ items such as registers, sizeof types, and so on. The SA understands the Java\
    \ objects and HotSpot data structures with the help of the declarations in this\
    \ file.\n\nAs an example, in the file src/vm/oops/cpCacheOop.hpp we have the following:\n\
    \n```cpp\n: constantPoolCacheOopDesc: public arrayOopDesc\nfriend class VMStructs;\n\
    private:\n  // the corresponding constant pool\n  constantPool1op_constant_pool;\n\
    :\n```\n\nIn vmStructs.cpp, the _constant_pool field is declared as\n\n```cpp\n\
    nonstatic_field(constantPoolCacheOopDesc, _constant_pool,\nconstantPool1op)\n\
    ```\n\nFrom the _constant_pool field in the file vmStructs.cpp, the SA knows there\
    \ is a class named constantPoolCacheOopDesc that has a field with the name _constant_pool\
    \ of type constantPool1op in the Java HotSpot VM.\n\n# HotSpot Data Structure\
    \ Definitions\n\nThere are a couple of noteworthy definitions to explain here.\
    \ A constant pool is a table of structures representing various numeric and string\
    \ constants, and interface names, field names, and other constants that are referred\
    \ to within the class and its subclasses, and an oop (ordinary object pointer)\
