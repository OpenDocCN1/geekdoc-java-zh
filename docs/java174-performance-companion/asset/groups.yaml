    # 可维护性代理（Serviceability Agent）的系统属性


    有一些系统属性可以定义 SA 工具的运行时行为。这些如表 4.2 所示。


    表 4.2 可维护性代理系统属性


    | 系统属性 | 备注 | 适用平台 |

    | --- | --- | --- |

    | sun.jvm.runtime.disableVersionCheck | 禁止 SA 工具相对于正在分析的 HotSpot 版本的检查。 | 所有 |

    | sun.jvm.hotspot.debugger.useProcDebugger (仅适用于 JDK 6 及其更新) | 告诉 SA 使用 /proc
    接口从核心文件/进程中读取位。另一个接口使用 dbx 作为后端挂载到进程/核心文件并读取数据。此属性仅适用于 JDK 6 中的 SA，且在 JDK 7 中不存在。
    | Solaris |

    | sun.jvm.hotspot.debugger.useWindDebugger (仅适用于 JDK 6 及其更新) | 告诉 SA 使用 Windows
    调试引擎 (dbg.dll) 接口从进程和崩溃转储（crash dumps）中读取位。该接口仅适用于活动进程，并通过 socket 与 Windows 调试服务器
    (FwDbgSvr) 通信以实现附加/剥离以及从进程内存中读取位。此属性仅适用于 JDK 6 中的 SA，且在 JDK 7 中不存在。WinDbg 是 JDK
    7 中的默认原生接口。 | Windows |

    | sun.jvm.hotspot.debugger.imagePath | 设置 Windows 上的 SA 查找 .exe 和 .dll 文件的路径。
    | Windows |

    | sun.jvm.hotspot.debugger.windbg.symbolPath | 设置 Windows 上的 SA 查找 .pdb 和 .dbg
    符号文件的路径。 | Windows |

    | sun.jvm.hotspot.debugger.windbg.disableNativeLookup | 指定 Windows 上的 SA 应该解析
    Java 代码中的 DLL 符号表还是使用 WinDbg 的查找功能。默认情况下，SA 使用原生查找，以便在可用时利用 .pdb 文件。 | Windows
    |


    # 第 4 章 · 可维护性代理（The Serviceability Agent）


    | 系统属性 | 备注 | 适用平台 |

    |---|---|--|

    | sun.jvm.hotspot.loadLibrary.DEBUG | 在 Windows 平台上启用关于原生库加载的调试信息打印。 | Windows
    |

    | sun.jvm.hotspot.tools.jcore.filter | 指定我们想要从目标 VM 转储（dump）的类名。 | 所有 |

    | sun.jvm.hotspot.tools.jcore.pkgList | 指定由逗号分隔的包列表，我们想要从这些包中转储类。 | 所有 |

    | sun.jvm.hotspot.tools.jcore.outputDir | 指定转 的输出目录。 | 所有 |


    # 可维护性代理的环境变量


    有一些环境变量可以用来定义 SA 的运行时行为。它们如表 4.3 所示。


    | 环境变量 | 备注 | 适用平台 |

    |---|---|---|

    | SA_ALTROOT | 设置调试器宿主机上包含共享库的目录。 | Solaris |

    | LIBS_DEBUG | 在打开核心文件时，启用关于共享库的调试信息打印。 | Solaris |

    | SA_IGNORE_THREAD | 在打开核心文件时，SA 忽略的线程。 | Solaris |


    # JDI 实现


    SA 使用 JDI（Java Debug Interface）来调试核心文件。核心宿主机上的调试器可以通过 JDI 挂载到进程/核心文件。`attach()`
    方法返回的对象是只读的。


    # SA 核心连接器（Core Attaching Connector）


    该连接器允许应用程序调试核心文件。该连接器由 `sun.jvm.hotspot.jdi.SACoreAttaching` 唯一标识。它允许调试核心文件。


    使用该连接器可以调试核心文件：


    ```

    $CORE_FILE=/path/to/core sun.jvm.hotspot.jdi.SACoreAttaching:core=$CORE_FILE

    ```


    # SA 调试服务器附加连接器（Debug Server Attaching Connector）


    该连接器允许应用程序调试调试器运行机器的进程或核心文件。该连接器使用远程方法调用（RMI）与远程机器上的调试服务器通信。在调用此连接器的 `attach()`
    方法之前，必须在远程机器上启动调试服务器。在远程机器上需要执行以下操作：


    - 带有 sa-jdi.jar 启动 RMI 注册：


    ```

    ${JAVA_HOME}/bin/rmiregistry -Xbootclasspath:${JAVA_HOME}/lib/sa-jdi.jar

    ```

    此命令创建并启动了一个远程对象注册。可以指定注册启动的可选端口号。如果没有指定，注册将在端口 1099 上启动。


    - 在远程机器上启动调试服务器，指定要调试的进程或核心文件：


    ```

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.jdi.SDebugServer
    <pid> [uniqueID]

    ```


    或者


    ```

    ${JAVA_HOME}/bin/java -classpath ${JAVA_HOME}/lib/sa-jdi.jar sun.jvm.hotspot.jdi.SDebugServer
    <产生核心文件的 java 可执行文件路径> <要调试的核心文件路径> [uniqueID]

    ```

    如果注册尚未运行，SA 调试服务器会在端口 1099 启动 RMI 注册。


