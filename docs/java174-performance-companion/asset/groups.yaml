    # 消除共享库问题


    那么，我们如何在使用 SA 传输核心文件（core files）时遇到的共享库问题呢？以下是我们可以消除这些问题的方法：


    - 1. 将程序使用的从核心宿主机（core host）的所有库拷贝到调试器宿主机，例如拷贝到 `/space/corelibs/`。注意，库可以直接拷贝到
    `/space/corelibs/` 下，也可以拷贝到 `/space/corelibs/` 下的完整目录路径。例如 `/local/java/jre/bin/bin/server/libjvm`。因此，从核心宿主机，它可以直接拷贝到
    `/space/corelibs/` 以及 `/space/corelibs/local/java/jre/bin/lib/server/`。同样，`/usr/lib/libthread.db`
    也可以从核心宿主机拷贝到调试器宿主机上的 `/space/corelibs/` 或 `/space/corelibs/usr/lib/`。

    所需的库文件列表可以从 `hs_err` 日志文件的“Dynamic Libraries”（动态库）部分获取，也可以使用 gdb、dbx 和 WinDbg
    等原生调试器获取。

    - 2. 然后，将 SA 环境变量 `SA_ALTROOT` 设置为调试器宿主机上包含共享库的文件夹：`setenv SA_ALTROOT=/space/corelibs/`。


    现在，对于上一节中尝试打开的 `core file.16963`，我们从核心宿主机将所有所需的库拷贝到我们想要用 SA 打开核心文件的系统中，然后设置环境变量
    `SA_ALTROOT`：


    ```bash

    bash-3.2$ export SA_ALTROOT=/space/corelibs/

    bash-3.2$ JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar

    sun.jvm.hotspot.CLHSDB $JAVA_HOME/bin/java.core.16963

    Opening core file, please wait...

    hsdb

    universe

    Heap Parameters:

    Parallel10aveHeap [ PSYoungGen [ eden =

    [0000000000ea0000,0000000000ea0000,00000000faa80000],], from =

    [00000000faa80000,00000000fb64975], to =

    [00000000fd540000,00000000fd540000,0000000010000000] ]] PS1OlddGen [

    [00000000fe6a0000,00000000be12010,00000000

    00deea00000]] ]] PSermGen [

    [00000000bac00000,00000000bc0942c0,00000000bc200000] ]] ]

    hsdb

