    ```


    如果任何（或所有）工作线程在某处被阻塞，将体现在长时间的终止时间内，并可能指示工作选取或负载均衡问题。


    ## GC 之外的并行活动


    终止标志着迁移/收集期间工作线程并行活动的结束。日志片段中的下一行标记为 GC Worker Other，是在并行阶段内但不属于到为止描述的任何“常规”并行活动的时间。尽管被归于“GC
    时间”，但它很容易被 GC 暂停并行期间发生的 GC 之外活动占用。在此期间 GC 线程是停止的。当由于收集器选项导致 JVM 活动编译工作增加时，我们看到
