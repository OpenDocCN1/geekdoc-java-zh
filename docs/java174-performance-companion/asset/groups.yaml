    ## 第3章 · 垃圾回收器性能调优


    一个 G1 并发周期在老年代占用率超过阈值时触发，该阈值由 InitiatingHeapOccupancyPercent 设置。当触发并发周期时，G1 会标记老年代中的对象。

    - XX:InitiatingHeapOccupancyPercent：触发并发标记的堆占用百分比。默认值为 45%。降低此值可以触发更频繁的标记，但可能会增加开销。

    - XX:G1ConcInterval：设置并发周期之间的最小时间（秒）。默认值为 8。增加此值可以减少开销，但可能导致规避失败。

    - XX:G1ConcPercent：设置标记期间允许回收的堆百分比。默认值为 5%。增加此值可以帮助减少规避失败风险。

