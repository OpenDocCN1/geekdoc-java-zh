    G1 使用多个并发标记线程。为了避免占用应用程序线程过多的 CPU 资源，标记线程以突发性的方式工作。它们在给定的时间槽内尽可能多完成工作，然后暂停一段时间，让
    Java 线程执行。


    ## 大对象 (Humongous Objects)


    G1 对大对象分配进行了特殊处理，即 G1 所说的“大对象”。如前文所述，大对象是指大小至少占区域大小（region size） 50% 的对象。该大小包含了
    Java 对象头（object header）。头部的大小在 32 位和 64 位 HotSpot VM 之间有所不同。在给定的 HotSpot VM 中，特定对象的头部大小可以使用
    Java Layout 工具（也称为 JOL）获取。截至目前，可以在互联网上找到该 Java 对象布局工具 [2] 。


    当发生大对象分配时，G1 会定位一组连续的区域，其内存总和能够足够容纳该大对象。第一个区域被标记为“大对象起始”（humongous start）区域，其他区域被标记为“大对象继续”（humongous
    continues）区域。如果没有足够的连续区域，G1 将执行全 GC 以回收 Java 堆。


    大对象区域被视为老年代内存的一部分，但它们只包含一个对象。这一属性允许 G1 在并发标记阶段检测到该区域不再存活时，能够积极回收该大对象区域。当这种情况发生时，包含该大对象的所有区域都可以一次性被回收。


    G1 的一个挑战是，短命的大对象可能在它们不再被使用很久之后才被回收。JDK 8u40 实现了一种方法，在某些情况下可以在年轻代收集期间回收大对象区域。在使用
    G1 时，避免频繁分配大对象对于实现应用程序性能目标至关重要。JDK 8u40 提供的增强虽然有所帮助，但可能并不是所有具有许多短命大对象的应用程序的解决方案。


    ## 全垃圾收集 (Full Garbage Collections)


    G1 中的全 GC 使用与 Serial GC 收集器相同的算法实现。当发生全 GC 时，会对整个 Java 堆进行完全压缩（compaction）。这确保了系统可以获得最大可用内存。需要注意的是，G1
    中的全 GC 是单线程的，因此可能会导致极长的停顿时间。此外，G1 的设计目标是不预期需要全 GC。G1 应该能够在不需要全 GC 的情况下满足应用程序的性能目标，并且通常可以通过调整使得不需要全
    GC。


    ## 并发周期 (Concurrent Cycle)


    G1 的并发周期包括几个阶段的活动：初始标记、并发根扫描、并发标记、重新标记（remark）和清理（cleanup）。并发周期的开始是初始标记，结束阶段是清理。除了清理阶段外，所有这些阶段都被认为属于“标记存活对象图”的一部分。


    初始标记阶段的目的是收集所有的 GC 根。根是对象图的起点。为了收集来自应用程序线程的根，必须停止这些线程；初始标记阶段是停顿世界（stop-the-world）。在
    G1 中，初始标记是在年轻代 GC 停顿期间完成，因为年轻代 GC 必须收集所有的根。


    标记操作还需要扫描并追踪幸存区（survivor regions）中对象的所有引用。这就是并发根扫描阶段的工作。在此阶段，所有 Java 线程都允许继续执行，因此不会发生应用程序停顿。唯一的限制是扫描必须在下一次
    GC 启动之前完成。这是因为新的 GC 将产生一组与初始标记存活对象不同的对象。


    大部分标记工作是在并发标记阶段完成的。多个线程协作标记存活对象图。所有 Java 线程允许与并发标记线程同时执行，因此应用程序没有停顿，尽管应用程序可能会经历一些吞吐量下降。


    并发标记完成后，需要另一个停顿世界阶段来完成所有标记。此阶段被称为“重新标记”（remark）阶段。


    并发标记的最后一个阶段是清理阶段。在此阶段，所有发现包含存活对象的区域将被回收。这些区域不包含在年轻代或混合 GC 中，因为它们不包含存活对象。它们被添加到可用区域列表中。

