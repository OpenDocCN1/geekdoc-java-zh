    [Ref Enq: 0.3 ms]

    [Dirty Cards: 0.7 ms]

    [Humongous Reclaim: 0.0 ms]

    [Free Cset: 0.5 ms]

    ```


    Ref Proc 是处理引用的时间，Ref Enq 是队列引用的时间。如所示，Ref Enq 的时间与 Ref Proc 相当。我们还没有看到哪个应用的 Ref
    Enq 时间一直更高。如果发生，意味着处理引用的工作量相对于入队时间很小。


    G1 在并发周期后的 remark 期间报告处理活动。使用 -XX:PrintGCDetails，日志输出将包含引用时间：


