    Past studies of these humongous objects have indicated that the allocation of
    such objects are rare and the objects themselves are long-lived. Another good
    point to remember is that the humongous regions need to be contiguous (as shown
    in Figure 2.2). Hence it makes no sense to move them since there is no gain (no
    space reclamation), and it is very expensive since large memory copies are not
    trivial in expense. Hence, in an effort to avoid the copying expense of these
    humongous objects during young garbage collections, it was deemed better to directly
    allocate the humongous objects out of the old generation. In recent years, there
    are many transaction-type applications that may have not-so-long-lived humongous
    objects. Hence, various efforts are being made to optimize the allocation and
    reclamation of humongous objects.'
