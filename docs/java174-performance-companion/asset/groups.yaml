    # 记忆集及其重要性


    序列化可能非常昂贵，应用程序的吞吐量会随着屏障代码（barrier code）复杂性的增加而下降；因此，G1 GC 仅完成最少的工作来确定引用更新是否为跨区域更新，因为跨区域引用更新需要记录在所属区域的
    RSet（记忆集）中。对于 G1 GC，屏障代码包含了一种在“实践中的老年代优先垃圾回收”[4] 中简要讨论的过滤技术，该技术涉及一个简单的检查，当更新发生在同一区域时，该检查的结果为零。下面的伪代码说明了
    G1 GC 的写屏障：


    ```

    (&object.field XOR &some_other_object) >> RegionSize

    ```


    每当发生跨区域更新时，G1 GC 都会将相应的卡（card）存入一个名为“更新日志缓冲区”（update log buffer）或“脏卡队列”（dirty
    card queue）的缓冲区。在我们的更新示例中，包含对象的卡被记录在更新日志缓冲区中。


    > 提示

    并发精炼（concurrent refinements）是专门用于维护记忆集的线程，它们通过扫描已填充的日志缓冲区中的已记录卡，并更新这些区域的记忆集。精炼线程的最大数量由
    -XX:G1ConcRefinementThreads 决定。从 JDK 8u45 开始，-XX:G1ConcRefinementThreads 未在命令行中设置，而是通过工程手段设置为与
    -XX:ParallelGCThreads 相同。


    一旦日志缓冲区达到容量，它就会被退用并分配一个新的日志缓冲区。卡的入队操作将命中这个新缓冲区。退用的缓冲区被放置在全局列表中。一旦精炼线程在全局列表中找到条目，它们就会开始并发处理这些退用的缓冲区。精炼线程始终处于激活状态，最初只有少数线程可用。G1
    GC 以分层方式处理并发精炼线程的部署，增加线程以应对填充日志缓冲区数量。激活阈值由以下标志设置：-XX:G1RefinementGreenZone、-XX:G1ConcRefinementYellowZone
    和 -XX:G1ConcRefinementRedZone。如果并发精炼线程跟不上填充缓冲区的数量，则变器线程（mutator threads）将被征用来帮忙。在这种情况下，变器线程将停止工作并帮助并发精炼线程完成对填充日志缓冲区的处理。在
    GC 术语中，变器线程是指 Java 应用程序线程。因此，当并发精炼线程跟不上填充缓冲区的数量时，Java 应用程序将暂停，直到填充日志缓冲区被处理。因此，应该采取措施避免这种情况。


    # 30 第2章 深度解析 Garbage First 垃圾回收


    > 提示

    用户不需要手动调优任何精炼区域。在极少数情况下，调整 -XX:G1ConcRefinementThreads 或 -XX:ParallelGCThreads
    可能是有意义的。第三章将介绍更多关于并发精炼和精炼线程的内容。


