    ## Chapter 3 · Garbage First Collector Performance Tuning


    A G1 concurrent cycle is triggered when the occupancy of the old generation exceeds
    the threshold. The threshold is set by -XX:InitiatingHeapOccupancyPercent. When
    a cycle is triggered, G1 starts the concurrent marking phase to identify live
    objects in the old generation.


    - -XX:InitiatingHeapOccupancyPercent: This sets the percentage of the heap usage
    that triggers a concurrent marking cycle. The default value is 45 percent. Lowering
    this value can trigger more frequent marking cycles, which may help avoid evacuation
    failures but may increase CPU overhead. Increasing it can reduce the frequency
    of cycles but increase the risk of evacuation failures.

    - -XX:G1ConcInterval: This sets the minimum number of seconds between successive
    concurrent marking cycles. The default value is 8. Increasing this value can reduce
    the overhead of marking cycles but may also lead to evacuation failures.

    - -XX:G1ConcPercent: This sets the percentage of the heap that must be reclaimed
    during a concurrent marking cycle. The default value is 5 percent. Increasing
    this value can help reclaim more space in each cycle but may also impact the application
    performance.

    - -XX:G1MixedOPTarget: This sets the target number of mixed GC pauses to perform
    after a concurrent marking cycle. The default value is 4. Increasing this value
    can lead to more mixed GC pauses and may increase the total pause time.

    - -XX:G1MixedGCCountTarget: This sets the maximum number of mixed GC pauses to
    perform after a concurrent marking cycle. The default value is 8. Increasing this
    value can help reclaim more space but may also increase the total pause time.

    - -XX:G1MixedReservePercentPercent: This sets the target percentage of free space
    to be kept for mixed GCs. The default value is 10 percent. Increasing this value
    can help avoid evacuation failures but may also reduce the amount of available
    space.

    - -XX:G1OldSurvivorOccupancyPercent: This sets the maximum percentage of old generation
    occupancy that will trigger a new mixed GC cycle. The default value is 85 percent.
    Increasing this value can help reclaim more space but may also increase the risk
    of evacuation failures.

    - -XX:G1AdaptiveSurvivorThreshold: This sets the maximum number of times an object
    must survive before it is promoted to the old generation. The default value is
    15. Lowering this value can help reclaim more space but may also increase the
    total pause time.


    ## Observing Reference Processing


    In this section, you will learn how to identify if the time spent processing reference
    objects is an issue and how to tune it. G1 also processes reference objects during
    the remark phase. Using -XX:+PrintGCDetails, the log output from remark will include
    time time for reference objects.


    As the example shows, the time spent in Ref Enq is as long as the time spent in
    Ref Proc. In fact, we have yet to see an application that consistently has higher
    Ref Enq times. If it happens, it means the amount of effort to process a reference
    is very small relative to its enqueuing time. G1 is the only HotSpot GC that reports
    reference processing times with -XX:+PrintGCDetails. However, all HotSpot GCs
    will report per-reference-object-type information using -XX:+PrintReferenceGC.


