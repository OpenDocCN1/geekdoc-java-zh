    # 并发标记可调优参数


    对于 G1，可调的 -XX:InitiatingOccupancyPercent=n（此处 n 为总堆大小的45%，考虑了老年代占用率，包括大对象）有助于启动并发标记周期。与
    CMS 基于老年代大小启动标记标记周期不同，G1 的这种比例是相对于整个堆大小的。并发标记周期从初始标记停顿（即“附加在年轻代收集之后”）开始，该停顿是标记的开始，随后是根扫描、并发标记、最终标记和清理。图
    3.1 显示了标记周期中的所有停顿：初始标记、最终标记和清理。更多关于标记周期的信息请参考第 2 章。


