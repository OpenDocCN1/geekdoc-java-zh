    # Appendix ■ Additional HotSpot VM Command-Line Options of Interest 153


    The dynamic resizing of the PLABs in G1 has been shown to cause some performance
    issues. For some applications, disabling the resizing of thread-local promotion
    buffers can improve performance by reducing the duration the G1 GC causes.


    # - XX:+ResizeTLAB


    Sets whether the thread-local allocation buffers that the Java application threads
    use for Java object allocations should be resized dynamically or have a static
    fixed size. The default is true.


    In most cases the TLAB resizing improves performance by reducing contention in
    the allocation path. Contrary to the PLAB sizing, it is not common to see that
    this is off for performance. Hence, for almost all applications, it is best to
    leave this command-option enabled, which again is its default.


    # - XX:+ClassUnloadingWithConcurrentMark


    Turns class unloading during G1 concurrent cycles, the concurrent collection of
    old generation. The default is true.


    Normally it is beneficial to be able to unload unreachable classes during G1 current
    cycles rather than relying on G1 GCs to do so. The unloading of classes during
    G1 concurrent cycles can sometimes increase G1 remark GC times. If G1 remark pause
    times are higher than can be tolerated to meet GC pause time goals, and few classes
    are expected to be unreachable, it may be beneficial to disable this option, that
    is, XX:-ClassUnloadingWithConcurrentMark.


    # - XX:+ClassUnloading


    Turns class unloading on and off. The default value is true, meaning the HotSpot
    VM will unload unreachable classes. If this command-option is disabled—that is,
    XX:-ClassUnloading—the HotSpot VM will not unload unreachable classes, ever, not
    as part of all GCs.


    # - XX:+UnlockDiagnosticOptions


    Sets flags tagged as diagnostic options should be allowed or not. The default
    is false.


    There are some command-line options that are tagged as "diagnostic". These can
    be seen in a list of Java HotSpot VM command-line options using the XX:+PrintFlags
    conjunction with XX:-UnlockDiagnosticOptions. "Diagnostic" options have a field
    {diagnostic} command-option type in the XX:+PrintFlags output. Examples of diagnostic
    HotSpot VM command-line options include XX:+GlPrintRegionLivenessInfo, which prints
    details liveness information for each G1 region on each GC, and XX:+LogCompilation,
    which produces information about optimization decisions the Java HotSpot VM''s
    JIT compiler has made.'
  md: "\nWhen enabled, this option deduplicates Strings by looking at the String's\
    \ underlying character array. When a String contains a sequence of characters\
    \ equal to another String's sequence of characters, such as if string1.equals(string2)\
    \ evaluates to true, the String objects are updated to share the same underlying\
    \ character array. The end result is the freeing of space required by the duplicate\
    \ character array having the same sequence of characters. It should be noted that\
    \ the String objects are not actually deduplicated; rather their underlying character\
    \ arrays are deduplicated.\n\nThis feature is implemented only with the G garbage\
    \ collector. While enabling this command-line option is allowed with the non-G\
    \ HotSpot collectors—Parallel GC, CMS GC, and Serial GC—no String deduplication\
    \ is performed when enabled.\n\nAn object is considered a deduplication candidate\
    \ if any of the following statements are true:\n\n- The object is an instance\
    \ of java.lang.String.\n- The object is being evacuated from a young heap region.\n\
    - The object is being evacuated from a young/survivor heap region and the object's\
    \ age is equal to the deduplication age threshold, or the object is being evacuated\
    \ to an old heap region and the object's age is less than the deduplication age\
    \ threshold. See -XX:StringDeduplicationAgeThreshold for additional information\
    \ on the deduplication threshold.\n\nInterned Strings are dealt differently from\
    \ noninterned Strings. Interned Strings are explicitly deduplicated just before\
    \ being inserted into the internal HotSpot VM's StringTable to avoid countering\
    \ HotSpot JIT compiler optimizations done on literals.\nSee -XX:StringDeduplicationAgeThreshold\
    \ and -XX:+PrintStringDeduplicationStatistics.\n\n## -XX:StringDeduplicationAgeThreshold\n\
    \nMore specifically, a String becomes a candidate for deduplication once a String\
    \ object has been promoted to a G1 old generation, or its age is higher than the\
    \ deduplication age threshold. Once a String has a candidate for deduplication,\
    \ or has been deduplicated, it will never become a candidate again. This approach\
    \ avoids making the same object more than once.\n\nAlso see -XX:+UseStringDeduplication\
    \ and -XX:+PrintStringDeduplicationStatistics.\n\n## Appendix ■ Additional HotSpot\
    \ VM Command-Line Options of Interest\n\n### -XX:+PrintStringDeduplicationStatistics\n\
    \nEnables the printing of String deduplication statistics. The default value is\
    \ disabled.\nThis command-line option can be very helpful when you want to know\
    \ about enabling deduplication will result in a significant savings in the amount\
    \ of space use by String objects in the Java heap. Hence, enabling this command-line\
    \ option provides data that justifies whether there may be value in enabling -XX:+UseStringDeduplication.\n\
    \nAlso see -XX:+UseStringDeduplication and -XX:StringDeduplicationAgeThreshold.\n\
    \n## -XX:+GUseAdaptiveIHOP\n\nThis is a new command-line option available in JDK\
    \ 9 and later. It adequately adjusts the initiating heap occupancy threshold from\
    \ the initial value of the command-line option InitiatingHeapOccupancyPercent.\
    \ The intent is to let G1 the marking threshold to adaptive behavior so to increase\
    \ throughput by triggering the marking cycle as early as possible yet not old\
    \ generation space.\n\nThe mechanism enabled by GUseAdaptiveIHOP uses the value\
    \ of the command-line option InitiatingHeapOccupancyPercent as an initial value\
    \ for the marking cycles until sufficient observations about the application behavior\
    \ have been made. Then adaptively adjusts to a more optimal heap occupancy percent\
    \ at which to start the marking cycle.\n\nWhen GUseAdaptiveIHOP is disabled (when\
    \ -XX:-GAdaptiveIHOP is explicitly specified as a command-line option), G1 will\
    \ always use the InitiatingHeapOccupancyPercent value as the occupancy at which\
    \ to start the marking cycle.\nGAdaptiveIHOP, as this writing, will be enabled\
    \ by default with its introduction in JDK 9.\n\nAlso see -XX:InitiatingHeapOccupancyPercent.\n\
    \n## -XX:MaxCPauseMillis\n\nThis command-line option sets the pause goal in milliseconds.\
    \ The default value is 200. Note that this is a goal, not a hard maximum time\
    \ that G1 can never exceed.\n\nG1 attempts to size the young generation to make\
    \ sure that it can be collected within the goal set by -XX:MaxCPauseMillis. When\
    \ G1 is in use, this command-line option, with sizing the Java heap with -Xms\
    \ and -Xmx, is the command-line option that is expected to be used. These three\
    \ command-line options are also the suggested starting point when using G1, even\
    \ when migrating from Parallel GC or CMS to G1.\n\n## -XX:MinHeapFreeRatio\n\n\
    Sets the value for how much memory is allowed to free. The default value is 40.\
    \ This is a percentage, not a ratio.\n\nThe Java HotSpot VM uses the value set\
    \ by -XX:MinHeapFreeRatio to help determine when to shrink. This decision is made\
    \ during GC and can be described thus: if less than -XX:MinHeapFreeRatio percent\
    \ of the heap is free, G1 will attempt to grow. \n\n## -XX:MaxHeapFreeRatio\n\n\
    Sets the value for how much memory is allowed to free. The default value is 70.\
    \ This is a percentage, not a ratio.\n\nThe Java HotSpot VM uses the value set\
    \ by -XX:MaxHeapFreeRatio to help determine when to grow. This decision is made\
    \ during GC and can be described thus: if more than -XX:MaxHeapFreeRatio percent\
    \ of the heap is free, G1 will attempt to shrink.\n\n## -XX:+PrintAdaptiveSizePolicy\n\
    \nTurns on logging of information about size changes. This information can be\
    \ very useful in understanding ergonomic decisions made by G1 (also applicable\
    \ to Parallel GC).\n\nUse of -XX:+PrintAdaptiveSizePolicy in G1 is described in\
    \ Chapter 3, \"Garbage First Collector.\".\n\n## -XX:+ResizePLAB\n\nSets whether\
    \ thread-allocation buffers that the GC uses for promoting should be resized dynamically\
    \ or have a static size. The default value is true.\n\nThe dynamic resizing of\
    \ PLABs in G1 has been shown to cause some performance issues. For some applications,\
    \ disabling the resizing of promotion buffers can improve performance.\n\n## -XX:+ResizeTLAB\n\
    \nSets whether thread-local allocation buffers that the application threads use\
    \ for object allocations should be resized dynamically or have a static size.\
    \ The default is true.\n\nIn most cases TLAB resizing improves performance by\
    \ reducing contention in the allocation path. Contrary to the PLAB sizing, it\
    \ is not common to see this is off for performance. Hence, for almost all applications,\
    \ it is best to leave this command-option enabled, which again is its default.\n\
    \n## -XX:+ClassUnloadingWithConcurrentMark\n\nTurns class unloading during G1\
    \ concurrent cycles, the concurrent collection of old generation. The default\
    \ is true.\n\nNormally it is beneficial to be able to unload unreachable classes\
    \ during G1 current cycles rather than relying on G1 GCs to do so. The unloading\
    \ of classes during G1 concurrent cycles can sometimes increase G1 remark pause\
    \ times. If G1 remark pause times are higher than can be tolerated to meet GC\
    \ pause time goals, and few classes are expected to be unreachable, it may be\
    \ beneficial to disable this option, that is, XX:-ClassUnloadingWithConcurrentMark.\n\
    \n## -XX:+ClassUnloading\n\nTurns class unloading on and off. The default value\
    \ is true, meaning the HotSpot VM will unload unreachable classes. If this command-option\
    \ is disabled—that is, XX:-ClassUnloading—the HotSpot VM will not unload unreachable\
    \ classes, ever, not as part of all GCs.\n\n## -XX:+UnlockDiagnosticOptions\n\n\
    Sets flags tagged as diagnostic options should be allowed or not. The default\
    \ is false.\n\nThere are some command-line options that are tagged as \"diagnostic\"\
    . These can be seen in a list of Java HotSpot VM command-line options using the\
    \ XX:+PrintFlags conjunction with XX:-UnlockDiagnosticOptions. \"Diagnostic\"\
    \ options have a field {diagnostic} command-option type in the XX:+PrintFlags\
    \ output. Examples of diagnostic HotSpot VM command-line options include XX:+PrintRegionLivenessInfo,\
    \ which prints details liveness information for each G1 region on each GC, and\
    \ XX:+LogCompilation, which produces information about optimization decisions\
    \ the Java HotSpot VM's JIT compiler has made.\n"
  mdcn: '

    启用此选项后，系统将通过查看 String 的底层字符数组对 String 进行去重。当一个 String 包含与另一个 String 的字符序列相同的字符序列时（例如
    `string1.equals(string2)` 结果为 `true`），这些 String 对象将更新为共享相同的底层字符数组。最终结果是释放由具有相同序列的重复字符数组所需的空间。需要注意的是，String
    对象本身并没有真正被去重，而是它们的底层字符数组被去重了。


    此功能仅在 G 垃圾收集器中实现。虽然在非 G 的 HotSpot 收集器（Parallel GC、CMS GC 和 Serial GC）中允许启用此命令行选项，但在启用时不会执行任何
    String 去重操作。


    如果满足以下任一陈述为真，则该对象被视为去重候选对象：


    - 该对象是 `java.lang.String` 的实例。

    - 该对象正在从年轻代堆区域（young heap region）迁移。

    - 该对象正在从年轻代/存活堆区域（young/survivor heap region）迁移，且该对象的年龄等于去重年龄阈值；或者该对象正在迁移到老年代堆（old
    heap region），且该对象的年龄小于去重年龄阈值。有关去重阈值的更多信息，请参见 `-XX:StringDeduplicationAgeThreshold`。


    内化字符串（Interned Strings）的处理方式与非内化字符串不同。内化字符串在插入到 HotSpot VM 内部的 `StringTable` 之前会被显式地去重，以避免破坏
    HotSpot JIT 编译器对字面量所做的优化。

    请参见 `-XX:StringDeduplicationAgeThreshold` 和 `-XX:+PrintStringDeduplicationStatistics`。


    ## -XX:StringDeduplicationAgeThreshold


    具体来说，一旦 String 对象被提升到 G1 老年代，或其年龄大于去重年龄阈值，该 String 就成为去重候选对象。一旦 String 成为去重候选对象或已完成去重，它将不再再次成为候选对象。这种方法避免了对同一个对象进行多次操作。


    另请参见 `-XX:+UseStringDeduplication` 和 `-XX:+PrintStringDeduplicationStatistics`。


    ## 附录 ■ 感兴趣的其他 HotSpot VM 命令行选项


    ### -XX:+PrintStringDeduplicationStatistics


    启用打印 String 去重统计信息。默认值禁用。

    当你想了解启用去重是否会显著减少 Java 堆中 String 对象的空间占用时，此命令行选项将非常有帮助。因此，启用此命令行选项可以提供数据，以证明启用
    `-XX:+UseStringDeduplication` 是否具有价值。


    另请参见 `-XX:+UseStringDeduplication` 和 `-XX:StringDeduplicationAgeThreshold`。


    ## -XX:+GUseAdaptiveIHOP


    这是 JDK 9 及更高版本中的一个新命令行选项。它根据命令行选项 `InitiatingHeapOccupancyPercent` 的初始值，充分地调整初始堆占用率阈值。其意图是让
    G1 的标记阈值具有自适应行为，通过尽早触发标记周期来提高吞吐量，同时又不浪费老年代空间。


    `GUseAdaptiveIHOP` 启用的机制使用命令行选项 `InitiatingHeapOccupancyPercent` 的值作为标记周期的初始值，直到对应用行为进行了足够的观察。然后，它会自适应地调整到一个更优的堆占用率来启动标记周期。


    当 `GUseAdaptiveIHOP` 禁用时（当在命令行中显式指定 `-XX:-GAdaptiveIHOP` 时），G1 始终使用 `InitiatingHeapOccupancyPercent`
    的值作为启动标记周期的占用率。

    如本文所述，`GAdaptiveIHOP` 在 JDK 9 引入后默认启用。


    另请参见 `-XX:InitiatingHeapOccupancyPercent`。


    ## -XX:MaxCPauseMillis


    此命令行选项设置以毫秒为单位的暂停目标。默认值为 200。注意，这是一个目标，而不是 G1 永远无法超过的硬性最大时间。


    G1 尝试调整年轻代的大小，以在 `XX:MaxCPauseMillis` 设置的目标内完成收集。当 G1 使用时，通过 `-Xms` 和 `-Xmx` 设置的命令行选项会调整年轻代大小以满足
    `XX:MaxCPauseMillis` 目标。当 G1Adaptive 禁用时（当在命令行中显式指定 `-XX:-GAdaptiveIHOP` 时），G1
    将始终使用 `InitiatingHeapOccupancyPercent` 的值作为启动标记周期的占用率。如本文所述，`GAdaptiveIHOP` 在
    JDK 9 引入后默认启用。


    另请参见 `-XX:InitiatingHeapOccupancyPercent`。


    ## -XX:MaxCPauseMillis

    （注：此处原文内容与前文重复，翻译逻辑一致）


    ## -XX:MinFreeRatio


    设置允许释放内存的百分比。默认值为 40。这是一个百分比，不是比例。

    在 G1 中，HotSpot VM 使用 `-XX:MinFreeRatio` 设置的值来决定何时收缩。此决策在 GC 期间做出，即：如果堆空闲率小于 `-XX:MinFreeRatio`
    的百分比，G1 将尝试收缩。


    ## -XX:MaxFreeRatio


    设置允许释放内存的百分比。默认值为 70。这是一个百分比，不是比例。

    HotSpot VM 使用 `-XX:MaxFreeRatio` 设置的值来决定何时扩张。此决策在 GC 期间做出，即：如果堆空闲率大于 `-XX:MaxFreeRatio`
    的百分比，G1 将尝试扩张。


    ## -XX:+PrintSizePolicy


    开启关于大小调整信息的打印。这些信息对于理解 G1 的决策非常有有用。

    G1 使用 `-XX:+PrintSizePolicy` 请第 3 章，“Garbage First Collector”。


    ## -XX:+ResizePLAB


    设置 GC 用于提升的线程缓冲区是否动态调整大小或固定大小。默认值为 true。

    在 G1 中，PLAB 的动态调整已被会导致某些性能问题。对于某些应用程序，禁用这些缓冲区调整可以提高性能。


    ## -XX:+ResizeTLAB


    设置应用程序线程用于对象分配的线程本地缓冲区（TLAB）是否动态调整大小或固定大小。默认值为 true。

    大多数情况下，TLAB 调整通过减少分配路径上的竞争来提高性能。与 PLAB 相比，很少看到将其关闭。因此，对于大多数应用程序，最好启用此命令行选项，这也是它的默认设置。


    ## -XX:+ClassUnloadingWithConcurrentMark


    在 G1 并行期间开启类卸载，即老年代的并发收集。默认值为 true。

    通常，在 G1 并行期间卸载不可达类比依赖 G1 GC 这样做更好。G1 并行期间的类卸载有时会增加 G1 标记暂停时间。如果 G1 标记暂停时间高于满足的
    GC 暂停时间目标，且预计不可达类很少，可能需要禁用此选项，即 `-XX:-ClassUnloadingWithConcurrentMark`。


    ## -XX:+ClassUnloading


    开启或关闭类卸载。默认值为 true，意味着 HotSpot VM 将卸载不可达类。如果禁用此命令行选项（即 `-XX:-ClassUnloading`），HotSpot
    VM 将永远不会卸载不可达类，无论在任何 GC 中。

    '
