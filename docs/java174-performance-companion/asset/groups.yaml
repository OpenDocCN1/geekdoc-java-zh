    ## Class Browser


    With the Class Browser (see the example in Figure 4.15), we can see all the classes
    loaded by the target VM. It also allows us to dump the classes for all or selective
    classes loaded in the target VM. This tool is very useful when we do not have
    access to the source code of the application and just have the core dump file
    and we need to investigate some issue with the loaded classes. For example, if
    some loaded class is not behaving as expected, we can dump that class, look at
    its code, and try to figure out the problem. Or perhaps there are too many loaded
    classes and we are getting out-of-memory errors; with the Class Browser we can
    look through the classes and see if some unneeded classes are also getting loaded
    or whether the classes are getting unloaded as expected.


