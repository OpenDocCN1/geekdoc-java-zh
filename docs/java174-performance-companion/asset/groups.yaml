    # Garbage First 概述


    本章介绍了 Garbage First（简称 G1）垃圾回收器（GC），并回顾了 Java HotSpot 虚拟机（VM，以下简称为 HotSpot）中垃圾回收器的历史演变，以及
    G1 被纳入 HotSpot 的原因。我们假设读者已经熟悉垃圾回收的基本概念，如年轻代（young generation）、老年代（old generation）和压缩（compaction）。《Java™
    性能[1]》一书的第 3 章“JVM 概述”是学习这些概念的良好来源。


    串行 GC（Serial GC）是 1999 年作为 Java 开发工具包（JDK）1.3.1 的一部分引入 HotSpot 的第一个收集器。并行（Parallel）和并发标记清除（Concurrent
    Mark Sweep）收集器于 2002 年作为 JDK 1.4.2 的一部分引入。这三者大致对应于三个最重要的用例：“最小化内存占用并最大化应用程序吞吐量”以及“最小化
    GC 相关的停顿时间”。人们可能会问：“为什么我们需要像 G1 这样的收集器呢？”在回答之前，让我们先澄清一些在比较和对比垃圾回收器时常用的术语。我们将简要概述四种
    HotSpot 垃圾回收器（包括 G1），并识别 G1 与其他收集器的区别。


    # 术语


    在本节中，我们定义了并行（parallel）、停顿世界（stop-the-world）和并发（concurrent）这三个术语。并行意味着多线程的垃圾回收操作。当一个
    GC 事件活动被描述为并行的，意味着使用多个线程来执行它。当一个垃圾回收器被描述为并行的，意味着它使用多个线程来执行垃圾回收。


    在 HotSpot 垃圾回收器中，几乎所有多线程 GC 操作都由内部 Java 虚拟机（JVM）线程处理。其中一个例外是 G1 垃圾回收器，某些后台 GC
    工作可以由应用程序线程承担。更多详细信息请参阅第 2 章“Garbage First 垃圾回收器深度”和第 3 章“Garbage First 垃圾回收器性能调优”。


    停顿世界（stop-the-world）意味着在 GC 事件期间，所有的 Java 应用程序线程都停止了。停顿世界垃圾回收器是指在执行垃圾回收时停止所有 Java
    应用程序线程的收集器。一个 GC 阶段或事件可以被描述为停顿世界的，意味着在那个特定的 GC 阶段或事件期间，所有 Java 线程都停止了。


    并发（concurrent）意味着垃圾回收活动与 Java 应用程序执行的同时发生。并发 GC 阶段或事件意味着该 GC 阶段或事件与应用程序同时执行。一个垃圾回收器可以用这三个术语中的任何一个或组合来描述。例如，并行并发收集器既是多线程的（并行部分），又与应用程序同时执行（并发部分）。


    # 并行 GC (Parallel GC)


    并行 GC 是一种并行的停顿世界收集器，这意味着当 GC 发生时，它会停止所有应用程序线程并使用多个线程执行 GC 工作。GC 工作可以非常高效地完成而没有任何中断。这通常是相对于应用程序工作来最小化
    GC 所花费总时间的最佳方式。然而，由 GC 引起的 Java 应用程序的单次停顿可能会相当长。


    并行 GC 中的年轻代和老年代收集都是并行且停顿世界的。老年代收集还会执行压缩。压缩将对象移动得更近，以消除它们之间的浪费空间，从而实现最优布局。然而，压缩可能会花费大量时间，这通常是
    Java 堆的大小以及老年代中存活对象的数量和大小的函数。


    在并行 GC 引入 HotSpot 时，只有年轻代使用了并行停顿世界收集器。老年代收集使用单线程的停顿世界收集器。在并行 GC 引入时，启用此配置中并行 GC
    的 HotSpot 命令行选项是 `-XX:+UseParallelGC`。


    在并行 GC 引入时，服务器最常见的用例需要吞吐量优化，并行 GC 成为 HotSpot Server VM 的默认收集器。此外，大多数 Java 堆的大小倾向于在
    512MB 到 2GB 之间，这使得并行 GC 的停顿时间相对较低。当时应用程序对延迟的要求比现在要宽松得多。随着 Java 堆大小以及老年代中存活对象的数量和大小的增加，收集老年代的时间变得越来越长。与此同时，硬件的进步提供了更多可用线程。因此，并行
    GC 通过增加多线程年轻代收集器得到了增强。这减少了收集和压缩堆的时间。


    增强并行 GC是在 Java 6 更新中交付的。它通过一个新的命令行选项 `-XX:+UseOldGC` 启用。当启用 `-XX:+UseOldGC` 时，并行年轻代收集也被启用。这就是我们今天认为的
    HotSpot 中的并行 GC，多线程停顿世界年轻代收集结合多线程停顿世界老年代收集。


    > 提示

    > 在 Java 7 更新 4（也称为 7u4 或 JDK 7u4）中，`-XX:+UseOldGC` 是默认 GC，并行 GC 的运行模式。从 7u4 开始，指定
    `-XX:+UseOldGC` 也会启用 `-XX:+UseParallelGC`。


    并行 GC 在以下情况下是很好的选择：


    - 吞吐量需求大于延迟需求。处理应用程序是一个很好的例子，因为它是非交互式的。当你启动批处理执行时，你希望它尽可能地运行。

    - 如果能够满足最差延迟需求，并行 GC 将提供最好的吞吐量。最差延迟需求包括最差停顿时间以及发生的频率。例如，一个应用程序的延迟要求可能是超过 500ms
    的“停顿”每小时发生不超过一次，且所有停顿不超过三秒。

    - 数据量足够小的交互式应用程序，并行 GC 的全 GC 事件能够满足最差延迟需求。应用程序是符合此要求的例子。然而，存活数据量往往与堆的大小高度相关，属于此类的应用程序类型非常有限。


    串行 GC（Serial GC）与并行 GC 非常相似，除了它在单线程中完成所有工作外。单线程方法允许更复杂的 GC 实现并需要更少的运行时数据结构。内存占用是所有
    HotSpot 收集器中最低的。串行 GC 的挑战与并行 GC 相似。停顿时间可能很长，并且与堆的大小和存数据量呈线性增长。此外，由于 GC 工作在单线程中完成，串行
    GC 的长停顿更加明显。


    '
