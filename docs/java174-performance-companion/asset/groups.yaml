    - XX:G1OldRegionOccupancyPercent：设置触发混合收集的老年代区域占用率阈值。默认值为 85%。增加此值可能会增加规避失败的风险。

    - XX:G1SurvivorThreshold：设置对象在进入老年代之前必须存活的 Survivor 代代数。默认值为 15。降低此值可以减少对象进入老年代。


