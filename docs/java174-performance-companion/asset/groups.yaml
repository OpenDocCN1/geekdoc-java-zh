  mdcn: '


    ## 附录 关注的 HotSpot VM 命令行选项


    命令行选项名称前的 `+` 或 `-` 字符。例如，`-XX:ConcGCThreads` 是一个期望数值的选项，如 `-XX:ConcGCThreads=6`。


    本附录提到的特定 HotSpot VM 选项的默认值基于该选项在 JDK 8u45 中的默认值。因此，可能在某些情况下，命令行选项的默认值与本附录中提到的不同。默认值的更改通常由于额外信息，或是该命令行选项在备选值下的行为变化。


    ### -XX:+UseG1GC


    启用 G1 垃圾回收器。在 Java 7 和 Java 8 版本中使用 G1 必须使用此命令行选项进行显式启用。截至本文编写时，计划将 G1 成为 Java
    9 的默认垃圾回收器，尽管存在在 Java 9 发布时回退 Parallel GC 的可能性。


    ### -XX:ConcGCThreads


    设置 GC 在与 Java 并发执行时应使用的线程数。默认情况下，该值大约是 Java 线程停止时执行 GC 时所用线程数的四分之一。


    > 减少 `-XX:ConcGCThreads` 可以获得更高的吞吐量，因为更少的 GC 线程与 Java 应用程序竞争 CPU 使用。线程过少可能导致并发周期运行不够快以回收内存。


    ### -XX:G1HeapRegionSize


    设置 G1 堆区域（region）的大小。默认情况下，此值约为堆大小的 1/2000。可能的区域大小有 1M、2M、4M、8M、16M 和 32M。


    大于区域大小的对象需要由 G1 进行特殊管理。增加区域大小允许较大的大对象通过普通分配路径进行分配，如果此类大对象很常见，则可能有助于性能。然而，较大的区域意味着
    G1 在做出人体学决策（例如，关于分代的大小）时的灵活性较低。


    ### -XX:G1HeapWastePercent


    控制 G1 不收集的允许空闲内存量。默认此值为 5%。


    G1 将收集所有区域，直到剩余的空闲内存达到 `-XX:G1HeapWastePercent` 的比例。特别是在大堆上，使用较低的 `-XX:G1HeapWastePercent`
    值是有意义的，因为堆大小的 5% 代表了相当大量的内存。


    ### -XX:G1MixedGCCountTarget


    设置并发周期后应执行的 GC 次数目标。默认值为 8。


    老年代区域的收集时间通常比年轻区域长。在并发周期后允许更多的 GC 可以让 G1 将老年代区域的回收分散到更多的收集中。增加 `-XX:G1MixedGCCountTarget`
    也意味着启动新的并发周期需要更长时间。如果 GC 停顿时间过高，增加 `-XX:G1MixedGCCountTarget` 可能有所帮助。


    ### -XX:+G1PrintLivenessInfo


    这是一个诊断 VM 选项，需要配合 `-XX:+UnlockDiagnosticVMOptions` 启用。启用后，它将打印堆上每个区域的活跃性信息。信息包括使用情况、记忆集（remembered
    set）的大小以及“GC 效率”（这是衡量回收该区域价值的指标）。这些信息在标记周期完成后以及在区域被包含在收集集合后会被记录。


    通过 `-XX:+G1PrintLivenessInfo` 记录的信息在尝试理解堆使用和识别记忆集问题时非常有用。由于它为堆中的每个区域都记录一次，对于大堆来说，这些数据可能难以管理。


    ### -XX:G1ReservePercent


    为了降低晋失败（promotion failure）的风险，G1 会预留部分内存用于晋。这部分内存不会用于年轻代。默认情况下，G1 预留堆的 10% 用于此目的。在存活集大堆上，预留
    10% 的堆可能过多。减少此值可以为年轻代留出更多内存并延长 GC 之间的时间，这通常会提高性能。


    ### -XX:+G1SummarizeRStats


    这是一个诊断 VM 选项，需要配合 `-XX:+UnlockDiagnosticVMOptions` 启用。启用后，会在 VM 退出时打印记忆集的详细摘要。结合
    `-XX:G1SummarizeRStatsPeriod` 使用，此摘要可以定期打印，而不仅仅是在 VM 退出时。


    如果怀疑存在记忆集问题，这是一个分析这些问题的有用工具。


    ### -XX:+G1SummarizeRStatsPeriod


    这是一个诊断 VM 选项，需要配合 `-XX:+UnlockDiagnosticVMOptions` 启用。它只能与 `-XX:+G1SummarizeRStats`
    配合使用。如果设置为非 0 值，它将打印由 `-XX:+G1SummarizeRStats` 生成的摘要。但它不是在 VM 退出时打印，而是在每次 `-XX:+G1SummarizeRStatsPeriod`
    指定 GC 发生后打印。


    每次 GC 都打印此信息开销很大，但定期打印使得识别记忆集管理的趋势成为可能。


    ### -XX:+G1TraceConcRefinement


    这是一个诊断 VM 选项，需要配合 `-XX:+UnlockDiagnosticVMOptions` 启用。使用 `-XX:+G1TraceConcRefinement`，会记录有关并发精炼线程的信息。


    ### -XX:+G1AdaptiveIHOP


    这是一个诊断 VM 选项，需要配合 `-XX:+UnlockDiagnosticVMOptions` 启用。使用 `-XX:+G1AdaptiveIHOP`，G1
    会动态调整初始堆占用百分比。


    ### -XX:+UseStringDeduplication


    启用 Java 字符串的去重。此命令行选项和功能在 JDK 8u20 中引入。字符串去重默认是禁用的。


    '
