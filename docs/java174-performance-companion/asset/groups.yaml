    \ Parameters\n\n## Heap Parameters\n\nThe Heap Parameters utility shows us the\
    \ heap boundaries of various generations of the Java heap. It is helpful in finding\
    \ out the heap region in which a particular address lies. See Figure 4.32 for\
    \ an example.\n\n## System Properties\n\nWe can get the system properties used\
    \ by the target VM using the System Properties tool. An example is shown in Figure\
    \ 4.33.\n\n## VM Version Info\n\nThis utility shows the detailed JVM version of\
    \ the target process or core file. An example is shown in Figure 4.34.\n\n## Command\
    \ Line Flags\n\nThis utility shows the values set for all command-line -XX JVM\
    \ options. An example is shown in Figure 4.35.\n\n## The Serviceability Agent\
    \ Debugging Tools\n\n![](img/0889c737c4674ce01ea95712362abd45_115_0.png)\nFigure\
    \ 4.33 System Properties\n\n![](img/0889c737c4674ce01ea95712362abd45_115_1.png)\n\
    Figure 4.34 VM Version Info\n\n![](img/0889c737c4674ce01ea95712362abd45_116_0.png)\n\
    \n## CLHSDB\n\nCommand-Line HotSpot Debugger is the command-line variant of the\
    \ HSDB. To launch CLHSDB, we need to set the same environment variables as we\
    \ did for the HSDB. Using the following command to launch this tool:\n\n```\n\
    JAVA_HOME/bin/java -classpath $JAVA_HOME/lib/sa-jdi.jar sun.jvm.hotspot.CLHSDB\n\
    ```\n\n## The Serviceability Agent Debugging Tools\n\nIt offers almost all the\
    \ features that the UI of the tool does; for example, to examine any Java object\
    \ or VM data structure there is a command inspect:\n\n```\nhsdb> inspect 0x23f5a020\n\
    instance of O for java/lang/Thread @ 0x23f5a020 @ 0x23f5a020 (size = 104)\n  _mark:\
    \ 1\n  _metadata_.class: InstanceClass for java/lang/Thread @ 0x38966700 Oop\n\
    0x38966700\nname: C @ 0x23f5a0c0 Oop for [C @ 0x23f5a0c0\nppriority: 5\nthreadq:\
    \ null\ncount: 1275852\nsingle_step: false\ndaemon: false\nstillborn: false\n\
    target: null\ngroup: Oop for java/lang/Thread @ 0x23f50840 Oop for java/lang/\n\
    Threadgroup @ 0x23f50840\ncontextClassLoader: Oop for sun/mic/Launcher$AppClassLoader\
    \ @ 0x23f7b398\nOop for sun/mic/Launcher$AppClassLoader @ 0x23f7b398\ninheritedAccessControlContext:\
    \ Oop for java/security/AccessControlContext @ 0x23f50ad8 Oop for java/security/AccessControlContext\
    \ @ 0x23f50ad8\nthreadLoc: Oop for java/lang/Thread$threadLocal$threadLocalMap\
