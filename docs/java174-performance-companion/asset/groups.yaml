    在 HotSpot 的早期版本中，整个代码缓存（code cache）被视为单个根节点，并由单个工作线程获取和处理。一个巨大且满或几乎满的代码缓存会阻塞该工作线程，并导致总暂停时间增加。随着代码根扫描（code
    root scanning）作为独立的并行活动被引入，扫描 nmethod 的工作减少为仅扫描来自编译代码引用的 RSets。因此，对于 CSet 中的特定区域，只有当该区域的
    RSet 具有强代码根时，才会扫描对应的 nmethod。


    > 提示

    > 开发者通常用 HotSpot 术语 nmethod 指 Java 方法的动态编译代码。nmethod 不要与原生方法（native method）混淆，后者指的是
    JNI 方法。nmethod 除了生成的代码外，还包括常量池等辅助信息。


    > 提示

    > 为了缩短 nmethod 扫描时间，仅对 CSet 中区域的 RSets 进行编译器引入的引用扫描，而不是 Java 应用应用线程（mutator threads）引入的“常规”引用。


    ## 总结记忆集（Remembered Sets）


    选项 -XX:+GSummarizeRSetStats 可以提供 RSet 粗化（细粒度或粗化位图）总数的窗口，帮助判断精炼更改能够处理更新后的缓冲区，并收集更多关于
    nmethod 的信息。该选项在每次 GC 暂停期间总结 RSet 统计信息，其中 n 由 -XX:+GSummarizeRSetStatsPeriod=n
    设置。


    > 提示

    > -XX:+GSummarizeRSetStats 是诊断选项，必须通过在命令行添加 -XX:+UnlockDiagnosticVMOptions 来启用，例如：

    JAVA_OPTS="-XX:+UseG1 -XX:+UnlockDiagnosticVMOptions -XX:+PrintGCDetails -XX:+GSummarizeRSetStats
    -XX:+GSummarizeRSetStatsPeriod=1 -Xloggc:jdk845_h.log"。


