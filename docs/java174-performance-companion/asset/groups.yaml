    # 第 3 章 Garbage First 垃圾收集器性能调优


    重定向卡片的时间显示为 Redirty 时间（在上例中为 0.2 ms）。


    大对象回收（Humongous Reclaim）是 JDK 8u40 中引入的新特性。如果通过检查从根集或年轻代区域的所有引用，并确保 RSet 中没有指向该大对象的引用，从而发现一个大对象是不可达的，则可以在疏散阶段对其进行回收。（有关大对象区域和大对象的更详细描述，请参阅第
    2 章。）


    剩余的 Other（其他）时间用于修复 JNI 句柄和类似的工作。Other 中的累计时间应该非常小，大部分时间都应该有合理的解释。例如，如果你的每次停顿
    Cset 很大，那么你可能会看到 Free Cset 上的时间较高。引用处理（Ref Proc）和引用入队（Ref Enq）可能会根据应用程序中使用的引用数量显示显示较高时间。如果你有许多短命的大对象，类似的推理也适用于
    Humongous Reclaim 时间。


    # 年轻代可调优参数


    正如 Java™ Performance [1] 第 7 章“逐步调优 JVM”中所提到的，有一些可以帮助调优年轻代本身的可调优参数。G1 具有巨大的调优潜力。存在初始值和默认值有助于
    G1 的启发式算法，为了调优 G1，需要理解这些默认值及其对启发式算法的影响。如 -XX:MaxGCPauseMillis（停顿目标；默认值为 200 ms）、-XX:G1NewPercent（以总堆百分比表示的初始代大小；默认值为
    5%）、-XX:G1NewSizePercent（以总堆百分比表示的最大代增长限制；最大为 60%）等选项，可以根据初始和上限、停顿目标以及之前复制时间的加权平均值来增长或缩小年轻代。如果工作负载发生变化，并且认为绕过自适应缩放可以获益（例如，你发现预测时间与实际观测到的时间差异巨大），你可以调整默认值。副作用是是你放弃了自适应缩放，以换取更可预测的限制。另一点需要注意的是，新的限制仅适用于你正在调优的那个应用程序，不会带到任何可能具有相似停顿要求的其他/不同应用程序，因为大多数应用程序的行为取决于其分配速率、晋升速率以及瞬态存活数据集的大小和寿命。


