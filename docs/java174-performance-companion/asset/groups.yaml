    # Concurrent Refinement Threads and Barriers


    The advanced RSet structure comes with its own maintenance costs in the form of
    write barriers and "refinement" threads.

    Barriers are snippets of native code that are executed when certain statements
    in a managed runtime are executed. The use of barriers in garbage collection algorithms
    is well established, and so is the cost associated with executing the barrier
    code as the native path length increases.

    OpenJDK HotSpot''s Parallel Old and CMS GCs use a write barrier that executes
    when the HotSpot JVM performs an object write operation:


    ```

    object.field = some_other_object;

    ```


    The barrier updates a card-table structure [2] to track intergenerational references.
    The card table is scanned during minor garbage collections. The write barrier
    algorithm is based on Urs Hölle''s fast write barrier [3], which reduces the barrier
    overhead to just two extra instructions in the compiled code.

    G1 GC employs a pre-write and a post-write barrier. The former is executed before
    the actual application assignment takes place and is covered in the concurrent
    marking section, while the latter is executed after the assignment and is further
    described here.

    G1 GC issues a write barrier anytime a reference is updated. For example, consider
    the update in this pseudo-code:


    ```

    object.field = some_other_object;

    ```


    This assignment will trigger the barrier code. Since the barrier is issued after
    a write to any reference, it is called a "post-write" barrier. Write barrier instruction'
