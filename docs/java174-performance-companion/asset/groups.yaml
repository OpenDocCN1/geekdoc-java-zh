    ## 并发标记清理算法 (CMS) GC


    | 标记/预清理 | 并发清理 |

    |---|---|

    | → | → |

    | → | → |

    | → | → |

    | → | → |

    | → | → |


    **图 1.3** 当使用 CMS 时，GC 线程对 Java 应用线程的影响


    另一个关于 CMS GC 的挑战是它如何处理老年代的碎片化。当老年代对象之间的空闲空间变得如此小或不存在，导致从年轻代提升的对象无法放入可用空隙时，就会产生碎片。CMS
