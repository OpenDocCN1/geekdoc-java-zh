    # Decision Analysis in Pharmacoeconomic Studies


    Decision analysis is a systematic approach to comparing two or more decision options
    under conditions of uncertainty (Bootman, 2005). Prospective studies—research
    investigations are conducted into the future—such as randomized trials may take
    months or even years to perform and are very expensive. Decision analysis, on
    the other hand, uses analytic models, called trees, to more quickly and less compare
    various alternatives. This technique provides a formal, transparent, and orderly
    approach for the decision-maker to identify the preferred course of action. One
    benefit of decision analysis is the ability to perform sensitivity analyses on
    the constructed model. Sensitivity analyses allow researchers to alter probabilities
    within the decision tree, such as side effects, cure rates, and costs, to very
    quickly determine the impact of changes where there is uncertainty. The ability
    of the use of computer programs as TreeAge Software®, to evaluate multiple decision
    options when collection of the data is not feasible, too expensive, or would take
    too long has made this technique more common in recent years. While decision trees
    are useful'
