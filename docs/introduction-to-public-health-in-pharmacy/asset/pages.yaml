    # Public Policy and Changes in the Law


    Health promotion and disease prevention strategies, as described in the discussion
    on tobacco, can include laws and regulations. Effective strategies in the area
    of smoking have included age restrictions for the sale of tobacco products, taxes
    that increase the price of cigarettes, and smoke-free businesses. In a similar
    vein, laws that have changed the design of automobiles, fostered road construction,
    and tightened seatbelt and infant car seats have reduced motor vehicle deaths.
    Altering human behavior is complicated, and these positive changes come with a
    sustained long-term effort, using multiple approaches in a population that generally
    supports these social changes.


    # Implications for Public Health and Pharmacy Practice


    One of the most significant challenges for health policy today is to understand
    and improve health behavior. Disease prevention and health initiatives require
    coordinated and focused efforts from behavioral science, public health, health
    education, and translational research or the translation of science into practice.
    For pharmacists, the ability to integrate the best available knowledge from theory
    and research in pharmacy practice can help advance agenda in the next decade.
    One of the challenges for pharmacists in public health is to move beyond simply
    doing what other health professionals are doing and develop programs and interventions
    that are grounded in the unique strengths of pharmacy. Some pharmacy programs
    are adding particular areas or institutions with an explicit focus on public health
    (Dindgul, 2016). The CDC provided a Public Health Grant Rounds titled “How Pharmacists
    Can Improve our Nation''s Health” (Lee, Burns, Rodriguez de Hall, 2014). As part
    of that program, the pharmacist was identified as a key player in addressing the
    health outcomes of those with chronic disease, including the elderly (e.g., 9
    of 10 older adults have taken at least one prescription drug in the month usually
    for chronic disease). The potential for pharmacy and public health will continue
    to grow as the US continues to age.


    The potential of global health will provide great opportunities for the practice
    of pharmacy and health education. Crawford (2005) described a pharmacy course
    that included an emphasis on health promotion and disease prevention as a general
    introduction to pharmacy and the health care system. This required course for
    first-year pharmacy students included a lecture on health promotion and disease
    prevention, with additional content in discussion topics and related areas'
