    # Nutrition for Children and Adolescents


    Children''s nutritional needs vary as they grow and develop. Specific nutritional
    requirements affect physical, mental, and emotional growth and development (Roth,
    2014). Studies have shown that children who fail to meet their nutritional needs
    can be intellectually as well as physically. Eating behaviors develop at this
    time, and it is important for parents to provide a positive feeding environment.
    However, many comorbid conditions begin during childhood and adolescence due to
    poor nutrition. These include cardiabetic, pulmonary, and psychosocial complications
    that persist into adulthood, leading to poorer social and health outcomes (Saho
    et al., 2015). Prevention and early intervention strategies are also critical
    to reversing the obesity epidemic (Gurnari, Birken, & Hamilton, 2015).


    It is important for parents and caregivers to be present and continue to encourage
    new foods. Children should be fed age-appropriate food that meets their nutritional
    needs. Needs increase according to body size. Therefore, it is important that
    young children grow nutritious foods they will eat.


    Adolescence is an important period of nutritional vulnerability due to increased
    dietary requirements for successful growth and development. Each stage of adolescence,
    from early adolescence (10-14 years of age), during late adolescence (15-19 years
    of age), to young adulthood (20-24 years of age) results in major nutritional
    changes for both females and males (Das et al., 2017). Requirements for energy-consuming
    nutrients, vitamins, and minerals dramatically. During adolescence (13 to 20),
    rapid growth occurs and can cause changes for both females and males. Male requirements
    tend to be higher than females due to being bigger; more active, and increased
    muscle mass.


    Just as children imitate their parents'' eating habits, adolescents imitate their
    peers'' eating habits and consume large portions of low nutrient foods such as
    potato chips, soda, and candy. Adolescent habits can be affected by busy schedules,
    part-time jobs, athletics, and social activities. Social and environmental factors
    also affect eating patterns, such as food availability and preferences, cost,
    convenience, personal and cultural beliefs, the mass media, body image,'
