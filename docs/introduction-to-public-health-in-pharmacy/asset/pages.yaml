    # Foodsecurity and Hunger


    Access to food has been an increasing issue for American families. Food insecurity
    is the inability to access nutritious and adequate amounts of food necessary for
    a healthy life (Coleman-Jensen, Gregory, & Singh, 2014). The USDA estimates that
    49 million people in the United States are living in food-insecure households,
    nearly 16 million of whom are children (Coleman-Jensen et al., 2014). Individuals
    at greatest risk for food insecurity include those who are low income, are of
    a minority, elderly, and/or have children. Food-insecure adults have greater incidence
    of obesity and chronic diseases such as diabetes, less adherence to medications,
    and mental health issues including anxiety and depression (Seligman, Laraugh,
    & Kushnel, 2010).


    Food insecurity has proven to be difficult to measure. Early scales used household
    income levels to indirectly assess food insecurity. The USDA Food Security Survey
    Module, was developed by the USDA Food and Nutrition Service in 1995 (Carlson,
    Anders, & Peck, 1999). The USDA Food Security Survey Module now has three forms
    in English and in Spanish: (a) six-item short form, (b) a 10-item adult form,
    and (c) an 18-item household form, as well as a module for children 12 years of
    age and older.


    With the growing numbers of food insecurity, multiple efforts are made to assist
    these individuals and families. Over 100 billion dollars is spent each year on
    food assistance programs. However, an increasing gap has been found between government
    food assistance programs and need (Feeding America, 2015; Roberts, Povich, & Mather,
    2012-2013). It has been nonprofit organizations that help fill the difference
    (Guo, 2010). Many of these nonprofits have created local food banks, foodries,
    and meal programs.'
