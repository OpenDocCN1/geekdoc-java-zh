    # Introduction


    Nutrition is a vital component to life. It plays a dynamic role in all aspects
    of health including growth and development, health promotion, disease prevention,
    and acute and chronic disease management (Gilman, Chokshi, Bowen, Regen and Cox,
    2014). Obtaining and providing nutrition to our bodies allows essential nutrients
    such as carbohydrates, proteins, and lipids (fats) as well as minerals, and water
    to promote overall health. Medical nutrition therapy, a therapeutic approach to
    treating medical conditions and their associated symptoms through a tailored diet,
    can help assist in the management of these chronic diseases. Nutrition is important
    to the practice of all health care professionals, especially community pharmacists.


    Pharmacists are in a unique position to educate the public on nutrition in many
    areas of health care. They can make significant contributions in assuring adequate
    nutrition by advising patients about basic food needs, correcting improper food
    habits in children, advising special nutrition


    ![](img/bab568132a8b848885368f29e8af2454_210_0.png)'
