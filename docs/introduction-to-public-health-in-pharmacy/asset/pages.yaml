    Successful programs designed to decrease the use of tobacco have included both
    individual and group focus, multiple approaches, and a continued effort to elicit
    target behaviors. Great deal of social and behavioral research has focused on
    smoking prevention (usually focused on young people) and smoking cessation (focused
    on tobacco users). Programs that have targeted the community and the school system
    seem to be effective; perhaps because they address the issue of changing messages
