    requirements, and suggesting special diet instructions for patients with diabetes
    and other illnesses throughout the life cycle. While many may associate a pharmacist''s
    work in nutrition in the clinical setting, the Council for Pharmacy Education
    indicates that students in a doctor of pharmacy program should "understand relevant
    diet, nutrition, and non-drug therapies" (Machen, & Odegar, 2007, p. 1). With
    the growing number of diet-related chronic diseases, there are many opportunities
    for pharmacists to educate patients about behavior, nutrition, and physical activity
    can improve health in life cycle and addition to medication. Therefore, the focus
    must be on recognizing the life cycle and how nutrition plays a role in the stages
    of life.


    # Planning a Healthy Diet


    Good health starts with a balanced diet, which includes all six classes of nutrients
    and calories. Eating a balanced diet is oftentimes overlooked and should be the
    first thing considered for people of all ages. Pharmacists can advocate for the
    community to assist in improving their nutrition, as millions of individuals have
    one or more preventable chronic diseases. Over two-thirds of US adults can benefit
    from improvements in their dietary patterns. The U.S. Department of Agriculture
    (USDA) and Department of Health and Services (DHHS) have developed simple systems
    to help with the selection of diets.


    # Dietary Guidelines


    The Dietary Guidelines for Americans are science-based advice to promote health
    and reduce the risk of chronic disease through diet and physical activity U.S
    Dietary Guidelines Advisory Committee, 2015). A joint effort between the USDA
    and DHHS, the guidelines can assist community pharmacists in guiding the general
    public over two years of age to eat balanced daily meals. The guidelines include
    five basic


    +   1. Follow a healthy eating pattern across the lifespan;

    2. Focus on variety, nutrient density, and amount;

    3. Limit calories from added sugars and saturated fats to reduce sodium intake;

    4. Shift to healthier food and beverages choices; and

    5. Support healthy eating patterns for all.


    In addition to the general guidelines, the document also addresses healthy eating
    patterns for US style, Mediterranean, and vegetarian diets and defines the core
    concepts of healthy eating and physical activity patterns.'
