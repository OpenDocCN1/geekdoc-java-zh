    Purnell and Paulanka (2012, p. 2) define culture as “the totality of socially
    transmitted behavioral patterns, arts, beliefs, values, customs, life-ways, and
    all other products of human work and thought characteristics of a population of
    people that guide their worldview and decision-making.” It is important to understand
    as ethnic diversity continues to expand within the United States, cultural considerations
    must be recognized as an integral factor in patient care to a greater extent than
    now. Cultural values and norms determine health-seeking behaviors, management
    of a disease, and certainly cross-cultural communication with care providers.
    Public health practitioners who do not recognize culture is the background for
    many of the decisions made relating to health will most likely encounter from
    the patient but also professional frustration from the lack of impactful patient
    outcomes regardless of intervention. Purnell and Paulanka (2012) identified 12
    domains of culture that could affect how a patient would approach an issue as
    health care. The 12 domains encompass both personal and social practices, as well
    as cultural and family heritage, health attitudes and beliefs, and biological/genetic
    aspects that affect health. Typing each culture helps health care practitioners
    understand elements that may need addressing from a culturally competent perspective.
    For example, some cultures, obesity is a sign of affinity, not disease. Some cultures
    may not have a framework or construct for prenatal or postnatal care, which may
    affect pregnancy and childbirth health practices.


