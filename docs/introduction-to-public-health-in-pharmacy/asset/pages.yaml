    # Health Behavior, Prevention, and Promotion


    Many of the activities that individuals and populations pursue will have a direct
    effect on their health, while other behaviors have a more indirect effect. While
    some behaviors have noticeable influence, it is difficult to determine which behaviors
    will have little or no potential to influence health outcomes. Simple things,
    such as drinking safe water, and eating uncontaminated food, have potential health
    outcomes. Clearly, health behaviors can mitigate or exacerbate chronic diseases,
    such as heart disease, cancer, diabetes, and stroke. Human behaviors can also
    affect the resurgence of infectious diseases (e.g., tuberculosis) and the emergence
    of new infectious diseases (e.g., HIV/AIDS, hepatitis C, and human papillomavirus
    [HPV]). Other behavioral factors, such as tobacco use, diet, exercise, alcohol
    consumption, sexual behavior, and avoidable injuries concerns in prevention and
    promotion research is the relationship between'
