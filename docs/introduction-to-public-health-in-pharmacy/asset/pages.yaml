    studies (Level I or II) or randomized studies. What is critical for these types
    of evidence-based syntheses and studies is that researchers clearly and thoroughly
    document and report the planned methods, outcomes, and analyses. Complete transparency
    of the conduct of experimental research, systematic reviews, and meta-analyses
    permits reproducibility and improves fidelity of their conclusions.


    Since the reporting of outcomes may bias the evidence base for clinical decision-making
    and policy, transparency is essential when documenting therapeutic efficacy. To
    facilitate the completeness and transparent reporting of trials and their critical
    appraisal and interpretation, there are a number of reporting guidelines used
    that help determine how well designed and executed trials are, such as CONSORT,
    PRISMA, and methodologies, such as Statistical Analyses and Methods in the Published
    Literature (SAMPL).


    The "Cons Standards Of Reporting Trials" (CONSORT) Statement is an evidenced minimum
    set of 25 recommendations with a checklist and flow diagram for reporting RCTs
    and their abstracts (CONSORT Group, 2017) as well as guidelines for pilot and
    feasibility studies (Elridge et al., 2016).


    The Preferred Reporting Items for Systematic Reviews and Meta-analyses (PRISMA)
    emphasize that systematic reviews and meta-analyses are iterative processes, conducting
    research and reporting work are intertwined yet distinct connects, risk of bias
    is addressed at the study level and the outcome level, and reporting biases are
    critical (Moher, Liberati, Tetzla, Altman, & PRISMA Group, 2009). Similar to the
    CONSORT statement, the PRISMA statement consists of a 27-item checklist and a
    four-phase flow diagram to add to reporting of systematic reviews and meta-analyses
