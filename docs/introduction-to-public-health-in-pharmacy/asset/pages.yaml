    # Public Health and Pharmacy in the United States


    Chapter: Public Health and Pharmacy in the United States

    Author(s): Bruce Lubotsky Levin, Ardis Hanson, and Peter D. Hurd

    DOI: 10.1093/9780190238308.001.0001


    The World Health Organization (1948, p. 1) defines health within a

    socioeconomic framework with the intent to allow individuals to live

    productive lives: addressing physical, mental, and social well-being, not

    The absence of disease or illness. This definition, which has

    remained the same since 1948, is mirrored in the United States'' Healthy

    People initiatives, most recently Healthy People 2020. Healthy People

    2020 also addresses the relationships among the social determinants ofnhealth
    (Public Health Emergency, 2017) and how they affect and

    influence population health outcomes. Healthy People 2020 is noteworthy

    because it identifies the most significant public health issues in the

    United States and as a guide in improving the public''s health at

    local, state, and national levels. It is a 10-year "temporal snapshot" of

    what the United States sees as the most important health issues of

    address. In this chapter, we provide an overview of the US public health

    systems and pharmacy practice, research, and education.'
