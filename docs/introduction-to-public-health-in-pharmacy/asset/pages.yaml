    # Nutrition During Young, Middle, and Late Adulthood


    Young adulthood, which overlaps the last stage of adolescence, is generally from
    18 to 40 years of age. Growth is usually complete by the age of 25 years except
    if the individual is pregnant or lactating. Nutrient needs during this time vary
    very little. Middle adulthood begins from 40 through 60 years of age. The nutrition
    requirements begin to decrease as individuals reach middle age, as they are less
    active and may not be getting sufficient exercise. Weight control may become an
    issue individuals are consuming more calories than needed. Chronic illnesses may
    begin during this time frame as diabetes, metabolic syndrome, and hypertension.


    Late adulthood begins at the age of 65 years. The fast-growing population in the
    United States is people 85 and older, also known as the frail elderly. Nutrient
    needs are affected by many physiological factors as the body slows down. Poor
    nutrient intake and dentition problems can exacerbate a number of diseases, including
    cataracts, and osteoarthritis. Psychosocial changes such as no longer being independent
    or no longer feeling useful can also affect the quality of the individual''s appetite.
    A decrease in intake can also affect whether she may not be able to afford healthy
    foods. From the Centers for Disease Control and Prevention (CDC), adults in the
    United States have one or more chronic diseases and at least 50% have two (CDC,
    2016). The WHO (2016) suggests that 60% of adults are affected by chronic diseases,
    such as heart disease, stroke, cancer, respiratory diseases, and diabetes. Further
    of the 35 million individuals who died in 2005 from chronic disease worldwide,
    50% were under the age of 70 and half of the deaths were women (WHO, 2016). Here
    proper nutrition continues to play a role in prevention, management, and stabilization
    of these disease states.


    Because of these physiological, economic, and psychosocial changes, malnutrition
    is common among the elderly. Malnutrition rates vary by setting and are higher
    among those who are economically disadvantaged, socially isolated, or disabled.
    Kaiser and colleagues (2010) assessed the prevalence of malnutrition in older
    adults in various settings using the Mini Nutritional Assessment. In their dataset
