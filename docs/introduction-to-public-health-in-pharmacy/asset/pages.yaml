    # Preface


    **Author(s):** Bruce Lubotsky Levin, Ardis Hanson, and Peter D Hurd


    When the original edition of this book was conceptualized, it was heavily influenced
    by the CAPE 2004 Educational Outcomes from the American Association of Pharmacy
    and the discussions surrounding *Healthy People 2010*. Both of these documents
    created strong linkages between pharmacy and public health. Since that time, we
    have continued emphasizes the global burden of disease and the effects of the
    social determinants of health at both the national and international levels.


    This second edition continues to build upon the CAPE Educational Outcomes (2013)
    and *Healthy People 2020* emphasizing the importance of evidence-based practice,
    health promotion and disease prevention, health literacy, cultural sensitivity,
    patient-centered care and advocacy, medication management, cultural sensitivity,
    and awareness and analysis of emerging theories, information, and technologies
    in public health and pharmacy. The text also focuses on global health concerns,
    such as monitoring infectious diseases, measuring national and international capacity,
    and responding to emerging social issues and environmental conditions. Finally,
    the text weaves a global perspective of the challenges and benefits public health
    and pharmacy face in addressing the social determinants of health.'
