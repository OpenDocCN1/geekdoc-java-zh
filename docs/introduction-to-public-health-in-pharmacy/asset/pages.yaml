    # Haiti: A Case Study


    Haiti is the poorest country in the Americas and one of the poorest in the world.
    According to the World Bank (2016a), 6 million (59%) Haitians live below the national
    poverty line ($2.42 per day) and over 2.5 million (24%) below the national extreme
    poverty line ($1.23 per day). On January 12, 2010, a 7.0 magnitude earthquake
    devastated Haiti. The earthquake killed 220,000 people, injured over 300,000 people,
    and seriously damaged the health infrastructure; eight hospitals were totally
    destroyed and twenty hospitals were seriously damaged in the three regions most
    affected by the earthquake (Pan American Health Organization PAHO, 2010a). Approximately
    $8 billion of damages and losses occurred in Haiti (The World Bank, 2016a). This
    led to a global effort to restore the health of this developing country in the
    Caribbean.


    Imagine the difficulties of one of the poorest countries in attempting to cope
    with this disaster. An estimated 1.5 million people were displaced internally
    due to the destruction of houses and entire neighborhoods. The aftermath of the
    storm left a severe shortage of health care facilities. There was a lack of resources
    to bury the dead, with thousands of bodies being buried in mass graves. There
    was a near-failure of telephone communication systems. Impassable roads were covered
    by debris for months and years after the quake. The airport was too small to handle
    all the relief planes needed to land, and the ocean port needed repairs before
    ships could dock and unload safely.


    There was a lack of national resources, delays in clearing rubble from devastated
    areas, and language problems since many residents of Haiti speak only French and
    English speakers. Thus one can start to appreciate the magnitude of this disaster:
    Food, water, and medical supplies were priorities for the affected. Then, 10 months
    later, in October 2010, Haiti suffered the largest cholera epidemic in modern
    history, with more than 8,000 people died by 2013 (Gelting, Bliss, Patrick, Lockhart,
    & Handzel, 2013; Scheller & Levey, 2014).


    During 2010, cases of death in Haiti differed from that of the developed world,
    with 66% of deaths related to the disaster itself, 5% to stroke, 3% to cancer,
    and 2% to ischemic heart disease (Institute for Health Metrics and Evaluation,
    2015). In developed countries, such as the United States, heart disease, cancer,
    and stroke are among the leading causes of death (National Center for Health Statistics,
    2016).'
