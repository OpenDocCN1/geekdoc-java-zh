    # Implications for Public Health and Pharmacy Practice


    Collaborative and complementary practice, policy, and research agendas could generate
    systemic changes in public health. In 2014, the U.S. Institute of Medicine''s
    (I) Roundtable on Population Health improved "spread, scale, and sustainability"
    in population health. One of the first areas of business was to have workshop
    participants share how they understood these terms within the contexts of their
    work (OM, 2015). Workshop participants responded that a number of actions could
    help spread improvement in public health communication, addressing inequities,
    encouraging community leadership to create a culture and environment of health,
    developing policy and incentives to implement population health practices, and
    incorporating public health frameworks into training and education. Scaling requires
    strong metrics to make tangible and demonstrable effects of value related to rewards
    and incentives, clear communication, shared leadership, and a good grasp of the
    logistics to scale a program successfully. Achieving sustainability requires aligning
    incentives, planning for long-term financial management, establishing clear strategies
    to achieve goals, choosing the correct infrastructure to permit and scaling of
    a program, and encouraging community buy-in (OM, 2015).


    Innovative payment and service delivery models and strategies, such as incentives
    or accountable health communities, may help to improve population health (2015).
    However, evaluation methods will also need to capture more data than if the program
    achieved its desired outcomes; data should also address factors such as the length
    of time for implementation, relative costs, and costs of the demonstration project.
    Hence, local and relevant data are essential to defining targets and planning.


    A "health in all" (HIAP) approach, as those taken by Health 2020 and Healthy People
    2020, requires us to understand that mandates of all involved in the provision
    of health care may have very different agendas. Accordingly, we need to create
    a shared language that can further communication through the proverbial "table
    of dialogue." It requires us to have data on policy-relevant questions that demonstrate
    health has significantly improved and that we have achieved outcomes priority.
    This prioritizes the importance of using'
