    to help prepare community pharmacists for disasters by developing a disaster preparedness
    manual (Doe & Smith, 2013). Cohen (2003) gives detailed example of how a health-system
    pharmacy team might be organized in order to respond to terrorism attacks. Other
    researchers have developed a classification scheme for pharmacy personnel to identify
    essential actions that would ensure an effective emergency response (Alkhali,
    Ma, & Grenier, 2017).


    The American Association of Colleges of Pharmacy has produced a white paper on
    public health and the CAPE 2013 Educational Outcomes, which numerous ways to include
    public health in both introductory and advanced practice experience, focusing
    mostly on providing patient population care but including disaster preparedness
    (Covvey et al., 2016).


    Another project describes emergency preparedness modules used in an Introductory
    Pharmacy Practice Experience (Hannings, on Waldner, McEwen, & White, 2016). These
    simulated triage of injured patients, transport simulations, and mass-dispensing
    simulation. Students were evaluated on the accuracy of their performances and
    provided feedback about their experiences. Exposing students to these less than
    traditional pharmacy roles can help prepare for real emergencies, both small and
    regional.'
