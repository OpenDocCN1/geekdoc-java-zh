    to include more direct care, which includes disease management services. The ACPE
    Standards 2016 emphasizes the importance of patient-centered care, health and
    wellness, and population-based care (ACPE, 2015).


    The importance of nutrition and the prevention of illness and disease has been
    long recognized and encouraged. Healthcare professionals, specifically pharmacists,
    play a key role in promoting healthy eating, as they will encounter nutrition
    issues every day with the patients they serve. Through the wide range of medical
    problems, whatever is in the clinical or community setting, pharmacists'' need
    to understand the basics of nutrition working with the community. Healthcare costs
    have increased considerably, yet proper nutrition can help many illnesses. With
    public interest in nutrition, pharmacists need to be able to help the community
    in meeting their nutritional needs and goals.


    With over 24 million Americans suffering from chronic diseases such as heart diseases,
    diabetes, and weight/obesity, pharmacists have the opportunity to educate patients
    simultaneously on their medications as well as their nutrition. Pharmacists also
    have the opportunity to be aware of the latest innovations regarding weight loss,
    diabetes, and cardiovascular health. Weight loss can lead to decreased blood pressure,
    better glucose control, decreased low-density lipoprotein, and ultimately lower
    medication doses.


    The information presented in this chapter focused on providing pharmacists an
    overview of the nutritional needs of people during the various stages of life.
    It is important for pharmacists to have a baseline understanding of these nutritional
    needs for any given patient population. The chapter also introduced specific strategies
    and programs pharmacists can refer to or support healthy lifestyles and public
    health prevention strategies focused on nutrition. As a result, the new generation
    of pharmacists will be equipped with the knowledge not only to become medication
    experts but also to become a vital part in helping to support public health initiatives
    and providing population-based care through nutrition education.


