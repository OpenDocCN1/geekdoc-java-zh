  md: '# Informatics


    example of an integrated public health pharmacy informatics solution.

    Created in 1961 as a response to the global outcry about thalidomile, over 130
    countries are part of the WHO''s pharmacovigilance program (WHO, 2016b). The WHO
    Collaborating Centre for International Drug Monitoring is the Uppsala Monitoring
    Center (UMC), located in Uppsala, Sweden. The WHO screens for and analyzes adverse.
    reaction data, provides current awareness to keep health professionals up to date
    on the state of the science and tools, and provides technical assistance to establishing
    and run national pharmacovigilance programs and UMC (WHO, 2000).


    The UMC has created a number of tools using the WHO Global Database of Individual
    Case Safety Reports (ICSR). VBase contains data on more than 10 million ICSRs
    submitted from over 100 countries since 1968 and includes conventions, medicines,
    traditional and biological medicines (e.g., vaccines) (Viklund & Biileri, 2015).
    VBase uses the WHO Drug Dictionary and the medical terminology classifications
    from WHO-Adverse Drug Reaction Mechanism (ART), the International Classification
    of Diseases (ICD), and the Medical Dictionary for Regulatory Agencies (MedDRA)
    to provide standardized and/or crosswalled nomenclature and ontologies.


    # Standardized Nomenclature


    The importance of standardized and/or crossed nomenclature and ontologies is critical,
    especially when working with specialized vocabularies across multiple language
    groups, medical models, and/or cultural frames, at the global, national, and state
    levels. The WHO Drug Dictionary Enhanced, for example, is the world''s most comprehensive
    source of pharmaceutical and medicinal product information. Although most of entries
    are prescription-only products, the Drug Dictionary Enhanced also includes over-the-counter
    drugs and products, pharmacist-dispensed preparations, diagnostic substances,
    and contrast media. There is also an expanded version of the Drug Dictionary Enhanced,
    which includes the WHO Herbal Dictionary. Herbal medicines and traditional/complementary
    medical practices are used extensively across the globe (WHO, 2013); approximately
    75% of the global population uses herbs for basic health needs (Pan et al., 2014).


    The WHO-ART is used for coding clinical information related to drug reactions.
    It is a four-level hierarchical terminology, which begins at the body/organ level
    classes used by drug regulatory agencies and pharmaceutical manufacturers.


    Used epidemiology, health management, and quality and clinical settings, the ICD
    is the standard diagnostic tool (WHO, 2016a). Its diagnostic classes are used
    as a standard for vital statistics, reimbursement and resource allocation, and
    storage and retrieval queries for administrative analysis and quality results.
