    State and Territorial Health Departments


    State and territorial health departments (SHAs) have full or shared fiscal and
    programmatic responsibility for federal initiatives, including Women, Infants,
    and Children (a program administered by the Food and Nutrition Service of the
    United States Department of Agriculture), the CDC Preventive Health Services Grant,
    the National Cancer Prevention and Control Grant, HIV Programs, and Health Professionals
    Shortage Area Designations (ASTHO, 2011). In cases they do not have responsibility,
    state health agencies often share responsibility with another state; a local government
    agency, including local public health agencies; the state and territorial health
    agency workforce includes 100,000 full-time employees, with different governance
    structures, including centralized, shared, decentralized, or a mixed governance
    structure. Fifty-five percent of state health agencies are free-standing, independent
    agencies; the remaining state health agencies are part of a super or umbrella
    agency (ASTHO, 2011).


    State and territorial health agencies have three main roles: health protection,
    health promotion and prevention, and health treatment. Within these areas, they
    screen and treat for diseases and other health conditions, provide technical assistance
    and training, run laboratory services, and collect epidemiologic data and surveillance.
    As such, they provide population-based prevention services, helping to inform
    and educate people about health issues in states and territories. For example,
    88% of state agencies offer tobacco prevention and control services, 84% had HIV
    prevention programs, and 80% operated injury prevention programs (ASTHO, 2011).
    Almost 60% of the state health agencies are for infectious diseases, such as tuberculosis
    and sexually transmitted diseases, including HIV/AIDS (ASTHO, 2011). However,
    almost 80% of the agencies also provide services to children with special care
    needs. In addition to providing population-based services, state health agencies
    also enforce laws and regulations that protect health and ensure safety.


    Tribal Health Departments


    In addition to state and territorial health agencies, the US public health system
    also includes tribal health departments. A tribal health department is a "health
    department corporation or organization operated under the jurisdiction of a federally
    recognized tribe, or association of recognized tribes(s) and'
