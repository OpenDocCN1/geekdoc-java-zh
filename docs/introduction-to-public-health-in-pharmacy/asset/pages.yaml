    # # Hypertension


    Hypertension affects about one of three adults in the United States. It contributes
    to heart attack, stroke, heart failure, and kidney failure is often referred to
    as the "silent disease." In 90% of hypertension cases, the cause is unknown and
    referred to as primary hypertension. The other 10% caused by other conditions.
    Major risk factors for hypertension include age, genetics, obesity, sodium sensitivity,
    and alcohol.


    Lifestyle modifications and medications are used to treat hypertension. Weight
    control is the primary intervention if the individual is overweight. Regular physical
    aerobic activity can also reduce blood pressure. The Dietary Approaches to Stop
    Hypertension (DASH) diet is a lifelong approach to health that is designed to
    help treat or prevent high blood pressure (National Heart, Lung, and Blood Institute
    [NHLBI, 2003). The DASH diet encourages patients to reduce sodium and eat a variety
    of foods rich in nutrients, such as potassium, calcium, and magnesium, that help
    lower blood pressure. Emphasis is placed on fruits and vegetables for their potassium
    content, whole grains for their magnesium content, and low-fat calcium sources.
    Recommendations also include that individuals consume less red meat, sodium, sweets,
    and alcohol (NHLBI, 2003).


    # # Cancer


    Cancer is the second leading cause of death in the United States. The growth of
    malignant tissues that result from abnormal and uncontrolled cell division can
    develop slowly and continue for several decades. The etiology of cancer is not
    known; however, hereditary, environmental factors, and possibly emotional stress
    contributes to its development. Food and cancer have not been proven to have an
    association; however, certain substances in food have been identified as carcinogenic.
    Nitrates from processed and smoked foods as well as high-fat foods have been associated
    with cancers. Individuals who drink alcohol and smoke are at greater risk of cancers.
