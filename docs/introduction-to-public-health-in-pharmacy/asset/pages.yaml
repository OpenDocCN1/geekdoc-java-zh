    (e.g., cholesterol screening, immunizations, and bioterrorism). The course had
    a public health focus, including population-focused care and potential international
    issues such as responding to bioterrorism (Crawford, 2005). A few years later,
    Bailey and DiPietro Mager (2016) published a review of the pharmacy programs offering
    a global health education component (e.g., required course, a minor or certificate,
    dual degrees). Of 133 pharmacy schools in the review, more than 50 offered an
    elective or required course related to global health and more than 50 had global
    health experiential education. Their findings document the growing role of global
    health in pharmacy. While distinctions made between public health (especially
    focused on prevention), and global health (as a broader category, including an
    integration of population and individual patient concerns) may be helpful (Koplan
    et al., 2009), clearly public health responses in the community are responses
    to both local and international health issues.


    Another issue surrounding health behavior is the increased opportunity for health
    professionals and patients to engage in interactive health communication through
    innovations as online networks, personal digital assistants (including drug information),
    and text messaging. The potential for health interventions using these types of
    communication options are just starting to be used to change behavior. The potential
    goes far beyond the phone for a refill at the pharmacy and checking the web pages
    for information about the drug and the disease being treated. The evaluation of
    drug information and pharmacy websites in terms of their health contributions
    may be of both vital human interest and economic importance.


    Payers for services, such as Medicare/Medicaid and pharmacy benefits management
    companies, also have significant influences in encouraging widespread improvements
    in disease prevention and health promotion through the structure of their programs.
    Benefit design decisions and reimbursement systems can encourage individuals to
    take advantage of cost-effective preventive services and can encourage providers
    to offer preventive and/or treatment that promote effective health behavior. Reimbursements
    for pharmacy services that promote better use of medications or higher levels
    of compliance have the potential to foster population-based programs that would
    increase the health of the public.


    The value of evaluation and assessment of programs will continue to be an important
    part of the future of public health pharmacy. While implementing a program with
    good intentions is laudatory, demonstrating that the efforts actually worked (and,
    no harm) should be a central component for public health pharmacy practice. In
    evidencebased health care systems, providing the documentation of one’s successes
    is of immense value. Indeed, many of the behavior change'
