    # The Roles of Pharmacists


    # Pharmacists'' Identification of Low Health Literacy Patients


    Because of the unique access patients have to the pharmacist, they are uniquely
    positioned to identify patients with low health literacy and numeracy and have
    a positive impact upon them. When we encounter such a patient, it is important
    to understand that low literacy status or poor communication skills do not automatically
    translate into a lack of intelligence. The opposite is true many times; it is
    highly likely that many of these patients have developed sophisticated coping
    skills to help them navigate increasingly complex health care systems. As an example,
    patients will bring family members, including their own children, to complete
    forms and interpret instructions. With these survival mechanisms in place, it
    is often the case that the clinician will not realize the patient is unable to
    comprehend what is being said and therefore, unable to implement agreed-upon care
    plans. For these reasons, it is important for pharmacists to be able to identify
    patients that could be at risk, including those who be poor readers. The characteristics
    of poor readers were discussed in an earlier section of this chapter.


