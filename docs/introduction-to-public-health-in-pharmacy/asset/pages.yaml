    WIC is a health care and nutrition program for low-income pregnant women, breastfeeding
    mothers, infants and children under the age of five (Oliveira & Frazão, 2015).
    WIC eligibility, based on a financial need and a nutritional need (e.g., anemia
    or low body weight), allows WIC participants to buy nutritious food, including
    formula for infants, and services such as nutrition education breastfeeding support,
    and health care. Pharmacists may receive questions about what foods or formulas
    qualify for WIC benefits. The food items provided by WIC are milk, breakfast cereal,
    eggs, fruits and vegetables, whole-wheat bread, whole-grain items (e.g., brown
    rice and tortillas), fish (canned), legumes, and peanut butter. The program also
    provides tofu, soymilk, and medical foods for children and women with various
