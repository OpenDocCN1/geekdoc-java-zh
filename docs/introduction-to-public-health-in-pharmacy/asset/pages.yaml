    Pharmacy, established eight criteria that must be met for an issue to be defined
    as a public health problem. Professionals involved in addressing the public''s
    health can use the following framework to define, advocate, and articulate when
    to approach an issue from a public health perspective:


    +   1. Does it affect the health and well-being of the population?

    2. Is it widespread and increasing in scope and magnitude within a population
    or in a subgroup of a population?

    3. Does it affect health-related and other societal resources (e.g., economic
    and social impacts)?

    4. Does it challenge cultural norms and/or raise questions about values of life?

    5. Does it require collective measures and interventions based on disease prevention,
    health promotion, and education?

    6. Does it call for organized government intervention?

    7. Does it merit urgent action?


    The complexity of delivering competent care that is respectful of a heterogeneous
    patient population will multiply as the US and world populations become more diverse.
    Failures to recognize the role of culture significantly affected the health and
    well-being of the populace; these drastically influenced the utilization of resources
    and challenged how we value the individuality of a patient.


    Actions undertaken to resolve the lack of competent care include interprofessional
    collaboration and governmental action. Therefore, competent care meets these criteria
    to be classified as a public health problem. Modern public health practice requires
    interprofessional and transdisciplinary teams of public health workers and health
    care professionals including pharmacists, physicians, dentists, psychologists,
    epidemiologists, biostatisticians, physical therapists, medical assistants, nurses,
    environmental scientists, dietitians and nutritionists, veterinarians, public
    health engineers, public health lawyers, sociologists, community development workers,
    communications experts, and bioethicists.


