    # Centers for Disease Control and Prevention


    At the national level, the CDC is one of the 11 operating divisions within the
    Department of Health and Human Services, which is the principal agency for protecting
    the health of all Americans. Since its inception in 1946, the CDC has protected
    the health of the nation and promoted quality of life for Americans through the
    prevention and control of disease, injury, and disability. The CDC sees itself
    as a liaison, a facilitator of training, a provider of administrative and program
    management, and a sharer/disseminator of information to states (Fisher, Elliott,
    McCormick-Cochran, 2014). The CDC works closely with the state and tribal, local,
    and county public health offices with a variety of services, ranging from epidemiological
    studies, infectious disease assessment and identification, and technical assistance.
    In addition, the CDC, working with the Centers for Medicare and Services and the
    Agency for Healthcare Research and Quality, has increased national awareness of
    care-associated infections, developed public awareness campaigns, and provided
    an improved infrastructure and tools to diagnose and treat these infections (Srinivasan,
    Craig, & Cardo, 2012).'
