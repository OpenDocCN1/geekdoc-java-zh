    Pharmacy educators and pharmacy practitioners are exploring public health pathways,
    with many schools actively engaged in public health projects. This chapter provides
    some examples of this kind of collaboration between schools of pharmacy and various
    public health initiatives in local communities.


    # Campbell University School of Pharmacy


    Through the Campbell University School of Pharmacy''s Wellness Institute (2017),
    North Carolinians take a more active role in their health and gain access to health
    care providers. The Wellness Institute focuses on public health education approaches
    that can lead to healthy lifestyles for individuals. The Institute''s outreach
    includes health fairs and screenings at Campbell and in the surrounding counties,
    health and wellness presentations by faculty and students, diabetes education,
    and continuing education for health care providers. The program also runs a Diabetes
    Care Project for Campbell University employees and their dependents. Enrollees
    meet with clinical practitioners on a regular basis in this project. The Institute
    recognizes lifestyle choices made early have a long-term effect upon later years.
    The Campbell University College of Pharmacy and Health Sciences (2017) offers
    a master of science degree in public health, which can be combined with the doctor
    of pharmacy (PharmD) degree. This option is part of the various efforts to integrate
    pharmacy and other health professions at Campbell University.


    # Duquesne University Mylan School of Pharmacy


    Duquesne University''s School of Pharmacy operates a number of centers, some of
    which have direct links to public health. The Center for Pharmacy Care, established
    in 2002, is part of the Academic Partners Program and provide disease prevention
    and disease management services (Center for Pharmacy Care, 2017; Mylan School
    of Pharmacy, 2017). Outreach opportunities include a Health and Wellness Fair
    in downtown Pittsburgh, educational programs at high schools and elementary schools,
    and collaboration with the county health department on such topics as opioid abuse
    (Mylan School of Pharmacy, 2017).


