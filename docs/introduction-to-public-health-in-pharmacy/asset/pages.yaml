  md: '# Emergency Preparedness


    These types of educational projects put disaster/emergency preparedness in perspective
    for a pharmacy education program. Disaster preparedness correctly is considered
    a nontraditional role and is one that requires specialized training. Much of public
    health pharmacy has focused on disease prevention and health promotion.


    Pharmacists, and pharmacy students, normally have a limited exposure to the principles
    and structures of emergency management necessary to help coordinate effective
    and rapid responses. Ways to find these components of public health into a curriculum
    can be challenging but can also help pharmacy build on a strong foundation of
    patient and population care. Finding ways to communicate pharmacists'' capabilities
    and training to others will also be a challenge for the profession.


