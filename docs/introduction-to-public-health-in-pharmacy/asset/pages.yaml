    Automation Issues for Formularies


    Automation and re-engineering can play an important role in addressing formulary
    management. Traditionally, a formulary was a collection of formulas used to compound
    and test medication. Today, a formulary is an authoritative list of prescription
    drugs and drug products available to enrollees for use by a hospital, health system
    provider, or state/national health service. Basic information in a formulary database
    generally includes the names of the discrete therapeutic entities and commercially
    packaged products, a unique identifier (e.g., a National Drug Code, the names
    of the drugs contained in a drug product, administration protocol, side effects,
    contraindications, strength and dosage range, and price).


    A national formulary contains list of medicines approved for prescription throughout
    the country. According to the WHO (2015), over 156 countries have national lists
    of essential medicines, with separate lists for adults and children. Two examples
    of national formularies are the U.S. Centers for Medicare and Medicaid Services
    and the British National Formulary managed by the National Health Service.


    Automated pharmacy systems and pharmacy information systems formularies need automatic
    and synchronous updates to ensure accuracy across related purchasing, inventory,
    and dispensing systems. However, there are number of problems related to formulary
    interoperability, including formulary-database synchronization and syntactic and
    semantic interoperability (McManus et., 2012).


    In a study on two American Society of Health-System Pharmacists Section of Pharmacy
    Informatics and Technology webinars, participants voiced their frustration with
    a lack of synchronization among their formularies, the EMR, and "downstream" systems
    (Volpe et al., 2014). The inability to synchronize formularies with CPEE, e-prescribing
    systems, inventory and purchasing systems, dispensing cabinets, and unit dose
    robots, to many just a few, means pharmacists spend a significant amount of time
    doing manual entry and maintenance across numerous systems. Seventy-eight percent
    of participants reported manual entry, almost half of participants to keep the
    formulary updated, spent 10 or more hours, a week, and 51 percent reported they
    managed between five to nine systems to maintain current and updated formulary
    data (Volpe et al., 2014).


    Why are these issues problematic? Brooks et al. (2011) argue that manual synchronization
    is a major challenge for formularies. Manual entry increases risk of data-entry
    error, is labor and personnel-intensive, may not reflect actual time-dependent
    product or activity changes, and'
