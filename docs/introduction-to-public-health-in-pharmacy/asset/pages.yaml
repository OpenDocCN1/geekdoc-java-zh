    # Stage-Based Models


    Although there are many models to guide health communication, stage-based models
    are a useful approach to understanding human behavior. In the Transtoretical Model
    (also called "Stages of Change"), often used in smoking cessation counseling,
    there are five stages individuals undergo in the adoption of a new behavior or
    idea (Prochaska, DiClemente & Norcross, 1992): (a) precontemplation (no knowledge
    or intent of new behavior), (b) contemplation (learn or is thinking about the
    new behavior), (c) preparation (to intend, usually within the next 30 days), (d)
    action (the behavior is performed consistently), and (e) maintenance (the person
    performs the behavior change enough to change existing behavior; Prochaska et
    al., 1992).


    Another stage-based measure, the Patient Activation Measure (PAM®), identifies
    patients on the level of activation (Hibbard, Stockard, Mahoney, & Tusler, 2004).
    The patient believes he or her right is important; Level 2, the patient has the
    confidence and knowledge to take an action; Level 3, the patient takes the action;
    Level 4. The patient maintains the action during times of stress. Strategies and
    information are then tailored to support patients at different levels of activation
    and implemented in different clinical settings, situations, and approaches (Hibbard,
    2017). The PAM® is also available as a commercial product that has been useful
    in determining future emergency department visits, hospital admissions, and medication
    adherence.


    Stage-based models appear to be linear, but human behavior is often nonlinear,
    with moving back and forth skipping stages as they make decisions. In prevention
    programming, individuals may fall back into old habits or find better ways of
    doing something. Stage-based models highlight the need for intervention programs
    that are appropriate for groups at varying levels of willingness to adopt their
    behaviors. Interventions are more likely to succeed when they incorporate the
    patient''s understanding of health behaviors and readiness for change. Hence,
    understanding consumer motivation and'
