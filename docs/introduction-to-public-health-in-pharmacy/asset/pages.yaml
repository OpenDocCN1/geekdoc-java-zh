    # Implications for Public Health and Pharmacy Practice


    Although the ACA expanded health care and medication insurance coverage through
    Medicaid expansion and health subsidies, what does that mean for those who were
    uninsured? Mahendaratnam, Dusetzina, and Farley (2017) determined that Medicaid
    expansion offers vulnerable patients, who were previously uninsured, increased
    access to coverage and care, particularly to prescription drugs. Increased utilization
    in expansion states that the drops in per member quarter (PMPQ) partially attributable
    to successful risk-pooling. Increased PMPQ reimbursement may be due to new enrollment
    as changes in product market, risk pool composition, and drug pricing (Mahendaratnam
    et al., 2017).


    A second study by Ngsources and Mort (2016) examined the value of health plan
    subsidies, including cost-sharing for prescription drugs in the health insurance
    marketplace. The value of subsidies widely across geographic areas with different
    numbers of health plans. Further, although plans may have the same actuarial value,
    each plan has specific features that differ from other plans, which need careful
    examination to meet enrollee (patient) needs. They suggest it may not be feasible
    to reduce variations in health insurance plans unless new cost-saving features
    are adopted, such as a maximum out-of-pocket spending for drugs (Ngsources & Mort,
    2016).


    In terms of implications for pharmacy, the ACA extended health insurance benefits
