    # Health Literacy Defined


    Social Determinants of Health


    According to the World Health Organization (WHO, 2016b, para. 1), the social determinants
    of health


    are the conditions, in which people are born, grow, live, and age, and the wider
    set of forces and systems shaping the conditions of daily life. These forces and
    systems include economic policies and systems, development agendas, social norms,
    social policies and political systems.


    A primary determinant of health and wellness is people’s ability to process health
    information correctly in a timely manner; to balance the presented options, and
    to use judgement to make a decision regarding their health or improving their
    quality of life. These collective skills empower a patient to be a partner and
    more involved in his or her own health care: these skills are also known as health
    literacy (Sørensen et al., 2012).


    The relationship between literacy and health is very intricate. A patient’s literacy
    affects his or her health knowledge, health status, and how easily he or she can
    navigate health services. Literacy also affects a person’s income level, occupation,
    education, living quarters, and'
