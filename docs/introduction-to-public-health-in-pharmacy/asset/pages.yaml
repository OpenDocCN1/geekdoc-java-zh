    # Comparing Pharmacoeconomic Methodologies


    A true pharmacoeconomic analysis must consider and compare both the costs and
    the consequences of the intervention (i.e., the medication or pharmacy service).
    There are four basic types of pharmacoeconomic approaches: (a) cost minimization,
    (b) cost effectiveness, (c) cost utility, and (d) cost benefit. Each of these
    four types of pharmacoeconomic analyses measures the costs in monetary units (e.g.,
    US dollars); they differ, however, in the measurement of outcomes (Table 11-2).


