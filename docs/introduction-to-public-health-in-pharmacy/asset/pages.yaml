    into practice. Improving communication between the patient and pharmacist regarding
    health information reduces healthcare costs and increases the quality of health
    care. Health literacy is a complicated, crazy conundrum. In the words of the National
    Institutes of Health (2016), solving the problem of low health literacy saves
    time, saves money.


