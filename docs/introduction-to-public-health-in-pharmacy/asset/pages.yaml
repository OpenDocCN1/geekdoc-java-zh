  md: '# Cultural Perspectives in Public Health


    Cultural competence comprises the collective knowledge, abilities, attitudes,
    and aptitudes of practitioners to provide optimal services to a variety of culturally
    and ethically different patients. Competence begins with having skills to the
    patient''s care to determine if a cultural assessment is needed to be conducted.
    A culturally skilled practitioner is able to collect pertinent cultural data and
    perform a culturally appropriate physical assessment from a patient.


    # Culturalkinetics


    Culturalkinetics is a process (Bleidt, 1992); it is defined as the movement along
    the cultural integration continuum as new patients or cultures are seen. It involves
    understanding that others may not share your views or values. Baseline assumptions
    are established and used with each new encounter until enough relevant data has
    been obtained from a cultural assessment. The more specific, pertinent information
    is used with the patient, the more an understanding of who he or she is achieved.


    Through culturalkinetics, culturally competent behavior is a continuous process
    of self-awareness and self-improvement as more detailed knowledge is gained about
    each culture or patient, learning about cultural nuances and how they affect attitudes
    and health behaviors. Through this process one becomes more sensitive, understanding,
    and empathetic about these variances. Finally, cultural integration is reached
    when a practitioner is truly skillful in adapting and responding to those differences
    within appropriate contexts and circumstances.


    The process of culturalkinetics involves utilizing a set of skills needed to culturally
    assess a patient. According to Bleidt (1992), these skills includes


    +   * identifying and appreciating ethnospheric problems (such as bigotry);

    * respecting the person as a human being and his right to be treated as one;

    * accepting those who may be different as equals;

    * communicating in a cross-cultural fashion at the patient''s (consumer''s) literacy
    level without condesc;

    * being a good listener, empathetic, and polite;

    * understanding, without prejudice, differing value systems and beliefs the patient
    may hold;

    * connecting with the underserved;

    * identifying with a patient''s background and using this to link with him or
    her;

    * using innovative approaches from other cultures to solve individual problems;'
  merge: -1
  pgno: 145
