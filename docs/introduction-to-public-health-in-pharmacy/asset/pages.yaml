    # Sender, Audience, and Medium


    Another issue in consumer health education is the design of the message and the
    mode of delivery. Usually, using only a single message or a single medium is less
    effective than a multidimensional approach. The message is more effective when
    considering the various parts of communications, including the sender, the audience,
    the message, and the medium used to deliver the message. Health communications
    often use famous or well-known individuals as senders to relay messages that would
    appeal to a certain audience, but must be carefully match the appeal of the communicator
    with the needs of the audience. In addition to celebrities, peers, and individuals
    representing a trusted source, such as the health care provider, can also be effective.


    Different audiences often require different communicators, messages, and mediums.
    In a pharmacy chain serving multiple ethnic backgrounds, translations into other
    languages may be essential in an effective communication program. Older individuals
    may need larger print, while younger individuals may prefer social media as their
    source of information.


    Usually messages with a simple point in a straightforward format work well. For
    many audiences, a message that includes a human-interest story is more popular
    than statistics and, even these might also be included. The medium includes television,
