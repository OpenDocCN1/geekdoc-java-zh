    So not only is Hippocrates the father of medicine, but he is also the first epidemiologist.
    However, the observations of Hippocrates were often dismissed in favor of theories
    of disease causation, as miasmatic theory (“bad” or night air; 2001).


    By the 1500s vital statistics collections started to appear in the Western world.
    The city of London established weekly death registries, known as Bills of Mortality,
    which recorded burials by number buried the parish, the cause of death, and the
    gender of the deceased. In 1662, Captain John Grant wrote the firstNatural and
