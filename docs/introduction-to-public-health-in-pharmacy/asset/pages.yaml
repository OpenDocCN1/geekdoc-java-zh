    Created by the International Council for Harmonisation of Technical Requirements
    for Registration of Pharmaceuticals for Human Use (2013), MedDRA standardizes
    the sharing of regulatory information for medical products used by humans. MedDRA
    covers data on pharmaceuticals, biologics, vaccines, and drug-device combination
    products from the phase 1 to marketed product phase IV. By regulatory agencies,
    medical officials, public health researchers, and the drug industry, MedDRA’s
    multiaxial hierarchical classification system allows signal detection and/or monitoring
    of clinical syndromes when symptoms encompass numerous systems or organs.


    # Other Tools


    Other tools include CemFlow, a prototype data monitoring tool to analyze treatment
    data from cohort event programs developed in Nigeria and Tanzania Zone (Suku et
    al., 2015), and PaniFlow, developed for the Swiss agency Swissmedic to monitor
    adverse events following administration of drugs and vaccines against the influenza
    A H1N1 pandemic (Viklund & Biiersill, 2015). In addition to these tools specifically
    developed for WHO and UMC staff collaborators, there is VigiBase®, a publicly
    accessible interface to VigaBase; Users can find information about possible side
    effects of medication, gain a more global understanding of the effects of drugs
    on people, and learn more about drug safety (Uppsala Monitoring Centre, 2015).


    # Regional Perspective: SemanticHEALTH


    In 2008, the WHO conducted the Public Health Informatics Key Survey, which became
    the basis for a EU project. The 28 member states of the EU, which vary widely
    in size, wealth, and political systems, began the SemanticHEALTH project, which
    addresses semantic interoperability in health systems in the EU.


    Overall interoperability is defined as


    the ability, facilitated by ICT applications and systems, to exchange, understand
    and act on citizens/patients and other health-related information and knowledge
    among linguistically and culturally disparate professionals, patients and other
    actors and organizations within and across health system jurisdictions in a collaborative
    manner. (Strootmann et al., 2009, p. 10)


    Semantic interoperability (SIOP) identifies best practices in the coding, translation,
    and use of health information between patients, providers, and institutions and
