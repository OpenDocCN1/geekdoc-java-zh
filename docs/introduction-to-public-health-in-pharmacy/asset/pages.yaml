    # The Role of Pharmacy in Public Health


    As we stated earlier in this chapter: the importance of public health in pharmacy,
    particularly the community, cannot be overlooked. However, from a global perspective,
    there are great disparities in the distribution of pharmacies and pharmacists;
    in low-income countries, the density of pharmacists is greater than the density
    of pharmacists, suggests that there are issues in access to and supply of medicines,
    finding a skilled workforce, appropriate supervision of pharmaceutical services.


    # Internationally


    Founded in 1912, the International Pharmaceutical Federation (Fédération Internationale
    Pharmaceutique (FIP)) is a NGO representing over 3 million pharmacists and pharmaceutical
    scientists globally (International Pharmaceutical Federation, 2008). In 1948,
    the FIP established an official relationship with the WHO. The FIP''s strategic
    plan, 2020 Vision, provides a mission to “improve global health by advancing pharmacy
    practice and to enable better delivery, access and to safe use of appropriate,
    cost-effective, medicines worldwide” (International Pharmaceutical Federation,
    2008, p. 14). The FIP/WHO Guidelines on Good Pharmacy Practice: Standard for Quality
    of Pharmacy Services (International Pharmaceutical Federation & WHO, 2011) examined
    the national standards for pharmacy practice in 37 countries and counted with
    120 national member associations, the WHO, and additional experts.


    As FIP describes the evolution of the role of the pharmacist from a product focus
    to a patient focus, promoting wellness and preventing disease, collaborating in
    disease management programs become important areas for pharmacy practice, education,
    and policy at national and global levels. Handbook, Developing Pharmacy Practice–A
    Focus on Patient Care, reflects this transition to a patient-centered approach
    (e.g., pharmaceutical care Strand, Gous, Everard, 2000) incorporates the Pharmacy
    Activity Classification (PPAC) developed by the American Pharmacists Association
    to create a common language and framework that can help in assessing comparative
    studies research. The PPAC is also incorporated into data collection on activities
    of licensed, practicing pharmacists, from traditional dispensing to health systems
    management (see Box 2-1).'
