    Challenges in Re-engineering


    Re-engineering processes and procedures is much more than figuring out how to
    improve a process. The success of re-engineering often depends on a number of
    factors: financial, workforce, strategic, cultural, structural, technological,
    and security. Financial factors, as the cost of implementing HIT systems and potential
    liabilities in implementation and maintenance of HIT systems, often limit the
    use of these systems. Existing IT workforce may not be able to address the added
    complexity of implementing and integrating HIT systems. Organizations may not
    have incorporated HIT into their long-range strategic or operational plans, which
    would affect all of the factors nearby. Workplace culture may be primed to adapt
    successfully to new ways of working in new technology structurally, technology,
    as in hardware, is inherently problematic with interoperability and cross-platform
    migration issues. Operating new technologies is a major technological challenge.
    The more complex the HIT, the less intuitive "click here" buttons or easy-to-use
    "plug and play" modules will be available. It is better for users to change roles
    or workflow processes, especially with new systems to learn and use.


    Finally, security in HIT and health delivery in the United States focuses on privacy
    and confidentiality by the Health Insurance Portability and Accountability Act
    (HIPAA) standards. However, since federal HIPAA may be preempted by more rigorous
    state standards, there are hindrances to interstate flow of patient information
    that cannot be easily resolved.


