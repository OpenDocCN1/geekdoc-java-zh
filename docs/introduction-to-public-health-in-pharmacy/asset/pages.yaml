    # Medication Safety and Pharmacovigilance


    Pharmacovigilance (PV) is not only a global issue but has the global potential
    to improve health care considerably. The adverse effects of thalidomide used worldwide
    in the early 1950s and early 1960s were considered the turning point regarding
    the need to monitor the effects of pharmaceuticals globally. The definition of
    PV spans public health, population health, and practice (WHO, 2006). The WHO (2002b,
    2006) use the term to refer to detection, assessment, and prevention of adverse
    effects or other drugrelated problems. The International Pharmaceutical Federation/Fédération
    Internationale Pharmaceutique seems the foundation of PV by monitoring the use
    of medicines, after approval, for safety and effectiveness (International Pharmaceutical
    Federation, 2006).


    Why the emphasis on PV? The answer is simple: to reduce the number of adverse
    events that occur during any form of pharmaceutical treatment, whether they are
    serious events (SRE), adverse drug events (ADE), or adverse drug reaction (ADR).
    An SRE is a preventable, serious, and unambiguous adverse eventthat should never
    occur. An ADE is an unexpected medical occurrence that may present during treatment
    with a pharmaceutical product. An ADR is an unwanted, undesirable effect of a
    medication during usual clinical use. An ADE differs from an ADR in that the former
    was not part of a causal relationship between the patient and the drug, whereas
    an ADR is a causal effect. SREs have ADEs and ADRs as a component of an adverse
    event, reporting as much information as possible about the event is critical to
    improving patient care and outcomes. Since an SRE is clearly identified and measurable,
    information about an SRE is important to have in a reporting system. Because the
    risk of occurrence is more likely to occur based on a health care facility''s
    policies and procedures, SERs are important to public and health care professionals
    and providers (National Quality Forum, 2011).


    A systematic review of research on pharmacy dispensing errors, with data from
    Australia, Denmark, Spain, and the UK, found the incidence of dispensing errors
    in community pharmacies in hospital remained ranged between 0.01% and 3.32% and
    the incidence between 0.02% and 2.7% (James et al., 2009). The incidence of dispensing
    errors varying by the setting setting, dispensing system, research method, and
    operational definitions (James et al., 2009).'
