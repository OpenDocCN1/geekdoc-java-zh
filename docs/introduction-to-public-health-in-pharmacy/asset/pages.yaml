    contract service(s) from the Indian Health Service" (National Indian Health Board,
    2011).


    Established in 1955, the IHS, an agency within the Department of Health and Human
    Services, is authorized to provide health care to approximately 568 native American/Alaska
    tribes (approximately 5.4 million members; Bureau of Indian Affairs, 2012; U.S.Census
    Bureau, 2012) through the Indian Self-Determination and Educational Assistance
    Act of 1975 (Pub. L. 93-638). In 2011, 36 out of 51 tribes (70%) reported they
    worked with Native American/Alaska populations (ASTHO, 2011).


    Since tribes are recognized as independent sovereign nations, they have a unique
    government-to-government relationship with the US federal government. Each tribe
    negotiated with the IHS. Each tribe identifies which programs and services it
    addresses, and prioritizes community health needs. In addition to tribal health
    departments, three other types of facilities also provide health care: (a) IHS
    facilities, (b) an Indian Health Board or Tribal Councils, and (c) Urban Indian
    Health Centers (National Indian Health, 2011).


    # Local (County/City) Health Departments


    A LHD is defined as "an administrative service unit of local government, concerned
    with health, and carrying some responsibility for the health of a jurisdiction
    smaller than the state" (National Association of County and City Health Officials
    [NACHO], 2011, p. 3). The first study in the United States of public health infrastructure
    and practice, Report of the Sanitary Committee of Massachusetts, was written in
    1850 by Samuel Lhattuck (Turnock & Barnes, 2007). It preganted the beginning of
    LHDs. By 1911, county-based LHDs were appearing throughout the United States.
    By 1943, there were 178 LHDs in 31 states (Turnock & Barnes, 2007). In 2010, there
    were 2,565 LHDs, excluding Hawai''i and Rhode Island, since those states operate
    under the state health departments and have no subunits. Although a 1945 report
    suggested that local health systems could be most effectively to serve fewer than
    50,000 people, today LHDs serve populations from less than 25,000 (1,067 LHDs)
    to populations over 1 million or more (41 LHCs: NACHO, 2011). LHDs provide a range
    of services, including adult and child immunizations, infectious/communicable
    disease surveillance, tuberculosis screening and treatment, environmental health
    surveillance, school/day care inspections, population-based nutrition services,
    food service establishment inspections, and safety education.


    # Local Boards of Health


    A LHD differs from a local board of health in that the latter is a legally designated
    governing body whose role is to oversee the public agency, focusing on community
    health assessments, and policy development. Approximately 75% of LHDs a


