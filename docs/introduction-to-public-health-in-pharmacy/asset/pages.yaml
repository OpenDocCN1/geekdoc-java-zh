    # Emergency Preparedness 🔒


    Chapter: Emergency Preparedness

    Author(s): Peter D Hurd, Stephanie Lukas, and Ardis Hurd

    DOI: 10.1093/med/9780190238308.003.004


    While this chapter focuses on the US health systems and emergency preparedness
    within borders, other chapters in this book highlighted public health emergencies
    in other parts of the world, ranging from tuberculosis, polio, measles, tobacco,
    and Ebola to the earthquake in Haiti. However, manmade events affect public health
    and result in great suffering to countries. Such public health emergency/disaster
    was the 1994 genocide in Rwanda, which took place during the Rwandan Civil War
    (1990-1994) against ethnic Tutsis and moderate Hutus. This led to the deaths of
    1 million people and the displacement of many (Binagaho et al., 2014; Centers
    for Disease Control and Prevention [CDC], 1996; Hintjes, 1999).


    From a public health perspective, this was on overwhelming catastrophe: bodies
    to be buried, epidemic rape and violence against women and girls, the spread of
    HIV/AIDS, and a very slow response from outside countries (Dabelstein, 1996; Mandelbaum-Schmid,
    2004; Verwimp, 2004). Refugee camps led to misery, dehydration, and cholera (CDC,
    1996). The lack of food, potable water, and health infrastructure contributed
    to the spread'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Emergency Preparedness


    of disease and rising rates. The public health needs included such basics as clean
    water and safe food, access to health care and mental health care, housing, and
    for orphaned children. More than 20 years later, there remain a number of postconflict
    and generational trauma that still require intervention, as mental illnesses,
    the lack of adequate housing, refugee repatriation, for orphaned children, violence
    prevention, alcohol, infectious disease transmission and treatment, and at-risk
    behaviors (Caserta et al., Pirtilla-Backman and Punakami, 2016; Chaudhary et al.,
    2016; Neubauer et al., 2016; Rubanzana, Hedt-Gauthier, Ntaganira, and Freeman,
    2015). The Rwandan tragedy helped through war, crisis, and violence to emphasize
    public health''s role (Willis & Levy, 2000). However, today, pharmacy also has
    a large role to play within US borders.


    # Basic Terminology and Concepts


    When people think of emergency preparedness, they often consider it in the context
    of some disaster. The Federal Emergency Management Agency (FEMA, 1996, p. GLO-1)
    defines disaster as "an occurrence of a natural catastrophe, technological accident,
    human event that resulted in severe property damage, deaths, and/or multiple injuries."
    This is similar to how "emergency" is defined: "Any occasion or instance, such
    as a hurricane, tornado, storm, flood, tidal wave, tsunami, earthquake, volcanic
    eruption, landslide, and mide snowstorm, fire, explosion, nuclear accident, or
    any other natural or manmade catastrophe, warrants action to save lives and protect
    property, public health, and safety" (FEMA, 1996, p. GLO-2). From a public health
    perspective, we classify emergencies by their causes, precipitating events, and
    health consequences, which scale and unpredictability overwhelm capabilities.
    The definition aligns with FEMA''s (1996) all-hazard approach to preparedness
    used within the United States as well as health care and government responders
    (Joint Commission, 2016; Office of Public Health Preparedness and Response, 2013).


    Most people consider an epidemic or a public health emergency. An epidemic is
    the occurrence of more cases of a disease than would be expected in a local community
    during a given period. A pandemic is when an epidemic becomes very widespread
    and affects a whole region, a continent, or the world, such as avian flu or AIDS.
    However, a natural disaster: one with catastrophic consequences (e.g., hurricane,
    flood, or earthquake), may also have public health consequences (e.g., sanitation,
    water, decreased access to medication and health care), which may set the stage
    for somatic and/or psychiatric diseases. Preparing for these types of events requires
    numerous types of responses at multiple perspectives. Here the public health viewpoint
    addresses each level of response (local, state, regional, national, international)
    and across numerous stakeholders.'
