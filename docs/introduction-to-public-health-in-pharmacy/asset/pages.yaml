    # Measurement of Health Outcomes: Types of Measures


    We measure epidemiology in many ways. We measure the frequency of disease and
    death, the impact on populations, and patterns of disease transmission. Mortality
    and morbidity the frequency of the occurrence of deaths in a defined population
    or the incidence or prevalence of a disease in population, respectively. Then
    there are disease phases (i.e., a measure of time) including incubation, latency,
    acute, decline, and convalescent periods. Then there are measures of effect, such
    as risk and ratios.


    Counts are the most basic of ways to measure. They refer to the number of cases
    of a disease or other health event under study. For example, if we know the documented
    number of cases in Guangzhou, China, then that knowledge assists us in planning
    for current and future resources that may be necessary, such as medical personnel
    and amount of vaccine needed for that number of cases. However, counts do not
    reflect the total number of people who may be affected by a disease. So we also
    use measures, including proportions, ratios, and rates, which are mathematical
    equations with numerators and denominators.


    Proportions examine all people with the health event of interest (A, numerator)
    and all persons in the total population (A + B, denominator). Determining proportions
    provides a way to estimate the number of people who are at risk of developing
    diseases or specific health outcomes. Hence, proportions show probable relationships
    using probability theory. To make proportions easier to understand by the lay
    public, we multiply proportions by 100 to arrive at a percentage.'
