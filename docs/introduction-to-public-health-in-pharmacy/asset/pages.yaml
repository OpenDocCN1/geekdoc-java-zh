    # Capitation/Prospective Payment


    The search for controlling health costs leads to the introduction of another type
    of financing system, called capitation financing, which includes plan payment
    and provider capitation. Under a capitation plan, a public program (e.g., Medicaid)
    or a private entity pays a fee for each person covered for a specified period
    to a health plan. For example, the CMS, the state, and a health plan will enter
    into a three-way contract in order to provide comprehensive, coordinated care
    to recipients. The health plan then determines which services it will deliver
    and how it will pay its health care providers. Since the health plan now carries
    risk for the services delivered, there is a strong financial incentive to control
    service use. Under provider capitation, providers receive a fixed amount for each
    person designed Similar to plan capitation, the risk shifts to provider, providing
    an incentive for efficient treatment. However, provider capitation is more limited
    due to provider resistance to risk shifting, administrative costs for capitation
    payments, and the difficulty in determining capitation rates for specialty services.


    Here, is a conundrum. FFS contains incentives to overprovide care (more cost),
    whereas capitation contains incentives to underprovide health care services (less
    cost). While capitation has been shown to reduce the costs of care, there is concern
    that the quality of care may suffer, leading to poorer patient outcomes (Barham
    & Milliken, 2015; Flodgren et al., 2011; Zuvekas & Cohen, 2010; Zuvekas & Hill,
    2004).


