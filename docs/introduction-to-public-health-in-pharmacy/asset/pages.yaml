  md: '# Global Health


    country. Developing countries face additional challenges: high infant mortality
    rates, infectious diseases and sexually transmitted diseases, chronic diseases,
    aging populations, and a lack of infrastructure to address all of these challenges.
    With an increasingly mobile global population, infectious and communicable diseases
    can spread across the world before detection.


    Simply stated, the lower an individual''s socioeconomic status, the worse his
    or her health will be. Hence, the simplest definition of health equity is the
    "absence of systemic disparities in health (or in the social SDH) between social
    groups who have different levels of underlying advantage/disadvantage" (Braveman
    & Gruskin, 2003, p. 254). To achieve health equity means that all individuals,
    regardless of social standing, have equal access to health care, nutrition, healthy
    environments, and effective disease prevention strategies. Therefore, health inequities
    are disparities in health (or its social determinants) that favor more advantaged
    groups. Health disparities refer to differences between social groups, regional
    populations, and racial and ethnic groups. The notion of health disparity means
    the health of one group is worse in comparison with another country.


    In discussing health inequalities, people tend to try to fix these differences.
    Disparities focus on health outcomes that differ, and perhaps a better focus is
    on health equity. In any event, these terms have been used in a variety of ways,
    usually referring to factors that could be more equal, resulting in better health
    outcomes. However, inequalities requires monitoring health (i.e., health status)
    and health care (i.e., health services, resource allocation, financing, utilization,
    and quality). Hence, "monitoring equity" requires ongoing assessment of how different
    social groups fare in absolute terms and identifying the size of gaps between
    groups (Braveman, 1998, 2003), a sort of early warning system to bring attention
    to the effectiveness of health and health care services and policies. One could
    argue the national (U.S.) Healthy People and regional (European) are monitoring
    equity, as the objectives of both initiatives are to improve population health
    and reduce health disparities.


    In 2005, the World Health Organization (WHO) established the Commission on Social
    Determinants of Health to promote health equity through a global agenda. To do
    so, the Commission determined key areas and necessary actions to address daily
    living conditions and the underlying structural, social, economic, and political
    drivers. The Commission (2008, p. 2) offered three basic principles and a framework
    to (a) improve the conditions of daily living; (b) tackle the inequitable distribution
    of power, money, and resources; (c) measure and understand the problem and assess
    the impact of actions taken. Figure 3-1 offers by Diedrichsen et al.’s (2001)
    social production of disease model, upon which the SDH are based.'
