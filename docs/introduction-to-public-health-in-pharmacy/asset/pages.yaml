    # Global Perspective: Nutrition Transition


    In this section, we discuss the rising prevalence of obesity and obesity-related
    disease experienced in developing countries with current thoughts on the etiology
    of changes. Once a problem of high-income countries, obesity is becoming a serious
    issue globally. Many low- and middle-income countries are facing a double burden
    of disease; these countries to struggle with problems of infectious diseases and
    malnutrition while experiencing a surge in obesity and noncommunicable diseases
    (WHO, 2013). The worldwide obesity prevalence has more than doubled since 1980
    (Finucane et al., 2011). Obesity has clearly reached pandemic status, and has
    debilitating repercussions.


    The rise in worldwide obesity is due to the nutrition transition being experienced
    by developing countries. In the nutrition transition, there are significant changes
    in diet and activity patterns. In country after country, a shift in the diet has
    been noted (Park, 2008; Popkin, Adair, & Ng, 2012; Wright, Corvin, Hoare, & Epps,
    2015). Specifically, dietary changes include a large increase in the consumption
    of fat, added sugar, and animal products with a decrease in traditional foods,
    grains, and fiber (Popkin et al., 2012). Concurrently, there have been changes
    in activity patterns as well. Many countries are moving from agricultural economies
    to industrialized economies. As a result, people are now working in less labor-intensive
    jobs. There also been a change in leisure activities to more television viewing
    and computer browsing. It is easy to see how these lifestyle changes of increased
    calorie consumption and sedentary behavior are widely accepted as major contributors
    to these increases in obesity.'
