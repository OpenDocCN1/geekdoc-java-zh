    causing cholera, to the problems of this small, poor country (Ferreira, 2016).
    The World Health Organization (WHO) pledged to send 1 million doses of cholera
    vaccine to Haiti [Staff], 2016. In a country like Haiti, the challenges for young
    children are much more than the risk of cholera; risks include malnutrition, lack
    of health facilities or access to, and simply having a safe, dry place to sleep.


    Cholera was unknown in Haiti until 2010 (a massive earthquake in Haiti that led
    to a worldwide response to help; see Chapter 3 in this volume) when United Nations
    peacekeepers improperly disposed of waste from their base, which spread disease
    throughout the river system that was used for drinking water. Roughly 10,000 people
    have died from cholera since 2010. The fact that a hurricane can exacerbate the
    impact of cholera on those trying to help an earthquake underlines the complexities
    of worldwide public health efforts in health promotion and disease prevention.
    Today, a vaccine that is effective and affordable (Desai et al., 2016) can help
    the 1.3 billion people at risk for cholera, reduce the estimated 2.86 million
    cholera cases annually, and decrease the estimated 95,000 deaths annually from
    cholera (Ali, Nelson, Lopez, & Sack, 2015). The availability of a vaccine for
    cholera is one of many ways that public and private payers are offering an array
    of prevention and wellness programs.


    In the United States, Medicare offers screenings, employer-based payers offer
    memberships and nutrition classes, and patient self-management programs are reeling
    in the costs and deleterious effects of chronic illnesses, offering a significant
    return on investment. Consumer-directed care places patients and consumers in
    the driver''s seat of their public health delivery systems. The current facturation
    with health and wellness may be the very catalyst we need for making individuals
    take greater ownership of their own health care, realizing the personal benefits
    that are gained and the benefits that can accrue to society for individual action.
    Time will tell if these approaches steer consumers and patients down the same
    road that John Snow led to


    The unsustainable nature of our current health care delivery systems is awakening
    many payers, employers, health care providers, policy analysts, individual consumers,
    and patients to the benefits of improving behaviors that negatively affect health
    and health of populations. Nevertheless, what programs are most needed and most
    beneficial in changing behaviors? A basic tool of public health programs, community
    needs assessment, is key to effective community health promotion. Other elements
    of health care delivery systems are also looking at the health needs of local
    and regional populations. Organized pharmacy is a part of this focus on community
    engagement and public health. Health educators and pharmacy practitioners are
    exploring public health pathways, with many schools actively engaged in public
    health projects. Examples of this collaboration


