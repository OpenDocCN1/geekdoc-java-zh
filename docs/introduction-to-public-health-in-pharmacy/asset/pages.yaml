    Costs are computed to approximate the magnitude of resources (inputs) consumed
    when creating a product or service (Box 11-1). If a resource, such as time, is
    used for one task, it is no longer available for use another. The opportunity
    cost describes the value of a resource in its next best use. This implies a choice
    between desirable mutually exclusive results and is not necessarily restricted
    to monetary or financial costs (e.g., time). The price or the cost charged (not
    the same as cost) is the amount of money that a consumer'
