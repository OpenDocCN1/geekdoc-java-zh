    nutrition may also become necessary if cachexia is extreme.


    # Diabetes


    The prevalence of diabetes among children and adults has risen dramatically in
    the past decade. Diabetes is one of four noncommunicable diseases targeted by
    world leaders (WHO, 2016). In 2012, 2.1 million (9.3%) Americans had diabetes
    and another 86 million prediabetic, with an estimated 1.4 million new cases each
    year (American Diabetes Association, 2016). In 2008-2009, there was an estimated
    23,525 Americans under the age of 20 who were diagnosed with diabetes (CDC, 2014).
    In 2012, that figure rose to 208,000 (CDC, 2014). Blindness; heart and kidney
    disease; amputations of toes, feet, and legs; infections; and death are all conditions
    that can be attributed to diabetes. Diabetes represents the seventh leading cause
    of death in the United States (CDC, 2014).


    Globally, an 422 million adults were diagnosed with/or living with diabetes in
    2014 (WHO, 2016). Low- and middle income countries have seen a dramatic increase
    in the prevalence of diabetes, reflecting an increased in risk factors, such as
    being overweight or obese. In 2012, diabetes caused 1.5 million deaths and contributed
    to an additional 2.2 million deaths, due to increased risks for cardiovascular
    and other diseases (WHO, 2016). The economic impact of diabetes is estimated to
    be more than $827 million, with families and individuals at risk for incurring
    catastrophic medical expenditures (WHO, 2016).


