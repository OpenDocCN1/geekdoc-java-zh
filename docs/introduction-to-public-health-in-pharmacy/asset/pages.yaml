    # Nutrition in the Lifecycle


    # Nutrition During Pregnancy and Lactation


    Community pharmacists play a role in advising mothers-to-be about the nutritional
    requirements essential at each stage of pregnancy for both the short-term and
    long-term health of the baby. Many women may not be aware of the different nutritional
    requirements as as planning food for these stages. Pharmacists can assist and
    focus on nutritional problems that may arise in pregnant women and suggest simple
    dietary changes for a safe pregnancy and good health of the child.


    A woman''s calorie and nutrient need increases significantly to support the growth
    of the developing fetus. The average weight gain pregnancy is 25 to 35 pounds
    (Roth, 2014). Pregnancy requirements increase up to 60 grams of protein per day
    and are important for tissue building. The key nutrients, iron, calcium, zinc,
    and vitamin D are especially important considerations during pregnancy as well
    as for the long-term health of the baby. Teenage pregnancy is of concern, as these
    young women will need to know their own nutritional needs and the additional requirements
    for pregnancy. Pharmacists can assist in providing counseling on nutritional intake
    through tools as *MyPlate*.


    Community pharmacists can play a key role in breastfeeding promotion and support
    (Ronai, Taylor, Dayton, & Feeller, 2009). Breast milk provides hormones over the
    life of the infant. It provides'
