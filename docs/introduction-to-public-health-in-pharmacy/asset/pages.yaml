    # Implications for Public Health and Pharmacy Practice


    Transdisciplinary professionalism can be defined as interprofessional collaboration,
    shared values, and shared accountability for improved patient outcomes. This approach
    would involve interprofessional teamwork, synthesis and extension of discipline-specific
    expertise, new ways of engaging individual patients and providers, and improving
    health. With the passage of the Affordable Care Act, health care providers must
    work together to provide integrated, coordinated care. Hence, the need of an understanding
    or creation of a model of transdisciplinary professionalism is pertinent. The
    IOM (2013,",'
