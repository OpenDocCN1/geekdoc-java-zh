    right lactose, water, essential fatty acids, and amino acids for brain development,
    growth, and digestion. It takes two to three weeks to fully establish a feeding
    route, so no supplemental feedings should be given at this time (Roth, 2014).
    Breast milk is formulated to meet the infant''s nutritional needs for the first
    six months of life. Some mothers may not want or cannot breastfeed their infants.
    They may seek out their pharmacist for a milk substitute (e.g. infant formula)
    and bottles and nipples, which are sold in the pharmacy. Pharmacists should be
    knowledgeable in the nutritional content of breast milk substitutes and baby food.


    The mother''s calorie requirements increase during lactation and depend on the
    amount of milk produced. During the first six months of breastfeeding, an increase
    of 500 calories a day is required and then 400 calories a day for seven to nine
    months (Roth, 2014). If the mother''s diet contains insufficient calories, the
    quality of milk is reduced. This is often seen in women living in developing countries.
    It is important to educate women that they should not try to lose weight while
    breastfeeding. This is often seen in women living in developing countries (World
    Health Organization [WHO] & UNICEF, 2003).


    Most chemicals a woman consumes enter the mother''s milk, so it is important for
    women to breast check with their local pharmacist and/or physician regarding any
    current medications and nutritional supplements they might be taking. Alcohol
    in excess should be avoided, and if she does drink a mother should not breastfeed
    until the alcohol has cleared her system, which is generally two to three hours.
    Caffeine should be limited to the equivalent of two to three cups of coffee per
    day, as this may affect the baby''s energy and sleep. Prescriptions such as methadone
    and oxy can make the baby drowsy and irritable. In a survey among pharmacists
    in Rhode Island, almost 50% reported inquiries about breastfeeding and medication
    safety on a weekly or daily basis. Of, 85% of responding pharmacists feel uncomfortable
    breastfeeding mothers over these concerns.


