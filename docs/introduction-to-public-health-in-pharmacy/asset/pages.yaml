    # Precede-Proceed Model


    The Precede-Proceed model has been used in many health promotion and disease research
    projects, education programs, and community applications for over 40 years and
    builds on the work of Lawrence W. Green and others (Green, 1974; Green & Kreutfer,
    1992). The Precede-Proceed framework is founded on disciplines that include epidemiology:
    the social, behavioral, and educational sciences; and health administration. The
    approach includes a focus on the desired outcomes and a plan to achieve them.
    The model moves from planning to evaluation, emphasizing the numerous forces that
    will affect a successful health program. The Precede component of the model includes
    predisposing, reinforcing, and enhancing constructs. The Proceed component of
    the model includes policy, regulations, resources, and organization. The model
    can be very useful in providing a structure to apply various theories of health
    behavior. Working with both a planning stage and an implementation stage. Part
    of the participation can involve extensive data collection and analysis, not just
    laying the foundation throughout the project and the evaluations. The data collection
    does require a strong community involvement in the project. The process can be
    broken down into stages, with an initial assessment and concluding with an evaluation
    of the achievement of outcome (Gielen, McDonald, Gary, & Bone, 2008).


    # Intervention Programs


    Effective intervention programs can be designed for individuals at different age
    levels while sharing the goal of health promotion or disease prevention. For interventions
    that focus on individuals who are young to have graduated from high school, efforts
    would include the adolescents'' social environments and address multiple sources
    of influence within their environments. For programs like smoking and drug abuse,
    these efforts are often most effective when applied early (e.g., in primary schools)
    and continued through adolescence. This kind of program usually includes teacher
    training, programming for students, and parent classes. Similarly, interventions
    for older adults should focus on the individual''s knowledge and motivation, social
    settings and support systems, and even changes in laws and public policy. A successful
    flu immunization campaign at the public health level might address each of these
    areas (where and how much, community groups for the locations, and who receives
    first priority).


