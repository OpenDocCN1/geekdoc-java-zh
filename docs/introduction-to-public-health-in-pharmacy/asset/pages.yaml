  md: '# Global Health


    TB has both a "global" public health story and a "drugs" public health story,
    providing insights about the role of public health in disease prevention. The
    symptoms of TB include coughing, blood in sputum, weakness, and weight loss. Coughing
    and coughing can spread the disease to others. There are simple tests to detect
    if a person has infected with TB bacteria in humans, as mentioned earlier, the
    Mantoux tuberculin skin test is still in use as TB blood tests know interferon-gamma
    release assays (IGRAs). The US Food and Drug Administration (FDA) approved the
    QuantiferON® TB Gold In-Tube test (Q-GIT) and the T-SPOT® TB test (T-Spot). However,
    to confirm TB as an active disease, x-rays and sputum samples are necessary. Some
    treatments of TB include active monitoring by health workers, who observe and
    confirm that patients take the medications as directed, both to ensure a disease
    cure and to reduce the chances that resistant strains will evolve.


    Today, when people think of TB, they think of the drugs that can treat the disease.
    However, effective drugs were developed, public health practices were the pasteurization
    of milk, rules against spitting in public, and isolation of those persons infected
    with active TB. These practices led to a reduction in people with the disease.
    Deaths from 190 deaths per 100,000 in 1900 to 40 deaths per 100,000 in the 1940s,
    drugs, such as streptomycin, were first used, followed by isoniazid in 1950, which
    was much effective (Centers for Disease Control and Prevention [CDC], 1999). TB
    continues to decline, and today the rate is lower than 10 per 100,000 in the United
    States.


    The key public health lesson is the explanation of the disease decline prior to
    the marketing of effective drugs that treated the disease. This highlights the
    role that public health has played in the fight against many many diseases and
    the improvement of the health of society. However, the drug side of the story
    continues because there are drug-resistant strains of TB to the drugs that worked
    so well previously. These strains developed partially because patients stopped
    taking the drug early and the bacteria that remained resistant to the drug.


    From a public health perspective, the incidence of TB and the deaths from TB are
    higher in countries with lower income levels, with Africa, Southeast Asia, and
    the Western Pacific the most affected regions of the world (Henry K. Kaiser Foundation,
    2016). The effects from social determinants of health (SDH) are seen in global
    health, where the relationship between poverty and poor health is an important
    concept to understand TB from a global public health perspective.


