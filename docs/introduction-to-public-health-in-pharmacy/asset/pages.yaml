  md: '# Emergency Preparedness


    Since disasters are difficult to predict or control, planning for them is critical
    so responders can implement carefully made plans with very little delay when they
    occur. In the United States, emergency preparedness is designed to help communities
    prepare for natural events and manmade events (Office of Public Health Preparedness
    and Response, 2013). The CDC’s Office of Public Health Preparedness and Response
    (2013) defines category types by five major categories (see Figure 14-1). However,
    it is easy to see how these categories may overlap when looking at disasters.


    ![](img/bab568132a8b848885368f29e8af2454_312_0.png)


    Figure 14-1.

    CDC All Hazards Model.


    Epidemic disease has a strong patient-care focus and a close relationship to health
    care needs and is “biological,” which would include pandemics, such as bubonic
    plague, HIV/AIDS, and Ebola. Manmade disasters include both accidental and intentional
    disasters. These would include a forest fire started by a careless pam, the meltdown
    of the Fukushima or Chernobyl nuclear plants, or terrorist events, which can come
    in many ways. Terrorist events are biologically based, such as an anthrax release;
    others are conventional explosions, such as a car bomb. Nuclear terrorism may
    involve a dirty bomb that spreads radiation; chemical terrorism may involve poisonous
    gas or nerve gas. Whether natural, manmade, or terrorist, these types of disaster
    events have profound impacts on the public health system.


    Some disasters/emergencies are fundamentally emergencies; in others, health is
    just one of many facets affected. Following the 2005 hurricane season in Louisiana,
    individuals living in housing provided by FEMA faced numerous problems. In addition
    to a lack of shelter, safe drinking water, electricity, and food, individuals
    also lacked access to prescription medications and appropriate care, exacerbating
    existing and mental health issues (Abramson & Garfield, 2006).


