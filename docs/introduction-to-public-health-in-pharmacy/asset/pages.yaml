  md: '# Pharmacists’ Roles in the Increase of Health Literacy Among Patients


    Other groups include ethnic and cultural minorities; people with incomes at or
    below the poverty level; non-native speakers of English; people with physical,
    cognitive, or learning disabilities; patients with a compromised health status;
    and people with a combination of these attributes (USDHHS, 2010). Other at-risk
    groups include recent immigrants, patients with low visual acuity, and others
    who may be strangers to US health systems. These categories highlight the significance
    of the social determinants of health when attempting to increase health literacy
    in the population.


    # Prevalence


    While the aforementioned populations should not be deceived that low health literacy
    is an issue that is solely reserved to them. In the United States, the National
    Assessment of Adult Literacy (NAAL) measures health literacy of adults. Four performance
    levels are used to quantify health literacy: (a) Below Basic, (b) Basic, (c) Intermediate,
    and (d) Proficient. The last reported from NAAL showed that around 36% have limited
    health literacy (14% at Basic level plus 22% at the Basic level). Approximately
    5% were not literate in English. Some report cites that only 12% of English-speaking
    adults in the United States have proficient health literacy skills (Kutner, Greenberg,
    Jin, & Paulsen, 2006). Poor health literacy is more prevalent than many practitioners
    realize.


    # Impact on Patient Outcomes


    It is widely recognized that people make health decisions as a response to information,
    environments, resources, and social support systems. Higher levels of health literacy
    contribute to the alignment of the patients'' decisions and positive health outcomes
    (Kirkbusch, Pelikan, Apfel, & Tsouros, 2013). Conversely, low health literacy
    is associated with poorer health outcomes and higher costs is also considered
    a primary determinant of health inequalities (Heijmans et al., 2015). The following
    summarizes a few of the research findings on the association between limited health
    literacy and health outcomes.


    +   * Patients are significantly more likely to report their health as poor (Baker,
    Parker, Williams, & Clark, 1998; Baker et al., 1996; Kutner et al., 2006).

    * Patients are more likely to avoid preventive services such as mammograms, pam
    smears, and flu immunizations (Scott, Gazmarianarian, Williams, & Baker, 2002).

    * Patients tend to enter a health care system later than patients with higher
    health literacy levels (Bennett et al., 1998).

    * Patients are more likely to suffer from chronic conditions and manage them less
    effectively (Batterham, Hawkins, Collins, Buchbinder, & Osborne, 2016; Beauchamp
    et al., 2015; Wernick et al., 2016).'
