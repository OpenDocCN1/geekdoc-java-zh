    some states, open access to behavioral health medications means that all medications
    used for psychiatric indications are covered by the Medicaid program, but may
    be restricted based on clinical appropriateness and previously tried therapies.


    Step therapy is another means used to control medication use in an insurance system.
    Step requires a patient to try preferred medications for a given condition in
    the order of use required by the insurer. For example, a patient who needs an
    antidepressant medication may be required to fluoxetine first, sertraline, then
    venfaxine in that order and in adequate doses and durations before moving to a
    nonpreferred agent. A PA would be required to obtain the nonpreferred agent.


    Several studies have evaluated the impact of PAs on medication access and use
    of other medical care services. The results of this research suggests that PA
    restrictions are associated with an increased risk of incarceration, increased
    discontinuation of medications prematurely, decreased number of psychiatric visitors
    after discontinuation of medications, increased emergency department visits, and
    decreased initiation of nonpreferred medications without an offsetting increase
    in preferred drugs (Goldman, Fastenau et al., 2014; Lu et al., 2011; Soumeral,
    Ross-Degnan, Zhang, & Adams, 2010).


    # Medication Adherence


    The issue of medication adherence and its role in chronic disease management and
    reduced use of acute care medical services is well documented. It is assumed by
    most healthcare professionals that those with mental disorders are more nonherent
    to treatment, including than with other chronic disorders. The reality is that
    mental disorders lead to nonadherence similarly to chronic medical disorders,
    but often for different reasons. Several causes of nonadherence have been identified,
    including the stigma associated with having mental illness, insight of the patient
    into his or her illness, the illness symptoms, social isolation, the drug class
    and formulation, substance use, access to healthcare, employment and insurance
    status, and lack of social and/or family support (Haddad, Brain, & Scott, 2014;
    Shuler, 2014). The risks to the patient and the health system are great when a
    patient does not take medications as prescribed or at all. There is increased
    risk of relapse of symptoms and increased self-harm, greater length of stay when
    hospitalized, increased cost of care to the patient, and decreased quality of
    life (Haddad et al., 2014; Oxford, Lin, Wong, Mirski, & Baker, 2013).


    Overall, studies show that approximately 64% of patients with mental illness have
    partial adherence or nonadherence to medication therapy (Oxford et al., 2013).
    In one study of patients with depression, those had a 1.76% risk of being nonadherent
    to medications'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Behavioral Health


    chronic medical diseases if they were depressed and untreated (Grenard et al.,
    2011). A study by Markowitz, Karve, Panish, Candrill, and Alphs (2013) of the
    rates of rehospitalization for patients with schizophrenia were greatest during
    the first 60 days after hospital discharge with the greatest financial cost in
    rehospitalization and pharmacy costs.


    Many strategies have been studied and employed as interventions for medication
    nonadherence. Of these, psychoeducation, psychosocial interventions, long-acting
    antipsychotic regimens, electronic reminders, simplification of medication regimes,
    shared decision-making, and communication with the patient regarding drug therapy
    had the greatest impact (Haddad et al., 2024). Medication education did not improve
    the rate of nonadherence for most patients. In a study by Chung, Asl, and Chen
    (2011), interventions to improve adherence to antidepressants were evaluated.
    Medication support, patient centered strategies, and telephone follow-up to monitor
    progress were effective. Overall, these strategies required a multidisciplinary
    approach, which provides an opportunity for pharmacist intervention.


    Patients with mental illnesses often feel uncomfortable in the community pharmacy
    setting, and pharmacists have been shown in studies to be uncomfortable counseling
    patients with mental illness. Good communication with patients receiving psychotic
    medications is paramount to improving medication adherence. Pharmacists should
    counsel patients about the expected outcomes of their drug therapy, the most common
    (and sometimes debilitating) side effects that can be encountered, and ways to
    manage these effects.


    The use of long-acting injection (LAI) dosage forms of antipsychotics is a common
    way to ensure adherence to medications in the patient with a psychotic disorder.
    Unfortunately, most patients believe that if a LAI dose is recommended, it is
    a punishment for nonadherence to oral medications. Promoting the idea of convenience
    to this patient population is an advantageous way to make LAIs possible for these
    patients.


    Das, Malik, and Haddad (2014) performed and evaluated a survey of 11 patients
    with early psychosis and schizophrenia their attitudes regarding LAI antipsychotic
    medications. The average age of these patients was 24 years; these young patients
    in the beginning of their illness and their understanding of schizophrenia. Three
    areas were studied: (a) treatment adherence and the psychiatrist recommendation
    for LAI therapy, (b) patient knowledge and beliefs regarding LAIs, and (c) patient
    views about the appropriateness of LAI treatment.


    The researchers suggest that the recommendation of the psychiatrist has valid,
    validating the need for a strong therapeutic alliance. The knowledge and beliefs
    about LAI therapy were generally more for'
