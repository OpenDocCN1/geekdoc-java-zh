  md: '# Financing and Insurance


    public health insurance system. To understand better the financing of US health
    care, the next sections describe major government health care programs, funding,
    and how public and private payers actually pay health providers to deliver their
    services.


    # The Public Health Insurance System


    Federal, state, and local governments play three major roles in the provision
    of health care: (1) regulate the health care marketplace, (b) mandate the provision
    of services by others for the public, and (c) purchase services for the public
    good. Two examples are the U.S. Food and Drug Administration (FDA) and the National
    Institutes of Health (NIH). The FDA regulates pharmaceuticals and food due to
    safety concerns that the market did not adequately address. The NIH develops new
    medical treatments. Other types of health care services are in the public interest,
    such as disease prevention, are generally not provided in a normal market setting—hence
    the passage of regulations to mandate the purchase or provision of specific services
    or the assumption of the government to provide these services directly.


    Government health insurance includes federal programs such as Medicare, Medicaid,
    CHIP, TRICARE, health insurance marketplaces, individual state plans, Civilian
    Health and Medical Program of the Department of Veterans Affairs (VA), and are
    provided by the VA and the military.


    Health insurance marketplaces, also called "health exchanges," are organizations
    established in each state to assist individuals with the purchase of health insurance
    in accordance with the provisions of the ACA. These marketplaces are open each
    year during an annual enrollment period during which individuals can enroll in
    a plan, switch plans, or request cost assistance. The ACA requires all Americans
    to have minimum essential insurance coverage, which is found in all marketplace
    plans. Next, we examine the two largest programs, Medicare and Medicaid.


    # Medicare


    Authorized under amendments to the Social Security Act of 1965, Medicare is a
    national health insurance program for the aged (65 years or older). In addition,
    certain categories of persons with disabilities and persons with end-stage renal
    disease are eligible for Part A and Part B after receiving disability benefits
    from Social Security for 24 months. Medicare uses a social insurance model. Benefits
    and eligibility requirements are defined by statute, a defined population is served,
    the program is funded by special taxes, the program is administered centrally
    (by the federal government) with national uniform rules, and beneficiaries receive
    care regardless of their ability to pay. There are three primary funding sources
    for Medicare: (a) general revenues (41%), payroll'
