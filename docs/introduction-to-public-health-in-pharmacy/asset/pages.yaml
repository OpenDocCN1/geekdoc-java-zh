    # Medical Nutrition Therapy in Chronic Disease


    The leading causes of death in the United States in descending order are heart
    disease, cancer, chronic lung disease, accidents, cerebrovascular diseases, Alzheimer’s,
    diabetes, nephritis, and suicide. Heart disease has been consistently the leading
    cause of death for decades, with cancer the second leading cause of death. This
    section explores how pharmacists can assist in dietary interventions that assist
    in the management of these disease states.


