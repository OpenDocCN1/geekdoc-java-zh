    # ## Cost-Minimization Analysis


    The most basic of the pharmacoeconomic study designs is the cost-minimization
    analysis (CMA). The costs are measured in monetary units while the outcomes are
    assumed to be equal. CMAs are limited by this very important assumption. The primary
    application of this study design is in comparing two (or more) generic medications
    (i.e., drugs consisting of the same chemical entity and the same chemical properties
    but manufactured by different companies) at the same dose that are rated equivalent
    by the Food and Drug Administration. Another potential use of the CMA is where
    the same medication (dose) is given to the patient in different settings (e.g.,
    home versus clinic hospital); a specific example would be influenza vaccinated
    in a community pharmacy versus a physician''s office (Rascati, 2014). If the outcomes
    are equal but not in fact measured, the study would be described as a cost analysis;
    in this case, the evaluation becomes a comparison of the respective costs, which
    is not a true pharmacoeconomic analysis. Last, some may consider CMAs as a type
    of cost-effectiveness analysis, whereas clinical outcomes are measured, and one
    cannot know a priori (before) that the outcomes are equivalent.


    # ## Cost-Effectiveness Analysis


    Cost-effectiveness analyses (CEA) are the most common pharmacoeconomic studies
    due to their measurement of outcomes in natural units (such as glucose, peak flow,
    years gained, blood pressure, HbA1c, etc.). A benefit of this type of analysis
    is that it is familiar to clinicians and practitioners, as it measures outcomes
    in clinical units. A disadvantage of this method is that the outcomes must be
    measured in the same clinical units or scale, as serum cholesterol levels or mg.
    Therefore, a cost-effectiveness analysis cannot compare dissimilar outcomes. Additionally,
    only one outcome can be measured at a time, for example percentage cured versus
    cured, or symptom-free days versus symptom-free days.


    When comparing more than one alternative in a cost-effectiveness analysis, the
    incremental cost-effectiveness ratio (ICER) is used:


    ```

    ICER = Δcost ÷ Δoutcome

    ```


    In an example where two medications are being compared, Drug A costs $200 and
    has a 78% success rate while Drug B costs $360 and has an 86% success rate. In
    this case, the difference in costs is -160($200 - $360) and dividing by -8% success
    rate, the result of this ICER is $20'
