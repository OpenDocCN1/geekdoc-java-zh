    # Appropriately Written Healthcare Materials


    There is an obvious and unfortunate gap between prescription drug and medical
    literature and most patients’ reading levels. Generally, health care materials
    are written at a tenth-grade level, but most patients read at an eighth-grade
    level. Moreover, about 18% of the adult US population reads at a fifth-grade level
    (Rampey et al., 2016).


    In order to overcome the chaos that exists between patient needs and the available
    health care literature, there are several techniques that can be used by pharmacists.
    While this chapter does not cover readability formulas to assess the literature
    that pharmacists are using, those with a particular interest in health literacy
    can use these to prepare materials that are helpful for a variety of patients.
    Instead, this chapter explores easy-to-apply techniques that can be performed
    in a matter of minutes. In general, health information should be organized as
    a typical counseling session. Some of the same methods that were used to make
    a counseling session more meaningful were being employed in this area of work.


    Written materials should be easy to read. There should not be information overload,
    and written materials should emphasize the desired actions of the patient. Because
    written materials should be culturally and linguistically appropriate, they should
    engage readers with a conversational style, using common words, and they should
    use an active voice. As was suggested in the counseling session guidelines previously
    discussed, written materials should cover similar topics at one time to assist
    the patient in focusing on one issue at a time.


    Written materials should be visually pleasing to the patient, avoiding glossy
    paper or hard-to-read, fancy fonts cause particular difficulty for those with
    low visual acuity. The document should be arranged with plenty of white space.
    A large amount of dense, prose text can be disorienting for a patient who feels
    overwhelmed while reading. Use of bold lettering, bullet points, and strategic
    indentations can focus the patient’s eyes on important points. Because visual
    acuity can decrease with age, having patient literature in clear, matte, appropriate
    coloring, and spatial arrangements with nonerate fonts are particularly accommodating
    for geriatric patients.


    Written materials should use captions, pictograms, or other visuals that have
    meaning related to the subject matter rather than distracting or entertaining
    cartoons or photos. It is more important to show visuals that may clarify, motivate
    or decorate the desired outcomes. Frequently, many'
