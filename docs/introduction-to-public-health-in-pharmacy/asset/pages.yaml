    The early stages of life are a period of rapid growth and development. During
    the first four to six months of a baby''s life, his or her weight doubles; the
    period of time from the first day of pregnancy until two years of age is called
    the "first 1000 days." This period is recognized as a critical window of opportunity
    to shape long-term health. Nutrition plays a crucial role in this unique requirement.
    Nutritional needs are two to three times more than the adult requirements. Low
    birth rate infants and infants who have suffered from malnutrition require more
    calories.


