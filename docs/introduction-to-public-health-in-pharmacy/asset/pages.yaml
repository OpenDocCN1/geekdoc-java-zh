    # m-Health


    M-health uses mobile technologies as tools and platforms for research and health
    delivery (Fogarty International Center, 2016). This is a broad area that can include
    the most commonly used item as smartphones (i.e., iPhone, Android) and tablets
    (i.e., iPad, Surface) to the more advanced items used as wireless medical devices
    (i.e., blood pressure gauges, gluometers via Bluetooth, mobile medical applications
    (apps), and sensors linked to paramedics. Different platforms of social media
    (i.e., Twitter, Instagram) and short messaging services can be utilized in m-health
    and have been to achieve different outcomes. Currently there is limited literature
    related to m-health as compared to other areas of pharmacy, but the existing literature
    has positive.


    Text messaging, an early form of m-health, can be used to facilitate behavior
    change and improve health (Clauson, Elrod, Hajar, & Dzenowagis, 2013). A systematic
    review found text messaging to be effective in addressing diabetes self-management,
    weight loss, physical activity, smoking cessation, and medication adherence (Hall,
    Cole-Lewis, & Bernhard, 2015). Especially promising is its accessibility in developing
    nations as mobile phones rather than other health infrastructures reach further
    into developing countries for education and awareness, data collection and monitoring,
    communication and epidemic tracking (Vital Wave Consulting, 2009). In South Africa,
    text messaging has been used in campaigns to build awareness of HIV/AIDS, lead
    to an increase in contact with helplines and HIV self-testing for Project Masuileoke
    (PopTech, 2016). Text messaging has experienced rapid growth due to its ease of
    use and accessibility, related research is still limited and is difficult to interpret
    over heterogeneity of health conditions and patient populations.


