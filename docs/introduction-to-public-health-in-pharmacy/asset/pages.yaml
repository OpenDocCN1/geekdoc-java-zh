    and credentialing, and anti-kickback laws.


    One of the areas where informatics looks promising in pharmacy practice is the
    management of vulnerable older patients on high-risk medication or pharmacotherapeutic
    agents. Another area is identifying discrepancies in EMRs through pharmacist medication
    reconciliation. A third area is continuity of care in transitional care settings,
    as patients are shifted from one health care setting or service to another.


    However, there are also number of concerns as public health pharmacy continues
    to rely on technology. One major challenge is integrating patient care services
    into current and emerging business models. Some pharmacists may decide to base
    their practice on dispensing and sales; others may focus on services provision.
    Each of these has different implications for public health pharmacy practice.


