    # The US Public Health Structure: Federal, State, and Local


    The US public health evolved as a separate health system following World War II.
    As mentioned earlier, the medical sector focused on individual patients, with
    an emphasis on the biological mechanisms of disease and the use of technologically
    sophisticated diagnosis and treatment. The public health sector centered on populations,
    with an emphasis on the social determinants of health, prevention, and safety-net
    primary care.


    The U.S. Public Health Service is comprised of a Commissioned Corps, one of the
    seven uniformed services of the United States, who serve throughout 13 agencies
    and offices of the Department of Health and Human Services (DHHS), and 11 non-DHHS
    offices and agencies. The Commissioned Corps is overseen by the U.S Surgeon General
    and is comprised of over 6,500 public health professionals, including physicians,
    nurses, dentists, behavioral health professionals, clinical'
