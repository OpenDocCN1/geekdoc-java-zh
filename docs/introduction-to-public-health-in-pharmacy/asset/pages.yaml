    # Pharmacoeconomics


    Chapter: Pharmacoeconomics

    Author(s): Scott K Griggs and Peter Hurd


    DOI: 10.1093/med/9780190238308.003.0011


    Pharmacoeconomics and the applications of pharmacoeconomics principles are important
    components of public health today as much they were when the first edition of
    this book was published (Shaw & Delate, 2008). While a pharmacoeeconomic justification
    is often provided in dollars or saves lives, the implications for the health of
    a community can be just as important, as the United States’ response to the Zika
    virus illustrates both the costs and the politics of public health.


    Zika was categorized as a Public Health Emergency of International Concern in
    February of 2016 by the World Health Organization (WHO) as the WHO reacted to
    babies born at the start of 2016 with very small heads (microcephaly) (Chan, 2017).
    The impact of a mosquito bite for a pregnant mother was devastating, and continued
    study led to the discovery of a cluster of symptoms referred to as Congenital
    Zika Syndrome (CZS). While the virus was identified in 1947, the disease had little
    impact in the Americas until 2015 (Chan, 2017). In the United States, President
    Obama requested funding in February of 2016 to deal with the impending threat
    for the southern United States,'
