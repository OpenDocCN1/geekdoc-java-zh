    # Behavioral Health


    Chapter: Behavioral Health

    Author(s): Ardis Hanson, Carol A Ott, and Bruce Lubovsky Levin

    DOI: 10.1093/med/9780190238308.003.0008


    How is behavioral health defined? The World Health Organization (WHO, 2003, p.)
    defines mental health as more than a lack of mental disorders, it is “a state
    of well-being whereby individuals recognize their abilities, are able to cope
    with the normal stresses of life, work productively and fruitfully, and make a
    contribution to their communities.” Behavioral health, defined by the U.S. Substance
    Abuse and Mental Health Services Administration, is similar to that of the WHO,
    “a state of mental/emotional being and/or actions that affect wellness.(Substance
    Abuse and Mental Health Services Administration, 2011, p. 1).


    Both definitions focus on well-being and can be influenced by national or cultural
    expectations of what wellness comprises at a personal and at a community-level.
    This chapter defines behavioral health as the study of alcohol, drug abuse, and
    mental disorders from a population or public health perspective.


    If behavioral health is grounded in wellness, then what are behavioral disorders?
    Behavioral disorders generally include substance or'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Behavioral Health


    misuse, alcohol and drug addiction, mental disorders, and co-occurring mental
    and substance use disorders. However, defining behavioral disorders is a complex
    undertaking. Unlike earlier definitions of mental disorders as clusters of behaviors,
    the National Institute of Mental Health''s (NIMH, 2008) Strategic Plan framed
    mental illnesses as brain disorders, specifically disorders of brain circuits
    affected by genetic, neurobiological, environmental, and behavioral factors. In
    2011, behavioral disorders were named mental, neurological, and substance-use
    (MNS) disorders in the NIMH''s Grand Challenges in Global Mental Health Initiative
    (Collins et al., 2011). MNs include all conditions that affect the nervous system
    and are leading causes of disease burden, estimated on the basis of disability
    adjusted life years (DALYs).


    How behavioral disorders are defined also change across populations. In the United
    States, for adults have serious mental illnesses (SMI), while children have serious
    emotional disabilities (SED). The definitions for SMI and SED, developed in the
    1990s are still in use today. The definitions limit diagnosis of SMI or SED to
    specific age groups, the current period or within the past year, meeting Statistical
    and Diagnostic Manual of Mental Disorders (DSM) criteria, and resulting in one
    or more functional impairment(s) that substantially limits or constrains one or
    more major life activities (U.S. Department of Health and Human Services, 1997,
    1999).


    # Epidemiology


    When we talk about the burden of disease, it is critical to understand major health
    problems often drive policy, legislation, which finally drives practice. Taking
    a public health perspective is useful for determining the burden of diseases,
    injuries, and leading factors. We start with a national sampling of adults in
    the United States in 2012, SAMHSA estimated that 43.7 million adults 18 or older
    (18.6%) experienced a mental illness in the past year (Substance Abuse and Mental
    Health Services Administration, 2013).


    However, the number of people with a disease is not enough to determine the burden
    of disease or the importance of a health condition as a national or global priority.
    To do this, we examine the data on behavioral disorders and how these disorders
    affect the morbidity (years lived with disability (Ylds)) and mortality (years
    of life lost (YLLs).


    # Measuring Burden of Disease


    The first global measure of morbidity, the DALY is the sum of years potential
    loss due to premature mortality and the years of productive life lost due to disability
    (Murray & López, 1996). Whitehead and colleagues (2013) estimate mental and substance
    disorders account 183.9 million (7.4%) DALYs globally. It is estimated that 13.6%
    of DALYs in the United States are caused by behavioral disorders'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Behavioral Health


    and seven of the 20 disorders affecting morbidity are mental illnesses:

    (a) major depressive disorders, (b) drug use disorders, (c) anxiety disorders,
    (d) alcohol use disorders, (e) schizophrenia, (f) bipolar disorder, and (g) dystymia
    (U.S. Burden of Disease Collaborators. 2013).

    Breaking down into YLDs and YLLs, Whiteford and colleagues (2013)

    estimate mental and substance use disorders across the globe accounted for 175.3
    million YLDs and 8.6 million YLLs, with mental and substance use disorders as
    the leading cause of YLDs worldwide.


    # Comorbidity


    Most serious behavioral disorders are chronic, long-term conditions that frequently
    occur-often, and may exacerbate, somatic or behavioral conditions. The majority
    of individuals who have the most serious mental illnesses and co-occurring disorders
    are, on average, age 53 from treat medical conditions or lifestyle changes, such
    as poor diets, tobacco smoking, obesity, high blood pressure, load of exercise,
    and alcohol abuse (Parks, Svendsen, Singer, & Foti, 2006).


    # Diagnosing Behavioral Disorders


    In the fourth edition of the DSM, there is a significant passage that notes that
    "although this manual provides a classification of mental disorders, it must be
    admitted that no definition adequately specifies boundaries for the concept of
    "mental disorder" (American Psychiatric Association, 1994, pp. xxi-xxii). So although
    we classify symptoms into clusters of behaviors that define or frame behavioral
    disorders, there is no concrete or operational definition of "mental disorder.\
    Just as physical disorders are defined by symptom presentation, pathology, physiological
    norms, and etiology, mental disorders are defined by behavioral and emotional
    responses that are observable. Further, DSM also notes that, to be a disorder,
    the response to a particular event must not be an expected or culturally sanctioned
    response, such as grief for the death of a loved one.


    We would argue diagnosis is much more than just identifying the set of symptoms
    presented to the clinic and addressing those symptoms. Diagnosis of a disorder
    should provide a prediction of supportive services that an individual may need
    or the level(s) of care that is currently or may become necessary in the future.
    Diagnosis alone is not enough for health planning or disease management, especially
    for behavioral disorders. Diagnosis should also address the functional limitations
    faced by people with specific or co-occurring disorders that affect an individual''s
    ability to perform daily activities of living (ADLs).


    ADLs are basic self-tasks, such as feeding, toileting, selecting proper attire,
    grooming, maintaining continence, putting on clothes, bathing, walking, and being
    able to get around (mobility). In addition to ADLs, there are instrumental activities
    of daily living (IADLs), which are the complex skills needed to successfully live
    independently in the'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Behavioral Health


    community. ADLs include managing finances, driving or navigating public transit
    to work, shopping, preparing meals, using communication devices (telephone, Skype,
    etc.), performing housework and basic home maintenance, and managing medications.


    Assessing symptomatology, ADLs, and IADLs can determine what kind of medications
    and assistance an individual may need on a day-to-day basis. However, to diagnose
    and evaluate acute or functional limitations (ADLs/IADLs) requires a number of
    diagnostic tools and may change depending on a country’s use of diagnostic tools
    as well as societal/cultural constructs of behavioral health.


    # International Standards


    At a global level, the WHO provides a family of international classifications
    to assist in the diagnosis of disorders. The first is the International Statistical
    Classification of Diseases and Related Health Problems (ICD). Now in its 10th
    revision, the ICD is used by more than 110 countries, including the United States,
    for epidemiology (surveillance, vital statistics, mortality, and health) management
    (reimbursement and resource allocation decision-making), and clinical purposes.
    Translated into 43 languages, 17 member states of the WHO use the ICD-10 to report
    mortality data. The ICD-10 contains more than 14,000 codes for diseases, signs
    and symptoms, abnormal findings, and external criteria of injury or diseases.
    The basic structure of the ICD-10 code is as follows: Characters 1-3 (the category
    of disease), 4 (etiology of disease), 5 (body part affected), and 7 (placeholder
    for the code to increase specificity). Surprisingly, due to the cultural, social,
    and religious heterogeneity of the member states of the WHO, there is an overarching
    “ICD-10 rule” for diagnostic criteria of not using interference with social role
    performance as a criterion.


    The ICD has been adapted for specialties, including two adaptations for mental
    and behavioral disorders: one for Diagnostic Criteria for Research and one for
    Clinical Descriptions and Diagnostic Guidelines. The ICD-10 Classification of
    Mental and Behavioral Disorders: Diagnostic Criteria for Research (DCR-10; WHO,
    1993), referred to as the “Green Book”, has the diagnostic classification schema
    and ICD-10 coding that does not have the descriptions of the clinical concepts.
    In the Clinical Descriptions and Diagnostic Guidelines (WHO, 1992), commonly referred
    to as the “Blue Book”. Each disorder is described with its main features and other
    less specified features. The guidelines also provide the number and balance of
    symptoms that must be present before a diagnosis can be made with confidence.
    The DCR-10 follows the ICD-10 structure on social role performance with the exception
    of certain diagnoses for adults (e.g., dementia, simple schizophrenia, and dissociative
    personality disorder) and childhood disorders to the complicated relations'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Behavioral Health


    within or among families, peers, or communities. These “culture specific” disorders
    are found in Appendix 2 of the DRC-10.


    In addition to the ICD, there are two other important diagnostic tools: International
    Classification of Functioning, Disability and Health (ICF) and the International
    Classification of Health Interventions (ICHI). The ICF is a classification of
    health and health-related domains in relationship to functioning and measures
    functioning at both the individual and the population levels. Still in development,
    the ICHI is meant to provide a standard measure for the reporting and analysis
    of health interventions to allow comparison of behavioral, medical, surgical,
    and other health-related interventions across countries and populations.


    # National Standards


    The National Center for Health Statistics is the federal agency responsible for
    use the ICD-10 in the United States (Pettitt, Berlund, Blum & Wing, 1999). The
    U.S. ICD-10 has more than 68,000 codes, many of them, that are mapped to address
    measures of quality of care as well as outcomes care. The ICD-10CM includes the
    level of detail needed for morbidity classification and diagnostic specificity
    and uses code titles and language commonly used in accepted clinical practices.
    The Centers for Medicare and Medicaid Services in the United States also developed
    a new Procedure Coding (ICD-10-PCS) for inpatient procedures that harmonizes with
    the ICD-10. When the United States implemented the ICD-10 in 2016, a series of
    strategies made the implementation smoothly (Goldstein, 2015).


    In the United States, the fifth edition of the DSM (DSM-5: American Psychiatric
    Association, 2013) is the standard diagnostic tool for determining disorders.
    The DSM-V underwent a significant structural reorganization to correspond with
    the reorganized arrangement of disorders in the newest version of the ICD (the
    ICD-11). It was harmonized to the United States ICD-CM to allow easier integration
    for diagnostic and medical coding.


    Diagnostic standards are important from a public health perspective since they
    can provide important data when planning for an individual or community level
    of care and services, as well as for broader statewide or nationwide services.
    Persons with behavioral disorders often require more of supportive services, having
    knowledge of diagnoses, ADLs, and IADLs inform what services or supports are necessarye.g.,
    rehabilitation, employment, housing, transportation, medication management).


    This also informs our ability to develop behavioral, medical, pharmacological,
    and technological interventions that will allow individuals to perform the tasks
    they need to be successful in living at home, to work in the community, or engage
    socially with others outside of a residence. For example, if we know what occurs
    in a'
