    health. Health disparities among different groups is attributed to poorer overall
    health and decreased health outcomes. Culturally competent delivery of care is
    a primary contributor to reducing the more expansive concern of health disparities
    (U.S. Department of Health and Human Services [USDHHS], 2010).


    # CULTURE


    ![](img/bab568132a8b848885368f29e8af2454_140_0.png)


    Figure 6-1.

    Culture''s influence on a patient''s health beliefs and health.


    There are many facets to understanding the concept of culture and its influences.
    First, each person is a member of multiple cultures. Second, some aspects of culture
    may be visibly obvious on an individual (such as ethnicity, gender, or religion),
    while others may not be readily apparent at all (such as sexual orientation).
    Third, one less discussed aspect of culture is be tremendous within a defined
    culture. For example, the Hispanic or Latino culture is very diverse, representing
    customs, beliefs, and values from different hemispheres and many countries. Fourth,
    there are numerous cultures to which a patient could identify that may not be
    immediately recognizable as a distinct culture by a novice in or her cultural-integration
    journey, such as


    +   * Generational (to which generation does a patient belong);

    * Disability (physical, psychological, emotional);

    * Health professional (versus patient);

    * Primary spoken language (e.g., French, Creole, Arabic, Spanish);

    * Lifestyle (vegan, cross-fit) and;

    * Gender (transsexual, questioning).


    In this chapter, we define culture, including its role and influence as a social
    determinant of health, and discusses the concepts of cultural awareness and cultural
    competency, which are the foundation of a patient-centered approach to better
    health outcomes and wellness. We also discuss the current status of cultural consideration
    in health care as a public health problem and the need for culturally competent
    services delivery, along with an exploration of what is involved in the cultural
    integration journey.


    When health issues arise to affect health negatively, it becomes imperative to
    prioritize these concerns using a pragmatic framework that leads to positive action.
    Silvia Rabionaste, professor of public health at Nova Northeastern College of'
