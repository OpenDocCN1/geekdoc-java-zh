    # Cultural Competence


    Delivering efficient and effective health care and public health

    services require an understanding of the differences among various

    cultures to which a patient identifies. There are five steps involved in the

    journey toward cultural integration (Bleid, 1992). Starting with

    ethnocentricity and moving along to ethnic diversity, a practitioner may

    him or herself working from cultural insensitivity to awareness,

    sensitivity, competency, and fully cultural integration.


    An individual practitioner can be at many points along this continuum

    dending on which culture(s) he or she is encountering at the time.

    There is no setting point either, as proper attitudes and learned

    techniques and practices advance the clinician along the continuum with

    new cultural engagement. Although the continuum applies to both

    individuals and organizations, the primary purpose of this chapter is to

    discuss individual journeys.


    With each new experience, a person evolves toward cultural

    awareness, sensitivity, and integration. Cultural sensitivity is defined as

    not being aware or having knowledge of cultural differences or their

    im/or lacking the desire to learn about various cultures. Cultural

    awareness is the stage that involves self-examination of one’s own

    cultural background, what makes it unique, and what bearing thesendiscoveries
    may have. In cultural sensitivity, public health professionals

    h an awareness and begin to develop a deeper cultural knowledge

    out others who have not assimilated this knowledge into practice

    successfully. In the last step, cultural integration, cultural knowledge is

    placed into practice in order to communicate and serve the patient

    more effectively.


    A competent practitioner possesses the knowledge, skills,

    itudes, and abilities to provide optimal health care services to patients

    from a wide range of cultural and ethnic backgrounds. In a culturally

    ent organization, clinicians can move through the steps fairly

    rapidly and the patient feels comfortable as this learning process occurs.


    In the absence of cultural competency, miscommunication between

    clinian and patient can occur leading to medical misadventures,

    disdiagnosing, and failure to consider differing responses to medications.

    Skills in seeking, interpreting, and understanding relevant person-specific

    nuances are valuable to serving patients or those who seek services.

    Resources, especially time, must be given to those who serve so

    they obtain these needed abilities.'
