    Health promotion and disease prevention programs have a long history of successes,
    but those individuals working in public health have also learned from programs
    that have been less than successful. Changing human behavior is challenging. It
    usually requires a longitudinal effort, a variety of approaches, individual support,
    and population (or social group) acceptance. As challenging as this may be, the
    potential to have a life-long impact on the health of entire communities, populations,
    and even international regions is a compelling reason for an increased public
    health commitment by those in pharmacy. The alignment of individual responsibility,
    population norms, and international health offers great opportunities for the
    participation of pharmacists in public health pharmacy.


