    # Global Health and Health Equity


    Global health has two main elements: (a) a focus on health from a worldwide perspective
    (as contrasted with multinational, national, or local) and (b) an overarching
    goal of health equity. The global disease burden and individual country disease
    can provide one perspective for global health; that is, what are the disease-specific
    problems that face that country and how do they differ from country to country?
    From a worldwide perspective, the leading causes of death are cardiovascular and
    cancer. Many vary from country to'
