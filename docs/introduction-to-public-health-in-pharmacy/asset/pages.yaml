  md: '# Framing Public Health and Pharmacy


    ![](img/bab568132a8b848885368f29e8af2454_36_0.png)


    # Introduction to Public Health in Pharmacy (2 ed.)


    Edited by Bruce Lubotsky Levin, Ardis Hanson, and Peter D. Hurd


    Publisher: Oxford University Press Print Publication Date: Feb 2018

    ISBN-13: 9780190238308 Print online: Mar 2018

    DOI: 10.1093/med/

    9780190238308.001.001


    # Framing Public Health and Pharmacy


    Chapter: Framing Public Health and Pharmacy

    Author(s): Ardis Hanson, Bruce Lubotsky Levin, and Peter D. Hurd

    DOI: 10.1093/med/9780190238308.003.002


    Charles-Edward Amory Winslow (1920), a pioneer in public health practice in America,
    save public health as

    the science and the art of preventing disease . . . and the development of the
    social machinery which will ensure to every individual in the community a standard
    of living adequate for the maintenance of health; organizing benefits in such
    fashion to enable every citizen to realize his birthright of health and longevity.
    (pp. 6-7)


    The World Health Organization (WHO): 1948, p. 100 defines health as “a state of
    complete physical, mental, and social well-being and not merely an absence of
    disease or infirmity.” These definitions of health are mirrored by many nations
    today.


    Historically, health is multidisciplinary in its approach to patient-care and
    services delivery. Its focus is the patient, singular, with a current emphasis
    on evidence-based practice that leads to the best patient'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Framing Public Health and Pharmacy


    outcomes. It draws upon a wide variety of health professionals in daily practice,
    across allopathic and osteopathic medicine, including physicians, nurses, dentists,
    and other health services professionals, such as physical therapists, occupational
    therapists, health hygienists, pharmacists, physician assistants, nurse practitioners,
    social workers, psychologists, nutritionists, rehabilitation counselors, health
    educators, administrators, and health managers.


    The field of public health utilizes a multidisciplinary approach in examination
    of health problems in at-risk populations. However, unlike health, public health
    has a population-based focus. It draws heavily from the areas of biostatistics
    and epidemiology, environmental and occupational health, public health management,
    and community and family health, global health, and, increasingly, public health
    genomics. Its professionals include nurses, physicians, epidemiologists, statisticians,
    health educators, environmental analysts, industrial hygienists, sanitarians,
    food and drug investigators, toxicologists, laboratory technicians, environmental
    scientists, crisis and disaster management workers, veterinarians, economists,
    social scientists, attorneys, nutritionists, behavioral health professionals,
    administrators, and managers. At times, many of these professionals are referred
    to as public health professionals.


    Although pharmacy is considered the branch of the health/medical sciences that
    deals with the preparation, dispensing, and proper utilization of drugs, pharmacy
    as the bridge between disciplines of medicine and public health, particularly
    within the area of community pharmacy. Within community pharmacy, the individual
    patient and the community in which the patient resides are equally important in
    the practice of community or public health.


    # International, Regional, and National Perspectives


    This second edition of Introduction to Public Health in Pharmacy is different
    from the original edition since we are incorporating a number of global perspectives
    of public health and pharmacy, including international perspectives (e.g., WHO,
    macro-level), regional perspectives (e.g., the European Union, meso-level), and
    perspectives mostly from the United States (e.g., country, micro-level). We feel
    this will help to provide readers of this second edition with a more comprehensive
    understanding of how issues in public health and pharmacy are framed and reframed
    as we move from a national understanding of public health and pharmacy to broader
    global perspectives. We hope this additional global perspective will also help
    to demonstrate that, wherever one may reside, there are commonalities as well
    as significant differences in the practice, education, and research in the disciplines
    and careers of public health and pharmacy.'
