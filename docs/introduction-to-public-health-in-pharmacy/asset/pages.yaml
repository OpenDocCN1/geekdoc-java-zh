    We have stressed concepts and issues in public health that pharmacy students and
    pharmacists need to establish a working knowledge base in public health. First,
    we framed services and systems in the United States and globally. Then we examined
    traditional and emerging public health areas for pharmacy students and practitioners
    who are interested in a larger population health/community services perspective.


    For practitioners who want to work at the population health level, disease prevention
    and health promotion activities have expanded tobacco cessation programs to include
