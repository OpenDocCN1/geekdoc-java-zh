    of the hypermetabolic states caused by cancer. High-protein, high-calorie diets
    are typically recommended. Anorexia is a major problem and difficult to manage,
    as many patients with cancer tend to develop strong aversions to food. Chemotherapy
    can also lead to malnutrition due to nausea and the interruption of the absorption
