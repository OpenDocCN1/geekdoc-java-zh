    # Economic Impact


    Besides the aforementioned low health literacy’s consequences on the patient,
    there are also major economic impacts on society (Rusa, Bawa, Suminski, Snell,
    & Warady, 2015). One report, *Low Health Literacy: Implications for National Health
    Policy*, approximated low health literacy’s annual costs to the US to be between
    $106 billion and $238 billion. These 2007 figures equated between 7% and 17% of
    the total amount of personal health care spending (Vernon, Rosenbaum, & DeBueno,
    2007). Most recent data place the societal economic costs in the United States
    at more than $360 billion per year (World Literacy Foundation, 2015).


    Lack of medication compliance and adherence add to these costs and compound the
    problem. Nearly 30% of patients fail to fill prescriptions, and new prescriptions
    for chronic conditions are not filled between 20% and 34% of the time (Pharmaceutical
    Research and Manufacturers of America [PhRMA, 2011). In addition, chronically
    ill patients who regularly fill their prescriptions may actually take half of
    the doses incurred (PhRMA, 2011).


    # Characteristics of Poor Readers


    Pharmacists should be proactive about the common characteristics of a poor reader.
    One pharmaceutical manufacturer, Pfizer, Inc., concerned with the issue of low
    health literacy, has funded research and helpful interventions targeting low health
    literacy as a number of government agencies, such as the Centers for Disease Control
    and Prevention and the Agency for Healthcare Quality and Research. Attributes
    to patients who are poor readers or have trouble understanding what is presented
    fall within three distinct areas: language knowledge and processing ability, cognitive
    ability, and metacognitive strategic competence. Box 7-1 lists a number of characteristics
    of poor readers, which can help practitioners know when an intervention is necessary
    to address the particular needs of patients.'
