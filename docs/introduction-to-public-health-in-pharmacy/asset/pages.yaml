    # Measuring Health Behaviors


    In the United States, the federal *Healthy People* initiative began as a 10-year
    strategy to improve the health of the nation, with an emphasis on the prevention
    of chronic illnesses, injuries, and infectious diseases. *Healthy People 2000:
    Final Review* tracked the 10-year progress between 1990 and 2000 on a variety
    of national objectives, including a number of health behaviors (National Center
    for Health Statistics, 2001). The report substantiated prevention efforts in the
    United States toward the goal of reducing health disparities for more than half
    the objectives identified in *Healthy People 2000* (U.S. Department of Health
    and Human Services (USDHHS)). The monitoring and assessment goals of *Healthy
    People 2010 (USDHHS)* were even more ambitious than the 2000 goals. For example,
    the 2000 goal to reduce health disparities was strengthened in 2010 to focus on
    eliminating health disparities. *Healthy People 2020* continues this trend, including
    many topics appropriate for pharmacy: addressing adverse drug events, improving
    communications to empower patients, building health skills, counseling from prescribers
    and pharmacists, and reducing disparities (USDHHS, 2010). Some of the new areas
    in *Healthy People 2020* include social determinants of health, and health-associated
    infections Alzheimer''s disease, and health


    Tracking *Healthy People 2020* will assist local, state, and national programs
    in the production and use of health data to meet the goals of 2020. A set of 26
    leading health indicators (LHIs) were identified based upon their importance as
    public health issues and the availability of data to measure progress (10 LHIs
    in 2010). Using two conceptual frameworks, Health Determinants and Health Outcomes
    by Life Stages, the LHIs examine the relationships between biological, social,
    economic, and environmental factors that affect individuals'' abilities to achieve
    these indicators using a life stages perspective. The LHIs–such as physical activity,
    tobacco use, substance abuse, and infant deaths–are monitored and reduced over
    time (USDHHS, 2014).


    The European region of the WHO created a similar initiative, *Health 2020*, as
    a policy for health and well-being for the European region (WHO Regional Office
    for Europe, 2013). Adopted in 2012 by 53 member states of the region, *Health
    2020* provides a vision, strategic goal, priorities, and actions that can adapt
    to the many cultures of the European region (Jakab & Touriros, 2015), like *Healthy
    People*, Health 2020* also provides an implementation package for policymakers,
    health ministries, and associated agencies and sectors. For example, a questionnaire
    asks if a country''s policy documents address how the state will reduce the burden
    of disease and risk factors, enhance health and well-being, improve governance
    and systems for health (WHO


