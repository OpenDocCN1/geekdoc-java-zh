  md: '# Pharmacists’ Roles in the Increase of Health Literacy Among Patients


    # Implications for Public Health and Pharmacy Practice


    Until recently, health literacy was defined and measured as an individual aptitude.
    Currently, health literacy is a multifaceted concept incorporating basic functional
    literacy, prose literacy, communicative/interactive literacy, and problem-solving
    literacy. In other words, other characteristics such as the capacity, readiness,
    and preparedness to manage one’s health actively are also generated (Sønsen et
    al., 2012). In the past, low health literacy was perceived as an individual patient''s
    deficit; that is, a patient had a lack of skills to be able to process health
    information leading to a lack of knowledge regarding health issues. Now, health
    literacy is recognized as a health care system issue. It reflects both the presentation
    of health information and navigation of health care systems. Current research
    is paying more attention to a patient’s social support system (e.g., parent, family,
    community and workplace) to support health care systems’ role in remedying low
    literacy problems.


    Poor literacy is more common than many practitioners realize. Therefore, for pharmacists,
    the approach to practice should be to ensure all patients receive the individualized
    tools to manage their health positively. There are also negative effects of low
    literacy, with one study reporting patients a sense of shame about their limited
    literacy skills (Parikh, Parker, Nurs, Baker & Williams, 1996). In order to maintain
    their dignity, may hide their reading or vocal difficulties (Baker et al., 1996).


    In general, communication among people is a complex process. It involves many
    factors that impact the transmission and/or receipt of the message. These influences
    are called barriers. Examples include proximies, kinetics, culture, generation,
    paralanguage, environmental, and distracting factors among others. As part of
    everyday life, communication happens simultaneously at all parallel levels.


    When suddenly, out of nowhere, a person is stricken with a health problem that
    forces him or her to exit the wellness role and adopt the sick role, the transition
    of roles is very difficult, at best. If helping (getting better) is to follow,
    then this change must occur; thus the patient enters into a dissimilar domain
    from everyday life. Add to this complex situation enters the following inputs
    (interferences):


    +   - New places must be found in a complicated facility with strange-sounding
    names;

    - Unfamiliar documents, with many lines, asking a voluminous number of questions
    must be completed;

    - A new partnership must be established with one or more health professionals,
    some of whom may be unfamiliar:'
