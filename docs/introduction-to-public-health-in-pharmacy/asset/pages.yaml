    # Foreword: A Pharmacy Perspective


    **Author(s):** Robert L. McCarthy


    In writing for the first edition of *Introduction to Public Health in Pharmacy*,
    I noted that the public health community faces daunting challenges in the 21st
    century much like it did century ago. All health care professionals, including
    pharmacists, have essential roles to play in ensuring the public at-large is educated
    and protected against the myriad of threats ranging from environmental concerns
    to resistant microorganisms. Given these potential hazards, I noted that it is
    more important now than any other time in our recent past for pharmacists to be
    grounded in the principles of public health, enabling them to bear their significant
    expertise in medication therapy management to the care of populations, especially
    those at risk.


    The first edition of *Introduction to Public Health in Pharmacy* provided a primer
    for pharmacy students and practising pharmacists in the principles of public health.
    The book''s publication received wide acclaim as the first text that uniquely
    addressed public health issues from the perspective of pharmacy and pharmacists.


    Building upon the strengths of the first edition, *Introduction to Public Health
    in Pharmacy* (second edition) provides a greater global perspective by providing
    additional international examples, including'
  merge: -1
  pgno: 6
- img_proc: true
  md: '# Foreword: A Pharmacy Perspective


    health challenges and diseases. The references have been updated in order to share
    the most current thinking and public health approaches; additional examples have
    also been included. The content of the book has been revised to reflect instructor
    experiences using the text in the classroom.


    This new edition also has been restructured to allow easier access to subjects
    of interest. American and global public health and pharmacy are presented in distinct
    chapters, enabling readers to compare public health in the United States and throughout
    the world. New chapters in nutrition and health literacy have been added. The
    chapter focused on financing public health services has been reworked into a discussion
    on federal programs, financing, and insurance. The text concludes with a chapter
    focused on education and leadership.


    Finally, this new edition adds to the useful, practical public health information
    found in the first edition of Introduction to Public Health in Pharmacy. For the
    pharmacy student, it provides an introduction to the public health field and the
    important contributions pharmacists can make to population-based health care.
    For the practicing pharmacist, it offers both a refresher and a litany of possibilities.
    All readers should come away with an enhanced understanding of public health and
    a deep appreciation of the essential role both pharmacy and public health plays
    in helping to ensure the health of society.'
