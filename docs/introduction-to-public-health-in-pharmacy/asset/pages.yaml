    # Social Marketing


    Social marketing, often used to increase the effectiveness of disease prevention
    and health promotion interventions, is defined as the "application of commercial
    marketing technologies to the analysis, planning, execution, and evaluation of
    programs to influence the voluntary behavior of target audiences in order to improve
    their personal welfare and of their society" (Andreas, 1995, p. 7). Social marketing
    uses audience research to segment the target audience with common risk behaviors,
    similar motivations, and channel preferences. Intervention strategies are developed
    using the "Four Ps": (a) product (what the consumer is asked to "buy into"), (b)
    price (what the consumer must give up in order to obtain the product), (c) place
    (how and where the product reaches the consumer), and (d) promotion (how information
    about the product is disseminated). The "marketing mix" of message and media is
    continually refined based on consumer feedback.


    Using the social marketing model, the Centers for Disease Control and Prevention
    (CDC) developed "prevention marketing" that involves community representatives
    and stakeholders in the entire process, using principles from behavioral science,
    marketing, and community intervention (Kennedy & Crosby, 2002). Originally developed
    to address HIV transmission among youth (Odeh, Shepard, & Smith, 1996), this model
    has applications in numerous settings. Tan et al. (2010) used a'
