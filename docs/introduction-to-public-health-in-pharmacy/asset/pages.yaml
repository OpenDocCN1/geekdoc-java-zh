    # Case Control Studies


    Case control studies are observational studies that compare individuals with a
    disease (cases) to other individuals who do not have the disease (control subjects)
    from the same population. Also known as "retrospective studies," case control
    studies are designed to estimate the odds of contracting the disease and retrospectively
    determine if there is a relationship to exposure to a specific risk factor in
    each group. Case control studies are good studies to examine rare conditions or
    diseases, since control subjects represent the expected exposure prevalence and
    case incidence. They are also useful as initial studies to establish associations
    as a base for more rigorous studies. However, bias can influence data quality
    due to the reliance on memory and recall. They are more prone to confounding when
    both exposure and outcome are strongly related to a third variable.


    A simple example is oral cancer. The factor under examination is smokeless tobacco
    (e.g., chewing tobacco, snuff, snus, gutka, and topical tobacco). Depending on
    the type of smokeless tobacco he she uses, a person may be at low, medium, or
    high risk for oral cancer. Consider the following example. The estimated burden
    of diseases for smokeless tobacco use is 1.7 million DALYs lost in 113 countries
    and 62,283 deaths due to causes of mouth, pharynx, and esophagus (Siddiki et al.,
    2015). Over 85% of this burden is in Southeast Asia, where over 250 million people
    in South and Southeast Asia use smokeless tobacco.


    However, building epidemiological evidence regarding some of harmful effects is
    difficult. Recent meta-analyses have shown relationships between smokeless tobacco,
    chronic oral lesions, and oral cancer (Khan et al., 2016) and a manifold increased
    risk of esophageal squamous-cell carcinoma among persons who chewed are nut and
    smokeless tobacco (Akhtar, 2013). However, there is the need for more powerful
    studies that quantify dose-response relationships (Gupta & Johnson, 2014).


    Pharmacoepidemiologists use case-control studies as marketing surveillance. Yang
    and colleagues (2014) report on the vaccine'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Epidemiology


    effectiveness in Guangzhou, southern China from 1951 to 2012. Using test-negative
    cases as controls, they determined a significant overall decline in the incidence
    of measles in the measles-vaccinated population of children between 8 months to
    14 years of age. They found that two doses of measles vaccine were more effective
    than one dose in preventing measles and recommended giving the vaccine to transient
    and non-vaccine targeted populations (Yang et al., 2014).


    # Cohort Studies


    Cohort studies compare health outcomes between different groups of people stratified
    by exposure status (i.e, the presence or absence of a particular exposure). Since
    participants in cohort studies are allocated to comparison groups based upon whether
    they meet requirements, cohort studies permit researchers to observe and evaluate
    possibly harmful exposures in a natural setting. Cohort studies may be prospective
    or retrospective.


    In prospective studies, both exposed and unexposed participants are followed over
    time to determine the initial occurrence of the health outcome(s) study. By determining
    the temporal relationship between exposure and outcome, cohort studies allow direct
    measurement and comparison of incidence between the exposure groups (using the
    risk ratio). Prospective studies are good to examine new, exposures. Several notable
    cohort studies are the Framingham Heart Study, which defined cardiovascular disease
    risk factors and prevention guidelines over the past five decades (Tsao & Vasan,
    2015), and the Medication Use Patterns, Treatment Satisfaction, and Inadequate
    Control of Osteoporosis Study that examined gastrointestinal symptoms and association
    with medication for Europe and Canada (Modi et al., 2016). A twist on the cohort
    study, the Monitoring Medicines project, a European Union study, used cohort monitoring
    to support and strengthen pharmacovigilance regarding a larger public health perspective
    (Pal, Olsson, & Brown, 2015).


    In the retrospective cohort study, both the exposure and health outcome(s) interest
    have already occurred. Investigators go back to a point in time after outcomes
    have already occurred and try to establish the exposure status. Retrospective
    studies are good for studies that examine long latency events (events that occur
    many times over the natural or manmade.) or for studies examining rare or unusual
    exposures that may be. Pharmacepidemiologists often use cohort studies for postmarketing
    surveillance and phase IV studies to assess the safety and efficacy of an approved
    compound or medical device and in specific disease management.


    # Cross-Section Studies


    Cross-sectional studies, also known as prevalence surveys, simultaneously assess
    exposure and health outcomes of interest and are used in'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Epidemiology


    national studies, such as the studies conducted by the CDC’s National Center for
    Health Statistics. Many cross-sectional studies are a blend of descriptive and
    analytical analyses.


    Descriptive cross-sectional studies assess the frequency and distribution of a
    particular disease in a defined population. In their cross-sectional study of
    220 Kuwait communities, Awad and Waheedi (2012) examined the frequency of counseling,
    comfort level, and perceived effectiveness of obesity management services offered
    by local pharmacists. Although a majority of pharmacists counseled patients on
    ways to lose weight, the pharmacists felt that patients not lacked awareness about
    pharmacists'' expertise in counseling, but obese patients lacked willpower and
    are nonherent to weight reduction intervention (Awad & Waheedi, 2012):


    Analytical cross-sectional studies often attempt to investigate the association
    between a putative risk factor and a health outcome. Schistosomiasis, a chronic
    disease caused by blood fluke, was reported to be in Shan State, Myanmar; however,
    there had neither been serological studies to detect it or any factors among the
    residents (So, Oo, Maung, 2017). Significant factors for seropositivity were male,
    geographical location within four rural health center areas, and educational levels.
    In addition, ELISA test showed satisfactory sensitivity and specificity levels
    for use. The authors recommend that Myanmar place schistosomiasis infection in
    its list of Diseases under National Surveillance and monitor prevalence testing
    (So et al., 2017).


    There are benefits and challenges to using cross-sectional studies. Cross-sectional
    studies are good for developing descriptive analyses and generating hypotheses.
    They are relatively quick and easy to conduct since researchers collect data on
    all variables one time, allowing them to study multiple outcomes and exposures.
    Hence, cross-sectional studies can describe magnitude and distribution of an event
    or outcome under. However, cross-sectional studies are prone to bias. Since they
    simultaneously assess exposure and outcome, antecedent-consequence bias asks the
    question if the exposure preceded the outcome or was a consequence. Survival bias
    must be careful not to associate duration of disease with exposure status.


    # Randomized Controlled Trial


    The randomized control trial (RCT) is the apex of the evidence pyramid for clinical
    decision-making research studies (Parfrey & Ravani, 2015). The random assignment
    of subjects to a particular exposure group, an experimental group (new intervention
    or drug) versus comparison or control (standard practice intervention or placebo),
    ensures that the respective groups will be similar based on the distribution of
    all of their other characteristics. Researchers or clinicians compare the'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Epidemiology


    subsequent health experiences of the exposure groups using risk or rate ratios
    to determine the effectiveness of the intervention.


    However, there are a number of challenges in conducting an RCT. The researcher
    must define clearly the RCT protocol (hypothesis, patients, interventions, outcomes,
    measures, and methods) that comprise the study to satisfy the rigorous review
    by the institutional review board to ensure compliance with federal regulations
    for human subject research. RCT protocols must include an hypothesis of an anticipated
    association between one or more predictor and outcome variables contrasted with
    a null hypothesis of no association and subjected to statistical evaluation at
    a predetermined significance level. Predictor and outcome variables are carefully
    selected for their theoretical association and defined prior to the study. In
    addition to choosing an appropriate (representative) sample of the population
    from which to recruit, there may be delays and challenges in recruiting enough
    participants to randomize into two or more comparison groups. Randomized, double-blinded
    studies ensure that the investigator(s) do not know which group is receiving what
    intervention until the data is collected unless there are side effects in participants.
    Participants must provide informed consent and data collection, and researchers
    must adhere to strict quality control measures that ensure patient privacy and
    confidentiality. Each step has consequences for the internal validity of the trial;
    however, a well-designed, methodologically sound RCT provides evidence of a cause-effect
    relation if one exists.


    The Consolidated Standards for Reporting Trials (CONSORT) are recommendations
    for improving the quality of reports of RCTs (Moher et al., 2012). Not only do
    these types of reporting guidelines provide researchers with minimum criteria
    for reporting, these guidelines increase the transparency and quality of biomedical
    publications (Hutton, Wolfe, Moher, & Shamster, 2017). In pharmacological studies,
    for many RCTs assess the efficacy of different interventions and therapies under
    ideal or close to ideal conditions, real-world studies that measure effectiveness.
    Hence, pharmacists need to review and thoroughly subject RCTs that employ off-label
    use of prescription medications or to patients not included in the original RCTs
    (Kip & Quillen, 2008). Appropriate use of CONSORT guidelines for articles in medical
    journals will assist pharmacists in their review of the literature on the efficacy
    of drugs or medical devices (Milis et al., 2004).


    # Screening


    Screening is a common health practice that has its roots in epidemiology and pharmacy
    health. Services are readily available in many pharmacies or without a prescription,
    such as colorectal cancer screenings, diabetic testing tests, and pregnancy tests.
    Understanding the basic principles of screening can assist pharmacists in'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Epidemiology


    their interactions with patients regarding use of or results of screening test.
    Screening is the "examination of asymptomatic people in order to classify them
    as likely or unlikely to have the disease that is the object of screening" (Harrison,
    1985, p. 3). Based upon the definition, screening focuses on persons who are subclinical
    (i., they may have a particular disease but are unaware of the disease). Hence,
    screening helps identify those who may need additional diagnostic workup for serious
    diseases, individuals who are treated more effectively before symptoms occur,
    or when the prevalence of disease in the subclinical stage is highly likely.


    One example is phenylketonuria (PKU). Hospitals now routinely conduct PKU screening
    after the birth of a child to determine if the infant is able to convert phenylalanine
    to tyrosine, amino acids needed for normal growth and development (Paul & Bosco,
    2003). Without such conversion infants suffer seizures, brain damage, and intellectual
    disability. Female children diagnosed with PKU require lifelong follow-up to prevent
    maternal PKU, and both male and female children with PKU often experience behavioral
    problems, psychiatric distress, and executive impairment during their lifecycle
    (Burton et al., 2013; de Baulny, Aubrey, Feillet, & Parscau, 2007; Jahia et al.,
    2013). In this case, although PKU is relatively rare, the long-term consequences
    and costs are significant for the individual throughout his her lifetime.


    Screening tests are reliable and valid. Reliable screenings give consistent results
    repeated across multiple settings and multiple administrations to individuals.
    Valid screenings indicate which individuals have the disease and do not have high
    sensitivity and specificity. *Sensitivity* is the test''s ability to designate
    a subject correctly with the disease as positive. *Specificity* is the test''s
    ability to designate a subject correctly without the disease as negative. The
    more sensitive the test, the fewer false positive results displayed; the more
    specific the test, the fewer false negative results. A false positive indicates
    a subject without the disease has the disease based on the screening test. A false
    negative indicates a subject with the disease does not the disease based on the
    screening test.


    The ideal case is to have a test that is both highly sensitive and highly specific.
    A 2 × 2 table, also known as a contingency table, is a useful tool to compare
    the performance of a screening test to the gold standard (diagnostic) test since
    it categorizes all test results as positive or negative and test characteristics
    by sensitivity and specificity (Table 4-3).


    | Gold Standard + (present) | Disease | (absent) |

    |---|---|---||

    | Test | | |'
