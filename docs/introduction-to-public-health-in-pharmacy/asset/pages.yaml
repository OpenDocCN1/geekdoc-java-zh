    may not.


    # Cost-Utility Analysis


    Cost-utility Analysis (CUA), sometimes considered a subtype of CEA, commonly measures
    outcomes in quality-adjusted life-years (QALYs). A utility may be thought of as
    a preference or value for a health state, measured between 0.0 and 1.0, where
    zero represents death and 1.0 represents perfect. To calculate the QALYs, the
    utility measure is multiplied by the years of life saved. If, for example, the
    utility score is 0.75 and the years of life saved is 4, the resulting QALYs would
    be 3.0 (0.75 × 4 years = 3.0 QALYs). Similar to the aforementioned CEA, the CUA
    compares two alternatives via the incremental cost-utility ratio (ICUR), where
    the outcome is the QALY. This ICUR is a simple ∆ ÷ QALYs (Griggs, 2017).


    # Cost-Benefit Analysis


    The fourth type of pharmacoeconomic analysis is the cost-benefit analysis (CBA),
    which measures both costs and outcomes in dollars (monetary unit). By converting
    outcomes into dollars, comparisons can now be compared to alternatives that are
    very different. A vaccination program could be compared to an HIV awareness program
    or a diabetes initiative with cancer screening. Multiple interventions (more than
    two) can be compared at the same time, with the one yields the highest benefit
    to cost ratio being preferred. A drawback of the CBA is it can be difficult and
    controversial to place an economic value on medical outcomes such as human life,
    pain, suffering, satisfaction, anxiety, fatigue, and quality of life. CBAs tend
    to favor those who are employed (children, elderly, or the unemployed) and those
    who are wealthier (as they have a greater ability to pay when valuing healthcare
    options).


    # Steps in Conducting a Pharmacoeconomic Evaluation


    When evaluating pharmacoeconomic literature, there is not just one, specific methodology.
    There are various criteria depending on the type of question being considered.
    Nevertheless, a pharmacoeconomic evaluation contains a number of essential elements—five
    are listed here.


    The first step is to determine if there is one or more clearly defined research
    questions or towards objective. This purpose or objective statement is usually
    found towards the beginning of the article. An example of an objective statement
    might be: “The purpose of this study is to evaluate the cost-effectiveness of
    metformin versus metforminbar versus life modification in 2 diabetes mellitus.”
