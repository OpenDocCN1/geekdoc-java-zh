  md: '# Framing Public Health and Pharmacy


    # Global Perspectives


    At the international level, the WHO is perhaps the best-known organization that
    collects, analyzes, and disseminates reports in the areas of public health research,
    education, and practice. As the directing and coordinating authority for health
    within the United Nations, the WHO is comprised of 193 countries and two associate
    members. It meets annually at the World Health Assembly to set policy and to approve
    the annual operating budget. A 34-member Executive Board, elected by the Assembly,
    provides support to membership. With headquarters in Geneva, WHO operates six
    regional offices and more than 150 offices throughout the world. The WHO and its
    “states” play a key role in global health, with a wide variety of stakeholders,
    including United Nations agencies, donors, nongovernmental organizations (NGOs),
    WHO collaborating centers, and the public and private sectors.


    The six core functions of WHO are (a) providing technical support and building
    capacity, (b) providing leadership, (c) setting norms and (d) shaping the research
    area, (e) articulating policy options, and (f) monitoring health and health trends
    (Taskforce on the Roles and Functions of the Three Levels of WHO, 2013). Each
    of these functions has obligations at the level of the country offices, the regional
    offices, and the WHO headquarters. The WHO works with its member states to set
    priorities for global public health within a number of categories: (a) communicable
    and noncommunicable diseases; (b) promoting health through the life course; (c)
    health systems; and (d) preparedness, surveillance, and response.


    The WHO creates and maintains a number of authoritative sources


    The WHO has also been a leader in the prevention, control, and eradication of
    diseases, ranging from yaws, smallpox, and acute respiratory syndrome (SARS).
    It has expanded its prevention efforts regarding tobacco, nutrition, obesity,
    and disasters (WHO, 2007). The WHO Framework on Tobacco Control to reduce tobacco-related
    deaths. The Global Strategy on Diet, Physical Activity, and Health intends to
    increase nutrition and reduce obesity. The WHO also has increased its impact on
    the consequences to health from natural'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Framing Public Health and Pharmacy


    and manmade disasters (e.g., South Asia tsunami and conflicts in Africa and the
    Middle East; WHO, 2007).


    The WHO has also rethought the scope of the public''s health from a global perspective,
    concluding a broader-based approach that encompasses environmental and biopsocial
    factors. In 2005, WHO Director-General Lee Jong-Wook established a commission
    to address social factors leading to ill health and health inequities (Commission
    on Social Determinants of Health, 2007). The Social Determinants of Health Inequities
    (SDHI) conceptual framework, shown in Figure 2-1, encompasses three areas: (a)
    a socioeconomic and political context, (b) structural determinants of health inequities,
    and (c) intermediate determinants of health. Although many researchers have contributed
    to the SDHI, a special acknowledgment is given to the work by Finn Didererich-Didererich,
    1998; Marmot & Whitehead, 2001; Didererich&Didererich & Hallqvist, 1999).


    ![](img/bab568132a8b848885368f29e8af2454_39_0.png)


    Figure 2-1.

    Social Determinants of Health Inequities (Solar & Irwin, 2000).


    The 2011 WHO Conference on Social Determinants of Health (Rio de Janeiro, Brazil)
    provided a global platform for dialogue among member states regarding the recommendations
    of the Commission on Social Determinants of Health (2008). After the culmination
    of a series of meetings, with the member states and then with consultations attended
    by representatives of Permanent Missions, the Assembly (on October 21, 2011) adopted
    the Rio Policy Declaration on Social Determinants of Health, with final endorsement
    on 26 June 2012.


    The Rio Declaration was a global commitment to implement the social determinants
    of health (SDH) approach to reduce health inequities and to achieve WHO global
    priorities. The intent of the SDH approach is to inspire countries to develop
    dedicated national action and strategies with an emphasis on monitoring progress
    and increasing accountability.


    We see the SDH model reflected at all levels of government, across NGOs, and in
    public-private collaborations. The fact that WHO formally resolved and ratified
    the SDH model to reduce health inequities is significant. Using a common framework,
    language, and definitions, countries recognize and measure health by establishing
    viable outcomes for underserved populations, improving accountability,


