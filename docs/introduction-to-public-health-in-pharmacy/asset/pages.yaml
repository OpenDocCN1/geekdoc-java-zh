    # Introduction


    Around the world, tuberculosis (TB) continues to be a significant

    cause of death despite the fact that the disease is preventable and often

    curable if tractable. The history of TB goes back to the ancient Greeks,

    with Aristotle and Galen both writing of the contagious nature of phthisis

    (Shortstein Lecture, 1922). In 1882, Robert Koch found the tubercle

    bacillus that causes this infectious disease, an achievement that won him

    t Nobel Prize in Medicine (Tuberculosis Control Division, 1982). Tests

    det detect TB developed in the late 1800s and 1900s. Particularly of note

    the development of the acid-fast staining test in 1892, X-rays in1895,\sand the
    tuberculin skin test 1907 (Tuberculosis Control Division, 1982).

    Drugs to treat this disease were available in the 1940s. Yet today, TB is

    still prevalent around the world, especially in developing countries (World

    Health Organization, 2015b).'
