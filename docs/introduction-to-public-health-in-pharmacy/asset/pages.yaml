    Jurisdictionally, a local board of health may be a city, county, or district-level
    board. City boards of health are appointed by the city council and have jurisdiction
    over public health matters within the city. County boards of health are appointed
    by the county board of supervisors and have jurisdiction over public health matters
    within the county. District boards of health are appointed by county boards of
    supervisors from the district and have jurisdiction over public health matters.
    The boards of health generally report to the State Department of (Public) Health.


    In 2013, the CDC and the National Association of Local Boards of Health developed
    an update to the National Public Health Performance Standards Local Public Health
    Governance Assessment Instrument (version 2.0). Version 2.0 allows local boards
    of health and the state public health system to assess the assets and capacities
    of their public health systems in providing the essential public health services
    in their jurisdictions.


    # Public Health Agency Accreditation


    In 2011, the Public Health Accreditation Board (PHAB) established a voluntary
    national accreditation program for state, local, and tribal health agencies (Bender,
    Kronstadt, Wilcox, & Lee, 2014; Ingram, Bender, Wilcox, & Kronstadt, 2014; Marshall
    et al., 2014; Mathews, Markiewicz, & Beitsch, 2012; Thielen, Lee, et al., 2014).
    There are three quality improvement and planning prerequisites: (a) a state health
    assessment, (b) a state health plan, and (c) an agency-wide strategic plan. In
    addition, the PHAB requires agencies to implement a performance management system
    with performance standards, performance measures, reporting of process, and quality
    improvement.


    Standards may include national, state/territory, scientific guidelines as Healthy
    People. Quality improvement approaches include nationally recognized programs,
    as plan-do-study (or plan-do-check; Livingston et al., 2013), Balanced Scorecard
    (Weir; d''Entment, Stark, Kurji, & Robinson, 2009), Baldrige Performance Excellence
    Criteria (Goflenro, Klaster, Musson, & Rivera, 2014), and Five Sigma (Robbins,
    Gorman, & McLeary, 2012). The PHAB also recognizes disease/clinical-specific approaches,
    such as the CDC’s Winnable Battles (Blanc & Collins, 2013) or the Network for
    of of Treatment, which is used in behavioral health care settings (Quebeck et
    al., 2012).


    The actual number of PHAB accreditations is low. By 2012, only 6% of LHDS and
    27% of SHAs had submitted an application or statement of intent to credit (Shah
    et al., 2014). However, 26 states have one or more of the PHAB prerequisites,
    with one state within the 26 PHAB accreditation (Thielen, Dauer, Burkhardt, Lampe,
    & Vaenraemond, 2014). There is significant national and global'
