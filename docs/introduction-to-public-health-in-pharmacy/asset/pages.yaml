    # Foreword(s): A Public Health Perspective


    Author(s): Donna J. Petersen


    The publication of the first edition of this text marked a milestone in our understanding
    of integrative approaches to improving population health, linking public health
    directly to pharmacy practice in ways not considered previously. Since that time,
    substantive and in some cases, disruptive changes in the health care environment
    have demonstrated the importance of collaborative approaches in addressing the
    complexities of disease surveillance, services delivery, and responses to emergent
    and persistent health problems. Public health has become ever more significant
    with increased globalization of the marketplace, changing transmission patterns,
    and continued human interference in the ecosystem creating environmental hazards
    and different patterns of natural disasters. These forces challenge us to think
    differently about how we promote health communities, leading us to further consider
    how health professionals can contribute to solutions to increasingly complex health
    conditions.


    Pharmacists are among the most visible and accessible group of health professionals,
    and, as such, they are uniquely positioned to educate the public on disease prevention
    and health promotion. They can facilitate the transmission of important health
    information, monitor the responses of'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Foreword: A Public Health Perspective


    providers and consumers to that information, and correct misinformation regarding
    treatment options, medications, and alternative therapies. Pharmacists are also
    integral components of interdisciplinary health care teams, providing additional
    perspectives on patient care and medication management. However, to keep pace
    with the fields of public health and pharmacy requires pharmacists to be aware
    of the literature examining integrative and global perspectives.


    Featuring national scholars from the fields of both public health and pharmacy
    in the development of each chapter, this second edition illustrates the benefits
    of an integrative public health pharmacy approach. In addition, it provides a
    more global perspective, introducing and comparing pharmacy and public health
    practices and policies throughout the text. Each chapter closes with implications
    for pharmacy practice, a feature that assists the reader in summarizing the importance
    of the chapter to the larger public health pharmacy field.


    This text elegantly provides the critical linkages to expanding this understanding,
    providing for pharmacists an introduction to public health and an in-depth discussion
    of the role of pharmacy professionals in promoting and protecting the public''s
    health. Incorporating practice, research, and policy, this text examines critical
    issues for public health pharmacy within an increasingly globalized world. Clearly
    illustrating the critical partnership between pharmacy and public health to improve
    and sustain the population''s health, this text should be the required reading
    list for all pharmacy students and individuals in pharmacy practice. Public health
    professionals would do well to also explore in these pages further insights into
    the role of pharmacy professionals in achieving population health goals, goals
    we share.'
  merge: -1
