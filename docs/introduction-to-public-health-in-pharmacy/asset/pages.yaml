  md: '# Emergency Preparedness


    # The National Prevention Framework


    To combat the most dangerous potential bioterrorism agents (e.g., anthrax microorganisms,
    cultures of viral encephalitis, and toxic chemicals introduced in foods and water)
    requires foresight and planning. Hence, the Prevention Framework includes those
    actions necessary to avoid, prevent, or stop any of imminent terrorism (threatened
    or actual) (USDHS, 2016e). As shown in Table 14-1, the seven Prevention capabilities
    are Planning; Public Information and Warning; Operational Coordination; Intelligence
    and Information Sharing; Interdiction and Disruption; Screening, Search, and Detection;
    and Forensics and Attribution.


    # The National Prevention Framework


    This Framework focuses on key roles and responsibilities, creating stronger coordinated
    stakeholders across the Prevention, Mitigation, Response, and Recovery mission
    areas (USDHS, 2016d). Sharing the first core capabilities as the Prevention Framework,
    Protection adds Physical Protection Measures; Risk Management for Protection Programs
    and Activities; Screening, Search, and Detection; and Supply Chain Integrity and
    Security. Stakeholders include but are not limited to operations centers; enforcement
    task forces; critical infrastructure partnerships; governance boards; regional
    consortia; information sharing mechanisms/consortia; health surveillance networks;
    and public-private partnership organizations at local, state, regional, and national
    levels.


    # The National Mitigation Framework


    The Mitigation Framework seeks to reduce the loss of property and the impact of
    disasters/emergencies by fostering a culture of preparedness centered on resilience
    and emphasizing continuity of operations planning (USDHS, 2016b). In addition
    to Planning, Public Information and Warning, Operational Coordination, the Mitigation
    Framework addresses Community Resilience, Long-Term Vulnerability Reduction, Risk
    and Disaster Resilience Resilience Assessment, and Threats and Hazards Identification.


    # The National Response Framework


    The Response Framework describes how the federal government organizes and responds
    to disasters, public health emergencies, and other catastrophic events within
    a community response framework. Key concepts for response are scalability, flexibility,
    and adaptability, as there is no “one-size-fits-all” model for emergency/disaster
    responses. Of its 15 core capabilities, 11 are unique to: Critical Transportation,
    Environmental Response/Health and Safety; Fatality Management; Fire Management
    and Suppression; Infrastructure Systems, Logistics and Supply Chain Management;
    Mass Care Services;'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Emergency Preparedness


    Search and Rescue Operations; On-Scene Security, Protection, and Law Enforcement;
    Operational Communications; Public Health, Health Care, and Emergency Medical
    Services; Situational Assessment (USDHS, 2016e).


    # The National Disaster Recovery Framework


    One of the dominant themes surrounding disaster recovery is the concept of resilience,
    defined by the National Preparedness Goal as "the ability to adapt to changing
    conditions and withstand and rapidly recover from disruption to emergencies" (USDHS,
    2015, p. A-2). Hence the unique areas of focus for the National Disaster Recovery
    Framework (NDRF) are Economic Recovery, Health (somatic and behavioral), Social
    Services, Infrastructure Systems, and Natural and Cultural Resources. Hence recovery
    must be prepared to handle series of the immediate incident, as well as short-term,
    intermediate, and long-term needs, and consequences. The Recovery Continuum espoused
    by the NDRF highlights the reality that "preparedness, response and recovery are
    not separate and sequential efforts" (USDHS, 2016a, p. 5). The manage recovery
    effectively with blindsider preparedness and requires support focused on recovery
    at the immediate onset of an incident. It is a series of interdependent, concurrent
    activities that occur across the short, intermediate, and long term.


    # The National Incident Management System


    In 2003, Homeland Security Presidential Directive-5, Management of Domestic Incidents,
