    # ### Cultural Perspectives in Public Health


    **Chapter:** Cultural Perspectives in Public Health


    **Author(s):** Barry A Bleidt, Carmita A Coleman, and Peter D Hurd


    **DOI:** 10.1093/med/9780190238308.003.006


    The World Health Organization (WHO: 1948, p. 1) defines health as “a state of
    complete physical, mental and social well-being and not merely the absence of
    disease or infirmity.” Public health is “the science and art of preventing disease,
    prolonging life and promoting health through organized efforts and informed choices
    of societies, organizations, public communities and individuals” (Winslow, 1920,
    p. 30). In general, public health is concerned with issues that impact the health
    outcomes of a population in contrast to the health of an individual. The population
    in question can be as small as a handful of people within a community or as widespread
    as people living in one or more countries. Today, the burden of preventable, chronic
    diseases and the existence of global communicable diseases significantly affect
    and challenge public health and health care.


    In order to deliver effective health care and public health services, an awareness
    of and appreciation for culture’s influence on the social determinants of health
    is fundamental. Figure 6-1 illustrates how and where culture has a significant
    influence on a patient’s health beliefs and'
