    # To Er Is Human: Addressing Medication Errors through Technology


    One of the best-known instances of use of technology to improve pharmacy practice
    came with the Institute of Medicine''s (IOM) publication of *To Er is Human: Building
    a Safer Health System* (Kohn, Corrigan, & Donaldson, 2000), which increased the
    mortality and morbidity in American hospitals due to medication errors. Three
    main causes of medication errors are similar-sounding drug names (e.g., Celexa
    for depression and Celebrex for arthritis), illegitimate physician handwriting,
    and the continued expansion of the drug universe, that is, the number of drugs
    and the number of prescriptions filled annually.


    The IOM report recommended a number of changes, such as improve medicine practice,
    standardization of terminology, minimizing handoffs, and creating protocols and
    checklists. A year later, a second IOM (2011) report, *The Quality Chase: A New
    Health System for the 21st Century*, called for the automation of patient records,
    which could be integrated with computerized prescribing-order-entry (CPOE) systems,
    drug distribution, and medication administration systems.


    By 2003, the Medicare Prescription Drug, Improvement, and Modernization Act required
    that Part D plans support an "electronic prescription program" (Bell & Fried,
    2005). Medicare had issued a number of technical standards for these systems.
    However, subsets of existing standards that were used rarely, such as the full
    status notification feature of the NCPDP SCRIPT, needed to be tested. Other possible
    standards were identified, such as RxNorm, created by the National Library of
    Medicine, which creates crosswalks across similar generic and brand-name drugs
    to their active ingredients, components, and dose forms (Hanson & Levin, 2013).


