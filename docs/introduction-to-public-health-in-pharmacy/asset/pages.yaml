    Prescription drugs are quite bizarre and have intricate nuances to their use;
    this is why they are regulated as Rx only by the U.S. Food and Drug Administration.
    Taking a prescription medication at the right time, in the right manner; in the
    right amount, for the right duration, can be easily misunderstood and missed.
    For example, what is the correct timing for “TID” (three times a day)? Is it every
    eight hours around the clock, or is it better suited for real life? Most patients’
    therapies involve multiple prescription medications, plus over-the-counter drugs,
    and potentially supplements. How are these balanced? Does the patient consider
    drug-drug interactions (chemical or physiological)? After more complicated dosage
    forms such as inhalers, injectors, or eye drops? Are they being used correctly?


    The pursuit of low health literacy solutions has been ongoing.

    Intervention research has been investigating ways to improve patient outcomes.
    The National Council for Prescription Drug Programs introduced the concept of
    a Universal Medication Schedule (UMS). UMS simplifies medication administration
    instructions for patients and/or caregivers, increases patient understanding and
    adherence to their medication instructions, and results in improved health outcomes.
    The consistent and repeated use of these standards will assist patients in understanding
    and adhering to their medication regimen. For example, instructions that “take
    one pill in the morning and take one pill in the evening” (National Council for
    Prescription Drug Programs, 2013). Figure 7-3 shows the adaptation of standard
