    # Public Health Links to Pharmacy


    The intersection of public health and pharmacy education is

    not as early as 1932, public health instruction was being taught in

    school of pharmacy (Gibson, 1972a). This trend continued through the

    1950s and 1960s (Gibson & Webster, 1952; Gibson, 1966). A series of

    sveys in the 1970s reiterated the importance of public health in

    pharmacy education and practice (Gibson, 1972a, 1972b, 1973). Bush and

    Johnson (1979, p. 249) argue “not nearly enough pharmacists are

    aged in public health activities” and “pharmacy education has failed

    to recognize the potential for pharmacists in public health.” They

    emphasized the need for macro-level pharmacists, who could focus on the

    health status of a community and not the individual. These pharmacists

    would actively engage in services planning, delivery, assessment, and

    evaluation and also participate in policy development. Later the APHA

    Pharmacy Services Committee issued a position paper that\addressed features for
    pharmacists in pharmacy services; these included

    (a) community policy and planning of pharmacy services; (b) consumer

    outreach and access; (c) drug and (d) health care delivery,

    such as intra- and interragency drug delivery systems and coordination

    with-private sector systems (Milne & Johnson, 1979).


    In 1980, the APHA adopted a position paper, “The Role of the Pharmacist

    in Public Health,” which described what was as core pharmacist-

    activities within public health. The paper mirrored many of the activities

    for Bush and Johnson’s (1979) list included counseling, educating, and

    screening parties; it also encouraged formal educational training in

    public health (APHA, 1980).


    A decade and half later, in 2006, the APHA released a new policy

    statement on “The Role of the Pharmacist in Public Health,” superseding

    t earlier 1980 policy statement. The new policy stated there were “many

    functions of public health that can benefit from pharmacists’ unique

    expertise that include pharmacotherapy, access to care, and

    vention services” (APHA, 2006, para. 1). Building on that statement

    sociation began to clarify the role of pharmacy as a profession within the

    public health workforce, pharmacy health education, disease prevention and

    health promotion, services within the core public health functions, and

    preness, and policy development.'
