    # Specific Problem Areas in Global Health


    Global health includes broad categories that help to focus efforts on improving
    health. Maternal health, including pregnancy, childbirth, and maternal/perinatal
    nutritional issues would be one category. Across all age groups, the reduction
    of specific diseases found worldwide, such as drug-resistant TB, malaria, polio,
    smallpox, and HIV/AIDS are examples of global health initiatives. Tobacco use
    and substance abuse would be other worldwide public health foci. As people live
    longer, chronic diseases become more prevalent as major health issues.


    # Infancy, Childhood, and Adolescence


    Malnutrition and suboptimum breastfeeding were the causes of 3.1 million child
    deaths, or 45% of all child deaths in 2011 (Black et al., 2013). Malnutrition,
    which includes fetal growth restriction, stunting, wasting, and vitamin and mineral
    deficiencies ( vitamins A and D, iodine, and zinc), increases the risk of neonatal
    deaths and increases the effect of every disease, including measles and malaria.
    One of the public health issues in maternal and infant health is the emphasis
    on breastfeeding to avoid specific health risks from early weaning or the use
    of infant formula (Office of the Surgeon General, 2011). The WHO (2002a) recommends
    that mothers exclusively breastfeed infants for the first six months of life,
    followed by "adequately and safe complementary foods" for up to two years of age
    or beyond. Early weaning affects the baby''s immune system and may stress postpartum
    depression or failure to bond on the part of the mother. Formula feeding and early
    weaning are associated with poorer infant health, such as malnutrition (undernutrition)
    and errors in common childhood health infections (e.g., diarrhea and ear infections).


    Many child deaths are due to diarrhea, respiratory tract infections, and malaria
    (Kyu et al., 2016). Mortality and Disability-Adjusted Life Years for lower respiratory
    tract infections and diarrhea diseases rank among the five causes for deaths in
    younger and older children in 2013 (Kyu et al., 2016). Five countries in the Congo,
    Pakistan, Nigeria, and'
