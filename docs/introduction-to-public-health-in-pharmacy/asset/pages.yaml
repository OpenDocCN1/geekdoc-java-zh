    # Pharmacy Practice


    Technology to support pharmacy practice is not new. The use of technology in pharmacy
    in the United States dates back to the 1970s and possibly earlier. In 1992, an
    expert conference arranged by U.S. Pharmacopoeia predicted that, 2020, the future
    of pharmacy practice would be affected by three factors: movement from a local
    to a global market, achieving cost-effectiveness in health care, and benefits
    from information technology (Bezold, Halperin, & Eng, 1993). More than 20 years
    later, another international study on pharmacy practice found that the vision
    for community pharmacy would have a strong patient care orientation and equally
    support from technology, including work optimization, online documentation and
    follow-up, access to evidence-based practice and decision-making, shared patient
    data, and e-prescribing (Westering, Haikala, & Airaksinen, 2011). These predictions
    and visions have come true. These did not only affect pharmacy but almost all
    of pharmacy as institutional, ambulatory care, and hospitals. There has even been
    the rapid development of pharmacy informatics to major national'
