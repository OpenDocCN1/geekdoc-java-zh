    # Introduction


    The US health care system is not a single system but is comprised

    of multiple systems of mixed private and public financing and insurance

    mechanisms in the delivery of healthcare. That structure and the costs of

    care differ from other developed countries. The federal

    government reported spent approximately $3.7 trillion on

    health in 2015, or $9,990 per person (Centers for Medicare &

    Medicaid Services [CMS], 2016b). In contrast, total health expenditures

    for Canada reached $219.1 billion or $6,105 per Canadian in 2015

    (Canadian Institute for Health Information, 2015). Comparing the per

    capita spending of selected nations to the United States, the Netherlands

    spent $3,131, France $4,361, Germany $4,920, the United Kingdom

    spent $3,364, and Israel $2,232 (Mossials, Wenzel, Osborn, and Sarnak, 2016).'
