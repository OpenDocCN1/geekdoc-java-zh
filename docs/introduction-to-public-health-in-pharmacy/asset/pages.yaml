    Economic evaluations use the fixed and variable costs. A fixed cost is a cost
    that does not change based upon either an increase or a decrease in production.
    An example of a fixed cost is the insurance on the physical building of a business,
    such as a pharmacy; the cost of the insurance is not dependent on the number of
    prescriptions or services rendered. A variable cost is affected by a change in
    volume. In a pharmacy, as the volume of prescriptions increases, the number of
    labels and vials would increase.


    An understanding of average and incremental (marginal) costs is fundamental to
    pharmacoeconomic analysis. The average cost is the total costs divided by the
    total units. If a bottle of #100 pills costs $50, the average cost would be $50
    / 100 = $0.50 per pill. Incremental costs (synonymous with marginal costs) are
    calculated between two alternatives such that the change in total costs is divided
    by the change in units (e.g., outcomes). If we compare two medicines, where Drug
    A costs $80 and Drug B costs $65 with a 64% rate, we find the difference in costs
    (numerator) and divide by the change in rate (denominator)—$125 per added ($80
    – $65) ÷ (0.76 - 0.64) = $15/0.12 = $125 per added. In this way, pharmacoeconomic
    evaluations measure the average costs as well as the incremental costs over alternatives.


    In an effort to categorize costs used in pharmacoeconomic analyses, four classifications
    are often used: direct medical, direct indirect, indirect, and intangible (Table
    11-1). Direct medical costs are resources consumed to provide directly medical
    treatment. Examples include medications, hospitalizations, physicians visit, ambulance
    service, and laboratory tests. Direct indirect costs are nonmedical resources
    consumed by the patient and family associated with treatment. Examples could include
    travel costs to receive medical care as well'
