    United States


    Motjabai et al. (2011) examined barriers to treatment by adults using findings
    from the U.S. National Comorbidity Survey-Replication.

    The most common reasons were attitudinal or evaluative barriers (97.4%), lo perceived
    need (44.8%), and structural barriers (22.2%). Of the attitudinal/evaluative barriers,
    wanting to handle the problem by oneself ranked first (72.6%), followed by perceived
    ineffectiveness (16.9%), thought that things would get better (11.5%), and stigma
    (9.1). Structural barriers were identified as financial (15.3%), availability
    (12.8%), transportation (5.7%), and inconvenience (9.8). Motjabai et al. also
    found that, across levels of severity, perceived need was the most reported barrier
    to treatment. These findings are significant and consistent with findings from
    numerous other studies regarding access/utilization (Alonso et al., 2004a; Codony
    et al., Sareen et al., 2007). From a cross-national perspective, structural barriers,
    specifically financial barriers, are reported as another barrier to care (Alonso
    et al., 2004b; Codony et al., 2009; Sareen et al., 2007).


    Europe


    The European Study of the Epidemiology of Mental Disorders (ESEMED) project, funded
    by the European Union, examined access and use of behavioral health services in
    Belgium, France, Germany, Italy, the Netherlands, and Spain. SEMED showed that
    less than 30% of those with a behavioral disorder accessed or utilizes services
    (Alonso et al., 2007). Alonso et al. (2004b) found that approximately one-third
    of persons who had a behavioral disorder did not seek treatment. In addition,
    21% of mental health professional had not started a specific treatment for their
    disorder. Codony et al. (2009) found that 50% of the respondents identified there
    was a perceived need for treatment. Across countries, the perceived need was 5%
    in Italy, 9% in Spain, 12.1% in the Netherlands, 12.3% in Belgium, and 13.5% in
    France. For individuals in certain countries, the lack of insurance coverage for
    treatment of behavioral disorders restricted access (Alonso et al., 2004b) as
    does personal characteristics (such as age and gender; Codony et al., 2009). Behavioral
    disorders were also determined to be more important determinants of role stability
    and quality of life than physical disorders, and behavioral disorders had generally
    “cross-domain” effects (Alonso et al., 2004a).


    # Underdetected Illness


    For people with severe mental illnesses, public mental health systems offer rehabilitative,
    recovery-focused care. However, persons with other insurance plans or adults with
    less mental health conditions who are uninsured may face significant gaps in coverage
    and access to services. Further, in the United States behavioral health is “carved'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Behavioral Health


    out” from the larger public health care system, persons with mental illnesses
    must navigate two separate and distinct systems of care.


    Underdetected or undiagnosed illnesses in persons with behavioral disorders is
    a growing concern. Numerous conditions are undiagnosed because they have vague
    or negligible symptoms, such as type 2 diabetes, hypertension, hyperlipidemia,
    osteoporosis, chronic kidney disease, and hypothyroidism or other thyroid disorders.
    Other conditions that are undiagnosed due to lack of awareness on the part of
    the physician include depression, sleep disorders and attention deficit hyperactivity
    disorder in adults (McWhiter; Bae, & Budur, 2007) bipolar disorders (Kim et al.,
    2013), and asthma (Gibson, McDonald, & Marks, 2010, Huistiede et al.).


    Adults who report nonpsychological distress, major depressive disorder or posttraumatic
    stress symptoms (posttraumatic stress disorder and posttraumatic stress syndrome)
    have more problems with their physical health than persons who do not report symptoms.
    In addition, primary care providers routinely miss the connection between somatic
    illnesses and symptoms of mental illnesses. This may be due to lack of time spent
    with patients, deficits in a physician’s own knowledge and skills, and the limited
    availability of specific treatment guidelines and psychosocial treatment alternatives
    (Satter et al., 2012).


    Not only are persons with behavioral disorders more likely to have poorer diets,
    more sedentary lifestyles, and smoke, but they are more prone to hypertension,
    hyperlipidemia, obesity, asthma, and diabetes, leading to more serious medical
    conditions. The more serious the medical condition, the more likely the patient
    will experience a mental illness. For example, when a patient’s depressive symptoms
    and anxiety increase, there is a corresponding increase in the frequency and severity
    of the attacks. Depression is also a major factor in pain management and immune
    functioning. Undiagnoseded also extend to treatments. Some of the antipsychotic
    medications are associated with complications, such as high blood glucose levels,
    and diabetes. Mental and somatic disorders coexist, and the presence of a mental
    disorder impairs patient functioning and his or her ability to sustain effective
    disease management.


    # National and State Policy for Pharmacy Practice and Behavioral Health


    The Paul Wellstone and Pete Domenici Mental Health Parity and Equity Act of 2008
    (MHPAEA) enacted to prevent prevent health plans and insurers from providing mental
    or substance disorder benefits from establishing limitations to treatment that
    were less than those given for medical or surgical benefits (MHPAEA 2008). The
    goal of this act was to provide similar coverage for mental health or addiction
    treatments as was provided for medical conditions. Generally'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Behavioral Health


    to large group health plans and disallowed the imposition of annual or lifetime
    dollar limits on mental health benefits and substance use disorder treatment.


    This act was amended by the Patient Protection and Affordable Care Act and the
    Health Care and Education Reconciliation Act of 2010 (referred to as the Affordable
    Care Act). The Insurance Exchange Provisions within the Affordable Care Act require
    that all individual and group plans through the exchanges comply with mental health
    parity regulations and provide essential benefits. As of January 2014, the essential
    benefits included prescription drugs, mental health and addictions treatment,
    and rehabilitation treatments. The cost-sharing by plan type varies in payment
    from 60% to 90%. The expansion of Medicaid coverage by states is another requirement
    of the Affordable Care Act. States must provide coverage to people who are living
    up to 133% of the federal poverty level. One caveat of this expansion is, while
    mental health and addiction treatment services will be provided, Medicaid entitles
    states may have more limited benefits than previously enrolled under prior benefits
    (Paradis, 2015).


    States may employ three strategies to meet the requirements for Medicaid expansion
    under the Affordable Care Act. The first is through a State Amendment Plan that
    ensures coverage for mental health and substance use disorders and the MHPAEA
    requirements for parity. Mandatory enrollment into Managed Care Organizations
    (MCOs) may also be considered; this requires mental health and substance disorder
    coverage based on the determination of the managed care organization. States may
    also require patients to enroll voluntarily into Alternative Benefit Plans (ABPs).
    ABPs have existed for several years as a mechanism for enhancing coverage for
    Medicaid beneficiaries; these are now required to provide mental health and substance
    use treatment as part of the plan benefit.


    Generally, Medicaid programs are divided into fee-for-service (most seriously
    ill and disabled) and MCOs (healthier patients). The fee-for-service programs
    are more costly for the state Medicaid program but provide the most comprehensive
    benefits for the disabled population. Many state Medicaid programs will scale
    back their fee-for-service plan structure in favor of the MCO plans, which require
    the managed care organization to provide care for patients at a set fee per patient.
    There is a concern that patients with disabilities who are transitioned to an
    MCO plan will not receive the same level of care that was previously provided
    by the fee-for-service structure. These vulnerable patients often do not have
    the money to pay for services that are not covered by the MCOs (Burns, 2015).
    The expansion of Medicaid services will continue in most states for the next few
    years. It remains to be seen how many individuals in need of healthcare insurance'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Behavioral Health


    will be covered by Medicaid expansion and how this treatment will be

    delivered.


    # Evidence-Based Practice in Mental Health: The

    Schizophrenia Example


    The translation of clinical trial information and evidence-based practice in

    chronic medical disorders, such as hyperlipidemia, diabetes, and

    hypertension, is generally achieved in a rapid manner. New treatment

    guidelines or supplements to existing guidelines are generally published

    within several months of new evidence becoming available for these

    disease states. This is not often the case in the treatment of mental

    disorders. Here we use the example of antipsychotics in the

    treatment of schizophrenia heavily toward monotherapy, with

    little to no evidence for polypharmacy (two or more

    routine antipsychotic medications) in patients.


    In 2005, Ascher-Svanum, Zhu, Cornell, and Kane evaluated data

    regarding the use of monotherapy and polypharmacy with

    atypical antipsychotics. Thirty-six percent of patients in the study

    received monotherapy; while twenty-seven percent were taking two or more

    tipsychotics. More than thirty percent of patients were receiving a mix of\monotherapy
    and polypharmacy over the course of the study (Faries et

    al., 2005). A doi study evaluating the use of antipsychotic monotherapy

    versus polypharmacy noted that the trend from 2005 continues and the

    use of polypharmacy may be increasing (Novick et al., 2012). It is

    instructural to consider that treatment guidelines for the

    management of schizophrenia exist from various sources and

    is consistent in noting that monotherapy with an antipsychotic is

    treatment of choice and continues to be through several steps of each

    treatment guidelines (Dixon, Perkins, & Helms, 2009);

    International Psychopharmacology Algorithm Project, 2015;

    204; National Institute for Clinical Excellence, 2014). Unfortunately,

    the American Psychiatric Association provided an updated guideline

    in 2009 and the National Institute for Clinical Excellence offered a

    revised guideline in 2014, the use of antipsychotic polypharmacy remains

    constant and is, in many cases, increasing.


    Evidence suggests that not only is antipsychotic polypharmacy ineffective

    toverall in the treatment of schizophrenia, but patients who are receiving

    multiple drugs have a lower rate of adherence to treatment and a greater

    risk of significant adverse drug events and side effects related to the

    treatment (Barnes & Paton, 2011). Several justifications are cited for the

    use of antipsychotic medications. Healthcare providers may desire to

    target a specific symptom not covered by the current

    antipsychotic or may be concerned that an increase in the dose of the

    monotherapy may lead to greater effect risk and add

    another antipsychotic in order to continue at lower daily doses.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Behavioral Health


    Another common reason for antipsychotic polypharmacy is a patient who is transitioning
    from one antipsychotic to another using a cross-tapering approach and the patient''s
    symptoms of schizophrenia improve while in the middle of the transition. In this
    case, the provider may not want to continue to cross-taper or discontinue either
    drug because the patient is doing well on both medications (Barnes & Paton, 2011).


    Clozapine is an antipsychotic that is considered the best for efficacy over other
    antipsychotics. Some treatment guidelines suggest that a trial of clozapine as
    monotherapy should be implemented prior to initiating antipsychotic polypharmacy.
    Wheeler, Humblestone, & Robinson (2009) studied the impact of prolonged clozapine
    treatment on outcomes for schizophrenia patients and described improved occupational
    activities and lower hospitalization rates while lowering the overall cost of
    treatment.


    While several studies have come to the same conclusion in recent years, there
    has been a paucity of prescribing clozapine by healthcare providers. Healthcare
    providers often perceive that clozapine is difficult for both the patient and
    provider to use due to significant side effects and required white cell monitoring,
    which offers an opportunity for the pharmacist to provide drug information and
    support to both patients and providers.


    It is clear that a gap exists between guideline recommendations and clinical practice.
    Simply providing information to healthcare providers has been unsuccessful in
    transitioning the evidence to clinical practice. Several ways have been suggested,
    including the use of treatment algorithms, educational outreach visits to providers,
    electronic reminders, and standardized assessments. Hirano et al. (2013) evaluated
    the use of algorithm-based treatment versus treatment-as-usual in schizophrenia
    patients. Forty-two patients with severe symptoms of schizophrenia were enrolled
    and randomized to one of the two treatment conditions; algorithm-based treatment
    compared favorably with the treatment-as-usual. Updated algorithms for the treatment
    of schizophrenia are being published. The Harvard South Shore Program recently
    provided an update for their Psychopharmacology Algorithm Project for schizophrenia
    that mirrors treatment guidelines and may be a good source of information for
    health care providers (Osser, Roudsari, & Manschreck, 2013).


    The PA process within Medicaid programs has been described previously. In one
    state, the Medicaid program has open access to behavioral health drugs and uses
    the clinical evidence to implement PA criteria for psychiatric medications. In
    2014, the state implemented a PA for antipsychotic polypharmacy that the healthcare
    provider should consider the use of clozapine monotherapy prior to receiving a
    PA for antipsychotic polypharmacy for a Medicaid patient. The Medicaid program
    recognized that some patients may not be eligible for clozapine due to psychosocial
    issues such as clinic attendance or for clinical reasons like'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Behavioral Health


    could be worsened by the use of clozapine. The PA does not require that the patient
    try clozapine if these conditions exist but also not allow the provider to disregard
    the use of clozapine because the provider is uncomfortable with its use. This
    is an example of a payer attempting to modulate prescribing practices by forcing
    the provider to consider evidence-based treatment guidelines.


    # Implications for Public Health and Pharmacy Practice


    There continues to be an increasingly important move toward the integration of
    primary health and behavioral health services in America. This increasing services
    delivery collaboration will impact education only for primary care health providers
    and behavioral health providers but also pharmacy education.


    Skills needed for working on an integrated team for health and behavioral care
    are not generally part of the academic preparation for health and behavioral care
    professionals. For pharmacy education, this may require a retooling of curriculum
    and practice for pharmacy students as well as the continuing education of practicing
    community pharmacists. It may also require added emphasis on community-centered
    approaches to clinical pharmacy practice. These have included awareness of current
    epidemiological and disease surveillance information as well as an increased emphasis
    on health information technologies, such as electronic record systems and use
    of additional behavioral health information systems.


    Federal and state policies are not structured to promote collaborative practice.
    State regulations for collaborative practice, including the definition of collaborative
    practice, differ significantly across states. For example, in Midwest West, a
    clinical pharmacist provides medication management services, including initiation
    and discontinuation, changes, refer authorizations, laboratory monitoring, and
    assessment for outpatient mental health practice that includes more than 50 patients
    with early psychosis. The clinical pharmacist practices under a scope of practice
    that is approved by the institution and signed by the clinic psychiatrists, which
    allows patients to be scheduled for individual clinic appointments with the pharmacist
    for medication management.


    Pharmacists should take advantage of opportunities to engage in behavioral health
    work groups. These allow them to keep abreast of critical behavioral health issues
    and to bring their concerns regarding quality of care, coordination, and patient-centered
    outcomes to policymakers and lawmakers.


    Education of primary care medical providers about the training and ability of
    pharmacists to manage and monitor complex drug regimens is paramount in gaining
    strong advocates for the expanded role'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Behavioral Health


    of pharmacists in patient care and community practice. These are important considerations
    as community pharmacists and psychiatric clinical pharmacists continue to become
    a more integral part of behavioral health services delivery.


