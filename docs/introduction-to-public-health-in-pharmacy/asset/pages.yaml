    # Basic Concepts and Principles in Epidemiology for

    Pharmacists


    Epidemiology, a basic science of public health, is the study of the factors that
    determine the frequency and distribution of disease in human populations (MacMahon
    & Pugh, 1970). A quantitative discipline based on probability, statistics, research
    methodologies, and disease etiology, epidemiology uses causal reasoning (i.e.,
    hypotheses) to examine what factors cause, exacerbate, and/or prevent disease
    (morbidity) and death (mortality). Epidemiology encompasses the distribution of
    disease, factors that cause disease, and the attributes of disease in defined
    populations.


    Epidemiology examines the incidence, frequency, prevalence of endemic and epidemic
    outbreaks. Epidemiological surveys and estimates establish morbidity in specific
    geographic areas/regions and specified populations. More formally, epidemiology
    is the study of the interrelationships of host (the organism harboring the disease),
    agent (cause of the disease), and environment (external factors that cause or'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Epidemiology


    allow disease transmission). These three factors determine the frequency, distribution,
    and control of disease in human populations. As such, epidemiology looks at characteristics
    of time, place, and people in determining the causes and occurrences of health-related
    events.


    Epidemiology is descriptive in that it looks at the what


    # Table 4-1 Differences between Descriptive and Analytic Epidemiology


    | Descriptive Epidemiology | Analytic Epidemiology |

    | --- | --- |

    | Examines frequency and distribution of risk factors | Studies risk/protective
    factors of diseases |

    | Searches for information/clues | Uses available information/clues |

    | Formulates hypotheses | Tests hypotheses |

    | No comparison groups | Uses comparison groups |

