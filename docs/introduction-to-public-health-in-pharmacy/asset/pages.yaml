    systems, and appropriate use of program planning" (Brownson, Gurney, & Land, 1999,
    p. 87). This definition emphasizes the importance of empirical reasoning in appraising
    and interpreting evidence derived from the use of public health models, studies,
    and data.


    Key components of EBPH include making decisions using the best available scientific
    evidence, systematically using data and information systems, applying program
    frameworks, engaging stakeholders and the community in disseminating learned (Brownson,
    Fielding, & Maylach, 2009). Further, the eight core domains and 26 competencies
    for EBPH are to improve decision-making in public health practice to better address
    agency-level conditions and practices (Brownson et al., 2009). This is a critical
    component when we are designing interventions from a population or public health
