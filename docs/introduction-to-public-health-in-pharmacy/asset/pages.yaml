  pgno: 340
- img_proc: true
  md: '# Education and Training


    Methodologies for teaching public health during the first portion of most pharmacy
    curricula is done through both didactic and active learning activities, as such
    case studies, problem-based learning, oral presentations, journal club presentations,
    in-class simulations, and tabletop exercises or opportunities to give educational
    presentations to specific groups or to participate in wellness centers, free clinics,
    or medical missions (Bailey & DiPietro Mager, 2016; Dennis et al., 2016; O''Neal
    & Berdine, 2007; Willey). The final year of the PharmD gives students the most
    cited opportunities to incorporate public health into practice, with hands-on
    experience of conducting health screenings, providing immunizations, and chronic
    care counseling (Denis et al., 2016; Patterson, 2008).


    Two areas of public health seems to be underrepresented in pharmacy curriculum
    at present are preparedness and global health (Accreditation Council for Pharmacy
    Education, 2015; AACP, 2013; Woodard et al., 2016). Not only are pharmacists in
    communities and hospitals well positioned to respond to potential infectious disease
    outbreaks. Pharmacists are often included in disaster response preparations and
    response, yet the necessary skills may not be taught in many schools and colleges
    of pharmacy.


    Similarly, a number of PharmD programs include opportunities for students to experience
    global health, through either elective courses or medical mission outreach. In
    their review of the curricula at US institutions, Bailey and DiPietro Mager (2016)
    found only eight PharmD programs that required global health competencies covering
    topics such as planning and implementation of medical missions, travel medicine,
    and global health research and policy development.


    # Dual and Concurrent Degrees


    The AACP lists 34 schools offering a combined PharmD and master of public health
    (MPH) degree in 2016–2017 (AACP, 2015). This represents an increase of 11 institutions
    over the 23 reported by the 2011-2012 AACP Public Health SIG survey (Gortney et
    al., 2013). At the time of the survey, one-third of these PharmD/MPH programs
    have been in existence for less than a year, indicating that there is a growing
    interest in the United States. Combining a PharmD with a master of science in
    biomedical or health informatics is less common, with only four institutions listed
    in the AACP report (ACPE, 2015). In addition, many institutions have specialty
    certifications or areas of concentration in public health, informatics, medication
    therapy management, immunization, point-of-care teaching, and substance abuse/tobacco
    cessation. This does not account for individuals who pursue an MPH or health informatics
    degrees outside of a formal PharmD program.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Education and Training


    Dual degrees are available at some institutions combining the PharmD with global
    health. "Global health" is sometimes used interchangeably with "public health,"
    but institutions offering this program emphasize the unique issues that face pharmacists
    working in transnational or international environs. Global health tracks are more
    available for students pursuing a concurrent MPH.


    # Postgraduate Training: Residencies


    Licensing requirements for postgraduate continuing education provides avenues
    for pharmacists to increase their expertise in public health. Options range from
    continuing education classes to pursuing board certification in a specialty related
    to public health. Interested individuals in obtaining more formal certification
    or credentials for advanced practice in public health may do so by participating
    in advanced training programs in topics such as travel medicine, patient care,
    and immunization delivery.


    PharmD graduates may choose to participate in one- to two-year residency or fellowship
    programs either as an end in themselves or with the goal of obtaining board certification.
    ASHP has developed an accreditation program for residencies that matches potential
    candidates with accredited residencies. Residency candidates select from a Postgraduate
    Year One (PGY) program, a Postgraduate Year Two (PGY2) program, or a PGY1 and
    PGY2 combined program. For the residency matching in 2016, 1,708 residency programs
    participated in ASHP’s matching program and a total of 3,954 residencies were
    placed into programs (ASHP, 2016a). PGY1 programs are geared toward generalist
    practice with focuses on community pharmacy, managed care pharmacy, or pharmacy.


    The PGY1 residency program has four competency areas, programs may include the
    elective competency of Health, Wellness, and Emergency Preparedness, which requires
    residents to "design and deliver programs that contribute to public health effects"
    and contribute to "organizational programs for emergency preparedness" (Commission
    on Credentialing of the American Society of Health-System Pharmacists, 2014, p.
    14). In addition, public health experience is gained by completing the PGY1 residency
    at an institution that specializes in public health, such as a public health department
    or system, with specific populations, such as in a prison or military hospital.
    In the second year of residency, programs emphasize specialty practices. Some
    ASHP-accredited PGY2 residencies include public health as a primary educational
    outcome, and these are discussed next.


    Ambulatory care pharmacy prepares residency graduates to plan and manage the needs
    of patients with chronic conditions, disease states or illnesses that do not require
    hospitalization. The fourth educational outcome (ASHP, 2006a, p. 13) for the ambulatory
    care program'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Education and Training


    establishes that pharmacists who specialize in ambulatory care will focus on establishing
    a long-term partnership with the patient to improve health and wellness and work
    together to prevent disease. Many ambulatory pharmacy and infectious disease residencies
    offer specializations in areas such as HIV/AIDS, chronic hepatitis C treatment,
    anticoagulation management, diabetes management, and addiction medicine.


    As might be expected, public health is of primary importance for pharmacists who
    specialize in infectious diseases pharmacy. The first educational outcome (ASHP;
    2006, p. 3) lists prevention of infectious diseases along with promotion of health
    improvement and wellness. Specific objectives for this specialty are to “reduce
    the spread of antibiotic resistance and preventable disease” of Infectious Disease
    Pharmacists, ASHP & Society, 2007, p. 1).


    Geriatric pharmacy and pediatric pharmacy include goals of improving health and
    wellness, as well as preventing medication-related problems that are unique or
    more prevalent, among specific age groups (ASHP, 2008; ASHP & Pediatric Pharmacy
    Advocacy Group, 2016). Four percent of the Pediatric Board exam is devoted to
    pediatric pharmacists'' responsibilities to advocate for “age-appropriate formulations”
    of medications and participate in public education regarding issues that affect
    infants, children, and adolescents, such as poison prevention and vaccination
    (Board of Pharmacy Specialties, 2015c).


    PGY2 residences in pharmacy informatics do not specify public health outcomes
    per ASHP. The specialty has many public health-related implications, such as improving
    the medication system, identifying trends, and making interdisciplinary health
    care decisions (ASHP; 2006b; Shapiro, Mostashari, Hripcsak, Soulakis, and Kuperman,
    2011).


    In addition to the above PGY2 residencies, other ASHP accredited programs that
    may include public health training are cardiology, critical care, drug information,
    emergency medicine, health system pharmacy administration, internal medicine,
    medication usage safety, nuclear medicine, nutrition support, oncology pain management
    and palliative care, psychiatric pharmacy, and organ transplant (ASHP; 2016b).


    # Postgraduate Training: Board Certification


    The Board of Pharmacy Specialties offer eight board certifications to pharmacists,
    most of which involve a public health component. Specialties in ambulatory care
    or pharmacotherapy require more in-depth knowledge of population and public health
    topics such as patient education strategies, quality improvement programs, and
    emergency preparedness (Board of Pharmacy Specialties, 2015a, 2015d),'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Education and Training


    specialties in pediatric or oncology pharmacy have a smaller public health and
    advocacy component (Board of Pharmacy Specialties, 2015b, 2015c).


    # Postgraduate Training: Certificates and Continuing Education


    Certificate training programs are available for advanced professional training
    to pharmacists in specific practice areas of delivering medication therapy management
    systems, pharmacy-based cardiovascular disease risk management, pharmacy-based
    immunization delivery, and patient-centered diabetes care (American Pharmacists
    Association [APHA], 2016a). State licensing boards require practicing pharmacists,
    as well as student licensees, to have current certification in cardiopulmonary
    resuscitation or basic cardiac life support prior to administering vaccinations
    to patients (APHA, 2016b). Basic Life Support for Healthcare Providers may also
    be required, depending on state requirements.


    Public health-related certificates not specific to pharmacy are available, such
    as certified diabetes educator or certified asthma educator. These are typically
    available from the national organization associated with the disease, such as
    the American Diabetes Association or the National Asthma Education Board.


    # Career Options in Public Health Pharmacy


    All pharmacists are public health pharmacists to some extent, particularly those
    in community or hospital settings who work directly with patients. However, there
    are jobs that specifically require public pharmacists. Within the United States,
    many positions are part of government programs. Federal opportunities include
    working in the Veteran''s Administration, as military pharmacists, Indian Health
    Services, or in one of the health-related federal agencies, such as the Centers
    for Disease Control and Prevention, the Food and Drug Administration, or the U.S.
    Agency for International Development. Federally Qualified Health Centers (FQHCs)
    and departments of health at the state and local levels also have public pharmacist
    positions. International agencies, such as the World Health Organization and Doctors
    without Borders (Médecins San Frontières), look for pharmacists with training
    and experience in global health pharmacies.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Education Oxford Training


    Even without a formal job description in public health, there are other examples
    of ways for pharmacists to participate in and affect public health. Many public
    health and community organizations welcome pharmacist representation in their
    councils, committees, and boards. Due to pharmacists'' unique and trusted position
    in the community, they are

    often the first line in the surveillance of public health issues. Many pharmacists
    contribute to public health initiatives by promoting adherence, monitoring for
    adverse drug effects, and fostering continuity

    care.


    # The Need for Public Health Education and

    Training in Pharmacy


    Growing opportunities for pharmacists in public health initiatives requires an
    understanding of the core competencies and public health functions. Facilitating
    cross-training for all health care providers has been highlighted through such
    approaches as the Interprofessional Education Collaborative (2016), which provides
    guidance for students and health care professionals on the development of collaborative
    approaches to care. Higher education is a pivotal area to develop and model the
    curricula for future health care providers, as well as utilizing providers in
    practice to elicit the needed change to improve population health outcomes. The
    ability to enhance experiences available to the health care system with health
    care initiatives at-risk communities will require the judicious allocation of
    health care spending. Developing strong teams leads to effective programming and
    interventions that improve overall outcomes and foster sustainable interventions
    that prevent disease and foster a culture of health.


    The American Public Health Association (APHA), APhA, and ASHP provide governance
    through policy statements that specifically address pharmacists'' roles in public
    health. These statements describe the essential contributions of the pharmacist
    yet the ongoing deficiency in formal recognition as a profession in the public
    health workforce (APHA, 2014). The unique placement in the community for many
    pharmacists allows them to serve as point of entry into the health care system.
    The growing body of patients needing care for chronic diseases requires further
    education and expertise of pharmacists within the community to provide education
    for prevention of complications and successful management of their health. In
    addition, the ability and accessibility of pharmacists to provide screenings facilitates
    early detection of disease or prevention. Understanding the framework of public
    health programming can enhance the recognition of services in a given community
    or within a target population that integrates the pharmacist in the public health
    workforce.


    Calls for workforce enhancement, relative to pharmacists'' roles, are implicated
    through the practice shift from one of disease management to one that mirrors
    other health professions in disease prevention. Multiple opportunities exist outside
    of public health organizations, as as'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Education and Training


    FQHCs and departments of health, for pharmacists to address population health
    issues and community health issues they see in everyday practice. Whether it is
    working in the capacity of health care planning and program development through
    the implementation and surveillance of health care initiatives, pharmacists are
    uniquely qualified to strengthen the health care system at local, regional, and
    national levels through innovative and coordinated services (National Center for
    Chronic Disease Prevention and Health Promotion, 2012). By partnering pharmacists
    with other providers, as well as their patients, institutional impacts can be
    made to enhance care and services, improve safety, increase health literacy, and
    promote successful transitions of patients back into the community setting.


    Health cost containment with cross-trained providers is increasing at the state
    level efforts to curb health care spending and optimize patient outcomes. Public
    health partnerships among clinicians and public health professionals strengthen
    the workforce and are essential in the wake of shortages of primary care providers.
    Enhanced education and training of pharmacists entering the pharmacy workforce
    increase the impact of pharmacists in medication management but, more importantly,
    increase the impact of pharmacists in the development and implementation of health
    care initiatives targeted for a specific community that foster self-efficacy.
    Public health initiatives for pharmacists include health optimization or comprehensive
    management workplace and integration of preventive medicine services, which include
    immunization, chronic disease prevention, smoking cessation, adherence programs
    to reduce disease progression, and monitoring for adverse effects or unintended
    effects of medications (Lai, Trac, & Lovett, 2013).


    The development and integration of public health concepts in the pharmacy curricula
    across the country and increasing numbers of dual degree options through collaborations
    of pharmacy and public health programs further support the efforts of the APHA,
    APhA, and ASHP are taking action to prepare pharmacists for the public health
    workforce.


    # Leadership


    For pharmacists who wish to develop their leadership skills in public health,
    there are a number of strategies, including formal programs in pharmacy, leadership
    programs out of pharmacy, informal personal development, and work within the APHA.
    Participating in a formal leadership program provided by one of the organizations
    (e.g., ASHP, American College of Clinical Pharmacy [ACCP], AACP, or APhA) builds
    leadership skills, develops relationships with like-minded colleagues, and offers
    opportunities.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Education and Training


    The ASHP provides leadership training through the ASHP Foundation, which is a
    nonprofit arm of the organization (www.ashpfoundation.org). The ASHP-Pharmacy
    Leadership Academy provides programming ranging from finance to technology in
    its leadership training. This organization focuses on acute and ambulatory health
    care settings and provides a foundation in leadership that could help an individual
    lead public health change.


    The ACCP offers a Leadership and Management Certificate Program in conjunction
    with its national meetings. The training focuses on the knowledge, skills, and
    attitudes that will help an individual pursue leadership roles in clinical pharmacy,
    often in hospital and patient care settings. Like the ASHP program, this certificate
    program includes a focus on pharmacy, but unlike the ASHP, the ACCP provides a
    credential that helps individuals develop their leadership interests and their
    commitment to personal development of leadership skills.


    The AACP offers the Academic Fellowship Program, a yearly commitment develops
    leaders in pharmacy education (http://www.aacp.org). Fellows receive institutional
    support with an endorsement from the dean of their program. The focus of the following
    fellowship is for general leadership skills and those of special interest to individuals
    in higher education. Not every individual becomes a college dean or university
    president, many of these individuals have leadership roles, including roles in
    public health.


    The APhA has a program designed for pharmacy students who are chapter officers
    in the Academy of Student Pharmacists (APHa-ASP). The APhA-ASP Summer Leadership
    Institute develops leadership skills with a primary focus in advocacy for the
    profession. The APhA has additional programs and academies that would be of interest
    to pharmacists or students who want to pursue leadership roles at the national
    level.


    In addition to national professional organizations colleges and schools of pharmacy
    and private corporations have their own programs that develop leadership skills
    relevant to public health. Outside of the field of pharmacy, universities and
    other organizations offer leadership development programs as well, in areas such
    as health care systems management or not-for-profit organizational leadership.
    In this case, the individual should consider matching personal goals and interests
    with those of the program or degree.


    Turning directly to built pharmacy and APhA, one of the most exciting leadership
    opportunities exists within the Special Primary Interest Group (SPIG) in Pharmacy.
    This group of pharmacy-oriented individuals (not all pharmacists) has generated
    enough interest to develop a member section in the future within the APhA. Sections
    represent different groups within public health and are one of the ways that the
    APhA organizes its members to'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Education Training


    promote public health issues (www.apha.org). Having an official pharmacy section
    raises awareness of pharmacy issues and promotes pharmacy as an integral part
    of the health care team. While pharmacists have been involved in other sections
    of the APHA for decades (the Medical Care section is one good example), now is
    an ideal time to develop leadership skills in areas directly linked to public
    health. The APHA also plays a major role in health care advocacy, taking a leadership
    and advocacy position in health promotion and disease prevention initiatives.
    The APHA also offers internships (unpaid) for students interested in learning
    more about public health.


    While there are more formal ways of building leadership skills, many pharmacists
    have taken the "informal" way and simply working in public health areas, trying
    to improve the health of their communities. The 2016 APHA meeting, Project IMPACT
    Immunizations: Improving America''s Communities Together was presented, piloted
    in the state of Washington, by the Apha foundation and involving a community pharmacy
    owner; Kirk Heinz, who was able to improve the health of rural areas by providing
    vaccinations and working in cooperation with pharmacy health providers. Leading
    change does not always require a special degree if one has a will to succeed and
    help others.


    As another example, one of the authors of this chapter (Dr. Garcia) has been able
    to work as a public health pharmacist without working in a department of health
    or a government entity. She is the Member-At-Large for her state''s public health
    association and has as a Member of Directors for three years. She supports collaborations
    with clinicians when discussing priority issues at the state level of this organization.
    She works to support education and training programs and to recruit others to
    join public health organization efforts despite the fact they do not use an MPH
    or work in a formally recognized "public health capacity."


    # Implications for Public Health and Pharmacy Practice


    The emerging importance of public health in pharmacy has many implications for
    pharmacists, both already in practice and those who will enter practice in the
    future. The advances in education and training related to public health in pharmacy
    are indicative of the skills pharmacists will need to approach complex public
    health issues in changing environments. Shifts have occurred already through the
    integration of public health-focused programs, such as immunization training in
    pharmacy schools and immunization delivery in community pharmacies. Although many
    other roles of the pharmacist, particularly in the community pharmacy setting,
    remain tied to dispensing, model is changing. Technology and automation are increasingly
    integrated into'
