    # Health Behavior


    Health behavior can be defined as "the activity undertaken by individuals for
    the purpose of maintaining or enhancing their health, preventing health problems,
    or achieving a positive body image" (Cockerham, 2004, p. 94). This definition
    can include people with no identified disease and those who are positive steps
    that may include diet and exercise. Another definition of health behavior includes
    more of an attitude component: "personal attributes such as beliefs, expectations,
    motives, values, perceptions, and other cognitive elements; personality characteristics,
    including affective and emotional states and traits; and overt behaviors, actions,
    and habits that relate to health maintenance, to health restoration, and to health
    improvement" (Gochman, 1982, p. 169).


    For pharmacists working in the field of public health, an expanded categorization
    of health behavior may be more applicable: preventive health behavior, illness
    behavior, and sick-role behavior (Kasel & Cobb, 1966a, 1966b). A healthy individual
    engages in preventive behavior when he or she is in activity for the purpose of
    preventing or detecting illness in an asymptomatic state (Kasel & Cobb, 1966b).
    An ill individuals in illness behavior when he or she is in activity to first
    define the state of health and to discover a suitable remedy (Kasel & Cobb, 1966b).
    Ill individuals also engage in sick-role behavior when he or she is in activities
    with the intent of getting well (Kasel & Cobb, 1966a). Kasel & Cobb''s definitions
    support O''Neill''s updated definition by the American Journal of Health Promotion:


    Health Promotion is the art and science of helping people discover the synergies
    between their core passions and optimal health, enhancing their motivation to
    strive for optimal health, and supporting them in changing their lifestyle to
    move toward a state of optimal health. Optimal health is a dynamic balance of
    physical, emotional, social, spiritual, and intellectual health. Lifestyle change
    can be facilitated through a combination of learning experiences that enhance
    awareness, increase motivation, and build skills and, most important, through
    the creation of opportunities that provide access to environments that make positive
    health practices the easiest choice. (O''Neill, 2009, pp. iv-v)'
