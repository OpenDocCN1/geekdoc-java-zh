  md: '# Emergency Preparedness


    Typical reactions include fear of another attack or exposure, grief over the loss
    of others, confusion and disorientation in the immediate aftermath, and depression
    as a reaction to the devastation or loss. Hence current thinking on disaster preparedness
    uses a sociological framework that addresses housing stability, economic stability,
    physical health, mental health, and social role adaptation (Abramson, Stehlings-Ariza,
    Park, Walsh & Cul, 2010). Therefore, when planning a pharmacy response to a disaster;
    pharmacists need to address the psychological needs, somatic needs, and basic
    survival of the affected population to increase community resilience and pharmacist
    response (Arya, Medina, Scatcia, Mathew, Starr; 2016).


    # Key Components of the Emergency Preparedness and Response System


    The Robert T. Stafford Disaster Relief and Emergency Assistant Act (42 U.S.C.
    §§ 5121-5401) allows the president to formally declare a region or area as an
    emergency or disaster. The Act requires the governor of an affected state or territory
    to ask the president to make a formal declaration. Once an emergency or disaster
    is declared, local, state, and federal agencies (private and public) work together
    to respond quickly. However, emergency powers, responders, and resources vary
    widely across levels and locations. At the national level, the National Preparedness
    System describes how the federal government organizes and responds to natural
    disasters, terrorist attacks, and other catastrophic events as provides guidance
    for community preparedness.


    # The National Preparedness System and Goal


    Presidential Policy Directive 8: National Prepared calls for national preparedness
    to be based on capabilities aimed at "strengthening the security and resilience
    of the United States through systematic preparation for the threats that pose
    the greatest risk to the security of the Nation, including terrorism, cyberattacks,
    pandemics and catastrophic natural disasters" (Obama, 2011). A national preparedness
    goal and a national preparedness system allows the United States to track and
    improve capability to prevent, mitigate the effects of, respond to, and recover
    from such. Further; all stakeholders (e.g., individuals; families; communities;
    the private and nonprofit sectors; faith-based organizations; and local, state,
    tribal, territorial, and federal governments) are engaged in planning, preparedness,
    and response (U.S. Department of Homeland Security [USDS], 2016).


    The National Preparedness Goal defines three keys, frameworks, and 32 capabilities
    needed for the US response to emergencies and disasters. The themes are (a) Engaged
    Partnership with the Whole Community; (b) Scale, Flexibility, and Adaptability
    in Implementation; and (c) Integration across frameworks (USDHS, 2015). The National
    Preparedness System describes the processes used'
