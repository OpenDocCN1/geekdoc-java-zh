    To examine how well the nation is achieving these goals requires measurement.
    The Healthy People 2020 health measures examine general health status, health-related
    quality of life and well-being, determinants of health, and disparities. Measures
    of general health status include Life Expectancy (with international comparison),
    Life Expectancy, Years of Potential Life (with international comparison). Physically
    and Mentally Unhealthy Days, Self-Assessed Health Status, Limitation of Activity,
    and Chronic Disease Prevalence. Health related quality of life and well-being
    measures include Patient Reported Outcomes Measurement Information System, Global
    Health Measure (Hays, Bjorner, Revicki, Spritzer, & Cella, 2009), well-being measures,
    and participation measures (USDHHS).


    Determinants of health measures emphasize an ecological approach to disease prevention
    and health promotion with both individual-level and population-level determinants
