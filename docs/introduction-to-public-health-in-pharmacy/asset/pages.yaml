    # Electronic Records, Electronic Health Records, and Personal Health Records


    Electronic medical records (EMRs) are electronic records of health information
    on an individual that can be created, gathered, managed, and consulted by authorized
    clinicians and staff within one health care organization (National Alliance for
    Health Information Technology, 2008). EMRs are not synonymous with EHRs, which
    aggregate all of the data generated by individual EMRs. Personal health records
    (PHRs) contain the same type of information as EHRs, such as diagnoses, medications,
    immunizations, family medical histories,'
