    Public health practice has three core functions: (a) the identification or assessment
    of public health problems; (b) policy development (education, partnerships, and
    regulation); and (c) provision of necessary services (enforcement, linkages, workforce,
    evaluation, and research). We suggest the essential component in each of the three
    public health core functions is the availability and quality of data and information
    to create an accurate and complete body of knowledge. However, data comes in many
    formats–textual, visual, geospatial, and numeric–levels, including primary or
    secondary data. Textual data are reports, best practice guidelines, and state
    or federal regulations. Visual data may be excerpts of larger numeric or geospatial
    datasets. Geospatial and numeric data form for statistical analysis.


    Given the amount and types of data collected by public and private organizations,
    as well as by local, city, county, state, and national agencies, for various purposes,
    information systems remain disparate in structure and function. Here there is
    a significant need to develop high-quality data standards that provide the basis
    for uniform, comparable, and good-quality information on populations, disorders,
    and services that address the dual needs of pharmacy and public health.


    # International Perspective: WHO


    At an international level, the World Health Organization (WHO) Programme for International
