    To illustrate the value of review articles, an evidence-based review by Marlucum,
    Hanlon, and Murray (2017) is helpful. They looked at RCTs with the goal of determining
    if interventions improve modification adherence also improved health outcomes.
    They looked at articles using older individuals in searches of three databases,
    including MEDLINE. They found 13 studies, which were listed in their references
    and could be reviewed by a researcher, which would be especially useful if one
    of the projects or interventions was similar to the one that others wanted to
    implement. They concluded that patient-centered and multidisciplinary interventions
    were worthy of further to to determine the degree of impact on health outcomes.


    For public health professionals working on similar problems, this work would be
    invaluable to support patient-centered and multidisciplinary approaches. Further,
    the study designs could help in the development of similar interventions because
    they would provide evidence of successful implementations.


    Brownson et al. (1999) provide a very useful framework for applying evidence-based
    decision-making to public health. As in many problem-solving models, the first
    stage is the development of a statement of the issue. While this stage is straightforward,
    one of the common mistakes in problem-solving is to inaccurately define the problem
    at the start. Stage 2 is to assess the scientific literature to determine what
    is already known (the EBM guidelines will help assess the strength of the individual
    articles). Stage 3 looks for descriptive studies and data that would complement
    the first two stages: factors like age and gender may already be available, but
    data collection may also be important in this. Stage 4 involves the development
    of program or policy options; what might work based on the evidence, and what
    choices might need to be made. Stage 5 is the development of an action plan, including
    objectives that linked to outcomes and will be measured in the plan. Stage 6 is
    the evaluation of the program. This stage should include the dissemination of
    the information in some way so that others can benefit from the efforts and results
    of the project. In addition, lessons learned can be used to adjust the next iteration
    of the program to increase effectiveness in the future.


    To facilitate connections between public health and health care providers, all
    groups benefit from common communications and thought processes. With the continued
