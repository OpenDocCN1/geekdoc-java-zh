  md: '# Cultural Perspectives in Public Health


    +   • learning constantly about other cultures; and

    • appreciating the differences among cultures.


    From this list of essential cores, we can determine which values and behaviors
    are most relevant to create culturally competent organizational policies and processes
    that can be embodied within standards and guidelines. Such standards, by definition,
    would employ broader definitions of culture that go beyond traditional frames
    of race, ethnicity, health, and services provision and settings. This is reflected
    by the following recommendations of the National Center for Cultural Competence
    (2016, para. 3). For an organization to achieve cultural competence, it must.


    +   • have a defined set of values and principles and demonstrate behaviors, attitudes,
    policies, and structures that enable them to work effectively cross-culturally;

    • have the capacity to (1) value diversity, (2) conduct self-assessment, (3) manage
    dynamics of difference, (4) acquire and institutionalize cultural knowledge, and
    (5) adapt to diversity and the cultural contexts of the communities they serve;
    [and]

    • incorporate the above in all aspects of policymaking, administration, practice,
    and service delivery to systematically consumers, stakeholders, and communities.


    # The CLAS Standards


    Since their release by the Office of Minority Health (OMH) in 1999, the National
    Standards for Cultural and Linguistically Appropriate Services (CLAS Standards)
    have been the foundation of health and health care organizations'' efforts to
    improve health equity, reduce disparities, and improve quality of care (OMH, 1999,
    2001). In the introduction to the CLAS Standards, the OMH emphasizes the relationship
    between health and the social determinants of health, that “those conditions in
    which individuals are born, grow, live and age” (WHO, 2016), such as socioeconomic
    status, education level, and the availability of health services.


