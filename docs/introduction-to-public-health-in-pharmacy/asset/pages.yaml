    individual''s body functions and systems, and what an individual is able to do
    in his or

    er usual environment (level of performance), then we can design options

    to optimize their functional capacity and performance. It can also inform

    how we develop and implement interventions to improve the quality of

    lives of people with behavioral disorders and how we can assess their

    effectiveness and efficacy in improving patient outcomes.


    # Service Delivery Challenges


    Based upon the challenges identified by NIMH (Collins et al.,

    2011), we define global mental health services research as collaborative,

    interdisciplinary approaches to examining transnational problems that

    have relevance to many nations or may have determinants or

    solutions that work across national borders to reduce disease burden and

    increase equity. Within the framework of "how mental health

    services research finds be used most effectively to influence the

    delivery of services," we can begin to examine challenges for both public

    behavioral health and public health pharmacy.


    # Formularies


    As managed care has continued to evolve and with the passage of the

    Patient Protection and Affordable Care Act in the United States,

    medication coverage remains a major focus in the provision of behavioral

    health and in public health pharmacy services. Strategies include

    pharmaceutical benefit finders and tiered formularies. Which drugs will

    in included in formularies. Tiered formularies, increasingly used by private

    urers negotiating pricing with pharmacies or which includes

    surers, prefer to use generic and nonpreferred brand names.

    Nonpreferred brand names require special authorization for use and are

    used only when a patient fails to improve on a less costly medication

    before a more expensive medication will be approved. With the results of

    Clinical Antipsychotic Trials of Effectiveness study

    compararing typical and atypical antipsychotic medication (Covell, Prentice,

    & Stockock, 2008) and Medicare D coverage (Centers for

    Medicare & Medicaid Services, 2015), newer managed care strategies

    create formularies that reviewing practices that do not meet

    current best practices or algorithms (Moore et al., 2007).


    The Mental Health Pharmacy Partnership program in Missouri,

    for example, chose practice guidelines of the American Psychiatric

    Association, the Expert Consensus Guidelines, and the Texas

    Medication Algorithm Project and sent informational mailings to

    prescribers in the system about problematic prescribing patterns (Parks,

    2006).


    Medications used for behavioral disorders have traditionally been costly

    and subject to formulary restrictions within insurance programs, both

    private and public payers. Formularies are developed using'
