  md: '# Pharmacists’ Roles in the Increase of Health Literacy

    Among Patients


    +   * A new language is spoken, using many acronyms, at a faster pace than is
    reasonably listenable;

    * Tests are performed, sometimes using weird, cold probes, with minimal explanation
    to why;

    * Numbers and measurements are presented that have little to no meaning;

    * Questions are asked that seemingly have no answers;

    * Decisions must be made in a far-to-fast timeframe that could have potentially
    serious ramifications;

    * The Patient’s everyday life has to continue.


    Patients experience any or all of these scenarios as they travel through the US
    health care systems. A patient’s health literacy level determines how many of
    these interferences apply and how harshly they may affect the situation. Now,
    add to these situations disease-induced interference with cognition, multiple
    comorbidities, and/or a low health literacy level, and the potential for nondirection,
    lack of understanding, and negative outcomes becomes very high.


    Low health literacy is a care system problem and requires solutions. It is not
    the patient’s fault for failing to comprehend health information that has been
    given to him or her. All us, no matter how literate, are at risk for interpreting
    health information incorrectly or not understanding at all. This situation is
    especially true if the therapy is so complicated or the diagnosis is an emotionally
    charged one that involves a loved one or oneself (National Institutes of Health,
    2016). It is possible that patients think they have the correct directions but
    may be too ashamed or embarrassed to seek further clarification to confirm their
    understanding.


    Communicating the concepts of risks and benefits in a balanced, clear manner is
    challenging under optimal circumstances. In low health literacy patients, the
    complexity of this situation is significantly exacerbated. The massive volume
    of health information now available on the Internet has made it much harder to
    determine what is evidenced versus pseudo-science, false and misleading advertisements,
    quackery, or gimmickry. These added complexities only increase the vulnerability
    of patients for receiving misinformation and, in fact, decreases their literacy
    level.


    Choosing to be healthy, realizing when and knowing how to seek health care, and
    engaging in preventive measures to stay well require that a patient understands
    and uses health information correctly. This “ability to obtain, process, and understand
    health information needed to make informed health decisions is known as health
    literacy” (Office of Disease Prevention and Health Promotion, 2007, p. 2.5).'
