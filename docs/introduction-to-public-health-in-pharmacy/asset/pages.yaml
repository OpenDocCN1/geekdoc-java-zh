  md: '# Preface


    The pairing of public health and pharmacy is a logical combination since we believe
    these disciplines are inextricably woven together in so many ways and across many
    areas. Combining population health, individual patient health, and community-based
    health perspectives provides a more complete understanding of the public health
    challenges facing community pharmacists and public health practitioners. However,
    we still have ways to go in encouraging individuals with pharmacy degrees to engage
    more fully in public health. We believe that many pharmacists have opportunities
    to integrate public health in their practices that go unrecognized and unused;
    hence a more substantive grounding in public health may make these opportunities
    apparent.


    # Features in this Volume


    This second edition features collaboration by chapter contributors who collectively
    have strong backgrounds in public health and pharmacy. The combined expertise
    of chapter contributors from public health and pharmacy help substantiate the
    relevance and authenticity of the text for students and practitioners. A second
    feature of this edition is the "Implications for Public Health and Pharmacy Practice"
    section, which appears in each chapter of the text. Our chapter contributors describe
    the significance of their chapter to the larger fields of public health and pharmacy.
    The third feature is the global perspective, which is addressed in every chapter.


    In this edition, all chapters are original contributions. While it is difficult
    to include a chapter representing all relevant topics to public health and pharmacy,
    the editors have tried to include a broad spectrum of chapter topics to stimulate
    and increase engagement in public health and pharmacy issues.


    New chapters include on global health, nutrition, health literacy, and evidence-based
    practice. Some chapters retained their original chapter contributors but have
    been substantially revised to address current challenges and concerns. Other chapters
    have new contributors who bring new perspectives and content to the topic. For
    increased consistency from chapter to chapter; the editors participated as chapter
