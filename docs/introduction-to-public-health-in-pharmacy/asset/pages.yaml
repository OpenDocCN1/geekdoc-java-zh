    As with all tests, the most important clinical questions remain the same. If the
    test is positive, what is the chance the patient really has disease? If the test
    is negative, what is the chance the patient does not have the disease? For a fuller
    review of the principles in this section, see Kip and Quilliam (2008) or Weiss
    (2016).


    # Implications for Pharmacists and Pharmacy Practice


    Epidemiology can increase our understanding of at-risk populations, meet selected
    needs for addressing specific disease states or physical/mental/substance use
    disorders, identifies utilization, and potentially drive policy. Data can be a
    valuable source of drug information in epidemiological studies. Hence, a basic
    understanding of the principles and applications of epidemiological vocabulary,
    methods, and theoretical frameworks is essential for the pharmacist. Without a
    working knowledge of epidemiology, it is all too easy to be confused by presentations
    of the pharmacological management of a particular disease state, whether at professional
    conferences, pharmacy and therapeutics committees, or in the media (Kip & Quilliam,
    2008). As decisionmaking becomes more complex, the volume of the medical literature
    expands exponentially, with numerous studies utilizing different levels of evidence
    to make their cases as best practice, changes in policy, and research funding.
    Hence, a working knowledge of epidemiology can provide important information in
    patient care as well as keep one current with the field.


