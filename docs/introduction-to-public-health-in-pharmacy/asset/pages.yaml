    # Implications for Public Health and Pharmacy Practice


    Globally, more healthcare providers (physicians, pharmacists, and hospital systems)
    are being reimbursed in a fundamentally different way. Volume-based health reimbursement
    is being transformed into a value-based reimbursement system, where both costs
    and outcomes associated with patient care will be carefully analyzed. Value-based
    pricing may be one of the methods to control costs in the future, and the CMS
    is considering this approach in 2017. While one can prove value in many ways,
    the drug cost to the insurer is tied to some type of performance that demonstrates
    the value of using the drug. Perhaps the drug has desired outcomes such as a cure
    of disease, or the drug may decrease the number of patients who require hospital
