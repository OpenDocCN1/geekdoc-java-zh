  md: '# Global Health


    From national, regional, and global perspectives, there are a number of recurrent
    themes that affect the public health policy. These include issues surrounding
    standardized and comparable data and adequate capacity for research in health
    and non-related areas (e.g., policy, economics). Without adequate descriptive
    or analytic data, it is difficult to create a unifying public health and/or social
    agenda for identified public health concerns. Further, to build a comprehensive
    research agenda and internal and external partnerships requires a great deal of
    financial and human resources. As the projects noted in this chapter, there are
    a number of models to develop national strategies, policies, and programs to address
    public health concerns.


    We know that infectious and vaccine-preventable diseases among children and adolescents
    remain major challenges in developing nations. If the children survive to adulthood,
    the burden of disease and years lived with a disability increase substantially,
    resulting in significant economic costs to the individual, the public, and the
    nation, hence the need for strong prevention and intervention focus to establish
    and sustain effective public health and medical treatment.


    We are also facing advances in medicine and pharmacy that can radically change
    public health practice. The growing acceptance of herbal and indigenous medicine
    as part of conventional practice is one such example, as are the use of biologic
    drugs and DNA knowledge around the world. The continued focus on the importance
    of community-based pharmacists, especially as part of medical/patient-centered
    homes and prevention/intervention practitioners, is reflected across the global
    literature.


    The fundamental topics of public health have seemingly changed over time but actually
    remain the same. Safe drinking water was problematic in England in the 1800s;
    infectious diseases are still today. Chronic illnesses are on the rise due to
    development and unhealthy behaviors, and local health problems are international
    health problems, such as AIDS, SARS, and H1N1. Trying to figure out what is next
    will take more pages than we have available in this chapter. however public health
    and pharmacy practice are central components of national, regional, and global
