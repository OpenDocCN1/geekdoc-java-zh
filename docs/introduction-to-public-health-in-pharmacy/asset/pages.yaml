  md: '# Public Health and Pharmacy in the United States


    Although many definitions of public health focus on disease prevention and health
    promotion, the preferred definition is by Charles-Edward Amory Winslow, a pioneer
    in public health practice in America. Winslow saw public health as both an art
    and a science that had, as its goals, the development of healthy standard of living
    to maintain or improve the health of society (Winslow, 1920, p. 6–7). Although
    the phrase "public health" has been revisited many times since 1920, Winslow''s
    definition guides all subsequent discussion on what is public health.


    While health is multidisciplinary in its approach to patient care and services
    delivery, its focus is the use of evidence-based practice. The field of public
    health utilizes a multidisciplinary approach in its examination of health problems
    in at-risk populations. Unlike, health has a population-based focus. It draws
    heavily from the areas of biostatistics and epidemiology, environmental and occupational
    health, health policy management, community and family health, and global health.
    Its professionals include nurses, physicians, epidemiologists, statisticians,
    health educators, environmental health specialists, toxicologists, industrial
    hygienists, sanitarians, food and drug inspectors, laboratory technicians, environmental
    scientists, crisis and disaster professionals, veterinarians, economists, social
    scientists, attorneys, nutritionists, social workers, administrators, and many
    other professionals.


    Although pharmacy includes many aspects of patient care (e.g., immunizations,
    adherence, and drug information) as well as more product-related responsibilities
    including the preparation, dispensing, and proper utilization of medications,
    we see pharmacy as a bridge between patient-centered care and public health. Within
    the individual patient and the community in which the patient resides are equally
    important in the practice of pharmacy. In 2014, CVS, a national retail chain,
    the sale of tobacco products to be better aligned with its new name CVS Health,
    giving up roughly $2 billion in sales to reflect health orientation to the retail
    customer (Zliobro, 2014). While tobacco-free products are not new in the United
    States, the public health impact of decreasing the locations where cigarettes
    can be purchased can help decrease the sale of tobacco products to individuals
    and potentially increase the health of the community.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Public Health and Pharmacy in the United States


    While some people think of a pharmacy as a place where medicines, including prescription
    medicines, are sold, the practice of pharmacy continues to shift its focus from
    a product-orientation to a health care orientation. Community pharmacy and hospital
    pharmacy are important components of US health care systems, and clinical pharmacy,
    which can be practiced in the community, the hospital, the nursing home, or some
    other care setting, focuses on efforts to optimize the use of medications for
    the patients using them. Pharmacy, as a source of information to maximize medicine
    benefits, is the key to its future.


    # History of Public Health and Pharmacy


    Public health is not a new concept. Starting with the Greco-Roman conceptualization
    of population health, through the plagues of the Middle Ages and pandemics of
    the modern age, public health has addressed the biological and social determinants
    of disease. Hippocratic texts were among the first to relate environmental factors
    to disease. The Roman emphasis on sanitation and the establishment of public hospitals
    was the start of Western public health systems. Early theories of contagious disease
    and transmission by Girolamo Frascator in 1546 and the discovery of environmental
    and occupational diseases by Bernardino Ramazzini in 1713 contributed to the emerging
    field of public health (Rosen, 1958). Epidemiologic methods, the gathering of
    vital statistics, the use of regional and national health surveys, the association
    between poverty and disease, and the use of sanitary reforms to reduce the spread
    of infectious diseases were all central to the rise of national health systems
    in Europe and the United States (Cassedy, 1969; Chadwick, 1843; Coleman, 1962;
    Rosenberg, 1986). These early years also saw the rise of the profession of pharmacy.


    In the United States, pharmacy was already commonplace. Elizabeth Greenleaf was
    practicing pharmacy in Boston in 1727 (Griffenh, 2002). The first pharmacy in
    colonial America operated from 1729 to 1825 in Philadelphia (1903). The Continental
    Congress created the position of Apothecaries General (Worten, 2028), a position
    that ended after the Revolutionary War. In 1798, the U.S. Congress established
    the U. S. Hospital Service, the predecessor of the current U.S. Health Service.
    In 1871, the post of U.S. Surgeon General was established.


    The Philadelphia College of Pharmacy, established in 1821, marked the beginning
    of the first pharmacy society as well the first school of pharmacy in the United
    States (England & Kramer, 2022). The American Pharmaceutical Association was founded
    on October 6, 1852. Many of today''s pharmacy associations trace their roots back
    to the American National Association of Retail Drugists (1898, now the National
    Community Pharmacy Association); the American Conference on Pharmaceutical Faculties
    (1900, now American Association of Colleges of Pharmacy); and the American Society
    of Hospital Pharmacists (1942, now ASHP).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Public Health and Pharmacy in the United States


    The American College of Clinical Pharmacy (AACP 2008) defined clinical pharmacy
    as both the science and practice of rational medication use and as accountable
    for the optimum use of medication therapy in the prevention and treatment of disease.
    These discussion points from clinical pharmacy are appropriate in all health care
    settings. As an example, medication therapy management would include such services
    as medication therapy, immunizations, pharmacogenomics applications, and medication
    safety, as well as public health pharmacy (American Pharmacists, 2014). The links
    to public health (American Association of Colleges of Pharmacy, 2004) and population
    health (American Association of Colleges of Pharmacy, 2013) have become central
    components of the pharmacy curriculum through the recommendations of the Center
    for the Advancement of Education (American Association of Colleges of Pharmacy,
    2004, 2013).


    In 1872, the American Public Health Association (APHA) was founded (Ravenel, 1921),
    with public health courses offered at the University of Pennsylvania in 1909 (Fee,
    1992), and additional programs offered at the Harvard School of Public Health
    in 1913 (the continuously operating school of public health in the United States).
    Johns Hopkins School of Hygiene and Public Health was established in 1916 (Fee,
    1992). Unlike public health education education systems of Great Britain or Europe,
    public health education in the United States was independent of medical schools
    and state public health services (Ravenel, 1921). Welch and Rose (1915) argued
    the US public health educational system should represent "both the scientific
    and practical aspects of hygiene and public health" and acknowledged the importance
    of the relationship between the modern social welfare and public health movements.


    From early years, the roles of public health and pharmacy have been refined and
    redefined through legislation, societal changes, technology, and health care systems.
    In 1988, the Institute of Medicine''s (IOM) Committee for the Study of the Future
    of Public Health (IOM Committee) closely examined public health programs and the
    coordination of services across US government agencies and within state and local
    health departments (LHDs). The Future of Public Health (IOM, 1988), defined both
    the substance and the mission of public health, rebuilt Windsor''s community-based
    prevention and promotion focus for the larger societal goal of promoting healthy
    neighborhoods and lifestyles.


    Working with the larger public health community, three core functions for public
    health were defined: (a) assessment, (b) policy development, and (c) assurance
    (of providing public health services in the community), and identified which level
    of government (federal, state, and local) would be best suited to handle these
    core functions.


    While pharmacists in the U.S. Public Health Service provided patient care services
    at the National Institutes of Health, the U.S. Food and Drug Administration, and
    the Indian Health Service (IHS):'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Public Health and Pharmacy in the United States


    Church, 1987, 1989), the American pharmaceutical industry was undergoing significant
    changes with the advancement of biotechnology, new product research and development,
    and new pharmacy services to accommodate social and economic changes in patient
    care, drug delivery, and pharmacy management (Dullusio, 1989; Penna, 1987). Pharmaceutical
    education was also in review, as the needs of community and hospital pharmacy
    were recognized (Ozzidis, 1988). What followed were a recommendations in pharmacy,
    including calls to address pharmaceutical science as an academic discipline (Lemberger,
    1988), changes in residency training programs, and the emphasis on the doctor
    of pharmacy (PharmD) as the sole entry-level degree for the doctor of pharmacy
    practitioners (Smith, 1988). The "professionalization" of pharmacy suggested a
    return to its preindustrial origins in "valued, complex, specific, and committed
    public service" (Hepler, 1988, p. 1071), with an emphasis on quality assurance
    in patient care and pharmaceutical services).


    In 1993, work began on again redefining public health within the parameters of
    proposed national health care reforms, such as the Omnibus Budget Reconciliation
    Act of 1990 (OBRA-90; Pub.L.101-508, 104 Stat. 1388) and the proposed American
    Health Security Act of 1993 (H.R. 1200, 103rd Congress). The proposed American
    Health Security Act emphasized extending access to health care, containing health
    care costs, assuring the quality of care, financing reform, and improving the
    health care infrastructure to maintain and improve health and well-being (Committee
    on Assessing Health Care Reform Proposals, 1993). Legislative changes, such as
    the Medicaid rebates of the Omnibus Budget Reconciliation Act of 1990, and the
    Medicare outpatient drug benefit in the proposed Amendment Act would impact pharmacy
    practices. Although OBRA-90 meant to ensure Medicaid patients received specific
    pharmaceutical care, the legislation required the same type of care be rendered
    to all patients, not just Medicaid patients. Pharmacists would now be required
    to provide counseling, meet prospective drug utilization review requirements,
    and engage in record-keeping mandates.


    By 1994, the U.S. Public Health Service Core Public Health Functions Steering
    Committee developed "10 Essential Public Health Services" needed to care out the
    basic health care functions in our community. As seen in Figure 1-1, the essential
    services are iterative and can be easily grouped into the three focal functions:
    (a) assessment, (b) policy development, and (c) assurance.'
