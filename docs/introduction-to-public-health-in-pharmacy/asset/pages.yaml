    Immunization


    The CDC''s Racial and Ethnic Adult Immunization Initiative program was a multicultural
    demonstration project conducted in five sites (Chicago, IL; Rochester, NY; San
    Antonio, TX; Milwaukee, WI; and the Mississippi Delta region) to increase flu
    and vaccination rates for African Americans and Hispanics 65 years of age and
    older (Kicera, Douglas & Guerra, 2005; Morita, 2006). The Mississippi program
    focused on rural and urban African Americans, with the San Antonio program focused
    on Hispanics explored the reasons why people choose to have a flu shot (family
    and health) or avoid immunization (fear of becoming ill) and has looked at the
    realities of providing programming with similar goals to dissimilar target groups
    (Winston, Wortley, & Lees, 2006).


