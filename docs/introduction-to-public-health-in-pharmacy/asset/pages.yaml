    enhancing quality of care, and establishing accountability to meet national goals.


    # Regional Perspectives


    To consider regional perspectives on health, there are a number of ways to conceptualize
    regions. Regions can be geographic (e.g., continents, subcontinental areas, or
    self-declared regions); socioeconomic areas, which may be self- or externally
    defined; administrative areas (e.g., city, county, or agency districts). Each
    of these regions and regional perspectives may affect elements of health that
    a nation surveils, reviews, measures, treats, or regulates.


    Within WHO, there are six regions: (a) Africa, (b) the Americas, (c) Southeast
    Asia, (d) Europe, (e) Eastern Mediterranean, and (f) Western Pacific. Each region
    has a regional office and a website providing information on its countries, programs,
    publications, and data, as well as a media center, events, and resources.


    # Europe


    When we think about administrative regions, the European Union (EU) is immediately
    one center of our attention. The EU has a population of over 500 million inhabitants
    (7.3% of the world population). Essentially a political and economic organization,
    the EU is comprised of 28 member states and governed by the member states and
    seven supranational organizations. These organizations include (a) the European
    Parliament, (b) the European Council, (c) the Council of the European Union, (d)
    the European Commission, (e) the Court of Justice of the European Union, (f) the
    European Central Bank, and (g) the European Court of Auditors. The Parliament
    and the Council, for example, adopt and amend legislative proposals, supervise
    the work of the Commission and other EU bodies, solicit input from other national
    parliaments, and decide on the EU budget.


    However, the EU is not the only region that creates and adopts policies affecting
    public health and pharmacy practice, education, and research. With 53 member states,
    the WHO Europe Region (ER) is also a major player. With its main office in Copenhagen,
    Denmark, in addition to three countries and offices in 29 member states. Like
    the EU, there are early meetings for representatives of member states, which also
    result in regional policy. In addition to the Regional Committee, there is a Standing
    Committee of the Regional Committee (SRC), a subcommittee of the WHO Regional
    Committee for Europe. The SRC is comprised of representatives from 12 countries,
    with each member elected for a three-year term. In addition, there are 290 collaborating
    centers in 34 countries in the WHO europe region; this is over a third (36%) of
    the 800 WHO collaborating globally.'
