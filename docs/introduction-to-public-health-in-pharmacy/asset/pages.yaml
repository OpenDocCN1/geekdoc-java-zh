    SNAP provides funds to purchase food for those demonstrating a financial need.
    For low-income households, there are national eligibility and benefits standards
    (USDA, 2012). Individuals can see if they qualify at their local health department
    each month using an electronic benefit transfer similar to a debit card. SNAP
    recipients are only able to use their benefits at SNAP-approved stores and for
    SNAP-approved foods. Nondible items, such as household goods, hot foods, medicine,
    alcohol, and cigarettes cannot be purchased with SNAP. SNAP is a supplemental
