    # Basic Public Health Principles of Disease Prevention and Health

    Promotion


    Consumer Health Education


    An expert panel convened by the USDHHS describes high-quality health

    information as "accurate, current, valid, intelligible, and free

    of bias" (Eng & Gustaf, 1999, p. 630). Consumer health education can

    be quite complex, with multiple paths to achieving the desired

    information and behavior change. One individual may be very comfortable

    using Internet sources, while another may have difficulty reading

    printed information and have neither the ability nor the interest in searching
    the

    web for health information. Indeed, with limited access to sources

    of information may still very profound needs. This is

    particularly true in those who have multiple (or co-

    occurring) health issues or chronic health issues (Ghazmarian, Williams,

    Peel & Baker; 2003). Groups with lower income levels and lower levels of

    education also present challenges to those seeking to provide health

    education. Nevertheless, to be sure, the need for health education

    includes all socioeconomic levels.


    # Health Literacy


    Health literacy is defined as "the degree to which individuals have the

    capacity to obtain, process, and understand basic health information and

    services needed to make appropriate health decisions" by an Institute of

    Medicine report (Nielsen-Holbom, Panxer, Kindig, & Institute of

    Committee on Health Literacy, 2004). The WHO endorses a

    broader definition that encompasses an individual''s ability to "gain access

    to understand, and use information in ways which promote and maintain

    good health" (Nutebaum & WHO Collaborating Center for Health

    Promotion, 1998). Whenever information is used, health literacy

    incorporates comprehension skills, literacy skills, and numerical skills to

    be able to make health decisions and to decode messages. For

