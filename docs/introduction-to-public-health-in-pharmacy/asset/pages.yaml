  pgno: 196
- img_proc: true
  md: '# Behavioral Health


    those who were already receiving LAI treatment, with convenience of dosing and
    not having to remember antipsychotic doses being the most common positive response.
    Among those not receiving LAIs, lack of awareness, stigma, and misceptions of
    treatment were often cited as reasons for the lack of acceptance of LAI treatment.
    Overall, this study reveals that positive therapeutic alliance with the patient
    and the provision of clear information about the treatment allows for an informed
    discussion and greater positive response to treatment by the patient (Das et al.,
    2014).


    # Barriers to Treatment


    Behavioral health services are provided by a diverse number of systems, facilities,
    and providers, in primary care, specialty care, community-based, and public care
    settings (Hanson, Levin, Ott & Meldrum, 2012). Within primary care, behavioral
    health services are delivered in medical care settings (general hospital emergency
    rooms and psychiatric units in general hospitals), long-term care facilities,
    the Veterans Administration medical care systems, and managed healthcare settings.
    Within the specialty behavioral care sector, behavioral health services are available
    through many systems and settings, including (but not limited to) state/county
    mental hospitals, private psychiatric, community mental health centers, substance
    abuse practitioners. Within the community-based care settings, behavioral health
    is provided at public health centers, places of employment (employee assistance
    programs), places of worship, peer counseling centers, recreation facilities,
    and schools. Within public sector behavioral care sector, behavioral health services
    are available through child welfare, foster care, corrections, juvenile justice,
    schools, court diversion programs, and integrated care. This is by no exhaustive
    list on trajectories into behavioral health services and treatment.


    However, with all the different trajectories into, there are also a number of
    barriers, partially successful treatment often requires an individual to have
    regular access to behavioral health care professionals and a number of support
    services. In addition to the persistent stigma surrounding behavioral disorders,
    there are issues of reimbursement; costs of care, availability based on provider,
    geographic availability, policy limitations, formality restrictions, transportation,
    provider knowledge, patient knowledge, attentitudinal/evaluative barriers, medication
    compliance, family support (or lack of it), inconvenience or inability to obtain
    an appointment, and refusal of treatment.'
  merge: -1
