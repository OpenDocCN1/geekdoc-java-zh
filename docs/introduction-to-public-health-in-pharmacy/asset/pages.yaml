    # Definitions


    A person’s ability to listen, read, analyze, and apply pharmacy directions

    or other health literacy requires specific analytical and conceptual

    skills. These efficiencies, which collectively are referred to as health

    literacy, are “defined as the understanding and application of words

    (prose), numbers (numeracy), and forms (documents)” (Pfizer, 2011, p. 4).

    The WHO defines health literacy as “the cognitive and social skills which

    determ the motivation and ability of individuals to gain access to,

    understand and use information in ways which promote and maintain

    good health” (Netbeam & WHO Collaborating Centre for Health

    Promotion, 1998, p. 10). Healthy People 2010 defined health literacy as

    “The degree to which individuals have the capacity to obtain, process and

    understand basic health information and services needed to make

    appropriate health decisions” (Office of Prevention and Health

    Promotion, 2000).


    Health literacy goes beyond the mere skills of reading,

    writing, processing, and communicating vertically. It also

    includes a complex set of aptitudes that translate into the ability to

    access, understand, process, and act upon health information. Being

    health literacy means being able to interpret instructions on prescription

    drug bottles and deliver the correct amount of medication at the correct

    time for the correct duration. In some cases, a dose must be calculated

    (e.g., for a child’s over-the-counter product) or the correct dose must be

    measured (for liquid medications): these tasks are complex. In addition,

    patients must decode appointments slips, health brochures,

    do’s directions, and consent forms, as well as navigate through and

    egotiate around complex health care systems (National Network of

    Libraries of Medicine, n.d.).


    Furthermore, these capabilities could translate into the ability to

    adocate for personal health and the health of others in the community

    (Freeman et al., 2009). Health literacy has little relationship to a

    student’s education level or general reading ability. A person may function

    adquately at work or home and still have marginal or inadequate literacy

    in a health environment. Several other definitions also exist; the fact

    there are a number of different health literacy definitions demonstrates

    the field is evolving.


