    Again, the pharmacist should consider extending the counseling session by either
    scheduling a later time to provide more information than just the basics or by
    using technology to be in contact with the patient.


    Use Metaphors and Analogies to Make Information Out Relatable


    Certainly, pharmacists want the patient to get the most out of his or her counseling
    session. If a patient can relate the provided information, it is more likely the
    patient can make usable in his or her care. The use of metaphors and analogies
    helps patients to compare their new knowledge with familiar topics and concepts.
    For example, comparing human vasculature to a common garden hose assist the patient
    in understanding blood flow and how it can be impacted.


    Use Pictographs, Objects, Models, and for Demonstrations


    Employing the use of pictographs, objects, models, and patient demonstration can
    assist the patient in understanding and processing health information. A pictogram
    (“pictograph”) is a symbol that a picture that represents an object or concept
    (e.g., a triangular sign meaning “yield to oncoming traffic”; Merriam-Webster,
    2016). They are common in everyday life.


