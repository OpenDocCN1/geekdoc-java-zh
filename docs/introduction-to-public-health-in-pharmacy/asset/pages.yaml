    # Implications for Public Health and Pharmacy Practice


    There are a number of challenges when we examine public health informatics, as
    integrating surveillance systems, improving data mining, enhancing online analytical
    processing, standardized public health vocabulary and classification systems,
    addressing emerging automated coding systems and legacy systems, and workforce
    development. These are in addition to other technological solutions in the workday
    of a pharmacist.


    Accurate transmission, encryption, reception, and storage of client information
    and public health data are critical to ensure appropriate treatment decisions.
    However, existing legislation and professional rules of conduct hinder implementation
    of informatics projects and programs. As legislation “catch up” with the advances
    in technology, there is great uncertainty about the application of existing legislation
    to HIT and health information exchange, what actions constitute statutory violations,
    or what actions create litigation. There is no easy solution, as shown by the
    number of case decisions'
