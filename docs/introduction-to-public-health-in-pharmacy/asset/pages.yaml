    be unreliable, and drug claims for success can be exaggerated or ignored dangerous
    side effects. In this perspective, the capability of an individual in a developing
    country who is purchasing medication on a tablet by tablet to make a careful analysis
    of the product that being sold is minimal and the potential for abuse of this
    market is great.


