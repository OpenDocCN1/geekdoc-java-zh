    # Implications for Public Health and Pharmacy Practice


    Much in EBM, which combines individual clinical experience with the best clinical
    evidence, those working in public health will benefit from a similar combination
    of experience and evidence. While some of the data may differ in methods of collection,
    data analysis, and focus, the process can lead to better health outcomes. Rather
    than making decisions about individual patients, EPPH is concerned with programs
    and policies that impact groups of people and populations.


    Finding the best available evidence, public health, as described in the EBM sections,
    is similar in EPPH. In public health, review articles of the relevant scientific
    literature would be one of the most objective bodies of evidence scientific literature
