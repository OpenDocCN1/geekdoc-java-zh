    # History of Public Health Training in Pharmacy

    Education


    The first mention of public health in the pharmacy curriculum was

    1932 in the fourth edition of The Pharmaceutical Syllabus, a work used by

    the American Council on Pharmaceutical Education (ACPE) to guide

    accreditation decisions (Gibson, 1972). While the health literature

    recognized the unique position held by pharmacists to interact with the

    community, public health was not emphasized in curricular requirements

    in the United States until the inception of the Healthy People program in

    1999 (Babb & Babb, 2003; Calis et al.; 2004; Lenz, Monaghan, &

    Hetterman, 2007). More recently, the Association for Prevention Training

    and Research formed the interprofessional Healthy People Curriculum

    Task Force (2015) to ensure that core competencies were included in

    each of the health professions training curricula that would prepare

    future health professionals to understand the principles of population'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Education and Training


    health and generally improve health outcomes at the individual, clinical, and
    community levels.


    This growing focus on training pharmacists in public health has influenced each
    iteration of the Center for the Advancement of Pharmaceutical Education (CAPE)
    Outcomes produced by the American Association of Colleges of Pharmacy (AACP).
    Each CAPE Educational Outcome since 1998 has included recommendations regarding
    population-based health improvement, wellness, and disease prevention (AACP; 1998,
    2004, 2013). As a result, the ACPE now requires that schools and colleges conferring
    a doctor of pharmacy (PharmD) degree not only inform candidates about public health
    programs but also provide opportunities to participate in health focused skills,
    such as immunization delivery (ACPE, 2015).


    # Training and Certification in Public Health


    Formal and informal certification and training are available in public health
    throughout the field of pharmacy. Opportunities to gain public health knowledge
    and skills are available at all levels within the pharmacy profession, from pharmacy
    technician certification to doctoral and postgraduate studies.


    # Pharmacy Technician


    The first level of formal certification available in the field of pharmacy in
    the United States is that of pharmacy technician. While some states require a
    high school diploma and on-the-job training, most states require certification
    through completing a postsecondary degree program, passing an exam, or both (Anderson,
    Draeme & Anderson, 2016); Bureau of Labor Statistics, The American Society of
    Health-System Pharmacists (ASHP) has developed public health objectives for pharmacy
    technician training that include a grasp of the concepts of promotion and prevention,
    such as health screenings and substance abuse, as well as an understanding of
    the circumstances that influence health (ASHP, 2015).


    # Doctor of Pharmacy


    The required entry-level degree for a pharmacist is a PharmD. This program requires
    four years of education (although this may be compressed into three calendar years)
    and, while PharmD candidates enter the program with an average of three years
    of postsecondary education, students able to meet the program prerequisites may
    enter with just a high school diploma. The National Association of Boards of Pharmacy
    (NABP) requires candidates to have a PharmD from an ACPE-accredited institution
    represents a change from the previous requirements for a five-year bachelor''s
    degree in pharmacy after the NABP deemed more hands-on clinical experience was
    necessary. Both the NAPLEX and the Multistate'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Education Training


    Pharmacy Jurisprudence Examination, in addition to state-specific requirements,
    such as completing a set number of hours of internship under a licensed pharmacist,
    are required prerequisites to state licensure to practice pharmacy in state (Bureau
    of Labor Statistics, 2015a). Pharmacists must renew their license at regular intervals
    as determined by the state issuing license.


    Students pursuing a PharmD expect to encounter public health throughout the didactic
    and experiential portions of their degree. ACPE (2015) requires the curriculum
    to include “exploration of population health management strategies, national and
    community-based public health programs, and implementation of activities that
    advance public health and wellness, as well as an avenue through which student
    earns in immunization delivery and other public health-focused skills” (p. 23).


    The latest ACPE 2016 standards incorporates an additional obligation for institutions
    to administer the NABP’s Pharmacy Curriculum Outcomes Assessment® (PCOA®) to assess
    proficiency as they complete the didactic portion of their education and prepare
    to begin the phase of Advanced Pharmacy Practice Experiences (ACPE, 2015). The
    social/behavioral/administration sections (3.0) of the PCOA represents 22% of
    the exam and measures students’ understanding of public health and wellness, specifically
    in the areas of promoting health, preventing chronic and infectious disease, and
    recognizing the various factors that affect public health and individual medical
    care (NAPB, 2016a). This section also measures student comprehension of how health
    is delivered in the United States as compared to other industrialized countries.


    The 2015 NABP survey of US schools and colleges of pharmacy ranked student competencies
    in order of importance to the overall curriculum based on the number of contact
    or credit hours, which is in the basis of how the test is attempted (NAPB, 2016b).
    Schools ranked “health care delivery systems and public health” 11th out of 30
    areas of competencies. “Disease prevention and population health” and “population-based
    care and pharmacoepidemiology” ranked in the bottom 21st and 26th place, respectively.


    While the ACPE requires institutions to ensure that students achieve competencies
    in public health, the method is left up to the institution. Schools may achieve
    this through a stand-alone course on public health, or to integrate public health
    topics into other courses as appropriate (Naughton, Friener, Scott, Miller, &
    Albano, 2010). Topics most cited in the literature were motivational interviewing,
    behavior modification, particularly with regard to smoking cessation, and educational
    strategies for prevention and management of chronic diseases (Woodard, McKinnon,
    Danielson, Knuth, & Odegard, 2016).'
