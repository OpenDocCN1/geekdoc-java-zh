    # Start Sessions with a Verb


    During the counseling sessions, pharmacists should start their sentences with
    a verb. This tactic helps the patient put recommendations into action. While using
    this technique, pharmacists must take special care not to be overly demanding
    while providing instruction. However, “Apply this medication to the wound five
    times per day” is more effective than “This medication should be applied to the
    wound five times per day.” Action works upfront reminds patients they must do
    their part in caring for wound.


    # Consider Environment and Distractions


    During the counseling session, care must be taken to ensure that counseling is
    performed in a place that lends itself to privacy, comfort and minimal disruptions.
    Seldom do patients want their issues known to those around them. Pharmacists and
    the pharmacy staff need to be cognizant of the potential of “listening ears” especially
    in smaller community settings where there may be more customer camaraderie. Ensuring
    a private environment removes at least one worry from the pharmacist-patient encounter.
    Patients can feel free to express their concerns and hear the instructions from
    the pharmacist more clearly.


    Sometimes there can be other distractions that can impede the pharmacist-patient
    interaction. Care must must be taken to ensure that the counseling is performed
    at a time when the patient is able to focus on the health information. This strategy
    is more important for low health literacy patients. If a person has just been
    given a difficult or complex diagnosis, it may not be the optimal time to provide
    medication information. When the pharmacist perceives this, scheduling a discussion
    after the patient has an opportunity to process his or her news would be more
    effective. If the pharmacist proceeds when the patient is distracted by emotional
    overwhelm, it is likely the patient will not hear what is said during the conversation.
    In these circumstances, patients are usually perceiving the perceived changes
    that will have to occur in their life and how it will affect their families. Additionally,
    feeling anxiety of the unknown and the perception of loss of personal control
    are factors that are present when facing such diagnoses.'
