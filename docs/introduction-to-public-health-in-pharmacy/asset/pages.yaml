    European Pharmacy Practice and Education from a Public Health Perspective


    Many European countries follow a universal health care model. As to be expected,
    there are differences in models of services delivery, payers, prescription coverage,
    quality of care, and assessment. The United Kingdom has a centralized National
    Health Service (Boyle, 2011). The Netherlands have a federal social health insurance
    system (Ferre et al., 2010). Other countries, like Switzerland, have a compulsory
    health care model by which all citizens must purchase basic private health insurance
    (Busato, Matter, Kunzi, & Goodman, 2012). Hence, depending on the plan of a country
    may have, and/or the extent of private insurance, there may be significant differences
    in pharmacy practices.


    Regulations affecting pharmacy practice also affect pharmacy education, as each
    country has its own standards for credentialing and graduates of professional
    schools. The Bologna Declaration of 1999 was the start of the European Higher
    Education Area, which now encompasses 47 countries (European Commission, Audiovisual
    and Culture Executive Agency, & Eurydice, 2015). Now known as the Bologna Process,
    the Declaration created a transparent system of comparable degrees and system
    of credits that promote employability of European citizens; ensure quality of
    education across national borders; and promote curricular development, interinstitutional
    co-operation, and integrated academic/research programs (European Commission et.,
    2015).


