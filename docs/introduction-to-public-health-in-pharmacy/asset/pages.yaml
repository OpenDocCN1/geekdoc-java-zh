  md: '# Financing and Insurance


    Public sources pay for most of the health care in these and other developed countries,
    ranging from 70% and depending on the country. Americans, however rely on a mixture
    of public and private health insurance coverage to pay for the bulk of the health
    care services they receive. In 2015, the federal government accounted for the
    largest share of health care spending (29%), followed by households (28%), private
    businesses (20%) and state and local governments (17%) (CMS, 2016b). Four programs,
    Medicare, Medicaid, the Children''s Health Insurance Program (CHIP), and the Affordable
    Care Act (ACA) marketplace subsidies accounted for 25% or $938 billion (Center
    on Budget and Policy Priorities, 2016). Out-of-pocket spending by patients and
    families was 11%, and approximately $338 billion.


    # The Uninsured


    Unlike developed nations, the United States does not provide universal health
    care to all of its citizens. Although the federal Medicare program provides some
    level of coverage for adults 65 years of age and over, Americans under the age
    of 65 do not have guaranteed health care coverage. Approximately 55% of persons
    younger than 65 were covered by private health plans in 2013 (Agency for Healthcare
    Research and Quality, 2017). The passage of the ACA-extended Medicaid coverage
    to many low-income individuals in states with incomes or below 138% of the federal
    poverty level (FPL) that chose to offer extended Medicaid coverage to 400% of
    the Office of the Assistant Secretary for Planning and Evaluation (2017). Since
    the ACA-extended Medicaid provisions went into in 2014 (with a few states expanding
    earlier), the number of uninsured Americans now stands at 28.5 million, a decrease
    of nearly 7.4 million individuals (Colen, Martinez, & Zammitt 2016)


    Many of the remaining 28 million uninsured adults live in states that did not
    expand Medicaid. Many of the uninsured are very poor. An estimated 39% of uninsured
    adults have incomes below the FPL. This is twice the rate of their overall representation
    in the adult population (Collins, Duffy, & Beutel, 2016). Further, not all workers
    afford to pay the premiums or are eligible for the major public insurance programs.
    Other uninsured individuals are young and relatively healthy and do not enroll
    in health insurance coverage when offered.


    The most common reason for being uninsured is that it is too expensive to carry
    health insurance (Collins et al., 2016). From 2006 to 2016, not only did total
    premiums for family coverage increase by 58%, but the worker''s share increased
    by 78%, outpacing wage growth (Henry J. Kaiser Family Foundation, 2016). Of uninsured
    adults who are aware of the marketplaces or have tried to enroll for coverage,
    affordability concerns are the major reason for not signing up. The uninsured
    pay for health care out of their own pockets or rely upon the'
