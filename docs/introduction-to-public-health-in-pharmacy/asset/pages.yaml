    # Standard of care and Clinical Practice Guidelines


    **Standard of care**, a complex concept that has evolved over time, is currently
    defined as "that which a minimally competent physician in the same field would
    under similar circumstances" (Moffett & Moore, 2011, p. 111). The decision of
    Hall v. Hilbun (1985), cited by Moffett and Moore (2011), among others, held physicians
    accountable to a COMPET-based national standard of care and a limited role of
    local custom. In brief, that means national standards are used to judge a doctor''s
    duty of care to a patient, with respect to cognizrance of what facilities are
    available locally. This is an important distinction when we look at the ongoing
    development of evidence-based care. We can understand the standard of care more
    fully by examining the development of clinical practice guidelines that describe
    how to diagnosis and treat a particular disease state or disorder.


    In 1990, the Institute of Medicine (IOM) defined clinical practice guidelines
    as "systematically developed to assist practitioner and patient decisions about
    appropriate health care for specific circumstances" (Field, Loh & Committee to
    Advice the Public Health Service on Clinical Practice Guidelines, 1990). Twenty
    years later, the recommendations intended to optimize patient care that are informed
    by a systematic review of evidence and the benefit and harms of alternative care
    options (Graham, Mercer, Wolman, Greenfield & Steinberg, 2011). This was a major
    reworking, of the 1990 IOM definition to distinguish the differences between a
    clinical practice guideline and other expert or evidentiary texts, such as consensus
    statements, expert bodies, and other types of appropriate criteria.


    Examples of clinical practice guidelines are available from many agencies and
    professional associations across the world. The World Health Organization (WHO:
    2014, 2017) has a protocol for the development of global clinical practice guidelines
    that incorporates equity, human rights, gender, and social determinants.


