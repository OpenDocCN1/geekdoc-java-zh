    intergovernmental, multilateral, bilateral, and regional agencies and networks
    who provide significant support to implement multisectoral actions to achieve
    public health outcomes in all national, regional, or global politics. It promises
    to be an exciting time, from policy and practice perspectives, to be involved
    in strengthening the interactions between public health and pharmacy.


