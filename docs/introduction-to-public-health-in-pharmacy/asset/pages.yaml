    the ACA, there were numerous expectations on how the ACA would affect insurance
    providers, uninsured populations, and state bureaucracies.


    The institutional design of the ACA''s regulatory reforms of the insurance market
    equally effected coverage and delivery of services as it has its opportunities
    for Medicaid expansions at the state level. However, due to the complex federal-state
    design of the law, governing authority did not reside within HHS. Instead, governing
    authority went to a number of players, including state governors, legislators,
    and regulatory agencies, all of whom had to collaborate with HHS to negotiate
    the rules for the new system by state. The inability of HHS to promulgate homogenous
    admission rules and routines to the states (National Association of Insurance
    Commissioners (NAIC), 2011) led to difficulties in implementation and confusion
    in the public''s understanding of the ACA.


    The creation of the new health insurance exchanges (HIEs), for example, which
    permits individuals to buy quality health coverage at low costs, was an expectation
    of the ACA, not a requirement. Three requirements of the federal HIEs are (a)
    to be a state-established governmental agency or nonprofit entity, (b) to consult
    with stakeholders in carrying out required HIE activities, and (c) to be financially
    self-sustaining (ACA, § 1311(d)). Existing state insurance exchanges could serve
    as models for the federal HIEs. The NAIC (2011) identified Massachusetts and Utah
    as good models for a state-established governmental agency (i.e., quasi-governmental
    agency or independent public entity); however, it was unable to identify any existing
    for "a nonprofit entity that is established by a State" (NAIC, 2011, p. 2). The
    NAIC advised to carefully consider upon their exchange governance structures,
    considering "the hundreds, if not thousands, of structural and operational issues"
    they will have to address to meet the ACA requirements (NAIC, 2011, p. 5).


    A second example of federal-state complexity is Medicaid expansion, which was
    to decrease the number of uninsured individuals in each state and reduce the variation
