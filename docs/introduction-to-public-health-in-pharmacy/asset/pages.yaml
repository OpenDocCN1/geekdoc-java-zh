    # System Stability


    Rapidly escalating costs threaten the stability of the US health care systems.
    In 2014 and 2015, while growth in GDP averaged 4.0%, health spending increased
    at an average rate of 5.5%. However, three factors contributed to this increase:
    the addition of millions of people who gained insurance coverage after 2013, the
    rapid growth in health prescription drug spending, and posttreatment recovery
    (Martin et al., 2017). Other explanations include increasingly complex payment
    and financial incentives, the aging of the US population, medical malpractice
    liability, societal expectations, and technological innovation (Freedman, 2012;
    Glied & Little, 2003; Newhouse, 1992; Okun & Murphy, 2002; Serra-Sastre & McGuire,
    2012). In part, we may be making simple care more complex because we can do a
    lot.


    Increasing health care puts pressure on everyone. Common insurance coverage, increasing
    the amount employees must pay for health care, increasing the amount people pay
    out of pocket for health services, or dropped health insurance coverage altogether.
    Any of these actions increase the reliance on public sector and safety net providers
    (Pan, Anderson, Foley, Rauser, & Silverstein, 2011; Vistnes, Zawawicki, Simon,
    & Taylor, 2012).


    Rising health spending puts pressure on federal, state, and local governments.
    Not only is Medicare spending projected to increase from $591 billion in 2016
    to $1.1 trillion in 2026, but also longterm spending projections estimate that
    Medicare spending will grow from 3.2% of GDP in 2016 to 3.9% in 2026, 5.0% in
    2046 (Congressional Budget Office, 2016). Declining employer-based coverage and
    limited public funding may lead to a growing number of uninsured people, higher
    costs when they do medical care, and additional strain on families and the publicly
    financed health care safety net.


