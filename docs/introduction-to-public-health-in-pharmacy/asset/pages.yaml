    Rates in epidemiology contain three elements, one in the numerator and two in
    the denominator. The numerator contains the count of health outcomes during a
    specific period of time, and the denominator contains the size of the population
    under study plus the period of observation. The mortality rate in the United States,
    for example, is 8.2 deaths/1,000 population, which gives the average annual number
    of deaths per year per 1,000. Counts, ratios, and rates construct other epidemiological
    measures, such as prevalence, incidence, and effects.


    Prevalence and incidence are measures of disease frequency. The relationship between
    incidence and prevalence can be expressed as P = ID, where P = prevalence, I =
    incidence rate, and D = average duration of the disease. Prevalence measures cases
    of disease in a population at a specified point in time (point prevalence) or
    specified period of time (period prevalence). Prevalence can quantify burden of
    disease, for example, of the 10,000 residents living in Lutz, Florida, on March
    15, 2017, 1,000/10,000 = 0.1 or 10%.


    Incidence, on the other hand, measures new cases of disease in a previously disease-free
    or condition-free population (at risk) during a specific time. Simple incidence
    measures the transition from a state of health to a state using proportions and
    rates. Incidence uses two main measures: risk (or cumulative CI) and rate (person-units).
    Incidence rate (IR) is the number of cases of disease in a specified period divided
    by the number of disease-free persons at the beginning of that period (IR assumes
    the entire population is at risk; however, it is subject to variations within
    a cohort, as persons may refuse to participate, leave the area, die, or enter
    the study after it has already started. To account for these variances, the incidence
    rate is used. CI is most useful. If the research interest is the probability that
    an individual will become ill over a specified period, the CI is used. If the
    research interest is about how fast new cases occur, then the IR calculation is
