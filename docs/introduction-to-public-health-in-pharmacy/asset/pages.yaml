  md: '# Public Health and Pharmacy in the United States


    +   1. Monitor health status to identify community health problems;

    2. Diagnose and treat identified health problems and health hazards in the community;

    3. Infuse, educate, and empower people about health issues;

    4. Mobilize community participation to identify and solve health problems;

    5. Develop policies and plans that support and promote health efforts;

    6. Enforce laws and regulations that protect health and safety;

    7. Link people to needed personal health services and ensure the quality of health
    care;

    8. Assume a competent public and personal health system;

    9. Assess effectiveness, accessibility, and quality of care and population-based
    health;

    10. Research for new and innovative solutions to health problems.


    ![](img/bab568132a8b848885368f29e8af2454_16_0.png)


    Figure 1-1. Ten essential services of public health.


    By 2000, there were a number of changes in federal policy regarding public health.
    The Surgeon General had released his report on mental health, making mental health
    a national priority. The “Decade of the Brain” project had ended, with considerable
    strides made in the neuroscience of physical and mental diseases. In addition,
    the Healthy People 2000 initiative was, just beginning. As the decade advanced,
    additional changes reflected the move to a managed health care financing model,
    the incorporation of evidence-based (decision-making) processes, the increase
    in intersectional (public-private) health partnerships, calls for accountability
    within and among the broader health systems. Public health was described as “complex,
    adaptive systems in public health occurs” (Committee on Assuring the Health of
    the Public in the 21st Century, 2002, p. xiii). Policymakers and practitioners
    wanted evidence-based recommendations to improve public health and population
    health outcomes, with specifications requiring under what conditions population
    health improves and what can be done to affect those conditions (Browson, Fielding,
    & Mayln, 2009; Victoria, Habicht, & Bryce, 2004). Health communication and workforce
    development/capacity were acknowledged as a crucial process in the effective delivery
