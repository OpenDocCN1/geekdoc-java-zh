    # International Development of Pharmaceuticals, and a Culture of Corruption


    The international development of pharmaceuticals and the world market for medications
    of all types has led to counterfeiting of products, patent law failure, and a
    culture of corruption. The technology to make medications that appear identical
    to trade-name drugs is available around the world and is used to make drugs that
    may or not contain the active ingredients. In some of the countries with larger
    manufacturing capabilities, patents are ignored and the medication is copied and
    produced despite patents by the international drug company that has the rights
    to it. These drugs, too, can become part of the supply of counterfeit products.


    In this kind of illegal behavior, corruption in the international drug manufacturing
    industry is significant and costly part of the global scene. With so much potential
