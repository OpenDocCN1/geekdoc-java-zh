    # Introduction


    When think of public health, they often think of the development of epidemiology
    and the eonian public health story about John Snow in 1854. Snow mapped the cholera
    cases in London and talked with the people to determine links between their behaviors
    and the disease. Using this epidemiological approach, he determined that who drank
    the water from the Broad Street pump were more likely to contract cholera. Closing
    the pump was effective in stopping the spread of the disease (Cockerham, 2004).
    Ever since John Snow removed the pump handle from the cholera-infected in London,
    heralding the start of a population-based approach to public health, the world
    has struggled with the realities of health promotion and disease prevention.


    Over a century and a half separates us from that event, cholera continues to be
    a public health concern. After Hurricane Matthew devastated Haiti''s southern
    coast (a Category 4 storm on October 4, 2016), water was once again contaminated
    by the bacteria'
