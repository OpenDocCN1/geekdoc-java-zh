    Low health literacy is a significant public health problem based on meeting the
    conditions set in the definition. Healthcare systems and health care are complex;
    they can be difficult to access, to navigate, and engage with as an equal partner;
    and to exit when appropriate in ideal situations. The US population increases
    in number and diversity, problems will multiply. An understanding of how health
    literacy impacts an individual as she navigates a particular health care system
    and various therapeutic options is a critical piece to the larger puzzle of engaging
    in patient-centered care.


    # Low Health Literacy’s Impact on Patient Care


    # At-Risk Populations


    Culture plays an integral role in communication. Recognition of this fact provides
    a base for understanding health literacy. Culture strongly influences a person’s
    health literacy level. Different cultural backgrounds shape patients’ health literacy
    through their health belief systems, religious observations, family hierarchy,
    gender roles, traditional leaders, and communication style. The National Network
    of Libraries of Medicine (n.d., para. 4) emphasizes, “even culture is only one
    part of health literacy.” it is a very important piece of the complicated topic
    of health literacy.” The U.S. Department of Health and Human Services (USDHS)
    Office of Disease Prevention and Health Promotion (2007, p. 2.1) recognizes that
    “culture affects how people communicate, and respond to health information.”


    In its publication, *National Action Plan to Improve Health Promotion* identified
    particular groups that are most likely to experience low health literacy. Those
    populations include patients who are over 65 years of age. In these patients,
    there is a higher probability of diminished visual acuity, decline in cognition,
    and a loss of reading abilities (when people stop reading, starting their ability
    to read), all progressively deteriorating over time. Also included are people
    who have had a lack of educational opportunity (people with high school education
    or lower). “Reading abilities are typically three to five grade levels below the
    last year of school completed. As a result, people with a high school diploma,
    typically read at a seventh or eighth grade reading level” (National Network of
    Libraries of Medicine, n.d.).'
