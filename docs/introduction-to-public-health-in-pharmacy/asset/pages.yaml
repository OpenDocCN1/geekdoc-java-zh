    Federal Emergency Management Agency


    In 1979, Executive Order 12112 created FEMA by merging six federal administrations
    and programs (FEMA, 2008). In 2003, FEMA and 22 other federal agencies became
    part of the USDHS. Dedicated to rapid response to manmade and natural disasters,
    FEMA provides financial assistance to individuals and governments to rebuild homes,
    businesses, and public facilities; firefighters and emergency medical professionals;
    and emergency planning throughout the United States.


    In September 2011, FEMA implemented its “Whole Community” approach to emergency
    management. The “Whole Community” is FEMA’s approach to increase community resilience
    (FEMA, 2011). Private and nonprofit, the general public, and local, tribal, state,
    territorial, and federal government partners are participants (Sobelson, Wigington,
    Harp, & Branson, 2015).


    FEMA asked the CDC Foundation (2013) to evaluate promising programs across the
    nation to determine how these understand community complexity; how these programs
    recognize the actual needs and collective capabilities of the community; and how
    they foster, build, and maintain relationships with community leaders and multorganizational
    partnerships. The Foundation also examined how the community’s social infrastructure,
    networks, and assets. These and other questions became the basis of a joint FEMA/CDC
    curriculum designed to teach others how to engage the “whole community”.


