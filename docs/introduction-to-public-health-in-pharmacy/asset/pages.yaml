    Implementation of EMRs hold the promise of improved patient care, reducing medical
    errors, and coordinated care (DesRoche, Painter, & Jha, 2015). EMRs have several
    features that assist with pharmacy practice such as documentation of clinical
    services and patient care, medication lists, and allergy documentation as a means
    of conducting clinical research. Incentives from the Health Information Technology
    Act of 2009 have drastically increased the adoption rate of certified EHRs. The
    increased use of EMRs makes it possible to capture massive amounts of clinical
    data that can be used in areas of data mining and application (Ross, Wei, & Ono-Macho,
    2014). Through data mining and applying analytics and decision support, adverse
    events have been detected through utilizations of EMRs (Chazard, Ficheur, Bermonville,
    Lyckck, & Beausart, 2011; Ji et al., 2011). This process is not normative expeditions
    and can be used to support the current process (Coloms, Tirfer, Patadia, & Starkboom,
    2013).


    A component of EMRs is clinical decision support (CDS) provides clinicians, patients,
    or individuals with knowledge and specific or population-specific information,
    intelligently filtered or presented at appropriate times, foster better health
    processes, better individual care, and better population health (Osheroff et al.,
    2007). These tools have become very helpful in practice as a mean to assist with
    clinical care, preventive care, diagnosis, and follow-up. For preventive care,
    they have been used to provide reminders for vaccinations and screenings. A meta-analysis
    found that computerized reminders increased preventive practices when reminders
    were used (Shea, DuMouche, & Bhem, 1996). Patients are often missed when there
    are other issues that need to be addressed during the patient visit.


    Although EMRs are the center of clinical practice in a very short matter of time,
    there are still significant efforts being made to create a fully interoperable
    model of health information exchange across the United States. EHRs could be used
