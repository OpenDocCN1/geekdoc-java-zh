  md: '# Pharmacoeconomics


    but because of political disagreements in Congress, funding was not approved until
    September 2016 (Greer & Singer, 2017). As this chapter points out, during time
    budgets meant for other national or state of local priorities had to be shifted
    to combating mosquitoes and a season of mosquito control was underfunded (the
    gap between February and August). While the economic costs of prevention for a
    population and healthcare for those born with CZS is significant, the balance
    with human suffering is clearly illustrated in the Zika example and can be an
    important part of a pharmacoeconomic analysis.


    # Why Are Pharmacoeconomic Evaluations Important?


    The United States has the most expensive health care, and not surprisingly, ranks
    first in total pharmaceutical spending in the world; however, this high price
    tag does not necessarily result in the world''s best health outcomes. In 2015,
    health care in the United States reached $3.21 trillion, which equates to $9,990
    per person (17.8%) of gross domestic product (GDP), with retail prescription medications
    accounting for approximately 10% ($324.6 billion) of total (Centers for Medicare
    & Medicaid Services [CMS], 2016). With respect to volume, 4.4 billion total prescriptions
    were dispensed in 2015 (QuintilesIMS, 2016). Future increases in health care (and
    prescription) expenditures are predicted to be due, due to the aging of the population,
    the higher percentage of individuals covered by health insurance, as well as rising
    health utilization and healthcare costs; increases in both health care utilization
    and health care costs are responsible for the creation of this perfect storm.
    Accordingly, 10-year projections (2016-2025) estimate that US health care spending
    will grow to $5.55 trillion, or $15,800 per person (19.9% of GDP), by 2025, which
    is an average growth rate of 5.6%. Prescription spending is projected to rise
    even more rapidly, at 6.3%, during this ten-year period. Reasons for the growth
    in prescription expenses includes a predicted increase in high-cost specialty
    medications such as biologics and well as an increased overall utilization, driven
    by demographics and insurance coverage (CMS, 2016).


    Global expenditures for medicines are expected to reach $1.4 trillion by 2020,
    an increase of $349 billion, or about 30%, from 2015 (QuintilesIMS, 2015). The
    primary drivers for this growth are increased access to pharmaceuticals in emerging
    countries, increased utilization of branded medicines in developed markets, and
    increased use of less generics after patent expiration. Global medicine will reach
    an astonishing 4.5 trillion doses, corresponding to a 24% increase in 2015. Better
    access to medicines globally will lead to the consumption of greater than one
    dose per day by more than half of the world''s population (7.6 billion in 2020).
    Notably, India, China, Brazil, Indonesia, and Africa will account for the majority
    of the projected global volume between 2015 and 2020 (QuintilesIMS, 2015).'
