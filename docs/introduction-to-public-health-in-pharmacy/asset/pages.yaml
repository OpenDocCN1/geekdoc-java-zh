    Also a part of the DHHS, the ASPR helps hospitals and other parts of the health
    care system prepare for emergencies. This federal program coordinates emergency
    preparedness and encourages cooperation of providers even though they might normally
    be competitors. Through coalitions that help health providers, public health organizations,
