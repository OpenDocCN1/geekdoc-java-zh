    # Pharmacists’ Interventions


    It would be beneficial to have techniques and tools that would specifically address
    the known needs of these populations. Pharmacists are uniquely positioned as health
    professionals to have a positive impact on the health care of low-literacy patients.
    Because community pharmacies enable the delivery of health-related services in
    close proximity to patients, they develop a natural trust of community pharmacists
    and may be more willing to share their needs or perceived inadequacies with their
    neighborhood pharmacist. When working with patients, it is important for pharmacists
    to remember reading, writing, and comprehension skills that must be developed
    over time.


    In an individual encounter, there are two evidence-based techniques to assist
    low health literacy and numeracy patients with comprehending and being able to
    use health information better. The first strategy is to prepare for and engage
    in an effective oral counseling session. The second method is to use appropriately
    written health materials. Two practices should be used collaboratively and synergistically.
    The low health literacy patient can be positively impacted by receiving consent,
    simple oral directions with the addition of written materials at an accessible
    grade level would supplement the instructions during the session and after the
    encounter.


