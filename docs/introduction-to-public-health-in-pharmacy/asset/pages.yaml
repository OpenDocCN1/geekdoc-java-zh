  md: '# Pharmacoeconomics


    Given the significant and growing cost of health care and medications, decision-makers
    are faced with the difficult dilemma of optimizing resources efficiently (i.e.,
    the best bang for the back) and effectively (relating to outcomes in the real
    world). With limited resources (e.g., time, money, labor, land, and knowledge),
    difficult choices must be made as to how to achieve the goals of the organization
    or project. In order to achieve value in health care, and more specifically pharmaceuticals,
    decision-makers, health professionals, and payers must better understand the relationship
    between costs (inputs) and outputs. Costs are the resources (inputs) used in the
    creation or production of a good or service.


    # Pharmacoeconomics Defined


    Pharmacoeconomics is a term that describes the identification, measurement, and
    evaluation of the costs as well as the consequences of the pharmaceutical product
    or service (Bootman, Townsend, & McGowan, 2005). The evaluation requires two or
    more choices, or alternatives, to be compared. To be a true pharmacoeconomic analysis,
    both the costs and the outcomes of the intervention (i.e., the medication or pharmacy
    service) must be considered and compared. In broad terms, pharmacoeconomics encompasses
    the fields of health economics as well as clinical and humanistic outcome research
    via the evaluation of clinical, and humanistic outcome dimensions (ECHO) (Rascati,
    2014). While the field of pharmacoeconomics is somewhat new, with the term pharmacoeconomics
    first appearing in the 1980s (Townsend, 1986), there has been a remarkable growth
    in the number of pharmacoeconomic studies since its inception.


    The economic evaluation of pharmaceuticals developed from the need to better understand
    a medica''s relative worth or value. While this term can be subjective—that is,
    what may be a value to one may not be another—the importance of this method of
    evaluating various alternatives, due to the rising costs of medications, is increasing
    rapidly. A primary goal, therefore, of pharmacoeconomic alternatives (e.g., reviewing
    inclusion in a formulary, developing treatment guidelines, or designing prescription
    programs).


