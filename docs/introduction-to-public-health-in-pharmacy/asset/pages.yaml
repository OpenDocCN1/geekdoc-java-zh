    # Polioyelitis


    In 1988, the WHO began its campaign to eradicate polio worldwide. More than 125
    countries still had outbreaks of polio and estimated 350,000 children were paralyzed
    annually by the disease (Aylward & Tangermann, 2011). By 2000, three WHO regions
    were certified polio-free (the Americas, the Western Pacific, and Europe).


    During 2005 to 2011, India, Nigeria, Pakistan, and Afghanistan, where eradication
    efforts had effectively stalled, a number of factors played a role in the continued
    transmission of polio. These included poor management of polio campaigns, less
    than effective polio vaccine effectiveness due to the high prevalence of diarrheal
    and non-polio enteroviruses, rumors that the vaccine induced sterility, migratory
    populations, the spread to previously polio-free countries, and the presence of
    continued conflict in some nations (Aylward & Tangermann, 2011).


    The international community developed a number of strategies to overcome the final
    hurdles to eradication. One such strategy was the large-scale use of bivalent
    polio vaccine in supplementation activities tailored to specific immunity thresholds
    within the affected areas, better planning for the polio campaigns, campaigns
    targeted to known nodes of the polio transmission, and plans to address migrant
    and underserved populations (Aylward & Tangermann, 2011). By 2012, polio virus
    transmission was found only in Afghanistan and Nigeria. Then, in 2014, over 350
    cases of wild polio virus were caused the WHO to call the "public health emergency
    of international concern" (Hagan et al., 2015, p. 527).'
