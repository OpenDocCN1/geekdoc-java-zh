    clinical trial information for efficacy in the affected patient population; generally,
    if the data does not show significant clinical difference in effect, cost becomes
    the most important factor. In the case of psychoactive drugs, the effectiveness
    of individual agents within a class of drugs is largely similar, leading to cost
    as the driving force for formulary decisions.


    Formularies systems often include a very limited number of preferred medications
    that may be ineffective for a patient before consideration can be given to the
    use of more expensive, nonpreferred drugs. It is often not clear what the insurer
    defines as an adequate trial in terms of dose and duration, so patients and providers
    must navigate a confusing and inconsistent system to obtain nonpreferred drugs.


    While formative systems are created with the goal of providing appropriate treatment
    of mental and psychiatric conditions in the most cost-effective manner possible,
    research suggests that, as drug costs are decreased, the pressure to insurers
    is shifted to increased spent in nonmedical areas. A study by Goldman, Dirani,
    Fastenu, and Conrad (2014) evaluated the impact of restrictions for antipsychotic
    drugs to treat schizophrenia and revealed that restrictions on atypical antipsychotics
    for schizophrenia and bipolar disorder resulted in total annual cost of approximately
    $1 billion for state Medicaid systems. In addition, strict formularies caused
    patients to return to previously failed antipsychotic therapies or discontinue
    treatment, increasing the use of acute care services while decreasing drug costs
    (Seabury et al., 2014).


    Quantity limits and prior authorization (PA) requirements are other methods that
    are used to ensure appropriate use of medications and decrease costs. A quantity
    limit is defined as limiting the number of dose units (tablets or capsules) dispensed
    to the patient for each prescription based on the recommended dosing of the individual
    drug for a 30-day supply. For example, the usual recommended dose of risperidone
    is 8 mg daily dose. Risperidone is available as a 4 mg tablet, so the maximum
    quantity limit for risperidone 4 mg for a 30-day supply would be 60 tablets. Commonly,
    recommended doses for a drug are obtained from initial clinical registration trials
    that may include less ill population as the study sample, and the results of the
    trials may not translate to the extremely ill patient population. Higher doses
    are occasionally required for some patients, which leads to the need for PA before
    the prescription can be paid by the payer and dispensed to the patient.


    Prior authorizations are required for prescriptions when the drug, dose, or quantity
    exceeds the insurance coverage or when a patient is also receiving another drug
    in the same class. Prior authorization criteria vary based on the drug in question
    and can also differ relative to the price of the drug as preferred or nonpreferred;
    in'
