  md: '# Framing Public Health and Pharmacy


    Now that we have examined two regional bodies that influence public health and
    pharmacy, we next look at an example of collaboration between the WHO Regional
    Office and its regional/national partners.


    # The European Observatory on Health Systems and Policies


    The European Observatory on Health Systems and Policies examines the dynamics
    of health systems in Europe to promote evidence-based health policymaking. The
    Observatory is a partnership with the WHO Regional Office for Europe and the governments
    of Belgium, Finland, Ireland, the Netherlands, Norway, Spain, Sweden, and the
    Veneto region of Italy. Additionally members include the European Commission,
    the European Investment Bank, The World Bank, the French National Union of Insurance
    Funds, the London School of Economics and Political Science, and the London School
    of Hygiene & Tropical Medicine. The Observatory conducts a number of studies on
    the economic and financial impact of population health, assessing chronic disease
    management across European health systems to the economic impacts of integrated
    care. Its quarterly journal, *Eurohealth*, provides reports on emerging policy
    issues as well as on research and practice.


    # European Policy Framework: 2020


    Health 2020 is a "value- and evidence-based health policy framework" for the WHO
    European region (WHO Regional Office for Europe, 2013, p. 3). It clearly establishes
    that health is not only a major societal resource but also an asset that relates
    to the SDH frame of the Rio Declaration. The member states agree to six broad
    goals. The sixth goal encourages member states to set national goals and targets
    related to health issues in their respective nations (WHO Regional Office for
    Europe, 2013). This allows to determine health priorities, identify evidence-based
    practices, and address implementation facilitators and barriers. It also addresses
    the varying capacities across nations, targeted strategic initiatives, and increased
    monitoring and evaluation of population health.


    Member states also selected four priority areas for policy action: (a) life-course
    approach to health; (b) noncommunicable and communicable diseases; (c) strengthening
    people-centered public health systems and emergency preparedness, surveillance,
    and response; and (d) creating resilient communities (Opolski & Wysocki, 2013).
    If the aim of public health and pharmacy is to improve the health of communities
    and populations, then Health 2020 should provide a strong framework for the improvement
    of both across Europe.'
