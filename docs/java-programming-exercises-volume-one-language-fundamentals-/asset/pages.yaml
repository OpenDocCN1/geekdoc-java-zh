  md: "# 5 • Character and String Processing 145\n\n```\nif ( string.charAt( 0 ) !=\
    \ string.charAt( string.length() - 1 )\\)\n  return false;\n\nreturn isPalindromeRecursive(\
    \ string.substring( 1, string.length() - 1 );\n}\n```\n\nThe task of palindromes\
    \ is a classic in computer science. There are different approaches to this task;\
    \ it can be answered easily with a Java library in a one-liner, or it can be solved\
    \ iteratively via a loop and recursively.\n\nThe solution here is simple and performant.\
    \ If we want to test whether a string is a palindrome, all we have to compare\
    \ the first character with the last, the second with the second to last, and so\
    \ on. We loop from 0 to half of the string and exactly that: string.charAt(string.length()\
    \ - index - 1 ) from the left to the middle and once we have extracted the characters,\
    \ we compare them; if the characters are not equal, we exit the method with false.\
    \ If the program survives the loop, the string is a palindrome. The solution works\
    \ for strings with even and odd number of characters.\n\nOur method isPalindromeIgnoringCase(String)\
    \ tests whether the string is a palindrome regardless of case. In this case, we\
    \ convert the string to lowercase and pass to our existing method isPalindromeIgnoringLettersAndDigits(String)\
    \ for testing.\n\nFor the isPalindromeIgnoringCase(String) method, we could proceed\
    \ as we to delete everything that is not a letter or digit, or dispense with an\
    \ extra pass to clean up the string and query directly. This is the approach taken\
    \ by the implementation. We iterate through each character of the string from\
    \ left and define two counters startIndex and endIndex. The start index becomes\
    \ larger and the end smaller. We start with the first character and with the end\
    \ index on the last. One of the two characters may not be a letter or a digit.\
    \ So, we search from the left until we get a valid symbol, and we have to do the\
    \ same from the right. This is what the two loops do. Since the check can now\
    \ be case-insensitive, we convert the two characters to lowercase and compare\
    \ them. If each comparison is not true, return false terminates the method.\n\n\
    Finally, we look at the recursive implementation. Here are two possibilities.\
    \ Here we show the possibility that if first test checks if there is no or a character\
    \ in the string. In that case, we have reached the end of the recursion and return\
    \ true. Next, we extract the first and the last characters and compare them. If\
    \ the characters are not the same, we exit the method with false. If the characters\
    \ case-insensitive—we extract a substring and go one recursion level. Since the\
    \ recursion here is at the end, we also call it an, which in principle can be\
    \ optimized by runtime environments, although the standard JVM does not optimize\
    \ this way.\n\nAn alternative solution to a recursion would be to parameterize\
    \ the method with a start and end index, which is then moved within the method\
    \ each time, without generating temporary strings. Instead, of forming a partial\
    \ string, only the start and end index are adjusted. However, this is no longer\
