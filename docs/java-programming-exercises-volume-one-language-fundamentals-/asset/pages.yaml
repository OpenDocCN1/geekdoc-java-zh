    A single quadrant suffices to depict distinct scenarios, rather than sketching
    individual quadrants for each case. While it is possible to include only the necessary
    lines for each scenario, there exists fascinating correlation that can be utilized.
    Any number greater than six possesses a line on its right when. For instance,
    7 is a composite of 6 and 1, 8 is a combination of 6 and 2, and 9 is a blend of
    7 and 2. Similarly, 5 is a union of 1 and 4. This association is linked to a binary
    pattern that, merged, produces a higher value.


    The proposed solution does not use this property, but something simpler: each
    digit from 1 to 9 has lines at places. A case statement can place the line for
    each digit. This is how printQuadrant(...) is implemented:


    ```

    com/tutego/exercise/CisterianDigits.java

