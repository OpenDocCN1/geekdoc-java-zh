    public static <T> Comparator<T> comparing(ToIntFunction<? super T>\nkeyExtractor)\
    \ {\n    Objects.requireNonNull(keyExtractor);\n    return (Comparator<T> & Serializable)\n\
    \        (c1, c2) -> Integer.compare(keyExtractor.applyAsInt(c1),\n        applyAsInt(c2));\n\
    }\n```\n\nThe key extractor extracts an integer value from the objects to be compared\
    \ and then defers to Integer compare to these two integers.\nLet's take a look\
    \ at the function. It combines a key extractor with a Comparator. This is handy\
    \ when the objects have no natural order, but a foreign Comparator has to determine\
    \ the order.\n\n# JDK's Implementation from java.util.Comparator\n\n```\npublic\
    \ static <T, U> Comparator<T> comparing(\n    Function<? super T, ? extends U>\
    \ keyExtractor,\n    Comparator<? super U> keyComparator)\n{\n    Objects.requireNonNull(keyExtractor);\n\
    \    Objects.requireNonNull(keyComparator);\n    return (Comparator<T> & Serializable)\n\
    \        (c1, c2) -> keyComparator.compare(keyExtractor.apply(c1),\n        keyExtractor.apply(c2));\n\
    }\n```\n\nFirst, the key extractor will extract the values for the two objects\
    \ c1 and c2. Thereafter, the values will go into the compare(...) method of passed\
    \ lambda expression returns a new Comparator.\nIf you compare this with your own\
    \ Comparator implementations, will generally do the same, exactly the values from\
    \ two objects and compare them. This is precisely what factory functions do! We\
