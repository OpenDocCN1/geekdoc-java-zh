    \ The variable remains alive in the block and can be accessed in the following\
    \ return statement.\n\nWe can create a second variant where now include the condition\
    \ in the previous statement in the return statement:\n\n```\ncom/tutego/exercise/oop/Toaster.java\n\
    @Override public boolean equals(Object o) {\n    return o instanceof Toaster other\n\
