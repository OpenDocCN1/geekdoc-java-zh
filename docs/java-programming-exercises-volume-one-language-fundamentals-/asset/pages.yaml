  md: '# Writing Radio Constructors ★


    So far, our radio has had only a default constructor generated by the compiler.
    Let''s replace it with a frequency our constructors:

    Task:


    +   - Write a constructor for the class Radio so that you can initialize a radio
    with a frequency (double). But you should still be able to create radios with
    the parameterless constructor!

    - Alternatively, a Radio object should be able to be initialized with a station
    name (as String) (use stationNameToFrequency(...) internally for this). The station
    name is not stored, only the frequency.

