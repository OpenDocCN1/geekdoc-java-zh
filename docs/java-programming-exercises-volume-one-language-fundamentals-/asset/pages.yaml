  md: "# Java Programming Exercises\n\nThe Comparator implementations rely on Integer.compare(...)\
    \ to compare the two integers, which is implemented like this:\n\nOpenJDK's implementation\
    \ of Integer.compare(int, int) method.\n\n```\npublic static int compare(int x,\
    \ int y) {\n    return (x < y) ? -1 : ((x == y) ? 0 : 1);\n}\n```\n\nFor Comparator\
    \ instances to do more than a simple comparison, there are two approaches. First,\
    \ they can completely realize the logic itself, in the proposed solution, or two\
    \ existing Comparator objects can be concatenated, which is the topic of the next\
    \ task.\n\nThe merging of the logic is shown in the proposed solution: the first\
    \ year is considered, and if the years are equal, compare(...) returns 0, then\
    \ the second comparator must be considered, the name is a String and implements\
    \ Comparable for a natural order, so compareTo(...) must make the decision.\n\n\
    # Concatenate Hero Comparators\n\n```\ncom/turbo/exercise/util/HeroCombinedComparators.java\n\
    ```\n\n```\nComparator<Heroes.Hero> nameComparator =\n(h1, h2) -> -h1.name().compareTo(h2.name()\
    \ ) ;\n```\n\n```\nComparator<Heroes.Hero> yearComparator =\n(h1, h2) -> Integer.compare(h1.yearFirstAppearance(),\n\
    h2.yearFirstAppearance() )\n```\n\n```\nComparator<Heroes.Hero> combinedComparator=yearComparator.thenComparing(\n\
    nameComparator );\n```\n\n```\nList<Heroes.Hero> allHeroes=new ArrayList<>(Heroes.ALL);\n\
    allHeroes.sort(combinedComparator);\nSystem.out.println(allHeroes);\n```\n\nTo\
    \ understand how it works, look at the thenComparing(...) implementation from\
    \ the OpenJDK:\n\nOpenJDK's implementation from java.util.Comparator.\n\n```\n\
    default Comparator<T> thenComparing(Comparator<? super T> other) {\n    Objects.requireNonNull(other);\n\
    \    return (Comparator<T & Serializable>) (c1, c2) -> {\n        int res=compare(c1,\
    \ c2);\n        return (res == 0) ? res : other.compare(c1, c2);\n    };\n}\n\
    ```\n\nThe focus is on the lambda expression, which returns a Comparator. The\
    \ implementation first calls its compare(...) method because its own Comparator\
    \ goes first and checks first. If the comparison is not 0, then our compare(...)\
    \ method can return the result directly. However, if the result was equal to 0,\
    \ then our compare(...) method says that the two objects are equal, and then we\
    \ proceed to the second Comparator from the parameter passed to the thenComparing(Comparator)\
    \ method. This Comparator must then decide what to do."
