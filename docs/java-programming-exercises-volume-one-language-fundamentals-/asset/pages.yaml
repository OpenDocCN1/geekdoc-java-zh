  md: "```\npublic class TreasureChest {\n\n    public final int goldDoubloonWeight;\n\
    \    public final int gemstoneWeight;\n\n    private TreasureChest(int goldDouboonWeight,\
    \ int gemstoneWeight) {\n        if (goldDouboonWeight < 0 || gemstoneWeight <\
    \ 0)\n            throw new IllegalArgumentException(\"Weight can't be negative\"\
    );\n        this.goldDouboonWeight=goldDouboonWeight;\n        this.gemstoneWeight\
    \ =gemstoneWeight;\n    }\n\n    public static TreasureChest newInstance() {\n\
    \        return new TreasureChest(0, 0);\n    }\n\n    public static TreasureChest\
    \ newInstanceWithGoldDoubloonWeight( int weight ) {\n        return new TreasureChest(weight,\
    \ 0);\n    }\n\n    public static TreasureChest newInstanceWithGemstonesWeight(\
    \ int weight ) {\n        return new TreasureChest(0, weight);\n    }\n\n    public\
    \ static TreasureChest newInstanceWithGoldDoubloonAndGemstonesWeight(\n      \
    \  int goldDoubloonWeight, int gemstoneWeight) {\n        return new TreasureChest(goldDouboonWeight,\
    \ gemstoneWeight);\n    }\n}\n```\n\nThe class declaration contains the two public\
    \ variables. Since they are final, they cannot be modified after they have been\
    \ written once. It is perfectly fine to make variables public; there is no need\
    \ to have getters if the variables can no longer be modified. Setters are primarily\
    \ useful for ensuring that the value ranges are correct—in our case, this is done\
    \ by the constructor, which accepts and validates the values.\n\nWe have a private\
    \ constructor that cannot be called from the outside, but is only used by our\
    \ static factory methods. These four factory methods allow all permutations of\
    \ the two instance variables.\n\n+   1. Neither is set, the values default to\
    \ 0.\n2. One of the values is set, then the other is initialized to 0.\n3. Both\
    \ values are set.\n\nNow, what is the advantage of these factory methods over\
    \ constructors? A constructor is a good choice if there is an unambiguous way\
    \ to initialize an instance. But in our case, there is the possibility to initialize\
    \ goldDoubloonWeight or gemstoneWeight, and a constructor has the predefined name\
    \ of the class. It is not possible to write two different variants of the constructor\
    \ that both take an integer and can distinguish whether goldDoubloonWeight or\
    \ gemstoneWeight should be assigned. Of course, you could track it and pass it\
    \ as enumeration as the second parameter for identification, for example, but\
    \ it's not appealing. Factory methods have the charm of named methods and making\
    \ their function clear by the method name, even if the parameter lists of different\
    \ methods are the same."
