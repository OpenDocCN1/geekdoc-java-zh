    # Determine the Larger Crew Size


    First, let''s summarize what we need to accomplish: in a string, we need to find
    the separator character (minus sign) and determine how many dashes are to the
    left and right of the minus sign. These values must be compared. There are three
    outputs for the comparison: the right value can be larger or smaller than the
    one, or both values can be the same.


    There are two simple solutions:


    +   * Split the input with split(") into two strings, and then query this string
    with length().

    * Get the position of the minus sign in the string with indexOf(...) and then
    calculate the length left and right of the separator character.


    Here is a special solution for friends with the motto: "why do we solve when it
    is complicated?" In practice, this is of use and sets, and is only justified if
    the profiler indicates that a code position is a bottleneck that needs to be optimized.
    Otherwise, clarity always comes first!


    Let us assume for a moment that we have found the separator character at the position
    i and delete it because we want avoid counting the one separator character. The
    total length shrinks thereby by one.


    ![](img/1772db956b1b6830f9a15683dc55dea0_164_0.png)


    FIGURE 5.1 Relationship between location of the minus sign and team sizes.


    If P (pirates) and V (victims) are sets, then let |P| be the number of pirates
    and |V| the number of raiders. These three pieces of information (0, i, and length
    - 1) give us answers:


    +   * How many pirates are there? There are i - 0, so i many.

    * How many raiders are there? There are length - 1 - i many.


    We could find these values and compare them, and the problem would be solved.'
