    public static String caesar( String s, int rotation ) {\n    StringBuilder result=new\
    \ StringBuilder(s.length());\n    for (int i=0; i<s.length(); i++) {\n       \
    \ result.append((char) rotate( s.charAt( i ), rotation ) );\n    }\n    return\
    \ result.toString();\n}\n\n// Freaky solution\n// IntUnaryOperator rotation=c\
    \ -> rotate(c, rotation);\nreturn s.chars().map(rotation).mapToObj( Character::toString)\n\
    .collect(Collectors.joining());\n\npublic static String decaser( String s, int\
    \ rotation ) {\n    return caesar( s, ALPHABET_LENGTH - rotation );\n}\n```\n\n\
    The String caesar(String s, int rotation) method is then itself without surprise.\
    \ We build an internal StringBuilder in which we collect the result, run over\
    \ the input string once from front to back, grab each character and rotate it,\
    \ then put it in those containers. Finally, we convert the StringBuilder to a\
    \ String and return it.\nThe method decaser(...) uses a nice property, and that\
    \ is that and after a number of shifts we end up back at the original character.\
    \ And this number of shifts is just the size of the alphabet, so 26. What happens\
    \ if we don't shift the character by 26 positions, but only by 25? We would not\
    \ have shifted the character to the \"right\", but to the \"left\"; a B would\
    \ then no longer be a C, but the B would become an A. We can therefore decode\
    \ with the position ALPHABET_LENGTH - rotation, which moves the character back\
    \ to the left to its original position. One difference to caesar(...) is, however,\
    \ that we must not go into the negative by the subtraction otherwise, an exception\
    \ throws. This is of course not symmetrical to caesar(...) because the distance\
    \ may be arbitrary."
