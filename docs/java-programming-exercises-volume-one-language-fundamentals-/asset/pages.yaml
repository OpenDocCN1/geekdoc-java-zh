    # SUGGESTED SOLUTIONS


    # Porting Java Programs ★


    If the Application.class file is copied from a Windows operating system to a Linux
    machine, it will run there as well. To run the file, a runtime environment like
    Oracle JDK is always required.


    # Get to Know Error Messages of the IDE ★


    You could deliberately the following errors:


    +   - If the class is public, the filename must be the same as the class. So,
    we could change the filename or name. The IDE recognizes the error and suggests
    a renaming.

    - Keywords are always lowercase in Java. What happens if you capitalize a keyword
    like public or class or capitalize letters? In that case, there is a compiler
    error.

    - If the start method is not declared as public static void main(String[] args),
    but differently, the editor cannot guess, but the compiler will translate the
    program correctly because public static void run(String[] args) could, in general,
    be a method not want. It is a semantic error and not a syntactic error, which
    the editor or the compiler notice. The runtime environment will throw an error
    that the main(...) method is not present when the program is to started (semantic
    error).

    - A method consists of a sequence of statements—these statements are in a block
    enclosed in curly braces. Same is true for the class, which consists of a collection
    of methods that must be placed in a block altogether. Indentations are not significant
    in Java. You can provoke an error by omitting the braces completely.

    - Every curly bracket requires a closing bracket. If you omit a curly bracket,
    it will cause a compiler error.

    - String literals are enclosed with different symbols in different programming
    languages. Some programming languages use double quotes ("), other programming
    languages use a single quote (''), and some programming languages use backticks
    (`). Java can accept the strings only in double quotes; otherwise there will be
    compiler errors. Single quotes are used for characters (data type char).

    - In Java, white space is used to make the source code clearer, especially to
    make the blocks visible. You can find out which of the whitespace characters you
    are allowed to delete and which you are not. The code given in the task is fine.'
