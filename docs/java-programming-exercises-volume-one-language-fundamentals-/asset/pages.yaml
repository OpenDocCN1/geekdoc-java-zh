    \ ];\n        sumLeft += element;\n        sumRight -= element;\n    }\n    return\
    \ -1;\nn\n```\n\n```\n// https://en.wikipedia.org/wiki/Relative_change_and_difference\n\
    private static int relativeDifference( int a, int b ) {\n    if ( a==b ) return\
    \ 0;\n    int absoluteDifference=Math.abs( a - b );\n    return (int) ( 100. *absoluteDifference\
    \ / Math.max( a, b ) );\n}\n```\n\nThe algorithm for the solution can be implemented\
    \ either iteratively or recursively. However, in this case, the decision has been\
    \ made to utilize the iterative approach due to its simplicity and ease of comprehension.\
    \ Let’s start with a simple example of how to solve the problem we could\n\n+\
    \   1. Take an index that divides the array into two halves.\n2. Calculate the\
    \ sum of the right and left parts.\n3. Compare them, and if the two sides are\
    \ approximately equal, end the program with a result.\n\nThe index moves from\
    \ front to back, and the sums are always recalculated. This algorithm is simple,\
    \ but we have to go over the array several times, so eventually, the runtime is\
    \ quadratic. This works better.\n we split the array in two and the cursor moves\
    \ one position to the right, the sums change according to a simple pattern: what\
    \ is added to the sum on the left is subtracted from the right. This is the core\
