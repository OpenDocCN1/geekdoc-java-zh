    devices.removeIf(new IsPowerConsumingElectronicDevice() );\n```\n\nIn the first\
    \ step, we define a constant with the maximum accepted consumption. The variable\
    \ is private because we are interested in it, it is final because it is not changed,\
    \ it is static because constants like this do not belong to an object. The data\
    \ type is int because wattage within the electrical appliances is also an int.\n\
    \nInside the method, we use the possibility of a local class. In principle, the\
    \ class declaration can be done outside because this class does not use local\
    \ variables. As a nested class, it is comfortable the class declaration is only\
    \ necessary for the context of the removePowerConsumingElectronicDevices() method.\
    \ If there is a case where the predicate should also be relevant for other methods,\
    \ we should pull the nested class out of the method.\n\nThe class IsPowerConsumingElectronicDevice\
    \ implements a predicate for electrical devices, performs a test on a concrete\
    \ device, and returns a true value about this electronic device. Our predicate\
    \ accesses the wattage and whether it is greater than the constant MAXIMUM_POWER_CONSUMPTION.\
    \ If it is, the electronic device has a high consumption. It is up to us whether\
    \ we write the test with a “less than” or “less or equal to”."
