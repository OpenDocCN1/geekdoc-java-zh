    # Quiz: Does This Add Up?


    The result is not 0.0. The reason is that double cannot represent the number 0.1
    as a fractions of the type 1/2". 0.1 is a difficult number, which simply put,
    cannot be represented. In the IEEE-754 format the pattern 0|01111001|1001_1001_1001_1001_01,
    symbolically | separates the sign bit from the exponent and the mantissa, and
    the underscore makes the radix visible. This pattern corresponds back to 0.100000001490116931834765625,
    an error of 1.49x10^-9. If 0.100000001490116931834765625 is added ten times, 1.0
    cannot come out.

    There are several solutions to the problem:


    +   1. Instead of double, use the class BigDecimal.

    2. Accept the inaccuracy and round the output, which can be done with printf(...).

    3. A monetary amount can be stored in cents; instead of storing 0.1 Liretta, for
    example, a program can store 10 Lireettas and display that in the output as 0.1.


