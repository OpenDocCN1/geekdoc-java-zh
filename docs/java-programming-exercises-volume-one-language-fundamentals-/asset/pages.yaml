    \ ' points to the upper letter. If we have inserted a space at this position,\
    \ the index will point to forward. However, we do not have to check spaces via\
    \ our algorithm. We can therefore increase the index by one so that the index\
    \ is on the following uppercase letter. Since it continues afterward in the continuation\
