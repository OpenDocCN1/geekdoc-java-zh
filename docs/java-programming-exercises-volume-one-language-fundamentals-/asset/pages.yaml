  md: 'There is a compiler error with this notation because Objects.requireNonNull(...)
    returns a reference, but logical operations are only allowed with boolean.


    ```

    if ( Objects.requireNonNull( string ) != null )

    ```


    There is no test whether the string also contains characters; this is not a feature
    of requireNonNull(...). Besides, using it would be counterproductive because the
    string was null, we would get an exception, which is precisely what we want to
    avoid. You only use requireNonNull(...) if you would like to throw an exception
    deliberately to report faulty parameters.


