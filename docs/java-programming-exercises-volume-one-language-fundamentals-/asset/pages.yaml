    # Quiz: Value Ranges


    The product of 1,000,000×1,000 is 1E+12, and that exceeds the value range of the
    int data type, which only goes as high as 2,147,483,647. IE+12 needs more bits,
    and int only uses a width of 32 bits, the upper 8 bits are truncated. The situation
    is with long, which is 64 bits and allows a range of values up to 9,223,372,036,854,775,807
    (no, you don''t have to remember the digits by digit).


    The following gives the correct output because the exponents are multiplied as
    long:


    ```

    long number=1_000_000;

    System.out.println( number * number );

    ```


    Large numbers can be made more readable in Java by using underscore.'
