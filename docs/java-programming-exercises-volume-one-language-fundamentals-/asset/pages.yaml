  md: "2 • Imperative Programming 57\n\nan exception when the numbers cannot be multiplied\
    \ anymore because they become too large for a long.\n\n# Determine If a Number\
    \ Is Formed by Factorial\n\ncom/tutego/exercise/lang/IsFactorial.java\n\n```\n\
    System.out.println(\" Enter a number:\" );\nlong n=new Scanner ( System.in ).nextLong();\n\
    \nif ( n<1) \nSystem.err.println(\" Factorials are always >= 1 \" );\nelelse\n\
    long number =n;\nlong divisor=2;\n\nwhile ( number % divisor == 0 ) {\nnumber\
    \ /=divisor;\ndivisor++;\n}\n\n ( number == 1 ) \nSystem.out.printf(\"%d=%d!%n\"\
    , n, divisor - 1 );\nelse\nSystem.out.printf(\"%d is not a factorial!%n\", n,\
    \ n );\n\n```\n\nFrom the command line, we ask for a number, and since factorials\
    \ can get huge, we will query it as long. If the factor is less than 1, i.e.,\
    \ 0 or negative, we print a message on the command line and terminate the program\
    \ because the rest of the code is executed only if n is greater than or equal\
    \ to 1.\n\nThe algorithm is as described in the tip. We start by dividing the\
    \ factorial by 2, then by 3, 4, and so on. The variables number and divisor also\
    \ occur in the program:\n\n| STEP | NUMBER | DIVISOR | QUOTIENT | REMAINDER |\n\
    |---|---|---|---||\n| 1 | 6 | 2 | 6 /2=3 | 6 % 2=0 |\n| 2 | 3 | 3 | 3 /3=0 | 3\
    \ % 3=0 |\n| 3 | 1 | irrelevant | 1 % 4≠0 |\n\nIn the third step, the remainder\
    \ is 0, and the loop ends.\nThe variable number is initialized with the factorial,\
    \ i.e., the largest value. We divide this variable number repeatedly by the divisor.\
    \ We do this so as we have no remainder after an integer division. Whether a number\
    \ can be divided by a divisor without a remainder is answered by the remainder\
    \ operator. % divisor is equal to 0, the division comes out without remainder.\n\
    At the end, the loop will stop because there is always a case where the number\
    \ cannot be divided by the divisor. The variables number and divisor run towards\
    \ each other. number gets smaller and smaller with each division, and divisor\
    \ gets larger and larger due to the increment. In the last step, there will be\
    \ a remainder != 0. When number has arrived at 1, we know that we could divide\
    \ many times until we at the beginning of the factorial chain and the user input\
    \ is a factorial; this is what we output on the screen. If the number is not 1,\
    \ then it is not factorial."
