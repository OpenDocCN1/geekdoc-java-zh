    \n```\npublic static final String TWO_SPACES=\"\";\n\nstatic String compressSpace(String\
    \ string) {\n    return compressSpace( new StringBuilder( string ) ).toString();\n\
    }\n\nstatic String compressSpace(StringBuilder string) {\n    int index=string.lastIndexOf(\
    \ TWO_SPACES );\n\nwhile ( index >= 0 ) {\n        string.deleteCharAt( index\
    \ );\n        index=string.lastIndexOf( TWO_SPACES );\n    }\n    return string;\n\
    }\n```\n\nFor practical reasons, we have an overloaded compressSpace(...) method,\
    \ one variant with the String parameter type and the String return type, a second\
    \ time with the StringBuilder parameter, and this variant returns a StringBuilder.\
    \ The variant is more convenient for users because strings are more common as\
