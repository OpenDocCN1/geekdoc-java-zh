  md: "# 7 • Records, Interfaces, Enumerations, and Sealed Classes 231\n\nbe put directly\
    \ as an argument to the constructor of DistanceImplementation; in the case of\
    \ Kilometer(int), the value is taken times 1000, and then used as a constructor\
    \ argument.\nThe meter() is the only abstract method. Therefore, the class DistanceImplementation\
    \ must also implement only this method. The fourth method kilometer() is a default\
