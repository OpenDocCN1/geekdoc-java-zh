  md: "# 6 Writing Your Own Classes 201\n\nWe create four constants for the smallest\
    \ and largest frequency for AM and FM, respectively. We pre-set the two instance\
    \ variables minFrequency and maxFrequency in the task with the frequency range\
    \ of the AM modulation this is the standard assignment of the instance variable\
    \ modulation.\n\nThe method setModulation(...) has now different possibilities\
    \ to check the assignment of the variable modulation and to set minFrequency and\
    \ maxFrequency depending on the assignment. One possibility would be a condition\
    \ statement with if-else, another possibility offers the switch-case; the approach\
    \ chosen here uses the condition operator. enum objects are so-called single-tons,\
    \ i., objects that exist only one, and reference comparison with == is allowed,\
    \ which is unusual for regular objects—here equals(...) would have to be used.\n\
    \n# Writing Radio Constructors\n\ncom/tutego/exercise/biwdxj/Radio.java\n\n```\n\
    public Radio() {\n}\npublic Radio(double frequency) {\n    setFrequency(frequency);\n\
    }\npublic Radio(String string name) {\n    this(stationNameToFrequency(station));\n\
    }\n```\n\nOur solution has three constructors. The parameterless constructor is\
    \ empty but present; we do not perform any initialization here.\n\nThere are two\
    \ parameterized constructors. The constructor that stores the frequency calls\
    \ setFrequency(double) to have the frequency transferred to the internal instance\
    \ variable. We are faced with the decision of whether to directly initialize the\
    \ instance variable with this.frequency=frequency or call the setter. The solution\
    \ with the setter is generally better. There are two reasons: first, initializing\
    \ states is an implementation detail. If we change something in the instance variable,\
    \ as developers would have to go to all places where there are read or write accesses.\
    \ It is also important to consider that a setter can also perform validity checks.\
    \ We would rather not repeat this in the constructor because code duplication\
    \ is bad. Consequently, the constructor can defer saving to the instance variable\
    \ and validation to the setter.\n\nIf a radio is initialized with a station, the\
    \ string is first converted to a frequency, and then the constructor forward\n\
    \n```\nthis(stationNameToFrequency( station ) );\n```\n\nso the constructor(double\
    \ frequency), which takes a double, stores the frequency.\nWith(..), there might\
    \ only be one constructor with the implementation and all other constructors forward\
    \ to this one constructor. The advantage is that in case of enhancements, this\
    \ particular constructor has to be changed. The disadvantage is however that there\
    \ might come some default values or null to the object. However, initialization\
    \ constructors are essential because they bring the object into a valid initial\
    \ state so that each method call can start from a correct, valid object."
