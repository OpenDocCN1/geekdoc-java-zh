  md: "# 4 Arrays 103\n\nWe start in the loop at index 0 and store the element in\
    \ an intermediate variable currentSign. At position 1, we have the second element\
    \ to start with, and this assignment is also saved in a variable nextSign. Objects.requireNonNull(...\
    \ ) will throw an exception at this point if one of the array elements is null.\n\
    \nStrings have an equals(...) method that is used to determine equivalence. There\
    \ are two outputs for the comparison:\n\n+   1. When we find two equal consecutive\
    \ strings, we increment the variable counter and test if it is equal to MIN_OCCURRENCES.\
    \ In that case, there are four equal consecutive strings, and we can exit the\
    \ method with return true.\n2. If currentSign and nextSign are not equal, we must\
    \ reset the counter to 1.\n\nIf at the end of the loop, no string has been detected\
    \ that occurs four times in a row, the method is exited with return false.\nThe\
    \ whole if-else block can be shortened if you are willing to always test, even\
    \ if the counter has reset:\n\n```\ncount=currentSign.equals(nextSign ) ? count+1\
    \ : 1;\nif ( count == MIN_OCCURRENCES ) return true;\n```\n\n# Reverse an Array\n\
    \ncom/tutego/exercise/array/Arrayverser.java\n\n```\npublic static void reverse(double[]\
    \ numbers) {\n    final int middle=numbers.length / 2;\n\n    for ( int left=0;\
    \ left<middle; left++) {\n        int right=numbers.length - left - 1;\n     \
    \   swap(numbers, left, right );\n    }\n}\n\nprivate static void swap(double[]\
    \ numbers, int i, int j) {\n    numbers[i]=numbers[j];\n}\n```\n\nThe reverse(...)\
    \ method gets an array as a parameter. So, we get a reference to an object from\
    \ another place. Changes not take place on a copy, but we operate on exactly the\
    \ array passed by the caller. Since arrays are objects accessed by references,\
    \ the caller may have passed null. In that case, the numbers.length will lead\
    \ to a NullPointerException, and that is fine.\nThe algorithm itself is not difficult.\
    \ We need to swap the first element with the last, the second with the last, and\
    \ so on. We move the swapping of the elements to a separate method swap(...).\n\
    To avoid overwriting the elements in reverse(...), we must only run halfway. The\
    \ variable middle represents the half. Although the variable is used only in the\
    \ loop, a variable of this kind helps to document the meaning of this expression\
    \ more precisely. Our loop starts with the loop left at 0 and runs to the middle.\
    \ The variable right runs in the opposite direction."
