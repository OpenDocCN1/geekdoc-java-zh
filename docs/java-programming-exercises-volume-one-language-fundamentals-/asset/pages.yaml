  md: "# 280 Java Programming Exercises\n\n+   * The List interface has a sort(...)\
    \ method. Sort the list allHeroes with the new Comparator.\n* Extend the Comparator\
    \ so that if the year of publication is the same, it is also compared by name.\
    \ Evaluate the approach that the Comparator tests several criteria at the same\
    \ time.\n\n# Concatenate Hero Comparators ★\n\nSorting is often done not by one\
    \ criterion, but by many. A typical example is the phone book. First, the entries\
    \ are sorted by the last name and, in the case of a group of people with the same\
    \ names, by the first name.\n\nSeveral criteria are involved in the ordering.\
    \ We do not have to handle the chaining of the Comparator instances ourselves,\
    \ but we can use the default method thenComparing(...). Task:\n\n+   * Study the\
    \ API documentation (or implementation) for the Comparator method thenComparing(Comparator<?\
    \ super T>).\n* Some heroes have the release year.\n  1. Write a Comparator implementation\
    \ that only compares heroes by name.\n  2. Write a second Comparator that compares\
    \ the heroes only by their year of publication.\n  3. Sort all heroes in the first\
    \ criterion by year of publication, by name. Implement the composite Comparator\
    \ thenComparing(...).\n\n# Using a Key Extractor to Easily Create a Comparator\
    \ ★★\n\nA Comparator generally 'extracts' key elements and compares them. But\
    \ doing this the Comparator actually does two things: it extracts the relevant\
    \ information, and second, it compares these values. Using good object-oriented\
    \ programming, these two steps should be separated. This is the goal of the static\
    \ comparing*(...) methods of the Comparator interface. These methods are only\
    \ given a key-extractor, and the comparison of the extracted values is done by\
    \ the comparing*(...) methods.\n\nLet's look at three implementations, start with\
    \ the implementation of the (Function) JDK's Implementation from java.util.Comparator.\n\
    \n```\npublic static <T, U extends Comparable<? U>> Comparator<T> comparing(Function<?\
    \ super T, U> keyExtractor)\n{\n    Objects.requireNull(keyExtractor);\n    return\
    \ (Comparator<T>)(c1, c2) -> keyExtractor.apply(c1).compareTo(keyExtractor.apply(c2));\n\
    }\n```\n\nInitially, the mandatory null test takes place. Then, keyExtractor.apply(...)\
    \ returns the value from the first object and the second object. Since both objects\
    \ have a natural order (they are Comparable), compareTo(...) returns this order.\
    \ comparing(Function) returns a Comparator, here as a lambda expression."
