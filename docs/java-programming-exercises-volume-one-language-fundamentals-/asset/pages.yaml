  md: "# Compare Consumption of Electrical Devices\n\ncom/tutego/exercise/device/bhaddavq/ElectronicDevice.java\n\
    \n```\npublic class ElectronicDevice {\n\n    private int watt;\n\n    public\
    \ int getWatt() {\n        return watt;\n    }\n\n    public void setWatt( int\
    \ watt) {\n        this.watt=watt;\n    }\n\n    @Override public String toString()\
    \ {\n        return \"ElectronicDevice[watt=\"+watt + / 1000+\"kW\";\n    }\n\
    }\n```\n\nThe ElectronicDevice class has only wattage, everything else is removed\
    \ because it is not necessary for the assignment. The toString() method divides\
    \ the watt by 1000 for conversion to kilowatts.\n's look at the simplified description\
    \ of the Comparator interface again:\n\n```\npublic interface Comparator<T> {\n\
    \    int compare(T ol, T o2);\n}\n```\n\nThe Comparator is a generic interface\
    \ with a type parameter T. If our class implements the Comparator interface, we\
    \ would need to form a parameterized type with an argument. The type represents\
    \ the types that Comparator wants to compare, in our case ElectronicDevice. When\
    \ we implement Comparator, we implement compare(T ol, T o2) method; the type parameter\
    \ becomes the type argument ElectronicDevice.\nThere are different ways to get\
    \ an implementation of the Comparator interface. The first variant is shown in\
    \ the solution. A second variant would be via enum, the third via lambda expressions.\
    \ We will stick with the simple solution and come back to the Comparator implementations\
    \ in more detail with the lambda expressions.\n\n```\ncom/tutego/exercise/device/bhaddavq/ElectronicDeviceWattComparator.java\n\
    import java.util.Comparator;\n\npublic class ElectronicDeviceWattComparator implements\
    \ Comparator<ElectronicDevice> {\n\n    @Override\n    public int compare( ElectronicDevice\
    \ ea1, ElectronicDevice ea2 ) {\n        System.out.println( ea1+\" is compared\
    \ with \"+ea2 );\n        return Integer.compare( ea1.getWatt(),ea2.getWatt()\
    \ );\n    }\n}\n```"
