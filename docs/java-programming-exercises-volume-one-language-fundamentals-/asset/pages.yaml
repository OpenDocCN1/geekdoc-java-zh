  md: '# Java Programming Exercises


    # USED JAVA VERSION IN THE BOOK


    While Java version 8 remains still strong in enterprise settings, it''s crucial
    for learners to become acquainted with the latest features. Accordingly, whenever
    feasible, the suggested solutions in this book leverage Java 21. Not only is this
    version equipped with long-term support (LTS), but runtime environment providers
    also offer extensive support, ensuring that the release retains its relevance
    for an extended period.


    # JVM


    If we want to run programs, we need a JVM. In the early days, this was easy. The
    runtime environment first came from Sun Microsystems, later from Oracle, which
    took over Sun. Today, it is much more confusing. Although a runtime environment
    can still be obtained from Oracle, the licensing terms have changed, for Java
    8 up to Java 16. Testing and development are possible with the Oracle JDK, but
    not in production. In this case, Oracle charges fees. As a consequence, various
    institutions compile their own runtime environments from the OpenJDK, the original
    sources. The best known are Eclipse Adoptium (https://adoptium.net/), Amazon Corretto
    (https://aws.amazon.com/corretto/), Red Hot OpenJDK (https://developers.redhat.com/products/openjdk/overview),
    and others as those from Azul Systems or Bellsoft. There is no specific distribution
    that readers are required to follow.


    # Development Environment


    Java code is just plain text, so technically a simple text editor is all you need.
    However, relying on Notepad or for productivity is like trying to run a race on
    a tricycle. Modern integrated development environments support us with many tasks:
    color highlighting of code, automatic code completion, intelligent error correction,
    insertion of code blocks, visualization of states in the debugger, and more. It
    is advisable to use a full development environment. Some popular IDEs are IntelliJ,
    Eclipse, Visual Studio Code, and (Apache) NetBeans. Just like Java runtime environments,
    the choice of IDE is left to the reader. Eclipse, NetBeans, and Visual Studio
    Code are all free and open-source, while IntelliJ Community Edition is also free,
    but the more advanced IntelliJ Ultimate Edition will cost you some cash.


    Halfway through the book, we delve into implementing project dependencies using
    Maven in a few places.


    # CONVENTIONS


    Code is written in fixed width font, filenames are italicized. To distinguish
    methods from attributes, methods always have a pair of parentheses, such as in
    the "variable max can contain the maximum" or "returns max() the maximum". Since
    methods can be overloaded, either the parameter list is named, as in equals(Object),
    or an ellipsis abbreviates it, as in "println(n)" methods. If a group of identifiers
    is addressed, * is written, print(...) prints something on the screen.


    In the suggested sections, there are usually only the relevant code snippets,
    so as not to blow up the book volume. The name of file is mentioned in the listing
    caption, like this:

    VanillaJava.java


    ```

    class VanillaJava { }

    ```'
