- pgno: 112
  md: '# VARIABLE ARGUMENT LISTS


    Java allows methods to which you can pass any number of arguments. They are called
    vararg methods. A vararg parameter may only be at the end of a parameter list
    and is an array. When called with variable arguments, the compiler automatically
    creates a new anonymous array and passes it to the method.


    # Create SVG Polygons with a Variable Number of Coordinates ★


    Bonny Brain wants to draw a map for her next place of work, and it should always
    look good printed and on any resolution because every detail matters. The best
    technology for this is SVG.


    ![](img/1772db956b1b6830f9a15683dc55dea0_112_0.png)


    In SVG there are different primitives, for example, for lines, circles, or rectangles.
    There is also an XML element for polylines. Example:


    `<polygon points="200,10 250,190 160,210" />`


    Task:


    +   - Declare a Java method printSvgPolygon(...) to pass any number of coordinate
    pairs. What errors could occur when passing them?

    - The method should print a matching SVG output to the screen for the passed pairs.


    Example:


    +   - In `printSvgPolygon( 200, 10, 250, 190, 160, 210 ), 200,10` is a coordinate
    pair, 250,190 is as well, as is 160, 210. The screen output should be: `<polygon
    points="200,10 250,190 160,210" />`.'
