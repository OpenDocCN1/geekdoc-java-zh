    The notation can be shortened a bit with the so-called diamond operator to:\n\n\
    ```\nArrayList<Radius> radios=new ArrayList<>();\n```\n\nSince the variable is\
    \ private, the radios cannot be accessed from the outside, we have to go through\
    \ helper methods which can access the instance variable. load(Radio radio) allows\
    \ adding radios. The method delegates to the add(..) method of the ArrayList.\n\
    The second count switchedOn() method returns the number of radios switched on.\
    \ It is important to note that it is not the total number of radios—that would\
    \ be answered quickly—but really about the number of radios where the isOn state\
    \ set to true. So, we have to run the whole list and examine each radio individually.\
    \ There are several solutions here:\n\n+   * A practical variant is the extended\
    \ for loop. We get to know this loop type in connection with arrays: to the right\
    \ of the colon, there can be an ArrayList. This way, we can comfortably run the\
    \ entire list from front to back. We get each radio and test if the instance variable\
    \ is set, and if so, we increment our counter.\n* Another solution would have\
    \ been to work with a counting loop, run from 0 to radios.size(), and use the\
    \ get(int) method to pick out each radio at the position.\n There is a third solution\
    \ with the stream API, but it will take a while until we get there. But the question\
    \ can be answered with a one-liner.\n\nIf we wanted to give ship other electrical\
    \ appliances with our current knowledge, we would have to introduce different\
    \ data structures with the special types, i.e., an ArrayList with ice machines\
    \ or an ArrayList with TV sets. It should be clear that this gets confusing quickly,\
    \ but object-oriented programming languages have a perfect solution for this:\
    \ inheritance!\n\n# Introduce Abstraction in Electronic Devices via Inheritance\n\
    \n```\ncom/tutego/exercise/device/jkvow/ElectronicDevices.java\n```\n\n```\nclass\
    \ ElectronicDevice {\n\n    private boolean isOn;\n\n    public void isOn() {\n\
    \        isOn=true;\n    }\n\n    public void off() {\n        isOn=false;\n \
