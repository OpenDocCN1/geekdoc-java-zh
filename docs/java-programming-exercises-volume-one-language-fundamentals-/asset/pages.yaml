    \ allowed to modify the Collection as well. Therefore, we will be conservative\
    \ and not modify the incoming Collection, which may not be possible if the Collection\
    \ is immutable.\n\nNow we take advantage of the special feature of the Java language\
    \ that you declare classes inside methods. We call such a local inner classes.\
    \ The advantage of local inner classes is that they can access (explicitly or\
    \ implicitly) variables from the outer Our Comparator needs because it is to judge\
    \ which of the two Store objects is closer to the center, a comparison must take\
    \ place from the first Store to the center and then from the second Store to the\
    \ center. If you want to avoid working with the inner classes, you would have\
    \ to give the Comparator implementation a parameterized constructor so that you\
