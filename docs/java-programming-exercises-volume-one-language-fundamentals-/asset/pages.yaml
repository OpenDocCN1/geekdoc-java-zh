  md: "# Quiz: Records with Static Variables\n\nRecords can contain static variables,\
    \ and therefore both variants compile. They are equivalent in the result that\
    \ the variable id contains a Universally Unique Identifier (UUID) string. In the\
    \ second case, the initialization is written only in the compact constructor.\
    \ Another notation would be to use the canonical constructor like:\n\n```\nrecord\
    \ Candy( String name, int calories ) {\n    public static String id;\n}\n\nCandy(\
    \ String name, int calories) {\n    this.name=name;\n    this.calories=calories;\n\
    \    id=UUID.randomUUID().toString();\n}\n```\n\n# Record Patterns\n\n```\nstatic\
    \ Properties convertProperties( Object pet) {\n    Properties result=new Properties();\n\
    \    switch (pet) {\n        case MischMonkey(String name, boolean isMutinous)\
    \ when !isMutinous->{\n            result.setProperty(\"name\", name);\n     \
    \   }\n        case FeistyParrot(String name, String favoritePhrase, boolean isMutinous)\n\
    \        when !isMutinous->{\n            result.setProperty(\"name\", name);\n\
    \            result.setProperty(\"favoritePhrase\", favoritePhrase);\n       \
    \ }\n        case null, default->{}\n    }\n    return result;\n}\n```\n\ncom/tutorial/exercise/oop/PetDemo.java\n\
    \nThe solution consists of three steps.\n\n+   1. A new Properties object is created\
    \ for the return. This object is left empty if the pet is rebellious or an unknown\
    \ type, or if the parsed argument is null.\n2. The switch statement analyzes the\
    \ object based on its type. However, since all record components are needed for\
    \ further processing, the extended pattern is helpful. This makes it possible\
    \ to transfer the record states directly to new local variables. The additional\
    \ condition when when excludes mutinous. If the pet does not mutate, the local\
    \ variables of the extracted components are used to populate the Properties object\
    \ with the corresponding information. The branch with null, handles unknown types\
    \ or a call of convertProperties(null).\n3. At the end, the result object is returned."
