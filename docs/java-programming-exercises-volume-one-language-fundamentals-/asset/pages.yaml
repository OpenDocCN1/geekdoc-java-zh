- pgno: 1
  md: '# Java Programming Exercises


    Take the first step in raising your coding skills to the next level, and test
    your Java knowledge on tricky programming tasks, with the help of the pirate Captain
    ChaoCiao. This is the first of two volumes which provide you with everything you
    need to excel in your Java journey, including tricks that you should know in detail
    as a professional, as well as intensive training for clean code and thoughtful
    design that carries even complex software.


    Features:


    +   - About 200 tasks with commented solutions on different levels

    - For all paradigms: object-oriented, imperative, and functional

    - Clean code, reading foreign code, and object-oriented modeling


    With numerous best practices and extensively commented solutions to the tasks,
    these books provide the perfect workout for professional software development
    with Java.'
  merge: -1
