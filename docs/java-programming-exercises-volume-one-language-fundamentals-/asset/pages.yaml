    modified externally, use getters without setters. If a variable is final, getters
    will work. Generate only one getter for the state volume.


    Setters and getters are an important naming convention. If a property is type
    boolean, the prefix is generally isXXX(), not getXXX(). Our existing method isOn()
    is also a getter.


    # STATIC VARIABLES METHODS


    Class variables and static methods often lead to confusion for novice programmers.
    Yet, it is simple: either state is stored within individual objects or within
    the class object itself. If we have different objects with instance variables,
    the object methods can access the individual properties. A static method can only
    access class variables without specifying an object.


