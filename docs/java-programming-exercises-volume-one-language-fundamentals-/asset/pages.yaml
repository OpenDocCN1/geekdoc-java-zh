  md: "# Using a Key Extractor to Easily Create a Comparator\n\nBuilding new Comparator\
    \ objects using static methods and the key extractor is a bit unfamiliar at the\
    \ beginning. You also have to get used to chaining Comparator objects. The assignment\
    \ introduces the implementation extensively so the results from it:\n\n```\ncom/tutego/exercise/util/HeroKeyExtractorComparators.java\n\
    ```\n\n```\nComparator<Heroes.Hero> nameComparator =\nComparator.comparing( h\
    \ -> h.name() );\nComparator<Heroes.Hero> yearComparator =\nComparator.comparingIn(\
    \ h -> h.yearFirstAppearance() );\nComparator<Heroes.Hero> combinedComparator1\
    \ =\nyearComparator.thenComparing( nameComparator );\nComparator<Heroes.Hero>\
    \ combinedComparator2 =\nnameComparator.thenComparingIn( h -> h.yearFirstAppearance()\
    \ );\nComparator<Heroes.Hero> insensitiveComparator =\nComparator.comparing( h\
    \ -> h.name() ), String.CASE_INSENSITIVE_ORDER );\n```\n\n# Sort Points by Distance\
    \ to Center\n\n```\ncom/tutego/exercise/util/PointComparatorDemo.java\n```\n\n\
    ```\nclass PointDistanceToZeroComparator implements Comparator<Point>\n  @Override\n\
    \  public int compare(Point p1, Point p2) {\n    double distanceToZeroPoint1=p1.distanceSq(0,\
    \ 0);\n    double distanceToZeroPoint2=p2.distanceSq(0, 0);\n    return Double.compare(distanceToZeroPoint1,\
    \ distanceToZeroPoint2);\n  }\n```\n\nThe sort(...) method expects a Comparator\
    \ from us. The Comparator is a functional interface with a simple abstract method\
    \ compare(...).\nSince Comparator is a generic data type, we need to specify a\
    \ type argument, and that is our Point. To implement the Comparator interface,\
    \ we write a class PointDistanceToZeroComparator. In the body of the method, we\
    \ calculate the distance of the first point to the zero points and the second\
    \ distance to the zero points. Strictly speaking, we don't calculate the distance,\
    \ the distance squared, that's perfectly fine for the comparison and even a bit\
    \ faster because the root isn't necessary.\n\nOnce we have obtained the two distances,\
    \ we can simply return the appropriate value (negative, positive, or 0) for the\
    \ compare(...) method. We can achieve this by using the Double.compare(...) method,\
    \ which provides a three-way comparison.\nWe can pass the Comparator as a second\
    \ argument to sort(...) like this:\n\n```\nArrays.sort( points, new PointDistanceToZeroComparator()\
    \ );\n```"
