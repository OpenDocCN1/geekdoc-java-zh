- pgno: 18
  md: '# 2 Java Programming Exercises


    The first set of tasks is designed for programming beginners who are new to Java.
    As you gain more experience with Java, the tasks become more challenging. Therefore,
    there are tasks for both beginners and advanced developers.


    Additionally, this book does not require the use of tools like profiling tools,
    as these are beyond the scope of this book.


    # WORKING WITH THIS BOOK


    The task book is organized into different sections. The first section covers the
    Java language, followed by selected areas of the Java standard library, such as
    data structures or file processing. Each area is accompanied by programming tasks
    and "quiz" that contain surprises. Each section starts with a small motivation
    and characterization of the topic, followed by the exercises. Additional tips
    and hints are provided for particularly challenging assignments, while other exercises
    offer optional extensions for further exploration.


    The majority of exercises are independent of each other, making it easy for readers
    to dive in anywhere. However, in the chapter on imperative programming, some tasks
    build on each other to develop a larger program, and the same goes for the chapter
    on object-oriented programming. The problem definitions make this clear, and more
    complex programs help provide context for understanding different language characteristics.
    Furthermore, a more complex program can motivate readers to continue.


    The exercises are rated with one, two, or three stars to indicate their complexity,
    while this rating is subjective to the author.


    +   1 star: Simple exercises, suitable for beginners. They should be easy to solve
    without much effort. Only transfer of knowledge is required, for example, by writing
    down things that are in a textbook fully.

    2 stars: The effort is higher. Different techniques have to be combined. Greater
    creativity is required.

    3 stars: Assignments with three stars are more complex, require recourse to more
    prior knowledge, and sometimes require research. Frequently, the tasks can no
    longer be solved with a single method, but require multiple classes that work
    together.


    # THE SUGGESTED SOLUTIONS


    The task book provides at least one suggested solution for each problem. The term
    "sample solution" is not used to avoid implying that the given solution is the
    best one and all other solutions are useless. Readers are encouraged to compare
    their solutions with the proposed solution and can be satisfied if their solution
    is more refined. All proposed solutions are commented, making it possible to follow
    all steps.


    The suggested solutions are compiled at the end of each chapter to reduce the
    temptation to look into a solution directly after the task, which takes the fun
    out of solving the task. The suggested solutions can also be found on the website
    https://github.com/ullenboom/captain-ciaocao. Some solutions contain comments
    of the type tag::solution[], which marks the parts of the solutions printed in
    the book.'
