  md: "# 5 • Character and String Processing 171\n\nIf we need to modify a string,\
    \ we have two options: one is to rebuild a new string by character, in our case\
    \ including all characters but not spaces in a row. The other option is to modify\
    \ an existing string. This is the solution we choose.\n\nWe go with lastIndexOf(...)\
    \ from left to right, from back to front over the StringBuilder, and search for\
    \ blanks. If we have a result greater than or equal to 0, then we delete each\
    \ character at the position where the two spaces occurred so that the first space\
    \ disappears. We are now also searching for the next instance of two spaces using\
    \ lastIndexOf(...). Eventually, we have searched the entire StringBuilder from\
    \ right to left, and we won't find more instances of two spaces. This is the point\
    \ at which we stop.\n\nIt perhaps strange that the lastIndexOf(...) method is\
    \ used and not indexOf(...) which runs from left to right. Both work. However,\
    \ for delete operations, it is more performant if fewer data are deleted. So,\
    \ if we were to run over the string from the left and find two spaces, we would\
    \ have to move everything beyond it position to the left. But since there may\
    \ be another spaces on the right, we would move them too, even if they disappear\
    \ later anyway. If we run from right to left, we won't find more spaces to our\
    \ current position, which means we won't move unnecessary spaces.\n\n# Insert\
    \ and Remove Crackles and Pops\n\ncom/tutego/exercise/string/Crack.java\n\n```\n\
    private static final String CRACK=\"CRACK\";\n\npublic static String crack(String\
    \ string) {\n    int capacity=string.length()+string.length() * CRACK.length()\
    \ / 10;\n    StringBuilder result=new StringBuilder( capacity );\n    result.append(\
    \ string );\n\n    for ( int i=string.length()-1; i >= 0; i--)\n        if ( Math.random()<0.1\
    \ )\n            result.insert( i, CRACK );\n    return result.toString();\n}\n\
    \npublic static String crackle(String string) {\n    return string.replace( CRACK,\
    \ \"\" );\n}\n```\n\nWe declare a final CRACK to the crackle string, so we can\
    \ easily change the string. Later, places refer to CRACK, when inserting the crackle\
    \ and also deleting the crackle.\n\nThe crackle(...) method gets a string and\
    \ returns a String. There are different approaches to the task. The solution here\
    \ copies passing the string into a dynamic StringBuilder to insert the crackle\
    \ at appropriate places. We generate insertion positions with a for loop and decide\
    \ whether to insert the crackle or not. There are two special features to the\
    \ program. The first is that we do not generate the crackle from left to right,\
    \ not from the beginning to the end, but we go from right to left and work our\
    \ way forward. The reason for this approach is that it allows us to avoid having\
    \ one crackle overwrite another. If we insert a crackle at one point, the string\
    \ will grow to the right as seen from the index, not to the left with the index\
    \ and insert a crackle later, there can never be an overlap. Of course, if we\
    \ run from left to right and insert a crackle, we could also increase the length\
    \ of CRACK.\n\nThe second trick is to decide to insert a crackle. A decision with\
    \ Math.random() < 0.1 is executed with a 10% probability. The insertion is by\
    \ the insert(...) method of the StringBuilder object.\n\n![](img/1772db956b1b6830f9a15683dc55dea0_187_0.png)"
