  md: '# 4 • Arrays 113


    Arrays are objects, and as objects, they have all the methods that the base type
    java.lang.Object provides. However, we can''t do anything with any of these methods,
    which we quickly notice when we call the toString() method on an array object.
    The equals(...) method of an array comes from Object, and there we have an identity
    comparison, which, as explained in the first point, results in the output false.


    To compare arrays, we are quite right with the class java.util.Arrays and the
    method equals(...). In general, we compare arrays with this method, but our two
    arrays have a little peculiarity: they contain strings and an inner array with
    integers. If this sub-referenced array were not present, true would indeed appear
    in this output. However, equals(...) works flat, meaning that the referenced inner
    array would have to be identical. But since this array is also a new array in
    each case, the two references to the integer array are not equal and thus Array.equals(...)
    returns false on our array.


    Only with the method Array.deepEquals(...) will true appear on the screen. deepEquals(...)
    also keeps track of the referenced sub-arrays and looks to see if the values are
    equivalent. The identity of the sub-arrays is not essential for deepEquals(...).
    The two integer arrays are equivalent, and therefore the return value of deepEquals(...)
    is true.'
