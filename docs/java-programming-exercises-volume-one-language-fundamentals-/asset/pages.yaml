  md: "# Java Programming Exercises\n\nIn the next step, we build an instance of IsPowerConsumingElectronicDevice\
    \ and feed it to the removeIf(...) method of the list devices. The method runs\
    \ an internal loop over all the electrical devices, passes each device to our\
    \ predicate, and if our predicate says the electrical device has too much consumption,\
    \ removeIf(...) deletes it from the list. The nice thing about these methods is\
    \ that we don't have to worry about deleting and traversing the data structure\
    \ ourselves; that functionality is internally in removeIf(...)\n\n# Enumeration\
    \ for Candy\n\n```\ncom/tuttego/exercise/lang/AskForCandy.java\n\nenum CandyType\
    \ {\n    CARAMELS,\n    CHOCOLATE,\n    GUMMIES,\n    LICORICE,\n    LOLLIPS,\n\
    \    CHEWING_GUMS,\n    COTTON_CANDY\n}\n\nstatic Optional<CandyType>fromName(\
    \ String input ) {\n    try {\n        input=input.trim().toUpperCase().replace('\
    \ ', '_');\n        return Optional.of( CandyType.valueOf( input ) );\n    } catch\
    \ ( IllegalArgumentException e ) {\n        return Optional.empty();\n    }\n\
    }\n```\n\nThe new enumeration CandyType consists of several constants, which are\
    \ usually completely capitalized in Java. Since there are no spaces in identifier\
    \ names, we use an underscore, as is usual for constants.\n\nThe fromName(String)\
    \ is later passed the user input and returns the corresponding CandyType. Since\
    \ the input be case-insensitive, we first convert it to uppercase and replace\
    \ the space with underscore—which corresponds to the name of the best case. The\
    \ compiler generates a class from each enumeration type that has a static valueof(String)\
    \ method. It helps us to return the corresponding enumeration type for a string.\
    \ A problem exists if an assignment is not possible: then valueOf(...) generates\
    \ an exception; we catch it and return Optional.empty(). If valueOf(...) returns\
    \ a result, we wrap it in an Optional.\n\nThe usage might like this:\n\n```\n\
    com/tuttego/exercise/lang/AskForCandy.java, CandyType\n\nSystem.out.println(\"\
    Name a candy\" );\nString input=new Scanner(System.in).nextLine();\nfromName(\
    \ input ).ifPresentElse( System.out::println, () -> System.out.println(\"Unknown\"\
    ) ) );\n```"
