    # ## Quiz: Handling Null Reference in Unboxing\n\nThe first statement does not\
    \ compile. What can we do, however, is the following code:\n\n```\nInteger int1=null;\n\
    int int2=int1;\nint i =(Integer) null;\n```\n\nWhile running the code, a NullPointerException\
    \ occurs due to unboxing. In Java, the compiler will invoke the relevant methods\
    \ to extract the primitive value from the wrapper object. For instance, when working\
    \ with an Integer object, the compiler will use a bytecode instruction to call\
    \ the intValue() method automatically.\n\nA NullPointerException also exists in\
    \ the switch. The Java compiler will automatically unbox and call charValue()—this\
    \ will not work at runtime. switch has no special treatment on a wrapper, which\
    \ can be null.\n\nA Map is an associative store that connects key-value pairs.\
    \ The get (...) method has the property that it returns null if there is no associated\
    \ value to the key. Our example is just a case. Under a wrong key, we query the\
    \ associative store, there is no associated value, so the return is null. The\
    \ compiler will automatically unbox and call the intValue() method, resulting\
    \ in a NullPointerException at runtime. The solution to this is to explicitly\
    \ include a check for null in the code whenever null expresses a missing return.\
    \ So that would be:\n\n```\nInteger maybeShips=map.get( \"number_of_ships\" );\n\
    if ( maybeShips != null ) {\n\tint int ships=maybeShips;\n}\n```\n\nTo summarize:\
    \ there is no automatic conversion from null to 0 or false."
