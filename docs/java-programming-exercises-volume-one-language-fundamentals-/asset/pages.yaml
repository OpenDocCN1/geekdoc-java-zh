    \    case LOLLIPOPS -> Math.random() > 0.5 ? LICORICE : CHEWING_GUMS;\n      \
    \  case COTTON_CANDY -> LOLLIPOPS;\n        case LICORICE, CHEWING_GUMS -> GUMMIES;\n\
    \        case CARAMELS, CHOCOLATE -> CARAMELS\n    };\n}\n```\n\nIn the first\
    \ step, we put our addictive quality values over the enumeration elements in round\
    \ parentheses. We pass that to our constructor, which is private because the Java\
    \ compiler writes it. The constructor takes the integer and stores it in a private\
    \ variable, which is accessible via the public method addictiveQuality(). Since\
    \ there is no corresponding setter and the enumeration element is not a Java Bean,\
