    final variables int goldDoubloomWeight and int gemstoneWeight. So, the object
    is immutable, the static factory methods cannot be changed. Getters are not necessary.

    3. Write four static factory methods that return a TreasureChest object:


    +   - TreasureChest newInstance()

    - TreasureChest newInstanceWithGoldDoubloomWeight(int)'
