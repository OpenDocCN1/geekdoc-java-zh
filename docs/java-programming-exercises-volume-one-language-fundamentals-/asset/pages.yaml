    # Quiz: == vs. equals(...)


    Primitive data types are not references; no single method can be called on the
    primitive data types. It is not allowed in Java to put a dot after the primitive
    element and then call a method. The situation is different if the primitive data
    types are automatically converted into the so-called wrapper objects by the compiler,
    but that is another story. Consequently, there is a compiler error.


    # Quiz: Protect against NullPointerException


    About the individual conditions:


    ```

    if (!string.isEmpty() && string != null)

    ```


    The expression checks whether string is empty and then whether string is null.
    Since the evaluation is from left to right and length is checked here first, the
    order leads to a NullPointerException if string == null and avoids none.


    ```

    if (string != !string.isEmpty())

    ```


    && || are short-circuit operators, and they have a counterpart & | that do not
    operate on the short-circuit primitive, i.e., execute all parts. So, this yields
    a NullPointerException if string is null, because of the method.


    ```

    if (string != null && !string.isEmpty())

    ```


    This check is correct. The order is correct; first, it tests if string is not
    to null. If the result is false, the right is not evaluated at all. This avoids
    a NullPointerException.


    ```

    if (string == null || string.isEmpty())

    ```


    Logical expressions can be negated twice, leading to the same result. In this
    case, an AND becomes an OR, or an OR becomes an AND. In addition, the whole expression
    is negated—the keyword is boolean algebra. But, if this statement is correct,
    it depends on the context which this simplifies the readability or not; in this
    special case, probably not.


    The operator leads to evaluation of both sides: a NullPointerException occurs
    if string is null.


    ```

    if (Objects.requireNonNullNull(string) && !string.isEmpty())

    ```'
