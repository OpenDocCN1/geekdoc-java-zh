    \ (Math.random()) * VALUES.length];\n}\n```\n\nIf we add other or variables to\
    \ the enumeration type, we don't have to change any enumeration element.\n\nWe\
    \ can copy the method fromName(...) directly into the enumeration type, however,\
    \ we can omit the qualification with CandyType for valueOf(...) because valueOf(...)\
    \ is now part of its data type.\n\nBesides valueOf() there is a second method\
    \ that is automatically generated by the compiler. The method values() returns\
    \ an array with enumeration elements. We can take out a random element, and thus\
    \ the random() is implemented.\n\nThe own random() method can be more efficient.\
    \ Because this way, values() is called twice, and this generates some runtime\
    \ costs because a new array is always returned. We could optimize the code by\
    \ having our own private static reference constant in the array. This way, the\
    \ array can be accessed directly later without having to keep it at runtime.\n\
