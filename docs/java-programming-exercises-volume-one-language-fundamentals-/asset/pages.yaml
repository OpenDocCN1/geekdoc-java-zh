  md: '# Quiz: Unboxing Surprise


    The output of the program is noted in the comment.


    ```

    Integer i1=1;

    Integer i2=1;

    System.out.println( i1 == i2 ); // true

    System.out.println( i1 <= i2 ); // true

    System.out.println( i1 >= i2 ); // true


    Integer i21=1000;

    Integer i22=1000;

    System.out.println( i21 == i22 ); // false

    System.out.println( i21 <= i22 ); // true

    System.out.println( i21 >= i22 ); // true

    ```


    It is surprising first that in one case, the == operator produces true and suddenly
    false. There are three things to know:


    +   1. The relational operators <, <= and >= force the values to be taken from
    the wrapper objects and the comparison to be. However, the == comparison operator
    does not perform unboxing but merely compares two references and consequently
    makes an identity comparison. That is, the code does not compare the numbers 1
    and 1000, but compares the references of the two Integer objects, respectively.
    The question is: why are the two Integer objects identical for 1 and not for 1000?
    We will come to that now ...n2. The compiler does not build wrapper objects with
    new but goes to the factory method valueOf(...).

    3. The Integer internally uses a cache for all Integer objects in the value range
    from -128 to +127. The valueOf(...) method consequently returns already existing
    Integer objects for exactly the integers from the mentioned value range. Everything
    outside the value range is always built and returned as a new object. Thus, calling
    valueOf(1000) results in two different Integer objects, which are not identical.


    # NOTES


    +   1. Source: https://github.com/livethirtyeight/data/tree/master/comic-characters.

    2. 31 is a prime number, which gives a good spread of bits. The fact that ultimately
    31 is used so often in the Java library for hash codes is also due to the authors''
    gut feeling, as documented by https://bugs.java.com/bugdatabase/view_bug.do?bug_id=4045622.'
