    \ more compact. Firstly, the general solution: we work with a List and a Comparator,\
    \ so we can use the Comparator to sort the list. The Comparator only has to use\
    \ the distance between the points as an ordering criterion. Here we can make it\
    \ easy for ourselves the java.awt.Point class has a distance(...) method, with\
