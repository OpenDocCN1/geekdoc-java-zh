  md: "# 9 • Exception Handling 255\n\nIf the method parseInts(String..) was called\
    \ with the argument null, numbers.length leads to a NullPointerException, which\
    \ is intentional. If the argument is not equal to null, we create a new array\
    \ of integers that is the same size as the parsed array. The loop iterates over\
    \ the String and passes each value into the parseIntOrElse(..) method, passing\
    \ 0 as the default value. So always gets an integer result, either the converted\
    \ one or 0. Finally, we return the array.\n\nAdvanced Java developers can replace\
    \ the loop. Because there is a useful Arrays method setCount(..) implemented like\
    \ this:\n\n# JDK's implementation of setAll(...)\n\n```\npublic static void setAll(int[]\
    \ array, IntUnaryOperator generator) {\n  Objects.requireNonNull(generator);\n\
    \  for (int i=0; i<array.length; i++)\n    array[i]=generator.applyAsInt(i);\n\
    }\n```\n\nThe special feature of this method is that it is not running over the\
    \ array with our own loop, but the setAll(..) method does for us. The caller only\
    \ has to pass the array and a special object of type IntUnaryOperator, which is\
    \ a function that maps the index (int) to an object that is as an element in the\
    \ array.\n\nWe can replace our loop with:\ncom/utget/exercise/exception/StringsToInt.java\n\
    \n```\npublic static int[] parseInts( String... numbers ) {\nint[] result=new\
    \ int[ numbers.length ];\nArrays.setAll( result, index->parseIntOrElse( numbers[\
    \ index ], 0 ) );\nreturn result;\n}\n```\n\nThe notation here is formulated with\
    \ a lambda expression, something we will look at later.\n\n# Quiz: And Finally\n\
    \nThe program compiles, and when we run it, it throws an ArithmeticException at\
