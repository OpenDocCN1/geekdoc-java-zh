  md: "# 6 Writing Your Own Classes 205\n\nThe next class TV remembers in a private\
    \ variable isOn the TV is on or off. We set this instance variable in the on()\
    \ and off() methods. In the instance variable type of MonitorTube, the TV remembers\
    \ the monitor tube. The initialization is:\n\n```\nprivate final MonitorTube tube=newMonitorTube\
    \ ( this is );\n```\n\nAt the constructor, this is passed, so the reference to\
    \ the current TV comes to the monitor tube. That is, the monitor tube receives\
    \ the TV, and we had seen before that the monitor tube remembers the TV. So, we\
    \ directly established a bidirectional relationship. If we only wanted a unidirectional\
    \ relationship, we would have just a MonitorTube, but not a reference from theMonitorTube\
    \ to the TVnThe() and off() methods have two tasks: First, set the internal flag,\
    \ and then delegate to the MonitorTube methods on() and off().\nirectional relationships\
    \ are convenient you can always get to the other side. However, they bear the\
    \ danger that two objects refer to the same opposite side, namely, if the first\
    \ object forgets it is no longer in a bidirectional relationship. Establishing\
    \ a bidirectional relationship is less of a problem, but if the parties rebind,\
    \ both relationships must be resolved before a new relationship can be established.\
    \ Methods ensure that the other is detached.\n\n# Quiz: Association, Composition,\
    \ and Aggregation\n\nA normal association is a link between two objects. This\
    \ term correct when one object refers to another object.\n\nA composition and\
    \ an aggregation are a special form of association that says something about a\
    \ lifetime.\n\n+   - In a composition, the lifetime of an associated object is\
    \ bound to the lifetime of another object. Example: object A references object\
    \ B if A \"dies\", i.e., is no longer referenced and can be removed by the garbage\
    \ collector, B also \"dies\", at least a reference does not still exist on B.\n\
    \ An aggregation combines two objects, the referenced objects have their own lifetime.\
    \ If object A associates to another object B and object A is removed, object B\
    \ may still live. The term \"aggregation\" is not often used; people simply use\
    \ the term \"association\", especially in UML diagrams. However, since the term\
    \ \"association\" says nothing about the lifetimes of the referenced objects,\
    \ one could explicitly emphasize this.\n\n# Add Rows with a 1:n Association to\
    \ the Ship\n\n```\ncom/tutego/exercise/device/luyryl/Application.java\nclass Ship\
    \ {\n    private final ArrayList<Radio> radios=new ArrayList<>();\n\n    public\
    \ void load(Radio radio) {\n        radios.add(Objects.requireNonNull( radio )\
    \ );\n    }\n\n    public int countDevicesSwitchedOn() {\n        int result=0;\n\
    \        for ( Radio radio : radios ) {\n            if ( radio.isOn )\n     \
    \           result++;\n        }\n    }\\}\n```"
