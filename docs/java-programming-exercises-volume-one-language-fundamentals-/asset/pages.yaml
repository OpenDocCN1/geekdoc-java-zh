    # INTERFACES COMPARATOR AND COMPARABLE


    A comparison with equals(...) tells whether two objects are equal, but says nothing
    about the order, which is larger or smaller. For this, there are two interfaces
    in Java:


    +   * Comparable is implemented by the types that have a natural order, that is,
    for which there are commonly used ordering criteria. If there are two dates, it
    is clear which was before and which after, or if both dates are the same.

    * There is an implementation of the interface Comparator for each ordering criterion.
    We can sort people by name, but we can also sort by age: that would be two implementations
    of Comparator.


    ![](img/1772db956b1b6830f9a15683dc55dea0_293_0.png)


    FIGURE 11.1 UML diagram of Comparator and Comparable.


