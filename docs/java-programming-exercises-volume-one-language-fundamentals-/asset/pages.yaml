    \  return meter() / 1000;\n}\n```\n\nIf an interface provides a static factory\
    \ method, then of course you can't build an instance from the inter-face. Instances\
    \ can only be built from classes. Hence, we have to provide an implementation\
    \ for the\ninterface, it is called DistanceImplementation in the proposed solution.\
    \ The class provides a\nparameterized constructor and stores the value in meters\
    \ in a private variable. The implementation is also\nresponsible for overriding\
    \ the meter() method; it passes the internal state to the outside.\nThe distance\
    \ interface has four methods. First are the two static factory methods that build\n\
    instances of DistanceImplementation. In the case of meters, the parameter of ofMeter()\
    \ can"
