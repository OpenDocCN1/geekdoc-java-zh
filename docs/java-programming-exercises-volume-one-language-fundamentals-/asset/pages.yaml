    # Quiz: Vodka with Taste


    The exercise tests understanding of type conversion, overriding, and dynamic binding.
    The subclass has the same method as the superclass, the subclass overwrites the
    seasoned() method. Intentionally, the annotation @Override is missing here, but
    it is clear to the compiler that the method is overridden.

    The output is blackjack because the compiler has an object of type vodka in memory
    and all methods are dynamically bound. With the explicit type conversion to AlcoholicDrink,
    it is not possible to suspend the dynamic binding; the reference type known to
    the compiler is irrelevant for the method call. The runtime environment knows
    exactly what kind of object it has in front of it, and the type conversion is
    not necessary for that.


    # Quiz: Rum-Paradise


    The program compiles and can be run without throwing an exception. The outputs
    are:


    +   7

    2


    At its core, the program demonstrates two features of Java: first, how initializers
    work, and the difference between dynamic binding when methods are overridden and
    instance variables cannot be overridden.

    Let''s start with the classes. Both have an instance variable, a constructor,
    and a method. Underneath is the subclass AlcoholicDrink, and since it has the
    same method older(), the method is overridden. Both classes contain their instance
    variable aged, but the instance variable aged in the subclass has nothing to do
    with the instance variable aged in the superclass—in Java, the peculiarity is
    called hiding. The hiding of instance variables is not to be confused with shadowing,
    which occurs when a local variable is named as an instance variable; we do not
    have that in our example: shadowing variable

    To understand the output, we need to know how constructors and initialized instance
    variables are related. Initial instance variables do not exist in bytecode, nor
    do initialize class variables. They have to be implemented via a different constructor.
    The assignment of instance variables is used in each constructor, and the assignment
    of static variables is set in a static initialization block static {} of the class.
    From the code.


    ```

    class Rum extends AlcoholicDrink {

    int aged=3;

    Rum() { aged = 4; }

    }

    ```


    becomes the following:


    ```

    class Rum extends AlcoholicDrink {

    int aged;

    Rum() {

    aged=3;

    }

    ```'
