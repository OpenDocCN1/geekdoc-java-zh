- pgno: 245
  md: "# 7 Records, Interfaces, Enumerations, and Sealed Classes 229\n\nWe put @Override\
    \ to the method to clarify it that a reader is overridden. For the compiler, the\
    \ annotation is not significant because the method has to be implemented in any\
    \ case, and the compiler reports an error if the implementation is missing.\n\n\
    The implementation itself outputs on the command line the toString() representations\
    \ of the first and second electrical devices. Later, when compare(...) method\
    \ is called, we can easily keep track of which electrical devices were fed to\
    \ the method.\n\nAt its core, every Comparator looks identical. It must extract\
    \ the relevant instance variables and then compare them. In this case, the Comparator\
    \ compares the wattages of two electrical appliances, which are represented as\
    \ integers. Instead of manually comparing the two integers by checking the wattage\
    \ of the first is greater than, equal to, or less than the second, we can use\
    \ a method provided by the Java library. The Integer class offers a static method\
    \ compare(int, int) that performs this comparison for us. It returns a negative,\
    \ positive, integer depending on whether the first is less than, greater than,\
    \ or equal to the second. Similar methods are available for other wrapper classes.\n\
    \nThe compare(...) method of our ElectronicDeviceWattComparator class and the\
    \ Integer.compare(...) method are so-called three-way comparison functions which\
    \ get two values and tell the relationship between the values is via three different\
    \ methods.\n\n# Electronic Devices with the Highest Power Consumption\n\ncom/tutego/exercise/device/bdhavq/Ship.java\n\
    \n```\npublic ElectronicDevice findMostPowerConsumingElectronicDevice() {\n  if\
    \ (devices.isEmpty()) {\n    throw new IllegalStateException(\n      \"Ship has\
    \ no devices, there can't be a maximum in an empty collection\"\n    );\n  return\
    \ Collections.max(devices, new ElectronicDeviceWattComparator());\n}\n```\n\n\
    There are different methods in the Java library that you can pass a comparator\
    \ to. Overall these are methods that need to somehow put elements of collections\
    \ into order. This can be in determining maximum or minimum, or in sorting. The\
    \ task specifies the method Collection.max(...) can find out from a collection\
    \ of elements the one that is largest to the Comparator.\n\nThe max(...) method\
    \ must be passed in two things: the first with the elements, the second Comparator.\
    \ If we called our ElectronicDeviceWattComparatorElectronicDevice() method often\
    \ or if needed for other operations, we could think about creating it as an object\
    \ and keeping it, e.g., in a static variable. A Comparator usually never has a\
    \ state, so it can be well handled. But our Comparator instance is only needed\
    \ a few times, it is redundant to keep a reference in memory to one that is rarely\
    \ needed.\n\nThe max(...) returns the largest element, which is also the return\
    \ of findMostPowerConsumingElectronicDevice(). But with one difference: if the\
    \ collection is empty, min()/max(...) will return a NoSuchElementException, which\
    \ we do not want. Therefore, we check beforehand if the collection is empty, and\
    \ throw an exception in that case.\n\nWhen we run the program, we will nicely\
    \ see via the console outputs that compare(...) is automatically called by the\
    \ max(...) method. This is a common occurrence: We do not call the overridden\
    \ methods of interfaces, but the library or framework does."
