    # Quiz: Dazed and Confused ★


    Clean Code is a set of best practices that make code easy to read and understand,
    as well as maintainable, extensible, and testable. Unfortunately, there are enough
    counter-examples.

    What is wrong with the following example?


    ```

    double höhe=12.34;

    double breite=23.45;

    double tmp=2 * (höhe+breite);

