  md: '# 288 Java Programming Exercises


    apple whether it is equivalent to a pear, the answer must always be false. This
    is how the Rectangle does it. The instanceof first checks whether the object type
    is also Rectangle, which includes subclasses. Only then does it proceed with the
    actual checks, the x and y position, as well as height and width of its own object,
    are compared with the other rectangle. If it is not a Rectangle, then the superclass
    deal with the comparison. In the implementation of equals(...), we typically check
    for null or this. However, in this case, those checks have been moved to the superclass.


    ```

    java.lang.String (module java.base)

    ```


    The String class has an equals(...) method, and the Java API documentation describes
    how to implement:

    It compares this string to the specified object. The result is true if only the
    argument is not null and a String object that represents the same sequence of
    characters as this object.

    We don''t need to look further into the implementation.


    ```

    java.lang.StringBuilder (module java.base)

    ```


    The Java documentation does not show an equals(...) method for StringBuilder,
    and the entry under Methods declared in class java.lang.Object shows that an equals(...)
    method comes from Object. The class documentation also states:\StringBuilder implements
    Comparable but does not override equals. Thus, the natural ordering of StringBuilder
    is inconsistent with equals. Care could be exercised if StringBuilder objects
    are used as keys in a SortedMap or elements in a TreeSet. See Comparable, SortedMap
    or TreeSet for information.

    The consequence is that we get into trouble when we put a StringBuilder into a
    data structure because the vast majority of data structures use the equals(...)
    method.


    ```

    java.net.URL (module java.base)

    ```


    Of all the equals(...) methods in the Java library, the one for the URL class
    might the weirdest. The Java documentation explains why:

    URL objects are equal if they have the same protocol, reference equivalent hosts,
    have the same port number on the host, and the same file and fragment of the file.
    Two hosts are considered equal if both hosts can be resolved into the IP addresses;
    else if hostname cannot be resolved, the hostnames must be equal without regard
    to case; or hosts equal to null. Since hosts'' comparison requires resolution,
    this operation is a blocking operation. Note: The defined behavior of equals is
    known to be inconsistent with virtual hosting in HTTP.

    This has far-reaching consequences. Firstly, the equals(...) method can take a
    long time to execute, namely. in the best case, everything is in an internal cache,
    the performance is still worse when a few instances are compared. Furthermore
    network is always required, which means that if the computer is disconnected from
    the network, the equals(...) method cannot respond. Another problem is that the
    equals(...) method can suddenly give a different answer. What may not have been
    the case before can suddenly be the.

    For reason, it is unusual for URL objects to be held in data structures such as
    lists or sets because the standard implementations almost always fall back on
    the equals(...) method. The Java library provides a second class URI that implements
    equals(...) as a simple comparison of instance variables, i.e., Schema, Fragment,
    Path, Query, etc.


