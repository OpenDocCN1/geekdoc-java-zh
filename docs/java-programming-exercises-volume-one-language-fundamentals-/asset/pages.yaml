  md: "# Nested Types\n\nIn the previous examples, we had always had exactly one type\
    \ of declaration in each file, the so-called compilation unit. However, Java also\
    \ allows for nested types, where a type declaration can be placed inside another\
    \ type declaration, making the relationship between them even closer. The exercises\
    \ demonstrate the usefulness of nested types, but there are also some potential\
    \ issues that need to be considered.\n gain a deeper understanding of nested types,\
    \ several quizzes will be provided.\n\nPrerequisites\n\n+   - Know static nested\
    \ types.\n- Know inner types (nonstatic nested types).\n- Know local (inner) types.\n\
    - Know anonymous inner class.\n\n# DECLARE NESTED TYPES\n\nNested types are useful\
    \ whenever the inner type has a tight coupling to the outer type, or when a type\
    \ declaration should be kept \"secret\" because it should not be visible to other\
    \ types or even other methods. The next two tasks show examples for each these\
    \ reasons.\n\n# Set AM–FM Modulation to Radio Type ★\n\nIn the assignment \"Giving\
    \ radio an AM–FM modulation\" from the previous chapter \"Writing your own classes\"\
    \ we declared the enumeration type Modulation, in a separate Java file. The declaration\
    \ looked like this:\n\n```\npublic enum Modulation { AM, FM }\n```\n\nThe sound\
    \ waves of tones are modulated, resulting in radio waves, which the radio receives\
    \ and translates back into sound waves. Since a radio always requires modulation,\
    \ the type Modulation can be placed in the Radio and this tight coupling can be\
    \ represented with nested types. For example, this makes it easy to separate the\
    \ modulation of sound waves of a radio from the modulation of a video signal;\
    \ such a second encryption could be placed in a class TV.\n\n+   - Put the enumeration\
    \ type Modulation in the class Radio.\n- When we call setModulation(...) on a\
    \ radio, how is AM/FM qualified and passed?"
