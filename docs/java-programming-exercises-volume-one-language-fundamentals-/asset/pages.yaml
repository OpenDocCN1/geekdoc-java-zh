  md: '# Exception Handling


    Unforeseen errors can occur at any time. Our programs must be prepared for them
    and be able to handle this situation. The next exercises will be catching exceptions,
    handling them, and even reporting via exceptions.


    # Requirements


    +   - Understand the need for exceptions.

    - Distinguish between checked and unchecked exceptions.

    - Catch exceptions with try-catch.

    - Know exception forwarding with throws.

    - Be able to throw exceptions with throw.

    - Be able to write your own exception classes.

    - Be able to close resources with try-with-resources.


    Data types used in this chapter:


    +   - java.lang.Throwable

    - java.lang.Exception

    - java.lang.RuntimeException

    - java.lang.Error

    - java.io.IOException

    - java.lang.AutoCloseable


    # CATCHING EXCEPTIONS


    Checked exceptions must be caught or passed up to the caller. For checked exceptions,
    the compiler forces us to do this, and for unchecked exceptions, this is not mandatory;
    however, if we do not handle RuntimeException, this will cause the executing thread
    to abort. Therefore, it is recommended to always catch and at least log unchecked
    exceptions.


