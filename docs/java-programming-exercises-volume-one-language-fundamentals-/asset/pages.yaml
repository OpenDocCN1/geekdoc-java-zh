    # Develop Record for Complex Numbers ★


    Complex numbers are an important mathematical concept used in various fields such
    as engineering, physics, and computer science. A complex number consists of a
    real part and an imaginary part. It is written in the form a+bi, where a is the
    real part and b is the imaginary part. Mathematical operations are realized as
    follows:


    +   - Addition and Subtraction: The operation is performed element-wise, meaning
    the real/imaginary part of one number is added/subtracted with the real part of
    the other number.

    - Multiplication: The operation follows the rule: (a+bi)×(c+di)=(ac-bd)+(ad+bc).

    - Absolute value of a complex number: The absolute value of z=a+bi is defined
    as |z|=sqrt(a²+b²).


