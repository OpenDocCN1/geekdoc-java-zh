    # Quiz: Array Types


    The variable declarations and assignments from string1 to string4 and int and
    int2 are less interesting; we know the syntax: an array is pre-initialized with
    either a fixed size or elements.


    It''s worth noting the following type conversions, which can be performed explicitly
    or implicitly. We must distinguish between type conversions that are fine for
    the compiler and type conversions that cause only trouble at runtime. This is
    an important distinction, which also becomes clear in the terms object type and
    reference type. For the compiler there are variables and a reference type, the
    compiler does not know what is going on at runtime. The environment, on the other
    hand, does not know which variable was declared, but does know what kind of object
    has in front of it: We, therefore, speak of the object type. For the compiler,
    it is a string array and for the runtime environment.


    The first statement is the most honest one declared, String[] is a subtype of
    Object[]. This is very significant because exactly this is covariant: A String
    array is a subtype of an Object array, also a Point[] is a special Object]. This
    is also evident in the third line, where the explicit type conversion is missing
    because it is implicit.


    In the fourth statement, runtime environment and compiler know different things.
    For the runtime environment, there is still a String array in memory, but the
    compiler knows the String only as an Object array. This notation is valid in principle,
    and an implicit type conversion takes places.


    In the fifth statement, we upgrade the Object array to a String array. This works
    at compile and also at runtime.


    In the sixth statement, we directly build a String array and declare it as a String
    array This is the usual notation. In the seventh statement, we convert the String
    array to the Object array. This statement is fine.


    The eighth and ninth statements are tricky: the compiler does not build a String
    array but an Object array and puts references into this Object array. As a result,
    there is no String array, only an Object array that references strings. In the
    ninth line, the compiler trusts our decision to cast the Object array to a String
    array. The compiler accepts this, and there is no compiler error. However, a problem
