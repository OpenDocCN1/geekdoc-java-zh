  md: "```\npublic Firebox() {\n  on();\n}\n@Override void off() {\n  System.out.println(\"\
    A firebox is always on, you can't switch it off\");\n}\n```\n\nFirebox is another\
    \ subclass of ElectronicDevice. The class inherits everything from the superclass,\
    \ overwrites the off() method. In the body, there is only a console output; the\
    \ on/off flag is not modified. With the annotation Override, we mark that the\
    \ method already exists in the superclass, but we overwrite it in the subclass\
    \ with new behavior.\n\nFor the compiler—and the runtime environment—the annotation\
    \ is not essential; know when a method is written. But with the annotation, the\
    \ compiler can detect errors, such as typos or subclass changes, for example,\
    \ the parameter list in the superclass, that the method in the subclass is no\
    \ longer overwritten, but only overloaded.\n\nWe have often overridden a method,\
    \ but perhaps we haven't noticed it yet: toString(). The method comes from the\
    \ absolute subclass java.lang.Object.\n\nSince a fire alarm should be on after\
    \ it is created, we implement a constructor and call on().\n\n# Calling the Methods\
    \ of the Superclass\n\nTo save code, the proposed solution for TV is a bit more\
    \ reduced and has only a unidirectional relationship with the MonitorTube.\n\n\
    ```\ncom/tutego/exercise/device/rojnsv/TV.java\n\nclass TV extends ElectronicDevice\
    \ {\n  private MonitorTube monitorTube=new MonitorTube();\n\n  @Override void\
    \ on() {\n    super.on();\n    monitorTube.on();\n  }\n\n  @Override void off()\
    \ {\n    super.off();\n    monitorTube.off();\n  }\n```\n\nWhen overwriting, the\
    \ original implementation of the superclass is replaced by a new implementation.\
    \ There is no contradiction in combining the two—one on the hand, realizing a\
    \ new implementation for a method and on the other still calling the original\
    \ implementation. Java makes this possible with the keyword super. The keyword\
    \ super exists in two versions: one for calling the constructor of the superclass\
    \ and once for calling an overridden method super brings us into the namespace\
    \ of supertype. If we were to call a method without super, we would run into a\
    \ recursion.\n\nOn the one hand, the TV should store the state of whether it is\
    \ on or off, and the methods of the superclass on() and off() do that. The TV\
    \ must call these methods to get the state of the superclass. On the other hand,\
    \ the on()/off() methods on the TV need to turn the monitor tube on and off, and\
    \ that is handled by delegation. Delegation means one object passes the call to\
    \ another object; When the TV is turned on or off, the monitor tube is also turned\
    \ on or off."
