    \ it to its data structure, to have an internal sorted list after adding.\n\n\
    # Static and Default Methods in Interfaces ★★★\n\nInterfaces can contain static\
    \ methods and serve as factory methods, that is, they can provide instances of\
    \ classes that implement that interface.\n\nTask:\n\n+   1. Create an interface\
    \ Distance.\n2. Set two static methods Distance ofMeter(int value) and Distance\
    \ ofKilometer(int value) in Distance, which return a new object of type Distance.\n\
    3. Set in Distance an abstract method meter(). What must be implemented?\n4. Set\
    \ a default method kilometer() in the Distance interface.\n\nExample in use:\n\
    \nDistance oneKm=Distance.ofKm( 1 );\nSystem.out.printf(\"1 km=%d km, %d m\\n\"\
    , oneKm.kilometer(), oneKm.meter());\n\nDistance moreMeter=Distance.ofMeter( 12345);\n\
    System.out.printf(\"12345 m=%d km, %d m\\n\", moreMeter.kilometer(), moreMeter.meter());\n\
    \n# Deleted Elements with Predicate ★★\n\nIf we want to make shops energy efficient,\
    \ we need to remove all devices with excessive power consumption.\n\nThe List\
    \ method removeIf(Predicate<...>) deletes all elements that satisfy a predicate.\
    \ The ArrayList is an implementation of the List interface, so the method is available\
    \ on an ArrayList.\n\nFor example, if we want to delete from a List<String> empty\
    \ strings, we can call removeIf(new IsNotEmpty()) on the list, where IsNotEmpty\
    \ is declared as follows:\n\n```\nclass IsNotEmpty implements Predicate<String>{\n\
    \    @Override public boolean test( String t ) {\n        return t.trim().isEmpty();\n\
