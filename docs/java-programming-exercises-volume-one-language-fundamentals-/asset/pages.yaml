    Example: We can use to build radio constructors in the following way:


    ```

    Radio r1=new Radio();

    Radio r2=new Radio( 102. );

    Radio r3=new Radio( "BFBS" );

    ```


    # Implement Copy Constructor ★


    If an object of the same type is assumed to be a template in the constructor of
    a class, we refer to this a copy constructor.

    Task:


