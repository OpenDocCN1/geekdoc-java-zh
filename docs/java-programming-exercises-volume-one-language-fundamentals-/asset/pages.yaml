  md: '# SIMPLE ENUMERATIONS


    Enumerations are closed sets built in Java using the keyword enum.


    # Give Radio an AM-FM Modulation ★


    Modulation is vital in radio transmissions; there is AM (amplitude modulation)
    and FM (frequency modulation).¹

    Task:


    +   - Declare a new enumeration type Modulation with the values AM and FM in its
    own file.

    - Add a private instance variable Modulation modulation to Radio where the radio
    keeps the modulation.

    - Set the Modulation via a new Radio method setModulation(Modulation modulation),
    a getter can also exist.

    - Customize the toString() method in Radio.


    # Set Valid Start and End Frequency for Modulation ★


    For broadcasting, three frequency ranges (called frequency bands) are classified,
    which encode over AM:


    +   - Longwave: 148.5–283.5 kHz.

    - Mediumwave: 526.5–1,606.5 kHz.

    - Shortwave: shortwave broadcasting uses several bands between 3.2 and 26.1 MHz.


    Coded over FM:


    +   - Ultra-shortwave (FM): 87.5–108 MHz.

    Task:


    +   - Add two new private instance variables:

    - minFrequency

    - maxFrequency

    - When calling setModulation(Modulation), the instance variables minFrequency
    and maxFrequency are to be set to their minimum and maximum value ranges, namely,
    for AM 148.5 kHz to 26.1 MHz and for FM 87.5–108 MHz.


    # CONSTRUCTORS


    Constructors are special initialization routines that are automatically called
    by the virtual machine when an object is created. We often use constructors to
    assign states when creating objects, which we then store in the object.'
