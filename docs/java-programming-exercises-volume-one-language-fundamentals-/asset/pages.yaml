    # ASSOCIATIONS


    An association is a dynamic connection between two or more objects. We can characterize
    association in several ways:


    +   - Does only one side know the other, or do both sides know each other?

    - Is the lifetime of one object related to the lifetime of another object?

    - With how many other objects does an object have an association? Is there a connection
    to only one object or several? For 1:n or n:m relationships, we need containers,
    like arrays or dynamic data structures like the java.util.ArrayList.


    # Connect Monitor Tube with TV ★


    So far, we have one electrical appliance: a radio. It''s time to add a second
    electrical device and includes a 1:1 association.


    +   - Create a new class TV.

