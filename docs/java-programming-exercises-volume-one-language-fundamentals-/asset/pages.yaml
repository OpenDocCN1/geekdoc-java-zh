    Anything in Java that has to do with a data store can throw exceptions. The Java
    standard library uses checked exceptions by default, for input/output operations
    we define. Frameworks and open-source libraries are more likely to utilize unchecked
    exceptions because it is more convenient to just let the exceptions go until there
    is a handler.

    A look at theavadoc of Files shows that an IOException is thrown


    ```

    public static List<String> readAllLines(Path path) throws IOException

    ```


    Read all lines from a file. By bytes are decoded into characters using the UTF-8
    charset.

    Throws: IOException – if an I/O error occurs reading the file or a malformed or
    unacceptable byte sequence is read.

    Whether checked or unchecked exceptions, we should react to exceptions. Java offers
    two ways to do this:


    +   - We could write either a throw to the method, which passes the exception
    to the caller of the method, or

    - We handle the with a try-catch block


    Since IOException is a checked exception, we must handle the exception. Our solution
    uses a try-catch block. If an exception occurs, the catch block is processed.
    This is followed by the output on the standard error channel, and the printStackTrace()
    method prints a call stack on the command line as well. printStackTrace() originates
    from Throwable, the base class of all exceptions. It is a matter of whether you
    want this form of output; you won''t find such a thing in production software,
    where you would use a logger to report exceptions.

    The chosen solution works as follows: we note the longest and second-longest line
    in the variables first and second. The extended for runs over lines, reads and
    examines each. Now each line is considered. If the length of line is longer than
    the length of the first stored string first, then we find a new candidate for
    the longest line, so that the previously longest line is now the second-longest
    line. However, if first was longer than line, nothing is updated, but line may
    still be longer than second, so we test again with the second stored line.

    at the end of the for loop, we output the first and second lines.

    al alternative solution is to use a Comparator to sort the list based on the length
    of lines. However, sorting the entire list may be unnecessary if we only need
    to find the two longest lines. If performance is not a concern, sorting may be
    the most concise solution. Furthermore, sorting has the added benefit of easily
    accommodating extensions to the task, such as finding the first ten lines instead
    of just the first two.


