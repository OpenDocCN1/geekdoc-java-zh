  md: "# 2 • Imperative Programming 39\n\nThe concept is the following: $a \\times\
    \ b$ is equivalent to $1/1 \\times a \\times b$, which is equivalent to $2/2 \\\
    times a \\times b$, which is equivalent to $(a/2) \\times (2 \\times b)$. Let's\
    \ test that:\n\n$4 \\times 3 = (4/2) \\times (3 \\times 2) = 2 \\times 6 = 12$\n\
    \nFrom $4 \\times 3$ we have come to $2 \\times 6$. And that would be by the same\
    \ rule $(2/2) \\times (6 \\times 2) = 1 \\times 12 = 12$. You see: when the multiplier\
    \ is 1, this is a coincidence (A product results from the multiplication of factors.\
    \ The first factor is called **multiplier**, and the second is **multiplicand**).\n\
    A second example:\n\n| MULTIPLIER | MULTIPLICAND |\n| 8 | 7 |\n| 4 | 14 |\n| 2\
    \ | 28 |\n| 1 | 56 |\n\nThe multiplier has reached 1 and the multiplicand coincides\
    \ with 56.\nAn algorithm would be quickly formulated: a loop runs as long as the\
    \ multiplier is $>0$. In the body of the loop, divide the multiplier by 2 and\
    \ multiply the multiplier by 2. However, there is a problem ...nThe multiplier\
    \ is not always an even number. If the product of $11 \\times 6$ is to be calculated,\
    \ $5.5 \\times 12$ of course, gives the same result, but we don't want to use\
    \ floating-point numbers. If we calculate $11 \\times 6$ as known, the integer\
    \ division will be $(11/2) \\times (6 \\times 2)=5 \\times 12=60$. The correct\
    \ result is 66. We are missing 6. The multiplier is 6. This is a coincidence?\n\
    \ and even numbers are always different by one. If $a$ is an odd number, $a-1$\
    \ is an even number, $(a-1) \\times b$. For example, $11 \\times 6 = (11-1) \\\
    times 6 = (10+1) \\times 6 = 10 \\times 6 + 6 \\times 6 = 60+6=66$. Expanding\
    \ the product leads to $(a-1) \\times b$. That's right. You could continue like\
    \ this and calculate $10 \\times 6$ as well.\nLet's come back to the algorithm\
    \ that divides the multiplier by two until one is reached. If a multiplier is\
    \ odd, the multiplier is reduced by one until it is even again for the next division\
    \ step and a \"correction value\" is noted. Since there can be multiple corrections,\
    \ they are all summed.\n\n| PRODUCT | MULTIPLIER ODD? | REWRITE MULTIPLIER IS\
    \ ODD | CORRECTION VALUE |\n| $2 \\times 3$ | No | $(10+1) \\times 6=10 \\times\
    \ 6$ | 66 |\n| $11 \\times 6$ | Yes | $(4+1) \\times 12=4 \\times 12$ | 12 |\n\
    | $2 \\times 4$ | No | | |\n| $1 \\times 8$ | Yes | $(0+1) \\times 48=0 \\times\
    \ 48$ | 48 |\n\nThe sum of $6+12+48$ is 66, and that is $22 \\times 3$. Written\
    \ in a nested way:\n\n$22 \\times 3 = 11 \\times 6 = (10 \\times 6) + (4 \\times\
    \ 12) + 6 = (48) + 12+6=66$.\n\nMultiplying any integer would only require adding\
    \ values, multiplying by and dividing by 2. And, it must be possible to test whether\
    \ a number is even or odd."
