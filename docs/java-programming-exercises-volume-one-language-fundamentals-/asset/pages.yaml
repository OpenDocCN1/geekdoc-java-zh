- pgno: 291
  md: '# Special Types from the Java Class Library


    The class library includes thousands of types, with a huge number added via the
    Java Enterprise Frameworks and open-source libraries. Frankly, you don''t need
    to know all of these types to write software successfully. Much of Java SE is
    also very low level and intended more for framework developers.

    Some common types are particularly related to the language, so even the compiler
    knows them. We need to understand these so that we can make the most of the language''s
    capabilities. This chapter is therefore about the superclass Object, which methods
    are relevant for us, ordering principles, of primitive types, and wrapper types
    (autoboxing).


    # Prerequisites


    +   - Know the difference between == (identity) and equals(...) (equivalence).

    - Be able to implement equals(...) and hashCode().

    - Implement Comparator and Comparable for ordering criteria.

    - Understand the working of autoboxing.


    Data types used in this chapter:


    +   - java.lang.Object

    - java.lang.Comparable

    - java.util.Comparator

    - java.lang.Double

    - java.lang.Integer


    # ABSOLUTE SUPERCLASS java.lang.OBJECT


    From Object, there are three methods that subclasses usually override: toString(),
    equals(Object) and hashCode(). While identity is tested with== and != equivalence
    is handled by the equals(Object) method. equals(Object) and hashCode() are always
    implemented together so that both match each other; for example, if the hash code
    of two objects is not equal, equals(...) returns false and if equals(...) returns
    true, the hash codes must also be equal. There are certain rules to follow when
    implementing this, which is why the next two tasks focus on equals(Object) and
    hashCode().'
  merge: -1
  img_proc: true
