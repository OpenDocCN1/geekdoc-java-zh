    implementation. The visibility modifier public is also unnecessary because the
    abstract methods of an interface are automatically public. By the way, the visibility
    modifier should be first, but in our case, we should remove both keywords.


    # MoreDistance


    At first glance, the MoreDistance interface looks the same as Distance; however,
    we would need to take a look at inheritance, which gives MoreDistance two abstract
    methods, namely, its own and the inherited from the base type. In this, there
    are two abstract methods in the interface; this is invalid for functional interfaces.


    # MoreDistance2


    The interface is functional because it contains exactly one abstract method, from
    the extended interface Distance. Whether an interface itself contains an abstract
    method or inherits one from the superclass is irrelevant. If an interface has
    exactly one abstract method, it can still have any number of default or static
    methods; it remains a functional interface.


    # DistanceImpl


    The interface contains a default implementation, which is fine as such; however,
    this does not count as a functional interface. A functional interface must declare
    exactly one abstract method. This method must not already have implementation
    as a default method.


    # DistanceEquals


    This is a functional interface even though it has two methods. But this is because
    the method equals(...) is a special method from java.lang.Object, which is always
    present on every object anyway. You put the equals(...) method in an interface
    now and then, so that an individual Javadoc can describe the meaning of the method.


