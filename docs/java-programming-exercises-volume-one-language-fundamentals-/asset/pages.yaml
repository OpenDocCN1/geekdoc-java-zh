    # Quiz: Well Caught


    General catching of every exception is not recommended. This notation often catches
    and handles exceptions that do not belong to the same error category at all, such
    as programming errors that throw a NullPointerException.


    The base type Throwable is a bit worse under Throwable there is also Error, so
    that catch (Throwable e) catches, for example, a StackOverflowError as well. If
    you catch an exception, you want to handle it. However, an Error usually indicates
    a problem with the JVM that cannot be handled.


    # Quiz: Too Much of a Good Thing


    The program compiles and executes, but attempting to create a huge byte array
