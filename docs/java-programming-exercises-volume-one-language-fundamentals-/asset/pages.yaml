  md: '# Detect Repetitions


    Before we look at the solution in code, the algorithm that solves the problem
    must be clear. Let us take the simple string aaa as example. Humans, we have no
    problem immediately recognizing the pattern that repeats three times. A program
    could do the following: it could take the first character of aaa—that is, a—repeat
    until the string has length 3. Then we compare whether it remains the initial
    string aaa. What aboutabab? If the program starts repeating the first character,
    aaaa is created, and the comparison with the original ababab turns negative. In
    the next step, the program can take the first two characters ab and repeat them,
    and the result is ababab, which matches the original. We have a match.


    With the simple algorithm, we can test with any length; for repetitions of substrings
    of length 1, 2, 3, 4 ... However, it helps us to consider what the valid solutions
    will be (Table 5.1).

    From the table, we can see that ab, for example, cannot be used to create strings
    of length 3, and abcd cannot be used to create strings of length 2.


    If we have a string with two characters, the strings generated from it can be
    a multiple of two, so if we have two characters, can be four characters long,
    can be six characters long, and so on.\ If we have a string with three characters,
    we can repeat from it with three characters, six characters, nine characters,
    and so on.


    Let''s run the game around. We don''t know what the substring looks like and how
    long it is, we know the output string. For example, if the output string is 12
    characters long, what are the possible repeating strings?


    ```

    aaaaaaaaaaaa

    ababababab

    abcabcabc

    ababcdabcd

    ababcdef

    ```


    These are repetitions of a, ab, abc, abcd, abcdef; the length of these strings
    are the divisors of 12, which are 1, 2, 3, 4, and 6. Other combinations are not
    possible. In particular, the substring cannot be longer than half the string length
    because the duplication is longer than the original string. So, in a naive approach,
    we could go from up to n/2 for a total string length of n; if we want to better,
    we go up only the divisors.


    TABLE 5.1 Valid repetitions of length 1, 2, 3, 4, 5, 6


    | PARTIAL SEQUENCE | OF LENGTH 1 | 2 | 3 | 4 | 5 | 6 |

    | --- | --- | --- | --- | --- | --- | --- |

    | a | a | aa | aaa | aaaaa | | aaaaa |

    | ab | | ab | | abab | | ababab |

    | abc | | | abc | | | abcabc |

    | abcd | | | | | abcd | | |

    | abcde | | | | | abcde | | |

    | abcdef | | | | | | | abcdef |'
