    # Quiz: Excluded


    When we run the program, it gives the following output for version 1:


    ```

    close() ResourceA

    close() ResourceB

    close() ResourceA

    ```


    And the following output for version 2:


    ```

    close() ResourceA

    close() ResourceB

    ```


    Both resources are AutoCloseable, so the types in the try can be used with resources.
    The close() method of the first resource, ResourceA, prints a message on the screen.
    The second resource, ResourceB, wraps the first one. When close() is called on
    ResourceB, close() is first called from the wrapped ResourceA and then outputs
    a screen message. This is common behavior for/output streams in Java.


    In versions 1 and 2, the output differs for the reason: in the first version,
    the try-resources involves two resources that are closed in reverse order. After
    ResourceA was opened first, followed by ResourceB, ResourceB is the first to be
    closed, and after ResourceA. A call to close() on ResourceB will close ResourceA
    first, and from that, we have the first screen output. Then it goes back to the
    close() method of ResourceB, and we the screen output. With this construction,
    we see that ResourceA also calls the close() method. Which may cause a problem.
    There are special resources that you are not allowed to close twice. So, an exception
    may be on a second close() because closing twice is not allowed. However, most
    resources in Java can handle closed multiple times just fine and ignore. It is
    important to study the API documentation to determine whether a resource may be
    closed without an exception.


    Variant 2 prevents ResourceA from being closed. This means this variant has an
    advantage. There is also a disadvantage: ResourceA is not closed if the constructor
    ResourceB throws an exception. The object of ResourceA created by new is not internally
    referenced by a variable and does not participate in the closing process of try-resources.


    Both variants have their drawbacks. In Java, variant 1 is often preferred because
    it can handle being closed twice. Variant a clearer execution of different resources,
    and Variant 2 is also acceptable since wrapped constructors do not throw exceptions,
    except for cases the resource is null, but for later operations.'
