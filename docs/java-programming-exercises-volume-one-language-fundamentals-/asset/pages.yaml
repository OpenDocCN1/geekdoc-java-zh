- pgno: 17
  md: '# Introduction


    Many beginners in programming often ask themselves, “How can I strengthen my skills
    as a developer? How can I become a better programmer?” The answer is simple: study,
    attend webinars, learn, repeat, and discuss your work with others. Many aspects
    of programming are similar to learning new skills. Just as a book can''t teach
    you how to play a musical instrument, watching the Fast and the Furious movie
    series won''t teach you how to drive. The brain develops patterns and structures
    through repeated practice. Learning a programming language and a natural language
    have many similarities. Consistent use of the language and desire to express and
    communicate in it (just as you need to do to order a burger or a beer) lead to
    gradual improvement in skills.


    Books and webinars on learning a programming language are available, but reading,
    learning, practicing, and repeating are just one aspect of becoming a successful
    developer. To create effective software solutions, you need to creatively combine
    your knowledge, just as a musician regularly practices finger exercises and maintains
    their repertoire. The more effective your exercises are, the faster you will become
    a master. This book aims to help you progress and gain more hands-on experience.


    Java has more than 2,300 classes, about 1400 interfaces, close to 140 enumerations,
    50 exceptions, and records are included as well. However, only a fraction of these
    types are relevant in practice. This book selects the most important types and
    methods for tasks, making them motivating and following Java conventions. Alternative
    solutions and approaches are also presented repeatedly. The goal is to make nonfunctional
    requirements clear because the quality of programs is not just about “doing what
    it should”. Issues such as correct indentation, following naming conventions,
    proper use of modifiers, best practices, and design patterns are essential. The
    proposed solutions aim to demonstrate these principles, with the keyword Clean
    Code.


    # PREVIOUS KNOWLEDGE AND TARGET AUDIENCE


    The book is aimed at Java developers who are either new to Java or are already
    advanced and wish to learn more about the core language features. The intended
    audience includes:


    +   * Computer science students.

    * IT specialists.

    * Java programmers.

    * Software developers.

    * Job applicants.


    The book is centered around tasks and fully documented solutions, with detailed
    explanations of Java peculiarities, good object-oriented programming practices,
    best practices, and design patterns. The exercises are best with a textbook, as
    this exercise book is not a traditional textbook. A useful approach is to work
    through a topic with a preferred textbook before attempting the exercises that
    correspond to it.'
