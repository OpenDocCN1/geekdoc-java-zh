  md: '# # Writing Your Own Classes


    We''ve already created multiple classes. However, these classes have only utilized
    static fields and methods, and we haven''t leveraged them to create instances
    yet. While we have crafted objects using classes from the Java standard library,
    we aim to broaden our understanding. We''re now looking to design our own classes
    and create instances of these custom types.

    This chapter is about electronic consumer devices, and the devices we will build
    on each other. We will first build simple electrical devices such as radios and
    televisions; later we will realize abstractions and collect these electrical devices
    on a ship. When CaptainCiao and Bonny Rain go on vacation. As a reminder, inheritance
    is what we refer to as a "has" or "knows" relationship; an inheritance is an "is-a-kind-of"
    relationship.


    # ## Prerequisites


    +   - Be able to create new classes.

    - Be able to set instance variables in classes.

    - Be able to implement methods.

    - Know visibility private, package visible, and public.

    - Be able to use static methods and fields.

    - Be able to declare and use enumeration types.

    - Know how to implement simple and overloaded methods.

    - Know types of associations.

    - Be able to implement 1:1 association.

    - Be able to use a List.

    - Be able to use delegation of operations.

    - Be able to implement inheritance relations with extends.

    - Be able to override methods.

    - Understand the two meanings of super.

    - Be able to use dynamic binding.

    - Be able to use and declare interfaces.

    - Use default methods in interfaces.


    Data types used in this chapter:


    +   - java.util.ArrayList

    - java.util.Timer

    - java.util.TimerTask

    - java.util.Comparator

    - java.util.function.Predicate'
