  md: "# Writing Your Classes 199\n\n```\npublic static void off() {\n    tracingIsOn=false;\n\
    }\n```\n\n```\npublic static void trace( String msg ) {\n    if ( tracingIsNot\
    \ ) {\n        System.out.println( msg );\n    }\n}\n```\n\n```\npublic static\
    \ void trace( String format,Object... args ) {\n    if ( tracingIsOn ) {\n   \
    \     System.out.printf( format+\"%n\", args );\n    }\n}\n```\n\nThe Tracer has\
    \ a private static variable tracingIsOn, in which we keep track of whether tracing\
    \ output is desired or not. The methods on() and off() set tracingIsOn. It is\
    \ important that not only the methods are static but also the variable tracingIsOn.\
    \ It would work if the methods were connected to the class, but tracingIsOn were\
    \ connected to an object. Static methods can only access their own classes, unless\
    \ they get to an object, via a parameter, or they build one themselves. The actual(...)\
    \ methods use this state to check whether they should output something to the\
    \ screen.\n\nThe named trace(String format, Object... args) delegates to System.out.printf(...)\
    \ and appends an end-of-line character to the format string to make it behave\
    \ like println(). The advantage of this method is that it can be more performant\
    \ than string concatenations are not.\n\n+   There are various logger libraries\
    \ in Java for real enterprise use, also the Java SE brings something rudimentary\
    \ with java.util.logging.\n\n# Quiz: Nothing Stolen\n\nThe program cannot be compiled\
    \ because static and nonatomic properties are being mixed here. The core of the\
    \ problem is accessing the instance variable value in the print(...) method. However,\
    \ value is an instance variable, not a static variable.\n\nThe fact that the parameter\
    \ variable is capitalized is just an irritation; println(...) would fall back\
    \ to Value, which would be fine, the instance variable would be out of the picture.\n\
    \nThe call to the static method in the main(...) via the object reference is unnecessary\
    \ and only misleading. If the method would use its own instance variable, it would\
    \ not need the argument either.\n\n# Give Radio an AM–FM Modulation\n\ncom/tutego/exercise/device/ewslfg/Modulation.java\n\
    \n```\npublic enum Modulation {\n    AM, FM\n}\n```\n\nModulation declares the\
    \ two enumeration elements AM and FM. We capitalize them because they are constants,\
    \ and constants are typically capitalized. Each constant references an object\
    \ as enumeration elements are reference variables. That is, AM and FM reference\
    \ objects of type Modulation."
