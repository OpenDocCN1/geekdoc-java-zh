  md: "# 7 • Records, Interfaces, Enumerations, and Sealed Classes 235\n\nThe function\
    \ argument is enumeration elements (via this), but since they have associated\
    \ ordinal numbers, in the enumeration type, the mapping can also be understood\
    \ from an integer to a CandyType:\n\n```\nnext: int -> CandyType\n```\n\nMappings\
    \ of this type can be well implemented with associative data structures, with\
    \ the pleasant feature here that the ordinal numbers of the enumeration elements\
    \ start at 0 and that the numbers are ascending gaps. An array can be used, and\
    \ this is the second proposed solution:\n\n```\ncom/tutego/exercise/lang/AddictiveQualityCandy.java\n\
    \nprivate static CandyType[] NEXT={\n\n    // CARAMELS, CHOCOLATE, GUMIES,\n \
    \   LICORICE, LOLLIPOPS, CHEWING_GUMS, COTTON_CAND\n    CARAMELS, CARAMELS, CHOCOLATE,\
    \ GUMMILL, GUMMIS, LOLLIPOPS\n\npublic CandyType next() {\n    if (this == LOLLIPOPS)\
    \ {\n        return Math.random() > 0.5 ? LICORICE : CHEWING_GUMS;\n    }\n  \
    \  return NEXT[ordinal()];\n}\n```\n\nThe program contains an array, which contains\
    \ each of the following candies. The next() method retrieves the ordinal number\
    \ and then jumps to the array. If new enumeration items are added, we need to\
    \ adjust the array.\nThe only problem remains LOLLIPOPS, which the program checks\
    \ with special treatment. In the array, there is null at this position because\
    \ there is never access to this element.\n\n# Lambda Solution for Advanced Users\n\
    \nStill not nice this mixture with an array on one side and the special handling\
    \ inside next() on the other. Therefore, we want to finish with a very advanced\
    \ third variant, which is based on a whole set of Java possibilities:\n\n```\n\
    com/tutego/exercise/lang/AddictiveQualityCandy.java\n\ninterface CandyTypeSupplier\
    \ extends <CandyType> {\n\nprivate static CandyTypeSupplier[] NEXT={\n    ()->CARAMELS,\
    \ ()->CARAMELS, ()->CHOCOLATE, ()->GUMMIS,\n    ()->Math.random()>0.5 ? LICORICE\
    \ : CHEWING_GUMS, ()->GUMMIS, ()->LOLLIPOPS\n};\n\npublic CandyType next() {\n\
    \    return NEXT[ordinal()];\n}\n```\n\nAt the core, we have an array, but now\
    \ contains producers for CandyType objects rather than CandyType objects. For\
    \ producers, there is an interface: Supplier. Supplier is a generic type, and\
    \ since generic array don't fit together properly, we create a special type CandyTypeSupplier,\
    \ which is a Supplier for CandyType."
