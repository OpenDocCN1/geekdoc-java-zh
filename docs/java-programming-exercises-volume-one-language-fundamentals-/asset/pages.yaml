  md: "# Java Programming Exercises\n\n```\npublic String toString() {\n    return\
    \ \"Radio[volume=\"+volume+\", is \"+(ison ? \"on\" : \"off\")+\"\";\n}\n```\n\
    \nThe methods can be divided into three groups:\n\n+   - Methods that access the\
    \ variable volume.\n- Methods that access isOn.\n- The toString() method, which\
    \ accesses isOn in read-only mode.\n\nTo check the value and set the variable\
    \ volume, a new changeVolume(...) method has been created that we've implemented\
    \ between Java It introduces a new method that sets the volume directly; it must\
    \ be private. This frees our methods for responsible for slightly increasing or\
    \ decreasing the volume from directly handling the variable setting. The implementation\
    \ ensures that the new volume remains between 0 and 100. What've implemented here\
    \ is also called saturation arithmetic (https://en.wikipedia.org/wiki/Saturation_arithmetic),\
    \ so all operations must run within a fixed range and cannot exceed. Java 21 introduces\
    \ a new method clamp(long, int, int) which our implementation utilizes; before\
    \ Java 21, one could solve the range restriction with volume=Math.min(Math.max(volume,\
    \ 0), 100). toString method follows a common structure: After the type name, which\
    \ is a kind of prefix, key-value pairs follow. Instead of just taking the instance\
    \ variable isOn as a boolean representation true or false in the string, the condition\
    \ operator returns an individual identifier on or off. Extra assignment in assignment:\
    \ The toString() method can be generated by the development environment. Find\
    \ out how to do this.\n\n| Radio |\n| --- |\n| isOn: boolean |\n| volume: int\
    \ |\n| changeVolume(value: int): void |\n| volumeUp(): void |\n| volumeDown():\
    \ void |\n| on(): void |\n| off(): void |\n| isOn(): boolean |\n| +toString():\
    \ String override |\n\nFIGURE 6.9 UML diagram of Radio with instance variables\
    \ and methods.\n\n# Private Parts: Make Instance Variables Private\n\nWe put the\
    \ keyword private in front of the instance variables and in front of the method\
    \ changeVolume(int):\n\n```\nprivate boolean isOn;\nprivate int volume;\n```\n\
    \n```\nprivate void changeVolume( int value ) {\n    volume=Math.min( Math.max(\
    \ volume, 0 ), 100 );\n}\n```"
