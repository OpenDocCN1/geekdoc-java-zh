    # VARIABLES AND DATA TYPES


    Variables store information, and variables always have a type in Java. The compiler
    knows at times what kind of variable is declared, and what type of expression
    is in front of him.

    Java has built-in data types: boolean, byte, char, short, int, long, float, double.
    You can use numeric values and boolean values in them. The boolean values can
    be set to true or false. For numeric values, we have three different groups:


    +   - We have numeric values for Unicode characters and use the char data type
    for them. In addition, we have data types for general integers and floating-point
    numbers.

    - Integers always have signs. We have four different types of them: byte, short,
    int, and long. The types differ by their number of bytes, which means that the
    data types can hold numbers of different sizes.

    - For floating-point numbers, we have float and double available; a double has
    twice as many bits as a float to store.


    The size of the data types is fixed in the Java specification and does not depend
    on the particular architecture or platform.'
