  md: "# • Writing Your Classes 207\n\n```\nboolean isOn() {\n  return isOn;\n}\n\
    ```\n\n```\npublic String toString() {\n  return \"ElectronicDevice[is+(isOn ?\
    \ \"on\" : \"off\")]\";\n}\n```\n\n```\nclass IceMachine extends ElectronicDevice\
    \ {\n}\n```\n\n```\nclass Radio extends ElectronicDevice {\n  int volume;\n}\n\
    ```\n\nIf we use inheritance, we implement an is-a-type of relationship. It's\
    \ essential that every subclass adheres to and supports the capabilities of its\
    \ superclass. The decision of instance variables and methods to elevate is confined\
    \ to those related to the on/off state. If we look at the other variables and\
    \ methods of Radio, we quickly realize they don't belong to the ElectronicDevice\
    \ superclass. every electronic device in the world has a frequency or volume.\
    \ Once we set instance variables in the superclass, they apply to all subclasses\
    \ that will be written.\n\nUsing an IDE to map many properties into a superclass\
    \ so that manual work is required at all. The refactoring is generally called\
    \ pull members.\nThe superclass ElectronicDevice gets an instance variable isOn,\
    \ which is private, so it can only be read and written from ElectronicDevice.\
    \ The other methods can set the state to true or false via the getter. Direct\
    \ access from outside the private variable is not possible; we must go through\
