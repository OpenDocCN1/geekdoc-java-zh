- pgno: 15
  md: '# About the Author


    **Christian Ullenboom** started his programming journey at the tender age of ten,
    typing his first lines of code into a C64. After mastering assembler programming
    and early BASIC extensions, he found his calling-on the island of Java, following
    his studies in computer science and psychology. Despite indulging in Python, JavaScript,
    TypeScript, and Kotlin vacations, he remains a remnant of all Java.

    For 20 years, Ullenboom has been a passionate software architect, Java trainer
    (check out http://www.tutego.com), and IT specialist instructor. His expertise
    has resulted in a number of online video courses and reference books:


    +   - Java: The Comprehensive Guide (ISBN-13: 978-1493222957)

    - Spring Boot 3 and Spring Framework 6 (ISBN-13: 978-1493224753)

    - Java ist auch eine Insel: Java programmieren lernen mit dem umfassenden Standardwerk
    für Java-Entwickler (ISBN-13: 9-978-3836287456)

    - JavaSE9 Standard-Bibliothek: Das Handbuch für Java-Entwickler (ISBN-13: 978-3836285874)

    - Captain CiaoCiao erobert Java: Das Trainingsbuch für besseres Java (ISBN-13:
    978-3836284271)


    Christian Ullenboom has been speaking Java through his books for years, earning
    the coveted title of Java Champion from Sun (now Oracle) way back in 2005. Only
    select few—about 300 world-wide—have achieved this status, making him a true superstar.


    As an instructor, Ullenboom understands that learning by doing is the most effective
    way to master a skill. So, he has compiled a comprehensive catalog of exercises
    that accompany his training courses. This book features a selection of those exercises,
    complete with documented solutions.

    His roots are in Sonsbeck, a small town in the Lower region of Germany.'
  merge: -1
  img_proc: true
