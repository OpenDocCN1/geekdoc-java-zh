  md: '# METHOD AND CONSTRUCTOR REFERENCES


    Method references and constructor references are among the most unusual notations
    of Java. Many developers are unfamiliar with the very compact notation, and this
    is why practicing is so important. Firstly, it''s essential to be able to read
    foreign code without problems of understanding. Secondly, it''s indispensable
    to be able to comprehend why an intelligent IDE suggests us to rewrite a lambda
    expression in some cases, and thirdly to be able to use this reference notation
    completely on your own.


    # Rewriting Lambda Expressions ★★


    How do you write the following lambda expressions as method or constructor references?


    | TYPE | LAMBDA EXPRESSION | METHOD/CONSTRUCTOR REFERENCE |

    | --- | --- | --- |

    | Static method | (args) -> TypeName.method(args) | |

    | Nonstatic method (in instance) | (args) -> instance.method(args) | |

    | Nonstatic method (no instance) | (instance, args) -> instance.method(args) |
    |

    | Constructor | (args) -> new TypeName(args) | |

    | Array Constructor | (int size) -> new TypeName[size] |


