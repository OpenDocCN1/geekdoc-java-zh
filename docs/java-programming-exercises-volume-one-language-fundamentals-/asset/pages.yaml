  md: '# Lambda Expressions and Functional Programming 10


    Lambda expressions are the foundation of functional programming and serve as mappings.
    Functional programming is centered around functions, with a focus on pure expressions
    that don''t have side effects. In Java, it''s not possible to pass functions (methods)
    directly to other functions or return them, so the workaround is to encapsulate
    these methods in a class and pass them as objects. Lambda expressions provide
    a convenient way to quickly implement a class with a specific interface. They
    serve as implementations of functional interfaces with only one abstract method—and
    are an alternative and efficient shortcut to classes that implement different
    interfaces. As a result, expressing program code and passing it to other methods
    becomes more straightforward.


    The following tasks deal with the different notations of lambda expressions and
    some important functional interfaces that occur repeatedly in Java libraries.


    # Prerequisites


    +   - Be able to read generics.

    - Understand functional interfaces and relation to lambda expressions.

    - Know the annotation @FunctionalInterface.

    - Be able to distinguish and use variants of lambda expressions.

    - Be able to use method and constructor references.

    - Know the basic content and structure of the java.util.function package.

    - Know how to use internal and external iteration.


    Data types used in this chapter:


    +   - java.util.List

    - java.util.function.Consumer

    - java.util.function.Predicate

    - java.util.function.Supplier

    - java.util.function.Function

    - java.util.function.BinaryOperator

    - java.util.function.ToIntFunction

    - java.util.Comparator

    - java.lang.Comparable'
