    # Quiz: Copy Arrays


    The arraycopy(...) method can be used to move ranges in an array or copy parts
    of an array to another. Let us look from Javadoc at the parameter variables of
    arraycopy(...), which are self-explanatory.


    ```

    static void arraycopy(Object src, int srcPos, Object dest, int destPos, int length);

    ```


    In our case, we do not move something in an array, but copy parts of an array
    twice into a new array. The following results if the constants are set and the
    words hooey and shuck are renamed:


    ```

    int[] src={1, 2, 3, 4 };

    int[] dest=new int[3];

    System.arraycopy(src, 0, dest, 0, 2);

    System.arraycopy(src, 3, dest, 2, 1);

    ```


    The result is [1, 2, 4], i.e., a new element with 3 missing at index 2 (bushwa).
    The first copy operation from the source starting at location 0 to the new array
    starting at location 0, a total of 2 elements. The second copy operation moves
    from location 3 (so skips location 2) everything to the end of the destination
    array starting from location 2. The number of copied elements is one.


    With the nonsensical variable, it should also become clear that clean code—here
    variable identifiers—saves human processing time and reduces errors.


