    # Quiz: The Zero Effect


    The program compiles but throws an exception at runtime. The output is:


    ```

    Infinity

    Exception in thread "main" java.lang.ArithmeticException:

    / by zero ...

    ```


    The first println(10.0/0) works because you divide two floating-point numbers
    by 0, and the result is Infinity, i.e., positive infinity. Although zero is an
    integer, the dividend is the floating-point number, and the divisor is also converted
    to a double.


    For integers, a division by 0 is a cause for an ArithmeticException. The different
    behavior is strange, but easy to explain: integers have no special pattern that
    can map to infinity. Floating-point numbers, on the other hand, have a special
    bit pattern for three special values: NaN (Not a Number) and plus well as minus
    infinity—these are quite "normal numbers"


