    # Realize Factory Methods ★


    In addition to constructors, some classes provide an alternative variant to create
    objects, called factory methods. The following applies:


    +   - Constructors exist in principle, but they are private, and consequently,
    outsiders cannot create instances.

    - So that objects can be built, there are static methods, which internally call
    the constructor and return the instance.


