  md: '# Fire Alarm Does Not Go Off: Overriding Methods ★


    Fire is something Captain CiaoCiao doesn''t need on ships at all. If there is
    a fire, it must be extinguished as soon as possible.


    +   - Implement a class Firebox for a fire detector as a subclass of ElectronicDevice.

    - Fire detectors should always be switched on after creation.

    - The off() method should be implemented with an empty body or console output
    that a fire detector cannot be turned off.


    Example:


    +   - Task target: an overridden off() method that does not change the isOn state.
    This can be tested like this:

    ```java

    Firebox fb=new Firebox();

    System.out.println( fb.isOn() ); // true

    fb.off();

    System.out.println( fb.isOn() ); // true

    ```


    ![](img/1772db956b1b6830f9a15683dc55dea0_204_0.png)


    FIGURE 6.6 UML diagram.


    # Calling the Methods of the Superclass ★★


    A radio has on()/off() methods, and the TV class also has on()/off() methods.
    However, the TV is not yet an ElectronicDevice. The reason is that the TV needs
    special treatment because of the monitor tube.


    If TV extends the class ElectronicDevice, a TV, therefore, overwrites the methods
    of the superclass ElectronicDevice. But a problem arises:


    +   - If we omit the two methods, the tube would not be turned off, but the TV
    would pass as an electrical device when inherited.

    - If we leave the methods in the class, only the tube will be turned off, but
    the device is no longer switched on or off. After all, this state was managed
    by the superclass via the on()/off() methods.'
