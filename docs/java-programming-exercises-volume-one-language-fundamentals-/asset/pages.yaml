    # Check If Loot Can Be Shared Fairly


    com/tutego/exercise/lang/FairShare.java


    ```

    System.out.println("Number of bottles in total?");

    int bottles = new java.util.Scanner(System.in ).nextInt();


    int captainsBottles = bottles / 2;

    int crewsBottles = bottles - captainsBottles;

    ```


    ```

    System.out.println("Bottles for the captain: " +captainsBottles);

    System.out.println("Bottles for all crew members: " +crewsBottles);

    ```


    ```

    System.out.println("Number of crew members?");

    int crewMembers = new java.util.Scanner(System.in ).nextInt();

    System.out.println("Fair share with remainder? " +(crewsBottles %

    crewMembers = 0) );

    ```


    In the first step, we divide by integer Scanner and initialize our variables for
    the loot. Since the captain gets half of bottles, we divide the input by 2. In
    the next step, we calculate what the crew members get, and don''t choose the solution
    that we divide by 2 again because of odd numbers, we get the problem that two
    halves don''t add up (If you want to try out, get the result of 5 / 2 + 5 /2).
    To make sure this doesn''t happen, we subtract the captain''s share from bottles
    to obtain the crew gets.


    Finally, we have to find out if the leftover bottles can be divided fairly by
    the number of crew members. To achieve this, the program first asks for the number
    of crew members. The remainder operator will tell us if there is a remainder.
    If the division goes up, the remainder will be 0. In that case, the loot can be
    divided fairly.


