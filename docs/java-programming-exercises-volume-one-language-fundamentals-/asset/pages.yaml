  md: '# # Classes, Objects, and Packages


    In the previous chapters, we used classes as containers for static methods. We
    did not intentionally build new objects with new. In this chapter, the following
    exercises deal with creating new objects, object references, and the special null
    reference.


    # ## Prerequisites**


    +   - Know the difference between object type and reference type.

    - Be able to use new.

    - Know the purpose and basic operation of the automatic garbage collector.

    - Be able to pass objects to methods and return them.

    - Be able to build packages.

    - Be able to import types.

    - Be able to separate equivalence and identity.

    - Understand the problem with null reference.


    Data types used in this chapter:


    +   - java.awt.Polygon

    - java.awt.Point


    # ## CREATING OBJECTS


    For the following examples, we use the classes Point and Polygon from the package
