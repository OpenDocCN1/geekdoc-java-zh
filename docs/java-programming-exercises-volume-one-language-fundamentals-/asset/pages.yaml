  md: '# Quiz: Pirate Could Have Waved


    You have to write:


    ```

    new Pirate.Body().new Arm().wave();

    ```


    The special feature of inner classes is that they always have a reference to an
    outer object. When building instances of inner classes, we have to do it via a
    reference to an object of the outer class, followed by the keyword new.


    Body is a static class. To build an object of type we do not need an instance
    of the outer class Pirate. We use the ClassName.StaticProperty style when accessing
    properties. When we write Pirate.Body, we use to refer to the nested static class,
    and new Pirate.Body() creates an instance. This reference is necessary so that
    we can build an object of type Arm because Arm is the actual inner class. With
    this reference, we can call the wave() method.


    # Quiz: Name in a Bottle


    The program compiles, and the output is:


    CaptainCiaoCiao


    The class Bottle is an inner class, and consequently can only be created if there
    is an instance of the outer class Distillery. To create the inner class, a factory
    method is used. Thus, first an instance of the outer class Distillery must be
    created, then the factory method must be called, so that a Bottle object is created.
    The special fact is, that the constructor of Bottle is private. Normally, it would
    be impossible to construct an instance from the outside via a private constructor,
    unless the factory method resides inside that class. But Java leverages some leverages
    for this visibility for inner classes. The outer class Distillery can also call
    the private constructor of Bottle and build an object. From this Bottle object,
    we can retrieve and return the name via the brand() method. Again, we can see
    that the private visibility has been removed in the other direction as well. Because
    name is a private instance variable of the outer class Distillery to which other
    classes have no access. Distillery Bottle form a union in terms of visibility,
    and the private designation is, so to speak, annulled.


    # Quiz: Get another Bottle of Rum


    The program cannot compile. The reason is in the declaration of the static drink()
    method in the class Rum. It is an important rule: nonstatic inner classes must
    not have static properties, i.e., neither static methods are not static variables.
    If we delete the static keyword, the program will run normally and at a gulp will
    appear on the screen.


    The reason nonstatic inner classes cannot have static properties is that the inner
    class cannot be accessed without an instance of the outer class. That ClassName.staticproperty
    not work for inner classes. Instances of these classes however always a reference
    to the instance of the outer class because the inner classes can access instance
    variables of the outer class. Static properties are always completely independent
    of any objects, so they are also independent of outer surrounding objects.'
