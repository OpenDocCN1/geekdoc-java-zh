    \ = true; // mybool is a variable\n}\n```\n\n# **Explanation:**\n\nmystring is\
    \ a name of variable, its value is “Hello World”.\nmyinteger is a name of variable,\
    \ its value is int.\nmybool is a name of variable, its value is true.\n“public\
    \ static void main ( args { }” declares a main method.\n\n# Arithmetical Operators\n\
    \n| Operators | Running |\n|---|---|\n| + | add, connect strings |\n| - | subtract\
