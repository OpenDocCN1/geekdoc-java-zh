    \n（图 4）\n\n## 第 2 步：创建包\n\n包用于包含不同类的 Java 文件。不同的包包含不同的 Java 文件。\n\n选择项目 “FirstProject”\
    \ > 新（new） > 包（package） > 命名 > “newPackage” > 完成。\n（图 5）\n\n![](img/16a6794eb7241c5d7b1e4b6cacaa1576_22_1.png)\n\
