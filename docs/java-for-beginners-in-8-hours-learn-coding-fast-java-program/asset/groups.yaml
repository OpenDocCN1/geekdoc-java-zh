    \ str ); // Output: We love Java.\n        System.out.println( incre ); // Output:\
    \ 11\n    }\n}\n```\n\n# Explanation:\n\nint sum = 100 + 200 means int plus 200.\n\
    String str = “We love” + “Java” connects two strings.\n++incre increases its value\
    \ by 1.\n\n# Logical Operators\n\n| Operators | Equivalent |\n|---|---|\n| &&\
    \ | and |\n| || | or |\n| ! | not |\n\nAfter using logical operators, the result\
