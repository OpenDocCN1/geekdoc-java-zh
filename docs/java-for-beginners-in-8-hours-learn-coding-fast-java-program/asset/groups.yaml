- md: "\n# JAVA\n\n# In 8 Hours\n\n![](img/16a6794eb7241c5d7b1e4b6cacaa1576_0_0.png)\n\
    \n# For Beginners\n\n# Learn Java Fast!\n\nRay Yao\n\n# JAVA\n\n# For Beginners\n\
    \nBy Ray Yao\n\nInclude Tests & Answers\n\n# Copyright © 2015 by Ray Yao\nAll\
    \ Rights Reserved\n\nNeither part of this book nor whole of this book may be reproduced\
    \ or transmitted in any form or by any means electronic, photographic or mechanical,\
    \ including photocopying, recording, or by any information storage or retrieval\
    \ system, without prior written permission from the author. All Rights Reserved!\n\
    Ray Yao\n\n# About the Author:\n\n- Ray Yao:\n- Certified PHP engineer by Zend,\
    \ USA\n- Certified JAVA programmer by Sun, USA\n- Certified SCWCD developer by\
    \ Oracle, USA\n- Certified A+ professional by CompTIA, USA\n- Certified ASP. NET\
    \ expert by Microsoft, USA\n- Certified MCP professional by Microsoft, USA\n-\
    \ Certified TECHNOLOGY specialist by Microsoft, USA\n- Certified NETWORK+ professional\
    \ by CompTIA, USA\n\n# Highly Recommend Computer Books on Amazon:\n\n- Linux Command\
    \ Line\n- JAVA for Beginners\n- PHP for Beginners\n- JavaScript for Beginners\n\
    - C++ for Beginners\n- AngularJS for Beginners\n- JQuery for Beginners\n- Python\
    \ for Beginners\n- HTML CSS for Beginners\n- C# for Beginners\n- Visual Basic\
    \ for Beginners\n- XML for Beginners\n- Advanced Java\n- Advanced C++\n- JavaScript\
    \ 50 Useful Programs\n\n# Preface\n\n“JAVA for Beginners” covers all essential\
    \ JAVA knowledge. You can learn complete primary skills of JAVA fast and easily.\n\
    This book includes many practical Hands-On Projects. You can study JAVA coding\
    \ with Hands-On Projects.\n\n# Source Code for Download\n\nThis book provides\
    \ source code for download; you can download the source code for better study,\
    \ or copy the source code to your favorite editor to test the programs. The download\
    \ link of the source code is at the last page of this book. Start coding today!\n\
    \n# Table of Contents\n\n# Hour 1 Start JAVA\n\n- Install Java\n- What is Java?\n\
    - Run First Program\n- Java Comments\n- Output Commands\n- Escaping Characters\n\
    - Java Keywords\n- Data Types\n- Create a Variable\n- Arithmetical Operators\n\
    - Logical Operators\n- Assignment Operators\n- Comparison Operators\n- Conditional\
    \ Operator\n- Hands-On Project: Calculation\n\n# Hour 2 Statements\n\n- If Statement\n\
    - If-else Statement\n- Switch Statement\n- For Loop\n- While Loop\n- Do-While\
    \ Loop\n- Break Statement\n- Continue Statement\n- Boolean-Expression\n- Hands-On\
    \ Project: Run 100 Times\n\n# Hour 3 Array & Math\n\n- Create an Array (1)\n-\
    \ Create an Array (2)\n- Array Length\n- Element Value\n- Sort Array Elements\n\
    - Math Methods\n- Ceil () & Floor ()\n- Max () & Min ()\n- pow () & sqrt ()\n\
    - Math.PI & random()\n- Hands-On Project: Start with Zero\n\n# Hour 4 String Processing\n\
    \n- String Length\n- String Connection\n- String Comparing\n- Extract a Character\n\
    - Locate a Character\n- Extract a Substring\n- Case Change\n- Character Replace\n\
    - String Type Change\n- StringBuilder\n- Hands-On Project: True or False\n\n#\
    \ Hour 5 Method, Class & Object\n\n- Method\n- Method & Arguments\n- Return Value\n\
    - Class Definition\n- Object Declaration\n- Class & Object\n- Constructor\n- Constructor\
    \ Example\n- Overloading\n- “this” Keyword (1)\n- “this” Keyword (2)\n- Instance\
    \ & Local variable\n- Hands-On Project: Contact Info.\n\n# Hour 6 Inheritance\
    \ & Modifiers\n\n- Inheritance\n- “super” keyword\n- Overriding\n- Overloading\
    \ & Overriding\n- Static variable\n- Static Method\n- final Variable\n- final\
    \ Method()\n- final class\n- Polymorphism\n- Package & Import\n- Build a Package,\
    \ Import Class\n- Hands-On Project: Inheritance\n\n# Hour 7 Abstract & Interface\n\
    \n- Abstract\n- Abstract Example\n- Permission\n- Default Member\n- Public Member\n\
    - Private Member\n- Private Example\n- Interface\n- Interface Example\n- Abstract\
    \ & Interface\n- Initial Variables\n- Another Class\n- Hands-On Project: Max &\
    \ Min\n\n# Hour 8 Exception & I/O\n\n- Exception\n- Catch Exception (1)\n- Catch\
    \ Exception (2)\n- Catch Exception (3)\n- Finally Command\n- Throw Exception\n\
    - Throws Exception\n- File Class\n- FileOutputStream\n- FileInputStream\n- Create\
    \ Thread\n- Extends Thread\n- Implements Runnable\n- Multi-Thread\n- Thread’s\
    \ Methods\n- Hands-On Project: Out of Range\n- Hands-On Project: Tasks\n\n# Appendix\
    \ Java Tests & Answers\n\n# Source Code for Download\n\n# Hour 1 Start JAVA\n\n\
    # Install Java\n\nIn order to create any Java program, the Java development environment\
    \ needs to be available on the local system.\n\n# JDK (also called JSDK, Java\
    \ SE)\n\nJDK (Java Development Kit) contains all Java libraries, all tools building\
    \ and running programs can create a Java development environment.\n\n# Download\
    \ JDK\n\nhttp://oracle.com/download or http://www.oracle.com/java/javase/downloads/index.html\n\
    Please click the link to download the newest version JDK at Oracle website. (Figure\
    \ 1)(img/16a6794eb7241c5d7b1e4b6cacaa1576_0.png)\n\n# Download JDK at Oracle Website\n\
    \nIf your computer is 32-bit operating system, download the JDK with x86; If your\
    \ computer is 64-bit operating system, download the JDK with x64. (Figure 2)\n\
    \n| Product / File Description | File Size | Download |\n|---|---|---|\n| Linux\
    \ x86 | 154.67 MB | jdk-8u251-linux-x86.rpm |\n| Linux x86 | 174.63 MB | jdk-8u251-linux-x86.tar.gz\
    \ |\n| Linux x64 | 152.69 MB | jdk-8u251-linux-x64.tar.gz |\n| Linux x64 | 172.98\
    \ MB | jdk-8u251-linux-x64.rpm |\n| Mac OS x64 | 227.12 MB | jdk-8u251-macos-x64.dmg\
    \ |\n| Solaris 64-bit (SP package) | 125.53 MB | jdk-8u251-solaris-sp64.tar.gz\
    \ |\n| Solaris 64-bit | 99.05 MB | jdk-8u251-solaris-sp64.tar.gz |\n| Solaris\
    \ x64 (SP package) | 140 MB | jdk-8u251-solaris-x64.tar.gz |\n| Solaris x64 |\
    \ 98.2 MB | jdk-8u251-solaris-x64.tar.gz |\n| Windows x86 | 181.33 MB | jdk-8u251-windows-x86.exe\
    \ |\n| Windows x64 | 189.65 MB | jdk-8u251-windows-x64.exe |\n\n# (Figure 2)\n\
    \nPlease install the newest version of JDK to your computer.\n\nCongratulation!\
    \ Once JDK has been installed successfully, the system is ready to start Java\
    \ programs!\n\n# IDE (Integrated Development Environment)\n\nIDE (Integrated Development\
    \ Environment) is used to write, edit and run Java. IDE contains many Java development\
    \ tools, compiler and debugger. There are many excellent IDEs for download on\
    \ internet, please download one IDE by the following links:\n\n| IDE(editor) |\
    \ Website |\n|--- |--- |\n| Eclipse | http://www.eclipse.org |\n| NetBeans | https://netbeans.org/\
    \ |\n| DrJava | http://www.drjava.org/ |\n| JEdit | http://www.jedit.org/ |\n\
    | BlueJ | http://www.bluej.org/ |\n| JCreator | http://www.jcreator.com/ |\n\n\
    Please install one of the editors to your computer.\n(This book uses Eclipse as\
    \ editor).\n\nCongratulation! Once an IDE has been installed successfully, you\
    \ can write, edit and run Java programs from now on.\n\n# What is Java?\n\nJava\
    \ is a class-based, object-oriented programming language, which is a secure, fast,\
    \ and reliable program for general-purpose such as internet, database, cell phone,\
    \ countless variety of equipment.\n\n# Example 1.1\n\n```\npublic class Hi {\n\
    \    public static void main(String [ ] args) {\n        System.out.print(\"Hello\
    \ World\");\n    }\n}\n```\n\n( Output: Hello World )\n\n# Explanation:\n\n“Public\
    \ class” is two keywords; they are used to declare a Java program. “Hi” is a program\
    \ name.\n\n“public static void main (String [ ] args) {...}” is used to declare\
    \ a main method.\n\n“main” method contains main program codes to execute.\n\n\
    “String [ ] args” is used to accept the input manually.\n\n“System.out.print(\
    \ )” is used to display or print.\n\nEach Java command should be ended with semicolon\
    \ (;).\n\n# Run First Program\n\n**Eclipse** is one of the most popular Java IDE\
    \ (Integrated Development Environment). It is used to write, edit, debug and run\
    \ Java program.\n"
  mdcn: "\n\n# JAVA\n\n# 8 小时学会\n\n![](img/16a6794eb7241c5d7b1e4b6cacaa1576_0_0.png)\n\
    \n# 初学者\n\n# 快速学习 Java！\n\nRay Yao\n\n# JAVA\n\n# 初学者\n\n由 Ray Yao 编写\n\n包含测试与答案\n\
