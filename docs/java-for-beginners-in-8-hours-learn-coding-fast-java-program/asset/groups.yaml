    # Install Java


    In order to create any Java program, the Java development environment needs to
    be available on the local computer system.


    # JDK (also called JSDK, Java SE)


    JDK (Java Development Kit) contains all Java class libraries, all tools building
    and running Java programs. JDK can create a Java development environment.'
