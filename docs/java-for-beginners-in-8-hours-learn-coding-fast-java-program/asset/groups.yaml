    \   public static void main(String args) {\n        eBooks obj = new eBooks();\n\
    \        obj.booksNumbers();\n    }\n}\n```\n\n# **输出:**\n\nImplement the empty\
    \ method!\n\n# 抽象类与接口 (Abstract & Interface)\n\n# **解释:**\n\nabstract class books{\
    \ // 定义抽象类\nabstract int read(); // 定义抽象方法\nclass eBooks extends books{ // 扩展父类\n\
    int read() { return ...; }\n\n# **接口解释:**\n\n```\ninterface books { // 定义接口\n\
    int booknumber(); // 一个方法\n}\nclass implements { books // 实现\n\npublic booknumber()\
    \ { // 实现 {\n\nreturn ...;\n}\n```\n\n# 初始化变量 (Initializes Variables)\n\n在创建对象时，需要一个构造函数来初始化变量。\n\
    \n示例 7.7\n```\nclass Book { // 创建一个类\n  public String title;\n  public int number;\n\
    \  public Book () { // 一个构造函数\n    title = \" \" Java\"; // 初始化\n    number =\
    \ 100; // 初始化\n  }\n}\npublic class Publisher { // 创建类\n  public static void main(String\
    \ args) { // 方法\n    Book b = new Book(); // 创建对象\n    System.out.println(b.title\
    \ + b.number);\n  }\n}\n( 输出: Java100 )\n```\n\n# 解释:\n\nBook () { } 是一个构造函数来初始化变量。\n\
    \nMain 类可以调用方法。\n\n# 示例 7.8\n\n```\nclass AnotherClass{ // 定义另一个类\nvoid anotherMethod()\
    \ { // 方法\n    System.out.println(\"Very Good\");\n}\npublic class Main { // 类\n\
    public static void main(String args) { // 方法\n    AnotherClass ac=new AnotherClass();\n\
    \    ac.anotherMethod(); // 调用\n}\n}\n( 输出: Very Good )\n\n# 解释:\n\nAnotherClass\
    \ 定义了另一个类。\n\n# 抽象类示例 (Abstract Example)\n\nStart up Eclipse > Select “Abstract”\
    \ > new > class > name AbstractDemo > Finish.\n\nWrite following codes in Eclipse.\n\
    \n```\npackage myPackage;\nabstract class A { // 定义抽象类\nabstract int read(); //\
    \ 定义抽象方法\n}\nclass B extends A { // 扩展父类\nint read() { // 实现抽象方法\nreturn 100;\n\
    }\npublic class AbstractDemo {\npublic static void main(String args) {\n    A\
    \ a;\n    B b=new B();\n    System.out.println(b.read());\n}\n}\n```\n\n点击工具栏上的白色三角形按钮运行程序并查看输出：\n\
    \n# 输出:\n\n100\n\n解释:\n\n“abstract class A{ }” 定义了一个抽象类。\n\n“abstract int read()”\
    \ 定义了一个抽象方法。\n\n“class B extends A{ }” 意味着子类 “B” 扩展了父类 “A”。\n\n“int read() { }”\
    \ 意味着子类中的方法实现了父类中的抽象方法。\n\n# 练习项目 (Hands-On Project): Max & Min\n\n"
