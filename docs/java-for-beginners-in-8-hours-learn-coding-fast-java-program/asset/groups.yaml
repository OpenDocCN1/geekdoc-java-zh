    name = theName;\nemail = theEmail;\nphone = thePhone;\n}\nvoid displayEmail(){\
    \ // declare a function\nSystem.out.println(\"Email:\" + email);\n}\nvoid displayPhone(){\
    \ // declare a function\nSystem.out.println(\"Phone:\" + phone);\n}\npublic static\
    \ void main(String[] args) { // main function\nMessage JACK = new Message(\"JACK\"\
    , \"JACK@xxx.xxx\", \"678-xxx-9999\"); // create an object JACK,\nand call constructor\n\
    System.out.println(JACK.name);\nJACK.displayEmail(); // call a function\nMessage\
    \ ANDY = new Message(\"ANDY\", \"ANDY@xxx.xxx\", \"567-xxx-0000\"); // create\
    \ an object ANDY,\nand call constructor\nSystem.out.println(ANDY.name);\nANDY.displayPhone();\
    \ // call a function\n}\n}\n```\n\nClick White Triangle Green Button in tool bar\
    \ to run the program and see the output:\n\n## **Output:**\n\nJACK\n\nEmail:JACK@xxx.xxx\n\
    \nANDY\n\nPhone:567-xxx-0000\n\n## Explanation:\n\n“public class Message” defines\
    \ a class “Message”.\npublic Message(......) defines a constructor, initializes\
    \ three string variables.\n\n“Message JACK = new Message (.....)” creates an object\
    \ “JACK”, and automatically calls the constructor to initialize three string variables.\n\
    \n“JACK.name” references the variable “name”.\n\n“JACK.displayEmail();” calls\
    \ the function “displayEmail()”.\n\n“Message ANDY = new Message (.....)” creates\
    \ an object “ANDY”, and automatically calls the constructor to initialize three\
    \ string variables.\n\n“ANDY.name” references the variable “name”.\n\n“ANDY.displayPhone();”\
    \ calls the function “displayPhone()”.\n\n## Hour 6\n\n## Inheritance & Modifiers\n\
    \n## Inheritance\n\nA class can be extended by a subclass.\n\n```\nclass sub-class\
    \ extends parent-class;\n```\n\n“extends” is used in a sub class extends a parent\
    \ class.\n\n## Example 6.1\n\n```\nclass parent_class{ // parent class\n// define\
    \ variable here;\n// define method here;\n}\nclass sub_class extends parent_class{\
    \ // sub class\n// define variable here;\n// define method here;\n}\n```\n\n##\
    \ **Explanation:**\n\n“class sub_class extends parent_class” means that a sub\
    \ class extends a parent class (also called super class).\n\nSub class can access\
    \ the variable and method in parent class, but cannot access the private variable\
    \ and private method in parent class.\n\n## “super” keyword\n\nIn sub class, “super”\
    \ is used to call the constructor of parent class.\n\n```\nsuper ( argument );\n\
    ```\n\n“super ( argument );” is placed the first line in the constructor of sub\
    \ class, to call the constructor of parent class.\n\n## Example 6.2\n\n```\nclass\
    \ super_class{\nsuper_class (int x, int y){ // constructor\nthis.x=x; this .y=y;\n\
    }\n```\n\n```\nclass sub_class extends super_class{\nsub_class(int x, int y){\
    \ // constructor\nsuper ( x,y ); // call the constructor of parent class\n}\n\
    ```\n\n## Explanation:\n\n“super ( x,y);” calls the constructor in super class.\n\
    \n## Overriding\n\nThe method of sub class can override the method of super class,\
    \ if the method name and argument are the same.\n\n## Example 6.3\n\n```\nclass\
    \ Super_class{\n    int test(int num ) { return num; } // overriding\n}\nclass\
    \ Sub_class extends Super_class{\n    int test(int num ) { return 100 + num; }\
    \ // overriding\n}\npublic class OverridingClass {\n    public static void main\
    \ (String args[]){\n        Sub_class obj=new Sub_class();\n        System.out.print(\
    \ obj.test( 200 ));\n    }\n}\n```\n\n( Output: 300 )\n\n## **Explanation:**\n\
    \nWhen “obj.test( 200 )” calls the “int test( 200 )”, the “int test()” in super\
    \ class has the same name and argument.\n\n## Overloading & Overriding\n\n| Overloading\
    \ | same name, different argument. |\n| Overriding | same name, in super class.\
    \ |\n\n## Example 6.4 (overriding)\n\n```\nclass Color{\nString x,y;\nColor (\
    \ String a, String b) { x=\"a\"; }\n```\n\n## Example 6.5 (overriding)\n\n```\n\
    class parent_class{\nint test(int num) { return num; }\n}\nclass sub_class extends\
    \ parent_class{\nint test(int num) { return 100 + num; }\n}\n```\n\n## Static\
    \ variable\n\n\"static variable\" is known as class, it can be referenced by class\
    \ or object.\n\"Non static variable\" by object only.\n\n## Example 6.6\n\n```\n\
    class MyClass {\n    static int count=100; // declare a static variable\n    public\
    \ static void main (String args[]){\n        System.out.print( MyClass.count );\n\
    \    }\n}\n```\n( Output: 100 )\n\n## Explanation:\n\n“static int count=100” defines\
    \ a static variable.\n“MyClass.count” means a class “MyClass” references a static\
    \ variable\ndirectly.\n\n## Static Method\n\n\"static method\" is known as class,\
    \ it can be called by class or object.\n\"Non static method\" is by object only.\n\
