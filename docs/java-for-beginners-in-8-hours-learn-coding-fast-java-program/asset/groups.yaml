    1 \");\nSystem.out.println(\"2 \");\nSystem.out.println(\"3 \");\n```\n\n# 输出：\n\
    \n```\n1\n2\n3\n```\n\n# **解释：**\n\nSystem.out.print( ) 将在同一行打印结果。\n\nSystem.out.println(\
    \ ) 将在不同行打印结果。\n\n# 转义字符\n\n\" \\ 反斜杠字符可以用于转义字符。\n\n```\n\\n 将内容输出到下一行。\n\\r 产生回车。\n\
