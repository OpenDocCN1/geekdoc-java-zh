    That flower is purple.\n\n## **解释:**\n\n“public class Color { }” 定义了一个类。\n\n“Color\
    \ obj = new Color( )” 创建了一个对象。\n\n## 构造函数\n\n构造函数用于初始化变量。构造函数名与类名相同。\n\n```java\n\
