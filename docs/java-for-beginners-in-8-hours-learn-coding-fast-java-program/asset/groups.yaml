    \ |\n| -- | decrease 1 |\n\n## Example 1.9\n\n```\npublic class TryClass{\n  \
    \  public static void main (String[] args){\n        int sum = 100 + 200;\n\n\
    \        String str = \"We love\" + \"Java\";\n        int incre = 10; incre =\
