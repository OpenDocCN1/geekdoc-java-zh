  - '[PAGE 14]


    # IDE (Integrated Development Environment)


    IDE (Integrated Development Environment) is used to write, edit and run Java.
    IDE contains many Java development tools, compiler and debugger. There are many
    excellent IDEs for download on internet, please download one IDE by the following
    links:


    | IDE(editor) | Website |

    |--- |--- |

    | Eclipse | http://www.eclipse.org |

    | NetBeans | https://netbeans.org/ |

    | DrJava | http://www.drjava.org/ |

    | JEdit | http://www.jedit.org/ |

    | BlueJ | http://www.bluej.org/ |

    | JCreator | http://www.jcreator.com/ |


    Please install one of the editors to your computer.

    (This book uses Eclipse as editor).


    Congratulation! Once an IDE has been installed successfully, you can write, edit
    and run Java programs from now on.'
  - '[PAGE 15]


    # What is Java?


    Java is a class-based, object-oriented programming language, which is a secure,
    fast, and reliable program for general-purpose such as internet, database, cell
    phone, countless variety of equipment.'
