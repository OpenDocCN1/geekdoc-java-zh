    \   public static void main (String[] args){\n        boolean x=true; boolean\
    \ y=false;\n        boolean a, b, c;\n        a= x && y; System.out.print (a);\
    \ // output: false\n        b=x || y; System.out.print (b); // output: true\n\
    \        c=! x; System.out.print (c); // output: false\n    }\n}\n```\n\nExplanation:\n\
    \n| true && true; returns true; | true && false; returns false; | false && false;\
