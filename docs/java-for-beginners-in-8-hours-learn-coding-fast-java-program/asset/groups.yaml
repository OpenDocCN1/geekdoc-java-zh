    Ray Yao\n\n# 关于作者：\n\n- Ray Yao:\n- 美国 Zend 认证 PHP 工程师\n- 美国 Sun 认证 JAVA 程序员\n\
    - 美国 Oracle 认证 SCWCD 开发者\n- 美国 CompTIA 认证 A+ 专业人士\n- 美国 Microsoft 认证 ASP. NET\
    \ 专家\n- 美国 Microsoft 认证 MCP 专业人士\n- 美国 Microsoft 认证 TECHNOLOGY 专家\n- 美国 CompTIA\
    \ 认证 NETWORK+ 专业人士\n\n# 亚马逊亚马逊力推荐计算机书籍：\n\n- Linux 命令行\n- JAVA 初学者\n- PHP 初学者\n\
    - JavaScript 初学者\n- C++ 初学者\n- AngularJS 初学者\n- JQuery 初学者\n- Python 初学者\n- HTML\
    \ CSS 初学者\n- C# 初学者\n- Visual Basic 初学者\n- XML 初学者\n- 高级 Java\n- 高级 C++\n- JavaScript\
    \ 50 个实用程序\n\n# 前言\n\n“JAVA for Beginners” 涵盖了所有核心 JAVA 知识。你可以快速、轻松地学习 JAVA 的完整基础技能。\n\
    本书包含了许多实战项目。你可以通过这些实战项目来学习 JAVA 编码。\n\n# 源代码下载\n\n本书提供源代码下载；你可以下载源代码以进行更好的学习，或者将源代码复制到你喜欢的编辑器中测试程序。源代码的下载链接位于书的最后一页。从今天开始编码吧！\n\
    \n# 目录\n\n# 第1 小时 开始 JAVA\n\n- 安装 Java\n- 什么是 Java？\n- 运行第一个程序\n- Java 注释\n- 输出命令\n\
    - 转义字符\n- Java 关键字\n- 数据类型\n- 创建变量\n- 算术运算符\n- 逻辑运算符\n- 赋值运算符\n- 比较运算符\n- 条件运算符\n\
    - 实战项目：计算\n\n# 第2 小时 语句\n\n- If 语句\n- If-else 语句\n- Switch 语句\n- For 循环\n- While\
    \ 循环\n- Do-While 循环\n- Break 语句\n- Continue 语句\n- 布尔表达式\n- 实战项目：运行100次\n\n# 第3\
    \ 小时 数组与数学\n\n- 创建数组 (1)\n- 创建数组 (2)\n- 数组长度\n- 元素值\n- 排序数组元素\n- 数学方法\n- Ceil\
    \ () & Floor ()\n- Max () & Min ()\n- pow () & sqrt ()\n- Math.PI & random()\n\
    - 实战项目：从零开始\n\n# 第4 小时 字符串处理\n\n- 字符串长度\n- 字符串连接\n- 字符串比较\n- 提取字符\n- 定位字符\n- 提取子字符串\n\
    - 大小转换\n- 字符替换\n- 字符串类型转换\n- StringBuilder\n- 实战项目：对错\n\n# 第5 小时 方法、类与对象\n\n-\
    \ 方法\n- 方法与参数\n- 返回值\n- 类定义\n- 对象声明\n- 类与对象\n- 构造函数\n- 构造函数示例\n- 重载\n- “this”\
    \ 关键字 (1)\n- “this” 关键字 (2)\n- 实例与局部变量\n- 实战项目：联系信息\n\n# 第6 小时 继承与修饰符\n\n- 继承\n\
    - “super” 关键字\n- 重写\n- 重载与重写\n- 静态变量\n- 静态方法\n- final 变量\n- final 方法()\n- final\
    \ 类\n- 多态\n- 包与导入\n- 创建包，导入类\n- 实战项目：继承\n\n# 第7 小时 抽象类与接口\n\n- 抽象\n- 抽象类示例\n-\
    \ 权限\n- 默认成员\n- 公有成员\n- 私有成员\n- 私有示例\n- 接口\n- 接口示例\n- 抽象与接口\n- 初始化变量\n- 另一个类\n\
    - 实战项目：最大值与最小值\n\n# 第8 小时 异常与输入输出\n\n- 异常\n- 捕获异常 (1)\n- 捕获异常 (2)\n- 捕获异常 (3)\n\
    - Finally 命令\n- 抛出异常\n- 声明抛异常\n- File 类\n- FileOutputStream\n- FileInputStream\n\
    - 创建线程\n- 扩展 Thread\n- 实现 Runnable\n- 多线程\n- 线程方法\n- 实战项目：超出范围\n- 实战项目：任务\n\n\
    # 附录 Java 测试与答案\n\n# 源代码下载\n\n# 第1 小时 开始 JAVA\n\n# 安装 Java\n\n为了创建任何 Java 程序，本地系统需要有可用的\
    \ Java 开发环境。\n\n# JDK (也称为 JSDK, Java SE)\n\nJDK (Java 开发工具包) 包含了所有的 Java 库以及所有构建和运行程序所需的工具，可以创建一个\
    \ Java 开发环境。\n\n# 下载 JDK\n\nhttp://oracle.com/download 或 http://www.oracle.com/java/javase/downloads/index.html\n\
    请点击链接在 Oracle 网站下载最新版本的 JDK。（图1）（img/16a6794eb7241c5d7b1e4b6cacaa1576_0_0.png)\n\
    \n# 在 Oracle 网站下载 JDK\n\n如果你的计算机是 32 位操作系统，请下载 x86 版 JDK；如果你的计算机是 64 位操作系统，请下载\
    \ x64 版 JDK。（图2）\n\n| 产品 | 文件大小 | 下载 |\n|---|---|---|\n| Linux x86 | 154 MB |\
    \ jdk-8251-linux-x86 |\n| Linux x64 | 172 MB | jdk-8251-linux-x64 |\n| Mac OS\
    \ x64 | 227 MB | jdk-8251-macos-x64 |\n| Solaris 64-bit | 125 MB | jdk-8251-solaris-x64\
    \ |\n| Solaris 64-bit | 99 MB | jdk-8251-solaris-sp64 |\n| Windows x86 | 181 MB\
    \ | jdk-8251-windows-x86 |\n| Windows x64 | 189 MB | jdk-8251-windows-x64 |\n\n\
    # (图2)\n\n请在你的计算机上安装最新版本的 JDK。\n\n祝喜！JDK 安装成功，系统已准备好运行 Java 程序！\n\n# IDE (集成开发环境)\n\
    \nIDE (集成开发环境) 用于编写、编辑和运行 Java。IDE 包含了许多 Java 开发工具、编译器和调试器。互联网上有许多优秀的 IDE 可供下载，请通过以下链接下载：\n\
    \n| IDE (编辑器) | 网站 |\n|---|---|\n| Eclipse | http://www.eclipse.org |\n| NetBeans\
    \ | https://netbeans.org/ |\n| DrJava | http://www.drjava.org/ |\n| JEdit | http://www.jedit.org/\
    \ |\n| BlueJ | http://www.bluej.org/ |\n| JCreator | http://www.jcreator.com/\
    \ |\n\n请在你的计算机上安装一个编辑器。（本书使用 Eclipse）。\n\n祝喜！IDE 安装成功，从现在起你可以编写、编辑和运行 Java 程序了。\n\
    \n# 什么是 Java？\n\nJava 是一种基于类、面向对象的编程语言，是一种安全、快速且可靠的通用程序，适用于互联网、数据库、手机等各种设备。\n\n\
    # 示例 1.1\n\n```\npublic class Hi {\n    public static void main(String [ ] args)\
    \ {\n        System.out.print(\"Hello World\");\n    }\n}\n```\n\n（ 输出：Hello World\
    \ ）\n\n# 解析：\n\n“Public class” 是两个关键字；它们用于声明 Java 程序。“Hi” 是程序名。\n\n“public static\
    \ void main (String [ ] args) {...}” 用于声明主方法。\n\n“main” 方法包含执行的主程序代码。\n\n“String\
    \ [ ] args” 用于手动接受输入。\n\n“System.out.print( )” 用于显示或打印。\n\n每个 Java 命令应以分号 (;)\
    \ 结束。\n\n# 运行第一个程序\n\nEclipse 是流行的 Java IDE（集成开发环境）之一。它用于编写、编辑、调试和运行 Java 程序。\n\
    \n"
