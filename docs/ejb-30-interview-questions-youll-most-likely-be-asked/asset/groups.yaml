    ## 164: What is the main function of a container managed entity manager?


    Answer:


    It manages the life cycle of the persistence context.


    ## 165: How do you get reference of a container managed entity manager?


    Answer:


    The reference is obtained by JNDI look up or dependency injection.


    ## 166: What type of transaction is used by the container managed entity manager?


    Answer:


    Container managed entity manager uses JTA transaction.


    ## 167: Name the two scopes available in container managed persistence context?


    Answer:


    The two scopes are:


    - a) Transaction persistence scope

    - b) Extended persistence scope


    ## 168: What is the life time of a context that exists in a transaction persistence
    scope?


    Answer:


    The context lives as long as the transaction lives and closes when the transaction
    ends.


    ## 169: What annotation is used to inject an entity manager in EJB3 session bean?


    Answer:


    The ''@PersistenceContext'' annotation is used to inject entity manager in a session
    bean.


    ## 170: Is an entity manager thread safe?


    Answer:


    No entity manager instances are not thread safe. So a JNDI look up is used to
    get results and assign it in a local variable.


    ## 171: What is extended persistence context?


    Answer:


    Persistence context can be extended to live even after the transaction is complete
    and it is known as extended persistence context.


    ## 172: What is the limitation of container managed extended persistence context?


    Answer:


    The limitation is only a stateful session bean can have a container managed extended
    persistence context.


    ## 173: When do you use extended persistence context?


    Answer:


    This is used when the work flow spans multiple transactions.


    ## 174: What do you mean by application managed entity manager?


    Answer:


    In this type of entity manager, the entity management is done through application
    code.


    ## 175: What are the fundamental aspects of application managed entity manager?


    Answer:


    The fundamental aspects are:


    - a) The life cycle of entity manager instance is managed by the application code.

    - b) Persistence context is not propagated

    - c) The associated persistence context is created and destroyed by the application
    code.


    ## 176: What are the situations when you use application managed entity manager?


    Answer:


    Following are the two scenarios when we should use it:


    - a) In java SE environment where the persistence context is stand alone.

    - b) In java EE environment where we want to have more control on the entity manager
    life cycle.


    ## 177: What is the API used to retrieve entity manager?


    Answer:


    The EntityManagerFactory API is used to retrieve entity manager.


    ## 178: What should be used to manage transaction in case of application managed
    entity manager in java SE environment?


    Answer:


    The EntityTransaction interface should be used as JTA is not available.


    ## 179: When do entity instances become unmanaged?


    Answer:


    They are unmanaged and detached when a transaction scope or extended persistence
    context ends.


    ## 180: Can we send a detached entity to a remote client?


    Answer:


    Yes, it can be sent to a remote client and the client can update it and send it
    back to the server for merging with the database.


    ## 181: What is the difference between an entity in EJB2.x and EJB3.0 model?


    Answer:


    The difference is, in EJB2.x model, entities are always managed by the container
    but in EJB3.0 they can be managed by both container or the application.


    ## 182: What are the two fundamental approaches used to model java EE applications?


    Answer:


    The two fundamental models are


    - a) Use EJB session beans as façade and coordinate with back end EIS.

    - b) Use POJO as façade and remote access, transactions are managed by frameworks
    like spring.


    ## 183: What are the two persistence providers available in websphere application
    server?


    Answer:


    The two providers are:


    - a) IBM WebSphere JPA persistence provider

    - b) Apache OpenJPA persistence provider


    ## 184: Which is the default persistence provider?


    Answer:


    The WebSphere JPA persistence provider is the default one.


    ## 185: What are the enhancements available in websphere JPA persistence provider?


    Answer:


    The enhancements are as follows:


    - a) Statement batching support

    - b) WebSphere product-specific commands and scripts

    - c) Translated message files

    - d) Version ID generation

    - e) ObjectGrid cache plug-in support


    ## 186: What is JPA query language?


    Answer:


    The Java Persistence Query Language (JPQL) is used to define searches queries
    against persistent entities independent of the mechanism of storing those entities.


    ## 187: What does JPQL extend?


    Answer:


    JPQL extends EJB QL


    ## 188: What are the two type of queries offered by JPQL?


    Answer:


    The two types are:


    - a) Dynamic queries

    - b) Named queries


    ## 189: What is the main difference in dynamic and named queries?


    Answer:


    The dynamic queries are built on the fly. But named queries are used in the context.
    Named queries are mainly used when same query is invoked several times.


    ## 190: What is relationship navigation?


    Answer:


    Relationship navigation means traversing relationship between objects.


    ## 191: What is query paging?


    Answer:


    Query paging is limiting the number of results.


    ## 192: What is Message Driven Bean in EJB.0 specification?


    Answer:


    According to EJB.0 specification message driven bean is a listener.


    ## 193: MDB is used as \_\_\_\_\_\_\_?


    Answer:


    Message Driven Bean can be a JMS destination.


    ## 194: Which interface does MDB implement?


    Answer:


    Driven bean does not implement business interface but implements listener interface.


    ## 195: What annotation is used to indicate MDB?


    Answer:


    The ''@MessageDriven'' annotation is used to indicate MDB.


    ## 196: Where do you refer EJB references?


    Answer:


    The EJB references are defined in web.xml file


    ## 197: What specification is used to make EJB.0 enterprise beans as web services?


    Answer:


    The JAX-WS specification is used for this.


    ## 198: What annotation is used at class level to indicate web service?


    Answer:


    The ''@WebService’ at class level is used to describe the Web service.


    ## 199: What is JTS?


    Answer:


    Java Transaction Service (JTS) defines a low-level API as meant to be used by
    application server.


    ## 200: Which method is used for error handling in EJB.0 specification?


    Answer:


    Dependency injection strategy is used for error handling in EJB.0 specification.

