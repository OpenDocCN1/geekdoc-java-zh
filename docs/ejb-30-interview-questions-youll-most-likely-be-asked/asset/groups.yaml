    # 1: Why did you choose your college major?


    Answer:

    It''s important to display interest in your work, and if your major is related
    to your current field, it will be simple for you to relate the two. Perhaps you
    even know while in college that you wanted to do a job similar to this position,
    and so you chose the major so as to receive the education and training you needed
    to succeed. If your major doesn''t relate clearly, it''s still important to express
    a sense of passion for your choice, and to specify the importance of pursuing
    something that matters to you – which is how you made the decision to come to
    your current career field instead.


    # 2: Tell me about your college experience.


    Answer:

    It''s best to keep this answer positive – don''t focus on parties, pizza, or procrastinating.
    Instead, offer a general summary of the benefits you received in college, followed
    by an anecdote of a favorite professor or course that opened up your way of thinking
    about the field you''re in. This is a great opportunity for you to show your passion
    for your career, make sure to answer enthusiastically and confidently.'
- md: '

    ## 3: What is the most unique thing about yourself that you would bring to this
    position?


    Answer:


    This question is often asked as a close to an interview, and it gives you a final
    chance to highlight your best qualities to the employer. Treat the question like
    a sort of review, and explain why your specific mix of education, experience,
    and passions will be the ideal combination for the employer. Remain confident
    but humble, and keep your answer to about two minutes.


    ## 4: How did your last job stand up to your previous expectations of it?


    Answer:


    While it''s okay to discuss what you learned if you expected too much out of a
    previous job, it''s best to keep this question away from negative statements or
    portrayals. Focus your answer around what your previous job did hold that you
    had expected, and how much you enjoyed those aspects of the position.


    ## 5: How did you become interested in this field?


    Answer:


    This is the chance for you to show your passion for your career – and the interviewer
    will be assured that you are a great candidate if it''s obvious that you enjoy
    your job. You can include a brief anecdote in here to make your interest personal,
    but be sure that it is brief. Offer specific names of mentors or professors who
    aided in your discovery, and make it clear that you love what you do.


    ## 6: What was the greatest thing you learned while in school?


    Answer:


    By offering a lesson you learned outside of the classroom, you can show the interviewer
    your capacity for creativity, learning, and reflection. The practical lessons
    you learned in the classroom are certainly invaluable in their own right and may
    pertain closely to the position, but showing the mastery of a concept that you
    had to learn on your own will highlight your growth potential.


    ## 7: Tell me about a time when you had to learn a different skill set for a new
    position.


    Answer:


    Use a specific example to describe what you had to learn and how you set about
    outlining goals and tasks for yourself. It''s important to show that you have
    mastered the skill largely from your dedication to learning it, and because of
    the systematic approach you took to developing and honing your individual education.
    Additionally, draw connections between the skill you learned and the new position,
    and show how well prepared you are for the job.


    ## 8: Tell me about a person who has been a great influence in your career.


    Answer:


    It''s important to make this answer easy to relate to – your story should remind
    the interviewer of the person who was most influential in his or her own career.
    Explain what you learned from this person and why they inspired you, and how you
    hope to model them later in your career with future successes.


    ## 9: What would this person tell me about you?


    Answer:


    Most importantly, if this person is one of your references – they had better know
    who you are! There are all too many horror stories of professors or past employers
    being called for a reference, and not being able to recall when they knew you
    or why you were remarkable, which doesn''t send a very positive message to potential
    employers. This person should remember you as being enthusiastic, passionate,
    and motivated to learn and succeed.


    ## 10: What is the most productive time of day for you?


    Answer:


    This is a trick question – you should be equally productive all day! While it''s
    normal to become extra motivated for certain projects, and also true that some
    tasks will require additional work, be sure to emphasize to the interviewer that
    working diligently throughout the entirety of the day comes naturally to you.


    ## 11: What was the most responsibility you were given at your previous job?


    Answer:


    This question provides you with an opportunity to elaborate on responsibilities
    that may or may not be on your resume. For instance, your resume may not have
    allowed room to discuss individual projects you worked on that were really outside
    the scope of your job responsibilities, but you can tell the interviewer about
    the additional work you did and how it translated into new skills and a richer
    career experience for you.


    ## 12: Do you believe you were compensated fairly at your last job?


    Answer:


    Remember to stay positive, and to avoid making negative comments about your previous
    employer. If you were not compensated fairly, simply state that you believe your
    qualities and experience were outside the compensation limitations of the old
    job, and that you''re looking forward to an opportunity that is more in line with
    the place you''re at in your career.


    ## 13: Tell me about a time when you received feedback on your work, and enacted
    it.


    Answer:


    Try to give an example of feedback you received early in your career, and the
    steps you took to incorporate it with your work. The most important part of this
    question is to display the way you learned from the feedback, as well as your
    willingness to accept suggestions from your superiors. Be sure to offer reflection
    and understanding of how the feedback helped your work to improve.


    ## 14: Tell me about a time when you received feedback on your work that you did
    not agree with, or thought was unfair. How did you handle it?


    Answer:


    When explaining that you did not agree with particular feedback or felt it was
    unfair, you''ll need to justify tactfully why the feedback was inaccurate. Then,
    explain how you communicated directly with the person who offered the feedback,
    and, most importantly, how you listened to their response, analyzed it, and then
    came to a mutual agreement.


    ## 15: What was your favorite job, and why?


    Answer:


    It''s best if your favorite job relates to the position you''re currently applying
    for, as you can then easily draw connections between why you enjoyed that job
    and why you are interested in the current position. Additionally, it is extremely
    important to explain why you''ve qualified the particular job as your favorite,
    and what aspects of it you would look for in another job, so that the interviewer
    can determine whether or not you are a good fit.


    ## 16: Tell me about an opportunity that your last position did not allow you
    to achieve.


    Answer:


    Stay focused on the positive, and be understanding of the limitations of your
    previous position. Give a specific example of a goal or career objective that
    you were not able to achieve, but rather than expressing disappointment over the
    missed opportunity, discuss the ways you''re looking forward to the chance to
    grow in a new position.


    ## 17: Tell me about the worst boss you ever had.


    Answer:


    It''s important to keep this answer brief, and positively focused. While you may
    offer a couple of short, critical assessments of your boss, focus on the things
    you learned from working with such an individual, and remain sympathetic to challenges
    the boss may have faced.


    ## 18: What are the three most important things you''re looking for in a position?


    Answer:


    The top three things you want in a position should be similar to the top three
    things the employer wants from an employee, so that it is clear that you are well-matched
    to the job. For example, the employer wants a candidate who is well-qualified
    for and has practical experience – and you want a position that allows you to
    use your education and skills to their best applications. The employer wants a
    candidate who is willing to take on new challenges and develop new systems to
    increase sales or productivity – and you want a position that offers opportunities
    to develop, create, and lead new initiatives. The employer wants a candidate who
    will grow into and stay with the company for a long time – and you want a position
    that offers stability and believes in building a strong team. Research what the
    employer is looking for beforehand, and match your objectives to theirs.


    ## 19: How are you evaluating the companies you''re looking to work with?


    Answer:


    While you may feel uncomfortable exerting your requirements during the interview,
    the employer wants to see that you are thinking critically about the companies
    you''re applying with, just as they are critically looking at you. Don''t be afraid
    to specify what your needs from a company are (but do try to make sure they match
    up well with the company – preferably before you apply there), and show confidence
    and decisiveness in your answer. The interviewer wants to know that you''re the
    kind of person who knows what they want, and how to get it.


    ## 20: Are you comfortable working for ________ salary?


    Answer:


    The answer to this question is no, it may be a bit of a deal-breaker in a first
    interview, as you are unlikely to have much room to negotiate. You can try to
    leverage a bit by highlighting specific experience you have, and how that makes
    you qualified for more, but be aware that this is very difficult to navigate at
    this step of the process. To avoid this situation, be aware of industry standards
    and, if possible, company standards, prior to your application.


