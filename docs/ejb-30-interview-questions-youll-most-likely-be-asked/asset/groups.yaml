    - 3: 你身上最与独特且能带给这个职位的特质是什么？

    - 4: 你是如何应对你之前的预期的？

    - 5: 你是如何对这个领域产生兴趣的？

    - 6: 在学校中学到的最重要的一点是什么？

    - 7: 请讲述一次你为了新职位而必须学习不同技能组合的经历。

    - 8: 请介绍一位对你的职业生涯产生过巨大影响的人。

    - 9: 其他人会如何评价你？

