    work their creative muscles. However, you can also push others around you to create
    ideas simply by creating more of your own. Additionally, discuss with the interviewer
    the importance of questioning people as a way to inspire ideas and change.


    # 39: Describe your creativity.


    Answer:


    Try to keep this answer within the professional realm, but if you have an impressive
    background in something creative outside of your employment history, don''t be
    afraid to include it in your answer also. The best answers about creativity will
    relate problem-solving skills, goal-setting, and finding innovative ways to tackle
    a project or make a sale in the workplace. However, passions outside of the office
    are great, too (so long as they don''t cut into your work time or mental space).


    # 40: How would you handle a negative coworker?


    Answer:


    Everyone has to deal with negative coworkers – and the single best way to do so
    is to remain positive. You may try to build a relationship with the coworker or
    relate to them in some way, but even if your efforts are met with a'
