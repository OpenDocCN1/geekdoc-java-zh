    # 4: How did your last job stand up to your previous expectations of it?


    Answer:


    While it''s okay to discuss what you learned if you expected too much out of a
    previous job, it''s best to keep this question away from negative statements or
    portrayals. Focus your answer around what your previous job did hold that you
