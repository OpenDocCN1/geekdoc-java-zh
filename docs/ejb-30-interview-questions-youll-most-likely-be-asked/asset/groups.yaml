    - c) PostConstruct call back\n- d) Remove\n- e) PreDestruct call back\n\n# 36:\
    \ What are the two other life cycle stages available for stateful session bean\n\
    \nAnswer:\n\nTwo other life cycle stages are\n\n- a) PrePassivate callback\n-\
    \ b) PostActivate callback\n\n# 37: Is there any time out value for stateful session\
    \ beans?\n\nAnswer:\n\nYes, there is a time out value for stateful session beans.\
    \ The bean is not used during the time out value then it is deleted by the container\
    \ itself. But it is always advisable to remove the bean after its use without\
    \ relying on the time out mechanism.\n\n# 38: What is the usage of interceptors\
    \ in session beans or MDBs?\n\nAnswer:\n\nInterceptors are generally used to check\
    \ validation, security checks before the invocation of Business Logic methods.\n\
    \n# 39: What is a default interceptor?\n\nAnswer:\n\nDefault interceptor is a\
    \ concept provided by the EJB 3.0 specification. It is not defined by any annotation\
    \ rather it has to be written explicitly in the deployment descriptor of the EJB\
    \ module.\n\n# 40: What is the order of execution of different interceptors?\n\
    \nAnswer:\n\nThey are invoked in the following order:\n\n- a) Default interceptor\n\
    - b) Class interceptor\n- c) Method interceptor\n\n# 41: Is it possible to disable\
    \ invocation of any interceptor?\n\nAnswer:\n\nYes, Annotations like @ExcludeDefaultInterceptors\
    \ and @ExcludeClassInterceptors can be used to disable invocation.\n\n# 42: What\
    \ is dependency injection in EJB 3.0 specification?\n\nAnswer:\n\nDependency injection\
    \ is a powerful way of obtaining Java EE resources without any JNDI look up. It\
    \ makes the application loosely coupled.\n\n# 43: What is the annotation used\
    \ for EJB injection into a client code?\n\nAnswer:\n\nThe ‘@EJB annotation’ is\
    \ used to inject session beans into a client.\n\n# 44: What is the annotation\
    \ used for resource injection?\n\nAnswer:\n\nThe ‘@Resource’ annotation is used\
    \ for injecting resources.\n\n# 45: Why setter injection is used?\n\nAnswer:\n\
    \nThe resources should not be directly injected into application code. The resources\
    \ should be separated in a different component and it will make the code more\
    \ flexible. The setter injection is used to serve this purpose.\n\n# 46: What\
    \ is the usage of deployment descriptor?\n\nAnswer:\n\nAll the tasks in EJB 3.0\
    \ are done by annotations. But the same can be performed by using deployment descriptor\
    \ also.\n\n# 47: What are the two name spaces available in EJB 3.0 feature pack.\n\
    \nAnswer:\n\nFollowing are the two name spaces available:\n\n- JVM-scoped EJBlocal:\
    \ name space\n- Global JNDI name space\n\n# 48: What is the name of the format\
    \ used for packaging java enterprise applications?\n\nAnswer:\n\nThe name of the\
    \ format is Enterprise Application Archive (EAR). It contains all other modules\
    \ like WAR, RAR etc.\n\n# 49: What is the name of the deployment descriptor used\
    \ for deploying java enterprise application?\n\nAnswer:\n\nThe name of the deployment\
    \ descriptor is EJB-jar.xml.\n\n# 50: What are the two default bindings used by\
    \ the container?\n\nAnswer:\n\nThe two default bindings are:\n\n- a) Short binding\n\
    - b) Long binding\n\n# 51: What is short binding?\n\nAnswer:\n\nIn short binding,\
    \ package-qualified Java class name of the interface is only used.\n\n# 52: How\
    \ the long binding is performed?\n\nAnswer:\n\nIn long binding, bean's component\
    \ ID is used as an extra qualifier along with the package-qualified interface\
    \ class name.\n\n# 53: What are the different parts of a component ID?\n\nAnswer:\n\
    \nThe component ID for EJB is formed using the enterprise bean's application name,\
    \ module name and component name.\n\n# 54: Where do you bind local interfaces?\n\
    \nAnswer:\n\nAll local interfaces are bound into the EJBLocal: name space, which\
    \ is accessible only within the same JVM.\n\n# 55: Where do you bind the remote\
    \ interfaces and why?\n\nAnswer:\n\nAll the remote interfaces are bound into the\
    \ global-scoped name space so that they are accessible from anywhere in the WebSphere\
    \ product cell.\n\n# 56: What is the best practice for all EJB related bindings?\n\
    \nAnswer:\n\nThe best practice is to group all the EJB-related bindings under\
    \ the EJB context.\n\n# 57: Where do you provide user defined binding information?\n\
    \nAnswer:\n\nThe user defined binding information is provided in a newly created\
    \ file called META-INF/ibm-EJB-jar-bnd.xml.\n\n# 58: What are the two packaging\
    \ options available?\n\nAnswer:\n\nTwo available options are as follows:\n\n-\
    \ a) Using a Java project or Java Utility project\n- b) Using an EJB project\n\
    \n# 59: What is to be edited in the deployment descriptor when using the java\
    \ packaging option?\n\nAnswer:\n\nThe following lines need to be added in the\
    \ application.xml file:\n\n```\n<module>\n  <EJB>MyEJB3Module.jar</EJB>\n</module>\n\
    ```\n\n# 60: Do we need to add anything if we use EJB?\n\nAnswer:\n\nIf we use\
    \ the EJB project option, we do not need to add anything in the deployment descriptor.\n\
    \n# 61: What is the usage of EJB.xml file?\n\nAnswer:\n\nAccording to EJB 3.0\
    \ specification, EJB.xml file is not required because everything is mentioned\
    \ through annotations.\n\n# 62: What specification is used in EJB3.0?\n\nAnswer:\n\
    \nJava Persistence API (JPA) is used for persistence.\n\n# 63: What is the advantage\
    \ of JPA?\n\nAnswer:\n\nJPA uses a pluggable service model. So it is easy to use\
    \ with different providers.\n\n# 64: What are the three major parts of JPA?\n\n\
    Answer:\n\nFollowing are the three parts of JPA:\n- Java Persistence API\n- Object\
    \ relational mapping\n- Query language\n\n# 65: What is entity in JPA?\n\nAnswer:\n\
    \nThe main object used for persistence is called entity.\n\n# 66: Does entity\
    \ extend any class?\n\nAnswer:\n\nNo, entity is a plain java object and it does\
    \ not extend any classes.\n\n# 67: What limitation of EJB2.x has been overcome\
    \ by entities?\n\nAnswer:\n\nEntities can be serialized over RMI-IIOP but entity\
    \ beans could not.\n\n# 68: What is the name of the JPA descriptor file?\n\nAnswer:\n\
    \nThe name of the file is orm.xml JPA descriptor.\n\n# 69: Which annotation is\
    \ used to refer primary key?\n\nAnswer:\n\nThe @Id annotation is used in the entity\
    \ to refer the primary key in the table.\n\n# 70: What specification is followed\
    \ for creating an entity?\n\nAnswer:\n\nJavaBean specification is used for creating\
    \ an entity.\n\n# 71: What does @Table annotation contain?\n\nAnswer:\n\nThe @Table\
    \ annotation contains the schema and table name while an entity is mapped with\
    \ a table.\n\n# 72: Which annotation is used to map a column of a table and entity\
    \ property?\n\nAnswer:\n\nThe @Column annotation is used to map table columns\
    \ with entity property.\n\n# 73: What are the persistence mechanisms available\
    \ for entities?\n\nAnswer:\n\nThe two persistence mechanisms are:\n\n- a) Field-based\
    \ persistence\n- b) Property-based persistence\n\n# 74: Can you describe field-based\
    \ persistence?\n\nAnswer:\n\nIn field-based persistence, the getter/setter methods\
    \ are not used. Entity properties are declared as public or protected and the\
    \ JPA provider is instructed not to use getter/setter.\n\n# 75: Can you describe\
    \ property-based persistence?\n\nAnswer:\n\nIn property-based persistence, getter\
    \ and setter methods are used for persisting the data.\n\n# 76: Which persistence\
    \ mechanism is recommended and why?\n\nAnswer:\n\nProperty-based persistence mechanism\
    \ is always recommended because it adheres to java programming practices.\n\n\
    # 77: Can one entity extend another entity?\n\nAnswer:\nYes, one entity can extend\
    \ another entity.\n"
  mdcn: "\n\n即使你没有使用，规范也是。\n\n# 会话 bean (Session Beans)\n\n# 35: 描述状态会话 bean（stateful\
    \ session bean）的生命周期。\n\n答案：\n\n以下是状态会话 bean 的生命周期阶段：\n\n- a) 创建 (Create)\n- b)\
    \ 依赖注入 (Dependency injection)\n- c) PostConstruct 回调 (PostConstruct callback)\n\
    - d) 删除 (Remove)\n- e) PreDestruct 回调 (PreDestruct callback)\n\n# 36: 状态会话 bean\
    \ 其他两个生命周期阶段是什么？\n\n答案：\n\n另外两个阶段是：\n\n- a) PrePassivate 回调 (PrePassivate callback)\n\
    - b) PostActivate 回调 (PostActivate callback)\n\n# 37: 状态会话 bean 是否超时值？\n\n答案：\n\
    \n是的，状态会话 bean 有超时值。如果在超时时间内未使用，容器将自动删除它。但通常建议在使用后显式移除该 bean，而不是依赖于超时机制。\n\n#\
    \ 38: 会话 bean 或 MDB 中拦截器（interceptors）的用途是什么？\n\n答案：\n\n拦截器通常用于在调用业务逻辑方法之前进行验证和安全检查。\n\
    \n# 39: 什么是默认拦截器（default interceptor）？\n\n答案：\n\n默认拦截器是 EJB 3.0 规范提供的一个概念。它不是通过任何注解定义的，而是必须在\
    \ EJB 模块的部署描述符中显式编写。\n\n# 40: 不同拦截器的执行顺序是什么？\n\n答案：\n\n它们按照以下顺序被调用：\n\n- a) 默认拦截器\
    \ (Default interceptor)\n- b) 类拦截器 (Class interceptor)\n- c) 方法拦截器 (Method interceptor)\n\
    \n# 41: 是否可以禁用任何拦截器的调用？\n\n答案：\n\n可以，可以使用 @ExcludeDefaultInterceptors 和 @ExcludeClassInterceptors\
    \ 等注解来禁用调用。\n\n# 42: EJB 3.0 规范中的依赖注入是什么？\n\n答案：\n\n依赖注入是一种无需任何 JNDI 查找即可获取 Java\
    \ EE 资源的强大方式。它使应用程序变得松耦合。\n\n# 43: 用于将 EJB 注入到客户端代码中的注解是什么？\n\n答案：\n\n“@EJB 注解”用于将会话\
    \ bean 注入到客户端。\n\n# 44: 用于资源注入（resource injection）的注解是什么？\n\n答案：\n\n“@Resource\
    \ 注解”用于注入资源。\n\n# 45: 为什么要使用 setter 注入（setter injection）？\n\n答案：\n\n不应将资源直接注入到应用程序代码中。资源应该分离在不同的组件，这会让代码更灵活。setter\
    \ 注入用于实现这一目的。\n\n# 46: 部署描述符（deployment descriptor）的用途是什么？\n\n答案：\n\nEJB 3.0 中的所有任务都可以通过注解完成。但也可以通过部署描述符来实现。\n\
    \n# 47: EJB 3.0 功能包中提供的两个命名空间（name spaces）是什么？\n\n答案：\n\n以下是提供的两个命名空间：\n\n- JVM\
    \ 作用范围的 EJBlocal 命名空间\n- 全局 JNDI 命名空间\n\n# 48: 打包 Java 企业应用程序的格式名称是什么？\n\n答案：\n\
    \n该格式名称为企业应用归包（EAR）。它包含了所有其他模块，如 WAR、RAR 等。\n\n# 49: 用于部署 Java 企业应用程序的部署描述符的名称是什么？\n\
    \n答案：\n\n部署描述符的名称是 EJB-jar.xml。\n\n# 50: 容器使用的两个默认绑定（bindings）是什么？\n\n答案：\n\n\
    两个默认绑定是：\n\n- a) 短绑定 (Short binding)\n- b) 长绑定 (Long binding)\n\n# 51: 什么是短绑定（short\
    \ binding）？\n\n答案：\n\n在短绑定中，仅使用带包限定的接口 Java 类名。\n\n# 52: 长绑定（long binding）是如何实现的？\n\
    \n答案：\n\n在长绑定中，bean 的组件 ID 作为额外的限定符与带包限定的接口类名一起使用。\n\n# 53: 组件 ID（component ID）的不同部分是什么？\n\
    \n答案：\n\nEJB 的组件 ID 是使用企业 bean 的应用程序名称、模块名称和组件名称形成的。\n\n# 54: 你在哪里绑定本地接口（local\
    \ interfaces）？\n\n答案：\n\n所有本地接口都绑定到 EJBLocal 命名空间，该空间仅在同一个 JVM 内可访问。\n\n# 55:\
    \ 你在哪里绑定远程接口（remote interfaces），为什么？\n\n答案：\n\n所有远程接口都绑定到全局作用范围（global-scoped）命名空间，以便可以从\
    \ WebSphere 产品单元的任何地方访问。\n\n# 56: 所有与 EJB 相关的绑定的最佳实践是什么？\n\n答案：\n\n最佳实践是将所有与 EJB\
    \ 相关的绑定分组在 EJB 上下文中。\n\n# 57: 你在哪里提供用户定义的绑定信息？\n\n答案：\n\n用户定义的绑定信息提供在一个新创建的文件中，名为\
    \ META-INF/ibm-EJB-jar-bnd.xml。\n\n# 58: 可用的两种打包选项是什么？\n\n答案：\n\n两个可用选项如下：\n\n\
    - a) 使用 Java 项目或 Java 工具项目\n- b) 使用 EJB 项目\n\n# 59: 使用 Java 打包选项时，在部署描述符中需要编辑什么？\n\
    \n答案：\n\n需要在 application.xml 文件中添加以下行：\n\n```\n<module>\n  <EJB>MyEJB3Module.jar</EJB>\n\
    </module>\n```\n\n# 60: 如果我们使用 EJB，我们需要添加任何内容吗？\n\n答案：\n\n如果我们使用 EJB 项目选项，则不需要在部署描述符中添加任何内容。\n\
    \n# 61: EJB.xml 文件的用途是什么？\n\n答案：\n\n根据 EJB 3.0 规范，不需要 EJB.xml 文件，因为一切都是通过注解指定的。\n\
    \n# 62: EJB 3.0 使用什么规范？\n\n答案：\n\nJava Persistence API (JPA) 用于持久化。\n\n# 63: JPA\
    \ 的优势是什么？\n\n答案：\n\nJPA 使用可插的服务模型。因此很容易与不同的供应商配合。\n\n# 64: JPA 的三个主要部分是什么？\n\n\
    答案：\n\n以下是 JPA 的三个部分：\n- Java 持久化 API (Java Persistence API)\n- 对象关系映射 (Object\
    \ relational mapping)\n- 查询语言 (Query language)\n\n# 65: JPA 中的实体（entity）是什么？\n\
    \n答案：\n\n用于持久化的主要对象称为实体。\n\n# 66: 实体继承任何类吗？\n\n答案：\n\n不，实体是普通的 Java 对象（POJO），它不继承任何类。\n\
    \n# 67: EJB2.x 的什么局限性被实体解决了？\n\n答案：\n\n实体可以通过 RMI-IIOP 进行序列化，但实体 bean（entity beans）不能。\n\
    \n# 68: JPA 描述符文件的名称是什么？\n\n答案：\n\n文件名称是 orm.xml JPA 描述符。\n\n# 69: 使用哪个注解来引用主键？\n\
    \n答案：\n\n在实体中使用 @Id 注解来引用表中的主键。\n\n# 70: 创建实体遵循遵循什么规范？\n\n答案：\n\n使用 JavaBean 规范来创建实体。\n\
    \n# 71: @Table 注解包含什么？\n\n答案：\n\n当实体映射到表时，@Table 注解包含模式（schema）和表名。\n\n# 72: 使用哪个注解来映射表列和实体属性？\n\
    \n答案：\n\n@Column 注解用于映射表列与实体属性。\n\n# 73: 实体有哪些可用的持久化机制？\n\n答案：\n\n这两种机制是：\n\n\
    - a) 字段持久化 (Field-based persistence)\n- b) 属性持久化 (Property-based persistence)\n\
    \n# 74: 你能描述字段持久化吗？\n\n答案：\n\n在字段持久化中，不使用 getter/setter 方法。实体属性被声明为 public 或 protected，并指示\
    \ JPA 供应商不要使用 getter/setter。\n\n# 75: 你能描述属性持久化吗？\n\n答案：\n\n在属性持久化中，使用 getter\
    \ 和 setter 方法来持久化数据。\n\n# 76: 推荐使用哪种持久化机制，为什么？\n\n答案：\n\n始终推荐使用属性持久化机制，因为它符合 Java\
    \ 编程规范。\n\n# 77: 一个实体可以继承另一个实体吗？\n\n答案：\n是的，一个实体可以继承另一个实体。\n\n"
