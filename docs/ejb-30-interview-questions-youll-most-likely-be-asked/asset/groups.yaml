    ## 22: How long has it been since your last job and why?


    **Answer:**


    Be sure to have an explanation prepared for all gaps in employment, and make sure
    it''s a professional reason. Don''t mention difficulties you may have had in finding
    a job, and instead focus on positive things such as pursuing outside interests
    or perhaps returning to school for additional education.


    ## 23: What other types of jobs have you been looking for?


    **Answer:**


    The answer to this question can show the interviewer that you''re both on the
    market and in demand. Mention jobs you''ve applied for or looked at that are closely
    related to your field, or similar to the position you''re interviewing for. Don''t
    bring up last-ditch efforts that you found applying for a part-time job completely
    unrelated to your field.


    ## 24: Have you ever been disciplined at work?


    **Answer:**


    Hopefully the answer here is no – but if you have been disciplined for something
    at work though, absolutely sure that you can explain it thoroughly. Detail what
    you learned from the situation, and reflect on how you grew after the process.


    ## 25: What is your availability like?


    **Answer:**


    Your availability should obviously be as open as possible, and any gaps in availability
    should be explained and accounted for. Avoid asking about vacation or personal
    days (as well as other benefits), and convey to the interviewer how serious you
    are about your work.


    ## 26: May I contact your current employer?


    **Answer:**


    If possible, it is best to allow an interviewer to contact your current employer
    as a reference. However, if it''s important that your employer is not contacted,
    explain your reason tactfully, such as you just started job searching and you
    haven''t had the opportunity yet to inform them that you are looking for other
    employment. Be careful of this reasoning though, as employers may wonder if you''ll
    start shopping for something better while employed with them as well.


    ## 27: Do you have any valuable contacts you could bring to our business?


    **Answer:**


    It''s great if you can bring knowledge, references, or other contacts that your
    new employer may be able to network with. However, be sure that you aren''t offering
    any of your previous employer''s clients, or in any way violating contractual
    agreements.


    ## 28: How soon would you be available to start working?


    **Answer:**


    While you want to be sure that you''re available to start as soon as possible
    if the company is interested in hiring you, if you still have another job, be
    sure to give them at least two weeks'' notice. Though your new employer may be
    anxious for you to start, they will want to hire a worker whom they can respect
    for giving adequate notice, so that they won''t have to worry if you''ll eventually
    leave them in the lurch.


    ## 29: Why would your last employer say that you left?


    **Answer:**


    The key to this question is that your employer''s answer must be the same as your
    own answer about why you left. For instance, if you''ve told your employer that
    you left to find a position with greater opportunities for career advancement,
    your employer had better not say that you were let go for missing too many days
    of work. Honesty is key in your job application process.


    ## 30: How long have you been actively looking for a job?


    **Answer:**


    It''s best if you haven''t been actively looking for a job for very long, as a
    long period of time may make the interviewer wonder why no one else has hired
    you. If it has been a while, make sure to explain why, and keep it positive. Perhaps
    you haven''t come across many opportunities that provide you with enough of a
    challenge or that are adequately matched to someone of your education and experience.


    ## 31: When don''t you show up to work?


    **Answer:**


    Clearly, the only time acceptable to miss work is for a real emergency or when
    you''re truly sick – so don''t start bringing up times now that you plan to miss
    work due to vacations or family birthdays. Alternatively, you can tell the interviewer
    how dedicated to your work you are, and how you always strive to be fully present
    and to put in the same amount of work every time you come in, even when you''re
    feeling slightly under the weather.


    ## 32: What is the most common reason you miss work?


    **Answer:**


    If there is a reason that you will miss work routinely, this is the time to disclose
    it – but doing so during an interview will reflect negatively on you. Ideally,
    you will only miss work during cases of extreme illness or other emergencies.


    ## 33: What is your attendance record like?


    **Answer:**


    Be sure to answer this question honestly, but ideally you will have already put
    in the work to back up the fact that you rarely miss days or arrive late. However,
    if there are gaps in your attendance, explain them briefly with appropriate reasons,
    and make sure to emphasize your dedication to your work, and reliability.


    ## 34: Where did you hear about this position?


    **Answer:**


    This may seem like a simple question, but the answer can actually speak volumes
    about you. If you were referred by a friend or another employee who works for
    the company, this is a great chance to mention your connection (if the person
    is in good standing!). However, if you heard about it from somewhere like a career
    fair or a work placement agency, you may want to focus on that.


    ## 35: Tell me anything else you''d like to know.


    **Answer:**


    This is a great opportunity for you to give a final sell of yourself – remind
    the interviewer of why you are qualified for the position and what you can bring
    to the company that no else can. Express your excitement for the opportunity to
    work with the mission.


    ## 36: Where do you find ideas?


    **Answer:**


    Ideas can come from all places, and an interviewer wants to see that your ideas
    are just varied. Mention multiple places that you gain ideas from, and elaborate
    on how you record ideas or expand upon them later.


    ## 37: How do you achieve creativity in the workplace?


    **Answer:**


    It''s important to show the interviewer that you''re capable of being resourceful
    and innovative in the workplace, without stepping the lines of company values.
    Explain where ideas normally stem from for you (examples may include an exercise
    such as list-making or a mind map), and connect this to a particular task in your
    job that it would be helpful to be creative.


    ## 38: How do you push others to create ideas?


    **Answer:**


    If you''re in a supervisory position, this may be requiring employees to submit
    a particular number of ideas, or to complete regular idea-generating exercises,
    in order to work their creative muscles. However, you can also push others around
    you to create ideas simply by creating more of your own. Additionally, discuss
