    ## 164: 容器管理的实体管理器（entity manager）的主要功能是什么？


    答案：


    它负责管理持久化上下文（persistence context）的生命周期。


    ## 165: 如何获取容器管理的实体管理器的引用？


    答案：


    通过 JNDI 查找或依赖注入获取引用。


    ## 166: 容器管理的实体管理器使用什么类型的事务？


    答案：


    容器管理的实体管理器使用 JTA 事务。


    ## 167: 容器管理的持久化上下文有哪些范围（scopes）？


    答案：


    这两个范围是：


    - a) 事务持久化范围（Transaction persistence scope）

    - b) 扩展持久化范围（Extended persistence scope）


    ## 168: 存在于事务持久化范围内的上下文生命周期有多长？


    答案：


    上下文的生命与事务同步，并在事务结束时关闭。


    ## 169: 使用什么注解在 EJB3 session bean 中注入实体管理器？


    答案：


    使用 `@PersistenceContext` 注解在 session bean 中注入实体管理器。


    ## 170: 实体管理器是线程安全的吗？


    答案：


    实体管理器实例不是线程安全的。因此使用 JNDI 查找来获取结果并将其赋值本地变量。


    ## 171: 什么是扩展持久化上下文（extended persistence context）？


    答案：


    持久化上下文可以扩展到事务完成后仍然存在，被称为扩展持久化上下文。


    ## 172: 容器管理的扩展持久化上下文的局限性是什么？


    答案：


    局限性在于只有有状态的 session bean 才能可以拥有容器管理的扩展持久化上下文。


    ## 173: 什么时候使用扩展持久化上下文？


    答案：


    当工作流跨越多个事务时使用。


    ## 174: 应用程序管理的实体管理器（application managed entity manager）是指什么？


    答案：


    在这种类型的实体管理器中，实体管理是通过应用程序代码完成的。


    ## 175: 应用程序管理的实体管理器的基本方面有哪些？


    答案：


    基本方面是：


    - a) 实体管理器实例的生命周期由应用程序代码管理。

    - b) 持久化不支持传播。

    - c) 关联的持久化上下文由应用程序代码创建和销毁。


    ## 176: 在什么情况下使用应用程序管理的实体管理器？


    答案：


    以下是我们应该使用它的两种场景：


    - a) 在 java SE 环境下，持久化上下文是独立的。

    - b) 在 java EE 环境下，我们希望对实体管理器的生命周期有更多的控制。


    ## 177: 使用什么 API 来获取实体管理器？


    答案：


    使用 `EntityManagerFactory` API 来获取实体管理器。


    ## 178: 在 java SE 环境下，应用程序管理的实体管理器应该用什么来管理事务？


    答案：


    应该使用 `EntityTransaction` 接口，因为 JTA 是不可用的。


    ## 179: 实体实例何时变为未管理状态（unmanaged）？


    答案：


    当事务范围或扩展持久化上下文结束时，它们变为未管理且离线状态（detached）。


    ## 180: 我们可以将离线实体（detached entity）发送给远程客户端吗？


    答案：


    可以发送给远程客户端，客户端可以对其进行更新并传回服务器以与数据库合并。


    ## 181: EJB2.x 模型和 EJB3.0 模型中的实体有什么区别？


    答案：


    区别在于，在 EJB2.x 模型中，实体始终由容器管理，而在 EJB3.0 中，它们可以由容器或应用程序管理。


    ## 182:  java EE 的两种基本方法是什么？


    答案：


    两个基本模型是：


    - a) 使用 EJB session beans 作为外观（façade）并与后端 EIS 协调。

    - b) 使用 POJO 作为外观和远程访问，事务由 spring 等框架管理。


    ## 183: 可用的两种持久化提供者（persistence providers）是什么？


    答案：


    这两个是：


    - a) WebSphere JPA

    - b) Apache OpenJPA


    ## 184: 哪个是默认的持久化提供者？


    答案：


    WebSphere JPA 提供者。


    ## 185: WebSphere 持久化提供者有哪些增强？


    答案：


    增强如下：


    - a) 语句批支持

    - b) WebSphere 特定命令和脚本

    - c) 翻译文件

    - d) 版本生成

    - e) ObjectGrid 缓存支持


    ## 186: 什么是 JPA 查询语言？


    答案：


    Java 持久化查询语言（JPQL）用于独立于实体存储机制来定义查询。


    ## 187: JPQL 扩展了什么？


    答案：


    JPQL 扩展了 EQL。


    ## 188: JPQL 提供哪两种查询？


    答案：


    两种类型是：


    - a) 动态查询

    - b) 命名查询（Named queries）


    ## 189: 动态查询和命名查询的主要区别是什么？


    答案：


    动态查询是动态构建的。而命名查询主要用于多次调用相同的查询。


    ## 190: 什么是关系导航（relationship navigation）？


    答案：关系导航意味着遍历对象之间的关系。


    ## 191: 什么是查询分页（query paging）？


    答案：


    查询分页限制结果的数量。


    ## 192: EJB.0 规范中的消息驱动豆（MDB）是什么？


    答案：


    根据 EJB.0 规范，消息驱动豆 是一个监听器。


    ## 193: MDB 用作什么？


    答案：


    消息驱动豆可以是一个 JMS 目标。


    ## 194: MDB 实现了什么接口？


    答案：


    驱动豆不实现业务接口，而是实现监听器接口。


    ## 195: 使用什么注解指示 MDB？


    答案：使用 `@MessageDriven` 注解来指示 MDB。


    ## 196: 在哪里引用 EJB 引用？


    答案：EJB 引用在 `web.xml` 文件中定义。


    ## 197: 使用什么规范将 EJB.0 企业豆转换为 Web 服务？


    答案：使用 JAX-WS 规范。


    ## 198: 类级别使用什么注解来指示 Web 服务？


    答案：类级别的 `@WebService` 注解用于描述 Web 服务。


    ## 199: 什么是 JTS？


    答案：Java 事务服务（JTS）定义了一个旨在供应用程序使用的低级 API。


    ## 200: EJB.0 规范中用什么方法进行错误处理？


    答案：依赖注入策略被用于 EJB.0 规范中的错误处理。


