    - 14: 请讲述一次你收到不认同或认为不公平的工作反馈的经历。你是如何处理的？

    - 15: 你最喜欢的一份工作是什么？为什么？

    - 16: 请讲述一个你上一份职位中未能让你实现的机会。

    - 17: 请讲述你遇到过的最糟糕的老板。

