    cold shoulder, you must retain your positive attitude. Above all, stress that
    you would never allow a coworker''s negativity to impact your own work or productivity.


    ## 41: What would you do if you witnessed a coworker surfing the web, reading
    a book, etc, wasting company time?


    Answer:


    The interviewer will want to see that you realize how detrimental it is for employees
    to waste company time, and that it is not something you take lightly. Explain
    the way you would adhere to company policy, whether that includes talking to the
    coworker yourself, reporting the behavior straight to a supervisor, or talking
    to someone in HR.


    ## 42: How do you handle competition among yourself and other employees?


    Answer:


    Healthy competition can be a great thing, and it is best to stay focused on the
    positive aspects of this here. Don''t bring up conflict among yourself and other
    coworkers, and instead focus on the motivation to keep up with the great work
    of others, and the ways in which coworkers may be a great support network in helping
    to push you to new successes.


    ## 43: When is it okay to socialize with coworkers?


    This question has two extreme answers (all the time, or never), and your interviewer,
    in most cases, will want to see that you fall somewhere in the middle. It''s important
    to establish solid relationships with your coworkers, but never at the expense
    of getting work done. Ideally, relationship-building can happen with exercises
    of teamwork and special projects, as well as in the break room.


    ## 44: Tell me about a time when a major change was made at your last job, and
    how you handled it.


    Provide a set-up for the situation including the old system, what the change was,
    how it was implemented, and the results of the change, and include how you felt
    about each step of the way. Be sure that your initial thoughts on the old system
    are neutral, and that your excitement level grows with each step of the new change,
    as an interviewer will be pleased to see your adaptability.


    ## 45: When delegating tasks, how do you choose which tasks go to which team members?


    Answer:


    The interviewer is looking to gain insight into your thought process with this
    question, so be sure to offer thorough reasoning behind your choice. Explain that
    you delegate tasks based on each individual''s personal strengths, or that you
    look at how many other projects each person is working on at the time, in order
    to create the best fit possible.


    ## 46: Tell me about a time when you had to stand up for something you believed
    strongly about to coworkers or a supervisor.


    Answer:


    While it may be difficult to explain a situation of conflict to an interviewer,
    this is a great opportunity to display your passions and convictions, and your
    dedication to your beliefs. Explain not just the situation to the interviewer,
    but also elaborate on why it was so important to stand up for the issue, and how
    your coworker or supervisor responded to you afterward – were they more respectful?
    Unreceptive? Open-minded? Apologetic?


    ## 47: Tell me about a time when you helped someone finish their work, even though
    it wasn’t “your job.”


    Answer:


    Though you may be frustrated when required to pick up someone else''s slack, it’s
    important that you remain positive about lending a hand. The interviewer will
    be looking to see if you''re a team player, and by helping someone else finish
    a task that he or she couldn''t manage alone, you show both your willingness to
    help the team succeed, and your own competence.


    ## 48: What are the challenges of working on a team? How do you handle this?


    Answer:


    There are many obvious challenges to working on a team, such as handling different
    perspectives, navigating individual schedules, or accommodating difficult workers.
    It''s best to focus on one challenge, such as individual team members missing
    deadlines or failing to keep commitments, and then offer a solution that clearly
    addresses the problem. For example, you could organize weekly status meetings
    for your team to discuss progress, or assign shorter deadlines in order to keep
    the long-term deadline on schedule.


    ## 49: Do you value diversity in the workplace?


    Answer:


    Diversity is important in the workplace in order to foster an environment that
    is accepting, equalizing, and full of different perspectives and backgrounds.
    Be sure to show your awareness of these issues, and stress the importance of learning
    from others'' experiences.


    ## 50: How would you handle a situation in which a coworker was not accepting
    of someone else''s diversity?


    Answer:


    Explain that it is important to adhere to company policies regarding diversity,
    and that you would talk to the relevant supervisors or management team. When it
    is appropriate, it could also be best to talk to the coworker in question about
    the benefits of alternate perspectives – if you can handle the situation yourself,
    it''s best not to bring resolvable issues to management.


    ## 51: Are you rewarded more from working on a team, or accomplishing a task on
    your own?


    Answer:


    It''s best to show a balance between these two aspects – your employer wants to
    see that you''re comfortable working on your own, and that you can complete tasks
    efficiently and well without assistance. However, it''s also important for your
    employer to see that you can be a team player, and that you understand the value
    that multiple perspectives and efforts can bring to a project.


    And Finally Good Luck!


