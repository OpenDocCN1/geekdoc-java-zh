    ## 123: What is the default strategy used to select the type of loading?


    Answer:


    The default strategy is:


    - a) Use eager loading when context is basic or many to one

    - b) Use lazy loading when the context is one to many or many to many


    ## 124: What is cascade type?


    Answer:


    When the entity manager is reading, updating or deleting an entity, one can instruct
    it to automatically cascade the operation to the entities held in a persistent
    field by using cascade property.


    ## 125: What are the available cascade rules?


    Answer:


    Following are the different available cascade rules:


    - a) CascadeType.PERSIST

    - b) CascadeType.REMOVE

    - c) CascadeType.REFRESH

    - d) CascadeType.MERGE

    - e) CascadeType.ALL


    ## 126: Can you please describe when do you use ‘PERSIST’ cascade type?


    Answer:

    This is used when we want to persist an entity along with the entities held in
    this field.


    ## 127: Could you describe any other cascade type in brief?


    Answer:

    The other types like remove, refresh or merge are used for removing, refreshing
    or merging entities along with the values held in these fields.


    ## 128: When do you use cascade type as ‘ALL’?


    Answer:

    The ‘ALL’ is used when we want to implement all the types.


    ## 129: What is Impedance Mismatch?


    Answer:

    As we know there is always a mismatch between the object relational world. We
    have taken different strategies for persisting objects in relational database
    but the mismatch still persists. This is known as Impedance Mismatch.


    ## 130: What are the strategies used in JPA for supporting inheritance?


    Answer:


    Three strategies supported by JPA are:


    - a) Single table

    - b) Joined tables

    - c) Table per class


    ## 131: What is single table inheritance?


    Answer:


    In single table inheritance, the complete class hierarchy is mapped in a single
    base table.


    ## 132: Where do you use the @Inheritance annotation?


    Answer:


    The super root class is signed with the @Inheritance annotation.


    ## 133: What is @DiscriminatorColumn and @DiscriminatorValue annotation?


    Answer:

    The super root class is signed with @DiscriminatorColumn to indicate which column
    in the table is used to store the discriminator value. The @DiscriminatorValue
    annotation is used with the inherited classes to indicate which column is mapped
    with which entity.


    ## 134: What is the advantage of single table inheritance model?


    Answer:


    In single table inheritance, as all the entities are stored in a single table
    no Join is required to retrieve the entities. Insert and update is also easy to
    perform.


    ## 135: Will you use single table hierarchy if the hierarchy model is wide?


    Answer:


    You can always use single table hierarchy model. But in case of a wide hierarchy
    all the columns need to be stored in a single table and in that case there may
    be many columns with null values.


    ## 136: Describe the strategy used in joined table hierarchy?


    Answer:


    In this strategy the top level entity is mapped with a table that contains all
    the fields common to all the entities and the inherited entities are mapped to
    a table specific to that entity only. So at the time of reassemble, Join is performed
    to retrieve the entire hierarchy.


    ## 137: Which annotation is used to indicate primary key?


    Answer:


    The @PrimaryKeyJoinColumn annotation is used to indicate primary key.


    ## 138: What are the advantages of joined table strategy?


    Answer:


    This strategy is advantageous because we are not disturbing the existing table
    in the database. Rather we are creating tables for new entities and they are related
    with the parent entity by primary-foreign key relationship.


    ## 139: Can we use normalization in joined table strategy?


    Answer:


    Yes, we can use normalized schema while using joined table strategy without any
    redundant data.


    ## 140: Does joined table strategy have any impact on the performance?


    Answer:


    For retrieving entity hierarchy, we need to join tables which might take long
    time and complex query if the hierarchy is complex itself.


    ## 141: If you have a complex data model, which strategy should be used?


    Answer:


    In a complex data model with complex relationship, joined table strategy is best
    fit.


    ## 142: What is table per class inheritance?


    Answer:


    In this strategy super class and subclasses are stored in their own tables without
    any relationship.


    ## 143: Why @Table annotation is used with all the tables in table per class inheritance?


    Answer:


    The @Table annotation is used with all the entities because each entity is mapped
    with a separate table.


    ## 144: When do you use table per class strategy?


    Answer:


    This strategy is helpful when you are operating on a known class.


    ## 145: What is the disadvantage of per class strategy?


    Answer:


    If you do not know the subclass then it is difficult to implement this strategy
    because there is no join available between tables.


    ## 146: How do you identify subclass when it is not known to you?


    Answer:


    The identification is done by implementing look up strategy and multiple SQL queries
    one per class basis.


    ## 147: What is persistence unit?


    Answer:


    Persistence unit can be defined as a set of entity classes managed by the persistence
    manager in an application. A persistence unit represents data of a single data
    store.


    ## 148: What xml file is used to define a persistence unit?


    Answer:


    The ‘persistence.xml’ file is used to define a persistence unit.


    ## 149: What is the root of a persistence unit?


    Answer:


    The ‘persistence.xml’ file is located in the META-INF directory of the JAR.


    ## 150: What do you mean by the scope of a persistence unit?


    Answer:


    The scope of a persistence unit is determined by its unique name.


    ## 151: How is the persistence unit packaged?


    Answer:


    Persistence units are packaged as a part of WAR or EJB jar.


    ## 152: What do you mean by the transaction type mentioned in ‘persistence.xml’?


    Answer:


    The transaction type specifies the type (JTA or other) in which the persistence
    unit will participate.


    ## 153: What is mapping-file in the scope of persistence unit?


    Answer:


    The mapping file contains the persistence information to be included in the persistence
    unit.


    ## 154: Can you substitute ‘persistence.xml’ by annotations?


    Answer:


    This file is mandatory and it cannot be replaced by annotations.


    ## 155: Can we use any xml file for O-R mapping?


    Answer:


    Yes, O-R mapping can also be done in an xml file ‘orm.xml’ instead of annotations.


    ## 156: Who is responsible for persisting entities in the database?


    Answer:


    Annotations are only used to define a POJO as an entity and its mapping with the
    database table. But the persistence is done by the EntityManager interface.


    ## 157: Describe the tasks performed by the entity manager?


    Answer:


    Following are the tasks performed by the entity manager:


    - It manages the lifecycle of each entity instances

    - It manages persistence units


    ## 158: What is persistence context?


    Answer:


    Persistence context can be defined as the scope in which the entities are created,
    persisted or removed.


    ## 159: What will happen when a persistence context is closed?


    Answer:


    All the entities and the entity manager will be detached when a persistence context
    is closed. As a result any changes performed on the entity will not be reflected
    in the database.


    ## 160: What do you mean by unmanaged entities?


    Answer:


    When an entity is detached from persistence context it is known as unmanaged entity.


    ## 161: What do you mean by “merging operation performed by the persistence manager”?


    Answer:


    It means merging the state of a detached entity to its managed copy.


    ## 162: What is the function of flush operation performed by the persistence manager?


    Answer:


    The flush operation synchronizes the state of an entity to its database part.


    ## 163: Two types of entity managers available are?


    Answer:


    The two types are:


    - Container managed entity manager

    - Application managed entity manager

