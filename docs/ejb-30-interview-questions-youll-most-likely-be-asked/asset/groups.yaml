    # EJB Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    This page is intentionally left blank


    # EJB Environment


    # 1: What is an EJB container?


    Answer:


    An EJB container can be defined as a program that runs on the application server
    and implements EJB specifications.


    # 2: What is an application server?


    Answer:


    An application server can be defined as an application program that provides an
    environment to run enterprise applications.


    # 3: Why application server is popular for enterprise application development?


    Answer:


    Application servers provide all environmental support like transaction, security,
    persistence etc readily to an enterprise application. So the enterprise application
    development is much easier while application server is used for implementation.


    # 4: Name two popular application servers used nowadays?


    Answer:


    Weblogic and websphere application server.


    # 5: Where does an application server run?


    **Answer:**


    Application server can run both remotely and on the client machine.


    # 6: What is the difference between application server and EJB server?


    **Answer:**


    Application server provides support for an enterprise application and EJB server
    provides support for enterprise beans only.


    This page is intentionally left blank


    # Enterprise Beans


    # 7: What is an enterprise bean?


    Answer:


    Enterprise beans are designed to encapsulate the Business Logic of an enterprise
    application. It is a Java EE server side component and runs inside EJB container.


    # 8: When do you use enterprise bean?


    Answer:


    Enterprise beans are used for large scale enterprise application development.
    So if an enterprise application requires transaction, integrity, scalability,
    etc. then enterprise beans are the best fit.


    # 9: What are the types of beans available in EJB 3.0?


    Answer:


    - Session bean

    - Message driven bean


    # 10: Which interfaces are eliminated in EJB3.0?


    Answer:


    The home interface is eliminated.


    # 11: What are the types of beans available in EJB3.0?


    Answer:


    The home interface is eliminated.


    # 12: What is Business Logic layer?


    Answer:


    Session beans and message driven beans constitute the layer.


    # 13: What is Persistence layer?


    Answer:


    Persistence layer is used for persisting data.


    # 14: What are the types of EJB2.x?


    Answer:


    - Session bean

    - Home bean

    - Entity bean


    # 15: What are some features of EJB3.0?


    Answer:


    - Session bean

    - Persistence layer

    - Entity bean


    # 16: What are the types of beans available in EJB3.0?


    Answer:


    - Stateless session bean.


    # 17: How do you define a POJO class?


    Answer:


    By using annotations to define the EJB.


    # EJB 3.0 Interview Questions You''ll Most Likely Be Asked


    # 18: What are the types of session beans available in EJB3.0?


    Answer:


    - Stateful bean

    - Stateless bean


    # 19: When do you use a stateful session bean?


    Answer:


    A stateful session bean is used when the state of a business process needs to
    be retained.


    # 20: What are the components in EJB2.x?


    Answer:


    - Session interface

    - Home interface

    - Bean class


    # 21: What annotation is used to indicate a stateless session bean?


    Answer:


    @Stateless annotation is used to define the stateless session bean.


    # 22: What is the function of the annotation?


    Answer:


    The annotation tells the container that the POJO is session bean and enforces
    life cycle and semantics.


    # 23: What annotation is used to indicate remote interface?


    Answer:


    The @Remote annotation is used to refer remote interface.


    # 24: When do you use a stateful session bean?


    Answer:


    A stateful session bean is used when state is required.


    # 25: What annotation is used to indicate a stateful session bean?


    Answer:


    @Stateful annotation is used to indicate the session bean.


    # 26: Can a session be abstract or final POJO?


    Answer:


    The session bean must be a concrete POJO.


    # 27: Can a session EJB subclass another session bean?


    Answer:


    No, a session EJB cannot subclass another session bean. It can only subclass a
    POJO.


    # 28: Why message driven bean is used?


    Answer:


    Message driven beans are used to process asynchronous messages within a J2EE based
    application.


    # 29: Who is responsible for invoking a message driven bean?


    Answer:


    Message driven beans are invoked by the container. They are never invoked by a
    client or another bean.


    # 30: What annotation is used for a message driven bean?


    Answer:


    The @MessageDriven annotation is used for a message driven bean.


    # 31: What is the name of the interface implemented by a message driven bean?


    Answer:


    The MessageListener interface is implemented by message driven bean. There is
    only one method defined inside it known as onMessage.


    # 32: What is the name of the property used in message driven bean for configuration
    related information?


    Answer:


    The name is ActivationConfigProperty. It contains all configuration information.


    # 33: What is the impact of annotations on call back methods?


    Answer:


    Annotations are used to mark call back methods which are required for life cycle
    management.


    # 34: Are the life cycle methods mandatory in EJB 3.0 specification?


    Answer:


    No, implementation of life cycle methods are optional in EJB 3.0 specification.
    But they are mandatory in EJB 2.x.

