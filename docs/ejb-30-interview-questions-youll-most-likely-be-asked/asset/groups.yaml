- md: '

    EJB 3.0 Interview Questions You''ll Most Likely Be Asked 37


    Yes, one entity can extend another entity. In that case the properties are automatically
    persisted.


    # 80: Can entity extend a class?


    Answer:


    Yes, an entity can also extend a class. But in that case the properties of that
    class will not be persisted as it is not declared as entity.


    # 81: When do you use @Basic annotation?


    Answer:


    If you want to persist any standard value as-is in the data store then the annotation
    @Basic is used.


    # 82: When do you use @Transient annotation?


    Answer:


    The @Transient annotation is used if you do not want to persist a field in an
    entity.


    # 83: What are the ways of specifying entity identities?


    Answer:


    There are three different ways for identifying entity identities:


    - a) @Id annotation

    - b) @IdClass annotation

    - c) EmbeddedId annotation


    # 84: When do you use @Id annotation?


    Answer:


    The @Id annotation is suitable when:


    - a) A natural primary key is available

    - b) When a surrogate key is available


    # 85: How do you manage composite primary key?


    Answer:


    Composite primary key is defined by using @IdClass or @EmbeddedId annotation.


    # 86: What methods are overridden to make composite primary key?


    Answer:


    The ‘equals’ and ‘hashCode’ methods are overridden while making a composite primary
    key.


    # 87: Why setter method is not available while making a composite primary key?


    Answer:


    There is no setter method because after constructing it using primary key values,
    it can not be changed anymore.


    # 88: When do you use @EmbeddedId annotation?


    Answer:


    This annotation is used to model persistent objects that have no identity of their
    own because they are nested inside another entity.


    # 89: What annotation is used for generating automatic identity?


    Answer:


    The @GeneratedValue annotation is used for automatic Id generation.


    # 90: What are the four automatic generation types available in JPA?


    Answer:


    The four types are as follows:


    - a) GenerationType.IDENTITY

    - b) GenerationType.SEQUENCE

    - c) GenerationType.AUTO

    - d) GenerationType.TABLE


    # 91: When do you use generation type as identity and sequence?


    Answer:


    ''IDENTITY'' generation type is used when the persistence provider uses database
    identity column for generating identity,

    ''SEQUENCE'' generation type is used when the persistence provider uses database
    sequence for generating identity.


    # 92: When do you use ‘AUTO’ generation type?


    Answer:


    ''AUTO'' is used when the persistence provider selects a primary key generator
    that is most appropriate for the underlying database.


    # 93: What is the meaning of ‘TABLE’ generation type?


    Answer:


    The ''TABLE'' generation type is used to specify that the persistence provider
    assigns primary keys for the entity using an underlying database table.


    # 94: Which generator type is portable?


    Answer:


    The ''TABLE'' generator type is the most portable solution.

    It only uses a regular database table which can be used on any RDBMS.


    # 95: What are the transaction mechanisms available when a primary key is created
    during an active transaction?


    Answer:


    Following are the two mechanisms available:


    - a) Suspend the current transaction

    - b) Use a separate transaction


    # 96: What are the call back methods available in JPA?


    Answer:


    Following are the call back methods available in JPA:


    - a) @PostLoad

    - b) @PrePersist

    - c) @PostPersist

    - d) @PreUpdate

    - e) @PostUpdate

    - f) @PreRemove

    - g) @PostRemove


    # 97: When do you use @PostLoad call back method?


    Answer:


    The @PostLoad callback method is invoked after the entity has been loaded into
    the current persistence context and also when a refresh operation has been applied
    to it.


    # 98: When do you call @PrePersist and @PreRemove?


    Answer:


    The @PrePersist and @PreRemove callback methods are invoked for a given entity
    just before the respective persist and remove operations for that entity are performed.


    # 99: When do you use @PreUpdate and @PostUpdate callbacks?


    Answer:


    The @PreUpdate and @PostUpdate callbacks are used before and after the database
    update operations.


    # 100: When do you use @PostPersist and @PostRemove callback methods?


    Answer:


    The @PostPersist and @PostRemove callback methods are invoked for an entity just
    after the entity has been made persistent or removed.


    # 101: Which are the two ways of using call back methods for an entity?


    Answer:


    The call back methods can be directly inserted in the entity class or they can
    be kept in a separate class and referred it.


    # 102: Which annotation is used while the call backs are kept in a separate class?


    Answer:


    The @EntityListeners annotation is used in the entity class to refer the call
    backs.


    # 103: How do you define relationship in JPA?


    Answer:


    In JPA relationships are defined through object references from a source object
    to a destination object.


    # 104: What do you mean by unidirectional relationship between objects?


    Answer:


    The relationship is unidirectional means the source object has a reference to
    the target object but it is not guaranteed that the target object has a reference
    to the source object.


    # 105: What are the different types of relationships available in JPA?


    Answer:


    The relationships are:


    - a) one-to-one

    - b) many-to-one

    - c) one-to-many

    - d) many-to-many


    # 106: When do you use @ToOne annotation?


    Answer:


    The @ToOne annotation is used to define many-to-one relationship.


    # 107: What is bidirectional relationship?


    Answer:


    In bidirectional relationship, the source object has a reference to the target
    object and the target object has a reference to the source object.


    # 108: How do you define one-to-one relationship?


    Answer:


    One-to-one relationship is implemented using @OneToOne and @JoinColumn annotations.


    # 109: What is JoinColumn in JPA?


    Answer:


    JoinColumn is used to specify the foreign key column in the database.


    # 110: Is there any default mechanism to create JoinColumn?


    Answer:


    If you do not specify JoinColumn, a default name is assumed based on the field
    name.


    # 111: What is one-to-many relationship?


    Answer:


    One-to-many relationship is where one entity is associated with multiple other
    entities.


    # 112: How do you implement many-to-many relationship?


    Answer:


    Many-to-many relationship is implemented using @ManyToMany and @JoinTable annotations.


    # 113: What are the annotations used in many-to-many relationship?


    Answer:


    @ManyToMany and @JoinTable annotations are used to implement many-to-many relationship.

