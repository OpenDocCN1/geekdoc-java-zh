  md: '# 11: EJB3.0 is developed on ________ model?


    Answer:


    EJB3.0 is developed based on Plain Old Java Object (POJO) programming model.


    # 12: What is a Business Logic layer in EJB?


    Answer:


    Session beans and message-driven beans together constitute the Business Logic
    layer in EJB.


    # 13: What is Persistence layer?


    Answer:


    This is the layer responsible for persisting the application data in a relational
    database. Entity beans are used in this layer.


    # 14: What are the negative sides of EJB2.x specification?


    Answer:


    Following are some negative sides of EJB2.x specification:


    +   a) Component interface to implement interfaces from EJB framework package.
    So the components are tightly coupled.

    b) EJB deployment descriptors are very complex and error prone.'
