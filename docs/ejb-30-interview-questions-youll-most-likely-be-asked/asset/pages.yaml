    were to get started in the field.


    # 22: How long has it been since your last job and why?


    **Answer:**


    Be sure to have an explanation prepared for all gaps in employment, and make sure
    it''s a professional reason. Don''t mention difficulties you may have had in finding
    a job, and instead focus on positive things such as pursuing outside interests
    or perhaps returning to school for additional education.


    # 23: What other types of jobs have you been looking for?


    **Answer:**


    The answer to this question can show the interviewer that you''re both on the
    market and in demand. Mention jobs you''ve applied for or looked at that are closely
    related to your field, or similar to the position you''re interviewing for. Don''t
    bring up last-ditch efforts that you found applying for a part-time job completely
    unrelated to your field.'
