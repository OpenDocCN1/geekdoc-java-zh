    while employed with them as well.


    # 27: Do you have any valuable contacts you could bring to our business?


    Answer:


    It''s great if you can bring knowledge, references, or other contacts that your
    new employer may be able to network with. However, be sure that you aren''t offering
    any of your previous employer''s clients, or in any way violating contractual
    agreements.


    # 28: How soon would you be available to start working?


    Answer:


    While you want to be sure that you''re available to start as soon as possible
    if the company is interested in hiring you, if you still have another job, be
    sure to give them at least two weeks'' notice. Though your new employer may be
    anxious for you to start, they will want to hire a worker whom they can respect
    for giving adequate notice, so that they won''t have to worry if you''ll eventually
    leave them in the lurch.'
