    This is not the cleanest piece of coding but it does highlight the problem: the
    method argument `str` has been reassigned to a different value (and used as a
    local variable). In these cases (and without exception) this coding pattern should
    be avoided and can be by declaring method arguments as `final`.


    Below is an example of this:


    ```java

    01 | public String sanitize( final String str ) {

    02 |     String sanitized = str;

    03 |

    04 |     if( !str.isEmpty() ) {

    05 |             sanitized = str.trim();

    06 |     }

    07 |

    08 |     sanitized = sanitized.toLowerCase();

    09 |     return sanitized;

    10 | }

    ```


    Coding that follows this simple rule is generally easier to follow and reason
    with. This is done even at the expense of introducing local variables.


    ### Boxing and unboxing


    Boxing and unboxing are Java techniques that allow conversion between primitive
    types (`int`, `long`, `double`) and respective primitive type wrappers (`Integer`,
    `Long`, `Double`).


    Even though the Java compiler attempts to hide those conversions by performing
    autoboxing, this may make things worse and sometimes leads to random results.


    Below is an example:


    ```java

    01 | public static void calculate( final long value ) {

    02 |     // Some implementation here

    03 | }

    1 | final Long value = null;

    2 | calculate( value );

    ```


    This code snippet compiles well, but it gives `NullPointerException` on line `02`
    as the conversion between `Long` and `long` executes. The best point of advice
    here would be to use the primitive type (but as we already know, in some cases
    it is not possible).


    ### Interfaces


    Interfaces should have preference over concrete classes where possible. This should
    convince you to at least consider interfaces first by showing these real examples.


    Interfaces are only tied to default methods, not any particular implementation.
    They function merely as contracts, they provide much of the freedom and flexibility
    in the way the contracts could be fulfilled. Flexibility like this becomes more
    important if the implementation involves external services or systems.


    Below is an example of a simple interface and its possible implementation:


    ```java

    1 | public interface TimezoneService {

    2 |     TimeZone getTimeZone( final double lat, final double lon) throws IOException;

    3 | }

