    | 13 |  |


    | 14 |     public  IOException(Throwable cause) { |


    | 15 |         super(cause); |


    | 16 |     } |


    | 17 | } |


    Checked and unchecked exceptions has introduced more boilerplate and ugly code
    patterns than solved the real problems. The typical pattern that has emerged within
    Java ecosystem is, to hide, or wrap, the checked exception within unchecked one.


    Below is an example:


    | 1 | try  { |


    | 2 |     // Some I/O operation here |'
