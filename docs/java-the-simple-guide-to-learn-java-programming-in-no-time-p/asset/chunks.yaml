    \ anti-patterns, and idioms. There is a wealth of analysis available to guide\
    \ you in increasing your development productivity, design, and process patterns\
    \ and anti-patterns, as well as programming idioms.\n\n# Chapter 1 – General Programming\
    \ Guidelines\nWe will begin this tutorial by discussing general principles of\
    \ good programming style as well as those that define robust design in Java. Most\
    \ of these principles have been touched on in introduction to Java Programming,\
    \ however many practical advices shall be introduced in this chapter to improve\
    \ your skills as a developer.\n\n### Variable scope\nwithin the Java language,\
    \ each local variable, once it has been declared, has a definitive scope. The\
    \ variable then becomes visible from the place it is declared to the ending of\
    \ the method, or code block it is now declared in. Therefore, one single rule\
    \ is necessary; declare the local variable as close as possible to the place where\
    \ it is used. Below are some examples:\n\n```\nfor(final locale : Locale.getLocales())\
    \ {\n    // Some implementation here\n}\n\ntry(InputStream in = new FileInputStream(\"\
    file.txt\")) {\n    // Some implementation here\n}\n```\n\nWith each snippet the\
    \ local variable’s scope is limited only to blocks they are declared in. When\
    \ the block ends, the local variable is not visible anymore and goes out of scope.\
    \ The look is clean and concise but with the introduction of lambdas and the release\
    \ of Java 8, Much of well-known idioms using local variables are becoming obsolete.\
    \ Here is a rewrite of the `forEach` loop from the above example utilizing lambdas\
    \ instead:\n\n```\nArrays.stream(Locale.getLocales()).forEach((locale) -> {\n\
    \    // Some implementation here\n});\n```\nNotice that the local variable becomes\
    \ the argument of this function which then is passed as the argument of `forEach`\
    \ method.\n\n### Class fields and local variables\nEvery method in Java will belong\
    \ to some distinct class (or, in some cases some interface, like Java 8 where\
    \ the method is declared as default). There is a probability of some conflicts\
    \ with local variables that are used in method implementations and as class members.\
    \ The Java compiler will pick the correct variable from the scope, however it\
    \ may not be the exact one the developer intended to use. Many modern IDEs do\
    \ much work to alert the developer when conflicts such as these are taking place\
    \ (red script, highlighting and warnings) however, it is still better to be proactive\
    \ while the development. Below is an example:\n\n```\nclass LocalVariableAndClassMember\
    \ {\n    private long value;\n\n    public long calculateValue(final long initial)\
    \ {\n        long value = initial;\n        value *= 10;\n        value += value;\n\
    \        return value;\n    }\n}\n```\nThis example appears to be very simple\
    \ but there is one catch. The method called `calculateValue` introduces a local\
    \ variable named `value` and hides the class member with the same name by doing\
    \ that. Code 8 should sum the class member and the local variable but in application\
    \ it does something different. A corrected version would look like that (with\
    \ keyword `this`):\n\n```\nclass LocalVariableAndClassMember {\n    private long\
    \ value;\n\n    public long calculateValue(final long initial) {\n        long\
    \ value = initial;\n        value *= 10;\n        value += this.value;\n     \
    \   return value;\n    }\n}\n```\nThis simple implementation highlights an important\
    \ issue that in some cases would take more than a few hours to troubleshoot and\
    \ debug.\n\n### Method arguments and local variables\nA different scenario that\
    \ many beginning developers fall into is using method arguments as local variables.\
    \ Java allows reassignment of `non-final` method arguments with an alternate value\
    \ (but this has no effect on the original value). In example:\n\n```java\npublic\
    \ String sanitize(String str) {\n    if(!str.isEmpty()) {\n        str = str.trim();\n\
    \    }\n    str = str.toLowerCase();\n    return str;\n}\n```\n"
