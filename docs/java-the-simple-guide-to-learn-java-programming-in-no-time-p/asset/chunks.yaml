    ### Strings


    Some of the most widely used types in Java and most of the programming languages
    are `Strings`. Java natively supports the concatenations and comparison through
    simplifying much of the routine operations over strings. The Java standard library
    also provides many unique classes to increase efficiency of strings operations.


    Strings are immutable objects in Java, and are represented in UTF-16 format. Each
    time the strings are concatenated (or any operation which modifies the original
    string is performed) a new instance of `String` class is created. That is why
    the concatenation operations become ineffective, initiating many intermediate
    instances (also called generating garbage).


    There are two helpful classes provided in the Java standard library that aim to
    facilitate string manipulations: `StringBuilder` and `StringBuffer` (mainly different
    in that `StringBuffer` is thread-safe while `StringBuilder` is not).


    Below are a few examples using one of these classes:


    ```java

    01 | final StringBuilder sb= new StringBuilder();

    02 |

    03 | for( int i = 1; i <= 10; ++i ) {

    04 |     sb.append( " ");

    05 |     sb.append( i );

    06 | }

    07 |

    08 | sb.deleteCharAt( 0 );

    09 | sb.insert( 0, "[);

    10 | sb.replace( sb.length() - 3, sb.length(), "]" );

    ```


    Using `StringBuilder` / `StringBuffer` is recommended to manipulate strings, however
    it may look over the top when concatenating two or three strings; in this case
    the regular `+` operator may be used instead. Below is an example:


    ```java

    1 | String userId= "user:" + new Random().nextInt(100);

    ```


    The use of string formatting is an alternative to straightforward concatenation
    and Java standard library provides the static helper method `String.format`. It
    also supports a complete set of format specifiers, including dates/times, characters,
    numbers, etc. (see the full reference [official documentation](https://docs.oracle.com/javase/7/docs/api/java/util/Formatter.html#syntax)).


    Below explore the power of formatting by example:


    ```text

    1 | String.format( "%04d", 1 ) -> 0001

    2 | String.format( "%.2f", 15.643624d ) -> 15.64

    3 | String.format( "%tR", new Date() ) -> 14:07

    4 | String.format( "%tF", new Date() ) -> 2016-20-04

    5 | String.format( "%d%%", 22 ) -> 22%

    ```

