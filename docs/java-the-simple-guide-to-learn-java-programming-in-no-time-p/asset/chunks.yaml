    # Chapter 2- How & When to Use Exceptions


    Introduction


    Exceptions in Java signal abnormal, or exceptional, conditions in the flow of
    the program that may prevent it from making further progress. These exceptional
    conditions could be fatal; where the program is not able to function anymore and
    should be terminated.  Or the conditions could be recoverable; where the program
    continues to run but some functionality may be lost.


    Here we will walk through a typical scenario utilizing exceptions in Java  Explain
    the checked and unchecked exceptions, and touch on some corner cases and helpful
    idioms.


    Exceptions: when to use them


    Simply put exceptions are events or signals that happen while a program is executing
    and interrupt the normal flow of execution. Exceptions are a replacement to the
    error codes and status checking techniques used in the early days of coding. Now
    exceptions have gained acceptance as the standard in dealing with error conditions
    in varied coding languages, including Java.


    Exceptions handling has only one important rule universally: do not ignore them.
     Each exception should be logged but never ignored. There are rare instances when
    an exception could be safely ignored because not much can be done with it.


    Exceptions are a crucial part of argument validation and sanity checks. Every
    public method should verify inclusion of all required preconditions prior to doing
    any real work and raise the appropriate exception if some have not been met.


    Checked and unchecked exceptions


    Management of exceptions in the Java language is unique. There are two distinct
    classes of exceptions in Java: checked exceptions and unchecked exceptions. These
    two classes are primarily artificial, imposed by Java language rules and its compiler.
     It should be noted that JVM makes no difference between them.


    Unchecked exceptions signal erroneous conditions related to program logic and
    assumptions being made (invalid arguments, null pointers, unsupported operations,
    etc). An unchecked exception would be a subclass of RuntimeException and that
    is how Java compiler sees that a specific exception belongs to the class of unchecked
    items.


    An unchecked exception is not required to be defined as caught by the caller or
    to be listed part of the method signature (this throws keyword).NullPointerException  is
    a widely known member of unchecked exceptions.


    Here is its declaration from the Java standard library:


    | 1 | public  class  NullPointerExceptionextends  RuntimeException { |


    | 2 |     public  NullPointerException() { |


    | 3 |         super(); |


    | 4 |     } |


    | 5 |  |


    | 6 |     public  NullPointerException(String s) { |


    | 7 |         super(s); |


    | 8 |     } |


    | 9 | } |


    Checked exceptions show invalid conditions in areas outside the immediate control
    of the program (like memory, network, file system, etc). A checked exception is
    a direct subclass of Exception. Unlike the unchecked exceptions, checked exceptions
    must be aughtby the caller or listed as a part of the method signature (thisthrows
    keyword). The  IOException is the most known in checked exceptions:


