    # Chapter 1 – General Programming Guidelines


    We will begin this tutorial by discussing general principles of good programming
    style as well as those that define robust design in Java. Most of these principles
    have been touched on in the introduction to Java Programming, however many new
    practical advices shall be introduced in this chapter to improve your skills as
    a Java developer.


    Variable scope


    within the Java programming language, each local variable, once it has been declared,
    has a definitive scope. The variable then becomes visible from the place where
    it is declared to the ending of the method, or code block that it is now declared
    in. Therefore, only one single rule is necessary to follow; declare the local
    variable as close as possible to the place where it is used. Below are some typical
    examples:


    | 1 | for( final  Locale locale: Locale.getAvailableLocales() ) { |


    | 2 |     // Some implementation here |


    | 3 | } |


    | 4 |  |


    | 5 | try( final  InputStreamin = new  FileInputStream( "file.txt"  ) ) { |


    | 6 |     // Some implementation here |


    | 7 | } |


    With each code snippet the local variable’s scope is limited only to what execution
    blocks they are now declared in. When the block ends, the local variable is not
    visible anymore and goes out of scope. The look is clean and concise but with
    the introduction of lambdas and the release of Java 8, Much of the  well-known
    idioms for using local variables are becoming totally obsolete.


    Here is a rewrite of the ‘forEach’ loop from the above example utilizing lambdas
    instead:


    | 1 | Arrays.stream( Locale.getAvailableLocales() ).forEach( ( locale ) -> { |


    | 2 |         // Some implementation here |


    | 3 |     } |


    | 4 | ); |


    Notice that the local variable becomes the argument of this function which then
    itself is passed as the argument of the forEach method.


    Class fields and local variables


    Every method in Java will belong to some distinct class (or, in some cases some
    interface, like Java 8 where the method is declared as default). There is a probability
    of some name conflicts with local variables that are used in method implementations
    and as class members. The Java compiler will pick the correct variable from the
    scope, however it may not be the exact one the developer intended to use. Many
    modern Java IDEs do much work to alert the developer when conflicts such as these
    are taking place (red script, highlighting and warnings) however, it is still
    better to be proactive while in the development.


    Below is an example:


    | 01 | public  class  LocalVariableAndClassMember { |


    | 02 |      private  long  value; |


    | 03 |  |


    | 04 |      public  long  calculateValue( final  long  initial ) { |


    | 05 |          long  value = initial;        |


    | 06 |  |


    | 07 |          value *= 10; |


    | 08 |          value += value; |


    | 09 |  |


    | 10 |          return  value; |


    | 11 |      } |


    | 12 |  } |


    This example appears to be very simple but there is one catch. The method called
    calculateValue introduces a local variable named value and hides the class member
    with the same name by doing that.  Code line 08 should sum the class member and
    the local variable but in application it does something different. A corrected
    version would look like that (with keyword this):


    | 01 | public  class  LocalVariableAndClassMember { |


    | 02 |      private  long  value; |


    | 03 |  |


    | 04 |      public  long  calculateValue( final  long  initial ) { |


    | 05 |          long  value = initial;        |


    | 06 |  |


    | 07 |          value *= 10; |


    | 08 |          value += this.value;        |


    | 09 |  |


    | 10 |          return  value; |


    | 11 |      } |


    | 12 |  } |


    This simple implementation highlights an important issue that in some cases would
    take more than a few hours to troubleshoot and debug.


    Method arguments and local variables


    A different scenario that many beginning developers fall into is using method
    arguments as local variables. Java allows reassignment of  non-final method arguments
    with an alternate value (but this has no effect on the original value).


    In example:


    | 1 | public  String sanitize( String str ) { |


    | 2 |     if( !str.isEmpty() ) { |


    | 3 |         str = str.trim(); |


    | 4 |     } |


    | 5 |  |


    | 6 |     str = str.toLowerCase(); |


    | 7 |     return  str; |


    | 8 | } |'
