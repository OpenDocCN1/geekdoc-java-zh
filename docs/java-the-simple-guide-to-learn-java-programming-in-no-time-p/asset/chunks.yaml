  raw: 'There is no reason to strictly follow any specific naming conventions in Java,
    but there are a set of easy to follow rules that make Java code look uniform across
    standard library or any other Java project in the wild.


    *   local variable and method arguments names are typed in camel case:str,newLength,minimumCapacity


    *   static final field or enumeration constant names are typed in upper case,
    separated by underscore  ‘_’:LOG,MIN_RADIX,INSTANCE


    *   class, enum, interface or annotation names are typed in capitalized case:StringBuilder,Runnable,@Override


    *   generic type parameter names are usually represented as one character in upper
    case:  T,U,E


    *   method or field names(exceptstatic final)are typed in camel case:isEmpty,format,addAll


    *   package names are typed in lower case:org.junit,com.fasterxml.jackson,javax.json


    With these simple conventions the code will look concise and indistinguishable
    other library or framework.


    Standard Libraries


    the Java standard libraries have some rough edges and strange design decisions
    but 99% of it is high quality code written by coding experts. It is worth being
    familiar with these resources.


    Each new Java release includes many new features being added to existing libraries
    (and possible deprecation of the older ones) and addition of new libraries. Java
    5 introduced a  new concurrency library that reconciles as  java.util.concurrent
    package. Java 6 debuteda scripting supportjavax.script package and Java compiler
    API  javax.tools package.  Java 7 included improvements to  java.util.concurrent,featured
    a  newI/O library under  java.nio.file package, and dynamic languages support
    with  java.lang.invoke package. Currently, Java 8 has delivered the long-awaited
    date/time API hosted as  java.time package.


    Java’s platform is growing and evolving; it is extremely important to keep educated
    in  this evolution. Whenever a third-party library or framework is introduced
    into a project, ensure the required functionality is not available in the Java
    standard libraries.


    Immutability


    Please take immutability seriously. If a class being designed or a method being
    implemented might provide the immutability guarantee, it could be used almost
    universally without fearing concurrent modifications. This will improve life as
    a developer and team member.


    Testing


    Test-driven development (TDD) practices are widely practiced in the Java community,
    constantly working to raise the bar of the coding quality. TDD brings many benefits
    to the table, however Java standard library does not currently include any test
    framework or scaffolding.


    Testing is still a necessary part of modern Java development.  Here we will cover
    some basics using a well written JUnit framework. Using JUnit, each test is a
    set of assertions regarding the expect object state or behavior.


    Great tests are short and simple, testing one thing at a time. let us test to
    verify that  String.format  function from the section Strings  returns the desired
    results by writing a set of tests:


