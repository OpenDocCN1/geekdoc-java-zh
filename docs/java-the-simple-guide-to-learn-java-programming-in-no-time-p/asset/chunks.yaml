  trans: "\n\n```java\n} catch( final IOException ex ) {\n    throw new RuntimeException(\
    \ \"I/O operation failed\", ex );\n}\n```\n\n精心设计的异常层次结构可以减少所需的样板代码量。\n\nJava\
    \ 中另一类继承自 `Error` 类的额外异常是 `OutOfMemoryError` 或 `StackOverflowError`。这些异常表示致命的执行失败，会导致程序立即终止且没有任何恢复可能。\n\
    \n### 使用 try-with-resources\n\n栈回溯通常是由抛出异常引起的。程序执行流的变异通常以这种方式发生。例如，直接与未关闭的本地资源、网络套接字文件句柄相关的资源泄漏，就是这些抛出异常的结果。\n\
    \n在 Java（ 7 版本之前）中，一个良好的典型 I/O 操作使用强制的 `finally` 块来执行清理工作：\n\n```java\npublic\
    \ void readFile( final File file ) {\n    InputStream in = null;\n    try {\n\
    \        in = new FileInputStream( file );\n        // Some implementation here\n\
    \    } catch( IOException ex ) {\n        // Some implementation here\n    } finally\
    \ {\n        if( in != null ) {\n            try {\n                in.close();\n\
    \            } catch( final IOException ex ) {\n                /* do nothing\
    \ */\n            }\n        }\n    }\n}\n```\n\n`finally` 块没有写得很好（但对输入流调用 `close`\
    \ 方法也可能导致 `IOException` 异常），关闭输入流（并释放其操作系统资源）的操作将被执行。异常永远不应该被忽略，但 `close` 方法抛出的异常是这一规则的唯一例外。\n\
    \nJava 7 在语言中引入了一种名为 `try-with-resources` 的新结构，使得整体资源管理变得更加简单。\n\n以下是使用 `try-with-resources`\
    \ 重写的上述代码段：\n\n```java\npublic void readFile( final File file ) {\n    try( InputStream\
    \ in = new FileInputStream( file ) ) {\n        // Some implementation here\n\
    \    } catch( final IOException ex ) {\n        // Some implementation here\n\
    \    }\n}\n```\n\n资源需要实现 `AutoCloseable` 接口才能在 `try-with-resources` 块中使用。Java\
    \ 编译器在后台将此结构扩展为更复杂的内容，而对开发者来说，代码看起来非常易读且简洁。在适当的情况下，这是一种非常方便的技术。\n\n### 异常与 lambda\n\
    \n未捕获异常将按预期工作，但 Java lambda 函数的语法不允许指定检查异常；除非这些异常是由 `@FunctionalInterface` 本身定义的（异常可能被抛出）。\n\
    \n下面的代码段将无法通过编译，产生编译错误‘Unhandled exception type IOException’（该异常可能在第 03 行抛出）：\n\
    \n```java\npublic void readFile() {\n    run( () -> {\n        Files.readAllBytes(\
    \ new File( \"some.txt\" ).toPath() );\n    } );\n}\n\npublic void run( final\
    \ Runnable runnable ) {\n    runnable.run();\n}\n```\n\n解决方案是在 lambda 体内部捕获 `IOException`\
    \ 异常并重新抛出正确的 `RuntimeException`（将原始异常作为原因传递）。以下是一个示例：\n\n```java\npublic void\
    \ readFile() {\n    run( () -> {\n        try {\n            Files.readAllBytes(\
    \ new File( \"some.txt\" ).toPath() );\n        } catch( IOException ex ) {\n\
    \            throw new RuntimeException( \"Error reading file\", ex );\n     \
    \   }\n    } );\n}\n```\n\n许多函数式接口已经声明，并能够从其实现中抛出任何 `Exception`，但如果没有（如 `Runnable`），则包装或在未捕获异常内部捕获检查异常是做法。\n\
    \n### 标准异常\n\nJava 标准库提供了关于异常类的丰富信息。这些类专门设计用于涵盖处理过程中发生的大多数通用错误。下表了经常使用的异常类，在定义自己的异常之前，务必考虑这些。\n\
    \n| 异常类 | 目的 |\n| :--- | :--- |\n| `NullPointerException` | 尝试在需要对象的地方使用 null。\
    \ |\n| `IllegalArgumentException` | 方法传递了非法或不适当的参数。 |\n| `IllegalStateException`\
    \ | 在非法或不恰的时间调用了方法。 |\n| `IndexOutOfBoundsException` | 索引（针对向量、字符串或数组）超出范围。 |\n\
    | `UnsupportedOperationException` | 请求的操作不支持。 |\n| `ArrayIndexOutOfBoundsException`\
    \ | 使用非法索引访问数组。 |\n| `ClassCastException` | 代码尝试将对象转换为其并非其实例的子类。 |\n| `EnumConstantException`\
    \ | 尝试通过名称访问枚举常量，但类型中不包含该名称的常量。 |\n| `NumberFormatException` | 尝试将字符串转换为数值类型之一，但字符串不具有相应的格式。\
    \ |\n| `StringOutOfBoundsException` | 索引为负数或大于字符串的大小。 |\n| `IOException` | 发生了某种\
    \ I/O 异常。该类是失败或中断的 I/O 操作产生的异常通用类。 |\n\n### 定义你自己的异常\n\n在 Java 语言中定义异常类非常容易。精心设计的异常层次结构可以管理详细的错误条件，并允许详细的实现。实现正确的平衡至关重要；特别是存在许多异常类时，它们可能会复杂开发，并增加捕获异常或向下栈传递异常所需的代码量。\n\
    \n所有用户定义的异常必须继承自 `RuntimeException` 类，并成为未捕获异常类的一部分，该规则总有一些例外。以下是用于身份验证的定义异常：\n\
    \n```java\npublic class NotAuthenticatedException extends RuntimeException {\n\
    \    private static final long serialVersionUID = 207923538133605509L;\n\n   \
    \ public NotAuthenticatedException() {\n        super();\n    }\n\n    public\
    \ NotAuthenticatedException( final String message ) {\n        super( message\
    \ );\n    }\n\n    public NotAuthenticatedException( final String message, final\
    \ Throwable cause ) {\n        super( message, cause );\n    }\n}\n```\n\n此异常的目的是在登录过程中对不存在的或无效的用户凭据发出信号，例如：\n\
    \n```java\npublic void signin( final String username, final String password )\
    \ {\n    if( !exists( username, password ) ) {\n        throw new NotAuthenticatedException(\n\
    \            \"用户名 / 密码组合不被识别\"\n        );\n    }\n}\n```\n\n随异常一起传递信息丰富的消息有助于排除生产系统的故障。如果异常是由于另一个异常情况的结果重新抛出的，必须使用原因构造函数参数保留初始异常。这将有助于追踪问题来源。\n\
    \n### 文档异常\n\n下一个主题将讨论如何让异常也成为文档的一部分。\n\n"
- fmt: "\nA method that may throw the checked exception, as part of its implementation,\
    \ should then be made apart of the method signature. This is done using `throws`\
    \ declaration. The `@throws` tag is used for describing those exceptions within\
    \ the Java documentation tool.\n\nBelow is an example:\n\n```java\n/**\n * Reads\
    \ file from the file system.\n * @throws IOException if an I/O error occurs.\n\
    \ */\npublic void readFile() throws IOException {\n    // Some implementation\
    \ here\n}\n```\n\nThe unchecked exceptions are not declared as a part of method\
    \ signature. Document them so the caller of the method is aware of possible exceptions\
    \ that may be thrown (using the same `@throws` tag).\n\nBelow is an example:\n\
    \n```java\n/**\n * Parses the string representation of some concept.\n * @param\
    \ str String to parse\n * @throws IllegalArgumentException if the specified string\
    \ cannot be parsed properly\n * @throws NullPointerException if the specified\
    \ string is null\n */\npublic void parse( final String str ) {\n    // Some implementation\
    \ here\n}\n```\n\nAlways document the exceptions that the methods could throw.\
    \ It will help to implement proper exception handling and recovering (fallback)\
    \ logic from the coding start, keeping them safe from troubleshooting issues in\
    \ production systems.\n\n## Exceptions and logging\n\nLogging ([http://en.wikipedia.org/wiki/Logfile])\
    \ is a necessary part of any complex Java application, library or framework. It\
    \ is a journal of the events in the application and exceptions that are the crucial\
    \ part of the flow. Exceptions must be correctly logged and analyzed later in\
    \ order to discover problems in the applications and troubleshoot.\n\n## Conclusion\n\
    \nExceptions are an important feature of the Java language. Exceptions are the\
    \ basis of the management of errors in Java. Exceptions make handling and signaling\
    \ erroneous conditions an easy job and, in contrast to error codes, flags and\
    \ statuses, once occurred, exceptions cannot be ignored.\n\nThese words of advice\
    \ will assist with the understanding of the Java coding standards and guidelines\
    \ described in this book more effectively. These tools may also be used when coding\
    \ or programming in most languages. Languages like Python, C++, CSS, and JavaScript\
    \ all use general formats, succession rules, exceptions and standards to ensure\
    \ that information is easily understood, edited and added to, so that improvements\
    \ and new versions of programs and apps may be developed.\n\n1. **Understand the\
    \ standards**. Take time to understand greater productivity through each standard\
    \ and guideline. Do not declare each local variable on its own line simply because\
    \ you were told to. Do it because there is an understanding that it increases\
    \ the comprehension of your code.\n2. **Believe in them**. Following standards\
    \ should be something that is always done because it is the best way to code.\n\
    3. **Follow them while you are coding, not as an afterthought**. Clean code is\
    \ easier. Both during development and maintenance. Following standards will increase\
    \ productivity, while developing, and will make the code easier to maintain. If\
    \ clean code is produced from the beginning, you can benefit from it as it is\
    \ being created.\n4. **Make them part of your quality assurance process**. Ensure\
    \ that the source code follows the standards adopted by who the work is being\
    \ done for. Standards should be used as the basis to train and mentor developers\
    \ to become more effective.\n\nJava is a dynamic and useful coding languages,\
    \ hopefully this book assisted you in your understanding some more advanced aspects\
    \ of coding in Java.\n\nThank you for reading. I hope you enjoy it. I ask you\
    \ to leave your honest feedback.\n"
