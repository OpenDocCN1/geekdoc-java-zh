- fmt: "\nThere is no reason to strictly follow any specific naming conventions in\
    \ Java, but there are a set of easy to follow rules that make Java code look uniform\
    \ across standard library or any other Java project in the wild.\n\n- local variable\
    \ and method arguments names are typed in camel case: `str`, `newLength`, `minimumCapacity`\n\
    - static final field or enumeration constant names are typed in upper case, separated\
    \ by underscore `_`: `LOG`, `MIN_RADIX`, `INSTANCE`\n- class, `enum`, `interface`\
    \ or annotation names are typed in capitalized case: `StringBuilder`, `Runnable`,\
    \ `@Override`\n- generic type parameter names are usually represented as one character\
    \ in upper case: `T`, `U`, `E`\n- method or field names (except `static final`)\
    \ are typed in camel case: `isEmpty`, `format`, `addAll`\n- package names are\
    \ typed in lower case: `org.junit`, `com.fasterxml.jackson`, `javax.json`\n\n\
    With these simple conventions the code will look concise and indistinguishable\
    \ other library or framework.\n\n### Standard Libraries\n\nthe Java standard libraries\
    \ have some rough edges and strange design decisions but 99% of it is high quality\
    \ code written by coding experts. It is worth being familiar with these resources.\n\
    \nEach new Java release includes many new features being added to existing libraries\
    \ (and possible deprecation of the older ones) and addition of new libraries.\
    \ Java 5 introduced a new concurrency library that reconciles as `java.util.concurrent`\
    \ package. Java 6 debuted a scripting support `javax.script` package and Java\
    \ compiler API `javax.tools` package. Java 7 included improvements to `java.util.concurrent`,\
    \ featured a new I/O library under `java.nio.file` package, and dynamic languages\
    \ support with `java.lang.invoke` package. Currently, Java 8 has delivered the\
    \ long-awaited date/time API hosted as `java.time` package.\n\nJava’s platform\
    \ is growing and evolving; it is extremely important to keep educated in this\
    \ evolution. Whenever a third-party library or framework is introduced into a\
    \ project, ensure the required functionality is not available in the Java standard\
    \ libraries.\n\n### Immutability\n\nPlease take immutability seriously. If a class\
    \ being designed or a method being implemented might provide the immutability\
    \ guarantee, it could be used almost universally without fearing concurrent modifications.\
    \ This will improve life as a developer and team member.\n\n### Testing\n\nTest-driven\
    \ development (TDD) practices are widely practiced in the Java community, constantly\
    \ working to raise the bar of the coding quality. TDD brings many benefits to\
    \ the table, however Java standard library does not currently include any test\
    \ framework or scaffolding.\n\nTesting is still a necessary part of modern Java\
    \ development. Here we will cover some basics using a well written `JUnit` framework.\
    \ Using `JUnit`, each test is a set of assertions regarding the expect object\
    \ state or behavior.\n\nGreat tests are short and simple, testing one thing at\
    \ a time. let us test to verify that `String.format` function from the section\
    \ Strings returns the desired results by writing a set of tests:\n\n```java\n\
    package com.javacodegeeks.advanced.generic;\n\nimport static org.junit.Assert.assertThat;\n\
    import static org.hamcrest.CoreMatchers.equalTo;\nimport org.junit.Test;\n\npublic\
    \ class StringFormatTestCase {\n    @Test\n    public void testNumberFormattingWithLeadingZeros()\
    \ {\n        final String formatted = String.format(\"%04d\", 1);\n        assertThat(formatted,\
    \ equalTo(\"0001\"));\n    }\n\n    @Test\n    public void testDoubleFormattingWithTwoDecimalPoints()\
    \ {\n        final String formatted = String.format(\"%.2f\", 12.324234d);\n \
    \       assertThat(formatted, equalTo(\"12.32\"));\n    }\n}\n```\n\nThese tests\
    \ are readable and execution is instantiations. A Java project contains hundreds\
    \ of of test cases, for quick feedback on regressions or features that are under\
    \ development.\n\n# Chapter 2- How & When to Use Exceptions\n\n### Introduction\n\
    \nExceptions in Java signal abnormal, or exceptional, conditions in the flow of\
    \ the program that may prevent it from making further progress. These exceptional\
    \ conditions could be fatal; where the program is not able to function anymore\
    \ and should be terminated. Or the conditions could be recoverable; where the\
    \ program continues to run but some functionality may be lost.\n\nHere we will\
    \ walk through a typical scenario utilizing exceptions in Java Explain the checked\
    \ and unchecked exceptions, and touch on some corner cases and helpful idioms.\n\
    \n### Exceptions: when to use them\n\nSimply put exceptions are events or signals\
    \ that happen while a program is executing and interrupt the normal flow of execution.\
    \ Exceptions are a replacement to error codes and status techniques used in the\
    \ early days. Now exceptions have gained acceptance as the standard in varied\
    \ languages, including Java. Exceptions handling has one important rule universally:\
    \ do not ignore. Each exception should be logged but never ignored. There are\
    \ rare instances when an exception could be ignored because not much can be done\
    \ with it.\n\nManagement of exceptions in Java is unique. There are two classes\
    \ of exceptions: checked exceptions and unchecked exceptions.\n\nUnchecked exceptions\
    \ signal erroneous related to program logic and assumptions made (invalid arguments,\
    \ null pointers, etc.). An unchecked exception is not required to be defined by\
    \ the caller. Here is its declaration:\n\n```java\npublic class NullPointerException\
    \ extends RuntimeException {\n    public NullPointerException() {\n        super();\n\
    \    }\n\n    public NullPointerException(String s) {\n        super(s);\n   \
    \ }\n}\n```\n\nChecked exceptions show invalid conditions in areas outside the\
    \ immediate control. A checked exception is a direct subclass of `Exception`.\
    \ Unlike the unchecked exceptions, checked exceptions must be caught by the caller\
    \ or listed as a part of the method signature. The `IOException` is most known:\n\
    \n```java\npublic class IOException extends Exception {\n    public IOException()\
    \ {\n        super();\n    }\n\n    public IOException(String message) {\n   \
    \     super(message);\n    }\n\n    public IOException(String message, Throwable\
    \ cause) {\n        super(message, cause);\n    }\n\n    public IOException(Throwable\
    \ cause) {\n        super(cause);\n    }\n}\n```\n\nChecked and unchecked exceptions\
