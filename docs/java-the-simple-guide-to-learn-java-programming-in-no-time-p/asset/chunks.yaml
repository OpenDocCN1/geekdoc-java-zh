    should then be made  apart of the method signature.  This is done usingthrows
    declaration. The@throws tag is used for describing those exceptions within the
    Java documentation tool.


    Below is an example:


    | 1 | /** |


    | 2 |  * Reads file from the file system. |


    | 3 |  * @throws IOException if an I/O error occurs. |


    | 4 |  */ |


    | 5 | public  void  readFile() throws  IOException { |


    | 6 |     // Some implementation here |


    | 7 | } |


    The unchecked exceptions are not declared as a part of method signature. Document
    them so the caller of the method is aware of possible exceptions that may be thrown
    (using the same @throws tag).


    Below is an example:


    | 1 | /** |


    | 2 |  * Parses the string representation of some concept. |


    | 3 |  * @param str String to parse |


    | 4 |  * @throws IllegalArgumentException if the specified string cannot be parsed
    properly |


    | 5 |  * @throws NullPointerException if the specified string is null |


    | 6 |  */ |


    | 7 | public  void  parse( final  String str ) { |


    | 8 |     // Some implementation here |


    | 9 | } |


    Always document the exceptions that the methods could throw. It will help to implement
    proper exception handling and recovering (fallback) logic from the coding start,
    keeping them safe from troubleshooting issues in production systems.


    Exceptions and logging


    Logging ([http://en.wikipedia.org/wiki/Logfile](http://en.wikipedia.org/wiki/Logfile))
    is a necessary part of any complex Java application, library or framework. It
    is a journal of the events in the application and exceptions that are the crucial
    part of the flow. Exceptions must be correctly logged and analyzed later in order
    to discover problems in the applications and troubleshoot.


    Conclusion


    Exceptions are an important feature of the Java language. Exceptions are the basis
    of the management of errors in Java. Exceptions make handling and signaling erroneous
    conditions an easy job and, in contrast to error codes, flags and statuses, once
    occurred, exceptions cannot be ignored.


    # Conclusion


    These words of advice will assist with the understanding of the  Java coding standards
    and guidelines described in this book more effectively. These tools may also be
    used when coding or programming in most languages.  Languages like Python, C++,
    CSS, and JavaScript all use general formats, succession rules, exceptions and
    standards to ensure that information is easily understood, edited and added to,
    so that improvements and new versions of programs and apps may be developed. 


    1.  Understand the standards. Take time to understand greater productivity through
    each standard and guideline.  Do not declare each local variable on its own line
    simply because you were told to. Do it because there is an understanding that
    it increases the comprehension of your code.


    2.  Believe in them. Following standards should be something that is always done
    because it is the best way to code.


    3.  Follow them while you are coding, not as an afterthought. Clean code is easier.
    Both during development and maintenance. Following standards will increase productivity,
    while developing, and will make the code easier to maintain. If clean code is
    produced from the beginning, you can benefit from it as it is being created.


    4.  Make them part of your quality assurance process. Ensure that the source code
    follows the standards adopted by who the work is being done for. Standards should
    be used as the basis to train and mentor developers to become more effective.


    Java is a dynamic and useful coding languages, hopefully this book assisted you
    in your understanding some more advanced aspects of coding in Java.


    Thank you for reading. I hope you enjoy it. I ask you to leave your honest feedback.'
