  trans: "\n\n作为实现的一部分，可能抛出受检异常（checked exception）的方法应将其作为方法签名的一部分。这通过 `throws` 声明来实现。`@throws`\
    \ 标签用于在 Java 文档工具中描述这些异常。\n\n以下是一个示例：\n\n```java\n/**\n * 从文件系统系统读取文件。\n * @throws\
    \ IOException 如果发生 I/O 错误。\n */\npublic void readFile() throws IOException {\n\
    \    // Some implementation here\n}\n```\n\n未受检异常（unchecked exceptions）不声明为方法签名的一部分。请对它们进行文档记录，以便方法的调用者了解可能抛出的异常（使用相同的\
    \ `@throws` 标签）。\n\n以下是一个示例：\n\n```java\n/**\n * 某些某些概念的字符串表示。\n * @param str\
    \ 要解析的字符串\n * @throws IllegalArgumentException 如果指定的字符串无法被正确解析\n * @throws NullPointerException\
    \ 如果指定的字符串为 null\n */\npublic void parse( final String str ) {\n    // Some implementation\
    \ here\n}\n```\n\n始终对方法可能抛出的异常进行文档记录。这将有助于从编码开始实现适当的异常处理和恢复（回退）逻辑，确保它们在生产系统中不受故障排除问题的影响。\n\
    \n## 异常与日志\n\n日志 ([http://en.wikipedia.org/wiki/Logfile]) 是任何复杂 Java 应用程序、库或框架不可或缺的一部分。它是应用程序事件的日志，而异常是流程中的关键部分。必须正确记录异常并在以后进行分析，以便发现应用程序的问题并进行故障排除。\n\
    \n## 结论\n\n异常是 Java 语言的一项重要特性。异常是 Java 错误管理的基础。异常使处理和信号错误状态变得异常简单，而且与错误代码、标志和状态不同，异常一旦发生就无法被忽略。\n\
    \n这些建议将帮助你更有效地理解书中描述的 Java 编码标准和指南。这些工具也可以用于大多数语言的编码或编程。像 Python、C++、CSS 和 JavaScript\
    \ 等语言都使用通用格式、继承规则、异常和标准，以确保信息易于理解、编辑和添加，从而开发程序和应用程序的改进和新版本。\n\n1. **理解标准**。花时间通过每种标准和指南来提高生产力。不要仅仅因为被要求就将每个局部变量单独写在一行。这样做是因为你理解这能提高代码的可的可读性。\n\
    2. **相信它们**。遵循标准应该是始终如一的，因为这是编码的最佳方式。\n3. **在编码时遵循它们，而不是作为事后补救**。整洁的代码更容易维护，无论是在开发还是维护期间都是如此。遵循标准将在开发期间提高生产力，并使代码更易维护。如果从一开始就产生整洁的代码，你可以在创建过程中从中受益。\n\
    4. **将它们成为你质量保证流程的一部分**。确保源代码遵循工作交付方所采用的标准。标准应作为培训和指导开发人员变得更高效的依据。\n\nJava 是一门动态且实用的编码语言，希望这本书能帮助你进一步理解\
    \ Java 编码的一些高级方面。\n\n感谢阅读。希望你喜欢。我请求你留下诚实的反馈。\n\n"
