    to get a list of available instances (see 3.2, "Service invocation" on page 27
    for more details).

    - De-registration

    When a service is down, it must be removed from the list of available services
    in the service registry.


    # 3.1.1 Third-party registration versus self-registration


    The registration of the microservice with the service registry can be done by
    the microservice or by a third party. Using a third party requires said party
