    # # 1.4 Philosophy and team structure


    There is a philosophical aspect to the relationship between microservices and
    team organization. This aspect comes from the application of Conway''s law², which
    states that "any organization that designs a system will inevitably produce a
    design whose structure is a copy of the organization''s communication structure."
    In "Building Microservices", Sam Newman puts Conway''s law into context, and devote
    an entire chapter to the interaction between the organization''s structure and
    system design.


    Conway''s law specifically focuses on communication and coordination between disparate
    groups of people. If the organization sequesters database administrators off into
    a group separate from application developers, the resulting architecture has a
    distinct tier managed in a way that is optimal for database administrators. Application
    developers would need to coordinate changes that they need with database administrators.
    Conversely, if the development team handles data management itself, this kind
    of coordination is unnecessary.


    A move to build microservices applications should include a discussion about organizational
    structure and what changes might be necessary to streamline communication patterns
    to complement the creation and growth of independent microservices. This is a
    common thread in the convergence of DevOps and microservices. Creating an agile
    ecosystem that is capable of fast and frequent changes require streamlined communications,
    and lots of automation.


    # # 1.5 Examples


    Throughout this book, we use two example applications to help explain concepts
    and provide perspective:


    +   * Online retail store

    * Game On!


    # # 1.5.1 Online retail store


    The online retail store is an example that is often used when discussing application
    architectures. This book considers a set of microservices that together provide
    an application where users can browse for products and place orders.


    The architecture includes the following services:


    +   * Catalog service

    * Contains information about what can be sold in the store.

    * Account service

    * Manages the data for each account with the store.

    * Payment service

    * Provides payment processing.

    * Order service


    Manages the list of current orders and performing tasks that are required in the
    lifecycle of an order.


