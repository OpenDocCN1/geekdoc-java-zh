    Telemetry Transport (MQTT) edging language-specific mechanisms like Java Message
    Service (JMS). Chapter 3, "Locating services" on page 25 explores the differences
    between synchronous and asynchronous interaction patterns in more detail.


    JavaScript Object Notation (JSON) has emerged in microservices architectures as
    the de facto format for text-based data, displacing Extensible Markup Language
    (XML) with its comparative simplicity and conciseness. Binary serialization frameworks
    do exist, such as Apache Av¹, Apache Thrift², and Google Protocol Buffers³. However,
    use of these protocols should be limited to internal services and deferred until
    the interactions between services are understood.


    # 1.3.3 Resilience and Fault tolerance


    Concerning independently evolving but inter-dependent services, the robustness
    principle provides the best guide: "Be liberal in what you accept, and conservative
    in what you send⁴. Assume that APIs will evolve over time, and be tolerant of
    data you do not understand. To follow the RFC:


    Microservices must also prevent failures from cascading through the system. Chapter
    4.2, "Fault tolerance" on page 37 describes strategies for dealing with API changes.
    Isolation patterns like circuit breakers and bulkheads are described in Chapter
    3, "Locating services" on page 25.


    # 1.3.4 Automated environment


    Microservice architectures in cloud environments create a sprawling landscape
    of independently moving parts. Creating visualizations for interaction patterns
    between microservices eventually results in a confluence of lines. A high degree
    of automation is required for applications that use microservices.


    Strategies for building and deploying base services using continuous integration
    or continuous deployment practices and tools are described in Chapter 8, "From
    development to production" on page 89.


    Automated monitoring and alerting is also important. Individual services should
    be less concerned about managing their log data in cloud environments, they should
    ensure that appropriate log data and metrics are produced to facilitate automated
    problem detection and alerting. This topic is explored further in Chapter 9, "Management
    and Operations" on page 107.


