  - "[PAGE 117]\n\n# 8.4.4 Programming considerations\n\nConfiguring your microservices\
    \ should not be done inside the business logic of your source code. It is better\
    \ to do this configuration in a central place. In most cases, accessing the configuration\
    \ values is based on technical decisions and is not affected by your business\
    \ logic.\n\nIf you configure your system using CDI, then you must deal with changing\
    \ values at runtime. In such situations, annotate the CDI beans with @RequestScoped\
    \ or @Dependent to make sure that the values are refreshed on every request. Some\
    \ of the configuration systems provide callbacks to inform the client when values\
    \ change. In combination with CDI producers @Produces, you can easily adapt your\
    \ configuration system to your application.\n\nThe following examples show how\
    \ CDI way to set the configuration values in your application. First, you must\
    \ define a qualifier that can be used to annotate the injection point @Configuration\
    \ as shown in Example 8-12.\n\nExample 8-12 CDI qualifier\n\n```\n@Qualifier\n\
    @Retention(RUNTIME)\n@Target({METHOD, FIELD, PARAMETER, TYPE })\npublic @Interface\
    \ Configuration {\n\n    // Values without binding\n    @Nonbinding\n    String\
    \ value() default \"\";\n}\n```\n\nThe generic producer class (MyConfigProducer)\
    \ Example 8-13 checks the name of the attribute inside the qualifier and returns\
    \ the corresponding value from its configuration cache. The main thing to address\
    \ is the InjectionPoint object that holds the information that is needed by the\
    \ producer that is at the injection point in the EJB as shown in Example 8-14\
    \ on page 105.\n\nExample 8-13 CDI producer\n\n```\npublic class MyConfigProducer\
    \ {\n    private Properties environmentProps;\n    @Produces\n    @Configuration\n\
    \    public String getConfigValue(InjectionPoint ip) {\n        Configuration\
    \ config = ip.getAnnotated(Configuration.class).getAnnotation(Configuration.class);\n\
    \        String configKey = config.value();\n\n        if (configKey.isEmpty())\
    \ {\n            throw new IllegalArgumentException(\n                \"Property\
    \ key missing!\");\n        }\n        String value = environmentProps.getProperty(configKey);\n\
    \        if (value == null) {\n            throw new RuntimeException(\"Property\
    \ value for key \" +\n                configKey + \" could not be found!\");\n\
    \        }\n        return value;\n    }\n```"
  - "[PAGE 118]\n\n```\n}\n}\n```\n\nThe default CDI scope for an EJB is @RequestScoped\
    \ and the default CDI scope when it is not explicit set is @default. The producer\
    \ injects the value on every request that calls the EJB. Other CDI scopes can\
    \ also be used depending on your requirements requirements (Example 8-14).\n\n\
    Example 8-14 EJB with injected configuration value\n\n```\n@Stateless\npublic\
    \ class MyEJB {\n  @Inject\n  @Configuration(\"myConfigValue\")\n  private String\
    \ myConfigValue;\n}\n```\n\n# ## 8.4.5 Preferred practices on configuration\n\n\
    In summary, the following are the preferred practices when doing configuration:\n\
    \n+   - Configuration should live outside of the immutable deployment artifact\
    \ and can be supplied by three variations of configuration (environment variables,\
    \ configuration files, and configuration systems). The choice depends on the runtime\
    \ environment that your system of microservices is hosted in.\n\n+   - Dynamic\
    \ configuration values should be managed with configuration systems, but your\
    \ application must handle the changing of configuration values.\n\n+   - Keep\
    \ the system as unchanged as you can. This guideline is also true for configuration\
    \ values otherwise to minimize the risk of unexpected errors.\n\n+   - Change\
    \ only configuration values that must be changed and use a defined way to manage\
    \ those changes (for example, track these changes).\n\n+   - The business logic\
    \ of the microservice should not deal with the configuration values. This tracking\
    \ should be done in a central helper class or package."
