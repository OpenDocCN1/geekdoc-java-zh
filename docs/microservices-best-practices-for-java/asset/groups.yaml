    # Testing


    It is essential that a microservice application is built with an awareness of
    how it can be tested. Having good test coverage gives you more confidence in your
    code and results in a better continuous delivery pipeline.


    This chapter covers the tests that are required at three different stages in the
    build lifecycle:


    +   - Single service testing

    - Tests carried out in isolation by a team that owns a particular microservice
    in a system.

    - Staging environment

    - Tests that are run on objects in a staging environment. The microservices that
    form a particular application are deployed into a staging environment for testing.

    - Production environment

    - Tests carried out on the live production system.


    Tests should be automated as part of the build, release, run (delivery) pipeline.


    The following topics are covered:


    +   - Types of tests

    - Application architecture

    - Single service testing

    - Staging environment

    - Production environment'
- md: "\n## 7.1 Types of tests\n\nThis chapter focuses on the Java specific testing\
    \ considerations, assuming some prior knowledge of testing microservices. The\
    \ following types of tests are covered:\n\n- Unit Tests\n  Tests a single class\
    \ or a set of closely coupled classes. These unit tests can either be run using\
    \ the actual objects that the unit interacts with or by employing the use of double\
    \ or mocks.\n\n- Component Tests\n  Tests the full function of a single microservice.\
    \ During this type of testing, any calls to external services are mocked in some\
    \ way.\n\n- Integration tests\n  Integration tests are used to test the communication\
    \ between services. These tests are designed to test basic success and error paths\
    \ over a network boundary.\n\n- Contract tests\n  Test the agreed contract for\
    \ APIs and other resources that are provided by the microservice. For more information,\
    \ see \"Consuming APIs\" on page 38.\n\n- End-to-end\n  Tests completes the flow\
    \ through the application or microservice. Usually used to test a gold path or\
    \ to verify that the application meets external requirements.\n\n## 7.2 Application\
    \ architecture\n\nThe internal structure of your microservice directly affects\
    \ how easy it is to test. Figure 7-1 shows a simplified version of the microservice\
    \ architecture described in Chapter 2, \"Creating Microservices in Java\" on page\
    \ 9.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_91_0.png)\n\nThe different internal\
    \ sections break down into the following subsections:\n\n- Resources\n  Exposes\
    \ JAX-RS resources to external clients. This layer can handle basic validation\
    \ of requests, but any business logic is passed on.\n\n- Domain logic\n  This\
    \ area is where the bulk of the functional code goes. This code has no understanding\
    \ of external dependencies to the application.\n\n- Service connector\n  Handles\
    \ communication with external services. This can be services within the microservice\
    \ system or third-party services. Responses are validated and then passed to the\
    \ domain logic layer.\n\n- Repositories\n  Includes data mapping and validation.\
    \ The repositories layer has the logic that is required to connect to the external\
    \ data store.\n\nThe different sections of the application have different testing\
    \ requirements. For example, domain logic does not require integration, whereas\
    \ resources do. All of the code in a particular Java class should provide function\
    \ from the same section. Separate the code in this way results in all of the code\
    \ in a particular class having the same testing requirements. This technique makes\
    \ your test suite simpler and better structured. Given the inherent complexity\
    \ of microservices, it is easy to get into a mess with testing, something that\
    \ can add structure to your tests is a good idea.\n\n## 7.3 Single service testing\n\
    \nThis section defines single service testing as the tests that the owners of\
    \ an individual service must create and run. These tests execute the code that\
    \ is contained inside the logic boundary of the internal microservice architecture\
    \ as shown in Figure 7-1 on page 78. Three types of tests apply here: Unit tests,\
    \ component tests, and integration tests. Unit and integration tests are used\
    \ to test the individual parts of the microservice, and component tests are used\
    \ to test the service as a whole.\n\n### 7.3.1 Testing domain or business function\n\
    \nThe code in your microservice performs business function should not make calls\
    \ to any services external to. This code can be tested using unit tests and a\
    \ testing framework such as JUnit¹. The unit tests should test for behavior and\
    \ use the actual objects (if no external calls are made) or mock the objects involved\
    \ in any operations.\n\nWhen writing tests using the actual objects, a simple\
    \ JUnit test suffices. For creating mock objects, you can use the built-in capabilities\
    \ of Java EE or use a mocking framework. The @Alternatives annotation² in the\
    \ Context and Dependency Injection (DI) specification enables injection of mock\
    \ objects instead of the actual beans. Plenty of mocking frameworks are available\
    \ for Java. For example, Mockito is designed to work with JUnit to allow you to\
    \ mock objects during testing. In the most basic use with Mockito you can create\
    \ mock objects using the @Mock annotation and define behavior when this is called\
    \ by using the Expectations() function.\n\n¹ http://junit.org/junit4/\n² http://docs.oracle.com/javaee/6/tutorial/gjsdf.html\n\
    ³ http://mockito.org/\n\nChapter 7. Testing 79\n\nConsider an online payment application\
    \ that has an “Order” microservice. Suppose that a class called OrderFormatter\
    \ takes in an account ID and returns an order history in a particular format as\
    \ in Example 7-1. The DatabaseClient handles requests to the database to get the\
    \ list of orders. The OrderFormatter is @ApplicationScoped that it can be injected\
    \ into any REST endpoints that it use.\n\n# Example 7-1 The OrderFormatter class\
    \ handles the response from the Orders class\n\n```\n@ApplicationScoped\npublic\
    \ class OrderFormatter {\n    @Inject\n    DatabaseClient client;\n    public\
    \ FormattedHistory getOrderHistory(String id) {\n        History orderHistory\
    \ = client.getHistory(id);\n        FormattedHistory formatted = format(orderHistory);\n\
    \        return formatted;\n    }\n\n    private FormattedHistory format(History\
    \ history) {\n    }\n}\n```\n\nTo test this class, make the assumption that the\
    \ DatabaseClient class will return the orders from the getHistory() function.\
    \ The behavior that you want to test is the actual formatting. However, you cannot\
    \ call the format object directly because it is a private method. To avoid altering\
    \ the code to enable testing, such by changing the format() to public. Instead,\
    \ use a mocked version of the DatabaseClient class. Example 7-2 shows a simple\
    \ test of the class that is being tested. This technique uses Mockito and JUnit.\
    \ The @Tested annotation indicates the class that is being tested.\n\nExample\
    \ 7-2 A simple test for the OrderFormatter\n\n```java\nimport static org.junit.Assert.assertEquals;\n\
    import static org.mockito.Mockito.*;\n\npublic class TestOrderFormatter {\n  \
    \  @Tested\n    private OrderFormatter formatter;\n\n    @Mock\n    private DatabaseClient\
    \ client;\n\n    @Test\n    public void testOrderHistory() {\n        String id\
    \ = \"123\";\n        History history = new History();\n        when(client.getHistory(id)).thenReturn(history);\n\
    \        FormattedHistory result = formatter.getOrderHistory(id);\n        //\
    \ Assertions would go here\n    }\n}\n```\n\n80 Microservices Best Practices\n\
    \n[PAGE 94]\n\n### 7.3.2 Testing resources\n\nClasses that expose JAX-RS resources\
    \ or receive events should be tested by two types of tests: Integration tests\
    \ and contract tests.\n\n# Integration tests\n\nIntegration tests are used to\
    \ verify the communication between services. They test basic success and error\
    \ paths across boundaries. These tests can either run in the same way as unit\
    \ tests, or by standing up the application on a server. To run integration tests\
    \ on a server, you can use the methods described in “Tests on a running server”\
    \ on page 82. To drive the code test, use JAX-RS 2.0, to send requests.\n\nIntegration\
    \ tests validate the basic success and error paths of the application.\n\n# Consumer\
    \ driven contract\n\nA consumer of a particular service has a set of input and\
    \ output attributes it expects the service to adhere to. This set can include\
    \ data structures, performance, and conversations. The contract is documented\
    \ using a tool like Swagger. Chapter 2, “Creating Microservices in Java” on page\
    \ 9 for more information. Generally, the consumers of a service drive the definition\
    \ of the contract, which is the *consumer driven contract*.\n\nConsumer driven\
    \ contract tests are a set of tests to determine whether the contract is being\
    \ upheld. These tests should validate that the resources expect the input attributes\
    \ defined in the contract, but also accept unknown attributes (it should ignore\
    \ them). They should also validate that the resources return only those attributes\
    \ that are defined in the documentation. To isolate the code under test, use mocks\
    \ for the domain logic.\n\nMaintaining consumer driven contract tests introduces\
    \ some organizational complexity. If the tests do not accurately reflect the contract\
    \ defined, they are useless. In addition, if the contract is out of date, even\
    \ the best tests will not result in a useful resource for the consumer. Therefore,\
    \ it is vital that the consumer driven contract is kept up to date with current\
    \ consumer needs and that the tests always test the contract.\n\nContract tests\
    \ require the actual API to be implemented. This technique requires the application\
    \ be deployed onto a server. See “Tests on a running server” on page 82 for more\
    \ information. Use tools such as the Swagger editor to create these tests. The\
    \ Swagger editor can take the API documentation and produce implementations in\
    \ many different languages.\n\n```\nhttp://editor.swagger.io/\n```\n"
  mdcn: "\n\n## 7.1 测试类型\n\n本章重点关注 Java 特定的测试考虑因素，假设你已经具备一些微服务测试的先知识。涵盖了以下类型的测试：\n\
    \n- 单元测试 (Unit Tests)\n  测试单个类或一组紧耦合的类。这些单元测试可以使用与单元交互的实际对象运行，也可以通过使用双倍体（double）或\
    \ mock（mocks）来运行。\n\n- 组件测试 (Component Tests)\n  测试单个微服务的完整功能。在此类测试期间，对外部服务的任何调用都以某种方式进行\
    \ mock 处理。\n\n- 集成测试 (Integration tests)\n  集成测试用于测试服务之间的通信。这些测试旨在测试跨网络边界的基本成功路径和错误路径。\n\
    \n- 契约测试 (Contract tests)\n  测试微服务提供的 API 及其他资源的约定契约。有关更多信息，请参阅第 38 页的“消费 API”。\n\
    \n- 端到端测试 (End-to-end)\n  测试通过整个应用程序或微服务的完整流程。通常用于测试黄金路径（gold path）或验证应用程序是否满足外部需求。\n\
    \n## 7.2 应用架构\n\n微服务的内部结构直接影响了测试的难易程度。图 7-1 显示了第 9 页第 2 章“在 Java 中创建微服务”中描述的微服务架构的简化版本。\n\
    \n![](img/857a3fe455a7acf964c5a1d25b24ba28_91_0.png)\n\n不同的内部部分分为以下子部分：\n\n- 资源\
    \ (Resources)\n  向外部客户端暴露 JAX-RS 资源。此层可以处理请求的基本验证，但任何业务逻辑都会向下传递。\n\n- 领域逻辑 (Domain\
    \ logic)\n  大部分功能代码所在地。这些代码理解应用的外部依赖。\n\n- 服务连接器 (Service connector)\n  处理与外部服务的通信。这些可以是微服务系统内部的服务，也可以是第三方服务。响应经过验证后传递给领域逻辑层。\n\
    \n- 存储库 (Repositories)\n  包括数据映射和验证。存储库层包含连接外部数据存储所需的逻辑。\n\n应用程序的不同部分有不同的测试需求。例如，领域逻辑不需要集成测试，而资源层需要。特定\
    \ Java 类中的所有代码应该提供来自同一部分的功能。通过这种方式分离代码，可以使得特定类中的所有代码具有相同的测试需求。这种技术使得你的测试套件更简单、结构更好。考虑到微服务固有的复杂性，测试很容易陷入混乱，因此为测试增加结构是一个好主意。\n\
    \n## 7.3 单服务测试\n\n本节定义单服务测试为单个服务的拥有者必须创建并运行的测试。这些测试执行第 78 页图 7-1 所示的内部微服务架构边界内部的代码。这里适用于三类型的测试：单元测试、组件测试和集成测试。单元测试和集成测试用于测试微服务的各个部分，而组件测试用于测试整个服务。\n\
    \n### 7.3.1 测试领域或业务函数\n\n微服务中执行业务功能的代码不应调用任何外部服务。这些代码可以使用单元测试和诸如 JUnit¹ 1这样的测试框架进行测试。单元测试应该测试行为，并使用实际对象（如果没有外部调用）或\
    \ mock 涉及任何操作的对象。\n\n当使用实际对象编写测试时，简单的 JUnit 测试即可。若要创建 mock 对象，你可以使用 Java EE 的内置功能或使用\
    \ mocking 框架。上下文和依赖注入（DI）规范中的 @Alternatives 注解² 允许注入 mock 对象而非实际 bean。Java 有许多可\
    \ mocking 框架。例如，Mockito 设计用于与 JUnit 配合使用，允许你在测试期间 mock 对象。在 Mockito 最基础的用法中，你可以使用\
    \ @Mock 注解创建 mock 对象，并在调用它时使用 Expectations() 函数定义行为。\n\n¹ http://junit.org/junit4/\n\
    ² http://docs.oracle.com/javaee/6/tutorial/gjsdf.html\n³ http://mockito.org/\n\
    \n第 7 章。测试 79\n\n考虑一个拥有“订单（Order）”微服务的在线支付应用程序。假设名为 `OrderFormatter` 的类接收账户 ID\
    \ 并返回如示例 7-1 所示的特定格式的订单历史。`DatabaseClient` 处理对数据库请求以获取订单列表。`OrderFormatter` 是\
    \ `@ApplicationScoped`，它可以注入到它使用的任何 REST 端点中。\n\n# 示例 7-1 OrderFormatter 类处理来自\
    \ Orders 类的响应\n\n```\n@ApplicationScoped\npublic class OrderFormatter {\n    @Inject\n\
    \    DatabaseClient client;\n    public FormattedHistory getOrderHistory(String\
    \ id) {\n        History orderHistory = client.getHistory(id);\n        FormattedHistory\
    \ formatted = format(orderHistory);\n        return formatted;\n    }\n\n    private\
    \ FormattedHistory format(History history) {\n    }\n}\n```\n\n要测试此类，假设 `DatabaseClient`\
    \ 类将从 `getHistory()` 函数返回订单。你想要测试的行为是实际的格式化。然而，你不能直接调用 `format` 对象，因为它是一个私有方法。为了避免为了测试而修改代码（例如将\
    \ `format()` 改为 `public`），相反，使用 `DatabaseClient` 类的 mock 版本。示例 7-2 显示了对被测试类的简单测试。该技术使用了\
    \ Mockito 和 JUnit。`@Tested` 注解指示了被测试的类。\n\n示例 7-2 OrderFormatter 的简单测试\n\n```java\n\
    import static org.junit.Assert.assertEquals;\nimport static org.mockito.Mockito.*;\n\
    \npublic class TestOrderFormatter {\n    @Tested\n    private OrderFormatter formatter;\n\
    \n    @Mock\n    private DatabaseClient client;\n\n    @Test\n    public void\
    \ testOrderHistory() {\n        String id = \"123\";\n        History history\
    \ = new History();\n        when(client.getHistory(id)).thenReturn(history);\n\
    \        FormattedHistory result = formatter.getOrderHistory(id);\n        //\
    \ 此处进行断言\n    }\n}\n```\n\n80 微服务最佳实践\n\n[94]\n\n### 7.3.2 测试资源\n\n暴露 JAX-RS 资源或接收事件的类应该通过两种类型的测试：集成测试和契约测试。\n\
    \n# 集成测试\n\n集成测试用于验证服务之间的通信。它们测试跨边界路径。这些测试可以以单元测试相同的方式运行，也可以通过启动服务器来运行。要在服务器上运行集成测试，可以使用第\
    \ 82 页“运行服务器上的测试”中的方法。要驱动代码，使用 JAX-RS 2.0 发送请求。\n\n集成测试验证应用程序的基本成功和错误路径。\n\n#\
    \ 消费者驱动契约\n\n特定服务的消费者有一组期望服务遵循的输入和输出属性。这组属性可以是数据结构、性能和对话。契约使用 Swagger 等工具进行记录。更多信息请参阅第\
    \ 9 页第 2 章“在 Java 中创建微服务”。通常，服务的消费者驱动契约的定义，这被称为*消费者驱动契约*。\n\n消费者驱动契约测试是一组确定契约是否被遵守的测试。这些测试应该验证资源期望契约中定义的输入属性，但也接受未知属性（应忽略它们）。它们还应该验证资源仅返回文档定义的属性。为了隔离被测试代码，对领域逻辑使用\
    \ mock。\n\n维护消费者驱动契约测试引入了一些组织上的复杂性。如果测试没有准确反映定义的契约，它们将毫无用处。此外，如果契约过期，即使是最好的测试也不会为消费者产生实用的资源。因此，保持消费者驱动契约与当前的消费者需求同步至关重要，并确保测试始终测试契约。\n\
    \n"
