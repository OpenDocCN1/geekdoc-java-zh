    A JMSContext and a Queue are needed to send a message (Example 5-22 on page 62).
    These objects are injected if the message is running in a Java EE application
    server. Example 5-22 on page 62 uses an EJB so these resources are injected. The
    configuration for the injected objects must be done in the application server.
    If an exception occurs, a runtime JMSException is thrown.


    The scope of an JMSContext in a JTA transaction is transaction. So if your message
    producer is an EJB, your message is delivered in the context of a transaction,
    which avoids losing messages.


    To consume a message from a queue, it is easy to use driven EJB (MDB) in shown
    5-23. Using an MDB also has the advantage of consuming messages in a transaction,
    so no message is lost.


