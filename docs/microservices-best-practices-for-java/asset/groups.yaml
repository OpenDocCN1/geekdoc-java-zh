    # ## 6.2.4 Hash-Based Messaging Authentication Code


    Authentication using Hash-Based Messaging Authentication Code (HMAC) signatures
    are superior to HTTP Basic authentication. When using HMAC, request attributes
    are hashed and signed with a shared secret to create a signature that is included
    in the sent request. When the request is received, the request attributes are
    rehashed using the shared secret to ensure that the values still match. This process
    authenticates the user, and verifies that the content of the message has not been
    manipulated in transit. The hashed signature can also be used to prevent replay
    attacks.


    HMAC validation can be performed by an API Gateway. In this case


    HMAC is not yet a complete standard, API providers (either gateways or individual
    services) often require different request attributes (http headers or a head of
    the message body) in the generated signature. Minimally, an identifying string
    and the date are used.


    Using shared libraries is encouraged when working with HMAC signatures calculations
    must be performed in the same way by both the API consumer and the provider. Considering
    client-side libraries to help consumers sign their requests correctly.


    Game Onl does not use an API gateway at the time of writing. We provide a shared
    library³ to ensure that a HMAC signing algorithm is used for both REST and WebSocket
    requests. The shared library provides JAX-RS filters for inbound and outbound
    requests, and fourth-party Room services. We see Example 6-2.


    Example 6-2 The Mediator uses JAX-RS 2.0 client using SignedClientRequestFilter
    from shared library to the Map⁵


    ```

    Client client = ClientBuilder.newClient()

    .register(JsonProvider.class);

    // a filter is added to the JAX-RS client

    // the filter will sign the request on the way out

    SignedClientRequestFilter apiKey = new

    SignedClientRequestFilter(userid, secret);

    client.register(apiKey);

    ```


