    # Overview


    Application architecture patterns are changing in the era of cloud computing.
    A convergence of factors has led to the concept of "cloud native" applications:


    +   - The general availability of cloud computing platforms

    - Advancements in virtualization technologies

    - The emergence of agile and DevOps practices as organizations looked to streamline
    and shorten their release cycles


    To best advantage of the flexibility of cloud platforms, cloud native applications
    are composed of smaller, independent, self-contained pieces that are called microservices.


    This chapter provides a brief overview of the concepts and motivations that surround
    cloud native applications and microservice architectures:


    +   - Cloud native applications

    - Twelve factors

    - Microservices

    - Philosophy and team structure

    - Examples'
