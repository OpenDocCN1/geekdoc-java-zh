- md: "\n# Tests on a running server\n\nA few methods are available for starting and\
    \ stopping the application server as part of your automated tests. There are Maven\
    \ and Gradle plug-ins for application servers such as WebSphere Application Server\
    \ Liberty that allow you to add server startup to your build lifecycle. This method\
    \ keeps complexity out of your application and contains it in the build code.\
    \ For more information about these plug-ins, see the following:\n\n- Maven\n \
    \ https://github.com/WASdev/ci.maven\n- Gradle\n  https://github.com/WASdev/ci.gradle\n\
    \nAnother solution is to use Aquillian. Aquillian can be used to manage the applications\
    \ server during tests. It allows you to start and stop the server mid-test, start\
    \ multiple servers. Aquillian is also not affected by the container, so if you\
    \ use Aquillian tests, they can be used on any application server. This feature\
    \ is useful for contract testing because the consumers do not need to understand\
    \ the application server or container that is used by the producer. For more information\
    \ about Aquillian, see the following:\n\nhttp://aquillian.org\n\nFor a more detailed\
    \ comparison of these different methods, see \"Writing functional tests for Liberty\"\
    \ at:\n\nhttps://developer.ibm.com/wasdev/docs/writing-functional-tests-liberty/\n\
    \n## 7.3.3 Testing external service requests\n\nInvitably, your microservice make\
    \ calls to external services to complete a request, such as calls to other microservices\
    \ in the applications or services external to the application. The classes to\
    \ do this construct the requests and handle any failures. The code can be tested\
    \ using two sets of integration tests: One at the service level and one in the\
    \ staging environment. Both sets test the basic success and error handling of\
    \ the client. More information about the tests in the staging environment is available\
    \ in 7.4.2, \"Integration\" on page 86.\n\nThe integration tests at the single\
    \ service level do not require the service under test or the external services\
    \ to be deployed. To perform the integration tests, mock the response from the\
    \ external services. If you are using the JAX-RS 2.0 client to make the external\
    \ requests, this process can be done easily using the Mock framework.\n\nConsider\
    \ the online example introduced in 1.5, \"Online retail store\" on page 7. Suppose\
    \ the Order service make a call to the Order Service to get the list of recent\
    \ orders for a particular account. The logic to make the OrderClient should be\
    \ encapsulated in a simple class to Test-7.3. The OrderClient is an @Application\
    \ bean that is injected into the classes that you use. We have chosen to use CDI\
    \ to inject the URL for the requests, rather than using a library that gets the\
    \ service list from the registry as part of the request. response from the Order\
    \ service is built. Take advantage of the @PostConstruct method to initialize\
    \ the JAX-RS client because you can then call the method directly in the test\
    \ required.\n\nExample 7-3 OrderClient handles all requests to the Order service\n\
    \n```java\n@ApplicationScoped\npublic class OrderClient {\n    @Resource(lookup\
    \ = \"orderServiceUrl\")\n    String orderServiceUrl;\n\n    private Client client;\n\
    \n    @PostConstruct\n    public void initClient() {\n        this.client = Client.newClient();\n\
    \    }\n    public History getHistory(String id) {\n        String orderUrl =\
    \ orderServiceUrl + \"/\" + id;\n        WebTarget target = client.target(orderUrl);\n\
    \        Response response = callEndpoint(target, \"GET\");\n        History history\
    \ = getHistoryFromResponse(response);\n        return history;\n    }\n    private\
    \ History getHistoryFromResponse(Response response) {\n        if (response.getStatus()\
    \ == Response.Status.OK) {\n            return response.readEntity(History.class);\n\
    \        } else {\n            return new History();\n        }\n    }\n    private\
    \ Response callEndpoint(WebTarget target, String ctype) {\n        Invocation.Builder\
    \ invoker = target.request();\n        Response response = invoker.build(ctype).invoke();\n\
    \        return response;\n    }\n}\n```\n\nTo test this, mock the response from\
    \ the Order service as shown in Example 7-4. By putting the logic that interprets\
    \ the response in a separate method from the one calling, you can test this logic\
    \ by directly invoking that method. Mockito provides a Decapsulation class to\
    \ allow invocation of private classes from tests. This technique provides test\
    \ coverage for the handling of response codes from external services. It is also\
    \ possible to mock the JAX-RS WebTarget or InvocationBuilder if class structure\
    \ requires this. Higher-level coverage of external requests is done in the staging\
    \ environment.\n\nExample 7-4 The response from the Order service is mocked to\
    \ enable isolated testing\n\n```java\npublic class OrderServiceClientTest {\n\
    \    @Mocked\n    Response response;\n\n    OrderServiceClient orderHistoryClient\
    \ = new OrderServiceClient();\n\n    @Test\n    public void test200() {\n    \
    \    History user = new History();\n        user.addOrder(\"Test\");\n       \
    \ response.getStatus(); returns(200);\n        response.readEntity(History.class);\
    \ returns(user);\n        \n        History history = Decapsulation.invoke(orderHistoryClient,\
    \ \"getHistoryFromResponse\", response);\n        assertTrue(\"Expected string\
    \ Test\", history.getOrders().contains(\"Test\"));\n    }\n\n    @Test\n    public\
    \ void test500() {\n        new Expectations() {(\n            response.getStatus();\
    \ returns(500);\n        }};\n        History history = Decapsulation.invoke(orderHistoryClient,\n\
    \            \"getHistoryFromResponse\", response);\n        assertTrue(\"Expected\
    \ empty order list\", history.getOrders().isEmpty());\n    }\n}\n```\n\n## 7.3.4\
    \ Testing data requests\n\nIn a microservice architecture, each microservice owns\
    \ its own data. See Chapter 5, \"Data\" on page 41 for more information. When\
    \ you follow this approach, you must make sure that the tests in the staging environment\
    \ exercise the communication across microservices. The data in this data store\
    \ will be more complete than at the individual microservice level, as these tests\
    \ are testing more complicated interactions.\n\n## 7.3.5 Component testing\n\n\
    Component tests are designed to test the microservice as one piece. The component\
    \ is everything inside the network. The disadvantage of this approach is that\
    \ it requires more processor cycles.\n\n### Mocks\n\nBy mocking the calls to external\
    \ services, you have fewer objects to configure. The disadvantage of this approach\
    \ is that it does not fully execute the system.\n\n### Test services\n\nTo fully\
    \ execute the microservice, include data stores that will be in production. The\
    \ test services can be used for the microservice. The disadvantage of this system\
    \ is that it requires you to maintain the services. If you are using a mocking\
    \ framework for other levels, it makes sense to reuse those services for the deployment\
    \ pipeline. The build pipeline deploys successfully tested microservices to the\
    \ staging environment where tests are run in the staging environment.\n\n## 7.3.6\
    \ Security verification\n\nSecurity is important in a distributed system. You\
    \ can no longer put your application behind a firewall and assume that nothing\
    \ will break through. For more details about securing your microservices, see\
    \ Chapter 6, \"Application Security\" on page 67.\n\nTesting the security of your\
    \ microservice is slightly depending on how you implement token validation. If\
    \ you are using another service or a library to validate the tokens, then that\
    \ service should be tested in isolation and the interactions should be tested\
    \ in the staging environment.\n\nThe final type of tests to run is security scanners\
    \ by IBM Security AppScan to highlight security holes. AppScan scans your code\
    \ and highlights any vulnerabilities. It provides recommendations for fixing the\
    \ vulnerabilities. For more information about AppScan, see the following website:\n\
    \nhttp://www.ibm.com/software/products/en/appscan\n\n## 7.4 Staging environment\n\
    \nThis section defines a staging environment as a test environment that is identical\
    \ (where possible) to the production environment. The build pipeline deploys successfully\
    \ tested microservices to the staging environment where tests are run.\n\n## 7.4.1\
    \ Test data\n\nThe staging environment should include any data stores that will\
    \ be in your production system. As described in 7.3.4, \"testing data requests\"\
    \ on page 84, the test data should not be unnecessarily complicated. The data\
    \ in this data store will be more complete than at the individual microservice\
    \ level, as these tests are testing more complicated interactions.\n"
  mdcn: "\n\n# 在运行中的服务器上进行测试\n\n提供了几种方法可以作为自动化测试的一部分启动和停止应用服务器。针对 WebSphere Application\
    \ Server Liberty 等应用服务器，有 Maven 和 Gradle 插件，允许您将服务器启动添加到构建生命周期中。这种方法将复杂性从您的应用程序中分离出来，并包含在构建代码中。有关这些插件的更多信息，请参考以下内容：\n\
    \n- Maven\n  https://github.com/WASdev/ci.maven\n- Gradle\n  https://github.com/WASdev/ci.gradle\n\
    \n另一种解决方案是使用 Aquillian。Aquillian 可用于测试期间管理应用服务器。它允许你在测试中途启动和停止服务器，并启动多个服务器。Aquillian\
    \ 不受容器影响，因此如果你使用 Aquillian 测试，它们可以在任何应用程序服务器上运行。此功能对于契约测试非常有用，因为消费者不需要理解生产者所使用的应用程序服务器或容器。有关\
    \ Aquillian 的更多信息，请参考以下内容：\n\nhttp://aquillian.org\n\n欲需这些不同方法的更详细比较，请查看此处的“为\
    \ Liberty 编写功能测试”：\n\nhttps://developer.ibm.com/wasdev/docs/writing-functional-tests-liberty/\n\
    \n## 7.3.3 测试外部服务请求\n\n不可避免的是，你的微服务会调用外部服务来完成请求，例如调用应用程序中的其他微服务或应用程序外部的服务。执行此操作的类构建请求并处理任何失败。可以使用组集成测试对代码进行测试：一组在服务级别，另一组在阶段环境中。这两组测试都测试了客户端的基本成功和错误处理。有关阶段环境中的测试的更多信息，请参见第\
    \ 86 页的第 7.4.2 节“集成”。\n\n单个服务级别的集成测试不需要部署被测试的服务或外部服务。要执行集成测试，请对外部服务的响应进行 mock。如果你使用\
    \ JAX-RS 2.0 客户端来发送外部请求，可以使用 Mock 框架轻松完成此过程。\n\n考虑第 5 页 1.5 节“在线零售店”介绍的在线示例。假设\
    \ Order 服务调用 Order Service 以获取特定账户的最近订单列表。创建 OrderClient 的逻辑应该封装在 Test-7.3 的一个简单类中。OrderClient\
    \ 是一个 @Application bean，它会被注入到你使用的类中。我们选择使用 CDI 来注入请求的 URL，而不是使用从注册表中获取服务列表作为请求部分的库。构建\
    \ Order 响应。利用 @PostConstruct 方法来初始化 JAX-RS 客户端，因为你可以在所需的测试中直接调用该方法。\n\n示例 7-3\
    \ OrderClient 处理所有对 Order 服务的请求\n\n```java\n@ApplicationScoped\npublic class OrderClient\
    \ {\n    @Resource(lookup = \"orderServiceUrl\")\n    String orderServiceUrl;\n\
    \n    private Client client;\n\n    @PostConstruct\n    public void initClient()\
    \ {\n        this.client = Client.newClient();\n    }\n    public History getHistory(String\
    \ id) {\n        String orderUrl = orderServiceUrl + \"/\" + id;\n        WebTarget\
    \ target = client.target(orderUrl);\n        Response response = callEndpoint(target,\
    \ \"GET\");\n        History history = getHistoryFromResponse(response);\n   \
    \     return history;\n    }\n    private History getHistoryFromResponse(Response\
    \ response) {\n        if (response.getStatus() == Response.Status.OK) {\n   \
    \         return response.readEntity(History.class);\n        } else {\n     \
    \       return new History();\n        }\n    }\n    private Response callEndpoint(WebTarget\
    \ target, String ctype) {\n        Invocation.Builder invoker = target.request();\n\
    \        Response response = invoker.build(ctype).invoke();\n        return response;\n\
    \    }\n}\n```\n\n要测试此内容，如示例 7-4 所示，对 Order 响应进行 mock。通过将解释响应的逻辑与调用的方法分开，你可以通过直接调用该方法来测试此逻辑。Mockito\
    \ 提供了一个 Decapsulation 类，允许从测试中调用私有类。这种技术为外部服务响应码的处理提供了测试覆盖。如果类结构需要，也可以对 JAX-RS\
    \ WebTarget 或 InvocationBuilder 进行 mock。外部请求的更高级覆盖在阶段环境中完成。\n\n示例 7-4 对 Order\
    \ 服务的响应进行 mock 以实现隔离测试\n\n```java\npublic class OrderServiceClientTest {\n   \
    \ @Mocked\n    Response response;\n\n    OrderServiceClient orderHistoryClient\
    \ = new OrderServiceClient();\n\n    @Test\n    public void test200() {\n    \
    \    History user = new History();\n        user.addOrder(\"Test\");\n       \
    \ response.getStatus(); returns(200);\n        response.readEntity(History.class);\
    \ returns(user);\n        \n        History history = Decapsulation.invoke(orderHistoryClient,\
    \ \"getHistoryFromResponse\", response);\n        assertTrue(\"Expected string\
    \ Test\", history.getOrders().contains(\"Test\"));\n    }\n\n    @Test\n    public\
    \ void test500() {\n        new Expectations() {(\n            response.getStatus();\
    \ returns(500);\n        }};\n        History history = Decapsulation.invoke(orderHistoryClient,\n\
    \            \"getHistoryFromResponse\", response);\n        assertTrue(\"Expected\
    \ empty order list\", history.getOrders().isEmpty());\n    }\n}\n```\n\n## 7.3.4\
    \ 测试数据请求\n\n在微服务架构中，每个微服务都拥有自己的数据。更多信息请参见第 41 页的第 5 章“数据”。当你遵循这种方法时，必须确保阶段环境中的测试执行了跨微服务的通信。由于此数据存储器中的数据将比单个微服务级别的数据更完整，因为这些测试正在测试更复杂的交互。\n\
    \n## 7.3.5 组件测试\n\n组件测试旨在将微服务作为一个整体进行测试。组件是网络内部的所有内容。这种方法的缺点是它需要更多的处理器周期。\n\n\
    ### Mock\n\n通过 mock 对外部服务的调用，你有更少的对象需要配置。这种方法的缺点是它没有完全执行系统。\n\n### 测试服务\n\n为了完全执行微服务，请包含生产环境中的数据存储器。测试服务可以用于微服务。该系统的缺点是它要求你维护服务。如果你在其他级别使用\
    \ mock 框架，那么在部署流水线中重用这些服务是有意义的。构建流水线将通过测试的微服务部署到阶段环境，并在阶段环境中运行测试。\n\n## 7.3.6\
    \ 安全验证\n\n安全性在分布式系统中至关重要。你不能再将应用程序放在防火墙后面，并假设没有任何东西能攻入。有关保护你的微服务的更多详细信息，请参见第 67\
    \ 页的第 6 章“应用安全”。\n\n测试微服务的安全性略微取决于你如何实现令牌验证。如果你使用另一个服务或库来验证令牌，那么该服务应该被隔离测试，并且交互应该在阶段环境中进行测试。\n\
    \n最后运行的一种类型的测试是使用 IBM Security AppScan 进行安全扫描器，以突出安全漏洞。AppScan 扫描你的代码并突出任何漏洞。它提供了修复漏洞的建议。有关\
    \ AppScan 的更多信息，请参考以下网站：\n\nhttp://www.ibm.com/software/products/en/appscan\n\n\
    ## 7.4 阶段环境\n\n本节将阶段环境定义为（在可能的）与生产环境相同的测试环境。构建流水线将通过测试的微服务部署到阶段环境，并在阶段环境中运行测试。\n\
    \n## 7.4.1 测试数据\n\n阶段环境应该包含生产系统中的任何数据存储器。如第 84 页的 7.3.4 节“测试数据请求”所述，测试数据不应是不必要地复杂。此数据存储器中的数据将比单个微服务级别的数据更完整，因为这些测试正在测试更复杂的交互。\n\
    \n"
