  - '[PAGE 99]


    # 7.4.2 Integration


    Integration tests are used to test the interactions between all the services in
    the system. The in-depth behavior of the individual services has already been
    tested at this stage. The consumer right contract tests should have ensured that
    the services interact successfully, but these tests identify bugs that have been
    missed. The tests should check the basic success and error paths of service communication
    with the application deployed. Use the test data as discussed in the previous
    section.


    Rather than testing all of the services at once, it might still be necessary to
    mock some of the services during testing. The interaction of two specific services,
    or a small set of services, in mocked behavior when calls are made to outside
    the set. Mocking the calls to the services outside the group under test is done
    in the same way as the unit tests on the APIs. The same techniques that are used
    to start and stop the server or container for contract testing also apply here
    (see 7.3.2, "Testing resources" on page 81).


    # 7.4.3 Contract


    Every service that consumes another resource should have a set of contract tests
    that are run against that resource (especially in staging environments). Given
    that services evolve independently over time, it is important to ensure that the
    consumer''s contract continues to be satisfied.


    These tests are specifically written by the consumer (the client side), and are
    run and managed as part of the test suite for the consuming service. By contrast,
    the tests discussed in 7.3.2, "Testing resources" on page 81 are written by the
    producer to verify the contract as a whole.


    # 7.4.4 End-to-end


    End-to-end testing is essential to find the bugs that were missed previously.
    End-to-end tests should exercise certain "golden paths" through the application.
    It is unrealistic to test every path through the application with an end-to-end
    test, to identify the key one and those. A good way to identify these paths through
    the environment is to review the key requirements of an application. For example,
    if your application is an online retail store you might test the following paths:


    +   - User logs in

    - User purchases an item

    - User views the summary of the order

    - User cancels the order


    End-to-end testing should also include the user interface. Tools such as SeleniumHQ
    be used to automate interactions with a web browser for testing. For more information
    about SeleniumHQ, see the following website:


    http://www.seleniumhq.org/


    # 7.4.5 Fault tolerance and resilience


    A microservice should be designed in a fault tolerant way as described in 4.2,
    "Fault tolerance" on page 37. Various techniques can be used to increase the resilience
    and fault tolerance of individual microservices, but you should still test how
    fault your system is as a whole. Tests for fault tolerance should be performed
    with all of the services deployed. Do not use any mocks.'
  - '[PAGE 100]


    # Taking down individual microservices


    In a microservice system, you must not rely on all of the microservices being
    available at any time. During the testing phase, make requests to the system while
    taking down and redeploying individual services. This process should include the
    microservices in the system and backend data stores. Monitor the time for requests
    to return and identify an acceptable response time for your application. If the
    response times are too long, consider reducing the timeout values on your services
    or activating the circuit breaker configurations.


    There are tools that can automate this process, the best known of within the Java
    community is Netflix Chaos Monkey, which terminates instances of virtual machines
    to allow testing of fault tolerance. For more information about Netflix Chaos
    Monkey, see the following website:


    ```

    https://github.com/Netflix/SimianArmy/wiki/Chaos-Monkey

    ```


    Other tools, such as Gremlin, which is used by Amalg8, take the approach of intercepting
    and manipulating calls to microservices without shutting down instances. For more
    information about Gremlin, see this website:


    ```

    https://github.com/ResilienceTesting/gremlinsk-python

    ```


    # Injecting bad data


    As in the integration, tools such as Amalg8 can be used to automate the injection
    of bad data during testing. If you have successfully used the bulk head pattern,
    then bad data in one microservice should not propagate to other microservices.


    # Stress testing


    Microservices should be able to handle unexpected loads. Stress testing should
    be used to test the bulk heads in your microservices. If a particular microservice
    is holding up requests, look at the configured bulk heads.


    # Recoverability testing


    Individual microservices should also be resilient to problems in their deployment.
    If a container or virtual machine goes down, the microservice needs to be able
    to recover quickly. Orchestration tools such as Amalg8 or Kubernetes (for orchestration)
    will spin up new instances of any application if it goes down. A microservice
    must have fast startup time and, when a shutdown is required, it should shut down
    gracefully. Using an application server that provides a fast startup time is also
    essential.


    Couple your recoverability testing with taking down service instances. Allow your
    orchestration system to create the new instances and monitor how long it takes
    to start the new service.


    # 7.5 Production environment


    To test your system, you should consider running tests on the production environment.
    With so many moving parts and services constantly coming and going, you should
    not expect the system to continue working perfectly indefinitely. It is important
    to add monitoring and analytics to your application to warn of any bad behavior.
    For more information, see Chapter 9, "Management and Operations" on page 107.'
  - '[PAGE 101]


    Repeat these specific tests from the staging environment in the production environment:


    +   - Injecting test or bad data


    +   - Taking down services, both to test the fault tolerance of other services
    and recoverability of the service you took down


    +   - Security verification


    Use the same tools and techniques as in the staging environment. Be careful about
    you run these tests. Do not run during peak hours. Instead, select a timeslot
    that has the smallest impact on your clients as possible, just in case something
    goes down.


    # # 7.5.1 Synthetic monitoring


    To determine the health of your production system, create synthetic transactions
    to run through your application. Use a browser emulator to instantiate the synthetic
    transactions and monitor the responses. Look for invalid responses or large response
    times. You can also run the automated build system periodically, but it is likely
    that particular services might go through a time the builds will also be running
    frequently, but you will discover any changes to the application dependencies
    that might cause problems.


    # # 7.5.2 Canary testing


    Canary tests are named after the proverbial canary taken into the coal mine to
    serve as an early indicator of unsafe operating conditions for miners. They are
    minimal tests that verify all dependencies and basic operating requirements for
    a service are present and functioning. If the environment is unhealthy, canary
    tests fail quickly, providing an early indicator for a botched deployment.'
  - '[PAGE 102]


    # 8


    # From development to production


    This chapter covers how individual microservices are built and deployed. To that
    end, review the characteristics that microservices should have that facilitate
    a smooth transition from development to production:


    +   - A microservice must be independently deployable.

    - A new version of a microservice should be deployable in minutes rather than
    in hours.

    - A microservice must be fault tolerant, and should prevent cascading failures.

    - A microservice should not require any code changes as it is deployed across
    target environments.


    As mentioned earlier in the book, microservice architectures require good automated
    deployment tools to help manage the deployment, testing, and promotion of services
    across target environments.


    The following topics are covered in this chapter:


    +   - Deployment patterns

    - Deployment pipelines and tools

    - Packaging options

    - Configuration of the applications across stages'
- md: "\n## 8.1 Deployment patterns\n\nA traditional monolith is built and deployed\
    \ as one unit. A deployment monolith is built of many parts, many individual Java\
    \ Platform, Enterprise Edition archives, for example, that are combined into one\
    \ deployed artifact. Microservices, by contrast, are many different pieces that\
    \ are all deployed independently. This configuration provides more flexibility\
    \ in how consumers are exposed to service changes:\n\n- Blue/Green Deployment\n\
    \nBlue/Green deployments are a common pattern for monoliths. The key aspect of\
    \ this approach is that you are maintaining two versions of your environment that\
    \ one can be used as a rollback to the other if a deployment failure occurs. The\
    \ process goes something like this:\n\n  a. You have a Blue system that is active\
    \ and running. \n  b. You set up the Green system, test it, verify it is working\
    \ properly, and then switch traffic to the Green system. The Blue system is left\
    \ alone as a rollback if something fails as traffic moves to the Green system.\
    \ \n  c. After the Green system is stable, the Blue system is prepared with the\
    \ next outing, and the process is repeated to switch from the Green system back\
    \ to the Blue system.\n\nIn the microservices context, this replicated environment\
    \ still applies. Each system (Blue and Green) contains all of your microservices\
    \ running with stable versions in a configuration that works. Periodic, coordinated\
    \ updates of otherwise uncoupled services can be managed this way, with updates\
    \ getting and stabilized with each other into a known system that is enabled (or\
    \ disabled) as a set.\n\n- Canary Releasing\n\nCanary releases are also known\
    \ as phased or incremental rollout. A canary release aims to discover and confirm\
    \ fault when deploying a new service. Just as Blue/Green deployments, canary releases\
    \ start with a duplicated environment. After the new function is introduced into\
    \ one of the two systems, traffic is gradually (and selectively) routed to the\
    \ new function to ensure it behaves and performs as expected.\n\n- Toggling\n\n\
    Feature toggles are flags that are used inside the service to enable or disable\
    \ new function. This process can be effectively used to allow service customers\
    \ to opt in testing new function (perusing custom HTTP headers) without having\
    \ maintaining different versions of the service or engineer coordinated releases.\
    \ Toggling is common in monolithic environments, too, as to prevent behavior changes\
    \ from impacting customers.\n\nToggles can be set in the environment such that\
    \ a service has either the function enabled or does not. They can be dynamic configuration\
    \ settings that act as a binary mode for the service, or they can be combined\
    \ with per request mechanisms like HTTP headers to turn new functions on or off\
    \ per request.\n\nToggles can be used to make decisions, which allows them to\
    \ be a selector for service-centric canary releases. They can also be used for\
    \ A/B testing, where you are trying to make a side-by-side comparison of alternative\
    \ implementations.\n\n## 8.2 Deployment pipelines and tools\n\nOne of the benefits\
    \ of microservice architectures is agility. Because each individual service has\
    \ a focused scope and an independent lifecycle, it takes less time to implement\
    \ a new feature as a microservice, test it, and deploy it into production. Microservices\
    \ are often built iteratively, which means supporting the notion of continuous\
    \ integration and deployment.\n\nDeployment artifacts run on different systems,\
    \ so many systems must be configured to make the services work. The more manual\
    \ steps there are for deploying a microservice into production, the more likely\
    \ it is that unexpected problems will arise due to bad typing or forgotten steps.\
    \ Human intervention should be reduced to a minimum. For example, manual approvals\
    \ might be required before a new version of a service can be released into production\
    \ for regulatory reasons. However, everything leading up to, and from that, can\
    \ be automated.\n\nDeployment pipelines as described by Martin Fowler are used\
    \ as a part of a Continuous Deployment environment. They describe and define a\
    \ set of steps to get microservices into production, by breaking the process into\
    \ stages that cover building, deploying, and testing the service in each stage\
    \ to verify that all is well. It is helpful to use DevOps technologies to simplify\
    \ the creation of a Deployment pipeline and related tool to support applications\
    \ from development to production. For more information about DevOps technologies,\
    \ see this:\n\nhttp://blog.xebialabs.com/2015/07/20/xebialabs-launches-the-periodic-table-of-devo-tools/\n\
    \nAs mentioned, the source for your microservices be in a Source Code Management\
    \ (SCM) tool like Subversion or Git. It should be built with a tool that has dependency\
    \ management like Maven or Gradle. Choose one of the repository management tools\
    \ (such as Nexus or Artifactory) to store versioned binary files of your shared\
    \ libraries. Build your services using one of the CI-Tools like Jenkins or Bamboo.\n\
    \nAfter the automated build of the microservice testing must be done, and for\
    \ some of that you need to deploy the microservice, which means you need the correct\
    \ configurations placed on your automatically provisioned system. You can use\
    \ classic scripting to configure the targets correctly, but you must then manage\
    \ platform or other system differences in the scripts. Scripting frameworks/infrastructure\
    \ like Chef, Puppet, Ansible, and Salt can handle this much better. They can all\
    \ be used the same way for initial installation and modification of an existing\
    \ system. Define the target content of the configuration files, and these deal\
    \ with the difference if there are changes on the target system.\n\n| # | Link\
    \ |\n| :--- | :--- |\n| 1 | http://martinfowler.com/bliki/DeploymentPipeline.html\
    \ |\n| 2 | http://martinfowler.com/bliki/ContinuousDelivery.html |\n| 3 | http://subversion.apache.org/\
    \ |\n| 4 | http://git-scm.com/ |\n| 5 | http://maven.apache.org/ |\n| 6 | http://gradle.org/\
    \ |\n| 7 | http://www.sonatype.org/nexus/ |\n| 8 | http://www.jrog.com/artifactory/\
    \ |\n| 9 | http://jenkins.io/ |\n| 10 | http://www.atlassian.com/software/bamboo\
    \ |\n| 11 | http://www.chef.io/ |\n| 12 | http://puppet.com/ |\n| 13 | http://www.ansible.com/\
    \ |\n| 14 | http://saltstack.com/ |\n\n## 8.3 Packaging options\n\nThe next question,\
    \ after building the microservice, is what packaging format should be used to\
    \ deploy the application. A recurring theme in both the twelve factors and the\
    \ definition of cloud native applications is the creation of immutable artifacts\
    \ that can be run without change across different deployment environments.\n\n\
    The more things change from deployment to deployment, the greater the risk that\
    \ something will break in unexpected ways, due to misconfiguration, missing dependencies,\
    \ and so on. Building immutable, self-contained artifacts introduces more consistency\
    \ between development and production environments, and reduces the likelihood\
    \ of deployment time surprises.\n"
  mdcn: "\n\n## 8.1 部署模式\n\n传统的单体应用作为一个单元进行构建和部署。部署型单体应用由许多部分组成，例如，许多个独立的 Java 平台企业版归档（EAR），它们被组合成一个部署产物。相比之下，微服务是许多不同的部分，它们都是独立部署的。这种配置在消费者面对服务变化时提供了更大的灵活性：\n\
    \n- 蓝绿部署（Blue/Green Deployment）\n\n蓝绿部署是单体应用的一种常用模式。这种方法的关键在于维护两个版本的环境，万如果发生部署失败，其中一个可以作为另一个的回滚。流程大致如下：\n\
    \n  a. 你有一个正在活动并运行的蓝色系统（Blue）。\n  b. 你搭建绿色系统（Green），对其进行测试，验证其运行正常，然后将流量切换到绿色系统。如果在流量移动到绿色系统期间发生故障，蓝色系统将会被留作为回滚。\n\
    \  c. 在绿色系统稳定后，为蓝色系统准备下一次发布，并重复该过程将流量从绿色系统切换回蓝色系统。\n\n在微服务的语境下，这种复制的环境仍然适用。每个系统（蓝色和绿色）都包含你所有的微服务，并以工作良好的配置以稳定版本运行。通过这种方式可以管理对相互解耦服务的周期性、协调性更新，更新将相互获取并稳定，形成一个已知的系统，该系统作为一个整体被启用（或禁用）。\n\
    \n- 金丝雀发布（Canary Releasing）\n\n金丝雀发布也称为分阶段或增量发布。金丝雀发布旨在部署新服务时发现并确认故障。与蓝绿部署一样，金丝雀发布从一个复制的环境开始。在将新功能引入两个系统之一之后，流量会逐渐（且选择性地）路由到新功能，以确保其行为和性能符合预期。\n\
    \n- 切换（Toggling）\n\n功能开关（Feature toggles）是用于服务内部的标记，用于启用或禁用新功能。这一过程可以有效用于允许服务客户选择测试新功能（通过解析自定义\
    \ HTTP 请求头），而无需维护不同版本的服务或由工程师协调发布。切换机制在单体环境中也很常见，用以防止行为变化影响客户。\n\n可以在环境中设置开关，使得服务要么启用该功能，要么不启用。它们既可以是动态配置设置，作为服务的二进制模式；也可以与每个请求的机制（如\
    \ HTTP 请求头）结合，按每个请求开启或关闭新功能。\n\n切换可以用于做出决策，使得它们可以作为服务为中心的金丝雀发布的选择器。它们也可以用于 A/B\
    \ 测试，即你尝试对替代实现方案进行并行比较。\n\n## 8.2 部署流水线和工具\n\n微服务架构的优势之一是敏活性。由于每个单独的服务都有专注范围和独立的生命周期，因此作为微服务实现新功能、测试并将其部署到生产环境的时间更短。微服务通常是迭代构建的，这意味着支持了持续集成和部署的理念。\n\
    \n部署产物运行在不同的系统上，因此必须配置许多系统才能使服务工作。将微服务部署到生产环境的手动步骤越多，由于输入错误或遗漏步骤而出现意外问题的可能性就越大。人工干预应该减少到最低。例如，由于合规原因，在服务新版本发布到生产环境之前可能需要手动批准。然而，此之前及此之后的所有操作都可以自动化。\n\
    \nMartin Fowler 描述的部署流水线（Deployment pipelines）被用持续部署环境的一部分。它们描述并定义了一系列将微服务引入生产环境的步骤，通过将过程分解为阶段，每个阶段涵盖构建、部署和测试服务，以验证一切无误。使用\
    \ DevOps 技术来简化部署流水线的创建以及支持应用从开发到生产的相关工具是很有帮助的。有关 DevOps 技术的更多信息，请参此：\n\nhttp://blog.xebialabs.com/2015/07/20/xebialabs-launches-the-periodic-table-of-devo-tools/\n\
    \n如所述，你的微服务的源代码应该位于源码管理（SCM）工具中，如 Subversion 或 Git。它应该使用具有依赖管理的工具（如 Maven 或 Gradle）进行构建。选择一个仓库管理工具（如\
    \ Nexus 或 Artifactory）来存储你共享库的版本化二进制文件。使用 Jenkins 或 Bamboo 等 CI 工具之一来构建你的服务。\n\
    \n在微服务的自动构建之后，必须进行测试，对于其中某些测试你需要部署微服务，这意味着你需要在自动置备的系统上放置正确的配置。你可以使用经典脚本来正确配置目标，但你必须在脚本中管理平台或其他系统的差异。像\
    \ Chef、Puppet、Ansible 和 Salt 等脚本框架/基础设施可以很好地处理这一点。它们都可以以相同的方式用于现有系统的初始安装和修改。定义配置文件的目标内容，如果目标系统发生变化，这些工具将处理差异。\n\
    \n| # | 链接 |\n| :--- | :--- |\n| 1 | http://martinfowler.com/bliki/DeploymentPipeline.html\
    \ |\n| 2 | http://martinfowler.com/bliki/ContinuousDelivery.html |\n| 3 | http://subversion.apache.org/\
    \ |\n| 4 | http://git-scm.com/ |\n| 5 | http://maven.apache.org/ |\n| 6 | http://gradle.org/\
    \ |\n| 7 | http://www.sonatype.org/nexus/ |\n| 8 | http://www.jrog.com/artifactory/\
    \ |\n| 9 | http://jenkins.io/ |\n| 10 | http://www.atlassian.com/software/bamboo\
    \ |\n| 11 | http://www.chef.io/ |\n| 12 | http://puppet.com/ |\n| 13 | http://www.ansible.com/\
    \ |\n| 14 | http://saltstack.com/ |\n\n## 8.3 打包选项\n\n在构建微服务之后，下一个问题是使用什么打包格式来部署应用程序。十二要素应用（Twelve-factor\
    \ app）和云原生应用定义中反复出现的主题是创建不可变产物，这些产物可以在不同的部署环境中无需更改地运行。\n\n从部署到部署的变化的变化越多，由于配置错误、缺失依赖等原因导致以意外方式崩溃的风险就越大。构建不可变的、自包含的产物引入了开发和生产环境之间的一致性，并降低了部署时出现惊喜的概率。\n\
    \n"
