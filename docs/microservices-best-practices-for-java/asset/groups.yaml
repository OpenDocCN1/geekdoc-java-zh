    In comparison to EJBs, CDI has no EE security on its own and does not get the
    persistence context injected. This process must be done by the developer themselves
    or by using additional frameworks. Apache DeltaSpike, for example, has many modules
    that you can use to extend the functions of CDI. For more information about Apache
    DeltaSpike, see:

    http://deltaspike.apache.org/index.html


    Additional frameworks can be used to extend the functions of CDI managed beans.
    EJBs have a thread pool that can be managed in an application server. CDI has
    nothing that corresponds to this function yet. To be able to configure a thread
    pool would be helpful in an environment with high loads.


    To implement a microservice running in a Java server, CDI and additional modules
    provide you many functions that are useful in these environments.


    # ## 5.2. Java Message Service API


    To implement an event-driven architecture in a Java world, JMS API provides support,
    which is also specified in Java Message Service 2.0 JSR 343¹ JMS is used to communicate
    to the so-called message producer that must be implemented by the message-oriented
    middleware (MOM).


    When JMS was updated from version 1.0 to 2.0, which is part of the EE 7 specification,
    rework was done to make the API easy to use. JMS 2.0 is compatible with an earlier
    version, so you can use your existing code or the new simplified API for your
    microservices. The old API will not be deprecated in the next version.


    According to the endpoints and dump pipes methodology¹⁷, your base microservice
    must just send your JSON to an endpoint hosted by the JMS provider. The sender
    of the messages is called producer and the receiver of the message is the consumer.
    These endpoints can be of these types:


    +   - Queue

    Messages in a queue are consumed by only one consumer. The sequence of messages
    in the queue might be consumed in a different order. Queues are used to point
    to semantic.


    +   - Topic

    These messages can be consumed by more than one consumer. This is the implementation
    for publish/subscribe semantics.


    In a REST-based microservice, where JSON-based requests are sent by the client,
    it is a good idea to use the JSON format for your messaging system. Other messaging
    applications use XML. If you have only one format in your system of microservice,
    it is easier to implement JSON.


