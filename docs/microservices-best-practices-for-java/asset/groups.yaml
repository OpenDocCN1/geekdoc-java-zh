  - '[PAGE 69]


    The EclipseLink Solution Guide for EclipseLink Release 2.5 shows an example of
    how to access a MongoDB:


    http://www.eclipse.org/ecliselink/documentation/2.5/solutions/nonrelational_db002.htm


    Before deciding to use JPA (like with EclipseLink) as the provider for MongoDB,
    consider the following points:


    +   - JPA is a specialized language that there has gone through a number of revisions.
    The database vendors have implemented this standard, but they have also added
    some features to the SQL that are not standardized. JPA has good support for SQL,
    but not support all of the features that are exposed by MongoDB. If some of these
    features are in your microservice, the benefits you get from using JPA are never.

    - JPA has numerous features that do not make sense in a document-oriented database,
    but the EntityManager has methods for these features. You must define which methods
    to use in your service.


    If you are unfamiliar with JPA and only require functions for storing your data
    in a NoSQL database, then it is acceptable to doing this with your JPA provider.
    If the access gets complicated, it is better to use the Java drivers from your
    NoSQL database. JPA does not really fit with NoSQL databases, but it can be a
    good starting point for your implementation. For a sample of how to use the native
    Java driver of MongoDB, see:


    http://docs.mongodb.org/getting-started/java/


    To get out of your JPA provider, it can use Spring Data JPA. In addition to the
    JPA provider, Spring Data JPA adds an extra layer on top of the JPA provider:


    http://projects.spring.io/spring-data-jpa/


    # Suitability of JPA for data handling in microservices


    The following list shows some arguments why JPA is useful for data handling in
    microservices:


    +   - Defining your microservices from the perspective of Domain Driven Design
    leads to the situation where the microservices only need simple queries to persist
    their entities (simple create, retrieve, update, and delete operations). JPA''s
    EntityManager has methods to create, retrieve, update, and delete methods that
    persist, find, merge. Not programming is necessary to call these methods.

    - In some cases, the queries get more complex. These queries can be done with
    the query language defined in JPA: JQL. For complex queries this would be an exceptional
    case. JSON documents with a hierarchy of entity data each be stored separately.
    This leads to simple IDs and simple queries.

    - JPA is standardized and has a great community to support you in developing your
    microservice. All Java EE must support JPA.

    - To implement microservices not running in a Java EE environment, you can also
    use JPA.

    - Generating entity classes from the database (reverse engineering) can reduce
    the number of lines of code you must implement by yourself.

    - For polyglot persistence, JPA has support for a relational data store and a
    document-oriented data store (EclipseLink).

    - JPA as an abstraction of the relational database allows you to exchange your
    relational data store with another relational data store if you need to. This
    portability prevents your vendor lock in.'
- md: "\nTo implement the strategy, every microservice should have its own schema\
    \ in a relational database, you can set the default schema for your service in\
    \ the JPA configuration file persistence.xml.\n\n## 5.2.2 Enterprise JavaBeans\n\
    \nEnterprise JavaBeans 3.2 (EJB) (specified in the JSR 345) is part of the Java\
    \ EE specification. EJBs are more than normal Java classes for these reasons:\n\
    \n- They have a lifecycle.\n- They are managed by an EJB container (runtime environment\
    \ for the EJB).\n- They have lot more features that can be helpful.\n\nEJBs are\
    \ server-side software components. Since EJB 3.0, it is no longer necessary to\
    \ use a Deployment Descriptor. All declarations of an EJB can be done with annotations\
    \ in the EJB class itself. The implementation to handle the EJB inside an EJB\
    \ container is as lightweight as is for CDI beans. The thread handling of EJBs\
    \ is done by the EJB container (similar to thread handling in a servlet container).\
    \ An additional feature of EJBs is that they can be used in combination with Java\
    \ EE Security.\n\nEJBs can be divided into the following types:\n\n- Stateless\n\
    - Stateful\n- Singleton\n- Message-driven beans (MDB)\n\nStateless EJBs cannot\
    \ hold any state, but stateful EJBs can. Due to the characteristics of a microservice,\
    \ stateful EJBs should not be used in a microservice. A Singleton exists only\
    \ one time in a EE server. MDBs are used in the processing of asynchronous messages\
    \ in combination with a JMS provider.\n\nEJBs can implement several business views,\
    \ which must be annotated accordingly:\n\n- Local interface (@Local)\n- Remote\
    \ interface (@Remote)\n- No interface (@FactoryBean)\n\nMethods in this Interface\
    \ can only be called by clients in the same Java virtual machine (JVM).\nMethods\
    \ that are listed in this interface can be called by clients outside the JVM.\n\
    Nearly as as local interface, except all public methods of the EJB class are exposed\
    \ to the client.\n\nIn a lightweight architecture, which a microservice should\
    \ handle, it is useful to implement the EJBs as no remote EJBs.\n\nOne of the\
    \ main benefits that EJBs provide is automatic transaction handling. Every time\
    \ a business method is called, the transaction manager of the EJB container is\
    \ invoked (exception: an EJB with explicitly switched off support for transactions).\
    \ So it is easy to use EJBs in combination with a transactional data store. Integrating\
    \ EJBs with JPA is easy.\n\n> 13 http://jcp.org/en/jsr/detail?id=345\n\nThe code\
    \ snippet in Example 5-14 shows an example of how to combine the EJBs with the\
    \ JPA framework.\n\nExample 5-14 Stateless (no-interface) EJB with PersistenceContext\n\
    \n```java\n@Stateless\n@LocalBean\npublic class OrderEJB {\n    @PersistenceContext\n\
    \    private EntityManager entityManager;\n    public void addOrder(Order order)\
    \ {\n        entityManager.persist(order);\n    }\n    public void deleteOrder(Order\
    \ order) {\n        entityManager.remove(order);\n    }\n}\n```\n\nThe EntityManager\
    \ gets injected as described in 5.2.1, \"Java Persistence API\" on page 50.\n\n\
    An EJB can have one of the following transaction attributes to operate with a\
    \ transactional data store (must be implemented by the EJB container):\n\n- REQUIRED\
    \ (default)\n- MANDATORY\n- NEVER\n- NOT_SUPPORTED\n- REQUIRES_NEW\n- SUPPORTS\n\
    \nFor more information about these attributes, see the following website:\nhttp://docs.oracle.com/7/javaee/javax/ejb/TransactionAttributeType.html\n\
    \nThese called container-managed transactions (CMTs) can be used on every business\
    \ method of an EJB. Bean-managed transactions (BMTs), which can also be used in\
    \ an EJB, should be avoided. The annotation @TransactionAttribute can be used\
    \ to set a class level bean so every business method of that class has this transaction\
    \ attribute (Example 5-15). If nothing is set, then all methods have the default\
    \ transaction level (REQUIRED). A transaction attribute at the method level overrides\
    \ the class attribute.\n\nExample 5-15 Set transaction attribute explicit in an\
    \ EJB\n\n```java\n@Stateless\n@LocalBean\npublic class OrderEJB {\n    …\n   \
    \ @TransactionAttribute(REQUIRES_NEW)\n    public void methodA(...)\n    @TransactionAttribute(REQUIRED)\n\
    \    public void methodB(...)\n}\n```\n\n## REST Endpoint not implemented as EJB\n\
    \nSome of the database changes or verifications are done at the point where the\
    \ transaction manager has decided to commit. In some situations, check constraints\
    \ in the database for example, are verified as one of the last steps before the\
    \ transaction is committed. If the verification fails, the outcome is a RuntimeException\
    \ that the JPA provider throws, because JPA uses exceptions to report errors.\
    \ If you use EJBs for transaction management, the place to catch the RuntimeException\
    \ is in the code of the EJB where the EJB contains the transaction. The stub code\
    \ is generated by the EJB container. Therefore, you cannot react to this RuntimeException\
    \ and the exception is further thrown to the place it will be called.\n\nIf you\
    \ implement your REST endpoint as an EJB, some may prefer, then the exception\
    \ must be caught in your REST provider. REST providers do have exception mappers\
    \ to do the conversion of exceptions to HTTP error codes. However, these exception\
    \ mappers do not interfere in the case when the RuntimeException is thrown during\
    \ database commit. Therefore, the RuntimeException is received by the REST client,\
    \ which should be avoided.\n\nThe best way to handle these problems is to implement\
    \ the EJBs as no remote EJBs.\n\n## 5.2.3 BeanValidation\n\nBeanValidation is\
    \ also part of the Java EE. The intention of BeanValidation is to easily define\
    \ and enforce validation constraints on your data. In Java EE environment, BeanValidation\
    \ is done by containers automatically. The developer only needs to set the constraints,\
    \ in the form of annotations on attributes, methods, or classes. This process\
    \ must be done in the lifecycle events these managed classes are involved.\n\n\
    For more information about Bean Validation, see the following website:\nhttp://beanvalidation.org/\n\
    \n> 14 http://jcp.org/en/jsr/detail?id=349\n\nExamples of built-in constraints\
    \ in the javax.validation.constraints package are shown in Example 5-17.\n\nExample\
    \ 5-17 Default built-in constraints\n\n```java\nprivate String username; // username\
    \ must not be null\n@Pattern(regexp=\"\\d{3}-\\d{3}-\\d{4}\")\nprivate String\
    \ phoneNumber; // phoneNumber must match the regular expression\n@Size(min=2,\
    \ max=40)\nprivate String briefMessage; // briefMessage between 2 and 40 characters\n\
    ```\n\nConstraints can also be combined as shown in Example 5-18.\n\nExample 5-18\
    \ Combination of constraints\n\n```java\n@NotNull\n@Size(min=1, max=16)\nprivate\
    \ String firstName;\n```\n\nIt is possible to extend the constraints (custom constraints).\
    \ Example 5-19 shows how to do the validation on your own.\n\nExample 5-19 Validating\
    \ programmatically\n\n```java\nOrder order = new Order(\"This is a description\"\
    , null);\nValidatorFactory factory = Validation.buildDefaultFactory();\nValidator\
    \ validator = factory.getValidator();\nSet<ConstraintViolation<Order>> constraintViolations\
    \ = validator.validate(order);\nassertEquals(2, constraintViolations.size());\n\
    assertEquals(\"Id may not be null\");\nconstraintViolations.iterator().next().getMessage());\n\
    assertEquals(\"Order may not be null\");\nconstraintViolations.iterator().next().getMessage());\n\
    ```\n\nJPA can be configured to do the bean validation automatically. The JPA\
    \ specification mandates that a provider must provide validation so managed classes\
    \ (see Example 5-20). Managed classes in the sense of JPA are, for example, entity\
    \ classes. All other classes used for the JPA programming must be validated (for\
    \ example, embedded classes, super classes). This process must be done in the\
    \ lifecycle events these managed classes are involved.\n\nExample 5-20 Persistence.xml\
    \ with bean validation turned on\n\n```xml\n<persistence>\n  <persistence-unit\
    \ name=\"OrderDB\">\n    <provider>\n      org.eclipse.persistence.jpa.PersistenceProvider\n\
    \    </provider>\n    <class>...</class>\n    <properties>\n      <property name=\"\
    javax.persistence.validation.mode\"\n        value=\"AUTO\" />\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```\n"
  mdcn: "\n为了实现该策略，每个微服务都应该在关系型数据库中拥有自己的 schema，你可以在 JPA 配置文件 `persistence.xml` 中为你的服务设置默认\
    \ schema。\n\n## 5.2.2 Enterprise JavaBeans\n\nEnterprise JavaBeans 3.2 (EJB)由\
    \ JSR 345 指定）是 Java EE 规范的一部分。由于以下原因，EJBs 比普通的 Java 类更强大：\n\n- 它们具有生命周期。\n- 它们由\
    \ EJB 容器（EJB 的运行时环境）管理。\n- 它们拥有更多非常有帮助的特性。\n\nEJBs 是服务端软件组件。从 EJB 3.0 开始，不再需要使用部署描述符（Deployment\
    \ Descriptor）。所有的 EJB 声明都可以在 EJB 类本身中通过注解完成。在 EJB 容器内部处理 EJB 的实现与 CDI beans 一样轻量。EJBs\
    \ 的线程处理由 EJB 容器完成（类似于 servlet 容器中的线程处理）。EJBs 的一个额外特性是它们可以与 Java EE Security结合使用。\n\
    \nEJBs 可以分为以下几种类型：\n\n- 无状态 (Stateless)\n- 有状态 (Stateful)\n- 单例 (Singleton)\n\
    - 消息驱动豆 (MDB)\n\n无状态 EJBs 无法持有任何状态，但有状态 EJBs 可以。由于微服务的特性，不应在微服务中使用有状态 EJBs。单例（Singleton）在\
    \ EE 服务器中只存在一次。MDB 用于在结合 JMS 供应商者的情况下处理异步消息。\n\nEJBs 可以实现多种业务视图，必须对它们进行相应的注解：\n\
    \n- 本地接口 (@Local)\n- 远程接口 (@Remote)\n- 无接口 (@FactoryBean)\n\n此接口中的方法只能由同一 Java\
    \ 虚拟机 (JVM) 中的客户端调用。\n此接口中列出的方法可以由 JVM 外部的客户端调用。\n与本地接口几乎相同，但 EJB 类的所有公共方法都暴露给客户端。\n\
    \n在微服务应该处理的轻量级架构中，将 EJBs 实现为无远程的 EJBs 是很有用的。\n\nEJBs 提供的主要优势之一是自动事务处理。每当调用业务方法时，EJB\
    \ 容器的事务管理器就会被调用（异常情况：显式关闭了事务支持的 EJB）。因此，结合事务数据存储器使用 EJBs 非常简单。将 EJBs 与 JPA 集成也非常容易。\n\
    \n> 13 http://jcp.org/en/jsr/detail?id=345\n\n示例 5-14 中的代码段展示了如何将 EJBs 与 JPA 框架的示例。\n\
    \n示例 5-14 带有 PersistenceContext 的无状态（无接口）EJB\n\n```java\n@Stateless\n@LocalBean\n\
    public class OrderEJB {\n    @PersistenceContext\n    private EntityManager entityManager;\n\
    \    public void addOrder(Order order) {\n        entityManager.persist(order);\n\
    \    }\n    public void deleteOrder(Order order) {\n        entityManager.remove(order);\n\
    \    }\n}\n```\n\nEntityManager 按照第 50 页第 5.2.1 节“Java Persistence API”所示的方式进行注入。\n\
    \nEJB 可以具有以下事务属性之一以与事务数据存储器操作（必须由 EJB 容器实现）：\n\n- REQUIRED（默认）\n- MANDATORY\n\
    - NEVER\n- NOT_SUPPORTED\n- REQUIRES_NEW\n- SUPPORTS\n\n关于这些属性的更多信息，请参阅以下网站：\n\
    http://docs.oracle.com/7/javaee/javax/ejb/TransactionAttributeType.html\n\n这些称为容器托管事务\
    \ (CMTs)，可以用于 EJB 的每个业务方法。应该避免使用同样可用于 EJB 的豆 托管事务 (BMTs)。可以使用注解 @TransactionAttribute\
    \ 来设置类级别的豆，以便该类的类的每个业务方法都具有此事务属性（示例 5-15）。如果未设置任何内容，则所有方法都具有默认的事务级别 (REQUIRED)。方法层面的事务属性会覆盖类级属性。\n\
    \n示例 5-15 在 EJB 中显式设置事务属性\n\n```java\n@Stateless\n@LocalBean\npublic class OrderEJB\
    \ {\n    …\n    @TransactionAttribute(REQUIRES_NEW)\n    public void methodA(...)\n\
    \    @TransactionAttribute(REQUIRED)\n    public void methodB(...)\n}\n```\n\n\
    ## 未作为 EJB 实现的 REST 端点\n\n某些数据库更改或验证是在事务管理器决定提交的时间点完成的。在某些情况下，例如数据库中的检查约束是在事务提交前的最后步骤之一进行验证的。如果验证失败，结果将是\
    \ JPA 提供者抛出的 RuntimeException，因为 JPA 使用异常来报告错误。如果你使用 EJBs 进行事务管理，那么捕获 RuntimeException\
    \ 的地方是在包含事务的 EJB 代码中。存根代码是由 EJB 容器生成的。因此，你无法对此 RuntimeException 做出反应，异常会被进一步抛到调用处。\n\
    \n如果你倾向于将 REST 端点实现为 EJB，那么必须在你的 REST 提供者中捕获异常。REST 提供者具有异常映射器将异常转换为 HTTP 错误代码。然而，当在数据库提交期间抛出\
    \ RuntimeException 时，这些异常映射器不会生效。因此，REST 客户端将接收到 RuntimeException，这是应该避免的。\n\n\
    处理这些最佳方法是将 EJBs 实现为无远程的 EJBs。\n\n## 5.2.3 BeanValidation\n\nBeanValidation 也是\
    \ Java EE 的一部分。BeanValidation 的意图是对你的数据轻松地定义和强制执行约束。在 Java EE 环境中，BeanValidation\
    \ 由容器自动完成。开发者只需要以注解的形式在属性、方法或类上设置约束。此过程在生命周期事件中完成。\n\n有关 Bean Validation 的更多信息，请参阅以下网站：\n\
    http://beanvalidation.org/\n\n> 14 http://jcp.org/en/jsr/detail?id=349\n\njavax.validation.constraints\
    \ 包中的内置约束示例见示例 5-17。\n\n示例 5-17 默认内置约束\n\n```java\nprivate String username; //\
    \ username 不能为空\n@Pattern(regexp=\"\\d{3}-\\d{3}-\\d{4}\")\nprivate String phoneNumber;\
    \ // phoneNumber 匹配正则表达式\n@Size(min=2, max=40)\nprivate String briefMessage; //\
    \ briefMessage 在 2 到 40 字符之间\n```\n\n约束也可以像示例 5-18 所示进行组合。\n\n示例 5-18 约束组合\n\n\
    ```java\n@NotNull\n@Size(min=1, max=16)\nprivate String firstName;\n```\n\n可以扩展约束（自定义约束）。示例\
    \ 5-19 显示如何自己进行验证。\n\n示例 5-19 程序化验证\n\n```java\nOrder order = new Order(\"This\
    \ is a description\", null);\nValidatorFactory factory = Validation.buildDefaultFactory();\n\
    Validator validator = factory.getValidator();\nSet<ConstraintViolation<Order>>\
    \ constraintViolations = validator.validate(order);\nassertEquals(2, constraintViolations.size());\n\
    assertEquals(\"Id may not be null\", constraintViolations.iterator().next().getMessage());\n\
    assertEquals(\"Order may not be null\", constraintViolations.iterator().next().getMessage());\n\
    ```\n\nJPA 可以配置为自动执行 bean validation。JPA 规范规定提供者必须为托管类提供验证（见示例 5-20）。JPA 意义上的托管类是指实体类。所有其他用于\
    \ JPA 编程的类都必须验证（例如嵌入类、超类）。\n\n示例 5-20 开启 bean 验证的 Persistence.xml\n\n```xml\n\
    <persistence>\n  <persistence-unit name=\"OrderDB\">\n    <provider>\n      org.eclipse.persistence.jpa.PersistenceProvider\n\
    \    </provider>\n    <class>...</class>\n    <properties>\n      <property name=\"\
    javax.persistence.validation.mode\"\n        value=\"AUTO\" />\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```\n"
