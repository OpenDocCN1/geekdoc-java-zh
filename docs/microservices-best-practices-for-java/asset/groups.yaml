    \ model, you can use specialized systems, for example Elastic Search to support\
    \ the queries of your microservice. For more information about Elastic Search,\
    \ see: https://www.elastic.co/\n\n 5.1.6 Messaging systems\n\nYou can use messaging\
    \ systems or a message-oriented middleware to support your event-driven architecture.\n\
    \n- Message-oriented middleware (MOM) is software or hardware infrastructure supporting\
