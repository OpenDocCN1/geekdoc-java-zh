    \nChapter 5. Handling data 49\n\n## 5.2 Support in Java\n\nIn a polyglot persistence\
    \ environment, the programming language you use to implement your microservices\
    \ must deal with the different persistence technologies. Your programming language\
    \ must be able to support each of the different ways to persist your data. Java\
    \ as a programming language has many APIs and frameworks that can support the\
    \ developer to deal with different persistence technologies.\n\n### 5.2.1 Java\
    \ Persistence API\n\n> \"The Java Persistence API (JPA) is a Java specification\
    \ for accessing, persisting, and managing data between Java objects / classes\
