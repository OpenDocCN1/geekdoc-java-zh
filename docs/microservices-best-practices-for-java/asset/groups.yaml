    After you are using a mocking framework for other levels of testing, it makes
    sense to reuse those skills. However, if you do the mocking approach, you must
    make sure that the tests in your staging environment exercise inter-service communications
    effectively.


    # ## 7.3.6 Security verification


    Security is important in a distributed system. You can no longer put your application
    behind a firewall and that nothing will break through. For more details about
    securing your microservices, see Chapter 6, "Application Security" on page 67.


    Testing the security of your microservice is slightly depending on how you implement
    security. If the individual services are using token validation, then test at
    the individual service level. If you are using another service or a library to
    validate the tokens, then that service should be tested in isolation and the interactions
    should be tested in the staging environment.


    The final type of tests to run is security scanners by IBM Security AppScan® to
    highlight security holes. AppScan scans your code and highlights any vulnerabilities.
    It provides recommendations for fixing the vulnerabilities. For more information
    about AppScan, see the following website:


    http://www.ibm.com/software/products/en/appscan


    # ## 7.4 Staging environment


    This section defines a staging environment as a test environment that is identical
    (where possible) to the production environment. The build pipeline deploys successfully
    tested microservices to the staging environment where tests are run to verify
    the communication across logical boundaries, that is, between microservices.


    # ## 7.4.1 Test data


    The staging environment should include any data stores that will be in your production
    system. As described in 7.3.4, "testing data requests" on page 84, the test data
    should not be unnecessarily complicated. The data in this data store will be more
    complete than at the individual microservice level, as these tests are testing
    more complicated interactions.


    Use tools to inject data into tests tests. Tools allow you to have more control
    over the flow of data around the system, enabling you to see what happens if bad
    data is introduced. The microservice orchestration and composition solution Amalgam8
    offers this feature using its controller component. The controller passes information
    between the service registry and the microservice side-car. It can inject data
    dynamically to simulate the introduction of bad data into the system.


    For more information about Amalgam8, see the following website:


    https://www.amalgam8.io/'
- md: '

    ## 7.4.2 Integration


    Integration tests are used to test the interactions between all the services in
    the system. The in-depth behavior of the individual services has already been
    tested at this stage. The consumer right contract tests should have ensured that
    the services interact successfully, but these tests identify bugs that have been
    missed. The tests should check the basic success and error paths of service communication
    with the application deployed. Use the test data as discussed in the previous
    section.


    Rather than testing all of the services at once, it might still be necessary to
    mock some of the services during testing. The interaction of two specific services,
    or a small set of services, should be in mocked behavior when calls are made to
    outside the set. Mocking the calls to the services outside the group under test
    is done in the same way as the unit tests on the APIs. The same techniques that
    are used to start and stop the server or container for contract testing also apply
    here (see 7.3.2, "Testing resources" on page 81).


    ## 7.4.3 Contract


    Every service that consumes another resource should have a set of contract tests
    that are run against that resource (especially in staging environments). Given
    that services evolve independently over time, it is important to ensure that the
    consumer''s contract continues to be satisfied.


    These tests are specifically written by the consumer (the client side), and are
    run and managed as part of the test suite for the consuming service. By contrast,
    the tests discussed in 7.3.2, "Testing resources" on page 81 are written by the
    producer to verify the contract as a whole.


    ## 7.4.4 End-to-end


    End-to-end testing is essential to find the bugs that were missed previously.
    End-to-end tests should exercise certain "golden paths" through the application.
    It is unrealistic to test every path through the application with an end-to-end
    test, so identify the key ones and those. A good way to identify these paths through
    the environment is to review the key requirements of an application. For example,
    if your application is an online retail store, you might test the following paths:


    - User logs in

    - User purchases an item

    - User views the summary of the order

    - User cancels the order


    End-to-end testing should also include the user interface. Tools such as Selenium
    should be used to automate interactions with a web browser for testing. For more
    information about Selenium, see the following website:


    http://www.seleniumhq.org/


    ## 7.4.5 Fault tolerance and resilience


    A microservice should be designed in a fault tolerant way as described in 4.2,
    "Fault tolerance" on page 37. Various techniques can be used to increase the resilience
    and fault tolerance of individual microservices, but you should still test how
    fault your system is as a whole. Tests for fault tolerance should be performed
    with all of the services deployed. Do not use any mocks.


    ### Taking down individual microservices


    In a microservice system, you must not rely on all of the microservices being
    available at any time. During the testing phase, make requests to the system while
    taking down and redeploying individual services. This process should include the
    microservices in the system and backend data stores. Monitor the time for requests
    to return and identify an acceptable response time for your application. If the
    response times are too long, consider reducing the timeout values on your services
    or activating the circuit breaker configurations.


    There are tools that can automate this process, the best known within the Java
    community is Netflix Chaos Monkey, which terminates instances of virtual machines
    to allow testing of fault tolerance. For more information about Netflix Chaos
    Monkey, see the following website:


    ```

    https://github.com/Netflix/SimianArmy/wiki/Chaos-Monkey

    ```


    Other tools, such as Gremlin, which is used by Amalg8, take the approach of intercepting
    and manipulating calls to microservices without shutting down instances. For more
    information about Gremlin, see this website:


    ```

    https://github.com/ResilienceTesting/gremlin-python

    ```


    ### Injecting bad data


    As in the integration, tools such as Amalg8 can be used to automate the injection
    of bad data during testing. If you have successfully used the bulk head pattern,
    then bad data in one microservice should not propagate to other microservices.


    ### Stress testing


    Microservices should be able to handle unexpected loads. Stress testing should
    be used to test the bulk heads in your microservices. If a particular microservice
    is holding up requests, look at the configured bulk heads.


    ### Recoverability testing


    Individual microservices should also be resilient to problems in their deployment.
    If a container or virtual machine goes down, the microservice needs to be able
    to recover quickly. Orchestration tools such as Amalg8 or Kubernetes (for orchestration)
    will spin up new instances of any application if it goes down. A microservice
    must have fast startup time and, when a shutdown is required, it should shut down
    gracefully. Using an application server that provides a fast startup time is also
    essential.


    Couple your recoverability testing with taking down service instances. Allow your
    orchestration system to create the new instances and monitor how long it takes
    to start the new service.


    ## 7.5 Production environment


    To test your system, you should consider running tests on the production environment.
    With so many moving parts and services constantly coming and going, you should
    not expect the system to continue working perfectly indefinitely. It is important
    to add monitoring and analytics to your application to warn of any bad behavior.
    For more information, see Chapter 9, "Management and Operations" on page 107.


    Repeat these specific tests from the staging environment in the production environment:


    - Injecting test or bad data

    - Taking down services, both to test the fault tolerance of other services and
    recoverability of the service you took down

    - Security verification


    Use the same tools and techniques as in the staging environment. Be careful when
    you run these tests. Do not run during peak hours. Instead, select a timeslot
    that has the smallest impact on your clients as possible, just in case something
    goes down.


    ### 7.5.1 Synthetic monitoring


    To determine the health of your production system, create synthetic transactions
    to run through your application. Use a browser emulator to instantiate the synthetic
    transactions and monitor the responses. Look for invalid responses or large response
    times. You can also run the automated build system periodically, but you will
    discover any changes to the application dependencies that might cause problems.


    ### 7.5.2 Canary testing


    Canary tests are named after the proverbial canary taken into the coal mine to
    serve as an early indicator of unsafe operating conditions for miners. They are
    minimal tests that verify all dependencies and basic operating requirements for
    a service are present and functioning. If the environment is unhealthy, canary
    tests fail quickly, providing an early indicator for a botched deployment.


    ## 8


    ## Development to production


    This chapter covers how individual microservices are built and deployed. To that
    end, review the characteristics that microservices should have that facilitate
    a smooth transition from development to production:


    - A microservice must be independently deployable.

    - A new version of a microservice should be deployable in minutes rather than
    in hours.

    - A microservice must be fault tolerant, and should prevent cascading failures.

    - A microservice should not require any code changes as it is deployed across
    target environments.


    As mentioned earlier in the book, microservice architectures require good automated
    deployment tools to help manage the deployment, testing, and promotion of services
    across target environments.


    The following topics are covered in this chapter:


    - Deployment patterns

    - Deployment pipelines and tools

    - Packaging options

