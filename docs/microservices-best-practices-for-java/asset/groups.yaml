- md: '

    As mentioned earlier, these rules make up the Robustness Principle. By following
    these two rules you put yourself in the best possible position for changing your
    API in the future and adapting to changing requirements from consumers. For more
    information about the Robustness Principle, see the following:

    https://en.wikipedia.org/wiki/Robustness_principle


    ## 4.2 Timeouts


    When making a request to another microservice, whether asynchronously or not,
    the request must have a timeout. Because we expect services to come and go, we
    should not be waiting indefinitely for a response.


    The asynchronous support in JAX-RS 2.0 has a setTimeout function on the AsyncResponse
    object ("Synchronous messaging (REST)" on page 34). Tools like Failsafe and Netflix
    have built-in support for timeouts.


    Setting a timeout improves the resilience of your microservices, but can still
    result in a poor user experience because the end-to-end path will be slow. It
    is also possible for timeouts to be badly aligned that the request from service
    A to service B times while service B is waiting for a response from C.


    ### 4.2.3 Circuit breakers


    Using a timeout prevents a request from waiting indefinitely for a response. However,
    if a particular request always produces a timeout, you waste a lot of time waiting
    for the timeout to occur.


    A circuit breaker is designed to avoid repeating timeouts. It works in a similar
    way to the electronic version of the same name. The circuit breaker makes a note
    every time specific request fails or produces a timeout. If this count reaches
    a certain level, it prevents further calls from occurring, instead of returning
    an error instantly. It also creates a mechanism for retrying the call, either
    after a certain amount of time or in reaction to an event.


    Circuit breakers are vital when calling external services. Generally, use one
    of the existing libraries for circuit breakers in Java.


    ### 4.2.4 Bulkheads


    In shipping, a bulkhead is a partition that prevents a leak in one compartment
    from sinking the entire ship. Bulkheads in microservices are a similar concept.
    You need to make sure that a failure in one part of your application doesn''t
    take the whole down. The bulkhead pattern is about how you create microservices
    rather than the use of any specific tool or library. When creating microservices,
    ask yourself how you can isolate the different parts and prevent cascading failures.


    The simplest implementation of the bulkhead pattern is to provide fallbacks. Adding
    a fallback allows the application to continue functioning when non-vital services
    are down. For example, in an online store there may be a service that provides
    recommendations for the users. If the recommendation service goes down, the user
    should still be able to search for items and place orders. An interesting example
    is chained fallbacks, where a failed request for personalized content falls back
    to a request for more general content, which would turn turn back to returning
    cached (and possibly stale) content in preference to an error.


    Another strategy for preventing a slow or constrained remote resource from bringing
    down the whole ship is to limit the resources available for those outbound requests.
    The most common ways of using these queues and Semaphore. For information about
    Semaphore, see the following website:

    https://docs.oracle.com/javase/7/docs/api/java/util/concurrent/Semaphore.html


    A queue has a depth that indicates a maximum of pending work. Any requests that
    are made after the queue is full are a fast failure. Queues are also assigned
    a finite number of workers, which defines the maximum number of server threads
    that can be blocked by the remote resource.


    A semaphore mechanism works by having a set number of permits. A permit is required
    to make the remote request. After a request has completed successfully, the permit
    is released.


    The significant difference between the two is in what happens when the allocated
    resources are all used up. With a semaphore approach, the outbound request is
    skipped entirely if the permit cannot be obtained, although the queue approach
    does offer some padding (at least until queue is full).


    These approaches can also be used to deal with remote resources that impose rate
    limits, which are yet another form of unexpected failure to deal with.


    ## Handling data


    In an environment with polyglot persistence, which can exist in a system of microservices,
    it is necessary to keep the data handling manageable. To explain how this goal
    can be achieved, this chapter provides a short description of characteristics
    of microservices concerning data handling and then looks how it can be done with
    Java based microservices.


    The following topics are covered:


    - Data-specific characteristics of a microservice

    - Support in Java


    ## 5.1 Data-specific characteristics of a microservice


    One way to identify the data, which must be stored in the data store of your microservice,
    is a top down approach. Start at the business level to model your data. The following
    sections show how to identify this data, how to handle the data, and how it can
    be shared with other data stores of other microservices. For a description of
    the top down approach, see the following website:


    http://en.wikipedia.org/wiki/Top-down_and_bottom-up_design


    ### 5.1.1 Domain-driven design leads to entities


    From the approach in domain-driven design, you get the following objects, among
    others:


    - Entity: "An object that is not defined by its attributes, but rather by a thread
    of continuity and its identity"

    - Value Objects: "An object that contains attributes but has no conceptual identity.
    They should be treated as immutable"

    - Aggregate: "A collection of objects that are bound by a root entity, otherwise
    known as an aggregate root. The aggregate root guarantees the consistency of changes
    being made within the aggregate by forbidding external objects from holding references
    to its members"

    - Repository: "Methods for retrieving domain objects should delegate to a specialized
    Repository object such that alternative storage implementations may be easily
    interchanged"


    These quotations are taken from the following source:

    http://en.wikipedia.org/wiki/Domain-driven_design


    These objects should be mapped to your persistence store (you should aggregate
    entities when they have the same lifecycle). This domain model is the basis for
    both a logical data model and a physical data model.


    For more information about domain-drive terms, see the following website:

    http://dddcommunity.org/resources/ddd_terms/


    ## 5.1.2 Separate data per microservice


    Every microservice should have its own data store (Figure 5-1) and is decoupled
    from the other microservice and its data. The second microservice must not directly
    access the data store of the first microservice.


    Reasons for this characteristic:


    - If microservices share a data store, they are tightly coupled. Changing the
    structure of the data store (as tables) for one microservice can cause problems
    for the other microservice. If microservices are coupled this way, deployment
    of new versions must be coordinated, which must be avoided.

    - Every microservice should use the type of database that best fits its needs
    (polyglot persistence, 5.1.3, "Polyglot persistence" on page 45 for more details).
    You do not need to make a trade off between different microservices when choosing
    a database system. This configuration leads to a separate data store for each
    microservice.

    - From a performance aspect, it can be useful for every microservice to have its
    own data store because scaling can become easier. The data store can be hosted
    on its own server.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_56_0.png)


    The separation of data stores for a relational database can be achieved in one
    of the following ways:


    - Schema per microservice: Each service has its own schema in the database (Figure
    5-2 on page 44). Other services can use the same database but must use a different
    schema. This configuration can be enforced with the database access control mechanism
    (using grants for connected database users) because developers suffering from
    time pressures tend to use shortcuts and can access the other schema directly.

    - Database per microservice: Each microservice can have its own database but share
    database server with the other microservices (Figure 5-2 on page 44). With a different
    database, users can connect to the database server and there is a good separation
    of the databases.

