  - '[PAGE 58]


    # 5.1.3 Polyglot persistence


    Every microservice should use its own data store, which means that it can use
    a different data storage technology. The NoSQL movement has led to many new data
    storage technologies, which can be used alongside a traditional relational database.
    Based on the requirements that an application must implement, it can choose between
    different types of technologies to store its data. Having a range of data storage
    technologies in one application is known as polyglot persistence.


    For some microservices, it is best to store their data in a relational database.
    Other services, with a different type of data (such as unstructured, complex,
    and graph oriented) can store their data in some NoSQL databases.


    Polyglot programming is a term that means that applications should be written
    in a programming language that best fits the challenge that an application must
    deal with.


    A more in-depth description of these two terms can be found on the Martin Fowler
    website: http://martinfowler.com/biki/PolyglotPersistence.html


    # 5.1.4 Data sharing among microservices


    In some situations, a client of a microservice application might want to request
    data that is owned by a different service. For example, the client might want
    to see all his Payments and the corresponding state of his payments. He would
    have to query the service for his Account and afterward is against the best practices
    for microservices to join the data by using the database. To handle this business
    case, you must implement an adapter service (Figure 5-4) that queries the Account
    service and the Payment service, and then returns the collected data to the client.
    The adapter service is also responsible for doing the necessary data transformations
    on the data it has received.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_58_0.png)'
  - '[PAGE 59]


    Changing data can become more complicated, in a system of microservices, some
    business transactions can span multiple microservices. In a microservice application
    for a retail store, for example, there might be a service to place an Order and
    to do the Payment. Therefore, if a customer wants to buy something in your shop
    and pays for it, the business transaction spans the two microservices. Every microservice
    has its own data store, so with a business transaction spanning two or more microservices,
    two or more data stores are involved in this business transaction. This section
    describes how to implement these business transactions.


    # Event-Driven architecture


    You need a method to ensure the consistency of the data involved in a business
    transaction that spans two or more microservices. One way would be a distributed
    transaction, but there are many reasons why this should not be in a microservice
    application. The main reason is the tight coupling of the microservices that are
    involved in a distributed transaction. If two microservices are involved in a
    distributed transaction and one service fails or has a performance problem, it
    is difficult to roll back the transaction.


    The best way to span a business transaction across microservices is to use an
    event-driven architecture. To change data, the first service updates its data
    and, in the same (inner) transaction, publishes an event. The second microservice,
    which has subscribed to this event, receives this event and does the change on
    its data. Using a publish/subscribe communication model, the two microservices
    are loosely coupled. The coupling only exists on the messages that they exchange.
    This technique enables a system of microservices to maintain consistency across
    all microservices without using a distributed transaction.


    If there are microservices in the microservice application that send messages
    to each other, then they might be good candidates for merging into one service.
    But be careful because this configuration might break the domain-driven design
    of your microservices. Adapters serving complex updates, which span more than
    one service, can also be implemented using events.


    The programming model of an event-driven architecture is more complex, but Java
    can help to keep the complexity manageable.


    # Eventual Consistency


    In an event-driven architecture, sending messages to other microservices creates
    a problem called Eventual Consistency. It is often a runtime problem resulting
    from the following situation: service A changes data in its data store and, in
    the same transaction, sends a message to microservice B. After a short amount
    of time, microservice B receives the message and changes the data in its data
    store. In this normally short period, the data in the two stores is not consistent.
    For example: service A updates the Order in its data store and sends a message
    to the Payment. When the Payment gets processed, there is an Order that has not
    been paid. This gets weird when the receiver of the message is not able to process
    the message. In this case, the messaging system or the receiving microservice
    needs robust strategies to cope with this problem!


    In a microservices application, every microservice has its own database. A business
    transaction that spans more than one microservice introduces eventual consistency
    because distributed transactions are discouraged to solve this problem. One way
    to cope with such business transactions is shown in Figure 5-5 on page 47. The
    Order microservice saves the Order in its data store and sends an event, for example
    OrderCreated, to the Payment microservice. The Order microservice has not received
    the confirmation of the Payment, so the Order is in a pending state.


    > ¹"Enterprise Integration Patterns: Designing, Building, and Deploying Messaging
    Solutions", Gregor Hohpe and Booby Wooff, Addison-Wesley Professional'
  - '[PAGE 60]


    The Payment service is subscribed to the OrderCreated event so it processes this
    event and does the Payment in its data store. If the Payment succeeds, then it
    publishes a PaymentApproved event that is subscribed by the Order microservice.
    After processing the PaymentApproved event, the state of the Order gets changed
    from Pending to Approval. If the customer queries the state of his Order he gets
    one of the following responses: Order is in a pending state or Order is approved.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_60_0.png)


    In situations where the data is not available, the service can send out to the
    client something like the following message: "Sorry, please try again".


    # Data replication


    The separation of the data stores and the requirement to get data from different
    data stores can lead to the idea that the data replication mechanisms of the database
    system would solve the problem. Doing this, for example, with a database trigger
    or a timed procedure or other processes, has the same disadvantage as sharing
    the database with more microservices. Changing the structure of the data on one
    side of the replication pipe leads to problems with the replication process. The
    process must be adapted when a new version of service is being deployed. This
    is also a form of tight coupling and must be avoided.


    As stated, the event-based processing can decouple the two data stores. The services
    processing the events can do the relevant data transformation, if needed, and
    store the data in their own data stores.


    # 5.1.5 Event Sourcing and Command Query Responsibility Segregation


    In an event-driven architecture, consider Command Query Responsibility Segregation
    (CQRS) and Event Sourcing. These two architectural patterns can be combined to
    handle the events flowing through your microservice application.'
