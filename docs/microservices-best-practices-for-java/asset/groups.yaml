    ## 6.2.1 Authentication and authorization


    There are new considerations for managing authentication and authorization in
    microservice environments. With a monolithic application, it is common to have
    fine grained roles, or at least role associated groups in a central user repository.
    With the emphasis on independent lifecycles for microservices, however, this dependency
    is an anti-pattern. Development of an independent microservice is then designed
    and coupled with updates to the centralized resource.


    It is common to have authentication (establishing the user''s identity) by a dedicated,
    centralized service or even an API gateway. This central service can then further
    delegate authentication to a third party.


    When working with authorization (establishing a user''s authority or permission
    to access a secured resource), in a microservices environment keep group or role
    definitions coarse grained in cross cutting services. Allow independent services
    to maintain their own fine controls. The guiding principle is independence. A
    balance must be found between what can be defined in common authorization service
    to meet requirements for the application as a whole, and what authorization requirements
    implementation details for a particular service.


    ### Java EE security


    Traditional experience access control tokens have less traction in a microservice
    environment. The presence of other programming languages and the inability to
    rely on long-lived sessions undercut the operational assumptions of Java EE security
    mechanisms.


    For EE security, each Java server must be trusted by all of the other services.
    The security token (in WebSphere Application Server, is an LTPA Token) that the
    user receives after authentication must be valid on all other servers. Trusting
    this way means that (a) every server needs the certificates of every other server
    in its keystore, or (b) all of the services need to use the same key. A user authenticating
    to the system must also be in the security realm defined for your Java server.
    Key management, specifically keystore management for Java applications, in a dynamically
    provisioned environment is a non-trivial problem to solve. For more information
    about Java EE Security, see this website:


    https://dzone.com/refcardz/getting-started-java-ee


    If you compare the effort is required to achieve and maintain this environment
    to the benefit you get from Java EE security, it is difficult to recommend Java
    EE security.


    ## 6.2.2 Delegated Authorization with OAuth 2.0


    OAuth provides an open framework for delegating authorization to a third party.
    Although the framework does not define interaction patterns for authorization,
    it is not strictly defined programming interface, with some variations between
    OAuth providers. For more information about the OAuth Framework, see the following
    website:


    https://tools.iet.org/rfc/rfc6749


    OpenID (OIDC) provides an identity layer on top of OAuth 2.0, making it possible
    to also delegate authentication to a third party. It defines an operable REST-based
    mechanism for verifying identity based on the authentication steps performed by
    the OAuth provider, and to obtain basic profile information about the authorized
    user. For more information about OIDC, see the following website:


    https://openid.net/connect/


    Game On! uses three-legged authentication defined by OAuth and OIDC to delegate
    to social sign-on providers, specifically Facebook, GitHub, Google, and Twitter.
    As shown in Figure 6-2, the game has a dedicated Auth service that acts as a proxy
    for the various social login providers. This Auth service triggers a request to
    the target OAuth provider including information required to identify the Game
    On! application.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_85_0.png)


    Figure-6-2 OAuth invocation sequence diagram for Game On!


    The service interaction goes through these steps:

    - The front end (web client or mobile application) makes a request to the game''s
    Auth service on behalf of the user.

    - The Auth service returns a forwarding response that is automatically handled
    by the browser to forward the user to the selected OAuth provider with the application
    identifier.

    - After the user has authenticated and granted permission, the OAuth provider
    returns an authorization code in another redirect response. The browser automatically
    handles the redirect to move back to a callback on the Auth service with the authorization
    code.

    - The Auth service then contacts the OAuth provider to exchange the authorization
    code for an access token.

    - The Auth service converts data from that token into a Signed JSON Web Tokens
    (JWTs), which allows you to verify the identity of the user over subsequent inter-service
    calls without going back to the OAuth provider.


    Some application servers, like WebSphere Liberty, have OpenID Connect features
    to facilitate communication with OAuth providers. As of this writing, these features
    do not provide the access token that was returned from the OAuth provider. Also,
    mine protocol differences make using individual provider libraries easier than
    more generic solutions.


    A simpler approach might be to perform authentication with an OAuth provider by
    using a gateway. If you take this approach, it is still a good idea to convert
    provider-specific tokens into an internal facing token that contains the information
    that you need.


    ## 6.2.3 JSON Web Tokens


    Identity propagation is another challenge in a microservices environment. After
    the user (human or service) has been authenticated, identity needs to be propagated
    to the next service in a trusted way. Frequent calls back to a central authentication
    service to verify identity are inefficient, especially given that direct-to-service
    communication is preferred to routing through central gateways whenever possible
    to minimize latency.


    JWTs can be used to carry along a representation of information about the user.
    In essence, you will be able to accomplish these tasks:


    - Know that the request was initiated from a user request

    - Know the identity that was made on behalf of

    - Know that this request is not a malicious replay of a previous request


    JWTs are compact and URL friendly. As you might guess from the name, a JWT (pronounced
    "jot") contains a JSON structure. The structure contains some standard attributes
    (claims), such as issuer, subject (the user''s), and expiration time, which has
    clear mappings to other established mechanisms. Room is also available for claims
    to be customized, allowing additional information to be passed along.


    While parsing, you will be told that your JWT is not valid for reasons that are
    not apparent. For security and privacy reasons, it is not a good idea to expose
    (to the front end) what is wrong with the logic. Doing so can leak implementation
    details that could be used maliciously. JWT.io provides some utilities for working
    with JWTs, providing a quick way to verify whether the encoded JWT that you scrolled
    in your browser console or trace log is valid or not. For more information about
    JWT.io, see the following website:


    https://jwt.io


    ### Dealing with time


    One of the attributes of JWTs is that they allow identity to be propagated, but
    not indefinitely. JWTs expire, which triggers renewal of the identity that results
    in a new JWT. JWTs have three fields that relate to time and expiry, which are
    all optional. Generally, include these fields and validate them when they are
    presented as follows:


    - The time JWT was created (iat) is before the current time and is valid.

    - The "not process before" (nbf) claim is before the current time and is valid.

    - The expiration time (exp) is after the current time and is valid.


    All of these are expressed as UNIX epoch stamps.


    ### Signed JWTs


    Signing a JWT helps establish trust between services, as the receiver can verify
    the identity of the signer, and that the contents of the JWT have not been modified
    in transit.


    JWTs can be used by signing shared secrets, or a public/private key pair (SSL
    certificates work with a well known public key). Common JWT libraries all support
    signing. For more information about JWT libraries, see the following website:


    ```

    https://jwt.io/#libraries-io

    ```

