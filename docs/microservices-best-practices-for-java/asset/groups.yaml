    # Comments welcome


    Your comments are important to us!

    We want our books to be as helpful as possible.


    # Overview


    Application architecture patterns are changing in the era of cloud computing.
    The convergence of factors has led to the concept of "cloud native" applications:


    This chapter provides a brief overview of the concepts and motivations that surround:

    - Cloud native applications

    - Twelve factors

    - Microservices

    - Philosophy and team structure

    - Examples


    ## 1.1 Cloud native applications


    Cloud computing environments are dynamic, with on-demand allocation and release
    of resources. This elastic environment enables more flexible scaling options,
    especially compared to the up-front resource allocation used by on premises data
    centers.


    According to Cloud Native Foundation, cloud native systems have the following
    properties:


    - Applications or processes are run in software containers as isolated units.

    - Processes are managed by using central orchestration to improve utilization
    and reduce maintenance.

    - Applications or services (microservices) are loosely coupled with explicitly
    defined dependencies.


    Taken together, these attributes describe a highly dynamic system composed of
    many independent processes working to provide business value: a distributed system.


    For more information, see the Cloud Native Foundation (CNCF) Charter at:

    https://cncf.io/about/charter


    Distributed computing is a concept with roots that stretch back decades. The eight
    fallacies of distributed computing were drafted in 1994, and deserve a mention:


    1. The network is reliable.

    2. Latency is zero.

    3. Bandwidth is infinite.

    4. The network is secure.

    5. Topology doesn''t change.

    6. There is one administrator.

    7. Transport cost is zero.

    8. The network is homogeneous.


    Taking the fallacies into account, something becomes clear: Cloud native applications
    run in an environment of constant, unpredictable change, and must expect failures
    to occur at any time. For more information about the fallacies, see Fallacies
    of Distributed Computing Explained, available at:

    http://www.rgos.com/Files/fallacies.pdf


    ## 1.2 Twelve factors


    The 12-factor application methodology mentioned in the twelve-factors are not
    specific to cloud provider, platform, or language. The factors represent a set
    of guidelines or best practices for portable, resilient applications that thrive
    in cloud environments (specifically software as a service applications). The following
    are the 12 factors in brief:


    - There should be the one-to-one association between a versioned codebase (for,
    an IT repository) and a deployed service. The same codebase is used for many deployments.

    - Services should explicitly declare all dependencies, and should not rely on
    the presence of system-level tools or libraries.

