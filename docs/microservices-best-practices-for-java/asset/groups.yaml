    - 3. Configuration varies between deployment environments should be stored in
    the environment (specifically in environment variables).


    - 4. All backing services are treated as attached resources, which are managed
    (attached and detached) by the execution environment.


    - 5. The delivery pipeline should have strictly separate stages: Build, release,
    and run.


    - 6. Applications should be deployed as one or more stateless processes. Specifically,
    transient processes must be stateless and share nothing. Persisted data should
    be stored in an appropriate backing service.


    - 7. Self-contained services should make themselves available to other services
    by listening on a specific port.


    - 8. Concurrency is achieved by scaling individual processes (horizontal scaling).


    - 9. Processes must be disposable: Fast startup and graceful shutdowns lead to
    a more robust and resilient system.


    - 10. All environments, from local development to production, should be as similar
    as possible.


    - 11. Applications should produce logs as event streams (for example, writing
    to stdout and stderr), and trust the execution environment to aggregate streams.


    - 12. If admin tasks are needed, they should be kept in control and managed alongside
    the application to ensure that it runs with the same environment as the application.


    These factors do not have to be strictly followed to achieve a good microservice
    environment. However, keeping them in mind allows you to build portable applications
    or services that can be built and maintained in continuous delivery environments.


    For more information about the 12 factors, The Twelve-Factor App by Adam Wiggins,
    available at:


    ```

    http://12factor.com

    ```


    ## 1.3 Microservices


    Although there is no standard definition for microservices, most reference Martin
    Fowler''s seminal paper. The paper explains that microservices are used to compose
    complex applications by using small, independent (autonomous), replaceable processes
    that communicate by lightweight APIs that do not depend on language.


    For more information, "Microservices: A new architectural term" by Martin Fowler,
    which is available at:


    ```

    http://martinfowler.com/articles/microservices.html

    ```


    Each microservice in the simple example that is shown in Figure 1-1 is a 12-factor
    application, with replaceable backing services providing a message broker, service
    registry, and independent data stores. For more information, see 1.2, “Twelve
    factors” on page 2.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_17_0.png)


    ### 1.3.1 The meaning of “small"


    Many descriptions make parallels between the roles of individual microservices
    and chained commands on the UNIX command line:

    $ | ls ‘service’ | sort -r


    These UNIX commands each do different. You can use the commands without awareness
    of what language the commands are written in, or how large their codebases are.


    The size of a microservice is not related to the number of lines of code. Instead,
    it describes its scope. The use of the word “small”, as applied to a microservice,
    essentially means that it is focused in purpose. The microservice should do one
    thing, and that do one thing well.


    Strategies for defining the scope of a service are discussed in detail in Chapter
    2, “Creating Microservices in Java” on page 9.


    ### 1.3.2 Independence and autonomy


    The emotion and passion that accompany a gas roots push for creating microservices
    can be viewed as a mutiny against monolithic architectures. This trend is due
    to a broad range of reasons, including these:


    - Inrequent


    In these environments, change cannot be made without significant risk because
    everything is interrelated with everything else. It is the opposite of an agile
    ecosystem.


    A dominant factor in creating and preserving agility is ensuring each service
    is independent and autonomous. Each service must be capable of being started,
    stopped, or replaced at any time without tight coupling to other services. Many
    other characteristics of microservice architectures follow from this single factor.


    Microservices act as encapsulations (or bounded contexts), as discussed in Chapter
    2, "Creating Microservices in Java" on page 9 guarding the implementation details
    of the application. This configuration allows the service''s implementation to
    be revised and improved (or even rewritten) over time. Data sources, especially,
    must be private to the service, as described in Chapter 5, "Handling data" on
    page 41.


    If deploying changes requires simultaneous or sensitive updates to multiple services,
    you are doing it wrong. There might be good, pragmatic, reasons behind needing
    these updates, but it should prompt a review of the relationships between your
    services. There are a few options:


    - You need to revisit your strategy to preserve the independent lifecycle of services.


    - The current service boundaries are not drawn properly, and services should be
    refactored into independent pieces.


    Refactoring services will happen, especially when creating an application from
    scratch. Identifying services is described more in Chapter 2, "Creating Microservices
    in Java" on page 9, but it is a given that you will get things wrong. The ability
    to recognize and refactor services as problems is a benefit of the microservices
    approach.


    ## A quick note about polyglot and language-agnostic protocols


