    # 8.1 Deployment patterns


    A traditional monolith is built and deployed as one unit. A deployment monolith
    is built of many parts, many individual Java Platform, Enterprise Edition archives,
    for example, that are combined into one deployed artifact. Microservices, by contrast,
    are many different pieces that are all deployed independently. This configuration
    provides more flexibility in how consumers are exposed to service changes:


    +   - Blue/Green Deployment


    Blue/Green deployments are a common pattern for monoliths. The key aspect of this
    approach is that you are maintaining two versions of your environment that one
    can be used as a rollback to the other if a deployment failure occurs. The process
    goes something like this:


    +   a. You have a Blue system that is active and running.

    b. You set up the Green system, test it, verify it is working properly, and then
    switch traffic to the Green system. The Blue system is left alone as a rollback
    if something fails as traffic moves to the Green system.

    c. After the Green system is stable, the Blue system is prepared with the next
    outing, and the process is repeated to switch from the Green system back to the
    Blue system.


    In the microservices context, this replicated environment still applies. Each
    system (Blue and Green) contains all of your microservices running with stable
    versions in a configuration that works. Periodic, coordinated updates of otherwise
    uncoupled services can be managed this way, with updates getting and stabilized
    with each other into a known system that is enabled (or disabled) as a set.


    +   - Canary Releasing


    Canary releases are also known as phased or incremental rollout. A canary release
    aims to discover and confirm fault when deploying a new service. Just as Blue/Green
    deployments, canary releases start with a duplicated environment. After the new
    function is introduced into one of the two systems, traffic is gradually (and
    selectively) routed to the new function to ensure it behaves and performs as expected.


    +   - Toggling


    Feature toggles are flags that are used inside the service to enable or disable
    new function. This process can be effectively used to allow service customers
    to opt in testing new function (perusing custom HTTP headers) without having maintaining
    different versions of the service or engineer coordinated releases. Toggling is
    common in monolithic environments, too, as to prevent behavior changes from impacting
    customers.


    Toggles can be set in the environment such that a service has either the function
    enabled or does not. They can be dynamic configuration settings that act as a
    binary mode for the service, or they can be combined with per request mechanisms
    like HTTP headers to turn new functions on or off per request.


    Toggles can be used to make decisions, which allows them to be a selector for
    service-centric canary releases. They can also be used for A/B testing, where
    you are trying to make a side-by-side comparison of alternative implementations.'
  - '[PAGE 104]


    # 8.2 Deployment pipelines and tools


    One of the benefits of microservice architectures is agility. Because each individual
    service has a focused scope and an independent lifecycle, it takes less time to
    implement a new feature as a microservice, test it, and deploy it into production.
    Microservices are often built iteratively, which means supporting the notion of
    continuous integration and deployment.


    Deployment artifacts run on different systems, so many systems must be configured
    to make the services work. The more manual steps there are for deploying a microservice
    into production, the more likely it is that unexpected problems will arise due
    to bad typing or forgotten steps. Human intervention should be reduced to a minimum.
    For example, manual approvals might be required before a new version of a service
    can be released into production for regulatory reasons. However, everything leading
    up to, and from that, can be automated.


    Deployment pipelines as described by Martin Fowler are used as a part of a Continuous
    Deployment environment. They describe and define a set of steps to get microservices
    into production, by breaking the process into stages that cover building, deploying,
    and testing the service in each stage to verify that all is well. It is helpful
    to use DevOps technologies to simplify the creation of a Deployment pipeline and
    related tool to support applications from development to production. For more
    information about DevOps technologies, see this:


    http://blog.xebialabs.com/2015/07/20/xebialabs-launches-the-periodic-table-of-devo-tools/


    As mentioned, the source for your microservices be in a Source Code Management
    (SCM) tool like Subversion or Git. It should be built with a tool that has dependency
    management like Maven or Gradle. Choose one of the repository management tools
    (such as Nexus or Artifactory) to store versioned binary files of your shared
    libraries. Build your services using one of the CI-Tools like Jenkins or Bamboo.


    After the automated build of the microservice testing must be done, and for some
    of that you need to deploy the microservice, which means you need the correct
    configurations placed on your automatically provisioned system. You can use classic
    scripting to configure the targets correctly, but you must then manage platform
    or other system differences in the scripts. Scripting frameworks/infrastructure
    like Chef, Puppet, Ansible, and Salt can handle this much better. They can all
    be used the same way for initial installation and modification of an existing
    system. Define the target content of the configuration files, and these deal with
    the difference if there are changes on the target system.


    +   1 http://martinfowler.com/bliki/DeploymentPipeline.html

    2 http://martinfowler.com/bliki/ContinuousDelivery.html

    3 http://subversion.apache.org/

    4 http://git-scm.com/

    5 http://maven.apache.org/

    6 http://gradle.org/

    7 http://www.sonatype.org/nexus/

    8 http://www.jrog.com/artifactory/

    9 http://jenkins.io/

    10 http://www.atlassian.com/software/bamboo

    11 http://www.chef.io/

    12 http://puppet.com/

    13 http://www.ansible.com/

    14 http://saltstack.com/'
  - '[PAGE 105]


    Containerization can also help you to get a correctly configured system. For dynamic
    provisioning, you can use Cloud hosting infrastructure as a service (IaaS) or
    platform as a service (PaaS). Due to the high number of microservices in your
    system, it is good to have a tool to help with Release Management. All of these
    deployed systems must be monitored (see Chapter 9, "Management and Operations"
    on page 107). Logs must also be gathered for auditing and diagnostic purposes
    (see 9.2, "Logging" on page 111). Last, but not least, security holes in your
    microservice should be found, as detailed in Chapter 6, "Application Security"
    on page 67.


    It is essential that the build steps to create the microservice are done with
    a tool that can also manage dependencies of JAR files. Maven and Gradle are the
    best choice to do so. In both systems, you can list the JAR files to build your
    microservice to ensure that every build of a service leads to an immutable software
    artifact. Generally, there is a distinct version or revision indicator for every
    build result of a microservice to make clear which version of the service is deployed.
    This can be achieved with Maven or Gradle. The version of the service should not
    be confused with a semantic API version; it determines which version of the codebase
    is running.


    A sample view of build pipeline "The Pipeline View" used in Jenkins (CI server)
    is shown at:


    ```

    http://wiki.jenkins-ci.org/display/JENKINS/Build+Pipeline+Plugin

    ```


    As you can see in the sample view, versions of the same application are running
    in parallel through the pipeline. The different rectangles show the deployment
    stage of this software on the stages.


    Templates of microservices (9.3, "Templating" on page 113) can help to develop
    microservices that need the same implementations for the supporting systems access.
    Logging, for example, is necessary in a system of microservices, and is also helpful
    to track the requests between microservices. If every development team of a service
    does its own logging and also uses its own format, it can be difficult to join
    the log files of the different services. Security is also a requirement that must
    be developed to central specifications. Templates can codify common concerns,
    and turn them into conventions that are easy to follow. However, if developers
    restricted by these templates, they will ignore or get rid of them. Balance the
    effort spent building templates with the value they bring to the developers who
    are writing services.


    # 8.3 Packaging options


    The next question, after building the microservice, is what packaging format should
    be used to deploy the application. A recurring theme in both the twelve factors
    and the definition of cloud native applications is the creation of immutable artifacts
    that can be run without change across different deployment environments.


    The more things change from deployment to deployment, the greater the risk that
    something will break in unexpected ways, due to misconfiguration, missing dependencies,
    and so on. Building immutable, self-contained artifacts introduces more consistency
    between development and production environments, and reduces the likelihood of
    deployment time surprises.'
- md: "\nThe following packaging options are available, among others:\n\n- WAR/EAR\
    \ file deployment on preinstalled middleware\n- Executable JAR file\n- Containers\n\
    - Every microservice on its own virtualized server\n\nIn general, you want to\
    \ minimize differences between the environment in which the service is developed\
    \ and tested, and the environment in which it runs. Some packaging and deployment\
    \ choices make it easier to achieve parity between development and production\
    \ environments than others. The following sections explore the pros and cons of\
    \ each packaging option.\n\n## 8.3.1 JAR, WAR, and EAR file deployment on preinstalled\
    \ middleware\n\nThis variant of packaging is the default way for deploying Java\
    \ EE applications, where WAR or EAR files are deployed to a dedicated system with\
    \ a preinstalled application server. In traditional environments, many EARs and\
    \ WARs are deployed to the same running server, with deployments batched per week,\
    \ month, or even longer time frames.\n\nOn the way from development to production,\
    \ the application gets hosted in different application servers in staging environments\
    \ (such as quality assurance, performance test, and acceptance test). Every environment\
    \ should have the same configuration, this is not always the case. For example,\
    \ a production system might use a more conservative approach to upgrades than\
    \ development or test systems.\n\nThe following problems can arise from this approach:\n\
    \n- Frequent deployments in a shorter time period (day, hour) can be achieved.\
    \ For example, some application deployments need a restart of the application\
    \ server and as a consequence interrupt the other applications on the same application\
    \ server. This interruption often cannot be daily or even hourly.\n- If different\
    \ applications are hosted together on the same application server, the load from\
    \ one application can interfere with the performance of the other application.\n\
    - High variations in the load of an application cannot easily be adopted in the\
    \ infrastructure.\n- Different stages might not have the same configuration, which\
    \ can lead to application problems in one stage that cannot be reproduced in the\
    \ other stage.\n- Separated responsibilities often lead to a discussion between\
    \ developer and administrator to find a \"guilty\" when deployment problems arise.\n\
    \nIf this pattern is used with microservices, the relationship should be one-to-one\
    \ between the service and the preinstalled middleware server. This configuration\
    \ is common, for example, in PaaS environments, where you push the WAR or EAR\
    \ to a freshly predefined server. It can also apply to cases where application\
    \ instances are provisioned by tools like Chef or Puppet, with the WAR or EAR\
    \ afterwards. Isolation of services into their own middleware instances is important\
    \ to allow services to scale independently, and to reduce the risk of service\
    \ updates interfering with each other.\n\nAs mentioned, this approach has a deployment\
    \ risk if services are isolated because the service still relies on the preinstalled\
    \ middleware to supply all of the dependencies that it requires. However, because\
    \ it mirrors much of the traditional monolith application experience, it can be\
    \ an easy first step when starting a new microservices application.\n\nChapter\
    \ 8. From development to production 93\n\n## 8.3.2 Executable JAR file\n\nOne\
    \ way to avoid depending on the deployment environment is to pack everything that\
    \ is needed to run the service inside an executable JAR file. These fat uber JAR\
    \ files contain the service class files and supporting shared libraries, including\
    \ servlet containers or other Java EE middleware. This technique eliminates problems\
    \ introduced by dependency mismatches between development and test or production\
    \ environments.\n\nThese self-contained JAR files are generally easy to handle,\
    \ and help create a consistent, reproducible environment for local development\
    \ and test in addition to target deployment environments.\n\nAs mentioned in 2.1,\
    \ \"Java platforms and programming models\" on page 10, there are various programming\
    \ models available that produce stand-alone executable JAR files.\n\n### Spring\
    \ Boot\n\nThe executable JAR files produced by Spring Boot¹⁵ contain a Spring\
    \ application, its dependent JAR files, and an underlying web application run\
    \ time (Tomcat¹⁶, Jetty¹⁷, Undertow¹⁸). Most of the application configuration\
    \ is automatically done by Spring itself and can be changed from outside the application.\
    \ Additional functions for production support, like metrics and health checks,\
    \ are also included in this package.\n\nThere is a quick and easy way to get started.\
    \ First, build a simple project, the maven file shown in Example 8-1.\n\nExample\
    \ 8-1 Spring Boot Maven Start\n\n```\n<parent>\n  <dependency>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-starter-parent</artifactId>\n    <version>1.4.1.RELEASE</version>\n\
    \  </dependency>\n</parent>\n<dependencies>\n  <dependency>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-starter-web</artifactId>\n  </dependency>\n</dependencies>\n\
    ```\n\nYou must implement a Controller to respond to the HTTP requests that is\
    \ started by SpringApplication (Example 8-2).\n\nExample 8-2 Spring Boot Controller\n\
    \n```\n@Controller\n@EnableAutoConfiguration\npublic class MyController {\n  @RequestMapping(\"\
    /myservice\")\n  @ResponseBody\n  public String sayHello() {\n    return \"Greetings\
    \ from Spring Boot!\";\n  }\n}\npublic static void main(String[] args) throws\
    \ Exception {\n    SpringApplication.run(MyController.class, args);\n}\n```\n\n\
    > 15 https://projects.springframework.io/spring-boot/\n> 16 http://tomcat.apache.org/\n\
    > 17 http://www.eclipse.org/jetty/\n> 18 http://undertow.io/\n\nThe dependency\
    \ management of the JAR files of the application can be done with Maven or Gradle.\
    \ Configuration follows the \"Convention over Configuration\" 19th method. An\
    \ auto-configuration scans for included JAR files in the application and provides\
    \ a default behavior to these Spring modules. This process can also be done by\
    \ overwrite the default behavior. The application should be implemented with frameworks\
    \ from the Spring ecosystem to get the most from Spring Boot.\n\nMicroservices\
    \ built and packaged by Spring Boot have everything they need to run as 12-factors\
    \ across different deployment environments. Spring Cloud, another set of packages\
    \ from the Spring ecosystem, provides an additional collection of integrations\
    \ between third-party technologies and the Spring programming model to support\
    \ using Spring Boot applications in cloud environments. For example, Spring Cloud\
    \ Configuration supports injecting application configuration from external configuration\
    \ sources in support of immutable application artifacts and Spring Cloud Netflix\
    \ provides language bindings and libraries to easily build microservice applications\
    \ using the popular Netflix OpenSource Software.\n\n### Dropwizard\n\nDropwizard\
    \ produces stand-alone JAR files by using a preselected stack that enhances an\
    \ embedded servlet container with extra capabilities.\n\n### Wildly Swarm\n\n\
    WildlySwarm20 packages the application and the set of Wildly server21 the application\
    \ needs into the executable JAR file. Microservices produced with Wildly swarm\
    \ can use a wider set of pre-packaged Java EE technologies, rather than starting\
    \ from a servlet engine and having to gather and assemble rest.\n\n### WebSphere\
    \ Liberty\n\nIBM WebSphere Liberty can produce immutable executable files containing\
    \ only the technologies the application needs. The packaging tool of Liberty can\
    \ combine the following elements:\n\n- A customized (minimal) Liberty run time\n\
    - Java applications packaged as a WAR file or EAR file (usually only one)\n- Supporting\
    \ configuration like shared libraries, JNDI values, or data source configurations\n\
    \nLiberty has sensible defaults, requiring configuration only for customized elements\
    \ with ample support for injected configuration. Liberty is able to interpret\
    \ environment variables, which can eliminate startup scripts that preprocess files\
    \ to insert environment-specific values. For example, a data source can be defined\
    \ in server.xml as shown in Example 3.\n\nExample 3. Configuring a data store\
    \ by using environment variables\n\n```\n<couchdb id=\"couchdb\" jndi=\"couchdb-connector\"\
    \nlibraryRef=\"couchdb-lib\">\n```\n\n> 19 https://en.wikipedia.org/wiki/Configuration_over_configuration\n\
    > 20 http://wildly-swarm.io/\n> 21 http://wildly.org/\n"
  mdcn: "\n\n可选以下打包方案，但不限于：\n\n-   在预装的中间件上部署 WAR/EAR 文件\n-   可执行 JAR 文件\n-   容器\n\
    -   每个微服务都运行在自己的虚拟化服务器上\n\n通常情况下，你希望尽可能减少服务开发、测试环境与运行环境之间的差异。某些打包和部署方案比其他方案更容易实现开发环境与生产环境的一致性。接下来的章节将探讨每种打包方案的优缺点。\n\
    \n## 8.3.1 在预装的中间件上部署 JAR、WAR 和 EAR 文件\n\n这种打包方式是部署 Java EE 应用程序的默认方式，其中将 WAR\
    \ 或 EAR 文件部署到预装了应用服务器的专用系统中。在传统环境中，许多 EAR 和 WAR 被部署在同一台运行的服务器上，并按周、月甚至更长的时间周期进行批量部署。\n\
    \n在从开发到生产的过程中，应用程序会在分阶段环境（如质量保证、性能测试和验收测试）中的不同应用程序服务器中托管。每个环境都应该具有相同的配置，但并非总是如此。例如，生产系统在升级方面可能采用比开发或测试系统更保守的方法。\n\
    \n这种方法可能会产生以下问题：\n\n-   可以在更短的时间内（天、小时）实现更频繁的部署。例如，某些应用程序的部署需要重启应用服务器，从而中断同一应用服务器上的其他应用程序。这种中断通常无法每天甚至每小时发生一次。\n\
    -   如果不同的应用程序共同托管在同一台应用服务器上，一个应用程序的负载可能会干扰另一个应用程序的性能。\n-   应用程序负载的高波动很难在基础设施中被良好地纳。\n\
    -   不同阶段的配置可能不同，这可能导致某个阶段的应用程序问题在另一个阶段中无法复现。\n-   职责分离通常会导致在出现部署问题时，开发者和管理员之间进行讨论以寻找“替责任人”。\n\
    \n如果在微服务中使用这种模式，则服务与预装的中间件服务器之间应该是一一对应的的关系。这种配置很常见，例如在 PaaS 环境中，你将 WAR 或 EAR 推送到一个全新的、预定义的服务器上。它也适用于通过\
    \ Chef 或 Puppet 等工具配置应用程序实例，随后放置 WAR 或 EAR 的情况。将服务隔离在它们自己的中间件实例中是非常重要的，这允许服务进行独立扩展，并降低服务更新相互干扰的风险。\n\
    \n如所述，如果服务是隔离的，这种方法存在部署风险，因为服务仍然依赖预装的中间件来提供其所需的所有依赖项。然而，因为它镜像了许多传统的单体应用程序体验，它可以作为启动新微服务应用程序的简单第一步。\n\
    \n第 8 章，从开发到生产 93\n\n## 8.3.2 可执行 JAR 文件\n\n避免依赖部署环境的一种方法是将运行服务所需的所有内容封装在一个可执行的\
    \ JAR 文件中。这些“胖型”（fat）uber JAR 文件包含了服务的类文件和辅助共享库，包括 servlet 容器或其他 Java EE 中间件。这种技术消除了由于开发、测试或生产环境之间依赖不匹配而引起的问题。\n\
    \n这些自包含的 JAR 文件通常很容易处理，除了目标部署环境外，还有助于为本地开发和测试创建一个一致、可重复的环境。\n\n正如第 10 页 2.1 节“Java\
