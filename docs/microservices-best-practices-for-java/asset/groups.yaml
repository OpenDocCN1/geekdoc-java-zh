    在决定如何通过多个独立部分的组合来构建应用程序时，这非常有帮助。

    在接下来的章节中，将都会引用在线零售商店和 Game On!，以解释为什么这些概念对于长期开发和维护微服务架构很有用。


    ## 2.3.1 应用领域驱动设计原则


    在领域驱动设计中，领域（domain）是一个特定的知识或活动领域。模型是领域中重要层面的抽象，随着对变化理解的演进而逐渐产生。该模型用于构建解决方案以及进行跨团队通信。


    对于单体系统，单一统一的领域模型适用于整个应用程序。如果应用程序保持相对简单，这种应用程序概念就是行的。但当应用程序的不同部分以不同的方式使用公共元素时，单一统一模型就会失效。


    例如，在线零售商店中的目录（Catalog）服务专注于待售商品，包括描述、部件号、产品信息、图片等。

    相比之下，订单（Order）服务关注的是发票，商品仅以最小化的方式表示，可能只包含部件号、摘要和计算后的价格。


    边界上下文（Bounded contexts）允许领域被划分为独立的子系统。每个边界上下文都可以针对领域关注点拥有自己的模型。继续上面的例子，目录和订单服务都可以对商品有独立的表示，以符合其服务的需求。这种系统通常运行得很好，但考虑到这两个服务对该概念有不同的表示方式，它们如何与其他服务共享信息呢？


    上下文映射（Context mapping），包括通用语言（ubiquitous language）的开发和使用，可以帮助确保负责各个服务的团队理解大局是如何整合在一起的。在为微服务架构进行领域建模时，在识别组成系统的部分时，不要陷入类或接口级别是至关重要的。在第一轮处理中，保持在层层、粗粒度的水平。允许负责各个服务的独立团队在自己的边界上下文中扩展细节。


    ## Game On! 中的通用语言


    为了给语言的重要性举一个具体的例子，我们稍作介绍一下 Game On!。游戏的构建目的是为了让开发者能够更方便地亲手实验微服务，它将快速的“Hello World”带来的即时反馈与对微服务架构更复杂层面的不同思考方式结合在一起。这是一款基于文本的冒险游戏，开发者可以在其中添加自己的独立服务（房间）来扩展游戏。


    该游戏的原始比喻类似于酒店，包含三个基本元素：


    - 玩家（Player）服务，用于处理所有与游戏玩家相关的事务

    - 初始房间（Room）服务，作为开发者将构建内容的占位符

    - 一个名为“宾家”（Concierge）的额外服务，其原始目的是帮助玩家从一个房间过渡到另一个房间


    在让系统的这三个部分随时间推演进后，发现开发游戏的不同人员对宾家应该做什么有不同的解释。宾家无法作为一种比喻发挥作用，因为太太模糊了。


    宾家被一个新的地图（Map）服务取代了。地图是游戏中房间位置的终极事实来源（source of truth），仅从名称就能清晰地理解。


    ## 2.3.2 将领域元素转换为服务


    领域模型包含几种定义良好的类型：


    - 实体（Entity）是一个具有固定标识和定义良好的“连续性线程”或生命周期的对象。引用的例子是人（Person）（一个实体）。大多数系统都需要无论名称、地址或其他属性，都要唯一地跟踪一个“人”。

    - 值对象（Value Objects）没有定义良好的标识，而是通过其属性来定义。它们通常是不可变的，以便两个值对象随时间推移保持相等。地址（Address）可以是与人关联的值对象。

    - 聚合（Aggregate）是一组被视为单元处理的相关对象的集合。它有一个特定的实体作为根节点，并为封装定义了清晰的边界。它不仅仅是一个列表。

    - 服务（Services）用于表示不是实体或值对象的自然组成部分的操作或活动。


    ## Game On! 中的领域元素


    正如 1.3.1 节提到的“第 4 页上‘小’的含义”，游戏是围绕玩家（Player）这一概念构建的，这是一个显而易见的实体。玩家拥有固定的 ID，只要账户存在，他们就存在。玩家实体有一组值对象，包括玩家名称、喜好颜色和位置。


    游戏的另一个重要元素房间（rooms）并没有明显映射为实体。由于，房间属性会随时间以各种方式变化。这些可变化的属性由一个值对象表示，该对象包含房间名称、入口描述及其公共端点。此外，房间在地图上的位置可能会随时间改变。如果你将每个可能的房间视为一个站点（Site），你就会得到一个地图是由唯一站点实体构成的聚合，其中每个站点都关联着可变化的属性。


    ## 将领域元素映射为服务


    可以通过遵循以下几个通用指南将领域元素转换为微服务：


    - 使用值对象的表示作为参数和返回值，将聚合和实体转换为独立的微服务。

    - 将领域服务（那些未附着于聚合或实体的服务）与独立的微服务对齐。

    - 每个微服务应该处理单一的完整业务功能。


    本节通过将这些指南应用于上述 Game! 中列出的领域元素来探索这一过程，如图 2-1 所示。


    玩家服务提供资源 API³ 来处理玩家实体。除了标准的创建、读取、更新和删除操作外，玩家 API 还提供了生成用户名和喜好颜色的额外操作。


    地图服务提供资源 API⁴ 来处理站点实体，允许开发者管理位置。地图提供了边界上下文内站点的创建、更新和删除操作。


    游戏的一些额外服务尚未讨论：


    - 调解（Mediator）：调解是一个其唯一职责是协调这些连接的服务：

    - 客户端与调解之间的运行连接

    - 调解与目标房间服务之间的另一个连接

    从建模的角度来看，调解是一个领域服务。


    - 房间：单个服务怎么办？由开发者自行建立。为了建模目的，请将房间视为外部参与者。


    ³ https://game-on.org/swagger/1/players Game On! Player API

    ⁴ https://game-on.org/swagger/1/map Game On! Map API


    ## 2.3.3 应用和服务结构


    单体 Java EE 应用通常分层（客户端、Web、业务和数据），应用服务器托管 Web 归包（WAR 文件）、企业归包（EAR 文件）或两者，用于应用程序的不同部分，如图
    2-2 左侧所示。当应用程序不同部分的 JSP、JSF、servlet 和 EJB 部署在同一服务器上时，命名和打包规范变得非常重要。公共数据存储提供了数据表示的一致性，但对数据的表示和存储产生了限制。


    图 2-2 作为单体或微服务的订单和目录服务


    微服务架构可能具有这些应用层，但每层的元素可能由运行在独立进程中的独立服务提供，如图 2-2 右侧所示。注意这些细节：


    - 后端前端模式通常用于为特定的前端提供特殊功能，例如针对特定设备的优化或为 Web 应用程序提供额外功能。


    - 尽管每个服务拥有自己的数据存储，但请记住数据存储仍然是一个独立的服务。


    并不是所有微服务都具有所有这些元素。例如，后端使用 JSP 或 JSF 或类似 PHP 的解释型脚本的应用程序。它们可以被认为是“后端前端”，特别是当它们与浏览器中运行的
    JavaScript 有紧密关系时。然而，在写作期间，并没有使用后端前端模式。JavaScript 单页应用程序从独立服务中作为一组静态资源提供。应用程序随后在浏览器中运行，并直接调用后端
    API。

