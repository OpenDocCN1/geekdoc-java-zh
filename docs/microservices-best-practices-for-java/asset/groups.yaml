    \ `TypedQuery`，你可以在生成结果对象后省略 Java 强制转换（参见参数 `Order.class`）。JPQL 中的参数通过名称（id）进行引用，这使得开发者来说更具可读性。`getSingleResult`\
    \ 方法确保数据库中只找到一行。如果 SQL 对应多行，则会抛出 `RuntimeException`。\n\n`merge` 方法在数据库中执行更新（示例\
    \ 5-7）。参数是一个离散对象（detached object），意味着它不在持久化上下文中。在数据库更新后，`EntityManager` 会返回一个关联的（attached）order\
    \ 对象（它现在是持久化上下文的一部分）。\n\n## 示例 5-7 JPA 更新操作\n\n```java\npublic Order updateOrder(Order\
    \ order, String newDesc) {\n    order.setDescription(newDesc);\n    em.merge(order);\n\
    }\n```\n\n要删除数据库中的某行，你需要一个关联对象（示例 5-8）。为了将对象关联到持久化上下文中，你可以先查找它。如果对象已经关联，则不需要使用\
    \ `find` 方法。带有关联对象持久化的 `remove` 方法会删除数据库中的该对象。\n\n## 示例 5-8 JPA 删除操作\n\n```java\n\
    public void removeOrder(Long orderId) {\n    Order order = em.find(Order.class,\
    \ orderId);\n    em.remove(order);\n}\n```\n\n如之前，必须使用某些配置来告诉持久化提供程序去哪里查找数据库以及如何与数据库交互。这是在\
    \ `persistence.xml` 配置文件中完成的。该配置文件需要在服务的类路径（classpath）中。根据你的环境（是否为 Java 容器），配置必须通过两种方式之一完成（示例\
    \ 5-9）。\n\n## 示例 5-9 Java SE 环境下的 Persistence.xml\n\n```xml\n<persistence>\n \
    \ <persistence-unit name=\"OrderDB\">\n    <transaction-type type=\"RESOURCE_LOCAL\"\
    >\n    <class>com.service.Order</class>\n    <properties>\n      <!-- Properties\
    \ to configure the persistence provider -->\n    </properties>\n  </persistence-unit>\n\
    </persistence>\n```\n\n```xml\n<property name=\"javax.persistence.jdbc.url\" value=\"\
    jdbc-url-of-database\" />\n<property name=\"javax.persistence.jdbc.user\" value=\"\
    user\" />\n<property name=\"javax.persistence.jdbc.password\" value=\"password\"\
    \ />\n<property name=\"javax.persistence.jdbc.driver\" value=\"DriverClass\" />\n\
    </properties>\n</persistence-unit>\n</persistence>\n```\n\n要配置持久化提供程序，必须要做的工作是定义持久化单元（OrderDB）。持久化单元的一个属性是\
    \ `transaction-type`。可以设置两个值：`RESOURCE_LOCAL` 和 `JTA`。第一种选项让开发者负责在代码中进行事务处理。如果你的环境中没有可用的事务管理器，请使用此选项。第二个选项是\
    \ `JTA`，代表 Java Transaction API（Java 事务 API），属于 Java 社区进程（JCP）。该选项允许持久化提供程序将事务处理委托给运行时环境中存在的事务管理器。\n\
    \n通过 `<class></class>` XML 标签，你可以列出在此持久化单元中使用的实体类。\n\n在文件的属性中，你可以设置值来配置持久化提供程序如何与数据库交互。以\
    \ `javax.persistence.*` 开头的属性名称由 JPA 标准定义。第 53 页的示例 5-9 显示了如何设置数据库 URL（用于数据库连接）以及用户和密码。`javax.persistence.jdbc.driver`\
    \ 属性告诉持久化提供程序应该使用哪个 JDBC 驱动程序类。\n\nJava EE 环境配置文件的主要差异在示例 5-10 所示。\n\n```xml\n\
    <!-- Example 5-10 Java EE 环境下的 Persistence.xml\n<persistence>\n  <persistence-unit\
    \ name=\"OrderDB\">\n    <jta-data-source>jdbc:OrderDB</jta-data-source>\n   \
    \ <class>com.widgets.Order</class>\n  </persistence-unit>\n</persistence>\n```\n\
    \nJPA 的默认事务处理是使用 JTA，因此你不需要在配置文件中设置它。`jta-data-source` 属性指向你 Java EE 环境应用程序服务器中配置的数据源的\
    \ JNDI 名称。\n\n在没有 Java EE 环境的情况下处理事务管理，`EntityManager` 具有一些如示例 5-11 所示的方法。\n\n\
    ```java\n// Example 5-11 无 Java EE 环境下的事务管理\nEntityManager emf = Persistence.createEntityManagerFactory(\"\
    OrderDB\");\n  EntityManager em = emf.createEntityManager();\n  EntityTransaction\
    \ tx = em.getTransaction();\n```\n\n```java\ntx.begin();\ntry {\n  em.persist(yourEntity);\n\
    \  em.merge(anotherEntity);\n  tx.commit();\n} finally {\n  if (tx.isActive())\
    \ {\n    tx.rollback();\n  }\n}\n```\n\n第 54 页的示例 5-11 显示了如何在没有 Java EE 环境的情况下使用事务管理。如果你不熟悉\
    \ JPA，最好参考文档。在没有 Java EE 环境的情况下处理事务管理，`EntityManager` 具有一些如示例 5-11 所示的方法。\n\n\
    54 Java 微服务最佳实践\n\n"
