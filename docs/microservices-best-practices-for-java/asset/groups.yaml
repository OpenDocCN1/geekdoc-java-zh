  - '[PAGE 77]


    You must use the @MessageDriven annotation to declare the EJB type as message-driven
    EJB. Within this annotation, you can set the name of the MDB and some activation
    configurations. The properties of the activation configuration tie the MDB to
    the JMS messaging system that handles the queues or topics. In an application
    server environment, where your MDB gets hosted, it is easy to configure these
    elements. The MDB implements a MessageListener interface that has only one method:
    onMessage. Every time the JMS provider has a message to process, it calls this
    method. The method is annotated with a transactional attribute to show that this
    method is called in a transaction. The default transaction attribute for an MDB
    is TransactionAttributeType.REQUIRED. Inside the method, the message object must
    be converted and the message can be extracted as a String. Message types are also
    possible.


    It is good to use the MDB for the message handling. Keep the MDB as a technical
    class. The rest of your business code should be implemented in a Java POJO that
    gets called by the MDB. This configuration makes business easier to test in your
    Units.


    As stated before, every MDB runs in a transaction, so no message gets lost. If
    an error occurs during the processing of the message and the EJB container, which
    handles the MDB, receives this runtime exception, then the message is redelivered
    to the MDB (error loop). The retry count, which can be configured in your JMS
    provider, shows how often this occurs. After the maximum number of retries, the
    message is normally put into an error queue. Messages in an error queue must be
    handled separately.


    If a business transaction spans more than one microservice, use an event-driven
    architecture (see 5.1.4, "Data sharing across microservices" on page 45). This
    means that the microservice sending the event must perform the following tasks:


    +   * Change data in its data store

    * Send the message to the second microservice


    The receiving microservice must perform these tasks:


    +   * Receive the message from the queue

    * Change data in its data store


    To be consistent, these two things must be in one transaction if the data store
    is transactional. This requirement is also true for the producer and the consumer
    side of the messaging system. In these cases, you must use a distributed transaction.
    The transaction partners are the data store and the JMS provider (not the two
    data stores of the microservices).


    To track the messages produced and consumed, it is useful to use a correlation
    ID. A correlation ID produced by the producer of the microservice correlates to
    the message consumed by the consumer. This correlation ID can also be used in
    the logging of the microservice to get the complete communication path of your
    microservices call (see 9.2, "Logging" on page 111).


    Java provides a class to generate a unique id: UUID. This can be used to generate
    a correlation ID. Example 5-24 shows setting correlation ID.


    Example 5-24 Setting correlation ID in a JMS message


    ```

    // JMSContext injected as after

    JMSProducer = jmsContext.createProducer();

    producer.setJMSCorrelationID(UUID.randomUUID().toString());

    producer.send(queue, message);

    ```'
