    is kept separate from the business logic. The disadvantage is that there is an
    extra piece of software to deploy and the microservice must be exposed to a health
    endpoint for the third party to poll.


    Using self-registration pulls the registration and heartbeat logic into the microservice
    itself. Using this method requires careful testing considerations. See Chapter
    7, "Testing" on page 77 for more information about separation of code. However,
    many service registry solutions provide a convenience library form registration,
    reducing the complexity of the code required.


    Generally, use a service registry provides a Java based library for registration
    and heartbeats. This configuration makes your services quicker to code and provide
    consistency across every microservice in the system (that is in Java). The following
    service registry solutions are available:


    +   - Consul

    https://www.consul.io/

    - Eureka

