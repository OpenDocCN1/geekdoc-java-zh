    ## 2.3.1 Applying domain-driven design principles


    In domain-driven design, a domain is a particular area of knowledge or activity.
    A model is an abstraction of important aspects of the domain that emerges over
    time, as the understanding of the changes evolves. This model is used to build
    the solution, for cross-team communications.


    With monolithic systems, a single unified domain model works for the entire application.
    This application concept works if the application remains fairly simple. Using
    a single unified model falls apart when different parts of your application use
    common elements in different ways.


    For example, the Catalog service in the Online Retail Store is focused on the
    items for

    sale, including descriptions, part numbers, product information, pictures, and
    so on.

    The Order service, by contrast, is focused on the invoice, with items represented
    minimally,

    perhaps only the part number, summary, and calculated price.


    Bounded contexts allow a domain to be subdivided into independent subsystems.
    Each

    bounded context can then have its own models for domain concerns. Continuing the
    above

    example, both the Catalog and Order services can have independent representations
    of

    items that fit the needs of their service. This system usually works great, but
    how do the

    two services share information with other services, given they have different
    representations

    for the concept?


    Context mapping, including the development and use of ubiquitous language, can
    help

    ensure that teams working on individual services understand how the big picture

    it fits together. In the case of modeling a domain for a microservices architecture,
    it is

    important not to get down to the class or interface level when identifying the
    pieces that

    comprise the system. For the first pass, keep things at a high, coarse level.
    Allow individual

    teams working on the individual services work their bounded contexts to expand
    on details.


    ## Ubiquitous language in Game On!


    To give a concrete example of the importance of language, we take a small detour
    into

    Game On! The game was built to make it easier for developers to experiment

    with microservices first hand, combining the instant gratification of a quick
    hello

    world with different ways to think about the more complex aspects of microservices

    architectures. It is a text-based adventure game in which developers add their
    own individual

    services (rooms) to extend the game.


    The original metaphor for the game was akin to a hotel, with three basic elements:


    - A Player service to deal with all things relating to game players

    - An initial Room service as a placeholder for what developers will build

    - An additional service called the Concierge, the original purpose of which was
    to help

    facilitate the transition of a player from room to room


    After letting these three pieces of the system evolve over time, it was discovered
    that different

    people working on the game had different interpretations of what the Concierge
    was

    supposed to do. The Concierge did not work as a metaphor because it was too ambiguous.


    The Concierge was replaced with a new Map service. The Map is the ultimate source
    of truth for where a room is located in the game, which is clearly understood
    from the name alone.


    ## 2.3.2 Translating domain elements into services


    Domain models contain a few well-defined types:


    - An Entity is an object with a fixed identity and a well-defined "thread of continuity"
    or lifecycle. An cited example is a Person (an Entity). Most systems need to track
    a Person uniquely, regardless of name, address, or other attributes.

    - Value Objects do not have a well-defined identity, but are instead defined only
    by their attributes. They are typically immutable so that two value objects remain
    equal over time. Address could be a value object that is associated with a Person.

    - An Aggregate is a cluster of related objects that are treated as a unit. It
    has a specific entity as its root, and defines a clear boundary for encapsulation.
    It is not just a list.

    - Services are used to represent operations or activities that are not natural
    parts of entities or value objects.


    ## Domain elements in Game On!


    As mentioned in 1.3.1, “The meaning of "small" on page 4, the game was built around
    the notion of a Player, an obvious Entity. Players have a fixed ID, and exist
    for as long as the player''s account does. The player entity has a set of value
    objects, including the player''s name, favorite color, and location.


    The other significant element of the game, rooms, do not map obviously to an Entity.
    For one thing, room attributes change in various ways over time. These changeable
    attributes are represented by a Value Object containing attributes like the room
    name, descriptions of its entrances, and its public endpoint. Further, the placement
    of rooms in the map can change over time. If you consider every possible room
    as a Site, you end up with the notion of a Map as an Aggregate of unique Site
    entities, where each Site is associated with changeable attributes.


    ## Mapping domain elements into services


    Converting domain elements into microservices can be done by following a few general
    guidelines:


    - Convert Aggregates and Entities into independent microservices, by using representations
    of Value Objects as parameters and return values.

    - Align Domain services (those not attached to an Aggregate or Entity) with independent
    microservices.

    - Each microservice should handle a single complete business function.


    This section explores this process by applying these guidelines to the domain
    elements listed above for Game!, as shown in Figure 2-1.


    The Player service provides the resource APIs³ to work with Player entities. In
    addition to standard create, read, update, and delete operations, the Player API
    provides additional operations for generating user names and favorite colors.


    The Map service provides the resource APIs⁴ to work with Site entities, allowing
    developers to manage the location. The Map provides create, update, and delete
    operations for Sites within the bounded context.


    Some additional services from the game have not been discussed:


    - Mediator: The Mediator is a service whose sole responsibility is mediating between
    these connections:

    - One running connection between the client and the Mediator.

    - Another connection between the Mediator and the target room service.

    From a modeling point of view, the Mediator is a domain service.


    - Rooms: What about individual services? Developers stand up their own. For modeling
    purposes, treat rooms as outside actors.


    ³ https://game-on.org/swagger/1/players Game On! Player API

    ⁴ https://game-on.org/swagger/1/map Game On! Map API


    ## 2.3.3 Application and service structure


    Monolithic Java EE applications are typically structured in tiers (client, web,
    business, and data), with long application servers hosting web archives (WAR files),
    enterprise archives (EAR files), or both for disparate parts of the application,
    as shown in the left side of Figure 2-2. Naming and packaging conventions become
    important as JSPs, JSFs, servlets, and EJBs for different parts of the application
    are deployed to the same server. Common data stores provide consistency for data
    representation, but also introduce constraints in how data can be represented
    and stored.


    Figure 2-2 Order and Catalog Services as monolithic or microservices


    A microservices architecture will likely have these application tiers, but the
    elements of each tier will likely be provided by independent services that run
    in independent processes, as shown in the right side of Figure 2-2. Note these
    details:


    - The backend-for-frontend pattern is commonly used to support specialized behavior
    for specific front ends, like optimizations for specific devices or providing
    additional capabilities in a web application.


    - Although each service owns its own data store, remember that the data store
    is still an independent service.


    Not all microservices will have all of these elements. For example, applications
    that use JSP or JSF, or interpreted scripts like PHP in the backend. They could
    be considered as "backend-for-frontend", especially if they have a close relationship
    with JavaScript running in the browser. One however, does not use the backend-for-frontend
    pattern (at the time of this writing). The JavaScript single page application
    is served as a set of static resources from an independent service. The application
    then runs in the browser, and calls backend APIs directly.

