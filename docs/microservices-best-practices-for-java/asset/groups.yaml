    \ does the Payment in its data store. If the Payment succeeds, then it publishes\
    \ an Approved event that is subscribed by the Order microservice. After processing\
    \ the Approved event, the state of the Order gets changed from Pending to Approved.\n\
    \nIn situations where the data is not available, the service can send out to the\
    \ client something like \"Sorry, please try again\".\n\n## Data replication\n\n\
    The separation of the data stores and the requirement to get data from different\
    \ stores can lead to the idea that data replication mechanisms would solve the\
