    # Creating Microservices in Java


    The prospect of creating an application composed of microservices raises some
    questions in any language:


    +   - How large should a microservice be?

    - What does the notion of focused services that do one thing mean for traditional
    centralized governance?

    - What does it do to traditional ways of modeling data?


    Some of these topics are covered in more depth in later chapters. This chapter
    focuses on how you identify and create the microservices that compose your app,
    with specific emphasis on how identified candidates are converted into RESTful
    APIs, and then implemented in Java.


    This chapter covers the following topics:


    +   - Java platforms and programming models

    - Versioned dependencies

    - Identifying services

    - Creating REST APIs'
