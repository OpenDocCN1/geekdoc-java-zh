    \ that can be used to generate the needed parts of a microservice.\n\nA microservice\
    \ template typically includes these common capabilities:\n\n+   * Communication\
    \ with Service Discovery to register a service instance\n* Communication with\
    \ other microservices\n* Communication with a messaging system\n* Logging\n* Security\n\
    \nYou get these benefits from a template having all these capabilities:\n\n+ \
