    \ two or more microservices, two or more data stores are involved in this business\
    \ transaction. This section describes how to implement these business transactions.\n\
    \n## Event-Driven architecture\n\nYou need a method to ensure the consistency\
    \ of the data involved in a business transaction that spans two or more microservices.\
    \ One way would be a distributed transaction, but there are many reasons why this\
    \ should not be in a microservice application. The main reason is the tight coupling\
