    #  8.3.3 Containerization


    The previous strategies are all running on an operating system that must be installed
    and configured with the executable JAR file. A strategy to avoid the problems
    resulting from inconsistently configured operating systems is to bring more of
    this operating system with you. This strategy leads to the situation that a microservice
    runs on an operating system with the same configuration on every stage.


    Containers are lightweight virtualization artifacts that are hosted on an existing
    operating system. Docker provides an infrastructure capability to build a complete
    file system that contains all elements (tools, libraries) of the operating system
    that are needed to run the application, including the application itself. Docker
    Engine is a lightweight run time that provides both the abstraction and isolation
    between Docker containers and the host, and the supporting tools to work with
    hosted containers. For more information about Docker, see this.


    http://www.docker.com


    Docker containers isolate applications from other applications (residing in peer
    containers) and also separates applications from the host''s operating system.
    Isolation of these containers and their lightweight attributes make it possible
    to run more than one Docker container on one operating system (see Figure 8-1).
    This configuration means that you need many virtualized servers to host your system
    of microservices.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_109_0.png)


    Figure 8-1 Multiple Docker containers on one server'
  - '[PAGE 110]


    Docker are immutable artifacts. When applications are built into Docker images,
    those images can then be used to start containers in different deployment environments,
    ensuring that the same stack is used across all environments. Using Docker makes
    the exact packaging format (executable JAR, WAR, EAR, ZIP file) irrelevant because
    the image configuration determines how a container is started. Configuration values
    for the microservice inside a container can be provided either by using environment
    variables or mounted volumes.


    Data stores and all other backends should not be hosted in the same container
    as the microservice itself, as mentioned in the 12 factors. These backends should
    be treated as services, which is an essential characteristic of a microservice.
    Data stores, for example, can also be managed as Docker containers. For failover
    reasons, you should not host multiple instances of the microservice on the same
    host.


    # 8.3.4 Every microservice on its own server


    Another alternative to keep the operating system as identical as possible across
    all stages is to use the same virtualized server as the basis for every stage.
    To achieve this goal, install the operating system and other tools that you need,
    and create a template of that server. Use this template as the basis for all servers
    that host your system of microservices, which is another form of immutable server.


    To manage these services and templates, you can use tools provided by your virtualization
    provider, cloud provider or other third-party options. Options available now include
    Vagrant², VMware², and VirtualBox2⁴. When paired with software configuration and
    automation technologies like Salt or Ansible, the virtualization of microservices
    onto individual servers can become flexible and agile.


    This configuration leads mainly to two variants:


    +   - Having one microservice packaged on a single virtualized server.

    - Having multiple microservice packages on a single virtualized server (see Figure
    8-2).


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_110_0.png)


    When deploying only one microservice per virtualized server, you get good isolation
    from all the other virtualized servers that host the other microservices. The
    operating system can be configured to the needs of the specific microservice it
    is hosting. When errors occur, problem determination is not complicated by having
    to separate unrelated information or side effects produced by other applications
    in the same server. The lack of effects from unrelated applications is also good
    on the performance front.


    ² http://www.vagrant.com/

    ³ http://www.vmware.com/

    ⁴ http://www.virtualbox.org/'
  - '[PAGE 111]


    application cannot (easily) starve other applications of resources when they are
    isolated from each other in different virtualized servers.


    The disadvantage of this alternative is you end up with many virtualized servers
    (one microservice instance) that must be managed and coordinated across your infrastructure.
    The overall resource consumption is also higher because every virtualized server
    needs its own operating system. Some of the virtualization solutions have optimizations
    for this problem, which can help reduce the processor usage caused by multiple
    operating systems.


    Having multiple microservices on one virtualized server should only be done when
    they have similar resource usage patterns, so that one microservice does not adversely
    affect, or starve, the others.


    The configuration of the operating system must also be compatible with hosting
    microservices on the same virtualized server. Different configurations must not
    disturb each other or require conflicting configuration between stages. This pattern
    would generally reduce the number of virtualized systems that are needed to host
    the microservice application, at the cost of sharing system configuration. In
    this setting, you can also use the shared class configuration of the JVM, which
    reduces start time of the microservice.


    # 8.3.5 Aspects of running multiple microservices on one server


    The following remarks are suitable for deployments where more than one microservice
    gets hosted on a server instance, regardless of whether this configuration is
    done with a container or a virtualized system.


    If you have more than one microservice on your server, then pay attention to the
    thread pool contention of your Java run. The JVM queries the operating system
    to get information about the number of CPUs on this server, and uses this information
    to define a strategy for managing thread pooling. With virtual hardware, the JVM
    often gets the wrong information about available resources because every JVM on
    a server sees the information about available CPU, even though the amount available
    to any specific process is considerably less. This configuration can cause unexpected
    side effects in thread pool tuning algorithms because the wrong does not get many
    CPUs as expected.


    Another aspect that you should consider is how microservices on the same server
    would share or contend for server resources. Know the requirements for each microservice
    upfront, or gather the data to figure it out, to avoid problems that are related
    to hosting shared resources. For example, caching inside the memory of a microservice
    can cause problems as the cache grows. Therefore, generally caching on an external
    system. The external caching server should be treated as an attached service just
    like a data store.


    # 8.3.6 Preferred practices on caching


    On the first glance, running multiple Docker containers containing microservices
    on the same server host seems the same as running multiple microservice packages
    on the same server. But upon further review, there are notable differences between
    the two deployment patterns. Running multiple microservices on one server without
    Docker can only be done when configurations of the operating system are the same
    for all microservices. This configuration must be checked in advance. However,
    Docker provides a much greater level of isolation while making effective use of
    host resources to the common underlying operating'
  - '[PAGE 112]


    system. Microservices that require different or conflicting operating system configurations
    can run happily side by side in Docker containers.


    The following is a summary of preferred practices for packaging:


    +   Virtualization or cloud services are the preferred basis for infrastructure
    because dynamic provisioning can help a system of microservices deal with changing
    capacity requirements.


    +   System level configuration should be as similar as possible across all stages,
    or should be isolated from the application by using technology containers.


    +   An immutable artifact should be produced that is promoted unchanged between
    stages.


    +   Immutable artifacts for microservices should stand alone and self-contained.
    This item could be an executable JAR file or a Docker container.


    +   Each immutable artifact should contain only one microservice application and
    its supporting runtime time and libraries.


    +   Resource requirements should be considered when hosting shared resources to
    prevent disruption due to resource contention.


    +   Shared libraries should be built as part of your application, rather than
    being shared or used as a dependency provided by the hosting environment.


    Figure 8-3 shows a Java EE-based microservice that is packaged together with its
    Java EE runtime running inside a Docker container as a virtualized infrastructure.
    This is one of the preferred practices for hosting a microservice.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_112_0.png)


    Figure 8-3 Java Platform, Enterprise Edition based microservice in a Docker Container
    hosted on virtualized infrastructure'
- md: "\n## 8.4 Configuration of the applications across stages\n\nEvery microservice\
    \ should be an immutable deployment artifact. After it is built, it should not\
    \ be changed for the deployments on different stages. Therefore, environment variables,\
    \ which can change from stage to stage, need to be injected from outside of the\
    \ deployment artifact. In addition to using immutable server for deployments,\
    \ the application configuration should be immutable as far as possible. Only change\
    \ values that are necessary on different server (such as port, ip addresses, database\
    \ users, pool size). The remainder of the application configuration stays the\
    \ same for every stage. The more values that you change, the higher the risk of\
    \ getting failures on the deployment on the next stage. If values need to be changed\
    \ on the subsequent stage, then you should test the behavior of your service in\
    \ the presence to these changes.\n\nConfiguring the system of microservices can\
    \ be done in three different ways:\n\n- Environment variables\n- Configuration\
    \ files\n- Configuration systems\n\nThe following sections describe these three\
    \ variants.\n\n### 8.4.1 Environment variables\n\nOne way to get the configuration\
    \ from outside to your microservice is to use environment variables. This is a\
    \ common way to pass values to a running process.\n\nEnvironment variables are\
    \ character-based key value pairs that are mapped to the Java data type `java.lang.String`.\
    \ The way to set these values varies between operating systems. Example 8-4 shows\
    \ how to set these variables in a scripting environment to start the microservice.\n\
    \n> Example 8-4 Setting environment variables in a Linux Bash script\n```bash\n\
    #!/bin/bash\nexport VARIABLE1=\"Value 1\"\nexport VARIABLE2=\"Value 2\"\n```\n\
    \nThe Java sample shown in Example 8-5 shows how to parse environment variables.\n\
    \nExample 8-5 Parsing environment variables\n\n```\nMap<String, String> envMap\
    \ = System.getenv();\nfor (String envVariable : envMap.keySet()) {\n    System.out.format(\"\
    %s=%s%n\", envVariable, envMap.get(envVariable));\n}\n```\n\nUsing environment\
    \ variables is the preferred method compared to passing system properties (Java\
    \ command line option -D) to your microservice because in in a Cloud environment,\
    \ you normally have no access to the command line of your process. Cloud environments\
    \ normally use environment variables.\n\nCloud Foundry for example uses an environment\
    \ variable called VCAP_SERVICES. It is a JSON document that contains information\
    \ about service instances bound to the application. For more information about\
    \ VCAP_SERVICES, see:\n\nhttp://docs.cloudfoundry.org/devguide/deploy-apps/environment-variable.html#VCAP-SERVICES\n\
    \nExample 8-6 shows VCAP_SERVICES addressing an IBM Cloudant²25 database.\n\n\
    # Example 8-6 VCAP_SERVICES\n\n```\nVCAP_SERVICES=\n{\n  \"cloudantNoSQLDB\":\
    \ {\n    {\n      \"name\": \"myMicroservicesCloudant\",\n      \"label\": \"\
    cloudantNoSQLDB\",\n      \"plan\": \"Shared\",\n      \"credentials\": {\n  \
    \      \"username\": \"xyz\",\n        \"password\": \"password\",\n        \"\
    host\": \"yourhost.yourdomain.com\",\n        \"port\": 443,\n        \"url\"\
    : \"https://cloudant.yourhost.yourdomain.com\"\n      }\n    }\n  }\n}\n```\n\n\
    Connectors available to parse the VCAP_SERVICES variable. For example, Spring\
    \ Boot has a connector to the VCAP_SERVICES in its configuration service. For\
    \ more information, see this website:\n\nhttp://spring.io/blog/2015/04/27/binding-to-data-services-with-spring-boot-in-cloud\n\
    \n### 8.4.2 Configuration files\n\nAnother alternative to get configuration values\
    \ from your environment is to use Java Naming and Directory Interface (JNDI)²⁶\
    \ which is a Java API to query the directory service. JNDI must be provided by\
    \ every Java compatible server. Elements that are defined in the JNDI namespace\
    \ can be injected with Java CDI, so accessing these values is easy. To get elements\
    \ into the JNDI namespace, they must be added to a configuration file.\n\nIn Liberty,\
    \ this process involves the following steps:\n\n- 1. Activate the JNDI-Feature\
    \ in the server.xml, which is the main configuration file in Liberty, Example\
    \ 8-7. After this you can set your JNDI variable.\n\nExample 8-7 Activate JNDI\
    \ in Liberty and set JNDI variable in server.xml\n\n```\n<server>\n  <featureManager>\n\
    \    <feature>jndi-1.0</feature>\n</featureManager>\n<jndiEntry jName=\"myFirstJNDIEntry\"\
    \ value='myFirstValue\"/>\n</server>\n```\n\n> ²⁵ http://cloudant.com/\n\n> ²⁶\
    \ http://de.wikipedia.org/wiki/Java_Naming_and_Directory_Interface\n\n- 2. Looking\
    \ up the value for the JNDI entry can be done in two ways. You can do it out shown\
    \ in Example 8-8.\n\nExample 8-8 Parsing JNDI value\n\n```\nInitialContext ctx\
    \ = new InitialContext();\nString jndiValue = (String) ctx.lookup(\"myFirstJNDIEntry\"\
    );\n```\n\nOr you can use CDI by using a field-based injection (Example 8-9).\n\
    \nExample 8-9 Field-based injection of JNDI with CDI\n\n```\npublic class MyClass\
    \ {\n    @Resource(name=\"myFirstJNDIEntry\")\n    private String jndiValue;\n\
    }\n```\n\nUsing this technique that the configuration files must exist on every\
    \ stage and have the correct stage values. This configuration can be done.\n\n\
    In a Docker environment, it is normal to do the configuration outside the Docker\
    \ container. The container itself stays unchanged and the configuration must be\
    \ provided by DevOps tools.\n\nSpring Boot also has the opportunity to configure\
    \ the application from outside. It is possible to use properties files, YAML files,\
    \ environment variables, and command line arguments. These values get injected\
    \ into Spring beans and can be used inside the application. For more information,\
    \ see the following:\n\n```\nhttp://docs.spring.io/spring-boot/docs/current/html/boot-features-external-configuration.html\n\
    ```\n\n### 8.4.3 Configuration systems\n\nAnother alternative to configure the\
    \ system of microservices is to use special servers. These configuration systems\
    \ are all some kind of value stores to persist the configuration for the microservices.\n\
    \nAccording to the CAP theorem from Eric Brewer, you must choose two of the three\
    \ guarantees consistency, availability, and partition tolerance. As the microservice\
    \ system will not work without the configuration system, the configuration system\
    \ must be partitioned. This limitation means that your configuration system will\
    \ either be available with inconsistent values, or limited availability but with\
    \ consistent values.\n\nThe following are examples of configuration systems used\
    \ in microservice environments:\n\n- Apache ZooKeeper\n  http://zookeeper.apache.org/\n\
    - etcd\n  http://etcd.io/\n- Netflix archaius\n  http://github.com/Netflix/archaius\n\
    - Consul\n  http://www.consul.io/\n\nThe advantage of using configuration systems\
    \ is that configuration data can be changed at runtime. This cannot be easily\
    \ achieved without environment variables or configuration files. If a bound JNDI\
    \ value changes, the Liberty server would have to be restarted to get the new\
    \ values into the application. You should track the changes in the configuration\
    \ system to be able to reproduce the values later to help you find the reasons\
    \ for any failures.\n"
