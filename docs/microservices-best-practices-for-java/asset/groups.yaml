    ## 8.3.3 Containerization


    The previous strategies are all running on an operating system that must be installed
    and configured with the executable JAR file. A strategy to avoid the problems
    resulting from inconsistently configured operating systems is to bring more of
    this operating system with you. This strategy leads to the situation that a microservice
    runs on an operating system with the same configuration on every stage.


    Containers are lightweight virtualization artifacts that are hosted on an existing
    operating system. Docker provides an infrastructure capability to build a complete
    file system that contains all elements (tools, libraries) of the operating system
    that are needed to run the application, including the application itself. Docker
    Engine is a lightweight run time that provides both the abstraction and isolation
    between Docker containers and the host, and the supporting tools to work with
    hosted containers. For more information about Docker, see this.


    http://www.docker.com


    Docker containers isolate applications from other applications (residing in peer
    containers) and also separates applications from the host''s operating system.
    Isolation of these containers and their lightweight attributes make it possible
    to run more than one Docker container on one operating system (see Figure 8-1).
    This configuration means that you need many virtualized servers to host your system
    of microservices.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_109_0.png)


    Figure 8-1 Multiple Docker containers on one server


    Docker are immutable artifacts. When applications are built into Docker images,
    those images can then be used to start containers in different deployment environments,
    ensuring that the same stack is used across all environments. Using Docker makes
    the exact packaging format (executable JAR, WAR, EAR, ZIP file) irrelevant because
    the image configuration determines how a container is started. Configuration values
    for the microservice inside a container can be provided either by using environment
    variables or mounted volumes.


    Data stores and all other backends should not be hosted in the same container
    as the microservice itself, as mentioned in the 12 factors. These backends should
    be treated as services, which is an essential characteristic of a microservice.
    Data stores, for example, can also be managed as Docker containers. For failover
    reasons, you should not host multiple instances of the microservice on the same
    host.


    ## 8.3.4 Every microservice on its own server


    Another alternative to keep the operating system as identical as possible across
    all stages is to use the same virtualized server as the basis for every stage.
    To achieve this goal, install the operating system and other tools that you need,
    and create a template of that server. Use this template as the basis for all servers
    that host your system of microservices, which is another form of immutable server.


    To manage these services and templates, you can use tools provided by your virtualization
    provider, cloud provider or other third-party options. Options available now include
    Vagrant², VMware², and VirtualBox2⁴. When paired with software configuration and
    automation technologies like Salt or Ansible, the virtualization of microservices
    onto individual servers can become flexible and agile.


    This configuration leads mainly to two variants:


    - Having one microservice packaged on a single virtualized server.

    - Having multiple microservice packages on a single virtualized server (see Figure
    8-2).


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_110_0.png)


    When deploying only one microservice per virtualized server, you get good isolation
    from all the other virtualized servers that host the other microservices. The
    operating system can be configured to the needs of the specific microservice it
    is hosting. When errors occur, problem determination is not complicated by having
    to separate unrelated information or side effects produced by other applications
    in the same server. The lack of effects from unrelated applications is also good
    on the performance front.


    ² http://www.vagrant.com/

    ³ http://www.vmware.com/

    ⁴ http://www.virtualbox.org/


    application cannot (easily) starve other applications of resources when they are
    isolated from each other in different virtualized servers.


    The disadvantage of this alternative is you end up with many virtualized servers
    (one microservice instance) that must be managed and coordinated across your infrastructure.
    The overall resource consumption is also higher because every virtualized server
    needs its own operating system. Some of the virtualization solutions have optimizations
    for this problem, which can help reduce the processor usage caused by multiple
    operating systems.


    Having multiple microservices on one virtualized server should only be done when
    they have similar resource usage patterns, so that one microservice does not adversely
    affect, or starve, the others.


    The configuration of the operating system must also be compatible with hosting
    microservices on the same virtualized server. Different configurations must not
    disturb each other or require conflicting configuration between stages. This pattern
    would generally reduce the number of virtualized systems that are needed to host
    the microservice application, at the cost of sharing system configuration. In
    this setting, you can also use the shared class configuration of the JVM, which
    reduces start time of the microservice.


    ## 8.3.5 Aspects of running multiple microservices on one server


    The following remarks are suitable for deployments where more than one microservice
    gets hosted on a server instance, regardless of whether this configuration is
    done with a container or a virtualized system.


    If you have more than one microservice on your server, then pay attention to the
    thread pool contention of your Java run. The JVM queries the operating system
    to get information about the number of CPUs on this server, and uses this information
    to define a strategy for managing thread pooling. With virtual hardware, the JVM
    often gets the wrong information about available CPUs.


    Another aspect that you should consider is how microservices on the same server
    would share or contend for server resources. Know the requirements for each microservice
    upfront, to prevent disruption due to resource contention. For example, caching
    inside the memory of a microservice can cause problems as the cache grows. Therefore,
    generally caching on an external system. The external caching server should be
    treated as an attached service just like a data store.


    ## 8.3.6 Preferred practices


    On the first glance, running multiple Docker containers containing microservices
    on the same server seems the same as running multiple microservice packages on
    the same server. But upon further review, there are notable differences between
    the two deployment patterns. Running multiple microservices on one server without
    Docker can only be done when configurations of the operating system are the same
    for all microservices. However, Docker provides a much greater level of isolation
    while making effective use of host resources.


    The following is a summary of preferred practices for packaging:


    - Virtualization or cloud services are the preferred basis for infrastructure
    because dynamic provisioning can help a system of microservices deal with changing
    capacity requirements.

    - System level configuration should be as similar as possible across all stages,
    or should be isolated from the application by using technology containers.

    - An immutable artifact should be produced that is promoted unchanged between
    stages.

    - Immutable artifacts for microservices should stand alone and self-contained.
    This item could be an executable JAR file or a Docker container.

    - Each immutable artifact should contain only one microservice application and
    its supporting runtime time and libraries.

    - Resource requirements should be considered when hosting shared resources to
    prevent disruption due to resource contention.

    - Shared libraries should be built as part of your application, rather than being
    shared or used as a dependency provided by the hosting environment.


    Figure 8-3 shows a Java EE-based microservice that is packaged together with its
    Java EE runtime running inside a Docker container as a virtualized infrastructure.
    This is one of the preferred practices for hosting a microservice.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_112_0.png)


    Figure 8-3 Java Platform, Enterprise Edition based microservice in a Docker Container
    hosted on virtualized infrastructure

