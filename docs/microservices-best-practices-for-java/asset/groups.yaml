    \ and network interfaces. APIs that end across diverse platforms and networks\
    \ are typically provided by MOM. MOM provides software elements that reside in\
    \ all communicating components of a client/server architecture and typically support\
    \ asynchronous calls between the client and server applications.\n"
  mdcn: "\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_57_0.png)\n\n-   微服务的数据库服务器\n\
    \n这是最高程度的分离。它可以非常有用，例如当需要处理性能方面的问题时（见图 5-3）。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_57_1.png)\n\
    \n图 5-3 每个微服务对应一个数据库服务器\n\n## 5.1.3 异构持久化（Polyglot persistence）\n\n每个微服务都应该使用自己的数据存储器，这意味着它可以使用不同的数据存储技术。NoSQL\
    \ 运动催生许多新的数据存储技术，这些技术可以与传统的关系型数据库一起使用。根据应用程序必须实现的实现，它可以在不同类型的技术之间选择来存储其数据。在一个应用程序中使用多种数据存储技术被称为异构持久化（polyglot\
    \ persistence）。\n\n对于某些微服务，将数据存储在关系型数据库中是最佳的。其他服务具有不同类型的数据（如非结构化、复杂和图导向），可以将数据存储在某些\
    \ NoSQL 数据库中。\n\n异构编程（Polyglot programming）是一个术语，意味着应用程序应该使用最适合应用程序必须面对挑战的编程语言来编写。\n\
    \n关于这两个术语的更深入描述可以在 Martin Fowler 网站找到：http://martinfowler.com/biki/PolyglotPersistence.html\n\
    \n## 5.1.4 微服务之间的数据共享\n\n在某些情况下，微服务应用程序的客户端可能想要请求另一个服务的数据。例如，客户端可能想查看他所有的支付（Payments）以及相应的支付状态。他必须查询服务获取他的账户（Account），但之后使用数据库来合并数据这不符合微服务的最佳实践。为了处理这种业务场景，你必须实现一个适配器服务（见图\
    \ 5-4），该服务查询账户服务和支付服务，然后将收集的数据返回给客户端。适配器服务还负责对收到的数据进行必要的数据转换。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_58_0.png)\n\
    \n在微服务系统中，更改数据可能会变得更加复杂，因为某些业务事务可以跨越多个微服务。例如，在一个零售店的微服务应用程序中，可能有一个服务用于下单（Order），另一个用于支付（Payment）。因此，如果客户想在你的商店购买某物品并支付费用，该业务事务就跨越了两个微服务。每个微服务都有自己的数据存储器，因此对于跨越两个或多个微服务的业务事务，该业务事务涉及两个或多个数据存储器。本节描述了如何实现这些业务事务。\n\
    \n## 事件驱动架构（Event-Driven architecture）\n\n你需要一种方法来确保跨越两个或多个微服务的业务事务中涉及的数据的一致性。一种方法是使用分布式事务，但有很多原因说明为什么这不应该出现在微服务应用程序中。主要原因是参与分布式事务的微服务之间存在紧密耦合。如果两个微服务参与分布式事务，且其中一个服务失败或出现性能问题，将很难回滚事务。\n\
    \n跨越微服务执行业务事务的最好方法是使用事件驱动架构。要更改数据，第一个服务更新其数据，并在同一个（内部）事务中发布一个事件。订阅了该事件的第二个微服务接收到此事件并对其数据进行更改。使用发布/订阅（publish/subscribe）通信模型，两个微服务是松耦合的。耦合仅存在于它们交换的消息上。这种技术使微服务系统能够在不使用分布式事务的情况下维护所有微服务的一致性。\n\
    \n如果微服务应用程序中有相互发送消息的微服务，那么它们可能是合并为一个服务的良好候选者。但要小心，因为这种配置可能会破坏你微服务的领域驱动设计（domain-driven\
    \ design）。处理跨服务的复杂更新的适配器也可以事件来实现。\n\n事件驱动架构的编程模型更加复杂，但 Java 可以帮助保持复杂度在可控范围内。\n\
    \n## 最终一致性（Eventual Consistency）\n\n在事件驱动架构中，向其他微服务发送消息会产生名为“最终一致性”（Eventual Consistency）的问题。这通常由于以下情况引起的运行时问题：服务\
    \ A 修改其数据存储器中的数据并在同一事务中向微服务 B 发送消息。一段时间后，微服务 B 接收消息并更改其数据存储器中的数据。在正常的短时间内，两个存储器中的数据是不一致的。例如：服务\
    \ A 更新其数据存储器中的订单（Order），并向支付发送消息。当处理支付时，有一个尚未支付的订单。当消息接收者无法处理消息时，情况会变得奇怪。在这种情况下，消息系统或接收的微服务需要健壮的策略来应对这个问题！\n\
    \n在微服务应用程序中，每个微服务都有自己的数据库。跨越多个微服务的业务事务引入了最终一致性，因为不鼓励使用分布式事务来解决此问题。处理此类业务事务的一种方法见第\
    \ 47 页的图 5-5。订单微服务在数据存储器中保存订单，并向支付微服务发送一个事件（例如 OrderCreated）。订单微服务尚未收到支付的确认，因此订单处于等待状态（pending\
    \ state）。\n\n在微服务应用程序中，每个微服务都有自己的数据库。跨越多个微服务的业务事务引入了最终一致性，因为不鼓励使用分布式事务来解决此问题。处理此类业务事务的一种方法见第\
    \ 47 页的图 5-5。订单微服务在数据存储器中保存订单，并向支付微服务发送一个事件（例如 OrderCreated）。订单微服务尚未收到支付的确认，因此订单处于等待状态。\n\
    \n在微服务应用程序中，每个微服务都有自己的数据库。跨越多个微服务的业务事务引入了最终一致性，因为不鼓励使用分布式事务来解决此问题。处理此类业务事务的一种方法见第\
    \ 47 页的图 5-5。订单微服务在数据存储器中保存订单，并向支付微服务发送一个事件（例如 OrderCreated）。订单微服务尚未收到支付的确认，因此订单处于等待状态。\n\
    \n![](img/857a3fe455a7acf964c5a1d25b24ba28_60_0.png)\n\n支付服务订阅了 OrderCreated 事件，因此它处理该事件并在数据存储器中执行支付。如果支付成功，它会发布一个订单服务订阅的\
    \ Approved 事件。处理 Approved 事件后，订单的状态变为 Approved。在数据不可用的情况下，服务可以向客户端发送“对不起，请重试”。\n\
    \n## 数据复制（Data replication）\n\n数据存储器的分离以及从不同存储器获取数据导致了数据复制机制可以解决问题的想法。这样做（例如使用数据库触发器或其他过程）与微服务共享数据库有相同的缺点。当部署新版本的服务时，数据结构必须进行调整。正如所述，基于事件的处理可以解耦数据存储器。处理事件的服务在需要时可以进行相关的数据转换，并存储在自己的存储器中。\n\
    \n## 5.1.5 事件溯源与命令责任分离（Event Sourcing and CQRS）\n\n在事件驱动架构中，考虑命令责任分离（CQRS）和事件溯源（Event\
    \ Sourcing）。这两个架构模式可以结合使用来处理微服务应用程序中的事件。\n\nCQRS 将数据存储器的访问分为两个部分：一部分用于读取操作，另一部分用于写入操作。读取操作不改变系统状态；它们只返回状态。写入操作（命令）改变状态但不返回值。事件溯源对发生的事件进行排序。图\
    \ 5-6 显示了使用 CQRS 的示例。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_61_0.png)\n\n\
    图 5-6 使用 CQRS 的示例\n\n如图 5-6 所示，事件顺序存储在事件存储器中。查询模型中的数据与事件存储器的数据保持同步。为了支持事件存储器或查询模型，可以使用专用系统，例如使用\
    \ Elastic Search 来支持微服务的查询。有关 Elastic Search 的更多信息，请参阅：https://www.elastic.co/\n\
    \n 5.1.6 消息系统（Messaging systems）\n\n你可以使用消息系统或消息面向中间件来支持你的事件驱动架构。\n\n-   消息面向中间件（MOM）是支持分布式系统之间发送和接收消息的软件或硬件基础设施。MOM\
    \ 允许应用程序模块在异构平台上进行开发，并降低了跨多个操作系统和网络协议的应用程序开发的复杂性。中间件创建了一个分布式通信层，使应用程序开发人员不受各种操作系统和网络接口细节的影响。跨不同平台和网络的\
    \ API 通常由 MOM 提供。MOM 提供了位于客户端/服务器架构中所有通信组件的软件元素，并支持客户端和服务器应用程序之间的异步调用。\n"
