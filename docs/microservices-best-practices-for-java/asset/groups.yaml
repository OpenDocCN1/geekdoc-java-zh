  - '[PAGE 124]


    # 9.1.2 Health check


    The instances of the microservice application experiencing problems must be recognized.
    This function helps to keep the whole system in its optimum state. To get more
    information out of your system of microservices, Liberty has another feature to
    support this. With the health management feature in Liberty, you can take a policy
    driven approach to monitoring the application environment and take action when
    unhealthy criteria is discovered. You can define the health policies, which includes
    the health conditions to be monitored in your environment and the health actions
    to take if these conditions are met.


    Health management in a Liberty collective can prevent the disruption of service
    by detecting common problems and generating diagnostic actions based on configured
    health policies. The health management functions are enabled by two Liberty features:
    Health manager and health analyzer.


    The following predefined health conditions can be used:


    +   - Excessive response time condition

    - Excessive response time condition

    - Memory condition: Excessive memory usage

    - Memory condition: Memory leak


    When one of these health conditions is raised, a predefined action is executed.
    The following actions are available:


    +   - Restart server

    - Take thread memory dumps

    - Take JVM memory dumps

    - Enter server into maintenance mode

    - Exit server out of maintenance mode


    Some of these actions produce more information to get a better understanding of
    the problem. A server in maintenance mode is still running, but does not accept
    new requests.


    To get more information about internals of the running server, Liberty can help
    you. This feature enables the Performance Monitoring Infrastructure (PMI) for
    features that the server is running. The values collected in the MXBeans can be
    seen in the AdminCenter of the Liberty server (feature adminCenter-1.0 must be
    activated).


    Other tools already in the infrastructure of your production system (for example
    Nagios²) can also be used to help administrators keep the system of microservices
    running.


    # 9.2 Logging


    Logging is essential for applications. The same is true for a system of microservices.
    But there are some special points of interest.


    In a system of microservices, a business transaction can use a message-oriented
    middleware, this can also be part of your business transaction. Therefore, you
    need something to track the request from entering your system until the response
    leaves the system. A good way to track the request is to use a correlation ID
    (see 5.2.5,"Java Message Service API" on page 62). The same correlation ID you
    use for your message-oriented middleware can be used for your microservices requests.


    > ² http://www.nagios.org/'
  - '[PAGE 125]


    You must create a correlation ID on the first request that enters your system
    of microservices, then send the same correlation ID to other microservices when
    you call them. The other services only have to check whether there is a correlation
    ID and propagate it in their calls. The correlation ID can be placed in the HTTP
    header using a special field (X-header fields, for example) to hold the value.
    The handling of the header fields can be done with a REST filter to keep this
    logic in a central place.


    Using a correlation ID provides these benefits:


    +   - It is easier to find cascading errors.

    - You can track user requests to get information about typical behavior of the
    customer.

    - You can find unused or seldom microservices that can be eliminated, or heavily
    used microservices where you can get more value if you extend them.


    There are some benefits with your logging framework to logging the value of the
    correlation ID in your log files. Some of these frameworks use logging context.
    SLF4j or Log4j² implements a Mapped Diagnostic Context (MDC) or a Nested Diagnostic
    Context (NDC) which you can use to put the correlation ID into it. Therefore,
    if any use log written to the log files, you are using MDC or NDC. Another benefit
    that you get from the NDC/MDC is that if you are using multiple threads to get
    the request, each of these threads logs the same NDC/MDC.


    The layout of the log format should be defined in a clear manner, so it is easier
    to aggregate the logs produced in the different microservices. The log levels
    (for example, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL) should be clearly defined
    and used corresponding in every microservice, you might get misunderstandings
    between the microservice teams.


    In a system of microservices with dynamic provisioning, you must ensure that the
    server that hosted the microservices and the log files deleted after the shutdown
    of the system. In such cases, it is better to use a logging infrastructure that
    is always running and gathering the log output from your microservices. This logging
    system can also help you in situations where log files are distributed over different
    systems. It can be time consuming to search in log files on different servers.
    This limitation can also be complicated in a production environment where you
    have no access rights or minimal rights on the systems.


    Therefore, the preferred approach for a logging infrastructure in a microservice
    application is the ELK stack or Elastic Stack, which is a combination of three:


    +   - Elasticsearch (search and analytics engine)

    - Logstash (data collection and transport pipeline)

    - Kibana (visualizing collected data)


    If your of microservices uses Liberty as the Java EE provider, then there is a
    feature to use the Elastic Stack: logstashCollector-1.0. Use the Logstash collector
    to collect log and other events from your Liberty servers and send them to a Logstash
    server.


    3 http://www.slf4j.org/

    4 http://logging.apache.org/log4j/2.x/

    5 http://www.elastic.com/products


