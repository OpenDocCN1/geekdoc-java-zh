  - '[PAGE 18]


    A dominant factor in creating and preserving agility is ensuring each service
    is independent and autonomous. Each service must be capable of being started,
    stopped, or replaced at any time without tight coupling to other services. Many
    other characteristics of microservice architectures follow from this single factor.


    Microservices act as encapsulations (or bounded contexts), as discussed in Chapter
    2, "Creating Microservices in Java" on page 9 guarding the implementation details
    of the application. This configuration allows the service''s implementation to
    be revised and improved (or even rewritten) over time. Data sources, especially,
    must be private to the service, as described in Chapter 5, "Handling data" on
    page 41.


    If deploying changes requires simultaneous or sensitive updates to multiple services,
    you are doing it wrong. There might be good, pragmatic, reasons behind needing
    these updates, but it should prompt a review of the relationships between your
    services. There are a few options:


    +   - You need to revisit your strategy to preserve the independent lifecycle
    of services.


    +   - The current service boundaries are not drawn properly, and services should
    be refactored into independent pieces.


    Refactoring services will happen, especially when creating an application from
    scratch. Identifying services is described more in Chapter 2, "Creating Microservices
    in Java" on page 9, but it is a given that you will get things wrong. The ability
    to recognize and refactor services as problems is a benefit of the microservices
    approach.


    # A quick note about polyglot and language-agnostic protocols


    Polglot is a frequent benefit of microservice-based architectures. Choosing an
    appropriate language or data store to meet the needs of each service can be powerful,
    and can bring significant efficiency. However, the use of obscure technologies
    can complicate long-term maintenance and inhibit the movement of developers between
    teams. Create a balance between the two by choosing a list of supported technologies
    to choose from at outset, with a defined policy for extending the list with new
    technologies over time. Ensure that non-functional or regulatory requirements
    like maintainability, auditability, and data security can be satisfied, preserving
    agility and innovation through experimentation.


    Polyglot applications are only possible with language-agnostic protocols. Representational
    State Transfer (REST) architecture patterns define guidelines for creating uniform
    interfaces that separate the on-wire data representation from the implementation
    of the service. RESTful architectures require the request state to be maintained
    by the client, allowing the server to be stateless. The concepts behind REST and
    microservices should be clear.


    For information about REST, see "Chapter 5: Representational State Transfer (REST)",
    Fielding, Roy Thomas (2000), which is available at:


    ```

    http://www.ics.uci.edu/~pubs/dissertation/rest_arch_style.html

    ```


    Hypertext Transfer Protocol (HTTP) is a common language for applications on the
    internet. It has an extensive set of verbs and return codes that are just realizing
    their potential with the adoption of REST.


    REST/HTTP interactions are inherently synchronous (request/response) in nature
    loose coupling between microservices. Asynchronous communications can also play
    a significant role in maintaining loose coupling. Language-agnostic protocols
    come to the forefront, with standards like Advanced Message Queuing Protocol (AMQP)
    and Message Queuing'
