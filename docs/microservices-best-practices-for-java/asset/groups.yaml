    # Management and Operations


    Running a system of microservices has some aspects that differ from running a
    monolith application. With microservices, a single application becomes a distributed
    system that is made up of a number of microservices that communicate with each
    other. Therefore, you must manage a highly distributed system and worry about
    the communication path between each service.


    The number of running services is normally higher than the services needed for
    a monolith application. When load characteristics vary, a microservice application
    should react by adjusting the number of running services. Therefore, you must
    be able to automatically deploy new and remove existing service instances to ensure
    that overall application is running at optimum state.


    In every production system, it is necessary to do health checks to get information
    about the state of the running applications. This requirement is also true for
    a system of microservices where you must worry about the health of each service
    instance.


    This chapter covers the following topics:


    +   * Metrics and health checks

    * Logging

    * Templating'
  - '[PAGE 121]


    # 9.1 Metrics and health checks


    Metrics and health checks are necessary to get information about the state of
    a running service. As mentioned in 8.3, "Packaging options" on page 92 each Java
    EE-based microservice has its own run time packaged together with the microservice
    code itself. Java based runtimes have tools to help the administrators to check
    the health of the running microservice.


    # 9.1.1 Dynamic provisioning


    With dynamic provisioning, the aim is to automatically keep the system of microservices
    in its optimum state. This state is where the system is properly balanced to match
    the demands of the application users. It can be reached through service instances
    being available to manage throughput and keep latency at a minimum. For example,
    an instance of a microservice becoming overloaded can be compensated by scaling
    up and starting another instance of a service. This change should be done automatically
    without the need for administrator intervention. Similarly, unused microservice
    instances can be returned to the unused resources to your virtualization system.


    However, in some situations it is necessary to inform the administration when
    some threshold is reached so they can take action to prevent failures in the system.
    However, this could be an exceptional case.


    Service discovery as described in Chapter 3, "Locating services" on page 25 is
    a key service that is used by microservices. The service discovery service tracks
    available microservice instances and the current health state. A new instance
    of a service should start to take requests to reduce load from the other instances.
    With this information, load balancing can be dynamically performed to distribute
    load across available microservice instances for optimal performance. A microservice
    that is shutting down should complete running requests before it stops, and should
    not receive any requests to process.


    A common pattern with microservices operation is to keep a specific number of
    microservice instances running at all times, or more at a minimum number and some
    level of permitting scaling. A microservice application with these settings is
    running within its designed bounds and can scale up to an acceptable amount for
    unexpected loads. With the auto scaling feature of Liberty, you can define the
    minimum number of service instances that should be running for a healthy system.
    You can then have system management that keep number alive. Another Liberty feature
    to check for the health of a service is described in 9.1.2, "Health check" on
    page 111.'
  - '[PAGE 122]


    The following metrics can be used to do auto scaling.


    The scaling member monitors the use of the following resources within the server
    process:


    +   - CPU

    - Heap

    - Memory


    The scaling member monitors the use of the following resources at the host level:


    +   - CPU

    - Memory


    For more information, "Setting up auto scaling for Liberty collectives" at:


    http://www.ibm.com/support/knowledgecenter/SSAW57_9_0.0/com.ibm.websphere.wlp.ndd/ae/twlp_wve_autoscaling.html


    When you start and stop instances of microservices, your service discovery must
    also be informed. One easy way to do this is to inform the HTTP server in front
    of your system of microservices about started or stopped microservices. Liberty
    has a feature that can be combined with the auto scaling feature. The Dynamic
    Routing feature enables routing of HTTP requests to members of Liberty collectives
    without having to regenerate the WebSphere plug-in configuration file when the
    environment changes. When servers, cluster members, applications, or virtual hosts
    are added, removed, started, stopped, or modified the new information is dynamically
    delivered to the WebSphere plug-in. The feature provides the Dynamic Routing service,
    which dynamically retrieves routing information from the collective repository
    and delivers this to the WebSphere plug-in.


    Liberty servers that take part in this functionality must be joined in a collective.
    A set of Liberty servers in a single management domain is called a collective.
    A collective consists of at least one server with the collectiveController-1.0
    feature enabled that is called a collective controller. Optionally, a collective
    can have many servers with the collectiveMember-1.0 feature enabled that are called
    collective members and a collective can be configured to have many collective
    controllers.'
- md: "\nFigure 9-1 shows an example of a Liberty collective.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_123_0.png)\n\
    \nFigure 9-1 Liberty collective architecture¹\n\nA sample for a topology showing\
    \ the dynamic routing feature is shown in Figure 9-2.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_123_1.png)\n\
    \nFigure 9-2 Auto scaling and dynamic routing topology\n\n> ¹ http://www.ibm.com/support/knowledgecenter/en/SSAM57_9.0.0/com.ibm.websphere.wlp.nd.doc/ae/cwlp_collective_active_arch.html\n\
    \n110 Microservices Best Practices for Java\n\n## 9.1.2 Health check\n\nThe instances\
    \ of the microservice application experiencing problems must be recognized. This\
    \ function helps to keep the whole system in its optimum state. To get more information\
    \ out of your system of microservices, Liberty has another feature to support\
    \ this. With the health management feature in Liberty, you can take a policy driven\
    \ approach to monitoring the application environment and take action when unhealthy\
    \ criteria is discovered. You can define the health policies, which includes the\
    \ health conditions to be monitored in your environment and the health actions\
    \ to take if these conditions are met.\n\nHealth management in a Liberty collective\
    \ can prevent the disruption of service by detecting common problems and generating\
    \ diagnostic actions based on configured health policies. The health management\
    \ functions are enabled by two Liberty features: Health manager and health analyzer.\n\
    \nThe following predefined health conditions can be used:\n\n- Excessive response\
    \ time condition\n- Memory condition: Excessive memory usage\n- Memory condition:\
    \ Memory leak\n\nWhen one of these health conditions is raised, a predefined action\
    \ is executed. The following actions are available:\n\n- Restart server\n- Take\
    \ thread memory dumps\n- Take JVM memory dumps\n- Enter server into maintenance\
    \ mode\n- Exit server out of maintenance mode\n\nSome of these actions produce\
    \ more information to get a better understanding of the problem. A server in maintenance\
    \ mode is still running, but does not accept new requests.\n\nTo get more information\
    \ about internals of the running server, Liberty can help you. This feature enables\
    \ the Performance Monitoring Infrastructure (PMI) for features that the server\
    \ is running. The values collected in the MXBeans can be seen in the AdminCenter\
    \ of the Liberty server (feature adminCenter-1.0 must be activated).\n\nOther\
    \ tools already in the infrastructure of your production system (for example Nagios²)\
    \ can also be used to help administrators keep the system of microservices running.\n\
    \n## 9.2 Logging\n\nLogging is essential for applications. The same is true for\
    \ a system of microservices. But there are some special points of interest.\n\n\
    In a system of microservices, a business transaction can use a message-oriented\
    \ middleware, this can also be part of your business transaction. Therefore, you\
    \ need something to track the request from entering your system until the response\
    \ leaves the system. A good way to track the request is to use a correlation ID\
    \ (see 5.2.5,\"Java Message Service API\" on page 62). The same correlation ID\
    \ you use for your message-oriented middleware can be used for your microservices\
    \ requests.\n\n> ² http://www.nagios.org/\n\nYou must create a correlation ID\
    \ on the first request that enters your system of microservices, then send the\
    \ same correlation ID to other microservices when you call them. The other services\
    \ only have to check whether there is a correlation ID and propagate it in their\
    \ calls. The correlation ID can be placed in the HTTP header using a special field\
    \ (X-header fields, for example) to hold the value. The handling of the header\
    \ fields can be done with a REST filter to keep this logic in a central place.\n\
    \nUsing a correlation ID provides these benefits:\n\n- It is easier to find cascading\
    \ errors.\n- You can track user requests to get information about typical behavior\
    \ of the customer.\n- You can find unused or seldom microservices that can be\
    \ eliminated, or heavily used microservices where you can get more value if you\
    \ extend them.\n\nThere are some benefits with your logging framework to logging\
    \ the value of the correlation ID in your log files. Some of these frameworks\
    \ use logging context. SLF4j or Log4j² implements a Mapped Diagnostic Context\
    \ (MDC) or a Nested Diagnostic Context (NDC) which you can use to put the correlation\
    \ ID into it. Therefore, if any use log written to the log files, you are using\
    \ MDC or NDC. Another benefit that you get from the NDC/MDC is that if you are\
    \ using multiple threads to get the request, each of these threads logs the same\
    \ NDC/MDC.\n\nThe layout of the log format should be defined in a clear manner,\
    \ so it is easier to aggregate the logs produced in the different microservices.\
    \ The log levels (for example, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL) should\
    \ be clearly defined and used corresponding in every microservice, you might get\
    \ misunderstandings between the microservice teams.\n\nIn a system of microservices\
    \ with dynamic provisioning, you must ensure that the server that hosted the microservices\
    \ and the log files deleted after the shutdown of the system. In such cases, it\
    \ is better to use a logging infrastructure that is always running and gathering\
    \ the log output from your microservices. This logging system can also help you\
    \ in situations where log files are distributed over different systems. It can\
    \ be time consuming to search in log files on different servers. This limitation\
    \ can also be complicated in a production environment where you have no access\
    \ rights or minimal rights on the systems.\n\nTherefore, the preferred approach\
    \ for a logging infrastructure in a microservice application is the ELK stack\
    \ or Elastic Stack, which is a combination of three:\n\n- Elasticsearch (search\
    \ and analytics engine)\n- Logstash (data collection and transport)\n- Kibana\
    \ (visualizing data)\n\nIf your microservices uses Liberty as the Java provider,\
    \ then there is a feature to use logstashCollector-1.0. Use the Logstash to collect\
    \ log from your servers and send them to a Logstash server.\n\n³ http://www.slf4j.org/\n\
    ⁴ http://logging.apache.org/log4j/\n⁵ http://www.elastic.com/products\n\nMicroservices\
    \ Best Practices for Java\n\nExample 9-1 shows the usage of logstashCollector\
    \ in Liberty.\n\n### Example 9-1 Configuring logstashCollector in Liberty\n\n\
    ```xml\n<featureManager>\n  <feature>logstashCollector-1.0</feature>\n</featureManager>\n\
    \  <keyStore id=\"defaultKeyStore\" password=\"Liberty\" />\n  <keyStore id=\"\
    defaultTrustStore\" location=\"trust.jks\" password=\"Liberty\" />\n  <ssl id=\"\
    mySSLConfig\" trustStoreRef=\"defaultTrustStore\"\n    keyStoreRef=\"defaultKeyStore\"\
    \ />\n  <logstashCollector\n    source=\"message,trace,garbageCollection,accessLog\"\
    \n    hostName=\"localhost\"\n    port=\"5043\"\n    sslRef=\"mySSLConfig\">\n\
    />\n```\n\nSplunk⁷ is a commercial product that can also be used to gather and\
    \ analyze your log data.\n\n> ⁶ http://www.ibm.com/support/knowledgecenter/SSAW57-9.0.0/com.ibm.websphere.wlp.nd.doc/ae/twlp_analytics_cs_logstash.html\n\
    ⁷ http://www.splunk.com/\n⁸ http://wildfly-swarm.io/generator/\n⁹ http://start.spring.io/\n\
    ¹⁰ http://liberty-app-accelerator.wasdev.developer.ibm/\n\n## 9.3 Templating\n\
    \nFrom a management point of view, it can be valuable to template for your development\
    \ team, which is implementing the system of microservices. Templating in this\
    \ sense is defining a skeleton of code fragments that can be used to generate\
    \ the needed parts of a microservice.\n\nA microservice template typically includes\
    \ these common capabilities:\n\n- Communication with Service Discovery to register\
    \ a service instance\n- Communication with other microservices\n- Communication\
    \ with a messaging system\n- Logging\n- Security\n\nYou get these benefits from\
    \ a template having all these capabilities:\n\n- Quicker start for the development\
    \ teams\n- All teams use the same cross functional services\n\nThe following are\
    \ generators:\n\nIf teams use Java to implement the microservices, and do not\
    \ have a polyglot programming environment, then you must define one template that\
    \ can be evolved to best fit your project needs.\n"
  mdcn: "\n图 9-1 显示了 Liberty 集合（Liberty collective）的示例。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_123_0.png)\n\
    \n图 9-1 Liberty 集合架构¹\n\n图 9-2 显示了一个展示动态路由功能的拓扑结构示例。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_123_1.png)\n\
    \n图 9-2 自动伸缩与动态路由拓扑\n\n> ¹ http://www.ibm.com/support/knowledgecenter/en/SSAM57_9.0.0/com.ibm.websphere.wlp.nd.doc/ae/cwlp_collective_active_arch.html\n\
    \n110 Java 微服务最佳实践\n\n## 9.1.2 健康检查\n\n必须识别出出现问题的微服务应用实例。此功能有助于保持整个系统处于最佳状态。为了从你的微服务系统中获取更多信息，Liberty\
    \ 提供了另一个功能来支持这一点。通过 Liberty 中的健康管理功能，你可以采用策略驱动的方法来监控应用环境，并在发现不健康标准时采取行动。你可以定义健康策略，其中包括要在你的环境中监控的健康状况，以及在满足这些条件时应采取的健康操作。\n\
    \nLiberty 集合中的健康管理可以通过检测常见问题并根据配置的健康策略生成诊断操作，来防止服务中断。健康管理功能由两个 Liberty 功能启用：健康管理器（Health\
    \ manager）和健康分析器（health analyzer）。\n\n可以使用以下预定义的健康状况：\n\n- 响应时间过长状况\n- 内存状况：内存占用过高\n\
    - 内存状况：内存泄漏\n\n当触发其中一个健康状况时，将执行一个预定义的操作。可用操作包括：\n\n- 重启服务器\n- 内存转储\n- JVM 内存转储\n\
    - 将服务器进入维护模式\n- 退出维护模式\n\n这些某些操作会产生更多信息以便更好地理解问题。处于维护模式的服务器仍在运行，但不接受新请求。\n\n为了获取有关运行服务器内部的更多信息，Liberty\
    \ 可以提供帮助。此功能为服务器运行的功能开启了性能监控基础设施（PMI）。在 MXBeans 中收集的值可以在 Liberty 服务器的 AdminCenter\
    \ 中查看（必须激活 `adminCenter-1.0` 功能）。\n\n生产系统基础设施中已有的工具（例如 Nagios²）也可以帮助管理员保持微服务系统的运行。\n\
    \n## 9.2 日志\n\n日志对于应用来说至关重要。微服务系统也是如此。但有一些值得关注的特殊点。\n\n在微服务系统中，业务事务可以使用面向消息的中间件，这也可以是你业务事务的一部分。因此，你需要某种东西来跟踪从进入你的系统到响应离开系统的请求。跟踪请求的一种良好方法是使用关联\
    \ ID（correlation ID）（参见第 62 页 5.2.5 节“Java Message Service API”）。用于面向消息中间件的相同关联\
    \ ID 也可以用于你的微服务请求。\n\n> ² http://www.nagios.org/\n\n你必须在进入微服务系统的第一个请求上创建一个关联 ID，然后在调用其他微服务时发送相同的关联\
    \ ID。其他服务只需检查是否存在关联 ID 并在其调用中传递它。可以使用特殊字段（例如 X-header 字段）将关联 ID 放在 HTTP 头部中以持有该值。头部字段的处理可以通过\
    \ REST 过滤器完成，以便将此逻辑保留在中心位置。\n\n使用关联 ID 有以下优势：\n\n- 更容易找到级联错误。\n- 你可以跟踪用户请求以获取有关客户行为的信息。\n\
    - 你可以发现可以消除的未使用或很少使用的微服务，也可以发现频繁使用的微服务，通过扩展它们你可以获得更多价值。\n\n使用你的日志框架在日志文件中记录关联\
    \ ID 的值也有一些好处。其中一些框架使用了日志上下文（logging context）。SLF4j 或 Log4j² 实现了映射诊断上下文（MDC）或嵌套诊断上下文（NDC），你可以用它们将关联\
    \ ID 放入其中。因此，如果任何日志被写入日志文件，你就在使用 MDC 或 NDC。从 NDC/MDC 获得的另一个益处是，如果你使用多个线程来获取请求，这些每个线程都会记录相同的\
    \ NDC/MDC。\n\n日志格式的布局应该清晰地定义，以便更容易聚合在不同微服务中产生的日志。日志级别（例如 FATAL, ERROR, WARN, INFO,\
    \ DEBUG, TRACE, ALL）应该在每个微服务中被清晰定义并相应使用，否则你可能会在微服务团队之间产生误解。\n\n在具有动态供应的微服务系统中，你必须确保托管微服务的服务器和日志文件在系统关闭后被删除。在这种情况下，最好使用一个始终运行并收集你微服务日志输出的日志基础设施。这种日志系统也可以帮助你在日志文件分布在不同系统上的情况。在不同服务器的日志文件中进行搜索可能非常耗时。这种限制在对系统没有访问权限或权限极权限的生产环境中也会变得复杂。\n\
    \n因此，微服务应用中日志基础设施的首选方法是 ELK 堆栈或 Elastic Stack，它是三者的结合：\n\n- Elasticsearch（搜索和分析引擎）\n\
    - Logstash（数据收集和传输）\n- Kibana（数据可视化）\n\n如果你的微服务使用 Liberty 作为提供程序，则有一个功能可以使用 `logstash-1.0`。使用\
    \ Logstash 收集并发送到 Logstash 服务器。\n\n³ http://www.slf4j.org/\n⁴ http://logging.apache.org/log4j/\n\
    ⁵ http://www.elastic.com/products\n\nJava 微服务最佳实践\n\n示例 9-1 显示了在 Liberty 中使用 logstash。\n\
    \n### 示例 9-1 在 Liberty 中配置 logstash\n\n```xml\n<featureManager>\n  <feature>logstashCollector-1.0</feature>\n\
    </featureManager>\n  <keyStore id=\"defaultKeyStore\" password=\"Liberty\" />\n\
    \  <keyStore id=\"defaultTrustStore\" location=\"trust.jks\" password=\"Liberty\"\
    \ />\n  <ssl id=\"mySSLConfig\" trustStoreRef=\"defaultTrustStore\"\n    keyStoreRef=\"\
    defaultKeyStore\" />\n  <logstashCollector\n    source=\"message,trace,garbageCollection,accessLog\"\
    \n    hostName=\"localhost\"\n    port=\"5043\"\n    sslRef=\"mySSLConfig\">\n\
