    \ update has occurred, that is the room has updated in the database using a synchronous\
    \ request (2), the map service needs to notify the other services about the change.\
    \ This update does not require a response, so it is sent by using an asynchronous\
    \ event (3) that other services are subscribed to (4).\n\n> 1 http://docs.oracle.com/javaee/6/tutorial/doc/gkhic.html\n\
    \n![](img/857a3fe455a7acf964c5a1d25b24ba28_50_0.png)\n\n## Online retail store\n\
    \nConsider a user wanting to place an order on an online retail store. After the\
    \ user has entered all the details of the order, they click the **Submit** button.\
    \ The user expects a response to confirm that the order has gone through, so the\
    \ **Submit** button triggers a synchronous request that returns a response. After\
    \ the order has been submitted, the application starts processing the order. The\
    \ service that received the order request sends out asynchronous events that other\
    \ services are subscribed to. These events include inventory updates, shipping\
    \ events, and payment events. Some services trigger another synchronous or asynchronous\
    \ request in response to the events. For example, the inventory service uses a\
    \ synchronous request to update the inventory database.\n\n## 4.2 Fault tolerance\n\
    \nA strong motivator for moving to a microservice architecture is to get more\
    \ fault tolerant and resilient. Modern applications are required to have near\
    \ zero downtime and respond within seconds rather than minutes. This section focuses\
    \ on the techniques and tools you should use to make your microservice fault tolerant\
    \ and resilient.\n\n### 4.2.1 Resilient against change\n\nWhen a microservice\
    \ makes a synchronous request to another service, it uses input attributes that\
    \ are included in the request and output attributes that are included in the response.\
    \ It is unrealistic to assume that these input and output attributes will never\
    \ change. Even in best design, requirements are constantly changing, causing attributes\
    \ to be added, removed, and changed. To be resilient against these forms of changes,\
    \ the microservice must consider the APIs they produce and the they consume.\n\
    \n### Consuming APIs\n\nAs the consumer of an API, it is necessary to validate\
    \ the response you receive to check that it contains the information needed for\
    \ the function being performed. If you are receiving JSON, you also need to parse\
    \ the JSON before any transformations. When doing validation or JSON parsing,\
    \ you must do these things:\n\n- Validate the request against the attributes that\
    \ you need\n- Do not validate variables just because they are provided. If you\
    \ are not using them as part of your request, do not rely on them being there.\n\
    - Accept unknown attributes\n- Do not issue an exception if you receive an unexpected\
    \ variable. If the response contains the information, it does not matter else\
    \ is provided.\n\nSelect a JSON parsing tool that allows you to configure the\
    \ way it parses the incoming data. Jackson Project provides annotations to configure\
    \ the parser as shown in Example 4-3.\n\n```java\nExample 4-3 Jackson annotations\
    \ for JSON parsing\n@JsonInclude(NON_EMPTY)\n@JsonIgnoreProperties(ignoreUnknown\
    \ = true)\npublic class Account {\n    // Account ID\n    @JsonProperty(\"id\"\
    )\n    protected String id;\n}\n```\n\nBy following these rules, your microservice\
    \ can be resilient against any changes that do not directly affect it. Even if\
    \ the producer of the microservice removes or adds attributes, they are not the\
    \ ones you are using, your microservice continues functioning normally.\n\n##\
    \ Producing APIs\n\nWhen providing an API to external clients, do these things\
    \ when accepting requests and returning responses:\n\n- Accept unknown attributes\
    \ as part of the request\n- If a service has called your API with unnecessary\
    \ attributes, discard those values. Returning an error in this scenario will cause\
    \ unnecessary failures.\n- Only return attributes that are relevant for the API\
    \ invoked\n\nLeave as much room as possible for the implementation of a service\
    \ to change over time. Leave implementation details by oversharing.\n\n> 1 https://github.com/FasterXML/jackson\n"
