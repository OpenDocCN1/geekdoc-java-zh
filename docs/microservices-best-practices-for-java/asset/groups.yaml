- md: "\nAll the other frameworks used from the Java EE stack can be used to validate\
    \ the beans automatically (for example JAX-RS, CDI) and also EJB as shown in Example\
    \ 5-21.\n\nExample 5-21 Bean validation in EJB\n\n```java\n@Stateless\n@LocalBean\n\
    public class OrderEJB {\n    public String setDescription(@Max(80) String newDescription){\n\
    \    \n    }\n}\n```\n\n## Architectural layering aspects of JPA and BeanValidation\n\
    \nIn a service with just a few layers, it is easier to use the JPA entity classes\
    \ as Data Transfer Object (DTO) after. The JPA object detached from its persistence\
    \ context, it can be used as a plain Old Java (POJO). This POJO can also be used\
    \ as a DTO to transfer to the REST endpoint. Doing this way has its disadvantages.\
    \ Validation annotations get mixed with the JPA annotations that can relate to\
    \ Java classes with numerous annotations and your REST endpoints more closely\
    \ related to your database.\n\nIf the microservice is a little bigger or has to\
    \ deal with a more complex data model, then it can be better to use a separate\
    \ layer to access the database. This extra layer implements all the data access\
    \ methods based on the JPA classes. The classes in this layer are data access\
    \ objects (DAOs). You can use the DAO classes to generate the DTO classes for\
    \ the REST endpoint and focus, on the one, on the data model (DAO) and on the\
    \ other, on the client (DTO). The disadvantage of this pattern is that you must\
    \ convert your classes handled in the DAO to DTOs and vice versa. To avoid a lot\
    \ of boilerplate code to do this, you can use some frameworks to help you do the\
    \ converting. The following frameworks are available to convert Java objects:\n\
    \n- ModelMapper\n  http://modelmapper.org/\n- MapStruct\n  http://mapstruct.org/\n\
    \nTo extend the possibilities that you get from Bean Validation, it is useful\
    \ to get additional features using Spring. For more information, see \"Validation,\
    \ Data Binding, and Type Configuration\": http://docs.spring.io/spring/docs/current/spring-framework-reference/html/validation.html.\n\
    \n## 5.2.4 Contexts and Dependency Injection\n\nIf your microservice does not\
    \ store its data in a transactional store, then using CDI beans instead of EJBs.\
    \ CDI 1.1 is specified in the JSR 346¹ and is part of the Java EE 7 specification.\
    \ CDI managed beans can be a good alternative in these situations.\n\n> ¹ http://jcp.org/en/jsr/detail?id=346\n\
    \nFor more information about CDI managed beans, see the following website:\n\n\
    http://docs.oracle.com/javaee6/tutorial/giwhl.html\n\nIn comparison to EJBs, CDI\
    \ has no EE security on its own and does not get the persistence context injected.\
    \ This process must be done by the developer themselves or by using additional\
    \ frameworks. Apache DeltaSpike, for example, has many modules that you can use\
    \ to extend the functions of CDI. For more information about Apache DeltaSpike,\
    \ see:\nhttp://deltaspike.apache.org/index.html\n\nAdditional frameworks can be\
    \ used to extend the functions of CDI managed beans. EJBs have a thread pool that\
    \ can be managed in an application server. CDI has nothing that corresponds to\
    \ this function yet. To be able to configure a thread pool would be helpful in\
    \ an environment with high loads.\n\nTo implement a microservice running in a\
    \ Java server, CDI and additional modules provide you many functions that are\
    \ useful in these environments.\n\n## 5.2. Java Message Service API\n\nTo implement\
    \ an event-driven architecture in a Java world, JMS API provides support, which\
    \ is also specified in Java Message Service 2.0 JSR 343¹ JMS is used to communicate\
    \ to the so-called message producer that must be implemented by the message-oriented\
    \ middleware (MOM).\n\nWhen JMS was updated from version 1.0 to 2.0, which is\
    \ part of the EE 7 specification, rework was done to make the API easy to use.\
    \ JMS 2.0 is compatible with an earlier version, so you can use your existing\
    \ code or the new simplified API for your microservices. The old API will not\
    \ be deprecated in the next version.\n\nAccording to the endpoints and dump pipes\
    \ methodology¹⁷, your base microservice must just send your JSON to an endpoint\
    \ hosted by the JMS provider. The sender of the messages is called producer and\
    \ the receiver of the message is the consumer. These endpoints can be of these\
    \ types:\n\n- Queue\nMessages in a queue are consumed by only one consumer. The\
    \ sequence of messages in the queue might be consumed in a different order. Queues\
    \ are used to point to semantic.\n\n- Topic\nThese messages can be consumed by\
    \ more than one consumer. This is the implementation for publish/subscribe semantics.\n\
    \nIn a REST-based microservice, where JSON-based requests are sent by the client,\
    \ it is a good idea to use the JSON format for your messaging system. Other messaging\
    \ applications use XML. If you have only one format in your system of microservice,\
    \ it is easier to implement JSON.\n\nExample 5-22 Producer sending messages to\
    \ a JMS queue with EJB\n\n```java\n@Stateless\n@LocalBean\npublic class OrderEJB\
    \ {\n    @Inject\n    @JMSConnectionFactory(\"jms/myConnectionFactory\")\n   \
    \ JMSContext jmsContext;\n    @Resource(mappedName = \"jms/PaymentQueue\")\n \
    \   Queue queue;\n    public void sendMessage(String message) {\n        jmsContext.createProducer().send(queue,\
    \ message);\n    }\n}\n```\n\n> ¹ http://jsp.org/en/jsr/detail?id=343\n¹⁷ http://martinflower.com/articles/microservices.html#SmartEndpointsAndDumbPipes\n"
  mdcn: "\n\nJava EE 栈中使用的所有其他框架都可以用于自动验证 Bean（例如 JAX-RS、CDI），如示例 5-21 所示的 EJB。\n\n\
    示例 5-21 EJB 中的 Bean 验证\n\n```java\n@Stateless\n@LocalBean\npublic class OrderEJB\
    \ {\n    public String setDescription(@Max(80) String newDescription){\n    \n\
    \    }\n}\n```\n\n## JPA 和 BeanValidation 的架构分层方面\n\n在只有几层的服务中，事后将 JPA 实体类作为数据传输对象（DTO）较为容易。JPA\
    \ 对象脱离其持久化上下文后，可以作为一个普通的 Java 对象（POJO）。这个 POJO 也可以用作 DTO 传输到 REST 端点。这种做法有其缺点：验证注解会与\
    \ JPA 注解混合在一起，可能导致 Java 类关联了大量注解，并且使你的 REST 端点与数据库的关系变得更加紧密。\n\n如果微服务大一些，或者必须处理更复杂的数据模型，那么使用单独的层来访问数据库可能会更好。这个额外的层基于\
    \ JPA 类实现了所有数据访问方法。该层中的类是数据访问对象（DAO）。你可以使用 DAO 类为 REST 端点生成 DTO 类，并专注于：一方面关注数据模型（DAO），另一方面关注客户端（DTO）。这种模式的缺点是，你必须将要在\
    \ DAO 中处理的类转换为 DTO，反之亦然。为了避免为了这些操作编写大量的模板代码，你可以使用一些框架来帮助完成转换。以下框架可转换 Java 对象：\n\
    \n- ModelMapper\n  http://modelmapper.org/\n- MapStruct\n  http://mapstruct.org/\n\
    \n为了扩展从 Bean Validation 中获得的功能，使用 Spring 获取额外功能是很有用的。更多信息请参阅“验证、数据绑定和类型配置”：http://docs.spring.io/spring/docs/current/spring-framework-reference/html/validation.html。\n\
    \n## 5.2.4 上下文与依赖注入\n\n如果你的微服务没有将数据存储在事务存储中，那么请使用 CDI Bean 代替 EBs。CDI 1.1 定义在\
    \ JSR 346¹ 中，并是 Java EE 7 规范的一部分。在这些情况下，CDI 管理的 Bean 是一个很好的替代方案。\n\n> ¹ http://jcp.org/en/jsr/detail?id=346\n\
    \n关于 CDI 管理的 Bean 的更多信息，请访问以下网站：\n\nhttp://docs.oracle.com/javaee6/tutorial/giwhl.html\n\
    \n与 EJB 相比，CDI 本身没有 EE 安全机制，也不会注入持久化上下文。这个过程必须由开发者自己完成或使用额外的框架。例如，Apache DeltaSpike\
    \ 有许多可以扩展 CDI 功能的模块。关于 Apache DeltaSpike 的更多信息，请访问：\nhttp://deltaspike.apache.org/index.html\n\
    \n可以使用额外的框架来扩展 CDI 管理 Bean 的功能。EJB 有可以在应用程序服务器中管理的线程池。目前 目前还没有对应于此的功能。在高负载环境中，能够配置线程池将会有帮助。\n\
    \n为了实现运行在 Java 服务器中的微服务，CDI 和附加模块提供了许多在这些环境中非常有用的功能。\n\n## 5.2. Java 消息服务 API\n\
    \n在 Java 世界中实现事件驱动架构，JMS API 提供了支持，该 API 在 Java Message Service 2.0 JSR 343¹ 中定义。JMS\
    \ 用于与所谓的消息生产者通信，该生产者必须由面向消息的中间件（MOM）实现。\n\n当 JMS 从版本 1.0 更新到 2.0（EE 7 规范的一部分）时，进行了重构以使\
    \ API 易用。JMS 2.0 兼容之前的版本，因此你可以为微服务使用现有代码或新的简化 API。旧 API 不会在下一个版本中弃用。\n\n根据端点和哑管道方法论¹⁷，你的基础微服务只需将\
    \ JSON 发送到由 JMS 提供者托管的端点。消息的发送者称为生产者，消息的接收者称为消费者。端点可以是以下类型：\n\n- 队列 (Queue)\n\
    队列中的消息仅由一个消费者消费。队列中的消息顺序可能会以不同的顺序消费。队列用于语义。\n\n- 主题 (Topic)\n这些消息可以被多个消费者消费。这是发布/订阅语义的实现。\n\
    \n在基于 REST 的微服务中（客户端发送 JSON 请求），为消息系统使用 JSON 格式是一个好主意。其他消息应用程序使用 XML。如果你的微服务系统中只有一种格式，实现\
    \ JSON 会更简单。\n\n示例 5-22 使用 EJB 向 JMS 队列发送消息\n\n```java\n@Stateless\n@LocalBean\n\
    public class OrderEJB {\n    @Inject\n    @JMSConnectionFactory(\"jms/myConnectionFactory\"\
    )\n    JMSContext jmsContext;\n    @Resource(mappedName = \"jms/PaymentQueue\"\
    )\n    Queue queue;\n    public void sendMessage(String message) {\n        jmsContext.createProducer().send(queue,\
    \ message);\n    }\n}\n```\n\n> ¹ http://jsp.org/en/jsr/detail?id=343\n¹⁷ http://martinflower.com/articles/microservices.html#SmartEndpointsAndDumbPipes\n\
    \n"
