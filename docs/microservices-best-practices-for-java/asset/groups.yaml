    \        Claims claims = jwt.getBody();\n        System.out.println(claims.getAudience());\n\
    \        System.out.println(claims.getIssuer());\n        System.out.println(claims.getSubject());\n\
    \        System.out.println(claims.getIssuedAt());\n        System.out.println(claims.getNotBefore());\n\
    \    }\n}\n```\n\nExample 6-1 is an altered version of the authentication service\
    \ in Game On! does to create the JWT from the reactive OAuth token². JWTs should\
    \ be validated in a central place such as a JAX-RS request filter.\n\nA consideration\
    \ for the longevity of the JWT. If your JWT is long lived, you will have significant\
    \ risk in traffic to validate JWTs, but might have a lag in the system reacting\
    \ to access changes.\n\n> ¹ https://github.com/jjwt/jjwt\n² https://github.com/gameontext/game-auth/\n\
    \nIn the case of Game On!, the user is connected by long running WebSocket connections\
    \ to enable 2-way asynchronous communication between third parties. The JWT is\
    \ passed as part of the query string when the connection is established. Expanding\
    \ JWT leads to an unpleasant user experience at the time of writing, so we chose\
    \ to use a relatively long JWT expiry period.\n\n## 6.2.4 Hash-Based Messaging\
    \ Authentication Code\n\nAuthentication using Hash-Based Messaging Authentication\
    \ Code (HMAC) signatures are superior to HTTP Basic authentication. When using\
    \ HMAC, request attributes are hashed and signed with a shared secret to create\
    \ a signature that is included in the sent request. When the request is received,\
    \ the request attributes are rehashed using the shared secret to ensure that the\
    \ values still match. This process authenticates the user, and verifies that the\
    \ content of the message has not been manipulated in transit. The hashed signature\
    \ can also be used to prevent replay attacks.\n\nHMAC validation can be performed\
    \ by an API Gateway. In this case\n\nHMAC is not yet a complete standard, API\
    \ providers (either gateways or individual services) often require different request\
    \ attributes (http headers or a head of the message body) in the generated signature.\
    \ Minimally, an identifying string and the date are used.\n\nUsing shared libraries\
    \ is encouraged when working with HMAC signatures calculations must be performed\
    \ in the same way by both the API consumer and the provider. Considering client-side\
    \ libraries to help consumers sign their requests correctly.\n\nGame On! does\
    \ not use an API gateway at the time of writing. We provide a shared library³\
    \ to ensure that a HMAC signing algorithm is used for both REST and WebSocket\
    \ requests. The shared library provides JAX-RS filters for inbound and outbound\
    \ requests, and fourth-party Room services. We see Example 6-2.\n\nExample 6-2\
    \ The Mediator uses JAX-RS 2.0 client using SignedClientRequestFilter from shared\
    \ library to the Map⁵\n\n```java\nClient client = ClientBuilder.newClient()\n\
    .register(JsonProvider.class);\n// a filter is added to the JAX-RS client\n//\
    \ the filter will sign the request on the way out\nSignedClientRequestFilter apiKey\
    \ = new\nSignedClientRequestFilter(userid, secret);\nclient.register(apiKey);\n\
    ```\n\n³ https://github.com/gameontext/signed\n⁴ https://github.com/gameontext/game-mediator\n\
    ⁵ https://github.com/gameontext/game-map\n\nChapter 6. Application Security 75\n\
    \nThe shared library allows the use of simple annotations to flag server-side\
    \ endpoints that should have the inbound signature verified. JAX-RS filters and\
    \ interceptors are provided to verify both request headers and the message body\
    \ as shown in Example 6-3.\n\nExample 6-3 Map JAX-RS endpoint: Annotation from\
    \ shared library to enable signing\n```java\n@POST\n@SignedRequest\n@Consumes(MediaType.APPLICATION_JSON)\n\
    @Produces(MediaType.APPLICATION_JSON)\npublic Response createRoom(RoomInfo newRoom)\
    \ {\n    Site mappedRoom = repository.connectRoom(...);\n    return Response.created(.).entity(mappedRoom).build();\n\
    }\n```\n\nUsing the shared library in this way keeps the business logic clean.\
    \ The client and server side agreed on attributes and hash calculation as part\
    \ of producing the library. The shared library simplifies both the provider and\
    \ consumer need to.\n\n## 6.2.5 API keys and secrets\n\nAn API key can be one\
    \ of a few different things, unique to identify the origin of a request. Identifying\
    \ the origin of a request is important for API management functions like rate\
    \ limiting. API keys are usually a single string, unlike a password, these strings\
    \ are randomly generated and over 40 characters long. However, sometimes the string\
    \ is used directly in the request as either bearer token or query parameter (over\
    \ https). Using an API key is more secure when used as a shared secret for signing\
    \ tokens (JWTs) or for digest methods of authentication (HMACs).\n\nIf your services\
    \ create API keys, ensure that API keys are securely generated with high entropy\
    \ and stored correctly. Ensure that these keys can be revoked at any time. If\
    \ your application has distinct parts, consider using different API keys for each\
    \ part. This configuration can enable more granular usage tracking, and reduces\
    \ the impact if a key is compromised.\n\nAsymmetric keys can also be used (such\
    \ as SSL), but require a public key infrastructure (PKI) to be maintained. Although\
    \ it is more secure, this configuration is also more labor intensive, and can\
    \ be especially hard to manage when API consumers are third parties.\n\nConsistent\
    \ with the 12 factors, secrets should be injected configuration when used by services\
    \ for intra-service communication. The values not be hardcoded because that increases\
    \ the likelihood they will be compromised (such as checked into a repository in\
    \ plain text). It either makes your code sensitive to the environment, or requires\
    \ different environments to use the same secret, neither of which are good practices.\n\
    \n# Testing\n\nIt is essential that a microservice application is built with an\
    \ awareness of how it can be tested. Having good test coverage gives you more\
    \ confidence in your code and results in a better continuous delivery pipeline.\n\
    \nThis chapter covers the tests that are required at three different stages in\
    \ the build lifecycle:\n\n- Single service testing:\nTests carried out in isolation\
    \ by a team that owns a particular microservice in a system.\n- Staging environment:\n\
    Tests that are run on objects in a staging environment. The microservices that\
    \ form a particular application are deployed into a staging environment for testing.\n\
    - Production environment:\nTests carried out on the live production system.\n\n\
    Tests should be automated as part of the build, release, run (delivery) pipeline.\n\
    \nThe following topics are covered:\n\n- Types of tests\n- Application architecture\n\
    - Single service testing\n- Staging environment\n- Production environment\n"
