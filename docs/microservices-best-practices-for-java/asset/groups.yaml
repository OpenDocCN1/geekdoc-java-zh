    # 前言


    微服务是一种架构风格，大型复杂的软件应用程序由一个或多个较小的服务组成。这些微服务中的每一个都专注于完成代表一个小业务能力的任务。这些微服务可以使用任何编程语言开发。


    本本 IBM® Redbooks® 出版物涵盖了 Java 微服务的最佳实践。它侧重于如何使用最新版本的 IBM WebSphere® Application
    Server Liberty、IBM Bluemix 以及微服务生态系统中其他开源框架创建云原生应用，以突出 Java 微服务的最佳实践。


    # 作者


    本书由来自罗来利中心国际技术支持组织（Raleigh Center）的全球专家团队制作。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_10_0.png)


    Michael Hofmann 拥有计算机科学硕士学位（慕尼黑工业大学文凭）和经济学证书（慕尼黑管理与经济学院）。自 1998 年以来，他一直在不同的职位上从事
    Java 和 Java EE 工作。他目前担任软件开发部门的经理，但始终保持实干精神。他仍在几个大型项目中担任高级软件架构师（技术项目负责人）。作为 Java
    EE 培训师和教练、软件架构师、DevOps 顾问以及会议演讲员，他与其他分享经验。


    Erin Schnabel 是 IBM 的高级软件工程师。她专门负责兼容运行时和微服务架构，包括将面向对象和面向服务的技术以及设计模式应用于解构现有软件系统。Erin
    在 WebSphere Application Server 开发组织中拥有 15 年以上的经验，其中 7 年担任 WebSphere Liberty 的开发负责人和架构师。Erin
    对 Java 开发者的体验充满热情，特别是关于社区驱动、符合标准的软件在云环境中的作用。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_11_0.png)


