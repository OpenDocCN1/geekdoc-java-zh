    # 概述


    在云计算时代，应用程序架构模式正在发生变化。因素的汇聚导致了“云原生”应用程序的概念：


    本章概述了围绕以下内容的概念：

    - 云原生应用

    - 十要素

    - 微服务

    - 哲学与团队结构

    - 示例


    ## 1.1 云原生应用


    云计算环境是动态的，资源按需分配和释放。这种弹性环境提供了更灵活的扩展选项，特别是与本地数据中心相比。


    根据云原生基金会的定义，云原生系统具有以下属性：


    - 应用程序或进程以容器单元的形式运行。

    - 通过中心化编排管理进程以提高利用率并减少维护。

    - 应用程序或服务（微服务）松散耦合。


    这些属性共同描述了一个由许多独立进程提供业务价值的高度动态系统：分布式系统。


    更多信息请参阅云原生基金会（CNCF）章程：

    https://cncf.io/about/charter


    分布式计算的概念可以追溯到几十年前。这八大分布式计算谬误值得被提及：


    1. 网络是可靠的。

    2. 延迟为零。

    3. 带宽是无限。

    4. 网络是安全的。

    5. 拓扑不变。

    6. 只有一个管理员。

    7. 传输成本为零。

    8. 网络是同质的。


    考虑到这些谬误，变得：云原生应用运行在不断且不可预测的环境中，必须预计故障随时发生。关于谬误的更多信息，请查看《分布式计算谬误详解》：

    http://www.rgos.com/Files/fallacies.pdf


    ## 1.2 十要素


    十要素应用方法中提到的十要素并非特定的云提供商、平台或语言。这些因素代表了在云环境中蓬勃发展的应用程序（特别是软件即服务应用程序）的一系列指南或最佳实践。以下是十要素的简要介绍：


    - 版本代码库（对于，IT 仓库）与部署的服务之间应该存在一对一的关系。相同的代码库用于多次部署。

    - 服务应该显式声明所有依赖项，并且不依赖系统级工具或库的存在。


    '
