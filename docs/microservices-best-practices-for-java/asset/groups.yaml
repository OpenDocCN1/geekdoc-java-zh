    ## 3.2.2 Client side


    The request from one microservice to another can be made directly from the client
    side. First, the location of one or several instances of a service is requested
    from the service registry. Second, the request to the microservice is made on
    the client side. The location of the microservice is usually cached so that, in
    the future, a request can be made without returning to the service registry. If
    in the future the request fails, then the client can repeat the call to the service
    registry. It is a best practice to have the cached microservice location on a
    timeout. This configuration means that if a new version of a service is deployed,
    the other microservices do not have to wait for an error from their cached instance
    before being informed about the new instance.


    In comparison to the service proxy approach, this requires fewer network hops.
    Figure 3-3 shows the network hops required. Again, this number of hops is for
    when the client does not have cached information about the services. In many cases,
    the request to the service registry is not required, making it just two hops:
    $3 \rightarrow 4$.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_43_0.png)


    Figure 3-3 Network hops when making a client-side request to the service registry


    The request and any load balancing that is required can be handled by one of two
    mechanisms:


    - Client library

    - Sidecar


    Both mechanisms make requests on the client side. However, the client library
    runs within the microservice and the sidecar is deployed with the microservice,
    but runs on a separate process. Figure 3-4 shows an example architecture diagram.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_44_0.png)


    Figure 3-4 Requests are either made by the client library or by the sidecar process


    ## Client library


    Client libraries can be useful for many reasons, one of which is isolating the
    specifics of communicating with a remote resource. For service registries, client
    libraries like those provided by Consul or Netflix Eureka service registration
    and heart beating. Other libraries, such as Netflix Ribbon, provide client-side
    load balancing.


    Generally start with an existing library, rather than writing your own. If any
    of the microservices in your system are written in Java, then you should standardize
    your library. If you have a polyglot system of microservices, then standardize
    on one for each language. By using the same library everywhere, you maintain the
    flexibility to move developers from microservice to microservice and avoid over-complicating
    your infrastructure and build process.


    The disadvantage of using a client library is that you have now moved the complex
    service calls back into your application. This configuration makes it more complicated
    to test your service. Make sure to keep a good separation between the code that
    uses the client library and the business logic in your microservice. See Chapter
    7, "Testing" on page 77 for more details about code separation to enable easier
    testing.


    ## Sidecar


    A good ground between the service proxy and a client library is a sidecar. A sidecar
    is a separate process that is deployed with your microservice, either as a separate
    process within a container, or as a separate, but closely related container.


    Sidecars maintain the service registration with the service registry, and usually
    perform client-side load balancing for outbound calls to other microservices.


    Because sidecars run in their own process, they are independent of language. You
    can use the same sidecar implementation for all of the microservices in a polyglot
    application, regardless of the language that the service is written in.


    Netflix Prana is an open source sidecar that provides the capabilities of the
    Java based Ribbon and Eureka client libraries to non-Java applications. For more
    information, see the following:


    ```

    http://github.com/Netflix/Prana

    ```


    Kubernetes is an orchestration engine for containers that provides sidecar discovery
    and load balancing capacities. For more information, see the following website:


    ```

    http://kubernetes.io/docs/user-guide/services

    ```


    Amalgama is a solution that can be used with and without containers. It manages
    service registration and provides client-side service discovery, routing, and
    load balancing. For more information, see the following website:


    ```

    http://amalgam.io

    ```


    Choosing a solution that handles several of these elements can reduce the complexity
    of your services and your infrastructure.


    ## 3.3 API Gateway


    An API Gateway can be used to perform service invocation for both internal and
    external clients. The API Gateway performs a similar role to a service proxy (see
    3.2.1, "Server side" on page 27). Services makes requests to the API Gateway that
    looks up the service in the registry, makes the request, and returns the response.
    There is a difference between the two, however. Requests to a service proxy use
    the exact API that the end service provides. Requests to an API Gateway use the
    API that the gateway provides. This configuration means that the API Gateway can
    provide different APIs to the ones that the microservice provides.


    The internal microservices use the exact APIs, while API Gateways provide more
    benefit to external clients. Typically microservices provide fine grained APIs.
    By contrast, an external client that uses the application probably does not need
    an API that is as fine grained. It might also need an API that uses the microservices.
    The API Gateway exposes the actual implementation of the microservices.


    ## Microservice communication


    In a distributed system, inter-service communication is vital. The microservices
    that make up your application must work together. Chapter 3, "Locating services"
    on page 25 discussed how you can locate a particular service. This chapter covers
    the options to achieve resilience.


    The following topics are covered:


    - Synchronous and asynchronous

    - Fault tolerance


    ## 4.1 Synchronous and asynchronous


    Synchronous communication is a request that requires a response, whether that
    be immediately or after some amount of time. Asynchronous communication is a message
    where no response is required.


    A strong case can be made for using asynchronous events or messaging in highly
    distributed systems. There are situations where using synchronous calls is more
    appropriate, which are described in 4.1.1, "Synchronous messaging (REST)".


    For either invocation style, services should document any publishing tools like
    Swagger. Event or message payloads should also be documented to ensure that the
    system is comprehensible, enable future consumers.


    ## 4.1.1 Synchronous messaging (REST)


    As stated previously, in distributed systems, asynchronous forms of messaging
    are highly valuable. When clear request/response semantics apply, or where one
    service needs to trigger a specific behavior in another service, asynchronous
    APIs should be used instead.


    These are usually RESTful operations that parse JSON data, but other protocols
    and data formats are possible. In a Java microservice, having the applications
    JSON is the best choice. There are libraries to parse JSON to Java objects, and
    JSON is becoming widely adopted, making it a good choice to make your microservice
    easily consumable.


    ## Async support for JAX-RS


    Unlike JAX-RS requests which will be synchronous (you always require a response),
    you can take advantage of asynchronous programming models. The asynchronous support
    in JAX-RS 2.0 allows to perform other requests while waiting for the HTTP response.
    In a stateless EJB bean, an AsyncResponse object instance is injected and bound
    to the processing of the request using the @Suspended annotation. The @Asynchronous
    annotation allows to be offloaded from the active thread. Example 4-1 shows the
    code used to return the response.


    Example 4-1 JAX-RS 2.0 includes asynchronous support

