- md: "\nOne of the arguments against including the version in the URL is a strict\
    \ interpretation of the HTML standard that a URL should represent the entity and\
    \ if the entity being represented changed, the URL should not change.\n\nAnother\
    \ concern is that putting versions in the URI requires consumers to update their\
    \ URI references. This concern can be partially resolved by allowing requests\
    \ to be made without a version, and then mapping those requests to the latest\
    \ version. However, this approach is prone to unexpected behavior when the latest\
    \ version changes.\n\n## Add a custom request header\n\nYou can add a custom request\
    \ header to indicate the API version. Custom headers can be taken into consideration\
    \ by routers and other infrastructure to route traffic to specific backend instances.\
    \ However, this mechanism is not as easy to use for all of the same reasons that\
    \ Accept headers are not easy to use. In addition, a custom header that only applies\
    \ to your application, which means consumers need to learn how to use it.\n\n\
    ## Modify the Accept header to include the version\n\nThe Accept header is an\
    \ obvious place to define a version, but is is one of the most difficult to test.\
    \ URLs are easy to specify and replace, but specifying HTTP headers requires more\
    \ detailed API and command-line invocations.\n\nPlenty of articles describe the\
    \ advantages and disadvantages of all three methods. This blog post by Troy Hunt\
    \ is a good place to start:\nhttps://www.troyhunt.com/your-api-versioning-is-wrong-which-is/\n\
    \nThe following are the most important things to take away from this chapter:\n\
    \n- Design your APIs from the consumer point of view.\n- Have a strategy for dealing\
    \ with API changes.\n- Use a consistent versioning technique across all of the\
    \ services in your application.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_38_0.png)\n\
    \n## Locating services\n\nMicroservices are designed to be easily scaled. This\
    \ scaling is done horizontally by scaling individual services. With multiple instances\
    \ of microservices, you need a method for locating services and load balancing\
    \ over the different instances of the service you are calling. This chapter describes\
    \ the options available for locating and making requests to microservices in a\
    \ system.\n\nThe following topics are covered:\n\n- Service registry\n- Service\
    \ invocation\n- API Gateway\n\n## 3.1 Service registry\n\n### Registration\nAfter\
    \ a service has been successfully deployed, the microservice must be registered\
    \ with the service registry.\n\n### Heartbeats\nThe microservice should send regular\
    \ heartbeats to the registry to show that it is ready to receive requests.\n\n\
    ### Service discovery\nTo communicate with another service, a microservice must\
    \ call the service registry to get a list of available instances (see 3.2, \"\
    Service invocation\" on page 27 for more details).\n\n### De-registration\nWhen\
    \ a service is down, it must be removed from the list of available services in\
    \ the service registry.\n\n### 3.1.1 Third-party registration versus self-registration\n\
    \nThe registration of the microservice with the service registry can be done by\
    \ the microservice or by a third party. Using a third party requires said party\
    \ to inspect the current state and relay information to the service registry.\
    \ The third party also handles de-registration. If the microservice itself performs\
    \ registration and heartbeats, the service registry can unregister the service\
    \ if it misses a heartbeat.\n\nThe advantage of using a third party is that the\
    \ registration and heartbeat logic is kept separate from the business logic. The\
    \ disadvantage is that there is an extra piece of software to deploy and the microservice\
    \ must be exposed to a health endpoint for the third party to poll.\n\nUsing self-registration\
    \ pulls the registration and heartbeat logic into the microservice itself. Using\
    \ this method requires careful testing considerations. See Chapter 7, \"Testing\"\
    \ on page 77 for more information about separation of code. However, many service\
    \ registry solutions provide a convenience library for registration, reducing\
    \ the complexity of the code required.\n\nGenerally, use a service registry provides\
    \ a Java-based library for registration and heartbeats. This configuration makes\
    \ your services quicker to code and provide consistency across every microservice\
    \ in the system (that is in Java). The following service registry solutions are\
    \ available:\n\n- Consul\nhttps://www.consul.io/\n- Eureka\nhttps://github.com/Netflix/eureka\n\
    - Amalgam\nhttps://github.com/amalgam/\n\nAll of these registries are open source\
    \ and provide integration for Java. As a part of the Netflix stack, Eureka is\
    \ well integrated with the other Netflix solutions for load balancing and fault\
    \ tolerance. Using Eureka as the service registry allows you to add the other\
    \ solutions. The Amalgam open source project provides both service registration\
    \ and load balancing. It also provides routing configuration that can be used\
    \ during testing. For more information, see Chapter 7, “testing” on page 77.\n\
    \n### 3.1.2 Availability versus consistency\n\nMost service registries provide\
    \ partition tolerance and either consistency or availability. They cannot provide\
    \ all due to the CAP theorem¹. For example, Eureka provides availability and Consul\
    \ and Apache Zookeeper provide consistency. Some articles argue that you should\
    \ choose one or the other (this post² on the Kewton blog is worth a read), but\
    \ the decision comes down to the precise needs of your application. If you require\
    \ all of your microservices to have the same view of the world at a time, choose\
    \ consistency. If it is essential that requests are answered quickly rather than\
    \ waiting for a consistent answer, then choose availability. Solutions are available\
    \ for both that integrate with Java.\n\n## 3.2 Service invocation\n\nWhen a service\
    \ needs to communicate with another service, it uses the information stored in\
    \ the service registry. The call to the actual microservice is then either on\
    \ the server side or the client side.\n\n### 3.2.1 Server side\n\nServer-side\
    \ communication with the microservice is performed by using a service proxy. The\
    \ service proxy is either provided as part of the service registry, or as a separate\
    \ service. When a microservice needs to make a call, it calls the service proxy’s\
    \ well-known endpoint. The service proxy is responsible for getting the location\
    \ of the microservice from the service registry and forwarding the request. The\
    \ proxy takes the response and routes it back to the original microservice that\
    \ made the request. In the example scenario, load balancing is handled completely\
    \ on the server side.\n\n¹ https://en.wikipedia.org/wiki/CAP-theorem\n² https://zookeeper.apache.org/\n\
    ³ https://tech.kewton.com/blog/2014/12/eureka-shouldnt-use-zookeeper-service-discovery/\n\
    \nFigure 3-1 shows the flow of requests when using a service proxy.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_41_0.png)\n\
    \nUsing server-side invocation provides these key advantages:\n\n- Simple requests\n\
    \  The request made by the microservice can be simple because it is calling a\
    \ well-known endpoint.\n- Easier testing\n  Using a server proxy takes any load\
    \ balancing or routing logic out of the microservice. This configuration allows\
    \ you to test the full function of the service using a mocked proxy.\nIn cloud\
    \ platforms such as Cloud Foundry and Bluemix, the proxy is provided by the platform.\
    \ In Bluemix, every deployed application has a well-known endpoint, called a route.\
    \ When another service or application calls this route, Bluemix does load balancing\
    \ in the background.\n\nThis approach has the following key disadvantage:\n\n\
    - Greater number of hops\n  Adding in a call to the service proxy increases the\
    \ number of network hops per request. As a result, the number of hops per request\
    \ is generally higher than for client-side solutions. It is worth noting that\
    \ the service proxy can hold cached information about the other microservices,\
    \ so in many cases the request would go through four hops: 1 $rightarrow$ 4 $rightarrow$\
    \ 5 $rightarrow$ 6.\n"
  mdcn: "\n反对在 URL 中包含版本号的理由之一是对 HTML 标准的严格解释，即 URL 应该代表一个实体，如果所代表的实体发生了变化，URL 就不应该改变。\n\
    \n另一个担忧是，在 URI 中放置版本号需要消费者更新他们的 URI 引用。这种担忧可以通过允许发送不带版本的请求，然后将这些请求映射到最新版本来部分解决。然而，这种方法在最新版本发生变化时容易产生意料之外的行为。\n\
    \n## 添加自定义请求头\n\n你可以添加一个自定义请求头来指示 API 版本。路由器和其他基础设施可以考虑自定义标头，从而将流量路由到特定的后端实例。然而，由于与\
    \ Accept 请求头同样方便使用的相同原因，这种机制对所有人来说并不易于使用。此外，自定义标头仅适用于你的应用程序，这意味着消费者需要学习如何使用它。\n\
    \n## 修改 Accept 请求头以包含版本\n\nAccept 请求头是定义版本的一个明显位置，但它是最难测试的地方之一。URL 易于指定和替换，但指定\
    \ HTTP 请求头需要更详细的 API 和命令行调用。\n\n有许多文章描述了这三种方法的优缺点。Troy Hunt 写的这篇博客文章是一个很好的起点：\n\
    https://www.troyhunt.com/your-api-versioning-is-wrong-which-is/\n\n以下是本章最重要的要点：\n\
    \n- 从消费者的角度设计你的 API。\n- 拥有一处理 API 变化的策略。\n- 在你应用程序中的所有服务中使用一致的版本控制技术。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_38_0.png)\n\
    \n## 定位服务\n\n微服务的设计是为了易于扩展。这种扩展通过扩展单个服务来实现水平扩展。由于微服务有多个实例，你需要一种方法来定位服务，并在你调用的服务的不同实例之间进行负载均衡。本章描述了系统中定位和向微服务发送请求的选项。\n\
    \n涵盖了以下主题：\n\n- 服务注册中心\n- 服务调用\n- API 网关\n\n## 3.1 服务注册中心\n\n### 注册\n服务成功部署后，微服务必须在服务注册中心进行注册。\n\
    \n### 心跳\n微服务应该定期向注册中心发送心跳包，以显示它已准备好接收请求。\n\n### 服务发现\n为了与另一个服务通信，微服务必须调用服务注册中心以获取可用实例列表（更多细节请参见第\
    \ 27 页的 3.2“服务调用”）。\n\n### 注销\n当服务宕机时，必须从服务注册中心的可用服务列表中移除。\n\n### 3.1.1 第三方注册与自注册\n\
    \n微服务在服务注册中心的注册可以由微服务完成，也可以由第三方完成。使用第三方需要该实体检查状态并将信息传递到服务注册中心。第三方还负责注销。如果微服务本身执行注册和心跳，那么当服务注册中心错过心跳时，它可以注销该服务。\n\
    \n使用第三方的优点是注册和心跳逻辑与业务逻辑分离。缺点是多了一个额外的软件需要部署，并且微服务必须暴露一个健康检查端（health endpoint）供第三方进行轮询。\n\
    \n使用自注册将注册和心跳逻辑引入微服务内部。使用这种方法需要仔细的测试考虑。有关代码分离的更多信息，请参见第 77 页第 7 章“测试”。然而，许多服务注册中心解决方案提供了用于注册的便利库，减少了所需代码的复杂性。\n\
    \n通常，使用服务注册中心会提供一个基于 Java 的注册和心跳库。这种配置使得你的服务代码编写更快，并在系统的每个微服务（即是用 Java 编写的）之间提供一致性。以下可用的服务注册中心解决方案：\n\
    \n- Consul\nhttps://www.consul.io/\n- Eureka\nhttps://github.com/Netflix/eureka\n\
    - Amalgam\nhttps://github.com/amalgam/\n\n所有这些注册中心都是开源的，并提供了 Java 集成。作为 Netflix\
    \ 栈的一部分，Eureka 与 Netflix 其他负载均衡和容错的解决方案集成良好。使用 Eureka 作为服务注册中心允许你添加其他解决方案。Amalgam\
    \ 开源项目同时提供了服务注册和负载均衡。它还提供了可以在测试期间使用的路由配置。更多信息请参见第 77 页第 7 章“测试”。\n\n### 3.1.2\
    \ 可用性与一致性\n\n大多数服务注册中心提供分区容性以及一致性或可用性。由于 CAP 定理¹它们无法提供所有特性。例如，Eureka 提供可用性，而 Consul\
    \ 和 Apache Zookeeper 提供一致性。有些文章认为你应该在两者二选一（Kewton 博客上的这篇帖子²值得一读），但决定取决于应用程序的精确需求。如果你要求所有微服务在同一时刻对世界有一个视图，请选择一致性。如果快速回答请求比等待一致的答案更重要，请选择可用性。这两种方案都有与\
    \ Java 集成的解决方案。\n\n## 3.2 服务调用\n\n当服务需要与另一个服务通信时，它使用存储在服务注册中心的信息。对实际微服务的调用随后发生在服务端，也可以发生在客户端。\n\
    \n### 3.2.1 服务端\n\n与微服务的服务端通信是通过使用服务代理（service proxy）完成的。服务代理可以作为服务注册中心的一部分提供，也可以作为一个独立的服务提供。当微服务需要进行调用时，它调用服务代理的已知端点。服务代理负责从服务注册中心获取服务的位置并转发请求。代理获取响应并将其传回请求的原始微服务。在示例场景中，负载均衡完全在服务端处理。\n\
    \n¹ https://en.wikipedia.org/wiki/CAP-theorem\n² https://zookeeper.apache.org/\n\
    ³ https://tech.kewton.com/blog/2014/12/eureka-shouldnt-use-zookeeper-service-discovery/\n\
    \n图 3-1 显示了使用服务代理时的请求流。\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_41_0.png)\n\
    \n使用服务端调用提供了这些关键优点：\n\n- 请求简单\n  微服务发送的请求是简单的因为它调用的是已知端点。\n- 更容易测试\n  使用服务端可以将任何负载均衡或路由逻辑从微服务中提取出来。这种配置允许你使用模拟代理测试服务的完整功能。\n\
    在 Cloud Foundry 和 Bluemix 等云平台上，代理是由平台提供的。在 Bluemix 中，每个部署的应用程序都有一个已知端点，称为路由。当另一个服务或应用程序调用此路由时，Bluemix\
    \ 在后台进行负载均衡。\n\n这种方法有以下主要缺点：\n\n- 跳数增加\n增加对服务代理的调用增加了每次请求的网络跳数。因此，每次请求的跳数通常高于客户端解决方案。\n\
    \n"
