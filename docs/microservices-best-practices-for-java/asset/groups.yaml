    Modern Java EE servers (WebSphere Liberty, Wildfly, TomEE, Payara) undercut claims
    of painful dealings with application servers. All of these servers can produce
    immutable, self-contained, lightweight artifacts in an automated build without
    requiring deployment steps. Further, comparable servers like WebSphere Liberty
    allow for explicit declaration of spec-level dependencies, allowing the run to
    be upgraded without creating compatibility issues with the application.


    Applications use a reduced set of Java EE technologies and are packaged with application
    servers like WebSphere Liberty that tailor the run time to the needs of the application.
    This process results in clean applications that can move between environments
    without requiring code changes, more mocks, or custom test harnesses.


    The examples in this book use Java EE technologies like JAX-RS, CDI, and Java
    Persistence API (JPA). These specifications are easy to use, and are broadly supported
    without relying on vendor-specific approaches.


    # # 2.2 Versioned dependencies


    The twelve factor application methodology was introduced in Chapter 1, “Overview”
    on page 1. Keeping with the second factor, use explicit versions for external
    dependencies. The build artifact that is deployed to an environment must not make
    assumptions about what is provided.


    Build tools like Apache Maven or Gradle provide easy mechanisms for defining and
    managing dependencies. Explicitly declaring the version ensures that the artifact
    runs the same in production as it did in the testing environment.


    Tools are available to making Java applications using Maven and Gradle easier.
