    # 内部结构


    在服务内部组织你的代码，以便实现清晰的职责分离，从而便于测试。对外部服务的调用应与领域逻辑分离，而领域逻辑也应与特定的数据封化或来自底层数据服务的逻辑分离。


    图 2-3 显示了微服务架构的简化版本。该架构将领域逻辑与任何交互或理解外部服务的代码分离来。该架构类似于端口和适配器（六角形）架构^5，以及 Toby Clemenson
    在《微服务架构中的测试策略》^6 中的方法。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_29_0.png)


    图 2-3 微服务的内部结构


    示例结构考虑了以下元素：


    - 资源（Resources）向外部客户端暴露 JAX-RS 资源。此层处理请求验证并将信息传递到领域层。

    - 领域逻辑（Domain logic）从通用概念上来说有许多形式。在边界-实体-控制（Boundary-Entity-Control）模式中，领域逻辑代表实体本身，包含参数验证、状态更改等。

    - 存储库（Repositories）是可选的，但在存在时，它可以为核心应用领域逻辑和数据存储提供实用的抽象。这种配置允许在不对领域逻辑进行大量更改的情况下更改或替换底层数据存储。

    - 服务连接器（Service connectors）与存储库抽象类似，封装了与其他服务的通信。此层充当门面或“反腐”层，以保护领域逻辑不受外部资源 API
    更改的影响，或者在 API 格式和内部模型结构之间进行转换。


    > 5 http://alistair.ckburn.com/#Hexagonal/architecture

    > 6 http://martinflower.com/articles/microservice-testing/#anatomy-modules


    **Java 微服务最佳实践**


    这种架构确实要求你在创建类时遵循一些规则。例如，你用于实现服务的每个类都应该执行以下任务之一：


    - 执行领域逻辑

    - 暴露资源

    - 对其他服务进行外部调用

    - 对数据存储进行外部调用


    这些是关于代码结构的通用建议，并不一定需要严格遵守。重要的特征是降低做出更改的风险。例如，如果你想更改数据存储，只需要更新存储库层。你不需要搜索每个类来寻找调用数据存储的方法。如果存在对外部服务的
    API 调用，这些更改同样包含在服务连接器中。这种分离进一步简化了测试，正如第 77 页第 7 章“测试”中所述。


    ## 2.3.4 共享库还是新服务？


    敏捷和面向对象方法论中的一个原则是“不要重复自己”（DRY）。多次重复相同的代码表明代码应该被转换为可重用的“实体”。在传统的面向对象中，这是一个对象，或者可能是一个工具类。然而，在显而易见的工具类的情况下，严格应用
    DRY 原则会导致解耦模块的终结。


    微服务开发使得退回“面条代码”变得困难。硬性的进程边界可能会使实现细节的追踪变得困难得多，但遗憾的是这并非不可能。那么，你该如何处理代码呢？


    - 接受某些冗余

    - 将代码封装在共享的、有版本的库中

    - 创建一个独立的服务


    取决于代码的性质，最好是接受冗余代码并继续。鉴于每个服务都可以并且独立地演进，服务随时间推移的需求可能会改变最初共同代码的阶段。


    为数据传输对象（Data Transfer Objects）创建共享库尤其具有吸引力，这些类是作为在线路格式（使用 JSON）之间转换的载体的轻量级类。这种技术可以消除大量的模板代码，但它可能会泄露实现细节并引入耦合。


    建议使用客户端库来减少重复并更容易消费 API。这已经是数据存储的常态，包括提供基于 REST API 的新型 NoSQL 存储。客户端库对其他服务也有用，特别是那些使用二进制协议的服务。然而，客户端库确实在服务消费者和提供者之间了耦合。对于没有良好维护库的平台或语言来说，服务可能更难以消费。


    共享库也用于确保可能复杂的算法的一致处理。例如，对于 Game Oni，使用共享库来封装请求签名和签名验证，这在第 67 页第 6 章“应用安全”中进行了更详细的描述。这种配置允许你简化内部的服务并确保值计算的一致性。然而，我们没有为所有语言提供库，因此某些服务仍然必须通过硬核的方法来实现。


    共享库何时才真正是一个独立的服务？独立服务独立于所使用的语言，可以单独扩展，并且可以允许更新立即生效，而不需要对消费者进行协调更新。独立服务还会增加额外的处理，并受到第
    33 页第 4 章“微服务通信”中提到的所有服务间通信问题的影响。何时进行权衡是一个判断问题，尽管如果一个库需要后端服务，这通常是它本身 true一个服务的线索。


    ## 2.4 创建 REST API


    那么，微服务 API 是什么样子的？设计和记录你的 API 对于确保其有用性和易用性至关重要。遵循约定并使用良好的版本策略可以使 API 更容易被理解并随时间演进。


    ## 2.4.1 自上而下还是自底而上？


    从零开始创建时，你可以先定义需要的 API 并编写代码来满足这些 API，或者编写第一个服务的代码并从实现中导出你的 API。


    从原则上说，第一种总是总是。微服务并不是孤立运行的。它要么在调用别人，要么别人在调用它。微服务架构中服务之间的交互应该是定义良好且记录良好的。关于领域设计，API
    是边界上下文（bounded contexts）之间的交点。


    正如 Alan Perlis 所说：“一切都应该从上而下地构建，除了第一次。”在进行概念验证时，你可能不清楚自己正在提供哪些 API。在早期阶段，写一些东西有助于精炼关于你正在尝试做什么的想法。然而，当你对你的服务需要做什么有了更好的理解后，你应该回去并精炼领域模型和面向市场的外部
    API。


    ## 2.4.2 文档化 API


    使用工具记录你的 API 可以更容易确保发布文档的准确性和正确性，随后可以用于与 API 消费者的讨论。这些文档还可以用于你的驱动型契约测试（参见第 77
    页第 7 章“测试”）。


    Open API 倡议（OAI）⁸是一个专注于标准化描述 RESTful API 的财团。OpenAPI 规范⁹基于 Swagger¹，它定义了用于创建 RESTful
    API Swagger 表示的元数据的结构和格式。此定义通常表示在单个文件中（按照约定为 swagger.json，但通过使用 swagger.yaml 支持
    YAML）。Swagger 定义可以使用视视化编辑器创建，也可以通过扫描应用程序中的注解生成。它可以用于生成客户端或服务器存根。


