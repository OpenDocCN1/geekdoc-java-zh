- md: "\n## 1.4 Philosophy and team structure\n\nThere is a philosophical aspect to\
    \ the relationship between microservices and team organization. This aspect comes\
    \ from the application of Conway's law²,, which states that \"any organization\
    \ that designs a system will inevitably produce a design whose structure is a\
    \ copy of the organization's communication structure.\" In \"Building Microservices\"\
    , Sam Newman puts Conway's law into context, and devote an entire chapter to the\
    \ interaction between the organization's structure and system design.\n\nConway's\
    \ law specifically focuses on communication and coordination between disparate\
    \ groups of people. If the organization sequesters database administrators off\
    \ into a group separate from application developers, the resulting architecture\
    \ has a distinct tier managed in a way that is optimal for database administrators.\
    \ Application developers would need to coordinate changes that they need with\
    \ database administrators. Conversely, if the development team handles data management\
    \ itself, this kind of coordination is unnecessary.\n\nA move to build microservices\
    \ applications should include a discussion about organizational structure and\
    \ what changes might be necessary to streamline communication patterns to complement\
    \ the creation and growth of independent microservices. This is a common thread\
    \ in the convergence of DevOps and microservices. Creating an agile ecosystem\
    \ that is capable of fast and frequent changes require streamlined communications,\
    \ and lots of automation.\n\n## 1.5 Examples\n\nThroughout this book, we use two\
    \ example applications to help explain concepts and provide perspective:\n\n-\
    \ Online retail store\n- Game On!\n\n### 1.5.1 Online retail store\n\nThe online\
    \ retail store is an example that is often used when discussing application architectures.\
    \ This book considers a set of microservices that together provide an application\
    \ where users can browse for products and place orders.\n\nThe architecture includes\
    \ the following services:\n\n- Catalog service\n  - Contains information about\
    \ what can be sold in the store.\n- Account service\n  - Manages the data for\
    \ each account with the store.\n- Payment service\n  - Provides payment processing.\n\
    - Order service\n  - Manages the list of current orders and performing tasks that\
    \ are required in the lifecycle of an order.\n\n> ²How Do Committees Invent\"\
    , Melvin Conway, Datation magazine, April 1968\n\nThere are other ways to structure\
    \ services for an online retail store. This set of services was chosen to illustrate\
    \ specific concepts that are described in this book. We leave the construction\
    \ of alternate services as an exercise for the reader.\n\n### 1.5.2 Game On!\n\
    \nGame On!^6 is an extensible, text-based adventure game built by using microservices.\
    \ Unlike the online store, Game On! is a real application, with code available\
    \ on GitHub^7, and a GitBook^8 describing the architecture and tools that are\
    \ used to create the game in depth. The deliberately non-standard example is used\
    \ as a contrast to traditional enterprise applications.\n\nThe game is essentially\
    \ a boundless two-dimensional network of connected rooms. Rooms are provided by\
    \ third parties (for example, developers at conferences or in workshops). A set\
    \ of core services provide a consistent user experience. The user logs in and\
    \ uses simple text commands to interact with and travel between rooms. Both synchronous\
    \ and asynchronous communication patterns are used. Interactions between players,\
    \ core services, and third-party services are also secured.\n\nThe architecture\
    \ of Game On! is described in Chapter 2, “Creating Microservices in Java” on page\
    \ 9.\n\n- 6 https://game-oe.org/#/\n- 7 https://github.com/gameontext/\n- 8 https://gameontext.gitbooks.io/gameon-gitbook/content/\n\
    \n![](img/857a3fe455a7acf964c5a1d25b24ba28_22_0.png)\n\n## Creating Microservices\
    \ in Java\n\nThe prospect of creating an application composed of microservices\
    \ raises some questions in any language:\n\n- How large should a microservice\
    \ be?\n- What does the notion of focused services that do one thing mean for traditional\
    \ centralized governance?\n- What does it do to traditional ways of modeling data?\n\
    \nSome of these topics are covered in more depth in later chapters. This chapter\
    \ focuses on how you identify and create the microservices that compose your app,\
    \ with specific emphasis on how identified candidates are converted into RESTful\
    \ APIs, and then implemented in Java.\n\nThis chapter covers the following topics:\n\
    \n- Java platforms and programming models\n- Versioned dependencies\n- Identifying\
    \ services\n- Creating REST APIs\n\n## 2.1 Java platforms and programming models\n\
    \nNew applications should minimally use Java 8, and should embrace new language\
    \ features like lambdas, parallel operations, and streams. Using annotations can\
    \ simplify the codebase by eliminating boilerplate, but can reach a subjective\
    \ point where there is \"too magic\". Try to establish a balance between code\
    \ cleanliness and maintainability.\n\nYou can create perfectly functional microservices\
    \ using nothing but low-level Java libraries. However, it is generally recommended\
    \ to have something provide a reasonable base of support for common, cross-cutting\
    \ concerns. It allows the codebase for a service to focus on satisfying functional\
    \ requirements.\n\n### 2.1.1 Spring Boot\n\nSpring Boot provides mechanisms for\
    \ creating microservices based on an opinionated view of what technologies should\
    \ be used. Spring Boot applications are Spring applications, and using a programming\
    \ model unique to that ecosystem.\n\nSpring Boot applications can be packaged\
    \ to run as an application hosted by an application server, or run as a runnable\
    \ .jar file containing the composition of dependencies and some embedded server\
    \ (usually Tomcat). Spring emphasizes convention over configuration, and uses\
    \ a combination of annotations and classpath discovery to enable additional functions.\n\
    \nSpring Cloud is a collection of integrations between third-party cloud technologies\
    \ and the Spring programming model. Some integrations between the Spring programming\
    \ model and third-party technologies. In fewer cases, Spring Cloud technologies\
    \ are usable outside of the Spring programming model, like Spring Cloud Connectors.\n\
    \nFor more information about Spring Cloud Connectors, see the following website:\
    \ http://cloud.spring.io/spring-connectors\n\n### 2.1.2 Dropwizard\n\nDropwizard\
    \ is another technology for creating microservices. It also has an opinionated\
    \ stack with embedded servlet container.\n\n### 2.1.3 Java Platform, Enterprise\
    \ Edition\n\nJava Platform, Enterprise Edition (Java EE) is an open standard for\
    \ building enterprise applications. Java EE technologies like JAX-RS and CDI provide\
    \ support for building microservices.\n\nFor more information about RxJava, see:\n\
    \nhttps://github.com/ReactiveX/RxJava\n\n## 2.2 Versioned dependencies\n\nThe\
    \ twelve factor application methodology was introduced in Chapter 1, “Overview”\
    \ on page 1. Keeping with the second factor, use explicit versions for external\
    \ dependencies. The build artifact that is deployed to an environment must not\
    \ make assumptions about what is provided.\n\nBuild tools like Apache Maven or\
    \ Gradle provide easy mechanisms for defining and managing dependencies. Explicitly\
    \ declaring the version ensures that the artifact runs the same as it did in the\
    \ testing environment.\n\n## 2.3 Identifying services\n\nAs mentioned in Chapter\
    \ 1, “Overview” on page 1, microservices are described as being “small”. The size\
    \ of a service should be reflected in its scope, rather than in the size of its\
    \ codebase. A microservice should have a small, focused scope: it should do one\
    \ thing, and do that thing well. Eric Evans’ *Domain-Driven Design*, describes\
    \ many concepts that are\n"
  mdcn: "\n\n## 1.4 哲学与团队结构\n\n微服务与团队组织之间的关系存在哲学层面的思考。这源于康威法则（Conway's law）²的应用，该法则指出：“任何设计系统的都会不可避免地产生一个结构与其组织通信结构相似的设计。”在《构建微服务》一书中，萨姆·纽曼（Sam\
    \ Newman）将康威法则置于背景中，并用整个章节讨论了组织结构与系统设计之间的交互。\n\n康威法则特别关注不同群体之间的通信与协调。如果组织将数据库管理员隔离在一个独立于应用程序开发人员的组组中，那么产生的架构将具有一个独特的分层，其管理方式对数据库管理员来说是最优的。应用程序开发人员需要与数据库管理员协调他们所需的更改。相反，如果开发团队自己处理数据管理，那么这种协调就是必要的。\n\
    \n转向构建微服务应用程序，应该对组织结构进行讨论，并考虑可能需要哪些变化来精简通信模式，以配合独立微服务的创建和增长。这是 DevOps 与微服务融合中的一个共同点。创建一个能够进行快速且频繁更改的敏捷生态系统，需要精简通信和大量的自动化。\n\
    \n## 1.5 示例\n\n在本书中，我们使用两个示例应用程序来帮助解释概念并提供视角：\n\n- 在线零售商店\n- Game On!\n\n### 1.5.1\
    \ 在线零售商店\n\n在线零售商店是讨论应用程序架构时经常使用的示例。本书考虑了一组微服务，它们共同提供一个用户可以浏览产品并下单的应用程序。\n\n架构包括以下服务：\n\
    \n- 目录服务 (Catalog service)\n  - 包含商店中销售商品的信息。\n- 账户服务 (Account service)\n  - 管理商店每个账户的数据。\n\
    - 支付服务 (Payment service)\n  - 提供支付处理。\n- 订单服务 (Order service)\n  - 管理当前订单列表并执行订单生命周期所需的任务。\n\
    \n> ²“委员会是如何发明的Melvin Conway, Datation magazine, 1968年4月\n\n还有其他方法来构建在线零售商店的服务。选择这组服务是为了说明书中描述的特定概念。我们将构建替代服务留给读者作为的一项练习。\n\
    \n### 1.5.2 Game On!\n\nGame On!^6 是一个使用微服务构建的可扩展基于文本的冒险游戏。与在线商店不同，Game On! 是一个真实的应用程序，代码可以在\
    \ GitHub^7 上找到，并有一个 GitBook^8 深入描述了创建游戏时使用的架构和工具。这个刻意非标准的示例被用来与传统的企业应用程序进行对比。\n\
    \n游戏本质上是一个由连接的房间组成的无尽二维网络。房间由第三方提供（例如，会议或工作讨会的开发者）。一组核心服务提供了一致的用户体验。用户登录并使用简单的文本命令与房间进行交互并在房间之间旅行。系统同时使用了同步和异步的通信模式。玩家、核心服务和第三方服务之间的交互也得到了安全保障。\n\
