    The apiDiscovery feature¹¹ in WebSphere Application Server integrates support
    for Swagger definitions the run time. It automatically detects and scans JAX-RS
    applications for annotations that it generates a Swagger definition dynamically.
    If Swagger annotations are present, information from those annotations is included
    to create informative documentation that can be maintained within the code. This
    generated documentation is made available by a system provided endpoint, as shown
    in Figure 2-4.


    # Liberty REST APIs


    Discover REST APIs available within Liberty


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_32_0.png)


    Figure 2-4 The user interface provided by the apiDiscovery-1.0 feature to APIs


    The Swagger API definition, as rendered in a web interface, is useful for visualizing
    the external, consumer view of the API. Developing or designing the API from this
    external view helps ensure consistency. This external view aligns with Consumer
    Driven Contracts¹², a pattern that advocates designing APIs with a focus on consumer
    expectations.


    # 2.4.3 Use correct HTTP verb


    REST APIs should use standard HTTP verbs for create, retrieve, update, and delete
    operations, with special attention to whether the operation is idempotent (safe
    to repeat multiple times).


    POST operations may be used to Create(C) resources. The distinguishing characteristic
    of a POST operation is that it is not idempotent. For example, if a POST request
    is used to create resources, and it is started multiple times, a new unique resource
    should be created as a result of each invocation.


    > ¹¹ https://developer.ibm.com/wasdev/blog/2016/02/17/exposing-liberty-rest-apis-swagger/


    > ¹² http://martinfowler.com/articles/consumerDrivenContracts.html'
  - '[PAGE 33]


    GET operations must be both idempotent and nullptr. They should cause no side
    effects, and should only be used to Retrieve(R) information. To be specific, GET
    requests with query parameters should not be used to change or update information
    (use POST, PUT, or PATCH instead).


    PUT operations can be used to Update(U) resources. PUT operations usually include
    a complete copy of the resource to be updated, making the operation idempotent.


    PATCH operations allow partial Update(U) of resources. They might or not be idempotent
    depending on how the data is specified and applied to the resource. For example,
    a PATCH operation indicates that a value should be changed from A to B, it becomes
    idempotent. It has no effect if it started multiple times and the value is already
    B. Support for PATCH operations is itself inconsistent. For example, there is
    no @PATCH annotation in JAX-RS for Java EE.


    DELETE operations are not surprisingly used to Delete(D) resources. Delete operations
    are idempotent, as a resource can be deleted once. However, the return code varies,
    as the first operation succeeds (200), while subsequent invocations do not find
    the resource (204).


    # 2.4.4 Create machine-friendly, descriptive results


    An expressive REST API should include careful consideration of what is returned
    from started operations. Given that APIs are started by software instead of users,
    care should be taken to communicate information to the caller in the most efficient
    and effective way.


    As an example, it is common practice to return a 200 (OK) status code along with
    HTML embedding the error message. Although this technique might work for users
    viewing web pages (when the HTTP status is hidden), it is tedious for machines
    determining whether their request succeeded.


    The HTTP status code should be relevant and useful. Use 200 (OK) when everything
    is fine. When there is no response, use a 204 (NO CONTENT) instead. Beyond that,
    a 201 (CREATED) should be used for POST requests that result in the creation of
    a resource, whether there is a body or not. Use a 409 (CONFLICT) when concurrent
    changes occur, or a 400 (BAD REQUEST) when parameters are malformed. The set of
    HTTP status codes is robust, and should be used to express the result of a request
    as specifically as possible. For more, see the following:


    https://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html


    You should also consider what data is returned in your responses to make communication
    efficient. For example, when a resource is created with a POST request, the response
    should include the location of the newly created resource in a Location header.
    You do not need to retrieve additional information about the resource in the response
    body. However, in practice the created resource is usually included in the response
    because it eliminates the need for the caller to make an extra GET request to
    fetch the resource. The same applies for PUT and PATCH requests.


    # 2.4.5 Resource URIs and versioning


    There are varying opinions about some aspects of RESTful URIs. In general, resources
    should be nouns, not verbs, and endpoints should be plural. This technique ensures
    in a clear structure for retrieve, update, and delete operations:


    +   - POST /accounts: Create a new item

    - GET /accounts: Retrieve a list of items'
