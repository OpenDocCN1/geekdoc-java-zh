    ```\n\n### 8.4.3 配置系统\n\n配置微服务系统的另一种方案是使用特殊的服务器。这些配置系统都是某种用于持久化微服务配置的值存储。\n\n\
    根据 Eric Brewer 提出的 CAP 定理，你必须在一致性（Consistency）、可用性（Availability）和分区容错（Partition\
    \ Tolerance）中选择两个。由于微服务系统没有配置系统将无法工作，因此配置系统必须是分区的。这一限制意味着你的配置系统要么在值一致的情况下可用，要么可用性有限但具有一致的值。\n\
    \n以下是微服务环境中使用的配置系统示例：\n\n- Apache ZooKeeper\n  http://zookeeper.apache.org/\n\
    - etcd\n  http://etcd.io/\n- Netflix archaius\n  http://github.com/Netflix/archaius\n\
    - Consul\n  http://www.consul.io/\n\n"
