    \ that the client and server side agreed on included attributes and hash calculation\
    \ as part of producing the library. The shared library simplifies both the API\
    \ provider and the consumer need to deal with.\n\n# 6.2.5 API keys and secrets\n\
    \nAn API key can be one of a few different things, but unique usage is to identify\
    \ the origin of a request. Identifying the origin of a request is important for\
    \ API management functions like rate limiting and usage tracking. API keys are\
    \ usually separate from an account's credentials, enabling them to be created\
    \ or revoked at will.\n\nAn API key is sometimes a single string, unlike a password,\
    \ these strings are randomly generated and over 40 characters long. However, sometimes\
    \ the string is used directly in the request as either a bearer token or query\
    \ parameter (over https). Using an API key is more secure when used as a shared\
    \ secret for signing tokens (JWTs) or for digest methods of authentication (HMACs).\n\
    \nIf your services create API keys, ensure that API keys are securely generated\
    \ with high entropy and stored correctly. Ensure that these keys can be revoked\
    \ at any time. If your application has distinct parts, consider using different\
    \ API keys for each part. This configuration can enable more granular usage tracking,\
    \ and reduces the impact if a key is compromised.\n\nAsymmetric keys can also\
    \ be used (such as SSL), but require a public key infrastructure (PKI) to be maintained.\
    \ Although it is more secure, this configuration is also more labor intensive,\
    \ and can be especially hard to manage when API consumers are third parties.\n\
    \nConsistent with the 12 factors, secrets should be injected configuration when\
    \ used by services for intra-service communication. The values not be hardcoded\
    \ because that increases the likelihood they will be compromised (such as checked\
    \ into a repository in plain text). It either makes your code sensitive to the\
    \ environment, or requires different environments to use the same shared secret,\
    \ neither of which are good practices."
