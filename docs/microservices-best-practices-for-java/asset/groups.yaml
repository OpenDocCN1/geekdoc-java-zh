    ## 8.3.3 容器化


    之前的策略都是运行在操作系统上的，该操作系统必须安装并配置可执行的 JAR 文件。为了避免由于操作系统配置不一致导致的问题，一种策略是将更多的操作系统内容“带在身上”。这种策略导致微服务在每个阶段运行在具有相同配置的操作系统上。


    容器是托管在现有操作系统上的轻量级虚拟化制品。Docker 提供了一种基础设施能力，可以构建一个完整的文件系统，该系统包含了运行应用程序所需的所有操作系统元素（工具、库），包括应用程序本身。Docker
    Engine 是一个轻量级运行时，它提供了 Docker 容器与宿主机之间的抽象和隔离，以及用于处理托管容器的支持工具。有关 Docker 的更多信息，请参阅[此链接](


    http://www.docker.com


    Docker 容器将应用程序与其他应用程序（位于同级容器中）隔离，并将应用程序与宿主机的操作系统分离。这些容器的隔离及其轻量级属性使得在一个操作系统上运行多个
    Docker 容器成为可能（见图 8-1）。这种配置意味着你需要许多虚拟化服务器来托管你的微服务系统。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_109_0.png)


    图 8-1 一个服务器上的多个 Docker 容器


    Docker 是不可变制品。当应用程序构建成 Docker 镜像时，这些镜像就可以在不同的部署环境中启动容器，确保所有环境都使用相同的栈。使用 Docker
    使得具体的打包格式（可执行 JAR、WAR、EAR、ZIP 文件）变得不再重要，因为镜像配置决定了容器如何启动。容器内部微服务的配置值可以通过使用环境变量或挂载卷来提供。


    正如“12要素”中所述，数据存储和其他所有后端不应与微服务本身托管在同一个容器中。这些后端应该被视为服务，这是微服务的一个基本特征。例如，数据存储也可以作为
    Docker 容器进行管理。出于故障转移考虑，你不应该在同一宿主机上运行多个微服务实例。


    ## 8.3.4 每个微服务运行在自己的服务器上


    另一种保持所有阶段操作系统尽可能相同的替代方案是使用相同的虚拟化服务器作为每个阶段的基础。为了实现这一目标，请安装你需要的操作系统和其他工具，并创建该服务器的模板。使用此模板作为所有托管你微服务系统的服务器的基础，这是另一种形式的可变服务器。


    为了管理这些服务和模板，你可以使用虚拟化提供商、云提供商或其他第三方选项提供的工具。目前可用的选项包括 Vagrant²、VMware² 和 VirtualBox2⁴。当与
    Salt 或 Ansible 等软件配置和自动化技术结合时，将微服务虚拟化到单个服务器上可以变得灵活且敏捷。


    这种配置主要导致了两种变体：


    -   在单个虚拟化服务器上打包一个微服务。

    -   在单个虚拟化服务器上打包多个微服务包（见图 8-2）。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_110_0.png)


    当每个虚拟化服务器仅部署一个微服务时，你可以获得从所有其他托管其他微服务的虚拟化服务器中获得良好的隔离。操作系统可以根据其托管的特定微服务的需要进行配置。当发生错误时，由于不需要分离同一台服务器上其他应用程序产生的无关信息或副作用，问题的确定将不会变得复杂。无关应用程序的影响缺失在性能方面也是件的。


    ² http://www.vagrant.com/

    ³ http://www.vmware.com/

    ⁴ http://www.virtualbox.org/


    当应用程序在不同的虚拟化服务器中相互隔离时，它们无法（轻易地）饿死其他应用程序的资源。


    这种替代方案的缺点是，你最终会有许多虚拟化服务器（每个一个微服务实例），必须在你的整个基础设施中对它们进行管理和协调。总资源消耗也更高，因为每个虚拟化服务器都需要自己的操作系统。某些虚拟化解决方案对这个问题有优化，可以帮助减少由多个操作系统导致的处理器使用率。


    在一个虚拟化服务器上运行多个微服务应该只在它们具有相似的资源使用模式时才这样做，这样一个微服务就不会对其他微服务产生不利影响或饿死它们。


    操作系统的配置也必须兼容在同一虚拟化服务器上托管微服务。不同的配置不能相互干扰，也不应在不同阶段之间要求冲突的配置。这种模式通常会减少托管微服务应用程序所需的虚拟化系统数量，代价是共享系统配置。在这种设置下，你还可以使用
    JVM 的共享类配置，这可以缩短微服务的启动时间。


    ## 8.3.5 在一个服务器上运行多个微服务的方面


    以下注释适用于在服务器实例上托管了多一个微服务的部署情况，无论这种配置是通过容器还是虚拟化系统完成的。


    如果你的服务器上有一个以上的微服务，那么请注意你的 Java 运行时的线程池争用。JVM 会查询操作系统以获取有关该服务器 CPU 数量的信息，并使用这些信息来定义管理线程池的策略。对于虚拟硬件，JVM
    经常会获取有关可用 CPU 的错误信息。


    你应该考虑的另一个方面是位于同一服务器上的微服务将如何共享或竞争服务器资源。预先了解每个微服务的需求，以防止资源竞争导致的干扰。例如，微服务内存中的缓存会随着缓存增长而产生问题。因此，通常在外部系统进行缓存。外部缓存服务器应该被视为附加服务，类似于数据存储。


    ## 8.3.6 最佳实践


    从表面上看，在同一服务器上运行包含微服务的多个 Docker 容器与在同一服务器上运行多个微服务包似乎是一样的。但经过进一步审查，这两种部署模式之间存在显著差异。在没有
    Docker 的情况下在服务器上运行多个微服务，只有在所有微服务的操作系统配置相同时可行。然而，Docker 在有效利用主机资源的同时提供了更高水平的隔离。


    以下是打包最佳实践的总结：


    -   虚拟化或云服务是基础设施的基础，因为动态供应可以帮助微服务系统处理变化的容量需求。

    -   系统级配置在所有阶段应尽可能相似，或者通过使用容器与应用程序隔离。

    -   应产生一个不可变制品，并在阶段之间不更改地进行。

    -   微服务的不可变制品应该是独立且自包含的。该项目可以是可执行 JAR 文件或 Docker 容器。

    -   每个不可变制品应仅包含一个微服务应用程序及其支持运行时和库。

    -   在托管共享资源时应考虑资源需求，以防止资源竞争导致的干扰。

    -   共享库应该作为应用程序的一部分构建，而不是共享或作为托管环境提供的依赖。


    图 8-3 显示了一个基于 Java EE 的微服务，它与 Java EE 运行时一起打包在 Docker 容器内部作为虚拟化基础设施。这是托管微服务的最佳实践之一。


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_112_0.png)


    图 8-3 托管在虚拟化基础设施上的 Docker 容器中的 Java Platform, Enterprise Edition 微服务


