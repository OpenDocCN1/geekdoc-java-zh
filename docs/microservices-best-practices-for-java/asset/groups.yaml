    # Preface


    Microservices is an architectural style in which large, complex software applications
    are composed of one or more smaller services. Each of these microservices focuses
    on completing one task that represents a small business capability. These microservices
    are developed in any programming language.


    This IBM® Redbooks® publication covers Microservices best practices for Java.
    It focuses on creating cloud native applications using the latest version of IBM
    WebSphere® Application Server Liberty, IBM Bluemix and other Open Source Frameworks
    in the Microservices ecosystem to highlight Microservices best practices for Java.


    # Authors


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Raleigh Center.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_10_0.png)


    Michael Hofmann has a Master''s degree in Computer Science (Diploma from the Technical
    University of Munich) and a certificate in Economics (Verwaltungs- und Wirtschaftsakademie
    (Munich)). He has been working with Java and Java EE since 1998 in different positions.
    He is currently the manager of a software development department, but always with
    a hands-on mindset. He still works as senior software architect (technical project
    lead) in several large projects. As trainer and coach in Java EE, software architect,
    DevOps consultant, and as a speaker at conferences, he shares his experience with
    others.


    Erin Schnabel is a Senior Software Engineer at IBM. She specializes in compatible
    runtimes and microservice architectures, including the application of object-oriented
    and service-oriented technologies and design patterns to decompose existing software
    systems. Erin has over 15 years of experience in the WebSphere Application Server
    development organization, with 7 years spent as development lead and architect
    for WebSphere Liberty. Erin is passionate about the Java developers'' experience,
    particularly concerning the role of community-driven, standards-compliant software
    in the cloud environment.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_11_0.png)


    **Katherine Stanley** is a Software Engineer at IBM in the WebSphere Application
    Server development organization. She specializes in microservices architectures
    built using Java. As a part of the Liberty team, Katherine has created samples
    to demonstrate industry best practices for microservices. She has run workshops
    and presentations at European conferences, including DevoxUK in London and Jokus
    in Sweden. Katherine has been at IBM since 2014 and is based in the Hurley UK
    lab.


