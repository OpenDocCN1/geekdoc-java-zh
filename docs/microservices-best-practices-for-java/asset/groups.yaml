    \n# 6 # Application Security\n\nAs always, security is an important consideration.\
    \ This chapter describes security requirements within the context of a cloud native\
    \ microservices architecture. The following topics are covered:\n\n- Securing\
    \ microservice architectures\n- Identity and Trust\n\n## 6.1 Securing microservice\
    \ architectures\n\nThe dynamic nature of microservice architectures changes how\
    \ application should be approached. This consideration is specifically relevant\
    \ to how application or service boundaries are defined. Figure 6-1 shows simplified\
    \ representations of how requests flow in monolithic and microservice architectures.\
    \ Connections between microservices and persistent storage services (RDBMS, NoSQL)\
    \ have been hidden for general simplicity, yet represent another dimension of\
    \ network traffic.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_81_0.png)\n\nFigure\
    \ 6-1 Simplified topology for monolithic and microservice architectures\n\nThe\
    \ left side of Figure 6-1 shows a simplification of a traditional monolithic architecture.\
    \ Requests come through the gateway, go through a load balancer, to business logic\
    \ in the middleware, and then down to the data tier.\n\nOn the right side of Figure\
    \ 6-1, things are less organized. Collections of microservices grouped as applications,\
    \ and surface external APIs as endpoints through a gateway. obvious difference\
    \ is the number of moving parts. The other is how many more requests there are.\n\
    \nThe biggest difference is that the composition of services shown on the right\
    \ side are under constant change. Individual service instances come and go based\
    \ on load. Microservices are continuously updated independently. Overall, there\
    \ can be hundreds of updates a day across services. Securing the perimeter is\
    \ not going to be enough. The question is how to secure a rapidly changing infrastructure\
    \ in an organic way that still allows the individual services to change and grow\
    \ without requiring central coordination.\n\n### 6.1.1 Network segmentation\n\n\
    Figure 6-1 on page 68 shows an isolated subnet in both systems. An extra firewall\
    \ or gateway to resources that require more levels of protection is a good idea\
    \ in either environment.\n\nSomething else to observe in microservices approach\
    \ in Figure 6-1 on page 68 is that the exposed APIs are connected to two different\
    \ microservices-based applications. Defined boundaries provide a reasonable amount\
    \ of isolation between independently systems, and are a good way to maintain a\
    \ security posture in a dynamic environment.\n\nNetwork segmentation happens naturally\
    \ in hosted environments. For example, each microservices application that is\
    \ in Figure 6-1 on page 68 can be a separate tenant in a multi-tenant environment.\
    \ Where it does not happen naturally, you might want to.\n\n### 6.1.2 Ensuring\
    \ privacy\n\nDifferent kinds of data require levels of protection:\n\n- Do not\
    \ transmit text.\n- Protect private keys.\n- Use encryption technologies rather\
    \ than inventing your own. For more information about hashing, see:\n- https://crackstation.net/hashing-security\n\
    - Encrypt data as early as possible, and decrypt them as late as possible.\n\n\
    ### Backing services\n\nAs mentioned earlier, connections to backing services\
    \ are additional sources of network traffic that needs to be secured. In many\
    \ cloud environments, backing services are provided by the platform. It is important\
    \ to understand characteristics, especially when they store data at rest.\n\n\
    ### Log data\n\nLog data is a trade-off between what is required to diagnose problems\
    \ and what must be protected for regulatory reasons. When writing to logs, take\
    \ full advantage of log levels to control how much data is written. For user-provided\
    \ data, consider whether it belongs in logs at all. \n\n### 6.1.3 Automation\n\
    \nAs mentioned back in Chapter 1, “Overview” on page 1, as much as possible be\
    \ automated in microservices environments, which includes general operation. Credentials,\
    \ certificates, and keys must be stored somewhere for automation to use. Remember\
    \ the following considerations:\n\n- Do not store your credentials alongside your\
    \ applications.\n- Do not store your credentials in a public repository.\n- Only\
    \ store encrypted values.\n\nSpring Cloud Config, as an example, uses Git to get\
    \ back its configuration. It provides APIs to automatically encrypt configuration\
    \ values on the way into the repository, and decrypt them when you use. For more\
    \ information about Spring Cloud Config, see this website:\n\nhttps://cloud.spring.io/spring-cloud-config/\n\
    \nHashicorp's Vault is similar, but adds extra capabilities to allow use of dynamic\
    \ keys with expiry. For more information about Vault, see the following website:\n\
    \nhttps://www.vaultproject.io/\n\nOther key/value stores, for example etcd, zookeeper,\
    \ or consul, could also be used, but care should be taken with how credentials\
    \ are stored in what are otherwise plain text repositories.\n\n## 6.2 Identity\
    \ and Trust\n\nA highly distributed, dynamic environment like microservices architectures\
    \ place some strain on the usual patterns of establishing identity. You must establish\
    \ and maintain the identity of users without introducing extra latency and contention\
    \ with frequent calls to a centralized service. Establishing and maintaining trust\
    \ through this environment is not the easiest. It is inherently unsafe to assume\
    \ a secure private network. End-to-end SSL can bring some benefit in that bytes\
    \ are not around in plain text, but it does not establish a trusted environment\
    \ on its, and requires key management.\n\nThe following sections outline techniques\
    \ for performing authentication and authorization and identity propagation to\
    \ establish and maintain trust for inter-service communications.\n"
