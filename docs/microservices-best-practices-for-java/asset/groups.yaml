    # 1.5.2 Game On!


    Game On!^6 is an extensible, text-based adventure game built by using microservices.
    Unlike the online store, Game On! is a real application, with code available on
    GitHub^7, and a GitBook^8 describing the architecture and tools that are used
    to create the game in depth. The deliberately non-standard example is used as
    a contrast to traditional enterprise applications.


    The game is essentially a boundless two-dimensional network of connected rooms.
    Rooms are provided by third parties (for example, developers at conferences or
    in workshops). A set of core services provide a consistent user experience. The
    user logs in and uses simple text commands to interact with and travel between
    rooms. Both synchronous and asynchronous communication patterns are used. Interactions
    between players, core services, and third-party services are also secured.


    The architecture of Game On! is described in Chapter 2, “Creating Microservices
    in Java” on page 9.


