    GET /accounts/16 Retrieve a specific item

    PUT /accounts/16 Update a specific item

    PATCH /accounts/16 Update a specific item

    DELETE /accounts/16 Delete a specific item


    The general consensus is to keep things simple with URLs. If you create an application
    that tracks a specific kind of rodent, the URI would be /mice/ and not /mice/,
    if it makes you wince.


    Relationships are nested by nesting URLs, for something like /accounts/16/credentials
    for managing credentials with an account.


    Where there is less agreement with what operations that are associated with the
    resource, but that do not fit within this structure. There is no single correct
    way to manage these operations. Do what best for the consumer of the API.


    For example, Game One!, the Player service provides operations that assist with
    generating users and favorite colors. It is also possible to retrieve, in bulk,
    the location of every player in the game. The structure that chosen reflects operations
    that span all players, still allowing you to work with specific players. This
    technique has its limits, but illustrates the point:


    +   GET /players/accounts Retrieve a list of all players

    POST /players/accounts Create a new player

    GET /players/accounts/(id) Retrieve a specific player

    GET /players/accounts/(id)/location Retrieve a specific player''s location

    PUT /players/accounts/(id)/location Update a specific player''s location

    GET /players/color Return 10 generated colors

    GET /players/name Return 10 generated names

    GET /players/locations Retrieve the location of all players


    # Versioning


    One of the major benefits of microservices is the ability to evolve services independently.
    Given that microservices call other services, independence comes with a giant
    cost. You cannot cause breaking changes in your API.


    The easiest approach to accommodating change is to never break the API. If the
    robustness principle is followed, and both sides are conservative in what they
    say and liberal in what they receive, it can take a long time before a breaking
    change is required. When breaking change finally comes, you can opt to build a
    different service entirely and replace the original over time, perhaps because
    the domain model has evolved and a better abstraction makes sense.


    If you need to make breaking API changes for an existing service, decide how to
    manage those:


    +   - Will the service handle all versions of the API?

    - Will you maintain independent versions of the service to support each version
    of the API?

    - Will your service support only the newest version of the API and rely on other
    adaptive layers to convert from the older API?


    After you decide the hard part, the easiest problem to solve is to reflect the
    version in your API. There are generally three ways to handle versioning a REST
    resource:


    +   - Put the version in the URI

    - Use a custom request header

    - Put the version in the HTTP Accept header and rely on content negotiation'
