  raw:
  - "[PAGE 113]\n\n# 8.4 Configuration of the applications across stages\n\nEvery\
    \ microservice should be an immutable deployment artifact. After it is built,\
    \ it should not be changed for the deployments on different stages. Therefore,\
    \ environment variables, which can change from stage to stage, need to be injected\
    \ from outside of the deployment artifact. In addition to using immutable server\
    \ for deployments, the application configuration should be immutable as far as\
    \ possible. Only change values that are necessary on different server (such as\
    \ port, ip addresses, database users, pool size). The remainder of the application\
    \ configuration stays the same for every stage. The more values that you change,\
    \ the higher the risk of getting failures on the deployment on the next stage.\
    \ If values need to be changed on the subsequent stage, then you should test the\
    \ behavior of your service in the presence to these changes.\n\nConfiguring the\
    \ system of microservices can be done in three different ways:\n\n+   - Environment\
    \ variables\n- Configuration files\n- Configuration systems\n\nThe following sections\
    \ describe these three variants.\n\n# 8.4.1 Environment variables\n\nOne way to\
    \ get the configuration from outside to your microservice is to use environment\
    \ variables. This is a common way to pass values to a running process.\n\nEnvironment\
    \ variables are character-based key value pairs that are mapped to the Java data\
    \ type `java.lang.String`. The way to set these values varies between operating\
    \ systems. Example 8-4 shows how to set these variables in a scripting environment\
    \ to start the microservice.\n\n> Example 8-4 Setting environment variables in\
    \ a Linux Bash script\n```bash\n#!//bin/bash\nexport VARIABLE1=\"Value 1\"\nexport\
    \ VARIABLE2=\"Value 2\"\n```\n\nThe Java sample shown in Example 8-5 shows how\
    \ to parse environment variables.\n\nExample 8-5 Parsing environment variables\n\
    \n```\nMap<String, String> envMap = System.getenv();\nfor (String envVariable\
    \ : envMap.keySet()) {\n    System.out.format(\"%s=%s%n\", envVariable, envMap.get(envVariable));\n\
    }\n```\n\nUsing environment variables is the preferred method compared to passing\
    \ system properties (Java command line option -D) to your microservice because\
    \ in in a Cloud environment, you normally have no access to the command line of\
    \ your process. Cloud environments normally use environment variables."
  - "[PAGE 114]\n\nCloud Foundry for example uses an environment variable called VCAP_SERVICES.\
    \ It is a JSON document that contains information about service instances bound\
    \ to the application. For more information about VCAP_SERVICES, see:\n\nhttp://docs.cloudfoundry.org/devguide/deploy-apps/environment-variable.html#VCAP-SERVICES\n\
    \nExample 8-6 shows VCAP_SERVICES addressing an IBM Cloudant²25 database.\n\n\
    # Example 8-6 VCAP_SERVICES\n\n```\nVCAP_SERVICES=\n{\n  \"cloudantNoSQLDB\":\
    \ {\n    {\n      \"name\": \"myMicroservicesCloudant\",\n      \"label\": \"\
    cloudantNoSQLDB\",\n      \"plan\": \"Shared\",\n      \"credentials\": {\n  \
    \      \"username\": \"xyz\",\n        \"password\": \"password\",\n        \"\
    host\": \"yourhost.yourdomain.com\",\n        \"port\": 443,\\n        \"url\"\
    : \"https://cloudant.yourhost.yourdomain.com\"\n      }\n    }\n  }\n}\n```\n\n\
    Connectors available to parse the VCAP_SERVICES variable. For example, Spring\
    \ Boot has a connector to the VCAP_SERVICES in its configuration service. For\
    \ more information, see this website:\n\nhttp://spring.io/blog/2015/04/27/binding-to-data-services-with-spring-boot-incloud\n\
    \n# 8.4.2 Configuration files\n\nAnother alternative to get configuration values\
    \ from your environment is to use Java Naming and Directory Interface (JNI)²⁶\
    \ which is a Java API to query the directory service. JNI must be provided by\
    \ every Java compatible server. Elements that are defined in the JNI namespace\
    \ can be injected with Java CDI, so accessing these values is easy. To get elements\
    \ into the JNI namespace, they must be added to a configuration file.\n\nIn Liberty,\
    \ this process involves the following steps:\n\n+   1. Activate the JNDI-Feature\
    \ in the server.xml, which is the main configuration file in Liberty, Example\
    \ 8-7. After this you can set your JNDI variable.\n\nExample 8-7 Activate JNDI\
    \ in Liberty and set JNDI variable in server.xml\n\n```\n<server>\n  <featureManager>\n\
    \    <feature>jndi-1.0</feature>\n```\n\n> ²⁵ http://cloudant.com/\n\n> ²⁶ http://de.wikipedia.org/wiki/Java_Naming_and_Directory_Interface"
  - "[PAGE 115]\n\n```\n</featureManager>\n<jndiEntry jName=\"myFirstJNDIEntry\" value='myFirstValue\"\
    />\n</server>\n```\n\n2. Looking up the value for the JNDI entry can be done in\
    \ two ways. You can do it out shown in Example 8-8.\n\nExample 8-8 Parsing JNDI\
    \ value\n\n```\nInitialContext ctx = new InitialContext();\nString jndiValue =\
    \ (String) ctx.lookup(\"myFirstJNDIEntry\");\n```\n\nOr you can use CDI by using\
    \ a field-based injection (Example 8-9).\n\nExample 8-9 Field-based injection\
    \ of JNDI with CDI\n\n```\nPublic class MyClass {\n    @Resource(name=\"myFirstJNDIEntry\"\
    )\n    private String jndiValue;\n}\n```\n\nUsing this technique that the configuration\
    \ files must exist on every stage and have the correct stage values. This configuration\
    \ can be done with tools from the DevOps universe to ensure that the needed file\
    \ with the correct values exists on the target stage.\n\nLoading these files into\
    \ the application within a Liberty server.xml can be done with a URL resource\
    \ that points to the configuration file is stored in the file system (see Example\
    \ 8-10).\n\nExample 8-10 JNDI URL Entry in Liberty\n\n```\n<server>\n<featureManager>\n\
    \    <feature>jndi-1.0</feature>\n</featureManager>\n<jndiURLEntry jndiName=\"\
    myFirstJNDIEntry\"\nvalue=\"file://myDirectory/myConfigFile\" />\n</server>\n\
    ```\n\nIn Liberty, you can use more than one server configuration file. You have\
    \ to include other XML files into server.xml as shown in Example 8-11.\n\nExample\
    \ 8-11 Liberty include of configuration files\n\n```\n<server>\n<featureManager>\n\
    \    <feature> . . </feature>\n</featureManager>\n<include location=\"mySecondConfigFile.xml\"\
    />\n</server>\n```\n\nThe included files parsed and the values are set in the\
    \ application server. This process gives you the opportunity to separate the configuration\
    \ files. Configuration files that have values must be changed on every stage should\
    \ be included in server.xml. The main configuration file (server.xml) should only\
    \ have values that are constant across all stages."
  - "[PAGE 116]\n\nSetting your configuration this way keeps the main configuration\
    \ file (server.xml) the same on every stage.\n\nIn a Docker based environment,\
    \ it is normal to do the configuration with files placed outside the Docker container.\
    \ The Docker container itself stays unchanged and the configuration file must\
    \ be provided by DevOps tools.\n\nSpring Boot also has the opportunity to configure\
    \ the application from outside. It is possible to use properties files, YAML files,\
    \ environment variables, and command line arguments. These values get injected\
    \ into Spring beans and can be used inside your application. For more information,\
    \ see the following:\n\n```\nhttp://docs.spring.io/spring-boot/docs/current/html/boot-features-external-configuration.html\n\
    ```\n\n# ## 8.4.3 Configuration systems\n\nThe there alternative to configure\
    \ the system of microservices is to use special servers. These configuration systems\
    \ are all some kind of value stores to persist the configuration for the different\
    \ microservices.\n\nAccording to the CAP theorem from Eric Brewer, you must choose\
    \ two of the three guarantees consistency, availability, and partition tolerance.\
    \ As the microservice system will not work without the configuration system, the\
    \ configuration system must be partitioned. This limitation means that your configuration\
    \ system will either be available with inconsistent values, or limited availability\
    \ but with consistent values.\n\nThe following are examples of configuration systems\
    \ used in microservice environments:\n\n+   - Apache ZooKeeper\n  http://zookeeper.apache.org/\n\
    - etcd\n  http://cores.com/etcd/\n- Netflix archaius\n  http://github.com/Netflix/archaius\n\
    - Consul\n  http://www.consul.io/\n\nZooKeeper and etcd are CP systems with regard\
    \ to the CAP theorem. Archaius and Consul provide the AP attributes. All of these\
    \ systems can be used in a Java based application. Which one to use, with regard\
    \ to the CAP theorem, depends on the requirements of your microservice application.\n\
    \nThe advantage of using configuration systems is that configuration data can\
    \ be changed at runtime. This cannot be easily achieved without environment variables\
    \ or configuration files. If a bound JNDI value changes, the Liberty server would\
    \ have to be restarted to get the new values into the application. You should\
    \ track the changes in the configuration system to be able to reproduce the values\
    \ later to help you find the reasons for any failures.\n\n> 27 http://en.wikipedia.org/wiki/CAP_theorem"
- md: "\n## 8.4.4 Programming considerations\n\nConfiguring your microservices should\
    \ not be done inside the business logic of your source code. It is better to do\
    \ this configuration in a central place. In most cases, accessing the configuration\
    \ values is based on technical decisions and is not affected by your business\
    \ logic.\n\nIf you configure your system using CDI, then you must deal with changing\
    \ values at runtime. In such situations, annotate the CDI beans with @RequestScoped\
    \ or @Dependent to make sure that the values are refreshed on every request. Some\
    \ of the configuration systems provide callbacks to inform the client when values\
    \ change. In combination with CDI producers @Produces, you can easily adapt your\
    \ configuration system to your application.\n\nThe following examples show how\
    \ CDI way to set the configuration values in your application. First, you must\
    \ define a qualifier that can be used to annotate the injection point @Configuration\
    \ as shown in Example 8-12.\n\nExample 8-12 CDI qualifier\n\n```\n@Qualifier\n\
    @Retention(RUNTIME)\n@Target({METHOD, FIELD, PARAMETER, TYPE })\npublic @interface\
    \ Configuration {\n\n    // Values without binding\n    @Nonbinding\n    String\
    \ value() default \"\";\n}\n```\n\nThe generic producer class (MyConfigProducer)\
    \ Example 8-13 checks the name of the attribute inside the qualifier and returns\
    \ the corresponding value from its configuration cache. The main thing to address\
    \ is the InjectionPoint object that holds the information that is needed by the\
    \ producer that is at the injection point in the EJB as shown in Example 8-14\
    \ on page 105.\n\nExample 8-13 CDI producer\n\n```\npublic class MyConfigProducer\
    \ {\n    private Properties environmentProps;\n    @Produces\n    @Configuration\n\
    \    public String getConfigValue(InjectionPoint ip) {\n        Configuration\
    \ config = ip.getAnnotated(Configuration.class).getAnnotation(Configuration.class);\n\
    \        String configKey = config.value();\n\n        if (configKey.isEmpty())\
    \ {\n            throw new IllegalArgumentException(\n                \"Property\
    \ key missing!\");\n        }\n        String value = environmentProps.getProperty(configKey);\n\
    \        if (value == null) {\n            throw new RuntimeException(\"Property\
    \ value for key \" +\n                configKey + \" could not be found!\");\n\
    \        }\n        return value;\n    }\n}\n}\n```\n\nThe default CDI scope for\
    \ an EJB is @RequestScoped and the default CDI scope when it is not explicit set\
    \ is @default. The producer injects the value on every request that calls the\
    \ EJB. Other CDI scopes can also be used depending on your requirements (Example\
    \ 8-14).\n\nExample 8-14 EJB with injected configuration value\n\n```\n@Stateless\n\
    public class MyEJB {\n  @Inject\n  @Configuration(\"myConfigValue\")\n  private\
    \ String myConfigValue;\n}\n```\n\n## 8.4.5 Preferred practices on configuration\n\
    \nIn summary, the following are the preferred practices when doing configuration:\n\
    \n- Configuration should live outside of the immutable deployment artifact and\
    \ can be supplied by three variations of configuration (environment variables,\
    \ configuration files, and configuration systems). The choice depends on the runtime\
    \ environment that your system of microservices is hosted in.\n- Dynamic configuration\
    \ values should be managed with configuration systems, but your application must\
    \ handle the changing of configuration values.\n- Keep the system as unchanged\
    \ as you can. This guideline is also true for configuration values otherwise to\
    \ minimize the risk of unexpected errors.\n- Change only configuration values\
    \ that must be changed and use a defined way to manage those changes (for example,\
    \ track these changes).\n- The business logic of the microservice should not deal\
    \ with the configuration values. This tracking should be done in a central helper\
    \ class or package.\n\n## Management and Operations\n\nRunning a system of microservices\
    \ has some aspects that differ from running a monolith application. With microservices,\
    \ a single application becomes a distributed system that is made up of a number\
    \ of microservices that communicate with each other. Therefore, you must manage\
    \ a highly distributed system and worry about the communication path between each\
    \ service.\n\nThe number of running services is normally higher than the services\
    \ needed for a monolith application. When load characteristics vary, a microservice\
    \ application should react by adjusting the number of running services. Therefore,\
    \ you must be able to automatically deploy new and remove existing service instances\
    \ to ensure that overall application is running at optimum state.\n\nIn every\
    \ production system, it is necessary to do health checks to get information about\
    \ the state of the running applications. This requirement is also true for a system\
    \ of microservices where you must worry about the health of each service instance.\n\
    \nThis chapter covers the following topics:\n\n- Metrics and health checks\n-\
    \ Logging\n- Templating\n\n## 9.1 Metrics and health checks\n\nMetrics and health\
    \ checks are necessary to get information about the state of a running service.\
    \ As mentioned in 8.3, \"Packaging options\" on page 92 each Java EE-based microservice\
    \ has its own run time packaged together with the microservice code itself. Java\
    \ based runtimes have tools to help the administrators to check the health of\
    \ the running microservice.\n\n### 9.1.1 Dynamic provisioning\n\nWith dynamic\
    \ provisioning, the aim is to automatically keep the system of microservices in\
    \ its optimum state. This state is where the system is properly balanced to match\
    \ the demands of the application users. It can be reached through service instances\
    \ being available to manage throughput and keep latency at a minimum. For example,\
    \ an instance of a microservice becoming overloaded can be compensated by scaling\
    \ up and starting another instance of a service. This change should be done automatically\
    \ without the need for administrator intervention. Similarly, unused microservice\
    \ instances can be returned to the unused resources to your virtualization system.\n\
    \nHowever, in some situations it is necessary to inform the administration when\
    \ some threshold is reached so they can take action. Service discovery as described\
    \ in Chapter 3, \"Locating services\" on page 25 is a key service that is used\
    \ by microservices. The service discovery service tracks available microservice\
    \ instances and the current health state. A new instance of a service should start\
    \ to take requests to reduce load. With this information, load balancing can be\
    \ dynamically performed across available microservice instances. A common pattern\
    \ with microservices operation is to keep a specific number of service instances\
    \ running at all times, or more at a minimum. A microservice application with\
    \ these settings is running within its designed bounds and can scale up to an\
    \ acceptable amount. With the auto scaling feature of Liberty, you can define\
    \ the minimum number of service instances that should be running for a healthy\
    \ system. You can then have system management that keep number alive. A microservice\
    \ that is shutting down should complete running requests and should not receive\
    \ any.\n\nThe following metrics can be used to do auto scaling.\n\nThe scaling\
    \ member monitors the use of the following resources within the server process:\n\
    \n- CPU\n- Heap\n- Memory\n\nThe scaling member monitors the use of the following\
    \ resources at the host level:\n\n- CPU\n- Memory\n\nFor more information, \"\
    Setting up auto scaling for Liberty collectives\" at: http://www.ibm.com/support/knowledgecenter/SSAW57_9_0.0/com.ibm.websphere.wlp.ndd/ae/twlp_wve_autoscaling.html\n\
    \nWhen you start and stop instances of microservices, your service discovery must\
    \ also be informed. One easy way to do this is to inform the HTTP server in front\
    \ of your system of microservices about started or stopped microservices. Liberty\
    \ has a feature that can be combined with the auto scaling feature. The Dynamic\
    \ Routing feature enables routing of HTTP requests to members of Liberty collectives\
    \ without having to regenerate the WebSphere plug-in configuration file when the\
    \ environment changes. The feature provides the Dynamic Routing service, which\
    \ dynamically retrieves routing information from the collective repository and\
    \ delivers this to the WebSphere plug-in.\n\nLiberty servers that take part in\
    \ this functionality must be joined in a collective. A set of Liberty servers\
    \ in a single management domain is called a collective. A collective consists\
    \ of at least one server with the collectiveController-1.0 feature enabled that\
    \ is called a collective controller. Optionally, a collective can have many servers\
    \ with the collectiveMember-1.0 feature enabled that are called collective members\
    \ and a collective can be configured to have many collective controllers.\n"
  mdcn: "\n\n## 8.4.4 编程考虑\n\n配置你的微服务不应该在源代码的业务逻辑中完成。最好在中心位置进行此类配置。在大多数情况下，访问配置值是基于技术决策的，不受业务逻辑的影响。\n\
    \n如果你使用 CDI 配置系统，那么你必须处理运行时的值变化。在这种情况下，请为 CDI Bean 使用 `@RequestScoped` 或 `@Dependent`\
    \ 注解，以确保值在每次请求时都会刷新。某些配置系统提供了回调函数，在值变化时通知客户端。结合 CDI 生产者 `@Produces`，你可以轻松地将配置系统适配到你的应用程序中。\n\
    \n以下示例展示了如何使用 CDI 方式在应用程序中设置配置值。首先，你必须定义一个限定符（Qualifier），如示例 8-12 所示，用于注解注入点 `@Configuration`。\n\
    \n示例 8-12 CDI 限定符\n\n```\n@Qualifier\n@Retention(RUNTIME)\n@Target({METHOD, FIELD,\
    \ PARAMETER, TYPE })\npublic @interface Configuration {\n\n    // 无绑定的值\n    @Nonbinding\n\
    \    String value() default \"\";\n}\n```\n\n通用生产者类（MyConfigProducer）示例 8-13 检查限定符内部属性的名称，并从其配置缓存中返回对应的值。需要解决的关键是\
    \ `InjectionPoint` 对象，它包含了如第 105 页示例 8-14 所示，EJB 中注入点的生产者所需的信息。\n\n示例 8-13 CDI\
    \ 生产者\n\n```\npublic class MyConfigProducer {\n    private Properties environmentProps;\n\
    \    @Produces\n    @Configuration\n    public String getConfigValue(InjectionPoint\
    \ ip) {\n        Configuration config = ip.getAnnotated(Configuration.class).getAnnotation(Configuration.class);\n\
    \        String configKey = config.value();\n\n        if (configKey.isEmpty())\
    \ {\n            throw new IllegalArgumentException(\n                \"Property\
    \ key missing!\");\n        }\n        String value = environmentProps.getProperty(configKey);\n\
    \        if (value == null) {\n            throw new RuntimeException(\"Property\
    \ value for key \" +\n                configKey + \" could not be found!\");\n\
    \        }\n        return value;\n    }\n}\n```\n\nEJB 的默认 CDI 范围是 `@RequestScoped`，未显式设置时的默认\
    \ CDI 范围是 `@default`。生产者会在每次调用 EJB 的请求上注入值。根据你的需求，也可以使用其他的 CDI 范围（示例 8-14）。\n\n\
    示例 8-14 注入了配置值的 EJB\n\n```\n@Stateless\npublic class MyEJB {\n  @Inject\n  @Configuration(\"\
    myConfigValue\")\n  private String myConfigValue;\n}\n```\n\n## 8.4.5 配置的优实践\n\
    \n总结来说，以下是进行配置时的优实践：\n\n- 配置应该存在于不可变的部署构构件之外，并且可以通过三种变体形式的配置（环境变量、配置文件和配置系统）提供。选择取决于你的微服务系统所托管的运行环境。\n\
    - 动态配置值应通过配置系统管理，但你的应用程序必须处理配置值的变化。\n- 尽可能保持系统不变。这一指南同样适用于配置值，以最小化出现意外错误的风险。\n\
    - 仅更改必须更改的配置值，并使用定义的方式来管理这些更改（例如，跟踪这些更改）。\n- 微服务的业务逻辑不应该处理配置值。这种跟踪工作应该在中心辅助类或包中完成。\n\
    \n## 管理与运维\n\n运行微服务系统在某些方面与运行单体应用有所不同。通过微服务，单个应用程序变成了一个分布式系统，由许多个相互通信的微服务组成。因此，你必须管理一个高度分布的系统，并担心每个服务之间的通信路径。\n\
    \n运行的服务数量通常比单体应用所需的服务要多。当负载特征发生变化时，微服务应用程序应该通过调整运行服务的数量做出反应。因此，你必须能够自动部署新实例并移除现有的服务实例，以确保整个应用程序处于最佳状态。\n\
    \n在每个生产系统中，都有必要进行健康检查以获取运行应用程序的状态信息。这一要求对于微服务系统同样适用，你必须担心每个服务实例的健康状况。\n\n本章涵盖了以下主题：\n\
    \n- 指标与健康检查\n- 日志\n- 模板化\n\n## 9.1 指标与健康检查\n\n指标和健康检查对于获取运行服务的状态信息是必要的。如 8.3 节提到的第\
    \ 92 页的“打包选项”，每个基于 Java EE 的微服务都有其自己的运行时，与微服务代码本身打包在一起。基于 Java 的运行时具有工具帮助管理员检查运行中微服务的健康状况。\n\
    \n### 9.1.1 动态供应\n\n通过动态供应，目标是使微服务系统自动保持在最佳状态。这种状态是指系统经过良好平衡，以匹配应用程序用户的需求。这可以通过可用的服务实例来管理吞吐量并将延迟降至最低来实现。例如，当一个微服务实例过载时，可以通过扩容并启动另一个服务实例来补偿。这种更改应该自动完成，不需要管理员干预。同样，未使用的微服务实例可以返回到你虚拟化系统的空闲资源中。\n\
    \n然而，在某些情况下，当达到某些阈值时需要通知管理员以便他们采取行动。如第 3 章第 25 页“定位服务”描述的服务发现是微服务使用的一项关键服务。服务发现服务跟踪可用的微服务实例和当前状态。通过此信息，可以在可用微服务实例之间进行动态负载均衡。微服务运行的一种常见模式是始终运行特定数量的服务实例。具有这些设置的微服务应用程序在设计范围内运行，并扩展到可接受的数量。通过\
    \ Liberty 的自动伸缩功能，你可以定义健康系统应运行的服务实例最小数量。你就可以让系统管理保持存活。正在关闭的微服务应该完成正在进行的请求，并且不再接收任何新请求。\n\
    \n可以使用指标执行自动伸缩。\n\n伸缩成员监控服务器进程内的以下资源使用：\n\n- CPU\n- 堆\n- 内存\n\n伸缩成员监控主机级别的以下资源使用：\n\
    \n- CPU\n- 内存\n\n更多信息请参阅“为 Liberty 集群设置自动伸缩”：http://www.ibm.com/support/knowledgecenter/SSAW57_9_0.0/com.ibm.websphere.wlp.ndd/ae/twlp_wve_autoscaling.html\n\
    \n当你启动和停止微服务实例时，必须通知服务发现。一种简单的方法是通知微服务系统前面的 HTTP 服务器已启动或停止的微服务。Liberty 有一个可以与自动伸缩功能相结合的功能。动态路由功能允许在环境变化时无需重新生成\
    \ WebSphere 插件配置文件。该功能提供了动态路由服务，该服务从集合存储库中动态检索路由信息并将其传递给 WebSphere 插件。\n\n"
