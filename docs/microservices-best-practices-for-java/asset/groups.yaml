  - '[PAGE 29]


    # Internal structure


    Structure your code inside a service so that you have a clear separation of concerns
    to facilitate testing. Calls to external services should be separate from the
    domain logic, which should also be separate from logic specific to marshalling
    data/from a backing data service.


    Figure 2-3 shows a simplified version of a microservice architecture. This architecture
    separates the domain logic from any code that interacts with or understands external
    services. The architecture is similar to the Ports and Adapters (Hexagonal) architecture^5,
    and to Toby Clemenson''s approach in "Testing Strategies in a Microservice Architecture"^6.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_29_0.png)


    Figure 2-3 The internal structure of a microservice


    The example structure considers the following elements:


    +   - Resources expose JAX-RS resources to external clients. This layer handles
    validation of requests and passes the information into the domain layer.

    - Domain logic, as a general concept, takes many forms. In Boundary-Entity-Control
    patterns, domain logic represents the entity itself, with parameter validation,
    state change, and so on.

    - Repositories are optional, but can provide a useful abstraction over the core
    application domain logic and data store when present. This configuration allows
    the backing data store to be changed or replaced without extensive changes to
    the domain logic.

    - Service connectors are similar to the Repository abstraction, encapsulating
    communications with other services. This layer functions as either a facade or
    "anti-corruption" layer to protect domain logic from changes to external resource
    APIs, or to convert between API formats and internal model constructs.


    > 5 http://alistair.ckburn.com/#Hexagonal/architecture

    6 http://martinflower.com/articles/microservice-testing/#anatomy-modules


    16 Microservices Best Practices for Java **'
  - '[PAGE 30]


    This architecture does require you to follow a few rules when creating classes.
    For example, each class that you use to implement your service should perform
    one of these tasks:


    +   - Perform domain logic

    - Ex resources

    - Make external calls to other services

    - Make external calls to a data store


    These are general recommendations for code structure that do not have to be followed
    strictly. The important characteristic is to reduce the risk of making changes.
    For example, if you want to change the data store, you only need to update the
    repository layer. You do not have to search through every class looking for the
    methods that call the data store. If there are API calls to external services,
    these changes can similarly be contained within the service connector. This separation
    further simplifies testing, as described in Chapter 7, "Testing" on page 77.


    # 2.3.4 Shared library or new service?


    A common principle in Agile and Object Oriented methodologies is "don''t repeat
    yourself" (DRY). Repeating the same code multiple times indicates that code should
    be turned into a reusable "thing". In traditional OO, this is an object, or perhaps
    a utility class. However, in the case of obvious utility classes, strict application
    of DRY principles is the end of decoupled modules.


    Microservices development makes backsliding into code spaghetti difficult. Hard
    process boundaries may overshadow of implementation details much harder, but sadly
    not impossible. So, what do you do with code?


    +   - Accept that there be some redundancy

    - Wrap code in a shared, versioned library

    - Create an independent service


    Depending on the nature of the code, it is best to accept redundant code and move
    on. Given that each service can and evolve independently, the needs of the service
    over time might change the stage of that initially common code.


    It is especially tempting to create shared libraries for Data Transfer Objects,
    which are thin classes that serve as vehicles to change and from the wire format
    (using JSON). This technique can eliminate a lot of boilerplate code, but it can
    leak implementation details and introducing coupling.


    Client libraries are recommended to reduce duplication and make it easier to consume
    APIs. This has been the norm for data stores, including new NoSQL stores that
    provide REST-based APIs. Client libraries can be useful for other services as
    well, especially those using binary protocols. However, client libraries do introduce
    coupling between the service consumer and provider. The service may also be harder
    to consume for platforms or languages that do not have well-maintained libraries.


    Shared libraries also be used to ensure consistent processing for potentially
    complex algorithms. For Game Oni, for example, a shared library is used to encapsulate
    request signing and signature verification, which is described in more detail
    in Chapter 6, "Application Security" on page 67. This configuration allows you
    to simplify services within the system and ensure that values are computed consistently.
    However, we do not provide a library for all languages, so some services still
    must do it the hard way.'
  - '[PAGE 31]


    When should a shared library really be an independent service? An independent
    service is independent of the language used, can scale separately, and can allow
    updates to take effect immediately without requiring coordinated updates to consumers.
    An independent service also adds extra processing, and is subject to all of the
    concerns with inter-service communication that are mentioned in Chapter 4, "Microservice
    communication" on page 33. It is a judgment call when to make the trade-off, although
    if a library requires backing services, that is generally a clue that it is a
    service in its own right.


    # # 2.4 Creating REST APIs


    So, what does a microservices API look like? Designing and documenting your APIs
    is important to ensure that it is useful and usable. Following conventions and
    using good versioning policies can make the API easier to understand and evolve
    over time.


    # # 2.4.1 Top down or bottom up?


    When creating from scratch, you can either define the APIs that you need first
    and write your code to fulfill the APIs, or the code for the first service and
    derive your APIs from the implementation.


    In principle, the first option is always better. A microservice does not operate
    in isolation. It is either calling, or something is calling it. The interactions
    between services in a microservices architecture should be well defined and well
    documented. Concerning domain design, APIs are the intersection points between
    bounded contexts.


    As Alan Perlis says, "Everything should be built from the top down, except the
    first time." When making a proof of concept, you might be unclear about what APIs
    you are providing. In those early days, write something that helps to refine ideas
    about what it is that you are trying to do. However, after you have a better understanding
    of what your service needs to do, you should go back and refine the domain model
    and the external APIs to market.


    # # 2.4.2 Document APIs


    Using tools to document your APIs can make it easier to ensure accuracy and correctness
    of the published documentation, which can then be used in discussions with API
    consumers. This documentation can also be used for your driven contract tests
    (see Chapter 7, "Testing" on page 77).


    The Open API Initiative (OAI)⁸ is a consortium focused on standardizing RESTful
    APIs are described. The OpenAPI specification⁹ is based on Swagger¹, which defines
    the structure and format of metadata used to create a Swagger representation of
    a RESTful API. This definition is usually expressed in a single file (swagger.json
    by convention, though YAML is supported by using swagger.yaml). The Swagger definition
    can be created using visual editors or generated by scanning annotations in the
    application. It can be used to generate client or server stubs.


