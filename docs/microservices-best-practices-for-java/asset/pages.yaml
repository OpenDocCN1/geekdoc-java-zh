  md: '# 6.1 Securing microservice architectures


    The dynamic nature of microservice architectures changes how application should
    be approached. This consideration is specifically relevant to how application
    or service boundaries are defined. Figure 6-1 shows simplified representations
    of how requests flow in monolithic and microservice architectures. Connections
    between microservices and persistent storage services (RDBMS, NoSQL) have been
    hidden for general simplicity, yet represent another dimension of network traffic.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_81_0.png)


    Figure 6-1 Simplified topology for monolithic and microservice architectures


    The left side of Figure 6-1 shows a simplification of a traditional monolithic
    architecture. Requests come through the gateway, go through a load balancer, to
    business logic in the middleware, and then down to the data tier.


    On the right side of Figure 6-1, things are less organized. Collections of microservices
    grouped as applications, and surface external APIs as endpoints through a gateway.
    obvious difference is the number of moving parts. The other is how many more requests
    there are.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'The biggest difference is that the composition of services shown on the right
    side are under constant change. Individual service instances come and go based
    on load. Microservices are continuously updated independently. Overall, there
    can be hundreds of updates a day across services. Securing the perimeter is not
    going to be enough. The question is how to secure a rapidly changing infrastructure
    in an organic way that still allows the individual services to change and grow
    without requiring central coordination.


    # ## 6.1.1 Network segmentation


    Figure 6-1 on page 68 shows an isolated subnet in both systems. An extra firewall
    or gateway to resources that require more levels of protection is a good idea
    in either environment.


    Something else to observe in microservices approach in Figure 6-1 on page 68 is
    that the exposed APIs are connected to two different microservices-based applications.
    Defined boundaries provide a reasonable amount of isolation between independently
    systems, and are a good way to maintain a security posture in a dynamic environment.


    Network segmentation happens naturally in hosted environments. For example, each
    microservices application that is in Figure 6-1 on page 68 can be a separate tenant
    in a multi-tenant environment. Where it does not happen naturally, you might want
    to encourage it. However, describing the best practices for managing networks
    in microservices architectures is well outside the scope of this publication.


    # ## 6.1.2 Ensuring data privacy


    Different kinds of data require different levels of protection, and that can influence
    data is accessed, how it is transmitted, and how it is stored.


    When dealing with data, take into account these considerations:


    +   - Do not transmit text passwords.

    - Protect private keys.


    +   - Use data encryption technologies rather than inventing your own.

    - Secure store passwords by using salted hashes. For more information about salted
    hashing, see the following website:

    - https://crackstation.net/hashing-security.htm


    +   - Further, sensitive data should be encrypted as early as possible, and decrypted
    as late as possible. Sensitive data must flow between services, only so that it
    is encrypted, and should not be decrypted until the data needs to be used. This
    process can prevent accidental exposure in logs, for example.


    # ### Backing services


    As mentioned earlier, connections to backing services are additional sources of
    network traffic that needs to be secured. In many cloud environments, backing
    services are provided by the platform, relying on multi-tenancy and API keys or
    access tokens provide data isolation. It is important to understand the characteristics
    of backing services, especially when they store data at rest, to ensure regulatory
    requirements (HIPAA, PCI, and so on) are satisfied.'
