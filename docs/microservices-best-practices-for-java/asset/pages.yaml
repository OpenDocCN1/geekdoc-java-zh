  md: "Setting your configuration this way keeps the main configuration file (server.xml)\
    \ the same on every stage.\n\nIn a Docker based environment, it is normal to do\
    \ the configuration with files placed outside the Docker container. The Docker\
    \ container itself stays unchanged and the configuration file must be provided\
    \ by DevOps tools.\n\nSpring Boot also has the opportunity to configure the application\
    \ from outside. It is possible to use properties files, YAML files, environment\
    \ variables, and command line arguments. These values get injected into Spring\
    \ beans and can be used inside your application. For more information, see the\
    \ following:\n\n```\nhttp://docs.spring.io/spring-boot/docs/current/html/boot-features-external-configuration.html\n\
    ```\n\n# ## 8.4.3 Configuration systems\n\nThe there alternative to configure\
    \ the system of microservices is to use special servers. These configuration systems\
    \ are all some kind of value stores to persist the configuration for the different\
    \ microservices.\n\nAccording to the CAP theorem from Eric Brewer, you must choose\
    \ two of the three guarantees consistency, availability, and partition tolerance.\
    \ As the microservice system will not work without the configuration system, the\
    \ configuration system must be partitioned. This limitation means that your configuration\
    \ system will either be available with inconsistent values, or limited availability\
    \ but with consistent values.\n\nThe following are examples of configuration systems\
    \ used in microservice environments:\n\n+   - Apache ZooKeeper\n  http://zookeeper.apache.org/\n\
    - etcd\n  http://cores.com/etcd/\n- Netflix archaius\n  http://github.com/Netflix/archaius\n\
    - Consul\n  http://www.consul.io/\n\nZooKeeper and etcd are CP systems with regard\
    \ to the CAP theorem. Archaius and Consul provide the AP attributes. All of these\
    \ systems can be used in a Java based application. Which one to use, with regard\
    \ to the CAP theorem, depends on the requirements of your microservice application.\n\
    \nThe advantage of using configuration systems is that configuration data can\
    \ be changed at runtime. This cannot be easily achieved without environment variables\
    \ or configuration files. If a bound JNDI value changes, the Liberty server would\
    \ have to be restarted to get the new values into the application. You should\
    \ track the changes in the configuration system to be able to reproduce the values\
    \ later to help you find the reasons for any failures.\n\n> 27 http://en.wikipedia.org/wiki/CAP_theorem"
