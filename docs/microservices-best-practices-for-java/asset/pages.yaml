    \ are the preferred practices when doing configuration:\n\n+   - Configuration\
    \ should live outside of the immutable deployment artifact and can be supplied\
    \ by three variations of configuration (environment variables, configuration files,\
    \ and configuration systems). The choice depends on the runtime environment that\
    \ your system of microservices is hosted in.\n\n+   - Dynamic configuration values\
    \ should be managed with configuration systems, but your application must handle\
    \ the changing of configuration values.\n\n+   - Keep the system as unchanged\
    \ as you can. This guideline is also true for configuration values otherwise to\
    \ minimize the risk of unexpected errors.\n\n+   - Change only configuration values\
    \ that must be changed and use a defined way to manage those changes (for example,\
    \ track these changes).\n\n+   - The business logic of the microservice should\
    \ not deal with the configuration values. This tracking should be done in a central\
