  pgno: 50
- img_proc: true
  md: "usually in the form of JSON data that is passed from service to service. It\
    \ is unrealistic to assume that these input and output attributes will never change.\
    \ Even in the best design application, requirements are constantly changing, causing\
    \ attributes to be added, removed, and changed. To be resilient against these\
    \ forms of changes, the producer of a microservice must consider the APIs they\
    \ produce, and the APIs they consume. For more best practices concerning defining\
    \ APIs versioning, see Chapter 2: \"Creating Microservices in Java\" on page 9.\n\
    \n# Consuming APIs\n\nAs the consumer of an API, it is necessary to validation\
    \ on the response you receive to check that it contains the information needed\
    \ for the function being performed. If you are receiving JSON, you also need to\
    \ parse the JSON data before any Java transformations. When doing validation or\
    \ JSON parsing, you must do these two things:\n\n+   - Validate the request against\
    \ the attributes that you need\n- Do not validate variables just because they\
    \ are provided. If you are not using them as part of your request, do not rely\
    \ on them being there.\n\n+   - Accept unknown attributes\n- Do not issue an exception\
