- img_proc: true
  md: '# 8.1 Deployment patterns


    A traditional monolith is built and deployed as one unit. A deployment monolith
    is built of many parts, many individual Java Platform, Enterprise Edition archives,
    for example, that are combined into one deployed artifact. Microservices, by contrast,
    are many different pieces that are all deployed independently. This configuration
    provides more flexibility in how consumers are exposed to service changes:


    +   - Blue/Green Deployment


    Blue/Green deployments are a common pattern for monoliths. The key aspect of this
    approach is that you are maintaining two versions of your environment that one
    can be used as a rollback to the other if a deployment failure occurs. The process
    goes something like this:


    +   a. You have a Blue system that is active and running.

    b. You set up the Green system, test it, verify it is working properly, and then
    switch traffic to the Green system. The Blue system is left alone as a rollback
    if something fails as traffic moves to the Green system.

    c. After the Green system is stable, the Blue system is prepared with the next
    outing, and the process is repeated to switch from the Green system back to the
    Blue system.


    In the microservices context, this replicated environment still applies. Each
    system (Blue and Green) contains all of your microservices running with stable
    versions in a configuration that works. Periodic, coordinated updates of otherwise
    uncoupled services can be managed this way, with updates getting and stabilized
    with each other into a known system that is enabled (or disabled) as a set.


    +   - Canary Releasing


    Canary releases are also known as phased or incremental rollout. A canary release
    aims to discover and confirm fault when deploying a new service. Just as Blue/Green
    deployments, canary releases start with a duplicated environment. After the new
    function is introduced into one of the two systems, traffic is gradually (and
    selectively) routed to the new function to ensure it behaves and performs as expected.


    +   - Toggling


    Feature toggles are flags that are used inside the service to enable or disable
    new function. This process can be effectively used to allow service customers
    to opt in testing new function (perusing custom HTTP headers) without having maintaining
    different versions of the service or engineer coordinated releases. Toggling is
    common in monolithic environments, too, as to prevent behavior changes from impacting
    customers.


    Toggles can be set in the environment such that a service has either the function
    enabled or does not. They can be dynamic configuration settings that act as a
    binary mode for the service, or they can be combined with per request mechanisms
    like HTTP headers to turn new functions on or off per request.


    Toggles can be used to make decisions, which allows them to be a selector for
    service-centric canary releases. They can also be used for A/B testing, where
    you are trying to make a side-by-side comparison of alternative implementations.'
  merge: -1
