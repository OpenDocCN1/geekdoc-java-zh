  md: 'To implement the strategy, every microservice should have its own schema in
    a relational database, you can set the default schema for your service in the
    JPA configuration file persistence.xml.


    # 5.2.2 Enterprise JavaBeans


    Enterprise JavaBeans 3.2 (EJB) (specified in the JSR 345 is part of the Java EE
    specification. EJBs are more than normal Java classes for these reasons:


    +   - They have a lifecycle.

    - They are managed by an EJB container (runtime environment for the EJB).

    - They have lot more features that can be helpful.


    EJBs are server-side software components. Since EJB 3.0, it is no longer necessary
    to use a Deployment Descriptor. All declarations of an EJB can be done with annotations
    in the EJB class itself. The implementation to handle the EJB inside an EJB container
    is as lightweight as is for CDI beans. The thread handling of EJBs is done by
    the EJB container (similar to thread handling in a servlet container). An additional
    feature of EJBs is that they can be used in combination with Java EE Security.


    EJBs can be divided into the following types:


    +   - Stateless

    - Stateful

    - Singleton

    - Message-driven beans (MDB)


    Stateless EJBs cannot hold any state, but stateful EJBs can. Due to the characteristics
    of a microservice, stateful EJBs should not be used in a microservice. A Singleton
    exists only one time in a EE server. MDBs are used in the processing of asynchronous
    messages in combination with a JMS provider.


    EJBs can implement several business views, which must be annotated accordingly:


    +   - Local interface (@Local)

    - Remote interface (@Remote)

    - No interface (@FactoryBean)


    Methods in this Interface can only be called by clients in the same Java virtual
    machine (JVM).

    Methods that are listed in this interface can be called by clients outside the
    JVM.

    Nearly as as local interface, except all public methods of the EJB class are exposed
    to the client.


    In a lightweight architecture, which a microservice should handle, it is useful
    to implement the EJBs as no remote EJBs.


    One of the main benefits that EJBs provide is automatic transaction handling.
    Every time a business method is called, the transaction manager of the EJB container
    is invoked (exception: an EJB with explicitly switched off support for transactions).
    So it is easy to use EJBs in combination with a transactional data store. Integrating
    EJBs with JPA is easy.


    > 13 http://jcp.org/en/jsr/detail?id=345'
