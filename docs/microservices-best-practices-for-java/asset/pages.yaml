    # 2.3.2 Translating domain elements into services


    Domain models contain a few well-defined types:


    +   - An Entity is an object with a fixed identity and a well-defined "thread
    of continuity" or lifecycle. An cited example is a Person (an Entity). Most systems
    need to track a Person uniquely, regardless of name, address, or other attributes.

    - Value Objects do not have a well-defined identity, but are instead defined only
    by their attributes. They are typically immutable so that two value objects remain
    equal over time. Address could be a value object that is associated with a Person.

    - An Aggregate is a cluster of related objects that are treated as a unit. It
    has a specific entity as its root, and defines a clear boundary for encapsulation.
    It is not just a list.

    - Services are used to represent operations or activities that are not natural
    parts of entities or value objects.


    # Domain elements in Game On!


    As mentioned in 1.3.1, “The meaning of "small" on page 4, the game was built around
    the notion of a Player, an obvious Entity. Players have a fixed ID, and exist
    for as long as the player''s account does. The player entity has a set of value
    objects, including the player''s name, favorite color, and location.


    The other significant element of the game, rooms, do not map obviously to an Entity.
    For one thing, room attributes change in various ways over time. These changeable
    attributes are represented by a Value Object containing attributes like the room
    name, descriptions of its entrances, and its public endpoint. Further, the placement
    of rooms in the map can change over time. If you consider every possible room
    as a Site, you end up with the notion of a Map as an Aggregate of unique Site
    entities, where each Site is associated with changeable attributes.


    # Mapping domain elements into services


    Converting domain elements into microservices can be done by following a few general
    guidelines:


    +   - Convert Aggregates and Entities into independent microservices, by using
    representations of Value Objects as parameters and return values.

    - Align Domain services (those not attached to an Aggregate or Entity) with independent
    microservices.

    - Each microservice should handle a single complete business function.'
