    Michael Hofmann has a Master''s degree in Compute Science (Diploma from the Technical
    University of Munich) and a certificate in Economics (Verwaltungs- und Wirtschaftsakademie
    (Munich)). He has been working with Java and Java EE since 1998 in different positions.
    He is currently the manager of a software development department, but always with
    a hands-on mindset. He still works as senior software architect (technical project
    lead) in several large projects. As trainer and coach in Java EE, software architect,
    DevOps consultant, and as a speaker at conferences, he shares his experience with
    others.


    Erin Schnabel is a Senior Software Engineer at IBM. She specializes in compatible
