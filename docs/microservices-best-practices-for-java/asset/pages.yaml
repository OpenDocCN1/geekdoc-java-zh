  md: 'This architecture does require you to follow a few rules when creating classes.
    For example, each class that you use to implement your service should perform
    one of these tasks:


    +   - Perform domain logic

    - Ex resources

    - Make external calls to other services

    - Make external calls to a data store


    These are general recommendations for code structure that do not have to be followed
    strictly. The important characteristic is to reduce the risk of making changes.
    For example, if you want to change the data store, you only need to update the
    repository layer. You do not have to search through every class looking for the
    methods that call the data store. If there are API calls to external services,
    these changes can similarly be contained within the service connector. This separation
    further simplifies testing, as described in Chapter 7, "Testing" on page 77.


    # 2.3.4 Shared library or new service?


    A common principle in Agile and Object Oriented methodologies is "don''t repeat
    yourself" (DRY). Repeating the same code multiple times indicates that code should
    be turned into a reusable "thing". In traditional OO, this is an object, or perhaps
    a utility class. However, in the case of obvious utility classes, strict application
    of DRY principles is the end of decoupled modules.


    Microservices development makes backsliding into code spaghetti difficult. Hard
    process boundaries may overshadow of implementation details much harder, but sadly
    not impossible. So, what do you do with code?


    +   - Accept that there be some redundancy

    - Wrap code in a shared, versioned library

    - Create an independent service


    Depending on the nature of the code, it is best to accept redundant code and move
    on. Given that each service can and evolve independently, the needs of the service
    over time might change the stage of that initially common code.


    It is especially tempting to create shared libraries for Data Transfer Objects,
    which are thin classes that serve as vehicles to change and from the wire format
    (using JSON). This technique can eliminate a lot of boilerplate code, but it can
    leak implementation details and introducing coupling.


    Client libraries are recommended to reduce duplication and make it easier to consume
    APIs. This has been the norm for data stores, including new NoSQL stores that
    provide REST-based APIs. Client libraries can be useful for other services as
    well, especially those using binary protocols. However, client libraries do introduce
    coupling between the service consumer and provider. The service may also be harder
    to consume for platforms or languages that do not have well-maintained libraries.


    Shared libraries also be used to ensure consistent processing for potentially
    complex algorithms. For Game Oni, for example, a shared library is used to encapsulate
    request signing and signature verification, which is described in more detail
    in Chapter 6, "Application Security" on page 67. This configuration allows you
    to simplify services within the system and ensure that values are computed consistently.
    However, we do not provide a library for all languages, so some services still
    must do it the hard way.'
