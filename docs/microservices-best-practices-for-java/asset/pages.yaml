    \ Long id;\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private\
    \ String description;\n    @Temporal(TemporalType.DATE)\n    private Date orderDate;\n\
    \    public String getDescription() {\n        return description;\n    }\n  \
    \  public void setDescription(String description) {\n        this.description\
    \ = description;\n    }\n    public Date getOrderDate() {\n        return orderDate;\n\
    \    }\n    public void setOrderDate(Date orderDate) {\n        this.orderDate\
    \ = orderDate;\n    }\n}\n```\n\nEvery entity class needs an @Entity annotation\
    \ to be managed by the persistence provider. The entity class maps by name to\
    \ the corresponding table in the database (convention over configuration). Different\
    \ mappings can also be applied. The attributes of the class get mapped by name\
    \ to the columns of the underlying table. The automatic mapping of the attributes\
    \ can also be overwritten with @Column. Every entity class must have an identity\
    \ (see Domain-Driven Design in Mapping data elements into services on page 13).\
    \ The identity column (or columns), annotated with @Id are necessary for the persistence\
    \ provider to map the values of the object to the data row in the table. The value\
    \ of the identity column can be generated in different ways by the database or\
    \ the persistence provider. Some of the attributes must be transformed in a special\
    \ way to be stored. For example, a database column DATE must be mapped in the\
    \ entity class with the annotation @Temporal.\n\nThe JPA interface used to query\
    \ the database to create, read, update, and delete data from the database. There\
    \ are different ways to get a reference to the EntityManager, depending on the\
    \ environment that the application is running. In an unmanaged environment (no\
    \ servlet, EJB, or CDI container) you must use a factory method of the EntityManagerFactory\
    \ as shown in Example 5-2.\n\nExample 5-2 How to get an EntityManager in a Java\
    \ SE environment\n\n```\nEntityManagerFactory entityManagerFactory = Persistence.createEntityManagerFactory(\"\
    OrderDB\");\nEntityManager entityManager = entityManagerFactory.createEntityManager();\n\
    ```\n\n12 http://docs.oracle.com/java7/api/persistence/EntityManager.html\n\n\
    Chapter 5. Handling data 51"
