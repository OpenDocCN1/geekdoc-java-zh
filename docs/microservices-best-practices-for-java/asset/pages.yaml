  md: "Examples of built-in constraints in the javax.validation.constraints package\
    \ are shown in\nExample 5-17.\n\nExample 5-17 Default built-in constraints in\
    \ Bean Validation\n\n```\nprivate String username; // username must not be null\n\
    @Pattern(regexp=\"\\\\\\d{3}-\\\\\\\\d{3}-\\\\\\\\d{4}\")\nnprivate String phoneNumber;\
    \ // phoneNumber must match the regular expression\n@Size(min=2, max=40)\nprivate\
    \ String briefmessage; // briefMessage between 2 and 40 characters\n```\n\nConstraints\
    \ can also be combined as shown in Example 5-18.\n\nExample 5-18 Combination of\
    \ constraints\n\n```\n@NotNull\n@Size(min=1, max=16)\nprivate String firstName;\n\
    ```\n\nIt is possible to extend the constraints (custom constraints). Example\
    \ 5-19 shows how to\ndo do the validation on your own.\n\nExample 5-19 Validating\
    \ programmatically\n\n```\nOrder order = new Order(\"This is a description\",\
    \ null);\nValidatorFactory factory =\nValidation.buildDefaultValidatorFactory();\n\
    Validator validator = factory.getValidator();\nSet<ConstraintViolation<Order>>\
    \ constraintViolations = validator.validate(order);\nassertEquals(2, constraintViolations.size());\n\
    assertEquals(\"Id may not be null\");\nconstraintViolations.iterator().next().getMessage()\
    \ );\nassertEquals(\"Order may not be null\");\nconstraintViolations.iterator().next().getMessage()\
    \ );\n```\n\nJPA can be configured to do the bean validation automatically. The\
    \ JPA specification\nmandates that a provider must provide validation so managed\
    \ classes (see\nExample 5-20). Managed classes in the sense of JPA are, for example,\
    \ entity classes. All\nother classes used for the JPA programming must be validated\
    \ (for example, embedded\nclasses, super classes). This process must be done in\
    \ the lifecycle events these managed\nclasses are involved.\n\nExample 5-20 Persistence.xml\
    \ with bean validation turned on\n\n```\n<persistence>\n  <persistence-unit name=\"\
    OrderDB\">\n    <provider>\n      org.eclipse.persistence.jpa.PersistenceProvider\n\
    \    </provider>\n    <class>...</class>\n    <properties>\n      <property name=\"\
    javax.persistence.validation.mode\"\n        value=\"AUTO\" />\n    </properties>\n\
    \  </persistence-unit>\n</persistence>\n```"
