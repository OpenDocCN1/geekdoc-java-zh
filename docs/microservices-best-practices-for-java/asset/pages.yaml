  md: 'A simpler approach might be to perform authentication with an OAuth provider
    by using a gateway. If you take this approach, it is still a good idea to convert
    provider-specific tokens into an internal facing token that contains the information
    that you need.


    # 6.2.3 JSON Web Tokens


    Identity propagation is another challenge in a microservices environment. After
    the user (human or service) has been authenticated, identity needs to be propagated
    to the next service in a trusted way. Frequent calls back to a central authentication
    service to verify identity are inefficient, especially given that direct-to-service
    communication is preferred to routing through central gateways whenever possible
    to minimize latency.


    JWTs can be used to carry along a representation of information about the user.
    In essence, you will be able to accomplish these tasks:


    +   * Know that the request was initiated from a user request

    * Know the identity that was made on behalf of

    * Know that this request is not a malicious replay of a previous request


    JWTs are compact and URL friendly. As you might guess from the name, a JWT (pronounced
    "jot") contains a JSON structure. The structure contains some standard attributes
    (claims), such as issuer, subject (the user''s), and expiration time, which has
    clear mappings to other established security mechanisms. Room is also available
    for claims to be customized, allowing additional information to be passed along.


    While parsing, you will be told that your JWT is not valid for reasons that are
    not apparent. For security and privacy reasons, it is not a good idea to expose
    (to the front end) what is wrong with the logic. Doing so can leak implementation
    details that could be used maliciously. JWT.io provides some utilities for working
    with JWTs, providing a quick way to verify whether the encoded JWT that you scrolled
    in your browser console or your trace log is valid or not. For more information
    about JWT.io, see the following website:


    ```

    https://jwt.io

    ```


    # Dealing with time


    One of the attributes of JWTs is that they allow identity to be propagated, but
    not indefinitely. JWTs expire, which triggers renewal of the identity that results
    in a new JWT. JWTs have three fields that relate to time and expiry, which are
    all optional. Generally, include these fields and validate them when they are
    presented as follows:


    +   * The time JWT was created (iat) is before the current time and is valid.

    * The "not process before" (nbf) claim is before the current time and is valid.

    * The expiration time (exp) is after the current time and is valid.


    All of these are expressed as UNIX epoch stamps.


    # Signed JWTs


    Signing a JWT helps establish trust between services, as the receiver can verify
    the identity of the signer, and that the contents of the JWT have not been modified
    in transit.


    JWTs can be used by signing shared secrets, or a public/private key pair (SSL
    certificates work with a well known public key). Common JWT libraries all support
    signing. For more information about JWT libraries, see the following website:


    ```

    https://jwt.io/#libraries-io

    ```'
