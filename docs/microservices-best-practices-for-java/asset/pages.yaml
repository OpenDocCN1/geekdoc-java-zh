    \ environment is to pack everything that is needed to run the service inside an\
    \ executable JAR file. These fat uber JAR files contain the service class files\
    \ and supporting shared libraries, including servlet containers or other Java\
    \ EE middleware. This technique eliminates problems introduced by dependency mismatches\
    \ between development and test or production environments.\n\nThese self-contained\
    \ JAR files are generally easy to handle, and help create a consistent, reproducible\
    \ environment for local development and test in addition to target deployment\
    \ environments.\n\nAs mentioned in 2.1, \"Java platforms and programming models\"\
    \ on page 10, there are various programming models available that produce stand-alone\
    \ executable JAR files.\n\n# Spring Boot\n\nThe executable JAR files produced\
