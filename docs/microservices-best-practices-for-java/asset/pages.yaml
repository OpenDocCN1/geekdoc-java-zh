- img_proc: true
  md: '# 5.1 Data-specific characteristics of a microservice


    One way to identify the data, which must be stored in the data store of your microservice,
    is a top down approach. Start at the business level to model your data. The following
    sections show how to identify this data, how to handle the data, and how it can
    be shared with other data stores of other microservices. For a description of
    the top down approach, see the following website:


    http://en.wikipedia.org/wiki/Top-down_and_bottom-up_design


    # 5.1.1 Domain-driven design leads to entities


    From the approach in domain-driven design, you get the following objects, among
    others:


    +   * Entity

    "An object that is not defined by its attributes, but rather by a thread of continuity
    and its identity"

    * Value Objects

    "An object that contains attributes but has no conceptual identity. They should
    be treated as immutable"

    * Aggregate

    "A collection of objects that are bound by a root entity, otherwise known as an
    aggregate root. The aggregate root guarantees the consistency of changes being
    made within the aggregate by forbidding external objects from holding references
    to its members"

    * Repository

    "Methods for retrieving domain objects should delegate to a specialized Repository
    object such that alternative storage implementations may be easily interchanged."


    These quotations are taken from the following source:


    http://en.wikipedia.org/wiki/Domain-driven_design


    These objects should be mapped to your persistence store (you should only aggregate
    entities when they have the same lifecycle). This domain model is the basis for
    both a logical data model and a physical data model.


    For more information about domain-drive design terms, see the following website:


    http://dddcommunity.org/resources/ddd_terms/'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# 5.1.2 Separate data per microservice


    Every microservice should have its own data store (Figure 5-1) and is decoupled
    from the other microservice and its data. The second microservice must not directly
    access the data store of the first microservice.


    Reasons for this characteristic:


    +   - If microservices share a data store, they are tightly coupled. Changing
    the structure of the data store (as tables) for one microservice can cause problems
    for the other microservice. If microservices are coupled this way, deployment
    of new versions must be coordinated, which must be avoided.


    +   - Every microservice should use the type of database that best fits its needs
    (polyglot persistence, 5.1.3, "Polyglot persistence" on page 45 for more details).
    You do not need to make a trade off between different microservices when choosing
    a database system. This configuration leads to a separate data store for each
    microservice.


    +   - From a performance aspect, it can be useful for every microservice to have
    its own data store because scaling can become easier. The data store can be hosted
    on its own server.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_56_0.png)


    The separation of data stores for a relational database can be achieved in one
    of the following ways:


    +   - Schema per microservice

    - Each service has its own schema in the database (Figure 5-2 on page 44). Other
    services can use the same database but must use a different schema. This configuration
    can be enforced with the database access control mechanism (using grants for connected
    database users) because developers suffering from time pressures tend to use shortcuts
    and can access the other schema directly.


    +   - Database per microservice

    - Each microservice can have its own database but share database server with the
    other microservices (Figure 5-2 on page 44). With a different database, users
    can connect to the database server and there is a good separation of the databases.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '![](img/857a3fe455a7acf964c5a1d25b24ba28_57_0.png)


    +   - Database server for microservice


    This is the highest degree of separation. It can be useful, for example, when
    performance aspects needs to be addressed (Figure 5-3).


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_57_1.png)


    Figure 5-3 Database server per microservice'
