  md: '# Handling data


    In an environment with polyglot persistence, which can exist in a system of microservices,
    it is necessary to keep the data handling manageable. To explain how this goal
    can be achieved, this chapter provides a short description of characteristics
    of microservices concerning data handling and then looks how it can be done with
    Java based microservices.


    The following topics are covered:


    +   - Data-specific characteristics of a microservice

    - Support in Java'
