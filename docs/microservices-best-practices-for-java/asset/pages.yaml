  md: '# 7.1 Types of tests


    This chapter focuses on the Java specific testing considerations, assuming some
    prior

    knowledge of testing microservices. The following types of tests are covered:


    +   - Unit

    Tests a single class or a set of closely coupled classes. These unit tests can
    either be run

    using the actual objects that the unit interacts with or by employing the use
    of double

    or mocks.


    +   - Component

    Tests the full function of a single microservice. During this type of testing,
    any calls to

    extexternal services are mocked in some way.


    +   - Integration

    Integration tests are used to test the communication between services. These tests
    are

    designed to test basic success and error paths over a network boundary.


    +   - Contract

    Test the agreed contract for APIs and other resources that are provided by the

    microservice. For more information, see "Consuming APIs" on page 38.


    +   - End-to-end

    Tests completes the flow through the application or microservice. Usually used
    to test a

    gold path or to verify that the application meets external requirements.


    # 7.2 Application architecture


    The internal structure of your microservice directly affects how easy it is to
    test. Figure 7-1

    shows a simplified version of the microservice architecture described in Chapter
    2, "Creating

    Microservices in Java" on page 9.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_91_0.png)'
