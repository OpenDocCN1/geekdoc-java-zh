  md: 'Containerization can also help you to get a correctly configured system. For
    dynamic provisioning, you can use Cloud hosting infrastructure as a service (IaaS)
    or platform as a service (PaaS). Due to the high number of microservices in your
    system, it is good to have a tool to help with Release Management. All of these
    deployed systems must be monitored (see Chapter 9, "Management and Operations"
    on page 107). Logs must also be gathered for auditing and diagnostic purposes
    (see 9.2, "Logging" on page 111). Last, but not least, security holes in your
    microservice should be found, as detailed in Chapter 6, "Application Security"
    on page 67.


    It is essential that the build steps to create the microservice are done with
    a tool that can also manage dependencies of JAR files. Maven and Gradle are the
    best choice to do so. In both systems, you can list the JAR files to build your
    microservice to ensure that every build of a service leads to an immutable software
    artifact. Generally, there is a distinct version or revision indicator for every
    build result of a microservice to make clear which version of the service is deployed.
    This can be achieved with Maven or Gradle. The version of the service should not
    be confused with a semantic API version; it determines which version of the codebase
    is running.


    A sample view of build pipeline "The Pipeline View" used in Jenkins (CI server)
    is shown at:


    ```

    http://wiki.jenkins-ci.org/display/JENKINS/Build+Pipeline+Plugin

    ```


    As you can see in the sample view, versions of the same application are running
    in parallel through the pipeline. The different rectangles show the deployment
    stage of this software on the stages.


    Templates of microservices (9.3, "Templating" on page 113) can help to develop
    microservices that need the same implementations for the supporting systems access.
    Logging, for example, is necessary in a system of microservices, and is also helpful
    to track the requests between microservices. If every development team of a service
    does its own logging and also uses its own format, it can be difficult to join
    the log files of the different services. Security is also a requirement that must
    be developed to central specifications. Templates can codify common concerns,
    and turn them into conventions that are easy to follow. However, if developers
    restricted by these templates, they will ignore or get rid of them. Balance the
    effort spent building templates with the value they bring to the developers who
    are writing services.


    # 8.3 Packaging options


    The next question, after building the microservice, is what packaging format should
    be used to deploy the application. A recurring theme in both the twelve factors
    and the definition of cloud native applications is the creation of immutable artifacts
    that can be run without change across different deployment environments.


    The more things change from deployment to deployment, the greater the risk that
    something will break in unexpected ways, due to misconfiguration, missing dependencies,
    and so on. Building immutable, self-contained artifacts introduces more consistency
    between development and production environments, and reduces the likelihood of
    deployment time surprises.'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The following packaging options are available, among others:


    +   * WAR/EAR file deployment on preinstalled middleware

    * Executable JAR file

    * Containers

    * Every microservice on its own virtualized server


    In general, you want to minimize differences between the environment in which
    the service is developed and tested, and the environment in which it runs. Some
    packaging and deployment choices make it easier to achieve parity between development
    and production environments than others. The following sections explore the pros
    and cons of each packaging option.


    # 8.3.1 JAR, WAR, and EAR file deployment on preinstalled middleware


    This variant of packaging is the default way for deploying Java EE applications,
    where WAR or EAR files are deployed to a dedicated system with a preinstalled
    application server. In traditional environments, many EARs and WARs are deployed
    to the same running server, with deployments batched per week, month, or even
    longer time frames.


    On the way from development to production, the application gets hosted in different
    application servers in staging environments (such as quality assurance, performance
    test, and acceptance test). Every environment should have the same configuration,
    this is not always the case. For example, a production system might use a more
    conservative approach to upgrades than development or test systems.


    The following problems can arise from this approach:


    +   * Frequent deployments in a shorter time period (day, hour) can be achieved.
    For example, some application deployments need a restart of the application server
    and as a consequence interrupt the other applications on the same application
    server. This interruption often cannot be daily or even hourly.

    * If different applications are hosted together on the same application server,
    the load from one application can interfere with the performance of the other
    application.

    * High variations in the load of an application cannot easily be adopted in the
    infrastructure.

    * Different stages might not have the same configuration, which can lead to application
    problems in one stage that cannot be reproduced in the other stage.

    * Separated responsibilities often lead to a discussion between developer and
    administrator to find a "guilty" when deployment problems arise.


    If this pattern is used with microservices, the relationship should be one-to-one
    between the service and the preinstalled middleware server. This configuration
    is common, for example, in PaaS environments, where you push the WAR or EAR to
    a freshly predefined server. It can also apply to cases where application instances
    are provisioned by tools like Chef or Puppet, with the WAR or EAR afterwards.
    Isolation of services into their own middleware instances is important to allow
    services to scale independently, and to reduce the risk of service updates interfering
    with each other.


    As mentioned, this approach has a deployment risk if services are isolated because
    the service still relies on the preinstalled middleware to supply all of the dependencies
    that it requires. However, because it mirrors much of the traditional monolith
    application experience, it can be an easy first step when starting a new microservices
    application.


    Chapter 8. From development to production 93'
  merge: -1
  pgno: 106
