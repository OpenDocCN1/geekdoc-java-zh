  md: "All the other frameworks used from the Java EE stack can be used to validate\
    \ the beans automatically (for example JAX-RS, CDI) and also EJB as shown in Example\
    \ 5-21.\n\nExample 5-21 Bean validation in EJB\n\n```\n@Stateless\n@LocalBean\n\
    public class OrderEJB {\n    public String setDescription(@Max(80) String newDescription){\n\
    \    \n    }\n```\n\n# Architectural layering aspects of JPA and BeanValidation\n\
    \nIn a service with just a few layers, it is easier to use the JPA entity classes\
    \ as Data Transfer Object (DTO) after. The JPA object detached from its persistence\
