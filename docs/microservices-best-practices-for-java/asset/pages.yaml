  md: '# 8.2 Deployment pipelines and tools


    One of the benefits of microservice architectures is agility. Because each individual
    service has a focused scope and an independent lifecycle, it takes less time to
    implement a new feature as a microservice, test it, and deploy it into production.
    Microservices are often built iteratively, which means supporting the notion of
    continuous integration and deployment.


    Deployment artifacts run on different systems, so many systems must be configured
    to make the services work. The more manual steps there are for deploying a microservice
    into production, the more likely it is that unexpected problems will arise due
    to bad typing or forgotten steps. Human intervention should be reduced to a minimum.
    For example, manual approvals might be required before a new version of a service
    can be released into production for regulatory reasons. However, everything leading
    up to, and from that, can be automated.


    Deployment pipelines as described by Martin Fowler are used as a part of a Continuous
    Deployment environment. They describe and define a set of steps to get microservices
    into production, by breaking the process into stages that cover building, deploying,
    and testing the service in each stage to verify that all is well. It is helpful
    to use DevOps technologies to simplify the creation of a Deployment pipeline and
    related tool to support applications from development to production. For more
    information about DevOps technologies, see this:


    http://blog.xebialabs.com/2015/07/20/xebialabs-launches-the-periodic-table-of-devo-tools/


    As mentioned, the source for your microservices be in a Source Code Management
    (SCM) tool like Subversion or Git. It should be built with a tool that has dependency
    management like Maven or Gradle. Choose one of the repository management tools
    (such as Nexus or Artifactory) to store versioned binary files of your shared
    libraries. Build your services using one of the CI-Tools like Jenkins or Bamboo.


    After the automated build of the microservice testing must be done, and for some
    of that you need to deploy the microservice, which means you need the correct
    configurations placed on your automatically provisioned system. You can use classic
    scripting to configure the targets correctly, but you must then manage platform
    or other system differences in the scripts. Scripting frameworks/infrastructure
    like Chef, Puppet, Ansible, and Salt can handle this much better. They can all
    be used the same way for initial installation and modification of an existing
    system. Define the target content of the configuration files, and these deal with
    the difference if there are changes on the target system.


    +   1 http://martinfowler.com/bliki/DeploymentPipeline.html

    2 http://martinfowler.com/bliki/ContinuousDelivery.html

    3 http://subversion.apache.org/

    4 http://git-scm.com/

    5 http://maven.apache.org/

    6 http://gradle.org/

    7 http://www.sonatype.org/nexus/

    8 http://www.jrog.com/artifactory/

    9 http://jenkins.io/

    10 http://www.atlassian.com/software/bamboo

    11 http://www.chef.io/

    12 http://puppet.com/

    13 http://www.ansible.com/

    14 http://saltstack.com/'
