    \n    hostName=\"localhost\"\n    port=\"5043\"\n    sslRef=\"mySSLConfig\">\n\
    />\n```\n\nSplunk⁷ is a commercial product that can also be used to gather and\
    \ analyze your log data.\n\n# 9.3 Templating\n\nFrom a management point of view,\
    \ it can be valuable to templating for your development team, which is implementing\
    \ the system of microservices. Templating in this sense is defining a skeleton\
    \ of code fragments that can be used to generate the needed parts of a microservice.\n\
    \nA microservice template typically includes these common capabilities:\n\n+ \
    \  * Communication with Service Discovery to register a service instance\n* Communication\
    \ with other microservices\n* Communication with a messaging system\n* Logging\n\
    * Security\n\nYou get these benefits from a template having all these capabilities:\n\
    \n+   * Quicker start for the development teams\n* All teams use the same cross\
    \ functional services\n\nThe following are available generators:\n\nIf teams use\
    \ Java to implement the microservices, and do not have a polyglot programming\
    \ environment, then you must define one template that can be evolved to best fit\
    \ your project needs.\n\n> ⁶ http://www.ibm.com/support/knowledgecenter/SSAW57-9.0.0/com.ibm.websphere.wlp.nd.doc/ae/twlp_analytics_cs_logstash.html\n\
    ⁷ http://www.splunk.com/\n⁸ http://wildfly-swarm.io/generator/\n⁹ http://start.spring.io/\n\
    ¹⁰ http://liberty-app-accelerator.wasdev.developer.ibm/"
