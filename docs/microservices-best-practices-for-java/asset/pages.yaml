    # 5.1.6 Messaging systems


    You can use messaging systems or a message-oriented middleware to support your

    event-driven architecture.


    *Message-oriented middleware (MOM) is software or hardware infrastructure supporting

    sending and receiving messages between distributed systems. MOM allows application

    modules to be developed over heterogeneous platforms and reduces the complexity
    ofnndevelop applications that span multiple operating systems and network protocols.
    The

    middleware creates a distributed communications layer that insulates the application

    developer from the details of the various operating systems and network interfaces.
    APIs that

    end across diverse platforms and networks are typically provided by MOM. MOM provides

    software elements that reside in all communicating components of a client/server
    architecture

    and typically support asynchronous calls between the client and server applications.
    MOM'
