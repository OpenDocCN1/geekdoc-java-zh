  md: 'reduces the involvement of application developers with the complexity of the
    master-slave nature of the client/server mechanism.\-2


    To communicate with message-oriented middleware, you can use different protocols.
    The following are the most common protocols:


    +   - Advanced Message Queuing Protocol (AMQP)5

    AMQP mandates the behavior of the messaging provider and client to the extent
    that implementations from different vendors are interoperable, in the same way
    as SMTP, HTTP, FTP, etc. have created interoperable systems.\-4

    - MQTT Telemetry Transport (MQTT)5

    MQTT is "publish-subscribe-based\lightweight" messaging protocol for use on top
    of the TCP/IP protocol. It is designed for connections with remote locations where
    a "small code footprint" or the network bandwidth is limited.\-6 Mostly it is
    used in Internet of Things (IoT) environments.


    In the Java world there exists an API to communicate with message-oriented middleware:
    Java Message Service (JMS) which is part of the Java EE Specification. The specification
    is JMS 2.0.\-7


    Due to the long existence of JMS since 2001, many Message Brokers are available
    that can be used as MOM systems.\-8 But there also exist messaging systems that
    implement AMQP:


    +   - RabbitMQ

    - Apache Qpid99

    - Red Hat Enterprise MRG


    All of these systems provide Java APIs so they can be used in your Java based
    microservice.


    # 5.1.7 Distributed transactions


    Most, if not all, of messaging systems support transactions. It is also possible
    to use distributed transactions when sending messages to the message system and
    changing data in a transactional data store.


    Distributed transactions and two-phase commit can be used between a microservice
    and its backing store, but should not be used between microservices. Given the
    independent nature of microservices, there must not be an affinity between specific
    service instances, which is required for two-phase commit transactions.


    For interactions spanning services, compensation or reconciliation logic must
    be added to ensure consistency is maintained.


