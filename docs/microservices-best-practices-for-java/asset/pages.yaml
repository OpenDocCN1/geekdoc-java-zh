    \ However, sometimes the string is used directly in the request as either a bearer\
    \ token or query parameter (over https). Using an API key is more secure when\
    \ used as a shared secret for signing tokens (JWTs) or for digest methods of authentication\
    \ (HMACs).\n\nIf your services create API keys, ensure that API keys are securely\
    \ generated with high entropy and stored correctly. Ensure that these keys can\
    \ be revoked at any time. If your application has distinct parts, consider using\
    \ different API keys for each part. This configuration can enable more granular\
    \ usage tracking, and reduces the impact if a key is compromised.\n\nAsymmetric\
    \ keys can also be used (such as SSL), but require a public key infrastructure\
