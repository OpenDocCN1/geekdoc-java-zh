  md: '# 7.3.2 Testing resources


    Classes that expose JAX-RS endpoints or receive events should be tested by using
    two types of tests: Integration tests and contract tests.


    # Integration tests


    Integration tests are used to verify the communication across network boundaries.
    They should test the basic success and failure paths in an exchange. Integration
    tests can either run in the same way as unit tests, or by standing up the application
    on a running server. To run integration tests without starting the server, call
    the methods that carry JAX-RS annotations. During the tests, create mocks for
    the objects that the resource classes call when a request comes in.


    To run integration tests on a running server, you can use one of the methods described
    in “Tests on a running server” on page 82. To drive the code test, use the JAX-RS
    client by JAX-RS 2.0, to send requests.


    Integration tests validate the basic success and error paths of the application.
    Incorrect requests should return useful responses with the appropriate error code.


    # Consumer driven contract


    A consumer of a particular service has a set of input and output attributes that
    it expects the service to adhere to. This set can include data structures, performance,
    and conversations. The contract is documented using a tool like Swagger. Chapter
    2, “Creating Microservices in Java” on page 9 for more information. Generally,
    the consumers of a service drive the definition of the contract, which is the
    origin of the *consumer driven contract*.


    Consumer driven contract tests are a set of tests to determine whether the contract
    is being upheld. These tests should validate that the resources expect the input
    attributes defined in the contract, but also accept unknown attributes (it should
    ignore them). They should also validate that the resources return only those attributes
    that are defined in the documentation. To isolate the code under test, use mocks
    for the domain logic.


    Maintaining consumer driven contract tests introduces some organizational complexity.
    If the tests do not accurately reflect the contract defined, they are useless.
    In addition, if the contract is out of date, even the best tests will not result
    in a useful resource for the consumer. Therefore, it is vital that the consumer
    driven contract is kept up to date with current consumer needs and that the tests
    always test the contract.


    Contract tests require the actual API to be implemented. This technique requires
    the application be deployed onto a server. See “Tests on a running server” on
    page 82 for more information. Use tools such as the Swagger editor to create these
    tests. The Swagger editor can take the API documentation and produce implementations
    in many different languages.


    Another dimension to contract testing is the tests that are run by the consumer.
    These tests must run in an environment where the consumer has access to a live
    version of the service, which is the staging environment. See section 7.4.3, “Contract”
    on page 86 for more details.


    ```

    http://editor.swagger.io/

    ```'
