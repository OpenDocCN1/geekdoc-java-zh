    # # Online retail store


    Consider a user wanting to place an order on an online retail store. After the
    user has entered all the details of the order, they click the **Submit** button.
    The user expects a response to confirm that the order has gone through, so the
    **Submit** button triggers a synchronous request that returns a response. After
    the order has been submitted, the application starts processing the order. The
    service that received the order request sends out asynchronous events that other
    services are subscribed to. These events include inventory updates, shipping events,
    and payment events. Some services trigger another synchronous or asynchronous
    request in response to the events. For example, the inventory service uses a synchronous
    request to update the inventory database.


    # # 4.2 Fault tolerance


    A strong motivator for moving to a microservice architecture is to get a more
    fault tolerant and resilient application. Modern applications are required to
    have near zero downtime and respond to requests within seconds rather than minutes.
    Each individual service in a microservice must be able to continue functioning
    if the other services have gone down. This section focuses on the techniques and
    tools you should use when communicating with other microservices to make your
    microservice fault tolerant and resilient.


    # # 4.2.1 Resilient against change


    When a microservice makes a synchronous request to another microservice, it uses
    a specific API. The API has defined input attributes that must be included in
    the request and output attributes that are included in the response. In a microservice
    environment, this is'
