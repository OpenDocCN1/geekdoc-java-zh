  md: '![](img/857a3fe455a7acf964c5a1d25b24ba28_38_0.png)


    # # Locating services


    Microservices are designed to be easily scaled. This scaling is done horizontally
    by scaling individual services. With multiple instances of microservices, you
    need a method for locating services and load balancing over the different instances
    of the service you are calling. This chapter describes the options available for
    locating and making requests to microservices in a system.


    The following topics are covered:


    +   - Service registry

    - Service invocation

    - API Gateway'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 3.1 Service registry


    +   - Registration

    After a service has been successfully deployed, the microservice must be registered
    with the service registry.

    - Heartbeats

    The microservice should send regular heartbeats to the registry to show that it
    is ready to receive requests.

    - Service discovery

    To communicate with another service, a microservice must call the service registry
    to get a list of available instances (see 3.2, "Service invocation" on page 27
    for more details).

    - De-registration

    When a service is down, it must be removed from the list of available services
    in the service registry.


    # 3.1.1 Third-party registration versus self-registration


    The registration of the microservice with the service registry can be done by
    the microservice or by a third party. Using a third party requires said party
    to inspect the current state and relay information to the service registry. The
    third party also handles de-registration. If the microservice itself performs
    registration and heartbeats, the service registry can unregister the service if
    it misses a heartbeat.


    The advantage of using a third party is that the registration and heartbeat logic
    is kept separate from the business logic. The disadvantage is that there is an
    extra piece of software to deploy and the microservice must be exposed to a health
    endpoint for the third party to poll.


    Using self-registration pulls the registration and heartbeat logic into the microservice
    itself. Using this method requires careful testing considerations. See Chapter
    7, "Testing" on page 77 for more information about separation of code. However,
    many service registry solutions provide a convenience library form registration,
    reducing the complexity of the code required.


    Generally, use a service registry provides a Java based library for registration
    and heartbeats. This configuration makes your services quicker to code and provide
    consistency across every microservice in the system (that is in Java). The following
    service registry solutions are available:


    +   - Consul

    https://www.consul.io/

    - Eureka

    https://github.com/Netflix/eureka

    - Amalgam

    https://github.com/amalgam/'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'All of these registries are open source and provide integration for Java. As
    a part of the Netflix stack, Eureka is well integrated with the other Netflix
    solutions for load balancing and fault tolerance. Using Eureka as the service
    registry allows you to add the other solutions. The Amalgamd open source project
    provides both service registration and load balancing. It also provides routing
    configuration that can be used during testing. For more information, see Chapter
    7, “testing” on page 77.


    # 3.1.2 Availability versus consistency


    Most service registries provide partition tolerance and either consistency or
    availability. They cannot provide all due to the CAP theorem¹. For example, Eureka
    provides availability and Consul and Apache Zookeeper provide consistency. Some
    articles argue that you should choose one or the other (this post² on the Kewton
    blog is worth a read), but the decision comes down to the precise needs of your
    application. If you require all of your microservices to have the same view of
    the world at a time, choose consistency. If it is essential that requests are
    answered quickly rather than waiting for a consistent answer, then choose availability.
    Solutions are available for both that integrate with Java.


    # 3.2 Service invocation


    When a service needs to communicate with another service, it uses the information
    stored in the service registry. The call to the actual microservice is then either
    on the server side or the client side.


    # 3.2.1 Server side


    Server-side communication with the microservice is performed by using a service
    proxy. The service proxy is either provided as part of the service registry, or
    as a separate service. When a microservice needs to make a call, it calls the
    service proxy’s well-known endpoint. The service proxy is responsible for getting
    the location of the microservice from the service registry and forwarding the
    request. The proxy takes the response and routes it back to the original microservice
    that made the request. In the example scenario, load balancing is handled completely
    on the server side.


    +   1 https://en.wikipedia.org/wiki/CAP-theorem

    2 https://zookeeper.apache.org/

    3 https://tech.kewton.com/blog/2014/12/eureka-shouldnt-use-zookeeper-service-discovery/'
  merge: -1
  pgno: 40
- img_proc: true
  md: "Figure 3-1 shows the flow of requests when using a service proxy.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_41_0.png)\n\
    \nUsing server-side invocation provides these key advantages:\n\n+   * Simple\
    \ requests\n  The request made by the microservice can be simple because it is\
    \ calling a well-known endpoint.\n* Easier testing\n  Using a server proxy takes\
    \ any load balancing or routing logic out of the microservice. This configuration\
    \ allows you to test the full function of the service using a mocked proxy.\n\
    In cloud platforms such as Cloud Foundry and Bluemix, the proxy is provided by\
    \ the platform. In Bluemix, every deployed application has a well-known endpoint,\
    \ called a routc. When another service or application calls this route, Bluemix\
    \ does load balancing in the background.\n\nThis approach has the following key\
    \ disadvantage:\n\n+   * Greater number of hops\n  Adding in a call to the service\
    \ proxy increases the number of network hops per request. As a result, the number\
    \ of hops per request is generally higher than for client-side solutions. It is\
    \ worth noting that the service proxy can hold cached information about the other\
    \ microservices, so in many cases the request would go through four hops: 1 $\r\
    ightarrow$ 4 $\rightarrow$ 5 $\rightarrow$ 6."
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Figure 3-2 shows the network hops required.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_42_0.png)


    Figure 3-2 Network hops are required to complete a request service when using
    a service proxy


    # 3.2.2 Client side


    The request from one microservice to another can be made directly from the client
    side. First, the location of one or several instances of a service is requested
    from the service registry. Second, the request to the microservice is made on
    the client side. The location of the microservice is usually cached so that, in
    the future, a request can be made without returning to the service registry. If
    in the future the request fails, then the client can repeat the call to the service
    registry. It is a best practice to have the cached microservice location on a
    timeout. This configuration means that if a new version of a service is deployed,
    the other microservices do not have to wait for an error from their cached instance
    before being informed about the new instance.'
  merge: -1
  pgno: 42
- img_proc: true
  md: "In comparison to the service proxy approach, this requires fewer network hops.\
    \ Figure 3-3 shows the network hops required. Again, this number of hops is for\
    \ when the client does not have cached information about the services. In many\
    \ cases, the request to the service registry is not required, making it just two\
    \ hops: $3 \rightarrow 4$.\n\n![](img/857a3fe455a7acf964c5a1d25b24ba28_43_0.png)\n\
    \nFigure 3-3 Network hops when making a client-side request to the service registry\n\
    \nThe request and any load balancing that is required can be handled by one of\
    \ two mechanisms:\n\n+   - Client library\n- Sidecar"
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Both mechanisms make requests on the client side. However, the client library
    runs within the microservice and the sidecar is deployed with the microservice,
    but runs on a separate process. Figure 3-4 shows an example architecture diagram.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_44_0.png)


    Figure 3-4 Requests are either made by the client library or by the sidecar process


    # Client library


    Client libraries can be useful for many reasons, one of which is isolating the
    specifics of communicating with a remote resource. For service registries, client
    libraries like those provided by Consul or Netflix Eureka service registration
    and heart beating. Other libraries, such as Netflix Ribbon, provide client-side
    load balancing.


    Generally start with an existing library, rather than writing your own. If any
    of the microservices in your system are written in Java, then you should standardize
    your library. If you have a polyglot system of microservices, then standardize
    on one for each language. By using the same library everywhere, you maintain the
    flexibility to move developers from microservice to microservice and avoid over-complicating
    your infrastructure and build process.


    The disadvantage of using a client library is that you have now moved the complex
    service calls back into your application. This configuration makes it more complicated
    to test your service. Make sure to keep a good separation between the code that
    uses the client library and the business logic in your microservice. See Chapter
    7, "Testing" on page 77 for more details about code separation to enable easier
    testing.


    # Sidecar


    A good ground between the service proxy and a client library is a sidecar. A sidecar
    is a separate process that is deployed with your microservice, either as a separate
    process within a container, or as a separate, but closely related container.


    Sidecars maintain the service registration with the service registry, and usually
    perform client-side load balancing for outbound calls to other microservices.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Because sidecars run in their own process, they are independent of language.
    You can use the same sidecar implementation for all of the microservices in a
    polyglot application, regardless of the language that the service is written in.


    Netflix Prana is an open source sidecar that provides the capabilities of the
    Java based Ribbon and Eureka client libraries to non-Java applications. For more
    information, see the following:


    ```

    http://github.com/Netflix/Prana

    ```


    Kubernetes is an orchestration engine for containers that provides sidecar discovery
    and load balancing capacities. For more information, see the following website:


    ```

    http://kubernetes.io/docs/user-guide/services

    ```


    Amalgama is a solution that can be used with and without containers. It manages
    service registration and provides client-side service discovery, routing, and
    load balancing. For more information, see the following website:


    ```

    http://amalgam.io

    ```


    Choosing a solution that handles several of these elements can reduce the complexity
    of your services and your infrastructure.


    # 3.3 API Gateway


    An API Gateway can be used to perform service invocation for both internal and
    external clients. The API Gateway performs a similar role to a service proxy (see
    3.2.1, "Server side" on page 27). Services makes requests to the API Gateway that
    looks up the service in the registry, makes the request, and returns the response.
    There is a difference between the two, however. Requests to a service proxy use
    the exact API that the end service provides. Requests to an API Gateway use the
    API that the gateway provides. This configuration means that the API Gateway can
    provide different APIs to the ones that the microservice provides.


    The internal microservices use the exact APIs, while API Gateways provide more
    benefit to external clients. Typically microservices provide fine grained APIs.
    By contrast, an external client that uses the application probably does not need
    an API that is as fine grained. It might also need an API that uses information
    from several microservices. The API Gateway exposes APIs to the external client
    that are helpful to them and hides the actual implementation of the microservices
    behind the Gateway. All external clients access the application through this API
    Gateway.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Microservice communication


    In a distributed system, inter-service communication is vital. The microservices
    that make up your application must work together seamlessly to provide value to
    your clients.


    Chapter 3, "Locating services" on page 25 discussed how you can locate a particular
    service and the options for load balancing across different instances.


    This chapter covers the communication between different services in a microservice
    architecture after the location of the required service is determined. This description
    includes synchronous and asynchronous communication, and how to achieve resilience.


    The following topics are covered:


    +   - Synchronous and asynchronous

    - Fault tolerance'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 4.1 Synchronous and asynchronous


    Synchronous communication is a request that requires a response, whether that
    be immediately or after some amount of time. Asynchronous communication is a message
    where no response is required.


    A strong case can be made for using asynchronous events or messaging in highly
    distributed systems that are built from independent parts. There are situations
    where using synchronous calls is more appropriate, which are described in 4.1.1,
    "Synchronous messaging (REST)".


    For either invocation style, services should document any publishing APIs tools
    like Swagger. Event or message payloads should also be documented to ensure that
    the system is comprehensible, and enable future consumers. Event subscribers and
    API consumers should tolerate unrecognized fields, as they might be new. Services
    should also expect and handle bad data. Assume that everything will fail at some
    point.


    # 4.1.1 Synchronous messaging (REST)


    As stated previously, in distributed systems, asynchronous forms of messaging
    are highly valuable. When clear request/response semantics apply, or where one
    service needs to trigger a specific behavior in another service, asynchronous
    APIs should be used instead.


    These are usually RESTful operations that parse JSON formatted data, but other
    protocols and data formats are possible. In a Java microservice, having the applications
    JSON is the best choice. There are libraries to parse JSON to Java objects, and
    JSON is becoming widely adopted, making it a good choice to make your microservice
    easily consumable.


    # Async support for JAX-RS


    Unlike JAX-RS requests which will be synchronous (you always require a response),
    you can take advantage of asynchronous programming models. The asynchronous support
    in JAX-RS 2.0 allows to perform other requests while waiting for the HTTP response.
    In a stateless EJB bean, an AsyncResponse object instance is injected and bound
    to the processing of the request using the @Suspended annotation. The @Asynchronous
    annotation allows to be offloaded from the active thread. Example 4-1 shows the
    code used to return the response.


    Example 4-1 JAX-RS 2.0 includes asynchronous support


    > 1 http://docs.oracle.com/javaee/7/api/java/ws/rs/container/AsyncResponse.html

    2 http://docs.oracle.com/javaee/7/api/java/ws/rs/container/Suspended.html

    3 http://docs.oracle.com/javaee/6/api/java/ejb/Asynchronous.html'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'To see more examples of the asynchronous support in JAX-RS 2.0, see the following
    GitHub project:


    https://github.com/WASdev/sample.async.jaxrs


    Another option is using reactive libraries like RxJava¹. RxJava is a Java implementation
    of ReactiveX², library that is designed to aggregate and filter responses from
    multiple parallel outbound requests. It extends the observer pattern³ and integrates
    well with libraries that are designed to handle load balancing and add resilience
    to your endpoints such as FailSafe and Netflix Hystrix⁵.


    # 4.1.2 Asynchronous messaging (events)


    Asynchronous messaging is used for decoupled coordination. An asynchronous event
    can be used if the creator of the event does not need a response.


    A request from an external client generally must go through several microservices
    before returning a response. If each of calls is made synchronously, then the
    total time for the calls holds up. The more complex the microservice system and
    the more interactions between microservices required per external request, the
    bigger the resultant latency in your system. If the requests in the process can
    be replaced with asynchronous events, you should implement the event instead.


    Use a reactive style for events. A service should only publish events about its
    own state or activity. Other services can subscribe to these events and act correctly.


    Events are an excellent way to compose interaction patterns without introducing
    dependencies. They enable the extension of the architecture in ways you had not
    considered when it was first created.


    The microservices pattern requires each microservice to own its own data. This
    requirement means when a request comes in, there might be several services that
    need to update their databases. Services advertise changes by using events that
