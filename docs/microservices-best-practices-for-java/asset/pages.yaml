  md: 'As mentioned earlier, these rules make up the Robustness Principle. By following
    these two rules you put yourself in the best possible position for changing your
    API in the future and adapting to changing requirements from consumers. For more
    information about the Robustness Principle, see the following:

    https://en.wikipedia.org/wiki/Robustness_principle


    # 4.2 Timeouts


    When making a request to another microservice, whether asynchronously or not,
    the request must have a timeout. Because we expect services to come and go, we
    should not be waiting indefinitely for a response.


    The asynchronous support in JAX-RS 2.0 has a setTimeout function on the AsyncResponse
    object ("Synchronous messaging (REST)\ on page 34). Tools like Failsafe and Netflix
    have built-in support for timeouts.


    Setting a timeout improves the resilience of your microservices, but can still
    result in a poor user experience because the end-to-end path will be slow. It
    is also possible for timeouts to be badly aligned that the request from service
    A to service B times while service B is waiting for a response from service C.


    # 4.2.3 Circuit breakers


    Using a timeout prevents a request from waiting indefinitely for a response. However,
    if a particular request always produces a timeout, you waste a lot of time waiting
    for the timeout to occur.


    A circuit breaker is designed to avoid repeating timeouts. It works in a similar
    way to the electronic version of the same name. The circuit breaker makes a note
    every time specific request fails or produces a timeout. If this count reaches
    a certain level, it prevents further calls from occurring, instead of returning
    an error instantly. It also creates a mechanism for retrying the call, either
    after a certain amount of time or in reaction to an event.


    Circuit breakers are vital when calling external services. Generally, use one
    of the existing libraries for circuit breakers in Java.


    # 4.2.4 Bulkheads


    In shipping, a bulkhead is a partition that prevents a leak in one compartment
    from sinking the entire ship. Bulkheads in microservices are a similar concept.
    You need to make sure that a failure in one part of your application doesn''t
    take the whole down. The bulkhead pattern is about how you create microservices
    rather than the use of any specific tool or library. When creating microservices,
    ask yourself how you can isolate the different parts and prevent cascading failures.


    The simplest implementation of the bulkhead pattern is to provide fallbacks. Adding
    a fallback allows the application to continue functioning when non-vital services
    are down. For example, in an online store there may be a service that provides
    recommendations for the users. If the recommendation service goes down, the user
    should still be able to search for items and place orders. An interesting example
    is chained fallbacks, where a failed request for personalized content falls back
    to a request for more general content, which would turn turn back to returning
    cached (and possibly stale) content in preference to an error.'
