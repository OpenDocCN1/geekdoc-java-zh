  md: 'Game On! uses three-legged authentication defined by OAuth and OIDC to delegate
    to social sign-on providers, specifically Facebook, GitHub, Google, and Twitter.
    As shown in Figure 6-2, the game has a dedicated Auth service that acts as a proxy
    for the various social login providers. This Auth service triggers a request to
    the target OAuth provider including information required to identify the Game
    On! application.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_85_0.png)


    Figure-6-2 OAuth invocation sequence diagram for Game On!


    The service interaction goes through these steps:

    nThe front end (web client or mobile application) makes a request to the game''s
    Auth service on behalf of the user.

    The Auth service returns a forwarding response that is automatically handled by
    the browser to forward the user to the selected OAuth provider with the application
    identifier.

    After the user has authenticated and granted permission, the OAuth provider returns
    an authorization code in another redirect response. The browser automatically
    handles the redirect to move back to a callback on the Auth service with the authorization
    code.

    The Auth service then contacts the OAuth provider to exchange the authorization
    code for an access token.

    The Auth service converts data from that token into a Signed JSON Web Tokens (JWTs),
    which allows you to verify the identity of the user over subsequent inter-service
    calls without going back to the OAuth provider.


    Some application servers, like WebSphere Liberty, have OpenID Connect features
    to facilitate communication with OAuth providers. As of this writing, these features
    do not provide the access token that was returned from the OAuth provider. Also,
    mine protocol differences make using individual provider libraries easier than
    more generic solutions.'
