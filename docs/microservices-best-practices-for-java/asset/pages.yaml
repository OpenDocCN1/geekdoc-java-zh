  md: '# 5.2 Support in Java


    In a polyglot persistence environment, the programming language you use to implement
    your microservices must deal with the different persistence technologies. Your
    programming language must be able to support each of the different ways to persist
    your data. Java as a programming language has many APIs and frameworks that can
    support the developer to deal with different persistence technologies.


    # 5.2.1 Java Persistence API


    > "The Java Persistence API (JPA) is a Java specification for accessing, persisting,
    and managing data between Java objects / classes and a relational database. JPA
    was defined as part of the EJB 3.0 specification as a replacement for the EJB
    2 CMP Entity Beans specification. JPA is now considered the standard industry
    approach for Object to Relational Mapping (ORM) in the Java Industry.


    JPA itself is a specification, not a product; it cannot perform persistence or
    anything itself. JPA is a set of interfaces, and requires implementation. There
    are open-source and commercial JPA implementations to choose from and any Java
    EE 5 application server should provide for its use. JPA also requires a database
    to persist to¹


    Java Enterprise 7 (Java EE 7) has included Java Persistence 2.1 (JSR 338)¹¹


    The main focus for integrating JPA was to get an object-relational mapper to persist
    Java objects in a relational database. The implementation behind the API, the
    persistence provider, can be implemented by different open source projects or
    vendors. The benefit that you get from using JPA is your persistence layer is
    more portable.


    JPA has defined its own query language (Java Persistence Query Language (JPQL))
    that can be used to generate queries for different database vendors. Java classes
    are mapped to tables in the database and it is possible to use relationships between
    the classes to correspond to the relationships between the tables. Operations
    can be cascaded by using these relationships, so an operation on one class can
    result in operations on the data of the other class. JPA 2.0 has introduced the
    Criteria API which can help to get a correct query at both runtime and time. All
    queries that you implement in your application can get a name and be addressed
    with. This configuration makes it easier to know after a few weeks of programming
    what the query does.


    The JPA persistence providers implement the database access. Here are the most
    common:


    +   - Hibernate

    http://hibernate.org/

    - EclipseLink

    http://www.eclipse.org/eclselink/

    - Apache OpenJPA

    http://jpa.apache.org/


    The default JPA provider Liberty for Java EE 7 is EclipseLink.


    ¹ http://en.wikibooks.org/wiki/Java_Persistence/What_is_JPA

    ¹¹ http://jcp.org/en/jsr/detail?id=338'
