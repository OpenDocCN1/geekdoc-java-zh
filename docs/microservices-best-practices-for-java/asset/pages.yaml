    \n```\npublic Order updateOrder(Order order, String newDesc) {\norder.setDescription(newDesc);\n\
    em.merge(order);\n}\n```\n\nTo delete a row in the database, you need an attached\
    \ object (Example 5-8). To attach the object to the persistence context, you can\
    \ find it. If the object is already attached, you do not need the find method.\
    \ The method remove with the persistence of the attached object deletes the object\
    \ in the database.\n\n# Example 5-8 JPA delete operation\n\n```\npublic void removeOrder(Long\
    \ orderId) {\nOrder order = em.find(Order.class, orderId);\nem.remove(order);\n\
    }\n```\n\nAs mentioned before, some configuration must be used to tell the persistence\
