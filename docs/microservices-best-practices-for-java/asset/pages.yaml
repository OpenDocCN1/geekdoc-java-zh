  md: 'When should a shared library really be an independent service? An independent
    service is independent of the language used, can scale separately, and can allow
    updates to take effect immediately without requiring coordinated updates to consumers.
    An independent service also adds extra processing, and is subject to all of the
    concerns with inter-service communication that are mentioned in Chapter 4, "Microservice
    communication" on page 33. It is a judgment call when to make the trade-off, although
    if a library requires backing services, that is generally a clue that it is a
    service in its own right.


    # # 2.4 Creating REST APIs


    So, what does a microservices API look like? Designing and documenting your APIs
    is important to ensure that it is useful and usable. Following conventions and
    using good versioning policies can make the API easier to understand and evolve
    over time.


    # # 2.4.1 Top down or bottom up?


    When creating from scratch, you can either define the APIs that you need first
    and write your code to fulfill the APIs, or the code for the first service and
    derive your APIs from the implementation.


    In principle, the first option is always better. A microservice does not operate
    in isolation. It is either calling, or something is calling it. The interactions
    between services in a microservices architecture should be well defined and well
    documented. Concerning domain design, APIs are the intersection points between
    bounded contexts.


    As Alan Perlis says, "Everything should be built from the top down, except the
    first time." When making a proof of concept, you might be unclear about what APIs
    you are providing. In those early days, write something that helps to refine ideas
    about what it is that you are trying to do. However, after you have a better understanding
    of what your service needs to do, you should go back and refine the domain model
    and the external APIs to market.


    # # 2.4.2 Document APIs


    Using tools to document your APIs can make it easier to ensure accuracy and correctness
    of the published documentation, which can then be used in discussions with API
    consumers. This documentation can also be used for your driven contract tests
    (see Chapter 7, "Testing" on page 77).


    The Open API Initiative (OAI)⁸ is a consortium focused on standardizing RESTful
    APIs are described. The OpenAPI specification⁹ is based on Swagger¹, which defines
    the structure and format of metadata used to create a Swagger representation of
    a RESTful API. This definition is usually expressed in a single file (swagger.json
    by convention, though YAML is supported by using swagger.yaml). The Swagger definition
    can be created using visual editors or generated by scanning annotations in the
    application. It can be used to generate client or server stubs.


    +   7 http://www.cs.yale.edu/homes/perlis-alan/quotes.html

    8 https://openapi.org/

    9 https://github.com/OpenAPI/OpenAPI-Specification

    10 http://swagger.io/


    Microservices Best Practices for Java'
