  md: '# 5.1.3 Polyglot persistence


    Every microservice should use its own data store, which means that it can use
    a different data storage technology. The NoSQL movement has led to many new data
    storage technologies, which can be used alongside a traditional relational database.
    Based on the requirements that an application must implement, it can choose between
    different types of technologies to store its data. Having a range of data storage
    technologies in one application is known as polyglot persistence.


    For some microservices, it is best to store their data in a relational database.
    Other services, with a different type of data (such as unstructured, complex,
    and graph oriented) can store their data in some NoSQL databases.


    Polyglot programming is a term that means that applications should be written
    in a programming language that best fits the challenge that an application must
    deal with.


    A more in-depth description of these two terms can be found on the Martin Fowler
    website: http://martinfowler.com/biki/PolyglotPersistence.html


    # 5.1.4 Data sharing among microservices


    In some situations, a client of a microservice application might want to request
    data that is owned by a different service. For example, the client might want
    to see all his Payments and the corresponding state of his payments. He would
    have to query the service for his Account and afterward is against the best practices
    for microservices to join the data by using the database. To handle this business
    case, you must implement an adapter service (Figure 5-4) that queries the Account
    service and the Payment service, and then returns the collected data to the client.
    The adapter service is also responsible for doing the necessary data transformations
    on the data it has received.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_58_0.png)'
  merge: -1
