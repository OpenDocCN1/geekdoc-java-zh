  md: '# Overview


    Application architecture patterns are changing in the era of cloud computing.
    A convergence of factors has led to the concept of "cloud native" applications:


    +   - The general availability of cloud computing platforms

    - Advancements in virtualization technologies

    - The emergence of agile and DevOps practices as organizations looked to streamline
    and shorten their release cycles


    To best advantage of the flexibility of cloud platforms, cloud native applications
    are composed of smaller, independent, self-contained pieces that are called microservices.


    This chapter provides a brief overview of the concepts and motivations that surround
    cloud native applications and microservice architectures:


    +   - Cloud native applications

    - Twelve factors

    - Microservices

    - Philosophy and team structure

    - Examples'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 1.1 Cloud native applications


    Cloud computing environments are dynamic, with on-demand allocation and release
    of resources from a virtualized, shared pool. This elastic environment enables
    more flexible scaling options, especially compared to the up-front resource allocation
    typically used by on premises data centers.


    According to the Cloud Native Computing Foundation, cloud native systems have
    the following properties:


    +   - Applications or processes are run in software containers as isolated units.


    +   - Processes are managed by using central orchestration processes to improve
    resource utilization and reduce maintenance costs.


    +   - Applications or services (microservices) are loosely coupled with explicitly
    defined dependencies.


    Taken together, these attributes describe a highly dynamic system composed of
    many independent processes working together to provide business value: a distributed
    system.


    For more information, see the Cloud Native Computing Foundation ("CNCF") Charter
    at:

    https://cncf.io/about/charter


    Distributed computing is a concept with roots that stretch back decades. The eight
    fallacies of distributed computing were drafted in 1994, and deserve a mention:


    +   1. The network is reliable.

    2. Latency is zero.

    3. Bandwidth is infinite.

    4. The network is secure.

    5. Topology doesn''t change.

    6. There is one administrator.

    7. Transport cost is zero.

    8. The network is homogeneous.


    Taking the fallacies into account, something becomes clear: Cloud native applications
    run in an environment of constant, unpredictable change, and must expect failures
    to occur at any time. For more information about the fallacies, see Fallacies
    of Distributed Computing Explained, available at:

    http://www.rgos.com/Files/fallacies.pdf


    # 1.2 Twelve factors


    The 12-factor application methodology mentioned in the 12 factors are not specific
    to cloud provider, platform, or language. The factors represent a set of guidelines
    or best practices for portable, resilient applications that thrive in cloud environments
    (specifically software as a service applications). The following are the 12 factors
    in brief:


    +   - There should be the one-to-one association between a versioned codebase(for,
    an IT repository) and a deployed service. The same codebase is used for many deployments.


    +   -  Services should explicitly declare all dependencies, and should not rely
    on the presence of system-level tools or libraries.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   3. Configuration varies between deployment environments should be stored
    in the environment (specifically in environment variables).


    +   4. All backing services are treated as attached resources, which are managed
    (attached and detached) by the execution environment.


    +   5. The delivery pipeline should have strictly separate stages: Build, release,
    and run.


    +   6. Applications should be deployed as one or more stateless processes. Specifically,
    transient processes must be stateless and share nothing. Persisted data should
    be stored in an appropriate backing service.


    +   7. Self-contained services should make themselves available to other services
    by listening on a specific port.


    +   8. Concurrency is achieved by scaling individual processes (horizontal scaling).


    +   9. Processes must be disposable: Fast startup and graceful shutdowns lead
    to a more robust and resilient system.


    +   10.All environments, from local development to production, should be as similar
    as possible.


    +   11.Applications should produce logs as event streams (for example, writing
    to stdout and stderr), and trust the execution environment to aggregate streams.


    +   12.If admin tasks are needed, they should be kept in control and managed alongside
    the application to ensure that it runs with the same environment as the application.


    These factors do not have to be strictly followed to achieve a good microservice
    environment. However, keeping them in mind allows you to build portable applications
    or services that can be built and maintained in continuous delivery environments.


    For more information about the 12 factors, The Twelve-Factor App by Adam Wiggins,
    available at:


    ```

    http://12factor.com

    ```


    # 1.3 Microservices


    Although there is no standard definition for microservices, most reference Martin
    Fowler''s seminal paper. The paper explains that microservices are used to compose
    complex applications by using small, independent (autonomous), replaceable processes
    that communicate by lightweight APIs that do not depend on language.


    For more information, "Microservices: A new architectural term" by Martin Fowler,
    which is available at:


    ```

    http://martinfowler.com/articles/microservices.html

    ```'
  merge: -1
  pgno: 16
