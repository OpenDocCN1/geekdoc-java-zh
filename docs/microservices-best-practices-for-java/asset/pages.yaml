  md: '# 2.1 Java platforms and programming models


    New applications should minimally use Java 8, and should embrace new language
    features like lambdas, parallel operations, and streams. Using annotations can
    simplify the codebase by eliminating boilerplate, but can reach a subjective point
    where there is "too magic". Try to establish a balance between code cleanliness
    and maintainability.


    You can create perfectly functional microservices using nothing but low-level
    Java libraries. However, it is generally recommended to have something provide
    a reasonable base of support for common, cross-cutting concerns. It allows the
    codebase for a service to focus on satisfying functional requirements.


    # 2.1.1 Spring Boot


    Spring Boot provides mechanisms for creating microservices based on an opinionated
    view of what technologies should be used. Spring Boot applications are Spring
    applications, and using a programming model unique to that ecosystem.


    Spring Boot applications can be packaged to run as an application hosted by an
    application server, or run as a runnable .jar file containing the composition
    of dependencies and some embedded server (usually Tomcat). Spring emphasizes convention
    over configuration, and uses a combination of annotations and classpath discovery
    to enable additional functions.


    Spring Cloud is a collection of integrations between third-party cloud technologies
    and the Spring programming model. Some integrations between the Spring programming
    model and third-party technologies. In fewer cases, Spring Cloud technologies
    are usable outside of the Spring programming model, like Spring Cloud Connectors.


    For more information about Spring Cloud Connectors, see the following website:
    http://cloud.spring.io/spring-cloud-connectors/spring-cloud-connectors.html


    # 2.1.2 Dropwizard


    Dropwizard is another technology for creating microservices in Java. It also has
    an opinionated approach, with a preselected stack that has an embedded servlet
    container with additional capabilities. The set of technologies that Dropwizard
    supports is comparatively narrow, although third party or community provided plug-ins
    are available to fill the gaps. Some of their capabilities, specifically their
    support for application metrics, are quite good.


    # 2.1.3 Java Platform, Enterprise Edition


    Java Platform, Enterprise Edition (Java EE) is an open, community driven standard
    for building enterprise applications.


    Java EE technologies are suited for creating microservices, especially Java API
    for RESTful Web Services (JAX-RS), and Contexts and Dependency Injection (CDI)
    for Java EE. Annotations are used for both specifications, for support for dependency
    injection, lightweight protocols, and asynchronous interaction patterns. Concurrency
    utilities in Java EE provide a straightforward mechanism for using reactive libraries
    like RxJava in a container friendly way.'
