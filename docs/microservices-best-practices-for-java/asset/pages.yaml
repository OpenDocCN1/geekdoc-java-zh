    \ to indicate which values should be used during serialization and to ignore unknown\
    \ properties.\n\n```\nExample 4-3 Jackson annotations for JSON parsing\n@JsonInclude(NON_EMPTY)\n\
    @JsonIgnoreProperties(ignoreUnknown = true)\npublic class Account {\n    // Account\
    \ ID\n    @JsonProperty(\"id\")\n    protected String id;\n}\n```\n\nBy following\
    \ these rules, your microservice can be resilient against any changes that do\
    \ not directly affect it. Even if the producer of the microservice removes or\
    \ adds attributes, they are not the ones you are using, your microservice continues\
    \ functioning normally.\n\n# Producing APIs\n\nWhen providing an API to external\
    \ clients, do these two things when accepting requests and returning responses:\n\
    \n+   - Accept unknown attributes as part of the request\n- If a service has called\
    \ your API with unnecessary attributes, discard those values.\nReturning an error\
    \ in this scenario will cause unnecessary failures.\n- Only return attributes\
    \ that are relevant for the API invoked\n\nLeave as much room as possible for\
