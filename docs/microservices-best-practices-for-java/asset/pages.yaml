- img_proc: true
  md: 'The following metrics can be used to do auto scaling.


    The scaling member monitors the use of the following resources within the server
    process:


    +   - CPU

    - Heap

    - Memory


    The scaling member monitors the use of the following resources at the host level:


    +   - CPU

    - Memory


    For more information, "Setting up auto scaling for Liberty collectives" at:


    http://www.ibm.com/support/knowledgecenter/SSAW57_9_0.0/com.ibm.websphere.wlp.ndd/ae/twlp_wve_autoscaling.html


    When you start and stop instances of microservices, your service discovery must
    also be informed. One easy way to do this is to inform the HTTP server in front
    of your system of microservices about started or stopped microservices. Liberty
    has a feature that can be combined with the auto scaling feature. The Dynamic
    Routing feature enables routing of HTTP requests to members of Liberty collectives
    without having to regenerate the WebSphere plug-in configuration file when the
    environment changes. When servers, cluster members, applications, or virtual hosts
    are added, removed, started, stopped, or modified the new information is dynamically
    delivered to the WebSphere plug-in. The feature provides the Dynamic Routing service,
    which dynamically retrieves routing information from the collective repository
    and delivers this to the WebSphere plug-in.


    Liberty servers that take part in this functionality must be joined in a collective.
    A set of Liberty servers in a single management domain is called a collective.
    A collective consists of at least one server with the collectiveController-1.0
    feature enabled that is called a collective controller. Optionally, a collective
    can have many servers with the collectiveMember-1.0 feature enabled that are called
    collective members and a collective can be configured to have many collective
    controllers.'
