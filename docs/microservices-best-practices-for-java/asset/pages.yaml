- img_proc: true
  md: 'GET /accounts/16 Retrieve a specific item

    PUT /accounts/16 Update a specific item

    PATCH /accounts/16 Update a specific item

    DELETE /accounts/16 Delete a specific item


    The general consensus is to keep things simple with URLs. If you create an application
    that tracks a specific kind of rodent, the URI would be /mice/ and not /mice/,
    if it makes you wince.


    Relationships are nested by nesting URLs, for something like /accounts/16/credentials
    for managing credentials with an account.


    Where there is less agreement with what operations that are associated with the
    resource, but that do not fit within this structure. There is no single correct
    way to manage these operations. Do what best for the consumer of the API.


    For example, Game One!, the Player service provides operations that assist with
    generating users and favorite colors. It is also possible to retrieve, in bulk,
    the location of every player in the game. The structure that chosen reflects operations
    that span all players, still allowing you to work with specific players. This
    technique has its limits, but illustrates the point:


    +   GET /players/accounts Retrieve a list of all players

    POST /players/accounts Create a new player

    GET /players/accounts/(id) Retrieve a specific player

    GET /players/accounts/(id)/location Retrieve a specific player''s location

    PUT /players/accounts/(id)/location Update a specific player''s location

    GET /players/color Return 10 generated colors

    GET /players/name Return 10 generated names

    GET /players/locations Retrieve the location of all players


    # Versioning


    One of the major benefits of microservices is the ability to evolve services independently.
    Given that microservices call other services, independence comes with a giant
    cost. You cannot cause breaking changes in your API.


    The easiest approach to accommodating change is to never break the API. If the
    robustness principle is followed, and both sides are conservative in what they
    say and liberal in what they receive, it can take a long time before a breaking
    change is required. When breaking change finally comes, you can opt to build a
    different service entirely and replace the original over time, perhaps because
    the domain model has evolved and a better abstraction makes sense.


    If you need to make breaking API changes for an existing service, decide how to
    manage those:


    +   - Will the service handle all versions of the API?

    - Will you maintain independent versions of the service to support each version
    of the API?

    - Will your service support only the newest version of the API and rely on other
    adaptive layers to convert from the older API?


    After you decide the hard part, the easiest problem to solve is to reflect the
    version in your API. There are generally three ways to handle versioning a REST
    resource:


    +   - Put the version in the URI

    - Use a custom request header

    - Put the version in the HTTP Accept header and rely on content negotiation'
  merge: -1
  pgno: 34
- img_proc: true
  md: "# Put the version in the URI\n\nAdding the version into the URI is the easiest\
    \ method for specifying a version. This approach has these advantages:\n\n+  \
    \ - It is easy to understand.\n- It is easy to achieve when building the services\
    \ in your application.\n- It is compatible with API browsing tools like Swagger\
    \ and command-line tools curl.\n\nIf you're going to put the version in the URI,\
    \ the version should apply to your application as a whole, for example, /api/v1/accounts\
    \ instead of /accounts/v1. Hypermedia as the Engine of Application State (HATEAS)\
    \ is one way of providing URIs to API consumers so they are not responsible for\
    \ constructing URIs themselves. GitHub, for example, hypermedia URLs in their\
    \ responses for this reason.¹³ HATEAS becomes difficult if not impossible to achieve\
    \ if different backend services have independently varying versions in their URIs.\n\
    \nIf you decide to place the version in your URI, you can manage it in a different\
    \ ways, partly determined by how requests are routed in your system. However,\
    \ for a moment that your gateway exposes the external /api/v1/accounts to /accounts/v1,\
    \ which maps to the JAX-RS endpoint provided by your service. In this case, /accounts\
    \ is a natural context root. After that you can include the version in the @ApplicationPath\
    \ annotation, as shown in Example 2-1, which works well when the application is\
    \ supporting only one version of the API.\n\nExample 2-1 Using the @ApplicationPath\
    \ annotation to add the version to the URI\n\n```\npackage retail_store.accounts.api;\n\
    @ApplicationPath(\"/v1\")\npublic class ApplicationClass extends Application {\
    \ }\n```\n\nAlternately, if the service should support more than one version of\
    \ the application, you can push the version to @Path annotations, as shown in\
    \ Example 2-2.\n\nExample 2-2 The @ApplicationPath defines a rest endpoint without\
    \ changing the URI\n\n```\npackage retail_store.accounts.api.v1;\n@ApplicationPath(\"\
    /*\")\npublic class ApplicationClass extends Application { }\n```\n\nExample 2-3\
    \ The version is added to the API using the @Path annotation\n\n```\npackage retail_store.accounts.api.v1;\n\
    @Path(\"/v1/accounts\")\npublic class AccountsAPI {\n@GET\n@Path(\"{id}\")\n@Produces(MediaType.APPLICATION_JSON)\n\
    public Response getAccounts(@PathParam(\"{id}\") String id) {\n getId(id);\n}\n\
    }\n```\n\n> ¹³ https://developer.github.com/v3/#hypermedia"
  merge: -1
  pgno: 35
- img_proc: true
  md: 'One of the arguments against including the version in the URL is a strict interpretation
    of the HTML standard that a URL should represent the entity and if the entity
    being represented changed, the URL should not change.


    Another concern is that putting versions in the URI requires consumers to update
    their URI references. This concern can be partially resolved by allowing requests
    to be made without a version, and then mapping those requests to the latest version.
    However, this approach is prone to unexpected behavior when the latest version
    changes.


    # # Add a custom request header


    You can add a custom request header to indicate the API version. Custom headers
    can be taken into consideration by routers and other infrastructure to route traffic
    to specific backend instances. However, this mechanism is not as easy to use for
    all of the same reasons that Accept headers are not easy to use. In addition,
    a custom header that only applies to your application, which means consumers need
    to learn how to use it.


    # # Modify the Accept header to include the version


    The Accept header is an obvious place to define a version, but is is one of the
    most difficult to test. URLs are easy to specify and replace, but specifying HTTP
    headers requires more detailed API and command-line invocations.


    Plenty of articles describe the advantages and disadvantages of all three methods.
    This blog post by Troy Hunt is a good place to start:

    https://www.troyhunt.com/your-api-versioning-is-wrong-which-is/


    The following are the most important things to take away from this chapter:


    +   - Design your APIs from the consumer point of view.

    - Have a strategy for dealing with API changes.

    - Use a consistent versioning technique across all of the services in your application.'
  merge: -1
