  md: '# 2.3.3 Application and service structure


    Monolithic Java EE applications are typically structured in tiers (client, web,
    business, and data), with long lived application servers hosting web archives
    (WAR files), enterprise archives (EAR files), or both for disparate parts of an
    application, as shown in the left side of Figure 2-2. Naming and packaging conventions
    become important as JSPs, JSFs, servlets, and EJBs for different parts of the
    application are deployed to the same server. Common data stores provide consistency
    for data representation, but also introduce constraints in how data can be represented
    and stored.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_28_0.png)


    Figure 2-2 Order and Catalog Services as monolithic or microservices applications


    A microservices architecture will likely have these application tiers, but the
    elements of each tier will likely be provided by independent services that run
    in independent processes, as shown in the right side of Figure 2-2. Note these
    details:


    +   - The backend-for-frontend pattern is commonly used to support specialized
    behavior for specific front ends, like optimizations for specific devices or providing
    additional capabilities in a web application.


    +   - Although each service owns its own data store, remember that the data store
    is still an independent service.


    Not all microservices will have all of these elements. For example, applications
    that use JSP or JSF, or interpreted scripts like PHP in the backend. They could
    be considered as "backend-for-frontend", especially if they have a close relationship
    with JavaScript running in the browser. One however, does not use the backend-for-frontend
    pattern (at the time of this writing). The JavaScript single page application
    is served as a set of static resources from an independent service. The application
    then runs in the browser, and calls backend APIs directly.'
