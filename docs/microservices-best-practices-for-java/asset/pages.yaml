  md: "The different internal sections break down into the following subsections:\n\
    \n+   - Resources\n  Exposes JAX-RS resources to external clients. This layer\
    \ can handle basic validation of requests, but any business logic is passed on.\n\
    \n+   - Domain logic\n  This area is where the bulk of the functional code goes.\
    \ This code has no understanding of external dependencies to the application.\n\
    \n+   - Service connector\n  Handles communication with external services. This\
    \ can be services within the microservice system or third-party services. Responses\
    \ are validated and then passed to the domain logic layer.\n\n+   - Repositories\n\
    \  Includes data mapping and validation. The repositories layer has the logic\
    \ that is required to connect to the external data store.\n\nThe different sections\
    \ of the application have different testing requirements. For example, domain\
    \ logic does not require integration, whereas resources do. All of the code in\
    \ a particular Java class should provide function from the same section. Separate\
    \ the code in this way results in all of the code in a particular class having\
    \ the same testing requirements. This technique makes your test suite simpler\
    \ and better structured. Given the inherent complexity of microservices, it is\
    \ easy to get into a mess with testing, something that can add structure to your\
    \ tests is a good idea.\n\n# 7.3 Single service testing\n\nThis section defines\
    \ single service testing as the tests that the owners of an individual service\
    \ must create and run. These tests execute the code that is contained inside the\
    \ logic boundary of the internal microservice architecture as shown in Figure\
    \ 7-1 on page 78. Three types of tests apply here: Unit tests, component tests,\
    \ and integration tests. Unit and integration tests are used to test the individual\
    \ parts of the microservice, and component tests are used to test the service\
    \ as a whole.\n\n# 7.3.1 Testing domain or business function\n\nThe code in your\
    \ microservice performs business function should not make calls to any services\
    \ external to. This code can be tested using unit tests and a testing framework\
    \ such as JUnit¹¹. The unit tests should test for behavior and use the actual\
    \ objects (if no external calls are made) or mock the objects involved in any\
    \ operations.\n\nWhen writing tests using the actual objects, a simple JUnit test\
    \ suffices. For creating mock objects, you can use the built-in capabilities of\
    \ Java EE or use a mocking framework. The @Alternatives annotation² in the Context\
    \ and Dependency Injection (DI) specification enables injection of mock objects\
    \ instead of the actual beans. Plenty of mocking frameworks are available for\
    \ Java. For example, Mockito is designed to work with JUnit to allow you to mock\
    \ objects during testing. In the most basic use with Mockito you can create mock\
    \ objects using the @Mock annotation and define behavior when this is called by\
    \ using the Expectations() function.\n\n+   1 http://junit.org/junit4/\n2 http://docs.oracle.com/javaee/6/tutorial/gjsdf.html\n\
    3 http://mockito.org/\n\nChapter 7. Testing 79"
