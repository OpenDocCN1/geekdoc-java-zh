  md: '# Internal structure


    Structure your code inside a service so that you have a clear separation of concerns
    to facilitate testing. Calls to external services should be separate from the
    domain logic, which should also be separate from logic specific to marshalling
    data/from a backing data service.


    Figure 2-3 shows a simplified version of a microservice architecture. This architecture
    separates the domain logic from any code that interacts with or understands external
    services. The architecture is similar to the Ports and Adapters (Hexagonal) architecture^5,
    and to Toby Clemenson''s approach in "Testing Strategies in a Microservice Architecture"^6.


    ![](img/857a3fe455a7acf964c5a1d25b24ba28_29_0.png)


    Figure 2-3 The internal structure of a microservice


    The example structure considers the following elements:


    +   - Resources expose JAX-RS resources to external clients. This layer handles
    validation of requests and passes the information into the domain layer.

    - Domain logic, as a general concept, takes many forms. In Boundary-Entity-Control
    patterns, domain logic represents the entity itself, with parameter validation,
    state change, and so on.

    - Repositories are optional, but can provide a useful abstraction over the core
    application domain logic and data store when present. This configuration allows
    the backing data store to be changed or replaced without extensive changes to
    the domain logic.

    - Service connectors are similar to the Repository abstraction, encapsulating
    communications with other services. This layer functions as either a facade or
    "anti-corruption" layer to protect domain logic from changes to external resource
    APIs, or to convert between API formats and internal model constructs.


    > 5 http://alistair.ckburn.com/#Hexagonal/architecture

    6 http://martinflower.com/articles/microservice-testing/#anatomy-modules


    16 Microservices Best Practices for Java **'
