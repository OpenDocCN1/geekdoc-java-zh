  md: "# REST Endpoint not implemented as EJB\n\nSome of the database changes or verifications\
    \ are are done at the point where the transaction manager has decided to commit.\
    \ In some situations, check constraints in the database for example, are verified\
    \ as one of the last steps before the transaction is committed. If the verification\
    \ fails, the outcome is a RuntimeException that the JPA provider throws, because\
    \ JPA uses exceptions to report errors. If you use EJBs for transaction management,\
    \ the place to catch the RuntimeException is in the code of the EJB where the\
    \ EJB contains the transaction. The stub code is generated by the EJB container.\
    \ Therefore, you cannot react to this RuntimeException and the exception is further\
    \ thrown to the place it will be called.\n\nIf you implement your REST endpoint\
    \ as an EJB, some may prefer, then the exception must be caught in your REST provider.\
    \ REST providers do have exception mappers to do the conversion of exceptions\
    \ to HTTP error codes. However, these exception mappers do not interfere in the\
    \ case when the RuntimeException is thrown during database commit. Therefore,\
    \ the RuntimeException is received by the REST client, which should be avoided.\n\
    \nThe best way to handle these problems is to implement the REST endpoint as a\
    \ CDI managed scoped bean. In this bean, you can injection the same way as inside\
    \ EJB. It is easy to inject your EJB into the CDI managed bean (Example 5-16).\n\
    \n+   Example 5-16 REST endpoint implemented as CDI managed bean with EJB injected\n\
    \n```\n```\n@RequestScoped\n@Path(\"/order\")\npublic class OrderREST {\n    @EJB\n\
    \    private OrderEJB orderEJB;\n}\n```\n```\n\nIt is also possible to integrate\
    \ EJBs with Spring (Enterprise JavaBeans (EJB) integration - Spring) and if preferred,\
    \ the transaction management can be done using Transaction Management Spring.\
    \ However, in a Java EE world it is better to delegate transaction management\
    \ to the server.\n\nFor more information, see the following website:\nhttp://docs.spring.io/spring/current/spring-framework-reference/html/ejb.html\n\
    \n# 5.2.3 BeanValidation\n\nBeanValidation is also part of the Java EE 7 specification:\
    \ Bean Validation 1.1 JSR 349 The intention of Bean Validation is to easily define\
    \ and enforce validation constraints on your bean data. In a Java EE environment,\
    \ Bean Validation is done by the different Java EE containers automatically. The\
    \ developer only needs to set the constraints, in the form of annotations on attributes,\
    \ methods, or classes. The validation is done on the invocation of these elements\
    \ automatically (if configured). The validation can also be done explicitly in\
    \ your source code.\n\nFor more information about Bean Validation, see the following\
    \ website:\nhttp://beanvalidation.org/\n\n> 14 http://jcp.org/en/jsr/detail?id=349"
