    # TALKING THE TALK OR WALKING THE WALK?


    When you get right down to it, central banking is really a confidence game. The
    primary task of a central bank is to control inflation. If corporations and individuals
    believe their central bank will be successful in that task, they will behave accordingly.
    Workers won''t be worried about inflation eating up the purchasing power of their
    wages, so they won''t have to ask for compensating increases in their remuneration.
    And if corporations believe that their workers'' wage demands will remain modest,
    they won''t have to hike their prices to protect their profit margins. So confidence
    in your central bank''s ability to manage inflation affects actual economic behaviour.
    And, likewise, a lack of confidence in the central bank affects the behaviour
    of economic actors.


    In recent years, public confidence in monetary policy has been anchored by an
    inflation rate target that each central bank sets. The most common target is 2
    percent, which is the official inflation target rate of the Federal Reserve Board,
    the European Central Bank, the Bank of England, and the Reserve Bank of Australia,
    among many others.


    The target rate is supposed to work the same way a traffic signal does. An inflation
    rate below the central bank''s target rate is a green light'
