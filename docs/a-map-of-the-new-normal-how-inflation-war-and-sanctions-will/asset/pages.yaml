    Consider, for example, the position in which the Bank of Canada finds itself.
    In 2022, for the first time in its nearly nine-decade history, the central bank
    was forced to declare a loss in its third-quarter statement, to the tune of C$522
    million. That loss was the direct result of the carrying cost of the massive C$3
    billion worth of Government of Canada bonds that the bank had bought at egregiously
