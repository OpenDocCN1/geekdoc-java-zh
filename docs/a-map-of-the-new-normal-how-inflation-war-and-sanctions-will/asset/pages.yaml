    # QUANTITATIVE TIGHTENING: CAN GOVERNMENTS AND THEIR CENTRAL BANKS AFFORD TO DELEVERAGE?


    A central bank''s raising or lowering of short-term interest rates used to pretty
    well define the totality of monetary policy shifts. But that was before quantitative
    easing came to play such a prominent role in central bank policy. The principal
    difference between the two levers is that while adjustments to short-term interest
    rates go up and down over the course of a business cycle, quantitative easing
    has typically been a one-way street.


    But not anymore. A number of central banks, including the all-important Federal
    Reserve Board, are now traveling in the opposite direction, having embarked on
    a quantitative tightening program where they are now net sellers instead of massive
    buyers of government bonds. This course could provide a powerful source of braking
    power on the economy and inflation, and on the prices of assets such as stocks
    and real estate.


    As its name implies, quantitative tightening is the polar opposite of quantitative
    easing. Instead of buying bonds, the central bank sells the bonds it once go and
    stuck on its balance sheet, spitting them back out for the bond market to digest.
    Just as central bank purchases of government bonds lowered both bond yields and
    connected long-term interest rates (such as mortgage rates), central bank sales
    of government'
