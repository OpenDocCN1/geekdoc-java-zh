    While central banks are powerless to prevent food or energy price shocks, they
    can govern their inflationary fallout. An oil price shock, example, doesn’t have
    to be inflationary unless central banks choose to soften the shock by printing
    money. If the money supply remains the same, soaring oil prices will force households
