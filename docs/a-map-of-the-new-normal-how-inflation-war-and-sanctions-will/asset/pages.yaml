    turn, the prices of everything else should fall with the drop-off in demand. So
    while the relative price of oil will have risen dramatically relative to the price
    of everything else, the overall price level not rise at all.


    If, on the other hand, central banks monetize the price shock, the positive impact
    of their actions on household spending could cushion the blow of higher energy
    prices and allow consumers to maintain their spending on everything else. In that
    case there would be no offsetting decline in the prices of everything else to
    cancel or at least partially offset the increase in energy prices, and the general
    price level and inflation would rise. And the higher and longer inflation rises,
    the more likely that it will induce workers to chase those soaring prices in their
    wage demands, setting off a self-perpetuating wage-price spiral long after the
    initial catalysts for inflation, like food prices or energy prices, began to rise.


    So, while inflation typically starts with a price shock—for oil, more often than
    not—it quickly spreads from energy prices to all prices through wages.


    # ENERGY SHOCKS HAVE BEEN COMMON TO ALL PAST INFLATIONARY EPISODES'
