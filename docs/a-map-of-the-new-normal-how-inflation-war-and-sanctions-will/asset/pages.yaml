    that time, the yield on 10-year Treasuries peaked at around 16 percent.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Now turn the clock forward some decades. By 2021, thanks to massive quantitative
    easing, the yield on the 10-year Treasury bond had nosedived to a scant 0.5 percent.
    Meanwhile, over the same period the S&P 500 index had increased by more than thirtyfold.
    The lower the yields paid by bonds, the higher the price investors will pay for
    competing stocks.


    The steady, unrelenting decline in government bond yields and the attendant rise
    in stock market returns had a profound impact on investor behaviour. Traditionally,
    the rule of thumb in the investment industry was that a portfolio should hold
    60 percent of its assets in stocks and 40 percent in bonds. thinking behind this
    ratio was that since bonds and stocks usually move in opposite directions, and
    stocks have generated historically higher returns, this split would ensure an
    adequate return over time.


    But as yields continued to plummet to record new lows, that traditional rule of
    thumb failed to hold true for more and more investors. The interest rate on bonds
    had fallen so far that the coupons (interest payments) paid retail investors yielded
    too meagre a return to justify holding them. And for institutional investors such
    as pension plans, bond market yields no longer provided returns adequate to cover
    their future actuarial liabilities, forcing them to find more attractive elsewhere—like
    investments in infrastructure, real estate, private equity, and, most of all,
    stocks.


    As yields continued to fall, the 60/40 rule gave way to much higher proportions
    weighted to stocks. In other words, the more bonds the central bank bought at
    hugely discounted interest rates (and excessively high prices) through quantitative
    easing, the less private investors wanted to buy them.


    Central banks had a seemingly insatiable appetite for their own government’s bonds.
    Coming out of the pandemic, central banks collectively held a staggering $36 trillion
    worth of bonds on their balance sheets, almost 30 percent of the total value of
    all outstanding bonds. When questioned about that practice, the central banks
    defended their massive purchases by claiming that they were not deliberately manipulating
    bond'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'yields, given that they’d bought the bonds on the open market, just like everyone
    else.


    That was true, in so far as it went. But what they neglected to mention was that
    theyoutbid all other participants, driving bond yields (which are inversely related
    to bond prices) to record losses so that their governments would pay only trivial
    financing costs on the massive deficits they had racked up during the pandemic.


    So while it was true that central banks had bought their bonds in the market,
    it was equally true that they were playing different rules than the other participants.
    Unlike private investors or fund managers, who have to worry about their portfolio’s
    performance, central banks didn’t have to worry about the performance of the huge
    fixed-income portfolio they held on their suddenly bloated balance sheets. At
    least, they didn’t think they ever would.


    In words, while the central banks did indeed buy the bonds at market prices, they
    also massively distorted the market. What’s wrong with that? After all, warping
    the bond market makes homeowners richer, drives record stock market gains, and
    allows governments to finance record deficits at trivial interest rates, why don''t
    central banks just keep doing it?


    The answer, of course, is that rigging the markets is a game as old as markets
    themselves. The problem is that they can’t stay forever. Financial assets such
    as stocks and bonds eventually find their true level. At times of low inflation,
    central banks can distort the bond market and get away with financing huge government
    deficits by providing huge bondbuying subsidies, but they can’t do the same when
    inflation is soaring to highs not seen in four decades. When that happens, the
    emperor is suddenly seen to be wearing no clothes!


    Inflation is the bondholder’s enemy, given that it devalues the real value of
    the coupon payments over time. A bond pays its owners a series of payments over
    a fixed time period—hence the name “fixed income.” Those payments are worth less
    and less as inflation erodes their real value—and the higher the inflation rate,
    the more value is eroded. So, in order for anyone to buy a bond whose coupon payments
    don’t cover inflation,'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'the price of the bond itself must fall. Say a bond that was to mature at $100
    previously sold at $95 but suddenly inflation rose. That bond would now have to
    sell at a lower price, say at $90, to compensate for the fact that its coupon
    payments had been eroded by inflation. In other words, the buyer would get it
    at a discounted price, and the more that inflation robbed the real value of the
    coupon payment, the bigger the price discount that would have to be offered to
    the investor. The longer those coupon payments stretched out into the future,
    the greater the impact inflation would have on the underlying value of the bond,
    and thus the greater decline in the price of the bond. Which is why the price
    of longer-term bonds (20-years+) are more vulnerable to inflation than the price
    of short-term bonds (1 to 5 years).


    So, if your bonds are losing money because they no longer protect your investment
    against inflation, why not just sell them? Private investors can just do that,
    and they did. But the option wasn''t as simple for central banks.


    If central banks stopped buying their governments’ bonds at artificially low yields,
    the market would find its true value; that is, other participants in the market
    would force up bond yields in response to soaring inflation rates, leaving central
    banks facing even bigger losses on the bonds they were already holding. And if
    those banks stopped subsidizing their governments by buying their bonds at artificially
    low yields, the cost of servicing the government’s debt—which had ballooned with
    fiscal deficits during the pandemic—would suddenly soar, ultimately leaving taxpayers
    on the hook. If central banks didn’t sell the bonds they had bought during the
    pandemic, their losses would grow as bond yields continued to rise with inflation.


    If holding the bond is going to hurt you, you are going to be in a very uncomfortable
    position. And it’ll be that much worse knowing how much it is at stake.


    But what was vexing for central banks was euphoric for shareholders. While all
