    jobs in developed economies like the United States, Canada, the United Kingdom,
    Australia, and the European Union to low-paying jobs in developing countries like
    China and India.


    When nearly everything you buy is suddenly made by workers earning a tenth of
    the wage of those who used to make those products, you don’t need a graduate degree
