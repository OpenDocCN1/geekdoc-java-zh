  md: '# INFLATION IS HERE TO STAY


    While its foundation was poured by the huge monetary and fiscal expansion that
    occurred during the pandemic, inflation is now sustained by a far more powerful
    and lasting dynamic. Economic warfare promises to finish the job that the economic
    lockdowns from the pandemic started—the massive realignment of global supply lines.
    In the process, sanctions are removing what unquestionably has been the single
    largest brake on inflation in the postwar period: the ability for foreign trade
    to replace goods made by workers in high-wage economies like North America and
    Western Europe with goods mass-produced by low-wage workers in China and elsewhere
    in the developing world.


    But in a time of conflict and sanctions, it is security, not costs, that matters
    most. All of a sudden, the domestic labour force in high-wage countries is no
    longer in demand as supply chains managed by cheap overseas workers are no longer
    deemed secured. But it is from clear whether domestic labour force—members of
    which built up sizable nests from generous handouts during the pandemic—wants
    the work, or what wage it is willing to work for.


    In any event, the new mantras of friendshoring and reshoring have put the American
    worker back in the driver''s seat. And those workers, once the victims of globalization,
    are now driving wages ever higher, putting in place a wage-price spiral that threatens
    not only food and energy prices but prices for just about everything in the economy.


    The realignment of global supply lines already well underway very quickly go into
    overdrive geopolitical conflict worsen between the two largest economies in the
    world. The impact on supply and prices of a full-fledged sanctions war between
    the United States and China would dwarf the impacts of Western sanctions against
    the resource-rich but relatively small Russian economy.


