    system as some of America’s largest financial institutions teetered on the brink
    of'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'bankruptcy. The support was also intended to spur an economic recovery from
    the recession that had engulfed not only the US economy but most of the world
    economy as well. But even when the crisis was well over, the Federal Reserve Board
    kept buying government bonds for the next five years, effectively underwriting
    massive asset inflation in both the housing market and the stock market. And when
    the Federal Reserve Board resurrected quantitative easing in response to the pandemic,
    it engaged in it on a scale never seen seen before, compelling other central banks
    around the world to follow suit.


    It seems that the one constant in an ever-changing world of monetary conditions—whether
    intended or not—is that the stock market has been the prime beneficiary of Federal
    Reserve Board policy.


    The main reason benefits so much from quantitative easing is that they are the
    primary investment alternative to bonds in the composition of any investor''s
    portfolio. When bond yields fail to record lows because of massive central bank
    bond purchases, private money flows from the bond market to the stock market.
    That flow of flows, measured in the trillions of dollars, can only move stock
    values in one direction—up!


    Over the last forty years, that flow has pretty well one way. At first this was
    due to globalization''s success, mainly through offshoring, in wrestling down
    inflation and hence interest rates. Since 2008, it has also been driven by the
    massive outright purchasing of bonds by central banks under the cover of their
    quantitative easing programs.


    As interest rates fell continuously over decades, the value of stocks soared.
    Consider, for example, the opposing trajectories of the yield on 10-year Treasury
    bonds, a common benchmark for the US government fixed-income market, and the S&P
    500, historically the benchmark for US stocks. Bond yields peaked in the early
    1980s when Paul Volcker, renowned chairman of the Federal Reserve Board at the
