    publicly on the issue. Chinese wages may no longer be ten times lower than those
    in North America, but the minimum wage in China is still four times lower than
    in the United States and considerably lower when compared to wages in many EU
    countries.


    While some central banks have warned that interest rates will not return to the
    record lows seen during the pandemic, none has yet abandoned the sunny forecasts
    of inflation returning to a target range, as if nothing has changed in the world
