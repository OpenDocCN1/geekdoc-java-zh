    # STOCKS ARE NO LONGER A ONE-WAY BET


    Quantitative easing created many winners: record-low government-debt servicing
    costs; record-low mortgage rates for homeowners; near-zero financing rates on
    car loans and leases for consumers. But the biggest winner hands down was the
    stock market. And that made the wealthiest households in our society a lot wealthier.


    Make no mistake about it: ever since the global financial crisis of 2007/2008,
    monetary policy has been very friendly toward the stock market. It’s no coincidence
    that the Federal Reserve Board adopted quantitative easing, Wall Street enjoyed
    its longest-running rally in history—right up until the pandemic. And while the
    economic shock and panic selling quickly felled the stock market, it took no time
    at all for stocks to rebound and go on to new record highs as the Fed shifted
    its quantitative easing program into overdrive.


    In this respect not a lot has changed since the Federal Reserve Board bailed out
    Wall Street by scooping $700 billion worth of toxic securities backed by delinquent
