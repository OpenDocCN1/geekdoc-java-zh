  md: '# CHAPTER 5


    # DELEVERAGING


    While Toria Slept on the night of November 21, 2022, she received a text message
    she didn’t read until she woke up next morning. What she learned would soon make
    headlines. She, along with everyone else at United Furniture Industries of Tupelo,
    Mississippi, had been laid off. All twenty-seven hundred employees had received
    the same text message: Don’t come to work. If you are on the road on a delivery
    truck, turn around and bring it back. No notice, no severance, no company-paid
    health care. It was three days before Thanksgiving.


    Of course, what happened to United Furniture was part of an economic chain reaction.
    Within hours, Seagrove Lumber—which built the frames for United Furniture—was
    laying off its workforce. Those workers, like the ones at United had been, were
    dominoes, and would continue to fall. North of the border, major Canadian lumber
    producers such as Canfor and West Fraser Timber, which provided much of the lumber
    framing for newly built American homes, closed mills, laying off more than four
    hundred workers.


    All of these events had a single origin: a real estate crash. In the United States,
    new real estate listings in November 2022 had fallen over 25 percent from the
    year before. Some once red-hot Canadian markets were hit even harder. Sales in
    Toronto were down 49 percent, while Canadian housing prices nationally dropped
    by almost 20 percent that year.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'With fewer houses sold on the market, it was no surprise that construction
    companies were buying less timber framing and households were buying less furniture.
    They were all just dominoes.


    But the question on everyone’s mind—from lumber companies to furniture manufacturers—was
    why a once booming market in North America was suddenly collapsing. And the answer
    had very little to do with what was happening in North America but everything
    to do with what was happening in far-off Ukraine. As we will see, the North American
    housing market had become collateral damage in the ever-escalating economic war
    between Russia and NATO.


    Not that good times can go on forever. It shouldn’t come as any surprise that
    the lowest interest rates in recorded history (going back five thousand years)
    would spawn a housing-market boom and the longest-running bull market in history.
    What is surprising is that both homeowners and shareholders had to regard those
    conditions as the new normal. They were anything but. And more important, they
    weren’t sustainable.


    Easy money policies have always nurtured speculative bubbles: the Roaring Twenties
    (1924–28); Japan’s real estate and stock market bubble of the 1980s; the dot-com
    bubble in 2000; and, most recently, the subprime mortgage bubble back in 2007/2008—to
    name a few of the major ones in recent history. When you can borrow for free,
    a lot of otherwise questionable investments suddenly become alluring. The massive
    monetary easing that took place around the pandemic was no exception in this regard.


    In the United States, the money supply grew by almost 40 percent over the course
    of the pandemic, compared to a long-term average of 7 percent per year. In Canada,
    the money supply (as measured by the monetary aggregate M1) grew by 35 percent
    after the pandemic compelled quantitative easing by the Bank of Canada.


    The fact that inflation has soared during a period of rapid monetary expansion
    will come as no surprise to followers of the late American economist Milton Friedman,
    the father of the monetarist school, whose famous dictum “inflation is always
    and everywhere a monetary phenomenon”” has never run more true. The massive increase
    in money'
