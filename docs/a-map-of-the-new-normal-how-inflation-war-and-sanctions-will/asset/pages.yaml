    economy through cuts to the short-term interest rate target was no longer the
    name of the game. Now it was all about bringing down long-term interest rates
    otherwise determined in the bond market. And if an extraordinary amount of fiscal
    stimulus came as part of the deal, so the better.


    Before quantitative easing became commonplace in monetary policy, the amount of
    fiscal stimulus a government could provide to the economy was always circumscribed
    by the impact that huge fiscal deficits would have on the government’s, and everyone
    else''s, borrowing costs. That was because when governments racked up huge deficits
    in the past, their cost of borrowing (government bond yields) would become punitive
    compared to what was incurred when they exercised a greater degree of fiscal probity
    in their borrowing appetites.


    The more bonds that the market had to absorb from an issuing government, the higher
    the yield that government would have to pay to place all its debt in the bond
    market. As a result, higher deficits quickly led to higher interest rates, and,
    of course, higher interest rates would turn be an impediment to economic growth,
    offsetting much of the fiscal stimulus that spending itself was supposed to impart.
    That very impact on debt-servicing costs brought a strong measure of self-restraint
    and market discipline to government borrowing and spending.


    Soaring debt-servicing costs also had a nasty feedback impact on government deficits
    themselves and, therefore, fiscal policy. The higher the interest rate that the
    government had to pay on its bonds, the greater the percentage of its tax revenue
    that would have to be devoted to paying debtservicing costs instead of paying
    for vote-getting program spending. Over time, program spending would be “crowded
    out” by rising debt-servicing payments.


    However, the adverse consequences of massive government spending and deficits
    were suddenly suspended during the pandemic, thanks to'
