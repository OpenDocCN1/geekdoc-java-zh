    Another reason is that the Federal Reserve Board and other central banks would
    follow this path quite well go broke into the process.


    # MARKING TO MARKET


    “Mapping to market” is how portfolio managers keep score on their investments.
    It is a way of comparing the value of the securities at the time they were bought
    with their current value in the marketplace. The results are usually reported
    to clients monthly, or at a minimum, on a quarterly basis.


    Central banks also have to report their holdings quarterly, and what they have
    recently reported has never been reported before. For the first time in their
    history, they are hemorrhaging red ink as they try to finance the massive bond
    portfolios they acquired during their quantitative easing programs. And the losses
    will continue to pile up years to come.


    Under normal conditions, central banks actually make money for their governments
    through the bonds they hold on their balance sheet. They typically remit those
    earnings every year to their country’s finance'
