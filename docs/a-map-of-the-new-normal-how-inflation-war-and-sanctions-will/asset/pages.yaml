  md: '# CHAPTER I


    # THE BIG EASY

    (COMING OUT OF THE PANDEMIC)


    In the time of our greatest calamity we never had it so good. While the COVID-19
    virus in its various mutations cost millions of workers in G7 countries their
    jobs, it was simultaneously true that nobody seemed to work anymore. Everybody,
    it seemed, was on some kind of government-paid program.


    Since the initial wave of the viral pandemic washed ashore, G7 countries have
    spent some $2.2 trillion on a bevy of programs, including direct income-support
    payments to households whose jobs have been lost to the economic shutdowns or
    generous wage subsidies to corporations to help their wage bill and keep employees
    working. The United States, for example, spent more than $1.5 trillion in pandemic
    offsets, including three rounds of direct payments to households regardless of
    their employment status. In Canada, the federal government claims to have spent
    over $300 billion sheltering Canadians from the economic lockdowns that the pandemic
    forced.


    All that fiscal generosity left everyone flush with cash. Thanks to the generous
    support payments, North American households were financially better off during
    the pandemic-induced recession than they were before. And when the economy finally
    reopened, all that pent-up demand, armed with months of benefit cheques, sent
    retail sales soaring through the roof.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'We all, of course, liked getting a free lunch—whether we were a worker or a
    corporation. But was it really free?


    nAs it turned out, the flip side of the fiscal generosity shown by governments
    around the world was a massive and unprecedented increase in the size of (peacetime)
    fiscal deficits. The US deficit tripled to a record $3 trillion, reaching 15 percent
    of its GDP, the highest level since the Second World War. The European Union (EU)
    had to suspend one of its founding principles—the Stability and Growth Pact, which
    had limited members from running a budget deficit in excess of 3 percent of GDP—as
    its deficit in 2020 rose to twice that. The pact’s limits on deficit size and
    total debt size relative to GDP remains suspended, with fiscally wayward countries
    like Greece and Italy continuing to run budget deficits in the 7 percent of GDP
    range. In the United Kingdom, pandemic spending pushed deficits to 13 percent
    of GDP. And the deficit in Canada increased by a factor of ten—the largest increase
    as a percentage of GDP among all the Organisation for Economic Co-operation and
    Development (OECD) countries.


    The scale of these increases in budgetary deficits leaves one wondering whether
    there is any limit to how much debt governments can rack up. Economists can debate
    that issue theoretically until the cows come home, but the real question is: Should
    taxpayers care? Most taxpayers in G7 countries didn’t seem to be too fussed about
    their governments'' fiscal situation. Few parties even addressed the issue during
    elections.


    In the past, however, taxpayers would have carved plenty about fiscal deficits
    of this size. Back then, spendthrift governments that racked up massive deficits
    would have incurred huge financial penalties in terms of the interest rates payable
    to place their debt in global bond markets. And those increases in borrowing costs
    would have been passed on, in turn, to both the country’s corporations and households,
    making everyone in the economy pay more to borrow money. Surprisingly, the potential
    for economic chain reaction used to get the attention of most voters when confronted
    with wieldy government deficits.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'So why weren’t voters complaining about the explosion in fiscal deficits during
    the pandemic? The key reason for voter indifference was the chain reaction between
    the size of government deficits and the price of financing those deficits in the
    bond market had suddenly short-circuited. But why? What changed in the bond market
    that blunted if not totally nullified the impact that huge government deficits
    would normally have had on government borrowing rates and the yields paid to investors
    holding their debt?


    In a nutshell, what changed was who was buying government debt in the bond market
    during the pandemic and its immediate aftermath. In the past, it would have been
    financial institutions like pension plans and insurance companies or even individual
    retail investors who financed budgetary deficits by purchasing government debt
    in the bond market. And there was a very simple rule at play: the more bonds a
    government had to issue, the higher the yield or interest rate the government
    had to pay those holding its bonds. The principle is called supply and demand,
    and it works for setting the price of government bonds in the same way that it
    works for setting the price of everything.


    But that rule didn’t apply to central banks, which suddenly emerged during the
    pandemic as the principal buyer of government debt. While demanded premiums in
    the face of unprecedented peacetime deficits, they weren’t the ones buying the
    flood of government bonds issued during the pandemic. Suddenly, there was a new
    player in the game: central banks, whose purchases dwarfed those of other participants
    in the market.


    Whether we were talking about the Federal Reserve Board, or the European Central
    Bank, or the Bank of Canada, or the Bank of England, or the Reserve Bank of Australia,
    central banks became the principal buyers of their government’s debt. It was these
    banks that were suddenly financing all those generous support programs governments
    offered in the midst of the COVID-19 pandemic and the ensuing lockdowns of their
    economies. As they continued to gorge themselves on tranche after tranche of'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'government debt, their balance sheets ballooned, swollen with trillions of
    dollars of government-issued bonds.


    # QUANTITATIVE EASING (OR PRINTING MORE MONEY)


    Admittedly, the size of their central bank''s balance sheet isn''t something the
    average voter spends a whole lot of time thinking about. Nevertheless, they might
    ask themselves where the central bank got the money it to suddenly buy all these
    government-issued bonds. The answer was simple enough: they just printed it. They''ve
    been doing a lot of lately.


    The money-printing practice is known as quantitative easing, and it''s given governments
    a licence to spend like never before. By all accounts they''ve made maximum use
    of it. Quantitative easing has effectively replaced the discipline that the bond
    market used to impose on government borrowing before the practice found its way
    into the central banks'' tool box.


    The Federal Reserve Board, the central bank of the largest economy in the world,
    set the standard for other central banks to follow with its massive purchases
    of Treasuries. Those purchases shielded the bond market from having to finance
    the tripling of Washington''s budget deficit. Federal Reserve Board chair Jerome
    Powell authorized no less than $120 billion a month of central bank purchases,
    split evenly between US Treasuries and federally backed mortgages. As a result
    of all the money printed to buy these bonds the American money supply increased
    38 percent over the two years during which the pandemic elicited emergency spending
    programs from Washington. That scale of monetary expansion was a multiple of normal
    monetary growth, roughly 7 percent a year.


    North of the border the Bank of Canada pretty well followed suit. In 2021, Governor
    Tiff Macklem authorized the purchase of C$5 billion of Government of Canada bonds
    every week to finance the massive C$327 billion deficit that finance minister
    Chryst Freeland created in her budget.


    While today it is used as a means of financing massive fiscal deficits, the practice
    of quantitative easing didn''t start out that way. It had another purpose altogether.
    The term itself was coined by former chair of the'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Federal Reserve Board Ben Bernanke back in 2008. But the original inventor
    of the plan was actually the Bank of Japan, which had been practising some form
    of it since the 1990s—a time known as the lost decade in Japan after the country''s
    real estate and stock market bubble burst.


    Before the advent of quantitative easing, central banks had relied on adjusting
    their short-term policy rate to fine-tune monetary policy. Hence, in the United
    States market attention was focused on any announced changes to the benchmark
    federal funds rate. If the Federal Reserve Board lowered or raised the federal
    funds rate, commercial banks would quickly follow suit, passing the central bank
    to borrowers and lenders throughout the economy. But as the Bank of Japan learned,
    there was nothing a central bank could do to stimulate its economy after its policy
    rate had approached zero. It was akin to pushing on a string.


    So central banks began to focus on bringing down longer-term interest rates were
    based on what the government was paying to borrow money, the way to bring them
    down was central banks to start buying government bonds and, in the process, bring
    down government costs. In some cases (for example, the Federal Reserve Board),
    the central bank bought federally approved residential mortgages as well.


    It meant that central banks could not only bring down short-term interest rates
    by adjusting their policy rate (like the federal funds rate in the United States),
    but they could also bring down long-term interest rates by buying their government''s
