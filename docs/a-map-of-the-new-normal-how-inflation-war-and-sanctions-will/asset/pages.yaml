    better—those wages were a mere fraction of what they were at home. Once the offshoring
    option became available to employers, the once venerable Phillips curve no longer
    relevant to managing either unemployment or inflation. Governments no longer had
    to choose between a low rate of unemployment or a low rate of inflation. They
