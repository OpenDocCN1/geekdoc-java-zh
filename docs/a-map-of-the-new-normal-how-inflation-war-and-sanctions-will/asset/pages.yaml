  merge: -1
  pgno: 69
- img_proc: true
  md: 'As interest rates continue to rise, more and more homeowners who financed their
    homes through popular variable-rate mortgages hit the dreaded trigger rate, a
    threshold at which the actual size of your monthly payment has to increase. By
    the fall of 2022, half of the variable-rate mortgage holders in Canada had already
    reached that threshold. Trigger rates hit the housing market at both ends. As
    soaring mortgage rates disqualify more and more prospective buyers, trigger rates
    may force some mortgage holders to sell their homes because they can no longer
    afford the increase in monthly payments.


    Some lending institutions allowed homeowners to capitalize soaring interest costs
    by increasing the size of their mortgages and extending the length of the loan.
    In effect, they are increasing the amount that the homeowner owes on their mortgage
    by adding unpaid interest to the principal. So, instead of gradually paying off
    your mortgage, the amount you owe actually grows over time as more of your interest
    costs are capitalized in a bigger mortgage. Instead of getting richer every year
    by paying off a little bit of your mortgage, you''re actually getting poorer.


    By September 2023 three of the largest banks in Canada (Bank of Montreal, Toronto-Dominion
    Bank, and Canadian Imperial Bank of Commerce) disclosed that 20 percent of their
    residential mortgage borrowers, representing nearly $130 billion in loans, were
    seeing the size of their mortgage increase as their monthly payments no longer
    cover the interest cost of carrying the mortgage. Negative amortization, as it
    is commonly called, is a growing phenomenon in the mortgage market, putting more
    and more homeowners in financial peril and duress. And it''s also putting the
    country''s top lending institutions at risk. Their regulator, the Superintendent
    of Financial Institutions, has instructed them to put more reserves to ensure
    against the increasing likelihood of rising mortgage defaults.


    Shocked homeowners who find themselves a lot poorer today as a result are no doubt
    wondering what happened to the housing market in the years since they bought their
    home. What changed the cost of borrowing.'
  merge: -1
