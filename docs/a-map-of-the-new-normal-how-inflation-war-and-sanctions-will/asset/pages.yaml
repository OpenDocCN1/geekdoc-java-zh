    balance sheet. By March 2023, it had shed roughly $700 million worth of bonds.
    If the central bank wanted to pare back to pre-pandemic levels, the task would
    take years of quantitative tightening at the current pace of $1.1 trillion a year.
    The sustained pressure on bond yields, and hence on housing prices and the stock
