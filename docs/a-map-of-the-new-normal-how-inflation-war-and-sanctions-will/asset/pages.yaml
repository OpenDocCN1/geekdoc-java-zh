    of the Cold War—serves as the point of demarcation between Chinese jurisdiction
    and Taiwanese jurisdiction in the heavily travelled Taiwan Strait, which runs
    between the island and the Chinese mainland. Roughly half of the global container
    fleet and about 70 percent of global trade in semiconductors is shipped through
    what is one of the busiest maritime corridors in the world.


    Officially, China considers the entire strait to be within its territorial waters,
    since the island of Taiwan itself seen as an integral part of China. But at least
    until now, Beijing has accepted the median point, as that thin red line is commonly
    called, the de facto boundary for effective airspace and maritime jurisdiction.


    The waters running between the island and the Chinese mainland province of Fukien
    have been troubled ever since Generalissimo Chiang Kai-she fled Communist forces
    and established his own military regime in Taiwan (formerly called Formosa) following
    the Second World War. In the intervening years, there have been no less than three
    separate confrontations in the strait between Communist and Nationalist forces.


