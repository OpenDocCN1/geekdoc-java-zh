    would be lower; it basically immunized the economy from catching inflation by
    eviscerating the once powerful curve.


    The Phillips curve, first espoused by an Australian economist in the 1950s, posits
    that there was a direct trade-off between inflation and unemployment that policy-makers
    could actually choose. The curve plotted wage increases against the unemployment
