    recent decades. Typically, traders would short the currency of a targeted country
    against the dollar, forcing the country’s central bank to raise interest rates
    to defend its currency against the speculative attack. If the speculators kept
    the pressure on long enough, at some point these punishing interest rate hikes
    would bring about a recession, and the central bank would then have to back off
