    # WHAT SANCTIONS ACCOMPLISH


    The First World War introduced the world to new horrors. But when peace finally
    returned, it was not the new weapons of industrial slaughter—the tanks, machine
    guns, heavy artillery, and barbed wire—that shook most people’s sense of dignity.
    The new weapon that seemed most devastating wasn’t even military. It was economic:
    the sanction.


    Today, sanctions tend to be seen as a diplomatic Swiss knife—more of a peaceful
    tool than a weapon. Sanctions are announced as a means to bring wayward nations
    to their senses. Those who impose them can say, At least we didn’t go to war.
    History shows that we sanctions are war. They are every bit as lethal, like air
    raids and the manoeuvres of armies, they are meant to cripple nations, topple
    governments, and crush civilians.


    Economic warfare was not, of course, a new concept. The first recorded use of
    sanctions was almost twenty-five hundred years ago, during the Peloponnesian War,
    in 341 BCE, when Athens imposed a commercial ban on merchants from the Greek port
    city of Megara. During the American Civil War, the Union blockade of Confederate
    ports denied the Confederacy the ability to finance their effort through the lucrative
    cotton trade with Great Britain, ultimately contributing to their defeat.


    But it wasn’t until the First World War that the full devastating force of sanctions—or
    “the starvation weapon,” as it was called—was felt by the civilian populations
    that they targeted. US president Woodrow Wilson, an ardent fan of such measures,
    described them glowingly as “an absolute isolation…that brings a nation to its
    senses just as suffocation removes from the individual all inclinations to fight.”
    While the Allies could do little to'
