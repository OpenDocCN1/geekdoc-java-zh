    # SHINKING HOUSING MARKET


    Before the dominoes falling, the North American housing market had one of the
    biggest beneficiaries of the easy money policies that the Federal Reserve Board
    and the Bank of Canada had pursued for their economies through quantitative easing.
    The more mortgage rates fell, the higher housing prices rose. Rose was a simple
    but nevertheless very powerful direct drive relationship between the cost of borrowing
    and the cost of what you were borrowing to buy.


    The housing market created by record-low mortgage rates was a great deal for homeowners,
    except perhaps first-time buyers, whose savings for a down payment often couldn''t
    keep up with soaring housing prices. Even if you didn''t have a mortgage, you
    as a homeowner benefited from falling mortgage rates because the more rates fell
    the more your house was worth. But those halcyon days were predicated on record-low
    mortgage rates, which in turn were grounded by low inflation rates—rarely above
    the central banks’ 2 percent target and often below that threshold.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'As homeowners were soon to discover, that direct drive relationship between
    mortgage rates and housing prices works just as powerfully in the opposite direction.
    Which is why a sharp upturn in interest rates was felt more painfully in the housing
    market than anywhere in the economy.


    The economic impact of falling housing prices can be far beyond the real estate
    market. Since your house is typically your most valuable asset, a housing market
    correction doesn''t make your house worth less—it makes you worth less, which
    affects what you spend on everything. And, at the same time, rising mortgage rates
    make the cost of borrowing (for the thing that is making you poorer in the first
    place) a lot more expensive and therefore burdensome to carry.


    Think of mortgage rates as a gateway to the housing market. When interest rates
    fall, more households are able to qualify for mortgage financing and can therefore
    bid on a house. The more buyers that bid on a property, the higher the price that
    property will ultimately sell for. Conversely, rising mortgage rates disqualify
    potential buyers from obtaining or affording financing, and as marginal buyers
    drop out of the market and fewer bidders bid on a property, the price that property
    will sell at drops too.


    For those homebuyers who do qualify for a mortgage, changes in interest rates
    also have an impact. Not only do they determine how big your monthly payment will
    be, but they also affect how much of that payment goes to paying off what you
    borrowed (the principal) and how much is simply paying interest to carry the loan.
    The higher mortgage rates go, the more of your monthly payment is spent on the
    interest, which can make owning a home look like and feel more like renting.


    As inflation has soared, so too have mortgage rates. For prospective American
