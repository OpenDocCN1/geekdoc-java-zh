  md: '10. Crimea had been part of Russia for almost two hundred years before Khrushchev,
    himself a Ukrainian, transferred it to Ukraine from Russia back in 1954, when
    both belonged to the USSR. At the time, it was seen as a gesture of eternal friendship
    between the Ukrainian and Russian republics. Obviously, times have changed. Before
    Khrushchev''s decision to give the region to Ukraine, Crimea had been part of
    the Russian Empire since 1783, following the Russo-Turish War, when it was taken
    from the Ottoman Empire. After the Russian Revolution of 1917, Crimea was designated
    an autonomous republic within the newly formed USSR. Over its history, the majority
    of inhabitants in Crimea have been and continue to be Russian-speaking.


