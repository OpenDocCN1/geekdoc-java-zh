  md: '# INTRODUCTION


    # THE FOG OF WAR


    On the morning of May 26, 1968, a young Icelandic boy set out on his bicycle.
    It was a quiet Sunday. He soon entered history as the only person injured by the
    arrival of Hægri dagurinn, the Icelandic name for the day the small country would
    switch from driving on the left to to the right. Plans to make the switch had
    been underway for decades—centuries, in fact. Denmark, which had governed Iceland
    since the Middle Ages, the switch from left to right in 1793, back in the days
    of horse-drawn carriages. But there was so little traffic on the island that Iceland
    never got around to following suit. By motorized cars and buses appearing in Reykjavík
    in the early twentieth century, planners began to consider the question again
    and plans were drawn down. But they were interrupted by the outbreak of the Second
    World War, when Iceland spent under occupation by British troops, who drove on
    the left. A couple of decades after the British went home, Iceland was ready.
    A total of 5,727 traffic signs were moved from one side of the street to the other.
    Thirty-three million krónur spent modifying the country’s fleet of buses to allow
    passengers to embark from the right. Everything seemed to be ready.


    And yet, when the big day arrived, at least one little boy didn''t see it coming.
    Navigating with the misplaced confidence we all exhibit from time to time, he
    was struck by a car that must have seemed to come out of nowhere. If you''re on
    the lookout for danger approaching from one side, and it materializes on the other,
    it can only seem as though the everyday'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'world has been transformed into a maze full of unexpected threats. This is
    our experience of the new normal. It is probably inevitable, and we tend to get
    into it because it seems beneficial. But if we''re not paying attention, we''re
    going to get hurt.


    Even if we plan meticulously, something is going to go wrong when the world flips
    from one way of doing things to an entirely different way. The trouble is, we
    don''t always plan meticulously. We tend not to pay much attention at all. But
    then, we don''t pay attention to the old normal either. Why did Icelanders and
    Englishmen drive (or initially ride horses) on the left in the first place? It
    made sense in the days when people went about armed. If you''re right-handed,
    and most people are, you want any potential enemy on your right. Horsemen passed
    each other on the left. When then switch to the right? The answer seems to be
    that as European wagons got bigger, teamsters riding on the back of one of the
    draft horses. A right-handed teamster would want to sit on a horse harnessed to
    the left, for the same reason a swordsman would want to pass another on the left—to
    allow him to wield a whip without reaching across his body. If you''re sitting
    on the left, it''s best to drive on the right, as we do in most cars in the world.
    So Iceland was moving from a world optimized for businessmen to a world optimized
    for teamsters (and imported left-hand drive cars). Not that any of them cared.
    The old normal just kind of happened that way, as did the new.


    For all of the planning and debate, Hægri dagurinn wasn''t under anyone''s control.
    Iceland (like Sweden before)) was more like a surfer on the shoulder of a wave
    than an engineer planning the future. The world was changing, shaped by forces
    that had first made themselves felt centuries before. The best that policy-making
    can do under those circumstances is adapt.


    Today, we are all in the same situation as Icelandic motorists. The world is changing.
    It won''t be transformed overnight, but it is changing fast. And we are definitely
    not in control. Decisions made decades and even centuries ago are presenting us—our
    governments, our corporations, our bankers—with novel risks and dangers seemingly
    out of nowhere. Policies'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'that seemed like a good idea not that long ago have become traps. Investments
    that looked bullish have turned into bad deals. Allies have turned out to be rivals.
    Rivals have turned out to be enemies. And we may turn out to have been our own
    worst enemies. In this new world, where danger bears down on us from precisely
    the direction we are not in the habit of looking, we are going to be blindsided.
    That is why we need a map of the new normal to see where we are reality heading.


    This map will feature more than a few surprises. Things won''t be where we expect
    them to be. Directions, even polarity, will have changed. Highways that once took
    us somewhere we wanted to go will lead us to dead ends. The new normal will be
    frustrating for many, worse than frustrating. There will be broken limbs. It''s
    all the more dangerous right now—as the street signs have not yet all changed.


    But some of them have been. In the past few years, the world has clear signals
    of what the new normal is going to look like. Some signs remain in their old spots,
    some have been taken down, some are ambiguous, and some are even deliberately
    misleading.


    There is a very good reason for that. The shift to a new normal is a shift to
    war. In the past few years we have seen the conflagration of old frictions escalate
    into open military conflict. But this has been preceded by other modes of warfare:
    economic, cyber, diplomatic, and most obviously, informational. The latter should
    come as no surprise. When we kindles, we find ourselves immersed in a descending
    informational fog. It''s called propaganda.


    Propaganda—or misinformation, as it is more frequently called today—is the systemic
    practice of providing misleading or heavily biased information in order to influence
    the public into supporting a particular cause or political interest. In times
    of war, propaganda serves only one purpose: to galvanize support for the ongoing
    war effort. Like a ray of ultraviolet light, propaganda is all but invisible to
    the naked eye. But that doesn''t mean it is difficult to discern its effects.
    They are everywhere to be seen.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'We see it in the glaring double standards in political and war news coverage.
    When the United States unleashed a devastating missile attack on Iraq, it was
    celebrated in the America media as “shock and awe” and a testament to the prowess
    of America’s newest generation of guided missiles. But when Russia deployed a
    small fraction of that destructive force in Ukraine, it was denounced as barbaric
    and inhumane. When different standards are applied to different actors, we find
    ourselves in the fog of war.


    In Western societies, it is commonplace to think of propaganda as the exclusive
    domain of the media in authoritarian countries. But it is shaped all differently
    in the West than in, say, China or Russia? Of course, many things are done differently.
    But powerful interests everywhere they do their best to shape what is called the
    “narrative.” And that has held true in Western democracies as much as it has held
    anywhere else. For example, without forcefulful misinformation campaigns, the
    Vietnam and Gulf Wars would never have gotten underway. Today we might look back
    on the Gulf of Tonkin incident and the phantom Iraqi weapons of destruction and
    shake our heads at our own credulity. It was as if the world shuffled into war
    hypnosis, and it was only later that we came to our senses.


    Recently, the US Army’s 4th Psychological Operations Group released a recruiting
    video “Have you ever wondered… who pulls the strings?” The answer is, by the video,
    we do: “You’ll find us in the shadows. We can deceive, persuade, change, influence,
    inspire. We are everywhere.” The unit’s motto is “Verbum Vincit”—The word conquers.
    We don’t have to guess that we are in the middle of an information war. At least
    one side is boasting of its prowess—and that we are its targets.


    The “psywar” video also makes clear who America’s enemies are. It warns, “A threat
    rises in the East,” followed by footage of Chinese parades and news coverage of
    the war in Ukraine. It paints a picture of imminent conflict. And make no mistake
    about it: if you live in a NATO nation, your country is at war. While military
    action is at least for the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'moment off the table, the conflict has encouraged Western governments to weaponize
    their economies in a manner seldom if ever seen before. And that is how the war
    front comes home to you, whether you are sitting comfortably at home in North
    America, Western Europe, Japan, or in Australia. Because, as you have already
    noticed, economic warfare is a two-way street. For the first time in many, many
    years, the West is tangling with opponents who have ample economic resources to
    fight back.


    In the past, sanctions have been used as a weapon against the weak. But any undergraduate
    in an economics program would be able to easily understand that David Ricardo’s
    theory of comparative advantage explains why trade should be mutually beneficial,
    it also stands to reason that sanctions should be mutually destructive. Deployed
    against larger, more productive economies, sanctions can be expected to harm those
    who find themselves sanctioned (especially in the case of countries that fully
    expected to be sanctioned’d and have spent the better part of a decade making
    themselves sanction-proof). On many occasions in the long history of the practice,
    sanctions have boomeranged against the very countries imposing them. So, instead
    of NATO sanctions on Russian energy bringing that resource-dependent economy to
    its knees, the economic impacts ricochet back on energy consumers in the economies
    of the countries imposing the sanctions.


    And that leaves you bearing much of the economic burden that is intended to be
    borne by the Russian and increasingly Chinese economies. Whether you are one of
    the 20 million households in Germany that had to cut back on gas consumption during
    the winter heating season, or among the millions of British households that saw
    their energy bills soar, among the American motorists who at one point had had
    to shell out a record five dollars a gallon to fill up their vehicles at the pumps,
    or a farmer paying record prices for fertilizer, the war in Ukraine has come home
    to you on a variety of economic fronts.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'No doubt there will be a multitude of books written about the geopolitical
    consequences of this particular conflict. What follows here is an attempt to explain
    the conflict in Ukraine and on other emerging battlefronts between the old world
    order and the emerging one signals profound changes in the way our economies are
    organized and how they will operate in the future—so much that we’re not just
    talking about the end of an economic cycle. What we are talking about is the end
    of an economic era—the end of what we’ve all come to think of as “normal” since
    the Second World War.


    It’s not our enemies who can take credit for that, at least initially. It was
    instead the COVID-19 pandemic that first broke the links of global supply chains,
    the very arterial structure of globalization. As we will see in the chapters ahead,
    lockdowns gave us all a glimpse of a world in which the postwar certainties of
    comparative advantage, lower tariffs, offshore production, wage arbitrage, and
    just-in-time delivery could no longer be counted on operate smoothly and seamlessly,
    as they had done for decades before. The world is still reeling from the shock


    But as damaging as the pandemic was to the free movement of goods, capital, and
    technology across borders, its impact, in the broad sweep of history, has been
    fleeting. Whether vaccines blunted the aggressiveness of the virus or COVID simply
    followed the path of most viruses towards lower and lower virulence is a question
    we can leave to others to debate. What we can say is that one is worrying anymore
    about lockdowns or the risk of health-care systems being overwhelmed by COVID
    patients. The epidemiological story is all but over. But the shift in the way
    our economies operate has barely begun.


    Resuming global trade after COVID is a little like resuming a game of Monopoly
    after someone has flipped the board. It can happen only after a mad and probably
    acrimonious scramble. The diplomatic, economic, technological, and cultural confrontation
    between the Atlantic and Eurasian powers had been going on for years. After COVID
    flipped the board, that confrontation entered a new phase—the sanctions war, the
    consequences of which will prove far more lasting than the impact the pandemic
    had.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'The chasm that divides the global economy into geopolitical blocs grows wider
    and wider, and each new round of sanctions politicizes an ever-increasing share
    of global trade, leaving in tatters the once rules-based trading system championed
    by the World Trade Organization (WTO). In their wake, sanctions not only Balkanized
    global trade and finance into competing regional blocks, but in the process they
    have also resurrected an economic demon that we thought was long extinct.


    Inflation has risen from the grave and reached surprisingly resilient levels against
    efforts to stuff back into its coffin. Like a cancer that begins as a localised
    tumour, it manifested in food and energy prices, and as the soaring cost of living
    begets wage increases, it has since metastasized to impact the entire economy.
    And the very policies that governments successfully employed to fight the devastating
    economic impacts of the pandemic—record-low interest rates and record-high spending,
    and the resulting expansion of the money supply and fiscal deficits—have nourished
    inflation like it has seldom nourished by policies in the past. In the context
    of yesterday''s lockdowns, flooring the pedal on fiscal and monetary stimulus
    provided an economic lifeline to millions of households locked out of their jobs
    and unable to work. But in today''s economic environment, it''s akin to trying
    to extinguish a fire with gasoline.


    Admittedly, getting the policy mix right for a rapidly and profoundly changing
    world is no simple task. The tectonic movement of massive geopolitical plates
    is driven by seismic forces of unprecedented proportions. The task requires, first
    and foremost, a clear understanding of the lay of the land that an emerging new
    global order brings. But our ability to map the contours of this “new normal”
    is increasingly difficult by the fact that virtually everything we see is glimpsed
    through the fog of war.


    Still, we are not blind. We are vulnerable to dangers surprising us from the fog,
    as was that young boy innocently riding his bike in Iceland in 1968. But only
    if we''re looking the wrong way. Only if we''re not paying attention. In the weeks
    following *Hæri dagurinn*, when so much seemed poised to go wrong, traffic accidents
    in Iceland actually declined. Drivers'
  merge: -1
  pgno: 16
- img_proc: true
  md: plied the streets and highways with new attentiveness. Because whichever side
    of the road we drive on, the real risk is complacency.
