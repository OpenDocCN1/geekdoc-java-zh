  pgno: 78
- img_proc: true
  md: 'bonds would raise yields and rates. And they would do quite apart from whatever
    action the central bank was taking in terms of adjusting its short-term target
    at the time.


    In theory, of course, quantitative easing could be reversed through quantitative
    tightening, just as cuts in central bank short-term interest rate targets could
    be reversed through rate hikes as changing economic conditions warranted. In practice,
    however, quantitative tightening has never been tried before, save for an attempt
    by the Fed in 2018, when it briefly bonds amassed during its initial quantitative
    easing program between 2008 and 2013 back into the marketplace. That exercise
    didn''t last long.


    The Federal Reserve Board abruptly terminated its one and only attempt at quantitative
    tightening when it sensed a sudden loss of liquidity in the bond market, a sign
    that the market was having trouble digesting what the Fed was feeding it. Except
    for that brief and unsuccessful monetary experiment, quantitative tightening has
    not been tried on a sustained basis. At least, not now.


    The Fed certainly has a lot more motivation to stick with the policy today than
    it did in 2018, when US CPI inflation was running at only 2.3 percent, barely
    above the central bank''s target rate. But with inflation, particularly the all-important
    core inflation, still running at almost twice the Federal Reserve Board''s target
    rate, and with the Fed''s balance sheet more twice the size it was back in 2018,
    the central bank now believes it has no choice but to begin to reverse the massive
    bond purchases it made during the pandemic.


    After announcing in March 2022 that it would ending its quantitative easing program,
    the Fed commenced in June the long and uncertain process of shrinking its bloated
    $9 trillion balance sheet by no longer rolling up to $30 billion worth of maturing
    Treasuries bonds and up to $17.5 billion worth of federally backed mortgage securities
    each month. In September 2022, the central bank upped the ante by ratcheting up
    its monthly sales of Treasuries to $60 billion and mortgage-backed securities
    to $35 billion.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'The Federal Reserve Board—or, for that matter, any central bank—could in principle
    sell any part of its bond portfolio back into the market at any time. But in order
    for its actions to cause the least possible disruption to bond markets, it has
    chosen to simply not roll over bonds as they mature. In this way, all of the other
