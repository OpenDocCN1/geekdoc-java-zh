    The interwar years saw the acknowledgement that the effects of sanctions were
    felt for generations, in poor stunted children, and social fragility. Just as
    an anti-war sentiment after the Second World War crystallized around the abhorrence
    of nuclear weapons, the peace movement after the Great War took the position that
    sanctions were just awful to actually use.


    But this sheer awfulness could be strategically useful. So devastating was their
    impact that it was reasoned no country would be so rash as risk having sanctions
