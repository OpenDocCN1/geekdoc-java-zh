    a measure to gauge our economic well-being. He called it the misery index, and
    it was simply the sum of the annual inflation rate and the unemployment rate.
    Stagflation brought two sources of misery—rising inflation, which denuded the
    purchasing power of your paycheck, and rising unemployment, which for many took
    away their paycheck altogether.


