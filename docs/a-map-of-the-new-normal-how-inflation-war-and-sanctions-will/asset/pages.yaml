    to continually hike rates, so did the rate it was paying the country’s largest
    banks on their settlement balances. As of July 7, 2023, that rate had risen to
    5 percent.


    Even when the overnight target rate was only 3.5 percent, the Bank of Canada managed
    to rack up that C$522 million loss mentioned above. The bank has warned that further
    losses be pending over the next three years, depending, of course, on the interest
    rate trajectory. A study by C.D. Howe Institute, a major Canadian think tank,
