    # STAGFLATION: THE WORST OF BOTH WORDS


    Fighting inflation is a little like a game of chicken: both doing something and
    doing nothing cause pain. And since policy-makers will face complaints either
    way—who can say whether the suffering is cause or effect?—they are in both directions.
    Stay the course, or declare victory and go home in the face of defeat? To navigate
