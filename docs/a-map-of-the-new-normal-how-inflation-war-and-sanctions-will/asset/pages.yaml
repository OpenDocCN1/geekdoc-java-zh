    We generalize about decades and generations, but the eighties didn''t really start
    on January 1, 1980, any more than someone born five minutes after the last millennial
    will be all different from those who came before. This is a truth overlooked by
    many boiling frogs. It is hard to identify the moment we pass a threshold.


    Hard, but not impossible. In the summer of 2023, economists started to notice
    a convergence of troubling trends in Europe. In France, red wine and foie gras
