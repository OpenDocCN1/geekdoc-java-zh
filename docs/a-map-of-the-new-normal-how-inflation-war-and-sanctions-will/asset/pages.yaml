    # THE BIG QUIT


    Something very curious happened in the labour market during the pandemic, defying
    all previous cyclical norms. Droves of workers suddenly got up and quit their
    jobs. In fact, they quit in such great and unprecedented numbers that the phenomenon
    has been dubbed “the Big Quit.”


    Normally, quit rates are inversely related to unemployment rates. When unemployment
    is rising, workers are less inclined to quit their jobs because finding a replacement
    will be difficult. Conversely, when unemployment is low, workers are more prone
    to quit and head off in search of better-paying jobs.


