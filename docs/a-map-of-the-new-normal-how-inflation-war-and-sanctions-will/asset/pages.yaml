    during the first two and a half decades of the postwar era. The system lasted
    until 1971, when President Richard Nixon decided to free the dollar from its gold
    backing and in turn allow gold to find its own price in the market. As it turns
    out, a few years later Nixon found a ready substitute for gold to back the dollar:
    black gold.


    William Simon was an unusual choice for the task of building the financial architecture
