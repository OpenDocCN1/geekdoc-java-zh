    Allied naval blockade. Another 300,000 perished in the Ottoman Empire, whose ports
    were also blockedaded.


    When the dust cleared and the consequences of the blockade were clear, the victors
    were aghast at what they had done to Germany. Even Wilson admitted that “while
    war was barbarous…the boycott is an infinitely more terrible instrument of war.”
    One British bureaucrat involved in the administration of the blockade recoiled
