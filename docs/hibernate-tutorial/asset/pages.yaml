    \ providing access to the fields via public methods. If a field is declared private,\
    \ it cannot be accessed by anyone outside the class, thereby hiding the fields\
    \ within the class. For this reason, encapsulation is also referred to as data\
    \ hiding.\n\nEncapsulation can be described as a protective barrier that prevents\
    \ the code and data from being randomly accessed by other code defined outside\
    \ the class. Access to the data and code is tightly controlled by an interface.\n\
    \nThe main benefit of encapsulation is the ability to modify our implemented code\
