  md: '# CHAPTER 16


    # Java Regular Expressions


    Java provides the java.util.regex package for pattern matching with regular expressions.
    Java regular expressions are very similar to the Perl programming language and
    very easy to learn.


    A regular expression is a special sequence of characters that helps you match
    or find strings or sets of strings, using a specialized syntax held in a pattern.
    They can be used to search, edit, or manipulate text and data. The java.util.regex
    package primarily consists of the following three classes:


    +   * Pattern Class: A Pattern object is a compiled representation of a regular
    expression. The Pattern class provides no public constructors. To create a pattern,
    you must first invoke one of its public static methods, which will return a Pattern
    object. These methods accept a regular expression as the first argument.

    * Matcher Class: A Matcher object is the engine that interprets the patterns and
    performs match operations against an input string. Like the Pattern class, Matcher
    defines no public constructors. You obtain a Matcher by invoking the matcher method
    on a Pattern object.

    * PatternSyntaxException: A PatternSyntax object is an unchecked exception that
    indicates a syntax error in a regular expression pattern.


    # Capturing Groups


    Capturing groups are ways to treat multiple characters as a single unit. They
    are created by placing the characters to be grouped inside a set of parentheses.
    For example, the regular expression (dog) creates a single group containing the
    letters ''d'', ''o'', and ''g''.


    Capturing groups are numbered by counting their parentheses from left to right.
    In the expression (A)(B)(C), for example, there are four groups:


    +   * ((A)(B)(C))

    * (A)

    * (B)

    * (C)


    To find out how many groups are present in the expression, call the groupCount
    method on a matcher object. The groupCount method returns an int showing the number
    of capturing groups present in the matcher''s pattern.


    # TUTORIAL POINT


    Simply Easy Learning'
