  md: "# Getting Applet Parameters:\n\nThe following example demonstrates how to make\
    \ an applet respond to parameters specified in the document. This applet displays\
    \ a checkerboard pattern of black and a second color.\n\nThe second color and\
    \ the size of each square may be specified as parameters to the applet within\
    \ the document.\n\nCheckerApplet gets its parameters in the init() method. It\
    \ may also get its parameters in the paint() method. However, getting the values\
    \ and saving the settings instead of the start of the applet, instead of every\
    \ refresh, is convenient and efficient.\n\nThe applet viewer or browser cells\
    \ calls the init() method of each applet. The viewer calls init(), immediately\
    \ after loading the applet. (Applet.init() is implemented to do nothing.) Override\
    \ the default implementation to insert custom initialization code.\n\nThe Applet.getParameter()\
    \ fetches a parameter given the parameter's name (the value of a parameter is\
    \ always a string). If the value is numeric or other non-character data, the string\
    \ must be parsed.\n\nHere is a skeleton of CheckerApplet.java:\n\n```\nimport\
    \ java.applet.*;\nimport java.awt.*;\npublic class CheckerApplet extends Applet\n\
    {\n    int size=50; // initialized to default size\n    public void init() {\n\
    \    private void parseSize(String param)\n    private Color parseColor(String\
    \ param)\n    public void paint(Graphics g) {\n}\n```\n\nHere are CheckerApplet's\
    \ init() and private parseSquareSize() methods:\n\n```\npublic void init() {\n\
    \    String squareSizeParam = getParameter(\"squareSize\");\n    parseSize(squareSizeParam);\n\
    \    String colorParam = getParameter(\"color\");\n    Color fg = parseColor(colorParam);\n\
    \    setBackground(Color.black);\n    setForeground(fg);\n}\nprivate void parseSquareSize(String\
    \ param) {\n    if (param==null) return;\n    try{\n        size=Integer.parseInt(param);\n\
    \    } catch (Exception e) {\n        // Let default value remain\n    }\n}\n\
    ```\n\nThe applet calls parseSquareSize() to parse the squareSize parameter. parseSquareSize()\
