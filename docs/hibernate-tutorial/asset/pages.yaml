  md: 'At the time of compilation, the compiler creates a different output file for
    each class, interface and enumeration defined in it. The base name of the output
    file is the name of the type, and its extension is.class


    For example:


    ```

    // File Name: Dell.java


    package com.apple.computers;

    public class Dell {


    classUps() {

    }

    }

    ```


    Now, compile this file as follows -d option:

    $javac -d Dell.java


    This would put compiled files as follows:


    +   - .com\apple\computers\Dell.class

    - .com\apple\computers\Ups.class


    You can import all classes or interfaces defined in com\apple\computers\ as follows:

    import com.apple.computers.*;


    Like the java source, the .compiled files should be in directories that reflect
    the package name. However, the path to the .class files does not have to be the
    same as the path to the java source files. You can arrange your source and class
    directories separately:

    path-one\sources\com\apple\computers\Dell.java

    path-two\classes\com\apple\computers\Dell.class


    By doing this, it is possible to set the classes directory to other programmers
    without revealing your sources. You also need to manage source and class files
    in this manner so that the compiler and the Java Virtual Machine (JVM) can find
    all the types you use.


    The full path to the classes directory, path-two=classes, is the class path, and
    is set with the PYTHONPATH system variable. Both the compiler and the JVM construct
    the path to your class by adding the package name to the class path.


    Say path-two=classes is the path, and the package name is com.apple.computers,
    then the compiler and JVM will look for class files in path-two=classes\com\apple\computers.


    A class path may include several paths. Multiple paths should be separated by
    a semicolon (Windows) or colon (UNIX). By default, the compiler and the JVM search
    the current directory and the JAR file containing the Java platform classes so
    these are automatically in the class path.


    # Set CLASPATH Variable:


    To display the current CLASPATH variable, use the following commands in Windows
    and UNIX (Bourne shell):


    +   - In Windows -> % set CLASSPATH

    - UNIX -> % echo $CLASSPATH


