  md: '# CHAPTER 1


    # Java Overview


    Java programming language was originally developed by Sun Microsystems which was
    initiated by James Gosling in 1995 as core component of Sun Microsystems'' Java
    platform (Java 1.0 [J2SE]).


    As of December 2008, the latest release of the Java Standard Edition is 6 (J2SE),
    with the advancement of Java and its widespread popularity, multiple configurations
    were built to suit various types of platforms. Ex: J2EE for Enterprise Applications,
    JME for Mobile Applications.


    Sun Microsystems has renamed the new J2 versions as Java SE, Java EE and Java
    ME, respectively. Java is guaranteed to be Write, Run Anywhere.


    Java is:


    +   - Object Oriented: In Java, everything is an Object. Java can be easily extended
    since it is based on the Object model.


    +   - Platform Independent: Unlike many other programming languages including
    C and C++, when Java is compiled, it is not compiled into platform specific machine,
    rather into platform independent byte code. This byte code is distributed over
    the web and interpreted by Virtual Machine (JVM) on whichever platform it is running.


    +   - Simple: Java is designed to be easy to learn. If you understand the basic
    concept of OOP, Java is easy to master.


