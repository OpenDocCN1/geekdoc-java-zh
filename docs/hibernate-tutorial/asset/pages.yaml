  md: "# Java Streams, Files and I/O\n\nThe java.io package contains nearly every\
    \ class you might ever need to perform input and output (I/O) in Java. All these\
    \ streams represent an input source and an output destination. The stream in the\
    \ java.io package supports many data types such as primitives, Object, localized\
    \ characters, etc.\n\nA stream can be defined as a sequence of data. The InputStream\
    \ is used to read data from a source and the OutputStream is used for writing\
    \ data to a destination.\n\nJava provides strong but flexible support for I/O\
    \ related to Files and networks but this tutorial covers very basic functionality\
    \ related to streams and I/O. We see most commonly used example one by one:\n\n\
    # Byte Streams\n\nByte streams are used to perform input and output of 8-bit bytes.\
    \ Though there are many classes related to byte streams but the most frequently\
    \ used classes are FileInputStream and FileOutputStream. Following is an example\
    \ which makes use of these two classes to copy an input file into an output file:\n\
    \n```\nimport java.io.*;\npublic class CopyFile {\n    public static void main(String[]\
    \ args) throws IOException {\n        FileInputStream in = null;\n        FileOutputStream\
    \ out = null;\n\n        try {\n            in = new FileInputStream(\"input.txt\"\
    );\n            out = new FileOutputStream(\"output.txt\");\n\n            int\
    \ c;\n            while ((c = in.read()) != -1) {\n                out.write(c);\n\
    \            }\n        } finally {\n            if (in != null) {\n         \
    \       in.close();\n            }\n\n            if (out != null) {\n       \
    \         out.close();\n            }\n        }\n    }\n}\n```\n\n# TUTORIALS\
    \ POINT\n\nSimple Easy Learning"
