    # The continue Keyword:


    The continue keyword can be used in any of the loop control structures. It causes
    the loop to immediately jump to the next iteration of the loop.


    +   - In a loop, the continue keyword causes flow of control to immediately jump
    to the update statement.

    - In a while loop or do/while loop, flow of control immediately jumps to the Boolean
    expression.


    # Syntax:


    The syntax of a continue is a single statement inside any loop:


    ```

    continue;

    ```


