  md: '# CHAPTER 14


    # # Java Arrays


    Java provides a data structure, the array, which stores a fixed-size sequential
    collection of elements of the same type. An array is used to store a collection
    of data, but it is often more useful to think of an array as a collection of variables
    of the same type.


    Instead of declaring individual variables, such as number0, number1, ... and number99,
    you declare one array variable such as numbers and use numbers[0], and ..., numbers[99]
    to represent indexed variables.


    This tutorial introduces how to declare array variables, create arrays, and process
    arrays indexed variables.


    # ## Declaring Array Variables:


    To use an array in program, you must declare a variable to reference the array,
    and you must specify the type of the array variable can carry. Here is the syntax
    for declaring an array variable:


    ```

    dataType[] arrayRef;// preferred way

    nor

    datype arrayVar[];// works but not preferred way.

    ```


    **Note:** The style dataType arrayRef is preferred. The style dataType arrayVar[]
    comes from the C/C++ language and was adopted in Java to accommodate C/C++ programmers.


    **Example:**


    The code snippets are examples of this syntax:


    ```

    double[] myList;// preferred way

    nor

    double myList[];// works but not preferred way.

    ```


    # ## Creating Arrays:


    You can create an array using the new operator with the following syntax:


    ```

    arrayRef =new dataType[arraySize];

    ```


    The above statement does two things:


