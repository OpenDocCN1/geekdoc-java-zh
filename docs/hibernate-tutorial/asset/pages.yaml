    # The Vector


    The Vector class is similar to a traditional Java array, except that it can grow
    as necessary to accommodate new elements.


    The nice thing about the Vector class is that you don''t have to worry about setting
    it to a specific size; it shrinks and grows automatically when necessary.


    Vector implements a dynamic array. It is similar to ArrayList, but with two differences:


    +   * Vector is synchronized.

    * Vector contains many legacy methods that are not part of the collections framework.


    Vector proves to be very useful if you don''t know the size of the array in advance
    or you just need one that can change sizes over the lifetime of a program.


    The Vector class supports four constructors. The first creates a default vector,
    which has an initial size of 10:


    ```

    Vector()

    ```


    The second form creates a vector whose initial capacity is specified by size:


    ```

    Vector(int size)

    ```


    The third form creates a vector whose initial capacity is specified by size and
    increment is specified by incr. The increment specifies the number of elements
    to allocate each time a vector is resized upward:


