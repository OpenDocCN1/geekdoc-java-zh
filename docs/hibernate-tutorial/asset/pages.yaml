    # Playing Audio:


    An applet can play an audio file represented by the AudioClip interface in the
    java.applet package. The AudioClip interface has three methods,


    +   * public void play(): Plays the audio clip one time, from the beginning.

    * public void loop(): Causes the audio clip to replay continually.

    * public void stop(): Stopping the audio clip.


    To obtain an AudioClip, you must invoke the getAudioClip() method of the Applet
    class. The getAudioClip() method returns immediately, whether or not the URL returns
    to an actual audio file. The audio file is not downloaded until intent is made
    to play the audio.


    Following is example showing all the steps to play an audio:


    ```

    import java.applet.*;

    import java.awt.*;

    import java.net.*;

    public class AudioDemo extends Applet

    {

    private AudioClip clip;

    private AppletContext context;

    public void init()

    {

    context=this.getAppContext();

    String audioURL=this.getParameter("audio");

    if(audioURL==null)

    audioURL="default.au";

    }

    try{

    URL url=new URL(this.getDocumentBase(), audioURL);

    clip=context.getAudioClip(url);

    }catch (MalformedURLException e)

    {

    e.printStackTrace();

    context.showStatus("Could not load audio file!");

    }

    public void start()

    {

    if (clip!=null)

    {

    clip.loop();

    }

    }


    ```


