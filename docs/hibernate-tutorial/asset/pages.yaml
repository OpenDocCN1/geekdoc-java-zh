  md: '# Java Variable Types


    A variable provides us with named storage that our programs can manipulate. Each
    variable in Java has a specific type, which determines the size and layout of
    the variable''s memory; the range of values that can be stored within that memory;
    the set of operations that can be applied to the variable.


    You must declare all variables before they can be used. The basic form of a variable
    declaration is shown here:


    ```

    data type variable [ = value][ variable [ = value] ...];

    ```


    Here data type is one of Java''s datatypes and variable is the name of the variable.
    To declare more than one of the specified type, you can use a comma-separated
    list.


    Following are examples of variable declaration and initialization in Java:


    ```

    int a, b, c;              // Declares three ints, a, b, and c.

    int a = 10, b = 10;       // Example of initialization

    byte B = 22;               // initializes a byte type variable B.

    double pi = 3.14159;      // declares and assigns a value of PI.

    char a = ''a'';              // the char variable is initialized with value ''a''

    ```


    This chapter will explain variable types available in Java Language. There are
    three kinds of variables in Java:


    +   * Local variables

    * Instance variables

    * Class/static variables


    # Local variables:


    +   * Local variables are declared in methods, constructors, or blocks.


    +   * Local variables are created when the method, constructor or block is entered
    and the variable will be destroyed once it exits the method, constructor or block.


    +   * Access modifiers cannot be used for local variables.


