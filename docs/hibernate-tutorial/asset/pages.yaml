  md: '+   On the server side, the accept() method returns a reference to a new socket
    on the server that is connected to the client''s socket.


    After the connections are established, communication can occur using I/O streams.
    Each socket has an OutputStream. The client''s OutputStream is connected to the
    server''s InputStream, and the client''s InputStream is connected to the server''s
    OutputStream.


    TCP is a midway communication protocol, so data can be sent across both streams
    at the same time. There following useful classes providing complete set of methods
    to implement sockets.


    # # ServerSocket Class Methods:


    The java.net.ServerSocket class is used by applications to obtain a port and listen
    for client requests


    The ServerSocket class has four constructors:


    # ## SN Methods with Description


    +   1 public ServerSocket(int port) throws IOException

    Attempts to create a server socket bound to the specified port. An exception occurs
    if the port is already bound by another application.


    +   2 public ServerSocket(int port, int backlog) throws IOException

    Similar to the previous constructor, the backlog parameter specifies how many
    incoming clients to store in a queue.


    +   3 public ServerSocket(int port, int backlog, InetAddress address) throws IOException

    Similar to the previous constructor, the InetAddress parameter specifies the IP
    address to bind to. The InetAddress is used for servers that may have multiple
    IP addresses, allowing the server to specify which of its IP addresses to accept
    client requests


    +   4 public ServerSocket() throws IOException

    Creates an unbound server socket. When using this constructor, the bind(port)
    method must be used to ready the server socket


    If the ServerSocket constructor does not throw an exception, it means your application
    has successfully bound to the specified port and is ready for client requests.


    Here are some of the common methods of the ServerSocket class:


    # ## SN Methods with Description


    +   1 int getLocalPort()

    Returns the port that the server socket is listening on. This method is useful
    if you passed in 0 as the port number in the constructor to find a free port for
    you.


    +   2 ServerSocket accept(int timeout) throws IOException

    Waits for an incoming connection. This method blocks until a client connects to
    the server on the specified port or socket, assuming that the time-out value has
    been set using the setTimeout(timeout). Otherwise, this method blocks indefinitely.


    +   3 void setTimeout(int timeout)

    Sets the time-out for how long the server socket waits for a client during the
    accept().


    +   4 void bind(SocketAddress host, int backlog)

    Binds the server socket to the specified port in the SocketAddress object. Use
    this method if you instantiated the ServerSocket with no-argument constructor.


    When the ServerSocket invokes accept(), the method does not return until a client
    connects. After a client connects, the ServerSocket creates a new Socket on an
    unspecified port and returns a reference to this new Socket. A TCP connection
    now exists between the server and client, and communication can begin.


