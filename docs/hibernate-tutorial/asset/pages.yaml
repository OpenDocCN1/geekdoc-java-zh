    \n```\ntry{\n    //Protected code\n}catch(ExceptionType e1)\n{\n    //Catch block\n\
    }catch(ExceptionType e2)\n{\n    //Catch block\n}catch(ExceptionType e3)\n}\n\
    ```\n\nThe previous statements demonstrate three catch blocks, but you can have\
