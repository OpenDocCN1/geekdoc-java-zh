  md: "# Java Modifier Types\n\nModifiers are keywords that you add to those definitions\
    \ to change their meanings. The Java language has a wide variety of modifiers,\
    \ including the following:\n\n# 1. Java Access Modifiers\n\nJava provides a number\
    \ of access modifiers to set access levels for classes, variables, methods and\
    \ constructors. The four access levels are:\n\n+   * Visible to the package, the\
    \ default. No modifiers are needed.\n* Visible to the class only (private).\n\
    * Visible to the world (public).\n* Visible to the package and all subclasses\
    \ (protected).\n\n# Default Access Modifier - No keyword:\n\nDefault access modifier\
    \ means we do not explicitly declare an access modifier for a class, field, method,\
    \ etc.\nA variable or method declared without any access modifier is available\
    \ to any other class in the same package. The fields in an interface are implicitly\
    \ public static final and the methods in an interface are by default public\n\n\
    Example:\nVariables and methods can be declared without any modifiers, as in the\
    \ following examples:\n\n```\nString version=\"1.5.1\";nboolean processOrder()\
    \ {\n  return true;\n}\n```"
  merge: -1
