    # File Class


    Java File represents the files and directory pathname in an abstract manner. This
    class is used for creation of files and directories, file searching, file deletion
    etc.


    The File object represents the actual file/directory on the disk. There are following
    constructors to create a File object:


    Following syntax creates a File instance from a parent abstract pathname and a
    child pathname.


    ```

    File(File parent, String child);

    ```


    Following syntax creates a File instance by converting the given pathname into
    an abstract pathname.


    ```

    File(String pathname)

    ```


    Following syntax creates new File instance from a parent pathname and a child
    pathname.


    ```

    File(String parent, String child)

    ```


    Following syntax creates new File instance by converting the given file: URI into
    an abstract pathname.


    ```

    File(URI uri)

    ```


    Once you have File object in hand there is a list of helper methods which can
    be used manipulate the files.


