  md: '# Java Characters


    Normally, when we work with characters, we use primitive data types chars.


    # Example:


    ```

    char ch = ''a'';


    // Unicode for uppercase Greek omega character

    char uniChar=''Κ'';


    // an array of chars

    char[] charArray={''a'',''b'',''c'',''d'',''e''};

    ```


    In development, we come across situations where we need to use characters instead
    of primitive data types. Inorder to achieve this, Java provides wrapper class
    Character for primitive data type char.


    The Character class offers a number of useful class (i.e., static) methods for
    manipulating characters. You can create a Character object with the Character
    constructor:


    ```

    Character ch =newCharacter(''a'');

    ```


    The Java compiler will also create a Character object for you under some circumstances.
    For example, if you pass a primitive char to an object, the compiler automatically
    converts the char to a Character for you. This is called autoboxing or unboxing,
    if the conversion goes the other way.


    # Example:


    ```

    // following primitive char ''a''

    // is boxed into the Character object ch

    Character ch=''a'';


    // Here primitive ''x'' is boxed for method test,

    // return is unboxed to ''c''

    char c = test(''x'');

    ```


    # Escape Sequences:


    A character preceded by a backslash (\ is an escape sequence and has special meaning
    to the compiler.


    # TUTORIALS POINT


