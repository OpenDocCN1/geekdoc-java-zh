  md: "Notice that for a class to be serialized successfully, two conditions must\
    \ be met:\n\n+   - The class must implement the java.io.Serializable interface.\n\
    \n+   - All of the fields in the class must be serializable. If a field is not\
    \ serializable, it must be marked transient.\n\nIf you are curious to know if\
    \ a Java Standard Class is serializable or not, check the documentation for the\
    \ class. The test is simple: if the class implements java.io.Serializable, then\
    \ it is serializable; otherwise, it's not.\n\n# Serializing an Object:\n\nThe\
    \ ObjectOutputStream class is used to serialize an Object. The following SerializeDemo\
