  md: '# Declaring Interfaces:


    The interface keyword is used to declare an interface. Here is a simple example
    to declare an interface:


    # Example:


    Let us look at an example that depicts encapsulation:


    ```

    /* File name : NameOfInterface.java */

    import java.lang.*;

    //Any number of import statements


    public interface NameOfInterface

    {

    //Any number of final, static fields

    //Any number of abstract method declarations

    }

    ```


    Interfaces have the following properties:


    +   - An interface is implicitly abstract. You do not need to use the abstract
    keyword when declaring an interface.

    - Each method in an interface is also implicitly abstract, so the abstract keyword
    is not needed.

    - Methods in an interface are implicitly public.


    # Example:


    ```

    /* File name : Animal.java */

    interface Animal{


    public void eat();

    public void travel();

    }

    ```


    # Implementing Interfaces:


    When you implement an interface, you can think of the class as signing of a contract,
    agreeing to perform the specific behaviors of the interface. If the class does
    not perform all the behaviors of the interface, the class must declare itself
    as abstract.


    Class uses the implements keyword to implement an interface. The implements keyword
    appears in the class declaration following the extends portion of declaration.


    ```

    /* File name : MammalInt.java */

    public class MammalInt implements Animal{


    public void eat() {

    System.out.println("Mammal eats");

    }


    public void travel() {

    System.out.println("Mammal travels");

    }


    public int noOfLegs() {

    return0;

    }

    ```


