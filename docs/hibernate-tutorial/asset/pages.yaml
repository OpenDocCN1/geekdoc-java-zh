  md: '+   - request a description of the parameters the applet recognizes

    - initialize the applet

    - destroy the applet

    - start the applet''s execution

    - stop the applet''s execution


    The Applet class provides default implementations of each of these methods. These
    implementations may be overridden as necessary.


    The "Hello, World" applet is complete as it stands. The only method overridden
    is the paint method.


    # Invoking An Applet:


    An applet may be invoked by embedding directive directives in an HTML file and
    viewing the file through an applet viewer or Java-enabled browser.


    The <applet> tag is the basis for embedding an applet in an HTML file. Below is
    an example that invokes the "Hello,

    World" applet:


    ```

    <html>

    <title>The Hello, World Applet</title>

    <hr>

    <appletcode="HelloWorldApplet.class" width="320" height="120">

    If your browser was Java-enabled, a "Hello, World"

    message would appear here.

    </applet>

    <hr>

    </html>

    ```


    Based on the examples, here is the live applet Applet Example.

    Note: You can use HTML Applet Tag to understand more about calling applet from
    HTML.


    The code attribute of <applet> tag is required. It specifies the Applet class
    for run. Width and height are also required to specify the initial size of the
    page in which an applet runs. The applet directive must be closed with a </applet>
    tag.


    If an applet takes parameters, values may be passed to the parameters by adding
    <param> tags between <applet> and </applet>. The browser ignores all other tags
    between the applet tags.


    Non-Java-enabled browsers do not process <applet> and </applet>. Therefore, anything
    that appears between the tags, not related to the applet, is visible in non-Java-enabled
    browsers.


    The viewer or browser looks for the compiled applet code at the location of the
    document. To otherwise specify, use the codebase attribute of the <applet> tag
    as shown:


    ```

    <applet codebase="http://amard.com/applets"

    code="HelloWorldApplet.class"width="320" height="120">

    ```


    If an applet resides in a package other than the default, the holding package
    must be specified in the code attribute using the period character (.) to separate
    package/class components. For example:


    ```

    <applet code="mypackage.subpackage.TestApplet.class"

    ```


