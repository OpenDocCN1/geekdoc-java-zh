  md: '# Java Numbers


    Normally, when we work with Numbers, we use primitive data types such as byte,
    int, long, double, etc.


    Example:


    ```

    int i =5000;

    float gpa =13.65;

    byte mask =0xaf;

    ```


    However, in development, we come across certain situations where we need to use
    objects instead of primitive data types. In-order to achieve this, Java provides
    wrapper classes for each primitive data type.


    All the wrapper classes (Integer, Long, Byte, Double, Float, Short) are subclasses
    of the abstract class Number.


    ![](img/d2ecd11c118e77b00121dcdf7dab613c_67_0.png)


    This wrapping is taken care of the compiler,the process is class boxing. So when
    a primitive is used when an object is required, the compiler boxes the primitive
    type in its wrapper class. Similarly, the compiler unboxes the object to a primitive.
    The Number is part of the java.lang package.


    Here is an example of boxing and unboxing:


    ```

    public class Test {

    public static void main(String args[]){

    Integer x =5;// boxes int to an Integer object

    x = x + 10;// unboxes the Integer to a int

    System.out.println(x);

    }

    }

    ```


    # TUTORIAL POINT

