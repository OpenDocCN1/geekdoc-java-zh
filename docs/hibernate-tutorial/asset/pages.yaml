  md: "# Class/static variables:\n\n+   Class variables also known as static variables\
    \ are declared with the static keyword in class, but outside a method, constructor\
    \ or a block.\n\n+   There would be only one copy of each class variable, regardless\
    \ of how many objects are created from it.\n\n+   Static variables are rarely\
    \ used other than being as constants. Constants are variables that are declared\
    \ as public/private, final and static. Static variables never change from their\
    \ initial value.\n\n+   Static variables are stored in static memory. It is rare\
    \ to use static variables other than declared and used as either public or private\
    \ constants.\n\n+   Static variables are created when the program starts and destroyed\
    \ when the program stops.\n\n+   Visibility is similar to instance variables.\
    \ However, most static variables are declared public since they must be available\
    \ for users of the class.\n\n+   Default values are same as instance variables.\
    \ For numbers, the default value is 0; for Booleans, it is false; and object references,\
    \ it is null. Values can be assigned during the declaration or within the constructor.\
    \ Additionally values can be assigned in special initializer blocks.\n\n+   Static\
    \ variables can be accessed by calling the class name. ClassName.VariableName.\n\
    \n+   When declaring class variables as public static final, then variables names\
