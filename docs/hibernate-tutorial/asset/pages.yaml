    Java provides a set of standard collection classes that implement Collection interfaces.
    Some of the classes provide full implementations that can be used-as and others
    are abstract classes, providing skeletal implementations that are used as starting
    points for creating concrete collections.


    The standard collection classes are summarized in the following table:


