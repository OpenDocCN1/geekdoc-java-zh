  md: '# Java Multithreading


    Java is a multithreaded programming language which means we can develop multithreaded
    program using


    Java. A multithreaded program contains two or more parts that can run concurrently
    and each part can handle different task at the same time making optimal use of
    the available resources specially when your computer has multiple CPUs.


    By definition multitasking is when multiple processes share common processing
    resources such as a CPU. Multithreading extends the idea of multithreading into
    applications where you can subdivide specific operations within a single application
    into individual threads. Each of the threads can run in parallel. The OS divides
    processing time not only among different applications, but also among each thread
    within an application.


    Multithreading enables you to write in a way where multiple activities can proceed
    concurrently in the program.


    # Life Cycle of a Thread:


    A thread goes through various stages in its life cycle. For example, a thread
    is born, started, runs, and then dies. Following diagram shows complete life cycle
    of a thread.


    ![](img/d2ecd11c118e77b00121dcdf7dab613c_285_0.png)


    TUTORIAL POINT

    Simply Easy Learning'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'Above-mentioned stages are explained here:


    +   * New: A new thread begins its life cycle in the new state. It remains in
    this state until the program starts the thread. It is also referred to as a born
    thread.

    * Runnable: After a newly born thread is started, the thread becomes runnable.
    A thread in this state is considered to be executing its task.

    * Waiting: A thread transitions to the waiting state while the thread waits for
    another thread to perform a task.A thread transitions back to the runnable state
    when another thread starts the waiting thread to continue.

    * Timed: A runnable thread can enter the waiting state for a specified interval
    of time. A thread in this state transitions back to the runnable state when that
    time expires or when the event it is waiting for occurs.

    * Terminated: A runnable thread enters the terminated state when it completes
    its task or terminates.


    # Thread Priorities:


    Every thread has a priority that ranges between MIN_PRIORITY (a constant of 1)
    and MAX_PRIORITY (a constant of 10). By default, every thread has priority NORMAL_PRIORITY
    (a constant of 5).


    Threads with higher priority are more important to a program and should be allocated
    processor time before lower-priority threads. However, priorities cannot guarantee
    the order in which threads execute and very much platform dependant.


    # Create Thread by Implementing Runnable Interface:


    If your class is intended to be executed as a thread then you can achieve this
    by implementing Runnable interface. You will need to follow three basic steps:


    # STEP 1:


    As a first step you need to implement a run() method provided by Runnable interface.
    This method provides entry point for the thread and you will put complete business
    logic inside this method. Following is simple syntax of run() method:


    ```

    public void run() { }

    ```


    # STEP 2:


    At second step you will instantiate a Thread object using the following constructor:


    ```

    Thread(Runnable threadObj, String threadName);

    ```


    Where, threadObj is an instance of a class that implements the Runnable interface
    and threadName is the name given to the new thread.


    # STEP 3


    Once Thread object is created, you can start it by calling start() method, which
    executes a call to run() method. Following is simple syntax of start() method:


    ```

    void start() { };

    ```


    # TUTORIALS POINT


    Simply Easy Learning'
