    # # Java’s Built-in Exceptions


    Java defines several exception classes inside the standard package java.lang.


    The most general of these exceptions are subclasses of the standard type RuntimeException.
    Since java.lang is implicitly imported into all Java programs, most exceptions
    derived from RuntimeException are automatically available.


    Java defines several other types of exceptions that relate to its various class.
    Following is the list of Java Unchecked RuntimeException.


    | Exception | Description |

    | --- | --- |

    | ArithmeticException | Arithmetic error, such as divide-by-zero. |

    | ArrayOutOfBoundsException | Array index is out-of-bounds. |

    | ArrayStoreException | Assignment to an array element of an incompatible type.
    |

    | ClassCastException | Invalid cast. |

    | IllegalArgumentException | Illegal argument used to invoke method. |

    | IllegalMonitorStateException | Illegal monitor operation, as waiting on an unlocked
    state. |

    | IllegalStateException | Environment or option is in incorrect state. |

    | IllegalThreadException | Requested operation not compatible with current thread
    state. |

    | IndexOutOfBoundsException | Some type of index is out-of-bounds. |

    | NegativeSizeException | Array created with a negative size. |

    | NullPointerException | Invalid use of a null reference. |

    | NumberFormatException | Invalid conversion of a string to a numeric format.
    |

    | SecurityException | Attempt to violate security. |

    | StringIndexOutOfBounds | Attempt to index outside the bounds of the string.
    |


