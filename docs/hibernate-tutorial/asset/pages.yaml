    \ useful documentation for our Java code.\n\n# What is Javadoc?\n\nJavadoc is\
    \ a tool that comes with JDK and is used for generating Java code documentation\
    \ in HTML format from source code that has required documentation in a predefined\
    \ format.\n\nFollowing is a simple example where right part of the code represents\
