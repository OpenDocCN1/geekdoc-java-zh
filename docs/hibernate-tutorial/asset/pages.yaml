  md: "+   * The access level can be more restrictive than the overridden method's\
    \ access level. For example, if the superclass method is declared public, the\
    \ overriding method in the subclass cannot be private or protected.\n\n+   * Instance\
    \ methods can be overridden only if they are inherited by the subclass.\n\n+ \
    \  * A method declared final cannot be overridden.\n\n+   * A method declared\
    \ static cannot be overridden but can be re-declared.\n\n+   * If a method cannot\
    \ be inherited, it cannot be overridden.\n\n+   * A subclass within the same package\
    \ as the instance's superclass can override any superclass method that is not\
    \ declared private or final.\n\n+   * A subclass in a different package can only\
    \ override the non-final methods declared public or protected.\n\n+   * An overriding\
    \ method can throw any unchecked exceptions, regardless of whether the overridden\
    \ method throws exceptions or not. However the overriding method should not throw\
    \ exceptions that are new or broader than the ones declared by the overridden\
    \ method. The overriding method can throw narrower or fewer exceptions than the\
    \ overridden method.\n\n+   * Constructors cannot be overridden.\n\n# # Using\
    \ the super keyword:\n\nWhen invoking a superclass version of an overridden method\
    \ the **super** keyword is used.\n\n```\nclass Animal {\n    public void move()\
    \ {\n        System.out.println(\"Animals can move\");\n    }\n}\n\nclass Dog\
    \ extends Animal {\n    public void move() {\n        super.move(); // invokes\
    \ the super class method\n        System.out.println(\"Dogs can walk and run\"\
    );\n    }\n}\n\npublic class TestDog {\n    public static void main(String args[])\
    \ {\n        Animal b = new Dog(); // Animal reference but Dog object\n      \
    \  b.move(); // Runs the method in Dog class\n    }\n}\n```\n\nThis would produce\
    \ the following result:\n\n```\nAnimals can move\nDogs can walk and run\n```\n\
    \nTUTORIAL POINT\nSimply Easy Learning"
