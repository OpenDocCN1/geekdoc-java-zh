  md: '# ABOUT THE TUTORIAL


    # Java Tutorial


    Java is a high-level programming language originally developed by Sun Microsystems
    and released in 1995. Java runs on a variety of platforms, such as Windows, Mac
    OS, and the various versions of UNIX. This tutorial gives a complete understanding
    ofJava.


    This reference will take you through simple and practical approach while learning
    Java Programming language.


    # Audience


    This reference has been prepared for the beginners to help them understand the
    basic to advanced concepts related to Java Programming language.


    # Prerequisites


    Before you start practicing with various types of examples given in this reference,
    I''m making an assumption that you are already aware about what is a computer
    program and what is a computer programming language?


