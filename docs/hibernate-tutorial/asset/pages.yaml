  md: "+   destroy: This method is only called when the browser shuts down normally.\
    \ Because applets are meant to live on an HTML page, you should not normally leave\
    \ resources behind after a user leaves the page that contains the applet.\n\n\
    +   paint: Invoked immediately after the start() method, and any time the applet\
    \ needs to repaint itself in the browser. The paint() method is actually inherited\
    \ from the java.awt.\n\n# A \"Hello, World\" Applet:\n\nThis is a simple applet\
    \ named HelloWorldApplet.java:\n\n```\nimport java.applet.*;\nimport java.awt.*;\n\
    \npublic class HelloWorldApplet extends Applet\n{\n    public void paint (Graphics\
    \ g)\n    {\n        g.drawString(\"Hello World\",25,50);\n    }\n}\n```\n\nThese\
    \ import statements bring the classes into the scope of our applet class:\n\n\
    +   - java.applet.Applet.\n\n+   - java.awt.Graphics.\n\nWithout those import\
    \ statements, the Java compiler will not recognize the classes Applet and Graphics,\
    \ which the applet class refers to.\n\n# The Applet CLASS:\n\nEvery applet is\
    \ an extension of the java.applet.Applet class. The Base Applet class provides\
    \ methods that a derived applet class may obtain information and services from\
    \ the browser context.\n\nThese include methods that do the following:\n\n+  \
    \ - Get applet parameters\n\n+   - Get the network location of the HTML file that\
    \ contains the applet\n\n+   - Get the network location of the applet class directory\n\
    \n+   - Print a status message in the browser\n\n+   - Fetch an image\n\n+   -\
    \ Fetch an audio clip\n\n+   - Play an audio clip\n\n+   - Resize the applet\n\
    \nAdditionally, the Applet class provides an interface by which the viewer or\
    \ browser obtains information about the applet and controls the applet's execution.\
    \ The viewer may:\n\n+   - request information about the author, version and copyright\
    \ of the applet\n\n# TUTORIALS POINT\n\nSimply Easy Learning"
