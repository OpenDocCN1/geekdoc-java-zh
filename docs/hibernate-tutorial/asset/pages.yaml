    # int hashCode()


    # Description:


    This method returns a hash code for this string. The hash code for a String object
    is computed as:


    ```

    s[0]*31^(n-1)+s[1]*31^(n-2)+...+s[n-1]

    ```


    Using arithmetic, s[i] is the ith character of the string, n is the length of
    the string, and ^ indicates exponentiation. (The hash value of the empty string
    is zero.)


    # Syntax:


    Here is the syntax of this method:


    ```

    public int hashCode()

    ```


    # Parameters:


    Here is the detail of parameters:


