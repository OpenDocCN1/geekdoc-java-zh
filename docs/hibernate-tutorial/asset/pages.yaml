    Note: Parameter names are not case sensitive.


    # Application Conversion to Applets:


    It is easy to convert a graphical Java application (that is, an application that
    uses AWT and that you can start with the java program launcher) into an applet
    that you can embed in a web page.


    Here are the specific steps for converting an application to an applet.


    +   - Make an HTML page with the appropriate tag to load the applet code.

    - Supply a subclass of the JApplet class. Make this class public. Otherwise, the
    applet cannot be loaded.

    - Eliminate the method in the application. Do not construct a frame window for
    the application. Your application will be displayed inside the browser.

    - Move any initialization code from the frame window constructor to the init method
    of the applet. You don''t need to explicitly call the applet object.browser instantiates
    it for you and calls the init method.

    - Remove the call to setColor for applets, sizing is done with the width and height
    parameters in the HTML file.

    - Remove the call to setDefaultCloseOperation. An applet cannot be closed; it
    terminates when the browser exits.

    - If the applet calls setTitle, eliminate the call to the method. Applets cannot
    have title bars. (You can of course, the web page itself, using the HTML title
    tag)

    - Don''t call setVisible(true). The applet is displayed automatically.


    # TUTORIALS POINT'
