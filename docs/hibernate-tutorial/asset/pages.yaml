  md: "A catch statement involves declaring the type of exception you are trying to\
    \ catch. If an exception occurs in protected code, the catch block (or blocks)\
    \ that follows the try is checked. If the type of exception that occurred is listed\
    \ in a catch block, the exception is passed to the catch block as much as an argument\
    \ is passed into a method parameter.\n\n# Example:\n\nThe following is an array\
    \ declared with 2 elements. Then, the code tries to access the 3rd element of\
    \ the array which throws an exception.\n\n```\n// File Name : ExceptionTest.java\n\
    import java.io.*;\npublic class ExceptionTest{\n    public static void main(String\
    \ args[]){\n        try{\n            int a[]=new int[2];\n            System.out.println(\"\
    Access element three :\"+a[3]);\n        }catch(ArrayIndexOutOfBoundsException\
