    # # History of Java:


    James Gosling introduced the Java language project in 1991 for use in one of his
    many set-top boxes. The language, initially called Oak an apple tree stood outside
    Gosling''s office, also went by the name Green and ended later being renamed Java,
    from a list of random words.


    Sun released the first public implementation as Java 1.0 in 1995. It promoted
    Once, Run Anywhere (WORA), providing no-cost run-times on popular platforms.


    On 13 November 2006, Sun released most of Java as free and open source software
    under the terms of the GNU General Public License (GPL).


    On 8 May 2007, Sun finished the process, making all of Java''s core code free
    and open-source, aside from a small portion of code which Sun did not hold the
    copyright.


