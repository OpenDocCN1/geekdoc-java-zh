  md: '# Java Date and Time


    Java provides the Date class available in java.util package, this class encapsulates
    the current date and time.


    The Date class supports two constructors. The first constructor initializes the
    object with the current date and time.


    ```

    Date()

    ```


    The following constructor accepts one argument that equals the number of milliseconds
    that have elapsed since midnight, January 1, 1970


    ```

    Date(long millisecond)

    ```


    Once you have a Date object available, you can call any of the following support
    methods to play with dates:


    | SN | Methods with Description |

    |---|---|

    | 1 | boolean after(Date) Returns true if the invoking Date object contains a
    date that is later than the one specified by date, otherwise, it returns false.
    |

    | 2 | boolean before(Date) Returns true if the invoking Date object contains a
    date that is earlier than the one specified by date, otherwise, it returns false.
    |

    | 3 | Object clone() Duplicates the invoking Date object. |

    | 4 | int compareTo(Date date) Compares the value of the invoking object with
    that of date. Returns 0 if the values are equal. Returns a negative value if the
    invoking object is earlier than date. Returns a positive value if the invoking
    object is later than date. |

    | 5 | int compareTo(Object obj) Operically identifies compareTo(Date) if obj is
    of class. Otherwise, it throws a ClassCastException. |

    | 6 | boolean equals(Object date) Returns true if the invoking Date object contains
    the same time and date as the one specified by date, otherwise, it returns false.
    |

    | 7 | long getTime() Returns the number of milliseconds that have elapsed since
    January 1, 1970. |

    | 8 | int hashCode() | |


