    # # The Stack


    The Stack implements a last-in-first-out LIFO stack of elements.


    You can think of a stack literally as a vertical stack of objects; when you add
    a new element, it gets stacked on top of the others.


    When you pull off the stack, it comes off the top. In other words, the last element
    added to the stack is the first one to come back off.


    Stack is a subclass of Vector that implements a standard last-in, first-out stack.


    Stack only defines the default constructor, which creates an empty stack. Stack
    includes all the methods defined by Vector and adds several of its own.


    ```

    Stack()

    ```


    Apart from the methods inherited from its parent class Vector, Stack defines the
    following methods:


    | SN Methods with Description |

    |---|---|

    | 1 | **boolean empty()** Tests if the stack is empty. Returns true if the stack
    is empty, and returns false if the stack contains elements. |

    | 2 | **Object peek()** Returns the element on the top of the stack, but does
    not remove it. |

    | 3 | **Object pop()** Returns the element on the top of the stack, removing it
    in the process. |

    | 4 | **Object push(Object element)** Pushes element onto the stack. element is
    also returned. |

    | 5 | **int search(Object element)** Searches for element in the stack. If found,
    its offset from the top of the stack is returned. Otherwise, -1 is returned.|


