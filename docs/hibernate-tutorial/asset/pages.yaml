  md: '# CHAPTER 20


    # Java Inheritance


    Inheritance can be defined as the process where one object acquires the properties
    of another. With the use of inheritance, the information is made manageable in
    a hierarchical order.


    When we talk about inheritance, the most commonly used keyword is extends and
    implements. These words would determine whether one object IS-A type of another.
    By using these keywords we can make one object acquire the properties of another
    object.


    # IS-A Relationship:


    IS-A is a way of saying : This object is a type of that. Let us see how the extends
    keyword is used to achieve inheritance.


    ```

    public class Animal {

    }

    public class Mammal extends Animal {

    }

    public class Reptile extends Animal {

    }

    public class Dog extends Mammal {

    }

    ```


    Now, based on the above example, In Object Oriented terms the following are true:


    +   * Animal is the superclass of Mammal class.

    * Animal is the superclass of Reptile class.

    * Mammal and Reptile are subclasses of Animal class.

    * Dog is the subclass of both Mammal and Animal classes.


    Now, if we consider the IS-A relationship, we can say:


    +   * Mammal IS-A Animal

    * Reptile IS-A Animal


    # TUTORIALS POINT'
