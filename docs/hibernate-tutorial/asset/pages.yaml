  md: "# Java Strings\n\nStrings which are widely used in Java programming are a sequence\
    \ of characters. In the Java programming language, strings are objects.\n\nThe\
    \ Java platform provides the String class to create and manipulate strings.\n\n\
    # Creating Strings:\n\nThe most direct way to create a string is to write:\n\n\
    ```\nString greeting=\"Hello world!\";\n```\n\nWhenever it encounters a string\
    \ literal in your code, the compiler creates a String object with its value, in\
    \ this case, \"Hello world\".\n\nAs with other object, you can create String objects\
    \ using the new keyword and constructor. The String class has element constructors\
    \ that allow you to provide the initial value of the string using different sources,\
    \ such as an array of characters:\n\n```\npublic class StringDemo{\n    public\
    \ static void main(String args[]){\n        char[] helloArray={'h','e','l','l','o','\
    \ '};\n        String helloString=new String(helloArray);\n        System.out.println(helloString);\n\
