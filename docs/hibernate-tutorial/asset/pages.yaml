  md: "# Standard Streams\n\nAll programming languages provide support for standard\
    \ I/O where you can take input from a keyboard and produce output on the computer\
    \ screen. If you are aware of C or C++ programming languages, you must be aware\
    \ of three standard devices STDIN, STDOUT and STDERR. Similar Java provides programs\
    \ following three standard streams\n\n+   **Standard Input:** This is used to\
    \ feed the data to user's program and usually a keyboard is used as standard input\
    \ stream and represented as System.in.\n**Standard Output:** This is used to output\
    \ the data produced by the user's program and usually a computer screen is used\
    \ as System.out.\n**Standard Error:** This is used to output the error data produced\
    \ by the user's program and usually a computer screen is used for standard error\
    \ and represented as System.err.\n\nFollowing is a simple program which creates\
    \ InputStreamReader to read standard input until the user types 'q':\n\n```\n\
    import java.io.*;\npublic class ReadConsole {\n    public static void main(String[]\
    \ args) throws IOException {\n        InputStreamReader cin = null;\n\n      \
    \  try {\n            cin = new InputStreamReader(System.in);\n            System.out.println(\"\
    Enter characters, 'q' to quit.\");\n            char c;\n            do {\n  \
    \              c = (char) cin.read();\n                System.out.print(c);\n\
    \            } while (c != 'q');\n        } finally {\n            if (cin !=\
    \ null) {\n                cin.close();\n            }\n        }\n    }\n}\n\
    ```\n\nLet's keep above code in ReadConsole.java file to compile and execute it\
    \ as below. This program reading and outputting sample character until we press\
    \ 'q':\n\n```\n$javac ReadConsole.java\n$java ReadConsole\nEnter characters, 'q'\
    \ to quit.\n1\ne\ne\nq\n```\n\n# TUTORIALS POINT\nSimple Easy Learning"
