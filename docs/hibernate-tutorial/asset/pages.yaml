    # Java Packages


    Packages are used in Java inoroder to prevent naming conflicts, to control access,
    to make searching/locating and usage of classes, interfaces, enumerationsss and
    annotations etc.


    A Package can be defined as a grouping of related types(classes, interfaces, enumerations
    and annotations) providing access protection and name space management.


    Some of the existing packages in Java are:


    +   * java.lang - bundles the fundamental classes

    * java.io - classes for input , output functions are bundled in this package


    Programmers can define their own packages to bundle group of classes/interfaces,
    etc. It is a good practice to group related classes implemented by you that a
    programmer can easily determine that the classes, interfaces, enumerations, annotations
    are related.


    Since the package creates a new namespace there won''t be any name conflicts with
    other packages. Using packages, it is easier to provide access control and it
    is easier to locate the related class.


    # Creating a package:


    When creating a package, you should choose a name for the package and put a package
    statement with that name at the top of every source file that contains the classes,
    interfaces, enumerations, and annotation types that you want to include in the
    package. The package statement should be the first line in the source file. There
    can be only one package statement in each source file, and it applies to all types
    in the file.


    If a package statement is not used then the interfaces, enumerations, and annotations
    will be put into an unnamed package.


    Example:


    Let us look at an example that a package creates called animals. It is common
    practice to use lowerc names of packages to avoid any conflicts with the names
    of classes, interfaces.


    Put an interface in the package animals:


    ```

    / File name : Animal.java */

    package animals;


    interface Animal{

    public void eat();

    public void travel();

    ```


