  md: '# OutputStream:


    FileOutputStream is used to create a file and write data into it. The stream would
    create a file, if it doesn''t already exist, before opening it for output.


    Here are two constructors which can be used to create a FileOutputStream object.


    Following constructor takes a file name as a string to create an input stream
    to write to the file:


    ```

    OutputStream f = new OutputStream("C:/java/hello")

    ```


    Following constructor takes a file object to create an output stream object to
    write the file. First, we create a file using File[method] as follows:


    ```

    File f = new File("C:/java/hello")

    OutputStream f = new FileOutputStream(f);

    ```


    Once you have OutputStream in hand, there is a list of helper methods, which can
    be used to write to stream or do other operations on the stream.


    # Methods with Description


    | SN | Description |

    |---|---|

    |1 | public void close() throws IOException

    Method closes the file output stream. Releases any system resources associated
    with the file. This throws an IOException |

    |2 | protected void finalize() throws IOException

    Method clears the connection to the file. Ensures the close method of this file
    output stream is called when there are no more references to this stream. This
    throws IOException |

    |3 | public void write(int w) throws IOException

    Method writes the specified byte to the output stream. |

    |4 | public void write(byte[] w)

    W w.length bytes from the mentioned byte to the OutputStream. |


    There are other optional output streams, for more detail you can refer to the
    following:


    +   - ByteArrayOutputStream

    - DataOutputStream


