  md: "# Java Serialization\n\nJava provides a mechanism, called object serialization\
    \ where an object can be represented as a sequence of bytes that includes the\
    \ object's data as well as information about the object's type and the types of\
    \ data stored in the object.\n\nAfter a serialized object has been written into\
    \ a file, it can be read from the file and deserialized that is, the type information\
    \ and bytes that represent the object and its data can be used to recreate the\
    \ object in memory.\n\nMost impressive is that the entire process is JVM independent,\
    \ meaning an object can be serialized on one platform and deserialized on an entirely\
    \ different platform.\n\nClasses ObjectInputStream and ObjectOutputStream are\
    \ high-level streams that contain the methods for serializing and deserializing\
    \ an object.\n\nThe ObjectInputStream class contains many methods for writing\
    \ various types, but one method in particular stands:\n\n```\npublic final void\
    \ writeObject(Object x) throws IOException\n```\n\nThe above method serializes\
    \ an Object and sends it to the output stream. Similarly, the ObjectInputStream\
    \ class contains the following method for deserializing an object:\n\n```\npublic\
    \ final Object readObject(Object x) throws IOException,\nClassNotFoundException\n\
    ```\n\nThis method retrieves the Object out of the stream and deserializes it.\
    \ The return value is Object, so you will need to cast it to its appropriate data\
    \ type.\n\nTo demonstrate serialization works in Java, I am going to use the Employee\
    \ class that we discussed early on in the book. Suppose that we have the following\
    \ Employee class, which implements the Serializable interface:\n\n```\npublic\
    \ class Employee implements java.io.Serializable {\n  public String name;\n  public\
    \ String address;\n  public transient int SSN;\n  public int number;\n  public\
    \ void mailCheck(){\n    System.out.println(\"Mailing a check to \" + name + \"\
    \ \" + address + \n```\n\n# TUTORIALS POINT\n\nSimply Easy Learning"
  merge: -1
