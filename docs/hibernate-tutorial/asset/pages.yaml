  md: "This would produce the following result. You can try this example again and\
    \ again and you would get different result every time.\n\n```\nStarting hello\
    \ thread...\nStarting goodbye thread...\nHello\nHello\nHello\nHello\nHello\nGoodbye\n\
    Goodbye\nGoodbye\nGoodbye\nGoodbye\n......\n```\n\n# # Major Java Multithreading\
    \ Concepts:\n\nWhile doing Multithreading programming in Java, you would need\
    \ to have the following concepts very handy:\n\n+   * What is thread synchronization?\n\
    * Handling threads inter communication\n* Handling thread deadlock\n* Major thread\
    \ operations\n\n# # What is Thread synchronization?\n\nWhen we start two or more\
    \ threads within a program, there may be a situation when multiple threads try\
    \ to access the same resource and finally they can produce unforeseen result due\
    \ to concurrency issue. If example multiple threads try to write within a same\
    \ file then they might corrupt the data because one of them can overwrite or one\
    \ thread is opening the same file at the same time another thread might be closing\
    \ the same.\n\nSo there is need to synchronize the action of multiple threads\
    \ and make sure that only one thread can access the resource at a given point\
    \ in time. This is implemented using a concept called monitors. Each object in\
    \ Java is associated with a monitor, which a thread can lock or unlock. Only one\
    \ thread at a time may have a lock on a monitor.\n\nJava programming provides\
    \ a very handy way of creating threads and synchronizing their task by synchronized\
    \ blocks. Each block holds shared resources within this block. Following is the\
    \ general form of the synchronized statement:\n\n```\nsynchronized(objectIdentifier)\
    \ {\n    // Access variables and other shared resources\n}\n```\n\nHere, the objectIdentifier\
    \ is a reference to an object whose lock associates with the monitor that the\
