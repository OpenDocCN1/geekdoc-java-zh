  md: '# Java Networking


    The term network programming refers to writing programs that execute across multiple
    devices (computers), in which the devices are all connected to each other using
    a network.


    The Java.net package of the J2SE APIs contains a collection of classes and interfaces
    that provide the low-level communication details, allowing you to write programs
    that focus on solving the problem at hand.


    The Java.net package provides support for the two common network protocols:


    +   * TCP: TCP stands for Transmission Control Protocol, which allows for reliable
    communication between two applications. TCP is typically used over the Internet
    Protocol, which is referred to as TCP/IP.

    * UDP: UDP stands for User Datagram Protocol, a connection-less protocol that
    allows for packets of data to be transmitted between applications.


    This tutorial gives good understanding on the following two subjects:


    +   * Socket Programming: This is most widely used concept in Networking and it
    has been explained in very detail.

    * URL Processing: This would be covered separately. Click here to learn about
    URL Processing in Java language.


    # Url Processing


    URL stands for Uniform Resource Locator and represents a resource on the World
    Wide Web, such as a Web page or FTP directory.


    This section shows how to write Java programs that communicate with a URL. A URL
    can be broken down into parts, as:


    ```

    protocol://host:port/path?query#ref

    ```


    Examples of protocols include HTTP, HTTPS, FTP, and File. The path is also referred
    as the filename, and the host is also called authority.


    The following is a URL to a Web page protocol is HTTP:


    ```

    http://www.amrood.com/index.htm?language=en#j2se

    ```


    Notice that this URL does not specify a path, in which case the default port for
    the protocol is used. With HTTP, the default port is 80.


    # TUTORIALS POINT


    Simply Easy Learning'
