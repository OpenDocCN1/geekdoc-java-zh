  md: '# CHAPTER 34


    # Java Applet Basics


    An applet is a Java program that runs in a Web browser. An applet can be a fully
    Java application because it has the entire Java API at its disposal.


    There are some important differences between an applet and a standalone Java application,
    including the following:


    +   - An applet is a class that extends the java.applet.Applet class.

    - A main() method is not invoked on an applet, and an applet class will not define
    main().

    - Applets are designed to be embedded within an HTML page.

    - When a user views an HTML page that contains an applet, the code for the applet
    is downloaded to the user''s machine.

    - A JVM is required to view an applet. The JVM can be either a plug-in of the
    Web browser or a separate runtime environment.

    - The JVM on the user''s machine creates an instance of the applet and invokes
    various methods during the applet''s lifetime.


    Applets have strict security rules that are enforced by the Web browser. The security
    of an applet is often referred to as sandbox security, comparing the applet to
    a child playing in a sandbox with various rules that must be followed.


    Other classes that the applet needs be downloaded in a single Java Archive (JAR)
    file.


    # Life Cycle of an Applet:


    Four methods in the Applet class give you the framework on which you can build
    any applet:


    +   - init: This method is invoked for whatever initialization is needed for your
    applet. It is called after the params tag has been processed.

    - start: This method is automatically called after the browser calls the init
    method. It is also called whenever the user returns to the page containing the
    applet after going off to other pages.

    - stop: This method is automatically called when the user moves off the page on
    which the applet sits. It can, therefore, be called repeatedly in the same applet.


    # TUTORIAL POINT


    Simple Easy Learning'
