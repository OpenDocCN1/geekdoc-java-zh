    \ max value is 3.0\n```\n\n# The finalize() Method:\n\nIt is possible to define\
    \ a method that will be called just before an object's destruction by the garbage\
    \ collector. This method is called finalize(), and it can be used to ensure that\
    \ an object terminates cleanly.\n\nFor example, you might use finalize() to make\
    \ sure that an open file owned by that object is closed.\n\nTo add a finalizer\
    \ to a class, you simply define the finalize() method. The Java runtime calls\
    \ that method whenever it is about to recycle an object of that class.\n\nInside\
    \ the finalize() method, you will specify those actions that must be performed\
    \ before an object is destroyed.\n\nThe finalize() method has this general form:\n\
    \n```\nprotected void finalize()\n{\n  // finalization code here\n}\n```\n\nHere,\
    \ the keyword protected is a specifier that prevents access to finalize() by code\
    \ defined outside its class.\n\nThis means that you cannot know when even if finalize()\
    \ will be executed. For example, if your program ends before garbage collection\
    \ occurs, finalize() will not execute."
