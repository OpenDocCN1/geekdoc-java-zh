  md: '# Socket Class Methods:


    The java.net.Socket class represents the socket that both the client and server
    use to communicate with each other. The client obtains a Socket object by instantiating
    one, whereas the server obtains a Socket object from the return value of the accept()
    method.


    The class has five constructors that a client uses to connect to a server:


    | SN | Methods with Description |

    |---|---|

    | 1 | `public Socket(String host, int port) throws UnknownHostException, IOException`

    This method attempts to connect to the specified server at the specified port.
    If this constructor does not throw an exception, the connection is successful
    and the client is connected to the server. |

    | 2 | `public Socket(InetAddress host, int port) throws IOException`

    This method is identical to the previous constructor, except that the host is
    denoted by an InetAddress object |

    | 3 | `public Socket(String host, int port, InetAddress localAddress, int localPort)
    throws IOException`

    Connects to the specified host and port, creating a socket on the local host at
    the specified address and port. |

    | 4 | `public Socket(InetAddress address, int port, InetAddress localAddress,
    int localPort) throws IOException`

    This method is identical to the previous constructor, except that the host is
    denoted by InetAddress instead of a String |

    | 5 | `public Socket()`

    Creates an unconnected socket. Use the connect() method to connect this socket
    to a server. |


    When the Socket constructor returns, it does not instantiate a Socket object but
    it attempts to connect to the specified server and port.


    Some methods in the Socket class are listed here. Notice that both the client
    and server have a Socket object, these methods can be invoked by both the client
    and server.


    | SN | Methods with Description |

    |---|---|

    | 1 | `public void connect(InetAddress host, int timeout) throws IOException`

    This method connects the socket to the specified host. This method is needed only
    when you instantiated the Socket using the no-argument constructor. |

    | 2 | `public InetAddress getAddress()`

    This method returns the address of the other computer that this socket is connected
    to. |

    | 3 | `public int getPort()`

    Returns the port that socket is bound to the remote machine. |

    | 4 | `public int getLocalPort()`

    Returns the port that socket is bound to the local machine. |

    | 5 | `public InetAddress getRemoteAddress()`

    Returns the address of the remote socket. |

    | 6 | `public InputStream getInput() throws IOException`

    Returns the input stream of the socket. The input stream is connected to the output
    stream of the remote socket. |

    | 7 | `public OutputStream getOutputStream() throws IOException`

    Returns the output stream of the socket. The output stream is connected to the
    input stream of the |


