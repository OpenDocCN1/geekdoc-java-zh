    \        System.out.println(\"Out of the block\");\n    }\n}\n```\n\nThis would\
    \ produce the following result:\n\n> Exception thrown :java.lang.ArrayIndexOutOfBoundsException:3\n\
    Out of the block\n\n# Multiple catch Blocks:\n\nA try block can be followed by\
