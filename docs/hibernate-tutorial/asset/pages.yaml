  md: 'Here, we instantiate two Salary objects, one using a Salary reference s, and
    the other using an Employee reference.


    While invoking s.mailCheck() the compiler sees mailCheck() in the Salary class
    at compile time, and the JVM invokes mailCheck() in the Salary class at run time.


    Invoking mailCheck() on e is quite different because e is an Employee reference.
    When the compiler seese.mailCheck(), the compiler sees the mailCheck() method
    in the Employee class.


    Here, at compile time, the compiler used mailCheck() in Employee to validate this
    statement. At run time, however, the JVM invokes mailCheck() in the Salary class.


    This behavior is referred to as virtual method invocation, and the methods are
    referred to as virtual methods. All methods in Java behave in this manner, whereby
    an overridden method is invoked at run time, no matter what data type the reference
    is that was used in the source code at compile time.'
