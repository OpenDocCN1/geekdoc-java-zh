  md: '# Java Collections


    With Java 2, Java provided ad hoc classes such as Dictionary, Vector, Stack, and
    Properties to store and manipulate groups of objects. Although these classes were
    quite useful, they lacked a unifying theme. Thus, the way that you used Vector
    was different from the way that you used Properties. The collections framework
    was designed to meet several goals.


    +   * The framework had to be high-performance. The implementations for the fundamental
    collections (dynamic arrays, linked lists, trees, and hashtables) are highly efficient.

    * The framework had to allow different types of collections to work in a similar
    manner and with a high degree of interoperability.

    * Extending and/or a collection had to be easy.


    Towards this end, the entire collections framework is designed around a set of
    standard interfaces. Several standard implementations such as LinkedList, HashSet,
    and TreeSet of these interfaces are provided that you may use them as-is and you
    may implement your own collection, if you choose.

    A collections framework is a unified architecture for representing and manipulating
    collections. All collections contain the following:


    +   * Interfaces: These are abstract data types that represent collections. Interfaces
    allow collections to be manipulated independently of their representation. In
    object-oriented languages, interfaces generally form a hierarchy.

    * Implementations, i.e., Classes: These are the concrete implementations of the
    collections interfaces. In essence, they are reusable data structures.

    * Algorithms: These are the methods that perform useful computations, such as
    searching and sorting, on objects that implement collection interfaces. The algorithms
    are said to be polymorphic: that is, the same method can be used on many different
    implementations of the appropriate collection.


    In addition to collections, the framework defines several map interfaces and classes.
    Maps store key/value pairs. Although maps are not collections in the proper use
    of the term, they are fully integrated with collections.


    # The Collection Interfaces


    The collections framework defines several interfaces. This section provides an
    overview of each interface:


    | SN | Interfaces with Description |

    |---|---|

    | 1 | The Collection Interface |


