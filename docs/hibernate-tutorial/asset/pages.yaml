  md: '# How to use an Iterator?


    Often, you will want to cycle through the elements in a collection. For example,
    you might want to display each element.


    The easiest way to do this is to employ an iterator, which is an object that implements
    either the Iterator or the ListIterator interface.


    Iterator enables you to cycle through a collection, obtaining or removing elements.
    ListIterator extends Iterator to allow bidirectional traversal of a list and the
    modification of elements.


    | SN | Iterator Methods with Description |

    |---|---|

    | 1 | Using Iterator

    Here is a list of all the methods with examples provided by Iterator and ListIterator
    interfaces. |


    # Using Java Iterator


    Often, you will want to cycle through the elements in a collection. For example,
    you might want to display each element.


    The easiest way to do this is to employ an iterator, which is an object that implements
    either the Iterator or the List interface.


    Iterator enables you to cycle through a collection, obtaining or removing elements.
    ListIterator extends Iterator to allow bidirectional traversal of a list, and
    the modification of elements.


    Before you can access a collection through an iterator, you must obtain one. Each
    of the collection classes provides an iterator() method that returns an iterator
    to the start of the collection. By using this iterator object, you can access
    each element in the collection, one element at a time.


    In general, to use an iterator to cycle through the contents of a collection,
    follow these steps:


    +   - Obtain an iterator to the start of the collection by calling the collection''s
    iterator() method.

    - Set up a loop that makes a call to hasNext(). Have the loop iterate as long
    as hasNext() returns true.

    - Within the loop, obtain each element by calling next( ).


    For collections that implement List, you can also obtain an iterator by calling
    ListIterator.


    # The Methods Decl by Iterator:


    | SN | Methods with Description |

    |---|---|

    | 1 | boolean hasNext()

    Returns true if there are more elements. Otherwise, returns false.

    | 2 | Object next()

    Returns the next element. Throws NoSuchElementException if there is not a next
    element.

    | 3 | void remove()

    Removes the current element. Throws IllegalStateException if an attempt is made
    to call remove() that is not preceded by a call to next( ).


