    # instanceof Operator:


    This operator is used only for object reference variables. The operator checks
    whether the object is of particular type(class type or interface type); instanceof
    is written as:


    ```

    (Object reference variable) instanceof (class/interface type)

    ```


    If the object referred by the left side of the operator passes the IS-A class
    for class/interface type on the right side, the result will be true. Following
    is the example:


    ```

    String name = "James";

    boolean result = name instanceof String;

    // This will return true since name is type of String

    ```


    This operator will still return true if the object being assigned is compatible
    with the type on the right. Following is one more example:


    ```

    class Vehicle(){

    public static class Car extends Vehicle(){

    public static void main(String args[]){

    Vehicle a=new Car();

    boolean result = a instanceof Car;

    System.out.println(result);

    }

    }

    ```


    This would produce the result:


    ```

    true

    ```


    # Precedence of Java Operators:


    Operator determines the grouping of terms in an expression. This affects how an
    expression is evaluated. Certain operators have higher precedence than others;
    for example, the multiplication operator has higher precedence than the addition
    operator.


    For example, x=7+3*2; here, x is assigned 13, not 20 because operator * has higher
    precedence than +, so it first gets multiplied with 3 and then adds into 7.


    Here, operators with the highest precedence appear at the top of the table, those
    with the lowest appear appear at the bottom. Within an expression, higher precedence
    operators will be evaluated first.


