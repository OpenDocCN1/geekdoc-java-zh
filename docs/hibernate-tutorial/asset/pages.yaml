  md: '# CHAPTER 2


    # Java Environment Setup


    Before proceed further, it is important that we set up the Java environment correctly.
    This section guides you on how to download and set Java on your machine. Please
    follow the following steps to set up the environment.


    Java SE is freely available from the link Download Java. So you download a version
    based on your operating system.


    Follow the instructions to download Java and run the .exe to install Java on your
    machine. Once you installed Java on your machine, you would need to set environment
    variables to point to correct directories:


    # Setting up the path for windows 2000/XP:


    Assuming you have installed Java in c:\Program Files\java\jdk directory:


    +   * Right-click on ''My Computer'' and select ''Properties''.


    +   * Click on the ''Environment variables'' button under the ''Advanced'' tab.


    +   * Now, alter the ''Path'' variable so that it also contains the path to the
    Java executable. Example, if the path is currently set to ''C:\WINDOWS\SYSTEM32'',
    then change your path to read ''C:\WINDOWS\SYSTEM32;c:\Program Files\java\jdk\bin''.


    # Setting up the path for windows 95/98/ME:


    Assuming you have installed Java in c:\Program Files\java\jdk directory:


    +   * Edit the ''C:\autocexec.bat'' file and add the following line at the end:
    ''SET PATH=%PATH%;C:\Program Files\java\jdk\bin''


    # Setting up the path for Linux, UNIX, Solaris, FreeBSD:


    Environment PATH should be set to point where the Java binaries have been installed.
    Refer to your shell documentation if you have trouble doing this.


    Example, if you use bash as your shell, then add the following line to the end
    of your ''.bashrc: export PATH=$PATH:path/to/java''


