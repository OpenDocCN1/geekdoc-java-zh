    |---|---|

    | 1 | public String getName() Returns the name of the file or directory denoted
    by this abstract pathname. |

    | 2 | public String getParent() Returns the pathname of this abstract pathname''s,
    or null if this pathname does not name a parent directory. |

    | 3 | public File getFile() Returns the abstract pathname of this abstract pathname''s,
    or null if this pathname does not name a parent directory. |

    | 4 | public String getPath() Converts this abstract pathname into a string. |

    | 5 | public boolean isAbsolute() Tests whether this abstract pathname is absolute.
    True if this abstract pathname is absolute, false otherwise |


