  md: "# # Java Loop Control\n\nThere here may be a situation when we need to execute\
    \ a block of code several number of times and is often referred to as a loop.\n\
    \nJava has very flexible three looping mechanisms. You can use one of the following\
    \ three loops:\n\n+   * while Loop\n* do...while Loop\n* for Loop\n\nAs of Java\
    \ 5, the *enhanced for loop* was introduced. This is mainly used for Arrays.\n\
    \n# ## The while Loop:\n\nA while loop is a control structure that allows you\
    \ to repeat a task certain number of times.\n\n# ## Syntax:\n\nThe syntax of a\
    \ while loop is:\n\n```\nwhile (Boolean_expression) {\n    //Statements\n}\n```\n\
    \nWhen executing, the *boolean_expression* result is true, then the actions inside\
    \ the loop will be executed. This continues as long as the expression is true.\n\
    Here, point of the *while* loop is that the loop might never run. When the expression\
    \ is tested and the result is false, the loop body will be skipped and the first\
    \ statement after the while loop will be executed.\n\n# ## Example:\n\n```\npublic\
    \ class Test{\n    public static void main(String args[]) {\n        int x = 0;\n\
    \        while (x < 20) {\n            System.out.print(\"value of x : \" + x\
    \ );\n        }\n    }\n```\n\n# ## TUTORIAL POINT\n\nSimply Learning"
