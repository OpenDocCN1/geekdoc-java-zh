  md: "# Private Access Modifier - private:\n\nMethods, Variables and Constructors\
    \ that are declared private can only be accessed within the declared class itself.\n\
    \nPrivate access modifier is the most restrictive access level. Class and interfaces\
    \ cannot be private.\n\nVariables that declared private can be accessed outside\
    \ the class if public getter methods are present in the class.\n\nUsing the private\
    \ modifier is the main way that an object encapsulates itself and hide data from\
    \ the outside world.\n\n# Example:\n\nThe following class uses private access\
    \ control:\n\n```\npublic class Logger{\n    private String format;\n    public\
    \ String getFormat() {\n        return this.format;\n    }\n    public void setFormat(String\
    \ format){\n        this.format = format;\n    }\n}\n```\n\nHere, the format variable\
    \ of the Logger is private, so there's no way for other classes to retrieve or\
    \ set its value directly.\n\nSo to make this variable available to the outside\
    \ world, we defined two public methods: getFormat(), which returns the value of\
    \ format, and setFormat(String), which sets its value.\n\n# Public Access Modifier\
    \ - public:\n\nA class, constructor, interface etc declared public can be be accessed\
    \ from any other class. Therefore fields, methods, blocks inside a public class\
    \ can be accessed from any class belonging to the Java Universe.\n\nHowever if\
    \ the public class we are trying to access is in a different package, then the\
    \ class still need to be imported.\n\nBecause class inheritance, all public methods\
    \ and variables of a class are inherited by its subclasses.\n\n# Example:\n\n\
    The following function uses public access control:\n\n```\npublic static void\
    \ main(String[] arguments{\n    //...\n}\n```\n\nThe main() method of an application\
    \ has to be public. Otherwise, it could not be called by a Java interpreter (such\
    \ as java) to run the class.\n\n# Protected Access Modifier - protected:\n\nVariables,\
    \ methods and constructors that are declared protected in a superclass can be\
    \ accessed only by the subclasses in package or any class within the package of\
    \ the protected members' class.\n\n# TUTORIAL POINT\n\nSimply Easy Learning"
  merge: -1
  pgno: 43
- img_proc: true
  md: "The protected access modifier cannot be applied to class and interfaces. Methods,\
    \ fields can be declared protected, however methods and fields in a interface\
    \ cannot be declared protected.\n\nProtected access gives the subclass a chance\
    \ to use the helper method or variable, while preventing an unrelated class from\
    \ trying to use it.\n\n# Example:\n\nThe following class uses protected access\
    \ control, to allow its child override openSpeaker() method:\n\n```\nclass AudioPlayer{\n\
    \    protected boolean openSpeaker(Speaker sp) {\n        // implementation details\n\
    \    }\n}\nclass StreamingAudioPlayer{\n    boolean openSpeaker(Speaker sp) {\n\
    \        // implementation details\n    }\n}\n```\n\nHere, if we define openSpeaker()\
    \ method as private, it would not be accessible from any other class than AudioPlayer.\
    \ If we define it as public, then it would become accessible to all the outside\
    \ world. Our intention is to expose this method to its subclass only, using protected\
    \ modifier.\n\n# Access Control and Inheritance:\n\nThe following rules for inherited\
    \ methods are enforced:\n\n+   * Methods declared public in a superclass must\
    \ be public in all subclasses.\n* Methods declared protected in a super must either\
    \ be protected or public in subclasses; they cannot be private.\n* Methods declared\
    \ without access control (no modifier was used) can be declared more private in\
    \ subclasses.\n* Methods declared private are not inherited at all, there is no\
    \ rule for them.\n\n# 2. No Access Modifiers\n\nTo use a modifier, include your\
    \ keyword in the definition of a class, method, or variable. Modifier precedes\
    \ the rest of the statement, as in the following examples (italics):\n\n```\n\
    public class className {\n    // ...\n    private boolean myFlag;\n    static\
    \ final double weeks=9.5;\n    protected static final int BOXWIDTH=42;\n    public\
    \ static void main(String[] arguments) {\n        // body of method\n    }\n```\n\
    \nTUTORIALS POINT\nSimply Easy Learning"
