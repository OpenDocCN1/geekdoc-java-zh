    # # Basic Syntax:


    About programs, it is very important to keep in mind the following points.


    +   - Case Sensitivity - Java is case sensitive, which means either Hello and
    hello would have different

    meaning in Java.


    +   - Class Names - For all names, the first letter should be in Upper Case.


    If several words are used to form the name of the class, each word''s first letter
    should be in Upper Case.


    Example MyFirstJavaClass


    +   - Methods Names - All method names should start with a Lower Case letter.


    If several words are used to form the name of the method, then each word''s first
    letter should be in

    Upper Case.


    Example public void myMethodName()


    +   - Program File Name - The name of the program file should exactly match the
    class name.


    When saving the file, you should save it using the class name (Remember Java is
    case sensitive) and append

    ''.java'' to the end of the name (if the file name and the class name do not match
    your program will not compile).


    Example : ''MyFirstJavaProgram'' is the class name, then the file should be saved

    as as ''MyFirstJavaProgram.java''


    +   - public static void main(String args[]) - Java program processing starts
    from the main() method, which is

    mandatory part of every Java program.


    # # Identifiers:


    All components require names. Names used for classes, variables and methods are
    called identifiers.


    In Java, there are several points to remember about identifiers. Here are as follows:


    +   - All identifiers begin with a letter (A to Z or a to z), currency character
    ($) or an underscore (_).


    +   - After the first character, identifiers can have any combination of characters.


    +   - A keyword cannot be used as an identifier.


    +   - Most importantly identifiers are case sensitive.


    +   - Examples of legal identifiers:age, $salary, __1_value


    +   - Examples of illegal identifiers: 123abc, -salary


    # TUTORIALS POINT


    Simple Easy Learning'
