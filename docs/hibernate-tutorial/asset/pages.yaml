    # # The Directory Structure of Packages:


    Two major results occur when a class is placed in a package:


    +   * The name of the package becomes a part of the class, as we just discussed
    in the previous section.


    +   * The name of the package must match the directory structure where the corresponding
    bytecode resides.


    Here is simple way of managing your files in Java:


    Put the code for a class, interface, enumeration, or annotation in a text file
    name is the name of the type and extension is **Java**. For example:


    ```

    // File Name : Car.java


    package vehicle;

    public class Car{

    // Class implementation.

    }

    ```


    Now, put the class in a directory where name reflects the name of the package
    to which class belongs:


    ```

    ...vehicle\Car.java

    ```


    +   * Class name -> vehicle.Car


    +   * Path name -> vehicle\Car.java (in windows)


    In general, a company uses its reversed domain name for its package names. Example:
    A company''s Internet domain name is apple.com, then all package names would start
    with com.apple. Each component of the package name corresponds to a subdirectory.


    Example: The company has a com.apple.computers package that contained a Dell.java
    source file, it would be contained in a series of subdirectories like this:


    ```

    ...com\apple\computers\Dell.java

    ```


