  md: '# The Hashtable


    The Hashtable class provides a means of organizing data based on some user-defined
    key structure.


    For example, in an address list hash table you can store and sort data on a key
    such as ZIP code rather than on a person''s name.


    The specific meaning of keys in regard to hashtables is totally dependent on the
    usage of the hashtable and the data it contains.


    Hashtable was part of the original java.util and is a concrete implementation
    of a Dictionary.


    However, Java 2 reintroduced Hashtable so that it also implements the Map interface.
    Thus, Hashtable is now integrated into the collections framework. It is similar
    to HashMap, but is synchronized.


    Like HashMap, Hashtable stores key/value pairs in a hashtable. When using a Hashtable,
    you specify an object that is used as a key, and the value that you linked to
    it. The key is then hashed, and the hashing code is used at the index at which
    the value is stored within the table.


    The Hashtable defines four constructors. The first version is the default constructor:


    ```

    Hashtable()

    ```


    The second version creates a hashtable that has an initial size specified by size:


    ```

    Hashtable(int size)

    ```


    The third version creates a hashtable that has an initial size specified by size
    and a fill ratio specified by fillRatio.


    This ratio must be between 0.0 and 1.0, and it determines how the hashtable can
    be filled before it is resized upward.


    ```

    Hashtable(int size,float fillRatio)

    ```


    The fourth version creates a hashtable that is initialized with the elements in
    m.

    The capacity of the hashtable is to twice the number of elements in m. The default
    load factor of 0.75 is used.


    ```

    Hashtable(Map m)

    ```


    Apart the methods defined by Map interface, Hashtable defines the following methods:


    | SN | Methods with Description |

    |---|---|

    | 1 | void clear()<br>Resets and empties the hashtable. |

    | 2 | Object clone()<br>Returns a duplicate of the invoking object. |

    | 3 | boolean contains(Object value)<br>Returns true if some value equals value
    within the hashtable. Returns false if the value isn''t found. |

    | 4 | boolean containsKey(Object key)<br>Returns true if some key equal to key
    exists within the hashtable. Returns false if the key isn''t |


