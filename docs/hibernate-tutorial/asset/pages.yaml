    # boolean:


    +   - boolean data type represents one bit of information.

    - There are only two possible values: true and false.

    - This data type is used for simple flags that track true/false conditions.

    - Default value is false.

    - Example: boolean one = true


    # char:


    +   - char data type is a single 16-bit Unicode character.

    - Minimum value is "\u0000" (or 0).

    - Maximum value is "ffff" (or 65,535 inclusive).

    - Char data type is used to store any character.

    - Example: char letterA = ''A''


    # Reference Data Types:


    +   - Reference variables are created using defined constructors of the classes.
    They are used to access objects. These variables are declared to be of a specific
    type that cannot be changed. For example, Employee, Puppy, etc.

    - Class objects and various types of array variables come under reference data
    type.

    - Default value of any reference variable is null.

    - A reference variable can be used to refer to any object of the declared type
    or any compatible type.

    - Example: Animal animal = new Animal("giraffe");


