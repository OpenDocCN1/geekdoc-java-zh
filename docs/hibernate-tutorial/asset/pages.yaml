    # The do...while Loop:


    A do...while loop is similar to a while loop, except that a do...while loop is
    guaranteed to execute at least once.


    # Syntax:


    The syntax of a do...while loop is:


    ```

    do

    {

    //Statements

    while(Boolean_expression);

    ```


    Notice that the Boolean expression appears at the end of the loop, so the statements
    in the loop execute before the Boolean is tested.


    If the Boolean expression is true, the flow of control jumps back up to do, and
    the statements in the loop execute again. This process repeats until the Boolean
    expression is false.


    # Example:


    ```

    public class Test{

    public static void main(String args[]){

    int x = 10;

    do{

    System.out.print("value of x : " + x);

    x++;

    System.out.print("\n");

    } while (x < 20);

    }\}

    ```


    This would produce the following result:


    ```

    value of x : 10

    value of x : 11

    value of x : 12

    value of x : 13

    ```


