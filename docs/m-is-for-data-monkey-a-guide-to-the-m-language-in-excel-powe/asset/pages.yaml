  md: '# Pivoting the Data


    When you have a list of repeating transaction numbers as you do in this example,
    you can pivot them. It will look a ugly at first, but you''ll see how incredible
    this truly is.


    +   - Select the Inserted Modulo -> Transform -> Pivot Column


    Now comes the tricky part: When you ask to pivot the column, the values in that
    column will be the column headers. Power Query then asks which values you want
    in the (or body) area of the pivoted data. The trick here is that pivoting is
    usually done to summarize the values, and you aren''t interested in doing that.
    You want your original values, so follow these steps:


