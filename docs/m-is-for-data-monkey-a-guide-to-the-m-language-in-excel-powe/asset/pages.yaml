    # Recursion


    One of the really interesting factors in this solution is that you didn''t need
    to drop the files directly into the root of the Begin folder in order to have
    them pulled into the Power query. Power queries recursion by default, meaning
    that it examines the folder and all its subfolders for files. This allows you
    to keep your data files specified by year, and the solution will still work.


    > If you go back and edit the query, refresh the preview and returning to the
    Source step, you will see the folder for each file is located in the Folder column.
    Using this, you could filter to include only the root folder or exclude subfolders
    that should need arise.


    # Preserving File Properties on Import


    Being all files in one shot is a huge time saver, but consider the following real-world
    scenario. A system set up to import lists of transactions to a file and name it
    based on the month and year (for example, Feb 2008.csv). The issue in this particular
    case is that the system was not set up to include a transaction date the instance,
    as all transactions were assumed to be the month-end date. The user who imported
    these files expected to import all transactions and place the appropriate month-end
    date on each row, and he had two years'' worth of files to process. Unfortunately,
    when combining files using the method outlined in this chapter for combining binaries,
    you lose access to the filenames, which were a key component in solving this solution.


    Does this mean you cant use Power Query to do the job? Not at all. You just need
    to use some different tricks, described next.


    # Setting Up the Import


    The initial steps in setting up the import are the same as outlined earlier in
    the chapter, with the only difference that you''ll now get a large list of files
    (since you have moved the extra folders into the Begin folder). Start by following
    these steps, which are the same ones you took earlier:


    +   * New Query -> From -> Folder

    * Select the Begin Folder

    * Right-click the Extension column -> Transform -> Lowercase

    * Select the Extension column''s filter arrow -> Text Filters -> Equals -> .csv'
