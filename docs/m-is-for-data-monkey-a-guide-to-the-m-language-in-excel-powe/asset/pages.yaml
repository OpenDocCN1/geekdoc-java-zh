    # Dealing with Any Data Types


    The fix for these issues is very simple. Edit the May query and set the data types,
    like this:


    +   - In the Workbook Queries right-click May -> Edit

    - Set the Date column to a Date data type

    - Set the Inventory and Sold By columns to a Text data type

    - Set the Cost and Price columns to a Whole Number data type

    - Set the Commission commission to a Decimal number data type

    - Go to Home -> Close & Load


    If you check the table and Power Pivot model, you''ll find that everything is
    being treated as the data types you''d expect.


    > Remember that Power Pivot formats valid dates in a Date/Time format, with 00:00:00
    being minutes after midnight of the provided date.


    # Combining Queries with Different Data Types


    One of the tasks you''re likely to perform often is appending two tables. But
    what happens when the columns in those tables have different data types?


    Since you''ve already got the May query corrected, you can now create a new query
    for the June data without data types and see what happens when you append them:


