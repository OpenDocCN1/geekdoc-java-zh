  md: '# M is for (Data) Monkey


    When you append one table to another, Power Query loads the data from the first
    query. It scans the header row of the second and all subsequent queries. If any
    of the headers are not present in the scans the results retrieved to date, Power
    Query adds the new column(s). It fills the record into into each column for date,
    filling any gaps with `null` values.


    In the scenario above, this means that the TranDate column is filled with null
    values in January, since the 2008 query doesn''t have a TranDate column.


    On the flip side, because the user forgot to rename the TranDate column, the Mar
    2008 query has no Date column. For this reason, the Date column is filled with
    null values for each March record, while the TranDate column holds values that
    should be in the Date column.


    The fix is to do the following:


    +   - Go to the Workbook queries -> right-click the Mar 2008 query -> Edit

    - Right-click the TranDate column -> Rename -> Date

    - Save the Mar 2008 query

    - Go to the Workbook queries -> right-click the Transactions query -> Edit


    As soon as you open the Transactions query, you will see that it has already fixed
    itself.


    # Implications of Append Queries


    The implications of able to append queries are numerous. Consider for a second
    that you have just reached out to three separate files, imported them, combined
    them into a single table, and built a PivotTable from that. One PivotTable from
    separate files.


    And when you want to refresh the solution, you simply need to go to Data -> Refresh
    All to refresh it. Power Query kicks off the refresh of the Transactions query,
    which kicks off the refresh of the three individual data tables to edit.


    Assume now that this solution was built on files that weren''t date specific but
    were instead Product 1, Product 2, and you''ve built a PivotTable against them.
    And then the next month comes along ... and the IT department replaces files with
    new transactions for each month.


    You save the new Product 1 file over the old one, and you do the same for Product
    2 and Product 3. Then you click Refresh All, and you''re done.


    Seriously, let sink in for a moment: You''re done.


    You work your time to a fraction of what was required in the previous process,
    and there is no risk of having accidentally delete over existing data, as Power
    Query doesn''t use copy and paste. it simply appends one to the other and removes
    the duplicated headers. You get the best of both speed and consistency in a single
    solution


    Note, however the process of appending queries is not specific to working with
    either CSV or TXT files. Say that you have tables of transactions such as the
    promotional gift certificates your company has issued this year. The author of
    workbook sets up 12 tables, one for each month of the year, stored on separate
    worksheets. You can see that in this case, you could easily consolidate those
    individual tables into one list for analysis.'
