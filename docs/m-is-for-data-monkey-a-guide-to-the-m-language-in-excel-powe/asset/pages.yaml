  md: 'At first glance, you might be tempted to transpose this data and fill John
    Thompson''s name down. There are other ways, and you have no idea how. Building
    a solution to this approach could be very difficult to maintain, so you need to
    find a better way.


    A more sensible approach in this case would be to add a new column and a formula
    in it—a formula that checks the Out column is a time and pulls the data in the
    column if the test fails. How do you do that?


    # Replicating Excel''s IFERROR( ) Function


    Try an experiment:


    +   - Right-click the Out column → Change Type → Time


    As you''d expect, the times all convert nicely, but the employee name returns
    an error:


    | Work Date | Out | Reg Hrs |

    |---|---|--|

    | Contingent Worker | Error | |

    | 3/3/2015 | 6:00 PM | 8.50 |

    | 3/4/2015 | 6:00 PM | 8.00 |


    Figure 222 John Thompson doesn''t have the time.


    This is entirely to be, but can you use your knowledge of here to solve the problem?
    What if you tested to be converting this column to a time type returns an error?
    If it did, and if not, you could return the time.


    You can use Query''s Time.From() to attempt to convert the data to a valid value.
    And based on your Excel knowledge, you''d kind of expect this to:


    ```

    =IFERROR(Time.From([]),null)

    ```


    Unfortunately, this will get you nothing but an error, as Power Query doesn''t
    recognize the IFERROR function. All is not lost, however, Power Query does have
    a function to do this, otherwise the syntax is:


    ```

    =try <operation> otherwise <alternate result>

    ```


    Just like Excel''s IFERROR(), Power Query''s try statement attempts to perform
    the operation performed. If it succeeds, result will be returned. If, however,
    the result is an error, then it will return the value (or other logic) specified
    in the otherwise clause.


    This means IFERROR() can be written in Power Query as:


    ```

    =try Time.From([]) otherwise null

    ```


    It should return for any row that contains an employee name in the Out column
    and the time for any row that has a valid time in. Give it a try:


    +   - Remove the Changed type step

    - Add Column → Add Custom Column

    - Leave the name in the formula below

    - Click OK


    The new column is added, and it is nicely to meet the current goal:


    | Work Date | Out | Reg Hrs | OT | Misc | Exp | Custom |

    |---|---|---|---|---|---|---||

    | Contingent Worker | John Thompson | | | | | null |

    | 3/3/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00 PM |

    | 3/4/2015 | 6:00 PM | 8.00 | 0.00 | 0.00 | 0.00 | 6:00 PM |

    | 3/5/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00 PM |

    | 3/6/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00 PM |

    | 3/7/2015 | 3:30 PM | 6.50 | 0.00 | 0.00 | 0.00 | 3:30 PM |

    | 3/10/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00 PM |


    Figure 223 Returning null instead of an error.'
