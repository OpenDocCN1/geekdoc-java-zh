  md: '# # Chapter 20 Understanding the M Language


    Now that you''ve explored the different objects you can use in Power Query, it
    is time to take a deeper look at the M language that is used to perform Power
    Query''s magic. Mastering M isn''t truly necessary, it will certainly add some
    more power to your arsenal and allow you to work with situations that others can''t.


    # ## Query Structure


    To get started, you''ll pull that into Power Query and examine the code that is
    working behind the scenes:


    +   - Open Ch20 Examples\Unappearing M.xlsx -> select any cell in the Sales table

    - Create a new query -> From Table

    - Delete the Changed Type step


    Your query should look like this:


    | Date | Inventory item | Employ... | Quantity | Price |

    |---|---|---|---|-|

    | 1 | 5/10/2014 12:00:00 | Lovable | 1 | 45 |

    | 2 | 5/29/2014 12:00:00 | Taltik Parrot | 2 | 32 |

    | 3 | 5/24/2014 12:00:00 | Lovable Kitten | 3 | 45 |

    | 4 | 5/20/2014 12:00:00 | Adorable Kitty Cat | 2 | 35 |

    | 5 | 5/28/2014 12:00:00 | Lovable Kitten | 3 | 39 |

    | 6 | 5/23/2014 12:00:00 | Sleepy Giraffe | 3 | 39 |

    | 7 | 5/13/2014 12:00:00 | American Crocodile | 5 | 35 |


    Figure 255 The initial query is ready to examine.


    # ## Query Form


    So far, everything you''ve seen has driven through the user interface. You''ve
    seen Power Query act as a macro recorder, and you have been able to interact with
    it via the Applied Steps box. You''ve also had some limited interaction via the
    formula bar. What you haven''t seen yet is the programming language that resides
    underneath the covers of this incredible tool. It''s time to change that.


    +   - Go to Home -> Advanced Editor, and it contains the code for the entire query
    created to date:


    The Advanced Editor window appears, and


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_182_0.png)


    Figure 256 Power Query''s Advanced Editor.'
