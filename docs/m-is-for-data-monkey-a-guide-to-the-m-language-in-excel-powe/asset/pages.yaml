    # # Caveats and Frustrations with the Web Experience


    The Web experience is certainly a weakness in Power Query''s otherwise incredible
    arsenal of tools. There are several things that we hope could be improved in this
    area, and there are things to watch out for as you develop solutions based on
    web data.


    None of the factors discussed below should be seen as reasons not to develop solutions
    based on website data. Instead, they are intended to make you go into this area
    with both eyes open, seeing not only the benefits but also the risks of relying
    on web-data you don''t control.


    # ## The Collecting Data Experience


    Building solutions based web data can be a painful experience in Power Query.
    If there are table tags in the HTML code, everything works well. If not, however,
    all bets are off.


    Compare this to our Classic Data -> Web experience, which kicks off a web browser
    that allows you to navigate the web data you''re looking for. Power Query does
    not give you this facility but leaves you to navigate web pages using a different
    browser.


    In this may not seem like a big deal, except for the issue that it is very difficult
    to tell if the data you are seeing in the browser is an easy-to-use tool or without
    looking at the code.


    The challenge here is that you''ll grab the promising URL, drop it in the Power
    Query interface, and then spend a huge amount of time expanding columns, each
    route down the HTML tags, trying to find the data you''re looking for. Even if
    you understand the web debugging tools, it still doesn''t make the job easy. Because
    Excel pros are not web developers, this is really an unnecessary burden that is
    being placed upon them.'
  merge: -1
