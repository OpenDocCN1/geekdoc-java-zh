    Consider the impact here where you''ve been collecting these emails for the better
    part of two years and never reading them. Suddenly they have business value. These
    emails can be used as part of an email dashboard to review the profitability of
    one of the income streams that supports your website.


    # Best Practices for Exchange Sources


    There are two main issues to consider when building a solution against a Microsoft
    Exchange service: portability and performance.


    # Portability


    The first thing you need to take into account is how long this solution is intended
    to survive and whether we will need to pass it to another user. Why? Because you
    are targeting your email account. Building a solution against your email account
    locks it down so you can only use it. It can''t be shared, and it''s difficult
    to port to other layers, as the source files for the solution (emails, attachments)
    are in your inbox.


    The reality is that if you leave the organization, voluntarily or otherwise, the
    solution will most likely become useless to others. If you stay and get promoted,
    you''ll be stuck updating the solution that is bound to your email account.


    If you intend to use the solution for a longer period, or it serves other users,
    it might be best to figure out how to extract the data from your inbox first and
    build the solution against that source. For attachments, that is fairly easy:
    Just save them to a folder. For the email itself, it may not be practical, and
    maybe Power Query is the method to extract the emails and archive them in another
    format. Regardless, you should definitely give some thought to a succession plan
    for yours once it starts to get reused.


    # Performance


    The other major consideration you should take into account is performance, including
    speed.'
  merge: -1
  pgno: 124
