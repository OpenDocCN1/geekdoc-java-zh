  md: '# Replicating Excel''s FIND() Function


    By now you are wondering what the big deal is. It is obvious that the Power Query
    team changed the way we reference formulas. In fact, the team have injected some
    logic to query all the formulas together, as they all start with Text.FunctionName


    But the changes are a bit bigger. Let''s take a look at replicating Excel''s FIND()
    function.


    The following table is using FIND() to find a lowercase ''o'' in the words. Naturally,
    that works in some cases, and it returns errors in the case of words that don''t
    contain the specified character.


