  md: '# The Benefits and Dangers of Black Magic


    The true wizards of Excel use many different techniques to make their happen—sometimes
    on their own and in combination. These types of magic include:


    +   - **Excel formulas**–These are the first techniques that the magician will
    often reach to, leveraging knowledge of formulas functions such as VLOOKUP(),
    INDEX(), MATCH(), OFFSET(), LEFT(), LEN(), TRIM(), CLEAN()), and many formulas
    are then used by most Excel users, the complexity of these formulas varies by
    the user''s experience and comfort.

    - **Basic Visual for Applications (VBA)**–This powerful language can help you
    create and dynamic transformations for your data. VBA techniques need to be used
    by advanced users to ensure the discipline to truly master them.

    - **SQL statements**–SQL is another powerful language for manipulating data, and
    it can be extremely useful for selecting, sorting, grouping, and transforming.
    The reality is, that language is also typically used by advanced users, even many
    Pros don''t know where to get started with it. This language is often thought
    of being the sole domain of database professionals, every Pro should spend some
    time in learning it.


    All these tools have something in common: For many years, they were essentially
    the only tools available for cleaning and transforming data into something. Despite
    their usefulness, many of these tools also have two serious weaknesses: They require
    time to build solutions and time to master the techniques.


    While it''s true that savvy magicians can use these tools to build solutions to
    automate and import raw data in a clean format, this takes years of learning advanced
    languages as well as a significant amount of time developing, testing, and maintaining
    the solutions. Depending on the complexity of the solutions built, for a minor
    change in the import format or extending them to embrace another source could
    be horrendous.


    One hidden danger of having a true wizard in a company is that the person may
    build an incredible solution that works until he or she leaves the company. At
    some point, others at the company realize that they don''t understand the solution
    and have anyone to fix it when it eventually becomes


    On the flip side, many people with this data cleanup didn''t have time or opportunity
    to learn these advanced techniques. And while we could say that maybe they''re
    better off not having a massive system collapse without anyone to fix it, they
    waste hours, days, weeks, months, and years of time and performing repetitive
    data cleanup on a regular basis.


    Take a moment and think about how many hours are consumed on a monthly basis in
    your company performing repetitive data import and cleanup tasks in Excel. Multiply
    these hours by the average wage rate in your company ... by the number of companies
    in your industry worldwide and ... you get the idea. The cost of productivity
    in this area is staggering.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_11_0.png)'
  merge: -1
