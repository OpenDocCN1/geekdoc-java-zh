    # # Data Model Generators in Excel 2010 and 2013


    Because Power Query is a separate add-in for Excel 2010 and 2013, there are some
    very dangerous idiosyncras that you need to be aware of with Power Query. Fortunately,
    these have been solved with Excel 2016 and for people using Excel 2013, but if
    you are developing in earlier versions, you either need to go to "all" with Power
    Query or avoid using it.


    # # To Corrupt Your Model


    Corrupting your model is deadly, and the worst part is that you might not realize
