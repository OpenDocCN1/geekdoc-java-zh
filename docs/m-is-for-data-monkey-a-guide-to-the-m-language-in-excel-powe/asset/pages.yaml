  md: '# Chapter 25 Query Organization


    With all the work you''ve done learning Power Query, you wouldn''t expect to suddenly
    get hit by an error when trying to merge two tables. Unfortunately, this is a
    possibility if the tables come from different data sources.


    # The Formula.Firewall Error


    One of the things you haven''t seen so far in this book is the dreaded Formula.Firewall
    error, but it can be quite a shock when it hits you. And while there are strategies
    for avoiding it, it is better if you know upfront what causes this nasty error
    message to appear.


    # Triggering the Formula.Firewall Error


    In the timesheet used through several chapters, recall that you built a fairly
    robust solution. The solution file is saved in a specific location, and the data
    files are stored in the Sources subfolder, which hangs off the solution directory.
    You''ve repurposed code to import a single table, turning it into a function and
    leveraging it to preprocess all the files in the Sources file directory so you
    can combine them afterward. The data lands in an Excel worksheet (or the Power
    Pivot Data Model) if you were inclined to push it there. What could go wrong?


    A scope change. That''s what. Suppose your manager tells you she wants the department
    for each employee merged with the data set.


    You''ve got the employee records stored in another Excel file with each employee''s
    name and department. You know you can import from Excel files, and you know how
    to merge data sets together. How hard can it be? Try to:


    +   - Open Ch25 Examples\Query Organization.xlsx

    - Create a new query -> From -> From Excel Workbook

    - Navigate to Ch25 Examples\Departments.xlsx

    - Select the EmployeeDepts table


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_230_0.png)


    This table looks pretty good. In fact, it looks so good, you just loading it to
    a connection right away, as it really doesn''t need any modification at:


    +   - Click the arrow on the Load option -> Load To... -> Only Create Connection


    You get a nice new EmployeeDepts query in your Workbook Queries pane, and all
    is looking good so far.'
  merge: -1
