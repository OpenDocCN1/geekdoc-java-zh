- img_proc: true
  md: '# Chapter 12 Importing Web Data


    Ideally, this experience should kick off a web browser, let you navigate to the
    page and select the data range you''d like to import, and then do the work of
    breaking the HTML document to do for you. Until that happens, importing data that
    is not formatted in a tabular fashion will continue to be difficult.


    # Data Integrity


    Another major concern with web data is the source and integrity of the data. Be
    cautious of connecting and importing data from sites such as Wikipedia or other
    sites that you don''t have a business relationship with. While we love to use
    Wikipedia as a great example, the reality is that relying on this site can be
    dangerous. The content is curated, but it can also be changed by users. Although
    the site makes a great effort to curate data, the information there is far from
    perfect and may not be entirely factual.


    The other issue is how readily the data is updated. Imagine investing in building
    a complicated query against a web page, only to find out that the owner/curator
    doesn''t update it on a timely basis. You need to be assured that when you refresh
    the data, the routine isn''t merely refreshing out-of-date data but rather that''s
    refreshing current data. You''re likely to invest a significant amount of time
    and make business decisions assuming that the last refresh you pulled the most
    recent data.


    # Solution Stability


    There is another real concern when building your business logic against web sources
    that you do not own or control. Like every other company that provides these feeds
    and pages wants to better serve its customers. Unfortunately for us, that doesn''t
    mean that they are interested in putting out a consistent experience that never
    changes. In fact, the opposite is true. They are also trying to update things,
    changing the web pages to add new bells or whistles, or make the sites more attractive
    to the human eye. This has the very real side effect of blowing queries apart,
    usually without notice, and ofentimes when you don''t have time to fix them.'
