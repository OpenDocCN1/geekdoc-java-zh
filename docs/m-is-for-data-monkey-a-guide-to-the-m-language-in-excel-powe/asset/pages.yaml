  md: "# Refreshing All Power Query Queries\n\nIn order to refresh all Power Queries\
    \ in a workbook, you need to use a slightly different block of code.\nThe following\
    \ macro will look through all connections in the workbook and identify whether\
    \ they are created by Power Query (and it identifies all others):\n\n```\nPublic\
    \ Sub UpdatePowerQueriesOnly()\n    Dim Lest As Long, cn As WorkbookConnection\n\
    \    On Error Resume Next\n    For Each cn In ThisWorkbook.Connections\n     \
    \   LTest = InStr(1, cn.OLEDB.Connection, \n            \"Provider=Microsoft.Mashup.OleDb.1\"\
    )\n        If Err.Number <> 0 Then\n            Err.Clear\n            Exit For\n\
    \        End If\n        If LTest > 0 Then cn.Refresh\n    Next cn\nEnd Sub\n\
    ```\n\nThis macro can be stored in the same workbook as the one created in the\
    \ previous section, or it can replace the previous code (which you might need\
    \ to relink your to the new macro instead).\n\n> Be aware that the code above\
    \ will not necessarily refresh the queries in the order which you need to be refreshed,\
    \ as Excel refreshes queries in alphabetical order. Fortunately, you can change\
    \ the name of the queries by going to Data → Connections → Properties and modifying\
    \ the connection name. You can rename each query into an order as 01-Jan-2008,\
    \ 02-Feb-2008, 03-Mar-2008, 99-Transactions. By doing this, you can ensure that\
    \ a Power query runs in the correct order.\n\n# Automating Refresh via Third-Party\
    \ Add-ins\n\nWhile VBA works on desktop solutions, it is a total nonstarter if\
    \ you want solutions to the web, whereas to SharePoint, Office 365, or Power BI.\
    \ For this reason, the team at power-planner.com built an add-in for Power Query\
    \ to help solve these issues.\n\nHere's how the company describes the product\
    \ in its works:\n\nPower Update is a brand-new software utility designed by the\
    \ group as a \"companion\" to Power Pivot, Power Query, and it refreshes freely,\
    \ regardless of data sources used,\n\nIt allows you to schedule ANY Power Pivot\
    \ / Power BI workbook for refresh, and automatically deploys/publishing the result\
    \ to a destination of choice: SharePoint (both on-premises and cloud), OneDrive,\
    \ Power BI online, file network shares, and well as Tabular SS servers.\n\nEven\
    \ paired with O365, Power BI, or other cloud server, Power Update does not require\
    \ the configuration of gateways, VPNs, or firewalls. Power Update provides auto-refresh\
    \ of Power Query worksheets as well as loading Power Query and Pivot data into\
    \ SQL Server, allowing the industry to use PQ in \"on-premises\" production environments.\n\
    \nFinally, Power Update is restricted to \"once a day\" refresh, or it is limited\
