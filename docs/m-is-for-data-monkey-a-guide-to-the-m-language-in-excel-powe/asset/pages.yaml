  md: '# # Chapter 16 Automating Refreshing


    As you build more and more solutions that leverage Power Query, and you realize
    how much time it saves you, you''re bound to become hungry for more automation
    in your life. You can simply right-click a table while it comes from Power Query,
    even that will begin to feel so... manual. Wouldn''t it be better if you could
    schedule an update, in the order in which things update?


    # ## Options for Automating Refreshing


    You can use a few different methods of automating the refreshing of Power Query
    solutions:


    +   * Refresh when the workbook is opened

    * Refresh every x minutes

    * Refresh connection on demand via VBA

    * Refresh all connections on demand via VBA

    * Schedule refreshes via a third-party add-in


    Each works differently and has its own benefits and drawbacks, as you''ll see
    in this chapter.


    # ## Scheduling Refreshes Without Code


    The first two methods for automating refresh that are both explored through the
    user interface and don''t require any VBA code whatsoever. They can be configured
    on a connection-by-connection basis, and you can even automate the refresh to
    Power Pivot if desired. Each of these connections is controlled by navigating
    to the Workbook Connections dialog in Excel (not Power Query):


    +   * Go to Data → Connections → select your query → Properties


    This launches the following dialog, where you can check the box to update the
    query when the file is opened:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_142_0.png)


    Figure 195 Setting connection options.


    # ## Background Refreshing


    In the Connection Properties dialog, notice that the Enable Background Refresh
    is selected by default. This allows you to specify whether you''d like to work
    in Excel while the data refreshes. If you uncheck this, you could potentially
    decrease the amount of time it takes to refresh your solution, but you''ll also
    lock out the user interface, which means you won''t be able to do other things
    until it is complete.


    If you want to prevent users from working the data until it is fully refreshed,
    you want to disable this setting. If you need to do other things while you wait,
    however, this setting is best left alone.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Refreshing Every x Minutes


    The next setting in the Connection Properties dialog lets you use Excel to refresh
    the Power query every minutes. When you check the box, you can set how often the
    data to be refreshed. This setting is fantastic if you''re pulling data from a
    web source that is constantly changing or if you are getting a database that is
    being updated regularly, as assures that your data is always up-to-date while
    in the line.


    Keep in mind that the workbook needs to be in order for this refresh to occur.
    And if you''re going to be scheduling frequent refreshes while you are actively
    in the workbook, you will want to make sure the Background Refresh is checked.


    > Valid values for this setting run from 1 to 32,767, which means you can refresh
    once every up to once 22.75 days.


    # Refreshing When the Workbook is Opened


    This selection in the Connection Properties dialog actually allows you to specify
    two components:


    +   - Refreshing the data when opening the file

    - Removing the data before


    The first one is rather self-explanatory, and checking the box for this will change
    the behavior of the workbook do exactly what it is: refresh the data each time
    you open the file. This helps ensure that your data is always up-to-date when
    you start with the workbook.


    If you have a number of data sources, or if the data takes a significant amount
    of time to refresh, then it may be a good idea to leave the Enable Background
    Refresh setting enabled so that you can use the workbook while the refresh is
    occurring.


    The second choice in this section controls whether to save the data in the workbook
    or only the query definition. This is a security setting, as assures that your
    users have access to the data source when they open the workbook. If they don''t,
    they''ll be greeted by a blank table, as the connection cannot be. If they do,
    the query will run and bring in the data.


    > There is currently a bug in all versions of Excel that affects the last option.
    If you open Excel and then open the workbook, the query will refresh, and the
    data will be loaded. If you then close the workbook and reopen it (without closing
    Excel), the data will not refresh automatically. Closing Excel fixes the problem.


    # Automating Query Refresh with VBA


    The options described in this chapter allow you to refresh Power queries with
    no macro security warnings at all. In addition, workbooks using the options described
    are easier to export to Power BI, as they don''t cause any issues.


    If you''re working in a desktop Excel instance, however, there are times when
    you might want to give user an easy-to-use and obvious way to update your Power
    solutions. This can be accomplished via VBA macros.


    # Refreshing a Single Connection


    You can build a macro to refresh a single Power Query connection. To see how this,
    open Ch16 Examples.Refreshing.xlsm and navigate to the Transactions worksheet.


    On this worksheet you''ll find a Transactions table, as well as a PivotTable.
    Say that you''d like to create a macro to update the Transactions table and then
    the PivotTable.


    To do this, you can record a simple macro by using the following steps:


    +   - Navigate to the Developer tab


    > If you don''t see the Developer tab, right-click any tab on the ribbon and choose
    Customize Ribbon. Check the box on the right-hand side, next to Developer, and
    then click OK.


    +   - In the upper-left, click Record Macro'
