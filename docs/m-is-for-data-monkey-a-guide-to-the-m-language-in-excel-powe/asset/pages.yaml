    that you need the index number of each row to do. So you can reach to the index
    column:


    +   * Go to Add Column -> Add Index Column -> From 0


    Now you are going to rename this step (not the column) in the Applied Steps box:


    +   * Right-click the Added Index step -> Rename -> AddedIndex (without a space)


    The query now looks as follows:


    | Date | Inventory Item | Emp... | Quan... | Price | Index |

    |---|---|---|---|---|-|

    | 1 | 5/10/2014 Lovable Kitten | | 1 | 45 | 0 |

    | 2 | 5/9/2014 Talkative Parrot | | 2 | 32 | 1 |

