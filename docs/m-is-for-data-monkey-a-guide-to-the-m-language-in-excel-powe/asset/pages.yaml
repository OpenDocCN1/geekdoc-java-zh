    # Transposing Stacked Tables


    Another complicated transformation scenario is one where the details for a transaction
    are stacked vertically on top of each other, with rows swapping the transactions:


    | 10/14/2014 | | | |

    |---|---|---|---|n| Outback Steakhouse | Date Vendor Amount |

    | | 34.98 | 10/14/2014 Outback Steakhouse 34.98 |

    | 10/16/2014 | | | |

    | Earl''s Restaurant | 10/16/2014 Earl''s Restaurant 89.98 |

    | 89.98 | | | |


    Figure 187 Data where the transpose operation is necessary.


    In this scenario, you essentially need to transpose each block of data, then the
    stacks into one table. The however, is that Power Query doesn''t have an out-of-the-box
    command to do this. If you transpose the table, you''ll get one row of data and
    many more columns rather than record transposed individually the way you need.


    Again, getting what you want is entirely possible, but it requires a little creativity
    and some tricks.


    # Loading the Data


    In this example, you will transpose the list of credit card transactions found
    in Ch15 Examples\Transpose Stack Tables.xlsx:


    | 1 Transactions |

    |---||

    | 2 10/26/2015 |

    | 3 City of Vancouver |

    | 4 123456 |

    | 5 34.98 |

    | 16 9272345 |

    | 17 89.98 |


    Figure 188 A stacked list of transactions in a single column.'
