  md: '# 10 Query Loading Destinations


    While the majority of the examples in this book to point have focus on landing
    the Power Query output into Excel tables, which is certainly not the only option
    for where to place Power Query data.


    In fact, you have three different loading destination options, some of which can
    be used in combination:


    +   - Excel tables

    - Connection-only queries

    - The Power Pivot Data Model


    > The ability to load directly to the Power Pivot Data Model is not supported
    in Excel 2010. Having said that, just because it isn''t supported doesn''t mean
    that it can''t be. You''ll find out how to do it in this chapter.


    # Query Loading Methods


    Each of the different loading options has different benefits, drawbacks, and caveats
    associated with it, which we will explore here.


    # Excel Tables


    Excel tables are the default loading experience for Power queries. When you simply
    click Close & Load in the Power Query interface, Excel creates a new table on
    new worksheet to hold the query''s output. The newly created table inherits the
    name of the query, with a few modifications:


    +   - Any spaces are converted to underscores.

    - If the query name is already used for an existing table or range name, it will
    then have an #_ appended to the end.


    > One case to be aware of is that you should never give a query the same name
    as an existing Excel function. Excel tries to interpret names before functions,
    so having a table named something like ROUND or LEFT will cause these functions
    to return #N/A errors.


    If you are reading data from a table and making no manipulations to it, the default
    option gives you a connection to the data in Power Query, but it also duplicates
    the data on another worksheet, increasing the file size and memory overhead to
    use it.


    # Connection-Only Queries


    As you saw in Chapter 9, connection-only queries are set to avoid loading data
    into a worksheet, but they still allow you to connect to the data via Power Query
    queries.


    This option is a fantastic one that gets used frequently in practice, as the queries
    used in this fashion are loaded on demand only when called by a subsequent query.
    They don''t load any directly to the worksheet, they also don''t increase the
    file size or memory overhead to store the query output.


    > Loading to a table and creating a connection-only query are mutually exclusive
    options. You can choose one or the other.


    For example, when you open Ch10Examples\LoadDestinations.xlsx, you''ll find that
    the workbook contains two tables of items for a store. The analyst wants to merge
    these tables together for use in a business intelligence solution. How does she?


    She could load each table into a query, load the queries into worksheets, and
    create an append query that would also be loaded into a worksheet. She essentially
    create three copies of the data, which seems a bit ridiculous.


    A better alternative is to use connection-only queries to create pointers to the
    original data tables and create an append query against those and load the output
    in a table. The final table would not be an extra duplication step in the middle.


    To set up this, follow the following steps:


    +   - Ch10Examples\LoadDestinations.xlsx'
