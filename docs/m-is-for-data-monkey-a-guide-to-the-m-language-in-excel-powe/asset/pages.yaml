    - Remove the Changed type step

    - Rename the query June

    - Go to Home -> Close & Load To... -> Only Create Connection


    # Appending Defined to Any Data Types


    Now you can append the two queries:


    +   - In the Workbook Queries right-click the June query -> Append

    - Select the May query -> OK


    At this point, if you check the data type in the Date column, you''ll see that
    it is Any:'
