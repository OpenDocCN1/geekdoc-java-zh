  md: '# Chapter 15 Transposing and Unpivoting Complex Data


    Before you do anything else, you need to get the data into Power Query:


    +   - Select A1 -> create a new query -> From table

    - Extend the table boundaries to cover A1:A17


    The data is now ready for you, and it''s time to figure out how to approach it.


    # Creating a Modulo Column


    Rather than transpose the records at this point, you''re going to take a different
    approach. You''re going to number the records, and you''re going to do it twice.
    To make this happen:


    +   - Go to Column -> Add Index Column -> From 0


    At this point, you have a numeric list of the transactions, starting from 0:


    | | Index | |

    |---|---|-|

    | 1 | 10/27/2015 12:00:00 AM | 0 |

    | 2 | City of Vancouver | 1 |

    | 3 | 123456 | 2 |

    | 4 | 34.98 | 3 |

    | 5 | null | 4 |

    | 6 | null | 5 |

    | 7 | 10/27/2015 12:00:00 AM | 6 |

    | 8 | Earl''s Restaurant | 7 |

    | 9 | 123456 | 8 |


    Figure 18 You now have a number indicating the numeric data in the file. What
    we actually want is a number as it corresponds to each line of the transaction.
    In other words, the vendor should always be 0, the vendor 1, and so on. To get
    that, you need to add a modulo column.


    Before you do this, you need a key piece of information from the table: You need
    to know the value in the first row of the second record. In this case, the value
    you are looking for is 6, as shown in the index column (Power Query starts counting
    from 0, not 1). That number is going to be the factor for the modulo calculation.


    The modulo essentially takes a value, subtracts the closest multiple of the factor
    from the value provided, and returns the remainder. So if the value is 8, the
    modulo subtracts 6 and returns the remainder, which is 2. Try it out:


    +   - Select the index column

    - Go to Column -> Number -> Standard -> Modulo -> 6


    You now have a list of the transaction line numbers!


    | | Index | Inserted Module |

    |---|---|-|

    | 1 | 10/27/2015 12:00:00 AM | 0 |

    | 2 | City of Vancouver | 1 |

    | 3 | 123456 | 2 |

    | 4 | 34.98 | 3 |

    | 5 | null | 4 |

    | 6 | null | 5 |

    | 7 | 10/27/2015 12:00:00 AM | 0 |

    | 8 | Earl''s Restaurant | 1 |

    | 9 | 123456 | 2 |


    Figure 190 You now have a transaction line number for each item.


    This looks interesting, but why set this up in the first place? The answer lies
    in the solution to this data set.'
