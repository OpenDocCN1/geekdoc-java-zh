  md: '# Chapter 8 Importing from Databases


    > The credentials you use are cached in a file that resides within your local
    user settings. This means that the username and password do not (and cannot currently
    be set to) travel with the solution when it is emailed or even opened by another
    user. This security feature ensures that each user has the proper credentials
    to access and refresh the data.


    # Managing Connections


    If you mistype the name of your connection, database, user ID, or password need
    to modify anything, you can do so by going through the following steps:


    +   * Excel Data -> New Query -> Data Source Settings

    * Excel 2010/2013: Power Query -> Settings -> Data Source Settings


    This will launch you into the Data Source Settings box:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_76_0.png)


    This dialog can become very crowded over time, so it''s very handy that you can
    filter it by using the search pane. In the image above, we''ve filtered to find
    the term powerquery because we know that it was part of the URL to the Azure database.


    From here you have two options:


    +   * **Delete the connection**—This is a good option if you want to remove the
    data source from the cached connections, forcing you to re-authenticate the next
    time you connect to it. This is also a great option if you have messed up the
    initial connection and want to start over.

    * **Edit the connection**—This is a good option if you just need to update the
    username and password if you want to change the connection privacy levels for
    some reason.


    You can click the Edit button to see the connection type:'
