  md: '# Chapter 3 Basic Append Operations


    4 COLUMNS, 999+ ROWS


    The reason for this behavior is that Power Query can be used to handle large data
    sets. Imagine for a second that you want to connect to a data that has 5 million
    rows, but you only want to pull in the records for department 150. The Power Query
    team describes "looking at the first inch of water in the fire hose," under the
    assumption that the preview gives you enough information to determine the structure
    of the data. You then make your transformations on the preview data and create
    a pattern. At time, Power Query processes this pattern against the data, pulling
    in only the records it needs to give you output is much more efficient than loading
    all the data to the workbook and then processing every row and column. But if
    you can''t see all the data, how do you know it worked?


    The answer is to finalize the query. Here is how:


    +   - Change the name of the query to Transactions

    - Go to Home → Close & Load


    A new table is created in the worksheet, and you see some key information in the
    Workbook Queries pane:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_38_0.png)


    Figure 39 The Workbook Queries pane shows that the record counts match.

    Still, you shouldn''t just believe that everything has worked. You can create
    a PivotTable to make sure Excel isn''t lying to you:


    +   - Select each cell in the Transactions table → Insert → PivotTable

    - Place the PivotTable in cell F2 of the current worksheet

    - Drag Amount to the Values area

    - Drag Date to the Rows area


    If you''re using Excel 2010 or 2013, you will also need to take these steps:


    +   - Right-click cell F3 → Group by Days and Months → OK

    - Right-click cell F3 → Expand Collapse → Collapse Entire Field


    You end up with a PivotTable that shows both tables are now consolidated into:


    | Date | Account | Dept | Amount | | Row Labels | Sum of Amount |

    |---|---|---|---|---|---||

    | 1 | 1/2/2008 | 61510 | 150 | -26.03 | | |

    | 2 | 1/2/2008 | 61520 | 150 | -55.07 | Jan | 89790.94 |

    | 3 | 1/2/2008 | 61530 | 150 | -10.6 | Feb | 56211.14 |

    | 4 | 1/2/2008 | 61540 | 150 | | Grand Total | 146002.08 |

    | 5 | 1/2/2008 | 61550 | 150 | -48.02 | | |

    | 6 | 1/2/2008 | 61560 | 150 | -13.5 | | |


    Figure 40 January and February transactions are now in one PivotTable.'
