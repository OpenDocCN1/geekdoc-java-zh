    # # Converting the Query into a Function


    Next, you you need to convert the query into a function. This involves three steps:


    +   1. Come with a name for the variable that will hold the data you want to replace.

    2. Edit the query and place the text at the beginning:

    `variable_name`=>

    3. Scan your query for the data you want to replace and overwrite it with the
    variable name.


    It''s a good idea to come up with a variable name that is somewhat descriptive
    of the data it will hold, as this helps self-document your M code. The goal here
    is to convert the single-use example into a function where you can dynamically
    update the file path, so you should use something like filepath to describe what
    it holds (Ultimately, you get to choose the name. Make sure it doesn''t contain
    any spaces or special characters.)


    > Windows has a set of rules about which characters are allowed for file names
    and paths. Power Query uses slightly different rules, however. For example, if
    you set up a folder such as D:\Data Monkey, it can be read by Windows, but Power
    Query will choke on it, as Power Query will not allow a file path to start with
    the ! character.


    Now that you''ve edited the Timesheet query your variable name, edit the query
    to turn it into a function:


    +   * Edit the Timesheet query right -> Home -> Advanced Editor

    * Place your cursor right in front of the let statement

    * Type the following:

    `(filepath)==>

    * Press Enter


    Your code should now start like this:'
