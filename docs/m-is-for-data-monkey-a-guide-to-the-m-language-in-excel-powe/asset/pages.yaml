    # The Issue


    The challenge here is that you need to load and unpivot the Recap table (rows
    32:36). Using Power Query is the easiest way to unpivot data, you obviously want
    to use, but there are some challenges in getting the data into Power Query in
    the first place:


    +   - Loading the data via a table would cause the column headers to be locked
    in, and you would lose the dynamic effect.

    - Loading the data using a named range would allow the column headers to change
    in the worksheet but would potentially break any hardcoded steps in the query
    when the dates change.


    The workaround in this case is to create a translation table and merge it back
    into the query.


    # Creating a Translation Table


    The translation table for this example needs to be come up with a logical way
    to link a static column header to the current dates. Using the notation CYMx (Current
    Year, Month x), you can build a table to hold these dates. Create the table as
    follows:


    +   - Enter in cell A40: Period

    - Enter in cell B40: Date

    - Enter in cell A41: CYM1

    - Extend A41 to A52 so that reads CYM2, CYM3, and so on

    - Select A40:B52 -> Home -> Format as Table'
