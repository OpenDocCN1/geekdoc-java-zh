    | 01/05/2006 | 4,895.61 | G0004 | Source |

    | 01/06/2006 | 11,551.06 | G0005 | Removed Top Rows |

    | 01/07/2006 | 141.75 | G0006 | Trimmed |

    | 01/08/2006 | 4,662.86 | G0007 | Cleaned |

    | 01/09/2006 | 11,001.21 | G0008 | Split Column by Position |

    | 01/10/2006 | 135.00 | G0009 | Changed Type |

    | 01/11/2006 | 3,276.19 | G0010 | |


    Figure 88 A more inspiring view of your data.


    It is also worth mentioning that splitting columns is tricky. If the date is inconsistent,
    you can choose to split once from the left/right side. This allows you much more
    granular control, on a column-by-column basis.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_68_0.png)'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'You can now make more changes. Since the Changed Type step just clears the
    columns as text (which they won''t be when you''re done), you can remove the Changed
    Type step because it''s irrelevant. You can then promote the first row to column
    headers. Follow these steps:


    +   - Remove the Changed Type

    - Go to the Transform tab -> First Row as Headers


    # # The Beauty of Errors in Power Query


    The data is now starting to look somewhat clean, even if you''d like to change
    some of the column headers as you go along. At this point, it''s typically recommended
    that you work from left to right, cleaning up as much of the columnar data as
    you can and making sure it''s valid.


    If you scroll down, you will find a lot of garbage in your data, mostly from the
    repeating pages and sections that were included in the document. The first block
    of these issues occurs at row 40 and introduces a bunch of ugliness:


    | Tran Date | Tran Amount | Source |

    |---|---|---|n| 38 01/31/2006 | 11612.20 | GI0038 |

    | 39 01/31/2006 | 122.14 | GI0039 |

    | 40 | null | null |

    | 41 Feb 2006 | null | null |

    | 42 123-03 | Purchases | null |

    | 43 | null | null |

    | 44 Tran Date | Tran Amount | Source |

    | 45 02/01/2006 | 4,395.03 | GI0040 |

    | 46 | null | null |

    | 47 March 20, 2009 | 2:08pm | Pg 2 |

    | 48 XYZ Company Ltd | | |

    | 49 Detailed Genera | Ledger with N | et Change for A ug 2004 to Mar |


    Figure 89 Incorrect rows mix with real data.


    The question is how to deal with this. Some are dates, some are text, and some
    are errors. Now try this:


    +   - Right-click the Tran Date column -> Change Type -> Using Locale -> Date
    -> English (US) -> OK


    The result is a bunch of errors in the Tran column:


    | Tran Date | Tran Amount | Source |

    |---|---|---|n| 38 1/30/2006 | 11612.20 | GI0038 |

    | 39 1/30/2006 | 122.14 | GI0039 |

    | 40 | null | null |

    | 41 2/1/2006 | null | null |

    | 42 3/1/0123 | Purchases | null |

    | 43 | null | null |

    | 44 Error | Tran Amount | Source |

    | 45 2/1/2006 | 4,395.03 | GI0040 |

    | 46 | null | null |

    | 47 | null | null |

    | 48 Error | | |

    | 49 Error | 3/20/2009 2:08pm | Pg 2 |

    | 50 | Ledger with N | et Change for A ug 2004 to Mar |


    Figure 90 Errors that result from converting to dates.


    Unlike any other program, errors are truly exciting in Power Query. They are exciting
