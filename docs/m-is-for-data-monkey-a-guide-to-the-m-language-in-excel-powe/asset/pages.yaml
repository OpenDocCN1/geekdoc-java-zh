    # Solution Impact


    The ramifications of the process described here are rather extensive. Even if
    you build a single-use scenario,

    y can now convert it to be consistently applied across multiple files. That is
    a huge benefit that previ-

    ously unavailable to Excel pros, at least in easy-to-deploy fashion


    You can deal with situations where your data footprint expands across multiple
    files and where transformations

    would be complex if the files were combined into one before being processed. By
    building a single-use

    case, you can perform the transformation on a smaller scale and then append the
    results.


    # Debugging Custom Functions


    One of the painful pieces of working with custom functions is that you lose the
    ability to step through them

    . That makes debugging functions a bit of a challenge.

    While it''s not ideal, there is a way to convert a function back into a query
    so that you can test it. The unfort-

    ate of this process is that it is a temporary state converting the function into
    a debuggable state

    converts it out of function mode, breaking any subsequent queries during the debugging
    process. However,

    it is the only way to achieve the goal, so you''ll learn about it next.


    # Restoring Query Steps to the Applied Steps Box


    In order to restore the Applied Steps box so that you can debug a function, you
    actually need to turn it back

    to a query. To do this you need to do two things:


    +   1. Comment out the line that turns the query into a function

    2. Duplicate the variable used in the initial line and assign it to a value


    Failure to do either of these steps will cause you to end up with a query or function
    that returns the wrong

    results at best or errors at worst.

    To comment out a line in M, you insert the characters // at the beginning of the
    line. This tells the Power

    Query engine that the remaining characters on the line should not be executed.

    To duplicate the variable, you need to set up a new step after the initial line
    to create and assign a value

    to the variable. It must be built using the following syntax:


    ```

    Variable_name = assign_value_here

    ```


    The variable name must be the variable that is currently enclosed in the opening
    parentheses for the function,

    and the line must end with a comma. Take a look:


    +   - Edit the fnGetTimesheet query → Home → Advanced Editor


    Wait... something is different than the last time you looked at this code:'
