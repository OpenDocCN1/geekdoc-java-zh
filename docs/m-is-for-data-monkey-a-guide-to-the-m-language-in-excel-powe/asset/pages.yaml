    Figure 29 The date you wanted to import.


    > You might think that you could skip this process by choosing to import From
    instead of CSV. Unfortunately, Power Query is so helpful, it will override your
    choice and import the file as a CSV anyway.


    # Reordering Steps


    When you review the steps in the Applied Steps, you can see that if you split
    the columns by delimiter, Power Query automatically inserts a step to change the
    column types. Unfortunately, the data is lined up to the left, so you know that
    Power Query configured everything as.


    You need to fix that, if you step back to the Changed Type step and start converting
    the data types to dates and values, you''ll cause errors across row 1 (They are
    all values and have been promoted to headers). It really makes sense to change
    the column types after you''ve promoted headers, not before. Try moving Changed
    Type step down by right-clicking the Changed step → Move Down.


    The step moves, but it causes an error when doing:


    > Expression.Error: The column ''Column1.1'' wasn''t found.

    Details:

    Column1.1


    Figure 30 Power Query tells it couldn''t find a specific column name.


    The reason this error shows up is that the Changed Type step was setting the data
    types on Column1.1. But you promoted the column headers, there is no Column1.
    anymore; it''s now TranDate.


    Moving steps in Power Query can be a very handy feature, but you have to watch
    out for errors like the one just shown.


    As you become comfortable with Power Query, you might decide to fix a problem
    like this by using the formula step directly, but for the easiest way to fix this
    specific issue is to delete the step and re-create it:


    +   - Remove the Changed Type step by deleting it in the Applied Steps box

    - Right-click Amount → Change Type → Decimal Number


    > If you get an error in the column when you do this, you can fix it by doing
    the following: Select the Promoted Headers step → right-click the Amount column
    → Replace Values. Replace the $ sign with nothing. At this point, will will work
    when the Changed Type step. The root cause of the issue is that your regional
    settings are – sign for negative numbers as opposed to putting negative numbers
    in parentheses.


    You''re almost done. You have the date column left to go. For now, go to Home
    → Close & Load to finalize the query.'
