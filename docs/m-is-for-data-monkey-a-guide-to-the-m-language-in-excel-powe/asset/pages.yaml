  md: '# M is for (Data) Monkey


    The error message debugging offers is presented on a single row (though it was
    cut and wrapped for this image). At the very end of the string is a helpful ^
    character which indicates where Power Query thinks you need to place your comma.
    The issue, however, is that a brace was not placed to close the YTD list, as indicated
    by the upward-pointing arrow.


    These issues today are challenges. It''s a shame that we have no built-in formula
    editor, coloring, and IntelliSense to help with such issues. Power Query is being
    updated, though, and we hope to see these changes in the future. Until that happens,
    however, debugging must be the painful way: reviewing the line and waiting for
    opening and closing syntax marks, and the like.


    # Functions


    The type of object you will encounter in Power Query is a function. Functions
    can occur in two places:


    +   1. They can be inside a database, where they indicate a stored procedure.

    2. They can be retrieved in a list from Power Query.


    You''ll learn more about using and invoking functions in the book, but here you''ll
    learn a trick you can use to show functions manually and discover the Power Query
    function list. Try this:


    +   * Create a new query -> From Sources -> Blank Query

    * In the formula bar enter the following formula:

    #shared

    * Go to Record Tools -> Convert -> Into Table


    Power Query generates a table of all Power queries in the current workbook, but
    more importantly, it follows the list of tables with a list of all functions included
    in the product. You can access the documentation for any function from this list:


    | Name | Value |

