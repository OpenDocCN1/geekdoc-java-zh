    # Power Query Date Functions


    Many of Power Query''s date functions are different from Excel''s—some subtle
    and others not so subtly. Therefore, the following pages give you the means to
    easily work out in Power Query what you already know how to do in Excel.


    # Excel Date Functions


    Excel has a variety of date functions that can be of benefit when Building the
    Parameters table to drive your calendar. Each of them is explicitly use in Excel
    (not Power Query) and can be used to drive start or end dates to give yourself
    a range that is nicely scoped to your needs.


    | To Return | Formula |

    |---|---|n| The current date | TODAY() |

    | End of the current month | EOMONTH(TODAY(),0) |

    | End of last month | EOMONTH(TODAY(),-1) |

    | End of next month | EOMONTH(TODAY(),1) |

    | End of the current year | EOMONTH(TODAY(),12-MONTH(TODAY())) |

    | End of year for date in B25 | EOMONTH(B25,12-MONTH(B25)) |


    # Date Function Equivalents: Extracting Date


    Like Excel, Power Query also has specifically targeted at returning parts of dates
    or offsetting dates. Some key functions you want to know are listed here:


    | Excel Formula | Power Query Version |

    |---|---|n| DAY([Date]) | Date.Day([Date]) |

    | MONTH([Date]) | Date.Month([Date]) |

    | YEAR([Date]) | Date.Year([Date]) |

    | WEEKNUM([Date]) | Date.WeekOfYear([Date]) |

    | WEEKDAY([Date]) | Date.DayOfWeek([Date]) |

    | EOMONTH([Date]) | Date.EndOfMonth([Date]) |

    | EOMONTH([Date],-1)+1 | Date.StartOfMonth([Date]) |'
  merge: -1
