  md: '# Chapter 2 Overriding Power Query Defaults


    # Forcing Date Types


    A huge issue for Excel pros, particularly those outside the United States, is
    importing dates and getting them correct.


    Once data is in Excel, there is no big issue. No matter where the workbook goes,
    the dates will render correctly and can easily be switched to the format the reader
    needs, wherever in the world they are or whatever they wish to follow. The difficulty
    is in importing dates in the first place.


    The problem is that Excel and Power Query need to interpret the date from the
    external source, determine what date it is, and return the correct serial number.
    What makes the job difficult is the fact that not all of the software we use in
    our daily jobs is written using the same date standards that our countries use.
    In fact, if there is a mismatch between the data source and the regional settings
    on your PC, you''ll have issues.


    > The examples and illustrations in this chapter have been constructed using a
    PC with a U.S. standard format. If your system settings are in a different format,
    the results may be different from what is shown here.


    # Demonstrating Date Issues


    To see this problem, follow these steps:


    +   * Start a new query -> From File -> From Text

    * Browse and open Ch02 Examples.Dates.txt


    The view you get depends on the Windows regional settings in your PC. If you have
    your settings configured to use the U.S. date format MM/DD/YYYY, your import will
    appear as below. If your system uses DD/MM/YYYY settings, you''ll find that the
    first column will be left, and the second column will be right.


    | MM/DD/YYYY | DD/MM/YYYY | Date Date |

    |---|---|---|n| 1 | 5/3/2015 | March 5th 2015 |

    | 2 | 9/6/2015 | June 9th 2015 |

    | 3 | 12/6/2015 | June 12th 2015 |

    | 4 | 17/6/2015 | June 17th 2015 |

    | 5 | 12/13/2015 | December 13th 2015 |


    Figure 31 Dates imported and formatted using U.S. standards.


    Change the format of the left-aligned column to Date by right-clicking it and
    choosing Change Type -> Date. The result should look similar to that below (although
    the column you selected may vary:


    | MM/DD/YYYY | DD/MM/YYYY | Date Text |

    |---|---|---|n| 1 | 3/5/2015 | March 5th 2015 |

    | 2 | 9/6/2015 | June 9th 2015 |

    | 3 | 12/6/2015 | June 12th 2015 |

    | 4 | 17/6/2015 Error | June 17th 2015 |

    | 5 | 12/13/2015 Error | December 13th 2015 |


    Figure 32 Applying a Date format to sourced from a different region.


    Notice that a couple of issues present themselves immediately. First, the days
    and months appear flipped, and second, you get errors in the column.


    With the Windows regional settings set to MM/DD/YYYY, Power Query tries to interpret
    all dates in that format. And when it hits a date like 17/6/2015, it throws an
    error because there are only 12 months in the year.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Fixing Date Issues


    The secret to avoiding the problems discussed is explicitly telling Power Query
    for the data being imported. While it''s easy to do this once you know how, the
    terminology used to label this feature wasn''t put in terms until Excel pros recognize.


    To force Power Query to read the dates using the correct setup for each column,
    follow these steps:


    +   - Remove the existing Changed type

    - Right-click the MM/DD/YYYY column -> Change Type -> Using Local

    - Change the Data Type to Date

    - Change the Locale to English (United States), as shown below

    - Right-click the MM/DD/YYYY column -> Change Type -> Using Local

    - Change the Data Type to English (United Kingdom)


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_33_0.png)


    Figure 33 Setting the region where your data comes from.


    As shown below, the dates all render consistently according to the format declared
    in the regional settings of your Windows Control Panel. This is because the dates—no
    matter their original format—have been converted to the date settings on your
    system.


    | MM/DD/YYYY... | DD/MM/YYYY... | Text Date |

    | 1 | 3/5/2015 | 3/5/2015 March 5th 2015 |

    | 2 | 6/9/2015 | 6/9/2015 June 9th 2015 |

    | 3 | 6/12/2015 | 6/12/2015 June 12th 2015 |

    | 4 | 6/17/2015 | 6/17/2015 June 17th 2015 |

    | 5 | 12/13/2015 | 12/13/2015 December 13th 2015 |


    Figure 34 A consistent view of dates originally contained in two different formats.


    > If you don''t know which standard your country uses, experiment and choose one
    that returns the correct results.


    If there is any chance that your data may be shipped to someone using different
    regional settings, it is highly advisable that you force the date input formats.
    This will eliminate the chance of surprising errors occurring and is a practice
    that we follow throughout this book.'
  merge: -1
