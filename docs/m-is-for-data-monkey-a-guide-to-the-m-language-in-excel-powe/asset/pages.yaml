  md: '# # Chapter 18 Conditional Logic in Power Query


    As you build solutions using Power Query, you''re bound to come across a scenario
    where you need to perform some kind of logic in a column. While Power Query has
    a method to do this, it''s not consistent with the way an Excel pro would approach
    this issue.


    # ## Scenarios in Power Query


    This example looks at the issues that appear when you import the following timesheet
    from a text file:


    | Date | Work Date | | | | |

    |---|---|---|---|---|-|

    | From | 3/1/2015 | | | | |

    | To: | 3/14/2015 | | | | |

    | Work Date Out | Reg OT Hrs | Misc Hrs | Expenses |

    | Contingent Worker: John Thompson | | | | |

    | 3/3/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |

    | 3/4/2015 | 6:00 PM 8.00 | 0.00 | 0.00 | 0.00 |

    | 3/5/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |

    | 3/6/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |

    | 3/7/2015 | 3:30 PM | | | | |

    | 3/10/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |

    | 3/11/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_162_0.png)


    The data doesn''t seem so bad at first. And it seems even less of an issue when
    you realize that you don''t really need the top rows, as the dates are included
    on each row of the data table. But then you notice an issue: the employee name
    is not in rows but is buried in the middle of the data. How do you get out of
    there?


    The challenge in this scenario is to figure out how to get the employee name associated
    with each row of data—and that is not going to be possible without some conditional
    logic.


    # ## Connecting to the Data


    You need to connect to the data to see how it works in Power Query, which might
    give you some ideas about how to proceed:


    +   * Starting in a new notebook, create a new query → From File → From Text

    * Browse to Ch18 Examples\2015-03-14.txt

    * Go to → Reduce Rows → Remove Rows → Remove Top Rows → 4 → OK

    * Transform → Use First Row as Headers


    And the problem is now fully exposed:


    | Work Date | Out | Reg Hrs | OT Hrs | Misc Hrs | Expenses | PROPERTIES |

    |---|---|---|---|---|---|-|

    | Contingent Worker: John Thompson | | | | | | Name: 2015-03-14 |

    | 3/3/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | All Properties |

    | 3/4/2015 | 6:00 PM | 8.00 | 0.00 | 0.00 | 0.00 | APPLIED STEPS |

    | 3/5/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | Source: Changed Type |

    | 3/6/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | Removed To... |

    | 3/7/2015 | 3:30 PM | 6.50 | 0.00 | 0.00 | 0.00 | Promoted H... |

    | 3/10/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | |

    | 3/11/2015 | 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | |

    | 3/12/2015 | 6:00 PM | 6.00 | 0.00 | 0.00 | 0.00 | |


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_162_1.png)'
