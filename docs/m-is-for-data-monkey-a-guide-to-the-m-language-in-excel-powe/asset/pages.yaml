  md: '# Forehow Power Query Changed Our Lives


    # Ken''s Story: “Coffee & Power Query”


    It''s the name of the meeting in our Outlook calendar from November 2013. That
    was one of the Microsoft MVP summits, the product had had its name changed from
    Data Explorer, and I was meeting with Miguel Liopol and Faisal Mohamood from the
    Power Query team over to talk about the good and bad of the tool from Excel users''
    perspective.


    In that conversation, I told them that Power Query was great, but it was a lousy
    reality for SQL Services Management Studio. I distinctly remember part of the
    conversation. I''d been working with SSMS and Power Query a lot at the time, and
    was struggling with the fact that Power Query did some of the tasks, but not all.
    I was frustrated, as I was struggling with the tool, trying to make it behave
    as SSMS, but it just didn''t go right.


    What happened after I laid out my concerns flipped my on their head. I''m paraphrasing
    from my memory, the response was something like this:


    > "Ken, this tool isn''t a replacement for SSMS. We built this for Excel people...
    our intent is that they never need to use or learn SQL at all"


    For anyone who knows me, they know that I''m very seldom selfish, but that was
    just not enough to do it. That statement upset the balance of my world.


    Understand that I''m no normal Excel pro. I know SQL to be dangerous, I''m extremely
    comfortable with VBA, VB.NET, C#, XML and a few other languages. And while I teach
    technology and challenges, the true reason I know as many languages as I do today
    is that I taught myself out of necessity. Typically my needs were complicated,
    and involved a painful journey of jumping into the deep end with a “sink or swim”
    approach.


    No Excel pro should need to work with SSMS in order to get the data they need.
    Because of years of working with data and fighting issue let me assuming that
    Power Query was an Excel focused replacement for tool. It occurred to me, that
    it was designed to actually make the life of Excel so much easier that they wouldn''t
    even need to reach SQL at all.


    I love this. Not because what I can do with it, but because of how easy it makes
    it to get things done for a business without the need for coding. I love it because
    the people we pick it up rapidly and add real value in an incredibly short amount
    of time. This product is truly centered around the Excel pro, allowing us to build
    complex solutions using one of the best user interface designs'' seen in a long
    time. And while we do the coding techniques in this tool, the best part is that''s
    optimal, just extending the capabilities far.


    # Miguel''s Story: The Underdog


    I don''t remember the exact moment when I got introduced to Power Query. I believe
    it was 2013 when I downloaded the tool and playing with it. At first it seemed
    like a new tool that could transform data, but I still felt Power Pivot was to
    be the center of attention in the data story. Then Power Query was called ''Data
    Explorer'' and like today—it focused on delivering a rich user interface, allowing
    you to do amazing things without ever needing to look at the code. Little did
    I know that this ‘neat’ would solve all of my data problems.


    At first, Power Query might seem to you like what it seemed to me – just a guided-end
    tool that can do some really cool data transformations. And then you''ll realize
    the true power and flexibility that the Power Query engine brings to the table.
    Today, I feel that Power Query is as important as Power Pivot, as how you shape
    your data will ultimately determine how your Pivot Data Model works.'
