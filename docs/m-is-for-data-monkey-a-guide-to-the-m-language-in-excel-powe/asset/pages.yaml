- img_proc: true
  md: '# Appending Additional Tables


    Say that you want to add the March records to the query as well. You might be
    tempted to head back to the same spot to append the March records:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_39_0.png)


    Figure 41 Setting up to merge March''s records.


    But wait! Will this actually work? Won''t this create a new query? Yes, that''s
    absolutely the case. Doing will kick off a new query, which won''t make any sense
    at all. The PivotTable is already built upon the Transactions table, so you really
    need to go back and modify that table to append March''s records as well. How
    do you do that?


    The answer is to cancel the dialog shown above and go back to the Workbook Queries
    pane, where you right-click the Transactions query → Edit.


    In the Power Query editor, you can modify your existing query. And, as it happens,
    there is a really inviting button on the Home tab that looks promising: the Append
    Queries button in the Combine group (second group from the right).


    Unlike the Append button in the Excel user interface, the button in the Power
    Query user interface accepts only a single table, but already knows which query
    to append it to (the one you''re currently in).


    Interestingly, the options include not only the other Power Queries you have set
    up but also the query you are currently building:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_39_1.png)


    Figure 42 Options to include the table you are working with.


    > Selecting the table listed as current would append a copy of the query to that
    point, essentially duplicating the data set. While this is certainly not something
    that most users would use on a frequent basis, it''s nice to know that the capability
    exists.


    At this point, you choose the Mar 2008 query, and it will be appended to the Transactions
    query that already holds Jan and Feb records:


    +   - Select Mar 2008 → OK

    - Go to Home → Close & Load'
