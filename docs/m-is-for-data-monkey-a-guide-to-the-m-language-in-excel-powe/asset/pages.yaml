    Figure 81 The, as returned by the end user.


    Looking through the changes, you''re unstoured to see the following:


    +   - The new day is added after the total column.

    - A new sales category has been injected with retroactive data.

    - The user didn''t complete the total on the new column.


    How will the refresh fare, given these changes? To find out, go to the Data tab
    and click Refresh All twice (once for the Power Query and once for the PivotTables).'
