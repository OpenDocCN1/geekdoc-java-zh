  md: '# Referring to Steps or Rows


    Consider a scenario where you have a text file that contains data like that shown
    below:


    The Challenge:

    Import rows between ID Number and ID Total


    | ID Number | Amount | OrderDate |

    |---|---|-|

    | 1234 | 5 | 2015-05-01 |

    | 1235 | 45 | 2015-05-12 |

    | 1236 | 82 | 2015-05-13 |

    | 1237 | 32 | 2015-05-22 |

    | ID Total | 164 |


    More irrelevant data shows here


    Figure 264 Tab-delimited data with a specific requirement.


    +   - The data is delimited, but the first row doesn''t contain any tabs. This
    means you will need to manually trigger the column splits.

    - The number of rows prior to ID Number is variable. There could be 5 or 5,000
    rows before the row that contains the ID Number text.

    - The number of rows between and after the ID row is also variable.


    Your overall challenge here is that you need to extract rows from the middle of
    a data set and make dynamic to deal with how many rows are evident, in the middle
    of, and after the needed data.


    In addition, one final wrinkle, you''d like to determine the number of days between
    each order date compared to the previous order. This task will entail trying to
    subtract the date on one row from the data on another—something that can''t be
    done via the Power Query user interface.


    # Connecting to the Data


    You need to connect to the data and figure out which rows you need in order to
    perform your goals:


    +   - Open a blank workbook

