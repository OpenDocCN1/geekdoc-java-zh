  md: "# Chapter 8 Importing from Databases\n\nYour organization may grant you direct\
    \ access to the company databases, and if that's the case, you're lucky: Such\
    \ a database is by far the best source from which to get your data. Not only are\
    \ you guaranteed to access to the most up-to-date data, but loading from databases\
    \ is generally more efficient than loading files.\n\nIt doesn't matter what type\
    \ of database you're connecting to, as the experience of collecting, filtering,\
    \ and summarizing database is virtually identical no matter which database is\
    \ connected to. The connection experience does have very many differences, but\
    \ the interface for connecting each type of database will guide you through the\
    \ process, which essentially boils down to the three steps:\n\n+   1. Provide\
    \ the location of the database.\n2. Enter your authentication credentials.\n3.\
    \ Select the table(s) you wish to work with.\n\nThe goal of this book is to show\
    \ you that you will most likely encounter in the real world. For this reason,\
    \ it's important that you experience how Power Query works with the most common\
    \ SQL database on the planet: Microsoft's SQL Server.\n\nAs SQL Server aren't\
    \ easily portable, we are hosting an SQL Azure database on Microsoft's Azure web\
    \ service in order to perform these techniques. This is essentially a SQL Server\
    \ database that is hosted in the cloud and is available for you to freely access\
    \ and explore. This means that no matter where in the world you are, you can connect\
    \ and explore the data within this database.\n\n# Loading Data from a Database\n\
    \nPower queries connecting to a large variety of databases without the need to\
    \ install any additional drivers. The connections available can be found in three\
    \ separate areas in the Excel user interface:\n\n+   - New query $\rightarrow$\
    \ From Database\n- New query $\rightarrow$ From Azure\n- New query $\rightarrow$\
    \ From Other Sources\n\nIf you can't find the one you need, don't lose hope. If\
    \ you install the vendor's ODBC driver, you should be able to connect to your\
    \ database via the From Other Sources $\rightarrow$ ODBC Connector.\n\n# Connecting\
    \ to the Database\n\nFor this example, you'll connect to the AdventureWorks database\
    \ contained in your SQL Server and analyze the total sales by region for the AdventureWorks\
    \ company.\n\n> In an effort to make sure you don't cause yourself issues when\
    \ making your initial database connection, we highly recommend that you read the\
    \ steps below (up to the \"Managing Connections\") before attempting to actually\
    \ make a connection.\n\nTo get started, you need to go through the following steps:\n\
    \n+   - Create a new query $\rightarrow$ From Azure $\rightarrow$ From Microsoft\
    \ Azure SQL Database\n- Connect to the following database:\n- Server: azured.powerqueryworkshop.com\n\
    - Database: AdventureWorks2012"
  merge: -1
