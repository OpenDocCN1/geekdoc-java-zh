  md: '# TRANSFORMATION TOOLS REACH


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_13_0.png)


    Figure 4 Power Query''s ease of use will impact more users than any of the classic
    methods.


    There is no doubt in our minds that Power Query will change the way Excel work
    with data forever.

    We want to make it quite clear that we are not discounting the value of formulas,
    VBA, or SQL. In fact, we couldn''t live without those tools. You can quickly knock
    formulas to many things outside the transformation context Power Query never do.
    VBA has a far greater reach in sheer capability and power, allowing you to reach
    other applications, create programs to pull and push data, and so many other things.
    And a SQL query written by a SQL wizard will be faster and better than one created
    by Power Query.

    In the context of simply connecting, cleaning, and improving data, Power Query
    offers more for free, allowing you to automate the job more quickly and in less
    time.


    The good news for true wizards is that Power Query is another tool that you have
    access to. You can provide your own SQL queries needed, refresh them with VBA
    when desired, load your Power Query-created queries directly to Power Pivot, and
    much more.


    # Why Power Query Is Magic


    The number-one issue Excel pros face when building robust and stable solutions
    has accessing, cleaning, and transforming the data. What we''ve needed, and yet
    many of us have never heard of, is an ETL tool—that is, for extracting, transforming,
    and loading data.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_13_1.png)


    Figure 5 ETL: extract, transform, load.'
  merge: -1
