  md: '# Chapter 15 Transposing and Unipivoting Complex Data


    When with real-world data, Excel pros often encounter data that needs to be treated
    in a variety of ways. While unipivoting is extremely common, on occasion you may
    need to reverse this process and pivot data before making more complex transformations.
    Another technique that can be extremely useful is transposing data—for example,
    flipping data that is laid out in a vertical manner and so displayed horizontally
    (or vice versa). Both of these functions are, fortunately, built in the Power
    Query interface and can aid in transforming data into tables.


    # Unipivoting Subcategorized Tables


    The first example we will deal with this chapter is unipivoting a subcategorized
    table. While we looked at unipivoting in Chapter 6, this scenario, based on the
    figure below, adds another dimension to the scale.


    | | | | | Account Month Measure Value |

    |---|---|---|---|---|---|---||

    | Alcohol | 15747.28 | 25012.00 | (9,264.72) | | April | Actual | 15,747.28 |

    | Food | 34523.71 | 44,740.00 | (10,216.29) | | Food | April | Actual | 34,523.71
    |

    | Other | 237.99 | 3,867.00 | (3,629.21) | | Other | April | Budget | 25,012.00
    |

    | | | 50508.78 | 73619.00 | (23,110.22) | | Food | April | Budget | 44,740.00
    |

    | | | | | | Other | April | Budget | 3,867.00 |


    Figure 17 A challenging unipivot scenario


    What makes this problem more challenging than a standard unipivot? It''s the additional
    level of having the month with the measure type.


    When you unipivot, the data is de-aggregated, using the column names as points.
    But what if column names become headers? If you promote the second row to headers,
    you will lose key information about the month. It''s not going to work.


    But there is most certainly a way to unipivot this data; you just need to use
    a bit of imagination and more advanced techniques.


    # Loading the Data


    For this example, you will unipivot the financial statement found in Ch15 Examples\Unipivot
    Data.xlsx:


    | | | | | | | | | |

    |---|---|---|---|---|---|---|---||

    | A | B | C | D | E | F | G | H |

