    # Records


    While a list can be described as a single vertical column of data, a record is
    a list''s horizontal, multi-column counterpart. A record can be visualized as
    one row of a database, containing all the pertinent information related to a particular
    customer or transaction.


    In Power Query, records can appear in table columns or in lists as you retrieve
    data. They can also be created on-the-fly if needed.


    # Syntax


    Records are significantly more complex than lists that they need to have a value
    of some kind, and you must also define the column name, like this:


    ```

    [Name="Ken Puls", Country="Canada", Languages Spoken=2]

    ```


    Observe this key syntax points:


    +   - Every record is surrounded by square brackets.

    - Every record field (column) needs a name defined, followed by the = character.

    - The data for the field is provided, surrounded by quotes for textual data.

    - Each field name and data pair are separated by commas.


    > Field (column) names do not need any punctuation surrounding them, whether they
    contain spaces or not.


    What happens when you need to create multiple records at once? The answer is that
    you reach to a list:'
