    +   - Every empty blank in the original data table has come in a null


    +   - Column4''s row 1 value is also null


    Now you have to figure out what you are going to do with this. You can start by
    looking at Column1


    # Filling Vertically


    You can''t get rid of Column1 because it contains information that tells the account
    is a revenue classification or an expense classification. The problem is that
    the account classification doesn''t exist in the same row as the account description
    and values. This means you need to find a way to get the classification to fill
    down into the null areas.


    As it happens, this is exactly how Power Query''s Fill Down command works:


    +   - Select Column1→ Transform → Fill → Down where required:


    Now you''ve got your classifications on each row where


    | Column1 | Column2 | Column3 | Column4 | Column5 |

    |---|---|---|---|---||

    | 1 | | | null April | null |

    | 2 | null | null Actual | Budget | Variance |

    | 3 | Revenues | Alcoholic Beverages | null | 15747.28 | 25012 |

    | 4 | Revenues | | Food & Non-Alcohol Beverages | 34523.71 | 44740 |

    | 5 | Revenues | | Incidental Revenue | 237.79 | 3867 |

    | 6 | Total Revenues | | null | 50508.78 | 73619 |

    | 7 | Total Revenues | | null | null | null |

    | 8 | Expenses | | null | null | null |

    | 9 | Expenses | Cost of Sales | | 21997.81 | 24296 |


    Figure 180 The account classification has been filled.


    Power Query''s Fill Down command fills the value above into cell that is null,
    but it does not overwrite any data. The Fill Up command works the same way but
    fills up instead of down.


    > A blank cell is not a null. If you need to fill into blank areas, you must replace
    the data on the column, asking to replace an empty value (leave the blank field)
    with null. Power Query will convert the text-based null to null.'
