    get them refresh, you need to click the gear icon on the Source step and change
    the folder location to the location on your PC.


    At this point you need to tell Power Query that CSV is not the correct format
    for this document, even though it is masquerading as a CSV extension. To do this,
    click the dropdown next to Open File As -> OK.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_30_0.png)


    Figure 27 The different options available for data imports.


    The results are much more comfortable, although there is definitely a bit more
    to work do to:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_30_1.png)


    Figure 28 All of the data is showing again!


    It looks like you''ll need to split this data into columns, but that''s not a
    huge deal. At least it is comma delimited, that will make things a bit easier.
    Now you need to go through the steps that Power Query done for you:


    +   - On the Home tab -> Remove Rows Remove Top Rows

    - Go to the Transform tab -> Split Column By Delimiter

