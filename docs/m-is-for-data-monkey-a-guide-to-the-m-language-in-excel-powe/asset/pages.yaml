  md: '# Connection Properties


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_105_0.png)


    Figure 140 Power Query''s game over screen.


    The most awful news about this is that there is only one fix. You must:


    +   1. Delete the table, including any measures and calculated fields that lie
    on it, and then

    2. Rebuild the table, and calculated fields from scratch.


    It''s horrendous, it''s ugly, and it''s feared. It''s also avoidable if you are
    disciplined.


    # Critical Do''s and Don''ts to Avoid Corrupting Your Model


    Using Power Query to source data for your Power Pivot Data Model is completely
    stable, provided that you follow certain rules.


    If your data has been loaded to the Power Pivot Data Model from Power Query, you
    should *never do* any of the following:


    +   * Change the table name in Power Pivot

    * Rename an imported column in Power Pivot

    * Delete an imported column in Power Pivot


    Any of these actions will immediately corrupt the model, setting the table into
    a non-refreshable state the next time the Power Query query is modified.


    Keep in mind that it is *safe to perform* the following:


    +   * Add/modify/remove custom columns in Power Pivot

    * Add/modify/remove relationships in Power Pivot

    * Add/modify/remove measures (calculated fields) in Power Pivot

    * Make any modifications to the table in Power Query


    The basic rule of thumb is this: if you loaded your data from Power Query, make
    *all* your modifications to the table in Power Query. If you follow this rule,
    you won''t ever experience the problem of corrupting your model.'
