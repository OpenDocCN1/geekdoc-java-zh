  md: '# # Row-Level Errors


    Row-level errors typically occur when you''re trying to convert data to the wrong
    data type or operating data before it has been converted to the correct type.
    You''ve seen several examples of these types of errors throughout this book. Here''s
    one:


    | TerritoryID | CountryRegionCode | Group | SalesYTD |

    |---|---|---|---||

    | 1 | Error | North America | 7887186.788 |

    | 2 | Error | North America | 2402176.848 |

    | 3 | Error | North America | 3072175.118 |


    > DataFormat.Error: We couldn''t parse the input provided as a Date value.

    Details:

    US


    Figure 248 A row-level error triggered by trying to convert countries to a Date
    type.


    These errors generally aren''t show-stoppers, and they can even be very useful
    when you''re cleaning data, as they can be treated in two ways:


    +   - Used as filters to remove rows

    - Replaced with other data using the Transform -> Replace errors command


    Despite the fact that there is no debugging in Power Query, these errors are usually
    identifiable and often (though not always) are related to incorrect data types.


    # # Step-Level Errors


    Step-level errors are a bit more serious to deal with than row-level errors. These
    messages block Power Query from showing out the input window, like this example:


    ```

    = Sql.Database("azureddb.powerqueryworkshop.com", "AdventureWorks2012"

    Expression.SyntaxError: Token RightParam expected.

    0001: Sql.Database("azureddb.powerqueryworkshop.com", "AdventureWorks2012"

    ```


    Figure 249 An syntax error, triggered by a missing ) at the end of the line.


    ```

    = Sql.Database("azureddb.powerqueryworkshop.com", "AdventureWorks2012"

    Expression error: The name ''SQL.Database'' wasn''t recognized. Make sure it''s
    spelled correctly.

    ```


    Figure 250 A general error, triggered by referring to SQL rather than Sql.


    Unfortunately, Power Query''s debugging tools are particularly weak, as you can
    see with the following issue:


    ```

    Expression.SyntaxError: Token Comma expected.

    0001: Table.Group("Filtered Rows", "Group", {"YTD Sales", each List.Sum([SalesYTD])})

    -->

    type number, ("Last YTD Sales", each List.Sum([SalesLastYear]), type number))

    ```


    Figure 251 A syntax error caused by a missing ) character with the error message
    asking for comma.'
