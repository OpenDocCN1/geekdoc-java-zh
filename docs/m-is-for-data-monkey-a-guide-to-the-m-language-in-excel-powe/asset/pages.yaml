  md: 'There is very little reason to create a duplicate of your table without performing
    any transformations in the process. We show this process merely to illustrate
    how to connect and load from an Excel table.


    # Connecting to Named Ranges


    Pulling data from Excel tables is by far the easiest to pull Excel data into Power
    Query, but it isn''t the only method.


    The challenge with applying a table style in Excel is that it locks columns header
    (breaking dynamic table headers by formulas), applies color banding, and makes
    other stylistic changes to your worksheet that you may not want. This might be
    a problem if you''ve spent a large amount of time building an analysis, and you
    don''t want a table style applied to the data range.


    The good news is that you can also connect to ranges, not just to tables. To do
    this, you can use the NamedRange worksheet in the Chili-xlsx sample file. The
    data in it is identical to the data in the previous example, but it''s still in
    raw format, with no table style applied.


    Pulling data into Power Query from a named range involves three distinct steps:


    +   - Defining a named range that covers the data,

    - Selecting the named range, and then

    - Creating a new query.


    Follow these steps with the NamedRange worksheet:


    +   - Select cells AS:F42

    - Go to the Name box -> enter the data range -> press Enter


    | Date | Inventory Item | Sold By | Cost | Price | Commission |

    |---|---|---|---|---|---||

    | 6/6/2014 | Puppy Turtle | Fred | | 8.00 | 30.00 | 0.90 |

    | 7/6/2014 | Talkative Parrot | Jane | | 17.00 | 32.00 | 0.96 |

    | 8/6/2014 | Rambunctious Puppy | Fred | | 9.00 | 30.00 | 0.90 |

    | 9/6/2014 | Lovable Kitten | John | 12.00 | 45.00 | 1.35 |

    | 10/28/2014 | Cranky Crocodile | Fred | | 10.00 | 35.00 | 1.05 |


    Figure 18 Creating a named range.


    After you''ve created this, you can select it using the drop-down arrow on the
    left. No matter where you are in your workbook, you will jump to this worksheet,
    and the data in the named range will be selected.


    +   - Ensure the entire named range is selected and its name is showing in the
    Name box

    - Create a new query -> From Table


    If the named range is selected when you use the From Table command, Power Query
    does not force a table style on your data and instead refers directly to the data
    in the named range.


    As you can see below, now the Power Query interface looks the way it looks when
    you import delimited files rather than how it looks when you connect to an Excel
    table.'
  merge: -1
