  md: '# Chapter 0 Introduction: A New Revolution


    Power Query is an ETL tool; its function is to extract data from almost any, transform
    it as desired, and then load it. But what does that truly mean to us as Excel
    pros?


    # Extract


    Extraction can be targeted against one or more data sources, including text files,
    CSV files, Excel files, data-bases, and web pages. In addition, the Power Query
    team has many connectors to data sources that would have otherwise been tough
    to get at—Microsoft Exchange, Facebook, Salesforce, and other Software-as-a-service
    (SaaS) sources.


    # Transform


    When we allow transformation, we include each of the following areas:


    +   - **Data cleaning**—Data cleaning could involve filtering out departments
    from a database or removing blank or garbage rows from a text file. Other uses
    include changing cases from uppercase to lowercase, splitting data into multiple
    columns, and forcing data to import in the correct format for a particular country.
    Data cleaning is anything you need to do to your data so it can be cleaned up
    so.

    - **Data integration**—If you use VLOOKUP() or INDEX(MATCH(), you''re probably
    integrating multiple data sets. Power Query can join data in either vertical or
    horizontal fashion, allowing you to join two tables (creating one table) or merge
    tables together horizontally, without having to write a single VLOOKUP function.
    You can also perform other operations, such as grouping.

    - **Data enrichment**—These tasks include adding new columns or calculations over
    a data set. Power Query makes it easy to perform mathematical calculations like
    creating Gross Sales by multiplying Quantity * Price In fact, with Power Query
    you can create enter tables, based on the value in an Excel cell. Can you build
    a dynamic table that runs five years from today''s date? Look no further than
    Power Query.


    Power Query allows you to perform many transformations through menu commands without
    having to write formulas or code to do them. This tool was built for Excel pros,
    and with no coding experience whatsoever-ever, you can use Power Query to perform
    transformations that would be incredibly complex in SQL or VBA. That''s a great
    thing!


    If you''re the type of person who likes to get under the covers and tinker with
    formulas or code, however, you can. There is no requirement to learn it, Power
    Query records everything in a language called M (Languages A L were taken). And
    if you''re a wizard who decides to take advantage of this language, you can build
    even more efficient queries and without it.


    # Load


    With Power Query you can load data into one of four places:


    +   - Excel tables

    - The Power Pivot Data Model

    - Power BI

    - Connections only


    The last point might seem a bit mysterious, but it simply means that you can create
    a query that can be used by other queries. This allows for very interesting use
    cases that we''ll explore more in the book.

    While it''s interesting to look at where the data loads, really isn''t the important
    part of the loading process in this ETL tool. It''s how it loads or how to load
    it again.

    Power Query is essentially a macro recorder that keeps track of every bit of the
    extract and transform steps. You can define a query once and determine where you''d
    like to load it. After you''ve done that, you can simply refresh your query to
    run it again.'
  merge: -1
