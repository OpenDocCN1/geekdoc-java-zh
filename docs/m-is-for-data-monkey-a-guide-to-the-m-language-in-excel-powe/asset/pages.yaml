  md: '# Operating on Row in a Column


    There is one very important construct to use in M: how to read and modify code
    that operates on each row in a column. To get this, you can take your query and
    add a column to determine the totals by row:


    +   - Make sure you use the Advanced Editor

    - Select the Quantity and Price columns → Add Column → Standard → Multiply

    - Right-click the Multiply column → Rename → Gross Sales

    - Right-click the Inserted Multiplication step → Rename → CalSales

    - Right-click the Renamed Columns step → Rename → Rename


    The query will now look like this:


    | Date | Inventory Item | Employ... | Quantity | Price |

    |---|---|---|---|---||

    | 1 | 5/10/2014 | Lovable Kitten | | 1 | 45 | 180 |

    | 2 | 5/9/2014 | Talkative Parrot | | 2 | 32 | 64 |

    | 3 | 5/24/2014 | Lovable Kitten | | 3 | 45 | 180 |

    | 4 | 5/10/2014 | Adorable Kitty | | 2 | 35 | 70 |

    | 5 | 5/8/2014 | Lovable Kitten | | 1 | 45 | 45 |

    | 6 | 5/23/2014 | Sleepy Gerbil | | 1 | 39 | 39 |

    | 7 | 5/11/2014 | Cranky Crocodile | | 2 | 5 | 175 |

    | 8 | 5/19/2014 | Adorable Kitty | | 4 | 25 | 70 |

    | 9 | 5/5/2014 | Sleepy Puppy | | 3 | 39 | 195 |


    Figure 26 The query with a Gross Sales column.


    Viewing the code in the Editor yields two lines of code at the end of the query
    (wrapped lines have been indented here for each of identification):


    ```

    CalSales = Table.AddColumn(NewType, "Multiply", each

    List.Product([Quantity], [Price]), type number),

    Rename = Table.RenameColumns(CalSales, {"Multiply",

    "Gross Sales"})

    ```


    While you may not recognize the function used in the Rename step, you can easily
    recognize that the Table.RenameColumns function refers to the previous step and
    then provides a list of the previous column names and the name you''d like to
    take them. In addition, based on the fact that you see the line open with two
    { , you can identify that you could provide a list of lists and rename multiple
    columns at once.


    The CalSales line, however, has a new keyword in that you''ve seen before. The
    Table.AddColumn function refers to the NewType step and then provides the value
    "Multiply". Since Multiply was the name given to the column, this means that you
    could properly change the name to use "Gross Sales" instead of "Multiply", avoiding
    the renaming of the column later.


    Following the column name is a new keyword you haven''t encountered yet: each:
    each keyword identifies Power Query you want this action performed for each row
    in the query. Following this, you see the List.Product() function, which indicates
    columns to multiply each other and the data type the output should take.


    You can now make some modifications to change the code socalled:


    +   - Replace "Multiply" in the line from the end of CalSales

    - Remove the comma from the end of the CalSales line

    - Remove the entire Rename line

    - Change the last line to read "CalSales" instead of "Rename",


    Your query should now look like to this:'
