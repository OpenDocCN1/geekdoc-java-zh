  md: '# Chapter 11 Defining Data Types


    As Power queries, it is getting better and better at automatically setting appropriate
    data types on columns of data. Even so, there are still times it pops up with
    an odd choice (or no choice at all). This can leave hidden traps in data sets
    that rear their heads when you expect it and can cause all kinds of confusion.


    # What Data Types Are Recognized?


    Power Query recognizes several data types—more, in fact, Excel does. The complete
    list of Power Query''s data types is:


    +   * Number: Decimal Number, Whole Number, Currency

    * Date/times: Date/Time, Date, Time, Date/Time/zone

    * Text: Text

    * Boolean: True/False

    * Object: Binary

    * Undefined: Any


    The true killer is in the last data type. Any is a variant data type that Power
    Query will use to indicate that it is not sure of the data type. The challenge
    here is that data defined as Any could take a variety of forms when being loaded
    or referenced in the future.


    # Why Data Types Are Important?


    To demonstrate the importance of defining data types, in this chapter you will
    create a new query and remove the data types that Power Query defines for. This
    will give you a good understanding of why declaring data types is important and
    not something you should leave to chance.


    # Tables and the Any Data Type


    Starting by a query with no defined data types into an Excel table:


    +   * Open Ch11 Examples>Defining Data Types

    * Select a cell in the May table -> create a new query -> From Table

    * Remove the Changed Type step


    At this point, the data has no data types defined at all, which you can see by
    selecting a cell in the column and looking on the Transform tab


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_106_0.png)


    Figure 14 The column with this data set has the same data type, Any, yet they
    all look different.


    +   * Interestingly, each column in this data set has the same data type, Any,
    yet they all look different. The dates look like they are in Date/Time format,
    and the numbers look like they are the Number data type. So what''s the big deal?
    Follow these steps to find out:'
