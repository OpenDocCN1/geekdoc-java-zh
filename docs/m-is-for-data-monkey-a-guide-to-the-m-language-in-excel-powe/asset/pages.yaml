    # Code Comments


    The last sets of characters you need to know how to create are those that let
    you comments in code. These can be very useful for leaving notes in code or temporarily
    disabling a line of code.


    To mark a single line of a Comment, you place two slashes at the beginning of
    the line, as shown here:


    ```

    let

    // Retrieve the Sales table from Excel

    Source = Excel.CurrentWorkbook([Name="Sales"]])[Content],

    ```


    Power Query will not read the // Retrieve... line, and this line will not appear
    in the Applied Steps box, but it is there to remind you purpose of the following
    row.


    Sometimes you need longer comments that don''t fit on one line. In this case,
    you place the characters /* prior to the code you don''t want and executed the
    characters /* at the end of the section, like this:


    ```

    /* I break this comment across multiple lines

    (by reading M is for Data Monkey)   */

    ```


    # Summary of Special Characters


    The following table provides a list of the special characters that you will encounter
    in your Power Query coding language:


    | Character | Purpose |

    |---|---|

    | (Parameters) | Surrounding function parameters |

    | (List) | Surrounding list items |

    | (Record) | Surrounding records |

    | "Text" | Surrounding text |

    | #Step Name | Referring to a step name that contains spaces or other reserved
    characters |

    | //comment | Commenting a single line of code |

    | /* comment */ | Commenting multiple lines of code |'
