  md: '# Chapter 0 Introduction: A New Revolution


    Enter a product that tackles all these problems—one that is easy to learn and
    that others can pick up and understand with limited instruction. It''s a product
    that lets you automate the import and cleanup of data, so you can focus on turning
    that data into information, adding true value to your company. That product is
    called Power Query.


    # The Future Transforms


    Power Query solves the problems related to the toolsets just described. It is
    very easy to learn and has one of the most intuitive user interfaces we''ve ever
    worked with. It''s easy to maintain, as it shows each step of the process, which
    you can review or update later. And everything in Power Query is refreshed with
    a couple of clicks.


    We have spent years building solutions using black magic techniques, and we see
    Power Query as a game changer for many reasons. One of them is the speed with
    which it can be learned.


    When it comes to importing, cleaning, and transforming data to get it for analysis,
    you can learn Power Query faster than you can learn Excel formulas, and it handles
    complex sources much more easily than VBA.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_12_0.png)


    Figure 3 Power Query was designed to be an easy-to-use data transformation and
    manipulation tool.


    Its ease of use makes Power Query the answer to the vanishing data magician problem
    that many businesses face. Even if a modern-day magician builds something complex
    in Power Query, you can have someone up to speed and maintain fix the query with
    minimal training—we''re talking hours, not weeks.


    As hard as it true for Excel pros to understand, many users actually don''t want
    to master Excel formulas. They simply want to open up a tool, connect to their
    data source, click a few buttons to clean it up and import it, and build the chart
    or report they need. It''s for exactly this reason that Power Query can reach
    even further than formulas. With the menu-driven interface, in many cases a user
    can avoid having to learn a single formula or line of code.'
  merge: -1
