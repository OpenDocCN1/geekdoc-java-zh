    # Dynamic Table Headers


    Excel tables are truly fancy. But one issue with them is that they lock down the
    header row into hardcoded values. That prohibits you from having dynamic headers
    on your tables, driven by formulas.


    The file CH09 Examples:DynamicHeaders.xlsx contains a spreadsheet for budgeting
    green fee rounds for a golf course. The header row has a setup table and is able
    to change the year in B1 and update all headers in rows 3 and 32 of the document:


    | A | B | C | D | E |

    |---|---|---|---|---||

    | 1 | Most recent budgets supplied: | 2014 | | | |

    | 2 | | | | | |

    | 3 | Month | 1/31/2014 | 2/28/2014 | 3/31/2014 | 4/30/2014 |

    | 4 | Green Fee | | | | | |

    | 5 | 9 rounds (18 hole equivalent) | 40 | 60 | 103 | 175 |

    | 6 | 18 holes (36 hole equivalent) | | | | | |

    | 30 | | | | | |

    | 31 | Recap | | | | | |

    | 32 | Month | 1/31/2014 | 2/28/2014 | 3/31/2014 | 4/30/2014 |

    | 33 | Total Green Fee Rounds | 140 | 310 | 503 | 845 |

    | 34 | Total Pass Rounds | 50 | 50 | 90 | 180 |

    | 35 | Member/Annual Pass Rounds | 146 | 184 | 290 | 1,423 |

    | 36 | Total Other Rounds | 48 | 71 | 155 | 329 |


