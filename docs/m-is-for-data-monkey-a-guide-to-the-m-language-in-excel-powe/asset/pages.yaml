    |---|---|---|---|---|---|---|---|---|---|---||

    | Row Labels | Beer | | | | | | | | | | |

    | Liquor | | 203 | 241 | 101 | 137 | 103 | 185 | 111 | 23 | 1151 |

    | Wine | | 175 | 223 | 138 | 57 | 66 | 199 | 83 | 86 | 1027 |

    | Cider | | | | | | | | 72 | 47 | 217 |

    | Grand Total | | 440 | 673 | 342 | 373 | 319 | 609 | 466 | 190 | 3412 |


    | | Sum of Units |

    |---||

    | Beer | 1017 |

    | Liquor | 1151 |

    | Wine | 1027 |

    | Cider | 217 |

    | 1/6/2014 | 78 |

    | 1/7/2014 | 92 |

    | 1/8/2014 | 47 |

    | Grand Total | 3412 |


    Figure 82 Your PivotTables still work, despite your user''s actions.


    Every issue that your user threw at you was handled. The totals are, the data
    is in the right order, and the historical values have been updated.


    # Understanding the Unpivot Functions


    There are actually two unpivot functions on the right-click menu in Power Query:
    Unpivot Columns and Unpivot Other Columns.


    # How Unpivot Other Columns Works


    To be fair, we have made some unnecessary steps in the example below. Instead
    of selecting the 1/1/2014 through 7/1/2014, you could have right-clicked the Sales
    Category column and chosen the Unpivot Other Columns command. This command would
    unpivot every other column than the one(s) selected. From a logical point of view,
    it would have made complete sense when the solution was updated that it worked
    well.


    Having said, the demo was set up this for a reason—to explain what really happens
    when you use the Unpivot command.


    # How Unpivot Columns Actually Works


    Based on the terminology of the user interface, you would have expected that when
    you recorded the step above to unpivot the 1/1/2014 through 7/1/2014 columns,
    Power Query would have hardcoded those specific columns. It should be plainly
    obvious that this is not the case.


    Here''s what Power Query actually did: It looked at all the columns in the data
    set and determined that there was one column you did not select. Rather than building
    you a "unpivot these columns" command, it actually recorded code that says "unpivot
    everything except the column(s) that weren''t selected." In this case, it actually
    recorded that "everything except Sales Category."


    While this change seems subtle, it actually has fairly large merits, both good
    and bad.

    The news is that it is very difficult to make a mistake and build a scenario that
    blows up when new daily columns are added. Essentially, it future-proofs your
    solution for new dates, as it will always be pulled in.


    The bad news is that there is no way to use the user interface to lock in a specific
    "unpivot this column only" command. If you have an Unpivot Other Columns command
    in your query, and you add a new column to the data table, it will be unpivototed
    as well.'
