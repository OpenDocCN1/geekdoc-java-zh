    # Considerations


    Where possible, it is preferable to build your solutions against Excel tables.
    They are easier to set up than the alternatives, easier to maintain, and quite
    transparent about where the data is stored.


    In specific situations, you might have reasons to avoid tables, however, and you
    can do that where needed. We recommend that you generally reach to these techniques
    only when you have good reasons to do so.'
