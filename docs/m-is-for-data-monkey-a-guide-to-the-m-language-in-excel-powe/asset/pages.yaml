  pgno: 232
- img_proc: true
  md: '# M is for (Data) Monkey


    You use staging queries to ensure that you create separate queries as possible
    to extract the initial data from each data source. You then do as many transformations
    in the staging query in order to get the data into a shape which can be used by
    many other queries. What you do not, however, is try to merge another data source
    or the end result into a worksheet of the Data Model. Both of tasks are reserved
    for a loading query.


    A loading query is designed to pull data from one or more staging queries and
    merge or append as required before making any final transformations that are needed.
    You set up these queries to load the output to the final destination, whether
    it''s the worksheet or the Data Model.


    Visually, the process looks as follows:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_233_0.png)


    Figure 323 Organizing staging and loading queries.


    Technically, combining any two different data sources can cause a Formula.Firewall
    to appear; even trying to inject a parameter from an Excel parameter table can
    trigger the error. If you get a Formula.Firewall error when trying to nest a dynamic
    parameter in the middle of a query, try to declare your variable from front rather
    than avoid the variable declaration and nest the function in your code. This resolves
    that issue.


    # Caveats


    When working with staging and loading queries, you need to be careful in certain
    cases, especially when the data source you connect to can take advantage of query
    filtering to improve performance. The reason for this is that query filtering
    can be executed only from the primary connection to the data source (the staging
    query).


    When using a staging/loading approach against a database that supports query filtering,
    you should always try to accomplish as many filtering and grouping operations
    as you can in the staging query. This will allow Power Query to pass the processing
    job back to the database. As soon you move out of your query into a secondary
    database or the loading query, no more commands can be passed back to the database
    to be formed, which means Power Query has to do the processing work. This can
    significantly slow down the process. It may also sense to make several connections
    to the database to pull individual data sets, allowing the database to do the
    heavy lifting for you since these databases are optimized for the sorting, filtering,
    and grouping operations.


    By contrast, if you are targeting your source that doesn''t support query filtering
    (such as text or Excel files), it''s a good idea to create one staging query to
    pull in the data and cut it down as much as possible. You can then use as secondary
    staging/loading queries to reshape the data as needed to get it into your model.
    Since there is no ability to take advantage of a more efficient engine query,
    you want to bring the data in once and try to make sure each step works with few
    records as possible to improve processing time.


    You should also be conscious not to set up too many levels of staging queries
    between your data source and your loading queries. Whereas using one staging query
    feeding one query can be quite easy to follow, things get more complicated when
    you use data feeding through five or more intermediate staging queries on the
    way to the end result. It''s a longer trail to process, which could have impacts,
    and most certainly there will be a trail to audit something went wrong. Keeping
    the query flow tighter will help you when you''re trying to debug and maintain
    your queries.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 25 Query Organization 225


    You should also be aware that Power BI doesn''t generally appreciate long trails
    of queries using the staging and loading query approach. If you are intending
    to push your solution to Power BI, it is a good idea to try to keep the approach
    to a single query if possible and limit the number of steps if not.


    # Keeping Queries Organized


    As you build and more Power Query queries, you''ll find that things start to get
    a bit disorganized in the Workbook panes. As it happens, there are a couple ways
    you can keep a handle on this issue.


    # Changing Query Display Order


    As you start building, Power Query will add them to the bottom of the list, in
    sequential order. You can, however change the order in which these queries are
    presented in the Workbook pane (and Power Query Navigator inside the Power Query
    editor). To change where a query shows in relation to the others, follow these
    follows:


    +   * Right-click your query

    * Choose Move Up (or Move Down)


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_234_0.png)


    Figure 324 Moving query positions.


    # Grouping Queries


    Ordering is great, but it doesn''t help you categorize queries very easily. Especially
    when using the staging and loading approach, it is very helpful to create groups
    in which to store each query. Here''s how:


    +   * Right-click the fnGetTimesheet query → Move to Group → New Group...

    * Call the new group Functions


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_234_1.png)


    Figure 325 Classifying functions.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'You can now move the fnParameter into the Functions group as:


    +   - Right-click fnParameter -> Move to Group -> Functions


    It''s just a simple matter of creating new groups for the staging and loading
    queries as:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_235_0.png)


    Figure 326 All queries, nicely organized.


    This approach works very nicely for keeping things organized, and it also gives
    you the ability to quickly scan the queries to see if they are set up. If you
    see the text "x rows loaded" under a staging query, you know it''s not actually
    taking a specific staging role, and you can either fix it or move it to the Load
