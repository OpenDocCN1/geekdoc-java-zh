- img_proc: true
  md: '# Locking Columns to Unipivot


    While this should be unusual, there may come a time when you need the ability
    to lock in a specific column or columns that you want to unipivot and ensure that
    new columns added to your source data are not unpivot by default. Doing so takes
    some manipulation of the formula in the formula bar.


    Assume that you want to unipivot the Total column, for example. You would take
    the following steps:


    +   - Create a new query → From Table

    - Right-click the Total column → Unpivot Column

    - The query at this point would look similar to this, with the final columns being
    unpivoted:


    | Sales Category | 1/1/2014 | 2/27/2014 | Attribute | Value |

    |---|---|---|---|--|

    | 1 Beer | 103 | 111 | Total | 983 |

    | 2 Wine | 177 | 83 | 86 Total | 941 |

    | 3 Cider | | 92 | 47 Total | 170 |

    | 4 Liquor | | 161 | 180 | 23 Total | 1128 |


    Figure 38 The Total column has been unpivoted.


    +   - Use the V icon in the formula bar to expand the formula bar

    - At this point the formula in the formula bar would read as follows:


    ```

    =Table.UnipivotOtherColumns("Changed Type", "Sales Category", "1/2/2014", "1/3/2014",
    "1/4/2014", "1/5/2014", "1/6/2014", "1/7/2014", "1/8/2014", "Attribute", "Value")

    ```


    Here''s how code breaks down:


    +   - Table.UnipivotOtherColumns() is the function to be executed

    - #"Changed Type" is the name of the previous step from the Applied Steps box

    - {...} is a list of all the columns, separated by commas

    - "Attribute" is the name of the new column that will hold the unpivot text

    - "Value" is the name of the column that will hold the unpivoted values


    If you wanted to lock your code to make sure that no other columns were ever unpivoted,
    you would need to change this from the Table.UnipivotOtherColumns function to
    use the Table.Unipivot function.


    Like Table.UnipivotOtherColumns takes four parameters:


    +   - The step you want to unipivot: #"Changed Type"

    - A list of the columns you want to unipivot: {"Total"}

    - The name of the column to hold the unpivoted text: "Attribute"

    - The name of the column to hold the unpivoted values: "Value",


    So the overall formula would read as follows:


    ```

    =Table.Unipivot("Changed Type", "Total", "Attribute", "Value")

    ```


    And the effect would look exactly the same as the version that was produced above
    with the original code. The difference is that if any other column added to the
    source data after the fact would not also get the unpivoted upon refresh.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_64_0.png)


    > In order to lock the unipivot of multiple columns, you just provide the full
    list of the columns to unipivot between the () characters, with each column header
    surrounded in quotes and separated by commas,'
