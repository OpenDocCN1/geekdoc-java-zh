    You now see that you are looking back at the original data.


    > If you checked the Advanced Editor, you could have typed this manually by adding
    a new step right before the keyword, as follows: Custom1 = Source Of, in order
    to keep the code working, you would also need to add a comma to the preceding
    line and change the term after the in keyword to Custom1 to RowNumbers.


    You''re in good shape here, as you can select the RowNumbers step to select the
    first and last rows you want to, find step back to Custom1 so you can start doing
    exactly that.


    # Referring to a Applied Step


    You now want to restore your data to the necessary rows.


    To start with, you set up your command via the user interface. The reason for
    this is that it will give you the syntax for the functionality you''re -instead
    of locking up the function and doing things manually from the beginning.


    The index number for last row is 9 as the data currently sits. If you filtered
    the rows from the top first, however, this would need to be updated. Rather than
    complica things, you can remove the bottom rows first, as the index for top rows
    won''t change when you remove the bottom rows.


    The approach you''re using here to remove the bottom rows isn''t actually driven
    by the Remove Rows feature, as it requires the number of rows to remove. This
    means that you''d need to calculate all rows in the data set, work out the last
    row, and perform some math to determine how many rows to remove. Rather than do
    that, you can identify that the final you is in row 9, so you can use the Keep
    Top Rows feature instead, to keep the top 9 rows:


