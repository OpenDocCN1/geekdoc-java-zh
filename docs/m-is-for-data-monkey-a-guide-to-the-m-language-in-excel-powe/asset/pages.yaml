  md: '# Chapter 14 Grouping and Summarizing


    Let''s circle back for a moment and look at what happened first and then look
    at what you got from it.\ formula you use examines a table and extracts the max
    value from the given column. For the parameters, you provide the [Details] column
    of the query, as that holds the tables to be examined. The column within that
    table, amount, was provided, wrapped in quotes as the function requires.


    Unlike formulas you''ve seen, this function doesn''t return just the value. It
    returns a record.

    This is fantastic because the record doesn''t hold the maximum value. It holds
    all of the details that go with that data point.


    > You''ll learn more about records in Chapter 19.


    In addition, you can expand the MaxRecord column using the double-headed arrows
    on the top right to get the individual components into:


    +   * Click the Arrow on the MaxRecord column

    * Expand the ProductName and Amount columns and uncheck the Prefix option at the
    bottom → OK

    * Right-click the Details column → Remove

    * Right-click the Product column → Rename → TopSeller

    * Right-click the Amount column → Rename → TopSeller


    The result is now you have a table that summarizes sales by Date and Channel and
    clearly shows the top-item, as well as its contribution:


    | Date | Channel... | Pro... | Sales $ | TopSeller | TopSeller |

    |---|---|---|---|---||

    | 1 | 3/6/2015 Reseller | | | 164.7 Cap Seller | 164.7 |

    | 2 | 3/6/2015 Online | | | 180.43 Short Seller | 180.43 |

