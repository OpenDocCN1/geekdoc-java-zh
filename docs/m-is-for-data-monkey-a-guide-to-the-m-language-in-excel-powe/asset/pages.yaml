    Follow these steps to see how Power Query handles:


    +   - Select a cell in the data -> create a new query -> From Table

    - Change the query name to pqnfind


    Before you add the custom column, you should know that the new name for FIND in
    Power Query is Text.PositionOf(). By the syntax of the FIND() function, that means
    you should be able to go with this:

    Text.PositionOf("o", [Word])


    Try:


