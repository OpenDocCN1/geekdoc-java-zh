  md: '# Chapter 13 Loading Data from Exchange


    In the past, to get data out of Microsoft Exchange was an absolute nightmare.
    It involved complex VBA scripts, significant development, and painful maintenance.
    The unfortunate part of that there was a significant amount of information buried
    in your email and calendar that can add great business value to you, but with
    it being so difficult to get, it was a nonstarter. Power Query has changed, allowing
    an easy way to connect to your Exchange database and starting out pulling key
    drivers that can impact your business intelligence solutions.


    # Accessible Data


    There are five main aspects that you can connect to in your Exchange database:


    +   - Mail

    - Calendar appointments

    - People

    - Tasks

    - Meeting requests


    Each of these can be pulled to Power Query, cleaned and turned into a table, and
    then served up to a table or the Power Pivot Model.


    The most difficult question to wrap your head around related to Exchange as a
    data source is not how to connect to it rather why you would want to. The main
    reason for this is that you''ve never had the ability, or you haven''t thought
    about it much. Considering the following scenarios and how to connect to your
    Exchange server could be used in your organization.


    # Aggregating Survey Data


    With Power Query to read email, you could create a simple survey with a table
    in the body and send it out to your audience. You can then use Power Query to
    read all replies, extract the information from the individual tables, and combine
    the tables into a data source. Better yet, you don''t have to worry if someone
    sends in a copy late, you can just refresh the data source to pull it in.


    # Aggregating Budget Requests


    It''s a common practice for accountants to send Excel books to key personnel and
    ask them to fill in budget information via email. What if you then use Power Query
    to scan for all emails with a certain subject and/or attachment and then open
    and combine each attachment to extract the data? This is entirely possible with
    Power Query.


    # Building an IT Alert Dashboard


    In IT, we get numerous alerts from various servers and pieces of equipment. Some
    are informational and critical, but depending on the volume of equipment you have
    and the frequency of alerts, they can quickly turn into information overload.
    Often these emails are automatically routed to a folder and ignored. Think about
    this: You can now use Power Query to aggregate the alerts, the chart value and
    severity, and build an systems alert dashboard from previously useless email.


    # Endless Possibilities


    For matching and contacting details to appointments and emails, the real question
    today is not if you can use this feature but how. You might need a dashboard of
    interaction you have with a client, or you need to track who replied to a critical
    email you sent out. There is a ton of valuable information sitting in your inbox
    that you now have access to a way you never did before.


    # Building an Email Dashboard


    For this example, you''ll take the role of a website owner to see how previously
    useless email can be turned into something interesting. While you won''t be able
    to replicate the steps in this chapter yourself (they are'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 112 M is for (Data) Monkey


    specific to the website owner''s inbox), you''ll see the process used to strip
    key information out of previously unread emails to drive a dashboard.


    To begin with, you need to connect to Microsoft Exchange. This is done via the
    following process:


    +   - Create a new query -> From Other Sources -> Microsoft Exchange

