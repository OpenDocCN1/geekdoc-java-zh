  md: "# Chapter 18 Conditional Logic in Power Query\n\nYou may get a different time\
    \ format, like 18:00:00 instead of 6:00:00 PM, depending on the regional settings\
    \ in your computer.\n\nThis is fantastic, it means you can now do some other tests\
    \ to work out what you really want to know.\n\n# Replicating Excel's IF() Function\n\
    \nYou've got something using simple logic: if the Custom column contains null,\
    \ then give us the value in the Out column.—if it doesn't, return null.\n\nThis\
    \ should be pretty—just create a custom column and use the following function,\
    \ right?\n\n```\n=IF([Custom]=null, [Out],null)\n```\n\nNot so fast! That isn't\
    \ going to work.\nPower Query doesn't use the same syntax as Excel does for its\
    \ IF() function, either. Instead, the Power Query syntax is:\n\n```\n=if <logical_test>\
    \ then <result> else <alternate_result>\n```\n\nYes, you're reading that. You\
    \ actually have to spell the whole thing out for Power Query. Try it:\n\n+   -\
    \ Add Column \rightarrow Add Custom Column\n- Set the column name to Employee\n\
    - Enter the following formula:\n- = if [Custom]=null then [Out] else null\n- Click\
    \ OK\n\nThe column is added to the data, and you can see some real potential here:\n\
    \n| Out | Reg Hrs | OT ... | Misc | Exp... | Custom | Employee |\n|---|---|---|---|---|---|---||\n\
    | John Thompson | | | | | | null |\n| 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00:\
    \ PM | null |\n| 6:00 PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00: PM | null |\n| 6:00\
    \ PM | 8.50 | 0.00 | 0.00 | 0.00 | 6:00: PM | null |\n| 6:00 PM | 8.50 | 0.00\
