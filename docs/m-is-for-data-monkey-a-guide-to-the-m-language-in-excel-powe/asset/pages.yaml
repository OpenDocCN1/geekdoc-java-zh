    # # Observations


    It is a real shame that not all the functions in Power Query have full equivalency
    with those in Excel, especially since Power Query is a tool for Excel users. Hopefully
    this will change in future versions; we''d like to see a new library of functions
    added that allow you to put your names and syntaxes existing Excel formula knowledge
    directly into Power Query without needing to learn new formula names and syntax.
    That time, however, it is important that you test the results from the Power Query
    functions that seem to Excel''s equivalents and make sure they match what you
    expect, as you will occasionally have to tinker with the output to get it to line
    up correctly.'
