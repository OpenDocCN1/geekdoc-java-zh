    | 01/10/2006 | 135 | 00 | GIO | Changed Type |

    | 01/11/2006 | 3,276 | 19 | GIO | |


    Figure 87 The data didn''t split as well you''ve intended.


    This is not a big deal, as you can try again by refining your original efforts:


    +   - The Changed Type step

    - Click the gear beside the Split Column by Position step

    - Change it to 15 -> OK


    The result looks much better:


    | Column1.1 | Column1.2 | Column1.3 | Column1.4 | PROPERTIES |

