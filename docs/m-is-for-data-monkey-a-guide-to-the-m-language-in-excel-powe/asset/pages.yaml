  md: '# Chapter 3 Basic Append Operations


    Now you are see an unfortunate issue with Power Queries. When you look at the
    worksheet that holds your PivotTable, the query (and, therefore, the Excel table)
    does hold 604 rows—the combined of the three previous data sets. The PivotTable
    has not changed:


    | | A | B | C | D | E | F | G | |

