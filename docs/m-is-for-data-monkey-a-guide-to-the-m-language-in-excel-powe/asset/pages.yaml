    these ranges and turn them into clean tables, but the good news is that it can.
    To clean up this particular set, follow these steps:


    +   - Go to Home → Remove Rows → Remove Top Rows → 2 → OK

    - Transform → Use First Row as Headers

    - Filter the Cell Number column → uncheck null

    - Right-click the Number column → Change Type → Whole Number

    - Select the Cell Number column

    - Go to Home → Remove Errors → OK

    - Select the Cell Number column → hold Shift → select the Service column

    - Right-click one of the selected column headers → Remove Other Columns

    - Change the query name to AllSheets → OK

    - Go to Home → Close & Load


    When working with prints, it is a good idea to restrict a print area to only the
    rows and columns you—need. The first reason is that it takes Power Query longer
    to process more data. The second reason is that each column is just referred to
    as Column1 in the expansion window, which makes it very easy to filter extraneous
    columns that need to be removed.


    # Aggregating Data from Other Workbooks


    Say that you are building a solution that relies on data stored in other Excel
    workbooks. In this case, the user is storing data in worksheets with the month
    and year, but only one quarter per workbook. Those are stored in a folder, and
    you need to consolidate the data within them.


    The methods used earlier in this chapter have been targeted at the objects inside
    the current workbook, and they don''t work when you''re talking to external workbooks.
    Instead, you actually need to generate a list of Excel workbooks and extract their
    contents, similar to what you did in Chapter 4 when you extracted the contents
    of csv files.


