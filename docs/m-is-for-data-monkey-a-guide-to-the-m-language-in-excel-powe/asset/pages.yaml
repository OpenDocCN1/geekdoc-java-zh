    # # Splitting Columns by Delimiter


    The re-aggregated data makes it clear that the new merged column is delimited
    by the character -. This means you have something you can use to break apart into
    its components. One thing to take into consideration is if you don''t know who
    is a vendor who uses a hyphen in their name, so you don''t want to go against
    with a split based on a character-. Follow these steps:


    +   - Right-click the merged column -> Split Column -> By Delimiter

    - Choose -> Custom- from the list of delimiters and enter a - (minus sign)

    - Choose to split at the Left-most delimiter


    > You are not limited to delimiters of a single character when splitting by delimiter.
    In fact, if you want to split by any word, you can enter that word as your delimiter.


