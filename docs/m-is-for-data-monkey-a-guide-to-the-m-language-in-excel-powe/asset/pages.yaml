    And now you return to one of the two appended queries to see the effects. No matter
    which you choose, you''ll find that the values in the Date column show properly
    defined as Date types.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_110_0.png)


    | Date | Inventory Item | Sold By | Cost | Price | Commission |

    |---|---|---|---|---|--|

    | 6/26/2014 | Bubby Turtle | Fred | 8 | 30 | |

    | 6/26/2014 | Parrot | Jane | 17 | 32 | |

    | 6/20/2014 | Rambunctious Puppy | Fred | 9 | 30 | |

    | 6/21/2014 | Lovable Kitten | John | 12 | 45 | |


    Figure 14 The data type is now applied to the append query''s column.


    # Data Type Best Practices


    While it is tempting to rely on Power Query to assign data types and continue
    on, we strongly recommend that you review the final set of every output query
    and define your data types. Even though Microsoft is constantly improving the
    interface, there are still stands in the Power Query interface that will return
    an Any type, even if it was defined before.


    Until recently, an example of this was creating a month end from a date. Even
    though the column with the date was returned a value that looked like a Date but,
    in fact, an Any. This specific issue is now fixed, and there are bound to still
    see issues like this in the program.


    In addition, there are also commands that will not run on columns where the data
    type is defined as Any. One command is the Replace Values, which''s always find
    values. If the column is converted to Text, however, the command functions properly.


    As you''ve seen, the risk of having your data defined as Any data type can cause
    issues in both Excel and Power Pivot, and these problems manifest in different
    ways. Remember that if you fixed the two queries in this chapter simply by changing
    the updating data type. The flip of this side is that it will be easy as break
    when modifying an output query and cause the query to render Any data types. The
    amount of effort compared to the peace of mind, it is highly recommended that
    you create a habit of defining data types for each every column as the final step
    of a production query, even if the data types have been defined earlier. While
    it might seem tedious, remember that it is a one-time task for a query that could
    be rerun every single day of the month.'
