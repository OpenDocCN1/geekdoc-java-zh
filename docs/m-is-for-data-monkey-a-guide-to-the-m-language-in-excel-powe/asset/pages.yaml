  md: "# Understanding the pqVLOOKUP Function\n\nSo does the pqVLOOKUP function work?\
    \ Take a look at the code:\n\n```\n(lookup_value = any, table_array as table,\
    \ col_index_number as number,\noptional approximate_match as logical) as any =>\n\
    let\n  /*Optional match if user didn't */\n  matchtype = =\n    if approximate_match\
    \ = null\n    then true\n    else approximate_match,\n  /*Get name of return column\
    \ */\n  Cols = Table.ColumnNames(table_array),\n  ColTable = Table.FromList(Cols,\
    \ Splitter.SplitByNothing(), null,\n    null,ExtraValues.Error),\n  ColName_match\
    \ = Record.Field(ColTable(0),\"Column1\"),\n  ColName_return = Record.Field(ColTable(col_index_number\
    \ - 1),\n    \"Column1\"),\n\n  /*Find closest match */\n  SortData = Table.Sort(table_array,\n\
    \    ({ColName_match, Order.Descending}}),\n  RenameLookupCol = Table.RenameColumns(SortData,\
    \ {{ColName_match, \"Lookup}}),\n  RemoveExcess = Table.SelectRows(\n    RenameLookupCol,\
    \ [Lookup] <= lookup_value),\n  ClosestMatch=\n    if Table.IsEmpty(RemoveExcess)=true\n\
    \    then \"#N/A\"\n    else Record.Field(RemoveExcess(0),\"Lookup\"),\n\n  /*What\
    \ should be returned in case of approximate match? */\n  ClosestReturn=\n    if\
    \ Table.IsEmpty(RemoveExcess)=true\n    then \"#N/A\"\n    else Record.Field(RemoveExcess(0),ColName_return),\n\
    \n  /*Modify result if we need an exact match */\n  Return = =\n    if matchtype=true\n\
    \    then ClosReturn\n    else\n      if lookup_value = ClosestMatch\n      then\
    \ ClosReturn\n      else \"#N/A\"\nin Return\n```\n\nThe code is fairly complex,\
    \ and it uses a variety of tricks, but the basic methodology is this:\n\n+   1.\
    \ Pull in the data table.\n2. Sort descending by the first column.\n3. Remove\
    \ all records greater than the value being searched for.\n4. Return the value\
    \ in the requested column for the first remaining record unless an exact match\
    \ was specified."
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Chapter 22 Advanced Conditional Logic


    5. If an exact match was specified, test to see if the return is a match. If it
    is, the value is it. If it is not, return #N/A.


    Note the following in the code:


    +   - Each of the values in the parameters has an explicit data type declared.
    This is to prevent the user from accidentally providing a table where numeric
    column number is required.

    - The approximate_match variable is defined as optional, meaning the user can
    ignore it.

    - The matchtype value is used to see if a match was specified. If a match was
    specified, it is assigned to the matchtype value, but if not (approximate_match
    is null), a value of true will be assigned.

    - The name of the column to be returned is pulled by reviewing the column headers
    of the table, splitting them into a list of records, and pulling out the record
    whose index matches the requested column (1 to adjust base 0).

    - The data is sorted in descending order, based on the column to be searched.
    All records greater than the requested value are removed (by selecting all rows
    where the value is less than or equal to the value being searched for).

    - If no match remains, a #N/A result is then returned, but if there are, the first
    record in the lookup column is returned later to see if it matches the record
    being searched for (which is important for the exact match scenario).

    - The approximate match value is then (always) calculated, even if an exact match
    was requested. If no rows are present in the data set, a #N/A result is returned;
    otherwise, the closest value is pulled from the return column.

    - The final test checks the type of match requested. If it is an approximate match,
    the closest match is always returned (which may be #N/A). The code will return
    #N/A instead of the closest column matched the value being sought


    It should go without saying that this is not a function you''ll knock out in a
    few minutes. It is long complex, and it took several hours of development and
    debugging to get it right. It is, however, a fairly robust function in the way
    it works, and it shows how to build complex functions using Power Query.


    # Replicating Pivot''s SWITCH()Function


    Power Pivot has a function SWITCH() that allows you to perform multi-condition
    logic by declaring a table of index values and results and then passing in an
    index value. The function looks up the provided index value and returns the matching.
    This is easier than nested levels of IF statements, which sometimes makes sense
    to replicate the SWITCH() in Power Query.


    The syntax for Power Pivot is as follows:


    ```

    =SWITCH(expression, value_1_result, [value_2_result],...,[Else])

    ```


    One example of where this can be useful is when breaking down patterns like customer
    by codes, where each represents something specific. To code a code like the MP1105ASP,
    where the third character could be one of the following:


    ```

    E = Employee, S = Yacht Club, N = Non-Taxable, R = Restricted,

    I = Inactive, L = Social, M = Medical, U = Regular

    ```


    There are several ways to achieve this goal. For example, extract just the first
    letter and merge the results against a table. The purpose of this section is give
    you yet another alternative.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Building a Power SWITCH() Function


    Building the function isn''t overly difficult once you know the basic structure.
    Here''s how you get started:


    +   - Open Ch22 Examples|Emulating SWITCH.xlsx

    - Create a new query -> From Other Sources -> Blank Query

    - Name the query frnSWITCH

    - Go to Home -> Advanced Editor

    - Enter the M code shown below:


    ```

    (input) =>

    let

    values = {

    result_1, return_value_1,

    (input, "Undefined")

    }

    Result = List.First(List.Select(values, each _(0)=input))

    inResult

    ```


    This code is the basic framework for any SWITCH() function. These are the key
    parts to recognize here:


    +   - result_1 is the first of the possibilities that you may pass to the function

    - return_value_1 is the value that you''d like to return if the first value is
    result_1

    - If you need more values, just insert another comma after the (result_1, return_value_1)
    section and put in a (result_2, return_value_2) section

    - You can keep as many values as you need

    - The value in the list will return the text Undefined if the value you pass isn''t
    in your provided list of options (it''s the Else of the SWITCH() function)


    Using this structure, you can modify the fnSWITCH function for your scenario as
    follows:


    ```

    (input) =>

    let

    values = {

    "E", "Employee",

    "S", "SCYC",

    "N", "Non-Taxable",

    "R", "Restricted",

    "I", "Inactive",

    "L", "Social",

    "M", "Medical",

    "U", "Regular",

    (input, "Undefined")

    }

    Result = List.First(List.Select(values, each _(0)=input))

    inResult

    ```


    The changes you made here simply to replace value_1 with "E" and return_value_1
    with "Employee" and to add more pair of potential inputs and desired values to
    return. Note that you''re not restricted to looking up single characters. You
    can look up values or longer strings just easily; just make that your options
    are always entered in pairs between curly braces and a comma at the end of the
    line.


    When you''re done making the modifications:


    +   - Click Done

    - Go to Home -> Close & Load'
  merge: -1
