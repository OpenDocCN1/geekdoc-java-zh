    # Creating Lists of Lists


    We mentioned earlier that it is possible to create lists of lists. This might
    seem like an odd concept, so let''s explore this scenario.


    Say that you have four employee IDs (from 1 through 4) involved in your sales
    table. These values represent Fred, John, Jane, and Mary, in that order. Wouldn''t
    it be nice to be able to convert those values to their names, without having to
    create a separate table? Follow these steps if you can use a list to do this:


    +   - Create a new query From Other Sources -> Blank Query

    - Create a new list in the formula bar:


    ```

    = {1,"Fred","2,"John","3,"Jane","4,"Mary"}

    ```


    Notice that you have four separate lists, each surrounded by curly braces and
    separated by commas. These four lists are in turn surrounded by a single set of
    curly braces, defining a list made up of four lists. When you commit this formula
    to the formula bar, Power Query gives you a list containing lists:


    | List | = {"1,"Fred","2,"John","3,"Jane","4,"Mary"} | Query Settings |

    | --- | --- | --- |

    | 1 | List | PROPERTIES |

    | 2 | List | Name |

    | 3 | List | Query1 |

    | 4 | List | All Properties |

    | | | APPLIED STEPS |

    | | | Source |

    | | | Converted to Table |

    | | | ExpandedColumn1 |


    Figure 234 A list of lists.'
