- img_proc: true
  md: '# Chapter 17 Power Query Formulas


    | Word | LEFT(x,4) |

    |---|---|

    | Football | Foot |

    | Doorknob | Door |

    | Bookkeeper | Book |

    | Automobile | Auto |

    | Mountain | Moun |

    | Truck | Truc |

    | Car | Car |


    Figure 20 A sample of the data you''ll work with.


    There is a set of words down the left column, and there are some extractions in
    the right column. Each of these extractions was performed with Excel formulas,
    using the function listed in the header of the second column.

    The following sections compare how to get Power Query to accomplish the same thing
    using different functions.


    > In August 2015, the Power Query team added the ability to extract the first
    character, the last character, and a range of characters to the Transform tab.
    Despite this, the following sections walk through the process of replicating and
    comparing these formulas to those of Excel as this not only provides an understanding
    of how to work with the M code formulas but also allows you to build more robust
    solutions than you can do with the user interface commands alone.


    # Replicating Excel''s LEFT(x) Function


    Follow these steps to pull the data into Power Query:


    +   * Select a cell in the table of data on the LEFT worksheet → create a new
    query → From Table

    * Rename the query pqleft

    * Go to Add Column pqleft → Add Custom Column

    * Call the new column pqleft(x,4) and enter the formula:

    =LEFT ([Word], 4)


    This should work, shouldn''t it? Power Query certainly isn''t indicating that
    it won''t:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_154_0.png)


    Figure 206 Power Query seems comfortable with the formula.'
