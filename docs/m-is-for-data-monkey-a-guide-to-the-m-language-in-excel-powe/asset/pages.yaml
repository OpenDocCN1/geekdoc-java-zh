- img_proc: true
  md: 'Click OK, and despite the green checkmark, things are not as good as you''
    hoped:


    > > Expression error: The name ''LEFT'' wasn''t recognized. Make sure it''s spelled
    correctly.


    Figure 207 You''re pretty well spelled left correctly.


    So despite the team you built for Excel, the design elected to use a completely
    different formula to refer to the x left characters of each. Here is a direct
    comparison of the syntax between the two programs:


    | Syntax | Example | Result |

    |---|---|--|

    | Excel | =LEFT(text,num_chars) | =LEFT("Excel",2) | Ex |

    | Power Query | =Text.Start(text,num_chars) | =Text.Start("Excel",2) | Ex |


    This means you need to edit the formula:


    +   * Click the gear icon next to the Added Custom step

    * Modify the formula to read as follows:

    =Text.Start([Word],4)

