  md: '# Chapter 10 Query Loading Destinations


    To link this data into the Pivot Data Model, which is anywhere inside the Sales
    table, go to the Power Pivot tab, and Create Linked Table. The end result is a
    data flow that follows this process: Excel table -> connection-only query -> append
    query -> Excel table -> Power Pivot


    > You might think it would be easier to go directly from your monthly sales tables,
    link both tables to Pivot, and create a relationship—avoiding the necessity of
    the append query. The issue is here that Power Pivot is great at creating horizontally
    (replicating VLOOKUP() functionality) but is poor at stacking two tables on top
    of each other (appending data).


    The challenges with this approach are two-fold:


    +   * Your data gets duplicated if it is loaded to the worksheet first and then
    to the Data Model.

    * Your Power Pivot tables are capped at a maximum of 1,048,575 rows of data (1
    less than the number of rows in the worksheet).


    So while this works and it is the supported method, using Power Query''s supported
    loading methods definitely has some drawbacks for serious developers.


    # Loading to the Data Model (Excel 2013+)


