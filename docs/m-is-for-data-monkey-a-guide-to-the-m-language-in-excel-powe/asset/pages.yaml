  md: '# M is for (Data) Monkey


    Remember that you can access the list of Power Query formulas by clicking the
    Learn About Power Query formulas at the bottom of the Custom dialog and clicking
    the Power Query formula link down the page. You will end up at https://msdn.microsoft.com/en-us/library/mt296612.aspx
    page.


    Within the list, you will find there is a List.AnyTrue function, which seems somewhat
    promising. Selecting that item in the documentation reveals the following example:


    ```

    List.AnyTrue((2=0, false, 1 < 0)) equals false

    ```


    Based on this, you will see that the function contains a list of values, as indicated
    by the curly braces within the parentheses. it also shows that the function will
    return false if none of the items are true.


    Try to nest this formula in the logic of the test:


    ```

    =if List.AnyTrue(

    ([Item]="Talkative Parrot",[Sold By]="Fred")nthen "Meets Criteria!"

    else "No Match"

    ```


    Remember that you need to separate the criteria with commas and then surround
    the entire list of criteria with curly braces because the List.AnyTrue() function
    requires a list as a parameter.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_207_0.png)


    Figure 289 Replicating Excel''s OR() function using List.AnyTrue().


    Since the functions return true if any of the criteria are true, any instances
    where Fred sold a Talkative Parrot would also display the result Meets Criteria!
    in the Match column.


    You can now finalize this query by taking the following steps:


    +   - Filter the Match? column to include only Meets Criteria! values

    - Change the query name to pqOR

    - Go to Home -> Close and Load


    Power Query returns a table containing of 88 rows out of the original 332.


