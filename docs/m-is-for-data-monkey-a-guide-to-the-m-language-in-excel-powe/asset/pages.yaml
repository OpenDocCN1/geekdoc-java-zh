  md: 'Chapter 8 Importing from Databases


    # Using SSAS as a Source


    SQL Server Analysis Services (SSAS) is one of the sources that you might find
    in a corporate environment. SSAS can be divided into the tabular and multidimensional
    models, both of which can easily be pulled into Power Query.


    > Please note that all numbers used in the following data set are completely fictitious
    and randomly seeded in the database.


    # Connecting to SSAS Sources


