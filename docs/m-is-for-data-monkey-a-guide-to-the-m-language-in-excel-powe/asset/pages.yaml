  md: 'You can see that the feature at this time is very limited. The Advanced Editor
    is essentially a text editor with a syntax checker in the bottom-left corner.
    This area will not doubt some investment in future, but right now it is essentially
    just a text box.


    > Before get frustrated trying to resize the editor to the image shown above make
    it as small as above, be aware that you can (We shrunk it with photo editing to
    save page.). The Advanced Editor can be expanded to make bigger, but it won''t
    collapse more than the default size when you first open it.


    Take a look at the code inside the window shown above:


    ```

    let

    Source = Excel.CurrentWorkbook()[[Name="Sales"][Content]]

    inSource

    ```


    There are some key pieces here that are required to build a successful query,
    so we''ll break this down line by line.

    The first line of every query must begin with the word line. (This changes for
    functions, which are covered in Chapter 21.) Nothing else on this line at.

    The second line begins with the word Source. This is important, as this is the
    step name from the Applied Steps box. In this case, this step name that you can
    work out line of code relates to the step you want to examine. Excel.Workbook(k)
    function. It then appended a list of the records (the Excel table) that it imported.
    Power invoked it, drilled it into the records for that table object.

    The second-to-last line of every query is the sole word.

    The last line is a query that refers to the step containing the output you''d
    like to return at the end of the query. This is usually the previous step but
    doesn''t have to be.

    Now you can add another step to this query:


    +   - Close the Advanced by clicking Done

    - Right-click the Price column -> Change Type -> Decimal Number

    - Go to Home -> Advanced Editor


    You can see that a new step has been added to the window:


    ```

    let

    Source = Excel.CurrentWorkbook()[[Name="Sales"][Content]]

    #"Changed Type" = Table.TransformColumnTypes(Source,"Price", type number})

    in

    #"Changed Type"

    ```


    Figure 257 A new step has been added to the query.


    There are a few things worth noting. First, a comma has been added to the end
    of the Source line. If you check back to the prior code, you''ll see that was
    not there.) This is incredibly important: Every line between the line and lines
    must have a comma, except the last line before the in line, which can never have
    a comma at the end. In this case, the Source line ends with a comma, but the #"Changed
    Type" line does not, at the end.


    > To put this in Query terms, you are providing a list of steps between the in
    and lines. As you know, all items in a list need to be separated from each other
    via comma, but you don''t put a comma at the end.


    # The Meaning of "#syntax"


    The second thing you should notice in the previous screenshot is that the step
    reads Changed Type in the Applied Steps box but comes into the code as #"Changed
    Type"'
