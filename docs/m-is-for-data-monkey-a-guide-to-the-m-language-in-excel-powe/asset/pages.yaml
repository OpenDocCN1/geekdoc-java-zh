    # Merging File Properties with Binary Content


    At this point you are ready to merge the month-end dates with all the rows inside
    the binary files. The big challenge is that clicking the Combine Binaries button
    throws away the Date column you worked on. So you need to extract the contents
    of each binary file. Here''s what you do:


    +   - Go to the Add Column tab -> Add Custom


    +   - Enter the formula:

    `=Csv.Document ([Content])`


    +   - Click OK


    > Power Query formulas are case sensitive, so make sure that everything is c correctly,
    or it won''t work.


    > If you don''t want to type a long field name, you can just double-click it in
    the field list when you are building your custom formula. This will place the
    field in your list, surrounded by square braces.


    The result is a new column Custom, which is filled with a bunch of tables:


    | Date | Content | Custom |

    |---|---|---|

    | 1 | 2/29/2008 Binary | Table |

    | 2 | 1/31/2008 Binary | Table |

    | 3 | 3/31/2008 Binary | Table |

    | 4 | 4/30/2008 Binary | Table |

    | 5 | 8/31/2008 Binary | Table |


    Figure 56 A column of tables.


    Stop and think about that for a second. The Csv.Document() function is the function
    you can use to turn the contents of a binary file into a table. [Content] simply
