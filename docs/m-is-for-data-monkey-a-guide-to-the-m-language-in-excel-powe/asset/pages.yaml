  md: '# Chapter 1 Importing Basic Data


    Take another look at the Applied Steps box now. If you were watching closely as
    you did, you would have noticed a new step was created when you renamed the Date
    column. But another step was not created when you renamed the Amount column. Instead,
    the two steps were merged together. Power Query tries to keep things efficient
    by merging operations as you are building a query.


    The query is looking pretty nice, but what if you don''t agree with Power Query''s
    data type choices? For example, the Account and Dept column values should be formatted
    as text, not numbers. Fixing this is no problem:


    +   * Select the Account

    * Hold the Ctrl key and select the Dept column

    * Right-click each column header → Change Type → Text


    The Account and Dept fields are now aligned to the left of the column, which indicates
    that they are formatted as text, consistent with Excel. You can also add a new
    step in the Applied Steps box, called Type1:


    | Date | Account | Dept | Amount |

    |---|---|---|---|

    | 1/12/2019 | 65110 | 150 | (22.07) |

    | 2/12/2019 | 65120 | 150 | (151.82) |

    | 3/12/2019 | 65130 | 150 | (12.4) |

    | 4/12/2019 | 65140 | 150 | (0.9) |

    | 5/12/2019 | 65150 | 150 | (61.87) |

    | 6/12/2019 | 65160 | 150 | (1.6) |

    | 7/12/2019 | 65170 | 150 | (127.03) |

    | 8/12/2019 | 65180 | 150 | (283.84) |

    | 9/12/2019 | 62020 | 150 | (241.45) |

    | 10/12/2019 | 62099 | 150 | 18.4 |


    Figure 14 The data set, looking all pretty and ready for loading.


    So why didn''t the type changes merge back into the original Changed Type step?
    The answer is that Power Query doesn''t know if you did something important in
    the preceding step, so it reacts the safe way and creates a new step.


    Power Query essentially works as a sequential macro recorder: it will execute
    exactly these steps, in order, each time you refresh the data.


    # Load


    It''s now time to finalize the query, with the load step. Before you commit your
    query, you should give it a more descriptive name than the data. Excel will use
    the name you provide here as the name of your output table or query. Follow these
    steps:


    +   * Change the name from Ch01-Delimited to Transactions

    * Go to the File menu → Close & Load


    By default, the data is loaded into an Excel table bearing the name of the query.
    You can actually see the table created in a gray color scheme and turn it green.
    Each query goes through this process whenever it is refreshed—first turning query
    and then turning when it is good to go.


    You''ll also notice a new task pane, the Workbook Queries pane, pop up on the
    right side of your Excel window. This useful interface provides you with key information
    about your queries (such as number of rows loaded and errors encountered), and
    it also allows you to locate and manage your queries in the future.'
  merge: -1
