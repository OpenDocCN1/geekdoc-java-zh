    # Exploring the Data


    After you click Edit in the Navigator, the first thing you will notice is that
    there are two steps in the Applied Steps window: Source and Navigation. If you
    select the Source step, you see that it goes back to the raw schema of the database,
    allowing you to see other tables, views, and objects in the database. The Navigation
    step then drills into the table you selected.


    The second thing you''ll notice is there is a lot of data here. You can thin it
    down by a bit:


