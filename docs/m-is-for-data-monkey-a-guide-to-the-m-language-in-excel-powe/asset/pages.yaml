    rechecks the (Select All) option, which is not going to help. You''re going to
    go a bit deeper to protect yourself here and force your filter to CSV.

    Before you do, however, you also need to guard against accidentally filtering
    out "CSV" when you filter for "csv" (as text filters are sensitive). To deal with
    this, follow these steps:


    +   * Right-click the Extension column -> Transform -> Lowercase

    * Select the Extension column''s filter arrow -> Text Filters -> Equals

    * Set the filter to .csv


    Don''t forget the period in front of the csv! If you forget it, you won''t get
    any files, as csv is not the same as csv.

    * Click OK

