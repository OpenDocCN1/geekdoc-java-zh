  md: 'Chapter 23 Dynamic Parameter Tables


    # Chapter 23 Dynamic Parameter Tables


    In Chapter 21 we explored how custom functions can be preprocess data sets to
    merging. While this is a fantastic benefit of custom functions, it is far from
    the only one.


    Consider the example in the last chapter, of putting timesheets from a folder.
    Say that you''ve built the master consolidation file, and saved it in H:\\Payroll,
    and for months have been storing the timesheets in the subfolder H:\\Timesheets.
    After working all year, you only get a few weeks off and to pass the solution
    to someone else maintain while you are rogue. There''s a problem, though: your
    system has the path to your solution mapped to J:\\Payroll. Rather record the
    solution for your replacement and have to code it when you return, you''d really
    like to make the path relative to the workbook located. That, if the user opens
    it up from J:\\Payroll or H:\\Payroll or something else, it shouldn''t make a
    difference.


    The real challenge? There is no function in the M language that allows you to
    work out the path to the workbook you''re using. Interestingly, an Excel formula
    can do this.


    > Before we embark on the journey of making the file path dynamic, there is something
    you should know about this technique: Queries where data access happens inside
    a function and where the data source is dependent on parameters to the function
    can''t be refreshed in Power BI. This is because Microsoft performs static analysis
    of the query to discover the data source, and the static analysis can''t yet handle
    this scenario.


    This does not mean that the functionality is not useful, and it doesn''t mean
    that it won''t be supported one day. It simply means that you should rely on it
    only if the solution is going to live in Desktop Excel and not on the web.


    # Implementing Dynamic Parameter Tables


    There are three steps to implementing parameter tables into your solution:


    +   1. Create a parameter table in Excel.

    2. Create the function to extract the values from the table.

    3. Retrofit your existing queries to call the function.


    We will walk through each step of this process using the Ch 23 Examples\ParameterTables.xlsx
    file.

    Upon opening this file, you''ll recognize that this file is a continuation of
    the Timesheet file you''ve built over a couple of chapters. The challenge with
    this file is that currently the paths are all hard coded to your PC, (the author''s
    in the case of the example file,) and you''d like to deliver the solution so that
    it works matter where you store it.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# # Step 1: Creating a Table


    The first thing you need is to create a table to hold your parameters. This table
    should have a specific form, and it needs to have certain components set up correctly.


    Create the table below in cell A7:B8 of the Info worksheet:


    | File | Home | Insert | Page Layout | Formulas | Data | Review | View | Developer
    | Power Pivot |

    |---|---|---|---|---|---|---|---|---|--|

    | Table Name: | Summarize with PivotTable | Properties | Header Row | First |

    | Parameters | Remove Duplicates | Open in Browser | Total Row | Last |

    | Resize Table | Convert to Range | Insert Slicer Refresh | Unlink | Banded Rows
    | Ban |

    | Properties | Tools | External Table Data | Table |


    | Parameter | Value |

    |---|---|n| File Path | |

    | | |

    | | |


    Figure 302 The barebones Parameters table.


    Notice several key characteristics of this table:


    +   - The first column''s header: Parameter

    - The second column''s header: Value

    - The table has a name of: Parameters


    > Each of these characteristics must be correct if you want to copy and paste
    a function you''ve been provided in the download files. If even one of these items
    is spelled differently, you will need to debug the table or the function.


    The table is now set up to hold every piece of data that you want to use as a
    dynamic variable in your solution. Simply provide the name of the parameter on
    the left and the value for the parameter in the Values column.


    > The items in the Values column can be hard coded text or values, they can be
    driven by data validation lists, or they can use formulas. How you get the correct
    value in the cell is completely up to the solution designer.


    Next, you need to determine the file path to the current workbook. Enter the formula
    below into cell B8:


    ```

    =LEFT(CELL("filename", A1), FIND("", CELL("filename", A1), 1)-1)

    ```


    > If you haven''t saved your file, this function won''t return the path as it
    can''t determine where the workbook lives. Saving the file will fix this issue
    for you.


    Upon doing, you will see the file path to the workbook. The only challenge is
    that you actually want this file path to point to the Source Files folder, where
    is the timesheets are stored. Update the formula as follows:


    ```

    =LEFT(CELL("filename", A1), FIND("", CELL("filename", A1), 1)-1) &Source Files\

    ```


    | Parameter | Value |

    |---|---|n| File Path | D:\pqTraining\MCh 23 Examples\Source Files\

    | | |

    | | |


    Figure 303 Dynamically returning the file path using an Excel formula.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 23 Dynamic Parameter Tables


    # Step 2: Implementing the fnGetParameter Function


    With the parameter name in a state that can hold any variable, you need to give
    Power Query a method to read those values. This portion can be done by using the
    following custom function:


    ```

    (ParameterName as text) =>

    let

    ParamSource = Excel.CurrentWorkbook())

    [Name="Parameters"][Content],

    ParamRow = Table.SelectRows(ParamSource,

    each ([Parameter]=ParameterName),

    Value=

    if Table.IsEmpty(ParamRow)=true

    then null

    else Record.Field(ParamRow(0),"Value")

    in

    ```


    > This function is contained in the fnGetParameter.txt file in the Ch23 Examples
    folder. In addition to the code, it also contains instructions to use the function,
    as well as the formula to return the path from a cell. The file is provided to
    give you a template you can store and use multiple times.


    This code connects to the Parameters table in the workbook and then selects the
    row of the table where the dynamic parameter''s value matches the record in the
    Parameter column of the Excel table. With that match in place, it returns what
    it finds in the Value column. It is because each of these names is hardcoded in
    the function that both the table and column names for the Excel table match what
    was specified above.


    Rather than retype this entire block of code, open the Ch23 Examples\fnGetParameter.txt
    file and copy all lines inside the file. With the paste buffer, it will be deadly
    simple to implement this function into your solution:


    +   - Create a query -> From Other Sources -> From Blank Query

    - Go to Home -> Advanced Editor

    - Highlight all rows of code in the window

    - Press Ctrl+V to paste in the content of the text file

    - Click Done

    - Change the function''s name to fnGetParameter


    And you''re done.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Step 3: Calling the fnGetParameter Function


    With the parameter table built, and the function in place, the last step is to
    retrofit the query to actually use it. Doing so will allow you to source the file
    path from the cell and use that in your query. Because the file path updates when
    the workbook is recalculated, it will always be accurate, which means the solution
    will always look for the timesheet files in the subdirectory of where the solution
    resides.


    To retrofit the Timesheets query, you don''t even have to leave the Power Query
    Editor. You can just click the little arrow on the left next to the Queries to
    expand the Navigator:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_221_0.png)


    Figure 304 Expanding the Navigator window.


    The Navigator allows you to select any of your queries or functions, so you can
    quickly flip back and forth, making changes and testing the effects that they
    have on other queries. Here''s what you do now:


    +   - Right-click the Timesheets query → Advanced Editor

    - Insert the following line of code immediately after the let line:


    ```

    fullfilepath = fnGetParameter("File Path"),

    ```


    The query should now look like this:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_221_1.png)


    Figure 305 calling the fnGetParameter function.


    You have created a new variable fullfilepath to hold the value from the File Path
    row of the Excel table.

    It is also worth noting that you are not strictly required to create a new variable
    in order to use your function. You could skip this and just nest the fnGetParameter
    call in place of the file path on the next row. By adding this on a separate line,
    however, you make the query easier to debug, as you''ll see now:


    +   - Click Done

    - Select the fullfilepath step in the Applied Steps box


    The full file path to the folder is displayed nicely in the editor, giving you
    the comfort that you have that part correct:'
