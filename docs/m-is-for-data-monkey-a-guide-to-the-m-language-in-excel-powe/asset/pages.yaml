  md: '# # Chapter 7 Importing Nondelimited Text Files


    One of the biggest challenges for many Excel pros is importing and cleaning nondelimited
    text files. If you''ve ever dealt with these, you know how painful it can be.
    They typically arrive with some default name like ASCII.TXT and are essentially
    character-by-character representations of what the output should look like when
    printed. they are subject to all kinds of crazy issues, including the following:


    +   * Characters aligned by position instead of delimited by a character

    * Inconsistent alignment

    * Nonprinting characters (such as controls)

    * Repeating header rows


    A major part of the job for many Excel pros is importing this type of information
    into Excel and cleaning it. And all of this has to happen *before* that you get
    to the analysis that adds business value.


    If you''ve been there, you know the process follows this general flow:


    +   1. Import the file into Excel Data -> From Text.

    2. Work in a postage stamp-sized Import Wizard window, trying to determine how
    the columns are delimited and which to skip.

    3. Dump the results of the Import Wizard into a worksheet.

    4. Turn the data into a proper table Excel.

    5. Sort and filter the table to remove garbage rows.

    6. Clean and trim the text in the columns.


    And the best part is that next month, when you get the updated data file, you
    get to relive this exciting process all over again. Wouldn''t it be better if
    there were a better way? Great news! Here is, and you''ve found it.


    # ## Connecting to the File


    You connect to a nondelimited file the same way as you connect to any other text
    file:


    +   * Create a New Query -> From File -> From Text

    * Browse to Ch07 Examples -> GL Jan-Mar.TXT


    Power Query puts the data in a single column:


    | Column1 | XYZ Company Ltd. | Pg 1 | PROPERTIES |

    |---|---|---|---|

    | 2 | | | Name |

    | 3 | Detailed Ledger Detail with Change for Aug 2004 to 2009 | | GL-Mar |

    | 4 | | | All Properties |

    | 5 | Account | Begin | Final | APPLIED STEPS |

    | 6 | Description of Account | Balance | Change | Source |

    | 7 | | | | |

    | 8 Jan 2006 | | | | |

    | 9 123-03 | Purchases | 0.00 | 214,861.77 | 21 |

    | 10 | | | | |

    | 11 | Tran Date | Tran Amount | Source Reference Information | Veil |

    | 12 | 01/02/2006 | 4,429.36 | G0001 | Food Purchase-Douglas | |

    | 13 | 01/09/2006 | 0,450 | G0002 | User-Direct | |


    Figure 84 The Power Query view of a nondelimited text file.


    The first benefit you''ll notice over the standard Excel import is that you get
    in a full-sized window. That''s a massive improvement on all its, as you can actually
    see what is going on.


    > > If the column is too narrow, just mouse over the right side of the column
    header, hold down the left mouse button, and drag it wider.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'You''ll also notice, since the file is not delimited with any consistent delimeters,
    Power Query has made any guesses about your data. Instead, it leaves the entire
    process to you. Given the state of this file, that probably is not a bad thing.


    Before we get any further into this, note that there are many ways to import nondelimited
    text files, and none of them are right or wrong. The example in this chapter has
    been architected to show a great deal of transformations via the user interface,
    as well as the typical way an Excel might approach this task. With more experience,
    you''ll find that quicker routes to the goal are almost certainly possible.


    # Cleaning Nondelimited Files


    The general goal when starting to clean a nondelimited file is to get the data
    into a semblance of columnar data as quickly as possible. In this case, the top
    10 rows don''t seem to add much value, while the 11th row might be column headers.
    Therefore, go to Home -> Reduce Rows -> Remove Rows -> Remove Top -> 10.


    The rows disappear and will not be imported into the solution:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_67_0.png)


    Figure 85 The top rows are removed, bringing the headers to the top.


    Next, you need to choose a direction to break into this data. You could try breaking
    in the left or right, but currently there are a ton of extra leading spaces, and
    there are duplicated spaces in the middle. It would be nice to rid of those.


    In Excel it is a standard practice to run textual data through the TRIM() and
    CLEAN() functions in order to remove all leading, trailing, and duplicate spaces,
    as well as remove nonprinting characters. Power Query also has this functionality,
    and here''s how you can apply that:


    +   - Right-click Column1 -> Transform -> Trim

    - Right-click Column1 -> Transform -> Clean


    The data looks a bit better:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_67_1.png)


    Figure 86 Data trimmed and cleaned.


    At this point, you may notice that Power Query''s trim functionality doesn''t
    work the same as Excel''s. While Excel''s TRIM() function removes all leading
    and trailing spaces and replaces any duplicate spaces in'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Chapter 7 Importing Nondelimited Text Files


    the middle of the data with a single space, Power Query doesn''t do that last.
    Instead, it only trims the leading and trailing spaces.


    The CLEAN function in Power Query does line up with Excel''s, although it''s more
    difficult to see. Nonprinting characters are rendered as a little question mark
    in a box within the Excel interface. In Power Query they show as a space. Regards,
    if you step back and forth between the spaces around & & Davis have been cleaned
    away by the Trimmed Text and Cleaned text in the Applied Steps,


    # Splitting Columns by Position


    The next step is to start splitting columns. The basic approach at this point
    is to split by the number of characters, making an educated guess about how many
    you need and then refining it. Given the number of characters in the date is 10
    characters, you can try 12 for a first:


    +   - Go Home -> Split Column -> Number of Characters -> 12 -> Repeatedly -> OK


    That didn''t work out! As you can see, the date may be fine, but the others aren''t:


    | Column1.1 | Column1.2 | Column1.3 | Column1.4 | PROPERTIES |

    |---|---|---|---||

    | Tran Date | Tran Amou | nt | Sou | Name |

    | 01/02/2006 | 4,429 | 36 | GIO | GL Jan-Mar |

