- img_proc: true
  md: '# Chapter 6 Unpivoting Data


    One of the big issues Excel pros face is that no matter where we get our data,
    it doesn''t always arrive in a useful state. So not only do we waste time getting
    the data into a workbook to begin with, then we have to spend even more time cleaning
    it and changing its layout in order to work with it.


    # The Curse of Pivoted Data


    Say that a user has started tracking his sales on a daily basis, and he sends
    his data to the format shown below:


    | Sales Category | 1/1/2014 | 1/2/2014 | 1/3/2014 | 1/4/2014 | 1/5/2014 | 1/6/2014
    | 1/7/2014 | Total |

    |---|---|---|---|---|---|---|---|--|

    | Beer | 103 | 243 | 101 | 137 | 53 | 105 | 111 | 983 |

    | Wine | 175 | 223 | 138 | 57 | 66 | 199 | 83 | 941 |

    | Liquor | 162 | 207 | 103 | 179 | 150 | 147 | 180 | 1,128 |

    | Total | 440 | 673 | 342 | 373 | 319 | 531 | 374 | 3,052 |


    Figure 76 The dreaded data set.


    Naturally, after tracking his sales in for days or weeks, he brings it to you
    and allows you to build a variety of different reports from it. The order to this
    dilemma is, of course, to build PivotTables against the data source. The issue
    is that this data set is already pivoted.


    This problem comes for us all the time. PivotTables were built to quickly turn
    tables into data that users can easily consume. The challenge is that users think
    in this kind of output format, not in tabular format, so they tend to build their
    data in the format that a PivotTable produces, not in a format that a PivotTable
    consumes.


    Many users think that a simple transposing of the data set will work, but you
    know that this changes the order of data—it doesn''t convert it into a format
    that PivotTables are ready to consume.


    | Category | Beer | Wine | Liquor | Date | Units |

    |---|---|---|---|---|---||

    | 1/1/2014 | 103 | 175 | 162 | Beer | 1/1/2014 | 103 |

    | 1/2/2014 | 243 | 223 | 207 | Beer | 1/2/2014 | 243 |

    | 1/3/2014 | 101 | 138 | 103 | Beer | 1/3/2014 | 101 |

    | 1/4/2014 | 137 | 57 | 179 | Beer | 1/4/2014 | 137 |

    | 1/5/2014 | 103 | 66 | 150 | Beer | 1/5/2014 | 103 |

    | 1/6/2014 | 185 | 199 | 147 | Beer | 1/6/2014 | 185 |

    | 1/7/2014 | 111 | 83 | 80 | Beer | 1/7/2014 | 111 |


    Figure 77 Transposed data (on the left) vs properly pivoted data (on the right).


    The worst part about this is that in the past, there was no tool to easily convert
    the data back to pivoted, which meant a huge amount of labor was needed to pull
    this off. But there''s another place where Power Query comes to the rescue.


    # Unpivoting with Ease


    This example shows how your life truly carries power with Power Query. Open the
    Ch06\Unpivot.xlsx and get ready to unpivot the the data set within:


    | Sales Category | 1/1/2014 | 1/2/2014 | 1/3/2014 | 1/4/2014 | 1/5/2014 | 1/6/2014
    | 1/7/2014 | Total |

    |---|---|---|---|---|---|---|---|--|

    | Beer | 103 | 243 | 101 | 137 | 103 | 185 | 111 | 983 |

    | Wine | 175 | 223 | 138 | 57 | 66 | 199 | 83 | 941 |

    | Liquor | 162 | 207 | 103 | 179 | 150 | 147 | 180 | 1,128 |

    | Total | 440 | 673 | 342 | 373 | 319 | 531 | 374 | 3,052 |


    Figure 78 Raw data built in a pivoted format.'
