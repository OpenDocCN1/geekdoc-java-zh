  md: '# Connecting to Web-Hosted Files


    As it helps, the World Factbook page actually makes use of a text file to feed
    the data displayed in the web page.


    Now, if you know the URL to the text file, you can directly connect to it? The
    answer is yes, and here''s how it works:


    +   * Create a new query From Sources -> From Web

    * Enter the URL as follows: https://www.cia.gov/library/publications/the-world-factbook/rankorder/rawdata
    2119.txt

    * Click OK


    You are launched directly into the Power Query editor. Notice that you bypass
    the website authentication step. The reason for this is that you specified that
    you wanted the authentication settings to apply to the website root (www.gov)
    when you created the previous query. Had you not that earlier, you would have
    been provided the authentication method.


