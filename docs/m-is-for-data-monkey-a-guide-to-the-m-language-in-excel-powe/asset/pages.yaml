- img_proc: true
  md: '# # Chapter 2 Overriding Power Query Defaults


    Your job is tough when everyone follows the rules. But every now and then you''re
    trying to import a data file into Excel, you''re likely to discover that the programmer
    didn''t follow the proper import standards. The file may have a particular extension
    that implies it should follow a certain standard, but it is actually just masquerading
    as that of type. Yet when you open it, find something that is not compliant with
    the standard, and it doesn''t work correctly.


    # ## Malformed File Example


    Say that you''re working with a CSV data set that looks like this when viewed
    in Notepad:


    ```

    Downloaded from MarSys:2008-02-12T13:10:29

    TranDate,Account,Dept,Amount

    1/2/2008,61510,150 ($26.03)

    1/2/2008,61520,150 ($55.07)

    1/2/2008,61530,150 ($10.60)

    1/2/2008,61540,150 ($0.29)

    1/2/2008,61550,150 ($48.02)

    ```


    Figure 22 A row at a malformed CSV file, which has an extra header row.


    So what''s wrong with this data set? Starting on row 2, it has a nice consistent
    list of data showing in a proper comma-separated format, with one header and four
    columns of data, separated by commas. The issue is that there is an extra row
    at the top of the page, with no commas in it. In a normal CSV setup, this should
    not occur, as Power Query works out the column count based on the first row.


    Interestingly, When Excel opens this file, it handles it without issue:


    | A | B | C | D | E |

    |---|---|---|---|-|

    | 1 | Downloaded from MarSys:2008-02-12T13:10:29 | | | |

    | 2 | TranDate | Account | Dept | Amount |

    | 3 | 1/2/2008 | 61510 | 150 | ($26.03) |

    | 4 | 1/2/2008 | 61520 | 150 | ($55.07) |

    | 5 | 1/2/2008 | 61530 | 150 | ($10.60) |

    | 6 | 1/2/2008 | 61540 | 150 | ($0.29) |

    | 7 | 1/2/2008 | 61550 | 150 | ($48.02) |


    Figure 23 Malformed CSV file loaded into Excel.


    Power Query, unfortunately doesn''t handle this quite gracefully, as you can see
    if you follow these steps:


    +   * Open a blank workbook

    * Create a new query -> From File -> From CSV.csv

    * Browse to Ch02 Examples\MalformedCSV.csv


    When Power Query loads, the data is imported as follows:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_28_0.png)


    Figure 24 Malformed CSV file loaded into Power Query.


    This is obviously not good. You''re looking at a single column of data. Worse,
    it appears that Power Query recognizes the comma as delimiter, and failed to import
    the last three columns!'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The challenge here is Power Query relies on the CSV file being a proper CSV
    file because it writes the data based on the commas. It reads the first row to
    determine how many columns exists. Since there are no commas in line, Power Query
    figures that it reads by a single column. It starts to read each row and steps
    at the first comma.


    Normally this process works fine. But in this case of file, Power Query ignores
    a large part of the data you need. The good news is that you can fix this by telling
    Power Query how the file needs to be treated.


    # Overriding Power Query''s Default Queries


    Power Query loves to be helpful by making assumptions about data. When it''s often
    right, it can occasionally be wrong and needs some manipulation.


    There are two ways these issues manifest in the user interface: Power Query sometimes
    inserts extra steps that are incorrect/irrelevant, sometimes misconfigures steps.
    You deal with these problems differently, as discussed in the following sections.


    # Removing Power Query Steps


    Of the two Power Query problems mentioned, removing added steps is by far the
    easier.


    In the case of import shown early in this chapter, Power Query did two things.
    First, it imported the file, and then it set the type on Column1. The challenge
    here is that you need to change the import format, and you may not be if you''ve
    even have a column to delete the Changed Type step. This is easy to do mouse over
    the step in the Applied Steps box and click the x on the left of the step to delete
    it from the Power Query sequence:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_29_0.png)


    > Be aware that if you delete steps in the middle of a query that are important
    to the end result, you may cause the query to throw an error by the end. In addition,
    there is no functionality in the area of the user interface!


    In this case, the Changed Type step doesn''t appear to change anything in the
    query at this point. (After all, Power Query just forced the text to be treated
    as text.) It does, however, help you avoid potential errors as you fix the problem,
    described next.


    # Reconfiguring Steps


    Now you need to change the way Power Query handles the file at import. To do that,
    you need to click the little gear icon on the right side of the Source step. When
    you do, you''re launched into a configuration window:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_29_1.png)


    This dialog allows you to change a few things about the file, including the file
    path and what type of Power Query should assume this is when trying to import
    it. Because the file in this case carries the CSV file extension, Power Query
    chose the Csv Document type.'
  merge: -1
  pgno: 29
