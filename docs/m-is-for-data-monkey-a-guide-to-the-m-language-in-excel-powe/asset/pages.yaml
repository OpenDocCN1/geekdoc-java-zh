- img_proc: true
  md: '# Chapter 20 Understanding the Language


    # 175


    The challenge here is that the space between Changed and Type causes Power Query
    to treat the two as separate terms. To deal with this and Changed Type as a single
    term, Power Query prefixes the word with the # character and wraps the terms in
    quotes. Sadly, you''ll find this kind of happening frequently in Power Query,
    as the default names given to steps usually have spaces in them. This results
    in a whole lot of hash marks and quotes in longer blocks.


    If you wanted to, you could change this to avoid those quotes. You can do this
    in two different ways:


    +   - Right-click the step name in the Applied Steps (before entering the Advanced
    Editor) and renaming it.


    +   - Replace every instance of "Changed Type" in the Advanced Editor with a new
    NewType.


    Regardless of which method you choose, your code will end up like this:


    ```

    Source = Excel.CurrentWorkbook(){[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(Source,\{"Price", type number}),

    NewType

    ```


    Figure 25 Updating code to remove the #"awkwardness"


    > If you make your modifications manually, remember that your new term must be
    identical in all instances (no case changes), and don''t forget to rename the
    last step!


    # Tying the Steps Together


    The next thing to understand is how the individual link to each other. Notice
    in the NewType line, there is a reference to Source:


    ```

    Source = Excel.CurrentWorkbook(){[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(Source,\{"Price", type number}),

    NewType

    ```


    Figure 25 The Source referenced in the NewType line.


    It''s fitting that this allows Power Query to chain all the commands together.
    You can basically read the NewType line as:


    +   - Give us the output of the Source step

    - Transform the column types of step and set Price to a type of number


    # Using Line Breaks


    Another piece of this equation is interesting that the code as shown is equivalent
    to this block:


    ```

    Source = Excel.CurrentWorkbook(){[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes

    (Source,\{"Price", type number}),

    ```


    NewType

    But violates the rule about having a comma at the end of all lines except the
    one preceding the in state-

    dn''t even? Not exactly.


    When Power Query reads your code, it looks for keywords, including the comma and
    the in keyword. As it reads a line, it ignores commas that are enclosed within
    parentheses, curly braces, square brackets, or quotes. If it encounters a lone
    comma, it recognizes that as the end of the current line and starts the next line
    of code as an independent step. Alternatively, if it finds the in keyword, it
    now knows that the query is going to end and to see which step to return.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_184_0.png)'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Why is this important? It means that you can actually place a line in the break
    of the middle. Because Power Query hasn''t found a comma or the key in the end
    of the initial NewType, it keeps moving on, assuming that the line is still part
    of the finish. In essence, this means that this code:


    ```

    NewType = Table.TransformColumnTypes(Source,{{"Price", type number}))

    ```


    Is equivalent to this code:


    ```

    NewType = Table.TransformColumnTypes

    (Source,{{{"Price", type number}})

    ```


    Or this code:


    ```

    NewType = Table.TransformColumnTypes(

    Source,

    {{"Price", type number}}

    )

    ```


    The understand here is that you can''t place a hard return in the middle of a
    function name or word, but breaking at any punctuation is okay. Looked at on a
    grander scale, this query will run perfectly:


    ```

    Source = Excel.CurrentWorkbook(){[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(

    Source,

    {{"Price", type number}}

    )

    ```


    in

    NewType


    Why would you find this useful when you''re trying to debug things like lists
    of lists, which have numerous pairs of list items. When making manual tuples to
    code, it is very easy to get lost in the braces and not realize that you missed
    closing one. When you do, you get unbalanced code that will not compile and can
    be very difficult to correct, especially with the current lack of good debugging
    tools in Power Query. By separating the opening and closing braces and separating
    the list items onto individual lines, you have a much better chance of keeping
    your opening and closing braces in balance. Another bonus of this approach is
    also very easy to add new columns to the TransformColumnTypes step (at least when
    you know what data types to assign).


    Add the types for all the columns as follows:


    | Column(s) | Data Type |

    |---|---|n| Date | Date |

    | Inventory Item | Text |

    | EmployeeID, Quantity | Number |


    You can recognize the curly braces after the Source in the NewType step that you
    need to provide a list of columns and data types in a list format. Since you already
    know from Chapter 19 that all the list items need to be separated by commas, you
    know that this work:


    ```

    Source = Excel.CurrentWorkbook(){[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(

    Source,

    {{


    ```'
