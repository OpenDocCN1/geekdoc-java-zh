  md: '# Chapter 19 Power Query Objects


    Before we take a closer look at programming with Power Query''s M language, and
    functions that are available, we first need to take a detailed look at the different
    objects and have sure understanding of how to create these objects, sometimes
    from each other, will be useful when working with more advanced programming concepts.


    Be aware that this focus focuses on how to use these new-found powers in anything
    extremely practical. This chapter focuses on how to actually talk to these objects,
    providing a reference for you to return to when you need to talk to these objects
    (or portions thereof) when working in more complex scenarios.


    If you''re following along on your computer, you''ll notice that all of the key
    objects in this chapter (tables, lists, records, values, binaries, and errors)
    show up in a green font when in a column. In addition, each can be previewed by
    clicking the whitespace beside that key word.


    # Tables


    Table objects show up in numerous places in Power Query, and we appreciate it
    when they do, as they are very easy to work with. Follow these steps to see for
    yourself:


    +   - Open Ch19\Power Query Objects.xlsx

    - Create a new query -> From Sources -> Blank Query

    - Type the formula in the formula bar:


    ```

    =Excel.CurrentWorkbook()

    ```


    You can see that there is one table in the:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_166_0.png)


    | Date | Inventory Item | EmployeeID | Quantity | Price |

    |---|---|---|---||}{

    | 5/10/2014 12:00:00 | Lovable Kitten | 1 | | |

    | 5/9/2014 12:00:00 | Talkative Parrot | 2 | | |

    | 5/24/2014 12:00:00 | Lovable Kitten | 3 | | |


    Figure 26 The sole table in the workbook being previewed.


    The benefits of tables are numerous in Power Query:


    +   - You can preview the data in a table.

    - The data contained in a table has rows and columns (even you can''t guarantee
    that a header row will be in place).

    - You can drill into specific tables in the column or expand them.

    - Once you''ve expanded a table, you have a full set of transformation ribbon
    tabs available to you, and you can use them to transform and manipulate the data.


    Tables do not, of course, only mean Excel workbook tables—far from it. You can
    find tables in many data sources, including extracted from formulas like Excel.CurrentWorkbook(),
    Csv.Document(), data-base tables, and more, as you''ve seen in earlier chapters.


    You should finalize this query before you move on:


    +   - Rename the query Table

    - Go to Home -> Close & Load To... -> Only Create Connection'
