  md: '# # Chapter 22 Advanced Conditional Logic


    In Chapter 18, you learned how to replicate the functionality of Excel''s IF()
    and IFERROR() functions. Of course, the IF() and IFERROR() are not the only functions
    in Excel that you use to implement conditional

    outputs or matches.


    Unlike the examples previously shown, replicating other formulas in Excel''s conditional
    logic involves

    a bit more complicated techniques, like using lists and custom functions.


    # ## Multicolumn Logic


    Occasionally, as you are trying to filter data, you may need to filter by multiple
    criteria.

    Consider the following table, which is included in the Ch22 Multi-Column Logic.xlsx
    file:


    | Date | Inventory Item | Sold By | Cost | Price | Commission |

    |---|---|---|---|---|---||

    | 5/10/24 Sat | Lovable Kitten | Fred | 12.00 | 45.00 | 1.35 |

    | 5/9/24 Fri | Talkative Parrot | John | 17.00 | 32.00 | 0.96 |

    | 5/24/24 Sat | Lovable Kitten | Jane | 12.00 | 45.00 | 1.35 |

    | 5/20/24 Tue | Adorable Kitty Cat | John | 25.00 | 35.00 | 1.05 |

    | 5/8/24 Thu | Lovable Kitten | Jane | 12.00 | 45.00 | 1.35 |

    | 5/23/24 Fri | Sleepy Gerbil | Jane | 25.00 | 39.00 | 1.17 |

    | 5/11/24 Sun | Cranky Croodil | John | 10.00 | 35.00 | 1.05 |

    | 5/19/24 Mon | Adorable Kitty Cat | Mary | 25.00 | 35.00 | 1.05 |

    | 5/15/24 Sat | Sleepy Gerbil | Jane | 25.00 | 25.00 | 1.25 |


    Figure 288 A raw data set.


    # ## Replicating Excel''s OR(\() Function


    If you want to list only data where you sold a Talkative Parrot or the item you
    sold by Fred?

    If this were an scenario, it would be easy: filter the Inventory Item column to
    Talkative Parrot and

    filter the Sold Column by Fred. But that won''t work in the case you you used
    Talkative Parrots

    by John or Jane, and you''d also lose any other items sold by Fred.


    If the data is in an Excel table, you could solve this using Advanced Filter or
    by adding a column

    using the following formula and filtering to only results that are listed as:


    ```

    =OR([@Inventory Item]="Talkative Parrot", [@Sold By]="Fred")

    ```


    But if the data doesn''t originate in an Excel table? If it is sourced from a
    database, a web page,

    or a text file? Plainly, that won''t work.


    Pull the data into Power Query to see how you should approach this:


    +   * Select any cell in the table on the May worksheet

    * Create a new query -> From Table

    * Right-click the Date column -> Change Type -> Date


    Since you can''t filter your data without losing required results, you''re going
    to need to add a custom column\and apply a formula to examine each row:


    +   * Go to Add Column -> Add Custom Column

    * Name the Column


    You know that you''re going to test whether a certain criterion is true or false,
    using a basic formula

    framework along the lines of the following:


    ```

    = if logic test then "Meets Criteria!" else "No Match"

    ```


    The challenge here is coming up with that logic test. Power Query doesn''t have
    an OR() function, so what is

    the equivalent?


    When you''re looking to test comparisons, it is helpful to quickly scan the list
    of functions contained in

    t Power Query formula categories.'
  merge: -1
