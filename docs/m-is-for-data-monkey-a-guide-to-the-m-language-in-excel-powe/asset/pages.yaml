  md: '# # Date Function Equivalents: Adding Dates


    You''re likely to be frustrated if you take a valid date and add a value to it
    in order to increment it. Even though you know that all dates are based on a date
    serial number, Power Query cannot implicitly convert the date type like Excel.
    For reason, there is a collection of .Addx functions to use for this purpose:


    | Adding x | Excel Formula | Power Query Version |

    |---|---|---|n| Days | [Date]+x | Date.AddDays([Date]


    # # Date Function Equivalents: Returning Dates


    In order to convert and return dates in a textual format, you would use the TEXT()
    function in Excel. In Power Query, the equivalents are provided by Date.ToText(),
    but they have an additional wrinkle: Not only the function is sensitive, but also
    are the parameters:


    | To Return | Excel Formula | Power Query Version |

    |---|---|---|n| Sun | Text([Date],"ddd") | Date.ToText([Date],"ddd") |

    | Sunday | Text([Date],"dddd") | Date.ToText([Date],"dddd") |

    | Aug | Text([Date],"mmm") | Date.ToText([Date],"MMM") |

    | August | Text([Date],"mmmm") | Date.ToText([Date],"MMM") |

    | Aug 9, 2015 | Text([Date],"mmm d, yyyy") | Date.ToText([Date],"MMM d, yyyy")
    |

    | Aug 09, 2015 | Text([Date],"mm dd, yyyy") | Date.ToText([Date],"MMM dd, yyyy")
    |


    # # Dealing with Date Conversion Errors


    Many of the functions listed above require a date or datetime data type as an
    input and will return an error if an alternate date type is provided. To guard
    against this situation, you can wrap the [Date] column input with the Date.From
    function as shown here:


    ```

    =Date.AddDays(Date.From([DateColumn]),1)

    ```'
  merge: -1
