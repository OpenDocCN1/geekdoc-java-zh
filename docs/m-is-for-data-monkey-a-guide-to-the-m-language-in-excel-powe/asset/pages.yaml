    # Creating New Queries


    Since the routes to access the Power Query commands are different in different
    versions of Excel, we have settled on using the following command to describe
    how to get for each query:


    +   - Create a new query -> From File -> From CSV


    When you see this, you need to interpret it as follows:


    +   - Excel 2016: Data tab -> New Query -> From File -> From CSV

    - Excel 2010/2013: Power Query tab -> From File -> From CSV


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_17_4.png)


    Figure 9 Creating a query from a CSV file in Excel 2015/2016.


    So let''s put this to the test. If you want to grab data from an Azure SQL Database,
    our directions read:


    +   - Create a new query -> From Azure -> Microsoft Azure SQL Database'
