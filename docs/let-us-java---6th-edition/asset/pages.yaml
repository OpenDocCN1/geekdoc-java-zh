    (e) The return statement serves two purposes:


    +   1. On executing the return statement, it immediately transfers the control
    back to the calling function.


    +   2. It returns the value present in the parentheses after return, to the calling
    function. In the above program, the value of sum three numbers is being returned.


    (f) There is no restriction on the number of return statements that may be present
    in a function. Also, the return statement need not always be present at the end
    of the called function.


    (g) Whenever the control returns from a function, the sum being returned in the
    calling function by equating the called function to some variable. For example,


    sum = calSum ( a, b, c );


    (h) All the following are valid return statements:


    ```

    return ( a );

    return ( 23 );

    return ( a + b + c );

    return;

    ```


    The last statement can be used when we wish to return the control to the calling
    function without returning a value. Note that, in this case, the parentheses after
    return are dropped. In the other return statements too, the parentheses can be
    dropped.


    (i) A function can return only one value at a time. Thus, the following statements
    are invalid:


