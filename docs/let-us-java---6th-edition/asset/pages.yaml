  md: '# # Chapter 1: An Overview of Java


    Before we can begin to write programs in Java, it would be interesting to find
    out what really is Java, how it came into existence and how does it compare with
    other computer languages. Also, it is important to know what tools we are going
    to use for executing programs in this book, from where to get them and how to
    install them. In this chapter, we would briefly outline these issues.


    # ## The Evolution


    Approaches to programming keep evolving all the time. These approaches are more
    or less driven by the computing needs of those times. When these needs cannot
    be addressed by languages of that era, a need is felt for a new language. These
    needs become more and more complex over the years.


    In the early days of computing when the need was that a machine somehow be able
    to execute instructions, programming was done by manually keying in the binary
    machine instructions. So long as the programming task was small, programmers were
    ready to take the pains of keying in instructions in binary.


    As the tasks became more complex and the program lengths increased, need was felt
    for a new language that could make it easier to write programs. That''s when Assembly
    language was invented. In Assembly, instead of binary, small abbreviations were
    used to write instructions. These abbreviations were nothing but representations
    of binary instructions. This made life much easier for the programmer. The assembly
    language programs were very efficient.


    As the demands of computing increased, it was felt that learning and using Assembly
    language were not very easy. To address this need, many languages were invented.
    These included FORTRAN, BASIC and COBOL. But these turned out to be suitable for
    specific domains. For example, FORTRAN found widespread acceptance in scientific
    and engineering applications, whereas COBOL was typically used for building business
    applications like payrolls, inventory management, etc.


    These languages suffered from three important limitations. They are as follows:


    +   (a) They could not be used apart from the domains that they were supposed
    to serve. So a change in domain necessitated a programmer to learn a new language.

    (b) They could not be used to write system-level code that could interact with
    hardware easily.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 4


    # Let Us Java


    (c) All these languages were not designed around structured programming principles.
    Hence, in programs of sizeable length it became difficult to follow the flow of
    control.

    As a result, a feeling growing—could there not be a universal programming language
    that address all these three concerns? The answer came in the form of C language.
    It was invented by Dennis Ritchie at AT&T''s Bell Laboratories. Since it was designed
    by a programmer, and not driven by a committee, it addressed the needs of programmers
    very well. These included speed, efficiency and brevity. Programmers loved it
    and it soon became a dominant programming language. This dominance continued for
    almost two decades.


    As new hardware evolved, and computers gained widespread, demands from the program
    grew multi-fold. The complexity of programs hit the roof, and this is C language
    started showing signs of strain. It simply didn''t contain elements that could
    handle the complexity of the problem being solved. There was a need for a fresh
    approach to handle the complexity. This gave birth to a new way of organizing
    the program, called Object Oriented Programming (OOP). C++ was based on these
    principles and was invented by Bjarne Stroustrup at AT&T''s Bell Labs. 1990 was
    the decade of C++. Since C++ was built on foundation of C, it became easier for
    programmers to migrate to this new language quite quickly. It was largely accepted
    that C++ is a perfect language and there would be no need for a new language.
    But this belief got dented as you would see in the next section.


    # The Birth of Java


    C and C++ were good or less for building most applications till late 1990s. The
    computing world was more or less divided into three camps—Intel, Macintosh and
    Solaris. Compilers were available that targeted these microprocessors and created
    language instructions that could get executed on these microprocessors. This was
    alright for the PC world. However, the microprocessor diversity was too much in
    consumer electronics world. The microprocessors used in washing machines, microwave
    ovens and other devices were so many that creating a compiler for each microprocessor
    was impractical. So a thought started taking shape to create new language that
    could be used to create software that could run on different microprocessors embedded
    in various consumer electronic devices. This was the initial motivation that led
    to the birth of Java.


    Thus creation of an architecturally neutral and portable language for consumer
    electronics devices was the primary factor for Java to come into'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 1: An Overview of Java


    existence. However, it gained impetus for a very different reason. World Wide
    Web and the Internet were growing like wildfire, and its programming needs were
    similar to those that Java was trying to address. There were all of machines that
    were getting connected to the Internet. A language was needed that could be used
    to create programs that could run on machines connected to the Internet and had
    different microprocessors and operating systems. Java fitted this bill perfectly,
    because it was designed from ground up with this motive in mind, namely, platform-independence
    (portability).


    So it may not be an exaggeration to state that Internet caught the fancy of the
    World Wide Web at the same time in which Java was growing, Java would have possibly
    remained a language to be used only in the consumer electronics world.


    With this historic perspective under our belt, I think we are well poised to begin
    Java.


    # What is Java?


    Java is a programming language developed at Sun Microsystems in 1995. It was designed
    by James Gosling. The language derives much of its syntax from C++ (and its predecessor,
    C), but is simpler to use than C++. Reputation of Java has spread wide and far
    and has captured the imagination of most software professionals. Literally thousands
    of applications are being built today in Java for different platforms including
    desktop, web and mobile.


    Possibly why Java seems so popular is because it is reliable, portable and easy
    to use. It has modern constructs that are required to represent today''s problems
    programmatically. Java makes use of a principle called Object-Oriented Programming
    (OOP) to organize the program. This organizing principle has lots of advantages
    to offer. We will be discussing this in detail in Chapter 9.


    Let us now try to understand how Java achieves portability and reliability.


    # Traditional Programming Model


    When we execute a program on any computing device like PC, Laptop, Tablet or Smartphone,
    the instructions in it are executed by the microprocessor present in that device.
    However, the microprocessor cannot understand the instructions written in languages
    like C, C++ or Java. Hence, these instructions have to be first converted into
    instructions that can be understood by the microprocessor. These converted instructions
    are in machine language. This conversion process is known as compilation.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# 6


    # Let Us Java


    The machine language instructions understood by a microprocessor often calls its
    Instruction Set. Problem is that instruction sets of different microprocessors
    are different. Thus, instructions of an Intel microprocessor are different than
    those of an ARM microprocessor. Therefore, any program executing on a specific
    microprocessor needs to be converted into machine language instructions which
    that microprocessor understands. Thus, for the same program, corresponding machine
    language instructions would be different for different microprocessors. Hence,
    if a program is compiled for one microprocessor it may not work on another microprocessor.
    To make it work on another microprocessor it would be compiled for that microprocessor
    again. This is shown in Figure 1.1.


    ![](img/768d650138b7acfe46806942770377ed_17_0.png)


    Figure 1.1


    Any running program needs to make use of services of an Operating System (OS)
    during its execution. These include services like performing input/output, allocating
    memory, etc. You must be aware of the fact that on the same microprocessor, different
    OS can be used. For example, suppose there are two laptops having same Intel Pentium
    microprocessor. On one laptop one can run Windows whereas on the other, one can
    run Linux. Since these services are different, during conversion to machine language
    these changes have to be accommodated. So for the same program, machine language
    instructions for Intel + Windows combination would be different than those for
    Intel + Linux combination. This is shown in Figure 1.2.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 1: An Overview of Java


    | Intel X86 + Windows | Machine Language Inst. for Intel X86 + Windows | Executed
    on Laptop 1 |

    |---|---|---|n| C Program | Intel X86 + Linux | Machine Language Inst. for Intel
    X86 + Linux | Executed on Laptop 2 |


    Figure 1.2


    Figure 1.1 and Figure 1.2 depict a scenario "write once, compile anywhere". It
    means to make the same program work on combination. different microprocessor +
    OS combination we are not required to rewrite the program, but are required to
    recompile the program for that microprocessor + OS combination. This is the approach
    taken by popular traditional languages like C and C++.


    # How is Java Different?


    Java takes a different approach than the traditional approach taken by languages
    like C and C++. It lets application developers follow a "compile, run anywhere"
    scenario. This means that once a Java program is compiled, it can get executed
    on different microprocessors + OS combinations without the need to recompile the
    program. This makes Java immensely portable across different microprocessors +
    OS combinations. The microprocessor + OS combination is often called "Platform".
    Hence Java is often called a platform-independent language or architecturally
    neutral language. Java are considered portable since they can be used on different
    microprocessor + OS combination without making any changes in them.


    Java achieves this "compile once, run anywhere" and platform independence through
    a program called Java Virtual Machine (JVM). When we compare Java programs, they
    are not converted into machine language instructions for a specific microprocessor
    + OS combination. Instead, our Java program is converted into bytecode instructions.
    These bytecode are similar to machine code, but are intended to be interpreted
    by JVM. A JVM provides an environment in which Java bytecode can be executed.
    Different JVMs are written specifically for different host hardware and operating
    systems. For example, different JVMs are written for Intel + Windows combination,
    ARM + Linux combination, etc.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 8


    # Let Us Java


    During execution, the JVM runtime executes the bytecode by interpreting it using
    an Interpreter program or compiling it using a just-in-time (JIT) compiler. JIT
    compilers are preferred as they work faster than interpreters. During interpretation
    or JIT compilation, the bytecode instructions are converted into machine language
    instructions for the microprocessor + OS combination on which the program is being
    executed. This perfectly facilitates executing Java programs on different machines
    connected to Internet.


    A Java program is typically stored in a .java file, and the bytecode is usually
    stored in a .class file. A complex program may consist of many .class files. For
    easier distribution, these multiple class files may be packaged together in a
    jar file (short for Java archive). The working of a Java program discussed above
    is shown in Figure 1.3.


    ![](img/768d650138b7acfe46806942770377ed_19_0.png)


    Figure 1.3


    # How Java addresses Security?


    Let us first understand what typically happens when we use some web application
    on the Internet. Through browser on our PC/Laptop/Tablet/Smartphone we use a URL
    to reach the application present on some server on the Internet. The web application
    sends HTML that gets rendered in our browser. However, except for the simplest
    of web applications, along with the HTML some executable Java program is also
    sent to our browser. This program is often small and is called Applet. The purpose
    of the applet is to make the web application more responsive. For example, if
    we enter a password, it should be possible to check whether it follows rules for
    password creation or not right within the browser using the downloaded applet,
    rather than sending the password to server'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1: An Overview of Java


    and get it verified. This certainly improves user experience. This is because
    the check is being performed on the machine itself rather than on the server machine.
    This saves a roundtrip to the server.


    But when we download an applet, there is always a possibility that the applet
    may contain malicious code like a Virus or Trojan horse that would cause harm
    to our machine. JVM prevents this from happening by restricting the applet code
    from accessing other resources of your machine, other than what it is supposed
    to. This makes applets secure. JVM solves two pricey issues in one shot—portability
    as well as security.


    # Java or C++


    After learning C, it is often a question whether one should migrate to Java or
    C++. Answer is both; and thus in any sequence that you want. Though both are Object
    Oriented programming languages, neither is an advanced version of the other. Learning
    one before the other would naturally help to learn the second.


    It is important to note that both address different sets of problems. C++ primarily
    addresses complexity, whereas Java addresses portability and security. In my opinion,
    both languages would continue to rule the hearts of programmers for years to come.


    As you start learning Java, you would find that there are many features in it
    that are similar to C and C++. This is not by accident, but by intent. Java designers
    know they had to provide a smooth transition path to learners of Java language.
    That is why Java uses a syntax that is similar in many ways that to C and it follows
    many of the object oriented features of C++, though in a refined fashion.


    # The Java Environment


    We know that JVM contains an Interpreter / JIT that converts bytecode into microprocessor
    + OS specific machine language instructions. Since instruction sets vary from
    microprocessor to microprocessor, there exist different JVMs for different platforms.
    Thus, though any JVM can run any Java program, JVMs themselves are not portable.


    JVM is distributed along with a set of standard class libraries that implement
    the Java Application Programming Interface (API). The Java APIs and JVM together
    form the Java Runtime Environment (JRE). If your need is execute Java programs
    on your machine, all that you need is JRE. For example, if you wish to play a
    Java-based game on your machine, you need to install only JRE on your machine
    for the game to run.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 10 Let Us Java


    However, if you wish to also develop programs on your machine, you need Java Developer
    Kit (JDK). JDK contains tools needed to develop the Java programs, as well as
    JRE to run the programs. The tools include compiler (javac.exe), Java application
    launcher (java.exe), Appletviewer, etc. Compiler converts Java code into bytecode.
    Java application launcher opens a JRE, loads the class, and calls its main() method.
    Figure 1.4 shows all these pieces of Java environment.


    ![](img/768d650138b7acfe46806942770377ed_21_0.png)


    Figure 1.4


    # Tools of the Trade


    To create and run Java programs you need to install two software on your PC. These
    are


    +   (a) Java Development Kit (JDK)

    (b) Integrated Development Environment like NetBeans or Eclipse


    JDK is often also called Standard Development Kit or Java SE 19 JDK or simply
    Java 19, where 19 is the version number. As years roll by, the version number
    would go on increasing. JDK contains JVM, JRE, Java compiler and debugger. A compiler
    is needed to convert the Java program into its equivalent bytecode. A debugger
    is needed to detect, analyze and eliminate bugs in the program. Java 19 can be
    downloaded using the link


