  md: '# Chapter 13: Inheritance


    Now that we have familiarized ourselves with classes—the building blocks of object
    oriented programming—let us deal with another important Java concept called Inheritance.
    Inheritance is probably the most powerful feature of object-oriented programming
    after classes themselves. Inheritance is the process of creating new classes,
    derived classes, from existing classes. These existing classes are often called
    base classes. The derived class inherits all the capabilities of the base class
    but can add new features and refinements of its own. By adding these refinements
    the base class remains unchanged.


    Most important advantage of Inheritance is that it permits code reuse. Once a
    base class is written and debugged, it need not be touched again but at the same
    time it can be adapted to work in different situations. Reusing existing code
    saves time and effort and increases a program’s reliability. Inheritance can also
    help in the original conceptualization of a programming problem, and in the overall
    design of the program.


    The reuse is of great help in the case of distributing class libraries. A programmer
    can use a class created by another person or company, and, without modifying it,
    derive other classes from it that are suited to particular programming situations.
    Let us now understand the concept of inheritance using a program.


    Suppose we have designed a class called Index that serves as a counter. Suppose
    that Index class can only increment the counter and not decrement it. To achieve
    this, we can insert a decrement function directly into the source code of the
    Index class. However, there are several reasons why we might not want to do this.
    First, the Index class works well and has been thoroughly tested and debugged.
    This is an exaggeration in this case, but would be true in a larger and more complex
    class. Now, if we start modifying the source code of the Index class, the testing
    process will have to be carried out again.


    Sometimes, there might be another reason for not modifying the Index class—we
    might not have access to its source code, especially if it has been distributed
    as part of a class library.


    To avoid these problems, we can use inheritance to create a new class based on
    Index, without modifying Index itself. Here’s how this can be achieved.


    ```

    // Demonstrating implementation and usage of Inheritance

    package inheritanceusageproject;

    ```'
