    +   * Thread is a Java API class. It contains useful methods :

    - currentThread() - returns current thread''s object

    - setName() - sets up name for a thread

    - getName() - returns name of the specified thread

    - sleep() - Postpone execution of next instruction by specified milliseconds


    +   * Two methods to launch a thread :

    - By extending the Thread class

    - By implementing Runnable interface


    +   * Extending Thread class

    - Easy to use

    - Thread related functions can be overridden

    - Disadvantage: Cannot use in Multiple Inheritance situations


    +   * Implementing Runnable Interface

    - Can be used in Multiple Inheritance situations

    - Disadvantage: Cannot override Thread class functions


    +   * If multiple files are to be read the reading time can be reduced by carrying
    out the reading in multiple concurrent threads


    +   * When >=2 threads access same shared resource if we wish to ensure that the
    resource is used by only 1 thread at a time, then it can be achieved using Synchronized
    methods


    +   * If a method is declared as Synchronized then when it is called by multiple
    threads, when the first is executing it others are made to wait'
