    # Classes


    Most languages offer primitive data types like **int, long** and **float**. Their
    data representation and response to arithmetic, assignment and relational operators
    are defined as part of the language. However, not all the information about real
    world objects can be represented using these limited built-in data types. The
    programmer often needs to create his own data types by defining a **class** for.


    For example, a class is a user-defined data type to represent dates. Programmers
    have to define the behavior of dates by designing a **Date** class. This class
    expresses the format of a date and the operations that can be performed on it.
    The way we can declare many variables of the primitive type **int**, we can define
    many objects of the **Date** class. A class serves as a blueprint or plan or a
    template. It specifies what data and what functions will be included in objects
    of that type. Defining a class doesn''t create any objects, just as the mere existence
    of a **type** doesn''t create any variables.


    # Inheritance


    OOP permits you to create your own data types (classes) just like the built into
    the language. However, unlike the built-in data types, the user-defined classes
    can use other classes as building blocks. Using a concept called *inheritance*;
    new classes can be built on top of the old ones. The new class referred to as
    a *derived class*, can inherit the data and functions of the original, or the
    **base class**. The new class can add its its own data elements and functions
    in addition to those it inherits from its base class.


    For example, we can build a set of classes that describe a library of publications—periodicals
    and books. We can create a general **Publication** class by defining data items
    for the publisher name, the number of pages and the access number. Publications
    can be retrieved, stored and read. These would be the functions of **Publication**
    class.


    Next we can define two classes named **Periodical** and **Book**. Both these classes
    can be derived from the base class **Publication**. This is natural'
