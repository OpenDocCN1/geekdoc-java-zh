    When you are developing a Java program you need an editor to type the program.
    Small Java programs can be typed in one file. But more sophisticated programs
    may be split across multiple files. To let you the program, manage multiple files
    of your program, compile it and debug, you need a tool that can carry out these
    tasks in a visual and userfriendly manner. This tool is often called an Integrated
    Development Environment (IDE). Some of the popular IDEs used for building Java
    programs include NetBeans, Eclipse and Intelli. All programs in this book have
    been created with NetBeans IDE. It can be downloaded using the link www.netbeans.org.


    # Online Java Compilers


    With ubiquitous availability of Internet, if you wish, you can completely avoid
    installation of JDK and IDE on your machine. By using browser, you can connect
    to any of the following to type, compile and execute your Java programs:


    https://www.onlinedb.com/

    https://www.tutorialspoint.com/compile_java_online.php


    The limitation of using online compilers is that you need a steady Internet connection
    while you are using them. Most of these compilers compile your program using the
    gcc compiler.


    While using the online compilers like the one on onlinedb.com you have to remember
    to choose the language (Java in our case) from the dropdown. Next, we have to
    type your program and click the Run/Execute button. When we do so typed program
    is sent to the web server where it is compiled and executed. The output created
    on execution is then sent back and displayed in the browser. If any errors are
    found in the program during compilation they are also relayed back and displayed
    in the browser.


    Onlinedb.com also has provisions to create multi-file Java programs, supply command-line
    arguments, debug a program using the debugger, create folders and store multiple
    files in it. From the point of view of security, online compiler is not a preferred
    choice for serious software development in Java. Nevertheless, a good option with
    zero installation and configuration headaches when you are learning Java.


