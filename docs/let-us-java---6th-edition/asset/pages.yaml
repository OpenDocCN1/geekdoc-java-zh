    # Stream Classes


    There are two fundamental types of streams—Byte streams and Character streams.
    Byte streams perform I/O 1 byte at a time, whereas Character streams perform I/O
    one char (2 bytes) at a time. For example, an integer 235 when written to a byte
    stream would involve transfer of 4 bytes, since an integer is 4 bytes long. The
    same integer when written to character stream would need transfer of 6 bytes—2
    bytes per character.


    There are several classes available in the Java library to perform streambased/output
    of bytes/characters. Figure 16.3 and Figure 16.4 show the hierarchy of these classes.


    ![](img/768d650138b7acfe46806942770377ed_319_0.png)


    Figure 16.3


    The classes InputStream and OutputStream are abstract classes. From these classes
    FileInputStream and OutputStream are derived. As their names suggest, these classes
    read/write streams of bytes from/to file. The FileInputStream class uses some
    input stream as source of data and filters it based on some criterion. The BufferedInputStream
    class provides the buffering ability. Buffering is used to improve read/write
    performance of a stream. The DataInputStream class provides ability to read Java
    primitives.'
