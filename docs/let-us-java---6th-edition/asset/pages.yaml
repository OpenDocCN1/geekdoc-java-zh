  md: '# Chapter 9: Introduction to OOP


    Data types, control instructions and functions are the basic building blocks of
    any Java program. With all these topics under belt it is time to move on something
    more complex, namely, Object Oriented Programming.


    Java is an Object-Oriented Programming (OOP) language. Many programmers tend to
    use object-oriented features of Java mechanically. Though this might make the
    program work, the real advantages of object-oriented programming do not accrue
    unless you understand the concept of object-oriented programming and what features
    it offers. Hence, in this chapter we would not write a single program. Instead
    we would concentrate on understanding what OOP is and why we need it.


    This chapter addresses these issues and provides an overview of the features to
    be discussed in the rest of the book. What we will say necessarily be general
    and brief. Don''t worry if you don''t catch everything in this chapter on the
    first pass; OOP is a bit complex and understanding it takes time. We will be going
    over these features again in subsequent chapters. There''s lot of ground to cover
    here, so let''s get started.


    The purpose of a programming language is to express the solution to a problem
    with the help of an algorithm (step-by-step procedure). The success of the solution
    depends on how the solution models (represents) the problem. Different approaches
    have evolved over the years to model solutions to problems. The primary amongst
    them are Structured programming model (also Procedural programming model) and
    Object-oriented programming model. These models are often called programming paradigms,
    i.e. principle of program organization. To understand these models we need to
    begin by taking a peek at the history of programming models.


    # The Beginning...


    The earliest computers were programmed in binary. With the advent of mass storage
    devices and cheaper computer memories, the first high-level computer programming
    languages came into existence. With their arrival, instead of thinking in bits
    and bytes, programmers could write a series of English-like instructions that
    a compiler could translate into the binary language of computers.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'These languages were simple in design and easy to use because programs at that
    time were primarily concerned with relatively simple tasks like calculations.
    As a result, programs were pretty short, limited to a few hundred lines of instructions.


    As the computers’ capacity increased, so also did the ability to develop more
    complex programs. However, the earlier programming languages were found wanting
    in performing the complex programming tasks. These languages suffered from following
    limitations:


    +   (a) There were no facilities to reuse existing program code. Wherever the
    same piece code was required, it was simply duplicated.


    +   (b) The control of execution within a program was transferred via the dangerous
    goto statement. As a result, there was too much jumping around the program, often
    without any clear indication of how, and where and why the control is flowing.


    +   (c) All variables in the program were global. Tracking down spurious changes
    in global data in long convoluted programs was a very tedious job.


    +   (d) Writing, understanding and maintaining long programs became a programmer’s
    nightmare.


    In short, we can call this methodology of developing programs as Unstructured
    programming.


    # Structured Programming


    To overcome the limitations mentioned above, a quest began to develop new languages
    with new features that would help to create more sophisticated applications. The
    breakthrough occurred in late 1960’s and early 1970’s with the introduction of
    structured programming. The long programs that the programmer found difficult
    to comprehend could be broken down into smaller units of few hundred statements.
    Functions/subroutines/procedures were introduced in these languages to make the
    programs more comprehensible to their human creators. A program was now divided
    into functions, with each function having a clearly defined purpose.


    How structured programming overcame the limitations experienced in unstructured
    programming is given below.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Chapter 9: Introduction to OOP 145


    +   (a) Reuse of existing program code – Wherever the same piece code is required
    at multiple places in a program, the function containing that code was used. As
    a result, there was no need to repeat the same code at multiple places.


    +   (b) Excessive use of goto statement – This was minimized by introducing powerful
    control instructions that could transfer the control within the program in an
    easy-to-understand manner.


    +   (c) Unexpected changes in global variables – With introduction of functions,
    need for global variables were minimized.


    +   (d) Complexity of programs – Complexity became more manageable as structured
    programming permitting better organization of the program.


    A structured program is built by breaking down a solution into smaller pieces
    that then become functions within that program. Each function can have its local
    variables and logic. The execution begins with function and then all other functions
    are called directly or indirectly from this function. This is shown in Figure
    9.1.


    ![](img/768d650138b7acfe46806942770377ed_156_0.png)


    Figure 9.1'
