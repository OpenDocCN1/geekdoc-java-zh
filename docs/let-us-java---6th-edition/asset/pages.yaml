  md: "# Chapter 15: Exception Handling\n\none. The try-throw-catch arrangement handles\
    \ it all for us,\nautomatically.\n\n# A Few Tips...\n\nTo round off all that we\
    \ have learnt about exception handling, here are a\nfiner points about it that\
    \ you must note:\n\n+   (a) Don't catch and ignore. For example, it is a wrong\
    \ practice to write\n  catch block like this:\n\n```\ncatch ( Exception e )\n\
    {\n}\n```\n\nProgrammers are tempted to write this when runtime errors occur\n\
    in their program and wish to avoid displaying of an ugly and\nelaborate stack\
    \ trace of the exception.\n\n+   (b) Don't use exception handling for cosmetic\
    \ purpose. It should serve\npurpose of rectifying the exceptional situation or\
    \ perform a\ngraceful exit.\n\n+   (c) Always try to distinguish between types\
    \ of exceptions by writing\nmultiple catch blocks which however relevant.\n\n\
    +   (d) It is not necessary that the statement that causes an exception be\nlocated\
    \ directly in the try block. It may as well be present in a\nfunction that is\
    \ being called from the try block.\n\n+   (e) A try block can be present inside\
    \ another try block.\n\n+   (f) If inner try block doesn't have a corresponding\
    \ catch block, then\noutouter try block's catch handlers are inspected for a match\
    \ when\nanexception occurs.\n\n+   (g) If we are writing a class library for somebody\
    \ else to use, we should\nanticipate what could cause problems to the program\
    \ using it. At all\nplaces we should throw exceptions.\n\n+   (h) If we are writing\
    \ a program that uses a class library, we should\nprovide try and catch blocks\
    \ for any exceptions that the library may\nthrow.\n\n+   (i) Exceptions impose\
    \ an overhead in terms of program size and (when\nan exception occurs) in time.\
    \ We should not try to overice it.\nMake it optimally elaborate—not too much,\
    \ not too little."
