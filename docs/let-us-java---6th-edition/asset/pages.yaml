  md: '# 148 Let Us Java


    When you approach a programming problem in an object-oriented manner, you no longer
    ask how the problem will be divided into functions, but rather how it will be
    divided into objects. Thinking in terms of objects, rather than functions, has
    a surprisingly helpful effect on how easily programs can be designed. This results
    from the close match between objects in the programming world and objects in the
    real world.


    The match between programming objects and real world objects is the happy result
    of combining data and functions. The resulting objects offer a revolution in program
    design. No such close match between programming constructs and the concepts exists
