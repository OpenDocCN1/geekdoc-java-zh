    # Hierarchy of Operations


    While executing an arithmetic statement, which has two or more operators, we may
    have some problems as to how exactly does it get executed. For example, does the
    expression 2 * x - 3 * y correspond to (2x) - (3y) or to 2(x-3y)? Similarly, does
    A / B * correspond to A / (B * C) or to (A / B) * C? To answer these questions
    satisfactorily, one has to understand the ''hierarchy'' of operations. Hierarchy
    decides the order in which the operations in an expression are performed. The
    hierarchy of commonly used operators is shown in Figure 3.5.


    | Priority | Operator | Description |

    |---|---|---|

    |1st | * / % | Multiplication, Division, Modular division |

    | 2nd | + - | Addition, Subtraction |

    | 3rd | = | Assignment |


    Figure 3.5


    Within parentheses the same hierarchy as mentioned in Figure 3.5 is operative.
    Also, if there are more than one set of parentheses, the operations within the
    innermost parentheses would be performed first, followed by the operations within
    the second innermost pair and so on.


    An example would clarify the issue further.


    Example 3.1: Determine the hierarchy of operations and evaluate the following
    expression, assuming that i is an integer variable:


    ```

    i = 2 * 3 / 4 + 4 / 8 - 2 + 5 / 8

    ```


