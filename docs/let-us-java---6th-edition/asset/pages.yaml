    # Constant Variables


    Many times we have to use constant values in a program. For example, values of
    pi, Plank''s constant or Avogadro''s number. Suppose we need the value of pi at
    several places in a Java program. It would be a bad idea if we directly use the
    value 3.14 at all these places, we might commit a typing error at one of the places
    and this error would go unnoticed by the compiler. To avoid this we can store
    the value 3.14 in a float variable pi, and then use this variable wherever we
    need the value of pi. This solution suffers from the limitation that being a variable,
    pi is liable to change. So if we assign a new value to this variable, the compiler
    would not be able to report this as an error.


    A solution for this is to declare the variable as a constant variable using the
    keyword final. This is illustrated in the code snippet given below.


    ```

    float pi = 3.14f;

    float radius = 1.5f;

    float area = pi * radius *

    ```


