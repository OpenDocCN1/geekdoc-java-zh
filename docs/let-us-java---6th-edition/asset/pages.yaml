    # Package FAQs


    Often there are questions in programmer’s mind about packages and import statements.
    I have compiled below these FAQs.


    +   (a) What if package name is absent in a .java file?


    All types in the file belong to a package called default package. This practice
    should be discouraged.


    +   (b) Should package name be in small case?


    It is a good idea and is used by many Java development environments including
    NetBeans. This avoids name conflict with class/interface names.


    +   (c) How do I ensure uniqueness in package names?


    Used reversed Internet domain names like com.ykanetkar.sample, com.ykanetkar.trial,
    etc. Since domain names are unique, their reversed forms also unique.


    +   (d) Which packages are imported by default?


    default package, java.lang


    +   (e) Which packages would get imported through the statement:


    import graphics.A.*;'
