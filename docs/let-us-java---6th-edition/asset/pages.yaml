    \ each time. The mechanism, which meets this need, is the loop control instruction,\
    \ and loops are the subject of this chapter.\n\n# Loops\n\nThe versatility of\
    \ the computer lies in its ability to perform a set of instructions repeatedly.\
    \ This involves repeating some portion of the program either a specified number\
    \ of times or until a particular condition is satisfied. There are three methods\
    \ by which we can repeat a part of a program. They are:\n\n+   (a) Using a for\
    \ statement\n(b) Using a while statement\n(c) Using a do-while statement\n\nLet\
    \ us now understand each of these methods of looping.\n\n# The while Loop\n\n\
