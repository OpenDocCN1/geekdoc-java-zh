    # StringBuilder Class


    As noted in the previous section, when a string is manipulated it is not changed
    in-place. Instead, a new object containing the manipulated string is created and
    the reference which was pointing to the earlier string is now made to point to
    this new manipulated string.


    Instead of this, if we want the same string should get manipulated in-place, then
    Java library provides a StringBuilder class for this. When we create a string
    using this class we can modify it by appending, removing, replacing, or inserting
    characters. For carrying out operations it has methods like append( ), delete(
    ), replace( ) and insert( ).


    Based on what operations that we wish to perform on the string created using StringBuilder,
    we can set the maximum number of characters that the object can store. This can
    be done by using the EnsureCapacity() method.


