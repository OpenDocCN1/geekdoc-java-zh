    The program writes the same integer into 3 files in different ways. For example,
    it writes it as an **int** in the first file, as a **string** in the second and
    as a **Unicode string** in the third. These writing operations are done through
    three methods defined in the program—`rawWrite()`, `charWrite()` and `unicodeWrite()`.


    Note after writing the same integer value (123456), the sizes of the three files
    "Raw.txt", "Char.txt" and "CharLu.txt" are reported as 4, 6 and 14 bytes, respectively.
    This indicates that during raw writing, each byte value of the 4-byte integer
    is written. Unlike this, during character writing, the integer was first converted
    into a string "123456" and then written to the file as character-by-character.
    In Unicode writing, each character of the string was written as a 2-byte character.


    Before writing to a **file**, the file is opened using either the `FileOutputStream`
    or `File` object. While writing the integer as an **int**, a `DataOutputStream`
    object is used, whereas, while writing it as a string or a Unicode string, a `FileWriter`
    and `OutputStreamWriter`, respectively are used. Objects of these writers are
    created before using them to call the `writeInt()` and `write()` methods. Instead
    of the statement,


    ```

    DataOutputStream ds = new DataOutputStream (

    new FileOutputStream ( "Stream.txt" ));

    ```


    we can split it into two parts


    ```

    fos = new FileOutputStream ( "Stream.txt" ;

    DataOutputStream ds = new DataOutputStream ( fos ) ;

    ```


    The **close()** function is called at the end of writing operations to close the
    current stream and release any resources associated with the current stream.


    Rest of the program is simple to understand. You can modify this program to write
    float values to a file.'
