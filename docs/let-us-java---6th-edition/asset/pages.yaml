  md: '# 414 Let Us Java


    While creating the database we have given the login name as “root” and password
    as “admin”. Hence same have been used in the call to getConnection( ). This call
    creates a Connection object and returns it, which we promptly collect conn.


    Once the connection with the database is established, we have performed the CRUD
    operations. For this we have to create a Statement object by calling createStatement(
    ) on the connection object. Next, we have to create the query string and pass
    it to executeUpdate( ) method of Statement to execute the query. This sequence
    of operations is shown below.


    ```

    stmt = conn.createStatement( );

    String sql;

    ql = "INSERT INTO Accounts VALUES ( 1001, ''Joe'', 5000.0 )";

    stmt.executeUpdate( sql );

    ```


    Create, update and delete operations are similar in the sense that we perform
    all of the executeUpdate( ) method has to be called. The Read operation is a bit
    different. For it we need to call the executeQuery( ) method on the Statement
    object. When we do this, the query is fired on the database and all the records
    that qualify the query are returned in the form of a ResultSet object. For example,
    when we fire the query “SELECT * from Accounts” all the records in the Accounts
    table would qualify this query and would be returned together in a ResultSet object.


    We can iterate through all the records in the ResultSet object through a while
    loop. Each time the loop we can extract the individual values in the record by
    calling the ResultSet methods as shown below.


    ```

    id = getInt( "ID" );

    name = rs.getString( "Name" );

    balance = rs.getFloat( "Balance" );

    ```


    We have extracted the values and displayed them on the screen. Once all the records
    have been iterated, rs.next( ) returns a false, whereupon the loop is terminated.


    That brings us to the final stage of the program where we need to do the cleanup
    operations. We do this by calling the close( ) methods on Statement, ResultSet
    and Connection objects.'
