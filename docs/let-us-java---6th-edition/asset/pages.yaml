    Width indicates the number of columns to be reserved for printing the number.
    For example, %10d indicates that the decimal integer be printed in 10 columns.
    If the number is smaller than the columns reserved for printing it, the number
    is right aligned. If we want to left-align the number we use %-10d. If width turns
    out to be smaller than what is required for printing the number, the width gets
    ignored.


    The specifier %10d prints the number right-aligned in 10 columns with suitable
    number of zeros padded on the left. %+10d adds a + sign at beginning of the number.
    Had the number''s value negative a - sign would have been readable. %,10d introduces
    a comma in the number to make it more readable. Finally, %+10d combines the effect
    of , and +**


    The specifier %10.2f aligns the double in 10 columns with 2 places beyond decimal
    point.


    # Control Instructions in Java


    As the name suggests, the ''Control Instructions'' enable us to specify the order
    in which the various instructions in a program are to be executed by the computer.
    In other words, the control instructions determine the ''flow of control'' in
    a program. There are four types of control instructions in Java. They are:


    +   (a) Sequence Control Instruction

    (b) Selection or Decision Control Instruction

    (c) Repetition or Loop Control Instruction

    (d) Case Control Instruction


    The Sequence control instruction ensures that the instructions are executed in
    the same order in which they appear in the program. Decision and Case control
    instructions allow the computer to take a decision as to which instruction is
    to be executed next. The Loop control instruction helps computer to execute a
    group of statements repeatedly.'
