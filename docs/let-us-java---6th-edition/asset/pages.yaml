  md: '# Chapter 21: JDBC


    package mydbccrud, as indicated in the package statement at the beginning of the
    program.


    The import statement ensures that the classes declared in java.sql package for
    database access are available to the program.


    Now we need to open a communication channel with the database. For this we need
    to load and register the JDBC driver. This registration needs to be done only
    once in the program. We have this registration through the call


    Class.forName( jdbcDriver ) ;


    where jdbcDriver is a string that has been initialized to "com.mysql.jdbc.Driver".
    This call dynamically loads the driver''s class file into memory, which automatically
    registers it. Naturally if we use a different DBMS by MySQL then the driver name
    and hence the string would change as given below.


    ORACLE DBMS - oracle.jdbc.driver.OracleDriver

    DB2 DBMS - COM.ibm.db2.jdbc.net.DB2Driver


    Now we need to open a connection with the database. This is done using the statement


    conn = DriverManager.getConnection( dbURL, "root", "admin") ;


    The getConnection() method needs three parameters—the database URL which indicates
    the name and location of the database, login name and password to access the database.
    We have initialized the dbURL to "jdbc:mysql://localhost/study".


    Here localhost refers to the local machine and study refers to the database name.
    If the database is present on a different machine, then localhost should be replaced
    by IP address or name of the machine where the database is hosted.


    Once again for Oracle and DB2 the dbURL string would be different. For these databases
    the following strings should be used:


    Oracle DBMS - jdbc:oracle:thin:@hostname:port

    Number:databaseName


    DB2 DBMS - jdbc:db2:hostname:port Number/databaseName'
