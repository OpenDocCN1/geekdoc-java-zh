  md: '# Chapter 22: Network & Internet Programming


    # Port Numbers


    It is common to send emails through your email application at the same time as
    you download a file from a web site. Here, the email application is communicating
    with an email server program residing on another machine, whereas the web browser
    is communicating with a web server program running on another machine. The IP
    address of the machine on which the email application and the web browser is running.
    In such a case, the data sent by the web server should not go to the email application;
    similarly the data sent by the email server should not go to the web browser.
    To avoid such situations the email application and the web browser use sockets
    with different port numbers on the same machine (IP address) for carrying out
    communication. These ports are logical ports and not physical ports. They should
    not be confused with HDMI or USB ports.


    Email program and Web Browser are standard applications. Hence they should not
    be required to make a phone call to the place where the Web Server is present
    and ask which port number it is using so that you can send a request to it downloading
    a file. IANA is responsible for assigning standard port numbers. Port numbers
    used by applications that use some common protocols are as follows:


    +   * HTTP - 80

    * SMTP - 25

    * POP3 - 110

    * FTP - 20, 21

    * Time - 37

    * Telnet - 23

    * Whois - 43


    There is another important reason why the idea of port numbers was created. The
    network link is usually so high that one application would not be able to use
    the entire capacity of the connection by itself. For example, when you visit a
    website and a page is downloaded in your browser, unless you click a link and
    make a request for another page, the network link is idle. Hence, to meaningfully
    utilize the capacity of the network link, it becomes important to be able to share
    the same link for multiple applications. This means multiple applications running
    on the machine will use the same IP address of the machine, but different port


    numbers.'
