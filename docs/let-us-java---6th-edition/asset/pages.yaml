    Let us summarize what we have learnt so far.


    +   (a) A function gets called when the function name is followed by a semicolon
    (;).


    +   (b) A function is defined when function name is followed by a pair of braces
    in one or more statements may be present.


    +   (c) Any function can be called from any other function. Even main() can be
    called from other functions.


    +   (d) A function can be called any number of times.


    +   (e) The order in which functions are defined in a program and the order in
    which they get called need not necessarily be.


    +   (f) A function can call itself. Such a process is called ''recursion''. We
    would discuss this aspect of Java functions later in this chapter.


    +   (g) A function can be called from another function, but a function cannot
    be defined in another function.


    +   (h) There are basically two types of functions:

    Library functions Ex. readline(), println(), etc.

    User-defined functions Ex. argentina(), brazil(), etc.'
