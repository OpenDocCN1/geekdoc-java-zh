    # Associativity of Operators


    When an expression contains two operators of equal priority, the tie between them
    is settled using the associativity of the operators. All operators in Java have
    either Left to Right associativity or Right to Left associativity. Let us understand
    this with the help of a few examples.


    Here is a tie between operators of same priority, that is between / and *. This
    tie is settled using the associativity of / and *. Both enjoy Left to Right associativity.
    Therefore firstly / operation is done followed by *.


    Consider one more expression.


    a = b = 3;


    Here both assignment operators have the same priority. So order of operations
    is decided using associativity of = operator. = associates from Right to Left.
    Therefore, second = is performed earlier than first =.


    Consider yet another expression.


    z = a * b + c / d;


    Here * / enjoy same priority and same associativity (Left to Right). Compiler
    is free to perform * or / operation as per its convenience, since no matter which
    is performed earlier, the result would be same.


    Note that the precedence and associativity of all operators is predetermined and
    we cannot change it.'
