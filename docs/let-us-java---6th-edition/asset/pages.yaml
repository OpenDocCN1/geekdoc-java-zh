  md: '# Chapter 22: Network & Internet Programming


    The commonly used protocols in each layer of TCP/IP model are shown in Figure
    22.3.


    | Application Layer | HTTP | SMTP | POP3 | FTP | SSH | Telnet |

    | Transport Layer | TCP | | UDP |

    | Internet Layer | IPv4 | IPv6 | ICMP | ARP | RIP |

    | N/W Interface Layer | Ethernet | AppTalk | Token Ring |


    Figure 22.3


    There are many more protocols available in each layer than the ones shown in Figure
    22.3. All these protocols are implemented as a protocol stack by the OS (Operating
    System) and its components.


    The Ethernet protocol indicates how bits are transmitted through different physical
    media (network cables like CAT5, Fiber Optic, etc.) at different speeds.


    The IP protocol provides for transmitting blocks of data from source machine to
    destination machine. Hosts are identified by a unique address known as an IP address.


    IP is a best effort. It doesn''t guarantee the correctness of the delivered data.
    The packets may be lost, get duplicated or may be delivered out-of-order. These
    aspects of packet delivery are addressed by transport layer protocols like TCP
    and UDP.


    The protocols used in the Application layer are chosen based on what the application
    intends to do. For example, for browsing Internet, the HTTP protocol is used,
    for email SMTP and POP3 protocols are used.


    Most of our programs in this chapter will use the protocols in Application layer.


    # Packets


    Traditional telecommunications links transmit data as a series of bytes, characters,
    or bits alone. Unlike this, in a computer network data is transmitted in the form
    of Packets. That''s the reason Internet is often referred to as packet switched
    network. Once the data is'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 426


    # Let Us Java


    formatted into a packet, the network can transmit longer messages

    more efficiently and reliably.


    A packet consists of three elements—header, payload and trailer. As the

    ames suggest, header and trailer are used to mark the beginning of the

    packet and end of the packet, whereas payload contains the actual data

    that is to be transmitted. Technical word for a packet is ‘datagram’.


    # IP Addresses


    To be able to identify the devices in a network and carry out

    communication between them using Internet Protocol (IP), each of

    has has been assigned a unique address. This address is called IP address.

    There are IP addressing schemes IPv4 and IPv6. An IPv4 address is 4

    byte long, whereas an IPv6 address is 16 bytes long. The IPv4 addresses

    commonly written using 4 numbers (one per byte) in a

    dotted-decimal notation. In this notation, each byte in IP address is

    separated by dot. One example of this notation is IP address

    192.168.100.100.


    To avoid miscommunication between machines in a network, their IP

    addresses must be unique. This uniqueness can be achieved in case of

    small networks, especially when these networks are not connected to

    the outside world. However, to guarantee uniqueness of IP addresses in

    b networks spanning cities and continents, the IP addresses are

    created and managed by a central authority called Internet Assigned

    Numbers Authority (IANA). IANA allocates super-blocks of addresses to

    Regional Internet Registars. These in turn allocate smaller blocks to

    Internet Service Providers and enterprises, who in turn further allocate

    taddresses to individual organizations who in turn assign them to

    individual devices.


    # Sockets


    Another term that is commonly used in network communication is

    Socket. Socket is a software construct that identifies an end-point in a

    communication channel. A socket is used by applications as an interface

    to the underlying network and protocols. Applications that

    communicate with one another in a network carry out the

    communication using sockets. Java networking API provides classes for

    creating sockets and sending / receiving packets through them.'
