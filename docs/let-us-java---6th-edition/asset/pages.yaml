  md: '# 190


    # Let Us Java


    If the array is initialized where it is declared, there is no need to use the
    new operator for creating an array as shown in the second and the third examples
    above. Also, when we initialize the arrays in this manner, we are not allowed
    to mention the size of the array in [ ].


    Note that both the following definitions are acceptable.


    ```

    int[] num = { 2, 4, 1, 5, 6, 3 };

    int[] = { 2, 4, 1, 5, 6, 3 };

    ```


    # Array Access


    In Java we can access array elements using any of the following three methods:


    ```

    int[] marks = { 55, 65, 75, 56, 78, 78, 90 };

    int i;

    ```


    ```

    // method 1

    for (int i = 0; i <= 6; i++)

    System.out.print( marks[i] + " " );

    ```


    ```

    // method 2

    for (int i = 0; i <= marks.length - 1; i++)

    System.out.print( marks[i] + " " );

    ```


    ```

    // method 3

    for (int j : marks)

    System.out.print( j + " " );

    ```


    The first method is as usual. In the second method we have obtained the number
    of elements in the array using its length property. In the third method, we don''t
    have to worry about the number of elements in the array, as j takes different
    values present in marks[] array during each iteration through the loop.


    # Bounds Checking


    In Java while accessing array elements we exceed the bounds of the array an error
    would be reported during execution of the program. For example, if the following
    code snippet is executed an error would be reported as num[ 6 ] does not exist.


    ```

    int[] num = { 2, 4, 12, 5, 45, 5 };

    num[6] = 72;

    ```'
