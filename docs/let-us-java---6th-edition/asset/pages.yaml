    # What is Polymorphism?


    Overloading of functions is one kind of polymorphism—one thing existing in several
    distinct forms. We have already dealt with this type of polymorphism. The other
    type of polymorphism simplifies the syntax of performing the same operation with
    a hierarchy of classes. Thus, you can use polymorphism to keep the interface to
    the classes clean, because you do not have to define unique function names for
    similar operations on each derived class.


    When polymorphism is used, a program that appears to be calling a function of
    one class is in reality calling a function of a different class. But suppose we
    have three different classes Line, Circle and Rectangle. Each class contains a
    draw() to draw the relevant shape on the screen. If we are to draw a picture containing
    numerous lines, circles and triangles we can create an array of references which
