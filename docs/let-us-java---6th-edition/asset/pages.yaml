  md: '# 452 Let Us Java


    point precision may vary from one platform to another. It can be mitigated using
    the strictfp keyword.


    As the names suggests, the strictfp modifier stands for strict floating-point
    operations. It ensures that we get the same result on every platform while performing
    float operations. strictfp can be applied to a class, a method or an interface,
    but not to abstract method, variable or on constructor.


    # Packages


    A reasonably big Java software would contain many classes, interfaces and annotations.
    Java helps you organize them properly by storing related classes, interfaces,
    enumerations and annotations in a logical container called Package. This organization
    is helpful in three ways:


    +   (a) Packages makes it easy to locate and use types (i.e., classes, interfaces,
    enumerations and annotations).


    +   (b) Two different packages may contain types with same names. So, if a library
    package contains a type called class Student and we also define a type called
    class Student, so long as they belong to two different packages, we can use thus.
    Thus, packages help avoid naming conflict.


    +   (c) Through packages we can control which type within it can be accessed from
    outside the package.


    To enforce a good design practice Java follows certain rules about packages and
    directory structure. These are as follows:


    +   (a) A new folder is created for every new package. Moreover, package name
    and name folder are always same.


    +   (b) A .java file can contain only one public type. Its name is same as the
    name of the .java file.


