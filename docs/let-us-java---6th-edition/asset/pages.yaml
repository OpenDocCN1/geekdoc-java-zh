  md: "# Chapter 18: Generics 357\n\n```\nCharacter[] chararr = { 'Q', 'U', 'E', 'S',\
    \ 'T' };\n```\n\n```\nprintArray ( intarr );\nprintArray ( floatarr );\nprintArray\
    \ ( chararr );\n```\n\nHere's the output of the program:\n\n10 - 2 37 42 15\n\
    3.14 6.28 -1.5 34 7.234\nQ U E T\n\nAs you can see, the printArr() function now\
    \ works with different data types that we use as arguments.\n\nIsn't this code\
    \ reuse? Yes, but of a different type. Inheritance provides a way to reuse object\
    \ code. Generics provide a way to reuse the source code. Generics can significantly\
    \ reduce code size and increase code flexibility.\n\nLet us now understand what\
    \ grants the generic function the flexibility to work with different data types.\
    \ Here is the definition of the printArr()\n\n```\npublic static <T> void printArray(T[]\
    \ arr) {\n    for (T i : arr) {\n        System.out.printf(\"%s\", i);\n     \
    \   System.out.println(\");\n    }\n}\n```\n\nIn this generic function a data\
    \ type has been represented by a name (T in our case) that can stand for any type.\
    \ There's nothing special about the name T. We can use any other name like type,\
    \ mytype, etc. Throughout the definition of the function, wherever a specific\
    \ data type would ordinarily be written, we substitute it with type T.\n\nNotice\
    \ that calling printArr() function we passed it an array of Integers, Floats and\
    \ Characters and not an array of ints, floats and chars. This is because a generic\
    \ function can work only with reference types and not with primitives like int,\
    \ double, char, etc."
