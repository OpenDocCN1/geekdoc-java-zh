  md: '# Chapter 2: Getting Started


    As the name suggests, value of a constant cannot change (fixed), whereas, value
    of a variable’s can change (vary). A constant is often called a literal, whereas,
    a variable is also known as an identifier. Figure 2.3 gives list of commonly used
    pre-defined primitive data types along with the range of values they can take
    and the numbers of bytes they occupy in memory.


    | Data Type | Range | Size in bytes |

    |---|---|---|n| char | 0 to 65535 | 4 |

    | int | -2147483648 to +2147483647 | 4 |

    | float | -3.4e38 to +3.4e38 | 4 |


    Figure 2.3


    There are certain rules that one needs to observe while creating constants and
    variables. These are discussed below.


    # Rules for Constructing Constants


    +   (a) If no sign precedes a numeric constant, it is assumed to be positive.


    +   (b) No commas or blanks are allowed within a constant.


    +   (c) The bytes occupied by each constant are fixed and do not change from one
    compiler to another.


    +   (d) Only a float constant can be followed by a suffix f.


    +   (e) A float constant must be followed by a suffix f.


    +   (f) A float constant can be expressed in fractional from (example 3.1456f)
    or exponential form (example 3.1456e2).


    +   (g) A character constant is a single alphabet, a single digit or a single
    special symbol enclosed within single inverted commas. Both the inverted commas
    should point to the left. For example, ‘A’ is a valid character constant, whereas
    ‘A’ is not.


    Given below are examples of some valid constants.'
