  md: 'The first line of the Index1 class,


    class Index1 extends Index


    specifies that the class Index1 inherits all the features of the base class Index.
    By doing this, Index1 doesn''t need a constructor or the increment() function,
    since they are already present in the base class. Figure 13.1 shows the relationship
    between the base class and the derived class. Note that the arrow in Figure 13.1
    means "derived from". The direction of the arrow says that the derived class can
    refer to the functions and data in the base class, while the base class has no
    access to the derived class data or functions.


    | Data Members | Member Functions | Base Class |

    | :--- | :--- | :--- |

    | Count | Index() Index ( int c ) display() increment() | |

    | | derived from | |

    | | class Index1 | |

    | | Member Function decrement() |


    Figure 13.1


    Since we have not declared any constructor in Index1, the compiler would insert
    an empty zero-argument constructor in it. When we create an object i, the constructor
    in the base class gets called followed by the empty-argument constructor in the
    derived class. When we call the function increment() it is searched in the derived
    class. Since the derived class doesn''t contain such a function, increment() from
    base class is used to increment count.


    Note that count has been marked as protected. Had it been private it would have
    been available outside the Index class. By marking it as protected, it is now
    available in the Index class as well as in the inheritance chain, i.e. in functions
    of Index1 class.'
