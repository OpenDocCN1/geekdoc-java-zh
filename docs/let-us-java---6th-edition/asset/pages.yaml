  md: "# Chapter 12: Strings and Enums\n\n# Enumerations\n\nThe enumerated data type\
    \ gives you an opportunity to invent your own data type and define what values\
    \ the variable of this data type can take. This can help in making the program\
    \ listings more readable, which can be an advantage when a program gets complicated\
    \ or more than one programmer would be working on it. Using enumerated data type\
    \ can also help you reduce programming errors.\n\nAs an example, one could invent\
    \ a data type called MaritalStatus which can have four possible values—Single,\
    \ Married, Divorced or Widowed. Here’s how MaritalStatus data type can be implemented.\n\
    \n```\nenum MaritalStatus\n{\n    single, married, divorced, widowed\n}\nMaritalStatus\
    \ person1, person2;\n```\n\nThis declaration has two parts:\n\n+   (a) The first\
    \ part declares the data type and specifies its possible values. These values\
    \ are called ‘enumerators’.\n\n+   (b) The second part defines variables of this\
    \ data type.\n\nNow we can give values to these variables:\n\nperson1 = MaritalStatus.married;\n\
    person2 = MaritalStatus.divorced;\n\nInternally, the compiler treats the enumerators\
    \ as integers. Each value on the list of permissible values corresponds to an\
    \ integer, starting with 0. In this example, single is stored as 0, married is\
    \ stored as 1, divorced as 2 and widowed as 3.\n\nLastly, the enumerators used\
    \ in an enum should not contain white space in its name. Thus “eligible bachelor”\
    \ would be an unacceptable enumerator for the MaritalStatus.\n\n# Use of Enumerated\
    \ Data Type\n\nEnumerated variables are usually used to clarify the operation\
    \ of a program. For example, if we need to use employee departments in a payroll\
