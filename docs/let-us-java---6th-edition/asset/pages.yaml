  md: '# Chapter 5: Loop Control Instruction


    +   - When the for statement is executed for the first time, the value of count
    is set to an initial value 1.


    +   - Now the condition count <= 3 is tested. Since count is 1, the condition
    is satisfied and the body of the loop is executed for the first time.


    +   - Upon reaching the closing brace of for, control is sent back to the for
    statement, where the value of count gets incremented by 1.


    +   - Again the test is performed to check whether the new value of count exceeds
    3.


    +   - If the value of count is less than or equal to 3, the statements within
    the braces of for are executed again.


    +   - The body of the for loop continues to executed till count doesn''t exceed
    the final value.


    +   - When count reaches the value 4, the control exits from the loop and is transferred
    to the statement (if any) immediately after the body of for.


    It is important to note that the initialization and incrementation part of a loop
    can be replaced by any valid expression. Thus the following loops are perfectly
    OK.


    ```

    for ( i = 1; i <= 10; System.out.println (i++ ));

    ```


    ```

    Scanner scn = new Scanner ( System.in);

    for ( i = scn.nextInt(); i <= 10; i++)

    System.out.println(i);

    ```


    # Partial for Loops


    We can drop the initialization, test (condition) or incrementation part of a for
    loop. Thus all the following loops would be correct and would print numbers from
    1 to 10.


    ```

    // Method 1 - Normal for loop

    int i;

    for (i = 1; i <= 10; i=i+ 1)

    System.out.println (i);

    ```


    ```

    // Method 2 - Drop initialization

    ```'
