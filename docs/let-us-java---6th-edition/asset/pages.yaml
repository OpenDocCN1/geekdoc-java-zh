  md: "# Object Destruction\n\nWhen the object is created using the operator new,\
    \ memory is allocated for it. We should not free this memory when we are done\
    \ with using this object? This is not necessary, as this is done for us by the\
    \ JVM. It has a program called Garbage Collector, which runs periodically. When\
    \ it runs, it checks for objects that are no longer used by an application. It\
    \ then reclaims (frees) the memory used to store all objects. So, as far as memory\
    \ management for objects is concerned, we do not have to worry much about it,\
    \ and can safely rely on garbage collector to do it for us. This is unlike OO\
    \ languages like C++ where programmers have to manage the memory explicitly.\n\
    \nHowever, in many Java programs, memory is not the only resource that is used.\
    \ Other resources like files, network connections, database connections, are also\
    \ used. When we no longer need the objects that we use should release these resources\
    \ in a disciplined manner. This is a waste of resources. At times, if the pool\
    \ of resources gets exhausted then the program may stop running. Java provides\
    \ a mechanism called finalize() function to give up the resources the object is\
    \ no longer needed. This function is defined inside the class and is called by\
    \ the garbage collector before reclaiming the object.\n\nThus the finalize() function\
    \ is opposite of a constructor. The constructor is called when an object is created.\
    \ Similarly, when an object is destroyed by the garbage collector the finalize()\
    \ function is called. Note that we have no control over when the finalize() function\
    \ is called by the Garbage Collector.\n\nThe following program shows finalize()\
    \ at work:\n\n```\n/* Object destruction using finalize() */\npackage objectdestructionproject;\n\
    \nclass Example\n{\n    private int data;\n\n    public Example() // contructor\
    \ (same name as class)\n    {\n        System.out.println(\"Inside the constructor\"\
    );\n    }\n}\n```"
