    # Maintaining a Stack\n\nA Stack is a data structure in which addition of new\
    \ element or deletion of an existing element always takes place at the same end.\
    \ This end is often known as top of stack. This situation can be compared to a\
    \ stack of plates in a cafeteria where every new plate added to the stack is added\
    \ at the top. Similarly, every plate taken off the stack is also from the top\
    \ of the stack. Thus stack is a last-in-first-out (LIFO) list. When an item is\
    \ added to a stack, the operation is called push, and when an item is removed\
    \ from the stack the operation is called pop.\n\nGiven below is a program that\
    \ maintains a stack of city names using the collection class Stack. Note that\
    \ before calling the pop() function we need to assert whether the stack has any\
    \ element left in it. This is done by calling the isEmpty() function.\n\n```\n\
    package stackDemo;\nimport java.util.*;\npublic class StackDemo\n{\n    public\
