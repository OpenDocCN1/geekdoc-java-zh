  md: '# 136


    # Let Us Java


    function call to another. Possibly Figure 8.1 would make things a bit clearer.


    Assume that the number entered through readline() is 3. Using Figure 8.1 let us
    visualize what exactly happens when the recursive function rec() gets called.
    The first time when rec() is called from main(), x collects 3. From here, since
    x is not equal to 1, the block is skipped and rec() is called again with the argument
    (x −1), i.e. This is a recursive call. Since x is still not equal to 1, rec()
    is called yet another time, with argument (2 - 1). This time as x is 1, control
    goes back to previous rec() with the value 1, and f is evaluated as 2.


    Similarly, each rec() evaluates its f from the returned value, and 6 is returned
    to main(). The sequence would be grasped better by following the arrows shown
    in Figure 8.1. It let be clear that while executing the program, there do not
    exist many copies of the function rec(). These have been shown in Figure 8.1 just
    to help you keep track of how the control flows through successive recursive calls.


    ![](img/768d650138b7acfe46806942770377ed_147_0.png)


    Figure 8.1


    Recursion may seem strange and complicated at first glance, but it is often the
    most direct way to code an algorithm, and once you are familiar with recursion,
    the clearest way of doing so.'
