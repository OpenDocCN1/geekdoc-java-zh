    # The Java Streams Solution


    To meet the expectations of a mature I/O system Java designers decided that all
    I/O operations should be performed using I/O Streams. A stream is a sequence of
    bytes that travel from source to destination over a communication path. A program
    can read data from a stream or write data to a stream. The streams are linked
    to physical devices by Java I/O system. Most of the communication details are
    hidden from us by the I/O system and we are required to concentrate only on what
    we wish to'
