    # Arithmetic Instruction


    A Java arithmetic instruction consists of a variable name on the left hand side
    of =, and variable names and constants on the right hand side of =. The variables
    and constants appearing on the right hand side of = are connected using arithmetic
    operators like +, -, *, and /.


    +   Ex.:

    int budget;

    float alpha, beta;

    budget = 3200;

    beta = 0.5f;

    alpha = beta + 3.2f * 2 / 5 - 3;


    Here,


    +   *, /, -, + are the arithmetic operators

    = is an assignment operator

    2, 3, 5 and 3200 are integer constants

    0.5 and 3.2 are float constants

    budget is an integer variable

    alpha, beta are float variables.


    The variables and constants together are called ''operands''. While executing
    an arithmetic statement the operands on the right hand side are operated upon
    by the ''arithmetic operators'' and the result is then assigned, using the assignment
    operator, to the variable on left hand side.


    A Java arithmetic statement could be of three types. These are as follows:


    +   (a) Integer mode arithmetic statement - This is an arithmetic statement in
    which all operands are either integer variables or integer constants.'
