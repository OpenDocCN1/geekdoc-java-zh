  md: 'In structured programming, there is less need of global variables, which are
    now replaced by local variables that have a smaller and more controllable scope.
    Information is passed between functions using parameters and functions can have
    local variables that cannot be accessed outside the function''s scope.


    By isolating processes within functions, a structured program minimizes the chance
    that one function will affect another. This also makes it easier to locate problems,
    if any. Structured programming helps in writing cleaner code and in maintaining
    control over each function. This makes the development and maintenance of code
    as well as as efficient.


    A new concept came into existence with structured programming—Abstraction. Abstraction
    permits the programmer to look at something without being concerned with internal
    details. In a structured program, it is enough to know which task is performed
    by function. It does not matter to the programmer how that task is performed so
    long as the function does it reliably. This is called abstraction and is the corner-stone
    of structured programming.


    Structured programming dominated the software world for almost two decades—from
    1970 to 1990. With the constant improvement in the hardware and increasing demands
    from the users for feature-rich programs, the complexity of programs increased
    multi-fold and that''s the time structured programming approach showing signs
    of strain. This occurred because of the following weaknesses in the structured
    programming model:


    +   (a) The primary components of structured programming—functions and data structures—didn’t
    make the real world problems in a natural way.


    +   (b) Mechanisms to reuse existing code were limited.


    +   (c) Maintaining, debugging and upgrading large programs were a difficult task.


    The solution to these limitations is discussed in the next section.


    # Object-Oriented Programming


    The real-world problems and their solutions are not organized into values and
    procedures separate from one another. Instead, they are perceived as objects containing
    values that either access or manipulate these values. The world is full of objects
    and the OOP'
