    (c) Drop Table - Delete the table from the database including all the records
    present in it.


    To carry out these operations a simple language has been created. It is called
    SQL, standing for Structured Query Language. This language provides simple English
    like statements to perform database operations. SQL is supported by almost every
    RDBMS and it allows you to work with a database independently of the underlying
    RDBMS.


    Given below are some sample SQL statements for carrying out database operations.
    The comments before each SQL statement would help you understand the operation
    being performed by the SQL statement.


    ```

    // Create a table called Persons containing two fields EmpID of the type

    // int and Name of the variable length string of 255 characters

    CREATE TABLE ( EmpID int, varchar ( 255 )

    ```


    ```

    // Modify Persons by adding a field DateOfBirth of the type date

    ALTER TABLE Persons ADD DateOfBirth

    ```


    ```

    // Modify the Persons by deleting the column DateOfBirth

    ALTER TABLE Persons DROP COLUMN DateOfBirth

    ```


    ```

    // Delete the Customers table

    DROP TABLE Customers

    ```


    SQL also provides statements on a table include Create new record(s), record(s),
    Read existing record(s), Update existing record(s), Delete existing record(s).
    In short these are known as CRUD operations. The SQL statements that carry out
    these operations are often known as SQL queries. Given below are some sample SQL
    statements for carrying out CRUD operations.


    ```

    // Insert a new record in Persons table, with values 101 and Sunil of the

    // EmpID and Name respectively

    INSERT INTO Persons ( EmpID, Name) VALUES ( 1001, ''Sunil'' )

    ```


    ```

    // Read all records from Employees table

    SELECT * FROM Employees

    ```


    ```

    // Modify record whose Employee ID is 1001 by changing his Name field

    // to hold a value Satish

    ```'
