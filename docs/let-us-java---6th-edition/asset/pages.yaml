  md: "# 346\n\n# Let Us Java\n\n# The Synchronized Block\n\nAt times it may so happen\
    \ that a class has been developed with a view to use it in single thread situation.\
    \ But later on a need arises to use it in a multithreaded situation. If we do\
    \ not have access to its source code, we cannot mark the methods in as synchronized.\
    \ In such situations, the solution is to use a synchronized block.\n\nIn the context\
    \ of our program in the previous section, suppose we do not have access to source\
    \ code of Output class. We cannot mark display() as synchronized method. In this\
    \ case we need to simply make the call to display in a synchronized block as shown\
    \ below, to get the desired output.\n\n```\npublic void run() {\n    synchronized\
    \ ( o ) {\n        o.display ( message );\n    }\n}\n```\n\n# Inter-thread Communication\n\
    \nThe programs in the Synchronization section unconditionally blocked other threads\
    \ from asynchronous access to certain methods. To improve the overall performance\
    \ of the program there should be a mechanism to notify a waiting thread that it\
    \ can start running. This means that one thread should be able to communicate\
    \ with the other. To achieve this Java provides three methods—wait(), notify()\
    \ and notifyAll(). Given below is the purpose of each of these methods.\n\n| Method\
    \ | Purpose |\n| --- | --- |\n| wait() | Tell calling thread to go to sleep till\
    \ notified |\n| notify() | Wakes up thread that called wait() on same object |\n\
    | notifyAll() | Wakes up all threads that called wait() on same object |\n\nFigure\
    \ 17.1"
