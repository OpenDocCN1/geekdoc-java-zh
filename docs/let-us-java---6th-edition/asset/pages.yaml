  md: '# Chapter 15: Exception Handling 275


    Programming is a difficult art. No matter how much confidence you have in your
    programming ability, several things wrong during its development. This includes
    typing errors, compilation errors, linking runtime errors. The first three types
    of errors are comparatively easy to tackle. But when errors occur during execution,
    your program has to deal with the situation in an elegant fashion. This chapter
    discusses how to deal with such types of errors.


    The errors that occur at runtime—i.e., during execution of the program—are called
    Exceptions. The reasons why exceptions occur are numerous. Some of the most common
    ones are as follows:


    +   (a) Falling short of memory

    (b) Inability to open a file

    (c) Exceeding the bounds of an array

    (d) Attempting to initialize an object to an impossible value

    (e) Division by zero

    (f) Stack overflow

    (g) Arithmetic over flow or under flow

    (h) Attempt to use an unassigned reference

    (i) Unable to connect to Server


    When such exceptions occur, the programmer has to decide a strategy according
    to which he would handle the exceptions. The strategies could be, in case of a
    GUI environment, or requesting the user to supply better data or simply terminating
    the program execution. Which of these strategies would be adopted depends on whether
    the exceptional condition can be anticipated or not. Figure 15.1 shows some examples
    of these exceptional conditions.'
