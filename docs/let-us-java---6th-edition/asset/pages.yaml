  md: '# Chapter 21: JDBC


    Data is the King! In today''s digital world enormous amount of data is being generated
    and exchanged. All this data finally gets stored in a database. As a Java programmer
    one must know how to handle this data programmatically. To help us do this Java
    provides an API called JDBC. It stands for Java Database Connectivity. This API
    lets us write Java programs that can interact with a wide range of databases.
    How this can be done is discussed in this chapter.


    # Data Organization


    Modern way of organizing data is in a Relational Database Management System or
    RDBMS. Different vendors provide this RDBMS software. These include Oracle, Microsoft,
    IBM, etc. There are several open source implementations available as well, the
    most popular among which is MySQL. All these RDBMS are accessible through the
    JDBC API.


    Each of these RDBMS organizes the data in the form of different tables. One database
    may contain multiple tables. Each table contains data organized in the form of
    records (rows). Each record may contain multiple fields (columns).


    For example, a company may have a database containing Employees table containing
    records about employees working in an organization. Each record may contain fields
    like Name, Age, Salary, etc.


    Unlike University database may consist of tables for students, professors, courses,
    examinations, payments, etc. It is also possible to establish relationships between
    tables. For example, if a student pays fees, then the record of fees paid can
    be linked to his record in the student table. This would be a one-to-one relationship.
    If the student pays fees multiple times then it would become a one-to-many relationship.


    # Common Database Operations


    There is a set of typical operations that one needs to carry out on database of
    any kind. These are as follows:


    +   (a) Create Table - Create a table by specifying its name and the fields it
    would contain along with the type of each field.


    +   (b) Modify Table - Modify the specifications of different fields, or add /
    delete certain fields.'
