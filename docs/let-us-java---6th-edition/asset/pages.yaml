    \ occur during its execution is enclosed in a try block. When the exception occurs\
    \ and an exception object is thrown is transferred to another section of code\
    \ in the application called exception handler or a catch block. This runtime errors\
    \ generated in the try block are caught in the catch block. Code that doesn't\
    \ expect an exception to occur need not be within the try block.\n\nThe following\
    \ code snippet shows the organization of try and catch blocks. It is not a working\
