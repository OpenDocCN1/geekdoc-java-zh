  md: '# Chapter 19: Java Collections


    Java became a popular choice amongst programmers to implement solutions, a need
    was felt to have a standard way to handle the data in the program. A set of classes
    were made available to handle the data. These included classes like Vector, Stack,
    Dictionary, etc. However, these classes lacked a unified approach in the sense,
    the usage of each was not consistent with the usage of other. When Generics were
    introduced in Java a completely new set of classes and interfaces were created
    in Java API for handling data. These classes came to be known as Java Collections
    Framework. Let us now get to the root of it.


    # Why a New Approach?


    Suppose in a program we wish to store, retrieve and manipulate numbers and strings.
    An easy and intuitive way to handle this situation would be to create arrays of
    numbers and strings. However, this approach has following limitations:


    +   We not want fixed-size arrays. We may want arrays to grow in size dynamically
    as we keep adding elements to it. This requirement cannot be met by normal arrays,
    at least not without an effort of allocating space for bigger-sized array, copying
    existing elements into this space, etc.


    +   There may be a need to maintain data in different ways Dictionary (where order
    is important), Key-Value maps, like cell number (key) and name (value).


    +   There may be a need to access data in different ways—Last In First Out (as
    a stack), First In First Out (as a queue), or sorted order.


    To handle all dynamics a completely new Java library based on Generics, called
    Java Collections Framework was introduced. This collections framework contains
    Collection classes, Interfaces and Algorithms (set of static functions in the
    Collections class). Some of the highlighting features of this collection framework
    are:


    +   Since the collections framework is based on generics it lets you handle virtually
    any type of data.


    +   The collections framework provides a set of very efficient classes to carry
    out most data management functionality. Do not confuse this with database management,
    which involves management of data'
