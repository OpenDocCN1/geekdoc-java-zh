    The wizard would add the code to create and display the window in main(). When
    the window is created, an object of ConvertTemp would be created. This would result
    into call to its constructor and in turn to initComponents().


    One question that might be troubling—what is the difference between a container
    and a control? Control is something that the user interacts with, like a push
    button, a check box or a combo box. As the name suggests, a container is something
    that would hold these visual controls.


    Now that we have understood the code to create the window, container and controls,
    let us now turn our attention to a phenomenon called event handling.


    # Event Handling


    In simplest words an event is a thing that takes place. Programmatically it means
    change in the state of an object. Events occur all the time when we are interacting
    with a GUI application. For example, when we enter a character from keyboard,
    or move the mouse, or click the left mouse button, events occur. These events
    are generated as a consequence of interaction with the graphical components in
    the GUI. Such events are known as Foreground events.


    Apart from these, events also occur without any user interaction. For example,
    expiry of a timer, completion of some ongoing task, occurrence of an interrupt,
    Such events are known as Background Events.


    When an event occurs, the program is supposed to react to that event. That reaction
    is known as event handling. Programmatically, a function known as event handler
    gets executed when an event occurs. To ensure that all events are handled in a
    standard manner, Java uses a'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Chapter 20: User Interfaces 395


    mechanism called Event Delegation Model to handle the events. This mechanism involves
    two key players:


    +   (a) Source - The source is an object on which the event occurs. For example
    objects of JButton, JTextField, JComboBox are all sources. These sources provide
    information of the occurred event to their respective handlers.


    +   (b) Listener - The listener listens to (i.e. it waits for) an event to occur.
    When an event occurs, the listener processes the interface containing prototypes
    of functions. For example, the MouseListener interface contains prototypes of
    functions like mouseClicked(), mousePressed( ), mouseReleased( ), etc.


    The events themselves are represented using readymade classes like MouseEvent,
    KeyEvent, Action. When an event occurs, objects are created and passed to the
    listener functions (defined in a class that implements the listener interface)
    to tackle the event.


    Different applications would react to occurrence of same event differently. For
    example, on clicking a mouse one application may print a page on the printer,
    whereas, another application may draw a circle in the window. In both applications,
    different functions would have to be written for the same mouse event. These functions
    are nothing but the implementations of the functions declared in the MouseListener
    interface.


    Let us understand this interplay of multiple classes, objects and interfaces with
    reference to our temperature converter application. We did two specific things
    in this application. These are as follows:


    +   (a) We dragged and dropped the button in our window and gave it a name btnConvert.


    +   (b) For the Convert button, for the actionPerformed event, we added an event
    handler function. We called this function btnConvertActionPerformed( ).


    As a result of step (a) above, a private variable btnConvert of the type JButton
    got declared in the ConvertTemp class. An object of JButton class got created
    in initComponents() and its address got stored in btnConvert.'
