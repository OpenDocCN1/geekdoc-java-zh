  md: "# Chapter 18: Generics\n\nGenerics are a mechanism that make it possible to\
    \ use one class or handle many different data types. By using generics, we can\
    \ design a single function/class that operates on data of many types, instead\
    \ of having to create a separate function/class for each type. In this chapter\
    \ we would first look at using generics with functions and then move on using\
    \ generics with classes.\n\n# Generic Functions\n\nSuppose you wish to print contents\
    \ of an integer array. To achieve this\n we write a function as shown below:\n\
    \n```\n```\nvoid printIntArr ( int [] arr )\n{\n  for ( int i : arr ) {\n    System.out.println(i);\n\
    \  }\n}\n```\n```\n\nHere the printIntArr() is defined to receive an int array\
    \ and\nthen print all its elements through a for loop. What if we wish to print\n\
    float array—we would be required to write a completely new\nfunctionFloatArr().\
    \ Similarly, to print a char array we would be\nrequired to write printCharArr()—a\
    \ separate version of the same\nfunction.\n\nYou would agree that this is a suitable\
    \ case for overloaded functions,\nas all these functions have different names\
    \ but essentially carry out\nt same activity—printing elements of an array passed\
    \ to them. This\nway, at least the names of all these functions can be same. These\n\
    overloaded functions are given below:\n\n```\n```\n// printArr for ints\nvoid\
    \ printArr ( int [] arr )\n{\n  for ( int i : arr ) {\n    System.out.println(i);\n\
    \  }\n}\n```\n```\n\n```\n```\n// printArr for floats\nvoid printArr ( float []\
    \ arr )\n{\n  for ( float i : arr ) {\n    System.out.println(i);\n  }\n}\n```\n\
    ```"
