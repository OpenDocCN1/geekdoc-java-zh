  md: "# 356\n\n# Let Us Java\n\n```\n}\n```\n\n```\n// printArr for chars\nvoid printArr(\
    \ char [ ] arr)\n{\n    for ( char i :arr)\n    System.out.println(i);\n}\n```\n\
    \n```\n//etc...\n```\n\nWe have gained anything by writing these overloaded functions?\
    \ Not much, because we still have to write a separate definition for each type.\
    \ This results into three disadvantages:\n\n+   (a) Rewriting the same function\
    \ body over and for different types is time consuming.\n\n+   (b) The program\
    \ consumes more disk space.\n\n+   (c) If we decide to modify one such function,\
    \ we need to remember to make the modification in other overloaded functions.\n\
    \nWon't it be nice if we could write such a function just once, and make it work\
    \ for many different data types. This is exactly what function generics provide\
    \ for us.\n\nThe following program shows how to write the printArr() function\
    \ as a generic function, so that it will work with any standard type. We have\
    \ invoked this function from main() for different data types.\n\n```\npackage\
    \ genericFunction;\npublic class Generic\n{\n    public static <T> void printArray(T\
    \ [ ] arr)\n{\n        for ( T i : arr)\n        System.out.printf(\"%s \\ i);\n\
    \    }\n    System.out.println();\n}\npublic static void main ( String args[])\n\
    {\n    Integer[ ] intarr = { 10, -2, 37, 42, 15 };\n    Float[ ] floatarr = {\
    \ 3.14f, 6.28f, -1.5f, -3.44f, 7.234f };\n}\n```"
