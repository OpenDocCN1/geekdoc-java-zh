    # switch Versus if-else Ladder


    There are some things that you simply cannot do with a switch. These are:


    +   (a) A Float, double, boolean, or long expression cannot be tested using a
    switch.


    +   (b) Cases can never have variable expressions (for example it is wrong to
    say case a + 3 : and case 1 + 2 : is illegal).


    +   (c) Multiple cases cannot use same expressions. Thus a switch containing case
    3 is illegal. Then why use a switch at all? For speed—switch works faster than
    an equivalent if-else ladder. How? Well, this is because the compiler generates
    a jump table for a switch during compilation. As a result, during execution it
    simply refers the jump table to decide which case should be executed, rather than
    actually checking which case is satisfied.


    (a), (b) and (c) above may lead you to believe that these are obvious disadvantages
    with a switch, Then why use a switch at all? especially since there weren''t any
    such limitations with if-else.


    Note that a lookup in the jump table is faster than evaluation of a condition,
    especially if the condition is complex.


