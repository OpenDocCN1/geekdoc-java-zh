    But when a situation arise where we want to prevent creation of an object? Well,
    let us go back to our previous example. Suppose there is base class Shape containing
    a draw() function. From this Shape class three classes Line, Circle and Rectangle
    are derived. In this case we would never want to make an object of the Shape class;
    we would only make objects of the derived classes as they would draw specific
    shapes. In this case we would define Shape as an abstract class and draw() as
    an abstract function in this class. We would provide an implementation of draw()
    function in each of the derived classes. draw() functions would let us draw specific
    line, circle or rectangle shapes.


    Whenever an abstract function is placed in the base class, you must override it
    in all the derived classes from which you wish to create objects. If you don''t
    implement the function in the derived class, then the derived class is treated
    as an abstract class.


