  md: '# 242


    # Let Us Java


    adding data members and member functions (and redefining existing member functions)
    you leave the existing code—that someone else may still be using—untouched and
    debugged. If a bug happens, you know it''s in your new code, which is much shorter
    and easier to read, than if you had modified the body of existing code.


    It''s rather amazing how cleanly the classes are separated. You don''t even need
    the source code for the member functions to reuse the code. Just use the byte-code
    containing the compiled member functions would do.


    It''s important to realize that program development is an incremental process.
    Nobody conceived the program in its entirety at the start of the project. The
    program should try to create and manipulate objects of various types to express
    a model in the terms given to you by the problem definition. Rather than constructing
    the program all at once it would grow out as an organic, evolutionary creature.
    Of course, at some point after stabilize you need to take a fresh look at your
    class hierarchy with an aim collapse it into a sensible structure. Inheritance
    fits this bit to perfection.


    # Other Code Reuse Mechanisms


    Java facilitates code reuse at 2 levels—Source code level and Byte level. In source
    code reuse mechanism, the code cannot be reused to build new code, unless the
    source code is available. Source code level reuse is done in Java using Generic
    functions and Generic classes. Generics let us write functions / classes and the
    compiler creates specific functions / classes from it. For creating specialized
    functions / classes source code has to be available. Chapter 18 discusses this
    mechanism in detail.


    Byte code reuse is implemented in java using Containership and Inheritance. Inheritance
    should be used when the two classes have a "has a" relationship between them.
    For example, a problem may have two classes Address and Employee. An Employee
    object may contain an Address object, apart from other data like name, age, salary
    etc.


    Inheritance should be used when the two classes have a "like a" relationship.
    For example, if a problem has two classes Window and Button, then the Button class
    can be inherited from Window class since Button is like a Window.


    Containership and Inheritance can be implemented even if source code is not available.'
