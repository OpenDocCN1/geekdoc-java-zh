  md: '# Chapter 13: Inheritance


    demonstrates that we have used one of the features of the base class, namely fun(),
    as it is, through a derived class object.


    When we called save(), again the function was searched in derived class NewEx.
    Since the function was found in NewEx, this version of save() (and not the one
    in Ex class) got called. This demonstrates that through inheritance we are able
    to override functionality. Same is the case with the function enc().


    When we called autoUpdate() the function was searched and found in NewEx. Since
    there was no autoUpdate() function in base class this is the case where a totally
    new functionality is provided through inheritance.


    Lastly, when we called open() the function was searched and found in NewEx. This
    version of open() got called and this in turn called the base class version of
    open() through the super.open(). The resulting output was:


    Inside NewEx - open()

    Inside Ex - open()


    This indicates the usage of inheritance to combine new functionality with old.


    Note the following important points about Inheritance relationships:


    +   (a) We can derive a class from a class which itself has been derived from
    another class. Thus, multiple levels of inheritance can exist.


    +   (b) A class cannot have multiple base classes. That is, a derived class cannot
    be derived from more than one class.


    # Constructors in Inheritance


    As we know, the base member functions can be called from derived class member
    function using the syntax:


    ```

    super.functionName();

    ```


    Here super is a keyword and functionName() is the name of the function in the
    base class. Unless explicitly called, the base class function doesn''t get called
    from the body of the derived class function. Constructors in inheritance chain
    are given a different treatment.'
