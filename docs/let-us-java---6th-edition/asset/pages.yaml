  md: '# Chapter 23: Miscellany


    The topics discussed in this chapter were too large or far too removed from the
    mainstream Java programming for inclusion in the earlier chapters. These topics
    provide useful programming features, and could prove to be of immense help in
    certain programming strategies. These include CLASSP variable, strictfp modifier,
    packages andwise operators. Let us understand them by one.


    # CLASSP Variable


    Our Java program may use types stored in other .class files. CLASSPATH is a mechanism
    that helps Java runtime environment locate the other .class files. It is an environment
    variable and contains a list of directories that contain third-party and user-defined
    types.


    CLASPATH is different from the PATH environment variable. PATH is used by Operating
    System to locate executable files, whereas CLASSPATH is used to locate the .class
    files. The default value of CLASSPATH is ''''. This means the search for .class
    files is carried out only in current directory or its sub-directories.


    In Windows the CLASPATH variable can be set permanently through Control Panel
    or at command prompt. Given below is an example of setting it at command prompt.


    ```

    set CLASPATH=%CLASPATH%;C:\ProgramFiles\Java\mylib

    ```


    Here %CLASPATH% gives the existing value of CLASPATH variable. We have two directories
    in the list, '''' and ''C:\ProgramFiles\Java\mylib'' separated by a semicolon
    (;). The .class files would be searched in current directory. If not found, they
    would be searched in mylib directory.


    If we wish to set the CLASSPATH value temporarily, we can do so as shown in the
    following example:


    ```

    java -classpath ;c:\ProgramFiles\Java\mylib sample.jar

    ```


    If executed under Linux remember to replace \ and ; with / and respectively.


