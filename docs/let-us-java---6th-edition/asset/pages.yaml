    Look at the definition of Rectangle class in our program. The keyword class is
    followed by the name of the class, i.e., Rectangle. The body of a class is defined
    by braces. The Rectangle class contains two data items len and br and four functions
    setData( ), getData( ), displayData( ) and area(). As their names suggest, the
    first function sets the data items (len and br) to values passed to it, the second
    function receives the values of data items, the third displays these values, whereas
    the fourth calculates and prints the area and the perimeter.


    The data items defined in a class are often called data members, whereas the functions
    defined in it are called member functions or methods. The member functions provide
    controlled access to the data members of class. This controlled access is managed
    through two keywords—private and public.


    Note that we have defined the data members as private. As a result, they cannot
    be accessed directly from outside the Rectangle class. Thus the data remains safe
    from accidental manipulation.


    Only the member functions of Rectangle class can access the private data members.
    To permit access to these member functions from outside the Rectangle class, they
    have been defined as public. Thus, when we wish to access or manipulate the data
    members from outside we call the public member functions, which in turn access
    the private data members. This is what we mean by controlled access.


    Usually the data members in a class are private and the member functions are public.
    This ensures that data remains safe from inadvertent manipulation. However, there
    is no rule that data must be private and public. In fact, in some situations you
    may be required to use private functions and public data.


    Don''t confuse hiding with the security techniques used to protect computer data.
    Security techniques prevent illegal users from accessing data. Data hiding, on
    the other hand, is used to protect well-intentioned users from honest mistakes.


