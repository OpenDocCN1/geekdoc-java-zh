    # Thread Priorities


    If we assign priorities to each running thread. This helps the scheduler to determine
    the order in which these threads are executed. Threads with higher priority are
    more important to a program and are allocated processor before lower-priority
    threads. A Java thread can have three standard Priorities—MIN_PRIORITY, MAX_PRIORITY,
    NORM_PRIORITY. These represent numbers 1, 10 and 5. Java provides following functions
    to set a new priority for a thread and to obtain a thread''s current priority.


    ```

    final void setPriority ( int level )

    final int getPriority()

    ```


