  md: '# Chapter 9: Introduction to OOP


    methodology helps us expresses computer programs in ways that model how people
    perceive the world.


    The fundamental change in OOP is that a program is designed around the data being
    operated upon, rather than around the operations themselves. This is to be expected
    once we appreciate the prime purpose of the program is to access or manipulate
    data. The basic idea behind object-oriented language is to combine into a single
    unit, both the data and the functions that operate on the data. Such a unit is
    called an object.


    An object''s functions, called member functions or methods, typically provide
    the only way to access its data. If you want to access a data item in an object,
    you call a member function in the object. You will read the item and return the
    value to you. You can''t access the data directly.


    If you want to modify the data in an object, you call the member functions in
    the object. No other functions can access the data. This simplifies writing, debugging,
    and maintaining the program.


    A Java program typically consists of a number of objects which communicate with
    each other by calling one another’s member functions. The organization of a Java
    program is shown in Figure 9.2.


    ![](img/768d650138b7acfe46806942770377ed_158_0.png)


    Figure 9.2'
