  md: '# Chapter 22: Network & Internet Programming


    (m) Network adapters serve the purpose of transmitting and receiving data on,
    a wired and a wireless network.


    # Networking Model


    In early days of networking PCs from same manufacturer could communicate with
    one another. As networking became popular, a need was felt to help vendors create
    interoperable network devices and software. Typical issues involved in networking
    include how to create packets, how to route and correct errors, from one host
    to another, how to support multiple OS, how to deal with heterogeneous network
    cabling, etc.


    Towards this end in late 70s IOS defined a standard Open Systems Interconnection
    (OSI) reference model. OSI uses a 7-layered network model, with each layer responsible
    for different aspects (mentioned above) of network communication.


    For Internet, the computing industry has combined the layers of the OSI model
    into a single layer. As a result, a 4-layer model called TCP/IP model has emerged.
    This model is shown in Figure 22.2.


    | Application Layer | Data | Application Layer |

    | Transport Layer | Data | Transport Layer |

    | Internet Layer | Data | Internet Layer |

    | N/W Interface Layer | Data | N/W Interface Layer |


    --> Logical connection in each layer

    --> Physical movement of data


    Figure 22.2


    The purpose of each layer in brief is as follows:


    +   (a) Application Layer - This layer provides services for user applications
    for sending/receiving emails, web browsing, file transfer, audio and/or video
    streaming, etc.


    +   (b) Transport Layer (TCP layer) - This layer ensures that there is a reliable
    channel for the application layer. This means that it ensures'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# 424


    # Let Us Java


    whatever is sent from one end of the connection arrives at the other end, without
    errors or omissions, and in the same order as sent.


    The transport layer may have to split the data into packets to give to the IP
    layer. The TCP layer has to include sequence information in the packets to re-assemble
    them in the correct order at the far end, and to detect if a packet has gone missing.
    It also needs to be able to resend a packet when happens.


    +   (c) Internet Layer (IP layer) - This layer''s function is to transfer a packet
    of data provided by the transport layer from source address to destination address
    on the Internet.


    +   (d) Network Interface Layer - This layer carries out actual transmission of
    bits with implementations for a wide range of networks Ethernet, WiFi, optic fiber,
    etc.


    Each receiver receives services from layer below and provides services to the
    layer above it. A layer doesn''t need to know anything about how the layer below
    it. It merely uses the service provided to it. This allows any layer to be swapped
    out for an alternative, and the layers above and below don''t care as long as
    the service provided by each underlying layer is the same.


    For example, one implementation of network interface layer may send data over
    Ethernet, and another implementation handles sending the data over a phone line.
    The Internet layer doesn''t need to know anything about the network interface
    layer. The standard service provided by the network interface layer, regardless
    of whether Ethernet or a phone line is carrying the data, allows the Internet
    layer to work in exactly the same way regardless. Thus, the layered model makes
    the complexity of network communication more manageable.


    Note that each layer feels that it is directly communicating with same layer in
    another machine. The data passes down a layer, a header and trailer specific to
    that layer gets added to it. Similarly, when the data reaches the other end and
    travels up the layers the headers and trailers are stripped.


    # Protocols


    Protocols are a set of rules that the network, computers and applications agree
    upon to carry out communication between devices.'
