    # # The ! Operator


    So far we have used only the logical operators && || || The third logical operator
    is the NOT operator, written as ! This operator reverses the result of the expression
    it operates on. For example, if the expression evaluates to true, then on applying
    ! operator it results into a false. Vice versa, if the expression evaluates to
    false, then on applying ! operator it makes it true. Here is an example of the
    NOT operator applied to a relational expression.


    ! (y < 10)


    This means “not y less than 10”. In other words, if y is less than 10, the expression
    will be false, since ( y < 10 ) is true. We can express the same condition as
    ( y >= 10 ).


    The NOT operator is often used to reverse the logical value of a single boolean
    variable, as in the expression


    ```

    if (! flag )

    ```


    This is another way of saying


    ```

    if ( flag == 0 )

    ```


    Does the NOT operator sound confusing? Avoid it if you want, as the same thing
    can be achieved without using the NOT operator.


    Figure 4.3 summarizes the working of all the three logical operators.'
