    # Let Us Java


    When we performed step (b) above, a call to the function addActionListener() got
    added in initComponents() }. This call is made using btnConvert. This call ties
    the ActionListener interface with the Convert button. ActionListener interface
    has the following method declaration in it:


    void actionPerformed( ActionEvent e );


    In initComponents() this method is implemented in a class (often called anonymous
    class). Object of this class is passed to the addActionListener() method.


    When we click the Convert button, an actionPerformed event occurs. Information
    about this event is packed in an ActionEvent object. This object is then passed
    to the controls for the actionPerformed( ) method of the anonymous class. From
    our event handler—the function btnConvertActionPerformed() gets calls. In this
    method we do the temperature conversion and display the result in the text field.


    It is said for event handling Java uses Event Delegation model. This means that
    the responsibility of event handling is delegated (assigned) to listeners. As
    a result, the logic that displays the controls and generates the events remains
    completely separated from the logic that reacts to these events.


    In this model, the listener needs to be registered with the source object (button
    in our example), so that the way the event notifications are sent only to those
    listeners who wish to receive them.


