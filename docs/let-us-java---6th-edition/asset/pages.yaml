  md: '# Chapter 16: Effective Input/Output 307


    read from where, and what we wish to write where. Figure 16.1 should help you
    understand this concept better.


    | Source | 001011 | Java Program |

    | | | Input Stream |

    | Java Program | 110011 | Destination |

    | | | Output Stream |


    Figure 16.1


    Streams are implemented using classes in java.io package. This abstraction of
    I/O operations using streams offers one important benefit—no matter from where
    we are reading or where we are writing, stream behaves similarly. For example,
    whether we are reading from a keyboard or a disk we call the same readline() method.
    The implementation of the readline method is different for different devices.
    Because of stream-based I/O the programmer doesn''t have to worry about the specific
    details of the operating system and underlying devices while performing I/O as
    shown in Figure 16.2. The differences in the devices and the OS are hidden away
    from us into different stream classes in the java.io package.


    | Java Program | Stream Classes | JVM | OS | Disk |

    | Java Program | Stream Classes | JVM | OS |


    Figure 16.2


    The two fundamental operations that can be performed on a stream are Reading and
    Writing. Reading involves transfer of data from a stream into a data structure,
    such as an array of bytes. Writing consists of transfer of data from a data source
    into a stream.'
