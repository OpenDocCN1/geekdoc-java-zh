  md: '# Chapter 2: Getting Started


    Our important aspects of any language are the way it stores data, the way it operates
    upon this data, how it accomplishes input and output, and how it lets you control
    the sequence of execution of instructions in a program. We would discuss the first
    three of these building blocks in this chapter.


    # Java Data Types


    Before we write our Java program, it is important to understand how data is represented
    in Java. This is done using a data type. A data type specifies two things:


    +   (a) What value can the data type take?

    (b) What operations can be performed on the data type?


    For example, an integer data type can take values in the range -2147483648 to
    +2147483647, and operations like addition, subtraction, multiplication, division,
    etc., can be performed on it. Similarly, a boolean data type can take a true value
    or false, and permits comparison operations on it.


    Based on where a data type gets created in memory, it is called a primitive type
    (also known as a value type) or a reference type.


    Java forces primitive data types to get created only in stack and reference types
    only on heap. For example, an integer (like 2341) always gets created in stack,
    whereas a string (like "Quest") always gets created in heap. The guiding principle
    on the basis of which Java does this decision making—all data types that are small
    in size are created in stack, and all those that occupy larger chunks are created
    in heap.


    A primitive type as well as a reference type can be further categorized into pre-defined
    and user-defined categories. Here pre-defined means the data types that Java provides
    ready-made, whereas those data types which a common user like us can create. For
    example, integer is a pre-defined primitive data type, whereas Enumeration is
    a user-defined value type. Figure 2.1 shows the different categories of data types
    available in Java. Note that the pre-defined value types are often also called
    Primitives.'
