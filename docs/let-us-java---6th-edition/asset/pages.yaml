  md: "```\n```java\n}\nclass Output\n{\n    synchronized void display ( String msg\
    \ )\n    {\\n        System.out.print(\"[\" + msg );\n        try {\n        \
    \    Thread.sleep ( 1000 );\n        }\n        catch ( InterruptedException e\
    \ )\n{\n        }\n        System.out.println(\"]\" );\n    }\n}\n```\n```\n\n\
    On execution, this program produces the desired output shown below.\n\n+   [KICIT]\n\
    [NAGPUR]\n[INDIA]\n\nIn this program we have defined two classes—Ex and Output.\
    \ In main() we have created one object of Output class and three objects of Ex\
    \ class. The Ex class is derived from the Thread class. When objects of Ex class\
    \ are created, along with object of Output class, a message to be printed is passed\
    \ to its constructor. It stores this message in a private string message. This\
    \ message is passed to the display() method of Output class, when display() is\
    \ called from run().\n\nI want to note a standard technique. Here we do not explicitly\
    \ call the run() method, any objects that run() needs to be passed to the constructor\
    \ of the class which run() belongs, so run() can access them. In our case, we\
    \ needed the Output object to call display() from the run() method. That is why\
    \ we passed it to the constructor while creating the Ex objects.\n\nNote that\
    \ the display() function in the Output class has been marked as synchronized.\
    \ This ensures that once one thread makes a call to display(), unless the execution\
    \ of display() in this thread is finished, the call by other threads to display()\
    \ would be put on hold. This results in producing the systematic output that we\
    \ desire."
