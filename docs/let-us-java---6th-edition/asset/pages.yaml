  md: '# 462


    # Let Us Java


    | - or

    ^ - xor


    The usage of these bitwise operators is shown in the following code snippet:


    ```

    int ch, dh, eh, fh, a, b, c;

    ch = 32;

    dh = ~ch // toggles 0s to1s and 1s to 0

    eh = ch << 3 // shifts bits in ch 3 positions to left

    fh = ch >> 2 // >> shifts bits in ch 2 positions to right

    a = 45 & 32 // and bits of 45 and 32

    b = 45 | 32 // or bits of 45 and 32

    c = 45 ^ 32 // xor bits of 45 and 32

    ```


    Note that except ~ all other bitwise operators are binary. Remember the following
    tips while using bitwise operators:


    +   (a) Any bit value ANDed with 0 is 0.

    (b) Any bit value ORed with 1 is 1.

    (c) 1 XORed with 1 is 0.

    (d) << - As are shifted from left, zeros are pushed from right.

    (e) >> - As are shifted from right, left-most bit is copied from left.

    (f) >>> - As are shifted from right, zeros are pushed from left.


    Purpose of each bitwise operator is given below:


    +   ~ - Convert 0 to 1 and 1 to 0

    << - Shift out desired number of bits from right

    & - Check whether a bit is on / off. Put off a particular bit

    | - Put on a particular bit

    ^ - Toggle a bit


    There are a few more bitwise operators known as bitwise compound assignment operators.
    These include operators like <=, >=, &=, |= and They offer a shortcut as shown
    in the following statements:


    ```

    a <<=5 // is same as a = a << 5

    b&= 2 // is same as b = b & 2

    ```'
