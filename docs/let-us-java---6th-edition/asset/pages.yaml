  md: "# Chapter 6: Case Control Instruction\n\nIn real life, we are often faced with\
    \ situations where we are required to make a choice between a number of alternatives\
    \ rather than only one or two. For example, which school to join, or which hotel\
    \ to visit, or which movie to see, etc. Serious Java programming is same; the\
    \ choice we are asked to make is more complicated than merely selecting between\
    \ alternatives. Java provides a case control instruction that allows us to handle\
    \ such cases effectively; rather than using a series of if statements. Case control\
    \ instruction is, in fact, the topic of this chapter.\n\n# Decisions using switch\n\
    \nThe control instruction allows us to make a decision from the number of choices\
    \ is called a switch, or more correctly a switch-case-default, since these two\
    \ keywords go together to make up this control instruction. They most often appear\
    \ as follows:\n\nswitch ( expression )\n\n```\n{\n  case constant 1 :\n    do\
    \ this;\n    break;\n  case constant 2 :\n    do this;\n    break;\n  case constant\
    \ 3 :\n    do this;\n    break;\n  default:\n    do this;\n    break;\n}\n```\n\
    \nThe expression following the keyword switch is any Java expression that will\
    \ yield an integer or a character value. The keyword case is followed by an integer\
    \ or a character constant. Each constant in each case must be different from all\
    \ the others. The “do this;\" lines in the above form of switch represent any\
    \ valid statement.\"\n\nWhat happens when we run a program containing a switch?\
    \ First, the expression following the keyword switch is evaluated. The value it\
    \ gives is then matched, one-by-one, against the constant values that follow the\
    \ case statements. When a match is found, the program executes the statements\
    \ following that case until a break is encountered. On"
