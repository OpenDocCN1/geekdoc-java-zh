  md: '# Chapter 17: Multithreading


    Multithreading is the ability to perform several jobs simultaneously. Knowing
    or unknowingly we make use of multithreading frequently in everyday life. For
    example, while driving a car we carry out several activities in parallel—we listen
    to music, we follow the traffic rules, and we talk to the co-passengers. All this,
    without losing the main focus, i.e. driving. There can be several examples where
    we carry out several activities at the same time. Since programmers are people
    and programming is the art of solving people''s problems, it is only natural that
    in programming in general, and in Java in particular, too, there is an effort
    to do several activities simultaneously.


    # Multitasking and Multithreading


    Most modern OSs can execute several tasks in memory at a time. The ability to
    execute several tasks is known as Multitasking. For example, while using Windows
    we can simultaneously print a document on the printer, receive e-mails, download
    files and compile programs. All these operations are carried out through different
    programs that are being executed in memory at the same time.


    This ability of Windows to execute several tasks can be taken a step further,
    whereby we execute different parts of a program simultaneously. This can be experienced
    while working with many popular Windows software. Here are a few examples...


    +   (a) While copying files part of the ''Copy'' program displays the copying
    progress through a green-colored progress bar, whereas, another part of the program
    carries out the actual copying.


    +   (b) While working with MS-Word one part of the program lets us type the document,
    whereas two other parts perform the spelling check and grammar check.


    +   (c) In anti-viral software one part of the program scans the disk files for
    viruses, whereas other parts lets us interact with the user interface of the software.


    This ability to execute different parts of the same program simultaneously is
    known as Multithreading.


    If a multithreaded program is executing on a machine with a single microprocessor,
    though it may appear that several tasks are being performed by the processor simultaneously,
    in actuality it is not so. What happens is that the processor divides the execution
    time equally amongst all the running threads. Thus each thread gets the processor'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 330


    attention in a round robin manner. Once the time-slice allocated for a thread
    expires, the operation that it is currently being performed is put on hold and
    the processor now directs its attention to the next thread. Thus, at any given
    moment, if we take the snapshot of memory, only one thread is being executed by
    the processor. The switching of attention from one thread to another happens so
    fast that we get the effect as if the processor is executing several threads simultaneously.


    In modern machines with multiple processors, the threads would actually be executed
    simultaneously, as each processor can execute a separate thread.


    Multithreading has several advantages to offer. These are listed below.


    +   (a) Responsiveness: Take MS-Word example again. Had the spell checker and
    the grammar checker not run as different threads, we would have been required
    to write documents and submit it to the checkers from time to time. This would
    have resulted in low responsiveness. Since the checkers run in different threads,
    our document gets checked as we type, thereby increasing the responsiveness of
    the application.


    +   (b) Organization: Threading simplifies program organization. In the ''File
    Copy'' example if both the operations—displaying the progress bar and the actual
    copying—run in the same thread, then after copying a few thousand bytes would
    be required to advance the progress. If we run the copying code and the progress
    bar in separate threads, we can avoid cluttering the copying with progress bar
    code and vice versa.


    +   (c) Performance: Many times it happens that a program needs to wait for user
    input or give some output. The I/O devices are generally slower than the processor.
    So the application waits for the I/O operation to finish. Instead, if we use another
    thread for the I/O operation, the processor time can be allotted to other important
    tasks that can work independent of the I/O operation, thereby improving the performance.


    # Multithreading in Java


    To help you appreciate the challenges of multithreading you can try a simple experiment.
    Make two phone calls to your friends and try to carry out conversation with both
    of them concurrently. This would involve major challenges—talking to one friend,
    putting him on hold, remembering where you left off, picking up the other receiver,
    talking to'
