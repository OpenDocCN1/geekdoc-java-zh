    Providing such empty-bodied function becomes tedious when the interface has a
    large number of functions. To avoid this unnecessary work Java provides Adapter
    Classes, one per interface. Thus, for MouseListener interface there would be an
    equivalent class known as MouseAdapter. This class would contain five empty-bodied
    functions. Now that all we need to do is, inherit our class from this adapter
    class and override only the mouseClicked( ) function. Smart work, you would agree!


