    Unicode representation. This is shown below.


    ```

    char ch = ''X''; // character literal

    char dh = ''\u0058''; // Unicode

    ```


    Unicode representation can take a minimum value of ''\u0000'' (or decimal 0) and
    a maximum value of ''\ffff'' (or decimal 65535).


