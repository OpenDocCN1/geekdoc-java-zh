  md: '# Chapter 22: Network & Internet Programming


    All successful people are usually well connected. It has become an important ingredient
    for the ''success'' formula. Computing has taken this connectedness to the next
    logical step. ''Every device and person would ultimately get connected to every
    other device and person''-that is where Network Programming is heading for. Hence
    learning network programming has become more relevant today than ever before.


    We often need our application to write some data into a file stored on a remote
    machine connected through the network, or exchange messages across the machines
    connected to the network. Using the Java networking API it has become as simple
    to carry out such jobs.


    # Network Concepts


    It is important to understand several concepts and terms before we can actually
    start writing networking programs. Let us begin with a typical computer network.
    Figure 22.1 shows a typical computer network.


    We can make the following observations from Figure 22.1.


    +   (a) PCs, Laptops, Mobile phones are client machines (also known as nodes/hosts).
    They are connected to Hub/Switch through network cables or wirelessly.


    +   (b) Database Server, File Server, Print Server, Web Server, Application Servers
    are also connected to Hub/Switch.


    +   (c) Clients and Servers form the Local Area Network (LAN). All clients can
    get services from the servers.


    +   (d) Gateway machine is connected to Hub/Switch and to Router. The router would
    be connected to other routers of other LANs or to Internet. The routers route
    the data from one machine to another along the least congested path.


    +   (e) Gateway machine is so called clients and servers in the LAN can communicate
    with devices in other LANs or Internet through it.


    +   (f) A Hub sends the incoming data packet to every node connected to it. As
    against this, a Switch sends the incoming data packet only to specified node.


    +   (g) Access Point lets wireless devices to connect to LAN.


    +   (h) Since all devices in Figure 22.1 are connected to a centralized Hub/Switch
    the arrangement is known as Star topology. There are'
  merge: -1
