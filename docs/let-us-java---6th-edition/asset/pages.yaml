    # Database Operations through Java


    The operations mentioned in the previous section were performed using SQL. Let
    us now see how these operations can be carried through Java. Creation, Modification
    and Deletion of a table are infrequent operations. By this what I mean is Customers
    or Students table is not going to get created, altered or deleted every other
    day. In once you have set up all fields in a table to your satisfaction, you would
    rarely change it. More common operations would be the CRUD operations.


    Hence the operation of creation of tables is done manually using the tools that
    come with each RDBMS. For example, in this chapter we propose to use MySQL RDBMS
    and perform these operations using the MySQL Workbench that comes with MySQL.


    The CRUD operations can be performed using the JDBC objects **Connection**, **Statement**
    and **ResultSet**. The purpose of each of these objects is mentioned below.


    +   (a) Connection – To establish connection with database

    (b) Statement – To execute SQL statements

    (c) ResultSet – To process results of a SQL query


