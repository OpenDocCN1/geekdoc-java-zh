  md: '# Chapter 6: Case Control Instruction


    # The Tips and the Traps


    Let us now down a few useful tips about the usage of switch and a few pitfalls
    that should be avoided.


    +   (a) Cases in a switch can be written in any order.


    +   (b) Even if there are multiple statements to be executed in each case, there
    is no need to enclose them within a pair of braces.


    +   (c) Every statement in a switch must belong to some case or the other. If
    a statement doesn''t belong to any case, the compiler would report an error.


    +   (d) If we have no default case and no other case is satisfied, then the program
    simply falls through the entire switch and continues with the next instruction
    (if any,)) that follows the closing brace of switch.


    +   (e) switch cannot have a case looks like:


    ```

    case i <= 20 :

    ```


    All that can have after the case is a byte, short, int, char or string constant
    or an expression that evaluates to one of these constants. Even a float, double,
    long or boolean is not allowed.


    +   (f) From JDK 7 onwards switch can also be checked using switch.


    +   (g) The advantage of switch over if is that it leads to a more structured
    program and the level of indentation is manageable, more so, if there are multiple
    statements within each case of a switch.


    +   (h) We can check the value of any expression in a switch. Thus, the following
    switch statements are:


    ```

    switch (i + j * k)

    switch (23 + 45 % 4 * k)

    ```


    +   (i) Expressions can also be used in cases provided they are constant expressions.
    Thus case 3 + 7 is correct, however, case a + b is incorrect.


    +   (j) The break statement when used in a switch takes the control outside the
    switch. However, use of continue will not take the control to the beginning of
    switch as one is likely to believe. This is because switch is not a looping statement,
    unlike while, for do-while.'
