    (d) They are accessed from same package''s sub-class

    (e) They are accessed from different package''s sub-class


    Keep the following guidelines in mind while deciding whether they would accessible
    or not.


    +   (a) private members are accessible within the class.

    (b) default members are accessible within the package.

    (c) protected members are accessible within package and in sub-classes.

    (d) public members are accessible anywhere.

    (e) Within a package behavior of default, protected and public are same.

    (f) Default members are not accessible across package boundary.

    (g) Protected members can be accessed outside the package only through child class
    object.


    These guidelines have been captured in Figure 23.1.


    | Access Specifier (class A) | Package pkg1 class A | Package pkg1 class B | Package
    pkg1 class D extends A | Package pkg2 class C | Package pkg2 class E extends A
    |

    |---|---|---|---|---|---||

    | public | Yes | Yes | Yes | Yes | Yes |

    | protected | Yes | Yes | Yes | No | Yes |

    | default | Yes | Yes | Yes | No | No |

    | private | Yes | No | No | No | No |


