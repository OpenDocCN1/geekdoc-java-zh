  md: '# Chapter 9: Introduction to OOP


    # Polymorphism


    Extending the same example of the Publication, Periodical and Book, let us now
    understand another important concept. Our base class, Publication, defines methods
    for storing and retrieving data. A periodical may be stored in a binder, while
    a book is usually placed on a shelf. Furthermore, the retrieval method to find
    a specific periodical is different from finding a book. Periodicals are located
    through a guide to periodical literature, while books are found using a card catalog
    system. Based on this we can design a ‘find’ through periodical literature’ function
    for a periodical and a ‘find’ through card catalog’ function for a book.


    OOP provides an elegant facility polymorphism to handle such situations. In our
    example, the retrieval method for a periodical is different from the retrieval
    method for a book, even though the end result is same. Polymorphism permits us
    to define a function for work for both periodicals and books. When a periodical
    is retrieved, the retrieve function that is specific to a periodical is used,
    but when a book is retrieved, the retrieve function associated with a book is
    used. The end is that a single function name can be used for the same operation
    performed on related classes even if the implementation of that function varies
    from class to class. This concept of polymorphism (one thing with several distinct
    forms) can be extended to operators, as we would see in later chapters.


    # Containership


    In a typical super-market, each item on sale can be represented using a class.
    These items in turn belong to different categories like cosmetics, cold-drink,
    clothes, books, electronics, etc. Such relationships can be represented using
    containership. For example objects like coldcream, face-wash, shampoo are contained
    inside a category object called cosmetics. You will be able to observe this containership
    relationship in real-world problems.


    # Reusability


    Object-oriented programs are built from reusable software components. Once a class
    is completed and tested, it can be distributed to other programmers for use in
    their own programs. This is called reusability. If those programmers want to add
    new features or change the existing'
