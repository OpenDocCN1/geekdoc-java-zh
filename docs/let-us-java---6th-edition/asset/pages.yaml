    # File Encryption/Decryption


    Security has paramount importance in the digital world. Often we wish to secure
    our data from others. There are various techniques through which this can be done.
    One of the most common techniques is to encrypt the data in a fashion that even
    if the encrypted data falls into other people'' hands they are unable to obtain
    the original data from it. At the same time we should be able to get back the
    original data by decrypting the encrypted data. Many Encryption/Decryption schemes
    are popularly used today to secure the data from misuse. Our intention here is
    not to discuss these schemes. Instead, we wish to evolve a very simple encryption/decryption
    scheme. In this scheme encryption we would replace every lowercase alphabet in
    the source stream with another predetermined lowercase character. In decryption
    we would do the reverse. This type of encryption/decryption scheme is often called
    a Substitution Cipher. Given below is the program which implements the Substitution
    Cipher.'
