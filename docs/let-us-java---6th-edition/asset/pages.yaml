  md: "# Chapter 11: Arrays\n\nThe Java language provides a capability that enables\
    \ the user to design a set of similar data types, called array. This chapter describes\
    \ how arrays can be created and manipulated in Java. We would also discuss how\
    \ and why arrays are implemented as objects.\n\n# What are Arrays\n\nSuppose we\
    \ wish to arrange the percentage marks obtained by 50 students in ascending order.\
    \ To do this we must first be able to hold 50 students in memory. In such a case,\
    \ we have two options to store these marks in memory:\n\n+   (a) Construct 50\
    \ variables, each containing one student's marks.\n(b) Construct one variable\
    \ capable of storing all 50 values.\n\nObviously, the second alternative is better,\
    \ as it would be much easier to handle one variable than handling 50 variables.\
    \ Such a variable capable of storing multiple values is called an array.\n\nAn\
    \ array is a collection of similar elements—all ints, or all floats, or all chars,\
    \ etc. Usually, the array of characters is called a 'string', whereas an array\
    \ of ints or floats is simply an array. Remember that we cannot have an array\
    \ of 10 numbers, of which are 5 ints and 5 are floats.\n\n# A Simple Program using\
    \ Array\n\nLet us try to write a program to find average marks obtained by a class\
    \ of 30 students in a test. Here is the program...\n\n```\n// First array program\n\
    package firstarrayprogramproject;\nimport java.util.*;\n\npublic class FirstArrayProgramProject\
    \ {\n    public static void main ( String[ ] args ) {\n        int i, avg, sum\
