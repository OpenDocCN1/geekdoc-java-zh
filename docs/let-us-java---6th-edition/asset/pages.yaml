  md: '# Chapter 3: Java Data Types and Instructions 35


    n the last chapter we wrote programs with bare minimum knowledge of data types
    and instructions. As a result, the programs worked only for specific data. If
    they are to work with other data it would necessitate changes in the program,
    which is not a good id. In this chapter we propose to rectify this situation.
    For that, we have to have more in-depth knowledge of data types and instructions.
    There is a lot of ground to cover. Let us begin with the data types.


    # Data Types Revisited


    So far we have used only an int to deal with integer values and float to deal
    with real values. However, Java provides many flavors of integers and reals. Let
    us begin with integers.


    # Integer Types


    Java provides 4 types of integers—byte, short, int and long of sizes 1 byte, 2,
    4 bytes and 8 bytes respectively. Figure 3.1 shows different types of integers
    available in Java along with their sizes and ranges.


    | Data Type | Range | Bytes | Default Value |

    |---|---|---||

    | byte | -128 to +127 | 1 | 0 |

    | short | -32768 to +32767 | 2 | 0 |

    | int | -2147483648 to +2147483647 | 4 | 0 |

    | long | -9223372036854775808 to +9223372036854775807 | 8 | 0 |


    Figure 3.1


    Let us now discuss some finer points associated with integer types.


    +   (a) By default, without a decimal point is treated as an int. During assignment,
    if the value being assigned exceeds the range of the variable, an error occurs.
    This is shown below.


    ```

    byte a = 300; // error

    short b = 40000; // error

    int c = 2200000000; // error

    ```


    +   (b) If we wish to treat an integer as a long integer, we have to add a suffix
    L or I at its end, as in


    ```

    long int a = 3651 * 1000;

    ```'
