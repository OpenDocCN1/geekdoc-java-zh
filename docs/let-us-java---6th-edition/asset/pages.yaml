    # Exception Handling in Java


    Java provides a systematic, object-oriented approach to handling runtime errors.
    The exception mechanism of Java uses three keywords—**throw, catch,** and **try**.
    Let us understand their purpose.


    During the course of execution of a member function of a class an error occurs,
    Java runtime informs the application that an error has occurred. This process
    of informing is called **throwing** an exception. This involves two steps:


    +   (a) Creating an object called exception and storing information about the
    exceptional condition in it.


    +   (b) Throwing the exception object using the keyword **throw**.


    Java runtime creates the exception object from ready-made exception classes provided
    in the Java Library. Each exception class represents a different exception situation.
    For there is an exception class that represents a divide by zero situation, another
    which represents inability to open file, etc. All these classes are derived from
    a base class called *Exception*, which in turn is derived from the **Object**
    class.


    If we anticipate an exception situation other than the ones represented through
    these exception classes, then we can define our own exception class, create an
    object from this class and then throw that object to report the error situation.
    To begin with, we concentrate on'
