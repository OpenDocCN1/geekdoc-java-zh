  md: 'Despite its long run as stable profession, distilling has changed much over
    the centuries. The core product is still the same, but equipment and distribution
    have seen significant changes, and the whole enterprise is highly-regulated by
    federal, state, and local agencies. Cococting a homemade brew to share among friends
    is one thing; earning a living from the manufacture of alcohol is entirely different.


    Mass production has made its mark on this industry: breaking even generally requires
    large-scale manufacture and distribution. Tastes are changing in beverages as
    they are in food. Consumers are beginning to favor small-scale breweries and locally-run
    wineries over national brands. Craft beers are hugely popular, and smaller, local
    breweries known as microbreweries have driven rapid growth in the alcohol industry.
    "The number of breweries in the United States increased more than threefold from
    2010 to 2016," and now account for 25 percent of employment in the entire industry.157


    # Resiliency: 77 percent


    In almost every city in America one can find a microbrewery, and often several.
    A brewer’s customers need not be widespread, unless he is working exclusively
    through distributors instead of selling locally. Even then, regional sales can
    usually sustain locally-made beverages.


    Liquor sales are generally resilient, in good times and bad. However, if the model
    of distribution is through restaurants and microbreweries, sales will follow dining
    trends and be severely impacted during recessions. The supply chain need not be
    extensive after initial purchase of equipment. Locally-sourced ingredients are
    possible and often preferable when it comes to craft beers. For the wineries,
    the operation from vine to bottle can be accomplished onsite. Having been said,
    alcohol ingredients are commodities that are subject to the same shortages and
    weather disruptions that threaten other food. “The availability and cost of raw
