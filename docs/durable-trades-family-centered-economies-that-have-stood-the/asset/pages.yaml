    > —ANIEL 1:20 (600 BC)


    THE COUNSELOR has maxed and waned through history but has generally enjoyed steady
    employment. As early as societies had leaders, they had advisors to counsel them.
    Joseph was a counselor to Pharaoh. King David’s counselor was Ahithophel (who
    later betrayed him).¹⁹⁸ Daniel was an advisor to Nebuchadnezzar, Darius and Cyrus.
    In smaller populations and agrarian societies, counselors were more informal and
    rare. Miles Standish served as an advisor to William Bradford, governor of the
    Plymouth Colony after the Mayflower passengers disembarked. But advisor was only
    one of many Standish wore as military commander and leader treasurer of the Colony.
    As populations grew in the New World, colonies formed and officially-recognized
    advisors began serving full-time in government as councilors and diplomats.


    The advice industry today is broad and varied. It can be summed as providing strategic
    counsel to decision-makers. There were no business coaches or certified financial
    planners in colonial times, but the consulting trade existed nonetheless. The
    advice-giving industry as we know it today appeared mostly in the latter half
    of the twentieth century, as small businesses grew into massive corporations,
    and management theory began to emerge as a way to cope with increasing organizational
    complexity.'
  merge: -1
