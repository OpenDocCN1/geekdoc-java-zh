  md: '# Foreword


    FEW BOOKS ARE ACTALLY groundbreaking in concept and execution. Fewer still—no
    more than a handful each year—accomplish this in more than one way. Durable Trades:
    Family-Centered Economies That Have Stood the Test of Time, Rory Groves, is one
    of those few very.


    There are recent volumes by the thousands that claim to be career guides. There
    are thousands more in the related realm of “how to choose a College.” None of
    these, however, have asked the questions in Durable Trades: What jobs or trades
    have survived the tumultuous upheavals—what Joseph Schumpeter has called “the
    creative destruction”—of industrial capitalism over the course of 250 years? What
    means of earning a living actually reinforce, rather than undermine, family bonds
    and a vital home economy? In this careful and most readable book, Mr. Groves provides
    rich and compelling answers.


    Where almost every other “career book” buys into the argument that workers need
    to completely reinvent five to seven years just to keep a job, this author proves
    that there are rich and rewarding forms of labor with astonishing records of durability.
    Where the prophets of Artificial Intelligence and robotics claim that these forms
    of smart automation will displace almost all forms of human labor, Mr. Groves
    offers an alternate vision forward: there are human-tasks plenty where the robots
    and soft computers will find few opportunities . . where they cannot compete.


    On the superficial level, the author—himself a computer programmer—does the outrageous
    claim: “Forget computer engineering . . become a shepherd!” And yet, this book
    is full of wisdom about the nature of human work and, deedly, about the nature
    of human beings. Above all, Mr. Groves recovers a profound truth: a job is not
    an end in itself; it is rather one means—and only one means—toward building a
    rich and satisfying life, toward human flourishing.


    Mr. Groves is particularly adept at reconnecting work and homelike. The most fundamental
    change wrought by the industrial revolution was the manner in which it wrenched
    apart one’s place of work from one’s place of'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'residence. Woman, man, and even child (in the early years) were pulled out
    of their artisan shops and off their farms into separate factories to serve the
    machines. In this volume, the author offers sound and practical ways to heal this
    breach . . . and the result is revolutionary (or perhaps counter-revolutionary)
    in its own right.


    A second original aspect of Durable Trades comes from its opening discussion of
    the historical developments that led modern societies to the point of apparent
    human obsolescence. He draws on the insights of some well-known analysts—ranging
    from Joseph Tainter in The Collapse of Complex Societies to Rod Dreher in The
    Benedict Option—to clarify our current predicament. Along the way, though, he
    provides important insights of his own. As a sampling:


    +   “But material abundance, along with its sister decadence, is a lagging indicator.
    The institutions and social contracts that have supported our way of life for
    centuries—marriage, family, faith, community and morality—have utterly decimated";


    +   “The biblical idea of work as worship had to be undone before people were
    ready to submit to the idea of leisure, comfort, and wealth as acceptable pursuits
    in and of themselves";


    +   “It was the collapse of cultural boundaries combined with the ascendancy of
    humanist thought about the nature of work that unleashed the amoral, and immoral,
    use of technology.”


    Most strikingly, Mr. Groves’ historical discussion of job specialization in industrial
    society led us to an astonishing realization . . . by me, at least. In 1800, the
    number of distinct “occupations” found in the United States was 70; in the year
    2000, 30,959. All of the increase came as human beings adjusted their labor to
    accommodate the new machines, to enable the mechanical devices to become ever
    better, to help them in a way to “evolve.” In our time, all of these new jobs—all—are
    the very ones threatened by the culminating triumph of the machines, in artificial
    intelligence and robotics. The human enablers, it seems, are becoming less important
    . . . and may soon be needed at all.


    All of which underscores this book’s focus on durable trades. These are the forms
    of work that are truly human and so resistant, at least, to the'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'victious march of the machines. These are the ways in which the unsettling
    disruptions of the Industrial Revolution can be deflected or overcome and through
    which vital, function-rich home economies can be built again as the essential
    material foundation for strong and child-rich families.


    Finally, and perhaps most importantly, Durable Trades is a powerful Christian
    meditation. Mr. Groves uses Scruptural passages throughout the volume to remind
    readers of the profound importance given to human labor by the Hebrew prophets,
    Jesus of Nazareth, and by His apostles. In doing so, he contributes in an important
    way to the resanctification of work ... an absolutely necessary task in the building
    again of a Christian culture.


    Allan C. Carlson, Swallow Farm Winnebaggo County, Illinois

    March 22, 2019


