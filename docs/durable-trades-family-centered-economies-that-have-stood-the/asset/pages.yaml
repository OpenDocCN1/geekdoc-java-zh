  md: '# 4


    # # A Resilient Future


    Unless the LORD builds the house, the builders labor in vain.


    > —PSAL 127:1 (NIV)


    WHEN we FIRST BEGAN to consider a move to the country, we wondered what it might
    be like to live off the land as our great-grandparents did. We looked forward
    to the day when we could grow enough food to last the winter. That day hasn''t
    come yet. But over the last several years we''ve made gradual progress—we have
    animals, gardens, tractors and a barn. However, I can assuredly say that at present
    we would not survive the winter without grocery stores.


    What we have learned is that building a new family economy takes time. Lots of
    time. But the journey of a thousand miles begins with a single step. While I can''t
    tell you how to arrive at a durable future, I can tell you where to begin.


    # # A Firm Foundation


    The first step is faith. Without faith, there is no hope for a resilient future.
    Jesus said, “Everyone who hears these words of mine and does them will be like
    a wise man who built his house on the rock. And the rain fell, and the floods
    came, and the winds blew and beat on that house, but it did not fall, because
    it had founded on the rock.”³316


    Faith is not wishful thinking lacking in any real substance. *Faith* is real substance.
    Attempting anything of true significance begins in faith. Faith is the inward
    belief that manifests the outward reality: “By faith we understand that the universe
    was created by the word of God, so that what is seen was not made out of things
    that are visible.”³317'
  merge: -1
