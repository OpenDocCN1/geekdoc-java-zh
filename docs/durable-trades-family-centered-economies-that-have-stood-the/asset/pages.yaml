    Through the years, a painter''s clientele has also remained steady. The vast majority
    of residential painting contractors are working directly with homeowners, just
    as they did centuries ago.


    # Resiliency: 71 percent


    Painting closely follows the construction industry. When construction is expanding,
    so is demand for painters. But painters and wall-covering specialists stay in
    demand long after the structures have been built and the carpenters have gone
    home. Depending on region and sun exposure, a wood or stucco home needs to be
    painted five to fifteen years. Vinyl siding lasts much longer but still requires
    maintenance and repair. So painting follows the construction industry, the ongoing
    repeat-demand for painters creates a durability that far lasts the initial construction
    phase and can help a tradesman weather the down cycles.


    In addition, demand for painting is local. Even the smallest towns with a few
    hundred homes require assistance from professional painters. Only in areas where
    there are no dwellings will demand for painters disappear.


    A painter''s primary supply-chain vulnerability is in the wall covering components
    themselves. As the ingredients in paints and other materials become more sophisticated,
    the supply chain becomes more vulnerable to disruption. Paint manufacturers are
    widespread in many countries, vinyl and steel siding manufacturers less so.


    Finally, the customized nature of painting and wall coverings resists machine
    automation, which generally targets repetitive jobs. Painters need to work closely
    with the homeowner to determine goals and utilize a wide variety of techniques
    to paint each structure competently with its specific requirements. In painting,
    every job is one-of-kind.


