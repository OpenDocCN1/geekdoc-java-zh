    trade? How fierce is the competition? How heavily regulated is the industry? What
    are the near-term projections of growth? And how much formal education is required
    to work in the field?


    As a general rule, multi-generational durability tends to favor professions that
    can be passed down through apprenticeships rather than through protracted accreditation
    programs. But this is not mandatory. Many generations of lawyers and physicians
    began their education under their parents and finished with obtaining the necessary
    credentials. The general rule, however, is this: the fewer obstacles, the better.


