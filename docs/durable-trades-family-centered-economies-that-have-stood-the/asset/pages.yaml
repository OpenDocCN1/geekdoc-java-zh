    # Defining Durable


    The butcher, baker, and candlestick maker have been around a lot longer than supermarkets
    and Walmart.

    —JOEL SALATIN


    WHAT SHOULD OUR RESPONSE be to brittle systems and future (and present) challenges?
    How do families build their houses on the rock in a time of shifting sands? What
    will last and what will crumble under its own weight?


    These are the very questions I originally set out to answer—for my family first,
    and then for the benefit of others who “see danger coming and (want to) take refuge.
    The process has been illuminating, both in identifying the causes of decline in
    historical family-based businesses and in discovering why some family-centered
    economies have stood the test of time.


    In short, there are no easy answers. But there are lessons from the past. We are
    not the first society to face these problems, and we will not be the last. In
    the pages that follow, I present my solutions to the brittle systems outlined
    above: Durable Trades. My hope is that this research will in some way contribute
    to the stability and prosperity of other families in the years to come.


    # What is Durable?


    Defining “durable” has not been easy. I wanted to know which types of businesses
    have been the least affected by external factors throughout history, place, governments,
    economic cycles, invention, and social upheaval. Which trades have endured for
    centuries and still exist today? Which trades are the most family-centric? And,
    of course, which trades do all this and still provide a living? Conversely, which
    trades are overly'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'dependent on brittle systems and are therefore not likely to withstand economic,
    societal, or technological upheaval?


    The scope of this study is limited to the minimum range of time and place that
    could answer these questions and still bear relevance to us today, and therefore
    it centers on trades that existed the earliest periods of American history—prior
    to the Industrial Revolution (c. 1790)—and are still thriving today. Trades during
    this 230-year period have survived revolution, civil war, world wars, transitional
    governments, currency devaluation and hyperinflation, recessions, depression,
    industrial revolutions, and machine automation. Sources include period literature,
    statistical abstracts, historical works, and personal interviews. In some cases,
    I even went to work to test my assumptions—I spent three months working at a meat
    locker to learn more about butchering.


    # A Few Caveats


    With any such project there are obvious limitations. First, many viable trades
    were merely domestic functions in colonial America. For example, ‘Veterinarian’
    did not become a dedicated profession in the U.S. until after 1850. Prior to that,
    all shepherds handled their own animals’ healthcare. Second, some trades have
    the potential of being very durable but do not have a long enough history to make
    this list—plumber and electrician to mind (indoor plumbing did not come into usage
    until the mid-nineteenth century, and electricity until the early-twentieth century).
    To be included, professions must have been in existence by America’s founding.
    Third, new professions are being classified all the time: biomedical engineer,
    solar photovoltaic installer, search engine optimizer. Some of these may endure.
    Most not. The Industrial Revolution spawned an abundance of specialty trades that
    at the time seemed durable, only to disappear from history so short time later.


    In truth the Industrial Revolution never ended. It is still ongoing today, and
    significant marketplace distortions exist because of it. In periods of low growth—considered
    normal throughout history—many modern industries would simply cease to exist.
    Take sports medicine, for example. Today represents a rapidly growing $23-billion
    industry, part of the $46-billion professional sports industry—itself part of
    the much larger $270-billion'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'entertainment industry.¹¹⁰⁹ But professional sports as we know it only recently
    came into existence, following the Civil War. Prior to that, one would have to
    go all the way back to the fourth century AD to find professional athletes—a 1,500
    year gap. What will happen to supporting industries like sports medicine during
    periods of severe economic contraction? While it is impossible to predict exactly
    what the future holds, considering the long view of history helps to identify
    these industries and occupations that have more lasting power than others.


    Finally, research revealed that the most successful families over history involved
    a mix of trades rather than just one. The village blacksmith also farmed his own
    land. Our first president was also a distinguished orchestrand. Ben Franklin was
    a courier, author, publisher, salesman, and inventor. So it will be today. Successful,
    enduring families will most likely need to be diversified and cross a range of
    trades.


    # Scoring Trades


    After examining hundreds of occupations spanning the past four centuries, I developed
    a scoring system to rank trades according to their merits. All trades covered
    in this book made the list because they are durable. Regardless of how they rank
    against each other, every trade has survived for at least 230 years, and in most
    cases several thousand years. But the goal of this research was to determine the
    most durable, most family-centered economies.


    In all, five categories and 20 sub-categories were determined and used to score
    each trade objectively, with weighted averages to favor certain aspects.¹¹⁰ They
    are as follows:


    +   1. Historical Stability (20 percent of total score). How much have the core
    products, methods, tools, and clientele changed since the trade was practiced
    two hundred years ago?


    +   2. Resiliency (15 percent). How vulnerable is the trade to short-term disruptions
    in supply or demand? How long is the supply chain and how sustainable are the
    inputs? Finally, how resistant is the trade to technological automation?'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Jobs that depend on high-tech materials manufactured in countries on the other
    side of the world are heavily impacted by disruptions to the global supply chain.
    On the other hand, trades that rely on locally-sourced raw materials, on human
    or animal power, or organically grown products are less likely to be disrupted
    by international disturbances.


    3. Family-centeredness (35 percent). How much time is spent together for family
    members working in this trade? Are roles for children and the elderly? Husband
    and wife? Can the trade be practised from home or off-site? And, finally, does
    the business generate tangible assets that can be passed down through generations?


    4. Income (20 percent). Does the trade provide enough income to support a family?
    It should be noted that more is not necessarily better here. The most durable
    trades—those that experience the least amount of turnover and best withstand economic
    cycles—are those producing close to the median wage. On the other hand, highly
    specialized trades that generate high incomes—are more likely to experience upheaval
    during economic turbulence and/or become targets for automation. It should also
    be noted that some trades, such as farming, offset lower incomes by producing
    at home what currently requires purchasing outside the home.


    Income has been scored according to the Federal Poverty Guidelines (FPG), a standardized
    cost-of-living reference. In 2019, a family of six with an annual income of $34,590
    would be at 100 percent of the Federal Poverty Guidelines, sometimes referred
    to as “the poverty line.” Median household income in the U.S. is just under $60,000,
    or about 175 percent of FPG for a family of six.\¹¹⁰


