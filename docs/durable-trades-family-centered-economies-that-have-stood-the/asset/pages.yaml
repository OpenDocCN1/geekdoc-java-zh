    # The Vital Lie


    A LOCAL CARPENTER ONCE shared a story with me about a conversation

    between his son and a high school guidance counselor. His son had been

    evaluating various colleges and their tuition costs when the counselor told

    him would be eligible for a lot of scholarships and financial aid because

    “your parents don''t make a lot of money.” The counselor had no particular

    knowledge of the family’s financial situation, other than knowing the father

    was a self-employed carpenter and his mother worked in landscaping.


    On another occasion I mentioned to a friend how a college degree didn’t

    seem like a cost-effective solution for everyone when accounting for the

    high amount of debt so many students incur and the years (or decades) it

    takes them to pay it back. The friend, oldest son had just enrolled in

    college, took offense at my line of questioning and responded, “I don’t want

    my son to make eight bucks an hour as a plumber.”


    Now, if anyone knows where I can hire a plumber for $8 per hour, I

    would be very interested in a referral. But the bigger issue underlying these

    conversations are, the prejudice against trades and the people who work in

    them. Trades, as the thinking goes, are only for those too poor, ignorant, or

    lazy to earn a college degree. Only white-collar professionals make real

    money.


    But none of these perceptions have proven true in my experience. I have

    never worked so hard as when I worked for tradesmen. I am continually

    amazed at the high rates people pay for competent carpenters, painters,

    and, yes, plumbers—rates of pay exceeding anything I have earned as a

    software engineer. And if you want to see ignorance, try teaching a

    computer programmer how to replace the sickle bar on a John Deere 37

    mower.


    Certainly, poor, ignorant, lazy people do work in the trades. But they

    are just as common in the cubicles and corner-offices of corporate America.

    The issue is not the work itself but perceptions about the people who'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'perform such work. Entering numbers on a spreadsheet does not take much more
    thought than swinging a hammer—although a lapse in focus in the latter bears more
    immediate consequences to your digits.


    If the perceptions are false, why do they persist? This phenomenon can be best
    explained by what Norwegian playwright Henrik Ibsen referred to as “the vital
    lie.\ In society there are certain truths that are too painful to accept. It is
    more comfortable in these situations to embrace a lie rather than confront the
    truth. To the professional counselor earning $50,000 per year, or the recent college
    graduate $100,000 in debt, it can be difficult to accept the idea of an unschooled,
    blue-collar laborer earning double, or triple, his white-collar salary.


    # The Millionaire Next Door


    The carpenter’s son, in fact, did not qualify for any financial aid; his parents
    make too much money. Between the construction and landscaping businesses, his
    mom and dad gross approximately $500,000 annually. By age forty, his parents paid
    off their mortgage and now live debt-free with assets of just under $1 million.


    Plasterers in our county charge $150 per hour to perform work that no one knows
    how to do. And plumbers, electricians, and machinists are not far behind. The
    painter I interviewed for this book left his corporate job to start a painting
    business because he found the cubicle life unfilling. He earns more as a painter
    than he did as a corporate executive. His schedule is more flexible too, allowing
    him to spend more time with his wife and daughters, who are also getting involved
    in the business.


