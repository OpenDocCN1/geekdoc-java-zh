    depositions, and writing—lots of writing. With litigation “every step has to be
    performed with the court appearance in mind,” says Jim.


    Transactional attorneys, on the other hand, primarily work with contracts. This
    may include real estate, wills, business contracts and tax advice. But anything
    that starts out as transactional work can also end up in court. “Drafting a will
    for Dad is transactional,” Jim says. But after Dad dies, that may end up in litigation.'
