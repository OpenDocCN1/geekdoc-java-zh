    nation called the United States of America, and the emergence of a new order of
    manufacture in the Western world that came to be known as the Industrial Revolution.
    Historians have called the Industrial Revolution “the most important event in
    the history of humanity since the domestication of animals and plants, perhaps
    the most important since the invention of language.”^72 Of its significance and
    full extent of impact to world events, one could rightly conclude: it is too soon
    to say.


