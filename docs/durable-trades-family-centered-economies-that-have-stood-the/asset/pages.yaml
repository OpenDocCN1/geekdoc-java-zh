    # Success Factors


    The difficulty with ranking trades is that there is such a wide range of business
    approaches within each trade. Even if a particular trade is highly resilient,
    there is no guarantee of success. There are, however, several factors that emerge.
    These factors, taken together, offer the best opportunity of achieving success,
    regardless of which trade a family chooses to undertake:


    +   Have a passion for the work. Successful owners are passionate about what they
    do. There is an inner drive that propels them forward, which is essential during
    the demanding startup phase and inevitable rough'
