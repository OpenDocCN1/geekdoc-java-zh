    +   3. **Work toward ownership.** Individuals or families who own the businesses
    in which they work are able to command higher incomes than when utilizing the
    same skillset as wage-earning employees. Over and over the data show historical
    processes becoming sub subdivided, standardized, and commoditized over time, leading
    to low-wage employees who cannot support a family, or the trade becoming obsolete
    through automation. More often, family-owned-and-operated businesses have been
    able to resist these pressures and remain viable.


    +   4. **Avoid debt.** Successful owners do not accumulate debt. They vigorously
    avoid it. They do not buy shiny trucks or expensive equipment on credit. They
    do not go back to school to get a second degree. Instead they take drastic measures
    to get out of debt—such as selling their houses and moving into smaller ones—because
    they know that unaccountable debt will kill their businesses faster than anything
    else.


