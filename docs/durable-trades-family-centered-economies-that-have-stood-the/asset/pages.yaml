  md: '[Prior to the Industrial Revolution] the factory system had not yet displaced
    the domestic or individual system of labor. Nothing was known of the development
    of special skill by the subdivision of labor and the confinement of each workman
    to one particular step in a series of progressive operations, expedient by which
    the productive capacity of the modern operative has been brought to the maximum
    and the time required to complete the product reduced to the minimum.^313


    The experients gained came at the price of relationships lost: factory production
    meant the apprenticeship model, the method by which generational skill had been
    passed on for thousands of years. Families that divided into factories no longer
    educated, mentored, and disciplined their children at home. Dependency on the
    family and community was replaced with dependency on the employer. Work became
    an end unto itself rather than an opportunity for mentorship.


    But is it at work that true discipleship takes place, more than so at church or
    in the classroom. Work is where the real person resides. The true nature of a
    man is revealed when he is swinging a hammer, falling a tree, or negotiating a
    contract. For good or ill, we speak loudest to around us when we are at work.
    Integrity, perseverance, and faith in divine providence cannot be transmitted
    in a lecture hall. They must be modeled.


    Jesus taught in the synagogues. But he did his followers along the way—in boats,
    seashores, in towns and villages, while at work. The apostle Paul mentored Aquila
    and Priscilla working: "because he is a tentmaker so they were, stayed and worked
    with them.\^314 He also admonished the Thessalonian church to "acknowledge those
    who work hard among you . . . and hold them in the highest regard in love because
    of their work.\^315


    Scripture makes clear that work is not solely about making stuff. God intended
    something else to occur in the process. We may be growing tomatoes or crafting
    fine furniture. But we are also shaping souls.


    That is why we don''t mind the sweat and dirt or the inefficient methods of production
    we employ here on our farm. For us its not about doing faster or cheaper. Relationships
    are what matter. I want to be beside my son as he struggles to lift bales into
    the barn, or kneel beside my'
  merge: -1
