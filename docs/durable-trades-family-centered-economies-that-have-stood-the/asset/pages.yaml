    to food, housing, or clothing. On the other end of the spectrum, only one in twenty
    of the lowest-scoring trades are involved with providing basic necessities. The
    research confirms that trades catering to core human needs are not only the most
    stable over time; they are also the most family-centric.


    Currently, spending on basic necessities consumes only one-half of household budgets
    in the U.S. But it didn''t always used to be this way. Without the support of
    government subsidies and extreme societal complexity, the true cost of heretofore
    cheap products would become exorbitantly expensive. Conversely, luxuries considered
    expensive today would appear cheap by comparison if basic commodities were ever
    to become scarce. This is not a bold prediction, nor should it come as a surprise.
    It is easy to look back and see how Americans historically apportioned their budgets.


    In 1901 the average U.S. household allocated 80 percent of its budget to basic
    necessities. One hundred years later that number had fallen to 50 percent. And
    the number would in fact be much lower if the necessities did not also include
    “luxuries” such as dining out or vacation homes.


