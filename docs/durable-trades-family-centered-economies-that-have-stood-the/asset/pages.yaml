  md: 'patches every business experiences. To such owners, money is a secondary concern.
    There must be enough income to pay the bills, of course. But turning your vision
    into a reality is a much stronger draw than potential financial benefits.


    +   2. **Seek mentors.** Find people who are doing what you want to be doing and
    learn from them. Books, workshops and instructional videos are a step in the right
    direction, but there is no substitute for working in the trade to truly learn
    it. Volunteer your time, if necessary, to learn from a master before striking
    out on your own. Master gardener and arborist Paul Gautschi said: "Throughout
    history, everywhere in the world, people who were successful learned from masters.
