  md: '# 1


    # # The Challenge Ahead


    We all have grown up in complex societies, so we consider complexity to be normal,
    and we consider it to be the natural state of affairs. The problem with this view
    is that it''s historically inaccurate. We are in fact an anomaly of history. We
    realize that low complexity is the normal state of affairs and the way we live
    today is very unusual.¹


    > —JOSEPH TAINTER


    RESEARCH INTO THE TOPIC of “durable trades” invariably leads to the causes of
    decline. After all, both investigating such a topic unless there is an underlying
    sense that the way we live today is not indefinitely sustainable. If such a project
    is worth undertaking, what assumptions are being made about the way things are?


    Jobs in the building trades are projected to increase faster jobs in every sector
    in America over the next decade—faster even than health and technology.² Over
    the same period, many white-collar jobs requiring 4-year college degrees will
    cease to exist. Why is this?


    To answer these questions, we must examine the serious cracks in modernity’s foundation
    so that we can understand the need for more durable alternatives for those living
    in the twenty-first century.


    # # Complexity & Specialization


    In his renowned work, The Collapse of Complex Societies, historian Joseph Tain
    posed a new theory for the cause of decline and collapse in civilizations. Prior
    to his work, theories of societal collapse ranged from “such catastrophes as nuclear
    war, resource depletion, economic decline, ecological crises, or sociopolitical
    disintegration.³ But Tainter’s theory'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'differed from other literature on the subject. Tainter asserted that societies
    collapse not because of external pressures forced upon them, but because of increasing
    levels of complexity from within:


    Human history as a whole has been characterized by a seemingly inexorable trend
    toward higher levels of complexity, specialization, and sociopolitical control,
    processing of greater quantities of energy and information, formation of even
    larger settlements, and development of more complex and capable technologies.


    As societies face problems, they increase in complexity in order to solve them.
    Tainter argues, the complexity overwhelms a society’s ability to maintain it,
    and the result is a “rapid loss of complexity in a society,” otherwise known as
    collapse.


    To prove his point, Tainter documents the collapse of 18 civilizations through
    history, from the Old Egyptian Empire (2181 BC) to the Roman Empire (AD 476),
    to the Chacoan (AD 1300) and Mayan (AD 900) civilizations in North and South America,
    all of which were at their heights—some having lasted thousands of years—when
    collapse came suddenly.


    One way to measure complexity in a society is to look at the stratification of
    professions—that is, job specialization. As societies increase in complexity,
    the labor force must continually re-orient itself to meet new demands and challenges,
    subdividing complex tasks into simpler ones. In America, as with the rest of the
    industrialized world, we have seen a logarithmic rise in the number of occupations
    over the last two centuries.


    At the founding of our country, there were at most few dozen distinct occupations.
    Within 100 years that number had risen to over 8,000. Today there are over 30,000
    occupations, with dozens of new specialties being invented daily.'
