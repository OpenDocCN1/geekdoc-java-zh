  md: 'Animal husbandry, as with any trade, has diversified into numerous specialties.
    In addition to keeping cattle, hogs, sheep and goats, people also keep alpacas
    and bees, and maintain hunting farms and aquaculture. Poultry has enjoyed a renaissance
    in recent years as municipalities have begun loosening codes to allow citizens
    to keep “backyard chickens.”


    Through all of the changes, the core product—animals—and methods for raising animals
    have remained nearly identical for hundreds of years. Advances in genetics have
    improved yields and sizes, particularly in cattle, but heirloom breeds are still
    highly sought after their proven reliability and hardness. Although most meat
    comes comes from feedlots, the increasing demand for grass-fed meat has created
    many opportunities for family-scale farms to raise animals the old-fashioned way,
    and do so quite literally.


    # Resiliency: 93 percent


    Since food, and meat in particular, is the backbone of the nation’s food supply,
    shepherding is a highly resilient trade. In a grass-fed operation, virtually all
    the inputs are local, on-farm—even replacement stock. Demand for locally grown
    food means that most customers can be local as well. Worldwide demand for meat
    continues to increase, and healthier, organic options have held up well during
    proven recessions:


    While Americans economized on their food purchases during the 2007–09 recession,
    including purchases of organic products, growth in demand for organic products
    rebounded quickly following the recession... . Industry data suggest that the
    market share of organic sales held by various food categories has been remarkably
    stable over the last decade.¹¹⁶


    Finally, the unpredictable nature of working with animals limits the risk of automation.
    Humans rather than robots make the best shepherds.


    # Family-Centeredness: 100 percent


