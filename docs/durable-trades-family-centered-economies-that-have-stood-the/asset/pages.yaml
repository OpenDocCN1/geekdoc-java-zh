    # Winemaker, Distiller


    > Eat the food, Enkidu, it is the way one lives. Drink the beer, as is the custom
    of the land.

    —EPIC OF GILGAMES (1800 BC)


    FOR NEARLY AS LONG as there has been food, there has been drink. In all times
    and cultures, fermented beverages have been synonymous with celebration and revelry—as
    well debauchery and excess. In antiquity, at a time when sources of drinking water
    were hard to come, beer and wine were sought as much for their health benefits
    as their spiriting effects. Consequently, the brewer, winemaker and distiller
    are among the oldest and most stable of professionals, and have strong family
    ties. Some family-run wineries in Europe have succeeded for over 30 generations,
    operating continuously since the tenth century AD.


    With relaxing laws and surging demand, alcohol is a booming industry.153 There
    are currently over 7,500 breweries, wineries and distilleries in the U.S. that
    manufacture $74 billion worth of products annually.154 In America, total expenditures
    on alcoholic beverages have surpassed $217 billion—more than doubling since the
    year 2000.155 While this is good for business, it is not necessarily good for
    public health. The CDC reports that one in six drinkers is a binge drinker, and
    binge-drinking leads to 88,000 deaths per year. The total cost resulting from
    alcohol abuse amounted to federal, state, and local governments amounted to $249
