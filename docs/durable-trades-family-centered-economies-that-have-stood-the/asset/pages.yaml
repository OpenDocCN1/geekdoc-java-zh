    > —GENESIS 4:2 (4000 BC)


    The KEEPING OF ANIMALS surpasses even farming as the most historically durable
    trade. While animal husbandry has undergone many changes in the last century,
    it has not seen the extent of commoditization and technological change that crop
    farming has. Aside from industrial-scale confinement operations, keeping animals
    today on pasture remains largely the same as it was thousands of years ago. Shepherding
    and its modern counterparts comprise all aspects of animal husbandry—the raising
    of animals for food, fiber, and productive labor. There are 1,004,560 livestock
    farms in the United States today generating $184 billion annually.


    In Genesis we see the first division of labor when Adam''s sons, Cain and Abel,
    become farmer and shepherd, respectively. But it is common today to see these
    two trades combined in order to achieve the overlapping benefits of labor, fertilizer,
    and meat production. It is worth mentioning that the eating of animals was prohibited
    until after the Flood in Noah''s time, so likely Abel was keeping flocks for the
    animal byproducts of dairy, wool, and leather garments, as well as sacrifices
    for sin.


    # Historical Stability: 88 percent


    The kinship between man and beast dates to the earliest records of civilization.
    In the Bible, God tasks Adam with naming His creatures shortly after creation.
    The ancient Egyptians considered certain animals to be sacred and worshipped them
    as gods. Regardless of the source one consults, animals have been integral to
    human societies since records began.'
