  md: 'One of the greatest challenges is becoming efficient, according to Jim. Working
    efficiently is hugely important when practicing law. “A sharp client will know
    when they’re being over-billed,” Jim says. Therefore it is a continual challenge
    to get quality work done without wasting time. The other challenge is stress.
    “Everything is either a problem now or could come back to you as a problem later.”
    The greatest joy, according to Jim, is seeing a settle. Work that you had planned
    for the next two months is suddenly done, and all the stress is lifted. “Your
    client is happy and you receive a lot of money at all.”


    It is not very common, however, to see family members working together in the
    trade. Once in a while you will see a spouse working in the firm, Jim says. If
    other family members become attorneys it is common to see them work together in
    the same firm. “That can work out really well,” he says. But the high cost of
    education prevents from doing so.


    Since Jim has been involved in the profession he has noticed a trend towards less
    congeniality and more toward hostility. The profession is also more stressful
    than it was previously. Going forward, he expects the legal profession to be squeezed
    for greater and greater efficiency. “Law 20 to 30 years from now is going to look
    a whole lot different than it does now,” he says.


    “The easiest way to practice law is to become an expert and known as a guru in
    one area,” says Jim. That way, you become as efficient as possible, without spreading
    yourself too thin. Jim advises those interested in becoming lawyers to get an
    internship before jumping into it. Good grades in law school is also key. “Law
    is meritocracy,” says Jim. You need to have very good degrees to get hired by
    the big law firms. Honing in the things that are important for exams will save
    you from wasting time.


    “A degree is a pretty degree,” says Jim. There are many well-paying opportunities
    for those trained to think like a lawyer, even if they are not directly involved
    in litigation or transactional work. “Just keep your eyes open to the fact that
    you may not end up where you thought you would.”


