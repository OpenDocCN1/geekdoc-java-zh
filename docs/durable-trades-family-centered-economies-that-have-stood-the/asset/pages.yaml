    a 50-year period from roughly 1790 to 1840 during which “production of goods moved
    from home businesses, where products were generally crafted by hand, to machine-aided
    production in factories.”^73 During this period, entire industries were born,
    overturned, or put to rest. It is difficult to imagine the upheaval families experienced
    during this period when thousands of years of custom were upended in a single
