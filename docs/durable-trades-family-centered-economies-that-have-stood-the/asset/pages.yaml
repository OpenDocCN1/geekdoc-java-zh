- img_proc: true
  md: 'A story was once shared with me about shipwreck survivors during World War
    II. When rescue vessels finally found the lifeboats in the icy North Atlantic
    sea, sailors came upon a baffling, yet tragic sight. Despite their superior physique,
    all of the younger soldiers had died. But the older soldiers were still alive.
    It turned out that the older surviving soldiers had fought in World War I; they
    had faced death and survived. They had faith they could endure this trial. But
    the younger soldiers, having experienced war or the limits of their endurance,
    lost all hope before their rescuers arrived.


    The Psalmist tells us that “the righteous shall be in everlasting remembrance.
    He shall not be afraid of evil tidings; his heart is fixed, trusting in the Lord.”³18
    If we align our purposes with God, we need not worry about the future. “Are not
    two sparrows sold for a penny? Yet not one of them will fall to the ground outside
    your Father’s care. . . So don’t be afraid; you are worth more than many sparrows.”³19
    We begin, therefore, by acknowledging God as the source of our provision and trusting
    in his providence—not in riches, politicians, hard, retirement-eggs, or even historically-stable
    trades.


    # Farming Knowledge


    My son was not two years old when we moved to our farm. His sister was nine days
    old. At the time we knew next to nothing about farming, shepherding, or repairing
    machinery. My first-ever building project was a cabin I built in our woods that
    was to become my home office.


    The cracking of our first eggs and harvesting our first honey were huge milestones
    for us. We planted a garden and some apple trees. A barn was built, and we added
    a few dairy goats and sheep to graze the orchard. Now we are cutting and baling
    our own hay and storing food for the winter. Every step along the way has been
    a learning experience. Neither my wife nor I comes from farming backgrounds, and
    a lot of stubborn persistence we have pieced together the beginnings of a family
    farm.


    In our journey toward a new family economy, my chief observation is that it takes
    much longer than I ever imagined it would. There is no rushing this process. The
    accumulated skill of previous generations literally takes a'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'generation to pass on. Those not raised in a family of farmers, shepherds,
    woodworkers, or other master craftsmen will have a difficult time learning the
    trade from scratch. But those who persevere and dedicate themselves to building
    something that will last will pass on a rich inheritance to their own children
    in the process.


    My son is nine years old. He can plant a garden, split firewood, drive a tractor,
    handle livestock, and tend an orchard. I was 35 before I built my first structure;
    he is already using power tools. His sister is seven, and three more siblings
    arrived in the meantime. All of them are learning right alongside my wife and
    me. They are inheriting our hard-fought lessons. If the journey of a thousand
    miles begins with a single step, the journey toward a lasting family economy begins
    with a single generation.


    # Durable Families


    Durable trades are not an individual pursuit. For too long, work has driven a
    wedge into families, dividing husband from wife, father from son, mother from
    daughter, and family from home. Building something that will last requires a radically
    different perspective of family from what is common or encouraged today. It requires
    total devotion to each other and the well-being of the family. It means individual
    sacrifice for the betterment of the whole.


    For thousands of years it was the family economy that provided the context in
    which family members spent time together, achieved goals together, cared and provided
    for one another''s needs, gave and received mentorship, and transmitted faith,
    culture, and values to the next generation.


    In his book Family Life, Kevin Swanson likes the family economy to an ax and handle."An
    ax head by itself is of little use to take down trees," he writes."Place an ax
    head on an ax handle, and the capability for useful work has increased a hundred
    fold. This demonstrates the basic elements of the family economy as designed by
    God."^{520}


    The family economy encompasses more than business and entrepreneurship, though
    that is an essential part of it. It also integrates education, discipleship, worship,
    and recreation. It is the melding of individual aspirations into a common purpose.
    More importantly, it has been the context by which parents pass their faith, culture
    and values on to their children for most of human history.'
