    Olympians, are described as spending their lives in either debauchery or pleasures,
    or like the Hindu gods, passively in everlasting repose, God of the Bible is the
    Master Worker who is Maker Sovereign of the world.


    According to Duckat, “The Hebrews were virtually the only ancient people who overwhelmingly
    viewed work as dignifying rather than demeaning.” God created man in his own image
    and placed him in the garden “to tend and keep it.”


    Unlike other peoples of antiquity who despised both slaves and workers, humble
    workers attained exalted positions in Israel,” Duckat explains. Abraham, Isaac,
    and Jacob were shepherds. Saul was a farmer before being the first King of Israel.
    David, his successor, was a shepherd. Elisha, the farmer, was ploughing with a
    yoke of the oxen when Elijah, the prophet, found him. Amos both tended sheep and
    sycamore trees. Moses, who was raised in Pharaoh’s palace, was not ordained until
    tending flocks for 40 years. Before leading Israel’s armies, Gideon could be found
    threshing wheat. And Jesus, a carpenter, found his first disciples fishing in
    the Sea of Galilee.


    Not only does the Bible dignify humble occupations, it also condemns id. “Greater
