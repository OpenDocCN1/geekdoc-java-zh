    # 32. Farrier


    The humble petition of our wellbeloved subjects the Brotherhood of Farryers .
    . . that their art and trade is of great antiquity and of great use and benefitt
    to our subjects for preserving of horses.


    > ROYAL CHARTER OF THE WORSHIPFUL COMPANY OF FARRIERS (1674)


    FARRIERS, WHO SPECIALIZE IN trimming and shoeing horses,, were closely associated
    with blacksmiths in colonial America. It was not uncommon for a blacksmith to
    forge horseshoes or a farrier to repair tools—often they were the same person.
    As distinct tradesmen, farriers go back centuries before the founding of this
    country. Around 1000 BC Solomon wrote, "The horse is made ready for the day of
    battle, but the victory belongs to the Lord.\^238 Early Roman horseshoes have
    been found dating to AD 180.239 it was unlikely that horseshoes were in common
    until after the ninth century AD, due to the scarcity of iron. The fourteenth
    century farrier guilds were forming in Europe, establishing farriers as a distinct
    trade. Modern farriers spend more time than their predecessors on hoof care and
    overall equine health. They might be described as a cross between a veterinarians
    and blacksmiths—at least, they require the skills of both.


    With over seven million horses in the U.S., the trade shows sign of disappearing.
    Farriers have their own schools, trade associations, and journals. Automation
    poses almost no risk to this highly unpredictable trade. The pay is good too:
