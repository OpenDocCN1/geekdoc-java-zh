  md: '# # Introduction

    # Against Obsolescence


    AFTER MOVING TO a hobby farm several years ago, I began researching alternatives
    to the career path I have been on most of my life. Our experiences here with farming,
    stewardship land, and raising animals (and children) have stirred a deep desire
    in me to spend more of my time building things that will last. As a computer scientist,
    I have seen my share of obsolescence. Nothing can be more temporary than what
    comes out of Silicon Valley. I vividly remember my first day as a self-employed
    computer consultant years ago, bright-eyed and cheery, working for myself for
    the first time. My client had hired me to help with a custom software project
    and had given me a tour of the sprawling dot-com startup headquarters with its
    few hundred employees. The supervisor showed off the free soda machines, communal
    working environments, and break rooms replete with ping pong tables and other
    games. I was told about a forthcoming jumbotron on movies which would be screened
    every Friday afternoon. The next day everyone was laid off. Including me. It was
    the beginning of the dot-com collapse.


    That experience, so early in my career, was formative to me in understanding how
    disposable we are in the modern economy. We live in a time when companies employ
    "planned obsolescence" to make sure things wear out and need to be replaced, so
    we need to keep earning money to buy the replacements. Even things that do not
    wear out their own become targets of obsolescence by their manufacturers, as discovered
    with older-model iPhones: Apple was deliberately degrading performance in order
    to force customers into newer versions (or so the 32 class-action lawsuits in
    the U.S. claim).


    And, increasingly, people are becoming obsolete. It is said the average person
    will work seven careers in their lifetime, which means he switches careers about
    five to seven years. According to the Bureau of Labor Statistics, a worker will
    switch jobs within those professions every 2.5 years. If it takes roughly five
    years working full-time to become an expert in a given skill, it is doubtful that
    all of these people are voluntarily'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'choosing to abandon their professions at the peak of their ability. For many,
    if not most, this way of life is forced upon them. Indeed, a person in my field
    who does not continuously retrain will become obsolete in about three years.


    We are told to be good consumers, which means using things up and throwing them
    away. Our prosperous economy depends on this. But we''re a long way off the normative
    flow of history, in which self-reliance was the rule and where handmade furniture
    and tools were produced for generations because they were made to last for generations.


    When things broke down, they were fixed. What couldn''t be fixed was used elsewhere.
    Garbage trucks did not pick up 96-gallon bins Tuesday and bring them to landfills,
    because nothing was thrown out. Neither were people disposable. A person''s worth
    was not the net total of his paycheck. Children were viewed as gifts from God
    and the elderly as the well-spring of wisdom. Everyone from cradle to grave had
    value and was needed by the community if the community were to survive.


    Careers didn''t become obsolete every half-decade. They lasted hundreds of years.
    There was no need for perpetual purchasing because people knew how to make virtually
    everything they needed, and make it well. "Up to 1840, boot and shoemaking was
    wholly a handicraft," noted historians at the U.S. Department of Labor in 1922.
    "Shoemaking could be performed adequately ... by any frontier farmer in his colonial
    kitchen.\^3


    In his book The New Agrarian Mind, Allan Carlson writes about pre-Industrial life
    in America: Before 1840, homespun cloth, homemade clothes, hand-wrought furniture,
    domestically produced candles, and home educated children were the rule, in city
    and countryside.\^4 Of these people Thomas Jefferson wrote in 1785: "They are
    the most vigorous, the most independent, the most virtuous, and they are tied
    to their country and wedded to their liberty and interests by the most lasting
    bands.\^5


    In the course of researching this book, I have had difficulty finding comparative
    wage data and living standards for pre-Industrial professions. Farming, though
    idealized by Jefferson, is not even listed as an occupation in The Statistical
    Abstract of the United States 1752–1885, despite the fact that the vast majority
    of people were farmers during that period. To the'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'industrialists, money was the only measurement, and whatever could not be measured
    by medieval was not worth mentioning.


    With the Industrial Revolution, efficiency became our highest virtue, and with
    generational stability collapsed. The factory replaced the family as the primary
    means of sustenance. Opportunity for apprenticeship, relationship, and cross-generational
    continuity of values and culture disappeared.


    Is all this simply romanticizing the past? Don''t we live vastly wealthier lives
    today? I guess it depends on how you define wealth. In terms of material abundance,
    yes, we are vastly richer than our forebears. But it''s hard to put a price on
    self-sufficiency. In terms of relationships to each other, the land, and to God,
    our forebears were much richer than we. The Benedict Option, Rod Dreher writes,
    “The long journey from a medieval world racked with suffering but pregnant with
    meaning has delivered us to a place of unimaginable comfort but emptied of significance
    and connection.” If quality of life consists merely of the abundance of possessions,
    if our value to society is solely solely our productive capacity, if money, things,
    cares and people are perpetually becoming obsolete, how we have profited by gaining
    the whole world?


    This book is an attempt to answer the question: is there another way? Is it possible
    to reclaim some of the lost practices of previous generations—and rewards of strong
    families and resilient communities? Is it possible to build something that will
    last, something that is an inheritance, even to our children''s children?


    In the pages that follow, I outline how our modern way of life is resting on fragile
    foundations and discuss a few of the many challenges that lie ahead (Part I).
    I also present a catalog of what I call Durable Trades: historical, family-centered
    professions that have survived some of the worst upheavals in history—and are
    still thriving (Part II). To each trade listed I assign a score based on metrics
    such as historical stability, familycenteredness, and resistance to automation
    (the complete list of criteria can be found in the Appendix). Finally, I offer
    some reflections on this research and discuss how families can prepare for an
    uncertain future by examining the past (Part III).


    I intend this work to be a starting point. Family-centered trades are not only
    the most durable throughout history; they are also the ideal context by'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'which parents can pass their values, faith, and culture on to the next generation.
    My hope is that this book inspires readers in some way to begin building a lasting
    inheritance for their families.


