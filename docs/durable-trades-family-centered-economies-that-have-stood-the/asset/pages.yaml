    of work and can be highly selective about taking jobs. During good economic times,
    carpenters can have waiting lists of jobs that are six to twelve months out.


    # Ease of Entry: 92 percent


    Carpentry has one of the lowest barriers to entry of all trades. For those with
    aptitude, an initial outlay of a few hundred dollars can buy a basic set of tools.
    There is no formal education required other than obtaining licensing if working
    independently as a general contractor. While competition is stiff, especially
    during recessions, it is common for seasoned carpenters to turn down work.


    Carpentry is expected to grow rapidly in the years to come. The Bureau of Labor
