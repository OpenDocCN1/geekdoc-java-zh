  md: '# # Job Specialization in the U.S.


    ![](img/dbacf28424b0cf4b0b52ce300ad21c50_23_0.png)


    Sources: Virginia Center for Digital History; Colonial Williamsburg; US Census
    1850; US Census 1900; IPUMS USA; 1950 Census, Alphabetical Index of Occupations
    and Industries; Census 2000 Occupational Index; Data for 1800 is estimated.


    To analyze the rapid increase in specialization and complexity, twentieth-century
    economists developed models to interpret the data. The Three-Sector Theory, developed
    by Allan Fisher, Clark Colin and Jean Fouraste, proposed organizing job specialties
    into three “megasectors” of economic activity: primary, secondary, and tertiary.
    Later a fourth sector was added, the quaternary.


    “This categorization is seen as a continuum of distance from the natural environment,”
    explains geographer Matt Rosenberg. “The continuum starts with primary economic
    activity, which concerns itself with the utilization of raw materials from the
    earth such as agriculture and mining. From there, the distance from the raw materials
    of the earth increases.”§


    Primary Sector activities include raw material extraction, namely, farming, mining,
    fishing, forestry, and hunting. The Secondary Sector produces finished goods from
    the activities of the Primary Sector. This'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'includes manufacturing, processing, and construction. The Tertiary Sector is
    broadly known as the services industry. Activities in this sector involve selling
    goods made by the Secondary Sector and providing services—transportation, banking,
    healthcare, and law—to people in all sectors. The more recently defined Quaternary
    Sector consists of intellectual activities known as the knowledge economy—scientific
    research, education, government, and information technology.


    Clark codified this theory into a time-series chart to illustrate how civilizations
