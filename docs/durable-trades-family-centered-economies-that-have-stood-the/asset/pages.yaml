  md: '# Author’s Note


    Such is the destiny of all who forget God; so perishes the hope of the godless.
    What they trust in is fragile; what they rely on is a spider’s web.


    —JOB 8:13–14 (NIV)


    As THIS BOOK GOES to, the world is in the throes of global pandemic. In January
    reports of an obscure virus emerged from Wuhan province, China, where 40 cases
    of the novel Coronavirus had been confirmed. Two months later there are 800,000
    cases in 178 countries, with infections doubling every six days. The Centers for
    Disease Control has estimated a worst-case scenario of 1.7 million deaths in the
    U.S. Around the world, drastic measures are being taken: emergency declarations,
    border closures, quarantines. We now stand on the precipice of a severe economic
    recession, if not depression. After reaching an all-time high in February, the
    U.S. stock market plummeted nearly 37 percent in a mere four weeks. The Federal
    Reserve has pledged $1.5 trillion to protect the banking system, and Congress
    has passed a $2 trillion stimulus to stave off recession. Global supply chains
    are strained to the breaking point as manufacturing facilities shut down due to
    lack of laborers. And consumers are encountering a phenomenon they have never
    seen before: empty shelves in every grocery store in America.


    What is heralded as unprecedented is, in fact, quite preceded. Global pandemics
    occur with frightening regularity. In the last centuries, there have been three
    pandemics each century: two minor and one major. The last major pandemic was the
    Spanish Flu of 1918, which infected half the globe and claimed 50 million lives
    at a time when only 14 percent of the world’s population lived in cities.


    But what astounds most is not the seriousness of the illness, but the fragility
    of the infrastructure on which our society depends—a central theme of this book.
    The world’s supply chain, finely tuned for maximum profitability and just-in-time
    delivery, cannot keep pace with demand. As'
  merge: -1
  pgno: 11
