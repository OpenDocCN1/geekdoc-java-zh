    # # Methodology


    Each trade was scored on a sliding scale across 20 criteria. These scores were
    weighted and summarized according to the five main categories used in the book.
    In the case of a tie, Historical Stability was prioritized. A detailed breakdown
    of categories and weights is as follows:


    Historical Stability (20 percent of total):


    +   - Change to Core Product/Service (40 percent of category)

    - Change to Method (20 percent)

    - Change to Tools (20 percent)

    - Change to Clientelele (20 percent)


    Resiliency (15 percent of total):


    +   - Minimum Population Requirement (20 percent of category)

    - Supply-Chain Vulnerability (25 percent)

    - Economic Cycle Vulnerability (20 percent)

    - Market Diffusion (local or foreign) (20 percent)

    - Automation Risk (15 percent)


    Family-Centeredness (35 percent of total):


    +   - Time Together, while working (30 percent of category)

    - Age Variability (20 percent)

    - Gender Compliment (5 percent)'
