- img_proc: true
  md: 'Today advice is a huge industry, with over 130,000 management consultants in
    the U.S., accounting for $218 billion in revenues annually.199 Consultants can
    be found in virtually every office building. From management to finance to technology,
    consultants play a pivotal role in helping leaders at every level navigate the
    complexities of modern business and government.


    # Historical Stability: 68 percent


    Advisors today provide the same product they always have: advice. But anyone can
    give advice. What makes professional advisors unique is their proven ability to
    help leaders reach their goals. As the proverb says, “The way of a fool is right
    in his own eyes, but a wise man understands it.”200


    Modern consulting differs greatly from its ancient counterpart. Today it is common
    to see young consultants whose advice comes from research and accreditation rather
    than life experience. In the case of technology, it is often preferable to work
    with younger generations who adapt more quickly to the rapidly changing environment—a
    lingering artifact of the Industrial Revolution where “it is now usual and needed
    to teach but a single branch” rather than understand complete systems.201


    Along with the change to methods, tooling has become far more computerized and
    empirically-based. Consultants are often tasked with researching “best practices”
    in a given industry because there are so many practices to choose from.


    Consultants are hired directly by the people who need them precisely because a
    custom solution is needed. Although the industry differs from what it was in previous
    generations, the need for direct contact with clientele has not changed.


    # Resiliency: 68 percent


    Advisors score about average on resiliency. In a professional capacity, consultants
    rather than employees are often the first to go when a business needs to tighten
    its budgets. But at the same time, consultants are often the first to be hired
    when companies seek a new direction. The point is that advisors as a group are
    generally viewed as discretionary in turbulent times, but individually may be
    unaffected by economic cycles.'
