  md: '# Preface


    IN HIS SEMINAL WORK, The Course of Empire, Thomas Cole traces the rise and fall
    of a fictitious empire through a series of five paintings. The series begins with
    the primitive Savage State, followed by the idyllic Pastoral State, leading up
    to the Consummation of Empire, in which the imperium reaches its apex of wealth
    and power, only to be followed by Destruction and finally Desolation, in which
    savagery reassert its dominance. The fact that those paintings were created in
    the mid-nineteenth century, just as the Industrial Revolution was drawing to a
    close (with America’s “consummation” soon to follow), causes me to wonder whether
    Cole was more a prophet than a painter.


    We live in a paradoxical time. As Western nations revel in unprecedented wealth
    and power, we are increasingly preoccupied with collapse. We closely monitor every
    uptick and downtick in the stock market indices but ignore the health of social
    institutions that underpin our way of life. Corporately we have specialized in
    every field of knowledge. But individually we lack the basic understanding to
    feed, clothe, and shelter ourselves—knowledge that has been passed down through
    every generation except the last two or three. We are abundant with things but
    racked with loneliness and starved for meaning.


    Faced with this reality, I desired to build something that would survive and thrive
    in an uncertain future, something that would tap into the historical context of
    work, family, and faith that has been practiced for thousands of years—in other
    words, something that will last. And if I''m going to spend the next 20 years
    building a family-centered economy, I want it to be one that doesn''t die with
    me—or with the next recession, invention, or global supply-chain disruption. So
    I began to research people, places, and professions that have endured upheaval
    in the past and continue to do so today. This work is the culmination of that
    effort. It presents professions that have proven to be the most durable throughout
    history, place, governments, economic cycles, invention, and collapse; it examines
    the historical record with an eye for modern challenges.'
  merge: -1
  pgno: 13
