- img_proc: true
  md: 'toddlers as they pick blueberries and manage to save a few for the bucket.
    In the garden I can tell my children about spiritual truths and our responsibility
    to care for God’s creation. They get to see how their dad reacts to uncooperative
    weather, broken-down tractors, and raccoons in the hennhouse. In these trying
    moments, will I give in to anger and despair, or will I demonstrate my faith by
    trusting in God’s provision?


    It is at work where our faith is most on display. It is here that disciples are
    made.'
