    # JAVA, THE SHY CREATURE


    ![](img/7d36f0941b446cfff0a43b39d5ee9eb_4_0.png)


    Written by

    Barbara Churchley and Cheri Hutchins


    Artwork by John Campbell

    Sunset Artwork by Palea Goemmel


    Barbara Churchley


    Java lived alone at the edge of a farmer’s field. Java was very shy, but liked
    to explore the forest around her. Java chased butterflies and bees and birds.


    She watched the farmer in his field, and the cows and a horse. Java played in
    the forest until she was tired, then took a nap. She liked the night time the
    best. No one could see her as she was as dark as the night.


    One day, Java awakened from her nap to the sounds of people laughing and talking.
    They were looking at pumpkins in the field, and even picking them up and carrying
    them away. Java did not know what to think... Java did not know about Halloween.


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_6_0.png)


    Java liked to explore in the barn, looking for mice.

    The farmer’s horse, Peaches, slept in the barn at night.

    One night, when Peaches was asleep, Java crept up and

    touched Peaches’ soft nose.

    Peaches and Java became good friends.


    Sometimes, the farmer would come into the barn.

    Java would run out of the barn and into the woods.

    Java was a shy creature.


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_8_0.png)


    In the autumn, when the trees lost their leaves,

    Java wandered close to the farmer’s house.

    There was a wonderful smell coming from the house!

    Java jumped to the window ledge to look in. She was shy,

    but very curious about the wonderful smell.


    Java looked in and saw the farmer’s family sitting at a

    table. The wonderful smell came from a big, roasted turkey

    right in the middle of the table. Java did not know what to

    think... Java did not know about Thanksgiving.


    The farmer had seen Java at the edge of the field

    and in the barn. He put some turkey on a plate,

    and put the plate on the back porch. Java was very shy,

    but when the farmer went back indoors, she crept

    to the plate and ate all of the turkey.


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_10_0.png)


    Before long, the days were cold, and there was snow!

    Java spent more time with Peaches in the barn,

    and slept in her warm bed of straw.


    One morning, Java heard a new sound.

    The farmer and his family were riding in a sleigh pulled by

    Peaches. There were bells on the sleigh that jingled.

    In the sleigh was a tree. The family was taking a Christmas

    tree to the house. Java did not know what to think...

    Java did not know about Christmas.


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_12_0.png)


    That winter, Java spent a lot of time in the barn.

    When the farmer came to the barn,

    Java would hide under the straw.

    Java was a shy creature.


    The days were getting longer. The grass was becoming green. Java woke and stretched
    and yawned, and heard the sound of the farmer’s truck. She saw him get out of
    the truck with beautiful red flowers, and a big red box with a bow. The farmer
    went indoors. Java did not know what to think... Java did not know about Valentine’s
    Day.


    Spring came. Birds were singing, bees were buzzing, and flowers were blooming
    all around the farmer’s house. One day, Java heard lots of children laughing and
    shouting. They were running around in the green grass, and picking up brightly
    colored eggs. Java saw eggs everywhere in the grass. Java did not know what to
    think... Java did not know about Easter.


    One evening in summer, Java saw tables filled with food, and people everywhere.
    When it became dark, sparkling lights and loud sounds filled the night sky.

    Java was frightened at first, and hid in the barn.

    Java was a shy creature.


    The people were laughing and pointing at the lights in the sky. Java did not know
    what to think...

    Java did not know about the Fourth of July.

    Java watched for a long time, then went to sleep in Peaches’ stall.


    Java played all summer long, chasing butterflies, bees, and birds. She knew that,
    soon, people would be coming to pick pumpkins. She also knew that the days would
    grow colder, but she knew she would be warm in the barn with Peaches.


    She knew that a special day would come when the farmer would leave a plate of
    turkey on the back porch for her. That would be Thanksgiving, and Java knew all
    about that.


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_22_0.png)


    ![](img/7d36f0941b446cfff0a43b3f9d5ee9eb_23_0.png)


    Java loves the holidays — all of them.

    She hopes you do, too.


