  pgno: 20
- img_proc: true
  md: 'Java played all summer long, chasing butterflies, bees, and birds. She knew
    that, soon, people would be coming to pick pumpkins. She also knew that the days
    would grow colder, but she knew she would be warm in the barn with Peaches.


    She knew that a special day would come when the farmer would leave a plate of
    turkey on the back porch for her. That would Thanksgiving, and Java knew all about
    that.'
  merge: -1
