- img_proc: true
  md: Spring came. Birds were singing, bees were buzzing, and flowers were blooming
    all around the farmer’s house. One day, Java heard lots of children laughing and
    shouting. They were running around in the green grass, and picking up brightly
    colored eggs. Java saw eggs everywhere in the grass. Java did not know what to
    think... Java did not know about Easter.
  merge: -1
