    (''ord''). These two steps are repeated until the base argument to the method
    is an empty string. When reaching this base case the program will have printed,
    character by the initial input string ''Word'' on the console. Afterwards, the
    method terminates and returns the console to the previous call, which also terminates.
    This is repeated until every call has finished. The procedure simply prints a
    string on the console. Lastly, observe that the method is tail-recursive, since
    the recursive call is the last operation in the recursive case. Thus, the algorithm
    will have performed its task when completing the base case. Note that the console
    is not modified as the recursive calls terminate.


    Alternatively, mystery_method_2 prints the input string on the console, but in
    reversed order. Figure 10.4 shows the sequence of calls for the method. In this
    case, the method is linear-recursive, which implies that it performs an action
    (printing the first character of the input string) after completing a full recursive
    call. When the algorithm reaches the base case it will not have printed anything,
    since none of the print commands will have been executed. The base case does not
    perform any action either. However, as the methods terminate, the control jumps
    to the first instance after the recursive call, which is the print statement.
    This ultimately prints the characters of the input string, character by character,
    in reverse order.


