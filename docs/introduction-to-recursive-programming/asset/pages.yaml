    is sufficient to show the existence of a pair of constants $c$ and $n_0$ that
    will satisfy the definition, since they are not unique. In instance, if the definition
    is true for particular $c$ and $n_0$, then it will be true for larger values of
    $c$ and $n_0$. In this regard, it is not necessary to provide the lowest values
    of $c$ and $n_0$ that satisfy the definition $\mathcal{O}$ (this also applies
    to the notations mentioned below).


    Algorithms are often compared according to their efficiency in the **worst case**,
    which corresponds to an analysis of a problem, amongst all that share the same
    size, for which the algorithm will require more resources (time, storage, etc.).
    Since Big-O notation specifies asymptotic upper bounds, it can be used in order
    to provide a guarantee that a particular algorithm will need at most certain amount
    of resources, in a worst-case scenario, for example, the running time for the
    quicksort algorithm sorts a list or array of $n$ elements (see Section 6.2.2)
    belongs to $O(n^2)$ in general, since it requires carrying out of the order of
    $n^2$ comparisons in the worst case. However, quickly can run faster ($n \log
    n$ time) in the best and average cases.


    In contrast, Big-Omega notation defines **asymptotic lower bounds**:


    > $\Omega(g(n)) = \{f(n) : \exists c > 0 \text{ and } n_0 > 0 / c \cdot g(n) \le
    f(n), \forall n \ge n_0\}$


    Figure 3.7(b) illustrates the idea graphically. Big-Omega notation is useful for
    specifying a lower bound on the resources needed to solve a problem, no matter
    what algorithm is applied. For instance, it is possible to prove theoretically
    that any algorithm capable of sorting a list of $n$ real numbers will require
    $\Omega(n \log n)$ comparisons in the worst case.


    Finally, Big-Theta notation defines **asymptotic tight bounds**:


    > $\Theta(g(n)) = \{f(n) : c_1 > 0, c_2 > 0, \text{ and } n_0 > 0 / 0 \le c_1g(n)
    \le f(n) \le c_2g(n), \forall n \ge n_0\}$


    If $f(n) \in \Theta(g(n))$ then $f(n)$ and $g(n)$ will share the same order of
    growth. Thus, by choosing two appropriate constants $c_1$ and $c_2, g(n)$ will
    be both an upper and lower asymptotic bound as shown in Figure 3.7(c). In other
    words, $f(n) \in \mathcal{O}(g(n))$ and $f(n) \in \Omega(g(n))$. For example,
    the merge sort algorithm for sorting a list or array of $n$ elements always (in
    the best and worst case) on the order of $n \log n$ comparisons. Therefore, we
    say its running time belongs to $\Theta(n \log n)$.'
