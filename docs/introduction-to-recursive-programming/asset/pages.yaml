    # 1.4.3 Imperative vs. declarative programming


    Programming paradigms are general strategies for developing software. The imperative
    programming paradigm focuses on how programs work, where the code explicitly describes
    the control flow and the instructions that modify variable values (i.e., the program
    state). Iterative code follows this paradigm. In contrast, recursive code relies
    on the declarative programming paradigm, which focuses on what programs should
    perform without describing the control flow explicitly, and can be considered
    as opposite of imperative programming. Functional programming follows this paradigm,
    which prevents side effects, and where the computation is carried out by evaluating
    mathematical.


    Therefore, when designing recursive code, programmers are strongly encouraged
    to think of what functions accomplish, instead of how they carry out a task. Note
    that this is related to functional abstraction and the use of software libraries,
    where programmers do not need to worry about implementation details, and can focus
    exclusively on functionality by considering methods as black boxes that work properly.
    In this regard, programmers can – considering recursive functions from a high-level
    point of view as invoking boxes that return correct results (as in Figure 1.9(a)),
    instead of thinking about all of the recursive steps until reaching a base case
    (as in Figure 1.9(b)). More often than not, focusing on lower-level details involving
    the sequence of function calls will be confusing.


