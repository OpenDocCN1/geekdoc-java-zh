    # 6.5.2 Strassen''s matrix multiplication algorithm


    The most expensive arithmetic operation carried out by the previous algorithms
    is the scalar multiplication in the base cases. In particular, both require $pqr$
    of these multiplications, similarly to the straightforward iterative version that
    uses three loops. It is nevertheless interesting to analyze the time complexity
    assuming that the input matrices are $n\times n$. In that case the runtime is
    specified through the following function:


    ```

    T(n) = \begin{cases} 1 & \text{if } n \le 1, \ 8T(n/2) + 4\Theta(n^2) & \text{if
    } n > 1, \end{cases} (6.6)

    ```


    since the methods invoke themselves eight times, and need to perform four matrices
    whose cost is quadratic with respect to $n$. Therefore, according to the master
    theorem (see (3.25)), $T(n) \in \Theta(n^{\log_2 8}) = \Theta(n^3)$. We will now
    describe Strassen''s algorithm, which is a well-known method that can reduce the
    time complexity to $\Theta(n^{\log_2 7}) = \Theta(n^{2.807...}).$.


    The method also decomposes each of the input matrices into four block matrices
    as in the standard algorithm. $AB=C$ can be expressed as:


    $$\begin{bmatrix} A_{1,1} & A_{1,2} \ A_{2,1} & A_{2,2} \end{bmatrix} \begin{bmatrix}
    B_{1,1} & B_{1,2} \ B_{2,1} & B_{2,2} \end{bmatrix} = \begin{bmatrix} C_{1,1}
    & C_{1,2} \ C_{2,1} & C_{2,2} \end{bmatrix}$'
