  md: '# Basic Concepts of Recursive Programming


    > To iterate is human, to recurse divine.

    — Laurence Peter Deutsch


    RECURION is a broad concept that is used in diverse disciplines such as mathematics,
    bioinformatics, or linguistics, and is even present in art or nature. In the context
    of computer programming, recursion should be understood as a powerful problem-solving
    strategy that allows us to design simple, succinct, and elegant algorithms for
    solving computational problems. This chapter presents key terms and notation,
    and introduces fundamental concepts related to recursive programming and thinking
    that will be further developed throughout the book.


    # 1.1 RECOGNIZING RECURSION


    An entity or concept is said to be recursive when simpler or smaller self-similar
    instances form part of its constituents. Nature provides numerous examples where
    we can observe this (see Figure 1.1). For instance, a branch of a tree can be
    understood as a stem, plus a set of smaller branches that emanate it, which in
    turn contain other smaller branches, and so on, until reaching a bud, leaf, or
    flower. Blood vessels or rivers exhibit similar branching patterns, where the
    larger structure appears to contain instances of itself at smaller scales. Another
    related recursive example is a romanesesco broccoli, where it is'
  merge: -1
