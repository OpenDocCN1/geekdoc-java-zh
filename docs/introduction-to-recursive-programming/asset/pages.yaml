    # 3.1.5 Floors and ceilings


    The floor of a real number $x$, denoted as $[x]$, is the largest integer that
    is less than or equal to $x$. Similarly, the ceiling of $x$, denoted as $[x]$,
    is the smallest integer that is greater than or equal to $x$. Formally, they can
    be described as:


    ```

    $[x] = \max\{m \in \mathbb{Z} \| m \leq x}$\n$[x] = \min\{m \in \mathbb{Z} \|
    m \geq x\$

    ```


    $\mathbb{Z}$ represents the set of all integers, and $| |$ can be read as “such
    that.” The following list includes several basic properties of floors and ceilings:


    +   - $[x] \leq x$

    - $[x+n] = [x]+n$

    - $[x]+y] \leq [x+y]$n- $n = [n/2] + [n/2]$n- $n // 2 = [n/2]$n- $[log_{10} p]
    + 1$ is the number of decimal digits of $p$

    - $[log_{2} p] + 1$ is the number of binary digits (bits) of $p$

    - $[x] \geq x$

    - $[x+n] = [x]+n$

    - $[x]+y] \geq [x+y]$n- $n-2[n/2] = 0 \Leftrightarrow n$ is even

    - $n >> m = [n/2^m]$


    where $x$ is a real number, $n$ is an integer, $m$ is a nonnegative integer, and
    $p$ is a positive integer. In addition, // and $>>$ represent operators in Python
    (and also in other programming languages) that compute the quotient of an integer
    division, and perform a right bit-shift, respectively. Finally, $\Leftrightarrow$
    denotes “if and only if.”


