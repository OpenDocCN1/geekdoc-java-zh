  md: '# Preface


    Recursion is one of the most fundamental concepts in computer science and a key
    programming technique that, similarly to iteration, allows computations to be
    carried out repeatedly. It accomplishes this by employing methods that invoke
    themselves, where the central idea consists of designing a solution to a problem
    by relying on solutions to smaller instances of the same problem. Most importantly,
    recursion is a powerful problem-solving approach that enables programmers to develop
    concise, intuitive, and elegant algorithms.


    Despite the importance of recursion for algorithm design, most programming books
    do not cover the topic in detail. They usually devote just a single chapter or
    a brief section, which is often insufficient for assimilating the concepts needed
    to master the topic. Exceptions include Recursion via Pascal, by J. S. Rohl (Cambridge
    University Press, 1984); Thinking Recursively with Java, by E. S. Roberts (Wiley,
    2006); and Practicing Recursion in Java, by I. Pevac (CreateSpace Independent
    Publishing Platform, 2016), which focus exclusively on recursion. The current
    book provides a comprehensive treatment of the topic, but differs from the previous
    texts in several ways.


    Numerous computer professors and researchers in the field of computer science
    education agree that recursion is difficult for novice students. With this in
    mind, the book incorporates several elements to foster its pedagogical effectiveness.
    Firstly, it contains a larger collection of simple problems in order to provide
    a solid foundation of the core concepts, before diving into complex material.
    In addition, one of the book''s main assets is the use of a step-by-step methodology,
    together with specially designed diagrams, for guiding and illustrating the process
    of developing recursive algorithms. The book also contains specific chapters on
    combinatorial problems and mutual recursion. These topics can broaden students''
    understanding of recursion by forcing them to apply the learned concepts differently,
    or in a more sophisticated manner. Lastly, introductory programming courses usually
    focus on the imperative programming paradigm, where students prim-'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# xvi Preface


    ily learn iteration, understanding and controlling how programs work. In contrast,
    recursion requires adopting a completely different way of thinking, where the
    emphasis is on what programs compute. In this regard, several studies encourage
    instructors to avoid, or postpone, covering recursive programs work (i.e., control
    flow, recursion trees, the program stack, or the relationship between iteration
    and tail recursion) when introducing recursion, since the concepts and abilities
    learned for iteration may hamper the acquisition of skills related to recursion
    and declarative programming. Therefore, topics related to iteration and program
    execution are covered towards the end of the book, when the reader should have
    mastered the design of recursive algorithms from a purely declarative perspective.


    The book also includes a richer chapter on the theoretical analysis of recursive
    programs. On the one hand, it contains a broad treatment of mathematical recurrence
    relations, which constitute the fundamental tools for analyzing the runtime or
    recursive algorithms. On the other hand, it includes a section on mathematical
    preliminaries that reviews concepts and properties that are not only needed for
    solving recurrence relations, but also for understanding the statements and solutions
    to the computational problems in the book. In this regard, the text also offers
    the possibility to learn some basic mathematics along the way. The reader is encouraged
    to embrace this material, since it is essential in many fields of computer science.


    The code examples are written in Python 3, which is arguably today’s most popular
    introductory programming language in top universities. In particular, they were
    tested on Spyder (Scientific Python Development Environment). The reader should
    be aware that the purpose of the book is not to teach Python, but to transmit
    skills associated with recursive thinking for problem solving. Thus, such as code
    simplicity and legibility have been prioritized over efficiency. In this regard,
    the code does not contain advanced Python features. Therefore, students with background
    in other programming languages such as C++ or Java should be able to understand
    the code without effort. Of course, the methods in the book can be implemented
    in several ways, and readers are encouraged to write more efficient versions,
    include more sophisticated Python constructs, or design alternative algorithms.
    Lastly, the book provides recursive variants of iterative algorithms that usually
    accompany well-known recursive algorithms. For instance, it contains recursive
    versions of Hoare’s partition method used in the quicksort algorithm, or of the
    merging method within the merge sort algorithm.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Preface ■ xvii


    The book proposes numerous exercises at the end of the chapters, whose fully worked-out
    solutions are included in an instructor''s manual available at the book''s official
    website (see https://www.crcpress.com). Many of them are related to the problems
    analyzed in the main text, which make them appropriate candidates for exams and
    assignments.


    The code in the text will also be available for download at the book''s website.
    In addition, I will maintain a complementary website related to the book: https://sites.google.com/view/recursiveprogramming/.
    Readers are more than welcome to send me comments, suggestions for improvements,
    alternative (clearer or more efficient) code, versions in other programming languages,
    or detected errors. Please send emails to: recursion.book@gmail.com.


    # INTENDED AUDIENCE


    The main goal of the book is to teach students how to think and program recursively,
    by analyzing a wide variety of computational problems. It is intended mainly for
    undergraduate students in computer science or related disciplines that cover programming
    and algorithms (e.g., bioinformatics, engineering, mathematics, physics, etc.).
    The book could also be useful for amateur programmers, students of massive open
    courses, or more experienced professionals who would like to refresh the material,
    or learn it in a different or clearer way.


    Students should have some basic programming experience in order to understand
    the code in the book. The reader should be familiar with notions introduced in
    a first programming course such as expressions, variables, conditional and loop
    constructs, methods, parameters, or elementary data structures such as arrays
    or lists. These concepts are not explained in the book. Also, the code in the
    book is in accordance with the procedural programming paradigm, and does not use
    oriented programming features. Regarding Python, a basic background can be helpful,
    but is not strictly necessary. Lastly, the student should be competent in high
    school mathematics.


    Computer science professors can also benefit from the book, not just as a handbook
    with a large collection and variety of problems, but also by adopting the methodology
    and diagrams described to build recursive solutions. Furthermore, professors may
    employ its structure to organize their classes. The book could be used as a required
    textbook in introductory (CS1/2) programming courses, and in more advanced classes
    on the design and analysis of algorithms (for example, it covers topics such as'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii ■ Preface


    divide and conquer, or backtracking). Additionally, since the book provides a
    solid foundation of recursion, it can be used as a complementary text in courses
    related to data structures, or as an introduction to functional programming. However,
    the reader should be aware that the book does not cover data structures or functional
    programming concepts.


    # BOOK CONTENT AND ORGANIZATION


    The first chapter assumes that the reader does not have any previous background
    on recursion, and introduces fundamental concepts, notation, and the coded examples.


    The second chapter presents a methodology for developing recursive algorithms,
    as well as diagrams designed to help thinking recursively, which illustrate the
    original problem and its decomposition into smaller instances of the same problem.
    It is one of the most important chapters since the methodology and recursive diagrams
    will be used throughout the rest of the book. Readers are encouraged to read the
    background, regardless of their previous background on recursion.


    Chapter 3 reviews essential mathematical fundamentals and notation. Moreover,
    it describes methods for solving recurrence relations, which are the main mathematical
    tools for theoretically analyzing the computational cost of recursive algorithms.
    The chapter can be skipped when covering recursion in an introductory course.
    However, it is included early in the book to provide a context for characterizing
    and comparing different algorithms regarding their efficiency, which would be
    essential in a more advanced course on design and analysis of algorithms.


    The fourth chapter covers “linear recursion.” This type of recursion leads to
    the simplest recursive algorithms, where the solutions to problems are obtained
    by considering the solution to a single smaller instance of the problem. Although
    the proposed problems can also be solved easily through iteration, they are ideal
    candidates for introducing fundamental recursive concepts, as well as examples
    of how to use the methodology and recursive diagrams.


    The fifth chapter covers a particular type of linear recursion called “tail recursion,”
    where the last action performed by a method is a recursive call, invoking itself.
    Tail recursion is special due to its relationship with iteration. This connection
    will nevertheless be postponed until Chapter 11. Instead, this chapter focuses
    on solutions from a purely declarative approach, relying exclusively on recursive
    concepts.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface ■ xix


    The advantages of recursion over iteration are mainly due to the use of “multiple
    recursion,” where methods invoke themselves several times, and the algorithms
    are based on combining several solutions to smaller instances of the same problem.
    Chapter 6 introduces multiple recursion through methods “divide and conquer” algorithm
    design paradigm. While some examples can be used in an introductory programming
    course. Alternatively, Chapter 7 contains challenging problems, related to puzzles
    and fractal images, which can also be solved through multiple recursion, but are
    not considered to follow the divide and conquer approach.


    Recursion is used extensively in combinatorics, which is a branch of mathematics
    relating to counting that has applications in analysis of algorithms. Chapter
    8 proposes recursion for solving combinatorial counting problems, which are usually
    not counted in programming texts. This unique chapter will force the reader to
    apply the acquired recursive thinking skills to a different family of problems.
    Lastly, although some examples are challenging, many of the solutions will have
    appeared in earlier chapters. Thus, some examples can be used in an introductory
    programming course.


    Chapter 9 introduces “mutual recursion,” where several methods invoke themselves
    indirectly. The solutions are more sophisticated since it is necessary to think
    about several problems simultaneously. Nevertheless, this type of recursion involves
    applying the same essential concepts covered in earlier chapters.


    Chapter 10 covers how recursion works from a low-level point of view. It includes
    aspects as tracing and debugging, the program stack, or recursion trees. In addition,
    it contains a brief introduction to memoization and dynamic programming, which
    is another important algorithm design paradigm.


    Tail-recursive algorithms can not only be transformed to iterative versions; some
    are designed by thinking iteratively. Chapter 11 extends the connection between
    iteration and tail detail. In addition, it provides a brief introduction to “nested
    recursion,” and includes a strategy for designing simple tail-recursive functions
    that are usually defined by thinking iteratively, but through a purely declarative
    approach. These last two topics are curiosities regarding recursion, and should
    be skipped in introductory courses.


    The last chapter presents backtracking, which is another major algorithm design
    technique that is used for searching for solutions to com'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'xx ■ Preface


    putational problems in large discrete state spaces. The strategy is usu- applied
    for solving constraint satisfaction and discrete optimization problems. For example,
    the chapter will cover classical problems such as the N-queens puzzle, finding
    a path through a maze, solving sudokus, or the 0-1 knapsack problem.


    # POSSIBLE COURSE ROAD MAPS


    It is possible to cover only a subset of the chapters. The road map for introductory
    programming courses could be Chapters 1, 2, 4, 5, and 10. The instructor should
    decide whether to include examples from Chapters 6-9, and whether to cover the
    first section of Chapter 11.


    If students have previously acquired skills to develop linear-recursive methods,
    a advanced course on algorithm analysis and design could cover Chapters 2, 3,
    5, 6, 7, 9, 11, and 12. Thus, Chapters 1, 4, and 10 be proposed as readings for
    refreshing the material. In both of these suggested road maps Chapter 8 is optional.
    Finally, it is important to cover Chapters 10 and 11 after the previous ones.


    # ACKNOWLEDGEMENTS


    The content of this book has been used to teach programming courses at Universidad
    Rey Juan Carlos, in Madrid (Spain). I am grateful to the students for their feedback
    and suggestions. I would also like to thank Ángel Velázquez and the members of
    the LITE (Laboratory of Information Technologies in Education) research group
    for providing useful insights regarding the content of the book. I would also
    like to express my gratitude to Luis Fernández, computer science professor at
    Universidad Politécnica de Madrid, for his advice and experience related to teaching
    recursion. A special thanks to Gert Lanckriet and members of the Computer Audition
    Laboratory at University of California, San Diego.


    Manuel Rubio-Sánchez

    July, 2017'
