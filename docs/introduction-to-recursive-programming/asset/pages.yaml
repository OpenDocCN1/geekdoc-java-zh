    # 12.7.1 Standard backtracking algorithm


    Since the solution is a subset of the $n$ objects we can develop an algorithm
    whose recursion tree has the same binary structure as one related to the algorithms
    for the subset generation or subset sum problem. Figure 12.15 illustrates the
    recursion tree for weights $\mathbf{w} = [3, 6, 9, 5]$, values $\mathbf{v} = [7,
    2, 10, 4]$, and knapsack capacity $C = 15$, which will be input parameters to
    the recursive method. The nodes represent calls with specific partial solutions
    as parameters, where the numbers beside specify the remaining capacity in the
    knapsack, and the sum of the values of the objects included in it, as shown in
    (a). For a given index $i$ in the partial solution, the algorithm can discard
    introducing the associated object in the knapsack (left child), or it can include
    it (right child). If it discards both of the numbers in the child node do not.
    However, if an element is introduced in the knapsack remaining capacity decreases
    by the weight of the object $w_i$, while the total value of the objects in the
    knapsack increases by $v_i$.


    The algorithm solves an optimization problem. Thus, it needs to keep track of
    the best solution found in previous steps, and must update it if it encounters
    a better one. The full recursion tree is shown in (b), where the shaded nodes
    indicate the method calls that update this solution. Assuming that the initial
    optimal value is a negative number, the method would first update the optimal
    solution when reaching the first leaf. In that case the partial solution encodes
    the empty set, where the sum of values is obviously zero. Continuing the tree
    traversal, the method updates the best solution after introducing the last object
    in the knapsack ($w_3 = 5$, and $v_3 = 4$). Thus, the remaining capacity at the
    leaf node is 10, and the value of the partial solution is 4. The process continues,
    and updates the best solution three times (the corresponding best values are 10,
    14, and 17). The last update naturally determines the optimal solution to the
    problem. In case it consists of the subset formed by the first and third objects,
    where the optimal sum of values is 17. Lastly, it is also important to note how
    the method prunes the binary recursion tree. In particular, the remaining capacity
    associated with a valid partial solution (and node) cannot be negative.


