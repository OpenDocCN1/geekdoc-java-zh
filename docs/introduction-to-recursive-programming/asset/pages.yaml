    # 9.6.2 Recursive descent parser


    Having generated a list of tokens, we are ready to process it in order to evaluate
    the initial mathematical expression. Naturally, these tokens cannot appear in
    any random order (e.g., the list of tokens cannot have two consecutive operators
    or unbalanced parentheses, etc.). They must conform to the production rules of
    a formal grammar, which describe how to combine the tokens in a valid way. Roughly
    speaking, the production rules are used to group or break tokens hierarchically
    into fragments that belong to certain categories. For our calculator classes will
    be "expressions," "terms," "factors," and a few others that we will describe shortly.
    To understand this, consider the following mathematical expression:


    ```

    -(2+3) + 2 * 8/4 - 3 * (4+2)/6 + 7 - -(2+8) * 3.

    ```


    Figure 9.15 shows that within there are five terms separated by plus or minus
    signs that are binary operators. These terms can be further decomposed into "multiplicative"
    factors, separated by ''*'' or ''/''. The example shows how the term 3 * (4+2)/6
    is broken into three factors. It is important to note that the plus in the middle
    factor does not separate terms in the initial expression, since it appears inside
    parentheses. In addition, the first minus sign of the expression is a unary operator
    and naturally does not separate terms. A unary minus sign can also appear between
    two left parentheses, as illustrated in the last.


    The figure also shows that a multiplicative factor can be an expression enclosed
    in parentheses (i.e., a "parenthesized expression"). This implies that the definitions
    of an expression, a term, and a factor are mutually recursive. Notice that an
    expression is a sequence of additive terms, a term is a series of multiplicative
    factors, and a factor can be either a number, or it can contain another expression
    enclosed in parentheses. Naturally, an expression, term, or factor can be a single
    number.'
