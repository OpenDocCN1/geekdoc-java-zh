    The general method for difference equations can only be applied when the inputs
    of terms involving $T$ are differences of the form $n-b$, where $b$ is some integer.
    Nevertheless, it is possible to solve some recurrence relations that contain terms
    where the inputs to $T$ are fractions of the form $n/b$, for some constant $b$.
    The key resides in transforming the fraction into a difference through the change
    of variable $n=b^k$, and therefore assuming that $n$ is a power of $b$.


    Consider the recurrence relation in (3.30), whose recursive case is:


    ```

    $$T(n) = 2T(n/2) + 1,$

    ```


    and we can assume that the input is a power of two. Since the argument in the
    $T$ of the right-hand side is $n/2$ we need to apply the change of variable $n=2^k$
    in order to obtain:


    ```

    $$T(2^k) = 2T(2^{k-1}) + 1 = 2T(2^{k-1}) + 1.$

    ```


    In this definition $T(2^k)$ is a function of $k$. Therefore, we can substitute
    it with the term $t(k)$:


    ```

    $$t(k) = 2t(k-1) + 1,$

    ```


    which we can solve through the general method for difference equations. In particular,
    the expression can be written as $t(k)-2t(k-1)=1-2^k$. Therefore, the characteristic
    polynomial is $(x-2)(x-1)$, and the function will have the following form:


    ```

    $$t(k) = C_1 + C_22^k. \quad (3.43)$

    ```


    By undoing the change of variable we obtain a general solution to the recurrence
    in terms of the original variable:


    ```

    $$T(n) = C_1 + C_2n. \quad (3.44)$

    ```


    The last step consists of determining the constants $C_1$ and $C_2$. This can
    be done through either (3.43) or (3.44). For $T$ we use the base cases $T(1)=1$
    and $T(2)=3$. The analog base cases for $t$ are: $t(0)=T(2^0)=T(1)=1$, and $t(1)=T(2^1)=T(2)=3$.
    The system of linear equations is:


    ```

    $$\begin{cases} C_1 + C_2 = 1 = T(1) = t(0) \ C_1 + 2C_2 = 3 = T(2) = t(1) \end{cases}$$

    ```'
