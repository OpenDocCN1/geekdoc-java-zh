    # 2.7 0-1 KNAPSACK PROBLEM


    Backtracking algorithms are also used to solve optimization problems. The 0-1
    knapsack problem there $n$ objects with values $v_i$, and weights $w_i$, for $i
    = 0, \dots, n-1$. The goal is to introduce a subset of these objects in a knapsack
    with total weight capacity $C$, such that the sum of their values is maximized.
    Formally, the optimization problem can be written as:


    > $$\max \sum_{i=0}^{n-1} x_i v_i$\n$$$\text{subject to } \sum_{i=0}^{n-1} x_i
    w_i \leq C,$\nx_i \in \{0,1\},\quad i=0,\dots,n-1$


    The vector or list $\mathbf{x} = [x_1, \dots, x_n]$ is the variable of the problem,
    whose components can be either 0 or 1. In particular, the $i$-th object is introduced
    in the knapsack when $x_i = 1$. Therefore, $\mathbf{x}$ plays the role as the
    binary list in the subset generation or subset sum problem. The sum $\sum_{i=0}^{n-1}
    x_i v_i$ is the objective function, and simply adds the values of the objects
    that are in the knapsack. The constraint $\sum_{i=0}^{n-1} x_i w_i \leq C$ indicates
    that the sum of their weights cannot exceed the capacity $C$.


    The following subsections describe two approaches that perform an optimal solution.
    The first is a standard backtracking algorithm that prunes the recursion tree
    when the partial solution violates the constraints of the problem (i.e., when
    the sum of the weights exceeds the capacity of the knapsack). The second approach
    uses an algorithm design paradigm known as branch and bound, which is closely
    related to backtracking. The method enhances the search by also pruning the recursion
    tree as soon as the algorithm detects that it will'
