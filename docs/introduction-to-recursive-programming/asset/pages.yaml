    > You don''t really understand something if you only understand it one way. —
    Marvin Minsky


    PREVIOUS chapters have shown how to think and design programs recursively, by
    analyzing a wide variety of computational problems and the main types of recursion.
    The algorithms followed the declarative programming paradigm, which focuses on
    what programs compute from a high-level point of view. Instead, this chapter examines
    recursive programs from a low-level perspective, illustrating how they work, by
    showing the order in which instructions are carried out (i.e., the control flow).


    The chapter describes several representations of the thought process regarding
    how recursive programs work, some of which are known as "mental models" of recursion.
    It introduces recursion trees, which are popular graphical representations of
    the sequence of calls carried out by recursive programs. Among their benefits,
    they are useful for debugging, allow us to visualize the computational (time and
    space) complexity of a recursive program, and can characterize the types of recursion
    covered so far. In addition, the chapter covers their relationship with the program
    stack, which is a data structure that programs use to implement general subroutine
    (i.e., method) calls.


    The chapter ends with a brief introduction to memoization, which is a strategy
    for reducing the time complexity of recursive methods by storing results of potentially
    expensive calls. Memoization is closely related to dynamic programming, which
    is an important algorithm design technique.'
