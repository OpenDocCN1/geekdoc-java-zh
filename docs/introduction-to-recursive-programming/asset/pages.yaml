    # 4.4.2 Horner''s method for evaluating polynomials


    In this problem the goal consists of evaluating a polynomial of degree $n$:


    ```

    $P(x) = c_n x^n + c_{n-1} x^{n-1} + \dots + c_1 x + c_0, \quad (4.5)$

    ```


    at some real value. The sum contains powers of $x$ that are multiplied by the
    coefficients $c_i$. A naive algorithm that computes each power independently would
    require on the order of $n^2$ multiplications. Instead, Horner''s method only
    needs to perform $n$ products. Its clever idea is based on expressing the polynomial
    as:


    ```

    $P(x) = c_0 + x(c_1 + x(c_2 + \dots + x(c_{n-1} + c_n x)))$.

    ```


    The size of the problem is clearly the degree $n$. Thus, the base case occurs
    when $n=0$, where the result is obviously $c$. In practice, $c$ will be a list
    (or a similar data structure such as an array) of $n+1$ elements that represents
    the polynomial. Therefore, the base case is reached when the length of $c$ is
    one.


    In order to apply recursion we need to detect a self-similar subproblem of smaller
    size. The decomposition of the problem, decrementing its size by a unit, is:


    ```

    $P(x) = c_0 + x(c_1 + x(c_2 + \dots + x(c_{n-1} + c_n x))\dots)$.

    ```


    By discarding coefficient $c_0$ and the first multiplication time $x$, the resulting
    subproblem has exactly the same structure as the original problem. If $p(c, x)$
    is the function that evaluates the polynomial defined by **c** at $x$, the recursive
    formula would be:


    ```

    $p(c, x) = c_0 + x \cdot p(c_{1..n}, x)$,

    ```


    where the list $c_{1..n}$ is simply $c$ without its first element. The full function
    is:


    ```

    $p(c, x) = \begin{cases} c_0 & \text{if } n = 1, \ c_0 + x \cdot p(c_{1..n}, x)
    & \text{if } n > 1, \end{cases}$

    ```'
