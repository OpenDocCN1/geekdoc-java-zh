    # 4.1.1 Power function\n\nA classical problem used to illustrate recursion is\
    \ the power function. The goal is to calculate $b$ to the power of $n$:\n\n```\n\
    $b^n = \\prod_{i=1}^{n} b = b \\times b \\times \\dots \\times b \\n\\text{times}$\n\
    ```\n\nthe base $b$ is a real number, and the exponent $n$ is a nonnegative-integer\
    \ (in Python, powers can be obtained through the `**` operator.) The following\
    \ subsections examine algorithms that can compute the power in linear and logarithmic\
    \ time.\n\n# 4.1.1.1 Powers in linear time\n\nAccording to the methodology presented\
    \ in Figure 2.1, the first step consists of determining the size of the problem,\
    \ which is relevant for the input parameters. For this problem, only the exponent\
    \ is relevant determining the number of operations that algorithms need to solve.\
    \ Clearly, the runtime of the algorithms increases as $n$ grows, since the result\
    \ would require more multiplications. Thus, the exponent $n$ is the size of the\
    \ problem. The base case corresponds to trivial instances of the problem, minimum\
    \ size. Since $n$ is a nonnegative integer, the smallest instance is $b^0$, which\
    \ is equal to one.\n\nIn the decomposition step we have to consider smaller and\
    \ simpler self-similar subproblems that stem from reducing the size of the problem.\
