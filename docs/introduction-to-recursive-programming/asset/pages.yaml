    # 10.4 MEMOIZATION AND DYNAMIC PROGRAMMING


    This section presents a technique known as memoization that is used for increasing
    the speed of some recursive algorithms substantially. The approach is related
    to dynamic programming, which is an important and advanced algorithm design technique.


    # 10.4.1 Memoization


    When using recursion, algorithms perform the same recursive calls several times
    (see Section 7.4). In other words, they have to solve identical overlapping subproblems
    more than once. Memoization is an approach for avoiding recalculating the solutions
    to these subproblems, which allows us to speed up the algorithms considerably.
    The idea consists of storing the results of recursive calls in lookup tables.
    In particular, before performing a recursive call the method checks whether it
    has already calculated, and stored, the result. If it has, then the algorithm
    can simply return the stored result, discarding the associated recursive'
