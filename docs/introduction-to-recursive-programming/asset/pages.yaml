    Finally, in order to improve efficiency, many modern compilers can detect tail-recursive
    methods and transform them into iterative versions automatically. Nevertheless,
    Python does not support this feature, which is often referred to as “recursion
    elimination.” One of the arguments of Guido van Rossum, who created the Python
    language, is that it would make debugging harder. In addition, he recommends iteration
    over recursion. The opinion of the author of the present book is that, if efficiency
    and the limitation on the size of the program stack are relevant issues, then
    iterative methods should be used over tail-recursive ones. However, if those aspects
    are not problematic, then programmers should consider the implementation that
    reflects the thinking process involved in solving the problem. In other words,
    the decision should depend on which version is more readable and maintainable.


