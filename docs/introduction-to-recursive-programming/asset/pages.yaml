    # 7.3 TREE TRAVERSALS


    A tree traversal is the process of visiting each of the nodes of a tree (understood
    as an undirected graph) only once in some particular order. In this section we
    will examine three ways of traversing a tree in depth-first order. This means
    that we will examine the entire subtree of a node before analyzing its siblings
    and their corresponding subtrees. In addition, we will only consider left-to-right
    traversals, which process sibling nodes from left to right. Recursive tree traversals
    are appealing for their simplicity, and do not require stack or queue data structures
    as iterative versions.'
