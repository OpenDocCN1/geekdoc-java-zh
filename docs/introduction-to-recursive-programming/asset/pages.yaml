    #  3.3.2 Nonhomogeneous recurrences


    A nonhomogeneous recurrence contains nonrecursive terms on its right-hand side.
    We will be able to solve these recurrences when such terms consist of a polynomial
    times an exponential, as the procedure is exactly the same, for every term $P_{d_i}(n)b_i^n$
    we will need to include $(x-b_i)^{d_i+1}$ in the characteristic polynomial, where
    $d_i$ is the degree of the polynomial $P_i(n)$.


    Consider the following recurrence relation:


    > $T(n) = 2T(n-1) - T(n-2) + 3^n + n^3 + 3n + n^2$.


    As in the previous examples, the first step consists of moving the $T$ difference
    to the left-hand side of the recurrence:


    > $T(n) - 2T(n-1) + T(n-2) = 3^n + n^3 + 3n + n^2$.


    For the next step it is useful to express the terms on the right-hand side as
    the product of a polynomial times an exponential. Naturally, if a term only contains
    an exponential it can be multiplied by 1, which is a polynomial. Similarly, we
    can multiply polynomials $1^n$. Therefore, the recurrence can be written as:


