    is a specific collection of valid input values that will allow us to compute a
    solution to the problem. In contrast, an **algorithm** is a logical procedure
    that describes a step-by-step set of computations needed in order to obtain the
    outputs, given the initial inputs. Thus, an algorithm determines how to solve
    a problem. It is worth mentioning that the goal of this book is to explain how
    to design and implement recursive algorithms and programs, where a key step involves
    decomposing a computational problem.


    Decomposition is an important concept in computer science and plays a major role
    not only in recursive programming, but also in general problem solving. The idea
    consists of breaking up complex problems into smaller, simpler ones that are easier
    to express, compute, code, or solve. Subsequently, the solutions to the subproblems
    can be processed in order to obtain a solution to the original complex problem.


    In the context of recursive problem solving and programming, decomposition involves
    breaking up a computational problem into several subproblems, some of which are
    self-similar to the original, as illustrated in Figure 1.4. Note that obtaining
    the solution to a problem may re-'
