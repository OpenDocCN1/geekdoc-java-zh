    # 2.5 RECURSIVE CASES, INDUCTION, AND DIAGRAMS


    The next step in the template for designing recursive algorithms consists of defining
    the recursive cases, which involves figuring out how to build the full solution
    to an original problem by using the solutions to the-similar subproblems provided
    by the decomposition stage. As mentioned in Section 1.4, we can assume that these
    simpler solutions are readily available by relying on induction. Thus, the real
    challenge when recursively consists of determining how to modify, extend, or combine
    the solutions to subproblems in order to obtain the complete solution to an original
    problem, which corresponds to the last step in the scheme presented in Figure
    1.4.


