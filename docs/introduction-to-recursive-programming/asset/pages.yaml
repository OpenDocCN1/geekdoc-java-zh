  md: '# Linear Recursion I: Basic Algorithms


    > Do the difficult things while they are easy and do the great things while they
    are small. A journey of a thousand miles must begin with a single step.


    Lao Tzu


    RECURSIVE methods can be categorized according to the number of times they invoke
    themselves in the recursive cases. This chapter examines methods that not only
    call themselves just once, but also process the output of the recursive call before
    producing or returning their own result. This common type of recursion is known
    as linear recursion, where the single recursive call is not the last operation
    carried out by the method. This chapter will present numerous problems and respective
    linear-recursive solutions that we will design by relying on the concepts and
    methodology introduced in Chapters 1 and 2. Finally, if the single recursive call
    is the method''s last action, then we say are using tail recursion. This special
    type of recursion will be covered in Chapter 5.


    Linear recursion is the simplest type of recursion, and can be viewed as an alternative
    to implement iterative loops that carry out a certain number of operations repeated.
    In this, although it is fairly straightforward to solve the problems discussed
    in this chapter iteratively, linear recursion provides the clearest examples of
    how to think and program recursively. The chapter will therefore present examples
    of how to apply recursive concepts (i.e., problem decomposition and induction),
    which the reader should comprehend before tackling more complex problems and types
    of recursion.'
