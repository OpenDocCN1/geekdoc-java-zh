    cursive one, and vice versa. Choosing which one to solve may depend on several
    factors, such as the computational problem to solve, the language, or the programming
    paradigm. For instance, iteration is preferred in imperative languages, while
    recursion is used extensively in functional programming, which follows the declarative
    paradigm.


    The examples shown far in the book can be coded easily through loops. In practice,
    the main advantage of using recursive algorithms over iterative ones is that many
    computational problems they are much simpler to design and comprehend. A recursive
    algorithm could resemble more closely the logical approach we would take to solve
    a problem. Thus, it would be more intuitive, elegant, concise, and easier to understand.


    In addition, recursive algorithms use the program stack implicitly to store information,
    where the operations carried out on it (e.g., push and pop) are transparent to
    the programmer. Therefore, they constitute clear alternatives to iterative algorithms
    where it is the programmer''s responsibility to explicitly manage a stack (or
    similar) data structure. For instance, when the structure of the problem or the
    data resembles a tree, recursive algorithms may be easier to code and comprehend
    than iterative versions, since the latter may need to implement breadth- and depth-first
    searches, which use queues and stacks, respectively.


    In contrast, recursive algorithms are generally not as efficient as iterative
    versions, and use more memory. These drawbacks are related to the use of the program
    stack. In general, every call to a function, whether it is recursive or not, allocates
    memory on the program stack and stores information on it, which entails a higher
    computational overhead. Thus, a recursive program cannot only be slower than an
    iterative version, a large number of calls could cause a stack overflow runtime
    error. Furthermore, recursive definitions may be considerably slower. For instance,
    the Fibonacci codes in Listings 1.3 and 1.4 run in exponential time, while Fibonacci
    counts can be computed in (much faster) logarithmic time. Lastly, recursive algorithms
    are harder to debug (e.g., analyze a program by step in order to detect errors
    and fix them), especially if the functions invoke themselves several times, as
    in Listings 1.3 and 1.4.


    Finally, while in some functional programming languages loops are not allowed,
