    # 3.1.4 Sums and products


    It is important to be familiarized with sums since they not only appear in function
    definitions and formulas that we may need to code, but also when analyzing the
    efficiency of both iterative and recursive algorithms. A sum, summation, is simply
    the addition of a collection of mathematical entities (integers, real numbers,
    vectors, matrices, functions, etc.). When a sum involves some function $f(i)$,
    evaluated at integer values from an initial index $m$ up to a final index $n$,
    it can be expressed compactly using “sigma notation":


    ```

    $$\sum_{i=m}^{n} f(i) = f(m) + f(m+1) + \cdots + f(n-1) + f(n). \quad (3.4)$

    ```


    Thus, the result of sum is simply the addition of terms that arise from substituting
    every occurrence of $i$ in function $f(i)$ with integers from $m$ up to $n$.


    ```

    $$\sum_{i=0}^{4} ki^2 = k \cdot 0^2 + k \cdot 1^2 + k \cdot 2^2 + k \cdot 3^2
    + k \cdot 4^2$,

    ```


    where $f(i) = i$.


    It is important to understand that the result of the sum does not depend on the
    index variable. For example, the sum in (3.4) logically depends on the function
    $f$, and on the particular limits $m$ and $n$, but not on any specific value of
    $i$. For instance, notice that $i$ does not appear on the right-hand side of (3.4).
    Therefore, the integer index is simply a “dummy” variable that allows us to indicate
    all of the terms that need to be added with a single expression. In this regard,
    we can choose any name for the index variable, $j$ or $k$:


    ```

    $$\sum_{i=m}^{n} f(i) = \sum_{j=m}^{n} f(j) = \sum_{k=m}^{n} f(k)$.

    ```


    Furthermore, we can express the sum in different ways by performing a change of:


    ```

    $$\sum_{i=m}^{n} f(i) = \sum_{i=m-n}^{n-m} f(i+1) = \sum_{i=m}^{n} f(n-i+m)$.

    ```


    In the second sum the limits (and parameter of $f$) appear shifted. The third
    sum simply adds the terms in “reverse” order (when $i=m$ it adds $f(n)$, while
    when $i=n$ the term added is $f(m)$). Finally, if the lower limit $m$ is greater
    than the upper limit $n$, then the sum evaluates to 0, by convention.'
