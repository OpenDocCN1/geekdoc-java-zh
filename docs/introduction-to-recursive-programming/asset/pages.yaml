    # 5.1 BOOLEAN FUNCTIONS


    This introductory section examines how the choice of base cases can lead to linear
    or tail-recursive algorithms for some Boolean functions.


    # 5.1.1 Does a nonnegative integer contain a particular digit?


    Given a nonnegative integer $n$, and a digit $0 \le d \le 9$ (which is also an
    integer), in this problem the goal consists of determining $d$ is present in $n$.
