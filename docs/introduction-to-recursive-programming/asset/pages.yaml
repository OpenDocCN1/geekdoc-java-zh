    # 3.1.4.2 Arithmetic series


    An arithmetic series is the sum of the terms in a sequence $s_i$ for $i = 0, 1,
    2, \dots$, in which each term is equal to the previous plus a particular constant
    $d$ (which could be negative). In other words, $s_i = s_{i-1}+d$, for $i >0$,
    which is a recursive definition. These terms can also be described noncursively
    as follows:


    ```

    $s_i = s_{i-1} + d = s_{i-2} + 2d = \dots = s_0 + id.$

    ```


    While technically an arithmetic series is an infinite sum:


    ![](img/b600ed831cda07dfedb629b85747f559_102_0.png)


    when analyzing the runtime of algorithms the quantities of interest only add the
    terms of finite sequences:


    ![](img/b600ed831cda07dfedb629b85747f559_102_1.png)


    The sum of the first $n$ positive integers $S(n)$ is frequently used when analyzing
    the efficiency of recursive and iterative algorithms, and can be understood as
    a partial sum (of $n$ elements) of the arithmetic series with $s_0=1$, and $d=1$:


    ![](img/b600ed831cda07dfedb629b85747f559_102_2.png)


    As shown in Section 1.4.1, its result can be expressed as a quadratic polynomial
    (see (1.12)). A simple way to derive the formula consists of adding two $S(n)$,
    one expressed with terms in increasing order, and the other in decreasing order:


    ![](img/b600ed831cda07dfedb629b85747f559_102_3.png)'
