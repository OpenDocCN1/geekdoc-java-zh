    # 3.1.4.5 Products


    Similarly to the notation for sums, for a product of several terms of some function
    $f(i)$, evaluated at consecutive integer values from an initial index $m$ up to
    a final index $n$, can be written as follows:


    ```

    $\prod_{i=m}^{n} f(i) = f(m) \cdot f(m+1) \cdot \dots \cdot f(n-1) \cdot f(n),
    \quad (3.13)$

    ```


    where by convention the product is $1$ if $m>n$. For example, the factorial function
    can be expressed as:


    ```

    $\prod_{i=1}^{n} i = 1 \cdot 2 \cdot \dots \cdot (n-1) \cdot n$,

    ```


    where for mathematical convenience $0!=1$.


    Similarly to sums, in products multiplicative terms that do not depend on the
    index variable can also be pulled out of the product. However, if the product
    involves $n$ terms, they have to be raised to the power of $n$:


    ```

    $\prod_{i=1}^{n} kf(i) = k^n \prod_{i=1}^{n} f(i)$.

    ```


    In addition, the product of a sum is not the sum of the products in general:


    ```

    $\prod_{i=m}^{n} (f_1(i) + f_2(i)) \neq \prod_{i=m}^{n} f_1(i) + \prod_{i=m}^{n}
    f_2(i)$.

    ```'
