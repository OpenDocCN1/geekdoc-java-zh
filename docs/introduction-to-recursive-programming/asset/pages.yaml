    # 3.3.1. Master theorem


    The master theorem is a result that can be used as a quick recipe for determining
    the computational complexity of algorithms based on the divide and conquer design
    strategy. In particular, it can be applied to recurrence relations of the following
    form:


    ```

    T(n) = { c if n = 1, \ aT(n/b) + f(n) if n > 1,

    ```


    When a ≥ 1, b > 1, c ≥ 0, and f is an asymptotically positive function. Thus,
    algorithms solve a problem whose size is equal to the original divided by b. In
    addition, the further processing or combination of the subsolutions requires f(n)
    operations. Depending on the relative contribution of the terms aT(n/b) and f(n)
    to the algorithm''s runtime cost, the master theorem states, in its most general
    definition, that it is possible to determine an asymptotic tight bound for T in
    the following cases:'
