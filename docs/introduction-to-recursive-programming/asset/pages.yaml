    If the symbol $E$ represents an expression, and $T$ a term, the production rules
    for an expression can be described by using the following:


    ```

    $E \longrightarrow T \mid E+T \mid E-T,\quad(9.9)$

    ```


    where the plus and minus signs are tokens (binary operators) from the input list,
    and the vertical bars (|) are used as “or,” and used for notational convenience,
