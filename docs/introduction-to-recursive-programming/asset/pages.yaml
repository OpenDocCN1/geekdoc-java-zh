    # 2.3 BASE CASES


    Base cases are instances of problems that can be solved without recursion; or
    more precisely, without carrying out recursive calls. The most common type of
    base case is associated with the smallest instances of a problem, for which the
    result can be determined trivially, and sometimes may not even require carrying
    out computations. For instance, the value of the first and second Fibonacci numbers
    is simply 1, which follows directly from the definition. The “sum” of the digits
