    # 5.8 EUCLID''S ALGORITHM


    Of the first algorithms developed throughout history is known as Euclid''s algorithm,
    named after the ancient Greek mathematician Euclid, who first described it in
    his Elements (c. 300 BC). Its purpose is to finding the greatest common divisor
    (gcd) of two nonnegative integers $m$ and $n$ (where both cannot be zero), which
    is the largest positive integer $k$ that divides both $m$ and $n$ without a remainder
    (i.e., $m/k$ and $n/k$ are integers). For example, the greatest common divisor
    of 20 and 24 is 4. It can also be understood as the product of the common prime
    factors of $m$ and $n$. For $m = 20 = 2 \cdot 2 \cdot 5$, and $n = 24 = 2 \cdot
    2 \cdot 3$, the product of common factors is $2 \cdot 2 = 4$.


    There are several versions of the method. The original one corresponds to the
    following function:


    ```

    $gcd_1(m, n) = \begin{cases} m & \text{if } m = 0, \ gcd_1(n, m) & \text{if }
    m > n, \ gcd_1(m, n-m) & \text{otherwise}, \end{cases} \quad (5.2)$

    ```'
