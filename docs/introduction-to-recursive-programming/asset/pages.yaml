    \ $b$ in order to obtain $b^n$. Together with the base case, the function can\
    \ be implemented as shown in Listing 4.1.\n\nIt is an example of linear recursion\
    \ since there is only one call in the recursive case, and the recursive call is\
    \ not the last that the algorithm performs in the recursive case. Even though\
    \ the function call is the last element in the expression (in line 5), the method\
    \ first evaluates it, and then it processes it, multiplying the result times $b$.\
    \ Thus, the function is not tail-recursive. It is also important to note that\
