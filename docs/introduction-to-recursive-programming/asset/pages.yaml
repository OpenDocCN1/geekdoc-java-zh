    # 10.3.4 Maximum recursion depth and stack overflow errors


    When executing programs have a limit on the amount of memory they can use, which
    depends on a number of factors including the programming language, machine architecture,
    or multi-threading. In particular, there is a limit on the amount of data or number
    of stack frames that we can store in the program stack. For instance, Python implementations
    allow 1000 frames (i.e., nested recursive calls) to be stored in the stack by
    default. The concrete amount, say $M$, can be obtained by invoking `sys.getrecursionlimit()`.
    Thus, the maximum height of a recursion tree is $M$. A program that attempts to
    perform more recursive calls will crash, generating a message similar to "RecursionError:
    maximum recursion depth exceeded."


    This type of runtime error is also called a "stack overflow." In other languages,
    instead of fixing the maximum number of recursions, the total memory available
    for the program stack and the "heap" (a zone of memory that stores dynamically
    allocated data) is limited. As the program and stack grow in size, the program
    can run out of available memory to use, leading to a runtime error. Thus, if the
    heap is large, a stack overflow could occur even with a small number of recursive
    calls. In this regard, programmers should try to limit the size of each stack
    frame, avoiding parameters passed by value or local variables that store large
    amounts of data (for instance, programmers should consider dynamically allocated
    memory that allows them to work with pointer references, as in Figure 10.15).


    The common cause of a stack overflow error is an infinite recursion, originated
    by recursive code that does not terminate properly at a base case, as method `factorial_no_base_case`
    in Listing 2.1. However, even for properly coded algorithms, a limit on the number
    of stack frames has important implications regarding the applicability of recursion,
    especially when the recursion tree has a linear structure. For example, linear-recursive
