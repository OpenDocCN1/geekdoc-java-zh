    # 7.2 TOWERS OF HANOI


    The towers of Hanoi puzzle is one of the most popular problems used to illustrate
    recursion. Although it can be solved using relatively simple iterative algorithms,
    it also allows a concise and elegant recursive solution that emphasizes the role
    of problem decomposition and induction in recursion, as well as showing its potential
    for problem solving.'
