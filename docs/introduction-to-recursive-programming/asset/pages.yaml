    This section describes a backtracking algorithm for finding a path through a maze,
    such as the one illustrated in Figure 12.10(a). A maze is defined as a rectangular
    array of cells that can be empty or constitute a wall. We will code it using a
    list of lists (of characters), denoted as M, where the first list will contain
    the cells of the top row of the maze (from left to right), the second list will
    represent the row below the first one, and so on. In order to define a maze a
    user can write each row as a line of characters, separated by a space character,
    as shown in (b). Specifically, an ''E'' indicates an empty cell, which can be
    traversed by a path, and a ''W'' indicates a wall. It is convenient to enter the
    array of characters in a file that can be loaded automatically when running the
