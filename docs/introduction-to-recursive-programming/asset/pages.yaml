    # 11.3 NESTED RECURSION


    Nested recursion is a rare type of recursion that appears when the argument of
    a recursive call involves tail-recursive procedures, in many nested-recursive
    functions (in particular, all those presented in this book) a recursive call is
    the last action carried out by the algorithm. However, nested-recursive methods
    must call themselves several times in some recursive case. Thus, they cannot be
    tail-recursive. This section describes two well-known methods based on nested
    recursion, and presents a problem that can be solved through it. Section 11.4
    will provide additional examples.


    # 11.3.1 The Ackermann function


    One of the most popular examples of nested recursion is the Ackermann function,
    defined as follows:


