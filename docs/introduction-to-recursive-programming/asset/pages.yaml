    # 3.2.2 Asymptotic notation


    An important detail about the orders mentioned so far is the lack of constant
    multiplicative terms. Similarly to lower-order terms, these are omitted since
    they are less relevant than the actual order of growth when determining the computational
    efficiency for large inputs. Moreover, it is not worth the effort to specify the
    efficiency of an algorithm with exact precision, since its runtime depends on
    numerous factors that include the computer''s hardware, the programming language,
    the compiler or interpreter, and many others. Thus, it is sufficient to assume
    in practice that it simply takes a constant amount of time to execute a basic
    instruction, where its value is irrelevant.


    The theoretical analysis of algorithms and problems relies on a type of notation
    called “asymptotic notation,” which allows us to discard the lower-order terms
    and multiplicative constants when dealing with arbitrarily large inputs. In particular,
    asymptotic notation provides definitions of sets that we can use to specify “asymptotic
    bounds.”


    Big-O notation defines the following set:


    ```

    $O(g(n)) = {f(n) : \exists c > 0 \text{ and } n_0 > 0 \le f(n) \leq c \cdot g(n),
    \forall n \geq n_0\}.$

    ```


    If a function $f(n)$ belongs to this, then $g(n)$ will be an asymptotic upper
    bound for $f(n)$. This means that $g(n)$ will be greater than $f(n)$, but the
    definition only requires this to be true on an interval from some $n_0>0$ until
    infinity, in addition we can multiply $g(n)$ times a sufficiently large positive
    constant $c$. Figure 3.7(a) illustrates the idea graphically. If $g(n)$ is an
    upper bound for $f(n)$ then it must be possible to find a positive constant $c$
    such that $cg(n) \geq f(n)$, but'
