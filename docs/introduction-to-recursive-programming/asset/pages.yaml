    arises since invoking $B$ can produce calls to $B$ (on simpler instances of the
    problem). These functions can also be used to generate Fibonacci numbers. In particular,
    $F(n) = B(n) + A(n)$. Mutual recursion will be covered in Chapter 9.


    # 1.6.5 Nested recursion


    Nested recursion occurs when an argument of a recursive function is defined through
    another recursive call. Consider the following function:


    ```

    $f(n,s) = \begin{cases} 1+s & \text{if } n=1\text{ or } n=2, \ f(n-1,s)+f(n-2,0)
    & \text{if } n>2. \end{cases} \quad (1.19)$

    ```


    The second parameter of the recursive call is an expression that involves yet
    another recursive call. In this case, Fibonacci numbers can be recovered through
    $F(n)=f(n,0)$. This type of recursion is rare, but appears in some problems and
    contexts related to tail recursion. Finally, an overview of nested recursion is
    covered in Chapter 11.


