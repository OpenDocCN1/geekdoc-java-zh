    # 1.4 INDUCTION


    Induction is another concept that plays a fundamental role when designing recursive
    code. The term has different meanings depending on the field and topic where it
    is used. In the context of recursive programming it is related to mathematical
    proofs by induction. The key idea is that programmers must assume that the recursive
    code they are trying to implement already works for simpler and smaller problems,
    even if they have not yet written a line of code! This notion is also referred
    to as the recursive “leap of faith.” This section reviews these crucial concepts.


    # 1.4.1 Mathematical proofs by induction


    In mathematics, proofs by induction constitute an important tool for showing that
    some statement is true. The simplest proofs involve formulas that depend on some
    positive (or nonnegative) integer n. In these cases, the proofs verify that the
    formulas are indeed correct for every possible value of n. The approach involves
    two steps:


    +   a) Base case (basis). Verify that the formula is valid for the smallest value
    of n, say n₀.'
