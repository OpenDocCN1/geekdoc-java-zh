  md: '# CHAPTER 9


    # Mutual Recursion


    > Alone we can do little, together we can do so much.

    — Helen Keller


    A method that invokes itself directly within its body is recursive, by definition.
    However, a recursive method does not necessarily have to call itself. It may call
    another one that in turn calls back. Thus, invoking the method can provide multiple
    calls to it. This type of recursion is mutual or indirect.


    In general, several methods are mutually recursive when they invoke themselves
    in a cyclical order. For instance, a set of methods $\{f_1, f_2, \dots, f_n\}$.
    If $f_1$ calls $f_2$, calls $f_3$, and finally $f_n$ calls $f_1$, then they necessarily
    call each other in a strict cyclical sequence. In addition, they do not necessarily
    call each other, as illustrated in Figure 9.1, where the arrows indicate method
    calls (e.g., $f_8$ calls $f_1$ and $f_4$). In the example, only $f_3$ invokes
    itself directly, but all of the methods are mutually recursive.


    When applying mutual recursion the first step consists of breaking up a problem
    into different problems (not simply subproblems). Afterwards, the recursive solutions
    to these problems are designed by relying on the solutions to their subproblems.
    The key observation when using mutual recursion is that when solving some problem
    $P$ we will use recursive solutions to subproblems that are not necessarily instances
    of $P$. Naturally, decomposing the original problem into different problems requires
    more work. However, once these problems are defined, the recursive design process
    is analogous to working with a single method. In other words, we will apply problem
    decomposition and induction as


    253'
