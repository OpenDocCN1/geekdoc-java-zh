    — Philip II of Macedon


    THE advantages of recursion over iteration, such as code clarity or avoiding managing
    a stack explicitly (see Section 10.3.5), are mainly due to the possibility of
    using multiple recursion. Methods based on this type of recursion invoke themselves
    several times in at least one recursive case. Therefore, these algorithms solve
    more than one simpler self-similar problem, and must combine, extend, and/or modify
    their results in order to obtain the solution to the original problem.


    The book devotes three chapters to multiple recursion, and contains examples throughout
    it as well. In this chapter we will cover an important class of algorithms based
    on multiple recursion that decompose problems by dividing their size by some constant.
    These algorithms are said to follow the “divide and conquer” approach, which is
    one of the most important algorithm design patterns. It can be viewed as a general
    solving strategy that consists of breaking up a problem into several self-similar
    subproblems whose size is a fraction of the original problem''s size. The approach
    is therefore closely related to recursion (iterative algorithms can also follow
    the divide and conquer strategy), since it relies on recursive decomposition (see
    Figure 1.4). The function in Listing 1.2 and the third method of Listing 1.5 constitute
    examples of this algorithm design approach.


