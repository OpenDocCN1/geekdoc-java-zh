  md: '# Linear Recursion II: Tail Recursion


    > You are only as beautiful as your last action. Stephen Richards


    TAIL recursion, also known as “final” recursion, is a form of recursion in the
    sense that the recursive cases only invoke the method once. However, in tail recursion
    a recursive call is the last action performed by the method. For example, the
    function in (1.15) is tail-recursive since it does not manipulate the result of
    the function call in the recursive case. In addition, functions may require more
    parameters in order to store intermediate results that will be used in the base
    cases for providing the final output. The tail-recursive methods seen so far include
    Listings 2.3, 2.5, and 2.6.


    In the previous chapter all of the methods were based on decreasing the size of
    the problem by one or two units, except for the ones in Section 4.1.1.2. In contrast,
    this chapter will present more algorithms that divide the size of the problem
    by two. In these cases the recursive calls will solve a single problem of half
    the size of the original’s, since the methods only invoke themselves. Some authors
    refer to this strategy as “divide and conquer”. However, we will only use this
    term when the algorithms solve several subproblems whose size is a fraction of
    that of the original’s. These algorithms will be covered in Chapter 6.


    Finally, tail recursion is also special due to its relationship with iteration.
    Chapter 11 will analyze this connection.'
