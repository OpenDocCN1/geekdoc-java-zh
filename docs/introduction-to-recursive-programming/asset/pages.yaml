  md: '# Multiple Recursion III: Backtracking


    > He who would search for pearls dive below.

    John Dryden


    BACKTRACKING is one of the most important algorithm design paradigms. It can be
    regarded as an “intelligent” brute-force strategy that performs exhaustive searches
    for solutions to constraint satisfaction and discrete optimization problems. The
    approach can be used to solve numerous puzzles and problems, including the eight-queens
    problem, finding paths through mazes, the sudoku puzzle, the 0-1 knapsack optimization
    problem, and many more.


    Backtracking methods generally combine recursion and iteration, and are not usually
    designed by strictly thinking about problem decomposition and induction. Thus,
    they appear to be complex to students who study the material for the first time.
    Frankly, backtracking algorithms often share a similar structure, which can be
    exploited in order to design their design. This structure is captured in what
    we know as “backtracking templates,” which vary depending on coding styles and
    programming languages. In this book the methods share a particular structure where
    they receive a relatively large number of parameters, and barely rely on additional
    methods. However, the reader should be aware that there are other possibilities.
    In any case, students can master backtracking with relative ease by studying examples,
    and by applying very similar algorithms to different problems.'
