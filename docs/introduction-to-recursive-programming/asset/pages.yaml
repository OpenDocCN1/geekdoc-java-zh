    The partial sum of a geometric series can be obtained through the following formula:


    ```

    $$\sum_{i=m}^{n} s_i = \sum_{i=m}^{n} r^i. s_0 = s_0 \sum_{i=m}^{n} r^i = s_0
    \frac{r^m-r^{n+1}}{1-r}, \quad (3.8)$

    ```


    for $r \neq 1$. In practice the last equality can be derived easily through the
    following approach, let $S$ represent the value of the sum. Subsequently, create
    another sum by multiplying $S$ by $r$. Finally, subtract both (where terms cancel
    out), and solve for $S$. The process (ignoring $s_0$) can be illustrated as follows:


    ```

    $S = r^m + r^{m+1} + r^{m+2} + \dots + r^{n-1} + r^n$\nrS = r^{m+1} + r^{m+2}
    + \dots + r^n + r^{n+1}\nS-rS = r^m - r^{n+1}$

    ```


    Therefore, solving for $S$ yields:


    ```

    $$\sum_{i=m}^{n} r^i = \frac{r^m-r^{n+1}}{1-r} \frac{r^{n+1}-r^m}{1-r}, \quad
    (3.9)$

    ```


    Finally, a geometric series converges to a constant value if $|r| < 1$:


    ```

    $$\sum_{i=0}^{\infty} ar^i = a \frac{1}{1-r}$

    ```


    # 3.1.4.4 Differentiation


    Another useful sum is:


    ```

    $$\sum_{i=1}^{n} iv^i = 1r^1 + 2r^2 + 3r^3 + \dots + nr^n, \quad (3.10)$

    ```


    which can be interpreted to derive a formula for the sum as. Firstly, consider
    a general partial sum of a geometric series and its simplified formula:


    ```

    $$\T = 1 + r + r^2 + \dots + r^n = \frac{r^{n+1}-1}{r-1}$

    ```


    We then differentiate with respect to $r$:


    ```

    $$\frac{dT}{dr} = 1 + 2r + 3r^2 + \dots + nr^{n-1} = \frac{nr^{n+1}-(n+1)r^n}{(r-1)^2},
    \quad (3.11)$

    ```'
