    # 2.4 PROBLEM DECOMPOSITION


    The next step in the recursive design methodology consists of identifying self-similar
    problems smaller than the original (and possibly different problems), as illustrated
    in Figure 1.4. These smaller subproblems will be used in the fourth step of the
    template in order to establish the recursive cases. The process involves decreasing
    the size of the problem in order to consider smaller instances that are closer
    to the base cases. Therefore, it is essential to correctly establish the size
    of the problem and its base cases before proceeding with this step.


    Many recursive solutions reduce the size of a problem by decreasing a single unit,
    or by diving by two, as shown graphically in Figures 1.5 and 1.6. Representing
    problems through diagrams is useful and highly recommended since it may help us
    recognize self-similar problems (i.e., recursion) visually, and can also facilitate
    recursive cases. Figure 2.2 shows additional diagrams that illustrate the decomposition
    of the sum of the first positive integers when the problem size is decreased by
    a unit. Firstly, since the recursive method is a mathematical function that can
