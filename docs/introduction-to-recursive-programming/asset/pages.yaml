    parameters that indicate the cells where a path enters and exits the maze. In
    these figure the cells are the top-left and bottom-right ones, respectively. Thus,
    the initial cell in the maze is M[0][0].


    The backtracking algorithm carries out an exhaustive search for finding paths
    that start at the initial cell and arrive at the final cell. Having reached some
    particular cell in an intermediate step, the algorithm needs to analyze every
