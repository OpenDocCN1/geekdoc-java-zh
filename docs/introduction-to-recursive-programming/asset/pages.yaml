  md: '# Tail Recursion Revisited and Nested Recursion


    > One should always look for a possible alternative, and provide against it. —
    Sherlock Holmes — Arthur Conan Doyle


    TAIL recursion is special due to its relationship with iteration. Firstly, it
    is fairly straightforward to transform tail-recursive algorithms into analogous
    iterative versions that are not more efficient, but will not be liable to stack
    overflow errors. Thus, for some programmers, tail recursion is actually considered
    a bad practice. Furthermore, it is not uncommon to encounter tail-recursive algorithms
    that have been designed by using an imperative approach that is closer to iterative
    thinking than problem decomposition and induction. In these cases iterative versions
    are clearly superior. This chapter will examine this connection between tail-recursion
    and iteration. In addition, it will provide a brief introduction to nested recursion
    (see (1.19)), and a strategy for deriving simple tail-recursive algorithms, often
    analogous to iterative methods, but by using a declarative approach.


    # 11.1 TAIL RECURSION VS. ITERATION


    Iterative programs can be converted to recursive ones, and vice versa. Moreover,
    the relationship between iteration and tail recursion is particularly apparent.
    This section analyzes this connection, and explains why iteration is usually preferred
    over tail recursion.'
