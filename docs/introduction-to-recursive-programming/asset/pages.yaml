    # 3.3.2 General method for solving difference equations


    The expansion method is effective at solving recurrence relations in which the
    recursive function appears only once in the recursive definitions. This section
    describes a powerful approach, denoted in this book as the “general method for
    difference equations,” which allows us to solve recurrences that may “call” themselves
    several times. In particular, the method can be used to solve recurrences of the
    following form:


    ```

    $T(n) = -a_1 T(n-1) - \dots - a_k T(n-k) + P_{d_1}^i(n)b_1^{i} + \dots + P_{d_k}^i(n)b_k^{i},
    (3.33)$

    ```


    > “T difference” terms polynomial and exponential terms


    where $a_i$ and $b_i$ are constants, and $P_{d_i}^i(n)$ are polynomials of $(n)$
    of degree $d_i$. Terms $T$ may appear several times on the right-hand side of
    the definition. Moreover, their arguments are necessarily $n$ minus some integer
    constant. Thus, these recurrence relations are also known as “difference equations.”
    In this book we will call these terms involving $T$ the “T difference” terms,
    to emphasize that the arguments cannot form the form $n/b$, where $b$ is a constant
    (if these terms appear it is necessary to transform the recurrence). In addition,
    the right-hand side of the definition may contain several terms that consist of
    a polynomial times a power of the input $n$ (i.e., an exponential).


    Instead of providing a general procedure directly, the following subsections will
    explain the method progressively, starting with simple recurrences, and introducing
    new elements as they grow in complexity.'
