    # 12.6 THE SUDOKU PUZZLE


    The sudoku puzzle is a constraint satisfaction problem where the goal is to fill
    a 9 x 9 grid with the digits from 1 to 9 (they can be any different symbols, since
    their numerical values are irrelevant). A particular digit can appear only once
    in each row, each column, and each of 3 x 3 non-overlapping subgrids, also called
    boxes, which cover the 9 x 9 grid. Figure 12.13 shows an instance of the problem,
    which consists of a partially filled grid with initial digits. The problem is
    well-posed when the puzzle has a unique solution (the initial grid must contain
    at least 17 digits).


