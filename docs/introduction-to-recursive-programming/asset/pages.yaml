    It can be shown that the minimum number of moves required to solve the problem
    for $n$ disks is $2^n - 1$. For $n = 4$, the problem can be solved through the
    15 moves illustrated in Figure 7.5. Although the number of moves increases exponentially
    as $n$ grows, the difficulty of the problem is essentially the same as the case
    for $n = 2$ if we use recursion. The most interesting configurations of disks
    in the solution for $n = 4$ are the ones after 7 and 8. Observe that the seventh
    move have $n - 1$ disks on the auxiliary rod. This situation is necessary in order
    to move the largest disk onto the destination rod. Thus, the first seven steps
    consist of solving the puzzle for $n - 1 = 3$ disks, where the goal consists of
    moving them from the origin to the auxiliary rod, with the help of the destination
    rod. In other words, the roles of the destination and auxiliary rods are switched.
    The eighth move is just a basic operation that moves the largest disk. After it
    is placed on the destination rod, there is a stack of $n - 1$ disks on the auxiliary
    rod that needs to be moved onto the destination rod. Then the remaining steps
    consist of solving another problem of $n - 1$, in in this case the roles of the
    auxiliary and origin rods are switched. This reasoning based on problem decomposition
    and induction is illustrated in Figure 7.6. In particular, the decomposition considers
    two problems of size $n - 1$, where the solution consists of three operations.
    The first and third steps solve one of these subproblems, the second operation
