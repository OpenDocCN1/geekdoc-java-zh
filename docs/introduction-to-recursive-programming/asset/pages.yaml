    # 6.7 THE SKYLINE PROBLEM


    The skyline problem consists of finding the outline of a set of rectangular buildings
    against the sky. Figure 6.7 explains the idea. The input to the problem is a list
    of n \ge 1 rectangles that represent buildings, as shown in (a). The bottom side
    of the rectangles is always located at level 0. Thus, each building can be specified
    using only three parameters. In particular, we will use tuples of the form $(x_1,
    x_2, h)$, where $x_1$ marks the location of left of the building, $x_2$ indicates
    the right side, and $h$ contains its height. $x_1 < x_2$, and $h > 0$. The buildings
    in the example are: {(1.7,7), (18,20,7), (2,9,5), (17,19,2), (12,24,3), (3,8,8),
    (11,13,5), (25,21,6)}. Note that it is not necessary to sort them in any way (e.g.,
    according to the value of $x_1$).


    The skyline consists of a curve whose height at any point on the X axis is the
    maximum height of the buildings at such point, illustrated through the thick dark
    segments in (b). Since the buildings can be specified by a set of coordinates
    on the plane $(x, h)$ that mark the location $x$ when its height changes to $h$,
    as illustrated in (c). The output to the problem will be a list of these coordinates,
    which can be coded as tuples, and will appear sorted in ascending order. The output
    for the example is {(1,7), (3,8), (8,5), (9,0), (11,5), (13,3), (15,6), (18,7),
    (20,6), (21,3), (24,0)}.


    The size of the problem is the number of buildings $n$. For the base case, the
    smallest instance occurs when there is only one building. If it is specified through
    the tuple $(x_1, x_2, h)$ then the output is $\{(x_1,h), (x_2,0)]$, as shown in
    Figure 6.8.


    This problem can be decomposed by reducing the size of the problem by a unit.
    However, this leads to an algorithm runtime is $O(n^2)$ in the worst case. Instead,
    we will examine a divide and conquer approach'
