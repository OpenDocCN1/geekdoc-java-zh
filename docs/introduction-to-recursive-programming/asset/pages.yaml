  md: '# Further reading


    MONOGRAPHS IN RECURSION


    This book has provided a broad coverage of recursion, containing essential topics
    for designing recursive algorithms. However, the reader can find additional aspects,
    examples, and implementation details in other references. The following book:


    +   * Jeffrey Soden Rohl. *Recursion Via Pascal*, Cambridge Computer Science Texts.
    Cambridge University Press, 1st edition, August 1984


    contains numerous examples in Pascal of recursion on data structures (linked lists,
    trees, or graphs) implemented through pointers. In contrast, the current book
    avoids pointers since they are not explicitly in Python. The suggested reference
    includes backtracking algorithms for generating additional combinatorial entities
    such as combinations, compositions, and partitions. Lastly, it contains a chapter
    on recursion elimination, which offers low-level explanations on how to transform
    recursive programs into equivalent iterative versions.


    Another book that focuses entirely on recursion is:


    +   * Eric S. Roberts. *Thinking Recursively*. Wiley, 1st edition, January 1986,
    which contains examples in Pascal, and a more recent edition:


    +   * Eric S. Roberts. *Thinking Recursively with Java*. Wiley, 1st edition, February
    2006,


    where the code is in Java. The book contains a chapter on recursive data types,
    and another on the implementation of recursion from a low-level point of view.


    Java programmers can also benefit from:


    +   * Irena Pevack. *Practicing Recursion in Java*. CreateSpace Independent Publishing
    Platform, 1st edition, April 2016,


    which contains examples related to linked lists, linked trees, and graphical problems.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# DESIGN AND ANALYSIS OF ALGORITHMS


    The current book contains problems that can be solved by applying algorithm design
    techniques such as divide and conquer, or backtracking. There are numerous excellent
    texts that analyze more problems, describe other design techniques like greedy
    algorithms or dynamic programming, or rely on advanced data structures in order
    to construct efficient algorithms. The following list of books is only a small
    subset of the broad literature on algorithm design (and analysis)


    +   - Thomas H. Cormen, Charles E. Leiserson, Ronald L. Rivest, and Clifford Stein.
    Introduction to Algorithms. The MIT Press, 3rd edition, 2009.

    - Robert Sedgewwick and Kevin Wayne. Algorithms. Addison-Wesley Professional,
    4th edition, 2011.

    - Anany V. Levin. Introduction to the Design and Analysis of Algorithms. Addison-Wesley
    Longman Publishing Co., Inc., Boston, MA, USA, 3rd edition, 2012.

    - Michael T. Goodrich, Robert Tamassia, and Michael H. Goldwasser. Data Structures
    and Algorithms in Python. Wiley Publishing, 1st edition, 2013.


    More ambitious readers explore texts aimed at training for programming competitions
    (e.g., the ACM International Collegiate Programming Contest, or the International
    Olympiad in Informatics). Wellknown references include:


    +   - Steven S. Skiena and Miguel Revilla. Programming Challenges: The Programming
    Contest Training Manual. Springer-Verlag New York, Inc., Secaucus, NJ, USA, 2003.

    - Steven S. Skiena. The Algorithm Design Manual. Springer Publishing Company,
    Incorporated, 2nd edition, 2008.


    Other textbooks focus exclusively on the analysis of algorithms, as:


    +   - Jeffrey J. McConnell. Analysis of Algorithms: An Active Learning Approach.
    Jones and Bartlett Publishers, Inc., USA, 1st edition, 2001",


    Among these,


    +   - Robert Sedgewwick and Philippe Flajolet. An Introduction to the Analysis
    of Algorithms. Addison-Wesley Professional, 2nd edition, 2013


    is considerably more advanced, and is used by the author in a massive open online
    course offered by coursera.org. Similarly, this and other online platforms offer
    excellent courses on algorithms.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# FUNCTIONAL PROGRAMMING


    Recursion is omnipresent in functional programming. Thus, programmers should have
    mastered the contents of this book in order to be competent in this programming
    paradigm. Popular references include:


    +   - Harold Abelson and Gerald J. Sussman. Structure and Interpretation of Computer
    Programs. MIT Press, Cambridge, MA, USA, 2nd edition, 1996.

    - Richard Bird. Introduction to Functional Programming Using Haskell. Prentice
    Hall Europe, April 1998.

    - Martin Odersky, Lex Spoon, and Bill Venners. Programming in Scala: A Comprehensive
    Step-by-Step Guide. Artima Information, USA, 1st edition, 2008.


    The book by Odersky et al. is used in a highly recommended course offered at coursera.org.


    # PYTHON


    It is assumed that the reader of this book has some programming experience. The
    following popular texts will be useful to readers interested in learning more
    Python features, looking up implementation details, or developing alternative
    and/or more efficient variants of the examples covered throughout the book:


    +   - Mark Pilgrim. Dive Into Python 3. Apress, Berkely, CA, USA, 2009.

    - Mark Summerfield. Programming in Python 3: A Complete Introduction to the Python
    Language. Addison-Wesley Publishing, 2nd edition, 2009.

    - Mark Lutz. Learning Python. O''Reilly, 5th edition, 2013.


    # RESEARCH IN TEACHING AND LEARNING RECURSION


    The current book incorporates several ideas from research in teaching and learning
    recursion. In particular, it focuses on the declarative abstract level of problem
    decomposition and induction, instead of focusing on a computational model (e.g.,
    a trace model) or iterative/imperative thinking. This is suggested, for example,
    in:


    +   - D. Ginat and E. Shifroni. Teaching recursion in a procedural environment
    – how much should we emphasize the computing model? SIGCSE Bull, 31(1):127–139,
    1991.

    - R. Sooriamurthi. Problems in comprehending recursion and suggested solutions.
    SIGCSE Bull, 33(3):25–28, 2001.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# 406 ■ Further reading


    The diagrams and methodology (the template is similar to the one in Sooramurthi’s
    paper) used in Chapter 2 have been introduced precisely in order to focus on declarative
    thinking. In addition, the structure of the book also reflects this goal. Elements
    such as tracing, recursion trees, the program stack, or the relationship between
    iteration and tail recursion are not introduced until Chapters 10 and 11.


    The book also includes examples from articles where I have addressed teaching
    mutual recursion, and tail (nested) recursion through functionization:


    +   * M. Rubio-Sánchez, J. Urquiza-Fuentes, and C. Pareja-Flores. A gentle introduction
    to mutual recursion. SIGCSE Bull., 40(3):235–239, 2008.

    * Manuel Rubio-Sánchez. Tail recursive programming by applying generalization.
    In Proceedings of the Fifteenth Annual Conference on Innovation and Technology
    in Computer Science Education, ITICSE ’10, pages 98–102. ACM.


    Finally, there is rich literature on teaching and learning recursion. The following
    recent surveys contain hundreds of references related to the topic:


    +   * Christian Rinderknecht. A survey on teaching and learning recursive programming.
    Informatics in Education, 13(1):87–119, 2014.

    * Renée McCauley, Scott Grissom, Sue Fitzgerald, and Laurie Murphy. Teaching and
    learning recursive programming: a review of the research literature. Computer
    Science Education, 25(1):37–66, 2015.'
  merge: -1
