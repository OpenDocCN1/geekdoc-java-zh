    call. Instead, if the result has not been computed, the algorithm proceeds as
    usual by invoking the recursive method.


    One of the simplest examples that illustrates the approach involves the algorithm
    related to the fibonacci function where F(n)=F(n-1)+F(n-2). Consider the associated
    recursive tree in Figure 10.21, for F(6). In (a) there are two identical subtrees
    to fibonacci(4) (i.e., the root node corresponds to n=4), which correspond to
    two overlapping subproblems. Naturally, they perform the same calculations and
    return the same output. Therefore, an algorithm could store the result in a lookup
    table first fibonacci(4) terminates, and it afterwards in order to avoid calling
    the method again, and repeating the same redundant computations. This strategy
    allows us to omit all the calls related to the recursion tree''s right subtree,
    as shown in (b). Moreover, we can continue to prune the recursion tree by noticing
    more overlapping subproblems. In the remaining tree there are again two identical
    subtrees related to n=3 (observe that there are three of these subsets in the
    entire recursive tree). Thus, we can store the result of fibonacci(3) the first
    time it is calculated, and use the value when the algorithm needs it in future.
    Applying this idea in general leads to an algorithm whose recursive tree is based
    in (d), which contains n nodes. The final algorithm will run in linear time, at
    the expense of using more memory in order to store the n intermediate results
    associated with F(n), for n=1,...,n. The increase in speed is therefore remarkable,
    since the original function runs in exponential time.


