    Figure 7.4 Solution to the towers of Hanoi puzzle for $n = 2$ disks.


    The game consists of three vertical rods and $n$ disks that can slide onto any
    rod, as shown in Figure 7.3 for $n = 7$ disks. The disks have different radii,
    where we can assume that the radius of disk $i$ is precisely $i$. In the initial
    configuration, the $n$ disks are stacked on one of the rods in decreasing order
    (of index or radius), as shown in (a). The goal is to move the entire tower of
    stacked disks from the initial (origin) rod onto a final (destination) rod, with
    help of a third (auxiliary) rod, by obeying the following rules:


    +   - Only one disk can be moved at a time.

    - Each move takes the upper disk staked on one of the rods, and places it on top
    of a stack in another rod.

    - A larger disk cannot be placed on top of a smaller one on the same rod.


    Figure 7.3(b) shows a configuration of disks in an intermediate step performing
    a few moves. Finally, the problem is solved when all of the disks appear on the
    destination rod, as shown in (c).


    The size of the problem is determined by the number of disks. The base case occurs
    when $n = 1$, where the solution is naturally trivial,'
