    # 3.1.4.1 Basic properties of sums


    The following basic properties are useful for simplifying and working with sums,
    and can be derived easily from the addition and multiplication properties of the
    type of elements to be added. Firstly,


    ```

    $$\sum_{i=1}^{n} 1 = 1 + 1 + \dots + 1 + 1 = n.$$

    $n$ times

    ```


    Note that $f(i)$ is a constant (1) that does not depend on the index variable
    $i$. Similarly,


    ```

    $$\sum_{i=1}^{n} k = k + k + \dots + k + k = kn.$$

    $n$ times

    ```


    The previous example also illustrates that when a multiplicative term in $f$ does
    not depend on the index variable it can be “pulled out” of the sum:


    ```

    $$\sum_{i=1}^{n} \sum_{j=1}^{n} (k \cdot 1) = \sum_{i=1}^{n} k \cdot \sum_{j=1}^{n}
    1 = k \sum_{i=1}^{n} 1 = kn.$ (3.5)$

    ```


    In this case the constant $k$ which is considered by 1, does not depend on $i$,
    can be pulled out of the sum, where it appears multiply (regarding notation, (3.5)
    shows that it is not necessary to use parenthesis inside a sum if $f$ does not
    contain additive terms, or if some terms multiply a sum). In general, the property
    can be expressed as:


    ```

    $$\sum_{i=m}^{n} kf(i) = k \sum_{i=m}^{n} f(i).$$

    ```


    which follows from the distributive law of multiplication over addition, where
    the expression has been simplified by extracting the common factor $k$ from all
    of the terms being added. Naturally, the factor $k$ can be the product of several
    terms that do not depend on the index, and may contain the upper and lower limits,
    as shown in this example:


    ```

    $$\sum_{i=m}^{n} am^2i^3 = am^2 \sum_{i=m}^{n} i^3.$

    ```


    where $a$ is some constant. Finally, where the function $f$ contains several additive
    terms can be broken up into simpler individual sums. Formally,


    ```

    $$\sum_{i=m}^{n} (f_1(i) + f_2(i)) = \sum_{i=m}^{n} f_1(i) + \sum_{i=m}^{n} f_2(i).$$

    ```'
