    # 3.2 COMPUTATIONAL TIME COMPLEXITY


    The computational time complexity of an algorithm is a theoretical measure of
    how much, or how many operations, it needs to solve a problem (Listing 3.1 Python’s
    time module). It is determined by analyzing a function, say $T$, of the input
    size that quantifies this number of operations for a particular instance. In computer
    science the efficiency of algorithms is generally studied by contemplating $T$
    behaves when the size of the problem is very large. Moreover, the key factor is
    the rate at which $T$ grows as the input size tends to infinity. The following
    subsections explain these ideas and the mathematical notation typically used to
    characterize computational time complexity. Lastly, while the size of a problem
    may depend on several factors, in this introductory book we will analyze the computational
    time complexity of algorithms that solve problems whose size is determined by
    only one factor. Thus, the runtime cost of the covered algorithms will be determined
    by a function $T(n)$ of one parameter, where $n$ usually represents the size of
    the problem.'
