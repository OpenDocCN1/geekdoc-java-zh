    It follows from the result that $2S(n) = n(n+1)$, since there are $n$ terms (each
    equal to $n+1$) on the right-hand side of the identity. Finally, dividing by 2
    yields:


    $S(n) = \sum_{i=1}^{n} i = \frac{n(n+1)}{2}$


    The idea can also be understood through the graphical mnemonic in Figure 3.1,
    where $S(n)$ is the area of a triangular pyramid of square of $1 \times 1$ blocks.
    Two of these triangular structures can be joined together to form a rectangle
    of area $n \times (n+1)$. Therefore, it follows that the area ($S(n)$) of each
    triangular structure is $n(n+1)/2$.


    A similar formula can be obtained for the general partial sum of $n$ terms of
    an arithmetic sequence $s_i = s_{i-1} + d$, for some initial $s_0$:


    $sum_{i=0}^{n-1} s_i = \frac{n}{2}(S_0 + s_{n-1})$


    which is the average between the first and last elements of the sequence, multiplied
    by the number of elements in the sequence.


    # 3.1.4.3 Geometric series


    A geometric series is the sum of terms in a sequence $s_i$, for $i = 0, 1, 2,
    \dots$, in which each term is equal to the previous one times a particular constant
    $r$. In other words, $s_i = r \cdot s_{i-1}$, for $i > 0$. These terms can also
    be described nonrecursively as follows:


    $s_i = r \cdot s_{i-1} = r^2 \cdot s_{i-2} = \dots = r^i \cdot s_0$.'
