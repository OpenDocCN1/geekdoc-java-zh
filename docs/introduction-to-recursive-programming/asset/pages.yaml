    \ the following diagram:\n\n| Inputs | Results |\n|---|---||\n| $(b, n)$ | $f\
    \ \\longrightarrow$ | $b^n$ |\n| | $\times b$ |\n| $(b, n-1)$ | $f \\longrightarrow$\
    \ | $b^{n-1}$ |"
