    the optimal cardinality. For example, for $S = \{1, 2, 3, 5, 6, 7, 9\}$ and $x
    = 13$, the method would solve the subset {6, 7}, and in addition, note that in
    this optimization problem the optimal subset may not be unique, for instance,
    for $S = \{2, 6, 3, 5\}$ and $x = 8$, both {2, 6} and {3, 5} would be optimal
    subsets. Code the partial (and optimal) solution as a list of binary digits, similarly
    to the method in Listing 12.7. Also, prune the tree considering the validity of
    a solution and the best cardinality. Finally, code a wrapper method'
