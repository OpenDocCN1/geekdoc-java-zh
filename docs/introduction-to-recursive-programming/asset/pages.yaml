  md: '# 36 Introduction to Recursive Programming


    Listing 2.1 uses the factorial function to illustrate this and other basic pitfalls
    regarding bases cases. Firstly, the **factorial** method provides a perfect implementation
    of the mathematical function. The *factorial_redundant* method is correct since
    it produces a valid output for any nonnegative integer argument. However, it contains
    an extra base case that is unnecessary.


    In addition, we should also strive for generality, which is an important desirable
    software feature. More general functions are those that can operate correctly
    on a wider range of inputs, and are therefore more applicable and useful. The
    factorial function in (1.3) receives a nonnegative integer as its input argument,
    and is defined adequately since it can be applied correctly not only to positive
    integer, but also to 0. Replacing the base case 0! = 1! would lead to a less general
    function, since it would not be defined for $n=0$. The *factorial\_missing\_base\_case*
    implementation with $n=0$ as its argument would fail to produce a valid result
    since it would run into an infinite recursion. In particular, *factorial\_missing\_base\_case(0)*
    would call *factorial\_missing\_base\_case(-2)*, and so on. In the practice textoverflow
    would halt producing a runtime error (e.g., “stack overflow,” or “maximum recursion
    depth exceeded”) performing a large number of function calls (see Chapter 10).
    Finally, *factorial\_no\_base\_case* always generates an infinite recursion since
    it does not contain any base case, and can never fail.


    For many problems, there are instances for which we can provide a result without
    recursion, even if their size is not small. For example, consider the problem
    of determining whether some element appears in a list. A first base case occurs
    when the list is empty (this is the smallest instance of the problem, zero size),
    where the result is obviously False. In addition, the algorithm can check if the
    element appears in some position (e.g., the first, middle, or last) of the list,
    and return a true value immediately if it does, even if the list is very large
    (Chapter 5 covers this type of searching problems). In both cases there is no
    need to carry out a recursive call.'
