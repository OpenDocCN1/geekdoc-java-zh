    # 9.4 WATER TREATMENT PLANTS PUZZLE


    In the “water treatment plants puzzle” there are $n$ cities, each with a water
    treatment plant, located along a side of a river, as shown in Figure 9.6. We will
    assume that the cities are arranged from left to right. Each city generates sewage
    water that must be cleaned in a plant (not necessarily its city) and discharged
    into the river through pipes, where additional pipes connect neighboring cities.
    If a plant is working it will clean the water from its city, plus any water coming
    from a pipe connecting a neighboring city, and discharge it to the river. However,
    a plant might not be working. In that case the water from its city, plus any water
    coming from a neighboring city, must be sent to another city. Given that water
    can flow in only one direction inside a pipe, the problem consists of determining
    the number of ways it is possible to discharge the cleaned water into the river,
    for $n$ cities. Finally, we can assume that at least one of the plants will work.


    We will see two recursive solutions that solve this counting problem. The first
    one models the water flow between cities and uses multiple recursion. A second
    solution considers how the water is discharged at each city, and is based on three
    mutually recursive functions.


    # 9.4.1 Water flow between cities


    The water can flow in each of the $n - 1$ pipes that connect neighboring cities
    in three ways that we will denote by characters: ‘N’ if there is no flow, ‘R’
    if water flows to the right, and ‘L’ if it flows to the left.'
