    # 3.2.1 Order of growth of functions


    The function $T(n)$ that quantifies the runtime of an algorithm may contain several
    additive terms that contribute differently to its value for a given input. For
    example, let $T(n)=0.5n^2+2000n+50000$. For moderate values of $n$ all of the
    terms are relevant regarding the magnitude of $T(n)$. However, as $n$ increases
    the leading term $(0.5n^2)$ affects the growth of function significantly more
    than the other two (even combined). Therefore, the **order of growth of** the
    function is characterized by its highest-order term. Figure 3.5 shows a plot of
    $0.5n^2$ together with $2000n+50000$. For large inputs it is apparent that the
    quadratic term dominates the other two, and therefore characterizes the rate of
    growth of $T(n)$. The coefficients of the polynomial have been chosen in order
    to illustrate that they do not play a significant role in determining the function''s
    rate of growth.


    Figure 3.6 plots several orders of growth that appear frequently in computational
    complexity. They can be sorted as follows when considering large values of $n$:


    +   $1 < \log n < n < n\log n < n^2 < n^3 < 2^n < n$'
