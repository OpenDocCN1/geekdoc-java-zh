    # 3.3.1 Expansion method


    The expansion method, also known as the “iteration” or “backward substitution”,
    method, can be used primarily to solve recurrence relations whose recursive case
    contains one reference to the recursive function (in some cases it can be applied
    to recurrences where the recursive function appears several times in the recursive
    definitions). The idea consists of simplifying the recurrence relation progressively
    step by step, noticing a general pattern at i-th stage. Subsequently, the function
    can take concrete values by considering that the base case is reached at i-th
    step. The following examples illustrate the procedure. Finally, Section 10.2.1
    illustrates a related visual approach called the “tree method.”


    # 3.3.1.1 Common recurrence relations


    Consider the function defined in (3.18). Its recursive case:


    ```

    $T(n) = T(n-1) + b$

    ```


    can be applied repeatedly (to arguments of smaller size) in order to “expand”
    the T of the right-hand side. For example, $T(n-1) = T(n-2)+b$, where all we substitute
    $n$ with $(n-1)$ in (3.21). Thus, we arrive at:


    ```

    $T(n) = [T(n-2) + b] + b = T(n-2) + 2b$,$

    T(n-1)$

    ```


    with the expression inside the square brackets is the expansion of $T(n-1)$. The
    idea can be applied again expanding $T(n-2)$, which is $T(n-3)+b$. Thus, at a
    third step we obtain:


    ```

    $T(n) = [T(n-3) + b] + 2b = T(n-3) + 3b$,$

    T(n-2)$

    ```'
