    #  3.3.2.1 Homogeneous recurrences and different roots


    Homogeneous recurrence relations only contain T difference terms:


    ```

    $T(n) = -a_1T(n-1) - \dots - a_kT(n-k)$.

    ```


    The first step for solving them consists of moving every term to the left-hand
    side of the definition:


    ```

    $T(n) + a_1T(n-1) + + \dots + a_kT(n-k) = 0$.

    ```


    Subsequently, we define its associated **characteristic polynomial** by applying
    the change $x^{k-z} = T(n-z)$ for $z=0, \dots, k$:


    ```

    $x^k + a_1x^{k-1} + \dots + a_{k-1}x + a_k$.

    ```


    All we have done is replace $T(n)$ with $x^k$, $T(n-1)$ with $x^{k-1}$, and so
    on. The coefficient $(a_i)$ associated with the $T$ difference that has the smallest
    argument will be the polynomial''s constant. The next step consists of finding
    the $k$ roots of the characteristic polynomial. If $r_i$ is its $i$-th root then
    it can be expressed in factored form:


    ```

    $(x-r_1)(x-r_2) \ \dots (x-r_k)$.

    ```


    If all of the roots are different then the nonrecursive expression for $T$ will
    be:


    ```

    $T(n) = C_1r_1^n + \dots + C_kr_k^n$. (3.34)

    ```


    Finally, the values of the constants will depend on the base cases of $T$, and
    will be found by solving a system of $k$ linear equations with $k$ unknown variables
    (the constants $C_i$). We will need to find $k$ initial values (base cases, for
    small values of $n$) in order to construct the $k$ equations.


    The following example illustrates the approach applied to the basic Fibonacci
    function defined in (1.2), and coded in Listing 1.3. It can be rewritten as:


    ```

    $T(n) = \begin{cases} 0 & \text{if } n=0, \ 1 & \text{if } n=1, \ T(n-1)+T(n-2)
    & \text{if } n>1, \end{cases}$ (3.35)

    ```


    where we have included extra base case for $n=0$ that will be useful shortly.
    The first step consists of writing each $T$ difference term on the left-hand side
    of the recursive identity:


    ```

    $T(n) - T(n-1) - T(n-2) = 0$.

    ```'
