    # 5.5 THE QUICKSELECT ALGORITHM


    The quickselect algorithm, also developed by Tony Hoare, is a selection method
    based on Hoare''s partitioning scheme (see Section 5.4.2). In particular, it finds
    the $k$-th smallest number (also called the $k$-th order statistic) in a list
    that is not sorted. Assume that an instance of the problem is defined by a numerical
    list **a**, lower and upper indices defining a sublist within it, and a positive
    integer $k$. The algorithm will search for the $k$-th smallest number in the specified
    sublist. The size of the problem is the length of the sublist. The smallest instances
    of the problem correspond to lists that contain a single element. Therefore, the
    base case occurs when the lower and upper indices are identical, where the method
    can simply return the element of the list.


    For larger lists the method first applies Hoare''s partition scheme, which arranges
    the elements of **a** in three parts. A first sublist contains the elements that
    are less than or equal to a chosen “pivot” element from the list. This list is
    followed by another one contains only the pivot. Finally, a third list contains
    the elements of **a** that are greater than the pivot.'
