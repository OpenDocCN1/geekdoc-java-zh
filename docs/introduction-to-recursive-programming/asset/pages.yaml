    # 12.1 INTRODUCTION


    This section introduces fundamental concepts related to backtracking, and provides
    an overview of how it works by examining the simple fourqueens puzzle. Its goal
    consists of placing four queens on a $4 \times 4$ chessboard so that they do not
    threaten each other. Since queens can move horizontally, vertically, and diagonally,
    two (or more) queens can not appear in the same row, column, or diagonal on the
    board. Figure 12.1 illustrates one of the two possible solutions to the puzzle.
    Naturally, the problem can be generalized to placing $n$ queens on an $n \times
    n$ chessboard (see Section 12.3).


    # 12.1.1 Partial and complete solutions


    Backtracking is a general strategy for finding solutions to computational problems
    among a finite set of possibilities. These solutions are collections of discrete
    items. Thus, technically we say that backtracking is a strategy that searches
    for solutions in a “discrete state space.” It is also a brute-force method in
    the sense that the search is exhaustive. In other words, if a solution exists,
    a backtracking algorithm is guaranteed to find it.


    The methods search for solutions by constructing and updating a partial solution,
    which could eventually become a valid complete solution to the problem. Partial
    solutions are built by incorporating candidate elements incrementally, step by
    step, in successive recursive calls. Thus, there is an implicit order in which
    the candidates appear in the solutions. In this regard, partial solutions can
    be understood as “prefixes” of complete solutions. When a solution is a list,
    a partial solution is simply a sublist that contains the first elements, as illustrated
    in Figure 12.2(a) through the lighter-shaded region. Instead, if it is a two-'
