    # 10.4.2 Dependency graph and dynamic programming


    Dynamic programming is an algorithm design paradigm that is used for solving optimization
    problems that can be broken up recursively, and where the decomposition leads
    to overlapping subproblems. The technique can be applied in a top-down manner
    by using recursion together with memoization. However, a more common approach
    consists of using a bottom-up strategy. The idea is to implement an iterative
    algorithm that fills a lookup table, analogous to the one used in a memoized recursive
    algorithm, in a bottom-up manner, starting with the simplest instances, and progressively
    storing the values that will allow us to solve the original problem.


    Even though the bottom-up approach is iterative, the recursive solution provides
    insight regarding how the lookup table should be filled. In particular, analysts
    can construct a **dependency graph** (also called a “subproblem graph”) that indicates
    the dependencies between the different subproblems (i.e., method calls) needed
    to be solved when applying'
