    # 5.3 BINARY SEARCH TREES


    A binary tree is a data structure used for storing data items, of which is associated
    with a certain key (we will consider that it has to be unique), similarly to the
    entries in a Python dictionary. It is an important data structure that allows
    us to carry out operations efficiently, such as searching, inserting, or removing
    elements. The data in each node of the binary tree is a pair (key, item), and
    the nodes are arranged according to the values of the keys, which can be compared
    through the < operator, or some equivalent function that allows us to determine
    if a key is less than another (i.e., a total preorder relation). In particular,
    any given node in the tree, every key in its left subtree must be less than its
    key, while all of the keys in its right subtree must be greater than its key.
    This is also known as the “binary search tree property,” which implies that every
    subtree of a binary search tree is also a binary search tree.'
