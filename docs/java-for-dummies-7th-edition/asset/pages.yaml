- pgno: 56
  md: 'The first category (grammar) includes rules like, “The verb agrees with the
    noun in number and person.” The second category (expressions, sayings, and stuff)
    includes knowledge like, “Julius Caesar was a famous Roman emperor, so don''t
    you name your son Julius Caesar, unless you want to get beaten every day after
    school.


    The Java programming language has all the aspects of a spoken language like English.
    Java has words, grammar, commonly used names, stylistic idioms, and other elements.


    # The grammar and the common names


    The people at Sun Microsystems who created Java thought of Java as having two
    parts. As English has its grammar and commonly used names, the Java programming
    language has its specification (its grammar) and its programming interface (it
    commonly used names). Whenever I write Java programs, I have two important pieces
    of documentation — one for each of parts — on my desk:


    +   **The Java Language Specification:** This documentation includes rules like
    this: “Always put an open parenthesis after the word *for* and “Use an asterisk
    to multiply two numbers.”


    +   **The Java programming interface:** Java’s application programming interface
    (API) contains thousands of names that were added to Java after the language’s
    grammar of names range from the commonplace to the exotic. For, one — the name
    *JFrame* — represents a window on your computer’s screen. A more dazz-dazzle-name
    *pow* helps you raise 5 to the 5th power, or raise whatever to the whatever power.
    Other names help you listen for the user’s button clicks, query databases, and
    all kinds of useful things.


    ![](img/ceb51741697a1347a52f2b180d896ec0_56_0.png)


    You can download the language specification, the API documents, and all the other
    Java documentation (or the view documents) by poking around at http://docs.oracle.com/java/specs.


    The first part of Java, the language specification, is relatively small. That
    doesn''t mean you won''t take plenty of time finding out how to use the rules
    in the language specification. Other programming languages, however, have double,
    triple, or ten times the number of rules.


    The second part of Java — the API — can be intimidating because it''s so large.
    The API contains thousands and thousands of names and keeps growing with each
    new Java language release. Pretty scary, eh? Well, the good news is that you don''t'
