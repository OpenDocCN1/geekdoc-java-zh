  md: "In theory, the computer always executes scan1.close() and scan2.close() no\
    \ matter what goes wrong during execution of the try clause. But that's theory.\
    \ In reality, another programmer (not you, of course) might modify the code by\
    \ closing scan1 in the middle of the try clause:\n\n```\ntry {\n scan1 = new Scanner(new\
    \ File(\"File1.txt\"));\n scan2 = new Scanner(new File(\"File2.txt\"));\n // Do\
    \ useful stuff also ...\n scand.close();\n scand = null;\n} catch (IOException\
    \ e) {\n // Oops!\n} finally {\n scand.close();\n sc2.close();\n System.out.println(\"\
    Done!\");\n}\n```\n\nNow you have a real predicament. Inside the finally clause,\
    \ the value of scan1 is null. If to scan1.close() fails, the program throws a\
    \ NullPointer Exception and stops running before the call to scan2.close(). In\
    \ the worst of circumstances, scan2 is not closed and your program has locked\
    \ up so no other program can use the file.\n\nWhen a program uses several resources\
    \ (many files, a database and a file, or whatever) the cleanup of try statements\
    \ becomes quite complicated. You can make try statements in catch clauses and\
    \ all kinds of combinations. But Java has a better way to solve the problem: In\
    \ Java 7 (and later versions of Java), you can use a try-with-resources statement.\
    \ Listing 13-13 shows you how.\n\n# LISTING 13-13: Making Sure to Close Resources\n\
    \n```\nimport java.io.File;\nimport java.io.IOException;\nimport java.util.Scanner;\n\
    \npublic class NewMain {\n\npublic static void main(String args[]) {\n try (Scanner\
    \ scan1 = new Scanner(new File(\"File1.txt\")) {\n Scanner scan2 = new Scanner(new\
    \ File(\"File2.txt\")) {\n // Do useful stuff\n} catch (IOException e) {\n```\n\
