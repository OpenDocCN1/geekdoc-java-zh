  md: '# Calling new Temperature(32.0):

    A case study


    When the computer executes one of the new Temperature statements in Listing 9-3,
    the computer has to decide which of the constructors in Listing 9-2 to use. The
    computer decides by looking at the parameter list — the stuff in parentheses after
    the words new Temperature. For instance, when the computer executes


    ```

    temp = new Temperature(32.0);

    ```


    From Listing 9-3, the computer says to itself, "The number 32.0 in parentheses
    is a double value. One of Temperature constructors in Listing 9-2 has just one
    parameter with type double. The constructor''s header looks like this:


    ```

    public Temperature(double number)

    ```


    "So, I guess I''ll execute the statements inside that particular constructor."
    The computer goes on to execute the following statements:


    ```

    this.number = number;

    scale = TempScale.FAHRENHE;

    ```


    As a result, you get a -new object whose number field has the value 32.0 and whose
    scale field has the value TempScale.FAHRENIT.


    In the two lines of code, you have two statements that set values for the fields
    number and scale. Take a look at the second of these statements, which is a bit
    easier to understand. The second sets the new object''s scale field to TempScale.FAHRENIT.
    You see, the constructor''s parameter list is (double number), and that list doesn''t
    include a scale value. So whoever programmed this code had to make a decision
    about what value to use for the scale field. The programmer could have chosen
    FAHRENIT or CELSIUS, but she could also have chosen Kelvin, RANKINE, or any of
    the other obscure scales in Listing 9-1. (This programmer happens to live in New
    Jersey, in the United States, where people commonly use the old FAHRENIT temperature
    scale.)


    Matching back to the first of the two statements, this first statement assigns
    a value to the new object''s number field. The statement uses a cute trick that
    you can see in many constructors (and in other methods that assign values to objects''
    fields). To understand the trick, take a look at Listing 9-4. The listing shows
    two ways I could have written the same constructor code.'
