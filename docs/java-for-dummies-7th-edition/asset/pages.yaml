- pgno: 474
  md: '# Helping Java Find Its Files


    You''re compiling Java code, minding your own business, when the computer gives
    you a NoClassDefFound. All kinds of things can be going wrong, but chances are
    good that the computer can''t find a particular Java file. To fix this, you must
    align all the planets correctly:


    +   * Your project directory has to contain all the Java files whose names are
    used in your code.

    * If you use named packages, your project directory has to have appropriately
    named subdirectories.

    * If you''re running code from your computer''s command line, your CLASSPATH environment
    variable must be set properly.


    For specific guidelines, see Chapter 14 and this book''s website (www.allmycode.com/JavaForDummies).'
  merge: -1
  img_proc: true
