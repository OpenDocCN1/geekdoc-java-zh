  md: 'The Java programming language has three kinds of comments:


    +   **Traditional comments:** The first five lines of Listing 3-6 form one traditional
    comment. The comment begins with /* and ends with /. Everything between the opening
    /* and the closing */ is for human eyes only. Information about *Java For Dummies,
    7th Edition* or Wiley Publishing, Inc. is translated by the compiler.


    ![](img/ceb51741697a1347a52f2b180d896ec0_73_0.png)


    To read compilers, see Chapter 2.


    The second, third, and fifth lines in Listing 3-6 have extra asterisks (*). I
    call them extra because these asterisks aren''t required when you create a comment.
    They make the comment look poor. I include them in Listing 3-6, for some reason
    that I didn''t entirely understand, most programmers add extra asterisks.


    +   **End-of-line comments:** The text // You in Listing 3-6 is an end-of-line
    comment. An end-of-line comment starts with slashes and goes to the end of a line
    of type. Once again, the compiler doesn''t translate the text inside the end-of-line
    comment.


    +   **Javadoc comments:** A javadoc comment begins with a slash and /**. Listing
    3-6 has two javadoc comments: one with the Dispatcher class ... and another with
    the main method is


    > A javadoc comment, which is a special kind of comment, is meant to be read by
    people who never look even at the Java code. But that doesn''t make sense. How
    can you see the javadoc comments in Listing 3-6 if you never look at Listing 3-6?


    +   Well, a program called javadoc (what else?) can find all the javadoc comments
    in Listing 3-6 and turn these comments into a nice-looking web page. Page 3-8
    shows the page.


    Javadoc comments are great. Here are several things about them:


    +   The only person who has to look at a piece of Java code is the programmer
    who writes the code. Other people who use the code can find out what the code
    does by viewing the automatically generated page.


    +   Because other people don''t look at the Java code, other people don''t make
    changes to the Java code. (In other words, other people don''t introduce errors
    into the existing Java code.)


