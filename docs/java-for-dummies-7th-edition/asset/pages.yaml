  md: "# Anticipating Null Pointers\n\nThis book's examples aren't prone to throwing\
    \ the NullPointerException, but in real-life java programming, you see that exception\
    \ all the time. A NullPointer Exception comes when you call a method that's supposed\
    \ to return an object, but instead the method returns nothing. Here's a cheap\
    \ example:\n\n```\nimport static java.lang.System.out;\nimport java.io.File;\n\
    \nclass ListMyFiles {\n    public static void main(String[] args) {\n        File\
    \ myFile = new File(\"Users\");\n        String dir[] = myFile.list();\n\n   \
    \     for (String fileName : dir) {\n            out.println(fileName);\n    \
    \    }\n    }\n}\n```\n\nThis program displays a list of all files in the Users\
    \ directory.\n\nBut what happens if you change /Users to something else — something\
    \ that doesn't represent the name of a directory?\n\n```\nFile myFile = new File(\"\
    *!!!\");\n```\n\nThen the new File call returns null, so the myFile has nothing\
    \ in it. Later in the code, the variable dir refers to nothing, and the attempt\
    \ to loop through all the dir values fails miserably. You get a big NullPointerException,\
    \ and the program crashes around you.\n\nTo avoid this kind of calamity, check\
    \ Java's API documentation. If you're calling a method that can return null, add\
    \ exception-handling code to your program.\n\nFor the story on handling exceptions,\
    \ see Chapter 13. For some advice on reading the API documentation, see Chapter\
    \ 3 and this book's website (www.allmycode.com/JavaForDummies)."
