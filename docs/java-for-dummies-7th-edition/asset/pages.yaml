  md: '# Writing to a file


    The code in Listing 11-4 uses tricks from other chapters and sections of this
    book.

    The code''s only brand-new feature is the use of PrintStream to write to a disk
    file.

    Think about any example in this book that calls System.out.print, System.out.println,

    or their variants. What''s really going on when you call one of these methods?


    The thing called System.out is an object. The object is defined in the Java API.

    In fact, System.out is an instance of a class named java.io.PrintStream (or just

    PrintStream to close its friends). Now each object created from the PrintStream

    class has methods print and println. As each Account object in

    Listing 7-3 has a display method, and just as the DecimalFormat object in

    Listing 10-5 has a format method, the PrintStream object you have

    print and println methods. method that belongs to a PrintStream instance


    Okay, so what of it? System.out always stands for some area on your

    computer screen. If you create your own PrintStream object and make you

    object refer to a disk file, that PrintStream object refers to the disk file.
    When

    call your object''s print method, write text to a file on your hard drive.


    In 11-4, when you say


    ```

    PrintStream listOut = new PrintStream("GuestList.txt");

    out.print(guests[roomno]);

    out.println("")

    ```


    you''re telling Java to write text to a file on your hard drive — the GuestList.
    txt file.


    That''s how you update the count of guests staying in the hotel. When you call

    listOut.print for the number of guests in Room 3, you may print the number 5.

    Between Figures 11-5 and 11-6, a number in the GuestList.txt file changes

    from 0 to 5. Then in Figure 11-6, you run the program a second time. When the

    program gets data from the newly written GuestList.txt file, room 3 is no-

    ger. This time, the program suggests Room 8.


    This is more of an observation than a tip. Say you want to read data from a file

    amed Employees. To do this, you make a scanner. You call Scanner(new

    File("Employees.txt")). If you accidentally call Scanner("Employees.

    txt") without using the new File, the call doesn''t connect to your Employees.
    txt

    file. But notice how you prepare to write data to a file. You make a PrintStream

    instance by calling new PrintStream("GuestList.txt"). You don''t use new File

    where in the call. If you go and accidentally include new File, the Java com-

    piler becomes angry, jumps out, and bites you.


    > TIP


    CHAPTER 11 Using Arrays to Juggle Values 305'
