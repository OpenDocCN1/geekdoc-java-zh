  md: '# Working with Disk Files (a Brief Detour)


    In previous chapters, programs read characters from the computer''s keyboard.
    But the code in Listing 8-2 reads characters from a specific file. The file (named
    EmployeeInfo.txt) lives on your user''s hard drive.


    This EmployeeInfo.txt file is like a word processing document. The file can contain
    letters, digits, and other characters. Unlike a word processing document, the
    EmployeeInfo.txt file contains no formatting — no italics, no bold, no font sizes,
    not of that kind.


    The EmployeeInfo.txt file contains only ordinary characters — the kinds of strokes
    that you type while you play a guessing game from Chapters 5 and 6. of course,
    getting guesses from a user''s keyboard and reading employee data from a disk
    file arent exactly the same. In a guessing game, the program displays prompts,
    such as Enter an int from 1 to 10. The game conducts a back-and-forth dialogue
    with the person sitting at the keyboard. In contrast, Listing 8-2 reads characters
    from a hard drive and does not prompt or interact with anyone.


    Most of this is about code reuse. But Listing 8-2 stumbles upon an important idea
    — an idea that''s not directly related to code reuse. Unlike the examples in previous
    chapters, Listing 8-2 reads data from a stored disk file. In the following sections,
    I take a short side trip to explore disk files.


