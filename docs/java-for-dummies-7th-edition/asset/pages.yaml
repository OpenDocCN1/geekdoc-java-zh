  md: '# Experiments with Variables


    One summer during my college days, I was sitting on the front porch, loafing around,
    talking with someone I''d just met. I think her name was Janine. "Where are you
    from?" I asked. "Mars," she answered. She paused to see whether I''d ask a follow-up
    question.


    As it turned out, Janine was from Mars, Pennsylvania, a small town around 20 miles
    north of Pittsburgh. Okay, what''s my point? The point is that the meaning of
    a name depends on the context. If you''re just north of Pittsburgh and ask, "How
    do I get to Mars from here?" you may get a sensible, nonchalant answer. But if
    you ask the same question standing on a street corner in Manhattan, you''ll probably
    arouse suspicion. (Okay, knowing Manhattan, people would probably ignore you.)


    Of course, the people who live in Mars, Pennsylvania, are very much aware that
    their town has an oddball name. Memories of teenage years at Mars School don''t
    prevent a person from knowing about the big red planet. On a clear evening in
    August, you can still have the following conversation with one of the locals:


    You: How do I get to Mars?


    Local resident: You''re in Mars, pal. What particular part of Mars are you looking
    for?


    No, I don''t mean Mars, Pennsylvania. I mean the planets.


    Local resident: Oh, the planet! Well, then, catch the 8:19 train leaving for Cape
    Canaveral... No, wait—that''s the local train. That''d take you through West...


    So the meaning of a name depends on where you''re using the name. Although most
    English-speaking people think of Mars as a place with a carbon dioxide atmosphere,
    some folks in Pennsylvania think about all the shopping they can do in Mars. And
    those folks in Pennsylvania really have two meanings for the name Mars. In Java,
    those names may look like this: Mars and planets.


    # Putting a variable in its place


    Your first experiment is shown in Listings 10-6 and 10-7. The listings'' code
    highlights the difference between variables that are declared inside and outside
    methods.'
