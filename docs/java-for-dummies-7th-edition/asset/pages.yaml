    # # To break or not to break


    In every programmer''s life, a time comes when he or she forgets to use break
    statements. At first, the resulting output is confusing, then the programmer remembers
    fall-through. The term fall-through describes what happens when you end a case
    without a break statement. What happens is execution of the code falls right to
    the next case in line. Execution keeps falling until you reach a break statement
    or the end of the entire switch statement.


    Usually, when you''re using a switch statement, you don''t fall-through, so you
    pepper break statements throughout the switch statements. But, occasionally, fall-through
    is just the thing you need. Take, for instance, the "Al''s All Wet" song. (The
    classy lyrics are shown in the sidebar bearing the song''s name.) Each


