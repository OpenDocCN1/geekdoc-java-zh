  md: '# Using Blocks in JShell


    Chapter 4 introduces Java 9''s interactive JShell environment. You type a statement,
    and JShell responds immediately by executing the statement. That''s fine for simple
    statements, but what happens when you have a statement inside a block?


    In JShell, you can start typing a statement with one or more blocks. JShell doesn''t
    respond until you finish typing the entire statement — blocks and all. To see
    how it works, look over this conversation that I had recently with JShell:


    ```

    jshell> import java.lang.System.out

    jshell> import java.util.Random

    jshell> int randomNumber = new Random().nextInt(10) + 1

    randomNumber == 4


    jshell> int inputNumber = 4

    inputNumber == 4


    jshell> if (inputNumber == randomNumber) {

    ...

    out.println("*You win.\*");

    ...

    }


    jshell>

    ```


    In this dialogue, I set the text that I type in bold. JShell''s responses are
    set in bold.


    When I type if (inputNumber == randomNumber) { and press Enter, JShell doesn''t
    do much. JShell only displays a .. prompt, which indicates that what-ever lines
    you didn''t form a complete statement. I have to respond by typing the rest of
    the statement.


    When I finish the statement with a close brace, JShell finally acknowledges that
    I''ve typed an entire statement. JShell executes the statement and (in this example)
    displays \*You win.\*.


    The semicolon at the end of the out.println line:


