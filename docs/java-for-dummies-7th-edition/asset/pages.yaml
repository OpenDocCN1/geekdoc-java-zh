  md: 'Now you need some terminology. The thing stored in a variable is a value. A
    variable''s value can change during the run of a program (when Jack gives you
    million bucks, for instance). The value that''s stored in a variable isn''t necessarily
    a number. (For instance, you can create a variable that always stores a letter.)
    The kind of value that''s stored in a variable is a variable''s.


    You can read more about types in the section "The types of values that variables
    may have," later in this chapter.


    A subtle, almost unnoticed difference exists between a variable and a variable''s
    name. In formal writing, I often use the word when I mean variable name. Strictly
    speaking, amountInAccount is a variable name, and all the memory storage with
    amountInAccount has whatever value amountInAccount currently represents is the
    variable itself. If you think this distinction between variable and variable name
    is too subtle to worry about, join the club.


    ![](img/ceb51741697a1347a52f2b180d896ec0_81_0.png)


    TECHNICAL STUFF


    Every variable name is an identifier — a name that you can make up in your code.
    In preparing Listing 4-1, I made the name amountInAccount.


    ![](img/ceb51741697a1347a52f2b180d896ec0_81_1.png)


    For information on the kinds of names in a Java program, see Chapter 3.


    Before the sets on Listing 4-1, you need to notice one more part of the listing.
    The listing has 50.22 and 100000.00 in it. Anyone in his or her right mind would
    call these numbers, but in a Java program it helps to call these things literals.


    CROSS REFERENCE


    And what''s so about 50.22 and 100000.00? Well, think about the variable amountInAccount
    in Listing 4-1. The variable amountInAccount stands for 50.22 of some time, but
    it stands for 100050.22 the rest of the time. You could use the word number to
    talk about amountInAccount. But really, what amountInAccount stands for the fashion
    of the machine. On the other hand, 50.22 literally stands for the value 52/100.


    ![](img/ceb51741697a1347a52f2b180d896ec0_81_2.png)


    A variable''s value changes; a literal''s doesn''t.


    Starting with Java 7, you can add underscores to numeric literals. Instead of
    using the plain 1000000.00 in Listing 4-1, you can write amountInAccount = amountInAccount
    + 1_000_000_00. Unfortunately, you can''t easily do that to you. You can''t write
    1.000.000.00 (as you would in the United States), nor can you write 1.000.000.00
    (as you would in Germany). If you want to display a number such as 1,000,000.00
    in the program''s output, you have to use some fancy formatting tricks. check
    Chapters 10 and 11.


    ![](img/ceb51741697a1347a52f2b180d896ec0_81_3.png)


    REMEMBER


    TIP


    # CHAPTER 4 Making the Most of Variables and Their Values 69'
