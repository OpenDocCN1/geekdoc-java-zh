    \ interactive elements. The time has come to change all. This chapter's first\
    \ example is a window with a button on it. When the user clicks the button, damn\
    \ it, something happens. The code is shown in Listing 16-1, and the main method\
    \ that calls the code in Listing 16-1 is in Listing 16-2.\n\n# LISTING 16-1: A\
    \ Guessing Game\n\n```\nimport java.awt.FlowLayout;\nimport java.awt.event.ActionEvent;\n\
    import java.awt.event.ActionListener;\nimport java.util.Random;\n\nimport java.swing.JButton;\n\
    import java.swing.JFrame;\nimport java.swing.JLabel;\nimport java.swing.JTextField;\n\
    \nclass GameFrame extends JFrame implements ActionListener {\n    private static\
    \ long serialVersionUID = 1L;\n\n    int randomNumber = new Random().nextInt(10)\
    \ + 1;\n    int numGesses = 0;\n\n    JTextField textField = new JTextField(5);\n\
    \    JButton button = new JButton(\"Guess\");\n    JLabel label = new JLabel(numGesses\
    \ + \" guesses: \");\n\n    public GameFrame() {\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        setLayout(new FlowLayout());\n        add(textField);\n        add(button);\n\
