- pgno: 385
  md: "# LISTING 13-10: Acknowledging with throws\n\n```\nimport static java.lang.System.out;\n\
    \npublic class GoodNightsSleep {\n\n    public static void main(String args[])\
    \ {\n        out.print(\"Excuse me while I nap \");\n        out.println(\"for\
    \ just five seconds...\");\n\n        try {\n            takeANap();\n       \
    \ } catch (InterruptedException e) {\n            out.println(\"Hey, who woke\
    \ me up?\");\n        }\n\n        out.println(\"Ah, that was refreshing.\");\n\
    \    }\n\n    static void takeANap() throws InterruptedException {\n        Thread.sleep(5000);\n\
    \    }\n}\n```\n\nTo see a run of the code in Listing 13-10, refer to Figure 13-13.\
    \ Once again, Figure 13-13 fails to capture the true essence of the run, but that's\
    \ okay. Just remember that in Figure 13-13, the computer pauses for five seconds\
    \ before it displays Ah, that was refreshing.\n\nThe important part of Listing\
    \ 13-10 is in the takeANap method's header. Header ends with throws InterruptedException.\
    \ By announcing that it throws an InterruptedException, method takeANap passes\
    \ the block. What throws clause says is, \"I realize that a statement inside this\
    \ method has the potential to throw an InterruptedException, but I'm not acknowledging\
    \ the exception in a try-catch statement. Java compiler, I'm passing the responsibility\
    \ for acknowledging the exception to the main method (the method that called takeANap\
    \ method).\n\nIndeed, the main method to call takeANap is inside a try clause.\
    \ That try clause has a catch clause with a parameter of type InterruptedException.\
    \ So everything is okay. Method takeANap passes the responsibility to the main\
    \ method, and the main method accepts the responsibility with an appropriate try-catch\
    \ statement. Everybody's happy. Even the Java compiler is happy."
