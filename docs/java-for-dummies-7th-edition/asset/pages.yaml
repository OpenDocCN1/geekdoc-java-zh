  md: 'To run the code in Listings 13-5 and 13-6, you need one additional Java program
    file. You need the OutRangeException class in Listing 13-3.


    Listing 13-6 addresses the scenario in which you have limited shelf space. You
    don''t have room for more than 1,000 boxes, but once in a while the program asks
    how many boxes you have, and somebody enters the number 10000 by accident. In
    cases like this, Listing 13-6 does a quick reality check. Any number of boxes
    over 1,000 is tossed out as being unrealistic.


    Listing 13-6 watches for a NumberTooException, but to make life more interesting,
    Listing 13-6 doesn''t have a catch clause for the NumberLargeException. In spite
    of this, everything still works just fine. It''s fine NumberTooException is declared
    to be a subclass of OutRangeException, and Listing 13-6 has a catch clause for
    the OutRangeException.


    You see, because NumberLargeException is a subclass of OutRangeException, any
    instance of NumberLargeException is just a special kind of OutRangeException.
    So, in Listing 13-6, the computer may start looking for a catch clause to catch
    NumberLargeException. When the computer stumbles upon the OutRangeException catch
    clause, the computer says, "Okay, I''ve found a match." I''ll execute the statements
    in this catch clause.


    To keep from having to write this story over and again, I introduce some new terminology.
    I say that the catch clause with parameter OutRangeException matches the NumberLargeException
    that''s been thrown. I call this catch clause a matching catch clause.


    The following list describes different things that you may do and how the computer
    responds. As you read, you can follow along with the runs shown in Figure 13-6:


    | How many boxes do we have? 3

    The value is $99.75

    That''s that.


    How many boxes do we have? fish

    That''s not a number.

    That''s that.


    How many boxes do we have? -25

    -25? That''s impossible!

    That''s that.


    How many boxes do we have? 1001

    1001? That''s impossible!

    That''s that.


