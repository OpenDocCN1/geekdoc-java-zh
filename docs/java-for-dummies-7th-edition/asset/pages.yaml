- pgno: 418
  md: '# Access Modifiers for Java Classes


    Maybe the things you read about access modifiers for members make you a tad dizzy.
    After all, member access in Java is a complicated subject with lots of plot twists
    and cliffhangers. Well, the dizziness is over. Compared with the saga of fields
    and methods, the access story for classes is rarer simple.


    A class can be either public or nonpublic. If you see something


    ```

    public class Drawing

    ```


    you''re looking at the declaration of a public class. But, if you see plain old


    ```

    class ShowFrame

    ```


    the that''s being declared isn''t public.


    # Public classes


    If a class is public, you can refer to the class from anywhere in your code. Of
    course, some restrictions apply. You must obey all the rules in this chapter''s
    "Directory structure" section. You must also refer to a packaged class properly.
    For example, in Listing 14-1, you can write


    ```

    import com.burbrain.draw.Drawing;

    import com.burbrain.frames.ArtFrame;

    ```


    ```

    ArtFrame artFrame = new ArtFrame(new Drawing());

    ```


    or you can do without the import declarations and write


    ```

    com.burbrain.frames.ArtFrame artFrame =

    new com.burbrain.frames.ArtFrame(new com.burbrain.draw.Drawing());

    ```


    One or another, your code must acknowledge that the ArtFrame and Drawing classes
    are in named packages.


    # Nonpublic classes


    If a class isn''t public, you can refer to the class only from code within the
    class''s package.'
