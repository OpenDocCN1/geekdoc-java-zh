- pgno: 34
  md: 'Close your eyes for a minute and think about what it means for something to
    be a chair....


    A chair has a seat, a back, and legs. Each seat has a shape, a color, a degree
    of softness-, and so on. These are the properties that a chair possesses. What
    I describe is chairness — the notion of something being a chair. In object-oriented
    terminology, I am describing the Chair class.


    Now peek over the edge of this book''s margin and take a minute to look around
    your room. (If you''re not sitting in a room right now, make it.)


    Several chairs are in the room, and each chair is an object. Each of these objects
    is an example of that either calling the Chair class. So that''s how it works
    — the class is the idea of chairness, and each individual chair is an object.


    ![](img/ceb51741697a1347a52f2b180d896ec0_34_0.png)


    A class isn''t a collection of things. Instead, a class is the idea behind a kind
    of thing. When I talk about the class of chairs in your room, I''m talking about
    the fact that each chair has legs, a seat, a color, and so on. The colors may
    be different for different chairs in the room, but that doesn''t matter. When
    you talk about a class of things, you''re focusing on the properties of the thing
    that it possesses.


    It makes sense to think of an object as being a concrete instance of a class.
    In fact, the official terminology is consistent with this thinking. If you write
    a Java program in which you define a Chair class, each actual chair (the chair
    that you''re sitting on, the empty chair right next to you, and so on) is called
    an instance of that class.


    Here''s another way to think about a class. Imagine a table displaying all three
    of your bank accounts. (See Table 1–1).


