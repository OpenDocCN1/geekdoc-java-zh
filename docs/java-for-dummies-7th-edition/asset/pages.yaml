  md: "This section explains default access, the kind of access that I use most of\
    \ the book's examples. I use default access a lot, with default access, you don't\
    \ have to make sense of the words public or private. So, in many examples, you\
    \ have fewer words to worry about.\n\nIn real life, programmers shun the use of\
    \ default access. With default access, all the other classes in your package can\
    \ view and change the values of your fields. Other programmers can set daysInMonth\
    \ to 32 or chaptersInThisBook to -7.\n\nBy far, the best policy is to use default\
    \ access only when such access is absolutely necessary. In most situations, if\
    \ other classes have to get or set your field's values, you should use private\
    \ access and provide public getter and setter methods.\n\n# Protected Access\n\
    \nWhen I was first getting to know Java, I thought the word protected meant nice\
    \ or something like that. \"Wow, that field is protected. It might be hard to\
    \ get at.\" Well, this notion turned out to be wrong. In Java, a member that is\
    \ protected is less hidden, secure, and available for more classes than one that\
    \ has default access. In other words, protected access is more permissive than\
    \ default access. For me, the terminology is misleading. But that's the way it\
    \ is.\n\n# Subclasses that aren't in the same package\n\nThink of protected access\
    \ this way. You start with a field that has default access (a field without the\
    \ word public, private, or protected in its declaration). That field can be accessed\
    \ only inside the package in which it lives. Now add the word protected to the\
    \ front of the field's declaration. Suddenly, classes outside of that field's\
    \ package have some access to the field. You can now reference the field from\
    \ a subclass (of a class in which the field is declared). You can also reference\
    \ the field from a sub-subclass, a sub-sub-subclass, and so on. Any descendant\
    \ class will do. For an example, see Listings 14-8 and 14-9.\n\nLISTING 14-8:\
    \ Protected Fields\n\n```\npackage com.burdbrain.drawings;\n\nimport java.awt.Graphics;\n\
    \npublic class Drawing {\n    protected int x = 40, y = 40, width = 40, height\
    \ = 60;\n```"
