    \ {\n        System.out.print(\" \" + weighs + \" + pounds\");\n        System.out.print(sound\
    \ == null ? (\" and \" + sound + \"\") : \"\");\n        System.out.println(\"\
    .\");\n    }\n}\n```\n\nThe first line of Listing 15-7, the keyword abstract tells\
    \ Java that HousePet is an abstract class. Because HousePet is abstract, HousePet\
    \ can have an abstract method. And in Listing 15-7, howToCare is an abstract method.\
    \ An abstract method has a header but no body. In an abstract method, there are\
    \ no curly braces — only a semicolon where braces would appear.\n\nSo, when you\
    \ try to execute the howToCare method, what happens? Well, you can't really execute\
    \ the howToCare method in Listing 15-7. In fact, you can't even create an instance\
    \ of the abstract class declared in Listing 15-7. The following code is:\n\n```\n\
    // BAD CODE:\nHousePet myPet = new HousePet(\"Boop\", 12.0, \"Meow\");\n```\n\n\
    An abstract class has no life of its own. In order to use an abstract class, you\
    \ have to create an ordinary (non-abstract) class that extends the abstract class.\
    \ In the ordinary class, all methods have bodies. So everything works out.\n\n\
    Before you walk away from Listing 15-7, notice the super(weight, sound) call in\
    \ that listing. In Chapter 9, the keyword super triggers a call to the superclass's\
    \ constructor. In Listing 15-7, calling super(weight, sound) is like calling the\
    \ constructor from Listing 15-6. The constructor assigns values to the new object's\
    \ weight and sound fields.\n\n![](img/ceb51741697a1347a52f2b180d896ec0_431_0.png)"
