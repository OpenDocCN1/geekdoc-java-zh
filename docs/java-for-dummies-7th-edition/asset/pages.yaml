  md: 'For the rundown on method-local variables, see Chapter 10.


    In Java, the default access for a member of a class is package-wide access. A
    member declared without the word public, private, or protected in front of it
    is accessible in the package in which its class resides. Figures 14-7 and 14-8
    illustrate the point.


    The names of packages, with all their dots and subparts, can be slightly misleading.
    For instance, when you write a program that responds to button clicks, you normally
    import classes from two separate packages. On one line, you may have import classes
    from java.awt.*;. On another line, you may have import classes from java.awt.event.*;
    Importing all classes from the java.awt package doesn''t automatically import
    classes from the java.awt package.


