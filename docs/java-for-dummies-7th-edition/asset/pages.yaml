    # ALL GENERICS


    Of the original design goals for Java was to keep the language as simple as possible.
    James Gosling, the language''s creator, took some unnecessarily complicated features
    of C++ and tossed them out the window. The result was a language that was elegant
    and sleek. Some people said the language was too slow, so after several years
    of discussion and squabbling, Java became a bit more complicated. By the year
    2004, Java had enum types, enhanced for loops, static memory, and other interesting
    new features. The most-talked-about new feature was the introduction of generics:


    ```

    ArrayList<String> people = new ArrayList<String>();

    ```


    The use of anything like <String> was new in Java 5.0. In old-style Java, you''d
    write


    ```

    ArrayList people = new ArrayList();

    ```


    In those days, an ArrayList could store anything you wanted to put in it: a number,
    an Account, a Room, a String — anything. The ArrayList class was versatile, but
    with this versatility some headaches. If you put anything into an ArrayList, you
    couldn''t easily predict what you would get out of an ArrayList. In particular,
    you couldn''t easily write code that assumed you had stored certain types of values
    in the ArrayList. Here''s an example:


    ```

    ArrayList things = new ArrayList();

    things.add(new Account());

    Account myAccount = things.get(0);

    //- DON''T USE THIS. IT''S BAD CODE.

    ```'
