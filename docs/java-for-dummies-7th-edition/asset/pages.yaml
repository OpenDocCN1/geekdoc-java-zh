    These ideas come together in Listings 7-1 and 7-2. Here''s Listing 7-1:


    # LISTING 7-1: What It Means to Be an Account


    ```

    public class Account {

    String name;

    String address;

    double balance;

    }

    ```


    ![](img/ceb51741697a1347a52f2b180d896ec0_175_0.png)


    The Account class in Listing 7-1 defines what it means to be an Account. In par-
    ticular, Listing 7-1 tells you that each of the Account class''s instances has
    three variables: name, address, and balance. This is consistent with the information
    in Figure 7-1. Java programmers have a special name for variables of this kind
    (variables that belong to instances of classes). Each of these variables — name,
    address, and balance — is called a field.


    A variable declared inside a class but not inside any particular method is a field.
    Another for Listing 7-1, the variables name, address, and balance are fields.


    If you''ve been grappling with the material in Chapters 4 through 6, the code
    for class Account (refer to Listing 7-1) may be a big shock to you. Can you really
    define a complete Java class with only four lines of code (give or take a curly
    brace)? You certainly can. A class is a grouping of existing things. In the Account
    class of Listing 7-1, those existing things are two String values and a double
    value.'
