    That''s new and different. In earlier chapters, I say that you normally preface
    a method with an object''s name, not a class''s name. So why do I use a class
    name here? The answer: When you call a static method, you preface the method''s
    name with that of the class that contains the method. The same holds whenever
    you reference another class''s static field. It makes sense. Remember: The class
    that defines a static field owns that field or method. So, to refer to a static
    field or method, you preface the field or method''s name with the class''s name.


