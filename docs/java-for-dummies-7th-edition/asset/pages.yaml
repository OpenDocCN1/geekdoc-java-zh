  md: '# PRIMITIVE TYPE STEW


    While I''m on the subject of frames, what''s a frame, anyway? A frame is a window
    that has a certain height and width and a certain location on your computer''s
    screen. Therefore, deep inside the declaration of the Frame class, you can find
    variable declarations that look something like this:


    ```

    int width;

    int height;

    int x;

    int y;

    ```


    Here''s another example — Time. An instance of the Time class may have an hour
    (a number from 1 to 12), a number of minutes (from 0 to 59), and a letter (a for
    a.m.; p for p.m.)


    ```

    int hour;

    int minutes;

    char amOrPm;

    ```


    Notice that high-and-mighty thing a Java API class is neither high nor mighty.
    A class is a collection of declarations. Some of those declarations are the variables.
    Some of those variable declarations use primitive types, and other variable declarations
    use reference types. These reference types, however, come from other classes,
    and the declarations of those classes have variables. The chain goes on and, Ultimately,
    everything comes, in one way or another, from the primitive types.


    # An Import Declaration


    It''s always good to announce your intentions up front. Consider the following
    classroom lecture:


    > Today, in our History of Film course, we''ll be discussing the career of actor
    Lionel Blythe Barrymore.


    Born in Philadelphia, Barrymore appeared in more than 200 films, including It''s
    a Wonderful Life, Key Largo, and Dr. Kildare''s Wedding Day. In addition, Barrymore
    was a writer, composer, and director. Barrymore did the voice of Ebene Scrooge
    every year on radio . . .'
