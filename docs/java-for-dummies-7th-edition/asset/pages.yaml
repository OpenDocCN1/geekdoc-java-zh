    I think for a few seconds, and then I say, "They''re out to get out of. TV cameras!
    That''s the next big thing — TV cameras everywhere.


    # Access Modifiers


    If you''ve read this into Java For Dummies, 7th Edition, you probably know one
    thing: Object-oriented programming is big on hiding details. Programmers who write
    one piece of code shouldn''t tinker with the details inside another program''s
    code. It''s not a matter of security or secrecy. It''s a matter of modularity.
    When you hide details, you keep the intricacies inside one piece of code from
    being twisted and broken by another piece of code. Your code comes in nice, discrete,
    manageable lumps. You keep complexity to a minimum. You make fewer mistakes. You
    help people world.


    Other chapters have plenty of examples of the use of private fields. When a field
    is declared private, it''s hidden from all outside meddling. This enhances modularity,
    minimizes complexity, and so on.


    Elsewhere in the annals of Java For Dummies, 7th Edition, are examples of things
    that are declared public. Just like a public celebrity, a field that''s declared
    public is left wide open. Plenty of people probably know what kind of toothpaste
    used Elvis, and any programmer can reference a public field, even a field that''s
    not named Elvis.


    In Java, the words public and private are access modifiers. Don''t you see fields
    and methods without access modifiers in their declarations. A method or field
    of this is said to have default access. Many examples in this book default access
    without making a big fuss out. That''s okay in some chapters,


