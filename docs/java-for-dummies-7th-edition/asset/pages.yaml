    # # Closing the connection to a disk file


    To the average user, a keyboard doesn''t feel anything like a file stored on a
    computer''s hard drive. But disk files and keyboard input have a lot in common.
    In fact, a basic principle of operating systems dictates that any differences
    between two kinds of input be, for the programmer, be blurry as possible. As a
    Java programmer, you should treat disk files and keyboard input as the same way.
    That''s why Listing-8 contains a diskScanner.close().


    When you run a Java program, you normally execute the main method''s statements,
    starting with the first statement in the method body and ending with the last
    statement in the method body. You take detours along the way, skipping parts else
    and diving into method bodies, but basically finish executing'
