  md: "# Passing Parameters\n\nA method can communicate with another part of your\
    \ Java program in several ways. One way is through the method's parameter list.\
    \ Using a parameter list, you pass on-the-fly information to a method as the method\
    \ is called.\n\nImagine the information you pass to the method is stored in one\
    \ of your program's variables. What, if anything, does the method actually do\
    \ with that variable? The following sections present a few interesting case studies.\n\
    \n# Pass by value\n\nAccording to my research, the town of Smackover, Arkansas,\
    \ is 2,232 people in it. But my research isn't current. Just yesterday, Dora Kermongoos\
    \ celebrated a joyous occasion over Smackover General Hospital — the birth of\
    \ her healthy, blue-eyed baby (The girl weighs 7 pounds, 4 ounces, and is 21 inches\
    \ tall.) The town's population has risen to 2,233.\n\nListing 10-10 has a very\
    \ bad program in it. The program is supposed to add 1 to a variable that stores\
    \ Smackover's population, but the program doesn't work. Take a look at Listing\
    \ 10-10 and see why.\n\n> LISTING 10-10: This Program Doesn't Work\n\n```\npublic\
    \ class TrackPopulation {\n    public static void main(String args[]) {\n    \
    \    int smackoverARpop = 2232;\n\n        birth(smackoverARpop);\n        System.out.println(smackoverARpop);\n\
    \    }\n\n    static void birth(int cityPop) {\n        cityPop++;\n    }\n}\n\
    ```\n\nWhen you run the program in Listing 10-10, the program displays the 2,232\
    \ onscreen. After nine months of planning and anticipation and Dora's whopping\
    \ seven hours in labor, the Kermongoos family's baby girl wasn't registered in\
    \ the system. What a shame!\n\nCHAPTER 10 Putting Variables and Methods Where\
    \ They Belong 285"
