- pgno: 28
  md: '# # Object-Oriented Programming (OOP)


    It’s three in the morning. I’m dreaming about the history course that I failed
    in high school. The teacher is yelling at me, “You have two days to study for
    the final exam, but you won’t remember to study. You’ll forget and feel guilty,
    guilty.”


    Suddenly, the phone rings. I’m awakened abruptly from my deep sleep. (Sure, I
    disliked dreaming about the history course, but I like being awakened even less).
    At first, I dropped the phone on the floor. After fumbling to pick it up, I issue
    a grumpy, “Hello, who is this?” A voice answers, “I’m a reporter from the New
    York Times. I’m writing an article about Java, and I need to know all about the
    programming language in five words or less. Can you explain it?


    My mind is too hazy. I can’t think. So I say the first thing that comes to my
    mind and go back to sleep.


    Coming morning, I hardly remember the conversation with the reporter. In fact,
    I don’t remember how I answered the question. Did I tell the reporter where he
    could put his article about Java?


    I put on my robe and rush out to my driveway. As I pick up the page and see this
    2-inch headline:


    > Burd Calls Java “A Great Object-Oriented Language”


    # ## Object-oriented languages


    Java is object-oriented. What does that mean? Unlike languages, such as FORTRAN,
    that focus on giving the computer imperative “Do/This/do That” commands, object-oriented
    languages focus on data. Of course, object-oriented programs still tell the computer
    what to do. They start, however, by organizing the data, and the commands come
    later.


    Object-oriented languages are better than “Do/This/do That” languages because
    they organize data in a way that helps people do all kinds of things with it.
    To modify the data, you can build on what you already have rather than scrap everything
    you’ve done and start over each time you need to do something. Although programmers
    are generally smart people, they took a while to figure this out. For the full
    history lesson, the sidebar “The Winding road for FORTRAN to Java” (but I won’t
    make you feel guilty if you don’t read it).'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# THE WINDING ROAD FROM

    FORTRAN TO JAVA


    In the mid-1950s, a team of people created a programming language named FORTRAN.
    It was a good language, but it was based on the idea that you should issue direct,
    imperative commands to the computer. "Do this, computer. Then do that, computer."
    (Of course, the commands in a real FORTRAN program were much more precise than
    "Do this" or "Do that.")


    In the years that followed, teams developed many new computer languages, and many
    of the languages copied the FORTRAN "Do this/Do that" model. One of the most popular
    was the 1-letter name C. Of course, the thing that had some renegades. In languages
    named SIMULA and Smalltalk, programmers moved the imperative "Do this" commands
    into the background and concentrated on descriptions of data. In languages, you
    didn''t come right out and say, "Print a list of delinquent accounts." Instead,
    you began by saying, "This is what it means to be an account. An account has a
    name and a balance." Then you said, "This is how an account whether it''s delinquent."
    Suddenly, the data became a thing that had no name, a balance, and a way of telling
    whether it was delinquent.


    Languages that focus first on the data are called object-oriented programming
    languages. These object-oriented languages make excellent programming tools.

    Here''s why:


    +   - Thinking first about the data makes you a good computer programmer.

    - You can extend and reuse the descriptions of data over and over again. When
    you try to teach old FORTRAN programs new tricks, however, the old programs how
    brittle they are. They break.


    In the 1970s, object-oriented languages, like SIMULA and Smalltalk, were buried
    in the computer hobbyist magazine articles. In the meantime, languages based on
    the old FORTRAN model were multiplying rabbits.


    So in 1986, a fellow named Bjarne Stroustrup created a language named C++. The
    C++ language became very popular because it mixed the old C language terminology
    with the improved object-oriented structure. Many companies turned their back
    on the old FORTRAN/C programming style and adopted C++ as their standard.


    (continued)'
