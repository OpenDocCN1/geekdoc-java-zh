    \n# Finishing the Job with a finally Clause\n\nOnce upon a time, I was a young\
    \ fellow, living with my parents in Philadelphia, just starting to drive a car.\
    \ I was heading toward a friend's house and thinking about who-knows-what when\
    \ another car came out from nowhere and bashed my car's passenger door. This kind\
    \ of thing is called a RunAndRedLightException.\n\nAnyway, both cars were still\
    \ drivable, and we were right in the middle of a busy intersection. To avoid causing\
    \ a traffic jam, we pulled over to the nearest curb. I fumbled for my driver's\
    \ license (which had a very young picture of me on it) and opened the door to\
    \ get out of my car.\n\nAnd that's when the second accident happened. As I was\
    \ getting out of my car, a city bus was coming by. The bus hit me and I rolled\
    \ against my car a few times. This kind of thing is called a DealWithLawyersException."
