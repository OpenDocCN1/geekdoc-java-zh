    # Chapter 8


    # Saving Time and Money: Reusing Existing Code


    Once upon a time, there was a beautiful princess. When the princess turned 25
    (the optimal age for strength, good looks, and fine moral character), her kind,
    old father brought her a gift in a lovely golden box. Anxious to know what was
    in the box, the princess ripped off the golden wrapping paper.


    When the box was finally opened, the princess was thrilled. To her surprise, her
    father had given her what she had always wanted: a computer program that always
    ran correctly. The program did everything the princess wanted, and did it all
    exactly the way she wanted it to be. The princess was happy, and so was her father.


    Even as time marched on, the computer program never failed. For years on, the
    princess changed her needs, expected more out of life, made increasing demands,
    expanded her career, reached for more more fulfillment, juggled the desires of
    her husband and her kids, stretched the budget, and sought peace within her soul.
    Through all of this, the program remained steady, faithful companion.


    As the princess grew old, the program became old along with her. One evening,
    she sat by the fireside, and asked a daunting question to the program: “How do
    you do it?” she asked. “How do you manage to keep giving the right answers, time
    after time, year after year?”'
