  md: '# Reading a line at a time


    In Listing 8-2, the payOneEmployee method illustrates some useful tricks for reading
    data. In particular, every scanner that you create has a nextLine method. (You
    might not use this nextLine method, but the method is available nonetheless.)
    When you call a scanner''s nextLine method, the method grabs everything up to
    the end of the current line. In Listing 8-2, a call to nextLine can read a whole
    line from the EmployeeInfo.txt file. (In another program, a scanner''s nextLine
    may read everything the user types on the keyboard up to the press of the key.)


    Notice my careful choice of words: nextLine reads everything "up to the end of
    the current line." "Unfortunately, what it means to read up to the end of the
    line isn''t always what you think it is. Intermingling nextInt, next Double, and
    nextLine calls can be messy. You have to watch what you''re doing and check your
    program''s output carefully.


    Understand all of this, which need to be painful of a data file''s line breaks.
    Think of a line break as an extra character, between one line of text and the
    next. Imagine that calling nextLine means to read everything up to and including
    the next line.


    Now a look at Figure 8-4:


    +   * If one call to nextLine reads Barry Burd[LineBreak], the subsequent call
    to nextLine reads CEO[LineBreak].

    * If one call to nextDouble reads the number 5000.00, the subsequent call to nextLine
    reads [LineBreak] that comes immediately after the number 5000.00. (That''s all
    the nextLine reads a [LineBreak] and nothing more.)

    * If a call to nextLine reads the [LineBreak] after the number 5000.00, the subsequent
    call to nextLine reads Harriet Ritter[LineBreak].


    So, after reading the number 5000.00, you need two calls to nextLine in order
    to scoop the name Harriet Ritter. The mistake that I usually make is to forget
    the first of those two calls.


    > Look at the file in Figure 8-3. For this''s code to work correctly, you must
    have a line break after the last 10000. 00. If you don''t, a final call to nextLine
    makes your program crash and burn. The error message reads NoSuchElement Exception:
    No line found.


