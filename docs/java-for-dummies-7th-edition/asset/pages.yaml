    # Testing for the presence of data


    Here''s a pleasant surprise. When you write a program like the one shown previously
    in Listing 12-1, you don''t have to know how many names are in the input file.
    Having to know the number of names may defeat the purpose of using the easily
    expandable ArrayList class. Rather than loop until you exactly nine names, you
    can loop until you run out of data.


    The Scanner has several methods, such as hasNext, hasNextDouble, and plain old
    hasNext. Each of these methods checks for input data. If there''s more data, the
    method returns true. Otherwise, the method returns false.


    Listing 12-1 uses the general-purpose hasNext method. This hasNext returns true
    as long as there''s anything to read from the program''s input. After the program
    scoops up that last Hugh R. DataReader in Figure 12-1, the subsequent hasNext
    calls false. This false condition execution of the while loop and plummets the
    computer toward the remainder of Listing 12-1 code.


    The hasNext method is quite handy. In fact, hasNext is so handy that it''s part
    of a bigger concept known as an iterator, and iterators are baked into all of
    Java''s collections.


    # Using an iterator


    An iterator spits out a collection''s values, one after another. To obtain a value
    from the collection, you call the iterator''s next method. To find out the collection
    has any more values in it, you call the iterator''s hasNext method. Listing 12-2
    uses an iterator to display people''s names.


    Listing 12-2: Iterating through a Collection


    ```

    import static java.lang.System;

    import java.util.Iterator;

    import java.util.Scanner;

    import java.io.File;

    import java.io.IOException;

    import java.util.ArrayList;

    ```'
