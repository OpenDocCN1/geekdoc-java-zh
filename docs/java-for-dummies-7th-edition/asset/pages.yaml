  img_proc: true
- pgno: 437
  md: '# Using (or Not Using) Abstract Methods


    | | In an Ordinary (Non-Abstract) Class | In an Interface | In an Abstract Class
    |

    |---|---|---|---|n| Are abstract methods allowed? | No | Yes | Yes |

    | Can a method declaration contain the abstract keyword? | No | Yes | Yes |

    | Can a method declaration contain the default keyword (meaning "not abstract")
    | No | Yes | No |

    | With neither the abstract nor the default keyword, what is this: | Not abstract
    | Abstract | Not abstract |


    +   > **Extending a subclass represents an is a relationship.**

    > Think about the relationships in this chapter''s earlier section "Abstract Classes."
    A house pet is an animal. A dog is a house pet. A cat is a house pet.

    >

    > **Implementing an interface represents a can do relationship.**

    > Think about the relationships in this chapter''s earlier section "The Java Interface."
    The first line in Listing 15-3 says implements Displayable. With these words,
    the code promises that each ColumnNumbers object can be displayed. Later in same
    listing, you make good on the promise by declaring a display method.

    > Think about the relationships in this chapter''s earlier section "The Java Interface."
    A column of numbers is not always a summarizable thing. But in Listing 15-3, you
    promise that the ColumnNumber objects will be summarizable, and you make good
    on the promise by declaring a summarize method.


    If you want more tangible evidence of the difference between an interface and
    an abstract class, consider this: A class can extend only one class, even if one
    class is an abstract class. So, after you''ve declared


    ```

    public class Dog extends HousePet

    ```


    you can''t also make Dog extend a Friend class. But you can make Dog a Befriendable
    interface. And then you can make the same Dog class implement a Trainable interface.
    (By the way, I''ve tried making my Cat implement a Trainable interface but, but
    for some reason, it never works.)'
  merge: -1
  img_proc: true
- pgno: 438
  md: 'And, if you want an even more tangible difference between an interface and
    an abstract class, I have one for you: An interface can''t contain any non-static,
    non-final fields. For example, if the HousePet class in Listing 15–7 were an interface,
    it couldn''t have a name field. That simply wouldn''t be allowed.


    So there. Interfaces and abstract classes are different from one another. If you''re
    new at the game, you shouldn''t worry about the difference. Just read as much
    code as you can, and don''t get scared when you see an abstract method. That''s
    all there is to it.'
