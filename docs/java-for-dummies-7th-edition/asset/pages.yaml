    # Why both?


    The chain of method calls in Listing 12-5 accomplishes everything that the loop
    in Listing 12-4 accomplishes. But the code in Figure 12-14 uses concepts from
    functional programming. What’s the big deal? Are you better off with Listing 12-5
    than with Listing 12-4?


    You are. For the past several years, the big trend in chip design has multicore
    processors. With several cores, a processor can execute several statements at
    the same time, speeding up a program’s execution by a factor of 2, or 4 or even
    more. Programs run much faster if you divide the work among several cores. How
    do you divide the work?


    You can modify the imperative code in Listing 12-4. For example, with some fancy
    features, you can handle different iterations to different cores. But the result
    is messy. For the code to work properly, you have to micromanage the loop iterations,
    checking to make sure that the final total is correct.


    In contrast, the functional code is easy to modify. To take advantage of multicore
    processors, you can change only one core in Listing 12-5!


    ```

    sales.parallelStream()

    .filter(sale) -> sale.getItem().equals("DVD")

    .map(sale) -> sale.getPrice())

    reduce(0.0, price1, price2) -> price1 + price2;

    ```


    In Listing 12-5, the stream() method creates a serial stream. Java does one sale
    at a time. But a call to parallelStream() creates a different kind of stream:
    a parallel stream. With a parallel stream, Java divides the work among the number
    of cores in the computer’s processor (or according to some other useful measure
    of computing power). If you have 4 million sales and four cores, each core processes
    1 million of the sales.


    Each core works independently of the others, and each core dumps its result into
    a final reduce method. The reduce method combines the cores'' results into a final
    tally. In the best possible scenario, all the work gets done in one-fourth of
    the time it would take with an ordinary stream.


    348 PART 4 Smart Java Techniques'
