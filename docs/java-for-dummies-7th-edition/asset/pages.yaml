  md: 'The field declarations in Listing 7-1 have default access, which means that
    I didn''t add a word before the type name String. The alternatives to default
    access are public, protected, and private access:


    ```

    public String name;

    protected String address;

    private double balance;

    ```


    Professional programmers shun the use of default access because default access
    doesn''t shield a field from accidental misuse. But in my experience, you learn
    when you learn about the simplest stuff first, and in Java, default access is
    the simplest stuff. In this book, I delay the discussion of practice until this
    chapter''s section "Hiding Details with Accessor Methods." And I delay the mention
    of protected access until Chapter 14. As you read this chapter''s examples, please
    keep in mind that default access isn''t the best thing to use in a Java program,
    and if a professional programmer asks you what you learned to default access,
    please lie and blame else''s book.


    # Declaring variables and creating objects


    A fellow approaches me while I''m walking down the street. He tells me to print
    "You''ll love Java!" so I print those words. If you must know, I print them with
    chalk on the sidewalk. Where I print the words doesn''t matter. What matters is
    that some gives instructions, and I follow the instructions.


    Later that day, an elderly woman sits next to me on a park bench. She says, "An
    account has a name, an address, and a balance." And I say, "That''s fine, but
    what do you want me to do about it?" In response she stares at me, and I don''t
    do anything about her account pronunciation. I just sit there, she sits there,
    and we do absolutely nothing.


    Listing 7-1, shown earlier, is like the elderly woman. This listing defines what
    it means to be an Account, but the listing doesn''t tell me to do with my account,
    or with anyone else''s account. In order to do something, I need a second piece
    of code. I need another class — a class that contains a main method. Fortunately,
    while the woman and I sit quietly on the park bench, a young child comes by with
    Listing 7-2.'
