  md: "# LISTING 15-7: What It Means to Be a House Pet\n\n```\npublic abstract class\
    \ HousePet extends Animal {\n    String name;\n\n    public HousePet(String name,\
    \ double weight, String sound) {\n        super(weight, sound);\n        this.name\
