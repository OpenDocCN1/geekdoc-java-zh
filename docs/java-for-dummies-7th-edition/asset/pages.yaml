  md: "A class is a bunch of stuff that a class inherits. An interface is a bunch\
    \ of stuff that an implementing class is obliged to provide.\n\nWhat about poor\
    \ Barry? He can be an instance of a Person class with all the fields that any\
    \ person has — name, address, age, height, weight, and so on. He can also implement\
    \ than one interface:\n\n+   Because Barry implements a Professor interface, he\
    \ must have methods named teachStudents, adviseStudents, and gradePapers.\n\n\
    +   Because he implements an Author interface, he must have methods named writeChapters,\
    \ reviewChapters, answerEmail, and so on.\n\n# # Two interfaces\n\nImagine two\
    \ different kinds of data. One is a column of numbers that comes from an array.\
    \ Another is a table (with rows and columns) that comes from a disk file. What\
    \ these two things have in common?\n\nI don't know about you, but I might want\
    \ to display kinds of data. I can write code to create a contract. The contract\
    \ says, \"Whoever signs this contract agrees to have a display method.\" In Listing\
    \ 15-1, I declare a Displayable interface.\n\n**Listing 15-1:** Behold! An Interface!\n\
    \n```\npublic interface Displayable {\n\n    public void display();\nn}\n```\n\
    \nWait just a damn minute! The display method declaration in Listing 15-1 has\
    \ a header but no body. There are no curly braces after display() — only a lonely-semicolon.\
    \ What's going on here?\n\nTo answer the question, I'll let the code in Listing\
    \ 15-1 speak for itself. If the code in the listing could talk, here's what the\
    \ code would say:\n\n\"As an interface, my display method has a header but no\
    \ body. A class that claims to implement me (the Displayable interface) must provide\
    \ (either directly or indirectly) a body for the display method. That is, a class\
    \ claims to"
  merge: -1
  img_proc: true
- pgno: 424
  md: "implement Displayable must, in one way or another, provide its own code of\
    \ the following kind:\n\n```\npublic void display() {\n    // Some statements\
    \ go here\n}\n```\n\nIn order to implement me (the interface in Listing 15-1),\
    \ the new code's display method must take no parameters and return nothing (also\
    \ known as void).\n\nThe Displayable interface is like a legal contract. The Displayable\
    \ interface doesn't tell you what an implementing class already has. Instead,\
    \ the Displayable interface tells you what an implementing class must declare\
    \ in its code.\n\nIn addition to displaying columns of numbers and tables, I may\
    \ also want to summarize kinds of data. How do you summarize a column of numbers?\
    \ I don't know. Maybe you display the total of all the numbers. How do you summarize\
    \ a table? Maybe you display the table's column headings. How you summarize the\
    \ data isn't my concern. All I care about that you have some way to summarize\
    \ the data.\n\nSo I create code containing a second Java contract. The second\
    \ contract says, \"Whoever signs this contract agrees to have a summarize method.\"\
    \ In Listing 15-2, I declare a Summarizable interface.\n\n# LISTING 15-2: Another\
    \ Interface\n\n```\npublic interface Summarizable {\n\n    public String summarize();\n\
    \n}\n```\n\nAny class claiming to implement the Summarizable interface must, by\
    \ hook or by crook, provide an implementation of a summarize method — a method\
    \ with no parameters that returns a String value.\n\nIn the declaration of an\
    \ interface, a particular method might have no body of its own. A method with\
