  md: 'object, an instance of the Exception class, is passed like a hot potato from
    one piece of code to another until some piece of code decides to catch the exception.
    When the exception is caught, the program executes some recovery code, buries
    the exception, and moves on to the next normal state as if nothing had ever happened.
    The process is illustrated in Figure 13-2.


    The whole thing is done with the aid of several Java keywords. These keywords
    are described in this list:


    +   - throw: Creates new exception object.

    - throws: Passes the buck from a method up to whatever code called the method.


    ![](img/ceb51741697a1347a52f2b180d896ec0_366_0.png)


    Figure 13-2:

    Throwing,

    passing,\sand catching

    exception.


    +   - try: Encloses code that has the potential to create a new exception object.

    In the usual scenario, the code inside a try clause contains calls to methods
    whose code can create or more exceptions.

    - catch: Deals with the exception, buries it, and then moves on.


    The truth is out. Through some chain of events like the one shown in Figure 13-2,
    the method Integer.parseInt can throw a NumberFormatException. When you call Integer.parseInt,
    this NumberFormatException is passed on to you.


