  md: 'The if part in Listing 5-1 seems to have more than one statement in it. I make
    this happen by enclosing the three statements of the if part in a pair of curly
    braces. When I do this, I form a block. A block is a bunch of statements hunched
    together by a pair of curly braces.


    With this block, three calls to printf are tucked away inside the if part. With
    the curly braces, the rows of asterisks and the rows You win only when the user''s
    guess is correct.


    This business with blocks and curly braces applies to the if part as well. In
    Listing 5-1, when inputNumber doesn''t equal randomNumber, the computer executes
    three print/printf calls. To convince the computer that all three of these calls
    are inside the else clause, I put these into a block. The trick is, these three
    calls in a pair of curly braces.


    ![](img/ceb51741697a1347a52f2b180d896ec0_125_0.png)


    Strictly speaking, Listing 5-1 has only one statement between the if and the else
    statements and only one statement after the else statement. The trick is that
    when you place a bunch of statements inside curly braces, you get a block; and
    a block behaves, in all respects, like a single statement. In fact, the official
    Java documentation lists blocks as one of the many kinds of statements. So, in
    Listing 5-1, the block that prints You and asterisks is a single statement that
    has, within it, three smaller statements.


    # # Indenting if statements in your code


    Notice how, in Listing 5-1, the print and printf calls inside the if statement
    are indented. (This includes both the You and You lose statements. The print and
    printf calls that come after the word else are still part of the if statement.)
    Strictly speaking, you don''t have to indent the statements that are inside an
    if statement. For all the compiler, you can write your program on a single line
    or place all your statements in haphazard zigzag. The problem is neither you anyone
    else can make sense of your code if you don''t indent your statements in some
    logical fashion. In Listing 5-1, the indenting of the print and printf statements
    helps your eye (and brain) see that these statements are subordinate to the overall
    if/else flow.


    In a small program, unindented or poorly indented code is barely tolerable. But
    in a complicated program, indentation doesn''t follow a neat, pattern like a big,
    ugly nightmare.


    Many Java IDEs have tools to indent your code automatically. This is one of my
    favorite IDE features. So don''t walk — run to computer, and visit this book''s
    website (www.allmycode.com/JavaForDummies) for more information on what Java IDEs
    can offer.


