    \ a look at\nListing 13-8 for a minute, and then I'll tell you what's wrong with\
    \ it.\n\n# LISTING 13-8: An Incorrect Program\n\n```\n/* * This code does not\
    \ compile.\n */\n\nimport static java.lang.System.out;\n\npublic class NoSleepForTheWeary\
    \ {\n\n    public static void main(String[] args[]) {\n        out.print(\"Excuse\
    \ me while I nap\");\n        out.println(\"for just five seconds...\");\n\n \
    \       takeNap();\n\n        out.println(\"Ah, that was refreshing.\");\n   \
    \ }\n\n    static void takeNap() {\n        Thread.sleep(5000);\n    }\nn\n```\n\
    \nThe strategy in Listing 13-8 isn't bad. The idea is to call the sleep method,\
    \ which\nis defined in the Java API. This sleep method belongs to the API Thread\
    \ class.\nWhen you call the sleep method, the number that you define is a number\
    \ of\nmilliseconds. So Thread.sleep(5000) means pause for five seconds.\n\nThe\
    \ problem is that the code inside the sleep method can throw an exception.\nThis\
    \ kind of exception is an instance of the InterruptedException class. When\ny\
    \ compile the code in Listing 13-8, you get a message such as\n\n> reported exception\
    \ java.lang.InterruptedException;\nmust be caught or declared to be thrown\n\n\
    Maybe the message reads\n\n> Unhandled exception type InterruptedException\n\n\
    One way or another, the message is unwelcome."
