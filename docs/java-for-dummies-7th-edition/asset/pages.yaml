  md: 'To better understand the throws clause, imagine a volleyball game in which
    the volleyball is an exception. When a player on the other team serves, that player
    is throwing the exception. The ball crosses the net and comes right to you. If
    you pound the ball back across the net, you''re catching the exception. If you
    pass the ball to another player, you are using the throws clause. In essence,
    you say-say, "Here, other player. You deal with this exception."


    A statement in a method can throw an exception that''s not matched by a catch
    clause. This includes situations in which the statement the exception isn''t even
    inside try block. When this happens, execution of the program jumps out of the
    method that contains the offending statement. Execution jumps back to whatever
    code called the method in the first place:

    example:


    A method can name more than one exception type in its throws clause. Just use
    commas to separate the names of the exception, as in the following


    ```

    throws InterruptedException, IOException, ArithmeticException

    ```


    The Java API has hundreds of exception types. Several of them are subclasses of
    the RuntimeException class. Anything (or a sub-class, sub-sub-sub, and so on)
    subclass of RuntimeException is unchecked. The unchecked exception that''s not
    a descendent of RuntimeException is checked. Such things include things that would
    be for the computer to predict. Such things include the NumberFormatException,
    the IndexOutOfBoundsException, the infamous ArithmeticException, the infamous
    NullPointerException, and many others. When you write Java code, much of your
    code is susceptible to these exceptions, but enclosing the code in try clauses
    (or passing the back with throws clauses) is completely optional.


    The Java API also has its share of checked exceptions. The computer can readily
    detect exceptions of this kind. So Java insists that, for an exception of this
    kind, any potential exception-throwing statement is acknowledged by either a try
    statement or throws clause. Java''s checked exceptions include the Interrupted
    Exception (Listings 13-9 and 13-10), the IOException, the SQLException, and a
    gang of other exceptions.


