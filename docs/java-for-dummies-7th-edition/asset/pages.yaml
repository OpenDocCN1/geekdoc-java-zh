  md: 'Back in Listing 13-4, a new OutOfRangeException instance is thrown. When this
    happens, the catch clause (OutOfRangeException e) catches the instance. The clause
    echoes the user''s input and displays That''s impossible!


    The text @SuppressWarnings("serial") in Listing 13-3 is a Java annotation. For
    an introduction to annotations, see Chapter 8. For a few words about the SuppressWarnings
    annotation, see Chapter 9.


    ![](img/ceb51741697a1347a52f2b180d896ec0_371_0.png)


    If you Use Eclipse, you might see a yellow warning marker to the throw new OutOfRangeException()
    in Listing 13-4. When you hover the pointer over the warning marker, Eclipse says,
    Resource leak: ''keyboard'' is not closed you executes the keyboard.close() statement.
    (Yes, under circumstances, throwing the OutOfRangeException can cause the program
    to skip the keyboard.close() statement. But no, that can''t happen when you run
    the code in Listing 13-4.) In my opinion, you can safely ignore this warning.


    ![](img/ceb51741697a1347a52f2b180d896ec0_371_1.png)


    # Who''s going to catch the exception?


    Notice one more look at Listing 13-4. Notice that one catch clause can accompany
    a single try clause. When an exception is thrown inside a try clause, the computer
    starts going the accompanying list of catch clauses. The computer starts at whatever
    catch clause comes immediately after the try clause and works its way through
    the program''s text.


    For each catch clause, the computer asks itself, "Is that the exception that was
    thrown an instance of the class in this clause''s parameter list?"


    +   * If not, the computer skips this catch clause and moves on to the next catch
    clause in line.

    * If so, the computer executes this catch clause and then skips all other catch
    clauses that come with this try clause. The computer goes on and executes whatever
    statements after the whole try-catch example.


    For some concrete examples, see Listings 13-5 and 13-6.


    LISTING 13-5: Yet Another Exception


