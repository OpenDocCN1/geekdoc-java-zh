    # The double equal sign


    In Listing 5-1, in the if statement''s condition, notice the use of the double
    equal

    s Comparing two numbers to see whether they''re the same isn''t the same as

    setting something to something else. That''s why the symbol to compare for

    equality isn''t the same as the symbol''s used in an assignment or an initial-

    ization. In an if statement''s condition, you can''t replace the double equal
    sign

    s a single equal sign. If you do, your program won''t work. (Almost

    always get an error message when you try to compile your.)


    On the other hand, if you never make the mistake of using a single equal sign
    in

    condition, you''re not normal. Long ago, while I was teaching an introductory

    Java course, I promised that I''d swallow my laser pointer if no one made the
    single

    e sign during any of my lab sessions. This wasn''t an idle promise.

    I''ve never had to keep it. As it turned out, even if I had ignored the first

    times anybody made the single equal sign mistake during those lab sessions,

    I would still be laser-pointer-free. Everybody mistakenly uses the single equal

    sign several times in a programming career.


    The trick is not avoid making the single–equal–sign mistake; the trick is to

    catch the mistake whenever you make it.


