- pgno: 48
  md: '![](img/ceb51741697a1347a52f2b180d896ec0_48_0.png)


    FIGURE 2-1:

    An imaginary meeting of the UN Security Council.


    Think of your interpreter as a virtual ambassador. The interpreter doesn''t really
    represent your country, but the interpreter performs one of the important tasks
    that a real ambassador performs. The interpreter listens to bytecode on your behalf.
    The interpreter does what you would do if your native language were Java bytecode.
    The interpreter pretends to be the Windows ambassador and sits through the boring
    bytecode speech, in taking every word and processing each in some way or another.


    You have an interpreter — a virtual ambassador. In the same way, a Windows computer
    runs its own bytecode-interpreting software. That software is the Java Virtual
    Machine.


    Java Virtual Machine is a proxy, an errand boy, go-between. The JVM serves as
    an interpreter between Java''s run-where bytecode and your computer''s system.
    While it runs, the JVM walks your computer through the execution of bytecode instructions.
    The JVM examines your bytecode, bit by bit, and carries out the instructions described
    in the bytecode for your Windows system, your Mac, or your Linux box, or for whatever
    kind of computer you''re using. That''s a good thing. It''s what makes Java programs
    more portable than in any other language.


    # PART 1 Getting Started with Java'
