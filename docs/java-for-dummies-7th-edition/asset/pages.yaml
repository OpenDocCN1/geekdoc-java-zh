  md: '# A Java program requires the verbose introduction because


    +   * In the entire program is a class.

    * The main method is called into action automatically when the program begins
    running.


    I explain all of this in Chapter 3.


    Anyway, retyping this boilerplate code into an editor window can be annoying,
    especially when your goal is to test the effect of a few simple states. To fix
    this problem, the stewards of Java came up with a new tool in Java 9. They call
    it JShell.


    Instructions for launching JShell differ from one computer to the next. Instructions
    that work on your computer, visit this book''s website (www.allmycode.com/JavaForDummies).


    ![](img/ceb51741697a1347a52f2b180d896ec0_91_0.png)


    When you use JShell, hardly ever type an entire program. Instead, you type a Java
    statement, and then JShell responds to your statement, and then you type a second
    statement, and then JShell responds to your second statement, and then you type
    a third statement, and so on. A single statement is enough to get a response from
    JShell.


    JShell is only one example of a language''s Read-Evaluate Print Loop (REPL). Many
    programming languages have REPLs and, with Java 9, the Java language finally has
    a REPL of its.


    In 4-7, I use JShell to find how JShell responds to the assignment statements
    in Listings 4-2 and 4-3.


    When you run JShell, the dialogue goes something like this:


    ```

    jshell> You type a statement

    jshell responds


    jshell> You type another statement

    jshell responds

    ```


    For example, in Figure 4-7, I type double amountAccount and then press Enter.
    JShell responds by displaying


    ```

    amountAccount == 0.0

    ```'
