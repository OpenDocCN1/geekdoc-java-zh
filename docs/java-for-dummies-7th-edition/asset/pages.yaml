  md: "# LISTING 11-3: Get a Lo'o That for Loop!\n\n```\nimport static java.lang.System.out;\n\
    \npublic class ShowGuests {\n\n    public static void main(String args[]) {\n\
    \        int guests[] = {1, 4, 2, 0, 1, 4, 3, 0, 2};\n        int roomNum = 0;\n\
    \n        out.println(\"Room\\tGuests\");\n\n        for (int numGuests : guests)\
    \ {\n            out.print(roomNum++);\n            out.print(\"\\t\");\n    \
    \        out.println(numGuests);\n        }\n    }\n}\n```\n\nListings 11-1 and\
    \ 11-3 have the same output. It's in Figure 11-4.\n\nAn enhanced for statement\
    \ has three parts:\n\n```\nfor (variable-type variable-name : range-of-values)\n\
    ```\n\nThe first two parts are variable-type and variable-name. The loop in Listing\
    \ 11-3 defines a variable named numGuests, and numGuests has type int. During\
    \ loop iteration, the variable numGuests takes on a new value. Look at Figure\
    \ 11-4 to see these values. The initial value is 1. The next value is 4. After\
    \ that comes 2. And so on.\n\nWhere is the loop finding all these numbers? The\
    \ answer lies in the loop's range-of-values. In Listing 11-3, the loop's range-of-values\
    \ is guests. So, during the initial loop iteration, the value of numGuests is\
    \ guests[0] (which is 1). During the next iteration, the value of numGuests is\
    \ guests[1] (which is 4). After that comes guests[2] (which is 2). And so on.\n\
    \n> Java's enhanced for loop requires a word of caution. Each time through the\
    \ loop, the variable that steps through the range of values stores a copy of the\
    \ value in the original range. The variable does not point to the range itself.\n\
    \nFor example, if you add an assignment statement that changes the value of numGuests\
    \ in Listing 11-3, this statement has no effect on the values stored\n\nCHAPTER\
    \ 11 Using Arrays to Juggle 301"
