    # Relax! You''re Not Seeing Double!


    If you''ve read this chapter''s earlier sections on interfaces and abstract methods,
    your head might be spinning. Both interfaces and abstract classes have abstract
    methods. The abstract methods play slightly different roles in these kinds of
    reference types. How can you keep it all straight in your mind?


    The first thing you to do is to remember that no one learns about object-oriented
    programming concepts without getting lots of practice in writing code. If you''ve
    read this chapter and you''re confused, that may be a good thing. The more you''ve
    understood enough to know how complicated this stuff is. The more comfortable
    you''ll become with classes, and all of these other ideas.


    The next thing to do is to sort out the differences in what you declare abstract
    methods. Table 15-1 has the story.


    Both interfaces and abstract classes have abstract methods. So you may be wondering
    how you should choose between declaring an interface and declaring an abstract
    class. In fact, you may ask three professional programmers how interfaces and
    abstract classes differ from one another. If you do, you may get five different
    answers. (Yes, five answers; not three answers.)


    Interfaces and abstract classes are similar beasts, and the new features in Java
    8 made them even more similar than in previous Java versions. But the basic idea
    is about the relationships among things.'
