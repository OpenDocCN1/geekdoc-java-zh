  md: "# Overriding Existing Methods (Changing the Payments for Some Employees)\n\n\
    Wouldn't you know it! Some knucklehead in the human resources department offered\
    \ double pay for overtime to one of your part-time employees. Now word is getting\
    \ around, and some of the other part-timers want double pay for their overtime\
    \ work. If this keeps up, you'll end up in poverty, so you will need to send out\
    \ a memo to the part-time employees, explaining why earning money is not to their\
    \ benefit.\n\nIn the meantime, you have two kinds of part-time employees — the\
    \ ones who receive double pay for overtime and the ones who don't so you need\
    \ to modify your payroll software. What are your options?\n\n+   Well, you can\
    \ dig into the PartTimeEmployee class code, make a few changes, and hope for the\
    \ best (Not a good idea!)\n\n+   You can follow the previous section's advice\
    \ and create a subclass of the existing PartTimeEmployee class. \"Wait,\" you\
    \ say,\"The existing PartTimeEmployee class already has a findPayment method.\
    \ Do I need some trick of bypassing this existing findPaymentAmount for each double-pay-for-overtime\
    \ employee?\"\n\nAt this point, you can thank your lucky stars that you're doing\
    \ object-oriented programming in Java. With object-oriented programming, you can\
    \ create a subclass that overrides the functionality of its parent class. Listing\
    \ 8-7 has just such a subclass.\n\n# LISTING 8-7: Another Subclass\n\n```\npublic\
    \ class PartTimeWithOver extends PartTimeEmployee {\n\n    @Override\n    public\
    \ double findPaymentAmount(int hours) {\n\n        if(hours <= 40) {\n       \
    \     return getHourlyRate() * hours;\n        } else {\n            return getHourlyRate()\
    \ * 40 + getHourlyRate() * 2 * (hours - 40);\n        }\n    }\n}\n```"
