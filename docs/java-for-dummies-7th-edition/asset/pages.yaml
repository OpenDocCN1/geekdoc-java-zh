  md: '# WHAT''S THIS ALL ABOUT?


    Suppose your code contains a constructor — the first of the two constructors in
    Listing 9-4. The whatever parameter is passed a number like 32.0, for instance.
    The first statement in the constructor''s body assigns that value 32, 0, to the
    new object''s number field. The code works. By writing this code, you had to make
    up a new name for a parameter — name whatever. And the only purpose for this new
    name is to hand a value to the object''s number field. What a waste! To distinguish
    between the parameter and the number field, you gave a name to something that
    was just momentary-storage for the number value.


    Making up names is not an art, I''ve gone through plenty of naming phases. Years
    ago, whenever I needed a name for a parameter, I picked a confusing spelling of
    the original variable name. (I name the parameter something like number or number.)
    I also tried changing the variable''s capitalization to come up with a parameter
    name. (I use parameter names like Number or NUMBER.) I call all my parameters
    by adding the suffix In to their corresponding variable names. (The jobTitle variable
    matched with the job parameter.) None of these naming schemes works — I can never
    remember the quirky new names that I created. The good news is that this parameter-naming
    effort isn''t necessary. You can give the parameter the same name as the variable.
    To distinguish the two, use the java keyword this.


    In general, this, someName refers to a field belonging to the object that contains
    the code. In contrast, plain someName refers to the closest place where someName
    happens to be declared. In this statement this.number = number (refer to Listing
    9-2), that closest place happens to be the Temperature constructor''s parameter
    list.


