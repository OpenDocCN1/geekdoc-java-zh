  md: 'any || operator. So the expression really asks whether 2 < 5 || (something-other).
    Because 2 < 5 is true, the expression is true.


    To change the expression''s value from true to false, you can put the expression''s
    first two comparisons in parentheses, like this:


    ```

    (2 < 5 || 100 < 6) && 27 < 1

    ```


    Java''s || operator is inclusive. This means that you get a true value whenever
    the thing on the left is true, the thing on the right side is true, or both things
    are true. For instance, the expression 2 < 10 || 20 < 30 is true.


    In Java, you can''t combine comparisons as you do in ordinary English. In English,
    you may say, "We''ll have between three and ten people at the dinner party." But
    in Java, you get an error message if you write 3 <= people <= 10. To do this comparison,
    you need something like 3 <= people && people <= 10.


    In Listing 5-4, the statement condition has more than a dozen parentheses. What
    happens if you omit two of them?


    ```

    username != null && password != null &&

    // open parenthesis omitted

    (username.equals("bburd") && password.equals("swordfish")

    username.equals("hritter") && password.equals("preakston")

    // close parenthesis omitted

    ```


    Java tries to interpret your wishes by grouping everything before the "or" (the
    || operator):


    ```

    username != null && password != null &&

    (username.equals("bburd") && password.equals("swordfish")

    ||

    (username.equals("hritter") && password.equals("preakston"))

    ```


    When the user clicks Cancel and username is null, Java says, "Okay! The stuff
    before the || operator is false, but maybe the stuff after the || operator is
    true. I''ll check the stuff after the || operator to find out it''s "true." (Java
    often talks to itself. The psychiatrists are monitoring this situation.)


    126 PART 2 Writing Your Own Java Programs'
