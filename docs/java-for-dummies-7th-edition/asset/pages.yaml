- pgno: 31
  md: 'Now notice that I put the word classes first. How dare I do this! Well, I''m
    not so crazy. Think again about a housing development that''s under construction.
    Somewhere on the lot, in a rickety trailer parked on bare dirt, is a master list
    of characteristics known as a blueprint. An architect''s blueprint is an object-oriented
    programmer''s class. A blueprint is a list of characteristics that each house
    will have. The blueprint says, "siding." The actual object has gray siding. The
    blueprint says, "kitchen cabinet." The actual object has Louis XIV kitchen cabinets.


    The analogy doesn''t end with lists of characteristics. Another important parallel
    exists between blueprints and classes. A year after you create the blueprint,
    you use it to build ten houses. It''s the same with classes and objects. First,
    the programmer writes code to describe a class. When the program runs, it creates
    objects from the (blueprint) class.


    So that''s the real relationship between classes and objects. The programmer defines
    a class, and from the class definition, the computer makes individual objects.


    # What''s so good about an object-oriented language?


    Based on the preceding section''s story about home building, imagine that you''ve
    already written a computer program to keep track of the building instructions
    for houses in a new development. Then, the big boss decides on a modified plan
    — a plan in half the houses have three bedrooms and the other half four.


    If you use the old FORTRAN/C style of computer programming, your instructions
    look like this:


    ```

    Dig a ditch for the basement.

    Lay concrete around the sides of the ditch.

    Put two-by-fours along the sides for the basement''s frame.

    ```


    This would be like an architect creating a long list of instructions instead of
    a blueprint. To modify the plan, you have to sort through the list to find the
    instructions for building bedrooms. To make things worse, the instructions could
    be scattered among pages 234, 394–410, 739, 10, and 2. If the builder had to decipher
    other people'' complicated instructions, the task would be times harder.'
