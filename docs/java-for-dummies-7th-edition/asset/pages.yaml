    # # Creating randomness


    Achieving real randomness is surprisingly difficult. Mathematician Pers Diaconis

    says that if you flip a coin seven times, always starting with the head side up,

    You''re likely to toss heads more than tails. Always starting with the tail side
    up, you''ll likely toss tails more often than heads.

    In other words, coin tossing isn''t really fair.


    Computers aren''t much better than coins and human thumbs. A computer mimics

    t generation of random sequences, but in the end the computer does what

    it''s told and does all of this in a purely deterministic fashion. In Listing
    5-1,

    when the executes


    ```

    import java.util.Random;


    int randomNumber = new Random().nextInt(10) + 1;

    ```


    the computer appears to give a randomly generated number — a whole number

    between 1 and 10. But it''s all a fake. The computer only follows instructions.
    It''s

    not really random, without bending a computer over backward, it''s the best

    that one can do.


    > *Diaconis, Persi. "The Search for Randomness.\" American Association for the

    Advancement of Science annual meeting. Seattle. 14 Feb. 2004."


