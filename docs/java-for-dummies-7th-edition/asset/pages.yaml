  md: "# Method references\n\nTake a critical look at the last lambda expression in\
    \ Listing 12-5:\n\n```\nprice1, price2) -> price1 + price2\n```\n\nThis expression\
    \ does roughly the same work as a sum method. (In fact, you can find a sum method's\
    \ declaration in the earlier section \"Lambda expressions.\") If your choice is\
    \ typing a 3-line sum method and typing a 1-line lambda expression, you'll probably\
    \ choose the lambda expression. But what if you have a third alternative? Rather\
    \ than type your own sum method, you can refer to an existing sum method. Using\
    \ an existing method is the quickest and safest to do.\n\nAs luck would it, Java's\
    \ Double class contains a static sum method. You don't have to create your own\
    \ sum method. If you run the following code:\n\n```\ndouble i = 5.0, j = 7.0;\n\
    System.out.println(Double.sum(i, j));\n```\n\nthe computer displays 12.0. So,\
    \ rather than type the price1 + price2 lambda expression in Listing 12-5, you\
    \ can create a method reference — an expression that refers to an method.\n\n\
