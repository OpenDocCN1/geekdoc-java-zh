  md: "One way or another, life is filled with examples of counting loops. And computer\
    \ programming mirrors life — or is it the other way around? When you tell a computer\
    \ what to do, you're often telling the computer to print three lines, process\
    \ ten accounts, a million phone numbers, or whatever. Counting loops is so common\
    \ in programming, the people who create programming languages have developed statements\
    \ just for loops of this kind. In Java, the statement that repeats a certain number\
    \ of times is called a for statement. Listings 6-2 and 6-3 illustrate the use\
    \ of the for statement. Listing 6-2 has a rock-bottom example, and Listing 6-3\
    \ has a more exotic example. Take your pick.\n\n# LISTING 6-2: The World's Most\
    \ Boring for Loop\n\n```\nimport static java.lang.System.out;\n\npublic class\
    \ Town {\n\npublic static void main(String[] args[]) {\n\n\tfor (int count = 1;\
    \ count <= 10; count++) {\n\t\tout.print(\"The value of count is \");\n\t\tout.print(count);\n\
    \t\tout.println(\"\");\n\t}\n\n\tout.println(\"Done!\");\n}}\n```\n\n6-3 shows\
    \ you what you get when you run the program of Listing 6-2. (You get exactly what\
    \ you deserve.) The for statement in Listing 6-2 starts by setting the count to\
    \ 1. Then the statement makes to sure that count is less than or equal to 10 (which\
    \ it certainly is). Then the for statement dives ahead and executes the statements\
    \ between the curly braces. (At this early stage of the game, the computer prints\
    \ The value of count is 1.) Finally, the for statement does last inside its parentheses\
    \ — adds 1 to the value of count.\n\nWith count equal to 2, the for statement\
    \ checks to make sure that count is less than or equal to 10. (Yes, 2 is smaller\
    \ than 10.) Because the test turns out, the for statement marches back into the\
    \ curly brace and prints The value of count is 2 on the screen. Finally, the for\
    \ statement does that last inside its parentheses — it adds 1 to the value of\
    \ count, increasing the value of count to 3."
