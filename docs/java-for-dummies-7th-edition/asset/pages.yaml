- pgno: 319
  md: 'Like many methods and constructors of its kind, the PrintStream constructor
    doesn''t fussyaround with files. If it can''t find a GuestList.txt file, the constructor
    creates a GuestList.txt file and prepares to write values into it. If a GuestList.txt
    file already exists, the PrintStream constructor deletes the existing file and
    prepares to write to a new, empty GuestList.txt file. In the BadClass, the new
    PrintStream constructor deletes whatever Guest.txt file exists. This deletion
    occurs before the call to Scanner.nextInt(). So Scanner.nextInt() can''t catch
    whatever was originally in the GuestList.txt file. That''s bad!


    To avoid this disaster, I carefully separate the two uses of the GuestList.txt
    file in Listing 11-4. Near the top of the listing, I construct Scanner and then
    read from the original GuestList.txt file, and then close Scanner. Later, toward
    the end of the listing, I construct listOut, and write to a new GuestList.txt
    file, and close listOut. With writing separated completely from reading, everything
    works correctly.


    ![](img/ceb51741697a1347a52f2b180d896ec0_319_0.png)


