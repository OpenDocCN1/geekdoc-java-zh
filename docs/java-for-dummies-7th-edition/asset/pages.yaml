    go back to Listing 10-4. When no one is looking, quietly remove the word static
    from the declaration of the decForm field (near the top of the listing). This
    removal turns decForm into a non-static field. Suddenly, each on the team has
    a separate decForm field.


    Well, things are hunky-dory until the computer reaches the finTeamAverageString
    method. That static method has four decForm. SuchAndSuch statements in it. Once
    again, you''re forced to ask what a statement of this kind could possibly mean.
    Method findTeamAverageString belongs to no instance in particular. (The method
    is static, so the entire PlayerPlus class has findTeamAverageString.) With the
    way you''ve butchered the code, plain old decForm without reference to a particular
    object has no meaning. So, you''re referencing the non-static field, decForm,
    from inside a static method''s context. For shame, for shame, for!


    I don''t know about you, but I can use practice with static variables and methods:


