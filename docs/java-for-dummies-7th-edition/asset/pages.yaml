    you run the code in Listing 17-1, you get an empty table. The table has three
    columns (NAME, ADDRESS, and BALANCE) but no rows. To add rows to the table, run
    code in Listing 17-2.


    LISTING 17-2: Inserting Data


    Listing 17-2 uses the same strategy as the code in Listing 17-1: Create Java strings
    containing SQL commands, and make those strings as arguments to Java''s executeUpdate
    method. In Listing 17-2, I put two rows in the ACCOUNTS table — one for me and
    another for Joe Doe. (Joe, I hope you appreciate this.)'
