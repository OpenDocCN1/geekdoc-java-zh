  md: "# When to close a file\n\nNotice the placement of new Scanner calls, new PrintStream\
    \ calls, and close calls in Listing 11-4. As in all the examples, new Scanner\
    \ has a corresponding close call. And in Listing 11-4, the new PrintStream has\
    \ its own close call (the listOut.close()). But in Listing 11-4, I'm careful to\
    \ place these tightly around their corresponding print calls. For example, I don't\
    \ set up Scanner at the start of the program, and I don't wait until the very\
    \ end of the program to close Scanner. Instead, I perform all my Scanner tasks\
    \ one after the other in quick succession:\n\n```\nScanner diskScanner = new Scanner(new\
    \ File(\"GuestList.txt\")); //construct\nfor (roomNum = 0; roomNum < 10; roomNum++)\
    \ {\n    guests[roomNum] = diskScanner.nextInt(); //read\n}\ndiskScanner.close();\
    \ //close\n```\n\nI do the same thing with the keyboard and listOut objects.\n\
    \nI do this with input and output because my program uses GuestList txt twice—once\
    \ for reading numbers and a second time for writing numbers. I'm not sure, the\
    \ two uses of GuestList.txt might conflict with one another. Consider the following\
    \ program:\n\n```\n// THIS IS BAD CODE\nimport java.io.File;\nimport java.io.IOException;\n\
    import java.io.PrintStream;\nimport java.io.util.Scanner;\n\npublic class BadCode\
    \ {\n    public static void main(String[] args) throws IOException {\n       \
    \ int[] guests = new int[10];\n\n        Scanner diskScanner = new Scanner(new\
    \ File(\"GuestList.txt\"));\n        PrintStream listOut = new PrintStream(\"\
    GuestList.txt\");\n\n        guests[0] = diskScanner.nextInt();\n        listOut.print(guests);\n\
    \n        diskScanner.close();\n        listOut.close();\n\n    }\n```"
