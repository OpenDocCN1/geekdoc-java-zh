  md: 'The improper use of parameter passing caused the problem. In Java, when you
    pass a parameter that has one of the eight primitive types, that parameter is
    passed by value.


    For a review of Java''s eight primitive types, see Chapter 4.


    Here''s what this means in plain English: Any changes that the method makes the
    value of its parameter doesn''t affect the values of variables in the calling
    code. In Listing 10-10, the birth method apply the ++ operator to cityPop all
    it wants — the application of ++ to the cityPop parameter has absolutely effect
    on the value of the smackoverARpop variable in the main method.


    Technically, what''s happening is the copying of a value. (See Figure 10-11) When
    the main method calls the birth method, the value stored in smackoverARPop is
    copied to another memory location — a location reserved for the cityPop parameter''s
    value. During the birth method''s execution, it is added to the cityPop parameter.
    But the place where the original 2232 value was stored — the memory location for
    the smackoverARpop variable — remains unaffected.


    ![](img/ceb51741697a1347a52f2b180d896ec0_298_0.png)


    Figure 10-11:

    Pass by value,

    under the hood.'
