    ```


    means that you type **public class** and then some name that you make up on your
    word. Words that you need to replace with your own words are set in *italicized*
    computerese.


    # # What You Don''t Have to Read


    Pick the first chapter or section that has material you don''t already know and
    start reading there. Of course, you may be making decisions as I do here. If so,
    here are some guidelines that you can follow:


    +   - If you already know what kind of animal Java is and know that you want to
    use Java, skip Chapter 1 and go straight to Chapter 2. Believe me, I won''t.


    +   - If you already know how to get a Java program running, and you don''t care
    what happens behind the scenes when a Java program runs, skip Chapter 2 and start
    with Chapter 3.


    +   - If you write programs for a living but use any language other than C or
    C++, start with Chapter 2 or 3. When you reach Chapters 5 and 6, you''ll probably
    find them to be easy reading. When you get to Chapter 7, it''ll be time to dive
    in.'
