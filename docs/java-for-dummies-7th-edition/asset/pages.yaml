    This chapter explores the care of house pets and other burning issues.


    # Java’s Types


    Chapter 4 explains that Java has these two kinds of types:


    +   >> Java has eight primitive types.


    The four that you use most often are int, double, boolean, and char.


    +   >> Java’s API has thousands of reference types. And, when you write a Java
    program, you define new reference types.


    Java’s String type is a reference type. So are Scanner, JFrame, ArrayList, and
    File types. My Dummies is a reference type. In Chapter 7, you create your own
    Employee, FullTimeEmployee, and PartTimeEmployee reference types. If you''ll Java
    program has a main method inside of a class, and that is a reference type. You
    may not realize it, but every array belongs to a reference type.


