  md: 'In Java, static fields and methods show up all over the place. When they''re
    declared in someone else''s code and you''re making use of them in your code,
    you''d hardly ever to worry about them. But when you''re declaring your own fields
    and methods must decide whether to make them static, you have to think a little
    harder.


    In this book, my first use of the word static was back in Listing 3-1. I use the
    static keyword as part of every main method (and lots of main methods are in this
    book''s listings). Why does main have to be static? Well, remember that non-static
    methods belong to objects, not classes. If the method isn''t static, you can''t
    have a main method until you create an object. But, when you start up a Java program,
    no objects have been created yet. The statements that are executed in the main
    method start creating objects. So, if the main method isn''t static, you have
    a big chicken-and-egg problem.


    ![](img/ceb51741697a1347a52f2b180d896ec0_286_0.png)


