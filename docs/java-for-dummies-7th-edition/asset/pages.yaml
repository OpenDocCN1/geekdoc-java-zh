    # # A java annotation


    The word @Override in Listing 8-7 is an example of an annotation. A Java annotation
    tells your computer something about your code. In particular, the @Override annotation
    in Listing 8-7 tells the Java compiler to be on the lookout for a moment coding
    error. The annotation says, "Make sure that the method immediately following this
    annotation has the same stuff (the same name, the same parameters, and so on)
    as one of the methods in the superclass. If not, then display an error message.


    ```

    public double findPaymentAmount(double hours) {

    ```


    instead of int hours in Listings 8-5 and 8-7, the compiler reminds me that my
    new findPaymentAmount method doesn''t really override anything that''s in Listing
    8-5.


    Java has other kind of annotations (such as @Deprecated and @Suppress Warnings).
    You can read a bit about the @SuppressWarnings annotation in Chapter 9.


    Java''s annotations are optional. If you remove the word @Override from Listing
    8-7, your code still runs correctly. But the @Override annotation gives your code
    some safety. With @Override, the compiler checks to make sure you''re doing something
    you intend to (namely, overriding one of the subclass''s methods). And with apologies
    to George Orrow, some annotations are less than than others. You can omit annotations
    from your code only if you''re willing to replace the annotation with lots and
    lots of unwanted Java code.


    ![](img/ceb51741697a1347a52f2b180d896ec0_238_0.png)


