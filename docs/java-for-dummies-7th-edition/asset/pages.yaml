  md: 'In an array declaration, you can put the square brackets before or after the
    variable name. In other words, you can write int guests[] or int [] guests. The
    computer creates the same guests variable no matter what form you use.


    # Creating an array in two easy steps


    Look again at the two lines that you can use to create an array:


    ```

    int guests[];

    guests = new int[10];

    ```


    Each line serves its distinct purpose:


    +   > int guests[] : This first line is a declaration. The declaration reserves
    the array name (a name like guests) for use in the rest of the program. In the
    Java Metaphor motel, this says, "I plan to build a motel here and put a certain
    number of guests in each room." (See Figure 11-2)


    +   Never mind what the declaration int guests[] actually does. It''s more important
    to notice what the declaration int guests[] does. The declaration doesn''t reserve
    memory locations. A declaration like int guests[] doesn''t really create an array.
    The declaration is set up the guests. At that point in the code, the guests still
    doesn''t refer to a real array. (In other words, the motel has a name, but the
    motel hasn''t been built yet.)


    +   > guests = new int[10] : This second line is an assignment statement. The
    assignment statement reserves space in the computer''s memory for ten int values.
    In terms of real estate, this says, "I finally built the motel. Go ahead and put
    guests in each room." (Again, see Figure 11-2).


    ![](img/ceb51741697a1347a52f2b180d896ec0_308_0.png)


    296 PART 4 Smart Java Techniques'
