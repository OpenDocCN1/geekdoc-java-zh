  md: '# Chapter 19


    # Ten Websites for Java


    I wonder the web is popular: It''s both useful and fun. This chapter proves that
    fact by listing ten useful and fun websites. Each website has resources to help
    you use Java more effectively. And as far as I know, none of the sites uses adware,
    pop-ups, or other grotesque things.


    # This Book''s Website


    For all matters related to the technical content of this book, visit www.mycode.com/JavaForDummies.


    For business issues (for example, "How can I purchase 100 more copies of Java
    For Dummies"), visit www.dummies.com.


    # The Horse''s Mouth


    The official Oracle website for Java is www.oracle.com/technetwork/java.


    Check the official Java API documentation at http://docs.oracle.com/javase/8/docs/api.


