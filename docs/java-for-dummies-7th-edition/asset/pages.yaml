    # # Another way to beauty your numbers


    TheAverageString method in Listing 10-1 takes the value from the average field
    (a player''s batting average), converts that value (normally of type double) into
    a String, and then sends that String value back to the method. The use of DecimalFormat,
    which comes right from the Java API (Application Programming Interface), ensures
    that the String value looks like a player''s batting average. According to the
    decFormat.setMaximum and decFormat.setMinimum calls, the String has no digits
    to the left of the decimal point and has three digits to the right of the decimal
    point.


    Java''s DecimalFormat class can be quite handy. For example, to display the values
    345 and -345 in an accounting-friendly format, you can use the following code:


    ```

    DecimalFormat decFormat = new DecimalFormat();

    decFormat.setMinimumDigits(2);

    decFormat.setNegativePrefix("-");

    decFormat.setNegativeSuffix("");

    System.out.println(decFormat.format(345));

    System.out.println(decFormat.format(-345));

    ```


    In this example''s format string, everything before the semicolon dictates the
    positive numbers are displayed, and everything after the semicolon determines
    the negative numbers are displayed. So, with this format, the numbers 345 and
    -345 appear as follows:


    ```

    345.00

    -345.00

    ```


