- pgno: 460
  md: '# WHOSE DATABASE IS IT ANYWAY?


    Databases come in many shapes and sizes from many different vendors. In 2017,
    the top database vendors include Oracle, Microsoft, IBM, and SAP. Some popular
    open-source databases include PostgreSQL and Oracle''s MySQL. The code in Listing
    17-1 (and this chapter''s other listings) uses an open-source database from The
    Apache Software Foundation known as Apache Derby.


    If you don''t want to use Apache Derby, you have to replace the CONNECTION string
    in this chapter''s examples. What other string you depends on the kind of database
    software you have, and on other factors. Check your database vendor''s documentation.


    By the way, database drivers are like people: some are quite old and others aren''t
    so old. As of January 2017, the latest version of JDBC is 4.2. A "quite old" database
    driver is one that was created for a version of JDBC before 4.0 (circa December
    2006). If your database driver doesn''t know the JDBC 4.0 standards, you have
    to add a few extra statements to each of this chapter''s examples, as follows:


    ```

    final Public String DRIVER = "com.databasevendendorname.databasebrandname. maybe

    otherstuff";

    try {

    Class.forName(DRIVER).newInstance();

    } catch (InstantiationException |

    IllegalAccessException |

    ClassNotFoundException e) {

    e.printStackTrace();

    }

    ```


    Again, check your database vendor''s documentation.


    If you''re using Structured Query Language, or SQL, the command strings in the
    calls to executeUpdate make sense to you. If not, pick up a copy of SQL For Dummies,
    8th Edition, by Alan G. Taylor (Wiley). One way or another, don''t go fishing
    around this chapter for an explanation of the create table command. You won''t
    find an explanation, because the big create table string in Listing 17-1 isn''t
    part of Java. This command is just a string of characters that you feed to Java''s
    executeUpdate method. This string is written in SQL, creates a new database table
    with three columns (columns for a customer''s NAME, the custom-er''s ADDRESS,
    and the account''s BALANCE). When you write a Java database program, that''s what
    you do. You write ordinary SQL commands and surround them with calls to Java methods.


    448 PART 4 Smart Java Techniques'
