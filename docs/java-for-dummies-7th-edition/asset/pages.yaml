    need to get some terminology under your belt. If a field or method isn''t static,
    it''s called non-static (Real surprising!). Given that terminology, there are
    at least two ways to make the dreaded appear:


    +   - Class.nonstaticThing somewhere in your program.

    - PutnonstaticThing inside a static method.


    In either case, you''re getting yourself into trouble. You''re taking something
    about an object (the non-static thing) and putting it in a place where no objects
    are in sight.


    Take, for instance, the first of the two situations I just described. To see this
    calamity in action, go back to Listing 10-5. Toward the end of the listing, change
    player.getName() to Player.getName(). That does the trick. What could Player.getName
