- pgno: 501
  md: '# About the Author


    Barry Burd received a Master of Science degree in computer science at Rutgers
    University and a PhD in mathematics at the University of Illinois. As a teaching
    assistant in Champaign-Urbana, Illinois, he was elected five times to the university-wide
    List of Teachers Ranked as Excellent by Their Students.


    Since 1980, Dr. Burd has been a professor in the Department of Mathematics and
    Computer Science at Drew University in Madison, New Jersey. He has lectured at
    conferences and videos about software and other technology topics in the United
    States, Europe, Australia, and Asia. He is the author of many articles and books,
    including Beginning Programming with Java For Dummies, Java Programming for Android
    Developers For Dummies, and Android Application Development All-in-One For Dummies,
    all from Wiley.


    Dr. Burd lives in Madison, New Jersey, with his wife of n years, where n > 35.
    In his spare time, he enjoys being workaholic.'
  merge: -1
  img_proc: true
