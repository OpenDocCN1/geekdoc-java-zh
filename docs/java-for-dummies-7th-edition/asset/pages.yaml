- pgno: 390
  md: "# LISTING 13-11: (continued)\n\n```\n) finally {\n    out.println(\"I'll get\
    \ printed.\");\n}\n\nout.println(\"I won't get printed.\");\n}\n```\n\nNormally,\
    \ when I think about a try statement, I think about the computer recovery from\
    \ an unpleasant situation. The recovery takes place inside a catch clause, and\
    \ the computer marches on to whatever statements come after the try statement.\
    \ Well, if something goes wrong during execution of a catch clause, this picture\
    \ can start looking different.\n\nListing 13-11 gets a workout in Figure 13-14.\
    \ First, the main method calls out Something. The stupid doSomething method goes\
    \ out of its way to divide by zero, which is illegal and undoable in anyone's\
    \ programming language. This foolish action throws an Arithmetic, which is caught\
    \ by the try statement's one and only catch clause.\n\nFIGURE 13-14:\nRunning\
    \ the code from\nListing 13-11.\n\n| Exception caught in doSomething |\n| I'll\
    \ get printed |\n| Exception caught in main. |\n\nInside the catch clause, lowlife\
    \ doSomething method divides by o again. This statement, shows that the division\
    \ isn't inside a try clause. That's okay, because an ArithmeticException isn't\
    \ checked. (It's one of RuntimeException subclasses. It's an exception that doesn't\
    \ have to be acknowledged in a try or a throws clause. For details, see the preceding\
    \ section.)\n\nWell, checked or not, the throwing of another ArithmeticException\
    \ causes control to jump out of the doSomething method. But, before the computer\
    \ executes the try statement's last will and testament: the statements inside\
    \ the finally clause. That's why in Figure 13-14 you see the words I'll get printed.\n\
    \nInterestingly enough, you don't see the words won't get printed in Figure 13-14.\
    \ Because the catch clause's execution throws its one, uncaught exception, the\
    \ computer never makes it down past the try-catch-finally statement.\n\n378 PART\
    \ 4 Smart Java Techniques"
