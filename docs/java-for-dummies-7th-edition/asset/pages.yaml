  md: '# PACKAGES AND IMPORT DECLARATIONS


    Java has a feature that lets you lump classes into groups of classes. Each lump
    of classes is called a package. In the Java world, programmers customarily give
    these packages dot-dotted names. For instance, because I''ve registered the domain
    name allcode, I may name a package com.allcode.util.TextUtils. The Java API is
    actually a big collection of packages. The API has packages with names like java.lang,
    java.util.awt, and java.swing.


    With this information about packages, I can clear up some of the confusion import
    declarations. Any import declaration that doesn''t use the word static start with
    the name of a package and end with either of the following:


    +   * The name of a class within that package

    * An asterisk (indicating all classes within that package)


    For example, the declaration


    ```

    import java.util.Scanner;

    ```


    is valid because java.util.Scanner is the name of a package in the Java API, and
    Scanner is the name of a class in the java.util package. The dotted name java.util.Scanner
    is the fully qualified name of the Scanner. A class''s fully qualified name includes
    the name of the package in which the class is defined. You can find out all this
    about java.util and Scanner by reading java''s API documentation. For tips on
    reading the documentation, see Chapter 3 and this book''s website.


    Here''s another. The declaration


    ```

    import javax.swing.*;

    ```


    is valid because javax.swing.swing is the name of a package in the Java API, and
    the asterisk refers to all classes in the java.swing package. With this import
    declaration at the top of your java code, you can use abbreviated names for classes
    in the java.swing package — names like JFrame, JButton, JMenuBar, JCheckBox, and
    many others.


    Here''s more example. A line like


    ```

    import java.*; //Bad!

    ```


    is not a valid import declaration. The Java API has no package with the one-word
    name java. You might think that this line allows you to abbreviate all names beginning
    with java (names like java.swing, JFrame, and java.sound.midi), but that''s not
    the way the import works. Because java isn''t the name of a package, the line
    import java.* just angers the java compiler.'
