    > > Create an ArrayList containing String values in alphabetical order. When the
    user types an '' on the keyboard, the program inserts the new word into the ArrayList
    in the proper (alphabetically ordered) place.


    For example, imagine that the list starts off containing the words "cat", "dog",
    "horse", and "zebra" (in that order). After the user types the word fish on the
    keyboard (and presses Enter), the list contains the words "cat", "dog", "fish",
