    # # And Now, a Few Comments


    People gather around campfires to hear the old legend about a programmer whose
    laziness got into trouble. To maintain this programmer''s anonymity, I call her
    Jane Pro. Jane worked many months to create the holy grail of: a program that
    thinks on its own. If completed, this program could work independently, learning
    new things without human intervention. After day night, day after night, Jane
    Pro labored to give the program that spark of creative, independent thought.


    One day, when she was almost finished with the project, she received a disturbing
    piece of mail from her health insurance company. No, the mail wasn''t about a
    serious illness. It was about a routine office visit. The insurance company''s
    claim had a place for Jane''s date of birth, or if her date of birth had changed
    since the last time she was in claim. She had absentmindedly scribbled 2016 over
    her year of birth, so the insurance company refused to pay the bill.


    Jane dialed the insurance company''s phone number. Within 20 minutes, she was
    talking to a live person. "I''m sorry," said the live person. "To resolve this
    issue, you must dial a different number." Well, can you guess what happened next.
    "I''m sorry. The operator gave you the right number." And then, "I''m sorry. You
    must call the original phone number."


    Five months later, Jane''s ear ached, after 800 hours on the phone, she had a
    tentative promise that the insurance company would eventually reprogram the claim.
    Elated as she was, she was anxious to get back to her programming project. Could
    she remember that all lines of code were supposed to be doing?


    No, she couldn''t. Jane stared and stared at her own work and, like a dream that
    doesn''t make sense the next morning, the code was completely meaningless to her.
    She had written a million lines of code, and not one line was accompanied by an
    informative explanatory comment. She had left no clues to help her understand
    what she''d been thinking, so in frustration, she abandoned the whole project.'
