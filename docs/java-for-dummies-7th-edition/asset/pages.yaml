  md: 'The code in Listing 11-1 has two for loops: the first loop reads numbers of
    guests, and the second loop writes numbers of guests.


    Every array has a built-in length field. An array''s length is the number of components
    in the array. So, in Listing 11-1, if you print the value of guests.length, you
    get 10.


    # Tab stops and other special things


    In Listing 11-1, some calls to print and println use the \ escape sequence. It''s
    called an escape sequence because you escape from displaying the t on the screen.
    Indeed, the characters \ stand for a tab. The computer moves forward to the next
    tab before printing any more characters. Java has a few handy escape sequences.
    Some of them are shown in Table 11-1.


    TABLE 11-1


    # Escape Sequences


    | Sequence | Meaning |

    | --- | --- |

    | \b | backspace |

    | \t | horizontal tab |

    | \n | line feed |

    | \f | form feed |

    | \r | carriage return |

    | \" | double quote |

    | \'' | single quote |

    |\\ | backslash \"


    # Using an array initializer


    Besides what you see in Listing 11-1, you have another way to fill an array in
    Java: with an array initializer. When you use an array initializer, you don''t
    even have to tell the computer how many components the array has. The computer
    figures this out for you.


    Listing 11-2 shows a new version of the code to fill an array. The program''s
    output is the same as the output of Listing 11-1 (It''s the stuff shown in Figure
    11-4.) The only difference between Listings 11-1 and 11-2 is the bold text in
    Listing 11-2. That bold doodad is an array initializer.'
