    # # Events and event handling


    The big news in Listing 16-1, shown in the preceding section, is the handling
    of the user''s button click. When you''re working in a graphical user interface
    (GUI), anything the user does (like pressing a key, moving the mouse, clicking
    the mouse, or whatever) is called an event. The code that responds to the user''s
    press, movement, or click is called event-handling code.


    16-1 deals with the button-click event with three parts of its code:


    +   - The top of the GameFrame class declaration says that this class implements
    ActionListener.


    +   - By announcing that it will implement the ActionListener interface, the code
    in Listing 16-1 agrees that it will give meaning to the interface''s actionPerformed
    method. In this situation, giving means declaring an actionPerformed method with
    curly braces, a body, and maybe some statements to execute.


    +   - Enough, the code for the GameFrame class has an actionPerformed method,
    and that actionPerformed method has a body.


    +   - Finally, the constructor for the GameFrame class adds this to the button''s
    list of action listeners.


    Java will call this code''s actionPerformed method when the user clicks the button.ing!


    Taken together, all three of these tricks make the GameFrame class handle button
    clicks.'
