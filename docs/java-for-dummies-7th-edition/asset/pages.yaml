    # Public lives and private dreams:

    Making a field inaccessible


    Notice the addition of the word private in front of each of the Account class''s
    field declarations. The word private is a Java keyword. When a field is declared
    private, no code outside of the class can make direct reference to that. If you
    put myAccount.name = "Barry Burd" in the UseAccount class of Listing 7-9, you
    get an error message such as name has private access in Account.


    Instead of replacing it, the UseAccount programmer must call method myAccount.setName
    or myAccount.getName. These methods, setName and getName, are called accessor
    methods because they provide access to the Account class''s name field. (Actually,
    the term accessor method isn''t formally part of the Java programming language.
    It''s just the term that people use for methods that do this sort of thing.) To
    zoom in even more, setName is called a setter method, and getName is called a
    getter method. (I bet you won''t forget that


