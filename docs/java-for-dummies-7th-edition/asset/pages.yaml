    \ {\n\n    public static void main(String[] args[]) {\n        System.out.println(\"\
    You'll love Java!\");\n    }\n}\n```\n\nIn an outline, some stuff is subordinate\
    \ to a capital letter A. In a Java program, some lines are subordinate to the\
    \ method header. To indicate that something is subordinate to a method header,\
    \ you use curly braces. (See Listing 3-5).\n\nLISTING 3-5: Curly Braces for a\
    \ Java Method\n\n```\npublic class Displayer {\n\n    public static void main(String[]\
