  md: '# What’s Barry’s excuse?


    For years I''ve been telling my students to put comments in their code, for years
    I''ve been creating sample code (like the code in Listing 3-1) with comments in
    it. Why?


    Three little words: Know your audience. When you write complicated, real-life
    code, your audience is other programmers, information technology managers, and
    people who need help deciphering what you''ve done. When I write simple samples
    of this code, my audience is — the novice Java programmer. Instead of reading
    my comments, your best strategy is to stare at my Java statements — the statements
    that Java’s compiler deciphers. That''s why I put so few comments in this book’s
    listings.


    Besides, I''m a little lazy.


    # Using comments to experiment with your code


    You may hear programmers talk about commenting certain parts of your code. When
    you''re writing a program and something''s not working correctly, it often helps
    to try removing some of the code. If nothing else, you find out what happens when
    your suspicious code is removed. Of course, you may not like what happens when
    the code is removed, so you don''t want to delete the code completely. Instead,
    turn your ordinary Java statements into comments. For instance, you turn the statement


    ```

    System.out.println("I love Java");

    ```


    into the comment


    ```

    // System.out.println("I love Java");

    ```


    This change keeps the Java compiler from seeing the code while you try to get
    what''s wrong with your program.


    Traditional comments aren''t very useful for commenting code. The big problem
    is that you can''t put one traditional comment inside of another. Suppose you
    want to comment out the following statements:


    ```

    System.out.println("Parents,");

    System.out.println("pick your");

    /*

    ```'
