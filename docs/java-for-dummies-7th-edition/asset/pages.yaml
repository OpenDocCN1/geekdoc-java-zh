    \ RIGHT PLACES\n\nTry to compile the program in Listing 14-1. The Java compiler\
    \ pokes through the code and stumbles upon some missing pieces. First there's\
    \ this thing called an ArtFrame. Then you have this Drawing business. Listing\
    \ 14-1 defines a class named ShowFrame, then not ArtFrame or Drawing. So where\
    \ does the compiler find information about the ArtFrame and Drawing classes?\n\
    \nIf you think about it, the problem can be daunting. Should the compiler go searching\
    \ all over your hard drive for files named ArtFrame.java or Drawing.class? How\
    \ large is your hard drive? 500GB?750GB?6,000,000GB? And what references to files\
    \ on network drives? The search space is potentially unlimited. What if the compiler\
    \ eventually resolves all these issues? Then you try to run your code, and the\
    \ Java Virtual Machine (JVM) starts searching all over again. (For info on the\
    \ Java Virtual Machine, see Chapter 2.)\n\nTo tame this problem, Java defines\
    \ something called a CLASSPATH. The CLASSPATH is a list of places where the compiler\
    \ and the JVM look for. There are several ways to set a CLASSPATH. Some programmers\
    \ create a new CLASSPATH each time they run a Java program. Others create a system-wide\
    \ CLASSPATH variable (if you're familiar with the PATH variable on Windows and\
    \ Unix computers, you may already know how this works.) One way or another, the\
    \ compiler and the JVM need a list of places to look for code. Without such a\
    \ list, these tools don't look around. They don't find classes like ArtFrame or\
    \ Drawing. You get a find symbol message or a NoClassFoundError message, and you're\
    \ very unhappy.\n\nCHAPTER 14 Names of the Parts of a Java Framework 393"
