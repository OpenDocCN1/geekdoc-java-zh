    # # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of your assumptions
    is incorrect, you''re probably okay. If all these assumptions are incorrect .
    . . well, buy the book anyway:


    +   >> I assume that you have access to a computer. Here''s the good news: You
    can run most of the code in this book almost any computer. The only computers
    you can''t use to run this code are ancient things that are more than ten years
    old (give or take a few years).


    +   >> I assume that you can navigate through your common menus and dialog boxes.
    You don''t have to be a Windows, Linux, or Macintosh power user, but you should
    be able to start a program, find a file, put it into a certain directory . . .
    sort of thing. Most of the time, when you practice the stuff in this book, you''re
    typing code on the keyboard, by pointing and clicking the mouse.


    On those rare occasions when you need to drag and drop, cut and paste, or plug
    and play, I will carefully guide you through the steps. Your computer may be configured
    in several billion ways, and my instructions may not fit your special situation.
    When you reach one of these platform-specific tasks, try following the steps in
    this book. If the steps don''t quite fit, consult a book tailored to your system.


    +   >> I assume that you can think logically. That''s all there is to programming
    in Java — thinking logically. If you can think logically, you''ve got it made.
    If you don''t believe that you can think logically, read on. You may be pleasantly
    surprised.


