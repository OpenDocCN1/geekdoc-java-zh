  md: 'Even after you''ve downloaded a copy of derby.jar, your IDE might not know
    where you''ve put the file on your computer''s hard drive. It''s usually enough
    to put derby.jar in a well-known directory. Instead, you have to tell Eclipse,
    IntelliJ IDEA, or NetBeans exactly to find your derby.jar file. Here''s what you
    do:


    +   - Eclipse: Select Project ⊮ Properties. In the resulting dialog box, select
    Java Build Path, and then select the Libraries tab. Click the External JARs button,
    and then navigate to the derby.jar file on your computer’s hard


    +   - IntelliJ IDEA: Select File ⊮ Project Structure. In the resulting dialog
    box, select Libraries. Click the sign (+) icon and, in the resulting drop-down
    box, select Java. Navigate to the call to the .jar file on your computer’s hard
    drive.


    +   - NetBeans: Select File ⊮ Project Properties. In the resulting dialog box,
    select Libraries and then select the Run tab. Click the Add JAR/Folder button,
    and navigate to the .jar file on your computer’s hard drive.


    # # What happens when you run the code


    During a successful run of the code in Listing 17-1, you will see an ACCOUNTS
    created message. That''s about it. The code has no other output visible because
    most of the output goes to a database.


    If you poke around a bit, you can find direct evidence of the database''s existence.
    Using your computer''s File Explorer or Finder, you can navigate to the project
    folder containing the code in Listing 17-1. (If you''ve downloaded the code from
    this book''s website, look in your IDE''s 17-01 project folder.) Inside that folder,
    you''ll see a brand-new AccountDatabase subcluster. That''s where the created
    database lives.


    Unfortunately, you can''t see inside the database unless you run a couple programs.
    Read on!


    # # Using SQL commands


    In Listing 17-1, the heart of the code lies in the call to executeUpdate. The
    executeUpdate call contains a string — a normal, Java, double-quoted string of
    characters. To keep the code readable, I''ve chopped the string into four parts,
    and separate the parts with plus signs (Java''s string concatenation operator).'
