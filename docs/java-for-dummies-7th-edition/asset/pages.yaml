  md: '# Some Collection Classes


    | Class Name | Characteristic |

    |---|---|

    | ArrayList | A resizable array. |

    | LinkedList | A list of values, each having a field that points to the next one
    in the list. |

    | Stack | A structure that grows from bottom to top. The structure is optimized
    for access to the topmost value. You can easily add a value to the top or remove
    the value from the top. |

    | Queue | A structure that grows at one end. The structure is optimized for adding
    values to one end (the rear) and removing values from the other end (the front).
    |

    | PriorityQueue | A structure, like a queue, that lets certain (higher-priority)
    values move toward the front. |

    | HashSet | A collection containing no duplicates. |

    | HashMap | A collection of key/value pairs.|


    Each class has its own set of methods (in addition to the methods that it inherits
    from AbstractCollection, the ancestor of all collection classes).




    To find out collection classes best meet your needs, visit the Java API documentation
    pages at http://docs.oracle.com/java/8/docs/api.


    ![](img/ceb51741697a1347a52f2b180d896ec0_344_0.png)


