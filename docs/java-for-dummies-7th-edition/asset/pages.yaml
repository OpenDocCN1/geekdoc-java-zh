  md: 'The analogy that I use to describe functional programming is very rough. A
    friend of mine called this analogy a stretch because it applies to many different
    programming frameworks, not only to functional programming. One way or another,
    I think the analogy is helpful.


    Here''s the analogy: Imagine a programming problem as a cube, and imagine an imperative
    programming solution as a way of slicing up the cube into manageable pieces. (See
    Figure 12–3.)


    ![](img/ceb51741697a1347a52f2b180d896ec0_346_0.png)


    All was well until 2007, when, for the first time, computers sold to consumers
    had multicore processors. A multicore processor can perform more than one instruction
    at a time. Figure 12-4 shows what happens when you try to squeeze an imperative
    program into a multicore processor.


    > It doesn''t fit easily, so...squeeze it all into one core.


    ![](img/ceb51741697a1347a52f2b180d896ec0_346_1.png)


    To get the most out of a four-core processor, you divide your code into four pieces
    — one piece for each core. But with imperative programming, your program''s pieces
    don''t fit neatly into your processor''s cores.'
