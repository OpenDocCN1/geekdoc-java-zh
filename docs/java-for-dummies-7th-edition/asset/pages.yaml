- pgno: 361
  md: 'When you read the preceding paragraph, don''t gloss over the phrase best possible
    scenario. Parallelism isn''t magic. And sometimes, parallelism isn''t your friend.
    Consider the situation in which you have only 20 sale amounts to tally. The time
    it takes to divide the problem into four groups of 5 sales each exceeds the amount
    you save in all four cores. In addition, some problems don''t lend themselves
    to parallel processing. Imagine that the process of an item depends on the number
    of similar items used. In that case, you can''t divide the problem among four
    independently operating cores. If you try, each core has to know what the other
    cores are doing. Use the advantage of having four threads of execution.


    ![](img/ceb51741697a1347a52f2b180d896ec0_361_0.png)


    # NO VARIABLES? NO PROBLEM!


    Consider the problems posed at the start of the earlier section "Functional Programming."
    Several clients try to update Oracle''s stock price at the same time, or visitors
    try to buy the same item on website. The source of problem is shared data. How
    many clients share access to Oracle''s stock price? How many customers share access
    to a web page''s Purchase button? How many of your processor''s cores modify the
    variable''s value? If you get rid of data sharing, your multicore processing goes
    away.


    In imperative programming, a variable is a place where statements share their
    values with one another. Can you avoid variables in your code?


    Compare the loop in Listing 12-4 with the functional programming code in Listing
    12-5. In Listing 12-4, the total1 variable is shared among all loop iterations.
    Because each iteration can potentially change the value of total1, you can''t
    assign each iteration to a different processor. If you did, you''d risk having
    two cores updating the total at the same time. (Chances are good that, because
    of the simultaneous updating, neither core would do its correctly!) But the functional
    programming code in Listing 12-5 has no total1 variable. A running total plays
    no role in the functional version of the code. Instead, in Listing 12-5, the reduce
    method applies the sum operation to values coming from a stream. This incoming
    stream pops out of the previous method call (the incoming stream has no name.
    That''s nice. You don''t even need a variable to store a stream of values.


    In imperative programming, a variable is a place where statements share their
    values with one another. But functional programming shuns variables. So, when
    you do functional programming, you don''t have a lot of data sharing. Many of
    the difficulties associated with multiple processors vanish into thin air. You
    can take advantage of many cores at the same time. When you write the code, you
    don''t worry about data being shared among the cores. It''s an elegant solution
    to an important computing problem.'
