    # Threads of execution


    Here''s a well-kept secret: Java programs are multithreaded, which means that
    several things are going on at once whenever you run a program, the computer is
    executing the code that you write, but it''s executing other code as well (code
    that you didn''t write and don''t see). All this is being executed at the same
    time. While the computer executes your main method''s statements, one after another,
    the computer takes time, sneaks away briefly, and executes statements from other,
    unseen methods. For most simple Java programs, the other methods are ones that
    are defined as part of the Java Virtual Machine (JVM).


    For instance, Java has an event—handling thread. While your code runs, the event-handling
    thread''s code runs in the background. The event-handling thread listens for mouse
    clicks and takes appropriate action whenever a user clicks the mouse. Figure 16-3
    illustrates how this works.


    | Your code''s thread | The event handling thread |

    | :--- | :--- |

    | setLayout(new FlowLayout());

    add(textField);

    add(button);

    add(label); | Did the user click the mouse? |

    | button.addActionListener(this);

    pack();

    setVisible(true); | Did the user click the mouse |

    | | Did the user click the mouse? Yes? Okay, then. I''ll call the actionPerformed
    method. |


    FIGURE 16-3:

    Java threads.


