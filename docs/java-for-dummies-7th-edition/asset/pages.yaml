    # The words in a Java program


    A hard-core Javate will say that the Java programming language has two kinds of
    words: keywords and identifiers. This is true, but without other explanation,
    is sometimes misleading. So I recommend up the truth a bit and thinking in terms
    of three kinds of words: keywords, identifiers that ordinary programmers like
    you and I create, and identifiers from the API.


