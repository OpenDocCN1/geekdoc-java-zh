  md: 'When the user clicks the button, the event-handling thread says, "Okay, the
    button was clicked. What should I do about that? And the answer is, "Call some
    actionPerformed methods." It’s as if the event-handling thread has code that looks
    like this:


    ```

    if (buttonJustGotClicked()) {

    object1.actionPerformed(infoAboutClick);

    object2.actionPerformed(infoAboutClick);

    object3.actionPerformed(infoAboutClick);

    }

    ```


    Of course, behind every answer is yet another question. In this situation, the
    follow-up question is, "Where does the event-handling thread find action methods
    to call?" And another answer: "What if you don’t want the event-handling thread
    to call certain actionPerformed methods that are lurking in your code?


    Well, that’s why you call the addActionListener method. In Listing 16-1, the call


    ```

    button.addActionListener(this);

    ```


    tells the event-handling thread, "Put this code actionPerformed method on your
    list of methods to be called. Call this code actionPerformed method when the button
    is clicked."


    So that’s how it works. To have the computer work with Java’s event-handling thread,
    you do this registration by calling addActionListener. The addActionListener method
    belongs to the object which clicks (and other events) you’re waiting for. In Listing
    16-1, you’re waiting for the button to be clicked, and the addActionListener method
    belongs to that button.


