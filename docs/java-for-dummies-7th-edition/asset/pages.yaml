    ```


    The instructions in Listing 2–2 aren''t Java source code instructions. They''re
    Java bytecode instructions. When you write a Java program, you write source code
    instructions (like the instructions in Listing 2-1). After writing the source
    code, you run a program (that is, you apply a tool) to your source code. The program
    is a compiler. The compiler translates your source code into Java bytecode instructions.
    In other words, the compiler takes that you can write and understand (like the
    code in Listing 2-1) and translates it into a code that has a fighting chance
    of carrying out (like the code in Listing 2-2).


    You might put your source code in a file named Hotel.java. If so, the compiler
    puts your bytecode in another file named Hotel.class. Normally, you don''t looking
