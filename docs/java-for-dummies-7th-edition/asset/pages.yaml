- pgno: 30
  md: 'But C++ had a flaw. C++, you could bypass the object-oriented features and
    write a program by using the old FORTRAN/C programming style. When you started
    writing a C++ accounting program, you could take either fork in the road:


    +   - By issuing direct "Do this" commands to the computer, spying the mathematical
    equivalent of "Print a list of delinquent accounts, and make it snappy.\n- Choose
    the object-oriented approach and begin by describing what it means to be an account.


    Some people said that C++ offered the best of both worlds, but others argued that
    the first world (the world of FORTRAN and C) shouldn''t be part of modern programming.
    If you gave a programmer an opportunity to write either way, the programmer would
    too often choose to write the code wrong.


    In 1995, James Gosling of Sun Microsystems created the language named Java. In
    creating Java, Gosling borrowed the look and feel of C++. But Gosling took most
    of the old "Do/this" features of C++ and threw them in the trash. Then he added
    features that made the development of objects smoother and easier. All in all,
    Gosling created a language whose object-oriented philosophy is pure and clean.
    When you program in Java, you have no choice to work with objects. That''s the
    way it should be.


    # Objects and their classes


    In an object-oriented language, you use objects and classes to organize your data.


    Imagine that you''re writing a computer program to keep track of the houses in
    a new condominium development (still under construction). The houses differ slightly
    from one another. Each house has a distinctive siding, an indoor paint color,
    a kitchen cabinet style, and so on. In your object-oriented computer program,
    each house is an object.


    So you have it. Object-oriented programming is misnamed. It should be called "programming
    with classes and objects."


    PART 1 Getting Started with Java


