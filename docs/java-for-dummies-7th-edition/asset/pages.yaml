    # # Values to and from Methods (Calculating Interest)


    Think about sending someone to the supermarket to buy bread. When you do this,
    you say, "Go to the supermarket and buy bread." (Try it at home. You''ll have
    a fresh loaf of bread in no time at all!) Of course, some time, you want that
    person to the supermarket to buy bananas. You say, "Go to market and buy bananas."
    And what''s the point of all this? You have a method, and you have some on-the-fly
    information that you pass to the method when you call it. The method is named
    goToSupermarketAndBuySome. The on-the-fly information is either bread or bananas,
    depending on your culinary needs.


    ```

    goToSupermarketAndBuySome();

    ToGoSupermarketAndBuySome(bananas);

    ```


    The things in parentheses are called parameters or parameter lists. With parameters,
    your methods become much more versatile. Instead of getting the same thing each
    time, you can send someone to the supermarket to buy bread one time, bananas another
    time, and birdseed the third time. When you call your goToSupermarketAndBuySome
    method, you decide right where you''re going to ask your pal to buy.


    And what happens when your friend returns from the supermarket? "Here''s the bread
    you asked me to buy," says your friend. By carrying out your wishes, your friend
    returns something to you. You make a method call, and the method returns information
    (or a loaf of bread).'
