  md: "Each of the three items in parentheses plays its own distinct role:\n\n+  \
    \ > **The initialization** is executed once, when the run of your program first\
    \ reaches for the statement.\n\n+   > **The expression** is evaluated several\
    \ times (before each iteration).\n\n+   > **The update** is also evaluated several\
    \ times (at the end of each iteration).\n\nIf it helps, think of the loop as though\
