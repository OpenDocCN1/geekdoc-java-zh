  md: '>> setDefaultCloseOperation: Calling setDefaultCloseOperation tells Java what
    to do when you click the × in the frame''s upper-right corner. (On a Mac, you
    click the red circle in the frame''s upper-left corner.) Without this method,
    the frame itself disappears, but the Java Virtual Machine (JVM) keeps running.
    To stop your program''s run, you have to perform one more step. (You may have
    to look for a Terminate option in Eclipse, IntelliJ IDEA, or NetBeans.)


    Calling setDefaultCloseOperation(EXIT_ON_CLOSE) tells Java to shut itself when
    you click the × in the frame''s upper-right corner. The alternatives to EXIT_ON_CLOSE
    ARE HIDE_ON_CLOSE, DISPOSE_ON_CLOSE, and my personal favorite, DO_NOTHING_ON_CLOSE.
    Use one of these alternatives when your program has more to do after the user
    closes your frame.


    >> JButton: The JButton class lives in the java swing package. One of the class''s
    constructors takes a String instance (such as "Panic") for its parameter. Calling
    this constructor makes String instance into the label on the face of the button.


    >> setSize: The frame becomes 300 pixels wide and 100 pixels tall. In the java.swing
    package, whenever you specify two dimension numbers, the width number always comes
    before the height number.


    >> setVisible: When it''s first created, a frame is invisible. But when the new
    frame calls setVisible(true), the frame appears on your computer screen.


    # The SuppressWarnings annotation


    Chapter 8 introduces the annotation — extra code that provides useful information
    about the nature of your program. In particular, Chapter 8 describes the Override
    annotation.


    In this chapter, Listing 9–9 introduces another type of annotation: the Suppress
    Warnings annotation. When you use a SuppressWarnings annotation, you tell Java
    not to remind you that your program contains certain questionable code. In Listing
    9–9, the line @SuppressWarnings("serial") tells Java not to remind you that you''ve
    omitted something called a serialVersionUID. In other words, the SuppressWarnings
    annotation tells Java not to display a warning like the one in Figure 9–4.'
