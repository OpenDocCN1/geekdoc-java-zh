    # Tossing an exception from method to method


    Chapter 8 introduces input from a disk file, and along with that topic comes the
    notion of an exception. When you tinker with a disk file, you need to acknowledge
    the possibility of raising an exception. That''s the lesson from Chapter 8, and
    that''s why the constructor in Listing 10-2 has a throws IOException clause.


    But what more the main method in Listing 10-3? With no apparent reference to disk
    files in this main method, why does the method need its own IOException clause?
    Well, an exception is a hot potato. If you have one, you either have to eat it
    (as you can see in Chapter 13) or use a throws clause to toss it to someone else.
    If you toss an exception with a throws clause, someone else is stuck with the
    exception the way you want.


    The constructor in Listing 10-2 throws an IOException, but to whom is this exception?
    In this chain of code becomes the bearer of responsibility for the programmatic
    IOException? Well, who called the constructor in Listing 10-2? It was the main
    method in Listing 10-3 — that''s who called the TeamFrame constructor. Because
    the constructor throws its hot potato to the main method in Listing 10-3, the
    main method has to deal with it. As shown in Listing 10-3, the main method deals
    with it (by raising a throws clause of its own). That''s how the throws works
    in Java programs.


    If a method calls another method and the called method has a throws clause, the
    calling method must contain code that deals with the exception. To find out more
    dealing with exceptions, read Chapter 13.


    ![](img/ceb51741697a1347a52f2b180d896ec0_278_1.png)


    REMEMBER


    266 PART 4 Smart Java Techniques'
