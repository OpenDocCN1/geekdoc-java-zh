- pgno: 461
  md: '# Connecting and disconnecting


    Aside from the call to the executeUpdate method, the code in Listing 17-1 is copy-and-paste
    stuff. Here''s a rundown on what each part of the code means:


    +   **DriverManager.getConnection**: Establish a session with a particular database.


    The getConnection method lives in a Java class named DriverManager. In Listing
    17-1, the call to getConnection creates an AccountDatabase and opens a connection
    to that database. Of course, you may already have an AccountDatabase before you
    start running the code in Listing 17-1. If you do, the create=true in the CONNECTION
    string has no effect.


    In the CONNECTION string, the colons: The code doesn''t simply name the AccountDatabase—it
    tells the DriverManager class what protocols to use with the database. The code
    jdbc: derby—which is a lot like http: in a web address—tells the computer to use
    the jdbc protocol to talk to the database, which in turn talks directly to your
    Account Database.


    +   **conn.createStatement**: Make a statement.


    It seems strange, in Java Database Connectivity, you create a single statement
    object. After you''ve created a statement object, you can use it many times, with
    many different SQL strings, to issue many commands to the database. So, before
    you start calling the statement executeUpdate method, you have to create an actual
    statement object. The call to create.createStatement creates that statement object
    for you.


    +   **try-with-resources**: Release resources, come what may!


    As Ritter always says, you''re not considerate of others if you don''t clean up
    your own messes. Every connection and every database statement lock up some system
    resources. When you''re finished using these resources, you release them.


    In Listing 17-1, Java''s try-with-resources block automatically closes and releases
    resources at the end of the block''s. In addition, try-with-resources takes care
    of all the messy details associated with failed attempts to catch exceptions gracefully.


    For the scoop about try-with-resources, see Chapter 13.


    ![](img/ceb51741697a1347a52f2b180d896ec0_461_0.png)'
