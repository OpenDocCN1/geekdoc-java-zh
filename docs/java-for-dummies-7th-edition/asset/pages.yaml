  md: '# Varying a Variable


    No matter how you acquire your million dollars, you can use a variable to tally
    your wealth. Listing 4-1 shows the code.


    # Listing 4-1: Using a Variable


    ```

    amountInAccount = 50.22;

    amountInAccount = amountInAccount + 1000000.00;

    ```


    Don''t have to type the code in Listing 4-1 (or in any of this book''s listings).
    To download all the code in this book, visit the book''s website (www.allmycode.com/JavaForDummies).


    The code in Listing 4-1 makes use of the amountInAccount variable. A variable
    is a placeholder. You can stick a number 50.22 into a variable. After you place
    a number in the variable, you can change your mind and put a different number
    into the variable. (That''s what varies in a variable.) Of course, when you put
    a new number in a variable, the old number is no longer there. If you didn''t
    save the code somewhere else, the old number is gone.


    Figure 4-1 gives a before-and-after picture of the code in Listing 4-1. After
    the first statement in Listing 4-1 is executed, the variable amountInAccount has
    the 50.22 in it. Then, after the second statement of Listing 4-1 is executed,
    the amountInAccount suddenly has 1000050.22 in it. When you think about a variable,
    picture a place in the computer''s memory where transistors store 50.22, 1000050.22,
    or whatever. On the left side of Figure 4-1, imagine the box with 50.22 in is
    surrounded by millions of other boxes.


    ![](img/ceb51741697a1347a52f2b180d896ec0_80_0.png)


    | Before executing | After executing |

    | :--- | :--- |

    | amountInAccount = amountInAccount + 1000000.00; | amountInAccount = amountInAccount
    + 1000000.00; |

    | amountInAccount | amountInAccount |

    | 50.22 | 1000050.22 |


