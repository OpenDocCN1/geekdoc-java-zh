    In Table 7-1, each account has three things — a name, an address, and a balance.
    That''s how things were done before object-oriented programming came along. But
    object-oriented programming involved a big shift in thinking. With object-oriented
    programming, each account can have a name, an address, a balance, and a way of
    being displayed.


    In-oriented programming, each object has its own built-in functionality. An account
    knows how to display itself. A string can tell you it has the same characters
    inside as another string. A PrintStream instance, such as System.out, knows how
    to print. In object-oriented programming, each object has its own methods. These
    methods are little subprograms that you can call to have an object do to (or for)
    itself.


    And why is this a good idea? It''s good because you''re making pieces of data
    take responsibility for themselves. With object-oriented programming, all the
    functionality''s associated with an account is collected the code for the Account
    class. Everything you need to know about a string is located in the String.java.
    Anything having to do with year numbers (whether they have two or four digits,
    for instance) is handled right inside the Year class. Therefore, if anybody has
    problems with your Account class or your Year class, or she knows just to look
