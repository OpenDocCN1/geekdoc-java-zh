  md: 'With many IDEs, you don''t have to type your own accessor methods. First, you
    type a field declaration like `private String StringName`. Then, in your IDE''s
    menu bar, you choose `Source: Generate Getters and Setters`, or choose `Code:
    Insert Code::Setter` or some mix of those commands. After you make your choices,
    the IDE creates accessor methods and adds them to your code.


    Notice that all the setter and getter methods in Listing 7-8 are declared to be
    public. This ensures that anyone from anywhere can call these two methods. The
    idea here is that manipulating the actual fields from outside the `Account` code
    is impossible, but you can easily reach the approved setter and getter methods
    using those fields.


    Think again about the automatic teller machine. Someone using the ATM can type
    a command that directly changes the value in his or her account''s balance field,
    but the procedure for depositing a million-dollar check is easy to follow. The
    people who build the teller machines know that if the check-depositing procedure
    is complicated, plenty of customers will mess it up. So that''s the story—make
    impossible that people shouldn''t do and make sure the tasks are doing easily.


    Nothing about having setter and getter methods is sacred. You don''t have to write
    any setter and getter methods that you''re not going to use. For instance, in
    Listing 7-8, you can omit the declaration of method `getBalance`, and everything
    still works. The problem is only if you do this then anyone who wants to use your
    `Account` class and retrieve the default of an existing account is up a creep.


    When you create a method to set the value in a balance field, you don''t have
    to name your method `setBalance`. You can name it `tuFish` or whatever you like.
    The trouble is that the `set` convention (with lowercase letters in set and an
    uppercase letter to start the `FieldName` part) is an established stylish convention
    in the world of Java programming. If you don''t follow the convention, you confuse
    the kumquats out other Java programmers. If your integrated development environment
    has drag-and-drop GUI capability, you may temporarily lose capability (For a word
    about drag-and-drop GUI design, see Chapters 2 and 16).


    When you call a setter method, you feed it a value of the type that is being set.
    That''s why, in Listing 7-9, you call your `Account.setBalance(55.63)` with a
    parameter of type `double`. In contrast, when you call a getter method, you usually
    don''t feed any values to the method. That''s why, in Listing 7-9, you call your
    `Account.getBalance()` with an empty parameter list. Occasionally, you may want
    to get and set a value with a single statement. To add a dollar to your account''s
    existing balance, you write `yourAccount.setBalance(yourAccount.getBalance() +
    1.00).


