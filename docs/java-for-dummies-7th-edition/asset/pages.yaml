- pgno: 389
  md: "The truth is that everything came out fine. I was bruised but not beaten. My\
    \ parents paid for the damage to the car, so I never suffered any financial consequences.\
    \ (I managed to pass on the financial burden by putting the RunAreException into\
    \ my throws clause).\n\nThis incident helps to explain why the way I do about\
    \ exception handling. In particular, \"What happens if, while the computer is\
    \ recovering from one exception, a second exception is thrown?\" After all, the\
    \ statements inside a catch aren't immune to calamities.\n\nWell, the answer to\
    \ this question is anything but simple. For starters, you can put a try statement\
    \ inside a catch clause. This protects you against unexpected, potentially embarrassing\
    \ incidents that can crop during execution of the catch clause. When you start\
    \ worrying about cascading exceptions, you open up a slimy chain of worms. Number\
    \ of scenarios is large, and things can become complicated quickly.\n\nOne-not-to-complicated\
    \ thing that you can do is create a finally clause. Like a catch clause, a finally\
    \ clause comes after a try clause. The big difference is that the statements in\
    \ a finally clause are executed whether or an exception is thrown. The idea is,\
    \ \"No matter what happens, good or bad, the execute statements inside this finally\
    \ clause.\" Listing 13-11 has an example.\n\n# LISTING 13-11: Jumping Around\n\
    \n```\nimport static java.lang.System;\n\npublic class DemoFinally {\n\n    public\
    \ static void main(String args[]) {\n        try {\n            doSomething();\n\
    \        } catch (Exception e) {\n            out.println(\"Exception caught in\
    \ main.\");\n        }\n    }\n\n    static void doSomething() {\n        try\
    \ {\n            out.println(@ / 0);\n        } catch (Exception e) {\n      \
    \      out.println(\"Exception caught in doSomething.\");\n        }\n       \
    \ out.println(@ / 0);\n    }\n}\n(continued)\n```"
