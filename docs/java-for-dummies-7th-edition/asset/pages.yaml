  md: "# Caring for your pet\n\nHere’s a quotation from the book Java For Dummies,\
    \ 7th Edition:\n\n> \"In order to use an abstract class, you have to create an\
    \ ordinary (non-abstract) class that extends the abstract class.\"\n\nSo, to use\
    \ the HousePet class in Listing 15-7, you have to create a class that extends\
    \ the HousePet class. The code in Listing 15-8 extends the abstract HousePet class\
    \ and provides a body for the method howToCareFor.\n\n# Listing 15-8: It’s a Dog’s\
    \ Life\n\n```\npublic class Dog extends HousePet {\n    int walksPerDay;\n\n \
    \   Dog(String name, double weight, int walksPerDay) {\n        super(name, weight,\
    \ \"Woof\");\n        this.walksPerDay = walksPerDay;\n    }\n\n    @Override\n\
    \    public void howToCareFor() {\n        System.out.print(\"Walk \" + name);\n\
    \        System.out.println(\"\" \" + walksPerDay + \" times each day.\");\n \
    \   }\n}\n```\n\nIn addition to having a name, a weight, and a sound, every dog\
    \ walks a certain number of times per day. And now, because of the howToCareFor\
    \ method’s body, what caring for a dog means: It means walking the dog a certain\
    \ number of times each day. It’s a good thing that the howToCareFor method is\
    \ abstract in the HousePet class. You wouldn’t necessarily want to walk some kind\
    \ of pet.\n\nTake, for example, a domestic cat. \"Caring\" for a cat may mean\
    \ not bothering it too often. And cats have other characteristics — characteristics\
    \ that don’t apply to dogs. For example, some cats go outdoors; others don’t.\
    \ You can make walks PerDay be for an indoor cat, but that feels like cheating.\
    \ Instead, each cat can have a boolean value representing the cat’s indoor/outdoor\
    \ status. Listing 15-9 has the code."
