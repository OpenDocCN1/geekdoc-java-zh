  md: "passed by value. If you read this, you probably missed the emphasis on the\
    \ parameter’s having one of the eight primitive types. The emphasis is needed\
    \ because passing objects (reference types) doesn't work the same way.\n\nWhen\
    \ you pass an object to a method, the object is passed by reference. What this\
    \ means to you is that statements in the called method can change any values that\
    \ are stored in the object's variables. Those changes affect the values that are\
    \ seen by whatever code called the method. Listings 10-12 and 10-13 illustrate\
    \ the point.\n\n# LISTING 10-12: What Is a City?\n\n```\nclass City (\n    int\
    \ population;\n)\n```\n\n# LISTING 10-13: Passing an Object to a Method\n\n```\n\
    public class TrackPopulation3 {\n\n    public static void main(String args[])\
    \ { {\n        City smackoverAR = new City();\n        smackoverAR.population\
    \ = 2232;\n        birth(smackoverAR);\n        System.out.println(smackoverAR.population);\n\
    \    }\n\n    static void birth(City aCity) {\n        aCity.population++;\n \
    \   }\n}\n```\n\nWhen you run the code in Listings 10-12 and 10-13, the output\
    \ that you get is the number 2,233. That's good because the code has things like\
    \ ++ and the word birth in it. The deal is, adding 1 to aCity.population inside\
    \ the birth method actually changes the value of smackoverAR.population, as it's\
    \ known in copy of the main method.\n\nTo see how the birth method changes the\
    \ value of smackoverAR.population, look at Figure 10-12. When you pass an object\
    \ to a method, the computer doesn't make a copy of the entire object. Instead,\
    \ the computer makes a copy of a reference to that object. (Think of the way it's\
    \ shown in Figure 10-12. The computer makes a copy of an arrow that points to\
    \ the object.)"
