    Listing 3–3 shows you what a method call looks like, and Figure 3–4 also contains
    a method call that looks like this:


    ```

    System.out.println("You''ll love Java!");

    ```


    When the computer executes this statement, the computer calls a method System.out.println
    into action. (Yes, in Java, a name can have dots in it. It does mean nothing.)


    I said it already, but it''s worth repeating: In System.out.println, the next-to-last
    character is a lowercase l (as in the word line), not a digit I (as in the number
    one). If you use a 1, your code won''t work. Just think of println as a way of
    saying "print" and you won''t have any problem.


    To learn the meaning behind the dots in Java, see Chapter 7.


    3–5 illustrates the System.out.println situation. Actually, two methods active
    roles in the running of the Display program. Here''s how they work:


    +   >> A declaration for a main method. I wrote the method myself. This method
    is called automatically whenever I run the Display program.


    +   >> There''s a call to the System.out.println method. The method call for the
    System.out.println method is the only statement in the body of the main method.
    In other words, calling the System.out.println method is the only item on the
    method''s to-do list.


    The declaration for the System.out.println method is buried inside the official
    Java API. For a refresher on the Java API, see the sections "Grammar and the common
    names" and "The words in a Java programmer," earlier in this chapter.


    When I say things, "System.out.println is buried inside the API," I''m not doing
    justice to the API. True, you can ignore all the nitty-gritty Java code inside
    the API. All you need to remember is that System.out.println is defined somewhere-inside
    that code. But I''m not being fair when I make the API code sound like something
    magical. The API is just another bunch of Java code. The statements in the API
