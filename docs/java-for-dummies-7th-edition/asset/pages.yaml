    ![](img/ceb51741697a1347a52f2b180d896ec0_112_0.png)


    You are trying to decide between using preincrement or postincrement? Try no longer.
    Most programmers use postincrement. In a typical Java program, you often see things
    like numberOfBunnies++. You seldom see things like ++numberOfBunnies.


    In addition to preincrement and postincrement, Java has two operators that use
    -- These operators are called decrement and postdecrement:


    +   - With preincrement(--numberOfBunnies), the computer subtracts 1 from the
    variable''s value before the variable is used in the rest of the statement.

    - With postdecrement(numberOfBunnies--), the computer subtracts 1 from the variable''s
    value after the variable is used in the rest of the statement.


    ![](img/ceb51741697a1347a52f2b180d896ec0_112_1.png)


    Instead of writing ++numberOfBunnies, you could achieve the same effect by writing
    numberOfBunnies = numberOfBunnies + 1. So some people conclude that Java''s ++
    and -- are for saving keystrokes — to keep those fingers from using ++ is to avoid
    the inefficient and error-prone practice of writing the writing the same variable
    name, such as numberOfBunnies, twice in the same statement. If you write numberOfBunnies
    only once (as when you use ++ or --), the computer has to figure out numberOfBunnies
    means only once once. On top of that, when you write numberOfBunnies only once,
    you have two chances) to type the variable name incorrectly. With simple expressions
    like numberOfBunnies++, these advantages hardly make a difference. But with more
    complicated expressions, such as inventoryItems [(quantityReceived--*itemsBox+17)],
    the efficiency and accuracy that you gain by using ++ and -- are significant.


    TECHNICAL

