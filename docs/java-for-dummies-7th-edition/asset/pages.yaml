- pgno: 26
  md: '# Getting Perspective: Where Java Fits In


    Here’s a brief history of modern computer programming:


    +   > 1954-1957: FORTRAN is developed.


    FORTRAN was the first computer programming language. For scientific programming,
    FORTRAN is a real racehorse. Year after year, FORTRAN is a leading language among
    computer programmers throughout the world.


    +   > 1959: Grace Hopper at Remington Rand develops the COBOL programming language.


    The B in COBOL stands for *Business*, and business is what COBOL is all about.
    The language’s primary feature is the processing of one record after another,
    one customer another, or one employee after another.


    Within a few years after its initial development, COBOL became the most widely
    used language for business processing.


    +   > 1972: Dennis Ritchie at AT&T Bell Labs develops the C programming language.


    The ‘look’ and ‘feel’ that you see in this book’s examples from the C programming
    language. Code written in C uses braces, if it statements, for statements, and
    so on.


    In terms of power, you can use C to solve the same problems that you can solve
    using FORTRAN, Java, or any other modern programming language. (You can write
    a scientific calculator program in COBOL, but doing that of thing would feel really
    strange.) The difference between one programming language and another isn’t power.
    The difference is ease and appropriateness of use. That’s where the Java language
    excels.


    +   > 1986: Bjarne Ststrup (again at AT&T Bell Labs) develops C++.


    Unlike C ancestor, the language C++ supports object-oriented programming. This
    represents a huge step forward. (See the next section in this chapter.)


    +   > 23, 1995: Sun Microsystems releases its official version of the Java programming
    language.


    Java improves upon the concepts in C++, Java’s “Write Once, Run Anywhere” philosophy
    makes the language ideal for distributing code across the Internet.


    Additionally, Java is a great general-purpose programming language. With Java,
    you can write windowed applications, build and explore databases,'
  merge: -1
  img_proc: true
