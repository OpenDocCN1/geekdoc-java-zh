  md: "In Listing 13-9, the method call that can throw an InterruptedException inside\
    \ a try clause. That try clause has a catch clause with exception type InterruptedException.\n\
    \n# LISTING 13-9: Acknowledging with a try-catch Statement\n\n```\nimport static\
    \ java.lang.System.out;\n\npublic class GoodNightsSleep {\n\n    public static\
    \ void main(String[] args[]) {\n        out.print(\"Excuse me I nap \");\n   \
    \     out.println(\"for just five seconds...\");\n\n        takeANap();\n\n  \
    \      out.println(\"Ah, that was refreshing.\");\n    }\n\n    static void takeANap()\
    \ {\n        try {\n            Thread.sleep(5000);\n        } catch (InterruptedException\
    \ e) {\n            out.println(\"Hey, who woke me up?\");\n        }\n    }\n\
    }\n```\n\nIt's my custom, at this point in a section, to remind you that a run\
    \ of Listing Such-and-Such is in Figure So-and-So. But the problem here is that\
    \ Figure 13-13 does not join the code to Listing 13-9. When you run the program\
    \ in Listing 13-9, the computer displays Excuse while I nap for just five seconds,\
    \ pauses for five seconds, and then displays Ah, that was refreshing. The code\
    \ works because the call to the sleep method, which can throw an InterruptedException,\
    \ is inside a try clause. That try clause has a catch clause of type InterruptedException.\n\
    \n# FIGURE 13-13:\nA 5-second pause before the \"Ah\" line.\n\n| Excuse while\
    \ I nap for just five seconds... | Ah, that was refreshing.|\n\nSo much for acknowledging\
    \ an exception with a try-catch statement. You can acknowledge an exception another\
    \ way, shown in Listing 13-10."
