  md: "# HOW TO CHEAT: ENUM TYPES\nAND SWITCH STATEMENTS\n\nListings 9-2 and 9-3 contain\
    \ col long-winded names such as TempScale.FAHRENIT and TempScale.CELSIUS. Names\
    \ such as FAHRENIT and CELSIUS belong to my TempScale (the type defined in Listing\
    \ 9-1). These names have no meaning-outside of my TempScale context. (If you think\
    \ I'm being egotistical with this \"no meaning out of my context\" remark, try\
    \ deleting the TempScale-part of TempScale.FAHRENIT in Listing 9-2. Suddenly,\
    \ Java tells you that your code contains an error.)\n\nJava is normally fussy\
    \ about type names and dots. But when they created enum types, the makers of Java\
    \ decided that enum and switch statements deserved special treatment. You can\
    \ use an enum value to decide which case to execute in a switch statement. When\
    \ you do this, do not use the type name in the case expressions. For example,\
    \ the following Java code is correct:\n\n```\nTempScale scale = TempScale.RANKINE;\n\
    char letter;\nswitch (scale) {\n    case CELSIUS:\n        letter = 'C';\n   \
    \     break;\n    case KVIN:\n        letter = 'K';\n        break;\n    case\
    \ RANKINE:\n    case REAMUR:\n        letter = 'R';\n        break;\n    default:\n\
    \        letter = 'X';\n        break;\n}\n```\n\nIn the first line of code, I\
    \ write TempScale.RANKINE because this first line isn't inside a switch statement.\
    \ But in the next lines of code, I write CELSIUS, case KVIN, and case RANKINE\
    \ without the word TempScale. In fact, if I create a case by writing case TempScale.RANKINE,\
    \ java complains with a loud, obnoxious error message."
