- pgno: 339
  md: 'In the third line, the call to get(0) grabs the earliest value in the things
    collection. The call to get(0) is okay, but then the compiler chokes on the attempted
    assignment to myAccount. You get a message on the third line saying that whatever
    you get from the things can''t be stuffed into the myAccount variable. You get
    this message because by time the compiler reaches the third line, it has forgotten
    the item added on the second line was type TypeAccount!


    The introduction of generics fixes this problem:


    ```

    ArrayList<Account> things = new ArrayList<Account>();

    things.add(new Account());

    myAccount = things.get(0);

    // THIS CODE INSTEAD. IT''S GOOD CODE.

    ```


    Adding <Account> in two places tells the compiler that things stores Account—instances—nothing
    else. So, in the third line of the preceding code, you get a value from the things
    collection. Then, because things only stores Account objects, you can make myAccount
    refer to that new value.


    Java 5.0 added generics to Java. But soon after the birth of Java 5.0, programmers
    noticed how clumsy the code for generics can be. After all, you can create generics
    within generics. An ArrayList can contain a bunch of arrays, each of which can
    be an ArrayList. So you can write


    ```

    ArrayList<ArrayList<String>[]> mess = new ArrayList<ArrayList<String>>();

    ```


    All the repetition in this declaration gives me a headache! Java 7 and later versions
    have a diamond operator: <>. The diamond operator tells Java to reuse whatever
    insanely complicated stuff you put in the previous part of the generic declaration.
    In this example, the < > tells Java to reuse <ArrayList<String>[], even though
    you write ArrayList<String>>() only once. Here''s the streamlined Java 7 code:


    ```

    ArrayList(ArrayList<String>[]) mess = new ArrayList<>();

    ```


    In Java 7 and later, you can write each of these declarations: the original, nasty
    declaration with two occurrences of ArrayList<String>[] or the streamlined (only
    mildly nasty) declaration with the diamond operator and only one ArrayList<String>()
    occurrence.


    The streamlined code is still complicated. But without all the ArrayList<String>
    repetition, the streamlined code is less cumbersome. The Java 7 diamond operator
    takes away one chance for you to copy something incorrectly and have a big error
    in your code.'
