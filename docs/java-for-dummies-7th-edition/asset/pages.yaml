    \ that checks each possible verse number:\n\n```\nif (verse == 1) {\n    out.println(\"\
    That's because he has no brain.\");\n}\nif (verse == 2) {\n    out.println(\"\
    That's because he is a pain.\");\n}\nif (verse == 3) {\n    out.println(\"Cause\
    \ this is the last refrain.\");\n}\n```\n\nThat approach seems wasteful. Why not\
    \ create a statement that checks the verse of just once and then takes an action\
    \ on the value it finds? Fortunately, just such a statement exists. It's called\
    \ a switch statement. Listing 5-6 has an example of a switch statement.\n\n# LISTING\
    \ 5-6: A switch Statement\n\n```\nimport static java.lang.System.out;\nimport\
    \ java.util.Scanner;\n\npublic class JustSwitch {\n    public static void main(String[]\
    \ args) {\n        Scanner keyboard = new Scanner(System.in);\n        out.print(\"\
    Which verse? \");\n        int verse = keyboard.nextInt();\n\n        switch (verse)\
    \ {\n            case 1:\n                out.println(\"That's because he has\
    \ no brain.\");\n                break;\n            case 2:\n               \
    \ out.println(\"That's because he is a pain.\");\n                break;\n   \
    \         case 3:\n                out.println(\"Cause this is the last refrain.\"\
    );\n                break;\n        }\n    }\n}\n```"
