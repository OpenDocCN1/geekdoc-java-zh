    \ other items? The answer is twofold:\n\n+   - In a Java program, curly braces\
    \ enclose meaningful units of code.\n- You, the programmer, can (and should) indent\
    \ lines so that other programmers can see at a glance the outline form of your\
    \ code.\n\nIn an outline, everything is subordinate to the item in Roman numeral\
    \ I. In a Java program, everything is subordinate to the top line — the line with\
    \ class in it. To indicate that everything else in the code is subordinate to\
    \ this class line, you else in the code goes inside these curly braces. (See Listing\
