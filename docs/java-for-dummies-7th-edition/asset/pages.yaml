- pgno: 58
  md: 'The differences among these three kinds of words are similar to the differences
    among words in the English language. In the sentence "Sam is a person," the word
    person is like a Java keyword. No matter who uses the word person, the name always
    means the same thing (Sure, you can think of bizarre exceptions in English usage,
    but please don''t).


    The word Sam is like a Java identifier because Sam is a name for a particular
    person. Words like Sam, Dinswald, and McGillimaroo aren''t prepacked with meaning
    in the English language. These words apply to different people depending on the
    context and when parents pick one for their newborn kid.


    Now consider the sentence "Julius Caesar is a person." If you utter this sentence,
    you''re probably talking about the fellow who ruled Rome until the Ides of March.
    Although the name Julius Caesar isn''t-wired into the English language, almost
    everyone uses the name to refer to the same person. If English were a programming
    language, the name Julius Caesar would be an API identifier.


    So here''s how I, in my mind, divide the words in a Java program into categories:


    +   **Keywords** is a word that has its own special meaning in the Java programming
    language, and that meaning doesn''t change from one program to another. Examples
    of keywords in Java are if, else, and do.


    The JCP committee members, who have the final say on what constitutes a Java program,
    have you think about the two parts of Java, which I discuss earlier, in the section
    "The grammar and common names," the Java keywords belong solidly to the language
    specification.


    +   **Identifiers** is a name for something. The identifier''s meaning can change
    from one program to another, but other identifiers'' meaning tend to change more:


    +   Identifiers created by you. As a Java programmer (even as a novice Java programmer),
    you create new names for classes and other items you describe in your programs.
    Of course, you may name something *Prime*, and the guy code two cubicles down
    the hall can name something *Prime*. That''s because Java doesn''t have a predetermined
    meaning for *Prime*. In your program, you can make *Prime* stand for the Federal
    Reserve''s prime rate. And the guy down the hall can make *Prime* stand for the
    "bread, roll, preserves, and rib." A conflict doesn''t arise, because you and
    your coworker are writing two different Java programs.


    +   **Identifiers from the API**: The JCP members have created names for many
    things and thrown tens of thousands of these names into the Java API.


