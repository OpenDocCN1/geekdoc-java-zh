    # Using generics


    Look again at Listing 12-1, shown earlier, and notice the funky ArrayList declaration:


    ```

    ArrayList<String> people = new ArrayList<>();

    ```


    Starting with Java 5.0, each collection class is generified. That ugly-sounding
    word means that every collection declaration should contain angle-bracketed stuff,
    such as <String>. The thing that is sandwiched between < and tells what values
    of the new collection may contain. For example, in Listing 12-1, the words ArrayList<String>
    people tell you that people is a bunch of strings. That is, the people list contains
    String objects (not Room objects, Account objects, not Employee objects, nothing
    other than String objects).


    You can use generics in any version of Java before 5.0, and the code in Listing
    12-1 goes kabloey in any version before Java 7. For more generics, see the nearby
    sidebar, "All about generics." And for more Java''s version numbers, Chapter 2.


