  md: "# Creating a Database and a Table\n\nThe crux of JDBC is contained in two packages:\
    \ java.sql and javax.sql, which are in the Java API. This chapter's examples use\
    \ the classes in java.sql. The first example is shown in Listing 17-1.\n\n# LISTING\
    \ 17-1: Creating a Database and a Table\n\n```\nimport java.sql.Connection;\n\
    import java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class CreateTable {\n    public static void main(String args[]) {\n \
    \       final String CONNECTION = \"jdbc:derby:AccountDatabase;create=true\";\n\
    \n        try (Connection conn = DriverManager.getConnection(CONNECTION))\n  \
    \          Statement statement = conn.createStatement()) {\n\n            statement.executeUpdate(\"\
    create table ACCOUNTS (\n                NAME VARCHAR(32) NOT NULL PRIMARY KEY,\n\
    \                ADDRESS VARCHAR(32),\n                BALANCE FLOAT\n       \
    \     );\");\n\n            System.out.println(\"ACCOUNTS table created.\");\n\
    \n        } catch (SQLException e) {\n            e.printStackTrace();\n     \
    \   }\n    }\\}\n```\n\nThe examples in this chapter is a bit trickier than running\
    \ other chapters' examples. To talk to a database, you need an intermediary package\
    \ of software known as a database driver. Database drivers come in all shapes\
    \ and sizes, and many of them are quite expensive. But Listing 17-1 points to\
    \ a small, free driver: the Derby JDBC driver. The code for the Derby JDBC driver\
    \ is kept in the Embedded Driver class (which is a Java class). This class lives\
    \ inside the org.apache.derby.jdbc package.\n\nWhen you use Java 9, you don't\
    \ get the org.apache.derby.jdbc package. You need a separate file named derby.jar,\
    \ which you can download from http://db.apache.org/derby_downloads.html."
