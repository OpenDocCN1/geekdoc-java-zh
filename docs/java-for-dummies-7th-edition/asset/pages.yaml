  md: '# DIGITS BEYOND THE DECIMAL POINT


    Java has two different types that digits beyond the decimal point: type double
    and type float. So what''s the difference? When you declare a variable to be of
    type double, you''re telling the computer to keep track of 64 bits when it stores
    the variables'' values. When you declare a variable to be of type float, the computer
    keeps track of only 32 bits.


    You could change Listing 4-2 and declare InAccount to be of type float.


    ```

    float amountAccount;

    ```


    Surely, 32 bits are enough to store a small number like 50.22, right? They are
    and they aren''t. You could easily store 50.00 with 32 bits. With 6 bits, the
    size of the number doesn''t matter. The accuracy matters. In a 64-bit double variable,
    you''re using most of the bits to store beyond the decimal point. To store the
    .22 part of 50.22, you need more than the measly 32 bits that you get with float.


    Do you really believe what you just read — that takes more than 32 bits to store
    .22? To convince you, I made a few changes to the code in Listing 4-2. I am amount
    InAccount.be of type float. Then I changed the first three statements inside the
    main method as follows:


    ```

    float amountAccount;


    amountAccount = 50.22F;

    amountAccount = amountAccount + 100000.0F;

    ```


    (To understand why I used the letter F in 50.22F and 100000.00F, see Table 4-1,
    later in this chapter) The output was


    You have $100000.25 in your account.


    Compare this with the output in Figure 4-5. When I switch from type double to
    float, Charles has an extra cents in his account. By changing to the 32-bit float,
    I''ve clobbered the accuracy in the amountAccount''s hundredths place. That''s
    bad.


    Another difficulty with float values is purely cosmetic. Look again at the literals,
    50. 22 and 100000., in Listing 4-2. The Laws of Java say that literals take up
    64 bits each. So, if you declare amountAccount to be of type float, you''ll run
    into trouble. You''ll have stuffing those 64-bit literals into your little 32-bit


