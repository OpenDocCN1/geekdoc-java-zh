    of your JFrame object to another computer''s screen. Then the other computer can
    check the frame''s version to make sure no funny business is taking place.


    In 9, I side-step the serialVersionUID issue by telling Java to ignore warnings
    about missing serial version numbers. In Listing 16-1, I take a border approach.
