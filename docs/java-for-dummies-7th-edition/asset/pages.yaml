  md: '# STATEMENTS AND EXPRESSIONS


    You can describe the pre- and postincrement and pre- and postdecrement operators
    in two ways: the way everyone understands them and the right way. The way that
    I explain the concept in most of this section (in terms of time, with before and
    after) is the way that everyone understands it. Unfortunately, the way everyone
    understands it isn''t the right way. When you see ++ or -- you can think in terms
    of time sequence. But occasionally a programmer ++ or -- in a convoluted way,
    and the notions of before and after break down. So if you''re in a tight spot,
    think about these operators in terms statements and expressions.


    First, remember that a statement tells the computer to do something, and an expression
    has a value. (I discuss statements in Chapter 3, and I describe expressions-where
    in this chapter.) Which category does numberOfBunnies belong to? The surprising
    answer is both. The java code numberOfBunnies++ is both a statement and an expression.


    Assume that, before the computer executes the out.

    println(numberOfBunnies++), the value of numberOfBunnies is 28.


    +   - As a statement, numberOfBunnies++ tells the computer to add 1 to numberOfBunnies.

    - As an expression, the value of numberOfBunnies++ is 28, not 29.


    Even though the computer adds 1 to numberOfBunnies, the code out.

    println(numberOfBunnies++) really means out.println(28).


    Now, almost everything you just read about numberOfBunnies++ is true about ++numberOfBunnies.
    The only difference is that as an expression, ++numberOfOf behaves in a more intuitive
    way.


    +   - As a statement, ++numberOfBunnies tells the computer to add 1 to numberOfBunnies.

    - As an expression, the value of ++numberOfBunnies is 29.


    So, without.println(++numberOfBunnies), the computer adds 1 to the variable numberOfBunnies,
    and the code out.println(++numberOfBunnies) really means out.println(29).'
