  md: 'You can also reserve myFrame for a JFrame value by writing


    ```

    JFrame myFrame;

    ```


    or by writing


    ```

    JFrame myFrame = new JFrame();

    ```


    To review the notion of a Java class, see the sections on object-oriented program-ming
    (OOP) in Chapter 1.


    ![](img/ceb51741697a1347a52f2b180d896ec0_101_0.png)


    Every Java class is a reference type. If you declare a variable to some type

    that''s not a primitive type, the variable''s type is (most of the time) the name
    of a

    Java class.


    Now, when you declare a variable to have type int, you can visualize what

    declaration means in a fairly straightforward way. It means that, somewhere

    inside the computer''s memory, a storage location is reserved for that variable''s

    value. In the storage location is a bunch of bits. The arrangement of the bits

    ures that a certain whole number is represented.


    That is fine for primitive types like int or double, but what does it

    mean when you declare a variable to have a reference type? What does it mean to

    declare variable myFrame to of type JFrame?


    Well, what does it mean to declare ithYouGod to be an E. E. Cummings poem?

    What would it mean to write the following declaration?


    ```

    EECummingsPoem ithankYouGod;

    ```


    It means that a class of things is EECummingsPoem, and ithankYouGod refers to

    aninstance of that class. In other words, ithankYouGod is an object belonging
    to the

    EECummingsPoem class.


    Because JFrame is a class, you can create objects from that class. (If you don''t

    believe me, read some of my paragraphs about classes and objects in Chapter 1).

    Each object (instance of the JFrame class) is an actual frame - a window

    that appears on the screen when you run the code in Listing 4-6. By declaring
    the

    variable myFrame to be of type JFrame, you''re using the name of the

    myFrame. This reservation tells the computer that myFrame can become a nickname
    for one of

    the windows that appears on the computer screen. Figure 4-11 illustrates

    situation.'
