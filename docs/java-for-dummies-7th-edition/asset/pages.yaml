    # # What You Install on Your Computer


    I once met a tool-and-die maker. He used tools to make tools (and dies). I was
    happy to meet him because I knew that, one day, I''d make an analogy between computer
    programmers and tool-and-die makers.


    A computer programmer uses existing programs as tools to create new programs.
    The existing programs and new programs might perform very different kinds of tasks.
    For example, a Java program (a program that you create) might keep track of a
    business''s customers. To create customer-tracking program, you might use an existing
    program that looks for errors in your Java code. This general-purpose error-finding
    program can find errors in any kind of Java code—customer-tracking code, weather-predicting
    code, gaming code, or the code for an app on your mobile phone.


    So many tools do you need for creating Java programs? As a novice, you need three
    tools:


    >> You need a compiler.


    A compiler takes the Java code that you write and turns that code into a bunch
    of instructions called bytecode.


    Humans can''t readily compose or decipher bytecode instructions. But certain software
    that you run on your computer can interpret and carry out bytecode instructions.'
