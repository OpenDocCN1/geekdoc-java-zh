- pgno: 23
  md: '# Chapter 1


    # All about Java


    Say what you want about computers. As far as I''m concerned, computers are good
    for just two simple reasons:


    +   - When computers do work, they feel no resistance, no stress, no bore-dom,
    and no fatigue. Computers are our electronic slaves. I have my computer working
    24/7 doing calculations for Cosmology@Home — a distributed-computing project to
    investigate models describing the universe. Do I feel sorry for my computer because
    it''s working so hard? Does the computer complain? Will the computer report me
    to the National Labor Relations Board?


    I can make demands, give the computer its orders, and crack the whip. Do I (or
    should I) feel the least bit guilty? Not at all.


    +   - Computers move ideas, not paper. Not long ago, when you wanted to send a
    message to someone, you hired a messenger. The messenger got on his horse or delivered
    your message personally. The message was on paper, parchment, a clay tablet, or
    whatever physical medium was available at the time.


    This process seems wasteful now, but that''s only because you and I are sitting
    comfortably in the electronic age. Messages are ideas, and physical things like
    ink, paper, and horses have little or nothing to do with real ideas they''re just
    temporary carriers for ideas (even though people used them for centuries). Nevertheless,
    the ideas themselves are paperless, breathless, and messengerless.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The neat thing about computers is that they carry ideas efficiently. They carry
    nothing but the ideas, a couple of photons, and a little electrical power. They
    do this with no muss, no fuss, and no extra physical baggage.


    When you start dealing efficiently with ideas, something very nice happens. Sud-denly,
    the overhead is gone. Instead of pushing paper and trees, you''re pushing numbers
    and concepts. Without the overhead, you can do things much faster and do things
    that are far more complex than ever before.


    # # What You Can Do with Java


    It would be so nice if all this complexity were free, but unfortunately, it isn''t.
    Someone has to think hard and decide exactly what to ask the computer to do. After
    thinking takes place, someone has to write a set of instructions for the computer
    to follow.


    Given the current state of affairs, you can''t write these instructions in English
    or any other language that people speak. Science fiction is filled with stories
    about people who say simple things to robots and get back disastrous, unexpected
    results. English and other such languages are unsuitable for communication with
    computers, for several reasons:


    +   >> An English sentence can be misinterpreted. "Chew one tablet three times
    a day until finished."


    +   >> It''s difficult to weave a very complicated command in English. "join flange
    A to protuberance B, making to connect only the outermost lip of flange to the
    larger end of the protuberance B, joining the middle and inner lips of flange
    A a grommet C."


    +   >> An English sentence has lots of baggage. "Sentence as unneeded words."


    +   >> English is difficult to interpret. "As part of this Publishing Agreement
    between John Wiley & Sons, Inc. (Wiley) and the Author (''Barry Burd''), Wiley
    will pay the sum of one-thousand-two-hundred-fifty-seven dollars and sixty-three
    cents ($1,257.63) to the Author for partial submission of For Dummies, 7th Edition
    (The Work)."


    To tell a computer what to do, you have to use a special language to write terse,
    unambiguous instructions. A special language of this is called a *programming
    language*. A set of instructions written in such a language is called a *program*.
    When looked at as a big blob, these instructions are called *software* or *code*.
    Here is what code looks like when it''s written in Java:


    12 PART 1 Getting Started with Java'
