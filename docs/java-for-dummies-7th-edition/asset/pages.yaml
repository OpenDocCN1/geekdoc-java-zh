    # # Making Decisions (Java if Statements)


    When you''re writing computer programs, you''re constantly hitting forks in roads.
    Did the user correct type the password? If yes, let the user work; if no, kick
    the bum out. So the programming language needs a way of making a program branch
    in one of two directions. Fortunately, the language has a way: It''s called an
    if statement.


    # # Guess the number


    Listing 5-1 illustrates the use of an if statement. Two runs of the program in
    Listing 5-1 are shown in Figure 5-1.


    | LISTING 5-1: | A Guessing Game |

    |--- | import java.lang.System.out;

    import java.util.Scanner;

    import java.util.Random;


    public class GuessingGame {


    public static void main(String[] args) {

    Scanner keyboard = new Scanner(System.in);


    out.print("Enter an int from 1 to 10: ");


    int inputNumber = keyboard.nextInt();

    int randomNumber = new Random().nextInt(10) + 1;


    if (inputNumber == randomNumber) {

    out.println("************");

    out.println("You win.");

    out.println("************");

    } else {

    out.println("You lose.");

    out.print("The random number was ");

    out.println(randomNumber + ".");

    }


    }

    } | |'
