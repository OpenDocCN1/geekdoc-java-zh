    # A taxonomy of lambda expressions


    Java divides lambda expressions into about 45 different categories. Table 12-2
    lists a few of the categories.


    TABLE 12-2 A Few Kinds of Lambda Expressions

    | Name | Description | Example |

    |---|---|---|n| Function | Accepts one parameter; produces a result of any type
    | (sale) -> sale. price |

    | Predicate | Accepts one parameter; produces a boolean valued result | (sale)
    -> sale.item.equals("DVD") |

    | BinaryOperator | Accepts two parameters of the same type; produces a result
    of the same type | (price1, price2) -> price1 + price2 |

    | Consumer | Accepts one parameter; produces no result | (sale) -> System.out.println(sale.
    price) |


    ![](img/ceb51741697a1347a52f2b180d896ec0_354_0.png)


    The categories in Table 12-2 aren''t mutually exclusive. For example, every Predicate
    is a Function. (Every Predicate accepts one parameter and returns a result. The
    result happens to be boolean.)


    # Using streams and lambda expressions


    Java has fancy methods that make optimal use of streams and lambda expressions.
    With streams and lambda expressions, you can create an assembly line that elegantly
    solves this chapter''s sales problem. Unlike the code in Listing 12-4, the new
    assembly-line solution uses concepts from functional programming.


    The assembly line consists of several methods. Each method takes the data, transforms
    the data in some way or other, and hands its results to the next method in line.
    Figure 12-9 illustrates the assembly line for this chapter''s problem.


    In Figure 12-9, each box represents a bunch of raw materials as they''re along
    an assembly line. Each arrow represents a method (or, metaphorically, a worker
    on the assembly line).'
