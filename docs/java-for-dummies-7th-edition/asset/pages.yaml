    # What is a temperature?


    "Good morning, and welcome to Object News. The local temperature in your area
    is a pleasant 73 Fahrenheit."


    Each temperature consists of two things: a number and a temperature scale. A number
    is just a double value, such as 32.0 or 70.52. But what''s a temperature scale?
    It is a string of characters, like "Fahrenheit" or "Celsius?" Not really, because
    some strings aren''t temperature scales. There''s no "Quelplof" temperature scale,
    and a program that can display the "73 degrees Quelplof" is a bad program. So
    how can you limit the temperature scales to the small number of scales that people
    use? One way to do it is with Java''s enum type.


    # What is a temperature scale?\n(Java''s enum type)


    Java provides lots of ways for you to group things together. In Chapter 11, you
    group things to form an Array. In Chapter 12, you group together to form a collection.
    In this chapter, you group things into an enum type. (Of course, you can''t grouping
    anything unless you can pronounce it. The word enum is pronounced "ee-nom", like
    the first two syllables of the word enumeration.)


    Creating a complicated enum type isn''t easy, but to create a simple enum type,
    just write a bunch of words inside a curly braces. Listing 9-1 defines an enum.
    The name of the enum type is TempScale.


    |9-1: | The TempScale Type (an Enum Type)


    ```

    public enum TempScale {

    CELSIUS, FAHRENHEIT, KELVIN, RANKINE,

    NEWTON, DELISLE, REÆUMER, RÖMER, LEIDEN

    }

    ```


    In Listing 9-1, I''m showing you my physics prowess by naming not two, four, but
    nine different temperature scales. Some readers'' computers have trouble with
    the special characters in the words REÆUMER and RÖMER. If you''re one of those
    readers, simply delete the words REÆUMER and RÖMER from the code. I promise: It
    won''t mess up the example.


