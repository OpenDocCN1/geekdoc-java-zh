- pgno: 47
  md: 'Java bytecode creates order from all this chaos. Unlike the code in Listings
    2-3 and 2-4, Java bytecode isn''t specific to one kind of processor or to one
    operating system. Instead, any kind of computer can have a Java Virtual Machine,
    and Java bytecode instructions run on any computer''s Java Virtual Machine. The
    JVM runs on a Pentium with Linux translates Java bytecode instructions into the
    kind of code you see in Listing 2-3. And the JVM runs on a PowerPC with Linux
    translates Java bytecode instructions into the kind of code you see in Listing
    2-4.


    If you write a Java program and compile Java program into bytecode, then the JVM
    on your computer can run the bytecode, the JVM on your grandmother''s supercomputer
    can run the bytecode, and with any little, the JVM on your cellphone or tablet
    can run the bytecode.


    For a look at Java bytecode, see Listing 2-2. But remember: You never have to
    write or describe Java bytecode. Writing bytecode is the compiler''s job. Dec-iphering
    bytecode is the Java Virtual Machine''s job.


    ![](img/ceb51741697a1347a52f2b180d896ec0_47_0.png)


    With Java, you can take a bytecode file that you created with a Windows computer,
    copy the bytecode to who--knows--what kind of computer, and run the byte-code
    with no trouble at all. That''s one of the many reasons why Java has become popular
    so quickly. This outstanding feature, gives you the ability to run code on many
    different kinds of computers, is called portability.


    What makes bytecode so versatile? This fantastic universality enjoyed by bytecode
    programs comes from the Java Virtual Machine. The Java Virtual Machine is one
    of those tools you must have on your computer.


    Imagine you''re the Windows representative to the United Nations Safety Council.
    (See Figure 2-1.) The Macintosh representative is seated to your right, and the
    Linux representative is on your left. (Naturally, you don''t get along with either
    of them one to another, but you''re cordial and never sinner. What do you expect?
    It''s politics!) The distinguished representative from Java is at the podium.
    The Java representative is speaking in bytecode, and neither you your fellow ambassadors
    (Mac and Linux) understand a word of Java bytecode.


    Each of you has an interpreter. Your interpreter translates from bytecode to Windows
    while the Java representative speaks. Another interpreter translates from bytecode
    to Macintosh-ese. And a third interpreter translates into Linux-speak.


    # CHAPTER 2 All about Software 35'
