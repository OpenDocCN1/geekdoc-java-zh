    # Chapter 17


    # Using Java Database Connectivity


    Whenever I teach Java to professional programmers, I always hear the same thing:
    “We don''t need to make attractive-looking layouts. No glitzy GUIs for us. We
    need to access databases. Yup, just [shut up and] show us how to write Java programs
    that talk to databases.


    So here it is, folks — the real deal!


    The Java Database Connectivity* (JDBC) classes provide common access to any database
    management systems. Just get a driver for your favorite vendor''s system, customize
    one line of code in each of this chapter''s examples, and you''re ready to go.


    > *Apparently, there''s no evidence in any of Oracle''s literature that the acronym
    JDBC actually stands for Java Database Connectivity. But that''s okay. If Java
    Database Connectivity isn''t the correct terminology, it''s close enough. In the
    Java world, JDBC certainly doesn''t stand for Jung Digests Bleu Cheese.


    CHAPTER 17 Using Java Database Connectivity 445'
