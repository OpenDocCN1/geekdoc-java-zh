    plans.

    - Step through the list of planets that have been discovered. For each M-class
    planet, find the probability of finding intelligent life on that planet. Then
    find the average of all such probabilities.


    This scenario is so common that it''s worth finding better and better ways to
    deal with the scenario. One way to deal with it is to use some of the functional
    features in Java.


    # Streams


    The earlier section "Using an iterator" introduces iterators. You use an iterator''s
    next method to spit out a collection''s values. Java takes this concept further
    with the notion of a stream. A stream is like an iterator except, with a stream,
    you don''t have to call a next method. After created, a stream spits out a collection''s
    values automatically. To get values from a stream, you don''t call a stream''s
    next method. In fact, a typical stream has no next method.


    How does this work as part of a Java program? How do you create a stream that
    spits out values? How does the stream know to start spitting, and does the stream
    aim when it spits? For answers to these and other questions, read the next several
    sections.'
