    in Figure 10-1, the display has rows (one for each player) and two columns (one
    for name and another for age). The horizontal gap between the two columns is 20
    pixels wide, and the vertical gap between two rows is 3 pixels tall.


    +   - pack: When you pack a frame, you set the frame’s size. That’s the size the
    frame has when it appears on your computer screen. Packing a frame shrinks the
    frame around whatever objects you’ve added inside the frame.


    In 10-2, by the time you’ve reached the call to pack, you’ve already called addPlayerInfo
    nine times and added 18 labels to the frame. In executing the pack method, the
    computer picks a size for each label, given text you’ve put inside the label.
    The computer picks a size for the whole frame, that the frame has these 18 labels
    inside.


    When you pop stuff onto frames, you have quite a bit of leeway with which you
    do. For instance, you can set the layout before or after you added labels and
    other stuff to the frame. If you call setLayout and then add labels, the labels
    appear in nice, orderly positions on the frame. If you reverse this order (add
    and then call setLayout), the calling of setLayout rearranges the labels in a
    nice, orderly fashion. It works either way.


