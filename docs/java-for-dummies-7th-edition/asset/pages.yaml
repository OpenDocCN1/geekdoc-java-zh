  md: '![](img/ceb51741697a1347a52f2b180d896ec0_307_0.png)


    FIGURE 11-1: An abstract snapshot of rooms in the Java Motel.


    Using an array saves you from the repetitive nonsense in the sample code shown
    at the beginning of this section. For instance, to declare an array with ten values
    in it, you can write one fairly short statement:


    ```

    ```guests[] = new int[10];```

    ```


    If you''re especially verbose, you can expand this statement so that it becomes
    two separate statements:


    ```

    ```guests[];

    guest = new int[10];```

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make the guests array have ten components. Each component
    of the array has a name of its own. The starting component is named guests[0],
    the next is guests[1], and so on. The last of the ten is named guests[9].


    > > REMEMBER In creating an array, you always specify the number of components.
    The array''s indices start with 0 and end with the number that''s one less than
    the total number of components.


    The snippets that I show you give two ways to create an array. The first way uses
    one line. The second uses two lines. If you take that single-line route, you can
    put that line inside or outside a method. The choice is yours. On the other hand,
    if you use two separate lines, the second line, guests = new int[10], should be
    inside a method.'
