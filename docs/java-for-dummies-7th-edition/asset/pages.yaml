  md: "# Listing 15-9: How to Be a Cat\n\n```\npublic class Cat extends HousePet {\n\
    \    boolean isOutdoor;\n\n    public Cat(String name, double weight, boolean\
    \ isOutdoor) {\n        super(name, weight, \"Meow\");\n        this.isOutdoor\
    \ = isOutdoor;\n    }\n\n    @Override\n    public void howToCareFor() {\n   \
    \     System.out.println(isOutdoor ? \"Let \" : \"Do not let \" + name + \" outdoors.\"\
    );\n    }\n}\n```\n\nBoth the Dog and Cat classes are subclasses of the HousePet\
    \ class, and because the abstract method declaration in Listing 15-7, both the\
    \ Dog and Cat classes must have howToCareFor methods. The howToCareFor methods\
    \ in the two classes are quite different. One method refers to a walksPerDay field;\
    \ the HousePet class's howToCareFor method is abstract, there's no default behavior.\
    \ Either the Dog and Cat classes must implement their howToCareFor methods or\
    \ the Dog and Cat classes can claim to extend HousePet.\n\n![](img/ceb51741697a1347a52f2b180d896ec0_433_0.png)\n\
    \nTECHNICAL STUFF\n\nThis paragraph describes a picky detail, and you should ignore\
    \ it if you have any inclination to do so: The Dog and Cat classes must implement\
    \ the howToCareFor method because the Dog and Cat classes are abstract. If the\
    \ Dog and Cat classes were abstract (that is, if they were abstract classes extending\
    \ the HousePet class), then they would not have to implement the howToCareFor\
    \ method. The Dog and Cat could pass the implementation but to their own subclasses.\
    \ For that matter, an abstract class that implements an interface doesn't have\
    \ to provide bodies for all the interfaces abstract methods. Abstract classes\
    \ can take advantage of many loopholes, however you to create some exotic programming\
    \ examples. In this chapter I simplify the story and write that (a) a class that\
    \ extends an abstract class must provide bodies for the abstract class's abstract\
    \ methods, and (b) a class that implements an interface must provide bodies for\
    \ the interface's abstract methods. It's not exactly true, but it's good enough\
    \ for now.\n\nIf you live in a very small apartment, you may not have room for\
    \ a dog or a cat. In that case, Listing 15-10 is for you."
