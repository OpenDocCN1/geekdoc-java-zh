  md: '> >> I make few assumptions about your computer programming experience (or
    your lack of such experience). In writing this book, I''ve tried to do the impossible:
    I''ve tried to make the book interesting for experienced programmers yet people
    with little or no programming experience. This means I don''t assume any particular
    programming background on your part. If you''ve never created a loop or indexed
    an array, that''s okay.


    On the other hand, if you''ve done these things (maybe in Visual Basic, Python,
    or C++), you''ll discover some interesting twists in Java. The developers of Java
    took the best ideas in object-oriented programming, streamlined them, reworked
    them, and reorganized them into a sleek, powerful way of thinking about problems.
    You''ll find many new, thought-provoking features in Java. As you find out about
    these features, many of them will seem quite natural to you. One way or another,
    you''ll feel good using Java.


    # How This Book Is Organized


    The book is divided into subsections, which are grouped into sections, which come
    together to make chapters, which are lumped finally into five parts. (When you
    write a book, you get to know your book''s structure well. After months of writing,
    you find yourself dreaming in sections and chapters when you go to bed at night.)
    The parts of the book are listed here.


    # Part 1: Getting Started with Java


    This part is your complete, executive briefing on Java. It includes “What is Java?”
    material and a jump-start chapter — Chapter 3. In Chapter 3, you visit the major
    technical ideas and dissect a simple program.


    # Part 2: Writing Your Own Java Program


    Chapters 4 through 6 cover the fundamentals. These chapters describe the things
    that you need to know so that you can get your computer humming along.


    If you''ve written programs in Visual Basic, C++, or any other language, some
    of the material in Part 2 may be familiar to you. If so, you can skip some sections
    or read this stuff quickly. But don''t read too quickly. Java is a little different
    from other programming languages, especially in the things that I describe in
    Chapter 4.'
