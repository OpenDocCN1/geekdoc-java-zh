  md: '# Defining a Class (What It Means

    to Be an Account)


    What distinguishes one bank account from another? If you ask a banker this question,
    you hear a long pitch. The banker describes interest rates, fees, penalties —
    the whole routine. Fortunately, I''m not interested in all that. Instead, I want
    to know how my account is different from your account. After all, my account is
    named Barry Burd, trading as Bud Brain Consulting, and your account is named Jane
    Q. Reader, trading as Budding Java Expert. My account has $24.02 in it.

    How about yours?


    When you come right down to it, the differences between one account and another
    can be summarized as values of variables. Maybe there''s a variable balance. For
    me, the value of balance is 24.02. For you, the value of balance is 55.63. The
    question is, when writing a computer program to accounts, how do I separate my
    balance variable from your balance variable?


    The answer is to create two separate objects. Let one balance live inside one
    of the objects and let the other balance live inside the other object. While you''re
    at it, put a name variable and an address variable in each of the objects. And
    you have it: two objects, and each object represents an account. More precisely,
    each object is an instance of the Account class. (See Figure 7-1).


    | An instance of the Account class | Another instance of the Account class |

    |---|---|---||

    | name | Barry | name | Jane |

    | address | 222 Cyberspace Lane | address | 111 Consumer Lane |

    | balance | 165.28 | balance | 1024.00 |


    FIGURE 7-1:

    Two objects.


    So, so good. However, you still haven''t solved the original problem. In your
    computer program, how do you refer to my balance variable, as opposed to your
    balance variable? Well, you have two objects sitting around, so maybe you have
    variables to refer to these two objects. Create one variable named myAccount and
    another named yourAccount. The myAccount refers to my object (my instance of the
    Account class) with all the stuff that''s inside it. To refer to my balance, write


    ```

    myAccount.balance

    ```


    PART 3 Working with the Big Picture: Object-Oriented Programming'
