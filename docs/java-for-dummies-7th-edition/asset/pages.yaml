  md: 'The correct way to say that you''re pasting String values together is to say
    that you''re concatenating String values.


    You can even use the sign to paste numbers next to String values:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    System.out.println("You have " + fruit + "pieces of fruit.");

    ```


    Of course, the old minus sign is available, too (but not for String values):


    ```

    apples = fruit - oranges;

    ```


    Use an asterisk (\*) for multiplication and a slash (/) for division:


    ```

    double rate, pay;

    int hours;


    rate = 6.25;

    hours = 35;

    pay = rate * hours;

    System.out.println(pay);

    ```


    For an example using division, refer to Listing 4-3.


    When you divide an int value by another int value, you get an int value. The computer
    doesn''t round. Instead, the computer chops off any remainder. If you put System.out.println(11
    / 4) in your program, the computer prints 2, not 2.75. To get this past, make
    either (or both) of the numbers you''re dividing double values. If you put System.out.println(11.0
    / 4) in your program, the computer prints 2.75.


    Another useful arithmetic operator is called the remainder operator. The symbol
    for the remainder operator is the percent sign (%). When you put System.out.println(11
    % 4) in your program, the computer prints 3. It does this because 4 goes into
    11 who-cares-how-many times with a remainder of 3. The remainder operator turns
    out to be fairly useful. Listing 4-7 has an example.'
