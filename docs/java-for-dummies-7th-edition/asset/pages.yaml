  md: "# LISTING 15-3: Implementing Two Interfaces\n\n```\npublic class ColumnOfNumbers\
    \ implements Displayable, Summarizable {\n    double numbers[];\n}\n```\n\n```\n\
    public ColumnOfNumbers(double[] numbers) {\n    this.numbers = numbers;\n}\n```\n\
    \n```\n@Override\npublic void display() {\n    for (double d : numbers) {\n  \
    \      System.out.println(d);\n    }\n}\n```\n\n```\n@Override\npublic String\
    \ summarize() {\n    double total = 0.0;\n    for (double d : numbers) {\n   \
    \     total += d;\n    }\n    return Double.toString(total);\n}\n```\n\n![](img/ceb51741697a1347a52f2b180d896ec0_425_0.png)\n\
    \nWhen you implement an interface, you provide bodies for the interface's abstract\
    \ methods.\n\nJava's compiler is serious about the use of the implements keyword.\
    \ If you remove either of the two method declarations from Listing 15-3 without\
    \ removing the implements clause, you see some frightening error messages in your\
    \ IDE's editor. Java expects you to honor the contract that the implements clause\
    \ implies. If you don't honor the contract, Java refuses to compile your code.\n\
    \n![](img/ceb51741697a1347a52f2b180d896ec0_425_1.png)\n\nYou can use Java's error\
    \ messages to your advantage. By typing some code containing the class implements\
    \ Displayable, Summarizable. Because of the implements clause, the editor displays\
    \ an error mark and lists the names of the methods that you should have declared\
    \ but didn't. In this section's example, those method names are display and summarize.\
    \ After a few more mouse clicks, the IDE generates simple display and summarize\
    \ methods for you.\n\nListing 15-4 contains another class that implements the\
    \ Displayable and Summarizable interfaces."
