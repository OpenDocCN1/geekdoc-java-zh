    \ jobId) {\n        jobTitle = jobId;\n    }\n\n    public String getJobTitle()\
    \ {\n        return jobId;\n    }\n\n    public void cutCheck(double amountPaid)\
    \ {\n        out.printf(\"Pay to the order of %s ***%s\\n\", name, jobId);\n \
    \       out.printf(\"%.2fn\\n\", amountPaid);\n    }\n}\n```\n\nAccording to Listing\
    \ 8–1, each employee has seven features. Two of these are fairly simple: Each\
    \ employee has a name and a job title. (In Listing 8-1, the Employee class has\
    \ a name field and a jobId field.)\n\nAnd what else does an employee have? Each\
    \ employee has four methods to handle the values of the employee's name and job\
    \ title. These methods are setName, getName, setJobTitle, and getJobTitle. I explain\
    \ methods like (accessor methods) in Chapter 7."
