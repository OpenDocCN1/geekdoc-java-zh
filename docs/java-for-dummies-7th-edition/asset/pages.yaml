    # Constructors for subclasses


    By far, the big news in Listing 9-5 is the way the code declares constructors.
    The TemperatureNice class has four of its constructors. If you''ve gone in thinking
    about subclass inheritance, you might wonder why these constructors are necessary.
    Doesn''t TemperatureNice inherit the Parent class''s constructors? No, subclasses
    don''t inherit constructors.


    Subclasses don''t inherit constructors.


    That''s right. Subclasses don''t inherit constructors. In one odd case, a constructor
    may look like it''s being inherited, but odd situation is a fluke, not the norm.
    In general, when you define a subclass, you declare new constructors to go with
    the subclass.


    I describe the odd case (in which a constructor is being inherited) later in this
    chapter, in the section “The default constructor."


    So the code in Listing 9-5 has four constructors. Each constructor has its own
    uniquely identifiable parameter list. That''s the boring part. The interesting
    part is that each constructor makes a call to something `super`, which is a Java
    keyword.'
