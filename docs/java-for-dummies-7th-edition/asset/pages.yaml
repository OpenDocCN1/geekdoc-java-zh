    # Importing everything in one fell swoop


    The first line of Listing 5-3 illustrates a lazy way of importing System.out and
    System.in. To import everything System has to offer, you use the asterisk character
    (*). In fact, importing java.lang.System.* is like having about 30 separate import
    declarations, including System.in, System.out, System.err, System.nanoTime, and
    many other System things.


    The use of an asterisk in an import declaration is generally considered good practice,
    so I don''t do it often in this book''s examples. For larger programs — programs
    that use dozens of names from the Java API — the lazy asterisk is handy.


    You can''t use an asterisk anywhere you inside an import declaration. For example,
    you can''t import everything starting with java by writing import java. You can
    substitute an asterisk only for the name or for the class of something static
    that''s tucked away inside a class. For more information about asterisks in import
    declarations, see Chapter 9. For information about static things, see Chapter
    10.


    ![](img/ceb51741697a1347a52f2b180d896ec0_133_0.png)


    # Java’s logical operators


    Mr. Spock would be pleased: Java has all the operators that you need for mixing
    and matching logic. The operators are shown in Table 5-2.


    Table 5-2 Logical Operators

    | Operator Symbol | What It Means | Example |

    |---|---|-|

    | && | and | 5 < x && x < 10 |

    | || | or | x < 5 || 10 < x |

