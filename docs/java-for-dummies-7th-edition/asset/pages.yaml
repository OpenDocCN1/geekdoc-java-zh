    String. The other type (the one you can use to create GUIs) is called JFrame.


    ![](img/ceb51741697a1347a52f2b180d896ec0_100_0.png)


    A String is a bunch of characters. It''s like having several char values in a
    row. So, with the myTitle variable declared to be of type String, assigning "Blank
    Frame" to the myTitle variable makes sense in Listing 4-6. The String class is
    declared in the Java API.


    In a Java program, double quote marks surround the letters in a String literal.


    > A JFrame is a lot like a window. The only difference is that you call it JFrame
    instead of a window. To keep Listing 4-6 short and sweet, I decided not to put
    anything in my frame — no buttons, fields, nothing.


    Even with a completely empty frame, Listing 4-6 uses tricks that I don''t describe
    until later in this book. So don''t try reading and interpreting every word of
    Listing 4-6. The big thing is that from Listing 4-6 is that the program has two
    variable names: myTitle and myFrame. According to the declarations, myTitle is
    of type String, and myFrame is of type JFrame.


    You can look up String and JFrame in Java''s API documentation, but before you
    do, I can tell you what you''ll find. You''ll find that String and JFrame are
    the names of Java classes. That''s the big news. Every class is the name of a
    reference type. You can reserve amountInAccount for double values by


    ```

    double amountInAccount;

    ```


    or by writing


    ```

    double amountInAccount = 50.22;

    ```'
