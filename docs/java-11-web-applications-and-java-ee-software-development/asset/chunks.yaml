    After the package is downloaded you must give execute right, after which the program
    is installed with the command (assuming that your current directory is where the
    package is downloaded):


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_2031.jpg)


    Then the rest goes by itself (Fedora 23). However, you must specify where your
    Java is installed (see below). Once the installation is complete, both `NetBeans`
    and `Glassfish` are installed.


