  trans: '

    然而，最重要的是表单元素，其 `action` 属性表明表单应该发送到 `PersonServlet`，这是处理表单的 Java 对象，最后表单元素指明在提交之前必须执行
    JavaScript 函数 `encryptPassword()`。用户的密码必须以加密的形式存储在数据库中，我之前在（Java 7）一书中展示过如何做这一点。Java
    有相应的类来处理它，它可以确定密码的消息摘要并将其存储在数据库中。然而，这产生了一个问题，因为它只能发生在服务器端，因此密码必须以明文发送到服务器，导致他人可以拦截。因此，加密必须在客户端完成，而我目前只有
    JavaScript 可用。消息摘要是通过复杂的算法确定的，有几种算法可以使用，它们在强度以及因此破解的难度上有所不同。该算法在互联网上有详尽的描述，你可以轻松地找到用
    JavaScript 实现的示例。`scripts.js` 文件实现了这样一种算法（SHA-1 算法）。它不是最强大的算法，但对于许多实际用途来说足够强大了。我不想在这里回顾该算法或展示代码，但简之，其思想是修改文本使其无法被识别，并且你无法从该消息摘要中还原密码。然而，存在一个问题，因为它发生在客户端，所以每个人都能看到发生了什么，因此人们讨论了使用脚本代码加密密码是否安全，因为这种代码并不是无懈可击的，对于本示例而言，它足够了。如果加密应该是安全的，人们通常会要求比本示例不同的方法（另一种实现方式）。


    ### PersonBean

    在查看 `PersonServlet` 之前，我将先查看 `PersonBean` 类，这是一个定义人的 Java Bean。该类非常详尽，我只展示了代码的一部分：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_98.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_99.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_100.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_101.jpg)


    观察该类的变量，很清楚它反映了数据库中的某行，因此可以代表一个人。然而，该类进一步定义了几个变量，如 `city` 和 `error`。在这里，最后一个应该用于编辑人员数据时的错误信息。与数据库的定义类似，以下字段必须经过验证：


    *   `useris`

    *   `firstname`

    *   `lastname`

    *   `code`

    *   `email`


    这些变量的 `set` 方法在出错时会抛出异常。例如，`setFirstname()` 方法确保名字有值。`email` 变量通过 `Tools` 类中的
    `isMail()` 方法进行验证，该方法在类中可以找到。这就是我之前展示过的相同方法。最后是 `code` 变量，由于数据库中对应的列是外键，`setCode()`
    方法必须测试是否存在该邮政编码。为了让该方法不需要总是连接数据库并执行 `SELECT`，邮政编码一次性加载到一个 `ArrayList<Zipcode>`
    中。在这里，`Zipcode` 是一个简单的类，通过两个字段表示邮政编码。读取邮政编码是在静态构造函数中进行的，原则上不需要任何特殊解释。然而，它需要数据库连接，而
    `DB` 类有一个可以创建此数据库连接的方法。我将稍后再描述这个类，但它会在多个地方被使用。一旦列表 初始化，`setCode()` 方法就可以很容易验证邮政编码是否合法。如果有必要，它还会初始化变量
    `city`。


    ### PersonServlet

    然后是 PersonServlet，即 JSP 页面 `login.jsp` 在点击提交按钮时将表单提交到的那个 servlet：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_102.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_103.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_104.jpg)


    我只展示了解释发生了什么的代码部分，主要是 `processRequest()`。首先注意这一行：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1041.jpg)

    ```

    有必要确保在提交表单时正确处理丹麦语字母。也许在这个示例中这并不重要，但在与下一个表单结合时很重要。发生的第一件事是添加对 bean 对象的引用：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1042.jpg)

    ```

    注意该对象是存在的，因为它被定义为会话范围（session scope）。接下来，确定员工编号和密码（现在已加密）的值，并测试密码是否已提交。如果没有提交，则附加一个错误消息。由于该对象被定义为会话范围，它仍然存在。如果提交了密码，则会验证是否存在了邮政编码。为了让该方法不需要总是连接数据库并执行
    `SELECT`，调用 `loadPerson()` 方法从数据库读取相应人员。如果可能，`PersonBean` 使用所有数据进行初始化，否则返回 `login.jsp`
    并带有错误消息。相反，如果员工编号为空，`PersonBean` 使用输入的密码初始化。如果密码和员工编号可以访问，则 `PersonBean` 被保存为会话对象，同时移除
    `loginBean` 对象。有必要在下次打开登录页面时确保该项不存在。最后，跳转到 `edit.jsp` 页面，那里可以编辑 `PersonBean` 对象。


    作为 `login.jsp` 的最后一个注释有一个取消链接。如果你点击该链接，你需要返回首页，但不是直接返回，而是调用 `StartServlet`。它的
    `processRequest()` 如下：


    ```

    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_106.jpg)

    ```

    目标是结束会话，以便 `loginBean` 对象（如果有其他会话对象）不再存在。


    ### edit.jsp

    然后是 edit.jsp，新员工打开下面的页面。该页面基本上是一个表单，原则上与 `login.jsp` 无异。它填充了很多，我只展示了 HTML 代码的一部分：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1061.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_107.jpg)![](img/Image34094.jpg)


    与 `login.jsp` 相比，没有新需要解释的内容，原则上工作原理相同。你应该注意这里有一个 `personBean` 对象的引用，并且在提交表单时，向名为
    `StoreServlet` 的 servlet 发起请求。它的 `processRequest()` 如下：


    ```

    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_108.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_109.jpg)

    ```

    '
- fmt: "\n# Session Initialization and Database Operations\n\nIt starts by initializing\
    \ the session object with the form data. Several of the `set` methods can raise\
    \ an exception if the value is illegal and if it happens, the server performs\
    \ a forward back to `edit.jsp` with an error message. Initializing the object\
    \ correctly, the `date` field is used to know whether it is an update or to add\
    \ a new row to the database. \n\nThisheaps happens by using two methods that I\
    \ have not shown here, but the difference is that one executes a SQL INSERT, while\
    \ the other performs a SQL UPDATE. If these methods are not performed properly,\
    \ they raise an exception, which is sent back to `edit.jsp` as an error message.\
    \ If, on the other hand, the database is updated correctly, you are in case of\
    \ an update send back to the home page, but if it is a new employee, you will\
    \ be sent to a page `employee.jsp`, which shows which employee number you are\
    \ assigned.\n\nIf you click on the center link on the start page, you will get\
    \ an overview of all employees in the database. The result could, for example\
    \ be, as shown below, where two employees have been created:\n\n![](image/Image34101.jpg)\n\
    \nThe table’s look and feel is determined by the style sheet, where the last three\
    \ classes are used to style the table. The JSP page content are as follows:\n\n\
    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_110.jpg)\n\nThe page\
    \ uses a Java bean called `PersonsBean`. I do not want to display the code here,\
    \ but it creates a `List<PersonBean>`, which is initialized with all employees\
    \ in the database. The most important thing here is to note how this list is used\
    \ to dynamically create the table with a row for each employee. Here you should\
    \ especially note the syntax for how to insert a loop with the element `c:forEach`\
    \ on a JSP page.\n\nThere is yet another link on the start page where a member\
    \ has the opportunity to change his password. I do not want to show this here\
    \ as it does not add anything new. It is a form where the user must enter his\
    \ employee number, password and new passwords, and the page uses a servlet to\
    \ validate this data and possibly updates the database.\n\nThis web application\
    \ is simple and are in more places simplified to a practical application, and\
    \ of course, there could be more features such as search on employees, but it\
    \ is a typical web application where users can edit data, which is stored in a\
    \ database. In practice, many web applications are database applications, for\
    \ example, thinking of a classic shopping cart.\n\n# Configuration and Database\
    \ Connection\n\nHowever, before I completely leave the application there is a\
    \ single standout. As mentioned, I uses a class `DB` to create a connection to\
    \ the database. It requires at least a database user in the form of username and\
    \ password. This information is often saved in a configuration file and I have\
    \ used `web.xml`:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_112.jpg)\n\
    \nIt is generally considered to be a safe place as it is not sent to the client,\
    \ and since the web container does not allow access to the file from the outside.\
    \ However, this means that a Java class should be able to retrieve these parameters,\
    \ and it can be done with a listener class that retrieves information when the\
    \ application starts. \n\nNote that `web.xml` defines this listener as the `ParamsFactory`\
    \ class, and the server will instantiate an object of this class that creates\
    \ a `Properties` object with the context parameters as the key / value pair. This\
    \ item is represented by the class\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1121.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_113.jpg)\n\
    \nthere only have static members. The `Properties` object is created in `ParamsFactory`\
    \ (listening Object):\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1131.jpg)\n\
    \nThis method is automatically performed by the Glassfish server, and the following\
    \ class can therefore connect to the database:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_114.jpg)\n\
    \n## Exercise 4\n\nStart by creating a copy of the web application `ChangeAddress2`.\
    \ You must expand the application to add a `Delete` button to the edit page:\n\
    \n![](image/Image34109.jpg)\n\nThe button should only be there if you edit an\
    \ existing employee. When you click the button, the employee must be deleted from\
    \ the database. The easiest thing is to let the button post to a new servlet,\
    \ which then deletes the employee.\n\n# 6 JSF\n\nThe whole idea behind JSP is\
    \ to separate the presentation part from the application’s business logic so that\
    \ the individual pages of a web application are written as JSP pages, which then\
    \ perform their data processing by sending requests to servlets, and as mentioned,\
    \ the JSP page itself is translated into a servlet. \n\nThe data to be manipulated\
    \ by the JSP page is represented by a Java bean, which is a Java class whose properties\
    \ can immediately be linked to the JSP page’s fields. With this model you are\
    \ able to develop effective dynamic websites. \n\nThe technology has since been\
    \ refined, and today wee talk about JSF, that stands for `Java Server Faces`,\
    \ and the goal has been to make it easier to develop modern web applications and\
    \ make it easier to use many new web technologies. A JSF page replaces the JSP\
    \ pages, and a JSF page is linked to a special servlet, which is called a `FacesServlet`.\
    \ \n\nA JSF page replaces the JSP pages, and a JSF page is linked to... I will\
    \ start by showing how a web application with JSF can be written using NetBeans.\
    \ The application is basically the same as previously shown, where the user must\
    \ enter two numbers, after which the program can perform calculation:\n\n![](image/Image34116.jpg)\n\
    \nThe calculation is one of the four types, and there are two buttons, one clear\
    \ the fields (the two input fields and the result), while the other performs calculation.\
    \ The project is called `CalculationPage` and is created in NetBeans as other\
    \ web applications, but in the `Server Settings` window, I click `Next` and then\
    \ I comes to the window for `Frameworks`. Here you must tick the `JavaServer Faces`\
    \ field (see below). The rest must remain as it and when you click `Finish`, a\
    \ JSF web application has been created that consists of a single file named `index.xhtml`:\n\
    \n![](image/Image34124.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_118.jpg)\n\
    \nAs you can see, it is an XML document with HTML syntax, and in fact it is a\
    \ complete web application that can be translated and opened in the browser. The\
    \ task is, of course, to modify this page so it displays a window as above.\n\n\
    Data to a JSP page is represented by a Java bean, and there will usually be a\
    \ Java bean to any JSP page. The same goes for JSF pages, but instead, you’re\
    \ talking about a named bean (exactly a CDI named bean) or a controller, but basically,\
    \ it’s nothing but a usual Java bean with two annotations in front of the class.\
    \ To associate such a named bean with the project, I have added a package `calculationpage.beans`\
    \ as previously. Then I have right-clicked and selected `JSF Managed Bean` (see\
    \ below). When I click OK, I get a window to create the desired class (see below).\
    \ The name is `CalulationController` and you should note that the above package\
    \ is selected. Also note the `Name` field, which is the name that the class is\
    \ known in the JSF page. By default, NetBeans choose the class name starting with\
    \ a lowercase letter, and there is seldom a reason to change it. Finally, note\
    \ the field `Scope` where I have the choice `session`. When you click OK, NetBeans\
    \ will create a named bean:\n\n![](image/Image34131.jpg)![](image/Image34139.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_121.jpg)\n"
