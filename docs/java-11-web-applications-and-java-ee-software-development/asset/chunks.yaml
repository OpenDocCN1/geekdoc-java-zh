    URL 发起请求。在第二情况下，服务器将直接将相同的请求发送到另一个 URL，包括来自 `form` 字段的所有键/值对属性。因此，`forward` 不涉及浏览器，且浏览器的地址栏不会改变，因为所有操作都发生在服务器端。我将分别向你展示如何执行重定向和转发。其起点是以下
