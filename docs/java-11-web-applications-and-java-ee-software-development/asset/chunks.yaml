    # 7 A last example


    The task is to write a web application for a veteran car club where the club members
    can presents their cars to the public. Thus, it is a typical web application that
    has two presentations:


    1. the public page, which is the actual website and can be used by all users

    2. an administration page that can only be used by the person (s) that has to
    administer the site (web masters), and this part of the application will usually
    require logon


    In this case there must be one or more web masters who can all and especially
    maintain information about club members. The club’s other members should also
    be able to use the administration part, but should only be able to maintain information
    about their own cars.


    With regard to the public side, everyone must have access to it, and the site
    should basically provide information about members’ cars and typically one or
    more pictures. In addition, the site must be attached to a guestbook, where everyone
    has the opportunity to attach a comment.


    ## 7.1 Analysis


    The public page is generally simple and consists of the following views, where
    the arrows show how to navigate the site:


    ![](image/Image34386.jpg)


    1. `index` is a home page or welcome page that gives a brief presentation of the
    site

    2. `cars` is a search page where the user has the opportunity to search among
    members cars

    3. `car` is a presentation page that shows details about a single car, including
    information about the car’s owner

    4. `guests` is the guest book where you get a table of contents sorted by date

    5. `guest` shows what a particular guest has written

    6. `edit` is a page where the user can write in the guestbook


    With regard to the administration part, it must include the following pages:


    ![](image/Image34394.jpg)


    1. `logon` is a logon page for webmasters and members

    2. `start` is the admin part’s home page

    3. `password` is used to change password

    4. `showcars` shows an overview of the individual members cars and for webmasters
    all cars

    5. `editcar` is used to edit information about a car, including to create a new
    car, and to delete an existing car

    6. `members` shows an overview of club members – the function can only be used
    by webmasters

    7. `member` used to edit information about a member including creating a new member
    as well as deleting an existing member – the feature can only be used by webmasters

    8. `delguest` used to delete pages in the guestbook if something has been written,
    that the club will not accept – the function can only be used by webmasters


    The webmaster can specifically maintain cars not owned by a member. If so, it
    should appear on the public page.


    ### Data dictionary


    Members:


    * number (which is a unique 5 digit integer)

    * name

    * address

    * zip code

    * mail (that is used as user name)

    * phone

    * password

    * description

    * user role (0 = default web master, 1 = web master, 2 = member)


    Default web master is a standard web master (a superuser) created when the database
    is created and can not be deleted. Other webmasters are, in principle, just a
    common member, but with administrator rights.


    Description is intended as a possibility that a member can give a presentation
    of himself or his cars.


    The guestbook:


    * name

    * zip code

    * mail

    * date (when it is written in the guestbook)

    * text


    Cars:


    * country code (where the car is produced)

    * producer (for example Opel, Ford, …)

    * name

    * model designation

    * variant designation within the model

    * motor (for example V8)

    * effect (motor effect in HK and possible unit)

    * production year

    * owner (member)

    * description

    * picture (one or more pictures)


    ## 7.2 Design


    The `index.xhtml` page shows the following view, which is a simple welcome page.
    At the bottom there is a link to the public page and thus to `cars.xhtml`, while
    in the upper right corner there is a link to the administration part and thus
    a link to `login.xhtml`:


    ![](image/Image34401.jpg)


    The application’s data must be stored in a database, except for images uploaded
    to a directory on the server. The database should primarily have three tables:


    1. to members

    2. to cars

    3. to the guestbook


    and the complete database design is shown in the following script:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_188.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_188.jpg)


    The table image contains names of images (relative to the image directory). The
    reason for this table is more images may be attached to the same car. Similarly,
    there is a table of brands that contain a list of car brands. The reason for this
    table is partly that many cars have the same manufacturer, and that the car brand
    is to be used when searching cars.


    The overall design is as follows:


    ![](image/Image3409.jpg)


    where the directorate `admin` must contain all FaceLets regarding the administration
    part.


    A particular issue is security and how to ensure that unauthorized persons can
    not change the content of the site’s database. In this case, security must be
    given a low priority. Partly because the content of the page does not require
    special protection and one can not expect anyone to use energy to attack the page,
    and partly because (and primarily) that I have not yet addressed how security
    issues are addressed. To access the administration section, a member (car owner)
    must enter his membership number and password. It must be the responsibility of
    the member to create an appropriate password and it is stored encrypted in the
    database. In addition to not claiming the strength of the password and that it
    is the member’s responsibility to create a password, the biggest weakness is that
    the password is sent in clear text (unencrypted) from client to server, and can
    thus be captured by an attacker.


    ## 7.3 Programming


    The finished site consists of 15 facelets and additionally controllers (named
    beans), model classes and other auxiliary classes. There is no full match between
    the 15 facelets and the above navigation charts (the diagrams show only 14 views),
    and typically changes will be made during the programming as to what views the
    completed solution will contain. Nevertheless, I find it helpful to use the time
    to draw up the charts, even if the final result differs, and the more careful
    you are in the analysis, the greater the chance that programming means only minor
    adjustments.


    Compared to many practical web applications, the current application is small
    and I will generally not display the code for either facelets or Java classes,
    but I will explain how the application is developed. However, you are encouraged
    to study the code, and as compared to what is otherwise dealt with regarding web
    applications in this book, many details are solved.


    ### The administration part


    I will start with the management part what is typical for developing web applications
    of this type. The public page can only be developed after adding data to the database.


    To the model layer is added the following classes:


    * Brand


    * Car


    * Photo


    * Owner


    * Guest

