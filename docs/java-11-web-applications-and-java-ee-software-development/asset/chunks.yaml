- fmt: '

    However, the most important thing is the form element, where its action indicates
    that the form should be sent to `PersonServlet`, which is the Java object to process
    the form, and finally the form element states that before submitting, the JavaScript
    function `encryptPassword()` must be performed. The user’s password must be stored
    encrypted in the database, and I have previously shown (in the book Java 7) how
    to do it. Java has classes for it, which determines a message digest of the password
    and stores it in the database. However, it causes a problem as it can only happens
    on the server side, and the password must therefore be sent to the server in clear
    text, allowing others to intercept it. The encryption must therefore be done on
    the client side, and here I currently only have JavaScript available. A message
    digest is determined by means of a complex algorithm, and there are several that
    can be used and which differ in terms of their strength and thus how difficult
    they are to break. The algorithm is well described on the Internet, and you can
    easily find an example where it is implemented in JavaScript. The file `scripts.js`
    implements such an algorithm (SHA-1 algorithm). It is not the strongest algorithm,
    but for many practical purposes strong enough. I do not want to review the algorithm
    here or show the code but briefly the idea is to modify the text in such a way
    that it can not be recognized and that you can not regret and from that message
    digest determine the password. However, there is a problem as it happens on the
    client side, so everyone can see what’s happening and therefore it is discussed
    whether it’s safe to encrypt a password using script code, because such a code
    is not irreproachable, but in relation to this example, it must be sufficient.
    Should encryption be safe, one will usually require another approach (another
    implementation) than what this example shows.


    ### PersonBean

    Before I look at `PersonServlet`, I will look at the class `PersonBean`, which
    is a Java bean that defines a person. The class is extensive and I have only shown
    a part of the code:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_98.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_99.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_100.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_101.jpg)


    Looking at the class’s variables, it is clear that it reflects a row in the database
    and thus can represent a person. However, the class further defines a few variables
    as `city` and `error`. Here, the last one should be used for an error message
    when editing a person’s data. Similar to the database definition, the following
    fields must be validated:


    *   `useris`

    *   `firstname`

    *   `lastname`

    *   `code`

    *   `email`


    The `set` methods for these variables raise an exception in case of errors. For
    example the method `setFirstname()` that ensures that a first name has a value.
    The variable `email` is validated by a method `isMail()`, which is found in the
    class `Tools`. It’s the same method I’ve shown before. Then there is finally the
    variable `code`, and since the corresponding column in the database is a foreign
    key, the method `setCode()` must test if the zip code is found. In order, that
    the method does not always have to connect to the database and perform a `SELECT`,
    the zip codes are loaded once for all in an `ArrayList<Zipcode>`. Here `Zipcode`
    is a simple class that can represent a zip code by two fields. Reading the zip
    codes takes place in a static constructor, and in principle it does not require
    any special explanation. However, it requires a database connection and the class
    `DB` has a method that can create this connection to the database. I will wait
    to describe this class for later, but it will be used in several places. Once
    the arraylist is initialized, it is easy for the method `setCode()` to validate
    if a zip code is legal. If necessary, it also initializes the variable `city`.


    ### PersonServlet

    Then there is PersonServlet, that is the servlet that JSP page `login.jsp` posts
    the form to when clicking on the submit button:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_102.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_103.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_104.jpg)


    I have only shown that part of the code that explains what happens and it is primarily
    `processRequest()`. First note the line


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1041.jpg)

    ```

    It is necessary to ensure that Danish letters are processed correctly when the
    form is submitted. Perhaps it is not so important in this example, but in connection
    with the next form it is. The first thing that happens is to add a reference to
    the bean object:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1042.jpg)

    ```

    Note that the object exists as it is defined with session scope. Next, the value
    of the employee number and password (which is now encrypted) are determined and
    the method tests whether a password has been submitted. If not, an error message
    is attached to the bean, and the server performs a redirect back to `login.jsp`.
    Since the bean object still exists, the page will display the error message. Has
    a password been entered a `PersonBean` object is created. If an employee number
    has been entered (the length is positive) is validated first, if not, an error
    message is returned. Otherwise, the method `loadPerson()` is called to try to
    read a person from the database with the appropriate employee number and password.
    Is it possible, `PersonBean` initializes the object with the entire data, but
    otherwise, returns to `login.jsp` with an error message. If, on the other hand,
    the employee number is blank, `PersonBean` initializes the object with the entered
    password.


    If password and employee number can be accessed, then `PersonBean` is saved as
    a session object, while at the same time removing the session object `loginBean`.
    It is necessary to ensure that the item does not live next time the login page
    opens. Finally, a forward is made to the page `edit.jsp`, where the `PersonBean`
    object can be edited.


    As a last comment to `login.jsp` there is a link to cancel. If you click on that
    link, you have to get back to the home page, but instead of doing it directly,
    a servlet `StartServlet` is called. Its `processRequest()` is the following:


    ```

    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_106.jpg)

    ```

    The goal is to end the session so that the object `loginBean` (and, if any, other
    session objects) no longer lives.


    ### edit.jsp

    Then there is edit.jsp, in the event of a new employee opens the page below. The
    page is basically a form and is in principle no different than `login.jsp`. It
    fills a lot, and I’ve only shown a part of the HTML code:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1061.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_107.jpg)![](image/Image34094.jpg)


    Compared to `login.jsp` there is nothing new to explain and it works in principle
    in the same way. You should note that there is a reference to the object `personBean`,
    and that when submitting the form, a request is made to a servlet named `StoreServlet`.
    It’s `processRequest()` is the following:


    ```

    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_108.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_109.jpg)

    ```

