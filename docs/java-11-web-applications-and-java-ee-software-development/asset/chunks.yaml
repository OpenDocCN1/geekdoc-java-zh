    一个需要解决的应用程序相关问题是图像（文件）必须保存在何处。显然，应用程序必须知道存储位置，并且服务器上必须有一个可写入的目录。在这个示例中，在我的主目录下了选择了一个目录，但在实践中，显然需要另一种解决方案。例如，你可以学习最后一个示例中是如何解决这个问题的。


    该类有一个名为 `file` 的变量，在这里你应该特别注意它的类型：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_183.jpg)


    除此之外，除了 `save()` 方法外没有没什么需要注意的，该方法会在选定的目录中为上传的文件创建一个副本。


    # 7 最后一个示例


    任务是为一个老兵车俱乐部编写一个 Web 应用程序，俱乐部成员可以在那里向公众展示他们的汽车。因此，这是一个具有两个展示部分的典型 Web 应用程序：


    1. 公共页面，即实际网站，可以供所有用户使用

    2. 管理页面，只能由负责管理网站的人员（网站管理员）使用，应用程序的这部分通常需要登录


    在这种情况下，必须有一位或多个网站管理员，他们能够（特别是）维护有关俱乐部成员的信息。俱乐部的其他成员也应该能够使用管理部分，但只能维护有关他们自己汽车的信息。


    关于公共端，每个人都必须能够访问，并且网站基本上应该提供有关成员汽车的信息，通常还有一张或多张图片。此外，网站必须附带一个留言板，每个人都有机会发表评论。


    ## 7.1 分析


    公共页面通常很简单，由以下视图组成，箭头显示了如何在网站中导航：


    ![](img/Image34386.jpg)


    1. `index` 是首页或欢迎页，对网站进行简要介绍

    2. `cars` 是搜索页面，用户可以在此在成员的汽车中进行搜索

    3. `car` 是展示页面，显示单辆汽车的详细信息，包括车主的信息

    4. `guests` 是留言板，你可以在那里看到一个按日期排序的目录

    5. `guest` 显示特定访客写了什么

    6. `edit` 是用户可以在留言板中书写内容的页面


    关于管理部分，它必须包含以下页面：


    ![](img/Image34394.jpg)


    1. `logon` 是给网站管理员和成员使用的登录页

    2. `start` 是管理部分的首页

    3. `password` 用于更改密码

    4. `showcars` 显示各个成员汽车的概览，对于网站管理员则显示所有汽车

    5. `editcar` 用于编辑汽车信息，包括创建新汽车和删除已有的汽车

    6. `members` 显示俱乐部成员的概览 – 该功能只能由管理员使用

    7. `member` 用于编辑成员信息，包括创建新成员以及删除已有的成员 – 该功能只能由管理员使用

    8. `delguest` 用于删除留言板中的某些页面，如果有人写了俱乐部不接受的内容 – 该功能只能由管理员使用


    网站管理员可以专门维护不属于任何成员的汽车。如果是这样，它应该出现在公共页面上。


    ### 数据字典


    成员：


    * number（一个唯一的 5 位整数）

    * name（名称）

    * address（地址）

    * zip code（邮政编码）

    * mail（用作用户名）

    * phone（电话）

    * password（密码）

    * description（描述）

    * user role（用户角色：0 = 默认管理员，1 = 网站管理员，2 = 成员）


    默认管理员是在创建数据库时创建的标准管理员（超级用户），无法被删除。其他管理员原则上只是普通成员，但拥有管理员权限。


    description（描述）旨在作为成员提供其介绍或其汽车介绍。


    留言板：


    * name（名称）

    * zip code（邮政编码）

    * mail（邮箱）

    * date（写在留言板的时间）

    * text（文本）


    汽车：


    * country code（产地）

    * producer（厂家，例如欧宝、福特……）

    * name（名称）

    * model designation（型号标识）

    * variant designation（型号内的变体标识）

    * motor（发动机，例如 V8）

    * effect（HK/马力中的发动机功率及可能的单位）

    * production year（生产年份）

    * owner（车主，成员）

    * description（描述）

    * picture（一张或多张图片）


    ## 7.2 设计


    `index.xhtml` 页面显示以下视图，这是一个简单的欢迎页。底部有一个指向公共页面（即 `cars.xhtml`）的链接，而在右上角有一个指向管理部分的链接（即指向
    `login.xhtml` 的链接）：


    ![](img/Image34401.jpg)


    应用程序的数据必须存储在数据库中，上传到服务器目录的图像除外。数据库主要包含三个表：


    1. members（成员表）

    2. cars（汽车表）

    3. guestbook（留言板表）


    完整的数据库设计在如下所示：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_188.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_188.jpg)


    image 表包含图片的名称（相对于图像目录）。创建此表的原因是同一辆汽车可能对应多张图片。同样，还有一个品牌表。创建此表的原因是许多汽车拥有相同的制造商，并且在搜索汽车时需要使用品牌。


    整体设计如下：


    ![](img/Image3409.jpg)


    其中 `admin` 包含所有关于管理部分的 Facelets。


    一个特殊的问题是安全性，如何确保未经授权的人无法更改网站的内容。在这种情况下，安全性必须赋予较低的优先级。部分是因为页面内容不需要特殊保护，并且预计不会有人花费精力攻击该页面，部分是因为（主要是因为）我尚未处理安全性问题。要访问管理部分，成员（车主）必须输入其成员编号和密码。成员有责任创建合适的密码，密码在数据库中是加密存储的。除了不要求密码强度以及成员有责任创建密码之外，最大的漏洞是密码从客户端到服务器是明文（未加密）传输的，因此可能被攻击者拦截。


    ## 7.3 编程


    完成网站由 15 个 facelet 以及控制器（命名 Bean）、模型类和其他辅助类组成。15 个 facelet 与上述导航图并不完全对应（图表仅显示了
    14 个视图），通常在编程过程中会对完成方案包含的视图进行更改。尽管如此，我发现花时间绘制图表很有帮助，即使最终结果不同，而且分析得越仔细，编程时进行微调的可能性就越大。


    与许多实际 Web 应用程序相比，当前的应用程序很小，我通常不会显示 facelet 或 Java 类的代码，但我会解释如何开发该应用程序。然而，鼓励你研究代码，与书中其他讨论的
    Web 应用程序问题相比，许多细节得到了解决。


    ### 管理部分


    我将从开发此类 Web 应用程序典型的管理部分开始。在向数据库中添加数据之后，才能开发公共页面。


    模型层添加了以下类：


