    它模型了数据库的表。它们都是简单的模型类，可能类似于 `Car`，包含了对其他对象的引用：


    ![](img/Image34416.jpg)


    此外，还有一个 `Repository` 类，它是一个单例，并具有维护数据库的方法。该类相对复杂（全面），但与其他程序中的相应类相比，并没有任何新内容。数据库的参数（用户名和密码）存储在
    `web.xml` 中，包含上传图片的目录名称也是：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_192.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_193.jpg)


    对于图片，它们必须上传到具有写权限的目录。每当上传一张图片时，`image` 表中就会创建一行，并为该行分配一个自动编号。这个数字同时被用作图像文件名，例如，如果一张图片被数据库服务器分配了数字
    123，则该图片将以 `123.jpg` 的名称保存。因此决定程序仅支持 jpg 图片（照片）。


    所有关于管理的视图都位于 admin 文件夹中，几乎每一个视图都与一个控制器关联。当你从欢迎页选择管理时，你会看到 `logon.xhtml`，你必须在那里输入成员编号和密码。然后你将进入管理部分的欢迎页，称为
    `start.xhtml`。该页面顶部有一个功能菜单。根据需求规范，管理部分必须具备以下功能：


    1.  维护汽车品牌

    2.  维护汽车

    3.  维护所有者（成员）

    4.  维护留言板

    5.  修改密码


    第一个功能非常简单，只能由具有管理员权限的用户执行。它包含两个视图：


    1.  `brands.xhtml`，显示所有已创建汽车品牌的概览，你可以通过点击它来编辑汽车品牌

    2.  `brand.xhtml`，用于创建和维护汽车品牌


    下一个功能是最全面的，每个人都可以执行，但如果你没有被创建管理员权限，则只会显示你自己的汽车。该功能有三个视图：


    1.  `cars.xhtml`，显示按汽车品牌分组的所有汽车概览，所以如果你点击某个汽车品牌，就会获得该品牌的所有汽车；点击某辆汽车，就会获得所有的汽车详情，并且有一个链接让你可以编辑关于汽车的信息

    2.  `car.xhtml`，用于创建和维护汽车信息

    3.  `showcar.xhtml`，显示汽车的详情，包括任何图片


    当这个功能变得复杂时，部分是因为图片的上传，在其中应该能够编辑标题，并且 `showcar.xhtml` 能够显示图像（文件的内容）。最后一个问题通过一个
    servlet 解决。


    第三个功能让人想起第一个功能，由所有具有管理员权限的用户执行。该功能有两个视图：


    1.  `owners.xhtml`，显示所有所有者的概览

    2.  `owner.xhtml`，用于创建和编辑所有者（成员）信息


    在实现这些功能后，我编写了公共页面的代码。


    ### 公共部分


    从欢迎页你可以进入 `main.xhtml`，这是网站的中心页面。在这里，你可以通过左侧菜单点击汽车，菜单按汽车品牌对汽车分组。你还可以使用任何文本搜索汽车，搜索将搜索汽车品牌、名称、型号和文本。匹配的汽车将显示在下拉框中，你可以从中选择一辆汽车。


    顶部还有一个指向留言板的链接，它由两个视图组成：


    1.  `guests.xhtml`，允许搜索留言板，你可以按日期搜索或输入搜索文本以按名称和文本本身进行搜索

    2.  `guest.xhtm`，允许你在留言板中写入


    ### 管理部分的完成


    最后，我完成了管理部分。修改密码的功能非常简单，只包含一个带控制器的单个视图。最后一个功能也只有一个视图，并且实际上与 `guests.xhtml` 相同并使用相同的控制器。唯一的区别是可以删除留言板中的一个页面。


    ## 7.4 部署


    为了执行 Web 应用程序（在浏览器中打开），应用程序必须安装在 Glassfish 服务器上，这个过程被称为部署。目前，我忽略了所有关于它的，因为 NetBeans
    在本地运行的 Glassfish 服务器上非常自动地完成了这一点。现在我将作为一个示例展示如何在另一台机器上部署当前应用程序。前提是该机器上也运行着 Glassfish
    服务器以及运行着的数据库服务器。该过程需要两个文件：


    1.  `veteran.sql`，创建数据库的 SQL 脚本

    2.  `VeteranCars.war`，包含 Web 应用程序的 war 文件（在项目的 `dist` 目录中找到）


    第一步是创建数据库，简单来说就是运行上述脚本。接下来，必须为图片创建一个目录。注意，如果你需要数据数据库，可以从开发机备份数据库并创建它的恢复，同时记得从开发机复制图片。


    要进行部署，请在浏览器中打开管理程序：


    ![](img/Image3424.jpg)


    在这里你需要点击左侧的 `Applications`，然后点击 `Deploy` …… 然后你就可以浏览 war 文件（见下）。


    ![](img/Image3431.jpg)


    最后只需确保 `web.xml` 中数据库服务器和图片目录的参数是正确的。你可以点击应用程序名称并选择 `Descriptor` 选项卡来编辑文件（见下）。这里有一个
    `web.xml` 的链接，你可以在那里编辑文件。


    ![](img/Image3439.jpg)

