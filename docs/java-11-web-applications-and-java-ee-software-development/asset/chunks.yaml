    ## 3.2 Sessions


    When you request a web page from the browser and the server answers back with
    a response, it will be done as already mentioned in accordance with the HTTP protocol.
    This protocol is basically stateless, which means that after the server has replied
    back with the response, the server has “forgotten” all about the request, and
    next time a request for the same page is received, the server will perceive it
    as a new request. This model fits badly with modern web applications, and you
    can, among other things, solve the problem using the `session` concept.


    When a user opens the browser and sends a request to a new page, the server will
    investigate whether a `session ID` is included. It does not matter if it is a
    request for a new page entered in the browser’s address bar, and the server will
    then generate a `session ID` and send it with the response back to the client.
    If the client then performs a submit or, for example, clicks on a link that refers
    to a page in the same web application, the browser will send the session ID with,
    and the server will include it in its response. That way, the term called a `session`
    has been introduced that exists as long as the server refers to pages within the
    same web application.


    This can be used to define data that lives throughout the session. When the server
    creates a `session ID`, it also creates a session object and this object contains
    a collection for `Object` objects. The server can thus create and save objects
    in this collection, and these objects live as long as the session object lives,
    and therefore they can be used by all pages within that session. It is important
    to note that the objects are only known on the server side and are not sent to
    the client. The only one sent to the client is the `session ID`, which is sent
    back and forth for each request/response pair.


    The individual session objects live on the server until they are explicitly removed
    or until they are removed due to a timeout (for example, it may be 30 minutes).
    This means, on the other hand, that the server can have many session objects that
    are no longer used, thus using space, and partly that session objects (such as
    a shopping cart) may disappear if you stop working.


    To illustrate the use of sessions, I have created a web application called `Sessions`.
    For this application I will add three servlets. When adding a servlet to a web
    application, it should not be placed in the project’s default package (what has
    been done above in the first example). Typically, I create a package named `projectname.servlets`
    (in this case, `sessions.servlets`) and places my servlets there. In this case,
    I have also created a package called `sessions.data`, and I have added the following
    class that can represent a person with a name and a job title:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_40.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_41.jpg)


    You should note that it is a fairly common model class. As a next step, I have
    added the following servlet:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_411.jpg)


    The method `processRequest()` starts by determining the values of two form fields
    from the page that sent a request to this servlet. Is it possible, and they are
    both different from `null`, they are used to create a `Person` object. Next, a
    reference to the session object is added:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_42.jpg)


    This means that the object must be created if it does not exist. As the next step,
    the `Person` object is added to the session object’s collection with the key `person`.
    Finally, a response is returned, which includes the session object.


    The code for the start page is the following:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_421.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_43.jpg)


    If you run the application you get the following window:


    ![](image/Image3392.jpg)


    If you enter a name and job title here and click OK, you get the following results:


    ![](image/Image3329.jpg)


    It tells that the session object is updated, as well as what the session ID is.
    You should note that it is represented as a large hexadecimal number, which you
    generally can not use for anything, but in this case you can use it to see when
