    # 6 JSF


    JSP 背后的核心思想是将展示部分与应用程序的业务逻辑分离，这样 Web 应用的单个页面就可以写成 JSP 页面，这些页面通过向 servlet 发送请求来执行数据处理。正如提到的，JSP
    页面本身会被翻译成 servlet。


    JSP 页面要处理的数据由 Java Bean 表示，这是一个 Java 类，其属性可以立即链接到 JSP 页面的字段。通过这种模型，你能够开发高效的动态网站。


    该技术自此以后得到了完善，今天我们谈论 JSF，全称为 `Java Server Faces`，其目标是让开发现代 Web 应用变得更容易，并更容易使用许多新的
    Web 技术。JSF 页面取代了 JSP 页面，且 JSF 页面链接到一个特殊的 servlet，该 servlet 称为 `Faces`。


    JSF 页面取代了 JSP 页面，且 JSF 页面链接到……我将开始演示使用 NetBeans 编写 JSF 应用。应用程序与之前所示，用户必须输入两个数字，之后程序可以进行计算：


