- fmt: "\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_152.jpg)![](image/Image34233.jpg)\n\
    \nIf you then open the page again, the result is:\n\n![](image/Image34240.jpg)\n\
    \nand that is because the template now uses the two style sheets, and they can\
    \ subsequently be used by all views that use that template. I do not want to show\
    \ the two style sheets here, but you are encouraged to examine the contents of\
    \ the two files, and if you compare with the above window, you can easily interpret\
    \ the content.\n\nAs can be seen from the above, a template (in this case) divides\
    \ the view into four sections, which are defined by an element of the form:\n\n\
    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_153.jpg)\n\nThese items\
    \ can be modified to have a more meaningful content, but other views are supposed\
    \ to include code in one or more of the four areas.\n\nI will now add another\
    \ view to the application called `gallery.xhtml`, but it should be created as\
    \ a `Facelet Template Client`:\n\n![](image/Image34248.jpg)\n\nWhen you click\
    \ `Next`, you get the following window where you enter the name and select the\
    \ template to be used:\n\n![](image/Image34257.jpg)\n\nand furthermore, you can\
    \ select which sections in the template as this view are to insert code in. The\
    \ result is the following view:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_155.jpg)\n\
    \nYou should note that it is a JSF page and thus a view, but it uses the template\
    \ and inserts code in the top and the center. If you run the application, open\
    \ the start page (`index.xhtml`) and click on the link, opens the view `gallery.xhtml`,\
    \ which displays the same window as shown above.\n\nThe task now is to get something\
    \ more meaningful in the four areas. I will state with the template. First, I\
    \ have created a sub directory `images` under `resources` and for this I have\
    \ copied a picture called `thy.jpg`. Then here I changed `mainTemplate.xhtml`\
    \ to the following:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1551.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_156.jpg)\n\
    \nThat is, I have inserted code into three of the four areas. If you open the\
    \ application and click on the link on the home page, you get the following results\
    \ (which is `gallery.xhtml`):\n\n![](image/Image34271.jpg)\n\nIn the left area\
    \ there is a form that contains a menu with `commandLink` elements. The first\
    \ links back to the view itself, while the other links to a view that has not\
    \ yet been created. You should note the bottom and how to insert an image. Note,\
    \ in particular, how to style the image to fill the entire window. Finally, there\
    \ is the top that contains just `h1` element, but apparently this item is not\
    \ used. The reason is that the top is overridden by `gallery.xhtmp`, which inserts\
    \ a default content in the top section, thus overriding the result from the template.\n\
    \nNext task is to make the view `galley.xhtml` complete. The content must be a\
    \ list of links to images and you can see a picture by clicking a link. The view,\
    \ like other views, has a controller, but first I want to define a class that\
    \ can represent an image:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_157.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_158.jpg)\n\
    \nwhere the class is located in the package `paweb.models`. It’s a fairly simple\
    \ model class and a usual Java class. `Text` is the value to be displayed on the\
    \ screen, while `name` is the name of the picture (or something else) that the\
    \ class should represent. In practice, there would probably be more properties\
    \ attached to an image, and to illustrate it, I have defined following derived\
    \ class:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1581.jpg)\n\
    \nThen I have written a controller class to the gallery view:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1582.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_159.jpg)\n\
    \nIt is very simple controller with a single property, which is a list of `Photo`\
    \ objects. Then I have changed `gallery.xhtml` so it now inserts code in the center\
    \ area:\n\n![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1591.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_160.jpg)\n\
    \nThe content is a form with a `dateTable` element, and the table contains a number\
    \ of `commandLink` elements determined by the controller class. It is an example\
    \ of an action with a parameter, where the `param` is used.\n\nThe task is to\
    \ create a composite component. First, we create a folder named `search` under\
    \ `resources`. Inside, we create a file named `search.xhtml`. This file will define\
    \ the interface of our component:\n\n```xml\n<composite:component xmlns:cc=\"\
    http://xmlns.jcp.org/xml/jsf/composite\" \n                    xmlns:composite=\"\
    http://xmlns.jcp.org/xml/jsf/composite\" \n                    xmlns:h=\"http://xmlns.jcp.org/xml/jsf/core\"\
    >\n    <cc:interface>\n        <cc:attribute name=\"searchList\" type=\"java.util.List\"\
    \ />\n        <cc:attribute name=\"searchAction\" type=\"java.lang.String\" />\n\
    \        <cc:attribute name=\"search\" type=\"java.lang.String\" default=\"\"\
    \ />\n    </cc:interface>\n    \n    <h:form>\n        <h:inputText value=\"#{cc.attrs.search}\"\
    \ />\n        <h:commandButton value=\"Search\" action=\"#{cc.attrs.searchAction(cc.attrs.search)}\"\
    \ />\n    </h:form>\n\n    <h:dataTable value=\"#{cc.attrs.searchList}\">\n  \
    \      <h:column>\n            <h:outputText value=\"#{item.name}\" />\n     \
    \   </h:column>\n    </h:dataTable>\n</composite:component>\n```\n\nNext, we create\
    \ the implementation part in `search.xhtml` to handle the logic. However, for\
    \ this example, we focus on how the component is used in `gallery.xhtml`.\n\n\
    In `gallery.xhtml`, we include the component like this:\n\n```xml\n<my:search\
    \ searchList=\"#{galleryController.photos}\" \n           searchAction=\"#{galleryController.search}\"\
    \ \n           search=\"#{galleryController.searchQuery}\" />\n```\n"
