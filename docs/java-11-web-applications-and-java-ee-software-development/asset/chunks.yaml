    `value` 的字段值。`uiComponent` 是必须对其值进行验证的组件，该方法通过确定该组件的属性值（其 `ID` 或 `label`）开始执行。接下来，使用一个名为
    `isDate()` 的私有辅助方法对值进行测试。我没有显示代码，因为它包含的内容与我在其他书中展示的内容并无二。如果值无法被正确验证，将创建一个 `FacesMessage`
    对象并以该对象为参数抛出异常。结果是，错误消息显示在窗口中。


    有一个对应的 `Validator` 类，名为 `EmailValidator`。它在原则上与上述相同，我不想在这里展示代码。


    最后，应用程序中有一个命名的豆（named bean）。该类非常简单，主要由 `get` 和 `set` 方法组成，我只展示了几个示例：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_133.jpg)


    从 `index.xhtml` 来看，最重要的方法是 `add()`，它是点击 `Send` 按钮时执行的方法。它测试某人是否合法，如果是的话，该方法会将一个
    `Person` 对象添加到列表中，之后会创建一个新的 `Person` 对象。


    我选择该 bean 应该具有会话范围（session scope），有以下几种选项：


    1. `Request`：意味着该 bean 只存在于当前的 HTTP 请求。也就是说，必须为每个请求创建一个它。

    2. `Session`：意味着该 bean 对象存在于单个用户的 HTTP 会话中。

    3. `Conversation`：意味着该 bean 跨多个 HTTP 请求存在。

    4. `Application`：意味着同一个 bean 对跨多个用户会话的所有应用程序用户可用。

