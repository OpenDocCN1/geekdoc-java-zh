    ## 5.3 JSP documents


    When you create a jsp page in NetBeans you get the window as shown below, where
    for `Options` as default is selected `JSP File (Standard Syntax)`, and in most
    cases you will probably stick to it, but you can also select `JSP Document (XML
    Syntax)`. The result is a JSP page, which has the extension `jspx`, which resembles
    a standard JSP page, but where it is a requirement that the page is welformed
    XML. Since the above examples actually are already welformed, there will be no
    big difference besides being a requirement. Most importantly, however, a JSP document
    does not allow the use of scriptlets, thus forcing the programmer to place all
    Java code in Java beans and other classes, and that is the exact goal of this
    variation of JSP pages.


    ![](image/Image34060.jpg)


    As an example, I will show the first program in this chapter (the web application
    `DateServer`), where the `start.jsp` page is replaced by a page `start.jspx`.
    The program is called `DateTimeServer` and performs exactly the same as the application
    `DateServer`. It uses the same Java bean `DateBean`, and additionally, the following
    simple bean is added:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_83.jpg)


    Then, the jspx page can be written as follows:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_84.jpg)!(image/Java_11_-_Web_applications_and_Java_EE_6-11-17_85.jpg)


    As you can see, it’s mostly copy and paste from the previous example, but you
    should notice three things. First of all, it is about wellformed XML. Secondly,
    there are no scriplets, and if you try to use scriplets, you get an error. Third,
    there are several new elements `jsp:`, and some may appear in this example.


    As mentioned above, the aim of JSP documents is to force not to use scriptlets.
    It’s true that using scriplets leads to code that is harder to read and maintain,
    but generally I prefer standard JSP pages. First of all, with modern tools like
    NetBeans, it’s easy to make sure the code is well-formed, and secondly, you can
    minimize the use.


