- fmt: '

    If you send a request to a servlet, it can perform a data processing and then
    send the request to another servlet (or another web page). This can be done either
    as `redirect` or `forward`. In the first case, the server insertes a code into
    the HTTP header along with the new URL (in the `Location` field) and sends a response
    to the browser. It will then perform a request for the new URL. In the second
    case, the server will simply send the same request to another URL, including all
    attributes of key/value pairs from `form` fields. Thus, a `forward` does not involve
    the browser, and the address bar in the browser does not change as everything
    happens on the server side. I will show you how to perform a redirect and a forward,
    respectively. The starting point is the following HTML document, called `index.html`
    and is the start page of the application `Calculations`:


