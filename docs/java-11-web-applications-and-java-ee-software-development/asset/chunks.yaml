    # Java 11：Web 应用程序与 Java EE

    ## 软件开发


    Java 11：Web 应用程序与 Java EE：软件开发

    第一版

    © 2018 Poul Klausen & bookboon.com

    ISBN 978-87-403-1948-4

    Ove Thomsen, EA Dania 同行评审


    ## 前言


    本书是软件开发系列书籍中的第十一本。编程语言是 `Java`，该语言及其语法和语义显然占据了大量内容，但这些书籍在很大程度上也关注开发过程以及如何开发良好健壮的应用程序。本书涉及
    Web 应用程序的开发，重点是服务端以及如何开发动态网页。书从介绍 `servlets` 开始，随后简要地介绍了 `Java Server Pages` (JSP)。书的其余部分将介绍如何使用
    `Java Server Faces` (JSF) 编写 Web 应用程序，读完本书后，你应该能够编写经典的 Web 应用程序。然而，书中关于客户端的内容较少，这部分将在下一本书中首先介绍。本书并不是
    `JSF` 元素的参考手册，其目的是通过示例向你展示你在做什么，而你有必要查阅在线文档以获取现有许多 `JSF` 元素的概览。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何在 `Java` 中开发应用程序。可以通过阅读相关主题内容和学习完整的示例程序来学习，但最重要的是亲自动手并从零开始编写自己的程序。因此，书中的一个重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。该系列的所有书籍都围绕着同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放置在文中自然的位置。练习和问题的区别在于，练习在很大程度上是对文中所介绍内容的重复，并且对要做什么描述得相对准确。相比之下，问题的描述较为松散，通常规模稍大一些，且很少有明确的最佳解决方案。这些书应该从头到尾读完，但许多代码示例（包括练习和问题）起着核心作用，读者详细地研究许多示例中的代码是至关重要的，并且解决练习和问题，或者可能只是研究推荐的解决方案。


    所有书籍都以一或两个较大的示例程序结束，这些程序主要关注过程以及对程序如何编写的解释。另一方面，代码只在有限范围内出现——如果有的话——读者应该应该学习完成的程序代码，可能是在测试程序时。除了展示比其他介绍的示例更大的程序开发外，总结示例的目的还在于展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理一个书中未涉及的主题。这可能是软件安装问题或其他计算机技术中的其他主题，这些主题不关于软件开发，但有必要具备基础知识。如果读者已经熟悉该主题，可以跳过当前附录。


    如前所述，编程语言是 `Java`，此外，书中还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE（集成开发环境）

    2. `MySQL` 在需要数据库服务器时（从 `Java 6` 书开始）

    3. `GlassFish` 作为 Web 服务器和应用程序服务器（从 `Java 11` 书开始）


    这些产品都是免费且免费安装的，甚至提到了某些产品的安装过程可以完全自动完成，不需要费大的努力和挑战。此外，网上有针对这三个产品的详细安装说明。这些产品可在
    `Windows` 和 `Linux` 上运行，因此你使用 `Linux` 还是 `Windows` 并没有特殊的区别。


    所有示例程序都是在运行 `Linux` 的机器上开发和测试的。事实上，这并没有什么主要影响，因为无论平台是哪一个，`Java` 和其他产品的工作方式完全相同。书中会有某些地方你可能会看到平台是
    `Linux`，这主要适用于涉及文件系统的命令。在其他情况下，对于读者来说，程序在 `Linux` 机器上开发并没有特殊意义，它们也可以立即在 `Windows`
    下运行，除非程序引用了文件系统，在那种情况下可能需要更改文件名。


    最后，简单介绍一下这些书不是什么。它们不是 `Java` 的“如何编写”指南，或者说不是参考手册，而是正如标题所示，是关于软件开发的书。我希望读者在阅读这些书籍时，通过许多示例，可以找到如何编写良好程序的灵感，也可以将其作为素材集，提供许多解决你作为软件开发人员经常面对的具体日常编程问题的示例。


    ## 1 引言


    在之前的书籍中，关于系统开发、编程和 `Java` 的所有论述都是针对运行在单台计算机上的应用程序——也称为桌面应用程序。在接下来的书籍中，我将处理运行在多台机器上并通过网络（通常是
    Internet）交换数据的应用程序开发，事实上，这样的程序在实践中是最常见的——至少如果你看公司或公共机构使用的程序是的话。除了在网络上运行程序外，它们的特点是有许多并发用户，并且通常包含在一个
    IT 解决方案中，该方案包含几个协同工作以解决所需任务的程序。开发此类程序需要新的解决方案，另一方面它们对系统开发过程本身提出了新的要求，但幸运的是到目前为止所的一切仍然有效，只是需要扩展新的概念。


    在文献中，此类程序通常被称为企业级应用，在没有精确定义其情况下，它涵盖了大型公司和组织的程序，但也许你应该这样理解：程序不仅仅是一个程序，它是公司内部某种工作情况或任务的解决方案。我将首先介绍
    Web 应用程序的开发，即通过 Internet 运行的应用，尽管它不是企业级应用的唯一类型，甚至可能已经无法分不清什么是 Web 应用程序什么是不是了，但至少这里讨论的是以非传统办公软件方式开发的一些技术和应用程序。


