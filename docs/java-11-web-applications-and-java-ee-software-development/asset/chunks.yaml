    updates the database.


    This web application is simple and are in more places simplified to a practical
    application, and of course, there could be more features such as search on employees,
    but it is a typical web application where users can edit data, which is stored
    in a database. In practice, many web applications are database applications, for
    example, thinking of a classic shopping cart.


    However, before I completely leave the application there is a single standout.
    As mentioned, I uses a class *DB* to create a connection to the database. It requires
    at least a database user in the form of username and password. This information
    is often saved in a configuration file and I have used *web.xml*:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_112.jpg)


    It is generally considered to be a safe place as it is not sent to the client,
    and since the web container does not allow access to the file from the outside.
    However, this means that a Java class should be able to retrieve these parameters,
    and it can be done with a listener class that retrieves information when the application
    starts. Note that *web.xml* defines this listener as the *ParamsFactory* class,
    and the server will instantiate an object of this class that creates a *Properties*
    object with the context parameters as the key / value pair. This item is represented
    by the class


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1121.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_113.jpg)


    there only have static members. The *Properties* object is created in *ParamsFactory*
    (listening Object):


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_1131.jpg)


    This method is automatically performed by the Glassfish server, and the following
    class can therefore connect to the database:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_114.jpg)


    ## Exercise 4


    Start by creating a copy of the web application *ChangeAddress2*. You must expand
    the application to add a *Delete* button to the edit page:


    ![](image/Image34109.jpg)


    The button should only be there if you edit an existing employee. When you click
    the button, the employee must be deleted from the database. The easiest thing
    is to let the button post to a new servlet, which then deletes the employee.


    # 6 JSF


    The whole idea behind JSP is to separate the presentation part from the application’s
    business logic so that the individual pages of a web application are written as
    JSP pages, which then perform their data processing by sending requests to servlets,
    and as mentioned, the JSP page itself is translated into a servlet. The data to
    be manipulated by the JSP page is represented by a Java bean, which is a Java
    class whose properties can immediately be linked to the JSP page’s fields. With
    this model you are able to develop effective dynamic websites. The technology
    has since been refined, and today wee talk about JSF, that stands for *Java Server
    Faces*, and the goal has been to make it easier to develop modern web applications
    and make it easier to use many new web technologies. A JSF page replaces the JSP
    pages, and a JSF page is linked to a special servlet, which is called a *FacesServlet*.
    One can also say that JSF is not much more than a natural development of a technology
    driven by the many new demands that constantly arise in the development of effective
    web applications.


    I will start by showing how a web application with JSF can be written using NetBeans.
    The application is basically the same as I previously shown, where the user must
    enter two numbers, after which the program can perform a calculation:


    ![](image/Image34116.jpg)


    The calculation is one of the four calculations types, and there are two buttons,
    one clear the fields (the two input fields and the result), while the other performs
    the calculation.


    The project is called *CalculationPage* and is created in NetBeans as other web
    applications, but in the *Server Settings* window, I click *Next* and then I comes
    to the window for selecting *Frameworks*. Here you must tick the *JavaServer Faces*
    field (see below). The rest must remain as it is and when you click *Finish*,
    a JSF web application has been created that consists of a single file named *index.xhtml*:


    ![](image/Image34124.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_118.jpg)


    As you can see, it is an XML document with HTML syntax, and in fact it is a complete
    web application that can be translated and opened in the browser. The task is,
    of course, to modify this page so it displays a window as shown above.


    Data to a JSP page is represented by a Java bean, and there will usually be a
    Java bean to any JSP page. The same goes for JSF pages, but instead, you’re talking
    about a named bean (exactly a CDI named bean) or a controller, but basically,
    it’s nothing but a usual Java bean with two annotations in front of the class.
    To associate such a named bean with the project, I have added a package *calculationpage.beans*
    as previously. Then I have right-clicked and selected *JSF Managed Bean* (see
    below). When I click OK, I get a window to create the desired class (see below).
    The name is *CalulationController* and you should note that the above package
    is selected. Also note the *Name* field, which is the name that the class is known
    in the JSF page. By default, NetBeans choose the class name starting with a lowercase
    letter, and there is seldom a reason to change it. Finally, note the field *Scope*
    where I have the choice session. When you click OK, NetBeans will create a named
    bean:


    ![](image/Image34131.jpg)![](image/Image34139.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_121.jpg)'
