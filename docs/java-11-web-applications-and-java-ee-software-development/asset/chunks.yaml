    is ok, as it is a small application, but a larger application developed in the
    same way as the above will be hopeless to maintain. The problem is the use of
    styles, where styles are used in many elements around the individual views. There
    is nothing wrong with styles and that’s exactly the meaning, that the layout and
    look and feel of a web application’s views should be implemented by using styles
    but it should be done using class’s defined in style sheets and not enough with
    that, it must be based on a well-defined plan for how the user interface should
    look and work. In the current example, individual items are styled ad hoc as there
    has been a need. It means partly lacking consistency in styling elements, and
    partly that it is hopeless (and at least time consuming) to change how the individual
    elements should appear as you have to go around in all views and find the individual
    elements.


    In fact, I have not mentioned styles or style sheets yet, but just used styles
    as needed and without comments. This is one of the topics in the following book,
    where I in generally will focus on client side of web applications.


    #### Attractive user interfaces


    Looking at proprietary web applications, one quickly recognizes that much energy
    has been used for a web application to be great (whatever it is) and user-friendly,
    so users want to visit the site. How to achieve it is not the subject of these
    books, and although it is based on individualism and fortunate beliefs, there
    are theories for how a web site should be developed to make it user-friendly and
    easy to understand and use. These include the use of colors, font and font size,
    graphics, and ease of navigating the site.


    The current example is missing a lot at that point, and as another problem, the
    application is hard-coded to a large screen (the individual view elements have
    a fixed size) that does not work. It can also be mentioned that nothing has been
    done to ensure that the application is browser independent, which are also factors
    that must be considered in practice.


    #### Client side programming


    Often, you will be interested in something dynamic on the client side and without
    the need for a request to the server. It requires the browser to execute program
    code, and here is the preferred *JavaScript*, which is interpreted code. Today’s
    web applications simply can not be developed without the use of client code, and
    the next book will therefore include an introduction to *JavaScript*, which is
    a simple programming language with the same syntax as Java.


    If you look at what I’ve mentioned in this chapter, it deals only with the client
    side and thus the browser. The purpose of the current example is to show programming
    of the server side, but as shown, there is another side of a web applications
    that this application either does not use or does not use in a particularly good
    way. That is the subject of the next book.


    #### Authentication and security


    A very central issue in developing web applications is security. As mentioned
    under the design, it is also a place where this application leaves much to be
    desired, simply because I have not yet addressed what it takes, but it is also
    a subject being dealt with later.


    Basically, it is about protecting the data that a web application maintains, as
    well as ensuring that the program code performed on the client’s machine can not
    cause damage. Since everyone can in principle send a request to a web server,
    it is important to ensure that unauthorized users can not get unwanted access
    to data, and this is done by, for example, authentication where a user must have
    a login, and they must also ensure data sent between server and client, which
    occurs by encryption. It sounds simple, but it’s no matter what the many attacks
    on it solutions also tells. The second issue to ensure that no malicious program
    code is downloaded to the client’s machine is solved using special software (antivirus
    programs) that monitors the data traffic, but also by ensuring that the code that
    the browser should perform is such, that it can not cause harm by limiting what
    the code may be allowed. It’s also not easy, and again, there are a lot of examples
    that client machines have been attacked by unwanted software.


    The conclusion is that security associated with web applications plays an increasing
    and extremely important role. There are, however, a solution, namely, not to use
    the Internet, but as our world looks today, it’s not a viable way. It’s a little
    like that would stop using power, which most probably would also reject as an
    option. There is nothing but recognition that solutions are to develop secure
    it solutions – if that is possible?


    #### Distributed programming


    A program like *VeteranCars* is not a proprietary program, as it is a program
    that runs with a database on a web server, but in practice many web applications
    will be distributed programs. Based on the current program, there was nothing
    in the way that the Glassfish server and database server could be on two different
    machines, and for example, the uploaded images could be placed on a third machine.
    Similarly, with reference to what is otherwise said in this chapter, some of the
    code could be performed on the clients’ machines. In fact, you could think about
    it and consider the individual Java objects on the server as objects that were
    instanted and placed around on different machines and lived as services that these
    machines could then make available to clients such as web servers, but also common
    client machines with installed stand alone applications or mobile phones.


    This means a completely different view of programs and a much greater flexibility
    where a program performs its work by using services that different machines make
    available over a network that, in practice, is often the Internet. The development
    of such applications means new demands for the developers, not to mention security
    requirements. Development of such programs is the subject of the book Java 13.


    The conclusion to all is that the development of web applications and distributed
    applications requires knowledge of a number of technologies and Java APIs, and
    a large part of the following books will deal with these things.


