    CDI 命名 Bean）或控制器，但基本上它只是一个在类前面有两个注解的普通 Java Bean。为了将此类命名 Bean 与项目关联，我像之前一样添加了包
    `calculationpage.beans`。然后我右键点击并选择了 `JSF Managed Bean`（见下方）。当我点击 OK 时，会弹出一个创建所需类的窗口（见下方）。名称为
