    如果你点击“提交”（Submit）按钮，表单数据将发送到服务器，服务器可能会返回如下消息：


    ![](img/Image33834.jpg)


    因为用户没有输入完整的地址。你将需要点击该链接，然后就可以重新填写表单。


    如果你如下所示填写了所有字段，其中电子邮件地址字段未填写，且表单上的日期格式为 `DD-MM-YYYY`（即字段之间使用连字符 `-`），然后点击 `Submit`，你将收到一个作为响应的收据（见下文）。


    当然，这是一个非常简单的应用程序，但它是一个将数据从客户端发送到服务器进行处理的应用程序，之后客户端获得响应。在许多方面，这就是许多 Web 应用的原理。


    ![](img/Image33842.jpg)![](img/Image33849.jpg)


    基础是一个名为 `ChangeAddress1` 的 NetBeans 项目，作为本章的第一个项目，它是一个 Web 应用项目（Web Application）。NetBeans
    创建了一个名为 `index.html` 的首页，我将其修改为如下内容：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_26.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_27.jpg)


    该页面显示表单。`form` 在 HTML 中通过 `form` 元素定义。在这种情况下，表单字段被放置在表格中，这样可以使字段整齐地在两列中上下对齐。表格有
    7 行，前 6 行包含一个标签（label）和一个 `input` 元素。`label` 显示文本，而此例中类型为 `text` 的 `input` 元素是一个输入字段。每个输入字段都有一个
    `name`，并分别通过 `id` 和 `name` 属性定义了标识符。在这种情况下，只有后者是必要的，但当通过 `id` 或 `name` 标识元素时，二者略有不同；而当元素的值作为表单的一部分发送到服务器时，使用的是
    `name` 属性。然而，如果你需要从样式表中引用元素，则使用的是 `id` 属性。因此，同时标出两者可能是一个好主意。表格的最后一行也有两个输入组件，但它们的类型不同。这两个组件都被浏览器渲染为按钮，`value`
    属性指定了按钮显示的文本。第一个组件用于清除表单的输入字段，而另一个（`submit` 组件）则将表单提交到服务器。


    如果你考虑 `form` 元素，它有两个属性。`action` 指明请求应该发送到服务器上的哪个页面。在本例中，它是 `AddressServlet`，这是一个
    servlet。另一个方法（属性）指示请求的类型，这里是 `POST`。这意味着表单的元素将以键值对的形式随请求一起发送，其中键是 `name` 属性的值，而值是
    `value` 属性的值（对于输入字段来说，值就是输入的文本）。


    如所述，`AddressServlet` 指的是一个 servlet。它的创建方式与上一个示例相同，我将其命名为 `AddressServlet`。在“配置部署部署”（Configure
    Servlet Deployment）屏幕上，这次我没有更改 `Servlet Name` 和 `URL Pattern (s)` 的值，但我为该 servlet
    创建了一个包（package）。完整的代码所示，其中我删除了所有注释以及最后一个方法 `getServletInfo()`：


