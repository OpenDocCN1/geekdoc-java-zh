    This servlet does nothing but deciding which operation to be performed, and then
    passes that request to one of four additional servlets (`AddServlet`, `SubServlet`,
    `MulServlet` and `DivServlet`), but in the first two cases it happens as `redirect`,
    while in the other two cases it happens as `forward`. The four servlets for the
