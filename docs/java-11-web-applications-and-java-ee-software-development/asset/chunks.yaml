    A typical web appilation consists of many pages (or views) and works while the
    user navigating between different pages often by performing an action with either
    `h:commandButton` or `h:commandLink` element. In both cases, it means calling
    a named bean. For large applications, it can actually be complicated to control,
    especially because navigating a page may depend on a condition. For these reasons,
    a special descriptor file has been introduced that specifies how navigation can
    take place. The example `ViewNavigation` has the following `index.xhtml`:


