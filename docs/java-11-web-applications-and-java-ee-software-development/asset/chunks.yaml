    | Header | | | Description |

    | :--- | :--- | :--- | :--- |

    | `Cache-Control` | x | x | Used by proxy servers and describes how to handle
    request and response. |

    | `Code` | x | | | Defines an encoding of the data block. Standard is `Base64`.
    |

    | `Content-Base` | | x | Used to solve relative URLs in the returned document.
    This header overrides `Content-Location`. |

    | `Content-Encodning` | | | x | Indicates an encoding applied to the document
    before it is transmitted. |

    | `Content-Language` | | | x | Indicates the natural language for the content.
    |

    | `Content-Length` | | | x | The length of the data block in bytes. |

    | `Content-Location` | | | x | Specifies the location of the document being sent.
    |

    | `Content-MD5` | | | x | Used for a checksum for the data block. |

    | `Content-Type` | | | x | Specifies the type of data being sent. |

    | `Expires` | | | x | Specifies a date for data to be perceived as obsolete. |

    | `From` | x | | | The client’s email address. |

    | `Host` | x | | | The host’s name from the URL. |

    | `Last-Modified` | | | x | Specifies where the document sent last has been changed.
    |

    | `Location` | | | x | Used for redirect to another address for example in case
    of an error. |

    | `Referrer` | x | | | The source for the current request. |

    | `User-Agent` | x | | | The browser’s signature that is used to test which browser
    a request is coming from. |

    | `Warning` | | | x | Used for additional information in connection with a response.
    |


    As mentioned above, HTTP defines seven methods, and `GET` and `POST` are the most
    important. `GET` is the simplest and simply consists in sending a request to a
    server that it should send a document with a given document address. That is there
    is no data block in connection with a `GET`. The document that `GET` refers may
    be a program – for example a `servlet` – and you can transfer data to such a program.
    This happens as part of the URL:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_211.jpg)


    and you would in the browser’s address field types


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_2111.jpg)


    Here two data elements are transferred to the page `index.xphtml`. The question
    mark after the document address indicates that a parameter is sent in pairs


    `keyword=value`


    If more parameters are sent, each pair must be separated by `&`.


    `POST` is different as data is encapsulated in the data block and the method is
    used when larger and more complex data sizes are sent to the server. With `POST`
    it is possible to enclose data of different types in the same request as well
    as to send binary data to the server. Another important difference between `GET`
    and `POST` is that when `GET` data is added to the URL, they are also visible
    to the user in the browser’s address bar, which is not always desirable. This
    is not the case with the `POST` method. In addition, it should be noted that the
    server may have limitations regarding the length of an URL, and thus how many
    data can be sent with `GET`.

