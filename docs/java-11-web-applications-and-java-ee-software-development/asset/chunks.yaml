    `guestbook` 的数据库开始。数据库应该只有一个表，可以通过以下脚本创建：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_147.jpg)


    其中日期在写入留言板时会自动分配。程序必须使用 `JavaServer` 编写是一项要求。除了写入留言板的表单外，还必须有一个显示留言板内容的 JSF 页面。


