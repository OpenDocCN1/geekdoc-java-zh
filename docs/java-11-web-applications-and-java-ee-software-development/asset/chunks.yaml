    \ `images`，并为此复制了一张名为 `thy.jpg` 的图片。然后，我将 `mainTemplate.xhtml` 修改为以下内容：\n\n![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1551.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_156.jpg)\n\
    \n也就是说，我在四个区域中的三个区域插入了代码。如果你打开应用程序并点击首页上的链接，将得到以下结果（即 `gallery.xhtml`）：\n\n![](img/Image34271.jpg)\n\
    \n在左侧区域有一个表单，其中包含一个带有 `commandLink` 元素的菜单。第一个链接指向视图本身，而其他链接指向一个尚未创建的视图。你应该注意底部以及如何插入图像。特别注意如何设置图像样式以填充整个窗口。最后，顶部只包含一个\
    \ `h1` 元素，但显然这个项目没有被使用。原因是顶部被 `gallery.xhtmp` 覆盖了，它在顶部区域插入了默认内容，从而覆盖了来自模板的结果。\n\
    \n下一个任务是使 `galley.xhtml` 视图变得完整完备。内容必须是一个指向图像的链接列表，你可以通过点击链接查看图片。该视图与其他视图一样，有一个控制器，但首先我想定义一个可以表示图像的类：\n\
    \n![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_157.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_158.jpg)\n\
    \n该类位于 `paweb.models` 包中。这是一个相当简单的模型类，也是一个标准的 Java 类。`Text` 是要在屏幕上显示的值，而 `name`\
    \ 是该类应该表示的图片（或其他）名称。在实践中，图像可能会附带更多属性，为了说明这一点，我定义了以下派生类：\n\n![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1581.jpg)\n\
    \n然后，我为画廊视图编写了一个控制器类：\n\n![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1582.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_159.jpg)\n\
    \n这是一个非常简单的控制器，只有一个属性，即 `Photo` 对象的列表。然后，我更改了 `gallery.xhtml`，使其现在中心区域插入代码：\n\n\
    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1591.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_160.jpg)\n\
    \n内容是一个带有 `dateTable` 元素的表单，该表包含由控制器类确定的数量的 `commandLink` 元素。带参数的动作示例，其中使用了 `param`。\n\
    \n任务是创建一个复合组件（composite component）。首先，我们在 `resources` 下创建一个名为 `search` 的文件夹。在其中，创建一个名为\
    \ `search.xhtml` 的文件。该文件将定义我们组件的接口：\n\n```xml\n<composite:component xmlns:cc=\"\
    http://xmlns.jcp.org/xml/jsf/composite\" \n                    xmlns:composite=\"\
    http://xmlns.jcp.org/xml/jsf/composite\" \n                    xmlns:h=\"http://xmlns.jcp.org/xml/jsf/core\"\
    >\n    <cc:interface>\n        <cc:attribute name=\"searchList\" type=\"java.util.List\"\
    \ />\n        <cc:attribute name=\"searchAction\" type=\"java.lang.String\" />\n\
    \        <cc:attribute name=\"search\" type=\"java.lang.String\" default=\"\"\
    \ />\n    </cc:interface>\n    \n    <h:form>\n        <h:inputText value=\"#{cc.attrs.search}\"\
    \ />\n        <h:commandButton value=\"Search\" action=\"#{cc.attrs.searchAction(cc.attrs.search)}\"\
    \ />\n    </h:form>\n\n    <h:dataTable value=\"#{cc.attrs.searchList}\">\n  \
    \      <h:column>\n            <h:outputText value=\"#{item.name}\" />\n     \
    \   </h:column>\n    </h:dataTable>\n</composite:component>\n```\n\n接下来，我们在 `search.xhtml`\
    \ 中创建实现部分以处理逻辑。然而，在本示例中，我们关注的是如何在 `gallery.xhtml` 中使用该组件。\n\n在 `gallery.xhtml`\
    \ 中，我们这样包含该组件：\n\n```xml\n<my:search searchList=\"#{galleryController.photos}\"\
    \ \n           searchAction=\"#{galleryController.search}\" \n           search=\"\
    #{galleryController.searchQuery}\" />\n```\n\n"
