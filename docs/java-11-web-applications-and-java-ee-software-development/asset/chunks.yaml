    并携带错误消息。通过正确初始化对象，`date` 字段被用于判断是更新还是向数据库中添加新行。


    这些操作通过我在此未展示的两个方法实现，但区别在于其中一个执行 SQL `INSERT`，而另一个执行 SQL `UPDATE`。如果这些方法没有执行得当，它们会抛出异常，该异常将作为错误消息发送回
    `edit.jsp`。相反，如果数据库更新正确，在更新情况下你将返回到主页；但如果是新员工，你将被引导到 `employee.jsp` 页面，该页面将显示你分配的员工编号。


