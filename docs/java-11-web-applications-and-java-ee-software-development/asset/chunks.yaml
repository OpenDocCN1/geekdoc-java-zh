    `firstname`、`lastname`、`zipcode` 和 `email`，并注意 `zipcode` 列是 `zipcode` 表的外键。


    当你启动应用程序时，你会看到浏览器：


    ![](img/Image34070.jpg)


    这被视为欢迎页。这是一个名为 `index.jsp` 的 JSP 页面，它包含指向三个其他 JSP 页面的链接，这些页面对应于应用程序可以执行的三个功能。该页面看起来并不多，但仍然有很多新内容，因为页面有一个页眉（彩色区域）。它是另一个
    JSP 页面部分的 JSP 页面。


    查看第一行，它包含一个页眉以及关于页面管理员的文本。后者是自定义 Web 元素的示例。在这种情况下这个示例可能需要搜索，但自定义 Web 元素被定义为 `SimpleTagSupport`
    类的派生类。

