    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_87.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_88.jpg)


    在这种情况下，该元素必须具有两个字符串类型的属性，分别称为 `master1` 和 `master2`。这两个属性都有设置方法（set methods），除此之外，`doTag()`
    方法定义了如何在浏览器中渲染该项目。为了在应用程序中使用自定义 Web 元素，必须在一个 `Tag Library Description`（标签库描述符）文件中对其进行注册（我之前曾用它来定义一个函数），在这种情况下，其内容如下：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_881.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_89.jpg)


    注意，作为简短名称，我使用了字母 `t`。该文件定义了一个名为 `webmaster` 的单一元素，除了类名之外，你必须定义元素的属性，在这种情况下有两个属性。属性通过名称和是否为必填来定义。`rtexprvalue`
    名称指定了该属性是否必须用 `${}` 服务器值进行初始化。


    设置好这个自定义项目后，头部可以定义为如下 JSP 页面，命名为 `header.jsp`：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_891.jpg)


    你应该注意，上述描述的标签库是由一个指令（directive）定义的，但除此之外你会注意到它没有正文（body）。它不是真正的 JSP 页面，而是旨在插入到另一个
    JSP 页面中的 JSP 代码。


    Web 应用开发的主要挑战之一是视觉表示，即页面在浏览器中的显示方式。这一点我只会简单提到，但通常你通过样式（styles）来定义细节。也就是说，对于上述两个
    `TD` 元素，都定义了一个指示字体大小和颜色的样式。更一般，你可以在样式表（style sheet）中定义样式，样式表是应用程序页面可以应用的样式文档。作为应用程序的一部分，我定义了以下样式表：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_90.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_91.jpg)


    当然，关于样式表有许多语法细节，但当你阅读单个样式时，它们非常易理解，而且 NetBeans 识别样式表并能为单个样式提供帮助。在实践中，样式表可以非常全面，其核心思想是将单个
    HTML 元素的显示方式定义从 HTML 和 JSP 文档中移动出来。这意味着，一方面这些文档变得更简单、易于理解，另一方面，维护网站的外观变得更容易，因为你只需要修改样式表。这种思想是：HTML
    和 JSP 文档应该只定义内容，而样式表则定义如何在浏览器中渲染内容。因此，样式表是随页面一起发送的文本文档，浏览器使用它来渲染文档。样式表不在服务器端使用。


    在这种情况下，定义了 9 种样式。前三个非常简单，定义了 `body` 元素（以及整个文档）的字体（应作为默认应用），并定义了段落有多宽（这样的文本行并不一定填充整个屏幕），以及
    `li` 元素必须有 10 的上边距。接两个定义了一个可以与特定元素关联的所谓 `class`（类），例如上述头部使用的 `header-class`：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_92.jpg)


    最后三个样式更复杂，定义了可以在 HTML 表格中使用的样式。我稍后回到它们。这些样式被所有使用该样式表的文档使用。如果你查看主页的代码，你可以看到如何通过头部的
    `link` 元素定义使用相关的样式表：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_921.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_93.jpg)


    你还需要注意上述头部是如何通过 `jsp:include` 元素作为 body 部分的第一行插入的。你必须注意，这是在服务器端执行的，由服务器负责创建完整的文档。在这个应用程序中，所有页面都以此头部开头，它可以帮助确保
    Web 应用程序中的所有页面具有共同的外观和感受，并且很容易更改，因为你可以轻松地更改头部。你还需要注意，原则上，一个 JSP 页面可以拥有所有需要的 `jsp:include`
    项目，并且它们可以出现在任何地方。


    如果你点击主页顶部的链接，将得到下面的浏览器界面：


    ![](img/Image34081.jpg)


    它应该展示了一个简单的登录页面。在这种情况下，用户在点击按钮时必须输入其工号和密码，这些信息会被发送到服务器。如果用户只输入密码（没有工号），服务器必须创建一个新员工并分配一个自动生成的编号。如果输入了工号，服务器必须验证该编号，如果它是合法的，服务器必须检查数据库是否有具有该编号和密码的员工，并在必要时加载该员工。如果表单数据非法，程序必须返回登录页并显示错误信息，且表单字段应保留内容以便用户编辑。如果数据可以被接受，服务器则跳转到编辑页面，以便用户编辑数据。


