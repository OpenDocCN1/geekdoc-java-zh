    如果你在两个顶部字段中输入整数并点击顶部的 `OK` 按钮，结果可能如下所示。也就是说，这两个数字进行了一些计算，结果出现在五行结果中。然后，在底部的输入字段中输入
    107（一个质数）并点击底部的 `OK` 按钮，除了所有字段都保留其原有值外，什么都没有发生，但你可以看到窗口正在更新并且有一个提交操作。如果你现在输入 108
    并点击 `OK`，你将看到下面的窗口。这是因为 108 不是质数，应用程序抛出了异常。当你点击 `Repeat` 时，你会返回主窗口，并注意所有值仍在那里。你应该特别注意底部的输入字段仍然具有值
    `107`。最后，有两个链接。如果你点击其中一个，底部的输入字段将分别更新为下一个或上一个质数。


    这是其功能所在，程序应该展示了如何使用 Java beans 将用户界面 HTML 与 Java 代码（在 Java beans 和其他类中实现）分开。认为这一点很重要，你就能获得一个更容易维护的
    Web 应用程序。


    ![](img/Image34022.jpg)![](img/Image34030.jpg)


