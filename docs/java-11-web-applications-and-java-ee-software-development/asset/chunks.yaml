  raw: 'If you enter integers in the two top fields and click the top *OK* button,
    the result could be as shown below. That is, some calculations have been made
    on the two numbers, and the results appear on the five results lines. Then, in
    the bottom input field, enter 107 (which is a prime number) and click on the bottom
    *OK* button, nothing happens except that all fields retain their values, but you
    can see that the window is being updated and that there is a submit. If you now
    type 108 and click *OK*, you will see the window below. This is because 108 is
    not a prime and the application has raised an exception. When you click on *Repeat*,
    you return to the main window, and note that all values are still there. You should
    note in particular that the bottom input field still has the value 107\. Finally,
    there are the two links. If you click on one of them, the lower input field will
    be updated by the next or the previous prime, respectively.


    It was the functionality and the program should show how to use Java beans to
    separate the user interface HTML from the Java code, implemented in Java beans
    and other classes. One consider it as important, and you get a web application
    that is much easier to maintain.


    ![](image/Image34022.jpg)![](image/Image34030.jpg)


    The program uses two Java beans, which are located in the *beanfields.beans* package.
    The first represents the two top input fields and is the following:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_69.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_70.jpg)


    The class fills some lines, but is trivial. You should note that the class is
    written in accordance with the requirements of a Java bean, and here you should
    especially note the names of the two variables and the get and set methods that
    follows the standard of a Java bean. Also note that the class has other methods
    (the 5 calculation methods). Here you should especially note the two last ones
    who return 0 if the calculation is not possible. In fact, they should make an
    exception, but since the JSP page always uses the return value of the functions,
    this solution can not be used.


    The other Java bean is the following:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_71.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_72.jpg)


    Here there is also some code, and the goal is, among other things, to show that
    a Java bean can contain complex code similar to any other class. There is only
    one property that must represent a prime number. Therefore, its set method can
    raise an exception if you try to assign it a non-prime value. In addition to this
    property, there are two methods that assign the value to the next and the previous
    prime, respectively – if possible.


    The program has another Java class, which is a servlet and is called *PrimesServlet*.
    The class is found in the package *beanfields.servlets* and *processRequest()*
    is:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_73.jpg)


    It is a very simple servlet. It starts by determining a reference to a session
    object, which is a *PrimeBean*, and then executes *next()* or *prev()* depending
    on the value of a parameter. Finally, a redirect is performed to the start page.


    It was the Java code and back there are two JSP pages. The first is *index.jsp*
    where there are several things that you should notice:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_731.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_74.jpg)


    The page starts with two directives. The first is added by NetBeans, but you should
    note that I have added an attribute:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_741.jpg)


    which means that any Java beans can be created as session objects. The next directive
    refers to a JSP error page and indicates a page that will automatically be redirected
    to in case of an exception. Here you can then make an appropriate error handling.


    In the body section, the first thing is to create two Java bean objects. Here
    you should especially note that their scope is session, which means that they
    are objects whose value is retained in the context of submitting the page and
    it is an important part of the explanation that the page values are retained after
    a submit, however the actual reasoning is the two links at the end of the page.
    Following the declaration of the two beans, they are defined to be updated with
    the values of the input fields. That is, the classes’ set methods must be performed.
    You should note that with * you can indicate that it is all properties, or you
    can specify exactly which property should be updated. This is the case with *prim*,
    although there is no reason for it in this case, since there is only this one
    property. You must then note how to tie a property in a bean to an input field:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_75.jpg)


    In particular, you should note how to refer to the individual property and to
    use the name of the variable alone. That’s why a bean must adhere to the default
    for naming. Also note that the input field’s *name* is the same name as the current
    property, what is required. Following the first form named *form1* follows a table
    that inserts the return values of the 5 calculation methods using the same syntax
    as when a property is linked to an input field. Note that a JSP page (and also
    an HTML page) must have more forms. When you click on a submit button, only the
    values for the components that are part of the same form as the button are submitted
    to the server. The other form has only a single input element that binds to a
    property for *prim*. This happens in the same way as explained above, but it’s
    just another Java bean.


    Finally, there are the two links that will send a request to a servlet. The servlet
    is called *Primes*, but an argument must be provided that tells which operation
    is to be performed. Here you should especially note the syntax for how to add
    an argument to an URL:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_76.jpg)


    Back there is only the error page, which is a quite simple JSP page:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_761.jpg)


    It is, of course, a very simple error handling, but it notifies the user that
    there has been an error rather than just letting the program go down.


    ## 5.2 Functions


    ![](image/Image34037.jpg)


    It is also possible to call a static method in a class and apply the return value
    in the JSP page, but it requires the method to be registered in a *Tag Library
    Descriptor*, which is also called a *TLD*. The *BeanFunction* program opens the
    window above. There is a single input field that is bound to a property in a Java
    bean and there is a submit button. Clicking on the button sends the value of the
    field to the server and the program inserts the text *is not a prime* or *is a
    prime*. This happens by calling a static method whose argument is the value of
    the above property. The bean class code is the following and looks like the same
    bean from the previous example, but is just simpler:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_77.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_78.jpg)


    Note that the set method this time does not validate the value. To create a *Tag
    Library Descriptor*, I have added a directory named *tlds* to *WEB-INF* and then
    added the descriptor to this directory:


    ![](image/Image34045.jpg)


    This sub directory is not necessary, but it is recommended to create such a directory
    as a larger web application may well have more *Tag Library Descriptors*. The
    descriptor itself is called *functions.tld* and is an XML document:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_79.jpg)'
