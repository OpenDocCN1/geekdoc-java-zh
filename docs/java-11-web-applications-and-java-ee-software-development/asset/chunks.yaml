    follows. If you come from (the action has taken place) `index.xhtml`, there is
    a single navigation case that says that if the value (key) is `INFO`, you must
    navigate to the `info.xhtml` page. You should note that a navigation rule may
    have more (many) navigation-case entries.


    By using a `faces-config.xml` file, you can completely control how to navigate
    between individual views in a web application, but it can mean a very large file
    where you need to write a lot. Therefore, the concept of implicit navigation has
    been introduced, which does not use the configuration file.


