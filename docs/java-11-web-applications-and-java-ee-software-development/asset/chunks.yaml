    ## 3.2 Sessions（会话）


    当你从浏览器请求一个页面且服务器返回响应时，该过程将如前所述，按照 HTTP 协议进行。该协议基本上是无状态的，这意味着在服务器返回响应后，服务器就“忘记”了所有关于请求的信息，下次收到对同一页面的请求时，服务器会将其视为新请求。这种模型与现代
    Web 应用程序格格不入，你可以通过 `session`（会话）概念等方法解决这个问题。


    当用户打开浏览器并向新页面发送请求时，服务器会检查是否包含 `session ID`。无论这是否是对浏览器地址栏中输入的新页面的请求，服务器都会生成一个 `session
    ID` 并将其随响应一起返回给客户端。如果客户端随后执行提交，或者例如点击指向同一 Web 应用程序中某个页面的链接，浏览器将带上 session ID，服务器将其包含在响应中。这样，就引入了名为
    `session` 的术语，只要服务器还引用同一个 Web 应用程序内的页面，会话就会一直存在。


    这可以用于定义在整个会话期间存在的数据。当服务器创建 `session ID` 时，也会创建一个会话对象，该对象包含一个 `Object` 对象的集合。因此，服务器可以在此集合中创建并保存对象，这些对象的生命周期与会话对象一样长，因此它们可以被该会话内的所有页面使用。需要注意的是，这些对象仅在服务器端已知，不会发送到客户端。唯一发送到客户端的是
    `session ID`，它在每个请求/响应对中往返传输。


    单个会话对象一直保存在服务器上，直到它们被显式移除，或者由于超时被移除（例如，可能是 30 分钟）。这意味着，服务器可能拥有许多不再使用的会话对象，从而占用空间；而且如果停止工作，会话对象（如购物车）可能会消失。


    为了说明会话的使用，我创建了一个名为 `Sessions` 的 Web 应用程序。对于此应用程序，我将添加三个 servlet。在向 Web 应用程序添加
    servlet 时，不应将其放在项目的默认包中（在上面的第一个例子中已经那样做了了）。通常，我会创建一个名为 `projectname.servlets`
    的包（在本例中为 `sessions.servlets`），并将我的 servlet 放在那里。在这种情况下，我还创建了一个名为 `sessions.data`
    的包，并添加了以下类，它可以表示一个带有名称和头衔的人：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_40.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_41.jpg)


    你应该注意这是一个相当常见的模型类。作为下一步，我添加了以下 servlet：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_411.jpg)


    `processRequest()` 方法首先确定从向此 servlet 发送请求的页面两个表单字段的值。如果可能，且它们都不为 `null`，则将它们用于创建一个
    `Person` 对象。接下来，添加对会话对象的引用：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_42.jpg)


    这意味着如果对象不存在，则必须创建它。下一步，将 `Person` 对象添加到会话集合中，键为 `person`。最后，返回一个响应，其中包含会话对象。


    起始页的代码如下：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_421.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_43.jpg)


    如果你运行应用程序，将得到以下窗口：


    ![](img/Image3392.jpg)


    如果你在此处输入名称和头衔并点击 *OK*，将得到以下结果：


    ![](img/Image3329.jpg)


    它告诉会话对象已更新，以及 session ID 是什么。你应该注意它表示为一个大的十六进制数，你通常无法对它做什么，但在这种情况下可以使用它查看何时启动了新会话。


    作为下一步，添加了一个 servlet，它显示创建的人的名字：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_44.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_45.jpg)


    这里没什么好解释的，但你应该注意如何引用会话对象以及存储在 `person` 下的对象。结果是一个 `Object`，因此需要进行类型转换。


    同样，创建了一个名为 `TitleServlet` 的 servlet，它发送一个带有 `Person` 对象头衔的响应。如果你在起始页输入：


    ![](img/Image33937.jpg)


    并点击 *OK*，然后从起始页点击 *Show name* 链接，你将得到窗口：


    ![](img/Image33944.jpg)


