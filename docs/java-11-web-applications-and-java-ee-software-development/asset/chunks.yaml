    应用程序像本章中的所有 Web 应用程序一样被创建，并创建一个名为 `index.xhtml` 的 `Facelet` 作为启动器。注意，在应用程序创建后，还创建了一个描述符
    `web.xml`，它基本上标明了这是一个 JSF 应用程序。我编辑了 `index.xhtml`，所以最终的代码如下，它只显示了一个欢迎页：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6_11-17_148.jpg)


    没什么好解释的，但你应该注意该视图有三个命令。第一个将始终跳转到 `info.xhtml`（通过显式导航）。另一个将在隐式导航的帮助下跳转到 `login.xhtml`
    或 `data.xhtml`。最后一个将不会进行跳转，因为 `logout()` 方法没有返回。最后，我想展示 `data.xhtml`：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1461.jpg)


    在这里你应该注意使用了隐式导航，但不是调用方法，而是直接将视图名称作为参数列出。

    [/content]


    *(注：由于您提供的文本中存在大量重复段落，我根据“一定不要重复输出原文”的原则，在翻译时对逻辑进行了去重处理。以下是修正后的完整译文：)*


    ---


    **修正后的完整译文：**


    [content]

    点击此按钮将返回起始页（`index.xhtml`）。如果你再次点击中间的按钮，将直接进入 `data.xhtml`，而无需经过 `login.xhtml`。起始页上的最后一个按钮用于注销，如果你点击它后再点击中间按钮，你必须再次回到
    `login.xhtml`。


    为了控制这一行为，使用了一个名为 `NavigationController` 的命名 Bean：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_142.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_143.jpg)


    它定义了返回字符串并可以作为动作（action）调用的方法。该类有一个变量来模拟用户是否登录。导航有两种类型：第一种称为**显式导航**（explicit
    navigation），其中动作方法引用一个字符串（键），该键指向 `faces-config.xml` 配置文件，然后由该文件指示应该显示哪个视图。另一种称为**隐式导航**（implicit
    navigation），其中动作方法直接返回当前视图的名称（但不带扩展名）。例如，如果你考虑 `toStart()` 和 `toInfo()` 方法，它们返回在
    `faces-config.xml` 中使用的字符串，是显式导航的示例。另一个例子是 `nextPage()` 方法是隐式导航的示例，因为它简单地返回了视图的名称（取决于条件）。还要注意最后两个方法，第一个也被用作显式导航的动作方法，但它首先修改了
    `loggedIn` 变量以模拟用户已登录。最后一个实际上是一个动作方法，但它不返回任何内容，这意味着不会跳转到另一个视图。


    然后是配置文件（添加到 `WEB-INF` 中）：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_144.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_145.jpg)


    在这种情况下，定义了三个导航规则。第一条规则的解释如下：如果你来自 `index.xhtml`（动作已执行），则有一个导航案例，说明如果值（键）为 `INFO`，则你必须导航到
    `info.xhtml` 页面。你应该注意，一个导航规则可能会有更多（许多）导航案例条目。


    通过使用 `faces-config.xml` 文件，你可以完全控制 Web 应用程序中各个视图之间的导航，但这可能意味着一个非常大的文件，你需要编写大量内容。因此，引入了隐式导航的概念，它不需要使用配置文件。


    以下是 `index.xhtml` 的代码：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1451.jpg)![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_146.jpg)


    没什么好解释的，但你应该注意该视图有三个命令。第一个将始终跳转到 `info.xhtml`（通过显式导航）。另一个将在隐式导航的帮助下跳转到 `login.xhtml`
    或 `data.xhtml`。最后一个将不会进行跳转，因为 `logout()` 方法没有返回。最后，我想展示 `data.xhtml`：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_1461.jpg)


    在这里你应该注意使用了隐式导航，但不是调用方法，而是直接将视图名称作为参数列出。


    ## 问题 2


