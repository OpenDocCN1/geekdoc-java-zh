    Clicking this button will return to the start page (`index.xhtml`). If you click
    on the middle button again, you’ll get directly to `data.xhtml` without having
    to go to `login.xhtml`. The last button on the start page is used for logout,
    and if you click on it and then on the middle button, you again has to go to `login.xhtml`.


    To control it, a named bean, called `NavigationController`, is used:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_142.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_143.jpg)


    It defines methods that return a string and can be called as an action. The class
    has a variable to simulate if the user is logged in. There are two types of navigation.
    The first is called `explicit navigation`, where the action method references
    a string (a key) that refers to a `faces-config.xml` configuration file, which
    then indicates which view should be displayed. The other is called `implicit navigation`,
    where the action method returns the name of the current view (but without extension).
    For example, if you consider the `toStart()` and `toInfo()` methods, they return
    a string used in `faces-config.xml` and are examples of explicit navigation. As
    another example, the method `nextPage()` is an example of implicit navigation
    as it simply returns the name of a view (which depends on a condition). Also note
    the two last methods, the first one also being used as an action method for explicit
    navigation, but it first modifies the `loggedIn` variable to simulate that the
    user is logged in. The last one is actually an action method, but does not return
    anything, which means that there is no forward to another view.


    Then there is the configuration file (added to `WEB-INF`):


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_144.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_145.jpg)


