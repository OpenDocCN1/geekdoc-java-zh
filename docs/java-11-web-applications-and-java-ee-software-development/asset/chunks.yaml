    在此语境下，考虑到维护问题，我并没有过多考虑程序的 beans 和其他 Java 类（关于这些内容与本系列之前的书籍中对类的描述并没什么可以补充的），相反，我关注的是单个
    facelet 的维护。让我在此确认，该应用程序在很多方面都有待改进空间。也许这个示例是可以的，因为它是一个小型应用程序，但如果按照上述方式开发一个大型应用程序，将变得无法维护。问题在于样式的使用，样式在单个视图周围的许多元素中被使用。样式本身没有问题，这正是样式的意义，即
    Web 应用视图的布局、外观和感受应该通过使用样式来实现，但应该使用样式表中定义的类来完成，而且不仅如此，它必须基于对用户界面应该如何外观和如何工作的良好计划。在当前的示例中，各个项目是根据需要临时定义（ad
    hoc）样式的。这意味着一方面在元素样式化上缺乏一致性，另一方面是改变单个元素的外观方式是徒劳的（而且至少是耗费时间的），因为你必须遍历所有的视图并找到这些单个元素。


    事实上，我还没有提到样式或样式表，只是在需要时使用了样式且没有加注释。这是接下来的书中将讨论的主题之一，通常我将重点关注 Web 应用的客户端。


    ### 吸引人的用户界面


    观察专有的 Web 应用程序可以很快发现，投入大量的精力是为了让 Web 应用变得伟大（无论是什么）且易于使用，以便用户想要访问该网站。如何实现并不是这些书的主题，尽管它基于个人主义和幸运的信念，但确实存在理论关于如何开发网站以使其易于使用、易于理解和操作。这些包括颜色的使用、字体和字体大小、图形以及导航的便利。


    当前的示例在这一点上缺失了许多内容，另一个问题是，应用程序被硬编码为大屏幕（单个视图元素具有固定尺寸），这并不可行。还可以提到，尚未做任何工作来确保应用程序具有浏览器无关性，这些也是在实践中必须考虑的因素。


    ### 客户端编程


    通常，你会对客户端的某些动态内容感兴趣，而不需要向服务器请求。这需要浏览器执行程序代码，而这里是首选的 `JavaScript`，它是解释型代码。如今的 Web
    应用如果不使用客户端代码是无法开发的，因此下一本书将包含对 `JavaScript` 的介绍，它是一种与 Java 语法相同的简单编程语言。


    如果你看我在本章中提到的内容，它只涉及客户端，因此涉及浏览器。当前示例的目的是展示服务器端的编程，但如所示，Web 应用还有另一面，这个应用程序要么没有使用，要么没有以特别好的方式使用。那就是下一本书的主题。


    ### 身份验证与安全


    开发 Web 应用中一个非常核心的问题是安全。正如设计部分提到的，这也是该应用程序在很多方面有待改进的地方，仅仅因为我还没有处理需要什么，但这也是稍后会处理的主题。


    基本上，它是关于保护 Web 应用所维护的数据，以及确保在客户端机器上执行的程序代码不会造成损坏。由于原则上每个人都可以向 Web 服务器发送请求，所以确保未经授权的用户无法获取不需要的数据至关重要，这通过身份验证来实现（例如用户必须登录），并且他们还必须确保在服务器和客户端之间传输的数据，这是通过加密实现的。这听起来很简单，但针对这些解决方案的许多攻击告诉我们事实如此。第二个问题是确保没有恶意程序代码下载到客户端机器，这通过使用特殊的软件（防病毒程序）监控数据流量来解决，但也通过通过限制浏览器允许执行的代码范围来使其无法造成伤害。这也不容易，再次，有很多例子表明客户端机器受到恶意软件的攻击。


    结论是，与 Web 应用相关的安全发挥着日益增长且极其重要的作用。然而有一种解决方案，即不使用互联网，但按照我们今天世界的样子，这不是可行的方法。这就像是停止它一样。


    ### 分布式编程


    像 `Veteran` 这样的程序不是专有程序，因为它运行在不同机器的数据库上。这意味着 Web 应用完全不同的视角，不同的机器通过网络（实际上通常是互联网）提供服务。开发此类应用程序对开发者提出了新需求，更不用说安全要求。开发此类程序是
    Java 13 的主题。


    总之，Web 应用和分布式应用程序的开发需要了解多种技术和 Java API，接下来的书中大部分将涉及这些内容。


