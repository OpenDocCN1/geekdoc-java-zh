    which models the database’s tables. It’s all simple model classes, maybe close
    to `Car`, which contain references to other objects:


    ![](image/Image34416.jpg)


    In addition, there is the class `Repository`, which is a singleton with methods
    for maintaining the database. The class is relatively complex (comprehensive),
    but does not contain anything new compared to corresponding classes from other
    programs. Parameters for the database (username and password) are stored in `web.xml`,
    as well as the name of the directory that contains the uploaded images:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_192.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_193.jpg)


    For images, they must be uploaded to a directory of write rights. Each time an
    image is uploaded, a row is created in the table `image` and the row is assigned
    an auto number. This number is at the same time used as the image file name, and
    if, for example, an image is assigned to the number 123 (by the database server),
    the image is saved under the name `123.jpg`. It is thus decided that the program
    will only support jpg images (photos).


    All views regarding the administration are located in the admin folder, and almost
    one is associated with a controller. When you select administration from the welcome
    page, you will see `logon.xhtml`, where you must enter member number and password.
    Then you will get to the management section’s welcome page, called `start.xhtml`.
    This page has a menu of features at the top. Corresponding to the requirement
    specification, the administrative part must have the following functions:


    1.  Maintenance of car brands

    2.  Maintenance of cars

    3.  Maintenance of owners (members)

    4.  Maintenance of the guestbook

    5.  Change password


    The first function is simple and can only be performed by a user with administrator
    privileges. It includes two views:


    1.  `brands.xhtml`, which shows an overview of all the car brands that have been
    created and you are editing a car brand by clicking on it

    2.  `brand.xhtml` which are used to create and maintain car brands


    The next function is the most comprehensive and can be performed by everyone,
    but if you are not created with administrator right, only your own cars will be
    displayed. The function has three views:


    1.  `cars.xhtml`, which shows an overview of all cars grouped by the car brand,
    so if you click on a car brand, you get all the cars for this brand and click
    on a car, you get all the car details and there is also a link so you can edit
    the information about the car

    2.  `car.xhtml`, which is used to create and maintain information about a car

    3.  `showcar.xhtml`, which shows details about a car and including any pictures


    When this feature is complex, it is partly because of uploading of images, where
    it should be possible to edit the caption as well as `showcar.xhtml` being able
    to display an image (the contents of a file). The last problem is solved with
    a servlet.


    The third function reminds of the first function and can be performed by all users
    with administrator privileges. The function has two views:


    1.  `owners.xhtml`, showing an overview of all owners

    2.  `owner.xhtml`, used to create and edit owner (member) information


    After implementing these functions, I have written the code to the public page.


    ### The public side


    From the welcome page you will get to `main.xhtml`, which is the web site’s central
    page. Here you can click on cars using a left-hand menu on where cars are grouped
    by car brand. You can also search for a car using any text that searches for the
    car brand, name, model and text. The cars that match are shown in a drop-down
    box from which you can choose a car.


    At the top there is also a link to the guestbook, which consists of two views:


    1.  `guests.xhtml`, which allows to search the guestbook where you can search
    by date or enter a search text for search on name and in the text itself

    2.  `guest.xhtm`, which allows you to write in the guestbook


    ### Completion of the administration part


    Lastly, I have completed the administration part. The password change function
    is simple and consists only of a single view with a controller. The last feature
    also has just a single view and is virtually identical to `guests.xhtml` and uses
    the same controller. The only difference is that it is possible to delete a page
    in the guestbook.


    ## 7.4 Deployment


    In order for a web application to be executed (opens in the browser), the application
    must be installed on the Glassfish server, a process called deployment. For the
    time being, I have ignored everything about it, as NetBeans does it quite automatically
    on a local running Glassfish server. I will now, as an example, show how you can
    deploy the current application on another machine. The prerequisite is that the
    machine has a running Glassfish server as well as a running database server. The
    process requires two files:


    1.  `veteran.sql`, which is the SQL script to create the database

    2.  `VeteranCars.war`, which is the war file with the web application (found in
    the project’s `dist` directory)


    The first step is to create the database, which simply consists in running the
    above script. Next, a directory must be created for images. Note that if you want
    a database of data, you can backup the database from the developer machine and
    create a restore of it, while also remembering to copy the images from the developer
    machine.


    For deployment, open the admin program in the browser:


    ![](image/Image3424.jpg)


    Here you have to click on `Applications` on the left side and then on the `Deploy`
    … and then you can browse to the war file (see below).


    ![](image/Image3431.jpg)


    All that remains is to ensure that the parameters of `web.xml` for the database
    server and the directory for images, respectively, are correct. You can edit the
    file by clicking on the apllication name and selecting the `Descriptor` tab (see
    below). Here is a link to `web.xml`, where you can edit the file.


    ![](image/Image3439.jpg)


    Then everything should be ready and the application can be opened in the browser
    (on another machine) by typing (assuming that the IP address is correct):


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_198.jpg)


    # 8 A final remark


    The example in the previous chapter should be perceived as a form of status of
    this introduction to web applications, and it is also a classic example of a web
    application. The question is then what’s missing before you’re fully trained as
    a web developer – and there’s more and more than I get in these books. I would
    like to end up with a little on the above application, and in particular the shortcomings
    of the application and the requirements for web applications in practice and thus
    topics that are dealt with to some degree in the following two books. I will look
    at the program in relation to the following 5 headings:


    1.  Maintenance friendly

    2.  Attractive user interfaces

    3.  Client side programming

    4.  Authentication and security

    5.  Distribueret programmering

