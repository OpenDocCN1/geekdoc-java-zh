    # 附录 B：HTTP


    在继续之前，我将对 HTTP 协议添加几点备注。正如描述过的，Web 应用由位于 Web 服务器上的许多文件（网页）组成。这些文件（网页、图像等）供客户端使用，客户端下载这些文件并在浏览器中显示它们。也就是说，客户端是一台带有浏览器的普通
    PC，而 Web 服务器是一台运行着名为 Web 服务器的程序（服务）的计算机（服务器）。Web 服务器持续在某个端口（例如 `8080`）上监听来自客户端的请求，在发生请求时（针对特定页面的请求），Web
    服务器将以 HTML 文档的形式发送响应到与客户端请求相关的地址。具体来说，客户端会在其浏览器中输入网页的地址，例如：


    `www.torus.dk`


    然后浏览器将使用 DNS 系统将该名称转换为 IP 地址，之后浏览器将通过端口（默认是 `80`）向服务器打开一个套接字。然后，Web 服务器就可以以 HTML
    的形式回复响应，浏览器随后可以解释并将其显示为网页。


    在服务器端，还会发生更多事情。在最简单的情况下，客户端是关于静态 HTML 页面的请求，如果是这样，服务器所做的只是从机器磁盘加载页面并将其发送到客户端浏览器。然而，在今天，它通常是一个动态网页——例如一个
    servlet，客户端对它的请求实际上是一个程序的请求。Web 服务器加载该应用程序并执行它。它通常会包含数据库操作，可能是因为应用程序需要数据库的数据，也可能是因为客户端在请求中发送了数据，这些数据必须存储在数据库中。在任何情况下，Web
    服务器执行的程序都会生成 HTML（其内容可能根据数据库的内容动态生成）并将此 HTML 发送给客户端。


    为了这种客户端/服务器架构能够工作，需要精确确定客户端请求和服务器响应格式的协议或规则，这就是 HTTP 出现场的地方，HTTP 是该协议的名称（协议是一组规则），它指示了客户端和服务器之间的通信应该如何进行。


    HTTP 代表 `HyperText Transfer Protocol`（超文本传输协议），是一种属于应用层的协议，通常实现在 `TCP / IP` 之上。它是一种无状态协议，如所述，它基于请求和响应，客户端应用程序向服务器发送请求，服务器用响应回复客户端。该协议是无状态的，意味着在服务器发送响应后，它忘记了关于客户端的所有信息。因此，服务器不存储任何关于客户端的信息，每当客户端请求服务器时，服务器都会将其视为新请求。HTTP
    协议因此是无状态的，这在 Web 应用方面带来了许多挑战，并且有几种技术可以应对这些挑战，我已经提到了 cookies 和 session 对象。当前版本的
    http 称为 `1.1`。


    URL 是指向互联网上特定资源（文件）的引用，通常具有以下格式：


    `http://Servernavn/Filenavn`


    URL 的示例可以是：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_207.jpg)


    在这里，`www.eadania.dk` 是服务器名，而 `education/it/index.xhtml` 是服务器上相对于服务器确定的目录的文件名。准确的
    URL 格式是：


    `http://Servernavn:port/Filenavn`


    其中 port 是 Web 服务器使用的 `port number`（端口号），但如果没有指定，浏览器将使用端口 `80`，这是互联网上的标准端口。


    在 HTTP 中，客户端请求和服务器响应由三部分组成：


    *   请求行或响应行

    *   头部信息（header）

    *   数据（data）


    一个 Web 事务包含：


    *   客户端请求

    *   服务器响应


    它由客户端通过在预定义的端口上与服务器建立连接来发起。如所述，默认是端口 `80`。客户端随后发送一个 HTTP 命令，后面跟着文档地址和所使用的协议版本。例如，可以是：


    `GET /index.htm HTTP/1.1`


    接下来发送头部信息，由若干行如下格式的内容组成：


    `Keyword: Value`


    其中每行都以回车符和换行符结束。例如，可以是：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_208.jpg)


    在头部信息之后发送一个空行，随后可能会跟随数据。与请求关联的命令也称为方法，有 7 种方法：


    | 方法 | 描述 |

    | --- | --- |

    | OPTIONS | 用于询问服务器提供哪些选项。 |

    | GET | 请求服务器返回指定的文档。 |

    | HEAD | 原则上类似于 GET，但服务器不返回文档的实际内容。用于测试自上次请求以来文档是否变化。 |

    | POST | 用于向服务器发送数据块。 |

    | PUT | GET 的相反命令，将数据块存储在文档地址上。 |

    | DELETE | 删除服务器上的文档。 |

    | TRACE | 用于跟踪请求通过不同防火墙和代理服务器的路径，用于调试复杂的网络问题。 |


    如所述，服务器的响应也由三部分组成。第一行格式为：


    `Protocol Statuscode Description`


    例如：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_209.jpg)


    然后，服务器头部包含有关服务器和正在发送文档的信息。头部由与请求相同的行组成，并以同样的方式空行结束。头部之后是数据块，可以是文档、程序的输出或错误消息。


    HTTP / 1.0 和 HTTP / 1.1 区别之一在于在 1.1 中，服务器完成响应后连接不会终止。原因是 HTML 文档包含了对其他文件（如图像等）的引用，因此客户端请求此类资源无需重新建立连接。


    HTTP 协议定义了许多头部，但最重要的如下，Q 代表请求而 S 代表响应：


    | 头部 | Q | S | 描述 |

    | --- | --- | --- | --- |

    | Accept: | x | | 指定客户端接受的类型。 |

    | Accept-Charset: | x | | 指定浏览器可以接受的字符集。 |

    | Accept-Encoding: | x | | 指定客户端知道的编码类型。如果省略此头部，客户端将接受所有编码。 |

    | Accept-Language: | x | | 指定客户端接受的语言。 |

    | Age: | | x | 与缓存控制结合。 |

    | Allow: | | x | 指定文档地址上的资源可以响应的方法。 |

    | Authorization: | x | | 与数字签名结合。 |

    '
