  raw: '![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_87.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_88.jpg)


    In this case, the element must have two attributes that are strings and are respectively
    called *master1* and *master2*. Both attributes have set methods, but otherwise
    the method *doTag()* defines how to render the item in the browser. In order for
    custom web elements to be used in the application, they must be registered in
    a *Tag Lidrary Description* file (which I previously used to define a function),
    and in this case, the content is as follows:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_881.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_89.jpg)


    Note that, as a short-name, I have used the letter *t*. The file defines a single
    element called *webmaster*, and in addition to the name of the class, you must
    define the element’s attributes, and in this case there are two. An attribute
    is defined by the name, and where it is required. The name *rtexprvalue* specifies
    whether the attribute must be initialized with a *${}* server value.


    With this custom item in place, the header can be defined as the following JSP
    page, called *header.jsp*:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_891.jpg)


    You should note that the tag library described above is defined by a directive,
    but otherwise you should notice that there is no body. It’s not a real JSP page,
    but some JSP that is intended to be inserted into another JSP page.


    One of the major challenges in web application development is the visual repræsentation
    and thus how the page is displayed in the browser. This is something that I will
    only touch on to a limited extent, but typically you define the details with styles.
    That is for each of the two TD elements above, there is defined a style that indicates
    font size and color. More generally, you can define styles in a style sheet, which
    is a document of styles that the application’s pages can apply. As part of this
    application, I have defined the following stylesheet:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_90.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_91.jpg)


    There are, of course, many syntactical details related to style sheets, but when
    you read the individual styles, they are easy enough to understand, and NetBeans
    knows style heets and also provides assistance to the individual styles. In practice,
    a style sheet can be very comprehensive and the whole idea is to move the definition
    of how the individual HTML elements should be displayed from the HTML and JSP
    documents. This means, on the one hand, that these documents become simpler and
    easier to understand, and partly that it is easier to maintain how websites appear,
    as you only has to modify the style sheet. The idea is that the HTML and JSP documents
    should only define the content, while style sheets defines how the content is
    rendered in the browser. A style sheet is thus a text document sent with the page,
    as the browser uses to render the document. A style sheet is not used on the server
    side.


    In this case, 9 styles are defined. The first three is very simple and defines
    the font for the body element (and thus the entire document) that as default should
    apply, and how wide a paragraph should be (such a text line does not necessarily
    fill the entire screen), and that a *li* element must have an upper margin of
    10\. The next two defines a so-called *class* that can be associated with specific
    elements. For example *header-class* that is used in the above header:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_92.jpg)


    The last three styles are more complex and define styles that can be used in a
    HTML table. I will return to them later. These styles are used by all documents
    that uses that style sheet. If you look at the code for the home page, you can
    see how how with a *link* element in the header yoy defines to use the style sheet
    in question:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_921.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_93.jpg)


    You should also note how the above header is inserted with a *jsp:include* element
    as the first line in the body section. You must note that it is on the server
    side and it is the server that is responsible for creating the completed document.
    In this application, all pages start with this header and it can help ensure that
    all pages in a web application get a common look and feel and it is easy to change
    as you can easily change the header. You should also note that, in principle,
    a JSP page may have all of the *jsp:include* items that may be desired and they
    may appear anywhere.


    If you click on the top link from the home page, you get the following browser:


    ![](image/Image34081.jpg)


    It should illustrate a simple login page. In this case, the user must enter his
    employee number and password and when the button is clicked, this information
    will be sent to the server. If the user only enter a password (there is no employee
    number), it is perceived as creating a new employee, and otherwise it means that
    you can edit the employee information. For practical use, it may not be appropriate,
    but I do not want to make the application more extensive than necessary. The page
    is of course basically a form and, in principle, it is a very simple page, which
    simply consists in sending a form to the server, but there are nevertheless one
    having challenges to be resolved.


    When the form is sent to the server, the server must validate if the entered data
    is legal. In this case, the employee number must be a 4-digit integer (automatically
    assigned by the database server) and there must be a password. If the employee
    number is blank, the server must create a new employee and assign it to an auto
    generated number. If an employee number has been entered, the server must validate
    the number and, if it is legal, the server must check if the database has an employee
    with that number and password and, if necessary, load the employee’s data. If
    the form’s data is illegal, the program must return to the login with an error
    message and the form fields must retains there content so that the user can edit
    the content. If data can be accepted, the server instead has to go to the editing
    page so that the user can edit the data in question.


    All that requires some Java code, and I want to start with a simple bean that
    can represent data to the login page:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_95.jpg)


    There is not much to explain, but you should notice that there is an additional
    property that I have called *error* and it is used to send an error message back.
    Then, the JSP page can be written as follows:


    ![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_96.jpg)![](image/Java_11_-_Web_applications_and_Java_EE_6-11-17_97.jpg)


    Note that line 2 refers to an error page. In principle, you should never come
    to this page because the server validates data, but you will be sent to the error
    page in case of one or more serious errors, and that is, when an exception occurs.
    Also note how the above *LoginBean* is applied and how its properties are linked
    to the input fields as well as to a *div* element at the end of the document.
    It is used to show a possible error message. Please note that the scope of the
    particular bean is a session. That is that the value of objects is preserved throughout
    the session. Finally, you should note that the page only reads the bean object,
    but does not update it. Otherwise, you may notice that the page uses the style
    sheet, and that one input field has the type password. It simply means that the
    user’s entries are not displayed as text.'
