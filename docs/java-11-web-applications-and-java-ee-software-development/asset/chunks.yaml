    | 头部 | | | 说明 |

    | :--- | :--- | :--- | :--- |

    | `Cache-Control` | x | x | 代理服务器使用，描述如何处理请求和响应。 |

    | `Code` | x | | | 定义数据块的编码。标准是 `Base64`。 |

    | `Content-Base` | | x | 用于解决返回文档中的相对 URL。此标头部会覆盖 `Content-Location`。 |

    | `Content-Encodning` | | | x | 表示在传输之前应用于文档的编码。 |

    | `Content-Language` | | | x | 表示内容的自然语言。 |

    | `Content-Length` | | | x | 数据块的字节长度。 |

    | `Content-Location` | | | x | 指定所发送文档的位置。 |

    | `Content-MD5` | | | x | 用于数据块的校验和。 |

    | `Content-Type` | | | x | 指定所发送的数据类型。 |

    | `Expires` | | | x | 指定数据被认为过期的日期。 |

    | `From` | x | | | 客户端的电子邮件地址。 |

    | `Host` | x | | | 来自 URL 的主机名。 |

    | `Last-Modified` | | | x | 指定上一次发送的文档更改的位置。 |

    | `Location` | | | x | 用于重定向到另一个地址，例如在发生错误时。 |

    | `Referrer` | x | | | 当前请求的来源。 |

    | `User-Agent` | x | | | 浏览器签名，用于测试请求来自哪个浏览器。 |

    | `Warning` | | | x | 用于与响应相关的额外信息。 |


    如上所述，HTTP 定义了七种方法，其中 `GET` 和 `POST` 是最重要的。`GET` 是最简单的，它仅包含向服务器发送请求，要求其根据给定的文档地址发送一个文档。这意味着
    `GET` 连接中没有数据块。`GET` 所指的文档可能是一个程序——例如 `servlet`——你可以将数据传输到此类程序。这发生在 URL 的一部分中：


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_211.jpg)


    你会在浏览器的地址栏中输入


    ![](img/Java_11_-_Web_applications_and_Java_EE_6-11-17_2111.jpg)


    这里有两个数据元素被传输到页面 `index.xphtml`。文档地址后的问号表示以成对的形式发送参数


    `keyword=value`


    如果发送了更多参数，每对参数之间必须用 `&` 隔开。


    `POST` 则不同，数据被封装在数据块中，该方法用于向服务器发送更大、更复杂规模的数据。使用 `POST` 时，可以在同一次请求中包含不同类型的数据，并可向服务器发送二进制数据。`GET`
    和 `POST` 之间的另一个重要区别是，当 `GET` 数据被添加到 URL 时，用户在浏览器的地址栏中也能看到它们，这并不总是所希望的。`POST` 方法则不然。此外，应该注意的是，服务器对
    URL 的长度可能有限制，从而限制了通过 `GET` 可以发送的数据量。


