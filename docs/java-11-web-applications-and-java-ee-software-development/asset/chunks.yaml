    客户端通常是一个带有浏览器的普通工作站。浏览器与任何其他 PC 程序类似的程序，但通过浏览器，用户可以在浏览器的地址栏中输入 Web 地址向 Web 服务器发送
    `request`（请求）。Web 服务器也是运行在某处机器上的程序。它是一个持续运行并监听请求的程序。`request` 意味着客户端浏览器想要返回一个
    HTML 文档，然后 Web 服务器将加载该文档并将其作为 `response`（响应）发送给客户端浏览器。一旦客户端获取文档，浏览器就会对其进行渲染并显示在屏幕上。这意味着浏览器会解释
    HTML 代码，并根据代码决定文档在屏幕上的呈现方式。


    这至少是基本原理，而且它在 `World Wide Web`（万维网）之初就是这样运行的，但今天情况要复杂得多。请求不仅关于返回一个 HTML 文档，通常还会随请求发送数据（这些数据可能是关于要添加到购物车的项目的数据），还可能包含给服务器以查找特定数据的信息（例如根据搜索标准查找商品）。这意味着服务器必须执行许多其他工作，例如，在数据库中保存数据、从数据库中检索数据并动态构建发送给客户端的响应。换句话说，在客户端请求的基础上，Web
    服务器必须执行软件程序，这些程序基本上像任何其他程序一样被开发和执行，但它们仅是运行在托管 Web 服务器的机器上的程序。


    因此， Web 应用的特征是：程序代码在服务器上执行，然后以动态生成的 HTML 文档的形式将结果返回给客户端。然而，`client-side`（客户端侧）程序也可以包含由浏览器执行的代码。有几种选项，但最重要的是
    `JavaScript`，它是脚本代码（仅仅是文本），作为 HTML 文档的一部分被发送。当然，这要求浏览器能够解释并执行 `JavaScript` 代码，但所有现代浏览器都能胜任。另一个选项是向浏览器发送实际翻译后的代码，例如用相同方式编写并翻译的
    `Java applet`，其编写和翻译方式与 `Swing` 程序完全相同。人们可以将 `Java applet` 认为是运行在浏览器窗口中的 Java
    应用程序。当然，这要求浏览器支持 Java applet 的执行，并且通常需要为浏览器安装插件（扩展程序）。然而，由于 Java applet 被翻译成二进制代码并在客户端机器上下载和执行，这种技术涉及了许多人感到不悦的安全风险。因此，Web
    应用可以同时包含在服务器端执行的代码和在客户端执行的代码，但代码的大部分是服务器代码。因此，它们被称为用于 `client-server`（客户端-服务器）应用程序。


    如上所述，Web 应用构建在网络流量之上，每当用户发出请求时，在获得响应之前存在延迟。因此，Web 应用的运行方式与传统的桌面应用程序不同。尽管如此，以前由运行在特定客户端机器上的程序解决的许多任务现在由
    Web 应用接管。原因有几个。最重要的一显而易见的优势是无论你位于何处都可以访问数据，不需要在用户的机器上安装程序。然后是延迟带来的影响，但它与以前不同了，一方面是因为我们今天的互联网速度比以前快得多，另一方面是因为我们已经习惯了
    Web 应用的这种工作方式。最后，在技术上，已经采取了措施来确保延迟不会那么明显，主要通过确保发送的数据不少于所需。可以说，Web 应用一直的目标一直是让它在用户看来就像安装在用户计算机上的普通程序一样。


    本书的目标是展示如何用 Java 开发 Web 应用。然而，这需要对 HTML 有适度的了解，我不想涉及这一点，尽管你可能还没有具备这些基础，但可能也能跟上示例的开发过程，因为我使用的示例相对较小，而且开发工具（`NetBeans`）提供了很好的帮助。


    最后，应该提到的是，Web 应用并不是万能解决方案，仍然有一些程序应该开发为经典的 PC 应用，主要是因为它们无法接受上述延迟。现在，常见的 PC 应用也可以通过
    Internet 与服务器通信，从而成为企业级应用的一部分，但这需要另一种技术，我在后续的书中会提到。还应该提到，如今手机等手持计算机起着非常重要的作用，并再次为程序员设定了新要求，这个主题在
    `Java 15` 一书中会有涉及。


    ## 1.1 开发工具


    为了开发和测试 Web 应用，你必须有一个 Web 服务器。有很多选项，但在这种情况下，我需要一个支持 Java 开发的 Web 应用的 Web 服务器。到为止，所有程序都是使用
    `NetBeans` 编写的，当你下载该产品时，可以从几个包中选择：


    ![](img/Image33739.jpg)


    到为止，我一直第一个，但现在我 `Java EE`，它代表 `Java Enterprise Edition`（Java 企业版）。它通过 `Java EE`
    进行扩展，包含了许多用于企业级应用（包括 Web 应用）的开发工具，以及支持使用 `HTML5` 开发 Web 应用的 `HTML5`。最后，包含了两个 Web
    服务器。区别在于，后者是一个支持 Java Web 应用的通用 Web 服务器，对于本文来说足够了，但它不是应用服务器。那是 `GlassFish` 服务器，由于它是后续书籍必要的，我将处处使用它。两个服务器都包含了，但你可以决定是否安装两个（除非你想尝试
    `Tomcat`）。


    当你下载带有 `Java EE` 的 `NetBeans` 组合包时，你会得到一个自解脚本，通常安装 `Java EE` 和 `GlassFish` 很容易，但书中有一个附录显示了如何操作。


    # 2 Servlet


    Web 应用的基本概念是 Servlet，它是一个以 HTML 形式向客户端生成的 Java 类。由于它是普通的 Java 类，其方法在服务器上执行，因此它可以执行任何类可以执行的操作，例如从数据库读取数据。因此，Servlet
    可以动态生成取决于情况的 HTML 文档。实际上，在实践中很少直接查看这些 Servlet，因为你通常开发像 `JSP` 页面或 `Facelets`（后文介绍）这样的动态网站，但在两种情况下，页面都会转换成
    Servlet，所以本节关于什么是 Servlet，以及如何使用 `NetBeans` 编写 Servlet。在打开 `NetBeans` 后，选择 `File
    | New Project`：


    ![](img/Image33748.jpg)


    但这次，`Categories` 必须是 `Java Web`，而 `Projects` 应该是 `Web Application`。点击 `Next` 后，你会进入熟悉的窗口，需要在其中输入项目名称并选择创建项目的文件夹。我将项目命名为
    `TimeServer`。点击 `Next` 后，你会看到一个选择托管应用程序服务器的窗口：


    ![](img/Image33756.jpg)

