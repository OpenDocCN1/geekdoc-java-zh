    # Asynchronous messaging


    Asynchronous messaging is a pattern that allows services within a microservices
    architecture to interact without waiting for a response, thus decoupling their
    execution and promoting scalability and responsiveness. In contrast to synchronous
    communication, where the calling service must wait for a response before proceeding,
    asynchronous messaging enables services to continue their tasks independently.


    Asynchronous messaging can be categorized into point-to-point communication, which
    typically utilizes queues for managing message exchanges between two services,
    and publish/subscribe communication, which leverages topics to broadcast messages
    to multiple subscribers.


    Messaging and event-driven microservices architectural styles require asynchronous
    messaging. They tend to differentiate messaging by their types (commands, events,
    notifications, and callbacks) and use them in different communication scenarios.
    For more information, see Chapter 2, Communication Styles.'
  merge: -1
