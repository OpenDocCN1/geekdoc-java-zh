    (Figure 2.15):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_95_0.png)


    # Figure 2.15: Perimeter-based security model


    A surface area must include the perimeter of a deployed system and the code, binary
    repositories, and delivery pipeline to ensure that all system developed internally
