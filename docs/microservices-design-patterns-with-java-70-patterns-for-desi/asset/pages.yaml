    # HTTP/REST


    The HTTP/REST protocol, widely used for internal microservices communication,
    is the primary standard for external APIs. Its dominance in web development emphasizes
    its intuitive and standardized nature, ensuring consistency for API developers
    and consumers. Adhering strictly to REST is crucial for external APIs, emphasizing
    uniformity and predictability.


    REST architecture revolves around treating entities as resources, each uniquely
    identifiable through a **Uniform Resource Locator (URL)**. This principle keeps
    your API organized and intuitive. For instance, a user resource could have a URL
    like /users for a collection of users or /users/123 for a specific user with ID
    123.


    Every RESTful service is built upon the foundation of standard HTTP verbs. These
    verbs indicate the type of action you wish to perform on a resource:


    +   - **GET**: Fetch data from a specified resource.


    +   - **POST**: Add a new resource.


    +   - **PUT/PATCH**: Update an existing resource. While PUT typically updates
    the whole resource, PATCH modifies only specific parts.'
  merge: -1
