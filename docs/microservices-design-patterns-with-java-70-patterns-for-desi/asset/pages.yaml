  md: '+   * Where: Depending on the phase of development and the specific testing
    objectives, tests may be run in varied environments like development, continuous
    integration (CI) pipelines, staging platforms, or even production settings.


    +   * When: Tests can be categorized based on their timing and purpose:


    +   ○ Smoke tests: These are initial checks performed to ensure that basic functionalities
    of the software are working correctly and that the system is stable enough for
    further testing.


    +   ○ Regression tests: These tests are conducted to verify that bug fixes or
    new enhancements have not caused unintended side effects or regressions in previously
    working parts of the software.


    +   ○ Alpha and beta tests: Alpha tests are conducted internally by the development
    team to identify and fix any issues before releasing the software to a limited
    group of external users (beta testers) who provide feedback on usability, performance,
    and functionality before the official release.


    +   ○ Acceptance tests: These tests are aimed at validating that the software
    meets the specified requirements and is ready for deployment, typically involving
    stakeholders or end-users to ensure that the software aligns with their expectations
    and needs.


    +   * How: Testing is based on methodologies, tools, and frameworks:


    +   ○ Methodologies: The strategic approach to testing, which could be manual,
