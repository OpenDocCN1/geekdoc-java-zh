    +   **Asynchronous execution:** In this model, the business logic is executed
    in separate threads, while the original request thread awaits responses. This
    approach can handle more concurrent requests than synchronous execution but often
    leads to increased complexity in managing asynchronous workflows and handling
    potential errors or timeouts.


    Both synchronous and asynchronous immediate executions, while effective in simpler
    scenarios, struggle under heavy load conditions. Large volumes of concurrent requests
    can lead to system overload, resulting in significant spikes in system responsiveness
    but also increases the likelihood of transaction failures due to timeouts. Also,
    this method is not suitable for long-running transactions, as the request can
