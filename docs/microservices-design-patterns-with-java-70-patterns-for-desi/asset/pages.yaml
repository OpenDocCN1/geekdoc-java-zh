  md: '# # CHAPTER 1

    Defining Product Vision and Organization Structure


    # ## Introduction


    In recent years, there has been a significant rise in the adoption of microservices.
    An increasing number of software teams are currently either engaged in developing
    microservices or considering them. Numerous publications on the subject offer
    various patterns, and multiple technologies pledge to simplify microservice development.
    Nonetheless, eight out of ten organizations that have adopted microservices are
    encountering significant issues that prevent them from meeting their initial expectations.
    The sources of these problems are purely technical.


    The key to success in the development of microservice systems is understanding
    that microservices are not just an architectural style. A microservice is a software
    component with an independent lifecycle. It can be built by different teams, at
    different times, using different technologies, and delivered independently into
    production. Achieving that kind of independence requires not only technical decisions.
    It touches all areas of software development, including organization structure,
    product, and project management.'
  merge: -1
  pgno: 32
- img_proc: true
  md: "This chapter introduces you to patterns at the organization and product level\
    \ that help solve this problem by setting the right structure and direction to\
    \ ensure success in microservices development.\n\n# Structure\n\nIn this chapter,\
    \ we will cover the following topics:\n\n+   - Microservices Adoption Goals\n\
    \    - Scalability\n    - Productivity\n    - Time to Market\n    - Innovation\n\
    - Incremental Delivery\n- Development Model\n    - Agile Workshop\n    - Software\
    \ Factory\n- Organization Structure\n    - Feature Delivery Teams\n    - Platform\
    \ Teams\n    - Integration Team\n- Microservices Adoption Process\n- Antipatterns\n\
    \n# Objectives\n\nAfter studying this chapter, you should be able to set clear\
    \ goals for microservice adoption, define an appropriate organizational structure,\
    \ adopt an incremental delivery model, and assign clear roles and responsibilities\
    \ to your"
  merge: -1
