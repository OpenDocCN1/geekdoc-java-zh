  md: '# Blue/green deployment


    Blue/green deployment is a strategy designed to reduce downtime and risk by running
    two identical production environments named blue and green.


    At any time, only one of the environments is live, with the live environment serving
    all production traffic. For example, the blue environment is live initially, and
    the green environment is used to deploy the new version of the application (refer
    to Figure 14.6, where LB means load balancer):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_711_0.png)


    The process works as follows:


    +   * Initial setup: Start with two environments, the blue is the current production
    environment running the existing version of the application, while the green is
    idle.

    * New version deployment: Deploy the new version of the application in the green
    environment, ensuring all necessary databases and back-end systems are correctly
    linked.

    * Testing: Once the new version is deployed in the green environment, it undergoes
    thorough testing to ensure functionality and stability.


    Figure 14.6: System deployment using blue/green strategy'
  merge: -1
  pgno: 711
- img_proc: true
  md: '+   - Traffic shifting: Upon successful testing, the traffic is gradually shifted
    from the blue environment to the green environment, either all at once or incrementally,
    to monitor the performance and functionality in the real world.


    +   - Rollback plan: In case of any issues during the transition, a rollback plan
    is in place to quickly revert back to the blue environment, minimizing disruption.


    +   - Final transition: If no issues are detected, all traffic is completely redirected
    to the green environment, making it the new production environment.


    +   - Retiring the old environment: The Blue environment then becomes idle and
    can be updated to be used as a standby for the next update, restarting the cycle.


    When implementing the blue/green deployment strategy, special attention should
    be paid to data management to ensure continuity and integrity.


    There are primarily two approaches to handle this:


    +   - Database replication


    +   - Database sharing


    In the case of replication, the data is duplicated across both environments, providing
    an additional layer of isolation and reducing the risk of data corruption. On
    the other hand, sharing a database between environments necessitates meticulous
    schema management. It is crucial that the new deployment is capable of operating
    without altering the existing schema, preventing potential disruptions during
    the transition. This allows for a seamless shift of operations from the old to
    the new environment without jeopardizing data integrity and facilitating a smoother
    rollback, if necessary. Ultimately, the chosen approach should align with the'
