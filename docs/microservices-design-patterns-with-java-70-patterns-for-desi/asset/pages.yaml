    are granted directly to users or entities, allowing for more granular control.
    It can cater to complex scenarios but might become cumbersome to manage at scale.


    +   - **Attribute-based authorization**: Decisions are made based on attributes
    of the user, the resource being accessed, and other contextual factors. This dynamic
    method can be highly adaptive but also requires sophisticated logic.


    +   - **Policy-based authorization**: Defined policies, often in a declarative
    manner, dictate the access control. These policies can be comprehensive and context-aware
    and need regular updating and auditing.


