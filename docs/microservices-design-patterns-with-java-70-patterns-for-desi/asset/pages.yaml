    Following are the pros and cons:


    # Pros:


    +   - It allows multiple clients to read data simultaneously, reducing lock contention.

    - It ensures that one client does not inadvertently overwrite changes made by
    another client.

    - It eliminates the need for explicit lock management, reducing the overhead of
    acquiring and releasing locks.


    # Cons:


    +   - In high-contention scenarios, write conflicts can become common, and resolving
    these conflicts can add complexity.

    - Clients must be prepared to retry their updates when write conflicts occur,
    which can add overhead and complexity.

    - If a client reads data and another client updates the same data before the first
    client completes its operation, the first client will be working with stale data.


    # Distributed lock


    In the context of microservices, where services interact with shared resources,
    there arises a need to prevent concurrent access and maintain the consistency
    of data. The distributed lock pattern provides a solution to this need, facilitating
    exclusive access to a particular resource across multiple services.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'The pattern works by having a service request lock before using a shared resource.
    If the lock is available, the service is granted the lock, performs the necessary
    operations, and then releases the lock for other services to use. However, if
    the lock isn''t available, the service can either retry after some time or simply
    fail the operation, depending on the specific business requirements (refer to
    Figure 7.1).


    ![](img/b9fea7997a6c6746f4f9a853213ba905_356_0.png)


    **Figure 7.1:** Distributed locking of a shared resource


    However, it is crucial to mention the dangers of using global locks. Global locks,
    which lock down large segments or all the shared resources, can create significant
    contention and lead to scalability and performance issues. This is considered
    an anti-pattern in microservices architecture. Therefore, a lock''s scope should
    be minimized as much as possible, ideally related to a specific transaction or
    object.


    Moreover, the time period of a lock is equally significant. For real-time transactions,
    locks should be held for a very short duration to ensure high throughput. For
    long-running transactions, it is advisable to use asynchronous execution in the
    background to avoid holding the lock for an extended period.


    Distributed locks have to come with timeouts. A timeout mechanism helps automatically
    release the lock if the microservice that acquired the lock crashes or is unable
    to complete the operation within a specified timeframe.'
