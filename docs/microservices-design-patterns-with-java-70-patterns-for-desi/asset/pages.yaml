- img_proc: true
  md: 'Key concepts within SSL:


    +   * **Encryption**: At the heart of SSL is encryption. It ensures that data
    transmitted between two systems—such as a web user''s computer and a website''s
    server—is scrambled and indecipherable to any unauthorized parties who might intercept
    it. This is especially crucial when transmitting sensitive data, like personal
    information or financial details.


    +   * **Authentication**: SSL certificates, issued by certificate authorities
    (CAs), are used to authenticate the identity of a website. This means users can
    be confident they are communicating with a legitimate website and not a malicious
    impostor.


    +   * **Data integrity**: SSL ensures that the data sent between two parties is
    not tampered with during transmission. It uses cryptographic checksums to ensure
    the data''s integrity.


    +   * **Key exchange**: For encryption to work, both parties need a way to exchange
    cryptographic keys in a secure manner. SSL facilitates this through a process
    known as the **SSL handshake.**


    Before encrypted data can be exchanged between a client (for example, a browser)
    and a server, an SSL handshake must occur. This process involves:


    +   1. Negotiating the version of SSL/TLS to be used.


    +   2. Choosing the encryption ciphers.


    +   3. Exchanging cryptographic keys via asymmetric encryption.


    +   4. Once the handshake is completed, a secure connection is established, and
    data can be exchanged using symmetric encryption, which is faster.'
