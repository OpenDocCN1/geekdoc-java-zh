    # # Day 0 Configuration


    Development-time configuration, also known as Day 0 configuration, involves configuring
    parameters that can only be modified during the development phase. This may include
    settings like timeouts, retries, and test switches.


    Certain Day 0 configuration parameters can be set as hardcoded values, which are
    directly coded by developers and cannot be changed after the component''s release.
    However, there may be instances where configurations need to be altered during
    testing to enable certain testing hooks or flows in the code. These configurations
    can be either static or dynamic (See Static Configurations and Dynamic Configurations
    patterns below).


    It''s important to note that testing configurations and Day 1/Day 2 configurations
    may use similar mechanisms, which can lead to confusion and confuse deployment
    and support specialists to testing configurations. Moreover, changes made to production
    parameters can result in significant problems. Therefore, it''s recommended to
    implement test parameters with caution and keep them hidden in production whenever
    possible.


