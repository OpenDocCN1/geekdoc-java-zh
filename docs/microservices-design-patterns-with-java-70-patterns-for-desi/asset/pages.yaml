    # Compensating transaction


    The compensating transaction pattern (or simply compensation) is a crucial mechanism
    for managing failures in the saga patterns, be it orchestrated or choreographed.'
  merge: -1
  pgno: 379
- img_proc: true
  md: 'This pattern is centered on the idea that for each operation that modifies
    the data, there should be a corresponding compensating operation that can undo
    the changes made by the initial operation. The compensating transaction is designed
    to leave the system in a consistent state without violating business rules (refer
    to Figure 7.9):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_380_0.png)


    **Figure 7.9: Compensating transaction**


    In the context of a saga, if an operation fails during the execution of a transaction,
    a series of compensating transactions are invoked to rollback the changes made
    by the previous operations in the transaction. The compensating transactions are
    executed in the reverse order of the operations.


    Let us reconsider our e-commerce example. Suppose the payment service successfully
    charges the customer''s card, but the delivery service later fails to initiate
    the delivery process. In such a scenario, the compensating transactions would
    be as follows:


    +   - The delivery service, upon encountering a failure, would emit a ''DeliveryFailed''
    event.

    - The payment service, listening to this event, would initiate its compensating
    transaction, which could involve refunding the charged amount to the customer''s
    card and emit a ''PaymentRefunded'' event.'
  merge: -1
  pgno: 380
- img_proc: true
  md: '+   - Finally, the order service, on receiving the ''PaymentRefunded'' event,
    would execute its own compensating transaction, possibly involving unreserving
    the product.


    This way, the system is returned to a consistent state. It is important to note
    that these compensating transactions should be idempotent to ensure the system''s
    consistency, regardless of how many times they are executed.


    # # Workflow


    Implementing distributed transactions using the saga pattern can be a complex
    task, with challenges ranging from orchestrating communication between services,
    handling failures, and managing transaction state, to ensuring data consistency.
    However, such a process is often systematic and can be represented as a state
    machine, making the use of a workflow engine a fitting solution. Instead of implementing
    a saga orchestration logic from scratch, developers can employ a workflow engine
    or a complete workflow service (as shown in Figure 7.10):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_381_0.png)


