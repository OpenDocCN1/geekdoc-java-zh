  md: '# Deployment-time composition


    Deployment-time composition refers to a situation where a microservice is deployed
    in different environments and needs to adjust its implementation accordingly.


    # Problem


    A typical scenario includes a microservice that needs to opt for a persistence
    implementation that suits the connected database, select suitable message queues,
    loggers, and performance counters, and also enable or disable external interfaces
    as required by the environment.


    # Solution


    The first step to enable deployment-time composition is implementing a microservice
    using well-defined, loosely coupled components. A typical microservice may include
    the following types of components:


    +   * Repositories to store and retrieve persistent data

    * Services that implement microservice business logic

    * Controllers that expose call interfaces to microservice consumers

    * Data objects (or DTOs) to define data that is handled by the microservice

    * Message queues for asynchronous messaging

    * Clients to communicate with other microservices

    * Distributed locks to handle concurrency

    * Loggers, Traces, and Performance Counters for observability


