    # Tenancy


    Software vendors that offer complex business systems using the SaaS model get
    to choose between simpler systems built for a single client and deployed multiple
    times or a single system designed to handle multiple clients simultaneously.


    # Problem


    Business systems built for organizations with many users require significant computing
    power and ample data storage, and historically were deployed for each client.
    However, as many software vendors migrate to the cloud and offer SaaS solutions,
    traditional single-client deployments require too much effort and may raise infrastructure
    costs, reducing vendor profits, increasing prices for customers, and thus, making
    products less competitive.


    # Single-tenancy


    Traditional single-tenant architecture, also called isolated tenancy, provides
    each customer or tenant with a dedicated instance of the software system, including
    its infrastructure, data storage, and processing resources. Each tenant''s data'
