    # # Non-functional testing


    Non-functional testing ensures not just *what* the software does, but *how* it
    accomplishes tasks. With the distributed nature of microservices, they inherently
    face challenges related to performance and integrity. Overlooking these aspects
    can escalate into significant development roadblocks down the line. Thus, proactive
    non-functional testing, especially focusing on performance and system integrity,
    becomes indispensable in building robust microservices architectures.


    # # Problem


    Microservices often require rigorous non-functional testing to ensure their robustness
    and reliability in diverse scenarios. Conducting these tests in a production-like
    environment under realistic loads is paramount for accurate validation. Commonly
    validated non-functional requirements in microservices include:


    +   - **Performance**: This gauges the system''s response times and throughput.
    Targets are typically defined by benchmarking against industry standards or historical
    data. Tests measure response times of various service endpoints under defined
    load conditions.


    +   - **Capacity**: This assesses the maximum workload a system can handle. Targets
    might be based on expected user counts or transaction volumes. Tests these volumes
    to check if the system can handle them without degradation in performance.


    +   - **Availability**: Refers to the system''s uptime. Targets, often expressed
    as percentages (for example, 99.9% uptime), represent the system''s operational
    availability. Tests typically involve monitoring tools to track system uptime
    over periods.'
  merge: -1
  pgno: 558
- img_proc: true
  md: '+   - **Scalability**: Examines how well the system handles increased demands.
    Targets are set by projecting expected growth rates in user or transaction volumes.
    Tests involve ramping up loads to see how the system responds and if it can scale
    up (or down) efficiently.


    +   - **Reliability**: This gauges consistent system functionality over time.
    Targets might be set for acceptable error rates or uptime ratios. Tests typically
    monitor system operations over extended durations to capture any failures or interruptions.


    +   - **Security**: Ensures protection against unauthorized access and threats.
    Targets are defined by industry standards or specific organizational security
    policies. Tests include penetration testing, vulnerability scanning, and other
    security assessments.


    +   - **Latency**: Represents the delay before a data transfer starts after an
    instruction. Targets are often defined by application needs (for example, a maximum
    of 50ms for a particular service). Tests measure the actual delay times in data
    processing or transmission.


    For each of these characteristics, non-functional tests aim to validate if the
    set targets are consistently met, ensuring the microservice''s efficiency and
    reliability in real-world conditions. Performing these tests in an environment
    that mirrors production settings ensures that any findings are immediately relevant
    and actionable.


    # Benchmark


    Benchmarks are specialized software routines designed to evaluate the performance
    and responsiveness of a system under various conditions. Their purpose is to mimic
    real-world requests, thereby allowing testers to obtain an analytical view of
    the system''s capabilities (refer to Figure 11.8):'
  merge: -1
  pgno: 559
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_560_0.png)


    # Figure 11.8: Non-functional testing using Benchmarks


    Benchmarks typically do three things:


    +   - Create a diverse range of requests that mirror typical user interactions.

    - Execute a specific business transaction based on the generated request.

    - Analyze the system''s response to ensure it is accurate and meets expectations.


    When incorporated into a benchmarking framework or tool, these routines can be
    executed systematically to obtain quantitative data on system performance. The
    framework typically provides:


    +   - **Rate control**: Executes benchmarks at a predefined rate or pushes the
    system to its limit.

    - **Concurrency**: Runs multiple benchmark threads simultaneously, simulating
    real-world concurrent requests.

    - **Duration control**: Dictates how long the benchmarks should run, ensuring
    consistent testing periods.

    - **Metrics collection**: Gathers data on key performance indicators such as response
    times, error rates, and throughput.


    It is possible to use benchmarks to test various non-functional characteristics
    by running them in different scenarios:


    +   - Performance testing: The system is tested for response times at peak request
    rates. The observed times are then compared against target benchmarks.'
  merge: -1
  pgno: 560
- img_proc: true
  md: '+   ** Volume testing:** The environment is primed to expected conditions,
    and benchmarks are executed at anticipated request volumes. The goal is to ensure
    response times remain within acceptable limits.


    +   ** Stress testing:** The system is pushed to its breaking point by running
    maximum benchmarks. The peak performance level before system failure is recorded.


    +   ** Scalability testing:** By altering the environment''s configuration, one
    can assess how resource changes (like additional servers) affect system performance.


    +   ** Reliability testing:** Benchmarks are run at expected rates over extended
    durations to determine if the system maintains a low error rate over time.


    +   ** Availability testing:** Similar to reliability, but the focus is on measuring
    the duration between system failures or downtimes.


    Non-functional testing is most effective in environments similar to real-world
    production. It is important to mimic real challenges. Having the actual amount
    of data and handling user requests at once. Testing in such helps benchmarks give
    a true picture of how the system will perform. This approach finds problems that
    might be missed in a more controlled setting, ensuring the system is truly ready
    for real use.


    Benchmarks can be executed at both the component level (like a class or microservice)
    and the system level. While developers often run performance benchmarks at the
    component level to fine-tune their code, the majority of benchmarking is typically
    carried out at the system level to gauge meeting non-functional requirements.


    There are a number of tools that allow to perform various types of benchmarking
    as well as focus on specific types of non-functional testing:


