    # Session tracking


    Session tracking authorization, commonly used in web apps, manages user access
    during an active session. This technique, linked to stateful web apps, also matters
    in microservices, balancing statefulness and statelessness.


    In systems, a key challenge is preserving a user''s state across stateless HTTP
    requests. Session tracking authorization tackles this by creating a session post-login,
    housing user-specific data (identity, roles, permissions). It is'
