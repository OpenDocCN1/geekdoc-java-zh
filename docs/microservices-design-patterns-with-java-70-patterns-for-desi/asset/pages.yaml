    # Configuration types


    Configurations cannot be generalized as a single process. They must be implemented
    for various parts of a system at different stages of the lifecycle and may necessitate
    different tools and techniques. To address this complex subject, we will learn
    how to categorize configurations into a few major groups and establish a structure
    for them.


    # Problem


    Microservices systems are usually vast and consist of numerous moving parts, ranging
    from tens to even hundreds. Consequently, extensive, and complex configurations
    are usually necessary to ensure that these components work cohesively. Additionally,
    managing deployment and operational processes within such a structure can become
    overly complicated, leading to lengthy and error-prone procedures.


    # Solution


    To simplify the process, configurations can be categorized in various ways. One
    common approach is to divide them into Day 0 (development-time), Day 1 (deployment-time),
    and Day 2 (run-time) configurations, as depicted in Figure 4.1:'
