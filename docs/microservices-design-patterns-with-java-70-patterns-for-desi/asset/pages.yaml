  md: '# Problem


    Designing an effective database architecture for microservices is a complex task.
    Traditional approaches like the Shared Database pattern often fall short, primarily
    due to their inherent service coupling and lack of isolation, rendering it an
    anti-pattern in this context.


    The focus should instead shift towards more appropriate and robust database architecture
    patterns such as the Database per Service and Database Sharding patterns. The
    Database per Service pattern offers an effective way to maintain service autonomy,
    a principle at the heart of microservices. Each service has its own exclusive
    database, reinforcing isolation and reducing dependencies. However, as the data
    and demand grow, the need for a scalable solution becomes evident.


    This is where Database Sharding comes into play. Sharding allows data to be distributed
    across multiple databases, improving the system''s ability to scale horizontally
    while also enhancing performance. The challenge lies in implementing these patterns
    effectively and understanding the trade-offs involved to make informed decisions
    that suit specific system requirements.


    # Database per service


    The database per service pattern is one of the most widely adopted database patterns
    in the realm of microservices, ensuring that each microservice has its dedicated
    database. This pattern stands in direct contrast to the shared database pattern,
    eliminating issues associated with service coupling and lack of fault isolation.


    The main principle behind the database per service pattern is to maintain service
    autonomy. Each service owns its own database, making it the only entity that can
    access and modify the data in it. This practice encapsulates the data'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'within each service, fostering a higher degree of data integrity and isolation
    (refer to Figure 6.5):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_321_0.png)


    **Figure 6.5:** Database per Service


    The benefits are significant. First, it avoids the problem of schema evolution
    in shared databases, as each service has the liberty to manage and update its
    schema independently. Second, it enforces the boundaries between services, reducing
    the risk of cascading failures. Third, it allows each service to use the type
    of database that is best suited to its needs, paving the way for polyglot persistence.


    However, this pattern introduce new challenges, including managing data consistency
    across services and implementing complex queries that span multiple services.
    It also raises questions about how to handle joint operations that involve multiple
    services, which leads to the concept of distributed transactions and the eventual
    consistency model.


    Following are the pros and cons of Database per Service:


    # Pros:


    +   - Independence in schema evolution and development.

    - Strict control over individual service data.

    - Faults are limited to affected services, increasing system resilience.'
  merge: -1
