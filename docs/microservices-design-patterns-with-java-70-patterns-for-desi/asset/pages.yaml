    # Development/DevOps delineation


    A shift in roles is proposed to address inefficiencies and reduce cognitive load.
    Here, developers handle coding, testing, packaging, and building of individual
    components, while DevOps engineers focus on integrating these components into
    the delivery pipeline and creating a cohesive system. This new approach streamlines
    development, promoting a more efficient workflow.


    # Problem


    In today''s software development, defining roles between developers and DevOps
    engineers can be unclear. Traditionally, developers start by writing code, and
    DevOps engineers automate build processes. However, developers often step in to
    build the system, a process mirrored by DevOps engineers who script the deployments
    (refer to Figure 13.6):'
  merge: -1
  pgno: 636
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_637_0.png)


    **Figure 13.6:** Traditional interactions between developers and DevOps


    The circular responsibility flow forces developers and DevOps engineers have extensive
    knowledge of the entire system. DevOps engineers must intimately understand individual
    components for proper integration and building. This complexity arises because
    code changes in components may affect build processes, leading to frequent interactions
    between the roles.


    The iterative interaction often leads to miscommunication and friction, hindering
    development progress. Both parties needing broad and deep knowledge increases
    cognitive load, raising the risk of errors and misunderstandings, and affecting
    efficiency. To tackle this, a revaluation and potential restructuring of traditional
    roles are needed for a more collaborative and efficient workflow.


    # # Solution


    To address friction and communication barriers, roles will be redefined. Developers
    will expand their responsibilities to include overseeing individual components
    comprehensively. This involves developing, testing, packaging, and automating
    the build processes. Focusing on specific elements allows them to become experts
    in their domains, gaining deep expertise in both the component and its dependencies.


    Conversely, DevOps engineers will pivot toward a broader but less detailed oversight
    of the entire system. They manage the delivery pipeline, orchestrating the integration'
