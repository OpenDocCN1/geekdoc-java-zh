    # Error propagation


    The error propagation pattern allows to carry meaningful error information up
    the call chain, thus reducing the time and complexity involved in troubleshooting
    and ensuring quick problem resolution. This fosters a resilient microservices
    environment where system issues are promptly identified and addressed, leading
    to improved system uptime and user satisfaction.


    # Problem


    In microservices, spanning transactions can lead to generic errors without detailed
    information, making diagnosis and resolution time-consuming. Handling errors is
    further complicated by diverse microservices implemented in different languages,
    where exceptions may not be easily interpreted across services.


    # Solution


    The error propagation pattern conveys meaningful error information from the originating
    service to invoking services and the client application. It ensures effective
    communication of errors throughout the request chain, allowing upstream services
    and client applications to handle exceptions appropriately, refer to Figure 9.2:'
  merge: -1
  pgno: 471
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_472_0.png)


    # Figure 9.2: Error propagation through a chain of calls in microservices


    Here is a breakdown of the pattern:


    +   - **Capture original error**: When an error or an exception occurs in a microservice,
    it should be captured immediately at the point of failure.

    - **Create an error object**: The captured error or exception is wrapped into
    a standardized error object, like ApplicationException, which includes essential
    details such as the error message, stack trace, error type, trace ID, and relevant
    data.

    - **Propagate error**: The error object is propagated upstream to the calling
    service or client application, serialized in a universally understandable format
    like JSON, enabling communication between microservices to be implemented in different
    languages.

    - **Deserialize and handle error**: The calling service or client application
    deserializes the error object, extracts the error information, and handles the
    error appropriately.


    To handle and propagate errors in microservices, capturing and wrapping them in
    a specialized exception is crucial. This encapsulation facilitates the transfer
    of error information'
