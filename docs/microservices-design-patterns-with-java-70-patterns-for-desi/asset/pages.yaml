    The problem of secure software delivery revolves around identifying and mitigating
    potential attack vectors that can occur during the software delivery process.
    These vectors can include:


    +   - **Committing malicious code into a version control system:** This can happen
    when unauthorized users gain access to the version control system, introducing
    harmful code that can later be integrated into the final product.


    +   - **Injecting malicious code via compromised external dependencies:** External
    dependencies, often necessary for the software, can be tampered with, thereby
    serving as a channel to introduce malicious code into the software.


    +   - **Modifying the build process:** During the build process, attackers can
    infiltrate and alter the steps involved, potentially introducing vulnerabilities
    or backdoors into the software.


    +   - **Overriding released artifacts:** After the build process, during the release
    stage, attackers can potentially replace or override the genuine artifacts'
