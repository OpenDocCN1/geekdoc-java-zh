    # Code repositories


    Structuring the microservices codebase starts at the repository level. A proper
    structure must allow for clearly identifying every component in the codebase,
    its type, purpose, and ownership. The high-level breakdown must be clear not only
    to the developers who spent months working with that code but also to any newcomer
    or manager without development experience.


    # Problem


    Source code is valuable and costly to produce. It is a crucial part of a company’s
