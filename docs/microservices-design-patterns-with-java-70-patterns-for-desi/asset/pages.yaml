  md: '# Following are the pros and cons of Versioned Channels Pattern:


    # Pros:


    +   - Simpler microservice implementation with clean code separation between versions

    - Easier to add retroactively


    # Cons:


    +   - Higher deployment complexity caused by increased number of end points

    - Bigger surface area that may cause security issues


    # Versioned routing


    In an alternative approach the microservice receives requests from all old and
    new consumers on the same channel (endpoint or queue), but uses an internal routing
    mechanism to separate versions using version information included into routes
    or messages (see Figure 5.6):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_225_0.png)


    **Figure 5.6:** API versions on shared TCP port or message queue, separated by
    versioned routes/messages.'
