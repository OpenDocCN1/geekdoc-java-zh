  md: 'pattern or the Two-Phase Commit (2PC), among others. The chosen patterns should
    be implemented with care, considering the context and specific requirements of
    the architecture.


    # Orchestrated Saga


    The orchestrated saga pattern is a common approach to handling transactions in
    a microservices architecture, particularly in traditional systems that rely heavily
    on synchronous calls.


    In this pattern, a single orchestrator service (also known as a Saga Orchestrator)
    is responsible for managing the execution of the entire transaction. The orchestrator
    initiates and monitors each step of the transaction, making requests for the appropriate
    services and managing responses (refer to Figure 7.7):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_373_0.png)


    Figure 7.7: Orchestrated Saga


    The responsibilities of the saga orchestrator include:


    +   - **Defining the transaction steps:** The orchestrator defines the sequence
    of steps that make up the'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'transaction.


    +   **Service coordination**: It coordinates and initiates calls to the various
    microservices involved in the transaction.


    +   **State management**: It maintains the state of the transaction, keeping track
    of which steps have been completed and which are pending.


    +   **Failure management**: In case of a failure in any of the steps, the orchestrator
    is responsible for handling it, which could involve initiating compensating transactions,
    or rolling back the entire operation.


    The orchestrated saga pattern is particularly useful for managing long-running
    transactions, which might involve multiple steps that occur over a long period
    of time. The orchestrator maintains the transaction state, allowing the overall
    operation to be paused and resumed as needed.


    Consider an example of an e-commerce platform. When a customer places an order,
    several steps need to occur in sequence:


    +   1. Check inventory to ensure the product is available.


    +   2. Reserve the product to prevent it from being sold to another customer.


    +   3. Charge the customer''s credit card.


    +   4. Initiate the delivery process.


    In this case, the Saga Orchestrator would be responsible for initiating each step,
    keeping track of the progress, and handling any failures. If the credit card charge
    fails, the orchestrator could cancel the reservation and update the inventory.
    This approach allows for a consistent, reliable transaction process, even in a
    complex, distributed environment.'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'The Saga Pattern is fundamentally different from the traditional **Two-Phase
    Commit (2PC)** used in monolithic systems. Here are the key differences:


    +   **ACID vs. BASE:** 2PC is based on **Atomicity, Consistency, Isolation, Durability
    (ACID)** properties, which ensure strict consistency at all times. Sagas, on the
    other hand, operate under **Basically Available, Soft state, and Eventually consistent
    (BASE)** properties, trading off immediate consistency for availability and performance.


    +   **Locking:** 2PC uses a coordinator that locks the resources involved in a
    transaction, keeping them inaccessible to other transactions until the current
    one is completed. This approach can lead to performance bottlenecks and does not
    scale well in a distributed system like microservices. In contrast, Sagas do not
    lock resources for the duration of the transaction, allowing other transactions
    to proceed, thereby enhancing performance and scalability.


    +   **Failure Handling:** In 2PC, if a single transaction fails, the entire process
    is rolled back. This strict consistency can be expensive and unnecessary in a
    distributed system. Sagas instead use compensating transactions to handle failures,
    allowing for more flexibility and resilience.


    +   **Synchronous vs. Asynchronous:** 2PC is usually implemented in a synchronous
    manner, which can lead to reduced performance in a distributed environment due
    to waiting times. Sagas, especially in a choreographed saga pattern, can be implemented
    asynchronously, improving performance by allowing other processes to proceed while
    waiting for responses.'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'Given these differences, the saga pattern is generally preferable to 2PC in
    a microservices architecture. It aligns more closely with the principles of distributed
    systems, offering better performance, scalability, and resilience.

    However, it is isant to note that the choice between these patterns depends on
    the specific needs and contexts of the application. Each pattern has its own strengths
    and trade-offs, and the best choice depends on the specific requirements around
    consistency, performance, and complexity.


    Following are the pros and cons:


    # Pros:


    +   - The orchestrator handles failures, isolating the rest of the services from
    their impact.

    - The orchestrator provides a centralized point for managing transaction state
    and coordinating steps.

    - The pattern excels at managing long-running transactions, allowing operations
    to be paused and resumed.

    - Unlike 2PC, it avoids resource locking for the duration of a transaction, thereby
    improving performance and scalability.


    # Cons:


    +   - The orchestrator can become a single point of failure and a potential performance
    bottleneck.

    - The pattern adds significant complexity to the system, both in orchestrator
    implementation and managing compensating transactions.

    - The orchestrator introduces some degree of coupling between services.'
  merge: -1
