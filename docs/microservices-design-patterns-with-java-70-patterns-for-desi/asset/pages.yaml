    # Microservice sizing


    Although the prefix “micro” in the microservice term refers to size, no strict
    rules exist to determine the right size for'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'microservices. In real-world systems, the size varies broadly from extremely
    small nano-services to large mini-monoliths.


    # Problem


    To reap the benefits of microservices, it is crucial to maintain an appropriate
    size for them. If microservices are too large, development complexity increases,
    and issues similar to monolithic development arise. Conversely, if microservices
    are too small, it increases the complexity of the system and organizational overhead.
    Finding the right size for microservices depends on the team''s technology, processes,
    and skill level.


    # Solution


    Although microservices vary in size, there are several distinct buckets:


    +   **Mini-Monoliths or Macro-services:** Larger microservices combine multiple
    domain models or business capabilities in a single service. They can be easier
    to develop and manage but may have scaling, maintainability, and agility challenges
    due to their broader scope and interdependence.


    **Coarse-grained Microservices:** It groups related functionalities or domain
    models based on bounded contexts in Domain-Driven Design, striking a balance between
    modularity and managing multiple microservices. While they still uphold the separation
    of concerns, they are more convenient to develop and oversee compared to numerous
    fine-grained microservices..


    **Fine-grained Microservices:** Fine-grained microservices follow the Single Responsibility
    Principle (SRP) and have a narrow scope, providing'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'high modularity and ease of maintenance and scaling for individual components.
    However, managing many fine-grained microservices can be challenging due to communication,
    deployment, and complexities.


    +   - **Nano-services**: Nano-services are extremely small microservices that
    offer a minimal and focused set of functions, usually accessible through a single
    business method. These nano-services are commonly used in serverless systems,
    where the simplicity of serverless functions encourages straightforward and uncomplicated.


    The choice of architecture and technology stack affects the size of a system.
    Macro-services are common in early migration stages from monolithic to SOA systems.
    DDD or functional decomposition leads to more extensive, coarser-grained microservices,
    while hexagon or data decomposition results in smaller, finer-grained microservices.
    Serverless systems commonly use nano-services.


    Whatever architecture or technology is used, there are a couple of rules to apply
    when deciding on microservice size.


    +   - If a microservice is difficult or costly to replace when technology changes
    or code quality decreases, it is likely too large. Ideally, a development team
    should take one to two weeks to replace a microservice.


    +   - If it is too difficult to remember all microservices that compose a system
    or/and the organization overhead to package and release a new version is more
    than 10% of the total effort, then their size is probably too small. Typically
    the number of microservices in the system is around 50-60, with 20-30 on the lower
    end and about 100 on the higher end.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Communication style


    Microservices are components that communicate with each other using lightweight
    protocols. Therefore, the second key decision in the definition of a microservices
    architecture is choosing the right communication style.


    # Problem


    Microservices systems consist of multiple fine-grained services that communicate
    with each other and external services or consumers using inter-process communication.
    This makes inter-process communication the most crucial aspect of microservices
    architecture, impacting performance, scalability, reliability, and other critical
    capabilities.


    # Synchronous microservices


    Synchronous microservices use synchronous communication with blocking request-response
    calls (Figure 2.8). It is the simplest communication style and is often based
    on HTTP, gRPC, or SOAP communication protocols.


    ![](img/b9fea7997a6c6746f4f9a853213ba905_80_0.png)'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'Typically microservices that use synchronous communication create a separate
    thread for every blocked request until the request is completed. This limits the
    number of parallel requests that can be processed by a single microservice instance
    and make this communication style the least suitable for massively scaled systems.
    Besides, synchronous microservices are more prone to cascade failures, even due
    to minor issues, can make a system unresponsive for a while.


    Following are the pros and cons of synchronous microservices:


    # Pros:


    +   - The simplest implementation option.

    - Well-supported in all development stacks.

    - Typically lowest latency and best performance.


    # Cons:


    +   - Poor throughput and scalability.

    - Cannot handle demand spikes in consumer requests, which requires to reserve
    extra capacity.

    - Poor resilience. Error recovery is limited to a few retries in a short time.


    # Message-driven microservices


    Message-driven microservices use asynchronous messaging via message brokers to
    communicate with each other (Figure 2.9). Many implementations of asynchronous
    messaging technologies available on the market are different in features. Among
    them, the most common patterns are transient and persistent messaging and the
    distribution of messages to single (queue) or multiple (topic) subscribers.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Compared to synchronous communication, asynchronous messaging is more complex
    to implement, and it has a higher latency since messages are routed via a broker
    that doubles the number of inter-process calls. However, this method has significantly
    higher throughput and resilience.


    ![](img/b9fea7997a6c6746f4f9a853213ba905_82_0.png)


    While processing transaction requests, asynchronous microservices may need to
    store and then retrieve the state of the transactions. This allows to share transaction
    execution between multiple microservice instances and even continue transactions
    after a microservice crash. Persistent messaging adds extra resilience and allows
    for the recovery of unprocessed transactions after a partial or complete system
    crash.


    To architect message-driven microservices, it is important to know the types of
    messages:


    +   * Commands are are messages that request a specific action to be performed
    by a component or service. They are commonly used in a request-response communication
    pattern, where the sender expects the'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'receiver to process the command and return a response. Commands are named using
    a verb that describes the action they represent, such as CreateOrder or UpdateCustomer.


    +   Events are messages that signify a change in state or the occurrence of a
    specific situation within the system. They are used in event-driven communication
    and follow a publish-subscribe pattern. Events are typically named using a past-tense
    verb or a noun, such as OrderCreated or CustomerUpdated, to indicate that something
    has already happened. Unlike commands, events do not expect a response from the
    receiver; they merely notify interested parties of the change.


    +   Notifications inform components or services about relevant updates or occurrences
    within the system. They are similar to events in that they do not expect a direct
    response but tend to convey less critical or time-sensitive information. Notifications
    often deliver status updates, alerts, or non-urgent messages to users, services,
    or monitoring systems.


    +   Callbacks are messages or function references that represent a way for a component
    or service to provide a response to an earlier request or command asynchronously.
    In this pattern, the sender provides a callback function, which the receiver invokes
    upon completing the requested action or encountering an error. Callbacks are commonly
    used when synchronous communication is not ideal, allowing for a more flexible,
    asynchronous interaction between components.


    Following are the pros and cons of message-driven microservices:


    # Pros:'
  merge: -1
  pgno: 83
- img_proc: true
  md: '+   - Well-supported in all development stacks.

    - High throughput and scalability.

    - Better elasticity to handle spikes in consumer requests and leads to more optimal
    resource utilization.

    - High resilience; capable of processing incomplete requests even after a system
    crash.


    # Cons:


    +   - Complex to implement.

    - Higher latency and lower performance.


    # Event-driven microservices


    Event-driven communication is a specific form of message-driven communication
    that focuses on exchanging events between components or services. Instead of sending
    commands that direct microservices to take a certain course of actions, event-driven
    microservices exchange events that describe changes in state or occurrences within
    the system, letting receivers decide how those events must be processed and what
    what actions should be taken (Figure 2.10):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_84_0.png)'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'Figure 2.10: Event-driven communication in microservices


    While event-driven communication is a thing on its own, it is closely related
    to domain-driven design and choreography, both patterns are described in this
    chapter. Domain Driven Design presents an elaborate architectural process that
    incorporates events as a key design element and choreographic logic is based on
    sending and processing events.


    Following are the pros and cons of event-driven microservices:


    # Pros:


    +   - Same as message-driven communication.


    +   - Higher decoupling and easier extensibility and maintainability.


    # Cons:


    +   - Same as message-driven communication.


    +   - Additional learning curve.


    +   - Requires detailed domain design.


    # Business logic coordination and control flow


    There are two distinct approaches to managing coordination and control flow in
    microservices architectures: orchestration and choreography. By understanding
    the nuances between the two styles, you will be better equipped to create scalable,
    maintainable, and adaptable applications that efficiently handle the challenges
    posed by distributed computing environments.


    # Problem'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Microservices systems involve complex business processes that require coordination
    of distributed logic across multiple microservices. The choice between orchestration
    and choreography approaches is critical for system performance, scalability, and
    maintainability. The challenge lies in identifying the most appropriate approach
    for a given system while considering trade-offs and constraints to ensure efficient
    communication among services.


    # Orchestration


    Orchestration is a centralized approach to managing the interactions and data
    flow between different microservices within a distributed system. In an orchestrated
    system, a central component, often called the orchestrator or process manager,
    is responsible for coordinating the overall process (Figure 2.11).


    ![](img/b9fea7997a6c6746f4f9a853213ba905_86_0.png)


    **Figure 2.11:** Orchestrated business logic in microservices systems


    The main components of this approach are:


    +   - **Orchestrator**: The orchestrator is the central authority that determines
    the order in which services should be called and manages data exchange, error
    handling, retries, and fallbacks. Depending on the'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'system''s requirements and complexity, it can be a dedicated business process
    microservice, a workflow engine, or an API gateway.


    +   * Microservices: Each microservice is responsible for handling its specific
    domain and providing the functionality required by the orchestrator. Microservices
    are typically designed to be stateless, single-purpose, and loosely coupled.


    The synchronized communication in the Synchronous Microservices pattern is well-suited
    for orchestrated business logic. For increased reliability, it is advisable to
    save transaction states and implement compensation transactions to manage transaction
    errors or recover from microservice crashes. Some teams prefer to use workflow
    engines to build their orchestrator implementation. To ensure even greater reliability,
    additional measures like retries, circuit breakers, logging, and performance metrics
    should be included to monitor distributed transactions and promptly identify any
    implementation issues. Further information can be found in the Orchestrated Saga
    pattern in chapter seven.


    Following are the pros and cons of orchestration:


    # Pros:


    +   * A clear, centralized point of control for managing the flow of data and
