    # Microservice Chassis / Microservice template


    Microservice Chassis is a pattern for scalable and modular software. This section
    covers its aspects, benefits, and implementation.


    # Problem


    To improve efficiency, development teams often create a Microservice Chassis pattern
    - a set of templates with boilerplate code containing essential pieces and recommended
    design patterns - to use when developing microservices. This is necessary as microservices
    systems can grow quickly and have numerous components.


    # Solution'
  merge: -1
