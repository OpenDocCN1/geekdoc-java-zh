    +   Gradual rollout: If the new version performs well without any significant
    issues, it is gradually rolled out to larger segments of users and infrastructure
    in stages. Each stage allows for further monitoring and adjustments before proceeding
    to the next.


    +   Rollback strategy: At any point during the canary deployment, if a major issue
