    # Initial state


    Managing the initial state of functional tests is crucial to ensure that tests
    produce consistent and accurate results. The state acts as the starting point
    for the tests, creating a known environment from which variations can be measured
    (refer to Figure 11.7):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_556_0.png)


    **Figure 11.7:** Managing test data


    There are two common approaches to setting this state:


    +   • **Full state:** This involves completely clearing the database and populating
    it with a predefined set of data. This method offers simplicity and predictability,
    making it ideal for component-level testing or system-level tests where the environment
    is isolated. By starting from a clean slate, it ensures no residual data from
    prior tests or activities can skew the results.'
  merge: -1
  pgno: 556
- img_proc: true
  md: '+   Partial state: This method is more intricate. Instead of clearing the entire
    database, it only adjusts a segment of it. This is particularly useful in environments
    where tests run concurrently, or in production settings where tests operate alongside
    regular system functions. To prevent interference with other data, the state created
    is often randomized.


    However, the manner in which this state is established is as important as the
    state itself. It is advisable to use formal interfaces to set the system state,
    rather than accessing the database directly. This practice ensures encapsulation
    within microservices, a key principle in their architecture. Direct database access
    can lead to a multitude of issues:


    +   Breaking encapsulation: Directly manipulating the database could bypass the
    standard checks and balances that an interface might enforce, potentially leading
    to data corruption or inconsistencies.


    +   Test fragility: Should there be a change in the microservice''s data model,
    tests relying on direct database access would fail. Conversely, if data is using
    a formal interface that maintains backward compatibility, tests remain robust
    amidst changes.


    Some teams might consider separate "test databases", but this is generally discouraged.
    It not breaks encapsulation but also risks the divergence of the test database
    structure from the actual production one over time.


    Following are the pros and cons of initial state:


    # Pros:


    +   Ensures test consistency.


    +   Predictable test outcomes.


    +   Reduces test interference.


    # Cons:


    +   Complex partial state setup.'
