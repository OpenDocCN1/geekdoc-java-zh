  md: 'Following are the pros and cons of hardcoded configuration:


    # Pros:


    +   - Extremely simple implementation.

    - Values are completely separated and hidden during deployment.


    # Cons:


    +   - Modification of the parameters requires code changes.


    # Static configuration


    Static configuration refers to settings that are established once during system
    deployment and remain unaltered until the next deployment.


    # Problem


    Static configurations should only be established once when microservices start.
    The critical aspect is that all configuration parameters must be externally defined
    and injected into microservices during deployment. Consequently, patterns for
    static configurations are shaped around the injection mechanisms that deployment
    packages and platforms support.


    # Environment variables


    The simplest and most universal method to inject static configurations is Environment
    Variables. It is supported for microservices deployed as system processes, containers
    in Docker or Kubernetes, or as serverless functions. All built servers and deployment
    tools also support environment variables.'
