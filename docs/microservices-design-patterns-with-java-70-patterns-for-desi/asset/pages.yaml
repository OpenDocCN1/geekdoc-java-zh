    # System process


    System process packaging is a simple and versatile choice in the microservices
    ecosystem. It suits self-managed deployments in VM environments and PaaS platforms
    like Heroku, AWS Elastic Beanstalk, or Azure App Service. Its minimal restrictions
    make it appealing for various microservices scenarios.


    At its core, a system process is a running instance of an executable program.
    In the context of microservices, it means that each service is packaged as its
    standalone executable. It offers a number of benefits:'
  merge: -1
  pgno: 496
- img_proc: true
  md: '+   - Flexibility: Processes can manage their own lifecycles and can be started,
    stopped, or restarted independently.


    +   - Concurrency: Processes can maintain active threads, facilitating efficient
    multitasking.


    +   - Communication: They support a variety of synchronous and asynchronous communication
    methods, enhancing the interactivity among services.


    The primary constraint for this method revolves around the executable format.
    Beyond that, the flexibility it offers is unparalleled


    +   - Packaging requirement: The microservice must be packaged into an executable
    format suitable for the host OS.


    +   - Environment dependencies: Traditional microservices would necessitate a
    Java Runtime Environment (JRE). However, advancements in Java allow compilation
    into native binaries, as we will explore further.


    While the approach of packaging microservices as processes offers undeniable flexibility
    and independence, it also brings its own set of complexities.


    +   - Monitoring: While system processes offer independence, monitoring tools
    must be implemented to ensure each microservice''s health and performance.


    +   - Recovery: System processes need external orchestration or watchdog mechanisms
    to ensure they recover from failures.


    +   - Scalability: Scaling, especially in non-containerized environments, requires
    more manual intervention compared to other packaging methods.'
