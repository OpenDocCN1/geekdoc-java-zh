    # Choreographic Saga


    The choreographic saga pattern is a prominent strategy for managing transactions
    in event-driven microservices architectures, particularly those founded on asynchronous
    messaging.


    In this pattern, each microservice participating in the transaction is self-aware
    and knowledgeable of its own role and the subsequent step in the process. Essentially,
    each service independently determines its next action based on the received events,
    contributing to a self-orchestrating, choreographed sequence (refer to Figure
    7.8).


    ![](img/b9fea7997a6c6746f4f9a853213ba905_377_0.png)


    Although there is no centralized logic, there can be a shared common state between
    the microservices involved in a transaction (see State Management pattern).


    Contrasting this with the orchestrated saga pattern, key differences include:'
