    # AsyncAPI


    AsyncAPI is an open-source initiative that provides a specification and a set
    of tools to help developers work with event-driven architectures. It''s often
    described as the "OpenAPI for event-driven APIs" and is used to define APIs as
    asynchronous messaging protocols, such as MQTT, AMQP, Kafka, WebSockets, etc.


    Just as OpenAPI allows developers to describe RESTful APIs in a machine-readable
    format, AsyncAPI allows developers to describe event-driven APIs in a similar
    way. The AsyncAPI specification is a contract for your APIs and includes details
    about your server and information about all the channels (topics, routing keys,
    event types, etc.) your application is able to publish or subscribe to. It also
    includes information about messages, security schemes, and other important aspects
    of your event-driven APIs.


    AsyncAPI can be used in several ways:


    +   **Documentation:** Like OpenAPI for HTTP APIs, AsyncAPI can generate human-readable
    documentation for your APIs. This makes it easier for other developers to understand
    how your API works and how to interact with it.'
  merge: -1
  pgno: 234
