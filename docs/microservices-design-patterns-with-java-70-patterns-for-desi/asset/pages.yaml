    +   - POST /deleteProduct?id={id}: Delete a product by its ID


    Error handling in the HTTP protocol is managed through the use of standardized
    status codes. These three-digit codes indicate the outcome of an HTTP request
    and can be categorized into five classes based on their first digit:


    +   - 1xx (Informational): Request received, server is continuing to process it


    +   - 2xx (Successful): Request was successfully received, understood, and accepted


    +   - 3xx (Redirection): Further action is needed to complete the request


    +   - 4xx (Client Error): Request contains bad syntax or cannot be fulfilled by
    the server


    +   - 5xx (Server Error): Server failed to fulfill a valid request


    For example, common HTTP status codes used for error handling include:


    +   - 200 OK: The request has succeeded. The information returned with the response
    is dependent on the method used in the request.


    +   - 301 Moved Permanently: This status code indicates that the requested resource
    has been permanently moved to a new location, and future requests should use the
    new URL.


    +   - 400 Bad Request: The server cannot process the request due to invalid syntax.'
