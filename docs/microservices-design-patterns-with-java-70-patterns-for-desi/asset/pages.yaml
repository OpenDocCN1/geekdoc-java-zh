    # ### Introduction


    This chapter covers different ways to configure microservices at various stages
    of their lifecycle. By using these configurations, microservices can connect to
    the right infrastructure services, message brokers, databases, and other microservices
    in the system. Additionally, they can be utilized to alter microservice composition
    to accommodate diverse deployment scenarios or customize their behavior to meet
    the requirements of customers.


    This chapter starts with an explanation of three types of configurations:


    +   - Day 0 (development-time)

    - Day 1 (deployment time)

    - Day 2 (run time)


    Then it describes general patterns to address hardcoded, static, and dynamic configurations.
    At the end, it reviews patterns for specific scenarios.


