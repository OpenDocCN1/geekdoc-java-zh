    # Connection configuration


    Connection configuration refers to the settings and information required to connect
    two devices or systems. These parameters are typically used in networking protocols
    to ensure devices can communicate with each other effectively.


    # Problem


    Connection parameters are a very common type of configuration. If they point to
    infrastructure services that are part of the product deployment environment and
    never change, they are included in Day 1 configuration. Otherwise, if a service
    location or credentials may change after the deployment, they are part of the
    Day 2 configuration.

