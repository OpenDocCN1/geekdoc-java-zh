    # Optimistic lock


    Optimistic Locking is a concurrency control pattern used to ensure the consistency
    of data during concurrent operations. The fundamental idea behind optimistic locking
    is to allow multiple clients to read data simultaneously, and control is enforced
    only when changes are committed, thereby reducing lock contention.


    In the optimistic locking strategy, a version identifier (version ID) is associated
    with each modifiable entity. The version ID is updated each time the entity is
    updated. The two common types of version IDs are:


    +   - Incremented Numbers: In this approach, the version ID is an integer that
    is incremented every time the entity is updated. It starts from a base value,
    often zero, and is increased by one (or by any constant) for each update.


    +   - Timestamps: In this approach, the version ID is a timestamp indicating the
    last modification time of the entity. It could be the actual time of the update
    or a logical timestamp maintained by the application.'
