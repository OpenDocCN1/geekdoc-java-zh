    **Figure 3.19.** Patterns recommended for a basic microservice template


    Template engines like T4 or StringTemplate can be used by teams to generate microservices
    with specified parameters, but they require frequent updates and become outdated
    quickly. An alternative approach is to select one or a few golden microservices
    and use them to create new microservices through basic search and replace operations.
    This method reduces the need for template maintenance and ensures that the latest
    patterns and standards are reflected.


    # Antipatterns


    These are a number of antipattern that are common in code organization and documentation
    of microservices systems:


    **Poorly structured monorepos:** Deeply nested folders and fuzzy monorepos can
    obscure the structure of a codebase, making it difficult to see all components,
    their ownership, type, and purpose. This can lead to pockets of unmanaged code
    and cause management to lose control of the codebase, relying on developers for
    information on its structure and status.


    **Code sharing in monorepo:** Monorepo makes it easy to reference shared code
    without formal versioned dependencies. This creates coupling at the code level
    and turns the system into a distributed monolith.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'Monolithic build and deployment: Teams may choose to use a single build and
    deployment process to handle multiple software components instead of setting up
    individual pipelines for each component. This can be done manually or with advanced
    tools, but it leads to tightly coupled microservice lifecycles and the creation
    of a distributed monolith.


    Broad code changes: Monorepo let developers modify multiple components at once
    and deploy them with one commit, but contradict delivery in microservices. Instead
    of changing, testing, and releasing one microservice, broad changes destabilize
    the system with no proper versioning. This creates extra work for the team and
    slows down release cycles. Such practices show a monolithic mindset and are unsuitable
    for microservices.


    As we see above, most antipatterns take place when code is stored in monorepo.
    Differently, multi-repo creates physical boundaries between microservices that
    are hard to violate.


    # Conclusion


    In this chapter, we learned to organize code repositories, define our microservice
    code structure, write good documentation with minimum effort, share code between
    microservices properly, ensure its backward compatibility, and organize code reviews
    to get the maximum value out of them. All those patterns help to effectively manage
    the codebase and do not let it turn into a ball of mud. At the end of the chapter,
    we discussed the Microservice Chassis pattern that represents a microservice template
    used by a development team as a starting point to create new microservices. This
    pattern contains many patterns that we will discuss in the following chapters.
    We finished with a description of several common antipatterns.'
