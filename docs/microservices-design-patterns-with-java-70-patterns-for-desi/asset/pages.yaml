    # Antipatterns


    In the context of microservices, there are several antipattern associated with
    data handling and storing that could lead to less optimal or even detrimental
    system performance, scalability, and maintainability. Two of such antipatterns
    are relying on static queries and using a shared database among microservices:


    +   - **Static queries**: Static queries, which are hardcoded database queries,
    can lead to several challenges in a microservices architecture. Since they are
    not dynamic, static queries lack the flexibility to adapt to evolving requirements
    or changes in the structure of'
  merge: -1
  pgno: 333
- img_proc: true
  md: 'the data. As a consequence, they often require changes in the codebase, whenever
    a minor modification to the query is needed. This defies one of the key benefits
    of microservices - the ability to independently evolve and scale different parts
    of a system.


    +   - Shared database: A shared database is another common antipattern. In theory,
    sharing a database might seem like a good way to reduce data duplication and ensure
    consistency. However, it violates the principle of service autonomy, a core tenet
    of microservices. Each microservice should own and control its own data to maintain
    loose coupling and high cohesion.


    Sharing databases leads to tight coupling between microservices and creates a
    single point of failure. If one service makes a change to the shared database
    schema, it can inadvertently break other services that depend on the same schema.
    Also, when a shared database goes down, it affects all the services using it,
    leading to system-wide failure.


    Moreover, sharing databases can lead to performance bottlenecks, as all services
    contend for the same database resources. It also complicates the task of scaling
    individual services, as scaling decisions must take into account all services
    sharing the database.


