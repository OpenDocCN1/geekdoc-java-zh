    | InvokeResponse invoke(InvokeRequest req); | void dispatchCommand(String command,
    Object args);

    | <<DataObject>> InvokeRequest String command; Object[] ergo; | <<DataObject>>
    InvokeResponse bool success; Object result; ErrorDescription error;

    | Client | <<DataObject>> Command String command Func action; | Service |


    Figure 5.11: Commandable pattern


    The communication scenario via Commandable API has the

    following steps:


    +   1. Services that expose operations via public microservice API register commands
    in the CommandableController by specifying the command name and action that should
    be called when a client invokes a command.

    2. When a client needs to communicate with a microservice API, it converts its
    request into a generic InvokeRequest object and specifies a command name and arguments.
    Then, it calls the invoke method of the microservice API.

    3. The CommandableController receives the call and dispatches it to a responsible
    Service using actions in previously registered commands. Then, it gets the result
    or an error, packages it into an InvokeResponse object, and sends it back to the
    client.

    4. The client receives the InvokeResponse, unpackages it and returns the command
    result or error.


    As we can see from the pattern description, microservice developers using the
    Commandable patterns are able to implement a few generic CommandableControllers
    for all'
