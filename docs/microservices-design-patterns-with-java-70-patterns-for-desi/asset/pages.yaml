  md: 'After studying this chapter, you will be able to decompose software systems
    into microservices, choose an architectural style, and make intelligent decisions
    to address system-wide capabilities.


    # Microservice definition


    Before diving into a microservices architecture, it is important to understand
    what microservices are and clear some misconceptions related to this concept.


    # Problem


    Software systems become complex over time, affecting productivity, cost, and time.
    Developing and understanding codes become difficult as the system grows due to
    to the human brain''s limited capacity. Additionally, the number of interconnections
    between parts affects productivity, as changes to one part require updates to
    interconnected parts.


    To improve software development productivity, developers classified the code by
    reducing visible parts and interconnections. Initially done via changes in programming
    languages, development paradigms affected the code structure, but monolithic systems
    were still in place. As monoliths grew, testing and delivery became significant
    factors, breaking monoliths into smaller deliverable units called microservices
    that can be coded, tested, and delivered independently. Figure 2.1 summarizes
    this evolution of software architectures:'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_67_0.png)


    Figure 2.1: Evolution of software architecture


    Moreover, the reduction of granularity in architectural components positively
    impacted productivity and, consequently, development cost and time (Figure 2.2):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_67_1.png)


    Figure 2.2: Dependency between system size and development productivity'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'When software architecture changes, complexity does not disappear; it shifts.
    Individual component development becomes easier, but the number of system parts
    grows, making testing and delivery more difficult. To address this issue, incremental
    delivery was introduced by building fine-grained systems in small increments.


    However, teams often focus solely on development in microservices systems and
    continue testing and delivering their systems using old monolithic practices.
    This results in a distributed monolith with high overall complexity and low productivity,
    usually worse than traditional monolithic systems.


    # Solution


    Microservices architecture, which is a variation of the service-oriented architecture
    structural style, organizes an application into a set of finely grained, loosely
    connected services that communicate through lightweight protocols. These services
    have the following characteristics:


    +   - Is a service organized around business capabilities (a reference to the
    SOA architecture)

    - Is small in size

    - Communicates using lightweight protocols

    - Can be implemented using different technologies

    - Can be developed by different teams at different times

    - Can be delivered and deployed independently


    These points describe a microservice as a software component with an independent
    lifecycle. This characteristic is central because it allows for incremental software
    delivery, reduces complexity, and improves productivity for large software systems.
    However, achieving an independent microservice lifecycle requires changes across
    all areas of'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'software development, including organization structure, product and project
    management, testing, and delivery.


    # Architectural decomposition


    Software Architecture is a system structure represented by components, relationships
    between components, and their externally visible properties. The decomposition
    of a system into interconnected components is the first step toward defining an
    architecture.


    # Problem


    From the definition above, it is possible to see that a microservice represents
    a software component that:


    +   - Is a service organized around business capabilities

    - Is small in size, autonomously developed, and independently deployed

    - Communicates over lightweight protocols like HTTP, gRPC, or simple messaging
    can be implemented using different programming languages, databases, hardware,
    and software environments.


    Additionally, a well-done decomposition must find the right balance between 3
    principles: responsibilities, cohesion, and coupling (Figure 2.3):'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_70_0.png)


    Figure 2.3: Principles of well-architected microservices


    Consequently, as microservices systems may consist of tens or hundreds of microservices,
    it is necessary to use a systematic approach to architectural decomposition to
    satisfy these requirements.


    # Functional decomposition


    Functional decomposition decomposes a system into microservices based on their
    specific functionality. The technique identifies distinct business capabilities
    provided by the functionality, which can be implemented as individual microservices.
    For instance, an e-commerce application may have microservices for product search,
    shopping cart management, and order processing. Common functionality or data is
    extracted and placed into separate microservices, as shown in Figure 2.4:'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Data decomposition'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Data decomposition is a technique for breaking down a system into microservices
    based on the data they manage. The process requires creating a data model with
    distinct data entities and relationships. Each data entity can be implemented
    as an individual microservice, with each microservice responsible for managing
    a specific data type. Business functions closely related to data entities are
    usually in the same microservices. Business transactions that require reliable
    access to multiple data entities are generally organized into logical groups and
    placed into separate microservices (Figure 2.5):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_72_0.png)


    Figure 2.5: Data decomposition of microservices


    Following are the pros and cons of data decomposition:


    # Pros:


    +   - A simple method that requires only high-level requirements and a data model.

    - Works well for data-driven products with relatively simple functionality.


    # Cons:'
  merge: -1
  pgno: 72
- img_proc: true
  md: '+   - Not specific on how to expose external interfaces, connect to external
    systems or deal with complex data analytics.


    +   - May cause performance issues for complex transactions involving multiple
    data entities.


    +   - Requires additional logic to handle references between entities and ensure
    data integrity.


    # Domain-driven design


    Domain-driven design (DDD) was introduced by Eric Evans in his book Domain-Driven
    Design: Tackling Complexity in the Heart of Software[1]. He suggested an approach
    to system architecture based on the premise that a software system should be designed
    around its business domain.


    In DDD, decomposition microservices are defined around bounded contexts of domains
    or subdomains (Figure 2.6). Shared data can be translated and replicated between
    domains (microservices). For example, consider a healthcare application that manages
    patient information, appointment scheduling, and medical records. These bounded
    contexts can be implemented as a separate microservice in a domain-driven decomposition
    approach.


    ![](img/b9fea7997a6c6746f4f9a853213ba905_73_0.png)


    Figure 2.6: Domain-driven decomposition of microservices


    The key principles of domain-driven design include:'
  merge: -1
  pgno: 73
- img_proc: true
  md: '+   - **Ubiquitous language**: DDD promotes the use of a standard, domain-specific
    language between developers, stakeholders, and users. This language should be
    used consistently across all aspects of the system, from requirements gathering
    to implementation.


    +   - **Bounded contexts**: These are specific system areas with a clear and distinct
    purpose. Each bounded context should have its model and language, and should be
    implemented as a separate component or microservice.


    +   - **Entities and value objects**: DDD recognizes two main types of objects
    within the domain model: entities and value objects. Entities represent objects
    with unique identity and lifecycle, while value objects represent objects with
    no inherent identity or lifecycle defined solely by their attributes.


    +   - **Aggregates**: DDD defines aggregates as a cluster of related objects treated
    as a single unit for data changes. Aggregates ensure consistency and integrity
    within the domain model by enforcing transactional boundaries.


    +   - **Domain events**: DDD promotes the use of domain events, which are notifications
    of significant changes within the domain model. Domain events can be used to trigger
    other processes or update other components within the system.


    +   - **Continuous refinement**: DDD recognizes that the business domain is constantly
    evolving and changing, and the software system should be designed to accommodate
    those changes. Continuous refinement involves an iterative process of modeling,
    implementation, and feedback, with the goal of'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'improving the system''s alignment with the business domain.


    Following are the pros and cons of domain driven design:


    # Pros:


    +   - Microservices defined around bounded contexts are less affected by the performance
    or data integrity problems

    - Matches well with the asynchronous event-driven communication style.


    # Cons:


    +   - A complex method that requires a good understanding of DDD and extensive
    modeling.

    - In practice, microservices tend to be quite large and complex.

    - The method is not specific on how to expose external interfaces, connect to
    external systems or deal with complex data analytics.


    # Layered architecture


    In recent years, amidst the rising popularity of architectural models such as
    Hexagonal, Onion, and Clean architectures—each designed to enhance modularity,
    testability, and maintainability—the concept of Layered Architecture has emerged
    as a versatile framework. This approach can be seen as a generalization where
    microservices are systematically divided into distinct layers based on their functionality.


    In microservices, this approach typically divides systems into three layers:'
  merge: -1
  pgno: 75
- img_proc: true
  md: '+   - **The interface layer**: This layer contains the facades responsible
    for translating external requests into domain-specific commands and queries. They
    are also responsible for coordinating the communication between microservices
    and handling user input/output.


    +   - **The domain layer**: This layer contains business-process microservices
    with the core logic of the system, including the domain models and business rules.
    The domain layer is responsible for processing incoming requests and producing
    the appropriate responses.


    +   - **The infrastructure layer**: This layer contains the implementation details
    for connecting the application to external systems, such as databases and APIs.
    The infrastructure layer contains the adapters that translate the domain-specific
    commands and queries into the appropriate data formats for communication with
    external systems. It contains data and connector microservices.


    When this approach is applied to microservices, it leads to well-structured, loosely
    coupled code (Figure 2.7):'
  merge: -1
  pgno: 76
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_77_0.png)


    Following are the pros and cons of layered architecture:


    # Pros:


    +   - Simple to understand and define.

    - Explicitly defines all external touchpoints: facades, connectors, and data microservices.


    # Cons:


    +   - The method does not specify how to decompose business-process microservices
