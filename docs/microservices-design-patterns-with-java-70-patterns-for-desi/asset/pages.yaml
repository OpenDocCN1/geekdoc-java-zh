  md: 'A flag, also known as a feature toggle or feature switch, is a technique used
    in microservices architecture to selectively enable or disable certain features
    or functionality of an application.


    # Problem


    Traditionally when a development team implements a new functionality, they may
    choose two different approaches. The first one is a “safe approach”, which requires
    long and rigorous testing and involves “user representatives” in usability testing.
    Only when everything is verified can a product be released into production. Another
    approach is to “throw sh**t against the wall” and hope the old functionality is
    not broken and the new one will not fall apart.


    # Solution


    Recently high-velocity teams started to adopt a new pattern called Feature Flag.
    It means old functionality is kept intact while new features are implemented on
    the side and enabled by a special flag that can be set during the deployment or
    changed during runtime.


    Feature Flags have a few significant advantages over the traditional approaches.
    Its implementation:


    +   - Speeds up innovation as teams can put out features faster.

    - Shortens the test cycle for new features and reduces required test resources
    as some are delegated to beta-users / early adopters.

    - Allows developers to quickly receive feedback from beta-users, improve implementation,
    and nail remaining defects before the prime time.

    - Keeps existing functionality intact for regular users, while early adopters
    can get access to the latest and'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'greatest features.

    Some companies build their entire releases around feature flags by publicly announcing
    newly released features, actively involving users in beta-testing and idea generation
    and creating a community of raving fans. For example, GoHighLevel''s marketing
    system uses them to invite users to join the beta community:


    ![](img/b9fea7997a6c6746f4f9a853213ba905_184_0.png)


    **Figure 4.11:** Labs interface of GoHighLevel marketing system that opens users''
    ability to join a beta-testing program


    Feature flags are implemented as Day 1 (deployment-time) or Day 2 (runtime) configurations
    and fall into a few categories:


    +   - Release toggles: simple on/off switches that enable new features and are
    removed after the feature is'
