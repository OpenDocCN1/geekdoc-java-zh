    # Branch


    The branch pattern is another structural design pattern used within the context
    of microservices architecture. This pattern comes into play when a request necessitates
    simultaneous processing by multiple independent services.


    In essence, the branch pattern splits the process into multiple parallel flows.
    When a request is received, instead of calling one service after another in a
    sequence, the branch pattern "branches out" the request to several services at
    the same time. Each branch represents a path for a different service to process
    the request in parallel with the others (refer to Figure 7.5):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_369_0.png)'
