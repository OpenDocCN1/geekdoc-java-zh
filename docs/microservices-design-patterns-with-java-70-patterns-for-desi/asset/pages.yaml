- img_proc: true
  md: 'A basic template that can be used as a starting point for any new microservice
    should include the following recommended elements and patterns (as shown in Figure
    3.19):


    +   * A standard component structure (See Code Structure pattern)

    * Minimal documentation (See Minimal Documentation pattern)

    * Build scripts and definition of CICD pipeline (See Dockerized build scripts
    pattern)

    * Externalized configuration (See configuration patterns)

    * Synchronous and/and asynchronous communication (See Synchronous Communication
    and Asynchronous Communication patterns)

    * Communication interface versioning (See Interface Versioning pattern)

    * Error handling and propagation (See Error Propagation pattern)

    * Observability (See Logging and Performance Metrics patterns)

    * Automated tests (See Unit tests and Integration Tests patterns)

    * Packaging into a deployment component such as docker image, Jakarta servlet,
    or a serverless function (See microservice packaging patterns)'
