    # Bulkhead


    The bulkhead pattern is a design strategy employed in microservices architectures
    to increase the resilience and fault tolerance of a system. The name "Bulkhead"
    is borrowed from ship construction, where a ship''s hull is compartmentalized
    into watertight sections. If a leak occurs in one section, it doesn''t flood the
    entire ship (as shown in Figure 7.11):'
  merge: -1
  pgno: 390
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_391_0.png)


    **Figure 7.11: Bulkheads in ship design**


    In microservices, the bulkhead pattern involves isolating elements of an application
    into pools so that if one fails, the others will continue to function. It is like
    having several small isolated systems instead of one large system.


    Each microservice or operation gets its separate thread-pool (or other resources
    like database connections), limiting the scope of any potential failure to that
    single pool.


    This way, even if one microservice is overloaded or failing, it doesn''t affect
    the whole system. Only the operations or requests routed to that particular microservice
    are impacted, while others continue to function normally.


    In Spring Boot, you can implement the Bulkhead pattern with resilience4j, a fault
    tolerance library. Here is an example of how to do this:


    In your `application.yml` file, define the bulkhead configuration (Code Snippet
    7.11):


    +   - resilience4j:

    - bulkhead:

    - instances:

