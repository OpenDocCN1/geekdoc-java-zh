    # Canary deployment


    Canary deployment is a strategy used to reduce the risk of introducing a new software
    version in production by slowly rolling out the change to a small subset of users
    before rolling it out to the entire infrastructure (refer to Figure 14.8):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_716_0.png)


    Figure 14.8: System deployment using the canary strategy


    Here is how it unfolds:


    +   - Initial release: In the initial phase, the new version of the software is
    deployed to a limited number of servers, and only a small percentage of the user
    base, known as the canary group, is directed to this new version. This allows
    teams to monitor how the update performs in a live environment but on a smaller
    scale.'
