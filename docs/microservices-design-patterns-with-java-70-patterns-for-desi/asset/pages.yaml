- img_proc: true
  md: 'The backpressure pattern is used to manage load and increase the resilience
    of a system. Backpressure, as a term, is derived from fluid dynamics, where it
    represents a resistance or force opposing the desired flow of fluid in a pipe.


    In the realm of microservices, the backpressure pattern is about controlling the
    rate of incoming requests to prevent resource exhaustion. If a service is overwhelmed
    by too many incoming requests, it can leverage backpressure to push back on the
    caller or drop requests when necessary.


    Here is how it works:


    +   * Buffering and queueing: Incoming requests are temporarily stored in a buffer
    or queue. However, this buffer has a limit to prevent indefinite growth and potential
    memory exhaustion.


    +   * Load shedding: When the buffer reaches its limit, the service can start
    refusing new requests. This technique is also known as load shedding.


    +   * Flow control: Another approach is to apply flow control, signaling the upstream
    services to slow down the request rate. This can be achieved through mechanisms
    like TCP flow control in the transport layer or application-level flow control.


    +   * Adaptive modeling: Some implementations of backpressure involve adaptive
    models where the service adjusts its request handling capacity based on current
    system load and performance metrics.


    By applying the Backpressure pattern, a microservice can effectively protect itself
    from becoming overloaded and ensure that it continues to function optimally under
    high demand.'
