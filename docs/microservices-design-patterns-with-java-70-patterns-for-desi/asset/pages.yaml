    follow the industry hype and see microservices as a fun experience and the next
    step in their professional development. They may sell that to management or just
    decide to execute it on their own. However, without understanding the impact of
    their actions, and without sufficient time and resources, those initiatives often
    lead to a situation where development gets stuck in the initial phases when everything
    is more difficult and slower, making it impossible to overcome the hurdle and
    enjoy the advantages.'
