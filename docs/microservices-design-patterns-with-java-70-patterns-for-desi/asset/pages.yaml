    Despite offering configuration-driven ease, API gateways have a learning curve.
    Efficiently configuring, optimizing, and managing one requires specialized knowledge.
    Teams must adjust their processes for building, deploying, and maintaining gateways
    effectively (as shown in Figure 8.2):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_415_0.png)


    Here are the primary features of API gateways:


    +   * **Routing**: Directs incoming requests to the appropriate backend service
