  md: '# Health checks


    Microservices face operational challenges and potential failures, impacting performance.
    The health checks pattern detects and addresses anomalies by regularly checking
    microservices'' health. This pattern uses special endpoints to assess microservice
    health and ensure system robustness.


    # Problem


    Detecting service failures promptly in a distributed system such as microservices
    is challenging. Traditional logging and monitoring might not be sufficient to
    identify and isolate issues promptly. More so, when a microservice is unresponsive
    or underperforming, it can negatively impact the entire application''s performance.
    Hence, there is a need for a mechanism to perform constant health checks and ensure
    the system''s high availability and reliability.


    # Solution


    The health checks pattern works by exposing dedicated endpoints in a microservice,
    which can be frequently polled to check the microservice''s health status. These
    health checks are generally categorized into:


    +   - **Startup checks**: Verify if the microservice has started correctly and
    all its components are initialized properly.


    +   - **Liveness checks**: Validate if the microservice is running and capable
    of processing requests. If a microservice fails the liveness check, it can be
    restarted by the system.


    +   - **Readiness checks**: Check microservice readiness to accept requests. If
    it fails, temporarily remove it from the load balancer rotation until it is ready
    again.'
  merge: -1
