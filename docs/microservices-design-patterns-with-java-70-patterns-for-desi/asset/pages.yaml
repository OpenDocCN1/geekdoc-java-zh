    # Multiple deployments


    The multiple deployments pipeline is an advanced variation of the incremental
    delivery pipeline. It helps software vendors to continuously deploy products for
    their clients or large SaaS companies to install and update their systems across
    multiple locations (as shown in Figure 13.3):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_632_0.png)


    Figure 13.3: Incremental pipeline with multiple deployments


    How Amazon uses this approach with its AWS services provides a concrete example.
    Amazon maintains data centers in many corners of the world, housing vast networks
    of their computer systems. When they roll out a new update or feature, they do
    not do it everywhere all at once. Instead, they use a multiple deployments pipeline
    to gradually introduce these updates region by region, tailoring the deployment
    to suit each area’s specific needs and regulations.


    Following are the pros and cons of multiple deployments:


    # Pros:'
  merge: -1
  pgno: 632
- img_proc: true
  md: '+   • Tailoring deployments to meet local demands or regulations.

    • Less downtime as issues can be isolated to individual deployments.

    • Simplifies extending services to new areas or clients incrementally.


    # Cons:


    +   • Handling multiple deployments can be administratively intensive.

    • Requires more resources for individualized deployments.

    • Risk of having varied service experiences across different regions.


    # Application platform


    Companies that build multiple products often create an application platform that
    houses shared services and components. The entire software delivery process can
    be organized as several connected pipelines (refer to Figure 13.4):


