    # Contract test


    Contract testing in microservices ensures that individual services adhere to their
    defined contracts or interfaces, vital for seamless interactions in distributed
    microservices. These contracts specify a service''s expected behavior, documenting
    its inputs, outputs, and side-effects. smoother integration with other services
    and consumers (refer to Figure 11.5).


    There are three primary motivations behind contract testing in microservices:


    +   • **Behavior verification**: The primary goal is to ensure that a service
    behaves as expected. It checks the correctness of service responses for a given
    set of inputs, as well as possible error states and their handling.


    +   • **Compliance with specifications**: Contract testing enforces adherence
    to defined specs, ensuring that a service meets the stipulated requirements. This
    ensures that any service consuming it gets a predictable response.


    +   • **Backward compatibility**: As microservices evolve, it is important that
    changes do not inadvertently disrupt existing consumers. Contract testing validates
    that new iterations of a service still align with previous contracts, ensuring
    uninterrupted service to existing clients.'
