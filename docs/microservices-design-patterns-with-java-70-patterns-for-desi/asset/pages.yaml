  md: 'When a client reads optimistic entity, it also reads the version ID. When the
    client later tries to update the entity, it provides the version ID it previously
    read. The server checks the version ID from the client against the current version
    ID of the entity:


    +   - If the version IDs match, the update is performed or updated with a new
    timestamp.

    - If the version IDs do not match, the update is rejected because the entity has
    been modified by another client since it was the last read. This is called a write
    conflict.


