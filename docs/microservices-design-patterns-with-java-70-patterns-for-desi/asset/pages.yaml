  md: '+   - **401 Unauthorized**: The request requires authentication, and the provided
    credentials are missing or incorrect.


    +   - **403 Forbidden**: The client does not have permission to access the requested
    resource.


    +   - **404 Not Found**: The requested resource could not be found on the server.


    +   - **410 Gone**: This status code indicates that the requested resource is
    no longer available at the server and no forwarding address is known. It is considered
    a permanent condition.


    +   - **500 Internal Server Error**: The server encountered an error while processing
    the request.


    In addition to error codes, it is recommended to send error responses that contain
    detailed information about the error, its type, stacktrace and correlation (trace)
    ID, so that it can be used for logging and troubleshooting.


