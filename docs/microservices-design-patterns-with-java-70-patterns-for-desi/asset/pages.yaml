- img_proc: true
  md: 'In addressing the prevalent inconsistencies in the software development cycle,
    the Virtualized Build Process pattern proposes the implementation of virtualized
    or dockerized environments during the building and testing phases. This approach
    ensures a consistent set of tools and environments are used both in development
    and CI/CD pipelines, fundamentally eliminating the disparities that occur due
    to different configurations and setups (as shown in Figure 13.8):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_640_0.png)


    **Figure 13.8:** Using virtualized build processes during development and automated
    CI/CD pipeline


    By adopting this pattern, developers will utilize environments with pre-installed
    toolchains, alongside scripts that automate the build processes, facilitating
    seamless transitions between different stages of the development cycle. Even though
    developers may lean towards IDEs for development, they are encouraged to employ
    the virtualized build and test process at least once before committing their code
    to the repository. This strategy not only fosters uniformity but also curtail
    the occurrence of unpredictable issues, thereby streamlining the overall development
    trajectory.


