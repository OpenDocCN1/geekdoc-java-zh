  md: '# Data generator


    Effective non-functional testing demands realistic emulation of real-world conditions,
    including user load and substantial data volume representing long-term use by
    thousands of users and devices. Creating such extensive, authentic, and structurally
    sound datasets poses challenges, often involving millions of records or terabytes
    of data (refer to Figure 11.11):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_567_0.png)


    Figure 11.11: Data generation to fill persistent storage with realistic dataset


    Development teams use data generation tools to address these challenges. While
    some tools upload directly to the database, it can breach microservices encapsulation.
    However, for infrequent, supervised uploads, it may be acceptable for efficiency.
    A balanced approach is creating dedicated bulk-upload features in the interface
    for large-scale data integration.


    Several prominent data generation solutions used for generating large volumes
    of random data, especially for non-functional testing:


    +   • Mockaroo: A flexible, user-friendly tool that allows users to generate custom
