    # # Synchronous calls


    Synchronous communication in microservices is a simple and widely used inter-process
    communication approach, involving simultaneous availability of sender and receiver.
    However, while providing real-time feedback and easy error handling, it may introduce
    latency and coupling between services. There are many ways to implement synchronous
    calls between microservices. Among them, two of the most popular protocols are
    HTTP/REST and gRPC.


    # # Problem


    In microservices architectures, breaking a monolithic application into smaller,
    independent services leads to multiple interactions between these services. When
    relying on synchronous communication, the sender must wait for the receiver''s
    response before proceeding (see Figure 5.1):'
