  md: '+   - Freedom to choose the best-suited database type per service.


    # Cons:


    +   - Challenges in managing distributed data and achieving eventual consistency.


    +   - Situations may arise requiring data synchronization and duplication across
    services.


    +   - Difficulty in implementing queries spanning across multiple services.


    +   - Implementing distributed transactions can be complex.


    # Database sharding


    As a pivotal component in any microservices architecture, databases are frequently
    identified as the primary bottleneck when it comes to performance and handling
    large data volumes. To address this, the database sharding pattern is often employed,
    which segments a large database into smaller, more manageable pieces known as
    shards. Each shard operates as a separate database, hosting a fraction of the
    total data, thus distributing the load across multiple databases (refer to Figure
    6.6):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_322_0.png)


    **Figure 6.6:** Database sharding'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'The selection of the sharding key, a specific data attribute dictating data
    distribution, is a critical aspect of this process. The sharding key directly
    influences how evenly data is distributed, the efficiency of queries, and overall
    scalability of the system.


    There are several methods to define sharding keys, which include:


    +   - Range-based sharding: Data is partitioned based on ranges defined by the
    sharding key. For example, customers could be sharded based on the alphabetical
    range of their last names.


    +   - Hash-based sharding: The sharding key is hashed and the resulting hash value
    determines the shard. This method often provides a uniform distribution of data.


    +   - List-based sharding: Each shard is assigned a list of values. If the sharding
    key matches one of these values, the corresponding shard is chosen.


    +   - Geographic sharding: Sharding is based on geographical considerations. For
    instance, users might be sharded based on their geographical location.


    Implementing database sharding can significantly boost performance and scalability.
    However, it introduces additional complexity, potentially complicating query handling,
    transaction management, and schema maintenance.


    Following are the pros and cons of Database Sharding:


    # Pros:


    +   - Sharding can handle increased data growth by distributing it across multiple
    databases.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '+   - By reducing the size of individual datasets and distributing the load,
    sharding can improve query response times and overall system performance.


    +   - With data spread across multiple shards, a failure in one does not render
    the entire database unavailable.


    +   - Shards can be placed close to users'' locations, decreasing latency and
    improving user experience.


    # Cons:


    +   - Sharding requires careful planning and introduces significant complexity
    into the database design.


    +   - Keeping data consistent across multiple shards can be challenging.


    +   - Queries that span multiple shards can be difficult to handle, potentially
    decreasing performance.


    +   - Once chosen, changing the sharding key can be a daunting and resource-intensive
    task.


    +   - Managing multiple databases can increase administrative overhead and cost.


    # Data migration


    Data migration patterns are essential strategies in the domain of data management,
    particularly in the context of distributed systems such as microservices. They
    provide methods for moving and transforming data from one system to another, whether
    for reasons of system upgrades, changes in data models, transitioning to different
    databases, or distributing data across various microservices. Effectively employing
    data migration patterns can ensure data integrity, minimize downtime, and facilitate
    a seamless transition during the process of migration.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# Problem


    Data migration presents a significant challenge in the realm of software architecture.
    Its complexity arises primarily from the potential disruption it can cause to
    routine operations. When migration is performed during the process of system upgrades,
    it can cause significant interruptions, affecting both system availability and
    user experience. Conversely, executing a migration in parallel with normal operations,
    often referred to as a non-disruptive migration, also introduces its own complexities.
    It requires a thoughtful strategy for managing data consistency, concurrency,
    and synchronization between the old and new systems while ensuring that regular
    operations remain unaffected. Consequently, the design of an efficient and reliable
    data migration strategy that minimizes disruption while maintaining data integrity
    is a critical problem faced by architects in the realm of data management.


    # Disruptive migration


    The disruptive migration pattern involves carrying out a data migration during
    a system upgrade. This pattern is called disruptive because it usually requires
    the system to go offline or become unavailable during the migration process. Particularly
    for large datasets, this process can be quite lengthy, taking several hours or
    even days to complete (refer to Figure 6.7):'
  merge: -1
  pgno: 325
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_326_0.png)


    # Figure 6.7: Disruptive data migration


    In relational databases, a disruptive migration typically involves transforming
    the data schema, often accomplished through SQL commands such as ALTER TABLE.
    These commands modify the structure of tables to conform to the new schema, and
    can either be written manually or generated automatically using specialized tools.


    Several technologies exist that facilitate automated schema migration, including
    but not limited to:


    +   - Flyway: An open-source database migration tool that emphasizes simplicity
    and convention over configuration.


    +   - Liquibase: A powerful open-source tool for managing and tracking database
    schema changes.


    Before initiating a disruptive migration, it is highly recommended to create a
    comprehensive backup of the database. This serves as a safeguard against potential
    errors or issues during migration. If something goes wrong during the migration,
    having a recent backup allows for data recovery and minimizes data loss, offering
    a valuable safety net in the high-stakes process of disruptive migration.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'Following are the pros and cons of Disruptive Migration Pattern:


    # Pros:


    +   - Compared to other methods, disruptive migration is straightforward and relatively
    easy to understand.

    - This method allows for greater control over the migration process, as it happens
    in a single, managed window.

    - Since the system is offline, data consistency is ensured as no new data is being
    written during the migration.


    # Cons:


    +   - The most notable drawback is the inevitable system downtime, affecting the
    availability and user experience.

    - For large datasets, migration can take several hours or days to complete.

    - If a problem arises during migration, it can lead to extended downtime.

    - Since the system is offline, no new data can be backed up during the process.


    # Versioned tables


    Versioned tables is a non-disruptive data migration pattern specifically designed
    for use with relational databases. In this pattern, instead of transforming the
    schema of existing tables, a new table is created with the updated schema. Thus,
    you essentially have two versions of the same table: the original (old schema)
    and the new one (new schema), refer to Figure 6.8:'
  merge: -1
  pgno: 327
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_328_0.png)


    Figure 6.8: Versioned tables migration


    The new version of the table is populated with data transformed from the old table,
    and during this process, both tables coexist. Updates made to the old table (inserts,
    updates, deletes) are also applied to the new table to keep them in sync.


    Once the new table is fully populated and in sync with the original table, a switch
    is made at the application level to start using the new table. This could be as
    simple as changing a configuration setting or modifying the SQL statements in
    the application.


    One of the main benefits of this pattern is that it allows for the migration of
    data without causing disruption to the running application. If any issues arise
    with the new schema during the migration process, the application can simply continue
    using the old table until the issues are resolved.


    On the downside, this pattern can double the storage requirements during the migration
    and increase complexity as updates need to be made to both versions of the tables
    until the migration is complete. Additionally, careful planning and testing are
    necessary to ensure a smooth transition from the old table to the new one.'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Following are the pros and cons of Versioned Tables Pattern:


    # Pros:


    +   - The process allows for migration without disruption to the running application.

    - If any issues arise with the new schema, the application can continue using
    the old table.

    - It enables a controlled transition to the new schema, with the ability to switch
    back if necessary.


    # Cons:


    +   - This pattern can double the storage requirements during the migration.

    - Complexity increases as updates need to be managed in both tables until the
    migration is complete.

    - Rigorous planning and testing are necessary to ensure a smooth transition.

    - The migration process generates additional load on the database and can significantly
    slow down normal operations.


    # Schemaless


    The scheeless data migration pattern is a unique approach used predominantly in
    NoSQL databases that inherently lack rigid schemas. This pattern is particularly
    useful for microservices architecture due to its flexibility and adaptability
    to evolving data structures.


    In a schemaless migration, instead of creating separate tables or updating the
    existing schema, the database is designed to accommodate data in different versions
    simultaneously. Each stored object contains a version field that indicates its
    current schema version. This design allows'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'for a smoother transition to new data versions, without disrupting normal operation
    or requiring significant data movement (refer to Figure 6.9):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_330_0.png)


    **Figure 6.9:** Schemaless data migration


    When microservices read the data, they check the version field of the data object.
    If the data is an older version, the microservice will convert it to the latest
    version on-the-fly. This conversion logic needs to be implemented in the microservice
    to handle all existing versions of the data.


    When data is written, it is always stored as the latest version. Over time, as
    data is read and written, older versions of data are naturally converted to the
    latest version, completing the migration process.


    This pattern offers a non-disruptive way to handle data migration, particularly
    in systems where schema changes are frequent. However, it does require more sophisticated
    handling in the application code to manage different versions of the data, and
    this complexity increases with each new version introduced.'
