- img_proc: true
  md: 'Workflow engines allow developers to model their transaction flow as a state
    machine, abstracting away much of the complexity involved in managing distributed
    transactions. The engines take care of orchestrating the services, handling failures,
    and managing the transaction state. This allows developers to focus more on the
    business logic of their services rather than the intricacies of transaction management.


    Here are some workflow engines suitable for orchestrating sagas in Java-based
    microservices:


    +   - **Camunda Business Process Management (BPM):** A lightweight, open-source
    platform for BPM. It''s written in Java and supports the creation of complex business
    logic workflows and decision tables.

    - **Activiti:** An open-source workflow and BPM platform that is designed to run
    in any Java application, on a server, cluster or in the cloud.

    - **jPM:** An open-source Business Process Management Suite that includes the
    capability to design, execute and monitor business processes throughout their
    life cycle.

    - **Flowable:** A light-weight business process engine written in Java. Flowable
    offers a set of cloud-native building blocks designed to run on scalable infrastructures.

    - **Zeebe:** Developed by the creators of Camunda, Zeebe is a workflow engine
    for microservices orchestration. It can scale horizontally to handle very high
