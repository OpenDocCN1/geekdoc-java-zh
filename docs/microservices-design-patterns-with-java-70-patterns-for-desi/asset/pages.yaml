    Two important patterns used to solve this problem are Generic Configuration Service
    and Specialized Data Microservice.


    # Generic configuration service


    One way to store and manage runtime configurations is to use one of the available
    generic services that keep configuration parameters in key-value format. There
    are several options:


    +   - Etcd: a distributed key-value store https://etcd.io/ It is used by Kubernetes
    itself to store configurations.


    +   - Consul: a service implemented by Hashi Corp https://www.consul.io/ and described
    in the previous Configuration Template / Consul pattern. It is often used as a
    configuration or discovery service and supports many interesting use cases.


    +   - HashiVault: another service from Hashi Corp https://www.vaultproject.io/.
    It is an encrypted keyvalue store primarily used to keep sensitive data like keys
    or passwords. But many teams adopt it as a general-purpose configuration store.


    +   - SpringBoot Configuration Service: a service implemented by VMware Tanzu,
    creators of SpringBoot, with out-of-the-box integration for SpringBoot microservices.
    It is primarily used for Day 1 configurations but can also store and retrieve
    configuration parameters during runtime.'
