    # Chain of Responsibility


    The chain of responsibility (or simply Chain) pattern is a behavioral design pattern
    that allows an event to be processed by one of many handlers, in a decoupled manner.
    In the context of microservices, this pattern provides a way to orchestrate and
    coordinate the processing of a request across multiple services (refer to Figure
    7.4):'
  merge: -1
  pgno: 367
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_368_0.png)


    **Figure 7.4: The Chain of Responsibility pattern**


    In this pattern, a request is passed along a "chain" of potential handler services.
    Each service in the chain either handles the request or forwards it to the next
    service in the chain. The process continues until a service handles the request
    or it reaches the end of the chain without being handled.


    This pattern promotes loose coupling as it avoids binding the sender of the request
    to its receiver by giving more than one service a chance to handle the request.
    It can be beneficial in situations where a request can be processed by any one
    of multiple services, and the specific handler isn''t known at compile time or
    should be dynamically determined.


    For instance, in a payment processing system, you might have different microservices
    to handle different payment methods (credit card, PayPal, bank transfer, etc.).
    When a payment request comes in, it can be passed along the chain until it reaches
    a service that can handle the specified payment method.


    Following are the pros and cons:


    # **Pros:**


    +   - The pattern decouples the sender and receiver of a request, promoting loose
    coupling of services.

    - Provides a flexible way to distribute the handling of requests across multiple
    services.

    - Allows for dynamic determination of which service should handle a request based
    on runtime conditions.'
