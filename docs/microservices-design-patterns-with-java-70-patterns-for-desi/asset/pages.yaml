    # Dynamic configuration


    Dynamic configuration refers to the process of adjusting system settings, variables,
    or parameters during runtime, without requiring a system restart or manual reconfiguration.
    It allows a system to adapt to changing circumstances, such as increased traffic,
    changing user requirements, or new hardware additions.


    # Problem


    As dynamic configurations can be changed at any time, they require three key mechanisms:


    +   - A persistent storage that can hold configuration parameters

    - A command line or GUI tool to change that parameter by an administrator

    - A method to read configuration parameters in real time


    At the same time, microservices must be implemented in a way that they can obtain
    the latest configuration version after value changes. This can be done via notifications,'
