  md: 'of new features to a subset of users, enabling teams to monitor performance
    and gather user feedback before a full-scale launch. A/B testing, on the other
    hand, facilitates the comparison of two or more variants of a feature to determine
    which one performs better in terms of user engagement and conversion. Segmentation
    allows for tailoring feature availability to specific user groups, providing a
    more personalized user experience. Sticky sessions, often used in load balancing,
    help ensure that a user consistently interacts with the same server, which can
    be essential for maintaining session-based application states. These techniques,
    while distinct from feature flags, play a crucial role in the broader arsenal
    of tools available to developers and product managers for effective software delivery
    and optimization.


    # Antipatterns


    The most common anti-patten that can be found in microservices implementation
    is mixing Day 0, Day 1 and Day2 configurations and exposing them all at deployment
    time. Some of most frequent cases are:


    +   **Opening development time configurations in production.** Developers expose
    configuration parameters intended for modification during development and carry
    them forward to deployment, increasing the number of parameters and cognitive
    load for deployment engineers. Moreover, mistakenly altering development time
    configurations can cause further complications.


    +   **Setting runtime configurations during deployment.** Proper configuration
    is crucial for system functionality but configuring all settings at once can be
    lengthy and error-prone. A better approach is to separate into Day 1 and Day 2
    phases. During deployment, only essential Day 1 configurations should'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'be set, and non-essential Day 2 configurations disabled or set to defaults.
    After the system has been started, engineers can use tools to implement necessary
    Day 2 configurations.


    +   **Manual wiring of internal services.** Microservices systems typically consist
    of numerous components, sometimes ranging from tens to hundreds. Manually configuring
    internal interconnections during deployment can make the process complicated and
    error-prone. To mitigate this, teams should explore automating the process. This
    can be achieved by scripting deployment environments and utilizing available patterns
    to automate connection configurations.


    +   **Hardcoded environment profiles.** A very common anti-pattern is the practice
    of hardcoding deployment time configurations in "environments" or "profiles,"
    which are then selected during deployment. While this may seem like a convenient
    approach, it results in coupling between code and deployments. Any changes made
    to deployment configurations require changes throughout the entire codebase, which
    can occur frequently. In optimal microservices implementations, all Day 1 configurations
    should be external. Microservices should remain unchanged for extended periods
    and be deployable in any environment.


    # Conclusion


    Through this chapter, we have gained knowledge about three distinct configuration
    types - Day 1, Day 2, and Day 3, which correspond to configurations executed during
    development, deployment, and runtime stages. It is crucial to distinguish between
    these configurations to ensure simplicity and clarity in the configuration process.'
