    # Hardcoded configuration


    The term hardcoded configuration describes the inclusion of specific settings
    or values directly into a software system or application.


    # Problem


    When development-time configuration parameters are set as hardcoded numbers in
    the code, it becomes extremely difficult to find and change them. Placing them
    as constants at the top of a class where they are used is a better option. But
    in large components, locating them may present difficulties.


    # Solution


    A recommended approach is to collect all Day 0 configuration parameters in a microservice
    and put them into a GlobalConstants class. Place the class where it can be easily
    found. Give each parameter a meaningful name and add comments to explain the parameter''s
    purpose and acceptable values. The following code shows how to do this (code snippet
    4.1):


    +   1. public static class GlobalConstants {

    2. public static final int HTTP_PORT = 8080;

    3. public static final int HTTP_TIMEOUT = 1000; // in milliseconds

    4. public static final int HTTP_MAX_RETRIES = 3; // do not set more than 3!

    5. ...

    6. }'
