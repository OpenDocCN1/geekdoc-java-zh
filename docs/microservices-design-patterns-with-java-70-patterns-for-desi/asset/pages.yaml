    # Symmetric deployments


    In symmetric deployments, infrastructure services must offer consistent APIs and
    capabilities so that microservices can be tested and implemented against them.
    This ensures that when microservices are deployed in a new environment, all infrastructure
    services adhere to the same set of APIs (Figure 2.16):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_98_0.png)


    There are two primary approaches to provide consistent deployment environments
    across all supported on-premises and cloud platforms.


    **Common low denominator approach**, which involves selecting infrastructure services
    that are available on all'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'platforms. Some of these services are natively supported and managed by the
    infrastructure provider, which provides elasticity and reduces the total cost
    of ownership. If the provider does not offer managed services, the team can provide
    them in-house. Such services include databases like MySQL, Postgres, and Mongo,
    message brokers like Kafka and MQTT, caching services like Memcached and Redis,
    and container orchestration software like Kubernetes.


    **Containerized infrastructure** approach, which does not rely on the capabilities
    of deployment platform and deploys the required containerized infrastructure services
    next to system microservices. As container orchestrators like Kubernetes became
    more capable to reserve capacity and guarantee the stability and performance of
    stateless containers, this approach is becoming increasingly popular.


