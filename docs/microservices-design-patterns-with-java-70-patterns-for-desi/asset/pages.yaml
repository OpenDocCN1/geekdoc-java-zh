    # Blob streaming


    In a microservices system, the need to transfer large binary objects as images,
    videos, or other sizable data blobs is not uncommon. This process, can be challenging
    due to network constraints, memory usage, and the potential for latency in sending
    and receiving large amounts of data.


    # Problem


    Microservices systems face significant challenges when transferring large binary
    objects (BLOBs). This is due to the inherent complexities related to the size
    of the data, networking overhead, bandwidth utilization, latency, and failure
    recovery. Transfering these large BLOBs can disrupt system performance and affect
    service reliability.


    When using synchronous communication methods, such as HTTP or gRPC, the problems
    are magnified. Synchronous protocols wait for a response after sending a request,'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'meaning they block further execution until the response is received. This can
    lead to long wait times when sending or receiving large binary objects due to
    the time it takes to serialize, transfer, and deserialize the data. Additionally,
    issues such as network latency and timeouts become significant problems, causing
    system disruptions and failures.


    Asynchronous communication can alleviate some of these issues as it allows the
    system to continue execution without waiting for the response. However, it introduces
    its own complexities, such as limitation of message size, managing message order
    and ensuring data consistency.


    # Continuous streaming


    This approach involves sending the large binary objects as a continuous stream
    of data. This can reduce the latency associated with transferring the entire object
    at once. It is especially beneficial when used with protocols designed for streaming,
    such as gRPC or HTTP/2. However, streaming requires careful handling to ensure
    data consistency and order, especially in unreliable network conditions.


