    # Following are the pros and cons of Rate Limiter Pattern:


    # Pros:


    +   * Rate limiting safeguards system resources from being overwhelmed by a high
    number of requests, thereby protecting the availability and performance of the
    service.

    * It helps to prevent service abuse or misuse, whether accidental or malicious.

    * By limiting the number of requests a single client can make, rate limiting ensures
    that resources are distributed fairly among multiple clients.


    # Cons:


    +   * Overly restrictive rate limits can negatively impact the client experience,
    leading to frustration if legitimate requests are being blocked.

    * Implementing a sophisticated rate limiting algorithm that can adapt to the system''s
    current state can add complexity to the system design.

    * Fixed rate limits might not work well in a scaling scenario where the number
    of requests can fluctuate dramatically.


    # Circuit breaker


    The Circuit Breaker pattern in microservices architecture prevents a network or
    service failure from cascading to other'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'services by halting the flow of calls to a failing service. It works by wrapping
    a protected function call, monitoring failures. When failures surpass a threshold,
    the circuit breaker ''trips'', and further calls return an error without making
    the protected call. This pattern safeguards against cascading failures and helps
    maintain system resilience by allowing the faulty service to recover (See Figure
    5.15):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_269_0.png)


    **Figure 5.15:** Invocation of a microservice with or without circuit breaker


    The circuit breaker maintains a state that changes based on the results of the
    function it calls (See Figure 5.16).


    ![](img/b9fea7997a6c6746f4f9a853213ba905_269_1.png)


    **Figure 5.16:** Circuit Breaker states


    The typical states are Closed, Open, and Half-open:


    +   - **Closed:** The circuit breaker allows calls to the function. If calls fail
    more than the defined threshold, it moves to the Open state.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '+   - **Open**: The circuit breaker blocks calls to the function and returns
    an error immediately. After a set recovery period, it moves to the Half-Open state.


    +   - **Half-Open**: The circuit breaker allows a limited number of calls to go
    through. If those calls succeed, it moves back to the Closed state. If they fail,
    it returns to the Open state.


    Circuit breaker pattern can be implemented using libraries such as Netflix Hystrix,
    Resilience4j or Spring Cloud circuit breaker for Java applications.


    # Following are the pros and cons of Circuit Breaker Pattern:


    # Pros:


    +   - The circuit breaker pattern increases the resilience of a system by preventing
    cascading failures and giving failing services time to recover.


    +   - By preventing further damage from a failing service, the pattern contributes
    to overall system stability and availability.


    +   - Clients are not left hanging for a response from a failing service. The
    pattern promotes the fail-fast approach, reducing the impact on system performance.


    # Cons:


    +   - Implementing a circuit breaker can add complexity to the system. Developers
    need to decide on the threshold for failures, the timeout period, and manage the
    state transitions.


    +   - Circuit breakers depend on external services to reset their state. If these
    services are not reliable, it can lead to problems.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '+   • If monitored correctly, a tripped circuit breaker can mask the underlying
    problem of a consistently failing service.


    # Client library


    The client library pattern simplifies the integration between clients and services
    in microservice systems. It provides a pre-packaged code library that clients
    can include in their applications, abstracting away the complexities of interacting
    with the service''s API. By using a client library, developers can focus on their
    application logic while ensuring consistent and correct usage of the service.
    However, maintaining and versioning the library for different languages and managing
    coupling between clients and the library can pose challenges.


    # Problem


    In order to call a microservice, consumers need to develop a client and implement
    a communication protocol. Assuming that microservice consumers are more than one
    it is impractical to develop that code multiple times. Also microservice developers
    have intimate knowledge of the API and are able to develop an optimal and reliable
    client much faster. Then that code can be packaged as a client library, released
    and shared by all consumers.


    Often critiques of the pattern say that it can tightly couple client applications
    to the library, making it difficult to switch or update the library, as well as
    to adapt to changes in the service''s API. To mitigate those issues you should
    follow a few recommendations:


    +   • Follow dummy pipes and smart endpoints principle. Do not place complex logic
    into a client. The client should only be responsible for implementation of the'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'communication protocol, and optionally, offer convenience methods and optimizations.


    +   * Version the client library.

    * Use only versioned dependencies for the client library and minimize their number.


    # Solution


    A client library typically contains data objects, abstract client interface and
    one or more implementations to call the microservice using supported protocols
    (See the Figure 5.17):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_272_0.png)


    **Figure 5.17:** Typical structure of a client library


    To increase value for consumers, a client library, in addition to implementation
    of clients for Inter-process communication protocols, can include the following:


    +   * Random data generators to enable generation of realistic pseudo-random data
    for non-functional testing.


    +   * Mock clients to cut dependencies and enable unit testing for consumer code.'
