    # Point-to-point


    Point-to-point communication utilizes queues as a dedicated channel for exchanging
    messages between a single sender and a specific receiver. This pattern ensures
    delivery in the correct order, even when the receiver is temporarily unavailable.
    In a microservices architecture, point-to-point communication allows for better
    handling of service-specific interactions, where one service generates a unique
    identifier and another service stores the user''s details. By enabling services
    to operate independently and asynchronously, this pattern promotes efficient resource
    management and prevents bottlenecks in scenarios that require direct and secure
    communication between two distinct services (See Figure 5.2):


