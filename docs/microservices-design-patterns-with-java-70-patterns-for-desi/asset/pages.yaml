  md: 'Representational State Transfer (REST) is an architectural style that builds
    upon HTTP, outlining a set of conventions and best practices for designing networked
    applications. RESTful services use HTTP methods and identify resources while employing
    standard media types, such as JSON or XML, for data exchange. The stateless nature
    of REST simplifies the management of services, promotes loose coupling, and ensures
    scalability.


    Examples of REST Interface:


    +   - GET /products: Retrieve a list of products

    - GET /products/{id}: Retrieve a specific product by its ID

    - POST /products: Create a new product

    - DELETE /products/{id}: Delete a product by its ID


    While REST is not a standard but rather a set of guidelines, it remains a popular
    choice for HTTP-based communication in microservices. However, it is worth noting
    that some systems may not strictly adhere to its conventions. RESTful HTTP communication
    leverages the same HTTP methods and data exchange formats, but it may not fully
    conform to REST principles.


    For a similar example of a product management microservice, a non-RESTful interface
    might use custom or non-standardized URIs and methods:


    +   - GET /getAllProducts: Retrieve a list of products

    - GET /getProduct?id={id}: Retrieve a specific product by its ID

    - POST /createProduct: Create a new product'
