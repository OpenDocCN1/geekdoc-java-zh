    # Following are the pros and cons of Retries

    Pattern:


    # Pros:


    +   - Retries can improve the reliability of a system by automatically re-attempting
    operations in the face of temporary failures.

    - It can help in achieving graceful degradation of the system by ensuring that
    transient faults do not result in immediate operation failure.

    - The pattern can be customized with various strategies such as exponential backoff
    and jitter, providing better control over how and when retries are performed.


    # Cons:


    +   - Frequent retries can put a strain on the system resources, especially in
    high load scenarios or in case of prolonged failures.

    - It can increase the overall latency of the system, as it adds waiting time before
    retries.

    - Without proper control mechanisms, retries can lead to "retry storms", where
    repeated retries amplify the load on a struggling service, making it even harder
    for the service to recover.


