    # # Transferring blob IDs


    Instead of transferring the entire binary object, the systems can exchange unique
    identifiers (IDs) representing these objects. The receiver can then fetch the
    object when required. This significantly reduces the data transferred during inter-service
    communication. However, this pattern requires a robust and efficient object storage
    and retrieval system, adding complexity to the architecture (See Figure 5.9):


