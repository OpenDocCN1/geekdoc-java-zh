  md: '# Problem


    To build a well-protected system it is important to understand vectors of attacks.
    Despite common beliefs that many people share, hacking public APIs is only one
    possible vector responsible for a relatively small percentage of attacks. Typical
    attack vectors on microservices systems are presented in Figure 2.13:


    ![](img/b9fea7997a6c6746f4f9a853213ba905_90_0.png)


    Figure 2.13: Typical attack vectors in microservices systems


    Typical attack vectors include:


    +   - **Attacks against public APIs:** Unauthorized access, interception of communication,
    DoS attacks, SQL injection, and so on.


    +   - **Unauthorized access via maintenance windows:** That is where hackers can
    get root access into the system.


    +   - **Attacks against external integration points:** Similar to attacks against
    public APIs and maintenance windows.


    +   - **Code injections:** These can include malicious code injected into the
    codebase, Trojans injected via binary'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'dependencies, and injections of code and binaries during the build process.


    To address security threats and protect the system, the architect has to decide
    on several mechanisms:


    +   - Authentication (identity management and propagation)

    - Authorization (access permissions)

    - Privacy (secure communication, data protection, and encryption)

    - Security monitoring and auditing (security logs)


    Security is a serious topic that requires special attention. The solutions presented
    below are intended only to help navigating between architectural options and must
    not be as comprehensive advice. When dealing with security aspects, the reader
    should use its own judgment and seek professional advice when needed.


    # Zero trust model


    The zero trust security model is an approach to system security that assumes no
    user, device, or component can be trusted by default. This model aims to minimize
    the risk of unauthorized access and data breaches by requiring constant verification
    and validation for any entity attempting to access resources within a system (Figure
    2.14):'
  merge: -1
  pgno: 91
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_92_0.png)


    The key principles of the zero trust security model include:


    +   - **Never trust, always verify:** Trust is not granted automatically based
    on the location or network segment. Instead, every user, device, and application
    must be authenticated and authorized before being granted access to resources,
    regardless of whether the access originates from inside or outside the network
    perimeter.

    - **Least privilege access:** Users, devices, and applications should only be
    granted the minimum level of access necessary to perform their tasks. This limits
    the potential attack surface and reduces the risk of unauthorized access to sensitive
    data.

    - **Micro-segmentation:** This involves dividing the system into smaller, isolated
    parts based on specific criteria, such as a microservice or group of microservices.
    This approach reduces the potential blast radius in case of a security breach
    and restricts lateral movement for attackers within the network.

    - **Context-aware security:** Relies on real-time, context-aware security policies
    that consider factors such as'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'user identity, device posture, location, and time of day. These dynamic policies
    enable adaptive security controls that can respond to changing conditions and
    risks.


    +   - **Continuous monitoring and validation**: Security is an ongoing process
    that requires continuous monitoring and validation of user and device behavior.
    This includes logging and analysing security events, detecting anomalies, and
    implementing automated responses to potential threats.


    +   - **Data-Centric Security**: Focuses on protecting data at its core, ensuring
    that sensitive information is encrypted and secured both in transit and at rest.
    By prioritizing data protection, the zero trust model reduces the risk of data
    breaches and ensures the confidentiality, integrity, and availability of critical
    information.


    The zero trust security model is implemented by using modern security technologies
    and practices such as **Multi-Factor Authentication (MFA), Role-Based Access Control
    (RBAC), Attribute-Based Access Control (ABAC)**, and advanced threat detection
    and response solutions. This model provides organizations with a resilient and
    adaptive security posture that protects their valuable data and resources from
    an ever-evolving threat landscape.


    Following are the pros and cons of zero trust model:


    # **Pros:**


    +   - Reducing attack surface and minimizing the risk of unauthorized access to
    sensitive data and resources.


    +   - Limits the ability of attackers to move laterally within the system, containing
    potential breaches and minimizing the blast radius.'
