  md: '# API versioning


    Application Programming Interfaces (APIs) play a crucial role in microservices
    architecture by enabling communication between services. Over time, APIs may require
    changes or enhancements to accommodate new features, bug fixes, or performance
    improvements. API versioning is a strategy to manage these changes without affecting
    existing clients or breaking functionality.


    # Problem


    Correct implementation of microservices architecture demands that every microservices
    has a totally independent lifecycle. They shall be developed and deployed independently
    from other microservices. However, microservices must communicate with each other.
    And changes in call signatures or message formats in microservice API can break
    consumers. To prevent that from happening all microservice APIs must be versioned.


    Unfortunately, API versioning is often overlooked by inexperienced developers
    and became one of top reasons why microservices systems turn into distributed
    monoliths. Adding versioning as an afterthought is hard. So, it is recommended
    to implement API versioning from day 1. When it''s done, fast evolution of microservices
    in a system should not be a problem, and incremental delivery should be possible.


    To implement API versioning, a microservice, in addition to the most recent API
    version, must also expose one or few older versions for backward compatibility
    with existing consumers. Migration of consumers to a newer version should not
    be forced. Instead, it should happen as a part of natural evolution (See Figure
    5.4):'
  merge: -1
  pgno: 223
- img_proc: true
  md: '![](img/b9fea7997a6c6746f4f9a853213ba905_224_0.png)


    Figure 5.4: Evolution of microservice API


    It is important to understand that not change in API shall be “breaking”. Modern
    communication technologies allow adding optional fields and optional methods without
    breaking backward compatibility. Those changes are allowed in “minor” microservice
    releases and do not require developing a whole new API version.


    # Versioned channels


    One approach to add a new version to a microservice API to expose it via a new
    endpoint. In the case of HTTP or gRPC this can be a controller exposed via a separate
    TCP port. For async messaging, it can be a separate queue (refer to Figure 5.5):


    ![](img/b9fea7997a6c6746f4f9a853213ba905_224_1.png)


    Figure 5.5: API versions exposed via separate TCP endpoints or message queues'
