    # CRUD


    The CRUD (Create, Read, Update, Delete) pattern, a cornerstone of data management,
    outlines the four fundamental operations performed on any persistent data storage:


    +   - **Create**: This operation represents the insertion of new data into the
    storage system. This typically equates to the instantiation of a new entity or
    object.

    - **Read**: This operation refers to the retrieval of existing data from the storage.
    It is an operation that allows viewing of data without making alterations.

    - **Update**: This operation signifies modifications to existing data within the
    storage, including alteration of attribute values or relationships.

    - **Delete**: This operation denotes the elimination of existing data from the
    storage system.


    One of the defining characteristics of the CRUD pattern is that it employs the
