    # Chaos Monkey


    Ensuring system reliability is a cornerstone of modern technology. To bolster
    this, a defensive coding strategy, where potential failures are anticipated, becomes
    essential. The **Chaos Monkey** pattern exemplifies this approach. In microservices
    architectures, deliberate failures are introduced, compelling the system to adapt
    and recover. Though initially challenging, this method cultivates the development
    of resilient systems that excel in challenging conditions.


    # Problem


    Systems can break down unexpectedly, as *Verner Vogles* once pointed out, saying
    *everything fails all the time*. To make software strong against such breakdowns,
    developers need to write protective code. But even with regular checks and tests,
    some problems might still go unnoticed. Discovering these issues later can make
    them harder to fix. The Chaos Monkey approach helps by purposely causing problems
    to see if the system can handle them. So, the big question is: How can developers'
  merge: -1
  pgno: 574
- img_proc: true
  md: 'regularly find and fix these hidden issues to make their software more reliable?


    # Solution


    The Chaos Monkey pattern, inspired by Netflix''s strategy, disrupts a system with
    planned failures. Rather than waiting for unplanned issues, it actively introduces
    disruptions, even in live production. The idea is that a strong system should
    recover from these disruptions. If not, fixing the vulnerability becomes a priority.
    Initially challenging for teams, it encourages robust system design and improves
    reliability with time.


    To simulate the Chaos Monkey behavior in a Spring Boot application, you can use
    an application event listener coupled with Spring’s environment to read configuration
    properties. Here is a simple illustration:


    # ChaosMonkey configuration:


    Using application.properties or application.yml for external configuration (Code
    snippet 11:14):


    +   1. chaosmonkey.ttf=6000 # Mean time to fail in milliseconds (60 seconds in
    this example)

    2. chaosmonkey.probability=0.1 # 10% failure probability


    ChaosMonkey component (Code snippet 11:15):


    ```

    1. @Component

    2. public class ChaosMonkey {

    3.

    4. @Value("${chaosmonkey.ttf}")

    5. private long mttf;

    6.

    7. @Value("${chaosmonkey.probability}")

    8. private double probability;

    ```'
