  md: 'There are many ways to organize code in a microservice (or a software component
    in general). However, without clear rules, code organization in microservices
    can be inconsistent. The two most common ways to organize code are functional/domain-driven
    and technology-based.


    # Functional / domain-driven code structure


    Functional/domain-based code organization is suitable for monolithic systs. For
    microservices, this may not be the case, as they have a single responsibility
    and are relatively small, making the code belong to a single or a few functional
    areas.


    Facades are an exception to this, as they contain multiple controllers and export
    complex APIs. Thus, it is better to separate the controllers based on their domains
    instead of putting them all in a single package. A typical file organization may
    look like this:


    ```

    Root directory:

    /java/com/organization-name/facade

    Subdirectories:

    /infrastructure/version1

    /observability/version1

    /users.version1

    /resources

    ```


    Figure 3.4: Functional/domain-based organization


    Following are the pros and cons of code structure:


    # Pros:


    +   - Separates code that belongs to different functional areas/domains and adds
    logical meaning.'
