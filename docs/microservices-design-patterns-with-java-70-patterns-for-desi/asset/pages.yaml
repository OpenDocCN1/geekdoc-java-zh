    # Retries


    The retries pattern in microservices is a resilience strategy where a failed operation
    is automatically re-attempted, often used for transient failures. This pattern
    enhances the system''s reliability by increasing the chances of an operation''s
    eventual success. A common approach is to implement retries with exponential backoff,
    where the delay between retries doubles with each failed attempt, preventing overloading
    of the service. However, care must be taken to avoid ''retry storms'' and retries
    should only be used for operations that are safe to retry, such as idempotent
    operations. Figure 5.13 illustrates the invocation of a microservice with and
    without retries:


    ![](img/b9fea7997a6c6746f4f9a853213ba905_263_0.png)


    Figure 5.13: Invocation of a microservice with or without retries'
