  \n## 3.18 总结\n\n![img](img/00009.jpeg) 面向对象的编程涉及使用类和对象。使用预定义的类可以缩短开发时间并创建可靠的程序。\n\
  \n![img](img/00009.jpeg) 面向对象的编程优点包括封装性、重用性和可靠性。\n\n![img](img/00009.jpeg) 类由数据以及对数据进行的操作组成。对象是使用类创建的。使用\
  \ `new` 关键字来实例化对象。\n\n![img](img/00009.jpeg) 对象引用是对象的变量名并指向数据。\n\n![img](img/00009.jpeg)\
  \ 类的数据称为字段，由实例变量和静态变量组成。类的指令称为方法。方法获取数据的值或提供其他服务。\n\n![img](img/00009.jpeg) 方法名、参数列表和返回值被称为该方法的应用程序编程接口\
  \ (API)。声明为 `public` 的方法可以被类的客户端调用。\n\n![img](img/00009.jpeg) 按照惯例，Java 中的类名以大写字母开头。方法名、实例变量和对象名以小写字母开头。在这些名称中，嵌入的单词以大写字母开头。\n\
  \n![img](img/00009.jpeg) 当程序进行方法调用时，控制转移到方法中的指令，直到方法执行完毕。然后控制传回程序。\n\n![img](img/00009.jpeg)\
  \ 实例方法使用对象引用和点符号进行调用。\n\n![img](img/00009.jpeg) 构造函数在实例化对象时被调用。构造函数与类名相同，其作用是初始化对象的数据。类可以有多个构造函数。构造函数没有返回值。\n\
  \n![img](img/00009.jpeg) 方法的数据类型称为方法的返回类型。如果数据类型不是 `void` 关键字，方法将向程序返回一个值。当返回值方法执行完毕时，其返回值将替换表达式中的方法调用。\n\
  \n![img](img/00009.jpeg) 访问方法（也称为 `gets`）允许客户端检索对象数据的当前值。变器方法（也称为 `sets`）允许客户端更改对象的值。\n\
  \n![img](img/00009.jpeg) 当对象引用首次被声明时，其值为 `null`。尝试使用 `null` 对象引用调用方法会产生错误。\n\n\n\
  \n\n\n![img](img/00009.jpeg)垃圾回收器偶尔运行，并删除没有对象引用指向它的对象。\n\n![img](img/00009.jpeg)Java\
  \ 程序包（packages）是根据功能排列的类组。`java.lang` 包中的类对 Java 程序是自动可。其他类需要导入。\n\n![img](img/00009.jpeg)`String`\
  \ 类可用于创建由字符序列组成的对象。`String` 构造函数接受 `String` 字面量、`String` 对象或不接受参数（不接受参数创建一个空 `String`）。`length()`\
  \ 方法返回 `String` 对象中字符的数量。`toUpperCase()` 和 `toLowerCase()` 方法返回大写或小写的 `String`。`charAt()`\
  \ 方法从 `String` 中提取一个字符，而 `substring()` 方法从一个 `String` 中提取另一个 `String`。`indexOf()`\
  \ 方法在 `String` 中搜索某个字符或子字符串。\n\n![img](img/00009.jpeg)位于 `java.text` 包中的 `DecimalFormat`\
