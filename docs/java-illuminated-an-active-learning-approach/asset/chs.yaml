  \n![img](img/01180.jpeg)\n\n调用者只需传递数组名称（不带括号），并将返回值赋值给引用。\n\n例如，假设我们要统计选举票数。有四个候选人在六个地区竞选。我们想知道每个候选人收到了多少票，每个地区投了多少票。因此，我们可以建立一个二维数组，每行代表一个地区，每列代表一个候选人，元素值代表该候选人在该地区获得的票数。我们需要计算每行的和以得到每个地区的票数，并计算每列和以得到每个候选人的票数。\n\
  \n为了实现这一点，我们创建一个 `Tally` 类，它有一个二维数组实例变量 `voteData` 用于存储票数。`Tally` 类还有一个方法 `arrayTally`，它将计算\
  \ `voteData` 每一列和每一行的和。这些和将以二维数组的形式从方法返回。第一行存储 `voteData` 每一列的总和，第二行存储 `voteData`\
  \ 每行的总和。\n\n示例 9.9 展示了 `Tally` 类。\n\n![img](img/01181.jpeg)\n\n![img](img/01182.jpeg)\n\
