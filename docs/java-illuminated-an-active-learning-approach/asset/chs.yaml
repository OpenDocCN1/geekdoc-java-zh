  在变器方法中编写实例变量的验证代码，并让构造函数调用变器方法来设置初始值。\n\n![img](img/00756.jpeg)\n\n**示例 7.6    \
  \  *Auto* 客户端，版本 3**\n\n在示例 7.6 中，我们的客户端实例化了一个 `Auto` 对象 `suv`（第 9 行），并打印其实例变量的值（第\
  \ 11–14 行）。然后我们调用每个变器方法，为每个实例变量设置新值（第 16–19 行）。我们再次打印实例变量的值（第 21–24 行），以显示值已经更改。然后，在第\
  \ 27 行，我们尝试为 `milesDriven` 设置一个无效值。如图 7.3 所示，变器方法打印了错误信息并没有更改值，我们通过再次打印实例变量的值（第\
  \ 28–31 行）验证了这一点。\n\n当一个方法开始执行时，参数已经定义并被分配了客户端发送的值。当客户端调用第 17 行的 `setModel` 方法时，当方法开始执行时\
  \ `newModel` 参数的值为 `Sportage`。\n\n编写变器方法时的一个常见错误是使用实例变量名作为参数名。当方法参数与实例变量同名时，参数会“隐藏”实例变量。换句话说，参数具有**名称优先权**，因此对该名称的任何引用都指向参数而不是实例变量。\n\
  \n例如，此编写错误的方法的意图是为 `model` 实例变量设置新值：\n\n![img](img/00757.jpeg)\n\n由于参数 `model` 与实例变量\
  \ `model` 具有相同的标识符，该方法的结果是将参数的值赋值给参数本身！这被称为 `No-op`，全称“No operation”（无操作），因为该语句没有产生影响。为了避免这种逻辑错误，请为参数选择一个不同的名称。为了避免名称冲突，我们使用\
  \ `newInstanceVariable` 模式命名每个参数。\n\n![img](img/00758.jpeg)\n\n**图 7.3**\n\n***Auto*\
  \ 客户端，版本 3 的输出**\n\n另一个类似的常见错误是声明一个与实例变量同名的局部变量，如下所示编写错误的方法所示：\n\n![img](img/00759.jpeg)\n\
  \n方法声明的任何变量都是局部变量，因为其作用域局限于方法。因此，声明的变量 `model` 是 `setModel` 方法的局部变量。\n\n使用上述代码，`model`\
  \ 局部变量隐藏了与其同名的实例变量，因此方法将参数值赋值给了局部变量，而不是实例变量。结果是 `model` 实例变量的值保持不变。\n\n实例变量 `model`\
  \ 已经在类中定义了。因此，方法应该简单将参数值赋值给实例变量，而不要尝试在方法中（再次）声明实例变量。\n\n最后，另一个常见错误是如下所示声明参数：\n\n\
  ![img](img/00760.jpeg)\n\n此代码生成了此编译器错误：\n\n![img](img/00761.jpeg)\n\n![img](img/00005.jpeg)\
  \ **常见错误陷阱**\n\n注意，与实例变量同名的方法参数或局部变量会隐藏该实例变量。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\
  \n不要在方法体内部声明参数。当方法开始执行时，参数已经存在并已被分配了客户端在方法调用中设置的值。\n\n## 7.7 编写数据处理方法\n\n现在我们终于开始处理类的核心业务。通常，你定义一个类不仅是为了封装数据，还为了提供某些服务。因此，你会提供一个或多个方法来执行类的功能。这些方法可能会根据实例变量计算值，或以某种方式操作实例变量。\n\
