  \ 3.1，对象引用 `independenceDay`、`nextCentury` 和 `defaultDate` 指向对象数据的位置。\n\n```\n![img](img/00005.jpeg)\
  \ 常见错误陷阱\n```\n\n不要忘记实例化你程序需要的所有对象。对象必须在使用之前进行实例化。\n\n## 3.3 调用方法\n\n一旦实例化了对象，我们就可以通过调用方法来使用它们。正如我们之前提到的，类的\
  \ API 发布了哪些可用方法以及如何调用它们。图 3.2 说明了调用方法时的控制流。\n\n方法调用可能会或不会返回值，这由方法名前面的数据类型、类类型或 `void`\
  \ 关键字指示。\n\n```\n![img](img/00199.jpeg)\n```\n\n图 3.2：方法调用控制流\n\n此时，JVM 将控制权转移到方法。当方法执行完毕时，JVM\
  \ 将将控制权传回程序。\n\n类 API 由方法名、其返回值及其参数列表组成。参数列表指示要发送方法的参数顺序和数量。参数列表中的每一项可以是字面量、变量或任何求值为\
  \ API 中指定数据类型的表达式。例如，在表 3.1 中，`setMonth` 方法接受一个参数，该参数必须求值为整数值。\n\n如果方法返回值，则数据类型或类类型将位于方法名前。方法调用将在表达式中使用。当方法执行完毕时，其返回值将替换表达式中的方法调用。如果方法名前是\
  \ `void` 关键字，则方法不返回值。因为 `void` 返回类型的方法没有值，因此不能在表达式中使用；相反，对 `void` 返回类型方法的调用是一个完整的语句。在表\
  \ 3.1 中，`setYear` 方法是一个 `void` 方法。\n\n你在 API 方法调用前面看到的另一个关键字是 `public`。该关键字意味着类的任何客户端都可以调用该方法。如果方法名前面是\
  \ `private`，则只有该类的其他方法可以调用该方法。虽然我们不会正式在 API 中包含 `public` 关键字，但我们在本章讨论的所有方法都是 `public`\
  \ 的。\n\n要调用类对象的方法，我们使用**点符号法**，如下所示：\n\n```\n![img](img/00200.jpeg)\n```\n\n对象引用紧跟着一个**点**（句号），紧接着是方法名。（在本章稍后的部分中，当我们调用*静态*方法时，我们将用类名代替对象引用。）方法的参数封装在括号内。\n\
  \n\n\n\n让我们再次观察 `SimpleDate` 类的方法。`SimpleDate` 类 API 中的前三个方法接受一个空参数列表并返回一个 `int`；因此，这些方法的返回值类型为\
  \ `int`。你可以在程序中任何可以使用 `int` 的表达式中调用这些方法。第一个方法 `getMonth()` 的值是对象中月份的值。同样，`getDay()`\
  \ 的值是对象中日期的值，而 `getYear()` 的值是年份的值。这些“get”方法在形式上被称为**存取器方法（accessor methods）**；它们允许客户端访问对象实例变量的值。\n\
  \n`SimpleDate` 类 API 中的接下来三个方法接受一个 `int` 类型的参数，并且不返回值，这通过关键字 `void` 来表示。这些方法在独立语句中被调用。第一个方法\
  \ `setMonth(int mm)` 将对象中的月份更改为方法参数 `mm` 的值。同样，`setDay(int dd)` 更改对象中的日期，`setYear(int\
  \ yy)` 将对象中的年份更改为方法参数的值。这些“set”方法在形式上被称为**修改器方法（mutator methods）**；它们允许客户端更改对象实例变量的值。\n\
