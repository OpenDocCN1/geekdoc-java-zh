  \ 21 行提示输入平均分（一个 `float` 值）。第 22 行捕获用户输入的数字并赋值给 `float` 变量 `gpa`，第 23 行输出 `gpa`\
  \ 的值。\n\n![img](img/00004.jpeg) **软件工程提示**\n\n为用户提供清晰的输入提示。提示应该使用用户能理解的语言编写，并描述所请求的数据以及对有效输入值的限制。\n\
