  \ value）是什么？\n2. 解释引导读取的作用。\n\n## 10.0 计数控制循环\n\n`while` 循环可以用于事件驱动或计数控制循环。`for`\
  \ 循环对于计数控制循环特别有用。由于循环控制都包含在 `for` 头部，你可以很容易地看到什么条件会停止循环以及条件如何更新。\n\n### 10.1 for\
  \ 循环结构\n\n`for` 循环具有如下语法：\n\n```\n![img](img/00630.jpeg)\n```\n\n注意 `for` 头部中的初始化、条件和循环更新用分号隔开。注意\
  \ `for` 头部右括号后面没有分号。\n\n`for` 循环的控制流如图 6.19 所示。当遇到 `for` 循环时，执行初始化语句。然后评估条件。如果条件为真，执行循环体，然后执行更新语句，再次评估条件。同样，如果条件为真，则执行循环体，直到条件为假。\n\
  \n`for` 循环等同于下面的 `while` 循环：\n\n```\n![img](img/00631.jpeg)\n```\n\n#### \n\n通常，我们在\
  \ `for` 循环中使用**循环控制变量**；该控制变量通常用于计数。我们在初始化语句中设置它的初始值，在循环更新语句中对其加减，并在循环条件中检查它的值。\n\
  \n例如，如果我们想要五个整数的和，我们知道循环体应该执行五次——每个整数一次。我们在初始化语句中将循环控制变量设置为 1，在循环更新语句中将控制变量加 1，并在循环条件中检查它是否小于等于\
  \ 5。当循环更新语句将控制变量的值增加到 6 时，我们已经执行了五次循环体。该程序的伪代码如下：\n\n```\n![img](img/00632.jpeg)\n\
  \n**图 6.19 for 循环的控制流**\n```\n\n![img](img/00633.jpeg)\n\n使用 `for` 循环，我们不需要执行引导读取，因为退出循环的条件是由计数器控制的，而不是输入值。\n\
  \n\n\n\n示例 6.15 展示了用于计算五个整数之和的 `for` 循环。\n\n![img](img/00634.jpeg)\n\n### 示例 6.15\
  \ 求五个数之和\n\n在这个示例中（这是一个标准的累加操作），`for` 循环的初始化语句声明了 `i`，它将成为我们的循环控制变量。我们将 `i` 初始化为\
  \ 1，在每次执行完循环体后，我们在循环更新语句中将 `i` 增 1。循环条件检查 `i` 的值是否小于或等于 5；当 `i` 达到 6 时，我们已经执行了五次循环体。图\
  \ 6.20 显示了该 `for` 循环的执行情况。\n\n![img](img/00635.jpeg)\n\n#### 图 6.20 求五个整数之和\n\n\
  注意，由于我们在 `for` 循环头部中声明了循环计数器变量 `i`，因此在 `for` 循环结束后无法引用 `i`。因此，这段代码将产生编译错误，因为 `i`\
  \ 在第 24 行超出了作用域：\n\n![img](img/00636.jpeg)\n\n使用已作用域内变量相同的名称定义新变量是无效的，并产生编译错误。然而，当之前定义的同名变量不再作用域内时，可以重用变量名。在上面的代码中，第\
  \ 16 行定义的变量 `i` 的作用域限于第 16–22 行的 `for` 循环。我们不能在该 `for` 循环中定义另一个名为 `i` 的变量；但是，如所示，我们可以在随后的\
  \ `for` 循环（第 24–29 行）中重用名称 `i`，因为第一个 `i` 已经不再作用域内。事实上，程序员经常在他们的 `for` 循环中重用变量 `i`\
  \ 作为计数器变量。\n\n![img](img/00637.jpeg)\n\n![img](img/00638.jpeg)\n\n如果你确实想循环结束后引用循环变量，可以在\
