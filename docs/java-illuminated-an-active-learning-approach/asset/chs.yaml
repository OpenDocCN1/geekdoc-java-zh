  \ 所示。拖动鼠标被定义为用户在按下鼠标按钮但不释放的情况下移动鼠标。\n\n#### 表 12.22   *MouseMotionListener* 接口方法\
  \ API\n\n| ***MouseMotionListener* 接口方法 API** | |\n\n| `public void mouseMoved(MouseEvent\
  \ e)`当鼠标移动到组件上时调用 | |\n| `public void mouseDragged(MouseEvent e)`当在组件上按下鼠标按钮并拖动鼠标时调用\
  \ |\n\n为了说明如何结合 `MouseEvent` 类使用 `MouseMotionListener` 接口，我们将构建一个与寻艇游戏相似的简单寻宝游戏。宝藏隐藏在窗口的某处，用户将尝试寻找它，但不是通过点击鼠标按钮，而是通过在窗口内移动鼠标。根据鼠标距离宝藏的远近，我们将在鼠标位置显示消息，以便用户能够找到宝藏并赢得游戏。\n\
  \n图 12.16 显示了寻宝游戏的 UML 图。\n\n![img](img/01622.jpeg)\n\n#### 图 12.16\n\n#### 寻宝游戏的\
  \ UML 图\n\n再次，我们首先编写模型（Model），即封装我们寻宝游戏功能性的类（示例 12.12）。它允许我们创建指定大小的游戏、处理游戏过程、确定游戏何时结束并显示游戏状态。\n\
  \n实例变量 `status`（第 16 行）是一个 `String` 类型，用于存储玩家位置相对于于宝藏位置的状态。我们还定义了一个 `boolean` 类型的标志变量\
  \ `gameOver`，其初始值为 `false`（第 17 行）；当用户找到宝藏时，我们将其改为 `true`。\n\n在构造函数中，我们随机生成宝藏中心的\
  \ `(x, y)` 坐标，并将生成的值存储在实例变量 `xCtr` 和 `yCtr` 中（第 27-30 行）。\n\n![play` 方法（第 49-76\
  \ 行）设置 `status` 的值。如果玩家离宝藏很远，我们将 `status` 设置设置为“Cold（冷）”。随着用户越来越接近宝藏，该值变为“Lukewarm（温）”、然后是“Warm（暖）”、最后是“Hot（热）”，当玩家找到宝藏时变为“Found（找到）”。如果找到了宝藏，我们将\
  \ `gameOver` 设置为 `true`（第 59 行）。与寻艇游戏类似，`draw` 方法（第 78-96 行）绘制游戏中发生的情况。我们首先测试 `status`\
  \ 的值是否为“Found”（第 87 行）。如果是，说明已经找到了宝藏，我们通过绘制它来揭示位置（第 89-92 行）。如果还没有找到宝藏，我们在当前鼠标位置显示\
  \ `String status`（第 95 行），该位置由发送给 `draw` 方法的参数 `x` 和 `y` 决定。![img](img/01623.jpeg)\n\
