  \ `for` 循环处理名为 `arrayListName` 的 `ClassName` 对象的 `ArrayList` 元素的通用模式是：\n\n![img](img/01213.jpeg)\n\
  \n在增强型 `for` 循环头中声明一个与存储在 `ArrayList` 中的对象类型相同的变量，后面跟着一个冒号和 `ArrayList` 的名称。增强型\
  \ `for` 循环能够自动遍历 `ArrayList` 对象。你的代码不需要调用 `get` 方法；在循环体内部，可以直接使用 `currentObject`\
  \ 进行处理。\n\n例如，使用增强型 `for` 循环处理名为 `names` 的 `Strings` `ArrayList` 元素，其通用模式是：\n\n\
  ![img](img/01214.jpeg)\n\n示例 9.12 显示了如何创建和使用 `Integer` 的 `ArrayList`。第 11 行使用默认构造函数声明并实例化了\
  \ `ArrayList` 对象引用 `list`。第 12–14 行使用 `add` 方法向 `list` 添加了三个元素。作为 `add` 方法的参数，我们在第\
  \ 12 和第 13 行使用了 `Integer` 对象引用，在第 14 行使用了 `int`。Java 的自动装箱（autoboxing）功能在需要 `Integer`\
  \ 对象的地方使用 `int` 变量时，会自动将 `int` 转换为 `Integer` 对象。\n\n当一个 `ArrayList` 对象声明并实例化为特定类类型后，你无法添加不同类类型的对象。例如，你不能向\
  \ `Integer` 的 `ArrayList` 中添加 `Double` 值。\n\n在第 17–18 行，我们使用传统的 `for` 循环打印 `list`\
  \ 的元素，使用 `get` 方法获取当前索引处的元素。在第 22–23 行，我们使用增强型 `for` 循环打印元素。在第 27–28 行，我们也使用增强型\
  \ `for` 循环打印元素；但这次我们使用 `int` 作为循环变量，利用 Java 的自动拆箱（unboxing）功能，在需要时将 `Integer` 对象转换为\
  \ `int` 值。在第 31 行，我们使用 `set` 方法通过自动装箱将索引处的元素值更改为 10。在第 37 行，我们使用 `remove` 方法删除索引为\
  \ 0 的元素，再次使用了自动拆箱。\n\n此示例的输出如图 9.15。\n\n![img](img/0215.jpeg)\n\n### 9.7.4 在程序中使用\
