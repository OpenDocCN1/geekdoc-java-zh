  \ 位于索引 1；`a` 位于索引 2；`o` 位于索引 3。因为索引从 0 开始，`String` 中的最大索引比字符数少 1。在示例 3.6 中，第 38\
  \ 行获取 `invertedName` 中第一个逗号的索引并赋值给 `int` 变量 `comma`；`comma` 的值（此处为 7）随后在第 39 和第\
