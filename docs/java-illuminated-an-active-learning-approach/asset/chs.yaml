  2. 该方法是尾递归的吗？\n3. 如果你不编写其中一个基准情况，会发生什么？\n\n### 13.5 二分查找：递归解决方案\n\n我们可以使用二分查找算法在排序的数组中搜索特定值。让我们看看如何定义此问题的递归解决方案。我们假设数组是排序的。在数组中搜索值时，我们有两种可能的结果：\n\
  \n![img](img/00009.jpeg)找到了该值并返回其索引。\n\n![img](img/00009.jpeg)未找到该值并返回 -1。\n\n总体而言，我们的策略是：首先，查看数组的中间元素。如果中间元素的值我们要我们要，我们就返回其索引。这就是我们的基准情况。\n\
  \n如果中间元素的值大于我们要的值，那么在大于中间索引的元素中就找不到该值。因此，我们只需要数组的下半部分继续搜索。我们通过调用搜索方法并将原始数组的下半部分作为搜索子数组来实现。\n\
  \n同样，如果中间元素的值小于我们要的值，那么在小于中间索引的元素中就找不到该值。因此，我们只需要数组的上半部分继续搜索。我们通过调用搜索方法并将原始数组的上半部分作为搜索子数组来实现。这就是我们通用情况的公式。\n\
  \n当我们继续搜索时，我们搜索的子数组在每次递归调用时都会缩小。事实上，每次递归调用都会将搜索的子数组大小减半。在这个递归算法中，问题的大小不仅每次递归调用都会减少，而且减少的幅度很大。\n\
  \n如果我们要的值不在数组中，我们搜索的数组部分将继续缩小直到为空。这时，我们知道不会在数组中找到该值。我们达到了另一个基准情况，并返回 -1。\n\n示例 13.8\
  \ 显示了递归二分查找的代码。\n\n![img](img/01775.jpeg)\n\n![img](img/01776.jpeg)\n\n**示例 13.8\
  \ 升序排序数组**\n\n我们在第 27-52 行编写了 `recursiveBinarySearch` 方法。该方法接受四个参数：`arr`，我们要搜索的数组；`key`我们要搜索的值；以及\
  \ `start` 和 `end` 分别代表我们要搜索的 `arr` 子数组的第一个和最后一个索引。\n\n\n\n在第 38 行，我们测试正在搜索的子数组是否包含至少一个元素。如果不包含，说明我们已经达到了基础情况，并且知道我们将无法找到\
  \ `key`。因此，我们在第 51 行的 `else` 分句中返回 `-1`。如果子数组至少包含一个元素，我们在第 41 行将子数组中间元素的索引赋值给 `middle`。然后，我们在第\
  \ 43 行将索引为 `middle` 的数组元素与 `key` 比较比较。如果它们相等，我们就达到了另一个基础情况（我们已经找到了 `key`），因此我们在第\
  \ 44 行返回 `middle`。\n\n如果索引 `middle` 处的数组元素大于 `key`，我们在第 46 行调用 `recursiveBinarySearch`\
  \ 方法，传入的子数组由所有值小于 `middle` 值的元素组成（从 `start` 到 `middle - 1`）。如果索引 `middle` 处的数组元素小于\
  \ `key`，则我们在第 48 行调用 `recursiveBinarySearch` 方法，传入的子数组由所有值大于 `middle` 值的元素组成（从 `middle\
  \ + 1` 到 `end`）。在两种情况下，无论递归调用返回什么，都会由该方法返回。\n\n在 `main` 方法中，我们首先实例化要搜索的数组。注意，这些值是升序排列的（第\
  \ 12–13 行）。然后，我们提示用户输入搜索键，并调用递归二分查找方法，将整个数组作为要搜索的子数组传入（第 19–20 行）。我们在第 21–24 行输出搜索结果。\n\
  \n图 13.12 显示了示例 13.8 在找到键值和未找到键值时的输出。\n\n让我们针对值 7 运行上述示例，以说明各种递归调用以及找到该值的情况。\n\n\
