  \n## 12.16 章节总结\n\n![img](img/00009.jpeg)图形用户界面允许用户通过鼠标点击、鼠标移动、键盘和视觉输入组件与应用程序进行交互。\n\
  \n![img](img/00009.jpeg)`JFrame` 类提供了创建用于存放 GUI 组件窗口的能力。\n\n![img](img/00009.jpeg)GUI\
  \ 程序中的构造函数应该调用父类 `JFrame` 的构造函数，获取内容面板（content pane）的对象引用，设置布局管理器，实例化每个组件并将其添加到窗口中，设置窗口大小并使窗口可见。\n\
  \n![img](img/00009.jpeg)组件是一个具有图形表示并能够显示信息、从用户处收集数据或允许用户启动程序功能的对象。\n\n![img](img/00009.jpeg)Java\
  \ 在 `javax.swing` 包中提供了一组 GUI 组件。\n\n![img](img/00009.jpeg)`JLabel` 组件可以显示文本或图像。\n\
  \n![img](img/00009.jpeg)`FlowLayout` 布局管理器从左到右按行排列组件，当新添加的组件无法放入当前行时，会开始新的一行。如果调整了窗口大小，组件将重新排列。\n\
  \n![img](img/00009.jpeg)事件驱动编程包括设置交互组件和事件处理器，并响应由用户与组件交互时产生的事件。\n\n![img](img/00009.jpeg)使用**模型-视图-控制器（Model-View-Controller）**架构使应用程序尽可能可重用。`Model`\
  \ 封装应用程序的功能；`View` 封装应用程序的用户界面；而 `Controller` 是 `View` 和 `Model` 之间的中间人。\n\n![img](img/00009.jpeg)为了允许用户与组件交互，我们需要实例化该类的对象，编写一个事件处理器类（称为监听器），实例化事件处理器类的对象，并在组件上注册该监听器。\n\
  \n![img](img/00009.jpeg)事件处理器实现了 `java.awt.event` 或 `javax.swing.event` 包中的监听器接口。监听器方法接收事件对象作为参数，该对象封装了有关用户交互的信息。可以调用\
  \ `getSource` 方法来确定是哪个组件触发了事件。\n\n![img](img/00009.jpeg)事件处理器通常被实例化为 `private` 内部类，这样处理器就可以访问应用程序的组件。\n\
  \n![img](img/00009.jpeg)`JTextField` 组件显示一个用户输入的文本框。`JPasswordField` 组件接受用户输入但不回显输入的字符。`JTextArea`\
  \ 组件显示一个多行文本输入区域。`JTextField` 和 `JPasswordField` 组件触发的事件会生成一个 `ActionEvent` 对象，并需要\
  \ `Action-Listener` 来处理事件。\n\n![img](img/00009.jpeg)`JButton` 组件实现了用于启动操作的命令按钮。点击\
  \ `JButton` 组件会生成一个 `ActionEvent` 对象，并需要 `ActionListener` 来处理事件。\n\n![img](img/00009.jpeg)``JRadioButton`\
  \ 组件允许用户在多个互斥的选项中选择一个。点击任何单选按钮都会取消之前选中的选项。`JRadioButton` 组件需要添加到 `ButtonGroup` 中，由该组组管理按钮的互斥性。`JCheckBox`\
  \ 组件是切换按钮；连续点击 `JCheckBox` 组件会交替选择和取消选择该选项。这些组件触发的事件会生成一个 `ItemEvent` 对象并使用 `ItemListener`\
  \ 来处理事件。\n\n![img](img/00009.jpeg)`JComboBox` 实现了下拉列表。用户只能从列表中选择一个项目。`JComboBox`\
  \ 会触发 `ItemEvent`，因此事件处理器必须实现 `ItemListener` 接口。\n\n![img](img/00009.jpeg)适配器类（Adapter\
  \ classes）实现一个接口并为每个方法提供空方法体，当仅处理多个组件操作中的其中一个时，它们非常有用。\n\n![img](img/00009.jpeg)``MouseAdapter`\
  \ 和 `MouseMotionAdapter` 分别是 `MouseListener` 和 `MouseMotionListener` 接口的适配器类。\n\n\
  ![img](img/00009.jpeg)`GridLayout` 布局管理器将组件排列成行和列中大小相同的单元格。\n\n![img](img/00009.jpeg)`BorderLayout`\
  \ 布局管理器是 `JFrame` 类的默认布局管理器，它将容器组织五个区域：北、南、西、东和中心，每个区域最多包含一个组件。每个区域的大小扩展或缩小取决于该区域组件的大小、其他区域组件的大小，以及其他区域是否包含组件。\n\
