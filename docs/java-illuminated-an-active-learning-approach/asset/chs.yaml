  \ | `isEmpty()` 如果列表包含 0 个项目则返回 `true`，否则返回 `false` |\n| **String** | `toString()`\
  \ 返回列表中每个节点的内容 |\n\n表 14.2 显示了 `ShellLinkedList` 构造函数和方法的 API。\n\n![img](img/01871.jpeg)\n\
  \n![img](img/01872.jpeg) **示例 14.6     ShellLinkedList 类**\n\n![img](img/00004.jpeg)\
  \ **软件工程提示**\n\n不要包含用于项目数量的修改器。这将保护头节点不被更改。\n\n![img](img/00004.jpeg) **软件工程提示**\n\
  \n为实例变量和方法选择易于理解的名称。\n\n![img](img/00004.jpeg) **软件工程提示**\n\n### 14.2.2 生成异常\n\n\
  现在我们已经有了链表的壳类，我们想要添加一些对列表进行操作的方法，例如插入或删除。\n\n`delete` 方法的返回值可能会出现问题。在删除节点时，我们想要返回被删除的项。实际上，我们想要根据存储在该节点的对象的一个或多个字段的值来删除节点，即该值。例如，如果客户端想要删除列表中的第一个\
  \ `Player`，我们就会返回该 `Player` 对象。如果列表为空或我们没有找到，我们不想返回 `null`，因为客户端可能会尝试使用返回的对象，这将产生\
  \ `NullPointerException`。解决此问题的方案是在无法删除请求的节点时抛出（throw）一个异常。为了这样做，我们将创建一个自定义异常类 `DataStructureException`，我们将在本章中使用它。\n\
  \n将自定义异常类定义为另一个异常类的子类是一个良好的做法。这样，你的类就可以继承现有异常类的功能，简化了新类的编写：你只需要编写构造函数。\n\n示例 14.7\
  \ 显示了我们的 `DataStructureException` 类，它扩展了 `NoSuchElementException` 类，后者位于 `java.util`\
  \ 包。\n\n![img](img/01873.jpeg)\n\n**示例 14.7     DataStructureException 类**\n\n该类的构造函数代码在第\
  \ 8 行到第 14 行；它仅接收一个 `String` 参数并将其传递给父类构造函数。当我们的某个方法检测到错误情况时（例如尝试从空列表中删除），我们将使用类似下方的语句来抛出（throw）异常：\n\
  \n```\nthrow new DataStructureException(message);\n```\n\n我们传递给构造函数的内存将标识我们检测到的错误类型。\n\
  \n任何抛出 `DataStructureException` 的方法头部都会添加 `throws` 子句，如下模板所示：\n\n```java\npublic\
  \ void delete(int id) throws DataStructureException\n```\n\n\n\n\n`NoSuchElementException`\
  \ 类继承自 `RuntimeException`，因此不是一个检查异常（checked exception）。这意味着客户端在调用任何可能抛出 `DataStructureException`\
  \ 的方法时，不需要使用 `try/catch` 块。尽管如此，我们将始终使用 `try/catch` 块，以便当发生 `DataStructureException`\
  \ 时，客户端将看到我们自定义的消息，并更好地理解问题的根源。\n\n现在，我们准备好用更有意义的方法来扩展我们的外壳链表类了。\n\n### 14.2.3 链表的其他方法\n\
  \n除了我们的 `insert` 和 `delete` 方法外，我们还将提供检索或“查看”（`peek`）节点内容的功能，而不删除它。\n\n表 14.3 显示了\
  \ `insert`、`delete` 和 `peek` 方法的 API。\n\n同样，将在列表开头进行插入，且我们的 `insert` 方法的返回类型为 `void`；我们的\
  \ `insert` 方法工作方式与 `ints` 链表的 `insert` 方法相同。\n\n我们的 `delete` 方法也将根据特定标准删除节点。对于我们的\
  \ `ints` 列表，标准仅仅是项目的值；而在这里，标准可以是项目的某一个（或多个）实例变量的值。我们只实现一个 `delete` 方法：根据其 `id` 字段的指定值删除项目。根据其\
  \ `name` 或 `game` 字段的指定值删除项目的 `delete` 方法的实现是相似的。\n\n如果我们找到了这样的项目，将将其从列表中移除并返回该项目的引用。在从\
  \ `ints` 列表中删除项时，返回一个 `boolean` 值比返回项目的值更有意义，因为该项目的值已经作为参数传递给方法，我们已经知道它的值了。\n\n\
  #### 表 14.3 PlayerLinkedList 方法\n\n| PlayerLinkedList 类的方法 | 返回值 | 方法名及参数列表 |\n\
  | :--- | :--- | :--- |\n| `void` | `insert(Player p)` 将 `Player p` 插入到列表开头。 |\n\
  | `Player` | `delete(int searchID)` 返回并移除列表中 ID 等于 `searchID` 的第一个 `Player`。如果列表中不存在这样的\
  \ `Player`，则该方法将抛出 `DataStructureException`。 |\n| `Player` | `peek(int searchID)`\
  \ 返回列表中 ID 等于 `searchID` 的第一个 `Player`。如果列表中不存在这样的 `Player`，则该方法将抛出 `DataStructureException`。\
