  \ 实例化一个 `DecimalFormat` 对象 |\n| ***format* 方法** |\n| **返回值** | **方法名和参数列表** |\n\
  | :--- | :--- |\n| `String` | `format(double number)` 返回根据调用该方法的 `DecimalFormat`\
