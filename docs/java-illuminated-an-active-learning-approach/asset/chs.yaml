  \ 除以 474 的余数，是 162”结束——它重复或有错误。我将按照提供的格式）。\n\n123,450 除以 60,378 的余数是 2,694。\n2,694\
  \ 不等于 0\n所以我们取 60,378 除以 2,694 的余数，是 1,110。\n1,110 不等于 0\n所以我们取 2,694 除以 1,110 的余数，是\
  \ 474。\n474 不等于 0\n所以我们取 1,110 除以 474 的余数，是 162。\n162 不等于 0\n所以我们取 474 除以 162 的余数，是\
  \ 148...（实际上，提供的提示文本是：\n“162 不等于 0 所以我们取 1,110 除以 474 的余数，是 162”——这是源中的笔误，但我必须保留它）。\n\
  \n123,450 除以 60,378 的余数是 2,694。\n2,694 不等于 0\n所以我们取 60,378 除以 2,694 的余数，是 1,110。\n\
  1,110 不等于 0\n所以我们取 2,694 除以 1,110 的余数，是 474。\n474 不等于 0\n所以我们取 1,110 除以 474 的余数，是\
  \ 162。\n162 不等于 0\n所以我们取 474 除以 162 的余数，是 148...\n\n\n\n\n假设我们正在玩一款在线网络视频游戏。有 `n`\
  \ 个玩家想要玩。遗憾的是，该游戏只能由 `p` 个玩家进行游戏。我们假设 `p` 是 0 到 `n` 之间的一个整数（例如，`n` 可以是 100，而 `p`\
  \ 可能是 8）。否则，我们根本无法玩该游戏。\n\n我们的问题是确定从 `n` 个玩家中选出 `p` 个玩家共有多少种不同的方法。我们将这个数字称为 `Combinations(n,\
  \ p)`。\n\n`Combinations(n, p)` 的数学公式为：\n\n![img](img/01757.jpeg)\n\n我们的目标是为该问题设计一个递归解决方案，并以此递归的方式编写\
  \ `Combinations(n, p)`。\n\n有一些显而易见的情况需要考虑。如果我们拥有的玩家数量与玩游戏的数量相同，那么 `p` 等于 `n`，我们选出所有的玩家。这种情况只有一种方法，所以\
  \ `Combinations(n, n) = 1`。\n\n如果游戏不需要玩家，那么 `p` 等于 0，我们不选择任何玩家。同样，这种情况只有一种方法，所以\
  \ `Combinations(n, 0) = 1`。\n\n但在 `Combinations(n, p)` 的值不明显的通用情况下，答案又是什么呢？\n\n\
  观察这个问题的方法如下：\n\n在这些 `n` 个潜在玩家中，让我们特别关注某一个玩家。我们将该玩家命名为 Louis。我们可以选择 Louis，也可以不选择\
  \ Louis。\n\n因此，从 `n` 个潜在玩家中选出 `p` 个玩家的总可能数等于以下两个数字之和：\n\n![img](img/00009.jpeg)在\
  \ `n` 个玩家中选出 `p` 个玩家（包括选择 Louis）的可能性数\n\n![img](img/00009.jpeg)在 `n` 个玩家中不选择 Louis\
  \ 的情况下选出 `p` 个玩家的可能性数\n\n如果我们选择了 Louis，我们就必须再选择 `(p – 1)` 个玩家。但我们不能再次选择 Louis，所以只剩下\
  \ `(n – 1)` 个潜在玩家。这种可能性的数量是 `Combinations(n – 1, p – 1)`。\n\n如果我们不选择 Louis，我们仍然需要选择\
  \ `p` 个玩家。但由于我们没有选择 Louis，所以只剩下 `(n – 1)` 个潜在玩家。这种可能性的数量是 `Combinations(n – 1, p)`。\n\
  \n因此，我们可以写出以下递归公式：\n\n![img](img/01758.jpeg)\n\n如果我们观察上述公式右侧的两项，我们可以发现：\n\n![img](img/00009.jpeg)在第一项中，两个参数\
  \ `n` 和 `p` 均减少了 1。\n\n![img](img/00009.jpeg)在第二项中，一个参数 `n` 减少了 1，而 `p` 保持不变。\n\n\
  因此，使用该公式求解计算 `Combinations(n, p)` 的问题等同于解决两个相似但规模更小的问题。这就是我们的通用情况。\n\n我们下一个关注点是决定基准情况（base\
  \ case）是什么。换句话说，当我们反复应用上述公式时，何时会达到一个容易解决的问题？由于公式右侧有两个递归项，我们将有两个基准情况。\n\n让我们看看第一项\
  \ `Combinations(n – 1, p – 1)`。我们可以看到 `n` 和 `p` 同时减少了 1。在开始时，`p` 大于等于 0 且小于或等于 `n`。因此，随着我们不断应用公式并专注于第一项，我们可以看到\
  \ `p` 最终将达到 0，而且 `p` 将在 `n` 之前达到 0。正如之前讨论的，`Combinations(n, 0) = 1`，因为从 `n` 个玩家中选出\
  \ 0 个玩家只有一种方法——即一个都不选。这是一个基准情况。\n\n现在让我们看看第二项 `Combinations(n – 1, p)`。我们可以看到 `n`\
  \ 减少了 1 而 `p` 保持不变。我们知道 `p` 必须小于等于 `n`（我们不能从 `n` 个玩家中选出超过 `n` 个玩家）。随着 `n` 减少而 `p`\
  \ 不变，`n` 最终将达到 `p`。正如之前讨论的，`Combinations(n, n) = 1`，因为从 `n` 个玩家中选出 `n` 个玩家只有一种方法——即全选。这是我们的另一个基准情况。\n\
  \n示例 13.6 显示了此示例的代码。\n\n![img](img/01759.jpeg)\n\n**示例 13.6 递归计算组合数**\n\n在此示例中，我们使用\
  \ `combinations` 方法来计算从 5 个玩家中选出 2 个玩家的方法数。\n\n我们带有参数 5 和 2 调用 `combinations` 方法，并在第\
  \ 11–12 行输出返回的值。\n\n`combinations` 方法的代码在第 15–29 行。方法头位于第 20 行，接收两个 `int` 参数：玩家数量\
  \ `n` 和要选择的数量 `p`。在第 22 行，我们测试基准情况 `p == 0`。如果是，返回 1。如果 `p` 不等于 0，我们测试第二个基准情况 `p\
  \ == n`。如果是，返回 1。如果 `p` 不等于 `n`，我们处于通用情况并进行两次递归调用。\n\n```\npublic int combinations(int\
  \ n, int p) {\n    if (p == 0) {\n        return 1;\n    }\n    if (p == n) {\n\
  \        return 1;\n    }\n    return combinations(n - 1, p - 1) + combinations(n\
  \ - 1, p);\n}\n```\n\n`combinations(5, 2)` 的输出为 10，如上文所示。\n\n**13.4 编程活动 1：检查回文**\n\
  \n在此活动中，你将使用递归来完成此功能：编写一个递归方法来判断 `String` 是否为回文。\n\n回文是对称的单词、短语或句子；即正反读都是那样的。例子有“otto”、“mom”、“madam”和“able\
  \ was I saw Elba”。\n\n我们如何使用递归判断一个 `String` 是否为回文？\n\n如果 `String` 有两个或多个字符，我们可以检查第一个和最后一个字符是否相同。如果不相同，则该\
  \ `String` 就不是回文。这是一个基准情况。\n\n如果第一个和最后一个字符相同，那么我们需要检查第一个和最后一个字符之间的子字符串是否为回文。这就是通用情况。\n\
  \n如果 `String` 是回文，每次递归调用都会将参数的大小（即 `String` 参数中的字符数）减少 2。最终，递归调用将产生由 0 或 1 个字符组成的\
  \ `String` 参数。这两者都是平凡的回文。这是我们的第二个基准情况。注意，只有当 `String` 是回文时，我们才会到达这个基准情况。事实上，如果 `String`\
  \ 不是回文，递归调用只要 `String` 参数的第一个和最后一个字符不同就会检测到第一个基准情况，递归方法将返回 *false*。\n\n例如，为了检查“madam”是否为回文，我们采取以下步骤。\n\
