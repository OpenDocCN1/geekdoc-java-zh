  \n### 讨论题\n\n1. 该方法的基准情况（base case）是什么？\n2. 随着磁盘数量的增加，方法运行所需会发生什么变化？\n\n### 13.7\
  \ 递归与迭代\n\n递归和迭代是解决问题的不同方法。\n\n![img](img/00009.jpeg)递归函数使用判定结构（例如 `if/else` 语句）实现并反复调用自身。\n\
  \n![img](img/00009.jpeg)迭代函数使用循环结构（例如 `while` 或 `for` 语句）实现并反复执行循环。\n\n大多数程序员不会使用递归来打印\
  \ *n* 次“Hello World”；他们会直接使用以下 `for` 循环：\n\n```\n![img](img/01797.jpeg)\n```\n\n\
  同样，阶阶方法也可以用迭代轻松地编写。\n\n然而，其他问题（如汉诺哈塔和二分查找）使用递归比使用迭代更容易编写。\n\n通常，问题的递归解决方案比迭代更优雅。\n\
  \n### 软件提示\n\n![img](img/00004.jpeg)在编写方法时，可读性和维护性是重要的考虑因素。如果运行时间相当，且递归实现更容易理解，请选择递归而非迭代。\n\
  \n### 13.8 章节总结\n\n![img](img/00009.jpeg)递归的思想是将一个大问题转化为更小的问题。大问题与小问题之间的关系称为一般情况（general\
  \ case）。\n\n![img](img/00009.jpeg)通过递归地将问题规模缩小到更小的问题，我们最终得到一个易于解决的问题。那个小问题被称为基准情况（base\
  \ case）。\n\n![img](img/00009.jpeg)使用递归解决问题通常涉及编写递归方法。\n\n![img](img/00009.jpeg)递归方法可以是\
  \ `static` 方法或实例方法，可以接受 0、1 或多个参数，也可以是 `void` 方法或返回数值的方法。\n\n![img](img/00009.jpeg)递归方法会反复调用自身。\n\
  \n![img](img/00009.jpeg)使用递归解决问题涉及两个步骤：为一般情况生成问题的递归公式，以及解决基准情况。\n\n![img](img/00009.jpeg)可以有一个或多个基准情况。\n\
  \n![img](img/00009.jpeg)大多数基准情况都是简单的，但某些可能更复杂。\n\n![img](img/00009.jpeg)大多数一般情况都是简单的，但某些可能更复杂。\n\
  \n![img](img/00009.jpeg)递归方法反复调用自身，直到达到基准情况。\n\n![img](img/00009.jpeg)递归方法通常包含一个测试基准情况的\
  \ `if/else` 语句。\n\n\n\n\n\n![img](img/00009.jpeg)如果递归方法没有测试基本情况（base case），调用该方法通常会导致栈溢出运行时错误。\n\
  \n![img](img/00009.jpeg)递归通常是迭代的替代方案。递归方法的实现通常非常紧凑且优雅。然而，递归方法的效率可能不如其等效迭代方法。\n\n\
