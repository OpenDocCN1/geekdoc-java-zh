  \ `(i + j)` 的值将在偶数和奇数之间交替。相应，在第 36–38 行，我们将每隔一个按钮的背景设置为红色。\n\n在 `actionPerformed`\
  \ 方法中，我们使用第 56–66 行的嵌套 `for` 循环来识别事件源，即用户点击了哪个按钮。然后我们将该按钮的文本设置为其在棋盘上的位置（第 62 行），使用两个数组\
  \ `letters` 和 `digits` 中对应的元素。在找到事件源后，我们随后通过 `return` 语句（第 63 行）退出事件处理程序以中断 `for`\
