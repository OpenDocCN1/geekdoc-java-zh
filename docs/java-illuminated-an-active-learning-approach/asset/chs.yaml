  \n\n\n## 继承\n\n重用类最常用的方法之一是通过继承。继承帮助我们把相关的类组织成`hierarchies`（层次结构），即按功能排序的级别。要建立层次结构，我们首先定义一个类，它包含方法和字段（实例变量和类变量），这些成员是该层次结构中所有类共有的。然后，我们在层次结构的下一个低级定义新类，这些新类继承原始类的行为和字段。在新类中，我们定义了额外的字段和更具体的方法。原始类称为\
  \ `superclass`（父类），继承父类的新类称为 `subclasses`（子类）。一些 OOP 开发者将父类称为 `base class`（基类），将子类称为\
  \ `derived class`（派生类）。\n\n就像生活一样，父类（父）可以有多个子类（子），而每个子类也可以是其他子类（子）的父类（父），以此此类推。因此，一个类既可以是子类（子），也可以是父类（父）。然而，与生活不同，Java\
  \ 子类直接继承自一个父类。\n\n子类可以添加字段和方法，其中某些可能会 `override`（重写）或隐藏从父类继承的字段或方法。\n\n让我们来看一个例子。为了表示车辆类型的层次结构，我们定义一个\
  \ `Vehicle` 类作为父类。然后，我们定义一个继承自 `Vehicle` 的 `Automobile` 类。我们还定义了一个 `Truck` 类，它也继承自\
  \ `Vehicle`。我们通过定义一个 `Pickup` 类和一个 `TractorTrailer` 类来进一步完善我们的类，这两个类都继承自 `Truck`\
  \ 类。图 10.1 使用 UML（统一建模语言）图描绘了我们的层次结构。从子类指向父类的箭头表示子类在某些方法和字段上引用了父类。类名下方的方框用于指定每个类的实例变量和方法。为了简单起见，我们将这些方框留空。在章节的后半部分，我们将展示带有完整字段和方法的\
  \ UML 图。\n\nJava 类库中包含许多许多类层次结构。所有 Java 类层次结构的根部是 `Object` 类，它是所有类的父类。因此，所有类都继承自\
  \ `Object` 类。\n\n继承最重要的优势是，在类层次结构中，我们只编写一次公共代码。在测试公共代码后，我们可以通过将其继承到子类来放心地重用它。当这些公共代码需要修改时，我们只需要在一个地方修改代码即可。\n\
  \n![img](img/01301.jpeg)\n\n**图 10.1**\n\n***Vehicle* 类层次结构**\n\n## 10.1 继承\n\n\
  定义继承自另一个类的子类的语法是在类头中添加一个 `extends` 子句：\n\n![img](img/01302.jpeg)\n\n`extends` 关键字指定子类继承父类的成员。这意味着子类从一开始开始就拥有一组继承自其父类层次的预定义方法和字段。\n\
  \n![img](img/01303.jpeg)\n\n**图 10.2**\n\n**RollABall* 类层次结构**\n\n例如，如果我们想编写一个名为\
  \ `RollABall` 且继承自 `JFrame` 的类，我们使用以下类头：\n\n![img](img/01304.jpeg)\n\n这意味着 `RollABall`\
  \ 类继承自 `JFrame` 类。\n\n由于我们的 `RollABall` 类继承了 `JFrame`，它继承了超过 300 个方法和 30 多个字段。这是因为\
  \ `JFrame` 类是 `Frame` 的子类，`Frame` 是 `Window` 的子类，`Window` 是 `Container` 的子类，`Container`\
  \ 是 `Component` 的子类，而 `Component` 是 `Object` 的子类。`RollABall` 类层次结构如图 10.2 所示。图中，实例变量显示在类名下方的方框中，方法显示在下一个方框中。成员前的“+”表示该成员是\
  \ `public`，而“–”表示该成员是 `private`。每个方法的签名在括号内给出参数，冒号后给出返回类型。`Object` 类的方法比我们在图中显示的要多。但\
  \ `toString` 方法是我们在这个层次中处理的 `Object` 方法，因此我们在图中省略了 `Object` 的其他方法，并指示其他方法存在（`+()`）。\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n类层次中的父类应该包含所有子类共有的字段和方法。子类应该添加专门的字段和方法。\n\
  \n![img](img/01305.jpeg)\n\n**图 10.3**\n\n**BankAccount 类层次结构**\n\n#### 10.2.1 类的继承成员\n\
  \n如示例 10.1 所示，我们的 `BankAccount` 类有两个实例变量：`double` 类型的 `balance`（第 11 行）以及一个用于将 `balance`\
  \ 格式化为货币的常量 `DecimalFormat` 对象（第 9-10 行）。我们提供了两个构造函数。默认构造函数（第 13-19 行）将实例变量 `balance`\
  \ 设置为 0.0。重载构造函数（第 21-27 行）接收初始余额并传递给 `deposit` 方法（第 37-47 行），该方法会将任何非负余额添加到 `balance`。如果初始余额小于\
  \ 0.0，`deposit` 方法将打印错误信息并保持 `balance` 不变。\n\n\n\n\n\n`BankAccount` 类的其他方法包括 `balance`\
  \ 访问器（第 29–35 行）和 `toString` 方法（第 63–69 行），后者使用 `DecimalFormat` 对象 `MONEY` 来以货币格式返回余额。\n\
  \n![img](img/01306.jpeg)\n![img](img/01307.jpeg)\n![img](img/01308.jpeg)\n\n**示例\
  \ 10.1 `BankAccount` 类，版本 1**\n\n现在我们可以派生出 `CheckingAccount` 子类了。示例 10.2 显示了 `CheckingAccount`\
  \ 类的版本 1。对于这个初始版本，我们简单地将 `CheckingAccount` 类定义为继承 `BankAccount`（第 5 行）。我们的类体是空的，因此我们可以演示子类从父类继承的字段和方法。\n\
  \n![img](img/01309.jpeg)\n\n**示例 10.2 `CheckingAccount` 类，版本 1**\n\n当一个类 `extends`（继承）一个父类时，父类所有的\
  \ `public` 字段和方法（构造函数除外）都会被继承。这意味着 `CheckingAccount` 类继承了 `BankAccount` 类的 `MONEY`\
  \ 实例变量以及 `getBalance`、`deposit`、`withdraw` 和 `toString` 方法。继承的字段可以直接从子类访问，而继承的方法可以被子类的其他方法调用。此外，客户端应用程序可以使用子类对象引用来调用这些\
  \ `public` 的继承方法。\n\n任何声明为 `private`（私有）的字段和方法都不会被继承，因此子类无法直接访问。尽管如此，`private` 字段和方法仍然是子类对象的一部分。记住，一个\
  \ `CheckingAccount` 对象“是一个” `BankAccount` 对象，因此一个 `CheckingAccount` 对象拥有一个 `balance`\
  \ 实例变量。然而，`balance` 在 `BankAccount` 类中被声明为 `private`，因此 `CheckingAccount` 方法无法直接访问\
  \ `balance`。`CheckingAccount` 方法必须调用 `BankAccount` 类的访问器和变异器方法来访问或更改 `balance` 的值。\n\
  \n调用方法来获取和更改实例变量的值可能看起来有些琐碎，但它强化了封装。允许 `CheckingAccount` 类直接设置 `balance` 的值会增加程序维护的复杂性。`CheckingAccount`\
  \ 类需要负责维护有效的 `balance` 值，这意味着 `CheckingAccount` 类需要知道 `BankAccount` 类执行的所有关于 `balance`\
  \ 的验证规则。如果这些规则发生变化，`CheckingAccount` 类也需要更改。只要 `BankAccount` 类确保了 `balance` 的有效性，`CheckingAccount`\
  \ 类就没有理由重复这些代码。\n\nJava 提供了 `protected` 访问修饰符，使得字段和方法可以被子类继承（类似于 `public` 字段和方法），同时对客户端类隐藏（类似于\
  \ `private` 字段和方法）。此外，与父类在同一个包中的任何类都可以直接访问 `protected` 字段，即使该类不是子类。由于多个类可以直接访问 `protected`\
  \ 字段，`protected` 访问破坏了封装并增加了程序维护的复杂性。出于这个原因，我们倾向于对实例变量使用 `private` 而不是 `protected`。我们将在章节稍后部分详细讨论\
  \ `private` 和 `protected` 之间的区别。\n\n表 10.1 总结了子类继承的字段和方法。当我们解释更多关于继承的内容时将向表中添加内容。\n\
  \n示例 10.3 显示了 `CheckingAccount` 类的客户端。在第 9 行，我们实例化了一个 `CheckingAccount` 类对象。实例化后，`c1`\
  \ 对象拥有两个字段（`balance` 和 `MONEY`）以及四个方法（`getBalance`、`deposit`、`withdraw` 和 `toString`）。\n\
  \n我们通过使用 `c1` 对象引用调用第 12 行的 `deposit` 方法和第 15 行的 `withdraw` 方法，并在第 13 行和 16 行隐式地调用\
  \ `toString` 方法来演示这一点。图 10.4 显示了该程序的输出。\n\n![img](img/01310.jpeg)\n![img](img/01311.jpeg)\n\
  \n**示例 10.3 `CheckingAccount` 客户端，版本 1**\n\n**表 10.1 继承规则**\n\n![img](img/01312.jpeg)\n\
  ![img](img/01313.jpeg)\n\n**图 10.4 `CheckingAccountClient` 的输出，版本 1**\n\n### 10.2.2\
  \ 子类构造函数\n\n虽然构造函数是 `public` 的，但它们不会被子类继承。然而，为了初始化父类的 `private` 实例变量，子类构造函数可以隐式或显式调用父类构造函数。\n\
  \n当一个类继承另一个类时，子类的默认构造函数会自动调用父类的默认构造函数。这被称为**隐含**调用。虽然我们在示例 10.2 的 `CheckingAccount`\
  \ 类中没有编写任何构造函数，但我们能够实例化 `CheckingAccount` 对象（带有 0.0 的 `balance`），因为 Java 编译器为 `CheckingAccount`\
  \ 类提供了默认构造函数，该函数隐式地调用了 `BankAccount` 类的默认构造函数。\n\n要**显式**调用直接父类的构造函数，子类构造函数使用以下语法：\n\
  \n```\n![img](img/01314.jpeg)\n```\n\n因此，如果我们想实例化一个初始余额不是 0.0 的 `CheckingAccount`\
  \ 对象，我们需要为 `CheckingAccount` 类提供一个重载构造函数。该构造函数将初始余额作为参数，并将该初始余额传递给 `BankAccount`\
  \ 类中的重载构造函数。\n\n这种对直接父类构造函数的调用如果使用，必须是子类构造函数的第一个语句。否则，将产生以下编译器错误：\n\n```\n![img](img/01315.jpeg)\n\
