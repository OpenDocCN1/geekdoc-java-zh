  \ 在大型组织中，程序员在开发各种项目时会编写类库。讨论在这种环境下，继承如何有助于代码重用从而节省时间。\n\n**57.** 其他编程语言允许多重继承；即一个类可以继承多个类。在\
  \ Java 中，一个类只能扩展一个类，但可以实现多个接口。讨论在允许从多个类继承的其他编程语言中可能出现的问题。\n\n## 10.10.9 小组项目（适用于\
  \ 1、2 或 3 名学生）\n\n**58.** 设计并编码一个程序，包含以下类，以及一个测试所有已编码方法的客户端图形化应用程序：\n\n一个封装形状的 `abstract\
  \ Shape` 类：形状具有一个 `abstract method` `draw`，它接受一个参数，即一个 `Graphics` 对象。`Shape` 有三个子类：\n\
  \n- `Line` 类，封装一条直线：直线可以用起始 `(x, y)` 坐标和终点 `(x, y)` 坐标来表示。`draw` 方法将在它们之间画一条线。\n\
  - `Rectangle` 类，封装一个矩形：矩形可以用其 `(x, y)` 左上角、宽度和高度来表示。\n- `Oval` 类，封装一个椭圆：椭圆可以用其 `(x,\
  \ y)` 左上角、宽度和高度来表示。\n\n\n\n\n# 11.10.8 技术写作\n\n# 11.10.9 小组项目\n\n## 引言\n\n程序经常使用组织（如大学、政府或公司）积累的现有数据。通常，数据量非常大，通过键盘输入数据是不现实的。\n\
  \n此外，这些大量数据通常存储在两种介质中：\n\n![img](img/00009.jpeg)磁盘文件\n\n![img](img/00009.jpeg)数据库\n\
  \n操作数据库超出了本书的范围。在本章的大部分内容中，我们将关注从文件读取和写入文件。\n\n但所有这一切都有一个前提条件：理解异常的概念、相关的类以及异常处理。\n\
  \n## 11.1 简单异常处理\n\n到目前，你应该已经发现，即使没有遇到任何编译器错误，程序有时仍然无法运行。在运行时，逻辑错误可能会出现。例如，我们可能会尝试用整数除以\
  \ `0`，或者尝试访问包含 10 个元素的数组的第 11 个元素。Java 是一种健壮的语言，不会允许这些“非法”操作在无人察觉的情况下发生。\n\n这些非法操作会产生**异常**。某些异常是由\
  \ Java 虚拟机生成的，而另一些是由构造函数或其他方法生成的。例如，当方法检测到尝试进行非法操作或传入非法参数时，可能会产生异常。\n\n默认情况下，当没有图形用户界面的应用程序产生异常时，程序将终止。然而，在许多情况下，我们可以尝试从异常中恢复并继续运行程序。这被称为处理异常。为了让程序员处理异常，Java\
  \ 提供了两个工具：\n\n![img](img/00009.jpeg)异常类\n\n![img](img/00009.jpeg)`try`、`catch` 和\
  \ `finally` 块\n\n`Exception` 类是所有异常类的父类，它封装了特定的异常，例如整数除以 `0`、尝试访问越界的数组索引、非法的数字格式、使用\
  \ `null` 对象引用调用方法、尝试打开一个不存在的文件等。\n\n图 11.1 是一个继承层次结构图，仅显示了少数 Java 异常类。`Exception`\
  \ 类以及 `RuntimeException` 及其子类位于 `java.lang` 包中。`IOException` 类及其子类 `FileNotFoundException`\
  \ 位于 `java.io` 包中。\n\n### 11.1.1 使用 `try` 和 `catch` 块\n\n示例 11.1 显示了一个使用对话框提示用户输入整数的程序。`JOptionPane`\
  \ 类的 `showInputDialog` 方法将用户的输入作为 `String`（第 12–13 行），然后我们使用 `Integer` 包装类的 `parseInt`\
  \ 方法将其转换为 `int`（第 17 行）。\n\n![img](img/01438.jpeg)\n\n**示例 11.1 生成异常**\n\n图 11.2\
  \ 显示了用户输入为 45 时程序成功运行的结果。\n\n![img](img/01439.jpeg)\n\n**图 11.1 各种异常类的继承层次结构**\n\
  \n![img](img/01440.jpeg)\n\n**图 11.2 String 成功转换为 int**\n\n只要用户的输入可以转换为 `int`，一切都会进展顺利。但当用户输入数字以外的字符时会发生什么？图\
  \ 11.3 显示了用户输入“a.”时同一程序的输出。\n\n![img](img/01441.jpeg)\n\n![img](img/01442.jpeg)\n\
  \n**图 11.3 显示运行时出现 `NumberFormatException` 的输出**\n\n在运行时，对 `parseInt` 方法的调用（第 17\
  \ 行）产生了 `NumberFormatException`，导致程序终止。程序的第 18–19 行永远不会执行。我们可以通过读取控制台输出的最后一行来确定产生异常的行，它识别了异常的来源：`DialogBoxInput`\
  \ 类中 `main` 方法的第 17 行。\n\n让我们看看发生了什么。`Integer` 包装类的 `parseInt` 方法在 Java 类库中具有以下头：\n\
  \n![img](img/01443.jpeg)\n\n`throws NumberFormatException` 子句表示 `parseInt` 方法可能会检测到会导致其生成\
  \ `NumberFormatException` 的情况。事实上，如果 `String` 参数无法转换为 `int`，`parseInt` 方法将生成或**抛出**（throw）一个\
  \ `NumberFormatException`。\n\n自然地，我们希望避免无效的用户输入终止程序执行的情况。任何程序都可能出现拼写错误和无效输入值。我们需要能够从这些错误中恢复并继续执行。\n\
  \nJava 提供了 `try` 和 `catch` 块允许我们处理异常，以便代码能够继续运行。我们将可能产生异常的代码放在 `try` 块中，并将恢复异常的代码放在\
  \ `catch` 块中。如果 `try` 块内部的代码抛出了异常，执行将跳转到 `catch` 块。如果 `try` 块中没有发生任何事情，则将跳过 `catch`\
  \ 块。\n\n`try` 和 `catch` 块的最小语法如下：\n\n```\n![img](img/1444.jpeg)\n```\n\n即使 `try`\
  \ 和 `catch` 块体只有一条语句，也需要大括号。`catch` 子句的 `ExceptionClass` 参数指定且仅指定一个 `ExceptionClass`。在\
  \ `catch` 子句中列出零或多个 `ExceptionClasses` 将导致编译错误。\n\n将异常分为两类：\n\n![img](img/00005.jpeg)常见错误陷阱\n\
  \n省略 `try` 和 `catch` 块的大括号会导致编译错误。![img](img/00009.jpeg)未检查异常：是 `Error` 或 `RuntimeException`\
  \ 的子类\n\n![img](img/00009.jpeg)检查异常：其他异常\n\n**未检查异常**（例如由于尝试除以 0 引起的 `ArithmeticException`、`NumberFormatException`\
  \ 或 `NullPointerException`）不需要用 `try` 和 `catch` 块处理。换句话说，如果你省略了 `try` 和 `catch`\
  \ 块，你的代码将编译。然而，如果在运行时产生了这些未检查异常之一，JVM 将捕捉它们并打印类似于图 11.3 的输出。\n\n产生**检查异常**的代码（例如\
  \ `IOException`）必须编写在 `try` 块中。这是要求的，否则程序将无法编译。因此，当我们对文件操作时，必须使用 `try` 和 `catch`\
  \ 块处理潜在的 `IOException`。我们将在本章后面介绍这一点。\n\n在 `catch` 块中，我们可以使用 `Exception` 参数作为对象引用，以获取有关异常原因的更多信息。表\
  \ 11.1 显示了 *Exception* 类继承的三个方法。\n\n**表 11.1 异常类的实用方法**\n\n| 异常类的方法 | 返回值 | 方法名和参数列表\
  \ |\n| :--- | :--- |\n| String | `getMessage()` 返回一个指示异常原因的消息 |\n| String | `toString()`\
  \ 返回一个包含异常类名和指示异常原因消息的 `String` |\n| void | `printStackTrace()` 打印导致异常的代码行号，以及导致异常的方法调用序列\
  \ |\n\n我们在示例 11.2 中演示这三个方法，这是 *DialogBoxInput* 应用程序的第 2 版本，它使用 `try` 和 `catch` 块来检测并处理发生的异常。\n\
  \n\n\n\n我们在第 14–17 行提示用户并回显输入内容。然后，我们定义了一个 `try` 块（第 19–24 行），并插入了执行转换的 `parseInt`\
  \ 方法调用。`catch` 块（第 25–35 行）包含了当 `parseInt` 方法 `throws`（抛出）异常时我们要执行的代码。\n\n![img](img/01445.jpeg)\n\
  \n**示例 11.2 使用 `try` 和 `catch` 块的 `DialogBoxInput`**\n\n图 11.4 显示了用户输入有效值时的输出。在这种情况下，`try`\
  \ 块在没有产生异常的情况下完成，`catch` 块不会被执行。程序的执行跳转到第 37 行，我们在该处打印转换后的整数整数值。\n\n![img](img/01446.jpeg)\n\
  \n**图 11.4 未产生异常的输出**\n\n相比之下，图 11.5 显示了用户输入无效值时的输出。在这种情况下，`parseInt` 方法抛出了 `NumberFormatException`。如你所见，`try`\
  \ 块在第 22 行停止执行，我们没有打印“转换成功”的消息。相反，执行了 `catch` 块，我们打印了来自 `NumberFormatException`\
  \ 类的 `getMessage`、`toString` 和 `printStackTrace` 方法的值。如你所示，`getMessage` 和 `toString`\
  \ 方法返回值之间的唯一区别是 `toString` 方法返回了异常类名以及消息。你可能认识 `printStackTrace` 方法的输出，它与示例 11.1\
  \ 中我们没有使用 `try/catch` 块时 JVM 打印到控制台的消息几乎完全相同。\n\n当 `catch` 块执行完毕后，我们执行第 37 行，打印\
  \ `n` 的值，此时该值仍为 0。\n\n注意，我们在进入 `try` 块之前，就已经在第 12 行声明并初始化了变量 `n`。如果我们没有初始化 `n`，\
  \ 然后在 `try/catch` 块之后尝试访问 `n`，我们将接收到以下编译器错误：\n\n![img](img/01447.jpeg)\n\n![img](img/00005.jpeg)\
  \ **常见错误陷阱**\n\n未对在 `try` 块中赋值但在 `try` 块之后访问的变量进行初始化，将导致编译器错误。\n\n![img](img/01448.jpeg)\n\
  \n![img](img/01449.jpeg)\n\n**图 11.5 产生异常时的输出**\n\n该错误表明，`n` 被赋值的唯一地方是在 `try` 块中。如果发生异常，`try`\
  \ 块将被中断，我们可能永远不会为 `n` 赋值。在进入 `try` 块之前初始化 `n` 的值可以解决这个问题。\n\n尽管示例 11.2 检测到了异常，但它仅仅打印了异常发生的消息；它并没有从异常中恢复或对异常进行处理。示例\
  \ 11.3 显示了 `DialogBoxInput` 类的第 3 版本，它通过将 `try` 和 `catch` 块放在 `do/while` 循环内部来处理异常，以便在输入有效之前持续提示用户输入值。\n\
  \n![img](img/01450.jpeg)\n\n![img](img/01451.jpeg)\n\n**示例 11.3 从异常中恢复**\n\n![img](img/00004.jpeg)\
  \ **软件工程提示**\n\n编写代码来捕获并处理由无效用户输入产生的异常。虽然 `Exception` 类的方法是很好的调试工具，但它们并不一定适用于程序的最终版本。始终尝试编写用户友好的代码。\n\
  \n在第 15 行，我们声明了一个 `boolean` 变量 `goodInput`，我们将其作为标志变量，用于指示用户输入的值是否可以转换为 `int`。我们将\
  \ `goodInput` 初始化为 `false`；在 `parseInt` 方法在没有产生异常的情况下完成之前，它的值将保持为 `false`，此时我们将赋值为\
  \ `true`（第 26 行）。我们在 `do/while` 循环的 `while` 条件中（第 34 行）中使用 `goodInput` 的值，只要输入无效，我们就继续重新提示用户。记住，如果\
  \ `parseInt` 方法中发生异常，第 26 行将不会执行，因此只有在没有发生异常时，`goodInput` 才会被置为 `true`。现在，我们的应用程序正确地检测并从无效用户输入中恢复并继续处理。\n\
  \n在图 11.6 中，用户首先输入无效值。我们重新提示用户，用户输入有效值。注意用户没有看到异常发生，而且注意到我们的提示清晰地向用户解释了问题。\n\n![img](img/01452.jpeg)\n\
  \n**图 11.6 处理异常**\n\n### 11.1.2 捕获多个异常\n\n如果 `try` 块中的代码可能会产生多种类型的异常，我们可以提供多个 `catch`\
  \ 块，每个异常对应一个。当产生异常时，JVM 在 `catch` 块中搜索匹配的 `Exception` 参数。第一个 `catch` 块匹配了抛出的异常，因此执行该\
  \ `catch` 块中的代码，然后跳过剩余的 `catch` 块。\n\n以下是使用 `try` 块、多个 `catch` 块和 `finally` 块的语法：\n\
  \n```\ntry {\n    // 可能会抛出异常的代码\n} catch (Exception1 e) {\n    // 处理第一个异常\n} catch\
  \ (Exception2 e) {\n    // 处理第二个异常\n} finally {\n    // 始终执行的代码\n}\n```\n\n示例 11.4\
  \ 显示了一个捕获两个异常的 `Divider` 类。首先，我们提示用户输入整数（第 20–22 行），然后尝试将输入的 `String` 转换为 `int`（第\
  \ 27–28 行）。正如我们所见，无效输入将产生 `NumberFormatException`。如果我们成功地将输入转换为 `int`，我们将该 `int`\
  \ 作为除法操作中的除数（第 30–31 行）。为了简单起见，这里使用预定义值。\n\n记住，子类也是其父类的对象；例如，`NumberFormatException`\
  \ 会匹配 `RuntimeException` 的 `catch` 块和 `Exception` 的 `catch` 块。因此，我们将所有这些代码放入 `try`\
  \ 块中（第 25–34 行），并提供两个 `catch` 块，一个处理 `NumberFormatException`（第 35–40 行），另一个处理 `ArithmeticException`（第\
  \ 41–46 行）。\n\n![img](img/01453.jpeg)\n\n将具体的异常排在前。\n\n![img](img/01454.jpeg)\n\n\
  ![img](img/01455.jpeg)\n\n**示例 11.4 `Divider` 类**\n\n图 11.7 显示了程序的执行过程。在第一次提示时，用户输入\
  \ 45h，这导致 `parseInt` 方法抛出 `NumberFormatException`。JVM 开始在 `catch` 块中扫描匹配的 `Exception`\
  \ 参数。第一个 `catch` 块（第 35–40 行）匹配了抛出的异常，因此执行该 `catch` 块中的代码，我们重新提示用户输入整数。然后我们跳过 `ArithmeticException`\
  \ 的 `catch` 块并执行第 47 行，测试 `goodInput` 的值。此时该值仍为 *false*，因此我们重复 `do/while` 循环。\n\n\
  ![img](img/01456.jpeg)\n\n**图 11.7 示例 11.4 的输出**\n\n\n\n\n这次，用户输入了 0，因此 `parseInt`\
  \ 方法成功地将 0 转换为 `int`。接着执行第 31 行，我们在那里尝试除以 0。这导致了 `ArithmeticException`。再次，JVM 开始扫描\
  \ `catch` 块以寻找匹配的异常参数。JVM 跳过了第一个 `catch` 块，但在第二个 `catch` 块（第 41–46 行）中找到了匹配项，因此我们执行了该\
  \ `catch` 块。这次我们通知用户除数不能为 0，并提示其输入一个新值。最后，用户输入了一个有效的非零值；我们现在既可以将输入转换为 `int`，又能执行除法操作，而不会产生任何异常。在这种情况下，两个\
  \ `catch` 块都会被跳过，我们在对话框中显示结果（第 49–50 行）。\n\n在提供了几个异常的示例后，我们还必须考虑这一点：**并不是每一个问题都需要通过产生异常来解决**。事实上，由于处理开销的存在，生成和处理异常会显著减慢代码的执行速度。例如，当在使用\
  \ Java 的 I/O 类时，我们通常别无使用 `try` 和 `catch` 块。但在示例 11.4 中，我们本可以使用简单的 `if/else` 语句在尝试除法之前测试除数的值。这可以简单且高效地解决问题，而无需产生异常。\n\
  \n我们如何知道一个构造函数或方法是否 `throws`（抛出）异常，以及 `throws` 什么类型的异常呢？如既往一样，最好的信息来源是 Oracle Java\
  \ 网站上的 Java 类库。在确定了想要使用的构造函数或方法后，只需查看其 API，即可确定它是否 `throws` 任何异常，如果是，是哪些异常。\n\n\
  ![img](img/00004.jpeg) **软件工程贴士**\n\n尽可能使用简单的 `if/else` 语句来检测未捕获异常，而不是使用 `try` 和\
  \ `catch` 块。这将提高你代码的性能。\n\n![img](img/00058.jpeg) **参考点**\n\n访问 Oracle Java 网站 `[www.oracle.com/technetwork/java](http://www.oracle.com/technetwork/java)`\
  \ 查看构造函数或方法是否 `throws` 异常，如果是，是什么种类型的异常。\n\n### 11.1.3 用户自定义异常\n\n有时，我们可能需要设计自己的异常类，因为预定义的\
  \ Java 异常类不符合我们的需求。\n\n假设我们对设计一个封装电子邮件地址的类感兴趣。我们将该类命名为 `EmailAddress`。为了保持简单，我们假设一个合法的电子邮件地址是一个包含\
  \ `@` 字符的 `String`。为了防止使用非法电子邮件地址实例化对象，我们将设计 `EmailAddress` 构造函数，如果其参数（一个 `String`）不包含\
  \ `@` 字符，它将 `throws` 一个异常。\n\n为了实现这一点，我们首先设计一个封装非法电子邮件异常的异常类。我们将该类命名为 `IllegalEmailException`，当\
  \ `EmailAddress` 构造函数的参数不包含 `@` 字符时，我们将 `throw`（抛出）该异常。由于 Java 已经有了 `IllegalArgumentException`\
  \ 类，我们将我们的 `IllegalEmailException` 类定义为 `IllegalArgumentException` 类的子类。\n\n更通地说，当自定义异常类被定义为现有\
  \ Java 异常类（如 `Exception`、`NumberFormatException` 或 `IllegalArgumentException`）的子类时，我们的类继承了现有异常类的功能，这简化了新类的代码编写。我们扩展了\
  \ `IllegalArgumentException` 类，以便将特定的错误消息与异常关联。我们只需要编写构造函数，而构造函数的任务是将我们的消息传递给父类的构造函数。\n\
  \n因此，自定义异常类的通用模式是：\n\n![img](img/01457.jpeg)\n\n示例 11.5 显示了我们的 `IllegalEmailException`\
  \ 类。\n\n![img](img/01458.jpeg)\n\n**示例 11.5 IllegalEmailException 类**\n\n该类的构造函数代码位于第\
  \ 7 到 10 行；它接收一个 `String` 参数并简单地将其传递给父类构造函数。\n\n`throws` 自定义异常的方法的模式是：\n\n![img](img/01459.jpeg)\n\
  \n![img](img/01460.jpeg)\n\n我们传递给 `ExceptionName` 构造函数的消息将标识我们检测到的错误类型。当客户端程序捕获该异常时，客户端可以调用异常类的\
  \ `getMessage` 方法来获取该消息。\n\n示例 11.6 显示了我们的 `EmailAddress` 类。\n\n![img](img/01461.jpeg)\n\
  \n**示例 11.6 EmailAddress 类**\n\n我们在第 10–18 行编写了构造函数。我们在第 13 行测试构造函数的参数 `newEmail`\
  \ 是否包含字符 `AT_SIGN`（一个等于 `@` 的常量）。如果是，我们继续正常操作并在第 14 行初始化实例变量 `email`。如果不是，我们在第 16–17\
  \ 行 `throw` 一个带有适当消息的 `IllegalEmailException`。除了构造函数外，我们还在第 20–24 行编写了 `getHost`\
