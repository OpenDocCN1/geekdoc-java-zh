  \n### 10.3 保护访问修饰符 (protected Access Modifier)\n\n我们已经看到子类并不继承父类的构造函数或 `private`\
  \ 成员。然而，父类的构造函数仍然可以从子类调用，且父类的 `private` 字段被实现为子类的字段。\n\n尽管 `private` 字段保留了封装性，但调用方法涉及额外的处理开销。每当调用方法时，JVM\
  \ 都会保存返回地址并复制参数。然后当返回值的的方法完成时，JVM 会制作返回值的副本供调用者使用。`protected` 访问修饰符的设计是为了避免这种处理开销，并通过允许子类访问任何\
  \ `protected` 字段而无需调用其访问器或变异器方法，来方便编码。\n\n然而，请注意，`protected` 字段和方法也可以被同一包中的其他类直接访问，即使这些类不在同一个继承体系中。\n\
  \n对于包外的类，类的 `protected` 成员受到的限制与 `private` 成员相同。换句话说，声明 `protected` 成员的包之外的类不能调用任何\
  \ `protected` 方法，并且必须通过 `public` 访问器或变异器方法访问任何 `protected` 字段。\n\n`protected` 访问修饰符存在权衡。正如我们提到的，任何声明为\
  \ `protected` 的字段都可以被子类直接访问。然而，这样做会损害封装性，因为多个类可以设置在另一个类中定义的实例变量的值。\n\n因此，维护定义或使用\
  \ `protected` 成员的类变得更加困难。例如，我们需要验证任何访问 `protected` 实例变量的类要么不设置该变量的值，要么如果该类确实更改了值，要确保新值是有效的。由于这种增加的维护复杂性，我们建议仅在高性能至关重要时才使用\
  \ `protected` 访问。\n\n我们还建议子类方法避免直接设置 `protected` 实例变量的值。相反，当需要更改 `protected` 变量的值时，尽可能调用父类方法。\n\
  \n为了说明如何在类层次结构中使用 `protected` 访问，让我们仔细观察我们的 `CheckingAccount` 类。我们一直在调用从 `BankAccount`\
  \ 类继承的 `withdraw` 方法来收取月费。然而，如果取款金额大于余额，`withdraw` 方法将保持 `balance` 不变。因此，如果账户没有足够的资金，就不会收取月费。我们希望\
  \ `CheckingAccount` 类能够向账户收取月费并允许余额变为负数。当发生这种情况时，我们将打印一条账户已透支的警告消息。\n\n为了实现这一点，我们将\
  \ `balance` 实例变量声明为 `protected` 而不是 `private`。这允许我们在 `CheckingAccount` 类的 `applyMonthlyFee`\
  \ 方法内部直接访问 `balance`，因为 `balance` 现在被 `CheckingAccount` 继承了。\n\n示例 10.11 显示了 `BankAccount`\
  \ 类版本 3。与版本 1（第 11 行）相比，唯一的区别是 `balance` 实例变量被声明为 `protected`而非 `private`。\n\n![img](img/00004.jpeg)\
  \ **软件工程提示**\n\n除非高性能是关键需求，否则请避免使用 `protected` 访问，因为这样做会损害封装性并增加程序的维护复杂度。在可能的情况下，调用父类方法来更改\
  \ `protected` 变量的值。\n\n![img](img/01337.jpeg)\n\n![img](img/01338.jpeg)\n\n**示例\
  \ 10.11  *BankAccount 类，版本 3**\n\n示例 10.12 显示了 `CheckingAccount` 类的版本 5，它继承自 `BankAccount`\
  \ 类。`CheckingAccount` 现在继承了 `balance`，我们的 `CheckingAccount` 方法可以直接访问 `balance`。尽管如此，在默认和重载构造函数（第\
  \ 16 行和 28 行）中，我们仍然调用了父类构造函数来设置 `balance` 的值。否则，为了避免将 `balance` 设置为无效值，我们需要知道 `BankAccount`\
  \ 中 `balance` 的验证规则并不必要的重复该代码。\n\n此外，在 `toString` 方法（第 61–69 行）中，我们调用了 `BankAccount`\
  \ 类的 `toString` 方法。再次这样做是为了保持一致并避免在 `BankAccount` 中重复代码。\n\n但在 `applyMonthlyFee`\
  \ 方法（第 32–40 行）中，我们直接访问了 `balance`。对于此支票账户，即使会导致余额也会收取月费，因此我们从 `balance` 中减去 `monthlyFee`，允许余额变为负数，如果是这样，我们就打印警告。注意我们直接更改\
  \ `balance` 的值，而不是调用 `getBalance` 和 `withdraw` 方法。\n\n![img](img/01339.jpeg)\n\n\
  ![img](img/01340.jpeg)\n\n**示例 10.12 *CheckingAccount 类，版本 5**\n\n示例 10.13 显示了 `CheckingAccountClient`\
