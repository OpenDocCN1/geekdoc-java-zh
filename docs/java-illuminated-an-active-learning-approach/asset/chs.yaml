  \ `Scanner` 类。\n\n### 11.7 向文件中读写对象\n\n在本文中，我们强调了面向对象编程的好处。正如我们可以将文本和原始数据类型写入文件并随后从文件中读取一样，我们也可以将对象写入文件并随后将其作为对象读取。这样做方便的原因有二：\n\
  \n![img](img/00009.jpeg)我们可以直接将这些对象写入文件，而无需将对象转换为原始数据类型或 `Strings`。\n\n![img](img/00009.jpeg)我们可以直接从文件中读取对象，而无需读取\
  \ `Strings` 并将这些 `Strings` 转换为原始数据类型以实例化对象。\n\n要从文件中读取对象，文件内容必须已经是以对象的形式写入的。因此，我们的首要任务应该是学习如何将对象写入文件。\n\
  \n#### 11.7.1 将对象写入文件\n\n`ObjectOutputStream` 类配合 `FileOutputStream` 类提供了将对象写入文件的功能。我们对\
  \ `FileOutputStream` 类很熟悉，在上一节中使用过它将结构化数据写入文本文件。\n\n`ObjectOutputStream` 类是 `OutputStream`\
  \ 的子类，提供了一种将对象写入文件的方便方法。它的 `writeObject` 方法接受一个参数——要写入的对象。\n\n我们将要使用的类、构造函数和方法如表\
  \ 11.8 所示。\n\n我们将使用本章节较早开发的 `FlightRecord` 类。然而，为了让对象被写入文件（稍后使用 `ObjectInputStream`\
  \ 类读取），该对象必须实现 `Serializable` 接口。当一个对象实现了 `Serializable` 接口时，它的状态可以转换为字节流并写入文件，这样该字节流在从文件读取时就可以转换回对象的副本。因此，我们修改后的\
  \ `FlightRecord2` 类将实现 `Serializable` 接口，该接口位于 `java.io` 包中。\n\n**表 11.8 用于写入对象的有用类、构造函数和方法**\n\
