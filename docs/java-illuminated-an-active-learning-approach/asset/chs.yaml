  \ `private` 字段。\n\n为了避免这个问题，我们的构造函数实例化了一个新的 `cellBills` 数组，该数组的大小与作为参数传递的数组相同，然后将参数数组的元素复制到新的\
  \ `cellBills` 数组中（第 30–37 行）。\n\n在实现数组实例变量的访问器方法（accessor method）时也有类似的考虑。对于基本数据类型的实例变量，访问器方法直接返回实例变量的值。我们为\
