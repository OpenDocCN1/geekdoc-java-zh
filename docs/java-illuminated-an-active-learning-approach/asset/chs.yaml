  \ 文件作为文本文件读取。\n2. 解释为什么我们需要对从文件中读取每个对象进行类型转换。\n\n## 11.9 章节总结\n\n![img](img/00009.jpeg)Java\
  \ 提供了异常类，以便运行时意外、非法的操作可以被捕获并处理。这为程序员提供了一个工具，让程序继续运行而不是终止。\n\n![img](img/00009.jpeg)当调用\
  \ `throws` 检查异常的构造函数或方法时，必须使用 `try` 和 `catch` 块；否则代码将无法编译。\n\n对于 `throws` 非检查异常的构造函数或方法的调用，`try`\
  \ 和 `catch` 块是可选的。如果不使用 `try` 和 `catch` 块，异常将在运行时由 Java 虚拟机捕获。\n\n当 `try` 块为变量赋值，且该变量在\
  \ `try/catch` 块之后使用时，必须在进入 `try` 块之前初始化该变量。\n\n在 `try` 块内部定义的变量对于该块是局部的。\n\n要定义自己的异常，创建一个扩展现有异常类的类。该类将包含一个接受消息并将消息传递给父类构造函数的构造函数。\n\
  \n生成异常的方法在方法头中包含 `throws` 子句。如果检测到无效条件，该方法将 `throws` 一个用户定义异常类型的新对象，并构造函数传递适当的消息。\n\
  \n`java.io` 包包含了用于输入输出操作的类。\n\n为了从文件中读取内容，该文件必须存在；否则将抛出 `FileNotFoundException`。\n\
  \n当我们打开文件进行写入时，如果文件不存在，则创建它。如果文件已存在，文件内容将被删除。\n\n当我们打开文件进行追加时，如果文件不存在，则创建它。如果文件已存在，我们从文件末尾开始写入。\n\
  \n`java.util` 包中的 `Scanner` 类对于解析由一个或多个分隔符分隔的字段组成的 `String` 很有帮助。\n\n`FileOutputStream`\
  \ 和 `PrintWriter` 类提供了将基本数据类型写入文本文件的功能。\n\n对象可以写入文件；它们必须从 `implements` `Serializable`\
  \ 接口的类中实例化。\n\n`Serializable` 接口没有方法；因此，在 `implements` `Serializable` 接口的类中不需要实现的方法。\n\
  \n`FileOutputStream` 和 `ObjectOutputStream` 类提供了将对象写入文件的功能。\n\n为了避免将类数据写入对象文件，在适当的地方将数据声明为\
  \ `static` 或 `transient`。\n\n`FileInputStream` 和 `ObjectInputStream` 类提供了从文件读取对象的功能。\n\
  \n`readObject` 方法返回读取的对象，类型为 `Object` 类引用。该对象引用必须转换为相应的类。\n\n## 11.10 练习、问题与项目\n\
