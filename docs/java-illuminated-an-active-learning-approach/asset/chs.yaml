  \ 8.26 显示了一个调用该方法的客户端程序。在这个示例中，我们正在更新卖家在拍卖网站上收到的评分平均分。每个卖家可能有不同数量的新评分，因此我们将新评分指定为可变数量参数。\n\
  \n![img](img/01054.jpeg)\n\n![img](img/01055.jpeg)\n\n### 示例 8.25 `Seller` 类\n\n\
  在 `Seller` 类中，我们定义了三个实例变量，分别代表卖家名称、当前平均评分以及卖家收到的评分数量（第 8–10 行）。我们还定义了一个 `static`\
  \ 常量 `ONE_PLACE`，`toString` 方法（第 41–48 行）使用它来格式化平均评分。\n\n`calcRating` 方法（第 22–39\
