  \n### 5.9.1 equals 方法\n\n通常情况下，你可能想要比较两个对象是否相等；通常，如果两个对象具有相同的数据，我们就说它们是相等的。然而，如果你使用相等性运算符\
  \ `==` 来比较对象引用，你比较的是对象引用的值。换句话说，你正在比较对象引用是否指向同一个对象，即指向同一个内存位置。要比较对象数据，你需要使用 `equals`\
  \ 方法，所有类都继承自 `Object` 类。许多类都提供了 `equals` 方法的自定义版本。`equals` 方法的 API 为：`public boolean\
  \ equals(Object ob)`\n\n![img](img/00465.jpeg)\n\n通常，如果参数对象中的数据与调用该方法的对象中的数据匹配，`equals`\
  \ 方法返回 `true`。\n\n示例 5.11 中的程序创建了图 5.18 所示的 `SimpleDate` 对象引用和对象。程序使用相等运算符比较对象引用，然后使用\
  \ `equals` 方法比较对象数据。该程序的输出所示图 5.19。\n\n![img](img/00466.jpeg)\n\n**图 5.18**\n\n\
  `SimpleDate` 对象和引用\n\n![img](img/00467.jpeg)\n\n**示例 5.11     比较对象数据**\n\n![img](img/00468.jpeg)\n\
  \n**图 5.19**\n\n示例 5.11 的输出\n\n第 10 行和第 11 行实例化了两个具有相同数据的 `SimpleDate` 对象。第 14 行将对象引用\
  \ `d3` 指向对象 `d1`。第 17 行实例化了具有不同数据的 `d4` 对象。\n\n在第 20 行，当我们使用相等运算符比较 `d1` 和 `d2`\
  \ 时，结果为 `false`，因为对象引用 `d1` 和 `d2` 指向不同的对象。但在比较 `d1` 和 `d3`（第 25 行）时，结果为 `true`，因为\
  \ `d1` 和 `d3` 指向同一个对象。\n\n![img](img/00005.jpeg) **常见陷阱**\n\n不要使用相等运算符来比较数据；相反，请使用\
  \ `equals` 方法。\n\n### 5.9.2 比较方法\n\n由于 `Strings` 是对象，`String` 类提供了其他方法，除了 `equals`\
  \ 方法外还有 `equalsIgnoreCase` 和 `compareTo`。\n\n`equalsIgnoreCase` 方法与 `equals` 方法类似，区别在于它不区分大小写。\n\
  \n`compareTo` 方法返回一个整数值，而不是 `boolean` 值。`compareTo` 方法的返回值表示 `String` 对象小于、等于还是大于参数。然而，在大多数情况下，具体的返回值并不重要；我们只需要知道\
  \ `String` 对象是小于、大于还是等于参数。换句话说，我们通常只需要知道返回值是正数、负数还是 0。\n\n`compareTo` 方法从左到右扫描两个\
  \ `Strings`。如果在两个 `Strings` 的相同位置发现不同的字符，它会立即返回表示这些字符 Unicode 值差异的整数。例如，`a` 和 `c`\
  \ 之间的距离为 −2；`K` 和 `F` 之间的距离为 5。\n\n如果 `Strings` 的长度不同，但它们共同拥字符相同，则 `compareTo` 方法返回长度的差异。\n\
  \n**表 5.11     String 类的比较方法**\n\n| ***用于值的 String 方法*** |\n| :--- |\n| **返回值**\
  \ | **方法名和参数列表** |\n| **boolean** | `equals(String str)` 比较两个 `Strings` 的值。如果 `Strings`\
  \ 相等，则返回 `true`；否则返回 `false`。 |\n| **boolean** | `equalsIgnoreCase(String str)`\
  \ 比较两个 `Strings` 的值，不区分大小写。如果 `Strings` 相等，则返回 `true`；否则返回 `false`。 |\n| **int**\
