  \n### 8.8 使用数组作为计数器\n在某些情况下，使用整数数组作为有序的累加器组或计数器是有用的。例如，假设你正在分析一份有四种可能答案（0 到 3）的调查卷。你想统计有多少人选择了每个答案。你可以设置四个计数器，并使用\
  \ `if/else` 语句来递增相应的计数器。伪代码如下：\n\n![img](img/01045.jpeg)\n![img](img/01046.jpeg)\n\
  \n如果你只有几个可能的答案，这种方法是可行的，但如果你有 100 个或更多答案呢？你将写出一个非常长的 `if/else` 语句。\n\n相反，你可以设置一个计数器数组，让答案\
  \ 0 的计数器为 `array[0]`，答案 1 的计数器为 `array[1]`，以此此类推。这种方法——使用计数器数组——代码更简单且节省处理时间。\n\n\
  作为另一个例子，假设我们想掷 500 次骰子，并统计每个结果出现的次数；也就是说，我们想统计掷出一、二、三、四、五、六的次数。为了实现这一点，我们设置了示例 8.22\
  \ 所示的简单 `Die` 类，其中有一个掷出数值的方法。然后我们设置了示例 8.23 所示的客户端类 `DieCount`，它包含一个用于计数的数组。\n\n\
