  \ 字符结束。在这个示例中，我们简单地读取了电影标题和运行时间并将它们回到控制台。然而，我们可以读取此文件以找到最长或最短的电影，或者实例化 `Movie` 对象存储在\
  \ `ArrayList` 或其他数据结构中以便进一步处理。\n\n![img](img/01466.jpeg)\n![img](img/01467.jpeg)\n\
  ![img](img/01468.jpeg)\n\n### 示例 11.8 从文本文件中读取\n\n第 7–8 行导入了 `NoSuchElementException`\
  \ 和 `FileNotFoundException` 类。`IllegalStateException` 类不需要导入，因为它位于 `java.lang` 包中。第\
  \ 16 行从 `File` 对象实例化了一个 `Scanner` 对象，将要读取的文件名 `movies.txt` 作为参数传递给 `File` 构造函数。\n\
  \n`File` 对象仅被用作 `Scanner` 构造函数的参数；它在程序的其他地方没有被使用。在这种情况下，与其创建一个 `File` 对象引用，许多程序员更倾向于使用匿名\
  \ `File` 对象作为 `Scanner` 构造函数的参数。换句话说，与其编写以下两个语句：\n\n```\n![img](img/01469.jpeg)\n\
  ```\n\n而是使用以下单语句：\n\n```\n![img](img/01470.jpeg)\n```\n\n使用哪种代码取决于个人喜好。当我们与输入流或输出流关联文件时，**正在打开文件**。当我们完成文件处理后，调用\
  \ `close` 方法（见表 11.4）来释放文件相关的资源。调用 `close` 方法是可选的。当程序执行结束时，所有资源都会释放，包括未关闭的文件。尽管如此，通常良好的做法是调用\
  \ `close` 方法，特别是当你打开多个文件（或多次打开同一个文件）。相比之下，标准输入流（System.in）、标准输出流（System.out）和标准错误流（System.err）在程序启动时是打开的。它们旨在保持打开且不应关闭。\n\
  \n![img](img/00004.jpeg) **软件工程提示**: 完成数据处理后关闭文件。不要关闭标准输入、输出或错误设备。\n\n如果文件不存在，`Scanner`\
  \ 构造函数将抛出 `FileNotFoundException`。我们在第 40–43 行捕获此异常。由于没有文件无法继续，我们向用户打印消息，说明无法找到文件且程序正在退出。因此，用户看到的不是带有堆栈跟踪的\
  \ `FileNotFoundException`，而是友好的消息。\n\n如果没有抛出异常，我们开始读取文件。`while` 循环条件位于第 18 行，使用\
  \ `hasNext` 方法测试是否已到达文件末尾。如果不是，`hasNext` 返回 `true`，我们执行 `while` 循环体。由于电影标题可能包含多个单词，我们使用\
  \ `nextLine` 方法读取整行（第 20 行）。\n\n然后我们测试文件中的下一个标记是否为 `int`（第 22 行）。如果不是，则运行时间不是整数。我们输出消息说明格式无效，然后通过\
  \ `nextLine` 方法将该行上的任何数据读取到 `String invalidData` 以跳过该行（第 24–25 行）。另一种方案是使用 `try/catch`\
  \ 块来读取运行时间。在这种情况下，调用 `nextInt` 方法读取无效数据将产生 `InputMismatchException`，我们需要处理它。考虑到异常处理会产生额外的处理开销，我们使用\
  \ `Scanner` 类的 `hasNextInt` 方法来测试文件格式，使代码更高效。\n\n\n\n\n\n如果下一个标记是 `int`，我们使用 `nextInt`\
  \ 方法读取运行时间（第 29 行）。此时，有必要讨论一下 `nextLine` 方法与其他 `Scanner next…` 方法（如 `next`/`nextInt`/`nextDouble`\
  \ 等）之间的区别。`nextLine` 方法读取行中任何还未被读取过的部分，包括前导和尾随空白字符（空格、制表符和换行符 `newline`）。相比之下，`nextInt`\
  \ 方法及其对应的 `next....` 方法会跳过前导空白字符，然后读取行中的下一个标记，并在遇到尾随字符时停止。这意味着在我们使用 `nextInt` 方法读取了运行时间后，`newline`\
  \ 字符仍然留在输入流中。如果我们接着尝试使用 `nextLine` 方法读取下一个电影标题，我们读取到的将是紧跟在运行时间后面的 `newline` 字符。因此，在第\
  \ 30 行，我们插入了一个额外的 `nextLine` 方法调用，以从输入流中移除该 `newline` 字符。\n\n在第 31–32 行，我们将标题和运行时间回显控制台。\n\
  \n我们继续循环遍历文件直到没有更多数据可以读取。然后我们退出循环并调用 `close` 方法释放资源（第 36–37 行）。\n\n在文件关闭后任何访问文件的尝试都会产生\
  \ `IllegalStateException`。我们在第 50–53 行捕获此异常，并输出一条解释异常原因的消息。`IllegalStateException`\
  \ 位于 `java.lang` 包中，因此我们不需要导入它。此外，如果我们尝试读取超出文件末尾的内容，`nextLine` 或 `nextInt` 方法将抛出\
  \ `NoSuchElementException`。我们在第 45–48 行捕获此异常，并输出一条解释异常原因的消息。\n\n假设文件 `movies.txt`\
