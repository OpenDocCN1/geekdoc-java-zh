  ![img](img/00822.jpeg)\n\n**图 7.14 ConsoleInClient 类的输出**\n\n## 7.16 使用 Javadoc\
  \ 生成 Web 风格文档\n\n在大多数公司和组织中，程序员会共享代码并频繁使用由另一个程序员开发的类。如果一个类设计良好且文档齐全，其他人就很容易使用该类。毕竟，这本质上就是我们通过使用现有的\
  \ Java 类所做的事情。理解这些现有类执行什么函数、封装了什么、构造函数如何工作、方法的作用以及如何使用这些类是非常容易。这些类之所以容易理解和使用，不仅是因为它们设计和编写良好，还因为现有的文档（特别是\
  \ Oracle Java 网站上的文档）清晰、易懂、完整并很好地代表了这些类。\n\n我们也将学习如何产生与 Oracle Java 网站上的文档类似的基于\
  \ HTML 的文档。\n\n事实上，Java 开发工具包 (JDK) 提供了一个名为 `Javadoc` 的工具来实现此目的。Javadoc 是一个位于 `bin`\
  \ 目录的可执行程序（实际上是 `javadoc.exe`）。它的调用方式与 `javac` 编译器非常相似，但它不是创建 `.class` 文件，而是创建记录类的\
  \ `.html` 文件。\n\n例如，为了为我们的 `Auto` 类生成文档，我们会在命令行输入以下内容：\n\n![img](img/00823.jpeg)\n\
  \n如果我们想为目录中的所有源文件生成文档，我们将输入：\n\n![img](img/00824.jpeg)\n\n表 7.7 显示了为 `Auto` 类生成的文件。\n\
  \n双击 `index.html` 将打开一个与 Oracle 网站上的页面类似的网页。\n\n我们将回顾一些基本的 Javadoc 特性。\n\n要编写包含\
  \ Javadoc 的注释，我们在任何类、字段或方法之前使用特殊的块注释形式。\n\n![img](img/00825.jpeg) **参考点**\n\n使用\
  \ Javadoc 的完整文档可以在 `[www.oracle.com/technetwork/java](http://www.oracle.com/technetwork/java)`\
  \ 找到。\n\n对于 Javadoc 来说，它识别两种类型的标签：块标签（block tags）和内联标签（inline tags）。我们将只讨论块标签。\n\
