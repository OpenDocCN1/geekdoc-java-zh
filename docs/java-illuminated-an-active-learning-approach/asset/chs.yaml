  ![img](img/0080.jpeg)\n\n**图 7.7 示例 7.11 的输出**\n\n**代码演示**\n\n在伙伴网站上，你会找到关于如何定义类的\
  \ Flash 动画。点击链接开始动画。\n\n### 7.11 Static 成员\n\n正如我们提到的，每个实例化的对象都会创建一个独立的实例变量集。除了实例变量外，类还可以定义**类变量**，它们只在\
  \ JVM 初始化类时创建一次。因此，类变量在任何对象实例化之前就已经存在，且每个类只有一个类变量副本。\n\n你可以在定义中使用 `static` 关键字来指定类变量。此外，静态变量常量通常被声明为\
  \ `public`，因为它们通常提供给客户端用于类的操作设置。例如，我们可以直接使用 `JOptionPane` 类中的静态常量 `INFORMATION_MESSAGE`\
  \ 来指定对话框中显示的图标类型。\n\n静态变量的另一个目的是为了更方便地使用类。例如，`Math` 类中静态常量 `PI` 和 `E` 的提供使得我们的应用程序不需要定义这些常用值。`Color`\
  \ 类提供了 `public static` 颜色常量，如 `Color.RED`，以便使用常用颜色。此外，数据类型的最大和最小值以 `Integer`、`Double`\
  \ 和 `Character` 包装类的静态常量 `MAX_VALUE` 和 `MIN_VALUE` 提供。\n\n然而，如果你为类定义了一个不是常量的静态变量，最好将其定义为\
  \ `private` 并提供相应的访问方法（getter）和修改方法（setter），以便客户端访问该静态变量。\n\n我们完成 `Auto` 类（示例 7.12\
  \ 所示的版本 6）是通过定义一个 `private static` 变量来计算应用程序期间实例化对象的数量。我们将此类变量命名为 `countAutos` 并将其初始化为\
  \ 0（第 14 行）。因为每次实例化都会调用构造函数，我们可以在类构造函数中通过增加 `countAutos` 的值来更新计数（第 24 和 37 行）。\n\
  \n当你为类定义一个静态变量时，它的访问方法和修改方法必须定义为**静态方法**，也称为**类方法**。要做到这一点，请在访问修饰符之后的方法头中插入 `static`\
  \ 关键字。我们提供了一个静态访问方法，供客户端获取 `Auto` 对象的计数（第 59–63 行）。然而，我们没有提供修改方法，因为类的客户端不应该能够在自动更新计数的构造函数之外更新\
  \ `countAutos` 的值。\n\n定义为静态的方法受以下重要限制，这些限制在表 7.5 中总结：\n\n```\n*static*方法只能引用*static*变量。\n\
  ```\n\n```\n*static*方法只能调用*static*方法。\n```\n\n```\n*static*方法不能使用对象引用 this。\n```\n\
  \n**表 7.5 静态与非静态方法的访问限制**\n\n| | 静态方法 | 非静态方法 |\n| :--- | :--- | :--- |\n| 访问实例变量？\
  \ | 否 | 是 |\n| 访问静态类变量？ | 是 | 是 |\n| 调用静态类方法？ | 是 | 是 |\n| 调用非静态实例方法？ | 否 | 是 |\n\
  | 使用引用 this? | 否 | 是 |\n\n再次，静态方法无法访问实例变量是有的，因为静态方法与类相关，而不是与任何对象相关。此外，静态方法无法访问实例变量。从静态方法尝试访问实例变量将产生此编译器错误：\n\
  \n![img](img/00009.jpeg)\n\n在此处，我们可以更多地解释 `main`。即使用类名而不是对象的点运算符。\n\n![img](img/00009.jpeg)\n\
