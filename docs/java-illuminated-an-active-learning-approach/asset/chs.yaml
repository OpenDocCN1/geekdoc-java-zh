  \n## 6.14.8 技术写作\n\n**70. 在编程中，程序员可能会犯语法错误导致编译器错误；这些错误可以被纠正。其他错误会导致运行时错误；这些错误也可以被纠正。然而，逻辑错误会导致错误的结果或完全没有结果。讨论在编写循环时可能出现的逻辑错误示例，以及这些逻辑错误的后果。**\n\
  \n**71. 讨论你将如何检测代码中是否存在无限循环。**\n\n## 6.14.9 小组项目（适用于 1、2 或 3 名学生的小组）\n\n**72. 在网页上上，用户经常被要求提供个人信息，如电话号码。你的程序应该从键盘获取代表电话号码的输入。如果输入包含恰\
  \ 10 位数字以及任意数量的连字符（-）和空格，我们认为该输入是有效的电话号码。持续提示用户输入电话号码，直到用户提供有效的号码。一旦你获得了一个有效的电话号码，你应该假设电话号码中的数字（仅限数字，不包括连字符或空格）可能通过将每个数字移动一个常数值进行了加密。例如，如果位移是\
  \ 2，0 变成 2，1 变成 3，2 变成 4……，8 变成 0，9 变成 1。然而，我们知道用户来自纽约，纽约的解密区号（应用位移后，由输入的前三位表示）是\
  \ 212。你的程序需要解密电话号码，并输出格式为 212-xxx-xxxx 的解密后电话号码，以及加密的位移值。如果输入有误且区号无法解密为 212，你应该输出该信息。**\n\
  \n# 第 7 章\n# 面向对象编程，第二部分：用户自定义类\n\n### 章节目录\n\n- 引言\n- 7.1 定义类\n- 7.2 定义实例变量\n-\
