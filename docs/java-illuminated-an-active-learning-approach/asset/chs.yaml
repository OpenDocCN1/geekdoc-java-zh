  \n![img](img/00942.jpeg)\n\n**图 8.13 示例 8.7 的输出**\n\n例如，我们的 `cellBills` 数组包含六个元素，存储了六个月的手机账单。如果我们决定收集一年的手机账单，我们需要一个包含\
  \ 12 个元素的数组。我们可以使用以下语句实例化一个包含 12 个元素的 `cellBills` 数组的新版本：\n\n![img](img/00943.jpeg)\n\
  \n该语句实例化了一个新的 `doubles` 数组，所有元素都初始化为 0.0。但原始的包含六个元素的数组发生了什么呢？由于 `cellBills` 引用现在指向新的\
  \ 12 元素数组，原来的 6 元素数组没有对象引用指向它，因此我们无法访问该数组的值了。这并不是我们想要的结果！\n\n为了在保持原始数组值不变的同时扩展数组的大小，我们可以使用以下技术：\n\
  \n1. 实例化一个具有新大小的数组，并给新数组分配一个临时引用。\n2. 将元素从原始数组复制到新数组中。\n3. 将原始数组引用指向新数组。\n4. 给临时数组引用赋\
  \ `null` 值。\n\n因此，我们不是立即让 `cellBills` 指向新数组，而应该使用临时数组名称实例化一个 12 元素的数组，将 `cellBills`\
  \ 数组中的六个元素复制到这个 12 元素数组中，将 `cellBills` 引用指向新数组，并给临时数组引用赋 `null`。\n\n![img](img/00944.jpeg)\n\
  \n以下代码将实现这些操作：最后一条语句将 `temp` 设置为 `null`，这样就不会对 `cellBills` 数组产生两个引用。\n\n### 8.3.7\
  \ 比较数组的相等性\n\n要比较两个数组是否相等，首先确定它们的长度是否相等，然后使用 `for` 循环比较每个数组中的对应元素。也就是说，比较第一个数组的第\
  \ 0 个元素和第二个数组的第 0 个元素；比较第一个数组的第 1 个元素和第二个数组的第 1 个元素；以此此类推。如果第一个数组中的所有元素都与第二个数组中的对应元素相等，那么这两个数组相等。示例\
  \ 8.8 比较了两个 `doubles` 数组，这是一个基本数据类型。\n\n![img](img/00945.jpeg)\n![img](img/00946.jpeg)\n\
  \n**示例 8.8 比较基本数据类型的数组**\n\n在开始 `for` 循环之前，我们在第 12 行声明了一个 `boolean` 变量 `isEqual`，并将其设置为\
  \ `true`。这样，我们假设数组是相等的。然后，第一步是比较两个数组的长度是否相同（第 13 行）。如果它们的大小不同，数组就不相等，因此我们将 `isEqual`\
  \ 设置为 `false` 并执行跳转到第 28 行。如果两个数组的大小相同，我们使用第 19–25 行的 `for` 循环来测试每个数组中的对应元素是否相等。注意，我们在\
  \ `for` 循环条件中添加了第二个测试（`isEqual`）。如果任何对应元素不相等，我们在第 23 行将 `isEqual` 设置为 `false`。这将导致\
  \ `for` 循环的条件评估为 `false`，并退出 `for` 循环。因此，当 `for` 循环执行完毕时，如果有任何对应元素不匹配，`isEqual`\
  \ 将为 `false`。如果两个数组大小相同且所有对应元素相等，我们永远不会改变 `isEqual` 的值，因此它保持为 `true`。该示例的输出如图 8.14\
  \ 所示。\n\n![img](img/00947.jpeg)\n\n**图 8.14 示例 8.8 的输出**\n\n自然，如果数组的元素是 `ints`、`booleans`\
  \ 或 `chars`，我们会在第 21 行使用相等性运算符（`!=`），如下：\n\n![img](img/00948.jpeg)\n\n假设我们正在比较的两个数组名为\
  \ `intArray1` 和 `intArray2`。\n\n但请注意，当你复制一个元素为对象的数组时，即使使用 `for` 循环结构，你复制的也是对象引用。结果是每个数组的对应元素将指向同一个对象。如果一个数组中的某个对象发生了变化，该变化也将反映在另一个数组中。\n\
