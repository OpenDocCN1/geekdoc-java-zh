  \na³ + b³ = c³\n\n![img](img/00193.jpeg)\n\n## 2.6.8 技术写作\n\n52. 有些程序员喜欢编写尽可能紧凑的代码，例如在另一个语句中使用自增或自减运算符。通常，这些程序员在程序中很少注释。讨论这是否是一个好主意。\n\
  \n# 3 面向对象编程第一部分\n\n## 引言\n\n使用类和对象的计算机程序被称为**面向对象编程**，简称 **OOP**。每个 Java 程序至少包含一个类。\n\
  \n在本章中，我们将介绍面向对象编程作为使用已经写好的类的方法。类为程序提供服务。这些服务可能包括向程序用户发送消息、弹出对话框、执行某些数学计算、格式化数字、在窗口中绘制图形以及许多其他让简单程序看起来更专业的各种任务。使用类的程序被称为类的**客户端**。\n\
  \n\n\n\n在 Java 中，类由数据以及对这些数据进行的操作（或函数）组成。类的对象使用类作为模板或指南来创建。可以将类看作一种通用描述，而将对象看作该类的具体项。或者你也可以把类比为一个饼干模具；该类的对象就是用该饼干模具制作的饼干。例如，一个\
  \ `Student` 类可能包含以下数据：姓名、年级和平均学分。所有学生都有这三个数据项。我们可以通过为对象指定一个标识符（例如 `student1`）以及某个特定学生的姓名、年级和平均学分（例如\
  \ `Maria Gonzales, Sophomore, 3.5`）来创建一个 `Student` 类的对象。对象的标识符被称为**对象引用**。创建一个类的对象被称为**实例化对象**，而该对象被称为**类的实例**。从一个类可以实例化许多对象。可以存在许多\
  \ `Student` 类的实例，也就是说，可以从 `Student` 类实例化许多 `Student` 对象。例如，我们可以创建 `Student` 类的第二个对象\
  \ `student2`，其数据设为 `Mike Smith, Junior, 3.0`。\n\n与类对象相关的数据被称为**实例变量**或**字段**，它们可以是任何原始数据类型（`byte`、`short`、`int`、`long`、`float`、`double`、`char`\
  \ 和 `boolean`）的变量和常量，也可以是类的对象。\n\n类的操作被称为**方法**，用于设置数据的值、检索数据的当前值以及对数据执行与其他类相关的函数。例如，`Student`\
  \ 类会提供设置姓名、年级和平均学分的方法；检索姓名、年级和平均学分的当前值；可能还可以将学生升到下一年级。在对象上调用方法被称为**调用方法**。除少数例外外，只有类方法可以直接访问或更改对象的实例变量。其他对象必须调用方法来设置或检索实例变量的值。类的字段和方法合称为它的**成员**。\n\
  \n本质上，类是一种新的数据类型，它是通过组合 Java 原始数据类型项和类对象创建的。就像原始数据类型可以使用算术运算符（`+`、`−`、`*`、`/` 和\
  \ `%`）进行操作一样，对象也可以通过调用类方法进行操作。\n\n我们喜欢把类比为 M&M™ 糖果：软心周围有一层保护性外壳。因为操作数据的方法包含在类中，它们为内部数据提供了保护外壳。在一个设计良好的类中，只有类方法可以更改数据。其他类的方法不能直接访问数据。我们说数据对类是私有的（`private`）。句话说，类**封装**了数据，而方法提供了设置或更改数据值的唯一接口。这种封装的好处是，类方法确保了只给对象分配有效值。例如，设置学生平均学分的方法将只接受\
  \ 0.0 到 4.0 之间的值。\n\n让我们来看另一个类示例。由作者编写的 `SimpleDate` 类具有实例变量 `month`（月）、`day`（日）和\
  \ `year`（年）。该类的对象 `independenceDay` 可以用数据值 `7`、`4` 和 `1776` 实例化。另一个 `SimpleDate`\
  \ 类对象 `moonWalking` 可能用值 7、20、1969 实例化。`SimpleDate` 类的方法确保只为月、日、年设置有效值。\n\n例如，类方法将允许我们设置一个值为\
  \ 1 月 32 日的日期。其他类方法会将日期递增到第二天，并以 `mm/dd/yyyy` 格式提供日期。\n\n注意我们使用的类名 `Student` 和 `SimpleDate`\
  \ 以大写字母开头，而对象名 `student1`、`independenceDay` 和 `moonWalking` 以小写字母开头。按照惯，类名以大写字母开头。对象名、实例变量和方法名习惯上以小写字母开头。类名、对象名、变量和方法内部的单词以大写字母开头。\n\
  \n在程序中使用类有许多益处。一些最重要的益处包括可重用性（不仅在当前程序中，而且在其他程序中）、封装和可靠性。\n\n编写得良好的类可以在许多程序中重用。例如，`SimpleDate`\
  \ 类可以用于日历程序、预约调度程序、在线购物程序以及许多其他依赖日期的应用程序。重用代码比编写和测试新代码快得多。作为额外奖励，在另一个程序中重用经过测试和调试的类会使程序更加可靠。\n\
  \n类的数据和方法的封装有助于隔离数据操作。这使得更容易追踪 bug 的来源。例如，当一个 `Student` 类的对象中发现 bug 时，你就知道要在 `Student`\
  \ 类的方法中寻找问题，因为你的程序中没有其他代码可以直接更改 `Student` 对象中的数据。\n\n你不需要知道类的实现细节就可以在程序中使用它。`SimpleDate`\
  \ 类是将日期作为三个整数 `month`、`day` 和 `year` 存储在内存中吗？还是日期以自 1980 年来的毫秒数存储的？面向对象的优之处在于，我们不需要知道类的实现；我们只需要知道类的**应用程序接口\
  \ (API)**，即如何实例化对象以及如何调用类方法。\n\n## 3.2 使用构造函数创建对象\n\n类是创建（或实例化）对象的通用模板。事实上，对象必须在实例化后才能使用。要理解如何实例化类的对象以及如何调用类的方法，你需要知道类的\
  \ API，类的创建者将其公开的。表 3.1 显示了作者编写的 `SimpleDate` 类的 API。\n\n实例化对象包括定义对象引用（它将持有内存中的地址）以及调用类的一种特殊方法，称为构造函数，它与类名相同。构造函数的作用是给类分配初始值。示例\
  \ 3.1 阐了如何实例化 `SimpleDate`类的对象。注意我们将 `SimpleDate.java` 文件与 `Constructors.java` 放在同一个文件夹中。\n\
  \n```\n// Example 3.1 代码（概念性表示）\n```\n\n声明对象引用与声明原始类型变量非常相似；你指定数据类型和标识符。例如，要声明名为\
  \ `number1` 的整数变量，你提供数据类型 (`int`）和标识符 (`number1`），如下：\n\n```\nint number1;\n```\n\
  \n声明对象引用的一个显著区别是它的数据类型是一个类，而不是原始数据类型。这是声明对象引用的语法：\n\n```\nSimpleDate number1;\n\
  ```\n\n| *SimpleDate* 类构造函数摘要 |\n| :--- |\n| (来自表的 API 内容) |\n\n\n\n\n\n| `SimpleDate()`\
  \ 创建一个初始默认值为 1, 1, 2000 的 `SimpleDate` 对象。 | `SimpleDate(int mm, int dd, int yy)`\
  \ 创建一个初始值为 `mm`、`dd` 和 `yy` 的 `SimpleDate` 对象。 |\n\n### SimpleDate 类方法方法摘要\n\n|\
  \ 返回值 | 方法名及参数列表 |\n| :--- | :--- |\n| `int` | `getMonth()` 返回 `month` 的值 |\n| `int`\
  \ | `getDay()` 返回 `day` 的值 |\n| `int` | `getYear()` 返回 `year` 的值 |\n| `void` | `setMonth(int\
  \ mm)` 将 `month` 设置为 `mm`；如果 `mm` 无效，则将 `month` 设置为 1 |\n| `void` | `setDay(int\
  \ dd)` 将 `day` 设置为 `dd`；如果 `dd` 无效，则将 `day` 设置为 1 |\n| `void` | `setYear(int yy)`\
  \ 将 `year` 设置为 `yy` |\n| `void` | `nextDay()` 将日期增加到下一天 |\n| `String` | `toString()`\
