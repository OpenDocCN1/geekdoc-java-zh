  \ 是类名（数据类型），而 `independenceDay`、`nextCentury` 和 `defaultDate` 是对象引用。\n\n对象引用可以指向其类的中的任何对象。例如，`SimpleDate`\
  \ 对象引用可以指向任何 `SimpleDate` 对象，但 `SimpleDate` 对象引用不能指向其他类的对象，例如 `Student` 对象。\n\n\
  一旦声明了对象引用，就可以使用以下语法实例化对象：\n\n```\n![img](img/00197.jpeg)\n```\n\n这会调用该类的构造函数来初始化数据。**参数列表**由一组用逗号分隔的初始数据值组成，这些值将被赋值给对象。类通常提供多个具有不同参数列表的构造函数。根据你调用的构造函数，你可以接受数据的默认值，也可以指定数据的初始值。当你实例化一个对象时，你的参数列表——即参数的数量及其数据类型——必须与其中一个构造函数的参数列表匹配。\n\
  \n如表 3.1 所示，`SimpleDate` 类有两个构造函数。第一个构造函数 `SimpleDate()` 称为**默认构造函数**，因为它的**参数列表是空的**。此构造函数为对象中的所有数据分配默认值。因此，在示例\
  \ 3.1 的第 14 行中（使用了默认构造函数），`defaultDate` 对象的数据被设置为 `SimpleDate` 类的默认值，即 `1`、`1` 和\
  \ `2000`。\n\n我们从表 3.1 看到，`SimpleDate`类的第二个构造函数 `SimpleDate(int mm, int dd, int yy)`\
  \ 接受三个参数，所有参数都应该求值为整数值。第一个参数是月份的值，第二个参数是日期的值，第三个参数是年份的值。\n\n示例 3.1 的第 10 行和第 12\
  \ 行使用第二个构造函数实例化了 `SimpleDate` 对象。在第 10 行中，参数列表告诉构造函数给月份赋值 `7`，日期赋值 `4`，年份赋值 `1776`。在第\
  \ 12 行中，参数列表告诉构造函数给月份赋值 `1`，日期赋值 `1`，年份赋值 `2101`。注意，参数列表中没有提供数据类型，只有数据的初始值。参数的数据类型在\
  \ API 中指定，以便类的客户端知道构造函数期望的参数是什么类型的数据类型。\n\n第 12 行和第 14 行也说明你可以在同一个语句中结合对象引用的声明和对象的实例化。\n\
  \n当对象被实例化时，JVM 会为新对象分配内存。对象引用被分配一个地址，JVM 使用该地址在内存中找到该对象。图 3.1 显示了示例 3.1 中实例化的三个对象。\n\
