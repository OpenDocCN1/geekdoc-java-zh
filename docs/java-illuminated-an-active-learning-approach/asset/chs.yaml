  \n![img](img/00597.jpeg)\n\n### 图 6.13 直到用户输入整数的重新提示\n\n## 6.6 构建循环条件\n\n构建正确的循环条件可能看起来有一点反直觉。只要循环条件求值为\
  \ `true`，循环就会执行。因此，如果我们希望循环在读取到哨兵值时终止，那么循环条件应该检查输入值*不是*哨兵值。换句话说，循环的继续条件是循环终止条件的反反。对于一个简单的哨兵控制循环，条件通常遵循此模式：\n\
  \n```\n![img](img/00598.jpeg)\n```\n\n事实上，你可以看到本章中许多示例的循环条件使用了这种形式的 `while` 循环条件。示例\
  \ 6.7 和 6.8 使用了类似的模式。我们希望只要球完全在窗口内就让滚动。循环的终止条件是起始 `x` 值加上球的直径大于等于窗口右侧的 `x` 值。因此，循环的继续条件是球的\
  \ `x` 值加上直径小于窗口右侧的 `x` 值。\n\n```\n![img](img/00599.jpeg)\n```\n\n对于某些应用程序，可能会有多个哨兵值。例如，假设我们为用户提供一个菜单，每个菜单选项都是单个字符。用户可以反复从菜单中选择选项，哨兵值为表示停止的\
  \ `S`。为了允许不区分大小写的输入，我们希望将 `S` 或 `s` 识别为哨兵值。为了做到这一点，我们需要一个复合循环条件，即使用逻辑与 (`&&`) 或逻辑或\
  \ (`||`) 运算符的循环条件。\n\n我们最初的直觉可能是以这种方式形成条件，但这是**错误**的：\n\n```\n![img](img/00600.jpeg)\n\
  ```\n\n使用此条件，循环将永远执行。无论用户输入什么，循环条件都为 `true`。如果用户输入 `S`，第一个表达式(`option != ‘S’`) 为\
  \ `false`，但第二个表达式(`option != ‘s’`) 为 `true`。因此，循环条件求值为 `true` 并执行 `while` 循环体。同样，如果用户输入\
  \ `s`，第一个表达式(`option != ‘S’`) 为 `true`，因此循环条件求值为 `true` 并执行 `while` 循环体。\n\n构建正确\
  \ `while` 循环条件的简单方法包含三个步骤：\n\n1. 定义循环终止条件；即定义将使循环停止执行的条件。\n2. 创建循环继续条件——通过对循环终止条件应用逻辑非运算符\
  \ (`!`) 来创建一个保持循环继续执行的条件。\n3. 在可能的情况下，通过德摩根定律（DeMorgan’s Laws）简化循环继续条件。\n\n德摩根定律如下：\n\
  \n`NOT(A AND B) = (NOT A) OR (NOT B)`\n\n以及\n\n`NOT(A OR B) = (NOT A) AND (NOT B)`\n\
  \n让我们使用这三个步骤来为菜单程序构建正确的循环条件。\n\n1. 定义循环终止条件：\n当用户输入 `S` 或输入 `s` 时，循环停止执行。将其转换为 Java，我们得到：\n\
  ```\n![img](img/00601.jpeg)\n```\n\n2. 创建循环继续条件：\n```\n![img](img/00602.jpeg)\n\
  ```\n\n3. 通过德摩根定律简化循环继续条件：\n```\n![img](img/00603.jpeg)\n```\n\n\n\n\n![img](img/00005.jpeg)\
  \ **常见错误陷阱**\n\n不要在 `while` 循环内部检查哨值。让 `while` 循环条件来检测哨值。\n\n![img](img/00611.jpeg)\n\
  \n![img](img/00612.jpeg)\n\n![img](img/00613.jpeg)\n\n## 示例 6.12 `RollABall3` 类\n\
  \n![img](img/00614.jpeg)\n\n**图 6.15：`RollABall3` 的输出**\n\n## 6.7 `while` 循环的测试技术\n\
  \n代码在没有错误的情况下通过编译这种感觉非常好。然而，获得顺利的编译只是程序员工作的一部分。工作的另一部分是验证代码的正确性；即程序是否产生了准确的结果。\n\
  \n对所有可能的输入值进行测试程序通常是不可行的，但我们可以通过将测试集中在三个领域上，对程序的准确性获得合理的信心水平：\n\n1. 程序对于一组已知输入是否能产生正确的结果？\n\
  2. 如果哨值是第一个且唯一的输入，程序是否能产生正确的结果？\n3. 程序是否能妥善地处理无效输入？\n\n让我们详细查看这三个领域：\n\n### 1. 程序对于已知输入是否能产生正确的结果？\n\
  \n为了用已知输入测试程序，我们选择有效的输入值，并通过手动操作或使用计算器执行程序操作来确定结果应该是什么。例如，为了测试总和或平均值的计算是否正确，输入某些值，并将程序的输出与你将相同值输入计算器得出的总和或平均值进行比较。\n\
  \n选择代表边界条件的输入值特别为重要，即预期最低或最高的值。例如，为了测试一个判断一个人是否足够大以参加总统选举的程序（即年龄在 18 岁或以上的人），我们应该选择\
  \ 17、18 和 19 作为测试值。这些值是 `age >= 18` 的边界条件；测试值分别比法定投票年龄小一个整数、等于该值以及大一个整数。然后，我们用这三个输入值运行程序，并验证程序是否正确识别出\
  \ 17 为非法的投票年龄，并将 18 和 19 识别为合法的投票年龄。\n\n### 2. 如果哨值是第一个且唯一的输入，程序是否能产生正确的结果？\n\n\
  在我们的 `while` 循环中，当我们找到哨值时，控制流会跳过 `while` 循环体，并在 `while` 循环后的语句处继续。当哨值是第一个输入值时，`while`\
  \ 循环体不会执行。我们直接跳到 `while` 循环后的语句。在这种情况下，备受尊敬的计算机科学家 Donald Knuth 建议我们“准确什么都不做，优雅地处理”。\n\
  \n在许多计算输入值总和或平均值的程序中，当没有输入值时，你的程序应该报告总和或平均值为 0，或者输出一条未输入任何值的消息。因此，编写程序使其不容忍除哨值以外的任何输入是非常重要的；因此，我们需要通过首先输入哨值来测试程序。\n\
  \n让我们回顾本章早期的示例，看看它们是如何处理仅输入哨值的情况的。\n\n在加法计算器（示例 6.3）中，我们在 `while` 循环之前将 `total`\
  \ 设置为 0，并在 `while` 循环之后直接报告 `total` 的值。因此，即使只有哨值，我们也得到了正确的结果（0）。\n\n在示例 6.4 中，我们计算测试分数格数的百分比，我们在\
  \ `while` 循环之后执行一些额外的检查来处理唯一的哨值。如果只输入了哨值，`count` 将为 0。我们检查此情况，如果发现 `count` 为 0，我们就会跳过百分比的报告，以避免除以\
  \ 0。我们在示例 6.5 中使用了类似的代码，在该示例中我们计算平均测试分。如果我们检测到 `count` 为 0，我们也会跳过平均值的计算以避免除以 0，并简单地报告平均分为\
  \ 0。\n\n### 3. 程序是否能妥善地处理无效输入？\n\n如果程序期望一个范围内的值或某些离散值，那么当输入不符合预期值时，它应该通知用户。\n\n\
  在示例 6.11 中，我们实现了一个点餐菜单。用户可以输入 `c, h, l 或 t`（或相应的大写字母）来表示他们所需的选项。如果用户输入了这些预期值以外的字母，我们使用\
  \ `switch` 语句的 `default` 子句来发布错误信息：“`Unrecognized menu item`”（无法识别菜单项）。\n\n在下一节中，我们将解释如何使用\
  \ `do/while` 循环来验证用户输入是否在一个值范围内。\n\n![img](img/00004.jpeg) **软件工程技巧**：预计用户可能会首先输入哨值。你的程序需要处理这种特殊情况。\n\
  \n## 6.8 使用 `do/while` 的事件控制循环\n\n另一种特别适用于验证输入的循环形式是 `do/while` 循环。在 `do/while`\
  \ 循环中，条件在循环结束时进行（而不是像 `while` 循环那样在开始时）。因此，`do/while` 循环体至少执行一次。\n\n`do/while` 循环的语法如下：\n\
  \n![img](img/00615.jpeg)\n**图 6.16：`do/while` 语句的控制流**\n\n要使用 `do/while` 循环验证用户输入，我们在循环体内插入输入提示，然后使用一个\
  \ `true` 的条件。像 `while` 循环一样，如果条件为 `true`，循环体将重新执行。\n\n![img](img/00617.jpeg)\n**图\
  \ 6.17：验证输入**\n\n### 示例 6.13 验证输入\n\n对于验证输入，你可能想使用 `if` 语句而不是 `do/while` 循环。例如，为了执行与示例\
  \ 6.13 相同的验证，你可能会尝试这种**错误**代码：\n\n![img](img/00620.jpeg)\n\n![img](img/00621.jpeg)\n\
  \n这种方法的问题在于，`if` 语句只会提示用户一次。如果用户第二次输入无效值，程序将无法捕获它。然而，`do/while` 循环将根据需要不断提示用户，直到用户输入有效值。\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**：不要使用 `if` 语句来验证输入，因为它只能捕获第一次输入的无效值。使用 `do/while`\
  \ 循环提示用户，直到用户输入有效值。\n\n## 6.9 编程活动 1：使用 `while` 循环\n\n在活动中，你将处理一个哨值控制的 `while` 循环，执行以下活动：\n\
