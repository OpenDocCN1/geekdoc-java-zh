  \n### 6.4.1 累加\n\n让我们来看一个 `while` 循环非常有用的常用编程操作：计算一组值的和。为了实现这一点，我们将构建一个简单的计算器，它执行一个功能：加法。我们将提示用户逐个输入数字。我们将哨兵值（sentinel\
  \ value）设置为 `0`；也就是说，当用户想要停止时，用户将输入 `0`。此时，我们将打印总和。\n\n该计算器可以使用事件控制的 `while` 循环和一种标准的计算技术来开发：**累加**。在累加操作中，我们将变量\
  \ `total` 初始化为 `0`。每当我们输入一个新值，就将该值加到 `total` 中。当输入结束时，`total` 的当前值就是所有输入的总和。\n\n\
  以下是加法计算器的伪代码：\n\n![img](img/00561.jpeg)\n\n![img](img/00562.jpeg)\n\n注意，此操作与杂货收银员的工作几乎相同，因为我们在\
  \ `while` 循环之前执行了引导读取（priming read）。在 `while` 循环内部，我们逐个处理每个数字——将每个数字加到总和中，然后读取下一个值，直到我们看到哨兵值，它是停止的信号。\n\
  \n示例 6.3 提供了加法计算器的代码，图 6.5 显示了计算器示例运行的输出。\n\n![img](img/00563.jpeg)\n\n![img](img/00564.jpeg)\n\
  \n**示例 6.3 加法计算器**\n\n![img](img/00565.jpeg)\n\n**图 6.5 加法计算器示例运行的输出**\n\n第 13 行声明并初始化\
  \ `total` 为 `0`。这是一个重要的步骤，因为循环体将把每个输入值加到总和中。如果在此第一次输入之前没有将总和设为 0，我们将得到错误的结果。此外，如果声明了\
  \ `total` 但未进行初始化，我们的程序将无法编译。\n\n第 19–21 行读取第一个输入值（引导读取）。`while` 循环从第 23 行开始，其条件检查哨兵值。当第一次遇到\
  \ `while` 循环时，该条件将检查来自引导读取的输入值。\n\n循环体处理输入（第 25 行），包括将输入值加到 `total` 中。循环体的最后一步（第\
  \ 27–29 行）是读取下一个输入（更新读取）。\n\n当到达循环体末尾时，控制权传回第 23 行，在该处使用第 29 行读取的输入值再次测试循环条件。如果条件为\
  \ `true`（即如果刚刚读取的输入不是哨兵值），则重新执行循环体并重新测试条件，一直到输入为哨兵值为止，这会导致条件求值为 `false`。此时，将跳过循环体并执行第\
  \ 32 行，该行通过打印 `total` 来报告结果。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\n忘记将总和初始化为 0\
  \ 将产生错误的结果。\n\n![img](img/00004.jpeg) **软件工程提示**\n\n对 `while` 循环的体进行缩进，以清晰地展示程序的逻辑。\n\
  \n注意 `while` 循环的体是缩进的，并且起始和结束的大括号与 `while` 中的 `w` 位于同一列。这种风格可以让你轻松地看出哪些语句属于 `while`\
  \ 循环体。\n\n仔细选择哨兵值至关重要。显然，哨兵值不能是用户可能想要被处理的值。在加法计算器中，我们允许用户输入正整数或负整数。我们选择 `0` 作为哨兵值出于两个原因：首先，在总和上加\
  \ 0 没有产生影响，因此用户不太可能想要输入该值进行处理。其次，对于用户来说，输入 `0` 来表示没有更多整数需要相加是符合逻辑的。\n\n![img](img/00005.jpeg)\
  \ **常见错误陷阱**\n\n选择错误的哨兵值可能会导致逻辑错误。\n\n**代码演示**\n\n要查看带有哨兵值的 `while` 循环的逐步演示，请查看辅助网站上的\
  \ Flash 电影。点击链接开始播放。\n\n### 6.4.2 计数项目\n\n当我们需要知道输入了多少项，或有多少个输入值符合某些标准时，就会计数，例如，有多少项是正数或有多少是奇数。计数与累加相似，我们从\
