  \n**图 13.4：示例 13.3 的输出**\n\n识别基础情况至关重要。当方法被调用时，JVM 将方法的参数和调用者的返回地址存储在**栈**（stack）上。当方法返回给调用者时，JVM\
  \ 会从栈中移除该方法调用的数据。如果递归方法永远无法到达基础情况，该方法将无限持续调用自己，导致 JVM 继续在栈上放置值，直到栈内存填满。此时，JVM 会生成一个\
  \ `StackOverflowError`，并终止程序。\n\n例如，如果我们没有在 `factorial` 方法中编写基础情况，该方法将看起来如下所示：\n\
  \n```\n![img](img/01748.jpeg)\n```\n\n当方法被调用时，由于从未到达基础情况，递归调用将不断进行。这最终会产生一个 `StackOverflowError`。\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**\n\n未编写基础情况会导致运行时错误。\n\n![img](img/01749.jpeg)\n\
