  \n## 3.8 使用 *DecimalFormat* 类格式化输出\n\n在计算机程序中，数字代表现实世界的实体，例如价格或胜率。然而，浮点数的计算精确到了许多小数位，由于某些计算，其有效数字可能比我们程序需要的要多。例如，一个商品打折后的价格可能看起来是\
  \ 3.466666666666666，而我们真正想显示的是 $3.47；即一个前导美元符号和小数点后的两个有效数字。`DecimalFormat` 类允许你指定小数点后显示的数字位数，并向输出中添加美元符号、逗号和百分比符号\
  \ (%)。\n\n### 表 3.5 一个 *DecimalFormat* 构造函数和 *format* 方法\n\n| ****DecimalFormat*\
