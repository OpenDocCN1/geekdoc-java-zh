  \ 类**\n\n\n\n组件是可以嵌套的。事实上，由于 `JComponent` 类是 `Container` 类的子类，因此 `JComponent` 对象也是一个\
  \ `Container` 对象。因此，它可以包含其他组件。我们可以利用这一特性来实现更精确的布局。\n\n`JPanel` 类是一个通用容器，或称为 `panel`（面板），通常用于容纳其他组件。在嵌套组件时，我们通常会将几个组件放入一个面板中，并将该面板放入当前\
  \ `JFrame` 的内容面板（content pane）中。每个面板都有自己的布局管理器，该布局管理器可以随面板而异，而 `JFrame` 应用程序的内容面板也有它自己的布局管理器，这可能与任何面板都不同。根据需要，我们甚至可以进行多层嵌套。\n\
  \n在这个示例中，我们使用三种颜色（红、绿、蓝）随机生成一个 8x8 的颜色网格。用户尝试通过点击其中一个按钮来猜测出现频率最高的颜色。\n\n图 12.26a\
  \ 显示了应用程序启动时的窗口界面，而 图 12.26b 显示了窗口的底层布局。我们在内容面板使用了 `BorderLayout`，以及两个 `JPanel`，每个面板都使用\
  \ `GridLayout`。在西（west）位置，我们有一个 `JPanel`，其中包含三个三行一列的 `GridLayout` 中的按钮。\n\n在中间（center）位置，我们定义了另一个\
  \ `JPanel`，其中包含 64 个标签（labels），由一个八行八列的 `GridLayout` 管理。我们没有在 `BorderLayout` 的北、南、东区域放置任何组件；因此，我们使用的两个区域（西和中间）会自动调整以填充空间。\n\
  \n![img](img/01660.jpeg)\n\n**图 12.26a**\n\n**颜色频率游戏**\n\n![img](img/01661.jpeg)\n\
  \n**图 12.26b**\n\n**底层的嵌套布局**\n\n我们再次使用了 MVC 架构并设计了类以实现可重用性。这次，我们还编写了控制器（Controller），以便使其在某些条件下是可重用的。在\
  \ `Controller` 类内部，我们没有使用一个类来表示模型（Model），而是使用了一个接口（interface）。因此，控制器现在可以与相同的视图（View）以及任何实现该接口的模型一起被重用。注意，我们也可以将视图设为接口，但为了保持这个示例的相对简单，我们没有这样做。为了实现控制器的可重用性，我们为\
  \ `Controller` 类使用了以下模式：\n\n![img](img/01662.jpeg)\n\n`ModelInterface` 规定了需要实现的若干方法，控制器将调用这些方法来管理游戏。`Model`\
  \ 类使用了这种模式：\n\n![img](img/01663.jpeg)\n\n我们希望 `Controller` 类能够与任何类重用，这些类的功能是基于用户点击左侧面板以及中间位置标签网格上的按钮。我们可以在应用程序中使用该类，让用户尝试猜测频率最高的颜色、频率最低的颜色，或者使用不同的颜色系统（如\
  \ HSL——色调、饱和度和亮度）来进行。\n\n![img](img/01664.jpeg)\n\n**图 12.27**\n\n**各种类的 UML 图**\n\
  \n因此，我们为应用程序设计了接口。示例 12.24 显示了 `ColorGrid`。它指定了获取标签、其大小、颜色以及用户是否选择了正确答案的方法。我们从 `Controller`\
  \ 实例变量调用这些方法来管理网格。\n\n![img](img/01665.jpeg)\n\n![img](img/01666.jpeg)\n\n**示例 12.24**\n\
  \n**ColorGrid 接口**\n\n我们现在为游戏编写模型。示例 12.25 显示了 `ColorFrequencyGame`。它由一个 `BorderLayout`\
  \ 管理，包含两个 `JPanel`，一个在西侧，一个在中间。`BorderLayout` 中的其他位置未被使用。西侧面板包含一个垂直排列的按钮数组，由 `GridLayout`\
  \ 管理；中间面板包含一个标签网格，由另一个 `GridLayout` 管理。因此，我们的实例变量是两个面板、按钮数组和一个标签的二维数组（第 17–20 行）。\n\
  \n我们首先在第 27 行将内容面板的布局管理器定义为 `BorderLayout`。然后，在第 29–31 行设置中间位置的面板，通过实例化名为 `grid`\
  \ 的 `JPanel` 实例变量，并使用构造函数参数 `gridSize` 设置其布局管理器为具有相应行数的的 `GridLayout`。在第 33–42 行，我们实例化标签并将它们添加到网格中。\n\
  \n在第 44–46 行，通过实例化名为 `buttonPanel` 的 `JPanel` 实例变量设置西侧位置的面板，将其布局管理器设置为具有 `numberOfButtons`\
  \ 行一列的 `GridLayout`。在第 48–53 行，我们实例化按钮并将它们添加到 `buttonPanel` 中。\n\n我们在第 55–56 行将\
  \ `buttonPanel` 和 `grid` 分别添加到西侧和中间位置的内容面板中。最后，我们为按钮和标签数组提供了访问器方法，以便从类外部访问它们。\n\n\
  我们还提供了方法来为 `buttons` 数组中的每个按钮设置文本并设置 `ActionListener`，并为 `labels` 数组中的每个标签设置背景颜色。通过调用这些方法，控制器可以更改视图（基于模型的数据）。\n\
