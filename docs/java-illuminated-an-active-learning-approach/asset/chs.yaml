  \ Web 风格文档\n- 7.17 总结\n- 7.18 练习、问题与项目\n    - 7.18.1 选择题\n    - 7.18.2 阅读并理解代码\n\
  \    - 7.18.3 填空代码\n    - 7.18.4 识别代码\n    - 7.18.5 调试区域\n    - 7.18.6 编写简短程序\n\
  \    - 7.18.7 编程项目\n    - 7.18.8 技术写作\n    - 7.18.9 小组项目\n\n## 引言\n\n当你看到这一章的标题时，你可能会说：“我们终于可以编写自己的类了。”实际上，我们一直以来都在写类。所有的\
  \ Java 源代码都属于一个类。我们一直以来编写的类是应用程序类或小程序类。这些被称为用户自定义类，因为它们是由我们而不是 Java  way 创建的。\n\n\
  首先，让我们花一点时间检查为什么想要创建自定义类。我们使用了许多 Java 原始类型（`boolean, char, int, double` 等），但现实世界需要处理比\
  \ `boolean` 或 `int` 更复杂的数据。例如，如果你是在线书店的程序员，你将处理与书籍相关的数据。书籍通常有 ISBN、标题、作者、价格、库存数量以及可能的其他数据。我们可以创建一个\
  \ `Book` 类，使得每个对象都包含一本书的数据。\n\n通过将处理数据的方法整合到类中，我们还能够隐藏处理这些数据的细节。应用程序只需根据需要调用方法即可。\n\
  \n### 7.1 定义类\n\n类封装了人、地、物（或更泛地说，对象）的数据的功能。例如，一个类可以被定义为表示学生、大学或课程。\n\n要定义一个类，我们使用以下语法：\n\
  \n![img](img/00726.jpeg)\n\n这个语法应该看起来很熟悉，它是我们程序中的第一行。你可能注意到 Java 类库中的类名都是名词并以大写字母开头：例如\
  \ `Scanner`、`String`、`Math`。Java 开发者鼓励程序员在命名自己的自定义类时遵循这些规范。\n\n\n\n在花括号内部，我们定义类的数据（称为其\
  \ `fields`，字段）以及方法。类方法的一个重要功能是为`客户端程序`（client programs，即类的用户）维护类数据的值，客户端创建对象并调用类的方法。我们的程序曾是许多\
  \ Java 类的客户端，例如 `String`、`DecimalFormat` 和 `Math`。类的字段和方法被称为类的 `members`（成员）。\n\n\
  对于每个类以及类的每个每个成员，我们都需要提供一个`访问修饰符`（access modifier），用于指定该类或成员可以使用的地方（参见表 7.1）。可能的访问修饰符有\
  \ `public`、`private` 和 `protected`，或者不使用任何修饰符，结果结果为包访问权限（package access）。`public`\
  \ 访问修饰符允许类或成员被同类或其他类的方法使用或`引用`（referenced）。`private` 访问修饰符规定类或成员只能被同类的方法引用。包访问权限规定类或成员可以被同一包中的类的方法访问。在本章的稍后部分，我们将学习如何创建自己的包。\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n使用名词作为类名，并以大写字母开头类名。\n\n**表 7.1 访问修饰符**\n\
  \n| **访问修饰符** | **类或成员可以被……引用** |\n| :--- | :--- |\n| `public` | 同类的方法，以及其他类的方法\
  \ |\n| `private` | 仅限同类的方法 |\n| `protected` | 同类的方法、子类的方法以及同一包内类的方法 |\n| 无修饰符（包访问权限）\
  \ | 仅限同一包内的方法 |\n\n通常\n\n通常，类的 `accessModifier` 将是 `public`，我们知道一个 `public` 类必须存储在名为\
  \ `ClassName.java` 的文件中，其中 `ClassName` 是类的名称。\n\n让我们开始定义一个代表汽车的类，我们可以用它来计算每加仑英里数。我们将类命名为\
  \ `Auto`，并使用 `public` 访问修饰符，以便任何应用程序都能使用该类。类头如下所示：\n\n![img](img/00727.jpeg)\n\n\
  当我们编写一个类时，我们将公开 `public` 方法名及其 API，以便客户端程序知道如何实例化对象和调用类的方法。然而，我们不会发布类的实现部分（或代码）。也就是说，我们将发布方法的\
  \ API，但不发布方法的主体。这被称为 `数据隐藏`（data hiding）。客户端程序可以在不知道类如何实现的情况下使用该类，而我们作为类的作者，只要不更改接口（或\
  \ API），就可以更改方法的实现部分。\n\n## 7.2 定义实例变量\n\n类的实例变量（instance variables）持有该类每个对象的数据。因此，我们也说实例变量代表了对象的属性。每个对象（或类的实例）都获得其实例变量的独立拷贝，每个实例变量都可以赋予一个适用于该对象的值。因此，实例变量的值可以代表对象的状态。\n\
  \n实例变量使用以下语法定义：\n\n![img](img/00728.jpeg)\n\n`private` 修饰符通常用于类的非常量实例变量。这允许同类的方法设置或更改实例变量的值。通过这种方式，我们实现了封装；类在数据周围提供了一个保护性外壳。\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n将类的实例变量定义为 `private`，以便只有类的方法能够设置或更改它们的值。\n\
  \n实例变量的数据类型可以是 Java 的任何原始类型或类类型。\n\n`identifierList`（标识符列表）由一个或多个相同数据类型的实例变量名称组成，并可以选择地为实例变量分配初始值。如果给了多个实例变量名，则使用逗号作为分隔符。按照惯例，实例变量的标识符名是名词并以小写字母开头；内部单词以大写字母开头。每个实例变量和类变量必须赋予一个在该类中唯一的名称。在不同的类中使用相同的实例变量名是合法的，但在同一个类内部，同一个名称不能用于多个实例变量或类变量。因此，我们说类的字段具有\
  \ `类作用域`（class scope）。\n\n可选地，你可以将实例变量声明为常量（`final`）。\n\n以下语句是实例变量定义的示例：\n\n![img](img/00729.jpeg)\n\
  \n你应该使用什么标准来选择类的实例变量？答案是选择所有对象共有的数据。例如，对于一个 `Student` 类，你可能会选择学生姓名、平均绩和预计毕业日期。对于一个\
  \ `Calculator` 类，你可能会选择两个操作数、一个运算符和一个结果。\n\n因此，对于我们的 `Auto` 类，我们将定义实例变量来存储汽车的型号、行驶的英里数和消耗的汽油量。因此，我们的\
  \ `Auto` 类定义现在变为：\n\n![img](img/00730.jpeg)\n\n![img](img/00004.jpeg) **软件工程提示**\n\
  \n使用名词作为实例变量的标识符名。标识符以小写字母开头。\n\n![img](img/00004.jpeg) **工程提示**\n\n为所有对象共的数据定义实例变量。\n\
  \n## 7.3 编写类方法\n\n我们将 `Auto` 类的实例变量声明为 `private`，以便只有 `Auto` 类的方法能够访问或更改实例变量。类的客户端需要使用类的方法来访问或更改任何实例变量。因此我们需要编写方法。\n\
  \n方法具有如下语法：\n\n![img](img/00731.jpeg)\n\n其中 `parameter list`（参数列表）是逗号分隔的数据类型和变量名列表。\n\
  \n方法头语法应该是熟悉的，因为我们见过许多类方法的 API。区别仅仅是语义上的。方法调用者向方法发送 `arguments`（参数）或实际参数；方法将这些参数称为其\
  \ `formal parameters`（形式参数）。\n\n由于方法为类提供功能，方法名通常是动词。像实例变量一样，方法名应以小写字母开头，内部单词以大写字母开头。为客户端提供服务的访问修饰符将是\
  \ `public`。仅为类的其他方法提供服务的方法声明为 `private`。\n\n方法的返回类型是方法返回给调用者的数值类型。返回类型可以是 Java 的任何原始数据类型、任何类类型或\
  \ `void`。返回类型为 `void` 的方法不对调用者返回值。\n\n每个方法体写在起始和结束的花括号之间。然而，与 `if` 语句和循环不同，这些花括号不是可选的；无论方法体中有多少语句，花括号都是必须的。\n\
  \n忘记一个或两个花括号都会导致多个编译错误。你可能会收到以下信息之一：\n\n![img](img/00732.jpeg)\n\n或\n\n![img](img/00733.jpeg)\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n使用动词作为方法名。方法名以小写字母开头，内部单词以大写字母开头。\n\n\n\n\
  \n![img](img/00004.jpeg) **软件工程技巧**\n\n将为客户端提供服务的方法声明为 `public`。仅会被类中其他方法调用的方法声明为\
  \ `private`。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\n忘记用大括号包裹方法体会产生一个或多个编译错误。\n\n\
  在方法体中，方法可以声明变量、调用其他方法，并使用我们讨论过的任何程序结构：`if/else` 语句、`while` 循环、`for` 循环、`switch`\
  \ 语句和 `do/while` 循环。\n\n类的所有对象共享类方法的一个副本。\n\n我们实际上已经写过方法了。例如，我们写了 `main` 方法。它的定义看起来如下：\n\
  \n![img](img/00734.jpeg)\n\n我们知道 `static` 关键字意味着 Java 虚拟机（JVM）可以调用 `main` 来启动应用程序运行，而无需先实例化对象。返回类型为\
  \ `void`，因为 `main` 不返回值。参数列表期望一个参数，一个 `String` 数组。我们在本文的其他地方讨论过数组。\n\n我们之前没有写过返回值的方法。返回值的方法使用方法体中的\
  \ `return` 语句将结果发送给调用者。`return` 语句的语法为：\n\n![img](img/00735.jpeg)\n\n正如你预期的那样，表达式的数据类型必须与方法的返回类型匹配。记住，返回值的方法是从表达式中调用的，当方法完成操作时，它的返回值将替换表达式中的方法调用。\n\
  \n如果方法的类型类型是 `void`（如 `main`），我们可以选择使用不带表达式的 `return` 语句，如下语句所示：\n\n![img](img/00736.jpeg)\n\
  \n或者完全省略 `return` 语句。考虑到到达方法末尾时控制权会自动返回给调用者，大多数程序员会在 `void` 方法中省略 `return` 语句。\n\
  \n## 7.4 编写构造函数\n\n构造函数是一种特殊方法，当使用 `new` 关键字实例化对象时会被调用。一个类可以有多个构造函数。类构造函数的作用是初始化新对象的字段。\n\
  \n构造函数的语法如下：\n\n![img](img/00737.jpeg)\n\n注意，构造函数的名称与类相同，且没有返回类型——甚至没有 `void`。\n\
  \n对构造函数使用 `public` 访问修饰符很重要，这样应用程序就可以实例化该类的对象。\n\n构造函数可以为实例变量分配默认值，也可以在对象实例化时通过参数从客户端接收初始值。\n\
  \n为类提供构造函数是可选的。如果你不写构造函数，编译器将提供一个**默认构造函数**，这是一个不接受任何参数的构造函数。此默认构造函数为所有实例变量分配默认初始值；这被称为**自动初始化**。数值变量被赋予值\
  \ 0，字符被赋予 Unicode 空字符，`boolean` 变量被赋予值 `false`，对象引用被赋予值 `null`。表 7.2 显示了默认构造函数分配给实例变量的值。\n\
  \n![img](img/00004.jpeg) **软件工程技巧**\n\n将构造函数定义为 `public`，以便客户端实例化该类的对象。\n\n### 表\
  \ 7.2 实例变量的默认初始值\n\n| 数据类型 | 初始值 |\n| :--- | :--- |\n| `byte` | 0 |\n| `short` |\
  \ 0 |\n| `int` | 0 |\n| `long` | 0 |\n| `float` | 0.0 |\n| `double` | 0.0 |\n| `char`\
  \ | 空字符 ('\\u0000') |\n| `boolean` | `false` |\n| 对象引用 | `null` |\n\n如果我们确实提供了构造函数，我们的构造函数未初始化的任何实例变量仍将被赋予预定义的默认值。\n\
  \n示例 7.1 显示了我们的 `Auto` 类的 1 版本，包含两个构造函数。\n\n![img](img/00738.jpeg)\n\n![img](img/00739.jpeg)\n\
  \n**示例 7.1 *Auto* 类，版本 1**\n\n我们的默认构造函数（第 12–19 行）没有为 `milesDriven` 和 `gallonsOfGas`\
  \ 实例变量赋值。因为 `ints` 和 `doubles` 分别自动初始化为 0 和 0.0，我们直接接受了这些默认值。\n\n然而，我们的构造函数有必要将\
  \ `model` 实例变量设置为一个有效的 `String` 值。因为 `Strings` 是对象引用，它们被自动初始化为 `null`。任何尝试使用 `null`\
  \ 值的 `model` 实例变量调用方法的操作都会产生 `NullPointerException`。\n\n正如前面提到的，你可以为类提供多个构造函数。我们提供了第二个构造函数（第\
  \ 21–47 行），允许客户端为所有实例变量设置初始值。因为类是其字段的守护者，确保每个对象的数据有效是该类的责任。因此，当构造函数为实例变量设置初始值时，它应该首先检查其参数是否确实有效。对于我们的类，如果我们发现\
  \ `milesDriven` 或 `gallonsOfGas` 参数为负数，它会向 `System.err`（默认认为控制台）打印错误消息并将实例变量设置为默认值。\n\
  \n当我们为类提供多个构造函数时，我们是在**重载**方法。为了重载一个方法，我们提供一个名称相同但参数数量不同的方法，或者参数数量相同但至少一个参数数据类型不同的方法。方法的名称以及参数的数量、数据类型和顺序被称为方法的**签名**。因此，要重载方法，新方法必须具有不同的签名。注意返回类型不是签名的一部分。\n\
  \n当客户端调用被重载的方法时，Java 通过查看参数的数量、数据类型和顺序来确定执行哪个版本的方法。示例 7.2 显示了一个实例化三个 `Auto` 对象的客户端程序。\n\
  \n![img](img/00740.jpeg)\n\n**示例 7.2 *Auto* 客户端，版本 1**\n\n第 10 行调用默认构造函数，因为没有向构造函数传递参数。第\
  \ 13 行调用了重载构造函数，因为它向构造函数传递了三个参数。如果客户端尝试使用数量不是 0 或 3 的参数来实例化对象，编译器将生成错误，因为没有匹配这些参数的构造函数。通常，发送到重载方法的参数必须匹配该方法某些的形式的形式参数提供的构造函数的数量是一个设计决策，取决于类。提供多个构造函数为客户端提供了创建对象的选择。至少提供默认构造函数是一个良好的做法。这个原因在我们深入探索类时会变得清晰。提供另一个接收所有实例变量值的构造函数也是一种良好的做法。\n\
  \n![img](img/00741.jpeg)\n\n**图 7.1**\n\n*Auto* 客户端，版本 1 的输出**\n\n\n\n\n\n在第 17\
  \ 行，我们使用一个无效的燃油量（gallons）参数实例化了一个 `Auto` 对象。如图 7.1\n\n这是一个很难发现的错误。类文件将通过编译而不报错，因为编译器不会将此方法识别为构造函数。相反，当客户端程序尝试实例化\
  \ `Auto` 对象时，将得到编译器错误。例如，客户端程序中的这条语句\n\n![img](img/00743.jpeg)\n\n将产生此编译器错误：\n\n\
  ![img](img/00744.jpeg)\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\n当客户端尝试实例化该类的对象时，为构造函数指定返回值会导致客户端程序的编译器错误。\n\
  \n注意两个构造函数都直接访问实例变量。记住，实例变量具有类作用域，这意味着它们可以在类的任何地方被访问。因此，类的任何方法都可以直接访问任何实例变量。在我们的\
  \ `Auto` 类中，任何方法都可以访问实例变量 `model`、`milesDriven` 和 `gallonsOfGas`。\n\n方法也具有类作用域。任何方法都可以调用类中的任何方法，无论这些方法是被声明为\
  \ `private`、`public` 还是 `protected`。\n\n除了访问实例变量外，方法还可以访问其自身的参数。当方法开始执行时，其参数已经完成声明，并被赋予了方法调用者发送的参数值。\n\
  \n参数具有**局部作用域**，因为方法可以直接访问其参数。我们之所以称之为局部作用域，是因为参数是方法局部的；也就是说，方法可以访问自己的参数，但尝试访问另一个方法的参数会产生编译器错误。\n\
  \n表 7.3 总结了作用域规则。\n\n尝试使用不在作用域内的标识符将产生以下编译器错误：\n\n![img](img/00745.jpeg)\n\n**表\
  \ 7.3      作用域规则**\n\n| 类中的方法可以访问：• 该类的实例变量<br>• 发给方法的任何参数<br>• 方法在其体内部声明的任何变量（从声明点直到方法结束，或到该变量声明所在的块结束，以较早者为准）<br>•\
  \ 类中的任何方法 |\n\n你可能奇怪为什么编译器将一个标识符称为**符号**（symbol）。Java 编译器在读取你的代码时会生成一个**符号表**。你声明的每个标识符都会被放入符号表中，同时包含标识符的数据类型以及其在程序中的定义位置。此符号表允许编译器跟踪在任何时刻处于作用域内的标识符。因此，如果一个标识符不在作用域内，编译器将无法在该段代码的符号表中找到该符号。\n\
  \n当示例 7.2 中的客户端运行时，它实例化了三个对象，但我们的应用程序无法对它们做更多其他操作。为了让我们的客户端能够进一步操作 `Auto` 对象，我们需要提供更多方法。\n\
  \n![img](img/00013.jpeg) **技能练习**\n\n**带有这些章末问题**\n\n| **7.18.1** | 多选择题 |\n|  |\
