  \n`Scanner` 对象将其输入划分为一系列称为**标记 (tokens)** 的字符序列，并使用**分隔符 (delimiters)**。默认分隔符是标准的**空白**字符，其中包括空格、制表符和*换行*字符。Java\
  \ 完整的空白字符集详见表 3.9。\n\n默认情况下，当 `Scanner` 对象对输入进行分词时，它会跳过开头的空白，然后构建由所有后续字符组成的标记，直到遇到另一个分隔符为止。因此，如果你有以下代码：\n\
  \n```\n![img](img/00250.jpeg)\n```\n\n并且用户输入了例如三个空格和一个制表符、*21* 以及一个换行：\n\n![img](img/00251.jpeg)\n\
  \n那么 `Scanner` 对象将跳过三个空格和制表符，从字符 *2* 开始构建标记，然后将字符 *1* 添加到标记中，并在遇到*换行*时停止构建。因此，*21*\
  \ 是生成的标记，`nextInt` 方法将其返回到 `age` 变量中。\n\n一个输入行可以包含多个标记。例如，如果我们提示用户输入姓名和年龄，而用户输入了以下行并按下\
  \ *Enter*：\n\n```\n![img](img/00252.jpeg)\n```\n\n那么，开头的空白会被跳过，`Scanner` 对象将创建三个标记：\n\
  \n![img](img/00009.jpeg)*Jon*\n\n![img](img/00009.jpeg)*Olsen,*\n\n![img](img/00009.jpeg)*21*\n\
