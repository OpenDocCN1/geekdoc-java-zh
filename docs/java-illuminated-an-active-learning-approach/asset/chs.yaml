  \n## 9.10.7 编程项目\n\n## 9.10.8 技术文档写作\n\n## 9.10.9 小组项目\n\n## 引言\n\n当我们有大量数据需要存储在内存中时，数组非常有用。如果我们编写一个程序对去年的气温进行统计，设置一个大小为\
  \ 365 的 `doubles` 数组来存储每日气温数据将非常方便。\n\n但如果我们除了分析每日气温外，还想按周或按每周的某一天分析气温呢？例如，如果我们在周末出海，我们可能想知道周六和周日温度高于\
  \ 65 度的次数。如果我们正在考虑在家里安装空调，我们可能想知道有多少周的温度超过了 90 度。如果我们是狂热的滑雪爱好者，我们可能对温度低于 32 度的周数感兴趣。\n\
  \n在这种情况下，我们希望沿着两个维度组织数据：周和每周的几天。如果我们将数据可视化为表格，，可以想象一个由 52 行组成的表格，每行代表一周。每行将有七列，代表每周的每一天。该表格如[图\
  \ 9.1]所示。或者，我们可以想象一个七行的表格，每行代表每周的一天，52 列，每列代表一年中的某周。无论哪种情况，我们都可以使用二维数组来表示气温表格的行和列。更通地说，**多维**数组允许我们用单个数组表示沿\
  \ *n* 个维度组织的数据。\n\n![img](img/01101.jpeg)\n\n**图 9.1 前 52 周的气温数据**\n\n## 9.1 声明与实例化多维数组\n\
  \n与单维数组一样，多维数组是以对象的形式实现的，因此创建一个多维数组与创建单维数组需要相同的两个步骤：\n\n1. 声明数组的对象引用\n2. 实例化数组\n\
  \n在包含基本数据类型元素的数组中，数组的每个元素都包含该类型的值。例如，在 `doubles` 数组中，每个元素包含一个 `double` 值。在包含类数据类型的数组中，每个元素都是一个对象引用，指向该类对象的位置。\n\
  \n## 9.1.1 声明多维数组\n\n要声明多维数组，我们使用与单维数组相同的语法，不同之处在于为每个维度都包含一组空括号。\n\n以下是声明二维数组的语法：\n\
