  \n在执行除法之前忘记检查分母是否为 0 是逻辑错误。\n\n### 6.4.4 寻找最大值或最小值\n\n在之前的示例中，我们通过维护一个运行总和来计算一组数字的总和。我们从总和\
  \ 0 开始，然后将每个新输入值加到运行总和中。同样，我们通过维护一个运行计数来统计输入项的数量。我们从计数 0 开始，每读取一个新值时就增加计数。我们可以将相同的逻辑应用于计算最大值或最小值。例如，要找到一组值中的最大值，我们可以维护一个“运行中的”或当前的最大值。我们首先假设读取的第一个值就是最大值。事实上，它是我们目前为止看到的最大值。然后，当我们读取每个新值时，将其与当前最大值进行比较。如果新值更大，我们将新值设为当前最大值。当我们处理完所有输入值时，当前最大值就是所有输入值的最大值。\n\
