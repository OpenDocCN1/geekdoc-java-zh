  ## 3.14 使用 *NumberFormat* 类格式化输出\n\n与 `DecimalFormat` 类一样，`NumberFormat` 类也可以用于格式化输出数字。然而，`NumberFormat`\
  \ 类提供了专门的 *static* 方法，用于创建专门格式化货币和百分比的对象。\n\n`NumberFormat` 类是 `java.text` 程序包的一部分，因此你需要在程序的顶部包含以下\
  \ `import` 语句。\n\n![img](img/00279.jpeg)\n\n从表 3.14 可以看出，`NumberFormat` 用于格式化货币和百分比的\
  \ *static* 方法是**工厂方法**，用于代替构造函数创建对象。`getCurrencyInstance` 方法返回一个反映货币的格式化对象。在美国，该格式是前导美元符号和小数点后两位数字。`getPercentInstance`\
  \ 方法返回一个用于将分数打印为百分比的对象，原理是将分数乘以 100，舍入到最近的整数百分比并添加百分比符号（%）。\n\n***NumberFormat 方法总结**\n\
  \n| 返回值 | 方法名和参数列表 |\n| :--- | :--- |\n| `NumberFormat` | `getCurrencyInstance(\
  \ )` *static* 方法，创建一个货币的格式化对象 |\n| `NumberFormat` | `getPercentInstance( )` *static*\
  \ 方法，创建一个百分比的格式化对象 |\n| `String` | `format( double number )` 返回根据调用该方法的对象格式化的 `number`\
  \ 的 `String` 表示 |\n\n\n\n\n\n对于这些情况，Java 提供了 `wrapper classes`（包装类）。包装类将原始数据类型（如\
  \ `double` 或 `int`）的值“封装”成一个对象。这些包装类定义了该原始数据类型的实例变量，并提供了用于在对象和原始数据类型之间转换的有用常量和方法。表\
  \ 3.15 列出了每种原始数据类型的包装类。\n\n所有这些类都是 `java.lang` 包的一部分。因此，在程序中使用它们时不需要 `import` 语句。\n\
  \n要将原始类型 `int` 变量转换为 `Integer` 包装对象，我们可以使用 `Integer` 构造函数实例化 `Integer` 对象。\n\n![img](img/00282.jpeg)\n\
  \n**表 3.15     原始数据类型的包装类**\n\n| **原始数据类型** | **包装类** |\n| :--- | :--- |\n| double\
  \ | Double |\n| float | Float |\n| long | Long |\n| int | Integer |\n| short | Short\
  \ |\n| byte | Byte |\n| char | Character |\n| boolean | Boolean |\n\n然而，由于这是一项常用操作，Java\
  \ 为原始数值类型与其对应的包装类之间的转换提供了特殊支持。我们不需要使用 `Integer` 构造函数，只需将 `int` 变量赋值给 `Integer` 对象引用即可。Java\
  \ 会自动为我们提供转换。这种转换被称为 **autoboxing**（自动装箱）。在示例 3.18 中，第 9 行和第 10 行演示了这种转换。`int` 变量\
  \ `intPrimitive` 和 `Integer` 对象 `integerObject` 在第 12 行和第 13 行输出，并且具有相同的值（42）。输出见图\
  \ 3.25。\n\n同样，当 `Integer` 对象被用作 `int` 时，Java 也提供了这种转换，这被称为 **unboxing**（自动拆箱）。因此，当我们在算术表达式中使用\
  \ `Integer` 对象时，会自动使用 `int` 值。示例 3.18 的第 15 行在算术表达式中使用 `Integer` 对象 `integerObject`，将\
  \ `Integer` 对象加上 `int` 变量 `intPrimitive`。如图 3.25 所示，结果与两个操作数都是 `int` 变量时的结果相同。\n\
  \n使用其他数值原始类型及其相关的包装类也可以进行类似的操作。\n\n除了原始类型和包装对象之间的自动转换外，`Integer` 和 `Double` 类还提供了方法（见表\
  \ 3.16），允许我们在原始类型和 `String` 类的对象之间进行转换。\n\n`parseInt`、`parseDouble` 和 `valueOf`\
  \ 方法是 `static` 的，通过使用 `Integer` 或 `Double` 类名和点符号进行调用。`parse` 方法将 `String` 转换为原始类型，而\
  \ `valueOf` 方法将 `String` 转换为包装对象。例如，示例 3.18 的第 18 行将字符串 “76” 转换为 `int` 值 76。第 19\
  \ 行将字符串 “76” 转换为 `Integer` 对象。\n\n![img](img/00283.jpeg)\n\n![img](img/00284.jpeg)\n\
  \n**示例 3.18     包装类的演示**\n\n![img](img/00285.jpeg)\n\n**图 3.25**\n\n**示例 3.18 的输出**\n\
