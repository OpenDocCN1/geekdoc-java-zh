  \n#### 11.7.2 从文件中读取对象\n\n从文件中读取对象与向对象写入文件相似。\n\n\n\n\n\n`ObjectInputStream` 类是\
  \ `InputStream` 的子类，配合 `FileInputStream` 使用，提供了我们所需的功能。我们已经对 `FileInputStream` 类非常熟悉。\n\
  \n`ObjectInputStream` 设计用于从文件中读取对象。`readObject` 方法不接受任何参数，它会从文件中读取下一个对象并返回它。由于 `readObject`\
  \ 方法返回的是泛型 `Object` 类型，我们必须将返回的对象强制转换为相应的类。当到达文件末尾时，`readObject` 方法会抛出 `EOFException`。这与\
  \ `Scanner` 类不同，`Scanner` 提供了 `hasNext` 方法来测试是否已到达文件结尾。\n\n之前讨论的类、构造函数和方法如表 11.9\
  \ 所示。\n\n示例 11.17 显示了如何在 Java 程序中使用这些 `FileInputStream` 和 `ObjectInputStream` 类从文件中读取对象。我们假设文件\
  \ `objects` 包含了上一节节中写入的 `FlightRecord2` 对象。\n\n**表 11.9 用于从文件读取对象的有用类、构造函数和方法**\n\
  \n| 从文件中读取对象的类、构造函数和方法 |\n| :--- | :--- |\n| 类 | 构造函数 | 抛出的异常 |\n| `FileInputStream`\
  \ | `FileInputStream(String filename)` | `FileNotFoundException` |\n| | 从代表文件名的\
  \ `String` 构造 `FileInputStream` 对象 | |\n| `ObjectInputStream` | `ObjectInputStream(InputStream\
  \ in)` | `IOException` |\n| | 从 `InputStream in` 构造 `ObjectInputStream` | |\n| |\
  \ 方法 API | |\n| `ObjectInputStream` | `Object readObject()` 读取下一个对象并返回它。该对象必须是实现\
  \ `Serializable` 接口的类的实例。当到达文件末尾时，抛出 `EOFException` | `IOException, ClassNotFoundException,\
  \ EOFException` |\n\n![img](img/01501.jpeg)\n![img](img/01502.jpeg)\n\n**示例 11.17\
  \ 从文件中读取对象**\n\n第 5 行到第 9 行从 `java.io` 包导入了所需的类。`ClassNotFoundException` 类是 `java.lang`\
  \ 包的一部分，不需要导入。\n\n第 17 行将 `FileInputStream` 对象与 `objects` 文件关联，第 18 行实例化了一个 `ObjectInputStream`\
  \ 对象用于从文件中读取对象。\n\n`while` 循环（第 22 行到第 29 行）读取并打印文件中的每个对象。我们将继续读取，直到 `readObject`\
  \ 方法抛出 `EOFException`，这将控制权转移到 `catch` 块（第 32–35 行）。因此，我们 `while` 循环的条件是：\n\n![img](img/01503.jpeg)\n\
  \n在该 `catch` 块中，我们打印一条检测到文件末尾的消息。由于这种 `while` 循环结构，我们不需要引导读取（priming read）。在 `while`\
  \ 循环内部，我们读取一个对象然后将其打印。当检测到文件末尾时，输出语句（第 28 行）不会执行。\n\n在第 25 行，我们从文件中读取一个对象并将其赋值给\
  \ `FlightRecord2` 对象引用 `temp`。由于 `readObject` 方法返回 `Object`，我们需要将返回值强制转换为 `FlightRecord2`\
  \ 对象。`readObject` 方法还可以抛出 `ClassNotFoundException` 或 `IOException`，它们将分别在第 37 行或第\
  \ 54 行被捕获。\n\n由于到达文件末尾会发生 `EOFException`，因此 `EOFException` catch 块在程序正常运行时始终会执行。因此，`try`\
  \ 块中 `while` 循环之后的任何代码都不会执行。为了能够关闭 `objects` 文件，我们需要使用嵌套的 `try/catch` 块。内部 `try`\
  \ 块（第 20–30 行）包含了 `while` 循环；其关联的 `catch` 块处理 `EOFException` 和 `ClassNotFoundException`。外部\
  \ `try` 块（第 15–47 行）包含了 `FileInputStream` 和 `ObjectInputStream` 对象的实例化、内部 `try`\
  \ 块，以及我们关闭文件的 `finally` 块（第 45 行）。我们可以在 `finally` 块中关闭文件，因为在外部 `try` 块中声明的 `ois`\
  \ 对象引用在 `finally` 块内部是可见的（即在作用范围内）。\n\n外部 `try` 块之后的 `catch` 块处理内部或外部 `try` 块中发生的任何\
  \ `FileNotFoundException` 和任何其他 `IOExceptions`。\n\n将 `EOFException` 的 `catch` 子句放在\
  \ `IOException` 的 `catch` 子句之前是非常重要的；否则永远无法到达 `EOFException` catch 块，因为 `EOFException`\
  \ 是 `IOException` 的子类，因此会匹配 `IOException catch` 块。\n\n图 11.21 显示执行此程序时的控制台输出。注意，在我们读取完文件中最后一个对象并尝试读取另一个之后，`EOFException`\
  \ 的 `catch` 块会执行，然后是 `finally` 块。\n\n![img](img/01504.jpeg) 图 11.21 示例 11.17 的输出\n\
