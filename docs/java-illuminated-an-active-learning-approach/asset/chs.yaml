  \ 类的 `exit` 方法就会很有用。\n\n`System.out` 是 `PrintStream` 类的一个对象，它也是一个已有的 Java 类；可以在\
  \ `java.io` 包中找到。`out` 对象引用**标准输出设备**，默认是 Java 控制台。\n\n**表 3.10 System 类的静态常量和 exit\
