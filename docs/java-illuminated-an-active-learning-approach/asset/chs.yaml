  \ 4 版本。在此类中，我们再次实例化了一个初始余额为 $100.00、月费为 $7.50 的 `CheckingAccount` 对象（第 9 行），然后隐式调用\
  \ `toString` 方法打印对象数据（第 10 行），如图 10.7 所示。\n\n![img](img/01332.jpeg)\n\n**示例 10.10\
  \ CheckingAccountClient, 版本 4**\n\n![img](img/01333.jpeg)\n\n**图 10.7 Checking-AccountClient,\
  \ 版本 4 的输出**\n\n表 10.3 总结了被重写的继承方法的继承规则。\n\n当你重写方法时，请确保方法签名与继承的方法相同。然而，你可以使用一个指定子类对象引的方法来重写继承的方法，而原始方法使用的是父类引用。这是可能的，因为子类对象也是父类对象，所以子类对象引用可以替换任何父类对象引用。如果一个类中的两个方法名称相同但签名不同（即如果参数的数量、顺序或类型不同），那么该方法是*重载*（overloaded），而不是*重写*（overridden）。\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**\n\n\n\n\n\n不要将方法的重写（overriding）与方法的重载（overloading）混淆。子类重写方法提供了该方法的一个新版本，该版本会隐藏父类版本。使用子类对象引用调用该方法的客户端将调用子类版本。类重载方法则提供了该方法的一个新版本，但该版本在参数的数量和/或类型上有所不同。重载方法的所有\
  \ `public` 版本都可供类的客户端调用。\n\n例如，如果我们在 `CheckingAccount` 类中编写 `toString` 方法，并使用以下指定了\
  \ `int` 参数的标方法头：`public String toString(int a)`\n\n![img](img/01334.jpeg)\n\n那么我们的\
  \ `toString` 方法的签名将与从 `BankAccount` 类继承的 `toString` 方法不同，因为后者不接受任何参数。在这种情况下，我们是在重载\
  \ `toString` 方法，而不是重写它。换句话说，我们提供了 `toString` 方法的额外版本。被继承的版本仍然可见并可以调用。\n\n表 10.4\
  \ 展示了重写 `public` 方法与重载 `public` 方法之间的区别。\n\n**表 10.3 重写方法的继承规则**\n\n![img](img/01335.jpeg)\n\
  \n**表 10.4 方法的重写 vs. 重载**\n\n![img](img/01336.jpeg)\n\n![img](img/00004.jpeg) **软件工程提示**\n\
  \n重写继承方法的方法在适当的情况下应该显式地调用直接父类方法，以便处理继承继承的字段。\n\n![img](img/00013.jpeg) **技能练习**\n\
