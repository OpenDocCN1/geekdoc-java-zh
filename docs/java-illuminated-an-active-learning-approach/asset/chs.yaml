  \n| **运算符** | **同层评估顺序** | **操作** |\n| :--- | :--- | :--- |\n| `()` | 左到右 | 显式分组\
  \ |\n| `++` `--` | 右到左 | 快捷后增后减 |\n| `++` `--` `!` | 右到左 | 快捷前增置减、非 |\n| `*` `/`\
  \ `%` | 左到右 | 乘法、除法、取模 |\n| `+` `-` | 左到右 | 加法或字符串拼接 |\n| `<` `<=` `>` `>=` `instanceof`\
  \ | 左到右 | 关系运算符：小于、小于等于、大于、大于等于；instanceof |\n| `==` `!=` | 左到右 | 相等运算符：等于和不等于 |\n\
  | `&&` | 左到右 | 逻辑与 |\n| `\\| \\|` | 左到右 | 逻辑或 |\n| `?:` | 左到右 | 条件运算符 |\n| `=` `+=`\
  \ `-=` `*=` `/=` `%=` | 右到左 | 赋值运算符及快捷赋值 |\n\n### 附录 C\n\n#### 字符集\n\nJava 字符使用\
