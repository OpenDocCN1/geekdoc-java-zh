  \ 被用作第一维度、第二维度……以及第 *n* 维的通用索引。\n\n如果我们跟踪过去 10 年的销售情况，那么我们将得到一个 10x52x7 的数组。针对二维数组讨论的原理仍然适用；我们只是有三个维度而不是两个。以下代码序列说明了如何声明、实例化和访问此三维数组的元素：\n\
  \n**表 9.3 *n* 维数组的结构**\n\n| 维度 | 数组元素 |\n| :--- | :--- |\n| 第一维 | `arrayName[i[1]]`\
  \ 是一个 (n − 1) 维数组 |\n| 第二维 | `arrayName[i[1]][i[2]]` 是一个 (n − 2) 维数组 |\n| 第 *k*\
  \ 维 | `arrayName[i[1]][i[2]][i[3]][..][i[k]]` 是一个 (n − k) 多维数组 |\n| 第 (*n* – 2)维\
  \ | `arrayName[i[1]][i[2]][i[3]][..][i[n−2]]` 是一个二维数组 |\n| 第 (*n* – 1)维 | `arrayName[i[1]][i[2]][i[3]][..][i[n−1]]`\
