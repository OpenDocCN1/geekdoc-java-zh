  \ | 编写短程序 题目 43, 46, 47, 48, 49, 50, 51, 52 |\n\n### 6.10.3 *for* 循环的测试技术\n\n*for*\
  \ 循环最重要的测试之一是循环变量的起始值和结束值是否设置正确。例如，为了执行五次 *for* 循环，我们可以将循环变量的初始值设置为 0 并使用条件 (`i\
  \ < 5`)），或者将循环变量的初始值设置为 1 并使用条件 (`i <= 5`）。这两种 *for* 循环头部都会导致循环执行五次。\n\n![img](img/00654.jpeg)\n\
  \n或者\n\n![img](img/00655.jpeg)\n\n然而，下面的 *for* 循环头部是错误的；循环只会执行四次。\n\n![img](img/00656.jpeg)\n\
  \n因此，为了测试示例 6.15 中提示五个整数的 *for* 循环，我们需要验证程序是否正好输出了五个提示。为了测试我们向用户提示了五次，我们可以在提示处输入整数\
  \ 1, 2, 3, 4 和 5。另一种方案（如图 6.26 所示）是在提示后面加上数字，这具有双重作用。除了让用户知道已输入多少个之外，它还有助于验证提示的数量是否正确。\n\
  \n和 *while* 循环一样，*for* 循环体可能完全不执行。如果循环条件在第一次测试时为 `false`，则会跳过 *for* 循环体。因此，在测试时，我们希望模拟一种在首次遇到\
  \ *for* 循环语句时会导致循环条件为 `false` 的输入。例如，在示例 6.17 的 `Backwards` 类中，我们需要用一个空句子来测试 *for*\
  \ 循环。换句话说，当输入句子的提示时，我们只需点击 *OK* 按钮。如果你尝试这样做，你会发现应用程序仍然运行，如图 6.27 所示。\n\n程序在空句子情况下正常运行，是因为\
  \ *for* 循环初始化语句为：\n\n![img](img/00657.jpeg)\n\n![img](img/00658.jpeg)\n\n**图 6.26:\
  \ 计数五个提示**\n\n![img](img/00659.jpeg)\n\n**图 6.27: 带空句子的 Backwards 类**\n\n因为空 `String`\
  \ 的长度为 0，该语句将 `i` 设置为 −1。循环条件 (`i >= 0`) 为 `false`，因此循环体从不执行。控制流跳转到循环后的语句，\n\n![img](img/00660.jpeg)\n\
  \n它打印了一个空 `String`。虽然检查句子是否为空并打印相应的消息会更符合用户习惯，但程序确实“完全什么都没做，而且非常优雅”。\n\n### 6.11\
  \ 嵌套循环\n\n循环可以嵌套在其他循环内部；也就是说，一个循环的体可以包含另一个循环。例如，一个 *while* 循环可以嵌套另一个 *while* 循环中，或者一个\
  \ *for* 循环可以嵌套在另一个 *for* 循环中。事实上，嵌套循环不需要是相同类型；也就是说，*for* 循环可以嵌套在 *while* 循环中，而 *while*\
  \ 循环也可以嵌套在 *for* 循环中。\n\n如果你正在执行多个操作，且每个操作都有其自己的计数或哨兵值，那么嵌套循环可能会有用。回到杂货收银员 Jane\
  \ 身上，她的工作日可以使用嵌套循环进行建模。在编程活动 1 中，我们编写了收银员计算总成本的代码。\n\n\n\n\n![img](img/00668.jpeg)\n\
  \n但如果我们找不到某个数字的任何因子会怎样？在这种情况下，该数字就是质数。我们可以使用一个名为 `flag` 的 `boolean` 变量来检测这种情况。在开始检查因子的\
  \ `for` 循环之前，我们将 `flag` 设置为 `false`。在 `for` 循环内部，当我们找到一个因子时，将 `flag` 设置为 `true`。换句话说，我们标记（或标记）了发现了因子的这一事实。然后，在\
  \ `for` 循环结束后，我们检查 `flag` 的值。如果它仍然是 `false`，说明我们没有找到任何因子，该数字是质数。我们用于该程序的伪代码现在变为：\n\
  \n![img](img/00669.jpeg)\n\n由于我们只想读取正数，上述伪代码中的“读取第一个数字”和“读取下一个数字”这些行实际上会比简单的语句更复杂。事实上，我们将提示用户输入正数，直到用户输入为止。为了实现这一点，我们将使用\
  \ `do/while` 循环来验证用户的输入。因此，在 `while` 循环内部，我们不仅嵌套了一个 `for` 循环，还嵌套了一个 `do/while` 循环。为了保持伪代码简单，我们没有显示那个\
  \ `do/while` 循环。然而，它包含在示例 6.20 的代码第 17–23 行和 45–51 行中。\n\n将此伪代码翻译成 Java，我们得到了示例\
