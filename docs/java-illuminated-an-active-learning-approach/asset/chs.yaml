  \ 版本 3**\n\n### 10.2.4 覆写继承的方法\n\n当子类继承的方法不能满足我们所需的功能时，我们可以通过提供这些方法的新版本来重写（override）这些继承的方法。我们在图形应用程序中已经见过这一特性。每当我们写一个\
  \ `paint` 方法时，我们都是在重写从 `JFrame` 类继承的相应方法。\n\n要重写继承的方法，我们需要提供一个与继承方法具有相同头部的新方法；也就是说，新方法必须具有相同名称、相同的参数数量和类型以及相同的返回类型。重写方法会使继承的方法版本对子类的客户端变得不可见。我们说被重写的方法对客户端隐藏了。当客户端使用子类对象引用调用该方法时，将调用该方法的子类版本。\n\
  \n子类中的方法仍然可以通过在方法调用之前加上 `super` 关键字来访问继承的方法版本，语法如下：\n\n```\n![img](img/01329.jpeg)\n\
  ```\n\n在我们的 `CheckingAccount` 类中，我们从 `BankAccount` 类继承了 `toString` 方法。但此方法只返回 `balance`。在示例\
  \ 10.8 中，我们需要调用 `CheckingAccount` 方法 `getMonthlyFee` 来打印 `monthlyFee` 的值。此外，如图 10.6\
  \ 所示，`balance` 值经过了格式化处理。这一次，我们调用了 `CheckingAccount` 类的 `toString` 方法，它同时返回 `balance`\
  \ 和 `monthlyFee` 值，并如所示格式化为货币。相反，我们可以通过重写继承的 `toString` 方法来实现这一点。\n\n示例 10.9 显示了带有新\
  \ `toString` 方法（第 59–67 行）的 `CheckingAccount` 类第 4 版本。为了格式化 `balance`，我们调用 `BankAccount`\
  \ 类的 `toString` 方法（第 65 行），并将格式化后的 `monthlyFee` 值添加到返回的 `String` 中。注意，我们不需要为了格式化\
  \ `monthlyFee` 实例变量而实例化一个新的 `DecimalFormat` 对象。将 `MONEY` 对象设为 `public` 的优点是，如果我们想更改打印数据的格式，只需要更改一处：重新定义\
  \ `BankAccount` 类中 `MONEY` 的值。\n\n![img](img/01330.jpeg)\n\n![img](img/01331.jpeg)\n\
