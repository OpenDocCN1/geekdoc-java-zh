  \ 和 `withdraw`？\n\n## 10.5 抽象类和方法\n\n在我们的银行层级结构中，我们可以实例化 `BankAccount`、`CheckingAccount`\
  \ 和 `SavingsAccount`。然而，我们希望层级结构中的所有类都提供 `draw` 方法；但 `Figure` 类除了绘制的点外没有内容，所以它的\
  \ `draw` 方法无事可。因此，我们不会在 `Figure` 类中提供 `draw` 方法的实现；相反，我们将 `draw` 方法定义为 `abstract`\
  \ 方法。\n\n声明为 `abstract` 的类不能被实例化。通常，`abstract` 类包含至少一个 `abstract` 方法，子类必须实现该方法。\n\
  \n让我们详细查看 `Figure` 层级结构的代码。示例 10.15 显示了抽象类 `Figure`。我们在类头（第 7 行）中将类定义为 `abstract`。构造函数（第\
  \ 13-22 行和第 24-37 行）实例化 `x` 和 `y` 值以及所有图形共有的 `Color` 对象。`Figure` 类还为其实例变量提供了访问器和修改器方法。抽象\
  \ `draw` 方法（第 88-91 行）提供了 `draw` 方法的接口，但没有实现——只有一个分号。`Figure` 类的 `Circle` 和 `Square`\
  \ 子类将提供 `draw` 方法的相应实现。\n\n![img](img/01350.jpeg)\n```\npublic abstract void draw();\n\
  ```\n\n![img](img/01351.jpeg)\n\n例如，为了绘制图形，我们可以建立图 10.12 所示的层级结构。`Object` 下的根类是抽象类\
  \ `Figure`，我们派生了两个子类：`Circle` 和 `Square`。在 UML 图中，`Figure` 类名设置为斜体，以表示它是一个抽象类。\n\
  \n所有图形都有一个坐标和颜色，因此 `Figure` 类定义了三个字段：两个 `int` 类型 `x` 和 `y`，以及一个名为 `color` 的 `Color`\
  \ 对象。\n\n![img](img/01352.jpeg)\n![img](img/01353.jpeg)\n![img](img/01354.jpeg)\n\
  ![img](img/01355.jpeg)\n\n### 示例 10.15 抽象 Figure 类\n\n\n\n\n\n当子类继承自一个 `abstract`（抽象）类时，它可以为任何、所有或一个都不包含的\
  \ `abstract` 方法提供实现。如果子类没有完全实现父类所有的 `abstract` 方法，那么该子类也必须被声明为 `abstract`。然而，如果子类实现了父类中所有的\
  \ `abstract` 方法，且子类没有被声明为 `abstract`，那么该类就不是 `abstract`，我们可以实例化该子类的对象。\n\n示例 10.16\
  \ 显示了 `Circle` 类，它继承自 `Figure` 类并添加了一个 `radius` 实例变量。在重载的构造函数，我们将 `startX`、`startY`\
