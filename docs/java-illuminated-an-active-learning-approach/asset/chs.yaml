  \ | **\\u00A0, \\u2007, \\u202F** |\n| tab | **\\u0009, \\u000B** |\n| line feed\
  \ | **\\u000A** |\n| form feed | **\\u000C** |\n| carriage return | **\\u000D**\
  \ |\n| file, group, unit, and record separators | **\\u001C, \\u001D, \\u001E, \\\
  u001F** |\n\n注意逗号不是空白字符，因此逗号实际上第二个标记的一部分。为了输入这三个标记，你的程序将调用两次 `next` 方法来获取两个 `String`\
  \ 标记，并调用一次 `nextInt` 来获取年龄。\n\n为了获取用户的一整行输入，我们使用 `nextLine` 方法。示例 3.11 显示了如何在程序中使用\
