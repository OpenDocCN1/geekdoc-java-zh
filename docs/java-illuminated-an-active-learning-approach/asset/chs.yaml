  \ 44 行或 45 行），并再次运行应用程序。\n\n## 12.7 单选按钮和复选框\n\n如果你曾经完成过网络调查，你可能熟悉单选按钮和复选框。\n\n\
  单选按钮提示用户从多个相互互斥的选项中选择一个。点击任何单选按钮都会取消之前选中的选项。因此，在一组单选按钮中，用户一次只能选择一个选项。\n\n复选框通常与“选择所有适用项”指令相关；也就是说，用户被要求选择\
  \ 0、1 或多个选项。复选框是一种按钮，如果选项当前未选中，点击复选框将选中该选项；如果选项当前已选中，点击复选框将取消该选项。\n\n属于 `javax.swing`\
  \ 包的 `JRadioButton` 和 `JCheckBox` 类分别封装了单选按钮和复选框的概念。我们将展示两个类似的示例，以说明如何使用这些类以及它们之间的区别。两个示例都允许用户为标签组件选择背景颜色。我们显示三种颜色选项：红、绿、蓝。使用单选按钮，一次只能选择一个选项。因此，通过点击单选按钮，用户可以将标签背景显示为三种颜色中的一种。使用复选框，用户可以选择三种颜色选项的任何组合，因此标签颜色可以设置为八种可能组合中的任何一种。表\
  \ 12.11 列出了所有组合。\n\n表 12.12 显示了 `JRadioButton`、`ButtonGroup` 和 `JCheckBox` 类的几个构造函数。\n\
  \n**表 12.11 使用单选按钮对比复选框选择颜色**\n\n![img](img/01593.jpeg)\n\n**表 12.12 JRadioButton、ButtonGroup\
  \ 和 JCheckBox 类的实用构造函数**\n\n| **JRadioButton、ButtonGroup 和 JCheckBox 类的构造函数** |\n\
  | :--- |\n| **构造函数** |\n| **类** | **构造函数** |\n| **JRadioButton** | `JRadioButton(String\
  \ buttonLabel)` |\n| | 构建一个标记为 `buttonLabel` 的单选按钮。默认情况下，单选按钮初始未选中。 |\n| **JRadioButton**\
