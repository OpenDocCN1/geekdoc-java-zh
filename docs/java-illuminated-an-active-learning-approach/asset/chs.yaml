  \ 11.8 的输出**\n\n## 11.4 写入和追加文本文件\n\n在上一节中，我们学习了如何从文本文件中读取数据。但数据最初是如何进入文件的呢？可能是有人使用文本编辑器（如\
  \ Windows 中的记事本或 Mac OS 中的 TextEdit）将数据放入文件。当数据量较小时，向文件中输入数据是方便的。但通常文件包含大量数据，这些数据通常是由计算机程序写入文件的。例如，Web\
  \ 服务器会写入日志文件以跟踪访问网站的访、他们是如何进入网站的、到达时间等。如果 Web 服务器受到黑客的攻击，可以查看这些日志文件来确定黑客的来源、身份以及其他信息。\n\
  \n在本节中，我们将学习如何向文本文件写入内容。但在进入细节之前，我们必须区分以下几种情况：\n\n![img](img/00009.jpeg)创建/写入新文件，即文件不存在。\n\
  \n![img](img/00009.jpeg)向现有文件写入，并用新数据替换文件内容。\n\n![img](img/00009.jpeg)向现有文件写入，但保留文件内容并在文件末尾添加数据。这被称为对文件进行**追加**（appending）。\n\
  \nJava 为我们提供了执行上述所有操作所需的工具。表 11.5 总结了根据我们执行的操作不同所会发生的情况。\n\n### 11.4.1 写入文本文件\n\n\
  我们需要写入文件的数据可以是原始数据类型，如 `ints`、`doubles` 或 `booleans`，甚至是对象，如 `Strings`。\n\n**表 11.5\
  \ 向现有文件或新文件写入或追加**\n\n| **操作** | **如果文件存在…** | **如果文件不存在…** |\n| --- | --- | ---\
  \ |\n| 写入 (write) | 文件的当前内容被删除，从文件开头开始写入 | 创建文件并从文件开头开始写入 |\n| 追加 (append) | 数据被添加到文件末尾，保留现有内容\
  \ | 创建文件并从文件开头开始写入 |\n\n`FileOutputStream` 是 `OutputStream` 类的子类，设计用于向文件写入字节流。它有几个构造函数，其中一个接受一个文件名和一个模式作为其两个参数。`boolean\
  \ mode` 变量指定了我们是向文件写入（`false`）还是追加（`true`）。\n\n`PrintWriter` 类设计用于将数据转换为字符并写入文件。它提供了将基本数据类型转换为字符并写入文本文件的设计，它也适用于\
  \ `Strings` 和对象。`print` 方法将值写入文件，而 `println` 方法将值写入文件后跟一个 `newline` 字符。其构造函数和方法\
  \ API 在表 11.6 所示。\n\n**表 11.6 写入文本文件的有用类、构造函数和方法**\n\n| **写入文本文件的类、构造函数和方法** |\n\
  | **类** | **构造函数** | **抛出的异常** |\n| --- | --- | --- |\n| `FileOutputStream` | `FileOutputStream(String\
  \ filename, boolean mode)` | `FileNotFoundException` |\n| | 从文件名的字符串构造 `FileOutputStream`\
  \ 对象；如果 `mode` 为 `false`，我们写入文件；如果 `mode` 为 `true`，我们追加到文件 | |\n| `PrintWriter`\
  \ | `PrintWriter(OutputStream os)` | |\n| | 从 `OutputStream` 对象构造 `PrintWriter`\
  \ 对象 | |\n| | **方法 API** | |\n| | `void print(int i)` `void print(double d)` `void\
  \ print(char c)` `void print(boolean b)` `…` `void println(int i)` `void println(double\
  \ d)` `…` 将参数写入文件 | None |\n| | `void close()`  `PrintWriter` 对象资源 | |\n\n示例 11.9\
  \ 展示了如何使用 `PrintWriter` 类将 `Strings` 和原始数据类型写入名为 `grades.txt` 的文件。\n\n![img](img/01474.jpeg)\n\
  \n**示例 11.9 向文件写入数据类型和字符串**\n\n第 15–16 行实例化 `FileOutputStream` 对象以写入 `grades.txt`\
  \ 文件。`FileOutputStream` 构造函数抛出 `FileNotFoundException`。我们在第 36–39 行捕获此异常。这是唯一的 *catch*\
  \ 块，因为 `PrintWriter` 类的方法不抛出异常。\n\n第 20 行实例化 `PrintWriter` 对象，我们将使用它。在第 22 到 30\
  \ 行，使用 `PrintWriter` 对象 `pw`，我们调用 `print` 和 `println` 方法，传递各种 `String` 和原始数据类型参数写入文件。\n\
