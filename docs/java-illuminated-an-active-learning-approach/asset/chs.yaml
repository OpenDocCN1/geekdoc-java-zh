  \ | 题目 31, 32 |\n\n### 5.2 使用 *if* 进行简单选择\n\n简单选择模式适用于你的程序需要对一组数据执行操作，但不对所有其他数据执行操作的情况。对于这种情况，我们使用简单的\
  \ `if` 语句，其模式如下：\n\n![img](img/00419.jpeg)\n\n`if` 语句可以包含一个或多个指令；如果只包含一条语句，大括号是可选的。图\
  \ 5.2 显示了 *if* 语句的结构。\n\n在示例 5.2 中，我们首先测试加分是否大于 0。如果是，我们将加分加到第 12–13 行。如果条件为*假*，我们跳过第\
  \ 14–18 行。然后编译器得出结论，当条件为*真*时没有指令要执行。因此，当程序运行时，第 19–20 行的语句被视为紧跟在 *if* 语句之后。\n\n\
  ![img](img/00420.jpeg) **图 5.2 if 的控制流**\n\n![img](img/00421.jpeg) **图 5.3 有加分的示例\
  \ 2 输出**\n\n![img](img/00422.jpeg) **图 5.4 无加分的示例 2 输出**\n\n![img](img/00423.jpeg)\
  \ **示例 5.2 使用 if 语句**\n\n对 *if* 语句的真块进行缩进。许多软件工程师认为即使真块只有一个语句，包含大括号也是良好的习惯，因为它们突出了条件为*真*时执行的代码。如果程序需求发生，需要在真块中添加第二条语句，大括号已经存在了。\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n对真块进行缩进。\n\n注意条件后没有分号。如果你在条件后放置一个分号，如此**错误**语句所示：\n\
  \n![img](img/00424.jpeg)\n\n编译器不会产生错误。相反，它认为分号表示 *if* 语句是空的，因为分号本身表示一个无操作的语句。在这种情况下，编译器得出结论，当条件为*真*时没有指令要执行。因此，当程序运行时，该语句被视为紧跟在\
  \ *if* 语句之后，因此无论 `grade` 的值如何，都会打印“You passed”。\n\n![img](img/00005.jpeg) **常见陷阱**\n\
  \n在 *if* 语句的条件后添加分号表示真块为空，会导致运行时逻辑错误。\n\n### 5.3 使用 *if/else* 进行选择\n\n*if* 语句的第二形式适用于数据属于两个互斥类别，并且每个类别应执行不同指令的情况。对于这些情况，我们使用\
  \ `if/else` 语句，其模式如下：\n\n![img](img/00426.jpeg)\n\n如果条件为*真*，执行真块并跳过假块。如果条件为*假*，跳过真块并执行*假*块。在任何情况下，*if*\
  \ 语句之后的语句都会被执行。图 5.5 说明了 *if/else* 语句的控制流。\n\n![img](img/00427.jpeg) **图 5.5 if/else\
  \ 的控制流**\n\n如果真块或假块只包含一条语句，则该块的大括号是可选的。\n\n\n\n再次，注意 `true` 和 `false` 块的缩进，以及 `else`\
  \ 和大括号与 `if` 对齐。这种编码风格可以很容易地看出哪些语句属于 `true` 块，哪些语句属于 `false` 块。如果缩进不正确，程序的阅读者可能会误解哪些语句将被执行。在任何情况下，编译器都会忽略缩进；缩进的设计仅是为了让人类更容易地理解代码的逻辑。\n\
  \n在示例 5.3 中，我们测试了一个分数以判断它是及格分（>= 60）还是不及格分（任何其他值）。这是一个数据互斥的情况：分数要么是及格分，要么不是及格分。我们希望根据分数打印不同的消息。在提示用户输入数字分数后，我们声明了一个\
  \ `String` 来存储适当的消息（第 16 行），该消息将在我们的 `if/else` 语句中确定。如果 `if` 条件 `(grade >= 60)`\
  \ 为真，则我们将“You passed”赋值给 `message`。如果条件为假，我们把“You failed”赋值给 `message`。在第 22 行，在在\
  \ `if/else` 语句完成后，我们打印赋值给 `message` 的任何 `String`。图 5.6 和 5.7 显示了程序的两次运行，首先是分数大于或等于\
  \ 60 的，然后是分数小于 60 的。\n\n![img](img/00428.jpeg)\n\n**示例 5.3 使用 *if/else* 语句操作**\n\
  \n![img](img/00429.jpeg)\n\n**图 5.6 示例 5.3 在 *grade* >= 60 时的输出**\n\n![img](img/00430.jpeg)\n\
  \n**图 5.7 示例 5.3 在 *grade* < 60 时的输出**\n\n注意，我们可以使用两个连续的 `if` 语句，如下：\n\n![img](img/00431.jpeg)\n\
  \n然而，如果第一个条件 `(grade >= 60)` 为假，则第二个条件 `(grade < 60)` 必须为真。因此，`if/else` 简化我们的处理，并避免了在只有一个条件可能为真的情况下不两个测试两个条件。\n\
  \n### 块作用域\n\n变量的 `scope`（作用域）是程序中变量可以被 `referenced`（引用）或使用的区域。当我们声明一个变量时，它的作用域从声明点一直延伸到声明它的代码块的结束。一个方法（如\
  \ `main`）是一个块。因此，在示例 5.3 中，对象引用 `scan` 的作用域从第 11 行延伸到 `main` 的结束。因此，我们可以在第 14 行合法地引用\
  \ `scan`。同样，`grade` 的作用域从它的声明（第 14 行）延伸到 `main` 的结束，我们可以在第 17 行的 `if` 条件中合法地引用它。最后，`String\
  \ message` 的作用域从第 16 行延伸到 `main` 的结束，因此我们可以在第 18、20 和 22 行合法地引用 `message`。\n\n`if`\
  \ 语句的 `true` 块和 `false` 块也是块。因此，如果我们不是在第 16 行声明 `String message`，而是像下面在 `if` 语句的\
  \ `true` 块内部声明：\n\n![img](img/00432.jpeg)\n\n那么 `message` 的作用域仅从它的声明延伸到 `true` 块的结束。在这种情况下，编译器为\
  \ `false` 块内部对 `message` 的引用以及 `if` 语句后的 `System.out.println` 语句生成“cannot find symbol”错误消息，因为\
  \ `message` 在 `true` 块之外超出了作用域。\n\n### 代码演示\n\n在配套网站上，你将找到一个 Flash 电影，逐步演示如何使用 `if/else`\
