  \ 8.24 显示了一个样例运行示例，使用插入排序算法对整数数组进行排序。\n\n![img](img/01017.jpeg)\n\n![img](img/01018.jpeg)\n\
  \n**示例 8.19 使用插入排序**\n\n![img](img/01019.jpeg)\n\n**图 8.24 使用插入排序**\n\n## 8.6.4\
  \ 对象数组的排序\n\n我们在章节的早些部分看到，要排序的数据项可以是原始数据类型，例如整数或 `doubles`。但它们也可以是对象。对于对象数组，重要的是要理解我们需要排序的是对象本身，而不是数组元素（数组元素仅仅是对象的引用或对象的内存位置）。\n\
  \n对象数组使用排序键（sort key）进行排序，排序键是对象的一个或多个实例变量。例如，如果我们有邮件对象，可以按接收日期、作者、主题等进行排序。需要注意的是，当我们对对象排序时，必须尊重对象的完整性；例如，当我们按发送者对一组邮件对象排序时，我们排序的是邮件对象集合，而不是发送者集合。\n\
  \n因此，为了对 `Auto` 对象的 `cars` 数组执行插入排序，我们需要决定 `Auto` 对象的哪个字段（或哪些字段）决定了对象的顺序。如果我们说 `model`\
  \ 是排序字段，那么比较语句将比较两个对象中的模型，即两个 `Strings`。`String` 类的 `compareTo` 方法比较两个 `Strings`\
  \ 的值。如果调用该方法的 `String` 大于作为参数传递的 `String`，则返回一个正数。\n\n要使用插入排序对 `cars` 数组，我们需要对 `InsertionSort`\
  \ 方法进行多次修改。首先，必须在参数列表中将数组的数据类型声明为 `Auto`。其次，`temp` 需要定义为 `Auto` 引用，最后，我们需要在比较数组元素的条件中替换\
  \ `compareTo` 方法。\n\n修改后的插入排序代码如下：\n\n![img](img/01020.jpeg)\n\n## 8.6.5 排序数组的顺序查找\n\
  \n在章节的早些部分，`DVDWinners` 类对数组进行了顺序查找。该算法假设元素是无序的。如果我们对数组进行排序，那么当搜索键不在数组中时，可以更高效地实现顺序查找。我们不需要在遍历整个数组之后才发现搜索键不在数组中，一旦越过了该元素如果在数组中应所在的位置，就可以停止。换句话说，如果数组按升序排序，当我们发现数组中有一个大于搜索键的元素时，就可以识别出搜索失败。因为数组是升序排序的，该元素之后的所有元素都比该元素大，因此也比搜索键大。\n\
  \n为了实现该算法，我们可以在 `for` 循环条件中添加另一个测试，以便在找到大于搜索键的元素时立即退出循环。接下来所示的改进算法可以替换示例 8.14 中的\
  \ `indexOfWinner` 方法，用于对排序后的 `winners` 数组进行顺序查找：\n\n![img](img/01021.jpeg)\n\n事实上，如果数组是排序的，可以使用名为“二分查找”（Binary\
  \ Search）的算法进行更高效的搜索，我们将在下一节中解释。\n\n## 8.6.6 排序数组的二分查找\n\n如果你玩过“猜数字”游戏，你可能用过**二分查找**（Binary\
  \ Search）的概念。在这个游戏中，有人要求你猜一个 1 到 100 之间的秘密数字。你每猜一个数字，他们都会告诉你秘密数字比你的猜想大还是小。一个很好的策略是猜中间的数字，在这个例子中是\
  \ 50。无论秘密数字比 50 大还是小，你都排除了一半的可能值。如果秘密数字大于 50，那么你知道你的下一次猜测应该是 75（50 和 100 之间一半）。如果秘密数字小于\
  \ 50，你的下一次猜测应该是 25（1 和 50 之间一半）。如果你继续……\n\n同样，对排序数组进行二分查找也是通过消除中间元素来工作的。如果中间元素的值等于键，我们返回它的索引。如果不是，我们测试子数组中间的值是否大于键。如果是，我们将子数组缩小为索引小于中间且大于\
  \ `start` 的元素。如果子数组中间的值小于键，我们将子数组缩小为索引大于中间且小于 `end` 的元素。\n\n示例 8.20 展示了我们的二分查找。\n\
  \n![img](img/01022.jpeg)\n\n![img](img/01023.jpeg)\n\n**示例 8.20 排序数组的二分查找**\n\n\
  我们首先声明并初始化一个包含 17 个元素的整数数组（第 12–13 行）。然后提示用户输入搜索键，并调用 `binarySearch` 方法（第 16–19\
  \ 行）。\n\n`binarySearch` 方法代码位于第 26–50 行。局部变量 `start` 和 `end` 存储子数组的第一个和最后一个索引。由于我们从整个数组开始搜索，将其初始化为作为参数传递的数组的和最后一个元素的索引。在第\
  \ 30 行定义的局部变量 `middle` 将存储子数组中间元素的索引。\n\n搜索在 `while` 循环中执行（第 32–48 行），循环的条件判断子数组是否为空。如果子数组为空，我们通过将第一个和最后一个元素的索引相加除以\
  \ 2 来计算 `middle` 的值（第 34 行）。接下来我们测试中间索引的值是否等于键。如果是，我们找到了键并返回其索引，即 `middle`（第 36–39\
  \ 行）。如果不是，我们测试子数组中间的值是否大于键。如果是，我们将子数组缩小为索引小于中间且大于等于 `start` 的元素（第 40–43 行）。如果子数组中间的值小于键，我们将子数组缩小为索引大于中间且小于等于\
  \ `end` 的元素（第 44–47 行）。\n\n\n\n当 `while` 循环继续时，我们重新评估条件以确定子数组是否为空，如果不为空，则继续进行比较，要么返回搜索键的索引，要么减小子数组的。如果搜索键不在数组中，子数组最终将为空，此时我们退出\
  \ `while` 循环并返回 −1（第 49 行）。图 8.25 显示了找到搜索键时的输出。\n\n![img](img/01024.jpeg)\n\n**图\
  \ 8.25 示例 8.20 的输出**\n\n让我们对键 7 运行二分查找算法，以说明当算法在数组中找到键时是如何运行的。这里是数组 `numbers:`：\n\
  \n![img](img/01025.jpeg)\n\n当调用 `binarySearch` 方法时，它将 `start` 设置为 0，将 `end` 设置为\
  \ `arr.length – 1`，即 16。因此，`middle` 的值为 8。\n\n索引 8 处的元素 (45) 大于 7，因此我们将 `end` 设置为\
  \ 7 (`middle` – 1)，现在我们将搜索左侧的子数组（后续高亮显示）。`middle` 的值现在是 3 (( 0 + 7 ) / 2)。\n\n![img](img/01026.jpeg)\n\
  \n索引 3 处的元素 (8) 大于 7，因此我们将 `end` 设置为 2 (`middle` – 1)，并继续在左侧的子数组中搜索（后续高亮）。`middle`\
  \ 的值现在是 1 (( 0 + 2 ) / 2)。\n\n![img](img/01027.jpeg)\n\n索引 1 处的元素 (6) 小于 7，因此我们将\
  \ `start` 设置为 2 (`middle` + 1)，并在右侧的子数组中搜索（后续高亮）。`middle` 的值现在是 2 (( 2 + 2 ) / 2)。\n\
  \n![img](img/01028.jpeg)\n\n索引 2 处的元素 (7) 等 7。我们找到了该值并返回它的索引 2。\n\n现在让我们对键 34 运行之前的示例，以说明当数组中未找到键时算法是如何运行的。\n\
  \n再次是数组 `numbers`：\n\n![img](img/01029.jpeg)\n\n再次，当调用 `binarySearch` 方法时，它将 `start`\
  \ 设置为 0，将 `end` 设置为 `arr.length – 1`，即 16。因此，第一次比较时，`middle` 被赋值为 8。\n\n索引 8 处的元素\
  \ (45) 大于 34，因此我们将 `end` 设置为 7 (`middle` – 1)，并继续在左侧子数组中搜索。下一次比较时，`middle` 的值变为\
  \ 3。\n\n![img](img/01030.jpeg)\n\n索引 3 处的元素 (8) 小于 34，因此我们在下方高亮的右侧子数组中搜索。`middle`\
  \ 的值现在是 5。\n\n![img](img/01031.jpeg)\n\n索引 5 处的元素 (15) 小于 34，因此我们在右侧子数组中搜索。`middle`\
  \ 的值现在是 6。\n\n![img](img/01032.jpeg)\n\n索引 6 处的元素 (22) 小于 34，因此我们在右侧子数组中搜索。`middle`\
  \ 的值现在是 7。\n\n![img](img/01033.jpeg)\n\n此时，`start`、`end` 和 `middle` 的值都为 7。索引 7\
  \ 处的元素 (36) 大于 34，因此我们将 `end` 赋值为 `middle` – 1，即 6。这使得 `end` 小于 `start`，结果导致 `while`\
  \ 循环条件评估为 `false`。我们没有找到 34，因此返回 −1。\n\n## 8.7 编程活动 2：数组的搜索与排序\n\n在活动中，你将再次处理一个包含\
  \ 15 个元素的整数数组，执行以下活动：\n\n1. 编写一个方法对数组执行顺序查找（Sequential Search）。\n2. 编写一个方法实现冒泡排序算法对数组排序。\n\
  \n冒泡排序的基本方法是对数组进行多次遍历。在每次遍历中，我们比较相邻的元素。如果任何两个相邻元素的顺序错误，我们就通过交换它们的值来使它们有序。\n\n要对包含\
  \ `n` 个元素的数组进行升序排序，冒泡排序实现了一个双层循环：\n\n![img](img/00009.jpeg) 外层循环执行 `n – 1` 次。\n\n\
  ![img](img/00009.jpeg) 对于外层循环的每次迭代，内层循环遍历数组所有未排序元素并执行以下操作：\n\n| 外层循环计数器 | 排序位置元素的索引\
  \ |\n| :--- | :--- |\n| 0 | `n – 1` |\n| 1 | `n – 2, n – 1` |\n| 2 | `n – 3, n –\
  \ 2, n – 1` |\n| … | … |\n| `n – 3` | `2, 3, 4, …, n – 3, n – 2, n – 1` |\n| `n\
  \ – 2` | `1, 2, 3, 4, …, n – 3, n – 2, n – 1` |\n\n![img](img/00009.jpeg) 将当前元素与数组中的下一个元素比较。\n\
  \n![img](img/00009.jpeg) 如果下一个元素较小，则交换这两个元素。此时，`n – 1` 个元素已移动到它们的正确位置。只剩下索引 0 处的元素，因此它在数组中也是正确的位置。数组现在已经排序。当外层循环计数器从\
  \ 0 变为 `n – 2`，它迭代了 `n – 1` 次。\n\n冒泡排序的伪代码如下：\n\n![img](img/01034.jpeg) 例如，让我们对以下数组运行冒泡排序。开始时，未排序的数组为\n\
  \n![img](img/01035.jpeg) 外层循环计数器 `i` 的值为 0，内层循环计数器 `j` 的值也为 0。我们比较元素 17 (j = 0)\
  \ 和 26 (j + 1)。由于 17 小于 26，我们不交换。内层循环计数器 `j` 递增，现在为 1。\n\n![img](img/01036.jpeg)\
  \ 比较 26 (j = 1) 和 5 (j + 1)。由于 26 大于 5，我们交换它们。内层循环计数器 `j` 递增，现在为 2。\n\n![img](img/01037.jpeg)\
  \ 比较 26 (j = 2) 和 2 (j + 1)。由于 26 大于 2，我们交换它们。内层循环计数器 `j` 递增，现在为 3；因此我们退出内层循环。（已到达未排序子数组的末尾。）内层循环执行结束后，26\
  \ 已经“浮”到了它的正确位置。\n\n现在现在回到外层循环，外层循环计数器 `i` 递增，现在为 1。重新进入内层循环，内层循环计数器 `j` 初始化为 0。\n\
  \n![img](img/01038.jpeg) 比较 17 (j = 0) 和 5 (j + 1)。由于 17 大于 5，我们交换它们。内层循环计数器 `j`\
  \ 递增，现在为 1。\n\n![img](img/01039.jpeg) 比较 17 (j = 1) 和 2 (j + 1)。由于 17 大于 2，我们交换它们。内层循环计数器\
  \ `j` 递增，现在为 2；因此我们退出内层循环。（已到达未排序子数组的末尾。）此时，17 已经“浮”到了它的正确位置。\n\n现在回到外层循环，外层循环计数器\
  \ `i` 递增，现在为 2，这将是外层循环的最后一次。重新进入内层循环，内层循环计数器 `j` 初始化为 0。\n\n![img](img/01040.jpeg)\
  \ 比较 5 (j = 0) 和 2 (j + 1)。由于 2 小于 5，我们交换它们。内层循环计数器 `j` 递增，现在为 1；因此我们退出内层循环。（已到达未排序子数组的末尾。）此时，5\
  \ 已经“浮”到了数组中的正确位置。\n\n对于数组中的四个元素，我们执行了三次外层循环。\n\n![img](img/01041.jpeg) 数组现在已经排序。\n\
