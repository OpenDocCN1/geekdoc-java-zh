  \ 行弹出对话框向用户表示祝贺。\n\n```java\n//（注意：提供的文本在源码中突然中断， \n// 但代码逻辑遵循上述结构）\n```\n\n\n\n\
  \n我们的下一个示例使用了 `BorderLayout` 来演示我们如何混合红色、绿色和蓝色来创建一种新颜色。我们在西、南、东位置放置了按钮，分别代表红色、绿色和蓝色。我们在中心位置放置了一个标签（label）来显示正在制作的颜色。颜色的值范围介于\
  \ 0 到 255 之间。当用户点击其中一个按钮时，我们根据指定的增量改变该颜色的相应数量。例如，如果红色的数量为 100，增量为 10，且用户点击红色按钮，那么红色的值将变为\
  \ 110。\n\n在北位置，我们放置了一个“更改方向（Change Direction）”按钮，它将使增量在正值和负值之间切换；例如，如果增量为 10 且用户点击该按钮，增量将变为\
  \ −10。\n\n在这个示例中，我们使用了 MVC 架构，并将视图（View）与控制器（Controller）分离，从而使得 `View` 类像 Model\
  \ 一样是可以复用的。图 12.24 显示了 `RGBColorMixer`（Model）、`BorderLayoutView`（View）和 `RGBColorMixerController`（Controller）的\
  \ UML 图。\n\n![img](img/01649.jpeg)\n\n**图 12.24：此应用程序类的 UML 图**\n\n我们首先编写 Model，即\
  \ `RGBColorMixer` 类（示例 12.20），该类封装了通过根据给定增量每次改变一个颜色分量来根据 RGB 系统制作颜色的逻辑。该类是一个独立类，可以在另一个应用程序中复用。实例变量\
  \ `color`（第 15 行）是一个 `Color` 类型，存储了我们正在制作的颜色。实例变量 `delta`（第 14 行）是一个 `int`，存储了 `color`\
  \ 的某个颜色分量每次可以增加或减少的数量；`delta` 可以是正的也可以是负。颜色分量的值在 0 到 255 之间，因此我们只允许 `delta` 的值在\
  \ −255 到 255 之间（第 22 行）。如果 `delta` 为正数，起始颜色为黑色（`0, 0, 0`）；如果 `delta` 为负数，起始颜色为白色（`255,\
  \ 255, 255`）（第 26–29 行）。\n\n`invertDelta` 方法（第 40–46 行）将 `delta` 的值改变为其相反数。这将非常有用，例如，当\
  \ `delta` 为正且任何颜色分量达到最大值 255，或者当 `delta` 为负且任何颜色分量达到最小值 0 时。\n\n`addToRed` 方法（第\
  \ 48–60 行）将 `delta` 加到 `color` 的红色分量上，保持该值在 0 到 255 之间。`addToGreen` 和 `addToBlue`\
  \ 方法类似，分别更新 `color` 的绿色和蓝色分量。这些方法调用 `Color` 类的 `getRed()`、`getGreen()` 和 `getBlue()`\
  \ 访问方法来获取每个颜色分量的当前 `int` 值。\n\n`getMethodLabel` 方法（第 90–108 行）返回一个 `String`，可以作为图形界面中方法\
  \ `invertDelta`、`addToRed`、`addToGreen` 和 `addToBlue` 的标签。尽管我们知道此应用程序将使用 `BorderLayout`，但我们设计\
  \ `RGBColorMixer` 使得它可以与其他视图和布局一起复用。因此，我们没有使用 `BorderLayout` 字符串常量 `NORTH`、`WEST`\
  \ 和 `EAST` 作为传递给此方法的参数。相反，我们提供了静态常量（第 9–12 行）来表示 `delta` 的可能变化（`POSITION_CHANGE`）、此颜色的红色分量（`POSITION_RED`）、此颜色的绿色分量（`POSITION_GREEN`）以及此颜色的蓝色分量（`POSITION_BLUE`）。调用\
  \ `getMethodLabel` 方法时可以使用这些常量。`getTitle` 方法（第 110–116 行）返回一个 `String`，可以用作此 Model\
  \ 的应用程序标题。`toString()` 方法（第 118–128 行）返回 `color` 的字符串表示。\n\n![img](img/01650.jpeg)\n\
