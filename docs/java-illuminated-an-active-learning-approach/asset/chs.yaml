  \ 程序的输出**\n\n## 8.10 本节总结\n\n![img](img/00009.jpeg) 数组是相同数据类型变量的序列。该数据类型可以是任何 Java\
  \ 原始数据类型，如 `int`、`float`、`double`、`byte`、`boolean` 或 `char`，也可以是一个类。\n\n![img](img/00009.jpeg)\
  \ 数组中的每个元素通过数组名和索引访问，索引指向元素在数组中的位置。\n\n![img](img/00009.jpeg) 数组是以对象形式实现的。创建数组包括声明数组的对象引用和实例化数组。数组的大小在实例化时给出。\n\
  \n![img](img/00009.jpeg) 在原始类型数组中，每个元素包含该类型的值。在对象数组中，每个元素都是一个对象引用。\n\n![img](img/00009.jpeg)\
  \ 当实例化数组时，元素会根据数据类型自动被赋上初始值。数值类型被设置为 0；`boolean` 类型被设置为 `false`；`char` 类型被设置为 Unicode\
  \ 空字符字符；对象引用被设置为 `null`。\n\n![img](img/00009.jpeg) 实例化对象引用数组涉及两个步骤：实例化数组和实例化对象。\n\
  \n![img](img/00009.jpeg) 数组可以在声明时通过在花括号内的一个用逗号分隔的列表中分配初始值来实例化。初始化列表中的值数量决定了数组中元素的数量。\n\
  \n![img](img/00009.jpeg) 数组元素通过数组名和索引进行访问。第一个元素的索引为 0，最后一个元素的索引为数组大小减 1。\n\n![img](img/00009.jpeg)\
  \ 数组有一个整数实例变量 `length`，它存储了数组中的元素数量。\n\n![img](img/00009.jpeg) 尝试使用小于 0 或大于 `arrayName.length\
  \ - 1` 的索引访问数组元素将在运行时产生 `ArrayIndexOutOfBoundsException`。\n\n![img](img/00009.jpeg)\
  \ 数组不支持聚合数组操作（如打印和复制数组）。通过 `for` 循环，你可以逐个处理每个数组元素。\n\n![img](img/00009.jpeg) 要更改数组的大小，必须创建一个新数组并从旧数组复制元素。\n\
  \n![img](img/00009.jpeg) 数组可以在声明时通过在花括号内的一个用逗号分隔的列表中分配初始值来实例化。\n\n## 8.11 练习、问题和项目\n\
