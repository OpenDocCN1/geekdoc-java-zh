  \n第 1 维：州\n第 2 维：年\n第 3 维：周\n第 4 维：星期\n\n以下代码序列说明了如何声明、实例化和访问此类四维数组的元素：\n\n![img](img/01196.jpeg)\n\
  \n为了处理四维数组的元素，我们使用四重 *for* 循环。该四重 *for* 循环模式与二维和三维数组的模式相似。对于名为 *arrayName* 的四维数组，它如下：\n\
  \n![img](img/01197.jpeg)\n\n![img](img/01198.jpeg)\n\n## 9.7 *ArrayList* 类\n\n正如我们所见，一维和多维数组在很多情况下非常有用。然而，它们也有其局限性。\n\
  \n假设你正在为一个大型网站设计搜索引擎，例如一个在线书店。用户将在文本框中输入一个单词，你的代码将访问数据库，检索所有标题包含该单词的书，并将它们返回给用户。\n\
  \n我们可以将书籍信息存储在书籍数组中。然而，一个问题是，我们不知道会有多少书。可能有 3 封、32 本、500 本或 5,000 本，甚至可能更多。在不知道书籍数量的情况下，我们不知道数组应该做得多大。最安全的办法是创建一个具有最大可能数量元素的数组，即我们预期的最大书籍数量。然而，如果我们实际拥有的书籍比预期的少，将会浪费空间。\n\
  \n如果我们最终拥有的书籍比预期的多，就需要增加数组的大小。因为数组的大小在实例化时是固定的，因此更改数组的大小是一个麻烦的过程。我们必须实例化新数组，并将原始数组的元素复制到新数组中。\n\
  \n`java.util` 包中的 `ArrayList` 类解决了这些问题。`ArrayList` 对象根据需要自动扩展其容量。`ArrayList` 类使用了**泛型**（generics）。泛型是**参数化类型**，这意味着数据将在客户端类声明并实例化该类的对象时定义。泛型允许程序员设计并编写使用对象的类，而无需指定对象的类（或数据类型）。\n\
  \n因此，例如，我们可以有一个 `Book` 对象的 `ArrayList`、`Auto` 对象的 `ArrayList` 或 `String` 对象的 `ArrayList`。指定的类型必须是一个类，而不是基本类型。如果我们想在\
  \ `ArrayList` 中存储基本数据类型，我们需要使用包装类之一，如 `Integer`、`Double` 或 `Character`。\n\n`ArrayList`\
  \ 类以及更通地说，使用泛型的类可以用于许多目的。这是面向对象编程的另一个方面。\n\n### 9.7.1 声明和实例化 *ArrayList* 对象\n\n\
  由于 `ArrayList` 类位于 `java.util` 包，需要提供以下语句：\n\n```java\nimport java.util.ArrayList;\n\
  ```\n\n以下是声明 `ArrayList` 的语法：\n\n```java\nArrayList<ClassName> arrayName;\n```\n\
  \n以下使用默认构造函数实例化 `ArrayList` 的语法：\n\n```java\narrayName = new ArrayList<ClassName>();\n\
  ```\n\n这些语句将实例化之前的 `ArrayList`：\n\n```java\nArrayList<String> names = new ArrayList<>();\n\
  ArrayList<Auto> cars = new ArrayList<>();\n```\n\n如果你尝试使用基本类型而不是类类型实例化 `ArrayList`\
  \ 对象，例如：\n\n```java\nArrayList<int> list = new ArrayList<int>();\n```\n\n你将得到此编译错误：\n\
  \n```\nerror: type cannot be used by parameter\n```\n\n在 *ArrayList* 中，容量（capacity）和大小（size）是有区别的。*ArrayList*\
  \ 的**容量**是分配给列表元素。**大小**是已填充元素的数量。因此，当你使用默认构造函数实例化 `ArrayList` 时，其容量为 10，但大小为 0。也就是说，`ArrayList`\
  \ 有容纳 10 个对象的空间，但目前列表中没有存储对象。\n\n如果你知道要在 `ArrayList` 对象中存储多少元素，可以使用重载构造函数来指定初始容量：\n\
  \n```java\nArrayList<Astronaut> listOfAstronauts = new ArrayList<Astronaut>(5);\n\
  ```\n\n在这种情况下，`listOfAstronauts` 的容量为 5，大小为 0。\n\n我们也可以将 `ArrayList` 对象的声明和实例化合并为一个语句：\n\
  \n```java\nArrayList<Integer> numbers = new ArrayList<Integer>();\n```\n\n### 9.7.2\
  \ *ArrayList* 类的方法\n\n与数组一样，`ArrayList` 类使用索引来引用元素。除了其他，它还提供了提供功能的方法：\n\n- `add(E\
  \ element)`：在列表末尾添加项\n- `set(int index, E element)`：在给定索引处替换项\n\n\n\n![img](img/00009.jpeg)删除指定索引处的项\n\
  \n![img](img/00009.jpeg)移除列表中的所有项\n\n![img](img/00009.jpeg)在列表中查找特定项\n\n![img](img/00009.jpeg)获取指定索引处的项\n\
  \n![img](img/00009.jpeg)获取指定元素的索引\n\n![img](img/00009.jpeg)检查列表是否为空\n\n![img](img/00009.jpeg)返回列表中的项数，即列表的大小\n\
  \n![img](img/00009.jpeg)通过将容量设置为列表中的项数来优化列表的容量\n\n一些最实用的方法显示在表 9.5 中。请注意，某些方法头包含\
  \ `E` 作为其返回类型或参数数据类型（这与类名或简单的 `Object` 类不同）。`E` 代表 `ArrayList` 的数据类型。因此，对于一个包含 `Integer`\
  \ 对象的 `ArrayList`，`E` 是 `Integer`；例如，`get` 方法返回一个 `Integer` 对象。同样，对于一个包含 `Auto`\
  \ 对象的 `ArrayList`，`E` 是一个 `Auto` 对象。在这种情况下，`get` 方法返回一个 `Auto` 对象。\n\n**表 9.5 `ArrayList`\
  \ 方法**\n\n| **`ArrayList` 类的实用方法** |\n| **返回值** | **方法名和参数列表** |\n| :--- | :---\
  \ |\n| `boolean` | `add(E element)` 将指定的 `element` 追加到列表末尾 |\n| `E` | `remove(int\
  \ index)` 移除并返回列表中指定 `index` 位置的元素 |\n| `void` | `clear()` 移除此列表中的所有元素 |\n| `E`\
  \ | `get(int index)` 返回列表中指定 `index` 位置的元素；该元素不会从列表中移除 |\n| `E` | `set(int index,\
  \ E element)` 用指定的 `element` 替换此列表中指定 `index` 位置的元素 |\n| `int` | `size()` 返回此列表中的元素数量\
  \ |\n| `void` | `trimToSize()` 将容量设置为列表的当前大小 |\n\n### 9.7.3 使用增强型 `for` 循环遍历 `ArrayList`\n\
  \n使用 `for` 循环处理名为 `arrayListName` 的 `ClassName` 对象的 `ArrayList` 元素的通用模式是：\n\n![img](img/01211.jpeg)\n\
