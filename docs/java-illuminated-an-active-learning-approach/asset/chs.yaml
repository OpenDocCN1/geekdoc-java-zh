  \ `DoNotEnterClient2` 窗口\n\n## 7.13 枚举类型\n\n枚举类型的设计旨在提高程序的可读性。枚举类型 `enum` 是一种特殊的类声明。它允许我们定义一组命名的常量对象，这些对象在程序中可以代替数字。\n\
  \n`Enum` 类型用于管理每个成员都有名称的有序集合。例如星期的几天、一年的月份和扑牌。在程序中表示这些集合时，我们通常使用数字，例如用 1 到 7 表示星期几，或用\
  \ 1 到 12 表示月份。问题在于，为了输入或输出这些值，我们需要在内部数值表示法（例如 1–7）和用户识别的单词（星期日、星期一、星期二等）之间进行转换。`enum`\
  \ 类型允许我们为集合中的每个值实例化一个常量对象。该对象集合将进行排序，使得我们可以通过名称引用这些对象，而无需使用数字。\n\n`enum` 功能内置在 `java.lang`\
  \ 中，因此我们可以在不使用 `import` 语句的情况下定义 `enum` 类型。\n\n创建一组 `enum` 对象的语法如下：\n\n![img](img/00797.jpeg)\n\
  \n例如，以下语句定义了一个表示星期的 `enum` 类型：\n\n![img](img/00798.jpeg)\n\n当执行该语句时，会为列表中的每个名称实例化一个对象。因此，列表中的每个名称都是指向\
  \ `enum` 类型 `Days` 对象的引用。\n\n注意初始化列表中的值是对象引用（`Sun`），而不是 `String` 字面量（“`Sun”）。\n\n\
  每个对象都有一个持有数值的实例变量，该值由其在 `enum` 对象列表中的位置决定。默认情况下，第一个对象的值为 0，第二个对象的值为 1，依此类推。因为对象是一个有序集合，例如，对象\
  \ `Thur` 的值高于 `Wed`。然而，我们可以使用这些 `enum` 对象。\n\n### 表 7.6 `enum` 对象的常用方法\n\n| 返回类型\
  \ | 方法名 | 参数列表 |\n| :--- | :--- | :--- |\n| `int` | `compareTo(Enum eObj)` | 如果\
  \ *this* 对象小于参数，则返回一个负数；如果 *this* 对象大于参数，则返回一个正数；如果两个对象相同，则返回 0 |\n| `boolean` |\
  \ `equals(Object eObj)` | 如果此对象等于参数，则返回 *true*；否则返回 *false* |\n| `int` | `ordinal()`\
  \ | 返回 *enum* 对象的数值。默认情况下，列表中的第一个对象是 0，第二个对象是 1，依此类推 |\n| `String` | `toString()`\
  \ | 返回 *enum* 对象的名称 |\n| `String` | `enum` | `valueOf(String enumName)` | *static*\
  \ 方法，返回与指定的 *String* 参数相同的 *enum* 对象 |\n\n\n\n\n示例 7.17 的输出如 图 7.11 所示。\n\n我们可以在\
