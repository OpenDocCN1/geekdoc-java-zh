  \ `G` 小于小写的 `g`。\n\n## 5.10 条件运算符 (?:)\n\n条件运算符 `(?: )` 本身不是一个语句，但可以在表达式中使用。它评估一个条件，并根据条件的值为表达式贡献两个值之一。条件运算符在处理无效输入和输出相似消息时特别有用。条件运算符的语法在此所示：\n\
