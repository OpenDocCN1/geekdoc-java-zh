  \ 练习、问题和项目\n    - 5.14.1 多项选择\n    - 5.14.2 阅读与理解\n    - 5.14.3 填空代码\n    - 5.14.4\
  \ 识别错误\n    - 5.14.5 调试\n    - 5.14.6 编写短代码\n    - 5.14.7 编程区域\n    - 5.14.8 技术写作\n\
  \    - 5.14.9 技术写作\n    - 5.14.10 项目\n\n### 介绍\n控制流是程序执行语句的顺序。在大多数程序中，语句从上到下顺序执行。然而，许多程序需要根据特定条件跳过某些语句或重复执行。控制流有三种类型：选择、迭代和分支。选择允许程序根据条件选择执行路径。在本章中，我们将关注选择通过\
  \ `if`、`if-else`、`if-else if` 和 `switch` 语句来实现。\n\n### 5.1 形成条件\n要使用选择，必须形成条件。条件是一个布尔表达式，其结果为\
  \ `true` 或 `false`。关系运算符用于比较两个值。关系运算符有：\n- `==`（等于）\n- `!=`（不等于）\n- `>`（大于）\n- `<`（小于）\n\
  - `>=`（大于等于）\n- `<=`（小于等于）\n\n逻辑运算符用于组合条件。逻辑运算符有：\n- `&&`（与）：当两个操作数均为 `true` 时返回\
  \ `true`。\n- `||`（或）：当至少一个操作数为 `true` 时返回 `true`。\n- `!`（非）：当操作数为 `false` 时返回 `true`。\n\
  \n#### 5.1.1 等于运算符\n`==` 运算符检查两个操作是否相等。对于基本类型，它检查值是否相等；对于对象，它检查它们是否指向内存中的同一个对象。`!=`\
  \ 运算符检查两个操作是否相等。\n\n示例：\n```java\nint x = 5;\nint y = 5;\nboolean result1 = (x ==\
  \ y); // true\nboolean result2 = (x != y); // false\n```\n\n#### 5.1.2 关系运算符\n关系运算符用于比较两个数值。\n\
  \n示例：\n```java\nint a = 10;\nint b = 20;\nboolean result1 = a < b; // true\nboolean\
  \ result2 = a > b; // false\nboolean result3 = a >= b; // false\nboolean result4\
  \ = a <= b; // true\n```\n\n#### 5.1.3 逻辑运算符\n逻辑运算符允许你组合多个条件。\n\n示例：\n```java\n\
  boolean a = true;\nboolean b = false;\nboolean result1 = a && b; // false\nboolean\
  \ result2 = a || b; // true\nboolean result3 = !a;     // false\n```\n\n### 5.2\
  \ 使用 if 的简单选择\n`if` 语句允许在条件为 `true` 时执行代码块。如果条件为 `false`，则跳过该块。\n\n示例：\n```java\n\
  int age = 20;\nif (age >= 18) {\n    System.out.println(\"You can vote.\");\n}\n\
  ```\n\n### 5.3 使用 if/else 进行选择\n`if-else` 语句允许在条件为 `true` 时执行一个代码块，在为 `false` 时执行另一个代码块。\n\
  \n示例：\n```java\nint age = 16;\nif (age >= 18) {\n    System.out.println(\"You can\
  \ vote.\");\n} else {\n    System.out.println(\"You cannot vote.\");\n}\n```\n\n\
  ### 5.4 使用 if/else if 进行选择\n`if-else if` 语句允许按顺序测试多个条件。\n\n示例：\n```java\nint score\
  \ = 85;\nif (score >= 90) {\n    System.out.println(\"Grade: A\");\n} else if (score\
  \ >= 80) {\n    System.out.println(\"Grade: B\");\n} else {\n    System.out.println(\"\
  Grade: C\");\n}\n```\n\n## 5.5 顺序和嵌套 if/else 语句\n顺序 `if-else` 语句一个接一个执行。嵌套 `if-else`\
  \ 语句是在另一个 `if-else` 块内部的一个块。\n\n#### 5.5.1 顺序 if/else 语句\n```java\nint x = 10;\n\
  if (x > 0) { System.out.println(\"Positive\"); }\nif (x > 5) { System.out.println(\"\
  Greater than 5\"); }\n```\n\n#### 5.5.2 嵌套 if/else 语句\n当第二个条件取决于第一个条件的结果时，使用嵌套语句。\n\
  \n```java\nint x = 10;\nif (x > 0) {\n    if (x > 5) {\n        System.out.println(\"\
  Positive and greater than 5\");\n    }\n}\n```\n\n\n\n\n\n![img](img/00005.jpeg)\
  \ **常见错误陷**\n\n不要将等等运算符 `==`（双等号）与赋值运算符 `=`（单等号）混淆。\n\n**表 5.1 等等运算符**\n\n| **等等运算符**\
  \ | **类型** | **含义** |\n| :--- | :--- | :--- |\n| `==` | 二元 | 等于 |\n| `!=` | 二元 |\
  \ 不等于 |\n\n### 5.1.2 关系运算符\n\n为了比较基本数值类型变量的值，Java 提供了表 5.2` 的求值结果为 `false`，\n\n\
  表达式 `(age <= 32)` 的求值结果为 `true`，\n\n表达式 `(age > 32)` 的求值结果为 `false`，以及\n\n表达式 `(age\
  \ >= 32)` 的求值结果为 `true`。\n\n此表达式测试了 `int` 变量 `testScore` 是否至少为 90：\n\n![img](img/00409.jpeg)\n\
  \n这段代码测试了该测试分数是否小于 60：\n\n![img](img/00410.jpeg)\n\n### 5.1.3 逻辑运算符\n\n程序中的常见操作是测试一组条件的组合为真为假。对于这些操作，Java\
  \ 提供了**逻辑运算符** `!`、`&&` 和 `||`，它们分别对应布尔逻辑运算符 NOT（非）、AND（与）和 OR（或）。这些运算符如表 5.3 |\n\
  | `&&` | 二元 | 与 (AND) |\n| `||` | 二元 | 或 (OR) |\n\n**表 5.4 逻辑运算符真值表**\n\n![img](img/00411.jpeg)\n\
  \n非运算符 (`!`) 接受一个 `boolean` 表达式作为操作数并反转该操作数的值。如果操作数为 `true`，结果将为 `false`；如果操作数为\
  \ `false`，结果将为 `true`。\n\n与运算符 (`&&`) 接受两个 `boolean` 表达式作为操作数；如果两个操作数均为 `true`，则结果将为\
  \ `true`；否则，结果为 `false`。\n\n或运算符 (`||`) 也接受两个 `boolean` 表达式作为操作数。如果两个操作数均为 `false`，则结果将为\
  \ `false`；否则，结果为 `true`。或运算符由两个垂直线组成，中间没有空格。在 PC 键盘上，垂直线是 `Enter` 键上方 Shift 的字符。\n\
  \n这些逻辑运算符的真值表见表 5.4。\n\n关系运算符和逻辑运算符的优先级见表 5.5，该表还包含了算术运算符。注意，一元非运算符 (`!`) 在关系和逻辑运算符中优先级最高，其次是关系运算符，然后相等运算符，接着是与\
  \ (`&&`)，最后是或 (`||`)。\n\n![img](img/00058.jpeg) **参考点**\n\n完整的运算符优先级表见附录 B。\n\n\
  **表 5.5 运算符优先级**\n\n| **运算符层级** | **同一语句中的计算顺序** | **操作** |\n| :--- | :--- | :---\
  \ |\n| `()` | 从左到右 | 用于显式分组的括号 |\n| `++, --` | 从右到左 | 快捷后增/减 |\n| `++, --, !` |\
  \ **从右到左** | 快捷前增/减，**逻辑一元非** |\n| `*, /, %` | 从左到右 | 乘、除、取模 |\n| `+, -` | 从左到右\
  \ | 加法或 `String` 拼接、减法 |\n| `<`, <=, >, >=` | **从左到右** | **关系运算符：小于、小于等于、大于、大于等于**\
  \ |\n| `==, !=` | **从左到右** | **相等运算符：等于** |\n| `&&` | 从左到右 | 与 |\n| `||` | 从左到右\
  \ | 或 |\n| `=` | 从右到左 | 赋值 |\n| `+=, -=, *=, /=, %==` | 从右到左 | 复合赋值运算符 |\n| `&&=,\
  \ \\|=` | 从右到左 | 复合逻辑赋值运算符 |\n\n\n\n\n确保逻辑与运算符和逻辑或运算符的两个操作数都是`boolean`表达式。诸如 `x\
  \ < y && z` 这样的表达式（其中 `x`、`y` 和 `z` 为数值类型）是非法的。相反，请使用表达式 `x < y && x < z`。\n\n###\
  \ 表 5.6 等价表达式示例\n\n| 等价表达式 | 含义 |\n| :--- | :--- |\n| `( flag1 == false ) || ( flag2\
  \ == false )` | `flag1` 为假或 `flag2` 为假 |\n| `!flag1 || !flag2` | `!flag1` 为真或 `!flag2`\
  \ 为真 |\n| `! ( flag1 && flag2 )` | `flag1` 和 `flag2` 不同全为真 |\n\n### 德摩根定律\n\n得益于英国数学家奥古斯塔·德摩根（Augustus\
  \ DeMorgan）的工作，我们有一组规则可以帮助开发等价表达式。德摩根以其在布尔代数和集合论方面的工作闻名，他提出了著名的德摩根定律。它们如下：\n\n1.\
  \ `NOT( A AND B ) = ( NOT A ) OR ( NOT B )`\n2. `NOT( A OR B ) = ( NOT A ) AND (\
  \ NOT B )`\n\n因此，在 Java 中，使用第一律我们可以看到：\n\n`! ( a && b )` 等价于 `!a || !b`\n\n使用第二律，我们可以看到：\n\
  \n`! ( a || b )` 等价于 `!a && !b`\n\n这些定律在表 5.7 所示的扩展真表中表中。\n\n因此，要使用德摩根定律，你需要将与运算符改为或运算符，将或运算符改为与运算符，并对逻辑运算符的每个操作数应用非运算符（`!`）。当操作数是使用关系或相等运算符的表达式时，取反后的表达式如表\
  \ 5.8 所示。\n\n**表 5.7 德摩根定律的真值表**\n\n![img](img/00418.jpeg)\n\n**表 5.8 应用于关系和相等运算符的逻辑非运算符**\n\
  \n| 表达式 | `! ( Expression )` |\n| :--- | :--- |\n| a == b | a != b |\n| a != b |\
  \ a == b |\n| a < b | a >= b |\n| a >= b | a < b |\n| a > b | a <= b |\n| a <= b\
  \ | a > b |\n\n**表 5.9 等价表达式的更多示例**\n\n| 等价表达式 | 含义 |\n| :--- | :--- |\n| `( age\
  \ <= 18 || age >= 65 )` | `age` 小于等于 18 或 `age` 大于等于 65 |\n| `! ( age > 18 && age\
  \ < 65 )` | `age` 不在 18 到 65 之间 |\n| `! ( age > 18 ) || ! ( age < 65 )` | `age`\
  \ 不大于 18 或 `age` 不小于 65 |\n\n例如，假设我们有一个名为 `age` 的 `int` 变量，代表人的年龄，我们想要评估 `age` 是否小于或等于\
  \ 18 或大于或等于 65。\n\n表 5.9 为上述测试提供了几个等价表达式。\n\n同样，尽管表 5.9 中的所有表达式都是等价的，但第一个表达式（对测试条件的最直接翻译）最容易阅读。\n\
  \n![img](img/00004.jpeg) **软件工程提示**\n\n编写布尔表达式时，要确保它们易于阅读和理解。\n\n![img](img/00013.jpeg)\
