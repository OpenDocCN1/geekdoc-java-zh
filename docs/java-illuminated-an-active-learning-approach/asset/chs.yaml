  \ += 2`）将 `i` 增 2 以跳过奇数。注意，我们在循环内部使用了循环控制变量 `i` 的值。循环控制变量可以执行像这样的双重任务，因为循环控制变量在循环体中对我们的代码是可用的。\n\
