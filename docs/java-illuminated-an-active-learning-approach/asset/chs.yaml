  \n## 示例 3.20 将输入字符串转换为数字\n\n第 11 行和 12 行弹出一个输入对话框，并将用户输入的字符赋值给 `String input`。第\
  \ 13 行使用 `Integer` 类的 `parseInt` 方法将 `input` 转换为整数，并赋值给 `int` 变量 `age`。第 14 行随后将\
  \ `age` 加 1，并在输出对话框中显示该人员明年的年龄。\n\nJava 程序员经常将多个相关操作合并成一条语句，以减少代码输入量并避免声明额外的变量。第\
  \ 17–19 行阐明了这一概念。起初看起来可能很困惑，但如果你逐句分析该语句，就能清楚正在发生什么。调用了 `showInputDialog` 方法，返回一个表示用户在对话框中输入的任何内容的\
  \ `String`。随后，该 `String` 成为传递给 `parseDouble` 的参数，该方法将 `String` 转换为 `double`。第 20–21\
  \ 行计算了 4.0 与输入的平均学分之间的差值，并在另一个对话框中显示该差值。\n\n在输入提示中，我们包含了一系列有效值以帮助用户输入有效内容。然而，在提示中包含范围并不能阻止用户输入其他值。`parseDouble`\
  \ 方法会接受任何可以转换为数值的 `String`。在程序接收到输入后，你将需要验证输入的数字是否确实在请求的数值范围内。我们将在讨论循环时，向你展示验证用户是否输入了有效值的技巧。\n\
  \n无论是使用 `Double.parseDouble` 还是 `Integer.parseInt`，用户输入的值都必须能够转换为相应的数据类型。否则，则会产生异常。例如，如果用户为平均学分输入\
  \ `A`，该方法将生成 `NumberFormatException`。\n\n示例 3.20 样例运行中的各种输入和输出对话框所示图 3.28。\n\n![img](img/00058.jpeg)\
