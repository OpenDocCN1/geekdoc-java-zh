  \ 语句中省略 `break` 语句时会发生什么。\n\n## 5.13 本节总结\n\n![img](img/00009.jpeg)Java 提供了等价、关系和逻辑运算符来评估条件，并提供了选择语句根据条件求值结果为\
  \ `true` 还是 `false` 来选择执行哪些指令。\n\n![img](img/00009.jpeg)等价运算符 `==`、`!=` 用于测试两个操作数是否相等。操作数是表达式，求值结果为原始数值类型或`boolean`\
  \ 类型或对象引用。\n\n![img](img/00009.jpeg)关系运算符 `<`, `<=`, `>`, `>=` 比较两个操作数的值，操作数是求值结果为原始数值类型型的表达式。\n\
  \n![img](img/00009.jpeg)逻辑运算符 `!`、`&&` 和 `||` 以 `boolean` 表达式作为操作数。逻辑非 `!` 接受一个操作数并反转其值，将\
  \ `true` 变为 `false`，将 `false` 变为 `true`。逻辑与运算符 `&&` 接受两个 `boolean` 表达式作为操作数；如果两个操作数均为\
  \ `true`，则结果为 `true`；否则结果为 `false`。逻辑或运算符 `||` 同样接受两个 `boolean` 表达式作为操作数。如果两个操作数均为\
  \ `false`，则结果为 `false`；否则结果为 `true`。\n\n![img](img/00009.jpeg)逻辑非运算符 `!` 在这些运算符中优先级最高，其次是关系运算符，然后是等价运算符，接着是逻辑与\
  \ `&&`，最后是逻辑或 `||`。\n\n![img](img/00009.jpeg)可以使用德·根定律形成等价的逻辑表达式，以提高代码的可读性。\n\n\
  ![img](img/00009.jpeg)`if` 语句用于对一组数据执行某些操作，而对所有其他数据什么都不做。\n\n![img](img/00009.jpeg)当\
  \ `if` 语句的真或假代码块包含多条语句时，需要使用大括号。\n\n![img](img/00009.jpeg)`if/else` 语句用于对一组数据执行某些操作，并对所有其他数据执行其他操作。\n\
  \n![img](img/00009.jpeg)当数据落入两个以上互斥的类别，且每个类别需要执行的指令不同时，`if/else if` 语句是合适的。\n\n\
  ![img](img/00009.jpeg)*`if/else` 语句可以按顺序编写，并可以嵌套在其他的 `if/else` 语句内部。\n\n![img](img/00009.jpeg)当\
  \ `if` 语句嵌套时，编译器会将任何 `else` 子句与之前最近且还没有 `else` 子句的 `if` 条件匹配。\n\n![img](img/00009.jpeg)由于浮点数计算可能会引入舍入误差，不要使用等价运算符比较两个浮点数。相反，应该比较两个数字差的绝对值是否小于某个阈值。\n\
