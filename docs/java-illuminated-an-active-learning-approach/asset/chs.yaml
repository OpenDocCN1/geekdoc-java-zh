  \n## 引言\n随着程序的执行，我们经常需要一种方式来组织数据。数组和 `ArrayList` 是存储相同类型数据的方便方法。事实上，`ArrayList`\
  \ 会根据需要动态扩展。然而，在其他情况下，数据项的数量可能会增加或减少。对于这些情况，我们需要一种可以高效增长和收缩的数据结构。\n\n我们在本章将介绍的一种新数据结构是链表，它可以一次一个对象地扩展（或收缩），使列表的大小保持最小。那么，链表的一个优点是它们不会消耗不必要的内存。\n\
  \n## 14.1 链表\n### 14.1.1 链表的概念与结构\n链表可以被认为一组链节点。节点是一个具有两个属性的对象：\n\n![img](img/00009.jpeg)数据——数据可以是基本数据类型（例如，`int`），也可以是特定类对象的引用。\n\
  \n![img](img/00009.jpeg)链中下一个节点的位置——我们说一个节点“指向”或“引用”下一个节点。\n\n![img](img/01845.jpeg)\n\
  \n**图 14.1 节点**\n\n`图 14.1` 显示了我们如何可视化一个包含整数 5 的节点。箭头指向列表中的下一个节点。\n\n在列表最后一个节点中，下一个节点的位置包含值\
  \ `null`，以指示列表中没有更多节点。\n\n`图 14.2` 阐了一个包含四个视频游戏玩家的链表。存储在每个节点的对象数据具有以下属性：玩家的 ID、玩家姓名以及玩家喜爱的游戏名称。\n\
  \n从程序设计的角度来看，这个链表可以使用三个类来实现：\n\n![img](img/00009.jpeg)`Player` 类，封装一个玩家\n\n![img](img/00009.jpeg)`PlayerNode`\
  \ 类，封装一个节点\n\n![img](img/00009.jpeg)`PlayerLinkedList` 类，封装链表\n\n在 `Player` 类中，我们将拥有三个成员变量：\n\
  \n![img](img/00009.jpeg)存储玩家用户 ID 的 `int`\n\n\n\n\n\n![img](img/00009.jpeg)一个存储玩家名称的\
  \ `String`\n\n![img](img/00009.jpeg)一个存储玩家喜欢的游戏名称的 `String`\n\n通常，节点类被设计为通用的方式，以存储一个泛型\
  \ `Object`。实现一个泛型 `Object` 列表具有重用性的优势；事实上，我们可以用任何需要的 `Object` 类型来实例化列表。在本章中，我们将首先实现一个基本类型\
  \ `int` 的链表，然后是一个包含 `Player` 对象的链表，最后是一个包含泛型 `Object` 的链表。\n\n在 `IntegerNode` 类中，我们有两个实例变量：\n\
  \n![img](img/00009.jpeg)一个 `int`\n\n![img](img/00009.jpeg)一个 `IntegerNode` 对象引用，表示下一个节点\n\
  \n![img](img/01846.jpeg)\n\n**图 14.2\n**链表**\n\n因此，`IntegerNode` 类是使用其自身类型的对象引用定义的。事实上，它的实例变量之一就是一个\
  \ `IntegerNode` 对象引用。\n\n我们使用以下语句定义了两个实例变量：\n\n![img](img/01847.jpeg)\n\n基于对 `IntegerNode`\
  \ 类的定义，我们在链表类中只需要一个实例变量，即指向第一个节点的引用，我们将其称为链表的 `head`。事实上，第一个节点将允许我们访问第二个节点，而第二个节点反过来让我们访问第三个节点，依此类推，直到我们到达最后一个节点。我们将知道何时到达了链表的末尾，因为指向下一个\
  \ `IntegerNode` 的引用将值为 `null`。\n\n通常，链表类还有另一个实例变量，用于存储链表中的项目数量。虽然可以通过遍历并计数链表中的所有节点来计算项目数量，但将数量存储为实例变量会更方便。因此，我们封装链表的\
  \ `IntegerLinkedList` 类将有两个实例变量：\n\n![img](img/00009.jpeg)一个名为 `head` 的 `IntegerNode`\
  \ 对象引用，表示链表的第一个节点\n\n![img](img/00009.jpeg)一个名为 `numberOfItems` 的 `int`，表示链表中的项目数量\n\
  \n![img](img/00004.jpeg) **软件工程技巧**\n\n在链表类中包含一个实例变量来存储列表的项目数量，以便在需要时快速直接地访问该信息。\n\
  \n### 14.1.2 链表基础\n\n示例 14.1 显示了我们的 `IntegerNode` 类：\n\n![img](img/01848.jpeg)\n\
  \n![img](img/01849.jpeg)\n\n![img](img/01850.jpeg)\n\n**示例 14.1 IntegerNode 类**\n\
  \n该类的代码非常直观。我们在第 10 行到 26 行编写了两个构造函数。这两个构造函数都将 `next` 的值设置为 `null`。这将在节点创建时执行预期的操作。然而，为了允许客户端（即链表类）在列表扩展和收缩时重置\
  \ `next` 的值，我们提供了一个 `setNext` 方法。\n\n### 14.1.3 链表的方法\n\n对于我们封装链表的类，我们需要考虑以下问题：\n\
  \n![img](img/00009.jpeg)我们不希望客户端程序更改我们列表的头节点（head node）。因此，我们不会为头节点提供访问器（accessor）或修改器（mutator）。\n\
  \n![img](img/00009.jpeg)客户端程序不应该能够更改列表的项目数量。只有类的方法应该在我们在列表中插入或删除项目时更新项目数量。因此，我们将为列表的项目数量提供一个访问器，以便客户端可以查看项目数量，但不提供修改器。\n\
  \n对于链表，我们需要提供一些基本功能，例如：\n\n![img](img/00009.jpeg)插入一个项目，\n\n![img](img/00009.jpeg)删除一个项目，以及\n\
  \n![img](img/00009.jpeg)按顺序列出列表中的所有项目，并将该列表作为 `String` 返回。\n\n表 14.1 显示了 `insert`、`delete`\
  \ 和 `toString` 方法的 API。\n\n**表 14.1 IntegerLinkedList 方法**\n\n| **IntegerLinkedList\
  \ 类的方法** | **返回值** | **方法名和参数列表** |\n| :--- | :--- | :--- |\n| **void** | `insert(int\
  \ value)` | 在列表头部插入 `value`。 |\n| **boolean** | `delete(int value)` | 移除列表中第一个等于\
  \ `value` 的项目并返回 `true`。如果列表中没有此类项目，则方法返回 `false`。 |\n| **String** | `toString()`\
  \ | 返回列表的 `String` 表示形式。 |\n\n在我们的 `int` 链表中，我们不以任何预定的顺序存储 `int`。因此，插入节点只有两个逻辑位置：列表的开头和末尾。在末尾插入将消耗\
  \ CPU 时间，因为我们必须遍历整个列表找到末尾。因此，在头部插入会更快。我们的 `insert` 方法返回 `void` 类型。\n\n实现链表的其他选项包括在列表末尾插入、在指定位置插入或在指定节点之后插入。当插入\
  \ `int` 时，我们的 `insert` 方法执行以下步骤：\n\n1. 实例化包含要插入 `int` 的新节点。\n2. 将节点连接到头部；如果列表原本为空（即\
  \ `head` 值为 `null`），则新节点的 `next` 字段为 `null`。\n3. 让 `head` 指向新节点。\n4. 将项目数量加 1。\n\
  \n图 14.3a 到 14.3d 说明了步骤。\n\n删除链表项目的方法有很多。我们可以删除第一个元素、最后一个元素，或者根据标准删除项目。这种标准可以是项目的值，也可以是项目的位置。我们将只实现一个\
  \ `delete` 方法：根据值删除的方法。\n\n![img](img/01851.jpeg)\n**图 14.3a 插入：我们的链表**\n\n![img](img/01852.jpeg)\n\
  **图 14.3b 步骤 1：实例化新节点**\n\n![img](img/01853.jpeg)\n**图 14.3c 步骤 2：新节点已连接到头部**\n\n\
  ![img](img/01854.jpeg)\n**图 14.3d 步骤 3：head 现在指向新节点**\n\n为了删除项目，我们将遍历链表，寻找与 `delete`\
  \ 方法参数匹配的项目。遍历列表意味着从第一个节点开始循环遍历节点。如果我们找到了这样的项目，我们将将其从列表中移除并返回 `true`。如果没有找到该项目，我们将返回\
  \ `false`。\n\n搜索此类项目有三种可能的结果：\n\n1. 找到了项目且其位于头节点之后。\n2. 找到了项目且其位于头节点。这里需要特别注意。头节点将发生变化，我们的代码需要处理这种情况。\n\
  3. 未找到项目。在这种情况下，不发生删除，我们将返回 `false`。\n\n\n\n\n\n当我们找到要删除的节点且该节点不是列表的第一个节点时，执行以下步骤：\n\
  \n1. 将前一个节点（`previous`）的 `next` 字段设置为要删除节点（`current`）的 `next` 字段。\n2. 将列表中的项目数量减\
  \ 1。\n\n`current` 节点将变得不可访问，因此成为垃圾回收的候选。\n\n图 14.4a 和 14.4b 展示了删除值为 8 的节点，该节点位于列表中间的某个位置。\n\
  \n![img](img/01855.jpeg)\n\n**图 14.4a**\n**删除值为 8 的项之前的列表**\n\n![img](img/01856.jpeg)\n\
  \n**图 14.4b**\n**`previous` 节点连接到 current 之后的节点，删除值为 8 的项**\n\n当要删除的节点是头节点时，我们需要将被删除节点所指向节点设置为列表的新\
  \ `head`。因此，执行以下步骤：\n\n1. 将 `current` 节点的 `next` 字段赋值给 `head`。\n2. 将列表中的项目数量减 1。\n\
  \n图 14.5a 和 14.5b 展示了删除列表中的第一个节点。\n\n![img](img/01857.jpeg)\n\n**图 14.5a**\n**删除值为\
  \ 7 的项之前**\n\n![img](img/01858.jpeg)\n\n**图 14.5b**\n**更新 `head` 之后，列表中的第一个节点被删除**\n\
  \n示例 14.2 显示了我们的 `IntegerLinkedList` 类。\n\n![img](img/01859.jpeg)\n\n![img](img/01860.jpeg)\n\
  \n**示例 14.2 `IntegerLinkedList` 类**\n\n默认构造函数（第 10–17 行）将实例变量 `head` 和 `numberOfItems`\
  \ 分别初始化为 `null` 和 0。`insert` 方法编写于第 27 行到 37 行，在列表开头插入一个包含其参数 `value` 的节点。在第 33\
  \ 行，我们创建一个数据为 `value` 的新节点 `nd`。在第 34 行，通过将其 `next` 字段设置为列表的当前头（`head`），将 `nd` 连接到列表的第一个节点。在第\
  \ 35 行，我们将新节点 `nd` 赋值给 `head`，使其成为链表中的第一个节点。图 14.3a 到 14.3d 展示了第 33–35 行对列表的影响。在第\
  \ 36 行，我们增加 `numberOfItems` 以反映向列表中添加了节点。\n\n`delete` 方法编写于第 39 行到 66 行，如果删除成功则返回\
  \ `true`，如果删除失败则返回 `false`。\n\n在第 47–52 行使用 `while` 循环，我们遍历列表以寻找包含 `value` 的节点，`value`\
  \ 是我们 `delete` 方法的参数。在第 45 行和 46 行，我们声明并初始化了两个 `IntegerNode` 引用，我们在遍历列表时用它们跟踪当前节点和上一个节点。由于每个节点只指向列表中的下一个节点，因此我们只能正向遍历列表。一旦到达某个节点，我们就没有方法回到上一个节点。因此，当我们遍历列表时，必须记住上一个节点，因为我们需要更改其下一个节点的值。我们在第\
  \ 50–51 行中通过将 `current` 赋值给 `previous`，然后通过 `getNext` 方法将 `current` 移动到列表中的下一个节点，从而更新\
  \ `previous` 和 `current`。\n\n一旦找到 `value`，我们将 `previous` 连接到 `current` 之后的 `IntegerNode`。如果我们已经到达了列表末尾——即\
  \ `current` 为 `null`（第 47 行）——或者我们找到了 `value`（第 48 行），我们就可以准备返回 `false` 或通过更新列表中的链接来删除节点了。此时，我们退出\
  \ `while` 循环并跳转到第 54 行。\n\n注意 `while` 循环条件中表达式的顺序至关重要。复合条件中的表达式是从左到右求值的，因此首先求值 (`current\
  \ != null`)。如果这个表达式为 `false`（即 `current` 为 `null`），则整个 `while` 循环条件无法为 `true`，因此第二个表达式不会被执行。这很重要，因为第二个表达式使用\
  \ `current` 来调用 `getData` 方法。如果 `current` 为 `null`，第二个表达式的求值将产生 `NullPointerException`。通过这种方式。\n\
  \n\n\n\n\n在每次删除后，我们都可以使用 `toString` 方法来检查项目是否正确删除。\n\n示例 14.3 显示了一个测试 `IntegerLinkedList`\
  \ 类的客户端程序。\n\n![img](img/01862.jpeg)\n\n![img](img/01863.jpeg)\n\n**示例 14.3    \
