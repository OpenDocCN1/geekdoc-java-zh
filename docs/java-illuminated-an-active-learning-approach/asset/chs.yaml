  \ 题 |\n| **13.9.6** | 编写短程序 |\n| | 第 39, 40, 41, 44 题 |\n\n## 13.2 带返回值的递归\n\n在上一个示例中，我们编写了一个非常简单的方法。现在让我们来看稍微复杂一些的，即带有返回值的递归方法。\n\
  \n在带返回值的方法中，`return` 语句可以包含对另一个带返回值方法的调用，例如：\n\n![img](img/01735.jpeg)\n\n在这种情况下，`multiplyAbsoluteValueBy3`\
  \ 方法在 `abs` 方法返回值之前无法返回其值，这使得 `return` 语句中的表达式能够被完全求值。\n\n同样的原理也适用于返回值的递归方法。递归方法的返回值通常由一个包含对方法自身调用的表达式组成\n\
  \n因此，在方法的通用情况下，我们可能会看到如下代码：\n\n![img](img/01736.jpeg)\n\n递归方法的每次执行都必须等待直到其对方法的递归调用返回值才能返回自己的值。当到达基准情况时，方法直接返回一个值，而不进行另一个递归调用。此时，带基准参数调用该方法的方法接收到其返回值，这允许该方法向其调用者返回一个值，以此类推，直到方法能够向初始调用者返回值。通过这种方式，返回值回溯到初始调用者。\n\
  \n为了了解它是如何工作的，让我们来看一个返回值的递归方法示例。\n\n### 13.2.1 计算数字的阶乘\n\n我们将定义一个递归方法来计算并返回正整数的阶乘。\n\
