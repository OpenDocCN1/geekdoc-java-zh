  \ 和 `nextBoolean` 方法可以使用与 `next`、`nextInt` 和 `nextFloat`相同的模式。\n\n注意，我们在提示信息的末尾加了一个空格、一个角括号和另一个空格。角括号表示我们正在等待输入，空格将提示信息与输入隔开。如果没有末尾空格，用户的输入将紧跟在提示信息后面，这更难以阅读，正如图\
