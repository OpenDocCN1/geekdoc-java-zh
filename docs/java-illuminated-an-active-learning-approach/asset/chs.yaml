  \n正如我们所讨论的，Java 提供了 `char` 基本数据类型，它存储一个字符。然而，几乎每个程序都需要一种存储多个字符的数据类型。程序需要处理名称、地址或标签。例如，许多程序涉及登录过程，用户必须输入用户\
  \ ID 和密码。程序读取用户 ID 和密码，将其与存储在数据库中的值进行比较，仅在匹配时允许用户继续。\n\n为了处理此类数据，Java 提供了 `String`\
  \ 类。由于 `String` 类是 `java.lang` 包的一部分，对于任何 Java 程序都是自动可用的，不需要使用 `import` 语句。`String`\
