  \ 显示了为 `setMilesDriven` 和 `setGallonsOfGas` 方法生成的文档。\n\n## 7.17 章总结\n\n![img](img/00009.jpeg)Java\
  \ 类的成员包括其实例变量、类变量和方法。\n\n![img](img/00009.jpeg)对于从该类实例化的每个对象，都会创建一个实例变量的拷贝。每个类变量和方法的拷贝由该类的所有对象共享。\n\
  \n![img](img/00009.jpeg)按照惯例，类名是名词并以大写字母开头；所有内部单词的首字母大写，其他字母小写。方法名是动词并以小写字母开头；内部单词的首字母大写，所有其他字母小写。非常量实例变量是名词，并遵循与方法相同的大小写规则。常量字段全大大写，内部单词间用下划线分隔。\n\
  \n![img](img/00009.jpeg)`public` 访问修饰符允许其他类访问该类或成员。`private` 访问修饰符指定类或成员只能由同一类的其他成员访问。包级访问（Package\
  \ access）允许同一包中的其他类访问该类或类成员。\n\n![img](img/00009.jpeg)类、构造函数、`final` 类变量和类方法通常声明为\
  \ `public`，而实例变量通常声明为 `private`。\n\n![img](img/00009.jpeg)实例变量反映了所有对象将共有的属性。实例变量通过指定访问修饰符、数据类型和标识符以及可选的初始值来定义。实例变量可以声明为\
  \ `final`。\n\n![img](img/00009.jpeg)方法的定义是通过提供方法头，方法头指定了访问修饰符、返回类型、方法名和参数列表。方法体括在大括号中。有返回值的类型使用一个或多个\
  \ `return` 语句返回方法结果。返回类型为 `void`的方法不返回值。\n\n![img](img/00009.jpeg)标识符的作用域是可以访问该标识符的代码范围。实例变量和方法具有类作用域，因为它们可以在类的任何地方被访问。\n\
  \n![img](img/00009.jpeg)方法可以引用其类的实例变量、传递给方法的参数以及由方法声明的局部变量，并可以调用该类的其他方法。\n\n![img](img/00009.jpeg)可以通过定义另一个名称相同但签名不同的方法来重载方法，即具有不同数量的参数或具有不同数据类型的参数。\n\
  \n![img](img/00009.jpeg)构造函数负责初始化类的实例变量。\n\n![img](img/00009.jpeg)如果你不提供构造函数，编译器将提供一个默认构造函数，即不接受参数的构造函数。此默认构造函数为所有实例变量分配默认初始值。数值变量被赋予值\
  \ 0，字符被赋予空格，`boolean` 变量被赋予 `false`，对象引用被赋予 `null`。方法中声明的局部变量不会自动赋予初始值。\n\n![img](img/00009.jpeg)访问器方法（Accessor\
  \ methods）命名为 `getIV`，其中 `IV` 是实例变量名；返回类型是实例变量名。\n\n![img](img/00009.jpeg)修改方法（Mutator\
  \ methods）命名为 `setIV`，其中 `IV` 是实例变量名；返回类型为 `void`，且方法接受一个与实例变量类型相同的参数。方法体应该验证新值，如果有效则将其赋值实例变量。\n\
  \n![img](img/00009.jpeg)当方法开始执行时，JVM 会设置 `this` 指向调用该方法的对象。\n\n![img](img/00009.jpeg)`toString`\
  \ 方法在对象引用用作 `String` 时被自动调用，其作用是提供对象的打印表示。\n\n![img](img/00009.jpeg)`equals` 方法比较两个对象的相等性；即只有当两个对象的相应实例变量相等时返回\
  \ `true`，否则返回 `false`。\n\n![img](img/00009.jpeg)`static` 类变量在类初始化时创建。因此，类变量在实例化任何对象之前就已经存在，且每个类只有一个类变量拷贝。静态常量变量通常声明为\
  \ `public`，因为它们通常允许客户端设置类的操作偏好。\n\n![img](img/00009.jpeg)`static` 类方法只能引用 `static`\
  \ 变量，只能调用 `static` 方法，且不能使用 `this` 引用。\n\n![img](img/00009.jpeg)非静态（即实例）方法可以引用类变量和实例变量、类方法和实例方法以及\
  \ `this` 引用。\n\n![img](img/00009.jpeg)图形对象通常具有起始 (x, y) 坐标的实例变量。它还提供一个接受 `Graphics`\
  \ 对象作为参数的 `draw` 方法，并包含绘制图形对象的代码。\n\n![img](img/00009.jpeg)可以定义枚举类型为程序中用数字表示的有序集赋予意义。对于\
  \ `enum` 初始化列表中的每个名称，都会创建一个具有顺序数值实例变量的常量对象。可以定义 `enum` 引用。`enum` 类型的对象可以进行比较、打印并请求返回它们的数值。\n\
  \n![img](img/00009.jpeg)Javadoc 是 Java JDK 的一部分，用于生成类文档。使用 Javadoc 时，将每个类、方法和字段的描述封装在以\
  \ /** 开始以 */ 结束的注释中。此外，你可以使用 `@param` 标签描述每个参数，使用 `@return` 标签描述返回值。\n\n## 7.18\
