  \n在配套网站上，你将找到一个 Flash 电影，逐步演示了如何操作 GUI 组件。点击链接开始播放。\n\n### 12.10 适配器类 (Adapter Classes)\n\
  \n我们已经了解到事件与事件监听器接口相关，并且为了处理事件，我们至少实现一个接口。到目前为止，我们使用了 `ActionListener` 和 `ItemListener`\
  \ 接口，每个接口都只有一个方法。对于鼠标事件，有两个监听器：`MouseListener` 和 `MouseMotionListener`。`MouseListener`\
  \ 接口规定了五个需要实现的方法，而 `MouseMotionListener` 接口规定了两个需要实现的方法。\n\n如果我们想使用 `MouseListener`\
  \ 但只需要它的五个方法之一来处理 `MouseEvent`，我们仍然必须将其他四个方法实现为带有空方法体的“无操作”方法。为了方便起见，Java 提供了**适配器类**，每个适配器类实现一个接口并为接口的每个方法提供一个空方法体。对于鼠标事件，适配器类是\
  \ `MouseAdapter` 和 `MouseMotionAdapter`。因此，我们不需要实现接口，而是扩展相应的适配器。\n\n![img](img/00004.jpeg)\
  \ **软件工程技巧**\n\n当你需要实现一个具有多个方法的接口的几个方法时，考虑扩展适配器类。\n\n### 12.11 鼠标移动\n\n一个真正的交互式允许用户指向并点击鼠标。任何鼠标活动（点击、移动或拖动）都会产生\
  \ `MouseEvent`。当任何鼠标活动发生时，我们会感兴趣确定用户点击、移动或拖动鼠标的位置。为了确定鼠标事件的 (x, y) 坐标，我们可以调用 `MouseEvent`\
  \ 类的两个方法 `getX` 和 `getY`。\n\n根据鼠标活动的类型，我们的应用程序将实现 `MouseListener` 接口或 `MouseMotionListener`\
  \ 接口。如所述，这两个器接口都被实现为我们可以扩展的适配器类。`MouseListener` 接口包含五个方法。\n\n#### 表 12.16 `MouseEvent`\
  \ 类的常用方法\n\n| **返回值** | **方法名和参数列表** |\n| :--- | :--- |\n| `int` | `getX()` 返回鼠标活动\
  \ (x,y) 坐标的 x 值 |\n| `int` | `getY()` 返回鼠标活动的 y 值 |\n\n#### 表 12.17 `MouseListener`\
  \ 接口的方法\n\n| ***MouseListener* 接口 API** |\n| :--- |\n| `public void mousePressed(MouseEvent\
  \ e)` 当鼠标按钮被按下时调用 |\n| `public void mouseReleased(MouseEvent e)` 当鼠标按钮在按下后释放时调用\
  \ |\n| `public void mouseClicked(MouseEvent e)` 当鼠标按钮被按下并释放时调用 |\n| `public void\
  \ mouseEntered(MouseEvent e)` 当鼠标进入注册组件时调用 |\n| `public void mouseExited(MouseEvent\
  \ e)` 当鼠标离开注册组件时调用 |\n\n\n\n\n\n`Model` 封装了应用程序的功能：它的设计应该能够在不同的上下文中被重用，特别是在不同的用户界面中。\n\
  \n`View` 封装了应用程序的用户界面：它的设计也应该能够与不同的 `Model` 进行复用。\n\n`Controller` 是 `View` 和 `Model`\
  \ 之间的中间人。当用户与 `View` 交互时，`Controller` 请求 `Model` 执行某些计算，然后相应地更新 `View`。如果可能，`Controller`\
  \ 的设计也应该是独立于 `Model` 和 `View` 的，这样它就可以与其他的 `View` 和其他 `Model` 进行复用。\n\n尽可能地将 `Model`、`View`\
  \ 和 `Controller` 分离是一种良好的设计实践。这使得应用程序组件更容易进行设计、编码、维护、修改和重用。\n\n![img](img/01610.jpeg)\n\
  \n**图 12.13: SubHunt 和 SubHuntViewController 的 UML 图**\n\n图 12.13 显示了该应用程序的 UML\
  \ 图。我们首先编写 Model，即 `SubHunt` 类（示例 12.9）。它封装了潜艇搜索游戏，使我们能够创建一个指定大小的游戏、启用游戏并强制执行游戏规则。\n\
  \n![img](img/01611.jpeg)\n![img](img/01612.jpeg)\n![img](img/01613.jpeg)\n![img](img/01614.jpeg)\n\
  \n### 示例 12.9：SubHunt 类\n\n示例 12.10 显示了 `SubHuntViewController` 类。它结合了 `View` 和\
  \ `Controller`。在章节的后续部分，我们将向你展示如何分离 `View` 和 `Controller` 以使 View 可可重用。\n\n构造函数（第\
  \ 18–32 行）定义并显示了原始 View。私有类 `MouseHandler`（第 34–44 行）和 `paint` 方法（第 46–57 行）组成了\
  \ Controller。Model 由实例变量 `sub`（第 13 行）表示。当用户通过点击窗口与 View 交互时，Controller 捕获该信息，调用\
  \ `SubHunt` 类的相应方法，并相应地更新 View。\n\n在这个游戏中，我们关心的鼠标动作只有点击；因此，我们只对 `MouseListener`\
  \ 接口的一个方法感兴趣：`mouseClicked`。为了简化代码，我们的处理器扩展了 `MouseAdapter` 类，该类为五个 `MouseListener`\
  \ 方法提供了空实现，因此我们的事件处理器只需要重写 `mouseClicked` 方法。\n\n在第 11–16 行处，我们声明了实例变量。`ints x`\
  \ 和 `y` 代表玩家相对于整个窗口点击鼠标的 `x` 坐标和 `y` 坐标。`SubHunt` 实例变量 `sub` 代表窗口内部显示的潜艇搜索游戏。构造函数接收一个\
  \ `SubHunt` 对象作为参数，并将其存储在第 22 行的 `sub` 实例变量中。当用户玩游戏时，我们使用 `sub` 引用调用 `SubHunt` 类的各种方法来启用游戏并强制执行游戏规则。\n\
  \n在这个示例中，我们将监听器引用 `mh` 设置为实例变量（第 16 行），而不是作为构造函数的局部变量引用，就像我们在之前的示例中做的那样。我们将 `mh`\
  \ 定义为实例变量，是因为当游戏结束时，事件处理器需要访问该监听器将其关闭。事件处理器在第 24 行实例化。\n\n我们希望监听器处理窗口内任何位置鼠标点击，因此我们在我们的窗口（`JFrame`）组件上注册了\
  \ `mouseListener`，该组件是 `SubHuntViewController` 对象。因此，我们没有使用对象引用来调用 `addMouseListener`\
  \ 方法，第 25 行等同于：\n\n```\n![img](img/01615.jpeg)\n```\n\n当用户点击 `JFrame` 窗口内部时，`mouseClicked`\
  \ 方法返回的 `x` 和 `y` 坐标相对于窗口的左上角；也就是说，0,0) 是窗口的左上角。然而，对于 `JFrame` 来说，标题栏位于左上角。事实上，`JFrame`\
  \ 在顶部（显示标题栏的地方）、左侧、右侧和底部都有边界。这四个区域共同称为框架的**内边距 (insets)**。因此，在编写潜艇搜索游戏时，我们需要调整 `x`\
  \ 和 `y` 坐标，以便游戏在一个不包含内边距的矩形内进行。\n\n图 12.14 分别用灰色和橙色显示了 `JFrame` 和潜艇搜索游戏矩形。\n\n![img](img/01616.jpeg)\n\
  \n**图 12.14：JFrame 内的游戏矩形**\n\n`Insets` 类（位于 `java.awt` 包中）允许我们确定边界的大小。`JFrame`\
  \ 自 `Container` 类的 `getInsets` 方法见表 12.18。\n\n#### 表 12.18：继承自 Container 的 getInsets\
  \ 方法\n| 方法 | 描述 |\n| :--- | :--- |\n| `Insets getInsets()` | 返回当前框架的 Insets 对象 |\n\
  \n#### 表 12.19：Insets 实例变量 |\n| 实例变量 | 描述 |\n| :--- | :--- |\n| `public int top`\
  \ | 顶部边界的大小 |\n| `public int left` | 左侧边界的大小 |\n| `public int bottom` | 底部边界的大小\
  \ |\n| `public int right` | 右侧边界的大小 |\n\n#### 表 12.20：Component 类中的 repaint 方法\n\
  | 返回值 | 方法名和参数列表 |\n| :--- | :--- |\n| `void` | `repaint()` 强制调用 paint 方法 |\n\n\
  对于这个游戏，我们希望保留之前绘制的内容。因此，在 `paint` 方法（第 46–57 行）中，而不是每次都清除窗口，而是在游戏开始时将标记 `gameStarted`\
  \ 设置为 `false`（第 14 行）。这使得我们在第一次调用 `paint` 时调用 `super.paint` 来清除窗口（第 48–52 行），然后将\
  \ `gameStarted` 设置为 `true`，以便以后不再调用 `super.paint`。\n\n为了绘制上次点击的结果，我们首先调用 `Graphics`\
  \ 类的 `translate` 方法（第 53 行），传入左侧和顶部内边距，将点击坐标调整到潜艇搜索矩形的左上角。`translate` 方法的 API 见表\
  \ 12.21。然后我们调用 `SubHunt draw` 方法，传入 `Graphics` 对象 `g` 和鼠标位置。\n\n#### 表 12.21：Graphics\
  \ 类的 translate 方法\n| 方法 | 描述 |\n| :--- | :--- |\n| `translate(int dx, int dy)` |\
  \ 按指定的量调整坐标系 |\n\n\n\n\n\n| `void translate(int x, int y)` | 将图形上下文的起始点移动到当前坐标系中的点\
  \ `(x, y)` |\n\n最后，如果游戏结束，我们通过调用继承自 `Component` 类的 `removeMouseListener` 方法将 `mh`\
