  \ Big-Oh。\n\n## 15.2 算法运行时间分析：语句计数\n\n分析代码运行时间的一种简单方法是计算每个语句的执行次数，并计算语句的总数。示例 15.1\
  \ 是一个计算大小为 $n$ 的数组所有元素总和的方法。\n\n![img](img/02017.jpeg)\n\n**示例 15.1 单循环**\n\n让我们计算每个语句执行几次。假设数组有\
  \ $n$ 个元素，我们可以进行如下分析：\n\n| 语句 | 执行次数 |\n| :--- | :--- |\n| (1) | 1 |\n| (2) | 1\
  \ |\n| (3) | $n + 1$ |\n| (4) | $n$ |\n| (5) | $n$ |\n| (6) | 1 |\n\n注意循环条件 `i <\
  \ arr.length` 比循环体多执行一次：当 `i` 等于 `arr.length` 时，我们评估循环条件但不执行循环体语句。因此，语句总数 $T(n)$\
  \ 等于：\n\n![img](img/02018.jpeg)\n\n所以我们可以说 `addElements` 方法的运行时间是 $O(n)$。注意最后我们不需要语句的精确计数，因为我们感兴趣的是函数的\
  \ Big-Oh 运行时间。示例 15.2 是一个确定 `int` 二维数组最大值的方法。\n\n![img](img/02019.jpeg)\n\n**示例\
  \ 15.2 双循环**\n\n让我们计算每个语句执行几次。假设数组有 $n$ 行，每行有 $n$ 列，我们可以进行如下分析：\n\n| 语句 | 执行次数 |\n\
  | :--- | :--- |\n| (1) | 1 |\n| (2) | $1 + (n + 1) + n = 2n + 2$ |\n| (3) | $n \\\
  cdot (1 + (n + 1) + n) = 2n² + 2n$ |\n| (4) | $n \\cdot n = n²$ |\n| (5) | 在 0 到\
  \ $n \\cdot n$ |\n| (6) | 1 |\n\n语句 (2) 实际上包含了三个语句：`int i = 0` 执行 1 次，`i < arr.length`\
  \ 随着 `i` 从 0 到 $n$ 执行 $(n+1)$ 次，`i++` 随着 `i` 增加 $n$ 次执行 $n$ 次。\n\n在评估语句 (3)、(4)\
  \ 和 (5) 的执行次数时，我们首先注意到进入外循环 $n$ 次。语句 (3) 也包含三个语句：`int j = 0` 在每次进入外循环时执行一次，即 $n$\
  \ 次；`j < arr.length[i]` 在每次进入外循环时执行 $(n+1)$ 次，即 $n \\cdot (n+1)$ 次，因为 `j` 从 0 到\
  \ $n$；`j++` 在每次进入外循环时执行 $n$ 次，即 $n \\cdot n$ 次。\n\n由于我们进入外循环 $n$ 次，且每次外循环迭代都进入内循环\
  \ $n$ 次，语句 (4) 将执行 $n \\cdot n$ 次。对于语句 (5)，当布尔表达式 `maximum < arr[i][j]` 结果为 `true`\
  \ 时，它会执行一次。我们无法确定它会发生多少次，但可以说它发生的次数不超过 $n \\cdot n$ 次。我们将这个未知值称为 $x$。\n\n因此，执行的语句总数\
  \ $T(n)$ 等于：\n\n![img](img/02020.jpeg)\n\n其中 $x \\le n \\cdot n$\n\n此外，由于 $x$ 的值在\
  \ 0 到 $n²$ 之间，\n\n![img](img/02021.jpeg)\n\n由于 $T(n)$ 同时具有 $O(n²)$ 的下界和上限，$T(n)$\
  \ 是 $O(n²)$。\n\n对于我们的第三个例子，让我们计算示例 15.3 代码实现的顺序查找的运行时间。\n\n![img](img/02022.jpeg)\n\
  \n**示例 15.3 顺序查找算法**\n\n让我们计算每个语句执行几次。假设数组有 $n$ 个元素，我们可以进行如下分析：\n\n| 语句 | 执行次数 |\n\
  | :--- | :--- |\n| (1) | $1 + (n+1) + n = 2n+2$ |\n| (2) | 在 1 到 $n$ |\n| (3) |\
  \ 0 或 1 |\n| (4) | 1 或 0 |\n\n因此，如果 $T(n)$ 代表执行的语句数，我们可以说\n\n![img](img/02023.jpeg)\n\
  \n$T(n) \\le 3n + 3$ 表明 $T(n)$ 是 $O(n)$。\n\n然而，我们无法从函数的编码真正确定其作为 $n$ 的函数的执行次数。在这些情况下，考虑三种运行时间是有意义的：\n\
  \n![img](img/00009.jpeg)最坏情况运行时间\n![img](img/00009.jpeg)最佳情况运行时间\n![img](img/00009.jpeg)平均情况运行时间\n\
  \n在最坏情况下，搜索键不在数组中或在最后一个元素处找到，$T(n) = 3n + 3$；在最佳情况下，我们要查找的元素位于索引 0 处，只执行四个语句，与 $n$\
  \ 的值无关。\n\n## 15.3 算法运行时间分析与编码的影响：评估递归方法\n\n在本节中，我们将学习如何计算递归方法的运行时间。我们还将查看代码编码如何对其运行时间产生直接影响。\n\
  \n考虑编写一个接受一个参数 $n$ 并返回 $2^n$ 的递归方法。有多种方法可以编写该方法，我们在这里考虑其中两种，以便评估哪种算法更高效。\n\n我们的第一个方法\
  \ `powerOf2A` 是基于这两个事实设计的：\n\n\n\n\n![img](img/00009.jpeg)当 `n` = 0 时，2⁰ = 1。这是我们的基础情况。\n\
  \n![img](img/00009.jpeg)2^(`n`) = 2 * 2^(`n` – 1)。这是我们的一般情况。\n\n第一个问题公式化得出了示例 15.4\
  \ 所示的方法。\n\n![img](img/02025.jpeg)\n\n**示例 15.4 2^(*n*) 的第一次递归公式化**\n\n我们的第二种方法\
  \ `powerOf2B` 是基于这两个事实设计的：\n\n![img](img/00009.jpeg)当 `n` = 0 时，2⁰ = 1。这是我们的基础情况。\n\
  \n![img](img/00009.jpeg)2^(`n`) = 2^(`n` – 1) + 2^(`n` – 1)。这是我们的一般情况。\n\n第二个问题公式化得出了示例\
  \ 15.5 所示的方法。\n\n![img](img/02026.jpeg)\n\n**示例 15.5 2^(*n*) 的第二次递归公式化**\n\n让我们计算\
  \ `powerOf2A` 关于输入 `n` 的函数运行时间；我们将其称为 `T`1(`n`)`。\n\n在基础情况下（`n` 等于 0），`powerOf2A`\
  \ 只进行了一次比较并返回 1。因此，\n\n`T1(0) = 1`\n\n通常，由于计算和返回 `powerOf2A(`n`)` 需要 `T1(`n`)`，那么计算和返回\
  \ `powerOf2A(`n −* 1))` 就需要 `T1(`n −* 1)`。\n\n因此，在一般情况下，`if` 语句中的比较将消耗我们 1 条指令；计算并返回\
  \ `powerOf2A(`n −* 1))` 将消耗我们 `T1` (`n − 1`)；而将该结果乘以 2 将消耗我们 1 条指令。因此，总时间 `T1(`n`)`\
  \ 可以表示如下：\n\n![img](img/02027.jpeg)\n\n上述方程（我们将其称为方程 15.1）被称为 `T1(`n`)` 和 `T1(`n`\
  \ – 1)` 之间的递归关系，因为 `T1(`n`)` 表示为 `T1(`n` – 1)` 的函数。\n\n从这里开始，可以使用多种技术来计算 `T1(`n`)`\
  \ 关于 `n` 的值。\n\n### 推测法 (Handwaving Method)\n\n这种方法被称为推测法，因为它更是一种估计方法，而不是基于严格数学的方法。\n\
  \n根据上述递归关系，我们可以说向下走一步（从 `n` 到 `n −* 1`）需要消耗我们两条指令。因此，向下走 `n` 步将消耗我们 2 * `n` 条指令。我们然后为\
  \ `T(0)` 添加一条指令，得到\n\n![img](img/02028.jpeg)\n\n### 迭代法 (Iterative Method)\n\n这种方法涉及多次迭代，从递归关系开始，直到我们可以识别出模式。通常，我们可以说：\n\
  \n![img](img/02029.jpeg)\n\n我们称此为方程 15.2，它与方程 15.1 相同，只是用 `x` 代替了 `n`。\n\n我们现在想要将\
  \ `T(`n`)` 表示为 `T(`n` – 2)` 的函数；因此，我们想要用使用 `T(`n` – 2)` 的表达式替换方程 15.1 中的 `T(`n`\
  \ – 1)`。\n\n在方程 15.2 中用 `n − 1` 代替 `x`，我们得到\n\n![img](img/02030.jpeg)\n\n将 `T1(`n`\
  \ – 1)` 的值代入方程 15.1，我们得到\n\n![img](img/02031.jpeg)\n\n注意在方程 15.3 中，我们没有简化 2 * 2。通过这种方式，我们正试图让模式形成，以便我们轻松地识别它。\n\
