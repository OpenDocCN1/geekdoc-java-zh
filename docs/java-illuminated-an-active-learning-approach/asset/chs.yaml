  \n需要编写的方法：构造函数（至少一个）、访问器（accessors）和修改器（mutators）。`SortedList` 类是一个升序的双向链表。它有两个实例变量，均为私有：\n\
  - `int`，代表列表中的项目数量\n- `Node`，代表列表的头节点\n\n需要编写的方法：\n- `insert(int)`：接收一个 `int` 参数；返回值为\
  \ `void`。\n- `delete(int)`：接收一个 `int` 参数；返回 `boolean` 值。如果我们成功删除了该项（即参数的值在列表中找到），则返回\
  \ `true`；如果我们没有成功，则希望输出一条未找到值因此未删除的消息，并返回 `false`。\n- `toString()`：该方法不接受参数并返回列表的\
  \ `String` 表示。\n\n所有方法都应该保持列表升序排序。`GroupProject` 类包含 `main` 方法；它应该执行以下操作：\n- 创建\
  \ `SortedList` 对象引用。\n- 顺序在排序列表中插入 25, 17, 12, 21, 78 和 47。\n- 使用 `toString` 方法输出列表内容。\n\
  - 使用 `delete` 方法从排序列表中删除值 30（显然，30 不会被找到）。\n- 使用 `toString` 方法输出列表内容。\n- 使用 `delete`\
  \ 方法从排序列表中删除值 21。\n\n\n\n\n\n![img](img/00044.jpeg)使用 `toString` 方法输出排序列表的内容\n\n\
  你的 `insert` 和 `delete` 方法应该在所有可能的场景下正常工作：在空列表中插入、在列表开头插入、在列表中间插入、在列表末尾插入、从空列表中删除（无法删除）、删除不在列表中的项（无法删除）、删除列表中的第一个元素、在列表中间删除、删除列表的最后一个元素。\n\
  \n# 第 15 章：运行时间分析\n\n## 目录\n- 引言\n- 15.1 数量级与 O 表示法\n- 15.2 算法运行时间分析：语句计数\n- 15.3\
  \ 算法运行时间分析与编码的影响：评估递归方法\n- 15.4 编程活动：跟踪方法执行的语句数\n- 15.5 搜索与排序算法的运行时间分析\n- 15.6 章小结\n\
  - 15.7 练习、问题与项目\n    - 15.7.1 单选题练习\n    - 15.7.2 计算方法的运行时间\n    - 15.7.3 编程项目\n\
  \    - 15.7.4 技术写作\n    - 15.7.5 小组项目\n\n## 引言\n如今的互联网网站拥有数百万用户。随着 Web 2.0 网站的成功，存储在\
  \ Web 服务器上的数据库规模急剧增长，以适应不断增加的用户数和这些用户发布的日益增长的数据量。\n\n科学应用也经历了数据爆炸。用于这些科学应用（如气象学或流体力学）的传感器在变得越来越精确的同时，也变得越来越廉价。越来越多的传感器被使用，应用程序必须管理更多的数据。\n\
  \n处理和操作这些不断增长的数据程序需要使用设计良好且高效的算法，以便最大限度地减少用户的等待时间。两个使用不同算法解决同一个问题的程序，在硬件平台等其他所有因素都相等的情况下，可能会导致两种完全不同的性能水平。例如，两个执行相同搜索的搜索引擎可能以两种不同的速度运行：一个可以在几分之一秒内返回结果，而另一个可能需要几秒钟才能返回结果。\n\
  \n大多数程序员在编写代码时倾向于忽视速度和空间（内存利用率）问题。他们依赖硬件性能的提升来解决速度问题，依赖内存成本的下降来解决空间问题。然而，随着我们今天在许多行业面临的数据爆炸以及由此产生的数据处理问题，设计高效的算法变得越来越重要。在本章中，我们将关注算法的速度性能，而不是空间利用率。\n\
  \n当我们衡量算法的性能时，我们使用 `running time`（运行时间）这一表达式。我们无法预测许多算法的单一精确运行时间，因为处理量很大程度上取决于输入的数量以及这些输入的值。因此，我们将算法的运行时间表示为其输入的数学函数。这允许我们比较多个算法的相对性能。例如，计算整数阶乘的运行时间取决于我们计算阶乘时的值。较大数的阶乘比较小数的阶乘需要更多的处理来计算。如果我们可以将计算阶乘的多个算法的运行时间表示为其输入的函数，那么就可以比较每个算法的相对效率。在其他情况下，例如对整数数组进行排序，运行时间取决于数组元素的数量。同样，如果我们将运行时间表示为数组元素数量的函数，就可以比较多个排序算法的相对效率。\n\
  \n算法的输入值或输入数量代表了我们尝试计算运行时间的问题规模。我们将该数字命名为 `n`。我们感兴趣的是相对时间，与所使用的硬件平台无关，而不是绝对时间。此外，我们通常感兴趣的是算法的数量级，而不是关于\
  \ `n` 的函数的精确数学表达式。事实上，如果 `n` 非常大（例如 100 万或更多），如果算法需要 `n` 步或 `n + 17` 步完成，性能不会发生明显变化。\n\
  \n然而，如果算法的运行时间表示为 `n²`，那么输入数量对性能有巨大影响。例如，我们可以预测 10 个输入将需要执行 100 条语句，而 1000 个输入将需要执行\
  \ 1000 条语句。\n\n本章的目标是：\n- ![img](img/0009.jpeg)通过各种方法评估给定算法的运行时间\n- ![img](img/0009.jpeg)理解代码如何直接影响运行时间\n\
  \n## 15.1 数量级与 O 表示法\n表 15.1 显示了作为 `n` 的算法数量级示例以及相应的语句执行。让我们来看一个例子，顺序搜索的运行时间为 `n`，而二分搜索的运行时间为\
  \ `log n`。因此，如果我们搜索一个包含 100 万个元素的数组，顺序搜索平均需要 100 万条语句。但记住，为了让二分搜索工作，数组必须是排序的。\n\n\
  ![img](img/0006.jpeg)\n从表中可以看出，运行时间中指数位置是函数的算法（例如 `2^n`）执行的语句非常多，速度非常慢；只有在找不到更好的算法时才应该使用。\n\
  \n算法的运行时间通常用 **Big-Oh** 或 **Big-Theta**符号表示，例如 `O(n)` 或 `Θ(n²)`。Big-Theta 的数学定义如下：\n\
  \n函数 `f(n)` 是另一个函数 `g(n)` 的 Big-Theta，即 `Θ(g(n))`，当且仅当：\n\n1. `f(n)` 是 `g(n)` 的\
  \ **Big-Omega**，即 `Ω(g(n))`，意味着存在两个正数 `n1` 和 `c1`，对于任何 `n >= n1`，`f(n) >= c1 * g(n)`。也就是说，当\
  \ `n` 足够大时，`g(n)` 是 `f(n)` 的下界；也就是说，忽略常数后，`g(n)` 比 `f(n)` 小。\n\n2. `f(n)` 是 `g(n)`\
  \ 的 **Big-Oh**，即 `O(g(n))`，意味着存在两个正数 `n2` 和 `c2`，对于任何 `n >= n2`，`f(n) <= c2 * g(n)`。也就是说，当\
  \ `n` 足够大时，`g(n)` 是 `f(n)` 的上界；也就是说，忽略常数后，`g(n)` 比 `f(n)` 大。\n\n在行业中，用 Big-Oh 代替\
  \ Big-Theta 已变得常见。事实上，我们真正感兴趣的是上界运行时间（Big-Oh），以及尽可能紧的上界（Big-Theta）。\n\n\n\n\n虽然前面的定义听起来有点复杂，但在尝试估计一个表示运行时间的特定函数的\
  \ Big-Oh 复杂度时，可以使用以下规则：\n\n![img](img/00009.jpeg)仅保留主项，即随着 `n` 增大而增长最快的项。\n\n![img](img/00009.jpeg)忽略主项的系数。\n\
  \n表 15.2 展示了几个说明这些规则的例子。\n\n举例来说，我们将展示函数 $f(n) = 3 \\cdot n² + 6 \\cdot n + 12$\
  \ 是 $\\Theta(n²)$ 的。\n\n首先，我们证明 $f(n)$ 是 $\\Omega(n²)$：\n\n对于 $n \\ge 0$，\n\n![img](img/02007.jpeg)\n\
  \n因此，如果我们选择 $n1 = 0$ 且 $c1 = 3$，我们就根据定义证明了 $f(n)$ 是 $\\Omega(n²)$。\n\n现在，我们证明同一个函数\
  \ $f(n)$ 是 $O(n²)$。\n\n对于 $n \\ge 1$，我们可以将 $f(n)$ 重写为\n\n![img](img/02008.jpeg)\n\
  \n对于 $n \\ge 6$，我们有\n\n![img](img/02009.jpeg)\n\n**表 15.2 表示运行时间的函数及其对应的 Big-Oh\
