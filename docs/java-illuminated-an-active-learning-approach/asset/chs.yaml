  \ 方法仅执行输入。它们不会告诉用户应该输入什么数据。\n\n在编写输入提示时，请记住几点。首先，要要具体。如果你想让用户输入全名，你的提示应该就那样写：\n\n\
  ![img](img/00241.jpeg)\n\n如果输入应该在某个值范围内，请告诉用户哪些值是有效的：\n\n![img](img/00242.jpeg)\n\
  \n另外要记住，用户通常不是程序员。使用用户能理解的语言来组织提示是非常重要的。很多时候，程序员会从自己的角度编写提示，就像下面这个糟糕的提示：\n\n![img](img/00243.jpeg)\n\
  \n用户不知道，也不关心 `String` 或任何其他数据类型。用户只想知道输入什么才能让程序运行。\n\n当你的提示清晰且具体时，用户犯的错误就会减少，因此使用你的程序会感到更舒服。\n\
