  \ `ConsoleIn` 类，可以将该类放入一个包（package）中，以便在其他程序中使用。\n\n## 创建包\n\n要创建一个包，你需要在源文件的头注释后的第一行插入一个\
  \ `package` 语句。`package` 语句的语法如下：\n\n![img](img/00820.jpeg)\n\n在 `ConsoleIn` 类中，我们将包定义为\
