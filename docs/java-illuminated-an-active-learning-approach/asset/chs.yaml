  \n```\nOldsmobile, oldsmobile.gif, 100\nWorld Cup soccer ticket, soccerTickets.gif,\
  \ 50\nTrip for 2 to Rome, trip.gif, 100\n```\n\n在前面的文件示例中，每行代表一个物品，如下：第一个字段是物品的描述，第二个字段是包含物品图像的文件名，第三个字段是最低出价。你可以假设每个物品的描述都是唯一的。\n\
