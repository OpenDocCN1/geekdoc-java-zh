  \ 输出类的继承层次结构**\n\n### 11.3 使用 Scanner 读取文本文件\n\nJava 支持两种文件类型：文本和二进制。在文本文件中，数据以字符的形式存储；在二进制文件中，数据以原始字节的形式存储。不同的类被用于写入和读取各种文件类型。文件的类型在写入文件时确定，并取决于使用了哪些类来写入文件。因此，要从现有文件中读取内容，必须知道文件的类型以便选择合适的类。\n\
  \n在本节中，我们专注于文本文件。\n\n可以使用 `Scanner` 类从文本文件中读取内容。如果找不到文件，`Scanner` 构造函数将抛出 `FileNotFoundException`。既然我们已经学习如何使用\
  \ `try` 和 `catch` 块，可以将 `Scanner` 代码放在 `try` 块中并捕获可能发生的任何异常。\n\n表 11.4 显示了 `Scanner`\
  \ 和 `File` 类的一些构造函数，以及 `Scanner` 类读取文件的方法。\n\n### 表 11.4 用于读取文件的 Scanner 和 File\
  \ 类方法\n\n| File 构造函数 | 抛出的异常 |\n| :--- | :--- |\n| `File(String pathname)` 创建一个具有\
  \ `pathname` 文件名的 `File` 对象，使文件名与平台无关。 | `NullPointerException` |\n\n| Scanner 构造函数和方法\
  \ | 抛出的异常 |\n| :--- | :--- |\n| `Scanner(File file)` 创建一个用于从文件读取的 `Scanner` 对象。\
  \ | `FileNotFoundException` |\n\n| Scanner 方法 API | | |\n| 返回值 | 方法名和参数列表 | 抛出的异常\
  \ |\n| :--- | :--- | :--- |\n| `boolean` | `hasNext()` 如果 `Scanner` 对象中还有标记（token），则返回\
  \ `true` | 两个方法均抛出 `IllegalStateException` |\n| `boolean` | `hasNextLine()` 如果输入流中还有另一行或行分隔符，则返回\
  \ `true` | |\n| `boolean` | `hasNextInt()`, `hasNextDouble()`, `hasNextFloat()`…如果\
  \ `Scanner` 对象中还有指定数据类型的标记，则返回 `true` | 所有这些方法均抛出 `IllegalStateException` |\n| `String`\
