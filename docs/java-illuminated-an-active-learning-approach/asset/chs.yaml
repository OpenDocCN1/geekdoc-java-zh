  \ 5.11 switch 语句\n\n如果条件由 `byte`、`short`、`int`、`char` 或 `String` 组成，可以使用 `switch`\
  \ 语句代替 `if/else`。Java 7 增加了对 `String` 的 `switch` 支持。`switch` 的语法如下：\n\n```\n![img](img/0.)\n\
  ```\n\n首先评估表达式，然后将其值与 `case` 常量进行比较。找到匹配项后，执行该 `case` 下的语句。执行持续直到遇到 `break` 语句或到达\
  \ `switch` 块的结束。`break` 语句是可选的。`default` 标签及其语句也是可选，当值不与任何 `case` 匹配时执行。\n\n让我们看看如何使用\
  \ `switch` 语句来实现一个简单的计算器。我们首先提示用户输入两个想要计算的数字，然后是他们想要执行的操作。我们让他们输入 ADD、SUBTRACT、MULTIPLY\
  \ 或 DIVIDE 单词，或者操作符号 (+, *, /)。我们可以使用 `switch` 语句来确定所选的操作，并为每个可能的操作设置 `case` 常量。示例\
  \ 5.14 显示了我们简单计算器的代码。\n\n```\n![img](img/00479.jpeg)\n```\n\n```\n![img](img/00480.jpeg)\n\
  ```\n\n**示例 5.14   简单计算器**\n\n我们将用于操作的两个数字声明为 `double`（第 12 行），并使用 `Scanner` 类的\
  \ `nextDouble` 方法提示用户（第 23–27 行）。因为 `double` 变量可以存储任何等于或精度低于 `double` 的数值，因此在我们的计算器中使用\
  \ `double` 允许用户输入 `ints` 或 `doubles`。相反，如果我们使用 `int` 变量和 `Scanner` 类的 `nextInt`\
  \ 方法，用户将仅限于只能输入整数。\n\n当计算器开始时，我们设置了一个 `DecimalFormat` 对象，以便输出最多两位小数的結果（第 18 行）。\n\
  \n我们打印一个菜单让用户知道可用选项，使用换行符 (\\n) 和制表符 (\\t) 转义字符来格式化菜单消息（第 29–35 行）。为了读取用户的选择（第 36–37\
  \ 行），我们使用 `Scanner` 类的 `next` 方法，它返回一个 `String`。我们使用 `String` 类的 `toUpperCase` 方法将输入转换为大写。\n\
  \n\n\n现在我们准备好使用 `switch` 语句并将用户的输入作为 `switch expression` 来确定用户选择了哪种操作。我们通过为每种可能的操作提供两个\
  \ `case` 语句来确定用户选择了哪种操作。我们可以使用大写单词作为 `case` 常量，因为我们已经将输入转换为了大写。这允许用户以大写或小写字母的任意组合所需的操作。为了处理用户输入数学符号而非单词的情况，我们为每个操作添加了第二个\
  \ `case` 常量。例如，如果用户输入 `ADD`（任何大写或小写的组合）或加号（`+`），输入将匹配第 42 行和第 43 行的 `case` 常量之一。然后我们将在第\
  \ 44 行和第 45 行执行加法并输出结果。当我们在第 46 行遇到 `break` 语句时，`switch` 语句的执行结束。`break` 语句是非常重要的。如果我们省略了\
