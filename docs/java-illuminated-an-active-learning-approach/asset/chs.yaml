  \n让我们为计算数字阶乘定义基准情况和通用情况。\n\n为了定义通用情况的规则，我们需要找到计算数字阶乘的基准情况（即 `n`）与更小的问题（例如 `n − 1`）之间的关系。在这里，通过\
  \ `n` 的值将问题规模（从 `n`）缩小到 `n − 1`，以及其他值。\n\n通过前面的公式，`factorial(n)` 得到：\n\n![img](img/01739.jpeg)\n\
