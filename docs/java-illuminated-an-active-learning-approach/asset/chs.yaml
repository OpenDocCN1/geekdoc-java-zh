  \n### 归纳证明法 (Proof by Induction Method)\n\n如果我们能猜出 `T1(`n`)` 关于 `n` 的函数，那么我们就可以使用归纳法来证明我们的猜测是正确的。我们可以使用之前的迭代法得出\
  \ `T1(`n`)` 的猜测。\n\n通常，归纳证明法的作用如下：\n\n![img](img/00009.jpeg)验证我们的语句（方程）在基础情况下是正确的。\n\
  \n![img](img/00009.jpeg)假设语句对于 `n` 是正确的。\n\n![img](img/00009.jpeg)证明它对于 `n + 1`\
  \ 是正确的。\n\n让我们带猜测 `T1(`n`) = 2 * n + 1` 过的归纳步骤：\n\n![img](img/02038.jpeg)步骤 1：验证我们的猜测对于\
  \ `T1(0)` 是正确的。\n\n![img](img/02038.jpeg)因此，我们的猜测对于 `T1(0)` 是正确的。\n\n步骤 2：假设 `T1(`n`)\
  \ = 2 * n + 1`。\n\n步骤 3：证明 `T1(`n + 1) = 2 * (n + 1) + 1`。\n\n在方程 15.2 中代入 `x =\
  \ n + 1`，我们得到\n\n![img](img/02039.jpeg)\n\n然后，使用我们的假设并将 `T1(`n`)` 替换为 `2 * n + 1`，我们得到\n\
  \n![img](img/02040.jpeg)\n\n因此，我们通过归纳证明了 `T1(`n`) = 2 * n + 1` 是正确的。\n\n### 其他方法\n\
  \n另一种方法是使用主定理，但这超出了本文范围。\n\n所以 `powerOf2A(`n`)` 的运行时间是 `2 * n + 1`，或者 `O(n)`。\n\n\
  现在计算 `powerOf2B` 关于输入 `n` 的运行时间。我们将其称为 `T2(`n`)`。\n\n在基础情况下（`n` 等于 0），`powerOf2B`\
  \ 只需一次比较即可返回 1。因此，\n\n![img](img/02041.jpeg)通常，由于计算和返回 `powerOf2B(`n`)` 需要 `T2(`n`)`，那么计算和返回\
  \ `powerOf2B(`n − 1)` 就就需要 `T2(`n − 1)`。因此，在一般情况下，`if` 语句中的比较将消耗我们 1 条指令；计算并返回 `powerOf2B(`n\
  \ − 1)` 将消耗我们 `T2(`n − 1)`；再次执行一次将消耗我们另一个 `T2(`n − 1)`；将两者相加并返回结果将消耗我们 1 条指令。因此，总时间\
