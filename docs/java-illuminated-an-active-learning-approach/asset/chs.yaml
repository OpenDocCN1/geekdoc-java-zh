  \ 客户端的输出**\n\n由于 `sedan` 对象是通过默认构造函数实例化的，其 `model` 为 `unknown`，且 `milesDriven` 和\
  \ `gallonsOfGas` 设置了默认值。另一方面，`suv` 对象反映了传递给重载构造函数的值。\n\n因此，我们的 `Auto` 类版本 2 让客户端能够实例化并获取实例变量的值。但我们仍然需要给客户端改变实例变量的方法。为了这一点，我们提供了变器方法（mutator\
  \ methods）。\n\n![img](img/00004.jpeg) **软件工程提示**\n\n为客户端能够检索值的实例变量提供 `public` 访问器方法。每个访问器方法返回相应实例变量的值。\n\
  \n## 7.6 编写变器方法（Mutator Methods）\n\n正如我们讨论过的，我们将实例变量声明为 `private` 以封装类的数据：只允许类方法直接设置实例变量的值。因此，通常为客户端可以更改的实例变量提供\
  \ `public` **变器**方法。\n\n变器方法的通用形式如下：\n\n![img](img/00752.jpeg)\n\n我们将变器方法声明为 `public`，以便客户端程序可以使用这些方法更改实例变量的值。我们不返回值，因此将返回类型声明为\
  \ `void`。按照习惯，每个变器方法的名字以小写单词 `set` 开头，后跟首字母大写的实例变量名。显而易见，方法参数的数据类型应与被设置的实例变量的数据类型匹配。\n\
  \n尽可能，你的变器方法体应该验证客户端传递的参数值。如果参数值有效，变器会将该值赋值给实例变量；否则，一种方案是变器向系统错误设备（`System.err`）打印消息，默认是\
  \ Java 控制台。\n\n示例 7.5 显示了 `Auto` 类版本 3。\n\n![img](img/00004.jpeg) **软件工程提示**\n\n\
  为你想要允许客户端更改的实例变量提供变器方法。如果传递方法的参数不是实例变量的有效值，一种方案是变器方法向 `System.err` 打印消息并保持实例变量的值不变。\n\
  \n![img](img/00753.jpeg)\n\n![img](img/00754.jpeg)\n\n![img](img/00755.jpeg)\n\n\
  **示例 7.5      *Auto* 类，版本 3**\n\n\n\n\n\n`milesDriven`（第 61–73 行）和 `gallonsOfGas`（第\
  \ 75–87 行）实例变量的变器方法（mutator methods）会验证参数值是否大于 0。如果不是，这些方法将向 `System.err` 打印消息并且不实例变量的值。在我们\
  \ `Auto` 类的之前的版本中，构造函数执行相同的验证。现在既然变器方法执行了此验证，构造函数就可以调用变器方法。通过这种方式，我们消除了重复代码；每个参数值的验证只在一个地方进行。如果稍后我们决定对任何实例变量的值实施其他限制，我们只需要更改一处代码。通过这种方式，客户端无论是在实例化对象时还是调用变器方法，都无法为\
