  \ | 技术写作 |\n| | 题 54 |\n\n### 5.4 使用 *if/else if* 进行选择\n\n`if` 语句的最后形式适用于数据属于两个以上互斥的类别，并且每个类别要执行的适当指令也不同。对于这种情况，使用了\
  \ `if/else if` 语句。\n\n```java\nif (grade >= 90) {\n    message = \"A\";\n} else\
  \ if (grade >= 80) {\n    message = \"B\";\n} else if (grade >= 70) {\n    message\
  \ = \"C\";\n} else if (grade >= 60) {\n    message = \"D\";\n} else {\n    message\
  \ = \"F\";\n}\n```\n\n注意，可以使用两个连续的 `if` 语句，如下：\n\n```java\nif (grade >= 90) {\n\
  \    message = \"A\";\n}\nif (grade >= 80) {\n    message = \"B\";\n}\nif (grade\
  \ >= 70) {\n    message = \"C\";\n}\nif (grade >= 60) {\n    message = \"D\";\n\
  } else {\n    message = \"F\";\n}\n```\n\n然而，如果第一个条件 `(grade >= 90)` 为假，则第二个条件 `(grade\
  \ >= 80)` 必须为真。因此 `if/else` 简化了我们的处理，并避免了在只有一个条件可能为真的情况下测试两个条件。\n\n### *if/else*\
  \ 语句\n\n`if/else` 语句的控制流如图 5.8 所示。\n\n![img](img/0035.jpeg)\n**图 5.8 示例 5.3 在 *grade*\
  \ >= 60 时的输出**\n\n`if/else if` 语句的控制流如图 5.9 所示。\n\n![img](img/0039.jpeg)\n**图 5.9\
  \ 示例 5.3 在 *grade* < 60 时的输出**\n\n注意，可以使用两个连续的 `if` 语句，如下：\n\n```java\nif (grade\
  \ >= 90) {\n    message = \"A\";\n}\nif (grade >= 80) {\n    message = \"B\";\n\
  }\nif (grade >= 70) {\n    message = \"C\";\n}\nif (grade >= 60) {\n    message\
  \ = \"D\";\n} else {\n    message = \"F\";\n}\n```\n\n然而，如果第一个条件 `(grade >= 90)`\
  \ 为假，则第二个条件 `(grade >= 80)` 必须为真。因此 `if/else` 简化了我们的处理，并避免了在只有一个条件可能为真的情况下测试两个条件。\n\
  \n### 常见陷阱\n\n在 `if/else` 语句中，不要为 `else` 指定条件。\n\n![img](img/0034.jpeg)\n\n`if/else\
  \ if` 语句适用于存在两个以上互斥的情况。示例 5.4 展示了一个根据数字分数翻译分数的 Java 程序。\n\n```java\nif (grade >=\
  \ 90) {\n    message = \"A\";\n} else if (grade >= 80) {\n    message = \"B\";\n\
  } else if (grade >= 70) {\n    message = \"C\";\n} else if (grade >= 60) {\n   \
  \ message = \"D\";\n} else {\n    message = \"F\";\n}\n```\n\n![img](img/0036.jpeg)\n\
  **示例 5.4 使用 *if/else if* 选择**\n\n![img](img/0037.jpeg)\n**图 5.4 使用 *if/else if*\
  \ 选择**\n\n### 5.5 连续和嵌套 *if/else* 语句\n\n当你需要在一个 `if` 语句的处理结果后才能评估下一个条件时，你可以以连续或嵌套在其他\
  \ `if` 语句中的方式编写多个 `if` 语句。\n\n#### 5.5.1 连续 *if/else* 语句\n\n***寻找最小值或最大值***\n\n\
  为了演示连续 *if* 语句，让我们来看三个数中最小数的问题。\n\n\n\n\n\n我们可以使用多个顺序的 `if` 语句。首先，我们找到前两个数字中较小的一个，然后找到该结果与第三个数字之间的较小值。该应用程序的伪代码如下：\n\
  \n![img](img/00441.jpeg)\n\n将该伪代码翻译为 Java，我们得到了示例 5.5 中的程序，它提示用户输入三个整数，并输出这三个数中最小的一个。在这个程序中，我们使用了两个\
  \ `if` 语句。第一个 `if` 语句（第 23–26 行）使用 `if/else` 语句找到前两个整数中较小的一个，并将该值存储在变量 `smallest`\
  \ 中。然后，第二个 `if` 语句（第 28–29 行）将第三个整数与 `smallest` 中的值进行比较。在第二个 `if` 语句中，我们没有使用 `else`\
  \ 子句，因为我们只有在条件为 `true`（即第三个数字小于 `smallest`）时才需要更改 `smallest` 中的值。否则，最小值已经存储在 `smallest`\
  \ 中了。\n\n![img](img/00442.jpeg)\n\n**示例 5.5 使用顺序 `if` 语句的应用程序**\n\n![img](img/00443.jpeg)\n\
  \n**图 5.10 示例 5.5 的输出**\n\n当使用 6、7 和 5 作为三个整数运行示例 5.5 中的程序时，输出结果所示图 5.10。\n\n还有一点。代码只检查其中一个数字是否小于另一个数字。如果其中两个或多个数字相等会怎样？代码仍然有效！我们只需要找到最小值；我们并不在乎是哪一个变量持有该最小值。\n\
  \n### 5.5.2 嵌套 `if/else` 语句\n\n`if` 语句可以写在另一个 `if` 语句的真块或假块中。这些被称为嵌套 `if` 语句。通常情况下，当除了第一个\
  \ `if` 语句的结果外还需要更多信息时，我们会嵌套 `if` 语句。\n\n嵌套 `if` 语句产生的一个困难是，要指定哪个 `else` 子句与哪个 `if`\
  \ 语句配对，特别是当某些 `if` 语句带有 `else` 子句而另一些没有时。编译器会将任何 `else` 子句与最前一个还没有 `else` 子句的 `if`\
  \ 语句匹配。如果这种匹配不是你想要的，你可以使用大括号来指定所需的 `if/else` 配对。\n\n在在这段代码中，我们有一个 `if` 语句嵌套在另一个\
  \ `if` 语句中。\n\n![img](img/00444.jpeg)\n\n如果不使用大括号，整个第二个 `if` 语句将第一个条件 `(x == 2)`\
  \ 的真块，而 `else` 与第二个条件 `(y == x)` 配对，因为这是最近的、没有 `else` 的 `if` 条件。\n\n然而，我们可以通过使用大括号强制\
  \ `else` 子句与第一个条件配对，如下：\n\n![img](img/00445.jpeg)\n\n添加大括号后，`if` 条件 `(y == x)` 连同其真块变成了条件\
  \ `(x == 2)` 的完整真块，而 `else` 子句现在属于第一个 `if` 条件 `(x == 2)`。\n\n为什么我们不能只通过调整缩进来表示我们的意思呢？记住，缩进是为了提高人类代码的可读性。编译器忽略缩进，而是遵循\
  \ Java 的语法规则。\n\n#### 悬悬 else\n\n一个常见的错误是编写与任何 `if` 条件都不匹配的 `else` 子句。这被称为**悬悬 else\
  \ (dangling else)**。例如，以下代码包含三个 `else` 子句但只有两个 `if` 条件，将产生此编译器错误：\n\n![img](img/00446.jpeg)\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**\n\n确保所有 `else` 子句都与一个 `if` 条件匹配。编写与 `if` 条件不匹配的\
  \ `else` 子句将产生**没有 if 的 else (’else’ without ‘if’)** 编译器错误。\n\n为了一个更复杂且更实际的嵌套 `if`\
  \ 语句示例，让我们生成一个 1 到 10 之间的随机数。生成随机数后，我们将提示用户猜测。首先，我们验证猜测是否在 1 到 10 之间。如果不是，我们将打印错误信息。否则，我们将检查用户是否猜中了数字。如果是，我们将打印祝贺信息。如果用户没有猜中数字，我们将显示该数字，然后判断猜测是否接近。我们将“接近”定义为在三个数字以内。我们将打印一条消息告知用户猜测是否接近，然后祝愿用户下次好运。该程序的伪代码如下：\n\
  \n![img](img/00447.jpeg)\n\n该伪代码使用了三个嵌套的 `if` 语句；第一个语句确定猜测是否在请求的数字范围内。如果不是，我们就打印一条消息。否则，第二个\
  \ `if` 语句测试用户是否猜中了秘密数字。如果是，我们打印祝贺信息。如果不是，我们打印秘密数字，我们最后一个嵌套的 `if` 语句将判断猜测是否接近。\n\n\
  ![img](img/00448.jpeg)\n\n**示例 5.6 嵌套 `if` 语句**\n\n![img](img/00449.jpeg)\n\n**图\
  \ 5.11 示例 5.6 的输出**\n\n当使用 6、7 和 5 作为三个整数运行示例 5.6 中的程序时，输出结果所示图 5.11。\n\n### 5.6\
  \ `if/else` 语句的测试技术\n\n当应用程序使用 `if/else` 语句时，控制流取决于输入。对于一个输入值，应用程序可能会执行真块，而对于另一个输入值，它可能会执行假块。显然，运行一次应用程序不能保证程序是正确的，因为如果执行了真块，那么假块就没有被执行，因此没有被测试。同样，如果执行了假块，那么真块就没有被执行，因此没有被测试。\n\
  \n为了测试应用程序的正确性，我们可以尝试测试所有执行路径。为此，我们制定一个**测试计划**，包括使用不同值运行应用程序以执行所有语句。\n\n例如，判断整数是正是负的应用程序可能有如下代码：\n\
  \n![img](img/00450.jpeg)\n\n我们可以通过运行运行应用程序来测试这段代码，第一次输入值 1，第二次输入值 −1。我们看到这两个值的结果是正确的：1\
  \ 是正数，−1 是负数。我们成功执行了所有语句，但我们能确定程序是正确的吗？如果我们输入值 0（它既不是正整数也不是负整数）会怎样？按照目前的写法，我们的程序判断\
  \ 0 是负数，这是错误的。\n\n为了修正程序，我们应该添加另一个条件 `(x < 0)`，以便我们将 0 与负数分开。那么代码将变为：\n\n![img](img/00451.jpeg)\n\
  \n\n\n\n现在，如果我们用输入值 −1、1 和 0 重新测试程序，我们为这些每个值都得到了正确的结果。\n\n另一种测试方法是将程序视为“黑盒”，也就是说假设程序的内部工作机制对我们来说是未知且不可不可知的。我们仅根据程序的规范来制定测试计划，并开发出能够从逻辑上测试程序的输入值。因此，如果我们的规范是判断一个整数是正是负，我们推断出应该使用负数、正数以及特殊情况\
  \ 0 作为输入运行程序。\n\n这两种测试方法结合使用，可以确保程序的正确性。\n\n![img](img/00004.jpeg) **软件工程贴士**\n\n\
  在测试程序时，请开发能够测试所有执行路径的输入值，并确认逻辑是否实现了程序的规范。\n\n## 5.7 编程活动 1：使用 `if/else`\n\n在本次活动中，你将编写一个\
