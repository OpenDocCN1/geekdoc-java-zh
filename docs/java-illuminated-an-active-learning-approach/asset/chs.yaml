  \ `www`）。因此，因为我们的域名是 `[www.jbpub.com](http://www.jbpub.com)`，我们所有的包名都以 `com.jbpub`\
  \ 开头。对于这个包，我们追加了点和 `af`。包名的每个部分都代表一个目录。因此，我们的包将存储在 `com\\jbpub\\af` 或 `com/jbpub/af`\
  \ 目录结构中，取决于操作系统。在 `import` 语句中，包名中的点以平台无关的方式分隔了目录名。\n\n创建包的下一步是创建你想放置包的目录。以后，随着你创建更多的类，你可以将这些类放在同一个包中，或者在相同或不同的目录下创建一个新包。\n\
  \n对于我们的包，我们创建了 `com` 目录，然后创建了子目录 `jbpub`，以及在 `jbpub` 目录中创建了 `af` 子目录。\n\n下一步是将源文件复制到包目录并进行编译。我们将\
  \ `ConsoleIn.java` 源文件复制到 `af` 目录并对其进行了编译。\n\n为了让编译器找到你刚刚创建的包，最后一步是修改你的 `CLASSPATH`\
