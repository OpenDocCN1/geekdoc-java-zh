  \n### 示例 8.17 使用选择排序\n\n![img](img/00999.jpeg)\n\n#### 图 8.22：使用选择排序\n\n### 8.6.3\
  \ 插入排序\n\n与选择排序一样，插入排序的名字源于用于排序数组的算法。插入排序的基本方法是对元素，就像扑牌玩家在手中按顺序排列纸牌一样。玩家一次插入一张纸牌，使得手左侧的纸牌始终保持排序状态；手右侧的纸牌尚未插入到手部的排序部分。如图\
  \ 8.23a 所示，左侧的三张黄色纸牌（3、5 和 9）已经按顺序排列好，而右侧的白色纸牌（4、2 和 8）尚未插入到它们正确的位置。请注意，左侧“已排序”的黄色纸牌并不一定处于它们的最终位置。\n\
  \n我们现在要插入 4。我们首先将其与 9 比较；由于 4 小于 9，我们将 9 向右移动（图 8.23b）。然后我们将 4 与 5 比较；由于 4 小于 5，我们将\
  \ 5 向右移动（图 8.23c）。接着我们将 4 与 3 比较；由于 4 大于 3，3 留在原地，我们将 4 插入到空位（图 8.23d）。我们现在准备好插入下一张纸牌\
  \ 2。\n\n![img](img/01000.jpeg)\n\n#### 图 8.23a：下一张要插入的纸牌是 4\n\n![img](img/01001.jpeg)\n\
  \n#### 图 8.23b：9 向右移动\n\n![img](img/01002.jpeg)\n\n#### 图 8.23c：5 向右移动\n\n![img](img/01003.jpeg)\n\
  \n#### 图 8.23d：插入了 4\n\n要按升序排序一个包含 `n` 个元素的数组，插入排序实现了一个双层循环：\n\n![img](img/00009.jpeg)\n\
  \n外层循环执行 `n – 1` 次，遍历从索引 1 到 `n – 1` 的数组元素。如果变量 `i` 代表外层循环的计数器，数组可以看作由三部分组成：\n\n\
  从索引 0 到 `i – 1` 的排序子数组（尽管元素可能尚未处于最终位置），\n\n我们当前正在插入的数组元素（索引为 `i`），\n\n未排序部分（从索引\
  \ `i + 1` 到 `n - 1`）。\n\n\n\n\n外层循环计数器 `i` 递增，其值为 4，这导致外层循环终止。所有元素已插入；数组现在已排序。\n\
  \n示例 8.18 展示了我们的 `Sorter` 类，其中在 43–63 行实现了插入排序算法。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\
