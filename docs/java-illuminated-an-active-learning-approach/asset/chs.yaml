  | **14.14.8** | 技术性写作：第 72  |\n\n## 14.13 章节总结\n\n![img](img/00009.jpeg)数据结构是程序存储在内存中的数据的组织机制。\n\
  \n![img](img/00009.jpeg)链表是由像链条一样连接的节点组成的数据结构。\n\n![img](img/00009.jpeg)节点的典型实例变量是指向存储在节点中的数据的对象引用，以及一个指向列表中下一个节点的节点引用。\n\
  \n![img](img/00009.jpeg)由于每个节点都有一个指向下一个节点的引用作为实例变量，链表只需要一个实例变量，即它的第一个节点，通常被称为 `head`。通常，为了方便起见，我们还会包含一个表示列表中项目数量的实例变量。\n\
  \n![img](img/00009.jpeg)链表可以一次扩展一个节点，从而优化了内存的使用。\n\n![img](img/00009.jpeg)栈是一种按照后进先出（LIFO）原则组织的数据结构。\n\
  \n![img](img/00009.jpeg)队列是一种按照先进先出（FIFO）原则组织的数据结构。\n\n![img](img/00009.jpeg)链表可以用来表示栈。在这种情况下，我们通过在列表开头插入项来推入栈（push）。我们通过删除列表的第一个项来弹出（pop）。\n\
  \n![img](img/00009.jpeg)链表也可以用来表示队列。在这种情况下，我们通过在列表末尾插入来入队（enqueue）。我们通过删除列表的第一个项来出队（dequeue）。由于我们在列表末尾插入，因此拥有一个表示列表最后一个节点的实例变量是有用的，它通常被称为\
  \ `tail`。\n\n![img](img/00009.jpeg)如果我们预先知道栈中同时存储的最大项目数量，栈也可以用数组来表示。一个名为 `top` 的实例变量表示最后推入栈的最后一个数组元素的索引。除非栈为空，否则我们就弹出（或删除）该元素。除非栈已满，否则我们就在索引\
  \ (`top` + `1`) 处向栈中推入（或插入）一个新元素。\n\n![img](img/00009.jpeg)如果我们预先知道队列中同时存储的最大项目数量，队列也可以用数组来表示。队列通常用循环数组实现。两个名为\
  \ `front` 和 `back` 的实例变量表示插入队列的第一个和最后一个元素的索引。除非队列为空，否则我们就删除索引 `front` 处的元素。除非队列已满，否则就在索引\
  \ (`back` + `1` % `QUEUE_SIZE`) 处入队（或插入）一个新元素。\n\n![img](img/00009.jpeg)在封装数据结构的类中，如果我们无法返回或找不到对象，返回对象的可能会抛出（`throw`）异常。事实上，当找不到要找的对象时，抛出\
  \ `throw`）异常比返回 `null` 更好。\n\n![img](img/00009.jpeg)链表可以按升序或降序排序。链表对象的实例变量之一用作排序列表元素的键。`insert`\
  \ 方法找到插入项合适的位置，以保持列表的排序状态。\n\n![img](img/00009.jpeg)链表的一种变体包括双向链表。在这种情况下，每个节点包含三个实例变量：一个表示数据的对象，一个表示下一个节点的节点引用，以及另一个表示上一个节点的节点引用。后者使我们能够在需要时在列表中回溯，而在单向链表中，我们只能向正方向遍历列表。然而，实现这样的列表要困难得多；每个方法，特别是\
  \ `insert` 和 `delete`，都需要更多的操作来维护节点间的这些双向链接。\n\n![img](img/00009.jpeg)链表可以实现泛型；当实例化此类链表时，客户端指定了列表项的类。\n\
  \n![img](img/00009.jpeg)链表也可以被递归定义。递归定义的链表由两个元素组成：`first`（链表中的第一个项）和 `rest`（由链表其余部分组成的链表）。\n\
