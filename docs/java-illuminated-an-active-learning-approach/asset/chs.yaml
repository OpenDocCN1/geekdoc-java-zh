  \n### 12.9 组合框\n\n`JComboBox` 实现了一个下拉列表。当组合框出现时，显示一个项目和一个带有向下箭头的按钮。当用户按下按钮时，组合框会“下拉”打开并显示项目列表，带有滚动条查看更多项目。用户可以从列表中选择一个项目。\n\
  \n当用户选择一个项目时，列表关闭并显示选中的项目。`JComboBox` 触发 `ItemEvent`，因此事件处理器必须实现 `ItemListener`\
  \ 接口，并提供 `itemStateChanged` 方法。\n\n\n\n\n在第 31 行，我们通过向构造函数传递 `countryList` 数组来实例化\
  \ `countries`（即我们的 `JComboBox`）。为了设置用户在组合框打开时看到的最大项目数，我们调用了 `setMaximumRowCount`\
  \ 方法并传入参数 4（第 32 行）。在第 33 行，我们使用 `setSelectedIndex` 方法通过程序方式选择了第三个项目 `Italy`。为了让展示的食物样品与组合框的选择相匹配，我们使用\
  \ `foods` 数组的第三个元素初始化 `foodImage` 标签（第 34 行）。\n\n注意，我们的国家列表是按字母顺序排列的，以便于查找目标国家。在这种情况下，我们只有五个国家；然而，如果列表很长，字母顺序排序使用户轻松地在列表中找到特定项目。另一种选项是先显示最可能的选择，然后按字母顺序显示剩余项目。例如，如果大多数用户居住在美国，你可以将“USA”列在列表首位，其余国家从列表的第二个位置开始按字母顺序排列。\n\
