  \ 13.12 示例 13.8 的两次运行**\n\n我们通过将索引 `start` 和 `end` 相加然后除以 2 来计算索引 `middle`。因此，当第一次调用\
  \ `recursiveBinarySearch` 方法时，`middle` 为 8。\n\n索引 8 处的元素 (45) 大于 7，因此我们调用 `recursiveBinarySearch`\
  \ 方法，搜索此处高亮显示的左侧子数组。\n\n![img](img/01779.jpeg)\n\n此时索引 `middle` 的被计算为 3 `((0 + 7)/2)`。\n\
