  ... (其余部分由于原文混乱，此处核心逻辑已翻译如下：) \n\n[content]\n与鼠标事件相关的第二个接口是 `MouseMotionListener`，它包含两个方法：`mouseMoved`\
  \ 和 `mouseDragged`，如 表 12.22 所示。拖动鼠标被定义为用户在按下鼠标按钮但不释放的情况下移动鼠标。\n\n#### 表 12.22  *MouseMotionListener*\
  \ 接口方法 API\n\n| ***MouseMotionListener* 接口方法 API** | |\n\n| `public void mouseMoved(MouseEvent\
  \ e)`当鼠标移动到组件上时调用 | |\n| `public void mouseDragged(MouseEvent e)`当在组件上按下鼠标按钮并拖动鼠标时调用\
  \ | |\n\n为了说明如何结合 `MouseEvent` 类使用 `MouseMotionListener` 接口，我们将构建一个与寻艇游戏相似的简单寻宝游戏。宝藏隐藏在窗口的某处，用户将尝试寻找它，但不是通过点击鼠标按钮，而是通过在窗口内移动鼠标。根据鼠标距离宝藏的远近，我们将在鼠标位置显示消息，以便用户能够找到宝藏并赢得游戏。\n\
  \n图 12.16 显示了寻宝游戏的 UML 图。\n\n![img](img/01622.jpeg)\n\n#### 图 12.16\n\n#### 寻宝游戏的\
  \ UML 图\n\n再次，我们首先编写模型（Model），即封装我们寻宝游戏功能性的类（示例 12.12）。它允许我们创建指定大小的游戏、处理游戏过程、确定游戏何时结束并显示游戏状态。\n\
  \n实例变量 `status`（第 16 行）是一个 `String` 类型，用于存储玩家位置相对于于宝藏位置的状态。我们还定义了一个 `boolean` 类型的标志变量\
  \ `gameOver`，其初始值为 `false`（第 17 行）；当用户找到宝藏时，我们将其改为 `true`。\n\n在构造函数中，我们随机生成宝藏中心的\
  \ `(x, y)` 坐标，并将生成的值存储在实例变量 `xCtr` 和 `yCtr` 中（第 27-30 行）。\n\n`play` 方法（第 49-76 行）设置了\
  \ `status` 的值。如果玩家离宝藏很远，我们将 `status` 设置为“Cold”。随着用户越来越接近宝藏，该值变为“Lukewarm”、然后是“Warm”、最后是“Hot”，当玩家找到宝藏时最终变为“Found”。如果找到了宝藏，我们将\
  \ `gameOver` 设置为 `true`（第 59 行）。\n\n与寻艇游戏类似，`draw` 方法（第 78-96 行）绘制游戏中发生的情况。我们首先测试\
  \ `status` 的值是否为“Found”（第 87 行）。如果是，说明已经找到了宝藏，我们通过绘制它来揭示位置（第 89-92 行）。如果还没有找到宝藏，我们在当前鼠标位置显示\
  \ `String status`（第 95 行），该位置由发送给 `draw` 方法的参数 `x` 和 `y` 决定。\n\n### 示例 12.12  TheThe\
  \ *TreasureHunt* 类\n\n示例 12.13 显示了 `TreasureHuntViewController` 类。与寻艇示例一样，它结合了视图和控制器。构造函数（第\
  \ 17-32 行）定义并显示了原始视图。`mouseMoved`、`mouseDragged` 和 `paint` 方法（分别位于 34-43 行、45-46\
  \ 行和 48-53 行）构成了控制器。模型由实例变量 `hunt`（第 14 行）表示，我们在其中存储了作为参数传递给构造函数的 `TreasureHunt`\
  \ 对象（第 14 行）。\n\n\n\n\n我们一直在使用 `FlowLayout` 布局管理器，因为它最易用。`FlowLayout` 布局管理器从左到右添加新组件，根据需要创建任意行。然而，一个问题是，如果用户调整窗口大小，组件将重新排列以适应新的窗口尺寸。通常，GUI\
  \ 可能非常复杂并使用许多组件，所有组件都需要经过组织，以便在用户调整窗口大时，用户界面依然有效且易于使用。两种可以让我们更好地控制窗口内组件布局的有用布局管理器是\
  \ `GridLayout` 和 `BorderLayout`。\n\n无论使用哪种布局管理器，我们的应用程序构造函数仍然执行以下设置操作：\n\n![img](img/00009.jpeg)声明并实例化布局管理器\n\
  \n![img](img/00009.jpeg)使用 `Container` 类的 `setLayout` 方法设置 `JFrame` 内容面板的布局管理器\n\
  \n![img](img/00009.jpeg)实例化组件\n\n![img](img/00009.jpeg)使用 `Container` 类的任一 `add`\
  \ 方法将组件添加到内容面板中\n\n`GridLayout` 将容器组织为网格。我们可以将布局可视化为一个由行和列中等大小单元格组成的表格。每个单元格可以包含一个组件。先添加到容器的第一个组件放在第一行的第一列；第二个组件放在第一行的第二列，依此类推。当一行中的所有单元格都填满时，添加的下一个组件将放在下一行的第一个单元格中。\n\
  \n表 12.23 显示了 `GridLayout` 类的两个构造函数。\n\n**表格 12.23 `GridLayout` 构造函数**\n\n| **构造函数**\
  \ | **类** | **构造函数** |\n| :--- | :--- | :--- |\n| `GridLayout` | `GridLayout(int\
  \ numberOfRows, int numberOfColumns)` 创建由参数指定的行数和列数的网格布局。 |\n| `GridLayout` | `GridLayout(int\
  \ numberOfRows, int numberOfColumns, int hGap, int vGap)` 创建具有指定行数和列数的网格布局，列与列之间的水平间距为\
  \ `hGap` 像素，行与行之间的垂直间距为 `vGap` 像素。水平间距也会放置在左边缘和右边缘，垂直间距也会放置在顶部和底部边缘。 |\n\n为了专注于如何使用\
  \ `GridLayout`，我们保持下一个示例尽可能简单，并且不使用 MVC 架构。示例 12.15 显示了如何使用 `GridLayout` 显示棋盘。棋盘上每个方格的位置可以通过一个字母和一个数字来标识。从白方的角度来看，右下角的格子是\
  \ h1，从黑方的角度来看，右下角的格子是 a8。当用户点击棋盘上的方格时，我们的应用程序会显示其位置。我们展示的棋盘方向就像白方在左侧，黑方在右侧。\n\n\
  名为 `squares` 的 `JButtons` 二维数组（第 12 行）组棋盘。我们使用两个数组，一个名为 `letters` 的 `Strings` 类型，另一个名为\
  \ `digits` 的 `ints` 类型，来组成每个方格的位置（第 13–15 行）。方格的位置由一个代表行（a–h）的字母和一个代表列（1–8）的数字组成。当用户点击棋盘上的一个按钮时，我们将该按钮的文本设置为其在棋盘上的位置，通过从\
  \ `letters` 和 `digits` 数组中的数据组合得出名称。\n\n在第 23 行，我们使用带有两个参数的构造函数实例化了一个 `GridLayout`\
  \ 匿名对象，这两个参数代表网格的行数和列数，这里是 `letters` 数组的元素个数和 `digits` 数组的元素个数。仍在第 23 行，我们将 `GridLayout`\
  \ 匿名对象作为 `setLayout` 方法的参数传递。因此，组件将逐单元格地添加到 8x8 的网格中，在开始下一行之前会填满每一行。\n\n在第 27 行，我们声明并实例化监听器\
  \ `bh`，这是一个 `ButtonHandler` 对象引用。由于我们对与按钮相关的事件感兴趣，我们的私有内部类 `Button-Handler private`\
