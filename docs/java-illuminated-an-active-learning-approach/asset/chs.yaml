  \ 显示了运行 `DVDWinnersClient` 程序的可能输出。\n\n![img](img/00004.jpeg) **软件工程技巧**\n\n当你编写一个使用不同数据类型的对应项目列表的类时，请考虑使用并行数组。\n\
  \n![img](img/00986.jpeg)\n\n**图 8.21 示例 8.15 的输出**\n\n## 8.6.2 选择排序\n\n前述 `winners`\
  \ 数组中的成员 ID 是随机排序的，因此当成员不是中奖者时，我们的 `findWinners` 方法需要查看数组中的每个元素，才能发现我们要找的 ID 不在数组中。这是无效的，因为大多数成员都不是中奖者。数组越大，顺序查找就越低效。我们可以通过将元素按数字顺序排列来简化搜索，这被称为\
  \ `sorting the array`（数组排序）。一旦数组排序，我们就可以各种算法来加速搜索。在本章的后面部分，我们将讨论如何搜索排序后的数组。\n\n\
  在本章中，我们介绍了两种基础排序算法：`Selection Sort`（选择排序）和 `Insertion Sort`（插入排序）。\n\n选择排序的名称源于用于排序数组的算法。我们在数组中选择一个最大的元素并将其放在数组的末尾。然后我们选择下一个最大的元素，并将其放在数组的倒数第二个位置。为了做到，我们将数组的未排序部分视为\
  \ `subarray`（子数组）。我们反复在当前子数组中选择一个最大值并将其移动到子数组的末尾，通过消除已处于排序位置的元素来考虑一个新的子数组，直到子数组仅剩一个元素。此时，数组已排序。\n\
  \n用更正式的术语，我们可以这样表述此处以伪代码呈现的选择排序算法：\n\n要升序对一个包含 `n` 个元素的数组进行排序：\n\n1. 将 `m` 个元素视为一个\
  \ `subarray`，其中 `m = n`。\n2. 找到子数组中最大的元素。\n3. 将最大的元素与子数组的最后一个元素交换。\n4. 通过消除最后一个元素考虑一个新的子数组。\n\
  5. 重复步骤 2 到 4，直到子数组只有一个元素。\n\n例如，让我们对以下数组进行选择排序。开始时，整个数组都是子数组（如阴影所示）。\n\n![img](img/00987.jpeg)\n\
  \n我们发现索引 1 处是最大的元素 26。我们将元素 1 移动到子数组的末尾。\n\n![img](img/00988.jpeg)\n\n新子数组中索引 0\
  \ 处是最大的元素 17。通过交换索引 0 和 2，将元素 0 移动到子数组的末尾。\n\n![img](img/00989.jpeg)\n\n新子数组中索引\
  \ 0 处是最大的元素 5。通过交换索引 0 和 1，将元素 0 移动到子数组的末尾。\n\n![img](img/00990.jpeg)\n\n选择排序中的关键操作是交换数组元素。在继续之前，让我们检查交换数组元素的算法。\n\
  \n交换两个值，我们需要定义一个与要交换的值类型相同的临时变量。该变量将临时存储一个元素的值，以便在交换过程中不会丢失该值。\n\n此处以伪代码呈现的算法涉及三个步骤：\n\
  \n交换元素 `a` 和 `b`：\n\n1. 将元素 `a` 的值赋给临时变量。\n2. 将元素 `b` 的值赋给元素 `a`。\n3. 将临时变量中的值赋给元素\
  \ `b`。\n\n例如，如果一个名为 `array` 的数组包含 `int` 元素，我们要交换索引 3 处与索引 6 处的元素，将使用以下代码：\n\n```\n\
  ![img](img/00991.jpeg)\n```这些操作的顺序至关重要；更改顺序会导致数据丢失以及数组中存储错误数据。以下说明了交换过程中每行发生的情况：\n\
  \n在执行第 1 行之前，我们的数组如下：\n\n![img](img/00992.jpeg)\n\n第 1 行将元素 3 的值赋给 `temp`。执行第 1\
  \ 行后，`temp` 的值为 33。数组未变。\n\n![img](img/00993.jpeg)\n\n\n\n\n第 2 行将元素 6 (82) 的值赋值给元素\
  \ 3。在执行第 2 行后，元素 6 和元素 3 具有相同的值。但没关系，因为我们已经将元素 3 的值保存在了 `temp` 中。\n\n![img](img/00994.jpeg)\n\
  \n第 3 行将我们存在 `temp` 中的值赋值给元素 6。在执行第 3 行后，元素 3 和 6 的值成功完成了交换。\n\n![img](img/00995.jpeg)\n\
