  \n## 10.8 接口 (Interfaces)\n\n在 Java 中，一个类只能直接继承自一个类；也就是说，一个类只能 `extend` 一个类。为了允许类从多个源继承行为，Java\
  \ 提供了**接口 (interface)**。\n\n接口通常指定类将要 `implement`（实现）的行为。接口成员可以是以下任一种：\n\n![img](img/00009.jpeg)类\n\
  ![img](img/00009.jpeg)常量\n![img](img/00009.jpeg)`abstract` 方法\n![img](img/00009.jpeg)其他接口\n\
  \n通常，接口只定义常量和 `abstract` 方法。注意，接口不能拥有实例变量。要定义接口，请使用：\n\n![img](img/0376.jpeg)\n\n\
  所有接口都是 `abstract` 的；因此，它们不能被实例化。就像接口一样，方法定义中可以省略 `abstract` 关键字。定义接口时，你还必须为字段赋值。\n\
  \n![img](img/0377.jpeg)\n\n要继承接口，类声明它 `implements` 该接口。如果类仅继承自 `Object` 类，则 `extends`\
  \ 子句是可选的。一个类可以 `implement` 多个接口，这些接口通过逗号分隔的列表指定。当类 `implements` 接口时，类必须为接口中的每个方法提供实现。\n\
  \n接口通常用于为常用任务提供规范。它们还可以用于提高代码的可用性。继承接口的类将提供接口指定方法的特化版本。例如，如果我们考虑解析字符串的通用问题，可以有两个应用程序：判断密码是否包含所需字符，以及将包含十六进制数字的字符串转换为十进制数字。在每个应用程序中，我们需要逐字符地解析字符串。图\
  \ 10.17 显示了这些应用程序使用的接口和类。在图中，我们引入了一个新的 UML 符号——菱形，它代表**组合 (composition)**，这是类之间的关系，其中一个类的对象是另一个类的实例变量。组合被称为“拥有”关系。在图中，`StringParser`\
  \ 类“拥有”一个 `StringHandler` 对象。\n\n每个应用程序都需要不同的方式处理字符串的字符。因此，将字符串的解析与每个字符的处理分开是有意义的。为此，我们创建了一个\
  \ `StringParser` 类，它包含一个 `parse` 方法，用于判断字符串的每个字符是数字、字母还是其他字符（既不是数字也不是字母）。然后 `StringParser`\
  \ 将每个字符的处理交给处理器类。我们创建了一个 `StringHandler` 接口（如示例 10.21 所示），它指定了 `StringParser` 将调用的三个方法：`processLetter`、`processDigit`\
  \ 和 `processOther`。每个处理器类都实现 `StringHandler` 接口，从而为处理数字、字母和既不是数字也不是字母的字符提供了特化方法。`StringHandler`\
  \ 接口和 `StringParser` 类共同定义了逐字符处理*字符串*的策略。\n\n![img](img/01378.jpeg)\n\n\n\n\n# 图\
  \ 10.17：字符串解析接口与类的 UML\n\n![img](img/01379.jpeg)\n\n## 示例 10.21：`StringHandler`\
  \ 接口\n\n`StringParser` 类如示例 10.22 所示。它唯一的实例变量是一个实现了 `StringHandler` 接口的类对象（第 13\
  \ 行）。第 23–38 行的 `parse` 方法接收要解析的 `String` 作为参数，并逐字符地遍历该 `String`，确定字符类型并调用 `StringHandler`\
  \ 接口的相应方法。为了判断一个字符是数字还是字母，`parse` 方法调用了 `Character` 包装类的两个 `static` 方法：`isDigit`\
  \ 和 `isLetter`，详见表 10.7。在 `StringParser` 类中拥有一个 `StringHandler` 接口的对象，使得 `StringParser`\
  \ 类可以与任何实现 `StringHandler` 接口的类复复用。\n\n## 表 10.7：`Character` 包装类的一些静态方法\n\n| `Character`\
  \ 类的有用静态方法 | 返回值 | 方法名和参数列表 |\n| :--- | :--- | :--- |\n| **boolean** | `isDigit(char\
  \ ch)` 如果 `ch` 代表“0”到“9”之间的数字，则返回 `true`；否则返回 `false`。 |\n| **boolean** | `isLetter(char\
  \ ch)` 如果 `ch` 代表“a”到“z”或“A”到“Z”之间的字母，则返回 `true`；否则返回 `false`。 |\n| **int** | `getNumericValue(char\
  \ ch)` 返回指定的 Unicode 字符 `ch` 的整数值。 |\n\n![img](img/01380.jpeg)\n\n## 示例 10.22：`StringParser`\
  \ 类\n\n现在我们准备设计一个实现 `StringHandler` 接口的专门类，带有特定的目标解析字符串。在我们的示例中，第一个应用程序处理密码的强度。强密码必须包含至少八个字符、至少一个数字和至少一个特殊字符。少于六个字符的密码被认为是弱密码；否则，我们认为密码的安全级别为中等。\n\
  \n示例 10.23 所示的 `PasswordSecurityHandler` 类实现了 `StringHandler` 接口（第 9 行）；因此它提供了 `processLetter`、`processDigit`\
  \ 和 `processOther` 方法的实现。\n\n我们定义了三个实例变量（第 11–13 行）：`length` 用于存储密码字符的数量，以及两个标志变量\
  \ `digit` 和 `otherCharacter`，用于指示密码中是否找到了数字和特殊字符。构造函数（第 15–23 行）将 `length` 初始化为\
  \ 0，并将标志变量初始化为 `false`。`processLetter` 方法（第 25–32 行）简单地增加 `length` 变量的值。`processDigit`\
  \ 方法（第 34–42 行）增加 `length`，并将 `digit` 标记设置为 `true`，表示已找到至少一个数字。同样，`processOther`\
  \ 方法（第 44–53 行）增加 `length` 并将 `otherCharacter` 标记设置为 `true`，表示已找到至少一个特殊字符。\n\n`securityLevel`\
  \ 方法（第 55–70 行）根据长度以及在处理密码时设置的 `digit` 和 `otherCharacter` 标记测试密码强度，并返回“弱”、“中等”或“强”。\n\
  \n![img](img/01381.jpeg)\n![img](img/01382.jpeg)\n![img](img/01383.jpeg)\n\n## 示例\
  \ 10.23：`PasswordSecurityHandler` 类\n\n示例 10.24 显示了一个用于解析密码的客户端程序。我们在第 12–16 行要求用户输入密码。在第\
  \ 18–19 行，我们实例化一个 `PasswordSecurityHandler` 对象并将其传递给 `StringParser` 对象的构造函数。然后我们调用\
  \ `parse` 方法（第 20 行），传入用户输入的密码。密码解析后，我们调用 `PasswordSecurityHandler` 类的 `securityLevel`\
  \ 方法并输出密码强度（第 22–23 行）。图 10.18\n![img](img/01385.jpeg)\n\n## 示例 10.24：`PasswordSecurityHandlerClient`\
  \ 类\n\n![img](img/01386.jpeg)\n\n### 图 10.18：示例 10.24 的输出\n\n对于第二个应用程序，即分析一个表示十六进制数的\
  \ `String`，我们复用了 `StringParser` 类。该应用程序判断 `String` 是否只包含有效的十六进制字符，并计算该 `String`\
  \ 所代表的十六进制值的十进制等值。\n\n## 示例 10.25：`Validator` 接口\n\n对于第二个应用程序，即分析一个表示十六进制数的 `String`，我们复用了\
  \ `StringParser` 类。该应用程序判断 `String` 是否只包含有效的十六进制字符，并计算该 `String` 所代表的十六进制值的十进制等值。\n\
  \n\n\n\n# 实践中的代码\n\n在随附的网站上，你将找到一个 Flash 视频，它逐步演示了在程序中使用继承的方法。点击链接开始视频。\n\n## 10.9\
  \ 章节总结\n\n![img](img/00009.jpeg)继承让我们将相关的类按功能顺序组织成不同的层级，这被称为层次结构。这样做的好处是我们只需要编写一次公共代码，并在多个类中复用。\n\
  \n![img](img/00009.jpeg)子类继承其父类的方法和字段。子类只能有一个直接父类，但许多子类可以继承同一个公共父类。\n\n![img](img/00009.jpeg)继承实现了类与类之间的之间的”（is\
  \ a）关系。子类的任何对象也都是父类的对象。\n\n![img](img/00009.jpeg)所有类都继承自 `Object` 类。\n\n![img](img/00009.jpeg)要指定子类继承自父类，子类在类定义中使用\
  \ `extends` 关键字，语法如下：\n\n![img](img/01394.jpeg)\n\n![img](img/00009.jpeg)子类不继承父类的构造函数或\
  \ `private` 成员。然而，父类的构造函数仍然可以从子类调用，且父类的 `private` 字段被实现为子类的字段。\n\n![img](img/00009.jpeg)要访问父类的私字段，子类需要使用父类提供的访问器（accessor）和修改器（mutator）方法。\n\
  \n![img](img/00009.jpeg)要调用父类的构造函数，子类构造函数使用以下语法：\n\n![img](img/01395.jpeg)\n\n![img](img/00009.jpeg)如果使用了该语句，它必须是子类构造函数的第一条语句。\n\
  \n![img](img/00009.jpeg)子类可以通过提供方法的新版本来重写被继承的方法。新方法的 API 必须与继承的方法完全相同。要调用被继承的方法，子类使用以下语法通过\
  \ `super` 对象引用：\n\n![img](img/01396.jpeg)\n\n![img](img/00009.jpeg)任何使用 `protected`\
  \ 访问修饰符声明的字段都会子类继承。因此，子类可以直接访问该字段，无需调用其访问器或修改器方法。\n\n![img](img/00009.jpeg)`abstract`\
  \ 类可以用于指定子类应该实现的方法 API。`abstract` 类不能实例化对象。通过在类头中包含 `abstract` 关键字，可以将一个类声明为 `abstract`。\n\
  \n![img](img/00009.jpeg)`abstract` 类通常有一个或多个 `abstract` 方法。`abstract` 方法指定方法的 API，但不提供实现。`abstract`\
  \ 方法的 API 后面跟着一个分号。\n\n![img](img/00009.jpeg)当子类继承自 `abstract` 类时，它可以为任何、所有或任的 `abstract`\
  \ 方法提供实现。如果子类没有实现父类所有的 `abstract` 方法，则子类也必须声明为 `abstract`。然而，如果子类实现了父类中所有的 `abstract`\
  \ 方法且没有声明为 `abstract`，那么该类就不是 `abstract` 的，我们可以实例化该子类的对象。\n\n![img](img/00009.jpeg)多态通过允许我们对层次结构中的任何对象使用相同的方法调用，简化了对层次结构中各种对象的处理。我们将子类的对象引用赋值给父类引用，然后使用父类对象引用进行方法调用。在运行时，JVM\
  \ 决定对象实际上属于层次结构中的哪一个类，并为该类调用适当的方法形式。\n\n![img](img/00009.jpeg)接口（Interfaces）允许类从多个源继承行为。接口成员可以是类、常量、`abstract`\
  \ 方法或其他接口。\n\n![img](img/00009.jpeg)要定义接口，使用以下语法：\n\n![img](img/01397.jpeg)\n\n\
  ![img](img/00009.jpeg)要使用接口，类头应该包含 `implements` 关键字和接口名称，语法如下：\n\n![img](img/01398.jpeg)\n\
  \n要指定子类既继承自父类又使用接口，类头应该包含 `implements` 关键字和接口名称，如下所示语法所示。\n\n![img](img/01399.jpeg)\n\
