  ## 9.1.4 为多维数组分配初始值\n\n我们可以在声明数组时通过分配初始值来实例化二维数组。要做到这一点，我们使用由逗号分隔的初始值列表来指定初始值，并将其封装在一层外部大括号中：\n\
  \n![img](img/01120.jpeg)\n\n该列表包含若干子列表，子列表之间用逗号分隔。这些子列表的数量决定了数组的行数。对于每一行，相应子列表中的值数量决定了该行的列数。因此，Java\
  \ 允许二维数组的每行具有不同数量的列。例如，在我们的 `Auto` 数组中，每个国家（行）可能可能对应着不同数量的拥有公司车的员工（列）。\n\n事实上，二维数组是“数组的数组”。二维数组的第一维是一个包含数组引用的数组，每个引用都指向一个一维数组。因此，二维数组由一个行数组组成，每行都是一个一维数组。因此，每行可以有不同数量的元素，即列。\n\
  \n例如，这条语句声明并实例化了一个整数类型的二维数组：\n\n![img](img/01121.jpeg)\n\n由于给出了两个子列表，这个二维数组有两行。第一个子列表指定了三个值，因此第一行将有三列；第二个子列表指定了四个值，因此第二行将有四列。\n\
  \n图 9.2 显示了执行上述语句后 `numbersList1` 数组的状态。\n\n![img](img/01122.jpeg)\n\n**图 9.2 实例化后的\
  \ `numbersList1` 数组**\n\n只有在声明数组时才能提供初始化列表。如果一个二维数组已经实例化，尝试使用初始化列表为数组赋值将产生编译错误。例如，这段代码：\n\
  \n![img](img/01123.jpeg)\n\n将产生编译错误。\n\n我们可以通过在列表中提供对象引用来声明并实例化一个对象数组：\n\n![img](img/01124.jpeg)\n\
  \n![img](img/01125.jpeg)\n\n这个 `Auto` 对象的数组有三行，每行两列。数组 `cars` 的元素是指向 `Auto` 对象的对象引用。\n\
  \n在大多数情况下，每行的列数是相同的。但在某些情况下，为每行设置不同数量的列是有用的。例如，大学教授 Smith 博士使用二维数组来跟踪成绩。行代表她教授的课程，列代表这些班级学生的成绩。成绩是\
  \ A、B、C、D 或 F，因此她用 `char` 元素声明该数组。Smith 博士教授了四门课程：CS1、CS2、数据库管理和操作系统。因此，她在数组中有四行。但在每门课程中，Smith\
  \ 博士的学生人数各异：CS1 有 23 名学生，CS2 有 16 名，数据库管理有 12 名，操作系统有 28 名。因此，第一行将有 23 列，第二行 16\
  \ 列，第三行 12 列，第四第四行也是最后一行将有 28 列。\n\n使用初始化列表可以很容易实例化一个每行列数不同的二维数组。但有时数据是动态获取的（例如从文件中读取），此时无法使用初始化列表。\n\
  \n要实例化一个每行列数不同的二维数组，你可以执行以下操作：\n\n![img](img/00009.jpeg)首先，实例化二维数组。\n\n![img](img/00009.jpeg)其次，将每一行实例化为一维数组。\n\
  \n对于前面的示例，我们可以使用以下代码：\n\n```\n![img](img/01126.jpeg)\n```\n\n第二条语句：\n\n```\n![img](img/01127.jpeg)\n\
  ```\n\n将二维数组 `grades` 实例化为一个具有四行的数组，且目前这些行都尚未被实例化。因为二维数组是数组的数组，`grades` 数组第一维的每个元素都是数组引用。因此，在实例化之前，`grades`\
  \ 数组第一维的每个元素的值都是 `null`。\n\n```\n![img](img/00005.jpeg) **常见错误陷阱**\n\n只有在声明二维数组时才能提供初始化列表。在数组实例化后尝试使用初始化列表赋值将产生编译错误。\n\
  \n正如之前解释过的，在二维数组中，每行都是一个一维数组。最后四条语句实例化了每一行 `grades[0]`、`grades[1]`、`grades[2]` 和\
  \ `grades[3]`，每行都有不同数量的元素（或列）。这些数组中的元素是 `char`，初始化为 Unicode 空空字符。\n\n在在本章的后后部分，我们将定义一种处理二维数组元素的通用模式，以便其适用于所有情况：每行的列数相同，或者每行的列数不同。\n\
  \n## 9.2 访问多维元素\n\n二维数组的元素通过以下语法访问：\n\n```\n![img](img/01128.jpeg)\n```\n\n`Exp1`\
  \ 是元素在二维数组中的位置，即**行索引**。`Exp2` 是元素在二维数组中的位置，即**列索引**。第一行的索引为 0，最后一行的索引小于行数。第一列的索引为\
  \ 0，最后一列的索引小于该行的列数。\n\n由于二维数组是数组的数组，二维数组的长度是数组的数量，即行数。我们使用以下语法访问行数：\n\n```\n![img](img/01129.jpeg)\n\
  ```\n\n同样，每行的长度是该行的列数（或元素数量）。要访问名为 `arrayName` 的数组的第 `i` 行的列数，使用以下语法：\n\n```\n![img](img/01130.jpeg)\n\
  ```\n\n表 9.1 总结了访问二维数组元素的语法。\n\n假设我们要分析一个家庭过去三个月的手机账单。父母 Joe 和 Jane 都有手机，孩子们 Mike\
  \ 和 Sarah 也是。我们想要计算每个人的平均账单、三个月的总和，并确定哪个家庭成员的账单最低。我们可以使用一个三行四列的 `double` 类型二维数组。行代表月份，列代表家庭成员。例如，我们可以这样映射行和列索引：\n\
  \n**表 9.1 访问二维数组**\n\n| 数组元素 | 语法 |\n| :--- | :--- |\n| 第 0 行，第 *j* 列 | `arrayName[0][j]`\
  \ |\n| 第 *i* 行，第 *j* 列 | `arrayName[i][j]` |\n| 最后一行，第 *j* 列 | `arrayName[arrayName.length\
  \ - 1][j]` |\n| 最后一行，最后一列 | `arrayName[arrayName.length - 1][arrayName[arrayName.length\
  \ - 1].length - 1]` |\n| 数组中的行数 | `arrayName.length` |\n| 第 *i* 行的列数 | `arrayName[i].length`\
  \ |\n\n行 0：7 月\n行 1：8 月\n行 2：9 月\n\n列 0：Joe\n列 1：Jane\n列 2：Mike\n列 3：Sarah\n\n我们可以将我们的二维数组可视化为\
  \ 表 9.2 所示的表格。\n\n**表 9.2 二维数组的可视化**\n\n![img](img/01131.jpeg)\n\n\n\n\n我们将数组命名为\
