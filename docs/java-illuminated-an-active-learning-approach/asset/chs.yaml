  \ 20 行，将整数读入 `age` 变量。\n\n### 6.5 使用 Scanner 进行类型安全\n\n使用 `Scanner` 读取输入的一个问题是，如果令牌不匹配预期的类型，就会产生\
  \ `InputMismatchException`。为了说明这个问题，示例 6.9 显示了用户输入字母而不是整数。\n\n![img](img/00593.jpeg)\n\
  \n**示例 6.9：读取整数**\n\n![img](img/00594.jpeg)\n\n**图 12：输入失败**\n\n我们可以通过在读取之前检查令牌是否匹配我们的输入来使程序更加健壮。`Scanner`\
  \ 类提供了 `hasNext` 方法来实现此，如表 6.4 所示。如果下一个令牌可以被视为指定的类型，`hasNext` 方法返回 `true`。例如，如果我们期望整数，可以通过调用\
  \ `hasNextInt()` 方法测试用户输入的字符是否可以解释为整数。如果该方法返回 `true`，则使用 `nextInt()` 读取值是安全的。如果下一个令牌不是我们需要的，即\
  \ `hasNextInt()` 方法返回 `false`，那么将其作为 `int` 读取将产生 `InputMismatchException`。在这种，我们需要通知用户值无效并重新提示输入。但首先我们需要清除无效输入。通过调用\
  \ `Scanner` 类的 `nextLine()` 方法可以刷新无效输入，该方法会将输入行上的剩余令牌作为 `String` 返回。然后我们只需忽略该 `String`。示例\
  \ 6.10 显示了 6.9 的修订版本，它是类型安全的，这意味着我们在读取之前保证有整数可读。\n\n在示例 6.10 的第 14 行，我们提示输入整数。然后于第\
  \ 15 行，`while` 循环条件检查用户确实输入了整数值。如果不是，通过调用 `nextLine()` 方法（第 17 行）忽略用户输入的任何。在第 18\
  \ 行，我们重新提示用户。`while` 循环持续执行，直到用户输入整数且 `hasNextInt()` 方法返回 `true`。此时，我们执行第 20 行，将整数读入\
  \ `age` 变量。注意我们需要使用 `while` 循环而不是 `if` 语句，因为 `if` 语句只会测试第一个无效值。使用 `while` 循环允许我们根据需要多次提示用户，直到输入有效值为止。图\
  \ 6.13 显示了当用户输入非整数数据，最后输入一个整数时的程序输出。\n\n\n\n\n## 表 6.4 用于测试标记的 `Scanner` 方法\n\n\
