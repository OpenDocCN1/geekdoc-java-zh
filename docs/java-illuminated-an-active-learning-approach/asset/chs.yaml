  \n（注：原文末尾存在大量重复和碎片化的句子，此处已根据提供的文本整合了逻辑流。）\n\n\n\n\n\n想象有一群大学生在春假期间合住一个公寓。他们吃完饭后，通常会将脏餐具堆在厨房水池里。又吃了一顿饭，更多的脏餐具堆在现有的餐具之上。堆的最顶端是最后被放下的那个脏盘子。很快，学生们干净餐具就用完了，有人必须开始清洗它们。他或她将从堆最顶端的盘子开始清洗，即最后放在堆上的那一个盘子。这种方法被称为**后进先出**，或者说\
  \ **LIFO**。\n\n**栈**（stack）是一种线性数据结构，以后进先出的方式组织元素。图 14.8 显示了一叠托盘。位于栈顶部的托盘是最后放在栈上的，但将最先从栈上取下。\n\
