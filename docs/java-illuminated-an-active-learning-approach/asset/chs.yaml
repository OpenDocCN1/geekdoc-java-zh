  \ 42 |\n| 12.17.5 | 调试区域题 46, 47 |\n\n## 12.4 事件处理\n\n现在我们已经知道如何在应用程序中打开窗口，也知道如何显示标签和图像。但用户目前还无法与应用程序进行交互，除了显示工具提示。我们需要添加一些交互式组件，如按钮、文本字段或列表。\n\
  \nGUI 编程使用的是**事件驱动模型（event-driven model）**，这与我们迄为止使用的过程式模型不同。这意味着通过使用 GUI，我们让用户处于交互控制。例如，我们可能会显示一些文本字段、几个按钮和一个可选列表。然后我们的程序将“静静等待”用户进行操作。当用户在文本字段中输入数据、按下按钮或从列表中选择项目时，我们的程序将做出响应，执行用户请求的功能，然后再次静静等待。这些用户操作产生了**事件**。因此，程序的处理将由响应用户与\
  \ GUI 组件交互引起的事件组成。\n\n当用户与 GUI 组件交互时，组件会**触发事件（fires an event）**。Java 提供了处理这些事件的接口、类和方法。通过这些\
  \ Java 工具，我们可以注册对特定组件发生事件感兴趣，并指定当事件发生时想要执行的代码。\n\n为了让用户通过 GUI 组件与我们的应用程序交互，我们需要执行以下功能：\n\
  \n  1.   编写事件处理类（称为**监听器/listener**）\n\n  2.  实例化实例化类的对象\n\n  3.   在一个或多个组件上注册该监听器\n\
  \n\n\n\n\n一个典型的事件处理器类实现了一个监听器接口。监听器接口继承自 `EventListener` 接口，位于 `java.awt.event`\
  \ 和 `javax.swing.event` 包。监听器接口指定了一个或多个抽象方法，事件处理器类需要实现这些方法。监听器方法接收一个事件对象作为参数，该对象代表触发的事件。\n\
  \n应用程序可以实例化多个事件处理器，而单个事件处理器可以作为多个组件的监听器。\n\n事件类是 `EventObject` 类的子类，如图 12.5 所示，它们位于\
  \ `java.awt.event` 和 `javax.swing.event` 包中。事件类从 `EventObject` 类继承了 `getSource()`\
  \ 方法，该方法返回触发事件的组件的对象引用。其 API 所示于表 12.6。\n\n因此，通过一些简单的 `if/else` 语句，注册为多个组件监听器的事件处理器可以识别出是哪一个组件触发了事件，并决定采取的操作。\n\
  \n我们可以在组件上注册的监听器类型取决于该组件触发的事件类型。表 12.7 显示了一些生成事件的用户活动、创建的事件对象类型以及事件处理器应实现的相应监听器接口。这些组件某些也可以触发其他事件。\n\
  \n为了在我们的 `ShellGUIApplication` 类中添加事件处理，我们将遵循以下模式。我们需要添加的代码已**粗体**显示。\n\n![img](img/01578.jpeg)\n\
  \n**图 12.5**\n**事件类层级结构**\n\n**表 12.6    事件类继承的 `getSource` 方法**\n\n| **返回值** |\
  \ **方法名和参数列表** |\n| :--- | :--- |\n| **Object** | `getSource()` |\n| | 返回触发事件的组件的对象引用\
  \ |\n\n**表 12.7    组件事件与监听器**\n\n![img](img/01579.jpeg)\n![img](img/01580.jpeg)\n\
  ![img](img/01581.jpeg)\n\n虽然我们可以在自己的源文件中将事件处理器类定义为 `public`，但我们通常将事件处理器声明为 GUI 类内部的\
  \ `private` 内部类。`private` 内部类定义在 `public` 类内部，并可以访问 `public` 类的所有成员。因此，将我们的事件处理器声明为\
  \ `private` 内部类可以简化我们的代码，让事件处理器可以直接访问我们应用程序的 GUI 组件。\n\n在构造函数中，我们实例化事件处理器类的对象。然后，我们通过调用\
  \ `add…Listener` 方法在组件上注册该事件处理器。表 12.8 显示了这些方法中的若干个。我们使用想要注册监听器的组件的对象引用来调用 `add…Listener`\
  \ 方法，并将实例化的事件处理器对象作为参数传递。\n\n**表 12.8    某些 `add`…`Listener` 方法**\n\n| **`add`…`Listener`\
  \ 方法 API** |\n| :--- |\n| `void addActionListener(ActionListener handler)` |\n|\
  \ `void addItemListener(ItemListener handler)` |\n| `void addListSelectionListener(ListSelectionListener\
  \ handler)` |\n| `void addMouseListener(MouseListener handler)` |\n| `void addMouseMotionListener(MouseMotionListener\
  \ handler)` |\n\n## 12.5 文本字段\n\n现在我们准备好编写第一个带有用户交互的 GUI 程序了。对于第一个示例，我们将构建一个从用户处获取\
  \ ID 和密码的 GUI。如果 ID 是“open”且密码是“sesame”，我们就显示“Welcome!”。否则，我们显示“Sorry: wrong login”。\n\
  \n我们将使用 `JTextField` 处理 ID，使用 `JPasswordField` 处理密码。为了密码的机密性，`JPasswordField` 不显示用户输入的字符。相反，每当输入一个字符，`JPasswordField`\
  \ 就会显示一个回显字符。默认的回显字符是 `*`，但如果需要，我们可以指定不同的字符。我们还将使用 `JTextArea` 来向潜在的黑客显示法律警告。`JTextField`\
  \ 和 `JTextArea` 都是 `JTextComponent` 的直接子类，后者封装了来自用户的文本输入。`JTextField` 显示单行字段，而 `JTextArea`\
  \ 显示多行字段。\n\n表 12.9 列出了这些文本类的一些实用的构造函数和方法。\n\n**表 12.9    `JTextField`, `JTextArea`\
