  \ 类的 `insert` 方法相同，并在图 14.3a](#part0020.html_f14.3a) 到 14.3d 中进行了说明。\n\n`pop` 方法与我们之前在\
  \ `PlayerLinkedList` 类中编写的 `delete` 方法不同。在栈中，我们总是删除列表中的第一个元素。因此，在实现栈的链表中，我们不根据某个实例变量的值来删除元素。我们栈的\
  \ `pop` 方法返回一个 `Player` 对象，即存储在链表头部的对象。如果我们的栈为空，我们的 `pop` 方法将 `throw` 一个 `DataStructureException`，以避免返回\
