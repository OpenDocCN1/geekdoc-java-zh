  \ 3.7 演示了 `DecimalFormat` 模式的使用以及对 `format` 方法的调用。该程序的输出如图 3.12 所示。\n\n在示例 3.7 中，第\
  \ 14 行实例化了 `DecimalFormat` 对象 `pricePattern`，它将用于打印价格。在模式中\n\n![img](img/00233.jpeg)\n\
  \n该模式的第一个字符是美元符号 ($)，我们希望它位于价格之前。0 指定了小数点左侧至少应有一个数字。如果小数点左侧没有值，则打印一个零。小数点后的两个 0\
  \ 指定了小数点右侧有两个数字。注意，即使它们是 0，小数点右侧的 0 也是要求的。\n\n## 3.9 使用 *Random* 类生成随机数\n\n随机数在程序的许多操作中非常有用，例如掷骰子、发牌、游戏中敌人的出现时间或其他对看似随机事件的模拟。\n\
  \n然而，在程序中使用随机数有一个问题：计算机是**确定性**的。本质上，这意味着给定特定的输入和特定的指令，计算机将始终产生相同的输出。因此，挑战在于如何在确定性系统中生成随机数。许多才华横溢的计算机科学家曾解决过这个问题，并提出了一些创新且复杂的解决方案。\n\
  \n`Random` 类位于 `java.util` 包中，它使用数学公式来生成数字序列，向该公式提供一个**种子**seed）值，该值决定了随机数集从序列的哪个位置开始。因此，`Random`\
  \ 类生成的数字看起来是随机的，但并非真正的随机。这些数字被称为伪随机数，它们对于我们的目的来说足够了。\n\n\n\n\n\n表 3.7 显示了 `Random`\
  \ 类的构造函数以及用于获取随机整数的方法。默认构造函数使用种子值创建一个随机数生成器。一旦创建了随机数生成器，我们就可以调用 `nextInt` 方法请求随机数。其他方法\
  \ `nextDouble`、`nextBoolean`、`nextByte` 和 `nextLong` 未在表 3.7 中显示，它们分别返回随机的 `double`、`boolean`、`byte`\
  \ 或 `long` 值。\n\n**表 3.7 Random 类构造函数和 `nextInt` 方法**\n\n| `Random` 类构造函数 |\n| :---\
  \ |\n| `Random()` 创建一个随机数生成器 |\n| `nextInt` 方法 |\n| 返回值 | 方法名和参数列表 |\n| :--- | :---\
  \ |\n| `int` | `nextInt(int number)` 返回一个从 0 到（不包含）`number` 均匀分布的随机整数 |\n\n为了演示如何使用随机数生成器，我们以掷骰子为例。为了模拟六面骰子的投掷，我们需要模拟数字\
  \ 1 到 6 的随机出现。如果我们带入参数 6 调用 `nextInt` 方法，它将返回一个 0 到 5 之间的整数。为了获取从 1 到 6 的随机分布数字，我们只需要在\
  \ `nextInt` 方法返回的值上加 1 即可。因此，如果我们实例化了一个名为 `random` 的 `Random` 对象，可以通过这种方式调用 `nextInt`\
  \ 方法生成 1 到 6 的随机数：\n\n![img](img/00235.jpeg)\n\n通常情况下，如果我们想生成从 `n` 到 `m` 的随机数，我们应该调用\
  \ `nextInt` 方法并传入所需的随机数量（`m - n + 1`），然后将序列的第一个值（`n`）加到返回值。因此，该语句生成了一个 10 到 100（包含）之间的随机数：\n\
  \n![img](img/00236.jpeg)\n\n示例 3.8 的第 18 行将生成一个 20 到 200（包含）之间的随机数。\n\n![img](img/00237.jpeg)\n\
