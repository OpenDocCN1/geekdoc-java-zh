  \ |\n\n## 9.9 章节总结\n\n![img](img/00009.jpeg)数组可以是一维的、二维的、三维的，或者更地说，是`n`-维的。\n\n\
  ![img](img/00009.jpeg)在二维数组中，每一行都是一个数组。\n\n![img](img/00009.jpeg)二维数组中的每个元素通过数组名称、行索引和列索引来访问，这些索引指向该元素在数组中的位置。\n\
  \n![img](img/00009.jpeg)一维数组的声明、实例化、初始值、索引和聚合操作等概念也适用于二维数组。\n\n![img](img/00009.jpeg)二维数组可以通过在声明时在由逗号分隔的列表嵌套列表中分配初始值来实例化。\n\
  \n![img](img/00009.jpeg)二维数组的每一行可以有不同的列数。\n\n![img](img/00009.jpeg)二维数组有一个实例变量 `length`，它存储数组的行数。\n\
  \n![img](img/00009.jpeg)二维数组的每一行都有一个实例变量 `length`，它存储该行中元素的数量。\n\n![img](img/00009.jpeg)`ArrayList`\
  \ 类实现了泛型，并是 `java.util` 包的一部分。\n\n![img](img/00009.jpeg)`ArrayList` 可以被认为是一个可扩展的对象单维数组。\n\
  \n![img](img/00009.jpeg)要定义一个持有基本数据类型元素的 `ArrayList`，请使用包装类。\n\n![img](img/00009.jpeg)随着对象的添加，`ArrayList`\
  \ 对象会根据需要自动扩展。\n\n![img](img/00009.jpeg)我们通过索引访问 `ArrayList` 的元素。\n\n![img](img/00009.jpeg)我们可以使用增强型\
  \ `for` 循环来处理 `ArrayList` 中的每个元素。\n\n## 9.10 练习、问题与项目\n\n### 9.10.1 多选择题\n\n1. 声明一个名为\
