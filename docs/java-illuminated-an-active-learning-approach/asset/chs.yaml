  \ 14.10 双向链表\n\n到目前为止，在遍历链表并寻找特定值时，我们使用 `next` 链接，因为我们没有办法回退。这个问题可以通过使用**双向链表**（doubly\
  \ linked list）来解决，它提供了两个链接：`next` 和 `previous`。为了实现双向链表，我们需要修改 `Node` 类，添加一个 `previous`\
  \ 变量以及相应的访问器和修改器方法。\n\n假设我们在 `current` 之前插入一个节点，且 `current` 既不是 `head` 也不是 `null`。我们需要执行的操作如下：\n\
  \n1. 实例化新节点。\n2. 将新节点的 `next` 字段指向 `current`。\n3. 将 `current` 之前的节点 `next` 字段指向新节点。\n\
