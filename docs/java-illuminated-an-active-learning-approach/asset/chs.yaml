  \ 方法，然后它的返回值（1）替换了方法调用。因此，语句实际上变为：\n\n![img](img/00202.jpeg)\n\n第 18 行调用 `setDay()`\
  \ 方法，该方法用于更改对象的日期值。`setDay()` 方法接受一个 `int` 参数并具有 `void` 返回值。第 18 行是一个完整的语句，因为对具有\
  \ `void` 返回值的方法进行调用是一个完整的语句。该方法更改了 `nextCentury` 对象中的日期，我们在第 19–20 行中通过打印新值来插图这一点，如图\
  \ 3.3 所示。然后，第 22 行，我们实例化另一个对象 `programmersDay`，其月、日、年分别为 9、12、2009，我们通过打印调用 `getMonth,\
  \ getDay` 和 `getYear` 方法返回的值来演示这一点。国际程序员节是每年的第 100 天（16 进制），第一个程序员节是在 2009 年的。然而，由于\
  \ 2009 年不是闰年，第 100 天实际上是 2009 年 9 月 13 日。因此在第 28 行，我们调用了 `nextDay()` 方法，它具有 `void`\
  \ 返回值，并将日期增加到下一天，然后我们打印 `programmersDay` 对象的新值。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\
  \n在调用不带参数的方法时，请记住在方法名后包含空括号。即使没有参数，括号也是必须的。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\
