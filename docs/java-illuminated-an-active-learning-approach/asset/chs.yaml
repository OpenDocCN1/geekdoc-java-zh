  \ 技术写作\n\n\n\n\n\n到目前为止，我们一直在处理单个（或称为标量的）变量；也就是说，每个变量在同一时刻只存储一个值。为了处理一组相同类型的变量——例如，统计用户输入的奇数个数——我们使用了\
  \ `while` 循环或 `for` 循环。\n\n因此，为了找到去年的平均高温，我们将使用 `for` 循环：\n\n![img](img/00882.jpeg)\n\
  \n我们定义了一个变量 `dailyTemp` 来存储数据。我们将每个温度读取到 `dailyTemp` 变量中，将温度加到总和中，然后将下一个值读取到 `dailyTemp`\
  \ 变量中，将该温度加到总和中，以此此类推，直到完成所有温度的读取和处理。每当我们读取一个新温度时，它都会覆盖上一个温度，因此在循环结束时，我们只能访问最后一个温度。\n\
  \n但假设我们想对这些温度执行多次操作。例如，我们可能想找到最高或最低温度，或者找到中位数。又或者假设在用户从菜单中选择之前，我们并不知道将执行哪些操作，或者以什么顺序执行。在这些情况下，一个标量变量\
  \ `dailyTemp` 将无法工作；我们希望同时在内存中存储所有温度。数组允许我们做到这一点，而无需单独地声明多个变量。\n\n**数组**是相同数据类型变量的序列。数据类型可以是任何\
  \ Java 原始数据类型，如 `int`、`float`、`double`、`byte`、`boolean`、`char`、`short` 或 `long`，也可以是一个类。数组中的每个变量称为**元素**，通过数组名和下标（称为**索引**）来访问，索引引用的是该元素在数组中的位置。\n\
  \n数组在许多应用中都非常有用：例如，对一组数据值进行统计，或处理存储在表格中的数据，如矩阵或游戏盘。\n\n## 8.1 数组的声明与实例化\n\n在 Java\
  \ 中，数组是作为对象实现的，因此创建一个数组需要两个步骤：\n\n1. 声明数组的对象的引用。\n2. 实例化数组。\n\n在原始类型数组中，数组中的每个元素都包含该类型的值。例如，在\
  \ `double` 数组中，每个元素都包含一个 `double` 值。在对象数组中，每个元素都是一个对象引用，存储对象的位置。\n\n![img](img/00004.jpeg)\
