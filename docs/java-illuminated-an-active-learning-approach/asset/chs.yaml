  \ 程序。Applet 通过 HTML 的 `APPLET` 标签调用。\n\n![img](img/00009.jpeg)当 applet 开始执行时，会调用\
  \ `paint` 方法。`paint` 方法用于在 applet 窗口上显示文本和图形。\n\n![img](img/00009.jpeg)`java.awt`\
  \ 包中的 `Graphics` 类提供了绘制图形（如矩形、圆形、多边形和直线）、设置绘制颜色以及在窗口中写入文本的方法。\n\n![img](img/00009.jpeg)使用\
  \ `(x, y)` 坐标系来指定窗口中的位置。每个坐标对应一个像素（或图像元素）。`x` 值指定水平位置，从 0 开始随着向窗口右移动而增加。`y` 值指定垂直位置，从\
  \ 0 开始随着向窗口向下移动而增加。\n\n![img](img/00009.jpeg)图形窗口上的所有绘制都使用当前颜色，可以使用 `setColor` 方法来更改颜色。\n\
  \n![img](img/00009.jpeg)`java.awt` 包中的 `Color` 类对象可以设置当前颜色。`Color` 类为常用颜色提供了 `static`\
  \ 常量。\n\n![img](img/00009.jpeg)可以通过使用构造函数并指定颜色的红、绿、蓝组件来实例化自定义 `Color` 对象。\n\n![img](img/00009.jpeg)扩展\
  \ `JFrame` 类的图形应用程序打开窗口并提供一个 `paint` 方法来产生图形输出。\n\n## 4.8 练习、问题和项目\n\n### 4.8.1\
