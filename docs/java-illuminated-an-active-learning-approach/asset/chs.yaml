  ## 8.5 在类中使用数组\n\n### 8.5.1 在自定义类中使用数组\n\n数组可以像其他变量一样用在自定义类内部。具体来说：\n\n- 数组可以是实例变量。\n\
  - 数组可以作为方法的参数。\n- 方法可以返回数组。\n- 数组可以是方法内部的局部变量。\n\n要定义一个接受数组作为参数的方法，使用以下语法：\n\n返回数组的方法头语法为\n\
  \n将数组作为参数传递给方法，只需使用不带括号的数组名称作为参数。\n\n在示例 8.11 中，我们定义了一个名为 `CellPhone` 的类，展示了数组在类中的用法。\n\
  \n### 常见陷阱\n\n如果你将括号视为数组数据类型的一部分，那么很容易记住在方法头（提供参数数据类型的地方）中包含括号，而在方法调用（提供数据本身的地方）中不包含。\n\
  \n## 示例 8.11 CellPhone 类\n\n我们的 `CellPhone` 类在第 9-11 行定义了三个实例变量：电话号码（名为 `phoneNumber`\
  \ 的 `String`）、每月账单（名为 `cellBills` 的 `double` 数组）以及一个名为 `MONTHS` 的常量，其值 6 代表每月账单的数量，因此如果使用默认构造函数实例化\
  \ `CellPhone` 对象，`cellBills` 数组的长度就是 6。注意，由于 `MONTHS` 是常量，我们将其设为 *public*。\n\n当你的类拥有数组实例变量时，你可能需要格外小心以确保不违反封装。\n\
  \n\n\n\n让我们从初始化数组开始。`CellPhone` 类的重载构造函数（方法头位于第 26 行）包含一个数组参数。对于基本数据类型的参数，构造函数可以简单地将参数的值赋值给实例变量。然而，正如我们所看到的，数组名称是一个对象引用，它包含了数组在内存中的位置。如果构造函数仅仅像下面的代码所示将数组参数\
  \ `bills` 赋值给我们的数组实例变量 `cellBills`：\n\n![img](img/00972.jpeg)\n\n那么 `bills` 和 `cellBills`\
  \ 将指向同一个数组。这意味着客户端仍然拥有该数组的引用，客户端可以在不通过该类的变异器方法（mutator methods）的情况下更改数组的值。例如，如果客户端执行了以下语句：\n\
