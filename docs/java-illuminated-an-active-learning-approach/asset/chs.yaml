  \ `String`）视为字符流；循环的每次迭代使用 `String` 类的 `charAt` 方法从 `String` 中提取并处理一个字符。第 10 行声明了两个\
  \ `Strings`：`original` 用于存储用户句子，`backwards`（初始化为空 `String`）用于存储用户句子的反转。第 12–13 行提示用户输入句子。第\
  \ 15 行到 18 行构成了 `for` 循环，其目的是将原始句子倒序拷贝到 `String backwards` 中。我们这样做的方法是从原始 `String`\
  \ 的最后一个字符开始复制，并在 `String` 中每次向后移动一个字符，直到我们复制了 `original` 中的第一个字符。因此，我们将循环变量初始化为\
  \ `original` 中的最后一个字符（`original.length() - 1`），并在 `String` 中每次向后移动一个字符，直到我们复制了 `original`\
  \ 中的第一个字符。循环条件（`i >= 0`）检查我们是否已到达 `original` 的开头。图 6.23 显示了该程序的执行情况。\n\n![img](img/00647.jpeg)\n\
