  \ 编程项目\n### 12.17.8 技术写作\n### 12.17.9 小组项目\n\n## 引言\n\n我们每天使用的许多应用程序都有图形用户界面，或 GUI（读作\
  \ goo-ey），它允许我们通过视觉化方式控制程序的运行。例如，Microsoft Internet Explorer 等网络浏览器提供了菜单、按钮、下拉列表和其他视觉输入输出设备，允许用户通过鼠标点击、鼠标移动以及在框中输入文本与程序交互。\n\
  \nGUI 使用户能够选择要执行的下一个功能、输入数据并设置程序偏好（如颜色或字体）。GUI 还让程序变得更容易使用，因为 GUI 对用户来说是一个熟悉的界面。如果你良好地设计程序的\
  \ GUI，用户就可以快速学会操作你的程序，在许多情况下，无需查阅文档或进行大量的培训。\n\nJava 拥有非常丰富的 GUI 类。在本章中，我们将介绍其中的一些类，以及与开发\
  \ GUI 应用程序相关的主要概念。\n\n## 12.1 使用 JFrame 的 GUI \n\n开发 GUI 应用程序的第一步是创建一个窗口。我们将使用 `javax.swing`\
  \ 包中的 `JFrame` 类为我们的 GUI 应用程序创建一个窗口。`JFrame` 类的继承层次结构如图 12.1 所示。\n\n直接继承自 `Object`\
  \ 的 `Component` 类，它代表一个可以显示的图形对象。继承自 `Component` 类的是 `Container` 类，正如其名称所示，它可以包含其他对象。这很好，因为我们希望向窗口中添加\
  \ GUI 组件。继承自 `Container` 类的 `Window` 类可用于创建基本窗口。继承自 `Window` 类的 `Frame` 类为窗口添加了标题栏和边框。标题栏包含允许用户最小化、最大化、调整大小和关闭窗口的图标。这就是我们常见的窗口类型。\n\
  \n然而，在准备好创建 GUI 应用程序之前，我们还需要再向下走一层继承，到达 `JFrame` 类。一个 `JFrame` 对象是一个 `swing` 组件。因此，`JFrame`\
  \ 类提供了 `Frame` 的功能，以及对 `swing` 架构的支持。我们将在本章晚些部分详细介绍 `swing` 组件。目前，图 12.1 向我们展示了\
  \ `JFrame` 对象是一个 `Component`、一个 `Container`、一个 `Window`、一个 `Frame` 以及一个 `swing`\
  \ 组件。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n\n我们随后通过调用\
  \ `setSize` 方法（第 30 行）将窗口初始大小设置为宽度 300 像素、高度 200 像素。最后，我们调用 `setVisible` 方法（第 33\
  \ 行），以便窗口在构造函数执行完毕后显示。调用 `setSize` 和 `setVisible` 方法不是必须的，但如果你省略了任何一个方法调用，将得到不理想的结果。如果你省略了\
  \ `setSize` 的调用，窗口将仅包含标题栏。如果你省略了 `setVisible` 的调用，窗口在应用程序启动时不会显示。\n\n运行示例 12.1 生成的窗口如图图\
  \ 12.2 **常见错误陷阱**\n\n务必调用 `setSize` 方法来设置窗口的初始尺寸，并调用 `setVisible` 方法来显示窗口及其内容。省略\
  \ `setSize` 的调用将创建一个仅包含标题栏的默认 `JFrame`，尽管用户可以对其调整大小。如果你省略了 `setVisible` 的调用，窗口在应用程序启动时不会打开。\n\
  \n## 12.2 GUI 组件\n\n我们已经提到，**组件**是一个具有图形化表示的对象。标签、文本字段、按钮、单选按钮、复选框和下拉列表都是组件的示例。组件执行以下功能中的至少一个：\n\
  \n![img](img/00009.jpeg)显示信息\n\n![img](img/00009.jpeg)从用户收集数据\n\n![img](img/00009.jpeg)允许用户启动程序功能\n\
  \nJava 提供了一系列广泛的类，用于为应用程序添加 GUI。表 12.2 列出了一些 GUI 组件以及封装它们的 Java 类。表 12.2 中列出的所有类都属于\
  \ `javax.swing` 包。\n\nJava 支持 GUI 组件的两种实现：AWT（抽象窗口工具包）和 `swing`。\n\nAWT 组件是 Java\
  \ 组件的原始实现，并将组件的某些显示和行为交给原生窗口系统。换句话说，在 PC 上，AWT 组件（如按钮和帧）由 Windows 窗口系统渲染；在 Macintosh\
  \ 计算机上，AWT 组件由 MacOS 窗口系统渲染；在 Unix 计算机上，AWT 组件由 X-Window 系统渲染。因此，AWT GUI 组件会自动采用运行应用程序的窗口系统的外观和行为（通常称为**外观和感受**，look\
  \ and feel）。然而，AWT 组件的一个缺点是，由于不同窗口系统之间的外观和感受不一致，应用程序在不同平台上的行为可能略有不同。由于 AWT 组件依赖于原生窗口系统，它们通常被称为**重量级**组件。\n\
  \n### 表格 12.2 选用的 GUI 组件和 Java 类\n\n| **组件** | **用途** | **Java 类** |\n| :--- | :---\
  \ | :--- |\n| Label (标签) | 显示图像或只读文本。标签通常与文本字段配对，用于识别文本字段的内容。 | `JLabel` |\n| Text\
  \ field (文本字段) | 用于显示信息和接受用户输入的单行文本框。 | `JTextField` |\n| Text area (文本区域) | 用于数据输入或显示的多行文本字段。\
  \ | `JTextArea` |\n| Password field (密码字段) | 用于接受密码且不显示输入字符的单行文本字段。 | `JPasswordField`\
  \ |\n| Button (按钮) | 用户点击以信号应执行某项操作的命令按钮。 | `JButton` |\n| Radio button (单选按钮) |\
  \ 用户点击以选择组中一个选项的切换按钮。点击单选按钮会取消之前选中的任何选项。 | `JRadioButton` |\n| Checkbox (复选框) |\
  \ 用户点击以选择组中 0、1 或多个选项的切换按钮。 | `JCheckBox` |\n| Drop-down list (下拉列表) | 用户点击以选择其中一项的项目下拉列表。\
  \ | `JComboBox` |\n\n`swing` 组件是第二代 GUI 组件，完全用 Java 开发，旨在从跨平台提供跨平台的一致的外观和感受。因此，它们通常被称为**轻量级**组件。`swing`\
  \ 组件的一些优势是：\n\n![img](img/00009.jpeg)应用程序跨平台一致运行，这使得维护更加容易。\n\n![img](img/00009.jpeg)`swing`\
  \ 架构源于模型-视图-控制器范式，这有助于编程：\n\n![img](img/00009.jpeg)模型代表应用程序的数据\n\n![img](img/00009.jpeg)视图是该数据的视觉表示\n\
  \n![img](img/00009.jpeg)控制器在视图上获取用户输入并相应地更新模型\n\n`swing` 组件可以在多种窗口样式中进行渲染，因此如果需要，你的应用程序可以采用其运行平台的外观和感受。鉴于\
  \ `swing` 相比 AWT 的优势，我们将使用 `swing` 组件来构建应用程序。`swing` 组件的继承关系如图图 12.3\n\n**图 12.3\
  \ 某些类的继承结构**\n\n表 12.3 列出了 `JComponent` 的一些重要方法。因为这些方法是 `public` 的，图 12.3 所示的 GUI\
