  \n## 3.19.9 小组项目（适用于 1、2 或 3 名学生小组）\n\n### 73. 编写一个计算每月抵押贷款还款的程序；假设利率是按月复利的。\n\n\
  你需要完成以下操作：\n\n*   提示用户输入一个代表年利率的 `double` 类型。\n*   提示用户输入贷款的期限年数（典型输入为 10、15 或 30）。\n\
  *   提示用户输入一个代表从银行贷款金额的数字。\n*   使用以下公式计算每月还款额：\n\n```\nMonthly payment = (mIR * M)\
  \ / (1 - (1 / (1 + mIR)^((12*nOY))))\n```\n\n其中：\n*   `mIR` = 每月利率 = 年利率 / 12\n\
  *   `nOY` = 年数\n*   `M` = 贷款金额\n\n输出抵押贷款问题的摘要，如下：\n*   以百分比形式表示的年利率\n*   以美元为单位的贷款金额\n\
  *   以美元为单位的每月还款额，保留小数点后两位小数\n*   多年来的总还款额，保留小数点后两位小数\n*   多付金额（即多年来的总还款额与贷款金额之间的差额），保留小数点后两位小数\n\
  *   多付金额占贷款金额的百分比（百分比形式）\n\n# 第 4 章\n## Applet 与图形应用程序简介\n\n### 章节目录\n*   4.1 Applet\
  \ 结构`。这条语句调用了我们父类 `JApplet` 类的 `paint` 方法，以便它可以对 applet 窗口进行初始化。\n\n`paint` 方法的唯一参数是一个\
  \ `Graphics` 对象。该对象由浏览器或 applet 查看器自动生成，并将其发送给 `paint` 方法。`Graphics` 对象代表图形上下文，其中包括其他内容包括\
  \ applet 窗口。`Graphics` 类包含了我们在 applet 窗口中显示文本和形状所需的方法。\n\n### 示例 4.1 ShellApplet\
  \ 类\n第 5 行和第 6 行导入了示例中使用的两个类：第 8 行使用的 `JApplet` 和第 10 行使用的 `Graphics`。`Graphics`\
  \ 类是 `awt`（抽象窗口工具包）包的一部分。\n\n第 8 行与我们应用程序中的类头相似，但包含了两个额外的单词：`extends JApplet`。在这种情况下，我们正在继承\
  \ `JApplet` 类。\n\n### 4.1 月气温度柱状图\n`paint` 方法在浏览器或 applet 查看器启动 applet 时自动调用，并在\
  \ applet 窗口需要重绘自身的任何时候都会调用。如果用户调整了 applet 窗口的大小、移动它或关闭它，applet 可能需要重绘。\n\n示例 4.1\
  \ 显示了一个 applet 的最小模式。\n\n\n\n\n\n## 4.2 运行小程序（Applet）\n\n与应用程序类似，小程序在运行之前也需要进行编译。然而，一旦编译完成，小程序与应用程序的不同之处在于它们不能独立运行。小程序被设计为由\
  \ 浏览器或小程序查看器（applet viewer）运行。我们通过打开一个包含 `APPLET` 元素的 HTML 代码的网页来告诉浏览器启动小程序。我们通过指定一个包含\
  \ `APPLET` 元素的最小网页来告诉小程序查看器运行该小程序。\n\n如果你不熟悉 HTML 编码，这种语言由用于指定网页格式的元素组成。一个元素通常包含一对\
  \ `tags`（标签）：起始标签开始特定的格式设置；结束标签与起始标签相同，除了在开头多有一个正斜杠（`/`）外，它用于结束该格式设置。与小程序一起使用的基础\
  \ HTML 标签描述见 表 4.1。\n\n### 表 4.1 HTML 标签\n\n| HTML 标签 | 含义 |\n| :--- | :--- |\n\
  | `<HTML></HTML>` | 标记网页的开始和结束。 |\n| `<HEAD></HEAD>` | 标记网页头部部分的开始和结束。头部包含关于页面的通用描述性信息。\
  \ |\n| `<TITLE></TITLE>` | 标记显示在浏览器标题栏或小程序查看器窗口标题上的文本的开始和结束。 |\n| `<BODY></BODY>`\
  \ | 标记网页主体的开始和结束。主体包含网页的内容。 |\n| `<APPLET></APPLET>` | 识别要在浏览器或小程序查看器窗口中启动的小程序。`<APPLET>`\
  \ 标签支持某些属性，用于指定程序名称、类文件位置以及小程序窗口的大小。每个属性由属性名称后跟一个等号（`=`）以及分配给该属性的值组成。 |\n| | `CODE`\
  \ = 小程序的类名 |\n| | `CODEBASE` = 搜索类文件的文件夹 |\n| | `WIDTH` = 小程序窗口的宽度（像素为单位） |\n| |\
  \ `HEIGHT` = 小程序窗口的高度（像素为单位） |\n\n示例 4.2 显示了一个最小 HTML 文件，你可以修改它来启动小程序。\n\n![img](img/00351.jpeg)\n\
  \n**示例 4.2 用于启动小程序的最小 HTML 页面**\n\n`APPLET` 标签的 `CODE` 属性是小程序类的名称。`CODEBASE` 属性是\
  \ JVM 查找类文件的文件夹。在示例 4.2 中，`CODEBASE` 值中的点（`.`）表示该类文件与 HTML 页面位于同一个文件夹中。`WIDTH` 和\
  \ `HEIGHT` 属性以像素（或图像元素）指定小程序窗口的宽度和高度。\n\n例如，如果我们有一个名为 `FirstApplet` 的类，我们可以使用简单的文本编辑器创建示例\
  \ 4.3 所示的 HTML 文件。在这种情况下，小程序窗口的宽为 400 像素，高为 300 像素。\n\n![img](img/00352.jpeg)\n\n\
  **示例 4.3 用于启动名为 FirstApplet 小程序的 HTML 页面**\n\n小程序查看器是 Java SE 开发工具包（JDK）的一部分。小程序查看器是一个最小浏览器，使我们能够在无需打开网络浏览器的情况下查看小程序。\n\
  \n如果网页名称为 `FirstApplet.html`，我们可以从命令行运行小程序查看器，如下所示：\n\n```\n![img](img/00353.jpeg)\n\
  ```\n\n如果你正在使用集成开发环境（IDE），如 TextPad、JGrasp 或 Eclipse，你可以直接运行小程序查看器，而无需打开命令行窗口。此外，IDE\
  \ 通常会创建一个包含 `APPLET` 元素的最小网页，这样你就不需要为编写的每个小程序创建一个 HTML 文件。\n\n## 4.3 使用图形方法绘制形状\n\
  \n位于 `java.awt` 包中的 Java `Graphics` 类提供了各种方法，用于绘制矩形、圆形和直线等图形；设置绘制颜色；以及在窗口中写入文本。\n\
  \n每个绘制方法都要求你指定在窗口中开始绘制的位置。位置使用 `(x,y)` 坐标系表示。每个坐标对应一个像素。`x` 坐标指定水平位置，从 0 开始，随着向窗口右侧移动而增加。`y`\
  \ 坐标指定垂直位置，从 0 开始，随着向窗口下方移动而增加。因此，对于一个宽 400 像素、高 300 像素的窗口，坐标 `(0, 0)` 对应于左上角；`(399,\
  \ 0)` 是右上角；`(0, 299)` 是左下角，而 `(399, 299)` 是右下角。图 4.2 显示了一个包含若干示例像素及其 `(x,y)` 坐标的窗口。\n\
  \n表 4.2\n\n### 表 4.2 图形系统\n\n| 返回值 | 方法名及参数列表 |\n| :--- | :--- | :--- |\n| `void`\
