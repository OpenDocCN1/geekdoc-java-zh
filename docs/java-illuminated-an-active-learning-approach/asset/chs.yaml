  \n该类的代码与 `IntegerNode` 类的代码相似。重载构造函数允许客户端设置 `Player` 对象，而默认构造函数则将 `Player` 对象的引用设置为\
  \ `null`。\n\n### 14.2.1 链表外壳\n\n对于我们封装 `Player` 对象链表的类，我们需要考虑以下问题：\n\n![img](img/00009.jpeg)\
  \ 我们预计会有很多链表类。因此，设置一个链表超类是有意义的，我们更具体的链表类将从该超类继承。\n\n![img](img/00009.jpeg) 我们提供了一些基础工具方法，但省略了列表中插入或删除节点的方法，因为这些方法的名称和实现取决于给定子类的功能。\n\
  \n![img](img/00009.jpeg) 我们不打算从超类实例化对象；因此，我们将超类声明为 `abstract`（抽象的）。\n\n示例 14.6 显示了我们的\
  \ `abstract ShellLinkedList` 类。该类定义了所有子类通用的方法。例如，除了默认构造函数和获取列表数量的访问器外，我们还提供了一个判断列表是否为空的方法以及一个用于打印列表中每个节点的\
  \ `toString` 方法。我们将两个实例变量都声明为 `protected`，这样我们的链表子类就可以继承头节点和列表的项目数量。\n\n**表 14.2\
