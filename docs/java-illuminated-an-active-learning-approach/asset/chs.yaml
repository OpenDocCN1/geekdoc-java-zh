  \ JVM 的消息\n- 6.14.6 编写短程序\n- 6.14.7 编程项目\n- 6.14.8 技术写作\n- 6.14.9 小组项目\n\n### 介绍\n\
  你以前观察过超市的收银员吗？我们称她为 Jane。Jane 的工作是确定购物订单的总费用。开始时，Jane 的总费用为 0.00 元。然后她拿起第一个物品，扫描并记录其价格，将其加到总费用中。接着她拿起第二个物品，扫描该物品并记录其价格，加到总费用中，以此此类推。Jane\
  \ 持续扫描每个物品，直到没有更多物品可以扫描。通常，订单的结束是由传送带上的横杆信号的。当 Jane 看到横杆时，她知道自己已经结束了。这时，她告诉我们订单的总费用，收取费用并给我们收据。\n\
  \n所以我们看到，我们经常执行遵循这种模式的任务：\n1：初始化值\n2：一次处理一个项目\n3：在最后报告结果\n\n## 6.1 使用 `while` 的事件控制循环\n\
  如果我们尝试为超市收银员编写伪代码，可能会像这样开始：\n\n![img](img/00544.jpeg)\n\n![img](img/00545.jpeg)\n\
  \n\n\n\n我们可以在这里看到一个模式。我们从订单总额 $0.00 开始。然后，我们对每个项目重复一组操作。我们获取一个项目并检查它是否为分隔符。如果该项目不是分隔符，我们就将项目的价格加到订单总额中。我们获取下一个项目并检查它是否为分隔符，以此此类推。当我们获取一个项目并发现它是分隔符时，我们就知道没有更多项目需要处理了，因此我们此时拥有的总额就是整个订单的总额。换句话说，我们不知道传送带上会有多少个项目。我们只是逐个项目地处理订单，直到看到分隔符，而我们不对分隔符进行处理。\n\
  \n在 Java 中，`while` 循环设计用于在程序开始时不知道会有多少个输入值时，对每个输入值重复一组指令。我们简单地一个接一个地处理每个输入值，直到一个信号——一个事件——告诉我们没有更多输入了。这被称为`事件控制循环`（`event-controlled\
  \ looping`）。在收银员的中，输入结束的信号是分隔符。在其他任务中，输入结束的信号可能是用户输入的特殊值，称为`哨兵值`（`sentinel value`），或者可能是我们到达了输入文件的末尾。\n\
  \n## 6.2 `while` 循环的通用形式\n\n`while` 循环具有以下语法：\n\n![img](img/00546.jpeg)\n\n条件是一个\
  \ `boolean` 表达式，即任何求值为 `true` 或 `false` 的表达式。当遇到 `while` 语句时，会评估条件的值；如果值为 `true`，则执行`循环体`（`loop\
  \ body`）中的语句。然后重新评估条件，如果为 `true`，则再次执行循环体。这种重复一直持续，直到循环条件求值为 `false` 为止，此时，循环体被跳过，执行在循环体之后的指令处继续。\n\
  \n只有当循环体包含多个语句时，才需要大括号——也就是说，如果条件求值为 `true` 时应该执行多个语句，则才需要大括号。\n\n在 `while` 循环体内定义的任何变量的作用范围从其声明处延伸到\
  \ `while` 循环结束。因此，在 `while` 循环体内声明的任何变量都无法在 `while` 循环结束后被引用。\n\n`while` 循环的控制流如图图\
  \ 6.1 所示。\n\n循环体的每次执行被称为循环的一次`迭代`（`iteration`）。因此，如果循环体在条件求值为 `false` 之前执行了五次，我们说\
  \ `while` 循环执行了五次迭代。\n\n![img](img/00547.jpeg)\n\n**图 6.1 `while` 循环的控制流**\n\n如果循环条件在第一次评估时为\
  \ `false` 会发生什么？因为循环条件在执行 `while` 循环体之前就会评估，而且只有在条件为 `true` 时才会执行循环体，所以 `while`\
  \ 循环体可能永远不会被执行。在这种情况下，循环将有`零次迭代`。\n\n使用 `while` 循环结构，收银员的伪代码看起来如下：\n\n![img](img/00548.jpeg)\n\
  \n也可以构建一个条件`永远`不会求值为 `false` 的 `while` 循环。这会导致一个`死循环`（`endless loop`），也称为`无限循环`（`infinite\
  \ loop`）。因为条件始终求值为 `true`，循环体被反复执行且无停止。死循环的一个症状是程序不会终止；它看起来像是“卡住了”。然而，如果程序在循环体中写入了一些输出，你将看到这些输出在\
  \ Java 控制台上不断产生。通常情况下，唯一的解决办法是用户中止程序。\n\n确保条件最终会求值为 `false` 的方法是在循环体内包含一段代码，称为`循环更新语句`（`loop\
  \ update statement`），它能恰当更改更改循环条件正在测试的变量。例如，如果循环条件测试读取某个特定值，则循环更新语句应该读取下一个输入值。\n\
  \n导致死循环的一个常见逻辑错误是在条件后放置分号，如下例所示：\n\n![img](img/00549.jpeg)\n\n紧跟在条件后的分号表示一个空循环体。尽管某些高级编程技术要求使用空循环体，但我们在本章中不会使用这些技术。\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**\n\n避免在 `while` 循环的条件后放置分号。这样做会创建一个空循环体并可能导致死循环。\n\
  \n## 6.3 事件控制循环\n\n当我们不知道循环将执行多少次时，使用 `while` 循环；也就是说，当循环开始时，我们不知道需要多少次迭代。我们依靠信号或`事件`（`event`）来告诉我们已经处理了所有数据。例如，当收银员开始结算订单时，她并不（不一定）知道购物车里有多少个项目；她只知道在看到传送带上的分隔符时停下。我们把这称为事件控制循环，因为我们持续处理数据，直到某个事件发生，该事件预示着数据的结束。\n\
  \n当我们提示用户从控制台输入数据，且在循环开始时不知道用户会输入多少数据时，我们可以定义一个特殊值，称为`哨兵值`（`sentinel value`）。哨兵值可以随任务而异，通常是一个在数据范围之外的值。有时我们需要的数据存储在一个文本文件中。例如，一个文件可以存储公司过去五年的月销售额。我们可能想要计算平均销售额或对数据进行其他统计计算。在这种情况下，我们需要从文件中读取数据，而不是让用户手动输入。读取文件也是事件控制循环，因为在程序开始时，我们不知道文件中有很多数据。因此，我们需要一种方法来确定何时处理完所有数据。Java\
  \ 以及其他语言提供了指示我们到达文件末尾的标识。\n\n### 6.3.1 从用户处读取数据\n\n让我们看看使用 `while` 循环处理用户数据的通用形式。\n\
  \n![img](img/00550.jpeg)\n\n![img](img/00551.jpeg)\n\n在执行任何初始化后，我们尝试读取第一个项目。我们将其称为`引导读取`（`priming\
  \ read`），就像给水泵启动一样，我们使用该值来供给第一次迭代的循环循环条件。如果第一个项目不是哨兵值，我们就对其进行处理。处理可能包括计算总和、计数项目、将数据与之前读取的值进行比较或任何操作。然后我们读取下一个数据项目。这被称为`更新读取`（`update\
  \ read`），因为我们更新了数据项目，为将其值输入下一次迭代的 `while` 循环条件做准备。这种处理后的更新读取一直持续，直到我们读取到哨兵值，此时我们不执行\
  \ `while` 循环体。相反，我们跳到 `while` 循环之后的第一个指令。注意，哨兵值并不是为了处理的。就像收银员的分隔符一样，它仅仅是一个停止处理的信号。我们在示例\
  \ 6.1 中阐明这种模式，该示例提示用户输入整数并在控制台上回显用户输入的任何内容。我们选择 -1 作为哨兵值；也就是说，当用户输入 -1 时，我们就停止处理。\n\
  \n![img](img/00552.jpeg)\n\n\n\n\n\n![img](img/00553.jpeg)\n\n# 示例 6.1 回显用户输入\n\n\
  图 6.2 显示了当用户输入 23, 47, 100 和 −1 时，该程序的输出。\n\n在第 10 行中，我们将哨兵值 −1 声明为常量，因为哨兵值在程序执行过程中不会改变，而且这允许我们通过\
  \ `while` 循环条件（第 19 行）清晰地表述：只有当输入值不是哨兵值时，我们才执行循环体。\n\n然后，在第 16–17 行中，我们执行了引导读取（priming\
  \ read）。第 19 行的 `while` 循环条件检查哨兵值。如果用户首先输入哨兵值，我们将跳过整个 `while` 循环并执行第 29 行，该行会打印一条输入了哨兵值的消息，然后退出程序。如果用户输入的是哨兵值以外的数字，我们将执行\
  \ `while` 循环的体（第 21–26 行）。在 `while` 循环中，我们只需将用户的输入输出到控制台，然后执行更新读取。随后控制跳转到 `while`\
  \ 循环条件，将更新读取中输入的值与哨兵值进行比较。如果该输入是哨兵值，则跳过循环；否则执行循环体：输出该值，然后读取新值。这种处理一直持续，直到用户输入哨兵值。注意，哨兵值（−1）不会输出到输出中。\n\
  \n![img](img/00554.jpeg)\n\n**图 6.2 使用哨兵值的示例 6.1 输出**\n\n在构建 `while` 循环时，一个常见的错误是忘记更新读取。如果没有更新读取，`while`\
  \ 循环将不断处理同一个数据项，导致死循环。\n\n另一个常见错误是省略引导读取，转而在 `while` 循环内部在处理之前读取数据，如下伪代码所示：\n\n\
  ![img](img/00555.jpeg)\n\n这种结构存在多个问题。当我们第一次评估 `while` 循环条件时，我们还没有读取任何数据，因此该评估的结果是不可预测的。其次，当我们确实读取到哨兵值时，我们将对其进行处理，导致错误的结果。\n\
  \n![img](img/00005.jpeg) **常见错误陷阱**\n\n省略更新读取可能会导致死循环。\n\n![img](img/00005.jpeg)\
  \ **常见错误陷阱**\n\n省略引导读取会导致错误的结果。\n\n## 6.3.2 从文本文件读取数据\n\n`Scanner` 类允许我们轻松地从文本文件中读取数据。Java\
  \ 还在 `java.io` 包中提供了一整套类，使程序员能够对文件进行用户输入输出。\n\n对于 `Scanner` 类，从文本文件读取数据的通用形式与从用户读取数据略有不同。首先，我们不是读取一个值并检查它是否为哨兵值，而是检查文件中是否有更多数据，然后读取一个值。其次，我们不需要打印提示信息，因为用户并不输入数据；我们只需要从文件中读取下一个值。对于\
  \ `Scanner` 类，从文本文件读取的伪代码所示：\n\n![img](img/00556.jpeg)\n\n`Scanner` 类的方法（包括用于从文本文件读取的构造函数）在表\
  \ 6.1 所示。我们将使用的另一个类是 `File` 类，它将文件名与文件关联。`File` 类的构造函数在表 6.2 所示。\n\n表 6.1 所示的构造函数可将\
  \ `Scanner` 对象与文件关联。`Scanner` 对象将文件内容进行分词，并在我们调用后续方法时返回这些标记。`Scanner` 类中的 `hasNext`\
  \ 方法在输入还有另一个标记时返回 `true`，否则返回 `false`。因此，当 `hasNext` 方法返回 `false` 时，我们知道已经到达文件末尾。\n\
  \n示例 6.2 从名为 `input.txt` 的文件中读取整数并将整数回显到控制台。`input.txt` 的内容如图 6.3 所示，程序的输出如图 6.4\
  \ 所示。\n\n![img](img/00557.jpeg)\n\n**图 6.3 input.txt 的内容**\n\n在示例 6.2 的第 14 行，我们使用\
  \ `File` 类的构造函数将文件名 `input.txt` 转换为平台无关的文件。由于我们指定的是简单文件名，JVM 将在与源文件相同的文件夹中查找该文件。如果文件位于另一个文件夹，我们需要指定路径以及文件名。例如，如果文件位于\
  \ Windows 系统的闪存器上，我们将向构造函数传递 `String \"e:\\\\input.txt\"`。注意，我们需要使用两个反斜杠的转义序列来指定路径\
  \ `e:\\input.txt`。\n\n`File` 类属于 `java.io` 包，因此我们在第 5 行中包含了该类的 `import` 语句。\n\n\
  在第 15 行中，我们构造了一个与 `inputFile` 对象关联的 `Scanner` 对象。如果未找到文件，构造函数将产生 `FileNotFoundException`。如果在读取文件时遇到问题，也可能产生\
  \ `IOException`。Java 要求我们承认这些异常可能会产生。一种方法是在 `main` 方法头中包含 `throws IOException`（第\
