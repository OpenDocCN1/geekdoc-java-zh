  **图 8.20 示例 8.13 的输出**\n\n**8.6 数组的搜索与排序**\n\n假设你是一家 DVD 租赁店的经理。每个会员客户都有一张带有唯一会员\
  \ ID 的卡。你决定随机抽取五个会员 ID，并在这些会员下次光临商店时送上免费礼物。因此，你设置了一个 `DVDWinners` 类，包含两个数组实例变量：\n\
  \n![img](img/00009.jpeg)存储中奖会员 ID 的 `ints` 数组\n\n![img](img/00009.jpeg)存储相应奖品的 `String`\
  \ 数组\n\n\n\n注意，这两个数组都有五个元素，且这两个数组之间存在一一对应的对应关系。1 号获奖者将获得 1 号奖，2 号获奖者将获得 2 号奖，依此类推。这种编程技术被称为\
  \ `parallel arrays`（并行数组）。\n\n你从成员填写的参赛卡片中随机选择成员 ID 填充 `winners` 数组。你用代表奖项描述的 `Strings`\
  \ 填充 `prizes` 数组。当成员租用 DVD 时，你可以遍历 `winners` 数组查找该成员的 ID。如果该成员的 ID 在 `winners` 数组中，你就可以使用该\
  \ ID 在 `prizes` 数组中的索引来检索该成员赢得奖项。如果在数组中没有找到该成员 ID，你就知道该成员不是中奖者。\n\n`DVDWinners`\
  \ 类例 8.14 所示。\n\n![img](img/00982.jpeg)\n\n![img](img/00983.jpeg)\n\n### 示例 8.14\
  \ `DVDWinners` 类\n\n构造函数通过调用实用方法 `fillWinners`（第 26–36 行）随机生成值来填充数组。为了保持简单，我们在编写\
  \ `fillWinners` 方法时，使其并不一定生成不同的数字；然而，两个中奖号码相同的概率非常小。我们将 `fillWinners` 方法声明为 `private`，因为它被设计为仅供该类的其他方法调用。\n\
  \n我们的 `indexOfWinner` 方法（第 52–64 行）执行 `Sequential Search`（顺序查找），它会将成员 ID 与数组中的每个元素进行逐一比较。`indexOfWinner`\
  \ 方法接受一个参数 `key`，即要在数组中搜索的成员 ID。如果找到了 `key`，`indexOfWinner` 返回该数组元素的索引。如果未找到 `key`，即如果数组中没有一个元素与\
  \ `key` 的值匹配，则 `indexOfWinner` 返回 -1。由于 -1 不是有效的数组索引，因此它是用以指示搜索未结果的良好值。\n\n请注意，如果当前数组元素与\
  \ `key` 匹配，`indexOfWinner` 方法将立即返回给调用者（第 61 行）；这意味着方法停止执行。返回值与 `key` 匹配的元素索引。然而，如果方法执行完了\
  \ `for` 循环的所有迭代，则该方法已经查看了数组中的每个元素但没有找到匹配项。在这种情况下，方法返回 -1（第 63 行），表示未找到 `key`。\n\n\
  我们的 `getPrize` 方法（第 38–50 行）调用 `indexOfWinner` 来检查其参数 `memberNumber` 是否为中奖号码；如果是，它将使用\
  \ `indexOfWinner` 返回的索引来返回数组 `prizes` 中对应的元素（第 49 行）。\n\n示例 8.15 显示了一个使用我们 `DVDWinners`\
