  \n123,450 除以 60,378 的余数是 2,694。\n2,694 不等于 0\n所以我们取 60,378 除以 2,694 的余数，是 1,110。\n\
  1,110 不等于 0\n所以我们取 2,694 除以 1,110 的余数，是 474。\n474 不等于 0\n所以我们取 1,110 除以 474 的余数，是\
