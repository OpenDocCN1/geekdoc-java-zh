  ![img](img/02094.jpeg)\n\n**附录 D**\n\n\n\n\n\n# 负整数的表示\n\n表示负整数的行业标准方法称为补码（`two’s\
  \ complement`）。工作原理如下：\n\n对于使用 16 位表示的整数，最左侧位保留作为符号位。如果符号位为 0，则整数为正数；如果符号位为 1，则整数为负数。\n\
  \n例如，让我们两个数：一个正数和一个负数。\n\n`0000 0101 0111 1001` 是正整数，我们称之为 `a`。\n\n`1111 1111 1101\
  \ 1010` 是负整数，我们称之为 `b`。\n\n使用第 1 章中提供的将二进制转换为十进制的方法，我们可以将二进制数 `a` 转换为其十进制等值。因此，`a`\
  \ 的值计算如下：\n\n![img](img/02095.jpeg)\n\n相比之下，负数 `b` 使用补码法用二进制表示。最左侧位（符号位）是 1，表示 `b`\
  \ 是负数。要计算负数的值，我们首先计算它的补码。任何二进制数的补码都是另一个二进制数，该数与原数相加，将得到一个全为 0 且末尾有一个进位 1 的和。\n\n\
  要计算二进制数 `n` 的补码，从 `2^(d)` 中减去 `n`，其中 `d` 是 `n` 的二进制位数。以下公式总结了这一规则：\n\n![img](img/02096.jpeg)\n\
  \n已知 `2^(d)−1` 总是包含全 1 的二进制数，我们可以通过先从 `2^(d)` 减去 1，然后在末尾加 1 来简化计算。\n\n![img](img/02097.jpeg)\n\
  \n因此，要计算 16 位数字 `b` 的补码，我们从一个由 16 个 1 组成的二进制数中减去 `b`，然后加 1，如所示。\n\n![img](img/02098.jpeg)\n\
  \n因此，`b` 的补码（我们称之为 `c`）为 `0000 0000 0010 0110`。\n\n计算补码的另一种简单方法是反转每一位，然后加 1。反位意味着将所有的\
  \ 0 变为 1，将所有的 1 变为 0。使用这种方法，我们得到：\n\n![img](img/02099.jpeg)\n\n我们可以通过计算 `b` 和 `c`\
  \ 的和来验证 `b` 的补码是正确的。\n\n![img](img/02100.jpeg)\n\n将 `c` 转换为十进制将得到我们原始数字 `b` 的值，正如我们记得的，它是负数。我们有：\n\
  \n![img](img/02101.jpeg)\n\n因为最左侧位为 0 表示数字为正数，使用 16 位，我们可以表示的最大正数（我们称之为 `max`）是：\n\
  \n![img](img/02102.jpeg)\n\n这等同于 `2¹⁵ − 1`，即 32,768 − 1，或 32,767。\n\n那么使用 16 位，我们可以表示的最小负数（我们称之为\
  \ `min`）是：\n\n![img](img/02103.jpeg)\n\n`min` 的补码是 `min` 本身。如果我们反转位并加 1，将得到与开始时相同的值：\n\
  \n![img](img/02104.jpeg)\n\n因此 `min` 是 `-2¹⁵` 或 `-32,768`。\n\n因此，使用 16 位，我们可以表示\
  \ `-32,768` 到 `32,767` 之间的整数。\n\n# 附录 E\n\n# 浮点数的表示\n\nIEEE 754 是一种全球接受并被 Java 语言使用的规范，定义了如何用二进制表示浮点数。单精度浮点数使用\
  \ 32 位内存，双精度浮点数使用 64 位。\n\n以下是单精度和双精度浮点数的表示方式：\n\n![img](img/02105.jpeg)\n\n最左侧位存储浮点数的符号；0\
  \ 表示正数，而 1 表示负数。\n\n为了表示数字的指数（可以是正也可以是负），每个表示法都存储一个正的偏移指数，该指数通过向数字的实际指数加上一个固定偏移（或缩放因子）计算得出。\n\
