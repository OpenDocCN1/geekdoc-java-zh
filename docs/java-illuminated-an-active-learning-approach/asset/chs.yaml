  \n### 示例 11.10 向文本文件追加基本数据类型\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\n打开一个文件进行写入会导致现有文件数据被删除。如果你打算在保留原始内容的同时向文件添加新数据，请以追加模式打开文件。\n\
  \n示例 11.10 与示例 11.9 类似。主要区别在于当我们实例化 `FileOutputStream` 对象时（第 15–16 行），第二个参数是 `true`，这意味着我们将追加到文件\
  \ `grades.txt` 中，而不是覆盖它。如果文件 `grades.txt` 存在，我们将从当前内容的末尾开始写入；如果文件不存在，则会创建它。在该程序中，我们向文件追加了四行（第\
  \ 21–29 行）。\n\n如果在执行此程序之前，文件 `grades.txt` 包含图 11.14 所示的数据，那么执行此程序后，文件 `grades.txt`\
  \ 将包含图 11.15 所示的数据；同样，控制台没有输出。\n\n![img](img/01478.jpeg)\n\n**图 11.15：`grades.txt`\
  \ 的新内容**\n\n## 11.5 读取结构化文本文件\n\n有时文本文件的组织使得每行都代表与特定记录或对象的数据。例如，航空公司可以将数据存储在文件中，每行代表一个航段，包含以下逗号分隔的数据：\n\
  \n![img](img/00009.jpeg)航班号\n\n![img](img/00009.jpeg)出发机场\n\n![img](img/00009.jpeg)到达机场\n\
  \n![img](img/00009.jpeg)乘客人数\n\n![img](img/00009.jpeg)平均票价\n\n此类文件可能包含以下数据：\n\n\
  ![img](img/01479.jpeg)\n\n当我们读取文件时，我们应该**解析**每一行，即将该行拆分为单独的数据部分（航班号、出发机场等），这些部分被称为**标记\
  \ (tokens)**。在这种情况下，逗号是**分隔符 (delimiter)**；即用逗号分隔一个标记和下一个标记。我们将每行的标记存储到相应的 `FlightRecord`\
  \ 对象中。\n\n除了接受来自控制台和文本文件的输入外，`Scanner` 还可以用于解析 `Strings`，即将 `Strings` 分分为标记。\n\n\
  ### 11.5.1 使用 Scanner 解析字符串\n\n`Scanner` 类中用于接收 `String` 进行解析的构造函数如表 11.7 所示。\n\n\
  默认分隔符是空白字符。你可以通过 `useDelimiter` 方法指定其他分隔符（同样在表 11.7 中所示），该方法接受一个代表**正则表达式 (regular\
  \ expression)** 的 `String` 作为参数。正则表达式允许你使用标准字符以及具有特殊含义的**元字符 (meta-characters)**\
  \ 来指定匹配字符序列的模式。正则表达式的进一步讨论超出了本书的范围。对于我们的目的，可以将由单个或多个特定字符组成的分符作为简单的 `String` 参数传递给\
