  \ Defining abstract Classes and Methods)\n\n| `abstract` 类 | `abstract` 方法 |\n|\
  \ :--- | :--- |\n| • 如果类包含任何 `abstract` 方法，则该类必须被声明为 `abstract`。 | • `abstract`\
  \ 方法只能在 `abstract` 类内部声明。 |\n| • `abstract` 类可以被扩展。 | • 一个 `abstract` 方法必须由方法头后跟一个分号组成。\
  \ |\n| • `abstract` 类不能用于实例化对象。 | • `abstract` 方法不能被调用。 |\n| | `abstract` 方法不能声明为\
  \ `private` 或 `static`。 |\n| | | 构造函数不能被声明为 `abstract`。 |\n\nJava 对声明和使用 `abstract`\
  \ 类和方法施加了一些限制。这些规则总结在表 10.6 中。\n\n### 10.6 多态 (10.6 Polymorphism)\n\n继承中的一个重要概念是：一个类的对象也是其任何一个父类的对象。该概念是一个重要的\
  \ OOP 特性——**多态** (polymorphism) 的基础，它简化了对同一层级中各种对象的处理。`polymorphism` 一词源于希腊语中的词碎片\
  \ `poly` 和 `morpho`，字面意思是“多种形式”。\n\n多态允许我们对层级中的任何对象使用相同的方法调用。我们使用父类的对象引用来执行该方法调用。在运行时，JVM\
  \ 确定对象实际上属于层级中的哪一类，并调用为该类实现的方法版本。\n\n要在应用程序中使用多态，必须满足以下条件：\n\n![img](img/00009.jpeg)\
  \ 这些类处于同一层级中。\n\n![img](img/00009.jpeg) 子类重写了相同的方法。\n\n![img](img/00009.jpeg) 使用父类的对象引用来执行方法调用。\n\
  \n![img](img/00009.jpeg) 子类对象被赋值给父类引用。\n\n在你的应用程序中，我们可以通过调用 `Figure` 类任何对象的 `draw`\
  \ 方法来使用多态。例如，通过调用 `Circle` 或 `Square` 的 `draw` 方法，我们可以在交通灯应用程序中利用多态。虽然我们不能实例化 `abstract`\
  \ 类，但 Java 允许声明 `abstract` 类的引用。\n\n![img](img/01365.jpeg)\n\n![img](img/01366.jpeg)\
  \ **示例 10.19 使用多态的交通灯 (EXAMPLE 10.19 Traffic Light Using Polymorphism)**\n\n![img](img/00013.jpeg)\
