  2. 解释如果你在 `pop` 方法中不测试栈是否为空，或者在 `push` 方法中不测试栈是否满，会发生什么。\n\n## 14.7 队列的数组表示\n\n\
  在本章较早之前，我们还看到了如何用链表表示队列。同样，如果我们预先知道队列中的对象数量始终小于某个最大值，我们也可以使用数组来表示队列。\n\n为了匹配队列的\
  \ FIFO（先入先出）功能，我们需要跟踪两件事：\n\n1. 队列尾部的位置——这是最后添加到队列的元素的索引。我们将该元素的索引命名为 `back`。\n\
  2. 队列头部的位置——即下一个将检索的元素的索引。我们将该元素的索引命名为 `front`。\n\n队列将由索引在 `back` 和 `front` 之间（包含边界）的元素组成。\n\
  \n要出队（即从队列中删除），我们将返回索引为 `front` 处的项并将 `front` 的值加一。要入队（即在队列中插入元素），我们将增加 `back` 的值。\n\
  \n用标准数组表示队列有一个重要问题：随着入队和出队，数组中的可用容量会随时间缩小。\n\n为了说明这一点，让我们考虑一个由 8 个元素数组表示的队列。由于入队和出队，数组中的元素会向末端移动。我们开始时，按此顺序入队\
  \ 5 个元素：(*5, Sonic*), (*2, Golf*), (*7, Mario*), (*8, Diablo*) 和 (*6, Steve*)。由于\
  \ (*5, Sonic*) 是第一个入队的，它现在位于队列头部。(*6, Steve*) 是最后入队的，位于队列尾部。因此，如图 14.14a 所示，(*5,\
  \ Sonic*) 在索引 0，(*6, Steve*) 在索引 4。假设现在我们出队一次。Front* 现在为 1，如图 14.14b 所示。索引 0 的数组元素不再在队列中。由于我们在尾部插入，索引\
  \ 0 不再可用。\n\n解决此问题的方法是：像处理循环数组一样处理数组。当 `back` 到达 7 后，我们从 0 开始入队。因此，在循环数组中，7 之后的索引是\
  \ 0。这样，我们的有效容量永远不会缩小且始终为 8。\n\n我们如何知道已经到达数组的最后一个索引并且下一个索引应该是 0？我们只需对 `back` 的值加\
  \ 1，然后对该数对数组的大小取模（我们称之为 `QUEUE_SIZE`）。\n\n![img](img/0004.jpeg) **软件工程技巧**\n\n用数组实现队列时，请将其视为循环数组。\n\
  \n![img](img/01904.jpeg)\n\n**图 14.14a**\n**入队前五个元素后的队列**\n\n![img](img/01905.jpeg)\n\
  \n**图 14.14b**\n**出队一次后的队列**\n\n表 14.7 显示了 `enqueue` 和 `dequeue` 方法的 API。\n\n图 14.15\
  \ 演示了用循环数组实现的 `Players` 队列的一系列插入和删除操作。当我们开始时，队列是为空的。`front` 的值为 0，`back` 的值为 `QUEUE_SIZE\
  \ – 1`。当我们入队第一个项时，该元素被放在索引\n\n\n\n\n现在其值为 0，且 `back` 将赋值为 0。如果我们再次进行入队（enqueue），新元素将被放置在索引\
  \ 1，且 `back` 将赋值为 1。如果我们再入队两个项目，它们将分别置于索引 2 和 3，且 `back` 将赋值为 3。如果我们此时进行出队（dequeue），我们将返回索引\
  \ 0 处的项目，`front` 将变为 1。如果再次出队，我们将返回索引 1 处的项目，`front` 将变为 2。\n\n### 表 14.7 `ArrayQueue`\
