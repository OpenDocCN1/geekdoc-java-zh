  \n位于 `java.awt` 包中的 `Color` 类使用 RGB（红、绿、蓝）系统定义颜色。任何 RGB 颜色都被认为由红、绿、蓝三个分量组成。每个分量的值范围从\
  \ 0 到 255；值越高，该分量在颜色中的浓度就越高。例如，红色红色 = 255、绿色 = 0、蓝色 = 0 的颜色是红色，红色 = 0、绿色 = 0、蓝色\
  \ = 255 的颜色是蓝色。\n\n灰色由每个分量的等量组成。分量的值越高，灰色的颜色越浅。这是合理的，因为白色是 (255, 255, 255)，所以颜色越接近白色，颜色就越浅。同样，灰色值越接近\
