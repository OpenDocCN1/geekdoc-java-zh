  \ `Airport` 对象并调用 `Airport` 方法后的状态。\n\n### 讨论题\n\n1. 为什么 `main` 方法与 `Airport` 类定义在不同的源文件中？\n\
  2. 解释在访问器（accessor）和修改器（mutator）方法中使用标准命名规范的重要性。\n\n### 7.9 对象引用 `this`\n\n当一个对象被实例化时，会为每个实例变量创建一个副本。然而，该类的所有对象都共享一份方法副本。那么，方法如何知道它是为哪个对象被调用的呢？换句话说，方法如何知道它应该获取、设置或使用哪些实例变量来计算一个值？答案是名为\
  \ `this` 的特殊对象引用。\n\n当方法开始执行时， JVM 会将对象引用 `this` 指向调用该方法的对象。该对象被称为隐式参数（implicit\
  \ parameter）。当方法引用实例变量时，它将访问属于隐式参数所引用对象的实例变量。换句话说，默认情况下，方法引用的任何实例变量都被视为 `this.instanceVariable`。\n\
  \n在实例变量名前前加 `this` 是可选的；当只使用实例变量名（不带任何对象引用）时，会被认为 `this`。因此，我们通常省略 `this` 引用，只使用实例变量名。\n\
  \n然而，在需要避免变量名冲突的方法中，你可以在实例变量名前加上 `this`。这种方法对于避免我们在本章前面讨论过的常见错误之一非常有用：修改器方法的参数如果与要修改的实例变量同名，会隐藏该实例变量。我们可以通过对实例变量使用\
  \ `this` 引用来消除这个问题，这有效地“揭露”了实例变量名。\n\n例如，某些程序员会这样编写 `setModel` 修改器代码：\n\n![img](img/00772.jpeg)\n\
  \n在这里，我们为参数 `model` 分配了与它代表的实例变量相同的名称。然后在赋值语句中，我们使用 `this` 引用来区分实例变量和参数。现在很清楚，参数值\
  \ `model` 应该被赋值给实例变量 `this.model`。\n\n## 7.10 `toString` 和 `equals` 方法\n\n除了构造方法、修改器方法和访问器方法外，良好的类通常会实现\
  \ `toString` 和 `equals` 方法。\n\n`toString` 方法通常在对象引用作为 `String` 使用时自动调用（例如，在 `System.out.println`\
  \ 中）。`toString` 方法的作用是返回对象的字符串表示。`equals` 方法的设计用于比较两个对象的相等性；如果对象的值相等，则返回 `true`，否则返回\
  \ `false`。`equals` 方法通常接收一个 `Object` 类型的参数，如果对象引用可以转换为该类的实例（例如，如果它是该类的对象引用），则返回\
  \ `true`。\n\n所有类都从 `Object` 类继承 `toString` 和 `equals` 方法，但这些方法并不提供我们所需要的功能。为了实现这一点，我们需要提供与\
  \ `Object` 类相同的方法头以及新的方法体，这被称为**重写方法（overriding a method）**。`toString` 和 `equals`\
  \ 方法如下：\n\n![img](img/00773.jpeg)\n7.10 所示的 Airport 类方法\n\n![img](img/00774.jpeg)\n\
  ![img](img/00775.jpeg)\n![img](img/00776.jpeg)\n![img](img/00777.jpeg)\n**示例 7.10\
  \ Airport 类，版本 5**\n\n在 `toString` 方法（ 98-106 行）中，我们首先通过实例化 `DecimalFormat` 对象来将油量格式化为一位小数的浮点数。注意，`gallonsFormat`\
  \ 是 `toString` 方法的局部变量；也就是说只有 `toString` 方法可以使用它。为了使用 `DecimalFormat` 类，我们在第 5 行导入了该类。然后我们通过拼接每个实例变量的标签及其值来构建返回的\
  \ `String`。`toString` 方法可以在包含 `main` 方法的客户端中使用，例如通过一个语句打印 `Airport` 对象。\n\n为了实现\
  \ `equals` 方法（108-125 行），我们首先检查参数类型是否为 `Auto`。`instanceof` 二元运算符（左操作数是对象引用，右操作数为类）在对象引用可以转换为该类的实例（例如，如果它是该类的对象引用）时返回\
  \ `true`，否则返回 `false`。（参见表 7.4）。我们在第 112 行使用 `instanceof` 运算符判断参数 `o` 是否可以转换为 `Auto`\
  \ 对象引用（通常情况下，从客户端发送时，`o` 是 `Auto` 引用）。如果不能，我们返回 `false`；否则，我们可以继续比较 `o` 的字段和此 `Auto`\
  \ 对象的字段。在执行比较之前，我们必须将 `Object` 引用 `o` 强制 `Auto`（第 116 行），否则在尝试通过 `Object o` 访问实例变量\
  \ `model` 时会导致编译错误。\n\n\n\n我们将参数对象 `objAuto` 中的每个实例变量与此对象中相同的实例变量进行比较。如果每个对象中对应的实例变量值相同，我们返回\
  \ `true`；否则，我们返回 `false`。\n\n请注意，第 117 行调用了 `String` 类的 `equals` 方法来比较对象中 `model`\
  \ 的值，因为 `model` 是一个 `String` 对象引用。同样请注意，由于实例变量在方法的作用域内，我们的 `equals` 方法能够直接访问此对象和\
  \ `Auto` 对象 `objAuto` 的实例变量。\n\n示例 7.11 展示了 `Auto` 类版本 5 的用法。我们实例化两个仅在 `model` 上不同的对象。在第\
  \ 10 行，我们显式地调用 `toString` 来打印字段。在第 14 行，我们隐式地调用 `toString` 方法；因为对象是发送给 `println`\
  \ 方法的参数，它将其转换为 `String`。在第 16–19 行，我们使用 `equals` 方法比较两个对象并打印结果。输出如图 7.7 所示。\n\n\
