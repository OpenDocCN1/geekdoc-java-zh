  \n如果输入不匹配类型，则会生成 InputMismatchException，程序停止 图 3.18\n\n### 调用静态方法和静态变量\n\n类也可以定义**静态方法**，无需实例化对象即可调用。这些方法的返回类型前带有\
  \ `static` 关键字：\n\n```\n![img](img/00256.jpeg)\n```\n\n类定义静态方法的原因之一是为了提供快速的一次性功能，而无需客户端实例化对象。例如，对话框通常在程序中弹出。当对话框只使用一次时，创建一个对象是非常浪费内存和时间的。我们在本章稍后部分介绍如何在不创建对象的情况下创建对话框。\n\
  \n类，或静态，方法使用类名而不是对象引用来调用，如下：\n\n```\n![img](img/00257.jpeg)\n```\n\n例如，在语句语句：\n\n\
  ```\n![img](img/00258.jpeg)\n```\n\n类名为 `Math`，静态方法是 `abs`，它返回参数 `someNumber` 的绝对值。我们使用类名而不是对象引用，因为静态方法可以在不实例化的情况下调用。在本章稍后部分，我们将更详细地探讨\
  \ `Math` 类的一些静态方法。\n\n由于静态方法可以在不实例化的情况下调用，静态方法无法访问类的实例变量（因为实例变量是对象数据，只有在实例化对象后才存在）。然而，静态方法可以访问静态数据，类通常会声明用于静态方法的静态数据。静态数据属于类，而不是属于类的特定对象或实例。\n\
  \n静态类变量的常见用法是定义常用值的常量或作为静态类方法的参数。例如，`Math` 类定义的两个静态常量以方便使用 pi 和自然对数。\n\n类似于静态方法，静态常量也使用类名和点操作符访问，如下：\n\
  \n```\n![img](img/00259.jpeg)\n```\n\n因此，可以这样访问代表 pi 值的静态常量：\n\n```\n![img](img/00260.jpeg)\n\
  ```\n\n\n\n\n\n起初，这似乎违背了我们之前关于封装以及限制客户端直接访问对象数据的讨论。还记得我们说过，客户端需要使用访问器方法（“gets”）和变异器方法（“sets”）来访问对象数据。封装背后的逻辑是保护对象数据免受客户端的损坏。然而，在这种情况下，*static*\
  \ 静态数据是常量，因此客户端无法更改它。对于客户端来说，直接访问类常量比调用方法更简单、更快。\n\n## 3.12 使用 `System.in` 和 `System.out`\n\
