  \ `Auto` 类，以下语句声明了这个存储 `Auto` 对象的二维数组：\n\n![img](img/01107.jpeg)\n\n你也可以通过在每个数组名称后插入逗号，使用以下语法在一个语句中声明多个相同数据类型的多维数组：\n\
  \n![img](img/01108.jpeg)\n\n例如，以下语句将声明两个整数数组，用于存储两名棒球运动员在职业生涯中每场比赛的盗垒次数：\n\n![img](img/01109.jpeg)\n\
