  \ | 技术写作 |\n| | 题目 73 |\n\n## 14.5 栈的数组表示\n\n在本章前面，我们讨论了如何用链表来表示栈。由于栈是一个后进先出的数据结构，我们编写了链表的\
  \ `push`（插入）和 `pop`（删除）方法，以便在列表开头进行插入或删除。链表的优势是可以一次一个对象地进行扩展，因此我们不需要担心容量耗尽。\n\n\
  然而，如果我们预先栈上的对象数量将小于某个最大值，我们就可以使用数组来表示栈，这样更容易实现。\n\n表 14.6 显示了使用数组实现的栈的 `push`、`pop`\
  \ 和 `peek` 方法的 API。\n\n为了匹配栈的 LIFO 功能，我们根据最大元素数量实例化数组。我们从索引 0 开始向栈添加项，将项存储在数组的相邻位置。为了跟踪最后插入元素的数组索引，我们维护一个索引\
  \ `top`，它是“栈顶”（top of the stack）的简称。我们总是移除（`pop`）栈顶项。\n\n### 表 14.6 `ArrayStack`\
  \ 方法\n\n| `ArrayStack` 方法 | 返回值 | 方法名和参数 |\n| :--- | :--- | :--- |\n| `ArrayStack`\
  \ 类 | | |\n| `boolean` | `push(p)` | `push(p)` 在栈顶插入 `Player`。如果成功返回 `true`，否则返回\
  \ `false`。 |\n| `Player` | `pop()` | `pop()` 并返回栈顶的 `Player`。如果栈为空，抛出 `DataStructureException`。\
  \ |\n| `Player` | `peek()` | `peek()` 返回栈顶的 `Player`。如果栈为空，抛出 `DataStructureException`。\
  \ |\n\n向栈推入项时，我们将 `top` 的值加 1。从栈弹出项时，我们将 `top` 减 1。\n\n图 14.11a 显示了 `Player` 栈。图\
  \ 14.11b 显示推入一个元素后的栈。图 14.11c 显示弹出一次后的栈。\n\n用数组实现栈的一个缺点是数组大小是固定的，数组可能会填满。因此，我们的\
  \ `push` 方法需要测试数组是否满。同样，我们的 `pop` 方法需要测试数组是否为空。\n\n```\n![img](img/01895.jpeg)\n\
  ```\n**图 14.11a 栈**\n\n```\n![img](img/01896.jpeg)\n```\n**图 14.11b 推入 Player 后**\n\
  \n```\n![img](img/01897.jpeg)\n```\n**图 14.11c 弹出后**\n\n示例 14.12 显示了 `ArrayStack`\
  \ 类。\n\n## 示例 14.12 `ArrayStack` 类\n\n我们在第 7 到 9 行声明了 `STACK_SIZE`、`stack` 和 `top`\
  \ 这三个字段。*栈*是一个 `Player` 数组。STACK_SIZE 是数组 `stack` 的大小。Top 代表 `stack` 中栈顶元素的索引。`top`\
  \ 的值会从 -1（栈空）到 STACK_SIZE–1（栈满）。\n\n在第 11 到 15 行的默认构造函数中，我们实例化 `stack` 然后将 `top`\
  \ 设置为 -1，这表示栈为空。当客户端程序将第一个 `Player` 推入栈时，`top` 将增加，使得栈顶变为索引 0 的数组元素。\n\n我们在第 17\
  \ 到 30 行编写了 `push` 方法。如果在插入前栈未满，则 `push` 方法在第 26 行返回 `true`；如果已满，则在第 29 行返回 `false`。我们在第\
  \ 23 行测试栈是否未满。如果未满，我们在第 25 行使用前增运算符合并两个操作：先将 `top` 加 1，然后将 `push` 方法的参数 `p` 分配给索引\
  \ `top` 的元素。\n\n我们在第 32 到 42 行编写了 `pop` 方法。`pop` 方法尝试从栈顶删除并返回一个 `Player` 对象。如果栈为空，在第\
  \ 40 到 41 行*抛出* `DataStructureException`，此时我们无法弹出。如果栈不为空，我们在第 38 行使用后减运算符合并两个操作：首先返回在数组\
  \ `stack` 中索引 `top` 的 `Player`，然后将 `top` 减 1。\n\n\n\n\n我们在这个类中还编写了其他几个方法。`peek`\
  \ 方法（第 44–54 行）与 `pop` ，不同在于它不会从栈中删除元素，而是返回栈顶的元素。同样，这允许客户端直接更新栈中的该对象。`isEmpty` 和\
  \ `isFull` 方法分别编写在第 56–62 行和第 64–70 行。编写在第 72–78 行的 `toString` 方法返回栈内容的 `String`\
  \ 表示。请注意，在该方法中，我们是从 `top` 循环到 0，而不是从 `STACK_SIZE – 1` 循环到 0。\n\n与之前一样，可以编写与示例 14.9\
  \ 类似的程序，来测试 `ArrayStack` 类方法的所有可能场景。这在练习题的短程序部分有所建议。\n\n![img](img/00005.jpeg) **常见错误陷阱**\n\
  \n不要将栈顶与数组的最后一个索引混淆。索引高于 `top` 的数组元素不在栈中。\n\n## 14.6 编程活动 1：为栈类编写方法\n\n在此活动中，你将处理一个由数组表示的栈，执行此活动：\n\
