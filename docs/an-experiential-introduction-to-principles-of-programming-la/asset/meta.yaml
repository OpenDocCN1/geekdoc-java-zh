- - '####'
  - 11.5.1. [倒计时] 编写一个 `Msglang` 程序，声明一个进程，在接收到数字 `n` 作为消息时打印 `n`，然后向自己发送 `n-1` 作为消息。当
    `n` 为 `0` 时，倒计时结束。
- - '####'
  - 11.5.2. [状态机] 编写一个 `Msglang` 程序来建模一个状态机。如果进程接收包含数字 `0` 的消息，随后接收另一个包含数字 `1` 的消息，则打印“accept”；否则打印“reject”。
- - '####'
  - 11.5.3. [进程排序] 使用 `Msglang` 特性，定义一个基于进程的正负数排序结构。该结构由四个全局引用表示（`posevenbin`, `posodd`,
    `negevenbin`, `negodd`）桶组成，每个桶包含一个数字列表。每个桶初始为空列表。排序结构本身由七个组织成完美二叉树的进程组成。第一个名为
    `main` 的进程接收输入数字，并根据数字的正负情况将数字及其自身的地址转发给它的两个子进程 `pos` 和 `neg` 之一。`pos` 和 `neg`
    都有各自的两个子进程，即 `poseven` 和 `posodd`，以及 `negeven` 和 `negodd`，它们会将接收到的数字如果是偶数则转发给
    `even`，如果是奇数转发给 `odd`。除了数字外，每个进程还会接收主进程的地址。
- - '####'
  - 11.5.4. [宽消息] 在 `Msglang` 的当前设计中，如果收到的消息基数与发送消息匹配，`receive` 表达式将失败。如果发送者发送了比接收者需要的更多的值（称为
    `wider messages`），另一种设计可能会丢弃接收到的额外值并继续评估 `receive` 表达式的主体。换句话说，接收较少的值可能会让接收者意外，但接收更多值可能不会，尽管这确实有一种“代码错误”。
- - '####'
  - 11.5.5. [乱序交付] 在 `Msglang` 的当前设计中，`send` 表达式将消息发送给接收而不等待接收者的响应。这种消息交付被称为 `asynchronous
    message send`（异步消息发送）或 `nonblocking send`（非阻塞发送）。`receive` 表达式的主体是接收者的响应。
- - '####'
  - 11.5.6. [优先级处理] `receive` 表达式的第一个字段是优先级（正整数），优先级越小越高。
