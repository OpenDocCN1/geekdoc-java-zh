  - 8.9.2. `Fork many` 扩展，`fork` 表达式使其创建两个或多个并发任务。
- - '####'
  - 8.9.3. `Protected access` 在 Forklang 语言中，任务可以在不获取锁的情况下访问内存。这使得任务可能在另一个任务的执行过程中引入错误。修改
    Forklang读写操作，使其强制锁。
- - '####'
  - 8.9.4. `Data races` 问题与 Forklang 程序中的数据竞态有关。
- - '####'
  - 8.9.5. `Deadlock` 问题关于 Forklang 程序中的死锁：
- - '####'
  - 8.9.6. `Synchronized blocks` Forklang 支持锁定和解锁以同步内存的访问（读写）。
- - '####'
  - 8.9.7. [传递堆的解释器] 我们对 Forklang 语言的实现维护了一个共享堆。那些直接评估的程序会操作这个共享堆。这种优点是避免了到处传递对象（类似于环境）。这种缺点是难以实现堆语义，即程序的部分可能使用原始堆的变体。
- - '####'
  - 8.9.8. [Fork 进程] 我们对 Forklang 语言的实现创建了线程。在某些编程语言中，`fork` 会创建一个独立的进程（被分叉的任务和原始任务不共享内存）。本次练习中，你将逐步修改
    Forklang解释器以进程。
