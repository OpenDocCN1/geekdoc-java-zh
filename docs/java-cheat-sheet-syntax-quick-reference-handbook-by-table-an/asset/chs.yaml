  \ \"volatile variable\" 直接由主内存读写，而不是通过缓存。\n// \"volatile\" 关键字可以确保多线程的安全性。\n\ne.g.\n\
  \n```java\npublic class VolatileClass extends Thread{\n    volatile boolean isRunning\
  \ = true; // 定义一个 volatile 变量\n    public void run() {   // 线程\n        long num=0;\n\
  \        while (isRunning) {\n            num++;\n        }\n        System.out.println(\"\
  Thread is stopped.\" + num);\n    }\n    public static void main(String[] args)\
  \ throws InterruptedException{\n        VolatileClass th = new VolatileClass();\n\
  \        th.start();   // 启动线程\n        Thread.sleep(1800);\n        th.isRunning\
  \ = false;  \n        // 变量 \"isRunning\" 可以被其他线程读写\n        th.join();\n      \
  \  System.out.println(\"Because isRunning is \" + th.isRunning);\n    }\n}\n```\n\
