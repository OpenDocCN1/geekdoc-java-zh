  \ |\n| `equals()` | 检查两个对象是否相等 |\n| `hashCode()` | 创建对象的哈希码 |\n\n## 默认、公共、私有、保护表\n\
  \nJava 有四种修饰符来定义成员。`public`、`protected`、`default`、`private` 的访问权限如下：\n\n| 访问者： |\
  \ public | protect |\n| :--- | :--- | :--- |\n| 同一个包中的同一个类 | ok | ok |\n| 同包中的父类和子类\
  \ | ok | ok |\n| 不同包中的父类和子类 | ok | ok |\n| 不同包中的非父类非子类 | ok | |\n\n- `\"public\"\
  ` 成员可以在任何包和类中访问。\n- `\"protected\"` 成员不能在非父类或非子类中访问。\n- `\"default\"` 成员不能在不同的包访问。\n\
  - `\"private\"` 成员不能在不同的类中访问。\n\n## 抽象表\n\n```java\nabstract class books {\n   \
  \ // 定义一个抽象类\n    abstract int read();\n    // 定义一个抽象方法\n}\n\nclass eBooks extends\
  \ books {\n    // 扩展父类\n    int read() { return …; }\n    // 重写抽象方法\n}\n```\n\n\
  ## 接口表\n\n```java\ninterface books {\n    // 定义一个接口\n    int title();\n    // 定义一个空方法\n\
  }\n\nclass eBooks implement books {\n    // 实现接口\n    public int title() {\n   \
  \     // 实现空方法\n        return …,;\n    }\n}\n```\n\n## 线程方法表\n\n| 方法 | 描述 |\n|\
  \ :--- | :--- |\n| `start()` | 启动线程。 |\n| `stop()` | 停止线程。 |\n| `sleep()` | 让线程睡眠一段时间。\
  \ |\n| `wait()` | 让线程处于等待状态。 |\n| `notify()` | 唤醒正在等待的线程。 |\n| `yield()` | 让相同优先级的线程运行。\
  \ |\n| `isAlive()` | 测试当前线程存活。 |\n| `currentThread()` | 获取当前线程。 |\n| `interrupt()`\
  \ | 停止“阻塞”的线程。 |\n| `suspend()` | 让线程暂停。 |\n| `resume()` | 重新启动线程。 |\n| `join()`\
  \ | 在另一个线程结束后运行此线程。 |\n\n## 修饰符表\n\n| 修饰符 | 描述 |\n| :--- | :--- |\n| `final` | 不能被重写/修改\
