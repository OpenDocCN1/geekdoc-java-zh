  Perfect\");\n        mySet.add(\"Book\");\n        System.out.println( mySet );\n\
  \    }\n}\n```\nOutput: [ Book, Very, Perfect ]\n\nNote:\n- `TreeSet` 输出排序且唯一的值。\n\
  - `HashSet` 输出无序且唯一的值。\n\n------------------------------------------------------------------------------\n\
