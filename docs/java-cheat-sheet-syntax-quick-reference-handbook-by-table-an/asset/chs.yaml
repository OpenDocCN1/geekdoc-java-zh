  \ nextAfter() 语法:\n\n`Math.nextAfter(x, y)`\n// 返回在 `y` 方向上相邻 `x` 的数字\n\n例如：\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        double\
  \ x = 6.5f;\n        double y = 9.8f;\n        System.out.println(Math.nextAfter(x,\
  \ y));\n    }\n}\n```\n// 输出: 6.500000000000001\n\n## nextDown() 语法:\n\n`Math.nextDown(num)`\n\
  // 返回在负无穷大方向上相邻 `num` 的数字\n\n例如：\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        float num1 = 6.8f;\n        System.out.println(Math.nextDown(num1));\n\
  \        double num2 = 6.8d;\n        System.out.println(Math.nextDown(num2));\n\
  \    }\n}\n```\n// 输出:\n6.7999997\n6.799999999999999\n\n## nextLine() 语法:\n\n`Scanner\
  \ obj = new Scanner(fileObj);`\n// 创建文件读取对象\n`String content = obj.nextLine();`\n\
  // 读取文件的每一行\n\n例如：\n// 假设 `myFile.txt` 中的内容为 \"Java in 8 Hours\"。\n```java\nimport\
  \ java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\n\
  \npublic class Main { \n    public static void main(String[] args) { \n        try\
  \ {     \n            File fileObj = new File(\"myFile.txt\");\n            Scanner\
  \ obj = new Scanner(fileObj);\n            while (obj.hasNextLine()) {\n       \
  \         String content = obj.nextLine();     // 文件读取\n                System.out.println(content);\n\
  \            }\n            obj.close();\n        } catch (FileNotFoundException\
  \ e) {\n            System.out.println(\"发生错误.\");\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n// 输出: Java in 8 Hours\n\n## nextUp() 语法:\n\n`Math.nextUp(num)`\n\
  // 返回在正无穷大方向上相邻 `num` 的数字\n\n例如：\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        float num1 = 6.8f;\n        System.out.println(Math.nextUp(num1));\n\
  \        double num2 = 6.8d;\n        System.out.println(Math.nextUp(num2));\n \
  \   }\n}\n```\n// 输出:\n6.8000007\n6.800000000000001\n\n## now() 语法:\n\n`LocalDate\
  \ obj = LocalDate.now()`\n// 创建日期对象\n\n例如：\n```java\nimport java.time.LocalDate;\
