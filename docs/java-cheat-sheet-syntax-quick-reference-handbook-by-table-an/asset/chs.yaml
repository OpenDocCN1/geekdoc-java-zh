  - `Paper` 语法](#part0004.xhtml_a6KY)\n\n## & 语法\n\n`&` 作为关系运算符使用：\n\n当两个条件都为真时返回真，其中一个条件为假时返回假。\n\
  \n```java\npublic class Main {\n    public static void main(String[] args){\n  \
  \      int x = 100, y = 90, z = 60;\n        if ((x > y) & (x > z))\n          \
  \  System.out.println(\"The value of x is \" + x);\n    }\n}\n```\n输出：The value\
  \ of x is 100\n\n- 2. 按位与\n\n`&` 用于按位与：\n\n如果对应的位都为 1，则返回 1，否则返回 0。\n\n示例：\n```java\n\
  public class Main {\n    public static void main(String[] args){\n        int x=\
  \ 4;\n        int y = 6;\n        int z = x & y;\n        System.out.println(x +\
  \ \" & \" + y + \" = \" + z);\n    }\n}\n```\n输出：4 & 6 = 4\n\n## | 语法\n\n`|` 用于按位或：\n\
  \n如果其中一个位为 1，返回 1，所有位都为 0 时返回 0。\n\n示例：\n```java\npublic class Main {\n    public\
  \ static void main(String[] args){\n        int x= 4;\n        int y = 6;\n    \
  \    int z = x | y;\n        System.out.println(x + \" | \" + y + \" = \" + z);\n\
  \    }\n}\n```\n输出：4 | 6 = 6\n\n## ^ 语法\n\n`^` 用于按位异异：\n\n如果对应的位不同，则返回 1，相同则返回 0。\n\
  \n示例：\n```java\npublic class Main {\n    public static void main(String[] args){\n\
  \        int x= 4;\n        int y = 6;\n        int z = x ^ y;\n        System.out.println(x\
  \ + \" ^ \" + y + \" = \" + z);\n    }\n}\n```\n输出：4 ^ 6 = 2\n\n## << 语法\n\n`operand\
  \ << bits`\n根据给定的位数位数左移所有位。\n\n示例：\n```java\npublic class Main {\n    public static\
  \ void main (String[] args) {\n        int operand = 2;\n        // 左移 2 位\n   \
  \     int n = operand << 2;\n        System.out.println(n);\n    }\n}\n```\n输出：8\n\
  \n## >> 语法\n\n`operand >> bits`\n\n\n\n\n\n# 右移运算符 (>>)\n\n根据给定的位数右移所有位。\n\n例如：\n\
  ```java\npublic class Main {\n    public static void main (String[] args) {\n  \
  \      int operand = 8;\n        // 向右移 2 位\n        int n = operand >> 2;\n   \
  \     System.out.println(n);\n    }\n}\n```\n// 输出: 2\n\n## 无符号右移 (>>>)\n\n语法：`operand`\
  \ >>> `bits`\n\n根据给定的位数右移所有位。\n最左侧的空缺将用 0 填充。\n无符号右移。\n\n例如：假设 `-2 = 11111110`\n\
  `-2 >>> 1` // 返回 `01111111`\n\n# 注释\n\n## `//` 和 `/* */`\n\n语法：\n\n单行注释以两个正斜杠 `//`\
  \ 开始。\n多行注释以 `/*` 开始，并以 `*/` 结束。\n\n例如：\n```java\npublic class Main {\n    public\
  \ static void main(String[] args) {\n        // 这是一个单行注释\n        System.out.println(\"\
  Hello World\");\n        /* 这是一个多行注释。\n           此程序将打印我们的 Hello World\n      \
  \  */\n    }\n}\n```\n// 输出: Hello World\n\n# 三元运算符 (:)\n\n语法：\n`(bool-expression)\
  \ ? (if-true-do-this) : (if-false-do-this);`\n\n根据布尔表达式的结果执行语句中的某一个。\n\n例如(1)：\n\
  ```java\nint a=100; int b=300;\nString result1 = (a<b) ? \"orange\" : \"pineapple\"\
  ;\nSystem.out.print ( result1);\n```\n// 输出: orange\n\n例如(2)：\n```java\nint a=100;\
  \ int b=300;\nString result2 = (a>b) ? \"orange\" : \"pineapple\";\nSystem.out.print\
  \ ( result2 );\n```\n// 输出: pineapple\n\n## 字符串拼接\n\n## + 连接符号语法：\n\n`str = str1\
  \ + str2;`\n`str = str1.concat(str2);`\n\n`+` 可以连接两个字符串。\n`concat()` 可以连接两个字符串。\n\
  \n例如：\n```java\nString s1 = \"Hello\"; String s2 = \"Friends\";\nSystem.out.print(\
  \ s1 + s2);  // 连接两个字符串\nSystem.out.print( s1.concat (s2));  // 连接两个字符串\n```\n//\
  \ 输出: Hello Friends\n\n# Math 方法\n\n## abs() 语法：\n\n`Math.abs(number)`\n\n返回数字的绝对值。\n\
  \n例如：\n```java\npublic class Main {\n    public static void main(String[] args)\
  \ {\n        System.out.println(Math.abs(-168.88));\n        System.out.println(Math.abs(168.88));\n\
  \    }\n}\n```\n// 输出:\n168.88\n168.88\n\n# 抽象类与方法\n\n## abstract 语法：\n\n`abstract\
  \ class/method`\n\n`abstract` 用于类或方法。\n抽象类作为父类工作，会被其子类扩展。子类的方法将重写抽象类的抽象方法。\n`abstract\
  \ class` 不能创建任何对象。\n`abstract method` 仅用于抽象类。\n`abstract method` 是一个没有方法体的空方法。\n\
  \n例如：\n```java\nabstract class Book{ // 创建一个抽象类\n    abstract void reading(); //\
  \ 创建一个抽象方法\n}\nclass eBook extends Book{ // 扩展父类\n    void reading(){ // 重写抽象方法\n\
  \        System.out.println(\"I override that abstract method.\");\n    }\n}\npublic\
  \ class AbstractDemo {\n    public static void main(String[] args){\n        eBook\
  \ obj =new eBook();\n        obj.reading();\n    }\n}\n```\n// 输出: I override that\
  \ abstract method.\n\n## acos() 语法：\n\n`Math.acos(number)`\n\n返回数字的反余弦值。\n\n例如：\n\
  ```java\npublic class Main {\n    public static void main(String[] args) {\n   \
  \     System.out.println(Math.acos(0.88));\n        System.out.println(Math.acos(-0.88));\n\
  \        System.out.println(Math.acos(0));\n    }\n}\n```\n// 输出:\n0.4949341263408955\n\
  2.646658527248898\n1.5707963267948966\n\n# 集合 (Collections)\n\n## add() 语法：\n\n\
  `collection.add(element);`\n\n向集合中添加元素。\n`Collection` 指 `LinkedList`, `ArrayList`,\
  \ `HashSet` 和 `List`。\n\n例如：\n```java\nimport java.util.HashSet;\nimport java.util.Set;\n\
  public class MyClass { \n    public static void main(String[] args) {\n        Set<Integer>\
  \ mySet = new HashSet<>();\n        // 在此集合中添加整数值\n        mySet.add(10);\n    \
  \    mySet.add(20);\n        mySet.add(30);\n        System.out.print(\"Collection\
  \ elements : \");\n        System.out.println(mySet);\n    }\n}\n```\n// 输出: Collection\
  \ elements : [10, 20, 30]\n\n## addAll() 语法：\n\n`collection.addAll(element);`\n\n\
  向集合中添加所有元素。\n`Collection` 指 `LinkedList`, `ArrayList`, `HashSet` 和 `List`。\n\n例如：\n\
  ```java\nimport java.util.HashSet;\nimport java.util.Set;\npublic class MyClass\
  \ { \n    public static void main(String[] args) {\n        Set<Integer> mySet =\
  \ new HashSet<>();\n        // 在此集合中添加整数值\n        mySet.add(10);\n        mySet.add(20);\n\
  \        mySet.add(30);\n        System.out.print(\"Collection elements : \");\n\
  \        System.out.println(mySet);\n    }\n}\n```\n// 输出: Collection elements :\
  \ [10, 20, 30]\n\n# Math 方法\n\n## addExact() 语法：\n\n`addExact(num1, num2)`\n\n返回两个数字的和。\n\
  \n例如：\n```java\npublic class Main {\n    public static void main(String[] args)\
  \ {\n        int num1 = 10;\n        int num2 = 20;\n        System.out.println(Math.addExact(num1,\
  \ num2));\n    }\n}\n```\n// 输出: 30\n\n# 匿名函数\n\n## 匿名函数语法：\n\n`(parameter) -> {\
  \ body }`\n\n匿名函数是没有没有函数。\n\n例如：\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        Runnable r = () -> {\n            System.out.println(\"\
  Anonymous function\");\n        };\n        r.run();\n    }\n}\n```\n// 输出: Anonymous\
  \ function\n\n# 算术运算符\n\n## 算术运算符语法：\n\n`+`, `-`, `*`, `/`, `%`, `++`, `--`\n\n\
  `+` 加法。\n`-` 减法。\n`*` 乘法。\n`/` 除法。\n`%` 取模。\n`++` 增一。\n`--` 减一。\n\n例如：\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        int a\
  \ = 10;\n        int b = 3;\n        System.out.println(a + b);\n        System.out.println(a\
  \ - b);\n        System.out.println(a * b);\n        System.out.println(a / b);\n\
  \        System.out.println(a % b);\n        a++;\n        System.out.println(a);\n\
  \        a--;\n        System.out.println(a);\n    }\n}\n```\n// 输出: 13\n7\n30\n\
  3\n1\n11\n10\n\n# 数组\n\n## 语法：\n\n`int arrayName[] = {\"value0\", \"value1\", \"\
  value2\", ...};`\n\n数组是一个存储值的容器对象。\n\n例如：\n```java\nint[] arr = { 10, 11, 12, 13\
  \ };\nSystem.out.println(arr[0]);\n```\n// 输出: 10\n\n## 数组初始化：\n\n`int arrayName[]\
  \ = new int[number of elements];`\n\n带有固定大小数组。\n\n例如：\n```java\nint[] arr = new\
  \ int[3];\narr[0] = 10;\narr[1] = 20;\narr[2] = 30;\n```\n\n## 数组元素语法：\n\n`value\
  \ = arrayName[index];`\n\n使用索引访问或分配数组元素。\n\n\n\n\n\n### 数组操作\n\n```java\n// 从元素中获取值。\n\
  int array[index] = value;\n```\n\n// 给元素赋值。\n\ne.g.\n```java\nint myArr[] = {10,\
  \ 20, 300, 40, 50};\nint val = myArr[2];  // 从元素中获取值\nSystem.out.println(val);\n\
  // 输出: 300\n```\n\ne.g.\n```java\nint myNum[] = new int [5];\nmyNum[2] = 80;   \
  \  // 给元素赋值\nSystem.out.println(myNum[2]);\n// 输出: 80\n```\n\n### 数组长度语法\n\n```java\n\
  arrayName.length;\n```\n// 返回数组的元素总数。\n\ne.g.\n```java\npublic class ArrLenClass{\n\
  \    public static void main (String [] args){\n        int myArr[] = {100,200,300};\
  \  // 创建数组 \"myArr\"\n        int len = myArr.length;  // 获取数组的长度\n        System.out.print\
  \ (len);\n    }\n}\n// 输出: 3\n```\n\n### 数组排序语法\n\n```java\nArrays.sort(array_name);\n\
  ```\n// 对数组元素排序并顺序显示结果。\n// 在使用 `Arrays.sort()` 之前，必须 `import java.util.Arrays;`。\n\
  \ne.g.\n```java\npackage tryPackage;\nimport java.util.Arrays;\npublic class SortArrClass{\n\
  \    public static void main (String [] args){\n        String arr[] = { \"Cod\"\
  , \"App\", \"Dot\", \"Bay\"};\n        Arrays.sort(arr);   // 对数组排序\n        for(int\
  \ n=0; n<arr.length; n++){    // 运行 4 次\n            System.out.print (arr[n]+\"\
  \ \");     // n 是键\n        }\n    }\n}\n// 输出: App Bay Cod Dot\n```\n\n# ArrayList\
  \ 语法\n\n```java\nArrayList myList = new ArrayList();\n```\n// 创建一个 `ArrayList` 对象。\n\
  // `ArrayList` 类是一个可调整大小的数组，可以修改 `ArrayList` 的大小。\n// `ArrayList` 是一个动态数据结构，它可以在列表中快速地迭代或搜索指定的元素。\n\
  \ne.g.\n```java\nimport java.util.*;\npublic class MyArrayList{\n    public static\
  \ void main(String[ ] args) {\n        ArrayList myList = new ArrayList();   //\
  \ 创建 ArrayList 对象\n        myList.add(new Integer(10));      // 向 myList 中添加元素\n\
  \        myList.add(new Integer(20));\n        myList.add(new Integer(30));\n  \
  \      System.out.print(myList);\n    }\n}\n// 输出: [ 10, 20, 30 ]\n```\n\n**注意：**\n\
