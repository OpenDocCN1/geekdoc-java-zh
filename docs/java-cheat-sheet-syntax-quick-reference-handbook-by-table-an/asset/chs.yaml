  \n## object 语法:\n\n`obj = new ClassName();` // 创建一个对象，类的类的实例。\n`obj.variable`  \
  \   // `obj` 引用一个变量\n`obj.method()`     // `obj` 引用一个方法()\n\n例如：\n```java\npublic\
  \ class Flower {      // 定义一个类\n    String co1, co2;      // 定义两个变量\n    void beautify()\
  \ {      // 定义一个方法\n        System.out.println(\"This flower is \" + co1);\n   \
  \     System.out.println(\"That flower is \" + co2);\n    }\n    public static void\
  \ main(String[] args) {\n        Flower obj = new Flower( );      // 创建一个对象 \"obj\"\
  \n        obj.co1= \"red.\";   obj.co2=\"blue.\";     // obj 引用 co1, co2\n     \
  \   obj.beautify();      // obj 引用一个方法 beautify()\n    }\n}\n```\n// 输出:\nThis flower\
  \ is red.\nThat flower is blue.\n\n## offsetByCodePoints() 语法:\n\n`str.offsetByCodePoints(int\
  \ index, int codePointOffset)`\n// 返回 `String` 中的一个索引，该索引是相对于给定索引的偏移量\n// 偏移量基于\
  \ `codePointOffset` 的代码点\n// `index`: 要偏移的索引。\n// `codePointOffset`: 代码点中的偏移量。\n\
  \n例如：\n```java\nimport java.lang.*;\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        String str = \"JavaScript\";\n        System.out.println(\"\
