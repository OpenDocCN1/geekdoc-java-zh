  \n### LinkedList 语法:\n\n```java\nLinkedList myList = new LinkedList();\n```\n//\
  \ 创建一个 `LinkedList` 对象\n// `LinkedList` 类是一个可调整大小的数组，可以修改 `LinkedList` 的大小。\n//\
  \ `LinkedList` 列表中的每个元素都引用列表中的下一个元素。也就是说，`LinkedList` 按索引位置排序；并允许添加或删除元素。\n\ne.g.\n\
  \n```java\nimport java.util.*;\npublic class MyLinkedList{\n    public static void\
  \ main(String args[ ]){\n        LinkedList myList = new LinkedList(); // 创建一个 LinkedList\
  \ 对象\n        myList.add(\"Hello! \"); // 向 myList 中添加元素\n        myList.add(\"\
  My \");\n        myList.add(\"Friend. \");\n        showList(myList); // 调用函数\n\
  \    }\n\n    static void showList(LinkedList myList){\n        Iterator i = myList.iterator();\
  \ // 创建 \"myList\" 的迭代器对象\n        while(i.hasNext()){ // 检查 myList 是否有元素\n    \
  \        Object obj = i.next();\n            System.out.print(obj.toString());\n\
  \        }\n    }\n}\n```\n\n// 输出: Hello! My Friend.\n// 注意:\n`LinkedList` 和 `ArrayList`\
  \ 的区别：\n`LinkedList` 在添加、插入和删除元素时运行快。\n`ArrayList` 在迭代和搜索元素时运行快。\n\n------------------------------------------------------------------------------\n\
  \n### LinkedList 函数语法:\n\n```java\nobj.addFirst(\"value\"); // 添加第一个项\nobj.addLast(\"\
  value\"); // 添加最后一个项\nobj.getFirst(); // 获取第一个项\nobj.getLast(); // 获取最后一个项\nobj.removeFirst();\
  \ // 删除第一个项\nobj.removeLast(); // 删除最后一个项\n\ne.g.\n\n```java\nimport java.util.*;\n\
  public class Main {\n    public static void main(String[] args) {\n        LinkedList<String>\
  \ colors = new LinkedList<>();\n        colors.add(\"Red\");\n        colors.add(\"\
  Blue\");\n        colors.addFirst(\"Yellow\");\n        colors.addLast(\"Green\"\
  );\n        System.out.println(colors.getFirst());\n        System.out.println(colors.getLast());\n\
  \        colors.removeFirst();\n        colors.removeLast();\n        System.out.println(colors);\n\
  \    }\n}\n```\n\n// 输出:\nYellow\nGreen\n[Red, Blue]\n\n------------------------------------------------------------------------------\n\
