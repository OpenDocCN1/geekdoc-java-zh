    \ int len = myArr.length;  // 获取数组的长度\n        System.out.print (len);\n    }\n\
    }\n// 输出: 3\n```\n\n### 数组排序语法\n\n```java\nArrays.sort(array_name);\n```\n// 对数组元素排序并顺序显示结果。\n\
    // 在使用 `Arrays.sort()` 之前，必须 `import java.util.Arrays;`。\n\ne.g.\n```java\npackage\
    \ tryPackage;\nimport java.util.Arrays;\npublic class SortArrClass{\n    public\
    \ static void main (String [] args){\n        String arr[] = { \"Cod\", \"App\"\
    , \"Dot\", \"Bay\"};\n        Arrays.sort(arr);   // 对数组排序\n        for(int n=0;\
    \ n<arr.length; n++){    // 运行 4 次\n            System.out.print (arr[n]+\" \"\
    );     // n 是键\n        }\n    }\n}\n// 输出: App Bay Cod Dot\n```\n\n### ArrayList\
    \ 语法\n\n```java\nArrayList myList = new ArrayList();\n```\n// 创建一个 `ArrayList`\
    \ 对象。\n// `ArrayList` 类是一个可调整大小的数组，可以修改 `ArrayList` 的大小。\n// `ArrayList` 是一个动态数据结构，它可以在列表中快速地迭代或搜索指定的元素。\n\
    \ne.g.\n```java\nimport java.util.*;\npublic class MyArrayList{\n    public static\
    \ void main(String[ ] args) {\n        ArrayList myList = new ArrayList();   //\
    \ 创建 ArrayList 对象\n        myList.add(new Integer(10));      // 向 myList 中添加元素\n\
    \        myList.add(new Integer(20));\n        myList.add(new Integer(30));\n\
    \        System.out.print(myList);\n    }\n}\n// 输出: [ 10, 20, 30 ]\n```\n\n**注意：**\n\
    `LinkedList` 和 `ArrayList` 的区别：\n- `LinkedList` 在添加、插入和删除元素时运行快。\n- `ArrayList`\
    \ 在迭代和搜索元素时运行快。\n\n### ArrayList 函数\n\n- `obj.add()`: 添加元素\n- `obj.get()`: 获取元素值\n\
    - `obj.set()`: 设置元素值\n- `obj.size()`: 返回元素数量\n- `obj.remove()`: 移除元素\n- `obj.clear()`:\
    \ 清除所有元素\n\ne.g.\n```java\nimport java.util.ArrayList;\npublic class Main {\n\
    \    public static void main(String[] args) {\n        ArrayList<String> colors\
