    ;\n        String str2 = \"Scripting\";\n        String str3 = \"SCRIPTING\";\n\
    \        System.out.println(str1.regionMatches(6, str2, 0, 9)); // true\n    \
    \    System.out.println(str1.regionMatches(6, str3, 0, 9)); // false\n    }\n\
    }\n```\n\n# 正则表达式语法\n\n`Pattern.compile(\"pattern\", flags)` // 创建模式，指定 `CASE_SENSITIVE`\
    \ 或 `CASE_INSENSITIVE`。\n`patt.matcher(\"string\")` // 定义模式尝试匹配的字符串。\n`match.find()`\
    \ // 如果字符串匹配模式则返回 true，否则返回 false。\n\n#### 示例\n```java\nimport java.util.regex.Matcher;\n\
    import java.util.regex.Pattern;\n\npublic class MyClass{\n    public static void\
    \ main(String[] args) {\n        Pattern patt = Pattern.compile(\"Shell\", Pattern.CASE_INSENSITIVE);\n\
    \        Matcher match = patt.matcher(\"Shell Scripting in 8 Hours\");\n     \
