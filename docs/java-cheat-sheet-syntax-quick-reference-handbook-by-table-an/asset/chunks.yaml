    \ private String name = \"Andy\";\n    private String id = \"007hero\";\n    private\
    \ int phone = 12345678;\n\n    public static void main(String[] args) {\n    \
    \    Student s = new Student();\n        // System.out.println(s.name); // 编译错误，name\
    \ 是私有的\n    }\n}\n```\n\n# `protected` 语法\n\n`protected 变量/方法/构造函数`\n// 一种访问修饰符。`protected`\
    \ 变量、`方法`或`构造函数` 只能在同包或子类中访问\n\n#### 示例\n```java\nclass Student {\n    protected\
    \ String name = \"Andy\";\n    protected String id = \"007hero\";\n    protected\
    \ int phone = 12345678;\n}\n\nclass Classmate extends Student {\n    public static\
    \ void main(String[] args) {\n        Student s = new Student();\n        System.out.println(s.name);\
    \ // 可以访问\n    }\n}\n```\n\n# `public` 语法\n\n`public 变量/方法/构造函数`\n// 一种访问修饰符。`public`\
