    \ same line.\n`System.out.println();` // print the result in the different line.\n\
    \n#### e.g.\n```java\nSystem.out.print( \"A \" );\nSystem.out.print( \"B \" );\n\
    System.out.print( \"C\"  );\n// Output: A B C\n```\n\n```java\nSystem.out.println(\
    \ \"A \" );\nSystem.out.println( \"B \" );\nSystem.out.println( \"C\"  );\n//\
    \ Output:\nA\nB\nC\n```\n\n# `private` syntax\n\n`private variable/method/constructor`\n\
    // An access modifier. The `private` variables, `methods` or `constructors` can\
    \ only be accessed within the declared class\n\n#### e.g.\n```java\npublic class\
    \ Student {\n    private String name = \"Andy\";\n    private String id = \"007hero\"\
    ;\n    private int phone = 12345678;\n\n    public static void main(String[] args)\
    \ {\n        Student obj = new Student();\n        System.out.println(\"Name:\
    \ \" + obj.name);\n        System.out.println(\"ID: \" + obj.id);\n        System.out.println(\"\
    Phone: \" + obj.phone);\n    }\n}\n// Output:\nName: Andy\nID: 007hero\nPhone:\
    \ 12345678\n```\n\n# `protected` syntax\n\n`protected variable/method/constructor`\n\
    // An access modifier. The `protected` variables, `methods` or `constructors`\
    \ can only be accessed within the same package and subclasses\n\n#### e.g.\n```java\n\
    class Student {\n    protected String name = \"Andy\";\n    protected String id\
    \ = \"007hero\";\n    protected int phone = 12345678;\n}\n\npublic class Classmate\
    \ extends Student {\n    private int age = 18;\n\n    public static void main(String[]\
    \ args) {\n        Classmate obj = new Classmate();\n        System.out.println(\"\
    Name: \" + obj.name );\n        System.out.println(\"ID: \" + obj.id);\n     \
    \   System.out.println(\"Phone: \" + obj.phone);\n        System.out.println(\"\
    Age: \" + obj.age);\n    }\n}\n// Output:\nName: Andy\nID: 007hero\nPhone: 12345678\n\
    Age: 18\n```\n\n# `public` syntax\n\n`public variable/method/constructor`\n//\
    \ An access modifier. The `public` variables, `methods` or `constructors` can\
    \ be accessed by any classes\n\n#### e.g.\n```java\nclass Student {\n    public\
    \ String name = \"Andy\";\n    public String id = \"007hero\";\n    public int\
    \ phone = 12345678;\n}\n\npublic class Classmate extends Student {\n    private\
