- fmt: "\n# Operators\n\n| Operators |\n| :--- |\n| `>` |\n| `<` |\n| `>=` |\n| `<=`\
    \ |\n| `==` |\n| `!=` |\n\n## Logical Operators Chart\n\n| Operators |\n| :---\
    \ |\n| `&&` |\n| `||` |\n| `!` |\n\n## Logical Result Chart\n\n- `true && true;`\
    \ returns `true`\n- `true && false;` returns `false`\n- `false && false;` returns\
    \ `false`\n- `true || true;` returns `true`\n- `true || false;` returns `true`\n\
    - `false || false;` returns `false`\n- `! false;` returns `true`\n- `! true;`\
    \ returns `false`\n\n## Other Operators Chart\n\n| Operator | Description |\n\
    | :--- | :--- |\n| `~` | Bitwise Complement |\n| `<<` | Left Shift |\n| `>>` |\
    \ Right Shift |\n| `>>>` | Unsigned Right Shift |\n| `&` | Bitwise AND |\n| `^`\
    \ | Bitwise exclusive OR |\n| `|` | Bitwise OR |\n| `? :` | `test ? true-do-this\
    \ : false-do-this` |\n\n## Overloading & Overriding Chart\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| `overloading` | same method name, different argument,\
    \ overloading in the same class. |\n| `overriding` | same method name, same argument,\
    \ overriding in between super class and sub class. |\n\n## Math Methods\n\n| Method\
    \ | Returns |\n| :--- | :--- |\n| `abs()` | a number's absolute value |\n| `ceil()`\
    \ | an integer greater than or equal to its argument |\n| `cos()` | an angle's\
    \ trigonometric cosine |\n| `exp()` | a number's `Math.E` to the power |\n| `floor()`\
    \ | an integer less than or equal to its argument. |\n| `log()` | a number's natural\
    \ logarithm |\n| `random()` | a random positive value from 0 to 1 |\n| `max()`\
    \ | a greater between two numbers |\n| `min()` | a smaller between two numbers\
    \ |\n| `pow()` | the first argument to the power of the second |\n| `round()`\
    \ | the closest long or int |\n| `sin()` | an angle's trigonometric sine |\n|\
    \ `sqrt()` | a number's square root |\n| `tan()` | an angle's trigonometric tangent\
    \ |\n\n## Collection Function Chart\n\n| Functions | Descriptions |\n| :--- |\
    \ :--- |\n| `add()` | add element |\n| `addAll()` | add all elements |\n| `remove()`\
    \ | remove element |\n| `removeAll()` | remove all elements |\n| `retainAll()`\
    \ | retain all elements |\n| `contains()` | check if contain element |\n| `containsAll()`\
    \ | check if contain all elements |\n| `toArray()` | convert element to array\
    \ |\n| `keySet()` | return a `Set` of the `HashMap` keys |\n| `next()` | get next\
    \ element value |\n| `hasNext()` | check if data has next element |\n| `equals()`\
    \ | check if two objects are equal |\n| `hashCode()` | create a hashcode of an\
    \ object |\n\n## Default, Public, Private, Protected Chart\n\nJava has four permission\
    \ modifiers to define a member. The access permissions of `public`, `protected`,\
    \ `default`, `private` are:\n\n| accessed by: | public | protect |\n| :--- | :---\
    \ | :--- |\n| same class in same package | ok | ok |\n| parent & child class in\
    \ same package | ok | ok |\n| parent & child class in different packages | ok\
    \ | ok |\n| non-parent & non-child class in different packages | ok | |\n\n- `\"\
    public\"` member can be accessed in any packages & classes.\n- `\"protected\"\
    ` member cannot be accessed in non-parent class or non-child class.\n- `\"default\"\
    ` member cannot be accessed in different packages.\n- `\"private\"` member cannot\
    \ be accessed in different classes.\n\n## Abstract Chart\n\n```java\nabstract\
    \ class books {\n    // define an abstract class\n    abstract int read();\n \
    \   // define an abstract method\n}\n\nclass eBooks extends books {\n    // extend\
    \ the parent class\n    int read() { return …; }\n    // override the abstract\
    \ method\n}\n```\n\n## Interface Chart\n\n```java\ninterface books {\n    // define\
    \ an interface\n    int title();\n    // define an empty method\n}\n\nclass eBooks\
    \ implement books {\n    // implement the interface\n    public int title() {\n\
    \        // implement the empty method\n        return …,;\n    }\n}\n```\n\n\
    ## Thread Methods Chart\n\n| Method | Description |\n| :--- | :--- |\n| `start()`\
    \ | starts the thread. |\n| `stop()` | stops the thread. |\n| `sleep()` | makes\
    \ the thread sleep for some time. |\n| `wait()` | makes the thread in waiting\
    \ status. |\n| `notify()` | wakes up the thread that is waiting. |\n| `yield()`\
    \ | lets other threads with same priority run. |\n| `isAlive()` | tests the current\
    \ thread alive. |\n| `currentThread()` | gets the current thread. |\n| `interrupt()`\
    \ | stops the \"blocked\" thread. |\n| `suspend()` | makes the thread pause. |\n\
    | `resume()` | starts the thread again. |\n| `join()` | runs this thread after\
    \ another thread ended. |\n\n## Modifiers Chart\n\n| Modifier | Description |\n\
    | :--- | :--- |\n| `final` | cannot be overridden/modified |\n| `static` | belongs\
    \ to the class, rather than an object |\n| `abstract` | The method does not contain\
    \ a body. |\n| `transient` | Skipped when serializing the object containing them\
    \ |\n| `synchronized` | Can only be accessed by one thread at a time |\n| `volatile`\
    \ | Not cached thread-locally, read |\n\n## Date & Time Class\n\n| Class | Description\
    \ |\n| :--- | :--- |\n| `LocalDate` | a date (yyyy-MM-dd) |\n| `LocalTime` | a\
    \ time (HH-mm-ss) |\n| `LocalDateTime` | datetime (yyyy-MM-dd-HH-mm-ns) |\n| `DateTimeFormatter`\
    \ | a formatter for date-time objects |\n\n## Event, Listener, Methods\n\n| Event\
    \ | Listener | Handling |\n| :--- | :--- | :--- |\n| `JButton` | `ActionListener`\
    \ | `actionPerformed()` |\n| `CheckBoxJJComboBox` | `ItemListener` | `itemChanged()`\
    \ |\n| `keyboard` | `KeyListener` | `keyTyped()` |\n| `Mouse` | `MouseListener`\
    \ | `mouseClicked()` |\n| `Window` | `WindowListener` | `windowOpened()`, `windowClosed()`\
    \ |\n| `Component` | `ComponentListener` | `componentHidden()`, `componentShown()`,\
    \ `componentMoved()`, `componentResized()` |\n\n## File & Directory Chart\n\n\
    | Method | Description |\n| :--- | :--- |\n| `canRead()` | check whether the file\
    \ is readable |\n| `canWrite()` | check whether the file is writable or not |\n\
    | `createNewFile()` | create an empty file |\n| `delete()` | delete a file |\n\
    | `exists()` | check whether the file exists |\n| `getName()` | return the name\
    \ of the file |\n| `getAbsolutePath()` | return the absolute pathname of the file\
    \ |\n| `length()` | return the size of the file in bytes |\n| `list()` | return\
    \ an array of the files in the directory |\n| `mkdir()` | create a directory |\n\
    \n## Read Methods Chart\n\n| Method | Description |\n| :--- | :--- |\n| `read()`\
    \ | reads a byte of data from the input stream |\n| `readBoolean()` | reads data\
    \ of boolean type |\n| `readChar()` | reads data of character type |\n| `readInt()`\
    \ | reads data of integer type |\n| `readObject()` | reads the object from the\
    \ input stream |\n\n## Write Methods Chart\n\n| Method | Description |\n| :---\
    \ | :--- |\n| `write()` | writes a byte of data to the output stream |\n| `writeBoolean()`\
    \ | writes data of boolean type |\n| `writeChar()` | writes data of character\
    \ type |\n| `writeInt()` | writes data of integer type |\n| `writeObject()` |\
    \ writes object to the output stream |\n"
