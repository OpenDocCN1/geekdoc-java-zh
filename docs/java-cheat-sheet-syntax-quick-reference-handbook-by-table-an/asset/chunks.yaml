    \n// `final+ variable` means that variable value cannot be modified.\n\ne.g.\n\
    \n```java\npublic class FnlClass{\n    final int n =120;   // declare a final\
    \ variable\n    static void study( ){ n = 500;}   // Error! For \"n\" is a final\
    \ variable\n    public static void main (String args[ ]){\n        System.out.print(\
    \  FnlClass.study() );\n    }\n}\n```\n\n```java\n// Output: Error message\n```\n\
    \n## finally syntax\n\n`finally{}`\n\n// Used in exception statement, must be\
    \ executed in any condition\n\ne.g.\n\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        try {\n            int[] arr = {10,\
    \ 20, 30};\n            System.out.println(arr[3]);\n        } catch (Exception\
    \ e) {\n            System.out.println(\"Error! Out of range!\");\n        } finally\
    \ {\n            System.out.println(\"Why? Learn Java in 8 Hours again!\");\n\
    \        }\n    }\n}\n```\n\n```java\n// Output:\n// Error! Out of range!\n//\
    \ Why? Learn Java in 8 Hours again!\n```\n\n## float syntax\n\n`float variable`\n\
