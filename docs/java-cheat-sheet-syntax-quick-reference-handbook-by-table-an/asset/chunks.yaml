    # Syntax Chart


    ------------------------------------------------------------------------------


    & syntax


    "&" has two functions.


    1\. Work as a relational operator.


    // Return true if two conditions are true, return false if one of the conditions
    is false.


    // "&" evaluates all conditions, even if the first condition is false.


    e.g.


    public class Main {


    public static void main(String[] args){


    int x = 100, y = 90, z = 60;


    if ((x > y) & (x > z))


    System.out.println("The value of x is " + x);


    }


    }


    // Output:   The value of x is 100


    2\. Work as a bitwise AND


    // Return 1 if two bits are 1, return 0 if one of the bits is 0.


    e.g.


    public class Main {


    public static void main(String[] args){


    int x= 4;


    int y = 6;


    int z = x & y;


    System.out.println(x + " & " + y + " = " + z);


    }


    }


    // Output:   4


    ------------------------------------------------------------------------------


    | syntax


    "|" is used for bitwise Or.


    // Return 1 if one of the bits is 1, return 0 if all bits are 0.


    e.g.


    public class Main {


    public static void main(String[] args){


    int x= 4;


    int y = 6;


    int z = x | y;


    System.out.println(x + " | " + y + " = " + z);


    }


    }


    // Output:   6


    ------------------------------------------------------------------------------


    ^ syntax:


    "^" is used for bitwise XOR


    // if corresponding bits are different, it returns 1, else it returns 0.


    e.g.


    public class Main {


    public static void main(String[] args){


    int x= 4;


    int y = 6;


    int z = x ^ y;


    System.out.println(x + " ^ " + y + " = " + z);


    }


    }


    // Output:   4 ^ 6 = 2


    ------------------------------------------------------------------------------


    << syntax:


    operand << bits


    // Left shift all bits according to a given number of bits. 


    e.g.


    public class Main {


    public static void main (String[] args) {       


    int operand = 2;


    // left shift 2 bits


    int n = operand << 2;


    System.out.println(n);   


    }


    }


    // Output:   8


    ------------------------------------------------------------------------------


    >> syntax:


    operand  >>  bits'
