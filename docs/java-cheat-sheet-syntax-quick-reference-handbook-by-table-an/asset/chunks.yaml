    # JAVA Cheat Sheet

    (Cover all Basic Java Syntaxes, More Than 300 Examples)

    Ray Yao


    ## About This Book

    This book covers all basic Java syntaxes, almost each syntax entry lists a program
    example and result output. We can quickly reference the most helpful programming
    syntaxes, such as common command syntax, string function syntax, collection function
    syntax, class & object syntax……; all these syntaxes are very useful for programming.


    We can take this book as a basic syntax manual because its entries are arranged
    alphabetically so that we can easily reference the important syntax.


    Nowadays or in the future, the Java Syntax Book can provide great help for coding
    both in our study and our work.


    ## Disclaimer

    This book is intended as a basic syntax manual only; it cannot include all entries
    on this subject. Its purpose is to be a supplement for a cheat sheet book, not
    as a whole Java dictionary.


