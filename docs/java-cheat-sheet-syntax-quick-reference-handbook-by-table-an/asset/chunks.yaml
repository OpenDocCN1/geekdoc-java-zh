    \ \"B \" );\nSystem.out.print( \"C\"  );\n// 输出: A B C\n```\n\n```java\nSystem.out.println(\
    \ \"A \" );\nSystem.out.println( \"B \" );\nSystem.out.println( \"C\"  );\n//\
    \ 输出:\nA\nB\nC\n```\n\n# `private` 语法\n\n`private 变量/方法/构造函数`\n// 一种访问修饰符。`private`\
