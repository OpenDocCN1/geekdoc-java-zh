    Yellow\");\n        colors.add(\"Green\");\n        System.out.println(colors);\n\
    \        for (int i = 0; i < colors.size(); i++) { // 遍历\n            System.out.print(colors.get(i)\
    \ + \" \"); // 获取元素值\n        }\n        colors.set(1, \"White\"); // 设置项值\n \
    \       System.out.println(colors);\n        colors.remove(2); // 移除元素值\n    \
    \    System.out.println(colors);\n        colors.clear(); // 清除所有项\n        System.out.println(colors);\n\
    \    }\n}\n// 输出:\n// [Red, Yellow, Green]\n// Red White Green \n// [Red, White]\n\
    // [Red]\n// []\n```\n\n### asin 语法\n\n```java\nMath.asin(number)\n```\n// 返回数字的反正弦值。\n\
    \ne.g.\n```java\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        System.out.println(Math.asin(0.88));\n    }\n}\n// 输出: 1.0758622045401\n\
    ```\n\n### assertion 断言语法\n\n```java\nassert condition: \"message\";\n```\n//\
    \ 断言通过检查我们假设为真的代码来帮助检测任何问题。\n// 如果条件返回假，JVM 将抛出消息并停止。\n// 在运行带断言的文件时，我们需要在命令中使用\
    \ `java -ea` 来启用断言。\n\ne.g.\n```java\nimport java.util.Scanner;\npublic class\
    \ Assertion{\n    public static void main( String args ){\n        int value =\
    \ 100;\n        assert value > 100 : \"The value is not greater than 100\";\n\
    \        System.out.println(\"The value is \" + value);\n    }\n}\n// 输出: Exception\
    \ in thread \"main\" java.lang.AssertionError: The value is not greater than 100\n\
    ```\n\n### 赋值运算符\n\n赋值运算符意味着 `=`, `+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `^=`,\
    \ `>>=`, `<<=`。\n\ne.g.\n```java\npublic class Main {\n    public static void\
    \ main(String[] args) {\n        int n1 = 6; n1 += 2; System.out.println(n1);\
    \ // n1 = 6+2, 返回 8\n        int n2 = 6; n2 -= 2; System.out.println(n2); // n2\
    \ = 6-2, 返回 4\n        int n3 = 6; n3 *= 2; System.out.println(n3); // n3 = 6*2,\
    \ 返回 12\n        int n4 = 6; n4 /= 2; System.out.println(n4); // n4 = 6/2, 返回\
    \ 3\n        int n5 = 6; n5 %= 2; System.out.println(n5); // n5 = 6%2, 返回 0\n\
    \        int n6 = 6; n6 &= 2; System.out.println(n6); // n6 = 6&2, 返回 2\n    \
    \    int n7 = 6; n7 |= 2; System.out.println(n7); // n7 = 6|2, 返回 6\n        int\
    \ n8 = 6; n8 ^= 2; System.out.println(n8); // n8 = 6², 返回 4\n        int n9 =\
    \ 6; n9 >>= 2; System.out.println(n9); // n9 = 6>>2, 返回 1\n        int n10 = 6;\
    \ n10 <<= 2; System.out.println(n10); // n10 = 6<<2, 返回 24\n    }\n}\n```\n\n\
    ### atan 语法\n\n```java\nMath.atan(number)\n```\n// 返回 -PI/2 到 PI/2 之间的反正切值。\n\n\
