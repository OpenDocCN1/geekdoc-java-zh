    \   else\n            return 1;\n    }\n\n    public static void main(String[]\
    \ args) {\n        int num = 5;\n        System.out.println(num + \" 的阶乘是 \" +\
    \ fact(num));\n    }\n}\n// 输出: 5 的阶乘是 120\n```\n\n# `regionMatches()` 语法\n\n\
    `str1.regionMatches(int offset1, String str2, int offset2, int len)`\n// 检查两个字符串区域是否相等，如果相等返回\
