    - `Paper` syntax](#part0004.xhtml_a6KZ)\n\n## & syntax\n\n`&` has two functions:\n\
    \n- Work as a relational operator.\n- Return true if two conditions are true,\
    \ return false if one of the conditions is false.\n- `&` evaluates all conditions,\
    \ even if the first condition is false.\n\n```java\npublic class Main {\n    public\
    \ static void main(String[] args){\n        int x = 100, y = 90, z = 60;\n   \
    \     if ((x > y) & (x > z))\n            System.out.println(\"The value of x\
    \ is \" + x);\n    }\n}\n```\nOutput: The value of x is 100\n\n- 2. Work as bitwise\
    \ AND\n- Return 1 if two bits are 1, return 0 if one of the bits is 0.\n\ne.g.\n\
    ```java\npublic class Main {\n    public static void main(String[] args){\n  \
    \      int x= 4;\n        int y = 6;\n        int z = x & y;\n        System.out.println(x\
    \ + \" & \" + y + \" = \" + z);\n    }\n}\n```\nOutput: 4 & 6 = 4\n\n## | syntax\n\
    \n`|` is used for bitwise Or.\n- Return 1 if one of the bits is 1, return 0 if\
    \ all bits are 0.\n\ne.g.\n```java\npublic class Main {\n    public static void\
    \ main(String[] args){\n        int x= 4;\n        int y = 6;\n        int z =\
    \ x | y;\n        System.out.println(x + \" | \" + y + \" = \" + z);\n    }\n\
    }\n```\nOutput: 4 | 6 = 6\n\n## ^ syntax\n\n`^` is used for bitwise XOR\n- if\
    \ corresponding bits are different, it returns 1, else it returns 0.\n\ne.g.\n\
    ```java\npublic class Main {\n    public static void main(String[] args){\n  \
    \      int x= 4;\n        int y = 6;\n        int z = x ^ y;\n        System.out.println(x\
    \ + \" ^ \" + y + \" = \" + z);\n    }\n}\n```\nOutput: 4 ^ 6 = 2\n\n## << syntax\n\
    \n`operand << bits`\n- Left shift all bits according to a given number of bits.\n\
    \ne.g.\n```java\npublic class Main {\n    public static void main (String[] args)\
    \ {\n        int operand = 2;\n        // left shift 2 bits\n        int n = operand\
    \ << 2;\n        System.out.println(n);\n    }\n}\n```\nOutput: 8\n\n## >> syntax\n\
    \n`operand >> bits`\n"
