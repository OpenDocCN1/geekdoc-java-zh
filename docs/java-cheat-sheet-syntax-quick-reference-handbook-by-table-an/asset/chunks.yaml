    # Radio Button Event syntax\n\n`implements ItemListener` // create an interface\
    \ for listener\n`addItemListener(this)` // add a listener to a component\n`itemStateChanged(ItemEvent\
    \ e){…}` // run if an event occurs\n// By implementing `ItemListener`, an interface\
    \ can be created for a listener and listening for event.\n\n#### e.g.\n```java\n\
    import javax.swing.*;\nimport java.awt.event.*;\n\npublic class RadioFrame extends\
    \ JFrame implements ItemListener{ // create an interface for listener\n    public\
    \ RadioFrame(){\n        JRadioButton myRadio = new JRadioButton(\"Select Me\"\
    );\n        myRadio.addItemListener(this); // add a listener to radio\n      \
    \  add(myRadio);\n    }\n\n    public static void main(String[ ] args){\n    \
    \    RadioFrame myFrame =new RadioFrame();\n        myFrame.setSize(300, 200);\n\
    \        myFrame.setVisible(true);\n    }\n\n    public void itemStateChanged(ItemEvent\
    \ e){\n        // itemStateChanged() runs when an event occurs\n        System.out.println(\"\
    Radio Button Event Occurs!\");\n    }\n}\n// Output: ⊙ Select Me Radio Button\
    \ Event Occurs!\n```\n\n# `random()` syntax\n\n`Math.random()`\n// Returns a random\
    \ number between 0.0 and 1.0\n\n#### e.g.\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        // generates a random number between\
    \ 0.0 to 1.0\n        System.out.println(Math.random());\n    }\n}\n// Output:\
    \ 0.5400266630143229\n```\n\n# `read()` syntax\n\n`FileReader obj = new FileReader(f);`\
    \ // Create a file reading object\n`obj.read()` // Read a file\n\n#### e.g.\n\
    ```java\nimport java.io.FileReader;\nimport java.io.IOException;\n\npublic class\
    \ MyClass{\n    public static void main(String[] args) throws IOException{\n \
    \       String f = \"D:\\\\myFile.txt\";\n        // myFile.txt contents is: Hello\
    \ World!\n        FileReader obj = new FileReader(f);\n        try {\n       \
    \     int i; // return -1 when reading the end of file\n            while((i =\
    \ obj.read()) != -1) { // read the file\n                System.out.print((char)i);\n\
    \            }\n        } finally {\n            obj.close();\n        }\n   \
    \ }\n}\n// Output: Hello World!\n```\n\n# `readObject()` syntax\n\n`ObjectInputStream\
    \ obj = new ObjectInputStream(streamObj);` // Create an `ObjectInputStream` `obj`\n\
    `obj.readObject()` // Read data from `obj` stream\n// `readObject()` is used to\
    \ read data from an object stream.\n\n#### e.g.\n```java\nimport java.io.FileInputStream;\n\
    import java.io.FileOutputStream;\nimport java.io.ObjectInputStream;\nimport java.io.ObjectOutputStream;\n\
    \nclass MyClass {\n    public static void main(String[] args) {\n        String\
    \ data = \"Write to object. Read from object stream.\";\n        try {\n     \
    \       FileOutputStream file = new FileOutputStream(\"file.txt\");\n        \
    \    ObjectOutputStream obj1 = new ObjectOutputStream(file);\n            obj1.writeObject(data);\n\
    \            obj1.close();\n\n            FileInputStream streamObj = new FileInputStream(\"\
    file.txt\");\n            ObjectInputStream obj2 = new ObjectInputStream(streamObj);\n\
    \            System.out.print(obj2.readObject());\n            obj2.close();\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n// Output: Write to object. Read from object stream.\n```\n\n# recursion\
    \ syntax\n\n`myFunction()` // call itself\n// Recursion means that a function\
    \ is called inside itself.\n\n#### e.g.\n```java\npublic class Factorial {\n \
    \   static int fact( int n ) {\n        if (n != 0) // stop condition\n      \
    \      return n * fact(n-1); // recursive call\n        else\n            return\
    \ 1;\n    }\n\n    public static void main(String[] args) {\n        int num =\
    \ 5, result;\n        result = fact(num);\n        System.out.println(num + \"\
    \ factorial is \" + result);\n    }\n}\n// Output: 5 factorial is 120\n```\n\n\
    # `regionMatches()` syntax\n\n`str1.regionMatches(int offset1, String str2, int\
    \ offset2, int len)`\n// Check if two string regions are equal, return true if\
    \ their regions are equal, return false if not.\n// `offset1`: the beginning offset\
    \ of `str1`.\n// `offset2`: the beginning offset of `str2`.\n// `len`: the length\
    \ for comparing\n\n#### e.g.\n```java\nimport java.io.*;\n\npublic class Main\
    \ {\n    public static void main(String args[]) {\n        String Str1 = new String(\"\
