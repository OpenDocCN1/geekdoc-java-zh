    | cos() | an angle's trigonometric cosine |\n\n| exp() | a number's Math.E to\
    \ the power |\n\n| floor() | an integer less than or equal to its argument. |\n\
    \n| log() | a number's natural logarithm |\n\n| random() | a random positive value\
    \ from 0 to 1 |\n\n| max() | a greater between two numbers |\n\n| min() | a smaller\
    \ between two numbers |\n\n| pow() | the first argument to the power of the second\
    \ |\n\n| round() | the closest long or int |\n\n| sin() | an angle's trigonometric\
    \ sine |\n\n| sqrt() | a number's square root |\n\n| tan() | an angle's trigonometric\
    \ tangent |\n\nCollection Function Chart\n\n| Functions | Descriptions |\n\n|\
    \ add() | add element |\n\n| addAll() | add all elements |\n\n| remove() | remove\
    \ element |\n\n| removeAll() | remove all elements |\n\n| retainAll()        |\
    \ retain all elements |\n\n| contains() | check if contain element |\n\n| containsAll()\
    \ | check if contain all elements |\n\n| toArray()    | convert element to array\
    \ |\n\n| keySet()     | return a Set of the HashMap keys |\n\n| next()     | get\
    \ next element value |\n\n| hasNext()     | check if data has next element |\n\
    \n| equals()     | check if two objects are equal |\n\n| hashCode()     | create\
    \ a hashcode of an object |\n\nDefault, Public, Private, Protected Chart\n\nJava\
    \ has four permission modifiers to define a member.\n\nThe access permissions\
    \ of public, protected, default, private are:\n\n| accessed by: | public | protect\
    \ |\n\n| same classin same package | ok | ok |\n\n| parent & child classin same\
    \ package | ok | ok |\n\n| parent & child classin different packages | ok | ok\
    \ |\n\n| non-parent & non-child classin different packages | ok |  |\n\n\"public\"\
    \ member can be accessed in any packages & classes.\n\n\"protected\" member cannot\
    \ be accessed in non-parent  class or non-child  class.\n\n\"default\" member\
    \ cannot be accessed in different packages.\n\n\"private\" member cannot be accessed\
    \ in different classes.\n\nAbstract Chart\n\n| Abstract  Structure:abstract class\
    \ books{    //define an abstract classabstract int read();   //define an abstract\
    \ method}class eBooks extends books{    //extend the parent classint read (){\
    \ return …; }    //override the abstract method} |\n\nInterface Chart\n\n| Interface  Structure:interface\
    \ books {    // define an interfaceint title();    // define an empty method}class\
    \ eBooks implement books {    // implement the interfacepublic int title() {    //\
    \ implement the empty methodreturn …;}} |\n\nThread Methods Chart\n\n| Method\
    \ | Description |\n\n| start() | starts the thread. |\n\n| stop() | stops the\
    \ thread. |\n\n| sleep() | makes the thread sleep for some time. |\n\n| wait()\
    \ | makes the thread in waiting status. |\n\n| notify() | wakes up the thread\
    \ that is waiting. |\n\n| yield() | lets other threads with same priority run.\
    \ |\n\n| isAlive() | tests the current thread alive. |\n\n| currentThread() |\
    \ gets the current thread. |\n\n| interrupt() | stops the \"blocked\" thread.\
    \ |\n\n| suspend() | makes the thread pause. |\n\n| resume() | starts the thread\
    \ again. |\n\n| join() | runs this thread after another thread ended. |\n\nModifiers\
    \ Chart\n\n| Modifier | Description |\n\n| final | cannot be overridden/modified\
    \ |\n\n| static | belongs to the class, rather than an object |\n\n| abstract\
    \ | The method does not contain a body. |\n\n| transient | Skipped when serializing\
    \ the object containing them |\n\n| synchronized | Can only be accessed by one\
    \ thread at a time |\n\n| volatile | Not cached thread-locally, read from \"chief\
    \ memory\" |\n\nDate & Time Class Chart\n\n| Class | Description |\n\n| LocalDate\
    \ | a date (yyyy-MM-dd) |\n\n| LocalTime | a time (HH-mm-ss-ns)) |\n\n| LocalDateTime\
    \ | datetime (yyyy-MM-dd-HH-mm-ss-ns) |\n\n| DateTimeFormatter | a formatter for\
    \ date-time objects |\n\nEvent, Listener, Methods Chart\n\n| Event | Event Listener\
    \ | Handling Method |\n\n| JButtonJTextFieldJPasswordField | ActionListener |\
    \ actionPerformed() |\n\n| JCheckBoxJRadioButtonJComboBoxJMenuItem | ItemListener\
    \ | itemStateChanged() |\n\n| keyboard | keyListener | keyTyped() |\n\n| Mouse\
    \ | MouseListener | mouseClicked() |\n\n| Window | WindowListener | windowOpened()windowClosed()\
    \ |\n\n| Component | ComponentListener | componentHidden()componentShown()componentMoved()componentResized()\
    \ |\n\nFile & Directory Chart\n\n| Method | Description |\n\n| canRead() | check\
    \ whether the file is readable or not |\n\n| canWrite() | check whether the file\
    \ is writable or not |\n\n| createNewFile() | create an empty file |\n\n| delete()\
    \ | delete a file |\n\n| exists() | check whether the file exists |\n\n| getName()\
    \ | return the name of the file |\n\n| getAbsolutePath() | return the absolute\
    \ pathname of the file |\n\n| length() | return the size of the file in bytes\
    \ |\n\n| list() | return an array of the files in the directory |\n\n| mkdir()\
    \ | create a directory |\n\nRead()  Methods Chart\n\n| read() | reads a byte of\
    \ data from the input stream |\n\n| readBoolean() | reads data of boolean type\
    \ |\n\n| readChar() | reads data of character type |\n\n| readInt() | reads data\
    \ of integer type |\n\n| readObject() | reads the object from the input stream\
    \ |\n\nWrite() Methods Chart\n\n| write() | writes a byte of data to the output\
    \ stream |\n\n| writeBoolean() | writes data of boolean type |\n\n| writeChar()\
    \ | writes data of character type |\n\n| writeInt() | writes data of integer type\
    \ |\n\n| writeObject() | writes object to the output stream |\n\n[Paperback Books\
    \ by Ray Yao](http://mybook.to/yaowining)\n\n[C# Cheat Sheet](https://author.to/C_Sharp_Cheat_Sheet)\n\
    \n[C++ Cheat Sheet](https://mybook.to/C_Plus_cheat_sheet)\n\n[JAVA Cheat Sheet](https://author.to/Java_Cheat_Sheet)\n\
    \n[JavaScript Cheat Sheet](https://mybook.to/JavaScript_cheat_sheet)\n\n[PHP MySQL\
    \ Cheat Sheet](https://mybook.to/PHP_cheat_sheet)\n\n[Python Cheat Sheet](https://author.to/Python_Cheat_Sheet)\n\
    \n[Html Css Cheat Sheet](https://mybook.to/Html_Css_cheat_sheet)\n\n[Linux Command\
