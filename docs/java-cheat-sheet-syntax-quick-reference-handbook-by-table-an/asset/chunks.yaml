    \ void main(String[] args){\n        int x= 4;\n        int y = 6;\n        int\
    \ z = x | y;\n        System.out.println(x + \" | \" + y + \" = \" + z);\n   \
    \ }\n}\n```\n输出：4 | 6 = 6\n\n## ^ 语法\n\n`^` 用于按位异异：\n\n如果对应的位不同，则返回 1，相同则返回 0。\n\
    \n示例：\n```java\npublic class Main {\n    public static void main(String[] args){\n\
    \        int x= 4;\n        int y = 6;\n        int z = x ^ y;\n        System.out.println(x\
    \ + \" ^ \" + y + \" = \" + z);\n    }\n}\n```\n输出：4 ^ 6 = 2\n\n## << 语法\n\n`operand\
    \ << bits`\n根据给定的位数位数左移所有位。\n\n示例：\n```java\npublic class Main {\n    public static\
    \ void main (String[] args) {\n        int operand = 2;\n        // 左移 2 位\n \
    \       int n = operand << 2;\n        System.out.println(n);\n    }\n}\n```\n\
    输出：8\n\n## >> 语法\n\n`operand >> bits`\n\n"
- fmt: "\n# Right Shift Operator (>>)\n\nRight shift all bits according to a given\
    \ number of bits.\n\ne.g.\n```java\npublic class Main {\n    public static void\
    \ main (String[] args) {\n        int operand = 8;\n        // right shift 2 bits\n\
    \        int n = operand >> 2;\n        System.out.println(n);\n    }\n}\n```\n\
    // Output: 2\n\n## Unsigned Right Shift (>>>)\n\nsyntax: `operand` >>> `bits`\n\
    \nRight shift all bits according to a given number of bits.\nThe vacancy in the\
    \ leftmost position is filled with 0.\nUnsigned right shift.\n\ne.g. Given `-2\
    \ = 11111110`\n`-2 >>> 1` // return `01111111`\n\n# Comments\n\n## `//` and `/*\
    \ */`\n\nsyntax:\n\nSingle-line comments start with two forward slashes `//`.\n\
    Multi-line comments start with `/*` and ends with `*/`.\n\ne.g.\n```java\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        // Here\
    \ is a single-line comment\n        System.out.println(\"Hello World\");\n   \
    \     /* Here is a multi-line comment.\n           This program will print our\
    \ Hello World\n        */\n    }\n}\n```\n// Output: Hello World\n\n# Ternary\
    \ Operator (:)\n\nsyntax:\n`(bool-expression) ? (if-true-do-this) : (if-false-do-this);`\n\
    \nRun one of the statement according to the result of the boolean expression.\n\
    \ne.g.(1)\n```java\nint a=100; int b=300;\nString result1 = (a<b) ? \"orange\"\
    \ : \"pineapple\";\nSystem.out.print ( result1);\n```\n// Output: orange\n\ne.g.(2)\n\
    ```java\nint a=100; int b=300;\nString result2 = (a>b) ? \"orange\" : \"pineapple\"\
    ;\nSystem.out.print ( result2 );\n```\n// Output: pineapple\n\n# String Concatenation\n\
    \n## + connect syntax:\n\n`str = str1 + str2;`\n`str = str1.concat(str2);`\n\n\
    `+` can join two strings.\n`concat()` can connect two strings.\n\ne.g.\n```java\n\
    String s1 = \"Hello\"; String s2 = \"Friends\";\nSystem.out.print( s1 + s2); \
    \ // connect two strings\nSystem.out.print( s1.concat (s2));  // connect two strings\n\
    ```\n// Output: Hello Friends\n\n# Math Methods\n\n## abs() syntax:\n\n`Math.abs(number)`\n\
    \nReturns the absolute value of a number.\n\ne.g.\n```java\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        System.out.println(Math.abs(-168.88));\n\
    \        System.out.println(Math.abs(168.88));\n    }\n}\n```\n// Output:\n168.88\n\
    168.88\n\n# Abstract Classes and Methods\n\n## abstract syntax:\n\n`abstract class/method`\n\
    \n`abstract` is used in class or method.\nAbstract class works as a parent class,\
    \ which will be extended by its subclass. The method of the subclass will override\
    \ the abstract method of the abstract class.\n`abstract class` cannot create any\
    \ object.\n`abstract method` is used in abstract class only.\n`abstract method`\
    \ is an empty method without a body.\n\ne.g.\n```java\nabstract class Book{ //\
    \ create an abstract class\n    abstract void reading(); // create an abstract\
    \ method\n}\nclass eBook extends Book{ // extend the parent class\n    void reading(){\
    \ // override the abstract method\n        System.out.println(\"I override that\
    \ abstract method.\");\n    }\n}\npublic class AbstractDemo {\n    public static\
    \ void main(String[] args){\n        eBook obj =new eBook();\n        obj.reading();\n\
    \    }\n}\n```\n// Output: I override that abstract method.\n\n## acos() syntax:\n\
    \n`Math.acos(number)`\n\nReturn the arc cosine value of a number.\n\ne.g.\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.acos(0.88));\n\
    \        System.out.println(Math.acos(-0.88));\n        System.out.println(Math.acos(0));\n\
    \    }\n}\n```\n// Output:\n0.4949341263408955\n2.646658527248898\n1.5707963267948966\n\
    \n# Collections\n\n## add() syntax:\n\n`collection.add(element);`\n\nAdd an element\
    \ to a collection.\n`Collection` refers to `LinkedList`, `ArrayList`, `HashSet`\
    \ and `List`.\n\ne.g.\n```java\nimport java.util.HashSet;\nimport java.util.Set;\n\
    public class MyClass { \n    public static void main(String[] args) {\n      \
    \  Set<Integer> mySet = new HashSet<>();\n        //add integer values in this\
    \ collection\n        mySet.add(10);\n        mySet.add(20);\n        mySet.add(30);\n\
    \        System.out.print(\"Collection elements : \");\n        System.out.println(mySet);\n\
    \    }\n}\n```\n// Output: Collection elements : [20, 10, 30]\n\n## addAll() syntax:\n\
    \n`Collections.addAll(mySet, 10, 20, 30, 40, 50);`\n\nAdd all elements to a collection.\n\
    `Collection` refers to `LinkedList`, `ArrayList`, `HashSet`, `List`.\n\ne.g.\n\
    ```java\nimport java.util.Collections;\nimport java.util.HashSet;\nimport java.util.Set;\n\
    public class MyClass { \n    public static void main(String[] args) { \n     \
    \   Set<Integer> mySet = new HashSet<>();\n        Collections.addAll(mySet, 10,\
    \ 20, 30, 40, 50);\n        // add all elements to mySet\n    }\n}\n```\n// Output:\
    \ Collection elements : [10, 20, 30, 40, 50]\n\n# Math Methods\n\n## addExact()\
    \ syntax:\n\n`addExact(num1, num2)`\n\nReturns the sum of two numbers.\n\ne.g.\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       int num1 = 10;\n        int num2 = 20;\n        System.out.println(num1.addExact(num2));\n\
    \    }\n}\n```\n// Output: 30\n\n# Anonymous Functions\n\n## anonymous function\
    \ syntax:\n\n`(parameter) -> { body }`\n\nAnonymous function is a function without\
    \ a name.\n\ne.g.\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Runnable r = () -> {\n            System.out.println(\"Anonymous\
    \ function\");\n        };\n        r.run();\n    }\n}\n```\n// Output: Anonymous\
    \ function\n\n# Arithmetic Operators\n\n## arithmetic operator syntax:\n\n`+`,\
    \ `-`, `*`, `/`, `%`, `++`, `--`\n\n`+` adds values.\n`-` subtracts values.\n\
    `*` multiplies values.\n`/` divides values.\n`%` remainder.\n`++` increments value.\n\
    `--` decrements value.\n\ne.g.\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        int a = 10;\n        int b = 3;\n      \
    \  System.out.println(a + b);\n        System.out.println(a - b);\n        System.out.println(a\
    \ * b);\n        System.out.println(a / b);\n        System.out.println(a % b);\n\
    \        a++;\n        System.out.println(a);\n        a--;\n        System.out.println(a);\n\
    \    }\n}\n```\n// Output: 13\n7\n30\n3\n1\n11\n10\n\n# Arrays\n\n## syntax:\n\
    \n`int arrayName[] = {\"value0\", \"value1\", \"value2\", ...};`\n\nAn array is\
    \ a container object that holds values.\n\ne.g.\n```java\nint[] arr = { 10, 11,\
    \ 12, 13 };\nSystem.out.println(arr[0]);\n```\n// Output: 10\n\n## array initialization:\n\
    \n`int arrayName[] = new int[number of elements];`\n\nInitialize an array with\
    \ a fixed size.\n\ne.g.\n```java\nint[] arr = new int[3];\narr[0] = 10;\narr[1]\
    \ = 20;\narr[2] = 30;\n```\n\n## array element syntax:\n\n`value = arrayName[index];`\n\
    \nAccess or assign an element in an array using its index.\n"
