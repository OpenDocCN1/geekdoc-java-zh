  trans: "\n\n# 运算符\n\n| 运算符 |\n| :--- |\n| `>` |\n| `<` |\n| `>=` |\n| `<=` |\n|\
    \ `==` |\n| `!=` |\n\n## 逻辑运算符表\n\n| 运算符 |\n| :--- |\n| `&&` |\n| `||` |\n| `!`\
    \ |\n\n## 逻辑结果表\n\n- `true && true;` 返回 `true`\n- `true && false;` 返回 `false`\n\
    - `false && false;` 返回 `false`\n- `true || true;` 返回 `true`\n- `true || false;`\
    \ 返回 `true`\n- `false || false;` 返回 `false`\n- `! false;` 返回 `true`\n- `! true;`\
    \ 返回 `false`\n\n## 其他运算符表\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `~` | 按位取反 |\n|\
    \ `<<` | 左移 |\n| `>>` | 右移 |\n| `>>>` | 无符号右移 |\n| `&` | 按位与 |\n| `^` | 按位异异 |\n\
    | `|` | 按位或 |\n| `? :` | `test ? true-do-this : false-do-this` |\n\n## 重载与重写表\n\
    \n| 方法 | 描述 |\n| :--- | :--- |\n| `overloading` | 相同的方法名，不同的参数，在同一个类中重载。 |\n|\
    \ `overriding` | 相同的方法名，相同的参数，在父类和子类之间进行重写。 |\n\n## 数学方法\n\n| 方法 | 返回 |\n| :---\
    \ | :--- |\n| `abs()` | 数字的绝对值 |\n| `ceil()` | 大于或等于参数的整数 |\n| `cos()` | 角度三角余弦值\
    \ |\n| `exp()` | 数字的 `Math.E` 幂 |\n| `floor()` | 小于或等于参数的整数。 |\n| `log()` | 数字的自然对数\
    \ |\n| `random()` | 0 到 1 之间的随机正值 |\n| `max()` | 两个数之间的较大值 |\n| `min()` | 两个数之间的较值\
    \ |\n| `pow()` | 第一个参数的第二个参数的幂 |\n| `round()` | 最接近的长型或整 |\n| `sin()` | 角度三角正弦值\
    \ |\n| `sqrt()` | 数字的平方根 |\n| `tan()` | 角度三角正切值 |\n\n## 集合函数表\n\n| 函数 | 描述 |\n\
    | :--- | :--- |\n| `add()` | 添加元素 |\n| `addAll()` | 添加所有元素 |\n| `remove()` | 移除元素\
    \ |\n| `removeAll()` |移除所有元素 |\n| `retainAll()` | 保留所有元素 |\n| `contains()` | 检查是否包含元素\
    \ |\n| `containsAll()` | 检查是否包含所有元素 |\n| `toArray()` | 将元素转换为数组 |\n| `keySet()`\
    \ | 返回 `HashMap` 键的 `Set` |\n| `next()` | 获取下一个元素值 |\n| `hasNext()` | 检查数据是否有下一个元素\
    \ |\n| `equals()` | 检查两个对象是否相等 |\n| `hashCode()` | 创建对象的哈希码 |\n\n## 默认、公共、私有、保护表\n\
    \nJava 有四种修饰符来定义成员。`public`、`protected`、`default`、`private` 的访问权限如下：\n\n| 访问者：\
    \ | public | protect |\n| :--- | :--- | :--- |\n| 同一个包中的同一个类 | ok | ok |\n| 同包中的父类和子类\
    \ | ok | ok |\n| 不同包中的父类和子类 | ok | ok |\n| 不同包中的非父类非子类 | ok | |\n\n- `\"public\"\
    ` 成员可以在任何包和类中访问。\n- `\"protected\"` 成员不能在非父类或非子类中访问。\n- `\"default\"` 成员不能在不同的包访问。\n\
    - `\"private\"` 成员不能在不同的类中访问。\n\n## 抽象表\n\n```java\nabstract class books {\n \
    \   // 定义一个抽象类\n    abstract int read();\n    // 定义一个抽象方法\n}\n\nclass eBooks extends\
    \ books {\n    // 扩展父类\n    int read() { return …; }\n    // 重写抽象方法\n}\n```\n\n\
    ## 接口表\n\n```java\ninterface books {\n    // 定义一个接口\n    int title();\n    //\
    \ 定义一个空方法\n}\n\nclass eBooks implement books {\n    // 实现接口\n    public int title()\
    \ {\n        // 实现空方法\n        return …,;\n    }\n}\n```\n\n## 线程方法表\n\n| 方法 |\
    \ 描述 |\n| :--- | :--- |\n| `start()` | 启动线程。 |\n| `stop()` | 停止线程。 |\n| `sleep()`\
    \ | 让线程睡眠一段时间。 |\n| `wait()` | 让线程处于等待状态。 |\n| `notify()` | 唤醒正在等待的线程。 |\n| `yield()`\
    \ | 让相同优先级的线程运行。 |\n| `isAlive()` | 测试当前线程存活。 |\n| `currentThread()` | 获取当前线程。\
    \ |\n| `interrupt()` | 停止“阻塞”的线程。 |\n| `suspend()` | 让线程暂停。 |\n| `resume()` |\
    \ 重新启动线程。 |\n| `join()` | 在另一个线程结束后运行此线程。 |\n\n## 修饰符表\n\n| 修饰符 | 描述 |\n| :---\
    \ | :--- |\n| `final` | 不能被重写/修改 |\n| `static` | 属于类， |\n| `abstract` | 方法不包含体\
    \ |\n| `transient` | 序列化时跳过 |\n| `synchronized` | 只能由线程访问 |\n| `volatile` | 本地缓存\
    \ |\n\n## 日期与时间类\n\n| 类 | 描述 |\n| :--- | :--- |\n| `LocalDate` | 日期 (yyyy-MM-dd)\
    \ |\n| `LocalTime` | 时间 (HH-mm-ss) |\n| `LocalDateTime` | 日期时间 (yyyy-MM-dd-HH-mm-ns)\
    \ |\n| `DateTimeFormatter` | 日时间格式器 |\n\n## 事件、监听器、方法\n\n| 事件 | 监听器 | 处理 |\n|\
    \ :--- | :--- | :--- |\n| `JButton` | `ActionListener` | `actionPerformed()` |\n\
    | `CheckBoxComboBox` | `ItemListener` | `itemChanged()` |\n| `keyboard` | `KeyListener`\
    \ | `keyTyped()` |\n| `Mouse` | `MouseListener` | `mouseClicked()` |\n| `Window`\
    \ | `WindowListener` | `windowOpened()`, `windowClosed()` |\n| `Component` | `ComponentListener`\
    \ | `componentHidden()`, `componentShown()`, `componentMoved()`, `componentResized()`\
    \ |\n\n## 文件与目录表\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `canRead()` | 检查文件是否可读 |\n\
    | `canWrite()` | 检查文件是否可写 |\n| `createNewFile()` | 创建一个空文件 |\n| `delete()` | 删除文件\
    \ |\n| `exists()` | 检查文件是否存在 |\n| `getName()` | 返回文件名 |\n| `getAbsolutePath()`\
    \ | 返回文件的绝对路径 |\n| `length()` | 返回文件的字节大小 |\n| `list()` | 返回目录下的文件数组 |\n| `mkdir()`\
    \ | 创建目录 |\n\n"
