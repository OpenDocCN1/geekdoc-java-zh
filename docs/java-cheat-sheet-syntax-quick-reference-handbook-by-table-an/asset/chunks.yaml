    The value of x is \" + x);\n    }\n}\n```\n输出：The value of x is 100\n\n- 2. 按位与\n\
    \n`&` 用于按位与：\n\n如果对应的位都为 1，则返回 1，否则返回 0。\n\n示例：\n```java\npublic class Main {\n\
    \    public static void main(String[] args){\n        int x= 4;\n        int y\
    \ = 6;\n        int z = x & y;\n        System.out.println(x + \" & \" + y + \"\
    \ = \" + z);\n    }\n}\n```\n输出：4 & 6 = 4\n\n## | 语法\n\n`|` 用于按位或：\n\n如果其中一个位为\
