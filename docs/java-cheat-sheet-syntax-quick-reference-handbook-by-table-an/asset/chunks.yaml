    \ an object.\n`class ClassName` defines a class.\n\ne.g.\n```java\npublic class\
    \ MyClass {  // define a class\n    int num = 100;\n    public static void main(String[]\
    \ args) {\n        MyClass myObj = new MyClass();  // create an object\n     \
    \   System.out.println(myObj.num);\n    }\n}\n```\nOutput: 100\n\n---\n\n## Class\
    \ & object syntax\n\n```java\npublic class ClassName {     // define a class\n\
    }\n\nClassName obj = new ClassName( );   // create an object\n```\n\ne.g.\n```java\n\
    public class Flower {     // define a class\n    String co1, co2;      // define\
    \ two variables\n    void beautify() {      // define a method\n        System.out.println(\"\
    This flower is \" + co1);\n        System.out.println(\"That flower is \" + co2);\n\
    \    }\n    public static void main(String[] args) {\n        Flower obj = new\
    \ Flower( );     // create an object\n        obj.co1= \"red.\";   obj.co2=\"\
    blue.\";     // obj references co1, co2\n        obj.beautify();      // obj references\
    \ beautify()\n    }\n}\n```\nOutput:\nThis flower is red.\nThat flower is blue.\n\
    \n---\n\n## Class attribute syntax\n\n```java\npublic class MyClass {\n    int\
    \ variable1 = value1;\n    int variable2 = value2;\n}\n```\nCreate a class called\
    \ `MyClass` with two attributes: `variable1` and `variable2`.\n\ne.g.\n```java\n\
    public class Main {\n    int num = 10; // define a class property\n    public\
    \ static void main(String[] args) {\n        Main obj = new Main();\n        System.out.println(obj.num);\n\
    \    }\n}\n```\nOutput: 10\n\n---\n\n## close() & AutoCloseable syntax\n\n```java\n\
    public void close() throws Exception{\n}\n```\n`close()` is used to clean up the\
    \ resource, it will be called automatically when the object is closed or the block\
    \ exits.\n\n```java\npublic class ClassName implements AutoCloseable{\n}\n\n`AutoCloseable`\
    \ interface provides the `close()` method.\n\n`System.gc()`\n`gc()` suggests JVM\
    \ to make a garbage collection.\nNote: It's not recommended to explicitly call\
    \ `System.gc()`.\n\ne.g.\n```java\npublic class MyClass implements AutoCloseable\
    \ {\n    public static void main(String[] args) {\n        try (MyClass obj =\
    \ new MyClass()) {\n            System.out.print(\"The object is no longer used!\
    \  \");\n        } catch (Exception e) {\n            System.out.println( e.getMessage()\
    \ );\n        }\n    }\n    public void close() throws Exception {\n        System.out.print(\"\
    close() is executed!\");\n    }\n}\n```\nOutput: The object is no longer used!\
    \  close() is executed!\n\n---\n\n## codePointAt() syntax\n\n```java\nstring.codePointAt(index)\n\
    ```\nReturn a Unicode of a character at the specified index.\n\ne.g.\n```java\n\
    public class Main{\n    public static void main(String []args){\n        String\
    \ str = \"kindle\";\n        int u = str.codePointAt(2);\n        System.out.println(u);\n\
    \    }\n}\n```\nOutput: 110\n\n---\n\n## codePointBefore() syntax\n\n```java\n\
    string.codePointBefore(index)\n```\nReturn a Unicode of a character before the\
    \ specified index.\n\ne.g.\n```java\npublic class Main{\n    public static void\
    \ main(String []args){\n        String str = \"kindle\";\n        int u = str.codePointBefore(2);\n\
    \        System.out.println(u);\n    }\n}\n```\nOutput: 105\n\n---\n\n## codePointCount()\
    \ syntax\n\n```java\nstring.codePointCount(beginIndex, endIndex)\n```\nReturns\
    \ the number of Unicode values in the specified range of a String.\n\ne.g.\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        String\
    \ str = \"Hello World\";\n        int num = str.codePointCount(0, 8);\n      \
    \  System.out.println(num);\n    }\n}\n```\nOutput: 8\n\n---\n\n## color object\
    \ syntax\n\n```java\nColor myColor = new Color(r, g, b);     // create a color\n\
    ```\n`RGB` means \"red, green, blue\", its value is from 0 to 255.\n`0,0,0` means\
    \ black, `255,255,255` means white.\n`myButton.setBackground(myColor);     //\
    \ set background color\n`myButton.setForeground(Color.color);   // set foreground\
    \ color\n\ne.g.\n```java\nimport java.awt.* ;     \nimport javax.swing.* ;\n\n\
    public class FlowJFrame extends JFrame{\n    public FlowJFrame(){\n        setLayout(new\
    \ FlowLayout());\n        JButton myButton = new JButton(\"R in 8 Hours\");  \
    \   // create a button\n        Font myFont = new Font(\"Arial\", Font.ITALIC,\
    \ 16);     // create a font\n        myButton.setFont(myFont);\n        Color\
    \ myColor = new Color(0,0,0);     // create a color\n        myButton.setBackground(myColor);\
    \     // set background color\n        myButton.setForeground(Color.white);  \
    \ // set foreground color\n        add(myButton);\n    }\n    public static void\
    \ main(String[] args){\n        FlowJFrame myFrame = new FlowJFrame();\n     \
    \   myFrame.setSize(300,200);\n        myFrame.setVisible(true);\n        myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \    }\n}\n```\nOutput: (Frame window appears)\n\n---\n\n## Combo Box Event syntax\n\
    \n`implements ItemListener` // create an interface for listener\n`itemStateChanged(ItemEvent\
    \ e)` // run if an event occurs\n`addItemListener(this)` // add a listener to\
    \ component\nBy implementing `ItemListener`, an interface can be created for listening\
    \ for event.\n\ne.g.\n```java\nimport javax.swing.*;\nimport java.awt.FlowLayout;\n\
    import java.awt.event.*;\n\npublic class ComboBoxFrame extends JFrame implements\
    \ ItemListener{\n    JComboBox myComboBox;\n    public ComboBoxFrame(){\n    \
    \    setLayout(new FlowLayout());\n        myComboBox = new JComboBox();\n   \
    \     myComboBox.addItem(\"Selected\");\n        myComboBox.addItemListener(this);\n\
    \        add(myComboBox);\n    }\n    public static void main(String[] args){\n\
    \        ComboBoxFrame myFrame = new ComboBoxFrame();\n        myFrame.setSize(300,200);\n\
    \        myFrame.setVisible(true);\n    }\n    public void itemStateChanged(ItemEvent\
    \ e){\n        // itemStateChanged() runs when an event occurs\n        System.out.println(\"\
    Combo Box Event Occurs!\");\n    }\n}\n```\nOutput: Combo Box Event Occurs!\n\n\
    ---\n\n## comment syntax\n\nSingle-line comments start with two forward slashes\
    \ `//`.\nMulti-line comments start with `/*` and ends with `*/`.\n\ne.g.\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        //\
    \ Here is a single-line comment\n        System.out.println(\"Hello World\");\n\
    \n        /* Here is a multi-line comment.\n        This program will print our\
    \ Hello World\n        */\n    }\n}\n```\nOutput: Hello World\n\n---\n\n## compareTo()\
    \ syntax\n\n```java\nstr1.compareTo(str2)\n```\nCompare two strings alphabetically\
    \ based on Unicode value.\nReturn zero if two strings are equal, return non-zero\
    \ if two strings are not equal.\nIf the first string is greater than the second\
    \ string in Unicode value, returns a positive value.\nIf the first string is less\
    \ than the second string in Unicode value, returns a negative value.\n\ne.g.\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       String str1 = \"vacation\";\n        String str2 = \"vocation\";\n   \
    \     System.out.println(str1.compareTo(str2));\n    }\n}\n```\nOutput: -14\n\n\
    ---\n\n## compareToIgnoreCase() syntax\n\n```java\nstr1.compareToIgnoreCase(str2)\n\
    ```\nCompare two strings alphabetically based on Unicode value, the differences\
    \ of the cases.\nReturn zero if two strings are equal, return non-zero if two\
    \ strings are not equal.\nIf the first string is greater than the second string\
    \ in Unicode value, returns a positive value.\nIf the first string is less than\
    \ the second string in Unicode value, returns a negative value.\n\ne.g.\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        String\
    \ str1 = \"vacation\";\n        String str2 = \"vocation\";\n        System.out.println(str1.compareToIgnoreCase(str2));\n\
    \    }\n}\n```\n"
