  md: '# Are you excited about planning your next trip?

    Do you want to try something new while traveling?

    Would you like some guidance from a local?


    If you answered yes to any of these questions, then this book is just for you.


    Greater Than a Tourist – Java, Indonesia by Dian Pramesti and Hanum Gitarina offers
    the inside scope on Java, Indonesia. Most travel books tell you how to travel
    like a tourist. Although there''s nothing wrong with that, as a part of the Greater
    than a Tourist series this book will give you tips and a bunch of ideas from someone
    who lives at your next travel destination.


    In these pages you''ll discover local advice that will help you throughout your
    stay. Greater than a tourist is a series of books written by locals.

    Travel like a local. Get the inside scope. Slow, stay in one place, take your
    time, get to know the people and the culture of a place. Try some things off the
    beaten path with guidance. Patronize local business and vendors when you travel.
    Be willing to try something new and have the travel experience of a lifetime.


    By the time you finish this book, you will be excited to travel to your next destination.


    As Indonesian natives, we are glad of having the opportunity to write the series
    of Traveling to Indonesia. Java is more than just an island for us, for it is
    the place where we were born and grew up. Many things here have changed in Java
    in the last decades, but more are well preserved by the natives, including the
    friendliness of the people, the cultural heritages, the magnificent natural scenery,
    and more—something we call as the richness of Java. We simply want to share some
    bits and pieces of Java to the world.


    ![](img/f5031453bf615ef1b53b13bbfd3f057d_99_0.png)'
