  md: '# 5. Taste This Various Veggies in Karedok


    Karedok is one example of culinary comes from West Java. For you who love to eat
    vegetables, Karedok is certainly a compulsory dish to try when you visit West
    Java. The food consists of different kinds of raw veggies, from cucumber, eggplant,
    bean sprouts, cabbage, to long beans. Those veggies are not eaten directly though,
    you''ll definitely find a new taste of those vegetables when they are mixed with
    the sauce which is made of peanut sauce, garlic, peanuts, shrimp paste, and some
    other ingredients. Well, for I prefer it to be spicy, I would usually ask for
    more chilies.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 6. Be a Bandung Citizen While Tasting Batagor


    Although this food is now available across Indonesia, especially Java, Batagor
    actually comes from West Java. Batagor itself is an acronym from bakso tahu goreng
    or in English it will be fried tofu ball. As how its name, the dish actually consists
    of some tofu which are cut square, then being smeared with the dough and being
    fried. Sometimes, they will also give you the fried tofu—the one without the dough—but
    I would prefer the batagor only.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 7. Try Serabi Oncom


    Serabi is a light snack known actually not in West Java for you can also find
    it in East Java. However, this serabi from West Java is quite different for the
    topping is what makes it so West Java. Serabi itself is a snack that looks like
    some pancake but it is made from rice powder. While the topping, which is oncom,
    is like tempeh. I don''t really like oncom though, but for you who really love
    to try some unique food, this serabi is a must.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 8. Sip Bandrek to Make You Stay Warm


    Although Indonesia doesn''t have winter, but when the rainy season comes, it can
    get cold as well. If western people keep the warmth by consuming some alcoholic
    beverages, West Javanese people prefer to sip some *bandrek*. *Bandrek* is actually
    a traditional drink which is made from spices like ginger, brown sugar (also known
    as Javanese Sugar) and pepper. Usually I would sip some when I get some cold for
    it will ease my throat.'
  merge: -1
  pgno: 27
