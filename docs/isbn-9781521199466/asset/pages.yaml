  md: '> "I can speak to my soul only when the two of us are off exploring deserts
    or cities or mountains or roads.”–Paulo Coelho


    Indonesia, as an archipelago, has a lot of attractions, not only from the nature,
    but also from the culture. Also, as an archipelago which consists of thousands
    of islands—with five big islands as its main lands, Indonesia offers its diversities
    that most travelers will definitely enjoy. Not only breathtaking natural beauties
    that tourist will enjoy, but also friendly people, countless traditions, customs,
    ethnics, rituals, local languages, signature dishes, beliefs, and more.


    Among more than 17,000 islands, only few have attracted the attention of the world,
    such as Bali, Java, and Borneo. In this special edition, we would like to present
    the magnificent Java, one of the five major islands, that long has hypnotized
    the eyes of the world.


    Java, as the most populated island in Indonesia, is not only full with people.
    Divided by six provinces, the Indonesian island of Java also owns a lot of things
    to explore, from nature, culture, until culinary and they all will be discussed
    later in this book. We will reveal 50 bits and pieces of Java to give you hints
    of some among myriad attractions Java could offer. Enjoy!'
