  md: '# 31. Get a Try of Rawon


    Rawon is a name of soup that comes from East Java, most likely Pasuruan. The unique
    thing from Rawon is the soup, for it has black color. Well, not literally black,
    but more like dark brown. Usually people will eat this soup, which consists of
    meat, with rice, fresh bean sprouts and rice cracker. If you want to try eating
    this dish, you will easily get it as long as you are in East Java for most likely
    any food stall in East Java will have Rawon as their menu, especially in Pasuruan.'
  merge: -1
