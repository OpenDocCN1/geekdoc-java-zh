  md: '# Authors Bio


    As Indonesian natives, we are glad of having the opportunity to write the series
    of Traveling to Indonesia. Java is more than just an island for us, for it is
    the place where we were born and grew up. Many things have changed in Java in
    the last decades, but more are well preserved by the natives, including the friendliness
    of the people, the cultural heritages, the magnificent natural sceneries, and
    more—something we call as the richness of Java. We simply want to share some bits
    and pieces of Java to the world.'
