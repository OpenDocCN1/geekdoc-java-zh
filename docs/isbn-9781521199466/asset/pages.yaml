  md: '# 32. Take a Bite of Satay Madura


    When you ask about satay to any Indonesian people, most likely what will be in
    their mind is the satay which comes from Madura, an island which is near Surabaya.
    This kind of satay usually uses chicken as the main ingredient. To eat the satay,
    you will need to pour the grilled chicken meat which is placed in skewers with
    some peanut sauce. I would prefer to pour some soybean sauce with some sliced
    onion on top of it.'
  merge: -1
  pgno: 66
