  md: '# 33. Try another Veggies-with-Peanut-Sauce, Gado-gado


    I just don''t know why East Javanese people really like to eat some veggies being
    mixed with peanut sauce. But this Gado-gado is also an item of culinary that you
    should try, especially if you think that Rujak Cingur is too extreme—probably
    you can start from Gado-gado. The difference between Rujak Cingur and Gado-gado
    is that you will have the boiled veggies instead of raw vegetables. Also, instead
    of cingur, you will have boiled egg as the companion for the vegetables. The sauce
    is also different because gado-gado uses peanut sauce instead of petis sauce.'
