  md: '# 35. Be Amazed Watching Reog Ponorogo


    An example of beauty and culture. That is what I think of Reog Ponorogo. This
    artistic dance comes called Reog comes from Ponorogo that has been patented since
    2001. The dance which has been an icon for East Java also perform some mystical
    occurrence as how Kuda Lumping is. However, the thing that will fascinate you
