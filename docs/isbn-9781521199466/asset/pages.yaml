  md: '# 43. Never Forget to Try Gudeg


    Gudeg is the most compulsory dish you should try whenever you come to visit Yogyakarta.
    This culinary been known around Indonesia and although you can find it in other
    places, but enjoying it in the place where it comes will definitely feel different.
    The dish itself consists of gudeg, sambel goreng and opor. Gudeg is made of raw
    jackfruit, cooked with palm sugar and coconut milk. If you want to try, just come
    to the centers of gudeg, like the one in Kampung Wijilan. A spoiler for you, the
    taste is most likely sweet, but with a bit spicy from the sambel goreng.'
  merge: -1
