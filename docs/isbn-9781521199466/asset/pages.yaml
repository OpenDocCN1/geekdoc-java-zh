  md: '# 30. Munch some Rujak Cingur


    Actually, I don''t really favor eating some fresh fresh veggies or fruit which
    is mixed with some peanut sauce or *petis* sauce. However, this one is different.
    Rujak Cingur which comes from Surabaya, the capital city of East Java tastes different.
    Consists of so many kinds of fruit and vegetables like cucumber, raw mango, watercress,
    tofu, and also *cingur*—the mouth of cow—and then mixed together with the *petis*
    sauce. Some people who don''t really eat weird stuff like *cingur* will be hesitant
    to try, but I do think it is a nice idea to try for the taste will bring you to
    cloud nine!'
