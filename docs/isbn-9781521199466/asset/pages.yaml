  md: '# 45. Take another Bite for Yangko


    Yangko is another snack from Yogyakarta that will usually be brought home for
    your family. This snack is usually cut in small pieces of square which also has
    some different color. This snack though is like Mochi for it has a soft and chewy
    texture, sweet and also sticky. As it has different color, it also has different
    flavor, in regard to the color.'
