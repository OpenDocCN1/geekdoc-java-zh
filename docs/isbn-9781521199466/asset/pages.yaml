  md: '# 26. Witness the Sunrise at Bromo


    Mount Bromo is one of the most prominent attractions in East Java. Most people
    would come to Mount Bromo to be able to witness the beautiful sunrise from the
    peak of the mountain. However, although this mountain which is included in Bromo
    Tengger Semeru National Park is not as high as the other volcanoes, it has such
    a really beautiful view which amazed every tourist.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 27. Take a Look at the Beautiful Kawah Ijen Banyuwangi


    Not only West Java which has Tangkuban Perahu with its craters, East Java owns
    this beautiful Kawah Ijen which is also the biggest crater in the Indonesian Island
    of Java. This sulfuric crater is so beautiful for it has tosca green and blue
    fire color. Although you have to to hike for around one and a half hour in the
    midnight, but I believe you’ll be so into the beauty of this crater in Banyuwangi,
    East Java.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# 28. Meet the Nature at Baluran National Park


    Indonesia might belong into a tropical country. However, the country is also blessed
    with some dry ecosystem, and one of them is located in East Java, more precisely
    at Baluran National Park. Most likely, what you''ll find at the park is savanna
    in which it occupies 40% of the ecosystem. Another attraction that is offered
    by the national park is the mascot which is the bull.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 29. Be Amazed at the House of Sampoerna


    Java Island is indeed known as the producer of cigarette. One of the oldest and
    biggest cigarette factories is Sampoerna which is located in Surabaya, East Java.
    However, the factory is now offering an attraction which is the House of Sampoerna,
    a museum which features a colonial design as the building was built in 1862. However,
    although it seems old, but the museum is designed in a fancy way that will definitely
    make you feel like home, in addition with the café inside.'
