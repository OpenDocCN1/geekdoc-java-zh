  md: '# 13. Know the History of Solo from Kraton Surakarta


    Although Indonesia is now a republic, the country used to have quite an amount
    of kingdoms. Many of them can only be witnessed through the literatures and the
    remaining inheritances though, but several are still managing their palaces as
    parts of the Republic, and one of them is located in Surakarta—or people would
    easily call it Solo, Central Java, Indonesia. Being one of the kingdoms which
    still exist, it is likely that the palace, which is called kraton in Javanese,
    become one of the center of attraction in Central Java. Kraton Surakarta doesn’t
    only offer you a great amount of history of Surakarta from the past, but it is
    also full with lots of Javanese culture. Meanwhile, if you would like to shop,
    Kraton Surakarta is located near some shopping center which will offer you some
    low-priced batik—traditional cloth from Java which beautiful traditional patterns,
    symbols, and colors.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 14. Be Free at Karimunjawa


    If you are in love with snorkeling and diving, I really suggest you to come visit
    this small island on the north side of Java, around five to six hours by boat
    from Jepara, Central Java. Although the access to the islands of Karimunjawa is
    quite hard to get, but the beauty of the nature and marine life is supposed to
    adore. Everyone who''s been there always tells me that they want to go there again,
    and so do I. It is a piece of jewel in Java. The beauties can be compared to those
    of Bali—minus the extravagant shopping precincts.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# 15. Get to Know the Prehistoric People at Sangiran


    If you are interested in prehistoric era, Sangiran is the place you should visit
    when you are coming to Central Java. This archaeological excavation site which
    is located in Sragen, Central Java, has been stated as a World Heritage by UNESCO.
    The fossil that can be found in this museum is also varied for you you can find
    more than 13,800 collection of the fossils. It is the home of the prehistoric
    Javanaman although some collections also shows Olduvai Gorge from Tanzania, Willandra
    Lakes from Australia and Zhoukoudian from China.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 16. Feel the Fresh Air of Dieng Plateau


    From fresh air, beautiful nature, until historical places are all being offered
    by the plateau. Dieng plateau is located in Wonosobo, Central Java, around 30km
    from the city. There’s this infamous *Telaga Tiga Warna*, a lake located on the
    peak of the plateau which has three different colors. Apart from that, there are
    also several Hindu temples around the place. However, what I like best from Dieng
    Plateau is the *carica*, some fruit in the same family as papaya.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# 17. Know More About Batik at Batik Museum


    Batik Museum is located in Pekalongan which has become the city of Batik. The
    museum is considered as new one for it has only been built in 2006. Batik Museum
    doesn''t only consist of a huge collection of Batik, but it has also become a
    place to do some research in developing the design of Batik. Well, Batik itself
    is such a pride for the nation because it brings the culture of Indonesia. Have
    you worn any Batik before? Only for your information, almost all provinces in
    Indonesia have their own version of Batik. Interestingly, in Java, which consists
    of only 6 provinces, there are dozens and even hundreds different version of Batik
    with their own stories and histories behind the makings.'
  merge: -1
  pgno: 42
- img_proc: true
