  md: '# 22. Watch Another Puppet Show, Wayang Kulit


    If West Java owns Wayang Golek, Central Java has the Wayang Kulit. What differs
    Wayang Kulit from Wayang Golek is the material and the shape. If Wayang Golek
    is made of wood, Wayang Kulit is made of the skin of cow or buffalo for *kul*
    itself means skin. For the story, Wayang Kulit usually tells story of some Hindu
    tales like Mahabarata and Ramayana.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 23. Watch and Learn How to Dance Tari Srimpi


    Tari Srimpi or Srimpi dance is a kind of traditional dance from Central Java.
    Tari Srimpi is danced by four girls—srimpi itself means four—in which each girl
    has their own title, water, fire, wind and earth. Those four elements are representing
    four different winds as well as how humans are made. However, although I cannot
    do this dance, but Tari Srimpi is quite a beautiful dance that you should watch.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# 24. Take a Closer Look at Keris


    The traditional weapon from Central Java is called Keris. The form of Keris looks
    like a small blade but in a twisted form. However, what makes Keris is such a
    unique weapon from Central Java is not only the form, but because somehow, some
    people believe that Keris usually has some spirits being trapped inside it.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# 25. Learn another Dance, Tari Sintren


    Different than Tari Srimpi that is more classic, Tari Sintren or Sintren dance
    is a traditional dance from Pekalongan that is more mystic. The dance itself needs
    a virgin to do it, while she will then be possessed by the spirit of a goddess.
    Another unique thing from this dance, apart from the mystic feeling, is the costume
    for the dancer will wear a traditional costume complete with some jasmine around
    his head and a pair of sunglasses.'
  merge: -1
  pgno: 55
- img_proc: true
