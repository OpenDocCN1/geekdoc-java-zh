  md: '# 18. Have Dinner with Nasi Liwet


    Nasi in English means rice. However, this rice is different with other common
    rice you''ve ever tried because it tastes more savor for it is made with some
    coconut milk. This dish though, comes from Solo and if you are going to Solo,
    you will easily find the Nasi Liwet alongside some streets in Solo in the evening.
    Yes, the dish is sold not in any restaurant—although some restaurants have it
    as as their menu—but Nasi Liwet is sold by some street vendors.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 19. Warm Yourself with Wedang Ronde


    If in West Java we can find some Bandrek, Wedang Ronde is easy to find in Central
    Java, especially Salatiga. The beverage is also made of some spices—which ginger
    becomes the main ingredient—but it is more colorful for it has some other ingredients
    like the fruit of *Arenga Pinnata* or people in Indonesia usually called it *kolang-kaling*,
    gelatin, peanuts, and the *ronde itself*. Well, *ronde* is actually made from
    rice flour in a ball shape and has some peanuts inside.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# 20. Bite Some Tempe Mendoan


    Tempe Mendoan is one of my most favorite snacks. This dish is an example of the
    deep-fried snack from Indonesia called gorengan. Tempe Mendoan itself comes from
    Banyumas and Purwokerto, Central Java. In Purwokerto, mendoan means cooking in
    a hot and deep oil fast so that the dish is not too processed. However, although
    it seems to be raw, but the tempe itself has lots of nutrients that are good for
    our body.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 21. Another Bite of Gorengan, Tahu Petis


    After Tempe Mendoan, Tahu Petis is my next most favorite gorengan. Tahu Petis
    itself is a kind of fried tofu in which it is eaten with petis, a kind of sauce
    which is made from shrimp. What I love from Tahu Petis is the unique combination
    of the taste in which the tofu would most likely be salty and savory, while the
    petis has a bit sweet taste. However, the petis is also available in a spicy flavor.'
  merge: -1
  pgno: 49
- img_proc: true
