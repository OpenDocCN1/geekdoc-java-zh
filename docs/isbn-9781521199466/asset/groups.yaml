    \ the Greater than a Tourist series this book will give you tips and a bunch of\
    \ ideas from someone who lives at your next travel destination.\n\nIn these pages\
    \ you'll discover local advice that will help you throughout your stay. Greater\
    \ than a tourist is a series of books written by locals.\nTravel like a local.\
    \ Get the inside scope. Slow, stay in one place, take your time, get to know the\
