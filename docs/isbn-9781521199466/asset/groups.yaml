    can only walk inside the garden, I suggest you to wear your most comfortable shoes
    if you don’t want to have your feet hurt—or worst, if you don’t to have the same
    experience as me, having my sandals broken.'
  - '[PAGE 19]


    # 2. See the Green Scenery of Green Canyon


    If the United States owns the Grand Canyon, Indonesia has the Green Canyon in
    West Java. Different from the Grand Canyon that is dry, Green Canyon is more watery
    for it has a river runs along it. The river which has quite a heavy current allows
    you to do some bindings. Located in Pangandaran, West Java, Green Canyon is only
    45 minutes drive from the city, but quite far from the capital city of Jakarta
    for you’ll need around 9 hours drive. However, I still suggest you to come and
    see the beauty—and the green scenery—of Green Canyon, especially for you who love
    outdoor activities.'
- md: '

    ## 3. Witness the Sunrise and Sunset at Pangandaran Beach


    Not far from the Green Canyon, you will be able to see the beauty of a white sand
    beach located in West Java, Indonesia. Being the best beach in the province, you''ll
    be amazed by the beach for you will not only be able to enjoy the sunrise or sunset
    only, but you can do both! Apart from that, Pangandaran beach also offers other
    things to do, from swimming in the clear water which is perfectly safe, having
    fun with the beauty of the marine and also witnessing a cave, a relic from the
    World War II.


    ## 4. See the Crater at Tangkuban Perahu


    Tangkuban Perahu, which is a volcano, is another place to visit in West Java.
    Coming from a legend from the province, Tangkuban Perahu is one of the most famous
    attractions in Java Island, more precisely, West Java. Apart from the legend,
    the volcano itself is called Tangkuban Perahu—in English the words Tangkuban Perahu
    means an upside-down boat—for the tip looks like that. What I would suggest you
    from this active plantation volcano mountain is that the craters which are full
    of sulfur and the tea plantation on the hillside.


    ## West Java and Banten


    ## Food to Try


    ## 5. Taste This Various Veggies in Karedok


    Karedok is one example of culinary that comes from West Java. For you who love
    to eat vegetables, Karedok is certainly a compulsory dish to try when you visit
    West Java. The food consists of different kinds of raw veggies, from cucumber,
    eggplant, bean sprouts, cabbage, to long beans. Those veggies are not eaten directly
    though, you''ll definitely find a new taste of those vegetables when they are
    mixed with the sauce which is made of peanut sauce, garlic, peanuts, shrimp paste,
    and some other ingredients. Well, for I prefer it to be spicy, I would usually
    ask for more chilies.


    ## 6. Be a Bandung Citizen While Tasting Batagor


    Although this food is now available across Indonesia, especially Java, Batagor
    actually comes from West Java. Batagor itself is an acronym from bakso tahu goreng
    or in English it will be fried tofu ball. As how its name, the dish actually consists
    of some tofu which are cut square, then being smeared with the dough and being
    fried. Sometimes, they will also give you the fried tofu—the one without the dough—but
    I would prefer the batagor only.


    ## 7. Try Serabi Oncom


    Serabi is a light snack known actually not only in West Java for you can also
    find it in East Java. However, this serabi from West Java is quite different for
    the topping is what makes it so West Java. Serabi itself is a snack that looks
    like some pancake but it is made from rice powder. While the topping, which is
    oncom, is like tempeh. I don''t really like oncom though, but for you who really
    love to try some unique food, this serabi is a must.


    ## 8. Sip Bandrek to Make You Stay Warm


    Although Indonesia doesn''t have winter, but when the rainy season comes, it can
    get cold as well. If western people keep the warmth by consuming some alcoholic
    beverages, West Javanese people prefer to sip some *bandrek*. *Bandrek* is actually
    a traditional drink which is made from spices like ginger, brown sugar (also known
    as Javanese Sugar) and pepper. Usually I would sip some when I get some cold for
    it will ease my throat.


    ## 9. Get Some Laugh Watching Wayang Golek


    If you ask any Indonesian people about Wayang Golek, what comes to their mind
    is usually Cepot. Well, Cepot is a character of Wayang Golek or the traditional
    wooden puppet from West Java that is the most prominent. Wayang Golek itself,
    as how other puppets, usually shows some historical stories which most likely
    come from West Java. The performance will be accompanied with some traditional
    music from West Java called Degung.


    ## 10. Try to Learn Jaipong


    Indonesian traditional dances are a lot different from any modern dance that is
    happening right now, including the ones come from West Java. An example of the
    traditional dance from West Java that is quite popular is Jaipong. I really love
    to watch the dance for its uniqueness as because West Java’s culture is somehow
    unique and attractive.


    ## 11. Play Your Angklung


    When I was a kid, I was so fascinated with this traditional music instrument that
    comes from West Java. The shape is really unique for it is made from a special
    bamboo, and different size will produce different sounds. At first, Angklung is
    only known for some traditional events, but as it gets globalized, Angklung is
    now known around the world.


    ## 12. Watch the Unique Horse, Kuda Lumping


    Kuda is the Indonesian word for a horse. Before you I would probably think that
    this traditional culture from West Java will use horses, like some kind of horseback
    riding and sort. Well, indeed they use horse, but this horse they use is quite
    different. Unlike real horse—with its 4D appearance, it uses unique artificial
    2D horse which is made of wood. The other unique thing from this West Javanese
    culture is that it uses spirit which will possess the one who’s riding the artificial
    horse. An advice from me, if you’re not accustomed with people eating glasses
    or stabbing their own bodies with weapons—duh, who’ll be accustomed with those
    things—just prepare yourself mentally.


    ## Central Java


    ## Places to Visit


    ## 13. Know the History of Solo from Kraton Surakarta


    Although Indonesia is now a republic, the country used to have quite an amount
    of kingdoms. Many of them can only be witnessed through the literatures and the
    remaining inheritances though, but several are still managing their palaces as
    parts of the Republic, and one of them is located in Surakarta—or people would
    easily call it Solo, Central Java, Indonesia. Being one of the kingdoms which
    still exist, it is likely that the palace, which is called kraton in Javanese,
    become one of the center of attraction in Central Java. Kraton Surakarta doesn’t
    only offer you a great amount of history of Surakarta from the past, but it is
    also full with lots of Javanese culture. Meanwhile, if you would like to shop,
    Kraton Surakarta is located near some shopping center which will offer you some
    low-priced batik—traditional cloth from Java with beautiful patterns, symbols,
    and colors.


    ## 14. Be Free at Karimunjawa


    If you are in love with snorkeling and diving, I really suggest you to come visit
    this island on the north side of Java, around five to six hours by boat from Jepara,
    Central Java. Although the access to the islands of Karimunjawa is quite hard
    to get, but the beauty of the nature and marine life is supposed to adore. Everyone
    who''s been there tells me that they want to go there again, and so do I. It is
    a piece of jewel in Java. The beauties can be compared to those of Bali—minus
    the extravagant shopping precincts.


    ## 15. Get to Know the Prehistoric People at Sangiran


    If you are interested in prehistoric era, Sangiran is the place you should visit
    when you are coming to Central Java. This archaeological excavation site which
    is located in Sragen, Central Java, has been stated as a World Heritage by UNESCO.
    The fossils that can be found in this museum are also varied for you can find
    more than 13,800 collections of the fossils. It is the home of the prehistoric
    Javanaman although some collections show Olduvai Gorge from Tanzania, Willandra
    Lakes from Australia and Zhoukoudian from China.


    ## 16. Feel the Fresh Air of Dieng Plateau


    From fresh air, beautiful nature, until historical places are all being offered
    by the plateau. Dieng plateau is located in Wonosobo, Central Java, around 30km
    from the city. There’s this infamous *Telaga Tiga Warna*, a lake located on the
    peak of the plateau which has three different colors. Apart from that, there are
    also several Hindu temples around the place. However, what I like best from Dieng
    Plateau is the *carica*, some fruit in the same family as papaya.

    '
  mdcn: '


    ## 3. 在潘加达兰海滩观看日出和日落


    距离绿谷（Green Canyon）不远，你就能看到位于印度尼西亚西爪哇省的白沙滩。作为该省最好的海滩，你会被这里惊艳，因为你不仅可以享受日出或日落，两者都可以兼得！此外，潘加达兰海滩还提供其他活动，从在清澈安全的海水中游泳，尽享海洋之美，到见证第二次世界大战的遗迹洞穴。


    ## 4. 观汤库班帕胡火山的山口


    汤库班帕胡（Tangkuban Perahu）是一座火山，是西爪哇另一个值得去的地方。它源于该省的一个传说，汤库班帕胡是爪哇岛最著名的景点之一，确切地说是西爪哇。除了传说之外，火山本身被称为
    Tangkuban Perahu——在英语中这个词的意思是“倒扣船”——因为它的顶部看起来就像那样。对于这座活火山山口山，我建议你看看那些充满硫磺的山口以及山坡上的茶园。


    ## 西爪哇与万丹


    ## 必尝美食


    ## 5. 尝尝 Karedok 里的各种蔬菜


    Karedok 是来自西爪哇的美味之一。对于热爱吃蔬菜的你，访问西爪哇时，Karedok 绝对是必尝菜。这种食物由各种生蔬菜组成，从黄瓜、茄子、豆芽、卷心菜到长豆都有。这些蔬菜并不是直接吃的，当你把它们与由花生酱、大蒜、花生、虾膏和其他配料制成的酱混合时，你一定会发现这些蔬菜的新味道。嗯，由于我偏好辣味，我通常会要求多加一些辣椒。


    ## 6. 品尝 Batagor，做万隆人


    尽管这种食物现在遍布印度尼西亚，尤其是爪哇岛，但 Batagor 实际上源自西爪哇。Batagor 本身是 `bakso tahu goreng` 的缩写，英语翻译为“炸豆腐丸”。正如其名，这道菜实际上由切成方形的豆腐组成，裹上糊后炸制。有时，他们也会给你炸豆腐——没裹粉的那种——但我更倾向于只吃
    batagor。


    ## 7. 尝试 Serabi Oncom


    Serabi 是一种轻食，实际上不仅在西爪哇闻名，东爪哇也能找到。然而，这种来自西爪哇的 serabi 非常不同，因为配料赋予了它西爪哇特色。Serabi
    本身是一种看起来像煎饼的零食，但是由米粉制成的。而上面的配料 `oncom`（发酵豆饼）类似于天豆。我并不喜欢 oncom，但对于那些非常想尝试独特食物的你来说，这种
    serabi 是必不可少的。


    ## 8. 喝杯 Bandrek 暖暖


    尽管印度尼西亚没有冬天，但当雨季来临时天气也会变冷。如果西方人通过饮用酒精来保持温暖，西爪哇人则倾向于喝一些 *bandrek*。*Bandrek* 实际上是一种传统饮料，由姜、红糖（也称为爪哇糖）和胡椒等香料制成。通常当我感冒时会喝一些，因为它能缓解我的喉咙。


    ## 9. 观看木偶（Wayang Golek）开开怀


    如果你问任何印度尼西亚人关于 Wayang Golek，他们脑海中浮现的通常是 Cepot。嗯，Cepot 是 Wayang Golek（来自西爪哇的传统木偶）中最著名的角色。Wayang
    Golek 本身像其他木偶一样，通常展示一些可能来自西爪哇的历史故事。表演会伴随着来自西爪哇的、被称为 Degung 的传统音乐。


    ## 10. 尝试学习 Jaipong 舞蹈


    印度尼西亚的传统舞蹈与现在的任何现代舞蹈都有很大不同，包括来自西爪哇的舞蹈。西爪哇非常受欢迎的传统舞蹈例子是 Jaipong。我非常喜欢看这种舞蹈，因为它独特性，因为西爪哇的文化确实独特且富有魅力。


    ## 11. 弹奏你的 Angklung（安格隆）


    当我还是孩子时，我对这种来自西爪哇的传统乐器着迷。它的形状非常独特，由特殊的竹子制成，不同尺寸会产生不同的声音。起初，Angklung 只在某些传统活动为人知，但随着全球化，Angklung
    现在闻名全球。


    ## 12. 观看独特的马：Kuda Lumping


    Kuda 是印度尼西亚语中“马”的意思。在之前，我可能会认为这种来自西爪哇的传统文化会使用马，比如某种骑马之类的活动。嗯，他们确实使用马，但他们使用的马非常不同。与具有
    4D 外观的真马不同，他们使用的是由木头制成的独特人工 2D 假马。这种西爪哇文化的另一个独特之处在于它使用灵性，灵性会附身在骑假马的人身上。我的建议是，如果你不习惯别人吃玻璃或用武器刺自己的身体——呃，谁会习惯这些事儿呢——请先在心理上做好准备。


    ## 中爪哇


    ## 游玩景点


    ## 13. 从苏卡尔塔宫（Kraton Surakarta）了解索罗的历史


    尽管印度尼西亚现在是一个共和国，但这个国家曾拥有许多王国。其中许多只能通过文学和残留的遗产来见证，但仍有一些王国作为共和国的一部分管理着宫殿，其中一个就位于苏卡尔塔（Surakarta）——人们习惯地称其为
    Solo，位于印度尼西亚中爪哇。作为仍然存在的王国之一，这座宫殿（爪哇语称为 kraton）很可能是中爪哇的景点中心之一。苏卡尔塔宫不仅为你提供了大量关于过去索罗丰富的历史，还充满了大量的爪哇文化。同时，如果你想购物，苏卡尔塔宫位于一些购物中心附近，那里可以为你提供低价的巴迪（batik）——来自爪哇、具有美丽图案、符号和颜色的传统布料。


    ## 14. 在卡里满旺尽情释放


    如果你热爱浮潜和潜水，我强烈建议你来这座位于爪哇岛北部的岛屿，从中爪哇的西拉（Jepara）乘船大约五到六小时。虽然到达卡里满旺岛很难，但那里的自然景观和海洋生物值得赞赞。每个去过那里的人告诉我他们想再去一次，我也是如此。它是爪哇的一颗宝石。其美丽程度可以与巴厘相比——只不过没有奢华的购物区。


    ## 15. 在桑格兰了解史前人类


    如果你对史前时代感兴趣，来到中爪哇时你应该去桑格兰。位于中爪哇瓦根（Sragen）的考古发掘现场已被联合国教科文组织宣布为世界遗产。在这个博物馆中发现的化石也非常多样，你可以找到超过
    13,800 件化石收藏。它是爪哇人的故乡，尽管有些收藏品展示了坦桑尼亚的奥杜威峡谷、澳大利亚的威尔兰拉湖和中国的周口店。


    ## 16. 感受迪登高原的新空气


    从新鲜的空气、美丽的自然到历史景点，这个高原提供一切。迪登高原位于中爪哇的望索坡（Wonosobo），距离市区约 30 公里。这里有一个闻名的 *Telaga
    Tiga Warna*（三色湖），这是一个位于高原顶的湖泊，拥有三种不同的颜色。此外，周围还有几座印度教寺庙。然而，我最喜欢迪登高原的是 *carica*（蜜柠檬果），一种与木瓜同科的水果。


    '
