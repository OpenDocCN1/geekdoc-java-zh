    \ guidance. Patronize local business and vendors when you travel. Be willing to\
    \ try something new and have the travel experience of a lifetime.\n\nBy the time\
    \ you finish this book, you will be excited to travel to your next destination.\n\
    \nAs Indonesian natives, we are glad of having the opportunity to write the series\
