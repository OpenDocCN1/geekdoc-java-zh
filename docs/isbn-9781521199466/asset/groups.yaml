  - '[PAGE 89]


    # 48. Watch Ketoprak


    If East Java has Ludruk as its iconic play, Yogyakarta will settle to Ketoprak.
    This is another traditional play that comes from Java in which most likely the
    story will be about some historical events about the folks. The different thing
    from Ludruk is that, the cast will not always be males. Usually, during the play,
    the background music will come from the traditional music instruments called gamelan.'
  - '[PAGE 90]


    # 49. Watch Again, Sendratari Ramayana


    As I''ve told you before, when you''re going to Prambanan, you will also be able
    to watch the dance show called Sendratari Ramayana—or you could call it, Ramayan
    Ballet. The story is based on a Sanskrit poem with the same title, telling about
    the story of Sri Rama whose woman Shinta is being kidnapped by a giant called
    Rahwana. The ballet is performed in an open stage at the area of Prambanan Temple
    in which the temple will become the background of the stage alongside with the
    full moon.'
  - '[PAGE 91]


    # 50. Learn How the Soldier Fight by Watching Jatilan


    Jatilan is actually a dance. This traditional dance tells the story of cavaliers
    who are in a battle. However, as some other dances which use artificial horses
    called *kuda lumping*, this dance is also quite mystic because most likely the
    dancers will also get possessed.'
