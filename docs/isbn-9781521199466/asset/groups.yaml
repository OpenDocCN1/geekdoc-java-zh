- md: '

    # 33. Try another Veggies-with-Peanut-Sauce, Gado-gado


    I just don''t know why East Javanese people really like to eat some veggies being
    mixed with peanut sauce. But this Gado-gado is also an item of culinary that you
    should try, especially if you think that Rujak Cingur is too extreme—probably
    you can start from Gado-gado. The difference between Rujak Cingur and Gado-gado
    is that you will have the boiled veggies instead of raw vegetables. Also, instead
    of cingur, you will have boiled egg as the companion for the vegetables. The sauce
    is also different because gado-gado uses peanut sauce instead of petis sauce.


    # East Java


    # Culture to Learn


    # 34. Watch Ludruk, a Traditional Play from East Java


    Whenever you are watching a play, it is common thing to have male and female act
    together on stage. But, when you watch a Ludruk performance, it is reasonable
    if you are wondering about the cast for most likely Ludruk is being performed
    by males. The story that is being performed by Ludruk, most likely is about the
    everyday life of the commoners that is full with humor and critics. If you want
    to watch a Ludruk show, it is better for you to find it in Surabaya, Mojokerto
    and Jombang.


    # 35. Be Amazed Watching Reog Ponorogo


    An example of beauty and culture. That is what I think of Reog Ponorogo. This
    artistic dance comes called Reog comes from Ponorogo that has been patented since
    2001. The dance which has been an icon for East Java also perform some mystical
    occurrence as how Kuda Lumping is. However, the thing that will fascinate you
    is definitely the huge mask of lion that is full with a crown made from the feather
    of peacock.


    # 36. Watch the Cow Race from Madura, Karapan Sapi


    The cow race is different with any horseback-riding race and stuff. Karapan Sapi
    is a race in which a couple of cows are racing while pulling a cart. Usually,
    the race happens around August until October, and even, there''s this President
    Cup as the prize.


    # 37. Try to Learn Tari Remo


    Tari Remo or Remo dance is a traditional dance from Surabaya, East Java. The dance
    portrays a symbol of heroism for it shows some courage, masculinity and valor.
    Sometimes being played to welcome some guests, Tari Remo also becomes the opening
    dance of a Ludruk show.


    # Yogyakarta


    # Places to Visit


    # 38. Shop at Malioboro


    There’s this long street at Yogyakarta, in the middle of the city, which will
    be the heaven for shopaholics. Malioboro is the place where you can find so many
    things being sold in a very low price—though you have to be able to bargain to
    get the cheaper price—from trinkets to Batik. Near the street, there is also this
    traditional market which specializes in things like Batik until traditional Javanese
    wedding gown. My suggestion is that, because the place is really crowded every
    single day, watch your own belonging because we would never know where the pickpocket
    hides.


    # 39. Take Beautiful Pictures of the Beaches Around Gunung Kidul


    This is the heaven for beach lovers. Located quite far from the central of Yogyakarta,
    Gunung Kidul offers a number of beautiful beaches in white sand which are all
    exotic. The most popular one—and of course the most crowded one—is Indrayanti
    beach. Apart from it, there are Drini beach, Kukup beach, and some other beaches
    which are quite near from each other although each of them has its own charm.
    Meanwhile, if you are looking for a more private one, I suggest you to go to Pok
    Tunggal beach. Even though the location is covered by some cliffs, but the beauty
    is one to adore.


    # 40. Visit Prambanan Temple and Have Fun Watching the Sendratari


    This Hindu temple has also been become a World’s Heritage by UNESCO. Prambanan
    Temple is actually unique and the shape is really beautiful. Although some of
    it has been broken, but still, even from afar you can take a look at the opulence
    of the temple. Meanwhile, there’s also this Sendratari Ramayana, a story which
    is being played by dancing at night that is so incredible. I bet you’ll want to
    watch it again when you’re done watching. But make sure to check the website first
    to know when the show will play.


    # 41. Adore the Beauty of Arts at Affandi Museum


    Affandi was one of the most prominent artists in Indonesia. He is also acknowledged
    by the international painters for his techniques and skills that were so genuine.
    He began to create expressionist paintings early in the 1950’s when he couldn’t
    find his pencil and apply the paint directly from the tube. If you are curious
    on how those paintings of his look like, most of them are being displayed in the
    museum which located near the airport so that you can easily reach there after
    you land. There’s also a restaurant inside for you to take a rest and have some
    lunch or dinner.


    # 42. Buy the Artistic Things at Kasongan


    Kasongan is a place where you can find some arts which represent Indonesia, especially
    Yogyakarta, to bring home. Most likely though, the craft that you will find there
    is pottery. Not only will it have ornaments for decoration, but Kasongan also
    produces things like pottery.


    # 43. Never Forget to Try Gudeg


    Gudeg is the most compulsory dish you should try whenever you come to Yogyakarta.
    This culinary been known around Indonesia and although you can find it in other
    places, Gudeg is made of raw jackfruit, cooked with palm sugar and coconut milk.
    If you want to try, just come to Kampung Wijilan. A spoiler for you, the taste
    is most likely sweet, but with a bit spicy.


    # 44. Take a Bite of Bakpia Pathuk


    If you come to Yogyakarta, there’s this snack that you have to try, called Bakpia
    Pathuk. This small snack is made of flour with some stuffing inside it, then being
    baked. At first, Bakpia Pathuk is known to have green beans as the filling, but
    now it becomes more varied for you can also eat those with chocolate and cheese
    filling.


    # 45. Take another Bite for Yangko


    Yangko is another snack from Yogyakarta that will usually be home for your family.
    This snack is usually cut in small pieces of square which also has some different
    color. This snack though is like Mochi for it has a soft and chewy texture, sweet
    and also sticky.


    # 46. Taste the Sweetness of Geplak


    Not only Bakpia Pathuk and Yangko, Yogyakarta is also known for its Geplak. This
    snack is really sweet and attractive for it has so many different colors and the
    shape is small yet cute and unique. Made of coconut and rice flour, Geplak can
    also be found in different flavor from orange, strawberry, until durian.


    # 47. Witness this one Sacred Ceremony, Sekaten


    Just like Surakarta which still has its Kasunanan or kingdom, Yogyakarta also
    has its Kasultanan, another name for kingdom. That’s why, Yogyakarta still has
    various traditional ceremony, including Sekaten. This ceremony happens to commemorate
    the birth of Prophet Muhammad. However, the commemoration is also full with some
    traditional beliefs in which one of them is the belief of the people to stay young
    if they attend the ceremony from the start by munching at some sirih—a kind of
    leaf.

