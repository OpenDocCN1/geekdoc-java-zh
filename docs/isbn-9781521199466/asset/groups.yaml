  mdcn: "\n\n## 48. 观看 Ketoprak\n\n如果说东爪哇以 Ludruk 为其标志性戏目，那么日洛亚卡塔则倾向于 Ketoprak。这是另一种源自爪哇岛的传统戏剧，故事通常是关于当地的一些历史事件。与\
    \ Ludruk 不同之处在于，演员阵容并不总是男性。通常，在表演期间，背景音乐来自名为甘美兰（gamelan）的传统乐。\n\n## 49. 再次观看，罗摩衍那舞剧（Sendratari\
    \ Ramayana）\n\n正如我之前告诉过的，当你去普兰巴南（Prambanan）时，你可以观看名为 Sendratari Ramayana 的舞蹈表演——你也可以称之为罗摩衍那芭蕾。这个故事基于一首同名的梵文，讲述了斯里·罗摩（Sri\
    \ Rama）的妻子辛塔（Shinta）被一个名叫罗湿那那（Rahwana）的巨人劫持的故事。芭蕾在普兰巴南寺区域的露天舞台表演，寺庙在满月下将成为舞台的背景。\n\
    \n## 50. 通过观看 Jatilan 学习士兵如何战斗\n\nJatilan 实际上是一种舞蹈。这种传统舞蹈讲述了骑士在战斗中的故事。然而，与其他一些使用名为\
    \ *kuda lumping* 的假马的舞蹈不同，这种舞蹈也带有某种神秘色彩，因为舞者很可能会进入附神状态。\n\n## 游客\n\n## 比游客更懂（Greater\
    \ than a Tourist）\n\n请阅读其他“比游客更懂”系列书籍。\n\n加入 >Tourist 邮件列表： \nhttp://eepurl.com/cxspyf\n\
    \nFacebook:\nhttps://www.facebook.com/GreaterThanATourist\n\n请在 Amazon 和 Goodreads\
    \ 上对这本书留下您诚恳的评价。谢谢您。\n\n## 你对计划下一次旅行感到兴奋吗？\n你愿意在旅行时尝试一些新奇事物吗？\n你想要来自当地人的指导吗？\n\
    \n如果你对这些中任何一个问题的回答是“是”，那么这本书就是为你准备的。\n\n《Greater Than a Tourist – 印尼西亚爪哇》由 Dian\
    \ Pramesti 和 Hanum Gitarina 编写，提供了印度尼西亚爪哇的内部视角。大多数旅游书籍都在教你如何像游客一样旅行。虽然这并没有错，但“比游客更懂”系列的一部分，这本书将为你提供来自你下一个旅行目的地当地人的的建议和大量想法。\n\
    \n在这些页面中，你将发现帮助你度过停留期间的当地建议。“比游客更懂”系列是由当地人编写的一系列书籍。\n像当地人一样旅行。获取内部信息。慢下来，留在一个地方，慢慢来，了解一个地方的人们和文化。在指导下尝试一些避开常径的路线。旅行时光顾当地企业和商贩。愿意尝试新事物，获得终生难忘的旅行体验。\n\
    \n当你读完这本书时，你将对前往下一个目的地旅行感到兴奋。\n\n作为印度尼西亚当地人，我们很高兴有机会编写《畅游印度尼西亚》系列丛。对我们来说，爪哇不仅仅是一个岛，它是我们出生和成长的地方。在过去的几十年里，爪哇的很多地方发生了变化，但更多东西被当地人完好地保留，包括人们的友好、文化遗产、壮丽的自然风景等等——我们称之为“爪哇的丰富性”。我们只是想向世界分享一些爪哇的片段。\n\
    \n![](img/f5031453bf615ef1b53b13bbfd3f057d_99_0.png)\n\n"
