    # > TOURIST


    # Authors Bio


    As Indonesian natives, we are glad of having the opportunity to write the series
    of Traveling to Indonesia. Java is more than just an island for us, for it is
    the place where we were born and grew up. Many things have changed in Java in
    the last decades, but more are well preserved by the natives, including the friendliness
    of the people, the cultural heritages, the magnificent natural sceneries, and
    more—something we call as the richness of Java. We simply want to share some bits
    and pieces of Java to the world.


    # WELCOME TO > TOURIST


    > "I can speak to my soul only when the two of us are off exploring deserts or
    cities or mountains or roads.”–Paulo Coelho


    Indonesia, as an archipelago, has a lot of attractions, not only from the nature,
    but also from the culture. Also, as an archipelago which consists of thousands
    of islands—with five big islands as its main lands, Indonesia offers its diversities
    that most travelers will definitely enjoy. Not only breathtaking natural beauties
    that tourist will enjoy, but also friendly people, countless traditions, customs,
    ethnics, rituals, local languages, signature dishes, beliefs, and more.


    Among more than 17,000 islands, only few have attracted the attention of the world,
    such as Bali, Java, and Borneo. In this special edition, we would like to present
    the magnificent Java, one of the five major islands, that long has hypnotized
    the eyes of the world.


    Java, as the most populated island in Indonesia, is not only full with people.
    Divided by six provinces, the Indonesian island of Java also owns a lot of things
    to explore, from nature, culture, until culinary and they all will be discussed
    later. We will reveal 50 bits and pieces of Java to give you hints of some among
    attractions. Enjoy!


    # West Java and Banten

    ## Places to Visit


    ### 1. Meet Up with Diversed Vegetation at Bogor Botanical Garden


    Located in Bogor, West Java—around 60 km from Jakarta, Bogor Botanical Garden
    is the place where you will be able to see so many kinds of vegetation which most
    likely comes from Indonesia, from the most common ones up the rarest ones. One
    of the most attractive plants from this garden is the Amorphophallus titanium,
    a name of this huge flower which produces the smell of carcass, comes from Pagar
    Alam, South Sumatra. Not only that, in front of the building of Istana Bogor,
    a presidential palace, lots of lotus can be find that will be nice spot to have
    a picture taken. However, since the place is quite huge—around 210 acres—and you
    can only walk inside the garden, I suggest you to wear your most comfortable shoes
    if you don’t want to have your feet hurt—or worst, if you don’t to have the same
    experience as me, having my sandals broken.


    ### 2. See the Green Scenery of Green Canyon


    If the United States owns the Grand Canyon, Indonesia has the Green Canyon in
    West Java. Different from the Grand Canyon that is dry, Green Canyon is more watery
    for it has a river runs along it. The river which has quite a heavy current allows
    you to do some bindings. Located in Pangandaran, West Java, Green Canyon is only
    45 minutes drive from the city, but quite far from the capital city of Jakarta
    for you’ll need around 9 hours drive. However, I still suggest you to come and
    see the beauty—and the green scenery—of Green Canyon, especially for you who love
    outdoor activities.

