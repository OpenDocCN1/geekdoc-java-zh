- md: '

    ## 17. Know More About Batik at Batik Museum


    Batik Museum is located in Pekalongan which has become the city of Batik. The
    museum is considered as new one for it has only been built in 2006. Batik Museum
    doesn''t only consist of a huge collection of Batik, but it has also become a
    place to do some research in developing the design of Batik. Well, Batik itself
    is such a pride for the nation because it brings the culture of Indonesia. Have
    you worn any Batik before? Only for your information, almost all provinces in
    Indonesia have their own version of Batik. Interestingly, in Java, which consists
    of only 6 provinces, there are dozens and even hundreds different version of Batik
    with their own stories and histories behind the makings.


    ## Central Java


    ### Food to Try


    ## 18. Have Dinner with Nasi Liwet


    Nasi in English means rice. However, this rice is different with other common
    rice you''ve ever tried because it tastes more savory for it is made with some
    coconut milk. This dish though, comes from Solo and if you are going to Solo,
    you will easily find the Nasi Liwet alongside some streets in Solo in the evening.
    Yes, the dish is sold not in any restaurant—although some restaurants have it
    as as their menu—but Nasi Liwet is sold by some street vendors.


    ## 19. Warm Yourself with Wedang Ronde


    If in West Java we can find some Bandrek, Wedang Ronde is easy to find in Central
    Java, especially Salatiga. The beverage is also made of some spices—which ginger
    becomes the main ingredient—but it is more colorful for it has some other ingredients
    like the fruit of *Arenga Pinnata* or people in Indonesia usually called it *kolang-kaling*,
    gelatin, peanuts, and the *ronde itself*. Well, *ronde* is actually made from
    rice flour in a ball shape and has some peanuts.


    ## 20. Bite Some Tempe Mendoan


    Tempe Mendoan is one of my favorite snacks. This dish is an example of deep-fried
    snack from Indonesia called gorengan. Tempe Mendoan itself comes from Banyumas
    and Purwokerto, Central Java. In Purwokerto, mendoan means cooking in hot and
    deep oil so that the dish is not processed. However, although it seems to be raw,
    the tempe itself has lots of nutrients that are good for our body.


    ## 21. Another Bite of Goreng, Tahu Petis


    After Tempe Mendoan, Tahu Petis is my next favorite gorengan. Tahu Petis itself
    is a kind of fried tofu in which it is eaten with petis, a kind of sauce which
    is made from shrimp. I love from Tahu Petis is the unique combination of the taste
    in which the tofu would most likely be salty and savory, while the petis is also
    available in a spicy flavor.


    ## Central Java


    ### Culture to Learn


    ## 22. Watch Another Puppet Show, Wayang Kulit


    If West Java owns Wayang Golek, Central Java has the Wayang Kulit. What differs
    Wayang Kulit from Wayang Golek is the material and shape. If Wayang Golek is made
    of wood, Wayang Kulit is made of the skin of cow or buffalo for *kulit* means
    skin. For the story, Wayang Kulit usually tells story of Hindu tales like Mahabharata
    and Ramayana.


    ## 23. Watch and Learn How to Dance Srimpi


    Tari Srimpi or Srimpi dance is a kind of traditional dance from Central Java.
    Tari Srimpi is danced by four girls—srimpi itself means four—in which each girl
    has their own title, water, fire, wind and earth. Those four elements are representing
    four elements well as how humans are made. However, although I cannot do this
    dance, Tari Srimpi is quite a beautiful dance that you should watch.


    ## 24. Take a Closer Look at Keris


    The traditional weapon from Central Java is called Keris. The form of Keris looks
    like a small blade but in twisted form. However, what makes Keris such a unique
    weapon from Central Java is not only the form, but because somehow some people
    believe that Keris has some spirits trapped inside it.


    ## 25. Learn another Dance, Tari Sintren


    Different than Tari Srimpi that is more classic, Tari Sintren or Sintren dance
    is a traditional dance from mystic. The dance itself needs a virgin to do it,
    while she will then be possessed by the spirit of a goddess. Another unique thing
    from this dance, apart from the mystic feeling, is the costume for the dancer
    will wear a traditional costume complete with some jasmine around his head and
    a pair of sunglasses.


    ## East Java


    ### Places to Visit


    ## 26. Witness the Sunrise at Bromo


    Mount Bromo is one of the most prominent attractions in East Java. Most people
    would come to Mount Bromo to be able to witness the beautiful sunrise from the
    peak of the mountain. However, although this mountain which is included in Bromo
    Tengger Semeru National Park is not as high as the other volcanoes, it has such
    a really beautiful view which amazed every tourist.


    ## 27. Take a Look at the Beautiful Kawah Ijen Banyuwangi


    Not only West Java which has Tangkuban Perahu with its craters, East Java owns
    this beautiful Kawah Ijen which is also the biggest crater in the Indonesian Island
    of Java. This sulfuric crater is so beautiful for it has tosca green and blue
    fire color. Although you have to hike for around one and half hour at midnight,
    I believe you’ll be so into the beauty of this crater in Banyuwangi, East Java.


    ## 28. Meet the Nature at Baluran National Park


    Indonesia might belong into a tropical country. However, the country is also blessed
    with some dry ecosystem, and one of them is located in East Java, more precisely
    at Baluran National Park. Most likely, what you''ll find at the park is savanna
    in which it occupies 40% of the ecosystem. Another attraction that is offered
    by the national park is the mascot which is the bull.


    ## 29. Be Amazed at the House of Sampoerna


    Java Island is indeed known as the producer of cigarette. One of the oldest and
    biggest cigarette factories is Sampoerna which is located in Surabaya, East Java.
    However, the factory is now offering an attraction which is the House of Sampoerna,
    a museum which features a colonial design as the building was built in 1862. However,
    although it seems old, but the museum is designed in a fancy way that will definitely
    make you feel like home, in addition with the café inside.


    ## 30. Munch some Rujak Cingur


    Actually, I don''t really favor eating some fresh veggies or fruit which is mixed
    with some peanut sauce or *petis* sauce. However, this one is different. Rujak
    Cingur which comes from Surabaya, the capital city of East Java tastes different.
    Consists of many kinds of fruit and vegetables like cucumber, raw mango, watercress,
    tofu, and also *cingur*—the mouth of cow—and then mixed together with the *petis*
    sauce. Some people who don''t really eat weird stuff like *cingur* will be hesitant
    to try, but I do think it is a nice idea to try for the taste will bring you to
    cloud nine!


    ## 31. Get a Try of Rawon


    Rawon is a name of soup that comes from East Java, most likely Pasuruan. The unique
    thing from Rawon is the soup, for it has black color. Well, not literally black,
    but more like dark brown. Usually people will eat this soup, which consists of
    meat, with rice, fresh bean sprouts and rice cracker. If you want to try eating
    this dish, you will easily get it as long as you are in East Java for most likely
    any food stall in East Java will have Rawon as their menu, especially in Pasuruan.


    ## 32. Take a Bite of Satay Madura


    When you ask about satay to any Indonesian people, most likely what will be in
    their mind is the satay which comes from Madura, an island which is near Surabaya.
    This kind of satay usually uses chicken as the main ingredient. To eat the satay,
    you will need to pour the grilled chicken meat which is placed in skewers with
    some peanut sauce. I would prefer to pour some soybean sauce with some sliced
    onion on top of it.

    '
  mdcn: '


    ## 17. 在蜡染博物馆了解更多蜡染


    蜡染博物馆位于佩卡隆根（Pekalongan），这里已成为蜡染之城。该博物馆被认为是一个新人，因为它于2006年才建成。蜡染博物馆不仅拥有大量的蜡染收藏，还成为了研究开发蜡染设计的场所。其实，蜡染本身是这个国家的骄傲，因为它代表了印度尼西亚的文化。你以前穿过蜡染吗？仅供你参考，印度尼西亚几乎每个省份都有自己版本的蜡染。有趣的是，在仅有6个省份的爪哇岛上，有几十甚至上百种不同的蜡染版本，每种背后都有自己的故事和历史。


    ## 中爪哇


    ### 值得尝试的食物


    ## 18. 享用 Nasi Liwet 晚餐


    Nasi 在英语中是米饭的意思。然而，这种米饭和你尝试过的其他普通米饭不同，因为它加入了一些椰奶，所以味道更加咸香。这道菜来自索罗（Solo），如果你去索罗，傍晚时很容易在索罗的街边上找到
    Nasi Liwet。是的，这道菜不是在餐厅出售——虽然有些餐厅将其作为菜单的一部分——但 Nasi Liwet是由街头小贩出售的。


    ## 19. 用 Wedang Ronde 暖暖身体


    如果在西爪哇我们可以找到 Bandrek，那么在中爪哇很容易找到 Wedang Ronde，特别是在萨拉蒂加（Salatiga）。这种饮料也是由香料制成的——生姜是主要原料——但它的色彩更加丰富，因为它包含其他成分，如
    *Arenga Pinnata* 的果实（印度尼西亚人通常称之为 *kolang-kaling*）、胶质、花生以及 *ronde 本身*。实际上，*ronde*
    是用米粉制成的球状，里面含有花生。


    ## 20. 尝尝 Tempe Mendoan


    Tempe Mendoan是我最喜欢的零食之一。这道菜是印度尼西亚一种名为 gorengan 的油炸零食。Tempe Mendoan 本身来自中爪哇的班尤马斯（Banyumas）和普沃克托（Purwokerto）。在普沃克托，mendoan
    的意思是在热油中煎炸，使这道菜不经过完全加工。然而，尽管它看起来是生生的，但豆糕本身含有许多对我们身体有益的营养。


    ## 21. 另一种炸物，Tahu Petis


    在吃了 Tempe Mendoan 之后，Tahu Petis 是我下一个喜欢的 gorengan。Tahu Petis 本身是一种炸豆腐，配上 petis
    食用，petis 是一种用虾制成的酱料。我喜欢 Tahu Petis 的点在于它味道的独特组合，豆腐很可能是咸且鲜香的，而 petis 也有辣味可选。


    ## 中爪哇


    ### 值得学习的文化


    ## 22. 看另一场皮影戏，Wayang Kulit


    如果说西爪哇拥有 Wayang Golek（木偶戏），那么中爪哇就有 Wayang Kulit（皮影戏）。Wayang Kulit 与 Wayang Golek
    的不同在于材质和形状。如果 Wayang Golek 是木头制的，Wayang Kulit 就是用牛皮或水皮制成的，因为 *kulit* 的意思是“皮”。在故事方面，Wayang
    Kulit 通常讲述印度教故事，如《摩诃婆罗多》和《罗摩衍那》。


    ## 23. 观看并学习跳 Srimpi 舞


    Tari Srimpi 或 Srimpi 舞是中爪哇的一种传统舞蹈。Tari Srimpi 由四个女孩跳舞——srimpi 本身的意思是“四”——每个女孩都有自己的头衔：水、火、风和土。这四个元素很好地代表了人类构成的四个元素。然而，尽管我不会跳这种舞蹈，但
    Tari Srimpi 是一段非常美丽的舞蹈，值得一看。


    ## 24. 近距离观察 Keris（克里斯）


    来自中爪哇的传统武器被称为 Keris。Keris 的形状像一把小刀，但是扭曲的形式。然而，让 Keris 成为中爪哇如此独特武器不仅是因为它的形状，还因为某些人相信
    Keris 内部捕捉了一些灵魂。


    ## 25. 学习另一种舞蹈，Tari Sintren


    与更经典的 Tari Srimpi 不同，Tari Sintren 或 Sintren 舞是一种来自神秘主义的传统舞蹈。这种舞蹈需要由处女来表演，她随后会被女神的灵魂附体。这种舞蹈的另一个独特之处，除了神秘感外，是舞者将穿着传统的服饰，头上戴着茉莉花，并戴着墨镜。


    ## 东爪哇


    ### 值得去的地方


    ## 26. 在布罗山见证日出


    布罗山（Mount Bromo）是东爪哇最著名的景点之一。大多数人来到布罗山是为了在山顶见证美丽的日出。然而，尽管这座位于布罗莫腾格尔塞梅鲁国家公园的山不像其他火山那么，但它拥有如此美丽的风景，让每个游客都叹为观止。


    ## 27. 看看万汶县（Banyuwangi）美丽的伊真火山口（Kawah Ijen）


    不仅是西爪哇拥有带有火口的 Tangkuban Perahu，东爪哇也拥有这座美丽的伊真火山口，它是印度尼西亚爪哇岛上最大的火口。这个硫磺山口非常漂亮，因为它有托斯卡绿色和蓝色的火焰。尽管你必须在午夜步行大约一个半小时，但我相信你会被位于东爪哇万汶县的这个火山口的美丽深深吸引。


    ## 28. 在巴鲁兰国家公园接触自然


    印度尼西亚可能属于热带国家。然而，这个国家也被赐予了一些干燥生态系统，其中之一位于东爪哇，准确地说位于巴鲁兰国家公园（Baluran National Park）。你在公园里可能会发现草原，它占据了生态系统的
    40%。国家公园提供的另一个景点是吉祥物——牛。


    ## 29. 为三宝纳之家（House of Sampoerna）震撼


    爪哇岛确实以香烟生产地闻名。最老且最大的香烟工厂之一是三宝纳，位于东爪哇的泗罗（Surabaya）。然而，工厂现在提供一个景点，即三宝纳之家，这是一座具有殖民风格设计的博物馆，因为该建筑建于
    1862 年。尽管它看起来很老，但博物馆的设计非常华丽，绝对会让你感觉如家一样，里面还有一个咖啡馆。


    ## 30. 尝试一些 Rujak Cingur


    实际上，我并不喜欢吃混合了花生酱或 *petis* 酱汁的新鲜蔬菜或水果。但这个就不一样。来自东爪哇首府泗罗的 Rujak Cingur 味道很独特。它由许多水果和蔬菜组成，如黄瓜、生芒果、豆瓣菜、豆腐，以及
    *cingur*——牛嘴——然后与 *petis* 酱混合在一起。一些不习惯吃奇怪东西（如 *cingur*）的人会犹豫，但我认为尝试是个好主意，因为那个味道会让你极其开心！


    ## 31. 尝试一下 Rawon


    ## 32. 尝尝马杜拉肉串（Satay Madura）


    当你向任何印度尼西亚人询问肉串时，他们脑海中出现的很可能是来自马杜拉（靠近泗罗的一个岛屿）的肉串。这种肉串通常用鸡肉作为主要原料。吃肉串时，你需要给串好的烤鸡肉淋上花生酱。我更喜欢在上面淋一些酱油并撒上碎洋葱。


    '
