  md: "# Item 47: Prefer Collection to Stream as a return type\n\nMany methods return\
    \ sequences of elements. Prior to Java 8, the obvious return types for such methods\
    \ were the collection interfaces Collection, Set, and List; Iterable and the array\
    \ types. Usually, it was easy to decide which of these types to return. The norm\
    \ was a collection interface. If the method existed solely to enable for-each\
    \ loops or the returned sequence couldn't be implemented solely some Collection\
    \ method (typically, contains(Object)), the Iterable interface was used. If the\
    \ returned elements were primitive values or there were performance requirements,\
    \ arrays were used. In Java 8, streams were added to the platform, substantially\
    \ complicating the task of choosing the appropriate return type for a sequence-returning\
    \ method.\n\nYou may hear said that streams are now the obvious choice to return\
    \ a sequence of elements, but as discussed in Item 45, streams do not make iteration\
    \ obsolete; writing good code requires combining streams and iteration judiciously.\
    \ If an API returns an iterator and some users want to iterate over the returned\
    \ sequence with a for-loop, those users will be justifiably frustrated because\
    \ the Iterator contains the sole abstract method in the Iterable specification\
    \ for this method is compatible with Iterable. The only thing preventing programmers\
    \ from using a for-each loop to iterate over a stream is Stream's failure to extend\
    \ Iterable.\n\nSadly, there is no good workaround for this problem. At first glance,\
    \ it might appear that passing a method reference to Stream or Iterator would\
    \ work well. The resulting code is a bit noisy and opaque, but not unreasonable:\n\
    \n```\n``` // Won't compile, due to limitations on Java's type inference\n(ProcessHandle\
    \ ph : ProcessHandle.allProcesses()::iterator) {\n    process the process\n }\
    \ ```\n```\n\nUnfortunately, if you attempt to compile this code, you'll get an\
    \ error message:\n\n```\n``` Test.java:6: error: method reference not expected\
    \ here\nfor (ProcessHandle ph : ProcessHandle.allProcesses()::iterator) {\n  \
    \  A\n} ```\n```\n\nIn order to make the code compile, you have to cast the method\
    \ reference to an appropriately parameterized Iterable:\n\n// Hideous workaround\
    \ to iterate over a stream\n\n```\n``` for (ProcessHandle ph : Iterable<ProcessHandle>)\n\
    \    ProcessHandle.allProcesses()::iterator ```\n```"
  merge: -1
