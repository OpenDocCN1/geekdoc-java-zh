  md: "In fact, there's a better way to avoid the alien method invocations out of\
    \ the synchronized block. The libraries provide a concurrent collection (Item\
    \ 81) known as CopyOnWriteArrayList that is tailor-made for this purpose. This\
    \ List implementation is a variant of ArrayList in which all modification operations\
    \ are implemented by making a fresh copy of the underlying array. The internal\
    \ array is never modified iteration no locking and is very fast. For most tasks,\
    \ the performance of CopyOnWriteArrayList would be atrocious, but it's perfect\
    \ for observer locks, which are rarely modified and often traversed.\nThe add\
    \ addAll methods of ObservableSet not be changed if the list is used to use CopyOnWriteArrayList.\
    \ Here is how the remainder of the class nodes. Notice that there is no explicit\
    \ synchronization whatsoever:\n\n```\n// Thread-safe observable set with CopyOnWriteArrayList\n\
    private final List<Observer<E>> observers =\n    new CopyOnWriteArrayList<>();\n\
    public void addObserver(SetObserver<E> observer) {\n    observers.add(observer);\n\
    }\n\npublic boolean removeObserver(Observer<E> observer) {\n    return observers.remove(observer);\n\
    }\n\nprivate void notifyElementAdded(E element) {\n    for (Observer<E> observer\
    \ : observers) \n    observer.added(this, element);\n}\n```\n\nAn alien method\
    \ invoked outside of a synchronized region is known as an open call (Get006, 10.1.4).\
    \ Besides preventing failures, open calls can greatly increase concurrency. An\
    \ alien method might run for an arbitrarily long period. If the alien method was\
    \ invoked from a synchronized region, other threads would be denied access to\
    \ the protected region unnecessarily.\nAs a rule, you should do as little as possible\
    \ inside synchronized regions. Obtain the lock, examine the shared data, transform\
    \ it as necessary, and drop the lock. Find a way to move it out of the synchronized\
    \ region without violating the guidelines in Item 78.\nThe first part of this\
    \ item was about correctness. Now let's take a brief look at performance. While\
    \ the cost of synchronization has plummeted since the early days of Java, it is\
    \ more important than ever to oversynchronize. In a multicore world, the real\
    \ cost of excessive synchronization is not the CPU time spending locks; it is\
    \ contention: the lost opportunities for parallelism and the delays"
