  md: "# ITEM 49: CHECK PARAMETERS FOR VALIDITY\n\nIn Java 9, a range-checking facility\
    \ was added to java.util.Objects. This facility consists of three methods: checkFromIndexSize,ToCheck,\
    \ and check. This facility is not as flexible as the null-checking method. It\
    \ doesn't let you specify your own exception detail message, and it is designed\
    \ solely for use on array indices. It doesn't handle closed ranges (which contain\
    \ both of their endpoints). But if it does what you need, it's a useful convenience.\n\
    \nFor an unexported method, as the package author, control the circumstances under\
    \ which the method is called, so you can ensure that only valid parameter values\
    \ are ever passed in. Therefore, nonpublic methods can check their parameters\
    \ using assertions, as shown below:\n\n// Private helper for a recursive sort\n\
    \n```\nprivate static void sort(long[] a, int offset, int length) {\n    assert\
    \ a != null;\n    assert offset >= 0 && offset <= a.length;\n    assert length\
    \ >= 0 && length <= a.length - offset;\n    // Do the computation\n}\n```\n\n\
    In essence, these assertions are claims that the asserted condition will be true,\
    \ regardless of how the enclosing package is used by clients. Unlike normal validity\
    \ checks, they have no effect and no cost unless you enable them, which you do\
    \ by passing the -ea (or -enableassertions) flag to the java command. For more\
    \ information on assertions, see the tutorial [Assertions].\n\nIt is particularly\
    \ important to check the validity of parameters that are not used by a method.\
    \ For example, consider the static factory method on page 101, which takes an\
    \ array and a start-and-end range and returns a List view of it. If a client fails\
    \ to pass in null, the method would throw a NullPointerException because the method\
    \ has an explicit check (the call to Objects.requireNonNull). Had the method instead\
    \ created a List instance that would return a NullPointerException as soon as\
    \ a client attempted to use it. By that time, the origin of the List instance\
    \ might be difficult to determine, which would complicate the task of debugging.\n\
    \nConstructors represent a special case of the principle that you should check\
    \ the validity of parameters that are to be stored away for later use. It is critical\
    \ to check the validity of constructor parameters to prevent the construction\
    \ of an object that violates its class invariants.\n\nThere are exceptions to\
    \ the rule that you should explicitly check a method's parameters before performing\
    \ its computation. An important exception is the case"
