    \ @throws NullPointerException if start or end is null\n     */\n    public Period(Date\
    \ start, Date end) {\n        this.start = new Date(start.getTime());\n      \
    \  this.end = new Date(end.getTime());\n        if (this.start.compareTo(this.end)\
    \ > 0) {\n            throw new IllegalArgumentException(\n                start\
    \ + \" after \" + end);\n        }\n    }\n\n    public Date start() { return\
    \ start.getTime(); }\n    public Date end() { return end.getTime(); }\n    public\
    \ String toString() { return start + \" - \" + end + \"; }\n\n    // ... // Reminder\
    \ omitted\n}\n```\n\nSuppose you want this class to be serializable. Because the\
    \ physical representation of a Period object exactly mirrors its logical data\
    \ content, it is not unreasonable to use the default serialized form (Item 87).\
    \ Therefore, it might seem that all you have to do to make the class serializable\
    \ is to add the implements Serializable to the class declaration. If you did so,\
    \ the class would no longer guarantee its critical invariants.\n\nThe problem\
    \ is that the readObject method is effectively another constructor, and it does\
    \ all the same as any other constructor. A constructor must check its arguments\
    \ for validity (Item 49) and make defensive copies of parameters where appropriate\
    \ (Item 50), so so must a readObject method. If a readObject method fails to do\
    \ either of these things, it is a relatively simple matter for an attacker to\
    \ violate the class's invariants."
