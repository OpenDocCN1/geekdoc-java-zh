  md: '# ITEM 15: MINIMIZE THE ACCESSIBILITY OF CLASSES AND MEMBERS


    After carefully designing your class''s API, your reflex should be to make all
    other members private. Only if another class in the same package really needs
    to access a member should you remove the private modifier, making the member package-private.
    If you find yourself doing this, you should examine the design of your system
    to see if another decomposition might yield classes that are better decoupled
    from one another. That is, both private and package-private members are implementations
    and do not normally impact your exported API. These fields can, however, "leak"
    into the exported API if the class implements Serializable (Items 86 and 87).


    For public classes, a huge increase in accessibility occurs when the access level
    goes from package-private to protected. A protected member is part of the class''s
    exported API and must be supported forever. Also, a protected member of an exported
    class is a public commitment to an implementation detail (Item 19). The need for
    protected members should be relatively rare.


    There is a rule that restricts your ability to reduce the accessibility of methods.
    If a method overrides a subclass, it cannot have a more restrictive access level
    in the subclass than anywhere to ensure that an instance of the subclass is usable
    (Liskov substitution principle, see Item 15). If you violate this rule, the compiler
    will generate an error message when you try to compile the subclass. A special
    case of this rule is that if a class implements an interface, all of the class
    methods that are in the interface must be declared public in the class.


    To facilitate testing code, you may be tempted to make a class, interface, or
    member more accessible than necessary. This is fine up to a point. It is acceptable
    to make a private member of a public class package-private in order to test it,
    but it is not acceptable to raise the accessibility any other. In other words,
    it is not acceptable to make a class, interface, or member of a package''s exported
    API for testing. Luckily, it isn''t necessary because tests can be made as part
    of the package being tested, thus gaining access to package-private elements.


    Instance fields of public classes should rarely be public (Item 16). If an instance
    field is nonfinal or a reference to a mutable object, then by making it public,
    you give up the ability to limit the values that can be stored in the field. This
    means you give up the ability to enforce invariants involving the field. Also,
    you give up the ability to take any action when the field is modified, so classes
    with public mutable fields are not thread-safe. Even if a field is final and refers
    to an immutable object, by making it public you give up the flexibility to switch
    to a new internal representation in which the field does not exist.'
