    \ such as this simple test runner:\n\n```\n// Program to process marker annotations\n\
    import java.lang.Reflect;\n\npublic class RunTests {\n    public static void main(String[]\
    \ args) throws Exception {\n        int tests = 0;\n        int passed = 0;\n\
    \        Class<?> testClass = Class.forName(args[0]);\n        for (Method m :\
    \ testClass.getDeclaredMethods()) {\n            if (m.isAnnotationPresent(Test.class))\
    \ {\n                try {\n                    tests++;\n                   \
    \ m.invoke(null);\n                    passed++;\n                } catch (InvocationTargetException\
    \ wrappedExc) {\n                    Throwable exc = wrappedExc.getCause();\n\
    \                    System.out.println(m + \" failed: \" + exc);\\n         \
    \       } catch (Exception exc) {\n                    System.out.println(\"Invalid\
    \ @Test: \" + m);\n                }\n            }\n        }\n        System.out.printf(\"\
    Passed: %d, Failed: %d\\n\", passed, tests);\n    }\n}\n```\n\nThe test runner\
    \ takes a fully qualified class name on the command line and runs all the Test-annotated\
