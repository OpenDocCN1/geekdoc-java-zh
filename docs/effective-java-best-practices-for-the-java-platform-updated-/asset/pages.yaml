  md: "```\npublic Date end() {\n    return end;\n}\n...\n// Remainder omitted\n}\n\
    ```\n\nAt first glance, this class may appear to be immutable and to enforce the\
    \ invariant that a start of a period does not follow its end. It is, however,\
    \ easy to violate this by exploiting the fact that Date is mutable:\n\n```\n//\
    \ Attack the internals of a Period instance\nDate start = new Date();\nDate end\
    \ = new Date();\nPeriod p = new Period(start, end);\nend.setYear(78); // Modifies\
    \ internals of p!\n```\n\nAs of Java 8, the obvious way to fix this is to use\
    \ Instant (or LocalDateTime or ZonedDateTime) in place of Date because Date (and\
    \ the other java.time classes) are immutable (Item 17). Date is obsolete and should\
    \ not be used in new code. When you have to use mutable values in your APIs and\
    \ internal representations, the techniques discussed in this chapter are appropriate\
    \ for those times.\n\nTo protect the internals of a Period instance from this\
    \ sort of attack, it is essential to make a defensive copy of each mutable parameter\
    \ to the constructor and use the copies as components of the Period instance in\
    \ the place of the originals:\n\n```\n// Required constructor makes defensive\
    \ copies of parameters\npublic Period(Date start, Date end) {\n    this.start\
    \ = new Date(start.getTime());\n    this.end = new Date(end.getTime());\n}\n```\n\
    \n```\nif (this.start.compareTo(this.end) > 0)\n    throw new IllegalArgumentException(\n\
    \        this.start + \" after \" + this.end);\n    \n```\n\nWith the new constructor\
    \ in place, the previous attack will have no effect on the Period instance. Note\
