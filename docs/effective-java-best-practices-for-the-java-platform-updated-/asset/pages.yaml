    \ of unchecked warning\npublic E pop() {\n    if (size == 0)\n        throw new\
    \ EmptyStackException();\n```\n\n```\n// push requires elements to be of type\
    \ E, so cast is correct\n@SuppressWarnings(\"unchecked\")\nE result = elements[--size];\n\
    elements[size] = null; // Eliminate obsolete reference\nreturn result;\n```\n\n\
