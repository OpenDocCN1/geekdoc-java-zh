  md: "# Item 90: Consider serialization proxies instead of serialized instances\n\
    \nAs mentioned in Items 85 and 86 and discussed throughout this chapter\n\nThe\
    \ serialization proxy pattern is reasonably straightforward. First, design a private\
    \ static class that concisely represents the logical state of an instance of the\
    \ enclosing class. This nested class is known as the *serialization proxy* of\
    \ the enclosing class. It should have a single constructor, whose parameter is\
    \ the default of the enclosing class. This constructor copies the data from its\
    \ argument; it need not do any consistency checking or defensive copying. By design,\
    \ the serialized form of the serialization proxy is the perfect serialized form\
    \ of the enclosing class. Both the enclosing class and its serialization proxy\
    \ must be declared to implement `Serializable`.\n\nFor example, consider the Period\
    \ class written in Item 50 and made serializable in Item 88. A serialization proxy\
    \ for this class is simple enough that its serialization proxy has exactly the\
    \ same fields as the class:\n\n```\n// Serialization proxy for Period class\n\
    private static class SerializationProxy implements Serializable {\n    private\
    \ final Date start;\n    private final Date end;\n\n    SerializationProxy(Period\
    \ p) {\n        this.start = p.start;\n        this.end = p.end;\n    }\n\n  \
    \  private static final long serialVersionID = 23409824328432852L; // Any number\
    \ will do (Item 87)\n}\n```\n\nNext, add the following `writeReplace` method to\
    \ the enclosing class. This method can be copied verbatim into any class with\
    \ a serialization proxy:\n\n```\n// writeReplace method for the serialization\
    \ proxy pattern\nprivate Object writeReplace() {\n    return new SerializationProxy(this);\n\
    }\n```"
  merge: -1
  pgno: 383
- img_proc: true
  md: "The presence of this method on the enclosing class causes the serialization\
    \ system\nto emit a SerializationProxy class instead of an instance of the enclosing\n\
    class. In other words, the writeReplace method translates an instance of the\n\
    enclosing class to its serialization proxy prior to serialization.\n\nWith this\
    \ writeReplace method in place, the enclosing class, but an attacker might\nfabricate\
    \ one in an attempt to violate the class's invariants. To guarantee that such\n\
    an attack would not fail, merely add this readObject method to the enclosing class:\n\
    \n```\n```java\n// readObject for the serialization proxy pattern\nprivate void\
    \ readObject(InputStream stream) {\n    throws InvalidObjectException(\"Proxy\
    \ required\");\n}\n```\n```\n\nFinally, a readResolve method on the SerializationProxy\
    \ class\nreturns a logically equivalent instance of the enclosing class. The presence\
    \ of\nthis method causes the serialization system to translate the serialization\
    \ proxy back\nto an instance of the enclosing class upon deserialization.\n\n\
    This readResolve method creates an instance of the enclosing class using\nits\
    \ public API and therein lies the beauty of the pattern. It largely eliminates\n\
    the extrinsic character of serialization because the deserialized instance is\n\
    created using the same constructor, static factors, and methods as any other\n\
    instance. This frees you from having to separately ensure that deserialized\n\
    instances obey the class's invariants. If the class's static factors or constructors\n\
    establish these invariants and its methods maintain them, you've ensured\nin invariants\
    \ are maintained by serialization as well.\n\nHere is the readResolve method for\
    \ Period.SerializationProxy above:\n\n```\n```java\n// readResolve method for\
    \ Period.SerializationProxy\nprivate Object readResolve() {\n    return new Period(start,\
    \ end); // Uses public constructor\n}\n```\n```\n\nLike the defensive copying\
    \ approach (page 357), the serialization proxy\napproach stops the bogus byte-stream\
    \ attack (page 354) and the internal field theft\nattack (page 356) dead in their\
    \ tracks. Unlike the two previous approaches, this\nallows the fields of Period\
    \ to be final, which is required in order for the\nPeriod class to be truly immutable\
    \ (item 17). And unlike the two previous\napproaches, this one doesn't involve\
    \ a deal of thought. You don't have to"
