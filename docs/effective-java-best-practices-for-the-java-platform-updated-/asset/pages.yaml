  md: "# Item 25: Limit source files to a single top-level class\n\nThe Java compiler\
    \ lets you define multiple top-level classes in a single source file, there are\
    \ no benefits associated with doing so, and there are significant risks. The risks\
    \ stem from the fact that defining multiple top-level classes in a source file\
    \ makes it possible to provide multiple definitions for a class. Which definition\
    \ gets used is affected by the order in which the source files are passed to the\
    \ compiler.\n\nTo make this concrete, consider this source file, which contains\
    \ only a Main class that refers to members of two other top-level classes (Utensil\
    \ and Dessert):\n\n```\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        System.out.println(Utensil.NAME + \" \" + Dessert.NAME);\n\
    \    }\n}\n```\n\nNow suppose you define both Utensil and Dessert in a single\
    \ source file named Utencil.java:\n\n```\n// Two classes defined in one file.\
    \ Don't ever do this!\nclass Utensil {\n    static final String NAME = \"pan\"\
    ;\n}\n\nclass Dessert {\n    static final String NAME = \"cake\";\n}\n```\n\n\
    Of course the main program prints pancake. Now suppose you accidentally make another\
    \ source file named Dessert.java that defines the two classes:\n\n```\n// Two\
    \ classes defined in one file. Don't ever do this!\nclass Utensil {\n    static\
    \ final String NAME = \"pot\";\n}\n\nclass Dessert {\n    static final String\
    \ NAME = \"pie\";\n}\n```\n\nIf you're lucky enough to compile the program with\
    \ the command javac Main.java Dessert.java, the compilation will fail, and the\
    \ compiler will"
