  md: '# Item 67: Optimize judiciously


    There are three aphorisms concerning optimization that everyone should know:


    More computing sins are committed in the name of efficiency (without necessarily
    achieving it) than for any other reason—including blind stupidity.


    —William A. Wulf [Wulff75]


    We should forget about small efficiencies, say about 97% of the time: premature
    optimization is the root of all evil.


    —Donald E. Knuth [Knuth75]


    We follow two rules in the matter of optimization:


    +   Rule 1: Don''t do it.

    Rule 2 (for experts only). Don''t do it yet—that is, not until you have a perfectly
    clear and optimized solution.


    —M. A. Jackson [Jackson75]


    All of these aphorisms predate the Java programming language by two decades. They
    tell a deep truth about optimization: it is easy to do more harm than good, especially
    if you optimize. In the process, you may produce software that is neither fast
    correct and cannot be fixed.


    Don''t sacrifice architectural principles for performance. **Strive to write good
    programs rather than fast ones.** If a good program is fast enough, architecture
    will allow it to be optimized. Programs embody the principle of information hiding;
    where possible, individual decisions can be changed without affecting the remainder
    of the system.


    This does not mean you ignore performance concerns until your program is complete.
    Implementation problems can be fixed by later optimization, but pervasive architectural
    flaws limit performance can be impossible to fix without rewriting the system.
    Changing a fundamental facet of your design after the fact can result in an ill-structured
    system that is difficult to maintain and evolve. You must always think about performance
    during the design process.


    **Strive to avoid decisions that limit performance.** The components of a design
    that are most difficult to change after the fact are those specifying interactions
    between components and with the outside world. Chief among these design components
    are APIs, wire-level protocols, and persistent data formats. Not only are these
    design components difficult or impossible to change after the fact, but all of
    them can place significant limitations on the performance that a system can ever
    achieve.'
