  md: "# Item 4: Enforce noninstantiability with a private constructor\n\nOccasionally\
    \ you'll want to write a class that is just a grouping of static methods and static\
    \ fields. Such classes have acquired a bad reputation because some people abuse\
    \ them to avoid thinking in terms of objects, but they do have valid values. They\
    \ can be used to group related methods on primitive values or arrays, in the manner\
    \ of java.lang.Math or java.util.Arrays. They can also be used to group static\
    \ methods, including factories (Item 1), for objects that implement some interface,\
    \ in the manner of java.util.Collections. (As of Java 8, you can also put such\
    \ methods in the interface, assuming it's yours to modify). Lastly, such classes\
    \ can be used to group methods on a final class, since you can put them in a subclass.\n\
    \nUtility classes were not designed to be instantiated: an instance would be non\
    \ own. In the absence of explicit constructors, however, the compiler provides\
    \ a parameterless default constructor. To a user, this constructor is indistinguishable\
    \ from any other. It is not uncommon to see unintentionally instantiable classes\
    \ in public APIs.\n\nAttempting to enforce noninstantiability\\Attempting to enforce\
    \ noninstantiability by making a class abstract does not work. The class can be\
    \ subclassed and the subclass instantiated. Furthermore, it misleads the user\
    \ into thinking the class was designed for inheritance (Item 19). There is, however,\
    \ a simple idiom to ensure noninstantiability. A default constructor is generated\
    \ only if a class contains no constructors, so a class can be made noninstantiable\
    \ with a private constructor:\n\n```\n// Noninstantiable utility class\npublic\
    \ class UtilityClass {\n    // Suppress default constructor for noninstantiability\n\
    \    private UtilityClass() {\n        throw new AssertionError();\n    }\n  \
    \  // ... Remainder omitted\n}\n```\n\nBecause the constructor is private, it\
    \ is inaccessible outside the class. The AssertionError provides insurance in\
    \ case the constructor is accidentally invoked from within the class. It guarantees\
    \ the class will never be instantiated under any circumstances. This idiom is\
    \ mildly counterintuitive because the constructor is provided expressly so that\
    \ it cannot be invoked, as shown earlier.\n\nAs a side effect, this idiom prevents\
    \ the class from being subclassed. All constructors must invoke a superclass constructor,\
    \ explicitly or implicitly, and a subclass would have no accessible superclass\
    \ constructor to invoke."
