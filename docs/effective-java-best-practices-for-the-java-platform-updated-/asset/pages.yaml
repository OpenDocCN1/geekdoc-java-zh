  md: '# CHAPTER 5

    Generics


    SINCE Java 5, generics have been a part of the language. Before generics, you
    had to cast every object you read from a collection. If someone accidentally inserted
    an object of the wrong type, casts could fail at runtime. With generics, you specify
    what types of objects are permitted in each collection. The compiler inserts casts
    for you and tells you at compile time if you try to insert an object of the wrong
    type. This results in programs that are both safer and clearer, but these benefits
    are not limited to collections, come at a price. This chapter tells you how to
    maximize the benefits and minimize the complications.


    # Item 26: Don''t use raw types


    First, a few terms. A class or interface whose declaration has one or more type
    parameters is a generic class or interface [JLS, 8.1.2, 9.1.2]. For example, the
    List interface is List<E> (read "list of E"), but people often call it List for
    short. Generic classes and interfaces are known as generic types.

    Each generic type defines a parameterized type, which consists of the class or
    interface followed by an angle-bracketed list of actual type parameters corresponding
    to the generic type parameters [JLS, 4.4, 4.5]. For example, List<String> (read
    "list of string") is a parameterized type representing a list whose elements are
    of type String. (String is the actual type parameter corresponding to the type
    parameter E).

    Finally, each generic type defines a raw type, which is the name of the generic
    type used without any accompanying type parameters [JLS, 4.8]. For example, the
    raw type corresponding to List<E> is List. Raw types behave as if all of the generic
    type information were erased from the type declaration. They exist primarily for
    compatibility with pre-generics code.'
