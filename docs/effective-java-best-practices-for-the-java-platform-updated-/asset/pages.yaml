  md: "# ITEM 34: USE ENUMS INSTEAD OF INT CONSTANTS\n\nwrong type will result in\
    \ compile-time errors, as all attempts to assign an expression of enum type to\
    \ a variable of another, or to use the == operator to compare values of different\
    \ enum types.\n\nEnum types with identically named constants coexist peacefully\
    \ because each type has its own namespace. You can add or reorder constants in\
    \ an enum type without recompiling clients; the fields that export the constants\
    \ provide a layer of isolation between an enum type and its clients: constant\
    \ values are not compiled into the clients as they are in the 1st enum patterns.\
    \ You can translate enums into printable strings by calling their toString method.\n\
    \nIn order to rectify the deficiencies of itums, enum types let you add arbitrary\
    \ methods and fields and implement arbitrary interfaces. They provide high-quality\
    \ implementations of all the object methods (Chapter 3), they implement a particular\
    \ base class (Chapter 12), and their serialized form is designed to withstand\
    \ changes to the enum type.\n\nSo why would you want to add methods to an enum\
    \ type? For starters, you might want to associate data with constants. Our Apple\
    \ and Orange types, for example, might benefit from a method that returns the\
    \ color of the fruit, or one that returns an image of it. You can augment an enum\
    \ type with any method that seems appropriate, and evolve over time into a full-featured\
    \ beast.\n\nFor nice example of a rich enum type, consider the eight planets of\
    \ our solar system. Each planet has a mass and a radius, and from these two you\
    \ can compute its gravity. This lets you compute the weight of an object on the\
    \ planet's surface, given the mass of the object. Here's how this looks. The numbers\
    \ in parentheses after each constant are parameters that are passed to its constructor.\
    \ In this case, each planet's mass and radius are\n\n```\n// Enum with data and\
    \ behavior\npublic enum Planet {\n    MERCURY(3.305e23, 2.439e23),\n    VENUS(4.867e+24,\
    \ 6.052e24),\n    EARTH(5.972e+24, 6.376e+24),\n    MARS(6.419e+23, 3.399e+23),\n\
    \    JUPITER(1.898e+27, 7.149e+27),\n    SATURN(5.685e+26, 6.027e+27),\n    URANUS(8.683e+26,\
    \ 2.556e+27),\n    NEPTUNE(1.024e+26, 2.477e+27);\n\n    private final double\
    \ mass; // In kilograms\n    private final double radius; // In meters\n    private\
    \ final double surfaceGravity; // In m / s^2\n```"
