    \ = EnumSet.allOf(Face.class);\n```\n\n```\nfor (Iterator<Face> i = faces.iterator();\
    \ i.hasNext(); i++) {\n  for (Iterator<Face> j = faces.iterator(); j.hasNext();\
    \ j++) {\n    System.out.println(i.next() + \" \" + j.next());\n  }\n}\n```\n\n\
    The program doesn't throw an exception, but it only prints the six \"doubles\"\
