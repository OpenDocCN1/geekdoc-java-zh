  md: '# CHAPTER 1

    Introduction


    THIS book is designed to help you make effective use of the Java programming language
    and its fundamental libraries: java.lang, java.util, and java.io, and subpackages
    such as java.util.concurrent and java.util.function. Other libraries are discussed
    from time to time.


    This book consists of ninety items, each of which conveys one rule. The capture
    practices generally held to be helpful by the best and most experienced programmers.
    The items are grouped into eleven chapters, each covering one broad aspect of
    software design. The book is not intended to be read from cover to cover; each
    item stands on its own, more or less. The items are heavily cross-referenced features
    so you can easily plot your own course through the book.


    Many new features were added to the platform since the last edition of this book
    was published. Most of the items in this book use these features in some ways.
    This table shows you where to go for primary coverage of keys:


    | Feature | Items | Release |

    | --- | --- | --- |

    | Lambdas | Items 42–44 | Java 8 |

    | Streams | Items 45–48 | Java 8 |

    | Optionals | Item 55 | Java 8 |

    | Default methods in interfaces | Item 21 | Java 8 |

    | try-with-resources | Item 9 | Java 7 |

    | @SafeVarargs | Item 32 | Java 7 |

    | Modules | Item 15 | Java 9 |'
