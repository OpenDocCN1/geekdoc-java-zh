  md: "# ITEM 20: PREFER INTERFACES TO ABSTRACT CLASSES\n\nmethods atop the primitive\
    \ interface methods. Extending a skeletal implementation takes most of the work\
    \ out of implementing an interface. This is the *Template pattern* [Gamma95].\n\
    \nBy convention, skeletal implementations are called *AbstractInterface*, where\
    \ *Interface* is the name of the interface they implement. For example, the Collections\
    \ Framework provides a skeletal implementation to go along with each main interface:\
    \ `AbstractCollection`, `AbstractSet`, `AbstractList`, and `AbstractMap`. Arguably\
    \ it would have made sense to call them *SkeletalCollection*, *SkeletalSet*, *SkeletalList*,\
    \ and *SkeletalMap*. The Abstract conversion is now firmly established. When properly\
    \ designed, skeletal implementations (whether a separate class, or consisting\
    \ of default methods on an interface) can make it very easy for programmers to\
    \ provide their own implementations of an interface. For example, here's a static\
    \ factory method containing a complete, fully functional List implementation AbstractList:\n\
    \n```\n// Concrete implementation atop abstract list implementation\nstatic List<Integer>\
    \ arrayToList(int[] a) {\n    Objects.requireNonNull(a);\n    // The diamond operator\
    \ is only legal here in Java 9 and later ...\n    // If you're using an older\
    \ release, specify <Integer>\n    return new AbstractList<Integer>() {\n     \
    \   @Override\n        public Integer get(int i) {\n            return a[i]; //\
    \ Autoboxing (Item 6)\n        }\n\n        @Override\n        public Integer\
    \ set(int i, Integer val) {\n            int oldVal = a[i];\n            a[i]\
    \ = val; // Auto-boxing\n            return oldVal;\n        }\n\n        @Override\n\
    \        public int size() {\n            return a.length;\n        }\n    };\n\
    ```\n\nWhen you consider all that a List does for you, this example is an impressive\
    \ demonstration of the power of skeletal implementations. Incidentally, this example\
    \ is an *Adapter* [Gamma95] that allows an int array to be viewed as a list of\
    \ Integer instances. Because of the translation back and forth between int values\
    \ and Integer instances (boxing and unboxing), its performance is not terribly\
    \ good. Note that the implementation takes the form of an anonymous class (Item\
    \ 24)."
