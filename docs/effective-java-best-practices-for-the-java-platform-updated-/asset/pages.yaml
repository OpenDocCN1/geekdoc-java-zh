  md: '# Item 19: Design and document for inheritance or else prohibit


    Item 18 alerted you to the dangers of subclassing a "foreign" class that was not
    designed and documented for inheritance. So what does it mean for a class to be
    designed and documented for inheritance?


    First, the class document must specify the effects of overriding any method. In
    other words, the class must document its self-use of overridable methods. For
    each public or protected method, the document must indicate what it invokes, in
    what sequence, and how the results of each invocation affect subsequent processing.
    (By overridable, we mean nonfinal and public or protected.) Generally, a class
    must document all circumstances under which it might invoke an overridable method.
    For example, invocations might come from constructors or initializers.


    A method that invokes overridable methods contains a description of these invocations
    in its documentation. The description is in a special section of the specification,
    labeled "Implementation Requirements," which is generated by the Javadoc tag @implSpec.
    This section describes the inner workings of the method. Here is an example, copied
    from the specification for java.util.AbstractSet.remove


    ```

    public boolean remove(Object o)

    ```


    Removes single instance of the specified element from this collection, if it is
    present (optional). Formally, if there is an element e such that obj.equals(o,
    e), if this collection contains one or more elements. Returns true if this collection
    contained the specified element (or equivalently, if it changed as a result of
    the call).


    Implementation Requirements: This implementation iterates over the collection
    looking for the specified element. If it finds it, it removes the element from
    the collection using the iterator''s remove method. Note that this implementation
    throws an UnsupportedOperationException if the iterator does not implement the
    remove method and this collection contains the specified object.


    This documentation leaves no doubt that overiding the iterator method will affect
    the behavior of the remove method. It also describes exactly how the behavior
    returned by the iterator will affect the behavior of the remove method. Contrast
    to the situation in Item 18, where the programmer subclassing HashSet simply could
    not say whether overriding the add method would affect the behavior of the addAll
    method.'
