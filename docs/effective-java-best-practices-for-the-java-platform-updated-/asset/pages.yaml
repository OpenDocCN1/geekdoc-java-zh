  md: '# ITEM 21: DESIGN INTERFACES FOR POSTERITY


    This is the best general-purpose implementation one could possibly write for the
    removeIf method, but sadly, it fails on some real-world Collection implementations.
    For example, consider org.apache.commons.collections4.collection.SynchronizedCollection.
    This class, is similar to the one returned by the static factories.-SynchronizedCollection
    in java.util. The Apache version additionally provides the ability to use a client
    object for locking in place of the collection. In others, it is a wrapper class
    (Item 18), all of whose methods synchronize on a locking object delegating to
    the wrapped collection.


    The Apache SynchronizedCollection class is still being actively maintained, but
    as of this writing, it does not override the removeIf method. If this class is
    used in conjunction with Java 8, it will inherit the default implementation of
    removeIf, which does not maintain the class''s fundamental promise: to synchronize
    around each method invocation. The default implementation knows nothing about
    synchronization and has no access to the field that contains the locking object.
    If a client calls the removeIf method on a SynchronizedCollection in the presence
    of concurrent modification of the collection by another thread, a ConcurrentModificationException
    or other unspecified behavior may occur.


    In order to prevent this happening in similar Java platform implementations, such
    as the package-private class returned by Collections.synchronizedCollection, the
    JDK maintainers had to override the default removeIf method and other methods
    to perform the necessary synchronization before the default implementation. The
    collection implementations that were not part of the platform had no opportunity
    to make analogous changes in lockstep with the interface change, and some have
    yet to do so.


    In the presence of default methods, implementations of an interface may fail without
    error or warning but at runtime. While not common, this problem is not an isolated
    incident either. A handful of the methods added to interfaces in Java 8 are known
    to be susceptible, and a handful of existing implementations are known to be affected.


    Using default methods to add new methods to existing interfaces should be avoided
    unless the need is critical, as if you think so long and hard about whether an
    existing interface implementation might be broken by your default method implementation.
    Default methods are, however, extremely useful for providing standard method implementations
    when an interface is created, to ease the task of implementing the interface (Item
    20).'
