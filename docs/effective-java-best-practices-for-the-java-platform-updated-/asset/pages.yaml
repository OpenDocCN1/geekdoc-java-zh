    # ## Item 10: Obey the general contract when overriding equals


    Overriding the methods seems simple, but there are many ways to get it wrong,
    and consequences can be dire. The easiest way to avoid problems is not to override
    the equals method, in which each instance of the class is equal only to itself.
    It is the right thing to do if any of the following conditions apply:


    +   * Each instance of the class is inherently unique. This is true for classes
    as Thread represent active entities rather than values. The equals implementation
    by Object has exactly the right behavior for these classes.


    +   * There is no need for the class to provide a "logical quality" test. For
    example, java.util.regex.Pattern could have overridden equals to check whether
    two Pattern instances represented the same expression, but the designers didn''t
    think that clients would need or want this functionality. Under these circumstances,
    the equals implementation inherited from Object is ideal.'
