  md: "This method can then be used in conjunction with the static factory method\
    \ List.of allow for a variable number of arguments. Note that this approach relies\
    \ on the fact that the List.of declaration is annotated with @SafeVarargs\n\n\
    ```\naudience = flatten(List.of(friends, romans, countrymen));\n```\n\nThe advantage\
    \ of this approach is that the compiler can prove that the method is typesafe.\
    \ You don't have to vouch for its safety with a SafeVarargs annotation, and you\
    \ don't have to worry that you might have erred in determining that it was safe.\
    \ The main disadvantage is that the client code is a more verbose and may be slower.\n\
    \nThis trick can also be used in situations where it is impossible to write a\
    \ safe varargs method, as is the case with the varargs array on page 147. Its\
    \ analogue is the List.of method, so we don't even have to write it; the Java\
    \ libraries have done the work for us. The pickTwo method then becomes this:\n\
    \n```\nstatic List<T> pickTwo(T a, T b, T c) {\n    switch(rnd.nextInt(3)) {\n\
    \    case 0: return List.of(a, b);\n    case 1: return List.of(a, c);\n    case\
    \ 2: return List.of(b, c);\n    }\n    throw new AssertionError();\n}\n```\n\n\
    and the main method becomes this:\n\n```\npublic static void main(String[] args)\
    \ {\n    List<String> attributes = pickTwo(\"Good\", \"Fast\", \"Cheap\");\n}\n\
    ```\n\nThe resulting code is typesafe because it uses only generics, and not varargs.\n\
    \nIn summary, varargs and generics do not interact well because the varargs facility\
    \ is a leaky abstraction built atop arrays, and arrays have different type rules\
    \ from generics. Generic varargs parameters are not typesafe, they are legal.\
    \ If you choose to write a method with a generic (or parameterized) varargs parameter,\
    \ first ensure that the method is typesafe, and annotate it with @Safe-Varargs\
    \ so it is not unpleasant to use."
