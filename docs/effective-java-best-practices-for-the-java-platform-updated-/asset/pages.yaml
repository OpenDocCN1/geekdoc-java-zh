- img_proc: true
  md: "The problem with this implementation is that it relies on the String.matches\
    \ method. While String.matches is the easiest way to check if a string matches\
    \ a regular expression, it's not suitable for repeated use in performance-critical\
    \ situations. The problem is that it internally creates a Pattern instance every\
    \ only once, after which it becomes eligible for garbage collection. Creating\
    \ a Pattern instance is expensive because it requires compiling the regular expression\
    \ into a finite state machine.\n\nTo improve the performance, explicitly compile\
    \ the regular expression into a Pattern instance (which is immutable) as part\
    \ of class initialization, cache it, and reuse the same instance for every invocation\
    \ of isRomanNumber method:\n\n```\n// Reusing expensive object for improved performance\n\
    public static final Pattern ROMAN = Pattern.compile(\n    \"^(?:CM|CD|D?C?C{0,3})(XC|XL|L?X?X{0,3})(IX|IV|V?I{0,3})$\"\
    \n);\n\npublic static boolean isRomanNumber(String s) {\n    return ROMAN.matcher(s).matches();\n\
    }\n```\n\nThe improved version of isRomanNumber provides significant gains if\
    \ invoked frequently. On my machine, the original version took 1.1 ms on an 8-character\
    \ input string, while the improved version took 0.17 μs, which is 6.5 times faster.\
    \ Not only is the performance improved, but also, it is so clear. Making a static\
    \ field for the improved Pattern instance allows us to give it a name, which is\
    \ far more readable than the regular expression itself.\n\nIf the class contains\
    \ the improved version of isRomanNumber the field ROMAN will be initialized needlessly.\
    \ It would be possible to eliminate the initialization by lazily initializing\
    \ the field (Item 8) the first time the isRomanNumber method is invoked, but this\
    \ is not needed. As is often the case with lazy initialization, it would complicate\
    \ the implementation without performance improvement (item 7).\n\nWhen an object\
    \ is immutable, it is obvious that it can be reused safely, but there are other\
    \ situations where it is far less obvious, even counterintuitive. Consider the\
    \ case of adapters [Gamma95], also known as views. An adapter is an object that\
    \ delegates to a backing object, providing an alternative interface. Because an\
    \ adapter has no state beyond that of its backing object, there's no need to create\
    \ more than one instance of a adapter to a given object."
