  md: "If a method returns an optional, the client gets to choose what action to take\
    \ if\nthe method can't return a value. You can specify a default value:\n\n```\n\
    // Using an optional to provide a chosen default value\nString lastInLexicon =\
    \ max(words).orElse('No words...');');\n```\n\nor you can throw any exception\
    \ that is appropriate. Note that we pass in an\nexception factory rather than\
    \ an actual exception. This avoids the expense of\ncreating the exception unless\
    \ it will actually be thrown:\n\n```\n// Using an optional to throw a chosen exception\n\
    Toy myToy = max(toys).orElseThrow(TemperTantrumException::new);\n```\n\nIf you\
    \ can prove it is nonempty, then you can get the value if the optional\nwithout\
    \ specifying an action to take if the optional is empty, but if you're\nwrong,\
    \ your code will throw a NoSuchElementException:\n\n```\n// Using an optional\
    \ when you know there's a return value\nElement lastNobleGas = max(Elements.NOBLE_GASES).get();\n\
    ```\n\nOccasionally you may be faced with a situation where it's expensive to\
    \ get the\ndefault value, and want to avoid that unless it's necessary. For these\n\
    situations, Optional provides a method that takes a Supplier<T> and invokes it\n\
    only when necessary. This method is orElseGet, but perhaps it should have\nbeen\
    \ orElseCompute because it is closely related to the Map methods\nnames begin\
    \ with compute. There are several Optional methods for\ndealing with more specialized\
    \ cases: filter, map, flatMap, and ifPresent.\nIn Java, two of the methods described\
    \ above aren't a good match for your use case, look at\nthe documentation for\
    \ these more advanced methods and see if they do the job.\n\nIn case of these\
    \ methods meet your needs, Optional provides the\nisPresent() method returns true\
    \ if\ntoptional contains a value, false if it's empty. You can use this method\
    \ to\n any processing you like on an optional result, but make sure to use it\n\
    wisely. Many uses of ifPresent can probably be replaced by one of the methods\n\
    mentioned above. The resulting code will typically be shorter, clearer, and more\n\
    diomatic."
