  md: "If you use a nested for-each loop, the problem simply variable disappears.\
    \ The resulting code is as succinct as you could wish for:\n\n```\n// Preferred\
    \ idiom for nested iteration on collections and arrays\nfor (Suit suit : suits)\n\
    \    for (Rank rank : ranks)\n        deck.add(new Card(suit, rank));\n```\n\n\
    Unfortunately, there are three common situations where you can't use-each:\n\n\
    +   - **Destructive filtering**—If you need to traverse a collection removing\
    \ selected elements, then you need to use an explicit iterator so that you can\
    \ call its remove method. You can often avoid explicit traversal by using Collection's\
    \ removeIf method added in Java 8.\n\n+   - **Transforming**—If you need to traverse\
    \ a list and replace some or all of the values of its elements, then you need\
    \ the list iterator or array index in order to replace the value of an element.\n\
    \n+   - **Parallel iteration**—If you need to traverse multiple collections in\
    \ parallel, then you need explicit control over the iterator or index variable\
    \ so that all it-erators or index variables can be advanced in lockstep (as demonstrated\
    \ uninin-intentionally in the buggy card and dice examples above).\n\nIf you find\
    \ yourself in any of these situations, use an ordinary for loop and be wary of\
    \ the traps mentioned in this item.\nNot only does the for-each loop let you iterate\
    \ over collections and arrays, it lets you iterate over any object that implements\
    \ the Iterable interface, which consists of a simple method. Here is how the interface\
    \ looks:\n\n```\npublic interface Iterable<E> {\n    // Returns an iterator over\
    \ the elements in this iterable\n    Iterator<E> iterator();\n}\n```\n\nIt is\
    \ a bit tricky to implement Iterable if you have to write your own Iterator implementation\
    \ from scratch, but if you are writing a type that represents a group of elements,\
    \ you should strongly consider having it Iterable, even if you choose not to implement\
    \ Collection. This will allow your users to iterate over your type using the for-each\
    \ loop, and they will be forever grateful.\nIn summary, the for-each loop provides\
    \ compelling advantages over the traditional for loop in clarity, flexibility,\
    \ and bug prevention, with no performance penalty. Use for-each loops in preference\
    \ to for loops wherever you can."
