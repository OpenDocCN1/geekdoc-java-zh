  md: "# ITEM 90: CONSIDER SERIALIZATION PROXIES INSTEAD OF SERIALIZED INSTANCES\n\
    \nfigure out which fields might be compromised by devious serialization attacks,\n\
    nor do you have to explicitly perform validity checking as part of deserialization.\n\
    \nThere is another way in which the serialization proxy pattern is more powerful\n\
    than defensive copying in readObject. The serialization proxy pattern allows thendeserialized\
    \ instance to have a different class from the originally serialized instance.\
    \ You might not think this would be useful in practice, but it is.\nConsider the\
    \ case of EnumSet (Enum). This class has no public constructors,\nonly static\
    \ factors. From the client's perspective, they return EnumSet instances,\ndon\
    \ on the OpenJDK implementation, they return one of two subclasses,\ndending on\
    \ the size of the enum type; if sixty or fewer elements, the static factors return\
    \ a RegularEnumSet-\n\nNow consider what happens if you serialize an instance\
    \ whose enum type has\nsixty elements, then add five more elements to the enum\
    \ type, and then deserialize\nt enum. It is a RegularEnumSet instance once it\
    \ was serialized, but it would\nbetter be a JumboEnumSet instance once it is de-serializedized.\
    \ In fact that's exactly\nwhat happens, because EnumSet uses the serialization\
    \ proxy pattern. In case\nyou're curious, here is EnumSet's serialization proxy.\
    \ It really is like this:\n\n```\n// EnumSet's serialization proxy\n```\n\n```\n\
    private static class SerializationProxy<E extends Enum<E>>\n    implements Serializable\
    \ {\n    // The element type of this enum set.\n    private final Class<E> elementType;\n\
    \n    // The elements contained in this enum set.\n    private final Enum<?>[]\
    \ elements;\n\n    SerializationProxy(EnumSet<E> set) {\n        elementType =\
    \ set.elementType();\n        elements = set.toArray(new Enum[?][0]);\n    }\n\
    \n    private Object readObject(Object arg) {\n        EnumSet<E> result = EnumSet.noneOf(elementType);\n\
    \        for (Enum<?> e : elements) {\n            result.add((E)e);\n       \
    \ }\n        return result;\n    }\n\n    private static final long serialVersionUID\
    \ = \n        362491234563181265L;}\n```"
  merge: -1
