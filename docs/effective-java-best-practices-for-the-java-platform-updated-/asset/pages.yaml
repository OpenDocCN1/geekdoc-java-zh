    \ and the multiplication overflow, information would be lost, multiplication by\
    \ 2 is equivalent to shifting. The advantage of using prime can be replaced by\
    \ a shift and a subtraction for better performance on some architectures: 31 *\
    \ i = (i << 5) - i. Modern VMs do this sort of optimization.\n\nLet's apply the\
    \ previous recipe to the PhoneNumber class:\n\n```\n// Typical hashCode method\n\
