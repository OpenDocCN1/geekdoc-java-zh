  md: "ITEM 76: SYNCHRONIZE ACCESS TO SHARED MUTABLE DATA 315\n\nThe intent of the\
    \ method is to guarantee that every invocation returns a unique value (so long\
    \ as there are no more than 2^31 invocations). The method's state consists of\
    \ a single atomically accessible field, nextSerialNumber, and all possible values\
    \ of this field are legal. Therefore, no synchronization is necessary to protect\
    \ its invariants. Still, the method will not work properly without synchronization.\n\
    \nThe problem is that the increment operator (++) is not atomic. It performs two\
    \ operations on nextSerialNumber: first it reads the value, and then writes back\
    \ a new value, equal to the old value plus. If a second thread reads the field\
    \ before it writes a new one, the second thread will see the same value as the\
    \ first and the same serial number. This is a failure: the program computes the\
    \ wrong results.\n\nOne way to fix nextSerialNumber is to add the synchronized\
    \ modifier to its declaration. This ensures multiple invocations won't be interleaved\
    \ and each invocation of the method will see the effects of all previous invocations.\
    \ Once you've done, you can remove the volatile modifier nextSerialNumber. To\
    \ bulletproof the method, use long instead of int, or wrap the nextSerialNumber\
    \ in an AtomicInteger.\n\nBetter still, follow the advice in item 59 and use the\
    \ AtomicLong from java.util.concurrent.atomic, which is concurrent. This package\
    \ provides primitives for lock-free, thread-safe programming on single variables.\
    \ While volatile provides only the communication effects of synchronization, this\
    \ package also provides atomicity. This is exactly what we need for generateSerialNumber,\
    \ and it is likely to outperform the synchronized version:\n\n```\n// Lock-free\
    \ synchronization with java.util.concurrent.AtomicLong\n```\n\n```\nprivate static\
    \ final AtomicLong nextSerialNumber = new AtomicLong();\n```\n\n```\npublic static\
    \ long generateSerialNumber() {\n    return nextSerialNumber.getAndIncrement();\n\
    }\n```\n\nThe best way to avoid the problems discussed in this item is to not\
    \ share data. Either use immutable data (Item 17) or not share at all. In other\
    \ words, confine mutable data to a single thread. If you adopt this policy, it\
    \ is important to document it so that the policy is maintained as your program\
    \ evolves. It is also important to have a deep understanding of the frameworks\
    \ and libraries you're using because they may introduce threads that you are unaware\
    \ of.\n\nIt is acceptable for one thread to modify a data object for a while and\
    \ then to share it with other threads, synchronizing only the act of sharing the\
    \ object reference. Other threads can then read the object without synchronization,"
