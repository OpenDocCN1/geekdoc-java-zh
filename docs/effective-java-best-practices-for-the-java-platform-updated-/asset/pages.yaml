  md: "# Item 46: Prefer side-effect-free functions in streams\n\nIf you're new to\
    \ streams, it can be difficult to get the hang of them. Merely expressing your\
    \ computation as a stream pipeline can be hard. But if you succeed, you may realize\
    \ little any benefit. Streams isn't just an API, it's a paradigm based on functional\
    \ programming. In order to obtain the expressiveness, speed, and in some cases\
    \ parallelism that streams have to offer, you have to adopt the paradigm as well\
    \ as the API.\n\nThe most important part of the paradigm is to structure your\
    \ computation as a sequence of transformations where the result of each stage\
    \ is as clear as a pure function is one whose result depends only on its input;\
    \ it does not depend on any mutable state, nor does it update any state. In order\
    \ to achieve this, any function objects that you pass into stream operations,\
    \ both intermediate and terminal, should be free of side-effects.\n\nOccasionally,\
    \ you may write some code that looks like this snippet, which builds a frequency\
    \ table of words in a text file:\n\n```\n// Uses streams API but not the paradigm--Don't\
    \ do this!\nMap<String, Long> freq = new HashMap<>();\ntry (Stream<String> words\
    \ = new Scanner(file).tokens()) {\n    words.forEach(word -> {\n        freq.merge(word.toLowerCase(),\
    \ 1L, Long::sum);\n    });\n}\n```\n\nWhat's wrong with this code? After all,\
    \ it uses streams, lambdas, and method references, and it gets the right answer.\
    \ Simply put, it's not streams code at all; it's iterative coding masquerading\
    \ as streams code. It derives no benefits from the streams API, and it's (a bit)\
    \ longer, harder to read, and less maintainable than the corresponding iterative\
    \ API. The problem stems from the fact that this code does all its work in a forEach\
    \ operation, using a lambda that mutates an external state (the frequency table).\
    \ A forEach operation that does more than present the result of the computation\
    \ performed by a stream is a \"bad smell in code\", as it is a lambda that mutates\
    \ state. So how should this code look?\n\n```\n// Proper use of streams to initialize\
    \ a frequency table\nMap<String, Long> freq;\ntry (Stream<String> words = new\
    \ Scanner(file).tokens()) {\n    freq = words\n        .collect(Collectors.groupingBy(String::toLowerCase,\
    \ Collectors.counting()));\n}\n```"
