  md: "# CHAPTER 2 CREATING AND DESTROYING OBJECTS\n\nThe NutritionFacts class is\
    \ immutable, and all parameter default values are in one place. The builder's\
    \ setters return the builder itself so that invocations can be chained, resulting\
    \ in a fluent API. Here is how the client code looks:\n\n```\nNutritionFacts cocaCola\
    \ = new NutritionFacts.Builder(240, 8)\n.calories(100).sodium(35).carbohydrate(27).build();\n\
    ```\n\nThis client code is easy to write, and more importantly, easy to read.\
    \ The Builder pattern clearly named optional parameters as soon found in Python\
    \ and Scala.\n\nValidity checks are omitted for brevity. To detect invalid parameters\
    \ as soon possible, check parameter validity in the builder's constructor and\
    \ methods. Check invariants involving multiple parameters in the constructor invoked\
    \ by the build method. To ensure these invariants against attack, do check on\
    \ object fields after copying parameters from the builder (Item 50). If a check\
    \ fails, throw an IllegalArgumentException (Item 72) whose detail message indicates\
    \ which parameters are invalid (item 75).\n\nThe Builder pattern is well suited\
    \ to class hierarchies. A parallel hierarchy of builders, each nested in the corresponding\
    \ class. Abstract classes have abstract builders; concrete classes have concrete\
    \ builders. For example, consider an abstract class at the root of a hierarchy\
    \ representing various values of pizza:\n\n```\n// Builder patterns for class\
    \ hierarchies\npublic abstract class Pizza {\n    public enum Topping { HAM, MUSHROOM,\
    \ ONION, PEPPER, SAUSAGE }\n    final Set<Topping> toppings;\n    abstract static\
    \ class Builder extends Builder<T> {\n        EnumSet toppings = EnumSet.noneOf(Topping.class);\n\
    \        public T addTopping(Topping topping) {\n            toppings.add(Objects.requireNull(topping));\n\
    \            return self;\n        }\n        abstract Pizza build();\n    }\n\
    \    // Subclasses must override this method to return \"this\"\n    protected\
    \ abstract T self();\n}\nPizza(Builder<Pizza> builder) {\n    toppings = builder.toppings.clone();\
    \ // See Item 50\n}\n```\n\nNote that Pizza.Builder is a generic type with a recursive\
    \ type parameter (Item 30). This, along with the abstract self method, allows\
    \ method chaining to work properly in subclasses, without the need for casts.\
    \ This workaround for the fact that Java lacks a self type is known as the simulated\
    \ self-type idiom."
