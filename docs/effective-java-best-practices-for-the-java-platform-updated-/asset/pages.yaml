  md: 'Using the default serialized form when an object''s physical representation
    differs substantially from its logical data content has four disadvantages:


    +   - It permanently ties the exported API to the current internal representation.
    In the above example, the private StringList.Entry becomes part of the public
    API. If the representation is changed in a future release, the StringList class
    will still need to accept the linked list representation on input and generate
    it output. The class will never be rid of all the code dealing with linked list
    entries, even if it doesn''t use them.


    +   - It can consume excessive space. In the above example, the serialized form
    unnecessarily represents each entry in the linked list and all the links. These
    entries and links are more implementation details, not worthy of inclusion in
    the serialized form. Because the serialized form is excessively large, writing
    to disk or sending it across the network will be excessively slow.


    +   - It can cause excessive time. The serialization logic has no knowledge of
    the topology of the object graph, so it must go through an expensive graph traversal.
    In the example above, it would be sufficiently to follow the next references.


    +   - It can cause stack overflows. The default serialization procedure performs
    a recursive traversal of the object graph, which can cause stack overflows even
    for moderately sized object graphs. Serializing a StringList instance with 1,000–1,800
    elements generates a StackOverflowError on my machine. Surprisingly, the minimum
    list for which serialization causes a stack overflow varies from run to run (on
    my machine). The minimum list size that exhibits this problem may depend on the
    platform implementation and command-line flags; some implementations may not have
    this problem at all.


    A reasonable serialized form for StringList is simply the number of strings in
    the list, followed by the strings themselves. This constitutes the logical data
    represented by a StringList, stripped of the details of its physical representation.
    Here is a revised version of StringList with writeObject and readObject methods
    that implement this serialized form. As a reminder, the transient modifier indicates
    that an instance field is to be omitted from a class''s default serialized form:'
