  md: '# CHAPTER 4 CLASSES AND INTERFACES


    If a concrete class does not implement a standard interface, then you may inconvenience
    some programmers by prohibiting inheritance. If you feel that you must allow inheritance
    from such a class, one reasonable approach is to ensure that the class never invokes
    any of its overridable methods and to document this fact. In other words, eliminate
    the class''s self-use of overridable methods entirely. In doing so, you''ll create
    a class that is reasonably safe to subclass. Overriding a method will affect the
    behavior of any other method.


    You can eliminate a class''s self-use of overridable methods mechanically, without
    changing its behavior. Move the body of each overridable method to a private "helper
    method" and have each overridable method invoke its private helper method. Then
    replace each-use of an overridable method with a direct invocation of the private
    helper method.


    In summary, designing a class for inheritance is hard work. You must document
    all of its self-use patterns, and once you''ve documented them, you must commit
    to them for the life of the class. If you fail to do this, subclasses may become
    dependent on implementation details of the superclass and may break if the implementation
    changes. To allow others to write efficient subclasses, unless you know there
    is a real need for subclasses, you are probably better off prohibiting inheritance
    by declaring your class final or ensuring that there are no accessible constructors.'
