  md: "# ITEM 26: DON'T USE RAW TYPES\n\nWhat is the difference between the unbounded\
    \ wildcard type Set<?> and the raw type Set? Does the question mark really buy\
    \ you anything? Not to labor the point, but the wildcard type is safe and the\
    \ raw type isn't. You can put any element into a collection with a raw type, easily\
    \ corrupting the collection's type invariant (as demonstrated by the unsafeAdd\
    \ method on page 119); **you can't put any element (other than null) into a Collection<?>**.\
    \ Attempting to do so will generate a compile-time error message like this:\n\n\
    ```\nWildCard(Java 5+): error: incompatible types: String cannot be converted\
    \ to Set<?>\n  .add(\"verboten\");\n```\n\n```\nwhere CAP1 is a fresh type-variable:\n\
    \  CAP1 extends object from capture of ?\n```\n\nAdmitted this error message leaves\
    \ nothing to desired, but the compiler does its job, preventing you from corrupting\
    \ the collection's type invariant, whatever its element type may be. Not only\
    \ can you put any element (other than null) into a Collection<?, nor can you assume\
    \ anything about the type of the objects that you get out. If these restrictions\
    \ are unacceptable, you can use generic methods (Item 30) or bounded wildcard\
    \ types (Item 31).\n\nThere are a few exceptions to the rule that you should not\
    \ use raw types. **You must use raw types in class members.** The specification\
    \ does not permit the use of parameterized types (it does permit array and primitive\
    \ types) (JLS, 15.8.2). In other words, List.class, String[].class, and int.class\
    \ are all legal, but List.class and List<?>.class are not.\n\nA second exception\
    \ to the rule concerns the instanceof operator. Because generic information is\
    \ erased at runtime, it is illegal to use the instanceof operator on parameterized\
    \ types other than unbounded wildcard types. The use of unbounded wildcard types\
    \ in place of raw types does not affect the behavior of the instanceof operator\
    \ in any way. In this case, the angle brackets and question marks are just noise.\
    \ **This is the preferred way to use the instanceof operator with generic types:**\n\
    \n```\n// Legitimate use of raw type - instanceof operator\nif (o instanceof Set)\
    \ { // Raw type\n  Set<?> s = (Set<?>) o; // wildcard type\n  ...\n}\n```"
