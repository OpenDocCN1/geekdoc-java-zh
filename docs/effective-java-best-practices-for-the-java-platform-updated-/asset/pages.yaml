  md: '# CHAPTER 7 LAMBDAS AND STREAMS


    are several reasons that Comparator deserves its own interface. First, its name
    provides excellent documentation every time it is used in an API, and it''s used
    a lot. Second, the Comparator interface has strong requirements on what constitutes
    a valid instance, which comprise its general contract. By implementing the interface,
    you are pledged to adhere to its contract. Third, the interface is heavily outfitted
    with useful default methods to transform and combine combinators.


    You should personally consider writing a purpose-built functional interface in
    preference to using a standard one if you need a functional interface that shares
    one or more of the characteristics with Comparator:


    +   - It will be commonly used and benefit from a descriptive name.

    - It has a strong contract associated with it.

    - It would benefit from custom default methods.


    If you write your own functional interface, remember that it''s an interface and
    hence should be designed with great care (Item 21).

    Note that the @FunctionalInterface annotation (page 199) is labeled with @Override.
    This annotation type is similar in spirit to @Override. It is a statement of programmer
    intent that serves three purposes; it tells readers the code and its documentation
    that the interface was designed to enable lambdas; it keeps you from compiling
    the interface unless it has exactly one abstract method; and it prevents maintainers
    from accidentally adding abstract methods to the interface as it evolves. Always
    annotate your functional interfaces with the @FunctionalInterface annotation.


    A final point should be made: the use of functional interfaces in APIs can lead
    to method overloading that different functional interfaces in the same argument
    position could create potential ambiguity. The problem of ExecutorService can
    take a Callable<T> or a Runnable, and it is possible to write a client program
    that requires a cast to indicate the correct overloading (Item 52). The easiest
    to avoid this problem is not to write overloading that different functional interfaces
    in the same argument position. This is a special case of the advice in Item 52,
    "use overloading judiciously."


    In summary, now that Java has lambdas, it is imperative that you design your APIs
    with lambdas in mind. Accept functional interface types on input and return them
    on output. It is generally best to use the standard interfaces provided in Java.util.function.Function,
    but keep your eyes open for the relatively rare cases where you would be off writing
    your own functional interface.'
