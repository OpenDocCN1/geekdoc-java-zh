  md: "Whether or not you accept the default serialized form, every instance field\
    \ that isn't labeled transient is serialized when the defaultwriteObject method\
    \ is invoked. Therefore, every instance field that can be declared transient should\
    \ be. This includes derived fields, whose values can be computed from primary\
    \ data, such as a cached hash value. It also includes fields whose values are\
    \ tied to one particular run of the VM, such as a field representing a pointer\
    \ to a native data structure. Before you make a field nontransfer, consider that\
    \ if you use a custom serialized form, or all of the instance fields should be\
    \ labeled transient, as in the Stringlist example above.\n\nIf you use the default\
    \ serialized form and have labeled one or more fields transient, remember that\
    \ these fields will be initialized to their default values when an instance is\
    \ deserialized. For object reference fields, zero for numeric primitives, and\
    \ false for boolean fields. If these values are unacceptable for your transient\
    \ fields, you must provide a method that invokes the defaultreadObject method\
    \ and restores them to acceptable values (Item 88). Alternatively, these fields\
    \ can be lazily initialized the first time they are used (Item 89).\n\nWhether\
    \ or not you use the default serialized form, you must impose any synchronization\
    \ on object serialization that you would impose on any other method that accesses\
    \ the entire state of the object. So, for example, if you have a thread-safe object\
    \ (Item 82) that ensures its safety by synchronizing every method and you elect\
    \ to use the default serialized form, use the following write-Object method:\n\
    \n```\n// writeObject for synchronized class with default serialized form\nprivate\
    \ void writeObject(ObjectOutput s) throws IOException {\n    s.defaultWriteObject();\n\
    }\n```\n\nIf you put synchronization in the writeObject method, you must ensure\
    \ that it adheres to the lock-ordering constraints as other activities, or you\
    \ risk a resource-ordering deadlock (Goetz06, 10.1.5).\n\nRegardless of what serialized\
    \ form you choose, declare an explicit serial version UID in every serializable\
    \ class you write. This eliminates the serial version UID as a potential source\
    \ of incompatibility (Item 86). There is also a small performance benefit. If\
    \ no serial version UID is provided, an expensive computation is performed to\
    \ generate one at runtime."
