  md: "# ITEM 47: PREFER COLLECTION TO STREAM AS A RETURN TYPE\n\nNote that PowerSet.of\
    \ throws an exception if the input set has more than 30 elements. This highlights\
    \ a disadvantage of using Collection as a return type rather than Stream or Iterable:\
    \ Collection has an int-returning size method, which limits the length of the\
    \ returned sequence to Integer.MAX_VALUE. The Collection specification allows\
    \ the size method to return 2^∞ if the collection is larger even infinite, but\
    \ this is not a wholly satisfying solution.\n\nIn order to write a Collection\
    \ implementation you also implement AbstractCollection and you need implement\
    \ only two methods beyond the one required for Iterables of elements. If it's\
    \ not easy to write prefixes, because the contents of the sequence aren't predetermined\
    \ before iteration takes place, return a stream or iterable, whichever feels more\
    \ natural. If you choose, you can return both using two separate methods.\n\n\
    There are times when you want to write a return type based solely on case of implementation.\
    \ For example, suppose you want to write a method that returns all the (contiguous)\
    \ sublists of an input list. It takes only three lines of code to generate these\
    \ sublists put in a standard collection, the code required to hold this collection\
    \ is quadratic in size of the source list. While this is not as bad as the power\
    \ set, which is exponential, it is clearly unacceptable. Implementing a custom\
    \ collection, as we would for the power set, would be tedious, so more because\
    \ the JDK calls a skeletal Iterator implementation to help us.\n\nIt is, however,\
    \ straightforward to implement a stream of all the sublists of an input list,\
    \ though it does require a minimum effort. Let's say a list that contains the\
    \ first element of a prefix of the list. For example, the prefixes of (a, b, c)\
    \ are (a), (a, b), and (.). Let's say a list that contains the last element of\
    \ a suffix: the suffixes of (a, b, c) are (a, b), (b, c), and (c). The insight\
    \ is that the sublists of a list are simply the suffixes of the prefixes (or identically,\
    \ the prefixes of the suffixes) and the empty list. This observation leads to\
    \ a clear, reasonably concise implementation:\n\n```\n// Returns all of the sublists\
    \ of its input list\npublic static List<E> subLists(List<E> list) {\n    return\
    \ Stream.concat(Stream.of(Collections.emptyList()),\n        prefixes(list).flatMap(SubLists::suffixes));\n\
    }\n\\private static <E> Stream<List<E>> prefixes(List<E> list) {\n    return IntStream.rangeClosed(1,\
    \ list.size())\n        .mapToObj(end -> list.sublist(0, end));\n}\n```"
