  md: "# Item 22: Use interfaces only to define types\n\nWhen a class implements an\
    \ interface, the interface serves as a type that can be used to refer to instances\
    \ of the class. That class that implements an interface should therefore say something\
    \ about what a client can do with instances of the class. It is inappropriate\
    \ to define an interface for any other purpose.\n\nOne kind of interface that\
    \ fails is the so-called constant interface. Such an interface contains no methods;\
    \ it consists solely of static final fields, exporting a constant. Classes using\
    \ these constants implement the interface to avoid the need to quantify constants\
    \ with a class name. Here is an example:\n\n```\n// Interface antipattern - do\
    \ not use!\npublic interface PhysicalConstants {\n    // Avogadro's number (1/mol)\n\
    \    static final double AVOGADRO_NUMBER = 6.022_140_857e23;\n\n    // Boltzmann\
    \ constant (J/K)\n    static final double BOLTZMANN_CONSTANT = 1.380_648_52e-23;\n\
    \n    // Mass of the electron (kg)\n    static final double ELECTRON_MASS = 9.109_383_56e-23;\n\
    }\n```\n\nThe constant interface pattern is a poor use of interfaces. A class\
    \ that uses some constants internally is an implementation detail to leak into\
    \ the class's exported API. It is of no consequence to the users of a class that\
    \ implements a constant interface. In fact, it may confuse them, for it represents\
    \ a commitment: if in a future the class is modified so that it no longer needs\
    \ to use the constants, it still must implement the interface to ensure binary\
    \ compatibility. If a nonfinal class implements an interface, all of its subclasses\
    \ will have their namespaces polluted by the constants in the interface.\n\nThere\
    \ are several constants in the Java platform libraries, such as java.lang.Integer.\
    \ These constants should be regarded as anomalies and should not be used.\n\n\
    If you want to export constants, there are several reasonable choices. If the\
    \ constants are strongly tied to an existing class or interface, you should add\
    \ them to the class or interface. For example, all of the boxed numerical primitive\
    \ classes, such as Integer and Double, export MIN_VALUE and MAX_VALUE constants.\
    \ If the constants are best viewed as members of an enumerated type, you should\
    \ export"
