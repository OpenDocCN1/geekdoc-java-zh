  md: "To make this concrete, consider the following generic method, which takes\n\
    three arguments of type T and returns an array containing two of the arguments,\n\
    chosen at random:\n\n```\nstatic <T> T[] pickTwo(T a, T b, T c) {\n    switch\
    \ (ThreadLocalRandom.current().nextInt(3)) {\n        case 0: return toArray(a,\
    \ b);\n        case 1: return toArray(b, c);\n        case 2: return toArray(a,\
    \ c);\n    }\n    throw new AssertionError(); // Can't get here\n}\n```\n\nThis\
    \ method is not safe, is dangerous, and would not generate a warning\nexcept for\
    \ that it invokes the toArray method, which has a generic varags parameter.\n\
    When compiling this method, the compiler generates code to create a varags\nparameter\
    \ array in which to pass two T instances to toArray. This code allocates\nan array\
    \ of type Object[], which is the most specific type that is guaranteed to\nhold\
    \ these instances, no matter what type of objects are passed to pickTwo at the\n\
    call site. The toArray method returns this array to pickTwo, which in turn\nreturns\
    \ it to its caller, so pickTwo will always return an array of type Object[].\n\
    Now consider this method, which exercises pickTwo.\n\n```\npublic static void\
    \ main(String[] args) {\n    String[] attributes = pickTwo(\"Good\", \"Fast\"\
    , \"Cheap\");\n}\n```\n\nThere is nothing wrong with this method, so it compiles\
    \ without generating\nany warnings. When you run it, it throws a ClassCastException,\
    \ though it\ncontains no visible casts. What you don't see is that the compiler\
    \ has generated\nhidden cast to String[] on the value returned by pickTwo so that\
    \ it can be storednin attributes. The cast fails, because Object[] is not a subtype\
    \ of String[.\nThis failure is quite disconcerting because it is two levels removed\
    \ from the\nmethod that actually causes the heap pollution (toArray()), and the\
    \ varags parameter\n is not modified after the actual parameters are stored in\
    \ it.\n\nThis example is meant to drive home the point that it is unsafe to give\n\
    another method access to a generic varags parameter array, with two exceptions:\n\
    it is safe to pass the array to another varags method that is correctly annotated\
    \ with @SafeVarags, and it is safe to pass the array to a non-varags method\n\
    that merely computes some function of the contents of the array."
