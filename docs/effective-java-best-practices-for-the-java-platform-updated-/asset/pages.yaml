  md: "# Item 20: Prefer interfaces to abstract classes\n\nJava has two mechanisms\
    \ to define a type that permits multiple implementations: interfaces and abstract\
    \ classes. Since the introduction of default methods for interfaces in Java 8,\
    \ both mechanisms allow you to provide implementations for some instance methods.\
    \ A major difference is that to implement the type defined by an abstract class,\
    \ a class must be a subclass of the abstract class. Because Java permits only\
    \ inheritance, this restriction on abstract classes constrains their use everywhere.\
    \ Any class that defines all the required methods and obeys the general contract\
    \ is permitted to implement an interface, regardless of where the class resides\
    \ in the class hierarchy.\n\nExisting classes can easily be retrofitted to implement\
    \ a new interface. All you have to do is add the required methods, if they don't\
    \ exist, and to add an implements to the class declaration. For example, many\
    \ existing classes were retrofitted to implement the Comparable, Iterable, and\
    \ AutoCloseable interfaces. Existing classes cannot, in general, be retrofitted\
    \ to extend an abstract class. If you want to have two classes extend the same\
    \ abstract class, you have to place it high in the type hierarchy where it is\
    \ an ancestor of both. Unfortunately, this can cause great damage to the type\
    \ hierarchy, forcing all descendants of the new abstract class to subclass it,\
    \ whether or not it is appropriate.\n\nInterfaces allow for defining mixins. Loosely\
    \ speaking, a mixin is a type that a class can implement addition to its 'primary\
    \ type' to declare that it provides some optional behavior. For example, Comparable\
    \ is a mix interface that allows a class to declare that its instances are ordered\
    \ with respect to other comparable objects. Such an interface is called a mixin\
    \ because it allows the optional functionality to be 'mixed in' to the type's\
    \ primary functionality. Abstract classes can't be used for defining mixins for\
    \ the reason that they cannot be retrofitted onto existing classes: a class cannot\
    \ have more than one parent, and there is no reason to insert a mixin.\n\nInterfaces\
    \ allow for the construction of nonhierarchical frameworks. Type hierarchies are\
    \ great for organizing some things, but things that don't fit neatly into a rigid\
    \ hierarchy. For example, suppose we have an interface representing a singer and\
    \ another representing a songwriter.\n\n```\npublic interface Singer {\n    AudioClip\
    \ sing(Song s);\n}\n```"
