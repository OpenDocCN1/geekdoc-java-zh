  md: "# CHAPTER 3 METHODS COMMON TO ALL OBJECTS\n\nIn Java 8, the Comparator interface\
    \ was outfitted with a set of comparator construction methods, which enable fluent\
    \ construction of comparators. These comparators can be used to implement a compareTo\
    \ method, as required by the Comparable interface. Many programmers prefer the\
    \ precision of this approach, though it comes at a performance cost: sorting of\
    \ PhoneNumber instances is about slower on any machine. When using this approach,\
    \ consider using Java's static import facility so you can refer to static comparator\
    \ methods by their simple names for clarity and brevity. Here's how the compareTo\
    \ for PhoneNumber looks using this approach:\n\n// With compare with construction\
    \ methods\n\n```\nprivate static final Comparator<PhoneNumber> COMPARATOR =\n\
    \    comparingInt(pn -> pn.areaCode)\n    thenComparingInt(pn -> pn.prefix)\n\
    \    thenComparingInt(pn -> pn.lineNumber);\n```\n\n```\npublic int compareTo(PhoneNumber\
    \ pn) {\n    return COMPARATOR.compare(this, pn);\n}\n```\n\nThis implementation\
    \ builds a comparator at class initialization time, using two comparator construction\
    \ methods. The first is comparingInt. It is a static method that takes a key extractor\
    \ function that maps an object reference to a key of type and returns a comparator\
    \ that orders instances according to key. In the previous example, comparingInt\
    \ takes a lambda () that extracts the area code from a PhoneNumber and returns\
    \ a Comparator<PhoneNumber> that orders numbers by their area codes. The lambda\
    \ explicitly specifies the type of its parameter (PhoneNumber). It turns out that\
    \ in this situation, Java's type inference isn't powerful enough to figure the\
    \ type out for itself, so we were forced to help it in order to make the program\
    \ clear.\n\nIf two numbers have the same area code, we need to further refine\
    \ the comparison, and that's exactly what the second comparator method, thenComparingInt,\
    \ does. It is an instance method on Comparator that takes an key extractor function\
    \ and returns a comparator that first applies the original comparator and then\
    \ uses the extracted key to break ties. You can stack up as many calls to thenComparingInt\
    \ as you like, resulting in lexicographic ordering. In the example above, we use\
    \ two calls to thenComparingInt, resulting in an ordering whose secondary key\
    \ is the prefix and tertiary key is the line number. Note that we did not have\
    \ to specify the type of the key extractor function passed to the calls to thenComparingInt:\
    \ Java's type inference was smart enough to figure this out for itself."
