    // My stamp collection. Contains only Stamp instances.

    private final Collection stamps = ... ;

    ```


    If you use this declaration and then accidentally put a coin into your stamp

    collection, the erroneous insertion compiles and runs without error (though the

    compiler emits a vague warning):


    ```

    // Erroneous insertion of coin into stamp collection

    stamps.add(new Coin( ... )); // Emits "unchecked call"

    stamp.cancel();

    ```


    You don''t get an error until you try to retrieve the coin from the stamp collection:


    ```

    // Raw Iterator type - don''t do this!

    for (Iterator i = stamps.iterator(); i.hasNext(); )

    Stamp stamp = (Stamp) i.next(); // Throws ClassCastException

    .cancel();

    ```


    As mentioned though, it pays to discover errors as soon as pos-

    sible after they are made, ideally at compile time. In this case, you don''t

    the error until until runtime. The error: you see the ClassCastException, you

    from the code containing the error have to be distant

    to search through the codebase looking for the method invocation that put the

    coin into the stamp collection. The compiler can''t help you, because it can''t

    understand the comment that says, "Contains only Stamp instances".

    With generics, the type contains the information, not the comment:


    ```

    // Parameterized collection type - typesafe

    private final Collection<Stamp> stamps = ...

    ```


