  md: "# CHAPTER 6 ENUMS AND ANNOTATIONS\n\nEnum types have an automatically generated\
    \ listOf(String) method that translates a constant's name to the constant itself.\
    \ If you override the toString method in an enum type, consider writing a fromString\
    \ method to translate the custom string representation back to the corresponding\
    \ enum variable. The following code (with the name changed appropriately) will\
    \ do the trick for any enum, so long as each constant has a unique string representation:\n\
    \n```\n// Implementing a fromString method on an enum type\nprivate static final\
    \ Map<String, Operation> stringToEnum =\n    Stream.of(Operation.values()).toMap(Object::toString,\
    \ e -> e));\n```\n\n```\n// Returns Operation for string, if any\npublic static\
    \ Optional<Operation> fromString(String symbol) {\n    return Optional.ofNullable(stringToEnum.get(symbol));\n\
    ```\n\nNote that the Operation are put into the stringToEnum map from a static\
    \ field initialization that runs after the constants have been created. The previous\
    \ code uses a stream (Chapter 7) over the array returned by the values() method;\
    \ prior to Java 8, we would have created an empty map and iterated over the array\
    \ inserting the string-to-enum mappings into the map, and you can still do it\
    \ if you prefer. But not attempting to put itself into a map from its own constructor\
    \ does not work. It would cause a compilation error, or if legal, it would cause\
