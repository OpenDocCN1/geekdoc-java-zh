  md: "# Consider a builder when faced with many constructor parameters\n\nStatic\
    \ factories and constructors share a limitation: they do not scale well to large\
    \ numbers of optional parameters. Consider the case of a class representing the\
    \ Nutrition Facts label that appears on packaged foods. These labels have a few\
    \ required fields—serving size, servings per container, and calories per serving—and\
    \ more than twenty optional fields—total fat, trans fat, cholesterol, sodium,\
    \ and so on. Most products have nonzero values for only a few of these optional\
    \ fields.\n\nWhat sort constructors or static fields should you write for such\
    \ a class? Traditionally, programmers have the telescoping constructor pattern,\
    \ which provide a constructor with only the required parameters, another with\
    \ a single optional parameter, a third with optional parameters, and so on, culminating\
    \ in a constructor with all the optional parameters. Here's how it works in practice.\
    \ For brevity's sake, only four optional fields are:\n\n// Telescoping constructor\
    \ pattern - does not scale well!\n\n```\npublic class NutritionFacts {\n    private\
    \ final int servingSize; // (ml) required\n    private final int servings; //\
    \ (per container) required\n    private final int calories; // (per serving) optional\n\
    \    private final int fat; // (g/serving) optional\n    private final int sodium;\
    \ // (mg/serving) optional\n    private final int carbohydrate; // (g/serving)\
    \ optional\n\n    public NutritionFacts(int servingSize, int servings) {\n   \
    \     this(servingSize, servings, 0);\n    }\n\n    public NutritionFacts(int\
    \ servingSize, int servings,\n        int calories) {\n        this(servingSize,\
    \ servings, calories, 0);\n    }\n\n    public NutritionFacts(int servingSize,\
    \ int servings,\n        int calories, int fat) {\n        this(servingSize, servings,\
    \ calories, fat, 0);\n    }\n\n    public NutritionFacts(int servingSize, int\
    \ servings,\n        int calories, int fat, int sodium) {\n        this(servingSize,\
    \ servings, calories, fat, sodium, 0);\n    }\n```"
