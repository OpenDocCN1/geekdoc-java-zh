    10), this contract is as complicated as it looks. Unlike the equals method, which
    employs a global equivalence relation on all objects, compareTo doesn''t have
    to work across objects of different types: when confronted with objects of different
    types, compareTo is permitted to throw ClassCastException. Usually, that is what
    it does. The contract does permit specify comparisons which are typically defined
    in an interface implemented by the objects being compared.


