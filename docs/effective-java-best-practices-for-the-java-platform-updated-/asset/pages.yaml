    Prior editions of this book recommended that compareTo methods compare primitive\
    \ fields using the relational operators < and >, and floating primitive classes.\
    \ Use of relational operators. In Java 7, static compare methods were added to\
    \ all of Java's boxed primitive classes. These methods are verbose and error-prone\
    \ and no longer recommended.\nIf a class has multiple fields, the order in which\
    \ you compare them is critical. Start with the most significant field and work\
    \ your way down. If a comparison results anything other than zero (which represents\
    \ equality), you're done; return the result. If the most significant field is\
    \ equal, compare the next-significant field, and so on, until you find an unequal\
    \ field or compare the least significant field. Here is a compareTo method for\
