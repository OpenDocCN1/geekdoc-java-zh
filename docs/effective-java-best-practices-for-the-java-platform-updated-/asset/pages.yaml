  md: '# CHAPTER 8

    Methods


    THIS chapter discusses several aspects of method design: how to treat parameters
    and return values, how to design method signatures, and how to document methods.
    Much of the material in this chapter applies to constructors as well as to methods.
    Like Chapter 4, this chapter focuses on usability, robustness, and flexibility.


    # Item 49: Check parameters for validity


    Most methods and constructors have some restrictions on what values may be passed
    into their parameters. For example, it is not uncommon that index values must
    be non-negative and object references be non-null. You should clearly document
    all such restrictions and enforce them with checks at the beginning of the method
    body. This is a special case of the general principle that you should attempt
    to detect errors as soon as possible after they occur. Failing to do so makes
    it less likely that an error will be detected and makes it harder to determine
    the source of an error once it has been detected.


    If an invalid parameter is passed to a method and the method checks its parameters
    before execution, it will fail quickly and cleanly with an appropriate exception.
    If the method fails to check its parameters, several things could happen. The
    method could fail with a confusing exception in the midst of processing. Worse,
    the method could return normally but but silently compute the wrong result. Worst
    of all, the method could return normally but leave some object in a compromised
    state; in other words, failure at some unrelated point in the code at undetermined
    time in the future; failure to validate parameters, can result in a violation
    of failure atomicity (Item 76).


    For public and protected methods, use the Javadoc @throws tag to document the
    exception that will be thrown if a restriction on parameter values is violated'
