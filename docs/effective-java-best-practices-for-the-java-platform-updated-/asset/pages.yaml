  md: '# ITEM 67: OPTIMIZE JUDICIOUSLY


    Consider the performance consequences of your API decisions.

    Making a public type mutable may require a lot of needless defensive copying

    (Item 50). Similarly, using inheritance in a public class where composition would

    have been appropriate ties the class forever to its superclass, which can place

    artificial limits on the performance of the subclass (Item 18). As a final example,

    using an implementation type rather than an API you ties to a

    specific implementation, even though faster implementations may be written in

    the future (64).


    The effects of API design performance are very real. Consider the getsize

    method in the java.awt.Component class. Consider the design that performance-

    critical method was to return a Dimension instance, coupled with the decision
    that

    Dimension instances are mutable, forces any implementation of this method to

    allocate a new Dimension on every invocation. Even though allocating

    objects is inexpensive on a modern VM, allocating millions of objects,

    needlessly can do harm to performance.


    Several API design alternatives existed. Dimension should have been

    immutable (Item 17); alternatively, getsize could have been replaced by two

    methods returning primitive components of a Dimension object. In

    fact, such methods were added to Java 2 for performance

    reasons. Presenting client code, still uses the getsize method and

    still suffers the performance consequences of the original API design decisions.


    Luckily, it is generally the case that good API design is consistent with good

    performance. It is a very bad idea to warp an API to achieve good performance.

    The performance issue caused to warp the API may go away in a

    future release of the platform or other underlying software, but the warped API

    and the support headaches that it will be with you forever.


    Once you''ve created your program and designed a class, clear and

    well-structured implementation, then it is time to consider the program,

    assuming you''re not already satisfied with the performance of the program.


    Recall that Jackson''s two rules of optimization: "Don''t do it" and "for

    experts only). He could have added one more: measure performance before after
    each attempted optimization. You may be surprised by

    what you find. Often, attempted optimizations have no measurable effect on

    performance; they make it worse. The main reason is that it''s difficult to

    gess where your program is spending its time. The part of the program that you

    think is slow may not be at fault, in which case you''d be wasting your time trying

    to optimize it. Common wisdom says that programs spend 90 percent of their time

    in 10 percent of their code.'
