  md: "# Item 40: Consistently use the Override annotation\n\nThe Java libraries contain\
    \ several annotation types. For the typical programmer, the most important of\
    \ these is @Override. This annotation can be used only on method declarations,\
    \ and it indicates that the annotated method declaration over-rides a declaration\
    \ in a supertype. If you consistently use this annotation, it will protect you\
    \ from a large class of nefarious bugs. Consider this program, in which the class\
    \ Bigram represents a bigram, or ordered pair of letters.\n\n```\n// Can you use\
    \ Bigram?\npublic class Bigram {\n    private final char first;\n    private final\
    \ char second;\n\n    public Bigram(char first, char second) {\n        this.first\
    \ = first;\n        this.second = second;\n    }\n\n    public boolean equals(Bigram\
    \ b) {\n        return b.first == first && b.second == second;\n    }\n\n    public\
    \ int hashCode() {\n        return 31 * first + second;\n    }\n\n    public static\
    \ void main(String[] args) {\n        Set<Bigram> s = new HashSet<>();\n     \
    \   for (int i = 0; i < 10; i++) {\n            for (char ch = 'a'; ch < 'z';\
    \ ch++) {\n                s.add(new Bigram(ch, ch));\n            }\n       \
    \ }\n        System.out.println(s.size());\n    }\n}\n```\n\nThe main program\
    \ adds twenty-six bigrams, each consisting of two lowercase letters, to a set.\
    \ Then it prints the size of the set. You might expect the program to print 26,\
    \ but sets cannot contain duplicates. If you try running the program, you'll find\
    \ that it prints 26 260. What is wrong with it?\n\nClearly, the author of the\
    \ Bigram class intended to override the equals method (Item 10) and even remembered\
    \ to override hashCode in tandem (Item 11). Unfortunately, a hapless programmer\
    \ failed to override equals, overloading it instead (Item 52). To override Object.equals,\
    \ you must define an equals method whose parameter is of type Object, but the\
    \ parameter of Bigram's"
