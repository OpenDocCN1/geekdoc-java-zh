  md: '# CHAPTER 4 CLASSES AND INTERFACES


    Inheritance is appropriate only in certain circumstances where the subclass is
    a subtype of the superclass. In other words, a class B should extend a class A
    only if an "is-a" relationship exists between the two classes. If you are tempted
    to have a class B extend class A, ask yourself the question: Is B really an A?
    If you cannot truthfully answer yes to this question, B should not extend A. If
    it is, then the fact that B contains a private instance of A and expose a different
    API is not an essential part of B, merely a detail of its implementation.


    There are a number of obvious violations of this principle in the Java platform
    framework. For example, a list is not a vector, so vector should not extend Vector.
    Similarly, a property list is not a table, so Properties should not extend HashTable.
    In both cases, composition would have been preferable.


    If you use inheritance where composition is appropriate, you needlessly expose
    details. The resulting APIs tie you to the internal implementation, limiting the
    performance of your class. More seriously, by exposing the internals that clients
    access directly, it can lead to confusing semantics. For example, if p refers
    to a Properties instance, p.getProperty(key) may yield different results from
    p.get(key): the former handles defaults while the latter method, which is inherited
    from HashTable, does not. Most seriously, the client may be to corrupt invariants
    of the subclass by modifying the underlying HashTable which allows this invariant
    to be violated. In the case of Properties, the designers intended that only strings
    be allowed as keys and values, but direct access to the underlying HashTable allows
    this invariant to be violated.


    There is last set of questions you should ask yourself before deciding to use
    inheritance having any flaws in your API? Is the class that you are comfortable
    propagating flaws into your class''s API? Inheritance propagates any flaws in
    the superclass''s API, while composition lets you design a new API that hides
    these flaws.


    To summarize, inheritance is powerful, but it is problematic unless used only
    when a genuine subtype relationship exists between the subclass and the superclass.
    Even then, inheritance may lead to fragility if the subclass is in a different
    package from the superclass and the superclass is not designed for inheritance.
    To avoid this fragility, use composition and forwarding instead of inheritance,
    especially if an appropriate interface to implement a wrapper class exists. Not
    only are wrapper classes more robust than subclasses, they are also more powerful.'
