    There are nine additional variants of the Function interface, for use when the
    result type is primitive. The source and result types always differ, because a
    function from a type to itself is a UnaryOperator. If both the source and result
    types are primitive, prefix Function<ToResult>, for example LongToFunction (six
    variants). If the source is a primitive and the result is an object, prefix Function<Double>,
    for example DoubleToFunction (three variants).


    There are two-argument versions of the three basic functional interfaces: Predicate<T,U>,
    Function<T,U>, and Consumer<T,U>. There are also BiFunction variants returning
    the three relevant primitive types: IntBiFunction<T,U>, LongBiFunction<T,U>, and
    DoubleBiFunction<T,U>. There are two-argument versions of Consumer that take one
    primitive: ObjIntConsumer<T>, ObjLongConsumer<T>, and ObjDoubleConsumer<T>. In
    total, there are nine two-argument versions of the interfaces.


