    Looking at the lambda-based operation enum, you might think constant-specific
    method bodies have outlived usefulness, but this is not the case. Unlike methods
    and classes, lambdas lack names and documentation; if a compilation isn''t self-explanatory,
    or exceeds a few lines, don''t put it in a lambda. One line is ideal for a lambda,
    and three lines are a reasonable maximum. If you violate this rule, it can cause
    serious harm to the readability of your programs. If a lambda is long or difficult
    to read, either find a way to simplify it or refactor your program elements. The
    arguments passed to enum constructors are evaluated in a static context. Thus,
    lambdas in enum constructors can''t access members of the enum. Constant-specific
    class bodies are still the way to go if an enum type has constant-specific behavior
    that is difficult to understand, that that can be implemented in a few lines,
    or which requires access to instance fields or methods.


    Likewise, you might think that anonymous classes are obsolete in the era of lambdas.
    This is closer to the truth, but there are a few things you can do with anonymous
    classes that you can t do with lambdas. Lambdas are limited to functional interfaces.
    If you want to create an instance of an abstract class, you can do it with anonymous
    classes to create instances of interfaces with multiple abstract methods. Finally,
    a lambda cannot obtain a reference to ''this''. In a lambda, the ''this'' keyword
    refers to the enclosing class, not the lambda. Similarly, you can use anonymous
    classes with an anonymous class, but not a lambda. In an anonymous class, ''this''
    refers to the anonymous class. If you need to access the function object within
    its body, you must use an anonymous class.


    Lambdas with anonymous classes have the property that you can reliably serialize
    and deserialize them across implementations. Therefore, you should rarely if,
    serialize an anonymous class instance. If you have a function object that you
    want to make serializable, use a Comparator, use an instance of a private static
    nested class (Item 24).


