  md: "# Item 3: Enforce the singleton property with a private constructor or an enum\
    \ type\n\n**Singleton** is simply a class that is instantiated exactly once (Gamma05).\
    \ Singletons typically represent either a stateless object such as a function\
    \ (Item 24) or a system component that is intrinsically unique. **Making a class\
    \ a singleton can make it difficult to test its clients** because it's impossible\
    \ to substitute a mock implementation for a singleton unless it implements an\
    \ interface that serves as its type.\n\nThere are two common ways to implement\
    \ singletons. Both are based on keeping the constructor private and exporting\
    \ a public static member to provide access to the instance. In one approach, the\
    \ member is a final:\n\n```\n// Singleton with public final field\npublic class\
    \ Elvis {\n    public static final Elvis INSTANCE = new Elvis();\n    private\
    \ Elvis() { ... }\n\n    public void leaveTheBuilding() { ... }\n}\n```\n\nThe\
    \ private constructor is called only once, to initialize the static final field\
    \ Elvis.INSTANCE. The lack of a public or protected constructor guarantees a \"\
    monolithic\" universe: exactly one Elvis instance will exist the Elvis class initialized—no\
    \ more, no less. That nothing a client can change this, with one caveat: a privileged\
    \ client can invoke the private constructor reflectively (Item 65) with the aid\
    \ of the AccessibleObject.setAccessible method. If you need to defend against\
    \ this attack, modify the constructor to throw an exception if it's asked to create\
    \ a second instance.\n\nIn the second approach to implementing singletons, the\
    \ public member is a static method:\n\n```\n// Singleton with static factory\n\
    public class Elvis {\n    private static final Elvis INSTANCE = new Elvis();\n\
    \    private Elvis() { ... }\n    public static Elvis getInstance() { return INSTANCE;\
    \ }\n\n    public void leaveTheBuilding() { ... }\n}\n```\n\nAll calls to Elvis.getInstance\
    \ return the same object reference, and no other Elvis instance will ever be created\
    \ (with the same caveat mentioned earlier)."
