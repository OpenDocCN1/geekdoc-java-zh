  md: "So how do you decide what protected members to expose when you design a class\
    \ for inheritance? Unfortunately, there is no magic bullet. The best you can do\
    \ is think hard, take your best guess, and then test it by writing subclasses.\
    \ You should expose as few protected members as possible because each one represents\
    \ a commitment to an implementation detail. On the other hand, you must not expose\
    \ too few because a missing protected member can render a class practically unusable\
    \ for inheritance.\n\n# The only way to test a class designed for inheritance\
    \ is to write subclasses.\n\nIf you omit a crucial member, trying to write a subclass\
    \ will make the omission painfully obvious. Conversely, if several subclasses\
    \ are written and none uses a protected member, you should probably make it. Experience\
    \ shows that three subclasses are usually insufficient to test an extendable class.\
    \ One or more\n\nWhen you design for inheritance a class that is likely to achieve\
    \ use, realize that you are forcing the self-use patterns that you document and\
    \ the implementation decisions conflict in its protected methods and fields. These\
    \ comments can make it difficult or impossible to improve the performance or functionality\
    \ of the class in a subsequent release. Therefore, you must test your class by\
    \ writing subclasses before you release it.\n\nAlso, note that the special documentation\
    \ required for inheritance clut up normal documentation, which is designed for\
    \ programmers who create instances of your class and invoke methods on them. As\
    \ of writing, there is little in the way of tools to properly extract API documentation\
    \ from information of interest only to programmers implement-classes.\n\n# Constructors\
    \ must not override methods, directly or indirectly.\n\nIf you violate this rule,\
    \ program failure will result. The subclass constructor runs before the base constructor,\
    \ so the overriding method in the subclass will get invoked before the subclass\
    \ constructor runs. If the overriding method depends on any initialization it\
    \ not behave as expected. To make this concrete, here's a class that violates\
    \ this rule:\n\n```\npublic class Super {\n    // Broken constructor invokes an\
    \ overrideable method\n    public Super() {\n        overrideMe();\n    }\n  \
    \  public void overrideMe() { }\n}\n```"
