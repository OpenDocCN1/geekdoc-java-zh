    \ 8, 100, 0, 35, 27);\n```\n\nThis constructor invocation will require many parameters\
    \ that you don't want to set, but you're forced to pass a value for them anyway.\
    \ In this case, you passed a value of 0 for fat. With \"only\" six parameters\
    \ this may not seem so bad, but it quickly gets out of hand as the number of parameters\
    \ increases.\n\nIn short, the telescoping constructor pattern works, but it is\
    \ hard to write clean code when there are many parameters, and harder to read\
    \ it. The reader is left wondering what all values mean and must carefully count\
    \ parameters to avoid subtle bugs. If the client accidentally reverses two parameters,\
    \ the compiler will not complain, but the program will misbehave (Item 5).\n\n\
    A second alternative when you're faced with many optional parameters in a constructor\
    \ is the JavaBean pattern, in which you use a parameterless constructor to create\
    \ the object and then call setter methods to set each required parameter and optional\
    \ parameter of interest:\n\n```\n// JavaBeans Pattern - allows inconsistency,\
    \ mandates mutability\npublic class NutritionFacts {\n    // Parameters initialized\
    \ to default values (if any)\n    private int servingSize = -1; // Required; no\
    \ default value\n    private int servings = -1; // Required; no default value\n\
    \    private int calories = 0;\n    private int fat = 0;\n    private int sodium\
    \ = 0;\n    private int carbohydrate = 0;\n\n    public NutritionFacts() { }\n\
    ```"
