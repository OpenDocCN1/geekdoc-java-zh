    Type parameters usually consist of a single letter. Most commonly it is one of
    these: T for arbitrary type, E for the element type of a collection, K and V for
    the key and values of a map, and X for an exception. The return type of a function
    is usually K. A sequence of arbitrary types can be T, U or T1, T2, T3.


