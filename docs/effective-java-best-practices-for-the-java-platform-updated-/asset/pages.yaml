  md: "# Item 77: Don’t ignore exceptions\n\nWhile this advice may seem obvious, it\
    \ is violated often enough that it bears repeating. When the designers of an API\
    \ declare a method to throw an exception, they are trying to tell you something.\
    \ Don't ignore it! It is easy to ignore exceptions by surrounding a method invocation\
    \ with a try statement which catch block is empty:\n\n```\n// Empty catch block\
    \ ignores exception - Highly suspect!\ntry {\n    catch (SomeException e) {\n\
    \    }\n}\n```\n\nAn empty catch block defeats the purpose of exceptions, which\
    \ is to force you to handle exceptional conditions. Ignoring an exception is analogous\
    \ to ignoring a fire alarm and turning it off so no one gets to see if there's\
    \ a real fire. You may get away with it, or the results may be disastrous. Whenever\
    \ you see an empty catch block, bells should go off in your head.\n\nThere are\
    \ situations where it is appropriate to ignore an exception. For example, it might\
    \ be appropriate when closing a FileInputStream. You haven't changed the state\
    \ of the file, so there's no need to perform any recovery action, and you've already\
    \ read the information that you need from the file, so there's no reason to abort\
    \ the operation in progress. It may be wise to ignore the exception, so that you\
    \ can investigate the matter if these exceptions happen often. If you choose to\
    \ ignore an exception, the catch block should contain a comment explaining why\
    \ it is appropriate and the variable should be named ignored:\n\n```\nFuture<Integer>\
