    This book uses a few technical terms that are not defined in The Java Language
    Specification. (The term exported API, or simply API, refers to the classes, interfaces,
    constructors, members, and serialized forms by which a programmer accesses a class,
    interface, or package. The term API, which is short for application programming
    interface, is used in preference to the otherwise preferable term to avoid confusion
    with the language construct of name.) A programmer who writes a program that uses
    an API is referred to as a user of the API. A class whose implementation uses
    an API is a client of the API.


    Classes, interfaces, constructors, members. Exported API elements and serialized
    forms are collectively known as API elements. An exported API consists of the
    API elements that are accessible outside of the package that defines the API.
    These are the API elements that any client can use and the other of the API clients
    support. Not coincidentally, they are also the elements for which the Javadoc
    utility generates default documentation. Roughly speaking, the exported API of
    a package consists of the public and protected members and constructors of every
    public class or interface in the package.


    In Java 9, a module system was added to the platform. If a library makes use of
    the module system, its exported API is the union of the exported APIs of all the
    packages exported by the library''s module declaration.'
