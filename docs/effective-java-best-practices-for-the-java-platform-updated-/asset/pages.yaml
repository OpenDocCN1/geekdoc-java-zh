    \ (which is Elvis.INSTANCE)\n    Elvis elvis = Elvis.deserialize(serializedForm);\n\
    \    impersonator = ElvisStealer.impersonator;\n\n    elvis.printFavorites();\n\
    \    impersonator.printFavorites();\n}\n```"
