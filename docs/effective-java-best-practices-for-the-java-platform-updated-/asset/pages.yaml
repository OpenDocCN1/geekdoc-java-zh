  md: '# Item 17: Minimize mutability


    An immutable class is simply a class whose instances cannot be modified. All of
    the information contained in each instance is fixed for the lifetime of the object,
    so no changes can ever be observed. The Java platform libraries contain many immutable
    classes, including String, the boxed primitive classes, and BigInteger and BigDecimal.
    There are many good reasons for this: Immutable classes are easier to design,
    implement, and use than mutable classes. They are less prone to error and more
    secure.


    To make a class immutable, follow these rules:


    +   1. Don''t provide methods that modify the object''s state (known as mutators).

    2. Ensure that the class can''t be extended. This prevents careless or malicious
    subclasses from compromising the immutable behavior of the class by behaving as
    if the object''s state has changed. Preventing subclassing is generally accomplished
    by making the class final, but there is an alternative that we''ll discuss later.

    3. Make all fields final. This expresses your intent in a manner that is enforced
    by the system. It is also necessary to ensure correct behavior if a reference
    to a newly created instance is passed from one thread to another without synchronization,
    as spelled out in the memory model [JLS, 17:5; Goetz06].

    4. Make all fields private. This prevents clients from obtaining access to mutable
    objects referred to by fields and modifying these objects directly. While it is
    technically permissible for immutable classes to have public fields containing
    primitive values or references to immutable objects, it is not recommended because
    it changes the internal representation in a later release (Items 15 and 16).

    5. Ensure exclusive access to any mutable components. If your class has fields
    that refer to mutable objects, ensure that clients of the class cannot obtain
    references to these objects. Never initialize such a field to a client-provided
    object reference or return the field from an accessor. Make defensive copies (Item
    50) in constructors, accessors, and readObject methods (Item 88).


    Many of the example classes in previous items are immutable. One such class is
    PhoneNumber in Item 11, which has accessors for each attribute but no corresponding
    mutators. Here is a slightly more complex example:'
