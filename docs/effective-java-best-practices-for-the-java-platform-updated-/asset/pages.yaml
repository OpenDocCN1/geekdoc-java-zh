  md: "# ITEM 1: CONSIDER STATIC FACTORY METHODS INSTEAD OF CONSTRUCTORS\n\nconstructors\
    \ do, so it can be difficult to figure out how to instantiate a class that provides\
    \ static factory methods instead of constructors. The Javadoc tool may draw attention\
    \ to static factory methods. In the meantime, you can reduce this problem by drawing\
    \ attention to static factories in class or interface documentation and by adhering\
    \ to common naming conventions. Here are some common names for static factory\
    \ methods. This list is far from exhaustive:\n\n+   - A type-conversion method\
    \ that takes a single parameter and returns a corresponding instance of this type,\
    \ for example:\n  - Date d = Date(instant)\n\n+   - An aggregation method that\
    \ takes multiple parameters and returns an instance of this type that, for example:\n\
    \  - Set<Card> cards = EnumSet.of(JACK, QUEEN, KING);\n\n+   - valueOf—A more\
    \ verbose alternative to fron and of, for example:\n  - BigInteger prime = BigInteger.valueOf(Integer.MAX_VALUE);\n\
    \n+   - instance or getInstance—Returns an instance that is described by its parameters\
    \ (if any) cannot be said to have the same value, for example:\n  - StackWalker\
    \ luke = StackWalker.getInstance(options)\n\n+   - create or newInstance—Like\
    \ instance or getInstance, except that the method guarantees that each returns\
    \ a new instance, for example:\n  - Object newArray = Array.newInstance(classObject,\
    \ arrayLen)\n\n+   - getType—Like get, but used if the factory method is in a\
    \ different class. Type is the type of object returned by the factory method,\
    \ for example:\n  - FileStore fs = Files.getFileStore(path)\n\n+   - newType—Like\
    \ new, but used if the factory method is in a different class. Type is the type\
    \ of object returned by the factory method, for example:\n  - BufferedReader br\
    \ = Files.newBufferedReader(path)\n\n+   - type—A concise alternative to getType\
    \ and newType, for example:\n  - List<Complaint> litany = Collections.list(legacyLithany);\n\
    \nIn summary, static factory methods and public constructors have their uses,\
    \ and it pays to understand their relative merits. Often static factories are\
    \ preferable, so avoid the reflex to provide public constructors without first\
    \ considering static factories."
