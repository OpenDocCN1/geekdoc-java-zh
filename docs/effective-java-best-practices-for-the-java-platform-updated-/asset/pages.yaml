  md: "# Item 32: Combine generics and varags judiciously\n\nVarargs methods (Item\
    \ 53) were both added to the platform in Java 5, so you might expect them to interact\
    \ gracefully; sadly, they do not. The purpose of varargs is to allow clients to\
    \ pass a variable number of arguments to a method, but an array, is a loose abstraction;\
    \ when you invoke a varargs method, an array is created to hold the varargs parameters;\
    \ that, which should be an implementation detail, is visible. As a consequence,\
    \ you get confusing compiler warnings when varargs parameters have generic or\
    \ parametrized types.\n\nRecall from Item 28 that a non-refifiable type is one\
    \ whose runtime representation has less information than its compile-time representation,\
    \ and nearly all generic and parametrized types are non-refifiable. If a method\
    \ declares its varargs parameter to be a non-refifiable type, the compiler generates\
    \ a warning on the declaration. If the method is invoked on varargs parameters\
    \ of inferred type, the compiler generates a warning whose inferred type is non-refifiable.\
    \ The warning looks something like this:\n\n```\nwarning: [unchecked] Possible\
    \ heap pollution from\nparameterized varags type List<String>\",n\nHeap pollution\n\
    Heap pollution occurs when a variable of a parametrized type refers to an objectnthat\
    \ is not of that type (JLS, §4.12.2). It can cause the compiler's automatically\
    \ generated casts to fail, violating the fundamental guarantee of the generic\
    \ type system.\nFor example, consider this method, which is a thinly discussed\
    \ variant of the\ncode fragment on page 127:\n```java// Mixing generics and varags\
    \ can violate type safety!\nstatic void dangerous(List<String> list, String...\
    \ stringLists) {\n    List<Integer> integers = list.asList(42);\n    Object[]\
    \ objects = stringLists; // Heap pollution\n    objects[0] = int; // ClassCastException\n\
    \    String s = stringLists[0].get(0);\n}\n```\n```\n\nThis method has no casts\
    \ yet throws a ClassCastException when invoked with one or more arguments. Its\
    \ last line has an unsafe cast that is generated by the compiler. This cast fails,\
    \ demonstrating that type safety has been compromised, and it is unsafe to store\
    \ a value in a generic varargs array parameter.\",\n\nThis example raises an interesting\
    \ question: Why is it even legal to declare a method with a generic varags parameter,\
    \ when it is illegal to create a generic array explicitly? In other words, why\
    \ does the method shown previously generate only a warning, while the code fragment\
    \ on page 127 generates an error? The"
  merge: -1
  pgno: 166
- img_proc: true
  md: "answer is that methods with varargs parameters of generic or parameterized\
    \ types can be very useful in practice, so the language designers opted to live\
    \ with this inconsistency. In fact, the Java libraries export several methods,\
    \ including Arrays.asList(T...), Collections.addAll(Collection<? extends T> elements),\
    \ and EnumSet.of(first,...). Unlike the dangerous method shown earlier, these\
    \ library methods are typed.\n\nPrior to Java 7, there was no way for the author\
    \ of a method with generic varargs to do about the warnings at the call site.\
    \ This made APIs useless. Users had to put up with the warnings or, preferably,\
    \ to eliminate them with @SuppressWarnings(\"unchecked\") annotations at each\
    \ call site (Item 27). This was tedious, hindered readability, and hid warnings\
    \ that flagged real issues.\n\nIn Java 7, the SafeVarargs annotation was added\
    \ to the platform, to allow the author of a method with generic varargs parameter\
    \ to suppress client warnings automatically. In essence, the SafeVarargs annotation\
    \ constitutes a promise by the author that it is typed. In exchange for this promise,\
    \ the compiler does not warn the users of the method that may be unsafe.\n\nIt\
    \ is critical that you do not annotate a method with @SafeVarargs unless it is\
    \ actually safe. So what does it take to ensure this? Recall that a generic array\
    \ is created when the method is invoked, to hold the varargs parameters. If the\
    \ method doesn't store anything into the array (which would overwrite the parameters)\
    \ and doesn't allow a reference to the array to escape (which would enable untrusted\
    \ access to the array), then it's safe. In other words, if the varargs array is\
    \ only used to transmit the number of arguments from the caller to the method—which\
    \ is, after all, the purpose of varargs—then the method is safe.\n\nIt is worth\
    \ noting that you can violate type safety without ever anything in the varargs\
    \ array. Consider the following generic method which returns an array. At first\
    \ glance, it may look like a handy utility:\n\n```\n// UNSAFE <T> T[] toArray(T...\
    \ args) {\n    return args;\n}\n```\n\nThis simply returns its varargs parameter\
    \ array. The method may not look dangerous, but it is! The type of this array\
    \ is determined by the compile-time types of the arguments passed to the method,\
    \ and the compiler may not have enough information to make an accurate determination.\
    \ Because this method returns its varargs parameter array, it can propagate heap\
    \ pollution up the call stack."
