  md: "# ITEM 33: CONSIDER TYPESAFE HETEROGENEOUS CONTAINERS\n\nThe argument, annotationType,\
    \ is a bounded type token representing an annotation type. The method returns\
    \ the element's annotation of that type, if it has one, null, if it doesn't. In\
    \ essence, an annotated element is a typesafe heterogeneous container whose keys\
    \ are annotation types.\n\nSuppose you have an object of type Class<?> and you\
    \ want to pass it to a method that requires a bounded type token, such as getAnnotation.\
    \ You could cast the object to Class<? extends Annotations>, but this cast is\
    \ unchecked, so it would generate a compile-time warning (Item 27). Luckily, Class\
    \ provides an instance method that performs this cast (safe and dynamically).\
    \ And it casts the object on which it is called to represent a subclass of the\
    \ class by its argument. If it succeeds, the method returns its argument; if it\
    \ fails, throws a ClassCastException.\n\nHere's how you use the asSubclass method\
    \ to read an annotation whose type is unknown at compile-time, completes without\
    \ error or warning:\n\n```\n// Use of asSubclass to safely cast to a bounded type\
    \ token\n```\n\n```\nstatic Annotation getAnnotation(AnnotatedElement element,\n\
    \    Class<?> annotationType, String annotationTypeName) {\n    try {\n      \
    \  annotationType = Class.forName(annotationTypeName);\n    } catch (Exception\
    \ ex) {\n        throw new IllegalArgumentException(ex);\n    }\n    return element.getAnnotation(\n\
    \        annotationType.asSubClass(Annotation.class));\n}\n```\n\nIn summary,\
    \ the normal use of generics, exemplified by the collections APIs, restricts you\
    \ to a fixed number of type parameters per container. You can get around this\
    \ by by placing the type parameter on the key rather than the container. You can\
    \ use Class objects as keys for such typesafe heterogeneous containers. A Class\
    \ object used in this fashion is called a type token. You can also use a custom\
    \ key type. For example, you could have a databaseRow now representing a database\
    \ row (the container), and a generic type Column<T> as its key."
