  md: '# CHAPTER 9 GENERAL PROGRAMMING


    While this program is a toy, the technique it demonstrates is quite powerful.
    The toy program could easily be turned into a generic set tester that validates
    the specified Set implementation by aggressively manipulating one or more instances
    and checking that they obey the Set contract. Similarly, it could be turned into
    a generic performance analysis tool. In fact, this technique is sufficiently powerful
    to implement fullyblown service provider framework (item 1). This is all that
    you need in the way of reflection.


    This example demonstrates two disadvantages of reflection. First, the example
    can generate compile-time errors if reflective instantiation were not used. (For
    you, you can cause the program to generate each of the exceptions by passing in
    appropriate command line arguments.) The second disadvantage is that it takes
    twenty-five lines of tedious code to generate an instance of the class from its
    name, whereas a constructor invocation would fit neatly on a single line. The
    length could be reduced by catching ReflectiveException, a superclass of which
    is indistinguishable from any other exception. In a real program, the great bulk
    of the code is unaffected by this limited use of reflection.


    If you compile this program, you''ll get an unchecked cast warning. This warning
    is legitimate, that the cast to Class<? extends Set<String>> will succeed even
    if the program throws a ClassCastException when it instantiates the class. The
    warning is legitimate if the class name is not a Set implementation.


    A legitimate, use of reflection is to manage a class''s dependencies on other
    classes, methods, or fields that may be absent at runtime. This can be useful
    if you are writing a package that must run multiple versions of some other package.


    In summary, reflection is a powerful facility that is required for certain system
    programming tasks, but it has many disadvantages. If you are writing a program
    that has to work with classes unknown at compile time, you should if possible,
    use reflection only to instantiate objects, and access the objects using some
    interface or superclass that is known at compile time.'
