  md: 'The resulting method compiles cleanly and minimizes the scope in which unchecked
    warnings are suppressed.


    **Every time you use a @SuppressWarnings("unchecked") add a comment saying why
    it is safe to do so.** This will help others understand the code, and more importantly,
    it will decrease the odds that someone will modify the code, keep so as to make
    the computation unsafe. If you find it hard to write such a comment, keep thinking.
    You may end up figuring out that the unchecked operation isn''t safe after all.


    In summary, unchecked warnings are important. Don''t ignore them. Every unchecked
    warning represents the potential for a ClassCastException at runtime. Do your
    best to eliminate these warnings. If you can''t eliminate an unchecked warning
    and you can prove that the code provoked it is typesafe, suppress the warning
    with a @SuppressWarnings("unchecked") annotation in the narrow possible scope.
    Record the rationale for your decision to suppress the warning in a comment.'
