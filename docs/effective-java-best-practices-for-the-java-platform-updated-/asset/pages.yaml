  md: '# Preface to the Second Edition


    A lot has happened to the Java platform since I wrote the first edition of this
    book in 2001, and it''s high time for a second edition. The most significant set
    of changes was the addition of generics, enum types, annotations, autoboxing,
    and the for-each loop in Java 5. A close second was the addition of the new concurrency
    library, java.concurrent, also released in Java 5. With Gilad Bracha, I had the
    fortune to lead the teams that designed the new language features. I also had
    the good fortune to work with the team that designed and developed the concurrency
    library, which was led by Doug Lea.


    The other big change in the platform is the widespread adoption of modern Integrated
    Development Environments (IDEs), such as Eclipse, IntelliJ IDEA, and NetBeans,
    and of static analysis tools, as FindBugs. While I have not invested myself in
    these, I benefited from them and learned how they affect the Java development
    experience.


    In 2004, I moved from Google, but I continued my involvement in the development
    of the Java platform over the past four years, contributing to the concurrency
    and collections APIs through the good offices of Google and the Community Process.
    I also had the pleasure of using the Java platform to develop libraries within
    Google. Now I know what it feels like to be a user.


    As was the case in 2001 when I wrote the first edition, my primary goal is to
    share my experience with you that you can imitate my successes while avoiding
    my failures. The new material contains a liberal use of real-world examples from
    the Java platform.


    The first edition exceeded my wildest expectations, and I''ve done my best to
    stay true to it while covering all of the new material that was required to bring
    the book up to date. It was inevitable that the book would grow, and grow it,
    from forty-seven items to seventy-eight. Not only did I add twenty-three items,
    but I thoroughly revised all the original and retired a few items whose better
    days had passed. In the Appendix, you can see how the material in this edition
    relates to the material in the first edition.


    In the Preface to the First Edition, I wrote that the Java programming language
    and its libraries were immensely conducive to quality and productivity, and a
    joy to work with. The changes in releases could have taken a good thing and made
    it better. The platform is much bigger now than was in 2001 and more complex,
    but once you learn the patterns and idioms for using the new features, you make
    your programs better and your life easier. I hope this edition captures your contin-'
  merge: -1
