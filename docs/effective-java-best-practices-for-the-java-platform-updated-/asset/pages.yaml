  md: "# CHAPTER 6 ENUMS AND ANNOTATIONS\n\nWhat you really want is to be forced to\
    \ choose an overtime pay strategy each time you add an enum constant. Luckily,\
    \ there is a nice way to achieve this. The idea is to move the pay computation\
    \ into a private nested enum, and to pass an instance of this strategy enum to\
    \ the constructor for the Payroll1Day enum. The Payroll1Day then delegates the\
    \ overtime calculation to the strategy enum, eliminating the need for a switch\
    \ statement or constant-specific method implementation in Payroll1Day. While this\
    \ pattern is less concise than the switch statement, it is safer and more flexible.\n\
    \n```\n// The strategy enum pattern\nenum Payroll1Day {\n    MONDAY, TUESDAY,\
    \ WEDNESDAY, THURSDAY, FRIDAY,\n    SATURDAY(PayType.WEEKEND), SUNDAY(PayType.WEEKEND);\n\
    \n    private final PayType type;\n\n    Payroll1Day(PayType type) { this.type\
    \ = type;\n    Payroll1Day() { this(PayType.WEEKEND); } // Default\n\n    int\
    \ pay(int minutesWorked, int payRate) {\n        return type.pay(minutesWorked,\
    \ payRate);\n}\n```\n\n```\n// The strategy enum type\nprivate enum enum PayType\
    \ {\n    WEEKDAY {\n        int overtimePay(int minsWorked, int payRate) {\n \
    \           return minutesWorked << MINS_PER_SHIFT ? 0 :\n                (minutesWorked\
    \ - MINS_PER_SHIFT) * payRate / 2;\n        }\n    },\n    WEEKEND {\n       \
    \ int overtimePay(int minutesWorked, int payRate) {\n            return minutesWorked\
    \ * payRate / 2;\n        }\n    }\n}\n```\n\n```\nabstract int overtimePay(int\
    \ minsWorked, int payRate);\nprivate static final int MIN_PER_SHIFT = 8 * 60;\n\
    \nint pay(int minutesWorked, int payRate) {\n    int basePay = minutesWorked +\
    \ payRate;\n    return basePay + overtimePay(minutesWorked, payRate);\n}\n```"
