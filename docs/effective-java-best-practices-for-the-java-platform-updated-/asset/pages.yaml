  md: "# Item 83: Use lazy initialization judiciously\n\n**Lazy initialization** is\
    \ the act of delaying the initialization of a field until its value is needed.\
    \ If the value is never needed, the field is never initialized. This technique\
    \ is applicable to both static and instance fields. While lazy initialization\
    \ is primarily for optimization, it can also be used to break harmful circularities\
    \ in class and instance initialization [Bloch/Effective 51].\n\nAs is the case\
    \ for most optimizations, the best advice for lazy initialization is \"don't do\
    \ it unless you need to\" (Item 67). Lazy initialization is a double-edged sword.\
    \ It decreases the cost of initializing a class or creating an instance, at the\
    \ expense of increasing the cost of accessing the initialized field. Depending\
    \ on what fraction of fields eventually initialize, how often each is accessed\
    \ once initialized, lazy initialization (like many \"optimizations\") actually\
    \ harm performance.\n\nThat said, lazy initialization has its uses. If a field\
    \ is accessed only on a fraction of the instances of a class and it is costly\
    \ to initialize the field, then lazy initialization may be worthwhile. The only\
    \ way to know for sure is to measure the performance of the class without lazy\
    \ initialization.\n\nIn the presence of multiple threads, lazy initialization\
    \ is tricky. If two or more threads share a lazily initialized field, it is critical\
    \ that some form of synchronization is employed, or severe bugs can result (Item\
    \ 78). All of the synchronization techniques discussed in this item are thread-safe.\n\
    \n**Under circumstances, normal initialization is preferable to lazy initialization.**\
    \ This is a typical declaration for a normally initialized instance field. Note\
    \ the use of the `final` modifier (Item 17).\n\n```\n// Normal initialization\
    \ of instance field\nprivate FieldType field = computeFieldValue();\n```\n\n**If\
    \ you use lazy initialization to break an initialization circularity, use a synchronized\
    \ accessor because it is the simplest, clearest alternative:**\n\n```\n// Lazy\
    \ initialization of instance field - synchronized accessor\nprivate FieldType\
    \ field;\n\nsynchronized FieldType getField() {\n    if (field == null) {\n  \
    \      field = computeFieldValue();\n    }\n    return field;\n}\n```"
