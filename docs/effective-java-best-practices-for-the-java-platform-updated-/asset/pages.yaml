    depend on hashing, a class that violates compareTo contract can break other classes
    that depend on comparison. Classes that depend on comparison include the sorted
    collections TreeSet and TreeMap and the utility Collections and Arrays, which
    contain searching and sorting algorithms.


    Let''s go over the provision of the compareTo contract. The first provision says
    that if you reverse the direction of a comparison between two object references,
    the expected first object is less than the second, then the second must be greater
    than the first; if the first is equal to the second, then the second must be equal
    to the first; and if the first is greater than the second, then the second must
    be less than the first. The second provision says that if one object is greater
    than a second and the second is greater than a third, then the first must be greater
    than the third. The final provision says that all objects that compare as equal
    must yield the same results when compared to any other object.'
