    fields will be ignored. If the earlier version''s readObject method failed to
    invoke defaultReadObject, deserialization would fail with a SerialCorruptedException.


    Note that there is a documentation comment on the writeObject method, even though
    it is private. This is analogous to the comment on the private fields in the Name
    class. This private method defines a public API which is the serialized form,
    and thus API should be documented. Use the @serialData tag for methods the Javadoc
    utility to place this documentation on the serialized forms.


    To lead some sense of scale to earlier performance discussion, the average string
    length is ten characters, the serialized form of the revised version of StringList
    contains about half much as the serialized form of the original. On my machine,
    serializing the revised version of StringList is over twice as fast as serializing
    the original version, with a list length of ten. Finally, there is no stack overflow
    problem in the revised form and no practical upper limit to the size of StringList
    that can be serialized.


    While the default serialized form would be bad for StringList, there are classes
    for which it would be for. For StringList, the default serialized form is inflexible
    and performs badly, but it is correct in the sense that serializing and deserializing
    a StringList instance yields a faithful copy of the original object with all of
    its invariants. This is not the case for any object whose invariants are tied
    to implementation-specific details.


    For example, consider the case of a hash table. The physical representation is
    a sequence of hash buckets containing key-value entries. The bucket that an entry
