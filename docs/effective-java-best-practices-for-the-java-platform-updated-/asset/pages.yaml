  md: 'thing out of the ordinary, you can use the ThreadPoolExecutor clearly.

    This class lets you configure nearly every aspect of a thread pool''s operation.


    Choosing the executor service for a particular application can be tricky. For
    a small program, or a heavily loaded server, Executors.newCachedThreadPool is
    generally a good choice because it demands no configuration and generally "does
    the right thing." But a cached pool is not a good choice for a heavily loaded
    production server. In a cached pool, submitted tasks are not queued but immediately
    handed off to a thread for execution. If no threads are available, a new one is
    created. If a server is so loaded that all of its CPUs are fully utilized and
    more tasks arrive, more threads will be created, which will only make tasks worse.
    In a heavily loaded production server, you are much better off using Executors.newFixedThreadPool
    class directly, for maximum control.


    Not only should you refrain writing your own queues, but you should generally
    refrain from working directly with threads. When you work directly with threads,
    a Thread serves as both a unit of work and the mechanism for executing it. In
    the executor framework, the unit of work and the execution mechanism are separate.
    The key abstraction is the unit of work, which is the task.

    There are two kinds of tasks: Runnable and its cousin, Callable (which is like
    Runnable, except that it returns a value and can throw arbitrary exceptions).

    The general mechanism for executing tasks is the executor service. You gain the
    flexibility to select an appropriate execution policy to meet your needs and to
    change the policy if your needs change. In essence, the Executor Framework provides
    for execution what the Collections Framework did for aggregation.


    In Java 7, the Executor Framework was extended to support fork-join tasks, which
    are run by a special kind of executor service as a fork-join pool. A fork-join
    task, represented by a ForkJoinTask, may be split into smaller tasks, and the
    threads of a ForkJoinPool not only process these tasks but "steal" from one another
    to ensure that all threads remain busy, resulting in higher CPU utilization, higher
    throughput, and lower latency.

    Writing and tuning fork-join tasks is tricky. Parallel streams (Item 48) are written
    atop fork join pools and allow you to take advantage of their performance benefits
    with little effort, assuming they are appropriate for the task at hand.


    A complete treatment of the Executor Framework is beyond the scope of this book,
    but the interested reader is directed to Java Concurrency in Practice [Goetz06].'
