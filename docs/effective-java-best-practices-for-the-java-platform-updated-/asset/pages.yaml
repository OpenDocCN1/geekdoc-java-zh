    \ of the classes by declaring them private (Item 15). Here is how our example\
    \ looks with static member classes:\n\n# // Static member classes instead of multiple\
    \ top-level classes\n\n```\npublic class Test {\n    public static void main(String[]\
    \ args) {\n        System.out.println(Utensil.NAME + Dessert.NAME);\n    }\n\n\
    \    private static class Utensil {\n        static final String NAME = \"pan\"\
    ;\n    }\n\n    private static class Dessert {\n        static final String NAME\
    \ = \"cake\";\n    }\n}\n```\n\nThe lesson is clear: Never put multiple top-level\
