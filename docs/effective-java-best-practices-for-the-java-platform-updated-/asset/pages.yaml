  md: '# Item 45: USE STREAMS JUDICIOUSLY


    The streams API was added in Java 8 to ease the task of performing bulk operations,
    sequentially or in parallel. This API provides two key abstractions: the *stream*,
    which represents a finite or infinite sequence of data elements, and the *pipeline*,
    which represents a multipass computation on these elements. Common sources include
    collections, arrays, files, regular expression pattern match, random number generators,
    and other streams. The data elements in a stream can be objects or primitive values.
    Three primitive types are supported: *int*, *long*, and *double*.


    A stream pipeline consists of a source stream followed by terminal operations.
    Each intermediate operation transforms the stream, such as mapping each element
    to a function of that element or filtering out all elements that do not satisfy
    some condition. Intermediate operations transform one stream into another, whose
    element type may be the same as the input stream or different from it. The terminal
    operation performs a computation on the stream resulting from the last intermediate
    operation, such as storing elements into a collection, returning a result, or
    printing all of them.


    Stream pipelines are lazy; evaluation doesn''t start until the terminal operation
    is invoked, and data elements aren''t required in order. This lazy evaluation
    makes it possible to work with infinite streams. A stream pipeline without a terminal
    operation cannot operate, so don''t forget to include one.


    The streams API is fluent; it''s designed to allow all of the clauses that comprise
    a pipeline to be chained into a single expression. In fact, multiple pipelines
    can be chained together into a single expression.


    By default, streams run sequentially. Making a pipeline in parallel is as simple
    as invoking the `parallel()` method on any stream in the pipeline, but it is seldom
    appropriate to do (see Item 48).


    Streams are so versatile that practically any computation can be performed using
    streams, but just because you doesn''t mean you should. When used appropriately,
    streams can make programs shorter and clearer; when used inappropriately, they
    can make programs difficult to read and maintain. There are no hard and rules
    for when to use streams, but there are heuristics.


