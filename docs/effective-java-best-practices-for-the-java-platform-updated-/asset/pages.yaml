  md: '# ITEM 85: PREFER ALTERNATIVES TO JAVA SERIALIZATION


    The object graph consists of 201 HashSet instances, each of which contains 3 or
    fewer object references. The entire stream is 5,744 bytes long, yet the sun would
    out long before you could deserialize it. The problem is that deserializing a
    HashSet instance requires computing the hash codes of its elements. 2 elements
    of the root are themselves sets containing 2 hash-sets, each of 2 hash-elements,
    and so on, 100 levels deep. Therefore deserializing causes the hashCode method
    to be invoked over 2^∞ times. Other than the fact that the deserialization is
    taking forever, the deserializer has no indication that anything is amiss. Few
    objects are produced, and the stack depth is bounded.


    So what can you defend against these problems? You open yourself to attack when
    you deserialize a byte stream you don''t trust. The best way to avoid serialization
    is to deserialize anything. In the words of the computer named Joshua in the 1983
    movie WarGames, "the only winning move is not to play." There is no reason to
    use Java serialization in any system you write. There are other mechanisms for
    translating objects and byte sequences that avoid many the disadvantages of Java
    serialization, while offering numerous advantages, such as cross-platform support,
    high performance, a large ecosystem of tools, and a community of expertise. In
    this book, we refer to these mechanisms as cross-platform structured-data representations,
    which avoids usage to prevent confusion with Java serialization.


    What do these representations have in common is that they''re far simpler than
    Java serialization. They don''t require automatic serialization and deserialization
    of arbitrary objects. Instead, they support simple, structured-data objects consisting
    of a collection of attribute-value pairs. Only a few primitive and array types
    are supported. This simple abstraction is enough for building extremely powerful
    distributed systems and simple enough to avoid the problems that have plagued
    Java serialization since its inception.


    The leading cross-platform data representations are JSON [JSON] and Protocol Buffers,
    also known as [Protobuf]. Protobuf was designed by Douglas Crock for browser-server
    communication, and protocol buffers were designed by Google for interchanging
    structured data among its services. Even though representations are sometimes
    called language-neutral, JSON was originally developed for JavaScript and protobuf
    for C++; both representations retain vestiges of their origins.


    The most significant differences between JSON and protobuf are that JSON is text-based
    and human-readable, whereas protobuf is binary and substantially more'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# CHAPTER 12 SERIALIZATION


    efficient; and that JSON is exclusively a data representation, whereas protobuf
    offers schemas (types) to document and enforce appropriate usage. Although protobuf
    is more efficient than JSON, JSON is extremely efficient for a text-based representation.
    While protobuf is a binary representation, it provides an alternative text representation
    for use human-readability is preferred (pbtxt).


    If you can''t avoid serialization entirely, perhaps because you''re working in
    the context of a legacy system that requires it, your next alternative is to never
    deserialize untrusted data. In particular, you should never accept RMI traffic
    from untrusted sources. The official secure coding guidelines for Java say "Deserialization
    of untrusted data is inherently dangerous and should be avoided." This sentence
    is set in bold, italics, red type, and it is the only text in the entry document
    that gets this treatment [Java-sec].


    If you can''t avoid serialization and you''re not absolutely certain of the safety
    of the data you''re deserializing, use the object deserialization filtering in
    Java 9 and backported to earlier releases (java.io.ObjectFilter). This lets you
    prefer a filter that is applied to data streams before they are deserialized.
    It operates at class granularity, letting you accept or reject certain classes.
    Accepting classes by blacklisting; rejecting a list of potentially dangerous ones
    is known as blacklisting; rejecting classes by default and accepting a list of
    those that are presumed safe as whitelisting. Prefer whitelisting to blacklisting,
    as blacklisting only protects you against known threats. A tool called SerialWhitelist
    Application Trainer (SWAT) can be used to automatically prepare a whitelist for
    your application (Scheduler16). The filtering facility will also protect you against
    excessive memory usage and excessively deep object graphs,


    Unfortunately, serialization is still pervasive in the Java ecosystem. But it
    will not protect you against serialization bombs like the one shown above.


    In summary, serialization is dangerous and should be avoided. If you are designing
    a system from scratch, use a cross-platform structured-data representation such
    as JSON or protobuf instead. Do not deserialize untrusted data. If you must do
    so, make sure to write a serializable class that is correct, safe, and efficient.
    The remainder of this chapter provides advice on how and when to do this.


    In summary, serialization is dangerous and should be avoided. If you are designing
    a system from scratch, use a cross-platform structured-data representation such
    as JSON or protobuf instead. Do not deserialize untrusted data. If you must do
    so, use object deserialization filtering, but be aware that it is not guaranteed
    to thwart all attacks. Avoid writing serializable classes. If you must do so,
    exercise caution.'
