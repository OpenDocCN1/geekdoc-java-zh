  md: '# Item 36: Use EnumSet instead of bit fields


    If the elements of an enumerated type are used primarily in sets, it is traditional
    to use the int enum pattern (Item 34), assigning a different power of 2 to each
    constant:


    ```

    // Bit field enumeration constants - OBSOLETE!

    public public static final int STYLE_BOLD      = 1 << 0; // 1

    public public static final int STYLE_ITALIC   = 1 << 1; // 2

    public public static final int STYLE_UNDERLINE = 1 << 2; // 4

    public public static final int STYLE_STRIKETHROUGH = 1 << 3; // 8

    ```


    ```

    // Parameter is bitwise OR of zero or no STYLE_ constants

    public void applyStyles(int styles) { ... }


    ```


    This representation lets the bitwise OR operation to combine several constants
    into a set, known as a bit field:


    ```

    text.applyStyles(STYLE_BOLD | STYLE_ITALIC);

    ```


    The bit field representation also lets you perform operations such as union and
    intersection efficiently using bitwise arithmetic. But bit fields have the disadvantages
    of int enum constants and more. It is even harder to interpret a bit field than
    a simple int enum constant when it is printed as a number. There is no easy way
    to iterate over all the elements represented by a bit field. Finally, you have
    to predict the maximum number of bits you''ll ever need at the time you''re writing
    the API and choose a type for the bit field (typically int or long) Once you''ve
    picked a type, you can''t exceed it (32 or 64 bits) without changing the API.


    Some programmers use enums in preference to int constants still clinging to the
    use of bit fields when they need to access sets of constants. There is no reason
    to do this, because a better alternative exists. The java.util package provides
    the EnumSet to efficiently represent sets of values from a single enum type. This
    class implements the Set interface, providing all of the richness, type safety,
    and interoperability with any other Set implementation. Internally each Enum is
    represented as a vector. If the underlying enum type has sixty-four or fewer elements—and
    most do—the entire EnumSet is represented with a single long, so its performance
    is comparable to that of a bit field. Bulk operations, such as removeAll and retainAll,
    are implemented using bit-'
