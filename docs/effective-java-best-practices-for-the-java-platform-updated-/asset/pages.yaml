- img_proc: true
  md: "This code may appear a bit convoluted. In particular, the need for the local\
    \ variable (result) may be unclear. This variable does is to ensure that field\
    \ is read only once in the common case where it's already initialized. While not\
    \ strictly necessary, this may improve performance and is more elegant than the\
    \ standards applied to low-level concurrent programming. On my machine, the method\
    \ above is about 1.4 times as fast as the naive version without a local variable.\n\
    \nWhile you can apply the double-check idiom to static fields as well, there is\
    \ no reason to do so: the lazy initialization holder class idiom is a better choice.\n\
    \nTwo variants of the double-check idiom bear noting. Occasionally, you may need\
    \ to lazily initialize an field that can tolerate repeated initialization. If\
    \ you find yourself in this situation, you can use a variant of the double-check\
    \ idiom that dispenses with the second check. It, not surprisingly, is known as\
    \ the *single-check idiom*. Note that field is still declared `volatile`:\n\n\
    ```\n// Single-check idiom can cause repeated initialization!\nprivate volatile\
    \ Field field;\n\nprivate Field getField() {\n    if (field == null) {\n     \
    \   field = computeFieldValue();\n    }\n    return field;\n}\n```\n\nAll of the\
    \ initialization techniques discussed in this item apply to primitive fields as\
    \ well as of object references. When the double-check or single-check idiom is\
    \ applied to a numerical primitive field, the field's value is checked against\
    \ 0 (the default value for numerical primitive variables) rather than `null`.\n\
    \nIf you don't care whether every thread recalculates the value of a field, and\
    \ the type of the field is a primitive either Long or double, then you may choose\
    \ to remove the `volatile` modifier from the field declaration in the single-check\
    \ idiom. This variant is known as the *r single-check idiom*. It speeds up field\
    \ access on some architectures, at the expense of additional initializations (up\
    \ to one thread that accesses the field). This is definitely an exotic technique,\
    \ not for everyday use.\n\nIn summary, you should initialize fields mostly, not\
    \ lazily. If you must initialize lazily in order to achieve your performance goals\
    \ or to break a harmful initialization circularity, use the appropriate lazy initialization\
    \ technique. For instance fields, it is the double-check idiom; for static fields,\
    \ the lazy initialization holder class idiom. For instance fields that can tolerate\
    \ repeated initialization, you may also consider the single-check idiom."
