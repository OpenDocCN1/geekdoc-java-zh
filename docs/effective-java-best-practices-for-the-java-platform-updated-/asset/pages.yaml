  md: "# CHAPTER 11 CONCURRENCY\n\nYou may have said that to improve performance,\
    \ you should dispense with synchronization when reading or writing atomic data.\
    \ This advice is dangerously wrong. While the language specification guarantees\
    \ that a thread will not see one thread will be visible to another. Synchronization\
    \ is required for reliable communication between threads as well as mutual exclusion.\
    \ This is due to a part of the language specification known as the memory model,\
    \ which specifies when and how changes made by threads become visible to others\
    \ (JLS, 17.4; Goetz06, 6).\n\nThe consequences of failing to synchronize access\
    \ to shared mutable data can be dire if the data is atomically readable and writable.\
    \ Consider the task of stopping one thread from another. The libraries provide\
    \ the Thread.stop method, but this method was deprecated long ago because it is\
    \ inherently unsafe—its use can result in data corruption. Do not use Thread.\
    \ A recommended way to stop one thread from another is to have the first thread\
    \ poll a boolean field that is initially false but can be set by the second thread\
    \ to indicate that the thread is to stop itself. Reading and writing a boolean\
    \ field is atomic, some programmers use with synchronization when accessing the\
    \ field:\n\n```\n// How to stop Thread\npublic class StopThread {\n    private\
    \ static boolean stopRequested;\n\n    public static void main(String[] args)\n\
    \    throws InterruptedException {\n        Thread backgroundThread = new Thread(()\
    \ -> {\n            int i = 0;\n            while (!stopRequested) {\n       \
