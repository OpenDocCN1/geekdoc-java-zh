  md: "NullPointerException. The general contract prohibits this. Many classes have\
    \ methods that guard against it with an explicit test for null:\n\n```\n@Override\
    \ public boolean equals(Object o) {\n    if (o == null)\n        return false;\n\
    \  }\n```\n\nThis is unnecessary. To test its for equality, the equals method\
    \ must first cast its argument to an appropriate type so its accessors can be\
    \ invoked or fields accessed. Before casting, the method must use the instanceof\
    \ operator to check that its argument is of the correct type:\n\n```\n@Override\
    \ public boolean equals(Object o) {\n    if (!(o instanceof MyType))\n       \
    \ return false;\n    MyType mt = (MyType) o;\n  }\n```\n\nIf this type were missing\
    \ and the equals method were passed an argument of the wrong type, the equals\
    \ method would throw a ClassCastException, which violates the equals contract.\
    \ But the instanceof operator is specified to return false if the first operand\
    \ is null, regardless of what type appears in the second operand [ILS, 15.20.2].\
    \ Therefore, the type check will return false if the second operand null is passed\
    \ in, so you don't need an explicit null check.\n\nPutting it all together, here\
    \ is a recipe for a high-quality equals method:\n\n+   1. Use instanceof to check\
    \ if the argument is a reference to this object. If so, return true. This is just\
    \ a performance optimization but one that is worth doing if the comparison is\
    \ potentially expensive.\n\n+   2. Use the instanceof operator to check if the\
    \ argument has the correct type. If not, return false. Typically, the correct\
    \ type is the class in which the method occurs. Occasionally, it is some interface\
    \ implemented by this class. Use an interface if the class implements an interface\
    \ that refines the equals contract to permit comparisons across classes that implement\
    \ the interface. Collection interfaces such as Set, List, Map, and Map Entry have\
    \ this property.\n\n+   3. Cast the argument to the correct type. Because this\
    \ cast was preceded by an instanceof test, it is guaranteed to succeed."
