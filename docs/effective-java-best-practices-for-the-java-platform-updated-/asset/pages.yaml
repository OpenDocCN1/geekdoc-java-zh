  md: '# Item 75: Include failure-capture information in detail messages


    When a failure occurs due to an uncaught exception


    To capture a failure, the detail message of an exception should contain the **values
    of all parameters and fields that contributed to the exception**. For example,
    the detail message of an *IndexOutOfBoundsException* should contain the lower
    bound, the upper bound, and the index value that failed to lie between the bounds.
    This tells a lot about the failure. Any or all of the three values could be less
    than the lower bound or equal to the upper bound (“fencepost error”), or it could
    be a value, far too off the high bound. The index could be greater than the upper
    bound (a serious internal invariant). Each of these situations points to a different
    problem, and it greatly aids the diagnosis if you know what sort of error you''re
    looking for.


    One caveat concerns security-sensitive information. Because stack traces may be
    seen by many people in the process of debugging and fixing issues, **do not include
    passwords, encryption keys, and the like in detail messages**.


    While it is critical to include all the pertinent data in the detail message of
    an exception, it is generally unnecessary to include a lot of prose. The stack
    trace is intended to be analyzed in conjunction with the documentation and source
    code. It generally contains the exact file and line number from which the exception
    was thrown, as well as the files and line numbers of other method invocations
    on the stack. Lengthy prose descriptions of the failure are superfluous; the information
    can be gleaned by reading the documentation and source code.


    The detail message of an exception should not be confused with a user-level error
    message. Unlike a user-level error message, the detail message is primarily for
    the benefit of programmers or site reliability engineers, when analyzing a failure.
    Therefore, information content is more important than readability. User-level
    error messages are often localized, whereas exception detail messages are rarely.'
