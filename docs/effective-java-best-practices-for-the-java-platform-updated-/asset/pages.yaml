  md: '# CHAPTER 2 CREATING AND DESTROYING OBJECTS


    constructor BigInteger(int, int, Random), which returns a BigInteger that is probably
    prime, would have better expressed as a static factory method BigInteger.probablePrime(This
    method was added in Java 4.)


    A class can have only one constructor with a given signature. Programs have been
    known to get around this restriction by using constructors whose parameter lists
    differ only in the order of their parameter types. This is really ideal. The user
    of such API will never be able to remember which constructor is which and will
    likely end up calling the wrong one by mistake. Reading code that uses these constructors
    will not know what the code does without referring to the class documentation.


    Because they have names, static factory methods don''t have the restriction discussed
    in the previous paragraph in cases where a class to require multiple constructors
    with the same signature, replace the constructors with static factory methods
    and carefully chosen names to highlight their differences.


    **A second advantage of static factory methods is that, unlike constructors, they
    are not required to create a new object each they''re invoked.** This allows immutable
    classes (Item) to use preconstructed instances, or cache instances as they are
    constructed, and use them repeatedly without creating unnecessary duplicate objects.
    The Boolean.valueOf(boolean) method illustrates this technique: it never creates
    an object. This technique is similar to the Flyweight pattern [Gemma95]. It can
    greatly improve performance if objects are requested, especially if they are expensive
    to create.


    The ability of static factory methods to return the same instance from repeated
    invocations allows classes to maintain strict control over what exists at any
    time. There are several reasons to write instance-controlled classes. Control
    instance allows a class to guarantee that it is a singleton (Item 3) or noninstable
    (Item 17) to make the guarantee that no two instances exist. Also, it allows for
    an immutable value class (Item 5) to exist only once, which is the basis of the
    Flyweight pattern [Gemma95]. Enum types (Item 6) provide this guarantee.


    **A third advantage of static factory methods is that, unlike constructors, they
    can return an object of any subtype of their return type.** This gives you great
    flexibility in choosing the class of the returned object.


    One application of this flexibility is that an API can return objects without
    making their classes public. Hiding implementation details in this fashion leads
    to a very compact API. This technique lends itself to interface-based frameworks
    (Item 20), where interfaces provide natural return types for static factory methods.'
