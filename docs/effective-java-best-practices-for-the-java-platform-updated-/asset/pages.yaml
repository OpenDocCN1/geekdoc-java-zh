  md: "Fixing this problem is as simple as writing a proper hashCode for PhoneNumber.\
    \ So what should a hashCode look like? It's trivial to write a bad one. This one,\
    \ for example, is always legal but should never be used:\n\n```\n// The worst\
    \ possible legal hashCode implementation - never use!\n@Override public int hashCode()\
    \ { return 42; }\n```\n\nIt's legal because it ensures that every object have\
    \ the same hash code. It's atrocious because it ensures that every object has\
    \ the same hash code. Therefore, every object has the same bucket, and hash tables\
    \ decorate to linked lists. Programs that run in linear time instead of quadratic\
    \ time. For large hash tables, this is the difference between working and not.\n\
    \nA good hash function tends to produce unequal hash codes for unequal. This is\
    \ exactly what we need by the third part of the hash contract. Ideally, a hash\
    \ function should distribute any reasonable collection of instances uniformly\
    \ across all values. Achieving this ideal can be difficult. Luckily it is not\
    \ too hard to achieve fair approximation. Here is a simple recipe:\n\n+   1. Declare\
    \ an int variable result, and initialize it to the hash code c for the first field\
    \ in your object, as computed in step 2.a. (Recall from Item 10 that a significant\
    \ field is a field that equals comparisons.)\n2. For every remaining significant\
    \ field f in your object, do the following:\n   a. Compute an int hash code c\
    \ for the field:\n      i. If the field is of a primitive type, compute Type.hashCode(f),\
    \ where Type is the primitive class corresponding to f's type;\n      ii. If the\
    \ field is an object reference and this class's method compares the field by recursively\
    \ invoking equals(), recursively invoke hashCode on the field. If a more complex\
    \ comparison is required, compute a “canonical representation” for this field\
    \ and invoke hashCode on the canonical representation. If the value is null, use\
    \ 0 or some other constant, but 0 is traditional);\n      iii. If the field is\
    \ an array, treat it as if each significant element is a separate field. If so,\
    \ compute a hash code for each significant element by applying these rules recursively,\
