  md: "# Item 88: readObject methods defensively\n\nItem 50 contains an immutable\
    \ date-range class with mutable private Date fields. The class goes to great lengths\
    \ to preserve its invariants and immutability by seriously copying Date objects\
    \ in its constructor and accessors. Here is the class:\n\n```\n// Immutable class\
    \ that uses defensive copying\npublic final class Period {\n    private final\
    \ Date start;\n    private final Date end;\n\n    /**\n     * @param start the\
