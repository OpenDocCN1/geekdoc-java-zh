- img_proc: true
  md: 'To make this more concrete, consider the following code fragment:


    ```

    // Why generic array creation is illegal - won''t compile!

    List<String>[] stringLists = new List<String>[1]; // (1)

    List<Integer> intList = List.of(42);               // (2)

    Object[] objects = stringLists;                                      // (3)

    Object[] s = intList;                              // (4)

    String s = stringLists.get(0);                     // (5)

    ```


    Let''s pretend that line 1, which creates a generic array, is legal. Line 2 creates
    and initializes a List<Integer> array into an Object array variable, which is
    illegal because arrays are covariant. Line 5 stores the List<Integer> into the
    sole element of the Object array, which succeeds because generics are implemented
    by erasure: the runtime type of a List<Integer> is simply List, and the runtime
    type of a List<String> instance is List[], so the assignment doesn''t generate
    an ArrayStoreException. Now we''re in trouble. We''ve stored a List<Integer> in
    an array that is declared to hold only List<String> instances. In line 5, we retrieve
    the sole element from the array, but it''s an Integer, so we get a ClassCastException
    at runtime. To prevent this from happening, line 1 which creates a generic array
    would generate a compile-time error.


    Types such as E, List<E>, and List<String> are technically known as non-reifiable
    types [ILS, 4.7]. Intuitively, a non-reifiable type is one whose runtime representation
    contains less information than its compile-time representation. Because of this,
    the only parameterized types that are reifiable are unbounded wildcards like <?>,
    and ?> [26]. It is legal, though rarely used, to create arrays of unbounded wildcard.


    The prohibition on generic array creation can be annoying. It means, for example,
    that it''s not possible for a collection to return an array of its element type
    (see Item 33 for a partial solution). It also means that you get casting warnings
    when using varargs methods (Item 55) in combination with generic types. This is
    because every time you invoke a varargs method, an array is created to hold the
    varargs parameters. If the element type of this array is not reifiable, you get
    a warning. The @Safeargs annotation can be used to address this issue (Item 32).


    When you get a generic array creation error or an unchecked cast to an array,
    the best solution is often to use the collection type List<E> in preference to
    the array type E[]. You might sacrifice conciseness or performance, but in exchange
    you get better type safety and interoperability.'
