  md: "# CHAPTER 2 CREATING AND DESTROYING OBJECTS\n\nThe main advantage of the public\
    \ field approach is that the API makes it clear\nthat the class is a singleton:\
    \ the public field is final, so it will always contain\nthe same object reference.\
    \ The second advantage is that it's simpler.\n\nOne advantage of the static factory\
    \ approach is that it gives you the flexibility\nto change your mind about whether\
    \ the class is a singleton without changing its\nAPI. The factory method returns\
    \ the new instance, but it could be modified to\nreturn, say a separate instance\
    \ for each thread that invokes it. A second advantage\nis that you can use a generic\
    \ singleton factory if your application requires it\n(Item 30). A benefit of using\
    \ a static factory is that a method reference can\nbe used as a supplier, for\
    \ example Elvis::instance= Supplier<Elvis>\nUnless one of these advantages is\
    \ relevant, the public field approach is preferable.\n\nTo make a singleton class\
    \ serializable either of these approaches serializable\n(Chapter 12), it is not\
    \ sufficient to add implements Serializable to its\ndeclaration. You must also\
    \ provide a readResolve method (Item 89). Otherwise, each time a\nserialized instance\
    \ is deserialized, a new instance will be created, leading, in the\ncase of our,\
    \ to spurious Elvis sightings. To prevent this from happening,\nadd this readResolve\
    \ method to the Elvis class:\n\n```\n// readResolve to preserve singleton property\n\
    private Object readResolve() {\n    // Return the one true and let the garbage\
    \ collector\n    // take care of the Elvis impersonator.\n    return INSTANCE;\n\
    }\n```\n\nA third way to implement a singleton is to declare a single-element\
    \ enum:\n\n```\n// Enum singleton - the preferred approach\nenum Elvis {\n   \
    \ INSTANCE;\n\n    public void leaveTheBuilding() { ... }\n}\n```\n\nThis approach\
    \ is similar to the public field approach, but it is more concise,\nprovides the\
    \ serialization machinery for free, and provides an ironclad guarantee\nagainst\
    \ multiple instantiation, even in the face of sophisticated serialization or\n\
    reflection attacks. This approach may feel a bit unnatural, but a single-element\n\
    enum type is often the best way to implement a singleton. Note that you can't\n\
    use approach if your singleton must extend a superclass other than Enum\n(though\
    \ you can declare an enum to implement interfaces)."
