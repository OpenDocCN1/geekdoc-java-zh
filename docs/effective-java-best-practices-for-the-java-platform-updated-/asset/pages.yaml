  md: "# CHAPTER 5 GENICS\n\nThe suppressWarnings annotation can be used on any declaration,\
    \ from an individual local variable declaration to an entire class. Always use\
    \ the suppressWarnings annotation on the smallest scope possible. Typically this\
    \ will be a variable declaration or a very short method or constructor. Never\
    \ use suppressWarnings on an entire class. Doing so could mask critical warnings.\n\
    \nIf you find yourself using theSuppressWarnings annotation on a method or constructor\
    \ that has more than one line, you may be able to move it to a local variable\
    \ declaration. You may need to declare a new local variable, and then it's worth\
    \ it. For example, consider this toArray which comes from ArrayList:\n\n```\n\
    public T[] toArray(T[] a) {\n    if (a.length > size)\n        return (T[]) Arrays.copyOf(elements,\
    \ size, a.getClass());\n    System.arraycopy(elements, 0, a, 0, size);\n    if\
    \ (a.length > size)\n        a[size] = null;\n    return a;\n}\n```\n\n> ArrayList.java:305:\
    \ warning: [unchecked] unchecked cast\nreturn (T[]) Arrays.copyOfOf(elements,\
    \ size, a.getClass());\n\n> required: T\nfound: Object[]\n\nIt is illegal to put\
    \ a suppressWarnings annotation on the return statement, because it's not a declaration\
    \ (JLS 9.7). You might be tempted to put the annotation on the entire method,\
    \ but instead declare a local variable to hold the return value and annotate its\
    \ declaration, like so:\n\n// Adding local variable to reduce scope of @SuppressWarnings\n\
    \n```\npublic T[] toArray(T[] a) {\n    if (a.length > size) {\n        // This\
    \ cast is correct because the array we're creating\n        // is of the same\
    \ type as the one passed in, which is T[].\n        @SuppressWarnings(\"unchecked\"\
    ) T[] result =\n            (T[]) Arrays.copyOf(elements, size, a.getClass());\n\
    \        return result;\n    }\n    System.arraycopy(elements, 0, a, 0, size);\n\
    \    if (a.length > size)\n        a[size] = null;\n    return a;\n}\n```"
