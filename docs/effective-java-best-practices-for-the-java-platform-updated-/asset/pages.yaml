    \ the right functional parameter demands care.\n\nConsider LinkedHashMap. You\
    \ can use this as a cache by overiding its protected removeEldestEntry method,\
    \ which is invoked by each time a new key is added to the map. When this method\
    \ returns true, the map removes the eldest entry. The following override allows\
    \ the map to grow to one hundred entries and then deletes the eldest entry each\
    \ time a new key is added, maintaining the most recent entries:\n\n```\nprotected\
    \ boolean removeEldestEntry(Map<K,V> eldest) {\n    return size() > 100;\n}\n\
    ```\n\nThis technique works, but you can do much better with lambdas. If LinkedHashMap\
    \ were written today, it would have a static factory or constructor that took\
    \ a function object. Looking at the declaration for removeEldestEntry, you might\
    \ think that the function object should take a Map<K,V> and return a boolean,\
    \ but removeEldestEntry method calls size() to get the number of entries in the\
    \ map, which works removeEldestEntry is an instance method of the map. The function\
    \ object that you pass to the constructor is not an instance method on the map\
    \ and can't capture the map because it doesn't exist yet when its factory or constructor\
    \ is invoked. Thus, the map must pass the function object, which must take the\
    \ map as input as it would the eldest entry. If you were to declare a functional\
    \ interface, it would look something like this:\n\n```\n// Unnecessary functional\
    \ interface; use a standard one.\n@FunctionalInterface interface EldestEntryRemovalFunction<K,V>\
    \ {\n    boolean remove(Map<K,V> map, Map.Entry<K,V> eldest);\n}\",\n```\n\nThis\
    \ interface would work, but you wouldn't use it, because you don't need to declare\
    \ a new interface for this purpose. The java.util.function package provides a\
    \ large collection of standard functional interfaces for your use."
