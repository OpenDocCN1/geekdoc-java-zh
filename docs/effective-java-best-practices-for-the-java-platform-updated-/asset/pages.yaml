    # Item 8: Avoid finalizers and cleaners


    Finalizers are unpredictable, dangerous, and generally unnecessary. Their use
    can cause erratic behavior, poor performance, and portability problems. Finalizers
    have a few valid uses, which we''ll cover later in this item, but as a rule, you
    should avoid them. As of Java 9, finalizers have been deprecated, but they are
    still being used by many Java libraries. The Java 9 replacement for finalizers
    is cleaners. Cleaners are less dangerous than finalizers, but still unpredictable,
    slow, and generally unnecessary.


    C++ destructors are alluring not to think of finalizers or cleaners as Java''s
    analogue. C++ destructors are the normal way to manage the resources associated
    with an object, a necessary counterpart to constructors. In Java, the garbage
    collector reclaim the storage associated with an object when it becomes unreachable,
    requiring no special effort on the part of the programmer. C++ destructors are
    also used to reclaim nonmemory resources. In Java, try-resources or try-finally
    is used for this purpose (Item 9).


    One shortcoming of finalizers and cleaners is that there is no guarantee they''ll
    be executed promptly (JLS, 1.6). It can take arbitrarily long between the time
    an object becomes unreachable and the time its finalizer or cleaner runs. This
    means that you should avoid doing anything-critical in a finalizer or cleaner.
    For example, it is a grave error to depend on a finalizer or cleaner to close
    files because open file descriptors are a limited resource. If many files are
    left open as a result of the system''s tardiness in running finalizers or cleaners,
    a program may fail because it can no longer open.


    Tardy finalization is not just a theoretical problem. Providing a finalizer for
    a class can arbitrarily delay reclaim of instances. A debugged a long-running
    GUI application that was mysteriously dying with an OutMemoryError. Analysis revealed
    at the time of death, the application had thousands of graphics objects on its
    finalizer queue waiting to be finalized and reclaimed. Unfortunately, the finalizer
    thread was running at a lower priority than another application thread, so objects
    were not getting finalized at the rate they became eligible for finalization.
    The language specification makes no guar-'
