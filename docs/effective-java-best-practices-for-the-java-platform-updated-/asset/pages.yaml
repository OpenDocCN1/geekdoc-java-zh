  md: "As a simple example of a stream pipeline where parallelism is effective, cons-ider\
    \ this function for computing π(n), the number of primes less than or equal to\
    \ n:\n\n```\n// Prime-counting stream pipeline - benefits from parallelism\nstatic\
    \ long pi(long n) {\n    return LongStream.rangeClosed(2, n)\n        .mapToObj(BigInteger::valueOf)\n\
    \        .filter(i -> i.isProbablePrime(50))\n        .count();\n}\n```\n\nOn\
    \ my machine, it takes 31 seconds to compute π(10⁸ using this function. Adding\
    \ a parallel() call reduces the time to 9.2 seconds:\n\n```\n// Prime-counting\
    \ stream pipeline - parallel version\nstatic long pi(long n) {\n    return LongStream.rangeClosed(2,\
    \ n)\n        .parallel()\n        .mapToObj(BigInteger::valueOf)\n        .filter(i\
    \ -> i.isProbablePrime(50))\n        .count();\n}\n```\n\nIn other words, parallelizing\
    \ the computation speeds it up by a factor of 3.7 on my quad-core machine. It's\
    \ worth noting that this is not how you'd compute π(n) for large values of n in\
    \ practice. There are far more efficient algorithms, notably Lehman's formula.\n\
    \nIf you are going to parallelize a stream of random numbers, start with a SplittableRandom\
    \ rather than a ThreadRandom (or the obsolete Random). SplittableRandom is designed\
    \ for precisely this use, with the potential for linear speed. ThreadLocalRandom\
    \ is designed for use by a single thread, and will adapt to function as a parallel\
    \ stream source, but won't be as fast as SplittableRandom. Random synchronizes\
    \ on every operation, which will result in excessive parallel-pipeline contention.\n\
    \nIn summary, do not attempt to parallelize a stream pipeline unless you have\
    \ good reason to believe that it will preserve the correctness of the computation\
    \ and increase its speed. The cost of inappropriately parallelizing a stream can\
    \ be a program failure or performance disaster. If you believe that parallelism\
    \ may be justified, ensure that your code remains correct when run in parallel,\
    \ and do careful performance measurements under realistic conditions. If your\
    \ code remains correct and these experiments bear out your suspicion of increased\
    \ performance, then and only then parallelize the stream in production code."
