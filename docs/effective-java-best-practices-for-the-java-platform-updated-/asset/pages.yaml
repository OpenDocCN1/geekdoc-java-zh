  md: "# 218 CHAPTER 7 LAMBDAS AND STREAMS\n\nThe Collection interface is a subtype\
    \ of Iterable and has a stream method, so it provides for both iteration and stream\
    \ access. Therefore, Collection or an appropriate subtype is generally the best\
    \ return type for a public, sequence-returning method. Arrays also provide for\
    \ easy iteration and stream access with the Arrays.List and Stream classes. If\
    \ the sequence is small enough to fit easily in memory, you probably best off\
    \ returning one of the standard collection implementations, such as ArrayList\
    \ or HashSet. But do not store a large set in memory when returning it as a collection.\n\
    \nIf you're returning a large set that can be represented concisely, consider\
    \ implementing a special-purpose collection. For example, if you want to return\
    \ the power set of a given set, which consists of all of its subsets, the power\
    \ set of {a, b, c} is {{ {a}, {b}, {c}, {a, b}, {a, c}, {b, c}, {a, b, c}}. If\
    \ the set has n elements, your power set has 2^n. Therefore, you shouldn't consider\
    \ storing the power set in a standard collection. It is, however, to implement\
    \ a custom collection for the job with the help of AbstractSet.\n\nThe trick is\
    \ to use the index of each element in the set as a bit vector, where the nth bit\
    \ in the index indicates the presence or absence of the nth element from the source\
    \ set. In essence there is a natural mapping between the binary numbers from 0\
    \ to 2^n-1 and the power set of an n-element set. Here's the code:\n\n```\n//\
    \ Returns the power set of an input set as custom collection\npublic class PowerSet\
    \ {\n    public Set<E> collection(Collection<E> s) {\n        List<E> src = new\
    \ ArrayList<>(s);\n        if (src.size() > 30)\n            throw new IllegalArgumentException(\"\
    Set too big \" + s);\n        return new AbstractSet<E>() {{\n            @Override\n\
    \            public int size() {\n                return 1 << src.size(); // 2\
    \ to the power set size\n            }\n\n            @Override\n            public\
