  md: "# CHAPTER 2 CREATING AND DESTROYING OBJECTS\n\nFor example, the keySet method\
    \ of the Map interface returns a Set view of the Map object, consisting of all\
    \ the keys in the map. Naively, it would seem that every call to keySet would\
    \ have to create a new Set instance, but every call to keySet on a given Map object\
    \ may return the same Set instance. Although the returned instance is typically\
    \ mutable, all the returned objects are functionally identical: when one of the\
    \ returned objects changes, so do all the others, because they're all backed by\
    \ the same Map instance. While it is largely harmless to create multiple instances\
    \ of the keySet object, it is unnecessary and has no benefits.\n\nAnother way\
    \ to create unnecessary objects is boxing, which allows the programmer to mix\
    \ primitive and boxed types, boxing and unboxing automatically. Autoboxing blurs\
    \ primitive and boxed types does not erase the distinction and semantic differences\
    \ between them (item 4). Consider the following method, which calculates the sum\
    \ of all the positive int values. To do this, the program has to use long arithmetic\
    \ because an int is not enough to hold the sum of all the int values:\n\n```\n\
    java\nprivate static long sum() {\n    long sum = 0;\n    for (int i = 0; i <\
    \ Integer.MAX_VALUE; i++) {\n        sum += i;\n    }\n    return sum;\n}\n```\n\
    \nThis program gets the answer, but it is much slower than it should be, due to\
    \ a one-character typographical error. The variable sum is declared as a Long\
    \ instead of a long, which means the program constructs 2^31 unnecessary Long\
    \ instances. Changing the declaration of sum from Long to long reduces the runtime\
    \ from 6.3 seconds to 0.59 seconds on my machine. The lesson is: prefer primitives\
    \ to boxed primitives, and watch out for unintended autoboxing.\n\nThis item should\
    \ not be reconstructed to imply that object creation is expensive and avoided.\
    \ On the contrary, the creation and reclamation of small objects whose constructors\
    \ do little explicit work is cheap, especially on modern JVM implementations.\
    \ Creating additional objects to enhance the clarity, simplicity, or power of\
    \ a program is generally a good thing.\n\nConversely, avoiding object creation\
    \ by maintaining your own object pool is a bad idea unless the objects in the\
    \ pool are extremely heavyweight. The classic"
