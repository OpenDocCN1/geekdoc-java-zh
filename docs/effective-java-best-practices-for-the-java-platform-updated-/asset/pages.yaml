  md: "# Item 79: Avoid excessive synchronization\n\nItem 78 warns of the dangers\
    \ of insufficient synchronization. This item concerns the opposite problem. Depending\
    \ on the situation, excessive synchronization can cause reduced performance, deadlock,\
    \ or even nondeterministic behavior.\n\nTo avoid lively and safety failures, never\
    \ cede the client within a synchronized method or block. In other words, inside\
    \ a synchronized region, do not invoke a method that is designed to be overridden,\
    \ or one provided by a client in the first of a function object (Item 24). From\
    \ the perspective of the class with the synchronized region, methods are *alien*.\
    \ The class has no knowledge of what the method does and has no control over it.\
    \ Depending on what an alien method does, calling it from a synchronized region\
    \ can cause exceptions, deadlocks, or data corruption.\n\nTo make this concrete,\
    \ consider the following class, which implements an *observable* set wrapper.\
    \ It allows clients to subscribe to notifications when elements are added to the\
    \ set. This is the *Observer* pattern [Gamma095]. For brevity, the class does\
    \ not provide notifications when elements are removed from the set, but it would\
    \ be a simple matter to provide them. This class is implemented through the runnable\
    \ interface (page 90).\n\n```\n// Broken - invokes method from synchronized block!\n\
    public class ObservableSet<E> extends ForwardingSet<E> {\n    public ObservableSet(Set<E>\
    \ set) {\n        super(set);\n    }\n\n    private Final List<Set<E>> observers\
    \ =\n        new ArrayList<>();\n\n    public void addObserver(Set<E> observer)\
    \ {\n        synchronized(observers) {\n            observers.add(observer);\n\
    \        }\n    }\n\n    public boolean removeObserver(Set<E> observer) {\n  \
    \      synchronized(observers) {\n            return observers.remove(observer);\n\
    \        }\n    }\n\n    private void notifyElementAdded(E element) {\n      \
    \  synchronized(observers) {\n            for (Set<E> observer : observers)\n\
    \                observer.added(this, element);\n        }\n    }\n}\n```"
