  md: '# Item 41: Use marker interfaces to define types


    A marker interface is an interface that contains no method declarations but merely
    designates (or "marks") a class that implements the interface as having some property.
    For example, consider the Serializable interface (Chapter 12). By implementing
    this interface, a class indicates that its instances can be written to an ObjectOutputStream
    (or "serializable").


    You may hear that marker annotations (Item 39) make marker interfaces obsolete.
    This assertion is incorrect. Marker interfaces define a type that is implemented
    by instances of the marked class; marker annotations do not. The existence of
    a marker interface allows you to catch errors at compile time that you could only
    catch at runtime if you used a marker annotation. Java''s serialization facility
    (Chapter 6) uses the Serializable marker interface to indicate that a type is
    serializable. The ObjectOutputStream.writeObject method which serializes the object
    that is passed to, requires that its argument be serializable, an attempt to serialize
    an inappropriate object would have been detected at compile time. Unfortunately,
    the ObjectOutputStream.write API does not require the Serializable interface;
    its argument is declared to be of type Object, so attempts to serialize an unserializable
    object will fail until runtime.


    Another advantage of marker interfaces over marker annotations is that they can
    be targeted more precisely. If an annotation type is declared with ElementType,
    it can be applied to any class or interface. Suppose you have a marker that is
    applicable only to implementations of a particular interface. If you define it
    as a marker interface, you can extend the sole interface to which it is applicable,
    guaranteeing that all marked types are subtypes of the interface to which it is
    applicable.


    Likewise, the Set interface is just a restricted marker interface. It is applicable
    only to Collection subtypes, but it adds no methods beyond those defined by Collection.
    It is generally considered to be a marker interface because it refines the contracts
    of several Collection methods, adding equals(), and hashCode(). But it is easy
    to imagine a marker interface that is applicable only to subtypes of some particular
    interface and does not refine the contracts of any of the interface''s methods.
    Such a marker might describe some invariant of the entire object or indicate that
    instances are for processing'
