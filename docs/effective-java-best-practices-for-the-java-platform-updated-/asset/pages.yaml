  md: 'exported class. In this case, the member class is an exported API element and
    cannot be changed from a nonstatic to a static class in a subsequent release without
    violating backward compatibility.


    As you would prefer, an anonymous class has no name. It is not a member of its
    enclosing class. Rather than being declared along with other members, it is simultaneously
    declared and instantiated at the point of use. Anonymous classes are permitted
    at any point in the code where an expression is declared. Anonymous classes enclose
    instances if and only if they occur in a nonstatic context. But even if they occur
    in a static context, they cannot have any static members other than constant variables,
    which are primitive or string fields initialized to constant expressions [ILS,
    4.12.4].


    There are many limitations on the applicability of anonymous classes. You can''t
    instantiate them except at the point they''re declared. You can''t perform instanceof
    or do anything else that requires you to name the class. You can''t declare an
    anonymous class to implement multiple interfaces or to extend a class and implement
    an interface at the same time. Clients of an anonymous class can''t invoke any
    member except those it inherits from its supertype. Because anonymous classes
    exceed the readability of expressions, they must be kept short—about ten lines
    or fewer—will readability.


    Before lambdas were introduced to Java (Chapter 6), anonymous classes were the
    preferred means of creating function objects and process objects on the fly, but
    lambdas are now preferred (Item 42). Another common use of anonymous classes is
    the implementation of static factory methods (see JSONArray in Item 20).


    Local classes are the least frequently used of the four kinds of nested classes.
    A local class can be declared anywhere a local variable can be declared and obeying
    the scoping rules. Local classes have attributes in common with each of the other
    kind of nested classes. Like member classes, they have names and can be used repeatedly.
    Like anonymous classes, they are defined in a nonstatic context and contain static
    members. And like anonymous classes, they should be kept short so as not to harm
    readability.


    To recap, there are four kinds of nested classes, and each has its place. If a
    class needs to be visible outside of a single method or is too long to fit comfortably
    inside a method, use a member class. If each instance of a member class needs
    a reference to its enclosing instance, make it nonstatic; otherwise, make it static.
    Assuming the class belongs inside a method, if you need to create instances from
    only one location and there is a prevailing type that characterizes the class,
    make it an anonymous class; otherwise, make it a local class.'
