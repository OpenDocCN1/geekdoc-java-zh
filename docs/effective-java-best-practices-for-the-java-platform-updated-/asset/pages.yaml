- img_proc: true
  md: 'any of these things, for example, by adding a convenience method, the generated
    serial UID changes. If you fail to declare a serial version UID, compatibility
    will be broken, resulting in an InvalidClassException at runtime.


    A second cost of implementing Serializable is that it increases the likelihood
    of bugs and security holes (Item 85). Normally, objects are created with constructors;
    serialization is an extraordinary mechanism for creating objects. Whether you
    accept the default behavior or override it, deserialization is a "hidden constructor"
    with all of the same issues as other constructors. Because there is no explicit
    constructor associated with deserialization, it is easy to forget that it guarantees
    all of the invariants established by the constructors and that it does not allow
    an attacker to gain access to the internals of the object under construction.
    Relying on this serialization mechanism can easily leave objects in invariant
    corruption and illegal state.


    A third cost of implementing Serializable is that it increases the burden associated
    with releasing a new version of the class. When a class is revised, it is important
    to check that it is possible to serialize an instance in the new release and deserialize
    it in the old, and vice versa. The amount of testing required is proportional
    to the product of the number of serializable classes and the number of releases,
    which can be large. You must ensure that the serialization-deserialization process
    succeeds and that it results in a faithful replica of the original object, especially
    when the class is first written (Items 87-90).


    Implementing Serializable is not a decision to be undertaken lightly. It is not
    essential if a class is to participate in a framework that relies on Java serialization
    for object transport or persistence. Also, it greatly eases the use of a class
    as a component in another class that must implement Serializable. Each time you
    design a class, we weigh the costs against the benefits. Historically, values
    such as Integer and Instant implement Serializable, and collection classes did
    too. Classes representing active entities, such as pools, should rarely implement
    Serializable.


    Classes for inheritance (Item 19) should rarely implement Serializable, and interfaces
    burden anyone who extends the class or implements the interface. There are times
    when it is appropriate to violate the rule. For example, if a class or interface
    exists primarily to participate in a framework that requires all participants
    to implement Serializable, then it may make sense for the class or interface to
    implement or extend Serializable.'
