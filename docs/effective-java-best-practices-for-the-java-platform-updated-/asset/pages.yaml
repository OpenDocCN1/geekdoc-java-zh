    \ any\n     * subtype of the type described by this class object)\n     */\n \
    \   Class<?> extends Throwable value();\n}\n```\n\nPackage-level docs comments\
    \ should be placed in a file named package-info.java. In addition to these comments,\
    \ package-info.java must contain a package declaration and may contain annotations\
    \ on this declaration. Similarly, if you elect to use the module system (Item\
    \ 15), module-level comments should be placed in the module-info.java.\n\nTwo\
    \ aspects of APIs that are often neglected in documentation are threadsafety and\
    \ serializability. Whether or not a class or static method is threadsafe, as described\
    \ in Item 82. If a class is serializable, you should document its serialized format,\
    \ as described in Item 87.\n\nJavadoc has the ability to \"inherit\" doc methods.\
    \ If an API element does not have a doc comment, Javadoc searches for the most\
    \ specific applicable doc comment, giving preference to interfaces over subclasses.\
    \ The details of the search algorithm can be found in the Javadoc Reference Guide\
    \ [Javadoc-ref]. You can inherit part of doc comments from supertypes using the\
    \ {@inheritDoc}. This means, among other things classes can reuse doc comments\
    \ from interfaces they implement rather than copying these comments. This facility\
    \ has the potential to reduce the burden of maintaining multiple sets of nearly\
    \ identical doc comments, but it is tricky to use and has some limitations. The\
    \ details are beyond the scope of this book."
