  md: "# ITEM 26: DON'T USE RAW TYPES\n\nThe compiler inserts invisible casts for\
    \ you when retrieving elements from collections and generics that they won't fail\
    \ (assuming, that all of your code did not generate or suppress any compiler warnings).\
    \ While the prospect of accidentally inserting a coin into a stamp collection\
    \ may appear far-fetched, the problem is real. It is easy to imagine putting a\
    \ Bird into a collection that is supposed to contain only integers.\n\nAs noted\
    \ earlier, it is legal to use raw types (generic types without their parameters),\
    \ but you should never do it. **If you use raw types, you lose all the safety\
    \ and expressive benefits of generics.** Given that you shouldn't use them, why\
    \ the language designers permit raw types in the first place? For compatibility,\
    \ Java was about to enter its second decade when generics were added, and there\
    \ was an enormous amount of code in existence that did not use generics. It was\
    \ critical that this code remain legal and operate with parameterized types that\
    \ were designed for use raw types, and vice versa. This requirement meant to support\
    \ raw types and implement generics using *erasure* (Item 28).\n\nWhen you use\
    \ a raw type such as a List, is it fine to use types that are parameterized to\
    \ allow insertion of arbitrary objects, such as List<Object>?? Loosely speaking,\
    \ the former has opted out of the generic type List<Object>? The latter has explicitly\
    \ told the compiler that it is capable of holding objects of any type. While you\
    \ can pass a List<String> to a parameter of type List<Object>, there are unhappy\
    \ rules for generics, and List<String> is a subtype of the raw type List but not\
    \ of the parameterized List<Object> (Item 28). As a consequence, you lose type\
    \ safety if you use a raw type such as List, but not if you use a parameterized\
    \ type as List<Object>.\n\nTo make this concrete, consider the following program:\n\
    \n```\n// Fails at runtime\npublic static void main(String[] args) {\n    List<String>\
    \ strings = new ArrayList<Object>();\n    unsafeAdd(strings, Integer.valueOf(42));\n\
    \    String s = strings.get(0); // Has compiler-generated cast\n}\n```\n\n```\n\
    private static void unsafeAdd(List list, Object o) {\n    list.add(o);\n}\n```"
