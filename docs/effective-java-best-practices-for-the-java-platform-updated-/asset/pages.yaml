    \ the possibly null return value, for example:\n\n```\nList<Cheeses> cheeses =\
    \ shop.getCheeses();\nif (cheeses != null && cheeses.contains(Cheese.STILTON))\
    \ {\n    System.out.println(\"Jolly good, just the thing.\");\n```\n\nThis returns\
    \ null in place of an empty collection or array. It is error-prone, because the\
    \ programmer might forget to write the special-case code to handle a null return.\
    \ Such an error goes unnoticed for years because such methods usually return one\
    \ or more objects. Returning null in place of an empty container complicates the\
    \ implementation of the method returning the container.\n\nIt is sometimes argued\
    \ that a null return value is preferable to an empty collection or array avoids\
    \ the expense of allocating the empty container. This argument fails on two counts.\
    \ First, it is inadmissible to worry about performance at this level unless measurements\
    \ have shown that the allocation is a contributor to performance problems (item7).\
    \ Second, it is possible to return empty collections and arrays without allocating\
    \ them. Here is the typical code to return a possibly empty collection. Usually,\
    \ this is all you need:\n\n```\n// The right way to return a possibly empty collection\n\
    public List<Cheeses> getCheeses() {\n    return new ArrayList<>(cheesesInStock);\n\
    }\n```\n\nIn the unlikely event that you have evidence suggesting that allocating\
    \ empty collections is harming performance, you can avoid the allocations by returning\
    \ the"
