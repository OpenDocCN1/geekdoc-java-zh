  md: "Both of these idioms (normal initialization and lazy initialization with a\
    \ synchronized accessor) are unchanged when applied to static fields, except that\
    \ you add the static modifier to the field and accessor declarations.\n\n# ###\
    \ If you need to use lazy initialization for performance on a static field, use\
    \ the lazy initialization holder class idiom. This idiom exploits the guarantee\
    \ that a class will not be initialized until it is used [JLS, 12.4.1]. Here's\
    \ how it looks:\n\n```\n### Lazy initialization holder class idiom for static\
    \ fields\nprivate static FieldHolder holder {\n    static Final FieldType field\
    \ = computeFieldValue();\n}\n\nprivate static FieldType getField() { return FieldHolder.field;\
    \ }\n```\n\nWhen getField() is invoked for the first time, it reads FieldHolder.field.\
    \ The beauty of the first time, the initialization of the FieldHolder class. The\
    \ idiom is that the getField method is not synchronized and performs only a field\
    \ access, so initialization adds practically nothing to the cost of access. A\
    \ typical VM synchronizes only to initialize the class. Once the class is initialized,\
    \ the VM patches the code so that subsequent access to the field does not involve\
    \ any testing or synchronization.\n\n# If you need to use lazy initialization\
    \ for performance on an instance field, use the double-check idiom. This idiom\
    \ avoids the cost of locking when accessing the field after initialization (item\
    \ 79). The idea behind the idiom is to check the value of the field twice; once\
    \ without locking and then, if the field appears to be uninitialized, a second\
    \ time with locking. Only if the second check indicates that the field is initialized\
    \ does it initialize the field. Because there is no locking once the field is\
    \ initialized, it is critical that the field be declared volatile (item 78). Here\
    \ is the idiom:\n\n```\n### Double-check idiom for lazy initialization of instance\
    \ fields\nprivate volatile FieldType field;\n```\n\n```\nprivate FieldType getField()\
    \ {\n    FieldType result = field;\n    IF (result == null) { // First check (no\
    \ locking)\n        synchronized (this) {\n            if (field == null) // Second\
    \ check (with locking)\n                field = result = computeFieldValue();\n\
    \            }\n        }\n    }\n    return result;\n}\n```"
