  md: "# Item 63: Beware the performance of string concatenation\n\nThe string concatenation\
    \ operator (+) is a convenient way to combine a few strings into one. It is fine\
    \ for generating a single line of output or constructing the string representation\
    \ of a small, fixed-size object, but it does not scale. **Using the string concatenation\
    \ operator repeatedly to concatenate a string requires time quadratic.** This\
    \ is an unavoidable consequence of the fact that strings are immutable (Item 17).\
    \ When two strings are concatenated, the contents of both are copied.\n\nFor example,\
    \ consider this method, which constructs the string representation of a billing\
    \ statement by repeatedly concatenating a line for each item:\n\n```\n// Inappropriate\
    \ use of string concatenation - Performs poorly!\",\n```\n\n```\npublic String\
    \ statement() {\n    String result = \"\";\n    for (int i = 0; i < numItems();\
    \ i++) {\n        result += lineForItem(i); // string concatenation\n    }\n \
    \   return result;\n}\n```\n\nThe method performs absolutely if the number of\
    \ items is large. **To achieve acceptable performance, use a StringBuilder in\
    \ place of String** to store the statement under condition:\n\n```\npublic String\
    \ statement() {\n    StringBuilder b = new StringBuilder(numItems() * LINE_WIDTH);\n\
    \    for (int i = 0; i < numItems(); i++) {\n        b.append(lineForItem(i));\n\
    \    }\n    return b.toString();\n}\n```\n\nA lot of work has gone making string\
    \ concatenation faster since Java 6, but the difference in the two methods is\
    \ drastic: if numItems 100 returns an eight-character string, the second method\
    \ runs 6.5 times faster than the first on my machine. Because the first method\
    \ is quadratic in the number of items, and the second is linear, the performance\
    \ difference gets much larger as the number of items grows. Note that the second\
    \ method preallocates a StringBuilder large enough to hold the entire result,\
    \ eliminating the need for automatic growth. Even if it is denoted to use a default-sized\
    \ StringBuilder, it is still 5.5 times faster than the first method.\n\nThe moral\
    \ is simple: **Don't use the string concatenation operator to combine a few strings**\
    \ unless performance is irrelevant. Use StringBuilder's append method instead.\
    \ Alternatively, use a character array, or process the strings one at a time instead\
    \ of combining them."
