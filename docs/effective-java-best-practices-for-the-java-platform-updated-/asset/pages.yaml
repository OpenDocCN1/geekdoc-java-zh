  md: '# CHAPTER 4 CLASSES AND INTERFACES


    This class represents a *complex number* (a number with both real and imaginary
    parts). In addition to the standard object methods, it provides accessors for
    the real and imaginary parts and provides the four basic arithmetic operations:
    addition, subtraction, multiplication, and division. Notice how the arithmetic
    operations create a new Complex instance rather than modifying this instance.
    This pattern is known as the *functional* approach because methods return the
    result of applying a function to their operand, without modifying it. Contrast
    this with the *procedural* or *imperative* approach which methods modify to their
    operand, changing its state. Note that the methods used are prepositions (such
    as *plus*) rather than verbs (such as *add*). This emphasizes the fact that classes
    do not change the value of the objects. The BigInteger and BigDecimal classes
    differ only by this naming convention, and it led to many usage errors.


