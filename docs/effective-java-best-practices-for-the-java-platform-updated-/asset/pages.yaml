  md: '# FOREWORD


    There are numerous books from which you can learn the grammar of the Java programming
    language, including *The Java Programming Language* by Arnold, Gosling, and Holmes,
    or *The Java Language Specification* by Gosling, Joy, yours truly, and Bracha.
    Likewise, there are dozens of books on the libraries and APIs associated with
    the Java programming language.


    This book addresses your need for customary and effective usage, Joshua Bloch
    has spent years extending, implementing, and using the Java programming language
    at Sun Microsystems; he has also read a lot of other people''s code, including
    mine. Here he offers good advice, systematically organized, on how to structure
    your code so that it works, so that other people can understand it, so that future
    modifications and improvements will be less likely to cause headaches—perhaps,
    even, so that your programs will be pleasant, elegant, and graceful.


    Guy L. Steele Jr.

    Burlington, Massachusetts

    April 2001'
