  md: "# Item 58: Prefer for-each loops to traditional loops\n\nAs discussed in Item\
    \ 45, some tasks are best accomplished with streams, others with iteration. There\
    \ is a traditional for loop to iterate over a collection:\n\n```\n// Not the best\
    \ way to iterate over a collection!\nfor (Iterator<Element> i = c.iterator();\
    \ i.hasNext(); ) {\n    Element e = i.next();\n    ... // Do something with e\n\
    }\n```\n\nand here is a traditional for loop to iterate over an array:\n\n```\n\
    // Not best way to iterate over an array!\nfor (int i = 0; i < a.length; i++)\
    \ {\n    ... // Do something with a[i]\n}\n```\n\nThese idioms are better than\
    \ while (Item 57), but they aren't perfect. The iterator and the index variable\
    \ are both clutter—all you need are many chances to use the wrong variable. Furthermore,\
    \ they represent opportunities for error. The iterator iterates three times in\
    \ each loop and the index variable four, which gives you many chances to use the\
    \ wrong variable. If you do, there is no guarantee that the compiler will catch\
    \ the problem. Finally, the two are quite different; adding unnecessary attention\
    \ to the type of container and adding a (minor) hassle to changing that type.\n\
    \nThe for-each loop (officially known as the \"enhanced for\") solves all of the\
    \ problems. It gets rid of the clutter and the opportunity for error by hiding\
    \ the iterator or index variable. The resulting idiom applies to collections and\
    \ arrays, easing the process of switching the implementation type of a container\
    \ from one to the other:\n\n```\n// The preferred idiom for iterating over collections\
    \ and arrays\nfor (Element e : elements) {\n    ... // Do something with e\n}\n\
    ```\n\nWhen you see the colon (:), read it as \"in\". Thus, the loop above reads\
    \ as \"for each e in elements\". There is no performance penalty for using for-each\
    \ loops, for arrays; the code they generate is essentially identical to the code\
    \ you would write by hand.\n\nThe advantages of the for-each loop over the traditional\
    \ for loop are even greater when it comes to nested iteration. Here is a common\
    \ mistake that people make when doing nested iteration:"
