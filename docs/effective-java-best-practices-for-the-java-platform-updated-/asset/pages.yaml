  md: "# Item 21: Design interfaces for posterity\n\nPrior to Java 8, it was impossible\
    \ to add methods to interfaces without breaking existing implementations. If you\
    \ added a method to an interface, existing implementations would, in general,\
    \ lack the method, resulting in a compile-time error. In Java 8, the default method\
    \ construct was added [JLS 9.4], with the intent of allowing the addition of methods\
    \ to existing interfaces. But adding new methods to existing interfaces is fraught\
    \ with risk.\n\nThe declaration for a default method includes a default implementation\
    \ that is used by all classes that implement the interface but do not implement\
    \ the default method. While the addition of default methods makes it possible\
    \ to add methods to an existing interface, there is no guarantee that these methods\
    \ will work in all preexisting implementations. Default methods are “injected”\
    \ into existing implementations without the knowledge or consent of the tacit\
    \ understanding that their interfaces would acquire any new methods.\n\nMany new\
    \ default methods were added to the core collection interfaces in Java 8, primarily\
    \ to facilitate the use of lambdas (Chapter 6). The Java libraries' default methods\
    \ are high-general-purpose implementations, and in most cases, they work. But\
    \ it is not always possible to write a default method that maintains all invariants\
    \ of every conceivable implementation.\n\nFor example, consider the removeIf method,\
    \ which was added to the Collection interface in Java 8. This method removes all\
    \ elements for which a given boolean function returns false. The default implementation\
    \ is specified to traverse the collection using its iterator, invoking the predicate\
    \ on each element, and using the iterator's remove method to remove the elements\
    \ for each. Presumably the declaration looks something like this:\n\n```\n// Default\
    \ method added to the Collection interface in Java 8\n```\n\n```\nboolean removeIf(Predicate<?\
    \ super E> filter) {\n    boolean result = false;\n    for (Iterator<E> it = iterator();\
    \ it.hasNext();) {\n        if (filter.test(it.next())) {\n            it.remove();\n\
    \            result = true;\n        }\n    }\n    return result;\n```"
