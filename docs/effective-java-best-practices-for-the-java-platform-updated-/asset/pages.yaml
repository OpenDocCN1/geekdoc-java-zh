  md: "# Item 6: Avoid unnecessary objects\n\nIt is appropriate to reuse a single\
    \ object instead of creating a new function-ally equivalent object each time it\
    \ is needed. Reuse can be both faster and more stylish. An object can always be\
    \ reused if it is immutable (Item 17).\nAs an example of what not to do, consider\
    \ this statement:\n\n```\nString s = new String(\"bikini\"); // DON'T DO THIS!\n\
    ```\n\nThe statement creates a new String instance each time it is executed, and\
    \ none of those objects creation is necessary. The argument to the String constructor\
    \ (\"bikini\") is itself a String instance, functionally identical to all of the\
    \ objects created by the constructor. If this usage occurs in a loop or in a frequently\
    \ invoked method, millions of String instances can be created needlessly.\nThe\
    \ improved version is simply this:\n\n```\nString s = \"bikini\";\n```\n\nThis\
    \ version uses a single String instance, rather than creating a new one each time\
    \ it is executed. Furthermore, it is guaranteed that the object will be reused\
    \ by any other code running in the same virtual machine that happens to contain\
    \ the same string literal (JLS 3.0.5).\nYou can avoid creating unnecessary objects\
    \ by using static factory meth-ods (Item 1) in preference to constructors on immutable\
    \ classes that provide both. For example, the factory method Boolean.valueOf(String)\
    \ is preferable to the constructor Boolean(String), which is deprecated in Java\
    \ 9. The constructor must create a new object each time it's called, while the\
    \ factory method is never required to do so and wont create objects. In addition\
    \ to reusing immutable objects, you can also reuse objects if you know they will\
    \ be modified.\nSome object creations are more expensive than others. If you're\
    \ going to need such an object repeated, it may be advisable to cache it for reuse.\
    \ Unfortunately, it's not always obvious when you're creating such an object.\n\
    Suppose you want to write a method to determine whether a string is a valid Roman\
    \ numeral. Here's one way to do this using a regular expression:\n\n```\n// Performance\
    \ can be greatly improved\nstatic boolean is(String s) {\n    return s.matches(\"\
    ^(?=).*M*([XIMD]|D?C[MD])?D(0,3))([CL]|L?X(0,3))?(CI[XV]|V?I(0,3))$$\");\n}\n\
    ```"
  merge: -1
