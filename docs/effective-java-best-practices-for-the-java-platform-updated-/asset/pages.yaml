  md: '# Item 11: Always override hashCode when you override equals


    You must override hashCode in every class that overrides equals. If you fail to
    do so, your class will violate the general contract for hashCode, which will prevent
    it from functioning properly in collections such as HashMap and HashSet. It is
    the contract, adapted from the Object specification


    +   - When the hashCode method is invoked on an object repeated during execution
    of an application, it must consistently return the same value, provided no information
    in equals comparisons is modified. This value need not remain consistent from
    one execution of an application to another.

    - If two objects are equal according to the equals(Object) method, then calling
    hashCode on the two objects must produce the same integer result.

    - If objects are unequal to the equals(Object) method, it is not required that
    calling hashCode each of the objects must produce distinct results. However, the
    programmer should be aware that producing distinct results for unequal objects
    may improve the performance of hashes.


    The key position is violated when you fail to override hashCode is the second
    one: equal objects must have equal hash codes. Distinct instances may be legally
    equal according to a class''s equals method, but to Object''s hashCode method,
    they''re just objects with two seemingly random numbers instead two equal numbers
    as required by the contract.


    For example, suppose you attempt to use instances of the Phone class from Item
    10 as keys in a HashMap:


    ```

    Map<Phone, String> m = new HashMap<>();

    m.put(new Phone(707, 867, 5309), "Jenny");

    ```


    At this point, you might expect.get(new Phone(707, 867, 5309)) to return "Jenny",
    but instead, it returns null. Because two Number instances are used for insertion,
    and a second, equal instance is used for retrieval. The Phone class''s failure
    to override hashCode causes the two instances to have unequal hash codes, in violation
    of the hashCode contract. Therefore, the get method is likely to look for the
    phone number in a different hash bucket from the one in which it was stored by
    the put method. Even the two instances will almost certainly return null, because
    HashMap has an optimization that caches the hash code associated with each entry
    and doesn''t checking for object equality if the hash codes don''t match.'
