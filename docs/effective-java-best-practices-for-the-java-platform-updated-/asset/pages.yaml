  md: '# ITEM 55: RETURN OPTIONALS JUDICIOUSLY


    An Optional is an object that has been allocated and initialized, and reading
    the value out of the optional requires an extra indirection. This makes option
    inappropriate for use in some performance-critical situations. Whether a particular
    method falls into this category can only be determined by careful measurement
    (Item 67).


    Returning an optional that contains a boxed primitive is prohibitively expensive
    compared to returning a primitive type. Therefore, the library designers saw fit
    to provide the levels of boxinging zero. For the primitive types Optional<Int>,
    Optional<Long>, and Optional<Double>. These types must contain, not all, of the
    methods on Optional. **You should never return an optional of a boxed primitive
    type**, with the possible exception of the primitive types: Bool, Character, short,
    and Float.


    Thus we have discussed returning optionals and processing them after they are
    returned. We have not discussed other possible uses, and that is most other uses
    of optional. For example, you should never use optionals as map values. If you
    do, either the key is absent from the map, or it can be present and map to an
    empty optional. This represents complexity with great potential for confusion
    and errors. **It is almost never appropriate to use an optional as a key, value,
    or element in a collection or array.**


    This leaves a big question unanswered. Is it ever appropriate to store an optional
    in an instance field? Often it is a "bad smell", it suggests that you should have
    a subclass containing the optional fields. But sometimes it may be justified.
    Consider the case of our **NutritionFacts** class in Item 2. A NutritionFacts
    instance contains many fields that are not required. You can''t have a subclass
    which make it so awkward to express absence directly. The best API for **NutritionFacts**
    would return an optional from the getter for each optional field, so it makes
    good sense to store these optionals as fields in the object.


    In summary, if you find writing a method that can''t always return a value and
    you believe it is important that users of the method consider this possibility
    every time they call it, then you should probably return an optional. You should,
    however, be aware that there are real performance consequences associated with
    returning optionals; for performance-critical methods, it may be better to return
    a null or throw an exception. Finally, you rarely use an optional in any other
    capacity than as a return value.'
