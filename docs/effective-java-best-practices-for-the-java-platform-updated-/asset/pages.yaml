    \ this Javadoc fragment:\n\n+   A geometric series converges if {@literal |r|\
    \ < 1}.\n\ngenerates the documentation: \"A geometric series converges if |r|\
    \ < 1.\" The {@literal} tag could have been placed around the less-than sign rather\
