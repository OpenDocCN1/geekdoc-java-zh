  md: 'While these internal copies can usually be made by calling clone recursively,
    this is not always the best approach. If the class contains only primitive fields
    or references to mutable objects, then it is likely the case that no fields need
    to be copied. There are exceptions to this rule. For example, a field representing
    a serial number or other unique ID will need to be copied even if it is primitive
    or immutable.


    Is all this complexity necessary? Rarely. If you extend a class that already implements
    Cloneable, you have little choice but to implement a well-behaved clone method.
    Otherwise, you are usually better off providing an alternative method of object
    copying. **A better approach to object copying is to provide a copy constructor
    or copy factory.** A copy constructor is simply a constructor that takes a single
    argument whose type is the class containing the constructor, for example:


    ```

    // Copy constructor

    public Yum(Yum yum) { ... };

    ```


    A copy factory is the static factory (Item 1) analogue of a copy constructor:


    ```

    // Copy factory

    public static Yum instance(Yum yum) { ... };

    ```


    The copy constructor and its static factory variant have many advantages over
    Cloneable/clone; they don''t rely on a risk-prone extraliguint object creation
    mechanism; they don''t demand unenforceable adherence to documented conventions;
    they don''t conflict with the proper use of final fields; they don''t throw unchecked
    exceptions; and don''t require costs.


    Furthermore, a copy constructor or factory can take any argument whose type is
    implemented by the class. For example, by convention all general-purpose collection
    implementations provide a constructor whose argument is of type Collection or
    Map. Interface-based copy constructors and factories, are properly known as *conversion
    constructors* and *conversion factories*, allowing the client to accept the implementation
    type of copy rather than the concrete class. For example, if you have a HashMap,
    and you want to copy it as a TreeSet, the clone method can''t offer this functionality,
    but it''s easy to use a constructor like new TreeSet(map).


    Given all the problems associated with Cloneable, new interfaces should not extend
    it, and new extendable classes should not implement it. While it''s less harmful
    for final classes to implement Cloneable, this should be viewed as a performance
    optimization, reserved for the rare cases where it is justified (Item 67).

    As a rule, copy functionality is best provided by constructors or factories. A
    notable exception to this rule is arrays, which are best copied with the clone
    method.'
