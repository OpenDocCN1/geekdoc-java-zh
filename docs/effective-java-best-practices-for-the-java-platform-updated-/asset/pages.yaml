  md: In summary, don't use Float or double for any calculations that require an exact
    answer. Use BigDecimal if you want the system to keep track of the decimal point
    and you don't mind the inconvenience and cost of not using a primitive type. Using
    BigDecimal has the added advantage that it gives you full control over rounding,
    letting you select from eight rounding modes whenever an operation entails rounding.
    This is very handy if you're performing business calculations with legally mandated
    rounding behavior. If performance is the essence, you don't mind keeping track
    of the decimal point yourself, and the quantities aren't too big, use int or long.
    If the quantities don't exceed nine decimal digits, you can use int; if they don't
    exceed eighteen digits, you can use long. If the quantities might exceed eighteen
    digits, use BigDecimal.
