  md: '# ITEM 48: USE CAUTION WHEN MAKING STREAMS PARALLEL 223


    it takes roughly twice to find each as it did to find the previous one. Thus,
    the cost of computing a single element is roughly equal to the cost of computing
    all previous elements combined, and this innocuous-looking pipeline brings the
    automatic parallelization algorithm to its knees. The moral of this story is:
    Do not parallelize stream pipelines indiscriminately.


    As a rule, performance gain from parallelism is seen on streams over ArrayList,
    List, HashMap, HashSet, and ConcurrentHashMap instances; arrays; 10 to 100 ranges
    long. These data structures have in common that they can all be easily and cheaply
    split into subranges of any desired size, which makes it easy to work among parallel
    threads. The abstraction used by the streams to perform this task is the splitter,
    which is returned by the splitter method on the Stream API.


    Another important factor that all of these data structures have in common is that
    they provide good-excellent locality of reference when processed sequentially:
    sequential elements are stored together in memory. The objects referred to by
    these references may not be close to one another in memory, which reduces locality-of-reference.
    Locality-of-reference turns out to be critically important for parallelizing bulk;
    without it, threads spend much of their time idle, waiting for data to be transferred
    from memory to the processor''s cache. The data structures with the best locality
    of reference are primitive arrays because the data itself is stored contiguously
    in memory.


    The nature of a stream pipeline''s terminal operation also affects the effectiveness
    of parallel execution. If a significant amount of work is done in the terminal
    operation compared to the overall work of the pipeline and that operation is inherently
    sequential, parallelizing the pipeline will have limited effects. The best terminal
    operations for parallelism are reductions, where all of the elements from the
    pipeline are combined using one of Stream''s reduction methods, or prepackaged
    reductions such as min, max, count, and sum. The short-circuiting operations like
    findFirst() are also amenable to parallelism. The operations performed by Stream''s
    collect method, which are known as mutable reductions, are not good candidates
    for parallelism because the overhead of combining collections is costly.


    If you write your own Stream, Iterable, or Collection implementation and you want
    decent parallel performance, you must override the splitter method and test the
    parallel performance of the remaining streams extensively. Writing high-quality
    splitters is difficult and beyond the scope of this book.'
