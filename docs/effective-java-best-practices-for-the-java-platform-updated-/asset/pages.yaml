  md: "Incidentally, note that this program catches two different exception types\
    \ in one catch clause. This facility, formally known as *multi-catch*, was added\
    \ in Java 7. It can greatly increase the clarity and reduce the size of programs\
    \ that behave the same way in response to multiple exception types.\n\nWhen we\
    \ run this program, we get an exception; we get a deadlock. The background thread\
    \ calls, *removesObserver*, which attempts to lock observers, but it can't acquire\
    \ the lock, because the main thread already has the lock. All while the main thread\
    \ is waiting for the background thread to finish removing the observer, which\
    \ explains the deadlock.\n\nThis example is contrived because there is no reason\
    \ for the observer to use a background thread to unsubscribe itself, but the problem\
    \ is real. Invoking alien methods from within synchronized regions has caused\
    \ deadlocks in real systems, such as GUI tools.\n\nIn both of the examples (the\
    \ exception and the deadlock) we were lucky. The lock was in a consistent state\
    \ when the alien method (added) was invoked. Suppose you were to invoke an alien\
    \ method from a synchronized region while the invariant protected by the synchronized\
    \ region was temporarily violated. Because locks in the Java programming language\
    \ are reentrant, calls won't deadlock. As in the first example, which resulted\
    \ in an exception, the calling thread already has the lock, so the thread would\
    \ succeed when it tries to acquire the lock, even though another unrelated operation\
    \ is in progress on the data guarded by the lock. The consequences of such a failure\
    \ can be catastrophic. In essence, the lock has failed to do its job. Recent locks\
    \ simplify the construction of multithreaded object-oriented programs, but they\
    \ can turn failures into safety failures.\n\nLuckily, it is usually not hard to\
