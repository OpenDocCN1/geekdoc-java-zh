  md: "# ITEM 82: DOCUMENT THREAD SAFETY\n\nthread-hostile class on purpose; such\
    \ classes typically result from the failure to consider concurrency. When a class\
    \ or method is found to be thread-hostile, it is typically fixed or deprecated.\
    \ The generateSerialNumber method in Item 78 would be thread-hostile in the absence\
    \ of internal synchronization, as discussed on page 322.\n\nThese categories (apart\
    \ from thread-hostile) correspond roughly to the thread safety annotations in\
    \ Java Concurrency in Practice, which are Immutable, ThreadSafe, and NotThreadSafe\
    \ [Goet06, Appendix A]. The unconditionally and conditionally thread-safe annotations\
    \ in the above taxonomy are covered under the ThreadSafe annotation.\n\nDocumenting\
    \ a conditionally thread-safe class requires care. You must indicate invocation\
    \ sequences require external synchronization, and lock (or in rare cases, locks)\
    \ must be acquired to execute these sequences. Typically it the lock on the instance\
    \ itself, but there are exceptions. For example, the documentation for Collections.synchronizedMap\
    \ says this:\n\nIt is imperative that you manually synchronize on the returned\
    \ map when iterating over its collection views:\n\n```\nMap<K, V> m = Collections.synchronizedMap(new\
    \ HashMap<>());\nSet<K> s = m.keySet(); // Need't be in synchronized block\n...\n\
    sychronized(m) { // Synchronizing on m, not s\n  for (K key : s) {\n    key.get();\n\
    \  }\n```\n\nFail to follow this advice may result in non-deterministic behavior.\n\
    \nThe description of a class's thread safety guarantees in the class's comment,\
    \ with special thread safety properties should describe these properties in their\
    \ documentation comments. It is not necessary to document the immutability of\
    \ enum types. It is obvious from the return type, factories that one must document\
    \ the safety of the returned object, as demonstrated by Collections.synchronizedMap(above).\n\
    \nWhen a class commits to using a publicly accessible lock, it enables clients\
    \ to execute a sequence of method invocations atomically, but this flexibility\
    \ comes at a price. It is incompatible with high-performance internal concurrency\
    \ control, of the sort used by concurrent collections such as ConcurrentHashMap.\
    \ Also, a client can mount a denial-of-service attack by holding the publicly\
    \ accessible lock for a prolonged period. This can be done accidentally or intentionally."
