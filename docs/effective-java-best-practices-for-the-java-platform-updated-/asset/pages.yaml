  md: 'ITEM 74: DOCUMENT ALL EXCEPTIONS THROWN BY EACH METHOD 305


    It should be noted that documenting all of the unchecked exceptions that each
    method can throw is an ideal, not always achievable in the real world. When a
    class undergoes revision, it is not a violation of source or binary compatibility
    if an exported method is modified to throw additional unchecked exceptions. Suppose
    a class invokes a method from another, independently written class. The authors
    of the former class may carefully document all of the unchecked exceptions that
    each method throws, but if the later class is revised to throw additional unchecked
    exceptions, it is quite likely that the former class (which has not undergone
    revision) will propagate the new unchecked exceptions even though it does not
    document them.


    If an exception is thrown by many methods in a class for the same reason, you
    can document the exception in the class''s documentation comment rather than documenting
    it for each method. A common example is NullPointerException. It is fine for a
    class''s documentation comment to say, "All methods in this class throw a NullPointerException
    if a null object reference is passed in any parameter," or words to that effect.


    In summary, document every exception that can be thrown by each method that you
    write. This is true for unchecked as well as checked exceptions, and for abstract
    as well as concrete methods. This documentation should take the form of @throws
    tags in doc comments. Declare each checked exception individually in a method''s
    throws clause, but not declare unchecked exceptions. If you fail to document the
    exceptions that your methods can throw, it will be difficult or impossible for
    others to make effective use of your classes and interfaces.'
