  md: "This method throws an IllegalArgumentException if the given collection is empty.\
    \ We mentioned in Item 30 that a better alternative would be to return Optional<E>.\
    \ Here's how the method looks when it is modified to do so:\n\n```\n// Returns\
    \ maximum value in collection as an Optional<E>\npublic static <E extends Comparable<E>>\n\
    Optional<E> max(Collection<E> c) {\n    if (c.isEmpty())\n        return Optional.empty();\n\
    \    E result = null;\n    for (E e : c) {\n        if (result == null || e.compareTo(result)\
    \ > 0)\n            result = Objects.requireNonNull(e);\n    }\n    return Optional.of(result);\n\
    ```\n\nAs you can see, it is straightforward to return an optional with the appropriate\
    \ static factory. In this program, we use two: Optional.empty() returns an empty\
    \ optional, and Optional.of(value) returns an optional containing the non-null\
    \ value. It is a programming error to passing null to Optional.of(value). If you\
    \ do, the method responds by throwing a NullPointerException. Optional.ofNullable(value)\
    \ method accepts possibly null value and returns an empty optional if null is\
    \ passed in.\nNever return a null value from an Optional-returning method: it\
    \ defeats the entire purpose of the utility.\n**Optionals are similar in spirit\
    \ to checked exceptions**\nMany terminal operations operate on streams optional.\
    \ If we rewrite the method to use a stream, Stream's max operation does the work\
    \ of generating an optional for us (though we have to pass in an explicit comparator):\n\
    \n```\n// Returns max val in collection as Optional<E> - uses stream\npublic static\
    \ <E extends Comparable<E>>\nOptional<E> max(Collection<E> c) {\n    return c.stream().max(Comparator.naturalOrder());\n\
    }\n```\n\nSo how do you choose to return an optional instead of returning a null\
    \ or throwing an exception? Optionals are similar in spirit to checked exceptions\
    \ (Item 71), in that they *force the use of* an API to confront the fact that\
    \ there may be no value returned. Throwing an unchecked exception or returning\
    \ a null allows the user to ignore this eventuality, with potentially dire consequences.\
    \ However, throwing a checked exception requires additional boilerplate code in\
    \ the client."
