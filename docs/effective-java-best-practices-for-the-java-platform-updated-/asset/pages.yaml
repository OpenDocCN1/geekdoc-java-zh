    \ result = Short.compare(areaCode, pn.areaCode);\n    if (result == 0) {\n   \
    \     result = Short.compare(prefix, pn.prefix);\n        if (result == 0) {\n\
    \            result = Short.compare(lineNum, pn.lineNum);\n        }\n    }\n\
    \    return result;\n```"
