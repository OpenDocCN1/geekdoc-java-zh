  md: "# ITEM 51: PREFER CONCURRENCY UTILITIES TO WAIT AND NOTIFY\n\nthe worker threads\
    \ ready themselves to run the action before the timer thread starts the clock.\
    \ When the last worker is ready to run the action, the timer thread \"fires the\
    \ starting gun,\" allowing the worker threads to perform the action. As soon as\
    \ the last worker thread finishes performing the action, the timer thread stops\
    \ the clock. Implementing this logic directly on top of wait and notify would\
    \ be messy to say the least, but it is surprisingly straightforward on top of\
    \ CountDownLatch:\n\n```\n// Simple framework for timing concurrent execution\n\
    public static long count(Executor executor, int concurrency, \n    Runnable action)\
    \ throws InterruptedException {\n    CountDownLatch ready = new CountDownLatch(concurrency);\n\
    \    CountDownLatch start = new CountDownLatch(1);\n    CountDownLatch done =\
    \ new CountDownLatch(concurrency);\n\n    for (int i = 0; i < concurrency; i++)\
    \ {\n        executor.execute(() -> {\n            try {\n                ready.countDown();\
    \ // Wait till all peers are ready\n                start.await(); // Wait for\
    \ all workers to be ready\n                action.run();\n            } catch\
    \ (InterruptedException e) {\n                Thread.currentThread().interrupt();\n\
    \            } finally {\n                done.countDown(); // Tell timer we're\
    \ done\n            }\n        });\n    }\n```\n\n```\n// Wait for all workers\
    \ to be ready\nlong nanoseconds = System.nanoTime();\nstart.countdown(); // And\
    \ they're off\ndone.await(); // Wait for all workers to finish\nreturn System.nanoTime()\
    \ - nanoseconds;\n```\n\nNote that the method uses three countdown latches. The\
    \ first, is used by worker threads to tell the timer when they're ready. The worker\
    \ threads wait on the second latch, which is start. When the last worker thread\
    \ invokes ready.countdown(), the timer thread records the start time and invokes\
    \ start.countdown(), allowing all of the worker threads to proceed. The timer\
    \ waits on the third latch, until the last of the worker threads finishes running\
    \ the action and calls done.countDown. As soon as this happens, the timer thread\
    \ awakens and records the end time."
