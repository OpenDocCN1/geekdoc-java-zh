  md: '# CHAPTER 6 ENUMS AND ANNOTATIONS


    doesn''t provide namespaces for int enum groups. Prefixes prevent name clashes
    when two int enum groups have identically named constants, for example between
    ELEMENT_MERCURY and PLANET_MERCURY.


    Programs that use int enums are brittle. Because int enums are constant variables
    [JLS, 4,12,4], their int values are compiled into the clients that use them [JLS,
    13.1]. If the value associated with an int enum is changed, its clients must be
    recompiled, or the clients will still run, but their behavior will be incorrect.


    There is no way to translate int enums into printable strings. it can escape detection
    or display it from a debugger unless it is a number, which isn''t very helpful.
    There is no reliable way to iterate over all the int enums in a group, or to obtain
    the size of an int enum group.


    You may encounter a variant of that in which String constants are used in place
    of int constants. This variant, known as the String enum pattern, is less desirable.
    While it does provide printable strings for its constants, it might lead users
    to hard-code string into client code instead of using fields. If a hard-coded
    string constant takes a typographical error, it will escape detection at completion
    time and result in bugs at runtime. Because it relies on string comparisons.


    Luckily, Java provides an alternative that avoids all the shortcomings of the
    int and string enum patterns and provides many added benefits. It is the enum
    type [JLS, 8.9]. Here''s how it looks in its simplest form:


    ```

    public enum Fruit { FUJI, PIPPIN, GRANNY_SMITH }

    public enum Orange { NAVEL, TEMPLE, BLOOD }

    ```


    On the surface, these enum types may appear similar to those of other languages,
    such as C, C++, and C#. Java''s enum types are deceiving. They are full-fledged
    classes, far more powerful than their counterparts in other languages, which are
    essentially int enums.


    The basic idea behind Java''s enum is simple: they are classes that export one
    instance for each constant via a static final field. Enum types are effectively
    final, by virtue of having no accessible constructors. Because clients can neither
    create instances of an enum type extend it, there can be no instances besides
    the declared enum constants. In other words, enums are instance-controlled (page
    6). They are a generalization of singletons (Item 3), which are essentially single-element
    enums.


    Enums provide compile-time safety. If you declare a parameter to be of type Apple,
    you are guaranteed that any non-null object passed to the parameter is one of
    the valid Apple values. Attempts to pass values of the'
