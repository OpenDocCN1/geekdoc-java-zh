    \ how to make best use of these facilities.\n\n# ## Item 2: Prefer lambdas to\
    \ anonymous classes\n\nHistorically, interfaces (or, rarely, abstract classes)\
    \ with a single abstract method were used as function types. Their instances represent\
    \ function objects or actions. Since JDK 1.1 was released in 1997, the primary\
    \ means of creating a function object was the anonymous class (see Item 2a). Here's\
    \ a code snippet to sort a list of strings, in order of length, using an anonymous\
    \ class to create the sort's comparison function (which imposes the sort order):\n\
    \n```\n// Anonymous class instance as a function object - obsolete!\nCollections.sort(new\
    \ Comparator<String>(){\n    public int compare(String s1, String s2) {\n    \
    \    return Integer.compare(s1.length(), s2.length());\n    }\n});\n```\n\nAnonymous\
    \ classes were adequate for the complex object-oriented design patterns requiring\
    \ function objects, notably the Strategy pattern [Gamma95]. The Comparator interface\
    \ represents an abstract strategy for sorting; the anonymous class is a concrete\
    \ strategy for sorting strings. The verbosity of anonymous classes made functional\
    \ programming in Java an unappealing prospect.\n\nIn Java 8, the language formalized\
    \ the notion that interfaces with a single abstract method are special and deserve\
    \ special treatment. These interfaces are now known as functional interfaces,\
    \ and the language allows you to create instances of these interfaces using lambda\
    \ expressions, or lambdas for short:"
