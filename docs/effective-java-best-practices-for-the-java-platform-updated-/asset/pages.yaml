  md: "Here is a typical example of a safe use of a generic varargs parameter. This\
    \ method takes an arbitrary number of lists as arguments and returns a single\
    \ list containing the elements of all of the input lists in sequence. Because\
    \ the method is annotated with @SafeVarargs, it doesn't generate any warnings,\
    \ on the declaration or at its sites:\n\n// Safe method with a generic varargs\
    \ parameter\n\n```\n@SafeVarargs\nstatic <T> List<T> flatten(List<? extends T>\
    \ T... lists) {\n    List<T> result = new ArrayList<>();\n    for (List<? extends\
    \ T> list : lists) {\n        result.addAll(list);\n    }\n    return result;\n\
    }\n```\n\nThe rule for when to use the SafeVarargs annotation is simple: Use @SafeVarargs\
    \ on every method with a varargs parameter, so its users won't be burdened by\
    \ needless and confusing compiler warnings. This implies that they should never\
    \ use unsafe methods like dangerous or toArray. Every time the compiler warns\
    \ you of possible heap pollution from a generic varargs parameter in a method\
    \ you control, check that the method is safe. As a reminder, a generic varargs\
    \ method is safe if:\n\n+   1. It doesn't store anything in the varargs array,\n\
    2. It doesn't make the array (or a copy) visible to untrusted code.\n\nIf either\
    \ of these conditions is violated, fix it.\nNote that the SafeVarargs annotation\
    \ is legal only on methods that can't be overridden, because it is impossible\
    \ to guarantee that every possible overriding method will be safe. In Java 8,\
    \ the annotation was legal only on static methods and final methods; in Java 9,\
    \ it became legal on private instance methods as well.\n\nAn alternative to the\
    \ SafeVarargs annotation is to take the advice of Item 28 and replace the varargs\
    \ parameter (which is an array in disguise) with a List parameter. Here's how\
    \ approach looks when applied to our flatten method. Note that only the parameter\
    \ declaration has changed:\n\n// List as a typesafe alternative to a generic varargs\
    \ parameter\n\n```\nstatic <T> List<T> flatten(List<List<? extends T>> lists)\
    \ {\n    List<T> result = new ArrayList<>();\n    for (List<? extends T> list\
    \ : lists) {\n        result.addAll(list);\n    }\n    return result;\n}\n```"
