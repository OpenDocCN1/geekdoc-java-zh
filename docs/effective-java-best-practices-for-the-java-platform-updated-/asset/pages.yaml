  md: "# ITEM 71: AVOID UNNECESSARY USE OF CHECKED EXCEPTIONS\n\nYou can also turn\
    \ a checked exception into an unchecked exception by breaking the method that\
    \ throws the exception into two methods, the first of which returns a boolean\
    \ indicating whether the exception would be thrown. API refactoring transforms\
    \ the calling sequence from this:\n\n```\n// Invocation with checked exception\n\
    try {\n    obj.action(args);\n} catch (TheCheckedException e) {\n    ... // Handle\
    \ exceptional condition\n}\n```\n\ninto this:\n\n```\n// Invocation with state-testing\
    \ method and unchecked exception\nif (obj.actionPermitted(args)) {\n    obj.action(args);\n\
    } else {\n    ... // Handle exceptional condition\n}\n```\n\nThis refactoring\n\
    \nThis refactoring is not always appropriate, but where it is, it can make an\
    \ API more pleasant to use. While the latter calling sequence is no pretier than\
    \ the former, or is content to let the thread terminate if it fails, the refactoring\
    \ also allows this trivial calling sequence:\n\n```\nobj.action(args);\n```\n\n\
    If you suspect that the trivial calling sequence will be the norm, then the API\
    \ refactoring may be appropriate. The resulting API is essentially the state-testing\
    \ method in: if an object is to be accessed concurrently without external synchronization\
    \ or it is externally induced state transitions, this refactoring is inappropriate\
    \ because the state may change between the calls to actionPermitted and action.\
    \ If a separate actionUnderTest method would invalidate the work of the action\
    \ method, the refactoring may be ruled out on performance grounds.\n\nIn summary,\
    \ when used sparingly, checked exceptions can increase the reliability of programs;\
    \ when overused, they make APIs painful to use. If callers won't be able to recover\
    \ from failures, throw unchecked exceptions. If recovery may be possible and you\
    \ want to force callers to handle exceptional conditions, first consider returning\
    \ an optional. Only if this would provide insufficient information in the case\
    \ of failure should you throw a checked exception."
