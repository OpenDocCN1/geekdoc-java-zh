- img_proc: true
  md: "Such tagged classes have numerous shortcomings. They are cluttered with boilerplate,\
    \ including enum declarations, tag fields, and switch statements. Readability\
    \ is further hampered because multiple implementations are jumbled together in\
    \ a single class. Memory footprint is increased because instances are burdened\
    \ with irrelevant fields belonging to other flavors. Fields can't be made final\
    \ without initializing irrelevant fields, resulting in more boilerplate. Constructors\
    \ must set the tag field and initialize the right data fields with no help from\
    \ the compiler; if you initialize the wrong fields, the program will fail at runtime.\
    \ You can't add a flavor to a tagged class unless you modify its source file.\
    \ If you do add a flavor you must remember to add a case to every switch statement,\
    \ or the class will fail at runtime. Finally, the data type of an instance gives\
    \ no clue as to its flavor. In short, tagged classes are verbose, error-prone,\
    \ and inefficient.\n\nLuckily, object-oriented languages such as Java offer a\
    \ better alternative for defining a data type capable of representing objects\
    \ of a hierarchy. Subtyping. A tagged class is just a pall imitation of a hierarchy.\n\
    \nTo transform a tagged class into a hierarchy, first define an abstract class\
    \ containing an abstract method for the tagged class whose behavior depends on\
    \ the tag value. In Figure class, there is only one such method, which is area.\
    \ This abstract class is the root of the class hierarchy. If there are any methods\
    \ whose behavior does not depend on the value of the tag, put them in this class.\
    \ Similarly, if there are any fields used by all the flavors, put them in this\
    \ class. There are no such flavor-independent methods or fields in the Figure\
    \ class.\n\nNext, define a concrete subclass of the root class for each flavor\
    \ of the original tagged class. For example, we have two subclasses: circle and\
    \ rectangle. Each include subclass the data fields particular to its flavor. In\
    \ our example, radius is particular to circle, and length and width are particular\
    \ to rectangle. Also include in each subclass the appropriate implementation of\
    \ each abstract method in the root class. Here is the class hierarchy corresponding\
    \ to the original Figure class:\n\n// Class hierarchy replacement for a tagged\
    \ class\n\n```\nclass Figure {\n    abstract double area();\n}\n\nclass Circle\
    \ extends Figure {\n    final double radius;\n\n    Circle(double radius) { this.radius\
    \ = radius; }\n\n    @Override double area() { return Math.PI * (radius * radius);\
    \ }\n}\n```"
  merge: -1
