  md: "# Item 50: Make defensive copies when needed\n\nOne thing that makes Java a\
    \ pleasure to use is that it is a safe language. This means that in the absence\
    \ of native methods it is immune to buffer overflows, array overruns, wild pointers,\
    \ and other memory corruption errors that plague unsafe languages as C and C++.\
    \ In a safe language, it is possible to write classes and know with certainty\
    \ that their invariants will hold, no matter what happens in any part of the system.\
    \ This is not possible in languages that treat all of memory as one giant array.\n\
    \nEven in a safe language, you aren't immune from other classes without some effort\
    \ on your part. You must program defensively, with the assumption that clients\
    \ of your class will do their best to destroy its invariants. This is increasingly\
    \ true as people try harder to break the security of systems, but more commonly,\
    \ your class will have to cope with unexpected behavior resulting from honest\
    \ mistakes of well-intentioned programmers. Either way, it is worth taking the\
    \ time to write classes that are robust in the case of ill-behaved clients.\n\n\
    While it is impossible for another class to modify an object's internal state\
    \ without assistance from the object, it is surprisingly easy to provide such\
    \ assistance without meaning to do so. For example, consider the following class,\
    \ which purports to represent an immutable period:\n\n```\n// \"immutable\" time\
    \ period class\npublic final class Period {\n    private final Date start;\n \
    \   private final Date end;\n\n    /**\n     * @param the beginning of the period\n\
    \     * @param the end of the period; must not precede start\n     * @throws IllegalArgumentException\
    \ if start is after end\n     * @throws NullPointerException if start or end is\
    \ null\n     */\n    public Period(Date start, Date end) {\n        if (start.compareTo(end)\
    \ > 0)\n            throw new IllegalArgumentException(\n                start\
    \ + \" after \" + end);\n        this.start = start;\n        this.end = end;\n\
    \    }\n\n    public Date start() {\n        return start;\n    }\n}\n```"
