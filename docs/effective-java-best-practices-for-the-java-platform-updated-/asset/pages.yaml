    \ as well as all enum types (Item 34), implement Comparable. If you are writing\
    \ a class with an obvious ordering, such as alphabetical order, or chronological\
    \ order, you should implement the Comparable interface:\n\n```\npublic interface\
    \ Comparable<T> {\n    int compareTo(T o);\n}\n```\n\nThe general contract of\
    \ the compareTo method is similar to that of equals:\npares this object with the\
    \ specified object for order. Returns a negative integer, zero, or a positive\
