    but its immutability has many advantages. **Immutable objects are simple**. An
    immutable object can be in exactly one state, the state in which it was guaranteed
    that these invariants will remain true for all time, with no further effort on
    your part or the part of the program that uses the class. This means that you
    don''t have to worry about who uses the class. Mutable objects, on the other hand,
    can have arbitrary state spaces. If the documentation does not provide a precise
    description of the state transitions performed by mutator methods, it can be difficult
    or impossible to use a mutable class.


    **Immutable objects are inherently thread-safe; they require no synchronization.**
    They cannot be corrupted by multiple threads accessing them concurrently. This
    is far away from the approach to achieve thread safety. Since there can never
    observe any effect of another thread on an immutable object, **immutable objects
    can be shared freely**. Immutable classes should encourage clients to reuse existing
    instances wherever possible. One way to do this is to provide public static constants
    for commonly used values. For example, the Complex class might provide these:


