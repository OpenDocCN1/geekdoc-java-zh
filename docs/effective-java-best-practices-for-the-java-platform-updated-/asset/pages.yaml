  md: '# Item 64: Refer to objects by their interfaces


    Item 51 says that you should use interfaces rather than classes as parameter types.
    More generally, you should favor the use of interfaces over classes to refer to
    objects. If appropriate interface types exist, then parameters, return values,
    variables, and fields should all be declared using interface types. The only time
    you really need to refer to an object''s class is when you''re creating it with
    a constructor. To make this concrete, consider the case of LinkedHashSet, which
    is an implementation of the Set interface. Get in the habit of typing this:


    ```

    // - uses interface as type

    Set<S> sonSet = new LinkedHashSet<>();

    ```


    not this:


    ```

    // - uses class as type

    LinkedHashSet<S> sonSet = new LinkedHashSet<>();

    ```


    If you get into the habit of using interfaces as types, your program will be much
    more flexible. If you decide that you want to switch implementations, you only
    have to change the class name in the constructor (or use a different strategy
    factory). For example, the first declaration could be changed to read:


    ```

    Set<S> sonSet = new HashSet<>();

    ```


    and all of the surrounding code would continue to work. The surrounding code was
    unaware of the old implementation type, so it would be oblivious to the change.

    There is one caveat: if the original implementation offered some special functionality
    not required by the general contract of the interface and the code depended on
    that functionality, it is critical that the new implementation provides the same
    functionality. For example, if the code surrounding the first declaration depended
    on LinkedHashSet''s ordering policy, then it would be incorrect to substitute
    HashSet for LinkedHashSet in the declaration, because HashSet makes no guarantees
    concerning iteration order.

    So why would you want to change an implementation type? Because the second implementation
    offers better performance than the original, or because it offers desirable functionality
    that the original implementation lacks. For example, suppose a field contains
    a HashMap instance. Changing it to an EnumMap will provide better performance
    and iteration order consistent with the natural order of the keys, but you can
    only use an EnumMap if the key type is an enum type.'
