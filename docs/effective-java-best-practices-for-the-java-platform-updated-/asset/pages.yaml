  md: "# Item 33: Consider typesafe heterogeneous containers\n\nCommon uses of generics\
    \ include collections, such as Set<E> and Map<K,V>, and single-element containers,\
    \ such as ThreadLocal<T> and AtomicReference<T>. In all of these uses, it is the\
    \ container that is parameterized. This limits to a fixed number of parameters\
    \ per container. Normally that is exactly what you want. A Set has a single type\
    \ representing its element; a Map has two, its key and value types; and so forth.\n\
    \nSometimes, however, you need more flexibility. For example, a database row can\
    \ have many columns, and it would be nice to access all of them in a typesafe\
    \ manner. Frankly, there is an easy way to achieve this effect. The idea is to\
    \ parametrize the key instead of the container. Then the parameterized key retrieves\
    \ the value. The generic type system is used to guarantee that the type of the\
    \ values agrees with its key.\n\nAs a example of this approach, consider a Favorites\
    \ that allows its clients to store and retrieve a favorite instance of many types.\
    \ The Class for the type will play the part of the parameterized key. The reason\
    \ this works is that Class is generic. The type of a class literal is not simply\
    \ Class, but Class<T>. For example, String.class is of type Class<String>, and\
    \ Integer.class is of type Class<Integer>. When a class literal is passed along\
    \ methods to provide compile-time and runtime type information, it is called a\
    \ token [Brachoida4].\n\nThe API for the Favorites class is simple. It looks just\
    \ a simple map, except that the key is parameterized instead of the map. The client\
    \ presents a Class object when setting and getting favorites. Here is the API:\n\
    \n// Typesafe heterogeneous container pattern - API\n\n```\npublic class Favorites\
    \ {\n    public void put(Class<T> type, T instance);\n    public <T> T get(Class<T>\
    \ type);\n}\n```\n\nHere is a sample program that exercises the Favorites class,\
    \ storing, retrieving, and printing a favorite String, and Class instance:\n\n\
    // Typesafe heterogeneous container pattern - client\n\n```\npublic static void\
    \ main(String[] args) {\n    Favorites f = new Favorites();\n    f.put(String.class,\
    \ \"Java\");\n    f.put(Integer.class, 0xcafebabe);\n    f.put(Class.class, Favorites.class);\n\
    }\n```"
