  md: "# Item 59: Know and use the libraries\n\nSuppose you want to generate random\
    \ integers from zero and some upper bound. Faced with this common task, many programmers\
    \ would write a little method that looks something like this:\n\n```\n// Common\
    \ but easily flawed\nstatic Random rnd = new Random();\nstatic int random(int\
    \ n) {\n    return Math.abs(rnd.nextInt()) % n;\n}\n```\n\nThis method may look\
    \ good, but it has three flaws. The first is that if n is a small power of two,\
    \ the sequence of random numbers will repeat itself after a fairly period. The\
    \ second flaw is that if n is not a power of two, some numbers will be returned\
    \ more frequently than others. If n is large, this effect can be quite pronounced.\
    \ This is powerfully demonstrated by the following program, which generates a\
    \ million random numbers in a carefully chosen range and prints how many of the\
    \ numbers fall in the lower half of the range:\n\n```\npublic static void main(String[]\
    \ args) {\n    int n = 2 * Integer.MAX_VALUE / 3;\n    int low = 0;\n    for (int\
    \ i = 0; i < 1000000; i++) {\n        if (random(n) < n/2)\n            low++;\n\
    \    }\n    System.out.println(low);\n}\n```\n\nIf the random method worked properly,\
    \ the program would print a number close to half million, but if you run it, you'll\
    \ find it prints a number close to 666,666. Two-thirds of the numbers generated\
    \ by the random method fall in the lower half of its range.\n\nThe third flaw\
    \ is that it can fail catastrophically, returning a number outside the specified\
    \ range. This is because the method attempts map the value returned by rnd.nextInt()\
    \ to a non-negative integer by calling Math.abs. If nextInt() returns Integer.MIN_VALUE,\
    \ Math.abs will return Integer.MIN_VALUE, and the remainder (%) will return a\
    \ negative number, assuming n is not a power of two. This will almost certainly\
    \ cause your program to fail, and the failure may be difficult to reproduce.\n\
    \nWrite a version of the random method that corrects these flaws, you'd have to\
    \ know a fair amount about pseudorandom number generators, number theory,"
