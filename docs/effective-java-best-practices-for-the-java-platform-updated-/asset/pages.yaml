  md: "# ITEM 5: PREFER DEPENDENCY INJECTION TO HARDWIRING RESOURCES\n\n```\n// Dependency\
    \ injection provides flexibility and testability\npublic class SpellChecker {\n\
    \    private final Lexicon dictionary;\n\n    public SpellChecker(Lexicon dictionary)\
    \ {\n        this.dictionary = Objects.requireNonNull(dictionary);\n    }\n\n\
    \    public boolean isValid(String word) { ... }\n    public List<String> suggestions(String\
    \ typo) { ... }\n}\n```\n\nThe dependency injection is so simple that many programmers\
    \ use it for years without knowing it has a name. While our spell checker example\
    \ had only a single resource (the dictionary), dependency injection works with\
    \ arbitrary number of resources and arbitrary dependency graphs. It preserves\
    \ immutability (Item 17), multiple clients can share dependent objects (assuming\
    \ the clients deserve it). Dependency injection is equally applicable to constructors,\
    \ static factories (Item 1), and builders (Item 2).\n\nA useful variant of the\
    \ pattern is to pass a resource factory to the constructor. A factory is an object\
    \ that can be called repeatedly to create instances of a type. Such factories\
    \ embody the Method pattern [Gamma5]. The Supplier<T> interface introduced in\
    \ Java 8, is perfect for representing dependencies. Methods that take a Supplier<T>\
    \ on input should typically constrain the factory's type using a bounded wildcard\
    \ type (Item 31) to allow the client to pass a factory that creates any subtype\
    \ of a specified type. For example, here is a method that makes a mosaic using\
    \ a client-provided factory to produce each tile:\n\n```\nMosaic create(Supplier<?\
    \ extends Tile> tileFactory) { ... }\n```\n\nAlthough dependency injection generally\
    \ improves flexibility and testability, it can clutter up projects, which often\
    \ contain thousands of dependencies. This can be all by using a dependency injection\
    \ framework, such as Dagger [Dagger], Guice [Guice], or Spring [Spring]. The use\
    \ of these frameworks is beyond the scope of this book but is widely adapted for\
    \ use.\n\nIn summary, do not use a singleton or static utility class to implement\
    \ a class that depends on one or more underlying resources whose behavior affects\
    \ that of the class, and do not have the class create these resources directly.\
    \ Instead, pass the resources, or factories to create them, into the constructor\
    \ (or static factory or builder). This practice, known as dependency injection,\
    \ will greatly enhance the flexibility, reusability, and testability of a class."
  merge: -1
  pgno: 41
