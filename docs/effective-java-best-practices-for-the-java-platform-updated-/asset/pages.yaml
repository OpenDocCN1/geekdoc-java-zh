  md: '# Item 72: Favor the standard exceptions


    An attribute that distinguishes expert programmers from less experienced ones
    is that experts strive for and usually achieve a high degree of code reuse. Exceptions
    are no exception to the rule that code reuse is a good thing. The Java libraries
    provide a set of exceptions that covers most of the exception-throwing needs of
    most APIs.


    Reusing standard exceptions has several benefits. Chief among them is it makes
    your API easier to learn and use because it matches the conventions that programmers
    are already familiar with. A second close is that programs using your API are
    easier to read because they aren''t cluttered with uncommon exceptions. Last (and
    least), fewer exception classes means smaller memory footprint and less overhead.


    The most commonly reused exception type is IllegalArgumentException (Item 49).
    This is generally the exception to throw when the caller passes in an argument
    value is inappropriate. For example, this would be the exception if the caller
    attempted to use a negative number in a parameter representing the number of times
    some action was to be repeated.


    Another commonly reused exception is IllegalStateException. This is generally
    the exception to throw when the invocation is illegal because of the state of
    the receiving object. For example, this would be the exception to throw if the
    caller attempted to use some object before it had been properly initialized.


    Arguably, every erroneous method invocation boils down to an illegal argument
    or state. If a caller passes null to some parameter for which null values are
    prohibited, NullPointerException detects this. Similarly, if a caller passes an
    out-of-range value in a parameter representing an index, IndexOutOfBoundsException
    should be thrown rather than IllegalArgumentException.


    Another possible is ConcurrentModificationException. It should be thrown if an
    object was designed for a single thread (or with external synchronization) detects
    that it is being modified concurrently. This exception is at a best hint because
    it detects that concurrent modification.


    A last standard of note is UnsupportedOperationException. This is the exception
    to throw if an object does not support an attempted operation. It is rare because
    most objects support all of their methods. This exception is used by classes that
    fail to implement one or more optional operations defined by an interface they
    implement. For example, an append-only List would throw this exception if someone
    tried to delete an element from the list.'
