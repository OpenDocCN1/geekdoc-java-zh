    \ constructor\nclass HigherLevelException extends Exception {\n    HigherLevelException(Throwableable\
    \ cause) {\n        super(cause);\n    }\n```\n\nMost exceptions have chaining-aware\
    \ constructors. For exceptions that\ndot can't set the cause using Throwable's\
    \ initCause method. Not only does\nexception chaining let you access the cause\
