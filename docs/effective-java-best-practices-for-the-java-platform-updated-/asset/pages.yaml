  md: "# Item 48: Use caution when making streams parallel\n\nAmong mainstream languages,\
    \ Java has always been at the forefront of providing facilities to ease the task\
    \ of concurrent programming. When Java was released in 1996, it had only built-in\
    \ support for threads, with synchronization and wait/notify. Java 5 introduced\
    \ the java.util.concurrent library, with concurrent collections and the executor\
    \ framework. Java 7 introduced the fork-join package, a high-performance framework\
    \ for parallel decomposition. Java 8 introduced streams, which can be parallelized\
    \ with a single call to the parallel method. Writing concurrent programs in Java\
    \ keeps getting easier, but writing concurrent programs that are correct and fast\
    \ is as difficult as it ever was. Safety and liveliness violations are a fact\
    \ of life in concurrent programming, and parallel stream pipelines are no exception.\n\
    \nConsider this program from Item 45:\n\n```\n// Stream-based program to generate\
    \ the first 20 Mersenne primes\npublic static void main(String[] args) {\n   \
    \ primes().map(p -> TWO.pow(p.intValue()).subtract(ONE))\n           .filter(mersenne\
    \ -> mersenne.isProbablePrime(50))\n           .limit(20)\n           .forEach(System.out::println);\n\
    }\n\nstatic BigInteger primes() {\n    return Stream.iterate(TWO, BigInteger::nextProbablePrime);\n\
    }\n```\n\nOn my machine, this program immediately starts running primes and takes\
    \ 12.5 seconds to run. Suppose I anyway tried to speed it up by adding a call\
    \ to parallel(1) to the stream pipeline. What do you think would happen to the\
    \ performance? What if it doesn't improve, but CPU usage spikes to 90 percent\
    \ and stays there indefinitely (a liveliness failure)? What if it gets a few percent\
    \ slower? The program might terminate unexpectedly, but I was unable to find out;\
    \ I stopped it it it off horribly after half an hour.\n\nWhat's going on here?\
    \ Simply put, the streams library has no how to parallelize this pipeline and\
    \ the heuristics fail. Even under the best of circumstances, parallelizing a pipeline\
    \ is unlikely to improve its performance if the source is from iterate, or the\
    \ intermediate operation limit is used. This pipeline has to contend with both\
    \ of these issues. Worse, the default parallelization strategy deals with the\
    \ unpredictability of limit by assuming there's no harm in processing a few extra\
    \ elements and discarding any unneeded results. In this case,"
