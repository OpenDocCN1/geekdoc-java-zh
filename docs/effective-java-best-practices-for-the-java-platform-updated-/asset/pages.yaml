  md: "```\npublic interface Songwriter {\n    Song compose(int chartPosition);\n\
    }\n```\n\nIn real life, some singers are also songwriters. Because we used interfaces\
    \ rather than abstract classes to define these types, it is perfectly permissible\
    \ for a single class to implement both Singer and Songwriter. In fact, we can\
    \ define a third interface that extends both Singer and Songwriter and adds new\
    \ methods that are appropriate to the combination:\n\n```\npublic interface SingerSongwriter\
    \ extends Singer, Songwriter {\n    AudioClip strum();\n    void actSensitive();\n\
    }\n```\n\nYou don't always need this level of flexibility, but when you do, interfaces\
    \ are a lifaver. The alternative is a bloated class hierarchy containing a separate\
    \ class for every supported combination of attributes. If there are n attributes\
    \ in the system, there are 2^n combinations that you might have to support. This\
    \ is what's known as a combinatorial explosion. Bloated class hierarchies can\
    \ lead to bloated classes with many methods that differ only in the type of arguments\
    \ because no hierarchy to capture common behavior.\n\n**Interfaces safe, powerful\
    \ functionality enhancements with the wrapper class idiom (Item 18).** If you\
    \ use abstract classes to define types, you leave the programmer to add functionality\
    \ with no choice but inheritance.\n\nThe resulting classes are less powerful and\
    \ more fragile than wrapper classes. When there is an obvious implementation of\
    \ an interface method in terms of other methods, consider providing an implementation\
    \ assistance to programmers in the default method. For an example of this technique,\
    \ use the remove method on page 104. If you provide default methods, you are to\
    \ document them for inheritance using the @impliedOverride Javadoc tag (Item 19).\n\
    \nThere are limits on how much implementation assistance you provide with default\
    \ methods. Although many interfaces specify the behavior of Object methods such\
    \ as equals(), you are not permitted to provide default methods for them. Also,\
    \ interfaces are not permitted to contain instance fields or nonresident static\
    \ methods (with the exception of private static methods). Finally, you can't add\
    \ default methods to an interface that you don't control\n\nYou can, however,\
    \ combine the advantages of interfaces and abstract classes by providing an skeletal\
    \ implementation class to go with an interface. The interface defines the type,\
    \ perhaps providing some default methods, while the skeletal implementation class\
    \ implements the remaining non-primitive interface"
