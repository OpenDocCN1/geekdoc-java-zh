  md: '# Item 66: Use native methods judiciously


    The Java Native Interface (JNI) allows Java programs to call native methods, which
    are methods written in native programming languages such as C or C++. Historically,
    native methods have had three main uses. They provide access to platform-specific
    facilities such as registers. They provide access to existing native code, including
    libraries that provide access to legacy data. Finally, native methods are used
    to write performance-critical parts of applications in native languages for improved
    performance.


    It is legitimate to use native methods to access platform-specific facilities,
    but it is seldom necessary; as the Java platform matured, it provided many features
    previously found only in platforms. For example, the API added to OS processes.
    It is also legitimate to use native methods when no equivalent libraries are available
    in Java.


    It is advisable to use native methods for improved performance. Early releases
    (prior to Java 3), it was necessary, but JVMs have gotten much faster since then.
    For most tasks, it is now possible to compare arithmetic in Java. For example,
    when java.math was added in release 1.1, BigInteger relied on a multiprecision
    arithmetic library written in C. In Java 3, BigInteger was rewritten in Java,
    and carefully tuned to the point where it ran faster than the original native
    implementation.


    A sad coda to this story is that BigInteger has changed little since then, with
    the exception of faster multiplication for large numbers in Java 8. In that work,
    continued on space on native libraries, notably GNU! Multiple Precision Library
    (GMP). Java programmers in need of truly high-performance arithmetic are now using
    GMP via native multiprecision arithmetic [Blum14]


    The use of native methods has several disadvantages. Because native languages
    are not safe (Item 50), native languages are more platform-dependent than Java,
    programs using native methods are less portable. They are also harder to debug.
    If you''re not careful, native methods can decrease performance because the garbage
    collector cannot automate, or even track, native memory usage (Item 8), and there
    is a cost associated with going into and out of native code. Finally, native methods
    require "glue code" that is difficult to read and tedious to write.


    In summary, think twice before using native methods. It is rare that you need
    to use them for improved performance. If you must use native methods to access
    low-level resources or native libraries, use as little native code as possible
    and test thoroughly. A single bug in the native code can corrupt your entire application.'
