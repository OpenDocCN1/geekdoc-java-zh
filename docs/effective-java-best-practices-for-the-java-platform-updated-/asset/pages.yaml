  md: "# ITEM 75: INCLUDE FAILURE-CAPTURE INFORMATION IN DETAIL MESSAGES\n\nOne way\
    \ to ensure that exceptions contain adequate failure-capture information in their\
    \ detail messages is to require this information in their constructors instead\
    \ of a string detail message. The detail message can then be generated automatically\
    \ to include the information. For example, instead of a String constructor, IndexOutOfBoundsException\
    \ could have had a constructor that looks like this:\n\n+   * Constructs an IndexOutOfBoundsException.\n\
    * @param lowerBound the lowest legal index value\n* @param upperBound the highest\
    \ legal index value plus one\n* @param index the actual value\n\n```\npublic IndexOutOfBoundsException(int\
    \ lowerBound, int upperBound, int index) {\n    // Generate a detail message that\
    \ captures the failure\n    super(String.format(\"Lower bound: %d, Upper bound:\
    \ %d, Index: %d\", lowerBound, upperBound, index));\n\n    // Save failure information\
    \ for programmatic access\n    this.lowerBound = lowerBound;\n    this.upperBound\
    \ = upperBound;\n    this.index = index;\n}\n```\n\nAs in Java 9, IndexOutOfBoundsException\
    \ acquired a constructor that takes an int index parameter, but omits the lowerBound\
    \ and upperBound parameters. More generally, the Java libraries don't make heavy\
    \ use of this idiom, but it is highly recommended. It makes it easy for the programmer\
    \ to capture the failure. In fact, it makes hard for the programmer not to capture\
    \ the failure! In effect, the idiom centralizes the code to generate a high-quality\
    \ detail message in the exception class, rather than requiring each user of the\
    \ class to generate the detail message redundantly.\n\nAs suggested in Item 70,\
    \ it may be appropriate to provide accessor methods for failure information (lowerBound,\
    \ upperBound, and index). It is more important to provide such accessor methods\
    \ on checked exceptions than unchecked, because the failure-capture information\
    \ could be useful in recovering from the failure. It is rare (although inconceivable)\
    \ that a programmer might want programmatic access to the details of an unchecked\
    \ exception. Even for unchecked exceptions, however, it seems advisable to provide\
    \ these accessors on general principle (Item 12, page 57)."
