  md: '# CHAPTER 4 CLASSES AND INTERFACES


    developed. Finally, information hiding decreases the risk in building large systems
    because individual components may prove successful even if the system does not.
    Java has many facilities to aid in information hiding. The access control mechanism
    specifies the accessibility of classes, interfaces, and members. The accessibility
    of an entity is determined by the location of its declaration and by which, if
    any, of the access modifiers—protected, or public—is present on the declaration.
    Proper use of these modifiers is essential to information hiding.


    The rule of thumb is: make each class or member as inaccessible as possible. Other
    words, use the lowest possible access level consistent with the function of the
    software that you are writing.


    For top-level (nested) classes and interfaces, there are only two possible access
    levels: package-private and public. If you declare a top-level class or interface
    with modifier, it will be package-private; otherwise, it will be public. If a
    top-level class or interface can be made private, it should be. By making it package-private,
    you make it part of the implementation rather than the exported API, and you can
    modify it, replace it, or eliminate it in a subsequent release without fear of
    harming existing clients. If you make it public, you are obligated to support
    it forever to maintain compatibility.


    If a package-private top-level class or interface is used by only one class, consider
    the top-level class a private static nested of the class that uses it. This reduces
    its accessibility from all classes in the package to the one class that uses it.
    But it is far more important to reduce the accessibility of a graciously public
    class than a package-private top-level class, as the public is part of the API.


    For members (fields, methods, nested classes, and nested interfaces), there are
    four possible access levels, listed here in order of increasing accessibility:


    +   **private**—The member is accessible only from the top-level class where it
    is declared.

    **package-private**—The member is accessible from any class in the package where
    it is declared. Technically known as default access, this is the access level
    you get if no access modifier is specified (except for interface members, which
    are public by default).

    **protected**——The member is accessible from subclasses of the class where it
    is declared (subject to few restrictions [JLS, 6.6.2]) and from any class in the
    package where it is declared.

    **public**—The member is accessible from anywhere.'
