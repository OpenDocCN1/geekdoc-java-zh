  md: "# Item 76: Strive for failure atomicity\n\nAfter an object throws an exception,\
    \ it is generally desirable that the object still be in a well-defined, usable\
    \ state, even if the failure occurred in the mid of performing an operation. This\
    \ is especially true for checked exceptions, from which the caller is expected\
    \ to recover. Generally speaking, a failed method invocation should leave the\
    \ object in the state that it was prior to the invocation. A method with such\
    \ property is to be failure-atomic.\n\nThere are several ways to achieve this\
    \ effect. The simplest is to design immutable objects (Item 17). If an object\
    \ is immutable, failure atomicity is free. If an operation fails, it may prevent\
    \ the object from getting corrupted, but it will never leave an existing object\
    \ in an inconsistent state, because the state of each object is consistent when\
    \ it is created and cannot be modified thereafter.\n\nFor methods that operate\
    \ on mutable objects, the most common way to achieve failure atomicity is to check\
    \ parameters for validity before performing the operation (Item 49). This causes\
    \ most exceptions to get thrown before modification commences. For example, consider\
    \ the Stack.pop method in Item 7:\n\n```\npublic Object pop() {\n    if (size\
    \ == 0)\n        throw new EmptyElementException();\n    Object result = elements[--size];\n\
    \    elements[size] = null; // Eliminate obsolete reference\n    return result;\n\
    }\n```\n\nIf the size check were eliminated, the method would throw an exception\
    \ when it attempted to pop an element from an empty stack. Or, however, leave\
    \ the size in an inconsistent (negative) state, causing any future method invocations\
    \ on the object to fail. Additionally, the ArrayIndexOutOfBounds thrown by the\
    \ pop method would be inappropriate to the abstraction (Item 7).\n\nA closely\
    \ related approach to achieving failure atomicity is to order the computation\
    \ so that any part that may fail takes place before any that modifies the object.\
    \ This approach is a natural extension of the previous one when arguments cannot\
    \ be checked without performing a part of the computation. For example, consider\
    \ the case of TreeMap, whose elements are sorted according to some order-ordering.\
    \ In order to add an element to a TreeMap, the element must be of a type that\
    \ can be compared using the TreeMap's ordering. Attempting to add an incorrectly"
