  md: "# Item 35: Use instance fields instead of ordinal\n\nMany enums are naturally\
    \ associated with a single int value. All enums have an ordinal method, which\
    \ returns the numerical position of each enum constant in its type. You may be\
    \ tempted to derive an associated int value from the ordinal:\n\n```\n// Abuse\
    \ of ordinal to derive an associated value - DON'T DO THIS\npublic enum Ensemble\
    \ {\n    SOLO, DUET, TRIO, QUARTET, QUINTET,\n    SEXT, SEPTET, OCTET, NONET,\
    \ DECTET;\n\n    public int numberOfMusicians() { return ordinal() + 1; }\n}\n\
    ```\n\nWhile this works, it is a maintenance nightmare. If the constants are reordered,\
    \ the numberOfMusicians will break. If you want to add a second enum constant\
    \ associated with an int value you're out of luck. For example, it might be nice\
    \ to add a constant for *double quartet*, like an octet, consists of eight musicians,\
    \ but there is no way to do it.\n\nAlso, you can't add a constant for a value\
    \ without adding constants for all int values. For example, you want to add a\
    \ constant representing a *triple quartet*, which consists of eleven musicians.\
