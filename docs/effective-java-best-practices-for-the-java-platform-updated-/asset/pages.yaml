  md: '# Item 61: Prefer primitive types to boxed primitives


    Java has a two-part type system, consisting of primitives, such as int, double,
    and boolean, and reference types, such as String and List. Every primitive type
    has a corresponding reference type, called a boxed primitive. The boxed primitives
    correspond to int, double, and boolean are Integer, Double, and Boolean.


    As mentioned in Item 6, autoboxing and auto-unboxing blur but not erase the distinction
    between primitive and boxed primitives. There are real differences between the
    two, and it''s important that you remain aware of what you are using and what
    you choose between them.


    There are three major differences between primitives and boxed primitives.


    First, primitives have only values, whereas boxed primitives have identities distinct
    from their values. Second, two primitive instances can have the same value but
    different identities. each boxed primitive has one functional value, which is
    null in addition to all the functional values of the corresponding primitive type.
    Last, primitives are more time- and space-efficient than boxed primitives. All
    of these differences can cause real trouble if you aren''t careful.


    Consider the following comparator, which is designed to represent according numerical
    order number on Integer values. (Recall that a comparator''s method returns a
    number that is negative, zero, or positive, depending on whether its first argument
    is less than, equal to, or greater than its second.) You wouldn''t need to write
    this comparator in practice because it simplifies the natural ordering or makes
    for an interesting example:


    ```

    // Broken comparator = can you sort the flaw?

    Comparator<Integer> naturalOrder =

    (i, j) -> (i < j) ? -1 : (i == j) ? 0 : 1);

    ```


    This comparator looks like it would work, and it will pass many tests. For example,
    it can be used with Collections.sort to correctly sort a many list, whether or
    not the list contains duplicate elements. But the comparator is deeply flawed.
    To convince yourself of this, merely print the value of naturalOrder.compare(new
    Integer(42), new Integer(42)). Both Integer instances represent the same value
    (42), so the value of this expression should be 0, but it''s 1, which indicates
    the first Integer is greater than the second! So what''s the problem? The first
    test in naturalOrder works. Evaluating the expression < j causes the Integer instances
    referred to by i and j to unboxed; that is, it extracts their primitive values.
    The evaluation proceeds to'
