  md: "To prevent this denial-of-service attack, you can use a private lock object\
    \ instead of using synchronized methods (which imply a publicly accessible lock):\"\
    ,\n\n```\n// Private lock object idiom - thwarts denial-of-service attack\nprivate\
    \ final Object lock = new Object();\n```\n\n```\npublic void foo() {\n    synchronized(lock)\
    \ {\n        \n    }\n}\n```\n\nBecause the lock object is inaccessible outside\
    \ the class, it is impossible for clients to interfere with the lock by its synchronization.\
    \ In effect, we are applying the advice of Item 15 by encapsulating the lock object\
    \ in the object it synchronizes.\n\nNote that the lock field is declared final.\
    \ This prevents us from inadvertently changing its contents, which could result\
    \ in catastrophic un-synchronizedized access (Item 78). We are applying the advice\
    \ of Item 12, by minimizing the mutation of the lock field. **Lock fields should\
    \ always be declared final.** (Note: **Lock fields should always be declared final.**)\
    \ This is true whether you use an ordinary monitor lock (as shown above) or a\
    \ lock from the java.util.concurrent.locks package.\n\nThe private lock idiom\
    \ can be used only on unconditionally thread-safe classes. Conditionally thread-safe\
    \ classes cannot use this idiom because they must document which lock their clients\
    \ need to acquire when performing certain method invocation sequences.\n\nThe\
    \ private lock idiom is well-suited to classes designed for inheritance (Item\
    \ 19). If such a class were to use its instances for locking, a subclass could\
    \ easily and unintentionally interfere with the operation of the base class, or\
    \ vice versa. By using the same lock for different purposes, the subclass and\
    \ base class could end up \"stepping on each other's toes.\" This is not just\
    \ a theoretical problem; it happened with the Thread class [Bloch05, Puzzle 77].\n\
    \nTo summarize, every class should document its thread safety properties with\
    \ a carefully worded prose description or The synchronized method modifier plays\
    \ no part in this documentation. Conditionally thread-safe classes must document\
    \ which method invocation sequences require external synchronization and which\
    \ lock to acquire when executing these sequences. If you write an unconditionally\
    \ thread-safe class, consider using a private lock object in place of synchronized\
    \ methods. This protects you against synchronization interference by clients and\
    \ subclasses and gives you more flexibility to adopt a sophisticated approach\
    \ to concurrency control in a later release."
