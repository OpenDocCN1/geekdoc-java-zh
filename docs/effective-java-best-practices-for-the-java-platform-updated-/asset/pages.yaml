  md: '# CHAPTER 2 CREATING AND DESTROYING OBJECTS


    for performance. Clients neither know nor care about the class of the object they
    get back from the factory; they only care that it is some subclass of EnumSet.


    A fifth advantage of static factories is that the class of the returned object
    need not exist when the class containing the method is written. Such flexible
    static factory methods form the basis of service provider frameworks, like the
    Java Database Connectivity API (JDBC). A service provider framework is a system
    in which providers implement an interface and the system makes the implementations
    available to clients, decoupling the clients from the implementations.


    There are three essential components in a service provider framework: a service
    interface, which represents an implementation; a provider registration API, which
    clients use to register implementations; and a service access API, which clients
    use to obtain instances of the service. The service access API may allow clients
    to specify criteria for choosing an implementation. In the absence of such criteria,
    the API returns a default implementation, or allows the client to cycle through
    all available implementations. The service access API is the static factory that
    forms the basis of the service provider framework.


    An optional component of a service provider framework is a service provider interface,
    which declares the factory object that produces instances of the service interface.
    In the absence of a service provider interface, implementations must be instantiated
    reflectively (Item 65). In the case of JDBC, Connection plays the part of the
    service interface, DriverManager.registerDriver is the provider registration API,
    DriverManager.getConnection is the service access API and Driver is the service
    provider interface.


    There are many variants of the service provider framework pattern. For example,
    the service API can return a richer interface to clients than the one furnished
    by providers. This is the Bridge pattern [Gamma95]. Dependency injection frameworks
    (Item 5) allow for a general-purpose service provider framework. Java uses ServiceLoader,
    so if you need one (and generally shouldn''t), write your own (Item 59). JDBC
    uses ServiceLocatorader, as the former produces the latter.


    The main limitation of using only factory methods is that classes with public
    or protected constructors cannot be subclassed. For example, it is impossible
    to subclass any of the implementation classes in the Collections Framework. Arguably
    this can be a blessing in disguise because it encourages programmers to use composition
    instead of inheritance (Item 18), and is required for immutable types (Item 2).


    A second disadvantage of static factory methods is that they are hard for programmers
    to find. They do not stand out in API documentation in the way'
