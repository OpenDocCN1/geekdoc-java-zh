  md: '# Item 39: Prefer annotations to naming patterns


    Historically, it was common to use naming patterns to indicate that some program
    elements, demanded special treatment by a tool or framework. For example, prior
    to release 4, the Unit testing framework required its users to designate test
    methods by beginning their names with the chars [Beck04]. This technique works,
    but it has big disadvantages. First, typographical errors result in silent failures.
    For example, suppose you accidentally named a method testSafetyOverride. Unit
    3 wouldn''t compile, but it wouldn''t execute the test either, leading to a false
    sense of security.


    A second disadvantage of naming patterns is that they are used only on program
    elements. For example, suppose you called a class TestSafetyMechanisms in hopes
    that Unit 3 would automatically test all of its methods, regardless of their names.
    Again, Unit 3 wouldn''t compile, but it wouldn''t execute the test either.


    A third disadvantage of naming patterns is that they provide no good way to associate
    values with program elements. For example, suppose you want to support a category
    of tests that succeeds only if it throws a particular exception. The exception
    type is essentially a parameter of the test. You could encode the exception type
    into the test name using some elaborate naming pattern, but this be ugly and fragile
    (Item 62). The compiler would have no way of knowing to check that the string
    that was supposed to name an actually did. If the name didn''t exist or was an
    exception, you wouldn''t find out until you tried to run the test.


    Annotations [JLS, 9:7] solve all of these problems nicely, and Unit adopted them
    with release 4. In this item, we''ll write out our unit testing framework to show
    how annotations work. You want to define an annotation to designate simple tests
    that are run automatically and fail if they throw an exception. Here''s how an
    annotation type, test Test, might look:


    ```

    // Marker annotation type declaration

    import java.lang.annotation.*;


    // Indicates that the annotated method is a test method.

    // Use only on parameterless static methods.


    @Retention(RetentionPolicy.RUNTIME)

    @Target(ElementType.METHOD)

    public @interface Test {

    }

    ```'
