  md: '# Item 80: Prefer executors, tasks, and streams to threads


    The first edition of this book contained code for a simple work queue [Bloch01,
    Item 49]. This class allowed clients to enqueue work for asynchronous processing
    by a background thread. When the work queue was no longer needed, the client could
    invoke a method to ask the background thread to terminate itself gracefully after
    completing any work that was already on the queue. The implementation was little
    more than a toy, but even so, it required a full page of subtle, delicate code,
    of the sort that is prone to safety and liveliness failures if you don''t get
    it right. Luckily, there no reason to write this sort of code anymore.


    By the second edition of this book came, java.util.concurrent had been added to
    Java. This package contains an Executor Framework, which is a flexible interface-based
    task execution facility. Creating a work queue that is better in every way than
    the one in the first edition of this book requires a single line of code.


    Here is how to submit a runnable:


    ```

    exec.execute(runnable);

    ```


    And here is how to tell the executor to terminate gracefully (if you fail to do
    this, it will terminate (the VM will not):


    ```

    exec.shutdown();

    ```


    You can do many things with an executor service. For example, you can wait for
    a task to complete (with the get method, as seen in Item 79, page 319), you can
    wait for any or all a collection of tasks to complete (using the invokeAny or
    invokeAll methods), you can wait for the executor to terminate (using the awaitTermination
    method), you can retrieve the results of tasks one by one (using an ExecutorCompletionService),
    you can schedule tasks to run at a particular time or periodically (using a ScheduledThreadPoolExecutor),
    and so on.


    If you want more than one thread to process requests from the queue, you can use
    a different static factory that creates a different kind of executor service called
    a thread pool. You can create a thread pool with a fixed or variable number of
    threads. The java.util.concurrent.Executors class contains static factories that
    provide most of the executors you will ever need. If, however, you want some-'
  merge: -1
