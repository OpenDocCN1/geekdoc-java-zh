  md: 'Declaring a serial version UID is simple. Just add this line to your class:


    ```

    private static final long serialVersionUID = randomLongValue;

    ```


    If you write a new class, it doesn''t matter what value you choose for randomLongValue.
    You can generate the value by running the serialver utility on the class, but
    it''s also fine to pick a number out of it. It is not required that your serial
    version UID be unique. If you modify an existing class that lacks a serial version
    UID and you want the new version to accept existing serialized instances, you
    must use the value that was automatically generated for the old version. You can
    get this one by running the serialver utility on the old version of the class—the
    one for serialized instances exist.


    If you want to make a new version of a class that is incompatible with existing
    versions, merely change the value in the serial version UID declaration. This
    will cause attempts to deserialize instances of previous versions to throw an
    InvalidClassException. Do not change the serial version UID unless you want to
    break compatibility with all serialized instances of a class.


    To summarize, if you have decided that a class should be serializable (Item 86),
    think about what the serialized form should be. Use the default serialized form
    only if it is a reasonable description of the logical state of the object; otherwise
    design a custom serialized form that aptly describes the object. You should allocate
    as much time to designing the serialized form of a class as you allocate to designing
    an exported method (Item 51). Just as you can''t eliminate methods from future
    versions, you can''t eliminate fields from the serialized form; they must be preserved
    forever to ensure serialization compatibility. Choosing the wrong serialized form
    can have a permanent, negative impact on the complexity and performance of a class.'
