  md: "# CHAPTER 12 SERIALIZATION\n\nRunning this program produces the following output,\
    \ conclusively proving that it's possible to create two distinct Elvis instances\
    \ (with different tastes in music):\n\n```\n[Hound Dog, Heartbreak Hotel]\n[A\
    \ Fool Such as I]\n```\n\nYou could fix the problem by declaring the favoriteSongs\
    \ field transient, but you're better off fixing it by making Elvis a single-element\
    \ type (Item 3). As demonstrated by the ElvisStealer attack, using a readResolve\
    \ to prevent a \"temporary\" deserialized instance from being accessed by an attacker\
    \ is fragile and demands great care.\n\nIf you write your serializable instance-controlled\
    \ class as an enum, Java guarantees that there can be no instances besides the\
    \ declared constants, unless an attacker uses a privileged method like Accessible.setAccessible.\
    \ Any attacker who can do that already has sufficient privileges to execute arbitrary\
    \ code, and all bets are off. Here's how our Elvis example looks as an enum:\n\
    \n+   - Enum stealer - the preferred approach\n\n```\npublic enum Elvis {\nINSTANCE:\n\
    \    private String[] favoriteSongs =\n        {\"Hound Dog\", \"Heartbreak Hotel\"\
    \ };\n    public void printFavorites() {\n        System.out.println(Arrays.toString(favoriteSongs));\n\
    \    }\n}\n```\n\nThe use of readResolve for instance control is not obsolete.\
    \ If you have to write a serializable instance-controlled class whose instances\
    \ are not known at compile time, you will not be able to represent the class as\
    \ an enum type.\n\n**The accessibility of readResolve is significant.** If you\
    \ place a readResolve method on a final class, it should be private. If you place\
    \ a readResolve method on a nonfinal class, you must carefully consider its accessibility.\
    \ If it is private, it will not apply to subclasses. If it is package-private,\
    \ it will apply to all subclasses in the same package. If it is public, it will\
    \ apply to all subclasses that do not override it. If a readResolve method is\
    \ protected public and a subclass does not override it, deserializing a subclass\
    \ instance will produce a superclass instance, which is likely to cause a ClassCastException.\n\
    \nTo summarize, use enum types to enforce instance invariants where possible.\
    \ If this is not possible and you need a class to be both serializable and instance-controlled,\
    \ you must provide a readResolve method and ensure that all of the class's instance\
    \ fields are either primitive or transient."
  merge: -1
