    \n```\n@override public boolean equals(Object o) {\n    throw new AssertionError();\
    \ // Method is never called\n}\n```\n\nSo when is appropriate to override equals?\
    \ It is when a class has a notion of logical equality that differs from object\
    \ identity and a superclass has no overridden equals. This is generally the case\
    \ for value classes. A value is simply a class that represents a value, such as\
    \ Integer or String. A programmer who compares references to values using the\
    \ equals method expects to find out whether they are logically equivalent, not\
    \ whether they refer to the same object. Only in overriding the equals method\
    \ necessary to satisfy programmer expectations, it enables them to serve as map\
    \ keys or set elements with predictable, desirable behavior.\n\nOne kind of value\
    \ class that does not require the equals method to be overridden is a class that\
    \ uses instance control (Item 34) to ensure that at most one object exists, with\
    \ each value represented. For these classes, logical equality is the same as object\
    \ identity, object's equals method functions as a logical equals.\n\nWhen you\
    \ override the equals method, you must adhere to its general contract. Here is\
    \ the contract, from the specification for Object:\n\nThe equals method implements\
    \ an equivalence relation. It has these properties:\n\n+   - Reflexive: For any\
    \ non-null reference value x, x.equals(x) must return true.\n\n+   - Symmetric:\
    \ For any non-null reference values x and y, x.equals(y) must return true if and\
    \ only if y.equals(x) returns true.\n\n+   - Transitive: For any non-null reference\
    \ values x, y, z, if x.equals(y) returns true and y.equals(z) returns true, then\
    \ x.equals(z) must return true.\n\n+   - Consistent: For any non-null reference\
    \ values x and y, multiple invocations of x.equals(y) must consistently return\
    \ true or consistently return false, provided no information used in equals comparisons\
    \ is modified.\n\n+   - For any non-null reference value x, x.equals(null) must\
    \ return false."
