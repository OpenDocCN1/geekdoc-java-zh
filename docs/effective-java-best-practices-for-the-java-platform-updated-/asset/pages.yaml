  md: "# Item 55: Return optionals judiciously\n\nPrior to Java 8, there were two\
    \ approaches you could take when writing a method that was unable to return a\
    \ value under certain circumstances. Either you could throw an exception or you\
    \ could return null (assuming the return type was an object reference (type)).\
    \ Neither of these approaches is perfect. Exceptions should be reserved for exceptional\
    \ circumstances (Item 60), and throwing an exception is expensive because the\
    \ stack trace is captured when an exception is created. Returning null doesn't\
    \ have these borrowings, but it has its own. If a method returns null, clients\
    \ must contain special-case code to deal with the possibility of a null return,\
    \ unless the programmer can prove that a null return is impossible.\n\nIn Java\
    \ 8, there is a third approach to writing methods that may not be able to return\
    \ a value. The Optional<T> class represents an immutable container that can hold\
    \ either a single null reference or nothing at all. An optional that contains\
    \ nothing is said to be empty. A value is said to be present in an optional that\
    \ is not empty. An optional is essentially an immutable collection that can hold\
    \ at most one element. Optional<T> is not serializable, but it could be in principle.\n\
    \nA method that returns t but may be unable to do so under certain circumstances\
    \ instead be declared to return an Optional<T>. This allows the method to return\
    \ a value to indicate that it couldn't return a valid result. An Optional<T>-returning\
    \ method is more flexible and easier to use than one that throws an exception,\
    \ and it is less error-prone than one that returns null.\n\nIn Item 30, we showed\
    \ this method to calculate the value in a collection, according to its elements'\
    \ natural order.\n\n```\n// Returns value in collection - throws exception if\
    \ empty\np static <E extends Comparable<E>> E max(Collection<E> c) {\n    if (c.isEmpty())\
    \ {\n        throw new IllegalArgumentException(\"Empty collection\");\n    }\n\
    \    E result = null;\n    for (E e : c) {\n        if (result == null || e.compareTo(result)\
    \ > 0)\n            result = Objects.requireNonNullNull(e);\n    }\n    return\
    \ result;\n}\n```"
