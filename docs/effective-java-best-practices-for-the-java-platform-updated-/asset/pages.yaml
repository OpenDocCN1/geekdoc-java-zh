    \ deck = new ArrayList<>();\nfor (Iterator<Suit> i = suits.iterator(); i.hasNext();\
    \ i++) {\n  for (Iterator<Rank> j = ranks.iterator(); j.hasNext(); j++) {\n  \
    \  deck.add(new Card(i.next(), j.next()));\n  }\n}\n```\n\nDon't feel bad if you\
    \ spotted the bug. Many expert programmers made this mistake at one time or another.\
    \ The problem is the next method is called too many times the iterator for the\
    \ outer collection (suits). It is called from the outer loop so that it is called\
