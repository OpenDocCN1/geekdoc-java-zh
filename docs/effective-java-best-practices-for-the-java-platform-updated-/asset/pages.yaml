  md: "# Item 7: Eliminate obsolete references\n\nIf you switched from a language\
    \ with manual memory management, such as C or C++, to a garbage-collected language\
    \ such as Java, your job as a programmer has made much easier by the fact that\
    \ your objects are automatically reclaimed when you're done with them. It seems\
    \ almost like magic when you first experience it. It can easily lead to the impression\
    \ that you don't have to think about memory management, but this isn't quite true.\n\
    \nConsider the following simple implementation:\n\n```\n// Can you spot the \"\
    memory leak?\"\npublic class Stack {\n    private Object[] elements;\n    private\
    \ int size = 0;\n    private static int DEFAULT_INITIAL_CAPACITY = 16;\n\n   \
    \ public Stack() {\n        elements = new Object[DEFAULT_INITIAL_CAPACITY];\n\
    \    }\n\n    public void push(Object e) {\n        ensureCapacity();\n      \
