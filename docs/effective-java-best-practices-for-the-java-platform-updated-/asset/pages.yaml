  md: '# CHAPTER 7 LAMBDAS AND STREAMS


    Not only can parallelizing a stream lead to poor performance, including liveliness
    failures; it can lead to incorrect results and unpredictable behavior (safety
    failures). Safety failures may result from parallelizing a pipeline that uses
    mappers, filters, and other programmer-supplied function objects that fail to
    adhere to their specifications. For example the accumulator and combiner functions
    passed to Stream''s reduction operation (some of which are discussed in Item 46)
    must be associative, non-interfering, and stateless. If you violate these rules
    it will likely yield incorrect results; if you run your pipeline sequentially,
    it will likely work fine but fail catastrophically.


    Along these lines, it''s worth noting that even if the parallelized Mersenne primes
    program ran to completion, it would not have printed the primes in the correct
    (ascending) order. To preserve the order displayed by the sequential, you''d have
    to replace the forTerminal operation with forOrdered, which is guaranteed to traverse
    parallel streams in counter order.


    Even assuming you''re using an efficiently splittable source, a parallelizable
    or cheap operation, and non-interfering function objects, you won''t get a good
    speedup from parallelization unless the pipeline is doing enough real work to
    offset the costs associated with parallelism. As a very rough estimate, the number
    of elements in the stream changes the number of lines of code executed should
    be at least a hundred thousand [Lea14].


    It''s important to remember that parallelizing a stream is strictly a performance
    optimization. As that is the case for any optimization, you must test the performance
    before and after the change to ensure it is worth doing (Item 67). Ideally, you
    should perform the test in a realistic system setting. Normally, all parallel
    pipelines in a common fork-join pool. A single misbehaving pipeline can hamper
    the performance of others in unrelated parts of the stream.


    If it sounds like the odds are stacked against you when parallelizing pipelines,
    it''s because they are: acquaintance maintains a multiline codebase that makes
    heavy use of stream found only a handful of places where parallel streams were
    effective. This does not mean that you should refrain from parallelizing streams.
    Under the right circumstances, it is possible to achieve near-linear speedup in
    the number of processor cores simply by adding a parallel call to a stream pipeline.
    Certain domains, such as machine learning and data processing, are particularly
    amenable to these speedups.'
