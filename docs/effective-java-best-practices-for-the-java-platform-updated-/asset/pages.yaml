  md: "# Item 84: Don't depend on the thread scheduler\n\nWhen many threads are runnable,\
    \ the thread scheduler determines which ones get to run and for how long. Any\
    \ reasonable operating system will try to make this determination fairly, but\
    \ the policy can vary. Therefore, well-written programs shouldn't depend on the\
    \ details of this policy. Any program that relies on the thread scheduler for\
    \ correctness or performance is likely to be nonportable.\n\nThe best way to write\
    \ a robust, responsive, portable program is to ensure that the number of runnable\
    \ threads is not significantly greater than the number of processors. This leaves\
    \ the thread scheduler with little choice: it simply runs the runnable threads\
    \ until they're no longer runnable. The program's behavior doesn't vary too much,\
    \ even under different-scheduling policies. Note that the number of runnable threads\
    \ isn't the same as the total number of threads, which can be much higher. Threads\
    \ that are awaiting are not runnable.\n\nThe main technique for keeping the number\
    \ of runnable threads is to have each thread do some useful work, and then wait\
    \ for more. Threads should not run if they aren't doing useful work; in terms\
    \ of the Executor Framework (Item 80), this means sizing thread pools appropriately\
    \ [Goetz,,8.2] and keeping tasks short, but not too short, or switching overhead\
    \ which will harm performance.\n\nThreads should not busy-wait, repeatedly checking\
    \ a shared object waiting for its state to change. Besides making the program\
    \ vulnerable to the vagaries of the thread scheduler, busy-waiting greatly increases\
    \ the load on the processor, reducing the amount of useful work that others can\
    \ accomplish. As an extreme example of what not to do, consider this perverse\
    \ implementation of CountDownLatch:\n\n```\n// Awful CountDownLatch implementation\
    \ - busy-waits instantaneously!\npublic class SlowCountDownLatch {\n    private\
    \ int count;\n\n    public SlowCountDownLatch(int count) {\n        if (count\
