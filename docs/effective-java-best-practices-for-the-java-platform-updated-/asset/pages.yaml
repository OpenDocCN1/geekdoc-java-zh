  md: "# ITEM 25: PREFER CLASS HIERARCHIES TO TAGGED CLASSES\n\n```\nclass Rectangle\
    \ extends Figure {\n    final double length;\n    final double width;\n\n    Rectangle(double\
    \ length, double width) {\n        this.length = length;\n        this.width =\
    \ width;\n    }\n    @override double area() { return length * width; }\n}\n```\n\
    \nThis class hierarchy corrects every shortcoming of tagged classes noted previously.\
    \ It is simple and clear, containing none of the boilerplate found in the original.\
    \ The implementation of each class is allotted its own class, and none of these\
    \ classes are enclosed by irrelevant data. All fields are final. The compiler\
    \ ensures that each class has an implementation for every abstract method declared\
    \ in the root class. This eliminates the possibility of a runtime failure due\
    \ to a missing switch. Multiple programmers can extend hierarchies independently\
    \ and interoperably without access to the source for the root class. There is\
    \ a separate data type associated with each flavor, allowing programmers to indicate\
    \ the flavor of a variable and restrict values and inputs to a particular flavor.\n\
    \nAnother advantage of class hierarchies is that they can be made to reflect natural\
    \ hierarchical relationships among types, allowing for increased flexibility and\
    \ better compile-time safety. Suppose the class in the original example also allows\
    \ for squares. The class hierarchy could be made to reflect the fact that a square\
    \ is a special kind of rectangle (assuming both are immutable):\n\n```\nclass\
    \ Square extends Rectangle {\n    Square(double side) { }\n}\n```\n\nNote that\
    \ the fields in the above hierarchy are accessed directly rather than accessor\
    \ methods. This was done for brevity and would be a poor design if the hierarchy\
    \ were public (Item 16).\n\nIn summary, tagged classes are seldom appropriate.\
    \ If you're tempted to write a class with an explicit tag field, think about whether\
    \ the tag could be eliminated and the class replaced by a hierarchy. When you\
    \ encounter an existing class with a tag field, consider refactoring it into a\
    \ hierarchy."
