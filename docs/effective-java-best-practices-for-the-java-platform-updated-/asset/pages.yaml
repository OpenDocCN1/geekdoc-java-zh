  md: "# ITEM 39: PREFER ANNOTATIONS TO NAMING PATTERNS\n\nThe declaration for the\
    \ Test annotation type is itself annotated with Retention and Target annotations.\
    \ Such annotations on annotation type declarations are known as meta-annotations.\
    \ The @Retention(RetentionPolicy.RUNTIME) meta-annotation indicates that Test\
