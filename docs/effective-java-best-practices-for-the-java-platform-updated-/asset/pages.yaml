    \ documentation sets, takes the form of a search box in the upper-right corner\
    \ of the page. When you type into the box, you get a drop-down menu of matching\
    \ pages. API elements, such as classes, methods, and fields, are indexed automatically.\
    \ Occasionally you may wish to index additional terms that are important to your\
    \ API. The {@index} tag was added for this purpose. Indexing a term that appears\
    \ in a doc comment is as simple as wrapping it in this: as shown in this fragment:\n\
    \n+   * This method complies with the {@index IEEE 754} standard.\n\nGenerics,\
    \ and annotations require special care in doc comments. When documenting a generic\
    \ type or method, be sure to document all parameters:\n\n```\n/**\n * An object\
    \ that maps keys to values. A map cannot contain\n * duplicate keys; each key\
