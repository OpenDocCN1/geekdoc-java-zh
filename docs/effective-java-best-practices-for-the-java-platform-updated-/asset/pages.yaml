  md: "The design of the InstrumentedSet class is enabled by the existence of the\
    \ Set interface, which captures the functionality of the HashSet class. Besides\
    \ being robust, this design is extremely flexible. The InstrumentedSet class implements\
    \ the Set interface and has a single constructor whose argument is also of type\
    \ Set. Else, the class transforms one into another, adding the instrumentation\
    \ functionality. Unlike the inheritance-based approach, which works for a single\
    \ class and requires a separate constructor for each supported constructor in\
    \ the subclass, the wrapper class can be used to instrument any Set implementation\
    \ and work well in conjunction with any preexisting constructor:\n\n```\nSet<Insert>\
    \ times = new InstrumentedSet<>(new TreeSet<>(cmp));\nSet<E> s = new InstrumentedSet<>(new\
    \ HashSet<>(INIT_CAPACITY));\n```\n\nThe InstrumentedSet class can even be used\
    \ to temporarily instrument a set instance that has been used without instrumentation:\n\
    \n```\nstatic void walk(Set<Dog> dogs) {\n  InstrumentedSet<Dog> iDogs = dogs;\n\
    \  ... // within this method use iDogs instead of dogs\n}\n```\n\nThe InstrumentedSet\
    \ class is known as a wrapper class because each InstrumentedSet instance contains\
    \ \"wraps\" another instance. This is also known as the Decorator pattern [Gamma55]\
    \ because the InstrumentedSet class \"decorates\" set by adding instrumentation.\
    \ Sometimes the combination of position and forwarding is loosely referred to\
    \ as delegation. Technically it's not delegation unless the wrapper object passes\
    \ itself to the wrapped object [Liemann86,Gamma55].\n\nThe disadvantages of wrapper\
    \ classes are few. One is that wrapper classes are not suited for use in callback\
    \ frameworks, where objects refer to others for subsequent invocations (\"callbacks”).\
    \ A wrapped object doesn't know of its wrapper, so a reference to itself (this)\
    \ calls the wrapper. This is known as the SELF problem [Liemann86]. We mostly\
    \ worry about the performance impact of forwarding method invocations or the memory\
    \ footprint of wrapper objects. Neither turn out to have much impact in practice.\
    \ It is tedious to write forwarding methods, but you have to write the reusable\
    \ forwarding class for each interface only once, and forwarding classes may be\
    \ provided for you. For example, Guava provides forwarding classes for all of\
    \ the collection interfaces [Guava]."
