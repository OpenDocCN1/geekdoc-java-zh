  md: "# CHAPTER 2\n\n# Creating and Destroying Objects\n\nThis chapter concerns creating\
    \ and destroying objects: when and to create them, and how to avoid creating them,\
    \ how to ensure they are destroyed in a timely manner, and how to manage any cleanup\
    \ actions that must precede their destruction.\n\n# Item 1: Consider static factory\
    \ methods instead of constructors\n\nThe traditional way for a class to allow\
    \ a client to obtain an instance is to provide a public constructor. There is\
    \ another technique that should be a part of every programmer's toolkit. A class\
    \ can provide a public static factory method, which is simply a static method\
    \ that returns an instance of the class. Here's a simple example from Boolean\
    \ (the boolean primitive class for boolean). This method translates a boolean\
    \ primitive value into a Boolean object reference:\n\n```\npublic static Boolean\
    \ valueOf(Boolean b) {\n    return b ? Boolean.TRUE : Boolean.FALSE;\n}\n```\n\
    \nNote that a static factory method is not the same as the Factory Method pattern\
    \ from Design Patterns [Gamma95]. The static factory method described in this\
    \ item has no direct equivalent in Design Patterns.\n\nA class can provide its\
    \ clients with static factory methods instead, or in addition to, public constructors.\
    \ Providing a static factory method instead of a public constructor has both advantages\
    \ and disadvantages.\n\nOne advantage of static factory methods is that, unlike\
    \ constructors, they have names. If the parameters are a constructor do not, in\
    \ and of themselves, describe the object being returned, a static factory with\
    \ a well-chosen name is easier to use and the resulting client code easier to\
    \ read. For example,"
