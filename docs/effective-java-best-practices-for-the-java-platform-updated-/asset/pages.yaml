  md: '# CHAPTER 3 METHODS COMMON TO ALL OBJECTS


    One consequence of these three provisions is that the equality test imposed by
    compareTo must obey the same restrictions imposed by the equals contract: reflexivity,
    symmetry, and transitivity. Therefore, the same caveat applies: there is no way
    to extend an instance class with a new value component while preserving the compareTo
    contract, unless you are willing to forgo the benefits of the object-oriented
    approach them too. If you want to add a value component to a class that implements
    Comparables, you cannot extend it; write an unrelated class containing an instance
    of the first class. This frees you to provide a "view" method that returns the
    contained instance. This frees you to implement whatever compareTo method you
    like on the containing class, while allowing it to contain an instance of the
    containing class as an instance of the contained class when needed.


    The final paragraph of the compareTo contract, is a strong suggestion rather than
    a true requirement, simply return the same results as the equals method. If this
    provision is obeyed, the ordering imposed by the compareTo method is said to be
    consistent with equals(). If violated, the ordering is said to be inconsistent
    with equals(). A class whose compareTo will still work, but sorted collections
    of the elements of the class (Collection, Set, or Map) will not obey the general
    contract of the collection interfaces. For these interfaces are defined in terms
    of the equals method, but sorted collections use the equality test imposed by
    compareTo in place of equals. It is not a catastrophe if this happens, but it''s
    something to be aware of.


    For example, consider you create a compareTo method that is inconsistent with
    equals(). If you create a HashSet and then add two elements the two BigDecimal("1.0")
    and new BigDecimal("1.00"), the set will contain two elements because the two
    BigDecimal instances are equal when compared using the equals method. However,
    if you perform the same using a TreeSet instead of a HashSet, the set will contain
    only one element because the two BigDecimal instances are equal when compared
    with the compareTo method. (See the BigDecimal documentation for details).


    Writing a compareTo method is similar to writing an equals method, but there are
    a few differences. Because the Comparable interface is parameterized, the compareTo
    method is statically typed, so you don''t need to check or cast the argument.
    If the argument is of the wrong type, the invocation won''t even complete. If
    the argument is null, the invocation should throw a NullPointerException, and
    it will, as soon as the method attempts to access its members.'
