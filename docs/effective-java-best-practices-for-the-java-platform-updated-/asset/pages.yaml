  md: 'Changing the HashMap to a LinkedHashMap will provide predictable iteration
    order with performance comparable to that of HashMap, without making any demands
    on the key type.


    You might think it OK to declare a variable using its implementation type, because
    you can change the declaration type and the implementation type at the same time
    but there is no guarantee that this change will result in a program that compiles.
    If the client code used methods on the original implementation type or if the
    client passed the interface to a method that requires the original implementation
    type, then the code will no longer complete after making this change. Declaring
    the variable with the interface type keeps you honest.


    It is entirely appropriate to refer to an object by class rather than an interface
    if no appropriate interface exists. For example, value classes and BigInteger.
    Value classes are rarely written with multiple implementations in mind. They are
    often final and rarely have corresponding interfaces. It is perfectly appropriate
    to use such a value class as a parameter, variable, field, or return type.


    A second case in which no appropriate interface type is that of objects belonging
    to a framework whose fundamental types are classes rather than interfaces. If
    an object belongs to a class-based framework, it is preferable to refer to it
    by the relevant base class, which is often abstract, rather than by its implementation
    class. Many java classes such as OutputStream fall into this category.


    A final case in which there is no appropriate interface type is that of objects
    that implement an interface but also provide extra methods not found in the interface—example,
    PriorityQueue has a comparator that is not present on the Queue interface. Such
    a class should be used to refer to its instances only if the program relies on
    the extra methods, and this should be very rare.


    These three cases are not meant to be exhaustive but merely convey the flavor
    of situations where it is appropriate to refer to an object by its class. In practice,
    it should be apparent whether a given object has an appropriate interface. If
    it does, your program will be more flexible and stylish if you use the interface
    to refer to the object. If there is no appropriate interface, just use the least
    specific class in the class hierarchy that provides the required functionality.'
