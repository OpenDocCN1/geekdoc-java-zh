  md: '# ITEM 72: FAVOR THE USE OF STANDARD EXCEPTIONS


    **Do not reuse Exception, RuntimeException, Throwable, or Error directly.**\Treat
    these classes as if they were abstract. You can''t reliably test for these exceptions
    because they are superclasses of other exceptions that a method may throw.

    This table summarizes the most commonly reused exceptions:


    | Exception | Occasion for Use |

    | --- | --- |

    | IllegalArgumentException | Non-null parameter value is inappropriate |

    | IllegalStateException | Object state is inappropriate for method invocation
    |

    | NullPointerException | Parameter value is null where prohibited |

    | IndexOfOutOfBoundsException | Index value is out of range |

    | ConcurrentModificationException | Concurrent modification of an object has detected
    where it is prohibited |

    | UnsupportedOperationException | Object does not support method |


    While these are far the most commonly reused exceptions, others may be reused
    where circumstances warrant. For example, it would be appropriate to reuse ArithmeticException
    and NumberFormatException if you were implementing arithmetic objects as complex
    numbers or rational numbers. If an exception fits your needs, go ahead and use
    it, but only if the conditions under which you would throw it are consistent with
    the exception''s documentation; reuse must be based on documented semantics, not
    on name. Also, feel free to subclass an exception if you want to add more detail
    (Item 75), but remember that exceptions are serializable (Chapter 12). Alone is
    reason not to write your own exception class without good reason.

    Choosing exception to reuse can be tricky because the "occasions for use" in the
    table above do not appear to be exclusive. Consider the case of an object representing
    a deck of cards, and suppose there were a method to deal a hand from the deck
    that took as an argument the size of the hand. If the caller passed a larger value
    than the number of cards remaining in the deck, it could be constructed as an
    IllegalArgumentException (the size parameter value is too high) or an IllegalStateException
    (the deck contains too few cards). Under these circumstances, the risk is to throw
    IllegalStateException if no argument values would have worked, otherwise throw
    IllegalArgumentException.'
