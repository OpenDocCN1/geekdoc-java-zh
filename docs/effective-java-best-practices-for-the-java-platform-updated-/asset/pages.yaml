  md: '# Item 82: Document thread safety


    How a class behaves when its methods are used concurrently is an important part
    of its contract with its clients. If you fail to document this aspect of a class''s
    behavior, its users will be forced to make assumptions. If these assumptions are
    wrong, the resulting program may perform insufficient synchronization (Item 78)
    or excessive synchronization (Item 79). In either case, serious errors may occur.


    You may here add that you can tell if a method is thread-safe by looking for the
    synchronized modifier in its documentation. This is wrong on several counts. In
    normal operation, **The presence of the synchronized modifier in the method declaration**
    is an implementation detail, not part of its API. It does not reliably indicate
    that a method is thread-safe.


    Moreover, the claim that the presence of the synchronized modifier is sufficient
    to document thread safety embodies the misconception that thread safety is an
    all-or-nothing property. In fact, there are several levels of thread safety. **To
    enable concurrent use, a class must clearly document what level of thread safety
    is.** The following list summarizes levels of thread safety. It is not exhaustive
    but covers the common cases:


    +   - **Immutable**—Instances of this class appear constant. No external synchronization
    is necessary. Examples include `String`, `Long`, and `BigInteger` (Item 17).

    - **Unconditionally thread-safe**—Instances of this class are mutable, but have
    sufficient internal synchronization that instances can be used concurrently without
    the need for any external synchronization. Examples include `AtomicLong` and `ConcurrentHashMap`.

    - **Conditionally thread-safe**—Unlike unconditionally thread-safe, except that
    some methods require external synchronization for safe concurrent use. Examples
    include the collections returned by `Collections.synchronized wrappers`, whose
    iterators require external synchronization.

    - **Not thread-safe**—Instances of this class are mutable. To use them concurrently,
    clients must surround each method invocation (or invocation sequence) with external
    synchronization of the clients choosing. Examples include the general-purpose
    collection implementations, as `ArrayList` and `HashMap`.

    - **Thread-hostile**—This class is unsafe for concurrent use even if every method
    invocation is surrounded by external synchronization. Thread hostility usually
    results from modifying static data without synchronization. No one writes a'
