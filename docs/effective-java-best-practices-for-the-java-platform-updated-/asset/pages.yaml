    # # Methods Common to All Objects


    ALTHOUGH Object is a concrete class, it is designed primarily for extension. All
    of its nonfinal methods (equals, hashCode, toString, close, and finalize) have
    explicit generic contracts because they are designed to be overridden. It is the
    responsibility of any class overriding these methods to obey their general contracts;
    failure to do so will prevent other classes that depend on them (such as HashMap
    and HashSet) from functioning properly in conjunction with the class. This chapter
    tells you when and how to override the nonfinal Object methods. The finalize method
