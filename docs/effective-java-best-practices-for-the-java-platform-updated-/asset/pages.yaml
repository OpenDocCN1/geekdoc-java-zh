  md: '# CHAPTER 7 LAMBDAS AND STREAMS


    If one of the standard functional interfaces does the job, you should generally
    use it in preference of a purpose-built functional interface. This will make your
    API easier to learn, by reducing its conceptual surface area, and will provide
    significant interoperability benefits, as many of the standard functional interfaces
    provide useful defaults. The Predicate interface, for instance, provides methods
    to combine predicates. In the case of our LinkedHashMap<K,V>, Map<K,V> interface
    should be used in preference to a custom EldestRemovalFunction.


    There are thirty-four interfaces in java.util.function. You can''t be expected
    to remember them all, but if you remember six basic interfaces, you can derive
    the rest when you need them. The basic interfaces operate on object references.
    Operators represent functions whose result and argument types are the same. The
    Predicate interface represents a function that takes an argument and returns a
    boolean. The Supplier interface represents a function that takes no arguments
    and returns (or "supplies") a value. Finally, Consumer represents a function that
    takes an argument and returns nothing, essentially consuming its argument. The
    six basic functional interfaces are summarized below:


    | Interface | Function Signature | Example |

    |---|---|---|

    | UnaryOperator<T>> | T apply(T t) | String::toLowerCase |

    | BinaryOperator<T> | T apply(T t1, T t2) | BigInteger::add |

    | Predicate<T> | boolean test(T t) | Collection::isEmpty |

    | Function<T,R> | R apply(T t) | Arrays::asList |

    | Supplier<T> | T get() | Instant::now |

    | Consumer<T> | void accept(T t) | System.out::println |


    There are also variants of each of the six basic interfaces to operate on the
    primitive types int, long, and double. Their names are derived from the basic
    interfaces by prefixing them with a primitive type. So, for example, a predicate
    that takes an int is an IntPredicate, and a binary operator that takes two long
    values and returns a long is a LongBinaryOperator. None of these types are parameterized
    except for the Function variants, which are parameterized by return type. For
    example, LongFunction<int[]> takes a long and returns an int.'
