    This pattern has many of the disadvantages of the telescoping constructor pattern.
    It is easy, if by word, to create instances, and easy to read the following code:


    ```

    NutritionFacts cocaCola = new NutritionFacts();

    cocaCola.setServingSize(240);

    cocaCola.setServings(60);

    cocaCola.setCalories(100);

    cocaCola.setSodium(35);

    cocaCola.setCarbohydrate(27);

    ```


    Unfortunately, the JavaBeans pattern has serious disadvantages of its own. Because
    construction is split across multiple calls, a **JavaBean may be in an inconsistent
    state through construction**. The class does not have the option of enforcing
    construction, merely by checking the validity of the constructor parameters. Attempting
    to use an object when it is in an inconsistent state may cause failures that are
    far removed from the code containing the bug and hence difficult to debug. A related
    disadvantage is that **the JavaBeans pattern prevents the making of a immutable
    class (Item 17)** and requires added effort on the part of the programmer to ensure
    thread safety.


    It is possible to resolve these disadvantages by manually "Freezing" the object
    when its construction is complete and not allowing it to be used until frozen,
    but this is unwanted and rarely used in practice. Moreover, it can cause errors
    at runtime because the compiler cannot ensure the programmer calls the freeze
    method before using the object.


    Luckily, there is another approach that combines the stability of the telescoping
    constructor pattern with the readability of the JavaBeans pattern. It is a form
    of the Builder pattern. Instead of making the desired object directly, the client
    calls a constructor (or static factory) with all of the required parameters and
    gets a *builder object*. Then the client calls setter-like methods on the builder
    object to set each optional parameter of interest. Finally, the client calls a
    parameterless build method to generate the object, which is typically immutable.
    The builder is typically a static member class (Item 24) of the class it builds.
