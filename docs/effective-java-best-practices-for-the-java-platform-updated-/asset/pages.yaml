  md: '# Item 28: Prefer lists to arrays


    Arrays differ from generic types in two important ways. First, arrays are covariant.
    This scary-sounding word means simply that if Sub is a subtype of Super, the array
    type Sub[] is a subtype of the array type Super[]. Generics, by contrast, are
    invariant; for any two distinct types Type1 and Type2, List<Type1> is neither
    a subtype nor a supertype of List<Type2> (JLS, 4.10; Naftalin,7). You might think
    that generics are deficient, but arguably it is arrays that are deficient. This
    code fragment is legal:


    ```

    // Fail at runtime!

    Object[] objectArray = new Long[];

    objectArray[0] = "Don''t fit in"; // Throws ArrayStoreException

    ```


    but this is not:


    ```

    // Won''t compile!

    List<Object> list = new ArrayList<Long>(); // Incompatible types

    list.add("Don''t fit in");

    ```


    Either you can put a String into a Long container, but with an array you find
    out that you''ve made a mistake at runtime, with a list, you find out at compile
    time. Or, you''d find out at compile time.


    The second major difference between arrays and generics is that arrays are reified
    (JLS, 4.7). This means that arrays know and enforce their element type at runtime.
    As noted earlier, if you put a String into an array of Long, you will get an ArrayStoreException.
    Generics, by contrast, are implemented by erasure (JLS, 4.6). This means that
    they enforce type constraints only at compile time and discard (or erase) type
    information at runtime. Erasure allows what generic types to operate freely with
    legacy code that didn''t use generics (item 26), ensuring a smooth transition
    to generics in Java 5.


    Because of these fundamental differences, arrays and generics do not mix well.
    For example, it is illegal to create an array of a generic type, a parameterized
    type, or a type parameter. Some of these array creation expressions are legal:
    new List<String>[], new E[]. All will result in generic array creation errors
    at compile time.


    Why is it illegal to create a generic array? Because it isn''t typesafe. If it
    were legal, casts generated by the compiler in an otherwise correct program could
    fail at runtime with a ClassCastException. This would violate the fundamental
    guarantee provided by the generic type system.'
