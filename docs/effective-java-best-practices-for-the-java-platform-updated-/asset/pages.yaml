  md: "# ITEM 58: WRITE READOBJECT METHODS DEFENSIVELY\n\nThe byte array literal used\
    \ to initialize serializedForm was generated by serializing a normal Period instance\
    \ and hand-editing the resulting byte stream. The details of the stream are unimportant\
    \ to the example, but if you're curious, the serialization byte-stream format\
    \ is described in the Java Object Serialization Specification [Serialization,\
    \ 6]. If you run this program, it prints Fri Jan 01 12:00:00 PST 1999 - Jan 01\
    \ 12:00:00 PST 1984. Simply declaring serializable violates class invariants.\n\
    \nTo fix this problem, provide a readObject method for Period that calls defaultReadObject\
    \ and checks the validity of the deserialized object. If the check fails, the\
    \ readObject method throws InvalidObjectException, preventing the deserialization\
    \ from completing:\n\n```\n// readObject method with validity checking - insufficient!\n\
    private void readObject(InputStream s)\n    throws InvalidObjectException, ClassNotFoundException\n\
    \    s.defaultReadObject();\n```\n\n```\n// Check that our invariants are satisfied\n\
    if (start.compareTo(end) > 0)\n    throw new InvalidObjectException(\"start \"\
    \ + \" after \" + end);\n```\n\nWhile this prevents an attacker from creating\
    \ an invalid Period instance, there is a more subtle problem still lurking. It\
    \ is possible to create a mutable Period by fabricating a byte stream that begins\
    \ with a valid Period instance and then adds extra references to the private fields\
    \ internal to the Period instance. The attacker reads the Period instance from\
    \ the ObjectInputStream and reads the \"rogue object references\" that were appended\
    \ to the stream. These references give the attacker access to the objects referenced\
    \ by the Date fields within the Period object. By mutating these Date instances,\
    \ an attacker can mutate the Period instance. The following class demonstrates\
    \ this attack:\n\n```\npublic class MutablePeriod {\n    // A period start field\n\
    \    public final Date start;\n```\n\n```\n// period's end field, to which we\
    \ shouldn't have access\n    public final Date end;\n```"
