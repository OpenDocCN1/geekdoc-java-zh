  md: "# ITEM 56: WRITE DOC COMMENTS FOR ALL EXPOSED API ELEMENTS 257\n\nThe first\
    \ “sentence” of each doc comment (as defined below) becomes the summary description\
    \ of the element to which the comment pertains. For example, the summary description\
    \ in the doc comment on page 255 “Returns the element at the specified position\
    \ in this list.” The summary description must stand on its own to describe the\
    \ functionality of the element it summarizes. To avoid confusion, no members or\
    \ constructors have the same description. Pay particular attention to overloads,\
    \ for which is often natural to use the same first sentence (unacceptable in doc\
    \ comments).\n\nBe careful if the intended summary description contains a period,\
    \ because the period can prematurely terminate the description. For example, a\
    \ doc comment that begins with the phrase “A college degree, as B.S., M.S. or\
    \ Ph.D.” will result in the summary description “A college degree.” The first\
    \ period that is followed by a space, tab, or terminator (or at the first tag)\
    \ [Javadoc-ref]. The second period in the abbreviation “M.S.” is followed by a\
    \ space. Here, the best solution is to surround the offending period and any associated\
    \ text with an {@literal} tag, so is followed by a space in the source code:\n\
    \n```\n/** * A college degree, as B.S., {@literal M.S.} or Ph.D.\n */ public class\
    \ Degree { ... }\n```\n\nIt is a bit misleading to say that the summary description\
    \ is the first sentence in a doc comment. For methods and constructors, the summary\
    \ description should be a verb phrase (including any object) describing the action\
    \ performed by the method. For example:\n\n+   - ArrayList(int initialCapacity)—Constructs\
    \ an empty list with the specified capacity.\n- Collection.size()—Returns the\
    \ number of elements in this collection.\n\nAs shown in these examples, use the\
    \ third person declarative tense (“return the number”) rather than the second\
    \ person imperative (“return the number”).\nFor classes, interfaces, and fields,\
