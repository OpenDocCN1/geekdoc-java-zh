  md: "# ITEM 56: WRITE DOC COMMENTS FOR ALL EXPOSED API ELEMENTS\n\nWhen documenting\
    \ an annotation type, be sure to document any members as well as the type itself.\
    \ Document members with noun phrases, as they were fields. For the summary description\
