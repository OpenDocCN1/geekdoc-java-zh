    that an immutable object is a mutable reference type, it can be a constant field
    if the referenced object is immutable. Note that constant fields constitute the
    only use of underscores.


    Local variables have similar typographical naming conventions to member names,
    except that abbreviations are permitted, as are individual characters and short
    characters meaning depends on the context in which they are used, for example,
    1, denom, houseNum. Input parameters are a special kind of local variables, as
