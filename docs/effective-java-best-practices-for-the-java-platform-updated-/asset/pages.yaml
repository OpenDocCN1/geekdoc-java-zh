  md: 'Here is a simple limit test for deciding whether the default readObject method
    is acceptable for a class: would you feel comfortable adding a public constructor
    that took as parameters the values for each transientient field in the object
    and stored the values in the fields with no validation whatsoever? If not, you
    must provide a readObject method, and it must perform all the validity checking
    and defensive copying would be required of a constructor. Alternatively, you can
    use the serialization proxy pattern (Item 90). This pattern is highly recommended
    because it takes care of the effort out of such deserialization.


    There is one other difference serializable classes that applies to nonfinal serializable
    classes. Like a constructor, a readObject method must not invoke an overridable
    method, directly or indirectly (Item 19). If this rule is violated, the method
    in question is overridden, the overriding method will run before the subclass''s
    state has been deserialized. [Bloch05, Puzzle 91].


    To summarize, anytime you write a public constructor that must produce a valid
    instance regardless of what byte stream is given, do not assume that the byte
    stream represents an actual instance. While the examples in this item concern
    a class that uses the default serialized form, all of the issues that raised apply
    equally to classes with custom serialized forms. Here, in summary form, are the
    guidelines for writing a readObject method:


    +   - For classes with object reference fields that must remain private, defensively
    copy each object in such a field. Mutable components of immutable classes fall
    into this category.

    - Check any invariants and throw an InvalidException if a check fails. The checks
    should follow any defensive copying.

    - If an entire object graph must be validated after it is deserialized, use the
    ObjectInputValidation interface (not discussed in this book).

    - Do not invoke any overridable methods in the class, directly or indirectly.'
