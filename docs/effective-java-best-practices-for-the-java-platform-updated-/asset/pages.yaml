  md: "# Item 5: Prefer dependency injection to hardwiring resources\n\nMany classes\
    \ depend on one or more underlying resources. For example, a spell checker depends\
    \ on a dictionary. It is not uncommon to see such classes implemented as static\
    \ utility classes (Item 4):\n\n```\n// Inappropriate use of static utility - inflexible\
    \ & unsustainable!\npublic class SpellChecker {\n    private static final Lexicon\
    \ dictionary = ...;\n    private SpellChecker() {} // Noninstantiable\n    public\
    \ static boolean isValid(String word) { ... }\n    public static List<String>\
    \ suggestions(String type) { ... }\n```\n\nSimilarly, it's not to see them implemented\
    \ as singletons (Item 3):\n\n```\n// Inappropriate use of singleton - inflexible\
    \ & unsustainable!\npublic class SpellChecker {\n    private final Lexicon dictionary\
    \ = ...;\n    private SpellChecker(...) { }\n    public static INSTANCE = new\
    \ SpellChecker(...);\n    public static boolean isValid(String word) { ... }\n\
    \    public static List<String> suggestions(String type) { ... }\n}\n```\n\nNeither\
    \ of these approaches is satisfactory, because they assume that there is only\
    \ one dictionary worth using. In practice, each language has its own dictionary,\
    \ and special dictionaries are used for special vocabularies. Also, it may be\
    \ desirable to use a special dictionary for testing. It is wishful to think that\
    \ a single dictionary will suffice for all time.\n\nYou could have SpellChecker\
    \ support multiple dictionaries by making it final and adding a method to change\
    \ the dictionary in existing spell checker, but that would be awkward, error-prone,\
    \ and unacceptable in a concurrent setting. Static classes and singletons are\
    \ inappropriate for classes whose behavior is parameterized by an underlying resource.\n\
    \nWhat is required is the ability to support multiple instances of the class (in\
    \ our example, SpellChecker), each of which uses the resource desired by the client\
    \ (in our example, the dictionary). A simple pattern that satisfies this requirement\
    \ is to pass the resource into the constructor when creating a new instance. This\
    \ is one way of dependency injection: the dictionary is a dependency of the spell\
    \ checker and is injected into the spell checker when it is created."
