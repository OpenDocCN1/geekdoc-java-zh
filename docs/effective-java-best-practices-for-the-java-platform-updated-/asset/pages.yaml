  md: "# CHAPTER 2 CREATING AND DESTROYING OBJECTS\n\nNote that the build method in\
    \ each subclass builder is declared to return the correct subclass: the build\
    \ method of NyPizza.Builder returns NyPizza, while the one in Calzone.Builder\
    \ returns Calzone. This technique, wherein a subclass is declared to return a\
    \ subtype of the return type declared in the super-class, is known as a covariant\
    \ return typing. It allows clients to use these builders without the need for\
    \ casting.\n\nThe client for these \"hierarchical builders\" is essentially identical\
    \ to the code for the SimpleNutritionFactors builder. The example client code\
    \ should show next static inputs on enum constants for:\n\n```\nNyPizza pizza\
    \ = new NyPizza.Builder(SMALL)\n    .addTopping(SAUSAGE).addTopping(ONION).build();\n\
    Calzone calzone = new Calzone.Builder()\n    .addTopping(MUSHROOM).build();\n\
    ```\n\nA major advantage of builders over constructors is that builders can handle\
    \ multiple parameters because each parameter is specified in its own method. Alternatively,\
    \ builders can aggregate the parameters passed in multiple calls to a method into\
    \ a single field, as demonstrated in the addTopping method earlier.\n\nThe Builder\
    \ pattern is quite flexible. A single builder can be reused to build multiple\
    \ objects. The parameters of the builder can be tweaked between invocations of\
    \ the build method to vary the objects that are created. A builder can fill in\
    \ fields automatically upon object creation, such as a serial number that increases\
    \ each time an object is created.\n\nThe Builder pattern has disadvantages as\
    \ well. To create an object, you must first create its builder. The cost of creating\
    \ this builder is unlikely to be noticeable in practice, it could be a problem\
    \ in performance-critical situations. Also, the Builder pattern is more verbose\
    \ than the telescoping constructor pattern, so it should be used only if enough\
    \ parameters make it worthwhile, say four or more. But keep in mind that if you\
    \ want to add more parameters to the builder, you can start using constructors\
    \ or static factories and switch to a builder when the class evolves to the point\
    \ where the number of parameters gets out of hand, the obsolete constructors or\
    \ static factories will stick out like a sore thumb. Therefore, it is better to\
    \ start with a builder in the first place.\n\nIn summary, the Builder pattern\
    \ is a good choice when designing classes whose constructors or static factories\
    \ would have more than a handful of parameters, especially if many of the parameters\
    \ are optional or of identical type. Client code is easier to read and write with\
    \ builders than telescoping constructors, and builders are much safer than JavaBeans."
