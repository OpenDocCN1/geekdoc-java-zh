  md: "# Item 29: Favor generic types\n\nIt is generally not too difficult to parameterize\
    \ your declarations and make use of the generic types and methods provided by\
    \ the JDK. Writing your own generic types is a bit more difficult, but it's worth\
    \ the effort to learn how.\nConsider the simple (toy) stack implementation from\
    \ Item 7:\n\n```\n// Object-based collection - a prime candidate for generics\n\
