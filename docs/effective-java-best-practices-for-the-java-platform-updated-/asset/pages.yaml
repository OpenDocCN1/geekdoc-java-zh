    \ The first is more readable: the array is declared to be of type E[], clearly\
    \ indicating that it contains only E instances. It is also more concise: in a\
    \ typical generic class, you read at many points in the code; the first technique\
    \ requires a separate cast each time an array is read, while the second technique\
    \ is preferable and more commonly used in practice. It does, however, cause heap\
    \ pollution (Item 32): the runtime type of the array does not match its compile-type\
    \ (unless E happens to be Object). This makes programmers sufficiently concerned\
    \ that if they opt for the second technique, the heap pollution is harmless in\
    \ this situation.\n\nThe following program demonstrates the use of our generic\
    \ Stack class. The program prints its command line arguments in reverse order\
    \ and converted to uppercase. No explicit cast is necessary to invoke String'stoUpperCase\
    \ method on the elements popped from the stack, and the automatically generated\
    \ cast is guaranteed to succeed:\n\n```\n// Little program to exercise our generic\
    \ Stack\npublic static void main(String[] args) {\n    Stack<String> stack = new\
    \ Stack<>();\n    for (String arg : args) {\n        stack.push(arg);\n    }\n\
