  md: "The attack surface includes classes in the Java platform libraries, in third-party\
    \ libraries such as Apache Commons Collections, and in the application itself.\
    \ If you do adhere to all of the relevant best practices and succeed in writing\
    \ serializable classes that are unattackable, your application may still be vulnerable.\
    \ To quote Robert Secuard, technical manager of the CERT Coordination Center:\n\
    \nJava deserialization is a clear present danger as it is widely used both by\
    \ applications and induced by Java subsystems as RMI (Remote Method Invocation),\
    \ JMX (Java Management Extension), and deserialization of untrusted streams can\
    \ result in code execution (RCE), denial-of-service (DoS), and a range of other\
    \ exploits. Applications can be vulnerable to these attacks even if they did nothing\
    \ wrong. [Seacon17]\n\nAttackers and security researchers studied the serializable\
    \ types in the Java libraries and in commonly used third-party libraries, looking\
    \ for methods during deserialization that perform dangerous activities. Such methods\
    \ are known as gadgets. Multiple gadgets can be used in concert, to form a gadget\
    \ chain. From time to time, a gadget chain is discovered that is sufficiently\
    \ powerful to allow an attacker to execute arbitrary code on the underlying hardware,\
    \ giving only the opportunity to submit a crafted byte stream for deserialization.\
